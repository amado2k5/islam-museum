id: event/conquest-of-tunis-1535
class: event
kind: conquest
label: { ar: "استيلاء شارل الخامس على تونس ⁦(٩٤٢هـ/١٥٣٥م)⁩", en: "Charles V's conquest of Tunis (1535)", es: "La conquista de Túnez por Carlos V (1535)", fr: "La conquête de Tunis par Charles Quint (1535)", ur: "چارلس پنجم کی تیونس کی فتح (1535)", tr: "V. Charles'ın Tunus'u fethi (942 Hicri/1535 Miladi)", id: "Penaklukan Tunis oleh Charles V (942 AH/1535 M)" }
summary:
  ar: "اختار شارل الخامس تونس هدفاً لرده في شمال أفريقية، مستجيباً لاستنجاد السلطان الحفصي الحسن بن محمد ورغبةً في عزل استانبول. قاد حملة بحرية من ثلاثين ألف مقاتل إسباني وألماني ونابولي وصقلي على خمسمائة سفينة أبحر بها من برشلونة، وبعد معارك عنيفة أعاد السيطرة الإسبانية على تونس سنة ٩٤٢هـ/١٥٣٥م، إذ لم تكفِ قوة خير الدين للرد — سبعة آلاف جندي عثماني ونحو خمسة آلاف تونسي مع تخلف الأعراب عن الجهاد — فاستولى شارل على معقل حلق الواد مرسى تونس، ونصب الأسبان الحسن بن محمد حاكماً عليها، وكان مقتضى المعاهدة تسليمه بونة والمهدية لشارل، فسلّم بونة وعجز عن المهدية لبقائها في يد العثمانيين، فاشترط عليه الأسبان معاونة فرسان القديس يوحنا بطرابلس ومعاداة العثمانيين وتحمل نفقات ألفي جندي إسباني حاميةً في قلعة حلق الواد {cite:dawlat-uthmaniyya-salabi p. 220}."
  en: "Charles V chose Tunis for his riposte in North Africa, sailing from Barcelona with 30,000 men on 500 ships; in 942/1535 he retook the city and La Goulette — Khayr al-Din's 7,000 Ottomans and ~5,000 Tunisians could not hold it — and reinstalled al-Hasan b. Muhammad, bound to hand over Bône and Mahdia and to keep a 2,000-man Spanish garrison at La Goulette {cite:dawlat-uthmaniyya-salabi p. 220}."
  es: "Carlos V eligió Túnez para su contraataque en el norte de África, zarpando de Barcelona con 30.000 hombres en 500 barcos; en 942/1535 retomó la ciudad y La Goulette —los 7.000 otomanos y los ~5.000 tunecinos de Khayr al-Din no pudieron mantenerla— y reinstaló a al-Hasan b. Muhammad, obligado a entregar Bône y Mahdia y a mantener una guarnición española de 2.000 hombres en La Goulette {cite:dawlat-uthmaniyya-salabi p. 220}."
  fr: "Charles Quint choisit Tunis pour sa riposte en Afrique du Nord, naviguant depuis Barcelone avec 30 000 hommes sur 500 navires; en 942/1535, il reprit la ville et La Goulette — les 7 000 Ottomans et les quelque 5 000 Tunisiens de Khayr al-Din ne purent la tenir — et réinstalla al-Hasan b. Muhammad, contraint de livrer Bône et Mahdia et de maintenir une garnison espagnole de 2 000 hommes à La Goulette {cite:dawlat-uthmaniyya-salabi p. 220}."
  ur: "چارلس پنجم نے شمالی افریقہ میں اپنے ردعمل کے لیے تیونس کا انتخاب کیا، بارسلونا سے 500 بحری جہازوں پر 30,000 آدمیوں کے ساتھ روانہ ہوئے۔ 942/1535 میں اس نے شہر پر دوبارہ قبضہ کر لیا اور لا گولیٹ — خیرالدین کے 7,000 عثمانیوں اور ~5,000 تیونس کے باشندے اس پر قبضہ نہ کر سکے — اور الحسن بن کو دوبارہ انسٹال کیا۔ محمد، بون اور مہدیہ کے حوالے کرنے اور لا گولیٹ میں 2,000 آدمیوں پر مشتمل ہسپانوی چھاؤنی رکھنے کا پابند ہے۔ 220}۔"
  tr: "V. Charles, Hafsid Sultanı Hasan ibn Muhammed'in çağrısına yanıt olarak ve İstanbul'u izole etme isteğiyle Kuzey Afrika'daki isyanının hedefi olarak Tunus'u seçti. Barselona'dan yola çıkan beş yüz gemide otuz bin İspanyol, Alman, Napoli ve Sicilyalı savaşçıdan oluşan bir deniz seferine önderlik etti. Şiddetli savaşlardan sonra, Khair ad-Din'in kuvvetleri (yedi bin Osmanlı askeri ve yaklaşık beş bin Tunuslu, Arapların cihada katılmamasıyla) saldırıyı püskürtmek için yetersiz kaldığı için, 942 Hicri/1535 Miladi yılında Tunus üzerindeki İspanyol kontrolünü yeniden sağladı. Charles, Tunus limanı olan Halq al-Wadi kalesini ele geçirdi ve İspanyollar Hasan ibn Muhammed'i vali olarak atadı. Antlaşma, onun Bône ve Mahdia'yı Charles'a teslim etmesini şart koşuyordu. Bône'yi teslim etti, ancak Mahdia Osmanlıların elinde kaldığı için onu alamadı. İspanyollar daha sonra ondan Trablus'taki Aziz Yuhanna Şövalyelerini desteklemesini, Osmanlılara karşı çıkmasını ve Halq al-Wadi kalesinde konuşlanmış iki bin İspanyol askerinin masraflarını karşılamasını şart koştular."
  id: "Charles V memilih Tunis sebagai target pemberontakannya di Afrika Utara, menanggapi permohonan Sultan Hafsid al-Hasan ibn Muhammad dan berkeinginan untuk mengisolasi Istanbul. Ia memimpin kampanye angkatan laut yang melibatkan tiga puluh ribu pejuang Spanyol, Jerman, Napoli, dan Sisilia di atas lima ratus kapal yang berlayar dari Barcelona. Setelah pertempuran sengit, ia memulihkan kendali Spanyol atas Tunis pada tahun 942 H/1535 M, karena pasukan Khair ad-Din—tujuh ribu tentara Ottoman dan sekitar lima ribu orang Tunisia, dengan orang Arab gagal bergabung dalam jihad—tidak cukup untuk menangkis serangan tersebut. Charles merebut benteng Halq al-Wadi, pelabuhan Tunis, dan Spanyol menunjuk al-Hasan ibn Muhammad sebagai gubernurnya. Perjanjian tersebut menetapkan bahwa ia harus menyerahkan Bône dan Mahdia kepada Charles. Ia menyerahkan Bône tetapi tidak dapat merebut Mahdia karena masih berada di tangan Ottoman. Kemudian pihak Spanyol menetapkan bahwa ia harus mendukung Ksatria Santo Yohanes di Tripoli, menentang Ottoman, dan menanggung biaya dua ribu tentara Spanyol yang ditempatkan di benteng Halq al-Wadi."
