summary:
  ar: "اختار شارل الخامس تونس هدفاً لرده في شمال أفريقية، مستجيباً لاستنجاد السلطان الحفصي الحسن بن محمد ورغبةً في عزل استانبول. قاد حملة بحرية من ثلاثين ألف مقاتل إسباني وألماني ونابولي وصقلي على خمسمائة سفينة أبحر بها من برشلونة، وبعد معارك عنيفة أعاد السيطرة الإسبانية على تونس سنة ٩٤٢هـ/١٥٣٥م، إذ لم تكفِ قوة خير الدين للرد — سبعة آلاف جندي عثماني ونحو خمسة آلاف تونسي مع تخلف الأعراب عن الجهاد — فاستولى شارل على معقل حلق الواد مرسى تونس، ونصب الأسبان الحسن بن محمد حاكماً عليها، وكان مقتضى المعاهدة تسليمه بونة والمهدية لشارل، فسلّم بونة وعجز عن المهدية لبقائها في يد العثمانيين، فاشترط عليه الأسبان معاونة فرسان القديس يوحنا بطرابلس ومعاداة العثمانيين وتحمل نفقات ألفي جندي إسباني حاميةً في قلعة حلق الواد {cite:dawlat-uthmaniyya-salabi p. 220}."
  en: "Charles V chose Tunis for his riposte in North Africa, sailing from Barcelona with 30,000 men on 500 ships; in 942/1535 he retook the city and La Goulette — Khayr al-Din's 7,000 Ottomans and ~5,000 Tunisians could not hold it — and reinstalled al-Hasan b. Muhammad, bound to hand over Bône and Mahdia and to keep a 2,000-man Spanish garrison at La Goulette {cite:dawlat-uthmaniyya-salabi p. 220}."
