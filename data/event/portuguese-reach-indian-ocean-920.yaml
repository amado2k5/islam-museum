summary:
  ar: "في شذرات الذهب في حدود العشرين وتسع مئة ظهرت الفرنج البرتقال فاستطرقوا إلى بلاد الملة من بحر الظلمات من وراء جبال القمر فعاثوا في أرض الهند ووصل أذاهم وفسادهم إلى جزيرة العرب وبنادر اليمن وجدة فلما بلغ السلطان قانصوه الغوري ذلك جهز إليهم خمسين غراباً مع الأمير حسين الكردي وأرسل معه عسكراً عظيماً من الترك والمغاربة واللوند وجعل له جدة إقطاعاً وأمره بتحصينها فشرع في بناء سورها وإحكام أبراجها وهدم كثيراً من بيوت الناس مع عسف وشدة ظلم بحيث بنى السور جميعه في دون عام ثم توجه بعساكره إلى الهند فاجتمع بسلطان كجرات فأكرمه وهرب الفرنج عن البنادر لما سمعوا بوصوله {cite:shadharat-dhahab p. 531}."
  en: "Shadharat's register of the Portuguese irruption: appearing beyond the Sea of Darkness past the Mountains of the Moon, they ravaged India and reached the Arabian peninsula, the Yemeni ports and Jeddah; al-Ghawri sent fifty ghurab ships under Husayn al-Kurdi who walled Jeddah within a year and relieved Gujarat {cite:shadharat-dhahab p. 531}."
