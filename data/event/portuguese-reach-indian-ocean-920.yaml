label: { ar: "ظهور البرتقال في المحيط الهندي وبناء سور جدة", en: "The Portuguese reach the Indian Ocean; Jeddah walled", es: "Los portugueses llegan al Océano Índico; Yeda fue amurallada.", fr: "Les Portugais atteignent l'océan Indien; Djeddah est fortifiée." }
summary:
  ar: "في شذرات الذهب في حدود العشرين وتسع مئة ظهرت الفرنج البرتقال فاستطرقوا إلى بلاد الملة من بحر الظلمات من وراء جبال القمر فعاثوا في أرض الهند ووصل أذاهم وفسادهم إلى جزيرة العرب وبنادر اليمن وجدة فلما بلغ السلطان قانصوه الغوري ذلك جهز إليهم خمسين غراباً مع الأمير حسين الكردي وأرسل معه عسكراً عظيماً من الترك والمغاربة واللوند وجعل له جدة إقطاعاً وأمره بتحصينها فشرع في بناء سورها وإحكام أبراجها وهدم كثيراً من بيوت الناس مع عسف وشدة ظلم بحيث بنى السور جميعه في دون عام ثم توجه بعساكره إلى الهند فاجتمع بسلطان كجرات فأكرمه وهرب الفرنج عن البنادر لما سمعوا بوصوله {cite:shadharat-dhahab p. 531}."
  en: "Shadharat's register of the Portuguese irruption: appearing beyond the Sea of Darkness past the Mountains of the Moon, they ravaged India and reached the Arabian peninsula, the Yemeni ports and Jeddah; al-Ghawri sent fifty ghurab ships under Husayn al-Kurdi who walled Jeddah within a year and relieved Gujarat {cite:shadharat-dhahab p. 531}."
  es: "Registro de Shadharat sobre la irrupción portuguesa: apareciendo más allá del Mar de las Tinieblas, más allá de las Montañas de la Luna, asolaron la India y llegaron a la península arábiga, los puertos yemeníes y Yeda; al-Ghawri envió cincuenta barcos ghurab bajo el mando de Husayn al-Kurdi, quien amuralló Yeda en un año y liberó Gujarat {cita: shadharat-dhahab p. 531}."
  fr: "Le registre de Shadharat sur l'irruption portugaise: apparaissant au-delà de la Mer des Ténèbres, au-delà des Montagnes de la Lune, ils ravagèrent l'Inde et atteignirent la péninsule arabique, les ports yéménites et Djeddah; al-Ghawri envoya cinquante navires ghurab sous Husayn al-Kurdi qui murèrent Djeddah en moins d'un an et soulagèrent le Gujarat {cite: shadharat-dhahab p. 531}."
