label: { ar: "ظهور البرتقال في المحيط الهندي وبناء سور جدة", en: "The Portuguese reach the Indian Ocean; Jeddah walled", es: "Los portugueses llegan al Océano Índico; Yeda fue amurallada.", fr: "Les Portugais atteignent l'océan Indien; Djeddah est fortifiée.", ur: "پرتگالی بحر ہند تک پہنچ جاتے ہیں۔ جدہ کی دیوار", tr: "Hint Okyanusu'nda portakalların ortaya çıkması ve Cidde surlarının inşası", id: "Kemunculan jeruk di Samudra Hindia dan pembangunan tembok Jeddah." }
summary:
  ar: "في شذرات الذهب في حدود العشرين وتسع مئة ظهرت الفرنج البرتقال فاستطرقوا إلى بلاد الملة من بحر الظلمات من وراء جبال القمر فعاثوا في أرض الهند ووصل أذاهم وفسادهم إلى جزيرة العرب وبنادر اليمن وجدة فلما بلغ السلطان قانصوه الغوري ذلك جهز إليهم خمسين غراباً مع الأمير حسين الكردي وأرسل معه عسكراً عظيماً من الترك والمغاربة واللوند وجعل له جدة إقطاعاً وأمره بتحصينها فشرع في بناء سورها وإحكام أبراجها وهدم كثيراً من بيوت الناس مع عسف وشدة ظلم بحيث بنى السور جميعه في دون عام ثم توجه بعساكره إلى الهند فاجتمع بسلطان كجرات فأكرمه وهرب الفرنج عن البنادر لما سمعوا بوصوله {cite:shadharat-dhahab p. 531}."
  en: "Shadharat's register of the Portuguese irruption: appearing beyond the Sea of Darkness past the Mountains of the Moon, they ravaged India and reached the Arabian peninsula, the Yemeni ports and Jeddah; al-Ghawri sent fifty ghurab ships under Husayn al-Kurdi who walled Jeddah within a year and relieved Gujarat {cite:shadharat-dhahab p. 531}."
  es: "Registro de Shadharat sobre la irrupción portuguesa: apareciendo más allá del Mar de las Tinieblas, más allá de las Montañas de la Luna, asolaron la India y llegaron a la península arábiga, los puertos yemeníes y Yeda; al-Ghawri envió cincuenta barcos ghurab bajo el mando de Husayn al-Kurdi, quien amuralló Yeda en un año y liberó Gujarat {cita: shadharat-dhahab p. 531}."
  fr: "Le registre de Shadharat sur l'irruption portugaise: apparaissant au-delà de la Mer des Ténèbres, au-delà des Montagnes de la Lune, ils ravagèrent l'Inde et atteignirent la péninsule arabique, les ports yéménites et Djeddah; al-Ghawri envoya cinquante navires ghurab sous Husayn al-Kurdi qui murèrent Djeddah en moins d'un an et soulagèrent le Gujarat {cite: shadharat-dhahab p. 531}."
  ur: "پرتگالیوں کے تصادم کا شدہارت کا رجسٹر: چاند کے پہاڑوں سے گزرتے ہوئے تاریکی کے سمندر سے پرے ظاہر ہوتے ہوئے، انہوں نے ہندوستان کو تباہ کیا اور جزیرہ نما عرب، یمنی بندرگاہوں اور جدہ تک پہنچ گئے۔ الغاوری نے حسین الکردی کے ماتحت پچاس غربی بحری جہاز بھیجے جنہوں نے ایک سال کے اندر اندر جدہ کو گھیر لیا اور گجرات سے نجات دلائی۔ 531}۔"
  tr: "Şadharat el-Dhahab'da, yaklaşık 920 yılında, Franklar, yani Portakallar ortaya çıktı ve Karanlık Denizi'nden, Ay Dağları'nın ötesinden millet topraklarına girdiler. Hindistan topraklarında büyük yıkıma yol açtılar ve zararları ve tahribatları Arap Yarımadası'na, Yemen limanlarına ve Cidde'ye kadar ulaştı. Sultan Kansuh el-Gavri bunu öğrenince, Prens Hüseyin el-Kurdi ile birlikte elli karga gönderdi ve onunla birlikte büyük bir Türk, Mağribi ve Lund ordusu gönderdi. Cidde'yi onun için bir tımar haline getirdi ve surlarını güçlendirmesini emretti. Böylece surlarını inşa etmeye ve kulelerini güçlendirmeye başladı ve halkın evlerinin çoğunu zulüm ve ağır adaletsizlikle yıktı, böylece tüm surları bir yıldan kısa sürede inşa etti. Daha sonra ordularıyla Hindistan'a gitti ve Gujarat Sultanı ile görüştü; Sultan onu onurlandırdı ve Franklar onun gelişini duyunca limanlardan kaçtılar. {cite:shadharat-dhahab s. 531}"
  id: "Pada masa Shadharat al-Dhahab, sekitar tahun 920, bangsa Frank, yang dikenal sebagai bangsa Jeruk, muncul dan menyeberangi wilayah bangsa ini dari Laut Kegelapan, di balik Pegunungan Bulan. Mereka mendatangkan malapetaka di tanah India, dan kerusakan serta kejahatan mereka mencapai Semenanjung Arab, pelabuhan Yaman, dan Jeddah. Ketika Sultan Qansuh al-Ghawri mengetahui hal ini, ia mengirimkan lima puluh burung gagak untuk melawan mereka bersama Pangeran Hussein al-Kurdi, dan mengirimkan bersamanya pasukan besar yang terdiri dari orang-orang Turki, Maghreb, dan Lund. Ia menjadikan Jeddah sebagai wilayah kekuasaan Pangeran Hussein dan memerintahkannya untuk membentenginya. Maka Pangeran Hussein mulai membangun tembok dan memperkuat menara-menaranya, dan ia menghancurkan banyak rumah penduduk dengan penindasan dan ketidakadilan yang parah, sehingga ia membangun seluruh tembok dalam waktu kurang dari setahun. Kemudian ia berangkat bersama pasukannya ke India dan bertemu dengan Sultan Gujarat, yang menghormatinya, dan orang-orang Frank melarikan diri dari pelabuhan ketika mereka mendengar tentang kedatangannya. {cite:shadharat-dhahab p. 531}."
