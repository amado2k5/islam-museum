id: event/al-rashid-deposed-530
class: event
kind: other
label: { ar: "خلع الخليفة الراشد وبيعة المقتفي سنة 530", en: "The deposition of the caliph al-Rashid and the bay'a to al-Muqtafi, 530", es: "La deposición del califa al-Rashid y la bay'a a al-Muqtafi, 530", fr: "La déposition du calife al-Rashid et la bay'a à al-Muqtafi, 530", ur: "خلیفہ الرشید کی معزولی اور بیع المقطفی، 530", tr: "Raşidun halifesi görevden alındı ve 530 yılında Muktafi'ye biat yemini edildi.", id: "Khalifah Rasyidin digulingkan dan al-Muqtafi diikrarkan sumpah setia pada tahun 530." }
summary:
  ar: "في سنة ثلاثين وخمسمائة حصل بين السلطان مسعود وبين الخليفة الراشد بالله خلاف فجُمعت العساكر وذهب الخليفة إلى الموصل، ودخل السلطان مسعود بغداد واحتوى على دار الخلافة وأخرج خط والد الخليفة المسترشد أنه من خرج من بغداد لقتال السلطان فقد خلع نفسه من الخلافة، فأفتى من أفتى من الفقهاء بخلعه فخُلع يوم الاثنين سادس عشر ذي القعدة بحكم الحاكم وفتيا الفقهاء، واستُدعي بعمه المقتفي لأمر الله فبُويع له بالخلافة {cite:shadharat-dhahab p. 574}."
  en: "In 530 conflict broke out between Sultan Mas'ud and caliph al-Rashid bi'llah; armies were mustered, the caliph left for Mosul, and Mas'ud entered Baghdad, seized the palace, and produced al-Mustarshid's letter — whoever leaves Baghdad to fight the Sultan has deposed himself — so the jurists who were asked ruled for deposition, and he was deposed on Monday 16 Dhu al-Qa'da by the hakim's ruling and the fuqaha's fatwa, while his uncle al-Muqtafi was summoned and given the caliphate's bay'a {cite:shadharat-dhahab p. 574}."
  es: "En 530 estalló un conflicto entre el sultán Mas'ud y el califa al-Rashid bi'llah; se reunieron ejércitos, el califa partió hacia Mosul, y Mas'ud entró en Bagdad, se apoderó del palacio y presentó la carta de al-Mustarshid: quien abandona Bagdad para luchar contra el sultán se ha depuesto a sí mismo; por lo tanto, los juristas consultados dictaminaron a favor de la deposición, y fue depuesto el lunes 16 de Dhu al-Qa'da por el dictamen del hakim y la fatwa del fuqaha, mientras que su tío al-Muqtafi fue convocado y se le otorgó el bay'a del califato {cite:shadharat-dhahab p. 574}."
  fr: "En 530, un conflit éclata entre le sultan Mas'ud et le calife al-Rashid bi'llah; les armées furent rassemblées, le calife partit pour Mossoul, et Mas'ud entra à Bagdad, s'empara du palais et produisit la lettre d'al-Mustarshid — quiconque quitte Bagdad pour combattre le sultan se dépose — les juristes consultés prononcent donc la déposition, et il fut déposé le lundi 16 Dhu al-Qa'da par la décision du hakim et la fatwa du fuqaha, tandis que son oncle al-Muqtafi fut convoqué et reçut la bay'a du califat {cite:shadharat-dhahab p. 574}."
  ur: "530 میں سلطان مسعود اور خلیفہ الرشید باللہ کے درمیان تنازعہ چھڑ گیا۔ فوجیں جمع کی گئیں، خلیفہ موصل کی طرف روانہ ہوا، اور مسعود بغداد میں داخل ہوا، محل پر قبضہ کیا، اور المسترشد کا خط پیش کیا - جو بھی سلطان سے لڑنے کے لیے بغداد سے نکلا، اس نے خود کو معزول کر دیا - چنانچہ جن فقہاء کو معزولی کا حکم دیا گیا، انھوں نے اسے معزول کر دیا، اور پیر 16 ذوالحجہ کو معزول کر دیا گیا۔ فقہا کا فتویٰ جبکہ ان کے چچا المقتفی کو بلوایا گیا اور انہیں خلافت کی بیعت دی گئی۔ 574}۔"
  tr: "530 yılında Sultan Mesud ile Halife Raşid Billa arasında bir anlaşmazlık çıktı. Ordular toplandı ve Halife Musul'a gitti. Sultan Mesud Bağdat'a girdi ve Halifelik Sarayı'nın kontrolünü ele geçirdi. Halife Müstarşid'in babasından, Sultan'la savaşmak için Bağdat'tan ayrılan herkesin Halifeliği reddettiğini belirten bir mektup çıkardı. Bazı hukukçular onu azletme fetvası verdiler ve Hakimin kararı ve hukukçuların fetvasıyla Zilhicce ayının 16. Pazartesi günü azledildi. Amcası Muktefi li-Amr Allah çağrıldı ve ona Halife olarak biat yemini ettirildi. {kaynak: Şadharat-dhahab s. 574}"
  id: "Pada tahun 530, terjadi perselisihan antara Sultan Masoud dan Khalifah Al-Rashid Billah. Pasukan dikumpulkan, dan Khalifah pergi ke Mosul. Sultan Masoud memasuki Baghdad dan mengambil alih Istana Kekhalifahan. Ia menunjukkan surat dari ayah Khalifah Al-Mustarshid yang menyatakan bahwa siapa pun yang meninggalkan Baghdad untuk melawan Sultan telah melepaskan kekhalifahan. Beberapa ahli hukum mengeluarkan fatwa yang menyatakan dia dicopot, dan dia dicopot pada hari Senin, tanggal 16 Dzul Qa'dah, berdasarkan keputusan hakim dan fatwa para ahli hukum. Pamannya, Al-Muqtafi li-Amr Allah, dipanggil, dan dia disumpah setia sebagai Khalifah. {cite:shadharat-dhahab hlm. 574}"
