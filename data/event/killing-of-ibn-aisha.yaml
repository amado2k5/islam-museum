label: { ar: "قتل ابن عائشة", en: "The killing of Ibn Aisha" }
summary:
  ar: "في سنة عشر ومائتين ظفر المأمون بابن عائشة ورفقائه {cite:tabari-tarikh-abu-al-fadl j.8 p.602}، ثم قتل ابن عائشة وصلبه {cite:tabari-tarikh-abu-al-fadl j.8 p.603}. وعند المسعودي ركب المأمون إلى المطبق بالليل حتى قتل ابن عائشة وهو أول عباسي صلب في الإسلام وقتل معه محمد بن إبراهيم الأفريقي وتمثل المأمون حين قتله إذا النار في أحجارها مستكنة متى ما يهجها قادح تتضرم {cite:muruj-al-dhahab p. 428}"
  en: "In the year 210 al-Ma'mun gained the upper hand over Ibn Aisha and his companions {cite:tabari-tarikh-abu-al-fadl j.8 p.602}; then he killed Ibn Aisha and crucified him {cite:tabari-tarikh-abu-al-fadl j.8 p.603}. According to al-Mas'udi, al-Ma'mun rode by night to the Mutabbaq prison until he killed Ibn Aisha; he was the first Abbasid to be crucified in Islam, and Muhammad ibn Ibrahim al-Afriqi was killed with him. When he killed him, al-Ma'mun recited the verse: 'The fire lies hidden in its stones; whenever a striker strikes it, it blazes' {cite:muruj-al-dhahab p. 428}."
