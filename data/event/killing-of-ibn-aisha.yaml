label: { ar: "قتل ابن عائشة", en: "The killing of Ibn Aisha", es: "El asesinato de Ibn Aisha", fr: "Le meurtre d'Ibn Aïcha", ur: "ابن عائشہ کا قتل" }
summary:
  ar: "في سنة عشر ومائتين ظفر المأمون بابن عائشة ورفقائه {cite:tabari-tarikh-abu-al-fadl j.8 p.602}، ثم قتل ابن عائشة وصلبه {cite:tabari-tarikh-abu-al-fadl j.8 p.603}. وعند المسعودي ركب المأمون إلى المطبق بالليل حتى قتل ابن عائشة وهو أول عباسي صلب في الإسلام وقتل معه محمد بن إبراهيم الأفريقي وتمثل المأمون حين قتله إذا النار في أحجارها مستكنة متى ما يهجها قادح تتضرم {cite:muruj-al-dhahab p. 428}"
  en: "In the year 210 al-Ma'mun gained the upper hand over Ibn Aisha and his companions {cite:tabari-tarikh-abu-al-fadl j.8 p.602}; then he killed Ibn Aisha and crucified him {cite:tabari-tarikh-abu-al-fadl j.8 p.603}. According to al-Mas'udi, al-Ma'mun rode by night to the Mutabbaq prison until he killed Ibn Aisha; he was the first Abbasid to be crucified in Islam, and Muhammad ibn Ibrahim al-Afriqi was killed with him. When he killed him, al-Ma'mun recited the verse: 'The fire lies hidden in its stones; whenever a striker strikes it, it blazes' {cite:muruj-al-dhahab p. 428}."
  es: "En el año 210, al-Ma'mun venció a Ibn Aisha y sus compañeros {cite:tabari-tarikh-abu-al-fadl j.8 p.602}; luego mató a Ibn Aisha y lo crucificó {cite:tabari-tarikh-abu-al-fadl j.8 p.603}. Según al-Mas'udi, al-Ma'mun cabalgó de noche hasta la prisión de Mutabbaq, donde mató a Ibn Aisha; fue el primer abasí crucificado en el Islam, y Muhammad ibn Ibrahim al-Afriqi murió con él. Al matarlo, al-Ma'mun recitó el versículo: «El fuego yace oculto en sus piedras; cuando alguien lo golpea, arde» {cite:muruj-al-dhahab p. 428}."
  fr: "En 210, al-Ma'mun prit l'ascendant sur Ibn Aïcha et ses compagnons (voir Tabari-tarikh-abu-al-fadl, vol. 8, p. 602); il fit ensuite tuer Ibn Aïcha et le crucifia (voir Tabari-tarikh-abu-al-fadl, vol. 8, p. 603). Selon al-Mas'udi, al-Ma'mun se rendit de nuit à la prison de Mutabbaq où il tua Ibn Aïcha. Il fut le premier Abbasside à être crucifié en islam, et Muhammad ibn Ibrahim al-Afriqi périt avec lui. Après l'avoir exécuté, al-Ma'mun récita le verset: « Le feu est caché dans ses pierres; lorsqu'on le frappe, il s'embrase » (voir Muruj-al-dhahab, p. 428)."
  ur: "سنہ 210 میں مامون نے ابن عائشہ اور ان کے ساتھیوں پر غلبہ حاصل کر لیا {حوالہ: طبری تاریخ ابو الفضل ج8 ص 602} پھر اس نے ابن عائشہ کو قتل کر دیا اور انہیں سولی پر چڑھایا۔ المسعودی کے مطابق، المامون رات کو مطبق جیل میں چلا گیا یہاں تک کہ اس نے ابن عائشہ کو قتل کر دیا۔ وہ اسلام میں مصلوب ہونے والے پہلے عباسی تھے، اور محمد بن ابراہیم العفریقی بھی ان کے ساتھ مارے گئے تھے۔ جب اس نے اسے قتل کیا تو مامون نے یہ آیت پڑھی: 'آگ اپنے پتھروں میں چھپی ہوئی ہے۔ جب بھی کوئی حملہ آور اسے مارتا ہے تو وہ بھڑک اٹھتا ہے۔ 428}۔"
