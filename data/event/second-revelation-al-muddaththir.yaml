summary:
  ar: "بعد فترة الوحي سمع النبي صوتاً من السماء فرأى الملك الذي جاءه بحراء قاعداً على كرسي بين السماء والأرض، فرجع إلى أهله يطلب أن يُدثَّر، فأنزل الله أوائل سورة المدثر بأمر القيام والإنذار، ثم حمي الوحي وتتابع؛ ويقرأ المؤلف في أوامرها مواد الدعوة."
  en: "After the pause in revelation the Prophet heard a voice from heaven and saw the angel who had come to him at Hira seated on a throne between heaven and earth; he returned home asking to be wrapped, and God sent down the opening of surat al-Muddaththir with the command to rise and warn, after which revelation came thick and fast; the author reads in its commands the substance of the call."
