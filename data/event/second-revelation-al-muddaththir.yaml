id: event/second-revelation-al-muddaththir
class: event
kind: revelation
label: { ar: "نزول جبريل بالوحي مرة ثانية: أوائل المدثر", en: "The second descent of Jibril: the opening of surat al-Muddaththir", es: "El segundo descenso de Jibril: la apertura de la sura al-Muddaththir", fr: "La seconde descente de Jibril: l'ouverture de la sourate al-Muddaththir", ur: "جبریل کا دوسرا نزول: سورۃ المدثر کا آغاز" }
summary:
  ar: "بعد فترة الوحي سمع النبي صوتاً من السماء فرأى الملك الذي جاءه بحراء قاعداً على كرسي بين السماء والأرض، فرجع إلى أهله يطلب أن يُدثَّر، فأنزل الله أوائل سورة المدثر بأمر القيام والإنذار، ثم حمي الوحي وتتابع؛ ويقرأ المؤلف في أوامرها مواد الدعوة."
  en: "After the pause in revelation the Prophet heard a voice from heaven and saw the angel who had come to him at Hira seated on a throne between heaven and earth; he returned home asking to be wrapped, and God sent down the opening of surat al-Muddaththir with the command to rise and warn, after which revelation came thick and fast; the author reads in its commands the substance of the call."
  es: "Tras la pausa en la revelación, el Profeta oyó una voz del cielo y vio al ángel que había venido a él en Hira sentado en un trono entre el cielo y la tierra; regresó a casa pidiendo ser envuelto, y Dios envió el comienzo de la sura al-Muddaththir con la orden de levantarse y advertir, tras lo cual la revelación llegó de forma rápida y abundante; el autor lee en sus mandamientos la esencia del llamado."
  fr: "Après une interruption dans la révélation, le Prophète entendit une voix venue du ciel et vit l'ange qui lui était apparu à Hira assis sur un trône entre ciel et terre; il rentra chez lui en demandant à être enveloppé, et Dieu fit descendre le début de la sourate al-Muddaththir avec l'ordre de se lever et d'avertir, après quoi la révélation se fit abondante et rapide; l'auteur perçoit dans ses commandements la substance de l'appel."
  ur: "وحی کے توقف کے بعد نبی نے آسمان سے ایک آواز سنی اور اس فرشتے کو دیکھا جو حیرہ میں ان کے پاس آیا تھا آسمان اور زمین کے درمیان ایک تخت پر بیٹھا ہوا تھا۔ وہ لپیٹنے کا کہہ کر گھر واپس آیا، اور اللہ تعالیٰ نے سورۃ المدثر کے آغاز کو اٹھنے اور تنبیہ کرنے کے حکم کے ساتھ نازل کیا، جس کے بعد تیزی سے وحی نازل ہوئی۔ مصنف اپنے حکموں میں کال کا مادہ پڑھتا ہے۔"
