  ur: "1967 میں صنعا کے ستر روزہ محاصرے کے لیے ڈرافٹ کارڈ، شمالی یمن کی خانہ جنگی میں دارالحکومت کی شاہی سرمایہ کاری؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, Yemen iç savaşı sırasında kraliyet güçlerinin başkent Sana'a'ya düzenlediği kuşatmanın 1967 yılına dair ön bir anlatımını içermektedir; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Gambaran awal tentang pengepungan Sana'a tahun 1967, pengepungan ibu kota oleh kaum royalis selama perang saudara Yaman; sumber-sumbernya belum ditinjau di halaman ini."
