label:
  ar: "مسلم بن الحجاج يسمع أحمد بن حنبل ويسائل مسائله، نحو ٢٢٠هـ"
  en: "Muslim ibn al-Hajjaj hears Ahmad ibn Hanbal and gathers his Questions, c. 220/835"
  ur: "مسلم بن حجاج کا احمد بن حنبل سے سماع اور ان کے مسائل کی تدوین، تقریباً 220ھ/835ء"
summary:
  ar: "سمع مسلم بن الحجاج أحمد بن حنبل (ت ٢٤١هـ) في دخولاته بغداد وروى عنه، وصنّف له «مسائل أحمد بن حنبل» {cite:tazkirat-al-huffaz j.2 p. 527-528}، وعدّته دائرة المعارف الإسلامية فيمن بقيت آثارهم المخطوطة مطبوعة من مشايخه {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  en: "On his entries into Baghdad Muslim ibn al-Hajjaj heard Ahmad ibn Hanbal (d. 241/855) and transmitted from him, and compiled a book of his own questions to Ahmad, the Masa'il Ahmad ibn Hanbal {cite:tazkirat-al-huffaz j.2 p. 527-528}; the Encyclopaedia of Islam counts Ahmad among Muslim's masters whose works have survived into print {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  ur: "بغداد کے سفروں میں مسلم بن حجاج نے احمد بن حنبل (وفات 241ھ/855ء) سے سماع کیا اور ان سے روایت کیا، اور اپنے سوالات کو «مسائل احمد بن حنبل» کی صورت میں مرتب کیا {cite:tazkirat-al-huffaz j.2 p. 527-528}؛ دائرۃ المعارفِ اسلام نے احمد کو مسلم کے ان مشائخ میں شمار کیا جن کی کتابیں چھپ کر بچ گئیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}۔"
