class: event
kind: other
label:
  ar: "مسلم بن الحجاج يسمع أحمد بن حنبل ويسائل مسائله، نحو ٢٢٠هـ"
  en: "Muslim ibn al-Hajjaj hears Ahmad ibn Hanbal and gathers his Questions, c. 220/835"
  ur: "مسلم بن حجاج کا احمد بن حنبل سے سماع اور ان کے مسائل کی تدوین، تقریباً 220ھ/835ء"
  es: "Muslim ibn al-Hajjaj escucha a Ahmad ibn Hanbal y recopila sus Preguntas, c. 220/835"
  fr: "Muslim ibn al-Hajjaj écoute Ahmad ibn Hanbal et rassemble ses questions, vers 220/835"
  tr: "Müslim ibn el-Haccac, Hicri 220 civarında Ahmed ibn Hanbel'i dinledi ve ona sorular sordu."
  id: "Muslim ibn al-Hajjaj mendengarkan Ahmad ibn Hanbal dan mengajukan pertanyaan kepadanya, sekitar tahun 220 Hijriah."
summary:
  ar: "سمع مسلم بن الحجاج أحمد بن حنبل ⁦(ت ٢٤١هـ)⁩ في دخولاته بغداد وروى عنه، وصنّف له «مسائل أحمد بن حنبل» {cite:tazkirat-al-huffaz j.2 p. 527-528}، وعدّته دائرة المعارف الإسلامية فيمن بقيت آثارهم المخطوطة مطبوعة من مشايخه {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  en: "On his entries into Baghdad Muslim ibn al-Hajjaj heard Ahmad ibn Hanbal (d. 241/855) and transmitted from him, and compiled a book of his own questions to Ahmad, the Masa'il Ahmad ibn Hanbal {cite:tazkirat-al-huffaz j.2 p. 527-528}; the Encyclopaedia of Islam counts Ahmad among Muslim's masters whose works have survived into print {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  ur: "بغداد کے سفروں میں مسلم بن حجاج نے احمد بن حنبل ⁦(وفات 241ھ/855ء)⁩ سے سماع کیا اور ان سے روایت کیا، اور اپنے سوالات کو «مسائل احمد بن حنبل» کی صورت میں مرتب کیا {cite:tazkirat-al-huffaz j.2 p. 527-528}؛ دائرۃ المعارفِ اسلام نے احمد کو مسلم کے ان مشائخ میں شمار کیا جن کی کتابیں چھپ کر بچ گئیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}۔"
  es: "En sus entradas a Bagdad, Muslim ibn al-Hajjaj escuchó a Ahmad ibn Hanbal (m. 241/855) y transmitió de él, y compiló un libro de sus propias preguntas a Ahmad, el Masa'il Ahmad ibn Hanbal {cite:tazkirat-al-huffaz j.2 p. 527-528}; la Enciclopedia del Islam cuenta a Ahmad entre los maestros de Muslim cuyas obras han sobrevivido impresas {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  fr: "À son arrivée à Bagdad, Muslim ibn al-Hajjaj entendit Ahmad ibn Hanbal (mort en 241/855) et lui transmit des enseignements. Il compila ensuite un recueil de ses propres questions à Ahmad, le Masa'il Ahmad ibn Hanbal {cite:tazkirat-al-huffaz j.2 p. 527-528}. L'Encyclopédie de l'Islam compte Ahmad parmi les maîtres de Muslim dont les œuvres ont été conservées sous forme imprimée {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  tr: "Müslim ibn el-Haccac, Bağdat ziyaretleri sırasında Ahmed ibn Hanbel'i (ö. 241 Hicri) dinlemiş ve ondan rivayet etmiş, ayrıca onun için \"Ahmed ibn Hanbel'in Soruları\"nı derlemiştir {kaynak: tazkirat-al-huffaz cilt 2, s. 527-528} ve İslam Ansiklopedisi onu, şeyhlerinden basılı olarak günümüze ulaşan el yazması eserleri olanlar arasında saymıştır {kaynak: encyclopaedia-of-islam-2 cilt 7, s. 690-691}."
  id: "Muslim ibn al-Hajjaj mendengar Ahmad ibn Hanbal (wafat 241 H) saat berkunjung ke Baghdad dan meriwayatkan darinya, lalu ia menyusun untuknya “Pertanyaan-pertanyaan Ahmad ibn Hanbal” {cite:tazkirat-al-huffaz j.2 hlm. 527-528}, dan Ensiklopedia Islam memasukkannya ke dalam daftar orang-orang yang manuskrip karyanya masih dicetak dari para syekhnya {cite:encyclopaedia-of-islam-2 vol. 7 hlm. 690-691}."
