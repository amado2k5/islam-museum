label: { ar: "قتل عمرو بن هند مضرط الحجارة" }
summary:
  ar: "قتل عمرو بن كلثوم التغلبي عمرَو بنَ هند صاحبَ الحيرة الملقب مضرط الحجارة؛ قال ابن هند لجلسائه هل تعلمون أحداً من العرب يأنف أن تخدم أمه أمي فقيل له عمرو بن كلثوم وأمه ليلى بنت مهلهل، فاستزار ابنَ كلثوم وأمر أن تزور أمه ليلى أمَه هنداً، ثم مكر بها فقالت هند لليلى ناوليني هذا الطبق فقالت لتقم صاحبة الحاجة إلى حاجتها، فألحت فنادت ليلى «واذلاه يا آل تغلب» فسمعها ابنها وثار إلى سيف ابن هند المعلق في السرادق فضرب به رأسه فقتله وانتهبت تغلب ماله وخيله {cite:kamil-ibn-al-athir p. 409}."
  en: "Amr ibn Kulthum's killing of Amr ibn Hind 'Mudarrat al-Hijara', king of al-Hira: seeking a man whose mother would scorn to serve his own, the king contrived that Hind should order Layla bint Muhalhil to pass her a dish; Layla's cry 'wa-dhalah, O Taghlib!' reached her son, who seized the king's own hanging sword and struck off his head {cite:kamil-ibn-al-athir p. 409}."
