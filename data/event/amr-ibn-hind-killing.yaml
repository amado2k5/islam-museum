label: { ar: "قتل عمرو بن هند مضرط الحجارة", en: "The killing of Amr ibn Hind, called Mudarrit al-Hijara", es: "El asesinato de Amr ibn Hind, llamado Mudarrit al-Hijara", fr: "Le meurtre d'Amr ibn Hind, appelé Mudarrit al-Hijara", ur: "عمرو بن ہند کا قتل جسے مدثر الحجرہ کہتے ہیں۔", tr: "Amr ibn Hind taş atanı öldürdü.", id: "Amr ibn Hind membunuh pelempar batu itu." }
summary:
  ar: "قتل عمرو بن كلثوم التغلبي عمرَو بنَ هند صاحبَ الحيرة الملقب مضرط الحجارة؛ قال ابن هند لجلسائه هل تعلمون أحداً من العرب يأنف أن تخدم أمه أمي فقيل له عمرو بن كلثوم وأمه ليلى بنت مهلهل، فاستزار ابنَ كلثوم وأمر أن تزور أمه ليلى أمَه هنداً، ثم مكر بها فقالت هند لليلى ناوليني هذا الطبق فقالت لتقم صاحبة الحاجة إلى حاجتها، فألحت فنادت ليلى «واذلاه يا آل تغلب» فسمعها ابنها وثار إلى سيف ابن هند المعلق في السرادق فضرب به رأسه فقتله وانتهبت تغلب ماله وخيله {cite:kamil-ibn-al-athir p. 409}."
  en: "Amr ibn Kulthum's killing of Amr ibn Hind 'Mudarrat al-Hijara', king of al-Hira: seeking a man whose mother would scorn to serve his own, the king contrived that Hind should order Layla bint Muhalhil to pass her a dish; Layla's cry 'wa-dhalah, O Taghlib!' reached her son, who seized the king's own hanging sword and struck off his head {cite:kamil-ibn-al-athir p. 409}."
  es: "El asesinato de Amr ibn Hind 'Mudarrat al-Hijara', rey de al-Hira, por parte de Amr ibn Kulthum: buscando un hombre cuya madre despreciara servir a los suyos, el rey ideó un plan para que Hind ordenara a Layla bint Muhalhil que le pasara un plato; el grito de Layla '¡wa-dhalah, oh Taghlib!' llegó a su hijo, quien tomó la espada que colgaba del propio rey y le cortó la cabeza {cite:kamil-ibn-al-athir p. 409}."
  fr: "Amr ibn Kulthum tue Amr ibn Hind 'Mudarrat al-Hijara', roi d'al-Hira: cherchant un homme dont la mère refuserait de servir les siens, le roi fit en sorte que Hind ordonne à Layla bint Muhalhil de lui passer un plat; le cri de Layla 'wa-dhalah, O Taghlib !' parvint à son fils, qui s'empara de l'épée suspendue du roi et lui trancha la tête {cite:kamil-ibn-al-athir p. 409}."
  ur: "عمرو بن کلثوم کا عمرو بن ہند 'مدرت الحجرہ'، الحیرہ کے بادشاہ کا قتل: ایک ایسے شخص کی تلاش میں جس کی ماں اپنی خدمت کے لیے حقیر ہو، بادشاہ نے یہ سوچا کہ ہند لیلیٰ بنت محلل کو حکم دے کہ وہ اسے ایک برتن دے دے؛ لیلیٰ کی پکار 'و الذلہ، اے تغلب!' اس کے بیٹے کے پاس پہنچا، جس نے بادشاہ کی اپنی لٹکتی تلوار پکڑی اور اس کا سر قلم کر دیا۔ 409}۔"
  tr: "Amr ibn Kulthum al-Taghlibi, Hira hükümdarı ve Mudharrat al-Hijara lakaplı Amr ibn Hind'i öldürdü. İbn Hind arkadaşlarına, \"Araplar arasında annesinin benim anneme hizmet etmesini hor gören birini tanıyor musunuz?\" diye sordu. Onlar da, \"Amr ibn Kulthum ve annesi Leyla bint Muhalhil\" dediler. Bunun üzerine İbn Kulthum, annesi Leyla'yı annesi Hind'i ziyaret etmeye davet etti. Sonra onu kandırdı ve Hind, Leyla'ya, \"Şu tabağı bana ver\" dedi. Leyla, \"İhtiyacı olan kendisi alsın\" dedi. Israr edince Leyla, \"Ah, Taghlib halkının rezilliği!\" diye bağırdı. Oğlu bunu duyunca çadırda asılı olan İbn Hind'in kılıcına koştu ve başına vurarak onu öldürdü. Taghlib daha sonra onun mal varlığını ve atlarını yağmaladı. {cite:kamil-ibn-al-athir s. 409}"
  id: "Amr ibn Kulthum al-Taghlibi membunuh Amr ibn Hind, penguasa Hira, yang dijuluki Mudharrat al-Hijara. Ibn Hind berkata kepada para sahabatnya, “Apakah kalian mengenal seseorang di antara orang Arab yang akan menghina ibunya dengan melayani ibuku?” Mereka menjawab, “Amr ibn Kulthum dan ibunya Layla bint Muhalhil.” Maka Ibn Kulthum mengundang ibunya Layla untuk mengunjungi ibunya Hind. Kemudian ia menipunya, dan Hind berkata kepada Layla, “Berikan aku hidangan ini.” Ia berkata, “Biarlah orang yang membutuhkannya mengambilnya sendiri.” Ia bersikeras, sehingga Layla berteriak, “Oh, penghinaan bagi kaum Taghlib!” Putranya mendengar teriakannya dan bergegas ke pedang Ibn Hind yang tergantung di tenda dan memukul kepalanya dengan pedang itu, membunuhnya. Taghlib kemudian menjarah harta dan kudanya. {cite:kamil-ibn-al-athir p. 409}"
