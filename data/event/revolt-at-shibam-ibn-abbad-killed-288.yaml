id: event/revolt-at-shibam-ibn-abbad-killed-288
class: event
kind: revolt
label:
  ar: ثورة المخالفين بشبام ومقتل ابن عباد سنة 288هـ
  en: The opponents' rising at Shibam and the killing of Ibn Abbad, 288 AH
  ur: شبام میں مخالفین کا خروج اور ابن عباد کا قتل، 288ھ
summary:
  ar: خرج على الهادي رجل من ولد أبي الخير بن يعفر وصعصعة بن جعفر وحالفاه قرب بيت ذخار، فدخل المخالفون شبام وقتلوا ابن عباد في جمادى الآخرة سنة 288هـ، ثم نزل الهادي فطردهم ودفن ابن عباد.
  en: A man of the line of Abu al-Khayr ibn Ya'fur and Sa'sa'a ibn Ja'far allied against al-Hadi near Bayt Dhukhar; the opponents entered Shibam and killed Ibn Abbad in Jumada II 288 AH, and al-Hadi came down, drove them off and buried him.
  ur: ابو الخیر بن یعفر کی نسل کے ایک شخص اور صعصعہ بن جعفر نے بیت ذخار کے قریب ہادی کے خلاف عہد باندھا؛ مخالفین شبام میں داخل ہوئے اور جمادی الآخرہ 288ھ میں ابن عباد کو قتل کیا، پھر ہادی اترے، انہیں بھگایا اور ابن عباد کو دفن کیا۔
