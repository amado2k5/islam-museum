label:
  ar: "الشيرازي يكتب «المهذب»، ٤٥٥-٤٦٩هـ"
  en: "Al-Shirazi writes al-Muhadhdhab, 455-469/1063-1077"
  ur: "شیرازی کی تصنیف «المھذب»، 455-469ھ/1063-1077ء"
summary:
  ar: "بين سنة ٤٥٥هـ وسنة ٤٦٩هـ كتب الشيرازي موسوعته الفقهية «المهذب في فقه الإمام الشافعي»، وقد غدا — مع «التنبيه» — من خمسة كتب مرجعية في المذهب الشافعي وعليه جهاز نقدي واسع منه «المجموع شرح المهذب» للنووي في ثمانية عشر مجلداً؛ وبه تحوّل المناظر اللامع إلى مجتهد حقيقي يقرر مذهبه بنفسه {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  en: "Between 455/1063 and 469/1077 al-Shirazi wrote his great fiqh compendium al-Muhadhdhab fi fiqh al-imam al-Shafi'i which — with al-Tanbih — became one of the five reference works of the Shafi'i school and drew a vast critical apparatus, among it al-Nawawi's eighteen-volume al-Majmu' sharh al-Muhadhdhab; in it the brilliant controversialist gave way to a genuine mujtahid establishing his own doctrine {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  ur: "455ھ/1063ء سے 469ھ/1077ء کے درمیان شیرازی نے اپنا بڑا فقہی ذخیرہ «المھذب فی فقہ الامام الشافعی» لکھا جو — «التنبیہ» کے ساتھ — شافعی مذہب کی پانچ مرجع کتب میں شمار ہوتا ہے اور جس پر وسیع شرحی ادبیات لکھی گئیں جن میں نووی کی اٹھارہ جلدوں پر مشتمل «المجموع شرح المھذب» بھی ہے؛ اس میں درخشاں مناظر سے ایک حقیقی مجتہد کی صورت ابھری {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}۔"
