id: event/al-hadi-says-the-carefree-sleep-and-sends-a-traveller-from-raydah-to-banu-hasan-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي: نام الخلي وعين الدهر في تعب، ونهوضه لدين الله، ورسالة مع مسافر من سهل ريدة إلى بني حسن في الحجاز، ص317"
  en: "Verses of al-Hadi: the carefree sleep while the eye of the age is in toil, his rising for God's religion, and a message by a traveller from the plain of Raydah to Banu Hasan in the Hijaz, p. 317"
  ur: "ہادی کے اشعار: بے فکر سو رہے ہیں اور زمانے کی آنکھ مشقت میں ہے، دین اللہ کے لیے اس کا اٹھنا، اور ریدہ کے میدان سے ایک مسافر کے ہاتھ حجاز میں بنو حسن کو پیغام، ص317"
  es: "Versículos de al-Hadi: el sueño despreocupado mientras el ojo de la época trabaja, su levantamiento por la religión de Dios y un mensaje de un viajero de la llanura de Raydah a Banu Hasan en el Hiyaz, pág. 317"
  fr: "Versets d'al-Hadi: le sommeil insouciant tandis que l'œil du siècle est à l'œuvre, son réveil pour la religion de Dieu et un message d'un voyageur de la plaine de Raydah aux Banu Hasan dans le Hedjaz, p. 317"
summary:
  ar: "قصيدة من البسيط تحت عنوان «وله أيضاً» في ص317: يقول الهادي إن الخلي نائم وعين الدهر في تعب وولاة الجور غطوا عليه، وإن الناس غافلون عما أصاب آل الرسول، وإنه نهض لدين الله محتسباً إذ لا يرى ثائراً لله ينصره؛ ثم يطلب من مسافر يطوي الأرض من سهل ريدة إلى الحجاز على الإبل المهرية أن يبلغ بني حسن الأخيار رسالة من ناصح لهم هو الخليل الذي لم يخشوا نوبته."
  en: "A poem in the basit metre under the heading \"and also of his\" on p. 317: al-Hadi says the carefree sleep while the eye of the age is in toil and the rulers of wrong have covered it over, that people are heedless of what befell the family of the Messenger, and that he rose for God's religion seeking reward, seeing no avenger for God to help it; then he asks a traveller who folds up the earth from the plain of Raydah to the Hijaz on Mahri camels to carry to the good Banu Hasan the message of a sincere adviser, the friend whose misfortune they did not fear."
  ur: "بسیط بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت ص317 پر: ہادی کہتا ہے کہ بے فکر سو رہے ہیں اور زمانے کی آنکھ مشقت میں ہے اور ظلم کے حکمرانوں نے اس پر پردے ڈال دیے ہیں، لوگ آل رسول پر جو گزری اس سے غافل ہیں، اور وہ اللہ کے دین کے لیے ثواب کی نیت سے اٹھا کیونکہ اسے کوئی ایسا انتقام لینے والا نظر نہیں آتا جو اللہ کی مدد کرے؛ پھر وہ ایک مسافر سے کہتا ہے جو ریدہ کے میدان سے مہری اونٹوں پر زمین لپیٹتا حجاز کو جاتا ہے کہ نیک بنو حسن کو ایک ناصح کا پیغام پہنچائے، اس دوست کا جس کی مصیبت سے وہ نہیں ڈرتے تھے۔"
  es: "Un poema en metro basit bajo el título \"y también suyo\" en la página 317: al-Hadi dice que el sueño despreocupado mientras el ojo de la época está en trabajo y los gobernantes de la injusticia lo han cubierto, que la gente es indiferente a lo que le sucedió a la familia del Mensajero, y que él se levantó por la religión de Dios buscando recompensa, sin ver ningún vengador de Dios que lo ayudara; luego le pide a un viajero que pliega la tierra desde la llanura de Raydah hasta el Hiyaz en camellos Mahri que lleve a los buenos Banu Hasan el mensaje de un consejero sincero, el amigo cuya desgracia no temieron."
  fr: "Un poème en mètre basit, sous le titre « et aussi de lui » à la page 317: al-Hadi dit que le sommeil insouciant règne tandis que l’œil du siècle est à l’œuvre et que les dirigeants du mal l’ont voilé, que les gens sont indifférents à ce qui est arrivé à la famille du Messager, et que celui-ci s’est levé pour la religion de Dieu en quête de récompense, ne voyant aucun vengeur divin pour la secourir; puis il demande à un voyageur qui parcourt la plaine de Raydah jusqu’au Hedjaz sur des chameaux Mahri de porter aux vertueux Banu Hasan le message d’un conseiller sincère, l’ami dont ils ne craignaient pas le malheur."
