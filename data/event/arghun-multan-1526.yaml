label: { ar: "أخذ الأرغون الملتان ودخولها في مُلك المغول ١٥٢٦م", en: "The Arghuns take Multan into the Mughal orbit, 1526" }
summary:
  ar: "هُزمت دولة اللنكاه سنة ١٥٢٦م على أيدي الأرغون الذين تعاونوا مع المغول، فصارت الملتان تابعة لملكهم؛ ثم بعد زوال عهد السور أمسكت الملتان عاصمة صوبة هامة من صوبات الإمبراطورية المغولية ونعمت بزمن طويل من الاستقرار {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "The Langahs were defeated in 1526 by the Arghuns, who collaborated with the Mughals and made Multan a dependency of their empire; after the Sur interlude Multan became the capital of an important suba of the Mughal empire and enjoyed a long period of stability {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "لنگاہوں کو 1526ء میں ارغونوں نے شکست دی، جنھوں نے مغلوں سے تعاون کیا اور ملتان کو اپنی سلطنت کا تابع بنا دیا؛ سور دور کے خاتمے کے بعد ملتان مغلیہ سلطنت کی ایک اہم صوبہ کی دارالحکومت بنا اور اسے استقرار کا طویل دور نصیب ہوا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
