label: { ar: "حكم وكيع بن حسان خراسان تسعة أشهر", en: "Waki' ibn Hassan's Nine Months over Khurasan", es: "Los nueve meses de Waki' ibn Hassan sobre Jorasán", fr: "Les neuf mois de Waki' ibn Hassan au Khorasan", ur: "وکیع بن حسن کا خراسان پر نو ماہ" }
summary:
  ar: "تصارم وكيع بخراسان وضبطها فأراد سليمان توليته إياها فقيل له إن وكيعاً ترفعه الفتنة وتضعه الجماعة وفيه جفاء وأعرابية وكان وكيع يدعو بطست فيبول والناس ينظرون إليه فمكث تسعة أشهر حتى قدم عليه يزيد بن المهلب وكان بالعراق فكتب إليه سليمان أن يأتي خراسان وبعث إليه بعهده فقدم يزيد مخلداً ابنه فحاسب وكيعاً وحبسه وقال له أد مال الله فقال أو خازناً لله كنت وغزا مخلد البتم ففتحها ثم نقضوا بعده فتركهم ومال عنهم فطمعوا في انصرافه ثم كر عليهم حتى دخلها ودخلها جهم بن زهر وأصاب بها مالاً وأصناماً من ذهب فأهل بتم ينسبون إلى ولائه."
  en: "Waki' held Khurasan sole; Sulayman meant to confirm him but was told fitna raises him and the jama'a lowers him — too rough, too bedouin, a man who called for a basin and urinated in public. Nine months till Yazid ibn al-Muhallab came appointed; Mukhallad his son called Waki' to account — 'yield God's wealth' — 'was I God's treasurer?' — and jailed him. Mukhallad took al-Buttam, left when they breached, then wheeled back and entered it with Jahm ibn Zahr, who took wealth and golden idols — Buttam's folk trace their mawla-status to him."
  es: "Waki' era el único caudillo de Jorasán; Sulayman pretendía confirmarlo, pero le dijeron que la discordia lo enaltecía y la comunidad lo degradaba: demasiado rudo, demasiado beduino, un hombre que pedía una palangana y orinaba en público. Pasaron nueve meses hasta que Yazid ibn al-Muhallab fue nombrado; su hijo Mukhallad le pidió cuentas a Waki': «¡Entrega las riquezas de Dios!», «¿Acaso era yo el tesorero de Dios?», y lo encarceló. Mukhallad tomó al-Buttam, se marchó cuando rompieron el cerco, luego regresó y entró con Jahm ibn Zahr, quien se llevó riquezas e ídolos de oro; la gente de Buttam atribuye su estatus de mawla a él."
  fr: "Waki' contrôlait seul le Khorasan; Sulayman voulait le confirmer, mais on lui dit que la fitna l'élèverait et que la jama'a le rabaisserait — trop rude, trop bédouin, un homme qui réclamait un bassin et urinait en public. Neuf mois s'écoulèrent avant la nomination de Yazid ibn al-Muhallab; son fils, Mukhallad, demanda des comptes à Waki' — « Rends les richesses de Dieu » — « Étais-je le trésorier de Dieu ? » — et l'emprisonna. Mukhallad prit al-Buttam, partit lors de la brèche, puis fit demi-tour et y entra avec Jahm ibn Zahr, qui emporta richesses et idoles d'or — les habitants de Buttam tiennent leur statut de mawla de lui."
  ur: "وکیع نے خراسان کو واحد رکھا۔ سلیمان کا مقصد اس کی تصدیق کرنا تھا لیکن اسے بتایا گیا کہ فتنہ اسے اٹھاتا ہے اور جماعت اسے پست کرتی ہے - بہت کھردرا، بہت بدو، ایک آدمی جس نے بیسن کو بلایا اور عوامی طور پر پیشاب کیا۔ یزید بن المحلب کے آنے میں نو مہینے باقی تھے۔ مخلد نے اس کے بیٹے وکی کو حساب کے لیے بلایا - 'خدا کی دولت حاصل کرو' - 'کیا میں خدا کا خزانچی تھا؟' - اور اسے جیل میں ڈال دیا. مخلد نے البطم کو لے لیا، جب وہ ٹوٹ گئے تو وہاں سے چلے گئے، پھر وہیل چلا کر جہم بن زہر کے ساتھ اس میں داخل ہوا، جس نے دولت اور سونے کے بت لیے تھے - بٹم کے لوگ ان کے مولا کی حیثیت کا پتہ لگاتے ہیں۔"
