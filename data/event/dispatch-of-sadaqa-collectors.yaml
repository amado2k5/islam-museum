id: event/dispatch-of-sadaqa-collectors
class: event
kind: other
label: { en: "The dispatch of the sadaqa collectors", ar: "بعث المُصَدِّقين إلى القبائل" }
summary:
  en: "With the new moon of Muharram 9 AH the Prophet sent the musaddiqun — alms-tax collectors — to the tribes: Uyayna ibn Hisn to Banu Tamim, Yazid ibn al-Husayn to Aslam and Ghifar, Abbad ibn Bishr to Sulaym and Muzayna, Rafi' ibn Makith to Juhayna, Amr ibn al-As to Banu Fazara, al-Dahhak ibn Sufyan to Banu Kilab, Bashir ibn Sufyan to Banu Ka'b, Ibn al-Lutbiyya to Banu Dhubyan, al-Muhajir ibn Abi Umayya to San'a', Ziyad ibn Labid to Hadramawt, Adi ibn Hatim to Tayy' and Banu Asad, Malik ibn Nuwayra to Banu Hanzala, al-Zibriqan ibn Badr and Qays ibn Asim to parts of Banu Sa'd, al-Ala ibn al-Hadrami to Bahrayn, and Ali ibn Abi Talib to Najran for sadaqa and jizya alike."
  ar: "مع استهلال هلال المحرم سنة 9هـ بعث النبي المصدقين جامعي الصدقات إلى القبائل: عيينة بن حصن إلى بني تميم، ويزيد بن الحصين إلى أسلم وغفار، وعباد بن بشر إلى سليم ومزينة، ورافع بن مكيث إلى جهينة، وعمرو بن العاص إلى بني فزارة، والضحاك بن سفيان إلى بني كلاب، وبشير بن سفيان إلى بني كعب، وابن اللتبية الأزدي إلى بني ذبيان، والمهاجر بن أبي أمية إلى صنعاء، وزياد بن لبيد إلى حضرموت، وعدي بن حاتم إلى طيء وبني أسد، ومالك بن نويرة إلى بني حنظلة، والزبرقان بن بدر وقيس بن عاصم إلى بني سعد، والعلاء بن الحضرمي إلى البحرين، وعلي بن أبي طالب إلى نجران لجمع الصدقة والجزية كليهما؛ ولم يبعثوا كلهم في المحرم بل تأخر بعث بعضهم إلى إسلام قبائلهم."
