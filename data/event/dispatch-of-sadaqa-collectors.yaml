id: event/dispatch-of-sadaqa-collectors
class: event
kind: other
label: { en: "The dispatch of the sadaqa collectors", ar: "بعث المُصَدِّقين إلى القبائل", es: "El envío de los recolectores de sadaqa", fr: "L'envoi des collecteurs de sadaqa" }
summary:
  en: "With the new moon of Muharram 9 AH the Prophet sent the musaddiqun — alms-tax collectors — to the tribes: Uyayna ibn Hisn to Banu Tamim, Yazid ibn al-Husayn to Aslam and Ghifar, Abbad ibn Bishr to Sulaym and Muzayna, Rafi' ibn Makith to Juhayna, Amr ibn al-As to Banu Fazara, al-Dahhak ibn Sufyan to Banu Kilab, Bashir ibn Sufyan to Banu Ka'b, Ibn al-Lutbiyya to Banu Dhubyan, al-Muhajir ibn Abi Umayya to San'a', Ziyad ibn Labid to Hadramawt, Adi ibn Hatim to Tayy' and Banu Asad, Malik ibn Nuwayra to Banu Hanzala, al-Zibriqan ibn Badr and Qays ibn Asim to parts of Banu Sa'd, al-Ala ibn al-Hadrami to Bahrayn, and Ali ibn Abi Talib to Najran for sadaqa and jizya alike."
  ar: "مع استهلال هلال المحرم سنة 9هـ بعث النبي المصدقين جامعي الصدقات إلى القبائل: عيينة بن حصن إلى بني تميم، ويزيد بن الحصين إلى أسلم وغفار، وعباد بن بشر إلى سليم ومزينة، ورافع بن مكيث إلى جهينة، وعمرو بن العاص إلى بني فزارة، والضحاك بن سفيان إلى بني كلاب، وبشير بن سفيان إلى بني كعب، وابن اللتبية الأزدي إلى بني ذبيان، والمهاجر بن أبي أمية إلى صنعاء، وزياد بن لبيد إلى حضرموت، وعدي بن حاتم إلى طيء وبني أسد، ومالك بن نويرة إلى بني حنظلة، والزبرقان بن بدر وقيس بن عاصم إلى بني سعد، والعلاء بن الحضرمي إلى البحرين، وعلي بن أبي طالب إلى نجران لجمع الصدقة والجزية كليهما؛ ولم يبعثوا كلهم في المحرم بل تأخر بعث بعضهم إلى إسلام قبائلهم."
  es: "Con la luna nueva de Muharram del año 9 d.H., el Profeta envió a los musaddiqun (recaudadores de impuestos sobre limosnas) a las tribus: Uyayna ibn Hisn a Banu Tamim, Yazid ibn al-Husayn a Aslam y Ghifar, Abbad ibn Bishr a Sulaym y Muzayna, Rafi' ibn Makith a Juhayna, Amr ibn al-As a Banu. Fazara, al-Dahhak ibn Sufyan a Banu Kilab, Bashir ibn Sufyan a Banu Ka'b, Ibn al-Lutbiyya a Banu Dhubyan, al-Muhajir ibn Abi Umayya a San'a', Ziyad ibn Labid a Hadramawt, Adi ibn Hatim a Tayy' y Banu Asad, Malik ibn Nuwayra a Banu Hanzala, al-Zibriqan ibn Badr y Qays ibn Asim a partes de Banu Sa'd, al-Ala ibn al-Hadrami a Bahréin y Ali ibn Abi Talib a Najran para sadaqa y jizya por igual."
  fr: "Avec la nouvelle lune de Muharram 9 AH, le Prophète envoya les musaddiqun — collecteurs d'aumônes — aux tribus: Uyayna ibn Hisn à Banu Tamim, Yazid ibn al-Husayn à Aslam et Ghifar, Abbad ibn Bishr à Sulaym et Muzayna, Rafi' ibn Makith à Juhayna, Amr ibn al-As à Banu Fazara, al-Dahhak ibn Sufyan à Banu Kilab, Bashir ibn Sufyan à Banu Ka'b, Ibn al-Lutbiyya à Banu Dhubyan, al-Muhajir ibn Abi Umayya à San'a', Ziyad ibn Labid à Hadramawt, Adi ibn Hatim à Tayy' et Banu Asad, Malik ibn Nuwayra à Banu Hanzala, al-Zibriqan ibn Badr et Qays ibn Asim dans certaines parties de Banu Sa'd, al-Ala ibn al-Hadrami à Bahrayn et Ali ibn Abi Talib à Najran pour la sadaqa et la jizya."
