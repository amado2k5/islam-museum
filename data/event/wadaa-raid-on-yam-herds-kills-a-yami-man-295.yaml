id: event/wadaa-raid-on-yam-herds-kills-a-yami-man-295
class: event
kind: other
label:
  ar: "غارة وادعة على نعم يأم وقتل رجل منهم، سنة 295هـ، ص355-356"
  en: "A Wada'a raid on Yam's herds and the killing of a Yami man, 295 AH, pp. 355-356"
  ur: "وادعہ کا یأم کے مویشیوں پر چھاپہ اور ان کے ایک آدمی کا قتل، 295ھ، ص355-356"
  es: "Un ataque de los Wada'a contra los rebaños de Yam y el asesinato de un hombre Yami, 295 AH, págs. 355-356"
  fr: "Un raid des Wada'a sur les troupeaux de Yam et le meurtre d'un homme Yami, 295 AH, pp. 355-356"
summary:
  ar: "أغار نفر من وادعة على سرّ من أسرار يأم، فقتلوا منهم رجلاً يقال له ميمون بن محمد الذهلي، وجرحوا آخر، وساقوا مالاً كثيراً، ثم أغاروا على بادية أخرى فقتلوا رجلاً من بني عبيد يقال له شداد."
  en: "A party of Wada'a raided a secret herd of Yam, killed a man of Yam named Maymun ibn Muhammad al-Dhuhli, wounded another, and drove off much livestock. They then raided another nomad camp and killed a man of Banu Ubayd named Shaddad."
  ur: "وادعہ کے ایک گروہ نے یأم کے خفیہ مویشیوں پر چھاپہ مارا، یأم کے ایک آدمی میمون بن محمد الذہلی کو قتل کیا، ایک اور کو زخمی کیا، اور بہت سے مال لے گئے۔ پھر انہوں نے ایک اور خانہ بدوش بستی پر چھاپہ مارا اور بنو عبید کے ایک آدمی شداد کو قتل کیا۔"
  es: "Un grupo de Wada'a asaltó un rebaño secreto de Yam, mató a un hombre de Yam llamado Maymun ibn Muhammad al-Dhuhli, hirió a otro y se llevó gran cantidad de ganado. Luego asaltaron otro campamento nómada y mataron a un hombre de Banu Ubayd llamado Shaddad."
  fr: "Un groupe de Wada'a attaqua un troupeau clandestin de Yam, tua un homme de Yam nommé Maymun ibn Muhammad al-Dhuhli, en blessa un autre et emporta une grande quantité de bétail. Ils attaquèrent ensuite un autre campement nomade et tuèrent un homme des Banu Ubayd nommé Shaddad."
