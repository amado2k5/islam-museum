label: { ar: "فتح حران", en: "The Conquest of Harran", es: "La conquista de Harran", fr: "La conquête de Harran" }
summary:
  ar: "عند البلاذري: سار إياد إلى حران فنزل بأجدى وبعث مقدمته فأغلق أهل حران أبوابها دونهم ثم اتبعهم فلما نزل بها بعث إليه الحرنانيون من أهلها يعلمونه أن في أيديهم طائفة من المدينة ويسألونه أن يصير إلى الرها فهما صالحوه عليه من شيء قنعوا به وخلوا بينه وبين النصارى حتى يصيروا إليه، فبلغ النصارى ذلك فأرسلوا إليه بالرضى بما عرض الحرنانيون وبذلوا، فأتى الرها وقد جمع له أهلها فرموا المسلمين ساعة ثم خرجت مقاتلتهم فهزمهم المسلمون حتى ألجأوهم إلى المدينة فلم ينشبوا أن طلبوا الصلح والأمان؛ وروي أن إياداً لما أتى حران من الرقة وجدها خالية قد انتقل أهلها إلى الرها فلما فتحت الرها صالحوا عن مدينتهم وهم بها وكان صلحهم مثل صلح الرها؛ فصالح إياد أهل حران على مثل صلح الرها وفتحوا له أبوابها وولاها رجلاً ثم سار إلى سميساط فوجد صفوان بن المعطل وحبيب بن مسلمة مقيمين قد غلبا على قرى وحصون من قراها فصالحه أهلها على مثل صلح أهل الرها، ثم إن سميساط كفروا فلما بلغه ذلك رجع إليهم فحاصرها حتى فتحها، وأتى سروج ورأس كيفا والأرض البيضاء فغلب على أرضها وصالح أهل حصونها على مثل صلح الرها."
  en: "In al-Baladhuri: Iyad marched on Harran, halting at Ajda and sending his vanguard ahead — its people shut the gates against them, and when he invested it the Harranian faction among them sent word that they held part of the city and asked him to make for al-Ruha so they could compound with him secretly and leave him and the Christians apart; the Christians heard, consented to what the Harranians offered and outbid it, so he went to al-Ruha whose people had gathered, shot at the Muslims a while, sent out their fighters whom the Muslims routed back into the city, and soon sued for peace and aman; another report has Iyad finding Harran empty — its people removed to al-Ruha — so when al-Ruha fell they compounded for their city from within it on the like of its treaty; he compounded with Harran on the like of al-Ruha's terms, they opened its gates, he set a man over it and went on to Sumaysat where Safwan ibn al-Mu'attal and Habib ibn Maslama held villages and forts, its people compounding likewise — Sumaysat later apostatised and he returned and besieged it till he took it — and he came to Saruj, Ra's Kayfa and the White Land, mastering its land and compounding with its fort-dwellers on al-Ruha's terms."
  es: "En al-Baladhuri: Iyad marchó sobre Harran, deteniéndose en Ajda y enviando a su vanguardia por delante; su gente les cerró las puertas, y cuando la sitió la facción harraniana entre ellos envió un mensaje diciendo que controlaban parte de la ciudad y le pidieron que se dirigiera a al-Ruha para poder negociar con él en secreto y dejarlo a él y a los cristianos separados; los cristianos oyeron, consintieron en lo que los harranianos ofrecían y lo superaron en la oferta, así que fue a al-Ruha cuya gente se había reunido, disparó contra los musulmanes durante un rato, envió a sus combatientes a quienes los musulmanes hicieron retroceder a la ciudad, y pronto pidieron la paz y el aman; otro informe dice que Iyad encontró Harran vacía —su gente se trasladó a al-Ruha— así que cuando al-Ruha cayó negociaron por su ciudad desde dentro de ella según su tratado; Llegó a un acuerdo con Harran en términos similares a los de al-Ruha, le abrieron las puertas, puso a un hombre al mando y siguió hacia Sumaysat, donde Safwan ibn al-Mu'attal y Habib ibn Maslama controlaban aldeas y fortalezas, y su gente hizo lo mismo. Más tarde, Sumaysat apostató y él regresó y la asedió hasta que la tomó. Luego llegó a Saruj, Ra's Kayfa y la Tierra Blanca, dominando su territorio y llegando a un acuerdo con los habitantes de sus fortalezas en términos similares a los de al-Ruha."
  fr: "Selon al-Baladhuri: Iyad marcha sur Harran, s’arrêtant à Ajda et envoyant son avant-garde en avant. Les habitants leur fermèrent les portes, et lorsqu’il prit la ville, la faction harranienne parmi eux fit savoir qu’elle contrôlait une partie de la ville et lui demanda de se rendre à al-Ruha afin de conclure un accord secret avec lui et de le séparer des chrétiens. Les chrétiens, ayant entendu cela, acceptèrent l’offre des Harraniens et surenchérirent. Iyad se rendit donc à al-Ruha, dont les habitants s’étaient rassemblés. Ils tirèrent un moment sur les musulmans, puis envoyèrent leurs combattants que les musulmans repoussèrent dans la ville. Peu après, ils demandèrent la paix et l’aman. Un autre récit rapporte qu’Iyad trouva Harran vide – ses habitants s’étant réfugiés à al-Ruha – et que, lorsque al-Ruha tomba, ils conclurent un accord pour leur ville depuis l’intérieur, selon un traité similaire au leur. Il conclut un pacte avec Harran selon les conditions d'al-Ruha, ils ouvrirent ses portes, il y installa un homme et se rendit à Sumaysat où Safwan ibn al-Mu'attal et Habib ibn Maslama détenaient des villages et des forts, ses habitants concluant également un pacte — Sumaysat apostasia plus tard et il y retourna et l'assiégea jusqu'à ce qu'il la prenne — et il arriva à Saruj, Ra's Kayfa et la Terre Blanche, maîtrisant ses terres et concluant un pacte avec les habitants de ses forts selon les conditions d'al-Ruha."
