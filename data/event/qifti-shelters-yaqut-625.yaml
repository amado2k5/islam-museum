id: event/qifti-shelters-yaqut-625
class: event
kind: other
label:
  ar: "القفطي يُؤوي ياقوت الحموي بحلب، نحو ٦٢٥هـ"
  en: "Al-Qifti shelters Yaqut al-Hamawi at Aleppo, c. 625/1228"
  ur: "قفطی نے یاقوت حموی کو حلب میں پناہ دی، تقریباً 625ھ/1228ء"
  es: "Al-Qifti alberga a Yaqut al-Hamawi en Alepo, c. 625/1228"
  fr: "Al-Qifti abrite Yaqut al-Hamawi à Alep, v. 625/1228"
  tr: "El-Kıfti, H. 625 civarında Halep'te Yakut el-Hamavi'yi barındırdı."
  id: "Al-Qifti melindungi Yaqut al-Hamawi di Aleppo, sekitar tahun 625 H."
summary:
  ar: "استغل القفطي منصبه المؤثر في خدمة العلم، فآوى بحلب ياقوتَ الحموي الهارب من المغول وأعانه كثيراً في تأليف معجمه الجغرافي الكبير {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ وذلك في سنوات شغله ديوان المال قبل عزله سنة ٦٢٨هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "Al-Qifti used his influential office to further scholarship: he sheltered at Aleppo Yaqut al-Hamawi, who had fled the Mongols, and gave him much help in the compilation of his great geographical dictionary {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; this fell within his years over the diwan of finances before his dismissal in 628 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "قفطی نے اپنے بااثر منصب کو علم کی خدمت میں لگایا: حلب میں منگولوں سے بھاگے یاقوت حموی کو پناہ دی اور ان کے عظیم جغرافیائی معجم کی تصنیف میں کثیر معاونت کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ یہ ان کے دیوان مال کے زمانے میں 628ھ کے عزل سے پہلے کا واقعہ ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
  es: "Al-Qifti utilizó su influyente cargo para promover la erudición: dio refugio en Alepo a Yaqut al-Hamawi, que había huido de los mongoles, y le prestó mucha ayuda en la compilación de su gran diccionario geográfico {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; esto ocurrió durante sus años al frente del diwan de finanzas antes de su destitución en 628 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  fr: "Al-Qifti utilisa sa fonction influente pour promouvoir l'érudition: il hébergea à Alep Yaqut al-Hamawi, qui avait fui les Mongols, et lui apporta une aide précieuse dans la compilation de son grand dictionnaire géographique {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; cela se déroula durant les années où il fut à la tête du diwan des finances avant son renvoi en 628 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  tr: "El-Kifti, nüfuzlu konumunu bilime hizmet etmek için kullandı; bu nedenle Moğollardan kaçan Yakut el-Hamavi'ye Halep'te sığınak sağladı ve onun büyük coğrafya sözlüğünü yazmasına çok yardımcı oldu {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; bu, 628 Hicri yılında görevden alınmadan önce hazineden sorumlu olduğu yıllarda gerçekleşti {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  id: "Al-Qifti menggunakan kedudukannya yang berpengaruh untuk melayani ilmu pengetahuan, sehingga ia melindungi Yaqut al-Hamawi, yang melarikan diri dari Mongol, di Aleppo dan banyak membantunya dalam menulis kamus geografisnya yang agung {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; ini terjadi selama tahun-tahun ketika ia bertanggung jawab atas perbendaharaan sebelum ia diberhentikan pada tahun 628 H {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
