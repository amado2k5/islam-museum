label:
  ar: "القفطي يُؤوي ياقوت الحموي بحلب، نحو ٦٢٥هـ"
  en: "Al-Qifti shelters Yaqut al-Hamawi at Aleppo, c. 625/1228"
  ur: "قفطی نے یاقوت حموی کو حلب میں پناہ دی، تقریباً 625ھ/1228ء"
summary:
  ar: "استغل القفطي منصبه المؤثر في خدمة العلم، فآوى بحلب ياقوتَ الحموي الهارب من المغول وأعانه كثيراً في تأليف معجمه الجغرافي الكبير {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ وذلك في سنوات شغله ديوان المال قبل عزله سنة ٦٢٨هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "Al-Qifti used his influential office to further scholarship: he sheltered at Aleppo Yaqut al-Hamawi, who had fled the Mongols, and gave him much help in the compilation of his great geographical dictionary {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; this fell within his years over the diwan of finances before his dismissal in 628 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "قفطی نے اپنے بااثر منصب کو علم کی خدمت میں لگایا: حلب میں منگولوں سے بھاگے یاقوت حموی کو پناہ دی اور ان کے عظیم جغرافیائی معجم کی تصنیف میں کثیر معاونت کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ یہ ان کے دیوان مال کے زمانے میں 628ھ کے عزل سے پہلے کا واقعہ ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
