  - tradition: shia-twelver
    id: shia-twelver
    summary: { ar: "يرى الإمامية في عبارة «بمنزلة هارون من موسى» دليلاً على أن لعلي منزلة هارون من موسى في الخلافة بعد النبي؛ تلخيص يحتاج إلى مصدر شيعي محدد (needs_source).", en: "The Imami (Twelver) view sees in the phrase 'in the position of Aaron to Moses' proof that Ali holds Aaron's position to Moses in the succession after the Prophet; the summary needs a specific Shi'i source (needs_source)." }
