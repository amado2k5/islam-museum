    summary: { ar: "يرويها ابن إسحاق جواباً على إرجاف المنافقين بأن النبي استثقل علياً، ولذا يقرأ الشرّاح السنة عادةً القول بوصفه استخلافاً لعلي على الأهل مدة الغزوة تشبيهاً باستخلاف هارون لموسى حين غاب، لا إعلان خلافة بعد النبي؛ يحتاج هذا التلخيص إلى شاهد ثانٍ من شروح الحديث (needs_source).", en: "Ibn Ishaq relates it as an answer to the hypocrites' rumour that the Prophet had found Ali a burden; Sunni commentators therefore usually read the saying as deputising Ali over the household for the duration of the campaign, likened to Aaron deputising for Moses in his absence — not a declaration of succession after the Prophet; this summary needs a second witness from hadith commentaries (needs_source)." }
