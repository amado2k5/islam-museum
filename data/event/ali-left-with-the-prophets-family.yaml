label: { ar: "استخلاف علي على أهل النبي وقول النبي له", en: "Ali is left in charge of the Prophet's family" }
summary:
  ar: "خلّف النبي علياً على أهله وأمره بالإقامة فيهم، فأرجف به المنافقون أنه استثقله، فأخذ علي سلاحه ولحق بالنبي بالجرف؛ فقال له النبي إنه خلّفه لما تركه وراءه، وسأله: أفلا ترضى أن تكون مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي؟ فرجع علي إلى المدينة."
  en: "The Prophet left Ali in charge of his family and ordered him to stay with them. The hypocrites spread the rumour that he had found Ali a burden, so Ali took up his weapons and caught up with the Prophet at al-Jurf. The Prophet told him he had left him behind for what he had left behind him, and asked: are you not content to be to me as Aaron was to Moses, except that there is no prophet after me? Ali returned to Medina."
