label: { ar: "وصية علي لكميل بن زياد في العلم وأهله", en: "Ali's counsel to Kumayl ibn Ziyad on knowledge and its people" }
summary:
  ar: "أخذ علي بيد كميل بن زياد إلى الصحراء، فلما جلس تنفس ثم أوصاه في العلم: القلوب أوعية فخيرها أوعاها للعلم، والناس ثلاثة: علماء ربانيون، وطلاب علم على سبيل نجاة، وهمج رعاع يتبعون كل ناعق. ثم قارن بين العلم والمال، وبيّن أن العالم أفضل من الصائم القائم المجاهد {cite:sallabi-ali-vol1 p. 201-205}. ينقل الصلابي الوصية عن حلية الأولياء وصفة الصفوة، ويضعها في باب الفقه والحكمة والتربية."
  en: "Ali took Kumayl ibn Ziyad by the hand into the open country and counselled him on knowledge: hearts are vessels, and people are of three kinds, learned scholars, students seeking salvation, and a rabble that follows every caller. He compared knowledge with wealth and said the scholar outranks the worshipper who fasts and fights."
