label: { ar: "سقوط الدولة المهدوية بأحمدنكر وقتل الوزير جمال خان 999هـ", en: "The Mahdawi regime at Ahmadnagar falls; vizier Jamal Khan killed, 999", fr: "Chute du régime mahdawi à Ahmadnagar et mort du vizir Jamal Khan, 999", es: "El régimen de Mahdawi en Ahmadnagar cae; el visir Jamal Khan muere, 999", ur: "احمد نگر میں مہدوی حکومت کا زوال؛ وزیر جمال خان مارا گیا، 999", tr: "Ahmednagar yönetimindeki Mehdi devletinin yıkılması ve 999 Hicri yılında bakan Cemal Han'ın öldürülmesi.", id: "Kejatuhan negara Mahdist di bawah Ahmadnagar dan pembunuhan menteri Jamal Khan pada tahun 999 Hijriah." }
summary:
  ar: "في يوم الأربعاء رابع عشر رجب سنة تسع وتسعين وتسعمائة زالت الدولة المهدوية بأحمد نكر من بلاد الدكن، وقتل الوزير جمال خان وجيء برأسه إلى أحمد نكر وطيف به فيها ثم علق أياماً، وتسلطن برهان شاه {cite:shadharat-dhahab p. 440}."
  en: "On Wednesday 14 Rajab 999 the Mahdawi regime at Ahmadnagar in the Deccan fell; the vizier Jamal Khan was killed, his head brought to Ahmadnagar, paraded and hung for days, and Burhan Shah took the sultanate {cite:shadharat-dhahab p. 440}."
  fr: "Le mercredi 14 rajab 999, le régime mahdawi d’Ahmadnagar, dans le Deccan, tomba. Le vizir Jamal Khan fut tué ; sa tête fut apportée à Ahmadnagar, promenée dans la ville puis suspendue pendant plusieurs jours, et Burhan Shah prit le sultanat {cite:shadharat-dhahab p. 440}."
  es: "El miércoles 14 de Rajab de 999 cayó el régimen Mahdawi en Ahmadnagar, en el Deccan; el visir Jamal Khan fue asesinado, su cabeza fue llevada a Ahmadnagar, exhibida y colgada durante días, y Burhan Shah tomó el sultanato {cite:shadharat-dhahab p. 440}."
  ur: "بدھ 14 رجب 999 کو دکن کے احمد نگر میں مہدوی حکومت کا خاتمہ ہوا۔ وزیر جمال خان مارا گیا، اس کا سر احمد نگر لایا گیا، پریڈ کی گئی اور کئی دنوں تک لٹکا دیا گیا، اور برہان شاہ نے سلطنت سنبھال لی۔ 440}۔"
  tr: "999 yılının Receb ayının on dördüncü Çarşamba günü, Dekkan topraklarından Mehdi devleti Ahmed Nagar tarafından devrildi. Vezir Cemal Han öldürüldü ve başı Ahmed Nagar'a getirilerek orada dolaştırıldı, ardından günlerce asılı kaldı ve Burhan Şah Sultan oldu. {cite:shadharat-dhahab s. 440}"
  id: "Pada hari Rabu, tanggal empat belas Rajab, tahun sembilan ratus sembilan puluh sembilan, negara Mahdist digulingkan oleh Ahmad Nagar dari tanah Deccan. Menteri Jamal Khan dibunuh, dan kepalanya dibawa ke Ahmad Nagar dan diarak di sekitarnya, kemudian digantung selama beberapa hari, dan Burhan Shah menjadi Sultan. {cite:shadharat-dhahab p. 440}"
