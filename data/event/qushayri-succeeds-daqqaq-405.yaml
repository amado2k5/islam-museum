id: event/qushayri-succeeds-daqqaq-405
class: event
kind: other
label:
  ar: "القشيري يخلف الدقاق في مجالس التذكير بمدرسته، ٤٠٥هـ"
  en: "Al-Qushayri succeeds al-Daqqaq at the madrasa's remembrance sessions, 405/1015"
  ur: "قشیری دقاق کے بعد مدرسہ میں مجالسِ تذکیر کے جانشین ہوئے، 405ھ/1015ء"
summary:
  ar: "زوّج أبو علي الدقاق القشيري ابنته فاطمة، فلما توفي سنة ٤٠٥هـ خلفه صهره في قيادة مجالس التذكير في مدرسته التي بناها سنة ٣٩١هـ، فسُميت من يومئذ المدرسة القشيرية؛ وكان القشيري قد أخذ الفقه عن أبي بكر الطوسي بطوس والكلام والنظر عن ابن فورك، ثم اختلف إلى أبي إسحاق الإسفرائيني ونظر في تواليف ابن الباقلاني، وعاش بعد الدقاق أبا عبد الرحمن السلمي وصحبه {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  en: "Abu Ali al-Daqqaq married al-Qushayri to his daughter Fatima, and when al-Daqqaq died in 405/1015 his son-in-law succeeded him leading the remembrance sessions in the madrasa he had built in 391/1001 — known from then on as the Kushayriyya; by then al-Qushayri had taken law from Abu Bakr al-Tusi at Tus, kalam and speculation from Ibn Furak, then attended Abu Ishaq al-Isfarayini and studied Ibn al-Baqillani's works, and after al-Daqqaq he kept company with Abu Abd al-Rahman al-Sulami {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  ur: "ابو علی دقاق نے قشیری کی شادی اپنی بیٹی فاطمہ سے کر دی اور 405ھ/1015ء میں ان کی وفات کے بعد ان کے داماد مدرسہ کی مجالسِ تذکیر کے قائد بن گئے جو انھوں نے 391ھ/1001ء میں بنائی تھی — اسی سے وہ مدرسہ قشیریہ کہلائی؛ اس وقت تک قشیری طوس میں ابو بکر طوسی سے فقہ، ابن فورک سے علمِ کلام اور پھر ابو اسحاق اسفرائینی کی صحبت و ابن باقلانی کی تصانیف پڑھ چکے تھے، اور دقاق کے بعد ابو عبد الرحمٰن سلمی کی صحبت میں رہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}۔"
