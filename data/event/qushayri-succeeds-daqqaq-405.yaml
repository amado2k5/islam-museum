id: event/qushayri-succeeds-daqqaq-405
class: event
kind: other
label:
  ar: "القشيري يخلف الدقاق في مجالس التذكير بمدرسته، ٤٠٥هـ"
  en: "Al-Qushayri succeeds al-Daqqaq at the madrasa's remembrance sessions, 405/1015"
  ur: "قشیری دقاق کے بعد مدرسہ میں مجالسِ تذکیر کے جانشین ہوئے، 405ھ/1015ء"
  es: "Al-Qushayri sucede a al-Daqqaq en las sesiones conmemorativas de la madrasa, 405/1015"
  fr: "Al-Qushayri succède à al-Daqqaq aux séances de commémoration de la madrasa, 405/1015"
  tr: "El-Kuşeyri, Hicri 405 yılında okulunda düzenlenen anma derslerinde El-Dakkak'ın yerini aldı."
  id: "Al-Qushayri menggantikan Al-Daqqaq dalam sesi zikir di sekolahnya, 405 Hijriah."
summary:
  ar: "زوّج أبو علي الدقاق القشيري ابنته فاطمة، فلما توفي سنة ٤٠٥هـ خلفه صهره في قيادة مجالس التذكير في مدرسته التي بناها سنة ٣٩١هـ، فسُميت من يومئذ المدرسة القشيرية؛ وكان القشيري قد أخذ الفقه عن أبي بكر الطوسي بطوس والكلام والنظر عن ابن فورك، ثم اختلف إلى أبي إسحاق الإسفرائيني ونظر في تواليف ابن الباقلاني، وعاش بعد الدقاق أبا عبد الرحمن السلمي وصحبه {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  en: "Abu Ali al-Daqqaq married al-Qushayri to his daughter Fatima, and when al-Daqqaq died in 405/1015 his son-in-law succeeded him leading the remembrance sessions in the madrasa he had built in 391/1001 — known from then on as the Kushayriyya; by then al-Qushayri had taken law from Abu Bakr al-Tusi at Tus, kalam and speculation from Ibn Furak, then attended Abu Ishaq al-Isfarayini and studied Ibn al-Baqillani's works, and after al-Daqqaq he kept company with Abu Abd al-Rahman al-Sulami {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  ur: "ابو علی دقاق نے قشیری کی شادی اپنی بیٹی فاطمہ سے کر دی اور 405ھ/1015ء میں ان کی وفات کے بعد ان کے داماد مدرسہ کی مجالسِ تذکیر کے قائد بن گئے جو انھوں نے 391ھ/1001ء میں بنائی تھی — اسی سے وہ مدرسہ قشیریہ کہلائی؛ اس وقت تک قشیری طوس میں ابو بکر طوسی سے فقہ، ابن فورک سے علمِ کلام اور پھر ابو اسحاق اسفرائینی کی صحبت و ابن باقلانی کی تصانیف پڑھ چکے تھے، اور دقاق کے بعد ابو عبد الرحمٰن سلمی کی صحبت میں رہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}۔"
  es: "Abu Ali al-Daqqaq casó a al-Qushayri con su hija Fátima, y cuando al-Daqqaq murió en 405/1015 su yerno lo sucedió dirigiendo las sesiones de recuerdo en la madrasa que había construido en 391/1001, conocida desde entonces como la Kushayriyya; para entonces al-Qushayri había tomado derecho de Abu Bakr al-Tusi en Tus, kalam y especulación de Ibn Furak, luego asistió a Abu Ishaq al-Isfarayini y estudió las obras de Ibn al-Baqillani, y después de al-Daqqaq se mantuvo en compañía de Abu Abd al-Rahman al-Sulami {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  fr: "Abu Ali al-Daqqaq maria sa fille Fatima à al-Qushayri, et à la mort d'al-Daqqaq en 405/1015, son gendre lui succéda à la tête des séances de commémoration dans la madrasa qu'il avait construite en 391/1001 — connue dès lors sous le nom de Kushayriyya; à cette époque, al-Qushayri avait étudié le droit auprès d'Abu Bakr al-Tusi à Tus, le kalam et la spéculation auprès d'Ibn Furak, puis avait suivi les cours d'Abu Ishaq al-Isfarayini et étudié les œuvres d'Ibn al-Baqillani, et après al-Daqqaq, il fréquenta Abu Abd al-Rahman al-Sulami {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  tr: "Ebu Ali el-Dakkak el-Kuşeyri, kızı Fatıma ile evlendi. Hicri 405 yılında vefat ettiğinde, damadı, Hicri 391 yılında kurduğu okulunda zikir derslerinin yönetimini devraldı. O günden itibaren okul, Kuşayri Okulu olarak anıldı. El-Kuşeyri, Tus'ta Ebu Bekir el-Tusi'den fıkıh, İbn Furak'tan ise teoloji ve felsefe öğrenmişti. Daha sonra Ebu İshak el-İsfarayini'nin yanına sık sık gitti ve İbn el-Bakilani'nin eserlerini inceledi. El-Dakkak'tan sonra Ebu Abdül-Rahman el-Sulami yaşadı ve ona eşlik etti. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
  id: "Abu Ali al-Daqqaq al-Qushayri menikahi putrinya, Fatima. Ketika ia meninggal pada tahun 405 H, menantunya menggantikannya dalam memimpin sesi zikir di sekolahnya, yang telah dibangunnya pada tahun 391 H. Sejak hari itu sekolah tersebut disebut Sekolah Qushayri. Al-Qushayri telah mempelajari fiqih dari Abu Bakr al-Tusi di Tus dan teologi serta filsafat dari Ibn Furak. Kemudian ia sering mengunjungi Abu Ishaq al-Isfarayini dan mempelajari karya-karya Ibn al-Baqillani. Setelah al-Daqqaq, Abu Abd al-Rahman al-Sulami hidup dan menemaninya. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi pp. 171-172}."
