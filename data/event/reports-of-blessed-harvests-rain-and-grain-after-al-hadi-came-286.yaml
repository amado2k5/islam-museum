id: event/reports-of-blessed-harvests-rain-and-grain-after-al-hadi-came-286
class: event
kind: other
label:
  ar: أخبار البركة في الغلة والمطر والحبوب بعد قدوم الهادي، يرويها محمد بن سليمان، 286هـ
  en: Reports of blessing in harvests, rain and grain after al-Hadi came, told by Muhammad ibn Sulayman, 286 AH
  ur: ہادی کے آنے کے بعد فصل، بارش اور اناج میں برکت کی خبریں، جو محمد بن سلیمان سناتے ہیں، 286ھ
summary:
  ar: 'يسرد الراوي أخباراً عن بركة بعد قدوم الهادي: محمد بن الدعام زرع أرضاً بدينار من هبة الهادي فأغلت ألفاً ونيفاً من الفِرق بعد أن كانت تغل مائتين إلى ثلاثمائة، ورجل من بيت دود يذكر أنه بُورك فلم تصبهم فتنة، ووفد همدان يذكر مطراً لم يروا مثله، ورجل تضاعفت غلة أرضه، وعبد الملك بن عبد الملك يقول إن طعامه بقي على حاله حتى آخر السنة.'
  en: 'The narrator lists reports of blessing since al-Hadi came: Muhammad ibn al-Da''am put one dinar of al-Hadi''s gift into the seed price of his land and it yielded a thousand faraq and more where it had yielded two to three hundred; a man of the house of Dud says no trouble touched them after al-Hadi''s prayer; a party of Hamdan speaks of rain such as they had never seen; a man says his land yielded manyfold once he paid its sadaqa; and Abd al-Malik ibn Abd al-Malik says his stored food lasted unchanged to the end of the year.'
  ur: 'راوی ہادی کے آنے کے بعد برکت کی خبریں گنواتا ہے: محمد بن دعام نے ہادی کی بخشش میں سے ایک دینار اپنی زمین کے بیج کی قیمت میں ڈالا تو اس نے ہزار سے زائد فرق دیے جبکہ پہلے دو سو سے تین سو دیتی تھی؛ دود کے گھرانے کا ایک شخص کہتا ہے کہ ہادی کی دعا کے بعد انہیں کوئی فتنہ نہ پہنچا؛ ہمدان کا ایک وفد ایسی بارش کا ذکر کرتا ہے جیسی کبھی نہ دیکھی؛ ایک شخص کہتا ہے کہ صدقہ نکالنے پر اس کی زمین کی پیداوار کئی گنا ہو گئی؛ اور عبد الملک بن عبد الملک کہتا ہے کہ اس کا ذخیرہ کیا ہوا اناج سال کے آخر تک جوں کا توں رہا۔'
