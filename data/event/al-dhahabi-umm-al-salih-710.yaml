label:
  ar: "الذهبي مدرّس الحديث بتربة أم الصالح والمدرسة النفيسية، حوالي ٧١٠هـ"
  en: "Al-Dhahabi, professor of hadith at Umm al-Salih and al-Nafisiyya, c. 710/1310"
  ur: "ذہبی، مدرسِ حدیث در تربہ ام الصالح و مدرسہ نفیسہ، تقریباً 710ھ/1310ء"
summary:
  ar: "ولي الذهبي تدريس الحديث بتربة أم الصالح بدمشق وبالمدرسة النفيسية {cite:durar-kamina-jil-1993 3/337}، وذلك بعد حصوله على الإجازة بالتدريس من أبي زكريا بن الصيرفي وابن أبي الخير والقاسم الإربلي وغيرهم؛ ولم يتمكن من الخلف على شيخه المزي في مدرسة الأشرفية بدمشق لاشتراط واقفها مذهباً معيناً لمدرّس الحديث {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}."
  en: "Al-Dhahabi held the professorship of hadith at the turba Umm al-Salih in Damascus and at the al-Nafisiyya madrasa {cite:durar-kamina-jil-1993 3/337}, having received his licence to teach from Abu Zakariyya ibn al-Sayrafi, Ibn Abi al-Khayr, al-Qasim al-Irbili and others. He was unable to succeed his teacher al-Mizzi at the al-Ashrafiyya madrasa in Damascus because its founder had stipulated a particular law school for the professor of tradition {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}."
  ur: "ذہبی دمشق میں تربہ ام الصالح اور مدرسہ نفیسہ میں مدرسِ حدیث مقرر ہوئے {cite:durar-kamina-jil-1993 3/337}، اس سے پہلے انھیں ابو زکریا بن الصیرفی، ابن ابی الخیر، قاسم اربلی وغیرہ سے تدریس کی اجازت مل چکی تھی۔ اپنے استاد مزی کی مدرسہ اشرفیہ دمشق میں جانیشینی انھیں نہ مل سکی کیونکہ واقف نے مدرسِ حدیث کے لیے ایک خاص فقھی مذہب کی شرط رکھی تھی {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}۔"
