summary:
  ar: "في سنة سبع وثمانين ومائتين ذكر الطبري خروج العباس بن عمرو الغنوي من البصرة، فيما ذُكر، مع من ضُم إليه من الجند ومتطوعة البصرة، نحو أبي سعيد الجنابي ومن انضوى إليه من القرامطة، فلقي أبا سعيد {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
  en: "In 287 al-Tabari mentions the departure from Basra of al-'Abbas ibn 'Amr al-Ghanawi, as it is reported, with the troops attached to him and Basra volunteers, toward Abu Sa'id al-Janabi and the Qarmatians who had joined him. He met Abu Sa'id {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
