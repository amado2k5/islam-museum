class: event
kind: revolt
label: { ar: "خروج العباس بن عمرو الغنوي من البصرة", en: "The revolt of al-'Abbas ibn 'Amr al-Ghanawi from Basra", es: "La revuelta de al-'Abbas ibn 'Amr al-Ghanawi de Basora", fr: "La révolte d'al-'Abbas ibn 'Amr al-Ghanawi à Bassorah", ur: "بصرہ سے عباس بن عمرو الغنوی کی بغاوت", tr: "Abbas ibn Amr al-Ghanawi'nin Basra'dan ayrılışı", id: "Kepergian Abbas ibn Amr al-Ghanawi dari Basra" }
summary:
  ar: "في سنة سبع وثمانين ومائتين ذكر الطبري خروج العباس بن عمرو الغنوي من البصرة، فيما ذُكر، مع من ضُم إليه من الجند ومتطوعة البصرة، نحو أبي سعيد الجنابي ومن انضوى إليه من القرامطة، فلقي أبا سعيد {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
  en: "In 287 al-Tabari mentions the departure from Basra of al-'Abbas ibn 'Amr al-Ghanawi, as it is reported, with the troops attached to him and Basra volunteers, toward Abu Sa'id al-Janabi and the Qarmatians who had joined him. He met Abu Sa'id {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
  es: "En el año 287, al-Tabari menciona la partida de Basora de al-'Abbas ibn 'Amr al-Ghanawi, según se relata, con las tropas que le acompañaban y voluntarios de Basora, hacia Abu Sa'id al-Janabi y los cármatas que se habían unido a él. Allí se encontró con Abu Sa'id {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
  fr: "En 287, al-Tabari mentionne le départ de Bassora d'al-'Abbas ibn 'Amr al-Ghanawi, qui, selon les sources, partit avec les troupes qui lui étaient rattachées et des volontaires de Bassora pour rejoindre Abu Sa'id al-Janabi et les Qarmates qui l'avaient rejoint. Il rencontra Abu Sa'id (voir: Tabari-Tarikh-Abu-al-Fadl, vol. 10, p. 77)."
  ur: "الطبری نے 287 میں عباس بن عمرو الغنوی کے بصرہ سے نکلنے کا ذکر کیا ہے جیسا کہ روایت ہے کہ ان کے ساتھ دستوں اور بصرہ کے رضاکاروں کے ساتھ ابو سعید الجنبی اور ان کے ساتھ آنے والے قرمطیوں کی طرف روانگی ہوئی۔ اس کی ملاقات ابو سعید سے ہوئی۔"
  tr: "Hicri 287 yılında Taberi, Abbas ibn Amr el-Ganavi'nin, ordudan ve Basra gönüllülerinden kendisine katılanlarla birlikte Basra'dan ayrılıp, Ebu Said el-Cenabi ve Karmatilerden kendisine katılanlarla buluştuğunu ve böylece Ebu Said ile bir araya geldiğini belirtmiştir. {cite:tabari-tarikh-abu-al-fadl j.10 p.77}"
  id: "Pada tahun 287 H, al-Tabari menyebutkan keberangkatan al-Abbas ibn Amr al-Ghanawi dari Basra, seperti yang disebutkan, bersama orang-orang yang bergabung dengannya dari pasukan dan sukarelawan Basra, menuju Abu Saeed al-Janabi dan orang-orang yang bergabung dengannya dari kaum Qarmatian, sehingga ia bertemu dengan Abu Saeed {cite:tabari-tarikh-abu-al-fadl j.10 p.77}."
