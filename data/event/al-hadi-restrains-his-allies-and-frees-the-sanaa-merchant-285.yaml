id: event/al-hadi-restrains-his-allies-and-frees-the-sanaa-merchant-285
class: event
kind: other
label:
  ar: الهادي يكبح حلفاءه من بني ربيعة ويرد متاع التاجر الصنعاني بعد أن حسبوه رسول الدعام، ذو القعدة 285هـ
  en: Al-Hadi restrains his allies from Banu Rabi'a and has a Sanaa merchant's goods returned after they took him for al-Da'am's messenger, Dhu al-Qa'da 285 AH
  ur: ہادی کا بنو ربیعہ کے حلیفوں کو روکنا اور صنعاء کے تاجر کا مال لوٹوانا جسے انہوں نے دعام کا قاصد سمجھا، ذوالقعدہ 285ھ
summary:
  ar: ينتهي في الكتاب جواب الهادي لبني ربيعة وقد طلبوا الإغارة على قرى أرحب بأنه يخاف أن يقتلوا من لم يقتلهم وينهبوا من لم ينهبهم، ويروي محمد بن سليمان أنه سمع رجلاً منهم غاضباً يدعو أصحابه إلى أن يبنوا مع الهادي مساجد ويجلسوا معه، فأوضح الهادي أنه سيبدأ بقتال كل من أحدث حدثاً بغير أمره، فأعلنوا السمع والطاعة. ثم أقاموا جماعة على طريق أثافت فأخذوا رجلاً صنعانياً معه حمولة جلود نمور، ظنوه رسول الدعام إلى ابن العجمي، فأنكر الهادي فعلهم وأمر برد متاعه.
  en: 'The book closes al-Hadi''s answer to Banu Rabi''a, who had asked to raid the villages of Arhab: he feared they would kill people who had not killed them and plunder people who had not plundered them. Muhammad ibn Sulayman reports hearing an angry man of theirs urge his companions to build mosques beside al-Hadi and sit with him; al-Hadi made clear he would begin by fighting anyone who acted without his order, and they declared hearing and obedience. They then stationed a party on the Athafit road and seized a Sanaa man with a load of leopard skins, whom they took for al-Da''am''s messenger to Ibn al-Ajami; al-Hadi rebuked the deed and had the goods returned.'
  ur: 'کتاب میں بنو ربیعہ کو ہادی کا جواب مکمل ہوتا ہے جنہوں نے ارحب کی بستیوں پر حملے کی اجازت مانگی تھی: انہیں اندیشہ تھا کہ وہ ایسے لوگوں کو قتل کریں گے اور لوٹیں گے جنہوں نے انہیں نہ مارا نہ لوٹا۔ محمد بن سلیمان بیان کرتے ہیں کہ انہوں نے ان کے ایک غصے میں آئے شخص کو ساتھیوں سے کہتے سنا کہ ہادی کے ساتھ مسجدیں بنا کر بیٹھ جاؤ؛ ہادی نے واضح کیا کہ جو ان کے حکم کے بغیر کوئی قدم اٹھائے گا وہ اس سے لڑائی کا آغاز کریں گے، تو انہوں نے سمع و طاعت کا اعلان کیا۔ پھر انہوں نے اثافت کے راستے پر ایک جماعت بٹھائی اور صنعاء کے ایک آدمی کو چیتے کی کھالوں کے بوجھ سمیت پکڑ لیا جسے انہوں نے ابن العجمی کی طرف دعام کا قاصد سمجھا؛ ہادی نے ان کے عمل کو ناپسند کیا اور مال واپس کرایا۔'
