label: { ar: "هزيمة صلاح الدين بالرملة", en: "Saladin's Defeat at Ramla" }
summary:
  ar: "في جمادى الأولى سنة ثلاث وسبعين وخمسمائة سار صلاح الدين يوسف بن أيوب من مصر إلى ساحل الشام لغزو بلاد الفرنج، فبلغ عسقلان في الرابع والعشرين منه فنهب العسكر وأسر وأحرق، ولما لم يظهر لهم عسكر فرنجي طمعوا وتفرقوا في الغارة آمنين، فوصل صلاح الدين الرملة قاصداً حصار بعض حصونهم، فازدحم الناس على عبور نهر فأشرف عليهم الفرنج بأطلابهم وأبطالهم ومعه بعض العسكر لأن أكثرهم تفرقوا في طلب الغنيمة، فتقدم محمد ابن أخي صلاح الدين فباشر القتال بين يدي عمه فقتل من أصحابه جماعة، وحمل أحمد بن تقي الدين وهو أول ما تكاملت لحيته فقتل شهيداً، وكان أشد الناس قتالاً ذلك اليوم الفقيه عيسى الهكاري، وتمت الهزيمة على المسلمين وحمل بعض الفرنج على صلاح الدين حتى كاد يصل إليه فمضى منهزماً يقف ليلحقه العسكر حتى دخل الليل فسلك البرية بنفر يسير إلى مصر وهلك كثير من دواب العسكر جوعاً وعطشاً، وذهب أكثر المغيرين بين قتيل وأسير، فمن الأسارى الفقيه عيسى الهكاري من أعيان الأسدية وأخوه الظهير فافتداهما صلاح الدين بعد سنين بستين ألف دينار مع جماعة من الأسرى، ووصل صلاح الدين القاهرة في نصف جمادى الآخرة، ورأى ابن الأثير كتاباً كتبه بخط يده إلى أخيه تورانشاه بدمشق يذكر الوقعة وأوله بيتا شعر {cite:kamil-ibn-al-athir p. 85-86}."
  en: "In Jumada I 573 AH Saladin Yusuf ibn Ayyub set out from Egypt for the Syrian coast to raid Frankish lands. He reached Ascalon on the twenty-fourth of the month, and the army plundered, took captives and burned. Since no Frankish army appeared, they grew bold and scattered in raiding, feeling safe. Saladin reached Ramla, intending to besiege some of the Franks' fortresses; the people crowded to cross a river, and the Franks came down on them with their battle lines and champions while only some of the army was with him, most having dispersed in pursuit of spoil. Muhammad, Saladin's nephew, went forward and fought in front of his uncle, and a number of his companions were killed. Ahmad ibn Taqi al-Din, who had only just grown a full beard, charged and was killed as a martyr. The fiercest fighter that day was the jurist Isa al-Hakkari. The Muslims were routed, and some Franks charged at Saladin until they almost reached him. He fled, halting to let the army catch up, until night fell; then he took the desert road with a small party to Egypt. Many of the army's mounts died of hunger and thirst, and most of the raiders were killed or captured. Among the prisoners were the jurist Isa al-Hakkari, a notable of the Asadiyya, and his brother al-Zahir; Saladin ransomed them years later for sixty thousand dinars, along with a group of other captives. Saladin reached Cairo in mid-Jumada II. Ibn al-Athir saw a letter in Saladin's own hand to his brother Turanshah in Damascus describing the battle; it began with two lines of verse {cite:kamil-ibn-al-athir p. 85-86}."
