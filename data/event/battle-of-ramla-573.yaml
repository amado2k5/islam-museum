label: { ar: "هزيمة صلاح الدين بالرملة" }
summary:
  ar: "في جمادى الأولى سنة ثلاث وسبعين وخمسمائة سار صلاح الدين يوسف بن أيوب من مصر إلى ساحل الشام لغزو بلاد الفرنج، فبلغ عسقلان في الرابع والعشرين منه فنهب العسكر وأسر وأحرق، ولما لم يظهر لهم عسكر فرنجي طمعوا وتفرقوا في الغارة آمنين، فوصل صلاح الدين الرملة قاصداً حصار بعض حصونهم، فازدحم الناس على عبور نهر فأشرف عليهم الفرنج بأطلابهم وأبطالهم ومعه بعض العسكر لأن أكثرهم تفرقوا في طلب الغنيمة، فتقدم محمد ابن أخي صلاح الدين فباشر القتال بين يدي عمه فقتل من أصحابه جماعة، وحمل أحمد بن تقي الدين وهو أول ما تكاملت لحيته فقتل شهيداً، وكان أشد الناس قتالاً ذلك اليوم الفقيه عيسى الهكاري، وتمت الهزيمة على المسلمين وحمل بعض الفرنج على صلاح الدين حتى كاد يصل إليه فمضى منهزماً يقف ليلحقه العسكر حتى دخل الليل فسلك البرية بنفر يسير إلى مصر وهلك كثير من دواب العسكر جوعاً وعطشاً، وذهب أكثر المغيرين بين قتيل وأسير، فمن الأسارى الفقيه عيسى الهكاري من أعيان الأسدية وأخوه الظهير فافتداهما صلاح الدين بعد سنين بستين ألف دينار مع جماعة من الأسرى، ووصل صلاح الدين القاهرة في نصف جمادى الآخرة، ورأى ابن الأثير كتاباً كتبه بخط يده إلى أخيه تورانشاه بدمشق يذكر الوقعة وأوله بيتا شعر {cite:kamil-ibn-al-athir p. 85-86}."
