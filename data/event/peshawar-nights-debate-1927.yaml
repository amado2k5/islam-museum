summary:
  ar: "كتاب يقدّمه مؤلفه العلامة الشيعي الإيراني [[person/sultan-al-waizin-shirazi|سلطان الواعظين شيرازي]] باعتباره تفريغاً لمناظرة علنية دامت عشر ليال في [[place/peshawar|بشاور]] في يناير 1927 أمام عالمي السنة حافظ محمد رشيد والشيخ عبد السلام، في أصول التشيع ومقام أهل البيت وشرعية الخلفاء الثلاثة؛ ويقول النص إن أربعة كتبة فرّغوا الجلسات يومياً للصحف المحلية. وهو ثاني أشهر نص مناظرة شيعي–سني بعد المراجعات، وتطعن أوساط سنية في دقة تفريغه وانحياز تحريره {cite:al-islam-murajaat}."
  en: "A book its author, the Iranian Shia scholar [[person/sultan-al-waizin-shirazi|Sultan al-Wa'izin Shirazi]], presents as the transcript of a public ten-night debate in [[place/peshawar|Peshawar]] in January 1927 against the Sunni scholars Hafiz Muhammad Rashid and Shaykh Abd al-Salam, on the origins of Shi'ism, the standing of the Ahl al-Bayt and the legitimacy of the first three caliphs; the text says four reporters transcribed the sessions daily for local papers. It is the second most famous Shia–Sunni debate text after al-Muraja'at, and Sunni circles dispute its transcription accuracy and editorial one-sidedness {cite:al-islam-murajaat}."
