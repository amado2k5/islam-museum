summary:
  ar: "كتاب يقدّمه مؤلفه العلامة الشيعي الإيراني [[person/sultan-al-waizin-shirazi|سلطان الواعظين شيرازي]] باعتباره تفريغاً لمناظرة علنية دامت عشر ليال في [[place/peshawar|بشاور]] في يناير 1927 أمام عالمي السنة حافظ محمد رشيد والشيخ عبد السلام، في أصول التشيع ومقام أهل البيت وشرعية الخلفاء الثلاثة؛ ويقول النص إن أربعة كتبة فرّغوا الجلسات يومياً للصحف المحلية. وهو ثاني أشهر نص مناظرة شيعي–سني بعد المراجعات، وتطعن أوساط سنية في دقة تفريغه وانحياز تحريره {cite:al-islam-murajaat}."
  en: "A book its author, the Iranian Shia scholar [[person/sultan-al-waizin-shirazi|Sultan al-Wa'izin Shirazi]], presents as the transcript of a public ten-night debate in [[place/peshawar|Peshawar]] in January 1927 against the Sunni scholars Hafiz Muhammad Rashid and Shaykh Abd al-Salam, on the origins of Shi'ism, the standing of the Ahl al-Bayt and the legitimacy of the first three caliphs; the text says four reporters transcribed the sessions daily for local papers. It is the second most famous Shia–Sunni debate text after al-Muraja'at, and Sunni circles dispute its transcription accuracy and editorial one-sidedness {cite:al-islam-murajaat}."
  es: "Un libro que su autor, el erudito chií iraní [[person/sultan-al-waizin-shirazi|Sultan al-Wa'izin Shirazi]], presenta como la transcripción de un debate público de diez noches celebrado en [[place/peshawar|Peshawar]] en enero de 1927 contra los eruditos suníes Hafiz Muhammad Rashid y Shaykh Abd al-Salam, sobre los orígenes del chiismo, la posición de Ahl al-Bayt y la legitimidad de los tres primeros califas; el texto afirma que cuatro reporteros transcribieron las sesiones diariamente para periódicos locales. Es el segundo texto de debate chií-suní más famoso después de al-Muraja'at, y los círculos suníes cuestionan la exactitud de su transcripción y su parcialidad editorial {cite:al-islam-murajaat}."
  fr: "Un ouvrage dont l'auteur, le savant chiite iranien Sultan al-Wa'izin Shirazi, présente le débat public qui s'est tenu à Peshawar en janvier 1927 contre les érudits sunnites Hafiz Muhammad Rashid et Cheikh Abd al-Salam, portait sur les origines du chiisme, le statut des Ahl al-Bayt et la légitimité des trois premiers califes. Le texte indique que quatre journalistes ont retranscrit les débats quotidiennement pour la presse locale. Il s'agit du deuxième texte de débat chiite-sunnite le plus célèbre après al-Muraja'at, et les milieux sunnites contestent l'exactitude de sa transcription et son parti pris éditorial."
  ur: "ایک کتاب اس کے مصنف، ایرانی شیعہ عالم [[شخص/سلطان-الوازین-شیرازی|سلطان الواعظین شیرازی]]، جنوری 1927 میں [[جگہ/پشاور|پشاور]] میں سنی علماء حافظ محمد الرشید، شیخ الاسلام اور شیخ الاسلام کے خلاف دس رات کی عوامی بحث کی نقل کے طور پر پیش کرتے ہیں۔ اہل بیت کا موقف اور پہلے تین خلفاء کی قانونی حیثیت؛ متن میں کہا گیا ہے کہ چار رپورٹرز مقامی اخبارات کے لیے روزانہ سیشن کو نقل کرتے تھے۔ یہ المراجات کے بعد دوسرا سب سے مشہور شیعہ سنی مباحثہ متن ہے، اور سنی حلقے اس کی نقل کی درستگی اور ادارتی یک طرفہ ہونے پر تنازعہ کرتے ہیں۔"
