id: event/second-pledge-of-aqaba
class: event
kind: treaty
label: { ar: "بيعة العقبة الثانية", en: "The second pledge of al-Aqaba" }
summary:
  ar: "في موسم الحج من السنة الثالثة عشرة من البعثة، يونيو 622م، اجتمع نحو ثلاث وسبعين رجلاً وامرأتين من أهل يثرب مع النبي في الشعب عند العقبة، فحضر العباس بن عبد المطلب، وتكلم العباس عن خطورة الحلف، ثم بايعوه على السمع والطاعة والنفقة والأمر بالمعروف والقيام في الله والنصرة، وانتخبوا اثني عشر نقيباً، ثم تسلل شيطان بالصيحة فأمرهم النبي بالانصراف."
  en: "At the pilgrim season of the thirteenth year of the mission, June 622, about seventy-three men and two women from Yathrib met the Prophet secretly at the ravine of al-Aqaba; al-Abbas ibn Abd al-Muttalib spoke of the gravity of the covenant; they pledged hearing and obedience, spending in hardship and ease, enjoining good, standing for God, and protecting him; they chose twelve chiefs, and a voice from the hills gave the alarm, after which the Prophet ordered them to disperse."
