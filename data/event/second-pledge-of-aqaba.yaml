id: event/second-pledge-of-aqaba
class: event
kind: treaty
label: { ar: "بيعة العقبة الثانية", en: "The second pledge of al-Aqaba", es: "El segundo juramento de al-Aqaba", fr: "Le deuxième serment d'al-Aqaba", ur: "عقبہ کا دوسرا عہد" }
summary:
  ar: "في موسم الحج من السنة الثالثة عشرة من البعثة، يونيو 622م، اجتمع نحو ثلاث وسبعين رجلاً وامرأتين من أهل يثرب مع النبي في الشعب عند العقبة، فحضر العباس بن عبد المطلب، وتكلم العباس عن خطورة الحلف، ثم بايعوه على السمع والطاعة والنفقة والأمر بالمعروف والقيام في الله والنصرة، وانتخبوا اثني عشر نقيباً، ثم تسلل شيطان بالصيحة فأمرهم النبي بالانصراف."
  en: "At the pilgrim season of the thirteenth year of the mission, June 622, about seventy-three men and two women from Yathrib met the Prophet secretly at the ravine of al-Aqaba; al-Abbas ibn Abd al-Muttalib spoke of the gravity of the covenant; they pledged hearing and obedience, spending in hardship and ease, enjoining good, standing for God, and protecting him; they chose twelve chiefs, and a voice from the hills gave the alarm, after which the Prophet ordered them to disperse."
  es: "En la temporada de peregrinación del decimotercer año de la misión, en junio de 622, unos setenta y tres hombres y dos mujeres de Yathrib se reunieron en secreto con el Profeta en el barranco de al-Aqaba; al-Abbas ibn Abd al-Muttalib habló de la gravedad del pacto; se comprometieron a escuchar y obedecer, a gastar en la adversidad y en la abundancia, a ordenar el bien, a defender a Dios y a protegerlo; eligieron a doce jefes, y una voz de las colinas dio la alarma, tras lo cual el Profeta les ordenó que se dispersaran."
  fr: "Lors de la saison du pèlerinage de la treizième année de la mission, en juin 622, environ soixante-treize hommes et deux femmes de Yathrib rencontrèrent secrètement le Prophète au ravin d'al-Aqaba; al-Abbas ibn Abd al-Muttalib parla de la gravité de l'alliance; ils s'engagèrent à écouter et à obéir, à dépenser dans l'adversité comme dans l'aisance, à ordonner le bien, à se tenir pour Dieu et à le protéger; ils choisirent douze chefs, et une voix venant des collines donna l'alarme, après quoi le Prophète leur ordonna de se disperser."
  ur: "مشن کے تیرھویں سال جون 622 کے حج کے موسم میں یثرب کے تقریباً 73 مرد اور دو عورتیں عقبہ کی گھاٹی میں خفیہ طور پر رسول اللہ سے ملے۔ العباس ابن عبد المطلب نے عہد کی کشش ثقل کی بات کی۔ انہوں نے سننے اور اطاعت کرنے، سختی اور آسانی میں خرچ کرنے، نیکی کا حکم دینے، خدا کے لیے کھڑے ہونے اور اس کی حفاظت کرنے کا عہد کیا۔ انہوں نے بارہ سرداروں کا انتخاب کیا، اور پہاڑیوں سے ایک آواز نے خطرے کی گھنٹی بجائی، جس کے بعد نبی نے انہیں منتشر ہونے کا حکم دیا۔"
