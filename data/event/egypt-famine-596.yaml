label: { ar: "عام المجاعة الكبرى بمصر", en: "The year of the great famine in Egypt", es: "El año de la gran hambruna en Egipto", fr: "L'année de la grande famine en Égypte", ur: "مصر میں عظیم قحط کا سال" }
summary:
  ar: "وفي سنة ست وتسعين توقف النيل بمصر بحيث كسر ولم يكمل ثلاثة عشر ذراعاً فكان الغلاء المفرط بحيث أكلوا الجيف والآدميين وفشا أكل بني آدم واشتهر ورئي من ذلك العجب العجاب وتعدوا إلى حفر القبور وأكل الموتى وتمزق أهل مصر كل ممزق وكثر الموت من الجوع بحيث كان الماشي لا يقع قدمه أو بصره إلا على ميت أو من هو في السياق وهلك أهل القرى قاطبة بحيث إن المسافر يمر بالقرية فلا يرى فيها نافخ نار ويجد البيوت مفتحة وأهلها موتى وقد حكى الذهبي في ذلك حكايات يقشعر الجلد من سماعها واستمر ذلك إلى أثناء سنة ثمان وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 694-695}."
  en: "In 596 the Nile failed, not making thirteen cubits: the dearth grew so extreme people ate carrion and human flesh — openly, wondrously; they dug graves for the dead. Villagers perished entire — a traveller passed a village with no fire breathing, houses open and their people dead. Al-Dhahabi tells tales the skin crawls to hear; it ran to mid-598 {cite:tarikh-khulafa-minhaj-1434 p. 694-695}."
  es: "En 596, el Nilo se secó, sin alcanzar los trece codos: la escasez se volvió tan extrema que la gente comía carroña y carne humana, abiertamente y con asombro; cavaban tumbas para los muertos. Los aldeanos perecieron por completo: un viajero pasó por una aldea sin fuego, con las casas abiertas y sus habitantes muertos. Al-Dhahabi narra historias escalofriantes; se extendió hasta mediados de 598 {cite:tarikh-khulafa-minhaj-1434 p. 694-695}."
  fr: "En 596, le Nil s'assécha, ne fournissant même pas treize coudées: la famine devint si extrême que les gens se nourrissaient de charognes et de chair humaine – ouvertement, de façon surprenante; ils creusaient des tombes pour les morts. Des villageois périrent tout entiers – un voyageur passa devant un village où le feu ne brûlait plus, les maisons ouvertes et les habitants morts. Al-Dhahabi rapporte des histoires à glacer le sang; la sécheresse dura jusqu'au milieu de l'année 598 {cite: tarikh-khulafa-minhaj-1434 p. 694-695}."
  ur: "596 میں دریائے نیل ناکام ہوا، تیرہ ہاتھ نہیں بنا: کمی اتنی بڑھ گئی کہ لوگ مردار اور انسانی گوشت کھاتے ہیں — کھلے عام، حیرت انگیز طور پر؛ انہوں نے مردوں کے لیے قبریں کھودیں۔ گاؤں والے مکمل طور پر ہلاک ہو گئے - ایک مسافر ایک ایسے گاؤں سے گزرا جہاں آگ کی سانس نہیں تھی، گھر کھلے تھے اور ان کے لوگ مر گئے تھے۔ الذہبی وہ کہانیاں کہتا ہے جو سننے کے لیے جلد رینگتی ہے۔ یہ 598 کے وسط تک چلا {حوالہ:تاریخ-خلفاء منہاج-1434 ص۔ 694-695}۔"
