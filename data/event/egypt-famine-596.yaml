label: { ar: "عام المجاعة الكبرى بمصر" }
summary:
  ar: "وفي سنة ست وتسعين توقف النيل بمصر بحيث كسر ولم يكمل ثلاثة عشر ذراعاً فكان الغلاء المفرط بحيث أكلوا الجيف والآدميين وفشا أكل بني آدم واشتهر ورئي من ذلك العجب العجاب وتعدوا إلى حفر القبور وأكل الموتى وتمزق أهل مصر كل ممزق وكثر الموت من الجوع بحيث كان الماشي لا يقع قدمه أو بصره إلا على ميت أو من هو في السياق وهلك أهل القرى قاطبة بحيث إن المسافر يمر بالقرية فلا يرى فيها نافخ نار ويجد البيوت مفتحة وأهلها موتى وقد حكى الذهبي في ذلك حكايات يقشعر الجلد من سماعها واستمر ذلك إلى أثناء سنة ثمان وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 694-695}."
  en: "In 596 the Nile failed, not making thirteen cubits: the dearth grew so extreme people ate carrion and human flesh — openly, wondrously; they dug graves for the dead. Villagers perished entire — a traveller passed a village with no fire breathing, houses open and their people dead. Al-Dhahabi tells tales the skin crawls to hear; it ran to mid-598 {cite:tarikh-khulafa-minhaj-1434 p. 694-695}."
