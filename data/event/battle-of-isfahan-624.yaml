label: { ar: "ملحمة أصبهان سنة 624هـ", en: "Battle of Isfahan in 624 AH" }
summary:
  ar: "في سنة أربع وعشرين وست مئة جاء الخبر إلى السلطان جلال الدين وهو بتوريز أن التتار قد تصدوا أصبهان وبها أهله فسار إليها وتأهب للملتقى فلما التقى الجمعان خذله أخوه غياث الدين وولى وتبعه جهان بهاوان فكسرت ميمنته ميسرة التتار ثم حملت ميسرته على ميمنة التتار فطحنتها أيضاً وتباشر الناس بالنصر ثم كرت التتار مع كمينها وحملوا حملة واحدة كالسيل وقد أقبل الليل فزالت الأقدام وقتلت الأمراء واشتد القتال وتداعى بنيان جيش جلال الدين وثبت هو في طائفة يسيرة واحتيط به فانهزم على حمية وطعن طعنة لولا الأجل لتلف وتمزق جيشه وكانت ملحمة لم يسمع بمثلها في الملاحم في انهزام كلا الفرقتين وذلك في رمضان {cite:shadharat-dhahab p. 113}."
  en: "In 624 Jalal al-Din marched from Tabriz to relieve Isfahan; at the clash his brother Ghiyath al-Din deserted him, yet his right shattered the Tatar left and his left crushed their right — the people cheered victory — then the Tatars returned with their ambush in one flood-charge as night came on, the amirs fell, Jalal al-Din was ringed with a handful and fled on a war-mare taking a spear-thrust. A battle the like of which was unheard of, both hosts routed, in Ramadan {cite:shadharat-dhahab p. 113}."
