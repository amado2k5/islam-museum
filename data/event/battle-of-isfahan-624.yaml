summary:
  ar: "في سنة أربع وعشرين وست مئة جاء الخبر إلى السلطان جلال الدين وهو بتوريز أن التتار قد تصدوا أصبهان وبها أهله فسار إليها وتأهب للملتقى فلما التقى الجمعان خذله أخوه غياث الدين وولى وتبعه جهان بهاوان فكسرت ميمنته ميسرة التتار ثم حملت ميسرته على ميمنة التتار فطحنتها أيضاً وتباشر الناس بالنصر ثم كرت التتار مع كمينها وحملوا حملة واحدة كالسيل وقد أقبل الليل فزالت الأقدام وقتلت الأمراء واشتد القتال وتداعى بنيان جيش جلال الدين وثبت هو في طائفة يسيرة واحتيط به فانهزم على حمية وطعن طعنة لولا الأجل لتلف وتمزق جيشه وكانت ملحمة لم يسمع بمثلها في الملاحم في انهزام كلا الفرقتين وذلك في رمضان {cite:shadharat-dhahab p. 113}."
  en: "In 624 Jalal al-Din marched from Tabriz to relieve Isfahan; at the clash his brother Ghiyath al-Din deserted him, yet his right shattered the Tatar left and his left crushed their right — the people cheered victory — then the Tatars returned with their ambush in one flood-charge as night came on, the amirs fell, Jalal al-Din was ringed with a handful and fled on a war-mare taking a spear-thrust. A battle the like of which was unheard of, both hosts routed, in Ramadan {cite:shadharat-dhahab p. 113}."
  fr: "En 624, Jalal al-Din marcha de Tabriz au secours d'Ispahan ; au moment du choc, son frère Ghiyath al-Din l'abandonna, mais son aile droite brisa l'aile gauche tatare et son aile gauche écrasa leur droite, et les gens crièrent victoire ; puis les Tatars revinrent avec leur embuscade en une seule charge déferlante à la tombée de la nuit, les émirs tombèrent, Jalal al-Din fut encerclé avec une poignée d'hommes et s'enfuit sur une jument de guerre, atteint d'un coup de lance. Une bataille sans pareille, où les deux armées furent mises en déroute, en Ramadan {cite:shadharat-dhahab p. 113}."
  es: "En 624, Jalal al-Din marchó desde Tabriz para socorrer Isfahán; en el enfrentamiento, su hermano Ghiyath al-Din lo abandonó, pero su flanco derecho destrozó al izquierdo tártaro y su izquierda aplastó al derecho de este; el pueblo aclamó la victoria. Entonces, los tártaros regresaron con su emboscada en una carga masiva al caer la noche, los emires cayeron, Jalal al-Din fue rodeado por un puñado de hombres y huyó en una yegua de guerra recibiendo una estocada de lanza. Una batalla sin precedentes, ambos ejércitos derrotados, en Ramadán {cita: shadharat-dhahab p. 113}."
  ur: "624 میں جلال الدین نے تبریز سے اصفہان کو آزاد کرنے کے لیے مارچ کیا۔ جھڑپ میں اس کے بھائی غیاث الدین نے اسے چھوڑ دیا، پھر بھی اس کے دائیں نے تاتاری بائیں کو توڑ دیا اور اس کے بائیں نے ان کے دائیں کو کچل دیا - لوگوں نے فتح کا جشن منایا - پھر تاتاری اپنی گھات کے ساتھ واپس لوٹے ایک ہی سیلاب میں جب رات ہوئی، امیر گر گئے، جلال الدین کو مٹھی بھر کر مارا گیا اور جنگی مارو لے کر بھاگ گیا۔ رمضان المبارک میں ایک ایسی جنگ جس کے بارے میں سنا نہیں گیا تھا، دونوں میزبانوں نے شکست دی تھی۔ 113}۔"
  tr: "Hicri 624 yılında, Turiz'de bulunan Sultan Celaleddin'e Tatarların, halkının bulunduğu İsfahan'a saldırdığı haberi ulaştı. Bunun üzerine İsfahan'a doğru yola koyuldu ve çatışmaya hazırlandı. İki ordu karşılaştığında, kardeşi Gıyateddin onu terk edip geri döndü, ardından Cihan Bhavan da onu takip etti. Sağ kanadı Tatarların sol kanadını dağıttı, ardından sol kanadı Tatarların sağ kanadına saldırdı ve onu da ezdi. Halk zaferle sevindi. Sonra Tatarlar pusu kurarak sel gibi tek bir saldırı başlattılar. Gece çökmüştü, ayaklar kayıyordu, prensler öldürüldü ve çatışmalar şiddetlendi. Celaleddin'in ordusunun yapısı çöktü ve o küçük bir grupla dimdik durdu. Kuşatıldı ve büyük bir coşkuyla kaçtı; eğer ölmeseydi ordusunu yok edip parçalayacak bir darbe aldı. Bu, daha önce destansı savaşlarda benzeri görülmemiş, her iki tarafın da yenilgiye uğradığı destansı bir savaştı. Bu olay Ramazan ayında gerçekleşti. {cite:shadharat-dhahab s. 113}"
  id: "Pada tahun 624 H, kabar sampai kepada Sultan Jalal al-Din, yang berada di Turiz, bahwa Tatar telah menyerang Isfahan, tempat rakyatnya berada. Maka ia bergerak menuju Isfahan dan bersiap untuk pertempuran. Ketika kedua pasukan bertemu, saudaranya, Ghiyath al-Din, meninggalkannya dan berbalik, diikuti oleh Jahan Bhawan. Sayap kanannya menghancurkan sayap kiri Tatar, kemudian sayap kirinya menyerang sayap kanan Tatar dan menghancurkannya juga. Rakyat bersukacita atas kemenangan tersebut. Kemudian Tatar menyerang dengan penyergapan mereka dan melancarkan serangan tunggal seperti banjir. Malam telah tiba, sehingga langkah kaki tergelincir, para pangeran terbunuh, dan pertempuran semakin intensif. Struktur pasukan Jalal al-Din runtuh, dan ia bertahan dengan kelompok kecil. Ia dikepung dan melarikan diri dalam keadaan panik, dan ia terkena pukulan yang, seandainya bukan karena kematian, akan menghancurkan dan mencabik-cabik pasukannya. Itu adalah pertempuran epik yang belum pernah terjadi sebelumnya, dengan kekalahan kedua belah pihak. Ini terjadi di bulan Ramadhan. {mengutip:shadharat-dhahab hal. 113}"
