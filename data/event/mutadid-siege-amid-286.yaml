label: { ar: "حصار المعتضد لآمد" }
summary:
  ar: "في ربيع الآخر سنة ست وثمانين ومائتين وصل المعتضد إلى آمد فأناخ بجنده عليها وحاصرها ونصب المنجنيقات، فبعث رئيسها يطلب الأمان فأمّنه وخرج إليه فخلع عليه، وأقام المعتضد بها بقية جمادى الأولى وعشرين يومًا من جمادى الآخرة ثم ارتحل وأمر بهدم سورها فهُدم بعضه ولم يُقدر على هدم الباقي، وهنّأه ابن المعتز بالفتح شعرًا {cite:muntazam-ibn-al-jawzi p. 307-309}."
  en: "In Rabi' II 286 al-Mu'tadid camped his army on Amid, set mangonels and besieged it; its lord sought and received aman, came out and was robed; the caliph stayed into Jumada II, then left ordering the wall razed — only part could be demolished; Ibn al-Mu'tazz greeted the conquest in verse {cite:muntazam-ibn-al-jawzi p. 307-309}."
