id: event/birth-taj-al-din-subki-727
class: event
kind: other
label:
  ar: "مولد تاج الدين السبكي بالقاهرة، نحو ٧٢٧هـ/١٣٢٧م"
  en: "Birth of Taj al-Din al-Subki in Cairo, c. 727/1327"
  ur: "تاج الدین سبکی کی پیدائش، قاہرہ، تقریباً 727ھ/1327ء"
  fr: "La naissance de Taj al-Din al-Subki au Caire, vers 727/1327"
  es: "Nacimiento de Taj al-Din al-Subki en El Cairo, c. 727/1327"
  tr: "Tac el-Din el-Subki'nin doğumu, Hicri 727/Miladi 1327 civarında Kahire'de gerçekleşti."
  id: "Kelahiran Taj al-Din al-Subki di Kairo, sekitar tahun 727 H/1327 M"
summary:
  ar: "وُلد عبد الوهاب بن علي بن عبد الكافي بن علي بن تمام، تاج الدين أبو النصر السبكي الأنصاري الخزرجي الشافعي، بالقاهرة سنة ٧٢٧هـ أو ٧٢٨هـ أو ٧٢٩هـ، أي نحو ١٣٢٧–١٣٢٩م؛ وفي «المعجم الصغير» للذهبي أن مولده سنة ٧٢٨هـ {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam — Taj al-Din Abu al-Nasr al-Subki al-Ansari al-Khazraji al-Shafi'i — was born in Cairo in 727, 728 or 729 AH (c. 1327–1329 CE); al-Dhahabi's Mu'jam al-Saghir gives 728 {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "عبد الوہاب بن علی بن عبد الکافی بن علی بن تمام، تاج الدین ابو نصر سبکی انصاری خزرجی شافعی، قاہرہ میں 727، 728 یا 729ھ ⁦(تقریباً 1327–1329ء)⁩ میں پیدا ہوئے؛ ذہبی کے معجم صغیر میں 728ھ ہے {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
  fr: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Taj al-Din Abu al-Nasr al-Subki al-Ansari al-Khazraji al-Shafi'i, naquit au Caire en 727, 728 ou 729 H (vers 1327-1329 apr. J.-C.) ; le Mu'jam al-Saghir d'al-Dhahabi donne 728 {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  es: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam - Taj al-Din Abu al-Nasr al-Subki al-Ansari al-Khazraji al-Shafi'i - nació en El Cairo en 727, 728 o 729 d. H. (c. 1327-1329 d. C.); Mu'jam al-Saghir de al-Dhahabi da 728 {cita:durar-kamina-jil-1993 2/425} {cita:enciclopedia-of-islam-2 vol. 9p. 745}."
  tr: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Tac al-Din Ebu el-Nasr el-Subki el-Ensari el-Hazraji el-Şafi'i, 727 H., 728 H. veya 729 H., yani MS 1327-1329 civarında Kahire'de doğdu; el-Zehebi'nin \"El-Mu'cem el-Sağhir\" adlı eserinde ise onun H. 728 yılında doğduğu belirtilmektedir {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 s. 745}."
  id: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Taj al-Din Abu al-Nasr al-Subki al-Ansari al-Khazraji al-Shafi'i, lahir di Kairo pada tahun 727 H, 728 H, atau 729 H, yaitu sekitar tahun 1327–1329 M; dan dalam “Al-Mu’jam al-Saghir” karya al-Dhahabi disebutkan bahwa beliau lahir pada tahun 728 H {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 hal. 745}."
