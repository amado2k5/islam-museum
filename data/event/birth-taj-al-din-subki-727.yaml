id: event/birth-taj-al-din-subki-727
class: event
kind: other
label:
  ar: "مولد تاج الدين السبكي بالقاهرة، نحو ٧٢٧هـ/١٣٢٧م"
  en: "Birth of Taj al-Din al-Subki in Cairo, c. 727/1327"
  ur: "تاج الدین سبکی کی پیدائش، قاہرہ، تقریباً 727ھ/1327ء"
summary:
  ar: "وُلد عبد الوهاب بن علي بن عبد الكافي بن علي بن تمام، تاج الدين أبو النصر السبكي الأنصاري الخزرجي الشافعي، بالقاهرة سنة ٧٢٧هـ أو ٧٢٨هـ أو ٧٢٩هـ، أي نحو ١٣٢٧–١٣٢٩م؛ وفي «المعجم الصغير» للذهبي أن مولده سنة ٧٢٨هـ {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Abd al-Wahhab ibn Ali ibn Abd al-Kafi ibn Ali ibn Tamam — Taj al-Din Abu al-Nasr al-Subki al-Ansari al-Khazraji al-Shafi'i — was born in Cairo in 727, 728 or 729 AH (c. 1327–1329 CE); al-Dhahabi's Mu'jam al-Saghir gives 728 {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "عبد الوہاب بن علی بن عبد الکافی بن علی بن تمام، تاج الدین ابو نصر سبکی انصاری خزرجی شافعی، قاہرہ میں 727، 728 یا 729ھ (تقریباً 1327–1329ء) میں پیدا ہوئے؛ ذہبی کے معجم صغیر میں 728ھ ہے {cite:durar-kamina-jil-1993 2/425} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
