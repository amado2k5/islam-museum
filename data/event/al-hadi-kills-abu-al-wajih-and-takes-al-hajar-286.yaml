id: event/al-hadi-kills-abu-al-wajih-and-takes-al-hajar-286
class: event
kind: other
label:
  ar: قتل الهادي أبا الوجيه وأخذه الحجر، ذو الحجة 286هـ
  en: Al-Hadi kills Abu al-Wajih and takes al-Hajar, Dhu al-Hijja 286 AH
  ur: ہادی کا ابو الوجیہ کو مارنا اور الحجر پر قبضہ، ذی الحجہ 286ھ
  es: "Al-Hadi mata a Abu al-Wajih y toma al-Hajar, Dhu al-Hijja 286 AH"
  fr: "Al-Hadi tue Abu al-Wajih et prend al-Hajar, Dhu al-Hijja 286 AH"
  tr: "El-Hadi, Ebu el-Vajih'i öldürdü ve onu taşa götürdü. Bu olay Hicri 286 yılının Zilhicce ayında gerçekleşti."
  id: "Al-Hadi membunuh Abu al-Wajih dan membawanya ke batu, Dzul Hijjah 286 H."
summary:
  ar: يطعن الهادي أبا الوجيه، أحد صناديد بني الحارث، وهو يتعلق بجدار قصير بين الزقاق والمسجد، ويقتله بعد أن ينكسر رمحه، فيحزّ أصحابه رأسه ويرسله إلى عبد الله بن الحسين فيلقيه إلى بني الحارث، فينهزمون ويدخل أهل الدروب فتؤخذ القرية ويؤتى بابن حميد.
  en: Al-Hadi spears Abu al-Wajih, one of the chiefs of Banu al-Harith, as he climbs a low wall between the lane and the mosque, and kills him once his spear is broken; his companions cut off the head and it is sent to Abdullah ibn al-Husayn, who has it thrown to Banu al-Harith; they flee, the people of the lanes join in, the village is taken and Ibn Humayd is brought in.
  ur: ہادی بنو حارث کے سرداروں میں سے ابو الوجیہ کو اس وقت نیزہ مارتے ہیں جب وہ گلی اور مسجد کے بیچ کی چھوٹی دیوار پر چڑھ رہا تھا، اور نیزہ ٹوٹ جانے کے بعد اسے قتل کرتے ہیں؛ ساتھی اس کا سر کاٹتے ہیں اور عبداللہ بن حسین کو بھیجتے ہیں جو اسے بنو حارث کی طرف پھنکوا دیتے ہیں؛ وہ بھاگتے ہیں، کوچوں والے شریک ہو جاتے ہیں، بستی لے لی جاتی ہے اور ابن حمید کو لایا جاتا ہے۔
  es: "Al-Hadi atraviesa con su lanza a Abu al-Wajih, uno de los jefes de Banu al-Harith, mientras este trepa por un muro bajo entre el callejón y la mezquita, y lo mata una vez que su lanza se rompe; sus compañeros le cortan la cabeza y se la envían a Abdullah ibn al-Husayn, quien la hace arrojar a Banu al-Harith; estos huyen, la gente de los callejones se une a la lucha, toman la aldea y traen a Ibn Humayd."
  fr: "Al-Hadi transperce de sa lance Abu al-Wajih, l'un des chefs des Banu al-Harith, alors qu'il escalade un muret entre la ruelle et la mosquée, et le tue une fois sa lance brisée; ses compagnons lui coupent la tête et l'envoient à Abdullah ibn al-Husayn, qui la fait jeter aux Banu al-Harith; ils s'enfuient, les habitants des ruelles se joignent à eux, le village est pris et Ibn Humayd est amené."
  tr: "El-Hadi, Beni el-Harith'in liderlerinden Ebu el-Vajih'i, sokak ile cami arasındaki alçak bir duvardan asılıyken bıçaklar ve mızrağı kırılınca öldürür. Arkadaşları başını kesip Abdullah bin el-Hüseyin'e gönderirler; o da başı Beni el-Harith'e atar. Böylece Beni el-Harith yenilgiye uğrar, sokak halkı içeri girer, köy ele geçirilir ve İbn Hamid getirilir."
  id: "Al-Hadi menikam Abu al-Wajih, salah satu pemimpin Bani al-Harith, saat ia tergantung di tembok rendah antara gang dan masjid, dan membunuhnya setelah tombaknya patah. Para pengikutnya memenggal kepalanya dan mengirimkannya kepada Abdullah bin al-Hussein, yang melemparkannya ke Bani al-Harith, sehingga mereka dikalahkan dan penduduk gang masuk, dan desa itu direbut dan Ibnu Hamid dibawa masuk."
