  id: "Ala ad-Din Muhammad Khwarazm Shah memerintah Transoxiana, dan Khorasan dilanda perselisihan setelah pembunuhan Shihab ad-Din, sehingga ia mereformasinya dan membawa keamanan ke sana {cite:kamil-ibn-al-athir p. 333}."
