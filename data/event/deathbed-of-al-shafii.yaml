label: { ar: "مرض الشافعي بمصر وكلمته للمزني ووفاته ودفنه بالقرافة", en: "Last illness, words to al-Muzani and burial of al-Shafi'i in Egypt", ur: "امام شافعی کا مصر میں مرضِ وفات، مزنی سے کلام اور قرافہ میں تدفین", es: "Última enfermedad, palabras a al-Muzani y entierro de al-Shafi'i en Egipto.", fr: "Dernière maladie, hommage à al-Muzani et inhumation d'al-Shafi'i en Égypte", tr: "Şafiî'nin Mısır'daki hastalığı, Müzani'ye yaptığı konuşma, ölümü ve Karafa'daki defni.", id: "Penyakit Al-Shafi'i di Mesir, pidatonya kepada Al-Muzani, kematiannya, dan pemakamannya di Al-Qarafa" }
summary:
  ar: "روى المزني أنه دخل على الشافعي في مرضه الذي مات فيه فسأله كيف أصبحت، فقال: أصبحت من الدنيا راحلاً ولإخواني مفارقاً ولسوء عملي ملاقياً وعلى الله وارداً، وما أدري أروحي تصير إلى جنة فأهنئها أو إلى نار فأعزّيها، ثم بكى وأنشد أبياتاً في رجائه عفو الله {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}. وقال الربيع بن سليمان إنه قال له يوم الأحد إنه يودّ لو تعلّم الخلق كتبه على ألا يُنسب إليه منها شيء، ومات يوم الخميس، وانصرفوا من جنازته ليلة الجمعة فرأوا هلال شعبان سنة أربع ومئتين {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}. ودُفن بالقرافة الصغرى ويُزار قبره {cite:wafayat-ayan scan vol. 4 p. 464}. ويقول الذهبي إن وصية الشافعي من رواية الحسين بن هشام البلدي غير صحيحة {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  en: "Al-Muzani relates that he visited al-Shafi'i in his last illness and asked how he found himself that morning; al-Shafi'i said he was a departer from the world, a parter from his brothers, a meeter of his own bad deeds and a comer to God, and that he did not know whether his soul was going to Paradise, to be congratulated, or to the Fire, to be consoled; then he wept and recited verses on hoping for God's pardon {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}. Al-Rabi' ibn Sulayman says that on Sunday al-Shafi'i told him he wished everyone would learn his books on condition that nothing in them be attributed to him; he died on Thursday and they returned from the funeral on Friday night and saw the crescent of Sha'ban in 204 {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}. He was buried in the Lesser Qarafa and his grave is visited there {cite:wafayat-ayan scan vol. 4 p. 464}. Al-Dhahabi says the 'will of al-Shafi'i' reported by al-Husayn ibn Hisham al-Baladi is not sound {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  ur: "مزنی روایت کرتے ہیں کہ وہ امام شافعی کی آخری بیماری میں ان کے پاس گئے اور پوچھا کہ صبح کیسی ہوئی؛ فرمایا: میں دنیا سے رخصت ہو رہا ہوں، بھائیوں سے جدا ہو رہا ہوں، اپنے برے اعمال سے ملنے والا اور اللہ پر وارد ہونے والا ہوں، اور نہیں جانتا کہ میری روح جنت کی طرف جائے گی کہ اسے مبارک دوں یا آگ کی طرف کہ اس سے تعزیت کروں؛ پھر رو پڑے اور اللہ کے عفو کی امید پر اشعار پڑھے {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}۔ ربیع بن سلیمان کہتے ہیں کہ اتوار کے دن امام نے ان سے کہا کہ وہ چاہتے ہیں سب لوگ ان کی کتابیں سیکھ لیں بشرطیکہ ان میں سے کچھ ان کی طرف منسوب نہ ہو؛ وہ جمعرات کو فوت ہوئے اور ہم جمعہ کی رات جنازے سے لوٹے تو 204ھ کے شعبان کا ہلال دیکھا {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}۔ انھیں قرافۂ صغریٰ میں دفن کیا گیا اور وہاں ان کی قبر کی زیارت کی جاتی ہے {cite:wafayat-ayan scan vol. 4 p. 464}۔ ذہبی کہتے ہیں کہ حسین بن ہشام بلدی کی روایت سے مروی «وصیتِ شافعی» صحیح نہیں {cite:siyar-alam-nubala scan vol. 1 p. 3293}۔"
  es: "Al-Muzani relata que visitó a al-Shafi'i en su última enfermedad y le preguntó cómo se encontraba esa mañana; al-Shafi'i dijo que era un partidario del mundo, un partidario de sus hermanos, un encuentro con sus propias malas acciones y un acercante a Dios, y que no sabía si su alma iba al Paraíso, para ser felicitada, o al Fuego, para ser consolada; luego lloró y recitó versículos sobre la esperanza del perdón de Dios {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}. Al-Rabi' ibn Sulayman dice que el domingo al-Shafi'i le dijo que deseaba que todos estudiaran sus libros con la condición de que nada en ellos se le atribuyera; Murió el jueves y regresaron del funeral el viernes por la noche y vieron la luna creciente de Sha'ban en 204 {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}. Fue enterrado en el Qarafa Menor y su tumba es visitada allí {cite:wafayat-ayan scan vol. 4 p. 464}. Al-Dhahabi dice que el 'testamento de al-Shafi'i' reportado por al-Husayn ibn Hisham al-Baladi no es válido {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  fr: "Al-Muzani rapporte qu'il rendit visite à al-Shafi'i lors de sa dernière maladie et lui demanda comment il se sentait ce matin-là. Al-Shafi'i répondit qu'il quittait ce monde, qu'il était séparé de ses frères, qu'il faisait face à ses propres fautes et qu'il se tournait vers Dieu. Il ajouta qu'il ignorait si son âme rejoindrait le Paradis, pour y être félicitée, ou le Feu, pour y être consolée. Puis il pleura et récita des versets implorant le pardon de Dieu. Al-Rabi' ibn Sulayman rapporte que, le dimanche, al-Shafi'i lui confia qu'il souhaitait que tous étudient ses ouvrages à condition qu'aucune citation ne lui soit attribuée. Il mourut jeudi et, de retour des funérailles vendredi soir, ils aperçurent le croissant de lune de Sha'ban en 204 (source: Tarikh Islam Dhahabi, vol. 17, p. 341). Il fut inhumé à Petite Qarafa, où sa tombe est visitée (source: Wafayat Ayan, vol. 4, p. 464). Al-Dhahabi affirme que le testament d'al-Shafi'i, rapporté par al-Husayn ibn Hisham al-Baladi, est erroné (source: Siyar Alam Nubala, vol. 1, p. 3293)."
  tr: "El-Muzani, Şafiî'nin vefat ettiği hastalık döneminde onu ziyaret ettiğini ve nasıl olduğunu sorduğunu rivayet etmiştir. Şafiî, \"Bu dünyadan ayrılıyorum, kardeşlerimden ayrılıyorum, kötü amellerimin sonuçlarıyla yüzleşiyorum ve Allah'a dönüyorum. Ruhumun cennete mi gideceğini, yoksa cehenneme mi gideceğini, onu tebrik etmek için mi gideceğini bilmiyorum.\" diye cevap vermiştir. Sonra ağlamış ve Allah'tan bağışlanma umudunu ifade eden ayetler okumuştur. El-Rabi' ibn Sulayman, Şafiî'nin kendisine Pazar günü, kitaplarında kendisine hiçbir şey atfedilmemesi şartıyla, insanların kitaplarını okumasını dilediğini söylediğini aktarmıştır. Şafiî Perşembe günü vefat etmiş, cenazesi Cuma gecesi açılmış ve Hicri 204 yılında Şaban ayının hilalini görmüşlerdir. Küçük Karafa'ya defnedilmiş olup, mezarı ziyaret edilmektedir. {Kaynak: Wafayat-ayan, cilt 4, sayfa 464} El-Dhahabi, El-Hüseyn ibn Hişam El-Baladi tarafından rivayet edilen El-Şafiî'nin vasiyetinin sahih olmadığını söyler. {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  id: "Al-Muzani meriwayatkan bahwa ia mengunjungi Al-Shafi'i selama sakit yang menyebabkan kematiannya dan bertanya bagaimana keadaannya. Beliau menjawab, \"Aku akan meninggalkan dunia ini, berpisah dengan saudara-saudaraku, menghadapi akibat dari perbuatan jahatku, dan kembali kepada Allah. Aku tidak tahu apakah jiwaku akan pergi ke Surga, agar aku dapat mengucapkan selamat kepadanya, atau ke Neraka, agar aku dapat menghiburnya.\" Kemudian beliau menangis dan membaca ayat-ayat yang mengungkapkan harapannya akan pengampunan Allah. Al-Rabi' ibn Sulayman berkata bahwa Al-Shafi'i mengatakan kepadanya pada hari Minggu bahwa ia berharap orang-orang akan mempelajari buku-bukunya, dengan syarat tidak ada satu pun bagian di dalamnya yang dinisbahkan kepadanya. Beliau meninggal pada hari Kamis, dan mereka meninggalkan pemakamannya pada Jumat malam dan melihat bulan sabit Sya'ban pada tahun 204 Hijriah. Beliau dimakamkan di Qarafa Kecil, dan makamnya dikunjungi. {cite:wafayat-ayan scan vol. 4 p. 464}. Al-Dhahabi mengatakan bahwa wasiat Al-Shafi'i, sebagaimana diriwayatkan oleh Al-Husayn ibn Hisham Al-Baladi, tidak sahih. {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
