tags: [wasaya-browser, wasaya-successors, wasaya-wasiyya, wasaya-ihtidar, wasaya-marqad]
label: { ar: "مرض الشافعي بمصر وكلمته للمزني ووفاته ودفنه بالقرافة", en: "Last illness, words to al-Muzani and burial of al-Shafi'i in Egypt", ur: "امام شافعی کا مصر میں مرضِ وفات، مزنی سے کلام اور قرافہ میں تدفین" }
summary:
  ar: "روى المزني أنه دخل على الشافعي في مرضه الذي مات فيه فسأله كيف أصبحت، فقال: أصبحت من الدنيا راحلاً ولإخواني مفارقاً ولسوء عملي ملاقياً وعلى الله وارداً، وما أدري أروحي تصير إلى جنة فأهنئها أو إلى نار فأعزّيها، ثم بكى وأنشد أبياتاً في رجائه عفو الله {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}. وقال الربيع بن سليمان إنه قال له يوم الأحد إنه يودّ لو تعلّم الخلق كتبه على ألا يُنسب إليه منها شيء، ومات يوم الخميس، وانصرفوا من جنازته ليلة الجمعة فرأوا هلال شعبان سنة أربع ومئتين {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}. ودُفن بالقرافة الصغرى ويُزار قبره {cite:wafayat-ayan scan vol. 4 p. 464}. ويقول الذهبي إن وصية الشافعي من رواية الحسين بن هشام البلدي غير صحيحة {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  en: "Al-Muzani relates that he visited al-Shafi'i in his last illness and asked how he found himself that morning; al-Shafi'i said he was a departer from the world, a parter from his brothers, a meeter of his own bad deeds and a comer to God, and that he did not know whether his soul was going to Paradise, to be congratulated, or to the Fire, to be consoled; then he wept and recited verses on hoping for God's pardon {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}. Al-Rabi' ibn Sulayman says that on Sunday al-Shafi'i told him he wished everyone would learn his books on condition that nothing in them be attributed to him; he died on Thursday and they returned from the funeral on Friday night and saw the crescent of Sha'ban in 204 {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}. He was buried in the Lesser Qarafa and his grave is visited there {cite:wafayat-ayan scan vol. 4 p. 464}. Al-Dhahabi says the 'will of al-Shafi'i' reported by al-Husayn ibn Hisham al-Baladi is not sound {cite:siyar-alam-nubala scan vol. 1 p. 3293}."
  ur: "مزنی روایت کرتے ہیں کہ وہ امام شافعی کی آخری بیماری میں ان کے پاس گئے اور پوچھا کہ صبح کیسی ہوئی؛ فرمایا: میں دنیا سے رخصت ہو رہا ہوں، بھائیوں سے جدا ہو رہا ہوں، اپنے برے اعمال سے ملنے والا اور اللہ پر وارد ہونے والا ہوں، اور نہیں جانتا کہ میری روح جنت کی طرف جائے گی کہ اسے مبارک دوں یا آگ کی طرف کہ اس سے تعزیت کروں؛ پھر رو پڑے اور اللہ کے عفو کی امید پر اشعار پڑھے {cite:tabaqat-shafiiyya-kubra-subki-hajr vol. 1 p. 295} {cite:siyar-alam-nubala scan vol. 1 p. 3293}۔ ربیع بن سلیمان کہتے ہیں کہ اتوار کے دن امام نے ان سے کہا کہ وہ چاہتے ہیں سب لوگ ان کی کتابیں سیکھ لیں بشرطیکہ ان میں سے کچھ ان کی طرف منسوب نہ ہو؛ وہ جمعرات کو فوت ہوئے اور ہم جمعہ کی رات جنازے سے لوٹے تو 204ھ کے شعبان کا ہلال دیکھا {cite:tarikh-islam-dhahabi scan vol. 17 p. 341}۔ انھیں قرافۂ صغریٰ میں دفن کیا گیا اور وہاں ان کی قبر کی زیارت کی جاتی ہے {cite:wafayat-ayan scan vol. 4 p. 464}۔ ذہبی کہتے ہیں کہ حسین بن ہشام بلدی کی روایت سے مروی «وصیتِ شافعی» صحیح نہیں {cite:siyar-alam-nubala scan vol. 1 p. 3293}۔"
