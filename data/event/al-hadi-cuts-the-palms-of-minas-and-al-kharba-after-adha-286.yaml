id: event/al-hadi-cuts-the-palms-of-minas-and-al-kharba-after-adha-286
class: event
kind: other
label:
  ar: قطع الهادي نخل ميناس والخربة بعد الأضحى بأيام، ذو الحجة 286هـ
  en: Al-Hadi cuts the palms at Minas and al-Kharba some days after Adha, Dhu al-Hijja 286 AH
  ur: عید الاضحیٰ کے چند دن بعد ہادی کا میناس اور خربہ کے کھجور کے درخت کاٹنا، ذوالحجہ 286ھ
summary:
  ar: بعد العيد بأيام يسير الهادي إلى ميناس لهدمها فلا يخرج إليه أحد، ويبلغ بني الحارث خبره ووعيده في الشعر وما كان بميناس فيمتلئون رعباً ويتحصنون، ويقطع نخلهم، ثم يغدو إلى موضع يقال له الخربة فيأمر بنخل فيها فيُقطع.
  en: Some days after the feast al-Hadi goes to Minas to pull it down and none comes out to him; Banu al-Harith hear of him, of his threats in verse and of what happened at Minas, are filled with fear and shut themselves in their forts, and he cuts their palms, then one day goes to a place called al-Kharba and orders its palms cut.
  ur: عید کے چند دن بعد ہادی میناس کو گرانے جاتے ہیں اور کوئی ان کے سامنے نہیں نکلتا؛ بنو حارث کو ان کی خبر، اشعار میں ان کی دھمکی اور میناس میں جو ہوا وہ پہنچتا ہے تو ان کے دل خوف سے بھر جاتے ہیں اور وہ قلعوں میں بند ہو جاتے ہیں، وہ ان کے کھجور کے درخت کاٹتے ہیں، پھر ایک دن خربہ نامی مقام پر جا کر وہاں کے درخت کٹوا دیتے ہیں۔
