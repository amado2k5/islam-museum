label:
  ar: "ابن النفيس يشتغل بالطب على مهذب الدين الدخوار بدمشق، قبل ٦٢٨هـ"
  en: "Ibn al-Nafis studies medicine under Muhadhdhib al-Din al-Dakhwar at Damascus, before 628/1230"
  ur: "ابن نفیس دمشق میں مہذب الدین دخوار سے طب کی تعلیم حاصل کرتے ہیں، 628ھ/1230ء سے پہلے"
  es: "Ibn al-Nafis estudia medicina con Muhadhdhib al-Din al-Dakhwar en Damasco, antes de 628/1230."
  fr: "Ibn al-Nafis étudie la médecine auprès de Muhadhdhib al-Din al-Dakhwar à Damas, avant 628/1230"
  tr: "İbnü'n-Nefis, H. 628'den önce Şam'da Muhadhib al-Din al-Dekhwar'ın yanında tıp okudu."
  id: "Ibnu al-Nafis belajar kedokteran di bawah bimbingan Muhadhdhib al-Din al-Dakhwar di Damaskus, sebelum tahun 628 H."
summary:
  ar: "اشتغل ابن النفيس في الطب على الشيخ مهذب الدين الدخوار شيخ الطب بدمشق وصاحب المدرسة التي بالصاغة العتيقة على الأطباء، فبرع في الصناعة والعلاج {cite:tarikh-islam-dhahabi s.a. 687 p. 312}؛ والدخوار متوفى سنة ٦٢٨هـ، فيكون الاشتغال عليه قبل ذلك {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}. ويروي طارق السويدان في برنامج «المبدعون» أن أزمة صحية عرضت له سنة ٦٢٩هـ وهو ابن اثنتين وعشرين دفعته إلى دراسة الطب، وأنه التحق بالمستشفى النوري بدمشق فدرس على مهذب الدين عبد الرحيم وعمران الإسرائيلي {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}."
  en: "Ibn al-Nafis studied medicine under the shaykh Muhadhdhib al-Din al-Dakhwar, Damascus's shaykh of medicine and endower of the physicians' madrasa in the old goldsmiths' quarter, and he excelled in the craft and in treatment {cite:tarikh-islam-dhahabi s.a. 687 p. 312}; al-Dakhwar died in 628/1230, so the apprenticeship predates that year {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}. Tariq al-Suwaydan's al-Mubdi'un adds that a health crisis in 629 AH, when he was twenty-two, drove him to medicine, and that he enrolled at the Nuri hospital in Damascus studying under Muhadhdhib al-Din Abd al-Rahim and Imran al-Isra'ili {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}."
  ur: "ابن نفیس نے دمشق میں شیخ مہذب الدین دخوار — جو دمشق کے شیخ الطب اور زرگرون کی قدیم محلہ میں اطباء کے مدرسے کے واقف تھے — سے طب پڑھی اور صنعت اور علاج میں مہارت حاصل کی {cite:tarikh-islam-dhahabi s.a. 687 p. 312}؛ دخوار کی وفات 628ھ/1230ء میں ہوئی، اس لیے یہ تحصیل اس سے پہلے کی ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}۔ طارق سویدان کے پروگرام «المبدعون» کے مطابق 629ھ میں بائیس سال کی عمر میں ایک صحت کا بحران انھیں طب کی طرف لایا اور وہ دمشق کے نوری اسپتال میں داخل ہوئے جہاں انھوں نے مہذب الدین عبد الرحیم اور عمران اسرائیلی سے پڑھا {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}۔"
  es: "Ibn al-Nafis estudió medicina con el shaykh Muhadhdhib al-Din al-Dakhwar, shaykh de medicina de Damasco y benefactor de la madrasa de médicos en el antiguo barrio de los orfebres, y sobresalió en el oficio y en el tratamiento {cite:tarikh-islam-dhahabi sa 687 p. 312}; al-Dakhwar murió en 628/1230, por lo que el aprendizaje es anterior a ese año {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}. Al-Mubdi'un de Tariq al-Suwaydan agrega que una crisis de salud en 629 AH, cuando tenía veintidós años, lo llevó a estudiar medicina y que se matriculó en el hospital Nuri en Damasco estudiando con Muhadhdhib al-Din Abd al-Rahim e Imran al-Isra'ili {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {citar:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}."
  fr: "Ibn al-Nafis étudia la médecine auprès du cheikh Muhadhdhib al-Din al-Dakhwar, cheikh de médecine de Damas et donateur de la madrasa des médecins dans l'ancien quartier des orfèvres, et il excella dans le métier et dans le traitement {cite:tarikh-islam-dhahabi sa 687 p. 312}; al-Dakhwar mourut en 628/1230, donc l'apprentissage est antérieur à cette année {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}. al-Mubdi'un de Tariq al-Suwaydan ajoute qu'une crise de santé en 629 AH, alors qu'il avait vingt-deux ans, l'a poussé à se tourner vers la médecine et qu'il s'est inscrit à l'hôpital Nuri de Damas pour étudier sous la direction de Muhadhdhib al-Din Abd al-Rahim et Imran al-Isra'ili {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}."
  tr: "İbn el-Nafis, Şam'ın başhekimi ve eski kuyumcular mahallesindeki okulun sahibi Şeyh Muhaddab el-Din el-Dakhwar'ın yanında tıp eğitimi aldı ve bu alanda ve tedavi yöntemlerinde üstün başarı gösterdi. {kaynak:tarikh-islam-dhahabi sa 687 s. 312} El-Dakhwar 628 Hicri yılında vefat etti, dolayısıyla onun yanında aldığı eğitim bundan önce olmalıdır. {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 897} {kaynak:shadharat-dhahab s. 127-128} Tarık el-Suveydan, “Yaratıcılar” programında, 629 Hicri yılında, yirmi iki yaşındayken geçirdiği bir sağlık krizi nedeniyle tıp okumaya karar verdiğini ve Şam'daki El-Nuri Hastanesi'ne katılarak Muhaddis el-Din Abdülrahim ve İmran el-İsraili'nin yanında eğitim aldığını anlatıyor."
  id: "Ibn al-Nafis belajar kedokteran di bawah bimbingan Syekh Muhadhdhab al-Din al-Dakhwar, tabib utama di Damaskus dan pemilik sekolah di kawasan pengrajin emas kuno, dan ia unggul dalam keahlian dan pengobatan {cite:tarikh-islam-dhahabi sa 687 p. 312}; dan al-Dakhwar wafat pada tahun 628 H, sehingga studi di bawah bimbingannya pasti dilakukan sebelum tahun itu {cite:encyclopaedia-of-islam-2 vol. 3 p. 897} {cite:shadharat-dhahab p. 127-128}. Tariq Al-Suwaidan menceritakan dalam program “The Creators” bahwa krisis kesehatan yang dideritanya pada tahun 629 H, ketika ia berusia dua puluh dua tahun, mendorongnya untuk belajar kedokteran, dan bahwa ia bergabung dengan Rumah Sakit Al-Nouri di Damaskus dan belajar di bawah bimbingan Muhadhdhib Al-Din Abdul Rahim dan Imran Al-Isra’ili {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:05:30} {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:07:30}."
