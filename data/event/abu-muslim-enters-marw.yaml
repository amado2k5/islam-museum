label: { ar: "دخول أبي مسلم مرو والبيعة له بها", en: "Abu Muslim Enters Marw and Receives Allegiance There", fr: "Abu Muslim entre à Marw et y reçoit l’allégeance", es: "Abu Muslim entra en Marw y recibe allí juramento de lealtad.", ur: "ابو مسلم مرو میں داخل ہوئے اور وہاں بیعت کی۔", tr: "Ebu Müslim'in Merv'e girişi ve orada kendisine biat edilmesi", id: "Masuknya Abu Muslim ke Merv dan baiat kepadanya di sana" }
summary:
  ar: "ذكر الطبري أن أبا مسلم قدم مرو في أول رمضان سنة تسع وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.355} وأن الدعوة العباسية أظهرت بخراسان في تلك السنة {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. وفي سنة ثلاثين ومائة دخل أبو مسلم حائط مرو ونزل دار الإمارة في جمادى الآخرة {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
  en: "Al-Tabari mentions that Abu Muslim came to Marw at the beginning of Ramadan in 129 {cite:tabari-tarikh-abu-al-fadl j.7 p.355}, and that the Abbasid da'wa was made public in Khurasan that year {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. In 130 Abu Muslim entered the wall of Marw and took up residence in the governor's house in Jumada II {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
  fr: "Al-Tabari indique qu’Abu Muslim vint à Marw au début de ramadan 129 {cite:tabari-tarikh-abu-al-fadl j.7 p.355} et que l’appel abbasside fut rendu public au Khurasan cette année-là {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. En 130, Abu Muslim entra dans la ville fortifiée de Marw et s’installa dans la demeure du gouverneur en jumada II {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
  es: "Al-Tabari menciona que Abu Muslim llegó a Marw al comienzo del Ramadán en 129 {cite:tabari-tarikh-abu-al-fadl j.7 p.355}, y que la da'wa abasí se hizo pública en Jorasán ese año {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. En 130, Abu Muslim entró en la muralla de Marw y se instaló en la casa del gobernador en Jumada II {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
  ur: "الطبری نے ذکر کیا ہے کہ ابو مسلم 129 میں رمضان کے شروع میں مرو تشریف لائے {حوالہ: طبری-تاریخ-ابو الفضل ج.7 ص355}، اور اسی سال خراسان میں عباسی دعوے کو عام کیا گیا تھا۔ 130 میں ابو مسلم دیوار مرو میں داخل ہوئے اور جمادی الثانی کے گورنر ہاؤس میں رہائش اختیار کی"
  tr: "Taberi, Ebu Müslim'in Hicri 129 (Miladi 1720) yılında Ramazan ayının başında Merv'e geldiğini {kaynak:tabari-tarikh-abu-al-fadl cilt 7, s. 355} ve Abbasi hareketinin o yıl Horasan'da kurulduğunu {kaynak:tabari-tarikh-abu-al-fadl cilt 7, s. 353} belirtir. Hicri 130 (Miladi 1730) yılında Ebu Müslim, Merv surlarının içine girmiş ve Cemâde-i Ahiret'te valilik konutuna yerleşmiştir {kaynak:tabari-tarikh-abu-al-fadl cilt 7, s. 377}."
  id: "Al-Tabari menyebutkan bahwa Abu Muslim tiba di Merv pada awal Ramadan tahun 129 H (1720 M) {cite:tabari-tarikh-abu-al-fadl vol.7 p.355} dan bahwa gerakan Abbasiyah didirikan di Khurasan pada tahun itu {cite:tabari-tarikh-abu-al-fadl vol.7 p.353}. Pada tahun 130 H (1730 M), Abu Muslim memasuki tembok Merv dan menetap di kediaman gubernur di Jumada al-Akhirah {cite:tabari-tarikh-abu-al-fadl vol.7 p.377}."
