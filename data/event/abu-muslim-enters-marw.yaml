label: { ar: "دخول أبي مسلم مرو والبيعة له بها", en: "Abu Muslim Enters Marw and Receives Allegiance There" }
summary:
  ar: "ذكر الطبري أن أبا مسلم قدم مرو في أول رمضان سنة تسع وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.355} وأن الدعوة العباسية أظهرت بخراسان في تلك السنة {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. وفي سنة ثلاثين ومائة دخل أبو مسلم حائط مرو ونزل دار الإمارة في جمادى الآخرة {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
  en: "Al-Tabari mentions that Abu Muslim came to Marw at the beginning of Ramadan in 129 {cite:tabari-tarikh-abu-al-fadl j.7 p.355}, and that the Abbasid da'wa was made public in Khurasan that year {cite:tabari-tarikh-abu-al-fadl j.7 p.353}. In 130 Abu Muslim entered the wall of Marw and took up residence in the governor's house in Jumada II {cite:tabari-tarikh-abu-al-fadl j.7 p.377}."
