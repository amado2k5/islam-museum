label:
  ar: "ولاية ابن حجر قضاء قضاة مصر، ٨٢٧هـ/١٤٢٣م"
  en: "Ibn Hajar appointed chief qadi of Egypt, 827/1423"
  ur: "ابن حجر کا قاضی القضاۃِ مصر مقرر ہونا، 827ھ/1423ء"
  es: "Ibn Hajar fue nombrado cadí principal de Egipto en 827/1423."
  fr: "Ibn Hajar nommé cadi en chef d'Égypte, 827/1423"
  tr: "İbn Hacer'in Mısır Başyargıcı olarak valilik yaptığı dönem, Hicri 827/Miladi 1423."
  id: "Masa jabatan Ibn Hajar sebagai Ketua Mahkamah Agung Mesir, 827 H/1423 M"
summary:
  ar: "ولّى السلطان الأشرف برسباي ابنَ حجر قضاء قضاة الشافعية بالديار المصرية بعد عزل علم الدين البلقيني، في محرم سنة ٨٢٧هـ؛ يقول ابن العماد إنه كان في سابع عشره {cite:shadharat-dhahab p. 271}، وتجعله دائرة المعارف في ٢٧ محرم/٣١ ديسمبر ١٤٢٣م {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. وظل المنصب له، بين عزلٍ وتولية متكررة، جملةً تقارب إحدى وعشرين سنة، حتى فُقد نهائياً في ٢٥ جمادى الآخرة ٨٥٢هـ/٢٦ أغسطس ١٤٤٨م {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "Sultan al-Ashraf Barsbay appointed Ibn Hajar chief qadi of the Shafi'is in Egypt in Muharram 827, after dismissing Ala al-Din al-Bulqini: Ibn al-Imad dates it 17 Muharram {cite:shadharat-dhahab p. 271}, while the Encyclopaedia of Islam gives 27 Muharram (31 December 1423) {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. The office remained his through repeated dismissals and reinstatements for a combined total of about twenty-one years, until he lost it finally on 25 Jumada II 852 (26 August 1448) {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "سلطان اشرف برسبائی نے محرم 827ھ میں علاء الدین بلقینی کو معزول کر کے ابن حجر کو مصر کا قاضی القضاۃِ شافعیہ مقرر کیا: ابن العماد اسے 17 محرم لکھتے ہیں {cite:shadharat-dhahab p. 271} جبکہ دائرۃ المعارف 27 محرم ⁦(31 دسمبر 1423ء)⁩ بتاتی ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔ یہ منصب بارہا عزل و تقرر کے باوجود مجموعی طور پر تقریباً اکیس برس ان کے پاس رہا، یہاں تک کہ 25 جمادی الثانی 852ھ ⁦(26 اگست 1448ء)⁩ کو بالآخر چھن گیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
  es: "El sultán al-Ashraf Barsbay nombró a Ibn Hajar cadí jefe de los shafi'ís en Egipto en Muharram de 827, tras destituir a Ala al-Din al-Bulqini: Ibn al-Imad lo fecha el 17 de Muharram (cita: shadharat-dhahab, pág. 271), mientras que la Enciclopedia del Islam indica el 27 de Muharram (31 de diciembre de 1423) (cita: encyclopaedia-of-islam-2, vol. 3, pág. 810). Ostentó el cargo durante repetidos destituciones y reincorporaciones, por un total de aproximadamente veintiún años, hasta que finalmente lo perdió el 25 de Jumada II de 852 (26 de agosto de 1448) (cita: encyclopaedia-of-islam-2, vol. 3, pág. 810)."
  fr: "Le sultan al-Ashraf Barsbay nomma Ibn Hajar cadi en chef des chaféites en Égypte en Muharram 827, après avoir destitué Ala al-Din al-Bulqini: Ibn al-Imad date cette nomination du 17 Muharram (cf. Shadharat-Dhahab, p. 271), tandis que l’Encyclopédie de l’Islam indique le 27 Muharram (31 décembre 1423) (cf. Encyclopaedia-of-Islam-2, vol. 3, p. 810). Il conserva cette charge malgré des destitutions et des réintégrations successives pendant une durée totale d’environ vingt et un ans, jusqu’à sa destitution définitive le 25 Jumada II 852 (26 août 1448) (cf. Encyclopaedia-of-Islam-2, vol. 3, p. 810)."
  tr: "Sultan el-Eşref Barsbay, Hicri 827 Muharrem ayında Alam el-Din el-Bulqini'yi görevden aldıktan sonra İbn Hacer'i Mısır'daki Şafiî mezhebinin Başkadı olarak atadı. İbn el-İmad, bunun Muharrem ayının on yedinci günü olduğunu belirtirken (bkz. Şadharat el-Dhahab, s. 271), İslam Ansiklopedisi bunu 27 Muharrem/31 Aralık 1423 (bkz. İslam Ansiklopedisi, cilt 2, s. 810) olarak belirtir. İbn Hacer, defalarca görevden alınıp atanmasına rağmen, yaklaşık yirmi bir yıl boyunca bu görevi sürdürdü ve nihayet Hicri 852 Cemâde el-Ahire 25/26 Ağustos 1448'de görevden alındı (bkz. İslam Ansiklopedisi, cilt 2, s. 810)."
  id: "Sultan al-Ashraf Barsbay mengangkat Ibn Hajar sebagai Ketua Hakim mazhab Syafi'i di Mesir setelah memecat Alam al-Din al-Bulqini, pada bulan Muharram 827 H. Ibn al-Imad menyatakan bahwa itu terjadi pada tanggal tujuh belas Muharram (lihat Shadharat al-Dhahab, hlm. 271), sedangkan Ensiklopedia Islam menempatkannya pada tanggal 27 Muharram/31 Desember 1423 M (lihat Ensiklopedia Islam, jilid 2, hlm. 810). Ia memegang jabatan tersebut, dengan pemecatan dan pengangkatan berulang kali, selama total sekitar dua puluh satu tahun, hingga akhirnya ia diberhentikan dari jabatannya pada tanggal 25 Jumada al-Akhirah 852 H/26 Agustus 1448 M (lihat Ensiklopedia Islam, jilid 2, hlm. 810)."
