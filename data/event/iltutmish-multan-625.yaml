label: { ar: "أخذ إيلتتمش الملتان من قباجة ٦٢٥هـ", en: "Iltutmish takes Multan from Qabacha, 625", es: "Iltutmish toma Multan de Qabacha, 625", fr: "Iltutmish prend Multan à Qabacha, 625", ur: "التمش نے 625 میں قباچہ سے ملتان لے لیا۔", tr: "Iltutmish, Multan'ı H. 625'te Kabaja'dan aldı", id: "Iltutmish merebut Multan dari Kabaja pada tahun 625 H" }
summary:
  ar: "ظلت الملتان في سنوات سلطنة دلهي الأولى تحت سلطان ناصر الدين قباجة، مملوك شهاب الدين الغوري الذي كان قد استقر على الملتان وأوج ولهاور وديبل. وضعف مركزه بعد لقائه غير الموفق بجلال الدين الخوارزمشاه سنة ٦٢١هـ/١٢٢٤م حين بلغ جلال الدين النواحي هارباً من المغول المتقدمين، ثم هزمه السلطان شمس الدين إيلتتمش هزيمة منكرة سنة ٦٢٥هـ/١٢٢٨م، فصارت الملتان جزءاً أصيلاً من سلطنة دلهي {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In the first years of the Delhi Sultanate Multan lay under Nasir al-Din Qabacha, the Ghurid mamluk established over Multan, Uch, Lahore and Daybul. His position was weakened by the unsuccessful encounter of 621/1224 with Jalal al-Din Khwarazm-Shah, who reached the region fleeing the advancing Mongols; then Sultan Shams al-Din Iltutmish defeated him in 625/1228, and Multan became an integral part of the Delhi Sultanate {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "دہلی سلطنت کے ابتدائی برسوں میں ملتان ناصر الدین قباجہ کے اثر میں تھا — شہاب الدین غوری کا غلام جو ملتان، اُچ، لاہور اور دیبل پر مستقر تھا۔ اس کا مرکز 621ھ/1224ء میں جلال الدین خوارزم شاہ سے ناکام مقابلے سے کمزور ہوا، جو بڑھتے ہوئے مغلوں سے بھگتاہوا اس علاقے میں آیا تھا؛ پھر سلطان شمس الدین التتمش نے 625ھ/1228ء میں اسے شکست دی اور ملتان سلطنتِ دہلی کا لازمی حصہ بن گیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
  es: "En los primeros años del Sultanato de Delhi, Multan estuvo bajo el dominio de Nasir al-Din Qabacha, el mameluco gúrida que gobernó Multan, Uch, Lahore y Daybul. Su posición se debilitó tras el fallido enfrentamiento de 621/1224 con Jalal al-Din Khwarazm-Shah, quien llegó a la región huyendo del avance de los mongoles; posteriormente, el sultán Shams al-Din Iltutmish lo derrotó en 625/1228, y Multan pasó a formar parte integral del Sultanato de Delhi {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  fr: "Durant les premières années du sultanat de Delhi, Multan était sous l'autorité de Nasir al-Din Qabacha, mamelouk ghuride établi sur Multan, Uch, Lahore et Daybul. Sa position fut affaiblie par l'échec de son affrontement de 621/1224 avec Jalal al-Din Khwarazm-Shah, qui avait atteint la région en fuyant l'avancée des Mongols; puis, en 625/1228, le sultan Shams al-Din Iltutmish le vainquit, et Multan devint partie intégrante du sultanat de Delhi (voir: Encyclopaedia of Islam, vol. 7, p. 603)."
  tr: "Delhi Sultanlığı'nın ilk yıllarında Multan, Şihab el-Din el-Gauri'nin bir Memlük hükümdarı olan Sultan Nasır el-Din Kabe'nin yönetimi altında kaldı. Kabe, Multan, Ujj, Walhawar ve Debal'da yerleşmişti. 621 Hicri/1224 Miladi yılında, ilerleyen Moğollardan kaçan Celal el-Din Harezmşah ile yaptığı başarısız karşılaşmanın ardından konumu zayıfladı. Daha sonra 625 Hicri/1228 Miladi yılında Sultan Şems el-Din İltutmiş tarafından kesin bir yenilgiye uğratıldı ve Multan, Delhi Sultanlığı'nın ayrılmaz bir parçası haline geldi."
  id: "Pada tahun-tahun awal Kesultanan Delhi, Multan tetap berada di bawah kekuasaan Sultan Nasir al-Din Qabaja, seorang Mamluk dari Shihab al-Din al-Ghauri, yang telah memantapkan dirinya di Multan, Ujj, Walhawar, dan Debal. Posisinya melemah setelah pertemuannya yang tidak berhasil dengan Jalal al-Din Khwarazmshah pada tahun 621 H/1224 M, ketika Jalal al-Din tiba di wilayah tersebut melarikan diri dari pasukan Mongol yang maju. Ia kemudian dikalahkan secara telak oleh Sultan Shams al-Din Iltutmish pada tahun 625 H/1228 M, setelah itu Multan menjadi bagian integral dari Kesultanan Delhi."
