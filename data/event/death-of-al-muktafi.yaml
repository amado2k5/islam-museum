label: { ar: "وفاة المكتفي بالله", en: "Death of al-Muktafi Billah" }
summary:
  ar: "في سنة خمس وتسعين ومائتين اشتدت العلة بالمكتفي بالله في أول ذي القعدة، ثم توفي ليلة الأحد، ودُفن في دار محمد بن عبد الله بن طاهر، وبعد وفاته بويع المقتدر بالخلافة {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. وعند ابن الجوزي توفي في ذي القعدة سنة خمس وتسعين ومائتين وبُويع المقتدر بالله من بعده {cite:muntazam-ibn-al-jawzi p. 359}."
  en: "In 295 the illness of al-Muktafi Billah grew severe at the start of Dhu'l-Qa'da; he died on a Sunday night and was buried in the house of Muhammad ibn Abdullah ibn Tahir, and after his death the oath of caliphate was given to al-Muqtadir {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. In Ibn al-Jawzi he died in Dhu'l-Qa'da of 295 and al-Muqtadir Billah was given the oath after him {cite:muntazam-ibn-al-jawzi p. 359}."
