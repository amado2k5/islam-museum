id: event/death-of-al-muktafi
class: event
kind: death
label: { ar: "وفاة المكتفي بالله", en: "Death of al-Muktafi Billah", es: "Muerte de al-Muktafi Billah", fr: "Mort d'al-Muktafi Billah", ur: "المکتفی باللہ کی وفات" }
summary:
  ar: "في سنة خمس وتسعين ومائتين اشتدت العلة بالمكتفي بالله في أول ذي القعدة، ثم توفي ليلة الأحد، ودُفن في دار محمد بن عبد الله بن طاهر، وبعد وفاته بويع المقتدر بالخلافة {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. وعند ابن الجوزي توفي في ذي القعدة سنة خمس وتسعين ومائتين وبُويع المقتدر بالله من بعده {cite:muntazam-ibn-al-jawzi p. 359}."
  en: "In 295 the illness of al-Muktafi Billah grew severe at the start of Dhu'l-Qa'da; he died on a Sunday night and was buried in the house of Muhammad ibn Abdullah ibn Tahir, and after his death the oath of caliphate was given to al-Muqtadir {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. In Ibn al-Jawzi he died in Dhu'l-Qa'da of 295 and al-Muqtadir Billah was given the oath after him {cite:muntazam-ibn-al-jawzi p. 359}."
  es: "En 295, la enfermedad de al-Muktafi Billah se agravó al comienzo de Dhu'l-Qa'da; murió un domingo por la noche y fue enterrado en la casa de Muhammad ibn Abdullah ibn Tahir, y después de su muerte se le dio el juramento de califato a al-Muqtadir {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. En Ibn al-Jawzi murió en Dhu'l-Qa'da de 295 y al-Muqtadir Billah recibió el juramento después de él {cite:muntazam-ibn-al-jawzi p. 359}."
  fr: "En 295, la maladie d'al-Muktafi Billah s'aggrava au début de Dhu'l-Qa'da; il mourut dans la nuit d'un dimanche et fut enterré dans la maison de Muhammad ibn Abdullah ibn Tahir. Après sa mort, le serment de califat fut conféré à al-Muqtadir (cf. Tabari-tarikh-abu-al-fadl, vol. 11, p. 27 et 28). Selon Ibn al-Jawzi, il mourut également en Dhu'l-Qa'da 295 et al-Muqtadir Billah prêta serment après lui (cf. Muntazam-ibn-al-jawzi, p. 359)."
  ur: "295 میں ذوالقعدہ کے شروع میں المکتفی باللہ کی بیماری شدید ہوگئی۔ آپ کی وفات اتوار کی رات ہوئی اور آپ کو محمد بن عبداللہ ابن طاہر کے گھر میں دفن کیا گیا اور ان کی وفات کے بعد خلافت کی بیعت المقتدیر کو دی گئی۔ ابن الجوزی میں ان کی وفات ذوالقعدہ سنہ 295 میں ہوئی اور ان کے بعد مقتدیر باللہ کو بیعت دی گئی۔ 359}۔"
