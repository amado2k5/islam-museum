id: event/battle-of-rayy-195
class: event
kind: battle
label: { ar: "وقعة طاهر بن الحسين مع علي بن عيسى", en: "Clash of Tahir ibn al-Husayn with Ali ibn Isa" }
summary:
  ar: "في سنة خمس وتسعين ومئة ولى الأمين علي بن عيسى بن ماهان بلاد الجبال همذان ونهاوند وقم وأصبهان فخرج من بغداد في نصف جمادى الآخرة ومعه الجيش لقتال المأمون أربعون ألفاً في هيئة لم ير مثلها وأخذ معه قيد فضة ليقيد به المأمون بزعمه فأرسل المأمون لقتاله طاهر بن الحسين في أقل من أربعة آلاف فكانت الغلبة له وذبح علي وهزم جيشه وحملت رأسه إلى المأمون فطيف بها في خراسان وسلم على المأمون بالخلافة، وجاء الخبر إلى الأمين وهو يتصيد السمك فقال للذي أخبره ويلك دعني فإن كوثراً قد صاد سمكتين وأنا ما صدت شيئاً بعد {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  en: "In year 195 al-Amin gave Ali ibn Isa ibn Mahan the mountain lands — Hamadhan, Nihawand, Qum and Isfahan — and he left Baghdad in mid-Jumada II with forty thousand in unmatched array, carrying a silver shackle with which he meant, he boasted, to bind al-Ma'mun. Al-Ma'mun sent Tahir ibn al-Husayn with under four thousand; victory was Tahir's — Ali was slaughtered, his army routed, his head carried to al-Ma'mun and paraded through Khurasan, and men greeted al-Ma'mun as caliph. News reached al-Amin as he fished: 'Woe to you — leave me; Kawthar has caught two fish and I have caught nothing yet' {cite:tarikh-khulafa-minhaj-1434 p. 475}."
