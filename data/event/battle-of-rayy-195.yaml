label: { ar: "وقعة طاهر بن الحسين مع علي بن عيسى", en: "Clash of Tahir ibn al-Husayn with Ali ibn Isa", fr: "L'affrontement de Tahir ibn al-Husayn avec Ali ibn Isa", es: "Enfrentamiento de Tahir ibn al-Husayn con Ali ibn Isa", ur: "طاہر ابن الحسین کا علی ابن عیسیٰ سے تصادم", tr: "Tahir ibn al-Husayn'ın Ali ibn Isa ile Savaşı", id: "Pertempuran Tahir ibn al-Husayn dengan Ali ibn Isa" }
summary:
  ar: "في سنة خمس وتسعين ومئة ولى الأمين علي بن عيسى بن ماهان بلاد الجبال همذان ونهاوند وقم وأصبهان فخرج من بغداد في نصف جمادى الآخرة ومعه الجيش لقتال المأمون أربعون ألفاً في هيئة لم ير مثلها وأخذ معه قيد فضة ليقيد به المأمون بزعمه فأرسل المأمون لقتاله طاهر بن الحسين في أقل من أربعة آلاف فكانت الغلبة له وذبح علي وهزم جيشه وحملت رأسه إلى المأمون فطيف بها في خراسان وسلم على المأمون بالخلافة، وجاء الخبر إلى الأمين وهو يتصيد السمك فقال للذي أخبره ويلك دعني فإن كوثراً قد صاد سمكتين وأنا ما صدت شيئاً بعد {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  en: "In year 195 al-Amin gave Ali ibn Isa ibn Mahan the mountain lands — Hamadhan, Nihawand, Qum and Isfahan — and he left Baghdad in mid-Jumada II with forty thousand in unmatched array, carrying a silver shackle with which he meant, he boasted, to bind al-Ma'mun. Al-Ma'mun sent Tahir ibn al-Husayn with under four thousand; victory was Tahir's — Ali was slaughtered, his army routed, his head carried to al-Ma'mun and paraded through Khurasan, and men greeted al-Ma'mun as caliph. News reached al-Amin as he fished: 'Woe to you — leave me; Kawthar has caught two fish and I have caught nothing yet' {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  fr: "En l'an 195, al-Amin confia à Ali ibn Isa ibn Mahan les pays de montagne, Hamadhan, Nihawand, Qum et Ispahan, et celui-ci quitta Bagdad à la mi-Jumada II avec quarante mille hommes en un équipage sans pareil, portant une entrave d'argent avec laquelle il comptait, se vantait-il, lier al-Ma'mun. Al-Ma'mun envoya Tahir ibn al-Husayn avec moins de quatre mille hommes ; la victoire fut à Tahir : Ali fut égorgé, son armée mise en déroute, sa tête portée à al-Ma'mun et promenée à travers le Khorasan, et l'on salua al-Ma'mun comme calife. La nouvelle parvint à al-Amin alors qu'il pêchait : « Malheur à toi, laisse-moi ; Kawthar a pris deux poissons et moi je n'ai encore rien pris » {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  es: "En el año 195, al-Amin le entregó a Ali ibn Isa ibn Mahan las tierras montañosas —Hamadhan, Nihawand, Qum e Isfahan— y partió de Bagdad a mediados de Jumada II con cuarenta mil hombres en una formación inigualable, portando un grillete de plata con el que, según se jactaba, pretendía someter a al-Ma'mun. Al-Ma'mun envió a Tahir ibn al-Husayn con menos de cuatro mil hombres; la victoria fue de Tahir: Ali fue masacrado, su ejército derrotado, su cabeza llevada ante al-Ma'mun y exhibida por Jorasán, y los hombres aclamaron a al-Ma'mun como califa. La noticia llegó a al-Amin mientras pescaba: «¡Ay de ti! Déjame; Kawthar ha pescado dos peces y yo aún no he pescado nada» {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  ur: "سنہ 195 میں الامین نے علی ابن عیسیٰ ابن ماہان کو پہاڑی سرزمینیں - ہمدان، نہاوند، قم اور اصفہان - اور جمادی الثانی کے وسط میں چالیس ہزار کے ساتھ بے مثال صف میں بغداد سے روانہ ہوئے، اس کے ساتھ چاندی کا طوق تھا جس کے ساتھ اس نے فخر کیا، المعون کو باندھنا تھا۔ مامون نے طاہر بن الحسین کو چار ہزار سے کم کے ساتھ بھیجا۔ فتح طاہر کی تھی - علی کو ذبح کیا گیا، اس کی فوج کو شکست دی گئی، اس کا سر المامون کی طرف لے جایا گیا اور خراسان کے راستے پریڈ کی گئی، اور لوگوں نے المامون کو خلیفہ کے طور پر سلام کیا۔ یہ خبر الامین تک پہنچی جب اس نے مچھلی پکڑی: 'افسوس تم پر، مجھے چھوڑ دو۔ کوثر نے دو مچھلیاں پکڑی ہیں اور میں نے ابھی تک کچھ نہیں پکڑا ہے۔ 475}۔"
  tr: "195 yılında el-Amin, Ali ibn İsa ibn Mahan'ı Hamadan, Nahavand, Kum ve İsfahan'ın dağlık bölgelerinin valisi olarak atadı. Cemâde el-Ahirah'ın ortasında, daha önce hiç görülmemiş bir düzende kırk bin kişilik bir orduyla Bağdat'tan ayrıldı. Yanında, el-Ma'mun'u bağlamak için kullanmayı amaçladığı gümüş bir zincir götürdü. El-Ma'mun, Tahir ibn el-Hüseynin'i dört binden az adamla ona karşı savaşması için gönderdi ve Tahir zafer kazandı. Ali öldürüldü, ordusu yenildi ve başı el-Ma'mun'a götürülerek Horasan'da dolaştırıldı. El-Ma'mun'u halife olarak selamladı. Haber el-Amin'e balık tutarken ulaştı. Ona haber verene, \"Yazık sana! Beni rahat bırak, çünkü Kevser iki balık yakaladı, ben henüz hiçbir şey yakalayamadım.\" dedi. {cite:tarikh-khulafa-minhaj-1434 p. 475}"
  id: "Pada tahun 195, al-Amin mengangkat Ali ibn Isa ibn Mahan sebagai gubernur wilayah pegunungan Hamadan, Nahavand, Qom, dan Isfahan. Ia meninggalkan Baghdad di tengah Jumada al-Akhirah dengan pasukan sebanyak empat puluh ribu orang, dalam formasi yang belum pernah terlihat sebelumnya. Ia membawa serta rantai perak, bermaksud menggunakannya untuk mengikat al-Ma'mun. Al-Ma'mun mengirim Tahir ibn al-Husayn untuk melawannya dengan kurang dari empat ribu orang, dan ia menang. Ali terbunuh, pasukannya dikalahkan, dan kepalanya dibawa ke al-Ma'mun dan diarak melalui Khorasan. Ia menyambut al-Ma'mun sebagai Khalifah. Berita itu sampai kepada al-Amin ketika ia sedang memancing. Ia berkata kepada orang yang memberitahunya, \"Celakalah kamu! Tinggalkan aku sendiri, karena Kawthar telah menangkap dua ikan, dan aku belum menangkap apa pun.\" {cite:tarikh-khulafa-minhaj-1434 p. 475}"
