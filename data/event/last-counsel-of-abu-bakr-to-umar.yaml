tags: [wasaya-browser, wasaya-caliphs, wasaya-wasiyya, wasaya-ihtidar]
label: { ar: "وصية أبي بكر لعمر عند الاحتضار", en: "Last counsel of Abu Bakr to Umar", ur: "ابو بکر کی عمر کو آخری نصیحت", es: "Último consejo de Abu Bakr a Umar", fr: "Dernier conseil d'Abu Bakr à Umar", tr: "Ebu Bekir'in ölüm döşeğinde Ömer'e vasiyeti.", id: "Wasiat Abu Bakr kepada Umar di ranjang kematiannya" }
summary:
  ar: "بعد عهده بالخلافة دعا أبو بكر عمر وحده وأوصاه بتقوى الله {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. وفحوى وصيته أن لله حقاً بالليل لا يقبله بالنهار وحقاً بالنهار لا يقبله بالليل، وأن النافلة لا تُقبل حتى تؤدى الفريضة، وأن الموازين تثقل باتباع الحق وتخف باتباع الباطل {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}. ثم ذكر نهج القرآن في وصف أهل الجنة وأهل النار ليكون العبد راغباً راهباً {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 259}، وختمها بأنه إن حفظ الوصية فلا يكن غائب أحب إليه من الموت {cite:kamil-ibn-al-athir scan vol. 1 p. 268}. ويروي ابن الأثير وصية أخرى في المرض نفسه بشأن المثنى وأهل العراق {cite:kamil-ibn-al-athir scan vol. 1 p. 260}."
  en: "After designating Umar, Abu Bakr called him in alone and charged him to fear God {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. The counsel says God has a right by night that He does not accept by day and a right by day He does not accept by night, that no voluntary act is accepted until the obligation is met, and that scales grow heavy by following truth and light by following falsehood {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}. It then recalls how the Qur'an names the people of Paradise and of the Fire so that a servant may be hopeful and fearful {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 259}, and ends by telling Umar that if he keeps it nothing absent should be dearer to him than death {cite:kamil-ibn-al-athir scan vol. 1 p. 268}. Ibn al-Athir also reports a second bequest in the same illness about al-Muthanna and the people of Iraq {cite:kamil-ibn-al-athir scan vol. 1 p. 260}."
  ur: "عمر کو خلیفہ نامزد کرنے کے بعد ابو بکر نے انھیں تنہا بلا کر اللہ سے ڈرنے کی نصیحت کی {cite:kamil-ibn-al-athir scan vol. 1 p. 267}۔ نصیحت کا خلاصہ یہ ہے کہ اللہ کا ایک حق رات میں ہے جو دن میں قبول نہیں اور ایک دن میں جو رات میں قبول نہیں، نفل فرض ادا ہونے سے پہلے قبول نہیں، اور پلڑے حق کی پیروی سے بھاری اور باطل کی پیروی سے ہلکے ہوتے ہیں {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}۔ پھر قرآن کے اہلِ جنت و جہنم کے ذکر کا اسلوب بتایا تاکہ بندہ امید اور خوف رکھے {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 259}، اور آخر میں کہا کہ اگر وصیت یاد رکھی تو کوئی غائب چیز موت سے زیادہ پیاری نہ ہو {cite:kamil-ibn-al-athir scan vol. 1 p. 268}۔ ابن الاثیر اسی بیماری میں مثنیٰ اور اہلِ عراق کے بارے میں ایک اور وصیت بھی نقل کرتے ہیں {cite:kamil-ibn-al-athir scan vol. 1 p. 260}۔"
  es: "Después de designar a Umar, Abu Bakr lo llamó a solas y le encargó que temiera a Dios {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. El consejo dice que Dios tiene un derecho de noche que no acepta de día y un derecho de día que no acepta de noche, que ningún acto voluntario es aceptado hasta que se cumple la obligación, y que las balanzas se vuelven pesadas al seguir la verdad y ligeras al seguir la falsedad {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}. Luego recuerda cómo el Corán nombra a la gente del Paraíso y del Fuego para que un siervo pueda tener esperanza y temor {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 259}, y termina diciéndole a Umar que si lo guarda, nada ausente debería ser más querido para él que la muerte {cite:kamil-ibn-al-athir scan vol. 1 p. 268}. Ibn al-Athir también informa de un segundo legado en la misma enfermedad sobre al-Muthanna y el pueblo de Irak {cite:kamil-ibn-al-athir scan vol. 1 p. 260}."
  fr: "Après avoir désigné Umar, Abou Bakr le fit venir seul et l'exhorta à craindre Dieu (Kamil ibn al-Athir, vol. 1, p. 267). Le conseil explique que Dieu a un droit la nuit qu'Il n'accepte pas le jour et un droit le jour qu'Il n'accepte pas la nuit, qu'aucun acte volontaire n'est accepté tant que l'obligation n'est pas remplie, et que la balance s'alourdit en suivant la vérité et s'allège en suivant le mensonge (Sifat al-Safwa Tartusi, 2012, vol. 1, p. 102). Il rappelle ensuite comment le Coran nomme les gens du Paradis et ceux de l'Enfer afin que le serviteur puisse être à la fois plein d'espoir et de crainte (Riyad Nadira Ilmiyya, 1984, vol. 3, p. 259), et conclut en disant à Umar que s'il suit ce conseil, rien de ce qui lui manque ne devrait lui être plus cher que la mort (Kamil ibn al-Athir, vol. 1, p. 267). 268}. Ibn al-Athir rapporte également un deuxième legs dans la même maladie à propos d'al-Muthanna et du peuple d'Irak {cite:kamil-ibn-al-athir scan vol. 1 p. 260}."
  tr: "Halifeliği üstlendikten sonra Ebu Bekir, Ömer'i yalnız başına çağırdı ve ona Allah'tan korkmasını tavsiye etti {kaynak: Kamil İbn el-Sih, cilt 1, s. 267}. Tavsiyesinin özü şuydu: Allah'ın geceleyin kabul ettiği, gündüz etmediği bir hakkı vardır; nafile ibadetler, farz ibadetler yerine getirilmeden kabul edilmez; ve adalet terazisi, hakka bağlılıkla ağırlaşır, batıla bağlılıkla hafifler {kaynak: Sifat el-Safva Tartusi, 2012, cilt 1, s. 102}. Daha sonra, kulun hem umutlu hem de korkulu olması için, cennet ve cehennem ehlini Kur'an'ın yaklaşımıyla tanımladı {kaynak: Riyad-Nadira İlmiyye, 1984, cilt 3, s. İbn el-Athir, aynı hastalık döneminde el-Muthanna ve Irak halkıyla ilgili başka bir vasiyeti de aktarır (259)."
  id: "Setelah naik tahta kekhalifahan, Abu Bakar memanggil Umar sendirian dan menasihatinya untuk takut kepada Allah {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Inti dari nasihatnya adalah bahwa Allah memiliki hak di malam hari yang tidak Dia terima di siang hari, dan hak di siang hari yang tidak Dia terima di malam hari; bahwa amal sunnah tidak diterima sampai amal wajib dilakukan; dan bahwa timbangan keadilan berat bagi yang berpegang pada kebenaran dan ringan bagi yang berpegang pada kebohongan {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}. Kemudian beliau menyebutkan pendekatan Al-Quran dalam menggambarkan penghuni Surga dan penghuni Neraka agar hamba Allah memiliki harapan sekaligus rasa takut {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 259}, dan menyimpulkan dengan mengatakan bahwa jika dia mengindahkan nasihat itu, tidak ada yang lebih dicintainya selain kematian {kutip:kamil-ibn-al-athir scan vol. 1 hlm. 268}. Ibn al-Athir menceritakan wasiat lain selama sakit yang sama mengenai al-Muthanna dan penduduk Irak {kutip:kamil-ibn-al-athir scan vol. 1 hlm. 260}."
