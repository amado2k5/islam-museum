label: { ar: "الحرب بين الأحلاف وبني مالك", en: "The war between the Ahlaf and Banu Malik", fr: "Guerre entre les Ahlaf et les Banu Malik", es: "La guerra entre los Ahlaf y los Banu Malik", ur: "احلاف اور بنو مالک کے درمیان جنگ" }
summary:
  ar: "حرب بطني ثقيف بالطائف: الأحلاف وبنو مالك؛ كان للأحلاف في أخذ الطائف أثر عظيم فاعتدوا به على بني مالك، فلما أثرت الأحلاف وكثرت خيلهم حموا لها حمى جلذان من أرض بني نصر بن معاوية اليربوعيين فغضبت بنو نصر ورئيسهم عفيف بن عوف وقاتلوهم، فاغتنمت بنو مالك ورئيسهم جندب بن عوف ذلك لضغائن قديمة فحالفوا بني يربوع على الأحلاف؛ فكان أول قتال بينهم يوم الطائف فانتصر الأحلاف وأخرجوهم إلى واد يقال له لحب وقتلوهم مقتلة عظيمة بشعب الأبان، واقتتلوا أياماً منها يوم عمر ذي كندة ويوم كروبا وصاح عفيف اليربوعي صيحة يزعمون أن سبعين حبلى ألقت ما في بطنها، وسارت بنو مالك تبتغي الحلف من دوس وخثعم وخرجت الأحلاف إلى المدينة يبتغون حلف الأنصار فقدم مسعود بن معتب على أحيحة بن الجلاح فقال له أحيحة ما خرج رجل من قومه إلى قوم بحلف إلا أقر لهم بشر مما أنف منه من قومه، وقال أخوك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك، فانصرف وزوده بغلام يبني الآطام فبنى لمسعود أطماً فكان أول أطم بني بالطائف، ولم يكن بعد ذلك بينهم حرب تذكر {cite:kamil-ibn-al-athir p. 512-513}."
  en: "The civil war of Thaqif's two moieties — the Ahlaf and Banu Malik: when the Ahlaf's herds drove them to fence the Jalathan pasture of Banu Nasr, Banu Malik allied with Yarbu' and war rolled through the day of Ta'if, the al-Aban defile massacre, the days of Umr dhi Kinda and Karuba, and Afif ibn Awf's battle-cry said to have made seventy pregnant women miscarry; it ended when the Ansari Uhayha refused Mas'ud ibn Mu'tib a pact — 'your brother is the one you left behind; reconcile with him though it cost your nose' — and gave him instead a slave who built Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 512-513}."
  fr: "Guerre civile entre les deux branches des Thaqif, les Ahlaf et les Banu Malik : lorsque les troupeaux des Ahlaf les poussèrent à réserver le pâturage de Jalathan des Banu Nasr, les Banu Malik s’allièrent aux Yarbu'. La guerre se poursuivit par la journée de Ta'if, le massacre du défilé d’al-Aban, les journées d’Umr Dhi Kinda et de Karuba, ainsi que le cri d’Afif ibn Awf qui aurait fait avorter soixante-dix femmes enceintes. Elle prit fin quand l’Ansari Uhayha refusa un pacte à Mas'ud ibn Mu'tib — « Ton frère est celui que tu as laissé derrière toi ; réconcilie-toi avec lui, dût-il t’en coûter ton nez » — et lui donna plutôt un esclave qui construisit la première tour fortifiée de Ta'if {cite:kamil-ibn-al-athir p. 512-513}."
  es: "La guerra civil de las dos facciones de Thaqif — los Ahlaf y los Banu Malik: cuando los rebaños de los Ahlaf los obligaron a cercar el pastizal de Jalathan de los Banu Nasr, los Banu Malik se aliaron con Yarbu' y la guerra se extendió durante el día de Ta'if, la masacre del desfiladero de al-Aban, los días de Umr dhi Kinda y Karuba, y el grito de guerra de Afif ibn Awf que se dice que provocó el aborto espontáneo de setenta mujeres embarazadas; terminó cuando el Ansari Uhayha rechazó un pacto con Mas'ud ibn Mu'tib —'tu hermano es el que dejaste atrás; reconcíliate con él aunque te cueste la nariz'— y en su lugar le dio un esclavo que construyó la primera torre-fortaleza de Ta'if {cite:kamil-ibn-al-athir p. 512-513}."
  ur: "ثقیف کے دو حصوں - احلاف اور بنو مالک کی خانہ جنگی: جب احلاف کے ریوڑ نے انہیں بنو نصر کی جلاتن چراگاہ پر باڑ لگانے کے لیے نکالا تو بنو مالک نے یربوع کے ساتھ اتحاد کیا اور جنگ طائف کے دن تک جاری رہی، آل ابان نے ناپاک قتل عام، عمرو اور کفافین کے ایام جنگ کی آواز نے ستر حاملہ خواتین کو اسقاط حمل کرایا۔ اس کا خاتمہ اس وقت ہوا جب انصاری احیحہ نے مسعود بن مطیب سے معاہدہ کرنے سے انکار کر دیا - 'تمہارا بھائی وہی ہے جسے تم نے پیچھے چھوڑ دیا تھا۔ اس کے ساتھ صلح کرو اگرچہ اس کے لیے تمہاری ناک کی قیمت لگ جائے'' - اور اس کے بدلے اسے ایک غلام دے دیا جس نے طائف کا پہلا قلعہ نما مینار بنایا۔ 512-513}۔"
