label: { ar: "الحرب بين الأحلاف وبني مالك", en: "The war between the Ahlaf and Banu Malik", fr: "Guerre entre les Ahlaf et les Banu Malik", es: "La guerra entre los Ahlaf y los Banu Malik", ur: "احلاف اور بنو مالک کے درمیان جنگ", tr: "İttifaklar ve Beni Malik arasındaki savaş", id: "Perang antara aliansi dan Bani Malik" }
summary:
  ar: "حرب بطني ثقيف بالطائف: الأحلاف وبنو مالك؛ كان للأحلاف في أخذ الطائف أثر عظيم فاعتدوا به على بني مالك، فلما أثرت الأحلاف وكثرت خيلهم حموا لها حمى جلذان من أرض بني نصر بن معاوية اليربوعيين فغضبت بنو نصر ورئيسهم عفيف بن عوف وقاتلوهم، فاغتنمت بنو مالك ورئيسهم جندب بن عوف ذلك لضغائن قديمة فحالفوا بني يربوع على الأحلاف؛ فكان أول قتال بينهم يوم الطائف فانتصر الأحلاف وأخرجوهم إلى واد يقال له لحب وقتلوهم مقتلة عظيمة بشعب الأبان، واقتتلوا أياماً منها يوم عمر ذي كندة ويوم كروبا وصاح عفيف اليربوعي صيحة يزعمون أن سبعين حبلى ألقت ما في بطنها، وسارت بنو مالك تبتغي الحلف من دوس وخثعم وخرجت الأحلاف إلى المدينة يبتغون حلف الأنصار فقدم مسعود بن معتب على أحيحة بن الجلاح فقال له أحيحة ما خرج رجل من قومه إلى قوم بحلف إلا أقر لهم بشر مما أنف منه من قومه، وقال أخوك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك، فانصرف وزوده بغلام يبني الآطام فبنى لمسعود أطماً فكان أول أطم بني بالطائف، ولم يكن بعد ذلك بينهم حرب تذكر {cite:kamil-ibn-al-athir p. 512-513}."
  en: "The civil war of Thaqif's two moieties — the Ahlaf and Banu Malik: when the Ahlaf's herds drove them to fence the Jalathan pasture of Banu Nasr, Banu Malik allied with Yarbu' and war rolled through the day of Ta'if, the al-Aban defile massacre, the days of Umr dhi Kinda and Karuba, and Afif ibn Awf's battle-cry said to have made seventy pregnant women miscarry; it ended when the Ansari Uhayha refused Mas'ud ibn Mu'tib a pact — 'your brother is the one you left behind; reconcile with him though it cost your nose' — and gave him instead a slave who built Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 512-513}."
  fr: "Guerre civile entre les deux branches des Thaqif, les Ahlaf et les Banu Malik : lorsque les troupeaux des Ahlaf les poussèrent à réserver le pâturage de Jalathan des Banu Nasr, les Banu Malik s’allièrent aux Yarbu'. La guerre se poursuivit par la journée de Ta'if, le massacre du défilé d’al-Aban, les journées d’Umr Dhi Kinda et de Karuba, ainsi que le cri d’Afif ibn Awf qui aurait fait avorter soixante-dix femmes enceintes. Elle prit fin quand l’Ansari Uhayha refusa un pacte à Mas'ud ibn Mu'tib — « Ton frère est celui que tu as laissé derrière toi ; réconcilie-toi avec lui, dût-il t’en coûter ton nez » — et lui donna plutôt un esclave qui construisit la première tour fortifiée de Ta'if {cite:kamil-ibn-al-athir p. 512-513}."
  es: "La guerra civil de las dos facciones de Thaqif — los Ahlaf y los Banu Malik: cuando los rebaños de los Ahlaf los obligaron a cercar el pastizal de Jalathan de los Banu Nasr, los Banu Malik se aliaron con Yarbu' y la guerra se extendió durante el día de Ta'if, la masacre del desfiladero de al-Aban, los días de Umr dhi Kinda y Karuba, y el grito de guerra de Afif ibn Awf que se dice que provocó el aborto espontáneo de setenta mujeres embarazadas; terminó cuando el Ansari Uhayha rechazó un pacto con Mas'ud ibn Mu'tib —'tu hermano es el que dejaste atrás; reconcíliate con él aunque te cueste la nariz'— y en su lugar le dio un esclavo que construyó la primera torre-fortaleza de Ta'if {cite:kamil-ibn-al-athir p. 512-513}."
  ur: "ثقیف کے دو حصوں - احلاف اور بنو مالک کی خانہ جنگی: جب احلاف کے ریوڑ نے انہیں بنو نصر کی جلاتن چراگاہ پر باڑ لگانے کے لیے نکالا تو بنو مالک نے یربوع کے ساتھ اتحاد کیا اور جنگ طائف کے دن تک جاری رہی، آل ابان نے ناپاک قتل عام، عمرو اور کفافین کے ایام جنگ کی آواز نے ستر حاملہ خواتین کو اسقاط حمل کرایا۔ اس کا خاتمہ اس وقت ہوا جب انصاری احیحہ نے مسعود بن مطیب سے معاہدہ کرنے سے انکار کر دیا - 'تمہارا بھائی وہی ہے جسے تم نے پیچھے چھوڑ دیا تھا۔ اس کے ساتھ صلح کرو اگرچہ اس کے لیے تمہاری ناک کی قیمت لگ جائے'' - اور اس کے بدلے اسے ایک غلام دے دیا جس نے طائف کا پہلا قلعہ نما مینار بنایا۔ 512-513}۔"
  tr: "Taif'te iki Sakif kabilesi arasında savaş yaşandı: Müttefikler ve Beni Malik; Müttefikler Taif'in ele geçirilmesinde büyük rol oynadılar ve bu yüzden Beni Malik'e saldırdılar. Müttefikler etkili hale gelip atlı sayıları artınca, Beni Nasr ibn Muaviye el-Yarbuiyin topraklarından Celdan'ın korunaklı bölgesini korudular. Beni Nasr ve liderleri Afif ibn Avf öfkelenerek onlarla savaştılar. Beni Malik ve liderleri Cundub ibn Avf, eski husumetlerden faydalanarak Müttefiklere karşı Beni Yarbuiyin ile ittifak kurdular. Aralarındaki ilk savaş Taif günü gerçekleşti ve Müttefikler galip gelerek onları Lahb adlı bir vadiye sürdüler ve Al-Aban vadisinde büyük bir katliamla öldürdüler. Ömer Zilhicce günü ve Keruba günü de dahil olmak üzere birkaç gün boyunca savaştılar. Afif el-Yarbu’i’nin attığı bir çığlık yüzünden yetmiş hamile kadının düşük yaptığı rivayet edilir. Beni Malik, Daws ve Khath’am ile ittifak kurmak için yola çıktı ve müttefikleri de Ensar ile ittifak kurmak için Medine’ye gittiler. Mes’ud ibn Mu’tab, Uhayha ibn Al-Jallah’ın yanına geldi ve Uhayha ona şöyle dedi: “Hiç kimse kendi kavminden bir kavme ittifak kurmak için gitmez, aksi takdirde kendi kavminden tiksindiği şeyden daha kötüsünü kabul etmiş olur. Geride bıraktığın kardeşin de, ‘Geri dön ve onunla barış yap, burnunu ve kulağını kesmek pahasına bile olsa’ dedi.” Bunun üzerine Mas’ud gitti ve Uhayha ona surlar inşa etmesi için bir oğlan çocuğu verdi. Mas’ud için surlu bir ev inşa etti ve bu, Taif’te inşa edilen ilk surlu ev oldu. Bundan sonra aralarında kayda değer bir savaş olmadı. {Kaynak: Kamil ibn al-athir s. 512-513}"
  id: "Perang antara dua suku Thaqif di Taif: kaum Konfederasi dan Banu Malik; kaum Konfederasi memiliki pengaruh besar dalam penaklukan Taif, sehingga mereka menyerang Banu Malik dengan kekuatan mereka. Ketika kaum Konfederasi menjadi berpengaruh dan pasukan mereka bertambah, mereka melindungi wilayah lindung Jaldan dari tanah Banu Nasr ibn Muawiyah al-Yarbu’iyin. Banu Nasr dan pemimpin mereka Afif ibn Awf menjadi marah dan memerangi mereka. Banu Malik dan pemimpin mereka Jundub ibn Awf memanfaatkan hal itu karena dendam lama, sehingga mereka bersekutu dengan Banu Yarbu’ melawan kaum Konfederasi. Pertempuran pertama antara mereka terjadi pada hari Taif, dan kaum Konfederasi menang dan mengusir mereka ke lembah yang disebut Lahb dan membunuh mereka dalam pembantaian besar-besaran di lembah Al-Aban. Mereka berperang selama beberapa hari, termasuk hari Umar Dhi Kinda dan hari Karuba. Afif Al-Yarbu’i meneriakkan seruan yang konon menyebabkan tujuh puluh wanita hamil mengalami keguguran. Bani Malik pergi mencari persekutuan dengan Daws dan Khath’am, dan para sekutu pergi ke Madinah mencari persekutuan dengan kaum Ansar. Mas’ud ibn Mu’tab datang kepada Uhayha ibn Al-Jallah, dan Uhayha berkata kepadanya, “Tidak seorang pun dari kaumnya pergi kepada suatu kaum dengan persekutuan kecuali ia mengakui bagi mereka sesuatu yang lebih buruk daripada apa yang ia benci dari kaumnya sendiri. Dan saudaramu yang kau tinggalkan berkata, ‘Kembalilah kepadanya dan berdamailah dengannya, meskipun itu berarti memotong hidung dan telingamu.’” Maka ia pergi, dan Uhayha memberinya seorang anak laki-laki untuk membangun rumah-rumah berbenteng, sehingga ia membangun rumah berbenteng untuk Mas’ud, dan itu adalah rumah berbenteng pertama yang dibangun di Taif. Setelah itu, tidak ada perang antara mereka yang patut disebutkan. {mengutip: kamil-ibn-al-athir hal. 512-513}"
