label:
  ar: "أبيات للهادي من مجزوء الرمل: وخط الشيب لذاتي، ورفع الراية وإذاقة الأعداء السيف، وتمني يوم بسلاحه والدعام أمامه، ص319-321"
  en: "Verses of al-Hadi in the short ramal metre: grey hair marked my pleasures, raise the banner and give the enemies the sword, and the wish for a day with his arms with al-Da'am before him, pp. 319-321"
  ur: "ہادی کے اشعار مجزوء رمل میں: بڑھاپے نے میری لذتوں پر نشان کر دیا، جھنڈا اٹھاؤ اور دشمنوں کو تلوار چکھاؤ، اور اپنے ہتھیاروں کے ساتھ ایک دن کی تمنا جس میں دعام اس کے آگے ہو، ص319-321"
  es: "Versos de al-Hadi en el metro ramal corto: el cabello gris marcó mis placeres, alzad la bandera y dad la espada a los enemigos, y el deseo de un día con sus armas con al-Da'am delante de él, págs. 319-321"
  fr: "Vers d'al-Hadi en mètre ramal court: les cheveux gris ont marqué mes plaisirs, hissez l'étendard et donnez l'épée aux ennemis, et le souhait d'un jour avec ses armes avec al-Da'am devant lui, pp. 319-321"
summary:
  ar: "قصيدة من مجزوء الرمل بعنوان «وله أيضاً» تبدأ في أسفل ص319 وتنتهي في ص321: يذكر الهادي أن الشيب خط على لذاته ومضى بعض شبابه ومضت الأعمار، ويقول إنه يعلن الدعوة جهراً، ويدعو إلى رفع الراية ونصر الرحمن وإذاقة السيف الأعداء، ويتمنى أن يروح يوماً بسلاحه بين خيل وسيوف وقسي وسهام ويقدم الحرب أمامه «الدعام»، وتنتهي الأبيات بذكر ضرب وطعان ومقام ورجاء أن يبرأ داء صدره؛ وتنقسم الأبيات في الصفحة إلى ثلاثة أعمدة."
  en: "A poem in the short ramal metre under the heading \"and also of his\", begun near the foot of p. 319 and ending on p. 321: al-Hadi says grey hair has marked his pleasures and part of his youth and of lives has gone, that he announces the call openly, bids the raising of the banner, the aiding of the Merciful and the giving of the sword to enemies, and wishes he might ride out one day with his arms among horses, swords, bows and arrows with war led before him by \"al-Da'am\", the poem ending in blows, thrusts and a stand and the hope that the sickness of his chest be healed; the lines are printed in three columns on the page."
  ur: "مجزوء رمل میں نظم، عنوان «اور اس کا یہ بھی» کے تحت جو ص319 کے آخر کے قریب شروع ہو کر ص321 پر ختم ہوتی ہے: ہادی کہتا ہے کہ بڑھاپے نے اس کی لذتوں پر نشان کر دیا اور اس کی جوانی کا کچھ حصہ اور عمریں گزر گئیں، کہ وہ دعوت کا اعلان کھلے عام کرتا ہے، جھنڈا بلند کرنے، رحمان کی مدد کرنے اور دشمنوں کو تلوار چکھانے کو کہتا ہے، اور تمنا کرتا ہے کہ وہ ایک دن اپنے ہتھیاروں کے ساتھ گھوڑوں، تلواروں، کمانوں اور تیروں کے بیچ نکلے اور «دعام» اس کے آگے جنگ لے کر چلے، نظم ضربوں، نیزوں اور ایک ٹھہراؤ پر ختم ہوتی ہے اور یہ امید کہ اس کے سینے کا مرض ٹھیک ہو؛ اشعار صفحے پر تین ستونوں میں چھپے ہیں۔"
  es: "Un poema en el metro corto ramal bajo el título \"y también de él\", que comienza cerca del pie de la página 319 y termina en la página 321: al-Hadi dice que las canas han marcado sus placeres y que parte de su juventud y de sus vidas se han ido, que anuncia el llamado abiertamente, ordena que se levante el estandarte, que se ayude al Misericordioso y que se entregue la espada a los enemigos, y desea poder cabalgar un día con sus armas entre caballos, espadas, arcos y flechas con la guerra dirigida delante de él por \"al-Da'am\", el poema termina en golpes, estocadas y una postura y la esperanza de que la enfermedad de su pecho sea curada; los versos están impresos en tres columnas en la página."
  fr: "Un poème en mètre ramal court, sous le titre « et aussi de lui », commençant vers le bas de la page 319 et se terminant à la page 321: al-Hadi dit que les cheveux gris ont marqué ses plaisirs et qu’une partie de sa jeunesse et de ses vies s’est envolée, qu’il lance l’appel ouvertement, ordonne de lever l’étendard, d’aider le Miséricordieux et de donner l’épée aux ennemis, et souhaite pouvoir un jour chevaucher les armes parmi les chevaux, les épées, les arcs et les flèches, la guerre menée devant lui par « al-Da’am », le poème se terminant par des coups, des estocs et une position debout, et l’espoir que la maladie de sa poitrine soit guérie; les vers sont imprimés sur trois colonnes sur la page."
