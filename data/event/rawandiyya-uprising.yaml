kind: revolt
label: { ar: "خروج الراوندية", en: "The uprising of the Rawandiyya", es: "El levantamiento de los Rawandiyya", fr: "Le soulèvement des Rawandiyya", ur: "راوندیہ کی بغاوت" }
summary:
  ar: "ذكر الطبري خروج الراوندية، وقال بعضهم إن أمرهم وأمر أبي جعفر كان في سنة سبع وثلاثين ومائة أو ست وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.505}، وعند السيوطي في سنة إحدى وأربعين كان ظهور الراوندية القائلين بالتناسخ فقتلهم المنصور {cite:tarikh-khulafa-minhaj-1434 p. 424}"
  en: "Al-Tabari mentions the uprising of the Rawandiyya. Some said that their affair and that of Abu Ja'far was in 137 or 136 {cite:tabari-tarikh-abu-al-fadl j.7 p.505}. According to al-Suyuti, the Rawandiyya who held the doctrine of metempsychosis appeared in 141, and al-Mansur killed them {cite:tarikh-khulafa-minhaj-1434 p. 424}"
  es: "Al-Tabari menciona el levantamiento de los Rawandiyya. Algunos afirman que su conflicto, junto con el de Abu Ja'far, tuvo lugar en 137 o 136 {cite:tabari-tarikh-abu-al-fadl j.7 p.505}. Según al-Suyuti, los Rawandiyya que profesaban la doctrina de la metempsicosis surgieron en 141, y al-Mansur los asesinó {cite:tarikh-khulafa-minhaj-1434 p. 424}."
  fr: "Al-Tabari mentionne le soulèvement des Rawandiyya. Certains affirment que leur affaire, ainsi que celle d'Abu Ja'far, eut lieu en 137 ou 136 av. J.-C. (cit.: Tabari, Tarikh Abu al-Fadl, vol. 7, p. 505). Selon al-Suyuti, les Rawandiyya, partisans de la doctrine de la métempsychose, apparurent en 141 av. J.-C., et al-Mansur les massacra (cit.: Tarikh Khulafa Minhaj, 1434, p. 424)."
  ur: "الطبری نے راوندیہ کی بغاوت کا ذکر کیا ہے۔ بعض نے کہا کہ ان کا اور ابو جعفر کا معاملہ 137 یا 136 میں تھا۔ السیوطی کے مطابق، راوندیہ جو metemppsychosis کے عقیدہ کے حامل تھے 141 میں ظاہر ہوا، اور المنصور نے انہیں قتل کر دیا۔ 424}"
