summary:
  ar: "ذكر الطبري خروج الراوندية، وقال بعضهم إن أمرهم وأمر أبي جعفر كان في سنة سبع وثلاثين ومائة أو ست وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.505}، وعند السيوطي في سنة إحدى وأربعين كان ظهور الراوندية القائلين بالتناسخ فقتلهم المنصور {cite:tarikh-khulafa-minhaj-1434 p. 424}"
  en: "Al-Tabari mentions the uprising of the Rawandiyya. Some said that their affair and that of Abu Ja'far was in 137 or 136 {cite:tabari-tarikh-abu-al-fadl j.7 p.505}. According to al-Suyuti, the Rawandiyya who held the doctrine of metempsychosis appeared in 141, and al-Mansur killed them {cite:tarikh-khulafa-minhaj-1434 p. 424}"
