id: event/killing-of-marwan-ibn-muhammad
class: event
kind: death
label: { ar: "مقتل مروان بن محمد", en: "The killing of Marwan ibn Muhammad" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة قُتل مروان بن محمد {cite:tabari-tarikh-abu-al-fadl j.7 p.437} بعد هزيمته بالزاب {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، وعند السيوطي فر مروان إلى مصر فتبعه صالح أخو عبد الله فالتقيا بقرية بوصير فقتل مروان بها في ذي الحجة، وأخرج الصولي أنه لما قطع رأسه ووجه به إلى عبد الله بن علي فنظر إليه وعزل جاءت هرة فاقتلعت لسانه وجعلت تمضغه فقال عبد الله لو لم يرنا الدهر من عجائبه إلا لسان مروان في فم هر لكفانا ذلك {cite:tarikh-khulafa-minhaj-1434 p. 413}"
  en: "In the year 132 Marwan ibn Muhammad was killed {cite:tabari-tarikh-abu-al-fadl j.7 p.437} after his defeat at the Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}. According to al-Suyuti, Marwan fled to Egypt, and Salih, brother of Abd Allah, pursued him; they met at the village of Busir, where Marwan was killed in Dhu'l-Hijja. Al-Suli reports that when his head was cut off and sent to Abd Allah ibn Ali, Abd Allah looked at it and set it aside, and a cat came, pulled out his tongue and began chewing it. Abd Allah said: 'If time had shown us no wonder but Marwan's tongue in a cat's mouth, that would have sufficed us' {cite:tarikh-khulafa-minhaj-1434 p. 413}."
