label: { ar: "مقتل مروان بن محمد", en: "The killing of Marwan ibn Muhammad", es: "El asesinato de Marwan ibn Muhammad", fr: "Le meurtre de Marwan ibn Muhammad", ur: "مروان بن محمد کا قتل", tr: "Mervan ibn Muhammed'in öldürülmesi", id: "Pembunuhan Marwan bin Muhammad" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة قُتل مروان بن محمد {cite:tabari-tarikh-abu-al-fadl j.7 p.437} بعد هزيمته بالزاب {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، وعند السيوطي فر مروان إلى مصر فتبعه صالح أخو عبد الله فالتقيا بقرية بوصير فقتل مروان بها في ذي الحجة، وأخرج الصولي أنه لما قطع رأسه ووجه به إلى عبد الله بن علي فنظر إليه وعزل جاءت هرة فاقتلعت لسانه وجعلت تمضغه فقال عبد الله لو لم يرنا الدهر من عجائبه إلا لسان مروان في فم هر لكفانا ذلك {cite:tarikh-khulafa-minhaj-1434 p. 413}"
  en: "In the year 132 Marwan ibn Muhammad was killed {cite:tabari-tarikh-abu-al-fadl j.7 p.437} after his defeat at the Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}. According to al-Suyuti, Marwan fled to Egypt, and Salih, brother of Abd Allah, pursued him; they met at the village of Busir, where Marwan was killed in Dhu'l-Hijja. Al-Suli reports that when his head was cut off and sent to Abd Allah ibn Ali, Abd Allah looked at it and set it aside, and a cat came, pulled out his tongue and began chewing it. Abd Allah said: 'If time had shown us no wonder but Marwan's tongue in a cat's mouth, that would have sufficed us' {cite:tarikh-khulafa-minhaj-1434 p. 413}."
  es: "En el año 132, Marwan ibn Muhammad fue asesinado {cite:tabari-tarikh-abu-al-fadl j.7 p.437} tras su derrota en el Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}. Según al-Suyuti, Marwan huyó a Egipto, y Salih, hermano de Abd Allah, lo persiguió; se encontraron en la aldea de Busir, donde Marwan fue asesinado en Dhu'l-Hijja. Al-Suli relata que cuando le cortaron la cabeza y se la enviaron a Abd Allah ibn Ali, Abd Allah la miró y la apartó, y entonces llegó un gato, le arrancó la lengua y empezó a masticarla. Abd Allah dijo: «Si el tiempo no nos hubiera mostrado otro milagro que la lengua de Marwan en la boca de un gato, eso nos habría bastado» {cite:tarikh-khulafa-minhaj-1434 p. 413}."
  fr: "En l'an 132, Marwan ibn Muhammad fut tué après sa défaite au Zab. Selon al-Suyuti, Marwan s'enfuit en Égypte, poursuivi par Salih, frère d'Abd Allah. Ils se rencontrèrent au village de Busir, où Marwan fut tué en Dhu al-Hijja. Al-Suli rapporte que lorsque sa tête fut tranchée et envoyée à Abd Allah ibn Ali, ce dernier la contempla puis la mit de côté. Un chat arriva alors, lui arracha la langue et se mit à la mâcher. Abd Allah dit alors: « Si le temps ne nous avait rien montré d'autre que la langue de Marwan dans la gueule d'un chat, cela nous aurait suffi. »"
  ur: "سنہ 132 میں مروان ابن محمد زب میں شکست کے بعد {حوالہ:طبری-تاریخ-ابو الفضل ج.7 ص.437} مارا گیا۔ سیوطی کے مطابق، مروان مصر کی طرف بھاگا، اور عبداللہ کے بھائی صالح نے اس کا تعاقب کیا۔ ان کی ملاقات بسیر نامی گاؤں میں ہوئی، جہاں ذوالحجہ میں مروان کو قتل کیا گیا تھا۔ السلی بیان کرتے ہیں کہ جب اس کا سر کاٹ کر عبداللہ بن علی کے پاس بھیجا گیا تو عبداللہ نے اس کی طرف دیکھا اور اسے ایک طرف رکھ دیا اور ایک بلی آئی، اپنی زبان نکال کر اسے چبانے لگی۔ عبداللہ نے کہا: ''اگر وقت ہمیں بلی کے منہ میں مروان کی زبان کے سوا کوئی تعجب نہ دکھاتا تو یہ ہمارے لیے کافی ہوتا''۔ 413}۔"
  tr: "Hicri 132 yılında Mervan ibn Muhammed, Zeb'deki yenilgisinden sonra öldürüldü. Suyuti'ye göre Mervan Mısır'a kaçtı ve Abdullah'ın kardeşi Salih onu takip etti. Zilhicce ayında Mervan'ın öldürüldüğü Busir köyünde buluştular. Suyuti'nin rivayetine göre, başı kesilip Abdullah ibn Ali'ye gönderildiğinde, Abdullah ibn Ali başı inceleyip onu görevden aldı. Bunun üzerine bir kedi gelip dilini koparıp çiğnemeye başladı. Abdullah, \"Zaman bize kedinin ağzında Mervan'ın dilinden başka bir şey göstermeseydi bile, bu bize yeterdi\" dedi."
  id: "Pada tahun 132 H, Marwan bin Muhammad terbunuh setelah kekalahannya di Zab. Menurut al-Suyuti, Marwan melarikan diri ke Mesir, dan Salih, saudara Abdullah, mengikutinya. Mereka bertemu di desa Busir, tempat Marwan terbunuh pada bulan Dzul Hijjah. Al-Suli melaporkan bahwa ketika kepalanya dipenggal dan dikirim kepada Abdullah bin Ali, yang melihatnya dan kemudian membuangnya, seekor kucing datang dan mencabik lidahnya lalu mulai mengunyahnya. Abdullah berkata, \"Seandainya waktu hanya menunjukkan kepada kita lidah Marwan di mulut kucing, itu sudah cukup bagi kita.\""
