summary:
  ar: "صنّف ابن رشد سنتي 1179 و1180م ثلاث رسائل مترابطة في الذب عن الفلسفة: «فصل المقال» و«الكشف عن مناهج الأدلة» و«تهافت التهافت» جواباً على الغزالي {cite:britannica-averroes}."
  en: "In 1179–80 Ibn Rushd composed his three connected treatises in defence of philosophy: Faṣl al-Maqāl, Kashf al-Manāhij, and Tahāfut al-Tahāfut answering al-Ghazali {cite:britannica-averroes}."
  ur: "1179–80ء میں ابن رشد نے فلسفہ کے دفاع میں تین مربوط رسالے لکھے: فصل المقال، کشف المناہج اور تہافت التہافت بطور جواب غزالی کے {cite:britannica-averroes}."
  es: "En 1179–80 Ibn Rushd compuso sus tres tratados conectados en defensa de la filosofía: Faṣl al-Maqāl, Kashf al-Manāhij y Tahāfut al-Tahāfut respondiendo a al-Ghazali {cite:britannica-averroes}."
  fr: "En 1179-1180, Ibn Rushd composa ses trois traités liés en défense de la philosophie: Faṣl al-Maqāl, Kashf al-Manāhij et Tahāfut al-Tahāfut répondant à al-Ghazali {cite:britannica-averroes}."
  tr: "İbn Rüşd, milattan sonra 1179 ve 1180 yıllarında felsefeyi savunmak amacıyla \"Kesin Risale\", \"İspat Yöntemlerinin Açığa Çıkarılması\" ve Gazali'ye yanıt olarak \"Tutarsızlığın Tutarsızlığı\" adlı üç ilgili risale yazmıştır."
  id: "Pada tahun 1179 dan 1180 M, Ibn Rushd menulis tiga risalah yang saling berkaitan untuk membela filsafat: “Risalah yang Menentukan,” “Pengungkapan Metode Pembuktian,” dan “Ketidakkonsistenan dari Ketidakkonsistenan,” sebagai tanggapan terhadap Al-Ghazali."
