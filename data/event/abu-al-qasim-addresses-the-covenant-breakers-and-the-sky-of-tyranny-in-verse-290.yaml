id: event/abu-al-qasim-addresses-the-covenant-breakers-and-the-sky-of-tyranny-in-verse-290
class: event
kind: other
label:
  ar: أبيات أبي القاسم إلى الناقضين وإلى «سماء الجور»، ص267-268، 290هـ
  en: Abu al-Qasim's verses to the covenant-breakers and to the "sky of tyranny", pp. 267-268, 290 AH
  ur: ناقضین عہد اور «ظلم کے آسمان» سے ابو القاسم کے اشعار، ص267-268، 290ھ
summary:
  ar: 'مقطوعتان ينسبهما الكتاب إلى أبي القاسم: الأولى لمن لم يحفظ العهد ونقض بيعة الإصلاح، والثانية خطاب «سماء الجور» يذكر فيها ضياع كتاب الله ويقول إن غضبه للدين لا يدعه ينام وإنه يعمل رمحه وسيفه.'
  en: 'Two pieces the book ascribes to Abu al-Qasim: the first to those who did not keep the covenant and broke the pledge of reform, the second addressed to the "sky of tyranny", saying that the book of God was lost, that his anger for the religion lets him not sleep and that he will ply his lance and sword.'
  ur: 'دو ٹکڑے جو کتاب ابو القاسم سے منسوب کرتی ہے: پہلا ان کے نام جنہوں نے عہد کی حفاظت نہ کی اور اصلاح کی بیعت توڑی، دوسرا «ظلم کے آسمان» سے خطاب جس میں کتاب اللہ کے ضائع ہونے کا ذکر ہے اور وہ کہتے ہیں کہ دین کے لیے ان کا غصہ انہیں سونے نہیں دیتا اور وہ نیزہ اور تلوار چلائیں گے۔'
