id: event/tall-bani-shaqiq-bodies-276
class: event
kind: other
label: { ar: "الأجساد السبعة بتل بني شقيق", en: "The Seven Bodies at the Mound of Bani Shaqiq", es: "Los siete cuerpos en el montículo de Bani Shaqiq", fr: "Les sept corps du tumulus de Bani Shaqiq", ur: "بنی شقیق کے ٹیلے پر سات لاشیں", tr: "Beni Şakik'in Yedi Cesedi", id: "Tujuh Tubuh Bani Shaqiq" }
summary:
  ar: "في سنة ست وسبعين ومائتين ورد الخبر بانفراج تلّ على نهر الصراة يُعرف بتلّ بني شقيق، فوُجد في لوح من الحجر محفورة كتابة لا تُقرأ، وسبعة أقبور فيها سبعة أبدان صحيحة عليها أكفان جدد تفوح منها رائحة المسك، وفي أحدهم أثر ضربة في خاصرته وكأن على شفته بللًا كأنه شرب ماء {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "In 276 AH a mound called Tall Bani Shaqiq on the Nahr al-Sarat split open, revealing a stone tablet with unreadable writing and seven graves holding seven intact bodies in fresh musk-scented shrouds, hair still rooted like the living {cite:muntazam-ibn-al-jawzi p. 100}."
  es: "En el año 276 AH, un montículo llamado Tall Bani Shaqiq en Nahr al-Sarat se abrió, revelando una tablilla de piedra con escritura ilegible y siete tumbas que contenían siete cuerpos intactos en sudarios frescos con aroma a almizcle, con el cabello aún enraizado como el de los vivos {cite:muntazam-ibn-al-jawzi p. 100}."
  fr: "En 276 AH, un monticule appelé Tall Bani Shaqiq sur le Nahr al-Sarat s'est ouvert, révélant une tablette de pierre avec une écriture illisible et sept tombes contenant sept corps intacts dans des linceuls frais parfumés au musc, les cheveux encore enracinés comme chez les vivants {cite:muntazam-ibn-al-jawzi p. 100}."
  ur: "276 ہجری میں نہر الصراط پر قد بنی شقیق نامی ٹیلہ پھٹ گیا، جس سے پتھر کی ایک تختی کھلی جس میں پڑھی نہیں جا سکتی تھی اور سات قبریں تھیں جن میں تازہ کستوری کی خوشبو والے کفنوں میں سات لاشیں تھیں، بال ابھی تک زندہ کی طرح جڑے ہوئے تھے۔ 100}۔"
  tr: "Hicri 276 yılında, Sarat Nehri üzerinde Beni Şakik Tepesi olarak bilinen bir tepenin açıldığı haberi geldi. Bir taş levha üzerinde okunaksız bir yazıt bulundu ve yedi mezarda, misk kokusu yayan yeni kefenlerle sarılmış yedi sağlam ceset ortaya çıkarıldı. Bunlardan birinin yan tarafında bir darbe izi vardı ve dudağı su içmiş gibi ıslaktı. {cite:muntazam-ibn-al-jawzi s. 100}"
  id: "Pada tahun 276 H, kabar sampai mengenai pembukaan sebuah bukit di Sungai Sarat yang dikenal sebagai bukit Bani Shaqiq. Sebuah prasasti yang tidak terbaca ditemukan pada sebuah lempengan batu, dan tujuh kuburan berisi tujuh jenazah utuh dengan kain kafan baru yang mengeluarkan aroma kesturi. Salah satu dari mereka memiliki bekas pukulan di sisinya, dan bibirnya basah seolah-olah dia telah minum air. {cite:muntazam-ibn-al-jawzi p. 100}"
