summary:
  ar: "في سنة ست وسبعين ومائتين ورد الخبر بانفراج تلّ على نهر الصراة يُعرف بتلّ بني شقيق، فوُجد في لوح من الحجر محفورة كتابة لا تُقرأ، وسبعة أقبور فيها سبعة أبدان صحيحة عليها أكفان جدد تفوح منها رائحة المسك، وفي أحدهم أثر ضربة في خاصرته وكأن على شفته بللًا كأنه شرب ماء {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "In 276 AH a mound called Tall Bani Shaqiq on the Nahr al-Sarat split open, revealing a stone tablet with unreadable writing and seven graves holding seven intact bodies in fresh musk-scented shrouds, hair still rooted like the living {cite:muntazam-ibn-al-jawzi p. 100}."
