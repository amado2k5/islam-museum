summary:
  ar: "المواجهات الرقمية المعاصرة بين دعاة سنة كـ[[person/muhammad-hijab|محمد حجاب]] و[[person/adnan-rashid|عدنان رشيد]] و[[person/ali-dawah|علي دعوة]] وشخصيات يهودية أرثوذكسية مضادة للتنصير كالحاخام [[person/tovia-singer|طوفيا سينغر]]، مسجلة ومفرغة على المنصات؛ وخلافاً لمناظرات المسلمين والنصارى، تركز هذه المواجهات على التوراة الشفوية والتلمود، ونقل النص الماسوري، وعالمية النبوة في مقابل قوميتها، وتفسير التثنية 18:18 في النبي الموعود {cite:youtube-sunni-jewish-debate}."
  en: "The contemporary digital encounters between Sunni speakers such as [[person/muhammad-hijab|Muhammad Hijab]], [[person/adnan-rashid|Adnan Rashid]] and [[person/ali-dawah|Ali Dawah]] and Orthodox Jewish counter-missionary figures such as Rabbi [[person/tovia-singer|Tovia Singer]], recorded and transcribed on the platforms. Unlike Muslim–Christian debates, these exchanges turn on the Oral Torah and Talmud, the transmission of the Masoretic text, the universal versus national scope of prophecy, and the reading of Deuteronomy 18:18 on the prophet to come {cite:youtube-sunni-jewish-debate}."
