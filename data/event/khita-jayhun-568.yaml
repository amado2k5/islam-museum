summary:
  ar: "عبرت الخطا جيحون وجرت الحرب بينهم وبين إيل أرسلان خوارزمشاه، وهو أول ظهور دولة الخطا — قرا ختائي — بما وراء النهر بعد زوال دولة السلاجقة {cite:kamil-ibn-al-athir p. 37}."
  en: "The Khitā — the Qarā Khiṭāy — crossed the Jayḥūn and war ran between them and Khwārazmshāh Īl-Arslān: the first reach of their dominion beyond the river after the Seljuk state had fallen {cite:kamil-ibn-al-athir p. 37}."
