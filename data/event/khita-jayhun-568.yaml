  fr: "Les Khitā — les Qarā Khiṭāy — traversèrent le Jayḥūn et la guerre éclata entre eux et Khwārazmshāh Īl-Arslān: la première extension de leur domination au-delà du fleuve après la chute de l'État seldjoukide {cite:kamil-ibn-al-athir p. 37}."
  ur: "خیتہ - قرہ خیطے - نے جیحون کو عبور کیا اور ان کے اور خوارزمشاہ ارسلان کے درمیان جنگ ہوئی: سلجوق ریاست کے گرنے کے بعد دریا کے پار ان کے تسلط کی پہلی پہنچ {حوالہ: کامل ابن الاثیر ص۔ 37}۔"
