label:
  ar: "أبو جعفر يقتل علي بن الحارث القيناني ويودع أهله، 295هـ، ص377"
  en: "Abu Ja'far kills Ali ibn al-Harith al-Qaynani and takes leave of his household, 295 AH, p. 377"
  fr: "Abu Ja'far tue Ali ibn al-Harith al-Qaynani et prend congé de sa maisonnée, 295 de l’hégire, p. 377"
  ur: "ابو جعفر علی بن الحارث القیناني کو قتل کرتا ہے اور اپنے گھر والوں کو الوداع کہتا ہے، 295ھ، ص377"
summary:
  ar: "قتل أبو جعفر، وهو مجروح، مهاجمه علي بن الحارث القيناني بأن طعنه بسيفه بعد أن عجز عن حمله بيده، ثم ودّع حرمه وصبيانه وأوصاهم، وسأل الله أن يبلغه ما وعد به أولياءه."
  en: "Wounded, Abu Ja'far killed his attacker Ali ibn al-Harith al-Qaynani by thrusting his sword into him, then took leave of his women and children and commended them to God."
  fr: "Blessé, Abu Ja'far tua son assaillant Ali ibn al-Harith al-Qaynani en lui enfonçant son épée dans le corps, puis prit congé de ses femmes et de ses enfants et les confia à Dieu."
  ur: "زخمی حالت میں ابو جعفر نے اپنے حملہ آور علی بن الحارث القیناني کو تلوار سے مار گرایا، پھر گھر کی خواتین اور بچوں کو الوداع کہا اور انہیں اللہ کے سپرد کیا۔"
