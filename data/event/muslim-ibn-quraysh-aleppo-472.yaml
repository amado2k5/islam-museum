class: event
kind: conquest
label: { ar: "أخذ مسلم بن قريش العقيلي حلب", en: "Muslim ibn Quraysh al-Uqayli takes Aleppo", es: "El musulmán ibn Quraysh al-Uqayli toma Alepo", fr: "Le musulman ibn Quraysh al-Uqayli prend Alep", ur: "مسلم بن قریش العقیلی نے حلب پر قبضہ کیا۔", tr: "Müslim ibn Kureyş el-Ukayli Halep'i ele geçirdi.", id: "Muslim bin Quraysh al-Uqayli merebut Aleppo." }
summary:
  ar: "في سنة 472هـ أخذ مسلم بن قريش العقيلي حلب، وكتب إلى السلطان ملكشاه كتاباً أشهد فيه على نفسه بالعوض عنها بثلاثمائة ألف دينار كل سنة تؤدى إلى خزانة السلطان فأجابه إلى ذلك {cite:muntazam-ibn-al-jawzi j.8 p.323}."
  en: "In 472 AH Muslim ibn Quraysh al-Uqayli took Aleppo. He wrote to Sultan Malikshah a document in which he bore witness against himself to paying for it three hundred thousand dinars a year, delivered to the sultan's treasury; the sultan agreed to this {cite:muntazam-ibn-al-jawzi j.8 p.323}."
  es: "En el año 472 de la Hégira, Muslim ibn Quraysh al-Uqayli tomó Alepo. Escribió al sultán Malikshah un documento en el que atestiguaba que pagaría por ella trescientos mil dinares al año, que se entregaban al tesoro del sultán; el sultán aceptó esto {cite:muntazam-ibn-al-jawzi j.8 p.323}."
  fr: "En 472 AH, Muslim ibn Quraysh al-Uqayli prit Alep. Il écrivit au sultan Malikshah un document dans lequel il attestait contre lui-même payer pour la ville trois cent mille dinars par an, versés au trésor du sultan; le sultan accepta cela {cite:muntazam-ibn-al-jawzi j.8 p.323}."
  ur: "472ھ میں مسلم بن قریش عقیلی نے حلب پر قبضہ کیا۔ اس نے سلطان ملک شاہ کو ایک دستاویز لکھی جس میں اس نے اپنے خلاف گواہی دی کہ وہ اس کے لیے تین لاکھ دینار سالانہ ادا کرتا ہے، سلطان کے خزانے میں پہنچاتا ہے۔ سلطان نے اس پر اتفاق کیا {حوالہ:منتظم ابن الجوزی ج8 ص 323}۔"
  tr: "Hicri 472 yılında Müslim ibn Kureyş el-Ukayili Halep'i ele geçirdi ve Sultan Malikşah'a bir mektup yazarak, bunun karşılığında her yıl üç yüz bin dinar hazinesine ödeme yapacağına dair şahitlik etti ve Sultan da bunu kabul etti. {cite:muntazam-ibn-al-jawzi j.8 p.323}"
  id: "Pada tahun 472 H, Muslim ibn Quraish al-Uqaili merebut Aleppo, dan ia menulis surat kepada Sultan Malikshah yang isinya menyatakan bahwa ia akan membayar tiga ratus ribu dinar setiap tahun ke kas Sultan sebagai kompensasi atas hal tersebut, dan Sultan menyetujuinya. {cite:muntazam-ibn-al-jawzi j.8 p.323}."
