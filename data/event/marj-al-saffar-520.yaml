label:
  ar: وقعة مرج الصفر مع الفرنج
  en: Battle of Marj al-Saffar against the Franks
summary:
  ar: "وقعة مرج الصفر آخر سنة 520هـ؛ اجتمع الإفرنج ملوكهم وقمامصتهم وساروا إلى دمشق فنزلوا مرج الصفر، وبعث الأتابك طغركين بالصريخ إلى تركمان ديار بكر وخيم قبالتهم مستحلفاً ابنه بوري على دمشق، وناجزهم الحرب فصرع طغركين عن فرسه وانهزم المسلمون، ومضت خيالة الإفرنج في اتباعهم وبقي رجالة التركمان في المعركة فلما خلص إليهم رجالة الإفرنج اجتمعوا واستماتوا وحملوا عليهم فقتلوهم ونهبوا عسكرهم وعادوا غانمين ظافرين إلى دمشق، ورجعت خيالة الإفرنج منهزمة فوجدت معسكرها منهوباً ورجالها قتلى."
  en: "The battle of Marj al-Saffar, late 520 AH; the Franks mustered their kings and counts and camped at Marj al-Saffar outside Damascus — the Atabeg Tughtakin summoned the Turkman of Diyar Bakr, left his son Buri sworn over the city, and joined battle; he was unhorsed and the Muslims broke, the Frankish horse chasing after them, but the Turkman infantry stood and fought to the death, massacring the Frankish foot and looting their camp before returning laden to Damascus — the returning Frankish cavalry found their camp plundered and their footmen dead."
