label:
  ar: وقعة مرج الصفر مع الفرنج
  en: Battle of Marj al-Saffar against the Franks
  es: "Batalla de Marj al-Saffar contra los francos"
  fr: "Bataille de Marj al-Saffar contre les Francs"
  ur: "فرینکوں کے خلاف مرج الصفر کی جنگ"
summary:
  ar: "وقعة مرج الصفر آخر سنة 520هـ؛ اجتمع الإفرنج ملوكهم وقمامصتهم وساروا إلى دمشق فنزلوا مرج الصفر، وبعث الأتابك طغركين بالصريخ إلى تركمان ديار بكر وخيم قبالتهم مستحلفاً ابنه بوري على دمشق، وناجزهم الحرب فصرع طغركين عن فرسه وانهزم المسلمون، ومضت خيالة الإفرنج في اتباعهم وبقي رجالة التركمان في المعركة فلما خلص إليهم رجالة الإفرنج اجتمعوا واستماتوا وحملوا عليهم فقتلوهم ونهبوا عسكرهم وعادوا غانمين ظافرين إلى دمشق، ورجعت خيالة الإفرنج منهزمة فوجدت معسكرها منهوباً ورجالها قتلى."
  en: "The battle of Marj al-Saffar, late 520 AH; the Franks mustered their kings and counts and camped at Marj al-Saffar outside Damascus — the Atabeg Tughtakin summoned the Turkman of Diyar Bakr, left his son Buri sworn over the city, and joined battle; he was unhorsed and the Muslims broke, the Frankish horse chasing after them, but the Turkman infantry stood and fought to the death, massacring the Frankish foot and looting their camp before returning laden to Damascus — the returning Frankish cavalry found their camp plundered and their footmen dead."
  es: "La batalla de Marj al-Saffar, a finales del año 520 de la Hégira; los francos reunieron a sus reyes y condes y acamparon en Marj al-Saffar, a las afueras de Damasco. El Atabeg Tughtakin convocó al turcomano de Diyar Bakr, dejó a su hijo Buri juramentado sobre la ciudad y se unió a la batalla. Buri fue derribado de su caballo y los musulmanes se dispersaron, la caballería franca los persiguió, pero la infantería turcomana resistió y luchó hasta la muerte, masacrando a la infantería franca y saqueando su campamento antes de regresar cargado a Damasco. La caballería franca que regresaba encontró su campamento saqueado y a sus infantes muertos."
  fr: "La bataille de Marj al-Saffar, fin 520 AH; les Francs rassemblèrent leurs rois et comtes et campèrent à Marj al-Saffar, aux portes de Damas. L'atabeg Tughtakin convoqua le Turkmène de Diyar Bakr, confia la ville à son fils Buri, et se joignit au combat. Ce dernier fut désarçonné et les musulmans se dispersèrent, la cavalerie franque se lançant à leur poursuite. Mais l'infanterie turkmène tint bon et combattit jusqu'à la mort, massacrant l'infanterie franque et pillant leur camp avant de retourner à Damas, chargée de butin. La cavalerie franque de retour trouva son camp pillé et ses fantassins morts."
  ur: "معرکہ مرج الصفار، اواخر 520 ہجری؛ فرینکوں نے اپنے بادشاہوں اور شماروں کو اکٹھا کیا اور دمشق کے باہر مرج الصفر میں ڈیرے ڈالے - اتابگ تغطکین نے دیار بکر کے ترکمان کو بلایا، اپنے بیٹے بری کو شہر پر حلف دلایا اور جنگ میں شامل ہوئے۔ وہ گھوڑوں سے محروم تھا اور مسلمان ٹوٹ گئے، فرینکش گھوڑے ان کا پیچھا کر رہے تھے، لیکن ترکمان پیادہ کھڑے رہے اور موت تک لڑتے رہے، فرانکش کے پیروں کا قتل عام کیا اور لادین دمشق واپس لوٹنے سے پہلے ان کے کیمپ کو لوٹ لیا - واپس آنے والے فرینک کیولری نے ان کے کیمپ کو لوٹا ہوا پایا اور ان کے پیادے ہلاک ہوئے۔"
