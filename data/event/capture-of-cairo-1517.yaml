label: { ar: "أخذ القاهرة ⁦(١٥١٧)⁩", en: "Capture of Cairo", fr: "La prise du Caire", es: "Captura de El Cairo", ur: "قاہرہ پر قبضہ" }
summary:
  ar: "بعد [[event/battle-ridaniyya-923|الريدانية]] دخل [[person/selim-i-ottoman|سليم الأول]] مصر؛ وينقل الصلابي عن المؤرخ سلاحثور صاحب مخطوطة «فتح نامه ديار العرب» — وكان مصاحباً لسليم — أن سليم كان يبكي في مسجد الصخرة بالقدس بكاءً حاراً وصلى صلاة الحاجة داعياً أن يفتح عليه مصر {cite:dawlat-uthmaniyya-salabi p. 188}. ويذكر أن سليم ولّى [[person/khayr-bak|خاير بك]] على مصر و[[person/janbardi-al-ghazali|جانبردي الغزالي]] على دمشق {cite:dawlat-uthmaniyya-salabi p. 188}، وعند ابن العماد صُلب طومان باي بباب زويلة فانقضت دولة الجراكسة {cite:shadharat-dhahab p. 531}."
  en: "After [[event/battle-ridaniyya-923|Ridaniyya]] Selim I entered Egypt; al-Salabi quotes the chronicler Salahsur — companion of Selim and author of the manuscript *Fath-nameh Diyar al-Arab* — that Selim wept long in the Dome of the Rock and prayed for Egypt's opening {cite:dawlat-uthmaniyya-salabi p. 188}. He appointed [[person/khayr-bak|Khayr Bak]] over Egypt and [[person/janbardi-al-ghazali|Janbirdi al-Ghazali]] over Damascus {cite:dawlat-uthmaniyya-salabi p. 188}; at Shadharat, Tuman Bay was hanged at Bab Zuwayla and the Circassian state ended {cite:shadharat-dhahab p. 531}."
  fr: "Après [[event/battle-ridaniyya-923|Ridaniyya]], Sélim Ier entra en Égypte ; al-Salabi cite le chroniqueur Salahsur, compagnon de Sélim et auteur du manuscrit *Fath-nameh Diyar al-Arab*, selon qui Sélim pleura longuement dans le Dôme du Rocher et pria pour l'ouverture de l'Égypte {cite:dawlat-uthmaniyya-salabi p. 188}. Il nomma [[person/khayr-bak|Khayr Bak]] sur l'Égypte et [[person/janbardi-al-ghazali|Janbirdi al-Ghazali]] sur Damas {cite:dawlat-uthmaniyya-salabi p. 188} ; selon les Shadharat, Tuman Bay fut pendu à Bab Zuwayla et l'État circassien prit fin {cite:shadharat-dhahab p. 531}."
  es: "Después de [[evento/batalla-ridaniyya-923|Ridaniyya]] Selim I entró en Egipto; al-Salabi cita al cronista Salahsur —compañero de Selim y autor del manuscrito *Fath-nameh Diyar al-Arab*— que Selim lloró largo tiempo en la Cúpula de la Roca y oró por la apertura de Egipto {cite:dawlat-uthmaniyya-salabi p. 188}. Nombró a [[persona/khayr-bak|Khayr Bak]] sobre Egipto y a [[persona/janbardi-al-ghazali|Janbirdi al-Ghazali]] sobre Damasco {cite:dawlat-uthmaniyya-salabi p. 188}; en Shadharat, Tuman Bay fue ahorcado en Bab Zuwayla y el estado circasiano llegó a su fin {cite:shadharat-dhahab p. 531}."
  ur: "سیلم کے بعد میں مصر میں داخل ہوا۔ الصلبی نے تاریخ ساز صلاحسور - سیلم کے ساتھی اور مخطوطہ *فتح نام دیار العرب* کے مصنف کا حوالہ دیا ہے کہ سیلم چٹان کے گنبد میں لمبا رویا اور مصر کے افتتاح کے لیے دعا کی۔ 188}۔ اس نے [[شخص/خیر بک|خیرباک]] کو مصر پر اور [[شخص/جنبردی الغزالی|جنبردی الغزالی]] کو دمشق پر مقرر کیا۔ 188}; شدھارت کے مقام پر تومان بے کو باب زوائلہ میں پھانسی دی گئی اور سرکیسیئن ریاست کا خاتمہ ہوا۔ 531}۔"
