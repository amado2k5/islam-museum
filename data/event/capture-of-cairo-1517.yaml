summary:
  ar: "بعد [[event/battle-ridaniyya-923|الريدانية]] دخل [[person/selim-i-ottoman|سليم الأول]] مصر؛ وينقل الصلابي عن المؤرخ سلاحثور صاحب مخطوطة «فتح نامه ديار العرب» — وكان مصاحباً لسليم — أن سليم كان يبكي في مسجد الصخرة بالقدس بكاءً حاراً وصلى صلاة الحاجة داعياً أن يفتح عليه مصر {cite:dawlat-uthmaniyya-salabi p. 188}. ويذكر أن سليم ولّى [[person/khayr-bak|خاير بك]] على مصر و[[person/janbardi-al-ghazali|جانبردي الغزالي]] على دمشق {cite:dawlat-uthmaniyya-salabi p. 188}، وعند ابن العماد صُلب طومان باي بباب زويلة فانقضت دولة الجراكسة {cite:shadharat-dhahab p. 531}."
  en: "After [[event/battle-ridaniyya-923|Ridaniyya]] Selim I entered Egypt; al-Salabi quotes the chronicler Salahsur — companion of Selim and author of the manuscript *Fath-nameh Diyar al-Arab* — that Selim wept long in the Dome of the Rock and prayed for Egypt's opening {cite:dawlat-uthmaniyya-salabi p. 188}. He appointed [[person/khayr-bak|Khayr Bak]] over Egypt and [[person/janbardi-al-ghazali|Janbirdi al-Ghazali]] over Damascus {cite:dawlat-uthmaniyya-salabi p. 188}; at Shadharat, Tuman Bay was hanged at Bab Zuwayla and the Circassian state ended {cite:shadharat-dhahab p. 531}."
