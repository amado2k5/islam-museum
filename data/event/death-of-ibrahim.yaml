summary:
  ar: "توفي إبراهيم بن النبي من مارية القبطية بالمدينة في 28 أو 29 شوال سنة 10هـ وهو صغير، فدمعت عينا النبي وقال: العين تدمع والقلب يحزن ولا نقول إلا ما يرضي ربنا."
  en: "Ibrahim, the Prophet's son by Maria the Copt, died an infant in Medina on 28 or 29 Shawwal 10 AH (January 632 CE); the Prophet wept and said: the eye weeps and the heart grieves, and we say only what pleases our Lord."
  es: "Ibrahim, hijo del Profeta y María la Copta, murió siendo un bebé en Medina el 28 o 29 de Shawwal del año 10 de la Hégira (enero de 632 d. C.); el Profeta lloró y dijo: el ojo llora y el corazón se aflige, y solo decimos lo que agrada a nuestro Señor."
  fr: "Ibrahim, le fils du Prophète et de Maria la Copte, mourut en bas âge à Médine le 28 ou le 29 Shawwal 10 AH (janvier 632 CE); le Prophète pleura et dit: les yeux pleurent et le cœur s'afflige, et nous ne disons que ce qui plaît à notre Seigneur."
  ur: "ماریہ قبطی کے ذریعہ پیغمبر کے بیٹے ابراہیم کی وفات 28 یا 29 شوال 10 ہجری ⁦(جنوری 632 عیسوی)⁩ کو مدینہ میں ہوئی تھی۔ رسول اللہ نے روتے ہوئے فرمایا: آنکھ روتی ہے اور دل غمگین ہوتا ہے اور ہم وہی کہتے ہیں جو ہمارے رب کو پسند ہو۔"
