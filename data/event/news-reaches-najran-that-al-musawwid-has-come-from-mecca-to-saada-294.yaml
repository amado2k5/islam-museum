id: event/news-reaches-najran-that-al-musawwid-has-come-from-mecca-to-saada-294
class: event
kind: other
label:
  ar: "خبر وصول المسود من مكة إلى صعدة، ذو الحجة سنة 294هـ، ص347"
  en: "News reaches Najran that al-Musawwid has come from Mecca to Sa'da, Dhu al-Hijja 294 AH, p. 347"
  ur: "مکہ سے صعدہ تک المسود کے پہنچنے کی خبر، ذوالحجہ 294ھ، ص347"
  es: "Llegan noticias a Najrán de que al-Musawwid ha llegado de La Meca a Sa'da, Dhu al-Hijja 294 AH, pág. 347."
  fr: "La nouvelle parvient à Najran qu'al-Musawwid est venu de La Mecque à Sa'da, Dhu al-Hijja 294 AH, p. 347"
summary:
  ar: "قدم الحجاج من مكة في ذي الحجة بخبر نجاح، الذي يسميه الكتاب المسود، وأنه واصل من مكة إلى صعدة، فتعلّق أهل الحدث بقدومه."
  en: "In Dhu al-Hijja pilgrims from Mecca brought word of Najah, whom the book calls al-Musawwid, and reported that he had reached Sa'da from Mecca. The troublemakers pinned their hopes on his coming."
  ur: "ذوالحجہ میں مکہ سے آنے والے حجاج نے نجاح کی خبر دی، جسے کتاب المسود کہتا ہے، کہ وہ مکہ سے صعدہ پہنچ گیا ہے۔ فتنہ انگیزوں نے اس کی آمد پر امیدیں باندھ لیں۔"
  es: "En Dhu al-Hijja, peregrinos procedentes de La Meca trajeron noticias de Najah, a quien el libro llama al-Musawwid, e informaron que había llegado a Sa'da desde La Meca. Los agitadores depositaron sus esperanzas en su llegada."
  fr: "Au mois de Dhu al-Hijja, des pèlerins venus de La Mecque apportèrent la nouvelle de Najah, que le livre nomme al-Musawwid, et rapportèrent qu'il avait rejoint Sa'da depuis La Mecque. Les fauteurs de troubles fondèrent leurs espoirs sur sa venue."
