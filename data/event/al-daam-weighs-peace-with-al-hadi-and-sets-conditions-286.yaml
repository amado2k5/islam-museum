id: event/al-daam-weighs-peace-with-al-hadi-and-sets-conditions-286
class: event
kind: other
label:
  ar: الدعام يستشير أهل خيوان بعد وصول أخي أبي العتاهية ويشترط شروطاً على الهادي، المحرم 286هـ
  en: Al-Da'am consults the people of Khiwan after the arrival of Abu al-Atahiya's brother and sets conditions to al-Hadi, Muharram 286 AH
  fr: "Al-Da'am consulte les habitants de Khiwan après l’arrivée du frère d’Abu al-Atahiya et pose ses conditions à al-Hadi, muharram 286 de l’hégire"
  ur: ابو العتاہیہ کے بھائی کی آمد کے بعد دعام کا اہل خیوان سے مشورہ اور ہادی کے سامنے شرائط، محرم 286ھ
  es: "Al-Da'am consulta a la gente de Khiwan tras la llegada del hermano de Abu al-Atahiya y establece condiciones para al-Hadi, Muharram 286 AH."
  tr: "Ebu el-Atahiye'nin kardeşinin gelişinden sonra El-Da'am, Hayvan halkıyla istişarede bulunur ve Hicri 286 Muharrem ayında el-Hadi için şartlar koyar."
  id: "Al-Da’am bermusyawarah dengan penduduk Khaywan setelah kedatangan saudara laki-laki Abu al-Atahiyah dan menetapkan syarat-syarat untuk al-Hadi, Muharram 286 H."
summary:
  ar: بلغ الدعام أن أخا أبي العتاهية قدم إلى الهادي ومعه خمسون فارساً فغلظ عليه ذلك، وذُكر عنه أنه جمع أصحابه وأهل خيوان وقال لهم إن من العجب أنه أصبح مسوداً وأصبح أبو العتاهية مبيضاً، وإنه عزم على ألا يقاتل ابن رسول الله، فأشار عليه بعضهم بالقتال لئلا يدفع ملكاً قاتل عليه آل يعفر إلى العلوي مسلماً. وتروي الصفحة أن كتب الدعام كانت تأتي الهادي تشترط جباية بعض البلد وولاية على بعضه، فأجاب بأنه لو سرّه أن يوليه شبراً ما وفّى ولا جاز له إلا أن يتوب ويرجع إلى الحق.
  en: It reached al-Da'am that Abu al-Atahiya's brother had come to al-Hadi with fifty horsemen, which weighed on him; it is said he gathered his companions and the people of Khiwan and told them it was strange that he had come to wear black while Abu al-Atahiya came to wear white, and that he had resolved not to fight the son of the Messenger of God; one of his men urged him to fight rather than hand over to the Alid, peacefully, a rule he had fought for against Al Ya'fur. The page also says that al-Da'am's letters kept coming to al-Hadi asking for the tax collection of part of the land and the governorship of part, and al-Hadi answered that he would not appoint him over even a span of land unless he repented and returned to the truth.
  fr: "Al-Da'am apprit que le frère d’Abu al-Atahiya était venu auprès d’al-Hadi avec cinquante cavaliers, ce qui lui pesa. Il aurait réuni ses compagnons et les habitants de Khiwan, s’étonnant d’en être venu à porter le noir tandis qu’Abu al-Atahiya portait le blanc et disant avoir résolu de ne pas combattre le fils du Messager de Dieu. Un de ses hommes l’exhorta à combattre plutôt qu’à livrer pacifiquement à l’Alide un pouvoir conquis contre les Al Ya'fur. La page dit aussi qu’il écrivait sans cesse à al-Hadi pour demander la perception des impôts d’une partie du pays et le gouvernement d’une autre ; al-Hadi répondait qu’il ne le nommerait pas même sur un empan de terre sans repentir et retour à la vérité."
  ur: دعام کو خبر پہنچی کہ ابو العتاہیہ کا بھائی پچاس سواروں کے ساتھ ہادی کے پاس آیا ہے تو اسے ناگوار گزرا؛ کہا جاتا ہے کہ اس نے اپنے ساتھیوں اور اہل خیوان کو جمع کر کے کہا کہ عجیب بات ہے کہ میں سیاہ پوش ہو گیا اور ابو العتاہیہ سفید پوش، اور میں نے طے کر لیا ہے کہ رسول اللہ کے بیٹے سے نہیں لڑوں گا؛ ان میں سے ایک نے اسے لڑنے کا مشورہ دیا کہ وہ اس سلطنت کو جس کے لیے وہ آل یعفر سے لڑا علوی کو امن سے نہ سونپے۔ صفحہ یہ بھی بتاتا ہے کہ دعام کے خطوط ہادی کو پہنچتے رہے جن میں علاقے کے بعض حصے کی وصولی اور بعض کی ولایت کی شرط ہوتی تھی، اور ہادی نے جواب دیا کہ وہ اسے ایک بالشت زمین کا بھی والی نہ بنائیں گے الا یہ کہ توبہ کر کے حق کی طرف لوٹے۔
  es: "Llegó a oídos de al-Da'am la noticia de que el hermano de Abu al-Atahiya había llegado a al-Hadi con cincuenta jinetes, lo cual le inquietó. Se dice que reunió a sus compañeros y a la gente de Khiwan y les comentó que le resultaba extraño que él hubiera venido vestido de negro mientras que Abu al-Atahiya había venido vestido de blanco, y que había decidido no luchar contra el hijo del Mensajero de Dios. Uno de sus hombres le instó a luchar en lugar de entregar pacíficamente a los Alid un gobierno por el que había luchado contra Al Ya'fur. El texto también menciona que al-Da'am seguía enviando cartas a al-Hadi solicitando la recaudación de impuestos de parte del territorio y el gobierno de otra parte, a lo que al-Hadi respondió que no le nombraría ni siquiera un palmo de tierra a menos que se arrepintiera y volviera a la verdad."
  tr: "El-Da'am, Ebu el-Atahiye'nin kardeşinin elli süvariyle el-Hadi'ye geldiğini öğrendi ve bu durum onu çok kızdırdı. Rivayetlere göre, arkadaşlarını ve Hayvan halkını topladı ve Ebu el-Atahiye beyaz (yani yüksek mevkili) biri olurken kendisinin siyahi bir adam haline gelmesinin şaşırtıcı olduğunu söyledi. Allah Resulü'nün oğluyla savaşmamaya karar verdiğini açıkladı. Bazıları ona savaşmasını tavsiye etti, aksi takdirde Yafurilerle savaştığı bir krallığı Müslüman olarak Alevilere teslim etmiş olacaktı. Sayfada, el-Da'am'dan el-Hadi'ye şehrin bazı bölgelerinin vergi gelirlerinin ve diğer bölgelerinin valiliğinin kendisine verilmesini şart koşan mektuplar geldiği anlatılır. El-Hadi, ona sadece bir karış toprak bile vermekten memnun olsa bile, isteğini yerine getirmeyeceğini ve tövbe edip hakikate dönmedikçe bunun ona izin verilmeyeceğini söyledi."
  id: "Al-Da’am mengetahui bahwa saudara Abu al-‘Atahiyah telah datang kepada al-Hadi dengan lima puluh penunggang kuda, dan hal ini sangat membuatnya tidak senang. Diriwayatkan bahwa ia mengumpulkan para sahabatnya dan penduduk Khaywan dan memberi tahu mereka bahwa sungguh mengejutkan bahwa ia telah menjadi orang berkulit hitam sementara Abu al-‘Atahiyah telah menjadi orang berkulit putih (yaitu, orang yang berkedudukan tinggi). Ia menyatakan bahwa ia telah memutuskan untuk tidak memerangi putra Rasulullah. Beberapa dari mereka menasihatinya untuk berperang, agar ia tidak menyerahkan kerajaan yang telah ia perjuangkan melawan Ya'furid kepada kaum Alawi sebagai seorang Muslim. Halaman tersebut menceritakan bahwa surat-surat dari al-Da’am akan sampai kepada al-Hadi yang menetapkan bahwa ia akan diberikan pendapatan pajak dari beberapa bagian kota dan jabatan gubernur atas bagian lainnya. Al-Hadi menjawab bahwa meskipun ia berkenan untuk memberinya sebidang tanah saja, ia tidak akan memenuhi permintaannya, dan bahwa hal itu tidak diperbolehkan baginya kecuali ia bertobat dan kembali kepada kebenaran."
