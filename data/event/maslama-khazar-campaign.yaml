label: { ar: "غزوة مسلمة بن عبد الملك للخزر وفتح الباب", en: "Maslama ibn Abd al-Malik's Khazar Campaign and the Taking of al-Bab", es: "La campaña jázara de Maslama ibn Abd al-Malik y la toma de al-Bab", fr: "La campagne khazare de Maslama ibn Abd al-Malik et la prise d'al-Bab", ur: "مسلمہ بن عبد الملک کی خزر کی مہم اور الباب کا قبضہ" }
summary:
  ar: "عند البلاذري: ولّى هشام بن عبد الملك مسلمة بن عبد الملك أرمينية ووجّه على مقدمته سعيد بن عمرو بن أسود الحرشي ومعه إسحاق بن مسلم العقيلي وإخوته وجمونة بن الحارث بن خالد أحد بني عامر بن ربيعة بن صعصعة وذفافة وخالد ابنا عمير بن الحباب السلمي والفرات بن سلمان الباهلي والوليد بن القعقاع العبسي فواقع الخزر وقد حاصروا ورتان فكشفهم عنها وهزمهم فأتوا ميمذ من عمل أذربيجان فلما تهيأ لقتالهم أتاه كتاب مسلمة يلومه على قتاله الخزر قبل قدومه ويعلمه أن قد ولّى أمر عسكره عبد الملك بن مسلم العقيلي فلما سلّم العسكر أخذه رسول مسلمة فقيّده وحمله إلى برذعة فحُبس في سجنها وانصرف الخزر فاتبعهم مسلمة وكتب بذلك إلى هشام فكتب إليه «أتركهم يمذ قد تراهم واطلبهم ينقطع التراب» وأمر بإخراج الحرشي من السجن؛ وصالح مسلمة أهل خيزان وأمر بحصنها فهُدم واتخذ لنفسه به ضياعاً وهي اليوم تعرف بحوز خيزان وسالمه ملوك الجبال فصار إليه شروانشاه وليرانشاه وطبرسرانشاه وفيلانشاه وجرشانشاه وصار إليه صاحب مسمط، وصمد لمدينة الباب ففتحها وكان في قلعتها ألف أهل بيت من الخزر فحاصرهم ورماهم بالحجارة ثم تحصّن اتخذه على هيئة الحجارة فلم ينتفع بذلك فعمد إلى العين التي كان أنوشروان أجرى منها الماء إلى صهريجهم فذبح البقر والغنم وألقى فيه الفرث والجلالة فلم يمكث ماؤهم الليلة حتى دوّد وانتن وفسد فلما جنّ عليهم الليل هربوا وأخلوا القلعة، وأسكن مسلمة مدينة الباب والأبواب أربعة وعشرين ألفاً من أهل الشام على المطاء — فأهل الباب اليوم لا يدعون عاملاً يدخل مدينتهم إلا ومعه مال يفرّقه بينهم — وبنى هرياً للطعام وهرياً للشعير وخزانة للسلاح وأمر بكبس الصهريج ورمّ المدينة وشرّفها، وكان مروان بن محمد مع مسلمة فواقع معه الخزر فأبلى وقاتل قتالاً شديداً."
  en: "In al-Baladhuri: Hisham ibn Abd al-Malik gave Armenia to Maslama ibn Abd al-Malik and sent ahead as his vanguard Sa'id ibn Amr ibn Aswad al-Harashi — with him Ishaq ibn Muslim al-Uqayli and his brothers, Jamwana ibn al-Harith ibn Khalid of Banu Amir ibn Rabi'a ibn Sa'sa'a, Dhufafa and Khalid the sons of Umayr ibn al-Habab al-Sulami, al-Furat ibn Salman al-Bahili and al-Walid ibn al-Qa'qa' al-Absi — who met the Khazars besieging Wartan, drove them off and routed them, coming to Maymadh of Adharbayjan; as he readied for battle, Maslama's letter reached him blaming him for fighting before his arrival and telling him Abd al-Malik ibn Muslim al-Uqayli had been given his army's command — when he handed the army over, Maslama's messenger seized him, bound him, carried him to Bardha'a and jailed him; the Khazars withdrew, Maslama pursued, and wrote of it to Hisham, who wrote back the verse 'leave them to waste — you see them — and chase them till the dust is cut off', ordering al-Harashi released from prison; Maslama compounded with the people of Khayzan, ordered its fortress demolished and took estates there known today as Hawz Khayzan; the mountain kings made peace with him, and to him came the Shirwanshah, the Liranshah, the Tabarsaranshah, the Filanshah, the Jarshanshah and the lord of Masmumat; he advanced on Madinat al-Bab and took it — in its citadel were a thousand Khazar households whom he besieged and stoned, then had a mantlet built in stone-shape which availed nothing, whereupon he went to the spring Anushirwan had led into their cistern, slaughtered cattle and sheep and threw in the offal and dung, so that by nightfall their water wormed, stank and fouled — and when night covered them they fled, abandoning the citadel; Maslama settled in the city of Bab wa-l-Abwab twenty-four thousand Syrians on mount-allowances — whence Bab's folk today admit no governor unless he brings money to share among them — built a granary for food, one for barley and an arms-storehouse, ordered the cistern sealed, and repaired and honoured the city; Marwan ibn Muhammad was with Maslama, engaging the Khazars at his side and fighting bitterly."
  es: "En al-Baladhuri: Hisham ibn Abd al-Malik entregó Armenia a Maslama ibn Abd al-Malik y envió como vanguardia a Sa'id ibn Amr ibn Aswad al-Harashi, con él a Ishaq ibn Muslim al-Uqayli y sus hermanos, Jamwana ibn al-Harith ibn Khalid de Banu Amir ibn Rabi'a ibn Sa'sa'a, Dhufafa y Khalid, hijos de Umayr ibn al-Habab al-Sulami, al-Furat ibn Salman al-Bahili y al-Walid ibn al-Qa'qa' al-Absi, quienes se enfrentaron a los jázaros que asediaban Wartan, los expulsaron y los derrotaron, llegando a Maymadh de Adharbayjan; Mientras se preparaba para la batalla, le llegó una carta de Maslama en la que lo culpaba por haber luchado antes de su llegada y le decía que Abd al-Malik ibn Muslim al-Uqayli había recibido el mando de su ejército. Cuando entregó el ejército, el mensajero de Maslama lo apresó, lo ató, lo llevó a Bardha'a y lo encarceló. Los jázaros se retiraron, Maslama los persiguió y le escribió a Hisham, quien le respondió con el versículo \"déjalos a su suerte, ya los ves, y persíguelos hasta que se levante el polvo\", ordenando la liberación de al-Harashi de la prisión. Maslama llegó a un acuerdo con la gente de Khayzan, ordenó la demolición de su fortaleza y tomó propiedades allí conocidas hoy como Hawz Khayzan. Los reyes de las montañas hicieron la paz con él, y a él acudieron el Shirwanshah, el Liranshah, el Tabarsaranshah, el Filanshah, el Jarshanshah y el señor de Masmumat. Avanzó sobre Madinat al-Bab y la tomó; en su ciudadela había mil familias jázaras a las que sitió y apedreó, luego mandó construir un parapeto de piedra que no sirvió de nada, tras lo cual fue al manantial que Anushirwan había conducido a su cisterna, sacrificó ganado vacuno y ovino y arrojó las vísceras y el estiércol, de modo que al anochecer su agua estaba llena de gusanos, apestaba y se ensuciaba; y cuando la noche los envolvió, huyeron, abandonando la ciudadela; Maslama estableció en la ciudad de Bab wa-l-Abwab a veinticuatro mil sirios con subsidios de montaña; de ahí que la gente de Bab hoy no admita a ningún gobernador a menos que traiga dinero para repartir entre ellos; construyó un granero para alimentos, uno para cebada y un almacén de armas, ordenó sellar la cisterna y reparó y honró la ciudad; Marwan ibn Muhammad estaba con Maslama, enfrentándose a los jázaros a su lado y luchando encarnizadamente."
  fr: "À al-Baladhuri: Hisham ibn Abd al-Malik a donné l'Arménie à Maslama ibn Abd al-Malik et a envoyé comme avant-garde Sa'id ibn Amr ibn Aswad al-Harashi — avec lui Ishaq ibn Muslim al-Uqayli et ses frères, Jamwana ibn al-Harith ibn Khalid de Banu Amir ibn Rabi'a ibn Sa'sa'a, Dhufafa et Khalid les fils. d'Umayr ibn al-Habab al-Sulami, al-Furat ibn Salman al-Bahili et al-Walid ibn al-Qa'qa' al-Absi - qui rencontrèrent les Khazars assiégeant Wartan, les chassa et les mirent en déroute, venant à Maymadh d'Adharbayjan; Alors qu'il se préparait au combat, la lettre de Maslama lui parvint, le blâmant d'avoir combattu avant son arrivée et lui annonçant qu'Abd al-Malik ibn Muslim al-Uqayli avait reçu le commandement de son armée. Lorsqu'il remit l'armée, le messager de Maslama s'empara de lui, l'attacha, le conduisit à Bardha'a et l'emprisonna. Les Khazars se retirèrent, Maslama les poursuivit et en écrivit à Hisham, qui lui répondit par le verset « Laisse-les dépérir – tu les vois – et poursuis-les jusqu'à ce que la poussière soit coupée », ordonnant la libération d'al-Harashi. Maslama conclut un pacte avec les habitants de Khayzan, ordonna la démolition de sa forteresse et s'empara des terres qui s'y trouvaient et qui sont aujourd'hui connues sous le nom de Hawz Khayzan. Les rois des montagnes firent la paix avec lui, et vinrent à lui le Shirwanshah, le Liranshah, le Tabarsaranshah, le Filanshah, le Jarshanshah et le seigneur de Masmumat. Il marcha sur Madinat al-Bab et s'en empara. Dans sa citadelle se trouvaient mille foyers khazars qu'il assiégea et lapida. Il fit ensuite construire un rempart de pierre qui ne servit à rien. Puis, il se rendit à la source qu'Anushirwan avait fait alimenter leur citerne, y abattit du bétail et des moutons et y jeta les abats et le fumier, de sorte qu'à la tombée de la nuit, l'eau était vermoulue, puante et souillée. Lorsque la nuit les enveloppa, ils s'enfuirent, abandonnant la citadelle. Maslama installa dans la ville de Bab wa-l-Abwab vingt-quatre mille Syriens recevant des allocations de montagne. C'est pourquoi, aujourd'hui encore, les habitants de Bab n'admettent aucun gouverneur à moins qu'il n'apporte de l'argent à partager entre eux. Il fit construire un grenier à vivres, un autre à orge et un dépôt d'armes, ordonna de sceller la citerne, et répara et honora la ville. Marwan ibn Muhammad était avec Maslama, combattant les Khazars à ses côtés avec acharnement."
  ur: "البلادوری میں ہے: ہشام بن عبد الملک نے آرمینیا کو مسلمہ بن عبد الملک کو دیا اور اس کے نگہبان سعید بن عمرو بن اسود الحارشی کو آگے بھیجا - اس کے ساتھ اسحاق بن مسلم العقیلی اور اس کے بھائی جموانہ بن الحارث بن عن بن رعنبی۔ عمیر بن الحباب السلمی، الفرات بن سلمان الباہلی اور ولید بن قعقاع العبسی کے بیٹے صعصع، ضوفاء اور خالد - جنہوں نے وارتن کا محاصرہ کرنے والے خزروں سے ملاقات کی، انہیں وہاں سے بھگا دیا اور اضحار کی طرف روانہ ہو گئے۔ جب وہ جنگ کے لیے تیار ہو رہا تھا تو مسلمہ کا خط اس کے پاس پہنچا جس میں اس کے پہنچنے سے پہلے اس پر لڑائی کا الزام لگایا گیا تھا اور اسے بتایا گیا تھا کہ عبد الملک بن مسلم عقیلی کو اس کی فوج کی کمان سونپی گئی تھی - جب اس نے فوج کو سپرد کیا تو مسلمہ کے قاصد نے اسے پکڑ لیا، اسے باندھ دیا، اسے بردعہ لے گئے اور اسے جیل میں ڈال دیا۔ خزر واپس چلے گئے، مسلمہ نے تعاقب کیا، اور اس کے بارے میں ہشام کو لکھا، جس نے یہ آیت لکھی کہ 'انہیں ضائع ہونے دو - تم انہیں دیکھو - اور ان کا پیچھا کرو یہاں تک کہ خاک کٹ جائے'، الحرشی کو جیل سے رہا کرنے کا حکم دیا۔ مسلمہ نے خزان کے لوگوں کے ساتھ مل کر اس کے قلعے کو گرانے کا حکم دیا اور وہاں کی جاگیریں لے لیں جو آج حوز خیزان کے نام سے مشہور ہے۔ پہاڑی بادشاہوں نے اس کے ساتھ صلح کی، اور اس کے پاس شیروان شاہ، لیرانشاہ، تبرسرانشاہ، فلانشاہ، جارشنشاہ اور مسمومت کا مالک آیا۔ اس نے مدینۃ الباب پر پیش قدمی کی اور اسے لے لیا - اس کے قلعے میں ایک ہزار خزر گھرانے تھے جن کا اس نے محاصرہ کیا اور سنگسار کیا، پھر پتھر کی شکل میں ایک چادر بنی ہوئی تھی جس کا کوئی فائدہ نہیں ہوا، اس کے بعد وہ حوض کی طرف گیا، انوشروان نے ان کے حوض میں لے جایا، مویشیوں اور بھیڑوں کو ذبح کیا، اور اس رات ان کے پانی سے پانی نکالا۔ کیڑے سے بھرے، بدبودار اور گندے ہوئے — اور جب رات ان پر چھا گئی تو وہ قلعہ کو چھوڑ کر بھاگ گئے۔ مسلمہ نے باب و الابواب کے شہر میں چوبیس ہزار شامی باشندوں کو ماؤنٹ الاؤنسز پر آباد کیا - جہاں سے آج باب کے لوگ کسی گورنر کو تسلیم نہیں کرتے جب تک کہ وہ ان کے درمیان حصہ لینے کے لئے رقم نہ لائے - کھانے کے لئے ایک اناج بنایا، ایک جو کے لئے اور ایک ہتھیاروں کا ذخیرہ بنایا، حکم دیا، حوض کی مرمت اور شہر کی عزت افزائی کی؛ مروان بن محمد مسلمہ کے ساتھ تھا، خزروں کو اپنے ساتھ ملا رہا تھا اور تلخ جنگ کر رہا تھا۔"
