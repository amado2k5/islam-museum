label: { ar: "قدوم وفد بني تميم ومفاخرتهم النبي", en: "The delegation of Banu Tamim and the boasting contest" }
summary:
  ar: "قدم عطارد بن حاجب في أشراف بني تميم على النبي سنة 9هـ، ومعهم الأقرع بن حابس والزبرقان بن بدر وعمرو بن الأهتم والحتات بن يزيد وقيس بن عاصم وغيرهم، وعيينة بن حصن معهم؛ نادوه من وراء حجراته، ثم فاخروه بخطيبهم وشاعرهم، فأجاب ثابت بن قيس عطارداً وأجاب حسان الزبرقان، فحكم الأقرع أن خطيب المسلمين أخطب وشاعرهم أشعر، فأسلموا وأجازهم النبي؛ ونزل فيهم أول سورة الحجرات."
  en: "Utarid ibn Hajib led the notables of Banu Tamim to the Prophet in 9 AH, with al-Aqra' ibn Habis, al-Zibriqan ibn Badr, Amr ibn al-Ahtam, al-Hutat ibn Yazid, Qays ibn Asim and others, and Uyayna ibn Hisn with them. They called him from behind his apartments, then challenged him to a boasting contest; Thabit ibn Qays answered Utarid and Hassan answered al-Zibriqan, al-Aqra' conceded that the Muslims' orator and poet were better, and they embraced Islam and were given gifts. The opening of sura al-Hujurat was revealed about them."
