id: event/delegation-of-banu-tamim
class: event
kind: gathering
label: { ar: "قدوم وفد بني تميم ومفاخرتهم النبي", en: "The delegation of Banu Tamim and the boasting contest", es: "La delegación de Banu Tamim y el concurso de alardes", fr: "La délégation de Banu Tamim et le concours de vantardise", ur: "بنو تمیم کا وفد اور شیخی کا مقابلہ" }
summary:
  ar: "قدم عطارد بن حاجب في أشراف بني تميم على النبي سنة 9هـ، ومعهم الأقرع بن حابس والزبرقان بن بدر وعمرو بن الأهتم والحتات بن يزيد وقيس بن عاصم وغيرهم، وعيينة بن حصن معهم؛ نادوه من وراء حجراته، ثم فاخروه بخطيبهم وشاعرهم، فأجاب ثابت بن قيس عطارداً وأجاب حسان الزبرقان، فحكم الأقرع أن خطيب المسلمين أخطب وشاعرهم أشعر، فأسلموا وأجازهم النبي؛ ونزل فيهم أول سورة الحجرات."
  en: "Utarid ibn Hajib led the notables of Banu Tamim to the Prophet in 9 AH, with al-Aqra' ibn Habis, al-Zibriqan ibn Badr, Amr ibn al-Ahtam, al-Hutat ibn Yazid, Qays ibn Asim and others, and Uyayna ibn Hisn with them. They called him from behind his apartments, then challenged him to a boasting contest; Thabit ibn Qays answered Utarid and Hassan answered al-Zibriqan, al-Aqra' conceded that the Muslims' orator and poet were better, and they embraced Islam and were given gifts. The opening of sura al-Hujurat was revealed about them."
  es: "En el año 9 de la Hégira, Utarid ibn Hajib condujo a los notables de Banu Tamim ante el Profeta, junto con al-Aqra' ibn Habis, al-Zibriqan ibn Badr, Amr ibn al-Ahtam, al-Hutat ibn Yazid, Qays ibn Asim y otros, y Uyayna ibn Hisn. Lo llamaron desde detrás de sus aposentos y lo desafiaron a un concurso de elocuencia. Thabit ibn Qays respondió a Utarid y Hassan a al-Zibriqan. Al-Aqra' reconoció que el orador y poeta de los musulmanes eran superiores, y ambos abrazaron el Islam y recibieron regalos. El comienzo de la sura al-Hujurat fue revelado acerca de ellos."
  fr: "En l'an 9 de l'Hégire, Utarid ibn Hajib conduisit les notables de la tribu de Banu Tamim auprès du Prophète, accompagnés d'al-Aqra' ibn Habis, d'al-Zibriqan ibn Badr, d'Amr ibn al-Ahtam, d'al-Hutat ibn Yazid, de Qays ibn Asim et d'autres, ainsi que d'Uyayna ibn Hisn. Ils l'appelèrent par derrière ses appartements et le défièrent à un concours d'éloquence. Thabit ibn Qays répondit à Utarid, Hassan à al-Zibriqan, et al-Aqra' reconnut la supériorité de l'orateur et poète musulman. Ils se convertirent alors à l'islam et reçurent des présents. Le début de la sourate Al-Hujurat fut révélé à leur sujet."
  ur: "عطرد بن حاجب نے 9 ہجری میں بنو تمیم کے معززین کو اقرع بن حابس، الزبرقان ابن بدر، عمرو بن الاحتم، الحوت ابن یزید، قیس بن عاصم اور دیگر اور عیین بن ان کے ساتھ رسول اللہ کے پاس لے کر گئے۔ اُنہوں نے اُسے اپنے اپارٹمنٹ کے پیچھے سے بلایا، پھر اُسے فخریہ مقابلے کے لیے للکارا۔ ثابت بن قیس نے عطرید کا جواب دیا اور حسن نے الزبرقان کا جواب دیا، الاقراء نے اقرار کیا کہ مسلمانوں کے خطیب اور شاعر بہتر ہیں، اور انہوں نے اسلام قبول کیا اور انہیں تحفہ دیا گیا۔ ان کے بارے میں سورۃ الحجرات کی ابتداء نازل ہوئی۔"
