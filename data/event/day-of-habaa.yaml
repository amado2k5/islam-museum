label: { ar: "يوم الهباءة", en: "The Day of al-Haba'a", es: "El Día de al-Haba'a", fr: "Le jour d'al-Haba'a", ur: "یوم الحباء", tr: "Toz Günü", id: "Hari Berdebu" }
summary:
  ar: "يوم من أيام العرب؛ فيه قتلت بنو عبس بن بغيض حذيفة بن بدر الفزاري سيد غطفان ودست لسانه في استه، وكان بنو ذبيان وبنو عبس حلفاء، فكان قتله من سبب حرب داحس والغبراء الطويلة بين فزارة وعبد الله بن غطفان من جهة وبين عبس وذبيان من جهة {cite:ansab-al-ashraf p. 15-16}."
  en: "The day of al-Haba'a, when Banu Abs killed Hudhayfa ibn Badr the chief of Fazara — the outrage that broke the Abs–Dhubyan alliance and opened the forty-year war of Dahis and al-Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  es: "El día de al-Haba'a, cuando Banu Abs mató a Hudhayfa ibn Badr, jefe de Fazara, la atrocidad que rompió la alianza Abs-Dhubyan y abrió la guerra de cuarenta años de Dahis y al-Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  fr: "Le jour d'al-Haba'a, où les Banu Abs tuèrent Hudhayfa ibn Badr, le chef de Fazara — l'outrage qui brisa l'alliance Abs-Dhubyan et ouvrit la guerre de quarante ans des Dahis et d'al-Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  ur: "ہبہ کا دن، جب بنو ابس نے فزارہ کے سردار حذیفہ بن بدر کو قتل کر دیا - اس غم و غصے سے جس نے ابس ذبیان اتحاد کو توڑ دیا اور دحیس اور الغبرا کی چالیس سالہ جنگ کا آغاز کر دیا۔ 15-16}۔"
  tr: "Arapların günlerinden birinde, Beni Abs ibn Bağhid, Gatafan'ın reisi Hudeyfe ibn Bedir el-Fazari'yi öldürdü ve dilini anüsüne soktu. Beni Dhubyan ve Beni Abs müttefikti ve onun öldürülmesi, bir tarafta Fazarah ve Abdullah ibn Gatafan, diğer tarafta Abs ve Dhubyan arasında uzun süren Dahis ve Gabra savaşının sebeplerinden biriydi. {Kaynak: ansab-al-ashraf s. 15-16}"
  id: "Suatu hari di zaman Arab; pada hari itu Bani Abs bin Baghid membunuh Hudhayfah bin Badr al-Fazari, kepala suku Ghatafan, dan memasukkan lidahnya ke dalam anusnya. Bani Dhubyan dan Bani Abs adalah sekutu, dan pembunuhannya merupakan salah satu penyebab perang panjang Dahis dan Ghabra antara Fazarah dan Abdullah bin Ghatafan di satu pihak dan Abs dan Dhubyan di pihak lain {cite:ansab-al-ashraf hlm. 15-16}."
