label:
  ar: "رحلة الشيرازي إلى خراسان ومناظراته بالجويني، نحو ٤٧٥هـ"
  en: "Al-Shirazi's journey to Khurasan and his disputations with al-Juwayni, c. 475/1082"
  ur: "شیرازی کا خراسان سفر اور جوینی سے مناظرے، تقریباً 475ھ/1082ء"
summary:
  ar: "في أواخر أيامه — هو المعروف بقلة الترحال حتى إن التراجم تذكر أن ماله لم يكن يبلغ نفقة الحج — رحل الشيرازي إلى خراسان رحلة ناجحة يفاوض سلطات السلاجقة عن الخليفة، فقيس فيها مكانته عند العامة وفي حلقات الصوفية ونفوذه في نخبة العلماء؛ وبنيسابور لاقى زميله أبا المعالي الجويني — الفقيه الشافعي الكبير الآخر ومدرّس مدرسة أخرى بناها له نظام الملك — فعقد معه مجالس مناظرة نقل السبكي نصها {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  en: "Towards the end of his life — he was of notably sedentary habits, the biographers remarking that he lacked the means even to make the Pilgrimage — al-Shirazi undertook a highly successful journey to Khurasan, negotiating on the caliph's behalf with the Saljuq authorities; it let him measure his popularity among common folk and Sufi circles and his influence with the intellectual elite. At Nishapur he met his colleague Abu al-Ma'ali al-Juwayni (d. 478/1085), the other great Shafi'i jurist of the age and likewise head of a madrasa built for him by Nizam al-Mulk, and held several sessions of judicial controversy with him, whose text al-Subki preserves {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  ur: "عمر کے آخری حصے میں — وہ سفر سے دور رہنے والے تھے یہاں تک کہ تراجم کے مطابق ان کے پاس حج کے خرچے کی سامرتھ بھی نہ تھی — شیرازی نے خراسان کا کامیاب سفر کیا اور خلیفہ کی جانب سے سلجوق حکام سے مذاکرات کیے؛ اس سے عام لوگوں اور صوفیانہ حلقوں میں ان کی مقبولیت اور علمی نخبہ میں ان کے اثر کا اندازہ ہوا۔ نیشاپور میں وہ اپنے ہم عصر دوسرے ممتاز شافعی فقیہ ابو المعالی جوینی ⁦(ت 478ھ/1085ء)⁩ سے ملے جو نظام الملک کے بنائے ہوئے مدرسے کے مدرس بھی تھے، اور ان سے فقہی مناظروں کے کئی مجلس منعقد کیے جن کا متن سبکی نے محفوظ کیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}۔"
