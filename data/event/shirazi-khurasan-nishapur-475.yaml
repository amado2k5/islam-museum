label:
  ar: "رحلة الشيرازي إلى خراسان ومناظراته بالجويني، نحو ٤٧٥هـ"
  en: "Al-Shirazi's journey to Khurasan and his disputations with al-Juwayni, c. 475/1082"
  ur: "شیرازی کا خراسان سفر اور جوینی سے مناظرے، تقریباً 475ھ/1082ء"
  es: "El viaje de Al-Shirazi a Khurasan y sus disputas con al-Juwayni, c. 475/1082"
  fr: "Le voyage d'Al-Shirazi au Khurasan et ses disputes avec al-Juwayni, c. 475/1082"
  tr: "El-Şirazi'nin Horasan'a yolculuğu ve El-Cüveynî ile tartışmaları, H. 475 civarında"
  id: "Perjalanan Al-Shirazi ke Khorasan dan perdebatannya dengan Al-Juwayni, sekitar tahun 475 H."
summary:
  ar: "في أواخر أيامه — هو المعروف بقلة الترحال حتى إن التراجم تذكر أن ماله لم يكن يبلغ نفقة الحج — رحل الشيرازي إلى خراسان رحلة ناجحة يفاوض سلطات السلاجقة عن الخليفة، فقيس فيها مكانته عند العامة وفي حلقات الصوفية ونفوذه في نخبة العلماء؛ وبنيسابور لاقى زميله أبا المعالي الجويني — الفقيه الشافعي الكبير الآخر ومدرّس مدرسة أخرى بناها له نظام الملك — فعقد معه مجالس مناظرة نقل السبكي نصها {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  en: "Towards the end of his life — he was of notably sedentary habits, the biographers remarking that he lacked the means even to make the Pilgrimage — al-Shirazi undertook a highly successful journey to Khurasan, negotiating on the caliph's behalf with the Saljuq authorities; it let him measure his popularity among common folk and Sufi circles and his influence with the intellectual elite. At Nishapur he met his colleague Abu al-Ma'ali al-Juwayni (d. 478/1085), the other great Shafi'i jurist of the age and likewise head of a madrasa built for him by Nizam al-Mulk, and held several sessions of judicial controversy with him, whose text al-Subki preserves {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  ur: "عمر کے آخری حصے میں — وہ سفر سے دور رہنے والے تھے یہاں تک کہ تراجم کے مطابق ان کے پاس حج کے خرچے کی سامرتھ بھی نہ تھی — شیرازی نے خراسان کا کامیاب سفر کیا اور خلیفہ کی جانب سے سلجوق حکام سے مذاکرات کیے؛ اس سے عام لوگوں اور صوفیانہ حلقوں میں ان کی مقبولیت اور علمی نخبہ میں ان کے اثر کا اندازہ ہوا۔ نیشاپور میں وہ اپنے ہم عصر دوسرے ممتاز شافعی فقیہ ابو المعالی جوینی ⁦(ت 478ھ/1085ء)⁩ سے ملے جو نظام الملک کے بنائے ہوئے مدرسے کے مدرس بھی تھے، اور ان سے فقہی مناظروں کے کئی مجلس منعقد کیے جن کا متن سبکی نے محفوظ کیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}۔"
  es: "Hacia el final de su vida —era notablemente sedentario, y sus biógrafos señalan que carecía incluso de los medios para realizar la Peregrinación— al-Shirazi emprendió un viaje muy exitoso a Jorasán, negociando en nombre del califa con las autoridades selyúcidas; esto le permitió medir su popularidad entre la gente común y los círculos sufíes, así como su influencia entre la élite intelectual. En Nishapur conoció a su colega Abu al-Ma'ali al-Juwayni (m. 478/1085), el otro gran jurista shafi'í de la época y también director de una madrasa construida para él por Nizam al-Mulk, y mantuvo varias sesiones de controversia judicial con él, cuyo texto conserva al-Subki {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  fr: "Vers la fin de sa vie — il était d'une nature particulièrement sédentaire, ses biographes soulignant qu'il n'avait même pas les moyens d'accomplir le pèlerinage —, al-Shirazi entreprit un voyage très fructueux au Khorasan, négociant au nom du calife avec les autorités seldjoukides. Ce voyage lui permit de mesurer sa popularité auprès du peuple et des cercles soufis, ainsi que son influence auprès de l'élite intellectuelle. À Nishapur, il rencontra son collègue Abu al-Ma'ali al-Juwayni (mort en 478/1085), l'autre grand juriste chaféite de l'époque et également directeur d'une madrasa construite pour lui par Nizam al-Mulk. Ils eurent plusieurs séances de controverses juridiques, dont le texte est conservé par al-Subki (voir Encyclopaedia of Islam, vol. 9, p. 495)."
  tr: "Hayatının son yıllarında—seyirleri nadir olduğu ve biyografilerinde parasının Hac masraflarını karşılamaya yetmediği belirtildiği üzere—Şirazi, halife adına Selçuklu yetkililerle görüşmek üzere Horasan'a başarılı bir yolculuk yaptı. Orada, halk arasında ve Sufi çevrelerinde saygınlığı ve seçkin alimler arasındaki etkisi ölçülüydü. Nişapur'da, meslektaşı Ebu el-Ma'ali el-Cüveyni ile—Nizam el-Mulk tarafından kendisi için kurulan başka bir okulun büyük Şafiî fıkıhçısı ve öğretmeni—tanıştı ve onunla münazaralar düzenledi; bu münazaraların metni el-Subki tarafından aktarılmıştır. {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}"
  id: "Di tahun-tahun terakhirnya—ia dikenal karena perjalanannya yang jarang, sampai-sampai biografi menyebutkan bahwa uangnya tidak cukup untuk biaya haji—al-Shirazi melakukan perjalanan yang sukses ke Khorasan untuk bernegosiasi dengan otoritas Seljuk atas nama Khalifah. Di sana, statusnya di kalangan masyarakat umum dan di kalangan Sufi, serta pengaruhnya di antara para ulama elit, diukur. Di Nishapur, ia bertemu dengan rekannya Abu al-Ma’ali al-Juwayni—seorang ahli hukum Syafi'i terkemuka lainnya dan guru dari mazhab lain yang dibangun untuknya oleh Nizam al-Mulk—dan mengadakan sesi debat dengannya, yang teksnya diriwayatkan oleh al-Subki {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
