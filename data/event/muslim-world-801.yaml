label: { ar: "ملوك العالم الإسلامي أول القرن التاسع", en: "The rulers of the Muslim world at the start of the ninth century", es: "Los gobernantes del mundo musulmán a principios del siglo IX", fr: "Les dirigeants du monde musulman au début du IXe siècle", ur: "نویں صدی کے آغاز میں مسلم دنیا کے حکمران", tr: "Dokuzuncu yüzyılın başlarında İslam dünyasının kralları", id: "Raja-raja dunia Islam pada awal abad kesembilan" }
summary:
  ar: "قال ابن حجر دخلت سنة إحدى وثمانمائة أول القرن التاسع وسلطان مصر والشام والحجاز الملك الظاهر أبو سعيد برقوق وسلطان الروم أبو يزيد بن عثمان وسلطان اليمن من نواحي تهامة الملك الأشرف إسماعيل بن الأفضل بن المجاهد وسلطان اليمن من نواحي الجبال الإمام الزيدي الحسني علي بن صلاح وسلطان المغرب الأوسط أبو سعيد عثمان المزيني وسلطان المغرب الأقصى ابن الأحمر وصاحب البلاد الشرقية تيمور كوركان المعروف باللنك وصاحب بغداد أحمد بن أويس وأمير مكة حسن بن عجلان بن رميثة الحسني وبالمدينة ثابت بن نفير والخليفة العباسي أبو عبد الله محمد المتوكل على الله بن المعتضد بالله أبي بكر ويدعى أمير المؤمنين ونازعه في هذا الاسم الإمام الزيدي وبعض ملوك المغرب وصاحب اليمن لكن خطيبها يدعو في خطبته للمستعصم العباسي أحد خلفاء بغداد وكان نائب دمشق يومئذ تنم الحسني وبحلب أرغون شاه وبطرابلس أقبغا الحمالي وبحماة يونس الغلطاوي وبصفد شهاب الدين بن الشيخ علي وبغزة طيفور وقال الحافظ السخاوي قد أفردت تراجم أهله في ست مجلدات {cite:shadharat-dhahab p. 2}."
  en: "Ibn Hajar's roll at the ninth century's dawn (801): Barquq over Egypt, Syria and the Hijaz; Bayezid ibn Uthman in Anatolia; a Rasulid over Tihama and a Zaydi imam over highland Yemen; the Marinid Abu Sa'id Uthman in the central Maghreb and Ibn al-Ahmar at its far end; Timur Gurkan in the east, Ahmad ibn Uways in Baghdad, Hasan ibn Ajlan amir of Mecca, and the Abbasid al-Mutawakkil as caliph — his title contested by the Zaydi imam and some Maghreb kings while Yemen's khatib still invoked al-Musta'sim {cite:shadharat-dhahab p. 2}."
  es: "La lista de Ibn Hajar en los albores del siglo IX (801): Barquq sobre Egipto, Siria y el Hijaz; Bayezid ibn Uthman en Anatolia; un rasulida sobre Tihama y un imán zaydí sobre las tierras altas de Yemen; los mariníes Abu Sa'id Uthman en el Magreb central e Ibn al-Ahmar en su extremo más alejado; Timur Gurkan en el este, Ahmad ibn Uways en Bagdad, Hasan ibn Ajlan emir de La Meca y el abasí al-Mutawakkil como califa; su título fue impugnado por el imán zaydí y algunos reyes del Magreb, mientras que los khatib de Yemen todavía invocaban a al-Musta'sim {cita: shadharat-dhahab p. 2}."
  fr: "Rôle d'Ibn Hajar à l'aube du IXe siècle (801): Barquq sur l'Egypte, la Syrie et le Hedjaz; Bayezid ibn Uthman en Anatolie; un Rasulid sur Tihama et un imam Zaydi sur les hauts plateaux du Yémen; le mérinide Abu Sa'id Uthman au Maghreb central et Ibn al-Ahmar à l'extrémité; Timur Gurkan à l'est, Ahmad ibn Uways à Bagdad, Hasan ibn Ajlan amir de La Mecque et l'Abbasside al-Mutawakkil comme calife — son titre est contesté par l'imam zaydi et certains rois du Maghreb tandis que le khatib du Yémen invoquait toujours al-Musta'sim {cite: shadharat-dhahab p. 2}."
  ur: "نویں صدی کے آغاز میں ابن حجر کا رول (801): مصر، شام اور حجاز پر برقوق؛ اناطولیہ میں بایزید بن عثمان؛ ایک رسول تہامہ پر اور ایک زیدی امام اعلیٰ یمن پر۔ مرید ابو سعید عثمان وسطی مغرب میں اور ابن الاحمر اس کے آخر میں؛ مشرق میں تیمور گورکان، بغداد میں احمد بن اویس، مکہ کے امیر حسن بن عجلان، اور عباسی المتوکل خلیفہ کے طور پر - ان کے لقب کا مقابلہ زیدی امام اور مغرب کے کچھ بادشاہوں نے کیا جبکہ یمن کے خطیب نے اب بھی المستصمۃ الذہب کو پکارا ہے۔ 2}۔"
  tr: "İbn Hacer şöyle dedi: Hicri 801 yılı dokuzuncu yüzyılın başında başladı. Mısır, Suriye ve Hicaz Sultanı Kral el-Zahir Ebu Sa'id Barquq; Rum (Anadolu) Sultanı Ebu Yezid ibn Osman; Tihama bölgesinden Yemen Sultanı Kral el-Eşref İsmail ibn el-Afdal ibn el-Mücahid; dağlık bölgeden Yemen Sultanı Zeydi İmam el-Hasani Ali ibn Salah; Orta Mağrip Sultanı Ebu Sa'id Osman el-Muzayni; Uzak Mağrip Sultanı İbn el-Ahmar; doğu topraklarının hükümdarı Lenk olarak bilinen Timur Kurkan; Bağdat hükümdarı Ahmed ibn Uveys; Mekke Emiri Hasan ibn Eclan ibn Rumaytha el-Hasani; Medine'de ise Sabit ibn Nufeyr vardı. Abbasî halifesi ise, Müminlerin Komutanı olarak anılan Ebu Abdullah Muhammed el-Mutavakkil 'ala Allah ibn el-Mu'tadid Billah Ebu Bekir idi. Zeydi İmamı, Mağrip krallarından bazıları ve Yemen hükümdarı bu unvanı onunla tartıştı, ancak Yemen vaizi hutbesinde Bağdat halifelerinden biri olan el-Musta'sim el-Abbasi'yi çağırdı. O dönemde Şam'ın vekili Tanim el-Hasani; Halep'te Arghun Şah; Trablus'ta Akbuğa el-Hamali; Hama'da Yunus el-Ghaltavi; Safed'de Şihab el-Din ibn el-Şeyh Ali; ve Gazze'de Tayfur idi. El-Hafız el-Sakhavi şöyle dedi: Ailesinin biyografileri altı ciltte derlenmiştir {kaynak: Şadharat-dhahab s. 2}."
  id: "Ibn Hajar berkata: Tahun 801 H dimulai pada awal abad kesembilan. Sultan Mesir, Suriah, dan Hijaz adalah Raja al-Zahir Abu Sa'id Barquq; Sultan Rum (Anatolia) adalah Abu Yazid ibn Uthman; Sultan Yaman dari wilayah Tihama adalah Raja al-Ashraf Isma'il ibn al-Afdal ibn al-Mujahid; Sultan Yaman dari wilayah pegunungan adalah Zaidi Imam al-Hasani Ali ibn Salah; Sultan Maghreb tengah adalah Abu Sa'id Uthman al-Muzayni; Sultan Maghreb terjauh adalah Ibn al-Ahmar; penguasa wilayah timur adalah Timur Kurkan, yang dikenal sebagai Lenk; penguasa Baghdad adalah Ahmad ibn Uways; Emir Mekah adalah Hasan ibn Ajlan ibn Rumaytha al-Hasani; di Madinah adalah Thabit ibn Nufayr; Khalifah Abbasiyah adalah Abu Abdullah Muhammad al-Mutawakkil 'ala Allah ibn al-Mu'tadid Billah Abu Bakr, yang disebut sebagai Amirul Mukminin. Imam Zaidi dan beberapa raja Maghreb serta penguasa Yaman memperdebatkan gelar ini dengannya, tetapi pendakwah Yaman dalam khotbahnya menyerukan al-Musta'sim al-Abbasi, salah satu khalifah Baghdad. Wakil Damaskus pada waktu itu adalah Tanim al-Hasani; di Aleppo, Arghun Shah; di Tripoli, Aqbugha al-Hamali; di Hama, Yunus al-Ghaltawi; di Safed, Shihab al-Din ibn al-Shaykh Ali; dan di Gaza, Tayfur. Al-Hafiz al-Sakhawi berkata: Biografi keluarganya disusun dalam enam jilid {cite:shadharat-dhahab p. 2}."
