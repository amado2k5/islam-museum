label: { ar: "ملوك العالم الإسلامي أول القرن التاسع" }
summary:
  ar: "قال ابن حجر دخلت سنة إحدى وثمانمائة أول القرن التاسع وسلطان مصر والشام والحجاز الملك الظاهر أبو سعيد برقوق وسلطان الروم أبو يزيد بن عثمان وسلطان اليمن من نواحي تهامة الملك الأشرف إسماعيل بن الأفضل بن المجاهد وسلطان اليمن من نواحي الجبال الإمام الزيدي الحسني علي بن صلاح وسلطان المغرب الأوسط أبو سعيد عثمان المزيني وسلطان المغرب الأقصى ابن الأحمر وصاحب البلاد الشرقية تيمور كوركان المعروف باللنك وصاحب بغداد أحمد بن أويس وأمير مكة حسن بن عجلان بن رميثة الحسني وبالمدينة ثابت بن نفير والخليفة العباسي أبو عبد الله محمد المتوكل على الله بن المعتضد بالله أبي بكر ويدعى أمير المؤمنين ونازعه في هذا الاسم الإمام الزيدي وبعض ملوك المغرب وصاحب اليمن لكن خطيبها يدعو في خطبته للمستعصم العباسي أحد خلفاء بغداد وكان نائب دمشق يومئذ تنم الحسني وبحلب أرغون شاه وبطرابلس أقبغا الحمالي وبحماة يونس الغلطاوي وبصفد شهاب الدين بن الشيخ علي وبغزة طيفور وقال الحافظ السخاوي قد أفردت تراجم أهله في ست مجلدات {cite:shadharat-dhahab p. 2}."
  en: "Ibn Hajar's roll at the ninth century's dawn (801): Barquq over Egypt, Syria and the Hijaz; Bayezid ibn Uthman in Anatolia; a Rasulid over Tihama and a Zaydi imam over highland Yemen; the Marinid Abu Sa'id Uthman in the central Maghreb and Ibn al-Ahmar at its far end; Timur Gurkan in the east, Ahmad ibn Uways in Baghdad, Hasan ibn Ajlan amir of Mecca, and the Abbasid al-Mutawakkil as caliph — his title contested by the Zaydi imam and some Maghreb kings while Yemen's khatib still invoked al-Musta'sim {cite:shadharat-dhahab p. 2}."
