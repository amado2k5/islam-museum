id: "event/ali-ibn-muhammad-rides-out-with-ten-horsemen-after-ya-am-and-wadaa-decline-to-help-295"
class: event
kind: other
label:
  ar: "علي بن محمد يخرج في عشرة فرسان من شاكر وثقيف بعد أن رفض يأم ووادعة نصرته، 295هـ، ص381"
  en: "Ali ibn Muhammad rides out with ten horsemen of Shakir and Thaqif after Ya'am and Wada'a refuse help, 295 AH, p. 381"
  ur: "یأم اور وادعہ کے انکار کے بعد علی بن محمد شاکر اور ثقیف کے دس گھڑ سواروں کے ساتھ نکلتا ہے، 295ھ، ص381"
summary:
  ar: "أرسل علي بن محمد إلى يأم ووادعة يطلب نصرتهم ليغير بهم على بني الحارث، فاعتذروا بفتنة بين عشائرهم، فخرج في عشرة فرسان من شاكر وثقيف إلى البقيرة."
  en: "Ali ibn Muhammad asked Ya'am and Wada'a to join him in a raid on Banu al-Harith. They declined, citing feuds among their own clans, so he rode out with about ten horsemen of Shakir and Thaqif to al-Buqayra."
  ur: "علی بن محمد نے یأم اور وادعہ سے بنو حارث پر مشترکہ حملے کے لیے مدد مانگی۔ انہوں نے اپنے قبیلوں کے اندرونی جھگڑے کا عذر کیا، تو وہ شاکر اور ثقیف کے تقریباً دس گھڑ سواروں کے ساتھ البقیرہ کی طرف نکلا۔"
