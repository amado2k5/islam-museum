label: { ar: "افتتاح ابن عامر خراسان", en: "Ibn Amir's Opening of Khurasan", es: "La apertura de Jorasán por Ibn Amir", fr: "Ouverture du Khorasan par Ibn Amir" }
summary:
  ar: "غزا عبد الله بن عامر خراسان سنة ٣٠ واستخلف على البصرة زياد بن أبي سفيان وبعث على مقدمته الأحنف بن قيس ويقال عبد الله بن خازم السلمي فأقر صلح الطبسين وقدم الأحنف إلى قوهستان أقرب مدينة إلى الطبسين فلقيه الهياطلة فهزمهم وفتح قوهستان عنوة ويقال ألجأهم إلى حصنهم ثم قدم عليه ابن عامر فصالحهم على ستمائة ألف درهم وقال معمر بن المثنى كان المتوجه إلى قوهستان أمير بن الأحمر اليشكري وهي بلاد سكر بن وائل إلى اليوم وبعث ابن عامر يزيد الجرشي أبا سالم إلى رستاق زام من نيسابور ففتحه عنوة وفتح باخرز وجوين وسبى ووجه الأسود بن كلثوم العدوي عدي الرباب وكان ناسكاً إلى بيهق فدخل بعض حيطان أهله من ثلمة فيه ودخلت معه طائفة فأخذ المدو عليهم تلك الثلمة فقاتل حتى قتل ومن معه وقام بأمر الناس أدهم بن كاثوم فظفر وفتح بيهق وكان الأسود يدعو ربه أن يحشره من بطون السباع والطير فلم يوره أخوه ودفن من استشهد من أصحابه وفتح ابن عامر بشت وأشبند ورخ وزاوة وخواف وأسبرائن وأرغيان من نيسابور."
  en: "Ibn Amir invaded Khurasan in 30h — Ziyad over Basra, al-Ahnaf ibn Qays (or Ibn Khazim) on the van — confirmed the Tabasayn sulh, routed the Hayatila at Quhistan and took it by force, or reduced them to their fort and truced at six hundred thousand; Mu'ammar says the marcher was Umair ibn al-Ahmar, and it is Sukar ibn Wa'il's land. Yazid al-Jarrashi took Zam, Bakharz and Juwayn with captives; the ascetic al-Aswad ibn Kulthum — Adi al-Ribab — broke into Bayhaq through a wall-breach and fell with his band when the foe held it, Adham ibn Kathum then winning the town; al-Aswad, who had prayed to rise from the bellies of beasts and birds, was left unburied by his brother while his companions were buried. Ibn Amir took Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in and Arghiyan."
  es: "Ibn Amir invadió Jorasán en el año 30 h — Ziyad sobre Basora, al-Ahnaf ibn Qays (o Ibn Khazim) en la vanguardia — confirmó el sulh de Tabasayn, derrotó a los Hayatila en Quhistán y lo tomó por la fuerza, o los redujo a su fortaleza y pagó una tregua de seiscientos mil hombres; Mu'ammar dice que el marchante fue Umair ibn al-Ahmar, y es la tierra de Sukar ibn Wa'il. Yazid al-Jarrashi tomó Zam, Bakharz y Juwayn con cautivos; el asceta al-Aswad ibn Kulthum — Adi al-Ribab — irrumpió en Bayhaq a través de una brecha en la muralla y cayó con su banda cuando el enemigo la defendía, Adham ibn Kathum luego ganó la ciudad; al-Aswad, que había orado para levantarse de los vientres de bestias y aves, fue dejado sin sepultura por su hermano mientras sus compañeros fueron enterrados. Ibn Amir tomó Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in y Arghiyan."
  fr: "Ibn Amir envahit le Khorasan en 30 h — Ziyad à Bassora, al-Ahnaf ibn Qays (ou Ibn Khazim) en avant — confirma la marche des Tabasayn, mit en déroute les Hayatila à Quhistan et s'en empara par la force, ou les réduisit à leur forteresse et conclut une trêve à six cent mille hommes. Mu'ammar affirme que le marcheur était Umair ibn al-Ahmar, et que c'était le territoire de Sukar ibn Wa'il. Yazid al-Jarrashi prit Zam, Bakharz et Juwayn avec des captifs; l'ascète al-Aswad ibn Kulthum — Adi al-Ribab — pénétra dans Bayhaq par une brèche dans les murailles et périt avec sa troupe lorsque l'ennemi tenait la ville, Adham ibn Kathum s'emparant ensuite de la ville; al-Aswad, qui avait prié pour ressusciter du ventre des bêtes et des oiseaux, ne fut pas enterré par son frère tandis que ses compagnons l'étaient. Ibn Amir prit Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in et Arghiyan."
