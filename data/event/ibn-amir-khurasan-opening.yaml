label: { ar: "افتتاح ابن عامر خراسان", en: "Ibn Amir's Opening of Khurasan", es: "La apertura de Jorasán por Ibn Amir", fr: "Ouverture du Khorasan par Ibn Amir", ur: "ابن عامر کا خراسان کا افتتاح", tr: "İbn Amir Horasan'ın açılışı", id: "Pembukaan Ibn Amir Khurasan" }
summary:
  ar: "غزا عبد الله بن عامر خراسان سنة ٣٠ واستخلف على البصرة زياد بن أبي سفيان وبعث على مقدمته الأحنف بن قيس ويقال عبد الله بن خازم السلمي فأقر صلح الطبسين وقدم الأحنف إلى قوهستان أقرب مدينة إلى الطبسين فلقيه الهياطلة فهزمهم وفتح قوهستان عنوة ويقال ألجأهم إلى حصنهم ثم قدم عليه ابن عامر فصالحهم على ستمائة ألف درهم وقال معمر بن المثنى كان المتوجه إلى قوهستان أمير بن الأحمر اليشكري وهي بلاد سكر بن وائل إلى اليوم وبعث ابن عامر يزيد الجرشي أبا سالم إلى رستاق زام من نيسابور ففتحه عنوة وفتح باخرز وجوين وسبى ووجه الأسود بن كلثوم العدوي عدي الرباب وكان ناسكاً إلى بيهق فدخل بعض حيطان أهله من ثلمة فيه ودخلت معه طائفة فأخذ المدو عليهم تلك الثلمة فقاتل حتى قتل ومن معه وقام بأمر الناس أدهم بن كاثوم فظفر وفتح بيهق وكان الأسود يدعو ربه أن يحشره من بطون السباع والطير فلم يوره أخوه ودفن من استشهد من أصحابه وفتح ابن عامر بشت وأشبند ورخ وزاوة وخواف وأسبرائن وأرغيان من نيسابور."
  en: "Ibn Amir invaded Khurasan in 30h — Ziyad over Basra, al-Ahnaf ibn Qays (or Ibn Khazim) on the van — confirmed the Tabasayn sulh, routed the Hayatila at Quhistan and took it by force, or reduced them to their fort and truced at six hundred thousand; Mu'ammar says the marcher was Umair ibn al-Ahmar, and it is Sukar ibn Wa'il's land. Yazid al-Jarrashi took Zam, Bakharz and Juwayn with captives; the ascetic al-Aswad ibn Kulthum — Adi al-Ribab — broke into Bayhaq through a wall-breach and fell with his band when the foe held it, Adham ibn Kathum then winning the town; al-Aswad, who had prayed to rise from the bellies of beasts and birds, was left unburied by his brother while his companions were buried. Ibn Amir took Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in and Arghiyan."
  es: "Ibn Amir invadió Jorasán en el año 30 h — Ziyad sobre Basora, al-Ahnaf ibn Qays (o Ibn Khazim) en la vanguardia — confirmó el sulh de Tabasayn, derrotó a los Hayatila en Quhistán y lo tomó por la fuerza, o los redujo a su fortaleza y pagó una tregua de seiscientos mil hombres; Mu'ammar dice que el marchante fue Umair ibn al-Ahmar, y es la tierra de Sukar ibn Wa'il. Yazid al-Jarrashi tomó Zam, Bakharz y Juwayn con cautivos; el asceta al-Aswad ibn Kulthum — Adi al-Ribab — irrumpió en Bayhaq a través de una brecha en la muralla y cayó con su banda cuando el enemigo la defendía, Adham ibn Kathum luego ganó la ciudad; al-Aswad, que había orado para levantarse de los vientres de bestias y aves, fue dejado sin sepultura por su hermano mientras sus compañeros fueron enterrados. Ibn Amir tomó Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in y Arghiyan."
  fr: "Ibn Amir envahit le Khorasan en 30 h — Ziyad à Bassora, al-Ahnaf ibn Qays (ou Ibn Khazim) en avant — confirma la marche des Tabasayn, mit en déroute les Hayatila à Quhistan et s'en empara par la force, ou les réduisit à leur forteresse et conclut une trêve à six cent mille hommes. Mu'ammar affirme que le marcheur était Umair ibn al-Ahmar, et que c'était le territoire de Sukar ibn Wa'il. Yazid al-Jarrashi prit Zam, Bakharz et Juwayn avec des captifs; l'ascète al-Aswad ibn Kulthum — Adi al-Ribab — pénétra dans Bayhaq par une brèche dans les murailles et périt avec sa troupe lorsque l'ennemi tenait la ville, Adham ibn Kathum s'emparant ensuite de la ville; al-Aswad, qui avait prié pour ressusciter du ventre des bêtes et des oiseaux, ne fut pas enterré par son frère tandis que ses compagnons l'étaient. Ibn Amir prit Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in et Arghiyan."
  ur: "ابن عامر نے 30ھ میں خراسان پر حملہ کیا — زیاد بصرہ پر، الاحناف ابن قیس ⁦(یا ابن خزیم)⁩ نے وین پر — تبسائین سلح کی تصدیق کی، کوہستان میں حیاتیلا کو شکست دی اور اسے طاقت کے ذریعے لے لیا، یا انہیں اپنے قلعے تک پہنچا دیا اور چھ لاکھ پر جنگ بندی کی۔ معمر کہتے ہیں کہ مارچ کرنے والا عمیر بن الاحمر تھا اور یہ سقر بن وائل کی سرزمین ہے۔ یزید الجراشی نے زم، بخرز اور جوین کو قیدیوں کے ساتھ لے لیا۔ اسود بن کلثوم - عدی الرباب - دیوار کی شگاف کے ذریعے بیہق میں داخل ہوا اور اپنے گروہ کے ساتھ گر گیا جب دشمن نے اسے پکڑ لیا، ادھم ابن کلثوم نے پھر قصبہ جیت لیا۔ اسود، جس نے درندوں اور پرندوں کے پیٹوں سے اٹھنے کی دعا کی تھی، اسے اس کے بھائی نے دفن کیے بغیر چھوڑ دیا جب کہ اس کے ساتھیوں کو دفن کیا گیا۔ ابن عامر نے بشت، اشبند، رخ، ذوا، خواف، اصبرین اور ارغیان لیا۔"
  tr: "Abdullah ibn Amir, Hicri 30 yılında Horasan'ı işgal etti ve Basra'da Ziyad ibn Abi Sufyan'ı vekili olarak atadı. Öncü birlik olarak el-Ahnaf ibn Kays'ı (bazı kaynaklara göre Abdullah ibn Khazim el-Sulami) gönderdi. Tabasin ile barış antlaşmasını onayladı. El-Ahnaf, Tabasin'e en yakın şehir olan Kuhistan'a ilerledi ve orada Eftalitlerle karşılaştı. Onları yenerek Kuhistan'ı zorla ele geçirdi. Ayrıca onları kalelerine geri püskürttüğü de söylenir. Daha sonra İbn Amir geldi ve onlarla altı yüz bin dirhem karşılığında barış yaptı. Muammer ibn el-Muthanna, Kuhistan'a gidenin Amir ibn el-Ahmar el-Yashkuri olduğunu ve buranın bugün Sukr ibn Wa'il'in toprakları olduğunu söyledi. İbn Amir, Yazid el-Cerşi (Ebu Salim)'i Nişapur'daki Zam bölgesine gönderdi ve orayı zorla ele geçirdi. Ayrıca Bakharz ve Juwayn'ı da fethetti ve esir aldı. Bayhaq'a, Ribab'ın Adi kabilesinden, münzevi bir adam olan el-Aswad ibn Kulthum el-Adawi'yi gönderdi. Ailesinin surlarının bir kısmı yıkıldı ve bir grup onunla birlikte içeri girdi. Ordu bu gedikten içeri girdi ve o ve arkadaşları öldürülene kadar savaştı. Adham ibn Kathum halkın komutasını aldı ve Bayhaq'ı fethederek zafer kazandı. El-Aswad, Rabbine kendisini mezardan diriltmesi için dua ederdi. Hayvanların ve kuşların karınlarında diriltmek için dua ederdi, bu yüzden kardeşi onu gömmedi ve şehit olan arkadaşlarının cesetlerini gömdü. İbn Amir, Beht, Aşband, Rakh, Zawa, Khawaf, Asbrain ve Nişapur'un Arghian'ını fethetti."
  id: "Abdullah ibn Amir menginvasi Khurasan pada tahun 30 Hijriah, dan menunjuk Ziyad ibn Abi Sufyan sebagai wakilnya di Basra. Ia mengirim al-Ahnaf ibn Qays, atau, menurut beberapa pendapat, Abdullah ibn Khazim al-Sulami, sebagai garda depan. Ia meratifikasi perjanjian damai dengan Tabasin. Al-Ahnaf maju ke Quhistan, kota terdekat dengan Tabasin, di mana ia bertemu dengan kaum Hephthalit. Ia mengalahkan mereka dan menaklukkan Quhistan dengan kekerasan. Dikatakan juga bahwa ia memaksa mereka kembali ke benteng mereka. Kemudian Ibn Amir tiba dan berdamai dengan mereka dengan imbalan enam ratus ribu dirham. Muammar ibn al-Muthanna mengatakan bahwa orang yang pergi ke Quhistan adalah Amir ibn al-Ahmar al-Yashkuri, dan itu adalah tanah Sukr ibn Wa'il hingga hari ini. Ibn Amir mengutus Yazid al-Jarshi, Abu Salim, ke distrik Zam di Nishapur, dan ia menaklukkannya dengan kekerasan. Ia juga menaklukkan Bakharz dan Juwayn, serta menawan beberapa orang. Ia mengutus al-Aswad ibn Kulthum al-Adawi, seorang pria dari suku 'Adi dari al-Ribab, yang merupakan seorang pertapa, ke Bayhaq. Beberapa tembok keluarganya jebol, dan sekelompok dari mereka masuk bersamanya. Pasukan merebut celah itu dan bertempur sampai ia dan para sahabatnya terbunuh. Adham ibn Kathum mengambil alih komando pasukan dan meraih kemenangan, menaklukkan Bayhaq. Al-Aswad biasa berdoa kepada Tuhannya agar membangkitkannya dari kubur. Perut binatang buas dan burung-burung, sehingga saudaranya tidak menguburnya, dan ia mengubur sahabat-sahabatnya yang gugur sebagai syuhada, dan Ibn Amir menaklukkan Basht, Ashband, Rakh, Zawa, Khawaf, Asbrain, dan Arghian di Nishapur."
