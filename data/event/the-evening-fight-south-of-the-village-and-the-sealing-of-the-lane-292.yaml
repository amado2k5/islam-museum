label:
  ar: "قتال العشاء إلى قبلة القرية وسد درب القرية، ص281"
  en: "The evening fight south of the village and the sealing of the lane, p. 281"
  ur: "دیہات کے قبلہ کی طرف شام کی لڑائی اور گلی بند کرنا، ص281"
summary:
  ar: "عند العشاء سار بنو الحارث إلى قبلة القرية، فخرج أبو جعفر ومعه ابن بسطام، ثم حمل خامس خمسة أفراس فطرد بني الحارث وكانوا أربعين فارساً، ولزم الموضع حتى أمسى، وأمر بسد درب القرية."
  en: "In the evening Banu al-Harith came to the south side of the village; Abu Ja'far went out with Ibn Bustam beside him, then charged with four other horsemen and routed Banu al-Harith, who were forty horse, and he held the spot until dusk and ordered the village lane blocked."
  ur: "شام کو بنو حارث بستی کے قبلہ کی طرف آئے، ابو جعفر ابن بسطام کے ساتھ نکلے، پھر پانچ سواروں میں سے ایک ہو کر حملہ کیا اور چالیس سواروں والے بنو حارث کو بھگا دیا، اپنی جگہ رات تک رہے اور بستی کی گلی بند کرنے کا حکم دیا۔"
