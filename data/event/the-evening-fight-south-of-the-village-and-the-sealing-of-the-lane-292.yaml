id: event/the-evening-fight-south-of-the-village-and-the-sealing-of-the-lane-292
class: event
kind: other
label:
  ar: "قتال العشاء إلى قبلة القرية وسد درب القرية، ص281"
  en: "The evening fight south of the village and the sealing of the lane, p. 281"
  ur: "دیہات کے قبلہ کی طرف شام کی لڑائی اور گلی بند کرنا، ص281"
  es: "La pelea vespertina al sur del pueblo y el sellado del camino, pág. 281"
  fr: "Le combat du soir au sud du village et le bouclage de la voie, p. 281"
  tr: "Köyün kıblesine yönelik akşam yemeği kavgası ve köy yolunun kapatılması, s. 281"
  id: "Perkelahian saat makan malam menuju kiblat desa dan pemblokiran jalan desa, hlm. 281"
summary:
  ar: "عند العشاء سار بنو الحارث إلى قبلة القرية، فخرج أبو جعفر ومعه ابن بسطام، ثم حمل خامس خمسة أفراس فطرد بني الحارث وكانوا أربعين فارساً، ولزم الموضع حتى أمسى، وأمر بسد درب القرية."
  en: "In the evening Banu al-Harith came to the south side of the village; Abu Ja'far went out with Ibn Bustam beside him, then charged with four other horsemen and routed Banu al-Harith, who were forty horse, and he held the spot until dusk and ordered the village lane blocked."
  ur: "شام کو بنو حارث بستی کے قبلہ کی طرف آئے، ابو جعفر ابن بسطام کے ساتھ نکلے، پھر پانچ سواروں میں سے ایک ہو کر حملہ کیا اور چالیس سواروں والے بنو حارث کو بھگا دیا، اپنی جگہ رات تک رہے اور بستی کی گلی بند کرنے کا حکم دیا۔"
  es: "Por la tarde, los Banu al-Harith llegaron al lado sur del pueblo; Abu Ja'far salió con Ibn Bustam a su lado, luego cargó con otros cuatro jinetes y derrotó a los Banu al-Harith, que contaban con cuarenta caballos, y mantuvo el lugar hasta el anochecer y ordenó que se bloqueara el camino del pueblo."
  fr: "Le soir, les Banu al-Harith arrivèrent au sud du village; Abu Ja'far sortit avec Ibn Bustam à ses côtés, puis chargea avec quatre autres cavaliers et mit en déroute les Banu al-Harith, qui comptaient quarante chevaux, et il tint la position jusqu'au crépuscule et ordonna de bloquer la route du village."
  tr: "Akşam yemeğinde Beni el-Harith kabilesi köye doğru ilerlemeye başladı. Ebu Cafer, İbn Bistam ile birlikte dışarı çıktı, ardından beşinci kişi beş atla Beni el-Harith kabilesini (kırk süvari) uzaklaştırdı. Akşama kadar orada kaldı ve köy yolunun kapatılmasını emretti."
  id: "Saat makan malam, Bani al-Harith berbaris menuju arah desa. Abu Ja'far keluar bersama Ibnu Bistam, kemudian orang kelima membawa lima kuda dan mengusir Bani al-Harith, yang berjumlah empat puluh penunggang kuda. Ia tinggal di tempat itu hingga sore hari, dan memerintahkan jalan desa untuk diblokir."
