id: event/al-hadi-preaches-at-sanaa-on-the-second-friday-288
class: event
kind: other
label:
  ar: "الهادي يخطب في صنعاء الجمعة الثانية، سنة 288هـ"
  en: "Al-Hadi preaches at Sana'a on the second Friday, 288 AH"
  ur: "ہادی صنعاء میں دوسرے جمعے کو خطبہ دیتے ہیں، 288ھ"
  es: "Al-Hadi predicó en Saná el segundo viernes del año 288 de la Hégira."
  fr: "Al-Hadi prêche à Sanaa le deuxième vendredi de l'an 288 de l'Hégire."
  tr: "El-Hadi, Hicri 288 yılının ikinci Cuma günü Sana'a'da bir hutbe verdi."
  id: "Al-Hadi menyampaikan khutbah di Sana'a pada hari Jumat kedua, tahun 288 Hijriah."
summary:
  ar: "خرج الهادي في الجمعة الثانية إلى المسجد فخطب الناس ووعظهم وأعلمهم بما يجب لله عليهم، ثم قال لهم إنهم ما نقموا عليه إلا ما حكاه الله عن قوم لوط، وإنه يقول لهم ما قاله يوسف لإخوته، ثم رجع إلى منزله وسُرّ الناس بإحسانه."
  en: "On the second Friday al-Hadi went out to the mosque and preached, admonishing the people and telling them what is due to God from them; he then said that they resented in him only what God relates of the people of Lot, and that he said to them what Yusuf said to his brothers, then returned to his house, and the people were glad of the kindness shown them."
  ur: "دوسرے جمعے کو ہادی مسجد گئے، خطبہ دیا، لوگوں کو نصیحت کی اور بتایا کہ اللہ کا ان پر کیا حق ہے؛ پھر کہا کہ تم مجھ سے صرف وہی ناراضی رکھتے ہو جو اللہ نے لوط کی قوم کے بارے میں بیان کی، اور میں تم سے وہی کہتا ہوں جو یوسف نے اپنے بھائیوں سے کہا، پھر وہ اپنے گھر لوٹے اور لوگ ان کے حسنِ سلوک سے خوش ہوئے۔"
  es: "El segundo viernes, al-Hadi salió a la mezquita y predicó, amonestando a la gente y diciéndoles lo que le debían a Dios; luego dijo que solo le reprochaban lo que Dios les contaba sobre la gente de Lot, y que les dijo lo mismo que Yusuf les había dicho a sus hermanos; luego regresó a su casa, y la gente se alegró de la bondad que les había mostrado."
  fr: "Le deuxième vendredi, al-Hadi se rendit à la mosquée et prêcha, exhortant les gens et leur rappelant leurs devoirs envers Dieu; il dit ensuite qu'ils ne lui reprochaient que ce que Dieu racontait au sujet du peuple de Lot, et qu'il leur avait répété ce que Yusuf avait dit à ses frères, puis il retourna chez lui, et les gens furent heureux de la bienveillance dont ils avaient bénéficié."
  tr: "İkinci Cuma günü, El-Hadi camiye çıktı ve insanlara hitap ederek onlara vaaz verdi ve Allah'a olan borçlarını anlattı. Sonra onlara, Allah'ın Lut kavmi hakkında onlara söylediklerinden dolayı kendisine kızdıklarını ve kendisinin de Yusuf'un kardeşlerine anlattıklarını onlara aktardığını söyledi. Ardından evine döndü ve insanlar onun bu iyiliğinden memnun oldular."
  id: "Pada hari Jumat kedua, Al-Hadi pergi ke masjid dan berpidato di hadapan orang-orang, menyampaikan dakwah dan memberitahukan tentang kewajiban mereka kepada Allah. Kemudian dia mengatakan kepada mereka bahwa mereka hanya tersinggung kepadanya karena apa yang telah Allah sampaikan kepada mereka tentang kaum Luth, dan bahwa dia menyampaikan kepada mereka apa yang telah dikatakan Yusuf kepada saudara-saudaranya. Kemudian dia kembali ke rumahnya dan orang-orang merasa senang dengan kebaikannya."
