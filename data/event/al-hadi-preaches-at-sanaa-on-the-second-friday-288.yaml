id: event/al-hadi-preaches-at-sanaa-on-the-second-friday-288
class: event
kind: other
label:
  ar: "الهادي يخطب في صنعاء الجمعة الثانية، سنة 288هـ"
  en: "Al-Hadi preaches at Sana'a on the second Friday, 288 AH"
  ur: "ہادی صنعاء میں دوسرے جمعے کو خطبہ دیتے ہیں، 288ھ"
summary:
  ar: "خرج الهادي في الجمعة الثانية إلى المسجد فخطب الناس ووعظهم وأعلمهم بما يجب لله عليهم، ثم قال لهم إنهم ما نقموا عليه إلا ما حكاه الله عن قوم لوط، وإنه يقول لهم ما قاله يوسف لإخوته، ثم رجع إلى منزله وسُرّ الناس بإحسانه."
  en: "On the second Friday al-Hadi went out to the mosque and preached, admonishing the people and telling them what is due to God from them; he then said that they resented in him only what God relates of the people of Lot, and that he said to them what Yusuf said to his brothers, then returned to his house, and the people were glad of the kindness shown them."
  ur: "دوسرے جمعے کو ہادی مسجد گئے، خطبہ دیا، لوگوں کو نصیحت کی اور بتایا کہ اللہ کا ان پر کیا حق ہے؛ پھر کہا کہ تم مجھ سے صرف وہی ناراضی رکھتے ہو جو اللہ نے لوط کی قوم کے بارے میں بیان کی، اور میں تم سے وہی کہتا ہوں جو یوسف نے اپنے بھائیوں سے کہا، پھر وہ اپنے گھر لوٹے اور لوگ ان کے حسنِ سلوک سے خوش ہوئے۔"
