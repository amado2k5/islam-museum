id: event/killing-of-malik-ibn-nuwayra
class: event
kind: death
label: { ar: "قتل مالك بن نويرة", en: "The Killing of Malik ibn Nuwayra", es: "El asesinato de Malik ibn Nuwayra", fr: "Le meurtre de Malik ibn Nuwayra", ur: "مالک بن نویرہ کا قتل", tr: "Malik ibn Nuwayrah öldürüldü.", id: "Malik bin Nuwayrah terbunuh" }
summary:
  ar: "عند البلاذري: سار خالد بن الوليد بعد بزاخة إلى من بالبطاح والبعوضة من بني تميم فقاتلوه ففضّ جمعهم وقتل مالك بن نويرة أخا متمم بن نويرة — وكان مالك عاملاً للنبي على صدقات بني حنظلة فلما قُبض خلّى ما كان في يده من الفرائض وقال «شأنكم بأموالكم يا بني حنظلة»؛ وقيل إن خالداً لم يلق بالبطاح والبعوضة أحداً ولكنه بث السرايا في بني تميم فكانت منها سرية عليها ضرار بن الأزور الأسدي فلقي ضرار مالكاً فاقتتلوا فأسره وجماعة معه فأتى بهم خالداً فأمر بهم فضربت أعناقهم وتولى ضرار ضرب عنق مالك، ويقال إن مالكاً قال لخالد «إني والله ما ارتددت»، وشهد أبو قتادة الأنصاري أن بني حنظلة وضعوا السلاح وأذّنوا؛ فقال عمر لأبي بكر «بعثت رجلاً يقتل المسلمين ويعذب بالنار»؛ وروي أن متمم بن نويرة دخل على عمر فسأله عن وجده على أخيه فقال «بكيته حولاً حتى أسعدت عيني الذاهبة عيني الصحيحة، وما رأيت ناراً إلا كدت أنقطع لها أسفاً عليه لأنه كان يوقد ناره إلى الصبح مخافة أن يأتيه ضيف فلا يعرف مكانه» ثم وصفه راكباً الفرس الجرور قائداً الجمل الثفال بين المزادتين النضوحين في الليلة القرة وعليه شملة قلوت معنقلاً رمحاً خطياً، ووجهه فلقة قمر؛ فأنشده مرثيته التي مطلعها «وكنا كندماني جذيمة حقبة من الدهر حتى قيل لن يتصدعا» فقال عمر «لو كنت أحسن قول الشعر لرثيت أخي زيداً» فقال متمم «ولا سواء يا أمير المؤمنين، لو كان أخي صُرع مصرع أخيك ما بكيته» فقال عمر «ما عزاني أحد بأحسن مما عزيتني»."
  en: "In al-Baladhuri: after Buzakha Khalid ibn al-Walid marched on those of Banu Tamim at al-Butah and al-Ba'udha, fought them, scattered their gathering and killed Malik ibn Nuwayra, Mutammim ibn Nuwayra's brother — Malik having been the Prophet's agent over the alms of Banu Hanzala, who on the Prophet's death released what dues were in his hands saying 'see to your own wealth, Banu Hanzala'; some report Khalid met no one at al-Butah and al-Ba'udha but sent squadrons among Banu Tamim, one under Dirar ibn al-Azwar al-Asadi, who fought and captured Malik with a group, brought them to Khalid, who ordered their necks struck, Dirar himself taking Malik's; Malik is said to have told Khalid 'by God I did not apostatize', and Abu Qatada al-Ansari testified Banu Hanzala had laid down their arms and called the adhan — whereupon Umar told Abu Bakr 'you sent a man who kills Muslims and tortures with fire'; Mutammim ibn Nuwayra is reported coming to Umar, who asked of his grief for his brother — 'I wept for him a year until my failing eye aided my sound one, and I saw no fire but I nearly perished with sorrow for him, for he used to keep his fire lit till morning lest a guest come and not know its place' — then described him riding the strong horse leading the thirsty camel between two brimming water-skins on the cold night, a cloak on him, bearing a pliant spear, his face a moon's cleft; he recited his elegy beginning 'we were like Jadhima's two drinking-companions for an age until it was said they would never be split', and Umar said 'had I been good at verse I would have elegized my brother Zayd', to which Mutammim answered 'not equal, commander of the faithful — had my brother fallen where yours fell I would not have wept him', and Umar said 'no one has consoled me better than you consoled me'."
  es: "En al-Baladhuri: después de Buzakha, Khalid ibn al-Walid marchó sobre los Banu Tamim en al-Butah y al-Ba'udha, luchó contra ellos, dispersó su reunión y mató a Malik ibn Nuwayra, hermano de Mutammim ibn Nuwayra — Malik había sido el agente del Profeta sobre las limosnas de Banu Hanzala, quien a la muerte del Profeta entregó lo que tenía en sus manos diciendo 'cuídense de su propia riqueza, Banu Hanzala'; algunos informan que Khalid no encontró a nadie en al-Butah y al-Ba'udha sino que envió escuadrones entre los Banu Tamim, uno bajo el mando de Dirar ibn al-Azwar al-Asadi, quien luchó y capturó a Malik con un grupo, los llevó ante Khalid, quien ordenó que les cortaran el cuello, Dirar mismo tomando el de Malik; Se dice que Malik le dijo a Khalid 'por Dios, no apostaté', y Abu Qatada al-Ansari testificó que Banu Hanzala había depuesto las armas y llamado al adhan, tras lo cual Umar le dijo a Abu Bakr 'enviaste a un hombre que mata musulmanes y tortura con fuego'; se informa que Mutammim ibn Nuwayra fue a ver a Umar, quien le preguntó por su dolor por su hermano: 'Lloré por él durante un año hasta que mi ojo débil ayudó al sano, y no vi fuego sin que casi pereciera de pena por él, porque solía mantener su fuego encendido hasta la mañana para que ningún invitado llegara y no supiera dónde estaba', luego lo describió montando el fuerte caballo que guiaba al camello sediento entre dos odres de agua rebosantes en la fría noche, con una capa sobre él, portando una lanza flexible, su rostro como una hendidura de luna; Recitó su elegía comenzando con \"Fuimos como los dos compañeros de bebida de Jadhima durante una era hasta que se dijo que nunca se separarían\", y Umar dijo \"Si hubiera sido bueno en poesía, habría elegía a mi hermano Zayd\", a lo que Mutammim respondió \"No es lo mismo, comandante de los creyentes; si mi hermano hubiera caído donde cayó el tuyo, no lo habría llorado\", y Umar dijo \"Nadie me ha consolado mejor que tú\"."
  fr: "Dans al-Baladhuri: après que Buzakha Khalid ibn al-Walid ait marché sur ceux de Banu Tamim à al-Butah et al-Ba'udha, les a combattus, a dispersé leur rassemblement et a tué Malik ibn Nuwayra, le frère de Mutammim ibn Nuwayra — Malik ayant été l'agent du Prophète pour les aumônes des Banu Hanzala, qui à la mort du Prophète a libéré les sommes qui lui étaient dues en disant « occupez-vous de vos propres biens, Banu Hanzala »; certains rapportent que Khalid n'a rencontré personne à al-Butah et al-Ba'udha mais a envoyé des escadrons parmi les Banu Tamim, dont un sous le commandement de Dirar ibn al-Azwar al-Asadi, qui a combattu et capturé Malik avec un groupe, les a amenés à Khalid, qui a ordonné qu'on leur tranche la nuque, Dirar lui-même prenant celle de Malik; On raconte que Malik aurait dit à Khalid: « Par Dieu, je n'ai pas apostasié », et Abu Qatada al-Ansari a témoigné que les Banu Hanzala avaient déposé les armes et lancé l'appel à la prière (adhan) — sur quoi Umar aurait dit à Abu Bakr: « Tu as envoyé un homme qui tue les musulmans et torture par le feu »; Mutammim ibn Nuwayra serait venu trouver Umar, qui lui aurait demandé ce qu'il pensait de son frère: « J'ai pleuré pour lui pendant un an, jusqu'à ce que ma vue défaillante vienne en aide à ma vue saine, et je n'ai vu aucun feu sans que je ne périsse presque de chagrin pour lui, car il avait l'habitude de garder son feu allumé jusqu'au matin de peur qu'un invité ne vienne et ne sache pas où il se trouvait » — puis il l'a décrit chevauchant le puissant cheval menant le chameau assoiffé entre deux outres d'eau débordantes, par une nuit froide, vêtu d'un manteau, portant une lance souple, le visage comme une fente de lune; Il récita son élégie en commençant par: « Nous étions comme les deux compagnons de beuverie de Jadhima pendant une éternité, jusqu'à ce qu'on dise qu'ils ne seraient jamais séparés », et Umar dit: « Si j'avais été bon en vers, j'aurais fait une élégie pour mon frère Zayd », ce à quoi Mutammim répondit: « Non, pas à la hauteur, commandant des croyants — si mon frère était tombé là où le tien est tombé, je ne l'aurais pas pleuré », et Umar dit: « Personne ne m'a mieux consolé que toi »."
  ur: "البلادوری میں ہے: بزخہ کے بعد خالد بن ولید نے بنو تمیم کے لوگوں پر البطح اور البعودہ پر چڑھائی کی، ان سے جنگ کی، ان کے مجمع کو پراگندہ کیا اور مالک بن نویرہ کو قتل کر دیا، مطمیم بن نویرہ کے بھائی - مالک بنو تمیم کے انبیاء تھے جو بنو المسلمین کے مرنے پر انبیاء کے ذمہ دار تھے۔ اس کے ہاتھ کہہ رہے ہیں 'اپنا مال دیکھو، بنو حنظلہ'۔ بعض رپورٹوں میں کہا گیا ہے کہ خالد البطح اور البعودہ میں کسی سے نہیں ملے لیکن بنو تمیم کے درمیان دستے بھیجے، ایک دستہ دیر ابن الازوار الاسدی کے ماتحت تھا، جس نے ایک گروہ کے ساتھ لڑا اور مالک کو پکڑ لیا، انہیں خالد کے پاس لے آیا، جس نے ان کی گردنیں مارنے کا حکم دیا، دیر نے خود مالک کو لے لیا۔ کہا جاتا ہے کہ مالک نے خالد سے کہا کہ 'خدا کی قسم میں نے مرتد نہیں کیا'، اور ابو قتادہ الانصاری نے گواہی دی کہ بنو حنظلہ نے اپنے ہتھیار رکھ دیے تھے اور اذان دی تھی - جس پر عمر نے ابوبکر سے کہا 'تم نے ایک آدمی بھیجا ہے جو مسلمانوں کو مارتا ہے اور آگ سے اذیت دیتا ہے'۔ مطعم بن نویرہ کا بیان ہے کہ وہ عمر کے پاس آئے، انہوں نے اپنے بھائی کا غم پوچھا: میں ان کے لیے ایک سال روتا رہا یہاں تک کہ میری آنکھ نے میری آواز کو سہارا دیا اور میں نے کوئی آگ نہ دیکھی لیکن تقریباً میں اس کے لیے غم سے ہلاک ہو گیا، کیونکہ وہ صبح تک اپنی آگ جلاتے رہتے تھے کہ کہیں کوئی مہمان آئے اور اس کی جگہ کا علم نہ ہو، پھر بیان کیا کہ وہ دو گھوڑے پر سوار ہو کر پانی کے مضبوط گھوڑے پر سوار ہو رہے تھے۔ سرد رات میں، اس پر ایک چادر، ایک نیزہ برچھی، اس کا چہرہ چاند کی درار؛ اس نے اپنی خوبصورتی کی ابتداء پڑھی 'ہم ایک زمانے کے لئے جدھما کے دو پینے والے ساتھیوں کی طرح تھے یہاں تک کہ یہ کہا جاتا تھا کہ وہ کبھی جدا نہیں ہوں گے'، اور عمر نے کہا 'اگر میں آیت میں اچھا ہوتا تو میں اپنے بھائی زید کو مبعوث کرتا'، جس کے جواب میں مطمیم نے جواب دیا 'برابر نہیں، وفاداروں کے کمانڈر - اگر میرا بھائی وہاں گرا جہاں آپ کے گرے تو ہم نے اسے تسلی نہ دی'، میں اس سے بہتر نہیں کہتا۔ تم نے مجھے تسلی دی۔"
  tr: "El-Baladhuri'ye göre: Halid ibn el-Valid, Buzakha'nın ardından Beni Tamim'den el-Bataah ve el-Baude'dekilerin yanına gitti ve onlar onunla savaştılar. Bunun üzerine Halid, onların topluluğunu dağıttı ve Mutammim ibn Nuwayrah'ın kardeşi Malik ibn Nuwayrah'ı öldürdü. Malik, Beni Hanzalah'ın zekâtından sorumlu Peygamber'in temsilcisiydi ve öldürüldüğünde elindeki farz zekâtı bırakarak, \"Paranız sizindir, Beni Hanzalah\" dedi. Halid'in el-Bataah ve el-Baude'de kimseyle görüşmediği, ancak Beni Tamim arasında baskınlar düzenlediği ve bunlardan birinin Dirar ibn el-Azwar el-Asadi tarafından yönetilen bir baskın olduğu söylenir. Dirar, Malik ile karşılaştı ve savaştılar. Bunun üzerine Dirar, Malik'i ve yanındaki bir grubu esir aldı ve onları Halid'e getirdi. Halid, onların boyunlarına vurulmasını emretti ve Dirar, Malik'in boynuna vurma işini üstlendi. Malik'in Halid'e, \"Allah'a yemin ederim ki, ben dinden dönmedim\" dediği rivayet edilir. Ebu Katade el-Ensari, Beni Hanzalah'ın silahlarını bırakıp ezan okuduğuna şahitlik etmiştir. Ömer, Ebu Bekir'e, \"Müslümanları öldürmek ve ateşle işkence etmek için bir adam gönderdin\" demiştir. Mutammim bin Nuveyra'nın Ömer'in yanına girdiği ve Ömer'in ona kardeşinin kaybından duyduğu üzüntüyü sorduğu rivayet edilir. Mutammim, \"Bir yıl boyunca onun için ağladım, ta ki kaybettiğim gözüm sağlıklı gözümle teselli bulana kadar. Ateşi her gördüğümde neredeyse onun için kederden parçalanıyordum, çünkü bir misafir gelmesinden ve nerede olduğunu bilmemesinden korkarak sabaha kadar ateşini yakardı.\" demiştir. Sonra onu, soğuk bir gecede, iki taşan su tulumu arasında ağır deveyi çeken hızlı ata binerken, sade bir pelerin giymiş, mızrak taşıyan ve yüzü ay dilimi gibi olan bir halde tarif etmiştir. Muhammed, \"Bir süre boyunca Cedimâm'ın iki arkadaşı gibiydik, ta ki asla ayrılmayacakları söylenene kadar\" diye başlayan ağıtını okudu. Ömer, \"Şiir yazmakta daha iyi olsaydım, kardeşim Zeyd için bir ağıt yazardım\" dedi. Mutammim, \"Ey Müminlerin Emiri, aynı şey değil. Kardeşim senin kardeşin gibi öldürülseydi, onun için ağlamazdım\" dedi. Ömer, \"Senden daha iyi teselli eden olmadı\" dedi."
  id: "Menurut Al-Baladhuri: Khalid ibn al-Walid mengikuti Buzakha menuju ke daerah al-Bataah dan al-Ba’udah yang dihuni oleh Bani Tamim, dan mereka memeranginya, sehingga ia membubarkan perkumpulan mereka dan membunuh Malik ibn Nuwayrah, saudara Mutammim ibn Nuwayrah. Malik adalah utusan Nabi yang bertanggung jawab atas zakat Bani Hanzalah, dan ketika ia terbunuh, ia meninggalkan zakat wajib yang ada di tangannya dan berkata, “Uang kalian adalah milik kalian, Bani Hanzalah.” Dikatakan bahwa Khalid tidak bertemu siapa pun di al-Bataah dan al-Ba’udah, tetapi ia mengirimkan serangan ke Bani Tamim, dan salah satunya adalah serangan yang dipimpin oleh Dirar ibn al-Azwar al-Asadi. Dirar bertemu Malik, dan mereka bertarung, lalu Dirar menangkap Malik dan sekelompok orang bersamanya, dan membawa mereka kepada Khalid. Khalid memerintahkan agar leher mereka dipenggal, dan Dirar bertugas memenggal leher Malik. Dikatakan bahwa Malik berkata kepada Khalid, “Demi Allah, aku tidak murtad.” Abu Qatada al-Ansari bersaksi bahwa Bani Hanzalah meletakkan senjata mereka dan mengumandangkan azan. Umar berkata kepada Abu Bakr, “Engkau mengirim seorang pria untuk membunuh kaum Muslimin dan menyiksa mereka dengan api.” Diriwayatkan bahwa Mutammim bin Nuwayrah menemui Umar, yang menanyakan tentang kesedihannya atas kematian saudaranya. Umar berkata, “Aku menangisinya selama setahun hingga mataku yang hilang diberkati oleh mataku yang sehat. Aku tidak pernah melihat api tanpa hampir hancur karena kesedihan atas kematiannya, karena ia biasa menyalakan apinya hingga pagi hari, karena takut tamu akan datang dan ia tidak tahu di mana ia berada.” Kemudian ia menggambarkan Zayd menunggang kuda yang cepat, menuntun unta yang berat di antara dua kantung air yang meluap di malam yang dingin, mengenakan jubah sederhana, membawa tombak, dan wajahnya seperti sepotong bulan. Ia membacakan eleginya, yang pembukaannya berbunyi, “Kita seperti dua sahabat Jadhima untuk suatu masa, sampai dikatakan bahwa mereka tidak akan pernah berpisah.” Umar berkata, “Seandainya aku lebih mahir dalam menulis puisi, aku pasti akan menulis elegi untuk saudaraku Zayd.” Mutammim berkata, “Itu tidak sama, wahai Amirul Mukminin. Seandainya saudaraku terbunuh seperti saudaramu, aku tidak akan menangisinya.” Umar berkata, “Tidak ada yang menghiburku lebih baik daripada engkau.”"
