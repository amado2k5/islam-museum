label:
  ar: "المزي يتولى مشيخة النورية بعد ابن أبي الفتح، أوائل ٧٤٠هـ"
  en: "Al-Mizzi takes the Nuriyya shaykhhood after Ibn Abi al-Fath, early 740/1339"
  ur: "ابن ابی الفتح کے بعد مزی کا مشیختِ نوریہ سنبھالنا، 740ھ/1339ء کے اوائل میں"
summary:
  ar: "توفي الشيخ ابن أبي الفتح بكرة يوم الأحد الرابع من ذي الحجة سنة تسع وثلاثين وسبعمائة عن أربع وسبعين سنة ونصف، «وولي بعده مشيخة النورية شيخنا المزي، ومشيخة القوصية ابن رافع، ومشيخة النفيسية العبد» {cite:tarikh-islam-dhahabi p. 459}."
  en: "The shaykh Ibn Abi al-Fath died on the morning of Sunday 4 Dhu al-Hijja 739 at the age of seventy-four and a half, and 'after him our shaykh al-Mizzi took the shaykhhood of the Nuriyya, Ibn Raf'a that of the Qawsiyya, and al-Abd that of the Nafisiyya' {cite:tarikh-islam-dhahabi p. 459}."
  ur: "شیخ ابن ابی الفتح اتوار 4 ذی الحجہ 739ھ کی صبح چوہتر برس کی عمر میں فوت ہوئے، اور «ان کے بعد ہمارے شیخ مزی نے مشیختِ نوریہ، ابن رافع نے قوصیہ اور عبد نے نفیسیہ کی مشیخت سنبھالی» {cite:tarikh-islam-dhahabi p. 459}۔"
