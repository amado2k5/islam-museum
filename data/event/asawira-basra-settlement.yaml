label: { ar: "نزول الأساورة البصرة", en: "The Asawira's Settlement at Basra" }
summary:
  ar: "شهد الأساورة مع أبي موسى حصار تستر فلم يظهر منهم نكاية فقال لسياه يا عون ما أنت وأصحابك كما كنا نظن فقال له إنه ليست بصائرنا كبصائركم ولا لنا فيكم حرم تخاف عليها ونقاتل وإنما دخلنا هذا الدين في بدء أمرنا تعوذاً وإن كان الله رزقاً خيراً كثيراً ثم فرض لهم في شرف العطاء فلما صاروا إلى البصرة سألوا أي الأحياء أقرب نسباً إلى رسول الله فقيل بنو تميم وكانوا على أن يحالفوا الأزد فتركوهم وحالفوا بني تميم وسيدهم يومئذ الأحنف بن قيس ثم خطت لهم خططهم فنزلوا وحفروا نهرهم وهو يعرف بنهر الأساورة وأراد شيرويه أن ينزل في بكر بن وائل فأبى سياه فنزلوا في بني تميم وانضم إليهم السيايجة والزط فتنازعتهم بنو تميم فرغبوا فيهم فصارت الأساورة في بني سعد والزط والسيايجة في بني حنظلة فأقاموا يقاتلون المشركين وخرجوا مع ابن عامر إلى خراسان."
  en: "At Tustar's siege the asawira showed no treachery; Abu Musa told Siyah 'you are not what we supposed' — Siyah answered 'our insight is not yours, and we hold no sacrality over you to fear for and fight: we entered this religion at its dawn seeking refuge, and it may be God's generous provision'. Granted top-tier stipends, they asked at Basra which clan was nearest the Prophet's kin — 'Banu Tamim' — so they allied them (the Azd having turned them away), took their plots, and dug the canal still called Nahr al-Asawira. Shirawayh had wished Bakr ibn Wa'il; Siyah refused, they settled with Tamim; the Sayabija and Zutt joined and Tamim contested for them — the asawira ending in Banu Sa'd, the Zutt and Sayabija in Banu Hanzala — fighting the polytheists and riding with Ibn Amir to Khurasan."
