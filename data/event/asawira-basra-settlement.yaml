label: { ar: "نزول الأساورة البصرة", en: "The Asawira's Settlement at Basra", fr: "L'installation des Asawira à Bassora", es: "El asentamiento de los Asawira en Basora", ur: "بصرہ میں اساویرہ کی بستی", tr: "Basra bileziklerinin inişi", id: "Turunnya gelang-gelang Basra" }
summary:
  ar: "شهد الأساورة مع أبي موسى حصار تستر فلم يظهر منهم نكاية فقال لسياه يا عون ما أنت وأصحابك كما كنا نظن فقال له إنه ليست بصائرنا كبصائركم ولا لنا فيكم حرم تخاف عليها ونقاتل وإنما دخلنا هذا الدين في بدء أمرنا تعوذاً وإن كان الله رزقاً خيراً كثيراً ثم فرض لهم في شرف العطاء فلما صاروا إلى البصرة سألوا أي الأحياء أقرب نسباً إلى رسول الله فقيل بنو تميم وكانوا على أن يحالفوا الأزد فتركوهم وحالفوا بني تميم وسيدهم يومئذ الأحنف بن قيس ثم خطت لهم خططهم فنزلوا وحفروا نهرهم وهو يعرف بنهر الأساورة وأراد شيرويه أن ينزل في بكر بن وائل فأبى سياه فنزلوا في بني تميم وانضم إليهم السيايجة والزط فتنازعتهم بنو تميم فرغبوا فيهم فصارت الأساورة في بني سعد والزط والسيايجة في بني حنظلة فأقاموا يقاتلون المشركين وخرجوا مع ابن عامر إلى خراسان."
  en: "At Tustar's siege the asawira showed no treachery; Abu Musa told Siyah 'you are not what we supposed' — Siyah answered 'our insight is not yours, and we hold no sacrality over you to fear for and fight: we entered this religion at its dawn seeking refuge, and it may be God's generous provision'. Granted top-tier stipends, they asked at Basra which clan was nearest the Prophet's kin — 'Banu Tamim' — so they allied them (the Azd having turned them away), took their plots, and dug the canal still called Nahr al-Asawira. Shirawayh had wished Bakr ibn Wa'il; Siyah refused, they settled with Tamim; the Sayabija and Zutt joined and Tamim contested for them — the asawira ending in Banu Sa'd, the Zutt and Sayabija in Banu Hanzala — fighting the polytheists and riding with Ibn Amir to Khurasan."
  fr: "Au siège de Tustar, les asawira ne montrèrent aucune trahison ; Abu Musa dit à Siyah : « vous n'êtes pas ce que nous pensions » ; Siyah répondit : « notre discernement n'est pas le vôtre, et nous n'avons envers vous aucun caractère sacré pour lequel craindre et combattre : nous sommes entrés dans cette religion à son aube en y cherchant refuge, et ce peut être une généreuse subsistance de Dieu ». Dotés de pensions du plus haut rang, ils demandèrent à Bassora quel clan était le plus proche de la parenté du Prophète, « les Banu Tamim », et s'allièrent donc à eux (les Azd les ayant repoussés), reçurent leurs parcelles et creusèrent le canal encore appelé Nahr al-Asawira. Shirawayh aurait souhaité les Bakr ibn Wa'il ; Siyah refusa et ils s'établirent avec les Tamim ; les Sayabija et les Zutt les rejoignirent et les Tamim se disputèrent leur rattachement, les asawira finissant chez les Banu Sa'd, les Zutt et les Sayabija chez les Banu Hanzala ; ils combattirent les polythéistes et partirent avec Ibn Amir au Khorasan."
  es: "En el asedio de Tustar, los asawira no mostraron traición; Abu Musa le dijo a Siyah: «No sois lo que creíamos». Siyah respondió: «No compartimos vuestra visión, y no tenemos ninguna sacralidad que temer o por la que luchar: entramos en esta religión en sus albores buscando refugio, y puede que sea la generosa provisión de Dios». Tras recibir estipendios de primer nivel, preguntaron en Basora qué clan era el más cercano a los parientes del Profeta: «Banu Tamim». Así que se aliaron con ellos (ya que Azd los había rechazado), tomaron sus parcelas y excavaron el canal que aún se llama Nahr al-Asawira. Shirawayh había deseado a Bakr ibn Wa'il; Siyah se negó, y se conformaron con Tamim. Sayabija y Zutt se unieron y Tamim luchó por ellos —los asawira terminaron en Banu Sa'd, Zutt y Sayabija en Banu Hanzala— luchando contra los politeístas y cabalgando con Ibn Amir a Jorasán."
  ur: "تستار کے محاصرے میں اساویرا نے کوئی غداری نہیں دکھائی۔ ابو موسیٰ نے سیّا سے کہا 'تم وہ نہیں ہو جو ہم سمجھ رہے تھے' - سیّا نے جواب دیا 'ہماری بصیرت تمہاری نہیں ہے، اور ہم تم سے ڈرنے اور لڑنے کے لیے کوئی تقدیس نہیں رکھتے: ہم اس دین میں طلوع فجر کے وقت پناہ کی تلاش میں داخل ہوئے تھے، اور ہوسکتا ہے کہ یہ خدا کا فراخ رزق ہو۔' اعلیٰ درجے کے وظیفے دیے گئے، انہوں نے بصرہ میں پوچھا کہ کون سا قبیلہ رسول اللہ کے قرابت دار 'بنو تمیم' کا سب سے قریب ہے، تو انہوں نے ان کے ساتھ اتحاد کیا ⁦(ازد نے انہیں پھیر دیا)⁩، ان کے پلاٹ لے لیے، اور نہر کھودی جسے اب بھی نہر العسویرہ کہتے ہیں۔ شیراویہ نے بکر بن وائل کی خواہش کی تھی۔ صیہ نے انکار کر دیا، تمیم کے ساتھ صلح کر لی۔ صابیجہ اور زت شامل ہوئے اور تمیم نے ان کے لیے مقابلہ کیا - بنو سعد میں ختم ہونے والا عسویرہ، بنو حنظلہ میں زط اور سیابیجہ - مشرکین سے لڑنا اور ابن عامر کے ساتھ خراسان تک سوار ہوئے۔"
  tr: "Asavira kabilesi, Ebu Musa ile birlikte Tustar kuşatmasına şahit oldu, ancak onlardan hiçbir zarar gelmedi. Ebu Musa, Siyah'a, \"Ey Awn, sen ve arkadaşların sandığımız gibi değilsiniz\" dedi. Ebu Musa ona, \"Bizim anlayışımız sizin anlayışınız gibi değil ve aranızda sizin korktuğunuz ve savaştığınız hiçbir kadın yok. Aksine, biz bu dine, Allah bize büyük bir rızık vermiş olmasına rağmen, korunmak için girdik\" dedi. Sonra onlara verme şerefini şart koştu. Basra'ya geldiklerinde, hangi kabilenin Allah Resulü'ne soy bakımından en yakın olduğunu sordular ve \"Benu Tamim\" denildi. Azd kabilesiyle ittifak kuracaklardı, ancak onları bırakıp Beni Tamim kabilesiyle ittifak kurdular ve o zamanki liderleri Ahnaf bin Kays idi. Sonra onlar için planlar yapıldı, yerleştiler ve Asavira Nehri olarak bilinen nehirlerini kazdılar. Şiraveyh, Bakr bin Veel'e yerleşmek istedi, ancak Siyah bunu reddetti, bu yüzden Beni Tamim'e yerleştiler ve Sayayija ile Zütt de onlara katıldı. Beni Tamim aralarında anlaşmazlık çıktı, bu yüzden onları istediler, böylece Asavira Beni Saad'a, Zütt ve Sayayija Beni Hanzala'ya katıldı. Çok tanrılılarla savaşmaya devam ettiler ve İbn Amir ile birlikte Horasan'a gittiler."
  id: "Kaum Asawira menyaksikan pengepungan Tustar bersama Abu Musa, namun tidak ada bahaya yang menimpa mereka. Beliau berkata kepada Siyah, “Wahai Awn, engkau dan para sahabatmu tidak seperti yang kami sangka.” Siyah menjawab, “Wawasan kami tidak seperti wawasan kalian, dan di antara kalian tidak ada wanita yang kalian takuti dan perangi. Sebaliknya, kami memeluk agama ini sejak awal untuk perlindungan, meskipun Allah telah menyediakan rezeki yang sangat baik bagi kami.” Kemudian beliau menetapkan bagi mereka kehormatan untuk memberi. Ketika mereka sampai di Basra, mereka bertanya suku mana yang paling dekat garis keturunannya dengan Rasulullah, dan dijawab, “Bannu Tamim.” Mereka hendak bersekutu dengan Azd, tetapi mereka meninggalkan Azd dan bersekutu dengan Banu Tamim, dan pemimpin mereka saat itu adalah Al-Ahnaf bin Qais. Kemudian rencana mereka disusun, sehingga mereka menetap dan menggali sungai mereka, yang dikenal sebagai Sungai Asawira. Shirawayh ingin menetap di Bakr bin Wael, tetapi Siyah menolak, sehingga mereka menetap di Banu Tamim, dan Sayayija serta Zutt bergabung dengan mereka. Banu Tamim berselisih memperebutkan mereka, sehingga mereka menginginkan mereka, maka Asawira bergabung dengan Banu Saad, Zutt, dan Sayayija dengan Banu Hanzala. Mereka terus memerangi kaum musyrik dan pergi bersama Ibnu Amir ke Khorasan."
