label: { ar: "فتح أطرابلس", en: "The Conquest of Tripoli" }
summary:
  ar: "عند البلاذري عن علي بن أبي طلحة: سار عمرو بن العاص حتى نزل أطرابلس في سنة اثنتين وعشرين فقُوتل ثم افتتحها عنوة وأصاب بها أحمال بزّيون كثيرة مع تجار من تجارها فباعه وقسم ثمنه بين المسلمين وكتب إلى عمر بن الخطاب إنا قد بلغنا أطرابلس وبينها وبين إفريقية تسعة أيام فإن رأى أمير المؤمنين أن يأذن لنا في غزوها فعل، فكتب إليه ينهاه عنها ويقول: ما هي بإفريقية ولكنها مفرقة غادرة مغدور بها — وذلك أن أهلها كانوا يؤدّون إلى ملك الروم شيئاً فكانوا يغدرون به كثيراً وكان ملك الأندلس صالحهم ثم غدر بهم وكان خبرهم قد بلغ عمر."
  en: "In al-Baladhuri on Ali ibn Abi Talha's report: Amr ibn al-As marched until he camped at Tripoli in year 22 — it was fought for, then he opened it by force, seizing there many loads of baziyun cloth with some of its merchants, which he sold, dividing the price among the Muslims; and he wrote to Umar ibn al-Khattab 'we have reached Tripoli, and between it and Ifriqiya are nine days — if the Commander of the Faithful sees fit to give us leave to raid it, let him act', and Umar wrote back forbidding it, saying 'it is not Ifriqiya, but a schismatic, treacherous land oft betrayed' — its people paying Rome's king then betraying him often, and Andalus's king having compounded with them then betrayed them, news of which had reached Umar."
