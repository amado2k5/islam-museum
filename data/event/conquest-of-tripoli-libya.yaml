kind: conquest
label: { ar: "فتح أطرابلس", en: "The Conquest of Tripoli", es: "La conquista de Trípoli", fr: "La conquête de Tripoli", ur: "طرابلس کی فتح", tr: "Trablus'un fethi", id: "Penaklukan Tripoli" }
summary:
  ar: "عند البلاذري عن علي بن أبي طلحة: سار عمرو بن العاص حتى نزل أطرابلس في سنة اثنتين وعشرين فقُوتل ثم افتتحها عنوة وأصاب بها أحمال بزّيون كثيرة مع تجار من تجارها فباعه وقسم ثمنه بين المسلمين وكتب إلى عمر بن الخطاب إنا قد بلغنا أطرابلس وبينها وبين إفريقية تسعة أيام فإن رأى أمير المؤمنين أن يأذن لنا في غزوها فعل، فكتب إليه ينهاه عنها ويقول: ما هي بإفريقية ولكنها مفرقة غادرة مغدور بها — وذلك أن أهلها كانوا يؤدّون إلى ملك الروم شيئاً فكانوا يغدرون به كثيراً وكان ملك الأندلس صالحهم ثم غدر بهم وكان خبرهم قد بلغ عمر."
  en: "In al-Baladhuri on Ali ibn Abi Talha's report: Amr ibn al-As marched until he camped at Tripoli in year 22 — it was fought for, then he opened it by force, seizing there many loads of baziyun cloth with some of its merchants, which he sold, dividing the price among the Muslims; and he wrote to Umar ibn al-Khattab 'we have reached Tripoli, and between it and Ifriqiya are nine days — if the Commander of the Faithful sees fit to give us leave to raid it, let him act', and Umar wrote back forbidding it, saying 'it is not Ifriqiya, but a schismatic, treacherous land oft betrayed' — its people paying Rome's king then betraying him often, and Andalus's king having compounded with them then betrayed them, news of which had reached Umar."
  es: "En al-Baladhuri sobre el informe de Ali ibn Abi Talha: Amr ibn al-As marchó hasta acampar en Trípoli en el año 22; se luchó por ella, luego la abrió por la fuerza, apoderándose allí de muchas cargas de tela baziyun con algunos de sus comerciantes, que vendió, dividiendo el precio entre los musulmanes; y escribió a Umar ibn al-Khattab 'hemos llegado a Trípoli, y entre ella e Ifriqiya hay nueve días; si el Comandante de los Creyentes considera oportuno darnos permiso para saquearla, que actúe', y Umar respondió prohibiéndolo, diciendo 'no es Ifriqiya, sino una tierra cismática y traicionera a menudo', su gente pagaba al rey de Roma y luego lo traicionaba a menudo, y el rey de Al-Ándalus, habiendo llegado a un acuerdo con ellos, los traicionó, noticias de las cuales llegaron a Umar."
  fr: "Dans al-Baladhuri, d'après le récit d'Ali ibn Abi Talha: Amr ibn al-As marcha jusqu'à Tripoli, où il campa en l'an 22. La ville fut conquise de haute lutte, puis il la prit par la force, s'emparant de nombreuses cargaisons de baziyun (étoffes de baziyun) avec certains de ses marchands, qu'il vendit en partageant le prix entre les musulmans. Il écrivit à Umar ibn al-Khattab: « Nous avons atteint Tripoli, et il y a neuf jours de marche entre cette ville et l'Ifriqiya. Si le Commandeur des Croyants juge bon de nous autoriser à la piller, qu'il agisse. » Umar répondit en l'interdisant, disant: « Ce n'est pas l'Ifriqiya, mais une terre schismatique et perfide, souvent trahie. Ses habitants payaient le roi de Rome puis le trahissaient fréquemment, et le roi d'Andalousie, après avoir conclu un pacte avec eux, les trahissait à son tour. Umar avait eu vent de ces faits. »"
  ur: "علی بن ابی طلحہ کی رپورٹ پر البلادھوری میں ہے: عمرو بن العاص نے مارچ کیا یہاں تک کہ اس نے 22 میں طرابلس میں ڈیرے ڈالے - اس کے لیے لڑا گیا، پھر اس نے اسے زبردستی کھول دیا، اور وہاں پر بہت سارے بزیون کپڑوں کو اس کے کچھ تاجروں کے ساتھ قبضے میں لے لیا، جسے اس نے مسلمانوں میں بانٹ کر بیچ دیا۔ اور اس نے عمر بن الخطاب کو لکھا کہ ہم طرابلس پہنچ گئے ہیں اور اس کے اور عفریقیہ کے درمیان نو دن کا فاصلہ ہے - اگر وفاداروں کا کمانڈر ہمیں اس پر چھاپہ مارنے کی اجازت دینا مناسب سمجھے تو وہ عمل کرے، اور عمر نے اس سے منع کرتے ہوئے لکھا کہ یہ عفریقیہ نہیں ہے، بلکہ ایک متعصب، خیانت کرنے والا ہے - پھر اس کے لوگوں کو معاوضہ دیا جائے گا۔ اس کے ساتھ اکثر غداری کرتے رہے اور اندلس کے بادشاہ نے ان کے ساتھ گٹھ جوڑ کر کے ان کے ساتھ غداری کی جس کی خبر عمر تک پہنچ گئی۔"
  tr: "Al-Baladhuri, Ali ibn Abi Talha'dan rivayetle şöyle demiştir: Amr ibn al-Aas, yirmi iki yılında Trablus'a kadar yürüdü ve orada savaşa girdi. Sonra şehri zorla ele geçirdi ve tüccarlarından birçok yük mal aldı. Bunları sattı ve gelirini Müslümanlar arasında paylaştırdı. Ömer ibn al-Khattab'a şöyle yazdı: \"Trablus'a ulaştık ve Trablus ile Afrika arasında dokuz günlük mesafe var. Müminlerin Komutanı bize Trablus'u işgal etmemize izin vermeyi uygun görürse, bunu yapsın.\" Bunun üzerine Ömer ona Trablus'u işgal etmesini yasaklayan ve şöyle diyen bir mektup yazdı: \"Trablus Afrika değil, bölünmüş, hain ve ihanete uğramış bir yerdir; çünkü halkı Roma kralına bir miktar para ödüyor ve ona çokça ihanet ediyordu. Endülüs kralı onlarla barış yaptı, sonra onlara ihanet etti ve bu haber Ömer'e ulaştı.\""
  id: "Al-Baladhuri, berdasarkan riwayat Ali ibn Abi Talha, berkata: Amr ibn al-Aas berbaris hingga mencapai Tripoli pada tahun 22, dan ia diperangi, kemudian ia menaklukkannya dengan kekerasan dan merampas banyak barang dagangan dari para pedagangnya, lalu ia menjualnya dan membagi hasilnya di antara kaum Muslimin. Ia menulis kepada Umar ibn al-Khattab: Kami telah mencapai Tripoli, dan jarak antara Tripoli dan Afrika hanya sembilan hari. Jika Amirul Mukminin berkenan mengizinkan kami untuk menyerangnya, maka ia harus melakukannya. Maka ia menulis surat kepadanya melarangnya dan berkata: Itu bukanlah Afrika, tetapi tempat yang terpecah belah, penuh tipu daya, dan dikhianati — karena penduduknya biasa membayar sesuatu kepada raja Romawi, dan mereka sering mengkhianatinya. Dan raja Andalusia berdamai dengan mereka, kemudian ia mengkhianati mereka, dan kabar tentang mereka telah sampai kepada Umar."
