id: event/fitna-points-to-the-east
class: event
kind: other
label:
  ar: الفتنة من حيث يطلع قرن الشيطان
  en: The fitna rises where the shaytan horn rises
  ur: فتنہ وہاں سے اٹھتا ہے جہاں شیطان کی سینگ طلوع ہوتی ہے
summary:
  ar: 'عن عبد الله بن عمر أنه رأى رسول الله يشير إلى المشرق ويقول: ها إن الفتنة هاهنا إن الفتنة هاهنا من حيث يطلع قرن الشيطان {cite:muwatta-maruf-1997} [[passage/muwatta-31-2794|الموطأ 2794]].'
  en: 'Abdullah ibn Umar said: I saw the Messenger of God pointing to the east and saying: here is the fitna, here is the fitna — from where the shaytan horn rises {cite:muwatta-maruf-1997} [[passage/muwatta-31-2794|Muwatta
    2794]].'
  ur: 'عبد اللہ بن عمر نے کہا: میں نے رسول اللہ کو مشرق کی طرف اشارہ کرتے دیکھا اور کہتے ہوئے: دیکھو، فتنے یہیں ہیں، یہیں ہیں — جہاں سے شیطان کی سینگ طلوع ہوتی ہے {cite:muwatta-maruf-1997} [[passage/muwatta-31-2794|موطأ
    2794]]۔'
