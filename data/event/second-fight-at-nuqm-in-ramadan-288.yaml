id: event/second-fight-at-nuqm-in-ramadan-288
class: event
kind: other
label:
  ar: "القتال الثاني عند نقم في رمضان، سنة 288هـ"
  en: "The second fight at Nuqm in Ramadan, 288 AH"
  ur: "رمضان میں نقم کے پاس دوسری لڑائی، 288ھ"
  es: "La segunda batalla en Nuqm durante el Ramadán del año 288 de la Hégira."
  fr: "Deuxième combat à Nuqm durant le Ramadan 288 AH"
  tr: "İkinci savaş Hicri 288 yılının Ramazan ayında Naqam'da gerçekleşti."
  id: "Pertempuran kedua terjadi di Naqam pada bulan Ramadan tahun 288 Hijriah."
summary:
  ar: "جمع القوم عساكرهم في رمضان وأقبلوا إلى موضعهم الأول ودخل منهم جيش كثيف القرية من درب القُطيع، فوجه الهادي ابنه أبا القاسم في قطعة من العسكر وأرسل فرقة من درب الجبانة وخرج بنفسه، فأخرجهم من القرية إلى جبل نقم وركد القتال إلى قرب الليل ثم هُزموا."
  en: "In Ramadan the men gathered their armies and came back to their first position, and a large force entered the village by the Darb al-Qutay'; al-Hadi sent his son Abu al-Qasim with a part of the army, sent another party by the Darb al-Jabbana and went out himself, and drove them from the village to the mountain of Nuqm; the fighting held until near night and they were then routed."
  ur: "رمضان میں مخالفین نے اپنے لشکر جمع کیے اور اپنی پہلی جگہ کی طرف آئے، اور ایک بھاری دستہ درب القطیع سے بستی میں داخل ہوا؛ ہادی نے اپنے بیٹے ابو القاسم کو لشکر کے ایک حصے کے ساتھ بھیجا، ایک دستہ درب الجبانہ سے روانہ کیا اور خود نکلے، اور انہیں بستی سے جبلِ نقم تک ہٹا دیا؛ لڑائی رات کے قریب تک رکی رہی پھر وہ شکست کھا گئے۔"
  es: "En Ramadán, los hombres reunieron sus ejércitos y regresaron a su posición inicial, y una gran fuerza entró en la aldea por el Darb al-Qutay'; al-Hadi envió a su hijo Abu al-Qasim con una parte del ejército, envió otro grupo por el Darb al-Jabbana y salió él mismo, y los expulsó de la aldea hasta la montaña de Nuqm; la lucha se prolongó hasta casi la noche y entonces fueron derrotados."
  fr: "Durant le Ramadan, les hommes rassemblèrent leurs armées et revinrent à leur première position, et une importante force entra dans le village par le Darb al-Qutay'; al-Hadi envoya son fils Abu al-Qasim avec une partie de l'armée, envoya un autre groupe par le Darb al-Jabbana et sortit lui-même, et les repoussa du village jusqu'à la montagne de Nuqm; les combats se poursuivirent jusqu'à la nuit tombée et ils furent alors mis en déroute."
  tr: "Halk Ramazan ayında birliklerini topladı ve ilk mevzilerine geldi. Darb el-Kuteya'dan büyük bir ordu köye girdi. El-Hadi, oğlu Ebu el-Kâsım'ı bir birlikle gönderdi, kendisi de Darb el-Cabana'dan bir grup gönderdi ve dışarı çıktı. Onları köyden Jabal Naqm'a kadar sürdü ve çatışmalar akşama kadar dindi, sonra da yenilgiye uğradılar."
  id: "Orang-orang mengumpulkan pasukan mereka di bulan Ramadan dan mengambil posisi pertama mereka. Pasukan besar memasuki desa dari Darb al-Qutay’a. Al-Hadi mengirim putranya, Abu al-Qasim, dengan satu detasemen pasukan dan mengirim sekelompok pasukan dari Darb al-Jabana dan ia sendiri keluar. Ia mengusir mereka dari desa ke Jabal Naqm dan pertempuran mereda hingga menjelang malam, kemudian mereka dikalahkan."
