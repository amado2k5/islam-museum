id: event/mustakfi-blinding-334
class: event
kind: mutiny
label: { ar: "خلع معز الدولة المستكفي وسمله", en: "Mu'izz al-Dawla deposes and blinds al-Mustakfi", ur: "معز الدولہ کے ہاتھوں مستکفی کی معزولی اور نابینا کیا جانا" }
summary:
  ar: "دخل أحمد بن بويه بغداد فاختفى ابن شيرزاد ودخل دار الخلافة فوقف بين يدي الخليفة فخلع عليه ولقبه معز الدولة ولقب أخاه علياً عماد الدولة وأخاهما الحسن ركن الدولة وضربت ألقابهم على السكة ولقب المستكفي نفسه إمام الحق، ثم قوي أمر معز الدولة وحجر على الخليفة وقرر له كل يوم برسم النفقة خمسة آلاف درهم فقط وهو أول من ملك العراق من الديلم وأول من أظهر السعاة ببغداد وأغوى المصارعين والسباحين حتى صار السباح يسبح وعلى يده كانون فوقه قدرة فيسبح حتى ينضج اللحم، ثم تخيل من المستكفي فدخل عليه في جمادى الآخرة سنة أربع وثلاثين فتقدم اثنان من الديلم إلى الخليفة فمد يده إليهما ظناً أنهما يريدان تقبيلها فجذباه من السرير وطرحاه إلى الأرض وجراه بعمامته وهجم الديلم دار الخلافة إلى الحرم ونهبوها فلم يبق فيها شيء وساقوا المستكفي ماشياً وخلع وسملت عيناه يومئذ وكانت خلافته سنة وأربعة أشهر وأحضروا الفضل بن المقتدر فبايعوه فجاء ابن عمه المستكفي فسلم عليه بالخلافة {cite:tarikh-khulafa-minhaj-1434 p. 613-614}. وعند ابن الأثير وكان سبب خلعه أن أمه القهرمانة صنعت دعوة عظيمة حضرها جماعة من قواد الديلم والأتراك فاتهموها عند معز الدولة أنها فعلت ذلك لتأخذ عليهم البيعة للمستكفى ويعزلوا معز الدولة، فلما مضى اثنان وعشرون يوماً من جمادى الآخرة سنة 334هـ حضر معز الدولة والناس عند الخليفة وحضر رجلان من نقباء الديلم فتناولا يد المستكفى فظن أنهما يريدان تقبيلها فهشّ إليهما فجذباه عن سريره وجعلا عمامته في حلقه وساقاه ماشياً إلى دار معز الدولة فاعتُقل بها ونُهبت دار الخلافة حتى لم يبق بها شيء وكانت مدة خلافته سنة وأربعة أشهر، ولما بويع المطيع لله سُلم إليه المستكفى فسمله وأعماه وبقي محبوساً حتى مات في ربيع الأول سنة 338هـ {cite:kamil-ibn-al-athir p. 337}"
  en: "Ahmad ibn Buya entered Baghdad, stood before the caliph and was invested as Mu'izz al-Dawla — his brothers becoming Imad and Rukn al-Dawla, their titles struck on the coinage, while al-Mustakfi styled himself 'Imam al-Haqq'. Mu'izz al-Dawla, the first Daylamite to hold Iraq, sequestered the caliph on five thousand dirhams a day and made wrestling and swimming the city's craze — swimmers cooking meat in pots on their arms. In Jumada II 334 two Daylamites came to the caliph — he offered his hand for the kiss, they dragged him from the throne by his turban to the ground, the soldiery sacked the harem bare, and he was deposed and blinded that day, after sixteen months; they brought al-Fadl ibn al-Muqtadir, and the blinded Mustakfi saluted him as caliph {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
