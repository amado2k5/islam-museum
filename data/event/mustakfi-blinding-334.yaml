summary:
  ar: "دخل أحمد بن بويه بغداد فاختفى ابن شيرزاد ودخل دار الخلافة فوقف بين يدي الخليفة فخلع عليه ولقبه معز الدولة ولقب أخاه علياً عماد الدولة وأخاهما الحسن ركن الدولة وضربت ألقابهم على السكة ولقب المستكفي نفسه إمام الحق، ثم قوي أمر معز الدولة وحجر على الخليفة وقرر له كل يوم برسم النفقة خمسة آلاف درهم فقط وهو أول من ملك العراق من الديلم وأول من أظهر السعاة ببغداد وأغوى المصارعين والسباحين حتى صار السباح يسبح وعلى يده كانون فوقه قدرة فيسبح حتى ينضج اللحم، ثم تخيل من المستكفي فدخل عليه في جمادى الآخرة سنة أربع وثلاثين فتقدم اثنان من الديلم إلى الخليفة فمد يده إليهما ظناً أنهما يريدان تقبيلها فجذباه من السرير وطرحاه إلى الأرض وجراه بعمامته وهجم الديلم دار الخلافة إلى الحرم ونهبوها فلم يبق فيها شيء وساقوا المستكفي ماشياً وخلع وسملت عيناه يومئذ وكانت خلافته سنة وأربعة أشهر وأحضروا الفضل بن المقتدر فبايعوه فجاء ابن عمه المستكفي فسلم عليه بالخلافة {cite:tarikh-khulafa-minhaj-1434 p. 613-614}. وعند ابن الأثير وكان سبب خلعه أن أمه القهرمانة صنعت دعوة عظيمة حضرها جماعة من قواد الديلم والأتراك فاتهموها عند معز الدولة أنها فعلت ذلك لتأخذ عليهم البيعة للمستكفى ويعزلوا معز الدولة، فلما مضى اثنان وعشرون يوماً من جمادى الآخرة سنة 334هـ حضر معز الدولة والناس عند الخليفة وحضر رجلان من نقباء الديلم فتناولا يد المستكفى فظن أنهما يريدان تقبيلها فهشّ إليهما فجذباه عن سريره وجعلا عمامته في حلقه وساقاه ماشياً إلى دار معز الدولة فاعتُقل بها ونُهبت دار الخلافة حتى لم يبق بها شيء وكانت مدة خلافته سنة وأربعة أشهر، ولما بويع المطيع لله سُلم إليه المستكفى فسمله وأعماه وبقي محبوساً حتى مات في ربيع الأول سنة 338هـ {cite:kamil-ibn-al-athir p. 337}"
  en: "Ahmad ibn Buya entered Baghdad, stood before the caliph and was invested as Mu'izz al-Dawla — his brothers becoming Imad and Rukn al-Dawla, their titles struck on the coinage, while al-Mustakfi styled himself 'Imam al-Haqq'. Mu'izz al-Dawla, the first Daylamite to hold Iraq, sequestered the caliph on five thousand dirhams a day and made wrestling and swimming the city's craze — swimmers cooking meat in pots on their arms. In Jumada II 334 two Daylamites came to the caliph — he offered his hand for the kiss, they dragged him from the throne by his turban to the ground, the soldiery sacked the harem bare, and he was deposed and blinded that day, after sixteen months; they brought al-Fadl ibn al-Muqtadir, and the blinded Mustakfi saluted him as caliph {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
  es: "Ahmad ibn Buya entró en Bagdad, se presentó ante el califa y fue investido como Mu'izz al-Dawla; sus hermanos se convirtieron en Imad y Rukn al-Dawla, cuyos títulos se acuñaron en las monedas, mientras que al-Mustakfi se autodenominó 'Imam al-Haqq'. Mu'izz al-Dawla, el primer daylamita en gobernar Irak, confiscó al califa con cinco mil dirhams al día e hizo de la lucha libre y la natación la moda de la ciudad; los nadadores cocinaban carne en ollas sobre sus brazos. En Jumada II 334, dos daylamitas se presentaron ante el califa; él ofreció su mano para el beso, lo arrastraron del trono por el turbante hasta el suelo, los soldados saquearon el harén y fue depuesto y cegado ese mismo día, después de dieciséis meses; trajeron a al-Fadl ibn al-Muqtadir, y el ciego Mustakfi lo saludó como califa {cita:tarikh-khulafa-minhaj-1434 p. 613-614}."
  fr: "Ahmad ibn Buya entra à Bagdad, se présenta devant le calife et fut investi sous le nom de Mu'izz al-Dawla. Ses frères devinrent Imad et Rukn al-Dawla, leurs titres étant frappés sur les pièces de monnaie, tandis qu'al-Mustakfi se faisait appeler « Imam al-Haqq ». Mu'izz al-Dawla, le premier Daylamite à régner sur l'Irak, imposa au calife une pension de cinq mille dirhams par jour et fit de la lutte et de la natation les activités à la mode dans la ville – les nageurs faisant cuire de la viande dans des marmites sur leurs bras. En Jumada II 334, deux Daylamites vinrent trouver le calife. Il leur tendit la main pour un baiser, ils le traînèrent du trône par son turban jusqu'au sol, les soldats pillèrent le harem et il fut déposé et aveuglé ce jour-là, après seize mois de règne. ils ont amené al-Fadl ibn al-Muqtadir, et Mustakfi, aveuglé, l'a salué comme calife {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
  ur: "احمد بن بویا بغداد میں داخل ہوا، خلیفہ کے سامنے کھڑا ہوا اور معز الدولہ کے طور پر سرمایہ کاری کی گئی - اس کے بھائی عماد اور رکن الدولہ بن گئے، ان کے لقب سکہ پر لگے، جبکہ المستکفی نے خود کو 'امام الحق' کا اسٹائل دیا۔ معز الدولہ، عراق پر قبضہ کرنے والا پہلا دن، خلیفہ کو ایک دن میں پانچ ہزار درہم پر قبضہ کرتا تھا اور کشتی اور تیراکی کو شہر کا جنون بنا دیتا تھا - تیراک اپنے بازوؤں پر برتنوں میں گوشت پکاتے تھے۔ جمادی الثانی 334 میں خلیفہ کے پاس دو دیہاتی آئے - اس نے بوسے کے لیے اپنا ہاتھ پیش کیا، انہوں نے اسے تخت سے اس کی پگڑی سے گھسیٹ کر زمین پر لے گئے، سپاہیوں نے حرم کو برہنہ کر دیا، اور اس دن اسے معزول کر دیا گیا، سولہ ماہ بعد اندھا کر دیا گیا۔ وہ الفضل بن مقتدیر کو لے کر آئے، اور اندھے مستکفی نے اسے خلیفہ کے طور پر سلام کیا۔ 613-614}۔"
  tr: "Ahmed ibn Buveyh Bağdat'a girdi ve İbn Şirzad saklandı. Halifenin sarayına girdi ve halifenin huzuruna çıktı; halife ona şeref cübbesi ve Mu'izz el-Davla unvanını verdi. Kardeşi Ali'ye 'İmad el-Davla, diğer kardeşi Hasan'a ise Rukn el-Davla unvanını verdi. Bu unvanlar sikkeler üzerine işlendi ve el-Mustakfi kendisine İmam el-Haqq unvanını verdi. Ardından Mu'izz el-Davla'nın gücü arttı ve halifeyi ev hapsine alarak günlük masrafları için sadece beş bin dirhem tahsis etti. Irak'ı yöneten ilk Delamî ve Bağdat'a haydutları getiren ilk kişiydi. Güreşçileri ve yüzücüleri o kadar yozlaştırdı ki, bir yüzücü tencerenin üzerinde mangalla yüzer, et pişene kadar yüzmeye devam ederdi. Sonra, 334 Hicri yılının Cemâdeü'l-Ahire ayında el-Mustakfi'yi kandırarak huzuruna girdi. İki Delamî halifeye yaklaştı ve halife onların elini öpeceklerini düşünerek onlara elini uzattı. Onlar halifeyi tahttan indirdiler, yere fırlattılar ve sarığından sürüklediler. Delamîler halifenin sarayına, harem de dahil olmak üzere, baskın düzenleyip yağmaladılar, geriye hiçbir şey bırakmadılar. El-Mustakfi'yi yaya olarak götürdüler, elbisesini çıkardılar ve o gün gözlerini kör ettiler. Halifeliği bir yıl dört ay sürmüştü. Sonra el-Fadl ibn el-Muktadir'i onun huzuruna getirdiler. Böylece ona biat ettiler ve kuzeni El-Mustakfi gelip onu halife olarak selamladı. {Kaynak:tarikh-khulafa-minhaj-1434 s. 613-614} İbn el-Athir'e göre, tahttan indirilmesinin sebebi, annesinin, yani kahyanın, bir grup Delamî ve Türk komutanının katıldığı büyük bir ziyafet vermesiydi. Komutanlar, Muizz el-Dawla'nın huzurunda onu, kendilerinin biatını almak ve Muizz el-Dawla'yı tahttan indirmek için bunu yapmakla suçladılar. Hicri 334 yılının Cemâde-i Ahiret ayında yirmi iki gün geçtikten sonra, Muizz el-Dawla ve halk halifenin yanında bulunurken, Delamî reislerinden iki adam gelip Muizz el-Dawla'nın elini tuttular. El-Muztakfi, onların elini öpmek istediklerini düşünerek onlara doğru gitmeye can attı. Onu yatağından çekip aldılar, sarığını boğazına doladılar ve yaya olarak Muizz el-Dawla'nın evine götürdüler ve orada hapsettiler. Halifenin sarayı yağmalandı ve hiçbir şey kalmadı. Hükümranlığı bir yıl dört ay sürdü. El-Muti'li-Allah biat ettiğinde, el-Mustakfi ona teslim edildi. Onu kör ettirdi ve 338 Hicri yılında Rebiü'l-Evvel ayında vefat edene kadar hapsedildi. {Kaynak: Kamil ibn el-Ashir, s. 337}"
  id: "Ahmad ibn Buwayh memasuki Baghdad, dan Ibn Shirzad bersembunyi. Ia memasuki istana Khalifah dan berdiri di hadapan Khalifah, yang menganugerahinya jubah kehormatan dan gelar Mu'izz al-Dawla. Ia memberi saudaranya Ali gelar 'Imad al-Dawla dan saudara mereka al-Hasan gelar Rukn al-Dawla. Gelar mereka diukir pada koin, dan al-Mustakfi menobatkan dirinya sebagai Imam al-Haqq. Kemudian kekuasaan Mu'izz al-Dawla tumbuh, dan ia menempatkan Khalifah di bawah tahanan rumah, hanya mengalokasikan lima ribu dirham setiap hari untuk pengeluaran. Ia adalah penguasa pertama dari Dinasti Daylam yang memerintah Irak dan yang pertama memperkenalkan bandit ke Baghdad. Ia merusak para pegulat dan perenang sedemikian rupa sehingga seorang perenang akan berenang dengan anglo di atas panci masak, berenang sampai dagingnya matang. Kemudian, ia menipu al-Mustakfi dan menghadapnya pada Jumada al-Akhira tahun 334 H. Dua orang Daylam mendekati Khalifah, dan beliau mengulurkan tangannya kepada mereka, mengira mereka bermaksud menciumnya. Mereka menariknya dari singgasana, menjatuhkannya ke tanah, dan menyeretnya dengan sorbannya. Orang-orang Daylam menyerbu istana Khalifah, termasuk harem, dan menjarahnya, tanpa meninggalkan apa pun. Mereka membawa al-Mustakfi pergi dengan berjalan kaki, melucuti jubahnya, dan membutakannya pada hari itu. Kekhalifahannya telah berlangsung selama satu tahun empat bulan. Kemudian mereka membawa al-Fadl ibn al-Muqtadir menghadapnya. Maka mereka berjanji setia kepadanya, dan sepupunya Al-Mustakfi datang dan menyambutnya sebagai Khalifah {cite:tarikh-khulafa-minhaj-1434 p. 613-614}. Menurut Ibn al-Athir, alasan penggulingannya adalah karena ibunya, seorang pengurus rumah tangga, mengadakan pesta besar yang dihadiri oleh sekelompok komandan Daylam dan Turki. Mereka menuduhnya di hadapan Mu'izz al-Dawla melakukan hal ini untuk mendapatkan kesetiaan mereka kepada al-Mustakfi dan untuk menggulingkan Mu'izz al-Dawla. Setelah dua puluh dua hari berlalu di bulan Jumada al-Akhirah tahun 334 H, Mu'izz al-Dawla dan rakyat hadir bersama Khalifah, dan dua orang dari para pemimpin Daylam datang dan memegang tangan al-Mustakfi. Ia mengira mereka ingin menciumnya, sehingga ia ingin menghampiri mereka. Mereka menariknya dari tempat tidurnya, melilitkan sorbannya di lehernya, dan membawanya berjalan kaki ke rumah Mu'izz al-Dawla, tempat ia dipenjara. Istana Khalifah dijarah hingga tidak ada yang tersisa di dalamnya. Masa pemerintahannya berlangsung selama satu tahun empat bulan. Ketika al-Muti' li-Allah menerima sumpah setia, al-Mustakfi diserahkan kepadanya. Ia membutakan mata al-Mustakfi berulang kali, dan memenjarakannya hingga wafat pada bulan Rabi' al-Awwal tahun 338 Hijriah. {kutip:kamil-ibn-al-athir hlm. 337}"
