label: { ar: "خبر الحسين بن منصور الحلاج", en: "News of al-Husayn ibn Mansur al-Hallaj" }
summary:
  ar: "في سنة تسع وثلاثمائة بلغ المقتدر خبر الحسين بن منصور الحلاج، فأمر بقتله وإحراقه بالنار، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي قتل في سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم وله في أحواله السنية أخبار أفردها الناس بالتصنيف {cite:tarikh-khulafa-minhaj-1434 p. 590}. وعند ابن الأثير كان سبب قتله أنه نُقل إلى الوزير حامد بن العباس أنه يحيي الموتى والجان تخدمه وأنه موّه على جماعة من حواشي الخليفة ومال إليه نصر الحاجب، فألحّ الوزير على المقتدر بتسليمه فأخذه ومعه إنسان يعرف بالشرقي وغيره، فاعترفوا أنه قد صح عندهم الإله وأنه يحيي الموتى وقابلوه على ذلك فأنكره وقال معاذ الله أن أدعي الربوبية أو النبوة وإنما أنا رجل أعبد الله، فأحضر الوزير القاضي أبا عمرو والقاضي أبا جعفر بن البهلول ووجوه الفقهاء فاستفتاهم، فلما قُرئ عليه كتابه في أن من لم يمكنه الحج بنى بيتاً في داره وطاف حوله وجمع ثلاثين يتيماً أطعمهم وكساهم كان كمن حج، وقال أخذته من كتاب الإخلاص للحسن البصري، قال القاضي أبو عمرو كذبت يا حلال الدم قد سمعناه بمكة وليس فيه هذا، فكتب بإباحة دمه، فلما سمع الحلاج ذلك قال ما يحل لكم دمي واعتقادي الإسلام ومذهبي السنة ولي فيها كتب موجودة فالله الله في دمي، فضُرب ألف سوط فما تأوه ثم قُطعت يداه ورجلاه وقُتل وأُحرق بالنار فلما صار رماداً أُلقي في دجلة ونُصب الرأس ببغداد وأُرسل إلى خراسان، فأقبل بعض أصحابه يقولون إنه لم يُقتل وإنما أُلقي شبهه على دابة وأنه يجيء بعد أربعين يوماً وبعضهم قال إنه ميت على حمار بطريق الطبرستان {cite:kamil-ibn-al-athir p. 93-95} وعند ابن الجوزي صُلب في الجانب الشرقي يومي الأربعاء والخميس وفي الجانب الغربي يومي الجمعة والسبت، لاثنتي عشرة ليلة بقيت من ربيع الآخر {cite:muntazam-ibn-al-jawzi p. 402}."
  en: "In the year 309 news of al-Husayn ibn Mansur al-Hallaj reached al-Muqtadir, who ordered him killed and burned with fire. Al-Tabari mentions that he was given a thousand lashes and that his hands and feet were cut off {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. According to al-Suyuti he was killed in the year nine, on the legal opinion of the judge Abu Umar and the jurists and scholars that his blood was lawful; there are reports of his conduct and states that people have devoted separate works to {cite:tarikh-khulafa-minhaj-1434 p. 590}. According to Ibn al-Athir, the cause of his killing was that it was reported to the vizier Hamid ibn al-Abbas that he revived the dead and that jinn served him, that he had beguiled a group of the caliph's courtiers, and that the chamberlain Nasr inclined toward him. The vizier pressed al-Muqtadir to hand him over, and he was seized together with a man known as al-Sharqi and others. They confessed that the divinity had been established for them, that he revived the dead, and that they had met him on that basis; he denied it, saying God forbid that he claim lordship or prophethood, and that he was only a man who worships God. The vizier summoned the judge Abu Amr, the judge Abu Ja'far ibn al-Bahlul and the leading jurists and asked for their ruling. When his written statement was read to them, in which he said that whoever could not make the pilgrimage could build a house in his home, circle it, and feed and clothe thirty orphans, and would then be as one who had made the pilgrimage, and said he had taken this from the Kitab al-Ikhlas of al-Hasan al-Basri, Abu Amr said: 'You lie, O one whose blood is lawful; we heard it in Mecca and it does not contain this.' So the ruling declared his blood lawful. When al-Hallaj heard this he said: 'My blood is not lawful for you; my belief is Islam and my school is the Sunna, and there are books of mine on it that survive. God, God, concerning my blood.' He was given a thousand lashes and did not groan; then his hands and feet were cut off, and he was killed and burned with fire. When he had become ash he was thrown into the Tigris, and his head was displayed in Baghdad and sent to Khurasan. Some of his followers came to say that he had not been killed, but that his likeness had been cast onto an animal and that he would return after forty days; others said he had died on a donkey on the road to Tabaristan {cite:kamil-ibn-al-athir p. 93-95}. According to Ibn al-Jawzi, he was crucified on the eastern bank on Wednesday and Thursday and on the western bank on Friday and Saturday, twelve nights before the end of Rabi' al-Akhir {cite:muntazam-ibn-al-jawzi p. 402}."
