id: event/killing-of-al-hallaj
class: event
kind: death
label: { ar: "خبر الحسين بن منصور الحلاج", en: "News of al-Husayn ibn Mansur al-Hallaj", es: "Noticias de al-Husayn ibn Mansur al-Hallaj", fr: "Nouvelles d'al-Husayn ibn Mansur al-Hallaj", ur: "الحسین بن منصور الحلاج کی خبر", tr: "Hüseyin ibn Mansur el-Hallac'ın hikayesi", id: "Kisah Al-Husayn ibn Mansur Al-Hallaj" }
summary:
  ar: "في سنة تسع وثلاثمائة بلغ المقتدر خبر الحسين بن منصور الحلاج، فأمر بقتله وإحراقه بالنار، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي قتل في سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم وله في أحواله السنية أخبار أفردها الناس بالتصنيف {cite:tarikh-khulafa-minhaj-1434 p. 590}. وعند ابن الأثير كان سبب قتله أنه نُقل إلى الوزير حامد بن العباس أنه يحيي الموتى والجان تخدمه وأنه موّه على جماعة من حواشي الخليفة ومال إليه نصر الحاجب، فألحّ الوزير على المقتدر بتسليمه فأخذه ومعه إنسان يعرف بالشرقي وغيره، فاعترفوا أنه قد صح عندهم الإله وأنه يحيي الموتى وقابلوه على ذلك فأنكره وقال معاذ الله أن أدعي الربوبية أو النبوة وإنما أنا رجل أعبد الله، فأحضر الوزير القاضي أبا عمرو والقاضي أبا جعفر بن البهلول ووجوه الفقهاء فاستفتاهم، فلما قُرئ عليه كتابه في أن من لم يمكنه الحج بنى بيتاً في داره وطاف حوله وجمع ثلاثين يتيماً أطعمهم وكساهم كان كمن حج، وقال أخذته من كتاب الإخلاص للحسن البصري، قال القاضي أبو عمرو كذبت يا حلال الدم قد سمعناه بمكة وليس فيه هذا، فكتب بإباحة دمه، فلما سمع الحلاج ذلك قال ما يحل لكم دمي واعتقادي الإسلام ومذهبي السنة ولي فيها كتب موجودة فالله الله في دمي، فضُرب ألف سوط فما تأوه ثم قُطعت يداه ورجلاه وقُتل وأُحرق بالنار فلما صار رماداً أُلقي في دجلة ونُصب الرأس ببغداد وأُرسل إلى خراسان، فأقبل بعض أصحابه يقولون إنه لم يُقتل وإنما أُلقي شبهه على دابة وأنه يجيء بعد أربعين يوماً وبعضهم قال إنه ميت على حمار بطريق الطبرستان {cite:kamil-ibn-al-athir p. 93-95} وعند ابن الجوزي صُلب في الجانب الشرقي يومي الأربعاء والخميس وفي الجانب الغربي يومي الجمعة والسبت، لاثنتي عشرة ليلة بقيت من ربيع الآخر {cite:muntazam-ibn-al-jawzi p. 402}."
  en: "In the year 309 news of al-Husayn ibn Mansur al-Hallaj reached al-Muqtadir, who ordered him killed and burned with fire. Al-Tabari mentions that he was given a thousand lashes and that his hands and feet were cut off {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. According to al-Suyuti he was killed in the year nine, on the legal opinion of the judge Abu Umar and the jurists and scholars that his blood was lawful; there are reports of his conduct and states that people have devoted separate works to {cite:tarikh-khulafa-minhaj-1434 p. 590}. According to Ibn al-Athir, the cause of his killing was that it was reported to the vizier Hamid ibn al-Abbas that he revived the dead and that jinn served him, that he had beguiled a group of the caliph's courtiers, and that the chamberlain Nasr inclined toward him. The vizier pressed al-Muqtadir to hand him over, and he was seized together with a man known as al-Sharqi and others. They confessed that the divinity had been established for them, that he revived the dead, and that they had met him on that basis; he denied it, saying God forbid that he claim lordship or prophethood, and that he was only a man who worships God. The vizier summoned the judge Abu Amr, the judge Abu Ja'far ibn al-Bahlul and the leading jurists and asked for their ruling. When his written statement was read to them, in which he said that whoever could not make the pilgrimage could build a house in his home, circle it, and feed and clothe thirty orphans, and would then be as one who had made the pilgrimage, and said he had taken this from the Kitab al-Ikhlas of al-Hasan al-Basri, Abu Amr said: 'You lie, O one whose blood is lawful; we heard it in Mecca and it does not contain this.' So the ruling declared his blood lawful. When al-Hallaj heard this he said: 'My blood is not lawful for you; my belief is Islam and my school is the Sunna, and there are books of mine on it that survive. God, God, concerning my blood.' He was given a thousand lashes and did not groan; then his hands and feet were cut off, and he was killed and burned with fire. When he had become ash he was thrown into the Tigris, and his head was displayed in Baghdad and sent to Khurasan. Some of his followers came to say that he had not been killed, but that his likeness had been cast onto an animal and that he would return after forty days; others said he had died on a donkey on the road to Tabaristan {cite:kamil-ibn-al-athir p. 93-95}. According to Ibn al-Jawzi, he was crucified on the eastern bank on Wednesday and Thursday and on the western bank on Friday and Saturday, twelve nights before the end of Rabi' al-Akhir {cite:muntazam-ibn-al-jawzi p. 402}."
  es: "En el año 309, la noticia de al-Husayn ibn Mansur al-Hallaj llegó a al-Muqtadir, quien ordenó su muerte y quema. Al-Tabari menciona que recibió mil latigazos y que le cortaron las manos y los pies {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. Según al-Suyuti, fue asesinado en el año nueve, basándose en la opinión jurídica del juez Abu Umar y de los juristas y eruditos que consideraban lícita su sangre; existen relatos de su conducta y afirmaciones a los que se han dedicado obras específicas {cite:tarikh-khulafa-minhaj-1434 p. 590}. Según Ibn al-Athir, la causa de su muerte fue que se informó al visir Hamid ibn al-Abbas que resucitaba a los muertos y que los genios le servían, que había engañado a un grupo de cortesanos del califa y que el chambelán Nasr se inclinaba hacia él. El visir presionó a al-Muqtadir para que lo entregara, y fue apresado junto con un hombre conocido como al-Sharqi y otros. Confesaron que la divinidad les había sido establecida, que resucitaba a los muertos y que lo habían conocido por ese motivo; él lo negó, diciendo que Dios no le permitiera reclamar señorío o profecía, y que solo era un hombre que adoraba a Dios. El visir convocó al juez Abu Amr, al juez Abu Ja'far ibn al-Bahlul y a los principales juristas y les pidió su dictamen. Cuando les leyeron su declaración escrita, en la que decía que quien no pudiera hacer la peregrinación podía construir una casa en su hogar, rodearla, alimentar y vestir a treinta huérfanos, y entonces sería como si hubiera hecho la peregrinación, y dijo que había tomado esto del Kitab al-Ikhlas de al-Hasan al-Basri, Abu Amr dijo: «Mientes, oh tú cuya sangre es lícita; lo oímos en La Meca y no contiene esto». Así que el dictamen declaró lícita su sangre. Cuando al-Hallaj oyó esto, dijo: «Mi sangre no es lícita para vosotros; mi creencia es el Islam y mi escuela es la Sunna, y hay libros míos sobre ella que han sobrevivido. Dios, Dios, sobre mi sangre». Le dieron mil latigazos y no gimió; luego le cortaron las manos y los pies, lo mataron y lo quemaron. Cuando se convirtió en cenizas, lo arrojaron al Tigris, y su cabeza fue exhibida en Bagdad y enviada a Jorasán. Algunos de sus seguidores afirmaron que no había sido asesinado, sino que su imagen había sido colocada sobre un animal y que regresaría después de cuarenta días; otros dijeron que había muerto sobre un burro en el camino a Tabaristán {cita:kamil-ibn-al-athir págs. 93-95}. Según Ibn al-Jawzi, fue crucificado en la orilla oriental el miércoles y el jueves, y en la orilla occidental el viernes y el sábado, doce noches antes del final de Rabi' al-Akhir {cita:muntazam-ibn-al-jawzi pág. 402}."
  fr: "En 309, la nouvelle du décès d'al-Husayn ibn Mansur al-Hallaj parvint à al-Muqtadir, qui ordonna son exécution par le feu. Al-Tabari rapporte qu'il reçut mille coups de fouet et que ses mains et ses pieds furent coupés (voir: Tabari, Tarikh Abu al-Fadl, vol. 11, p. 79). Selon al-Suyuti, il fut tué en 9, sur l'avis juridique du juge Abu Umar et des juristes et savants qui estimaient son sang licite; des récits de son comportement et des ouvrages entiers lui ont été consacrés (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 590). Selon Ibn al-Athir, le meurtre d'al-Muqtadir fut motivé par le fait qu'il avait été rapporté au vizir Hamid ibn al-Abbas qu'il ressuscitait les morts, qu'il était à son service, qu'il avait séduit un groupe de courtisans du calife et que le chambellan Nasr était attiré par lui. Le vizir pressa al-Muqtadir de le lui livrer, et il fut arrêté avec un homme nommé al-Sharqi et d'autres. Ils confessèrent que la divinité leur avait été attribuée, qu'il ressuscitait les morts et qu'ils l'avaient rencontré pour cette raison; il nia tout, disant que Dieu le préservait de revendiquer une seigneurie ou une prophétie, et qu'il n'était qu'un homme qui adorait Dieu. Le vizir convoqua le juge Abu Amr, le juge Abu Ja'far ibn al-Bahlul et les plus éminents juristes et leur demanda leur avis. Lorsqu'on leur lut sa déclaration écrite, dans laquelle il affirmait que quiconque ne pouvait accomplir le pèlerinage pouvait construire une maison sur son domaine, l'entourer, nourrir et vêtir trente orphelins, et serait alors considéré comme ayant accompli le pèlerinage, et prétendait avoir tiré cela du Kitab al-Ikhlas d'al-Hasan al-Basri, Abu Amr s'écria: « Tu mens, ô toi dont le sang est licite ! Nous l'avons entendu à La Mecque et il n'y est pas question de cela. » Le jugement déclara donc son sang licite. À ces mots, al-Hallaj déclara: « Mon sang ne vous est pas licite ! Ma foi est l'islam et mon école est la Sunna, et mes ouvrages à ce sujet nous sont parvenus. Dieu, Dieu, qu'en est-il de mon sang ! » Il reçut mille coups de fouet sans gémir; puis on lui coupa les mains et les pieds, et il fut tué et brûlé vif. Une fois réduit en cendres, son corps fut jeté dans le Tigre, et sa tête fut exposée à Bagdad puis envoyée au Khorasan. Certains de ses disciples affirmèrent qu'il n'avait pas été tué, mais que son image avait été projetée sur un animal et qu'il reviendrait quarante jours plus tard; d'autres disaient qu'il était mort sur un âne, sur la route du Tabaristan (voir: Kamil ibn al-Athir, p. 93-95). Selon Ibn al-Jawzi, il fut crucifié sur la rive orientale le mercredi et le jeudi, puis sur la rive occidentale le vendredi et le samedi, douze nuits avant la fin du mois de Rabi' al-Akhir (voir: Muntazam ibn al-Jawzi, p. 402)."
  ur: "سنہ 309 میں الحسین بن منصور الحلاج کی خبر مقتدیر تک پہنچی جس نے اسے قتل کرنے اور آگ سے جلانے کا حکم دیا۔ الطبری نے ذکر کیا ہے کہ اسے ایک ہزار کوڑے لگائے گئے اور اس کے ہاتھ پاؤں کاٹ دیے گئے۔ سیوطی کے مطابق اسے نوے میں قتل کر دیا گیا، جج ابو عمر اور فقہاء اور علماء کی قانونی رائے پر کہ اس کا خون حلال تھا؛ ان کے طرز عمل کے بارے میں روایت ہے کہ لوگوں نے الگ الگ کاموں کو وقف کیا ہے۔ 590}۔ ابن اثیر کے مطابق، اس کے قتل کی وجہ یہ تھی کہ وزیر حامد بن العباس کو یہ اطلاع دی گئی تھی کہ اس نے مردوں کو زندہ کیا اور جنوں نے اس کی خدمت کی، اس نے خلیفہ کے درباریوں کے ایک گروہ کو دھوکہ دیا، اور چیمبرلین نصر اس کی طرف مائل ہوا۔ وزیر نے مقتدیر کو اس کے حوالے کرنے کے لیے دباؤ ڈالا، اور اسے ایک شخص کے ساتھ پکڑ لیا گیا جسے الشرقی کہا جاتا ہے اور دیگر۔ اُنہوں نے اقرار کیا کہ اُن کے لیے الوہیت قائم ہو چکی تھی، کہ اُس نے مُردوں کو زندہ کیا، اور وہ اِس بنیاد پر اُس سے ملے تھے۔ اس نے اس کا انکار کرتے ہوئے کہا کہ خدا نہ کرے کہ وہ ربوبیت یا نبوت کا دعویٰ کرے، اور یہ کہ وہ صرف ایک آدمی تھا جو خدا کی عبادت کرتا ہے۔ وزیر نے جج ابو عمرو، جج ابو جعفر ابن بہلول اور سرکردہ فقہاء کو بلایا اور ان سے فیصلہ طلب کیا۔ جب ان کے سامنے ان کا لکھا ہوا بیان پڑھ کر سنایا گیا، جس میں آپ نے فرمایا کہ جو شخص حج نہیں کر سکتا وہ اپنے گھر میں ایک گھر بنا سکتا ہے، اس کا چکر لگا سکتا ہے، اور تیس یتیموں کو کھانا کھلا سکتا ہے، اور پھر اس شخص کی طرح ہو گا جس نے حج کیا تھا، اور کہا کہ میں نے یہ کتاب حسن بصری کی کتاب اخلاص سے لی ہے، ابو عمرو نے کہا: اے ابو عمرو! ہم نے اسے مکہ میں سنا ہے اور اس میں یہ نہیں ہے۔' چنانچہ حکم نے اس کے خون کو حلال قرار دیا۔ جب حلاج نے یہ سنا تو کہا: میرا خون تمہارے لیے حلال نہیں ہے۔ میرا عقیدہ اسلام ہے اور میرا مکتب سنت ہے اور اس پر میری کتابیں باقی ہیں۔ خدا، خدا، میرے خون کے بارے میں۔' اُسے ہزار کوڑے مارے گئے اور وہ کراہ نہیں رہا تھا۔ پھر اُس کے ہاتھ پاؤں کاٹے گئے اور اُسے قتل کر کے آگ میں جلا دیا گیا۔ جب وہ راکھ ہو گیا تو اسے دجلہ میں پھینک دیا گیا اور اس کا سر بغداد میں ظاہر کر کے خراسان بھیج دیا گیا۔ اس کے پیروکاروں میں سے کچھ یہ کہنے آئے کہ اسے قتل نہیں کیا گیا بلکہ اس کی مثال ایک جانور پر ڈالی گئی ہے اور وہ چالیس دن کے بعد واپس آئے گا۔ دوسروں نے کہا کہ وہ تبرستان کے راستے پر گدھے پر مر گیا تھا {حوالہ: کامل ابن الاثیر صفحہ 93-95}۔ ابن الجوزی کے مطابق، آپ کو ربیع الآخر کے اختتام سے بارہ رات قبل بدھ اور جمعرات کو مشرقی کنارے اور مغربی کنارے پر جمعہ اور ہفتہ کو مصلوب کیا گیا تھا۔ 402}۔"
  tr: "Hicri 309 yılında Muktadir, Hüseyin ibn Mansur el-Hallac'ın haberini aldı ve onun öldürülüp yakılmasını emretti. Taberi, ona bin kırbaç vurulduğunu ve ellerinin ve ayaklarının kesildiğini belirtmiştir (kaynak: tabari-tarikh-abu-al-fadl c.11 s.79). Suyuti'ye göre, Hicri 309 yılında, kadı Ebu Ömer ve hukukçular ile alimlerin kanının helal olduğuna dair fetvasıyla öldürülmüştür. Onun erdemli davranışlarına dair ayrı ayrı derlenmiş rivayetler de mevcuttur (kaynak: tarikh-khulafa-minhaj-1434 s. 590). İbn el-Athir'e göre, idamının sebebi, vezir Hamid ibn el-Abbas'a onun (el-Hallaj'ın) ölüleri diriltebildiği, cinlerin ona hizmet ettiği ve halifenin maiyetinden Nasr el-Hajib de dahil olmak üzere bir grubu kandırdığı yönündeki söylentilerdi. Vezir, el-Muqtadir'i onu teslim etmesi için zorladı ve onu el-Şarki olarak bilinen bir adam ve diğerleriyle birlikte tutukladı. Onlar, Tanrı'ya inandıklarını ve onun ölüleri diriltebildiğini itiraf ettiler ve bu konuda onunla yüzleştiler. O ise, \"Tanrı korusun, ilahlık veya peygamberlik iddiasında bulunmayayım. Ben sadece Tanrı'ya ibadet eden bir insanım\" diyerek bunu reddetti. Vezir daha sonra kadı Ebu Amr ve Ebu Cafer ibn el-Bahlül'ü ve önde gelen hukukçuları çağırdı ve onlardan hukuki görüş istedi. Hac ibadetini yerine getiremeyen kimsenin evinde bir ev inşa etmesi, tavaf etmesi, otuz yetimi toplaması, onları doyurup giydirmesi ve böylece hac yapmış gibi sayılması gerektiğini belirten ve bunu Hasan el-Basri'nin samimiyet üzerine yazdığı kitaptan aldığını söyleyen kitabı kendisine okunduğunda, Kadı Ebu Amr, \"Sen yalan söylüyorsun, sen benim kanımı helal sayan! Bunu Mekke'de duyduk ve bu böyle bir şey içermiyor.\" dedi. Bunun üzerine idamına izin veren bir kararname yazdı. El-Hallaj bunu duyunca, \"Sizin için benim kanımı helal kılan nedir? Benim inancım İslam'dır, düşünce ekolüm Sünnettir ve bu konuda kitaplar yazdım.\" dedi. O da oradaydı, bu yüzden Allah, Allah, benim kanımda, dedi ve bin kırbaçla dövüldü, inlemedi. Sonra elleri ve ayakları kesildi, öldürüldü ve ateşle yakıldı. Kül olunca Dicle'ye atıldı ve başı Bağdat'ta dikildi ve Horasan'a gönderildi. Sonra arkadaşlarından bazıları gelip onun öldürülmediğini, aksine suretinin bir hayvana atıldığını ve kırk gün sonra geri geleceğini söylediler. Bazıları da Tabaristan yolunda bir eşeğe binmiş halde öldüğünü söylediler. {Kaynak: Kamil ibn el-Athir s. 93-95}. İbn el-Cevzi'ye göre ise, Rabi' el-Ahir ayının on iki gecesinde, Çarşamba ve Perşembe günleri doğuya, Cuma ve Cumartesi günleri ise batıya yatırılarak çarmıha gerildi. {Kaynak: Muntazam ibn el-Cevzi s. 402}"
  id: "Pada tahun 309 H, Al-Muqtadir menerima kabar tentang Al-Husayn ibn Mansur Al-Hallaj, sehingga ia memerintahkan agar ia dibunuh dan dibakar hidup-hidup. Al-Tabari menyebutkan bahwa ia dicambuk seribu kali dan tangan serta kakinya dipotong {kutip:tabari-tarikh-abu-al-fadl j.11 hlm.79}. Menurut Al-Suyuti, ia dibunuh pada tahun 309 H berdasarkan fatwa dari Hakim Abu Umar dan para ahli fiqih serta ulama bahwa darahnya halal. Terdapat catatan tentang perilaku baiknya yang telah dikumpulkan secara terpisah oleh orang-orang {kutip:tarikh-khulafa-minhaj-1434 hlm. 590}. Menurut Ibn al-Athir, alasan eksekusinya adalah karena dilaporkan kepada wazir Hamid ibn al-Abbas bahwa dia (al-Hallaj) dapat membangkitkan orang mati, bahwa jin melayaninya, dan bahwa dia telah menipu sekelompok orang dari rombongan khalifah, termasuk Nasr al-Hajib. Wazir mendesak al-Muqtadir untuk menyerahkannya, sehingga ia menangkapnya bersama seorang pria yang dikenal sebagai al-Sharqi dan yang lainnya. Mereka mengaku bahwa mereka beriman kepada Tuhan dan bahwa dia dapat membangkitkan orang mati, dan mereka menanyakan hal itu kepadanya. Dia menyangkalnya, dengan mengatakan, \"Semoga Allah melarang saya untuk mengaku sebagai Tuhan atau nabi. Saya hanyalah seorang manusia yang menyembah Tuhan.\" Wazir kemudian memanggil hakim Abu Amr dan Abu Ja'far ibn al-Bahlul, bersama dengan para ahli hukum terkemuka, dan meminta pendapat hukum dari mereka. Ketika bukunya dibacakan kepadanya, yang menyatakan bahwa siapa pun yang tidak mampu melaksanakan ibadah haji hendaknya membangun rumah di rumahnya, mengelilinginya, mengumpulkan tiga puluh anak yatim, memberi mereka makan dan pakaian, dan dianggap seolah-olah telah melaksanakan ibadah haji, dan bahwa ia mengambilnya dari buku al-Hasan al-Basri tentang ketulusan, Hakim Abu Amr berkata, \"Engkau berbohong, engkau yang menganggap darahku halal! Kami mendengarnya di Mekah, dan itu tidak berisi hal ini.\" Maka ia menulis dekrit yang mengizinkan eksekusinya. Ketika al-Hallaj mendengar ini, ia berkata, \"Apa yang membuat darahku halal bagimu? Keyakinanku adalah Islam, mazhabku adalah Sunnah, dan aku telah menulis buku tentang hal itu.\" Ia hadir, maka Allah, Allah, ada dalam darahku, maka ia dicambuk seribu kali dan ia tidak mengerang. Kemudian tangan dan kakinya dipotong dan ia dibunuh dan dibakar dengan api. Ketika ia menjadi abu, ia dilemparkan ke Sungai Tigris dan kepalanya ditegakkan di Baghdad dan dikirim ke Khorasan. Kemudian beberapa sahabatnya datang dan mengatakan bahwa dia tidak dibunuh, melainkan rupanya dilemparkan ke atas seekor hewan dan bahwa dia akan datang setelah empat puluh hari. Dan sebagian dari mereka mengatakan bahwa dia meninggal di atas seekor keledai di jalan menuju Tabaristan {kutip:kamil-ibn-al-athir hlm. 93-95}. Dan menurut Ibn al-Jawzi, dia disalib di sisi timur pada hari Rabu dan Kamis dan di sisi barat pada hari Jumat dan Sabtu, dua belas malam tersisa dari Rabi’ al-Akhir {kutip:muntazam-ibn-al-jawzi hlm. 402}."
