label: { ar: "خبر الحسين بن منصور الحلاج" }
summary:
  ar: "في سنة تسع وثلاثمائة بلغ المقتدر خبر الحسين بن منصور الحلاج، فأمر بقتله وإحراقه بالنار، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي قتل في سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم وله في أحواله السنية أخبار أفردها الناس بالتصنيف {cite:tarikh-khulafa-minhaj-1434 p. 590}.، وعند ابن الأثير كان سبب قتله أنه نُقل إلى الوزير حامد بن العباس أنه يحيي الموتى والجان تخدمه وأنه موّه على جماعة من حواشي الخليفة ومال إليه نصر الحاجب، فألحّ الوزير على المقتدر بتسليمه فأخذه ومعه إنسان يعرف بالشرقي وغيره، فاعترفوا أنه قد صح عندهم الإله وأنه يحيي الموتى وقابلوه على ذلك فأنكره وقال معاذ الله أن أدعي الربوبية أو النبوة وإنما أنا رجل أعبد الله، فأحضر الوزير القاضي أبا عمرو والقاضي أبا جعفر بن البهلول ووجوه الفقهاء فاستفتاهم، فلما قُرئ عليه كتابه في أن من لم يمكنه الحج بنى بيتاً في داره وطاف حوله وجمع ثلاثين يتيماً أطعمهم وكساهم كان كمن حج، وقال أخذته من كتاب الإخلاص للحسن البصري، قال القاضي أبو عمرو كذبت يا حلال الدم قد سمعناه بمكة وليس فيه هذا، فكتب بإباحة دمه، فلما سمع الحلاج ذلك قال ما يحل لكم دمي واعتقادي الإسلام ومذهبي السنة ولي فيها كتب موجودة فالله الله في دمي، فضُرب ألف سوط فما تأوه ثم قُطعت يداه ورجلاه وقُتل وأُحرق بالنار فلما صار رماداً أُلقي في دجلة ونُصب الرأس ببغداد وأُرسل إلى خراسان، فأقبل بعض أصحابه يقولون إنه لم يُقتل وإنما أُلقي شبهه على دابة وأنه يجيء بعد أربعين يوماً وبعضهم قال إنه ميت على حمار بطريق الطبرستان {cite:kamil-ibn-al-athir p. 93-95}"
