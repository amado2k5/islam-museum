label: { ar: "غلاء بغداد سنة 334هـ", en: "The Baghdad famine of 334 AH (945-946)", ur: "334ھ ⁦(945-946ء)⁩ کا بغداد کا قحط", fr: "La famine de Bagdad en 334 H (945-946)", es: "La hambruna de Bagdad del año 334 de la Hégira (945-946)", tr: "Hicri 334 yılında Bağdat'ta yüksek fiyatlar.", id: "Harga tinggi di Baghdad pada tahun 334 Hijriah" }
summary:
  ar: "المجاعة التي أعقبت حرب معز الدولة وناصر الدولة على بغداد سنة 334هـ، ويصفها مسكويه بأن الناس عدموا الخبز البتة فأكلوا الموتى والحشيش والميتة، وكانت الدور والعقارات تُباع بالرغفان، وأكلت الكلاب لحوم الموتى لكثرتهم، وخرج الضعفاء إلى البصرة لأكل التمر فهلك أكثرهم في الطريق، حتى زالت الفتنة ودخلت الغلات الجديدة فانحلّ السعر {cite:tajarib-al-umam-surush-v6 p. 127-128}."
  en: "The famine that followed the war of Mu'izz al-Dawla and Nasir al-Dawla for Baghdad in 334 AH. Miskawayh describes people without any bread eating the dead, grass and carrion, houses sold for loaves, dogs eating the unburied dead, and the weak setting out for Basra to eat dates and mostly dying on the road, until the fighting ended and the new harvest brought prices down {cite:tajarib-al-umam-surush-v6 p. 127-128}."
  fr: "La famine qui suivit la guerre de Mu'izz al-Dawla et de Nasir al-Dawla pour Bagdad en 334 H. Miskawayh décrit des gens privés de tout pain mangeant les morts, l'herbe et les charognes, des maisons vendues contre des pains, des chiens dévorant les morts non enterrés, et les faibles partant pour Bassora manger des dattes et mourant pour la plupart en chemin, jusqu'à ce que les combats cessent et que la nouvelle récolte fasse baisser les prix {cite:tajarib-al-umam-surush-v6 p. 127-128}."
  es: "La hambruna que siguió a la guerra de Mu'izz al-Dawla y Nasir al-Dawla por Bagdad en el año 334 AH. Miskawayh describe a personas sin pan comiendo muertos, hierba y carroña, casas vendidas por panes, perros comiendo los muertos sin enterrar, y los débiles partiendo hacia Basora para comer dátiles y muriendo en su mayoría en el camino, hasta que terminaron los combates y la nueva cosecha hizo bajar los precios {cite:tajarib-al-umam-surush-v6 p. 127-128}."
  ur: "334ھ میں بغداد کے لیے معز الدولہ اور ناصر الدولہ کی جنگ کے بعد آنے والا قحط۔ مسکاویہ بیان کرتا ہے کہ بغیر روٹی کے لوگ مرے ہوئے، گھاس اور مردار کھاتے ہیں، روٹیوں کے لیے بیچے گئے مکان، کتے بے دفن مردے کھاتے ہیں، اور بصرہ کی طرف کھجور کھانے اور زیادہ تر سڑک پر مرنے کے لیے، یہاں تک کہ لڑائی ختم ہو گئی اور نئی فصل نے قیمتیں کم کر دیں۔ 127-128}۔"
  tr: "Hicri 334 yılında Muizz el-Davla ve Nasır el-Davla'nın Bağdat üzerindeki savaşı sonrasında yaşanan kıtlığı Miskawayh şöyle anlatır: İnsanlar hiç ekmek bulamayınca ölüleri, otları ve leşleri yediler. Evler ve mallar ekmekle satıldı ve köpekler sayıca çok fazla oldukları için ölülerin etini yediler. Zayıf olanlar hurma yemek için Basra'ya gittiler, ancak çoğu yolda telef oldu. Savaş sona erene ve yeni ürünler gelene kadar durum böyle devam etti, böylece fiyat sorunu çözüldü. {cite:tajarib-al-umam-surush-v6 s. 127-128}"
  id: "Kelaparan yang terjadi setelah perang Mu’izz al-Dawla dan Nasir al-Dawla memperebutkan Baghdad pada tahun 334 H, yang digambarkan oleh Miskawayh sebagai keadaan di mana orang-orang tidak memiliki roti sama sekali, sehingga mereka memakan mayat, rumput, dan bangkai. Rumah dan harta benda dijual per potong roti, dan anjing memakan daging mayat karena jumlahnya yang banyak. Orang-orang yang lemah pergi ke Basra untuk makan kurma, tetapi sebagian besar dari mereka binasa di perjalanan, sampai perselisihan berakhir dan panen baru tiba, sehingga harga pun kembali stabil. {cite:tajarib-al-umam-surush-v6 p. 127-128}."
