summary:
  ar: "المجاعة التي أعقبت حرب معز الدولة وناصر الدولة على بغداد سنة 334هـ، ويصفها مسكويه بأن الناس عدموا الخبز البتة فأكلوا الموتى والحشيش والميتة، وكانت الدور والعقارات تُباع بالرغفان، وأكلت الكلاب لحوم الموتى لكثرتهم، وخرج الضعفاء إلى البصرة لأكل التمر فهلك أكثرهم في الطريق، حتى زالت الفتنة ودخلت الغلات الجديدة فانحلّ السعر {cite:tajarib-al-umam-surush-v6 p. 127-128}."
  en: "The famine that followed the war of Mu'izz al-Dawla and Nasir al-Dawla for Baghdad in 334 AH. Miskawayh describes people without any bread eating the dead, grass and carrion, houses sold for loaves, dogs eating the unburied dead, and the weak setting out for Basra to eat dates and mostly dying on the road, until the fighting ended and the new harvest brought prices down {cite:tajarib-al-umam-surush-v6 p. 127-128}."
