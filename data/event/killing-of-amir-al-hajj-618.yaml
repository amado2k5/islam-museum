label: { ar: "قتل أمير الحاج أقباش ووقعة الحسن بن قتادة بمكة", en: "The killing of the pilgrimage commander Aqbash and the battle of al-Hasan ibn Qatada in Mecca", es: "El asesinato del comandante de la peregrinación Aqbash y la batalla de al-Hasan ibn Qatada en La Meca", fr: "L'assassinat du commandant du pèlerinage Aqbash et la bataille d'al-Hasan ibn Qatada à La Mecque" }
summary:
  ar: "في سنة ثمان عشرة وستمائة سار حاج العراق وعليهم أمير يقال له أقباش مملوك الخليفة الناصر حسن السيرة مع الحاج كثير الحماية، فقصده راجح بن قتادة وبذل له وللخليفة مالاً ليساعده على ملك مكة من أخيه الحسن، فوصلوا مكة ونزلوا بالزاهر فخرج إليهم الحسن في جموع من العرب، وتقدم أمير الحاج من بين يدي عسكره منفرداً وصعد الجبل إذلالاً بنفسه إذ لا يقدم أحد عليه فأحاط به أصحاب الحسن وقتلوه وعلّقوا رأسه فانهزم عسكر أمير المؤمنين، وأحاطوا بالحاج لينهبوهم فأرسل إليهم الحسن عمامته أماناً للحجاج فعاد أصحابه ولم ينهبوا منهم شيئاً وأذن لهم في دخول مكة فأقاموا عشرة أيام يفعلون الحج والبيع وعادوا إلى العراق سالمين، وعظم الأمر على الخليفة فوصلت رسل الحسن يعتذرون ويطلبون العفو فأجيب إليه {cite:kamil-ibn-al-athir p. 426}."
  en: "In the year 618 the pilgrims of Iraq set out under a commander called Aqbash, a mamluk of the caliph al-Nasir, who was of good conduct and gave the pilgrims much protection. Rajih ibn Qatada approached him and offered him, and the caliph, money to help him seize Mecca from his brother al-Hasan. They reached Mecca and camped at al-Zahir; al-Hasan came out against them with bands of Arabs. The pilgrimage commander went out ahead of his army alone and climbed the mountain, humbling himself, since no one would dare approach him. The men of al-Hasan surrounded him and killed him and hung up his head, and the army of the Commander of the Faithful fled. They then surrounded the pilgrims to plunder them; al-Hasan sent them his turban as a guarantee of safety for the pilgrims, so his men went back and took nothing from them, and he allowed them to enter Mecca. They stayed ten days performing the rites of pilgrimage and trading, and returned safely to Iraq. The matter weighed heavily on the caliph, and messengers from al-Hasan arrived apologising and seeking pardon, which was granted {cite:kamil-ibn-al-athir p. 426}."
  es: "En el año 618, los peregrinos de Irak partieron bajo el mando de Aqbash, un mameluco del califa al-Nasir, de buena conducta, que les brindó gran protección. Rajih ibn Qatada se acercó a él y le ofreció, junto con el califa, dinero para ayudarlo a arrebatarle La Meca a su hermano al-Hasan. Llegaron a La Meca y acamparon en al-Zahir; al-Hasan salió a su encuentro con bandas de árabes. El comandante de la peregrinación se adelantó a su ejército y escaló la montaña, humillándose, ya que nadie se atrevía a acercarse. Los hombres de al-Hasan lo rodearon, lo mataron y colgaron su cabeza, y el ejército del Comandante de los Creyentes huyó. Luego rodearon a los peregrinos para saquearlos; al-Hasan les envió su turbante como garantía de seguridad para los peregrinos, por lo que sus hombres regresaron sin llevarse nada, y él les permitió entrar en La Meca. Permanecieron allí diez días realizando los ritos de la peregrinación y comerciando, y regresaron sanos y salvos a Irak. El asunto pesaba mucho sobre el califa, y llegaron mensajeros de al-Hasan pidiendo disculpas y solicitando el perdón, que fue concedido {cite:kamil-ibn-al-athir p. 426}."
  fr: "En 618, les pèlerins d'Irak partirent sous le commandement d'Aqbash, un mamelouk du calife al-Nasir, réputé pour sa bonne conduite et qui leur offrit une grande protection. Rajih ibn Qatada l'approcha et lui proposa, ainsi qu'au calife, de l'argent pour l'aider à s'emparer de La Mecque, alors aux mains de son frère al-Hasan. Ils atteignirent La Mecque et campèrent à al-Zahir. Al-Hasan sortit à leur rencontre avec des bandes d'Arabes. Le commandant du pèlerinage s'avança seul en avant de son armée et gravit la montagne, s'humiliant, car personne n'oserait l'approcher. Les hommes d'al-Hasan l'encerclèrent, le tuèrent et exposèrent sa tête. L'armée du Commandeur des Croyants prit la fuite. Ils encerclèrent ensuite les pèlerins pour les piller. Al-Hasan leur envoya son turban en gage de sécurité. Ses hommes rebroussèrent chemin les mains vides et il leur permit d'entrer à La Mecque. Ils restèrent dix jours à accomplir les rites du pèlerinage et à commercer, puis retournèrent sains et saufs en Irak. L'affaire pesait lourdement sur le calife, et des messagers d'al-Hasan arrivèrent pour présenter leurs excuses et implorer le pardon, qui leur fut accordé (voir Kamil ibn al-Athir, p. 426)."
