label: { ar: "قتل أمير الحاج أقباش ووقعة الحسن بن قتادة بمكة" }
summary:
  ar: "في سنة ثمان عشرة وستمائة سار حاج العراق وعليهم أمير يقال له أقباش مملوك الخليفة الناصر حسن السيرة مع الحاج كثير الحماية، فقصده راجح بن قتادة وبذل له وللخليفة مالاً ليساعده على ملك مكة من أخيه الحسن، فوصلوا مكة ونزلوا بالزاهر فخرج إليهم الحسن في جموع من العرب، وتقدم أمير الحاج من بين يدي عسكره منفرداً وصعد الجبل إذلالاً بنفسه إذ لا يقدم أحد عليه فأحاط به أصحاب الحسن وقتلوه وعلّقوا رأسه فانهزم عسكر أمير المؤمنين، وأحاطوا بالحاج لينهبوهم فأرسل إليهم الحسن عمامته أماناً للحجاج فعاد أصحابه ولم ينهبوا منهم شيئاً وأذن لهم في دخول مكة فأقاموا عشرة أيام يفعلون الحج والبيع وعادوا إلى العراق سالمين، وعظم الأمر على الخليفة فوصلت رسل الحسن يعتذرون ويطلبون العفو فأجيب إليه {cite:kamil-ibn-al-athir p. 426}."
