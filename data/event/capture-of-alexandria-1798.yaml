label: { ar: "دخول الفرنسيس الإسكندرية ⁦(محرم 1213هـ / تموز 1798م)⁩", en: "The French take Alexandria (Muharram 1213 / July 1798)", ur: "فرانسیسیوں کا اسکندریہ پر قبضہ ⁦(محرم 1213ھ / جولائی 1798ء)⁩" }
summary:
  ar: "نزول الفرنسيس على ثغر الإسكندرية في أول الحملة الفرنسية على مصر، كما يرويه الجبرتي: جاءت مراكب الإنكليز قبلهم بعشرة أيام تحذّر أهل الثغر فردّهم السيد محمد كريّم، ثم وردت عمارة الفرنسيس يوم الاثنين ثامن عشر المحرم سنة 1213هـ فنزلوا ليلاً بجهة العجمي، وأصبحوا حول البلد «كالجراد المنتشر»، فانهزم كاشف البحيرة والعربان وقاتل أهل الثغر من البيوت حتى طلبوا الأمان، فرفع الفرنسيس أعلامهم وألزموا الأعيان بجمع السلاح ووضع «الجوكار» ذي الألوان الثلاثة على صدورهم {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
  en: "The French landing at Alexandria at the start of the French campaign in Egypt, as al-Jabarti tells it: an English squadron came ten days earlier to warn the port and was rebuffed by al-Sayyid Muhammad Kurayyim; the French fleet arrived on Monday 18 Muharram 1213, landed by night near al-Ajami and by morning surrounded the town 'like swarming locusts'. The governor of al-Buhayra and the Bedouin fled, the townsmen fought from their houses until they asked for safe-conduct, and the French raised their flags and made the notables collect weapons and wear the three-coloured cockade {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
