label: { ar: "دخول الفرنسيس الإسكندرية ⁦(محرم 1213هـ / تموز 1798م)⁩", en: "The French take Alexandria (Muharram 1213 / July 1798)", ur: "فرانسیسیوں کا اسکندریہ پر قبضہ ⁦(محرم 1213ھ / جولائی 1798ء)⁩", fr: "Les Français prennent Alexandrie (Muharram 1213 / juillet 1798)", es: "Los franceses toman Alejandría (Muharram de 1213 / julio de 1798)", tr: "Fransızların İskenderiye'ye girişi (Muharrem 1213 Hicri / Temmuz 1798 Miladi)", id: "Masuknya bangsa Prancis ke Alexandria (Muharram 1213 H / Juli 1798 M)" }
summary:
  ar: "نزول الفرنسيس على ثغر الإسكندرية في أول الحملة الفرنسية على مصر، كما يرويه الجبرتي: جاءت مراكب الإنكليز قبلهم بعشرة أيام تحذّر أهل الثغر فردّهم السيد محمد كريّم، ثم وردت عمارة الفرنسيس يوم الاثنين ثامن عشر المحرم سنة 1213هـ فنزلوا ليلاً بجهة العجمي، وأصبحوا حول البلد «كالجراد المنتشر»، فانهزم كاشف البحيرة والعربان وقاتل أهل الثغر من البيوت حتى طلبوا الأمان، فرفع الفرنسيس أعلامهم وألزموا الأعيان بجمع السلاح ووضع «الجوكار» ذي الألوان الثلاثة على صدورهم {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
  en: "The French landing at Alexandria at the start of the French campaign in Egypt, as al-Jabarti tells it: an English squadron came ten days earlier to warn the port and was rebuffed by al-Sayyid Muhammad Kurayyim; the French fleet arrived on Monday 18 Muharram 1213, landed by night near al-Ajami and by morning surrounded the town 'like swarming locusts'. The governor of al-Buhayra and the Bedouin fled, the townsmen fought from their houses until they asked for safe-conduct, and the French raised their flags and made the notables collect weapons and wear the three-coloured cockade {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
  fr: "Le débarquement français à Alexandrie au début de l'expédition française en Égypte, tel que le raconte al-Jabarti : une escadre anglaise vint dix jours plus tôt avertir le port et fut éconduite par al-Sayyid Muhammad Kurayyim ; la flotte française arriva le lundi 18 Muharram 1213, débarqua de nuit près d'al-Ajami et, au matin, encerclait la ville « comme des sauterelles qui pullulent ». Le gouverneur d'al-Buhayra et les Bédouins s'enfuirent, les habitants combattirent depuis leurs maisons jusqu'à demander un sauf-conduit, et les Français hissèrent leurs drapeaux et obligèrent les notables à rassembler les armes et à porter la cocarde tricolore {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
  es: "El desembarco francés en Alejandría al comienzo de la campaña francesa en Egipto, según relata al-Jabarti: un escuadrón inglés llegó diez días antes para advertir al puerto y fue rechazado por al-Sayyid Muhammad Kurayyim; la flota francesa llegó el lunes 18 de Muharram de 1213, desembarcó de noche cerca de al-Ajami y por la mañana rodeó la ciudad \"como una plaga de langostas\". El gobernador de al-Buhayra y los beduinos huyeron, los habitantes de la ciudad lucharon desde sus casas hasta que pidieron salvoconducto, y los franceses izaron sus banderas e hicieron que los notables recogieran armas y llevaran la escarapela tricolor {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
  ur: "مصر میں فرانسیسی مہم کے آغاز پر فرانسیسیوں کا اسکندریہ پر اترنا، جیسا کہ الجبارتی بتاتا ہے: دس دن پہلے ایک انگریز دستہ بندرگاہ کو خبردار کرنے آیا تھا اور اسے السید محمد قریئم نے جھڑک دیا تھا۔ فرانسیسی بحری بیڑہ پیر 18 محرم 1213 کو پہنچا، رات کو العجمی کے قریب اترا اور صبح تک اس قصبے کو 'ٹڈیوں کے غول کی طرح' گھیر لیا۔ البحیرہ کے گورنر اور بدوین بھاگ گئے، شہر کے لوگ اپنے گھروں سے لڑتے رہے یہاں تک کہ انہوں نے حفاظت کا مطالبہ کیا، اور فرانسیسیوں نے اپنے جھنڈے اٹھائے اور معززین کو ہتھیار جمع کرنے اور تین رنگوں کا کاکڈ پہنانے پر مجبور کیا۔ 33-34}۔"
  tr: "El-Cebârî'nin anlattığına göre, Fransızların Mısır seferinin başlangıcında İskenderiye limanına çıkarma yapmaları şöyle gerçekleşti: İngiliz gemileri, liman halkını uyarmak için on gün önce gelmişti, ancak Muhammed Kerim onları geri çevirdi. Bunun üzerine Fransız filosu, Hicri 1213 yılının Muharrem ayının 18. Pazartesi günü geldi ve geceleyin El-Acemi yönüne doğru karaya çıktı. Sabahleyin şehri \"çekirge sürüsü gibi\" kuşattılar. Göl komutanı ve Bedeviler yenilgiye uğradı ve liman halkı evlerinden savaşarak güvenli bir yere sığınmak istedi. Fransızlar bayraklarını kaldırdılar ve ileri gelenleri silah toplamaya ve göğüslerine üç renkli \"cüker\" takmaya zorladılar. {cite:ajaib-al-athar-moreh-v3 s. 33-34}"
  id: "Pendaratan pasukan Prancis di pelabuhan Alexandria pada awal kampanye Prancis di Mesir, sebagaimana diriwayatkan oleh Al-Jabarti: Kapal-kapal Inggris datang sepuluh hari sebelumnya untuk memperingatkan penduduk pelabuhan, tetapi Tuan Muhammad Karim mengusir mereka kembali. Kemudian armada Prancis tiba pada hari Senin, tanggal 18 Muharram 1213 H, dan mendarat pada malam hari ke arah Al-Ajami, dan pada pagi harinya mereka mengepung kota \"seperti belalang yang menyebar.\" Komandan danau dan suku Badui dikalahkan, dan penduduk pelabuhan berjuang dari rumah-rumah mereka sampai mereka meminta perlindungan. Pasukan Prancis mengibarkan bendera mereka dan memaksa para tokoh untuk mengumpulkan senjata dan mengenakan \"jokar\" dengan tiga warna di dada mereka. {cite:ajaib-al-athar-moreh-v3 p. 33-34}."
