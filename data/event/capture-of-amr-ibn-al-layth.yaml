label: { ar: "أسر إسماعيل بن أحمد لعمرو بن الليث" }
summary:
  ar: "في سنة سبع وثمانين ومائتين ورد الخبر بأن إسماعيل بن أحمد أسر عمرو بن الليث الصفار واستباح عسكره، وذُكر أن المعتضد مدح إسماعيل وذم عمراً في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}.، وعند المسعودي أدخل مدينة السلام في جمادى الأولى سنة ثمان وثمانين قدم به عبد الله بن الفتح رسول السلطان، فشهر وأركب على جمل فالج عليه دراعة ديباج وخلفه بدر والوزير القاسم بن عبيد الله في الجيش فأتوا به الثريا فرآه المعتضد ثم أدخل المطامير، وهو يرفع يديه يدعو فقال فيه محمد بن بسام أيها المغتر بالدنيا أما أبصرت عمرا مقبلاً قد أركب الفالج بعد الملك قسرا وعليه برنس السخطة {cite:muruj-al-dhahab p. 628-631}"
