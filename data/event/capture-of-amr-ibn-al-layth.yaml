class: event
kind: other
label: { ar: "أسر إسماعيل بن أحمد لعمرو بن الليث", en: "Capture of Amr ibn al-Layth by Isma'il ibn Ahmad" }
summary:
  ar: "في سنة سبع وثمانين ومائتين ورد الخبر بأن إسماعيل بن أحمد أسر عمرو بن الليث الصفار واستباح عسكره، وذُكر أن المعتضد مدح إسماعيل وذم عمراً في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي أدخل مدينة السلام في جمادى الأولى سنة ثمان وثمانين قدم به عبد الله بن الفتح رسول السلطان، فشهر وأركب على جمل فالج عليه دراعة ديباج وخلفه بدر والوزير القاسم بن عبيد الله في الجيش فأتوا به الثريا فرآه المعتضد ثم أدخل المطامير، وهو يرفع يديه يدعو فقال فيه محمد بن بسام أيها المغتر بالدنيا أما أبصرت عمرا مقبلاً قد أركب الفالج بعد الملك قسرا وعليه برنس السخطة {cite:muruj-al-dhahab p. 628-631}، وعند ابن الجوزي وفي سنة 287هـ عبر إسماعيل بن أحمد نهر بلخ يريد عمرو بن الليث الصفار فظفر به وكان أهل بلخ ملوه وضجروا من نزول أمه ببعض منازلهم ومد يده إلى أموالهم فانهزم عمرو وأخذ وجيء به إلى إسماعيل فقام إليه وقبل بين عينيه وقال عزيز علي يا أخي ما نالك وغسل وجهه وخلع عليه وحلف أنه لا يؤذيه ولا يسلمه فجاءه كتاب المعتضد أن يسلم عمرو بن الليث فسلمه، وكان عمرو يقول لو أردت أن أعمل جسراً من ذهب على نهر بلخ لفعلت وكان يحمل فرشه ومطبخه على ستمائة جمل فأفضى به الأمر إلى القيد والذل {cite:muntazam-ibn-al-jawzi p. 309-310}"
  en: "In 287 news came that Isma'il ibn Ahmad had captured Amr ibn al-Layth al-Saffar and plundered his army, and it is recorded that al-Mu'tadid praised Isma'il and blamed Amr for it {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. In al-Mas'udi, Amr was brought into Madinat al-Salam in Jumada I 288 by Abd Allah ibn al-Fath, the sultan's envoy; he was paraded, mounted on a paralysed camel and wearing a silk robe, with Badr and the vizier al-Qasim ibn Ubayd Allah in the army behind him. They brought him to al-Thurayya, where al-Mu'tadid saw him, and then he was put into the dungeons, raising his hands in supplication. Muhammad ibn Bassam said of him: 'You who are deceived by the world, did you not see Amr coming, made to ride the paralysed one after kingship by force, wearing the cloak of wrath?' {cite:muruj-al-dhahab p. 628-631}. In Ibn al-Jawzi: in 287 Isma'il ibn Ahmad crossed the river of Balkh to face Amr ibn al-Layth al-Saffar and defeated him; the people of Balkh had grown weary of him and resented his mother's lodging in some of their dwellings, and he had reached out for their property. Amr fled, was taken and brought to Isma'il, who rose, kissed him between the eyes, said 'It grieves me, my brother, what has befallen you', washed his face, robed him, and swore that he would neither harm him nor surrender him. Then a letter from al-Mu'tadid came ordering Amr's handover, and Isma'il handed him over. Amr used to say: were I to wish to build a bridge of gold over the river of Balkh, I could; he had carried his bedding and kitchen on six hundred camels, and it ended with him in chains and humiliation {cite:muntazam-ibn-al-jawzi p. 309-310}."
