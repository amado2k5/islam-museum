id: event/capture-of-amr-ibn-al-layth
class: event
kind: other
label: { ar: "أسر إسماعيل بن أحمد لعمرو بن الليث", en: "Capture of Amr ibn al-Layth by Isma'il ibn Ahmad", fr: "La capture d'Amr ibn al-Layth par Isma'il ibn Ahmad", es: "Captura de Amr ibn al-Layth por Isma'il ibn Ahmad", ur: "عمرو بن لیث کی گرفتاری بذریعہ اسماعیل بن احمد", tr: "İsmail ibn Ahmed, Amr ibn al-Layth'i esir aldı.", id: "Ismail bin Ahmad menangkap Amr bin al-Layth." }
summary:
  ar: "في سنة سبع وثمانين ومائتين ورد الخبر بأن إسماعيل بن أحمد أسر عمرو بن الليث الصفار واستباح عسكره، وذُكر أن المعتضد مدح إسماعيل وذم عمراً في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي أدخل مدينة السلام في جمادى الأولى سنة ثمان وثمانين قدم به عبد الله بن الفتح رسول السلطان، فشهر وأركب على جمل فالج عليه دراعة ديباج وخلفه بدر والوزير القاسم بن عبيد الله في الجيش فأتوا به الثريا فرآه المعتضد ثم أدخل المطامير، وهو يرفع يديه يدعو فقال فيه محمد بن بسام أيها المغتر بالدنيا أما أبصرت عمرا مقبلاً قد أركب الفالج بعد الملك قسرا وعليه برنس السخطة {cite:muruj-al-dhahab p. 628-631}، وعند ابن الجوزي وفي سنة 287هـ عبر إسماعيل بن أحمد نهر بلخ يريد عمرو بن الليث الصفار فظفر به وكان أهل بلخ ملوه وضجروا من نزول أمه ببعض منازلهم ومد يده إلى أموالهم فانهزم عمرو وأخذ وجيء به إلى إسماعيل فقام إليه وقبل بين عينيه وقال عزيز علي يا أخي ما نالك وغسل وجهه وخلع عليه وحلف أنه لا يؤذيه ولا يسلمه فجاءه كتاب المعتضد أن يسلم عمرو بن الليث فسلمه، وكان عمرو يقول لو أردت أن أعمل جسراً من ذهب على نهر بلخ لفعلت وكان يحمل فرشه ومطبخه على ستمائة جمل فأفضى به الأمر إلى القيد والذل {cite:muntazam-ibn-al-jawzi p. 309-310}"
  en: "In 287 news came that Isma'il ibn Ahmad had captured Amr ibn al-Layth al-Saffar and plundered his army, and it is recorded that al-Mu'tadid praised Isma'il and blamed Amr for it {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. In al-Mas'udi, Amr was brought into Madinat al-Salam in Jumada I 288 by Abd Allah ibn al-Fath, the sultan's envoy; he was paraded, mounted on a paralysed camel and wearing a silk robe, with Badr and the vizier al-Qasim ibn Ubayd Allah in the army behind him. They brought him to al-Thurayya, where al-Mu'tadid saw him, and then he was put into the dungeons, raising his hands in supplication. Muhammad ibn Bassam said of him: 'You who are deceived by the world, did you not see Amr coming, made to ride the paralysed one after kingship by force, wearing the cloak of wrath?' {cite:muruj-al-dhahab p. 628-631}. In Ibn al-Jawzi: in 287 Isma'il ibn Ahmad crossed the river of Balkh to face Amr ibn al-Layth al-Saffar and defeated him; the people of Balkh had grown weary of him and resented his mother's lodging in some of their dwellings, and he had reached out for their property. Amr fled, was taken and brought to Isma'il, who rose, kissed him between the eyes, said 'It grieves me, my brother, what has befallen you', washed his face, robed him, and swore that he would neither harm him nor surrender him. Then a letter from al-Mu'tadid came ordering Amr's handover, and Isma'il handed him over. Amr used to say: were I to wish to build a bridge of gold over the river of Balkh, I could; he had carried his bedding and kitchen on six hundred camels, and it ended with him in chains and humiliation {cite:muntazam-ibn-al-jawzi p. 309-310}."
  fr: "En 287 arriva la nouvelle qu'Isma'il ibn Ahmad avait capturé Amr ibn al-Layth al-Saffar et pillé son armée, et il est rapporté qu'al-Mu'tadid loua Isma'il et blâma Amr à ce propos {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Chez al-Mas'udi, Amr fut amené à Madinat al-Salam en Jumada I 288 par Abd Allah ibn al-Fath, l'envoyé du sultan ; on le promena, monté sur un chameau paralysé et vêtu d'une robe de soie, avec Badr et le vizir al-Qasim ibn Ubayd Allah dans l'armée derrière lui. On le conduisit à al-Thurayya, où al-Mu'tadid le vit, puis il fut mis aux cachots, levant les mains en supplication. Muhammad ibn Bassam dit de lui : « Toi que le monde abuse, n'as-tu pas vu venir Amr, qu'on fit monter sur le paralysé après la royauté par la force, revêtu du manteau de la colère ? » {cite:muruj-al-dhahab p. 628-631}. Chez Ibn al-Jawzi : en 287, Isma'il ibn Ahmad franchit le fleuve de Balkh pour affronter Amr ibn al-Layth al-Saffar et le vainquit ; les gens de Balkh s'étaient lassés de lui et s'irritaient de ce que sa mère loge dans certaines de leurs demeures, et il avait porté la main sur leurs biens. Amr s'enfuit, fut pris et amené à Isma'il, qui se leva, l'embrassa entre les yeux, dit « Il m'afflige, mon frère, ce qui t'est arrivé », lui lava le visage, le revêtit d'une robe, et jura qu'il ne lui ferait aucun mal et ne le livrerait pas. Puis vint une lettre d'al-Mu'tadid ordonnant de livrer Amr, et Isma'il le livra. Amr disait : si je voulais bâtir un pont d'or sur le fleuve de Balkh, je le pourrais ; il avait transporté sa literie et sa cuisine sur six cents chameaux, et il finit dans les chaînes et l'humiliation {cite:muntazam-ibn-al-jawzi p. 309-310}."
  es: "En 287 llegó la noticia de que Isma'il ibn Ahmad había capturado a Amr ibn al-Layth al-Saffar y saqueado su ejército, y se registra que al-Mu'tadid alabó a Isma'il y culpó a Amr por ello {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. En al-Mas'udi, Amr fue llevado a Madinat al-Salam en Jumada I 288 por Abd Allah ibn al-Fath, el enviado del sultán; fue exhibido, montado en un camello paralizado y vistiendo una túnica de seda, con Badr y el visir al-Qasim ibn Ubayd Allah en el ejército detrás de él. Lo llevaron a al-Thurayya, donde al-Mu'tadid lo vio, y luego lo metieron en las mazmorras, levantando las manos en súplica. Muhammad ibn Bassam dijo de él: 'Vosotros que estáis engañados por el mundo, ¿no visteis venir a Amr, obligado a montar al paralítico tras el trono por la fuerza, vistiendo el manto de la ira?' {cite:muruj-al-dhahab p. 628-631}. En Ibn al-Jawzi: en 287 Isma'il ibn Ahmad cruzó el río Balkh para enfrentarse a Amr ibn al-Layth al-Saffar y lo derrotó; la gente de Balkh se había cansado de él y se resintió de que su madre se alojara en algunas de sus viviendas, y él había intentado apoderarse de sus propiedades. Amr huyó, fue capturado y llevado ante Isma'il, quien se levantó, lo besó entre los ojos, le dijo: «Me duele, hermano mío, lo que te ha sucedido», le lavó la cara, lo vistió y juró que no le haría daño ni lo entregaría. Entonces llegó una carta de al-Mu'tadid ordenando la entrega de Amr, e Isma'il lo entregó. Amr solía decir: «Si quisiera construir un puente de oro sobre el río Balkh, podría». Había transportado su ropa de cama y su cocina en seiscientos camellos, y todo terminó con él encadenado y humillado {cita:muntazam-ibn-al-jawzi págs. 309-310}."
  ur: "287 میں خبر آئی کہ اسماعیل بن احمد نے عمرو بن لیث الصفر کو پکڑ لیا اور اس کے لشکر کو لوٹ لیا اور یہ بھی درج ہے کہ المتدید نے اسماعیل کی تعریف کی اور عمرو کو اس کا ذمہ دار ٹھہرایا۔ {حوالہ: طبری-تاریخ-ابو الفضل ج10 ص77}۔ المسعودی میں، عمرو کو سلطان کے ایلچی عبد اللہ بن الفتح نے جمادی الثانی 288 میں مدینہ السلام میں لایا تھا۔ آپ کو فالج زدہ اونٹ پر سوار کیا گیا اور ریشمی لباس پہنے ہوئے، بدر اور وزیر القاسم بن عبید اللہ اس کے پیچھے لشکر میں تھے۔ وہ اسے الثوریہ لے آئے، جہاں المتدید نے اسے دیکھا، اور پھر اسے عقوبت خانوں میں ڈال دیا گیا، دعا میں ہاتھ اٹھا کر۔ محمد بن بسام نے ان کے بارے میں کہا: 'تم جو دنیا کے فریب میں مبتلا ہو، کیا تم نے عمرو کو آتے ہوئے نہیں دیکھا، جب فالج زدہ کو بادشاہی کے بعد غضب کی چادر اوڑھ کر سوار کرایا گیا؟' {حوالہ: مروج الذہب ص۱۴۲۔ 628-631}۔ ابن الجوزی میں ہے: 287 میں اسماعیل بن احمد نے عمرو بن لیث الصفر کا مقابلہ کرنے کے لیے بلخ کا دریا عبور کیا اور اسے شکست دی۔ بلخ کے لوگ اس سے تنگ آچکے تھے اور اس کی ماں کے اپنے مکانوں میں رہنے سے ناراض ہو گئے تھے اور اس نے ان کی جائیداد کے لیے ہاتھ اٹھا لیا تھا۔ عمرو بھاگا، اسمٰعیل کے پاس لایا گیا، اس نے اٹھ کر اس کی آنکھوں کے درمیان بوسہ دیا، کہا، میرے بھائی، آپ پر کیا گزری ہے، اس سے مجھے دکھ ہوا، اس کا چہرہ دھویا، اسے کپڑے پہنائے، اور قسم کھائی کہ وہ اسے نقصان نہیں پہنچائے گا اور نہ ہی اسے ہتھیار ڈالے گا۔ پھر معتدد کی طرف سے ایک خط آیا جس میں عمرو کے حوالے کرنے کا حکم دیا گیا اور اسماعیل نے اسے ان کے حوالے کر دیا۔ عمرو کہتا تھا: اگر میں بلخ کے دریا پر سونے کا پل بنانا چاہتا تو کر سکتا۔ اس نے اپنا بستر اور باورچی خانہ چھ سو اونٹوں پر لاد رکھا تھا اور اس کا انجام اس کے ساتھ زنجیروں اور ذلت میں پڑا۔ 309-310}۔"
  tr: "Hicri 287 yılında, İsmail ibn Ahmed'in Amr ibn al-Layth al-Saffar'ı yakalayıp ordusunu yağmaladığı haberi geldi. Al-Mu'tadid'in İsmail'i övdüğü ve Amr'ı bu olaydan dolayı kınadığı belirtildi. {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Al-Mas'udi'ye göre, Hicri 288 yılının Cemâdeü'l-Ula ayında Bağdat'a girdi. Sultanın elçisi Abdullah ibn al-Fath onu getirdi. Üzerinde işlemeli bir elbise bulunan İsmail, Badr ve vezir al-Qasim ibn Ubayd Allah'ın da arkasında orduyla birlikte deveye bindirilerek törenle getirildi. Onu al-Turayya'ya götürdüler ve orada al-Mu'tadid onu gördü. Sonra ellerini yalvarırcasına kaldırarak zindanlara götürüldü. Muhammed ibn Bassam onun hakkında şöyle dedi: \"Ey dünyanın aldatmacasına kapılanlar, Amr'ın krallığının ardından deveye zorla bindirilerek, gazap pelerinini giymiş halde geldiğini görmediniz mi?\" {kaynak: Muruj-al-Dhahab s. 628-631}. İbn el-Cevzi'ye göre, Hicri 287 yılında İsmail ibn Ahmed, Amr ibn el-Leyth el-Saffar'ı yakalamak amacıyla Belh Nehri'ni geçti ve onu yakaladı. Belh halkı ondan bıkmıştı ve annesinin bazı evlerinde kalmasından ve paralarına göz dikmesinden rahatsızdı. Böylece Amr yenildi, yakalandı ve İsmail'e getirildi. İsmail ona doğru eğildi, gözlerinin arasına bir öpücük kondurdu ve \"Kardeşim, başına gelenlerden dolayı üzgünüm\" dedi. Yüzünü yıkadı, ona şeref elbisesi verdi ve ona zarar vermeyeceğine ve onu teslim etmeyeceğine yemin etti. Sonra Mu'tedid'den Amr ibn el-Layth'i teslim etmesini emreden bir mektup geldi, o da onu teslim etti. Amr, \"Eğer Belh Nehri üzerine altından bir köprü inşa etmek isteseydim, bunu yapabilirdim\" derdi. Yatak takımlarını ve mutfak eşyalarını altı yüz deveyle taşırdı, ancak bu durum onu zincire vurulmaya ve aşağılanmaya mahkum etti. {cite:muntazam-ibn-al-jawzi s. 309-310}"
  id: "Pada tahun 287 H, kabar sampai bahwa Ismail bin Ahmad telah menangkap Amr bin al-Layth al-Saffar dan menjarah pasukannya. Disebutkan bahwa al-Mu'tadid memuji Ismail dan mengutuk Amr atas hal ini. {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Menurut al-Mas'udi, ia memasuki Baghdad pada Jumada al-Ula tahun 288 H. Abdullah bin al-Fath, utusan Sultan, membawanya. Ia diarak dan dinaikkan ke atas unta, mengenakan jubah brokat, dengan Badr dan wazir al-Qasim bin Ubayd Allah di belakangnya dalam pasukan. Mereka membawanya ke al-Thurayya, tempat al-Mu'tadid melihatnya. Kemudian ia dibawa ke penjara bawah tanah, sambil mengangkat tangannya memohon. Muhammad ibn Bassam berkata tentangnya, \"Wahai kalian yang tertipu oleh dunia, tidakkah kalian melihat Amr datang, terpaksa menunggang unta setelah menjadi raja, mengenakan jubah kemarahan?\" {kutip:muruj-al-dhahab hlm. 628-631}, dan menurut Ibn al-Jawzi, pada tahun 287 H, Ismail ibn Ahmad menyeberangi Sungai Balkh dengan maksud untuk menangkap Amr ibn al-Layth al-Saffar, dan ia berhasil menangkapnya. Penduduk Balkh muak dengannya dan kesal karena ibunya tinggal di beberapa rumah mereka dan ia mengambil harta mereka. Maka Amr dikalahkan dan ditangkap lalu dibawa ke Ismail, yang berdiri di hadapannya dan menciumnya di antara kedua mata dan berkata, “Aku sedih, saudaraku, atas apa yang telah terjadi padamu.” Ia membasuh wajahnya dan memberinya jubah kehormatan serta bersumpah bahwa ia tidak akan menyakitinya atau menyerahkannya. Kemudian sebuah surat datang kepadanya dari al-Mu’tadid yang memerintahkannya untuk menyerahkan Amr ibn al-Layth, maka ia menyerahkannya. Amr biasa berkata, “Jika aku ingin membangun jembatan emas di atas Sungai Balkh, aku bisa melakukannya.” Ia biasa membawa perlengkapan tidur dan dapurnya dengan enam ratus unta, tetapi masalah itu membawanya pada belenggu dan penghinaan. {cite:muntazam-ibn-al-jawzi p. 309-310}"
