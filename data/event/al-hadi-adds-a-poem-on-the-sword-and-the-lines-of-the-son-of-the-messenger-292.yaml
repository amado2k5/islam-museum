id: event/al-hadi-adds-a-poem-on-the-sword-and-the-lines-of-the-son-of-the-messenger-292
class: event
kind: other
label:
  ar: "قصيدة السيوف وبيتان «أنا ابن رسول الله» في ختام الكتاب، ص280-281"
  en: "The poem on the sword and the two lines \"I am the son of the Messenger of God\" at the end of the letter, pp. 280-281"
  ur: "تلوار کی نظم اور دو شعر «میں رسول اللہ کا بیٹا ہوں» خط کے آخر میں، ص280-281"
summary:
  ar: "يضيف الهادي في أسفل كتابه قصيدة تقول إن السيوف وحدها تزجر أهل الضلالة، وإنه صفح طويلاً ثم آذنهم بالحرب واثقاً بنصر الله، ثم بيتين ينسب فيهما نفسه إلى رسول الله ووصيه."
  en: "Al-Hadi adds a poem saying only swords restrain people of error, that he forgave long and then gave notice of war trusting in God's help, and then two lines in which he names himself the son of the Messenger of God and of his legatee."
  ur: "ہادی ایک اور نظم جوڑتے ہیں جس میں کہا گیا ہے کہ گمراہوں کو صرف تلواریں روکتی ہیں، انہوں نے دیر تک معاف کیا پھر اللہ کی مدد پر بھروسا کرکے جنگ کی اطلاع دی؛ پھر دو شعر جن میں وہ اپنے آپ کو رسول اللہ اور ان کے وصی کی اولاد کہتے ہیں۔"
