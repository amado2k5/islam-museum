id: event/al-hadi-releases-the-qarmatian-prisoners-at-ibn-bistams-request-294
class: event
kind: other
label:
  ar: "إطلاق الهادي القرامطة الأسرى بطلب ابن بسطام، سنة 294هـ، ص347"
  en: "Al-Hadi releases the Qarmatian prisoners at Ibn Bistam's request, 294 AH, p. 347"
  ur: "ابن بسطام کی درخواست پر ہادی کا قرامطہ قیدیوں کو رہا کرنا، 294ھ، ص347"
  es: "Al-Hadi libera a los prisioneros qarmatianos a petición de Ibn Bistam, 294 AH, p. 347"
  fr: "Al-Hadi libère les prisonniers qarmates à la demande d'Ibn Bistam, 294 AH, p. 347"
  tr: "El-Hadi, H. 294 yılında İbn Bastam'ın isteği üzerine Karmatî mahkumları serbest bıraktı, s. 347"
  id: "Al-Hadi membebaskan para tawanan Qarmatian atas permintaan Ibnu Bastam, pada tahun 294 H, hal. 347"
summary:
  ar: "بعد أن لم يجب الهادي ابن بسطام إلى إطلاق علي بن الربيع، طلب القرامطة الذين أخذهم الهادي، فأطلقهم وردّ معهم سفير ابن بسطام."
  en: "After al-Hadi did not grant Ibn Bistam's request to free Ali ibn al-Rabi', Ibn Bistam asked for the Qarmatian prisoners whom al-Hadi had taken. Al-Hadi released them and sent Ibn Bistam's envoy back with them."
  ur: "ہادی نے ابن بسطام کی علی بن الربیع کو رہا کرنے کی درخواست نہیں مانی تو ابن بسطام نے وہ قرامطی قیدی مانگے جنہیں ہادی نے پکڑا تھا۔ ہادی نے انہیں رہا کیا اور ابن بسطام کا ایلچی انہی کے ساتھ واپس بھیج دیا۔"
  es: "Tras la negativa de al-Hadi a conceder la petición de Ibn Bistam de liberar a Ali ibn al-Rabi', Ibn Bistam solicitó la liberación de los prisioneros cármatas que al-Hadi había capturado. Al-Hadi los liberó y envió de vuelta con ellos al enviado de Ibn Bistam."
  fr: "Après le refus d'al-Hadi d'accéder à la demande d'Ibn Bistam de libérer Ali ibn al-Rabi', Ibn Bistam réclama les prisonniers qarmates qu'al-Hadi avait déportés. Al-Hadi les libéra et renvoya l'envoyé d'Ibn Bistam avec eux."
  tr: "Hadi ibn Bustam, Ali ibn el-Rabi'yi serbest bırakmayı reddettikten sonra, Hadi'nin aldığı Karmatilileri istedi; bunun üzerine Hadi onları serbest bıraktı ve İbn Bustam'ın elçisini onlarla birlikte geri gönderdi."
  id: "Setelah al-Hadi ibn Bustam menolak untuk membebaskan Ali ibn al-Rabi’, ia meminta kembali orang-orang Qarmatian yang telah ditangkap oleh al-Hadi, lalu ia membebaskan mereka dan mengirim kembali duta besar Ibn Bustam bersama mereka."
