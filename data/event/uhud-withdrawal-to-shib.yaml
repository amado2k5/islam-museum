label: { en: "Muslim withdrawal to the mountain pass at Uhud", ar: "الانسحاب المنظم إلى شعب الجبل في أحد" }
summary:
  ar: "لما تجمع حول النبي نحو ثلاثون صحابياً أخذ في الانسحاب المنظم إلى شعب الجبل يشق الطريق بين المشركين المهاجمين. في أثناء الانسحاب قتل أبي بن خلف بيده. قام المشركون بآخر هجوم حاولوا فيه الصعود إلى الجبل بقيادة أبي سفيان وخالد، فقاتل عمر ورهط من المهاجرين حتى أهبطوهم. استقر رسول الله في الشعب فغسلت فاطمة جرحه وكوته بحصيرة محروقة لوقف الدم. جاء محمد بن مسلمة بماء عذب فشرب منه النبي ودعا له. صلى النبي الظهر قاعداً من أثر الجراح {cite:mubarakpuri-raheeq p.278}."
  en: "When about thirty Companions had gathered around the Prophet he began an orderly withdrawal into the mountain gorge, cutting a path through the attacking polytheists. During the retreat he killed Ubayy ibn Khalaf with his own hand. The polytheists made a last attempt to climb the mountain under Abu Sufyan and Khalid, and Umar and a party of the Muhajirun fought until they drove them down. The Messenger of God settled in the gorge, where Fatima washed his wound and cauterised it with a burnt mat to stop the bleeding. Muhammad ibn Maslama brought fresh water from which the Prophet drank and prayed for him; he prayed the noon prayer sitting, from the effect of his wounds {cite:mubarakpuri-raheeq p.278}."
