label: { en: "Muslim withdrawal to the mountain pass at Uhud", ar: "الانسحاب المنظم إلى شعب الجبل في أحد", es: "Retirada musulmana al paso de montaña de Uhud.", fr: "Retraite musulmane vers le col de montagne d'Uhud", ur: "احد کے پہاڑی درے کی طرف مسلمانوں کا انخلاء" }
summary:
  ar: "لما تجمع حول النبي نحو ثلاثون صحابياً أخذ في الانسحاب المنظم إلى شعب الجبل يشق الطريق بين المشركين المهاجمين. في أثناء الانسحاب قتل أبي بن خلف بيده. قام المشركون بآخر هجوم حاولوا فيه الصعود إلى الجبل بقيادة أبي سفيان وخالد، فقاتل عمر ورهط من المهاجرين حتى أهبطوهم. استقر رسول الله في الشعب فغسلت فاطمة جرحه وكوته بحصيرة محروقة لوقف الدم. جاء محمد بن مسلمة بماء عذب فشرب منه النبي ودعا له. صلى النبي الظهر قاعداً من أثر الجراح {cite:mubarakpuri-raheeq p.278}."
  en: "When about thirty Companions had gathered around the Prophet he began an orderly withdrawal into the mountain gorge, cutting a path through the attacking polytheists. During the retreat he killed Ubayy ibn Khalaf with his own hand. The polytheists made a last attempt to climb the mountain under Abu Sufyan and Khalid, and Umar and a party of the Muhajirun fought until they drove them down. The Messenger of God settled in the gorge, where Fatima washed his wound and cauterised it with a burnt mat to stop the bleeding. Muhammad ibn Maslama brought fresh water from which the Prophet drank and prayed for him; he prayed the noon prayer sitting, from the effect of his wounds {cite:mubarakpuri-raheeq p.278}."
  es: "Cuando unos treinta Compañeros se reunieron alrededor del Profeta, este inició una retirada ordenada hacia el desfiladero de la montaña, abriéndose paso entre los politeístas que lo atacaban. Durante la retirada, mató a Ubayy ibn Khalaf con sus propias manos. Los politeístas hicieron un último intento de escalar la montaña bajo el mando de Abu Sufyan y Khalid, y Umar y un grupo de los Muhajirun lucharon hasta que los hicieron descender. El Mensajero de Dios se instaló en el desfiladero, donde Fátima le lavó la herida y la cauterizó con una estera quemada para detener la hemorragia. Muhammad ibn Maslama le trajo agua fresca de la que bebió y oró por él; rezó la oración del mediodía sentado, a causa de sus heridas {cite:mubarakpuri-raheeq p.278}."
  fr: "Lorsque trente Compagnons environ se furent rassemblés autour du Prophète, celui-ci entreprit une retraite ordonnée dans la gorge de la montagne, se frayant un chemin à travers les polythéistes qui l'attaquaient. Durant la retraite, il tua Ubayy ibn Khalaf de sa propre main. Les polythéistes tentèrent une dernière fois d'escalader la montagne sous la conduite d'Abu Sufyan et de Khalid, mais Umar et un groupe de Muhajirun les repoussèrent. Le Messager de Dieu s'installa dans la gorge, où Fatima lava sa blessure et la cautérisa avec une natte brûlée pour arrêter le saignement. Muhammad ibn Maslama apporta de l'eau fraîche que le Prophète but et pria pour lui; il accomplit la prière de midi assis, malgré ses blessures (voir Mubarakpuri-Raheeq, p. 278)."
  ur: "جب تیس کے قریب صحابہ رسول اللہ کے گرد جمع ہو گئے تو آپ نے حملہ آور مشرکوں کا راستہ کاٹتے ہوئے پہاڑی گھاٹی میں منظم طور پر پیچھے ہٹنا شروع کیا۔ اعتکاف کے دوران اس نے ابی بن خلف کو اپنے ہاتھ سے قتل کر دیا۔ مشرکین نے ابو سفیان اور خالد کی قیادت میں پہاڑ پر چڑھنے کی آخری کوشش کی اور عمر اور مہاجرین کی ایک جماعت آپس میں لڑتے رہے یہاں تک کہ انہوں نے انہیں گرا دیا۔ رسول اللہ گھاٹی میں جا بسے، جہاں فاطمہ نے اپنے زخم کو دھویا اور خون کو روکنے کے لیے جلی ہوئی چٹائی سے داغ دیا۔ محمد بن مسلمہ تازہ پانی لائے جس میں سے نبی کریم نے پیا اور ان کے لیے دعا فرمائی۔ اس نے اپنے زخموں کے اثر سے ظہر کی نماز بیٹھ کر پڑھی۔"
