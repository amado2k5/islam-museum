label: { ar: "المحنة بالقرآن", en: "The Mihna over the Qur'an" }
summary:
  ar: "في سنة ثماني عشرة ومائتين كتب المأمون إلى إسحاق بن إبراهيم في امتحان القضاة والمحدّثين، وأمر بإشخاص جماعة منهم إليه إلى الرقة {cite:tabari-tarikh-abu-al-fadl j.8 p.631}، وفي السنة نفسها توفي المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وعند السيوطي كتب المأمون إلى إسحاق بن إبراهيم يأمره بامتحان القضاة والعلماء في خلق القرآن وأن من لم يقر أنه مخلوق لم ترفع شهادته ولا وثق به في عمل، وكتب إليه بإشخاص سبعة محمد بن سعد كاتب الواقدي ويحيى بن معين وأبو خيثمة وأبو مسلم مستملي يزيد بن هارون وإسماعيل بن داوود وإسماعيل بن أبي مسعود وأحمد بن إبراهيم الدورقي فأشخصوا إليه فامتحنهم فأجابوه تقية فردهم من الرقة إلى بغداد، وأمر إسحاق بإحضار من امتنع فأحضر جماعة منهم أحمد بن حنبل وسجادة وقتيبة بن سعيد وسعدويه الواسطي وإسحاق بن أبي إسرائيل ومحمد بن نوح العجلي وغيرهم {cite:tarikh-khulafa-minhaj-1434 p. 489-490}، وعند السيوطي سئل أحمد بن حنبل فقال هو كلام الله لا أزيد على هذا وامتنع هو وسجادة ومحمد بن نوح العجلي والقواريري فقيدهم إسحاق ثم أجاب سجادة ثم القواريري فأرسل أحمد ومحمد بن نوح موثقين إلى بلاد الروم فبلغتهم وفاة المأمون قبل وصولهم فلطف الله وفرج {cite:tarikh-khulafa-minhaj-1434 p. 491-493، وعند السيوطي سلك المعتصم ما ختم به المأمون عمره من امتحان الناس بخلق القرآن فكتب إلى البلاد بذلك وأمر المعلمين أن يعلموا الصبيان ذلك وقاسى الناس منه مشقة وقتل عليه خلقاً من العلماء وضرب الإمام أحمد ابن حنبل وكان ضربه في سنة عشرين {cite:tarikh-khulafa-minhaj-1434 p. 522}، وعند السيوطي أمر المتوكل سنة إحدى وثلاثين أن يمتحن أئمة البصرة ومؤذنوها بخلق القرآن ثم رجع في آخر أمره {cite:tarikh-khulafa-minhaj-1434 p. 529}، وعند السيوطي مدح البحتري المتوكل فيما رفع من المحنة بقوله رددت الدين فذا بعدما قد أراه فرقتين تخاصمان قصمت الظالمين بكل أرض فأضحى الظلم مجهول المكان وهجا فيها ابن أبي دؤاد {cite:tarikh-khulafa-minhaj-1434 p. 549}}"
  en: "In 218 al-Ma'mun wrote to Ishaq ibn Ibrahim about testing judges and traditionists, and ordered a group of them brought to him at al-Raqqa {cite:tabari-tarikh-abu-al-fadl j.8 p.631}; in the same year al-Ma'mun died {cite:tabari-tarikh-abu-al-fadl j.8 p.646}. According to al-Suyuti, al-Ma'mun wrote to Ishaq ibn Ibrahim ordering him to test judges and scholars on the createdness of the Qur'an, and that whoever did not affirm it created would have his testimony rejected and would not be trusted in any matter. He wrote for seven men to be brought to him: Muhammad ibn Sa'd, secretary of al-Waqidi; Yahya ibn Ma'in; Abu Khaythama; Abu Muslim, the dictation-assistant of Yazid ibn Harun; Isma'il ibn Dawud; Isma'il ibn Abi Mas'ud; and Ahmad ibn Ibrahim al-Dawraqi. They were brought and examined, and answered him out of taqiyya (dissimulation); he sent them back from al-Raqqa to Baghdad. Ishaq then ordered those who refused brought in, and a group was produced, among them Ahmad ibn Hanbal, Sajjada, Qutayba ibn Sa'id, Sa'dawayh al-Wasiti, Ishaq ibn Abi Isra'il, Muhammad ibn Nuh al-'Ijli and others {cite:tarikh-khulafa-minhaj-1434 p. 489-490}. According to al-Suyuti, Ahmad ibn Hanbal was asked and said: 'It is the speech of God; I add nothing to this.' He, Sajjada, Muhammad ibn Nuh al-'Ijli and al-Qawariri refused, and Ishaq had them bound. Sajjada then answered, and then al-Qawariri. Ahmad and Muhammad ibn Nuh were sent in chains to the land of Rum, but news of al-Ma'mun's death reached them before they arrived, and God was kind and granted relief {cite:tarikh-khulafa-minhaj-1434 p. 491-493, according to al-Suyuti al-Mu'tasim followed the course with which al-Ma'mun had ended his life, testing people on the createdness of the Qur'an. He wrote to the provinces about it, ordered teachers to teach it to children, and people suffered hardship from it; many scholars were killed over it, and Imam Ahmad ibn Hanbal was flogged in year twenty {cite:tarikh-khulafa-minhaj-1434 p. 522}, according to al-Suyuti al-Mutawakkil in year thirty-one ordered the imams and muezzins of Basra to be tested on the createdness of the Qur'an, and later in his reign he turned back {cite:tarikh-khulafa-minhaj-1434 p. 529}, according to al-Suyuti al-Buhturi praised al-Mutawakkil for lifting the mihna, in verses saying that he restored the religion after it had been split into two warring camps and broke the oppressors in every land, so that injustice became a place none could find; in the same poem he satirized Ibn Abi Du'ad {cite:tarikh-khulafa-minhaj-1434 p. 549}}."
