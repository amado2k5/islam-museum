label: { ar: "المحنة بالقرآن" }
summary:
  ar: "في سنة ثماني عشرة ومائتين كتب المأمون إلى إسحاق بن إبراهيم في امتحان القضاة والمحدّثين، وأمر بإشخاص جماعة منهم إليه إلى الرقة {cite:tabari-tarikh-abu-al-fadl j.8 p.631}، وفي السنة نفسها توفي المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وعند السيوطي كتب المأمون إلى إسحاق بن إبراهيم يأمره بامتحان القضاة والعلماء في خلق القرآن وأن من لم يقر أنه مخلوق لم ترفع شهادته ولا وثق به في عمل، وكتب إليه بإشخاص سبعة محمد بن سعد كاتب الواقدي ويحيى بن معين وأبو خيثمة وأبو مسلم مستملي يزيد بن هارون وإسماعيل بن داوود وإسماعيل بن أبي مسعود وأحمد بن إبراهيم الدورقي فأشخصوا إليه فامتحنهم فأجابوه تقية فردهم من الرقة إلى بغداد، وأمر إسحاق بإحضار من امتنع فأحضر جماعة منهم أحمد بن حنبل وسجادة وقتيبة بن سعيد وسعدويه الواسطي وإسحاق بن أبي إسرائيل ومحمد بن نوح العجلي وغيرهم {cite:tarikh-khulafa-minhaj-1434 p. 489-490}، وعند السيوطي سئل أحمد بن حنبل فقال هو كلام الله لا أزيد على هذا وامتنع هو وسجادة ومحمد بن نوح العجلي والقواريري فقيدهم إسحاق ثم أجاب سجادة ثم القواريري فأرسل أحمد ومحمد بن نوح موثقين إلى بلاد الروم فبلغتهم وفاة المأمون قبل وصولهم فلطف الله وفرج {cite:tarikh-khulafa-minhaj-1434 p. 491-493، وعند السيوطي سلك المعتصم ما ختم به المأمون عمره من امتحان الناس بخلق القرآن فكتب إلى البلاد بذلك وأمر المعلمين أن يعلموا الصبيان ذلك وقاسى الناس منه مشقة وقتل عليه خلقاً من العلماء وضرب الإمام أحمد ابن حنبل وكان ضربه في سنة عشرين {cite:tarikh-khulafa-minhaj-1434 p. 522}، وعند السيوطي أمر المتوكل سنة إحدى وثلاثين أن يمتحن أئمة البصرة ومؤذنوها بخلق القرآن ثم رجع في آخر أمره {cite:tarikh-khulafa-minhaj-1434 p. 529}، وعند السيوطي مدح البحتري المتوكل فيما رفع من المحنة بقوله رددت الدين فذا بعدما قد أراه فرقتين تخاصمان قصمت الظالمين بكل أرض فأضحى الظلم مجهول المكان وهجا فيها ابن أبي دؤاد {cite:tarikh-khulafa-minhaj-1434 p. 549}}"
