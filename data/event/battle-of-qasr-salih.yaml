summary:
  ar: "في سنة سبع وتسعين ومائة، ضمن أخبار حصار بغداد {cite:tabari-tarikh-abu-al-fadl j.8 p.445}، ذكر الطبري الوقعة التي كانت على أصحاب طاهر بقصر صالح {cite:tabari-tarikh-abu-al-fadl j.8 p.454}."
  en: "In 197 AH, within the account of the siege of Baghdad {cite:tabari-tarikh-abu-al-fadl j.8 p.445}, al-Tabari recorded the battle that befell the followers of Tahir at Qasr Salih {cite:tabari-tarikh-abu-al-fadl j.8 p.454}."
  fr: "En 197 H, dans le récit du siège de Bagdad {cite:tabari-tarikh-abu-al-fadl j.8 p.445}, al-Tabari consigna la bataille qui frappa les partisans de Tahir à Qasr Salih {cite:tabari-tarikh-abu-al-fadl j.8 p.454}."
  es: "En el año 197 AH, dentro del relato del asedio de Bagdad {cite:tabari-tarikh-abu-al-fadl j.8 p.445}, al-Tabari registró la batalla que sufrieron los seguidores de Tahir en Qasr Salih {cite:tabari-tarikh-abu-al-fadl j.8 p.454}."
  ur: "197 ہجری میں، بغداد کے محاصرے کے حوالے سے {حوالہ: طبری-تاریخ-ابو الفضل ج8 ص 445}، الطبری نے قصر صالح میں طاہر کے پیروکاروں کے ساتھ ہونے والی لڑائی کو درج کیا ہے۔"
