label:
  ar: "الكليني يتم «الكافي» ببغداد، نحو ٣٢٨هـ/940م"
  en: "al-Kulayni completes al-Kafi at Baghdad, about 328/940"
  ur: "کلینی نے بغداد میں «الکافی» مکمل کی، تقریباً 328ھ/940ء"
summary:
  ar: "في بغداد أتم [[person/al-kulayni|الكليني]] كتابه الموسوعي [[work/al-kafi|«الكافي»]] الذي يقال إنه عمل عليه عشرين سنة؛ والكتاب وإن كان في أغلبه جامعاً لأحاديث الأئمة فقد قُصد به أن يكون دليلاً للعقيدة الإمامية المعتمدة في الكلام والفقه، فرُتب على الموضوعات {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}."
  en: "At Baghdad al-Kulayni completed his voluminous Kitab al-Kafi, on which he is said to have worked for twenty years; though mostly a collection of traditions of the Imams, it was meant as a guide to authoritative Imami doctrine in theology and fiqh, and so is arranged by subject {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}."
  ur: "بغداد میں کلینی نے اپنا بڑا مجموعہ [[work/al-kafi|الکافی]] مکمل کیا جس پر کہا جاتا ہے کہ وہ بیس سال کام کرتا رہا؛ اگرچہ یہ بیشتر ائمہ کی روایات کا مجموعہ ہے، مگر اس کا مقصد کلام و فقہ میں مستند امامی عقیدے کی رہنمائی تھا، اس لیے یہ موضوعات کی ترتیب پر ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}۔"
