label: { ar: "بناء جامع التوبة بالعقيبة سنة 632", en: "Building of the Mosque of Repentance at al-Uqayba, 632", es: "Construcción de la Mezquita del Arrepentimiento en al-Uqayba, 632", fr: "Construction de la mosquée du Repentir à al-Uqayba, 632", ur: "عقیبہ میں توبہ کی مسجد کی تعمیر، 632", tr: "632 yılında Akiba'da bulunan Tevbe Camii'nin inşası.", id: "Pembangunan Masjid Al-Tawbah di Al-Aqiba pada tahun 632" }
summary:
  ar: "في سنة اثنتين وثلاثين وستمائة شرع الملك الأشرف موسى بن العادل في بنائه خان الزنجاري جامعاً وهو جامع التوبة بالعقيبة بدمشق، وكان خاناً معروفاً بالفجور والخواطئ والخمور فسماه جامع التوبة ووقف عليه أوقافاً كثيرة {cite:shadharat-dhahab p. 147-148}."
  en: "In 632 al-Malik al-Ashraf began converting Khan al-Zanjari at al-Uqayba in Damascus — a khan known for debauchery, error and wine — into a mosque, naming it Jami' al-Tawba, the Mosque of Repentance, and endowing it richly {cite:shadharat-dhahab p. 147-148}."
  es: "En 632, al-Malik al-Ashraf comenzó a convertir a Khan al-Zanjari en al-Uqayba en Damasco —un khan conocido por su libertinaje, error y vino— en una mezquita, llamándola Jami' al-Tawba, la Mezquita del Arrepentimiento, y dotándola ricamente {cite:shadharat-dhahab p. 147-148}."
  fr: "En 632, al-Malik al-Ashraf commença à convertir le Khan al-Zanjari à al-Uqayba à Damas — un khan connu pour sa débauche, ses erreurs et son goût pour le vin — en une mosquée, la nommant Jami' al-Tawba, la Mosquée du Repentir, et la dotant richement {cite:shadharat-dhahab p. 147-148}."
  ur: "632 میں المالک الاشرف نے دمشق میں العقیبہ میں خان الزنجاری کو ایک مسجد میں تبدیل کرنا شروع کیا - ایک خان جو بے حیائی، خطا اور شراب کے لیے جانا جاتا ہے، اسے جامع التوبہ، توبہ کی مسجد کا نام دیا، اور اسے بھرپور طریقے سے عطا کیا۔ 147-148}۔"
  tr: "Hicri 632 yılında Kral Aşraf Musa bin Adil, Şam'daki Akibe'de bulunan Han Zencebir Camii'nin (Tövbe Camii) inşasına başladı. Burası sefahat, günah ve şarap düşkünlüğüyle bilinen bir handı, bu yüzden ona Tövbe Camii adını verdi ve birçok vakıf kurdurdu. {Kaynak: Şadharat-Dhaba s. 147-148}"
  id: "Pada tahun 632 H, Raja Al-Ashraf Musa bin Al-Adil mulai membangun masjid Khan Al-Zanjari, yang merupakan Masjid Taubat di Al-Aqiba, Damaskus. Khan tersebut terkenal dengan kemaksiatan, dosa, dan minuman kerasnya, sehingga ia menamakannya Masjid Taubat dan memberinya banyak wakaf {cite:shadharat-dhahab p. 147-148}."
