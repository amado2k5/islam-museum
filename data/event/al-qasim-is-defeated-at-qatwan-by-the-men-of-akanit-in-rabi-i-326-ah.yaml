id: "event/al-qasim-is-defeated-at-qatwan-by-the-men-of-akanit-in-rabi-i-326-ah"
class: event
kind: other
label:
  ar: "تنهزم عساكر القاسم بن أحمد في قطوان قرب أكانط في ربيع الأول سنة 326هـ، ص410"
  en: "Al-Qasim's men are routed at Qatwan near Akanit in Rabi I 326 AH, p. 410"
  ur: "ربیع الاول 326ھ میں اکانط کے قریب قطوان میں قاسم کے ساتھی شکست کھاتے ہیں، ص410"
  es: "Los hombres de Al-Qasim son derrotados en Qatwan, cerca de Akanit, en Rabi I 326 AH, pág. 410."
  fr: "Les hommes d'Al-Qasim sont mis en déroute à Qatwan près d'Akanit en Rabi I 326 AH, p. 410"
  tr: "Al-Qasim ibn Ahmad'ın askerleri Hicri 326 Rebiü'l-Evvel ayında Akant yakınlarındaki Katvan'da yenilgiye uğradılar (s. 410)."
  id: "Tentara Al-Qasim ibn Ahmad dikalahkan di Qatwan dekat Akant pada bulan Rabi' al-Awwal 326 H, hlm. 410"
summary:
  ar: "يقع قتال بناحية مشرق همدان قرب أكانط، في موضع يسمى قطوان، فيعسكر أهل أكانط على القاسم بن أحمد فتقع الهزيمة على أصحابه ويقتل منهم كثير، فيعود إلى وروَر."
  en: "A battle takes place in eastern Hamdan, near Akanit, at a place called Qatwan. The people of Akanit camp against al-Qasim ibn Ahmad, his men are routed and many are killed, and he returns to Warwar."
  ur: "ہمدان کے مشرقی علاقے میں اکانط کے قریب قطوان نامی مقام پر لڑائی ہوتی ہے۔ اکانط کے لوگ قاسم بن احمد کے مقابل آتے ہیں، اس کے ساتھی شکست کھاتے ہیں اور بہت سے مارے جاتے ہیں، اور وہ وروَر لوٹ آتا ہے۔"
  es: "Se libra una batalla en el este de Hamdan, cerca de Akanit, en un lugar llamado Qatwan. Los habitantes de Akanit acampan contra al-Qasim ibn Ahmad, sus hombres son derrotados y muchos mueren, y él regresa a Warwar."
  fr: "Une bataille a lieu dans l'est du Hamdan, près d'Akanit, à un endroit appelé Qatwan. Les habitants d'Akanit campent contre al-Qasim ibn Ahmad; ses hommes sont mis en déroute et beaucoup sont tués, et il retourne à Warwar."
  tr: "Hamadan'ın doğu kesiminde, Akant yakınlarında, Katvan denilen bir yerde bir savaş yaşanır. Akant halkı, El-Kasım bin Ahmed'e karşı kamp kurar ve arkadaşları yenilgiye uğrar, birçoğu öldürülür; bunun üzerine El-Kasım bin Ahmed Warwar'a geri döner."
  id: "Pertempuran terjadi di bagian timur Hamadan, dekat Akant, di tempat bernama Qatwan. Penduduk Akant berkemah melawan Al-Qasim bin Ahmad, dan para pengikutnya dikalahkan dan banyak dari mereka terbunuh, sehingga ia kembali ke Warwar."
