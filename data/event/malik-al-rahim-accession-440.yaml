id: event/malik-al-rahim-accession-440
class: event
kind: other
label:
  ar: "موت أبي كاليجار واستخلاف الملك الرحيم"
  en: "Death of Abu Kalijar and investiture of al-Malik al-Rahim"
  es: "Muerte de Abu Kalijar e investidura de al-Malik al-Rahim"
  fr: "Mort d'Abou Kalijar et investiture d'al-Malik al-Rahim"
  ur: "ابوکالجار کی موت اور مالک الرحیم کی سرمایہ کاری"
summary:
  ar: "مرض الملك أبو كاليجار في جمادى الأولى سنة أربعين وأربعمائة ففُصد ثلاث مرات وهو في برية وحمّ، ثم ركب المهدّ فشق عليه فعملت له محفة على أعذاق الرجال، وقضى في ليلة الخميس برمضان؛ فانتهب الغلمان الخزائن والسلاح والكراع، وأحرقت الجواري الخيام وتركنها وهو فيها مسجّى. وولي مكانه ابنه أبو نصر وسُمّي الملك الرحيم، فركب من معسكره إلى دار الخلافة حتى فرغ من صحن السلام في الموضع الذي نزل فيه عضد الدولة ومن بعده، فوصل إلى حضرة الخليفة فقبّل الأرض وأُجلس على كرسي، وأُلبس السبع الكاملة والعمامة السوداء الرصافية والطوق والسيفين بجزابل ووُضع على رأسه التاج المرصع وبُرزت له رايتان معقودتان، وقُرئ عليه كتاب التقليد والتلقيب ووُصّي بتقوى الله والعدل في الرعية، وأُهدي إليه فرس أدهم بمركب ذهب، فنزل الطيار الخلاقي وصعد منه إلى مضربه وجلس على سدته يخدمه الناس ويهنّونه {cite:muntazam-ibn-al-jawzi j.8 p.478-479}. كان أبو كاليجار قد ولد بالبصرة في شوال سنة تسع وتسعين وثلاثمائة، وتوفي وله أربعون سنة وأشهر، وولي العراق أربع سنين وشهرين، ونُهبت قلعة له كان فيها ما يزيد على ألف ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.481}."
  en: "Abu Kalijar fell ill in Jumada I 440, was bled three times in the open country, and died on the Thursday night of Ramadan; the ghilman plundered treasuries, arms and mounts while his slave-girls burned the tents over his bier. His son Abu Nasr was acclaimed al-Malik al-Rahim and rode to the caliphal palace, kissed the earth, was robed in the seven-piece black investiture with the Rusafi turban, collar, two jewelled swords and gem-set crown, two bound standards presented, the patent of investiture read over his chest, and was counselled to piety and justice — then rode the caliph's own tayyar back to his camp to receive congratulations {cite:muntazam-ibn-al-jawzi j.8 p.478-479}."
  es: "Abu Kalijar enfermó en Jumada I 440, fue sangrado tres veces en campo abierto y murió la noche del jueves de Ramadán; el ghilman saqueó tesoros, armas y monturas mientras sus esclavas quemaban las tiendas sobre su féretro. Su hijo Abu Nasr fue aclamado al-Malik al-Rahim y cabalgó hasta el palacio califal, besó la tierra, fue revestido con la investidura negra de siete piezas con el turbante Rusafi, collar, dos espadas enjoyadas y corona engastada con gemas, se le presentaron dos estandartes atados, se leyó la patente de investidura sobre su pecho y se le aconsejó sobre la piedad y la justicia; luego cabalgó en el propio tayyar del califa de regreso a su campamento para recibir felicitaciones {cite:muntazam-ibn-al-jawzi j.8 p.478-479}."
  fr: "Abou Kalijar tomba malade en Jumada I 440, fut saigné à trois reprises en pleine campagne et mourut dans la nuit du jeudi de Ramadan. Le ghilman pilla les trésors, les armes et les montures tandis que ses esclaves brûlaient les tentes au-dessus de son cercueil. Son fils, Abou Nasr, fut proclamé al-Malik al-Rahim et se rendit au palais califal. Il embrassa la terre, reçut l'investiture noire en sept pièces comprenant le turban rusafi, le collier, deux épées ornées de pierres précieuses et une couronne sertie de gemmes. Deux étendards liés lui furent présentés, le brevet d'investiture fut lu sur sa poitrine et il fut exhorté à la piété et à la justice. Il retourna ensuite à son campement sur le tayyar du calife pour recevoir les félicitations."
  ur: "ابوکلیجر جمادی الثانی 440 میں بیمار ہوئے، کھلے ملک میں تین بار خون بہا، اور رمضان کی جمعرات کی رات کو انتقال کر گئے۔ غلمان نے خزانے، اسلحہ اور سواریاں لوٹ لیں جبکہ اس کی لونڈیوں نے اس کے بیئر پر خیمے جلا ڈالے۔ اس کے بیٹے ابو نصر کو المالک الرحیم کہا گیا اور وہ خلیفہ کے محل میں سوار ہوا، زمین کو چوما، سات ٹکڑوں والی سیاہ پوشی میں روسی پگڑی، گریبان، دو جواہرات والی تلواریں اور جواہرات سے جڑا تاج پہنا دیا گیا، دو پابند معیارات پیش کیے گئے، سرمایہ کاری کا پیٹنٹ، اور اس کے بعد انصاف کے حصول کے لیے اسے پڑھا گیا۔ خلیفہ کا اپنا طیار مبارکباد لینے کے لیے اپنے کیمپ میں واپس آیا۔"
