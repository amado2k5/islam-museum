label:
  ar: "موت أبي كاليجار واستخلاف الملك الرحيم"
  en: "Death of Abu Kalijar and investiture of al-Malik al-Rahim"
summary:
  ar: "مرض الملك أبو كاليجار في جمادى الأولى سنة أربعين وأربعمائة ففُصد ثلاث مرات وهو في برية وحمّ، ثم ركب المهدّ فشق عليه فعملت له محفة على أعذاق الرجال، وقضى في ليلة الخميس برمضان؛ فانتهب الغلمان الخزائن والسلاح والكراع، وأحرقت الجواري الخيام وتركنها وهو فيها مسجّى. وولي مكانه ابنه أبو نصر وسُمّي الملك الرحيم، فركب من معسكره إلى دار الخلافة حتى فرغ من صحن السلام في الموضع الذي نزل فيه عضد الدولة ومن بعده، فوصل إلى حضرة الخليفة فقبّل الأرض وأُجلس على كرسي، وأُلبس السبع الكاملة والعمامة السوداء الرصافية والطوق والسيفين بجزابل ووُضع على رأسه التاج المرصع وبُرزت له رايتان معقودتان، وقُرئ عليه كتاب التقليد والتلقيب ووُصّي بتقوى الله والعدل في الرعية، وأُهدي إليه فرس أدهم بمركب ذهب، فنزل الطيار الخلاقي وصعد منه إلى مضربه وجلس على سدته يخدمه الناس ويهنّونه {cite:muntazam-ibn-al-jawzi j.8 p.478-479}. كان أبو كاليجار قد ولد بالبصرة في شوال سنة تسع وتسعين وثلاثمائة، وتوفي وله أربعون سنة وأشهر، وولي العراق أربع سنين وشهرين، ونُهبت قلعة له كان فيها ما يزيد على ألف ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.481}."
  en: "Abu Kalijar fell ill in Jumada I 440, was bled three times in the open country, and died on the Thursday night of Ramadan; the ghilman plundered treasuries, arms and mounts while his slave-girls burned the tents over his bier. His son Abu Nasr was acclaimed al-Malik al-Rahim and rode to the caliphal palace, kissed the earth, was robed in the seven-piece black investiture with the Rusafi turban, collar, two jewelled swords and gem-set crown, two bound standards presented, the patent of investiture read over his chest, and was counselled to piety and justice — then rode the caliph's own tayyar back to his camp to receive congratulations {cite:muntazam-ibn-al-jawzi j.8 p.478-479}."
