id: event/death-ibn-fadl-allah-umari-749
class: event
kind: death
label:
  ar: "وفاة ابن فضل الله العمري بدمشق، ٧٤٩هـ/١٣٤٩م"
  en: "Death of Ibn Fadl Allah al-Umari at Damascus, 749/1349"
  ur: "ابن فضل اللہ عمری کی وفات، دمشق، 749ھ/1349ء"
  es: "Muerte de Ibn Fadl Allah al-Umari en Damasco, 749/1349"
  fr: "Mort d'Ibn Fadl Allah al-Umari à Damas, 749/1349"
  tr: "İbn Fadlallah el-Umari'nin Şam'da ölümü, H. 749/MS 1349"
  id: "Wafatnya Ibnu Fadlallah al-Umari di Damaskus, 749 H/1349 M."
summary:
  ar: "مات شهاب الدين أحمد بن فضل الله بحمى ربع أصابته فقضى يوم عرفة، تاسع ذي الحجة سنة ٧٤٩هـ ⁦(١ مارس ١٣٤٩م)⁩، بدمشق، تاركًا «مسالك الأبصار» و«التعريف بالمصطلح الشريف» ورسائل ونظماً؛ ذكره الذهبي بأن له تصانيف أدبية كثيرة وباعًا طويلًا في الصناعتين وبراعة في البلاغتين {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "Shihab al-Din Ahmad ibn Fadl Allah died at Damascus of a quartan fever on the Day of Arafa, 9 Dhu al-Hijja 749 (1 March 1349), leaving Masalik al-Absar, al-Ta'rif bi'l-Mustalah al-Sharif, essays and verse; al-Dhahabi records his many literary works and long reach in the two crafts and skill in the two rhetorics {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "شہاب الدین احمد بن فضل اللہ دمشق میں 9 ذی الحجہ 749ھ ⁦(1 مارچ 1349ء)⁩ کو، یومِ عرفہ، ربع بخار سے فوت ہوئے؛ انہوں نے «مسالک الابصار»، «التعریف بالمصطلح الشریف»، رسائل اور شاعری چھوڑی؛ ذہبی نے ان کی کثیر ادبی تصانیف اور دونوں صنعتوں میں طولِ بازو اور دونوں فنونِ بلاغت میں مہارت بیان کی ہے {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
  es: "Shihab al-Din Ahmad ibn Fadl Allah murió en Damasco de fiebre cuartana el día de Arafa, 9 de Dhu al-Hijja 749 (1 de marzo de 1349), dejando Masalik al-Absar, al-Ta'rif bi'l-Mustalah al-Sharif, ensayos y poesía; al-Dhahabi registra sus numerosas obras literarias y su amplio alcance en ambos oficios y habilidad en ambas retóricas {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  fr: "Shihab al-Din Ahmad ibn Fadl Allah mourut à Damas d'une fièvre quartan le jour d'Arafa, le 9 Dhu al-Hijja 749 (1er mars 1349), laissant Masalik al-Absar, al-Ta'rif bi'l-Mustalah al-Sharif, des essais et des vers; al-Dhahabi relate ses nombreuses œuvres littéraires et sa grande influence dans les deux arts et les deux rhétoriques {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  tr: "Şihab el-Din Ahmed ibn Fadl Allah, kendisine isabet eden bir kuduz ateşinden vefat etti. Hicri 749 yılının Zilhicce ayının dokuzuncu günü Arafat günü (1 Mart 1349) Şam'da hayata veda etti. Geride “Masalik el-Absar” ve “El-Ta’rif bi el-Mustalah el-Şerif” adlı eserlerini, mektuplarını ve şiirlerini bıraktı. El-Dhahabi, onun birçok edebi eseri olduğunu, iki sanat dalında uzun bir geçmişe ve iki retorik dalında da yetkinliğe sahip olduğunu belirtmiştir. {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}"
  id: "Shihab al-Din Ahmad ibn Fadl Allah wafat karena demam kuartan yang menyerangnya. Beliau wafat pada hari Arafah, tanggal sembilan Dzul Hijjah tahun 749 H (1 Maret 1349 M), di Damaskus, meninggalkan “Masalik al-Absar” dan “Al-Ta’rif bi al-Mustalah al-Sharif” serta surat-surat dan puisi. Al-Dhahabi menyebutkan bahwa beliau memiliki banyak karya sastra dan sejarah panjang dalam dua seni dan kemahiran dalam dua retorika {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
