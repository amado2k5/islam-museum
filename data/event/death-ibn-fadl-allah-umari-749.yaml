label:
  ar: "وفاة ابن فضل الله العمري بدمشق، ٧٤٩هـ/١٣٤٩م"
  en: "Death of Ibn Fadl Allah al-Umari at Damascus, 749/1349"
  ur: "ابن فضل اللہ عمری کی وفات، دمشق، 749ھ/1349ء"
summary:
  ar: "مات شهاب الدين أحمد بن فضل الله بحمى ربع أصابته فقضى يوم عرفة، تاسع ذي الحجة سنة ٧٤٩هـ (١ مارس ١٣٤٩م)، بدمشق، تاركًا «مسالك الأبصار» و«التعريف بالمصطلح الشريف» ورسائل ونظماً؛ ذكره الذهبي بأن له تصانيف أدبية كثيرة وباعًا طويلًا في الصناعتين وبراعة في البلاغتين {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "Shihab al-Din Ahmad ibn Fadl Allah died at Damascus of a quartan fever on the Day of Arafa, 9 Dhu al-Hijja 749 (1 March 1349), leaving Masalik al-Absar, al-Ta'rif bi'l-Mustalah al-Sharif, essays and verse; al-Dhahabi records his many literary works and long reach in the two crafts and skill in the two rhetorics {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "شہاب الدین احمد بن فضل اللہ دمشق میں 9 ذی الحجہ 749ھ (1 مارچ 1349ء) کو، یومِ عرفہ، ربع بخار سے فوت ہوئے؛ انہوں نے «مسالک الابصار»، «التعریف بالمصطلح الشریف»، رسائل اور شاعری چھوڑی؛ ذہبی نے ان کی کثیر ادبی تصانیف اور دونوں صنعتوں میں طولِ بازو اور دونوں فنونِ بلاغت میں مہارت بیان کی ہے {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
