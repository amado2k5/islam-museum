summary:
  en: "The second delegation of Abd al-Qays came to Medina in the Year of Delegations, forty men among them al-Jarud ibn al-Ala, who had been a Christian; an earlier delegation of about fourteen had come in 5 AH led by al-Ashajj al-Asri."
  ar: "قدم الوفد الثاني لعبد القيس المدينة في عام الوفود أربعين رجلاً فيهم الجارود بن العلاء وكان نصرانياً فأسلم، وسبقه وفد أول نحو أربعة عشر رجلاً سنة 5هـ فيهم الأشج العصري."
