id: event/birth-abu-dawud-sijistan-202
class: event
kind: birth
label:
  ar: "مولد أبي داود السجستاني ٢٠٢هـ"
  en: "Birth of Abu Dawud al-Sijistani, 202/817"
  ur: "ابو داؤد سجستانی کی پیدائش، 202ھ/817ء"
  fr: "La naissance d'Abu Dawud al-Sijistani, 202/817"
  es: "Nacimiento de Abu Dawud al-Sijistani, 202/817"
  tr: "Ebu Davud el-Sicistani'nin Doğumu, H. 202"
  id: "Kelahiran Abu Dawud al-Sijistani, 202 H"
summary:
  ar: "قال أبو عبيد الآجري: سمعت أبا داود يقول: وُلدت سنة اثنتين ومائتين {cite:tarikh-islam-dhahabi p. 358}؛ وتؤكد الموسوعة الإسلامية ميلاده سنة 202هـ/817م {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. ونسبته إلى سجستان الإقليم المتاخم لبلاد السند، لا إلى قرية من قرى البصرة كما زعم بعضهم {cite:tarikh-islam-dhahabi p. 361}."
  en: "Abu Ubayd al-Ajurri reported him saying: I was born in the year two hundred and two {cite:tarikh-islam-dhahabi p. 358}, and the Encyclopaedia of Islam confirms the year 202/817 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. His nisba points to the province of Sijistan bordering Sind, not to a village near Basra as some wrongly held {cite:tarikh-islam-dhahabi p. 361}."
  ur: "ابو عبید آجری نے ان سے سنا: میں 202ھ میں پیدا ہوا {cite:tarikh-islam-dhahabi p. 358}؛ اور دائرة المعارف الإسلامية بھی 202ھ/817ء کی تصدیق کرتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. ان کی نسبت صوبہ سجستان کی طرف ہے، نہ کہ بصرہ کے قریب کسی بستی کی طرف جیسا بعض نے غلطی سے کہا {cite:tarikh-islam-dhahabi p. 361}۔"
  fr: "Abu Ubayd al-Ajurri le rapporta disant : je suis né en l'an deux cent deux {cite:tarikh-islam-dhahabi p. 358}, et l'Encyclopédie de l'Islam confirme l'année 202/817 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Sa nisba renvoie à la province du Sijistan, limitrophe du Sind, et non à un village près de Bassora comme certains l'ont cru à tort {cite:tarikh-islam-dhahabi p. 361}."
  es: "Abu Ubayd al-Ajurri informó que él dijo: Nací en el año doscientos dos {cite:tarikh-islam-dhahabi p. 358}, y la Enciclopedia del Islam confirma el año 202/817 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Su nisba apunta a la provincia de Sijistan, fronteriza con Sind, no a una aldea cerca de Basora como algunos creían erróneamente {cite:tarikh-islam-dhahabi p. 361}."
  tr: "Ebu Ubeyd el-Ajurri şöyle dedi: Ebu Davud'un şöyle dediğini işittim: Hicri 202 yılında doğdum {kaynak:tarikh-islam-dhahabi s. 358}; ve İslam Ansiklopedisi de onun doğumunun Hicri 202/Miladi 817 yılında olduğunu doğrulamaktadır {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 133}. Soyu, bazılarının iddia ettiği gibi Basra yakınlarındaki bir köye değil, Sindh'e sınır komşusu olan Sijistan bölgesine kadar uzanmaktadır {kaynak:tarikh-islam-dhahabi s. 361}."
  id: "Abu Ubayd al-Ajurri berkata: Saya mendengar Abu Dawud berkata: Saya lahir pada tahun 202 H {kutip:tarikh-islam-dhahabi hlm. 358}; dan Ensiklopedia Islam menegaskan kelahirannya pada tahun 202 H/817 M {kutip:ensiklopedia-islam-2 jilid 1 hlm. 133}. Silsilahnya dapat ditelusuri kembali ke Sijistan, wilayah yang berbatasan dengan Sindh, bukan ke sebuah desa dekat Basra seperti yang diklaim oleh sebagian orang {kutip:tarikh-islam-dhahabi hlm. 361}."
