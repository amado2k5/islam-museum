label:
  ar: "مولد أبي داود السجستاني ٢٠٢هـ"
  en: "Birth of Abu Dawud al-Sijistani, 202/817"
  ur: "ابو داؤد سجستانی کی پیدائش، 202ھ/817ء"
summary:
  ar: "قال أبو عبيد الآجري: سمعت أبا داود يقول: وُلدت سنة اثنتين ومائتين {cite:tarikh-islam-dhahabi p. 358}؛ وتؤكد الموسوعة الإسلامية ميلاده سنة 202هـ/817م {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. ونسبته إلى سجستان الإقليم المتاخم لبلاد السند، لا إلى قرية من قرى البصرة كما زعم بعضهم {cite:tarikh-islam-dhahabi p. 361}."
  en: "Abu Ubayd al-Ajurri reported him saying: I was born in the year two hundred and two {cite:tarikh-islam-dhahabi p. 358}, and the Encyclopaedia of Islam confirms the year 202/817 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. His nisba points to the province of Sijistan bordering Sind, not to a village near Basra as some wrongly held {cite:tarikh-islam-dhahabi p. 361}."
  ur: "ابو عبید آجری نے ان سے سنا: میں 202ھ میں پیدا ہوا {cite:tarikh-islam-dhahabi p. 358}؛ اور دائرة المعارف الإسلامية بھی 202ھ/817ء کی تصدیق کرتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. ان کی نسبت صوبہ سجستان کی طرف ہے، نہ کہ بصرہ کے قریب کسی بستی کی طرف جیسا بعض نے غلطی سے کہا {cite:tarikh-islam-dhahabi p. 361}۔"
