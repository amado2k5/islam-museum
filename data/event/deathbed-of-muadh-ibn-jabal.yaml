id: event/deathbed-of-muadh-ibn-jabal
class: event
kind: death
label:
  ar: احتضار معاذ بن جبل في طاعون عمواس ووصيته
  en: Deathbed of Mu'adh ibn Jabal in the plague of Amwas
  ur: طاعونِ عمواس میں معاذ بن جبل کا آخری وقت اور ان کی وصیت
  es: "Lecho de muerte de Mu'adh ibn Jabal durante la peste de Amwas."
summary:
  ar: "لما طُعن أبو عبيدة بن الجراح استخلف معاذ بن جبل على الناس، فخطبهم وسأل الله أن يقسم لآل معاذ حظهم من الوجع، ثم طُعن ابنه عبد الرحمن فمات، وطُعن معاذ نفسه في راحته {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. وحين حضره الموت قال كلمته المشهورة في الترحيب بالموت وأنه لم يكن يحب الدنيا لكري الأنهار ولا لغرس الأشجار بل لظمأ الهواجر ومزاحمة العلماء عند حلق الذكر {cite:usd-al-ghaba scan vol. 4 p. 193}. وفي وصيته لمن حوله قال إن العلم والإيمان مكانهما وإن من ابتغاهما وجدهما، ودلّهم على أربعة يُطلب العلم عندهم {cite:siyar-alam-nubala scan vol. 3 p. 251}. مات في ناحية الأردن سنة ثمان عشرة في قول الأكثر، وكانت وفاته شرقي غور بيسان عند ابن كثير {cite:al-bidaya-wal-nihaya scan vol. 4 p. 97}، وقبره «بالغور» عند الذهبي {cite:siyar-alam-nubala scan vol. 1 p. 347}."
  en: "When Abu Ubayda ibn al-Jarrah was struck by the plague he named Mu'adh ibn Jabal to lead the people; Mu'adh preached, asked God to apportion to the house of Mu'adh its share of the affliction, then lost his son Abd al-Rahman and was himself struck in the palm {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. As death came he spoke the words reported in Usd al-Ghaba, welcoming death and saying that he had not loved the world for digging canals or planting trees but for the thirst of midday heat and for crowding the scholars at the circles of remembrance {cite:usd-al-ghaba scan vol. 4 p. 193}. Asked for a testament he said that knowledge and faith keep their places for whoever seeks them, and pointed to four men from whom knowledge should be sought {cite:siyar-alam-nubala scan vol. 3 p. 251}. He died in the district of the Jordan in the year 18 according to most reports, Ibn Kathir places his death east of the Ghawr of Baysan {cite:al-bidaya-wal-nihaya scan vol. 4 p. 97}, and al-Dhahabi says his grave is in the Ghawr {cite:siyar-alam-nubala scan vol. 1 p. 347}."
  ur: "جب ابو عبیدہ بن الجراح کو طاعون لگا تو انھوں نے معاذ بن جبل کو لوگوں پر خلیفہ مقرر کیا؛ معاذ نے خطبہ دیا، اللہ سے دعا کی کہ آلِ معاذ کو بھی اس بیماری کا حصہ ملے، پھر ان کے بیٹے عبدالرحمن فوت ہوئے اور خود ان کی ہتھیلی میں گلٹی نکلی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. موت کے وقت انھوں نے موت کا خیرمقدم کیا اور کہا کہ وہ دنیا کو نہروں کی کھدائی اور درخت لگانے کے لیے نہیں بلکہ دوپہر کی پیاس اور ذکر کی مجلسوں میں اہلِ علم کے ساتھ گھٹنے جوڑ کر بیٹھنے کے لیے چاہتے تھے {cite:usd-al-ghaba scan vol. 4 p. 193}. وصیت کے طلب پر کہا کہ علم اور ایمان اپنی جگہ موجود ہیں، جو انھیں چاہے پا لیتا ہے، اور چار آدمیوں کی طرف رہنمائی کی جن سے علم حاصل کیا جائے {cite:siyar-alam-nubala scan vol. 3 p. 251}. وہ اردن کے علاقے میں اکثر روایات کے مطابق سن 18 ہجری میں فوت ہوئے اور ابن کثیر ان کی وفات بیسان کے غور کے مشرق میں بتاتے ہیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 97}، اور ذہبی کے مطابق ان کی قبر غور میں ہے {cite:siyar-alam-nubala scan vol. 1 p. 347}."
  es: "Cuando Abu Ubayda ibn al-Jarrah fue golpeado por la peste, nombró a Mu'adh ibn Jabal para que dirigiera al pueblo; Mu'adh predicó, pidió a Dios que repartiera a la casa de Mu'adh su parte de la aflicción, luego perdió a su hijo Abd al-Rahman y él mismo fue golpeado en la palma {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. Al llegar la muerte, pronunció las palabras recogidas en Usd al-Ghaba, dando la bienvenida a la muerte y diciendo que no había amado el mundo por cavar canales o plantar árboles, sino por la sed del calor del mediodía y por apiñar a los eruditos en los círculos del recuerdo {cite:usd-al-ghaba scan vol. 4 p. 193}. Al pedírsele un testamento, dijo que el conocimiento y la fe mantienen sus lugares para quien los busca, y señaló a cuatro hombres de quienes se debe buscar el conocimiento {cite:siyar-alam-nubala scan vol. 3 p. 251}. Murió en el distrito del Jordán en el año 18 según la mayoría de los informes, Ibn Kathir sitúa su muerte al este del Ghawr de Baysan {cite:al-bidaya-wal-nihaya scan vol. 4 p. 97}, y al-Dhahabi dice que su tumba está en el Ghawr {cite:siyar-alam-nubala scan vol. 1 p. 347}."
