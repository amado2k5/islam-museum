id: event/shurayh-armor-judgment
class: event
kind: court-ruling
label: { ar: "قضاء شريح في درع علي", en: "Shurayh's judgment on Ali's coat of mail", es: "El juicio de Shurayh sobre la cota de malla de Ali", fr: "Le jugement de Shurayh sur la cotte de mailles d'Ali", ur: "علی کے کوٹ آف میل کے بارے میں شورایح کا فیصلہ", tr: "Şurayh'ın Dar' Ali'deki yargı sistemi", id: "Lembaga peradilan Shurayh di Dar' Ali" }
summary:
  ar: "افتقد علي درعاً له بعد رجوعه من صفين فوجدها مع يهودي بالكوفة فقال الدرع درعي لم أبع ولم أهب، فترافعا إلى شريح القاضي فجلس علي إلى جنبه وقال لولا أن خصمي يهودي لاستويت معه في المجلس، فسأله شريح عن البينة فقال قنبر والحسن يشهدان، فقال شريح شهادة الابن لا تجوز للأب وقضى لليهودي، فقال اليهودي أمير المؤمنين قدمني إلى قاضيه وقاضيه قضى عليه، فشهد شهادة الحق وأقر أن الدرع درعه وأسلم {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  en: "After Siffin Ali missed a coat of mail and found it with a Jew in Kufa — 'the armor is mine; I neither sold nor gave it'. They pleaded before the judge Shurayh, where Ali sat beside him saying 'were my opponent not a Jew I would have sat equal with him'. Shurayh asked for proof; Ali offered Qanbar and al-Hasan, but Shurayh ruled a son's testimony inadmissible for his father and found for the Jew — who exclaimed that the Commander of the Faithful had brought him before his own judge and been judged against, bore witness that this was the truth, acknowledged the armor, and embraced Islam {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  es: "Después de que Siffin Ali extraviara una cota de malla y la encontrara en posesión de un judío en Kufa —«la armadura es mía; ni la vendí ni la regalé»—, comparecieron ante el juez Shurayh, donde Ali se sentó a su lado diciendo: «Si mi oponente no fuera judío, me habría sentado en igualdad de condiciones con él». Shurayh pidió pruebas; Ali ofreció a Qanbar y a al-Hasan, pero Shurayh dictaminó que el testimonio de un hijo era inadmisible para su padre y falló a favor del judío, quien exclamó que el Comandante de los Creyentes lo había llevado ante su propio juez y había sido juzgado en su contra, dio testimonio de que esto era cierto, reconoció la armadura y abrazó el Islam {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  fr: "Après que Siffin Ali eut égaré une cotte de mailles et l'eut trouvée chez un Juif à Koufa, il déclara: « Cette armure est à moi; je ne l'ai ni vendue ni donnée. » Ils plaidèrent devant le juge Shurayh, auquel Ali s'assit à ses côtés, affirmant: « Si mon adversaire n'avait pas été juif, je me serais assis à égalité avec lui. » Shurayh demanda des preuves; Ali présenta Qanbar et al-Hasan, mais Shurayh jugea le témoignage d'un fils irrecevable pour son père et donna raison au Juif. Ce dernier s'écria que le Commandeur des Croyants l'avait traduit devant son propre juge et avait été condamné, témoigna de la véracité des faits, reconnut l'armure et se convertit à l'islam."
  ur: "جب صفین علی نے ڈاک کا ایک کوٹ کھو دیا اور اسے کوفہ میں ایک یہودی کے پاس پایا - 'زندہ میری ہے؛ میں نے نہ بیچا اور نہ دیا‘‘۔ انہوں نے جج شوریح کے سامنے درخواست کی جہاں علی ان کے پاس بیٹھا تھا کہ 'اگر میرا مخالف یہودی نہ ہوتا تو میں اس کے برابر بیٹھتا'۔ شوریٰ نے ثبوت مانگا۔ علی نے قنبر اور الحسن کو پیش کیا، لیکن شریح نے ایک بیٹے کی گواہی کو اپنے باپ کے لیے ناقابل قبول قرار دیا اور یہودی کے لیے قرار دیا - جس نے کہا کہ وفاداروں کے کمانڈر نے اسے اپنے ہی جج کے سامنے لایا اور اس کے خلاف فیصلہ کیا گیا، گواہی دی کہ یہ سچ ہے، ہتھیار کو تسلیم کیا، اور اسلام قبول کیا۔ 306-307}۔"
  tr: "Ali, Siffin'den döndükten sonra kalkanını kaybetti ve onu Kufa'da bir Yahudi'de buldu. \"Kalkan benimdir; onu satmadım, başkasına da vermedim\" dedi. Bunun üzerine davayı şurayh adlı yargıcın önüne götürdüler. Ali onun yanına oturdu ve \"Rakibim Yahudi olmasaydı, onunla eşit şartlarda otururdum\" dedi. Şurayh ona delilleri sordu ve Ali, \"Kanber ve Hasan şahitlik ediyor\" dedi. Şurayh, \"Oğlun şahitliği baba için caiz değildir\" dedi ve Yahudi'nin lehine hüküm verdi. Yahudi, \"Müminlerin Emiri beni kendi yargıcının önüne getirdi ve yargıç onun aleyhine hüküm verdi\" dedi. Böylece doğruyu söyledi ve kalkanın kendisine ait olduğunu kabul etti ve İslam'ı kabul etti. {cite:tarikh-khulafa-minhaj-1434 s. 306-307}"
  id: "Ali kehilangan perisainya setelah kembali dari Siffin, dan ia menemukannya pada seorang Yahudi di Kufa. Ia berkata, “Perisai ini milikku; aku tidak menjualnya, dan aku juga tidak memberikannya.” Maka mereka membawa perkara mereka kepada hakim Syuraiyah. Ali duduk di sebelahnya dan berkata, “Jika lawanku bukan seorang Yahudi, aku akan duduk bersamanya dengan kedudukan yang sama.” Syuraiyah bertanya kepadanya tentang bukti, dan ia berkata, “Qanbar dan Al-Hasan bersaksi.” Syuraiyah berkata, “Kesaksian seorang anak tidak diperbolehkan bagi ayahnya,” dan ia memutuskan untuk memihak kepada orang Yahudi itu. Orang Yahudi itu berkata, “Amirul Mukminin membawaku ke hadapan hakimnya, dan hakimnya memutuskan menentangnya.” Maka ia bersaksi atas kebenaran dan mengakui bahwa perisai itu miliknya, dan ia masuk Islam. {cite:tarikh-khulafa-minhaj-1434 p. 306-307}"
