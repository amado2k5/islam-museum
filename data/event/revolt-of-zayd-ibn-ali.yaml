summary:
  ar: "في سنة إحدى وعشرين ومائة ذكر الطبري ظهور زيد بن علي {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وكان قبل ذلك يخاصم بني الحسن أمام هشام بن عبد الملك في الرصافة {cite:tabari-tarikh-abu-al-fadl j.7 p.161}."
  en: "In 121 al-Tabari records the rising of Zayd ibn Ali {cite:tabari-tarikh-abu-al-fadl j.7 p.161}; before that he had argued with the sons of al-Hasan before Hisham ibn Abd al-Malik at al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.7 p.161}."
  es: "En 121 al-Tabari registra el levantamiento de Zayd ibn Ali {cite:tabari-tarikh-abu-al-fadl j.7 p.161}; antes de eso había discutido con los hijos de al-Hasan ante Hisham ibn Abd al-Malik en al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.7 p.161}."
  fr: "En 121, al-Tabari relate le soulèvement de Zayd ibn Ali {cite:tabari-tarikh-abu-al-fadl j.7 p.161}; avant cela, il avait argumenté avec les fils d'al-Hasan devant Hisham ibn Abd al-Malik à al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.7 p.161}."
