id: event/umrah-of-jirana
class: event
kind: pilgrimage
label: { en: "The Prophet's Umrah from al-Ji'rana", ar: "عمرة النبي من الجعرانة", es: "La Umrah del Profeta desde al-Ji'rana", fr: "La Omra du Prophète d'après al-Ji'rana", ur: "الجیرانہ سے پیغمبر کا عمرہ", tr: "Peygamber'in Ci'râne'den yaptığı umre", id: "Umrah Nabi dari Al-Ji'ranah" }
summary:
  en: "After completing the distribution of spoils, the Prophet entered the state of ihram from al-Ji'rana by night, entered Mecca to perform the rites of Umrah, confirmed Attab ibn Asid as governor of Mecca, and departed back to Medina in Dhu al-Qa'dah 8 AH."
  ar: "بعد فراغه من قسمة الفيء، أحرم النبي بالعمرة ليلاً من الجعرانة، ودخل مكة فطاف وسعى، وثبّت عتاب بن أسيد أميراً على مكة، ثم قفل راجعاً بجيشه إلى المدينة في ذي القعدة سنة 8هـ."
  es: "Tras completar el reparto del botín, el Profeta entró en estado de ihram desde al-Ji'rana durante la noche, entró en La Meca para realizar los ritos de la Umrah, confirmó a Attab ibn Asid como gobernador de La Meca y regresó a Medina en Dhu al-Qa'dah del año 8 de la Hégira."
  fr: "Après avoir terminé la distribution du butin, le Prophète entra en état d'ihram à al-Ji'rana de nuit, entra à La Mecque pour accomplir les rites de la Omra, confirma Attab ibn Asid comme gouverneur de La Mecque et repartit pour Médine en Dhu al-Qa'dah 8 AH."
  ur: "مال غنیمت کی تقسیم سے فارغ ہونے کے بعد، رسول اللہ رات کو الجیرانہ سے احرام کی حالت میں داخل ہوئے، عمرہ کی ادائیگی کے لیے مکہ میں داخل ہوئے، عتاب بن اسید کو مکہ کا گورنر مقرر کیا، اور ذوالقعدہ 8 ہجری میں مدینہ واپس روانہ ہوئے۔"
  tr: "Peygamber, ganimetleri paylaştırdıktan sonra geceleyin Ciranah'tan Umre için ihram haline girdi, Mekke'ye girdi, Tavaf ve Sa'i yaptı ve Attab bin Asid'i Mekke emiri olarak atadı, ardından Hicri 8. yılın Zilhicce ayında ordusuyla birlikte Medine'ye döndü."
  id: "Setelah selesai membagi rampasan perang, Nabi memasuki keadaan ihram untuk melakukan Umrah di malam hari dari Al-Ji'ranah, memasuki Mekah, melakukan Tawaf dan Sa'i, dan mengangkat Attab bin Asid sebagai emir Mekah, kemudian kembali bersama pasukannya ke Madinah pada bulan Dzul Qi'dah tahun 8 Hijriah."
