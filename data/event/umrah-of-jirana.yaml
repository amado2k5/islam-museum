label: { en: "The Prophet's Umrah from al-Ji'rana", ar: "عمرة النبي من الجعرانة" }
summary:
  en: "After completing the distribution of spoils, the Prophet entered the state of ihram from al-Ji'rana by night, entered Mecca to perform the rites of Umrah, confirmed Attab ibn Asid as governor of Mecca, and departed back to Medina in Dhu al-Qa'dah 8 AH."
  ar: "بعد فراغه من قسمة الفيء، أحرم النبي بالعمرة ليلاً من الجعرانة، ودخل مكة فطاف وسعى، وثبّت عتاب بن أسيد أميراً على مكة، ثم قفل راجعاً بجيشه إلى المدينة في ذي القعدة سنة 8هـ."
