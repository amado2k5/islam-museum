label: { ar: "ثورة البيازين وسقوط لوشة", en: "The Bayyazin revolt and the fall of Loja", es: "La revuelta de Bayyazin y la caída de Loja", fr: "La révolte de Bayyazin et la chute de Loja", ur: "بیازین کی بغاوت اور لوجا کا زوال", tr: "Albaicín İsyanı ve Loja'nın Düşüşü", id: "Pemberontakan Albaicín dan Kejatuhan Loja" }
summary:
  ar: "أطلق صاحب قشتالة السلطان أبا عبد الله الذي كان تحت أسره وكساه ووعده بكل ما يتمناه وأعطاه المال والرجال على أن من دخل تحت حكمه من المسلمين فهو في الهدنة، فخرج لبلش فأطاعه أهلها ونودي بالصلح في الأسواق؛ وقام ربض البيازين بدعوة السلطان المأسور فوقعت فتنة عظيمة في غرناطة نفسها بين المسلمين من ثالث ربيع الأول سنة إحدى وتسعين وثمانمائة إلى منتصف جمادى الأولى، ورجموا البيازين بالحجارة من القلعة {cite:nafh-tib-maqqari p. 520-521}. وقدم السلطان على لوشة ودخلها راجياً الصلح بينه وبين عمه الزغل بأن يكون للعم الملك وابن أخيه تحت إيالته، فنازلها صاحب قشتالة وضيق بها الحصار ولم يأت لنصرتها غير البيازين، فطلب أهلها الأمان وأخذ البلد في السادس والعشرين من جمادى الأولى سنة إحدى وتسعين وثمانمائة — وهي بلد سلف الوزير لسان الدين ابن الخطيب — وهاجر أهلها إلى غرناطة وصرح أهلها بأنه ما جاء للوشة إلا ليدخل إليها العدو ويجعلها فداء له {cite:nafh-tib-maqqari p. 521}."
  en: "Castile released the captive Boabdil, clothed him and armed him to split the Muslims — Vélez submitted and 'peace' was cried in the markets; Granada's Bayazin quarter rose for him (Rabi I–Jumada I 891) while the Alcazaba stoned them. He then entered Loja seeking reconciliation with his uncle al-Zaghal, but the Castilian siege starved it into surrender on 26 Jumada I 891 — Ibn al-Khatib's ancestral town — and Granada openly said he had come only to hand Loja over as his ransom {cite:nafh-tib-maqqari p. 520-521}."
  es: "Castilla liberó al cautivo Boabdil, lo vistió y lo armó para dividir a los musulmanes; Vélez se sometió y se clamó \"paz\" en los mercados; el barrio de Bayazin de Granada se alzó en su honor (Rabi I–Jumada I 891) mientras que la Alcazaba los apedreaba. Luego entró en Loja buscando la reconciliación con su tío al-Zaghal, pero el asedio castellano la obligó a rendirse por hambre el 26 de Jumada I 891 —ciudad ancestral de Ibn al-Khatib— y Granada declaró abiertamente que solo había venido a entregar Loja como rescate {cite:nafh-tib-maqqari p. 520-521}."
  fr: "La Castille libéra Boabdil, le vêtit et l'arma pour diviser les musulmans. Vélez se soumit et la paix fut proclamée sur les marchés. Le quartier Bayazin de Grenade se souleva pour lui (Rabi Ier – Jumada Ier 891) tandis que l'Alcazaba lapidait la population. Il entra ensuite à Loja, cherchant à se réconcilier avec son oncle al-Zaghal, mais le siège castillan affama la ville, qui capitula le 26 Jumada Ier 891. Loja était la ville ancestrale d'Ibn al-Khatib, et Grenade déclara ouvertement qu'il n'était venu que pour livrer Loja en guise de rançon."
  ur: "کاسٹائل نے اسیر بوعبدل کو رہا کیا، اسے کپڑے پہنائے اور مسلمانوں کو تقسیم کرنے کے لیے مسلح کیا — ویلز نے عرض کیا اور بازاروں میں 'امن' کا نعرہ لگایا گیا۔ غرناطہ کا بیازین کوارٹر اس کے لیے بلند ہوا ⁦(ربیع اول – جمعہ اول 891)⁩ جبکہ الکازابہ نے انہیں سنگسار کیا۔ اس کے بعد وہ لوجا میں اپنے چچا الزغل کے ساتھ صلح کی کوشش میں داخل ہوا، لیکن کاسٹیلین محاصرے نے اسے 26 جمادی الثانی 891 - ابن الخطیب کا آبائی شہر - کو ہتھیار ڈالنے پر مجبور کر دیا اور گریناڈا نے کھلے عام کہا کہ وہ صرف لوجا کو اس کے تاوان کے طور پر حوالے کرنے آیا ہے۔ 520-521}۔"
  tr: "Kastilya hükümdarı, esir aldığı Sultan Ebu Abdullah'ı serbest bıraktı, ona giysi verdi, dilediği her şeyi vaat etti ve Müslümanlar arasından kendi yönetimine girecek herkesin barış içinde olacağı şartıyla ona para ve adam verdi. Böylece Sultan, Belş'e gitti ve halkı ona itaat etti; çarşılarda barış ilan edildi. Esir Sultan'ın daveti üzerine Albayzin banliyösü ayaklandı ve 891 yılının Rebiü'l-Evvel ayının üçüncü gününden Cemâdî-Ula ayının ortasına kadar Granada'da Müslümanlar arasında büyük bir isyan çıktı ve Albayzin kalesi taşlandı. {kaynak: nafh-tib-makqkari s. 520-521}. Sultan, amcası Zağal ile barış sağlamak umuduyla Loja'ya geldi ve oraya girdi; böylece amcası kral olacak ve yeğeni de kendi yönetimi altında olacaktı. Kastilya hükümdarı şehri kuşattı ve kuşatmayı sıkılaştırdı; Albaicín dışında kimse yardıma gelmedi. Bunun üzerine halkı güvenlik istedi ve şehir 891 yılının Cemâdî Ula ayının 26. gününde ele geçirildi -ki bu şehir, bakan Lisan el-Din İbn el-Hatib'in selefinin şehridir- ve halkı Granada'ya göç etti. Halkı, onun Loja'ya sadece düşmanın şehre girip kendisi için fidye istemesi için geldiğini söyledi. {Kaynak: Nafh-tib-makqari s. 521}"
  id: "Penguasa Kastilia membebaskan Sultan Abu Abdullah, yang berada dalam penawanan, memberinya pakaian, menjanjikan segala keinginannya, dan memberinya uang serta pasukan dengan syarat bahwa siapa pun yang berada di bawah kekuasaannya dari kalangan Muslim akan berada di bawah gencatan senjata. Maka ia pergi ke Balsh, dan penduduknya menaatinya, dan perdamaian diumumkan di pasar-pasar. Pinggiran kota Albayzin bangkit atas ajakan Sultan yang ditawan, dan pemberontakan besar meletus di Granada sendiri di kalangan Muslim dari tanggal 3 Rabi' al-Awwal tahun 891 hingga pertengahan Jumada al-Ula, dan mereka melempari Albayzin dengan batu dari benteng. {cite:nafh-tib-maqqari hlm. 520-521}. Sultan datang ke Loja dan memasukinya dengan harapan perdamaian antara dirinya dan pamannya Al-Zaghal, sehingga pamannya akan menjadi raja dan keponakannya akan berada di bawah kekuasaannya. Penguasa Kastilia mengepungnya dan memperketat pengepungan, dan tidak ada yang datang membantunya kecuali Albaicín. Maka penduduknya meminta perlindungan, dan kota itu direbut pada tanggal 26 Jumada al-Ula tahun 891 - dan itu adalah kota pendahulu menteri Lisan al-Din Ibn al-Khatib - dan penduduknya berhijrah ke Granada, dan penduduknya menyatakan bahwa ia hanya datang ke Loja agar musuh memasukinya dan menjadikannya tebusan baginya {cite:nafh-tib-maqqari p. 521}."
