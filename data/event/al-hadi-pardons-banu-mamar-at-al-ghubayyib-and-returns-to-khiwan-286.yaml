id: event/al-hadi-pardons-banu-mamar-at-al-ghubayyib-and-returns-to-khiwan-286
class: event
kind: other
label:
  ar: الهادي يعفو عن بني معمر عند الغبيّب ويعود إلى خيوان، رجب 286هـ
  en: Al-Hadi pardons Banu Ma'mar at al-Ghubayyib and returns to Khiwan, Rajab 286 AH
  ur: غبیّب میں ہادی بنو معمر کو معاف کرتے ہیں اور خیوان لوٹتے ہیں، رجب 286ھ
  es: "Al-Hadi perdona a Banu Ma'mar en al-Ghubayyib y regresa a Khiwan, Rajab 286 AH"
  fr: "Al-Hadi gracie Banu Ma'mar à al-Ghubayyib et retourne à Khiwan, Rajab 286 AH"
  tr: "Al-Hadi, Al-Ghabib'de Banu Mu'ammar'ı affeder ve Receb 286 H.'de Hayvan'a döner."
  id: "Al-Hadi mengampuni Bani Mu'ammar di Al-Ghabib dan kembali ke Khaywan, Rajab 286 H."
summary:
  ar: بعد صلاة الجماعة عند الغبيّب أمر الهادي الناس بلزوم صفوفهم، وطلب منه رسل القوم أن يبرز عن العسكر في جماعة، فلما برز أتوه جميعاً واعتذروا، فقال إنه لولا سبق حاشد إلى نصرته لسالت دماؤهم ولكنه لا يريد أن يشمت بحاشد عدواً، فشفع فيهم من حضر من حاشد فعفا عنهم وصرفهم إلى منازلهم وعاد إلى خيوان يوم الخميس لليلتين بقيتا من رجب 286هـ.
  en: After the prayer at al-Ghubayyib al-Hadi told the army to hold its ranks; the group's envoys asked him to come out of the camp with a party, and when he did they all came and apologised. He said that but for Hashid, the first of Hamdan to support him, he would have let their blood flow, yet he did not wish to give an enemy cause to gloat over Hashid; the Hashid men present interceded, he pardoned the group and sent them home, and returned to Khiwan on Thursday, two days from the end of Rajab 286 AH.
  ur: غبیّب پر نماز جماعت کے بعد ہادی نے فوج کو صفوں میں ٹھہرنے کا حکم دیا؛ قوم کے قاصدوں نے درخواست کی کہ وہ لشکر سے نکل کر ایک جماعت کے ساتھ آئیں، اور جب وہ نکلے تو سب آ کر معذرت خواہ ہوئے۔ ہادی نے کہا کہ اگر حاشد سب سے پہلے ان کی مدد پر نہ اٹھتے تو ان کا خون بہا دیا جاتا، مگر وہ حاشد کے دشمن کو خوش ہونے کا موقع نہیں دینا چاہتے؛ موجود حاشدیوں نے سفارش کی تو انہوں نے معاف کر دیا، انہیں گھروں کو بھیجا اور رجب کے آخر کے دو دن باقی تھے تو جمعرات کو خیوان لوٹ آئے۔
  es: "Tras la oración en al-Ghubayyib, al-Hadi ordenó al ejército que mantuviera sus filas. Los enviados del grupo le pidieron que saliera del campamento acompañado, y cuando lo hizo, todos se acercaron y le pidieron disculpas. Dijo que, de no ser por Hashid, el primero de Hamdan en apoyarlo, habría dejado que corrieran sangre, pero que no quería dar al enemigo motivos para regodearse por Hashid. Los hombres de Hashid presentes intercedieron, él perdonó al grupo y los envió a casa, y regresó a Khiwan el jueves, dos días antes del final de Rajab del año 286 de la Hégira."
  fr: "Après la prière à al-Ghubayyib, al-Hadi ordonna à l'armée de tenir ses rangs. Les émissaires du groupe lui demandèrent de sortir du camp avec une délégation. À son arrivée, ils vinrent tous lui présenter leurs excuses. Il déclara que sans Hashid, le premier de Hamdan à l'avoir soutenu, il aurait laissé couler leur sang, mais qu'il ne souhaitait pas donner à l'ennemi de quoi se réjouir de la victoire de Hashid. Les hommes de Hashid présents intercédèrent, il pardonna au groupe et les renvoya chez eux. Il retourna à Khiwan le jeudi, deux jours avant la fin du mois de Rajab 286 AH."
  tr: "Al-Ghabib'deki cemaat namazından sonra Al-Hadi, halka saflarını korumalarını emretti ve halkın elçileri ondan ordudan topluca çıkmasını istediler. Çıktığında, hepsi yanına gelip özür dilediler. Eğer Haşid'in yardımına koşması olmasaydı, kanlarının döküleceğini, ancak Haşid'e düşmanlık edip sevinme fırsatı vermek istemediğini söyledi. Bunun üzerine Haşid'den orada bulunanlar onlar için şefaat ettiler, böylece onları affetti ve evlerine gönderdi. Hicri 286 yılının Receb ayının bitimine iki gece kala, Perşembe günü Hayvan'a döndü."
  id: "Setelah salat berjamaah di Al-Ghabib, Al-Hadi memerintahkan orang-orang untuk menjaga barisan mereka, dan para utusan meminta beliau untuk keluar dari pasukan secara berkelompok. Ketika beliau keluar, mereka semua mendatanginya dan meminta maaf. Beliau berkata bahwa jika bukan karena pertolongan Hashid, darah mereka pasti sudah tertumpah, tetapi beliau tidak ingin memberi Hashid alasan untuk bersukacita. Maka orang-orang yang hadir dari pihak Hashid memohonkan syafaat untuk mereka, sehingga beliau memaafkan mereka dan mengirim mereka kembali ke rumah masing-masing dan kembali ke Khaywan pada hari Kamis, dua malam tersisa di bulan Rajab 286 H."
