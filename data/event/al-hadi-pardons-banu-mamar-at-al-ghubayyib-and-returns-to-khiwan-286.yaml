id: event/al-hadi-pardons-banu-mamar-at-al-ghubayyib-and-returns-to-khiwan-286
class: event
kind: other
label:
  ar: الهادي يعفو عن بني معمر عند الغبيّب ويعود إلى خيوان، رجب 286هـ
  en: Al-Hadi pardons Banu Ma'mar at al-Ghubayyib and returns to Khiwan, Rajab 286 AH
  ur: غبیّب میں ہادی بنو معمر کو معاف کرتے ہیں اور خیوان لوٹتے ہیں، رجب 286ھ
summary:
  ar: بعد صلاة الجماعة عند الغبيّب أمر الهادي الناس بلزوم صفوفهم، وطلب منه رسل القوم أن يبرز عن العسكر في جماعة، فلما برز أتوه جميعاً واعتذروا، فقال إنه لولا سبق حاشد إلى نصرته لسالت دماؤهم ولكنه لا يريد أن يشمت بحاشد عدواً، فشفع فيهم من حضر من حاشد فعفا عنهم وصرفهم إلى منازلهم وعاد إلى خيوان يوم الخميس لليلتين بقيتا من رجب 286هـ.
  en: After the prayer at al-Ghubayyib al-Hadi told the army to hold its ranks; the group's envoys asked him to come out of the camp with a party, and when he did they all came and apologised. He said that but for Hashid, the first of Hamdan to support him, he would have let their blood flow, yet he did not wish to give an enemy cause to gloat over Hashid; the Hashid men present interceded, he pardoned the group and sent them home, and returned to Khiwan on Thursday, two days from the end of Rajab 286 AH.
  ur: غبیّب پر نماز جماعت کے بعد ہادی نے فوج کو صفوں میں ٹھہرنے کا حکم دیا؛ قوم کے قاصدوں نے درخواست کی کہ وہ لشکر سے نکل کر ایک جماعت کے ساتھ آئیں، اور جب وہ نکلے تو سب آ کر معذرت خواہ ہوئے۔ ہادی نے کہا کہ اگر حاشد سب سے پہلے ان کی مدد پر نہ اٹھتے تو ان کا خون بہا دیا جاتا، مگر وہ حاشد کے دشمن کو خوش ہونے کا موقع نہیں دینا چاہتے؛ موجود حاشدیوں نے سفارش کی تو انہوں نے معاف کر دیا، انہیں گھروں کو بھیجا اور رجب کے آخر کے دو دن باقی تھے تو جمعرات کو خیوان لوٹ آئے۔
