id: event/qutayba-sijistan-visit
class: event
kind: other
label: { ar: "قدوم قتيبة سجستان", en: "Qutayba's Coming to Sijistan", es: "Qutayba llega a Sijistan", fr: "L'arrivée de Qutayba au Sijistan", ur: "قتیبہ سجستان میں آرہا ہے۔", tr: "Kuteybe Sijistan'ın gelişi", id: "Kedatangan Qutaybah Sijistan" }
summary:
  ar: "لما ولي قتيبة بن مسلم الباهلي خراسان وسجستان في أيام الوليد بن عبد الملك ولّى أخاه عمرو بن مسلم سجستان فطالبه رتبيل بدراهم مدرةمة فذكر أنه لا يمكنه إلا ما كان فارق عليه الحجاج من العرض فكتب عمرو بذلك إلى قتيبة فأقبل قتيبة إلى سجستان فلما بلغ رتبيل قدومه أرسل إليه أنا لم نخلع يداً من طاعة وإنما فارقناكم على عروض فلا تظلمونا فقال قتيبة للجند اقبلوا منه العروض فإنه ثغر مشؤوم فرضوا بها ثم انصرف قتيبة إلى خراسان بعد أن زرع زرعاً في أرض زرنج لييأس العدو من انصرافه فيذعن فلما أخذ ذلك الزرع منعه منه الأفاعي فأمر به فحرق واستخلف قتيبة على سجستان ابن عبد الله بن عمير الليثي أخي عبد الله بن عامر لأمه."
  en: "Qutayba ibn Muslim, holding Khurasan and Sijistan under al-Walid, gave Sijistan to his brother Amr; when Amr pressed Rutbil for arrears, Rutbil answered he owed only the 'urud agreed with al-Hajjaj. Amr wrote to Qutayba, who came in person; Rutbil sent: 'we have not left obedience — we only agreed on 'urud, so do not wrong us'. Qutayba told the army 'accept his 'urud — it is an accursed frontier', and they did. Before returning he sowed a crop at Zaranj so the enemy would despair of his leaving and submit; when locusts ate it he had it burned, leaving Ibn Abdallah ibn Umayr al-Laythi — Ibn Amir's maternal half-brother — over Sijistan."
  es: "Qutayba ibn Muslim, que gobernaba Jorasán y Sijistán bajo el mando de al-Walid, cedió Sijistán a su hermano Amr. Cuando Amr presionó a Rutbil para que le pagara los atrasos, este respondió que solo debía el 'urud acordado con al-Hajjaj. Amr escribió a Qutayba, quien acudió personalmente. Rutbil envió un mensaje diciendo: «No hemos abandonado la obediencia; solo acordamos el 'urud, así que no nos perjudiquen». Qutayba le dijo al ejército: «Acepten su 'urud; es una frontera maldita», y así lo hicieron. Antes de regresar, sembró una cosecha en Zaranj para que el enemigo desesperara de su partida y se sometiera. Cuando las langostas la devoraron, la mandó quemar, dejando a Ibn Abdallah ibn Umayr al-Laythi —medio hermano materno de Ibn Amir— al frente de Sijistán."
  fr: "Qutayba ibn Muslim, qui détenait le Khorasan et le Sijistan sous l'autorité d'al-Walid, céda le Sijistan à son frère Amr. Lorsque ce dernier réclama à Rutbil les arriérés, Rutbil répondit qu'il ne devait que l'ourd convenu avec al-Hajjaj. Amr écrivit à Qutayba, qui se rendit sur place. Rutbil répondit: « Nous n'avons pas manqué à notre devoir d'obéissance; nous nous sommes seulement mis d'accord sur l'ourd, alors ne nous lésez pas. » Qutayba ordonna à l'armée d'accepter son ourd, car c'est une frontière maudite, et ils obéirent. Avant de repartir, il sema une récolte à Zaranj afin que l'ennemi, désespéré de son départ, se soumette. Lorsque les sauterelles la dévorèrent, il la fit brûler, laissant ainsi le Sijistan à Ibn Abdallah ibn Umayr al-Laythi, demi-frère maternel d'Ibn Amir."
  ur: "قتیبہ بن مسلم نے خراسان اور سجستان کو الولید کے ماتحت کیا اور سجستان اپنے بھائی عمرو کو دے دیا۔ جب عمرو نے رطبیل پر بقایا جات کے لیے دباؤ ڈالا تو رتبیل نے جواب دیا کہ وہ صرف حجاج کے ساتھ متفقہ اُرد کا مقروض ہے۔ عمرو نے قتیبہ کو لکھا، جو ذاتی طور پر آیا تھا۔ رتبل نے بھیجا: 'ہم نے اطاعت نہیں چھوڑی - ہم صرف 'ارد' پر اکتفا کرتے ہیں، لہٰذا ہم پر ظلم نہ کریں۔ قتیبہ نے فوج سے کہا کہ 'اس کا 'ارد قبول کرو - یہ ایک ملعون سرحد ہے'، اور انہوں نے ایسا کیا۔ واپس آنے سے پہلے اس نے زرنج میں فصل بوئی تاکہ دشمن اس کے جانے سے مایوس ہو کر سر تسلیم خم کردے۔ جب ٹڈیوں نے اسے کھا لیا تو اس نے اسے جلا دیا، ابن عبداللہ ابن عمیر لیثی - ابن عامر کے سوتیلے بھائی - کو سجستان پر چھوڑ دیا۔"
  tr: "Kuteybe ibn Müslim el-Bahili, el-Valid ibn Abd el-Malik döneminde Horasan ve Sijistan valiliğine atandığında, kardeşi Amr ibn Müslim'i Sijistan valiliğine atadı. Ratbil ondan büyük bir miktar para istedi ve Kuteybe, ancak el-Haccac'ın kendisine mal karşılığında verdiği kadarını verebileceğini belirtti. Amr bunu Kuteybe'ye bildirdi ve Kuteybe Sijistan'a geldi. Ratbil onun gelişini öğrenince ona şöyle bir mesaj gönderdi: \"Bağlılığımızı geri çekmedik, ancak mal karşılığında sizi terk ettik, bu yüzden bize haksızlık etmeyin.\" Kuteybe askerlere, \"Ondan malları kabul edin, çünkü o uğursuz bir sınırdır\" dedi. Bunun üzerine askerler mallardan memnun kaldılar. Daha sonra Kuteybe, düşmanın ayrılışından umudunu kesip teslim olması için Zaranj topraklarında ekinler ektikten sonra Horasan'a döndü. Ekinleri götürdüğünde yılanlar ona engel oldu, bu yüzden ekinlerin yakılmasını emretti. Kuteybe, Abdullah ibn Emir'in anne tarafından kardeşi olan İbn Abdullah ibn Umeyr el-Layti'yi Sijistan'daki yardımcısı olarak atadı."
  id: "Ketika Qutaybah ibn Muslim al-Bahili diangkat menjadi gubernur Khurasan dan Sijistan pada masa pemerintahan al-Walid ibn Abd al-Malik, ia menunjuk saudaranya, Amr ibn Muslim, sebagai gubernur Sijistan. Ratbil menuntut sejumlah besar uang darinya, dan ia menyebutkan bahwa ia hanya dapat memberikan apa yang telah diberikan al-Hajjaj kepadanya sebagai imbalan atas barang-barang. Amr menulis surat kepada Qutaybah tentang hal ini, dan Qutaybah datang ke Sijistan. Ketika Ratbil mengetahui kedatangannya, ia mengirim pesan kepadanya, “Kami belum menarik kesetiaan kami, tetapi kami meninggalkanmu demi barang-barang, jadi janganlah engkau menzalimi kami.” Qutaybah berkata kepada para prajurit, “Terimalah barang-barang darinya, karena ia adalah musuh yang berbahaya.” Maka mereka pun puas dengan barang-barang tersebut. Kemudian Qutaybah kembali ke Khurasan setelah menanam tanaman di tanah Zaranj agar musuh putus asa akan kepergiannya dan menyerah. Ketika ia mengambil hasil panen tersebut, ular-ular menghalanginya, sehingga ia memerintahkan agar tanaman tersebut dibakar. Qutaybah menunjuk Ibn Abdullah ibn Umayr al-Laythi, saudara Abdullah ibn Amir dari pihak ibunya, sebagai wakilnya di Sijistan."
