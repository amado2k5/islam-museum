id: event/battle-of-hamadhan-195
class: event
kind: battle
label:
  ar: وقعتا همذان وأسداباذ (195)
  en: Battles of Hamadhan and Asadabad (195 AH)
  ur: ہمذان اور اسداباذ کی لڑائیاں (195ھ)
summary:
  ar: بعد مقتل علي بن عيسى بالري وجّه الأمين عبد الرحمن الأبناوي في ثلاثين ألفاً من الأبناء، فهزمه طاهر بن الحسين، فتحصّن بهمذان شهراً ثم أخذ الأمان، ثم بيّت أصحاب طاهر بأسداباذ فقُتل، فيما يروي الدينوري {cite:akhbar-tiwal-amir p. 398} {cite:akhbar-tiwal-amir p. 399}.
  en: After Ali ibn Isa was killed at Rayy, al-Amin sent Abd al-Rahman al-Abnawi with thirty thousand of the Abna'; Tahir ibn al-Husayn defeated him, he held out in Hamadhan for a month and took safe-conduct, then attacked Tahir's men at dawn at Asadabad and was killed, as al-Dinawari reports {cite:akhbar-tiwal-amir p. 398} {cite:akhbar-tiwal-amir p. 399}.
  ur: رے میں علی بن عیسیٰ کے قتل کے بعد امین نے عبد الرحمن ابناوی کو ابناء کے تیس ہزار آدمیوں کے ساتھ بھیجا؛ طاہر بن حسین نے اسے شکست دی، وہ ایک مہینہ ہمذان میں قلعہ بند رہا اور امان لی، پھر اسداباذ میں طاہر کے ساتھیوں پر صبح سویرے حملہ کیا اور مارا گیا، جیسا کہ دینوری روایت کرتے ہیں {cite:akhbar-tiwal-amir p. 398} {cite:akhbar-tiwal-amir p. 399}۔
