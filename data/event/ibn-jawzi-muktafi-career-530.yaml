label:
  ar: "بداية مسيرة ابن الجوزي في عهد المكتفي لإله الله"
  en: "Ibn al-Jawzi begins his career under the caliph al-Muktafi"
  ur: "خلیفہ مکتفی باللہ کے عہد میں ابن الجوزی کے سفر کا آغاز"
summary:
  ar: "بدأ ابن الجوزي مسيرته العلمية والوعظية في خلافة المكتفي لإله الله (٥٣٠–٥٥٥هـ/١١٣٦–١١٦٠م) بفضل كفالة الوزير الحنبلي ابن هبيرة، فأخذ يعقد مجلس الوعظ كل يوم جمعة في دار ابن هبيرة نفسه {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  en: "Ibn al-Jawzi began his scholarly and preaching career in the caliphate of al-Muktafi (530–555/1136–1160), thanks to the patronage of the Hanbali vizier Ibn Hubayra, holding a waʿẓ session every Friday in Ibn Hubayra's own house {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  ur: "ابن الجوزی نے خلیفہ مکتفی باللہ (530–555ھ/1136–1160ء) کے دور میں حنبلی وزیر ابن ہبیرہ کی سرپرستی سے اپنا علمی اور وعظ کا کام شروع کیا اور ہر جمعہ ابن ہبیرہ کے گھر ہی میں مجلسِ وعظ منعقد کرتے {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}۔"
