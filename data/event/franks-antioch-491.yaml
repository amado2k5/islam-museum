id: event/franks-antioch-491
class: event
kind: conquest
label: { ar: "أخذ الفرنج أنطاكية ومقتلة المعرة سنة 491", en: "The Franks Take Antioch and the Massacre at Ma'arra, 491", es: "Los francos toman Antioquía y la masacre de Ma'arra, 491", fr: "La prise d'Antioche par les Francs et le massacre de Ma'arra, 491", ur: "فرانکس نے انطاکیہ اور مااررا میں قتل عام، 491", tr: "Franklar Antakya'yı ele geçirdi ve 491 yılında Ma'arra'da katliam yaşandı.", id: "Bangsa Frank merebut Antiokhia dan terjadi pembantaian di Ma'arra pada tahun 491." }
summary:
  ar: "في سنة إحدى وتسعين وأربعمائة خرج الفرنج في ألف ألف وحاصروا أنطاكية سبعة أشهر وأخذوها عنوة، وخرج إليهم المسلمون فانكسروا، وتبعهم الفرنج إلى المعرة وقتلوا وفتكوا وأقاموا بها وقتلوا فيها مائة ألف مسلم، وبعد أربعين يوماً ساروا إلى حمص فصالحهم أهلها ثم توجهوا إلى القدس {cite:shadharat-dhahab p. 396}."
  en: "In 491 the Franks marched out a hundred thousand strong, besieged Antioch seven months and took it by storm; the Muslim relief was broken, they followed to Ma'arra killing and slaughtering and slew a hundred thousand Muslims there, then after forty days moved to Homs whose people bought them off, and turned on Jerusalem {cite:shadharat-dhahab p. 396}."
  es: "En 491, los francos marcharon con cien mil hombres, sitiaron Antioquía durante siete meses y la tomaron por asalto; el socorro musulmán fue quebrado, siguieron hasta Ma'arra matando y masacrando a cien mil musulmanes allí, luego, después de cuarenta días, se trasladaron a Homs, cuya gente los sobornó, y se volvieron hacia Jerusalén {cite:shadharat-dhahab p. 396}."
  fr: "En 491, les Francs, forts de cent mille hommes, ont assiégé Antioche pendant sept mois et l'ont prise d'assaut; le secours musulman a été brisé, ils ont poursuivi jusqu'à Ma'arra, tuant et massacrant, et y ont tué cent mille musulmans, puis après quarante jours, ils se sont déplacés vers Homs dont les habitants les ont rachetés, et se sont tournés vers Jérusalem {cite:shadharat-dhahab p. 396}."
  ur: "491 میں فرینکوں نے ایک لاکھ مضبوط مارچ کیا، سات مہینے تک انطاکیہ کا محاصرہ کیا اور طوفان کے ذریعے اسے لے لیا۔ مسلمانوں کا سکون ٹوٹ گیا، انہوں نے معررہ تک قتل و غارت گری کی اور وہاں ایک لاکھ مسلمانوں کو قتل کیا، پھر چالیس دن کے بعد حمص چلے گئے جہاں کے لوگوں نے انہیں خرید لیا، اور یروشلم کو چالو کر دیا۔ 396}۔"
  tr: "Hicri 491 yılında Franklar bir milyon askerle Antakya'yı yedi ay boyunca kuşattılar ve şehri zorla ele geçirdiler. Müslümanlar onlara karşı çıktılar ve yenildiler. Franklar onları Ma'arra'ya kadar takip ettiler, orada yüz bin Müslümanı öldürdüler. Kırk gün sonra Homs'a doğru yürüdüler, Homs halkı onlarla barış yaptı, ardından Kudüs'e yöneldiler. {cite:shadharat-dhahab s. 396}"
  id: "Pada tahun 491 Hijriah, kaum Frank datang dengan satu juta orang dan mengepung Antiokhia selama tujuh bulan dan merebutnya dengan paksa. Kaum Muslim datang melawan mereka dan dikalahkan. Kaum Frank mengejar mereka ke Ma'arra dan membunuh serta membantai seratus ribu Muslim di sana. Setelah empat puluh hari mereka berbaris ke Homs, sehingga penduduknya berdamai dengan mereka, lalu mereka menuju Yerusalem. {cite:shadharat-dhahab hlm. 396}"
