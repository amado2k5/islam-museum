label: { ar: "أخذ الفرنج أنطاكية ومقتلة المعرة سنة 491" }
summary:
  ar: "في سنة إحدى وتسعين وأربعمائة خرج الفرنج في ألف ألف وحاصروا أنطاكية سبعة أشهر وأخذوها عنوة، وخرج إليهم المسلمون فانكسروا، وتبعهم الفرنج إلى المعرة وقتلوا وفتكوا وأقاموا بها وقتلوا فيها مائة ألف مسلم، وبعد أربعين يوماً ساروا إلى حمص فصالحهم أهلها ثم توجهوا إلى القدس {cite:shadharat-dhahab p. 396}."
  en: "In 491 the Franks marched out a hundred thousand strong, besieged Antioch seven months and took it by storm; the Muslim relief was broken, they followed to Ma'arra killing and slaughtering and slew a hundred thousand Muslims there, then after forty days moved to Homs whose people bought them off, and turned on Jerusalem {cite:shadharat-dhahab p. 396}."
