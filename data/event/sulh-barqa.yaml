label: { ar: "صلح برقة وأنطابلس", en: "The Treaty of Barqa (Antabulus)", es: "El Tratado de Barqa (Antabulus)", fr: "Le traité de Barqa (Antabulus)", ur: "برقعہ کا معاہدہ ⁦(انتابلس)⁩" }
summary:
  ar: "عند البلاذري: لما فتح عمرو بن العاص الإسكندرية سار في جنده يريد المغرب حتى قدم برقة وهي مدينة أنطابلس فصالح أهلها على الجزية وهي ثلاثة عشر ألف دينار يبيعون فيها من أبنائهم من أحبّوا بيعه — وفي رواية عبد الله بن هبيرة: بعد أن حاصرهم وقاتلهم على الجزية على أن يبيعوا من أبنائهم من أرادوا في جزيتهم وكتب لهم بذلك كتاباً؛ وكان أهل برقة يبعثون بخراجهم إلى والي مصر من غير أن يأتيهم حاثّ ولا مستحثّ فكانوا أخصب قوم بالمغرب ولم تدخلها فتنة، وكان عبد الله بن عمرو بن العاص يقول لولا مالي بالحجاز لنزلت برقة فما أعلم منزلاً أسلم ولا أعزل منها."
  en: "In al-Baladhuri: when Amr ibn al-As had taken Alexandria he marched with his army seeking the Maghreb until he came to Barqa — that is, the city of Antabulus — whose people compounded for a jizya of thirteen thousand dinars, in which they might sell whom of their children they wished; in Abdallah ibn Hubayra's account, after he had besieged and fought them, on the jizya and that they might sell whom they wished of their children toward their jizya — and he wrote them a book of it. Barqa's people would send their kharaj to Egypt's governor with none to press or hasten them — the most prosperous folk of the Maghreb, no fitna entering it — and Abdallah ibn Amr ibn al-As used to say 'but for my property in the Hijaz I would have settled in Barqa; I know no abode safer nor more wholesome'."
  es: "En al-Baladhuri: cuando Amr ibn al-As tomó Alejandría, marchó con su ejército buscando el Magreb hasta que llegó a Barqa —es decir, la ciudad de Antabulus—, cuyos habitantes pagaron una jizya de trece mil dinares, por la cual podían vender a quien quisieran de sus hijos; en el relato de Abdallah ibn Hubayra, después de haberlos asediado y combatido, sobre la jizya y que podían vender a quien quisieran de sus hijos para pagar su jizya, y les escribió un libro al respecto. La gente de Barqa enviaba a sus kharaj al gobernador de Egipto sin que nadie los presionara ni los apresurara —la gente más próspera del Magreb, sin ninguna fitna que entrara en él— y Abdallah ibn Amr ibn al-As solía decir: «Si no fuera por mis propiedades en el Hiyaz, me habría establecido en Barqa; no conozco morada más segura ni más saludable»."
  fr: "Selon al-Baladhuri: après la prise d’Alexandrie, Amr ibn al-As marcha avec son armée à la recherche du Maghreb jusqu’à Barqa (Antabulus). Les habitants de Barqa constituèrent une jizya de treize mille dinars, leur permettant de vendre leurs enfants à leur guise. Abdallah ibn Hubayra, après avoir assiégé et combattu la ville, rapporte qu’ils pouvaient vendre leurs enfants pour payer la jizya et qu’il en fit un livre. Les habitants de Barqa envoyaient leur kharaj au gouverneur d’Égypte sans que personne ne les presse ni ne les y oblige. C’était le peuple le plus prospère du Maghreb, sans aucune fitna. Abdallah ibn Amr ibn al-As disait: « Sans mes biens au Hedjaz, je me serais installé à Barqa; je ne connais pas de demeure plus sûre ni plus saine. »"
  ur: "البلادوری میں ہے: جب عمرو بن العاص نے اسکندریہ پر قبضہ کیا تو اس نے مغرب کی تلاش میں اپنی فوج کے ساتھ کوچ کیا یہاں تک کہ وہ برقع یعنی انطابلس شہر تک پہنچا جس کے لوگوں نے تیرہ ہزار دینار کا جزیہ دیا، جس میں وہ اپنی اولاد میں سے جسے چاہیں بیچ سکتے تھے۔ عبداللہ بن ہبیرہ کے بیان میں، جب انہوں نے ان کا محاصرہ کیا اور ان سے جنگ کی، جزیہ پر اور یہ کہ وہ اپنی اولاد میں سے جسے چاہیں بیچ دیں جزیہ کے بدلے - اور اس نے ان کے لیے اس کی ایک کتاب لکھی۔ برقع کے لوگ اپنے خرج کو مصر کے گورنر کے پاس بھیجتے تھے کہ ان پر دباؤ ڈالنے یا جلدی کرنے کے لیے کوئی نہیں ہوتا تھا - مغرب کے سب سے خوشحال لوگ، اس میں کوئی فتنہ داخل نہیں ہوتا تھا - اور عبداللہ بن عمرو بن العاص کہتے تھے کہ 'مگر حجاز میں اپنی جائیداد کے لیے میں برقع میں آباد ہوتا۔ میں اس سے زیادہ محفوظ اور صحت بخش کوئی ٹھکانہ نہیں جانتا۔"
