id: event/death-al-safadi-764
class: event
kind: death
label:
  ar: "وفاة الصفدي بدمشق، ١٠ شوال ٧٦٤هـ"
  en: "Al-Safadi dies at Damascus, 10 Shawwal 764/23 July 1363"
  ur: "صفدی کی وفات دمشق میں، 10 شوال 764ھ/23 جولائی 1363ء"
  es: "Al-Safadi muere en Damasco, 10 Shawwal 764/23 de julio de 1363"
  fr: "Al-Safadi meurt à Damas, le 10 Shawwal 764/23 juillet 1363"
  tr: "El-Safadi, Hicri 764 yılının Şevval ayının 10. gününde Şam'da vefat etti."
  id: "Al-Safadi meninggal di Damaskus pada tanggal 10 Syawal 764 Hijriah."
summary:
  ar: "توفي الصفدي بدمشق في ليلة عاشر شوال سنة ٧٦٤هـ ⁦(٢٣ يوليو ١٣٦٣م)⁩ خلال أحد طواعين المدينة الدورية، وكان حينها وكيل الخزانة؛ قال الذهبي في حقه: الأديب البارع الكاتب، شارك في الفنون وتقدم في الإنشاء وجمع وصنّف، وقال ابن كثير إنه كتب ما يقارب مئتي مجلدة {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}."
  en: "Al-Safadi died at Damascus in the night of Saturday to Sunday, 10 Shawwal 764/23 July 1363, during one of the city's periodic plague outbreaks, while holding the post of wakil al-khizana; al-Dhahabi called him 'the accomplished littérateur and writer who shared in all the disciplines', and Ibn Kathir credits him with nearly two hundred volumes {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}."
  ur: "صفدی 10 شوال 764ھ/23 جولائی 1363ء کی رات ⁦(ہفتہ سے اتوار کی رات)⁩ دمشق میں وفات پا گئے — شہر کی موسمی طاعون کی لہروں کے دوران — جبکہ وہ وکیل الخزانہ کے منصب پر تھے؛ ذہبی نے انہیں 'مایہ ناز ادیب و کاتب' کہا اور ابن کثیر کے نزدیک ان کی تحریریں تقریباً دو سو مجلد ہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}۔"
  es: "Al-Safadi murió en Damasco en la noche del sábado al domingo, 10 de Shawwal de 764/23 de julio de 1363, durante uno de los brotes periódicos de peste de la ciudad, mientras ocupaba el cargo de wakil al-khizana; al-Dhahabi lo llamó \"el consumado literato y escritor que participó en todas las disciplinas\", e Ibn Kathir le atribuye casi doscientos volúmenes {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}."
  fr: "Al-Safadi mourut à Damas dans la nuit du samedi au dimanche 10 Shawwal 764/23 juillet 1363, lors d'une des épidémies de peste périodiques de la ville, alors qu'il occupait le poste de wakil al-khizana; al-Dhahabi le qualifia de « littérateur et écrivain accompli qui maîtrisait toutes les disciplines », et Ibn Kathir lui attribue près de deux cents volumes {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}."
  tr: "El-Safadi, Hicri 764 yılının Şevval ayının onuncu gecesi (Miladi 23 Temmuz 1363), şehrin periyodik veba salgınlarından birinde Şam'da vefat etti. O zamanlar hazine görevlisiydi. El-Dhahabi onun hakkında şöyle demiştir: \"Belagatli bir yazardı, sanatlarla uğraştı ve kompozisyonda üstünlük sağladı, ayrıca derledi ve sınıflandırdı.\" İbn Kathir ise yaklaşık iki yüz cilt eser yazdığını söylemiştir. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}"
  id: "Al-Safadi wafat di Damaskus pada malam tanggal sepuluh Syawal tahun 764 H (23 Juli 1363 M) selama salah satu wabah periodik kota tersebut. Pada saat itu, beliau adalah agen perbendaharaan. Al-Dhahabi berkata tentangnya: Penulis yang fasih, beliau berpartisipasi dalam seni dan unggul dalam penulisan, serta mengumpulkan dan mengklasifikasikan. Ibn Kathir mengatakan bahwa beliau menulis hampir dua ratus jilid. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88-89}."
