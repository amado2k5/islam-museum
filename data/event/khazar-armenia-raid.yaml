summary:
  ar: "في سنة ثلاث وثمانين ومئة خرج الخزر على أرمينية فأوقعوا بأهل الإسلام وسفكوا وسبوا أزيد من مئة ألف نسمة وجرى على الإسلام أمر عظيم لم يسمع قبله مثله {cite:tarikh-khulafa-minhaj-1434 p. 461}."
  en: "In year 183 the Khazars broke upon Armenia, slaughtering and carrying captive more than a hundred thousand souls — a calamity upon Islam the like of which had not been heard before {cite:tarikh-khulafa-minhaj-1434 p. 461}."
  es: "En el año 183, los jázaros irrumpieron en Armenia, masacrando y llevando cautivas a más de cien mil personas, una calamidad para el Islam como nunca antes se había oído {cite:tarikh-khulafa-minhaj-1434 p. 461}."
  fr: "En l'an 183, les Khazars ont déferlé sur l'Arménie, massacrant et emmenant captifs plus de cent mille âmes — une calamité sur l'Islam dont on n'avait jamais entendu parler auparavant {cite:tarikh-khulafa-minhaj-1434 p. 461}."
  ur: "سنہ 183 میں خزر آرمینیا پر ٹوٹ پڑے، ایک لاکھ سے زیادہ جانوں کو ذبح اور قید کر کے لے گئے - اسلام پر ایسی آفت جس کی مثال اس سے پہلے کبھی نہیں سنی گئی تھی۔ 461}۔"
  tr: "183 yılında Hazarlar Ermenistan'a ve Müslümanlara saldırdı, 100.000'den fazla insanı öldürdü ve esir aldı. İslam'ın başına daha önce hiç görülmemiş büyük bir felaket geldi. {cite:tarikh-khulafa-minhaj-1434 s. 461}"
  id: "Pada tahun 183, bangsa Khazar menyerang Armenia dan menyerang kaum Muslim, membunuh dan menangkap lebih dari 100.000 orang. Malapetaka besar menimpa Islam, yang belum pernah terjadi sebelumnya. {cite:tarikh-khulafa-minhaj-1434 p. 461}."
