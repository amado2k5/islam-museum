summary:
  ar: "عهد مروان بن الحكم بالخلافة من بعده لاثنين من أولاده، هما عبد الملك وعبد العزيز، وكانت تلك أول مرة يولى فيها اثنان ولاية العهد {cite:khudari-umayyad-state p.145}. ويعلّق الخضري في الحاشية بأن ولاية اثنين لم تكن تنتهي عادةً إلى نتيجة حسنة، لأن الأول كان يميل إلى نزع الثاني؛ فاجتهد عبد الملك في تأخير أخيه عبد العزيز وتولية ابنه الوليد {cite:khudari-umayyad-state p.145}."
