  fr: "Fiche de travail pour la Seconde Fitna, les guerres civiles de la fin de la maison omeyyade après la mort de Yazid, depuis l'ascension d'Ibn al-Zubayr jusqu'à la restauration marwanide sous Abd al-Malik; ses sources ne sont pas encore vérifiées sur la page."
  ur: "دوسرے فتنے کا مسودہ کارڈ، یزید کی موت کے بعد اموی گھر کی خانہ جنگی، ابن الزبیر کے اٹھنے سے لے کر عبد الملک کے ماتحت مروانیوں کی بحالی تک؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
