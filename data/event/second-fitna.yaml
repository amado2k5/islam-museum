  ar: "بطاقة أولية للفتنة الثانية، حروب الأحقاف الأموية بعد موت يزيد من ثورة ابن الزبير إلى رجوع مروان بن الحكم ثم عبد الملك؛ لم تُراجع مصادره على الصفحة بعد."
