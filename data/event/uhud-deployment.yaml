label: { en: "Muslim deployment at Uhud and the archers' post", ar: "تعبئة الجيش الإسلامي عند أحد وتعيين فصيلة الرماة" }
summary:
  ar: "نزل النبي بسبعمائة مقاتل في شعب جبل أحد مستقبلاً المدينة جاعلاً ظهره إلى الجبل، فاحتل بذلك أفضل موقع في الميدان. انتخب خمسين رامياً ماهراً وأعطى قيادتهم لعبد الله بن جبير بن النعمان الأنصاري الأوسي، وأمرهم بالتمركز على جبل صغير جنوب شرق المعسكر عُرف بجبل الرماة. أوصاهم بألا يبرحوا موقفهم نصراً كان أم هزيمة، وقال لقائدهم: «انضح الخيل عنا بالنبل لا يأتون من خلفنا». جعل على الميمنة المنذر بن عمرو وعلى الميسرة الزبير بن العوام يسانده المقداد {cite:mubarakpuri-raheeq p.255}."
