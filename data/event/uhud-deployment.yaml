label: { en: "Muslim deployment at Uhud and the archers' post", ar: "تعبئة الجيش الإسلامي عند أحد وتعيين فصيلة الرماة", es: "El despliegue musulmán en Uhud y el puesto de los arqueros", fr: "Déploiement musulman à Uhud et poste des archers", ur: "احد میں مسلمانوں کی تعیناتی اور تیر اندازوں کی پوسٹ" }
summary:
  ar: "نزل النبي بسبعمائة مقاتل في شعب جبل أحد مستقبلاً المدينة جاعلاً ظهره إلى الجبل، فاحتل بذلك أفضل موقع في الميدان. انتخب خمسين رامياً ماهراً وأعطى قيادتهم لعبد الله بن جبير بن النعمان الأنصاري الأوسي، وأمرهم بالتمركز على جبل صغير جنوب شرق المعسكر عُرف بجبل الرماة. أوصاهم بألا يبرحوا موقفهم نصراً كان أم هزيمة، وقال لقائدهم: «انضح الخيل عنا بالنبل لا يأتون من خلفنا». جعل على الميمنة المنذر بن عمرو وعلى الميسرة الزبير بن العوام يسانده المقداد {cite:mubarakpuri-raheeq p.255}."
  en: "The Prophet halted with seven hundred fighters in the gorge of Mount Uhud, facing Medina with his back to the mountain — the best position on the field. He picked fifty skilled archers under Abdullah ibn Jubayr ibn al-Nu'man al-Ansari al-Awsi and posted them on a small hill southeast of the camp known as the Archers' Hill, ordering them not to leave their position in victory or defeat, and told their commander: 'keep the cavalry off us with your arrows so they cannot come at us from behind.' He put al-Mundhir ibn Amr on the right wing and al-Zubayr ibn al-Awwam on the left, supported by al-Miqdad {cite:mubarakpuri-raheeq p.255}."
  es: "El Profeta se detuvo con setecientos guerreros en el desfiladero del monte Uhud, frente a Medina, de espaldas a la montaña, la mejor posición en el campo de batalla. Seleccionó a cincuenta arqueros expertos bajo el mando de Abdullah ibn Jubayr ibn al-Nu'man al-Ansari al-Awsi y los posicionó en una pequeña colina al sureste del campamento, conocida como la Colina de los Arqueros, ordenándoles que no abandonaran su posición ni en la victoria ni en la derrota. Le dijo a su comandante: «Mantén a la caballería alejada con tus flechas para que no puedan atacarnos por la retaguardia». Colocó a al-Mundhir ibn Amr en el flanco derecho y a al-Zubayr ibn al-Awwam en el izquierdo, apoyados por al-Miqdad {cite:mubarakpuri-raheeq p.255}."
  fr: "Le Prophète fit halte avec sept cents guerriers dans les gorges du mont Uhud, dos à la montagne, face à Médine – la meilleure position sur le champ de bataille. Il choisit cinquante archers chevronnés sous le commandement d'Abdullah ibn Jubayr ibn al-Nu'man al-Ansari al-Awsi et les posta sur une petite colline au sud-est du camp, connue sous le nom de Colline des Archers. Il leur ordonna de ne pas quitter leur position, victoire ou défaite, et dit à leur commandant: « Éloignez la cavalerie de nous avec vos flèches afin qu'elle ne puisse pas nous attaquer par derrière. » Il plaça al-Mundhir ibn Amr à l'aile droite et al-Zubayr ibn al-Awwam à l'aile gauche, soutenus par al-Miqdad (voir Mubarakpuri-Raheeq, p. 255)."
  ur: "نبی سات سو جنگجوؤں کے ساتھ احد پہاڑ کی گھاٹی میں رکے، مدینہ کا رخ پہاڑ کی طرف اپنی پیٹھ کے ساتھ تھا جو کہ میدان کی بہترین پوزیشن تھی۔ اس نے عبداللہ بن جبیر بن النعمان الانصاری العوسی کے ماتحت پچاس ہنر مند تیر اندازوں کو چن لیا اور انہیں کیمپ کے جنوب مشرق میں ایک چھوٹی سی پہاڑی پر تعینات کیا جو تیر اندازوں کی پہاڑی کے نام سے مشہور ہے، انہیں حکم دیا کہ فتح یا شکست میں اپنی پوزیشن نہ چھوڑیں، اور اپنے کمانڈر سے کہا: گھڑسواروں کو اپنے تیروں سے ہم سے دور رکھیں تاکہ وہ ہمارے پیچھے سے نہ آسکیں۔ اس نے المنذر بن عمرو کو دائیں بازو پر اور الزبیر بن العوام کو بائیں طرف رکھا، جس کی تائید المقداد نے کی ہے۔"
