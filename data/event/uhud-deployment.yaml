id: event/uhud-deployment
class: event
kind: council
label: { en: "Muslim deployment at Uhud and the archers' post", ar: "تعبئة الجيش الإسلامي عند أحد وتعيين فصيلة الرماة" }
summary:
  ar: "نزل النبي بسبعمائة مقاتل في شعب جبل أحد مستقبلاً المدينة جاعلاً ظهره إلى الجبل، فاحتل بذلك أفضل موقع في الميدان. انتخب خمسين رامياً ماهراً وأعطى قيادتهم لعبد الله بن جبير بن النعمان الأنصاري الأوسي، وأمرهم بالتمركز على جبل صغير جنوب شرق المعسكر عُرف بجبل الرماة. أوصاهم بألا يبرحوا موقفهم نصراً كان أم هزيمة، وقال لقائدهم: «انضح الخيل عنا بالنبل لا يأتون من خلفنا». جعل على الميمنة المنذر بن عمرو وعلى الميسرة الزبير بن العوام يسانده المقداد {cite:mubarakpuri-raheeq p.255}."
  en: "The Prophet halted with seven hundred fighters in the gorge of Mount Uhud, facing Medina with his back to the mountain — the best position on the field. He picked fifty skilled archers under Abdullah ibn Jubayr ibn al-Nu'man al-Ansari al-Awsi and posted them on a small hill southeast of the camp known as the Archers' Hill, ordering them not to leave their position in victory or defeat, and told their commander: 'keep the cavalry off us with your arrows so they cannot come at us from behind.' He put al-Mundhir ibn Amr on the right wing and al-Zubayr ibn al-Awwam on the left, supported by al-Miqdad {cite:mubarakpuri-raheeq p.255}."
