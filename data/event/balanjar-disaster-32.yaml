label: { ar: "هزيمة بلنجر (32هـ)" }
summary:
  ar: "انتصرت الخزر والترك على المسلمين سنة ٣٢هـ؛ كان عثمان كتب إلى عبد الرحمن بن ربيعة وهو على الباب: إن الرعية قد أبطرها البطنة فلا تقتحم بالمسلمين فإني أخشى أن يقتلوا، فلم يرجع عن مقصده وغزا نحو بلنجر فقاتلوه قتالاً شديداً وقتل — وأخذ أهل بلنجر جسده فجعلوه في تابوت يستسقون به — وانهزم الناس فلقيت فرقة سلمان بن ربيعة الذي سيره سعيد بن العاص مدداً فنجوا به، وكان في العسكر سلمان الفارسي وأبو هريرة ويزيد بن معاوية النخعي وعلقمة بن قيس؛ ورمي يزيد بحجر فهشم رأسه ودفن على الصورة التي رأى في النوم {cite:kamil-ibn-al-athir pp. 503–504 v.2}."
  en: "The Balanjar disaster (AH 32): against Uthman's written warning not to plunge the army in, Abd al-Rahman ibn Rabi'a marched on Balanjar beyond Derbent and was killed — the Khazars kept his body in a coffin for rain-prayers; Salman ibn Rabi'a's relief column gathered the fugitives, among them Salman al-Farisi and Abu Hurayra, in the first Khazar triumph over the Muslim frontier {cite:kamil-ibn-al-athir v.2 pp. 503–504}."
