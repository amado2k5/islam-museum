label: { ar: "هزيمة بلنجر ⁦(32هـ)⁩", en: "The Defeat at Balanjar (32 AH)", fr: "La défaite de Balanjar (32 H)", es: "La derrota en Balanjar (32 AH)", ur: "بلنجر میں شکست ⁦(32ھ)⁩", tr: "Balanjar'ın yenilgisi (H. 32)", id: "Kekalahan Balanjar (32 H)" }
summary:
  ar: "انتصرت الخزر والترك على المسلمين سنة ٣٢هـ؛ كان عثمان كتب إلى عبد الرحمن بن ربيعة وهو على الباب: إن الرعية قد أبطرها البطنة فلا تقتحم بالمسلمين فإني أخشى أن يقتلوا، فلم يرجع عن مقصده وغزا نحو بلنجر فقاتلوه قتالاً شديداً وقتل — وأخذ أهل بلنجر جسده فجعلوه في تابوت يستسقون به — وانهزم الناس فلقيت فرقة سلمان بن ربيعة الذي سيره سعيد بن العاص مدداً فنجوا به، وكان في العسكر سلمان الفارسي وأبو هريرة ويزيد بن معاوية النخعي وعلقمة بن قيس؛ ورمي يزيد بحجر فهشم رأسه ودفن على الصورة التي رأى في النوم {cite:kamil-ibn-al-athir pp. 503–504 v.2}."
  en: "The Balanjar disaster (AH 32): against Uthman's written warning not to plunge the army in, Abd al-Rahman ibn Rabi'a marched on Balanjar beyond Derbent and was killed — the Khazars kept his body in a coffin for rain-prayers; Salman ibn Rabi'a's relief column gathered the fugitives, among them Salman al-Farisi and Abu Hurayra, in the first Khazar triumph over the Muslim frontier {cite:kamil-ibn-al-athir v.2 pp. 503–504}."
  fr: "Le désastre de Balanjar (32 H) : malgré l'avertissement écrit d'Uthman de ne pas engager l'armée à fond, Abd al-Rahman ibn Rabi'a marcha sur Balanjar au-delà de Derbent et fut tué ; les Khazars gardèrent son corps dans un cercueil pour les prières de pluie ; la colonne de secours de Salman ibn Rabi'a recueillit les fuyards, parmi lesquels Salman al-Farisi et Abu Hurayra, lors du premier triomphe khazar sur la frontière musulmane {cite:kamil-ibn-al-athir v.2 pp. 503–504}."
  es: "El desastre de Balanjar (AH 32): en contra de la advertencia escrita de Uthman de no lanzar al ejército, Abd al-Rahman ibn Rabi'a marchó sobre Balanjar más allá de Derbent y fue asesinado; los jázaros mantuvieron su cuerpo en un ataúd para las oraciones de lluvia; la columna de socorro de Salman ibn Rabi'a reunió a los fugitivos, entre ellos Salman al-Farisi y Abu Hurayra, en el primer triunfo jázaro sobre la frontera musulmana {cite:kamil-ibn-al-athir v.2 pp. 503–504}."
  ur: "بلنجر کی تباہی ⁦(32ھ)⁩: فوج کو نہ چھپانے کے لیے عثمان کی تحریری انتباہ کے خلاف، عبدالرحمٰن بن ربیعہ نے دربنت سے آگے بلنجر پر کوچ کیا اور مارا گیا - خزروں نے اس کی لاش کو بارش کی دعا کے لیے ایک تابوت میں رکھا؛ سلمان بن ربیعہ کے امدادی کالم نے فراریوں کو جمع کیا، جن میں سلمان الفارسی اور ابو ہریرہ شامل تھے، مسلم سرحد پر پہلی خزر کی فتح میں۔"
  tr: "Hicri 32 yılında Hazarlar ve Türkler Müslümanlara karşı zafer kazandılar. Osman, kapıda bulunan Abdurrahman ibn Rabi'ye şöyle yazmıştı: \"Halk oburluktan mahvoldu, bu yüzden Müslümanlarla savaşa acele etmeyin, çünkü öldürüleceklerinden korkuyorum.\" Ancak amacından vazgeçmedi ve Belancar'a doğru baskın düzenledi. Ona karşı şiddetli bir şekilde savaştılar ve öldürüldü. Belancar halkı cesedini alıp bir tabuta koyarak yağmur duası için dua etti. Halk yenilgiye uğradı ve Said ibn el-As'ın takviye olarak gönderdiği Salman ibn Rabi'nin bir grubu onu karşıladı ve kurtardı. Orduda Salman el-Farisi, Ebu Hurayra, Yezid ibn Muaviye el-Nakha'i ve Alkame ibn Kays vardı. Yezid'e bir taş isabet etti ve kafası ezildi; rüyasında gördüğü şekilde gömüldü. {alıntı: kamil-ibn-el-esir s. 503–504 v.2}"
  id: "Bangsa Khazar dan Turki meraih kemenangan atas kaum Muslimin pada tahun 32 Hijriah. Utsman telah menulis surat kepada Abd al-Rahman ibn Rabi’ah, yang berada di gerbang: “Kaum Muslim telah dimanjakan oleh kerakusan mereka, jadi jangan terburu-buru berperang melawan kaum Muslimin, karena aku khawatir mereka akan terbunuh.” Namun, ia tidak mengubah niatnya dan menyerbu ke arah Balanjar. Mereka melawannya dengan sengit, dan ia terbunuh. Penduduk Balanjar mengambil jenazahnya dan meletakkannya di dalam peti mati untuk berdoa memohon hujan. Kaum Muslimin dikalahkan, dan sekelompok Salman ibn Rabi’ah, yang dikirim oleh Sa’id ibn al-As sebagai bala bantuan, menemuinya dan menyelamatkannya. Dalam pasukan tersebut terdapat Salman al-Farisi, Abu Hurayrah, Yazid ibn Mu’awiyah al-Nakha’i, dan Alqamah ibn Qays. Yazid terkena batu yang menghancurkan kepalanya, dan ia dimakamkan dengan cara yang telah dilihatnya dalam mimpi. {mengutip: kamil-ibn-al-athir hal. 503–504 v.2}"
