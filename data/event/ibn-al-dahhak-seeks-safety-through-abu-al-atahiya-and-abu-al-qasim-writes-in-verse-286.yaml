id: event/ibn-al-dahhak-seeks-safety-through-abu-al-atahiya-and-abu-al-qasim-writes-in-verse-286
class: event
kind: other
label:
  ar: "ابن الضحاك يستأمن بأبي العتاهية ويكتب أبو القاسم شعراً إلى أبي العتاهية، 286هـ"
  en: "Ibn al-Dahhak seeks safety through Abu al-Atahiya and Abu al-Qasim writes verse to him, 286 AH"
  ur: "ابن ضحاک کا ابو العتاہیہ کے ذریعے امان مانگنا اور ابو القاسم کا انہیں شعر لکھنا، 286ھ"
summary:
  ar: "بعد أن أسلمه قومه استغاث ابن الضحاك بأبي العتاهية فكتب إلى أبي القاسم فأمّنه وأقام عنده بخيوان، ثم كتب أبو القاسم شعراً إلى أبي العتاهية فبعث أرزاق الجند، واستأمن المعمريون."
  en: "Abandoned by his people, Ibn al-Dahhak turned to Abu al-Atahiya, who wrote to Abu al-Qasim; Abu al-Qasim gave him safety and kept him at Khiwan, then wrote verse to Abu al-Atahiya, who sent the troops' pay; the Ma'mari men sought safety."
  ur: "قوم کے چھوڑ دینے پر ابن ضحاک نے ابو العتاہیہ سے مدد مانگی جنہوں نے ابو القاسم کو لکھا؛ ابو القاسم نے اسے امان دی اور خیوان میں اپنے پاس رکھا، پھر ابو العتاہیہ کو شعر لکھا تو انہوں نے فوج کی تنخواہیں بھیجیں، اور معمری لوگوں نے امان مانگی۔"
