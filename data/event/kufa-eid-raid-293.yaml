label: { ar: "دخول القرامطة الكوفة يوم عيد الأضحى", en: "Qarmatian entry into Kufa on the Eid al-Adha, 293" }
summary:
  ar: "في سنة ثلاث وتسعين ومائتين دخل القرامطة الكوفة حين انصرف الناس من صلاة عيد الأضحى في ثمانمائة فارس ونادوا يا لثارات الحسين — يعنون الحسين بن زكرويه المصلوب على الجسر — وشعارهم يا أحمد يا محمد يعنون المقتولين معه وأظهروا الأعلام البيض، فقتلوا من أدركوا وسلبوا، وبادر الناس إلى المدينة فدخلوها، ودخل من القرامطة خلفهم نحو خمسمائة فرماهم العوام بالحجارة وألقوا عليهم الستر فخرجوا بعد أن قُتل منهم نحو عشرين {cite:muntazam-ibn-al-jawzi p. 349}."
  en: "In 293 eight hundred Qarmatian horse entered Kufa as the people left the Eid al-Adha prayer, crying vengeance for al-Husayn ibn Zikrawayh crucified on the bridge, white banners raised; the townsfolk rushed inside the city, then stoned the ~five hundred who followed and threw covers over them until they withdrew with some twenty dead {cite:muntazam-ibn-al-jawzi p. 349}."
