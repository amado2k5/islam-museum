label: { ar: "دخول القرامطة الكوفة يوم عيد الأضحى", en: "Qarmatian entry into Kufa on the Eid al-Adha, 293", es: "Entrada qarmatiana a Kufa en el Eid al-Adha, 293", fr: "Entrée qarmate à Kufa le jour de l'Aïd al-Adha, 293", ur: "عید الاضحی کے موقع پر کوفہ میں قرمطین کا داخلہ، 293", tr: "Karmatiler Kurban Bayramı günü Kufa'ya girdiler.", id: "Suku Qarmatian memasuki Kufa pada hari raya Idul Adha." }
summary:
  ar: "في سنة ثلاث وتسعين ومائتين دخل القرامطة الكوفة حين انصرف الناس من صلاة عيد الأضحى في ثمانمائة فارس ونادوا يا لثارات الحسين — يعنون الحسين بن زكرويه المصلوب على الجسر — وشعارهم يا أحمد يا محمد يعنون المقتولين معه وأظهروا الأعلام البيض، فقتلوا من أدركوا وسلبوا، وبادر الناس إلى المدينة فدخلوها، ودخل من القرامطة خلفهم نحو خمسمائة فرماهم العوام بالحجارة وألقوا عليهم الستر فخرجوا بعد أن قُتل منهم نحو عشرين {cite:muntazam-ibn-al-jawzi p. 349}."
  en: "In 293 eight hundred Qarmatian horse entered Kufa as the people left the Eid al-Adha prayer, crying vengeance for al-Husayn ibn Zikrawayh crucified on the bridge, white banners raised; the townsfolk rushed inside the city, then stoned the ~five hundred who followed and threw covers over them until they withdrew with some twenty dead {cite:muntazam-ibn-al-jawzi p. 349}."
  es: "En 293, ochocientos jinetes de Qarmatia entraron en Kufa cuando la gente salía de la oración del Eid al-Adha, clamando venganza por al-Husayn ibn Zikrawayh crucificado en el puente, con banderas blancas en alto; los habitantes de la ciudad se precipitaron al interior de la ciudad, luego apedrearon a los ~quinientos que los seguían y les arrojaron mantas hasta que se retiraron con unos veinte muertos {cite:muntazam-ibn-al-jawzi p. 349}."
  fr: "En 293, huit cents cavaliers qarmates entrèrent à Kufa alors que les habitants sortaient de la prière de l'Aïd al-Adha, criant vengeance pour al-Husayn ibn Zikrawayh crucifié sur le pont, bannières blanches levées; les habitants se précipitèrent à l'intérieur de la ville, puis lapidèrent les quelque cinq cents qui les suivaient et jetèrent des couvertures sur eux jusqu'à ce qu'ils se retirent avec une vingtaine de morts {cite:muntazam-ibn-al-jawzi p. 349}."
  ur: "293 میں آٹھ سو قرمتی گھوڑے کوفہ میں داخل ہوئے جب لوگ عید الاضحی کی نماز سے نکلے، حسین ابن زکراویہ کو پل پر مصلوب کرنے کے انتقام کا رونا روتے ہوئے، سفید جھنڈے اٹھائے ہوئے تھے۔ شہر کے لوگ شہر کے اندر دوڑ پڑے، پھر ان کے پیچھے آنے والے پانچ سو لوگوں کو سنگسار کیا اور ان پر چادریں ڈال دیں یہاں تک کہ وہ بیس مردوں کے ساتھ پیچھے ہٹ گئے۔ 349}۔"
  tr: "Hicri 293 yılında, Karmatiler Kurban Bayramı namazı bittikten sonra sekiz yüz süvariyle Kufe'ye girdiler ve \"Hüseyin'in intikamı!\" diye bağırdılar. Bu, köprüde çarmıha gerilen Hüseyin ibn Zekrawayh'ı kastediyordu. Sloganları ise \"Ey Ahmed, ey Muhammed!\" idi; bu da onunla birlikte öldürülenleri kastediyordu. Beyaz bayraklar açtılar ve yakaladıkları ve yağmaladıkları herkesi öldürdüler. Halk şehre akın etti ve içeri girdi; Karmatilerden yaklaşık beş yüz kişi de onların arkasından girdi. Halk onlara taş attı ve onları bir perdeyle örttü; bu yüzden yaklaşık yirmi kişi öldürüldükten sonra şehri terk ettiler. {cite:muntazam-ibn-al-jawzi s. 349}"
  id: "Pada tahun 293 Hijriah, kaum Qarmatian memasuki Kufa ketika penduduk telah selesai melaksanakan salat Idul Adha dengan delapan ratus penunggang kuda dan mereka berteriak, “Balas dendam untuk al-Husayn!” — yang berarti al-Husayn bin Zakrawayh, yang disalib di jembatan — dan slogan mereka adalah, “Wahai Ahmad, Wahai Muhammad!” — yang berarti mereka yang terbunuh bersamanya. Mereka mengibarkan bendera putih, dan mereka membunuh orang-orang yang mereka tangkap dan rampas hartanya. Penduduk bergegas ke kota dan memasukinya, dan sekitar lima ratus orang Qarmatian masuk di belakang mereka. Rakyat jelata melempari mereka dengan batu dan menutupi mereka dengan tirai, sehingga mereka pergi setelah sekitar dua puluh orang dari mereka terbunuh. {cite:muntazam-ibn-al-jawzi p. 349}"
