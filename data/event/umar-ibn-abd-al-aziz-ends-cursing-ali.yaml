id: event/umar-ibn-abd-al-aziz-ends-cursing-ali
class: event
kind: other
label: { ar: "ترك عمر بن عبد العزيز سب علي على المنابر", en: "Umar ibn Abd al-Aziz Ends the Cursing of Ali from the Pulpits" }
summary:
  ar: "ترك عمر بن عبد العزيز ما كان بنو أمية يفعلونه من سب علي بن أبي طالب على المنابر، وكتب إلى الأمصار بتركه، ووضع مكانه قوله تعالى {cite:khudari-umayyad-state p.330}: «إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ» (16:90). وذكر الكتاب أن ذلك كان بعد أن نبهه عبيد الله بن عتبة بن مسعود، وأن كثير عزة مدحه بذلك {cite:khudari-umayyad-state p.330}."
  en: "Umar ibn Abd al-Aziz stopped what the Umayyads had done, cursing Ali ibn Abi Talib from the pulpits; he wrote to the provinces to abandon it and put in its place the Qur'anic verse on justice and beneficence (16:90) {cite:khudari-umayyad-state p.330}. The book reports that this came after Ubayd Allah ibn Utba ibn Mas'ud had alerted him, and that Kuthayyir Azza praised him for it {cite:khudari-umayyad-state p.330}."
