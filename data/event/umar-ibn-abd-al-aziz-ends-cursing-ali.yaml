id: event/umar-ibn-abd-al-aziz-ends-cursing-ali
class: event
kind: other
label: { ar: "ترك عمر بن عبد العزيز سب علي على المنابر", en: "Umar ibn Abd al-Aziz Ends the Cursing of Ali from the Pulpits", es: "Umar ibn Abd al-Aziz pone fin a las maldiciones contra Ali desde los púlpitos.", fr: "Umar ibn Abd al-Aziz met fin aux malédictions proférées contre Ali depuis les chaires.", ur: "عمر بن عبد العزیز نے منبروں سے علی کی لعنت کو ختم کیا۔" }
summary:
  ar: "ترك عمر بن عبد العزيز ما كان بنو أمية يفعلونه من سب علي بن أبي طالب على المنابر، وكتب إلى الأمصار بتركه، ووضع مكانه قوله تعالى {cite:khudari-umayyad-state p.330}: «إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ» (16:90). وذكر الكتاب أن ذلك كان بعد أن نبهه عبيد الله بن عتبة بن مسعود، وأن كثير عزة مدحه بذلك {cite:khudari-umayyad-state p.330}."
  en: "Umar ibn Abd al-Aziz stopped what the Umayyads had done, cursing Ali ibn Abi Talib from the pulpits; he wrote to the provinces to abandon it and put in its place the Qur'anic verse on justice and beneficence (16:90) {cite:khudari-umayyad-state p.330}. The book reports that this came after Ubayd Allah ibn Utba ibn Mas'ud had alerted him, and that Kuthayyir Azza praised him for it {cite:khudari-umayyad-state p.330}."
  es: "Umar ibn Abd al-Aziz detuvo la práctica de los Omeyas, quienes maldecían a Ali ibn Abi Talib desde los púlpitos; escribió a las provincias para que la abandonaran y la sustituyeran por el versículo coránico sobre la justicia y la beneficencia (16:90) {cite:khudari-umayyad-state p.330}. El libro relata que esto ocurrió después de que Ubayd Allah ibn Utba ibn Mas'ud le alertara, y que Kuthayyir Azza lo elogió por ello {cite:khudari-umayyad-state p.330}."
  fr: "Umar ibn Abd al-Aziz mit fin aux agissements des Omeyyades, qui maudissaient Ali ibn Abi Talib du haut des chaires. Il ordonna aux provinces d'y renoncer et de leur substituer le verset coranique sur la justice et la bienfaisance (16:90) {cite:khudari-umayyad-state p.330}. L'ouvrage rapporte que cette décision intervint après qu'Ubayd Allah ibn Utba ibn Mas'ud l'eut averti, et que Kuthayyir Azza le félicita pour cela {cite:khudari-umayyad-state p.330}."
  ur: "عمر بن عبدالعزیز نے جو کچھ امویوں نے کیا تھا اسے روک دیا، منبروں سے علی ابن ابی طالب پر لعنت بھیجی۔ اس نے صوبوں کو لکھا کہ وہ اسے ترک کر دیں اور اس کی جگہ عدل و احسان پر قرآنی آیت (16:90) رکھ دیں۔ کتاب بتاتی ہے کہ یہ عبید اللہ ابن عتبہ ابن مسعود کے انتباہ کے بعد ہوا ہے، اور کثیر عزہ نے اس کی تعریف کی ہے۔"
