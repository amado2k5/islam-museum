summary:
  ar: "سار حسان ملك حمير في حمير حتى إذا صاروا من اليمامة على ثلاث أمرهم رباح بن مرة أن يقتلع كل واحد شجرة فيجعلها أمامه ثم يسير لئلا تنذر أخته اليمامة القوم بهم، فأشرفت فقالت يا جديس لقد سارت إليكم الشجر فكذبوها فغفلوا عن أهبة الحرب فصبحهم حسان من جو على مسيرة ليلة فاستباح أهلها قتلاً وسبى النساء والصبيان وهرب الأسود بن غفار ملكها إلى طيء فأجاروه، ونزعت عينا اليمامة وصلبت على باب جو فسميت اليمامة بها {cite:muruj-al-dhahab p. 455-456}."
  en: "Hassan's march on Jadis: the carried-tree ruse foiling Zarqa' al-Yamama's sight, the dawn massacre at Jaww, king al-Aswad ibn Ghaffar's flight to Tayy', and the seeress crucified on the town's gate — renaming it al-Yamama {cite:muruj-al-dhahab p. 455-456}."
