label: { ar: "إفناء جديس", en: "The destruction of Jadis", es: "La destrucción de Jadis", fr: "La destruction de Jadis", ur: "جدوں کی تباہی۔", tr: "Jadis'in yok edilmesi", id: "Pemusnahan Jadis" }
summary:
  ar: "سار حسان ملك حمير في حمير حتى إذا صاروا من اليمامة على ثلاث أمرهم رباح بن مرة أن يقتلع كل واحد شجرة فيجعلها أمامه ثم يسير لئلا تنذر أخته اليمامة القوم بهم، فأشرفت فقالت يا جديس لقد سارت إليكم الشجر فكذبوها فغفلوا عن أهبة الحرب فصبحهم حسان من جو على مسيرة ليلة فاستباح أهلها قتلاً وسبى النساء والصبيان وهرب الأسود بن غفار ملكها إلى طيء فأجاروه، ونزعت عينا اليمامة وصلبت على باب جو فسميت اليمامة بها {cite:muruj-al-dhahab p. 455-456}."
  en: "Hassan's march on Jadis: the carried-tree ruse foiling Zarqa' al-Yamama's sight, the dawn massacre at Jaww, king al-Aswad ibn Ghaffar's flight to Tayy', and the seeress crucified on the town's gate — renaming it al-Yamama {cite:muruj-al-dhahab p. 455-456}."
  es: "La marcha de Hassan sobre Jadis: la estratagema del árbol transportado que frustró la visión de Zarqa' al-Yamama, la masacre al amanecer en Jaww, la huida del rey al-Aswad ibn Ghaffar a Tayy' y la vidente crucificada en la puerta de la ciudad, que pasó a llamarse al-Yamama {cite:muruj-al-dhahab p. 455-456}."
  fr: "La marche d'Hassan sur Jadis: la ruse de l'arbre transporté déjouant la vision de Zarqa' al-Yamama, le massacre de l'aube à Jaww, la fuite du roi al-Aswad ibn Ghaffar vers Tayy', et la voyante crucifiée à la porte de la ville — la renommant al-Yamama {cite:muruj-al-dhahab p. 455-456}."
  ur: "جدیس پر حسن کا مارچ: زرقا ال یمامہ کی نظر کو ناکام بنانے والا درختوں کا دھندا، جوو میں صبح کا قتل عام، شاہ اسود بن غفار کا طائی کی طرف اڑان، اور سیریس کو قصبے کے دروازے پر مصلوب کیا جانا - اس کا نام تبدیل کرنا: یمامۃ المعجم۔ 455-456}۔"
  tr: "Himyar kralı Hasan, Himyar halkıyla birlikte üç günlük bir yolculuktan sonra El-Yamame'ye ulaştı. Rabah bin Murrah, kız kardeşi El-Yamame'nin halkı yaklaştıklarından haberdar etmemesi için her birine bir ağaç kökünden söküp önüne koymalarını ve sonra da yola devam etmelerini emretti. El-Yamame dışarı baktı ve \"Ey Jadis, ağaçlar sana doğru yürüyor!\" dedi. Onlar ona inanmadılar ve savaş hazırlıklarını ihmal ettiler. Hasan, şafak vakti bir gecelik yolculuk mesafesindeki Jaw'dan onlara saldırdı ve halkını katletti, kadınları ve çocukları esir aldı. Jaw kralı El-Esved bin Gafar, Tayy'e kaçtı ve Tayy ona koruma sağladı. El-Yamame'nin gözleri oyuldu ve Jaw kapısında çarmıha gerildi ve El-Yamame onun adıyla anıldı. {cite:muruj-al-dhahab s. 455-456}"
  id: "Hassan, raja Himyar, berbaris bersama Himyar hingga mereka mencapai Al-Yamamah setelah perjalanan tiga hari. Rabah bin Murrah memerintahkan masing-masing dari mereka untuk mencabut sebatang pohon dan meletakkannya di depan mereka, lalu melanjutkan perjalanan, agar saudara perempuannya, Al-Yamamah, tidak memperingatkan orang-orang tentang kedatangan mereka. Ia melihat ke luar dan berkata, \"Wahai Jadis, pohon-pohon telah berbaris ke arahmu.\" Mereka tidak mempercayainya dan mengabaikan persiapan perang mereka. Hassan menyerang mereka saat fajar dari Jaw, yang berjarak satu perjalanan semalam, dan ia membantai penduduknya, menawan para wanita dan anak-anak. Al-Aswad bin Ghaffar, rajanya, melarikan diri ke Tayy, yang memberinya perlindungan. Mata Al-Yamamah dicungkil dan disalib di gerbang Jaw, dan Al-Yamamah dinamai menurut namanya. {cite:muruj-al-dhahab hlm. 455-456}"
