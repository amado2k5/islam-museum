label: { ar: "ملك قراقوش طرابلس الغرب", en: "Qaraqush's conquest of Tripoli (568 AH)", es: "La conquista de Trípoli por Qaraqush (568 AH)", fr: "La conquête de Tripoli par Qaraqush (568 AH)", ur: "قراقش کی فتح طرابلس ⁦(568ھ)⁩", tr: "Trablus Kralı Karakoş, Batı", id: "Raja Qaraqosh dari Tripoli, Barat" }
summary:
  ar: "في سنة ثمان وستين وخمسمائة سار طائفة من الترك من ديار مصر مع قراقوش — مملوك تقي الدين عمر ابن أخي صلاح الدين — إلى جبال نفوسة، فاجتمع به مسعود بن زمام المعروف بمسعود البلاط وكان خارجاً عن طاعة عبد المؤمن، فاتفقا وكثر جمعهما ونزلا على طرابلس الغرب فحاصراها وضيقا على أهلها ثم فتحت، فاستولى عليها قراقوش وأسكن أهله قصرها وملك كثيراً من بلاد إفريقية ما خلا المهدية وسفاقس وقفصة وتونس وما والاها، وحكم على تلك البلاد بمساعدة العرب بما جُبلت عليه من تخريب ونهب وقطع أشجار، وجمع أموالاً عظيمة جعلها بمدينة قابس حتى حدثته نفسه بالاستيلاء على إفريقية كلها لبعد صاحبها أبي يعقوب يوسف بن عبد المؤمن عنها {cite:kamil-ibn-al-athir p. 47}."
  en: "568 AH: a Turkish corps out of Egypt under Sharaf al-Din Qaraqush — mamluk of Saladin's nephew Taqi al-Din Umar — joined the Nafusa-mountain amir Mas'ud ibn Zammam 'al-Balat', then in revolt against the Almohads; together they besieged Tripoli until it opened, and Qaraqush installed his household in its palace and ruled most of Ifriqiya bar Mahdiyya, Sfax, Gafsa and Tunis, amassing a treasury at Gabes and nursing designs on the whole country {cite:kamil-ibn-al-athir p. 47}."
  es: "568 AH: un cuerpo turco procedente de Egipto, al mando de Sharaf al-Din Qaraqush —mameluco del sobrino de Saladino, Taqi al-Din Umar—, se unió al emir de la montaña Nafusa, Mas'ud ibn Zammam 'al-Balat', que entonces estaba en rebelión contra los almohades; juntos sitiaron Trípoli hasta que se abrió, y Qaraqush instaló a su corte en su palacio y gobernó la mayor parte de Ifriqiya bar Mahdiyya, Sfax, Gafsa y Túnez, acumulando un tesoro en Gabes y albergando planes sobre todo el país {cite:kamil-ibn-al-athir p. 47}."
  fr: "568 AH: un corps turc sorti d'Égypte sous le commandement de Sharaf al-Din Qaraqush — mamelouk du neveu de Saladin, Taqi al-Din Umar — rejoint l'émir de la montagne de Nafusa, Mas'ud ibn Zammam 'al-Balat', alors en révolte contre les Almohades; ensemble, ils assiégent Tripoli jusqu'à ce qu'elle s'ouvre, et Qaraqush installe sa maisonnée dans son palais et gouverne la majeure partie de l'Ifriqiya bar Mahdiyya, Sfax, Gafsa et Tunis, amassant un trésor à Gabès et nourrissant des ambitions sur tout le pays {cite:kamil-ibn-al-athir p. 47}."
  ur: "568ھ: شرف الدین قراقوش کے ماتحت مصر سے ایک ترک دستہ - صلاح الدین کے بھتیجے تقی الدین عمر کا مملوک - کوہ نفوسہ کے امیر مسعود ابن زمام 'البلات' میں شامل ہوا، پھر المحدثوں کے خلاف بغاوت کی۔ انہوں نے مل کر طرابلس کا محاصرہ کیا یہاں تک کہ یہ کھل گیا، اور قراقش نے اپنے گھر کو اس کے محل میں نصب کیا اور افریقیہ بار مہدیہ، سفیکس، غفصہ اور تیونس کے بیشتر علاقوں پر حکومت کی، گیبس میں خزانہ جمع کیا اور پورے ملک پر نرسنگ ڈیزائن بنائے۔ 47}۔"
  tr: "Hicri 568 yılında, Mısır topraklarından bir grup Türk, Selahaddin Eyyubi Takîddin Ömer'in Memlük lideri Karakuş ile birlikte Nafusa Dağları'na yürüdü. Orada, Abdülmümin'in emri dışında olan Mesud bin Zemâm (Mesud el-Belat olarak da bilinir) ile karşılaştı. Anlaştılar ve orduları büyüdü. Trablus'a saldırdılar, şehri kuşattılar ve halkına baskı uyguladılar. Ardından şehir fethedildi ve Karakuş şehri ele geçirerek ailesini sarayına yerleştirdi. Mehdi, Sfax, Gafsa, Tunus ve çevresi hariç, İfrikiye topraklarının büyük bir bölümünü yönetti. Bu toprakları ise doğal olarak yıkıma, yağmaya ve ağaç kesmeye meyilli olan Arapların yardımıyla yönetti. Büyük bir servet topladı ve bunu Gabes şehrine yerleştirdi. Ancak, İfrikiye'nin yöneticisi Ebu Yakub Yusuf bin Abdülmümin'in şehre olan uzaklığı nedeniyle, İfrikiye'nin tamamını fethetmeyi düşündü. {kaynak: Kamil ibn el-Athir s. 47}"
  id: "Pada tahun 568 H, sekelompok orang Turki dari tanah Mesir berbaris bersama Qaraqush — Mamluk Taqi al-Din Umar, keponakan Saladin — ke Pegunungan Nafusa. Di sana, ia bertemu dengan Masoud bin Zamam, yang dikenal sebagai Masoud al-Balat, yang tidak taat kepada Abd al-Mu'min. Mereka sepakat, dan pasukan mereka bertambah besar. Mereka menyerbu Tripoli, mengepungnya, dan menekan penduduknya. Kemudian kota itu ditaklukkan, dan Qaraqush merebutnya dan menempatkan keluarganya di istananya. Ia memerintah sebagian besar wilayah Ifriqiya, kecuali Mahdia, Sfax, Gafsa, Tunis, dan daerah sekitarnya. Ia memerintah wilayah-wilayah tersebut dengan bantuan orang-orang Arab, yang secara alami cenderung melakukan perusakan, penjarahan, dan penebangan pohon. Ia mengumpulkan kekayaan yang sangat besar, yang kemudian ia tempatkan di kota Gabes, hingga ia mempertimbangkan untuk menaklukkan seluruh Ifriqiya karena jarak penguasanya, Abu Yaqub Yusuf bin Abd al-Mu'min, dari kota tersebut. {cite:kamil-ibn-al-athir p. 47}"
