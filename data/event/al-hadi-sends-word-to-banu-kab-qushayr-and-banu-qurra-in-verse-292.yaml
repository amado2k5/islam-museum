id: event/al-hadi-sends-word-to-banu-kab-qushayr-and-banu-qurra-in-verse-292
class: event
kind: other
label:
  ar: "رسالة الهادي الشعرية إلى بني كعب وقشير وبني قرة، وقوله إنه الغلام الفاطمي الأحمدي، ص309-310"
  en: "Al-Hadi's verse message to Banu Ka'b, Qushayr and Banu Qurra, saying he is the Fatimid, Ahmadi youth, pp. 309-310"
  ur: "ہادی کا بنو کعب، قشیر اور بنو قرہ کے نام شعری پیغام، اور یہ کہنا کہ وہ فاطمی، احمدی جوان ہے، ص309-310"
  es: "Mensaje en verso de Al-Hadi a Banu Ka'b, Qushayr y Banu Qurra, diciendo que él es el joven fatimí y ahmadí, págs. 309-310"
summary:
  ar: "قصيدة من الرجز بعنوان «وله أيضاً» يأمر فيها بإبلاغ بني كعب وقشير وبني قرة أنه ذو شرف عالٍ منتسب إلى النبي أحمد، وأنه الغلام الفاطمي الأحمدي وابن أمير المؤمنين المهتدي، يذب عن صحبه، ويصف سيفه وفرسه وجيشه ودنوه من الحرب."
  en: "A poem in the rajaz metre under the heading \"and also of his\" bidding the hearer tell Banu Ka'b, Qushayr and Banu Qurra that he is a man of high lineage tracing to the Prophet Ahmad, the Fatimid, Ahmadi youth and son of the rightly guided Commander of the Faithful, who defends his companions, and describing his sword, his horse, his army and his nearness to the fight."
  ur: "رجز بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت جس میں وہ حکم دیتا ہے کہ بنو کعب، قشیر اور بنو قرہ کو بتا دو کہ وہ نبی احمد کی طرف منسوب بلند نسب والا، فاطمی، احمدی جوان اور ہدایت یافتہ امیر المومنین کا بیٹا ہے، اپنے ساتھیوں کا دفاع کرتا ہے، اور اپنی تلوار، گھوڑے، لشکر اور جنگ سے قرب کا حال بیان کرتا ہے۔"
  es: "Un poema en metro rajaz bajo el título \"y también suyo\" que invita al oyente a decirles a Banu Ka'b, Qushayr y Banu Qurra que es un hombre de alto linaje que se remonta al Profeta Ahmad, el joven fatimí y ahmadí e hijo del Comandante de los Creyentes bien guiado, que defiende a sus compañeros, y que describe su espada, su caballo, su ejército y su cercanía a la batalla."
