label: { ar: "فتح مكران على يد سنان بن سلمة", en: "Sinan ibn Salama's Conquest of Makran", es: "La conquista de Makrán por Sinan ibn Salama", fr: "La conquête du Makran par Sinan ibn Salama", ur: "سنان بن سلمہ کی فتح مکران", tr: "Makran Sinan ibn Seleme tarafından fethedildi", id: "Makran ditaklukkan oleh Sinan bin Salama" }
summary:
  ar: "ولى زياد بن أبي سفيان في أيام معاوية سنان بن سلمة بن المحبق الهذلي وكان فاضلاً متألهاً وهو أول من أحاف الجند بالطلاق فأتى الثغر ففتح مكران عنوة ومصرها وأقام بها وضبط البلاد وفيه يقول الشاعر طلاق نساء ما يسوق لها مهرا رأيت هذيلاً أحدثت في يمينها وقال ابن الكلبي كان الذي فتح مكران حكيم بن جبلة العبدي ثم استعمل زياد على الثغر راشد بن عمرو الجديدي من الأزد فأتى مكران ثم غزا القيقان فظفر ثم غزا الميد فقتل وقام بأمر الناس سنان بن سلمة فولاه زياد الثغر فأقام به سنتين."
  en: "Ziyad appointed the pious Sinan ibn Salama ibn al-Muhabbiq al-Hudhali — first to bind his troops with divorce-oaths — who took Makran by storm, garrisoned it, and held it firm; the poets mocked his swearing ('a divorce whose wife gets no dower'). Ibn al-Kalbi names Hakim ibn Jabala the conqueror. Ziyad's next man Rashid ibn Amr al-Judaydi won at Qiqan, fell at al-Mayd, and Sinan, left in command, held the thaghr two years."
  es: "Ziyad designó al piadoso Sinan ibn Salama ibn al-Muhabbiq al-Hudhali —el primero en jurar lealtad a sus tropas—, quien tomó Makrán por asalto, la guarneció y la mantuvo firme; los poetas se burlaron de su juramento («un divorcio cuya esposa no recibe dote»). Ibn al-Kalbi nombra a Hakim ibn Jabala como el conquistador. El siguiente hombre de Ziyad, Rashid ibn Amr al-Judaydi, venció en Qiqan, cayó en al-Mayd, y Sinan, al mando, mantuvo el thaghr durante dos años."
  fr: "Ziyad nomma le pieux Sinan ibn Salama ibn al-Muhabbiq al-Hudhali – le premier à sceller ses troupes par des serments de divorce – qui prit d'assaut Makran, y établit une garnison et la conserva fermement; les poètes se moquèrent de son serment (« un divorce sans dot »). Ibn al-Kalbi désigne Hakim ibn Jabala comme le conquérant. Le successeur de Ziyad, Rashid ibn Amr al-Judaydi, remporta la bataille de Qiqan, fut vaincu à al-Mayd, et Sinan, resté à la tête de la ville, conserva le thaghr pendant deux ans."
  ur: "زیاد نے متقی سنان بن سلمہ ابن المحبق الحضلی کو مقرر کیا - سب سے پہلے اپنی فوجوں کو طلاق کی قسموں کے ساتھ باندھنے کے لئے - جس نے مکران کو طوفان کے ساتھ لے لیا، اس کی حفاظت کی اور اسے مضبوطی سے تھامے رکھا؛ شاعروں نے اس کی قسم کا مذاق اڑایا ⁦('ایک طلاق جس کی بیوی کو مہر نہیں ملتا')⁩۔ ابن کلبی نے حکیم ابن جبلہ کو فاتح کا نام دیا ہے۔ زیاد کا اگلا آدمی راشد بن عمرو الجدیدی ققان پر فتح یاب ہوا، المید پر گرا، اور سنان، جو کمان چھوڑ گیا، دو سال تک ثغر پر قابض رہا۔"
  tr: "Ziyad ibn Abi Sufyan, Muaviye döneminde Sinan ibn Salama ibn el-Muhabbak el-Hudhali'yi görevlendirdi. O, erdemli ve dindar bir adamdı ve askerlere boşanma yemini ettiren ilk kişiydi. Sınıra geldi ve Makran'ı zorla fethetti, şehri kurdu ve orada kalarak ülkeyi kontrol etti. Şair onun hakkında şöyle demiştir: \"Mehir getirmeyen kadınların boşanması. Yemininde günah işleyen Hudhayl'i gördüm.\" İbn el-Kalbi şöyle demiştir: \"Makran'ı fetheden Hakim ibn Cebala el-Abdi idi. Sonra Ziyad, Azd'dan Raşid ibn Amr el-Cedidi'yi sınıra atadı. Makran'a geldi, sonra Kaykan'a baskın yaptı ve zafer kazandı. Sonra da Mayd'e baskın yaptı ve öldürüldü. Sinan ibn Salama halkın işlerini devraldı, bu yüzden Ziyad onu sınıra atadı ve orada iki yıl kaldı.\""
  id: "Ziyad ibn Abi Sufyan mengangkat Sinan ibn Salama ibn al-Muhabbaq al-Hudhali pada masa pemerintahan Muawiya. Ia adalah seorang yang berbudi luhur dan saleh, dan dialah yang pertama kali mewajibkan para prajurit untuk bersumpah dengan ceraikan. Ia datang ke perbatasan dan menaklukkan Makran dengan kekerasan, mendirikannya, dan tinggal di sana serta menguasai negeri itu. Penyair berkata tentangnya: “Ceraikan wanita yang tidak membawa mahar untuknya. Aku melihat Hudhayl yang berbuat dosa dalam sumpahnya.” Ibn al-Kalbi berkata: “Orang yang menaklukkan Makran adalah Hakim ibn Jabala al-Abdi. Kemudian Ziyad menunjuk Rashid ibn Amr al-Jadidi dari Azd ke perbatasan. Dia datang ke Makran, lalu menyerang al-Qayqan dan menang. Kemudian dia menyerang al-Mayd dan terbunuh. Sinan ibn Salama mengambil alih urusan rakyat, jadi Ziyad menunjuknya ke perbatasan, dan dia tinggal di sana selama dua tahun.”"
