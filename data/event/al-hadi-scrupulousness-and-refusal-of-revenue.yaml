id: event/al-hadi-scrupulousness-and-refusal-of-revenue
class: event
kind: other
label:
  ar: 'ورع الهادي: ترك الأكل من جباية اليمن وقسمه على نفسه'
  en: 'Al-Hadi''s scrupulousness: not living on the revenue of Yemen'
  ur: 'ورع ہادی: یمن کی وصولی میں سے کچھ نہ کھانا'
  es: "La escrupulosidad de Al-Hadi: no vivir de los ingresos de Yemen."
  fr: "La rigueur d'Al-Hadi: ne pas vivre des revenus du Yémen"
  tr: "El-Hadi'nin dindarlığı: Yemen vergi gelirlerinden yemedi ve bunları kendi arasında paylaştırdı."
  id: "Ketakwaan Al-Hadi: Ia menahan diri untuk tidak memakan hasil pajak Yaman dan membaginya untuk dirinya sendiri."
summary:
  ar: في باب ورع يحيى بن الحسين يروي محمد بن عبيد الله أنه كان يترك بعض ما يحل له تورعاً، فجزية النصارى واليهود له ولأهل بيته لكنه لم يأكل منها ولم يشرب، وأنه ينفق مما جاء به من الحجاز وقوته درهمان صغيران كل يوم؛ ويروي محمد بن سليمان الكوفي أخباراً عن سنبلة لم يقطعها وعن وكيله في السوق.
  en: 'In the chapter on his scrupulousness, Muhammad ibn Ubaydallah says al-Hadi left some of what was lawful for him out of scruple: the jizya of Christians and Jews was due to him and his household, yet he neither ate nor drank from it, and spent from what he brought from the Hijaz, living on two small dirhams a day; Muhammad ibn Sulayman al-Kufi adds reports about an ear of grain he would not touch and a buyer he told not to charge him more than others.'
  ur: باب ورع میں محمد بن عبید اللہ بتاتے ہیں کہ ہادی بعض حلال چیزیں احتیاطاً چھوڑ دیتے؛ نصاریٰ و یہود کا جزیہ ان اور ان کے اہل بیت کا حق تھا مگر وہ اس میں سے نہ کھاتے نہ پیتے، اور حجاز سے لائے ہوئے مال سے خرچ کرتے اور روز دو چھوٹے درہم پر گزارا کرتے؛ محمد بن سلیمان کوفی ایک بالی کا جو انہوں نے نہ چھوئی اور بازار کے خریدار کو ہدایت کا ذکر کرتے ہیں۔
  es: "En el capítulo sobre su escrupulosidad, Muhammad ibn Ubaydallah dice que al-Hadi dejó de lado algunas cosas que le eran lícitas por escrúpulos: la jizya de cristianos y judíos le correspondía a él y a su familia, pero no comió ni bebió de ella, y gastó de lo que trajo del Hiyaz, viviendo con dos pequeños dirhams al día; Muhammad ibn Sulayman al-Kufi añade relatos sobre una espiga de grano que no quiso tocar y un comprador al que le dijo que no le cobrara más que a los demás."
  fr: "Dans le chapitre consacré à sa scrupulosité, Muhammad ibn Ubaydallah rapporte qu'al-Hadi s'est privé, par scrupule, de certaines choses qui lui étaient licites: la jizya des chrétiens et des juifs lui était due, ainsi qu'à sa famille, mais il n'en a ni mangé ni bu, et a dépensé ce qu'il avait rapporté du Hedjaz, vivant avec deux petits dirhams par jour; Muhammad ibn Sulayman al-Kufi ajoute des anecdotes concernant un épi de blé qu'il a refusé de toucher et un acheteur à qui il a dit de ne pas le surfacturer."
  tr: "Yahya ibn el-Hüseynin takvası hakkındaki bölümde, Muhammed ibn Ubeyd Allah, takva gereği kendisine helal olan bazı şeylerden vazgeçtiğini anlatır. Hristiyanların ve Yahudilerin cizyesi kendisi ve ailesi içindi, ancak bundan yemez ve içmezdi; Hicaz'dan getirdiği şeylerden her gün iki küçük dirhem harcardı. Muhammed ibn Süleyman el-Kufi, biçmediği bir buğday başağı ve pazardaki temsilcisi hakkında hikayeler anlatır."
  id: "Dalam bab tentang ketakwaan Yahya ibn al-Husayn, Muhammad ibn Ubayd Allah meriwayatkan bahwa ia meninggalkan beberapa hal yang halal baginya karena ketakwaan. Jizya orang Kristen dan Yahudi adalah untuk dirinya dan keluarganya, tetapi ia tidak makan atau minum darinya, dan ia menghabiskan dua dirham kecil setiap hari dari apa yang dibawanya dari Hijaz. Muhammad ibn Sulayman al-Kufi meriwayatkan kisah tentang sebatang gandum yang tidak ia potong dan tentang agennya di pasar."
