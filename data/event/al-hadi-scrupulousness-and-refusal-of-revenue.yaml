id: event/al-hadi-scrupulousness-and-refusal-of-revenue
class: event
kind: other
label:
  ar: 'ورع الهادي: ترك الأكل من جباية اليمن وقسمه على نفسه'
  en: 'Al-Hadi''s scrupulousness: not living on the revenue of Yemen'
  ur: 'ورع ہادی: یمن کی وصولی میں سے کچھ نہ کھانا'
summary:
  ar: في باب ورع يحيى بن الحسين يروي محمد بن عبيد الله أنه كان يترك بعض ما يحل له تورعاً، فجزية النصارى واليهود له ولأهل بيته لكنه لم يأكل منها ولم يشرب، وأنه ينفق مما جاء به من الحجاز وقوته درهمان صغيران كل يوم؛ ويروي محمد بن سليمان الكوفي أخباراً عن سنبلة لم يقطعها وعن وكيله في السوق.
  en: 'In the chapter on his scrupulousness, Muhammad ibn Ubaydallah says al-Hadi left some of what was lawful for him out of scruple: the jizya of Christians and Jews was due to him and his household, yet he neither ate nor drank from it, and spent from what he brought from the Hijaz, living on two small dirhams a day; Muhammad ibn Sulayman al-Kufi adds reports about an ear of grain he would not touch and a buyer he told not to charge him more than others.'
  ur: باب ورع میں محمد بن عبید اللہ بتاتے ہیں کہ ہادی بعض حلال چیزیں احتیاطاً چھوڑ دیتے؛ نصاریٰ و یہود کا جزیہ ان اور ان کے اہل بیت کا حق تھا مگر وہ اس میں سے نہ کھاتے نہ پیتے، اور حجاز سے لائے ہوئے مال سے خرچ کرتے اور روز دو چھوٹے درہم پر گزارا کرتے؛ محمد بن سلیمان کوفی ایک بالی کا جو انہوں نے نہ چھوئی اور بازار کے خریدار کو ہدایت کا ذکر کرتے ہیں۔
