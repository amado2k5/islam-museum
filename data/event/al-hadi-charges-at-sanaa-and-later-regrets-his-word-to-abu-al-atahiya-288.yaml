id: event/al-hadi-charges-at-sanaa-and-later-regrets-his-word-to-abu-al-atahiya-288
class: event
label:
  ar: "الهادي يحمل على خصومه بصنعاء ثم يأسف على كلمة قالها لأبي العتاهية، محرم 288هـ"
  en: "Al-Hadi charges his opponents at Sana'a and later regrets a word he said to Abu al-Atahiya, Muharram 288 AH"
  ur: "ہادی صنعاء میں مخالفین پر حملہ کرتے ہیں اور بعد میں ابو العتاہیہ سے کہی ہوئی بات پر افسوس کرتے ہیں، محرم 288ھ"
summary:
  ar: "يقول الهادي لأبي العتاهية أن يصرفهم من موضعهم وإلا نظمهم في رمحه كما ينظم الجراد في العود، فيعودون عليه بالنبل والحجارة، ويقع القتال قرب داره، فيركب الهادي وابنه أبو القاسم وأصحابه ويحمل ومعه إسماعيل بن المسلم فيطعن ثلاثة من خيارهم وفارساً، ثم يروي علي بن محمد أنه سمع الهادي يقول إنه ندم على تلك الكلمة حتى أعطاه الله الظفر وآلى ألا يتكلم بمثلها أبداً."
  en: "Al-Hadi tells Abu al-Atahiya to move them from their place or he will string them on his spear as locusts are strung on a stick; they answer Abu al-Atahiya with arrows and stones, fighting breaks out near the imam's house, and al-Hadi, his son Abu al-Qasim and his men mount and charge, al-Hadi with Ismail ibn al-Muslim, and he spears three of their best men and a horseman; Ali ibn Muhammad then reports hearing al-Hadi say he had regretted that word until God gave him the victory, and that he vowed never to speak so again."
  ur: "ہادی ابو العتاہیہ سے کہتے ہیں کہ انہیں ان کی جگہ سے ہٹا دیں ورنہ وہ انہیں اپنے نیزے میں ایسے پرو دیں گے جیسے ٹڈی لکڑی میں پروئی جاتی ہے؛ وہ ابو العتاہیہ پر تیر اور پتھر برساتے ہیں، ہادی کے گھر کے قریب لڑائی ہوتی ہے، اور ہادی، ان کے بیٹے ابو القاسم اور ساتھی سوار ہو کر حملہ کرتے ہیں، ہادی اسماعیل بن مسلم کے ساتھ، اور ان کے تین بہترین آدمیوں اور ایک سوار کو نیزہ مارتے ہیں؛ پھر علی بن محمد روایت کرتے ہیں کہ ہادی نے کہا کہ انہیں اس بات پر اس وقت تک پچھتاوا رہا جب تک اللہ نے انہیں فتح نہ دی، اور انہوں نے عہد کیا کہ پھر ایسی بات نہ کہیں گے۔"
