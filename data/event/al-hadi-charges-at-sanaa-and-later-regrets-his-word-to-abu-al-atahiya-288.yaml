id: event/al-hadi-charges-at-sanaa-and-later-regrets-his-word-to-abu-al-atahiya-288
class: event
label:
  ar: "الهادي يحمل على خصومه بصنعاء ثم يأسف على كلمة قالها لأبي العتاهية، محرم 288هـ"
  en: "Al-Hadi charges his opponents at Sana'a and later regrets a word he said to Abu al-Atahiya, Muharram 288 AH"
  ur: "ہادی صنعاء میں مخالفین پر حملہ کرتے ہیں اور بعد میں ابو العتاہیہ سے کہی ہوئی بات پر افسوس کرتے ہیں، محرم 288ھ"
  es: "Al-Hadi ataca a sus oponentes en Saná y luego se arrepiente de unas palabras que le dijo a Abu al-Atahiya, Muharram 288 AH."
  fr: "Al-Hadi charge ses adversaires à Sanaa et regrette ensuite des paroles prononcées à Abu al-Atahiya, en Muharram 288 AH."
  tr: "El-Hadi, Sana'a'da rakiplerine saldırır, ardından Hicri 288 Muharrem ayında Ebu el-Atahiye'ye söylediği bir sözden pişman olur."
  id: "Al-Hadi menyerang lawan-lawannya di Sana'a, kemudian menyesali kata-kata yang diucapkannya kepada Abu al-Atahiyah, Muharram 288 H."
summary:
  ar: "يقول الهادي لأبي العتاهية أن يصرفهم من موضعهم وإلا نظمهم في رمحه كما ينظم الجراد في العود، فيعودون عليه بالنبل والحجارة، ويقع القتال قرب داره، فيركب الهادي وابنه أبو القاسم وأصحابه ويحمل ومعه إسماعيل بن المسلم فيطعن ثلاثة من خيارهم وفارساً، ثم يروي علي بن محمد أنه سمع الهادي يقول إنه ندم على تلك الكلمة حتى أعطاه الله الظفر وآلى ألا يتكلم بمثلها أبداً."
  en: "Al-Hadi tells Abu al-Atahiya to move them from their place or he will string them on his spear as locusts are strung on a stick; they answer Abu al-Atahiya with arrows and stones, fighting breaks out near the imam's house, and al-Hadi, his son Abu al-Qasim and his men mount and charge, al-Hadi with Ismail ibn al-Muslim, and he spears three of their best men and a horseman; Ali ibn Muhammad then reports hearing al-Hadi say he had regretted that word until God gave him the victory, and that he vowed never to speak so again."
  ur: "ہادی ابو العتاہیہ سے کہتے ہیں کہ انہیں ان کی جگہ سے ہٹا دیں ورنہ وہ انہیں اپنے نیزے میں ایسے پرو دیں گے جیسے ٹڈی لکڑی میں پروئی جاتی ہے؛ وہ ابو العتاہیہ پر تیر اور پتھر برساتے ہیں، ہادی کے گھر کے قریب لڑائی ہوتی ہے، اور ہادی، ان کے بیٹے ابو القاسم اور ساتھی سوار ہو کر حملہ کرتے ہیں، ہادی اسماعیل بن مسلم کے ساتھ، اور ان کے تین بہترین آدمیوں اور ایک سوار کو نیزہ مارتے ہیں؛ پھر علی بن محمد روایت کرتے ہیں کہ ہادی نے کہا کہ انہیں اس بات پر اس وقت تک پچھتاوا رہا جب تک اللہ نے انہیں فتح نہ دی، اور انہوں نے عہد کیا کہ پھر ایسی بات نہ کہیں گے۔"
  es: "Al-Hadi le dice a Abu al-Atahiya que los mueva de su lugar o los ensartará en su lanza como se ensartan las langostas en un palo; ellos responden a Abu al-Atahiya con flechas y piedras, estalla la lucha cerca de la casa del imán, y al-Hadi, su hijo Abu al-Qasim y sus hombres montan a caballo y cargan, al-Hadi con Ismail ibn al-Muslim, y ensarta con su lanza a tres de sus mejores hombres y a un jinete; Ali ibn Muhammad relata entonces haber oído a al-Hadi decir que se había arrepentido de esas palabras hasta que Dios le dio la victoria, y que juró no volver a hablar así jamás."
  fr: "Al-Hadi ordonne à Abu al-Atahiya de les déplacer, sous peine de les enfiler sur sa lance comme on enfile des sauterelles sur un bâton. Ils ripostent à Abu al-Atahiya avec des flèches et des pierres. Un combat éclate près de la maison de l'imam, et al-Hadi, son fils Abu al-Qasim et ses hommes montent à cheval et chargent. Al-Hadi, accompagné d'Ismail ibn al-Muslim, transperce de sa lance trois de leurs meilleurs hommes et un cavalier. Ali ibn Muhammad rapporte ensuite avoir entendu al-Hadi dire qu'il avait regretté ces paroles jusqu'à ce que Dieu lui accorde la victoire, et qu'il avait juré de ne plus jamais les prononcer."
  tr: "El-Hadi, Ebu el-Atahiye'ye onları bulundukları yerden uzaklaştırmasını söyler, aksi takdirde onları mızrağına çekirgeler gibi dizeceğini belirtir. Onlar ok ve taşlarla geri dönecekler ve evinin yakınında savaş başlayacaktır. El-Hadi, oğlu Ebu el-Kâsım ve arkadaşları atlarına binip hücuma geçecekler ve yanında İsmail bin el-Müslim de olacaktır. İsmail, onların en iyi üç adamını ve bir süvariyi bıçaklayacaktır. Sonra Ali bin Muhammed, El-Hadi'nin bu sözünden pişman olduğunu, ta ki Allah ona zafer verene kadar ve bir daha asla böyle bir şey söylemeyeceğine yemin ettiğini söylediğini rivayet eder."
  id: "Al-Hadi menyuruh Abu al-Atahiyah untuk menyingkirkan mereka dari posisi mereka, jika tidak, dia akan menimbun mereka di tombaknya seperti belalang yang ditimbun di tongkat. Mereka akan kembali kepadanya dengan panah dan batu, dan pertempuran akan terjadi di dekat rumahnya. Al-Hadi, putranya Abu al-Qasim, dan para sahabatnya akan berkuda dan menyerang, dan bersamanya akan ada Ismail bin al-Muslim. Dia akan menikam tiga orang terbaik mereka dan seorang penunggang kuda. Kemudian Ali bin Muhammad meriwayatkan bahwa dia mendengar al-Hadi berkata bahwa dia menyesali kata-kata itu sampai Allah memberinya kemenangan, dan dia bersumpah untuk tidak pernah mengucapkan hal seperti itu lagi."
