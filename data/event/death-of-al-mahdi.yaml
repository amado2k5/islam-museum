label: { ar: "وفاة المهدي", en: "Death of al-Mahdi", es: "Muerte de al-Mahdi", fr: "Mort d'al-Mahdi", ur: "المہدی کی وفات", tr: "Mehdi'nin Ölümü", id: "Kematian Mahdi" }
summary:
  ar: "في سنة تسع وستين ومئة مات المهدي؛ ساق خلف صيد فاقتحم الصيد خربة وتبعه الفرس فدق ظهره في بابها فمات لوقته وذلك لثمان بقين من المحرم، وقيل إنه مات مسموماً {cite:tarikh-khulafa-minhaj-1434 p. 443}."
  en: "In year 169 al-Mahdi died: chasing game, the quarry burst into a ruin and his horse followed, breaking his back in its doorway — he died on the spot, on the eighth of Muharram; others say he died poisoned {cite:tarikh-khulafa-minhaj-1434 p. 443}."
  es: "En el año 169 murió al-Mahdi: mientras perseguía una presa, la presa irrumpió en una ruina y su caballo la siguió, rompiéndole la espalda en la entrada; murió en el acto, el octavo de Muharram; otros dicen que murió envenenado {cite:tarikh-khulafa-minhaj-1434 p. 443}."
  fr: "En l'an 169, al-Mahdi mourut: à la chasse, la proie explosa en ruine et son cheval suivit, se brisant le dos dans son entrée — il mourut sur le coup, le huitième jour de Muharram; d'autres disent qu'il est mort empoisonné {cite:tarikh-khulafa-minhaj-1434 p. 443}."
  ur: "سنہ 169 میں المہدی کا انتقال ہوا: تعاقب کے کھیل میں، کھنڈر ایک کھنڈر میں پھٹ گیا اور اس کا گھوڑا اس کے دروازے میں اس کی کمر توڑ کر پیچھے چلا گیا - وہ آٹھویں محرم کو موقع پر ہی مر گیا۔ دوسرے کہتے ہیں کہ اس کی موت زہر سے ہوئی 443}۔"
  tr: "169 yılında El-Mehdi öldü; av peşindeydi ve av bir harabeye girdi, at da onu takip etti ve kapısına sırtını çarparak öldü. Bu olay Muharrem ayının sekizinci gününde oldu ve zehirlenerek öldüğü rivayet edildi. {Kaynak:tarikh-khulafa-minhaj-1434 s. 443}"
  id: "Pada tahun 169, Al-Mahdi meninggal; ia sedang berburu, dan buruannya menyerbu reruntuhan, lalu kudanya mengikutinya dan membenturkan punggungnya ke pintu reruntuhan, dan ia langsung meninggal, dan itu terjadi pada hari kedelapan bulan Muharram yang tersisa, dan dikatakan bahwa ia meninggal karena diracun {cite:tarikh-khulafa-minhaj-1434 p. 443}."
