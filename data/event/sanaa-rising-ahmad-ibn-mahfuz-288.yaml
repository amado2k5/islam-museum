label:
  ar: وثوب أهل صنعاء وإخراج علي بن سليمان سنة 288هـ
  en: The rising in Sana'a and the expulsion of Ali ibn Sulayman, 288 AH
  ur: صنعاء میں شورش اور علی بن سلیمان کا اخراج، 288ھ
summary:
  ar: وثب جمع من أهل صنعاء مع أحمد بن محفوظ فكسروا الحبس وأخرجوا علي بن سليمان نائب الهادي، واستولى عليها عبد القاهر بن أحمد بن نعيم، في سنة 288هـ.
  en: A crowd from Sana'a with Ahmad ibn Mahfuz broke the prison and drove out al-Hadi's deputy Ali ibn Sulayman, and Abd al-Qahir ibn Ahmad ibn Na'im took the city, in 288 AH.
  ur: صنعاء کے ایک جمگھٹے نے احمد بن محفوظ کے ساتھ مل کر قید خانہ توڑا اور ہادی کے نائب علی بن سلیمان کو نکال دیا، اور عبد القاہر بن احمد بن نعیم نے شہر پر قبضہ کر لیا، 288ھ میں۔
