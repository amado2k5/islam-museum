id: event/siege-of-lahore-1043
class: event
kind: siege
label:
  ar: "حصار لاهور من ائتلاف الأمراء الهنود، ٤٣٥هـ/١٠٤٣–١٠٤٤م"
  en: "Confederate Hindu princes' siege of Lahore, 435/1043-4"
  ur: "ہندو شہزادوں کی متحدہ فوج کا لہور کا محاصرہ، 435ھ/1043–44ء"
  es: "El asedio de Lahore por los príncipes hindúes confederados, 435/1043-4"
  fr: "Siège de Lahore par les princes hindous confédérés, 435/1043-4"
  tr: "Hint prenslerinden oluşan bir koalisyonun Lahor kuşatması, Hicri 435 / Miladi 1043-1044"
  id: "Pengepungan Lahore oleh koalisi pangeran-pangeran India, 435 H/1043–1044 M"
summary:
  ar: "في سنة ٤٣٥هـ/١٠٤٣–١٠٤٤م تعرضت لاهور لحصار طويل من ائتلاف أمراء هنود، لكنه لم ينجح؛ وبقيت المدينة في أيدي الغزنويين الذين جعلوها مركزًا إداريًا لأقاليمهم الهندية وثاني عواصم دولتهم {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "In 435/1043-4 Lahore underwent a long siege by a confederacy of Hindu princes, but it failed; the city remained firmly in Ghaznavid hands, serving as the administrative centre of their Indian provinces and effectively the second capital of the empire {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "435ھ/1043–44ء میں ہندو شہزادوں کی متحدہ فوج نے لہور کا ایک طویل محاصرہ کیا لیکن ناکام رہا؛ شہر غزنویوں کے قبضے میں رہا جو اسے اپنے ہندوستانی صوبوں کا انتظامی مرکز اور مؤثر طور پر سلطنت کا دوسرا دارالسلطنت بنائے ہوئے تھے {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  es: "En 435/1043-4 Lahore sufrió un largo asedio por parte de una confederación de príncipes hindúes, pero fracasó; la ciudad permaneció firmemente en manos de los gaznávidas, sirviendo como centro administrativo de sus provincias indias y, de hecho, como la segunda capital del imperio {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  fr: "En 435/1043-4 Lahore subit un long siège par une confédération de princes hindous, mais celui-ci échoua; la ville resta fermement aux mains des Ghaznévides, servant de centre administratif de leurs provinces indiennes et étant effectivement la deuxième capitale de l'empire {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  tr: "Hicri 435/Miladi 1043-1044 yılında Lahor, Hint prenslerinden oluşan bir koalisyon tarafından uzun bir kuşatmaya tabi tutuldu, ancak kuşatma başarısız oldu; şehir Gaznelilerin elinde kaldı ve Gazneliler şehri Hint toprakları için bir idari merkez ve devletlerinin ikinci başkenti yaptılar. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}"
  id: "Pada tahun 435 H/1043–1044 M, Lahore mengalami pengepungan panjang oleh koalisi pangeran India, tetapi pengepungan itu tidak berhasil; dan kota itu tetap berada di tangan Dinasti Ghaznavid, yang menjadikannya pusat administrasi untuk wilayah India mereka dan ibu kota kedua negara mereka {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
