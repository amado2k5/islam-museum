label:
  ar: "حصار لاهور من ائتلاف الأمراء الهنود، ٤٣٥هـ/١٠٤٣–١٠٤٤م"
  en: "Confederate Hindu princes' siege of Lahore, 435/1043-4"
  ur: "ہندو شہزادوں کی متحدہ فوج کا لہور کا محاصرہ، 435ھ/1043–44ء"
summary:
  ar: "في سنة ٤٣٥هـ/١٠٤٣–١٠٤٤م تعرضت لاهور لحصار طويل من ائتلاف أمراء هنود، لكنه لم ينجح؛ وبقيت المدينة في أيدي الغزنويين الذين جعلوها مركزًا إداريًا لأقاليمهم الهندية وثاني عواصم دولتهم {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "In 435/1043-4 Lahore underwent a long siege by a confederacy of Hindu princes, but it failed; the city remained firmly in Ghaznavid hands, serving as the administrative centre of their Indian provinces and effectively the second capital of the empire {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "435ھ/1043–44ء میں ہندو شہزادوں کی متحدہ فوج نے لہور کا ایک طویل محاصرہ کیا لیکن ناکام رہا؛ شہر غزنویوں کے قبضے میں رہا جو اسے اپنے ہندوستانی صوبوں کا انتظامی مرکز اور مؤثر طور پر سلطنت کا دوسرا دارالسلطنت بنائے ہوئے تھے {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
