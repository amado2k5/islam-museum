id: event/death-tirmidhi-bugh-279
class: event
kind: death
label:
  ar: "وفاة أبي عيسى الترمذي بقرية بوغ قرب ترمذ، الاثنين ١٣ رجب ٢٧٩هـ"
  en: "Death of Abu 'Isa al-Tirmidhi at Bugh near Tirmidh, Monday 13 Rajab 279/892"
  ur: "ابوعیسیٰ ترمذی کی وفات بوغ قریب ترمذ، پیر 13 رجب 279ھ/892ء"
summary:
  ar: "توفي الترمذي ليلة الاثنين لثلاث عشرة ليلة خلت من رجب سنة تسع وسبعين ومائتين بعد أن سجل حضوراً علمياً إيجابياً في تاريخ الحديث {cite:mawsuat-a3lam-ulama-adaba p. 451}؛ وتوفي بترمذ سنة ٢٧٩هـ {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}، وروى عنه الحبوبي والهيثم بن كليب وخلق {cite:taqrib-al-tahdhib p. 558}."
  en: "Al-Tirmidhi died on the night of Monday, thirteen nights before the end of Rajab, in 279/892, having left a positive scholarly mark on the history of hadith {cite:mawsuat-a3lam-ulama-adaba p. 451}; he died at Tirmidh in 279/892 {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}, and al-Hububi, al-Haytham ibn Kulayb and many others narrated from him {cite:taqrib-al-tahdhib p. 558}."
  ur: "ترمذی پیر کی رات کو رجب کے آخری تیرہ دنوں میں 279ھ/892ء میں فوت ہوئے، انہوں نے تاریخِ حدیث میں مثبت علمی حاضری درج کی {cite:mawsuat-a3lam-ulama-adaba p. 451}؛ وہ ترمذ میں 279ھ/892ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}، اور ان سے حبوبی، ہیشم بن کلیب اور بہت سے لوگوں نے روایت کی {cite:taqrib-al-tahdhib p. 558}۔"
