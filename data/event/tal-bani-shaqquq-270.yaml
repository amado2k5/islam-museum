label: { ar: "انفراج تل بني شقيق عن سبعة أقبر", en: "Splitting of the Mound of Bani Shaqiq to Reveal Seven Graves", es: "La división del túmulo de Bani Shaqiq revela siete tumbas.", fr: "La fissuration du tumulus de Bani Shaqiq révèle sept tombes", ur: "سات قبروں کو ظاہر کرنے کے لیے بنی شقیق کے ٹیلے کو تقسیم کرنا" }
summary:
  ar: "في سنة 270هـ ورد الخبر بانفراج تل بنهر الصراة يعرف بتل بني شقيق عن سبعة قبور في لوح من حجر عليه كتابة لا يُدرى ما هي، فيها سبعة أبدان صحيحة عليها أكفان جدد لينة لها أهداب تفوح منها رائحة المسك؛ أحدهم شاب له جمّة وجبهته وأذناه وأنفه وشفتاه ورقبته وأشفار عينيه صحاح وعلى شفته بلل كأنه شرب ماء وكأنه تدلك، وضربة في خاصرته ردت عليه أكفانه، وجذب بعض الحاضرين من شعر بعضهم فوجده قوي الأصل كنحو شعر الحي {cite:muntazam-ibn-al-jawzi p. 109}."
  en: "In 270 a mound on Nahr al-Sirat called Tall Bani Shaqquq split open on seven graves with an unreadable inscription: seven bodies whole in fresh soft shrouds perfumed like musk, one a youth with dew still on his lip as if he had just drunk, the wound in his flank turned back by the shroud, the hair rooted as on a living man {cite:muntazam-ibn-al-jawzi p. 109}."
  es: "En 270, un túmulo en Nahr al-Sirat llamado Tall Bani Shaqquq se abrió en siete tumbas con una inscripción ilegible: siete cuerpos enteros en sudarios suaves y frescos perfumados como almizcle, uno de ellos un joven con rocío todavía en sus labios como si acabara de beber, la herida en su costado cubierta por el sudario, el cabello enraizado como en un hombre vivo {cite:muntazam-ibn-al-jawzi p. 109}."
  fr: "En 270, un monticule sur Nahr al-Sirat appelé Tall Bani Shaqquq s'ouvrit sur sept tombes avec une inscription illisible: sept corps entiers dans des linceuls frais et doux parfumés comme du musc, l'un d'eux étant un jeune homme avec de la rosée encore sur les lèvres comme s'il venait de boire, la blessure à son flanc repoussée par le linceul, les cheveux enracinés comme sur un homme vivant {cite: muntazam-ibn-al-jawzi p. 109}."
  ur: "270 میں نہر السیرۃ پر ایک ٹیلہ جس کا نام قد بنی شقق ہے، سات قبروں پر پھٹ گیا جس پر پڑھا نہیں جا سکتا: سات لاشیں تازہ نرم کفنوں میں کستوری کی طرح خوشبو سے بھری ہوئی ہیں، ایک نوجوان جس کے ہونٹوں پر شبنم ابھی تک ہے گویا اس نے ابھی پی لیا ہے، اس کے پہلو میں زخم کفن کی جڑوں کی طرح پلٹ گیا، ایک زندہ آدمی کے بالوں پر۔ {حوالہ:منتظم ابن الجوزی ص۔ 109}۔"
