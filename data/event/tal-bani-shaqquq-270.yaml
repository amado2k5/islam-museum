label: { ar: "انفراج تل بني شقيق عن سبعة أقبر" }
summary:
  ar: "في سنة 270هـ ورد الخبر بانفراج تل بنهر الصراة يعرف بتل بني شقيق عن سبعة قبور في لوح من حجر عليه كتابة لا يُدرى ما هي، فيها سبعة أبدان صحيحة عليها أكفان جدد لينة لها أهداب تفوح منها رائحة المسك؛ أحدهم شاب له جمّة وجبهته وأذناه وأنفه وشفتاه ورقبته وأشفار عينيه صحاح وعلى شفته بلل كأنه شرب ماء وكأنه تدلك، وضربة في خاصرته ردت عليه أكفانه، وجذب بعض الحاضرين من شعر بعضهم فوجده قوي الأصل كنحو شعر الحي {cite:muntazam-ibn-al-jawzi p. 109}."
  en: "In 270 a mound on Nahr al-Sirat called Tall Bani Shaqquq split open on seven graves with an unreadable inscription: seven bodies whole in fresh soft shrouds perfumed like musk, one a youth with dew still on his lip as if he had just drunk, the wound in his flank turned back by the shroud, the hair rooted as on a living man {cite:muntazam-ibn-al-jawzi p. 109}."
