id: event/al-hadi-call-to-jihad-saada-284
class: event
kind: declaration
label:
  ar: إقامة الهادي في صعدة ودعوته إلى الجهاد وشروطه الستة، 284هـ
  en: Al-Hadi's stay at Sa'da and his call to jihad with its six conditions, 284 AH
  ur: ہادی کا صعدہ میں قیام اور جہاد کی دعوت اور اس کی چھ شرائط، 284ھ
  es: "La estancia de Al-Hadi en Sa'da y su llamamiento a la yihad con sus seis condiciones, 284 AH."
  fr: "Le séjour d'Al-Hadi à Sa'da et son appel au jihad assorti de ses six conditions, 284 AH"
  tr: "El-Hadi'nin Sa'de'de kalışı ve cihat çağrısı ile altı şartı, Hicri 284."
  id: "Masa tinggal Al-Hadi di Sa'dah dan seruannya untuk berjihad beserta enam syaratnya, 284 Hijriah"
summary:
  ar: أقام الهادي في صعدة صفر وشهري ربيع وجمادى والناس يكتبون إليه من اليمن، وكان قد كتب إلى أهل اليمن كتاب دعوة يحضهم فيه على الجهاد؛ يدعو إلى الكتاب والسنة والأمر بالمعروف والنهي عن المنكر، ويشترط على نفسه أربعاً وعلى الناس اثنتين.
  en: Al-Hadi stayed at Sa'da through Safar and the two Rabi' months and Jumada while people of Yemen wrote to him; on arrival he had written to all Yemen a letter of call urging jihad, summoning to the Book, the sunna and enjoining good and forbidding wrong, and setting four conditions on himself and two on the people.
  ur: ہادی صعدہ میں صفر اور دونوں ربیع اور جمادی میں ٹھہرے رہے اور یمن کے لوگ انہیں خط لکھتے رہے؛ آتے ہی انہوں نے پورے یمن کو دعوت نامہ لکھا تھا جس میں جہاد پر ابھارا، کتاب و سنت اور امر بالمعروف و نہی عن المنکر کی طرف بلایا، اور اپنے اوپر چار اور لوگوں پر دو شرطیں رکھیں۔
  es: "Al-Hadi permaneció en Sa'da durante Safar, los dos meses de Rabi' y Jumada, mientras la gente de Yemen le escribía. A su llegada, había escrito a todo Yemen una carta de llamamiento instando a la yihad, llamando al Libro, a la sunna, ordenando el bien y prohibiendo el mal, y estableciendo cuatro condiciones para sí mismo y dos para la gente."
  fr: "Al-Hadi resta à Sa'da pendant les mois de Safar et les deux mois de Rabi' et Jumada, tandis que les habitants du Yémen lui écrivaient; à son arrivée, il avait écrit à tout le Yémen une lettre d'appel exhortant au jihad, appelant au Livre, à la sunna, ordonnant le bien et interdisant le mal, et fixant quatre conditions pour lui-même et deux pour le peuple."
  tr: "El-Hadi, Safer, Rabi' ve Cemâde ayları boyunca Sa'de'de kaldı ve Yemen'den insanlar ona mektuplar yazdı. Yemen halkına cihat çağrısında bulunan bir davet mektubu yazmıştı; Kitaba ve Sünnete bağlı kalınmasını, iyiliği emredip kötülüğü yasaklamasını ve kendisi için dört, halk için de iki şart koşmasını istemişti."
  id: "Al-Hadi tinggal di Sa'dah selama bulan Safar, Rabi' dan Jumada, dan orang-orang menulis surat kepadanya dari Yaman. Dia telah menulis surat kepada penduduk Yaman berisi ajakan untuk berjihad; dia menyerukan untuk berpegang teguh pada Kitab dan Sunnah, menyeru kepada kebaikan dan melarang kejahatan, dan dia menetapkan empat syarat untuk dirinya sendiri dan dua syarat untuk orang lain."
