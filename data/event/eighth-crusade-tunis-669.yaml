id: event/eighth-crusade-tunis-669
class: event
kind: siege
label:
  ar: منازلة الفرنسيس تونس
  en: Louis IX's siege of Tunis (the Eighth Crusade)
  es: "El asedio de Túnez por Luis IX (la Octava Cruzada)"
  fr: "Le siège de Tunis par Louis IX (la Huitième Croisade)"
  ur: "لوئس IX کا تیونس کا محاصرہ ⁦(آٹھویں صلیبی جنگ)⁩"
  tr: "Fransa'nın Tunus ile çatışması"
  id: "Konfrontasi Prancis dengan Tunisia"
summary:
  ar: "أقلع لويس ملك الفرنسيس بأساطيله آخر ذي القعدة سنة 668هـ فاجتمع بسردانية ثم نزل بساحل قرطاجنة في نحو ستة آلاف فارس وثلاثين ألف راجل على ثلاثمائة سفينة فيما حدث ابن خلدون عن أبيه عن أبيه، وسبعة ملوك فيهم صاحب صقلية وصاحب الجزر، وأبى أن يستجلس رسول السلطان وأخذ ثمانين ألفاً من الذهب كان أوفدها لكف عزمه. والتقى الجمعان في منتصف محرم سنة 669هـ فمات من الفريقين زهاء خمسمائة، حتى أهلك الله عدوهم وأصبح ملك الفرنجة ميتاً، فعقد الصلح وكتبه القاضي ابن زيتون في خمسة عشر يوماً، وأمر بتخريب قرطاجنة فنُقل بنيانها إلى تونس."
  en: "Louis of France sailed at the end of Dhu al-Qa'da 668, mustered at Sardinia, and landed at Carthage with some six thousand horse and thirty thousand foot on three hundred ships — as Ibn Khaldun reports from his father from his grandfather — seven kings among them the lords of Sicily and the islands; he refused the sultan's envoy and pocketed the eighty thousand gold pieces sent to buy him off. The hosts met in mid-Muharram 669 with some five hundred dead on both sides, until the Frankish king was found dead in his camp; the peace was drawn by the qadi Ibn Zaytun over fifteen days, and Carthage was demolished, its stones carried to Tunis."
  es: "Luis de Francia zarpó a finales de Dhu al-Qa'da de 668, se reunió en Cerdeña y desembarcó en Cartago con unos seis mil jinetes y treinta mil infantes en trescientos barcos —según relata Ibn Khaldun, de su padre, de su abuelo—, siete reyes, entre ellos los señores de Sicilia y las islas. Rechazó al enviado del sultán y se embolsó las ochenta mil piezas de oro enviadas para sobornarlo. Los ejércitos se enfrentaron a mediados de Muharram de 669 con unos quinientos muertos en ambos bandos, hasta que el rey franco fue hallado muerto en su campamento. La paz fue firmada por el cadí Ibn Zaytun en quince días, y Cartago fue demolida y sus piedras llevadas a Túnez."
  fr: "Louis de France appareilla à la fin du mois de Dhu al-Qa'da 668, se rassembla en Sardaigne et débarqua à Carthage avec environ six mille cavaliers et trente mille fantassins répartis sur trois cents navires – comme le rapporte Ibn Khaldoun, d'après son père qui tenait cela de son grand-père – sept rois parmi lesquels les seigneurs de Sicile et des îles. Il refusa l'envoyé du sultan et empocha les quatre-vingt mille pièces d'or envoyées pour le corrompre. Les armées s'affrontèrent à la mi-Muharram 669, faisant environ cinq cents morts de chaque côté, jusqu'à ce que le roi franc soit retrouvé mort dans son camp. La paix fut négociée par le cadi Ibn Zaytoun au cours de quinze jours, et Carthage fut rasée, ses pierres emportées à Tunis."
  ur: "فرانس کے لوئس نے ذوالقعدہ 668 کے آخر میں بحری سفر کیا، سارڈینیا میں جمع ہوا، اور تین سو بحری جہازوں پر تقریباً چھ ہزار گھوڑوں اور تیس ہزار پیدلوں کے ساتھ کارتھیج پر اترا — جیسا کہ ابن خلدون اپنے والد سے اپنے دادا سے روایت کرتا ہے — ان میں سے سات بادشاہ سسلی اور جزیروں کے سردار تھے۔ اس نے سلطان کے ایلچی سے انکار کر دیا اور اسے خریدنے کے لیے بھیجے گئے اسی ہزار سونے کے ٹکڑے جیب میں ڈال دیے۔ 669 کے وسط محرم میں میزبانوں کی ملاقات ہوئی جس میں دونوں طرف سے تقریباً پانچ سو افراد ہلاک ہوئے، یہاں تک کہ فرانکش بادشاہ اپنے کیمپ میں مردہ پایا گیا۔ قادی ابن زیتون نے پندرہ دنوں میں امن قائم کیا، اور کارتھیج کو مسمار کر دیا گیا، اس کے پتھر تیونس لے گئے۔"
  tr: "Frankların kralı Louis, Hicri 668 yılının (Miladi 1269) Zilhicce ayının sonunda filolarıyla yola çıktı. İbn Haldun'un babasından rivayet ettiğine göre, Sardinya'da toplandıktan sonra yaklaşık altı bin süvari ve otuz bin piyade ile üç yüz gemiyle Kartaca kıyılarına çıktı. Aralarında Sicilya hükümdarı ve adaların hükümdarının da bulunduğu yedi kral da oradaydı. Sultanın elçisini kabul etmeyi reddetti ve onu caydırmak için gönderilen seksen bin altın sikkeyi ele geçirdi. İki ordu Hicri 669 yılının (Miladi 1260) Muharrem ayının ortasında çatıştı ve her iki taraftan yaklaşık beş yüz kişi öldü. Sonunda Allah düşmanlarını yok etti ve Frank kralı öldürüldü. Ardından, kadı İbn Zeytun tarafından on beş günde yazılan bir barış antlaşması imzalandı ve Kartaca'nın yıkılması emredildi; kalıntıları Tunus'a taşındı."
  id: "Louis, Raja Frank, berlayar dengan armadanya pada akhir Dzul Qi'dah tahun 668 H (1269 M). Ia berkumpul di Sardinia dan kemudian mendarat di pantai Kartago dengan sekitar enam ribu pasukan berkuda dan tiga puluh ribu pasukan infanteri di atas tiga ratus kapal, menurut riwayat Ibnu Khaldun dari ayahnya. Tujuh raja juga hadir, termasuk penguasa Sisilia dan penguasa kepulauan. Ia menolak menerima utusan Sultan dan merebut delapan puluh ribu koin emas yang telah dikirim untuk membujuknya. Kedua pasukan bertempur di pertengahan Muharram tahun 669 H (1260 M), dan sekitar lima ratus orang dari kedua belah pihak tewas hingga Allah menghancurkan musuh mereka dan raja Frank terbunuh. Kemudian disepakati perjanjian damai, yang ditulis oleh hakim Ibnu Zaytoun dalam lima belas hari, dan ia memerintahkan penghancuran Kartago, yang reruntuhannya diangkut ke Tunis."
