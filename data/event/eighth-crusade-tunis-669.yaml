id: event/eighth-crusade-tunis-669
class: event
kind: siege
label:
  ar: منازلة الفرنسيس تونس
  en: Louis IX's siege of Tunis (the Eighth Crusade)
summary:
  ar: "أقلع لويس ملك الفرنسيس بأساطيله آخر ذي القعدة سنة 668هـ فاجتمع بسردانية ثم نزل بساحل قرطاجنة في نحو ستة آلاف فارس وثلاثين ألف راجل على ثلاثمائة سفينة فيما حدث ابن خلدون عن أبيه عن أبيه، وسبعة ملوك فيهم صاحب صقلية وصاحب الجزر، وأبى أن يستجلس رسول السلطان وأخذ ثمانين ألفاً من الذهب كان أوفدها لكف عزمه. والتقى الجمعان في منتصف محرم سنة 669هـ فمات من الفريقين زهاء خمسمائة، حتى أهلك الله عدوهم وأصبح ملك الفرنجة ميتاً، فعقد الصلح وكتبه القاضي ابن زيتون في خمسة عشر يوماً، وأمر بتخريب قرطاجنة فنُقل بنيانها إلى تونس."
  en: "Louis of France sailed at the end of Dhu al-Qa'da 668, mustered at Sardinia, and landed at Carthage with some six thousand horse and thirty thousand foot on three hundred ships — as Ibn Khaldun reports from his father from his grandfather — seven kings among them the lords of Sicily and the islands; he refused the sultan's envoy and pocketed the eighty thousand gold pieces sent to buy him off. The hosts met in mid-Muharram 669 with some five hundred dead on both sides, until the Frankish king was found dead in his camp; the peace was drawn by the qadi Ibn Zaytun over fifteen days, and Carthage was demolished, its stones carried to Tunis."
