label: { ar: "زلازل زبيد وموزع 916هـ", en: "The Zabid and Mawza' earthquakes, 916", es: "Los terremotos de Zabid y Mawza', 916", fr: "Les tremblements de terre de Zabid et Mawza, 916", ur: "زبید اور معاذ کے زلزلے، 916", tr: "Zabid ve Mawza'daki depremler, H. 916", id: "Gempa di Zabid dan Mawza, 916 H" }
summary:
  ar: "في سنة ست عشرة وتسعمائة زُلزلت مدينة زبيد زلزالاً شديداً ثم زُلزلت مرة أخرى ثم ثالثة، وانقض في عصر ذلك اليوم كوكب عظيم من جهة المشرق آخذاً في جهة الشام يُرى نهاراً وحصل عقبه رجفة عظيمة للرعد الشديد، وزُلزلت مدينة موزع وتوابعها زلزالاً عظيماً ما سُمع بمثله، واستمرت تتردد ليلاً ونهاراً زلازل صغار وكبار حتى أضرت بأهل الجهة إضراراً عظيماً فتصدعت البيوت ولم يسلم بيت من تشعث، وتشققت الأرض المعدة للزراعة وتهدمت القبور واختلطت الآبار {cite:shadharat-dhahab p. 490}. وفي السنة نفسها انقض كوكب عظيم آخر من نصف الليل أضاءت له الدنيا {cite:shadharat-dhahab p. 490}."
  en: "In 916 Zabid shook three times in a day; that afternoon a great bolide plunged east-to-Syria visible in daylight, followed by a thunderous tremor; then Mawza' and its dependencies suffered an earthquake 'such as had never been heard', recurring night and day — houses cracked, farmland split, tombs collapsed and wells ran together {cite:shadharat-dhahab p. 490}. The same year saw another great midnight bolide that lit the world {cite:shadharat-dhahab p. 490}."
  es: "En 916, Zabid tembló tres veces en un día; esa tarde, un gran bólido se precipitó hacia el este, a Siria, visible a plena luz del día, seguido de un estruendoso temblor; luego, Mawza y sus dependencias sufrieron un terremoto «como nunca antes se había oído», que se repetía día y noche: las casas se agrietaron, los campos se partieron, las tumbas se derrumbaron y los pozos se desbordaron {cite:shadharat-dhahab p. 490}. Ese mismo año se produjo otro gran bólido a medianoche que iluminó el mundo {cite:shadharat-dhahab p. 490}."
  fr: "En 916, Zabid trembla trois fois en une seule journée; cet après-midi-là, un énorme bolide, visible en plein jour, plongea vers l’est, en direction de la Syrie, suivi d’un violent tremblement de terre; puis Mawza et ses environs subirent un séisme « d’une violence inouïe », qui se répéta nuit et jour: des maisons se fissurèrent, des terres agricoles se fendèrent, des tombes s’effondrèrent et des puits se rejoignirent (cf. Shadharat-Dhahab, p. 490). La même année, un autre énorme bolide, survenu en pleine nuit, illumina le monde (cf. Shadharat-Dhahab, p. 490)."
  ur: "916 میں زبید نے ایک دن میں تین بار ہلایا۔ اس دوپہر کو مشرق سے شام تک ایک زبردست بولائیڈ ڈوب گیا جو دن کی روشنی میں نظر آتا ہے، اس کے بعد ایک گرجدار زلزلہ آیا۔ پھر معازہ اور اس کے انحصار کو ایک ایسے زلزلے کا سامنا کرنا پڑا جیسے کبھی سنا ہی نہ گیا ہو، رات اور دن بار بار آتے رہے - گھروں میں شگاف پڑ گئے، کھیتی باڑی ہو گئی، مقبرے منہدم ہو گئے اور کنویں ایک ساتھ بہہ گئے۔ 490}۔ اسی سال ایک اور عظیم آدھی رات کا بولڈ دیکھا جس نے دنیا کو روشن کر دیا۔ 490}۔"
  tr: "Hicri 916 yılında, Zabid şehri önce şiddetli bir depremle, sonra bir başkasıyla ve ardından üçüncüsüyle sarsıldı. Aynı gün, doğudan Levant'a doğru hareket eden büyük bir meteor düştü ve gündüz vakti görülebildi. Bunu şiddetli bir gök gürültüsüyle birlikte büyük bir sarsıntı izledi. Mawza şehri ve çevresi, daha önce hiç duyulmamış türden büyük bir depremle sarsıldı. Hem küçük hem de büyük depremler gece gündüz devam ederek bölge sakinlerine büyük zararlar verdi. Evler çatladı ve hiçbir ev hasardan kurtulamadı. Ekili alanlar yarıldı, mezarlar çöktü ve kuyular kirlendi. {cite:shadharat-dhahab s. 490}. Aynı yıl, gece yarısı bir başka büyük meteor düştü ve dünyayı aydınlattı. {cite:shadharat-dhahab s. 490}."
  id: "Pada tahun 916 Hijriah, kota Zabid dilanda gempa bumi hebat, kemudian gempa lainnya, dan kemudian gempa ketiga. Pada hari yang sama, sebuah meteor besar jatuh dari timur, bergerak menuju Levant, terlihat pada siang hari. Peristiwa itu diikuti oleh getaran hebat berupa guntur yang dahsyat. Kota Mawza dan daerah sekitarnya dilanda gempa bumi hebat yang belum pernah terjadi sebelumnya. Gempa bumi, baik kecil maupun besar, terus terjadi siang dan malam, menyebabkan kerusakan besar bagi penduduk daerah tersebut. Rumah-rumah retak, dan tidak ada rumah yang terhindar dari kerusakan. Tanah yang disiapkan untuk pertanian terbelah, kuburan runtuh, dan sumur-sumur tercemar. {cite:shadharat-dhahab hlm. 490}. Pada tahun yang sama, meteor besar lainnya jatuh pada tengah malam, menerangi dunia. {cite:shadharat-dhahab hlm. 490}."
