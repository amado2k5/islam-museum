summary:
  ar: "غلب موسى على الترمذ فخرج دهقانها وأهلها إلى الترك يستنصروهم فلم ينصروهم وقالوا لعنكم الله أتاكم رجل في مائة وأخرجكم عن مدينتكم وغلبكم عليها ثم تتأم أصحاب موسى إليه ممن كان مع أبيه وغيرهم ولم يزل صاحب الترمذ وأهلها بالترك حتى أعانوهم وأطافوا جميعاً بموسى ومن معه فبيتهم وحوى عسكرهم وأصيب من المسلمين ستة عشر رجلاً وكان ثابت وحريث ابنا قطبة الخزاعيان مع موسى فاستجاشا طرخون فأنجده فعظمت دالتهما عليه وكانا الآمرين والناهيين في عسكره فقيل له إنما لك الاسم وهذان صاحبا العسكر والأمر وخرج إليه خلق من الهياطلة والترك فغلبهم المسلمون فبلغ ذلك الحجاج فقال الحمد لله الذي نصر المنافقين على المشركين وجعل موسى من رؤوس من قاتله جوسقين عظيمين وقتل حريث بن قطبة بنشابة أصابته فقال أصحاب موسى لموسى قد أراحنا الله من حريث فارحنا من ثابت فلما استثبته لحق بحشورا واستنجد طرخون فغلب على ربض المدينة وكثرت أمداد السغد فرجع موسى إلى الترمذ فتحصن بها وأعانه أهل كش ونسف وبخارا فحصره ثابت وهو في ثمانين ألفاً ووجه موسى يزيد بن هزيل كل العزي لزياد القصير الخزاعي فأصيب فطلب الغرة فضرب على رأسه فعاش سبعة أيام ثم مات وألقى يزيد نفسه في نهر الصغانيان فنجا وبيت موسى عسكر ثابت فرجعت الأعاجم إلى بلادها وكان أهل خراسان يقولون ما رأينا مثل موسى قاتل مع أبيه سنتين لم يفل ثم أتى الترمذ فغلب عليها وهو في عدة يسيرة وأخرج ملكها ثم قاتل الترك والعجم فهزمهم."
  en: "Tirmidh's dahqan and folk went to the Turks for help — refused: 'curse you, a man in a hundred comes, expels you, takes your city'. His father's old companions joined Musa; when the Turks finally aided, surrounding him, he night-attacked and took their camp — sixteen Muslims wounded. Thabit and Hurayth ibn Qutba, backed by Tarkhun's levies, became his army's real commanders — 'yours is the name, theirs the command'. Hayatila and Turks sallied and were beaten — al-Hajjaj: 'praise God who gave the hypocrites victory over the polytheists' — and Musa built two great mounds of his foes' heads. Hurayth fell to a stray arrow; the men pressed Musa against Thabit, who fled, won Tarkhun's aid, took the rabad, and besieged him in eighty thousand as Kish, Nasaf and Bukhara reinforced Musa. Yazid ibn Huzayl, sent against Ziyad al-Qasir, took a head-blow and died in seven days — Yazid himself escaped across the Saghaniyan river — and Musa's night-raid on Thabit's camp scattered the Ajam home. Khurasan's people said: never his like — two years unbeaten with his father, Tirmidh taken with a handful, its king expelled, Turks and Ajam routed."
  es: "El dahqan y la gente de Tirmidh acudieron a los turcos en busca de ayuda, pero se la negaron: «¡Malditos seáis! Un hombre de cada cien vendrá, os expulsará y tomará vuestra ciudad». Los antiguos compañeros de su padre se unieron a Musa; cuando los turcos finalmente lo ayudaron, rodeándolo, Musa atacó de noche y tomó su campamento, hiriendo a dieciséis musulmanes. Thabit y Hurayth ibn Qutba, apoyados por las tropas de Tarkhun, se convirtieron en los verdaderos comandantes de su ejército: «El nombre es vuestro, el mando de ellos». Hayatila y los turcos salieron y fueron derrotados —al-Hajjaj: «¡Alabado sea Dios que dio la victoria a los hipócritas sobre los politeístas!»— y Musa erigió dos grandes montículos con las cabezas de sus enemigos. Hurayth cayó por una flecha perdida; los hombres presionaron a Musa contra Thabit, quien huyó, obtuvo la ayuda de Tarkhun, tomó el rabad y lo sitió con ochenta mil hombres mientras Kish, Nasaf y Bukhara reforzaban a Musa. Yazid ibn Huzayl, enviado contra Ziyad al-Qasir, recibió un golpe en la cabeza y murió a los siete días; el propio Yazid escapó cruzando el río Saghaniyan. La incursión nocturna de Musa en el campamento de Thabit dispersó el territorio de Ajam. La gente de Jorasán decía: «Nunca hubo otro igual: dos años invicto con su padre, Tirmidh tomado con un puñado de hombres, su rey expulsado, turcos y Ajam derrotados»."
  fr: "Les compagnons de Tirmidh et son peuple se rendirent auprès des Turcs pour obtenir de l'aide, mais ils refusèrent: « Maudits soient-ils ! Un homme sur cent vient vous chasser et s'empare de votre ville. » Les anciens compagnons de son père rejoignirent Moïse. Lorsque les Turcs finirent par lui venir en aide, l'encerclant, il lança une attaque nocturne et prit leur camp, blessant seize musulmans. Thabit et Hurayth ibn Qutba, appuyés par les troupes levées par Tarkhun, devinrent les véritables commandants de son armée: « Le nom est pour toi, le commandement pour eux. » Hayatila et les Turcs firent une sortie et furent vaincus – al-Hajjaj: « Loué soit Dieu qui a donné la victoire aux hypocrites sur les polythéistes » – et Moïse fit ériger deux grands tumulus avec les têtes de ses ennemis. Hurayth tomba sous une flèche perdue. Les hommes pressèrent Moussa contre Thabit, qui prit la fuite, obtint l'aide de Tarkhun, s'empara du rabad et l'assiégea avec quatre-vingt mille hommes, tandis que Kish, Nasaf et Boukhara renforçaient Moussa. Yazid ibn Huzayl, envoyé contre Ziyad al-Qasir, reçut un coup à la tête et mourut sept jours plus tard – Yazid lui-même s'échappa en traversant la rivière Saghaniyan – et le raid nocturne de Moussa sur le camp de Thabit dispersa les Ajam. Les habitants du Khorasan disaient: jamais il ne lui fut pareil – deux années sans défaite avec son père, Tirmidh capturé en un rien de temps, son roi chassé, les Turcs et les Ajam mis en déroute."
