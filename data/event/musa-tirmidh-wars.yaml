id: event/musa-tirmidh-wars
class: event
kind: war
label: { ar: "حروب موسى من الترمذ", en: "Musa's Wars from Tirmidh", es: "Las guerras de Musa de Tirmidh", fr: "Les guerres de Moussa d'après Tirmidh", ur: "ترمذی سے موسیٰ کی جنگیں", tr: "Tirmidh'den Musa'nın Savaşları", id: "Perang-perang Musa menurut Tirmidzi" }
summary:
  ar: "غلب موسى على الترمذ فخرج دهقانها وأهلها إلى الترك يستنصروهم فلم ينصروهم وقالوا لعنكم الله أتاكم رجل في مائة وأخرجكم عن مدينتكم وغلبكم عليها ثم تتأم أصحاب موسى إليه ممن كان مع أبيه وغيرهم ولم يزل صاحب الترمذ وأهلها بالترك حتى أعانوهم وأطافوا جميعاً بموسى ومن معه فبيتهم وحوى عسكرهم وأصيب من المسلمين ستة عشر رجلاً وكان ثابت وحريث ابنا قطبة الخزاعيان مع موسى فاستجاشا طرخون فأنجده فعظمت دالتهما عليه وكانا الآمرين والناهيين في عسكره فقيل له إنما لك الاسم وهذان صاحبا العسكر والأمر وخرج إليه خلق من الهياطلة والترك فغلبهم المسلمون فبلغ ذلك الحجاج فقال الحمد لله الذي نصر المنافقين على المشركين وجعل موسى من رؤوس من قاتله جوسقين عظيمين وقتل حريث بن قطبة بنشابة أصابته فقال أصحاب موسى لموسى قد أراحنا الله من حريث فارحنا من ثابت فلما استثبته لحق بحشورا واستنجد طرخون فغلب على ربض المدينة وكثرت أمداد السغد فرجع موسى إلى الترمذ فتحصن بها وأعانه أهل كش ونسف وبخارا فحصره ثابت وهو في ثمانين ألفاً ووجه موسى يزيد بن هزيل كل العزي لزياد القصير الخزاعي فأصيب فطلب الغرة فضرب على رأسه فعاش سبعة أيام ثم مات وألقى يزيد نفسه في نهر الصغانيان فنجا وبيت موسى عسكر ثابت فرجعت الأعاجم إلى بلادها وكان أهل خراسان يقولون ما رأينا مثل موسى قاتل مع أبيه سنتين لم يفل ثم أتى الترمذ فغلب عليها وهو في عدة يسيرة وأخرج ملكها ثم قاتل الترك والعجم فهزمهم."
  en: "Tirmidh's dahqan and folk went to the Turks for help — refused: 'curse you, a man in a hundred comes, expels you, takes your city'. His father's old companions joined Musa; when the Turks finally aided, surrounding him, he night-attacked and took their camp — sixteen Muslims wounded. Thabit and Hurayth ibn Qutba, backed by Tarkhun's levies, became his army's real commanders — 'yours is the name, theirs the command'. Hayatila and Turks sallied and were beaten — al-Hajjaj: 'praise God who gave the hypocrites victory over the polytheists' — and Musa built two great mounds of his foes' heads. Hurayth fell to a stray arrow; the men pressed Musa against Thabit, who fled, won Tarkhun's aid, took the rabad, and besieged him in eighty thousand as Kish, Nasaf and Bukhara reinforced Musa. Yazid ibn Huzayl, sent against Ziyad al-Qasir, took a head-blow and died in seven days — Yazid himself escaped across the Saghaniyan river — and Musa's night-raid on Thabit's camp scattered the Ajam home. Khurasan's people said: never his like — two years unbeaten with his father, Tirmidh taken with a handful, its king expelled, Turks and Ajam routed."
  es: "El dahqan y la gente de Tirmidh acudieron a los turcos en busca de ayuda, pero se la negaron: «¡Malditos seáis! Un hombre de cada cien vendrá, os expulsará y tomará vuestra ciudad». Los antiguos compañeros de su padre se unieron a Musa; cuando los turcos finalmente lo ayudaron, rodeándolo, Musa atacó de noche y tomó su campamento, hiriendo a dieciséis musulmanes. Thabit y Hurayth ibn Qutba, apoyados por las tropas de Tarkhun, se convirtieron en los verdaderos comandantes de su ejército: «El nombre es vuestro, el mando de ellos». Hayatila y los turcos salieron y fueron derrotados —al-Hajjaj: «¡Alabado sea Dios que dio la victoria a los hipócritas sobre los politeístas!»— y Musa erigió dos grandes montículos con las cabezas de sus enemigos. Hurayth cayó por una flecha perdida; los hombres presionaron a Musa contra Thabit, quien huyó, obtuvo la ayuda de Tarkhun, tomó el rabad y lo sitió con ochenta mil hombres mientras Kish, Nasaf y Bukhara reforzaban a Musa. Yazid ibn Huzayl, enviado contra Ziyad al-Qasir, recibió un golpe en la cabeza y murió a los siete días; el propio Yazid escapó cruzando el río Saghaniyan. La incursión nocturna de Musa en el campamento de Thabit dispersó el territorio de Ajam. La gente de Jorasán decía: «Nunca hubo otro igual: dos años invicto con su padre, Tirmidh tomado con un puñado de hombres, su rey expulsado, turcos y Ajam derrotados»."
  fr: "Les compagnons de Tirmidh et son peuple se rendirent auprès des Turcs pour obtenir de l'aide, mais ils refusèrent: « Maudits soient-ils ! Un homme sur cent vient vous chasser et s'empare de votre ville. » Les anciens compagnons de son père rejoignirent Moïse. Lorsque les Turcs finirent par lui venir en aide, l'encerclant, il lança une attaque nocturne et prit leur camp, blessant seize musulmans. Thabit et Hurayth ibn Qutba, appuyés par les troupes levées par Tarkhun, devinrent les véritables commandants de son armée: « Le nom est pour toi, le commandement pour eux. » Hayatila et les Turcs firent une sortie et furent vaincus – al-Hajjaj: « Loué soit Dieu qui a donné la victoire aux hypocrites sur les polythéistes » – et Moïse fit ériger deux grands tumulus avec les têtes de ses ennemis. Hurayth tomba sous une flèche perdue. Les hommes pressèrent Moussa contre Thabit, qui prit la fuite, obtint l'aide de Tarkhun, s'empara du rabad et l'assiégea avec quatre-vingt mille hommes, tandis que Kish, Nasaf et Boukhara renforçaient Moussa. Yazid ibn Huzayl, envoyé contre Ziyad al-Qasir, reçut un coup à la tête et mourut sept jours plus tard – Yazid lui-même s'échappa en traversant la rivière Saghaniyan – et le raid nocturne de Moussa sur le camp de Thabit dispersa les Ajam. Les habitants du Khorasan disaient: jamais il ne lui fut pareil – deux années sans défaite avec son père, Tirmidh capturé en un rien de temps, son roi chassé, les Turcs et les Ajam mis en déroute."
  ur: "ترمذ کے دہقان اور لوگ مدد کے لیے ترکوں کے پاس گئے - انکار کر دیا: 'تم پر لعنت ہو، سو میں ایک آدمی آتا ہے، تمہیں نکال دیتا ہے، تمہارا شہر لے لیتا ہے'۔ ان کے والد کے پرانے ساتھی موسیٰ کے ساتھ ہو گئے۔ جب آخر کار ترکوں نے مدد کی تو اس نے اسے گھیر لیا، اس نے رات کو حملہ کیا اور ان کے کیمپ پر قبضہ کر لیا - سولہ مسلمان زخمی ہوئے۔ ثابت اور ہریث بن قطبہ، جن کو ترخون کے لیویز کی حمایت حاصل تھی، اس کی فوج کے حقیقی کمانڈر بن گئے - 'نام تمہارا ہے، حکم ان کا ہے'۔ حیاتیلا اور ترکوں کو مارا پیٹا گیا - الحجاج: 'خدا کی تعریف کرو جس نے منافقوں کو مشرکوں پر فتح بخشی' - اور موسیٰ نے اپنے دشمنوں کے سروں کے دو بڑے ٹیلے بنائے۔ حُریث ایک آوارہ تیر پر گرا۔ مردوں نے ثابت کے خلاف موسیٰ پر دباؤ ڈالا، جو بھاگ گیا، ترخون کی مدد حاصل کی، رباد لے لیا، اور اسی ہزار میں اس کا محاصرہ کر لیا جیسا کہ کیش، نصف اور بخارا نے موسیٰ کو تقویت دی۔ زیاد القصیر کے خلاف بھیجے گئے یزید بن حزیل نے سر پر ضرب لگائی اور سات دنوں میں مر گیا - یزید خود دریائے صغانیان کے پار فرار ہوگیا - اور ثابت کے کیمپ پر موسیٰ کے رات کے چھاپے نے عجم کے گھر کو تتر بتر کردیا۔ خراسان کے لوگوں نے کہا: اس کی طرح کبھی نہیں - اپنے والد کے ساتھ دو سال ناقابل شکست رہے، ترمذ نے مٹھی بھر لے لیا، اس کے بادشاہ کو نکال دیا گیا، ترکوں اور عجم کو شکست دی گئی۔"
  tr: "Musa Tirmizi'yi fethetti, bunun üzerine valisi ve halkı yardım istemek için Türklere gittiler, ancak Türkler onlara yardım etmediler ve \"Allah sizi lanetlesin! Yüz adamla bir adam geldi, sizi şehrinizden kovdu ve fethetti!\" dediler. Bunun üzerine Musa'nın arkadaşları, bazıları babasının yanında olanlar, diğerleri de ona akın ettiler. Tirmizi valisi ve halkı, Türkler onlara yardım edene kadar yalvarmaya devam ettiler. Hepsi Musa ve adamlarını kuşattı, kamplarını ele geçirdi. On altı Müslüman öldürüldü. Kutube el-Huzai'nin oğulları Sabit ve Harit, Musa ile birlikteydiler ve yardım için Tarhun'a başvurdular; Tarhun da ona yardım etti. Onların Musa üzerindeki etkisi arttı ve ordusunda emir veren ve kararları alanlar onlar oldu. Ona, \"Sen sadece isme sahipsin; ordunun ve komutanın liderleri bu ikisidir\" denildi. Çok sayıda Eftalili ve Türk ona karşı çıktı, ancak Müslümanlar onları yendi. Bu haber Haccac'a ulaştı ve o, \"Münafıklara müşrikler üzerinde zafer veren ve Musa'yı onlarla savaşanların önderlerinden biri kılan Allah'a hamd olsun\" dedi. Harith ibn Qutbah, kendisine isabet eden bir okla öldürüldü. Musa'nın arkadaşları ona, \"Allah bizi Harith'ten kurtardı, öyleyse bizi Thabit'ten de kurtar\" dediler. Yakalandığını doğrulayınca Haşura'ya katıldı. Tarkhun yardım istedi ve şehrin dış mahallelerini ele geçirdi, Soğd takviyeleri arttı. Musa Termez'e döndü ve orada kendini tahkim etti; Kaş, Nasaf ve Buhara halkı ona yardım etti. Thabit, seksen bin adamla onu kuşattı. Musa, El-Azzi kabilesinin komutanı Yezid bin Hazil'i Ziyad el-Kasir el-Huzai'ye gönderdi, ancak Yezid yaralandı. Bir baskın düzenlemeye çalıştı ve başına isabet eden bir okla vuruldu. Yedi gün yaşadıktan sonra öldü. Yezid kendini Saghanian Nehri'ne attı ve kurtuldu. Musa, Sabit'in ordusunu kuşattı ve Arap olmayanlar topraklarına geri döndüler. Horasan halkı, \"Musa gibisini daha önce hiç görmedik. Babasıyla iki yıl savaştı ve yenilmedi. Sonra Termez'e geldi ve küçük bir orduyla orayı fethetti ve kralını kovdu. Ardından Türklerle ve Arap olmayanlarla savaştı ve onları yendi.\" dedi."
  id: "Musa menaklukkan Tirmidzi, sehingga gubernur dan penduduknya pergi kepada bangsa Turki untuk meminta bantuan, tetapi mereka tidak membantu dan berkata, \"Semoga Allah melaknat kalian! Seorang pria datang kepada kalian dengan seratus orang, mengusir kalian dari kota kalian, dan menaklukkannya!\" Kemudian para sahabat Musa, beberapa di antaranya pernah bersama ayahnya dan yang lainnya, berbondong-bondong mendatanginya. Gubernur Tirmidzi dan penduduknya terus memohon kepada bangsa Turki sampai mereka membantu mereka. Mereka semua mengepung Musa dan pasukannya, mengepung mereka, dan merebut perkemahan mereka. Enam belas orang Muslim terbunuh. Thabit dan Harith, putra Qutbah al-Khuza'i, bersama Musa, dan mereka meminta bantuan kepada Tarkhun, yang datang membantunya. Pengaruh mereka atas Musa semakin besar, dan merekalah yang memberi perintah dan mengambil keputusan dalam pasukannya. Dikatakan kepadanya, \"Engkau hanya memiliki nama; kedua orang ini adalah pemimpin pasukan dan komando.\" Sejumlah besar orang Heftaliyah dan Turki keluar melawannya, tetapi kaum Muslim mengalahkan mereka. Kabar ini sampai kepada al-Hajjaj, yang berkata, \"Segala puji bagi Allah yang telah memberikan kemenangan kepada kaum munafik atas kaum musyrik dan menjadikan Musa salah satu pemimpin orang-orang yang memeranginya.\" Harith bin Qutbah terbunuh oleh panah yang mengenainya. Para sahabat Musa berkata kepadanya, \"Allah telah membebaskan kita dari Harith, maka bebaskanlah kita dari Thabit.\" Setelah memastikan penangkapannya, ia bergabung dengan kaum Hasyura. Tarkhun meminta bantuan dan menaklukkan pinggiran kota, dan bala bantuan Sogdia bertambah. Musa kembali ke Termez dan membentengi dirinya di sana, dan penduduk Kash, Nasaf, dan Bukhara membantunya. Thabit mengepungnya dengan delapan puluh ribu orang. Musa mengirim Yazid bin Hazil, komandan suku Al-Azzi, kepada Ziyad Al-Qasir Al-Khuza’i, tetapi ia terluka. Ia mencoba melakukan penyerangan dan terkena pukulan di kepala. Ia hidup selama tujuh hari dan kemudian meninggal. Yazid melemparkan dirinya ke Sungai Saghania dan selamat. Musa mengepung pasukan Thabit, dan orang-orang non-Arab kembali ke tanah mereka. Penduduk Khorasan berkata, “Kami belum pernah melihat orang seperti Musa. Dia berperang bersama ayahnya selama dua tahun dan tidak pernah gagal. Kemudian dia datang ke Termez dan menaklukkannya dengan pasukan kecil dan mengusir rajanya. Kemudian dia memerangi orang-orang Turki dan orang-orang non-Arab dan mengalahkan mereka.”"
