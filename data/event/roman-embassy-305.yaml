label: { ar: "سفارة الروم وموكب المقتدر العظيم" }
summary:
  ar: "في سنة خمس قدمت رسل ملك الروم بهدايا وطلب عقد هدنة فعمل المقتدر موكباً عظيماً فأقام العساكر وصفهم بالسلاح وهم مئة وستون ألفاً من باب الشماسية إلى دار الخلافة وبعدهم الخدام وهم سبعة آلاف خادم ويليهم الحجاب وهم سبع مئة حاجب وكانت الستور التي نصبت على حيطان دار الخلافة ثمانية وثلاثين ألف ستر من الديباج والبسط اثنان وعشرون ألفاً وفي الحضرة مئة سبع في السلاسل، ووردت هدايا صاحب عمان وفيها طير أسود يتكلم بالفارسية وبالهندية أفصح من الببغاء {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  en: "In 305 a Byzantine embassy came with gifts seeking a truce; al-Muqtadir staged a great procession — a hundred and sixty thousand soldiers under arms from the Shammasiyya gate to the palace, seven thousand servants, seven hundred chamberlains, thirty-eight thousand brocade hangings on the walls, twenty-two thousand carpets, a hundred beasts in chains. That year Oman's lord sent gifts including a black bird that spoke Persian and Hindi better than a parrot {cite:tarikh-khulafa-minhaj-1434 p. 589}."
