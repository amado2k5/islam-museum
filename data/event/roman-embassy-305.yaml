label: { ar: "سفارة الروم وموكب المقتدر العظيم", en: "The Byzantine embassy and al-Muqtadir's great procession", es: "La embajada bizantina y la gran procesión de al-Muqtadir", fr: "L'ambassade byzantine et le grand cortège d'al-Muqtadir", ur: "بازنطینی سفارت خانہ اور المقتدیر کا عظیم جلوس", tr: "Roma Elçiliği ve büyük Muktadir Alayı", id: "Kedutaan Romawi dan prosesi Al-Muqtadir yang agung" }
summary:
  ar: "في سنة خمس قدمت رسل ملك الروم بهدايا وطلب عقد هدنة فعمل المقتدر موكباً عظيماً فأقام العساكر وصفهم بالسلاح وهم مئة وستون ألفاً من باب الشماسية إلى دار الخلافة وبعدهم الخدام وهم سبعة آلاف خادم ويليهم الحجاب وهم سبع مئة حاجب وكانت الستور التي نصبت على حيطان دار الخلافة ثمانية وثلاثين ألف ستر من الديباج والبسط اثنان وعشرون ألفاً وفي الحضرة مئة سبع في السلاسل، ووردت هدايا صاحب عمان وفيها طير أسود يتكلم بالفارسية وبالهندية أفصح من الببغاء {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  en: "In 305 a Byzantine embassy came with gifts seeking a truce; al-Muqtadir staged a great procession — a hundred and sixty thousand soldiers under arms from the Shammasiyya gate to the palace, seven thousand servants, seven hundred chamberlains, thirty-eight thousand brocade hangings on the walls, twenty-two thousand carpets, a hundred beasts in chains. That year Oman's lord sent gifts including a black bird that spoke Persian and Hindi better than a parrot {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  es: "En el año 305, una embajada bizantina llegó con regalos solicitando una tregua; al-Muqtadir organizó una gran procesión: ciento sesenta mil soldados armados desde la puerta de Shammasiyya hasta el palacio, siete mil sirvientes, setecientos chambelanes, treinta y ocho mil tapices de brocado en las paredes, veintidós mil alfombras y cien bestias encadenadas. Ese año, el señor de Omán envió regalos, entre ellos un pájaro negro que hablaba persa e hindi mejor que un loro {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  fr: "En 305, une ambassade byzantine arriva avec des présents pour tenter d'obtenir une trêve; al-Muqtadir organisa une grande procession: cent soixante mille soldats en armes, de la porte de Shammasiyya jusqu'au palais, sept mille serviteurs, sept cents chambellans, trente-huit mille tentures de brocart aux murs, vingt-deux mille tapis et cent bêtes enchaînées. Cette même année, le seigneur d'Oman envoya des présents, parmi lesquels un oiseau noir qui parlait persan et hindi mieux qu'un perroquet (voir: Tarikh-Khulafa-Minhaj-1434, p. 589)."
  ur: "305 میں بازنطینی سفارت خانہ جنگ بندی کے لیے تحائف لے کر آیا۔ مقتدیر نے ایک بڑا جلوس نکالا - ایک لاکھ ساٹھ ہزار سپاہی ہتھیاروں تلے شمسیہ دروازے سے محل تک، سات ہزار نوکر، سات سو ایوان، دیواروں پر اڑتیس ہزار بروکیڈ لٹکائے، بائیس ہزار قالین، ایک سو درندے زنجیروں میں جکڑے ہوئے تھے۔ اس سال عمان کے آقا نے تحفہ بھیجا جس میں ایک سیاہ پرندہ بھی تھا جو طوطے سے زیادہ فارسی اور ہندی بولتا تھا۔ 589}۔"
  tr: "Beşinci yılda, Roma Kralı'nın elçileri hediyelerle gelip ateşkes istediler. Muktadir büyük bir alay düzenledi ve Şamasiya Kapısı'ndan halifenin ikametgahına kadar yüz altmış bin asker ve silahlarını dizdi. Onların ardından yedi bin hizmetkar, ardından da yedi yüz kâhya geldi. Halifenin ikametgahının duvarlarına asılan perdeler otuz sekiz bin adet ipek kumaştan, halılar ise yirmi iki bin adetti. Huzurunda zincirlenmiş yüz yedi kişi vardı. Umman hükümdarından hediyeler geldi ve bunlar arasında Farsça ve Hintçeyi papağandan daha güzel konuşan siyah bir kuş da vardı. {cite:tarikh-khulafa-minhaj-1434 s. 589}"
  id: "Pada tahun kelima, utusan Raja Romawi datang membawa hadiah dan meminta gencatan senjata. Al-Muqtadir mengadakan prosesi besar dan mengerahkan pasukan, berjumlah seratus enam puluh ribu orang, dengan senjata, dari Gerbang Shamasiya ke kediaman Khalifah. Di belakang mereka ada para pelayan, berjumlah tujuh ribu orang, diikuti oleh para pengawal istana, berjumlah tujuh ratus orang. Tirai yang dipasang di dinding kediaman Khalifah berjumlah tiga puluh delapan ribu tirai brokat, dan karpetnya berjumlah dua puluh dua ribu. Di hadapan mereka, ada seratus tujuh orang yang dirantai. Hadiah datang dari penguasa Oman, dan di antaranya adalah seekor burung hitam yang berbicara bahasa Persia dan Hindi lebih fasih daripada burung beo. {cite:tarikh-khulafa-minhaj-1434 p. 589}."
