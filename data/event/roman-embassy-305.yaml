label: { ar: "سفارة الروم وموكب المقتدر العظيم", en: "The Byzantine embassy and al-Muqtadir's great procession", es: "La embajada bizantina y la gran procesión de al-Muqtadir", fr: "L'ambassade byzantine et le grand cortège d'al-Muqtadir" }
summary:
  ar: "في سنة خمس قدمت رسل ملك الروم بهدايا وطلب عقد هدنة فعمل المقتدر موكباً عظيماً فأقام العساكر وصفهم بالسلاح وهم مئة وستون ألفاً من باب الشماسية إلى دار الخلافة وبعدهم الخدام وهم سبعة آلاف خادم ويليهم الحجاب وهم سبع مئة حاجب وكانت الستور التي نصبت على حيطان دار الخلافة ثمانية وثلاثين ألف ستر من الديباج والبسط اثنان وعشرون ألفاً وفي الحضرة مئة سبع في السلاسل، ووردت هدايا صاحب عمان وفيها طير أسود يتكلم بالفارسية وبالهندية أفصح من الببغاء {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  en: "In 305 a Byzantine embassy came with gifts seeking a truce; al-Muqtadir staged a great procession — a hundred and sixty thousand soldiers under arms from the Shammasiyya gate to the palace, seven thousand servants, seven hundred chamberlains, thirty-eight thousand brocade hangings on the walls, twenty-two thousand carpets, a hundred beasts in chains. That year Oman's lord sent gifts including a black bird that spoke Persian and Hindi better than a parrot {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  es: "En el año 305, una embajada bizantina llegó con regalos solicitando una tregua; al-Muqtadir organizó una gran procesión: ciento sesenta mil soldados armados desde la puerta de Shammasiyya hasta el palacio, siete mil sirvientes, setecientos chambelanes, treinta y ocho mil tapices de brocado en las paredes, veintidós mil alfombras y cien bestias encadenadas. Ese año, el señor de Omán envió regalos, entre ellos un pájaro negro que hablaba persa e hindi mejor que un loro {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  fr: "En 305, une ambassade byzantine arriva avec des présents pour tenter d'obtenir une trêve; al-Muqtadir organisa une grande procession: cent soixante mille soldats en armes, de la porte de Shammasiyya jusqu'au palais, sept mille serviteurs, sept cents chambellans, trente-huit mille tentures de brocart aux murs, vingt-deux mille tapis et cent bêtes enchaînées. Cette même année, le seigneur d'Oman envoya des présents, parmi lesquels un oiseau noir qui parlait persan et hindi mieux qu'un perroquet (voir: Tarikh-Khulafa-Minhaj-1434, p. 589)."
