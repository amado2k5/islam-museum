id: event/al-hadi-christian-slave-embraces-islam-and-is-freed
class: event
kind: other
label:
  ar: عبد نصراني يعلن إسلامه عند الهادي فيُشترى من سهم الرقاب ويُعتق
  en: A slave of a Christian owner declares Islam before al-Hadi and is bought and freed from the slaves' share of zakat
  ur: ایک عیسائی کا غلام ہادی کے سامنے اسلام قبول کرتا ہے اور زکوٰۃ کے حصہ رقاب سے خرید کر آزاد کیا جاتا ہے
summary:
  ar: جاء رجل بعبد نصراني أحب الإسلام، فأمره الهادي أن يغتسل ويغسل ثيابه ثم لقنه الشهادتين، وأمر مالكه أن يستقضي الثمن بعد يوم أو يومين؛ فلما بيع العبد وأبى أن يعمل أمر الهادي بشرائه من سهم الرقاب وإعتاقه ليكون ولاؤه لجميع المسلمين.
  en: A man brought a slave of a Christian who had come to love Islam; al-Hadi told him to wash himself and his clothes, then had him say the two testimonies and told his owner to settle the price after a day or two; when the slave was resold and refused to work, al-Hadi had him bought from the slaves' share of the zakat and freed, so that his patronage belongs to all the Muslims.
  ur: ایک شخص عیسائی کے غلام کو لایا جسے اسلام پسند آ گیا تھا؛ ہادی نے اسے غسل اور کپڑے دھونے کو کہا، پھر کلمہ شہادت پڑھوایا اور اس کے مالک کو ایک دو دن بعد قیمت وصول کرنے کو کہا؛ جب غلام دوبارہ بکا اور کام سے انکار کیا تو ہادی نے اسے زکوٰۃ کے حصہ رقاب سے خریدنے اور آزاد کرنے کا حکم دیا تاکہ اس کی ولاء تمام مسلمانوں کی ہو۔
