id: event/abu-al-qasim-leads-the-friday-prayer-and-preaches-jihad-at-khiwan-286
class: event
kind: other
label:
  ar: أبو القاسم بن الهادي يؤم الجمعة في خيوان ويحثّ على الجهاد، شعبان 286هـ
  en: Abu al-Qasim ibn al-Hadi leads the Friday prayer at Khiwan and urges jihad, Sha'ban 286 AH
  fr: "Abu al-Qasim ibn al-Hadi dirige la prière du vendredi à Khiwan et exhorte au jihad, sha'ban 286 de l’hégire"
  ur: ابو القاسم بن ہادی خیوان میں جمعہ پڑھاتے ہیں اور جہاد کی ترغیب دیتے ہیں، شعبان 286ھ
  es: "Abu al-Qasim ibn al-Hadi dirige la oración del viernes en Khiwan e insta a la yihad, Sha'ban 286 AH."
  tr: "Ebu el-Kâsim ibn el-Hadi, Hicri 286 Şaban ayında Hayvan'da Cuma namazına imamlık yaparak cihat çağrısında bulundu."
  id: "Abu al-Qasim ibn al-Hadi memimpin salat Jumat di Khaywan dan menyerukan jihad, Sya'ban 286 H."
summary:
  ar: بعد قتال النصف من شعبان أمر الهادي يوم الجمعة ابنه أبا القاسم أن يصلي بالناس، فحمد الله وأثنى عليه وذكر النبي، وذكر في خطبته الجهاد في سبيل الله ورغّب الناس فيه وحضهم عليه وذكر فضل القائم به وما وعد الله من قام معه، فانتفع الناس بكلامه كما يقول الراوي، ثم صلى وعاد إلى منزله.
  en: On the Friday after the fighting of the middle of Sha'ban al-Hadi told his son Abu al-Qasim to lead the people in prayer; he praised God, mentioned the Prophet, and in his address spoke of jihad in God's way, urged and encouraged the people to it and spoke of the merit of those who undertake it and of what God promised those who stand with him; the narrator says hearts were humbled and the people benefited, and Abu al-Qasim prayed and went home.
  fr: "Le vendredi suivant les combats du milieu de sha'ban, al-Hadi dit à son fils Abu al-Qasim de diriger la prière ; celui-ci loua Dieu, évoqua le Prophète et parla dans son sermon du jihad dans la voie de Dieu, y exhortant et encourageant les gens et évoquant le mérite de ceux qui l’entreprennent et les promesses de Dieu à ceux qui se tiennent à ses côtés. Selon le narrateur, les cœurs s’humilièrent et les gens en tirèrent profit ; Abu al-Qasim pria puis rentra chez lui."
  ur: نصف شعبان کی لڑائی کے بعد جمعے کے دن ہادی نے اپنے بیٹے ابو القاسم کو حکم دیا کہ لوگوں کو نماز پڑھائیں؛ انہوں نے اللہ کی حمد و ثنا کی، نبی کا ذکر کیا، اور خطبے میں اللہ کی راہ میں جہاد کا ذکر کیا، لوگوں کو اس کی ترغیب اور تحریص دی، اس کے قائم کرنے والے کی فضیلت اور اللہ نے جو اس کے ساتھ کھڑے ہونے والوں سے وعدہ کیا اس کا ذکر کیا؛ راوی کہتا ہے کہ دل نرم ہوئے اور لوگوں نے ان کے کلام سے فائدہ اٹھایا، پھر انہوں نے نماز پڑھائی اور گھر لوٹے۔
  es: "El viernes siguiente a los combates de mediados de Sha'ban al-Hadi, Abu al-Qasim le pidió a su hijo que dirigiera la oración del pueblo. Alabó a Dios, mencionó al Profeta y, en su discurso, habló de la yihad en el camino de Dios, exhortó y animó al pueblo a participar en ella, y habló del mérito de quienes la emprenden y de lo que Dios prometió a quienes lo apoyan. El narrador dice que los corazones se conmovieron y el pueblo se benefició, y Abu al-Qasim oró y regresó a casa."
  tr: "Şaban ayının ortasındaki çatışmalardan sonra, Cuma günü Hadi, oğlu Ebu el-Kasım'a insanlara namaz kıldırmasını emretti. Allah'ı övdü ve yüceltti, Peygamber'den bahsetti ve hutbesinde Allah yolunda cihattan bahsetti, insanları buna teşvik etti ve bunu yapanın faziletini ve Allah'ın onunla birlikte olanlara vaat ettiklerini anlattı. Rivayet edenin dediği gibi, insanlar onun sözlerinden faydalandılar, sonra namaz kıldı ve evine döndü."
  id: "Setelah pertempuran pertengahan bulan Sya'ban, pada hari Jumat al-Hadi memerintahkan putranya, Abu al-Qasim, untuk memimpin salat berjamaah. Ia memuji dan mengagungkan Allah serta menyebut nama Nabi, dan dalam khutbahnya ia menyebutkan jihad di jalan Allah dan mendorong orang-orang untuk melakukannya serta mendesak mereka untuk melakukannya dan menyebutkan keutamaan orang yang melakukannya dan apa yang Allah janjikan kepada mereka yang berdiri di sisi-Nya. Orang-orang mendapat manfaat dari kata-katanya, sebagaimana yang diceritakan oleh perawi, kemudian ia salat dan kembali ke rumahnya."
