id: event/abu-al-qasim-leads-the-friday-prayer-and-preaches-jihad-at-khiwan-286
class: event
kind: other
label:
  ar: أبو القاسم بن الهادي يؤم الجمعة في خيوان ويحثّ على الجهاد، شعبان 286هـ
  en: Abu al-Qasim ibn al-Hadi leads the Friday prayer at Khiwan and urges jihad, Sha'ban 286 AH
  ur: ابو القاسم بن ہادی خیوان میں جمعہ پڑھاتے ہیں اور جہاد کی ترغیب دیتے ہیں، شعبان 286ھ
summary:
  ar: بعد قتال النصف من شعبان أمر الهادي يوم الجمعة ابنه أبا القاسم أن يصلي بالناس، فحمد الله وأثنى عليه وذكر النبي، وذكر في خطبته الجهاد في سبيل الله ورغّب الناس فيه وحضهم عليه وذكر فضل القائم به وما وعد الله من قام معه، فانتفع الناس بكلامه كما يقول الراوي، ثم صلى وعاد إلى منزله.
  en: On the Friday after the fighting of the middle of Sha'ban al-Hadi told his son Abu al-Qasim to lead the people in prayer; he praised God, mentioned the Prophet, and in his address spoke of jihad in God's way, urged and encouraged the people to it and spoke of the merit of those who undertake it and of what God promised those who stand with him; the narrator says hearts were humbled and the people benefited, and Abu al-Qasim prayed and went home.
  ur: نصف شعبان کی لڑائی کے بعد جمعے کے دن ہادی نے اپنے بیٹے ابو القاسم کو حکم دیا کہ لوگوں کو نماز پڑھائیں؛ انہوں نے اللہ کی حمد و ثنا کی، نبی کا ذکر کیا، اور خطبے میں اللہ کی راہ میں جہاد کا ذکر کیا، لوگوں کو اس کی ترغیب اور تحریص دی، اس کے قائم کرنے والے کی فضیلت اور اللہ نے جو اس کے ساتھ کھڑے ہونے والوں سے وعدہ کیا اس کا ذکر کیا؛ راوی کہتا ہے کہ دل نرم ہوئے اور لوگوں نے ان کے کلام سے فائدہ اٹھایا، پھر انہوں نے نماز پڑھائی اور گھر لوٹے۔
