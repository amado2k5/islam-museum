id: "event/qarmatians-take-zabid-in-safar-297-ah-and-hold-it-for-seven-days"
class: event
kind: other
label:
  ar: "يستبيح القرامطة زبيد في صفر سنة 297هـ ويقيمون بها سبعة أيام، ص394"
  en: "The Qarmatians take Zabid in Safar 297 AH and hold it for seven days, p. 394"
  ur: "قرامطہ صفر 297ھ میں زبید پر قبضہ کرتے ہیں اور سات دن قیام کرتے ہیں، ص394"
  es: "Los cármatas toman Zabid en Safar 297 AH y lo mantienen durante siete días, pág. 394."
  fr: "Les Qarmates prennent Zabid en Safar 297 AH et la tiennent pendant sept jours, p. 394"
  tr: "Karmatiler Hicri 297 yılının Safar ayında Zabid'i işgal ettiler ve yedi gün orada kaldılar (s. 394)."
  id: "Suku Qarmatian menginvasi Zabid pada bulan Safar tahun 297 H dan menetap di sana selama tujuh hari, hlm. 394."
summary:
  ar: "في صفر سنة 297هـ ينهض القرمطي وابن ذي الطوق من المذيخرة إلى زبيد، فيهزمون ابن حاج ويستبيحون زبيد، ويقيمون بها سبعة أيام، ثم يعودون إلى المذيخرة."
  en: "In Safar 297 AH the Qarmatian and Ibn Dhi al-Tawq march from al-Mudhaykhira on Zabid, defeat Ibn Hajjaj, sack the city and hold it for seven days before returning to al-Mudhaykhira."
  ur: "صفر 297ھ میں قرمطی اور ابن ذی الطوق المذیخرہ سے زبید کی طرف بڑھتے ہیں، ابن حاج کو شکست دیتے ہیں، شہر کو تاراج کرتے ہیں اور سات دن قیام کے بعد المذیخرہ واپس جاتے ہیں۔"
  es: "En Safar 297 AH, Qarmatian e Ibn Dhi al-Tawq marchan desde al-Mudhaykhira hacia Zabid, derrotan a Ibn Hajjaj, saquean la ciudad y la mantienen durante siete días antes de regresar a al-Mudhaykhira."
  fr: "À Safar 297 AH, le Qarmate et Ibn Dhi al-Tawq marchent d'al-Mudhaykhira sur Zabid, battent Ibn Hajjaj, mettent la ville à sac et la tiennent pendant sept jours avant de retourner à al-Mudhaykhira."
  tr: "Hicri 297 yılının Safer ayında Karmati ve İbn Zı el-Tawq, el-Mudhaykhirah'tan Zabid'e doğru yola çıktılar, İbn Hajj'ı yenerek Zabid'i rehin aldılar. Yedi gün orada kaldıktan sonra el-Mudhaykhirah'a geri döndüler."
  id: "Pada bulan Safar tahun 297 Hijriah, Qarmati dan Ibn Dhi al-Tawq berangkat dari al-Mudhaykhirah ke Zabid, mengalahkan Ibn Hajj dan menyandera Zabid. Mereka tinggal di sana selama tujuh hari, kemudian kembali ke al-Mudhaykhirah."
