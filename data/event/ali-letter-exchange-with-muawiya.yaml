id: event/ali-letter-exchange-with-muawiya
class: event
kind: other
label: { ar: "رسائل علي ومعاوية بعد الجمل", en: "Letters between Ali and Muawiya after the Camel", es: "Cartas entre Ali y Muawiya después de la batalla del camello.", fr: "Lettres échangées entre Ali et Muawiya après l'épisode du chameau", ur: "اونٹ کے بعد علی اور معاویہ کے درمیان خطوط", tr: "Deve Savaşı'ndan sonra Ali ve Muaviye'nin mektupları", id: "Surat-surat Ali dan Muawiyah setelah Perang Unta" }
summary:
  ar: "بعد وقعة الجمل كتب علي إلى معاوية يدعوه إلى الدخول فيما دخل فيه المسلمين، ويعرض أن الشورى للمهاجرين والأنصار، ويقول إن طلحة والزبير نكثا بيعته {cite:abqariyyat-ali-aqqad p.77}. فرد معاوية بأنه لا يبايع حتى يُدفع إليه قتلة عثمان، وأنكر على علي أن يعدّ بيعة المدينة ملزمة لأهل الشام {cite:abqariyyat-ali-aqqad p.78}. ويرى العقاد أن الرسائل تفتح باباً بعد باب، فلا يُغلق باب إلا بقي ما وراءه، وأن الحجج بطلت حين قال كل طرف غير ما في صدره {cite:abqariyyat-ali-aqqad p.78}."
  en: "After the Camel, Ali wrote to Muawiya urging him to enter the community's allegiance, noting that the consultation belonged to the Emigrants and Helpers and that Talha and Zubayr had broken their pledge {cite:abqariyyat-ali-aqqad p.77}. Muawiya replied that he would not pledge until Uthman's killers were handed over, and disputed that the Medinan pledge bound the people of Syria {cite:abqariyyat-ali-aqqad p.78}. Al-Aqqad sees each closed door opening onto another, so that the letters ended without an agreement {cite:abqariyyat-ali-aqqad p.78}."
  es: "Tras el incidente del Camello, Ali escribió a Muawiya instándolo a unirse a la comunidad, señalando que la consulta correspondía a los Emigrantes y Ayudantes y que Talha y Zubayr habían roto su promesa {cite:abqariyyat-ali-aqqad p.77}. Muawiya respondió que no se comprometería hasta que los asesinos de Uthman fueran entregados, y cuestionó que la promesa de Medina vinculara al pueblo de Siria {cite:abqariyyat-ali-aqqad p.78}. Al-Aqqad ve cómo cada puerta cerrada se abre a otra, de modo que las cartas terminaron sin acuerdo {cite:abqariyyat-ali-aqqad p.78}."
  fr: "Après l'épisode du Chameau, Ali écrivit à Muawiya pour l'exhorter à prêter allégeance à la communauté, soulignant que la consultation appartenait aux Émigrants et aux Auxiliaires et que Talha et Zubayr avaient rompu leur serment (voir Abqariyyat-Ali-Aqqad, p. 77). Muawiya répondit qu'il ne prêterait allégeance qu'une fois les assassins d'Uthman livrés et contesta que le serment médinois engageât le peuple de Syrie (voir Abqariyyat-Ali-Aqqad, p. 78). Al-Aqqad voit en chaque porte fermée une autre, de sorte que les lettres s'achevèrent sans accord (voir Abqariyyat-Ali-Aqqad, p. 78)."
  ur: "اونٹ کے بعد، علی نے معاویہ کو خط لکھا جس میں اسے برادری کی بیعت میں شامل ہونے کی تاکید کی گئی، یہ نوٹ کرتے ہوئے کہ یہ مشاورت مہاجرین اور مددگاروں کی تھی اور طلحہ اور زبیر نے اپنا عہد توڑ دیا تھا معاویہ نے جواب دیا کہ وہ اس وقت تک عہد نہیں کریں گے جب تک کہ عثمان کے قاتلوں کے حوالے نہ کر دیا جائے، اور اس بات پر اختلاف کیا کہ مدینے کے عہد نے اہل شام کو پابند کیا تھا {حوالہ: عبقریۃ علی عقد ص78}۔ العقاد ہر بند دروازے کو دوسرے پر کھلتے ہوئے دیکھتا ہے، تاکہ خطوط بغیر کسی معاہدے کے ختم ہو جائیں"
  tr: "Deve Muharebesi'nden sonra Ali, Muaviye'ye Müslümanların davasına katılmaya davet eden bir mektup yazdı ve Şura'nın Muhacirler ve Ensar için olması gerektiğini, Talha ve Zubeyr'in kendisine olan biat yeminlerini bozduklarını belirtti. {Abkariyyat-ali-akkad, s. 77}. Muaviye ise Osman'ın katilleri kendisine teslim edilene kadar biat etmeyeceğini ve Ali'nin Medine'deki biat yemininin Suriye halkı için bağlayıcı olduğu iddiasına itiraz etti. {Abkariyyat-ali-akkad, s. 78}. El-Akkad, bu mektupların birbiri ardına kapılar açtığına, hiçbir kapının ardında bir şey kalmadan kapanmadığına ve her iki tarafın da kalbindekinden farklı şeyler söylediğinde tartışmaların geçersiz hale geldiğine inanmaktadır. {Abkariyyat-ali-akkad, s. 78}"
  id: "Setelah Perang Unta, Ali menulis surat kepada Mu'awiya, mengundangnya untuk bergabung dengan kaum Muslimin dalam perjuangan mereka, mengusulkan agar majelis (Shura) dibentuk untuk kaum Muhajirin dan Ansar, dan menyatakan bahwa Talha dan Zubayr telah melanggar sumpah setia mereka kepadanya {cite:abqariyyat-ali-aqqad p.77}. Mu'awiya menjawab bahwa ia tidak akan berjanji setia sampai para pembunuh Utsman diserahkan kepadanya, dan ia keberatan dengan pernyataan Ali bahwa sumpah setia di Madinah mengikat penduduk Suriah {cite:abqariyyat-ali-aqqad p.78}. Al-Aqqad percaya bahwa surat-surat ini membuka satu pintu demi pintu, dan tidak ada pintu yang tertutup tanpa meninggalkan sesuatu di baliknya, dan bahwa argumen menjadi tidak valid ketika masing-masing pihak mengatakan sesuatu yang berbeda dari apa yang ada di dalam hati mereka {cite:abqariyyat-ali-aqqad p.78}."
