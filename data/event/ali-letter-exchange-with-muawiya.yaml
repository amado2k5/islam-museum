id: event/ali-letter-exchange-with-muawiya
class: event
kind: other
label: { ar: "رسائل علي ومعاوية بعد الجمل", en: "Letters between Ali and Muawiya after the Camel" }
summary:
  ar: "بعد وقعة الجمل كتب علي إلى معاوية يدعوه إلى الدخول فيما دخل فيه المسلمين، ويعرض أن الشورى للمهاجرين والأنصار، ويقول إن طلحة والزبير نكثا بيعته {cite:abqariyyat-ali-aqqad p.77}. فرد معاوية بأنه لا يبايع حتى يُدفع إليه قتلة عثمان، وأنكر على علي أن يعدّ بيعة المدينة ملزمة لأهل الشام {cite:abqariyyat-ali-aqqad p.78}. ويرى العقاد أن الرسائل تفتح باباً بعد باب، فلا يُغلق باب إلا بقي ما وراءه، وأن الحجج بطلت حين قال كل طرف غير ما في صدره {cite:abqariyyat-ali-aqqad p.78}."
  en: "After the Camel, Ali wrote to Muawiya urging him to enter the community's allegiance, noting that the consultation belonged to the Emigrants and Helpers and that Talha and Zubayr had broken their pledge {cite:abqariyyat-ali-aqqad p.77}. Muawiya replied that he would not pledge until Uthman's killers were handed over, and disputed that the Medinan pledge bound the people of Syria {cite:abqariyyat-ali-aqqad p.78}. Al-Aqqad sees each closed door opening onto another, so that the letters ended without an agreement {cite:abqariyyat-ali-aqqad p.78}."
