label: { ar: "وفاة المهدي عبيد الله صاحب المغرب" }
summary:
  ar: "في أيام الراضي مات المهدي صاحب المغرب وكانت أيامه خمساً وعشرين سنة وهو جد خلفاء المصريين الذين يسمونهم الجهلة بالفاطميين، ونقل السيوطي عن من انتقده أن المهدي ادعى أنه علوي وأن القاضي أبا بكر الباقلاني قال إنه علوي ولم يعرفه أحد من علماء النسب وأنه أعدم العلماء والفقهاء ليتمكن من إغواء الخلق، وقام بالأمر بعد موته ابنه القائم بأمر الله أبو القاسم محمد {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  en: "Under al-Radi died the Maghreb's Mahdi after a reign of twenty-five years — grandfather of the Egyptian caliphs called Fatimids. Suyuti relays hostile reports: that he claimed Alid descent with al-Baqillani quoted as saying no genealogist knew it, and that he executed scholars; his son al-Qa'im bi-Amr Allah succeeded him {cite:tarikh-khulafa-minhaj-1434 p. 603}."
