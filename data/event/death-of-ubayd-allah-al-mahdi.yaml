label: { ar: "وفاة المهدي عبيد الله صاحب المغرب", en: "Death of al-Mahdi Ubayd Allah, ruler of the Maghrib", es: "Muerte de al-Mahdi Ubayd Allah, gobernante del Magreb", fr: "Mort d'al-Mahdi Ubayd Allah, souverain du Maghreb", ur: "المغرب کے حکمران المہدی عبید اللہ کی وفات", tr: "Fas hükümdarı El-Mehdi Ubeyd Allah'ın ölümü", id: "Kematian Al-Mahdi Ubayd Allah, penguasa Maroko" }
summary:
  ar: "في أيام الراضي مات المهدي صاحب المغرب وكانت أيامه خمساً وعشرين سنة وهو جد خلفاء المصريين الذين يسمونهم الجهلة بالفاطميين، ونقل السيوطي عن من انتقده أن المهدي ادعى أنه علوي وأن القاضي أبا بكر الباقلاني قال إنه علوي ولم يعرفه أحد من علماء النسب وأنه أعدم العلماء والفقهاء ليتمكن من إغواء الخلق، وقام بالأمر بعد موته ابنه القائم بأمر الله أبو القاسم محمد {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  en: "Under al-Radi died the Maghreb's Mahdi after a reign of twenty-five years — grandfather of the Egyptian caliphs called Fatimids. Suyuti relays hostile reports: that he claimed Alid descent with al-Baqillani quoted as saying no genealogist knew it, and that he executed scholars; his son al-Qa'im bi-Amr Allah succeeded him {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  es: "Bajo el reinado de al-Radi murió el Mahdi del Magreb tras veinticinco años de gobierno; abuelo de los califas egipcios llamados fatimíes. Suyuti relata informes hostiles: que afirmaba descender de los alíes, según cita al-Baqillani, quien afirmaba que ningún genealogista lo sabía, y que ejecutaba a eruditos; su hijo al-Qa'im bi-Amr Allah le sucedió {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  fr: "Sous le règne d'al-Radi mourut le Mahdi du Maghreb après vingt-cinq ans de règne – grand-père des califes égyptiens fatimides. Suyuti rapporte des témoignages hostiles: al-Radi aurait revendiqué une descendance alide, al-Baqillani affirmant qu'aucun généalogiste ne le savait, et il aurait fait exécuter des érudits; son fils al-Qa'im bi-Amr Allah lui succéda (voir: Tarikh-Khulafa-Minhaj-1434, p. 603)."
  ur: "الرادی کے تحت پچیس سال کے دور حکومت کے بعد مغرب کے مہدی کا انتقال ہوا - مصری خلفاء کے دادا جنہیں فاطمی کہتے ہیں۔ سیوطی نے مخالفانہ رپورٹیں پیش کیں: کہ اس نے دعویٰ کیا کہ علید نزول البقیلانی کے ساتھ نقل کیا ہے کہ کوئی نسبی ماہر اسے نہیں جانتا تھا، اور اس نے علماء کو قتل کیا تھا۔ ان کا بیٹا القائم بن عمرو اللہ ان کا جانشین بنا۔ 603}۔"
  tr: "Al-Radi döneminde Mağrip hükümdarı Al-Mehdi vefat etti. Saltanatı yirmi beş yıl sürdü. Cahillerin Fatimiler olarak adlandırdığı Mısır halifelerinin dedesiydi. Al-Suyuti, onu eleştirenlerden Al-Mehdi'nin Alevi olduğunu iddia ettiğini, Kadı Ebu Bekir Al-Bakilani'nin de Alevi olduğunu söylediğini, soyağacı bilginlerinden hiçbirinin onu tanımadığını ve halkı yanıltmak için alimleri ve hukukçuları idam ettirdiğini aktardı. Ölümünden sonra oğlu Al-Kaim bi-Amr Allah Ebu Al-Kâsim Muhammed yönetimi devraldı. {cite:tarikh-khulafa-minhaj-1434 s. 603}"
  id: "Pada masa pemerintahan Al-Radi, Al-Mahdi, penguasa Maghreb, meninggal dunia. Masa pemerintahannya berlangsung selama dua puluh lima tahun. Ia adalah kakek dari para khalifah Mesir, yang oleh orang-orang yang tidak tahu disebut Fatimiyah. Al-Suyuti mengutip dari mereka yang mengkritiknya bahwa Al-Mahdi mengaku sebagai seorang Alawiyah, dan bahwa Hakim Abu Bakr Al-Baqilani mengatakan bahwa ia adalah seorang Alawiyah, dan bahwa tidak seorang pun di antara para ahli silsilah mengenalnya, dan bahwa ia mengeksekusi para ulama dan ahli hukum agar dapat menyesatkan orang-orang. Setelah kematiannya, putranya, Al-Qaim bi-Amr Allah Abu Al-Qasim Muhammad, mengambil alih masalah tersebut. {cite:tarikh-khulafa-minhaj-1434 p. 603}."
