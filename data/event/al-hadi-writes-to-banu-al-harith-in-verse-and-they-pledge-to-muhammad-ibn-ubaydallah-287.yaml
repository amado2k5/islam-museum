id: event/al-hadi-writes-to-banu-al-harith-in-verse-and-they-pledge-to-muhammad-ibn-ubaydallah-287
class: event
kind: other
label:
  ar: "الهادي يكتب إلى بني الحارث ببيتين من الشعر فيحلفون لمحمد بن عبيد الله، 287هـ"
  en: "Al-Hadi writes to Banu al-Harith with verses and they pledge to Muhammad ibn Ubaydallah, 287 AH"
  ur: "ہادی کا بنو حارث کو اشعار کے ساتھ خط اور ان کا محمد بن عبید اللہ سے حلف، 287ھ"
summary:
  ar: "يكتب الهادي إلى محمد بن عبيد الله يأمره بالشدة على بني الحارث، ويكتب إلى بني الحارث كتاباً غليظاً يختمه بأبيات يفتخر فيها بنسبه ويعرض الأمان على من وفى بعهده ويتوعد من لم يفِ، فيخاف بنو الحارث ويأتون أبا جعفر ويحلفون على السمع والطاعة ويضمنون أحداث باديتهم."
  en: "Al-Hadi writes to Muhammad ibn Ubaydallah to be firm with Banu al-Harith and sends them a stern letter ending in verses in which he states his descent, offers safety to those who keep their covenant and warns of war for those who do not; Banu al-Harith take fright, come to Abu Jafar, swear hearing and obedience and guarantee the youths of their desert."
  ur: "ہادی محمد بن عبید اللہ کو بنو حارث پر سختی کا حکم لکھتے ہیں اور بنو حارث کو ایک سخت خط بھیجتے ہیں جس کے آخر میں اشعار ہیں جن میں وہ اپنے نسب کا ذکر کرتے، عہد نبھانے والوں کو امان کی پیشکش اور نہ نبھانے والوں کو جنگ کی تنبیہ کرتے ہیں؛ بنو حارث ڈر کر ابو جعفر کے پاس آتے ہیں، سمع و طاعت کا حلف دیتے ہیں اور اپنے صحرا کے نوجوانوں کی ضمانت دیتے ہیں۔"
