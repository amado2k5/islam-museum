id: event/al-hadi-writes-to-banu-al-harith-in-verse-and-they-pledge-to-muhammad-ibn-ubaydallah-287
class: event
kind: other
label:
  ar: "الهادي يكتب إلى بني الحارث ببيتين من الشعر فيحلفون لمحمد بن عبيد الله، 287هـ"
  en: "Al-Hadi writes to Banu al-Harith with verses and they pledge to Muhammad ibn Ubaydallah, 287 AH"
  ur: "ہادی کا بنو حارث کو اشعار کے ساتھ خط اور ان کا محمد بن عبید اللہ سے حلف، 287ھ"
  es: "Al-Hadi escribe a Banu al-Harith con versículos y ellos juran lealtad a Muhammad ibn Ubaydallah, 287 AH."
  fr: "Al-Hadi écrit aux Banu al-Harith avec des versets et ils prêtent allégeance à Muhammad ibn Ubaydallah, 287 AH"
  tr: "El-Hadi, Beni el-Harith'e iki mısralık şiirle mektup yazdı ve onlar da Muhammed ibn Ubeydullah'a biat ettiler (Hicri 287)."
  id: "Al-Hadi menulis kepada Bani al-Harith dengan dua bait puisi, dan mereka bersumpah setia kepada Muhammad bin Ubayd Allah, 287 H."
summary:
  ar: "يكتب الهادي إلى محمد بن عبيد الله يأمره بالشدة على بني الحارث، ويكتب إلى بني الحارث كتاباً غليظاً يختمه بأبيات يفتخر فيها بنسبه ويعرض الأمان على من وفى بعهده ويتوعد من لم يفِ، فيخاف بنو الحارث ويأتون أبا جعفر ويحلفون على السمع والطاعة ويضمنون أحداث باديتهم."
  en: "Al-Hadi writes to Muhammad ibn Ubaydallah to be firm with Banu al-Harith and sends them a stern letter ending in verses in which he states his descent, offers safety to those who keep their covenant and warns of war for those who do not; Banu al-Harith take fright, come to Abu Jafar, swear hearing and obedience and guarantee the youths of their desert."
  ur: "ہادی محمد بن عبید اللہ کو بنو حارث پر سختی کا حکم لکھتے ہیں اور بنو حارث کو ایک سخت خط بھیجتے ہیں جس کے آخر میں اشعار ہیں جن میں وہ اپنے نسب کا ذکر کرتے، عہد نبھانے والوں کو امان کی پیشکش اور نہ نبھانے والوں کو جنگ کی تنبیہ کرتے ہیں؛ بنو حارث ڈر کر ابو جعفر کے پاس آتے ہیں، سمع و طاعت کا حلف دیتے ہیں اور اپنے صحرا کے نوجوانوں کی ضمانت دیتے ہیں۔"
  es: "Al-Hadi escribe a Muhammad ibn Ubaydallah para que sea firme con los Banu al-Harith y les envía una carta severa que termina en versículos en los que declara su descendencia, ofrece seguridad a quienes cumplen su pacto y advierte de la guerra a quienes no lo hacen; los Banu al-Harith se asustan, acuden a Abu Jafar, juran escuchar y obedecer y garantizan a los jóvenes su desierto."
  fr: "Al-Hadi écrit à Muhammad ibn Ubaydallah pour qu'il soit ferme avec les Banu al-Harith et leur envoie une lettre sévère se terminant par des versets dans lesquels il déclare sa descendance, offre la sécurité à ceux qui respectent leur engagement et avertit de la guerre ceux qui ne le font pas; les Banu al-Harith, effrayés, viennent auprès d'Abu Jafar, jurent fidélité et obéissance et garantissent aux jeunes de leur sort."
  tr: "El-Hadi, Muhammed ibn Ubeydullah'a, Beni el-Harith'e karşı sert davranmasını emreden bir mektup yazar. Beni el-Harith'e sert bir mektup yazar ve mektubunu, soyundan övündüğü, sözünü tutanlara güvenlik vaat ettiği ve tutmayanları tehdit ettiği ayetlerle bitirir. Beni el-Harith korkar ve Ebu Cafer'in yanına gelir, onu dinleyeceklerine, itaat edeceklerine ve çöldeki olayların gerçekleşeceğine dair yemin ederler."
  id: "Al-Hadi menulis surat kepada Muhammad ibn Ubayd Allah, memerintahkannya untuk bersikap keras terhadap Bani al-Harith. Ia menulis surat yang keras kepada Bani al-Harith, mengakhirinya dengan ayat-ayat yang berisi kebanggaan akan garis keturunannya dan menawarkan keselamatan kepada siapa pun yang menepati janjinya serta mengancam siapa pun yang tidak menepatinya. Bani al-Harith menjadi takut dan datang kepada Abu Ja'far, bersumpah untuk mendengarkan, menaati, dan menjamin peristiwa di padang pasir mereka."
