id: event/al-hadi-has-the-people-of-the-fort-make-room-for-his-men-before-adha-286
class: event
kind: other
label:
  ar: إخلاء أهل الحصن منازلهم لجند الهادي قبل الأضحى بيوم، ذو الحجة 286هـ
  en: The people of the fort empty their houses for al-Hadi's men the day before Adha, Dhu al-Hijja 286 AH
  ur: عید الاضحیٰ سے ایک دن پہلے قلعے والوں کا ہادی کے لشکر کے لیے گھر خالی کرنا، ذوالحجہ 286ھ
summary:
  ar: يشكو جند الهادي كثرة الركوب والتعب إليه قبل الأضحى بيوم، فيأمر أهل الحصن أن يوسعوا لهم، فيخلون منازلهم ويجعلون حرمهم في بيوت الشعر، وتستريح دواب الهادي أياماً.
  en: On the day before Adha al-Hadi's men complain to him of the long riding and the strain on them and their beasts; he orders the people of the fort to make room, they empty their houses and put their women in hair tents, and his animals rest some days.
  ur: عید الاضحیٰ سے ایک دن پہلے ہادی کے ساتھی کثرتِ سواری اور اپنی اور اپنے جانوروں کی تھکن کی شکایت کرتے ہیں؛ وہ قلعے والوں کو جگہ دینے کا حکم دیتے ہیں، وہ اپنے گھر خالی کر کے خواتین کو بالوں کے خیموں میں رکھتے ہیں اور ہادی کے جانور کچھ دن آرام کرتے ہیں۔
