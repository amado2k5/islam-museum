id: event/al-dhahabi-blindness-743
class: event
kind: other
label:
  ar: "الذهبي يفقد بصره تدريجاً، ٧٤٣هـ"
  en: "Al-Dhahabi gradually loses his sight, 743/1342"
  ur: "ذہبی کی بینائی بتدریج ختم ہوئی، 743ھ/1342ء"
  es: "Al-Dhahabi pierde gradualmente la vista, 743/1342"
  fr: "Al-Dhahabi perd progressivement la vue, 743/1342"
  tr: "El-Dhahabi, Hicri 743 yılında yavaş yavaş görme yetisini kaybetti."
  id: "Al-Dhahabi secara bertahap kehilangan penglihatannya pada tahun 743 Hijriah."
summary:
  ar: "نزل ببصر الذهبي ماءٌ فأخذ يعرفه ويضعف قليلاً قليلاً حتى تكامل عدمه، وكان يغضب إذا قيل له لو قدحت عينك لأبصرت لأنه لم يكن ماءً يُقدَح {cite:durar-kamina-jil-1993 3/338}؛ وذكرت دائرة المعارف عن أبي الفداء وعمر بن الوردي أن العمى أصابه سنة ٧٤٣هـ، وعند غيرهما سنة ٧٤١هـ {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}، فظل مع ذلك يشتغل بالعلم ليل نهار ويصنّف."
  en: "A film settled over al-Dhahabi's eyes: he would recognise it, and the sight weakened little by little until it was wholly gone, and he grew angry when told 'if your eye were needled you would see', for it was not a needlable cataract {cite:durar-kamina-jil-1993 3/338}. The Encyclopaedia of Islam, after Abu al-Fida and Umar ibn al-Wardi, dates the blindness to 743, or by others to 741 {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}; even so he kept at his studies night and day and kept composing."
  ur: "ذہبی کی آنکھوں پر پردہ چڑھا جو پہلے پہچان لیتا تھا اور بینائی آہستہ آہستہ کم ہوتی گئی یہاں تک کہ بالکل ختم ہو گئی؛ جب کہا جاتا کہ آنکھ کا قدح کرواؤ تو تم دیکھ لو گے تو وہ ناراض ہوتے کیونکہ یہ قدح کرنے والا موتیا نہیں تھا {cite:durar-kamina-jil-1993 3/338}۔ دائرۃ المعارف ابو الفدا اور عمر بن الوردی کے حوالے سے نابینائی کو 743ھ، اور بعض کے نزدیک 741ھ لکھتی ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}؛ اس کے باوجود وہ دن رات علم میں مشغول اور تصنیف جاری رکھے رہے۔"
  es: "Una película cubrió los ojos de al-Dhahabi: él la reconocería, y la vista se fue debilitando poco a poco hasta desaparecer por completo, y se enfureció cuando le dijeron \"si te pincharan el ojo, verías\", pues no se trataba de una catarata que requiriera tratamiento {cite:durar-kamina-jil-1993 3/338}. La Enciclopedia del Islam, siguiendo a Abu al-Fida y Umar ibn al-Wardi, fecha la ceguera en 743, o según otros en 741 {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}; aun así, continuó con sus estudios día y noche y siguió componiendo."
  fr: "Un voile s'était formé sur les yeux d'al-Dhahabi: il le reconnaissait, et sa vue s'affaiblit peu à peu jusqu'à disparaître complètement. Il s'irritait lorsqu'on lui disait: « Si on te piquait l'œil, tu verrais », car il ne s'agissait pas d'une cataracte nécessitant une intervention. L'Encyclopédie de l'Islam, d'après Abu al-Fida et Umar ibn al-Wardi, date sa cécité de 743, tandis que d'autres la situent en 741. Malgré cela, il continua d'étudier jour et nuit et de composer."
  tr: "El-Dhahabi'nin görme yeteneği sudan etkilenirdi ve bunu fark etmeye başladı; görme yeteneği yavaş yavaş zayıflayarak tamamen kayboldu. Ona, \"Gözünü yaksaydın görürdün\" denildiğinde kızardı, çünkü yakılabilecek bir şey su değildi. {cite:durar-kamina-jil-1993 3/338}; ve İslam Ansiklopedisi, Ebu el-Fida ve Ömer İbn el-Vardi'den rivayetle, onun 743 Hicri yılında, diğerlerine göre ise 741 Hicri yılında kör olduğunu belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}, buna rağmen gece gündüz ilim yapmaya ve yazmaya devam etti."
  id: "Penglihatan Al-Dhahabi terpengaruh oleh air, dan ia mulai menyadarinya dan penglihatannya melemah sedikit demi sedikit hingga akhirnya hilang sepenuhnya. Ia akan marah jika dikatakan kepadanya, \"Jika matamu menyala, kau akan melihat,\" karena air bukanlah sesuatu yang bisa dinyalakan. {cite:durar-kamina-jil-1993 3/338}; dan Ensiklopedia menyebutkan berdasarkan riwayat Abu al-Fida dan Umar Ibn al-Wardi bahwa ia menjadi buta pada tahun 743 H, dan menurut yang lain, pada tahun 741 H. {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}, namun ia terus bekerja di bidang ilmu pengetahuan siang dan malam serta menulis."
