id: event/al-dhahabi-blindness-743
class: event
kind: other
label:
  ar: "الذهبي يفقد بصره تدريجاً، ٧٤٣هـ"
  en: "Al-Dhahabi gradually loses his sight, 743/1342"
  ur: "ذہبی کی بینائی بتدریج ختم ہوئی، 743ھ/1342ء"
summary:
  ar: "نزل ببصر الذهبي ماءٌ فأخذ يعرفه ويضعف قليلاً قليلاً حتى تكامل عدمه، وكان يغضب إذا قيل له لو قدحت عينك لأبصرت لأنه لم يكن ماءً يُقدَح {cite:durar-kamina-jil-1993 3/338}؛ وذكرت دائرة المعارف عن أبي الفداء وعمر بن الوردي أن العمى أصابه سنة ٧٤٣هـ، وعند غيرهما سنة ٧٤١هـ {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}، فظل مع ذلك يشتغل بالعلم ليل نهار ويصنّف."
  en: "A film settled over al-Dhahabi's eyes: he would recognise it, and the sight weakened little by little until it was wholly gone, and he grew angry when told 'if your eye were needled you would see', for it was not a needlable cataract {cite:durar-kamina-jil-1993 3/338}. The Encyclopaedia of Islam, after Abu al-Fida and Umar ibn al-Wardi, dates the blindness to 743, or by others to 741 {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}; even so he kept at his studies night and day and kept composing."
  ur: "ذہبی کی آنکھوں پر پردہ چڑھا جو پہلے پہچان لیتا تھا اور بینائی آہستہ آہستہ کم ہوتی گئی یہاں تک کہ بالکل ختم ہو گئی؛ جب کہا جاتا کہ آنکھ کا قدح کرواؤ تو تم دیکھ لو گے تو وہ ناراض ہوتے کیونکہ یہ قدح کرنے والا موتیا نہیں تھا {cite:durar-kamina-jil-1993 3/338}۔ دائرۃ المعارف ابو الفدا اور عمر بن الوردی کے حوالے سے نابینائی کو 743ھ، اور بعض کے نزدیک 741ھ لکھتی ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}؛ اس کے باوجود وہ دن رات علم میں مشغول اور تصنیف جاری رکھے رہے۔"
