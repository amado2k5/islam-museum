label:
  ar: الدعوة العباسية في خراسان
  en: The Abbasid da'wa in Khurasan
  ur: خراسان میں عباسی دعوت
summary:
  ar: الدعوة السرية إلى آل محمد التي يؤرخ الدينوري بدايتها بقدوم الشيعة على محمد بن علي بن عبد الله بن عباس بالحميمة أول سنة إحدى ومئة، ثم انتشارها في كور خراسان سراً في زي التجار، حتى ظهرت على يد أبي مسلم {cite:akhbar-tiwal-amir p. 332} {cite:akhbar-tiwal-amir p. 336} {cite:akhbar-tiwal-amir p. 343}.
  en: The secret call to the family of Muhammad, whose beginning al-Dinawari dates to the partisans' arrival before Muhammad ibn Ali ibn Abd Allah ibn Abbas at al-Humayma early in 101 AH, and which spread secretly through the districts of Khurasan in the guise of merchants until it came into the open under Abu Muslim {cite:akhbar-tiwal-amir p. 332} {cite:akhbar-tiwal-amir p. 336} {cite:akhbar-tiwal-amir p. 343}.
  ur: آلِ محمد کی خفیہ دعوت، جس کا آغاز دینوری 101ھ کے شروع میں حمیمہ میں محمد بن علی بن عبد اللہ بن عباس کے پاس حامیوں کی آمد سے بتاتے ہیں، اور جو تاجروں کے بھیس میں خراسان کے اضلاع میں خفیہ طور پر پھیلی یہاں تک کہ ابو مسلم کے ہاتھوں کھل کر سامنے آئی {cite:akhbar-tiwal-amir p. 332} {cite:akhbar-tiwal-amir p. 336} {cite:akhbar-tiwal-amir p. 343}۔
