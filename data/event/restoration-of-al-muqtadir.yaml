id: event/restoration-of-al-muqtadir
class: event
kind: other
label: { ar: "صرف المقتدر إلى الخلافة", en: "The restoration of al-Muqtadir to the caliphate", es: "La restauración de al-Muqtadir al califato", fr: "La restauration d'al-Muqtadir au califat", ur: "المقتدیر کی خلافت کی بحالی", tr: "El-Muktadir halifeliğe devredildi.", id: "Al-Muqtadir dipindahkan ke kekhalifahan." }
summary:
  ar: "في سنة سبع عشرة وثلاثمائة، بعد أن قُتل نازوك وخرج القاهر من القصر، أخرج مؤنس المقتدر وأعاده إلى القصر، فجلس للناس وخاطبهم، ثم بايعه الناس بيعة مجددة {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
  en: "In 317, after Nazuk was killed and al-Qahir had left the palace, Mu'nis brought al-Muqtadir out and returned him to the palace. He sat down before the people and addressed them, and then the people gave him a renewed pledge of allegiance {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
  es: "En el año 317, después de que Nazuk fuera asesinado y al-Qahir abandonara el palacio, Mu'nis sacó a al-Muqtadir y lo llevó de regreso al palacio. Se sentó ante el pueblo y les dirigió unas palabras, y entonces el pueblo le juró lealtad nuevamente {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
  fr: "En 317, après la mort de Nazuk et le départ d'al-Qahir du palais, Mu'nis fit sortir al-Muqtadir et le ramena au palais. Il s'assit devant le peuple et s'adressa à lui, et le peuple lui renouvela son serment d'allégeance {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
  ur: "317 میں، نازوک کے مارے جانے اور القاہر کے محل سے نکل جانے کے بعد، معنیس نے مقتدیر کو باہر لایا اور اسے محل میں واپس کردیا۔ وہ لوگوں کے سامنے بیٹھا اور ان سے خطاب کیا، پھر لوگوں نے ان سے تجدید بیعت کی۔"
  tr: "Hicri 317 yılında, Nazuk öldürüldükten ve Al-Qahir saraydan ayrıldıktan sonra, Mu'nis Al-Muqtadir'i dışarı çıkarıp saraya geri getirdi. Halkla birlikte oturdu ve onlara hitap etti, ardından halk ona tekrar biat etti. {Kaynak:tabari-tarikh-abu-al-fadl c.11 s.124}"
  id: "Pada tahun 317 H, setelah Nazuk terbunuh dan Al-Qahir meninggalkan istana, Mu’nis membawa Al-Muqtadir keluar dan mengembalikannya ke istana. Ia duduk bersama orang-orang dan berpidato di hadapan mereka, kemudian orang-orang kembali menyatakan baiat kepadanya. {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
