summary:
  ar: "في سنة سبع عشرة وثلاثمائة، بعد أن قُتل نازوك وخرج القاهر من القصر، أخرج مؤنس المقتدر وأعاده إلى القصر، فجلس للناس وخاطبهم، ثم بايعه الناس بيعة مجددة {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
  en: "In 317, after Nazuk was killed and al-Qahir had left the palace, Mu'nis brought al-Muqtadir out and returned him to the palace. He sat down before the people and addressed them, and then the people gave him a renewed pledge of allegiance {cite:tabari-tarikh-abu-al-fadl j.11 p.124}."
