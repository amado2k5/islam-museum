id: event/offering-islam-to-the-tribes
class: event
kind: gathering
label: { ar: "عرض الإسلام على القبائل في المواسم", en: "Offering Islam to the tribes at the pilgrim season", es: "Ofrecer el Islam a las tribus durante la temporada de peregrinación.", fr: "Offrir l'islam aux tribus pendant la saison du pèlerinage", ur: "حج کے موسم میں قبائل کو اسلام کی پیشکش کرنا" }
summary:
  ar: "في ذي القعدة من السنة العاشرة من البعثة عاد النبي إلى مكة ليعرض الإسلام على القبائل والأفراد في الموسم، فعرضه على بني كلب وبني حنيفة وبني عامر وغيرهم فلم يستجب منهم أحد، ومن الأفراد من أسلم بعد ذلك كسويد بن الصامت وإياس بن معاذ."
  en: "In Dhu al-Qa'da of the tenth year of the mission the Prophet returned to Mecca to offer Islam to the tribes and individuals at the season; among the tribes he approached Banu Kalb, Banu Hanifa and Banu Amir, none of whom accepted, while some individuals, such as Suwayd ibn al-Samit and Iyas ibn Mu'adh, later embraced it."
  es: "En Dhu al-Qa'da del décimo año de la misión, el Profeta regresó a La Meca para ofrecer el Islam a las tribus e individuos de la época; entre las tribus se acercó a Banu Kalb, Banu Hanifa y Banu Amir, ninguno de los cuales aceptó, mientras que algunos individuos, como Suwayd ibn al-Samit e Iyas ibn Mu'adh, lo abrazaron más tarde."
  fr: "Au mois de Dhu al-Qa'da de la dixième année de la mission, le Prophète retourna à La Mecque pour proposer l'Islam aux tribus et aux individus présents; parmi les tribus, il s'adressa aux Banu Kalb, aux Banu Hanifa et aux Banu Amir, dont aucun n'accepta, tandis que certains individus, tels que Suwayd ibn al-Samit et Iyas ibn Mu'adh, l'embrassèrent plus tard."
  ur: "مشن کے دسویں سال ذی القعدہ میں نبی موسم میں قبائل اور افراد کو اسلام کی پیشکش کرنے کے لیے مکہ واپس آئے۔ قبیلوں میں سے اس نے بنو کلب، بنو حنیفہ اور بنو عامر سے رابطہ کیا، جن میں سے کسی نے قبول نہیں کیا، جب کہ سوید بن الصامت اور ایاس ابن معاذ جیسے کچھ افراد نے بعد میں اسے قبول کرلیا۔"
