summary:
  ar: "في ذي القعدة من السنة العاشرة من البعثة عاد النبي إلى مكة ليعرض الإسلام على القبائل والأفراد في الموسم، فعرضه على بني كلب وبني حنيفة وبني عامر وغيرهم فلم يستجب منهم أحد، ومن الأفراد من أسلم بعد ذلك كسويد بن الصامت وإياس بن معاذ."
  en: "In Dhu al-Qa'da of the tenth year of the mission the Prophet returned to Mecca to offer Islam to the tribes and individuals at the season; among the tribes he approached Banu Kalb, Banu Hanifa and Banu Amir, none of whom accepted, while some individuals, such as Suwayd ibn al-Samit and Iyas ibn Mu'adh, later embraced it."
