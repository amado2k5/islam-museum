label: { ar: "مقتل أبي مسلم الخراساني" }
summary:
  ar: "في سنة سبع وثلاثين ومائة قُتل أبو مسلم الخراساني {cite:tabari-tarikh-abu-al-fadl j.7 p.479}، وذكر الطبري في عنوان الفهرس خروج عبد الله بن علي وهزيمته قبل ذلك {cite:tabari-tarikh-abu-al-fadl j.7 p.667}، وعند السيوطي تولى المنصور الخلافة في أول سنة سبع وثلاثين فأول ما فعل أن قتل أبا مسلم الخراساني صاحب دعوتهم وممهد مملكتهم {cite:tarikh-khulafa-minhaj-1434 p. 423}، وعند المسعودي سرح إليه المنصور جريراً البجلي فأقبل به رغم نهي مالك بن الهيثم، وكان يجد في الكتب السالفة أنه يقتل بالروم ويميت دولة ويحيي أخرى، فدخل على مضرب المنصور برومية المدائن على دجلة وقد تقدم المنصور إلى عثمان بن نهيك صاحب حرسه في عدة فيهم شبيب بن رواح المروروذي وأبو حنيفة حرب بن قيس أن يقوموا خلف سريره {cite:muruj-al-dhahab p. 279-280}"
