label: { ar: "مقتل أبي مسلم الخراساني", en: "The murder of Abu Muslim al-Khurasani" }
summary:
  ar: "في سنة سبع وثلاثين ومائة قُتل أبو مسلم الخراساني {cite:tabari-tarikh-abu-al-fadl j.7 p.479}، وذكر الطبري في عنوان الفهرس خروج عبد الله بن علي وهزيمته قبل ذلك {cite:tabari-tarikh-abu-al-fadl j.7 p.667}، وعند السيوطي تولى المنصور الخلافة في أول سنة سبع وثلاثين فأول ما فعل أن قتل أبا مسلم الخراساني صاحب دعوتهم وممهد مملكتهم {cite:tarikh-khulafa-minhaj-1434 p. 423}، وعند المسعودي سرح إليه المنصور جريراً البجلي فأقبل به رغم نهي مالك بن الهيثم، وكان يجد في الكتب السالفة أنه يقتل بالروم ويميت دولة ويحيي أخرى، فدخل على مضرب المنصور برومية المدائن على دجلة وقد تقدم المنصور إلى عثمان بن نهيك صاحب حرسه في عدة فيهم شبيب بن رواح المروروذي وأبو حنيفة حرب بن قيس أن يقوموا خلف سريره {cite:muruj-al-dhahab p. 279-280}"
  en: "In 137 AH Abu Muslim al-Khurasani was killed {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. Al-Tabari's table of contents also lists the rising of Abd Allah ibn Ali and his defeat before that {cite:tabari-tarikh-abu-al-fadl j.7 p.667}. According to al-Suyuti, al-Mansur became caliph at the start of 137, and the first thing he did was to kill Abu Muslim al-Khurasani, the man of their da'wa and the one who prepared their kingdom {cite:tarikh-khulafa-minhaj-1434 p. 423}. According to al-Mas'udi, al-Mansur dispatched Jarir al-Bajali to him, and he came with him despite the warning of Malik ibn al-Haytham, who had found in earlier books that he would be killed at Rum, would end one dynasty and raise another. He entered al-Mansur's tent at Rumiyya of al-Mada'in on the Tigris, after al-Mansur had instructed Uthman ibn Nahik, the commander of his guard, with a band including Shabib ibn Rawh al-Marwarudhi and Abu Hanifa Harb ibn Qays, to stand behind his couch {cite:muruj-al-dhahab p. 279-280}."
