id: event/murder-of-abu-muslim
class: event
kind: massacre
label: { ar: "مقتل أبي مسلم الخراساني", en: "The murder of Abu Muslim al-Khurasani", es: "El asesinato de Abu Muslim al-Khurasani", fr: "Le meurtre d'Abu Muslim al-Khurasani", ur: "ابو مسلم خراسانی کا قتل", tr: "Ebu Müslim el-Horasani'nin öldürülmesi", id: "Pembunuhan Abu Muslim al-Khorasani" }
summary:
  ar: "في سنة سبع وثلاثين ومائة قُتل أبو مسلم الخراساني {cite:tabari-tarikh-abu-al-fadl j.7 p.479}، وذكر الطبري في عنوان الفهرس خروج عبد الله بن علي وهزيمته قبل ذلك {cite:tabari-tarikh-abu-al-fadl j.7 p.667}، وعند السيوطي تولى المنصور الخلافة في أول سنة سبع وثلاثين فأول ما فعل أن قتل أبا مسلم الخراساني صاحب دعوتهم وممهد مملكتهم {cite:tarikh-khulafa-minhaj-1434 p. 423}، وعند المسعودي سرح إليه المنصور جريراً البجلي فأقبل به رغم نهي مالك بن الهيثم، وكان يجد في الكتب السالفة أنه يقتل بالروم ويميت دولة ويحيي أخرى، فدخل على مضرب المنصور برومية المدائن على دجلة وقد تقدم المنصور إلى عثمان بن نهيك صاحب حرسه في عدة فيهم شبيب بن رواح المروروذي وأبو حنيفة حرب بن قيس أن يقوموا خلف سريره {cite:muruj-al-dhahab p. 279-280}"
  en: "In 137 AH Abu Muslim al-Khurasani was killed {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. Al-Tabari's table of contents also lists the rising of Abd Allah ibn Ali and his defeat before that {cite:tabari-tarikh-abu-al-fadl j.7 p.667}. According to al-Suyuti, al-Mansur became caliph at the start of 137, and the first thing he did was to kill Abu Muslim al-Khurasani, the man of their da'wa and the one who prepared their kingdom {cite:tarikh-khulafa-minhaj-1434 p. 423}. According to al-Mas'udi, al-Mansur dispatched Jarir al-Bajali to him, and he came with him despite the warning of Malik ibn al-Haytham, who had found in earlier books that he would be killed at Rum, would end one dynasty and raise another. He entered al-Mansur's tent at Rumiyya of al-Mada'in on the Tigris, after al-Mansur had instructed Uthman ibn Nahik, the commander of his guard, with a band including Shabib ibn Rawh al-Marwarudhi and Abu Hanifa Harb ibn Qays, to stand behind his couch {cite:muruj-al-dhahab p. 279-280}."
  es: "En el año 137 de la Hégira, Abu Muslim al-Khurasani fue asesinado {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. El índice de Al-Tabari también menciona el ascenso de Abd Allah ibn Ali y su derrota anterior {cite:tabari-tarikh-abu-al-fadl j.7 p.667}. Según Al-Suyuti, Al-Mansur se convirtió en califa a principios del año 137, y lo primero que hizo fue matar a Abu Muslim al-Khurasani, el hombre de su da'wa y el que preparó su reino {cite:tarikh-khulafa-minhaj-1434 p. 423}. Según al-Mas'udi, al-Mansur envió a Jarir al-Bajali, quien lo acompañó a pesar de la advertencia de Malik ibn al-Haytham, quien había encontrado en libros anteriores que moriría en Rum, pondría fin a una dinastía y fundaría otra. Entró en la tienda de al-Mansur en Rumiyya de al-Mada'in, en el Tigris, después de que al-Mansur ordenara a Uthman ibn Nahik, comandante de su guardia, con un grupo que incluía a Shabib ibn Rawh al-Marwarudhi y Abu Hanifa Harb ibn Qays, que se colocaran detrás de su lecho {cite:muruj-al-dhahab p. 279-280}."
  fr: "En 137 de l'Hégire, Abu Muslim al-Khurasani fut assassiné (cf. Tabari, Tarikh Abu al-Fadl, vol. 7, p. 479). La table des matières d'Al-Tabari mentionne également l'ascension d'Abd Allah ibn Ali et sa défaite antérieure (cf. Tabari, Tarikh Abu al-Fadl, vol. 7, p. 667). Selon al-Suyuti, al-Mansur devint calife au début de l'année 137 et son premier acte fut d'assassiner Abu Muslim al-Khurasani, prédicateur et bâtisseur du royaume (cf. Tarikh Khulafa Minhaj, vol. 1434, p. 423). Selon al-Mas'udi, al-Mansur envoya Jarir al-Bajali auprès de lui, et celui-ci l'accompagna malgré l'avertissement de Malik ibn al-Haytham, qui avait lu dans des ouvrages antérieurs qu'il serait tué à Rum, qu'il mettrait fin à une dynastie et en instaurerait une autre. Il entra dans la tente d'al-Mansur à Rumiyya d'al-Mada'in, sur le Tigre, après qu'al-Mansur eut ordonné à Uthman ibn Nahik, commandant de sa garde, accompagné d'une troupe comprenant Shabib ibn Rawh al-Marwarudhi et Abu Hanifa Harb ibn Qays, de se tenir derrière son lit (voir Muruj al-Dhahab, p. 279-280)."
  ur: "137ھ میں ابو مسلم الخراسانی کو قتل کر دیا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج7 ص479}۔ الطبری کے مندرجات کے جدول میں عبد اللہ ابن علی کے عروج اور اس سے پہلے ان کی شکست کی بھی فہرست دی گئی ہے۔ السیوطی کے مطابق، المنصور 137 کے شروع میں خلیفہ بنا، اور اس نے سب سے پہلا کام ابو مسلم الخراسانی کو قتل کرنا تھا، جو ان کی دعوت کا آدمی تھا اور جس نے ان کی بادشاہی تیار کی تھی۔ 423}۔ المسعودی کے مطابق، المنصور نے جریر البجعلی کو اس کے پاس بھیجا، اور وہ مالک بن الہیثم کے انتباہ کے باوجود اس کے ساتھ آیا، جس نے اس سے پہلے کی کتابوں میں لکھا تھا کہ اسے روم کے مقام پر قتل کیا جائے گا، ایک خاندان کا خاتمہ اور دوسرے کو کھڑا کرے گا۔ وہ دجلہ پر المدائن کے رومیہ میں المنصور کے خیمے میں داخل ہوا، جب المنصور نے اپنے محافظوں کے سپہ سالار عثمان بن نحیق کو شبیب بن راح المروضی اور ابو حنیفہ حرب ابن قیس سمیت ایک دستے کے ساتھ اپنے صحابی کے پیچھے کھڑے ہونے کی ہدایت کی تھی۔ 279-280}۔"
  tr: "137 yılında Ebu Müslim el-Horasani öldürüldü {kaynak:tabari-tarikh-abu-al-fadl j.7 s.479} ve el-Tabari, dizin başlığında Abdullah bin Ali'nin ayaklanmasından ve bundan önceki yenilgisinden bahsetmiştir {kaynak:tabari-tarikh-abu-al-fadl j.7 s.667} ve el-Suyuti'ye göre, el-Mansur 137 yılının başında halifeliği üstlendi ve yaptığı ilk şey, onların çağrısının lideri ve krallıklarının yolunu açan Ebu Müslim el-Horasani'yi öldürmek oldu {kaynak:tarikh-khulafa-minhaj-1434 s. 423} Ve El-Mas'udi'ye göre, El-Mansur, Cerir El-Bajali'yi ona gönderdi ve Malik İbn El-Haytham'ın yasağına rağmen onunla birlikte geldi ve önceki kitaplarda Romalılara karşı savaşacağını, bir devleti yıkıp diğerini yeniden kuracağını öğrendi. Böylece Dicle üzerindeki Roma şehri El-Mada'in'deki El-Mansur'un çadırına girdi ve El-Mansur, muhafızlarının komutanı Osman İbn Nahik'e, Şabib İbn Rava El-Marvezi ve Ebu Hanife Harb İbn Kays da dahil olmak üzere bir grup adamla birlikte yatağının arkasında durmalarını emretti. {kaynak:muruj-al-dhahab s. 279-280}"
  id: "Pada tahun 137, Abu Muslim al-Khorasani terbunuh {cite:tabari-tarikh-abu-al-fadl j.7 p.479}, dan al-Tabari menyebutkan dalam judul indeks pemberontakan Abdullah bin Ali dan kekalahannya sebelum itu {cite:tabari-tarikh-abu-al-fadl j.7 p.667}, dan menurut al-Suyuti, al-Mansur mengambil alih kekhalifahan pada awal tahun 137, dan hal pertama yang dilakukannya adalah membunuh Abu Muslim al-Khorasani, pemimpin dakwah mereka dan orang yang membuka jalan bagi kerajaan mereka {cite:tarikh-khulafa-minhaj-1434 p. 423} Dan menurut Al-Mas’udi, Al-Mansur mengutus Jarir Al-Bajali kepadanya, dan ia datang bersamanya meskipun ada larangan dari Malik Ibn Al-Haytham, dan ia menemukan dalam kitab-kitab sebelumnya bahwa ia akan membunuh orang-orang Romawi dan menghancurkan satu negara dan menghidupkan kembali negara lain. Maka ia memasuki tenda Al-Mansur di kota Romawi Al-Mada’in di tepi sungai Tigris, dan Al-Mansur telah menginstruksikan Uthman Ibn Nahik, komandan pengawalnya, bersama sejumlah orang, termasuk Shabib Ibn Rawah Al-Marwazi dan Abu Hanifa Harb Ibn Qais, untuk berdiri di belakang tempat tidurnya {kutip:muruj-al-dhahab hlm. 279-280}"
