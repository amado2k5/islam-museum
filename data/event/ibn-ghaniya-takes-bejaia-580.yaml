id: event/ibn-ghaniya-takes-bejaia-580
class: event
kind: conquest
label: { ar: "ملك ابن غانية بجاية", en: "Ibn Ghaniya's seizure of Béjaïa (580 AH)" }
summary:
  ar: "في شعبان سنة ثمانين وخمسمائة سمع علي بن إسحاق المعروف بابن غانية — وهو صاحب جزيرة ميورقة — بوفاة يوسف بن عبد المؤمن، فعمّر أسطولاً عشرين قطعة وسار في جموعه فأرسى في ساحل بجاية وخرجت خيله ورجاله نحو مائتي فارس وأربعة آلاف راجل من الملثمين، فدخل المدينة بغير قتال لأن واليها كان قد سار عنها إلى مراكش ولم يترك فيها جيشاً؛ ووافقه جماعة من بقايا دولة بني حماد فكثر جمعه بهم، وعاد والي بجاية من طريقه ومعه ثلاثمائة فارس من الموحدين وجمع من العرب نحو ألف فارس، فخرج إليهم ابن غانية بقدر ألف فارس فلما توافقوا انضاف جميع من مع الوالي إلى الملثم وانهزم الوالي وسار إلى مراكش؛ وأطاع ابن غانية أعمال بجاية جميعها إلا قسطنطينية فحصرها حتى جاء جيش الموحدين من البر والبحر في صفر سنة إحدى وثمانين — عشرين ألف فارس براً وأسطول كبير — فخرج منها أخواه يحيى وعبد الله هاربين ولحقا به فرحل عن قسطنطينية وسار إلى إفريقية {cite:kamil-ibn-al-athir p. 128-129}."
  en: "Sha'ban 580: hearing of Yusuf ibn Abd al-Mu'min's death, Ali 'Ibn Ghaniya' of Majorca sailed twenty vessels into Béjaïa's roadstead — two hundred mounted Mulaththamun and four thousand foot took the governor-less city without a fight; the Banu Hammad remnant flocked in, the returning governor's own thousand Arabs defected at first contact, and only Constantine held out until an Almohad army of twenty thousand horse and a great fleet lifted it in Safar 581, driving the brothers to Ifriqiya {cite:kamil-ibn-al-athir p. 128-129}."
