id: event/ibn-ghaniya-takes-bejaia-580
class: event
kind: conquest
label: { ar: "ملك ابن غانية بجاية", en: "Ibn Ghaniya's seizure of Béjaïa (580 AH)", es: "La toma de Béjaïa por Ibn Ghaniya (580 AH)", fr: "Prise de Béjaïa par Ibn Ghaniya (580 AH)", ur: "ابن ثنیہ کا بیجائیہ پر قبضہ ⁦(580ھ)⁩", tr: "Malik İbn Ghaniya Bejaia", id: "Malik Ibn Ghaniya Bejaia" }
summary:
  ar: "في شعبان سنة ثمانين وخمسمائة سمع علي بن إسحاق المعروف بابن غانية — وهو صاحب جزيرة ميورقة — بوفاة يوسف بن عبد المؤمن، فعمّر أسطولاً عشرين قطعة وسار في جموعه فأرسى في ساحل بجاية وخرجت خيله ورجاله نحو مائتي فارس وأربعة آلاف راجل من الملثمين، فدخل المدينة بغير قتال لأن واليها كان قد سار عنها إلى مراكش ولم يترك فيها جيشاً؛ ووافقه جماعة من بقايا دولة بني حماد فكثر جمعه بهم، وعاد والي بجاية من طريقه ومعه ثلاثمائة فارس من الموحدين وجمع من العرب نحو ألف فارس، فخرج إليهم ابن غانية بقدر ألف فارس فلما توافقوا انضاف جميع من مع الوالي إلى الملثم وانهزم الوالي وسار إلى مراكش؛ وأطاع ابن غانية أعمال بجاية جميعها إلا قسطنطينية فحصرها حتى جاء جيش الموحدين من البر والبحر في صفر سنة إحدى وثمانين — عشرين ألف فارس براً وأسطول كبير — فخرج منها أخواه يحيى وعبد الله هاربين ولحقا به فرحل عن قسطنطينية وسار إلى إفريقية {cite:kamil-ibn-al-athir p. 128-129}."
  en: "Sha'ban 580: hearing of Yusuf ibn Abd al-Mu'min's death, Ali 'Ibn Ghaniya' of Majorca sailed twenty vessels into Béjaïa's roadstead — two hundred mounted Mulaththamun and four thousand foot took the governor-less city without a fight; the Banu Hammad remnant flocked in, the returning governor's own thousand Arabs defected at first contact, and only Constantine held out until an Almohad army of twenty thousand horse and a great fleet lifted it in Safar 581, driving the brothers to Ifriqiya {cite:kamil-ibn-al-athir p. 128-129}."
  es: "Sha'ban 580: al enterarse de la muerte de Yusuf ibn Abd al-Mu'min, Ali 'Ibn Ghaniya' de Mallorca navegó veinte embarcaciones hacia la rada de Béjaïa; doscientos Mulaththamun a caballo y cuatro mil infantes tomaron la ciudad sin gobernador sin luchar; el remanente de Banu Hammad acudió en masa, los mil árabes del gobernador que regresaba desertaron al primer contacto, y solo Constantino resistió hasta que un ejército almohade de veinte mil jinetes y una gran flota la levantó en Safar 581, haciendo retroceder a los hermanos a Ifriqiya {cite:kamil-ibn-al-athir p. 128-129}."
  fr: "Sha'ban 580: apprenant la mort de Yusuf ibn Abd al-Mu'min, Ali 'Ibn Ghaniya' de Majorque fit naviguer vingt navires dans la rade de Béjaïa — deux cents cavaliers Mulaththamun et quatre mille fantassins prirent la ville sans gouverneur sans combat; le reste des Banu Hammad afflua, les mille Arabes du gouverneur de retour firent défection au premier contact, et seul Constantin résista jusqu'à ce qu'une armée almohade de vingt mille cavaliers et une grande flotte la soulèvent en Safar 581, repoussant les frères à Ifriqiya {cite:kamil-ibn-al-athir p. 128-129}."
  ur: "شعبان 580: یوسف بن عبد المومن کی موت کی خبر سن کر، مجورکا کے علی 'ابن غنیہ' نے بیس بحری جہاز بیجعہ کی سڑک پر روانہ کیے - دو سو سوار ملاتھمون اور چار ہزار پیدل بغیر کسی لڑائی کے گورنر لیس شہر لے گئے۔ بنو حماد کے بقیہ جوق در جوق داخل ہو گئے، واپس آنے والے گورنر کے اپنے ہزار عرب پہلے رابطے میں ہی منحرف ہو گئے، اور صرف قسطنطنیہ نے اس وقت تک مقابلہ کیا جب تک کہ بیس ہزار گھوڑوں کی الموحد فوج اور ایک عظیم بیڑے نے اسے صفر 581 میں اٹھا لیا، بھائیوں کو عفریقیہ کی طرف لے گئے۔ 128-129}۔"
  tr: "Hicri 580 yılının Şaban ayında, Mayorka hükümdarı İbn Ganiye olarak bilinen Ali ibn İshak, Yusuf ibn Abdülmümin'in ölümünü duydu. Yirmi gemiden oluşan bir filo kurdu ve ordusuyla birlikte Becaiye kıyılarına çıktı. Yaklaşık iki yüz süvari ve dört bin piyadeden oluşan peçelilerden oluşan ordusuyla şehre girdi. Valinin Marakeş'e gitmesi ve orada ordu bırakmaması nedeniyle, savaşmadan şehre girdi. Beni Hammad devletinin kalıntılarından bir grup ona katıldı ve ordusu onlarla birlikte büyüdü. Becaiye valisi, Almohadlardan üç yüz süvari ve yaklaşık bin süvariden oluşan bir Arap grubuyla geri döndü. İbn Ganiye yaklaşık bin süvariyle onlara doğru yola çıktı. Karşılaştıklarında, valinin yanındakilerin hepsi peçelilere katıldı ve vali yenilerek Marakeş'e gitti. İbn Ganiye, Bejaia'nın tüm emirlerine uydu, ancak Konstantinopolis hariç. Konstantinopolis'i kuşattı, ta ki 81 yılının Safar ayında karadan ve denizden gelen Almohad ordusu -karada 20.000 süvari ve büyük bir filo- gelene kadar. Bunun üzerine iki kardeşi Yahya ve Abdullah kaçarak ona katıldılar ve İbn Ganiye de Konstantinopolis'ten ayrılıp Afrika'ya gitti. {Kaynak: Kamil İbn Al-Atir s. 128-129}"
  id: "Pada bulan Sya'ban tahun 580 H, Ali ibn Ishaq, yang dikenal sebagai Ibn Ghaniya—penguasa Majorca—mendengar kabar kematian Yusuf ibn Abd al-Mu'min. Ia membangun armada yang terdiri dari dua puluh kapal dan berangkat bersama pasukannya, mendarat di pantai Bejaia. Pasukan kavaleri dan tentaranya, sekitar dua ratus penunggang kuda dan empat ribu tentara infanteri dari kaum berjilbab, keluar. Ia memasuki kota tanpa pertempuran karena gubernurnya telah meninggalkannya untuk pergi ke Marrakesh dan tidak meninggalkan pasukan di sana. Sekelompok orang dari sisa-sisa negara Banu Hammad bergabung dengannya, sehingga pasukannya bertambah dengan mereka. Gubernur Bejaia kembali dari perjalanannya dengan tiga ratus penunggang kuda dari Almohad dan sekelompok orang Arab sekitar seribu penunggang kuda. Ibn Ghaniya pergi menemui mereka dengan sekitar seribu penunggang kuda. Ketika mereka bertemu, semua orang yang bersama gubernur bergabung dengan kaum berjilbab, dan gubernur dikalahkan dan pergi ke Marrakesh. Ibn Ghaniya mematuhi semua karya Bejaia kecuali Konstantinopel, yang dikepungnya hingga pasukan Almohad datang dari darat dan laut pada bulan Safar tahun delapan puluh satu - dua puluh ribu pasukan berkuda di darat dan armada besar - sehingga kedua saudaranya, Yahya dan Abdullah, meninggalkannya dan bergabung dengannya, lalu ia meninggalkan Konstantinopel dan pergi ke Afrika {cite:kamil-ibn-al-athir p. 128-129}."
