label: { ar: "غزوة ابن أبي حدرد الغابة ومقتل رفاعة بن قيس الجشمي", en: "Ibn Abi Hadrad's raid on al-Ghaba and the killing of Rifa'a ibn Qays al-Jushami" }
summary:
  ar: "بعث النبي عبد الله بن أبي حدرد ورجلين معه إلى رفاعة بن قيس الجشمي، وكان قد نزل بالغابة في بطن عظيم من جشم يريد أن يجمع قيساً على حرب النبي، ليأتوا منه بخبر؛ فكمنوا حول الحاضر، وخرج رفاعة وحده في أثر راعيه فرماه ابن أبي حدرد بسهم في فؤاده واحتزّ رأسه، وكبّروا فهرب القوم، واستاقوا إبلاً وغنماً؛ وأعان النبي ابن أبي حدرد من الإبل بثلاثة عشر بعيراً في صداقه الذي كان مئتي درهم."
  en: "The Prophet sent Abdullah ibn Abi Hadrad with two men to Rifa'a ibn Qays al-Jushami, who had camped at al-Ghaba with a large clan of Jusham meaning to gather Qays against the Prophet, to bring back news of him; they lay in ambush, Rifa'a went out alone after his shepherd and Ibn Abi Hadrad shot him through the heart and cut off his head; they shouted the takbir, the camp fled, and they drove off camels and sheep. The Prophet gave Ibn Abi Hadrad thirteen camels towards his dowry of two hundred dirhams."
