id: event/raid-of-ibn-abi-hadrad-on-al-ghaba
class: event
kind: raid
label: { ar: "غزوة ابن أبي حدرد الغابة ومقتل رفاعة بن قيس الجشمي", en: "Ibn Abi Hadrad's raid on al-Ghaba and the killing of Rifa'a ibn Qays al-Jushami", es: "La incursión de Ibn Abi Hadrad en al-Ghaba y el asesinato de Rifa'a ibn Qays al-Jushami", fr: "Raid d'Ibn Abi Hadrad sur al-Ghaba et meurtre de Rifa'a ibn Qays al-Jushami", ur: "ابن ابی حدرد کا الغابہ پر حملہ اور رفاع بن قیس الجشمی کا قتل" }
summary:
  ar: "بعث النبي عبد الله بن أبي حدرد ورجلين معه إلى رفاعة بن قيس الجشمي، وكان قد نزل بالغابة في بطن عظيم من جشم يريد أن يجمع قيساً على حرب النبي، ليأتوا منه بخبر؛ فكمنوا حول الحاضر، وخرج رفاعة وحده في أثر راعيه فرماه ابن أبي حدرد بسهم في فؤاده واحتزّ رأسه، وكبّروا فهرب القوم، واستاقوا إبلاً وغنماً؛ وأعان النبي ابن أبي حدرد من الإبل بثلاثة عشر بعيراً في صداقه الذي كان مئتي درهم."
  en: "The Prophet sent Abdullah ibn Abi Hadrad with two men to Rifa'a ibn Qays al-Jushami, who had camped at al-Ghaba with a large clan of Jusham meaning to gather Qays against the Prophet, to bring back news of him; they lay in ambush, Rifa'a went out alone after his shepherd and Ibn Abi Hadrad shot him through the heart and cut off his head; they shouted the takbir, the camp fled, and they drove off camels and sheep. The Prophet gave Ibn Abi Hadrad thirteen camels towards his dowry of two hundred dirhams."
  es: "El Profeta envió a Abdullah ibn Abi Hadrad con dos hombres a Rifa'a ibn Qays al-Jushami, quien había acampado en al-Ghaba con un numeroso clan de Jusham con la intención de reunir a los Qays contra el Profeta, para que le trajeran noticias de él. Le tendieron una emboscada, Rifa'a salió solo tras su pastor e Ibn Abi Hadrad le disparó en el corazón y le cortó la cabeza. Gritaron el takbir, el campamento huyó y se llevaron camellos y ovejas. El Profeta le dio a Ibn Abi Hadrad trece camellos como parte de su dote de doscientos dirhams."
  fr: "Le Prophète envoya Abdullah ibn Abi Hadrad avec deux hommes auprès de Rifa'a ibn Qays al-Jushami, qui avait établi son campement à al-Ghaba avec un important clan de Jusham, dans l'intention de rassembler les Qays contre le Prophète, afin de lui rapporter des nouvelles. Ils tendirent une embuscade. Rifa'a sortit seul à la suite de son berger, et Ibn Abi Hadrad lui tira une balle en plein cœur et lui trancha la tête. Ils poussèrent le takbir, le camp s'enfuit, emportant chameaux et moutons. Le Prophète donna à Ibn Abi Hadrad treize chameaux en plus de sa dot de deux cents dirhams."
  ur: "نبی نے عبداللہ بن ابی حدرد کو دو آدمیوں کے ساتھ رفاعہ بن قیس الجوشمی کے پاس بھیجا، جس نے الغابہ میں جوشام کے ایک بڑے قبیلے کے ساتھ ڈیرہ ڈالا تھا، یعنی نبی کے خلاف قیس کو جمع کرنا، آپ کی خبر پہنچانا؛ وہ گھات میں پڑے ہوئے تھے، رفاع اپنے چرواہے کے پیچھے اکیلے نکلے اور ابن ابی حدرد نے اس کے دل میں گولی مار کر اس کا سر کاٹ دیا۔ انہوں نے تکبیر کا نعرہ لگایا، کیمپ بھاگ گیا اور اونٹوں اور بھیڑوں کو بھگا دیا۔ نبی نے ابن ابی حدرد کو تیرہ اونٹ دو سو درہم کے مہر میں دیے۔"
