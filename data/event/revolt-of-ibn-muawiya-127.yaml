label: { ar: "خروج عبد الله بن معاوية بن عبد الله بن جعفر بالكوفة" }
summary:
  ar: "في سنة سبع وعشرين ومائة دعا عبد الله بن معاوية بن عبد الله بن جعفر بن أبي طالب الناس إلى نفسه بالكوفة وحارب بها عاملها عبد الله بن عمر بن عبد العزيز، وكان قد قدمها زائراً يلتمس صلته لا يريد خروجاً فتزوج ابنة حاتم بن الشرقي فلما وقعت العصبية قال له أهل الكوفة ادع إلى نفسك فبنو هاشم أولى بالأمر من بني مروان، وكان سببها أن ابن عمر أعطى مضر وربيعة عطايا عظاماً ولم يعط جعفر بن نافع وعثمان بن الخيبر من أهل اليمن مثلها فغاضباه فأمر بهما فدفعاه وخرجا فنادوا يا لربيعة فثارت إليهم ربيعة، فلما رأت الشيعة ضعف ابن عمر اغتمزوا فيه ودعوا إلى ابن معاوية وثاروا في غوغاء الناس حتى أتوا المسجد فاجتمعوا فيه وبايع الناس لعبد الله بن معاوية وأخرجوه من دار الوليد بن سعيد حتى أدخلوه القصر، فأقام بالكوفة أياماً يبايعه الناس وأتته البيعة من المدائن وقم النيل، وخرج إلى المدائن فبايعوه ثم غلب على حلوان والجبال والماهين وهمذان وقومس وأصبهان والري {cite:tabari-khayyat-part2 p. 607-611}."
