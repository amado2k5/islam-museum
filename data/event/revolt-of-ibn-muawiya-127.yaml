label: { ar: "خروج عبد الله بن معاوية بن عبد الله بن جعفر بالكوفة", en: "The revolt of 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far in Kufa" }
summary:
  ar: "في سنة سبع وعشرين ومائة دعا عبد الله بن معاوية بن عبد الله بن جعفر بن أبي طالب الناس إلى نفسه بالكوفة وحارب بها عاملها عبد الله بن عمر بن عبد العزيز، وكان قد قدمها زائراً يلتمس صلته لا يريد خروجاً فتزوج ابنة حاتم بن الشرقي فلما وقعت العصبية قال له أهل الكوفة ادع إلى نفسك فبنو هاشم أولى بالأمر من بني مروان، وكان سببها أن ابن عمر أعطى مضر وربيعة عطايا عظاماً ولم يعط جعفر بن نافع وعثمان بن الخيبر من أهل اليمن مثلها فغاضباه فأمر بهما فدفعاه وخرجا فنادوا يا لربيعة فثارت إليهم ربيعة، فلما رأت الشيعة ضعف ابن عمر اغتمزوا فيه ودعوا إلى ابن معاوية وثاروا في غوغاء الناس حتى أتوا المسجد فاجتمعوا فيه وبايع الناس لعبد الله بن معاوية وأخرجوه من دار الوليد بن سعيد حتى أدخلوه القصر، فأقام بالكوفة أياماً يبايعه الناس وأتته البيعة من المدائن وقم النيل، وخرج إلى المدائن فبايعوه ثم غلب على حلوان والجبال والماهين وهمذان وقومس وأصبهان والري {cite:tabari-khayyat-part2 p. 607-611}."
  en: "In 127 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far ibn Abi Talib called people to himself in Kufa and fought its governor there, 'Abd Allah ibn 'Umar ibn 'Abd al-'Aziz. He had come to Kufa as a visitor seeking his stipend, with no intention of rising, and married the daughter of Hatim ibn al-Sharqi. When factional partisanship broke out, the people of Kufa told him to call for himself, since the Banu Hashim had a better right to the affair than the Banu Marwan. The cause was that Ibn 'Umar gave great gifts to Mudar and Rabi'a but did not give Ja'far ibn Nafi' and 'Uthman ibn al-Khayyar of the Yemenis the like. They grew angry, he had them pushed out, and they went out shouting 'O Rabi'a!', and Rabi'a rose to them. When the partisans saw Ibn 'Umar's weakness, they pressed upon him and called for Ibn Mu'awiya, and they rose up amid the rabble until they reached the mosque and gathered there. The people gave their allegiance to 'Abd Allah ibn Mu'awiya, and they drove him out of the house of al-Walid ibn Sa'id until they brought him into the palace. He remained in Kufa for several days while people gave him their allegiance; pledges came to him from al-Mada'in and Qumm al-Nil. He went out to al-Mada'in, where they gave him their allegiance, and then he prevailed over Hulwan, the mountains, al-Mahin, Hamadhan, Qumis, Isfahan and Rayy {cite:tabari-khayyat-part2 p. 607-611}."
