id: event/revolt-of-ibn-muawiya-127
class: event
kind: revolt
label: { ar: "خروج عبد الله بن معاوية بن عبد الله بن جعفر بالكوفة", en: "The revolt of 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far in Kufa", es: "La revuelta de 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far en Kufa", fr: "La révolte de 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far à Kufa", ur: "کوفہ میں عبداللہ بن معاویہ بن عبد اللہ ابن جعفر کی بغاوت", tr: "Abdullah ibn Muaviye ibn Abdullah ibn Cafer'in Kufe'den ayrılışı", id: "Kepergian Abdullah bin Muawiyah bin Abdullah bin Jaafar dari Kufah" }
summary:
  ar: "في سنة سبع وعشرين ومائة دعا عبد الله بن معاوية بن عبد الله بن جعفر بن أبي طالب الناس إلى نفسه بالكوفة وحارب بها عاملها عبد الله بن عمر بن عبد العزيز، وكان قد قدمها زائراً يلتمس صلته لا يريد خروجاً فتزوج ابنة حاتم بن الشرقي فلما وقعت العصبية قال له أهل الكوفة ادع إلى نفسك فبنو هاشم أولى بالأمر من بني مروان، وكان سببها أن ابن عمر أعطى مضر وربيعة عطايا عظاماً ولم يعط جعفر بن نافع وعثمان بن الخيبر من أهل اليمن مثلها فغاضباه فأمر بهما فدفعاه وخرجا فنادوا يا لربيعة فثارت إليهم ربيعة، فلما رأت الشيعة ضعف ابن عمر اغتمزوا فيه ودعوا إلى ابن معاوية وثاروا في غوغاء الناس حتى أتوا المسجد فاجتمعوا فيه وبايع الناس لعبد الله بن معاوية وأخرجوه من دار الوليد بن سعيد حتى أدخلوه القصر، فأقام بالكوفة أياماً يبايعه الناس وأتته البيعة من المدائن وقم النيل، وخرج إلى المدائن فبايعوه ثم غلب على حلوان والجبال والماهين وهمذان وقومس وأصبهان والري {cite:tabari-khayyat-part2 p. 607-611}."
  en: "In 127 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far ibn Abi Talib called people to himself in Kufa and fought its governor there, 'Abd Allah ibn 'Umar ibn 'Abd al-'Aziz. He had come to Kufa as a visitor seeking his stipend, with no intention of rising, and married the daughter of Hatim ibn al-Sharqi. When factional partisanship broke out, the people of Kufa told him to call for himself, since the Banu Hashim had a better right to the affair than the Banu Marwan. The cause was that Ibn 'Umar gave great gifts to Mudar and Rabi'a but did not give Ja'far ibn Nafi' and 'Uthman ibn al-Khayyar of the Yemenis the like. They grew angry, he had them pushed out, and they went out shouting 'O Rabi'a!', and Rabi'a rose to them. When the partisans saw Ibn 'Umar's weakness, they pressed upon him and called for Ibn Mu'awiya, and they rose up amid the rabble until they reached the mosque and gathered there. The people gave their allegiance to 'Abd Allah ibn Mu'awiya, and they drove him out of the house of al-Walid ibn Sa'id until they brought him into the palace. He remained in Kufa for several days while people gave him their allegiance; pledges came to him from al-Mada'in and Qumm al-Nil. He went out to al-Mada'in, where they gave him their allegiance, and then he prevailed over Hulwan, the mountains, al-Mahin, Hamadhan, Qumis, Isfahan and Rayy {cite:tabari-khayyat-part2 p. 607-611}."
  es: "En el año 127, Abd Allah ibn Mu'awiya ibn Abd Allah ibn Ja'far ibn Abi Talib convocó a la gente de Kufa y luchó contra su gobernador, Abd Allah ibn Umar ibn Abd al-Aziz. Había llegado a Kufa como visitante en busca de su estipendio, sin intención de ascender socialmente, y se casó con la hija de Hatim ibn al-Sharqi. Cuando estalló la lucha de poder entre facciones, la gente de Kufa le dijo que se presentara, ya que los Banu Hashim tenían más derecho al asunto que los Banu Marwan. La causa fue que Ibn Umar había dado grandes regalos a Mudar y Rabi'a, pero no a Ja'far ibn Nafi' y Uthman ibn al-Khayyar, de Yemen. Estos se enfurecieron, él los hizo expulsar y salieron gritando \"¡Oh Rabi'a!\", y Rabi'a se levantó ante ellos. Cuando los partidarios vieron la debilidad de Ibn 'Umar, lo presionaron y llamaron a Ibn Mu'awiya, y se alzaron entre la multitud hasta llegar a la mezquita y se reunieron allí. El pueblo juró lealtad a 'Abd Allah ibn Mu'awiya, y lo expulsaron de la casa de al-Walid ibn Sa'id hasta llevarlo al palacio. Permaneció en Kufa durante varios días mientras la gente le juraba lealtad; recibió juramentos de al-Mada'in y Qumm al-Nil. Salió a al-Mada'in, donde le juraron lealtad, y luego conquistó Hulwan, las montañas, al-Mahin, Hamadhan, Qumis, Isfahan y Rayy {cite:tabari-khayyat-part2 p. 607-611}."
  fr: "En 127, 'Abd Allah ibn Mu'awiya ibn 'Abd Allah ibn Ja'far ibn Abi Talib rassembla les habitants de Koufa et affronta son gouverneur, 'Abd Allah ibn 'Umar ibn 'Abd al-'Aziz. Ce dernier était venu à Koufa en visiteur pour percevoir sa pension, sans intention de se soulever, et avait épousé la fille de Hatim ibn al-Sharqi. Lorsque des luttes intestines éclatèrent, les habitants de Koufa l'incitèrent à se présenter lui-même, car les Banu Hashim étaient plus légitimes que les Banu Marwan. La cause du conflit était qu'Ibn 'Umar avait généreusement offert des présents à Mudar et Rabi'a, mais pas à Ja'far ibn Nafi' et 'Uthman ibn al-Khayyar, des Yéménites. Furieux, ils furent chassés de la ville, et ils sortirent en criant « Ô Rabi'a ! », ce à quoi Rabi'a répondit par un défi. Voyant la faiblesse d'Ibn 'Umar, les partisans l'assaillirent et appelèrent Ibn Mu'awiya. Ils se soulevèrent au milieu de la foule et atteignirent la mosquée où ils se rassemblèrent. Le peuple prêta allégeance à 'Abd Allah ibn Mu'awiya et le chassa de la maison d'al-Walid ibn Sa'id pour le conduire au palais. Il demeura à Koufa plusieurs jours, le temps que les habitants lui prêtent allégeance; des promesses d'allégeance lui parvinrent d'al-Mada'in et de Qumm al-Nil. Il se rendit ensuite à al-Mada'in, où il obtint de nouveau allégeance, puis il remporta la victoire sur Hulwan, les montagnes, al-Mahin, Hamadhan, Qumis, Ispahan et Rayy."
  ur: "127 میں عبد اللہ بن معاویہ ابن عبد اللہ ابن جعفر ابن ابی طالب نے کوفہ میں لوگوں کو اپنے پاس بلایا اور وہاں کے گورنر عبد اللہ بن عمر بن عبدالعزیز سے لڑا۔ وہ اپنے وظیفہ کے حصول کے لیے کوفہ آیا تھا، بغیر کسی اضافے کے، اور حاتم بن الشرقی کی بیٹی سے شادی کر لی۔ جب دھڑے بندی شروع ہوئی تو اہل کوفہ نے ان سے کہا کہ وہ اپنے آپ کو بلا لیں کیونکہ بنو ہاشم کو بنو مروان سے زیادہ حق حاصل تھا۔ وجہ یہ تھی کہ ابن عمر نے مدر اور ربیعہ کو تو بڑے تحفے دیئے لیکن یمن کے جعفر بن نافع اور عثمان بن الخیار کو نہیں دیا۔ وہ غصے میں آگئے، آپ نے انہیں باہر دھکیل دیا، اور وہ 'اے ربیعہ!' کہتے ہوئے باہر نکلے، اور ربیعہ ان کے پاس اٹھیں۔ جب حاسدین نے ابن عمر کی کمزوری دیکھی تو ان پر دباؤ ڈالا اور ابن معاویہ کو بلایا اور وہ ہجوم کے درمیان اٹھ کھڑے ہوئے یہاں تک کہ وہ مسجد میں پہنچے اور وہاں جمع ہوگئے۔ لوگوں نے عبداللہ بن معاویہ کی بیعت کی اور انہیں ولید بن سعید کے گھر سے نکال دیا یہاں تک کہ وہ انہیں محل میں لے آئے۔ وہ کئی دن تک کوفہ میں رہے اور لوگوں نے ان کی بیعت کی۔ اس کے پاس المدائن اور قم النیل سے بیعتیں آئیں۔ آپ المدائن کی طرف نکلے، جہاں انہوں نے آپ کی بیعت کی، اور پھر وہ حلوان، پہاڑوں، المحین، حمادان، قمیس، اصفہان اور رے پر غالب آگیا۔ 607-611}۔"
  tr: "Hicri 127 yılında Abdullah ibn Muaviye ibn Abdullah ibn Cafer ibn Abi Talib, Kufa'da halkı kendi safına çekti ve valisi Abdullah ibn Ömer ibn Abdül Aziz'e savaş açtı. Abdullah ibn Ömer, Kufa'ya ayrılma niyeti olmadan, iyilik dilemek için ziyaretçi olarak gelmişti. Hatim ibn el-Şarki'nin kızıyla evlenmişti. Kabilecilik ortaya çıktığında, Kufa halkı ona halkı kendi safına çekmesini söyledi ve Beni Haşim'in Beni Mervan'dan daha fazla liderliğe layık olduğunu savundu. Bunun sebebi, İbn Ömer'in Mudar ve Rabi'ah kabilelerine cömert hediyeler verirken, Yemen'den Cafer ibn Nafi' ve Osman ibn el-Hayber'e benzer hediyeler vermemesiydi. Ona kızdılar, bu yüzden onlara gitmelerini emretti. Onu itip \"Ey Rabi'ah!\" diye bağırdılar. Bunun üzerine Rabi'ah onlara karşı ayaklandı. Şiiler İbn Ömer'in zayıflığını görünce bundan faydalandılar ve İbn Muaviye'yi çağırdılar. Halkı kışkırtarak camiye kadar getirdiler; orada toplandılar ve Abdullah ibn Muaviye'ye biat ettiler. Onu Velid ibn Said'in evinden alıp saraya getirdiler. Birkaç gün Kufa'da kaldı ve halk ona biat etti. Medine ve Kum el-Nil'den de biat mesajları geldi. Sonra Medine'ye gitti. Orada da ona biat ettiler ve ardından Hulvan'ı, dağları, Mahin'i, Hamadan'ı, Kum'u, İsfahan'ı ve Rayy'ı fethetti. {Kaynak: Tabari-Hayyat-Bölüm 2, s. 607-611}"
  id: "Pada tahun 127 H, Abdullah ibn Muawiyah ibn Abdullah ibn Ja'far ibn Abi Talib menyeru rakyat untuk mendukung perjuangannya di Kufa dan melancarkan perang melawan gubernurnya, Abdullah ibn Umar ibn Abdul Aziz. Abdullah ibn Umar datang ke Kufa sebagai tamu untuk mencari dukungan, tanpa berniat untuk pergi. Ia menikahi putri Hatim ibn al-Sharqi. Ketika terjadi perpecahan kesukuan, penduduk Kufa menyuruhnya untuk menyeru rakyat untuk mendukung perjuangannya, dengan alasan bahwa Bani Hasyim lebih layak menjadi pemimpin daripada Bani Marwan. Alasannya adalah karena Ibnu Umar telah memberikan hadiah yang besar kepada suku Mudar dan Rabi'ah, sementara tidak memberikan hadiah serupa kepada Ja'far ibn Nafi' dan Utsman ibn al-Khaybar dari Yaman. Mereka marah kepadanya, sehingga ia memerintahkan mereka untuk pergi. Mereka mendorongnya dan berteriak, \"Wahai Rabi'ah!\" Rabi'ah kemudian bangkit melawan mereka. Ketika kaum Syiah melihat kelemahan Ibnu Umar, mereka memanfaatkannya dan memanggil Ibnu Muawiyah. Mereka menghasut massa hingga mencapai masjid, tempat mereka berkumpul dan orang-orang berjanji setia kepada Abdullah bin Muawiyah. Mereka membawanya keluar dari rumah Walid bin Sa'id dan ke istana. Dia tinggal di Kufa selama beberapa hari sementara orang-orang berjanji setia kepadanya. Janji setia juga sampai kepadanya dari al-Mada'in dan Qum al-Nil. Kemudian dia pergi ke al-Mada'in. Mereka berjanji setia kepadanya, lalu dia menaklukkan Hulwan, pegunungan, Mahin, Hamadan, Qumis, Isfahan, dan Rayy. {cite:tabari-khayyat-part2 p. 607-611}."
