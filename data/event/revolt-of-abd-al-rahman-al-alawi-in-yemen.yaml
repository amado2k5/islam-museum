summary:
  ar: "في سنة سبع ومائتين خرج عبد الرحمن بن أحمد بن عبد الله بن محمد بن عمر بن علي ببلاد عك من اليمن يدعو إلى الرضا من آل محمد {cite:tabari-tarikh-abu-al-fadl j.8 p.593}."
  en: "In 207 'Abd al-Rahman ibn Ahmad ibn 'Abd Allah ibn Muhammad ibn 'Umar ibn 'Ali rose in the land of 'Akk in Yemen, calling to the approved one from the family of Muhammad {cite:tabari-tarikh-abu-al-fadl j.8 p.593}."
  es: "En 207, 'Abd al-Rahman ibn Ahmad ibn 'Abd Allah ibn Muhammad ibn 'Umar ibn 'Ali se levantó en la tierra de 'Akk en Yemen, llamando al aprobado de la familia de Muhammad {cite:tabari-tarikh-abu-al-fadl j.8 p.593}."
  fr: "En 207, 'Abd al-Rahman ibn Ahmad ibn 'Abd Allah ibn Muhammad ibn 'Umar ibn 'Ali se leva au pays d''Akk au Yémen, appelant à l'approuvé de la famille de Muhammad {cite:tabari-tarikh-abu-al-fadl j.8 p.593}."
  ur: "207 میں عبدالرحمٰن بن احمد بن عبد اللہ بن محمد بن عمر ابن علی یمن میں عک کی سرزمین میں اٹھے اور محمد کے خاندان میں سے منظور شدہ کو پکارتے ہوئے {حوالہ: طبری تاریخ ابو الفضل ج8 ص 593}۔"
