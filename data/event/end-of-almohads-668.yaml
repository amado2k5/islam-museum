id: event/end-of-almohads-668
class: event
kind: war
label: { ar: "انقراض دولة بني عبد المؤمن", en: "The end of the Banu Abd al-Mu'min dynasty", es: "El fin de la dinastía Banu Abd al-Mu'min", fr: "La fin de la dynastie des Banu Abd al-Mu'min", ur: "بنو عبد المومن خاندان کا خاتمہ", tr: "Beni Abdülmümin devletinin yok oluşu", id: "Kepunahan negara Banu Abd al-Mu'min" }
summary:
  ar: "قتل الواثق أبو دبوس آخر خلفاء بني عبد المؤمن الموحدين في الحرب بينه وبين بني مرين ملوك تلمسان في المحرم سنة ثمان وستين وست مئة بموضع بينه وبين مراكش مسيرة ثلاثة أيام، فانقرضت دولة بني عبد المؤمن واستولى بنو مرين على ملكهم {cite:wafayat-ayan p. 16}."
  en: "Al-Wathiq Abu Dabus, last caliph of 'Abd al-Mu'min's house, fell fighting the Marinids of Tlemcen in Muharram 668 three days from Marrakesh — ending the Almohad dynasty as the Marinids took their kingdom {cite:wafayat-ayan p. 16}."
  es: "Al-Wathiq Abu Dabus, último califa de la casa de 'Abd al-Mu'min, cayó luchando contra los mariníes de Tlemcen en Muharram 668, tres días después de Marrakech, poniendo fin a la dinastía almohade cuando los mariníes tomaron su reino {cite:wafayat-ayan p. 16}."
  fr: "Al-Wathiq Abu Dabus, dernier calife de la maison d'Abd al-Mu'min, est tombé en combattant les Mérinides de Tlemcen en Muharram 668, à trois jours de Marrakech, mettant ainsi fin à la dynastie almohade alors que les Mérinides s'emparaient de leur royaume {cite:wafayat-ayan p. 16}."
  ur: "الوثیق ابو دابس، عبدالمومن کے گھر کا آخری خلیفہ، مراکش سے تین دن محرم 668 میں تلمسن کے مرینیوں سے لڑتے ہوئے گر گیا - الموحد خاندان کا خاتمہ ہوا کیونکہ میرینیوں نے اپنی بادشاہی سنبھال لی تھی۔ 16}۔"
  tr: "Beni Abdülmümin kabilesinin son halifesi El-Vathık Ebu Dabus, Hicri 668 yılının Muharrem ayında, kendisiyle Marakeş arasında, üç günlük yolculuk mesafesinde bir yerde, Tlemcen kralları olan Beni Marin ile yaptığı savaşta öldürüldü. Böylece Beni Abdülmümin devleti sona erdi ve Beni Marin onların krallığını ele geçirdi. {Kaynak: Vefayat-ı Ayan, s. 16}"
  id: "Al-Wathiq Abu Dabbus, khalifah terakhir Almohad dari Bani Abd al-Mu'min, terbunuh dalam perang antara dirinya dan Bani Marin, raja-raja Tlemcen, pada bulan Muharram tahun 668 H, di suatu tempat antara dirinya dan Marrakesh, perjalanan selama tiga hari. Dengan demikian, negara Bani Abd al-Mu'min berakhir, dan Bani Marin merebut kerajaan mereka. {cite:wafayat-ayan hlm. 16}"
