label: { ar: "انقراض دولة بني عبد المؤمن", en: "The end of the Banu Abd al-Mu'min dynasty", es: "El fin de la dinastía Banu Abd al-Mu'min", fr: "La fin de la dynastie des Banu Abd al-Mu'min" }
summary:
  ar: "قتل الواثق أبو دبوس آخر خلفاء بني عبد المؤمن الموحدين في الحرب بينه وبين بني مرين ملوك تلمسان في المحرم سنة ثمان وستين وست مئة بموضع بينه وبين مراكش مسيرة ثلاثة أيام، فانقرضت دولة بني عبد المؤمن واستولى بنو مرين على ملكهم {cite:wafayat-ayan p. 16}."
  en: "Al-Wathiq Abu Dabus, last caliph of 'Abd al-Mu'min's house, fell fighting the Marinids of Tlemcen in Muharram 668 three days from Marrakesh — ending the Almohad dynasty as the Marinids took their kingdom {cite:wafayat-ayan p. 16}."
  es: "Al-Wathiq Abu Dabus, último califa de la casa de 'Abd al-Mu'min, cayó luchando contra los mariníes de Tlemcen en Muharram 668, tres días después de Marrakech, poniendo fin a la dinastía almohade cuando los mariníes tomaron su reino {cite:wafayat-ayan p. 16}."
  fr: "Al-Wathiq Abu Dabus, dernier calife de la maison d'Abd al-Mu'min, est tombé en combattant les Mérinides de Tlemcen en Muharram 668, à trois jours de Marrakech, mettant ainsi fin à la dynastie almohade alors que les Mérinides s'emparaient de leur royaume {cite:wafayat-ayan p. 16}."
