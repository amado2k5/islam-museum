label: { ar: "الغزالي يتولى التدريس في النظامية ببغداد", en: "al-Ghazali becomes chief professor at the Nizamiyya in Baghdad", es: "Al-Ghazali se convierte en profesor titular de la Nizamiyya en Bagdad.", fr: "al-Ghazali devient professeur en chef à la Nizamiyya de Bagdad", ur: "الغزالی بغداد میں نظامیہ میں چیف پروفیسر بن گئے۔", tr: "El-Ghazali, Bağdat'taki Nizamiye mezhebinde öğretmenliği devraldı.", id: "Al-Ghazali mengambil alih pengajaran di Nizamiyya di Baghdad." }
summary:
  ar: "في سنة 484هـ ⁦(1091م)⁩ عيّنه نظام الملك كبير المدرّسين في المدرسة النظامية ببغداد، وكان يدرّس لأكثر من ثلاثمائة طالب، وكان يقارن ويناقش فلسفة الفارابي وابن سينا. {cite:britannica-al-ghazali}"
  en: "In 1091 the vizier Nizam al-Mulk appointed al-Ghazali chief professor of the Nizamiyya college in Baghdad, where he lectured to more than 300 students and examined the philosophy of al-Farabi and Avicenna (Britannica)."
  es: "En 1091, el visir Nizam al-Mulk nombró a al-Ghazali profesor principal del colegio Nizamiyya en Bagdad, donde impartió clases a más de 300 estudiantes y examinó la filosofía de al-Farabi y Avicena (Britannica)."
  fr: "En 1091, le vizir Nizam al-Mulk nomma al-Ghazali professeur en chef du collège Nizamiyya à Bagdad, où il donna des cours à plus de 300 étudiants et étudia la philosophie d'al-Farabi et d'Avicenne (Britannica)."
  ur: "1091 میں وزیر نظام الملک نے الغزالی کو بغداد کے نظامیہ کالج کا چیف پروفیسر مقرر کیا، جہاں اس نے 300 سے زائد طلباء کو لیکچر دیا اور الفارابی اور ایویسینا ⁦(برٹانیکا)⁩ کے فلسفے کا جائزہ لیا۔"
  tr: "Hicri 484 yılında (Miladi 1091), Nizam el-Mulk onu Bağdat'taki Nizamiye Okulu'nda baş öğretmen olarak atadı ve burada üç yüzden fazla öğrenciye ders verdi; Farabi ve İbn Sina'nın felsefelerini karşılaştırdı ve tartıştı. {cite:britannica-al-ghazali}"
  id: "Pada tahun 484 H (1091 M), Nizam al-Mulk mengangkatnya sebagai guru utama di Sekolah Nizamiyya di Baghdad, tempat ia mengajar lebih dari tiga ratus siswa, membandingkan dan mendiskusikan filsafat al-Farabi dan Ibnu Sina. {cite:britannica-al-ghazali}"
