id: event/change-of-qibla
education:
  did_you_know:
    ar: "في شعبان من السنة الثانية للهجرة تحوّلت القبلة من بيت المقدس إلى الكعبة، استجابةً لرغبة النبي وتمييزاً للأمة."
    en: "In Sha'ban of the second year after the Hijra, the prayer direction turned from Jerusalem to the Kaaba — answering the Prophet's wish and marking the community's distinct identity."
    ur: "ہجرت کے دوسرے سال شعبان میں قبلہ بیت المقدس سے کعبہ کی طرف بدل گیا — نبی کی خواہش کے جواب میں اور امت کی ممیز شناخت کے طور پر۔"
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari]
class: event
kind: other
label: { en: "The change of the qibla", ar: "تحويل القبلة" }
summary:
  en: "The direction of prayer was changed from Jerusalem to the Kaaba in Mecca, about a year and a half after the Hijra. Al-Samhudi gathers the reports: toward Bayt al-Maqdis sixteen months on al-Bara's account in Muslim (seventeen for Sa'id ibn al-Musayyib), the turn falling in mid-Rajab of year two on the soundest view — at zuhr in the Banu Salama mosque where two rak'as had been prayed, or at fajr in Quba in the Sahihayn's version carried by a runner — while Ibn Hajar makes 'asr the first prayer faced to the Kaaba {cite:samhudi-wafa-al-wafa p. 373-376}."
  ar: "تحوّل اتجاه الصلاة من بيت المقدس إلى الكعبة بمكة في شعبان سنة 2هـ، استجابةً لرغبة النبي وتمييزاً للأمة الإسلامية وتطهيراً لصفوف المسلمين. ويجمع السمهودي الروايات: الصلاة إلى بيت المقدس ستة عشر شهراً في رواية البراء عند مسلم وسبعة عشر عند سعيد بن المسيب، والتحويل في النصف من رجب سنة ثنتين على الأصح — في الظهر بمسجد بني سلمة بعد ركعتين، أو في الفجر بقباء في رواية الصحيحين — ويحقق ابن حجر أن أول صلاة إلى الكعبة كانت العصر {cite:samhudi-wafa-al-wafa p. 373-376}."
