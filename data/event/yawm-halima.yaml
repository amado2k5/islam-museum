summary:
  ar: "لما قتل المنذر بن ماء السماء ملك بعده ابنه المنذر الملقب بالأسود فسار إلى الحارث الأعرج طلبًا بثأر أبيه، فنزلا مرج حليمة، فأمر الحارث أهل قرى المرج أن يصنعوا الطعام في الجفان فكان الرجل يقاتل ثم يأكل، ودامت الحرب بينهما أيامًا لا ينتصف أحدهما، حتى بذل الحارث الصلح والإتاوة وقال إني باعث رؤوس القبائل لتقرير الحال، فانتدب له مائة غلام وقيل ثمانون فألبسهم السلاح تحت الثياب والبرانس وأمر ابنته حليمة أن تطيبهم وتلبسهم، فخطبها لبيد بن عمرو فارسهم فوعده إياها، فلما تتاموا عند الملك أبدوا السلاح فقتلوا الأشراف ومنهم لبيد ملك العراقيين، وقاتل لبيد بن عمرو حتى قتل وقد قال للملك لا يتحدث الناس أني فلّ مائة، وزحفت غسان فانهزم أهل العراق. واختلف النسابون في يومي أباغ وحليمة أيهما قتل فيه أي المنذرين، والأصح أن المنذر بن ماء السماء هو المقتول وابنه مات بالحيرة {cite:kamil-ibn-al-athir p. 409-412}."
  en: "To avenge his father, the new Lakhmid king al-Mundhir «the Black» marched to Ḥalīma's meadow. For days neither side prevailed, the Ghassanid army eating from great platters set among them. Then al-Ḥārith offered tribute and asked to send «the heads of the tribes to settle matters»: a hundred youths — some say eighty — with swords hidden beneath burnouses, perfumed and dressed by his daughter Ḥalīma. When they stood before the king they bared steel and cut down the Iraqi nobles, including the king himself; the rider Labīd ibn ʿAmr, promised Ḥalīma's hand, refused to survive («let no one say I fled a hundred») and died fighting. The genealogists disputed which Mundhir fell at which day; Ibn al-Athīr judges the slain king was al-Mundhir ibn Māʾ al-Samāʾ and the son died at al-Ḥīra {cite:kamil-ibn-al-athir p. 409-412}."
  es: "Para vengar a su padre, el nuevo rey lajmí al-Mundhir «el Negro» marchó al prado de Ḥalīma. Durante días ninguno de los bandos prevaleció, y el ejército gasánida comió de grandes bandejas dispuestas entre ellos. Entonces al-Ḥārith ofreció tributo y pidió enviar a «los jefes de las tribus para resolver el asunto»: cien jóvenes —algunos dicen ochenta— con espadas ocultas bajo burnús, perfumados y vestidos por su hija Ḥalīma. Cuando se presentaron ante el rey, desenvainaron sus espadas y abatieron a los nobles iraquíes, incluido el propio rey; el jinete Labīd ibn ʿAmr, a quien se le había prometido la mano de Ḥalīma, se negó a sobrevivir («que nadie diga que huí de cien») y murió luchando. Los genealogistas discutieron sobre qué Mundhir cayó en qué día; Ibn al-Athīr juzga que el rey asesinado era al-Mundhir ibn Māʾ al-Samāʾ y que el hijo murió en al-Ḥīra {cite:kamil-ibn-al-athir p. 409-412}."
  fr: "Pour venger son père, le nouveau roi lakhmid, al-Mundhir « le Noir », marcha vers la prairie de Ḥalīma. Pendant des jours, aucun camp ne l'emporta, l'armée ghassanide se nourrissant de grands plats disposés parmi eux. Alors al-Ḥārith offrit un tribut et demanda l'envoi des « chefs des tribus pour régler le différend »: une centaine de jeunes gens – certains disent quatre-vingts – l'épée dissimulée sous leurs burnous, parfumés et vêtus par sa fille Ḥalīma. Lorsqu'ils se présentèrent devant le roi, ils dégainèrent leurs armes et massacrèrent les nobles irakiens, y compris le roi lui-même; le cavalier Labīd ibn ʿAmr, à qui la main de Ḥalīma avait été promise, refusa de survivre (« que personne ne dise que j'ai fui avec cent hommes ») et mourut au combat. Les généalogistes divergent quant à la date de la mort de chaque Mundhir. Ibn al-Athīr juge que le roi tué était al-Mundhir ibn Māʾ al-Samāʾ et que le fils est mort à al-Ḥīra {cite:kamil-ibn-al-athir p. 409-412}."
  ur: "اپنے والد کا بدلہ لینے کے لیے، نئے لخمید بادشاہ المنذر \"سیاہ فام\" نے حلیمہ کے گھاس کے میدان کی طرف کوچ کیا۔ کئی دنوں تک دونوں طرف سے کوئی فتح نہیں ہوئی، غسانی فوج نے بڑے بڑے پلیٹوں سے کھانا کھایا۔ پھر الحارث نے خراج پیش کیا اور کہا کہ \"معاملات طے کرنے کے لیے قبائل کے سربراہان\" بھیجیں: ایک سو نوجوان - بعض کا کہنا ہے کہ اسّی - تلواروں کے نیچے چھپی ہوئی، خوشبو لگا کر اور اس کی بیٹی حلیمہ کے لباس میں۔ جب وہ بادشاہ کے سامنے کھڑے ہوئے تو انہوں نے فولاد کو ننگا کیا اور عراقی امرا بشمول بادشاہ کو کاٹ ڈالا۔ سوار لبید بن عمرو نے، جس نے حلیمہ کے ہاتھ کا وعدہ کیا تھا، زندہ رہنے سے انکار کر دیا ⁦(\"کوئی نہ کہے کہ میں سو بھاگا ہوں\")⁩ اور لڑتے لڑتے مر گیا۔ ماہرین نسب نے اختلاف کیا کہ منڈھیر کس دن گرا؟ ابن اثیر کا کہنا ہے کہ مقتول بادشاہ المنذر بن مع السمعہ تھا اور بیٹے کا انتقال الحیرہ میں ہوا تھا۔ 409-412}۔"
