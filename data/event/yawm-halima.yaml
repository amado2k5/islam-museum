summary:
  ar: "لما قتل المنذر بن ماء السماء ملك بعده ابنه المنذر الملقب بالأسود فسار إلى الحارث الأعرج طلبًا بثأر أبيه، فنزلا مرج حليمة، فأمر الحارث أهل قرى المرج أن يصنعوا الطعام في الجفان فكان الرجل يقاتل ثم يأكل، ودامت الحرب بينهما أيامًا لا ينتصف أحدهما، حتى بذل الحارث الصلح والإتاوة وقال إني باعث رؤوس القبائل لتقرير الحال، فانتدب له مائة غلام وقيل ثمانون فألبسهم السلاح تحت الثياب والبرانس وأمر ابنته حليمة أن تطيبهم وتلبسهم، فخطبها لبيد بن عمرو فارسهم فوعده إياها، فلما تتاموا عند الملك أبدوا السلاح فقتلوا الأشراف ومنهم لبيد ملك العراقيين، وقاتل لبيد بن عمرو حتى قتل وقد قال للملك لا يتحدث الناس أني فلّ مائة، وزحفت غسان فانهزم أهل العراق. واختلف النسابون في يومي أباغ وحليمة أيهما قتل فيه أي المنذرين، والأصح أن المنذر بن ماء السماء هو المقتول وابنه مات بالحيرة {cite:kamil-ibn-al-athir p. 409-412}."
  en: "To avenge his father, the new Lakhmid king al-Mundhir «the Black» marched to Ḥalīma's meadow. For days neither side prevailed, the Ghassanid army eating from great platters set among them. Then al-Ḥārith offered tribute and asked to send «the heads of the tribes to settle matters»: a hundred youths — some say eighty — with swords hidden beneath burnouses, perfumed and dressed by his daughter Ḥalīma. When they stood before the king they bared steel and cut down the Iraqi nobles, including the king himself; the rider Labīd ibn ʿAmr, promised Ḥalīma's hand, refused to survive («let no one say I fled a hundred») and died fighting. The genealogists disputed which Mundhir fell at which day; Ibn al-Athīr judges the slain king was al-Mundhir ibn Māʾ al-Samāʾ and the son died at al-Ḥīra {cite:kamil-ibn-al-athir p. 409-412}."
