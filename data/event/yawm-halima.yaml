label: { ar: "يوم حليمة — مقتل المنذر الأسود", en: "the day of Ḥalīma — al-Mundhir 'the Black' killed by al-Ḥārith's hundred", es: "El día de Ḥalīma — al-Mundhir 'el Negro' fue asesinado por los cien hombres de al-Ḥārith.", fr: "Le jour de Ḥalīma — al-Mundhir « le Noir » tué par les cent hommes d'al-Ḥārith", ur: "یوم حلیمہ - المنذر 'دی بلیک' الحارث کے سو کے ہاتھوں مارا گیا" }
