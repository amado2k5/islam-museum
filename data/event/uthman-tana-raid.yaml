label: { ar: "غارة عثمان بن أبي العاص على تانه والهند", en: "Uthman ibn Abi al-As's Raids on Tana and the Indian Coast", es: "Las incursiones de Uthman ibn Abi al-As en Tana y la costa india.", fr: "Les raids d'Uthman ibn Abi al-As sur Tana et la côte indienne", ur: "عثمان بن ابی العاص کا تانا اور ہندوستانی ساحل پر چھاپے۔", tr: "Osman ibn Abi el-As'ın Tanah ve Hindistan'a baskını", id: "Serangan Utsman bin Abi al-As di Tanah dan India" }
summary:
  ar: "ولى عمر بن الخطاب عثمان بن أبي العاص الثقفي البحرين وعمان سنة ١٥ فوجه أخاه الحكم إلى البحرين ومضى إلى عمان فأقطع جيشاً إلى تانه فلما رجع الجيش كتب إلى عمر يعلمه ذلك فكتب إليه عمر يا أخا ثقيف حملت دوداً على عود وإني أحلف بالله لو أصيبوا لأخذت من قومك مثلهم ووجه الحكم أيضاً إلى بروص ووجه أخاه المغيرة بن أبي العاص إلى خور الديبل فلقي العدو فظفر."
  en: "In 15h Umar gave Uthman ibn Abi al-As al-Thaqafi Bahrayn and Uman; he sent brother al-Hakam to Bahrayn and from Uman detached troops to Tana — Umar's answer was the famous 'ya akha Thaqif, you set worms upon wood; had they been struck I'd have taken their like from your people'. Al-Hakam sent to Barus, and brother al-Mughira to the Daybul creek, where he met the enemy and prevailed."
  es: "En el año 15 de la Hégira, Umar entregó a Uthman ibn Abi al-As al-Thaqafi Bahrayn y Uman; envió a su hermano al-Hakam a Bahrayn y desde Uman envió tropas a Tana. La respuesta de Umar fue la famosa frase: «¡Oh, hermano Thaqif, has puesto gusanos en la madera! Si los hubiera golpeado, habría tomado a otros como ellos de entre tu gente». Al-Hakam fue enviado a Barus, y su hermano al-Mughira al arroyo Daybul, donde se enfrentó al enemigo y venció."
  fr: "En 15 h, Umar livra Bahrayn et Uman à Uthman ibn Abi al-As al-Thaqafi. Il envoya son frère al-Hakam à Bahrayn et, d'Uman, détacher des troupes vers Tana. La réponse d'Umar fut la fameuse phrase: « Ya akha Thaqif, tu as semé la zizanie; si tu avais été vaincu, j'aurais pris des hommes semblables parmi les tiens. » Al-Hakam envoya des hommes à Barus et son frère al-Mughira au ruisseau Daybul, où il affronta l'ennemi et remporta la victoire."
  ur: "15ھ میں عمر نے عثمان بن ابی العاص الثقفی کو بحرین اور عمان دیا۔ اس نے بھائی الحکم کو بحرین بھیجا اور عمان سے تنا کی طرف فوجیں بھیج دیں - عمر کا جواب مشہور تھا 'یا اخث ثقیف، تم نے لکڑیوں پر کیڑے ڈال دیے۔ اگر وہ مارے جاتے تو میں ان کی طرح تم لوگوں سے چھین لیتا۔ الحکم نے باروس اور بھائی المغیرہ کو دیبل کریک کی طرف بھیجا، جہاں وہ دشمن سے مقابلہ کیا اور غالب آیا۔"
  tr: "Ömer ibn el-Hattab, 15 yılında Osman ibn Abi el-As el-Sakkafi'yi Bahreyn ve Umman valisi olarak atadı. Kardeşi el-Hakam'ı Bahreyn'e gönderdi ve kendisi Umman'a gitti, böylece Tana'ya bir ordu verdi. Ordu geri döndüğünde, Ömer'e bunu bildiren bir mektup yazdı. Ömer ona şöyle yazdı: \"Ey Sakif'in kardeşi, sen bir sopanın ucunda solucan taşıdın ve Allah'a yemin ederim ki, eğer onlar öldürülseydi, halkından da aynı sayıda solucan alırdım.\" Ayrıca el-Hakam'ı Burus'a ve kardeşi el-Muğira ibn Abi el-As'ı Hor el-Dibal'a gönderdi, böylece düşmanla karşılaştı ve zafer kazandı."
  id: "Umar bin al-Khattab mengangkat Utsman bin Abi al-As al-Thaqafi sebagai gubernur Bahrain dan Oman pada tahun 15. Ia mengirim saudaranya, al-Hakam, ke Bahrain dan pergi ke Oman, lalu memberikan pasukan kepada Tana. Ketika pasukan kembali, ia menulis surat kepada Umar untuk memberitahukannya. Umar membalas suratnya, “Wahai saudara Thaqif, engkau membawa cacing di atas tongkat, dan demi Allah, jika cacing-cacing itu dibunuh, aku akan mengambil dari kaummu jumlah yang sama.” Ia juga mengirim al-Hakam ke Burus dan mengirim saudaranya, al-Mughira bin Abi al-As, ke Khor al-Dibal, sehingga ia bertemu musuh dan meraih kemenangan."
