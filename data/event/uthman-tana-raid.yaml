label: { ar: "غارة عثمان بن أبي العاص على تانه والهند", en: "Uthman ibn Abi al-As's Raids on Tana and the Indian Coast" }
summary:
  ar: "ولى عمر بن الخطاب عثمان بن أبي العاص الثقفي البحرين وعمان سنة ١٥ فوجه أخاه الحكم إلى البحرين ومضى إلى عمان فأقطع جيشاً إلى تانه فلما رجع الجيش كتب إلى عمر يعلمه ذلك فكتب إليه عمر يا أخا ثقيف حملت دوداً على عود وإني أحلف بالله لو أصيبوا لأخذت من قومك مثلهم ووجه الحكم أيضاً إلى بروص ووجه أخاه المغيرة بن أبي العاص إلى خور الديبل فلقي العدو فظفر."
  en: "In 15h Umar gave Uthman ibn Abi al-As al-Thaqafi Bahrayn and Uman; he sent brother al-Hakam to Bahrayn and from Uman detached troops to Tana — Umar's answer was the famous 'ya akha Thaqif, you set worms upon wood; had they been struck I'd have taken their like from your people'. Al-Hakam sent to Barus, and brother al-Mughira to the Daybul creek, where he met the enemy and prevailed."
