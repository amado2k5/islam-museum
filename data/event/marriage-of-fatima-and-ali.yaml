label: { en: "The marriage of Fatima and Ali", ar: "زواج فاطمة وعلي", es: "El matrimonio de Fátima y Alí", fr: "Le mariage de Fatima et Ali", ur: "فاطمہ اور علی کی شادی", tr: "Fatima ve Ali'nin evliliği", id: "Pernikahan Fatima dan Ali" }
summary:
  en: "The Prophet's daughter Fatima married his cousin Ali ibn Abi Talib in Medina, from which the Prophet's line of descendants continued."
  ar: "تزوجت فاطمة بنت النبي من علي بن أبي طالب ابن عم النبي في المدينة، ومنهما استمر نسل النبي."
  es: "La hija del Profeta, Fátima, se casó con su primo Ali ibn Abi Talib en Medina, y de allí continuó la línea de descendientes del Profeta."
  fr: "La fille du Prophète, Fatima, épousa son cousin Ali ibn Abi Talib à Médine, et c'est de cette union que la lignée du Prophète se poursuivit."
  ur: "پیغمبر اسلام کی بیٹی فاطمہ نے مدینہ میں اپنے چچا زاد بھائی علی ابن ابی طالب سے شادی کی جس سے پیغمبر کی نسل کا سلسلہ جاری رہا۔"
  tr: "Peygamberin kızı Fatıma, Medine'de Peygamberin kuzeni Ali ibn Abi Talib ile evlendi ve Peygamberin soyu onlardan devam etti."
  id: "Fatima, putri Nabi, menikah dengan Ali ibn Abi Talib, sepupu Nabi, di Madinah, dan dari merekalah garis keturunan Nabi berlanjut."
