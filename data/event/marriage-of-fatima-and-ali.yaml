summary:
  en: "The Prophet's daughter Fatima married his cousin Ali ibn Abi Talib in Medina, from which the Prophet's line of descendants continued."
  ar: "تزوجت فاطمة بنت النبي من علي بن أبي طالب ابن عم النبي في المدينة، ومنهما استمر نسل النبي."
