id: event/al-hadi-retaliation-for-a-slaves-blows-and-the-extra-lash-286
class: event
kind: other
label:
  ar: قصاص الهادي لضربات الغلام والسوط الزائد في الجلد
  en: Al-Hadi gives retaliation for a slave's blows and answers an extra lash
  ur: ہادی کا غلام کی ضربوں کا قصاص اور اضافی کوڑے کا معاملہ
summary:
  ar: يروي محمد بن عبيد الله أنه كان عند الهادي يوماً فجاءه رجل يشكو غلاماً يقال له رزق ضربه أربع ضربات، فأحضر الهادي الغلام وسمع قوله إن الرجل أخذ سكيناً له فلم يردها، ثم أقر الغلام بخطئه فأمر أن يُضرب على ظهره أربع ضربات قصاصاً وعشرين عصا تأديباً. ثم يروي خبر رجلين شربا الخمر فزاد الجلاد سوطاً على أحدهما، فقال الهادي إنه لو علم أنه تعمّد لضربه، وأمر للمضروب بعشرة دراهم.
  en: Muhammad ibn Ubaydallah tells that he was sitting with al-Hadi when a man complained of a slave called Rizq who had struck him four blows; al-Hadi had the slave brought, heard that the man had taken the slave's knife and not returned it, and when the slave admitted he had been wrong, ordered four blows on his back as retaliation and twenty strokes of a staff as correction. A second report tells of two men struck for wine, one of whom the flogger gave an extra lash, so al-Hadi ordered ten dirhams for the man struck.
  ur: محمد بن عبید اللہ بیان کرتے ہیں کہ وہ ایک دن ہادی کے پاس بیٹھے تھے کہ ایک آدمی ایک غلام کی شکایت لے کر آیا جس کا نام رزق تھا اور جس نے اسے چار ضربیں ماری تھیں؛ ہادی نے غلام کو بلوایا، اس کی بات سنی کہ آدمی نے اس کی چھری لے لی تھی اور لوٹائی نہیں، پھر غلام نے اپنی غلطی مان لی تو حکم دیا کہ اس کی پیٹھ پر چار ضربیں بطور قصاص اور بیس ڈنڈے بطور تادیب لگائے جائیں۔ دوسری روایت دو آدمیوں کی ہے جنہیں شراب پر مارا گیا اور مارنے والے نے ایک پر ایک کوڑا زیادہ لگا دیا، تو ہادی نے مضروب کو دس درہم دلوائے۔
