id: event/al-hadi-retaliation-for-a-slaves-blows-and-the-extra-lash-286
class: event
kind: other
label:
  ar: قصاص الهادي لضربات الغلام والسوط الزائد في الجلد
  en: Al-Hadi gives retaliation for a slave's blows and answers an extra lash
  ur: ہادی کا غلام کی ضربوں کا قصاص اور اضافی کوڑے کا معاملہ
  es: "Al-Hadi se venga de los golpes de un esclavo y responde con un latigazo adicional."
  fr: "Al-Hadi riposte aux coups d'un esclave et lui inflige un coup de fouet supplémentaire."
  tr: "El-Hadi'nin, çocuğa vurduğu darbeler ve derisine uyguladığı aşırı kırbaçlama nedeniyle verdiği ceza."
  id: "Hukuman Al-Hadi atas pukulan yang diterima anak laki-laki itu dan cambukan berlebihan pada kulitnya."
summary:
  ar: يروي محمد بن عبيد الله أنه كان عند الهادي يوماً فجاءه رجل يشكو غلاماً يقال له رزق ضربه أربع ضربات، فأحضر الهادي الغلام وسمع قوله إن الرجل أخذ سكيناً له فلم يردها، ثم أقر الغلام بخطئه فأمر أن يُضرب على ظهره أربع ضربات قصاصاً وعشرين عصا تأديباً. ثم يروي خبر رجلين شربا الخمر فزاد الجلاد سوطاً على أحدهما، فقال الهادي إنه لو علم أنه تعمّد لضربه، وأمر للمضروب بعشرة دراهم.
  en: Muhammad ibn Ubaydallah tells that he was sitting with al-Hadi when a man complained of a slave called Rizq who had struck him four blows; al-Hadi had the slave brought, heard that the man had taken the slave's knife and not returned it, and when the slave admitted he had been wrong, ordered four blows on his back as retaliation and twenty strokes of a staff as correction. A second report tells of two men struck for wine, one of whom the flogger gave an extra lash, so al-Hadi ordered ten dirhams for the man struck.
  ur: محمد بن عبید اللہ بیان کرتے ہیں کہ وہ ایک دن ہادی کے پاس بیٹھے تھے کہ ایک آدمی ایک غلام کی شکایت لے کر آیا جس کا نام رزق تھا اور جس نے اسے چار ضربیں ماری تھیں؛ ہادی نے غلام کو بلوایا، اس کی بات سنی کہ آدمی نے اس کی چھری لے لی تھی اور لوٹائی نہیں، پھر غلام نے اپنی غلطی مان لی تو حکم دیا کہ اس کی پیٹھ پر چار ضربیں بطور قصاص اور بیس ڈنڈے بطور تادیب لگائے جائیں۔ دوسری روایت دو آدمیوں کی ہے جنہیں شراب پر مارا گیا اور مارنے والے نے ایک پر ایک کوڑا زیادہ لگا دیا، تو ہادی نے مضروب کو دس درہم دلوائے۔
  es: "Muhammad ibn Ubaydallah relata que estaba sentado con al-Hadi cuando un hombre se quejó de un esclavo llamado Rizq que le había propinado cuatro golpes. Al-Hadi mandó traer al esclavo, oyó que el hombre le había quitado el cuchillo y no se lo había devuelto, y cuando el esclavo admitió su error, ordenó cuatro golpes en la espalda como represalia y veinte azotes con un bastón como castigo. Un segundo relato cuenta que dos hombres fueron azotados por vino, y a uno de ellos el verdugo le dio un latigazo extra, por lo que al-Hadi ordenó diez dirhams para el hombre azotado."
  fr: "Muhammad ibn Ubaydallah raconte qu'il était assis avec al-Hadi lorsqu'un homme se plaignit d'un esclave nommé Rizq qui l'avait frappé quatre fois. Al-Hadi fit amener l'esclave, apprit que l'homme avait pris son couteau et ne l'avait pas rendu, et lorsque l'esclave admit sa faute, il ordonna de lui infliger quatre coups dans le dos en guise de représailles et vingt coups de bâton en guise de correction. Un autre récit relate l'histoire de deux hommes frappés pour du vin; le bourreau infligea à l'un d'eux un coup supplémentaire, et al-Hadi ordonna alors une amende de dix dirhams pour cet homme."
  tr: "Muhammed ibn Ubeyd Allah, bir gün Hadi ile birlikteyken, bir adamın kendisine gelip Rızık adında bir çocuğun kendisine dört kez vurduğundan şikayet ettiğini anlatır. Hadi çocuğu çağırdı ve çocuğun, adamın bıçağını aldığını ve geri vermediğini itiraf etmesini dinledi. Çocuk da suçunu itiraf edince, Hadi ceza olarak sırtına dört kırbaç ve yirmi kırbaç daha vurulmasını emretti. Daha sonra şarap içen iki adamın hikayesini anlatır; cellat adamlardan birine fazladan bir kırbaç daha vurmuştur. Hadi, eğer celladın bunu kasten yaptığını bilseydi, ona da vuracağını söylemiş ve vurulan adama on dirhem verilmesini emretmiştir."
  id: "Muhammad ibn Ubayd Allah menceritakan bahwa suatu hari ia bersama al-Hadi ketika seorang pria datang kepadanya mengeluh tentang seorang anak laki-laki bernama Rizq yang telah memukulnya empat kali. Al-Hadi memanggil anak laki-laki itu dan mendengarkan penjelasannya bahwa pria itu telah mengambil pisaunya dan ia tidak mengembalikannya. Anak laki-laki itu kemudian mengakui kesalahannya, sehingga al-Hadi memerintahkan agar ia dicambuk empat kali di punggungnya sebagai pembalasan dan dua puluh cambukan sebagai hukuman. Kemudian ia menceritakan kisah dua orang pria yang minum anggur, dan algojo menambahkan satu cambukan ekstra kepada salah satu dari mereka. Al-Hadi berkata bahwa jika ia tahu bahwa pria itu melakukannya dengan sengaja, ia akan memukulnya juga, dan ia memerintahkan agar pria yang telah dipukul diberi sepuluh dirham."
