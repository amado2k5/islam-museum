  ar: "بطاقة أولية لحصار بطليوس سنة ١١٦٩م، تدخل الموحدين لنصرة ابن مردنيش وأسر أفونسو الأول ملك البرتغال؛ لم تُراجع مصادره على الصفحة بعد."
