  tr: "1169 yılında Badajoz kuşatması, Almohadların İbn Mardaniş'i desteklemek için müdahalesi ve Portekiz Kralı I. Afonso'nun ele geçirilmesine dair ön bilgiler; sayfadaki kaynaklar henüz incelenmemiştir."
