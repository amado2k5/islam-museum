class: event
kind: court-ruling
label: { ar: "سقوط القاضي الرفيعي سنة 641هـ", en: "The fall of the qadi al-Rafi'i, 641", es: "La caída del cadí al-Rafi'i, 641", fr: "La chute du cadi al-Rafi'i, 641", ur: "قضاء الرافعی کا زوال، 641" }
summary:
  ar: "في سنة إحدى وأربعين وست مئة كشف الله الغمة بأن أوقع بين الوزير والقاضي الرفيعي فقبض على أعوانه الأرجاس وكبيرهم ابن الرواس فسجنوا وعذبوا بالصرب والعصر والمصادرة ومات ابن الرواس في العقوبة ثم أخرج الرفيعي من داره وحبس بالمقدمية ثم أخرج ليلاً فسجن بمغارة من نواحي البقاع ثم انقطع خبره فقيل خنق وقيل ألقى من شاهق في هوة وكان فاسد العقيدة دهرياً مستهزئاً بأمور الشريعة يخرج إلى الجمعة سكران ويعد شهود زور يدعون على أصحاب الأموال بأحكام مدبرة وأكل الرشا وأموال الأيتام والأوقاف وحمل إلى بعلبك على بغل بغير إكاف وأوقف على رأس القلعة فقال دعوني حتى أصلي ركعتين فصلى وأطال فرفسه داود سياف النقمة فوقع فما وصل إلى الماء إلا وقد تقطع وبقي صاحبه الوزير المسمى بالأمين إلى سنة ثمان وأربعين إذ شنق بالديار المصرية وأخذت حواصله فبلغت ثلاثة آلاف ألف دينار {cite:shadharat-dhahab p. 215}."
  en: "In 641 God lifted the affliction by setting the vizier against the qadi al-Rafii — a corrupt judge of forged deeds, bribes, orphans' and waqf monies, who rode to Friday prayers drunk with ready perjured witnesses. His agents were jailed and tortured, Ibn al-Ruwas dying under it; al-Rafii was carried to Baalbek on a bare-backed mule, stood at the citadel's rim asking leave to pray two rak'as — and was kicked over by Dawud the executioner, torn apart before he reached the water. His accomplice the vizier al-Amin was strangled in Egypt in 648, his confiscated hoards reaching three million dinars {cite:shadharat-dhahab p. 215}."
  es: "En 641, Dios alivió la aflicción al enfrentar al visir contra el cadí al-Rafii, un juez corrupto que falsificaba escrituras, recibía sobornos y dinero de huérfanos y waqf, y que acudía a las oraciones del viernes ebrio y con testigos dispuestos a perjurar. Sus agentes fueron encarcelados y torturados; Ibn al-Ruwas murió bajo su peso. Al-Rafii fue llevado a Baalbek en una mula sin lomo, se paró en el borde de la ciudadela pidiendo permiso para rezar dos rak'as, y fue derribado por Dawud, el verdugo, quien lo despedazó antes de que llegara al agua. Su cómplice, el visir al-Amin, fue estrangulado en Egipto en 648, y sus tesoros confiscados alcanzaron los tres millones de dinares {cite:shadharat-dhahab p. 215}."
  fr: "En 641, Dieu mit fin à l'affliction en dressant le vizir contre le cadi al-Rafii, un juge corrompu, adepte des faux actes, des pots-de-vin, des détournements de fonds destinés aux orphelins et aux waqfs, qui se rendait à la prière du vendredi en état d'ivresse, accompagné de faux témoins. Ses agents furent emprisonnés et torturés; Ibn al-Ruwas mourut sous les coups. Al-Rafii fut conduit à Baalbek sur une mule sans selle, se tint au bord de la citadelle et demanda la permission de prier deux rak'as. Le bourreau Dawud le fit tomber d'un coup de pied et le mit en pièces avant qu'il n'atteigne l'eau. Son complice, le vizir al-Amin, fut étranglé en Égypte en 648, et ses trésors confisqués atteignirent trois millions de dinars (cf. shadharat-dhahab, p. 215)."
  ur: "641 میں خدا نے قاضی الرافی کے خلاف وزیر مقرر کر کے مصیبت کو ختم کر دیا - جعلی کاموں، رشوت، یتیموں اور وقف کے پیسوں کا ایک بدعنوان جج، جو تیار جھوٹے گواہوں کے ساتھ نشے میں دھت جمعہ کی نماز کے لیے سوار ہوا۔ اس کے ایجنٹوں کو جیلوں میں ڈالا گیا اور تشدد کا نشانہ بنایا گیا، ابن الرواس اس کے نیچے مر رہا تھا۔ الرافعی کو ایک ننگے پشت والے خچر پر بعلبک لے جایا گیا، قلعہ کے کنارے پر کھڑے ہو کر دو رکعت نماز پڑھنے کی اجازت مانگی گئی - اور اسے جلاد داؤد نے لات مار کر پانی تک پہنچنے سے پہلے ہی پھاڑ دیا۔ اس کے ساتھی وزیر الامین کا مصر میں 648 میں گلا گھونٹ دیا گیا تھا، اس کے ضبط شدہ ذخیرے تین ملین دینار تک پہنچ گئے تھے۔ 215}۔"
