label: { ar: "سقوط القاضي الرفيعي سنة 641هـ" }
summary:
  ar: "في سنة إحدى وأربعين وست مئة كشف الله الغمة بأن أوقع بين الوزير والقاضي الرفيعي فقبض على أعوانه الأرجاس وكبيرهم ابن الرواس فسجنوا وعذبوا بالصرب والعصر والمصادرة ومات ابن الرواس في العقوبة ثم أخرج الرفيعي من داره وحبس بالمقدمية ثم أخرج ليلاً فسجن بمغارة من نواحي البقاع ثم انقطع خبره فقيل خنق وقيل ألقى من شاهق في هوة وكان فاسد العقيدة دهرياً مستهزئاً بأمور الشريعة يخرج إلى الجمعة سكران ويعد شهود زور يدعون على أصحاب الأموال بأحكام مدبرة وأكل الرشا وأموال الأيتام والأوقاف وحمل إلى بعلبك على بغل بغير إكاف وأوقف على رأس القلعة فقال دعوني حتى أصلي ركعتين فصلى وأطال فرفسه داود سياف النقمة فوقع فما وصل إلى الماء إلا وقد تقطع وبقي صاحبه الوزير المسمى بالأمين إلى سنة ثمان وأربعين إذ شنق بالديار المصرية وأخذت حواصله فبلغت ثلاثة آلاف ألف دينار {cite:shadharat-dhahab p. 215}."
  en: "In 641 God lifted the affliction by setting the vizier against the qadi al-Rafii — a corrupt judge of forged deeds, bribes, orphans' and waqf monies, who rode to Friday prayers drunk with ready perjured witnesses. His agents were jailed and tortured, Ibn al-Ruwas dying under it; al-Rafii was carried to Baalbek on a bare-backed mule, stood at the citadel's rim asking leave to pray two rak'as — and was kicked over by Dawud the executioner, torn apart before he reached the water. His accomplice the vizier al-Amin was strangled in Egypt in 648, his confiscated hoards reaching three million dinars {cite:shadharat-dhahab p. 215}."
