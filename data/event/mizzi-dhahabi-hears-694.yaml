id: event/mizzi-dhahabi-hears-694
class: event
kind: other
label:
  ar: "الذهبي يسمع من المزي «صحيح البخاري»، سنة ٦٩٤هـ"
  en: "Al-Dhahabi hears Sahih al-Bukhari from al-Mizzi, 694/1294"
  ur: "ذہبی کا مزی سے «صحیح بخاری» کی سماعت، 694ھ/1294ء"
summary:
  ar: "قال الذهبي في شيخه: «سمعت منه سنة أربع وتسعين وأخذت عنه «صحيح البخاري» وغير ذلك»، وكان الذهبي يومئذ ابن نحو إحدى وعشرين سنة {cite:tarikh-islam-dhahabi p. 491}؛ ومن تلاميذ المزي أيضاً الذهبي وعبد الوهاب السبكي وصهره ابن كثير {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  en: "Al-Dhahabi says of his teacher: 'I heard from him in the year 694 and took from him the Sahih of al-Bukhari and other works', al-Dhahabi then being about twenty-one {cite:tarikh-islam-dhahabi p. 491}; al-Mizzi's students also included al-Dhahabi, Abd al-Wahhab al-Subki and his son-in-law Ibn Kathir {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  ur: "ذہبی اپنے شیخ کے بارے میں فرماتے ہیں: «میں نے 694 میں ان سے سماعت کی اور ان سے صحیح بخاری وغیرہ لی»، اس وقت ذہبی کی عمر تقریباً اکیس برس تھی {cite:tarikh-islam-dhahabi p. 491}؛ مزی کے شاگردوں میں ذہبی، عبد الوہاب سبکی اور ان کے داماد ابن کثیر شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}۔"
