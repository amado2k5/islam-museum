id: event/mizzi-dhahabi-hears-694
class: event
kind: other
label:
  ar: "الذهبي يسمع من المزي «صحيح البخاري»، سنة ٦٩٤هـ"
  en: "Al-Dhahabi hears Sahih al-Bukhari from al-Mizzi, 694/1294"
  ur: "ذہبی کا مزی سے «صحیح بخاری» کی سماعت، 694ھ/1294ء"
  es: "Al-Dhahabi escucha a Sahih al-Bukhari de al-Mizzi, 694/1294"
  fr: "Al-Dhahabi entend Sahih al-Bukhari d'al-Mizzi, 694/1294"
  tr: "Zehebi, H. 694 yılında El Mizzi'den “Sahih El-Buhari”yi duymuştur."
  id: "Al-Dhahabi mendengar dari Al-Mizzi “Sahih Al-Bukhari”, pada tahun 694 H."
summary:
  ar: "قال الذهبي في شيخه: «سمعت منه سنة أربع وتسعين وأخذت عنه «صحيح البخاري» وغير ذلك»، وكان الذهبي يومئذ ابن نحو إحدى وعشرين سنة {cite:tarikh-islam-dhahabi p. 491}؛ ومن تلاميذ المزي أيضاً الذهبي وعبد الوهاب السبكي وصهره ابن كثير {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  en: "Al-Dhahabi says of his teacher: 'I heard from him in the year 694 and took from him the Sahih of al-Bukhari and other works', al-Dhahabi then being about twenty-one {cite:tarikh-islam-dhahabi p. 491}; al-Mizzi's students also included al-Dhahabi, Abd al-Wahhab al-Subki and his son-in-law Ibn Kathir {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  ur: "ذہبی اپنے شیخ کے بارے میں فرماتے ہیں: «میں نے 694 میں ان سے سماعت کی اور ان سے صحیح بخاری وغیرہ لی»، اس وقت ذہبی کی عمر تقریباً اکیس برس تھی {cite:tarikh-islam-dhahabi p. 491}؛ مزی کے شاگردوں میں ذہبی، عبد الوہاب سبکی اور ان کے داماد ابن کثیر شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}۔"
  es: "Al-Dhahabi dice de su maestro: 'Escuché de él en el año 694 y tomé de él el Sahih de al-Bukhari y otras obras', al-Dhahabi tenía entonces unos veintiún años {cite:tarikh-islam-dhahabi p. 491}; entre los alumnos de al-Mizzi también se encontraban al-Dhahabi, Abd al-Wahhab al-Subki y su yerno Ibn Kathir {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  fr: "Al-Dhahabi dit de son maître: « J'ai eu de ses nouvelles en l'an 694 et j'ai reçu de lui le Sahih d'al-Bukhari et d'autres ouvrages », al-Dhahabi ayant alors environ vingt et un ans {cite:tarikh-islam-dhahabi p. 491}; parmi les élèves d'al-Mizzi figuraient également al-Dhahabi, Abd al-Wahhab al-Subki et son gendre Ibn Kathir {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
  tr: "El-Zahabi şeyhi hakkında şöyle demiştir: “Ondan 94 yılında ders aldım ve ondan ‘Sahih el-Buhari’yi ve başka şeyler öğrendim.” El-Zahabi o zamanlar yaklaşık yirmi bir yaşındaydı {kaynak:tarikh-islam-dhahabi s. 491}. El-Mizzi'nin öğrencileri arasında El-Zahabi, Abdül-Vahhab el-Subki ve damadı İbn Kathir de vardı {kaynak:encyclopaedia-of-islam-2 cilt 7 s. 240}."
  id: "Al-Dhahabi berkata tentang gurunya: “Saya mendengar darinya pada tahun sembilan puluh empat dan saya mengambil darinya ‘Sahih al-Bukhari’ dan kitab-kitab lainnya.” Al-Dhahabi saat itu berusia sekitar dua puluh satu tahun {cite:tarikh-islam-dhahabi p. 491}. Di antara murid-murid al-Mizzi juga terdapat al-Dhahabi, Abd al-Wahhab al-Subki, dan menantunya Ibn Kathir {cite:encyclopaedia-of-islam-2 vol. 7 p. 240}."
