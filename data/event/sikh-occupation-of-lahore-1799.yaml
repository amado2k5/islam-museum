id: event/sikh-occupation-of-lahore-1799
class: event
kind: conquest
label:
  ar: "رنجيت سينغ يأخذ لاهور، صفر ١٢١٤هـ/يوليو ١٧٩٩م"
  en: "Ranjit Singh takes Lahore, Safar 1214/July 1799"
  ur: "رنجیت سنگھ کا لہور پر قبضہ، صفر 1214ھ/جولائی 1799ء"
summary:
  ar: "بعد نحو ثلاثين سنة من حكم ثلاثي لزعماء السيخ في لاهور، انتزعها رنجيت سينغ من أولئك الزعماء الثلاثة في صفر ١٢١٤هـ/يوليو ١٧٩٩م؛ وأُعلن مهراجًا للبنجاب سنة ١٨٠٢م فاستعادت المدينة في عهده شيئًا من مكانتها وأصلح أسوارها وعمّر فيها {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  en: "After some thirty years of rule by a triumvirate of Sikh chieftains, Ranjit Singh wrested Lahore from its three lords in Safar 1214/July 1799; proclaimed maharaja of the Punjab in 1802, he restored much of the city's prestige, repairing its walls and embarking on a programme of construction {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  ur: "سکھ سرداروں کی تین طرفہ حکومت کے تقریباً تیس برس بعد رنجیت سنگھ نے صفر 1214ھ/جولائی 1799ء میں لہور ان تینوں سرداروں سے چھین لیا؛ 1802ء میں پنجاب کا مہاراجا قرار پانے پر اس کے عہد میں شہر نے اپنی قدر و منزلت کافی حد تک بحال کی، اس نے دیواریں درست کرائیں اور تعمیرات کا سلسلہ شروع کیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
