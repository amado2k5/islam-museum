id: event/sikh-occupation-of-lahore-1799
class: event
kind: conquest
label:
  ar: "رنجيت سينغ يأخذ لاهور، صفر ١٢١٤هـ/يوليو ١٧٩٩م"
  en: "Ranjit Singh takes Lahore, Safar 1214/July 1799"
  ur: "رنجیت سنگھ کا لہور پر قبضہ، صفر 1214ھ/جولائی 1799ء"
  es: "Ranjit Singh toma Lahore, Safar 1214/julio de 1799"
  fr: "Ranjit Singh prend Lahore, Safar 1214/juillet 1799"
  tr: "Ranjit Singh, Hicri 1214 Safer / Miladi 1799 Temmuz'unda Lahor'u ele geçirdi."
  id: "Ranjit Singh merebut Lahore, Safar 1214 H/Juli 1799 M"
summary:
  ar: "بعد نحو ثلاثين سنة من حكم ثلاثي لزعماء السيخ في لاهور، انتزعها رنجيت سينغ من أولئك الزعماء الثلاثة في صفر ١٢١٤هـ/يوليو ١٧٩٩م؛ وأُعلن مهراجًا للبنجاب سنة ١٨٠٢م فاستعادت المدينة في عهده شيئًا من مكانتها وأصلح أسوارها وعمّر فيها {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  en: "After some thirty years of rule by a triumvirate of Sikh chieftains, Ranjit Singh wrested Lahore from its three lords in Safar 1214/July 1799; proclaimed maharaja of the Punjab in 1802, he restored much of the city's prestige, repairing its walls and embarking on a programme of construction {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  ur: "سکھ سرداروں کی تین طرفہ حکومت کے تقریباً تیس برس بعد رنجیت سنگھ نے صفر 1214ھ/جولائی 1799ء میں لہور ان تینوں سرداروں سے چھین لیا؛ 1802ء میں پنجاب کا مہاراجا قرار پانے پر اس کے عہد میں شہر نے اپنی قدر و منزلت کافی حد تک بحال کی، اس نے دیواریں درست کرائیں اور تعمیرات کا سلسلہ شروع کیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  es: "Después de unos treinta años de gobierno de un triunvirato de jefes sijs, Ranjit Singh arrebató Lahore a sus tres señores en Safar 1214/julio de 1799; proclamado maharajá del Punjab en 1802, restauró gran parte del prestigio de la ciudad, reparando sus murallas y emprendiendo un programa de construcción {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  fr: "Après une trentaine d'années de règne d'un triumvirat de chefs sikhs, Ranjit Singh arracha Lahore à ses trois seigneurs en Safar 1214/juillet 1799; proclamé maharaja du Pendjab en 1802, il restaura une grande partie du prestige de la ville, réparant ses murs et entreprenant un programme de construction {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  tr: "Lahore'da yaklaşık otuz yıl süren Sih liderlerinin üçlü yönetiminden sonra, Ranjit Singh, Hicri 1214 Safar ayında/Miladi 1799 Temmuz'unda şehri bu üç liderden ele geçirdi ve 1802 yılında Pencap Maharajası ilan edildi. Böylece şehir, onun yönetimi sırasında eski statüsünün bir kısmını geri kazandı ve surlarını onardı ve geliştirdi. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}"
  id: "Setelah sekitar tiga puluh tahun pemerintahan tiga pemimpin Sikh di Lahore, Ranjit Singh merebutnya dari ketiga pemimpin tersebut pada bulan Safar 1214 H/Juli 1799 M; dan ia dinyatakan sebagai Maharaja Punjab pada tahun 1802 M, sehingga kota tersebut mendapatkan kembali sebagian statusnya selama pemerintahannya, dan ia memperbaiki tembok-temboknya serta mengembangkannya {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
