perspectives:
  - tradition: sunni
    id: sunni-author
    summary:
      ar: "يرجح الكتاب قتل المرتد بعد الاستتابة ويستند إلى حديث «من بدل دينه فاقتلوه»، وإلى ما رواه ابن أبي شيبة عن علي {cite:sallabi-ali-vol1 p. 302}. وينقل عن ابن تيمية أن قتل المرتد «حفظ لأهل الدين والدين» {cite:sallabi-ali-vol1 p. 303}."
      en: "The book prefers execution after a call to repentance, citing the hadith on the one who changes his religion and Ali's ruling in Ibn Abi Shayba; it quotes Ibn Taymiyya that killing the apostate protects the people of the religion {cite:sallabi-ali-vol1 p. 302}{cite:sallabi-ali-vol1 p. 303}."
