label: { ar: "أحكام علي في عقوبة المرتد والزنديق وطرق قتلهم", en: "Ali's rulings on the apostate and the zindiq, and the ways he killed them" }
summary:
  ar: "قال علي: يُستتاب المرتد ثلاثاً فإن عاد وإلا قُتل، وروي عنه في الزنديق قولان، وفي المرأة المرتدة قولان. وينقل الصلابي أن علياً قتل المرتدين بالسيف، وبالضرب حتى الموت، وبالإحراق بعد القتل، كما في قصة المستورد العجلي، وأنه أحرق السبئية {cite:sallabi-ali-vol1 p. 302}{cite:sallabi-ali-vol1 p. 303}."
  en: "Ali is reported to have said the apostate is asked to repent three times and then killed; the book gives two reports on the zindiq and two on women apostates. It lists the methods Ali used: the sword, beating to death, burning after killing (Mustawrid al-Ijli), and burning the Saba'iyya."
