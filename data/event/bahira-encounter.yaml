label: { en: "The monk Bahira at Busra", ar: "لقاء الراهب بحيرا ببصرى" }
summary:
  en: "When Abu Talib's trade caravan stopped at Busra in Syria, the monk Bahira (whose name the book gives as Jirjis) recognized the twelve-year-old Muhammad by 'the seal of prophethood' between his shoulders, and advised his uncle to take him home for fear of the Jews."
  ar: "لما نزل ركب أبي طالب التجاري ببصرى في الشام عرف الراهب بحيرا — واسمه عند الكتاب جرجيس — الفتى محمداً بصفته وخاتم النبوة في أسفل غضروف كتفه، وأوصى عمه بردّه ولا يقدم به إلى الشام خوفاً عليه من اليهود."
