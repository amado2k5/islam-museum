id: event/bahira-encounter
education:
  did_you_know:
    ar: "في رحلة أبي طالب التجارية إلى الشام لقي الركب الراهب بحيرا ببصرى فعرف الفتى محمداً بخاتم النبوة ووصف في كتبهم."
    en: "On Abu Talib's trade journey to Syria the caravan met the monk Bahira at Busra, who knew the boy Muhammad by the seal of prophecy described in their books."
    ur: "ابو طالب کے تجارتی سفرِ شام میں قافلہ بصریٰ کے راہب بحیرا سے ملا جس نے اپنے کتب کے بیان سے خاتمِ نبوت پہچان کر بچے محمد کو جانا۔"
    sources: [source/mubarakpuri-raheeq, source/zad-al-maad]
class: event
kind: other
label: { en: "The monk Bahira at Busra", ar: "لقاء الراهب بحيرا ببصرى", fr: "Le moine Bahira à Bosra", es: "El monje Bahira en Busra", ur: "بصرہ میں راہب بحیرہ" }
tags: ["nubuwat-browser", "nubuwat-nubuwwa"]
summary:
  en: "When Abu Talib's trade caravan stopped at Busra in Syria, the monk Bahira (whose name the book gives as Jirjis) recognized the twelve-year-old Muhammad by 'the seal of prophethood' between his shoulders, and advised his uncle to take him home for fear of the Jews."
  ar: "لما نزل ركب أبي طالب التجاري ببصرى في الشام عرف الراهب بحيرا — واسمه عند الكتاب جرجيس — الفتى محمداً بصفته وخاتم النبوة في أسفل غضروف كتفه، وأوصى عمه بردّه ولا يقدم به إلى الشام خوفاً عليه من اليهود."
  fr: "Quand la caravane de commerce d'Abu Talib fit halte à Bosra, en Syrie, le moine Bahira (que le livre nomme Jirjis) reconnut Muhammad, âgé de douze ans, au « sceau de la prophétie » entre ses épaules, et conseilla à son oncle de le ramener chez lui par crainte des Juifs."
  es: "Cuando la caravana comercial de Abu Talib se detuvo en Busra, Siria, el monje Bahira (cuyo nombre aparece en el libro como Jirjis) reconoció al pequeño Muhammad, de doce años, por el \"sello de la profecía\" que llevaba entre los hombros, y aconsejó a su tío que lo llevara a casa por temor a los judíos."
  ur: "جب ابو طالب کا تجارتی قافلہ شام کے شہر بصرہ پر رکا تو راہب بحیرہ ⁦(جس کا نام کتاب جرجی کے طور پر دیتی ہے)⁩ نے بارہ سالہ محمد کو اس کے کندھوں کے درمیان 'نبوت کی مہر' سے پہچانا، اور اپنے چچا کو یہودیوں کے خوف سے اسے گھر لے جانے کا مشورہ دیا۔"
