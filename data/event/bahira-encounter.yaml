    ar: "في رحلة أبي طالب التجارية إلى الشام لقي الركب الراهب بحيرا ببصرى فعرف الفتى محمداً بخاتم النبوة ووصف في كتبهم."
    en: "On Abu Talib's trade journey to Syria the caravan met the monk Bahira at Busra, who knew the boy Muhammad by the seal of prophecy described in their books."
