id: event/al-hadi-at-hawth-and-al-ghubayb-and-the-return-to-khiwan-on-1-dhu-al-qada-286
class: event
kind: other
label:
  ar: الهادي بحوث والغبيب في طلب ابن الضحاك والعودة إلى خيوان غرة ذي القعدة 286هـ
  en: Al-Hadi at Hawth and al-Ghubayb in pursuit of Ibn al-Dahhak and the return to Khiwan on 1 Dhu al-Qa'da 286 AH
  ur: حوث اور غبیب میں ابن ضحاک کی تلاش اور غرۂ ذی القعدہ 286ھ کو خیوان واپسی
summary:
  ar: يلقاه عسكر لأبي العتاهية قرب أثافت بعد خبر حربه ومهاجمة ابن الضحاك لأبي القاسم، فينزل حوث ويهدم دار رجل ظاهر ابن الضحاك ويصفح عن قطع عنبه، ثم يطلب ابن الضحاك بالغبيب فيجده خالياً فيأمر بقطع العنب وهدم المنازل، فيرسل القوم مشايخ يسألون الصفح فيؤمنهم ويستحلفهم ويعود إلى خيوان أول ذي القعدة.
  en: An army of Abu al-Atahiya meets him near Athafit after news of his fighting and of Ibn al-Dahhak's attack on Abu al-Qasim; he camps at Hawth, has the house of a man who had backed Ibn al-Dahhak pulled down but spares his vines at others' request, then pursues Ibn al-Dahhak to al-Ghubayb and finds it empty, orders vines cut and houses pulled down, grants the elders' plea for pardon, takes their oath and returns to Khiwan on 1 Dhu al-Qa'da.
  ur: اثافت کے قریب ابو العطاہیہ کا لشکر ان سے ملتا ہے جب ان کی لڑائی اور ابن ضحاک کے ابو القاسم پر حملے کی خبر پہنچتی ہے؛ وہ حوث میں اترتے ہیں، ابن ضحاک کا ساتھ دینے والے ایک شخص کا گھر گرواتے ہیں اور لوگوں کے کہنے پر اس کے انگور کاٹنے سے درگزر کرتے ہیں، پھر ابن ضحاک کی تلاش میں غبیب پہنچ کر اسے خالی پاتے ہیں، انگور کاٹنے اور گھر گرانے کا حکم دیتے ہیں، بزرگوں کی درخواست پر معاف کرتے ہیں، ان سے حلف لیتے ہیں اور غرۂ ذی القعدہ کو خیوان لوٹ آتے ہیں۔
