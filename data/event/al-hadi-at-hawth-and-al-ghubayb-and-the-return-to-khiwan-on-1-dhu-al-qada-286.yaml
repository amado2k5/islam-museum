id: event/al-hadi-at-hawth-and-al-ghubayb-and-the-return-to-khiwan-on-1-dhu-al-qada-286
class: event
kind: other
label:
  ar: الهادي بحوث والغبيب في طلب ابن الضحاك والعودة إلى خيوان غرة ذي القعدة 286هـ
  en: Al-Hadi at Hawth and al-Ghubayb in pursuit of Ibn al-Dahhak and the return to Khiwan on 1 Dhu al-Qa'da 286 AH
  ur: حوث اور غبیب میں ابن ضحاک کی تلاش اور غرۂ ذی القعدہ 286ھ کو خیوان واپسی
  es: "Al-Hadi en Hawth y al-Ghubayb en busca de Ibn al-Dahhak y el regreso a Khiwan el 1 de Dhu al-Qa'da 286 AH"
  fr: "Al-Hadi à Hawth et al-Ghubayb à la poursuite d'Ibn al-Dahhak et retour à Khiwan le 1 Dhu al-Qa'da 286 AH"
  tr: "Al-Hadi Buhuth ve Al-Ghabib, İbn Al-Dahhak'ı arıyor ve Zilkade'nin ilki olan Hayvan'a dönüyor 286 H."
  id: "Al-Hadi Buhuth dan Al-Ghabib mencari Ibnu Al-Dahhak dan kembali ke Khaywan, Dhu al-Qi'dah pertama 286 H."
summary:
  ar: يلقاه عسكر لأبي العتاهية قرب أثافت بعد خبر حربه ومهاجمة ابن الضحاك لأبي القاسم، فينزل حوث ويهدم دار رجل ظاهر ابن الضحاك ويصفح عن قطع عنبه، ثم يطلب ابن الضحاك بالغبيب فيجده خالياً فيأمر بقطع العنب وهدم المنازل، فيرسل القوم مشايخ يسألون الصفح فيؤمنهم ويستحلفهم ويعود إلى خيوان أول ذي القعدة.
  en: An army of Abu al-Atahiya meets him near Athafit after news of his fighting and of Ibn al-Dahhak's attack on Abu al-Qasim; he camps at Hawth, has the house of a man who had backed Ibn al-Dahhak pulled down but spares his vines at others' request, then pursues Ibn al-Dahhak to al-Ghubayb and finds it empty, orders vines cut and houses pulled down, grants the elders' plea for pardon, takes their oath and returns to Khiwan on 1 Dhu al-Qa'da.
  ur: اثافت کے قریب ابو العطاہیہ کا لشکر ان سے ملتا ہے جب ان کی لڑائی اور ابن ضحاک کے ابو القاسم پر حملے کی خبر پہنچتی ہے؛ وہ حوث میں اترتے ہیں، ابن ضحاک کا ساتھ دینے والے ایک شخص کا گھر گرواتے ہیں اور لوگوں کے کہنے پر اس کے انگور کاٹنے سے درگزر کرتے ہیں، پھر ابن ضحاک کی تلاش میں غبیب پہنچ کر اسے خالی پاتے ہیں، انگور کاٹنے اور گھر گرانے کا حکم دیتے ہیں، بزرگوں کی درخواست پر معاف کرتے ہیں، ان سے حلف لیتے ہیں اور غرۂ ذی القعدہ کو خیوان لوٹ آتے ہیں۔
  es: "Un ejército de Abu al-Atahiya lo recibe cerca de Athafit tras las noticias de su lucha y del ataque de Ibn al-Dahhak contra Abu al-Qasim; acampa en Hawth, ordena derribar la casa de un hombre que había apoyado a Ibn al-Dahhak, pero respeta sus viñas a petición de otros, luego persigue a Ibn al-Dahhak hasta al-Ghubayb y lo encuentra vacío, ordena cortar las viñas y derribar las casas, concede el perdón a la petición de los ancianos, toma su juramento y regresa a Khiwan el 1 de Dhu al-Qa'da."
  fr: "Une armée d'Abu al-Atahiya le rencontre près d'Athafit après avoir appris ses combats et l'attaque d'Ibn al-Dahhak contre Abu al-Qasim; il campe à Hawth, fait démolir la maison d'un homme qui avait soutenu Ibn al-Dahhak mais épargne ses vignes à la demande d'autres, puis poursuit Ibn al-Dahhak jusqu'à al-Ghubayb et la trouve vide, ordonne de couper les vignes et de démolir les maisons, accède à la demande de pardon des anciens, reçoit leur serment et retourne à Khiwan le 1 Dhu al-Qa'da."
  tr: "İbn el-Dahhak'ın Ebu el-Kâsım'a saldırısı ve savaş haberini aldıktan sonra, Athafta yakınlarında Ebu el-Atahiye'nin ordusuyla karşılaştı. Havth'a indi ve İbn el-Dahhak olduğu anlaşılan bir adamın evini yıktırdı ve üzümlerinin kesilmesini affetti. Sonra İbn el-Dahhak'ı el-Ghabib'de aradı ve onu boş buldu, bu yüzden üzümlerin kesilmesini ve evlerin yıkılmasını emretti. Halk, af dilemek için ileri gelenleri gönderdi, o da onlara güvence verdi, yemin ettirdi ve Zilhicce ayının başında Hayvan'a döndü."
  id: "Ia bertemu dengan pasukan Abu al-Atahiyah di dekat Athafat setelah mendengar kabar tentang perangnya dan serangan Ibn al-Dahhak terhadap Abu al-Qasim. Ia pergi ke Hawth dan menghancurkan rumah seorang pria yang tampaknya adalah Ibn al-Dahhak dan mengampuni pemotongan anggurnya. Kemudian ia mencari Ibn al-Dahhak di al-Ghabib dan mendapati tempat itu kosong, sehingga ia memerintahkan pemotongan anggur dan penghancuran rumah-rumah. Orang-orang mengirim para tetua untuk meminta ampunan, sehingga ia memberi mereka perlindungan dan membuat mereka bersumpah, lalu kembali ke Khaywan pada awal Dzul Qa'dah."
