label: { ar: "عمال النبي على اليمن", en: "The Prophet's Appointments in Yemen" }
summary:
  ar: "عند البلاذري: لما أسلم أهل اليمن بعد ما بلغهم ظهور رسول الله وجّه إليهم رسله وعماله لتعريفهم شرائع الإسلام وقبض صدقاتهم وجباية جزية من أقام على النصرانية واليهودية والمجوسية؛ فعن الواقدي أنه ولّى خالد بن سعيد بن العاص صنعاء وأرضها، وقال بعضهم إنما ولّى المهاجر بن أبي أمية المخزومي صنعاء فقبض وهو عليها، وقال آخرون إنما ولّاها أبو بكر، وولّى خالد بن سعيد مخاليف أعلى اليمن، وقال هشام بن الكلبي والهيثم بن عدي إنه ولّى المهاجر كِندة والصَّدِف؛ وأجمعوا أنه ولّى زياد بن لبيد البياضي الأنصاري حضرموت، وأبو موسى الأشعري زبيد ورمع وعدن والساحل، ومعاذ بن جبل الجُند وصيّر إليه القضاء وقبض جميع الصدقات باليمن، وعمرو بن حزم الأنصاري نجران — وقيل إنه ولّى أبا سفيان بن حرب نجران بعد عمرو؛ وكان في كتاب معاذ أن يأخذ الصدقة من الحنطة والشعير والتمر والزبيب والذرة، وأنه لما أُتي بأواقص البقر والعسل قال «لم أُمر في هذا بشيء»."
  en: "In al-Baladhuri: when the people of Yemen accepted Islam on hearing of the Prophet's ascendancy he sent them his envoys and agents to teach Islam's laws, collect their alms and levy jizya on those remaining Christian, Jewish or Magian; per al-Waqidi he appointed Khalid ibn Sa'id ibn al-As over San'a and its land, while others held that al-Muhajir ibn Abi Umayya al-Makhzumi was appointed over San'a and died in office, others that Abu Bakr appointed him, with Khalid ibn Sa'id over the highland districts of upper Yemen — Hisham ibn al-Kalbi and al-Haytham ibn Adi giving al-Muhajir Kinda and al-Sadif; all agreed he appointed Ziyad ibn Labid al-Bayadi al-Ansari over Hadramawt, Abu Musa al-Ash'ari over Zabid, Rima', Aden and the coast, Mu'adh ibn Jabal over al-Jund with the judiciary and collection of all Yemen's alms, and Amr ibn Hazm al-Ansari over Najran — some saying Abu Sufyan ibn Harb was appointed after him; Mu'adh's letter instructed him to take the alms on wheat, barley, dates, raisins and sorghum, and when offered the awaqis of cattle and honey he said 'I was not commanded concerning this'."
