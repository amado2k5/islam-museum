label: { ar: "عمال النبي على اليمن", en: "The Prophet's Appointments in Yemen", es: "Los nombramientos del Profeta en Yemen", fr: "Les nominations du Prophète au Yémen", ur: "یمن میں پیغمبر کی تقرری" }
summary:
  ar: "عند البلاذري: لما أسلم أهل اليمن بعد ما بلغهم ظهور رسول الله وجّه إليهم رسله وعماله لتعريفهم شرائع الإسلام وقبض صدقاتهم وجباية جزية من أقام على النصرانية واليهودية والمجوسية؛ فعن الواقدي أنه ولّى خالد بن سعيد بن العاص صنعاء وأرضها، وقال بعضهم إنما ولّى المهاجر بن أبي أمية المخزومي صنعاء فقبض وهو عليها، وقال آخرون إنما ولّاها أبو بكر، وولّى خالد بن سعيد مخاليف أعلى اليمن، وقال هشام بن الكلبي والهيثم بن عدي إنه ولّى المهاجر كِندة والصَّدِف؛ وأجمعوا أنه ولّى زياد بن لبيد البياضي الأنصاري حضرموت، وأبو موسى الأشعري زبيد ورمع وعدن والساحل، ومعاذ بن جبل الجُند وصيّر إليه القضاء وقبض جميع الصدقات باليمن، وعمرو بن حزم الأنصاري نجران — وقيل إنه ولّى أبا سفيان بن حرب نجران بعد عمرو؛ وكان في كتاب معاذ أن يأخذ الصدقة من الحنطة والشعير والتمر والزبيب والذرة، وأنه لما أُتي بأواقص البقر والعسل قال «لم أُمر في هذا بشيء»."
  en: "In al-Baladhuri: when the people of Yemen accepted Islam on hearing of the Prophet's ascendancy he sent them his envoys and agents to teach Islam's laws, collect their alms and levy jizya on those remaining Christian, Jewish or Magian; per al-Waqidi he appointed Khalid ibn Sa'id ibn al-As over San'a and its land, while others held that al-Muhajir ibn Abi Umayya al-Makhzumi was appointed over San'a and died in office, others that Abu Bakr appointed him, with Khalid ibn Sa'id over the highland districts of upper Yemen — Hisham ibn al-Kalbi and al-Haytham ibn Adi giving al-Muhajir Kinda and al-Sadif; all agreed he appointed Ziyad ibn Labid al-Bayadi al-Ansari over Hadramawt, Abu Musa al-Ash'ari over Zabid, Rima', Aden and the coast, Mu'adh ibn Jabal over al-Jund with the judiciary and collection of all Yemen's alms, and Amr ibn Hazm al-Ansari over Najran — some saying Abu Sufyan ibn Harb was appointed after him; Mu'adh's letter instructed him to take the alms on wheat, barley, dates, raisins and sorghum, and when offered the awaqis of cattle and honey he said 'I was not commanded concerning this'."
  es: "En al-Baladhuri: cuando el pueblo de Yemen aceptó el Islam al enterarse del ascenso del Profeta, les envió a sus enviados y agentes para enseñar las leyes del Islam, recolectar sus limosnas y cobrar la jizya a los que seguían siendo cristianos, judíos o magos; según al-Waqidi, nombró a Khalid ibn Sa'id ibn al-As sobre Saná y su tierra, mientras que otros sostenían que al-Muhajir ibn Abi Umayya al-Makhzumi fue nombrado sobre Saná y murió en el cargo, otros que Abu Bakr lo nombró, con Khalid ibn Sa'id sobre los distritos de las tierras altas del alto Yemen; Hisham ibn al-Kalbi y al-Haytham ibn Adi dieron a al-Muhajir Kinda y al-Sadif; Todos coincidieron en que nombró a Ziyad ibn Labid al-Bayadi al-Ansari sobre Hadramawt, a Abu Musa al-Ash'ari sobre Zabid, Rima', Adén y la costa, a Mu'adh ibn Jabal sobre al-Jund con el poder judicial y la recaudación de todas las limosnas de Yemen, y a Amr ibn Hazm al-Ansari sobre Najran; algunos dicen que Abu Sufyan ibn Harb fue nombrado después de él; la carta de Mu'adh le instruyó que tomara las limosnas sobre trigo, cebada, dátiles, pasas y sorgo, y cuando se le ofreció el awaqis de ganado y miel dijo: \"No se me ordenó sobre esto\"."
  fr: "Selon al-Baladhuri: lorsque les habitants du Yémen acceptèrent l’islam en apprenant l’ascension du Prophète, celui-ci leur envoya ses émissaires et agents pour enseigner les lois de l’islam, collecter leurs aumônes et prélever la jizya sur ceux qui restaient chrétiens, juifs ou mages; selon al-Waqidi, il nomma Khalid ibn Sa’id ibn al-As à la tête de Sanaa et de ses terres, tandis que d’autres soutenaient qu’al-Muhajir ibn Abi Umayya al-Makhzumi fut nommé à la tête de Sanaa et mourut en fonction, d’autres encore qu’Abu Bakr le nomma, avec Khalid ibn Sa’id à la tête des districts montagneux du Haut-Yémen — Hisham ibn al-Kalbi et al-Haytham ibn Adi donnant al-Muhajir Kinda et al-Sadif; Tous s'accordent à dire qu'il nomma Ziyad ibn Labid al-Bayadi al-Ansari à la tête du Hadramaout, Abu Musa al-Ash'ari à la tête de Zabid, Rima', Aden et de la côte, Mu'adh ibn Jabal à la tête d'al-Jund avec le pouvoir judiciaire et la collecte de toutes les aumônes du Yémen, et Amr ibn Hazm al-Ansari à la tête de Najran — certains affirmant qu'Abu Sufyan ibn Harb fut nommé après lui; la lettre de Mu'adh lui ordonnait de percevoir les aumônes sur le blé, l'orge, les dattes, les raisins secs et le sorgho, et lorsqu'on lui offrit l'awaqis de bétail et de miel, il répondit: « Cela ne m'a pas été ordonné »."
  ur: "البلادوری میں ہے: جب یمن کے لوگوں نے رسول اللہ کی بعثت کی خبر سن کر اسلام قبول کیا تو آپ نے ان کے پاس اپنے ایلچی اور نمائندے بھیجے کہ وہ اسلام کے احکام سکھائیں، ان کی خیرات وصول کریں اور باقی رہ جانے والے عیسائی، یہودی یا مجوسیوں پر جزیہ لگائیں۔ الواقدی کے مطابق اس نے خالد بن سعید بن العاص کو صنعاء اور اس کی سرزمین پر مقرر کیا، جب کہ دوسرے کا خیال تھا کہ المہاجر ابن ابی امیہ المخزومی صنعاء پر مقرر ہوا اور اس کے عہدے پر انتقال کر گیا، دوسروں کے نزدیک ابوبکر نے اسے خالد بن سعید کے ساتھ بالائی اضلاع ہسبطین اور یحییٰ المعروف پر مقرر کیا۔ ابن عدی المہاجر کندہ اور الصادف دینا؛ سب نے اس بات پر اتفاق کیا کہ اس نے زیاد بن لبید البیادی الانصاری کو حضرموت پر، ابو موسیٰ اشعری کو زبید، ریما، عدن اور ساحل پر، معاذ بن جبل کو یمن کے تمام صدقات کی عدلیہ اور جمع کرنے کے ساتھ الجند پر، اور عمرو بن حضان کو ابو الحارثان بعض نے ابو الحسن کو کہا۔ اس کے بعد مقرر کیا گیا تھا؛ معاذ کے خط میں ان کو گیہوں، جو، کھجور، کشمش اور جوار کا صدقہ لینے کا حکم دیا گیا اور جب مویشیوں اور شہد کے اوقیس پیش کیے گئے تو انہوں نے کہا کہ مجھے اس کا حکم نہیں دیا گیا تھا۔"
