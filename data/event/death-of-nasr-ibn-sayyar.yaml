summary:
  ar: "في سنة إحدى وثلاثين ومائة ذكر الطبري موت نصر بن سيار، وممّا كان في تلك السنة توجيه قحطبة ابنه الحسن إلى نصر وهو بقومس {cite:tabari-tarikh-abu-al-fadl j.7 p.403}."
  en: "In 131 Tabari records the death of Nasr ibn Sayyar. Among the events of that year was Qahtaba's dispatch of his son al-Hasan against Nasr, who was at Qumis {cite:tabari-tarikh-abu-al-fadl j.7 p.403}."
  es: "En 131 Tabari registra la muerte de Nasr ibn Sayyar. Entre los acontecimientos de ese año se encuentra el envío por parte de Qahtaba de su hijo al-Hasan contra Nasr, que se encontraba en Qumis {cite:tabari-tarikh-abu-al-fadl j.7 p.403}."
  fr: "En 131, Tabari relate la mort de Nasr ibn Sayyar. Parmi les événements de cette année figure l'envoi par Qahtaba de son fils al-Hasan contre Nasr, qui se trouvait à Qumis {cite:tabari-tarikh-abu-al-fadl j.7 p.403}."
