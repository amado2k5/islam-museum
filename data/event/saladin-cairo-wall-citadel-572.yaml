label: { ar: "بناء سور مصر وقلعة الجبل", en: "Building the wall of Egypt and the Citadel", es: "La construcción de la muralla de Egipto y la Ciudadela", fr: "Construction des murailles d'Égypte et de la citadelle", ur: "مصر کی دیوار اور قلعہ کی تعمیر" }
summary:
  ar: "في سنة اثنتين وسبعين أمر صلاح الدين ببناء السور الأعظم المحيط بمصر والقاهرة وجعل على بنائه الأمير بهاء الدين قراقوش وقال ابن الأثير دوره تسعة وعشرون ألف ذراع وثلاث مئة ذراع بالهاشمي، وفيها أمر بإنشاء قلعة بجبل المقطم وهي التي صارت دار السلطنة ولم تتم إلا في أيام السلطان الملك الكامل ابن أخي صلاح الدين وهو أول من سكنها، وبنى صلاح الدين تربة الإمام الشافعي {cite:tarikh-khulafa-minhaj-1434 p. 684-685}."
  en: "In 572 Salah al-Din ordered the great wall girding Fustat and Cairo — Baha' al-Din Qaraqush over its building, 29,300 Hashimi cubits round — and the citadel on the Muqattam mount, seat of sultans finished only under al-Malik al-Kamil, its first dweller. He also built Imam al-Shafi'i's turba {cite:tarikh-khulafa-minhaj-1434 p. 684-685}."
  es: "En 572, Saladino ordenó la construcción de la gran muralla que rodeaba Fustat y El Cairo —Baha' al-Din Qaraqush sobre su construcción, de 29.300 codos hashimíes de circunferencia— y la ciudadela en el monte Muqattam, sede de los sultanes, que solo se terminó bajo el mandato de al-Malik al-Kamil, su primer habitante. También construyó el turba del Imam al-Shafi'i {cite:tarikh-khulafa-minhaj-1434 p. 684-685}."
  fr: "En 572, Saladin ordonna la construction de la Grande Muraille encerclant Fustat et Le Caire – Bahá' al-Din Qaraqush supervisa son édification, d'un périmètre de 29 300 coudées hassimi – et de la citadelle du mont Muqattam, siège des sultans, qui ne fut achevée que sous le règne d'al-Malik al-Kamil, son premier occupant. Il fit également construire la turba de l'imam al-Shafi'i (voir: Tarikh-Khulafa-Minhaj-1434, p. 684-685)."
  ur: "572 میں صلاح الدین نے فوستات اور قاہرہ - بہاء الدین قراقش کو اس کی عمارت کے اوپر 29,300 ہاشمی ہاتھ گول - اور مقطم پہاڑ پر قلعہ بنانے کا حکم دیا، سلطانوں کی نشست صرف الملک الکامل کے تحت ختم ہوئی، اس کا پہلا ویل۔ اس نے امام شافعی کا تربہ بھی بنایا۔ 684-685}۔"
