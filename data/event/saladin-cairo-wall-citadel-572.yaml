label: { ar: "بناء سور مصر وقلعة الجبل" }
summary:
  ar: "في سنة اثنتين وسبعين أمر صلاح الدين ببناء السور الأعظم المحيط بمصر والقاهرة وجعل على بنائه الأمير بهاء الدين قراقوش وقال ابن الأثير دوره تسعة وعشرون ألف ذراع وثلاث مئة ذراع بالهاشمي، وفيها أمر بإنشاء قلعة بجبل المقطم وهي التي صارت دار السلطنة ولم تتم إلا في أيام السلطان الملك الكامل ابن أخي صلاح الدين وهو أول من سكنها، وبنى صلاح الدين تربة الإمام الشافعي {cite:tarikh-khulafa-minhaj-1434 p. 684-685}."
  en: "In 572 Salah al-Din ordered the great wall girding Fustat and Cairo — Baha' al-Din Qaraqush over its building, 29,300 Hashimi cubits round — and the citadel on the Muqattam mount, seat of sultans finished only under al-Malik al-Kamil, its first dweller. He also built Imam al-Shafi'i's turba {cite:tarikh-khulafa-minhaj-1434 p. 684-685}."
