label: { ar: "سقوط بلش مالقة والانهزام قبل الالتحام", en: "Fall of Velez-Malaga and the rout before contact", es: "La caída de Vélez-Málaga y la debacle previa al contacto.", fr: "La chute de Vélez-Malaga et la déroute avant le contact", ur: "Velez-Malaga کا زوال اور رابطے سے پہلے راستہ", tr: "Balsh Malaga'nın düşüşü ve savaş öncesi yenilgisi", id: "Kejatuhan Balsh Malaga dan kekalahan sebelum pertempuran" }
summary:
  ar: "خرج صاحب قشتالة قاصداً بلش مالقة ونزل عليها في ربيع الثاني سنة اثنتين وتسعين وثمانمائة وحاصرها؛ واجتمع صاحب غرناطة الزغل بالناس فأشاروا بالمسير لإغاثتها لعهد عقدوه، وأتى أهل وادي آش وغيرها وحشود البشرات وخرج صاحب غرناطة في الرابع والعشرين لربيع الثاني ووصل بلش فوجد العدو نازلاً عليها براً وبحراً فنزل بجبل هنالك وكثر لغط الناس وحملوا على النصارى من غير تعبية، وحين حركتهم للحملة بلغ السلطان الزغل أن غرناطة بايعت صاحب البيازين فالتقوا مع النصارى فاشلين وقبل الالتحام انهزموا وتبددت جموعهم مع كون النصارى خائفين وجلين منهم {cite:nafh-tib-maqqari p. 523-524}. ولما رأى أهل بلش تكالب العدو عليهم وإدبار جيوش المسلمين عنهم طلبوا الأمان فخرجوا يوم الجمعة عاشر جمادى الأولى من السنة، وأطاعت النصارى البلاد التي بشرقي مالقة وحصن قمارش {cite:nafh-tib-maqqari p. 524}."
  en: "The fall of Velez-Malaga (Jumada I 892): al-Zaghal's relief army — Granadans, Guadix men and Alpujarras levies — reached the besieged town only to break before contact when word came that Granada had risen for Boabdil; Velez surrendered on Friday 10 Jumada I and the whole east-Malaga coast submitted, opening the road to the great siege of Malaga itself {cite:nafh-tib-maqqari p. 523-524}."
  es: "La caída de Vélez-Málaga (Jumada I 892): el ejército de socorro de al-Zaghal —granadinos, guadixes y milicianos de la Alpujarra— llegó a la ciudad sitiada, pero se retiró antes de entrar en contacto con ella cuando llegó la noticia de que Granada se había alzado en armas por Boabdil; Vélez se rindió el viernes 10 de Jumada I y toda la costa oriental de Málaga se sometió, abriendo el camino al gran asedio de la propia Málaga {cite:nafh-tib-maqqari p. 523-524}."
  fr: "La chute de Vélez-Malaga (Jumada I 892): l'armée de secours d'al-Zaghal — Grenadins, hommes de Guadix et levées des Alpujarras — atteignit la ville assiégée mais se rompit avant le contact lorsque la nouvelle parvint que Grenade s'était soulevée pour Boabdil; Vélez se rendit le vendredi 10 Jumada I et toute la côte est de Malaga se soumit, ouvrant la voie au grand siège de Malaga elle-même {cite:nafh-tib-maqqari p. 523-524}."
  ur: "ویلز-مالگا کا زوال ⁦(جمعہ اول 892)⁩: الزغل کی امدادی فوج - گراناڈنز، گواڈکس مین اور الپوجراس لیویز - محصور قصبے میں صرف اس لیے پہنچی کہ رابطہ ختم ہو جائے جب یہ خبر آئی کہ غرناطہ بوعبدل کے لیے اٹھ گیا ہے۔ ویلز نے جمعہ 10 جمعہ کو ہتھیار ڈال دیے اور پورا مشرقی ملاگا ساحل پیش کر دیا، جس سے خود ملاگا کے عظیم محاصرے کا راستہ کھل گیا۔ 523-524}۔"
  tr: "Kastilya hükümdarı Belés ve Malaga'ya doğru yola çıktı ve Hicri 892 yılının Rebiü'l-Sani ayında oraya çıktı ve kuşattı. Granada hükümdarı Zağil, halkla görüştü ve aralarında yaptıkları bir anlaşma nedeniyle şehri kurtarmak için yürüyüşe geçmeyi önerdiler. Vadi Aş halkı ve diğerleri ile Alpujarras halkı geldi ve Granada hükümdarı Rebiü'l-Sani'nin 24. gününde yola çıktı ve Belés'e ulaştı. Orada düşmanın şehri karadan ve denizden kuşattığını gördü, bu yüzden oradaki bir dağa çıktı. Halkın gürültüsü arttı ve Hristiyanlara hazırlıksız saldırdılar. Sultan Zağil, onları sefere çıkardığında Granada'nın Albaicín hükümdarına biat ettiğini öğrendi. Bunun üzerine Hristiyanlarla karşılaştılar ve yenilgiye uğradılar. Çatışmadan önce yenilgiye uğradılar ve kalabalıkları dağıldı, Hristiyanlar ise onlardan korktu ve endişelendi. {cite:nafh-tib-maqqari s. 523-524}. Belş halkı düşmanın kendilerine saldırdığını ve Müslüman ordularının onlardan uzaklaştığını görünce, güvenlik istediler ve yılın Cemâdî Ula ayının onuncu günü olan Cuma günü oradan ayrıldılar ve Malaga'nın doğusundaki toprakların ve Komares kalesinin Hristiyanları itaat ettiler. {cite:nafh-tib-maqqari s. 524}."
  id: "Penguasa Kastilia berangkat menuju Belés dan Malaga dan mendarat di sana pada bulan Rabi’ al-Thani tahun 892 H dan mengepungnya. Penguasa Granada, Al-Zaghil, bertemu dengan rakyat dan mereka menyarankan untuk berbaris guna membebaskan kota itu karena perjanjian yang telah mereka buat. Penduduk Wadi Ash dan lainnya serta kerumunan Alpujarras datang, dan penguasa Granada berangkat pada tanggal 24 Rabi’ al-Thani dan mencapai Belés dan mendapati musuh mengepungnya dari darat dan laut, sehingga ia mendarat di sebuah gunung di sana, dan suara rakyat semakin keras dan mereka menyerang orang-orang Kristen tanpa persiapan. Ketika ia menggerakkan mereka untuk melakukan kampanye, Sultan Al-Zaghil mengetahui bahwa Granada telah berjanji setia kepada penguasa Albaicín, sehingga mereka bertemu dengan orang-orang Kristen dalam kekalahan, dan sebelum pertempuran, mereka dikalahkan dan kerumunan mereka tercerai-berai, sementara orang-orang Kristen takut dan khawatir terhadap mereka. {cite:nafh-tib-maqqari p. 523-524}. Ketika penduduk Balsh melihat musuh menyerang mereka dan pasukan Muslim berpaling dari mereka, mereka meminta keselamatan dan pergi pada hari Jumat, tanggal sepuluh Jumada al-Ula tahun itu, dan orang-orang Kristen di negeri-negeri di sebelah timur Malaga dan benteng Comares menaati mereka {cite:nafh-tib-maqqari hlm. 524}."
