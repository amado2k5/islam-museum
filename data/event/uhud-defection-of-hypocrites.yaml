id: event/uhud-defection-of-hypocrites
class: event
kind: defection
label: { en: "Defection of the hypocrites at Uhud", ar: "انسحاب المنافقين يوم أحد", es: "Deserción de los hipócritas en Uhud", fr: "Défection des hypocrites à Uhud", ur: "احد میں منافقین کا انحراف", tr: "Uhud günü münafıkların geri çekilmesi", id: "Penarikan diri kaum munafik pada hari Uhud" }
summary:
  ar: "في الطريق إلى أحد، وقد كان الجيش بقرب الشوط، تمرّد عبد الله بن أبي وانسحب بنحو ثلثمائة مقاتل بحجة رفض الرسول رأيه في المكوث. كشف هذا الانسحاب لأول مرة النفاق الذي كان مستتراً. همّت بنو حارثة من الأوس وبنو سلمة من الخزرج بالرجوع، ثم ثبتا بعون الله. وحاول عبد الله بن حرام والد جابر ردّ المنافقين فأبوا {cite:mubarakpuri-raheeq p.253}."
  en: "On the road to Uhud, when the army was near al-Shawt, Abdullah ibn Ubayy broke away and withdrew with some three hundred fighters on the pretext that the Messenger had rejected his advice to stay in Medina. This withdrawal revealed for the first time the hypocrisy that had been hidden. The Banu Haritha of the Aws and Banu Salama of the Khazraj wavered toward going back, then held firm by God's help; Abdullah ibn Haram, Jabir's father, tried to turn the hypocrites back and they refused {cite:mubarakpuri-raheeq p.253}."
  es: "En el camino a Uhud, cuando el ejército se encontraba cerca de al-Shawt, Abdullah ibn Ubayy se separó del grupo y se retiró con unos trescientos combatientes con el pretexto de que el Mensajero había rechazado su consejo de permanecer en Medina. Esta retirada reveló por primera vez la hipocresía que había permanecido oculta. Los Banu Haritha de Aws y los Banu Salama de Khazraj vacilaron entre regresar, pero finalmente se mantuvieron firmes con la ayuda de Dios; Abdullah ibn Haram, padre de Jabir, intentó hacer volver a los hipócritas, pero estos se negaron {cite:mubarakpuri-raheeq p.253}."
  fr: "Sur la route d'Uhud, alors que l'armée approchait d'al-Shawt, Abdullah ibn Ubayy fit défection et se retira avec environ trois cents combattants, prétextant que le Messager avait rejeté son conseil de rester à Médine. Ce retrait révéla pour la première fois l'hypocrisie qui avait été dissimulée. Les Banu Haritha de la tribu des Aws et les Banu Salama de la tribu des Khazraj hésitèrent à rebrousser chemin, puis, avec l'aide de Dieu, ils restèrent fermes. Abdullah ibn Haram, le père de Jabir, tenta de faire rebrousser chemin aux hypocrites, mais ils refusèrent (voir Mubarakpuri-Raheeq, p. 253)."
  ur: "احد کے راستے میں جب لشکر الشوط کے قریب تھا، عبداللہ ابن ابی نے اس بہانے سے تین سو کے قریب جنگجوؤں کے ساتھ دستبرداری اختیار کی کہ رسول اللہ نے مدینہ میں رہنے کا مشورہ رد کر دیا تھا۔ اس دستبرداری سے پہلی بار وہ منافقت آشکار ہوئی جو چھپائی گئی تھی۔ اوس کے بنو حارثہ اور خزرج کے بنو سلمہ واپس جانے کے لیے ڈگمگا گئے، پھر خدا کی مدد سے مضبوط ہو گئے۔ جابر کے والد عبداللہ بن حرام نے منافقین کو پیچھے ہٹانے کی کوشش کی اور انہوں نے انکار کر دیا۔"
  tr: "Uhud yolunda, ordu savaş alanına yaklaştığında, Abdullah ibn Ubay isyan etti ve Peygamber'in kalma tavsiyesini reddettiğini iddia ederek yaklaşık üç yüz savaşçısıyla geri çekildi. Bu geri çekilme, gizlenmiş olan ikiyüzlülüğü ilk kez ortaya çıkardı. Evs kabilesinden Beni Haritha ve Hazrec kabilesinden Beni Salama geri dönmeye meyilliydiler, ancak daha sonra Allah'ın yardımıyla direndiler. Cabir'in babası Abdullah ibn Haram, münafıkları geri dönmeye ikna etmeye çalıştı, ancak onlar reddettiler."
  id: "Dalam perjalanan menuju Uhud, ketika pasukan mendekati medan perang, Abdullah ibn Ubay memberontak dan mundur bersama sekitar tiga ratus pejuang, dengan alasan bahwa Nabi telah menolak nasihatnya untuk tetap tinggal. Mundurnya mereka ini untuk pertama kalinya mengungkap kemunafikan yang selama ini disembunyikan. Bani Haritha dari Aws dan Bani Salama dari Khazraj cenderung untuk kembali, tetapi kemudian, dengan pertolongan Allah, mereka tetap teguh. Abdullah ibn Haram, ayah Jabir, mencoba membujuk kaum munafik untuk kembali, tetapi mereka menolak."
