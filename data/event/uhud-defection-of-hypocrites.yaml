label: { en: "Defection of the hypocrites at Uhud", ar: "انسحاب المنافقين يوم أحد" }
summary:
  ar: "في الطريق إلى أحد، وقد كان الجيش بقرب الشوط، تمرّد عبد الله بن أبي وانسحب بنحو ثلثمائة مقاتل بحجة رفض الرسول رأيه في المكوث. كشف هذا الانسحاب لأول مرة النفاق الذي كان مستتراً. همّت بنو حارثة من الأوس وبنو سلمة من الخزرج بالرجوع، ثم ثبتا بعون الله. وحاول عبد الله بن حرام والد جابر ردّ المنافقين فأبوا {cite:mubarakpuri-raheeq p.253}."
  en: "On the road to Uhud, when the army was near al-Shawt, Abdullah ibn Ubayy broke away and withdrew with some three hundred fighters on the pretext that the Messenger had rejected his advice to stay in Medina. This withdrawal revealed for the first time the hypocrisy that had been hidden. The Banu Haritha of the Aws and Banu Salama of the Khazraj wavered toward going back, then held firm by God's help; Abdullah ibn Haram, Jabir's father, tried to turn the hypocrites back and they refused {cite:mubarakpuri-raheeq p.253}."
