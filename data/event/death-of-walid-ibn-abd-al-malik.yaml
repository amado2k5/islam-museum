label: { ar: "وفاة الوليد بن عبد الملك" }
summary:
  ar: "في سنة ست وتسعين، في النصف من جمادى الآخرة، توفي الوليد بن عبد الملك، وذكر الطبري أقوالا مختلفة في مدة خلافته ومبلغ عمره {cite:tabari-tarikh-abu-al-fadl j.6 p.495}، وعند السيوطي مات في نصف جمادى الآخرة سنة ست وتسعين وله إحدى وخمسون سنة وقال الذهبي عاش الجهاد في أيامه وفتحت فيها الفتوحات العظيمة كأيام عمر بن الخطاب {cite:tarikh-khulafa-minhaj-1434 p. 369} ويذكر الكتاب أن الوليد أراد خلع سليمان وتولية ابنه عبد العزيز، فأبى سليمان، ولم يبايع أحد إلا الحجاج وقتيبة وخواص، وأن عمر بن عبد العزيز امتنع عن البيعة لعبد العزيز. وتوفي الوليد يوم السبت في النصف من جمادى الآخرة سنة 96هـ. {cite:salabi-umayyad-state-2020 p.140-141}"
