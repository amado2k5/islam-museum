label: { ar: "وفاة الوليد بن عبد الملك", en: "Death of al-Walid ibn Abd al-Malik" }
summary:
  ar: "في سنة ست وتسعين، في النصف من جمادى الآخرة، توفي الوليد بن عبد الملك، وذكر الطبري أقوالا مختلفة في مدة خلافته ومبلغ عمره {cite:tabari-tarikh-abu-al-fadl j.6 p.495}، وعند السيوطي مات في نصف جمادى الآخرة سنة ست وتسعين وله إحدى وخمسون سنة وقال الذهبي عاش الجهاد في أيامه وفتحت فيها الفتوحات العظيمة كأيام عمر بن الخطاب {cite:tarikh-khulafa-minhaj-1434 p. 369} ويذكر الكتاب أن الوليد أراد خلع سليمان وتولية ابنه عبد العزيز، فأبى سليمان، ولم يبايع أحد إلا الحجاج وقتيبة وخواص، وأن عمر بن عبد العزيز امتنع عن البيعة لعبد العزيز. وتوفي الوليد يوم السبت في النصف من جمادى الآخرة سنة 96هـ. {cite:salabi-umayyad-state-2020 p.140-141}"
  en: "In the year 96, in the middle of Jumada II, al-Walid ibn Abd al-Malik died. Al-Tabari gives differing accounts of the length of his caliphate and of his age {cite:tabari-tarikh-abu-al-fadl j.6 p.495}. In al-Suyuti he died in the middle of Jumada II of the year 96, aged fifty-one; al-Dhahabi said that jihad lived in his days and great conquests were opened in them, as in the days of Umar ibn al-Khattab {cite:tarikh-khulafa-minhaj-1434 p. 369}. The book relates that al-Walid wanted to depose Sulayman and install his son Abd al-Aziz, but Sulayman refused; no one pledged allegiance except al-Hajjaj, Qutayba and a select few, and Umar ibn Abd al-Aziz refused to pledge allegiance to Abd al-Aziz. Al-Walid died on a Saturday in the middle of Jumada II of the year 96 AH {cite:salabi-umayyad-state-2020 p.140-141}."
