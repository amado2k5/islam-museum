label: { ar: "وفاة الوليد بن عبد الملك", en: "Death of al-Walid ibn Abd al-Malik", es: "Muerte de al-Walid ibn Abd al-Malik", fr: "Mort d'al-Walid ibn Abd al-Malik", ur: "ولید بن عبد الملک کی وفات", tr: "El-Valid ibn Abd el-Malik'in Ölümü", id: "Kematian Al-Walid ibn Abd al-Malik" }
summary:
  ar: "في سنة ست وتسعين، في النصف من جمادى الآخرة، توفي الوليد بن عبد الملك، وذكر الطبري أقوالا مختلفة في مدة خلافته ومبلغ عمره {cite:tabari-tarikh-abu-al-fadl j.6 p.495}، وعند السيوطي مات في نصف جمادى الآخرة سنة ست وتسعين وله إحدى وخمسون سنة وقال الذهبي عاش الجهاد في أيامه وفتحت فيها الفتوحات العظيمة كأيام عمر بن الخطاب {cite:tarikh-khulafa-minhaj-1434 p. 369} ويذكر الكتاب أن الوليد أراد خلع سليمان وتولية ابنه عبد العزيز، فأبى سليمان، ولم يبايع أحد إلا الحجاج وقتيبة وخواص، وأن عمر بن عبد العزيز امتنع عن البيعة لعبد العزيز. وتوفي الوليد يوم السبت في النصف من جمادى الآخرة سنة 96هـ. {cite:salabi-umayyad-state-2020 p.140-141}"
  en: "In the year 96, in the middle of Jumada II, al-Walid ibn Abd al-Malik died. Al-Tabari gives differing accounts of the length of his caliphate and of his age {cite:tabari-tarikh-abu-al-fadl j.6 p.495}. In al-Suyuti he died in the middle of Jumada II of the year 96, aged fifty-one; al-Dhahabi said that jihad lived in his days and great conquests were opened in them, as in the days of Umar ibn al-Khattab {cite:tarikh-khulafa-minhaj-1434 p. 369}. The book relates that al-Walid wanted to depose Sulayman and install his son Abd al-Aziz, but Sulayman refused; no one pledged allegiance except al-Hajjaj, Qutayba and a select few, and Umar ibn Abd al-Aziz refused to pledge allegiance to Abd al-Aziz. Al-Walid died on a Saturday in the middle of Jumada II of the year 96 AH {cite:salabi-umayyad-state-2020 p.140-141}."
  es: "En el año 96, a mediados de Jumada II, murió al-Walid ibn Abd al-Malik. Al-Tabari da relatos diferentes sobre la duración de su califato y su edad {cite:tabari-tarikh-abu-al-fadl j.6 p.495}. En al-Suyuti murió a mediados de Jumada II del año 96, a la edad de cincuenta y un años; al-Dhahabi dijo que la yihad vivió en sus días y se abrieron grandes conquistas en ellos, como en los días de Umar ibn al-Khattab {cite:tarikh-khulafa-minhaj-1434 p. 369}. El libro relata que al-Walid quería deponer a Sulayman e instalar a su hijo Abd al-Aziz, pero Sulayman se negó; Nadie juró lealtad excepto al-Hajjaj, Qutayba y unos pocos elegidos, y Umar ibn Abd al-Aziz se negó a jurar lealtad a Abd al-Aziz. Al-Walid murió un sábado a mediados de Jumada II del año 96 AH {cite:salabi-umayyad-state-2020 p.140-141}."
  fr: "En l'an 96, au milieu du califat de Jumada II, al-Walid ibn Abd al-Malik mourut. Al-Tabari donne des versions différentes quant à la durée de son califat et à son âge (voir: Tabari, Tarikh Abu al-Fadl, vol. 6, p. 495). Selon al-Suyuti, il mourut au milieu du califat de l'an 96, à l'âge de cinquante et un ans; al-Dhahabi affirme que le jihad était pratiqué sous son règne et que de grandes conquêtes furent entreprises, comme au temps d'Umar ibn al-Khattab (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 369). L'ouvrage rapporte qu'al-Walid souhaitait déposer Sulayman et installer son fils Abd al-Aziz, mais que Sulayman refusa. Seuls al-Hajjaj, Qutayba et quelques rares personnes prêtèrent allégeance, et Umar ibn Abd al-Aziz refusa de prêter allégeance à Abd al-Aziz. Al-Walid mourut un samedi, au milieu du mois de Jumada II de l'an 96 de l'Hégire (source: salabi-umayyad-state-2020, p. 140-141)."
  ur: "سنہ 96 میں جمادی الثانی کے وسط میں الولید بن عبد الملک کا انتقال ہوا۔ الطبری نے اپنی خلافت کی طوالت اور اس کی عمر کے بارے میں مختلف بیانات پیش کیے ہیں {حوالہ: طبری-تاریخ-ابو الفضل ج 6 ص 495}۔ السیوطی میں ان کا انتقال جمادی الثانی سنہ 96 کے وسط میں، اکیاون سال کی عمر میں ہوا۔ الذہبی نے کہا کہ جہاد ان کے دور میں تھا اور ان میں عظیم فتوحات کا آغاز ہوا جیسا کہ عمر بن الخطاب کے زمانے میں ہوا تھا۔ 369}۔ کتاب بتاتی ہے کہ الولید سلیمان کو معزول کرنا اور اپنے بیٹے عبد العزیز کو تخت نشین کرنا چاہتا تھا، لیکن سلیمان نے انکار کر دیا۔ حجاج، قتیبہ اور چند ایک کے علاوہ کسی نے بیعت نہیں کی اور عمر بن عبد العزیز نے عبد العزیز کی بیعت کرنے سے انکار کردیا۔ الولید کی وفات سنہ 96 ہجری کے درمیان جمادی الثانی کے ایک ہفتہ کے دن ہوئی۔"
  tr: "Hicri 96 yılında, Cemâde-i Ahiret'in 15. gününde el-Valid ibn Abdülmalik vefat etti. Taberi, halifeliğinin süresi ve yaşı hakkında farklı rivayetler aktarmaktadır (kaynak: Taberi-tarikh-abu-al-fadl, cilt 6, s. 495). Suyuti, Hicri 96 yılında Cemâde-i Ahiret'in 15. gününde 51 yaşında vefat ettiğini belirtmektedir. Zehebi ise, onun döneminde cihadın geliştiğini ve Ömer ibn el-Hattab dönemine benzer büyük fetihler elde edildiğini söylemiştir (kaynak: Tarikat-hulafa-minhaj-1434, s. 369). Kitapta, el-Valid'in Süleyman'ı tahttan indirip oğlu Abdülaziz'i halifeliğe atamak istediği, ancak Süleyman'ın bunu reddettiği belirtilmektedir. El-Haccac, Kuteybe ve birkaç yakın arkadaşı dışında kimse biat etmedi. Ömer ibn Abdülaziz de Abdülaziz'e biat etmeyi reddetti. El-Valid, Hicri 96 yılının Cemadi el-Ahiret ayının 15. Cumartesi günü vefat etti. {cite:salabi-umayyad-state-2020 pp. 140-141}"
  id: "Pada tahun 96 H, tanggal 15 Jumada al-Akhirah, al-Walid ibn Abd al-Malik wafat. Al-Tabari menyebutkan berbagai catatan mengenai lamanya masa kekhalifahannya dan usianya {kutip:tabari-tarikh-abu-al-fadl vol. 6 hlm. 495}. Al-Suyuti menyatakan bahwa ia wafat pada tanggal 15 Jumada al-Akhirah tahun 96 H pada usia 51 tahun. Al-Dhahabi mengatakan bahwa jihad berkembang pesat selama pemerintahannya, dan penaklukan besar dicapai, mirip dengan era Umar ibn al-Khattab {kutip:tarikh-khulafa-minhaj-1434 hlm. 369}. Kitab tersebut menyebutkan bahwa al-Walid ingin menggulingkan Sulaiman dan mengangkat putranya Abd al-Aziz, tetapi Sulaiman menolak. Tidak seorang pun yang menyatakan baiat kecuali al-Hajjaj, Qutaybah, dan beberapa sahabat dekat. Umar ibn Abd al-Aziz juga menolak untuk menyatakan baiat kepada Abd al-Aziz. Al-Walid wafat pada hari Sabtu, tanggal 15 Jumada al-Akhirah, 96 H {cite:salabi-umayyad-state-2020 pp. 140-141}."
