class: event
kind: other
label: { ar: "البيعة لعلي بن موسى بولاية العهد", en: "The Pledge to Ali ibn Musa as Heir Apparent", es: "El juramento a Ali ibn Musa como heredero aparente", fr: "Le serment d'allégeance à Ali ibn Musa comme héritier présomptif", ur: "علی بن موسیٰ کا بطور وارث ظاہری عہد", tr: "Ali ibn Musa'ya veliaht prens olarak bağlılık.", id: "Kesetiaan kepada Ali ibn Musa sebagai Putra Mahkota" }
summary:
  ar: "في سنة إحدى ومائتين جعل المأمون علي بن موسى وليّ عهده، وأمر الجند بترك السواد ولبس الخضرة {cite:tabari-tarikh-abu-al-fadl j.8 p.554}، وفي السنة نفسها خرجت المطوّعة للنكير على الفساق {cite:tabari-tarikh-abu-al-fadl j.8 p.551}."
  en: "In 201 al-Ma'mun named Ali ibn Musa his heir apparent and ordered the troops to abandon black and wear green {cite:tabari-tarikh-abu-al-fadl j.8 p.554}; in the same year the self-appointed enforcers of morality (al-mutawwi'a) went out to denounce the transgressors {cite:tabari-tarikh-abu-al-fadl j.8 p.551}."
  es: "En 201, al-Ma'mun nombró a Ali ibn Musa su heredero aparente y ordenó a las tropas que abandonaran el negro y vistieran de verde {cite:tabari-tarikh-abu-al-fadl j.8 p.554}; en el mismo año, los autoproclamados guardianes de la moral (al-mutawwi'a) salieron a denunciar a los transgresores {cite:tabari-tarikh-abu-al-fadl j.8 p.551}."
  fr: "En 201, al-Ma'mun nomma Ali ibn Musa son héritier présomptif et ordonna aux troupes d'abandonner le noir et de porter du vert {cite:tabari-tarikh-abu-al-fadl j.8 p.554}; la même année, les gardiens autoproclamés de la moralité (al-mutawwi'a) sortirent pour dénoncer les transgresseurs {cite:tabari-tarikh-abu-al-fadl j.8 p.551}."
  ur: "201 میں المامون نے علی بن موسیٰ کو اپنا وارث ظاہر کیا اور فوجوں کو حکم دیا کہ وہ سیاہ رنگ چھوڑ کر سبز لباس پہنیں۔ اسی سال اخلاقیات کے خود ساختہ نافذ کرنے والے ⁦(المتویع)⁩ فاسقوں کی مذمت کے لیے نکلے {حوالہ: طبری-تاریخ-ابو الفضل ج8 ص 551}۔"
  tr: "201 yılında, El-Ma'mun, Ali ibn Musa'yı veliaht prensi yaptı ve askerlere siyahı bırakıp yeşil giymelerini emretti {kaynak: Tabari-tarikh-ebu-al-fadl, 8. cilt, s. 554}. Aynı yıl, gönüllüler ahlaksız insanları kınamak için yola çıktılar {kaynak: Tabari-tarikh-ebu-al-fadl, 8. cilt, s. 551}."
  id: "Pada tahun 201, Al-Ma’mun menjadikan Ali ibn Musa sebagai putra mahkotanya, dan memerintahkan para prajurit untuk meninggalkan warna hitam dan mengenakan warna hijau {cite:tabari-tarikh-abu-al-fadl j.8 p.554}. Pada tahun yang sama, para sukarelawan turun ke jalan untuk mengecam orang-orang yang tidak bermoral {cite:tabari-tarikh-abu-al-fadl j.8 p.551}."
