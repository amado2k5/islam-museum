summary:
  ar: "بطاقة أولية للحرب الأنجلو-عثمانية من ١٨٠٧ إلى ١٨٠٩م، حرب البحر المتوسط في زمن نابليون التي ضمت محاولة الإسكندرية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Anglo-Turkish War of 1807–1809, the Napoleonic-era Mediterranean war that included the Alexandria attempt; its sources are not yet checked on the page."
  es: "Ficha de borrador para la guerra anglo-turca de 1807-1809, la guerra mediterránea de la era napoleónica que incluyó el intento de Alejandría; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de convocation pour la guerre anglo-turque de 1807-1809, la guerre méditerranéenne de l'époque napoléonienne qui comprenait la tentative d'Alexandrie; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1807-1809 کی اینگلو-ترک جنگ کے لیے ڈرافٹ کارڈ، نپولین دور کی بحیرہ روم کی جنگ جس میں اسکندریہ کی کوشش شامل تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1807-1809 İngiliz-Osmanlı Savaşı'na (Napolyon dönemindeki Akdeniz Savaşı, İskenderiye girişimi de dahil) dair ön hazırlık kartı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Perang Inggris-Ottoman tahun 1807-1809, Perang Mediterania pada masa Napoleon, yang mencakup upaya Alexandria; sumber-sumber di halaman ini belum ditinjau."
