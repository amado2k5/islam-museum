id: event/marinid-entry-tunis-748
class: event
kind: conquest
label:
  ar: دخول أبي الحسن المريني إفريقية
  en: Abu al-Hasan al-Marini's entry into Ifriqiya
  es: "La entrada de Abu al-Hasan al-Marini en Ifriqiya"
  fr: "L'entrée d'Abou al-Hasan al-Marini en Ifriqiya"
  ur: "ابو الحسن المرینی کا افریقیہ میں داخلہ"
  tr: "Ebu el-Hasan el-Marini'nin Afrika'ya girişi"
  id: "Masuknya Abu al-Hasan al-Marini ke Afrika"
summary:
  ar: "رحل السلطان أبو الحسن المريني في صفر سنة 748هـ يجر الدنيا بما حملت بعد أن بلغه مهلك السلطان أبي بكر الحفصي وولي عهده، فلقيه أهل القاصية بإفريقية بوهران آتين بيعتهم رغبة ورهبة، ودخل الحضرة في الزي والاحتفال في جمادى الآخرة من سنته، وخفيت الأصوات وسكنت الدهماء، وخضعت له بجاية وقسطنطينة فصرف أبناءها الحفصيين إلى المغرب بإقطاعاتهم، وسيقت العساكر في طلب الأمير أبي حفص الهارب حتى أدركوه بأرض الحامة فذبحوه وبعثوا برأسه."
  en: "The sultan Abu al-Hasan al-Marini marched in Safar 748 dragging the world behind him when news came of Sultan Abu Bakr al-Hafsi's and his heir's deaths; the lords of Ifriqiya's marches met him at Oran bearing homage in desire and awe, and he entered the capital in ceremony in Jumada II, the voices hushed and the commons stilled; Bejaia and Constantine submitted, their Hafsid princes pensioned off to the Maghreb, while the fugitive amir Abu Hafs was hunted down in the Hama country, slaughtered, and his head sent on."
  es: "El sultán Abu al-Hasan al-Marini marchó en Safar 748 arrastrando al mundo tras de sí cuando llegaron las noticias de la muerte del sultán Abu Bakr al-Hafsi y su heredero; los señores de las marcas de Ifriqiya lo recibieron en Orán rindiéndole homenaje con deseo y reverencia, y entró en la capital en una ceremonia en Jumada II, las voces calladas y el pueblo en silencio; Bejaia y Constantino se sometieron, sus príncipes hafsíes fueron enviados al Magreb, mientras que el emir fugitivo Abu Hafs fue perseguido en la región de Hama, asesinado y su cabeza enviada."
  fr: "Le sultan Abu al-Hasan al-Marini marcha en Safar 748, entraînant le monde derrière lui, lorsque parvint la nouvelle de la mort du sultan Abu Bakr al-Hafsi et de son héritier; les seigneurs des marches d'Ifriqiya l'accueillirent à Oran, lui rendant hommage avec désir et crainte, et il entra dans la capitale en grande pompe le 12 Jumada, les voix se turent et le peuple resta silencieux; Béjaïa et Constantin se soumirent, leurs princes hafsides furent envoyés au Maghreb, tandis que l'émir fugitif Abu Hafs fut traqué dans le pays de Hama, massacré, et sa tête envoyée."
  ur: "سلطان ابو الحسن المرینی صفر 748 میں اس وقت دنیا کو اپنے پیچھے گھسیٹتے ہوئے کوچ کیا جب سلطان ابو بکر الحفصی اور ان کے وارث کی موت کی خبر آئی۔ عفریقیہ کے مارچوں کے سرداروں نے اوران میں اس سے ملاقات کی اور وہ خواہش اور خوف کے ساتھ خراج تحسین پیش کرتے ہوئے، اور وہ جمعہ دوم میں تقریب میں دارالحکومت میں داخل ہوا، آوازیں خاموش ہوگئیں اور عام لوگ خاموش ہوگئے۔ بیجیا اور قسطنطین نے عرض کیا، ان کے حفصد شہزادوں کو مغرب تک پنشن دی گئی، جب کہ مفرور امیر ابو حفص کو حما کے ملک میں شکار کیا گیا، ذبح کیا گیا، اور اس کا سر بھیجا گیا۔"
  tr: "Sultan Ebu el-Hasan el-Marini, Sultan Ebu Bekir el-Hafsi ve veliaht prensinin ölüm haberini aldıktan sonra, Hicri 748 yılının Safer ayında, dünyayı tüm varlığıyla birlikte sürükleyerek yola çıktı. Uzak İfrikiye bölgesinin halkı, arzu ve korkuyla biat etmek için Oran'da onu karşıladı. O yılın Cemadi el-Ahire bayramındaki kıyafetler ve kutlamalarla başkente girdi. Sesler sustu ve halk sessizliğe büründü. Bejaia ve Konstantin ona boyun eğdiler, bu yüzden Hafsid oğullarını tımar topraklarıyla birlikte Mağrip'e gönderdi. Kaçan Prens Ebu Hafs'ı aramak için ordular gönderildi ve onu Hamma topraklarında yakaladılar, orada öldürdüler ve başını gönderdiler."
  id: "Sultan Abu al-Hasan al-Marini berangkat pada bulan Safar tahun 748 H, menyeret seluruh dunia beserta isinya, setelah mengetahui kematian Sultan Abu Bakr al-Hafsi dan putra mahkotanya. Penduduk daerah terpencil Ifriqiya menemuinya di Oran, datang untuk menyatakan kesetiaan mereka karena keinginan dan rasa takut. Ia memasuki ibu kota dengan pakaian dan perayaan Jumada al-Akhirah tahun itu. Suara-suara terdiam dan massa menjadi tenang. Bejaia dan Konstantinus tunduk kepadanya, sehingga ia mengirim putra-putra Hafsid mereka ke Maghreb bersama wilayah kekuasaan mereka. Pasukan dikirim untuk mencari Pangeran Abu Hafs yang melarikan diri hingga mereka menemukannya di tanah al-Hamma, lalu mereka membunuhnya dan mengirimkan kepalanya."
