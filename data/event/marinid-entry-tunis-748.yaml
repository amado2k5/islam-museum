id: event/marinid-entry-tunis-748
class: event
kind: conquest
label:
  ar: دخول أبي الحسن المريني إفريقية
  en: Abu al-Hasan al-Marini's entry into Ifriqiya
summary:
  ar: "رحل السلطان أبو الحسن المريني في صفر سنة 748هـ يجر الدنيا بما حملت بعد أن بلغه مهلك السلطان أبي بكر الحفصي وولي عهده، فلقيه أهل القاصية بإفريقية بوهران آتين بيعتهم رغبة ورهبة، ودخل الحضرة في الزي والاحتفال في جمادى الآخرة من سنته، وخفيت الأصوات وسكنت الدهماء، وخضعت له بجاية وقسطنطينة فصرف أبناءها الحفصيين إلى المغرب بإقطاعاتهم، وسيقت العساكر في طلب الأمير أبي حفص الهارب حتى أدركوه بأرض الحامة فذبحوه وبعثوا برأسه."
  en: "The sultan Abu al-Hasan al-Marini marched in Safar 748 dragging the world behind him when news came of Sultan Abu Bakr al-Hafsi's and his heir's deaths; the lords of Ifriqiya's marches met him at Oran bearing homage in desire and awe, and he entered the capital in ceremony in Jumada II, the voices hushed and the commons stilled; Bejaia and Constantine submitted, their Hafsid princes pensioned off to the Maghreb, while the fugitive amir Abu Hafs was hunted down in the Hama country, slaughtered, and his head sent on."
