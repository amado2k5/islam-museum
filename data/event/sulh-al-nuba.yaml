summary:
  ar: "عند البلاذري عن الوليد بن كثير عن يزيد بن أبي حبيب عن أبي الخير: لما فتح المسلمون مصر بعث عمرو بن العاص إلى القرى التي حولها الخيل ليطأهم فبعث عقبة بن نافع الفهري — وكان نافع أخا العاص لأمه — فدخلت خيولهم أرض النوبة كما تدخل صوائف الروم فلقي المسلمون بالنوبة قتالاً شديداً فرشقوهم بالنبل حتى جرح عامتهم فانصرفوا بجراحات كثيرة وحدق مفقوءة فسُمّوا دماة الحدق فلم يزالوا على ذلك حتى ولّى مصر عبد الله بن سعد بن أبي سرح فسألوه الصلح والموادعة فأجابهم على غير جزية لكن على هدنة ثلاثمائة رأس في كل سنة وعلى أن يهدي المسلمون إليهم طعاماً بقدر ذلك. وعن شيخ من حمير شهد النوبة مرتين في ولاية عمر: لم يرَ قوماً أحدّ في حرب منهم وأحدهم يقول للمسلم أين تحب أن أضع سهمي منك فلا يخطئه فصافوهم يوماً فرموهم حتى ذهبت الأعين فعُدّت مائة وخمسين عيناً مفقوءة فقالوا ما لهؤلاء خير من الصلح إن سلبهم لقليل وإن نكايتهم لشديدة فلم يصالحهم عمر ولم يزل يكالبهم حتى نُزع وولّى عبد الله بن سعد فصالحهم. وبالنوبة ذهبت عين معاوية بن حديج الكندي وكان أعور."
  en: "In al-Baladhuri via al-Walid ibn Kathir via Yazid ibn Abi Habib via Abu al-Khayr: when the Muslims opened Egypt Amr ibn al-As sent the cavalry to the villages around it to trample them, sending Uqba ibn Nafi' al-Fihri — Nafi' being al-As's maternal brother; their horses entered Nubia like the Romans' summer raids, the Muslims met fierce fighting and were showered with arrows till most were wounded, returning with many wounds and gouged eyes — called 'eye-bleeders' — until Abdallah ibn Sa'd ibn Abi Sarh governed Egypt; they asked him for peace and truce which he granted not on jizya but on a truce of three hundred heads yearly, the Muslims gifting them equal food. A Himyari shaykh who twice witnessed Nubia under Umar: no people sharper in war — one would ask a Muslim 'where would you like me to place my arrow?' and not miss; they lined up one day and shot till eyes were gone — a hundred and fifty gouged eyes counted — so they said nothing better than peace with them, their spoil little and their vexation severe; Umar never made peace with them and kept harassing them until he died, and Abdallah ibn Sa'd made peace with them. At Nubia Mu'awiya ibn Khudayj al-Kindi's eye was lost — he was one-eyed."
  es: "En al-Baladhuri vía al-Walid ibn Kathir vía Yazid ibn Abi Habib vía Abu al-Khayr: cuando los musulmanes abrieron Egipto, Amr ibn al-As envió la caballería a las aldeas de los alrededores para arrasarlas, enviando a Uqba ibn Nafi' al-Fihri —Nafi' era el hermano materno de al-As—; sus caballos entraron en Nubia como las incursiones de verano de los romanos, los musulmanes encontraron una feroz lucha y fueron llovidos de flechas hasta que la mayoría resultaron heridos, regresando con muchas heridas y ojos arrancados —llamados 'hemorrágicos oculares'— hasta que Abdallah ibn Sa'd ibn Abi Sarh gobernó Egipto; le pidieron paz y tregua, que él concedió no con jizya sino con una tregua de trescientas cabezas al año, a cambio de que los musulmanes les regalaran comida igual. Un jeque himyari que presenció Nubia en dos ocasiones bajo el dominio de Umar: no había pueblo más astuto en la guerra; uno le preguntaba a un musulmán \"¿dónde quieres que coloque mi flecha?\" y no fallaba; un día se alinearon y dispararon hasta que perdieron los ojos —se contaron ciento cincuenta ojos arrancados—, así que no dijeron nada mejor que la paz con ellos, su botín es escaso y su aflicción severa; Umar nunca hizo las paces con ellos y siguió hostigándolos hasta su muerte, y Abdallah ibn Sa'd hizo las paces con ellos. En Nubia, Mu'awiya ibn Khudayj al-Kindi perdió un ojo; era tuerto."
  fr: "D'après al-Baladhuri, transmis par al-Walid ibn Kathir, Yazid ibn Abi Habib et Abu al-Khayr: lorsque les musulmans conquirent l'Égypte, Amr ibn al-As envoya sa cavalerie aux villages environnants pour les écraser, dépêchant Uqba ibn Nafi' al-Fihri – Nafi' étant le frère maternel d'al-As; leurs chevaux pénétrèrent en Nubie comme les Romains lors de leurs raids estivaux; les musulmans rencontrèrent de féroces combats et furent criblés de flèches, la plupart étant blessés et revenant avec de nombreuses blessures et les yeux crevés – surnommés « les saigneurs d'yeux » – jusqu'à ce qu'Abdallah ibn Sa'd ibn Abi Sarh gouverne l'Égypte; ils lui demandèrent la paix et une trêve qu'il accorda non pas sous forme de jizya, mais sous forme d'une trêve de trois cents têtes par an, les musulmans leur offrant en contrepartie une quantité égale de nourriture. Un cheikh himyarite, témoin à deux reprises des combats en Nubie sous le règne d'Umar, affirmait: « Nul peuple n'était plus redoutable à la guerre. On pouvait demander à un musulman: “Où voulez-vous que je place ma flèche ?” et ne jamais rater sa cible. Un jour, ils s'alignèrent et tirèrent jusqu'à ce que tous les yeux soient arrachés – on compta cent cinquante yeux crevés. » Aussi, la seule réponse acceptable fut-elle de faire la paix avec eux, car leur butin était minime et leur vexation intense. Umar ne fit jamais la paix avec eux et continua de les harceler jusqu'à sa mort, tandis qu'Abdallah ibn Sa'd conclut la paix. En Nubie, Mu'awiya ibn Khudayj al-Kindi perdit un œil – il était borgne."
  ur: "البلادوری میں ولید بن کثیر کے ذریعے یزید بن ابی حبیب کے ذریعے ابو الخیر کے ذریعے: جب مسلمانوں نے مصر کو کھولا تو عمرو بن العاص نے گھڑ سواروں کو اس کے آس پاس کے دیہاتوں میں بھیجا تاکہ انہیں روند ڈالیں، عقبہ بن نافع الفہری کو بھیجا جو نافع المال کے بھائی تھے۔ ان کے گھوڑے رومیوں کے موسم گرما کے چھاپوں کی طرح نوبیا میں داخل ہوئے، مسلمانوں کو شدید لڑائی کا سامنا کرنا پڑا اور ان پر تیر برسائے گئے یہاں تک کہ زیادہ تر زخمی ہو گئے، بہت سے زخموں اور پھٹی ہوئی آنکھوں کے ساتھ واپس آئے جسے 'آنکھوں سے خون نکالنے والا' کہا جاتا ہے- یہاں تک کہ عبداللہ بن سعد ابن ابی سرح نے مصر پر حکومت کی۔ انہوں نے اس سے صلح اور صلح کی درخواست کی جو اس نے جزیہ پر نہیں دی بلکہ سالانہ تین سو سروں کی جنگ بندی پر دی، مسلمان انہیں برابر کا کھانا تحفے میں دیتے تھے۔ ایک حمیری شیخ جس نے عمر کے دور میں دو بار نوبیا کا مشاہدہ کیا: کوئی بھی جنگ میں تیز نہیں - ایک مسلمان سے پوچھے گا کہ 'آپ چاہتے ہیں کہ میں اپنا تیر کہاں رکھوں؟' اور یاد نہیں؛ انہوں نے ایک دن قطار میں کھڑے ہو کر گولی ماری یہاں تک کہ آنکھیں چلی گئیں - ایک سو پچاس آنکھوں کی گنتی ہوئی - لہذا انہوں نے ان کے ساتھ امن سے بہتر کچھ نہیں کہا، ان کی لوٹ مار بہت کم اور ان کی شدید پریشانی۔ عمر نے کبھی ان سے صلح نہیں کی اور انہیں ایذا دیتے رہے یہاں تک کہ وہ مر گئے اور عبداللہ بن سعد نے ان سے صلح کر لی۔ نوبیہ میں معاویہ بن خدیج الکندی کی آنکھ ضائع ہوگئی - وہ ایک آنکھ والا تھا۔"
  tr: "El-Baladhuri, El-Walid bin Kathir'den, o da Yazid bin Abi Habib'den, o da Ebu El-Khair'den rivayetle şöyle der: Müslümanlar Mısır'ı fethettiğinde, Amr bin El-Aas, çevredeki köyleri ezmek için atlar gönderdi. Uqba bin Nafi El-Fihri'yi (Nafi, El-Aas'ın anne tarafından üvey kardeşiydi) gönderdi ve atları, Romalıların yazları gibi Nubia topraklarına girdi. Müslümanlar Nubia'da şiddetli çatışmalarla karşılaştılar ve ok yağmuruna tutuldular, çoğu yaralandı. Birçok yara ve oyulmuş gözlerle geri döndüler, bu yüzden onlara \"kanlı gözlüler\" denildi. Abdullah bin Saad bin Abi Sarh Mısır valisi olarak atanana kadar bu durumda kaldılar. Ondan barış ve ateşkes istediler ve o da haraç ödemeden, ancak her yıl üç yüz kafa karşılığında ateşkes ve Müslümanların buna oranla yiyecek göndermesi şartıyla kabul etti. Himyarlı bir şeyhten rivayet edildiğine göre, Ömer döneminde Nubia Savaşı'na iki kez şahit olmuş ve şöyle demiştir: “Savaşta onlardan daha vahşi bir kavim görmedim. Onlardan biri bir Müslümana, ‘Okumu nereye saplamamı istersin?’ derdi ve asla ıskalamazdı. Bir gün karşı karşıya geldiler ve gözleri kör olana kadar ok attılar. Yüz elli gözün kör olduğu sayıldı. Dediler ki: ‘Bu kavim için barıştan daha iyi bir yol yok. Ganimetleri az, ama saldırıları şiddetli.’ Fakat Ömer onlarla barışmadı ve görevden alınıncaya ve Abdullah ibn Saad atanıncaya kadar onlara baskı yapmaya devam etti. Abdullah ibn Saad onlarla barıştı.” Nubia Savaşı sırasında, tek gözlü olan Muaviye ibn Hudeyc el-Kindi bir gözünü kaybetti."
  id: "Al-Baladhuri, berdasarkan riwayat Al-Walid bin Kathir, berdasarkan riwayat Yazid bin Abi Habib, berdasarkan riwayat Abu Al-Khair: Ketika kaum Muslim menaklukkan Mesir, Amr bin Al-Aas mengirim kuda ke desa-desa di sekitarnya untuk menginjak-injak mereka. Ia mengirim Uqba bin Nafi Al-Fihri — dan Nafi adalah saudara tiri Al-Aas dari pihak ibu — dan kuda-kuda mereka memasuki tanah Nubia seperti masuknya musim panas bangsa Romawi. Kaum Muslim menghadapi pertempuran sengit di Nubia, dan mereka dihujani panah hingga sebagian besar dari mereka terluka. Mereka kembali dengan banyak luka dan mata yang dicungkil, sehingga mereka disebut \"orang-orang bermata darah.\" Mereka tetap dalam keadaan itu sampai Abdullah bin Saad bin Abi Sarh diangkat menjadi gubernur Mesir. Mereka meminta perdamaian dan gencatan senjata kepadanya, dan ia menyetujuinya tanpa upeti, tetapi dengan syarat gencatan senjata berupa tiga ratus kepala setiap tahun, dan bahwa kaum Muslim harus mengirimkan makanan kepada mereka sesuai dengan jumlah tersebut. Dan diriwayatkan dari seorang syekh dari Himyar yang menyaksikan Perang Nubia dua kali pada masa pemerintahan Umar: Dia berkata, “Aku belum pernah melihat suatu kaum yang lebih ganas dalam pertempuran daripada mereka. Salah seorang dari mereka akan berkata kepada seorang Muslim, ‘Di mana kau ingin aku mengarahkan panahku padamu?’ dan dia tidak pernah meleset. Maka suatu hari mereka saling berhadapan, dan mereka saling menembakkan panah hingga banyak mata yang hilang. Seratus lima puluh mata dihitung telah dicungkil. Mereka berkata, ‘Tidak ada cara yang lebih baik bagi kaum ini selain berdamai. Rampasan mereka sedikit, tetapi serangan mereka sangat hebat.’ Tetapi Umar tidak berdamai dengan mereka dan terus menekan mereka sampai dia dicopot dan Abdullah ibn Saad diangkat, dan dia berdamai dengan mereka.” Dan selama Perang Nubia, Muawiyah ibn Hudayj al-Kindi, yang bermata satu, kehilangan satu matanya."
