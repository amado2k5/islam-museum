id: event/ibn-humayd-meets-abu-jafars-collecting-party-and-kills-nine-foot-soldiers-295
class: event
kind: skirmish
label:
  ar: "ابن حميد يلقى فرقة تحصيل أبي جعفر فيقتل تسعة من رجالتها ويأخذ ثلاثة أفراس، 295هـ"
  en: "Ibn Humayd meets Abu Ja'far's collecting party, kills nine of its foot soldiers and takes three horses, 295 AH, pp. 365-366"
  ur: "ابن حمید کا ابو جعفر کی وصولی ٹولی سے مقابلہ، نو پیادوں کا قتل اور تین گھوڑوں کا قبضہ، 295ھ، ص365-366"
  es: "Ibn Humayd se enfrenta al grupo de apresamiento de Abu Ja'far, mata a nueve de sus soldados de infantería y se apodera de tres caballos, 295 AH, pp. 365-366."
summary:
  ar: "لما حان أجل أرزاق الجند ولم يصل من الجباية شيء، أشار الحسن بن أحمد البعداني ببقايا الصلح على بني الحارث، فأُرسل إليهم ثلاثة فرسان وخمسة عشر راجلاً، فلقيهم ابن حميد فقتل منهم تسعة من الرجالة، وأخذ ثلاثة أفراس، وأصاب رجلاً منهم بجراح كثيرة هو صالح بن أبي الطيب، وأفلت الباقون."
  en: "When the soldiers' pay fell due and no revenue had come in, Hasan ibn Ahmad al-Ba'dani advised that the remnants of an old settlement be collected from Banu al-Harith. A party of three horsemen and fifteen foot soldiers was sent. Ibn Humayd met them, killed nine of the foot soldiers, took three horses, and wounded a man named Salih ibn Abi al-Tayyib badly; the rest escaped."
  ur: "جب لشکر کی تنخواہوں کا وقت آیا اور جباہی سے کچھ نہ آیا، تو حسن بن احمد البعدانی نے مشورہ دیا کہ بنو حارث پر باقی رہ جانے والی پرانی صلح کی رقم وصول کی جائے۔ تین گھڑسوار اور پندرہ پیادے بھیجے گئے، ابن حمید نے ان سے مقابلہ کیا، نو پیادوں کو قتل کیا، تین گھوڑے لے لیے، اور صالح بن ابی الطیب نامی ایک شخص کو شدید زخمی کیا؛ باقی بچ نکلے۔"
  es: "Cuando venció el plazo para pagar a los soldados y no se habían recibido ingresos, Hasan ibn Ahmad al-Ba'dani aconsejó que se recogieran los restos de un antiguo asentamiento de Banu al-Harith. Se envió un grupo de tres jinetes y quince soldados de infantería. Ibn Humayd los interceptó, mató a nueve de los soldados de infantería, capturó tres caballos e hirió gravemente a un hombre llamado Salih ibn Abi al-Tayyib; el resto escapó."
