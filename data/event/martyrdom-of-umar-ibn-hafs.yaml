label: { ar: "استشهاد عمر بن حفص وخراب العباسية", en: "The Martyrdom of Umar ibn Hafs and the Ruin of al-Abbasiyya", es: "El martirio de Umar ibn Hafs y la ruina de al-Abbasiyya", fr: "Le martyre d'Umar ibn Hafs et la ruine d'al-Abbasiyya", ur: "عمر بن حفص کی شہادت اور عباسیہ کی بربادی۔", tr: "Ömer ibn Hafs'ın şehadeti ve Abbasiliğin yıkılması", id: "Kemartiran Umar bin Hafs dan kehancuran Abbasiyah" }
summary:
  ar: "عند البلاذري: ولّى المنصور عمر بن حفص بن عثمان بن قبيصة بن أبي صفرة العتكي — وهو الذي سبي هزار مرد وكان المنصور به معجباً، وفي موضع آخر «ولّى عمر بن حفص هزارمرد مكانه» — فدخل إفريقية وغزا منها حتى بلغ أقصى بلاد البربر وابتنى هناك مدينة سماها العباسية ثم إن أبا خاتم السدراتي الإباضي من أهل سدراتة وهو مولى لكندة قاتله فاستشهد وجماعة من أهل بيته وانتقض الثغر وهدمت تلك المدينة التي ابتناها."
  en: "In al-Baladhuri: al-Mansur appointed Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki — 'he who captured Hazarmard', whom al-Mansur admired, while elsewhere the text reads 'he appointed Umar ibn Hafs Hazarmard in his place' — he entered Ifriqiya, raided to the farthest Berber lands and built there a city he named al-Abbasiyya; then Abu Khatim al-Saddrati al-Ibadi of Sadrata's people, a mawla of Kinda, fought him and he was martyred with a group of his household, the frontier rebelled, and the city he built was demolished."
  es: "En al-Baladhuri: al-Mansur nombró a Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki — 'el que capturó a Hazarmard', a quien al-Mansur admiraba, mientras que en otra parte el texto dice 'nombró a Umar ibn Hafs Hazarmard en su lugar' — entró en Ifriqiya, saqueó las tierras bereberes más lejanas y construyó allí una ciudad que llamó al-Abbasiyya; luego Abu Khatim al-Saddrati al-Ibadi del pueblo de Sadrata, un mawla de Kinda, luchó contra él y fue martirizado con un grupo de su familia, la frontera se rebeló y la ciudad que construyó fue demolida."
  fr: "Dans al-Baladhuri: al-Mansur nomma Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki — « celui qui captura Hazarmard », qu'al-Mansur admirait, tandis qu'ailleurs le texte dit « il nomma Umar ibn Hafs Hazarmard à sa place » — il entra en Ifriqiya, mena des raids jusqu'aux terres berbères les plus reculées et y construisit une ville qu'il nomma al-Abbasiyya; puis Abu Khatim al-Saddrati al-Ibadi du peuple de Sadrata, un mawla de Kinda, le combattit et il fut martyrisé avec un groupe de sa maisonnée, la frontière se rebella et la ville qu'il avait construite fut démolie."
  ur: "البلادوری میں ہے: المنصور نے عمر بن حفص ابن عثمان ابن قبیصہ ابن ابی صفر العتاکی کو مقرر کیا - 'وہ جس نے ہزارمرد کو پکڑا'، جس کی المنصور نے تعریف کی، جب کہ دوسری جگہ عبارت یہ ہے کہ 'اس نے عمر بن حفص کو ہزارمرد کو مقرر کیا - اس کی جگہ برقری میں داخل ہوا'۔ زمین کی اور وہاں ایک شہر بنایا جس کا نام اس نے العباسیہ رکھا۔ اس کے بعد سدراتہ کی قوم کے ابو خاتم الصدراتی العبادی جو کہ کندہ کا ایک مولا تھا، اس سے لڑا اور وہ اپنے خاندان کے ایک گروہ کے ساتھ شہید ہو گیا، سرحدی باغی ہو گئے اور اس نے جو شہر بنایا تھا اسے منہدم کر دیا گیا۔"
  tr: "El-Baladhuri'ye göre: El-Mansur, Hazar Mard'ı yakalayan Ömer bin Hafs bin Osman bin Kubeysa bin Ebu Sufra el-Ataki'yi görevlendirdi ve El-Mansur ona hayran kaldı. Başka bir yerde ise, “Ömer bin Hafs, Hazar Mard'ı kendi yerine atadı” - böylece Hazar Mard Afrika'ya girdi ve oradan Berberi topraklarının en uzak noktalarına kadar baskınlar düzenledi ve orada El-Abbasiya adını verdiği bir şehir kurdu. Daha sonra, Kinda'nın himayesinde olan Sidrata halkından Ebu Hatim el-Sidrati el-İbadi onunla savaştı ve Hazar Mard ailesinden bir grupla birlikte şehit oldu, sınır aşıldı ve kurduğu şehir yıkıldı."
  id: "Menurut Al-Baladhuri: Al-Mansur menunjuk Umar bin Hafs bin Uthman bin Qubaysa bin Abi Sufra Al-Ataki — yang menangkap Hazar Mard, dan Al-Mansur mengaguminya. Di tempat lain, “Umar bin Hafs menunjuk Hazar Mard sebagai penggantinya” — sehingga ia memasuki Afrika dan melakukan penyerangan dari sana hingga mencapai wilayah terjauh suku Berber dan membangun sebuah kota di sana yang ia sebut Al-Abbasiya. Kemudian Abu Khatim Al-Sidrati Al-Ibadi dari kaum Sidrata, yang merupakan sekutu Kinda, memeranginya dan ia gugur sebagai syahid bersama sekelompok keluarganya, dan perbatasan berhasil ditembus dan kota yang dibangunnya dihancurkan."
