label: { ar: "استشهاد عمر بن حفص وخراب العباسية", en: "The Martyrdom of Umar ibn Hafs and the Ruin of al-Abbasiyya" }
summary:
  ar: "عند البلاذري: ولّى المنصور عمر بن حفص بن عثمان بن قبيصة بن أبي صفرة العتكي — وهو الذي سبي هزار مرد وكان المنصور به معجباً، وفي موضع آخر «ولّى عمر بن حفص هزارمرد مكانه» — فدخل إفريقية وغزا منها حتى بلغ أقصى بلاد البربر وابتنى هناك مدينة سماها العباسية ثم إن أبا خاتم السدراتي الإباضي من أهل سدراتة وهو مولى لكندة قاتله فاستشهد وجماعة من أهل بيته وانتقض الثغر وهدمت تلك المدينة التي ابتناها."
  en: "In al-Baladhuri: al-Mansur appointed Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki — 'he who captured Hazarmard', whom al-Mansur admired, while elsewhere the text reads 'he appointed Umar ibn Hafs Hazarmard in his place' — he entered Ifriqiya, raided to the farthest Berber lands and built there a city he named al-Abbasiyya; then Abu Khatim al-Saddrati al-Ibadi of Sadrata's people, a mawla of Kinda, fought him and he was martyred with a group of his household, the frontier rebelled, and the city he built was demolished."
