summary:
  ar: "وقعة نهاوند التي تسمى فتوح الفتوح: كاتبت الفرسُ ملكهم يزدجرد وهو بمرو فحرّكهم، وكاتب الملوك بين الباب والسند وخراسان وحلوان فاجتمعوا إلى نهاوند. وكان النعمان بن مقرّن محاصرًا أهل السوس مع أبي سبرة وزِرّ محاصرًا جنديسابور فجاء كتاب عمر بصرف النعمان إلى أهل نهاوند فسار إليهم فكانت الوقعة العظيمة التي ختم الله بها ملك فارس {cite:kamil-ibn-al-athir p. 390-391}."
  en: "Nahavand — «the victory of victories«: when the Persians stirred Yazdegerd at Marw and the kings between al-Bab, Sind, Khurasan and Hulwan joined forces at Nahavand, 'Umar detached al-Nu'man ibn al-Muqarrin from the Sus siege to meet them — the battle that sealed the fate of the Persian kingdom {cite:kamil-ibn-al-athir p. 390-391}."
