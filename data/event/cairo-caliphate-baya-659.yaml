label: { ar: "قيام الخلافة العباسية بالقاهرة", en: "Establishment of the Abbasid caliphate in Cairo", fr: "L'établissement du califat abbasside au Caire", es: "Establecimiento del califato abasí en El Cairo", ur: "قاہرہ میں خلافت عباسیہ کا قیام", tr: "Kahire'de Abbasi Halifeliğinin kurulması", id: "Pendirian Kekhalifahan Abbasiyah di Kairo" }
summary:
  ar: "وفد أحمد بن الظاهر على الملك الظاهر بيبرس في رجب سنة تسع وخمسين ومعه عشرة من بني مهارش وكان محبوساً ببغداد فأطلق لما أخذتها التتار فهرب وصار إلى عرب العراق فركب السلطان للقائه ومعه القضاة والدولة فشق القاهرة ثم أثبت نسبه على قاضي القضاة تاج الدين ابن بنت الأعز ثم بويع له بالخلافة فأول من بايعه السلطان ثم قاضي القضاة تاج الدين ثم الشيخ عز الدين بن عبد السلام ثم الكبار على مراتبهم وذلك في ثالث عشر رجب ونقش اسمه على السكة وخطب له ولقب بلقب أخيه المستنصر وركب يوم الجمعة وعليه السواد إلى جامع القلعة فصعد المنبر وخطب خطبة ذكر فيها شرف بني العباس ثم نصبت خيمة بظاهر القاهرة فألبس الخليفة السلطان الخلعة بيده وطوقه وقرئ التقليد ورتب السلطان للخليفة أتابكاً واستاداراً وشرابياً وخازنداراً وحاجباً وكاتباً ومئة فرس وثلاثين بغلاً وعشرة قطارات جمال وكان مدة انقطاع الخلافة ثلاث سنين ونصف وقال الذهبي ولم يل الخلافة أحد بعد ابن أخيه إلا هذا والمقتفي {cite:tarikh-khulafa-minhaj-1434 p. 723-724}. وفي شذرات الذهب كان المستنصر بالله أحمد بن الظاهر بأمر الله بن الناصر لدين الله العباسي الأسود محبوساً ببغداد حبسه التتار فلما أطلقوه التجأ إلى عرب العراق فأحضروه إلى مصر فتلقاه السلطان بيبرس والمسلمون واليهود والنصارى ودخل من باب النصر وكان يوماً مشهوداً وقُرئ نسبه بحضرة القضاة وشهدوا بصحته وحكموا به وبويع فبايعه القاضي تاج الدين ابن بنت الأعز ثم بايعه الملك الظاهر بيبرس والشيخ عز الدين وفوض الأمور إلى الملك الظاهر ثم قدما دمشق فعزل عن القضاء نجم الدين بن سنى بن خلكان {cite:shadharat-dhahab p. 296}."
  en: "Ahmad ibn al-Zahir — freed from Baghdad's prison when the Tatars took it — came to Baybars in Rajab 659 with ten of Banu Maharish; the sultan rode out to meet him, his line was proven before chief qadi Taj al-Din ibn Bint al-A'azz, and the bay'a ran: the sultan first, then the qadi, then Shaykh Izz al-Din ibn Abd al-Salam, then the great by rank, on 13 Rajab. His name went on the coinage, he preached in black at the citadel mosque, robed the sultan with his own hands before the Cairo tent, and was granted an atabeg, ustadar, sharabi, khazindar, hajib and katib with a hundred horses. The caliphate's gap had lasted three and a half years; al-Dhahabi notes none after his uncle's son took it save him and al-Muqtafi {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  fr: "Ahmad ibn al-Zahir, libéré de la prison de Bagdad quand les Tatars la prirent, vint auprès de Baybars en Rajab 659 avec dix hommes des Banu Maharish ; le sultan sortit à sa rencontre, sa lignée fut établie devant le grand cadi Taj al-Din ibn Bint al-A'azz, et la bay'a fut prêtée : le sultan d'abord, puis le cadi, puis le cheikh Izz al-Din ibn Abd al-Salam, puis les grands selon leur rang, le 13 Rajab. Son nom fut mis sur la monnaie, il prêcha vêtu de noir à la mosquée de la citadelle, revêtit de ses propres mains le sultan de la robe d'honneur devant la tente du Caire, et reçut un atabeg, un ustadar, un sharabi, un khazindar, un hajib et un katib, avec cent chevaux. La vacance du califat avait duré trois ans et demi ; al-Dhahabi note que nul, après que le fils de son oncle l'eut prise, ne l'occupa sinon lui et al-Muqtafi {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  es: "Ahmad ibn al-Zahir — liberado de la prisión de Bagdad cuando los tártaros la tomaron — llegó a Baybars en Rajab 659 con diez Banu Maharish; el sultán salió a su encuentro, su linaje fue probado ante el cadí principal Taj al-Din ibn Bint al-A'azz, y la bay'a corrió: primero el sultán, luego el cadí, luego Shaykh Izz al-Din ibn Abd al-Salam, luego el más importante por rango, el 13 de Rajab. Su nombre fue acuñado, predicó de negro en la mezquita de la ciudadela, vistió al sultán con sus propias manos frente a la tienda de El Cairo, y se le concedió un atabeg, ustadar, sharabi, khazindar, hajib y katib con cien caballos. El vacío del califato había durado tres años y medio; Al-Dhahabi no menciona a nadie después de que el hijo de su tío lo tomara, salvo él y al-Muqtafi {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  ur: "احمد بن الظاہر - بغداد کی قید سے رہا ہوا جب تاتاریوں نے اسے لے لیا - رجب 659 میں دس بنو محرش کے ساتھ بیبرس آیا۔ سلطان اس سے ملنے کے لیے باہر نکلا، اس کا سلسلہ چیف قاضی تاج الدین ابن بنت العز کے سامنے ثابت ہوا، اور بیع چلی: پہلے سلطان، پھر قاضی، پھر شیخ عزالدین ابن عبد السلام، پھر درجہ کے لحاظ سے عظیم، 13 رجب کو۔ اس کا نام سکے پر چلا، اس نے قلعہ کی مسجد میں کالے رنگ میں تبلیغ کی، قاہرہ کے خیمے کے سامنے سلطان کو اپنے ہاتھوں سے لبادہ پہنایا، اور اسے ایک سو گھوڑوں کے ساتھ ایک اطبیگ، استاد، شرابی، خزندر، حاجی اور کاتب عطا کیا گیا۔ خلافت کا وقفہ ساڑھے تین سال پر محیط تھا۔ الذہبی نے اپنے چچا کے بیٹے کے لے جانے کے بعد اسے اور المقطفی کے علاوہ کسی نے بھی نوٹ نہیں کیا۔ 723-724}۔"
  tr: "Ahmed ibn el-Zahir, Hicri 559 yılının Receb ayında (Miladi 1160) Sultan el-Zahir Beybers ile görüşmek üzere Beni Maheş kabilesinden on kişiyle birlikte geldi. Bağdat'ta hapsedilmişti ancak Moğollar şehri ele geçirdiğinde serbest bırakılmıştı. Daha sonra Irak'taki Arap kabilelerine kaçtı. Sultan, kadı ve devlet görevlileri eşliğinde onu karşılamaya çıktı. Kahire'yi geçerek Başkahraman Taj el-Din ibn Bint el-A'azz ile soyunu kurdu. Ardından halife ilan edildi. Biat eden ilk kişi Sultan oldu, ardından Başkahraman Taj el-Din, sonra Şeyh İzz el-Din ibn Abd el-Salam ve daha sonra diğer ileri gelenler rütbelerine göre biat ettiler. Bu olay Receb ayının on üçüncü gününde gerçekleşti. Adı sikkelere yazıldı, Cuma hutbesi onun adına kılındı ve kardeşi gibi el-Mustansir unvanı verildi. Cuma günü, siyah giysiler içinde, Kale Camii'ne gitti. Minbere çıktı ve Abbasilerin şerefinden bahsettiği bir vaaz verdi. Ardından Kahire'nin dışında bir çadır kuruldu ve Halife, Sultan'a bizzat şeref cübbesini takdim ederek boynuna geçirdi. Görevlendirme töreni yüksek sesle okundu ve Sultan, Halife için bir atabeg, bir ustar (saray görevlisi), bir şurabî (kadeh taşıyıcı), bir hazindar (hazineci), bir hacıb (oda görevlisi), bir katip (katip), yüz at, otuz katır ve on deve kervanı görevlendirdi. Halifelik üç buçuk yıl süreyle askıya alınmıştı. El-Dhahabi, İbn Hicri'den sonra Halifeliği bu kişi ve takipçisi dışında kimsenin üstlenmediğini söyledi. {Kaynak:tarikh-khulafa-minhaj-1434 s. 723-724} Şadharat el-Dhahab'da, el-Mustansir Billah Ahmed ibn el-Zahir bi-Amr Allah ibn el-Nasir li-Din Allah el-Abbasi el-Aswad'ın Tatarlar tarafından Bağdat'ta hapsedildiği belirtilmiştir. Serbest bırakılınca Irak Araplarına sığınmış ve onlar da onu Mısır'a getirmişlerdir. Sultan Baybars, Müslümanlar, Yahudiler ve Hristiyanlarla birlikte onu karşılamıştır. Bab el-Nasr'dan giriş yapmış ve bu çok önemli bir gün olmuştur. Soy ağacı, kadıların huzurunda okunmuş, kadıların da geçerliliğine şahitlik edip buna göre hüküm vermeleri sağlanmıştır. Ona biat yemini ettirilmiş ve bu yemini Kadı Taj el-Din ibn Bint el-Aazz ettirmiştir. Daha sonra Kral el-Zahir Baybars ve Şeyh İzz el-Din ona biat yemini ettirmiş ve işleri Kral el-Zahir'e emanet etmişlerdir. Sonra Şam'a geldiler ve Necmü'l-Din ibn Sani ibn Hallikan yargıdan azledildi {kaynak: Şadharat-dahab s. 296}."
  id: "Ahmad ibn al-Zahir tiba pada bulan Rajab tahun 559 H (1160 M) untuk menemui Sultan al-Zahir Baybars, ditem ditemani oleh sepuluh orang dari Banu Mahash. Ia telah dipenjara di Baghdad tetapi dibebaskan ketika Mongol merebutnya. Kemudian ia melarikan diri ke suku-suku Arab di Irak. Sultan berkuda untuk menemuinya, ditem ditemani oleh para hakim dan pejabat negara. Ia menyeberangi Kairo dan menetapkan garis keturunannya dengan Ketua Mahkamah Agung, Taj al-Din ibn Bint al-A'azz. Ia kemudian diproklamasikan sebagai Khalifah. Yang pertama kali menyatakan kesetiaan adalah Sultan, diikuti oleh Ketua Mahkamah Agung, Taj al-Din, kemudian Syekh Izz al-Din ibn Abd al-Salam, dan kemudian para pejabat lainnya sesuai dengan pangkat mereka. Peristiwa ini terjadi pada tanggal tiga belas Rajab. Namanya diabadikan pada koin, khutbah Jumat disampaikan atas namanya, dan ia diberi gelar saudaranya, al-Mustansir. Pada hari Jumat, ia berkuda keluar, mengenakan pakaian hitam, menuju Masjid Benteng. Ia naik ke mimbar dan menyampaikan khutbah di mana ia berbicara tentang kehormatan Dinasti Abbasiyah. Sebuah tenda kemudian didirikan di luar Kairo, dan Khalifah secara pribadi menganugerahkan jubah kehormatan kepada Sultan, meletakkannya di lehernya. Penobatan dibacakan dengan lantang, dan Sultan menunjuk untuk Khalifah seorang atabeg, seorang ustar (kepala istana), seorang shurabi (pembawa cangkir), seorang khazindar (bendahara), seorang hajib (pengurus istana), seorang katib (juru tulis), seratus kuda, tiga puluh keledai, dan sepuluh kafilah unta. Kekhalifahan telah ditangguhkan selama tiga setengah tahun. Al-Dhahabi mengatakan bahwa tidak ada seorang pun yang menduduki Kekhalifahan setelah Ibn saudaranya, kecuali dia dan pengikutnya {cite:tarikh-khulafa-minhaj-1434 p. 723-724}. Dan dalam Shadharat al-Dhahab, disebutkan bahwa al-Mustansir Billah Ahmad ibn al-Zahir bi-Amr Allah ibn al-Nasir li-Din Allah al-Abbasi al-Aswad dipenjara di Baghdad oleh Tatar. Ketika mereka membebaskannya, ia mencari perlindungan kepada orang-orang Arab Irak, dan mereka membawanya ke Mesir. Sultan Baybars, bersama dengan kaum Muslim, Yahudi, dan Kristen, menerimanya. Ia masuk melalui Bab al-Nasr, dan itu adalah hari yang penting. Silsilahnya dibacakan di hadapan para hakim, yang bersaksi tentang keabsahannya dan memutuskan sesuai dengan itu. Ia disumpah setia, dan Hakim Taj al-Din ibn Bint al-Aazz mengucap sumpah tersebut. Kemudian Raja al-Zahir Baybars dan Syekh Izz al-Din mengucap sumpah setia kepadanya dan menyerahkan urusan kepada Raja al-Zahir. Kemudian mereka datang ke Damaskus, dan Najm al-Din ibn Sani ibn Khallikan diberhentikan dari jabatannya sebagai hakim {cite:shadharat-dhahab p. 296}."
