tags: [wasaya-browser, wasaya-successors, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath, wasaya-marqad]
label: { ar: "مرض سعيد بن المسيب ووصيته في جنازته وما ترك", en: "Deathbed of Sa'id ibn al-Musayyab", ur: "سعید بن مسیب کا مرضِ وفات اور جنازے کے بارے میں وصیت", es: "Lecho de muerte de Sa'id ibn al-Musayyab", fr: "Lit de mort de Sa'id ibn al-Musayyab" }
summary:
  ar: "روى ابن سعد أن سعيد بن المسيب أوصى أهله عند حضور الموت بثلاث: ألا يتبعه راجز ولا نار، وأن يعجلوا به {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}، وألا يُضرب على قبره فسطاط ولا يُحمل على قطيفة حمراء ولا يُؤذَن به أحد {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}، وأشهد زرعة على ابنه محمد ألا يؤذن بأحد وأن يحمله أربعة وألا تتبعه صائحة {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. وروى يحيى بن سعيد أنه لما حضره الموت ترك دنانير فقال: اللهم إنك تعلم أني لم أتركها إلا لأصون بها حسبي وديني {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. ومات بالمدينة سنة أربع وتسعين في خلافة الوليد بن عبد الملك، وسُمّيت تلك السنة سنة الفقهاء {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 143}."
  en: "Ibn Sa'd reports that as death neared, Sa'id ibn al-Musayyab charged his family with three things: that no chanter and no fire should follow him, and that they should hasten his burial {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; that no tent be pitched over his grave, no red velvet cloth be used to carry him, and no one be notified {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; and he called Zur'a to witness against his son Muhammad that four men should carry him and no wailing woman follow {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. Yahya ibn Sa'id reports that at death he left some dinars and prayed that God knew he had left them only to protect his standing and his religion {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. He died at Medina in 94 AH, in the caliphate of al-Walid ibn Abd al-Malik, a year named the year of the jurists {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 143}."
  ur: "ابن سعد روایت کرتے ہیں کہ موت قریب آئی تو سعید بن مسیب نے اپنے گھر والوں کو تین باتوں کی وصیت کی: نہ کوئی نوحہ/رجز پڑھنے والا ان کے پیچھے چلے، نہ آگ، اور تدفین میں جلدی کی جائے {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}؛ قبر پر خیمہ نہ تانا جائے، سرخ مخملی چادر میں نہ اٹھایا جائے اور کسی کو اطلاع نہ دی جائے {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}؛ اور انھوں نے زرعہ کو اپنے بیٹے محمد کے خلاف گواہ بنایا کہ چار آدمی انھیں اٹھائیں اور کوئی بین کرنے والی عورت پیچھے نہ آئے {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}۔ یحییٰ بن سعید کہتے ہیں کہ انھوں نے موت کے وقت کچھ دینار چھوڑے اور دعا کی کہ اللہ جانتا ہے میں نے انھیں صرف اپنی عزت اور دین کی حفاظت کے لیے چھوڑا {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}۔ وہ 94ھ میں ولید بن عبد الملک کے عہد میں مدینہ میں فوت ہوئے، اور اس سال کا نام سنۃ الفقہاء پڑا {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 143}۔"
  es: "Ibn Sa'd relata que, al acercarse la muerte, Sa'id ibn al-Musayyab encargó a su familia tres cosas: que ningún cantor ni fuego lo acompañaran, y que apresuraran su entierro {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; que no se colocara ninguna tienda sobre su tumba, que no se utilizara ninguna tela de terciopelo rojo para transportarlo, y que no se notificara a nadie {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; y llamó a Zur'a como testigo contra su hijo Muhammad de que cuatro hombres lo llevaran y ninguna mujer llorando lo acompañara {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. Yahya ibn Sa'id relata que, al morir, dejó algunos dinares y oró para que Dios supiera que los había dejado únicamente para proteger su posición y su religión {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. Murió en Medina en el año 94 de la Hégira, durante el califato de al-Walid ibn Abd al-Malik, un año conocido como el año de los juristas {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 143}."
  fr: "Ibn Sa'd rapporte qu'à l'approche de la mort, Sa'id ibn al-Musayyab ordonna à sa famille de respecter trois règles: qu'aucun chantre ni feu ne l'accompagne, et qu'ils hâtent son enterrement {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; qu'aucune tente ne soit dressée sur sa tombe, qu'aucun tissu de velours rouge ne soit utilisé pour le transporter, et que personne ne soit averti {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 141}; et il prit Zur'a à témoin contre son fils Muhammad, affirmant que quatre hommes devaient le porter et qu'aucune femme en pleurs ne devait le suivre {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. Yahya ibn Sa'id rapporte qu'à sa mort, il laissa quelques dinars et pria Dieu de savoir qu'il ne les laissait que pour protéger sa position et sa religion {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 142}. Il mourut à Médine en 94 AH, sous le califat d'al-Walid ibn Abd al-Malik, une année appelée l'année des juristes {cite:tabaqat-ibn-sad-khanji-2001 vol. 7 p. 143}."
