label:
  ar: "ابن حبيب بطرابلس الشام سنة ٧٥٨هـ"
  en: "Ibn Habib at Tripoli in 758/1357"
  ur: "ابن حبیب طرابلس شام میں، 758ھ/1357ء"
  es: "Ibn Habib en Trípoli en 758/1357"
  fr: "Ibn Habib à Tripoli en 758/1357"
  tr: "İbn Habib, Hicri 758 yılında Suriye'nin Trablus şehrinde."
  id: "Ibn Habib di Tripoli, Suriah, pada tahun 758 Hijriah"
summary:
  ar: "ورد في ترجمته بالدرر الكامنة أنه كان بطرابلس سنة ٧٥٨هـ في سياق سماعاته من الشيوخ {cite:durar-kamina-jil-1993 2/30}؛ وكان قد سمع من إبراهيم بن مسلم ومن والده عمر ومن الفخر الدين بن خطيب برين، وسمع بالحلة ومصر والإسكندرية، ورحل إلى مصر والحجاز ثم تنقل في بلاد الشام واستقر بحلب {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  en: "His Durar al-Kamina entry places him at Tripoli in 758 in the course of his audition tours among the shaykhs {cite:durar-kamina-jil-1993 2/30}. He had heard from Ibrahim ibn Muslim, from his father 'Umar and from al-Fakhr ibn Khatib Birin, and heard at al-Hilla, Egypt and Alexandria; he travelled to Egypt and the Hijaz, moved about Syria and settled at Aleppo {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  ur: "الدرر الکامنہ کی ترجمہ کے مطابق وہ 758ھ میں شيوخ سے سماعات کے سلسلے میں طرابلس شام میں تھا {cite:durar-kamina-jil-1993 2/30}۔ اس سے پہلے ابراہیم بن مسلم، اپنے باپ عمر اور فخر الدین بن خطیب برین سے سنا، اور حلہ، مصر اور اسکندریہ میں سماعات کیے؛ مصر اور حجاز کا سفر کیا، شام کے شہروں میں رہا اور حلب میں مستقر ہوا {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  es: "Su entrada en Durar al-Kamina lo sitúa en Trípoli en 758 en el curso de sus giras de audición entre los shaykhs {cite:durar-kamina-jil-1993 2/30}. Había escuchado a Ibrahim ibn Muslim, a su padre 'Umar y a al-Fakhr ibn Khatib Birin, y escuchó en al-Hilla, Egipto y Alejandría; viajó a Egipto y al Hiyaz, se movió por Siria y se estableció en Alepo {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  fr: "Son entrée dans Durar al-Kamina le situe à Tripoli en 758, au cours de ses tournées d'audition auprès des cheikhs {cite:durar-kamina-jil-1993 2/30}. Il avait reçu l'enseignement d'Ibrahim ibn Muslim, de son père 'Umar et d'al-Fakhr ibn Khatib Birin, et avait également reçu des enseignements à al-Hilla, en Égypte, et à Alexandrie; il voyagea en Égypte et dans le Hedjaz, se déplaça à travers la Syrie et s'établit à Alep {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  tr: "El-Durar El-Kamina'daki biyografisinde, şeyhlerden aldığı dersler bağlamında Hicri 758 yılında Trablus'ta bulunduğu belirtilmiştir {cite:durar-kamina-jil-1993 2/30}; İbrahim bin Müslim'den, babası Ömer'den ve El-Fakhr El-Din bin Hattab Barin'den dersler almış, Mısır'ın Hilla şehrinde ve İskenderiye'de dersler görmüş, Mısır ve Hicaz'a seyahat etmiş, daha sonra Levant'ta dolaşmış ve Halep'e yerleşmiştir {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  id: "Disebutkan dalam biografinya di Al-Durar Al-Kamina bahwa beliau berada di Tripoli pada tahun 758 H dalam konteks mendengarkan ceramah dari para syekh {cite:durar-kamina-jil-1993 2/30}; dan beliau telah mendengarkan ceramah dari Ibrahim bin Muslim, dari ayahnya Umar, dan dari Al-Fakhr Al-Din bin Khatib Barin, dan beliau mendengarkan ceramah di Hilla, Mesir, dan Alexandria, dan beliau melakukan perjalanan ke Mesir dan Hijaz, kemudian beliau berkeliling di Levant dan menetap di Aleppo {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
