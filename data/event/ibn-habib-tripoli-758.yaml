label:
  ar: "ابن حبيب بطرابلس الشام سنة ٧٥٨هـ"
  en: "Ibn Habib at Tripoli in 758/1357"
  ur: "ابن حبیب طرابلس شام میں، 758ھ/1357ء"
summary:
  ar: "ورد في ترجمته بالدرر الكامنة أنه كان بطرابلس سنة ٧٥٨هـ في سياق سماعاته من الشيوخ {cite:durar-kamina-jil-1993 2/30}؛ وكان قد سمع من إبراهيم بن مسلم ومن والده عمر ومن الفخر الدين بن خطيب برين، وسمع بالحلة ومصر والإسكندرية، ورحل إلى مصر والحجاز ثم تنقل في بلاد الشام واستقر بحلب {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  en: "His Durar al-Kamina entry places him at Tripoli in 758 in the course of his audition tours among the shaykhs {cite:durar-kamina-jil-1993 2/30}. He had heard from Ibrahim ibn Muslim, from his father 'Umar and from al-Fakhr ibn Khatib Birin, and heard at al-Hilla, Egypt and Alexandria; he travelled to Egypt and the Hijaz, moved about Syria and settled at Aleppo {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
  ur: "الدرر الکامنہ کی ترجمہ کے مطابق وہ 758ھ میں شيوخ سے سماعات کے سلسلے میں طرابلس شام میں تھا {cite:durar-kamina-jil-1993 2/30}۔ اس سے پہلے ابراہیم بن مسلم، اپنے باپ عمر اور فخر الدین بن خطیب برین سے سنا، اور حلہ، مصر اور اسکندریہ میں سماعات کیے؛ مصر اور حجاز کا سفر کیا، شام کے شہروں میں رہا اور حلب میں مستقر ہوا {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}."
