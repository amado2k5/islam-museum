id: event/umar-ii-samarqand-ruling
class: event
kind: court-ruling
label: { ar: "حكم جميع بن حاضر في وفود سمرقند", en: "Jumay' ibn Hadir's Ruling on Samarqand's Delegation", es: "Sentencia de Jumay' ibn Hadir sobre la delegación de Samarcanda", fr: "La décision de Jumay' ibn Hadir sur la délégation de Samarqand", ur: "سمرقند کے وفد کے بارے میں جمعہ بن حضر کا حکم" }
summary:
  ar: "لما استخلف عمر بن عبد العزيز وفد عليه قوم من أهل سمرقند فرفعوا إليه أن قتيبة دخل مدينتهم وأسكنها المسلمين على غدر فكتب عمر إلى عامله يأمره أن ينصب لهم قاضياً ينظر فيما ذكروا فإن قضى بإخراج المسلمين أخرجوا فنصب لهم جميع بن حاضر الباجي فحكم بإخراج المسلمين على أن ينابذوهم على سواء فكره أهل مدينة سمرقند الحرب وأقروا المسلمين فأقاموا بين أظهرهم."
  en: "Under Umar ibn Abd al-Aziz a Samarqand delegation charged that Qutayba had entered their city and settled Muslims on treachery; Umar ordered his governor to set a qadi over the claim — Jumay' ibn Hadir al-Baji ruled the Muslims must leave unless the city fight them on even terms — and the Samarqandis, loath to fight, confirmed the Muslims, who stayed among them."
  es: "Bajo el mandato de Umar ibn Abd al-Aziz, una delegación de Samarcanda acusó a Qutayba de haber entrado en su ciudad y de haber traicionado a los musulmanes. Umar ordenó a su gobernador que designara un cadí para que se hiciera cargo del caso. Jumay' ibn Hadir al-Baji dictaminó que los musulmanes debían marcharse a menos que la ciudad luchara contra ellos en igualdad de condiciones. Los samarcandas, reacios a luchar, dieron la razón a los musulmanes, que permanecieron entre ellos."
  fr: "Sous le règne d'Umar ibn Abd al-Aziz, une délégation de Samarcande accusa Qutayba d'être entrée dans leur ville et d'y avoir installé des musulmans par trahison; Umar ordonna à son gouverneur de nommer un cadi pour examiner cette accusation — Jumay' ibn Hadir al-Baji décréta que les musulmans devaient partir à moins que la ville ne les combatte à armes égales — et les Samarcandais, réticents à se battre, confirmèrent les musulmans, qui restèrent parmi eux."
  ur: "عمر بن عبدالعزیز کی قیادت میں سمرقند کے ایک وفد نے الزام لگایا کہ قتیبہ ان کے شہر میں داخل ہوا ہے اور مسلمانوں کو غداری پر آباد کیا ہے۔ عمر نے اپنے گورنر کو دعویٰ پر ایک قاضی مقرر کرنے کا حکم دیا - جمعے بن حیدر الباجی نے حکم دیا کہ مسلمانوں کو چھوڑ دینا چاہئے جب تک کہ شہر ان سے یکساں شرائط پر نہ لڑے - اور سمرقندیوں نے، لڑائی سے نفرت کرتے ہوئے، مسلمانوں کی تصدیق کی، جو ان کے درمیان رہے۔"
