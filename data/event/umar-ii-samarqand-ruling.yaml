label: { ar: "حكم جميع بن حاضر في وفود سمرقند", en: "Jumay' ibn Hadir's Ruling on Samarqand's Delegation" }
summary:
  ar: "لما استخلف عمر بن عبد العزيز وفد عليه قوم من أهل سمرقند فرفعوا إليه أن قتيبة دخل مدينتهم وأسكنها المسلمين على غدر فكتب عمر إلى عامله يأمره أن ينصب لهم قاضياً ينظر فيما ذكروا فإن قضى بإخراج المسلمين أخرجوا فنصب لهم جميع بن حاضر الباجي فحكم بإخراج المسلمين على أن ينابذوهم على سواء فكره أهل مدينة سمرقند الحرب وأقروا المسلمين فأقاموا بين أظهرهم."
  en: "Under Umar ibn Abd al-Aziz a Samarqand delegation charged that Qutayba had entered their city and settled Muslims on treachery; Umar ordered his governor to set a qadi over the claim — Jumay' ibn Hadir al-Baji ruled the Muslims must leave unless the city fight them on even terms — and the Samarqandis, loath to fight, confirmed the Muslims, who stayed among them."
