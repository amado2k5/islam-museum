id: "event/al-hadi-inspects-the-markets-against-adulteration-and-fraud-and-answers-the-question-of-price-fixing-after-295"
class: event
kind: other
label:
  ar: "الهادي يتفقد الأسواق ضد الغش ويجيب عن مسألة التسعير، بعد 295هـ، ص386"
  en: "Al-Hadi inspects the markets against adulteration and fraud and answers the question of price-fixing, after 295 AH, p. 386"
  ur: "ہادی بازاروں میں ملاوٹ اور دھوکے کے خلاف معائنہ کرتا اور نرخ مقرر کرنے کے سوال کا جواب دیتا ہے، 295ھ کے بعد، ص386"
  es: "Al-Hadi inspecciona los mercados para detectar adulteración y fraude y responde a la cuestión de la fijación de precios, después del año 295 AH, pág. 386."
  fr: "Al-Hadi inspecte les marchés pour lutter contre la falsification et la fraude et répond à la question de la fixation des prix, après 295 AH, p. 386"
  tr: "Al-Hadi, Hicri 295 yılından sonra piyasalardaki hileleri önlemek için incelemeler yapıyor ve fiyatlandırma sorusuna cevap veriyor (s. 386)."
  id: "Al-Hadi memeriksa pasar untuk memerangi penipuan dan menjawab pertanyaan tentang penetapan harga, setelah 295 H, hlm. 386"
summary:
  ar: "يقف الهادي على أهل كل بضاعة فيأمرهم بترك الغش، فيسألونه عن حكم التسعير فيجيب بأن النهي عن التسعير خاص بأهل الوفاء والتقوى."
  en: "Al-Hadi stands with the sellers of each goods, orders them to stop adulteration, and when asked about price-fixing answers that the prohibition applies to honest and pious traders."
  ur: "ہادی ہر قسم کے سامان والوں کے پاس کھڑے ہو کر ملاوٹ چھوڑنے کا حکم دیتا، اور نرخ مقرر کرنے کے بارے میں پوچھے جانے پر جواب دیتا ہے کہ ممانعت دیانت دار اور متقی تاجروں کے بارے میں ہے۔"
  es: "Al-Hadi apoya a los vendedores de cada producto, les ordena que cesen la adulteración y, cuando se le pregunta sobre la fijación de precios, responde que la prohibición se aplica a los comerciantes honestos y piadosos."
  fr: "Al-Hadi se range du côté des vendeurs de chaque marchandise, leur ordonne de cesser de falsifier les produits, et lorsqu'on l'interroge sur la fixation des prix, il répond que l'interdiction s'applique aux commerçants honnêtes et pieux."
  tr: "Rehber, her meslekten insanın önüne geçerek onlara hile yapmayı bırakmalarını emreder. Ona fiyat belirleme yasağı hakkında soru sorarlar ve o da fiyat belirleme yasağının dürüst ve dindar insanlar için geçerli olduğunu söyler."
  id: "Sang pemandu berdiri di hadapan orang-orang dari setiap bidang perdagangan dan memerintahkan mereka untuk berhenti berbuat curang. Mereka bertanya kepadanya tentang hukum penetapan harga, dan dia menjawab bahwa larangan penetapan harga hanya berlaku bagi orang-orang yang berintegritas dan saleh."
