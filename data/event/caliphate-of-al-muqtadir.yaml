id: event/caliphate-of-al-muqtadir
class: event
kind: other
label: { ar: "خلافة المقتدر بالله", en: "Caliphate of al-Muqtadir Billah", fr: "Le califat d'al-Muqtadir Billah", es: "Califato de al-Muqtadir Billah", ur: "مقتدر باللہ کی خلافت", tr: "El-Muktedir Billah'ın Halifeliği", id: "Kekhalifahan Al-Muqtadir Billah" }
summary:
  ar: "في ذي القعدة سنة خمس وتسعين ومائتين بويع جعفر بن أحمد المقتدر بالخلافة بعد وفاة المكتفي بالله، وذكر الطبري أن بيت المال كان فيه يومئذ خمسة عشر ألف ألف دينار {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. وعند ابن الجوزي لما اشتدت علة المكتفي في ذي القعدة سنة خمس وتسعين سأل عن أخيه أبي الفضل جعفر فصح عنده أنه بالغ، فأحضر القضاة يوم الجمعة لإحدى عشرة ليلة خلت من ذي القعدة فأشهدهم أنه جعل العهد إليه، وبُويع بالخلافة سحرة يوم الأحد لأربع عشرة ليلة خلت من ذي القعدة، ولما أراد الجلوس للبيعة صلى أربع ركعات وما زال يرفع صوته بالدعاء والاستخارة فبُويع ولُقب المقتدر بالله وهو ابن ثلاث عشرة سنة وشهر وإحدى وعشرين يومًا ولم يكن ولى الخلافة قبله أحد أصغر منه، وكان في بيت مال الخاصة خمسة عشر ألف ألف دينار وفي بيت مال العامة ستمائة ألف دينار وما يتمم عشرين ألف ألف دينار، وفرّق في بني هاشم خمسة آلاف دينار وضاعف أرزاقهم وفرّق في يوم التروية ويوم عرفة من البقر والغنم ثلاثين ألف رأس ومن الإبل ألفي رأس وأطلق أهل الحبوس وأمر بنقض أبنية في الرحبة كان يدخل في كل شهر ألف دينار {cite:muntazam-ibn-al-jawzi p. 359-360}."
  en: "In Dhu'l-Qa'da 295 Ja'far ibn Ahmad, al-Muqtadir, was given the caliphate after the death of al-Muktafi billah. Al-Tabari reports that the treasury then held fifteen million dinars {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. In Ibn al-Jawzi: when al-Muktafi's illness grew severe in Dhu'l-Qa'da 295, he asked about his brother Abu'l-Fadl Ja'far and was assured that he had reached majority; after eleven nights of Dhu'l-Qa'da had passed he summoned the qadis on Friday and had them witness that he had made the succession his. The bay'a was given before dawn on Sunday, after fourteen nights had passed. As he was about to sit for the bay'a he prayed four rak'as and kept raising his voice in supplication and istikhara; he was given the bay'a and titled al-Muqtadir billah, aged thirteen years, one month and twenty-one days, and no one younger had held the caliphate before him. The private treasury held fifteen million dinars and the public treasury six hundred thousand, with what was needed to make up twenty million. He gave five thousand dinars to the Banu Hashim and doubled their stipends; on the days of Tarwiya and Arafa he distributed thirty thousand head of cattle and sheep and two thousand camels; he released the prisoners and ordered the demolition of buildings at al-Ruhba, which had brought in a thousand dinars each month {cite:muntazam-ibn-al-jawzi p. 359-360}."
  fr: "En Dhu'l-Qa'da 295, Ja'far ibn Ahmad, al-Muqtadir, reçut le califat après la mort d'al-Muktafi billah. Al-Tabari rapporte que le trésor contenait alors quinze millions de dinars {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. Chez Ibn al-Jawzi : quand la maladie d'al-Muktafi s'aggrava en Dhu'l-Qa'da 295, il s'enquit de son frère Abu'l-Fadl Ja'far et on lui assura qu'il avait atteint la majorité ; onze nuits de Dhu'l-Qa'da étant passées, il convoqua les cadis le vendredi et les prit à témoin qu'il lui confiait la succession. La bay'a fut prêtée avant l'aube le dimanche, quatorze nuits étant passées. Au moment de s'asseoir pour la bay'a, il pria quatre rak'as et ne cessa d'élever la voix en supplication et en istikhara ; il reçut la bay'a et le titre d'al-Muqtadir billah, âgé de treize ans, un mois et vingt et un jours, et personne de plus jeune n'avait occupé le califat avant lui. Le trésor privé contenait quinze millions de dinars et le trésor public six cent mille, avec ce qu'il fallait pour atteindre vingt millions. Il donna cinq mille dinars aux Banu Hashim et doubla leurs pensions ; les jours de la Tarwiya et d'Arafa, il distribua trente mille têtes de bovins et d'ovins et deux mille chameaux ; il libéra les prisonniers et ordonna la démolition de constructions à al-Ruhba, qui rapportaient mille dinars par mois {cite:muntazam-ibn-al-jawzi p. 359-360}."
  es: "En Dhu'l-Qa'da 295, Ja'far ibn Ahmad, al-Muqtadir, recibió el califato tras la muerte de al-Muktafi billah. Al-Tabari informa que el tesoro entonces tenía quince millones de dinares {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. En Ibn al-Jawzi: cuando la enfermedad de al-Muktafi se agravó en Dhu'l-Qa'da 295, preguntó por su hermano Abu'l-Fadl Ja'far y se le aseguró que había alcanzado la mayoría de edad; después de que pasaron once noches de Dhu'l-Qa'da, convocó a los cadíes el viernes y les hizo testigos de que había hecho suya la sucesión. La bay'a se dio antes del amanecer del domingo, después de que pasaron catorce noches. Cuando estaba a punto de sentarse para la bay'a, rezó cuatro rak'as y siguió elevando la voz en súplica e istikhara; se le concedió la bay'a y se le tituló al-Muqtadir billah, con trece años, un mes y veintiún días de edad, y nadie más joven había ostentado el califato antes que él. El tesoro privado tenía quince millones de dinares y el tesoro público seiscientos mil, con lo necesario para completar veinte millones. Dio cinco mil dinares a los Banu Hashim y duplicó sus estipendios; en los días de Tarwiya y Arafa distribuyó treinta mil cabezas de ganado vacuno y ovino y dos mil camellos; liberó a los prisioneros y ordenó la demolición de los edificios en al-Ruhba, que habían generado mil dinares cada mes {cite:muntazam-ibn-al-jawzi p. 359-360}."
  ur: "ذوالقعدہ 295 میں جعفر بن احمد المقتدیر کو المکتفی باللہ کی وفات کے بعد خلافت دی گئی۔ الطبری نے رپورٹ کیا ہے کہ اس وقت خزانے میں پندرہ ملین دینار تھے {حوالہ:طبری تاریخ ابو الفضل ج11 ص27} {حوالہ:طبری تاریخ ابو الفضل ج11ص28 ابن الجوزی میں ہے: جب ذوالقعدہ 295 میں المکتفی کی بیماری شدید ہوگئی تو اس نے اپنے بھائی ابوالفضل جعفر کے بارے میں پوچھا اور انہیں یقین دلایا گیا کہ وہ اکثریت کو پہنچ چکے ہیں۔ ذوالقعدہ کی گیارہ راتیں گزر جانے کے بعد اس نے جمعہ کے دن قادیان کو بلایا اور ان سے گواہی دی کہ اس نے جانشینی کی ہے۔ چودہ راتیں گزر جانے کے بعد اتوار کو طلوع فجر سے پہلے بیعت کی گئی۔ بیعت کے لیے بیٹھنے ہی والے تھے کہ چار رکعت نماز ادا کی اور دعا اور استخارہ میں آواز بلند کرتے رہے۔ آپ کو بیعت دی گئی اور مقتدر باللہ کا لقب دیا گیا جس کی عمر تیرہ سال، ایک ماہ اور اکیس دن تھی، اور ان سے پہلے کوئی بھی کم عمر خلافت پر فائز نہیں تھا۔ نجی خزانے میں پندرہ ملین دینار تھے اور سرکاری خزانے میں چھ لاکھ، جس سے بیس ملین کی ضرورت تھی۔ اس نے بنو ہاشم کو پانچ ہزار دینار دیے اور ان کا وظیفہ دوگنا کر دیا۔ ترویہ اور عرفہ کے دنوں میں آپ نے تیس ہزار گائے اور بھیڑیں اور دو ہزار اونٹ تقسیم کیے۔ اس نے قیدیوں کو رہا کیا اور الرحبہ کی عمارتوں کو گرانے کا حکم دیا جس سے ہر ماہ ایک ہزار دینار آتے تھے۔ 359-360}۔"
  tr: "295 yılının Zilhicce ayında, Muktafi Billa'nın ölümünden sonra Cafer ibn Ahmed el-Muktadir halife olarak biat etti. Taberi, o gün hazinede on beş milyon dinar bulunduğunu belirtmiştir. {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. İbn el-Cevzi'ye göre, Muktafi'nin hastalığı 95 yılının Zilhicce ayında kötüleşince, kardeşi Ebu el-Fadl Cafer'i sordu ve onun çok hasta olduğu anlaşıldı. Bunun üzerine Zilhicce ayının on birinci gecesi olan Cuma günü kadıları çağırdı ve ona halifelik görevini emanet ettiğine şahitlik ettirdi. Zilhicce ayının on dördüncü gecesi, Pazar sabahı şafak vakti halife olarak biat etti. Biat etmek için oturmak istediğinde dört rekat namaz kıldı ve dua ederek, hidayet dileyerek sesini yükseltmeye devam etti. Böylece biat etti ve \"Muktadir Billa\" unvanını aldı. O sırada on üç yaşında, bir ay ve yirmi bir günlüktü. Ondan önce halifeliği kimse daha genç yaşta üstlenmemişti. Özel hazinede on beş milyon dinar, kamu hazinesinde ise altı yüz bin dinar vardı, yirmi milyon dinara ulaşmıyordu. Beni Haşim'e beş bin dinar dağıttı ve maaşlarını ikiye katladı. Terviye Günü ve Arafat Günü'nde otuz bin büyükbaş ve iki bin deve dağıttı. Esirleri serbest bıraktı ve her ay bin dinar gelir getiren Rahbe'deki binaların yıkılmasını emretti. 359-360}."
  id: "Pada bulan Dzul Qa'dah tahun 295, Ja'far bin Ahmad al-Muqtadir diikrarkan sumpah setia sebagai Khalifah setelah wafatnya al-Muktafi Billah. Al-Tabari menyebutkan bahwa kas negara pada hari itu berisi lima belas juta dinar. {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. Menurut Ibn al-Jawzi, ketika penyakit al-Muktafi memburuk pada bulan Dzul Qi'dah tahun 95, ia menanyakan keadaan saudaranya Abu al-Fadl Ja'far dan menjadi jelas baginya bahwa ia sangat sakit. Maka ia memanggil para hakim pada hari Jumat, malam kesebelas bulan Dzul Qi'dah, dan meminta mereka untuk menjadi saksi bahwa ia telah mempercayakan perjanjian itu kepadanya. Beliau diikrarkan sumpah setia sebagai Khalifah pada subuh hari Minggu, malam keempat belas bulan Dzul Qi'dah. Ketika hendak mengucapkan sumpah setia, beliau shalat empat rakaat dan terus meninggikan suaranya dalam doa dan memohon petunjuk. Maka beliau diikrarkan sumpah setia dan diberi gelar al-Muqtadir Billah, pada usia tiga belas tahun, satu bulan, dan dua puluh satu hari. Tidak ada seorang pun yang lebih muda darinya yang pernah memegang kekhalifahan sebelum beliau. Di kas pribadi terdapat lima belas juta dinar dan di kas negara enam ratus ribu dinar, tidak mencapai dua puluh juta dinar. Beliau membagikan lima ribu dinar kepada Bani Hasyim dan melipatgandakan tunjangan mereka. Pada Hari Tarwiyah dan Hari Arafah, beliau membagikan tiga puluh ribu ekor sapi dan domba serta dua ribu ekor unta. Dia membebaskan para tahanan dan memerintahkan pembongkaran bangunan-bangunan di al-Rahbah, yang dulunya menghasilkan seribu dinar setiap bulan. 359-360}."
