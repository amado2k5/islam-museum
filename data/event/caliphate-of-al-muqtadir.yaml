label: { ar: "خلافة المقتدر بالله", en: "Caliphate of al-Muqtadir Billah" }
summary:
  ar: "في ذي القعدة سنة خمس وتسعين ومائتين بويع جعفر بن أحمد المقتدر بالخلافة بعد وفاة المكتفي بالله، وذكر الطبري أن بيت المال كان فيه يومئذ خمسة عشر ألف ألف دينار {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. وعند ابن الجوزي لما اشتدت علة المكتفي في ذي القعدة سنة خمس وتسعين سأل عن أخيه أبي الفضل جعفر فصح عنده أنه بالغ، فأحضر القضاة يوم الجمعة لإحدى عشرة ليلة خلت من ذي القعدة فأشهدهم أنه جعل العهد إليه، وبُويع بالخلافة سحرة يوم الأحد لأربع عشرة ليلة خلت من ذي القعدة، ولما أراد الجلوس للبيعة صلى أربع ركعات وما زال يرفع صوته بالدعاء والاستخارة فبُويع ولُقب المقتدر بالله وهو ابن ثلاث عشرة سنة وشهر وإحدى وعشرين يومًا ولم يكن ولى الخلافة قبله أحد أصغر منه، وكان في بيت مال الخاصة خمسة عشر ألف ألف دينار وفي بيت مال العامة ستمائة ألف دينار وما يتمم عشرين ألف ألف دينار، وفرّق في بني هاشم خمسة آلاف دينار وضاعف أرزاقهم وفرّق في يوم التروية ويوم عرفة من البقر والغنم ثلاثين ألف رأس ومن الإبل ألفي رأس وأطلق أهل الحبوس وأمر بنقض أبنية في الرحبة كان يدخل في كل شهر ألف دينار {cite:muntazam-ibn-al-jawzi p. 359-360}."
  en: "In Dhu'l-Qa'da 295 Ja'far ibn Ahmad, al-Muqtadir, was given the caliphate after the death of al-Muktafi billah. Al-Tabari reports that the treasury then held fifteen million dinars {cite:tabari-tarikh-abu-al-fadl j.11 p.27} {cite:tabari-tarikh-abu-al-fadl j.11 p.28}. In Ibn al-Jawzi: when al-Muktafi's illness grew severe in Dhu'l-Qa'da 295, he asked about his brother Abu'l-Fadl Ja'far and was assured that he had reached majority; after eleven nights of Dhu'l-Qa'da had passed he summoned the qadis on Friday and had them witness that he had made the succession his. The bay'a was given before dawn on Sunday, after fourteen nights had passed. As he was about to sit for the bay'a he prayed four rak'as and kept raising his voice in supplication and istikhara; he was given the bay'a and titled al-Muqtadir billah, aged thirteen years, one month and twenty-one days, and no one younger had held the caliphate before him. The private treasury held fifteen million dinars and the public treasury six hundred thousand, with what was needed to make up twenty million. He gave five thousand dinars to the Banu Hashim and doubled their stipends; on the days of Tarwiya and Arafa he distributed thirty thousand head of cattle and sheep and two thousand camels; he released the prisoners and ordered the demolition of buildings at al-Ruhba, which had brought in a thousand dinars each month {cite:muntazam-ibn-al-jawzi p. 359-360}."
