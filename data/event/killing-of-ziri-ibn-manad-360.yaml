summary:
  ar: "في شهر رمضان سنة ستين وثلاثمائة قتل زيري بن مناد الصنهاجي جد المعزين بن باديس في حرب مع جعفر الأندلسي، إذ كانت بينهما عداوات وأحقاد أفضت إلى الحرب فلما تصافّا كبا بزيري فرسه فسقط إلى الأرض فقتل؛ وكان زيري أول من ملك من طائفته وهو الذي بنى مدينة أشير في إفريقية وحصّنها في أيام أبي يزيد الخارجي، وكان حسن السيرة شجاعاً صارماً وهو صاحب مدينة تاهرت {cite:shadharat-dhahab p. 29-30}."
  en: "In Ramadan 360 Ziri b. Manad the Sanhaji — grandfather of the al-Mu'izz b. Badis line — was killed in his war with Ja'far al-Andalusi when his horse stumbled and he fell; founder and fortifier of Ashir under Abu Yazid's revolt, and lord of Tahert {cite:shadharat-dhahab p. 29-30}."
