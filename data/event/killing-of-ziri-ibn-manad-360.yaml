id: event/killing-of-ziri-ibn-manad-360
class: event
kind: death
label: { ar: "مقتل زيري بن مناد الصنهاجي", en: "Killing of Ziri ibn Manad al-Sanhaji, 360", es: "Asesinato de Ziri ibn Manad al-Sanhaji, 360", fr: "Meurtre de Ziri ibn Manad al-Sanhaji, 360", ur: "زیری ابن مناد السنہجی کا قتل، 360", tr: "Ziri ibn Menad el-Sanhaji'nin öldürülmesi", id: "Pembunuhan Ziri ibn Manad al-Sanhaji" }
summary:
  ar: "في شهر رمضان سنة ستين وثلاثمائة قتل زيري بن مناد الصنهاجي جد المعزين بن باديس في حرب مع جعفر الأندلسي، إذ كانت بينهما عداوات وأحقاد أفضت إلى الحرب فلما تصافّا كبا بزيري فرسه فسقط إلى الأرض فقتل؛ وكان زيري أول من ملك من طائفته وهو الذي بنى مدينة أشير في إفريقية وحصّنها في أيام أبي يزيد الخارجي، وكان حسن السيرة شجاعاً صارماً وهو صاحب مدينة تاهرت {cite:shadharat-dhahab p. 29-30}."
  en: "In Ramadan 360 Ziri b. Manad the Sanhaji — grandfather of the al-Mu'izz b. Badis line — was killed in his war with Ja'far al-Andalusi when his horse stumbled and he fell; founder and fortifier of Ashir under Abu Yazid's revolt, and lord of Tahert {cite:shadharat-dhahab p. 29-30}."
  es: "En Ramadán 360 Ziri b. Manad el Sanhaji —abuelo de la línea al-Mu'izz b. Badis— murió en su guerra con Ja'far al-Andalusi cuando su caballo tropezó y cayó; fundador y fortificador de Ashir bajo la revuelta de Abu Yazid, y señor de Tahert {cite:shadharat-dhahab p. 29-30}."
  fr: "En Ramadan 360, Ziri b. Manad le Sanhaji — grand-père de la lignée al-Mu'izz b. Badis — fut tué dans sa guerre contre Ja'far al-Andalusi lorsque son cheval trébucha et qu'il tomba; fondateur et fortificateur d'Ashir sous la révolte d'Abu Yazid, et seigneur de Tahert {cite:shadharat-dhahab p. 29-30}."
  ur: "رمضان المبارک 360 زیری ب۔ مناد سنہاجی - المعز بی کے دادا۔ بدیس لائن - جعفر الاندلسی کے ساتھ اس کی جنگ میں اس وقت مارا گیا جب اس کا گھوڑا لڑکھڑا گیا اور وہ گر گیا۔ ابو یزید کی بغاوت کے تحت آشیر کا بانی اور قلعہ بنانے والا، اور طہرت کا آقا 29-30}۔"
  tr: "Hicri 360 yılının Ramazan ayında, Muizzin bin Bedis'in dedesi Ziri bin Manad el-Sanhaji, aralarında düşmanlık ve husumet bulunan Cafer el-Endülüs ile yaptığı savaşta öldürüldü. Karşılaştıklarında Ziri'nin atı tökezledi ve yere düşerek öldü. Ziri, kabilesinin ilk hükümdarıydı ve Ebu Yazid el-Harci döneminde İfrikiye'deki Aşir şehrini inşa edip güçlendiren kişiydi. İyi karakterli, cesur ve disiplinliydi ve Tahert şehrinin sahibiydi. {kaynak: Şadharat-dhahab s. 29-30}"
  id: "Pada bulan Ramadan tahun 360 H, Ziri bin Manad al-Sanhaji, kakek dari al-Mu’izzin bin Badis, terbunuh dalam perang dengan Ja’far al-Andalusi, karena adanya permusuhan dan dendam di antara mereka yang menyebabkan perang. Ketika mereka bertemu, kuda Ziri tersandung dan ia jatuh ke tanah lalu terbunuh. Ziri adalah orang pertama dari sukunya yang memerintah, dan dialah yang membangun kota Ashir di Ifriqiya dan membentenginya pada masa Abu Yazid al-Kharji. Ia memiliki karakter yang baik, berani dan tegas, dan ia adalah pemilik kota Tahert. {cite:shadharat-dhahab p. 29-30}"
