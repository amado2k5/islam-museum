id: event/aqra-juzjan
class: event
kind: conquest
label: { ar: "فتح الجوزجان على يدي الأقرع بن حابس", en: "al-Aqra' ibn Habis Takes Juzjan", es: "al-Aqra' ibn Habis toma Juzjan", fr: "al-Aqra' ibn Habis prend Juzjan", ur: "الاقراء ابن حابس نے جوزجان پر قبضہ کیا۔" }
summary:
  ar: "لحق بعض العدو بالجوزجان فوجه إليهم الأحنف الأقرع بن حابس التميمي في خيل وقال يا بني تميم تحابوا وتباذلوا تعتدل أموركم وابدوا بجهاد بطونكم وفروجكم يصلح لكم دينكم ولا تغلوا يسلم لكم جهادكم فسار الأقرع فلقي العدو بالجوزجان فكانت في المسلمين جولة ثم كروا فهزموا الكفرة وفتحوا الجوزجان عنوة وقال ابن الغريزة النهشلي سقى صوب السحاب إذا استهلت مصارع فتية بالجوزجان إلى القصرين من رستاق حوف أفادهم مناك الأقرعان."
  en: "Fugitives reached Juzjan; al-Ahnaf sent al-Aqra' ibn Habis al-Tamimi with horse and the charge: 'sons of Tamim — love one another, give freely, set your affairs right, and open with the jihad of your bellies and loins; let your faith be sound and do not defraud, that your jihad prosper'. A first turn went against the Muslims; they wheeled back, routed the foe and stormed Juzjan — Ibn al-Ghariza's verses mourning the youths fallen between its two castles."
  es: "Los fugitivos llegaron a Juzjan; al-Ahnaf envió a al-Aqra' ibn Habis al-Tamimi a caballo con la orden: «Hijos de Tamim, ámense unos a otros, den generosamente, pongan sus asuntos en orden y luchen con todas sus fuerzas; que su fe sea firme y no defrauden, para que su lucha prospere». Un primer ataque fue en contra de los musulmanes; estos retrocedieron, derrotaron al enemigo y asaltaron Juzjan. Los versos de Ibn al-Ghariza lamentan la muerte de los jóvenes caídos entre sus dos castillos."
  fr: "Les fugitifs atteignirent Juzjan; al-Ahnaf envoya al-Aqra' ibn Habis al-Tamimi à cheval, porteur de ce message: « Fils de Tamim, aimez-vous les uns les autres, soyez généreux, réglez vos affaires et commencez le jihad de vos entrailles et de vos reins; que votre foi soit inébranlable et ne trompez pas, afin que votre jihad prospère. » Un premier revers fut fatal aux musulmans; ils firent volte-face, mirent en déroute l'ennemi et prirent d'assaut Juzjan – les vers d'Ibn al-Ghariza déplorant la mort des jeunes gens tombés entre ses deux forteresses."
  ur: "فراری جوزجان پہنچ گئے احناف نے الاقراء ابن حابس التمیمی کو گھوڑے اور الزام کے ساتھ بھیجا: تمیم کے بیٹے - ایک دوسرے سے محبت کرو، آزادی سے دو، اپنے معاملات کو درست کرو، اور اپنے پیٹ اور کمر کے جہاد کے ساتھ کھولو۔ تمہارا ایمان مضبوط ہو اور فریب نہ کرو کہ تمہارا جہاد کامیاب ہو جائے''۔ پہلی بار مسلمانوں کے خلاف آیا۔ انہوں نے پیچھے کا پہیہ لگایا، دشمن کو شکست دی اور جوزجان پر حملہ کیا - ابن الغریزا کی آیات اس کے دو قلعوں کے درمیان گرے ہوئے نوجوانوں کا ماتم کرتی ہیں۔"
