label: { ar: "فتح الجوزجان على يدي الأقرع بن حابس", en: "al-Aqra' ibn Habis Takes Juzjan" }
summary:
  ar: "لحق بعض العدو بالجوزجان فوجه إليهم الأحنف الأقرع بن حابس التميمي في خيل وقال يا بني تميم تحابوا وتباذلوا تعتدل أموركم وابدوا بجهاد بطونكم وفروجكم يصلح لكم دينكم ولا تغلوا يسلم لكم جهادكم فسار الأقرع فلقي العدو بالجوزجان فكانت في المسلمين جولة ثم كروا فهزموا الكفرة وفتحوا الجوزجان عنوة وقال ابن الغريزة النهشلي سقى صوب السحاب إذا استهلت مصارع فتية بالجوزجان إلى القصرين من رستاق حوف أفادهم مناك الأقرعان."
  en: "Fugitives reached Juzjan; al-Ahnaf sent al-Aqra' ibn Habis al-Tamimi with horse and the charge: 'sons of Tamim — love one another, give freely, set your affairs right, and open with the jihad of your bellies and loins; let your faith be sound and do not defraud, that your jihad prosper'. A first turn went against the Muslims; they wheeled back, routed the foe and stormed Juzjan — Ibn al-Ghariza's verses mourning the youths fallen between its two castles."
