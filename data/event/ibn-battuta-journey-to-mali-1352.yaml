  es: "En 1352, por orden del sultán, Ibn Battuta cruzó el Sahara hasta el Sudán occidental y pasó un año en el imperio de Malí bajo el reinado de Mansa Sulayman."
  fr: "En 1352, sur ordre du sultan, Ibn Battuta traversa le Sahara pour se rendre dans l'ouest du Soudan et passa un an dans l'empire du Mali sous Mansa Sulayman."
  tr: "1352 yılında İbn Battuta, Sultan'ın emriyle Sahra Çölü'nü geçerek Batı Afrika'ya gitti ve Mansa Sulayman'ın hükümdarlığı döneminde bir yıl boyunca Mali İmparatorluğu'nda kaldı. {cite:britannica-ibn-battuta}"
  id: "Pada tahun 1352 M, Ibn Battuta, atas perintah Sultan, menyeberangi Sahara ke Afrika Barat dan tinggal selama setahun di Kekaisaran Mali pada masa pemerintahan Mansa Sulayman. {cite:britannica-ibn-battuta}"
