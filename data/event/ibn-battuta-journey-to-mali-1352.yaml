summary:
  ar: "سنة 1352م خرج ابن بطوطة بأمر السلطان عبر الصحراء إلى السودان الغربي، وأقام سنة في مملكة مالي في عهد منسا سليمان. {cite:britannica-ibn-battuta}"
  en: "In 1352, at the sultan's command, Ibn Battuta crossed the Sahara to the western Sudan and spent a year in the empire of Mali under Mansa Sulayman."
