id: event/ifrit-of-the-jinn-seeks-the-prophet
class: event
kind: other
label:
  ar: "عفريت من الجن يطلب النبي في الإسراء"
  en: "An ifrit of the jinn seeks the Prophet on the Night Journey"
  ur: "میراج میں جن کا ایک عفریت نبی کی تلاش میں"
  es: "Un ifrit de los genios busca al Profeta en el Viaje Nocturno."
  fr: "Un ifrit des djinns recherche le Prophète lors du Voyage Nocturne"
  tr: "İsra (Mira) sırasında bir cin Peygamberimize bir soru sordu."
  id: "Sesosok jin bertanya kepada Nabi saat Isra' (Perjalanan Malam)."
summary:
  ar: "أُسري برسول الله فرأى عفريتا من الجن يطلبه بشعلة من نار، كلما التفت رسول الله رآه، فقال له جبريل ألا أعلمك كلمات تقولهن إذا قلتهن طفئت شعلته وخر لفيه {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|الموطأ 31:2738]]."
  en: "The Prophet was taken on the night journey and saw an ifrit of the jinn seeking him with a flame; whenever he turned he saw it. Jibril said: shall I teach you words to say that will extinguish its flame and make it fall on its face? {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|Muwatta 31:2738]]."
  ur: "نبی کو رات کا سفر کرایا گیا تو اس نے جن کا ایک عفریت دیکھا جو آگ کی لو کے ساتھ اس کی تلاش میں تھا؛ جب بھی وہ مڑتا اسے دیکھتا۔ جبرائیل نے کہا کیا میں تمہیں وہ الفاظ سکھاؤں جو کہو گے تو اس کی آگ بجھ جائے اور وہ منہ کے بل گر جائے؟ {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|موطأ 31:2738]]۔"
  es: "El Profeta fue llevado en el viaje nocturno y vio a un ifrit de los genios que lo buscaba con una llama; cada vez que se volvía, lo veía. Jibril dijo: ¿Quieres que te enseñe palabras que extingan su llama y lo hagan caer de bruces? {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|Muwatta 31:2738]]."
  fr: "Le Prophète fut emmené en voyage nocturne et vit un ifrit de djinn qui le cherchait avec une flamme; chaque fois qu'il se retournait, il le voyait. Jibril dit: Veux-tu que je t'enseigne des paroles qui éteindront sa flamme et le feront tomber face contre terre ? {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|Muwatta 31:2738]]."
  tr: "Allah'ın Elçisi gece yolculuğuna çıkmış ve peşinden ateş aleviyle bir cinin geldiğini görmüştür. Allah'ın Elçisi her döndüğünde onu görmüştür. Cebrail ona, \"Sana öyle sözler öğretmeyeyim ki, onları söylersen alevi sönsün ve yüzüstü yere düşsün?\" demiştir. {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|الموطأ 31:2738]]."
  id: "Rasulullah SAW melakukan perjalanan malam dan melihat jin mengejarnya dengan nyala api. Setiap kali Rasulullah SAW menoleh, beliau melihat jin itu. Jibril berkata kepadanya, “Tidakkah aku akan mengajarkan kepadamu kata-kata yang jika kau ucapkan, nyala apinya akan padam dan dia akan jatuh tersungkur?” {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|الموطأ 31:2738]]."
