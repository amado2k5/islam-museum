id: event/ifrit-of-the-jinn-seeks-the-prophet
class: event
kind: other
label:
  ar: "عفريت من الجن يطلب النبي في الإسراء"
  en: "An ifrit of the jinn seeks the Prophet on the Night Journey"
  ur: "میراج میں جن کا ایک عفریت نبی کی تلاش میں"
summary:
  ar: "أُسري برسول الله فرأى عفريتا من الجن يطلبه بشعلة من نار، كلما التفت رسول الله رآه، فقال له جبريل ألا أعلمك كلمات تقولهن إذا قلتهن طفئت شعلته وخر لفيه {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|الموطأ 31:2738]]."
  en: "The Prophet was taken on the night journey and saw an ifrit of the jinn seeking him with a flame; whenever he turned he saw it. Jibril said: shall I teach you words to say that will extinguish its flame and make it fall on its face? {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|Muwatta 31:2738]]."
  ur: "نبی کو رات کا سفر کرایا گیا تو اس نے جن کا ایک عفریت دیکھا جو آگ کی لو کے ساتھ اس کی تلاش میں تھا؛ جب بھی وہ مڑتا اسے دیکھتا۔ جبرائیل نے کہا کیا میں تمہیں وہ الفاظ سکھاؤں جو کہو گے تو اس کی آگ بجھ جائے اور وہ منہ کے بل گر جائے؟ {cite:muwatta-maruf-1997} [[passage/muwatta-31-2738|موطأ 31:2738]]۔"
