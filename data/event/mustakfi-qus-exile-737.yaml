label: { ar: "اعتقال المستكفي ونفيه إلى قوص" }
summary:
  ar: "في سنة ست وثلاثين وسبع مئة وقع بين الخليفة المستكفي والسلطان فقبض على الخليفة واعتقله بالبرج ومنعه من الاجتماع بالناس ثم نفاه في ذي الحجة سنة سبع وثلاثين إلى قوص هو وأولاده وأهله ورتب لهم ما يكفيهم وهم قريب من مئة نفس واستمر المستكفي بقوص إلى أن مات بها في شعبان سنة أربعين وسبع مئة ودفن بها وله بضع وخمسون سنة، وكان سبب الوقيعة بينه وبين السلطان ابن أخيه إبراهيم الذي كان يحمله إليه من النميمة به حتى جرى ما جرى {cite:tarikh-khulafa-minhaj-1434 p. 736,739}."
  en: "In 736 fell the breach between al-Mustakfi and the sultan — his nephew Ibrahim's slanders the cause — arrested in the citadel tower, barred from company, then exiled in Dhu'l-Hijja 737 to Qus with his children and household, near a hundred souls provided for; there he stayed till his death in Sha'ban 740, buried at Qus aged about fifty-five {cite:tarikh-khulafa-minhaj-1434 p. 736,739}."
