label: { ar: "فتح حمص", en: "The Conquest of Hims", es: "La conquista de Él", fr: "La conquête de Hims", ur: "اس کی فتح", tr: "Homs'un Fethi", id: "Penaklukan Homs" }
summary:
  ar: "عند البلاذري: لما فرغ أبو عبيدة بن الجراح من أمر دمشق قدّم أمامه خالد بن الوليد وملهان بن زيار الطائي ثم اتبعهما، ومر ببعلبك فطلب أهلها الأمان والصلح فصالحهم على أن آمنهم على أنفسهم وأموالهم وكنائسهم ودورهم داخل المدينة وخارجها وعلى أرحائهم وللروم أن يرعوا سرحهم ما بينهم وبين خمسة عشر ميلاً ولا ينزلوا قرية عامرة فإذا مضى شهر ربيع وجمادى الأولى ساروا حيث شاءوا ومن أسلم منهم فله ما لنا وعليه ما علينا ولتجارهم أن يسافروا حيث أرادوا من البلاد التي صولحوا عليها وعلى من أقام منهم الجزية والخراج؛ وقال الواقدي بينا المسلمون على أبواب دمشق إذ أقبلت خيل للعدو كثيفة فخرجت إليهم جماعة فلقوهم بين بيت لهيا والثنية فولوا منهزمين نحو حمص على طريق قارا فاتبعوهم فألفوهم قد عدلوا عنها ورآهم الحمصيون وكانوا قد نُخبوا لهرب هرقل عنهم وما كان يبلغهم من قوة كيد المسلمين فأعطوا بأيديهم وهنفوا بطلب الأمان فأمنوهم وأخرجوا إليهم الخلف والطعام وأقام المسلمون على الأسط وكان عليهم السمط بن الأسود الجندي؛ ولما فرغ أبو عبيدة من دمشق استخلف عليها يزيد بن أبي سفيان ثم قدم حمص على طريق بعلبك فنزل بباب الرستن فصالحه أهل حمص على أن آمنهم على أنفسهم وأموالهم وسور مدينتهم وكنائسهم وأرحائهم واستثنى عليهم ربع كنيسة يوحنا للمسجد، وصالحوه على مائة ألف وسبعين ألف دينار؛ ثم صارت حمص وقنسرين شيئاً واحداً."
  en: "In al-Baladhuri: when Abu Ubayda ibn al-Jarrah finished with Damascus he put before him Khalid ibn al-Walid and Milhan ibn Zayyar al-Ta'i, then followed them; passing Ba'labakk, whose people sought safety and terms, he compounded with them securing themselves, their wealth, churches and houses inside and outside the city and their mills, the Byzantines to graze their flocks between them and fifteen miles without settling a peopled village, free to depart where they would after Rabia and Jumada I passed, whoever converted having our rights and duties, their merchants free to travel through the treaty lands, and jizya and kharaj upon whoever stayed; per al-Waqidi, while the Muslims stood at Damascus's gates a dense cavalry of the enemy approached and a company met them between Bayt Lahya and al-Thaniyya, routing them toward Hims on the Qara road and pursuing them to find they had passed it by — the people of Hims, already shaken by Heraclius's flight and by reports of the Muslims' might, offered their hands and sued for safety, which was granted, bringing out supplies and food while the Muslims stayed on the Asi under al-Simt ibn al-Aswad al-Jundi; when Abu Ubayda finished with Damascus he left Yazid ibn Abi Sufyan over it and came to Hims by way of Ba'labakk, camping at Bab al-Rastan, and its people compounded for safety of themselves, wealth, city wall, churches and mills, a quarter of the church of John being excepted for the mosque — compounding for a hundred and seventy thousand dinars; afterwards Hims and Qinnasrin became one."
  es: "En al-Baladhuri: cuando Abu Ubayda ibn al-Jarrah terminó con Damasco, puso delante de él a Khalid ibn al-Walid y Milhan ibn Zayyar al-Ta'i, y luego los siguió; pasando por Ba'labakk, cuya gente buscaba seguridad y condiciones, llegó a un acuerdo con ellos, asegurándose a sí mismos, sus riquezas, iglesias y casas dentro y fuera de la ciudad y sus molinos, los bizantinos pastoreando sus rebaños entre ellos y quince millas sin establecer una aldea poblada, libres de partir donde quisieran después de que pasaran Rabia y Jumada I, quien se convirtiera teniendo nuestros derechos y deberes, sus comerciantes libres de viajar por las tierras del tratado, y jizya y kharaj sobre quien se quedara; Según al-Waqidi, mientras los musulmanes estaban en las puertas de Damasco, una densa caballería enemiga se acercó y una compañía los interceptó entre Bayt Lahya y al-Thaniyya, haciéndolos huir hacia Hims por el camino de Qara y persiguiéndolos hasta que descubrieron que habían pasado de largo. La gente de Hims, ya conmocionada por la huida de Heraclio y por los informes del poderío de los musulmanes, ofreció sus manos y suplicó protección, la cual fue concedida, llevando provisiones y alimentos mientras los musulmanes permanecían en el Asi bajo el mando de al-Simt ibn al-Aswad al-Jundi. Cuando Abu Ubayda terminó con Damasco, dejó a Yazid ibn Abi Sufyan al mando y llegó a Hims por Ba'labakk, acampando en Bab al-Rastan, y su gente se comprometió a salvarse a sí mismos, sus riquezas, la muralla de la ciudad, las iglesias y los molinos, exceptuando una cuarta parte de la iglesia de Juan para la mezquita, comprometiéndose a pagar ciento setenta mil dinares. Después, Hims y Qinnasrin se convirtieron en uno solo."
  fr: "Dans al-Baladhuri: lorsqu'Abu Ubayda ibn al-Jarrah eut terminé avec Damas, il présenta devant lui Khalid ibn al-Walid et Milhan ibn Zayyar al-Ta'i, puis les suivit; passant par Ba'labakk, dont les habitants cherchaient sécurité et conditions, il conclut un accord avec eux, assurant leur sécurité, leurs richesses, leurs églises et leurs maisons à l'intérieur et à l'extérieur de la ville, ainsi que leurs moulins; les Byzantins pouvaient faire paître leurs troupeaux entre eux et quinze milles sans y établir de village habité; ils étaient libres de partir où bon leur semblait après le passage de Rabia et Jumada I; quiconque se convertissait conservait nos droits et devoirs; leurs marchands étaient libres de circuler dans les territoires couverts par le traité; et la jizya et le kharaj étaient dus à quiconque restait. Selon al-Waqidi, alors que les musulmans se tenaient aux portes de Damas, une dense cavalerie ennemie s'approcha et une compagnie les rencontra entre Bayt Lahya et al-Thaniyya, les forçant à se diriger vers Hims sur la route de Qara et les poursuivant pour constater qu'ils l'avaient dépassée. Les habitants de Hims, déjà ébranlés par la fuite d'Héraclius et par les rapports de la puissance des musulmans, offrirent leurs mains et implorèrent la protection, qui leur fut accordée. Ils apportèrent des provisions et de la nourriture tandis que les musulmans restaient sur l'Asi sous le commandement d'al-Simt ibn al-Aswad al-Jundi. Lorsqu'Abu Ubayda eut terminé Damas, il laissa Yazid ibn Abi Sufyan à sa tête et se rendit à Hims par Ba'labakk, campant à Bab al-Rastan. Ses habitants se regroupèrent pour leur sécurité, ainsi que leurs richesses, les remparts de la ville, les églises et les moulins, à l'exception d'un quart de l'église de Jean, pour la mosquée. Ce regroupement s'éleva à cent soixante-dix mille dinars. Par la suite, Hims et Qinnasrin ne firent plus qu'un."
  ur: "بلادوری میں ہے: جب ابو عبیدہ بن الجراح دمشق سے فارغ ہوئے تو اس نے خالد بن ولید اور ملحان بن زیار الطائی کو اپنے سامنے رکھا، پھر ان کا پیچھا کیا۔ بعلبک سے گزرتے ہوئے، جن کے لوگ حفاظت اور شرائط کے خواہاں تھے، اس نے ان کے ساتھ اپنے آپ کو، ان کے مال، گرجا گھروں اور شہر کے اندر اور باہر مکانات اور ان کی ملوں کو محفوظ بنایا، بازنطینیوں کو اپنے ریوڑ چرانے کے لیے ان کے درمیان اور پندرہ میل کے فاصلے پر کوئی گاؤں آباد کیے بغیر، آزادانہ طور پر وہاں سے چلے گئے جہاں وہ رابعہ اور جمادہ کے بعد اپنے حقوق کے لیے آزاد ہوئے، جو ہمارے دومچیوں کو آزاد کرنے کے لیے منتقل ہوئے تھے۔ معاہدوں کی زمینوں میں سفر کرو اور جو ٹھہرے اس پر جزیہ وخراج۔ فی الواقدی، جب مسلمان دمشق کے دروازوں پر کھڑے تھے، دشمن کا ایک گھڑ سوار دستہ قریب آیا اور بیت لحیہ اور الثانیہ کے درمیان ایک گروہ ان سے ملا، انہیں قارہ کے راستے سے حمص کی طرف لے گیا اور ان کا تعاقب کیا کہ وہ اس سے گزر چکے ہیں، حمص کے لوگ پہلے ہی سے ہلے ہوئے تھے اور ہرقل کے ہاتھ سے ہلا ہوا تھا اور مسلمانوں نے ہرقل کی طرف سے اپنی طاقت کی اطلاع دی تھی۔ حفاظت، جو کہ دی گئی تھی، سامان اور خوراک لانا جب کہ مسلمان السمط ابن الاسود الجندی کے ماتحت عاصی پر ٹھہرے ہوئے تھے۔ جب ابو عبیدہ دمشق سے فارغ ہوا تو اس نے یزید بن ابی سفیان کو اس پر چھوڑ دیا اور بعلبک کے راستے باب الرستان میں پڑاؤ ڈالا اور اس کے لوگوں نے اپنی حفاظت کے لیے مال و دولت، شہر کی دیوار، گرجا گھر، یوحنا کے کلیسا کا ایک چوتھائی حصہ، ایک ہزار دینار مسجد اور سات سو دینار کے لیے جمع کر دیا۔ اس کے بعد ہمس اور کناسرین ایک ہو گئے۔"
  tr: "El-Baladhuri'ye göre: Ebu Ubeyde ibn el-Cerrah, Şam işini bitirdiğinde, Halid ibn el-Velid ve Mulhan ibn Ziyar el-Ta'i'yi önden gönderdi, sonra kendisi onları takip etti ve Baalbek'ten geçti. Bunun üzerine Baalbek halkı güvenlik ve barış istedi. Bunun üzerine Ebu Ubeyde, onlara kendilerini, paralarını, kiliselerini, şehir içindeki ve dışındaki evlerini ve değirmenlerini koruyacağı, Romalıların sürülerini on beş mil içinde otlatabileceği ve yerleşim yeri kuramayacakları şartıyla onlarla barış yaptı. Rabi' ve Cemâdî-i Ula ayları geçtikten sonra istedikleri yere gidebileceklerdi ve aralarından İslam'a geçen herkes bizim sahip olduklarımıza sahip olacak ve bizim tabi olduğumuz şeylere tabi olacaktı. Tüccarları da barış yaptıkları topraklardan istedikleri yere seyahat edebileceklerdi ve kalanlar cizye ve haraç ödeyeceklerdi. El-Vakidi şöyle dedi: Müslümanlar Şam'ın kapılarında iken, çok sayıda düşman süvarisi yaklaştı. Bir grup onları karşılamak için çıktı ve Beyt Lahiya ile El-Saniye arasında onlarla karşılaştı. Kara yolundan Homs'a doğru kaçtılar. Müslümanlar onları takip etti ve oradan uzaklaştıklarını gördüler. Homs halkı onları gördü ve Heraklius'un onlardan kaçması ve Müslümanların planının gücü hakkında duydukları nedeniyle onları seçmişlerdi. Bu yüzden teslim oldular ve güvenlik için yalvardılar. Onlara güvenlik verdiler ve erzak ve yiyecek gönderdiler. Müslümanlar tepelerde kaldılar ve El-Samt bin El-Esved El-Cundi onların sorumlusuydu. Ebu Ubeyde Şam'ı bitirdiğinde, Yazid bin Ebu Sufyan'ı vekili olarak atadı. Sonra Baalbek yolundan Homs'a geldi ve El-Rastan kapısında kaldı. Homs halkı, kendilerinin, paralarının, şehir surlarının, kiliselerinin ve değirmenlerinin güvenliğini sağlaması şartıyla onunla barıştı. Aziz Yuhanna Kilisesi'nin dörtte birini cami için ayırdı. Yüz yetmiş bin dinar karşılığında onunla barıştılar. Böylece Homs ve Kınnasrin birleşti."
  id: "Menurut Al-Baladhuri: Ketika Abu Ubaidah ibn al-Jarrah menyelesaikan urusan Damaskus, ia mengutus Khalid ibn al-Walid dan Mulhan ibn Ziyar al-Ta’i mendahuluinya, kemudian ia mengikuti mereka, dan melewati Baalbek, sehingga penduduknya meminta keselamatan dan perdamaian, lalu ia berdamai dengan mereka dengan syarat bahwa ia akan melindungi mereka, harta benda mereka, gereja-gereja mereka, rumah-rumah mereka di dalam dan di luar kota, dan penggilingan mereka, dan orang-orang Romawi dapat menggembalakan ternak mereka di antara mereka dan lima belas mil, dan tidak menetap di desa yang berpenduduk. Setelah bulan Rabi’ dan Jumada al-Ula berlalu, mereka dapat pergi ke mana pun mereka mau, dan siapa pun di antara mereka yang masuk Islam akan memiliki apa yang kita miliki dan tunduk pada apa yang kita tundukkan, dan para pedagang mereka dapat bepergian ke mana pun mereka mau dari negeri-negeri yang telah mereka damaikan, dan mereka yang tinggal akan membayar jizya dan kharaj. Al-Waqidi berkata: Ketika kaum Muslimin berada di gerbang Damaskus, sejumlah besar pasukan kavaleri musuh mendekat. Sekelompok pasukan keluar untuk menemui mereka dan bertemu mereka di antara Beit Lahia dan Al-Thaniyah. Mereka melarikan diri menuju Homs di jalan menuju Qara. Kaum Muslimin mengejar mereka dan mendapati bahwa mereka telah berbalik arah. Penduduk Homs melihat mereka, dan mereka telah dipilih karena pelarian Heraclius dari mereka dan apa yang mereka dengar tentang kekuatan rencana kaum Muslimin. Maka mereka menyerah dan memohon keselamatan. Mereka mengabulkan permohonan mereka dan mengirimkan bekal dan makanan. Kaum Muslimin tinggal di perbukitan, dan Al-Samt bin Al-Aswad Al-Jundi memimpin mereka. Ketika Abu Ubaidah selesai dengan Damaskus, ia menunjuk Yazid bin Abi Sufyan sebagai wakilnya. Kemudian ia datang ke Homs di jalan menuju Baalbek dan tinggal di gerbang Al-Rastan. Penduduk Homs berdamai dengannya dengan syarat ia akan menjamin keselamatan mereka, uang mereka, tembok kota mereka, gereja-gereja mereka, dan penggilingan mereka. Ia mengecualikan seperempat dari Gereja Yohanes untuk masjid. Mereka berdamai dengannya dengan membayar seratus tujuh puluh ribu dinar. Kemudian Homs dan Qinnasrin menjadi satu."
