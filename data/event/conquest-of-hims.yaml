label: { ar: "فتح حمص", en: "The Conquest of Hims" }
summary:
  ar: "عند البلاذري: لما فرغ أبو عبيدة بن الجراح من أمر دمشق قدّم أمامه خالد بن الوليد وملهان بن زيار الطائي ثم اتبعهما، ومر ببعلبك فطلب أهلها الأمان والصلح فصالحهم على أن آمنهم على أنفسهم وأموالهم وكنائسهم ودورهم داخل المدينة وخارجها وعلى أرحائهم وللروم أن يرعوا سرحهم ما بينهم وبين خمسة عشر ميلاً ولا ينزلوا قرية عامرة فإذا مضى شهر ربيع وجمادى الأولى ساروا حيث شاءوا ومن أسلم منهم فله ما لنا وعليه ما علينا ولتجارهم أن يسافروا حيث أرادوا من البلاد التي صولحوا عليها وعلى من أقام منهم الجزية والخراج؛ وقال الواقدي بينا المسلمون على أبواب دمشق إذ أقبلت خيل للعدو كثيفة فخرجت إليهم جماعة فلقوهم بين بيت لهيا والثنية فولوا منهزمين نحو حمص على طريق قارا فاتبعوهم فألفوهم قد عدلوا عنها ورآهم الحمصيون وكانوا قد نُخبوا لهرب هرقل عنهم وما كان يبلغهم من قوة كيد المسلمين فأعطوا بأيديهم وهنفوا بطلب الأمان فأمنوهم وأخرجوا إليهم الخلف والطعام وأقام المسلمون على الأسط وكان عليهم السمط بن الأسود الجندي؛ ولما فرغ أبو عبيدة من دمشق استخلف عليها يزيد بن أبي سفيان ثم قدم حمص على طريق بعلبك فنزل بباب الرستن فصالحه أهل حمص على أن آمنهم على أنفسهم وأموالهم وسور مدينتهم وكنائسهم وأرحائهم واستثنى عليهم ربع كنيسة يوحنا للمسجد، وصالحوه على مائة ألف وسبعين ألف دينار؛ ثم صارت حمص وقنسرين شيئاً واحداً."
  en: "In al-Baladhuri: when Abu Ubayda ibn al-Jarrah finished with Damascus he put before him Khalid ibn al-Walid and Milhan ibn Zayyar al-Ta'i, then followed them; passing Ba'labakk, whose people sought safety and terms, he compounded with them securing themselves, their wealth, churches and houses inside and outside the city and their mills, the Byzantines to graze their flocks between them and fifteen miles without settling a peopled village, free to depart where they would after Rabia and Jumada I passed, whoever converted having our rights and duties, their merchants free to travel through the treaty lands, and jizya and kharaj upon whoever stayed; per al-Waqidi, while the Muslims stood at Damascus's gates a dense cavalry of the enemy approached and a company met them between Bayt Lahya and al-Thaniyya, routing them toward Hims on the Qara road and pursuing them to find they had passed it by — the people of Hims, already shaken by Heraclius's flight and by reports of the Muslims' might, offered their hands and sued for safety, which was granted, bringing out supplies and food while the Muslims stayed on the Asi under al-Simt ibn al-Aswad al-Jundi; when Abu Ubayda finished with Damascus he left Yazid ibn Abi Sufyan over it and came to Hims by way of Ba'labakk, camping at Bab al-Rastan, and its people compounded for safety of themselves, wealth, city wall, churches and mills, a quarter of the church of John being excepted for the mosque — compounding for a hundred and seventy thousand dinars; afterwards Hims and Qinnasrin became one."
