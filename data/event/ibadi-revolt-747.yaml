  fr: "Projet de fiche pour la révolte ibadite de 747-748 CE menée par Talib al-Haqq et Abu Hamza contre les Omeyyades; ses sources ne sont pas encore vérifiées sur la page."
  ur: "امویوں کے خلاف طالب الحق اور ابو حمزہ کے تحت 747-748 عیسوی کی عبادی بغاوت کے لیے ڈرافٹ کارڈ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Yemen ve Hicaz'da Talib el-Haqq Abdullah bin Yahya ve Ebu Hamza el-Mukhtar bin Awf önderliğinde Emevi devletine karşı gerçekleştirilen İbadi devrimine dair ön bilgiler; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Gambaran awal tentang revolusi Ibadi di Yaman dan Hijaz, yang dipimpin oleh Talib al-Haqq Abdullah bin Yahya dan Abu Hamza al-Mukhtar bin Awf, melawan negara Umayyah; sumber-sumbernya belum ditinjau di halaman ini."
