summary:
  ar: "بطاقة أولية لثورة الإباضية في اليمن والحجاز بقيادة طالب الحق عبد الله بن يحيى وأبي حمزة المختار بن عوف ضد الدولة الأموية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Ibadi Revolt of 747–748 CE under Talib al-Haqq and Abu Hamza against the Umayyads; its sources are not yet checked on the page."
