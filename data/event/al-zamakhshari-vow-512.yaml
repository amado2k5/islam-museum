class: event
kind: other
label:
  ar: "مرض الزمخشري وعزمه على الزهد، ٥١٢هـ/١١١٨م"
  en: "Al-Zamakhshari's illness and vow of renunciation, 512/1118"
  ur: "زمخشری کی بیماری اور زُهد کا عزم، 512ھ/1118ء"
summary:
  ar: "بعد أن كاد الزمخشري في بلاطات السلاجقة — فمدح الوزير نظام الملك ثم ابنه مؤيد الملك والسلطانين محمد بن ملكشاه وسنجر — فلم ينل منصباً، أصابه في سنة ٥١٢هـ/١١١٨م مرض شديد، فندم على طلب الدنيا بالمدائح وعاهد نفسه ألا يدخل على سلطان ولا يمدح حاكماً ابتغاء منصب، وأن يعيش زاهداً في الدين والتعليم {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  en: "After years of addressing panegyrics to Seljuk grandees — the vizier Nizam al-Mulk, his son Mu'ayyid al-Mulk and the sultans Muhammad ibn Malikshah and Sanjar — without winning a post, largely because his open Mu'tazilism was increasingly viewed as heretical, al-Zamakhshari fell seriously ill in 512/1118. He vowed never again to visit a court or praise a ruler to seek a position, and to lead an ascetic life devoted to religion and teaching {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  ur: "سلجوقی بزرگوں — وزیر نظام الملک، اس کے بیٹے مؤید الملک اور سلطانوں محمد بن ملکشاہ اور سنجر — کی مداحی کے برسوں بعد بھی، کھلے معتزلی عقیدے کی وجہ سے، کوئی منصب نہ ملا۔ 512ھ/1118ء میں زمخشری شدید بیمار ہوئے تو انہوں نے عہد کیا کہ نہ کسی دربار میں جائیں گے اور نہ عہدے کے لیے کسی حکمران کی مدح کریں گے، اور دین و تعلیم کے لیے زاہدانہ زندگی بسر کریں گے {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}۔"
