label:
  ar: "مرض الزمخشري وعزمه على الزهد، ٥١٢هـ/١١١٨م"
  en: "Al-Zamakhshari's illness and vow of renunciation, 512/1118"
  ur: "زمخشری کی بیماری اور زُهد کا عزم، 512ھ/1118ء"
  es: "La enfermedad de Al-Zamakhshari y su voto de renuncia, 512/1118"
  fr: "La maladie d'Al-Zamakhshari et son vœu de renonciation, 512/1118"
  tr: "Zemakşari'nin hastalığı ve zühdü benimseme kararlılığı, Hicri 512/Miladi 1118"
  id: "Penyakit Al-Zamakhshari dan tekadnya untuk menjalani kehidupan asketisme, 512 H/1118 M"
summary:
  ar: "بعد أن كاد الزمخشري في بلاطات السلاجقة — فمدح الوزير نظام الملك ثم ابنه مؤيد الملك والسلطانين محمد بن ملكشاه وسنجر — فلم ينل منصباً، أصابه في سنة ٥١٢هـ/١١١٨م مرض شديد، فندم على طلب الدنيا بالمدائح وعاهد نفسه ألا يدخل على سلطان ولا يمدح حاكماً ابتغاء منصب، وأن يعيش زاهداً في الدين والتعليم {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  en: "After years of addressing panegyrics to Seljuk grandees — the vizier Nizam al-Mulk, his son Mu'ayyid al-Mulk and the sultans Muhammad ibn Malikshah and Sanjar — without winning a post, largely because his open Mu'tazilism was increasingly viewed as heretical, al-Zamakhshari fell seriously ill in 512/1118. He vowed never again to visit a court or praise a ruler to seek a position, and to lead an ascetic life devoted to religion and teaching {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  ur: "سلجوقی بزرگوں — وزیر نظام الملک، اس کے بیٹے مؤید الملک اور سلطانوں محمد بن ملکشاہ اور سنجر — کی مداحی کے برسوں بعد بھی، کھلے معتزلی عقیدے کی وجہ سے، کوئی منصب نہ ملا۔ 512ھ/1118ء میں زمخشری شدید بیمار ہوئے تو انہوں نے عہد کیا کہ نہ کسی دربار میں جائیں گے اور نہ عہدے کے لیے کسی حکمران کی مدح کریں گے، اور دین و تعلیم کے لیے زاہدانہ زندگی بسر کریں گے {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}۔"
  es: "Tras años de dirigir panegíricos a los grandes selyúcidas —el visir Nizam al-Mulk, su hijo Mu'ayyid al-Mulk y los sultanes Muhammad ibn Malikshah y Sanjar— sin conseguir un puesto, en gran parte porque su mutazilismo abierto era visto cada vez más como herético, al-Zamakhshari enfermó gravemente en 512/1118. Juró no volver a visitar una corte ni alabar a un gobernante para buscar un cargo, y llevar una vida ascética dedicada a la religión y la enseñanza {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  fr: "Après avoir passé des années à faire l'éloge des grands dignitaires seldjoukides — le vizir Nizam al-Mulk, son fils Mu'ayyid al-Mulk et les sultans Muhammad ibn Malikshah et Sanjar — sans obtenir de poste, en grande partie parce que son mu'tazilite assumé était de plus en plus perçu comme hérétique, al-Zamakhshari tomba gravement malade en 512/1118. Il fit alors le vœu de ne plus jamais se rendre à une cour ni de louer un souverain pour obtenir une position, et de mener une vie ascétique consacrée à la religion et à l'enseignement."
  tr: "Zemakşari, Selçukluların saraylarına neredeyse ulaşmışken—önce vezir Nizam el-Mulk'ü, sonra oğlu Muayyad el-Mulk'ü ve iki sultan Muhammed ibn Malikşah ile Sancar'ı övdü—bir makam elde edemedi. Hicri 512/Miladi 1118 yılında ağır bir hastalığa yakalandı, bu yüzden övgüler yoluyla dünyevi kazanç arayışından pişman oldu ve bir sultana yaklaşmamaya veya bir hükümdarı makam peşinde övmemeye, din ve eğitimde çileci bir hayat yaşamaya yemin etti. {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}"
  id: "Setelah Al-Zamakhshari hampir mencapai istana Seljuk—ia memuji menteri Nizam al-Mulk, kemudian putranya Mu’ayyad al-Mulk, dan dua sultan Muhammad ibn Malikshah dan Sanjar—ia tidak memperoleh jabatan. Pada tahun 512 H/1118 M, ia menderita sakit parah, sehingga ia menyesali pencarian keuntungan duniawi melalui pujian dan bersumpah pada dirinya sendiri untuk tidak mendekati seorang sultan atau memuji seorang penguasa demi mendapatkan jabatan, dan untuk hidup sederhana dalam agama dan pendidikan {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
