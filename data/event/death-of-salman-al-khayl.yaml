id: event/death-of-salman-al-khayl
class: event
kind: death
label: { ar: "مقتل سلمان الخيل ببلنجر", en: "The Death of Salman al-Khayl at Balanjar", es: "La muerte de Salman al-Khayl en Balanjar", fr: "La mort de Salman al-Khayl à Balanjar", ur: "بالنجر میں سلمان الخیل کی موت" }
summary:
  ar: "عند البلاذري: لقيه خاقان في خيوله خلف نهر البلنجر فقُتل في أربعة آلاف من المسلمين فكان يسمع في مأزقهم التكبير، وكان سلمان بن ربيعة أول من استُقضي بالكوفة فأقام أربعين يوماً لا يأتيه خصم وقد روى عن عمر بن الخطاب، وفي سلمان وقتيبة بن مسلم يقول ابن جمانة الباهلي «وإن لنا قبرين: قبر ببلنجر وقبر بصين اسبان — يا لك من قبرٍ فذاك الذي بالصين عمّت فتوحه وهذا الذي يُسقى به سبل القطر» وكان مع سلمان ببلنجر قرظة بن كعب الأنصاري وهو جاء بنعيه إلى عثمان."
  en: "In al-Baladhuri: the Khaqan met him with his horse beyond the river Balanjar, and he was killed among four thousand Muslims, the takbir heard in their defile; Salman ibn Rabi'a had been the first man appointed judge of Kufa — he sat forty days without a litigant coming to him — and had transmitted from Umar ibn al-Khattab; of Salman and Qutayba ibn Muslim, Ibn Jamana al-Bahili says: 'two graves are ours — a grave at Balanjar, and a grave in the lands of Spain's like (Transoxiana): that one whose conquests filled China, and this one watered by the rain-clouds' paths'; with Salman at Balanjar was Qurda ibn Ka'b al-Ansari, who brought word of his death to Uthman."
  es: "En al-Baladhuri: el Khaqan lo encontró con su caballo más allá del río Balanjar, y fue asesinado entre cuatro mil musulmanes, el takbir se escuchó en su desfiladero; Salman ibn Rabi'a había sido el primer hombre nombrado juez de Kufa —se sentó cuarenta días sin que ningún litigante se presentara ante él— y había transmitido de Umar ibn al-Khattab; de Salman y Qutayba ibn Muslim, Ibn Jamana al-Bahili dice: 'dos tumbas son nuestras: una tumba en Balanjar, y una tumba en las tierras de la España semejante (Transoxiana): aquella cuyas conquistas llenaron China, y esta regada por los caminos de las nubes de lluvia'; con Salman en Balanjar estaba Qurda ibn Ka'b al-Ansari, quien llevó la noticia de su muerte a Uthman."
  fr: "Dans al-Baladhuri: le Khaqan le rencontra avec son cheval au-delà du fleuve Balanjar, et il fut tué au milieu de quatre mille musulmans, le takbir retentit dans leur défilé; Salman ibn Rabi'a avait été le premier homme nommé juge de Kufa — il siégea quarante jours sans qu'un plaideur ne vienne à lui — et avait transmis d'Umar ibn al-Khattab; de Salman et Qutayba ibn Muslim, Ibn Jamana al-Bahili dit: « deux tombes sont les nôtres — une tombe à Balanjar, et une tombe dans les terres semblables à l'Espagne (Transoxiane): celle dont les conquêtes ont rempli la Chine, et celle-ci arrosée par les chemins des nuages de pluie »; avec Salman à Balanjar se trouvait Qurda ibn Ka'b al-Ansari, qui apporta la nouvelle de sa mort à Uthman."
  ur: "البلادوری میں ہے: خاقان نے اسے اپنے گھوڑے کے ساتھ دریائے بلنجر کے پار ملایا، اور وہ چار ہزار مسلمانوں کے درمیان مارا گیا، تکبیر ان کی ناپاکی میں سنی گئی۔ سلمان بن ربیعہ کوفہ کے پہلے مرد مقرر ہوئے جج تھے - وہ چالیس دن تک بغیر کسی مدعی کے ان کے پاس آئے - اور عمر بن الخطاب سے نقل کیا تھا؛ سلمان اور قتیبہ بن مسلم کے بارے میں، ابن جمنا الباہلی کہتے ہیں: 'دو قبریں ہماری ہیں: ایک قبر بلانجر میں، اور ایک قبر اسپین کی طرح ⁦(ٹرانسوکسیانا)⁩: وہ جس کی فتح نے چین کو بھر دیا، اور یہ بارش کے بادلوں کے راستوں سے سیراب ہو گئی۔ بالنجر میں سلمان کے ساتھ قردہ بن کعب الانصاری تھے جنہوں نے عثمان کو ان کی موت کی خبر پہنچائی۔"
