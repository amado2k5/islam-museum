label: { ar: "مقتل سلمان الخيل ببلنجر", en: "The Death of Salman al-Khayl at Balanjar" }
summary:
  ar: "عند البلاذري: لقيه خاقان في خيوله خلف نهر البلنجر فقُتل في أربعة آلاف من المسلمين فكان يسمع في مأزقهم التكبير، وكان سلمان بن ربيعة أول من استُقضي بالكوفة فأقام أربعين يوماً لا يأتيه خصم وقد روى عن عمر بن الخطاب، وفي سلمان وقتيبة بن مسلم يقول ابن جمانة الباهلي «وإن لنا قبرين: قبر ببلنجر وقبر بصين اسبان — يا لك من قبرٍ فذاك الذي بالصين عمّت فتوحه وهذا الذي يُسقى به سبل القطر» وكان مع سلمان ببلنجر قرظة بن كعب الأنصاري وهو جاء بنعيه إلى عثمان."
  en: "In al-Baladhuri: the Khaqan met him with his horse beyond the river Balanjar, and he was killed among four thousand Muslims, the takbir heard in their defile; Salman ibn Rabi'a had been the first man appointed judge of Kufa — he sat forty days without a litigant coming to him — and had transmitted from Umar ibn al-Khattab; of Salman and Qutayba ibn Muslim, Ibn Jamana al-Bahili says: 'two graves are ours — a grave at Balanjar, and a grave in the lands of Spain's like (Transoxiana): that one whose conquests filled China, and this one watered by the rain-clouds' paths'; with Salman at Balanjar was Qurda ibn Ka'b al-Ansari, who brought word of his death to Uthman."
