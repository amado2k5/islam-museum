label: { ar: "دخول البرابرة قرطبة عنوة", en: "The Berbers enter Cordoba by storm", es: "Los bereberes entran en Córdoba por la fuerza.", fr: "Les Berbères entrent dans Cordoue en pleine tempête", ur: "بربر طوفان کے ذریعے قرطبہ میں داخل ہوتے ہیں۔" }
summary:
  ar: "سنة 403هـ دخل سليمان المستعين قرطبة عنوة ومن معه من البرابرة بعد حصار هلكت فيه القرى والبسائط بقرطبة وعدمت المرافق، فقتل هشام المؤيد سراً ولحق بيوتات قرطبة معرة في نسائهم وأبنائهم، وتوثبت البرابرة والعبيد على الأعمال فولوا المدن العظيمة مثل باديس بن حبوس {cite:nafh-tib-maqqari p. 464-465}."
  en: "In 403 Sulayman al-Musta'in and the Berbers stormed Cordoba after a siege that starved its villages; Hisham al-Mu'ayyad was secretly killed, the city's households violated, and the Berbers and Saqaliba scattered to found taifa states {cite:nafh-tib-maqqari p. 464-465}."
  es: "En 403, Sulayman al-Musta'in y los bereberes asaltaron Córdoba tras un asedio que dejó a sus aldeas sin alimento; Hisham al-Mu'ayyad fue asesinado en secreto, los hogares de la ciudad fueron violados y los bereberes y los saqaliba se dispersaron para fundar estados taifa {cite:nafh-tib-maqqari p. 464-465}."
  fr: "En 403, Sulayman al-Musta'in et les Berbères prirent d'assaut Cordoue après un siège qui affama ses villages; Hisham al-Mu'ayyad fut secrètement tué, les foyers de la ville violés, et les Berbères et les Saqaliba se dispersèrent pour fonder des États taïfa {cite:nafh-tib-maqqari p. 464-465}."
  ur: "403 میں سلیمان المستعین اور بربروں نے قرطبہ پر ایک محاصرے کے بعد دھاوا بول دیا جس سے اس کے دیہات بھوکے رہ گئے۔ ہشام المعیاد کو خفیہ طور پر قتل کر دیا گیا، شہر کے گھرانوں کی خلاف ورزی کی گئی، اور بربر اور ثقلیبہ طائفہ ریاستوں کو تلاش کرنے کے لیے منتشر ہو گئے۔ 464-465}۔"
