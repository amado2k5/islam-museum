id: event/munafarat-hashim-umayya
class: event
kind: other
label: { ar: "منافرة هاشم وأمية", en: "The munafara between Hashim and Umayya", es: "La munafara entre Hashim y Umayya", fr: "La munafara entre Hashim et Umayya", ur: "ہاشم اور امیہ کے درمیان منافرہ" }
summary:
  ar: "تكلف أمية بن عبد شمس أن يفعل كما فعل هاشم بن عبد مناف في إطعام قريش الرفادة فعجز فشمت به ناس من قريش وعابوه فغضب ونافر هاشماً على خمسين ناقة سود الحدق تُنحر بمكة وعلى الجلاء عشر سنين وجعلا بينهما الكاهن الخزاعي جد عمرو بن الحمق ومنزله عسفان فقضى لهاشم بقوله المشهور «والقمر الباهر والكوكب الزاهر... لقد سبق هاشمٌ أمية إلى المآثر أولها وآخرها» فأخذ هاشم الإبل فنحرها وأطعم لحمها من حضر وخرج أمية إلى الشام فأقام عشر سنين، فتلك أول عداوة وقعت بين هاشم وأمية {cite:ansab-al-ashraf p. 61-62}."
  en: "The famous munafara: unable to match Hashim's rifada, a mocked Umayya staked fifty black-eyed camels and ten years' exile; the soothsayer of Usfan judged Hashim had 'outstripped Umayya in every glory', and Umayya went to Syria for a decade — the seed of the Hashimite–Umayyad rivalry {cite:ansab-al-ashraf p. 61-62}."
  es: "La famosa munafara: incapaz de igualar la rifada de Hashim, un Umayya ridiculizado apostó cincuenta camellos de ojos negros y diez años de exilio; el adivino de Usfan juzgó que Hashim había \"superado a Umayya en toda gloria\", y Umayya fue a Siria durante una década, la semilla de la rivalidad entre los hachemíes y los omeyas {cite:ansab-al-ashraf p. 61-62}."
  fr: "La fameuse munafara: incapable d'égaler la rifada de Hashim, un Umayya moqué a mis en jeu cinquante chameaux aux yeux noirs et dix ans d'exil; le devin d'Usfan a jugé que Hashim avait « surpassé Umayya en toute gloire », et Umayya est allé en Syrie pendant une décennie — la graine de la rivalité hachémite-omeyyade {cite:ansab-al-ashraf p. 61-62}."
  ur: "مشہور منافرہ: ہاشم کے رفاد کا مقابلہ نہ کر سکا، ایک طعنہ زدہ امیہ نے پچاس کالی آنکھوں والے اونٹوں کو داؤ پر لگا دیا اور دس سال کی جلاوطنی۔ عثفان کے کاہن نے فیصلہ کیا کہ ہاشم نے 'ہر شان میں امیہ کو پیچھے چھوڑ دیا تھا'، اور امیہ ایک دہائی کے لیے شام گئے - ہاشمی اموی دشمنی کا بیج {حوالہ: انساب الاشرف صفحہ 61-62}۔"
