label: { ar: "منافرة هاشم وأمية" }
summary:
  ar: "تكلف أمية بن عبد شمس أن يفعل كما فعل هاشم بن عبد مناف في إطعام قريش الرفادة فعجز فشمت به ناس من قريش وعابوه فغضب ونافر هاشماً على خمسين ناقة سود الحدق تُنحر بمكة وعلى الجلاء عشر سنين وجعلا بينهما الكاهن الخزاعي جد عمرو بن الحمق ومنزله عسفان فقضى لهاشم بقوله المشهور «والقمر الباهر والكوكب الزاهر... لقد سبق هاشمٌ أمية إلى المآثر أولها وآخرها» فأخذ هاشم الإبل فنحرها وأطعم لحمها من حضر وخرج أمية إلى الشام فأقام عشر سنين، فتلك أول عداوة وقعت بين هاشم وأمية {cite:ansab-al-ashraf p. 61-62}."
  en: "The famous munafara: unable to match Hashim's rifada, a mocked Umayya staked fifty black-eyed camels and ten years' exile; the soothsayer of Usfan judged Hashim had 'outstripped Umayya in every glory', and Umayya went to Syria for a decade — the seed of the Hashimite–Umayyad rivalry {cite:ansab-al-ashraf p. 61-62}."
