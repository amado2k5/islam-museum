id: event/al-hadi-and-the-wrongdoers-of-banu-mamar-at-al-ahsa-and-the-first-days-at-hawth-286
class: event
kind: other
label:
  ar: الهادي وجماعة من بني معمر المفسدين بالأحساء وأول أيامه بحوث، رجب 286هـ
  en: Al-Hadi and the wrongdoers among Banu Ma'mar at al-Ahsa, and his first days at Hawth, Rajab 286 AH
  ur: الاحساء میں بنو معمر کے مفسدین کے ساتھ ہادی اور حوث میں ان کے پہلے دن، رجب 286ھ
  es: "Al-Hadi y los malhechores entre los Banu Ma'mar en al-Ahsa, y sus primeros días en Hawth, Rajab 286 AH"
  fr: "Al-Hadi et les injustes parmi les Banu Ma'mar à al-Ahsa, et ses premiers jours à Hawth, Rajab 286 AH"
  tr: "Al-Hadi ve Ahsa'daki yozlaşmış Beni Muammer grubu ile Hicri 286 yılının Receb ayında Buhuth'taki ilk günleri."
  id: "Al-Hadi dan sekelompok Bani Muammar yang korup di Al-Ahsa, dan hari-hari pertamanya di Buhuth, Rajab 286 H."
summary:
  ar: بعد وصوله خيوان خرج الهادي يوم السبت إلى موضع لبني معمر يقال له الأحساء، بسبب جماعة من بني معمر وقعت بينهم جراح قبل خروجه إلى نجران وصلح ابنه أبو القاسم بينهم وكتب عليهم الدية، ثم عادوا إلى الإفساد وقطع الطريق. فنزل حوث وأرسل إليهم رسلاً يدعونهم يومي السبت والاثنين فقالوا إنهم يصيرون إلى أبي القاسم ثم إلى الهادي بخيوان، فرفض وأرسل الصارخ في بني ربيعة وبني صريم، وحبسه الغيث بحوث.
  en: After reaching Khiwan al-Hadi left on Saturday for a place of Banu Ma'mar called al-Ahsa, because of a group of them who had wounded one another before he went to Najran, whom his son Abu al-Qasim had reconciled, writing the blood-money on them, and who then went back to disorder and highway robbery. He camped at Hawth and sent messengers on Saturday and Monday; they answered that they would go to Abu al-Qasim and meet him at Khiwan, which he refused, sending the crier among Banu Rabi'a and Banu Sarim; rain kept him at Hawth.
  ur: خیوان پہنچنے کے بعد ہادی ہفتے کے دن بنو معمر کے ایک مقام الاحساء کی طرف نکلے، ان میں سے ایک جماعت کے سبب جن کے درمیان نجران جانے سے پہلے زخم پہنچے تھے، جن میں ان کے بیٹے ابو القاسم نے صلح کرائی اور دیت لکھی، پھر وہ فساد اور راہزنی کی طرف لوٹ گئے۔ وہ حوث میں اترے اور ہفتے اور پیر کو قاصد بھیجے؛ انہوں نے کہا کہ وہ ابو القاسم کے پاس جائیں گے اور خیوان میں ان سے ملیں گے، جسے انہوں نے رد کیا اور بنو ربیعہ اور بنو صریم میں منادی بھیجا؛ بارش نے انہیں حوث میں روکے رکھا۔
  es: "Tras llegar a Khiwan, al-Hadi partió el sábado hacia un lugar de los Banu Ma'mar llamado al-Ahsa, debido a un grupo de ellos que se habían herido entre sí antes de que él fuera a Najran. Su hijo Abu al-Qasim los había reconciliado, imponiéndoles una compensación por la sangre derramada, pero que luego habían vuelto a delinquir y a robar en los caminos. Acampó en Hawth y envió mensajeros el sábado y el lunes; estos respondieron que irían a ver a Abu al-Qasim y se encontrarían con él en Khiwan, a lo que él se negó, enviando al pregonero entre los Banu Rabi'a y los Banu Sarim. La lluvia lo retuvo en Hawth."
  fr: "Après avoir atteint Khiwan, al-Hadi partit samedi pour un lieu appartenant aux Banu Ma'mar, appelé al-Ahsa. Un groupe de ces derniers s'était blessé mutuellement avant son départ pour Najran. Son fils, Abu al-Qasim, les avait réconciliés en leur versant une compensation financière, mais ils avaient ensuite repris leurs activités de désordre et de brigandage. Il campa à Hawth et envoya des messagers samedi et lundi. Ces derniers répondirent qu'ils se rendraient auprès d'Abu al-Qasim pour le rencontrer à Khiwan, ce qu'il refusa, envoyant un crieur public parmi les Banu Rabi'a et les Banu Sarim. La pluie le retint à Hawth."
  tr: "Hayvan'a vardıktan sonra, el-Hadi, Necran'a gitmeden önce Beni Mu'ammar kabilesinden bir grup arasında çıkan bir anlaşmazlık nedeniyle Cumartesi günü Beni Mu'ammar'a ait olan el-Ahsa' adlı yere gitti. Oğlu Ebu el-Kâsım onları barıştırmış ve kan parası ödemişti, ancak onlar yine de yıkıcı ve eşkıyalık faaliyetlerine geri dönmüşlerdi. Bunun üzerine, Cumartesi ve Pazartesi günleri Havth'a indi ve onlara haberciler göndererek onları çağırdı. Onlar Ebu el-Kâsım'a ve ardından Hayvan'daki el-Hadi'ye gideceklerini söylediler, ancak o reddetti ve Beni Rabi'ah ve Beni Sarim kabilelerine bir haberci gönderdi ve el-Ghayth onu Havth'ta alıkoydu."
  id: "Setelah tiba di Khaywan, al-Hadi pergi pada hari Sabtu ke suatu tempat milik Bani Mu'ammar yang disebut al-Ahsa', karena perselisihan yang terjadi antara sekelompok Bani Mu'ammar sebelum keberangkatannya ke Najran. Putranya, Abu al-Qasim, telah mendamaikan mereka dan membayar uang darah, tetapi mereka kembali melakukan kegiatan perusakan dan perampokan. Maka, ia pergi ke Hawth dan mengirim utusan kepada mereka pada hari Sabtu dan Senin, memanggil mereka. Mereka mengatakan akan pergi ke Abu al-Qasim dan kemudian ke al-Hadi di Khaywan, tetapi ia menolak dan mengirim utusan ke Bani Rabi'ah dan Bani Sarim, dan al-Ghayth menahannya di Hawth."
