label:
  ar: "القتال وانكسار ميسرة الهادي وانهزام أصحابه ووقوفه في عراض العسكر، ص296"
  en: "The fight, the breaking of al-Hadi's left wing and the rout of his companions, p. 296"
  ur: "لڑائی، ہادی کے بائیں بازو کا ٹوٹنا اور ان کے ساتھیوں کی پسپائی، ص296"
summary:
  ar: "يسير الحكمي في عساكره حتى يقرب من الهادي، فيعبّئ الهادي عسكره ويلتقي القوم ويرتبط القتال، ثم تنكسر ميسرة الهادي وتقع الهزيمة على أصحابه، فيعارض الهادي القوم ويأخذ في عراض العسكر."
  en: "The Hakami moves up with his armies until he is near al-Hadi, who draws up his force; the two sides meet and the fighting is joined, then al-Hadi's left wing gives way and rout falls on his companions, and al-Hadi turns across the host and takes to the flanks of the army."
  ur: "حکمی اپنے لشکروں کے ساتھ ہادی کے قریب آتا ہے تو ہادی اپنی فوج کی صف بندی کرتے ہیں، دونوں فریق ملتے ہیں اور لڑائی بندھ جاتی ہے؛ پھر ہادی کا بایاں بازو ٹوٹ جاتا ہے اور ان کے ساتھیوں پر پسپائی آ پڑتی ہے، اور ہادی لشکر کے پہلوؤں کی طرف مڑ کر آڑے ہو جاتے ہیں۔"
