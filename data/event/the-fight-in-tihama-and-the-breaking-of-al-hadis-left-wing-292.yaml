id: event/the-fight-in-tihama-and-the-breaking-of-al-hadis-left-wing-292
class: event
kind: other
label:
  ar: "القتال وانكسار ميسرة الهادي وانهزام أصحابه ووقوفه في عراض العسكر، ص296"
  en: "The fight, the breaking of al-Hadi's left wing and the rout of his companions, p. 296"
  ur: "لڑائی، ہادی کے بائیں بازو کا ٹوٹنا اور ان کے ساتھیوں کی پسپائی، ص296"
  es: "La lucha, la ruptura del ala izquierda de al-Hadi y la derrota de sus compañeros, pág. 296"
  fr: "Le combat, la rupture de l'aile gauche d'al-Hadi et la déroute de ses compagnons, p. 296"
  tr: "Savaş, Maysarah al-Hadi'nin yenilgisi, arkadaşlarının bozguna uğraması ve ordudaki konumu, s. 296"
  id: "Pertempuran, kekalahan Maysarah al-Hadi, kekalahan para pengikutnya, dan kedudukannya di barisan tentara, hlm. 296"
summary:
  ar: "يسير الحكمي في عساكره حتى يقرب من الهادي، فيعبّئ الهادي عسكره ويلتقي القوم ويرتبط القتال، ثم تنكسر ميسرة الهادي وتقع الهزيمة على أصحابه، فيعارض الهادي القوم ويأخذ في عراض العسكر."
  en: "The Hakami moves up with his armies until he is near al-Hadi, who draws up his force; the two sides meet and the fighting is joined, then al-Hadi's left wing gives way and rout falls on his companions, and al-Hadi turns across the host and takes to the flanks of the army."
  ur: "حکمی اپنے لشکروں کے ساتھ ہادی کے قریب آتا ہے تو ہادی اپنی فوج کی صف بندی کرتے ہیں، دونوں فریق ملتے ہیں اور لڑائی بندھ جاتی ہے؛ پھر ہادی کا بایاں بازو ٹوٹ جاتا ہے اور ان کے ساتھیوں پر پسپائی آ پڑتی ہے، اور ہادی لشکر کے پہلوؤں کی طرف مڑ کر آڑے ہو جاتے ہیں۔"
  es: "El Hakami avanza con sus ejércitos hasta estar cerca de al-Hadi, quien reúne a sus fuerzas; ambos bandos se encuentran y comienza la lucha, entonces el ala izquierda de al-Hadi cede y la desbandada cae sobre sus compañeros, y al-Hadi se vuelve contra el ejército y ataca los flancos."
  fr: "Le Hakami avance avec ses armées jusqu'à ce qu'il soit près d'al-Hadi, qui rassemble ses forces; les deux camps se rencontrent et les combats s'engagent, puis l'aile gauche d'al-Hadi cède et la déroute s'abat sur ses compagnons, et al-Hadi se retourne contre l'armée et prend les flancs de celle-ci."
  tr: "El-Hakami, askerleriyle birlikte El-Hadi'ye yaklaşana kadar ilerler. El-Hadi askerlerini seferber eder, iki taraf karşılaşır ve çatışma başlar. Ardından El-Hadi'nin sol kanadı dağılır ve yoldaşları yenilir. El-Hadi daha sonra askerlerle karşı karşıya gelir ve ordunun yan tarafında mevzilenir."
  id: "Al-Hakami bergerak maju bersama pasukannya hingga mendekati Al-Hadi. Al-Hadi mengerahkan pasukannya, kedua pihak bertemu, dan pertempuran pun terjadi. Kemudian sayap kiri Al-Hadi runtuh, dan para pengikutnya dikalahkan. Al-Hadi kemudian menghadapi pasukan tersebut dan mengambil posisi di sisi pasukan."
