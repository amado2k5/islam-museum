label: { ar: "ولاية الحكم بن عمرو الغفاري خراسان", en: "al-Hakam ibn Amr al-Ghifari over Khurasan", es: "al-Hakam ibn Amr al-Ghifari sobre Khurasan", fr: "al-Hakam ibn Amr al-Ghifari sur le Khurasan", ur: "الحکم ابن عمرو غفاری خراسان پر", tr: "Hakam ibn Amr el-Ghifari, Horasan valiliği", id: "Pemerintahan Hakam ibn Amr al-Ghifari, Khorasan" }
summary:
  ar: "ولى زياد الحكم بن عمرو الغفاري وكان عفيفاً وله صحبة وإنما قال لحاجبه فيل ائتني بالحكم وهو يريد الحكم بن أبي العاص الثقفي وكانت أم عبد الله بنت عثمان بن أبي العاص عنده فأتاه بالحكم بن عمرو فلما رآه تبرك به وقال رجل صالح من أصحاب رسول الله فولاه خراسان فمات بها في سنة ٥٠ وكان الحكم أول من صلى من وراء النهر وسمع عبد الله بن المبارك يقول لرجل من أهل الصغانيان كان يطلب معهم الحديث أتدري من فتح بلادك قال لا قال فتحها الحكم بن عمرو الغفاري."
  en: "Ziyad told his chamberlain Fayl 'bring me al-Hakam' meaning al-Hakam ibn Abi al-As al-Thaqafi — but Umm Abdallah bint Uthman ibn Abi al-As was with him, and he was brought al-Hakam ibn Amr al-Ghifari instead; seeing him Ziyad blessed the chance: 'a righteous man of the Prophet's companions' — and gave him Khurasan, where he died in 50h, the first to pray beyond the river. Long after, Ibn Mubarak asked a Saghaniyan hadith-seeker 'do you know who conquered your land? — al-Hakam ibn Amr al-Ghifari'."
  es: "Ziyad le dijo a su chambelán Fayl: «Tráeme a al-Hakam», refiriéndose a al-Hakam ibn Abi al-As al-Thaqafi; pero Umm Abdallah bint Uthman ibn Abi al-As estaba con él, y en su lugar trajeron a al-Hakam ibn Amr al-Ghifari. Al verlo, Ziyad bendijo la oportunidad: «un hombre justo de los compañeros del Profeta», y le dio Jorasán, donde murió en el año 50 h, siendo el primero en orar al otro lado del río. Mucho tiempo después, Ibn Mubarak le preguntó a un buscador de hadices de Saghaniy: «¿Sabes quién conquistó tu tierra? — al-Hakam ibn Amr al-Ghifari»."
  fr: "Ziyad ordonna à son chambellan Fayl: « Amène-moi al-Hakam », c'est-à-dire al-Hakam ibn Abi al-As al-Thaqafi. Mais Umm Abdallah bint Uthman ibn Abi al-As était avec lui, et on lui amena al-Hakam ibn Amr al-Ghifari à sa place. À sa vue, Ziyad bénit cette rencontre: « Un homme pieux parmi les compagnons du Prophète », et lui confia le Khorasan, où il mourut en 50 heures, le premier à prier au-delà du fleuve. Bien plus tard, Ibn Mubarak demanda à un chercheur de hadiths de Saghani: « Sais-tu qui a conquis ta terre ? — al-Hakam ibn Amr al-Ghifari. »"
  ur: "زیاد نے اپنے حجرہ فاضل سے کہا کہ 'مجھے الحکم لاؤ' یعنی الحکم ابن ابی العاص الثقفی - لیکن ام عبد اللہ بنت عثمان ابن ابی العاص اس کے ساتھ تھیں، اور ان کی جگہ الحکم بن عمرو الغفاری کو لایا گیا۔ اسے دیکھ کر زیاد نے موقع دیا: 'رسول اللہ کے اصحاب میں سے ایک صالح آدمی' - اور اسے خراسان دیا، جہاں اس کا انتقال 50ھ میں ہوا، وہ پہلے دریا کے پار نماز پڑھتا تھا۔ کافی عرصہ بعد ابن مبارک نے ایک صغانی حدیث کے متلاشی سے پوچھا کہ تم جانتے ہو کہ تمہاری سرزمین کس نے فتح کی؟ الحکم ابن عمرو غفاری"
  tr: "Ziyad, iffetli ve Peygamberimizle yakın ilişkisi olan El-Hakam bin Amr El-Gıfari'yi görevlendirdi. Vezirine, \"Bana El-Hakam'ı getirin\" dedi; bu, El-Hakam bin Ebu'l-Aas El-Saqafi'yi kastediyordu. Yanında Ümmü Abdullah bint Osman bin Ebu'l-Aas vardı, bu yüzden El-Hakam bin Amr'ı ona getirdi. Onu görünce ondan salavat istedi ve \"Allah Resulü'nün sahabelerinden salih bir adam\" dedi. Onu Horasan'a görevlendirdi ve orada 50 yılında vefat etti. El-Hakam, nehrin ötesinde namaz kılan ilk kişiydi. Abdullah bin El-Mübarek, El-Saganiyan halkından hadis öğrenmek için onlarla görüşen bir adama, \"Ülkenizi kimin fethettiğini biliyor musunuz?\" dediğini işitti. Adam, \"Hayır\" dedi. El-Hakam bin Amr El-Gıfari, \"Ülkenizi El-Hakam bin Amr El-Gıfari fethetti\" dedi."
  id: "Ziyad menunjuk Al-Hakam bin Amr Al-Ghifari, yang saleh dan berteman dengan Nabi. Dia berkata kepada pengawalnya, “Bawalah Al-Hakam kepadaku,” yang dimaksud adalah Al-Hakam bin Abi Al-Aas Al-Thaqafi. Umm Abdullah bint Uthman bin Abi Al-Aas bersamanya, maka dia membawa Al-Hakam bin Amr kepadanya. Ketika dia melihatnya, dia meminta berkah darinya dan berkata, “Seorang pria saleh dari kalangan sahabat Rasulullah.” Dia menunjuknya ke Khurasan, dan dia meninggal di sana pada tahun 50. Al-Hakam adalah orang pertama yang shalat di seberang sungai. Abdullah bin Al-Mubarak mendengar dia berkata kepada seorang pria dari kaum Al-Saghaniyan yang sedang mencari hadits bersama mereka, “Apakah kamu tahu siapa yang menaklukkan negerimu?” Pria itu menjawab, “Tidak.” Dia berkata, “Al-Hakam bin Amr Al-Ghifari yang menaklukkannya.”"
