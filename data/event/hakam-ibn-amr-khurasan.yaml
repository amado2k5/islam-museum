label: { ar: "ولاية الحكم بن عمرو الغفاري خراسان", en: "al-Hakam ibn Amr al-Ghifari over Khurasan" }
summary:
  ar: "ولى زياد الحكم بن عمرو الغفاري وكان عفيفاً وله صحبة وإنما قال لحاجبه فيل ائتني بالحكم وهو يريد الحكم بن أبي العاص الثقفي وكانت أم عبد الله بنت عثمان بن أبي العاص عنده فأتاه بالحكم بن عمرو فلما رآه تبرك به وقال رجل صالح من أصحاب رسول الله فولاه خراسان فمات بها في سنة ٥٠ وكان الحكم أول من صلى من وراء النهر وسمع عبد الله بن المبارك يقول لرجل من أهل الصغانيان كان يطلب معهم الحديث أتدري من فتح بلادك قال لا قال فتحها الحكم بن عمرو الغفاري."
  en: "Ziyad told his chamberlain Fayl 'bring me al-Hakam' meaning al-Hakam ibn Abi al-As al-Thaqafi — but Umm Abdallah bint Uthman ibn Abi al-As was with him, and he was brought al-Hakam ibn Amr al-Ghifari instead; seeing him Ziyad blessed the chance: 'a righteous man of the Prophet's companions' — and gave him Khurasan, where he died in 50h, the first to pray beyond the river. Long after, Ibn Mubarak asked a Saghaniyan hadith-seeker 'do you know who conquered your land? — al-Hakam ibn Amr al-Ghifari'."
