id: event/fight-between-banu-sad-and-the-akilis-at-saada-286
class: event
kind: other
label:
  ar: القتال بين بني سعد والأكيليين في صعدة مساء، 286هـ
  en: The evening fight between Banu Sa'd and the Akilis at Sa'da, 286 AH
  ur: صعدہ میں شام کے وقت بنو سعد اور اکیلیوں کے درمیان لڑائی، 286ھ
summary:
  ar: يستدعي الهادي بني سعد من خولان فيعسكرون في ساحة اليرسميين، وقرب الغروب يعترض أصحاب ابن عباد نفراً من بني حمزة فيقتتلون ويقتل ثلاثة، ثم يرسل الهادي محمد بن عبيد الله وعلياً ومعهما خيل لصرف الناس، فتحمل بنو سعد على الأكيليين وتحرق وتهدم بعض منازلهم، ويلوم الهادي بني سعد على قتالهم بغير إذنه.
  en: Al-Hadi calls Banu Sa'd of Khawlan, who camp in the yard of the Yarsamis; near sunset Ibn Abbad's men meet a party of Banu Hamza, fighting joins and three are killed; al-Hadi sends Muhammad ibn Ubaydallah and Ali with horse to turn the people back, Banu Sa'd charge the Akilis and burn or pull down some of their houses, and al-Hadi blames Banu Sa'd for fighting without his leave.
  ur: ہادی خولان کے بنو سعد کو بلاتے ہیں جو یرسمیوں کے احاطے میں خیمہ زن ہوتے ہیں؛ غروب کے قریب ابن عباد کے لوگ بنو حمزہ کے چند افراد کو روکتے ہیں، لڑائی چھڑتی ہے اور تین مارے جاتے ہیں؛ ہادی محمد بن عبید اللہ اور علی کو سواروں کے ساتھ لوگوں کو ہٹانے بھیجتے ہیں، بنو سعد اکیلیوں پر حملہ کر کے ان کے کچھ گھر جلاتے اور ڈھاتے ہیں، اور ہادی بنو سعد کو بغیر اجازت لڑنے پر ملامت کرتے ہیں۔
