label: { ar: "وقعة أنقرة وأسر بايزيد الصاعقة" }
summary:
  ar: "التقى جيشا بايزيد الأول وتيمورلنك قرب أنقرة في عام ٨٠٤هـ/١٤٠٢م، وكانت قوات بايزيد تبلغ نحو مئة وعشرين ألف مجاهد لملاقاة خصمه، وزحف تيمورلنك على رأس قوات جرارة في ٢٠ يوليو ١٤٠٢م، وكان الوقت صيفاً شديد القيظ ومات كثير من جنود بايزيد عطشاً لقلة الماء، ولم يكد يلتقي الجيشان حتى فرّ الجنود التتار الذين كانوا في جيش بايزيد وجنود الإمارات الآسيوية التي فتحها منذ عهد قريب وانضموا إلى جيش تيمورلنك، فانتصر المغول ووقع بايزيد في الأسر وظل يرسف في أغلاله حتى وافاه الأجل في السنة التالية. وفرحت الدول النصرانية في الغرب بنصر تيمورلنك وبعث ملوك إنكلترا وفرنسا وقشتالة وإمبراطور القسطنطينية إلى تيمورلنك يهنئونه، واعتقدت أوروبا أنها تخلصت إلى الأبد من الخطر العثماني. واستولى تيمورلنك بعد الهزيمة على أزنيق وبروسة ودك أسوار أزمير وخلصها من قبضة فرسان رودس محاولاً تبرير موقفه أمام الرأي العام الإسلامي {cite:dawlat-uthmaniyya-salabi p. 69-70}."
  en: "Ankara 1402 — Timur's host broke Bayezid's 120,000 in the July heat as his Tatar and Anatolian levies defected; the Thunderbolt died in chains the next year while Europe's kings congratulated Timur {cite:dawlat-uthmaniyya-salabi p. 69-70}."
