id: event/battle-ankara-804
class: event
kind: battle
label: { ar: "وقعة أنقرة وأسر بايزيد الصاعقة", en: "The battle of Ankara and the capture of Bayezid the Thunderbolt" }
summary:
  ar: "التقى جيشا السلطان العثماني بايزيد الأول الملقب بالصاعقة وتيمور قرب أنقرة في سهل جوبوق في عام ٨٠٤هـ/١٤٠٢م، وتذكر دائرة المعارف الإسلامية التاريخ ٢٠ يوليو في مقالي تيمور وأنقرة و٢٨ يوليو في مقال بايزيد. انتصر تيمور ووقع بايزيد في الأسر، فمات في الأسر سنة ٨٠٥هـ/١٤٠٣م وانهارت دولته التي أُقيمت على عجل. وتروي رواية الصلابي أن كثيراً من جنود بايزيد ماتوا عطشاً في حر الصيف، وأن التتار وجنود الإمارات الآسيوية التي فتحها حديثاً انضموا إلى تيمور، وأن ملوك الغرب هنأوا تيمور {cite:dawlat-uthmaniyya-salabi p. 69-70}. وأعقب المعركة فراغ بين أمراء بني عثمان من ٨٠٤ إلى ٨١٦هـ/١٤٠٢ إلى ١٤١٣م، قبلوا في أثنائه سيادة تيمور."
  en: "The armies of the Ottoman sultan Bayezid I, called the Thunderbolt, and of Timur met near Ankara on the Cubuk plain in 804/1402; the Encyclopaedia of Islam gives 20 July in its articles on Timur and Ankara and 28 July in its article on Bayezid. Timur won and Bayezid was taken prisoner, dying in captivity in 805/1403 as his hastily founded empire collapsed. Al-Sallabi's account says many of Bayezid's soldiers died of thirst in the summer heat, that Tatar and recently conquered Asian levies went over to Timur, and that Western kings congratulated Timur {cite:dawlat-uthmaniyya-salabi p. 69-70}. An interregnum among the Ottoman princes followed, 804-16/1402-13, during which they acknowledged Timur's suzerainty."
  ur: "عثمانی سلطان بایزید اول المعروف صاعقہ اور تیمور کے لشکر 804ھ/1402ء میں انقرہ کے قریب چوبوق کے میدان میں ملے؛ دائرۃ المعارف اسلامیہ تیمور اور انقرہ کے مضامین میں 20 جولائی اور بایزید کے مضمون میں 28 جولائی بتاتی ہے۔ تیمور جیت گیا اور بایزید قید ہو گیا، وہ 805ھ/1403ء میں قید میں فوت ہوا اور جلدی میں بنی اس کی سلطنت بکھر گئی۔ الصلابی کے بیان کے مطابق گرمی میں بایزید کے بہت سے سپاہی پیاس سے مر گئے، تاتاری اور نئی فتح شدہ ایشیائی امارتوں کے سپاہی تیمور سے جا ملے، اور مغرب کے بادشاہوں نے تیمور کو مبارکباد دی {cite:dawlat-uthmaniyya-salabi p. 69-70}۔ اس کے بعد 804 سے 816ھ/1402 سے 1413ء تک عثمانی شہزادوں کے درمیان دورِ فترت رہا جس میں انھوں نے تیمور کی بالادستی مانی۔"
