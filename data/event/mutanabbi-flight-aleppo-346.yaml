label:
  ar: "هرب المتنبي سراً من حلب، نحو ٣٤٦هـ/٩٥٨م"
  en: "Al-Mutanabbi's secret flight from Aleppo, c. 346/958"
  ur: "حلب سے متنبی کی خفیہ روانگی، تقریباً 346ھ/958ء"
summary:
  ar: "بعد تسع سنين عند سيف الدولة ضاق المتنبي بأعداء كثرهم عليه كبرياؤه وشهرته، وفي مقدمتهم أبو فراس؛ ولما ملّ سيف الدولة تعجرف شاعره وانقطعت حمايته لم يعد أبو الطيب يأمن على حياته، فهرب سراً من حلب بكل ما يملك ولاذ بدمشق {cite:encyclopaedia-of-islam-2 vol. 7 p. 770} (نحو ٣٤٦هـ/٩٥٨م استنباطاً من مدة التسع سنين)."
  en: "After nine years with Sayf al-Dawla, al-Mutanabbi's arrogance and fame had won him implacable enemies, led by the famous Abu Firas. When the amir tired of his poet's insolence and protection lapsed, Abu al-Tayyib no longer felt his life safe; he fled secretly from Aleppo with all he owned and took refuge in Damascus (c. 346/958, derived from the nine-year stay) {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "سيف الدولہ کے ہاں نو برس بعد متنبی کے تکبر اور شہرت نے ان کے وفادار دشمن بٹھا دیے جن کی قیادت ابو فراس نے کی۔ جب امیر شاعر کے روئیے سے تنگ آیا اور سرپرستی ختم ہوئی تو ابوالطیب کو اپنی جان کا خطرہ محسوس ہوا؛ وہ اپنی تمام تر ملکیت سمیت حلب سے خفیہ طور پر بھاگے اور دمشق میں پناہ لی (تقریباً 346ھ/958ء — نو برس کے قیام سے اخذ شدہ) {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
