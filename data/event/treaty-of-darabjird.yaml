label: { ar: "صلح دارابجرد", en: "Treaty of Darabjird", es: "Tratado de Darabjird", fr: "Traité de Darabjird", ur: "درابجرد کا معاہدہ", tr: "Darabjerd Barışı", id: "Kedamaian Darabjerd" }
summary:
  ar: "أتى عثمان بن أبي العاص دارابجرد وكانت شادروان علمهم ودينهم وعليها الهربذ فصالحه الهربذ على مال أعطاه إياه وعلى أن أهل دارابجرد كلهم أسوة من فتحت بلاده من أهل فارس واجتمع له جمع بناحية جهرم ففضهم وفتح أرض جهرم وأتى فسا فصالحه عظيمها على مثل صلح دارابجرد ويقال إن الهربذ صالح عليها أيضاً."
  en: "Uthman came to Darabjird — their banner-town and seat of religion, its master the Hirbadh — who truced on money paid and on its folk standing equal with the surrendered towns of Fars; a gathering near Jahram he scattered and took its land, then Fasa's great-man truced on Darabjird's terms — or, it is said, the Hirbadh truced it too."
  es: "Uthman llegó a Darabjird, su ciudad bandera y sede religiosa, cuyo señor era el Hirbadh, quien hizo una tregua a cambio de dinero y de que su gente fuera considerada igual a las ciudades rendidas de Fars; dispersó una asamblea cerca de Jahram y se apoderó de sus tierras, luego el gran hombre de Fasa hizo una tregua en los términos de Darabjird, o, según se dice, el Hirbadh también hizo una tregua con ella."
  fr: "Uthman arriva à Darabjird — leur ville bannière et siège religieux, son maître le Hirbadh — qui conclut une trêve moyennant une somme d'argent et l'égalité de ses habitants avec les villes de Fars qui s'étaient rendues; il dispersa un rassemblement près de Jahram et s'empara de ses terres, puis le grand homme de Fasa conclut une trêve aux conditions de Darabjird — ou, dit-on, le Hirbadh conclut également une trêve."
  ur: "عثمان درابجرد میں آیا - ان کا بینر شہر اور مذہب کا مرکز، اس کا آقا ہیربدھ - جس نے رقم ادا کی اور اس کے لوگوں پر فارس کے ہتھیار ڈالنے والے شہروں کے برابر کھڑے ہوئے۔ جہرم کے قریب ایک اجتماع کو اس نے منتشر کیا اور اس کی زمین پر قبضہ کر لیا، پھر فاسہ کے عظیم آدمی نے درابجرد کی شرائط پر صلح کر لی - یا کہا جاتا ہے کہ حیرباد نے بھی اس پر فتح پائی۔"
  tr: "Osman ibn Abi el-As, Darabcird'e geldi. Orası, ilim ve din konusunda Şadirawan'dı ve Harbadh onun başındaydı. Harbadh, Osman'ın kendisine para vermesi ve Darabcird halkının tamamının, Osman'ın Perslerden fethettiği topraklardaki insanlar gibi olması şartıyla onunla barış yaptı. Jahram bölgesinde onun için bir grup toplandı; Osman onları dağıttı ve Jahram topraklarını fethetti. Fas'a geldi ve oranın ileri gelenlerinden biri, Darabcird'le yaptığı barış anlaşmasının aynı şartlarıyla onunla barış yaptı. Rivayetlere göre Harbadh da onunla barış yaptı."
  id: "Utsman bin Abi al-As datang ke Darabjird, dan tempat itu merupakan pusat ilmu dan agama mereka, dan Harbadh yang bertanggung jawab atasnya. Maka Harbadh berdamai dengannya dengan syarat ia memberinya uang dan seluruh penduduk Darabjird akan diperlakukan seperti penduduk yang tanahnya telah ditaklukkannya dari Persia. Sekelompok orang berkumpul untuknya di wilayah Jahram, lalu ia membubarkan mereka dan menaklukkan tanah Jahram. Ia datang ke Fasa, dan penguasa besarnya berdamai dengannya dengan syarat yang sama seperti perdamaian di Darabjird. Dikatakan bahwa Harbadh juga berdamai dengannya."
