label: { ar: "حريق الفسطاط ووزارة شيركوه ثم صلاح الدين", en: "The Burning of al-Fustat, the Vizierate of Shirkuh, then Salah al-Din", es: "La quema de al-Fustat, el visirismo de Shirkuh, y luego Salah al-Din.", fr: "L'incendie d'al-Fustat, le vizirat de Shirkuh, puis Salah al-Din", ur: "الفستات کو جلانا، شرکوہ کا وزیر، پھر صلاح الدین", tr: "Fustat'ın ateşi, Şirkuh'un bakanlığı ve ardından Selahaddin Eyyubi'nin dönemi.", id: "Api Fustat, kementerian Shirkuh, dan kemudian Saladin" }
summary:
  ar: "في سنة أربع وستين قصدت الفرنج الديار المصرية في جيش عظيم فملكوا بلبيس وحاصروا القاهرة فأحرقها صاحبها خوفاً منهم ثم كاتب السلطان نور الدين يستنجد به فجاء أسد الدين بجيوشه فرحل الفرنج عن القاهرة لما سمعوا بوصوله ودخل أسد الدين فولاه العاضد صاحب مصر الوزارة وخلع عليه فلم يلبث أسد الدين أن مات بعد خمسة وستين يوماً فولى العاضد مكانه ابن أخيه صلاح الدين يوسف بن أيوب وقلده الأمور ولقبه الملك الناصر فقام بالسلطنة أتم قيام {cite:tarikh-khulafa-minhaj-1434 p. 680}."
  en: "In 564 the Franks came on Egypt in a great host, took Bilbays and besieged Cairo — its lord burnt al-Fustat for fear of them — then wrote Nur al-Din for aid. Shirkuh came, the Franks withdrew, al-Adid made him vizier — and he died sixty-five days later. His nephew Salah al-Din took his place, titled al-Malik al-Nasir, and served the sultanate as none could {cite:tarikh-khulafa-minhaj-1434 p. 680}."
  es: "En 564, los francos invadieron Egipto con un gran ejército, tomaron Bilbays y sitiaron El Cairo —su señor incendió al-Fustat por temor a ellos—, y luego escribieron a Nur al-Din pidiendo ayuda. Shirkuh acudió, los francos se retiraron, al-Adid lo nombró visir, y murió sesenta y cinco días después. Su sobrino Salah al-Din ocupó su lugar, con el título de al-Malik al-Nasir, y sirvió al sultanato como nadie más podía hacerlo {cite:tarikh-khulafa-minhaj-1434 p. 680}."
  fr: "En 564, les Francs envahirent l'Égypte avec une immense armée, prirent Bilbays et assiégèrent Le Caire. Son seigneur incendia al-Fustat par crainte de leur arrivée, puis écrivit à Nur al-Din pour lui demander de l'aide. Shirkuh arriva, les Francs se retirèrent, al-Adid le nomma vizir, et il mourut soixante-cinq jours plus tard. Son neveu Salah al-Din lui succéda, reçut le titre d'al-Malik al-Nasir, et servit le sultanat avec une dévouement sans égal."
  ur: "564 میں فرانکس ایک عظیم لشکر کے ساتھ مصر پر آئے، بلبیز کو لے کر قاہرہ کا محاصرہ کیا - اس کے مالک نے ان کے خوف سے الفستات کو جلا دیا - پھر مدد کے لیے نورالدین لکھا۔ شرکوہ آیا، فرینک واپس چلے گئے، العدید نے اسے وزیر بنا دیا - اور پینسٹھ دن بعد اس کی موت ہو گئی۔ ان کی جگہ ان کے بھتیجے صلاح الدین نے المالک النصیر کا لقب اختیار کیا اور سلطنت کی ایسی خدمت کی جیسا کہ کوئی نہیں کرسکتا۔ 680}۔"
  tr: "64. yılda Franklar büyük bir orduyla Mısır topraklarına doğru ilerlediler, Bilbeis'i ele geçirdiler ve Kahire'yi kuşattılar. Bunun üzerine Kahire hükümdarı onlardan korkarak şehri yaktı. Ardından Sultan Nur al-Din'e yardım istemek için mektup yazdı. Bunun üzerine Asad al-Din ordularıyla birlikte geldi. Franklar onun gelişini duyunca Kahire'den ayrıldılar ve Asad al-Din şehre girdi. Mısır hükümdarı al-Adid onu vezir olarak atadı ve ona şeref elbisesi verdi. Asad al-Din 65 gün sonra vefat etti. Bunun üzerine al-Adid onun yerine yeğeni Salah al-Din Yusuf ibn Ayyub'u atadı, ona işleri emanet etti ve ona Kral al-Nasir unvanını verdi. Böylece o, sultanlığı tam olarak yönetti. {cite:tarikh-khulafa-minhaj-1434 s. 680}"
  id: "Pada tahun enam puluh empat, bangsa Frank menuju ke tanah Mesir dengan pasukan besar, sehingga mereka merebut Bilbeis dan mengepung Kairo, yang kemudian penguasanya membakar kota itu karena takut kepada mereka. Kemudian ia menulis surat kepada Sultan Nur al-Din untuk meminta bantuannya, sehingga Asad al-Din datang dengan pasukannya. Bangsa Frank meninggalkan Kairo ketika mendengar kedatangannya, dan Asad al-Din masuk. Al-Adid, penguasa Mesir, mengangkatnya sebagai wazir dan memberinya jubah kehormatan. Asad al-Din tidak hidup lama setelah enam puluh lima hari, sehingga al-Adid mengangkat keponakannya Salah al-Din Yusuf ibn Ayyub sebagai penggantinya dan mempercayakan urusan kepadanya serta memberinya gelar Raja al-Nasir. Maka ia melanjutkan pemerintahan kesultanan sepenuhnya. {cite:tarikh-khulafa-minhaj-1434 p. 680}."
