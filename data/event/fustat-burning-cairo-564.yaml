label: { ar: "حريق الفسطاط ووزارة شيركوه ثم صلاح الدين" }
summary:
  ar: "في سنة أربع وستين قصدت الفرنج الديار المصرية في جيش عظيم فملكوا بلبيس وحاصروا القاهرة فأحرقها صاحبها خوفاً منهم ثم كاتب السلطان نور الدين يستنجد به فجاء أسد الدين بجيوشه فرحل الفرنج عن القاهرة لما سمعوا بوصوله ودخل أسد الدين فولاه العاضد صاحب مصر الوزارة وخلع عليه فلم يلبث أسد الدين أن مات بعد خمسة وستين يوماً فولى العاضد مكانه ابن أخيه صلاح الدين يوسف بن أيوب وقلده الأمور ولقبه الملك الناصر فقام بالسلطنة أتم قيام {cite:tarikh-khulafa-minhaj-1434 p. 680}."
  en: "In 564 the Franks came on Egypt in a great host, took Bilbays and besieged Cairo — its lord burnt al-Fustat for fear of them — then wrote Nur al-Din for aid. Shirkuh came, the Franks withdrew, al-Adid made him vizier — and he died sixty-five days later. His nephew Salah al-Din took his place, titled al-Malik al-Nasir, and served the sultanate as none could {cite:tarikh-khulafa-minhaj-1434 p. 680}."
