label: { ar: "وقعة مرج دابق ودخول سليم مصر", en: "The Battle of Marj Dabiq and Selim's Entry into Egypt", es: "La batalla de Marj Dabiq y la entrada de Selim en Egipto", fr: "La bataille de Marj Dabiq et l'entrée de Selim en Égypte", ur: "مرج دبیق کی جنگ اور سلیم کا مصر میں داخلہ", tr: "Marj Dabiq Muharebesi ve Selim'in Mısır'a Girişi", id: "Pertempuran Marj Dabiq dan masuknya Selim ke Mesir" }
summary:
  ar: "قال جرامرد الناصري الحنفي تلميذ السيوطي في خاتمة الكتاب لا شك ولا ارتياب أن فتنة المئة التاسعة هي فتنة ابن عثمان سليم شاه وحروبه مع إخوته وقتله إياهم وأولادهم شر قتلة ولم يبق منهم أحداً لا كبيراً ولا صغيراً ثم حروبه صاحب الشرق وكسره إياه شر كسرة ثم قتله علي دولات وأخذه بلاده ثم اجتماعه بعسكر مصر وسلطانهم على مرج دابق وقتله سلطانها وأكابر أمرائها ونوابها ثم توجهه إلى مصر ودخوله إليها في أسرع حال وأقصر زمان من غير توان ولا مهلة وفعله فيها مع أهلها ما فعل، وأظن أني لو حلفت بالله لم أحنث أن فتنة التتار وتمرلنك استصغرتا بالنسبة إليها فإن التتار وتمرلنك ما دخلاها وانكسرا من الشام وردا خائبين {cite:tarikh-khulafa-minhaj-1434 p. 798}. وفي شذرات الذهب سنة اثنتين وعشرين وتسع مئة زالت دولة الجراكسة بملوك بني عثمان ووقعت الوقعة بسبب إسماعيل شاه بموضع يسمى مرج دابق شمالي حلب بمرحلة خامس عشر رجب فانهزم عسكر الغوري بمكيدة خاير بك وانفقد الغوري تحت سنابك الخيل وأقام السلطان سليم بعد الوقعة في بلاد الشام أشهراً وأمر بعمارة قبر الشيخ محيي الدين بن عربي بصالحية دمشق ثم تولى مصر في تلك المدة الملك الأشرف طومان باي الجركسي ابن أخي الغوري ووقع بينه وبين سليم حروب ثم سلم نفسه طائعاً فقتل بباب زويلة وأمر سليم بدفنه بمدفن النوطي وبه انقضت دولة الجراكسة {cite:shadharat-dhahab p. 518, 531}."
  en: "In his colophon Suyuti's student Jaramard al-Nasiri names the ninth century's calamity: Selim Shah ibn Uthman — his wars on his brothers and their killing 'the worst of killings, leaving none great or small', his breaking of the lord of the East and killing of Ali Dawlat, then meeting Egypt's host and sultan at Marj Dabiq, killing the sultan and his great amirs, then entering Egypt 'in the swiftest state and shortest time' — a blow, he says, beside which the Tatars' and Timur's calamities seem small, for they never entered Egypt {cite:tarikh-khulafa-minhaj-1434 p. 798}."
  es: "En su colofón, el alumno de Suyuti, Jaramard al-Nasiri, nombra la calamidad del siglo IX: Selim Shah ibn Uthman — sus guerras contra sus hermanos y su asesinato, \"la peor de las matanzas, sin dejar a nadie grande ni pequeño\", su derrota del señor del Oriente y el asesinato de Ali Dawlat, luego el encuentro con el ejército y el sultán de Egipto en Marj Dabiq, el asesinato del sultán y sus grandes emires, y luego la entrada en Egipto \"en el estado más rápido y en el menor tiempo\" — un golpe, dice, junto al cual las calamidades de los tártaros y de Tamerlán parecen pequeñas, porque nunca entraron en Egipto {cite:tarikh-khulafa-minhaj-1434 p. 798}."
  fr: "Dans son colophon, l'élève de Suyuti, Jaramard al-Nasiri, cite la calamité du IXe siècle: Selim Shah ibn Uthman — ses guerres contre ses frères et leur massacre « le pire des massacres, ne laissant aucun grand ni petit », sa défaite face au seigneur de l'Orient et le meurtre d'Ali Dawlat, puis sa rencontre avec l'armée et le sultan d'Égypte à Marj Dabiq, le meurtre du sultan et de ses grands émirs, puis son entrée en Égypte « dans l'état le plus rapide et le plus court délai » — un coup, dit-il, à côté duquel les calamités des Tatars et de Timour semblent petites, car ils ne sont jamais entrés en Égypte {cite:tarikh-khulafa-minhaj-1434 p. 798}."
  ur: "سیوطی کے طالب علم جرارمرد النصیری نے نویں صدی کی آفت کا نام لیا ہے: سلیم شاہ ابن عثمان - اپنے بھائیوں پر اس کی جنگیں اور ان کا قتل 'بدترین قتل، جس میں کوئی چھوٹا یا بڑا نہیں چھوڑا گیا'، اس کا مشرق کے آقا کا ٹوٹنا اور علی دولت کا قتل، پھر مصر کے سلطان سے ملاقات اور اس کے مرشد کا قتل بڑے امیروں کا، پھر 'تیز ترین حالت اور مختصر ترین وقت میں' مصر میں داخل ہونا - ایک دھچکا، وہ کہتا ہے، جس کے علاوہ تاتاریوں اور تیمور کی آفات چھوٹی لگتی ہیں، کیونکہ وہ کبھی مصر میں داخل نہیں ہوئے تھے۔ 798}۔"
  tr: "Suyuti'nin öğrencisi Nasiri Hanefi, kitabının sonuç bölümünde şöyle demiştir: \"Dokuzuncu yüzyılın fitnesinin, İbn Osman Selüm Şah'ın fitnesi ve kardeşleriyle yaptığı savaşlar, onları ve çocuklarını en kötü şekilde öldürmesi, yaşlısından gencine hiçbirini bırakmaması, ardından Doğu hükümdarıyla yaptığı savaşlar ve onu en kötü şekilde kırması, Ali Davlat'ı öldürmesi ve topraklarını ele geçirmesi, ardından Merc Dabik'te Mısır ordusu ve Sultanı ile karşılaşması ve Sultanı ile en önemli prenslerini ve vekillerini öldürmesi, ardından Mısır'a gitmesi ve hiç vakit kaybetmeden en hızlı şekilde oraya girmesi ve halkına yaptıklarına dair hiçbir şüphe veya tereddüt yoktur. Ve bence Allah'a yemin etsem bile, Tatarların ve Timur Lenk'in fitnesinin bunun yanında önemsiz olduğunu söylemem. Çünkü Tatarlar ve Timur Lenk oraya girmediler.\" Levant'tan yenilgiye uğradılar ve hayal kırıklığına uğrayarak geri döndüler. {cite:tarikh-khulafa-minhaj-1434 s. 798}. Hicri 922 yılında Şadharat el-Dhahab'da Çerkes devleti Osmanlı kralları tarafından yıkıldı. Savaş, İsmail Şah yüzünden, Receb ayının on beşinci gününde, Halep'in kuzeyindeki Marj Dabiq adlı bir yerde gerçekleşti. El-Guri'nin ordusu Hayr Bek'in hilesiyle yenilgiye uğradı ve El-Guri atların ayaklarının altında kayboldu. Sultan Selim, savaştan sonra aylarca Levant'ta kaldı ve Şam'daki Salihia'da Şeyh Muhyiddin İbn Arabi'nin türbesinin restore edilmesini emretti. Daha sonra, bu dönemde, El-Guri'nin yeğeni Kral el-Eşref Tuman Bey el-Carkasi Mısır'ı ele geçirdi. Onunla Selim arasında savaşlar oldu, sonra gönüllü olarak teslim oldu ve Bab Zuwayla'da öldürüldü. Selim, onun el-Nawti mezarlığına gömülmesini emretti ve böylece Çerkes devleti sona erdi. {kaynak:şadharat-dhahab s. 518, 531}"
  id: "Al-Nasiri al-Hanafi, seorang murid al-Suyuti, berkata dalam kesimpulan bukunya: Tidak ada keraguan atau ketidakpastian bahwa fitnah abad kesembilan adalah fitnah Ibnu Utsman Selim Shah dan peperangannya dengan saudara-saudaranya serta pembunuhannya terhadap mereka dan anak-anak mereka dengan cara yang paling buruk, dan dia tidak meninggalkan seorang pun dari mereka, baik tua maupun muda, kemudian peperangannya dengan penguasa Timur dan penghancurannya dengan cara yang paling buruk, kemudian pembunuhannya terhadap Ali Dawlat dan perebutan tanahnya, kemudian pertemuannya dengan tentara Mesir dan Sultan mereka di Marj Dabiq dan pembunuhannya terhadap Sultan dan para pangeran serta wakilnya yang paling penting, kemudian perjalanannya ke Mesir dan memasukinya dengan cara tercepat dan tersingkat tanpa penundaan atau jeda dan apa yang dia lakukan terhadap rakyatnya, dan saya pikir jika saya bersumpah demi Allah saya tidak akan mengingkari sumpah saya bahwa fitnah Tatar dan Timur Lenk tidak berarti dibandingkan dengan itu, karena Tatar dan Timur Lenk tidak memasukinya dan dikalahkan dari Levant dan kembali Kecewa. {cite:tarikh-khulafa-minhaj-1434 p. 798}. Dalam Shadharat al-Dhahab, pada tahun 922 H, negara Sirkasia dihancurkan oleh raja-raja Utsmani. Pertempuran terjadi karena Ismail Shah di tempat bernama Marj Dabiq, utara Aleppo, pada tanggal lima belas Rajab. Pasukan al-Ghuri dikalahkan oleh tipu daya Khayr Bek, dan al-Ghuri menghilang di bawah derap kaki kuda. Sultan Selim tinggal di Levant selama berbulan-bulan setelah pertempuran dan memerintahkan pemugaran makam Syekh Muhyiddin Ibn Arabi di Salihia, Damaskus. Kemudian, selama periode itu, Raja al-Ashraf Tuman Bay al-Jarkasi, keponakan al-Ghuri, mengambil alih Mesir. Perang terjadi antara dia dan Selim, kemudian dia menyerah dengan sukarela dan terbunuh di Bab Zuwayla. Selim memerintahkan agar ia dimakamkan di pemakaman al-Nawti, dan dengan demikian, negara Sirkasia berakhir. {cite:shadharat-dhahab hlm. 518, 531}."
