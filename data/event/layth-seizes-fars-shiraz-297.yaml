id: event/layth-seizes-fars-shiraz-297
class: event
kind: conquest
label: { ar: "استيلاء الليث الصفاري على فارس وشيراز ٢٩٧هـ", en: "al-Layth al-Saffar seizes Fars and Shiraz, 297", es: "Al-Layth al-Saffar toma Fars y Shiraz, 297", fr: "al-Layth al-Saffar s'empare de Fars et de Shiraz, 297", ur: "لیث الصفار نے فارس اور شیراز پر قبضہ کر لیا، 297" }
summary:
  ar: "في سنة سبع وتسعين ومائتين سار الليث بن علي بن الليث من سجستان إلى فارس فأخذها واستولى عليها، وهرب سبكري عامل المقتدر عنها إلى أرجان، فجهّز المقتدر مؤنساً الخادم وسيّره إلى فارس معونةً لسبكري فاجتمعا بأرجان، وسيّر الليث أخاه في بعض جيشه إلى شيراز ليحفظها ثم سار في بعض جنده في طريق مختصر ليواقع الحسين بن حمدان. فأشرف العسكر الذي سُيّر إلى شيراز على عسكر مؤنس وسبكري فثاروا إليهم فاقتتلوا قتالاً شديداً فانهزم عسكر الليث وأُسر هو، وعاد مؤنس مع الليث إلى بغداد {cite:kamil-ibn-al-athir p. 44-45}."
  en: "In 297 al-Layth ibn Ali ibn al-Layth marched from Sistan into Fars and seized it; Subkari, al-Muqtadir's governor, fled to Arrajan, so the caliph sent Mu'nis al-Khadim to Fars in support, and the two joined at Arrajan. Al-Layth sent his brother with part of the army to hold Shiraz, then took a shortcut to meet al-Husayn ibn Hamdan. The force sent to Shiraz caught sight of Mu'nis's and Subkari's army, which fell on them; after hard fighting al-Layth's army broke and he was taken prisoner, and Mu'nis carried him to Baghdad {cite:kamil-ibn-al-athir p. 44-45}."
  es: "En el año 297, al-Layth ibn Ali ibn al-Layth marchó desde Sistán hacia Fars y la conquistó. Subkari, gobernador de al-Muqtadir, huyó a Arrajan, por lo que el califa envió a Mu'nis al-Khadim a Fars en su ayuda, y ambos se unieron en Arrajan. Al-Layth envió a su hermano con parte del ejército para defender Shiraz, y luego tomó un atajo para encontrarse con al-Husayn ibn Hamdan. Las fuerzas enviadas a Shiraz divisaron el ejército de Mu'nis y Subkari, que los atacó. Tras una dura lucha, el ejército de al-Layth se desmoronó y fue hecho prisionero. Mu'nis lo llevó a Bagdad {cite:kamil-ibn-al-athir p. 44-45}."
  fr: "En 297, al-Layth ibn Ali ibn al-Layth marcha du Sistan au Fars et s'en empara. Subkari, gouverneur d'al-Muqtadir, s'enfuit à Arrajan. Le calife envoya alors Mu'nis al-Khadim au Fars en renfort, et les deux hommes se rejoignirent à Arrajan. Al-Layth dépêcha son frère avec une partie de l'armée pour tenir Shiraz, puis prit un raccourci pour rejoindre al-Husayn ibn Hamdan. Les troupes envoyées à Shiraz aperçurent l'armée de Mu'nis et Subkari, qui les attaqua. Après de violents combats, l'armée d'al-Layth se débanda et il fut fait prisonnier. Mu'nis le conduisit à Bagdad (voir Kamil ibn al-Athir, p. 44-45)."
  ur: "297 میں لیث ابن علی ابن لیث نے سیستان سے فارس کی طرف کوچ کیا اور اس پر قبضہ کر لیا۔ مقتدیر کا گورنر سبکری فرار ہو کر اراجان چلا گیا، چنانچہ خلیفہ نے معان الخادم کو مدد کے لیے فارس بھیج دیا، اور دونوں اراجان میں شامل ہو گئے۔ لیث نے اپنے بھائی کو فوج کے ایک حصے کے ساتھ شیراز پر قبضہ کرنے کے لیے بھیجا، پھر حسین بن حمدان سے ملنے کے لیے شارٹ کٹ لیا۔ شیراز کی طرف بھیجی گئی فوج نے معنیس اور سبکاری کی فوج کو دیکھا، جو ان پر ٹوٹ پڑی۔ سخت لڑائی کے بعد لیث کی فوج ٹوٹ گئی اور اسے قیدی بنا لیا گیا اور معنیس اسے بغداد لے گیا۔ 44-45}۔"
