label: { ar: "استيلاء الليث الصفاري على فارس وشيراز ٢٩٧هـ", en: "al-Layth al-Saffar seizes Fars and Shiraz, 297" }
summary:
  ar: "في سنة سبع وتسعين ومائتين سار الليث بن علي بن الليث من سجستان إلى فارس فأخذها واستولى عليها، وهرب سبكري عامل المقتدر عنها إلى أرجان، فجهّز المقتدر مؤنساً الخادم وسيّره إلى فارس معونةً لسبكري فاجتمعا بأرجان، وسيّر الليث أخاه في بعض جيشه إلى شيراز ليحفظها ثم سار في بعض جنده في طريق مختصر ليواقع الحسين بن حمدان. فأشرف العسكر الذي سُيّر إلى شيراز على عسكر مؤنس وسبكري فثاروا إليهم فاقتتلوا قتالاً شديداً فانهزم عسكر الليث وأُسر هو، وعاد مؤنس مع الليث إلى بغداد {cite:kamil-ibn-al-athir p. 44-45}."
  en: "In 297 al-Layth ibn Ali ibn al-Layth marched from Sistan into Fars and seized it; Subkari, al-Muqtadir's governor, fled to Arrajan, so the caliph sent Mu'nis al-Khadim to Fars in support, and the two joined at Arrajan. Al-Layth sent his brother with part of the army to hold Shiraz, then took a shortcut to meet al-Husayn ibn Hamdan. The force sent to Shiraz caught sight of Mu'nis's and Subkari's army, which fell on them; after hard fighting al-Layth's army broke and he was taken prisoner, and Mu'nis carried him to Baghdad {cite:kamil-ibn-al-athir p. 44-45}."
