kind: competition
label:
  ar: جائزة دبي الدولية للقرآن الكريم
  en: Dubai International Holy Quran Award
  ur: دبئی بین الاقوامی قرآن کریم ایوارڈ
summary:
  ar: جائزة ومسابقة دولية سنوية لحفظ القرآن الكريم في دبي، انطلقت سنة 1418هـ (1997) بأمر محمد بن راشد آل مكتوم؛ تنظم مسابقة
    دولية للذكور وأخرى للإناث ومسابقات محلية، وتكرم كل عام «شخصية العام الإسلامية»، وتصدر كتبا في الدراسات القرآنية.
  en: An annual international award and competition for memorising the Qur'an in Dubai, launched in 1418 AH (1997) by order
    of Muhammad bin Rashid Al Maktoum; it runs an international competition for men, another for women and local competitions,
    honours an Islamic Personality of the Year, and publishes books in Qur'anic studies.
  ur: دبئی میں حفظِ قرآن کا سالانہ بین الاقوامی انعام اور مقابلہ، جو 1418ھ (1997) میں محمد بن راشد آل مکتوم کے حکم سے شروع
    ہوا؛ مردوں اور خواتین کے بین الاقوامی اور مقامی مقابلے کرواتا ہے، ہر سال «اسلامی شخصیتِ سال» کو اعزاز دیتا ہے اور قرآنی
    علوم پر کتابیں شائع کرتا ہے۔
