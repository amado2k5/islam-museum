id: event/dubai-quran-award
class: event
kind: competition
label:
  ar: جائزة دبي الدولية للقرآن الكريم
  en: Dubai International Holy Quran Award
  ur: دبئی بین الاقوامی قرآن کریم ایوارڈ
  es: "Premio Internacional del Sagrado Corán de Dubái"
  fr: "Prix international du Saint Coran de Dubaï"
  tr: "Dubai Uluslararası Kuran Ödülü"
  id: "Penghargaan Al-Quran Suci Internasional Dubai"
summary:
  ar: جائزة ومسابقة دولية سنوية لحفظ القرآن الكريم في دبي، انطلقت سنة 1418هـ (1997) بأمر محمد بن راشد آل مكتوم؛ تنظم مسابقة
    دولية للذكور وأخرى للإناث ومسابقات محلية، وتكرم كل عام «شخصية العام الإسلامية»، وتصدر كتبا في الدراسات القرآنية.
  en: An annual international award and competition for memorising the Qur'an in Dubai, launched in 1418 AH (1997) by order
    of Muhammad bin Rashid Al Maktoum; it runs an international competition for men, another for women and local competitions,
    honours an Islamic Personality of the Year, and publishes books in Qur'anic studies.
  ur: دبئی میں حفظِ قرآن کا سالانہ بین الاقوامی انعام اور مقابلہ، جو 1418ھ (1997) میں محمد بن راشد آل مکتوم کے حکم سے شروع
    ہوا؛ مردوں اور خواتین کے بین الاقوامی اور مقامی مقابلے کرواتا ہے، ہر سال «اسلامی شخصیتِ سال» کو اعزاز دیتا ہے اور قرآنی
    علوم پر کتابیں شائع کرتا ہے۔
  es: "Se trata de un premio y concurso internacional anual para memorizar el Corán en Dubái, creado en 1418 AH (1997) por orden de Muhammad bin Rashid Al Maktoum; organiza un concurso internacional para hombres, otro para mujeres y concursos locales, otorga el título de Personalidad Islámica del Año y publica libros sobre estudios coránicos."
  fr: "Un prix et un concours international annuel pour la mémorisation du Coran à Dubaï, lancé en 1418 AH (1997) sur ordre de Muhammad bin Rashid Al Maktoum; il organise un concours international pour les hommes, un autre pour les femmes et des concours locaux, honore une personnalité islamique de l'année et publie des livres sur les études coraniques."
  tr: "Dubai'de her yıl düzenlenen, Kur'an-ı Kerim ezberleme yarışması ve ödülü, Muhammed bin Raşid el Maktum'un emriyle 1418 Hicri yılında (1997) başlatılmıştır; erkekler için uluslararası, kadınlar için ayrı yarışmalar ve yerel yarışmalar düzenlemekte, her yıl \"Yılın İslam Şahsiyeti\"ni onurlandırmakta ve Kur'an çalışmaları üzerine kitaplar yayınlamaktadır."
  id: "Sebuah penghargaan dan kompetisi internasional tahunan untuk menghafal Al-Quran di Dubai, diluncurkan pada tahun 1418 H (1997) atas perintah Mohammed bin Rashid Al Maktoum; penghargaan ini menyelenggarakan kompetisi internasional untuk pria dan kompetisi internasional untuk wanita, serta kompetisi lokal, dan setiap tahunnya memberikan penghargaan kepada \"Tokoh Islam Tahun Ini\", dan menerbitkan buku-buku tentang studi Al-Quran."
