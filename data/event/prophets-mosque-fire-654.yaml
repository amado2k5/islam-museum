label: { ar: "احتراق المسجد النبوي سنة 654هـ" }
summary:
  ar: "في ليلة الجمعة أول ليلة من رمضان سنة أربع وخمسين وست مئة احترق المسجد النبوي بعد صلاة التراويح على يد الفراش أبي بكر المراغي بسقوط ذبالة من يده فأتت النار على جميع سقوفه ووقعت بعض السواري وذاب الرصاص وذلك قبل أن ينام الناس واحترق سقف الحجرة ووقع بعضه في الحجرة الشريفة وقال بعض الناس في ذلك لم يحترق حرم النبي لريبة تخشى عليه ولا دهاه العار لكنما أيدي الروافض لامست ذاك الجناب فطهرته النار وقال ابن تولو المغربي قل للروافض بالمدينة ما لكم يقتادكم للذم كل سفيه من أصبح الحرم الشريف محرقاً إلا لذمكم الصحابة {cite:shadharat-dhahab p. 271-272}."
  en: "On Friday night, the first of Ramadan 654, after tarawih, the Prophet's Mosque burned when the chamber-keeper Abu Bakr al-Maraghi dropped a candle-end: every roof caught, columns fell, the lead melted and part of the Hujra's roof fell into the chamber — before the people slept {cite:shadharat-dhahab p. 271-272}."
