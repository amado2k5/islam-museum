label: { ar: "احتراق المسجد النبوي سنة 654هـ", en: "The burning of the Prophet's Mosque, 654", es: "El incendio de la Mezquita del Profeta, 654", fr: "L'incendie de la mosquée du Prophète, 654", ur: "مسجد نبوی کو جلانا، 654", tr: "Hicri 654 yılında Peygamber Mescidi'nin yakılması.", id: "Peristiwa terbakarnya Masjid Nabi pada tahun 654 Hijriah." }
summary:
  ar: "في ليلة الجمعة أول ليلة من رمضان سنة أربع وخمسين وست مئة احترق المسجد النبوي بعد صلاة التراويح على يد الفراش أبي بكر المراغي بسقوط ذبالة من يده فأتت النار على جميع سقوفه ووقعت بعض السواري وذاب الرصاص وذلك قبل أن ينام الناس واحترق سقف الحجرة ووقع بعضه في الحجرة الشريفة وقال بعض الناس في ذلك لم يحترق حرم النبي لريبة تخشى عليه ولا دهاه العار لكنما أيدي الروافض لامست ذاك الجناب فطهرته النار وقال ابن تولو المغربي قل للروافض بالمدينة ما لكم يقتادكم للذم كل سفيه من أصبح الحرم الشريف محرقاً إلا لذمكم الصحابة {cite:shadharat-dhahab p. 271-272}."
  en: "On Friday night, the first of Ramadan 654, after tarawih, the Prophet's Mosque burned when the chamber-keeper Abu Bakr al-Maraghi dropped a candle-end: every roof caught, columns fell, the lead melted and part of the Hujra's roof fell into the chamber — before the people slept {cite:shadharat-dhahab p. 271-272}."
  es: "La noche del viernes, la primera del Ramadán 654, después del tarawih, la Mezquita del Profeta se incendió cuando el guardián de la cámara, Abu Bakr al-Maraghi, dejó caer el extremo de una vela: todos los techos se quemaron, las columnas cayeron, el plomo se derritió y parte del techo de la Hujra se derrumbó en la cámara, antes de que la gente se durmiera {cite:shadharat-dhahab p. 271-272}."
  fr: "Dans la nuit du vendredi, premier jour du Ramadan 654, après les prières de tarawih, la Mosquée du Prophète brûla lorsque le gardien de la chambre, Abu Bakr al-Maraghi, laissa tomber le bout d'une bougie: tous les toits s'enflammèrent, les colonnes tombèrent, le plomb fondit et une partie du toit de la Hujra tomba dans la chambre — avant que les gens ne dorment {cite:shadharat-dhahab p. 271-272}."
  ur: "رمضان المبارک 654 کی پہلی شب جمعہ کی رات، تراویح کے بعد، مسجد نبوی اس وقت جل گئی جب چیمبر کے محافظ ابوبکر المراثی نے ایک شمع گرا: ہر چھت گر گئی، کالم گر گئے، سیسہ پگھل گیا اور حجرہ کی چھت کا کچھ حصہ حجرے میں گر گیا۔ 271-272}۔"
  tr: "Hicri 654 yılının Ramazan ayının ilk gecesi, Cuma gecesi, teravih namazından sonra, bekçi Ebu Bekir el-Maraghi'nin elinden düşen bir fitil yüzünden Peygamber Mescidi ateşe verildi. Alevler mescidin çatısını tamamen yaktı, bazı sütunlar yıkıldı, kurşunlar eridi ve bu olay insanlar uyumadan önce oldu. Mescidin çatısı yandı ve bir kısmı kutsal odaya düştü. Bazıları bu olay hakkında, Peygamber Mescidi'nin herhangi bir şüphe veya utançtan dolayı yakılmadığını, aksine Rafizilerin ellerinin o mescide dokunması sonucu ateşin onu temizlediğini söylediler. İbn Tulu el-Mağribi şöyle dedi: Medine'deki Rafizilere söyleyin, her aptal sizi kınamaya sevk ediyor, sizde ne yanlış var? Sahabeleri kınamanızdan başka kim kutsal mescidi yakabilir ki? {cite:şadharat-dhahab s. 271-272}."
  id: "Pada malam Jumat, malam pertama Ramadan tahun 654 H, Masjid Nabi terbakar setelah salat Tarawih oleh penjaganya, Abu Bakar al-Maraghi, ketika sebatang sumbu jatuh dari tangannya, dan api melahap seluruh atapnya, beberapa pilar roboh, dan timahnya meleleh, dan ini terjadi sebelum orang-orang tidur. Atap ruangan terbakar, dan sebagiannya jatuh ke dalam ruangan yang mulia. Sebagian orang mengatakan tentang hal ini bahwa tempat suci Nabi tidak terbakar karena kecurigaan yang dikhawatirkan akan terjadi, juga tidak diliputi rasa malu, tetapi tangan kaum Rafid menyentuh tempat suci itu, sehingga api menyucikannya. Ibnu Tulu al-Maghribi berkata: Katakan kepada kaum Rafid di Madinah, apa yang salah dengan kalian sehingga setiap orang bodoh membawa kalian kepada kecaman? Siapa lagi yang akan membakar tempat suci yang mulia kecuali karena kecaman kalian terhadap para Sahabat? {kutip:shadharat-dhahab hlm. 271-272}."
