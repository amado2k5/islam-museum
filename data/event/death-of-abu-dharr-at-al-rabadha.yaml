label: { ar: "وفاة أبي ذر بالربذة", en: "The death of Abu Dharr at al-Rabadha", es: "La muerte de Abu Dharr en al-Rabadha", fr: "La mort d'Abou Tharr à al-Rabadha", ur: "ابوذر کی وفات الربعہ میں", tr: "Ebu Zer, El-Rabadha'da vefat etti.", id: "Abu Dharr meninggal di Al-Rabadha." }
summary:
  ar: "روى ابن إسحاق عن بريدة بن سفيان الأسلمي عن محمد بن كعب القرظي عن عبد الله بن مسعود أنه لما نفى عثمان أبا ذر إلى الربذة وأصابه بها قدره لم يكن معه إلا امرأته وغلامه، فأوصاهما بغسله وتكفينه ووضعه على قارعة الطريق، فمرّ بهم ابن مسعود في رهط من أهل العراق فأعانوهم على دفنه، وتذكّر ابن مسعود قول النبي له في مسيره إلى تبوك."
  en: Ibn Ishaq relates, through Burayda ibn Sufyan al-Aslami from Muhammad ibn Ka'b al-Qurazi from Abdullah ibn Mas'ud, that when Uthman exiled Abu Dharr to al-Rabadha and his death came there, he had with him only his wife and his servant. He charged them to wash and shroud him and lay him on the road; Ibn Mas'ud passed in a party of Iraqis and helped bury him, and recalled what the Prophet had said to Abu Dharr on the march to Tabuk.
  es: "Ibn Ishaq relata, a través de Burayda ibn Sufyan al-Aslami, de Muhammad ibn Ka'b al-Qurazi, de Abdullah ibn Mas'ud, que cuando Uthman exilió a Abu Dharr a al-Rabadha y allí falleció, solo lo acompañaban su esposa y su sirviente. Les encargó que lo lavaran, lo amortajaran y lo colocaran en el camino. Ibn Mas'ud pasó con un grupo de iraquíes y ayudó a enterrarlo, y recordó lo que el Profeta le había dicho a Abu Dharr durante la marcha hacia Tabuk."
  fr: "Ibn Ishaq rapporte, par l'intermédiaire de Burayda ibn Sufyan al-Aslami, qui tenait de Muhammad ibn Ka'b al-Qurazi, qui tenait d'Abdullah ibn Mas'ud, que lorsqu'Uthman exila Abu Dharr à al-Rabadha et que celui-ci y mourut, il n'avait avec lui que sa femme et son serviteur. Il leur ordonna de le laver, de l'envelopper dans un linceul et de le déposer sur le chemin. Ibn Mas'ud, qui passait par là avec un groupe d'Irakiens, aida à l'inhumer et se souvint des paroles que le Prophète avait adressées à Abu Dharr lors de la marche vers Tabuk."
  ur: "ابن اسحاق نے بریدہ بن سفیان الاسلمی سے، محمد بن کعب القریزی سے، عبداللہ بن مسعود سے، نقل کیا ہے کہ جب عثمان نے ابوذر کو جلاوطن کیا اور وہاں ان کی وفات ہوئی تو ان کے ساتھ صرف ان کی بیوی اور اس کا خادم تھا۔ اُس نے اُن سے کہا کہ وہ اُسے نہلائیں اور کفن دیں اور اُسے سڑک پر لٹا دیں۔ ابن مسعود عراقیوں کی ایک جماعت میں سے گزرے اور انہیں دفن کرنے میں مدد کی، اور رسول اللہ نے ابوذر سے تبوک کی طرف مارچ کے موقع پر کیا کہا تھا۔"
  tr: "İbn İshak, Burayde ibn Sufyan el-Aslami'den, o da Muhammed ibn Ka'b el-Kurazi'den, o da Abdullah ibn Mesud'dan rivayet ettiğine göre, Osman, Ebu Zer'i Rabbeda'ya sürgün ettiğinde ve orada vefat ettiğinde, yanında sadece karısı ve hizmetçisi vardı. Bu yüzden onlara onu yıkamalarını, kefenlemelerini ve yol kenarına koymalarını emretti. Sonra İbn Mesud, Irak'tan bir grup insanla birlikte oradan geçti ve ona gömülmesine yardım ettiler. İbn Mesud, Tebük yolculuğunda Peygamber'in kendisine söylediklerini hatırladı."
  id: "Ibn Ishaq meriwayatkan dari Buraydah ibn Sufyan al-Aslami, dari Muhammad ibn Ka’b al-Qurazi, dari Abdullah ibn Masoud, bahwa ketika Utsman mengasingkan Abu Dzar ke al-Rabadhah dan ajal menjemputnya di sana, ia hanya ditemani istri dan pelayannya. Maka ia memerintahkan mereka untuk memandikannya, mengkafaninya, dan meletakkannya di pinggir jalan. Kemudian Ibn Masoud lewat bersama sekelompok orang dari Irak, dan mereka membantu menguburkannya. Ibn Masoud teringat apa yang dikatakan Nabi kepadanya dalam perjalanannya ke Tabuk."
