id: event/ibn-bustam-seeks-safe-conduct-through-al-daam-and-al-hadi-reaches-saada-286
class: event
kind: other
label:
  ar: ابن بسطام يطلب الأمان بوساطة الدعام ووصول الهادي إلى صعدة، 13 جمادى الآخرة 286هـ
  en: Ibn Bustam seeks safe-conduct through al-Da'am and al-Hadi reaches Sa'da, 13 Jumada II 286 AH
  ur: ابن بسطام کا دعام کے ذریعے امان مانگنا اور ہادی کا صعدہ پہنچنا، 13 جمادی الآخرہ 286ھ
  es: "Ibn Bustam busca un salvoconducto a través de al-Da'am y al-Hadi llega a Sa'da, 13 de Jumada II 286 AH"
  fr: "Ibn Bustam cherche un sauf-conduit via al-Da'am et al-Hadi atteint Sa'da, 13 Joumada II 286 AH"
  tr: "İbn Bastam, el-Da'am'ın arabuluculuğu ve el-Hadi'nin Sa'de'ye gelişiyle güvenli geçişi talep eder (Hicri 286 yılının Cemadi ahiret ayının 13. günü)."
  id: "Ibn Bastam memohon keselamatan melalui perantaraan al-Da'am dan kedatangan al-Hadi di Sa'dah, 13 Jumada al-Akhirah 286 H."
summary:
  ar: كان ابن بسطام قد هرب حين صح له أن الهادي خرج من خيوان قاصداً نجران، فصار إلى الدعام وطلب منه أن يلتمس له الأمان، فلقي الدعام الهادي وحمل نفسه عليه وطلب الأمان لابن بسطام، فآمنه الهادي وصفح عن زلته وسار معه واختلط بعسكره، ووصل الهادي إلى صعدة يوم الأربعاء لثلاث عشرة خلت من جمادى الآخرة ومعه وجوه همدان ومحمد بن الدعام وخيله، وأقام بها أياماً.
  en: Ibn Bustam had fled once he was sure al-Hadi had left Khiwan for Najran, went to al-Da'am and asked him to seek safe-conduct for him; al-Da'am met al-Hadi, pledged himself for him and asked it, and al-Hadi gave it, overlooked the slip, and Ibn Bustam travelled with him and mixed in his force; al-Hadi reached Sa'da on Wednesday, thirteen days gone of Jumada II, with the notables of Hamdan and Muhammad ibn al-Da'am and his horse, and stayed there some days.
  ur: ابن بسطام اس وقت بھاگ گیا تھا جب اسے یقین ہو گیا کہ ہادی خیوان سے نجران کے ارادے سے نکل چکے ہیں؛ وہ دعام کے پاس گیا اور اس سے کہا کہ اس کے لیے امان مانگے، دعام ہادی سے ملا، اپنے آپ کو ذمہ دار ٹھہرایا اور ابن بسطام کے لیے امان مانگی؛ ہادی نے امان دی، اس کی لغزش سے در گزر کیا اور وہ ان کے ساتھ چلا اور ان کے لشکر میں مل گیا؛ ہادی جمادی الآخرہ کے تیرہ دن گزرنے پر بدھ کو ہمدان کے معززین اور محمد بن دعام اور اس کے سواروں کے ساتھ صعدہ پہنچے اور وہاں کچھ دن ٹھہرے۔
  es: "Una vez que estuvo seguro de que al-Hadi había salido de Khiwan hacia Najran, Ibn Bustam huyó, fue a ver a al-Da'am y le pidió que buscara un salvoconducto para él; al-Da'am se reunió con al-Hadi, se comprometió a interceder por él y se lo pidió, y al-Hadi se lo concedió, pasó por alto el error, e Ibn Bustam viajó con él y se unió a sus tropas; al-Hadi llegó a Sa'da el miércoles, trece días después de Jumada II, con los notables Hamdan y Muhammad ibn al-Da'am y su caballo, y permaneció allí algunos días."
  fr: "Ibn Bustam s'enfuit une fois certain qu'al-Hadi avait quitté Khiwan pour Najran, alla trouver al-Da'am et lui demanda de lui accorder un sauf-conduit; al-Da'am rencontra al-Hadi, se porta garant pour lui et le lui demanda, et al-Hadi le lui accorda, ferma les yeux sur l'erreur, et Ibn Bustam voyagea avec lui et se mêla à ses troupes; al-Hadi arriva à Sa'da le mercredi, treize jours après Jumada II, avec les notables de Hamdan et Muhammad ibn al-Da'am et son cheval, et y séjourna quelques jours."
  tr: "İbn Bustam, el-Hadi'nin Hayvan'dan Necran'a doğru yola çıktığını öğrenince kaçtı. El-Da'am'a giderek kendisi için güvenlik sağlamasını rica etti. El-Da'am, el-Hadi ile görüştü ve İbn Bustam için güvenlik sağlamasını istedi. El-Hadi ona güvenlik sağladı ve hatasını affetti; İbn Bustam onunla birlikte ordusuna katıldı. El-Hadi, Cemadi el-Ahiret'in on üçüncü Cemadi günü Çarşamba günü Hamdan ileri gelenleri, Muhammed ibn el-Da'am ve süvarileriyle birlikte Sa'de'ye geldi ve orada birkaç gün kaldı."
  id: "Ibn Bustam melarikan diri ketika mengetahui bahwa al-Hadi telah meninggalkan Khaywan menuju Najran. Ia pergi menemui al-Da’am dan memintanya untuk melindunginya. Al-Da’am menemui al-Hadi dan meminta perlindungan untuk Ibn Bustam. Al-Hadi mengabulkan permintaannya dan memaafkan kesalahannya, lalu Ibn Bustam ikut bersamanya dan bergabung dengan pasukannya. Al-Hadi tiba di Sa’dah pada hari Rabu, tanggal 13 Jumada al-Akhirah, bersama para tokoh terkemuka Hamdan, Muhammad ibn al-Da’am dan pasukannya, dan ia tinggal di sana selama beberapa hari."
