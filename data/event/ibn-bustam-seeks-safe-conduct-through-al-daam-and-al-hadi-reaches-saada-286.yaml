id: event/ibn-bustam-seeks-safe-conduct-through-al-daam-and-al-hadi-reaches-saada-286
class: event
kind: other
label:
  ar: ابن بسطام يطلب الأمان بوساطة الدعام ووصول الهادي إلى صعدة، 13 جمادى الآخرة 286هـ
  en: Ibn Bustam seeks safe-conduct through al-Da'am and al-Hadi reaches Sa'da, 13 Jumada II 286 AH
  ur: ابن بسطام کا دعام کے ذریعے امان مانگنا اور ہادی کا صعدہ پہنچنا، 13 جمادی الآخرہ 286ھ
summary:
  ar: كان ابن بسطام قد هرب حين صح له أن الهادي خرج من خيوان قاصداً نجران، فصار إلى الدعام وطلب منه أن يلتمس له الأمان، فلقي الدعام الهادي وحمل نفسه عليه وطلب الأمان لابن بسطام، فآمنه الهادي وصفح عن زلته وسار معه واختلط بعسكره، ووصل الهادي إلى صعدة يوم الأربعاء لثلاث عشرة خلت من جمادى الآخرة ومعه وجوه همدان ومحمد بن الدعام وخيله، وأقام بها أياماً.
  en: Ibn Bustam had fled once he was sure al-Hadi had left Khiwan for Najran, went to al-Da'am and asked him to seek safe-conduct for him; al-Da'am met al-Hadi, pledged himself for him and asked it, and al-Hadi gave it, overlooked the slip, and Ibn Bustam travelled with him and mixed in his force; al-Hadi reached Sa'da on Wednesday, thirteen days gone of Jumada II, with the notables of Hamdan and Muhammad ibn al-Da'am and his horse, and stayed there some days.
  ur: ابن بسطام اس وقت بھاگ گیا تھا جب اسے یقین ہو گیا کہ ہادی خیوان سے نجران کے ارادے سے نکل چکے ہیں؛ وہ دعام کے پاس گیا اور اس سے کہا کہ اس کے لیے امان مانگے، دعام ہادی سے ملا، اپنے آپ کو ذمہ دار ٹھہرایا اور ابن بسطام کے لیے امان مانگی؛ ہادی نے امان دی، اس کی لغزش سے در گزر کیا اور وہ ان کے ساتھ چلا اور ان کے لشکر میں مل گیا؛ ہادی جمادی الآخرہ کے تیرہ دن گزرنے پر بدھ کو ہمدان کے معززین اور محمد بن دعام اور اس کے سواروں کے ساتھ صعدہ پہنچے اور وہاں کچھ دن ٹھہرے۔
