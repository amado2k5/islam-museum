summary:
  en: "A night raid by Banu al-Dil of Banu Bakr — secretly armed and joined by men of Quraysh — on Khuza'a at their watering place al-Watir in lower Mecca. The breach of the Hudaybiyya truce it caused is the spark the tradition gives for the conquest of Mecca."
  ar: "تبييت بني الديل من بني بكر خزاعةً على مائهم الوتير بأسفل مكة، بإمداد قريش لهم بالسلاح واشتراك بعضهم في القتال خفية؛ وهو خرق عهد الحديبية الذي جعلته الرواية شرارة فتح مكة."
