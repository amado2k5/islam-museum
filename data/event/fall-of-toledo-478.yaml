label: { ar: "أخذ الفرنج طليطلة", en: "The Franks' taking of Toledo", es: "La toma de Toledo por los Franks", fr: "La prise de Tolède par les Franks", ur: "ٹولیڈو کو لے کر فرینکس" }
summary:
  ar: "من أول ما استرد الإفرنج من مدن الأندلس العظيمة مدينة طليطلة من يد القادر بالله ابن ذي النون؛ حاصرها الأذفونش حصاراً شديداً حتى قيل سبع سنين، وكان أخذه لها في سنة ثمان وسبعين وأربعمائة، فعند ابن خلكان يوم الثلاثاء مستهل صفر وعند ابن علقمة يوم الأربعاء لعشر خلون من المحرم، وذكر ابن بسام أن الحنطة كانت تقيم عند أهلها مخزونة خمسين سنة لا تتغير فلما كانت سنة الاستيلاء لم تُرفع الغلة من الأندر حتى أسرع فيها الفساد فعلم الناس أن ذلك بمشيئة الله لأمر أراده، وأنزل العدو من بها على حكمه وخرج ابن ذي النون على أقبح صورة وبيده إصطرلاب يأخذ به وقتاً يرحل فيه، وبسط الكافر العدل على أهل المدينة وحبب التنصر إلى عامة طغامها وشرع في تغيير الجامع كنيسة في ربيع الأول سنة ٤٩٦، وقيل لملك النصارى ينبغي أن تلبس التاج فقال حتى نأخذ قرطبتهم وأعد لذلك ناقوساً رصعه بالجواهر فأكذبه الله وأزعجه، وفي أخذها قال ابن العسال: يا أهل أندلس حثوا مطيكم فما المقام بها إلا من الغلط، وكانت وقعة الزلاقة في السنة بعدها {cite:nafh-tib-maqqari p. 352-354, 447-448}."
  en: "The first of al-Andalus's great cities retaken by the Franks: Toledo, from al-Qadir ibn Dhi-l-Nun in 478 — Tuesday 1 Safar in Ibn Khallikan, Wednesday 10 Muharram in Ibn Alqama — after a siege some stretched to seven years. Ibn Bassam records the fifty-year stored wheat spoiling that very year; Ibn Dhi-l-Nun left astrolabe in hand; the mosque became a church in Rabi I 496; Alfonso refused the crown 'until we take their Cordoba' — a vow unfulfilled; Ibn al-Asal's lament 'hasten your mounts, people of al-Andalus' — and Zallaqa followed the next year {cite:nafh-tib-maqqari p. 352-354, 447-448}."
  es: "La primera de las grandes ciudades de al-Ándalus reconquistada por los francos: Toledo, arrebatada a al-Qadir ibn Dhi-l-Nun en 478 —martes 1 de Safar según Ibn Khallikan, miércoles 10 de Muharram según Ibn Alqama— tras un asedio que algunos prolongaron hasta siete años. Ibn Bassam registra que el trigo almacenado durante cincuenta años se echó a perder ese mismo año; Ibn Dhi-l-Nun dejó el astrolabio en la mano; la mezquita se convirtió en iglesia en Rabi I de 496; Alfonso rechazó la corona «hasta que tomemos su Córdoba» —una promesa incumplida—; el lamento de Ibn al-Asal «¡Apresurad vuestros monteses, gente de al-Ándalus!» — y Zallaqa le siguió al año siguiente {cite:nafh-tib-maqqari p. 352-354, 447-448}."
  fr: "Tolède, première grande ville d'al-Andalus reprise par les Francs, fut prise à al-Qadir ibn Dhi-l-Nun en 478 (mardi 1er Safar selon Ibn Khallikan, mercredi 10 Muharram selon Ibn Alqama), après un siège qui dura parfois jusqu'à sept ans. Ibn Bassam rapporte que des réserves de blé vieilles de cinquante ans se gâtèrent cette même année; Ibn Dhi-l-Nun laissa l'astrolabe en sa possession; la mosquée fut transformée en église en Rabi I 496; Alphonse refusa la couronne « tant que nous n'aurons pas pris leur Cordoue » – un vœu non tenu; Ibn al-Asal déplora: « Hâtez vos montures, habitants d'al-Andalus ! » – et Zallaqa suivit l'année suivante (voir: Nafh-Tib-Maqqari, p. 352-354, 447-448)."
  ur: "اندلس کے عظیم شہروں میں سے پہلا جو فرینکوں نے حاصل کیا: ٹولیڈو، القادر ابن ذی النون سے 478 میں - منگل 1 صفر ابن خلیقان میں، بدھ 10 محرم ابن علقمہ میں - کچھ محاصرے کے بعد سات سال تک پھیلا ہوا تھا۔ ابن بسام نے اسی سال پچاس سالہ ذخیرہ شدہ گندم کے خراب ہونے کو ریکارڈ کیا ہے۔ ابن ذی النون نے اسٹرولاب کو ہاتھ میں چھوڑا۔ ربیع اول 496 میں مسجد چرچ بن گئی۔ الفانسو نے تاج سے انکار کر دیا 'جب تک ہم ان کا قرطبہ نہیں لے لیتے' - ایک عہد پورا نہیں ہوا۔ ابن الاصل کا نوحہ 'اپنے سواروں کو جلدی کرو، اہل اندلس' - اور ذلقا نے اگلے سال اس کی پیروی کی۔ 352-354، 447-448}۔"
