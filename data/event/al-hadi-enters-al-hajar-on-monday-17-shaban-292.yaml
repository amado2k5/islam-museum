id: event/al-hadi-enters-al-hajar-on-monday-17-shaban-292
class: event
kind: other
label:
  ar: "دخول الهادي قرية الهجر يوم الاثنين السابع عشر من شعبان، ص294"
  en: "Al-Hadi enters the village of al-Hajar on Monday, 17 Sha'ban, p. 294"
  ur: "ہادی کا پیر 17 شعبان کو بستی الہجر میں داخل ہونا، ص294"
  es: "Al-Hadi entra en la aldea de al-Hajar el lunes 17 de Sha'ban, pág. 294."
summary:
  ar: "دخل الهادي قرية الهجر من نجران يوم الإثنين سبعة عشر من شعبان فأقام بها وأمّن الناس فاطمأنوا في منازلهم، ولم يكن ابن حميد قد وصل به."
  en: "Al-Hadi entered the village of al-Hajar in Najran on Monday, the seventeenth of Sha'ban, stayed there and gave the people safety so that they settled in their homes; Ibn Humayd had not come to him."
  ur: "ہادی پیر کے دن 17 شعبان کو نجران کی بستی الہجر میں داخل ہوئے، وہیں رہے اور لوگوں کو امان دی تو وہ اپنے گھروں میں مطمئن ہو گئے؛ ابن حمید ان کے پاس نہیں پہنچا تھا۔"
  es: "Al-Hadi entró en la aldea de al-Hajar, en Najran, el lunes diecisiete de Sha'ban, se quedó allí y puso a salvo a la gente para que pudieran instalarse en sus casas; Ibn Humayd no había acudido a él."
