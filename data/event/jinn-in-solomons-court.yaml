id: event/jinn-in-solomons-court
class: event
kind: other
label:
  ar: "الجن في بلاط سليمان"
  en: "The jinn in Solomon's court"
  ur: "سلیمان کے دربار میں جن"
  es: "Los genios en la corte de Salomón"
  fr: "Les djinns à la cour de Salomon"
  tr: "Süleyman'ın Sarayındaki Cinler"
  id: "Jin di Istana Sulaiman"
summary:
  ar: "يخبر القرآن أن الجن عملوا لسليمان ما يشاء من محاريب وتماثيل وجفان كالجواب، وكان منهم من يبني له ويغوص له، وسمع سليمان صوت جنّي يعده بإحضار عرش بلقيس قبل أن يقوم من مقامه {cite:tanzil-quran}. وهو من أوضح نصوص القرآن على مباشرة الجن لشؤون البشر في زمن قديم."
  en: "The Qur'an reports that jinn worked for Solomon whatever he willed of high chambers, images and basins like reservoirs, that among them were builders for him and divers for him, and that Solomon heard a jinn promise to bring the throne of Bilqis before he rose from his place {cite:tanzil-quran}. It is among the Qur'an's clearest texts on jinn attending directly to human affairs in an earlier age."
  ur: "قرآن بتاتا ہے کہ جن سلیمان کے لیے اس کی مرضی کے مطابق محرابیں، بتیں اور حوضوں جیسی کٹوریاں بناتے تھے، ان میں سے کچھ اس کے لیے تعمیر کرتے اور کچھ غوطے لگاتے تھے، اور سلیمان نے ایک جن کی آواز سنی جو ملکہ بلقیس کا تخت اس کے اٹھنے سے پہلے لا دینے کا وعدہ کر رہا تھا {cite:tanzil-quran}۔ یہ قرآن کی قدیم زمانے میں جنوں کے انسانی معاملات میں براہ راست مداخلت کی واضح ترین آیات میں سے ہے۔"
  es: "El Corán relata que los genios trabajaban para Salomón en todo lo que él deseaba: altas cámaras, imágenes y estanques como depósitos. Entre ellos había constructores y buzos, y Salomón oyó a un genio prometerle traer el trono de Bilqis antes de levantarse de su asiento {cita:tanzil-quran}. Este es uno de los textos más claros del Corán sobre la intervención directa de los genios en los asuntos humanos en una época anterior."
  fr: "Le Coran rapporte que les djinns travaillaient pour Salomon, réalisant tout ce qu'il désirait: hautes chambres, statues et bassins semblables à des réservoirs. Parmi eux se trouvaient des bâtisseurs et des plongeurs à son service. Salomon aurait entendu un djinn promettre d'apporter le trône de Bilqis avant même de quitter son siège (cite: tanzil-quran). Ce passage figure parmi les plus clairs du Coran concernant l'intervention directe des djinns dans les affaires humaines à une époque reculée."
  tr: "Kur'an bize cinlerin Süleyman için dilediği her şeyi yaptığını, örneğin tapınaklar, heykeller ve su depoları gibi havuzlar inşa ettiklerini anlatır. Bazıları onun için yapılar inşa etmiş ve onun için dalış yapmışlardır. Süleyman, tahtından kalkmadan önce bir cinin sesini işitmiş ve ona Bilkis tahtını getireceğine dair söz vermiştir. Bu, eski zamanlarda cinlerin insan işlerine doğrudan müdahalesine dair en açık Kur'an metinlerinden biridir."
  id: "Al-Quran menceritakan bahwa jin membuatkan apa pun yang diinginkan Sulaiman, seperti tempat suci, patung, dan kolam seperti waduk. Beberapa dari mereka membangun dan menyelam untuknya. Sulaiman mendengar suara jin yang berjanji akan membawakan singgasana Bilqis sebelum ia bangkit dari tempat duduknya. Ini adalah salah satu teks Al-Quran yang paling jelas tentang keterlibatan langsung jin dalam urusan manusia di zaman kuno."
