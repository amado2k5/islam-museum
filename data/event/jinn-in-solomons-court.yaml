id: event/jinn-in-solomons-court
class: event
kind: other
label:
  ar: "الجن في بلاط سليمان"
  en: "The jinn in Solomon's court"
  ur: "سلیمان کے دربار میں جن"
summary:
  ar: "يخبر القرآن أن الجن عملوا لسليمان ما يشاء من محاريب وتماثيل وجفان كالجواب، وكان منهم من يبني له ويغوص له، وسمع سليمان صوت جنّي يعده بإحضار عرش بلقيس قبل أن يقوم من مقامه {cite:tanzil-quran}. وهو من أوضح نصوص القرآن على مباشرة الجن لشؤون البشر في زمن قديم."
  en: "The Qur'an reports that jinn worked for Solomon whatever he willed of high chambers, images and basins like reservoirs, that among them were builders for him and divers for him, and that Solomon heard a jinn promise to bring the throne of Bilqis before he rose from his place {cite:tanzil-quran}. It is among the Qur'an's clearest texts on jinn attending directly to human affairs in an earlier age."
  ur: "قرآن بتاتا ہے کہ جن سلیمان کے لیے اس کی مرضی کے مطابق محرابیں، بتیں اور حوضوں جیسی کٹوریاں بناتے تھے، ان میں سے کچھ اس کے لیے تعمیر کرتے اور کچھ غوطے لگاتے تھے، اور سلیمان نے ایک جن کی آواز سنی جو ملکہ بلقیس کا تخت اس کے اٹھنے سے پہلے لا دینے کا وعدہ کر رہا تھا {cite:tanzil-quran}۔ یہ قرآن کی قدیم زمانے میں جنوں کے انسانی معاملات میں براہ راست مداخلت کی واضح ترین آیات میں سے ہے۔"
