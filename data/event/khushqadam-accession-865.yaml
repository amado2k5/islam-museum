label: { ar: "خلع إينال وتولية خشقدم", en: "Inal's abdication and Khushqadam's accession", es: "La abdicación de Inal y la ascensión de Khushqadam al trono.", fr: "L'abdication d'Inal et l'accession au pouvoir de Khushqadam", ur: "انال کی دستبرداری اور خوشقدم کا الحاق", tr: "İnal tahttan indirildi ve yerine Khashadam geçti.", id: "Inal digulingkan dan Khashkadam mengambil alih kekuasaan." }
summary:
  ar: "في سنة خمس وستين وثمانمائة خلع السلطان الأشرف إينال نفسه من السلطنة وعقدها لولده الملك المؤيد شهاب الدين أبي الفتح أحمد بن إينال في يوم الأربعاء رابع عشر ليلة خلت من جمادى الأولى، وتوفي إينال بعد ذلك بيوم واحد، ثم خلع أتابكه خشقدم الملك المؤيد بعد خمسة أشهر وخمسة أيام وولي السلطنة الملك الظاهر خشقدم يوم الأحد لإحدى عشرة ليلة بقيت من شهر رمضان {cite:shadharat-dhahab p. 305}."
  en: "In 865 the sultan al-Ashraf Inal abdicated to his son al-Mu'ayyad Ahmad on Wednesday 14 Jumada I and died a day later; the atabeg Khushqadam deposed the son after five months and five days and took the sultanate as al-Zahir Khushqadam on Sunday 11 Ramadan 865 {cite:shadharat-dhahab p. 305}."
  es: "En 865, el sultán al-Ashraf Inal abdicó en favor de su hijo al-Mu'ayyad Ahmad el miércoles 14 de Jumada I y murió un día después; el atabeg Khushqadam depuso al hijo después de cinco meses y cinco días y tomó el sultanato como al-Zahir Khushqadam el domingo 11 de Ramadán de 865 {cite:shadharat-dhahab p. 305}."
  fr: "En 865, le sultan al-Ashraf Inal abdiqua en faveur de son fils al-Mu'ayyad Ahmad le mercredi 14 Jumada I et mourut le lendemain; l'atabeg Khushqadam déposa le fils après cinq mois et cinq jours et prit le sultanat sous le nom d'al-Zahir Khushqadam le dimanche 11 Ramadan 865 {cite:shadharat-dhahab p. 305}."
  ur: "865ء میں سلطان الاشرف عنال نے بدھ 14 جمادی الثانی کو اپنے بیٹے المعیاد احمد کے حوالے کر دیا اور ایک دن بعد وفات پائی۔ عتاب خوشقدم نے پانچ ماہ اور پانچ دن کے بعد بیٹے کو معزول کر دیا اور 11 رمضان 865 بروز اتوار کو سلطنت الظاہر خوشقدم بنا۔ 305}۔"
  tr: "Hicri 865 yılında Sultan Eşref İnal, Cemâdeü'l-Ula ayının on dördüncü gecesi olan Çarşamba günü, tahttan feragat ederek tahtı oğlu Kral Muayyad Şihab el-Din Ebu el-Feth Ahmed İbn İnal'e devretti. İnal bir gün sonra vefat etti. Ardından, beş ay beş gün sonra Atabeg Huşkadem, Kral Muayyad'ı tahttan indirdi ve Kral Zahir Huşkadem, Ramazan ayının on birinci gecesi olan Pazar günü tahtı devraldı. {kaynak: Şadharat-dhahab s. 305}"
  id: "Pada tahun 865 H, Sultan Al-Ashraf Inal melepaskan tahta kesultanan dan menyerahkannya kepada putranya, Raja Al-Mu’ayyad Shihab Al-Din Abu Al-Fath Ahmad Ibn Inal, pada hari Rabu, malam keempat belas bulan Jumada Al-Ula. Inal wafat sehari kemudian. Kemudian, Atabeg Khushqadam melepaskan tahta Raja Al-Mu’ayyad setelah lima bulan lima hari, dan Raja Al-Zahir Khushqadam naik tahta kesultanan pada hari Minggu, malam kesebelas bulan Ramadan. {cite:shadharat-dhahab p. 305}"
