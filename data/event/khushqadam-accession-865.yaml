label: { ar: "خلع إينال وتولية خشقدم", en: "Inal's abdication and Khushqadam's accession" }
summary:
  ar: "في سنة خمس وستين وثمانمائة خلع السلطان الأشرف إينال نفسه من السلطنة وعقدها لولده الملك المؤيد شهاب الدين أبي الفتح أحمد بن إينال في يوم الأربعاء رابع عشر ليلة خلت من جمادى الأولى، وتوفي إينال بعد ذلك بيوم واحد، ثم خلع أتابكه خشقدم الملك المؤيد بعد خمسة أشهر وخمسة أيام وولي السلطنة الملك الظاهر خشقدم يوم الأحد لإحدى عشرة ليلة بقيت من شهر رمضان {cite:shadharat-dhahab p. 305}."
  en: "In 865 the sultan al-Ashraf Inal abdicated to his son al-Mu'ayyad Ahmad on Wednesday 14 Jumada I and died a day later; the atabeg Khushqadam deposed the son after five months and five days and took the sultanate as al-Zahir Khushqadam on Sunday 11 Ramadan 865 {cite:shadharat-dhahab p. 305}."
