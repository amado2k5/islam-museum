label: { ar: "برنامج كامبردج للتعلل بالكتب", en: "The Cambridge Scriptural Reasoning exchanges", fr: "Les échanges de Scriptural Reasoning de Cambridge", es: "Los intercambios de razonamiento bíblico de Cambridge", ur: "کیمبرج کتابی استدلال کا تبادلہ", tr: "Cambridge Kitap Meraklılığı Programı", id: "Program Kegemaran Membaca Cambridge" }
summary:
  ar: "التبادل المكتوب الحديث بين علماء السنة واليهود في إطار برنامج كامبردج لحوار الأديان ومنهج «التعلل بالكتب» الذي شارك فيه علماء كالشيخ [[person/abdal-hakim-murad|عبد الحكيم مراد]] ⁦(تيموثي ونتر)⁩ واليهودي بيتر أوخس: فحص مشترك للتوراة والقرآن جنباً إلى جنب في موضوعات الشريعة والعهد والنبوة بصيغة مكتوبة منشورة لا منصة منازعة — آخر صور المناظرة الحرفية تحولاً {cite:tandfonline-berdugo-meknes}."
  en: "The modern written exchange between Sunni and Jewish scholars within the Cambridge Inter-Faith Programme and the 'Scriptural Reasoning' method, joined by scholars such as Shaykh [[person/abdal-hakim-murad|Abdal Hakim Murad]] (Timothy Winter) and the Jewish scholar Peter Ochs: a side-by-side examination of Torah and Qur'an on law, covenant and prophecy in published written form rather than a polemical platform — the latest transformation of the literal munazara {cite:tandfonline-berdugo-meknes}."
  fr: "L'échange écrit moderne entre savants sunnites et juifs dans le cadre du Cambridge Inter-Faith Programme et de la méthode du « Scriptural Reasoning », auquel ont pris part des savants comme le cheikh [[person/abdal-hakim-murad|Abdal Hakim Murad]] (Timothy Winter) et le savant juif Peter Ochs : un examen côte à côte de la Torah et du Coran sur la loi, l'alliance et la prophétie, sous une forme écrite publiée plutôt que comme tribune polémique ; la plus récente transformation de la munazara littérale {cite:tandfonline-berdugo-meknes}."
  es: "El intercambio escrito moderno entre eruditos sunitas y judíos dentro del Programa Interreligioso de Cambridge y el método de \"Razonamiento Bíblico\", al que se unieron eruditos como Shaykh [[person/abdal-hakim-murad|Abdal Hakim Murad]] (Timothy Winter) y el erudito judío Peter Ochs: un examen paralelo de la Torá y el Corán sobre la ley, el pacto y la profecía en forma escrita publicada en lugar de una plataforma polémica: la última transformación de la munazara literal {cite:tandfonline-berdugo-meknes}."
  ur: "کیمبرج بین المذاہب پروگرام کے اندر سنی اور یہودی اسکالرز کے درمیان جدید تحریری تبادلہ اور 'صحیفہ استدلال' طریقہ جس میں اسکالرز جیسے شیخ [[شخص/عبدالحکیم مراد|عبدالحکیم مراد]] ⁦(ٹموتھی ونٹر)⁩ اور یہودی اسکالر پیٹر اوچسائیڈ کے ساتھ شامل ہیں: قرآنی قانون کے ایک پہلو پر۔ پیشن گوئی کسی سیاسی پلیٹ فارم کے بجائے شائع شدہ تحریری شکل میں - لغوی مناظرہ کی تازہ ترین تبدیلی"
  tr: "Cambridge Dinlerarası Diyalog Programı çerçevesinde ve Şeyh Abdul Hakim Murad (Timothy Winter) ve Yahudi alim Peter Ochs gibi isimlerin katıldığı “Kitaplar bir gerekçe olarak” yaklaşımı kapsamında Sünni ve Yahudi alimler arasında yakın zamanda gerçekleşen yazılı görüş alışverişi: Tevrat ve Kur'an'ın Şeriat, ahit ve peygamberlik konularında yan yana incelenmesi; tartışma platformu değil, yayınlanmış yazılı bir formatta gerçekleştirilen, edebi tartışmanın en yeni biçimi."
  id: "Pertukaran tulisan baru-baru ini antara para sarjana Sunni dan Yahudi dalam kerangka Program Dialog Antar Agama Cambridge dan pendekatan “Kitab sebagai pembenaran”, di mana para sarjana seperti Syekh [[person/abdal-hakim-murad|Abdul Hakim Murad]] (Timothy Winter) dan sarjana Yahudi Peter Ochs berpartisipasi: sebuah kajian bersama tentang Taurat dan Al-Qur'an berdampingan mengenai topik Syariah, perjanjian, dan kenabian dalam format tulisan yang dipublikasikan, bukan platform untuk perselisihan — bentuk terbaru dari debat literal yang telah diubah {cite:tandfonline-berdugo-meknes}."
