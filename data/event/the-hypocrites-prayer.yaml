id: event/the-hypocrites-prayer
class: event
kind: other
label:
  ar: "صلاة المنافق: الجلوس حتى اصفرار الشمس"
  en: "The hypocrites' prayer: sitting till the sun pales"
  ur: "منافقوں کی نماز: سورج کے پیلے ہونے تک بیٹھنا"
summary:
  ar: "قال أنس بن مالك سمعت النبي يقول ثلاثا تلك صلاة المنافقين يجلس أحدهم حتى إذا اصفرت الشمس وكانت بين قرني الشيطان أو على قرن الشيطان قام فنقر أربع لا يذكر الله فيها إلا قليلا {cite:muwatta-maruf-1997} [[passage/muwatta-1-586|الموطأ 586]]."
  en: "Anas ibn Malik said: I heard the Prophet say three times: that is the prayer of the hypocrites — one of them sits until the sun pales and is between the shaytan's horns or upon his horn, then rises and performs four rak'as barely remembering God {cite:muwatta-maruf-1997} [[passage/muwatta-1-586|Muwatta 586]]."
  ur: "انس بن مالک نے کہا: میں نے نبی کو تین بار کہتے سنا: وہی منافقوں کی نماز ہے — ان میں سے ایک اس وقت تک بیٹھتا ہے جب تک سورج پیلا ہو جائے اور شیطان کی سینگوں کے درمیان یا سینگ پر ہو جائے، پھر اٹھتا ہے اور چار رکعتیں پڑھتا ہے جس میں اللہ کا ذکر بہت کم ہے {cite:muwatta-maruf-1997} [[passage/muwatta-1-586|موطأ 586]]۔"
