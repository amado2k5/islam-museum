  ar: "رحلات ابن الطقطقي في العراق وأذربيجان ونقابته على العلويين"
  en: "Ibn al-Tiqtaqa's travels in Iraq and Adharbaydjan and his naqibate over the Alids"
  ur: "عراق اور آذربائیجان میں ابن طقطقی کے سفر اور علویوں پر نقابت"
summary:
  ar: "يظهر أن ابن الطقطقي سافر كثيراً في العراق وأذربيجان، وكان مثل أبيه نقيباً على العلويين، غير أن سلطانه كانت أضيق إقليماً على الأرجح {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "Ibn al-Tiqtaqa appears to have travelled widely in Iraq and Adharbaydjan, and like his father he was a naqib of the Alids, though probably with more regionally limited authority {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "ابن طقطقی غالباً عراق اور آذربائیجان میں کثیر سفر کرتے رہے، اور اپنے والد کی طرح علویوں کے نقیب بھی تھے، لیکن غالباً ان کا دائرہ اختیار زیادہ محدود علاقے تک تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
