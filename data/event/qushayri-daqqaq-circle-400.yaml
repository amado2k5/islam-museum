label:
  ar: "القشيري يلزم مجلس أبي علي الدقاق بنيسابور، نحو ٤٠٠هـ"
  en: "Al-Qushayri joins Abu Ali al-Daqqaq's circle at Nishapur, c. 400/1009"
  ur: "قشیری نیشاپور میں ابو علی دقاق کے مجلس سے جُڑے، تقریباً 400ھ/1009ء"
summary:
  ar: "توفي أبو القشيري وهو طفل فوقع إلى أبي القاسم اليماني الأديب فقرأ عليه الأدب والعربية، وكانت له ضيعة مثقلة الخراج بناحية أستوا فدخل نيسابور ليتعلم طرفاً من الاستيفاء يصون به قريته، فاتفق حضوره مجلس أبي علي الدقاق وكان واعظ وقته، فاستحلى كلامه ونسخ ما عزم عليه: «طلب القباء فوجد العباء»، فقبله الدقاق وأشار عليه بتعلم العلم {cite:tarikh-islam-dhahabi p. 171} {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}."
  en: "Al-Qushayri's father died while he was a child, so he read letters and Arabic under Abu al-Qasim al-Yamani; he held a village near Ustuwa burdened with land-tax and came to Nishapur to learn enough revenue-work to protect it, when he chanced upon the assembly of Abu Ali al-Daqqaq, the preacher of his day — he relished his words and abandoned his plan, 'seeking the gown he found the Sufi cloak', and al-Daqqaq accepted him and pointed him to learning {cite:tarikh-islam-dhahabi p. 171} {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}."
  ur: "قشیری کے والد ان کے بچپن میں فوت ہوئے تو انھوں نے ابو القاسم یمانی اديب سے ادب اور عربی پڑھی؛ استوا کے قریب ان کا ایک دیہہ خراج سے بوجھل تھا، وہ اسے بچانے کے لیے محصولی علم سیکھنے نیشاپور آئے کہ اتفاق سے اپنے وقت کے واعظ ابو علی دقاق کا مجلس نصیب ہوا؛ ان کی بات پسند آئی اور ارادہ بدل گیا — «قباء چاہتے تھے، عباء ملا» — دقاق نے قبول کیا اور علم کی طرف اشارہ کیا {cite:tarikh-islam-dhahabi p. 171} {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}۔"
