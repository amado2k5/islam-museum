label: { ar: "حمل طعام خراج مصر إلى المدينة", en: "The Sea Transport of Egypt's Kharaj Grain to Medina", es: "El transporte marítimo del grano de Kharaj de Egipto a Medina", fr: "Le transport maritime des céréales de Kharaj (Égypte) vers Médine" }
summary:
  ar: "عند البلاذري: كتب عمر بن الخطاب سنة إحدى وعشرين إلى عمرو بن العاص يعلّمه ما بأهل المدينة من الجهد ويأمره أن يحمل ما يقبض من الطعام في الخراج إلى المدينة في البحر فكان ذلك يُحمل ويُحمل معه الزيت فإذا ورد الجار تولّى قبضه سعد الجار ثم جُعل في دار بالمدينة وقُسّم بين الناس بمكيال فانقطع ذلك في الفتنة الأولى ثم حُمل في أيام معاوية ويزيد ثم انقطع إلى زمن عبد الملك بن مروان ثم لم يزل يُحمل إلى خلافة أبي جعفر وقبيلها. وفي خلافة عمر صولح أهل الجزية بمصر بعد الصلح الأول مكان الحنطة والزيت والعسل والخل على دينارين دينارين فألزم كل رجل أربعة دنانير فرضوا بذلك وأحبّوه."
  en: "In al-Baladhuri: in year 21 Umar ibn al-Khattab wrote to Amr ibn al-As informing him of Medina's hardship and ordering him to ship the kharaj grain he gathered to Medina by sea — so it was borne, and oil with it, till reaching al-Jar, where Sa'd al-Jar took charge, and it was lodged in a house at Medina and dealt out to the people by measure; the transport ceased at the first fitna, resumed in Mu'awiya's and Yazid's days, ceased again till Abd al-Malik's, then ran uninterrupted till Abu Ja'far's caliphate and just before it. And in Umar's caliphate Egypt's jizya-payers were recompounded — two dinars plus two in place of the wheat, oil, honey and vinegar — every man bound to four dinars, which they accepted and loved."
  es: "En al-Baladhuri: en el año 21, Umar ibn al-Khattab escribió a Amr ibn al-As informándole de las dificultades de Medina y ordenándole que enviara por mar el grano kharaj que había recogido a Medina; así fue transportado, junto con el aceite, hasta llegar a al-Jar, donde Sa'd al-Jar se hizo cargo, y fue alojado en una casa en Medina y distribuido a la gente por medidas; el transporte cesó con la primera fitna, se reanudó en los días de Mu'awiya y Yazid, cesó de nuevo hasta el califato de Abd al-Malik, y luego continuó sin interrupción hasta el califato de Abu Ja'far y justo antes. Y en el califato de Umar, los contribuyentes egipcios que pagaban la jizya fueron reestructurados: dos dinares más dos en lugar del trigo, el aceite, la miel y el vinagre; cada hombre estaba obligado a pagar cuatro dinares, lo cual aceptaron y apreciaron."
  fr: "Dans al-Baladhuri: en l’an 21, Umar ibn al-Khattab écrivit à Amr ibn al-As pour l’informer des difficultés que connaissait Médine et lui ordonna d’y acheminer par voie maritime le grain de kharaj qu’il avait collecté. Le grain, accompagné d’huile, fut transporté jusqu’à al-Jar, où Sa’d al-Jar en prit la charge. Il fut entreposé dans une maison de Médine et distribué à la population au dosage. Le transport cessa lors de la première fitna, reprit sous Mu’awiya et Yazid, s’interrompit de nouveau jusqu’au califat d’Abd al-Malik, puis se poursuivit sans interruption jusqu’au califat d’Abu Ja’far et même juste avant. Sous le califat d’Umar, la jizya égyptienne fut recalculée: deux dinars plus deux autres en remplacement du blé, de l’huile, du miel et du vinaigre. Chaque homme était tenu de verser quatre dinars, ce qu’il accepta avec enthousiasme."
