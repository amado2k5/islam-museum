summary:
  ar: "في ربيع الأول سنة إحدى وسبعين وثلثمائة كان حريق عظيم في الكرخ من درب القراطيس إلى البزازين وثّب في ألف وتسعمائة دار، ودام أسبوعاً {cite:muntazam-ibn-al-jawzi j.7 p.113}."
  en: "In Rabi' I 371 a great fire swept the Karkh from Darb al-Qaratis to the Bazazin, leaping through 1,900 houses and lasting a week {cite:muntazam-ibn-al-jawzi j.7 p.113}."
  es: "En Rabi' I 371 un gran incendio arrasó Karkh desde Darb al-Qaratis hasta Bazazin, pasando por 1.900 casas y durando una semana {cite:muntazam-ibn-al-jawzi j.7 p.113}."
  fr: "En Rabi' I 371, un grand incendie a ravagé le Karkh de Darb al-Qaratis au Bazazin, traversant 1 900 maisons et durant une semaine {cite:muntazam-ibn-al-jawzi j.7 p.113}."
  ur: "ربیع الثانی 371 میں کرخ کو دارب القراطیس سے بزازین تک ایک عظیم آگ نے لپیٹ میں لے لیا، جس نے 1,900 مکانات کو لپیٹ میں لے لیا اور ایک ہفتہ تک جاری رہا۔"
  tr: "371 yılının baharında, Darb el-Kartis'ten el-Bazzazin'e kadar uzanan el-Karkh'ta büyük bir yangın çıktı; bin dokuz yüz eve yayıldı ve bir hafta sürdü. {cite:muntazam-ibn-al-jawzi j.7 p.113}"
  id: "Pada musim semi tahun tiga ratus tujuh puluh satu, terjadi kebakaran besar di Al-Karkh, dari Darb Al-Qaratis hingga Al-Bazzazin, yang menyebar ke seribu sembilan ratus rumah, dan berlangsung selama seminggu. {cite:muntazam-ibn-al-jawzi j.7 p.113}."
