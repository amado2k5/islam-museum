label: { ar: "تحريق بيت سويلم", en: "Burning of Suwaylim's house" }
summary:
  ar: "ينقل ابن هشام عن «الثقة» أن النبي بلغه أن ناساً من «المنافقين» يجتمعون في بيت سويلم اليهودي عند جاسوم يثبطون الناس عنه في غزوة تبوك، فبعث إليهم طلحة بن عبيد الله في نفر وأمره أن يحرق عليهم البيت؛ ففعل، واقتحم الضحاك بن خليفة من ظهر البيت فانكسرت رجله وأفلت أصحابه."
  en: Ibn Hisham reports from 'a trusted source' that the Prophet was told that some of the 'hypocrites' were gathering in the house of Suwaylim the Jew at Jasum, discouraging people from him on the Tabuk campaign, so he sent Talha ibn Ubaydullah with a party and ordered him to burn the house down on them; he did so, and al-Dahhak ibn Khalifa rushed out of the back of the house and broke his leg while his companions escaped.
