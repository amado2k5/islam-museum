id: event/burning-of-suwaylims-house
class: event
kind: other
label: { ar: "تحريق بيت سويلم", en: "Burning of Suwaylim's house", fr: "L'incendie de la maison de Suwaylim", es: "Incendio de la casa de Suwaylim", ur: "سویلم کے گھر کو جلانا", tr: "Sweilem'in evini yakmak", id: "Membakar rumah Sweilem" }
summary:
  ar: "ينقل ابن هشام عن «الثقة» أن النبي بلغه أن ناساً من «المنافقين» يجتمعون في بيت سويلم اليهودي عند جاسوم يثبطون الناس عنه في غزوة تبوك، فبعث إليهم طلحة بن عبيد الله في نفر وأمره أن يحرق عليهم البيت؛ ففعل، واقتحم الضحاك بن خليفة من ظهر البيت فانكسرت رجله وأفلت أصحابه."
  en: Ibn Hisham reports from 'a trusted source' that the Prophet was told that some of the 'hypocrites' were gathering in the house of Suwaylim the Jew at Jasum, discouraging people from him on the Tabuk campaign, so he sent Talha ibn Ubaydullah with a party and ordered him to burn the house down on them; he did so, and al-Dahhak ibn Khalifa rushed out of the back of the house and broke his leg while his companions escaped.
  fr: "Ibn Hisham rapporte, d'après « une source digne de confiance », qu'on informa le Prophète que certains des « hypocrites » se réunissaient dans la maison de Suwaylim le Juif à Jasum, détournant les gens de lui lors de l'expédition de Tabuk ; il envoya donc Talha ibn Ubaydullah avec un groupe et lui ordonna d'incendier la maison sur eux ; il le fit, et al-Dahhak ibn Khalifa s'élança par l'arrière de la maison et se cassa la jambe, tandis que ses compagnons s'échappaient."
  es: "Ibn Hisham relata, citando una fuente fidedigna, que al Profeta le informaron de que algunos hipócritas se estaban reuniendo en la casa de Suwaylim el judío en Jasum, disuadiendo a la gente de unirse a él en la campaña de Tabuk, por lo que envió a Talha ibn Ubaydullah con un grupo y le ordenó que incendiara la casa; así lo hizo, y al-Dahhak ibn Khalifa salió corriendo por la parte trasera de la casa y se rompió la pierna, mientras que sus compañeros escaparon."
  ur: "ابن ہشام نے ایک معتبر ذریعہ سے روایت کیا ہے کہ رسول اللہ کو بتایا گیا کہ بعض منافقین جاسم میں یہودی سویلم کے گھر جمع ہو رہے ہیں اور تبوک مہم پر لوگوں کو ان سے روک رہے ہیں، تو آپ نے طلحہ بن عبید اللہ کو ایک جماعت کے ساتھ بھیجا اور حکم دیا کہ ان کے گھر کو جلا دو۔ اس نے ایسا ہی کیا اور الضحاک بن خلیفہ گھر کے پچھلے حصے سے بھاگا اور اس کی ٹانگ توڑ دی جبکہ اس کے ساتھی بچ گئے۔"
  tr: "İbn Hişam, güvenilir bir kaynağa dayanarak, Peygamber'e, Yasum'un evindeki Yahudi Suveylim'in evinde bazı \"münafıkların\" toplandığı ve insanları Tebük Savaşı'na katılmaktan caydırdıkları bildirildiğini aktarır. Bunun üzerine Peygamber, Talha bin Ubeydullah'ı bir grup adamla göndererek evi yakmalarını emretti. Talha da öyle yaptı ve Dahhak bin Halife evin arkasından içeri daldı, bacağı kırıldı ve arkadaşları kaçmayı başardı."
  id: "Ibn Hisham mengutip sebuah sumber yang \"terpercaya\" yang mengatakan bahwa Nabi diberitahu bahwa beberapa \"orang munafik\" berkumpul di rumah Suwaylim si Yahudi di rumah Yasum, untuk menghalangi orang-orang bergabung dengannya dalam Perang Tabuk. Maka beliau mengutus Talha bin Ubayd Allah dengan sekelompok orang dan memerintahkannya untuk membakar rumah itu. Maka Talha bin Ubayd Allah melakukannya, dan al-Dahhak bin Khalifa menyerbu masuk dari belakang rumah, sehingga kakinya patah dan para sahabatnya berhasil melarikan diri."
