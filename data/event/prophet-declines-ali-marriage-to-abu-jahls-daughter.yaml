id: event/prophet-declines-ali-marriage-to-abu-jahls-daughter
class: event
kind: other
label: { ar: "نهي النبي عن جمع علي بين فاطمة وبنت أبي جهل", en: "The Prophet forbids Ali to take Abu Jahl's daughter alongside Fatima" }
summary:
  ar: "أراد علي أن يتزوج بنت أبي جهل على فاطمة، فخطب النبي الناس على منبره وقال: «فاطمة بضعة مني»، وذكر أن بني هاشم استأذنوه في تزويج علي ابنتهم فلم يأذن لهم. ويرى الصلابي أن النهي عن الجمع لعلتين منصوصتين: أذى فاطمة وما يتولد منه من أذى للنبي، وخوف الفتنة عليها بسبب الغيرة، ويثبت أنه لم يحرّم حلالاً (ص 84-85)."
  en: "Ali wished to take Abu Jahl's daughter besides Fatima; the Prophet addressed the people from the pulpit and said that Fatima is a part of him, and refused the request of Banu Hashim. Al-Sallabi reads the prohibition as resting on two stated reasons, the harm to Fatima and the fear of jealousy, and not as a ban on a lawful thing (pp. 84-85)."
