label: { ar: "صلح بساروفتز ⁦(باساروفيتش)⁩", en: "Treaty of Passarowitz", es: "Tratado de Passarowitz", fr: "Traité de Passarowitz", ur: "پاسرووٹز کا معاہدہ", tr: "Psarovitz Barışı (Passarowicz)", id: "Perdamaian Psarovitz (Passarowicz)" }
summary:
  ar: "بعد أن انتصرت النمسا وسقطت بلغراد عام ١١٢٩هـ/١٧١٧م جرى الصلح عام ١١٣٠هـ/١٧١٨م بتوسط بريطانيا وهولندا، فعُقد صلح بساروفتز وانتزع النمساويون بموجبه بلغراد وأكثر بلاد الصرب وجزءاً من الأفلاق، وبقيت سواحل دالماسيا للبندقية وعادت بلاد المورة للعثمانيين، وأتاح الصلح لرجال الدين الكاثوليك استعادة مزاياهم القديمة في الأراضي العثمانية مما أتاح التدخل باسم الحماية، ونص اتفاق منفصل على حرية التجارة لصالح تجار الدول الموقعة فحصلت النمسا على حق حماية التجار الأجانب داخل الدولة العثمانية {cite:dawlat-uthmaniyya-salabi p. 311}."
  en: "Passarowitz, 1718 — brokered by Britain and Holland: Austria took Belgrade, most of Serbia and part of Wallachia; Venice kept Dalmatia; the Morea returned to Ottoman hands; and the Catholic clergy regained privileges that became a licence for foreign interference {cite:dawlat-uthmaniyya-salabi p. 311}."
  es: "Passarowitz, 1718 — mediado por Gran Bretaña y Holanda: Austria tomó Belgrado, la mayor parte de Serbia y parte de Valaquia; Venecia conservó Dalmacia; Morea volvió a manos otomanas; y el clero católico recuperó privilegios que se convirtieron en una licencia para la injerencia extranjera {cite:dawlat-uthmaniyya-salabi p. 311}."
  fr: "Passarowitz, 1718 — négocié par la Grande-Bretagne et la Hollande: l'Autriche prit Belgrade, la majeure partie de la Serbie et une partie de la Valachie; Venise garda la Dalmatie; la Morée retourna aux mains des Ottomans; et le clergé catholique recouvra des privilèges qui devinrent une licence pour l'ingérence étrangère {cite:dawlat-uthmaniyya-salabi p. 311}."
  ur: "پاسرووٹز، 1718 - برطانیہ اور ہالینڈ کی ثالثی: آسٹریا نے بلغراد، سربیا کا بیشتر حصہ اور والاچیا کا حصہ لے لیا۔ وینس نے ڈالمتیا رکھا۔ موریا واپس عثمانی ہاتھوں میں چلا گیا۔ اور کیتھولک پادریوں نے دوبارہ مراعات حاصل کیں جو غیر ملکی مداخلت کا لائسنس بن گئی 311}۔"
  tr: "Avusturya'nın zaferi ve Belgrad'ın 1129 Hicri/1717 Miladi yılında düşmesinden sonra, 1130 Hicri/1718 Miladi yılında Britanya ve Hollanda'nın arabuluculuğuyla barış sağlandı. Barış antlaşması Sarovitz'de imzalandı ve Avusturyalılar Belgrad'ı, Sırbistan'ın büyük bir bölümünü ve Eflak'ın bir kısmını ele geçirdi. Dalmaçya kıyıları Venedik'te kaldı ve Mora Osmanlılara geri döndü. Barış, Katolik din adamlarının Osmanlı topraklarında eski ayrıcalıklarını yeniden kazanmalarına olanak sağladı ve bu da koruma adına müdahaleye izin verdi. Ayrı bir anlaşma, imzacı ülkelerin tüccarlarının yararına ticaret özgürlüğünü öngördü, böylece Avusturya, Osmanlı devleti içindeki yabancı tüccarları koruma hakkını elde etti."
  id: "Setelah Austria meraih kemenangan dan Beograd jatuh pada tahun 1129 H/1717 M, perdamaian terjalin pada tahun 1130 H/1718 M melalui mediasi Inggris dan Belanda. Perjanjian damai tersebut disepakati di Sarovitz, dan Austria merebut Beograd, sebagian besar Serbia, dan sebagian Wallachia. Pantai Dalmatia tetap berada di bawah kekuasaan Venesia, dan Morea kembali ke Ottoman. Perdamaian tersebut memungkinkan para pendeta Katolik untuk mendapatkan kembali hak istimewa mereka di wilayah Ottoman, yang memungkinkan intervensi atas nama perlindungan. Perjanjian terpisah menetapkan kebebasan perdagangan untuk kepentingan para pedagang dari negara-negara penandatangan, sehingga Austria memperoleh hak untuk melindungi pedagang asing di dalam negara Ottoman {cite:dawlat-uthmaniyya-salabi p. 311}."
