label: { ar: "صلح بساروفتز (باساروفيتش)" }
summary:
  ar: "بعد أن انتصرت النمسا وسقطت بلغراد عام ١١٢٩هـ/١٧١٧م جرى الصلح عام ١١٣٠هـ/١٧١٨م بتوسط بريطانيا وهولندا، فعُقد صلح بساروفتز وانتزع النمساويون بموجبه بلغراد وأكثر بلاد الصرب وجزءاً من الأفلاق، وبقيت سواحل دالماسيا للبندقية وعادت بلاد المورة للعثمانيين، وأتاح الصلح لرجال الدين الكاثوليك استعادة مزاياهم القديمة في الأراضي العثمانية مما أتاح التدخل باسم الحماية، ونص اتفاق منفصل على حرية التجارة لصالح تجار الدول الموقعة فحصلت النمسا على حق حماية التجار الأجانب داخل الدولة العثمانية {cite:dawlat-uthmaniyya-salabi p. 311}."
  en: "Passarowitz, 1718 — brokered by Britain and Holland: Austria took Belgrade, most of Serbia and part of Wallachia; Venice kept Dalmatia; the Morea returned to Ottoman hands; and the Catholic clergy regained privileges that became a licence for foreign interference {cite:dawlat-uthmaniyya-salabi p. 311}."
