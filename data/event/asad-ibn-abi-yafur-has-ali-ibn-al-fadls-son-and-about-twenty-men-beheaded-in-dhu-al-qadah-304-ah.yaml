id: "event/asad-ibn-abi-yafur-has-ali-ibn-al-fadls-son-and-about-twenty-men-beheaded-in-dhu-al-qadah-304-ah"
class: event
kind: other
label:
  ar: "يأمر أسعد بقتل ابن علي بن الفضل وأخيه ونحو عشرين رجلا من الأسرى في ذي القعدة سنة 304هـ، ص404"
  en: "Asad ibn Abi Ya'fur has the son of Ali ibn al-Fadl, his brother and about twenty captives beheaded in Dhu al-Qadah 304 AH, p. 404"
  ur: "اسعد بن ابی یعفر ذوالقعدہ 304ھ میں علی بن الفضل کے بیٹے، اس کے بھائی اور تقریباً بیس قیدیوں کی گردنیں اتروا دیتا ہے، ص404"
  fr: "Asad ibn Abi Ya'fur fait décapiter le fils d'Ali ibn al-Fadl, son frère et une vingtaine de captifs en Dhu al-Qadah 304 H, p. 404"
  es: "Asad ibn Abi Ya'fur tiene al hijo de Ali ibn al-Fadl, a su hermano y a unos veinte cautivos decapitados en Dhu al-Qadah 304 AH, pág. 404."
  tr: "Esad, Hicri 304 yılının Zilhicce ayında kardeşi İbn Ali ibn el-Fadl'ı ve yaklaşık yirmi diğer esiri öldürtmüştür (s. 404)."
  id: "As'ad memerintahkan pembunuhan Ibn Ali ibn al-Fadl, saudaranya, dan sekitar dua puluh tahanan lainnya pada Dzul Qi'dah 304 H, hlm. 404."
summary:
  ar: "يأمر أسعد بقتل ابن علي بن فضل وأخيه ونحو عشرين رجلا من الأسرى في ذي القعدة سنة 304هـ."
  en: "Asad orders the son of Ali ibn al-Fadl, his brother and about twenty captives beheaded in Dhu al-Qadah 304 AH."
  ur: "اسعد ذوالقعدہ 304ھ میں علی بن الفضل کے بیٹے، اس کے بھائی اور تقریباً بیس قیدیوں کو قتل کرنے کا حکم دیتا ہے۔"
  fr: "Asad ordonne la décapitation du fils d'Ali ibn al-Fadl, de son frère et d'une vingtaine de captifs en Dhu al-Qadah 304 H."
  es: "En Dhu al-Qadah, en el año 304 de la Hégira, Asad ordenó la decapitación del hijo de Ali ibn al-Fadl, su hermano y unos veinte cautivos."
  tr: "Esad, Hicri 304 yılında Zilhicce'de esirler arasından kardeşi İbn Ali İbn Fadl'ı ve yaklaşık yirmi kişiyi öldürttü."
  id: "As’ad memerintahkan pembunuhan Ibn Ali Ibn Fadl, saudaranya, dan sekitar dua puluh orang dari antara para tawanan di Dhu al-Qi’dah pada tahun 304 H."
