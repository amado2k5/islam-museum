id: event/battle-of-khazir
aliases: [event/battle-of-nahr-al-khazir]   # same battle; entered from the Khudari pass, merged here
class: event
kind: battle
label: { ar: "وقعة الخازر", en: "Battle of al-Khazir" }
summary:
  ar: "في سنة ست وستين سار عبيد الله بن زياد بعساكر الشام نحو العراق، فلما انتهى إلى الموصل التقى بإبراهيم بن الأشتر النخعي، وكان على خيل العراق من قبل المختار، بالخازر، فكانت وقعة عظيمة قُتل فيها عبيد الله بن زياد والحصين بن نمير وشرحبيل بن ذي الكلاع وأشراف من أهل الشام {cite:bakr-umayyad-state-1134715 p. 209}. وذكر الكتاب أن المختار بن أبي عبيد بعث جنداً على رأسهم إبراهيم بن الأشتر لقتال عبيد الله بن زياد، وأن الغلبة كانت لابن الأشتر، وأصاب جند الشام قتلاً وغرقاً {cite:khudari-umayyad-state p.300}، وأن انهزام جند الشام كان في الوقت الذي نبض فيه عرق العصبية بين قيس واليمن {cite:khudari-umayyad-state p.365}."
  en: "In 66 AH Ubayd Allah ibn Ziyad set out with the armies of Syria toward Iraq. When he reached Mosul he met Ibrahim ibn al-Ashtar al-Nakha'i, who commanded the cavalry of Iraq on behalf of al-Mukhtar, at al-Khazir. It was a great battle in which Ubayd Allah ibn Ziyad, al-Husayn ibn Numayr, Shurahbil ibn Dhi al-Kala' and leading men of Syria were killed {cite:bakr-umayyad-state-1134715 p. 209}. The book states that al-Mukhtar ibn Abi Ubayd sent a force led by Ibrahim ibn al-Ashtar to fight Ubayd Allah ibn Ziyad, that the victory went to Ibn al-Ashtar, and that the Syrian troops suffered killing and drowning {cite:khudari-umayyad-state p.300}. It also says that the rout of the Syrian troops came at the moment when the vein of tribal zeal between Qays and Yemen throbbed {cite:khudari-umayyad-state p.365}."
