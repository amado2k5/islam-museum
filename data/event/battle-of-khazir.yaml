label: { ar: "وقعة الخازر", en: "Battle of al-Khazir", fr: "La bataille d'al-Khazir", es: "Batalla de al-Khazir" }
summary:
  ar: "في سنة ست وستين سار عبيد الله بن زياد بعساكر الشام نحو العراق، فلما انتهى إلى الموصل التقى بإبراهيم بن الأشتر النخعي، وكان على خيل العراق من قبل المختار، بالخازر، فكانت وقعة عظيمة قُتل فيها عبيد الله بن زياد والحصين بن نمير وشرحبيل بن ذي الكلاع وأشراف من أهل الشام {cite:bakr-umayyad-state-1134715 p. 209}. وذكر الكتاب أن المختار بن أبي عبيد بعث جنداً على رأسهم إبراهيم بن الأشتر لقتال عبيد الله بن زياد، وأن الغلبة كانت لابن الأشتر، وأصاب جند الشام قتلاً وغرقاً {cite:khudari-umayyad-state p.300}، وأن انهزام جند الشام كان في الوقت الذي نبض فيه عرق العصبية بين قيس واليمن {cite:khudari-umayyad-state p.365}."
  en: "In 66 AH Ubayd Allah ibn Ziyad set out with the armies of Syria toward Iraq. When he reached Mosul he met Ibrahim ibn al-Ashtar al-Nakha'i, who commanded the cavalry of Iraq on behalf of al-Mukhtar, at al-Khazir. It was a great battle in which Ubayd Allah ibn Ziyad, al-Husayn ibn Numayr, Shurahbil ibn Dhi al-Kala' and leading men of Syria were killed {cite:bakr-umayyad-state-1134715 p. 209}. The book states that al-Mukhtar ibn Abi Ubayd sent a force led by Ibrahim ibn al-Ashtar to fight Ubayd Allah ibn Ziyad, that the victory went to Ibn al-Ashtar, and that the Syrian troops suffered killing and drowning {cite:khudari-umayyad-state p.300}. It also says that the rout of the Syrian troops came at the moment when the vein of tribal zeal between Qays and Yemen throbbed {cite:khudari-umayyad-state p.365}."
  fr: "En 66 H, Ubayd Allah ibn Ziyad partit avec les armées de Syrie vers l'Irak. Arrivé à Mossoul, il rencontra à al-Khazir Ibrahim ibn al-Ashtar al-Nakha'i, qui commandait la cavalerie d'Irak au nom d'al-Mukhtar. Ce fut une grande bataille où furent tués Ubayd Allah ibn Ziyad, al-Husayn ibn Numayr, Shurahbil ibn Dhi al-Kala' et des notables de Syrie {cite:bakr-umayyad-state-1134715 p. 209}. Le livre indique qu'al-Mukhtar ibn Abi Ubayd envoya une troupe menée par Ibrahim ibn al-Ashtar combattre Ubayd Allah ibn Ziyad, que la victoire revint à Ibn al-Ashtar, et que les troupes syriennes subirent tueries et noyades {cite:khudari-umayyad-state p.300}. Il dit aussi que la déroute des troupes syriennes survint au moment où battit la veine de l'esprit tribal entre Qays et Yémen {cite:khudari-umayyad-state p.365}."
  es: "En el año 66 de la Hégira, Ubayd Allah ibn Ziyad partió con los ejércitos de Siria hacia Irak. Al llegar a Mosul, se encontró con Ibrahim ibn al-Ashtar al-Nakha'i, quien comandaba la caballería de Irak en nombre de al-Mukhtar, en al-Khazir. Fue una gran batalla en la que murieron Ubayd Allah ibn Ziyad, al-Husayn ibn Numayr, Shurahbil ibn Dhi al-Kala' y destacados hombres de Siria {cite:bakr-umayyad-state-1134715 p. 209}. El libro afirma que al-Mukhtar ibn Abi Ubayd envió una fuerza liderada por Ibrahim ibn al-Ashtar para luchar contra Ubayd Allah ibn Ziyad, que la victoria fue para Ibn al-Ashtar y que las tropas sirias sufrieron bajas mortales y ahogamientos {cite:khudari-umayyad-state p.300}. También dice que la derrota de las tropas sirias se produjo en el momento en que la tensión tribal entre Qays y Yemen estaba en su punto álgido {cite:khudari-umayyad-state p.365}."
