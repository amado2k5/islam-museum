summary:
  ar: "بطاقة أولية للحرب العثمانية الصفوية من ١٦٠٣ إلى ١٦١٨م، حروب الشاه عباس التي استرد بها أذربيجان والقوقاز حتى صلح نصوهين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Ottoman–Safavid War of 1603–1618, Shah Abbas's wars that won back Azerbaijan and the Caucasus until the Peace of Nasuh Pasha; its sources are not yet checked on the page."
  es: "Ficha de borrador para la guerra otomano-safávida de 1603-1618, las guerras del Shah Abbas que reconquistaron Azerbaiyán y el Cáucaso hasta la paz de Nasuh Pasha; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour la guerre ottomane-safavide de 1603-1618, les guerres du Shah Abbas qui ont permis de reconquérir l'Azerbaïdjan et le Caucase jusqu'à la paix de Nasuh Pacha; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1603-1618 کی عثمانی-صفوی جنگ کے لیے ڈرافٹ کارڈ، شاہ عباس کی جنگیں جنہوں نے ناشوح پاشا کے امن تک آذربائیجان اور قفقاز کو جیت لیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Şah Abbas'ın Azerbaycan ve Kafkasya'yı geri aldığı ve Nasuhin Antlaşması'na kadar süren 1603-1618 yılları arasındaki Osmanlı-Safevi Savaşı'na dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Ottoman-Safavid dari tahun 1603 hingga 1618 M, perang Shah Abbas di mana ia merebut kembali Azerbaijan dan Kaukasus hingga Perjanjian Nasuhin; sumber-sumber di halaman ini belum ditinjau."
