id: event/reconquest-of-armenia
class: event
kind: conquest
label: { ar: "استرداد محمد بن مروان لأرمينية", en: "Muhammad ibn Marwan's Recovery of Armenia" }
summary:
  ar: "عند البلاذري: لما كانت فتنة ابن الزبير انتقضت أرمينية وحالف أحرارها وأتباعهم، فلما ولي محمد بن مروان من قبل أخيه عبد الملك أرمينية حاربهم فظفر بهم فقتل وسبى وغلب على البلاد، ثم وعد من بقي منهم أن يعرض لهم في الشرف فاجتمعوا لذلك في كنائس من عمل خلاط فأغلقها عليهم ووكّل بأبوابها، ثم خوّفهم في تلك الغزاة فسُبيت أم يزيد بنت أسيد من السيسجان وكانت بنت بطريقها؛ وقد كان قبل ذلك خلف سلسلة عمال: ولّى عثمان المغيرة بن شعبة أذربيجان وأرمينية ثم عزله وولّى القاسم بن ربيعة بن أمية بن أبي الصلت الثقفي — ويقال ولّاها عمرو بن معاوية بن المتفق المقيلي وبعضهم يقول وليها رجل من بني كلاب بعد المغيرة خمس عشرة سنة ثم وليها العقيلي — وولّى الأشعث بن قيس لعلي بن أبي طالب أرمينية وأذربيجان، ثم ولّى عبد الله بن حاتم بن النعمان بن عمرو الباهلي من قبل معاوية فمات بها فوليها عبد العزيز بن حاتم بن النعمان أخوه فبنى مدينة دبيل وحصّنها وكبّر مسجدها وبنى مدينة النشوى ورمّ مدينة برذعة — ويقال إنه جدّد بناءها — وأحكم حفر الفارقين حولها وجدّد بناء مدينة البيلقان وكانت هذه المدن متشعثة مستهدمة، ويقال إن الذي جدّد بناء برذعة محمد بن مروان في أيام عبد الملك بن مروان، وقال الواقدي بنى عبد الملك مدينة برذعة على يد حاتم بن النعمان الباهلي أو ابنه، وقد كان عبد الملك ولّى عثمان بن الوليد بن عقبة بن أبي معيط أرمينية."
  en: "In al-Baladhuri: when Ibn al-Zubayr's civil strife came, Armenia broke away, its nobles and their followers swearing league; when Muhammad ibn Marwan governed Armenia for his brother Abd al-Malik he fought and overcame them, killing and capturing, and mastered the land; then he promised the survivors he would lay before them in honour, and they gathered for it in churches of the Khilat district — whereupon he shut them in and posted guards at the doors, then terrified them; in that campaign Umm Yazid bint Usid of the Sisajan — a daughter of its patrikios — was taken captive; before this had run a chain of governors: Uthman gave al-Mughira ibn Shu'ba Adharbayjan and Armenia, then removed him for al-Qasim ibn Rabi'a ibn Umayya ibn Abi al-Salt al-Thaqafi — or, it is said, Amr ibn Mu'awiya ibn al-Mutaffiq al-Muqayli governed it, and some say a man of Banu Kilab held it fifteen years after al-Mughira, then al-Uqayli — al-Ash'ath ibn Qays held Armenia and Adharbayjan for Ali ibn Abi Talib, then Abdallah ibn Hatim ibn al-Nu'man ibn Amr al-Bahili for Mu'awiya until he died there, whence his brother Abd al-Aziz ibn Hatim ibn al-Nu'man — who built the city of Dabil, fortified it, enlarged its mosque, built the city of Nashwa, repaired Bardha'a — or, they say, renewed its building — dug the two Fariq moats about it soundly, and renewed the city of al-Baylaqan, these cities having been ruined and decayed; some say Muhammad ibn Marwan renewed Bardha'a's building in Abd al-Malik's days, and al-Waqidi says Abd al-Malik built Bardha'a by the hand of Hatim ibn al-Nu'man al-Bahili or his son — Abd al-Malik also appointing Uthman ibn al-Walid ibn Uqba ibn Abi Mu'ayt over Armenia."
