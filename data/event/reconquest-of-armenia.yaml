label: { ar: "استرداد محمد بن مروان لأرمينية", en: "Muhammad ibn Marwan's Recovery of Armenia", es: "La recuperación de Armenia por Muhammad ibn Marwan", fr: "La reconquête de l'Arménie par Muhammad ibn Marwan" }
summary:
  ar: "عند البلاذري: لما كانت فتنة ابن الزبير انتقضت أرمينية وحالف أحرارها وأتباعهم، فلما ولي محمد بن مروان من قبل أخيه عبد الملك أرمينية حاربهم فظفر بهم فقتل وسبى وغلب على البلاد، ثم وعد من بقي منهم أن يعرض لهم في الشرف فاجتمعوا لذلك في كنائس من عمل خلاط فأغلقها عليهم ووكّل بأبوابها، ثم خوّفهم في تلك الغزاة فسُبيت أم يزيد بنت أسيد من السيسجان وكانت بنت بطريقها؛ وقد كان قبل ذلك خلف سلسلة عمال: ولّى عثمان المغيرة بن شعبة أذربيجان وأرمينية ثم عزله وولّى القاسم بن ربيعة بن أمية بن أبي الصلت الثقفي — ويقال ولّاها عمرو بن معاوية بن المتفق المقيلي وبعضهم يقول وليها رجل من بني كلاب بعد المغيرة خمس عشرة سنة ثم وليها العقيلي — وولّى الأشعث بن قيس لعلي بن أبي طالب أرمينية وأذربيجان، ثم ولّى عبد الله بن حاتم بن النعمان بن عمرو الباهلي من قبل معاوية فمات بها فوليها عبد العزيز بن حاتم بن النعمان أخوه فبنى مدينة دبيل وحصّنها وكبّر مسجدها وبنى مدينة النشوى ورمّ مدينة برذعة — ويقال إنه جدّد بناءها — وأحكم حفر الفارقين حولها وجدّد بناء مدينة البيلقان وكانت هذه المدن متشعثة مستهدمة، ويقال إن الذي جدّد بناء برذعة محمد بن مروان في أيام عبد الملك بن مروان، وقال الواقدي بنى عبد الملك مدينة برذعة على يد حاتم بن النعمان الباهلي أو ابنه، وقد كان عبد الملك ولّى عثمان بن الوليد بن عقبة بن أبي معيط أرمينية."
  en: "In al-Baladhuri: when Ibn al-Zubayr's civil strife came, Armenia broke away, its nobles and their followers swearing league; when Muhammad ibn Marwan governed Armenia for his brother Abd al-Malik he fought and overcame them, killing and capturing, and mastered the land; then he promised the survivors he would lay before them in honour, and they gathered for it in churches of the Khilat district — whereupon he shut them in and posted guards at the doors, then terrified them; in that campaign Umm Yazid bint Usid of the Sisajan — a daughter of its patrikios — was taken captive; before this had run a chain of governors: Uthman gave al-Mughira ibn Shu'ba Adharbayjan and Armenia, then removed him for al-Qasim ibn Rabi'a ibn Umayya ibn Abi al-Salt al-Thaqafi — or, it is said, Amr ibn Mu'awiya ibn al-Mutaffiq al-Muqayli governed it, and some say a man of Banu Kilab held it fifteen years after al-Mughira, then al-Uqayli — al-Ash'ath ibn Qays held Armenia and Adharbayjan for Ali ibn Abi Talib, then Abdallah ibn Hatim ibn al-Nu'man ibn Amr al-Bahili for Mu'awiya until he died there, whence his brother Abd al-Aziz ibn Hatim ibn al-Nu'man — who built the city of Dabil, fortified it, enlarged its mosque, built the city of Nashwa, repaired Bardha'a — or, they say, renewed its building — dug the two Fariq moats about it soundly, and renewed the city of al-Baylaqan, these cities having been ruined and decayed; some say Muhammad ibn Marwan renewed Bardha'a's building in Abd al-Malik's days, and al-Waqidi says Abd al-Malik built Bardha'a by the hand of Hatim ibn al-Nu'man al-Bahili or his son — Abd al-Malik also appointing Uthman ibn al-Walid ibn Uqba ibn Abi Mu'ayt over Armenia."
  es: "En al-Baladhuri: cuando llegó la guerra civil de Ibn al-Zubayr, Armenia se separó, sus nobles y sus seguidores juraron alianza; cuando Muhammad ibn Marwan gobernó Armenia para su hermano Abd al-Malik, luchó y los venció, matando y capturando, y dominó la tierra; luego prometió a los sobrevivientes que se postraría ante ellos con honores, y ellos se reunieron para ello en las iglesias del distrito de Khilat, tras lo cual los encerró y colocó guardias en las puertas, y luego los aterrorizó; en esa campaña, Umm Yazid bint Usid de Sisajan, una hija de su patricio, fue hecha cautiva; antes de esto había corrido una cadena de gobernadores: Uthman entregó a al-Mughira ibn Shu'ba Adharbayjan y Armenia, luego lo destituyó por al-Qasim ibn Rabi'a ibn Umayya ibn Abi al-Salt al-Thaqafi - o, se dice, Amr ibn Mu'awiya ibn al-Mutaffiq al-Muqayli lo gobernó, y algunos dicen que un hombre de Banu Kilab la ocupó quince años después de al-Mughira, luego al-Uqayli; al-Ash'ath ibn Qays retuvo Armenia y Adharbayjan para Ali ibn Abi Talib, luego Abdallah ibn Hatim ibn al-Nu'man ibn Amr al-Bahili para Mu'awiya hasta que murió allí, de donde nació su hermano Abd al-Aziz ibn Hatim ibn al-Nu'man, quien construyó la ciudad. de Dabil, la fortificó, amplió su La mezquita, la ciudad de Nashwa, la reparación de Bardha'a —o, según dicen, la renovación de sus edificios—, la construcción de los dos fosos de Fariq que la rodean de forma sólida y la renovación de la ciudad de al-Baylaqan, ciudades que habían sido arruinadas y deterioradas; algunos dicen que Muhammad ibn Marwan renovó los edificios de Bardha'a en tiempos de Abd al-Malik, y al-Waqidi dice que Abd al-Malik construyó Bardha'a por medio de Hatim ibn al-Nu'man al-Bahili o su hijo; Abd al-Malik también nombró a Uthman ibn al-Walid ibn Uqba ibn Abi Mu'ayt al frente de Armenia."
  fr: "Dans al-Baladhuri: lorsque les troubles civils d'Ibn al-Zubayr éclatèrent, l'Arménie fit sécession, ses nobles et leurs partisans scellant une alliance; lorsque Muhammad ibn Marwan gouverna l'Arménie pour son frère Abd al-Malik, il les combattit et les vainquit, tuant et capturant, et s'empara du pays; puis il promit aux survivants de les enterrer avec honneur, et ils se rassemblèrent pour cela dans les églises du district de Khilat — après quoi il les enferma et posta des gardes aux portes, puis les terrorisa; au cours de cette campagne, Umm Yazid bint Usid de Sisajan — une fille de ses patrikios — fut faite captive; avant cela, il y avait une chaîne de gouverneurs: Uthman a donné à al-Mughira ibn Shu'ba Adharbayjan et l'Arménie, puis l'a destitué pour al-Qasim ibn Rabi'a ibn Umayya ibn Abi al-Salt al-Thaqafi - ou, dit-on, Amr ibn Mu'awiya ibn al-Mutaffiq al-Muqayli l'a gouverné, et certains disent qu'un homme de Banu Kilab l'a occupé quinze ans après al-Mughira, puis al-Uqayli — al-Ash'ath ibn Qays détenait l'Arménie et l'Adharbayjan pour Ali ibn Abi Talib, puis Abdallah ibn Hatim ibn al-Nu'man ibn Amr al-Bahili pour Mu'awiya jusqu'à sa mort, d'où son frère Abd al-Aziz ibn Hatim ibn al-Nu'man — qui construisit la ville de Dabil, la fortifia, l'agrandit. mosquée, a construit la ville de Nashwa, il répara Bardha'a — ou, selon certains, renouvela sa construction —, creusa solidement les deux douves Fariq qui l'entouraient et renouvela la ville d'al-Baylaqan, ces villes ayant été ruinées et délabrées; certains disent que Muhammad ibn Marwan renouvela la construction de Bardha'a à l'époque d'Abd al-Malik, et al-Waqidi dit qu'Abd al-Malik construisit Bardha'a par l'intermédiaire de Hatim ibn al-Nu'man al-Bahili ou de son fils — Abd al-Malik nommant également Uthman ibn al-Walid ibn Uqba ibn Abi Mu'ayt à la tête de l'Arménie."
