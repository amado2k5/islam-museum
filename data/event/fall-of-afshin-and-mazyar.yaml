label: { ar: "مصرع المازيار والأفشين", en: "The fall of Mazyar and al-Afshin" }
summary:
  ar: "في سنة خمس وعشرين ومائتين حمل المازيار بن قارن صاحب طبرستان أسيراً إلى سامرا بعد أن بادره الحسن بن الحسين بن مصعب وناوشه الحرب، فأقر على الأفشين أنه بعثه على العصيان لمذهب من مذاهب الثنوية والمجوس، وضرب المازيار بالسوط حتى مات وشهر وصلب إلى جانب بابك، ومالت خشبته إلى خشبته فتدانت أجسامهما، ومات الأفشين في الحبس فصلب بباب العامة وألقيت عليه أصنام زعموا أنها حملت إليه وأضرمت النار فأتت على الجميع {cite:muruj-al-dhahab p. 450-451}."
  en: "Mazyar captured at al-Sariyya, whipped to death and crucified beside Babak; al-Afshin dead in gaol, gibbeted at Bab al-'Amma and burned with his 'idols' {cite:muruj-al-dhahab p. 450-451}."
