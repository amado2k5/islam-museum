id: event/fall-of-afshin-and-mazyar
class: event
kind: death
label: { ar: "مصرع المازيار والأفشين", en: "The fall of Mazyar and al-Afshin", es: "La caída de Mazyar y al-Afshin", fr: "La chute de Mazyar et d'al-Afshin", ur: "زوال مازیار اور الفشین", tr: "Mazir ve Afshin'in ölümü", id: "Kematian Mazir dan Afshin" }
summary:
  ar: "في سنة خمس وعشرين ومائتين حمل المازيار بن قارن صاحب طبرستان أسيراً إلى سامرا بعد أن بادره الحسن بن الحسين بن مصعب وناوشه الحرب، فأقر على الأفشين أنه بعثه على العصيان لمذهب من مذاهب الثنوية والمجوس، وضرب المازيار بالسوط حتى مات وشهر وصلب إلى جانب بابك، ومالت خشبته إلى خشبته فتدانت أجسامهما، ومات الأفشين في الحبس فصلب بباب العامة وألقيت عليه أصنام زعموا أنها حملت إليه وأضرمت النار فأتت على الجميع {cite:muruj-al-dhahab p. 450-451}."
  en: "Mazyar captured at al-Sariyya, whipped to death and crucified beside Babak; al-Afshin dead in gaol, gibbeted at Bab al-'Amma and burned with his 'idols' {cite:muruj-al-dhahab p. 450-451}."
  es: "Mazyar fue capturado en al-Sariyya, azotado hasta la muerte y crucificado junto a Babak; al-Afshin murió en la cárcel, fue colgado en la horca en Bab al-'Amma y quemado con sus 'ídolos' {cite:muruj-al-dhahab p. 450-451}."
  fr: "Mazyar capturé à al-Sariyya, fouetté à mort et crucifié à côté de Babak; al-Afshin mort en prison, gibet à Bab al-'Amma et brûlé avec ses 'idoles' {cite:muruj-al-dhahab p. 450-451}."
  ur: "مزیار کو السریہ میں پکڑا گیا، کوڑے مارے گئے اور بابک کے پاس مصلوب کیا گیا۔ افشین کو جیل میں مردہ کیا گیا، باب العمامہ پر غیبت کی گئی اور اپنے بتوں کے ساتھ جلایا گیا 450-451}۔"
  tr: "225 yılında, Tabaristan hükümdarı Mazyar ibn Qarin, Hasan ibn Hüseyin ibn Mus'ab'ın saldırısı ve çatışmasının ardından Samarra'ya esir olarak götürüldü. Mazyar, Afşin'in kendisini düalizm doktrinlerinden birine ve Mecusilere karşı isyan etmesi için gönderdiğini itiraf etti. Mazyar kırbaçlanarak öldü ve Babak'ın yanına halka açık bir şekilde çarmıha gerildi. Çarmıhı, Babak'ın çarmıhına doğru eğilmişti, böylece bedenleri birbirine çok yakındı. Afşin hapishanede öldü ve halka açık kapıda çarmıha gerildi. Üzerine, kendisine getirildiği iddia edilen putlar atıldı ve bir ateş yakıldı, böylece her şey yandı. {kaynak: Muruj-al-dhahab s. 450-451}"
  id: "Pada tahun 225, Mazyar ibn Qarin, penguasa Tabaristan, ditawan ke Samarra setelah al-Hasan ibn al-Husayn ibn Mus'ab menyerangnya dan terlibat pertempuran dengannya. Ia mengaku bahwa al-Afshin telah mengirimnya untuk memberontak melawan salah satu doktrin dualisme dan kaum Magi. Mazyar dicambuk hingga mati, dan ia dipertontonkan di depan umum dan disalibkan di samping Babak. Salibnya condong ke arah Babak, sehingga tubuh mereka berdekatan. Al-Afshin meninggal di penjara dan disalibkan di gerbang umum. Berhala-berhala dilemparkan kepadanya, yang mereka klaim telah dibawa kepadanya, dan api dinyalakan, sehingga menghanguskan semuanya. {cite:muruj-al-dhahab hlm. 450-451}."
