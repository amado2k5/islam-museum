label: { ar: "وقعة كتندة", en: "The battle of Cutanda", fr: "La bataille de Cutanda", es: "La batalla de Cutanda", ur: "کٹنڈا کی جنگ", tr: "Katanda Muharebesi", id: "Pertempuran Katanda" }
summary:
  ar: "وقعة كتندة على المسلمين سنة أربع عشرة وخمسمائة، وكتندة من حيز دورقة من عمل سرقسطة من الثغر الأعلى؛ كانت الهزيمة على المسلمين قتل فيها من المطوعة نحو من عشرين ألفاً ولم يقتل فيها من العسكر أحد، وكان على المسلمين الأمير إبراهيم بن يوسف بن تاشفين، وممن حضرها الشيخ أبو علي الصدفي وقرينه في الفضل أبو عبد الله ابن الفراء خرجا غازيين فكانا ممن فقد فيها {cite:nafh-tib-maqqari p. 465}. وقال غير واحد إن العسكر انصرف مفلولاً إلى بلنسية وإن القاضي أبا بكر ابن العربي كان ممن حضرها وسئل مخلصه منها عن حاله فقال: حال من ترك الحباء والعباء — وهذا مثل عند المغاربة معروف يقال لمن ذهبت ثيابه وخيامه بمعنى أنه ذهب جميع ما لديه {cite:nafh-tib-maqqari p. 465}."
  en: "The rout of Cutanda (514) in the Upper March of Saragossa: some twenty thousand volunteer mutatawwi'a were cut down while the regular army escaped unhurt; the amir was Ibrahim ibn Yusuf ibn Tashfin, and the scholars Abu Ali al-Sadafi and Ibn al-Farra went out as ghazis and were lost. The qadi Abu Bakr ibn al-Arabi was present — asked how he had fared, he gave the Maghrebi proverb 'the state of one who left his tent and cloak': everything gone {cite:nafh-tib-maqqari p. 465}."
  fr: "La déroute de Cutanda (514), dans la Marche supérieure de Saragosse : quelque vingt mille volontaires mutatawwi'a furent taillés en pièces tandis que l'armée régulière s'échappait indemne ; l'émir était Ibrahim ibn Yusuf ibn Tashfin, et les savants Abu Ali al-Sadafi et Ibn al-Farra partirent en ghazis et y périrent. Le cadi Abu Bakr ibn al-Arabi était présent : quand on lui demanda comment il s'en était tiré, il cita le proverbe maghrébin « l'état de celui qui a laissé sa tente et son manteau » : tout était perdu {cite:nafh-tib-maqqari p. 465}."
  es: "La derrota de Cutanda (514) en la Marca Superior de Zaragoza: unos veinte mil voluntarios mutatawwi'a fueron masacrados mientras que el ejército regular escapó ileso; el emir era Ibrahim ibn Yusuf ibn Tashfin, y los eruditos Abu Ali al-Sadafi e Ibn al-Farra salieron como ghazis y se perdieron. El cadí Abu Bakr ibn al-Arabi estaba presente; al preguntársele cómo le había ido, citó el proverbio magrebí «el estado de quien abandona su tienda y su manto»: lo perdió todo {cite:nafh-tib-maqqari p. 465}."
  ur: "سرگوسا کے اپر مارچ میں کٹانڈا (514) کا راستہ: تقریباً بیس ہزار رضاکار متواضع کو کاٹ دیا گیا جبکہ باقاعدہ فوج محفوظ رہنے سے بچ گئی۔ امیر ابراہیم بن یوسف ابن تاشفین تھا اور علماء ابو علی الصدفی اور ابن الفارہ غازی بن کر نکلے اور گم ہو گئے۔ قاضی ابوبکر ابن العربی موجود تھے - ان سے پوچھا کہ آپ کی زندگی کیسی رہی تو انہوں نے مغربی کہاوت بیان کی کہ 'اس شخص کی حالت جس نے اپنا خیمہ اور چادر چھوڑ دی': سب کچھ ختم ہو گیا۔ 465}۔"
  tr: "Müslümanlara karşı Catanda Muharebesi, Hicri 514 yılında (Miladi 1120) gerçekleşti. Catanda, Yukarı Marche'deki Zaragoza vilayetinin Dorca bölgesinin bir parçasıydı. Müslümanlar yaklaşık yirmi bin gönüllünün öldürüldüğü bir yenilgiye uğradı, düzenli ordudan ise kimse ölmedi. Müslüman komutan Emir İbrahim ibn Yusuf ibn Tashfin'di. Orada bulunanlar arasında Şeyh Ebu Ali el-Sadafi ve onun faziletine denk Ebu Abdullah ibn el-Farra da vardı; bu ikisi de bir askeri sefere çıkmış ve savaşta kaybolanlar arasındaydı. {cite:nafh-tib-maqqari s. 465}. Birçok kaynak, ordunun düzensiz bir şekilde Valencia'ya çekildiğini söylüyor. Kadı Ebu Bekir ibn el-Arabi de orada bulunanlar arasındaydı ve serbest bırakıldıktan sonra durumu sorulduğunda, \"Elbisesini ve pelerinini kaybetmiş birinin hali\" diye cevap verdi; bu, Mağripliler arasında her şeyini kaybetmiş birini tanımlamak için kullanılan yaygın bir atasözüdür. {alıntı:nafh-tib-maqqari s. 465}."
  id: "Perang Catanda melawan kaum Muslimin terjadi pada tahun 514 H (1120 M). Catanda merupakan bagian dari distrik Dorca, di provinsi Zaragoza, di wilayah Upper March. Kaum Muslimin mengalami kekalahan, dengan sekitar dua puluh ribu sukarelawan tewas, sementara tidak ada satu pun dari pasukan reguler yang tewas. Komandan Muslim adalah Emir Ibrahim ibn Yusuf ibn Tashfin. Di antara mereka yang hadir adalah Syekh Abu Ali al-Sadafi dan rekannya yang mulia, Abu Abdullah ibn al-Farra, yang telah berangkat dalam kampanye militer dan termasuk di antara mereka yang gugur dalam pertempuran. {cite:nafh-tib-maqqari hlm. 465}. Beberapa sumber mengatakan bahwa pasukan mundur dalam keadaan kacau ke Valencia. Hakim Abu Bakr ibn al-Arabi termasuk di antara mereka yang hadir, dan ketika ditanya tentang kondisinya setelah dibebaskan, ia menjawab: \"Keadaan seseorang yang telah kehilangan pakaian dan jubahnya\"—sebuah pepatah terkenal di kalangan Maghreb yang digunakan untuk menggambarkan seseorang yang telah kehilangan segalanya. {mengutip:nafh-tib-maqqari hal. 465}."
