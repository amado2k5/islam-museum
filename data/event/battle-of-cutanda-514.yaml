label: { ar: "وقعة كتندة", en: "The battle of Cutanda", fr: "La bataille de Cutanda", es: "La batalla de Cutanda" }
summary:
  ar: "وقعة كتندة على المسلمين سنة أربع عشرة وخمسمائة، وكتندة من حيز دورقة من عمل سرقسطة من الثغر الأعلى؛ كانت الهزيمة على المسلمين قتل فيها من المطوعة نحو من عشرين ألفاً ولم يقتل فيها من العسكر أحد، وكان على المسلمين الأمير إبراهيم بن يوسف بن تاشفين، وممن حضرها الشيخ أبو علي الصدفي وقرينه في الفضل أبو عبد الله ابن الفراء خرجا غازيين فكانا ممن فقد فيها {cite:nafh-tib-maqqari p. 465}. وقال غير واحد إن العسكر انصرف مفلولاً إلى بلنسية وإن القاضي أبا بكر ابن العربي كان ممن حضرها وسئل مخلصه منها عن حاله فقال: حال من ترك الحباء والعباء — وهذا مثل عند المغاربة معروف يقال لمن ذهبت ثيابه وخيامه بمعنى أنه ذهب جميع ما لديه {cite:nafh-tib-maqqari p. 465}."
  en: "The rout of Cutanda (514) in the Upper March of Saragossa: some twenty thousand volunteer mutatawwi'a were cut down while the regular army escaped unhurt; the amir was Ibrahim ibn Yusuf ibn Tashfin, and the scholars Abu Ali al-Sadafi and Ibn al-Farra went out as ghazis and were lost. The qadi Abu Bakr ibn al-Arabi was present — asked how he had fared, he gave the Maghrebi proverb 'the state of one who left his tent and cloak': everything gone {cite:nafh-tib-maqqari p. 465}."
  fr: "La déroute de Cutanda (514), dans la Marche supérieure de Saragosse : quelque vingt mille volontaires mutatawwi'a furent taillés en pièces tandis que l'armée régulière s'échappait indemne ; l'émir était Ibrahim ibn Yusuf ibn Tashfin, et les savants Abu Ali al-Sadafi et Ibn al-Farra partirent en ghazis et y périrent. Le cadi Abu Bakr ibn al-Arabi était présent : quand on lui demanda comment il s'en était tiré, il cita le proverbe maghrébin « l'état de celui qui a laissé sa tente et son manteau » : tout était perdu {cite:nafh-tib-maqqari p. 465}."
  es: "La derrota de Cutanda (514) en la Marca Superior de Zaragoza: unos veinte mil voluntarios mutatawwi'a fueron masacrados mientras que el ejército regular escapó ileso; el emir era Ibrahim ibn Yusuf ibn Tashfin, y los eruditos Abu Ali al-Sadafi e Ibn al-Farra salieron como ghazis y se perdieron. El cadí Abu Bakr ibn al-Arabi estaba presente; al preguntársele cómo le había ido, citó el proverbio magrebí «el estado de quien abandona su tienda y su manto»: lo perdió todo {cite:nafh-tib-maqqari p. 465}."
