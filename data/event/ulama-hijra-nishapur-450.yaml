label:
  ar: "هجرة العلماء من نيسابور إلى الحجاز، نحو ٤٥٠هـ"
  en: "The scholars' exodus from Nishapur toward the Hijaz, c. 450/1058"
  ur: "نیشاپور سے علماء کی ہجرت بطرفِ حجاز، تقریباً 450ھ/1058ء"
  es: "El éxodo de los eruditos de Nishapur hacia el Hiyaz, c. 450/1058"
  fr: "L'exode des érudits de Nishapur vers le Hedjaz, vers 450/1058"
  tr: "Nişapur'dan Hicaz'a âlimlerin göçü, yaklaşık 450 Hicri yılı."
  id: "Migrasi para ulama dari Nishapur ke Hijaz, sekitar tahun 450 Hijriah."
summary:
  ar: "جاء أمر السلطان طغرل بك بالقبض على القشيري وإمام الحرمين وابن الموفق ونفيهم، فاختفى الجويني وخرج على طريق كرمان إلى الحجاز فسُمّي إمام الحرمين، وحجّ من جملة المهاجرين الحافظ أبو بكر البيهقي والأستاذ أبو القاسم القشيري وخلائق، حتى قيل إن تلك السنة اجتمع أربعمائة قاض من الشافعية والحنفية هاجروا بلادهم بسبب الواقعة {cite:tabaqat-shafiiyya-subki pp. 271-272}."
  en: "Sultan Tughril Beg's order came to seize al-Qushayri, Imam al-Haramayn and Ibn al-Muwaqqiq and exile them; al-Juwayni hid and left by the Kirman road for the Hijaz — whence his title 'Imam of the two sanctuaries' — while the memorist Abu Bakr al-Bayhaqi and the master Abu al-Qasim al-Qushayri were among those who made the Pilgrimage; it is said that year brought together some four hundred qadis of the Shafi'is and Hanafis driven from their lands by the affair {cite:tabaqat-shafiiyya-subki pp. 271-272}."
  ur: "سلطان طغرل بیک کا حکم آیا کہ قشیری، امام الحرمین اور ابن الموفق کو گرفتار کر کے جلاوطن کیا جائے؛ جوینی چھپ کر راہِ کرمان سے حجاز چلے گئے جہاں انھیں 'امام الحرمین' کہا گیا، جبکہ حافظ ابو بکر بيهقی اور استاد ابو القاسم قشیری ان مہاجرین میں شامل تھے جنھوں نے حج کیا؛ کہا جاتا ہے اس سال شافعی اور حنفی مذاہب کے تقریباً چار سو قاضی اس واقعے کی وجہ سے اپنے ملک سے نکالے گئے {cite:tabaqat-shafiiyya-subki pp. 271-272}۔"
  es: "El sultán Tughril Beg ordenó apresar a al-Qushayri, al imán al-Haramayn y a Ibn al-Muwaqqiq y exiliarlos; al-Juwayni se escondió y partió por el camino de Kirman hacia el Hiyaz —de donde proviene su título de \"Imán de los dos santuarios\"— mientras que el memorista Abu Bakr al-Bayhaqi y el maestro Abu al-Qasim al-Qushayri estuvieron entre los que realizaron la peregrinación; se dice que ese año reunió a unos cuatrocientos cadíes de los shafi'ís y hanafíes expulsados de sus tierras por el asunto {cite:tabaqat-shafiiyya-subki pp. 271-272}."
  fr: "L'ordre du sultan Tughril Beg fut donné de s'emparer d'al-Qushayri, de l'imam al-Haramayn et d'Ibn al-Muwaqqiq et de les exiler; al-Juwayni se cacha et partit par la route de Kirman pour le Hedjaz — d'où son titre d'« Imam des deux sanctuaires » — tandis que le mémorialiste Abu Bakr al-Bayhaqi et le maître Abu al-Qasim al-Qushayri étaient parmi ceux qui firent le pèlerinage; on dit que cette année-là rassembla quelque quatre cents cadis des Shafi'ites et des Hanafites chassés de leurs terres par cette affaire {cite:tabaqat-shafiiyya-subki pp. 271-272}."
  tr: "Sultan Tuğril Bey, el-Kuşeyri, İmam el-Haramayn ve İbn el-Muveffak'ın tutuklanıp sürgüne gönderilmesini emretti. El-Cüveyni ortadan kayboldu ve Kerman'dan Hicaz'a giden yola çıktı ve İmam el-Haramayn olarak anıldı. Hac yapan hicret edenler arasında ezberci Ebu Bekir el-Beyhaki, üstat Ebu el-Kâsim el-Kuşeyri ve daha birçok kişi vardı. Hatta o yıl, Şafiî ve Hanefi mezheplerinden dört yüz kadı'nın bu olay nedeniyle toplanıp ülkelerinden hicret ettikleri söylenir. {cite:tabaqat-shafiiyya-subki s. 271-272}"
  id: "Sultan Tughril Beg memerintahkan penangkapan al-Qushayri, Imam al-Haramayn, dan Ibn al-Muwaffaq serta pengasingan mereka. Al-Juwayni menghilang dan pergi dari Kerman ke Hijaz, dan ia disebut Imam al-Haramayn. Di antara para emigran yang menunaikan ibadah haji adalah penghafal Al-Qur'an Abu Bakr al-Bayhaqi, guru Abu al-Qasim al-Qushayri, dan banyak lainnya. Bahkan dikatakan bahwa pada tahun itu, empat ratus hakim dari mazhab Syafi'i dan Hanafi berkumpul dan berhijrah dari negara mereka karena peristiwa tersebut. {cite:tabaqat-shafiiyya-subki pp. 271-272}"
