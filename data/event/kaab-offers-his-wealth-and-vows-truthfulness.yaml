summary:
  ar: "قال كعب للنبي إن من توبته أن ينخلع من ماله صدقة، فقال له أمسك عليك بعض مالك فهو خير لك، فأمسك سهمه من خيبر ونذر ألا يحدث إلا صدقاً ما حيي، وعدّ صدقه مع النبي أعظم نعمة بعد الإسلام."
  en: "Ka'b told the Prophet that part of his repentance was to give up his wealth in charity; the Prophet said: keep some of your wealth, it is better for you, so Ka'b kept his share of Khaybar and vowed to speak nothing but the truth as long as he lived, counting his truthfulness to the Prophet the greatest blessing after Islam."
