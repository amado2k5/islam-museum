id: event/kaab-offers-his-wealth-and-vows-truthfulness
class: event
kind: other
label: { ar: "كعب يعرض ماله وينذر الصدق", en: "Ka'b offers his wealth and vows to speak only the truth", es: "Ka'b ofrece su riqueza y jura decir solo la verdad.", fr: "Ka'b offre sa richesse et jure de ne dire que la vérité.", ur: "کعب نے اپنی دولت کی پیشکش کی اور صرف سچ بولنے کی قسم کھائی", tr: "Ka'b servetini sunar ve dürüst olacağına yemin eder.", id: "Ka'b menawarkan kekayaannya dan bersumpah untuk jujur." }
summary:
  ar: "قال كعب للنبي إن من توبته أن ينخلع من ماله صدقة، فقال له أمسك عليك بعض مالك فهو خير لك، فأمسك سهمه من خيبر ونذر ألا يحدث إلا صدقاً ما حيي، وعدّ صدقه مع النبي أعظم نعمة بعد الإسلام."
  en: "Ka'b told the Prophet that part of his repentance was to give up his wealth in charity; the Prophet said: keep some of your wealth, it is better for you, so Ka'b kept his share of Khaybar and vowed to speak nothing but the truth as long as he lived, counting his truthfulness to the Prophet the greatest blessing after Islam."
  es: "Ka'b le dijo al Profeta que parte de su arrepentimiento consistía en dar su riqueza en caridad; el Profeta le dijo: conserva parte de tu riqueza, es mejor para ti. Así que Ka'b conservó su parte de Khaybar y juró no decir nada más que la verdad mientras viviera, considerando su sinceridad hacia el Profeta como la mayor bendición después del Islam."
  fr: "Ka'b dit au Prophète qu'une partie de son repentir consistait à donner sa richesse en aumône; le Prophète dit: garde une partie de ta richesse, c'est mieux pour toi. Ka'b garda donc sa part de Khaybar et fit vœu de ne dire que la vérité jusqu'à la fin de ses jours, considérant sa sincérité envers le Prophète comme la plus grande bénédiction après l'Islam."
  ur: "کعب نے نبی کو بتایا کہ ان کی توبہ کا ایک حصہ صدقہ میں اپنا مال ترک کرنا تھا۔ آپ نے فرمایا: اپنے مال میں سے کچھ رکھ لو، یہ تمہارے لیے بہتر ہے، چنانچہ کعب نے خیبر کا حصہ اپنے پاس رکھ لیا اور جب تک زندہ رہے، حق کے سوا کچھ نہ کہنے کی قسم کھائی، نبی کی سچائی کو اسلام کے بعد سب سے بڑی نعمت قرار دیا۔"
  tr: "Ka'b, Peygamber'e tövbesinin bir parçası olarak parasını sadaka olarak dağıtacağını söyledi. Peygamber ona parasının bir kısmını saklamasını, bunun kendisi için daha hayırlı olacağını söyledi. Böylece Ka'b, Hayber'deki payını sakladı ve yaşadığı sürece asla doğru dışında bir şey söylemeyeceğine yemin etti; Peygamber'e karşı dürüstlüğünü İslam'dan sonraki en büyük nimet olarak gördü."
  id: "Ka’b berkata kepada Nabi bahwa bagian dari taubatnya adalah memberikan hartanya sebagai sedekah. Nabi menyuruhnya untuk menyimpan sebagian hartanya, karena itu akan lebih baik baginya. Maka ia menyimpan bagiannya dari harta Khaybar dan bersumpah untuk tidak pernah berbicara selain kebenaran selama hidupnya, dan ia menganggap kejujurannya kepada Nabi sebagai berkah terbesar setelah Islam."
