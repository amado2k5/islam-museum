summary:
  ar: "مع أن الوليد كان جباراً ظالماً فقد أقام الجهاد في أيامه وفتحت في خلافته فتوحات عظيمة، وكان يختن الأيتام ويرتب لهم المؤدبين ويرتب للزمنى من يخدمهم وللأضراء من يقودهم، ورزق الفقهاء والفقراء والضعفاء وحرم عليهم سؤال الناس وفرض لهم ما يكفيهم {cite:tarikh-khulafa-minhaj-1434 p. 367}."
  en: "Though al-Walid was a tyrant, his reign sustained jihad and great conquests — and he had orphans circumcised with tutors appointed for them, attendants assigned to the chronically infirm, guides assigned to the blind; he granted stipends to the jurists, the poor and the weak sufficient for them, forbidding them to beg from people {cite:tarikh-khulafa-minhaj-1434 p. 367}."
