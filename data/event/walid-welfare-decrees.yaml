label: { ar: "فرائض الوليد للضعفاء", en: "al-Walid's Stipends for the Weak", es: "Las ayudas de al-Walid para los débiles", fr: "Les allocations d'al-Walid pour les faibles" }
summary:
  ar: "مع أن الوليد كان جباراً ظالماً فقد أقام الجهاد في أيامه وفتحت في خلافته فتوحات عظيمة، وكان يختن الأيتام ويرتب لهم المؤدبين ويرتب للزمنى من يخدمهم وللأضراء من يقودهم، ورزق الفقهاء والفقراء والضعفاء وحرم عليهم سؤال الناس وفرض لهم ما يكفيهم {cite:tarikh-khulafa-minhaj-1434 p. 367}."
  en: "Though al-Walid was a tyrant, his reign sustained jihad and great conquests — and he had orphans circumcised with tutors appointed for them, attendants assigned to the chronically infirm, guides assigned to the blind; he granted stipends to the jurists, the poor and the weak sufficient for them, forbidding them to beg from people {cite:tarikh-khulafa-minhaj-1434 p. 367}."
  es: "Aunque al-Walid fue un tirano, su reinado sostuvo la yihad y grandes conquistas; mandó circuncidar a los huérfanos y les asignó tutores, asistentes a los enfermos crónicos y guías a los ciegos; concedió estipendios a los juristas, a los pobres y a los débiles, y les prohibió mendigar {cite:tarikh-khulafa-minhaj-1434 p. 367}."
  fr: "Bien qu'al-Walid fût un tyran, son règne soutint le jihad et de grandes conquêtes — et il fit circoncire les orphelins avec des tuteurs désignés pour eux, des assistants assignés aux infirmes chroniques, des guides assignés aux aveugles; il accorda des allocations aux juristes, aux pauvres et aux faibles suffisantes pour eux, leur interdisant de mendier auprès des gens {cite:tarikh-khulafa-minhaj-1434 p. 367}."
