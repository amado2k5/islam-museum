summary:
  ar: "فتح الأهواز ومناذر ونهر تيرى في خوزستان: انهزم الهرمزان يوم سوق الأهواز فافتتحها المسلمون وبعث حرقوص بن زهير جزء بن معاوية في أثره فما زال يقتلهم حتى انتهى إلى قرية الشغر ويعجزه الهرمزان فمال جزء إلى دورق فأخذها صافية ودعا من هرب إلى الجزية فأجابوه، وعمّر جزء البلاد وشق الأنهار وأحيا الموات، وراسلهم الهرمزان يطلب الصلح فأجاب عمر إلى ذلك على أن يكون ما أخذه المسلمون بأيديهم {cite:kamil-ibn-al-athir p. 366-367}."
  en: "Al-Ahwaz fell at «the market of Ahwaz«; Hurmuzan fled, Hurqus ibn Zuhayr and Jaz' ibn Mu'awiya hunted the rout to al-Shaghar, and Jaz' turned to Dawraq — city of the sacristans — and took it bloodlessly. He repaired the country, dug the canals, brought dead land back to life, and 'Umar confirmed the peace: whatever the Muslims had taken stayed in their hands {cite:kamil-ibn-al-athir p. 366-367}."
  es: "Al-Ahwaz cayó en «el mercado de Ahwaz»; Hurmuzan huyó, Hurqus ibn Zuhayr y Jaz' ibn Mu'awiya siguieron la ruta hacia al-Shaghar, y Jaz' se dirigió a Dawraq —ciudad de los sacristanes— y la tomó sin derramamiento de sangre. Reparó el país, excavó canales, devolvió la vida a tierras muertas, y 'Umar confirmó la paz: todo lo que los musulmanes habían tomado permaneció en sus manos {cite:kamil-ibn-al-athir p. 366-367}."
  fr: "Al-Ahwaz tomba au marché d'Ahwaz; Hurmuzan s'enfuit, Hurqus ibn Zuhayr et Jaz' ibn Mu'awiya poursuivirent la déroute jusqu'à al-Shaghar, et Jaz' se tourna vers Dawraq, la ville des sacristains, et la prit sans effusion de sang. Il remit en état la région, creusa des canaux, redonna vie aux terres arides, et 'Umar confirma la paix: tout ce que les musulmans avaient pris leur resta en leur possession (voir: Kamil ibn al-Athir, p. 366-367)."
  ur: "الاحواز «اہواز کے بازار» میں گرا۔ ہرمزان بھاگ گیا، حرقس ابن زہیر اور جاز ابن معاویہ نے الشغر کی راہ کا شکار کیا، اور جاز نے داوراق کا رخ کیا - مقدسین کے شہر - اور اسے خون کے بغیر لے لیا۔ اس نے ملک کی مرمت کی، نہریں کھودیں، مردہ زمین کو دوبارہ زندہ کیا، اور عمر نے امن کی تصدیق کی: مسلمانوں نے جو کچھ لیا وہ ان کے ہاتھ میں رہا۔ 366-367}۔"
  tr: "Huzistan'daki Ahvaz, Manadhir ve Tiri Nehri'nin Fethi: Hormuzan, Ahvaz pazarı gününde yenilgiye uğradı ve Müslümanlar burayı ele geçirdi. Harkus bin Zuhair, Juz bin Mu'awiya'yı onun peşinden gönderdi ve Juz, El-Şagr köyüne ulaşana kadar Müslümanları öldürmeye devam etti ve Hormuzan onu yenemedi. Juz daha sonra Durak'a gitti ve orayı hediye olarak aldı ve kaçanlardan cizye ödemelerini istedi ve onlar da ona karşılık verdiler. Juz ülkeyi geliştirdi, nehirler kazdı ve ölü toprakları canlandırdı. Hormuzan onlara barış isteyen bir mesaj gönderdi ve Ömer, Müslümanların ele geçirdikleri toprakların kendi ellerinde kalması şartıyla buna razı oldu. {Kaynak: Kamil İbn el-Atir s. 366-367}"
  id: "Penaklukan Ahwaz, Manadhir, dan Sungai Tiri di Khuzestan: Hormuzan dikalahkan pada hari pasar Ahwaz, sehingga kaum Muslimin menaklukkannya. Harqus bin Zuhair mengirim Juz’ bin Mu’awiya untuk mengejarnya, dan ia terus membunuh mereka hingga mencapai desa Al-Shaghr, dan Hormuzan tidak mampu mengalahkannya. Juz’ kemudian pergi ke Duraq dan mengambilnya sebagai hadiah, dan ia menyeru orang-orang yang telah melarikan diri untuk membayar jizya, dan mereka menanggapi seruannya. Juz’ mengembangkan negara itu, menggali sungai, dan menghidupkan kembali tanah yang mati. Hormuzan mengirimkan pesan kepada mereka untuk meminta perdamaian, dan Umar menyetujuinya dengan syarat bahwa apa yang telah diambil kaum Muslimin akan tetap berada di tangan mereka. {cite:kamil-ibn-al-athir hlm. 366-367}."
