summary:
  ar: "فتح الأهواز ومناذر ونهر تيرى في خوزستان: انهزم الهرمزان يوم سوق الأهواز فافتتحها المسلمون وبعث حرقوص بن زهير جزء بن معاوية في أثره فما زال يقتلهم حتى انتهى إلى قرية الشغر ويعجزه الهرمزان فمال جزء إلى دورق فأخذها صافية ودعا من هرب إلى الجزية فأجابوه، وعمّر جزء البلاد وشق الأنهار وأحيا الموات، وراسلهم الهرمزان يطلب الصلح فأجاب عمر إلى ذلك على أن يكون ما أخذه المسلمون بأيديهم {cite:kamil-ibn-al-athir p. 366-367}."
  en: "Al-Ahwaz fell at «the market of Ahwaz«; Hurmuzan fled, Hurqus ibn Zuhayr and Jaz' ibn Mu'awiya hunted the rout to al-Shaghar, and Jaz' turned to Dawraq — city of the sacristans — and took it bloodlessly. He repaired the country, dug the canals, brought dead land back to life, and 'Umar confirmed the peace: whatever the Muslims had taken stayed in their hands {cite:kamil-ibn-al-athir p. 366-367}."
