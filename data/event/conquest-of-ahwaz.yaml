summary:
  ar: "فتح الأهواز ومناذر ونهر تيرى في خوزستان: انهزم الهرمزان يوم سوق الأهواز فافتتحها المسلمون وبعث حرقوص بن زهير جزء بن معاوية في أثره فما زال يقتلهم حتى انتهى إلى قرية الشغر ويعجزه الهرمزان فمال جزء إلى دورق فأخذها صافية ودعا من هرب إلى الجزية فأجابوه، وعمّر جزء البلاد وشق الأنهار وأحيا الموات، وراسلهم الهرمزان يطلب الصلح فأجاب عمر إلى ذلك على أن يكون ما أخذه المسلمون بأيديهم {cite:kamil-ibn-al-athir p. 366-367}."
  en: "Al-Ahwaz fell at «the market of Ahwaz«; Hurmuzan fled, Hurqus ibn Zuhayr and Jaz' ibn Mu'awiya hunted the rout to al-Shaghar, and Jaz' turned to Dawraq — city of the sacristans — and took it bloodlessly. He repaired the country, dug the canals, brought dead land back to life, and 'Umar confirmed the peace: whatever the Muslims had taken stayed in their hands {cite:kamil-ibn-al-athir p. 366-367}."
  es: "Al-Ahwaz cayó en «el mercado de Ahwaz»; Hurmuzan huyó, Hurqus ibn Zuhayr y Jaz' ibn Mu'awiya siguieron la ruta hacia al-Shaghar, y Jaz' se dirigió a Dawraq —ciudad de los sacristanes— y la tomó sin derramamiento de sangre. Reparó el país, excavó canales, devolvió la vida a tierras muertas, y 'Umar confirmó la paz: todo lo que los musulmanes habían tomado permaneció en sus manos {cite:kamil-ibn-al-athir p. 366-367}."
  fr: "Al-Ahwaz tomba au marché d'Ahwaz; Hurmuzan s'enfuit, Hurqus ibn Zuhayr et Jaz' ibn Mu'awiya poursuivirent la déroute jusqu'à al-Shaghar, et Jaz' se tourna vers Dawraq, la ville des sacristains, et la prit sans effusion de sang. Il remit en état la région, creusa des canaux, redonna vie aux terres arides, et 'Umar confirma la paix: tout ce que les musulmans avaient pris leur resta en leur possession (voir: Kamil ibn al-Athir, p. 366-367)."
