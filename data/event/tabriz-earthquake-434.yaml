label: { ar: "الزلزلة العظمى بتبريز", en: "The Great Earthquake at Tabriz", es: "El gran terremoto de Tabriz", fr: "Le grand tremblement de terre de Tabriz", ur: "تبریز میں زبردست زلزلہ", tr: "Tebriz'deki Büyük Deprem", id: "Gempa Besar di Tabriz" }
summary:
  ar: "في سنة أربع وثلاثين وأربعمائة كانت الزلزلة العظمى بتبريز فدُمّرت أسوارها وأُحصي من هلك تحت الردم فكانوا أكثر من أربعين ألفاً {cite:shadharat-dhahab p. 254}. وعند ابن الجوزي أن كتابًا ورد من تبريز بأنه يوم الخميس لخمس ليالٍ بقين من رجب هُدمت ثلاثة أرباع السور وقُتل فيها أكثر من خمسين ألفًا ولم يُهدم إلا المسجد الأعظم وكنائس بها من العدد ما لا يُحصى، وخرج أمير البلد حتى جلس في موضع أسود وحوله أعلام سود وأبواب سود {cite:muntazam-ibn-al-jawzi j.8 p.457}."
  en: "In 434 the great earthquake struck Tabriz, demolishing its walls; those counted dead under the rubble exceeded forty thousand {cite:shadharat-dhahab p. 254}."
  es: "En 434, el gran terremoto azotó Tabriz, demoliendo sus murallas; los muertos contados bajo los escombros superaron los cuarenta mil {cite:shadharat-dhahab p. 254}."
  fr: "En 434, le grand tremblement de terre frappa Tabriz, détruisant ses murs; le nombre de morts sous les décombres dépassa quarante mille {cite:shadharat-dhahab p. 254}."
  ur: "434 میں زبردست زلزلہ تبریز میں آیا، اس کی دیواریں گر گئیں۔ ملبے تلے دبے مرنے والوں کی تعداد چالیس ہزار سے تجاوز کرگئی۔ 254}۔"
  tr: "Hicri 434 yılında büyük deprem Tebriz'i vurdu ve surlarını yıktı. Enkaz altında ölenlerin sayısı kırk binden fazla olarak belirlendi. {Kaynak: Şadharat-dahab s. 254}. İbn el-Cevzi, Tebriz'den gelen bir mektupta, Recep ayının bitimine beş gece kala Perşembe günü surların dörtte üçünün yıkıldığı ve elli binden fazla kişinin öldüğü bildirildiğini aktardı. Sadece Mescid-i Haram ve sayısız kilise yıkılmıştı. Şehrin yöneticisi dışarı çıkıp siyah bayraklar ve siyah kapılarla çevrili siyah bir yerde oturdu. {Kaynak: Muntazam-ibn-el-Cevzi j.8 s. 457}."
  id: "Pada tahun 434 H, gempa bumi dahsyat melanda Tabriz, menghancurkan tembok-temboknya. Korban yang tewas di bawah reruntuhan dihitung dan berjumlah lebih dari empat puluh ribu jiwa {kutip:shadharat-dhahab hlm. 254}. Ibn al-Jawzi melaporkan bahwa sebuah surat tiba dari Tabriz yang menyatakan bahwa pada hari Kamis, lima malam sebelum berakhirnya bulan Rajab, tiga perempat tembok hancur, dan lebih dari lima puluh ribu orang tewas. Hanya Masjid Agung dan gereja-gereja yang tak terhitung jumlahnya yang hancur. Penguasa kota keluar dan duduk di tempat yang gelap, dikelilingi oleh bendera hitam dan gerbang hitam {kutip:muntazam-ibn-al-jawzi j.8 hlm.457}."
