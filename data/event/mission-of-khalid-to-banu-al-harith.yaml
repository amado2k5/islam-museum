label: { ar: "بعث خالد بن الوليد إلى بني الحارث بن كعب وإسلامهم وقدوم وفدهم", en: "Khalid ibn al-Walid's mission to Banu al-Harith ibn Ka'b, their conversion and their delegation" }
summary:
  ar: "بعث النبي خالد بن الوليد في ربيع الآخر أو جمادى الأولى سنة 10هـ إلى بني الحارث بن كعب بنجران وأمره أن يدعوهم ثلاثاً قبل القتال، فأسلموا ولم يقاتلوا، وأقام فيهم يعلمهم، وكتب إلى النبي بذلك فأمره النبي أن يقبل ويقبل معه وفدهم؛ فقدم بستة من رؤسائهم، فقال النبي حين رآهم: من هؤلاء القوم الذين كأنهم رجال الهند؟ وسألهم أربع مرات: أنتم الذين إذا زُجروا استقدموا، حتى أجاب يزيد بن عبد المدان، وقال لهم: لو لم يكتب خالد أنكم أسلمتم ولم تقاتلوا لألقيت رؤوسكم تحت أقدامكم؛ وأمّر عليهم قيس بن الحصين، ورجعوا في آخر شوال أو أول ذي القعدة، قبل وفاة النبي بأربعة أشهر."
  en: "In Rabi' al-Akhir or Jumada al-Ula 10 AH the Prophet sent Khalid ibn al-Walid to Banu al-Harith ibn Ka'b at Najran with orders to invite them to Islam for three days before fighting; they converted without fighting, Khalid stayed to teach them and wrote to the Prophet, who told him to come with their delegation. He brought six of their chiefs; the Prophet asked who these men were who looked like men of India, asked four times whether they were the ones who advance when rebuked until Yazid ibn Abd al-Madan answered, told them that but for Khalid's letter he would have thrown their heads beneath their feet, and appointed Qays ibn al-Husayn over them. They returned at the end of Shawwal or the start of Dhu al-Qa'da, four months before the Prophet's death."
