label: { ar: "الحملة الفرنسية على مصر وإعلان الجهاد", en: "The French Campaign on Egypt and the Proclamation of Jihad", es: "La campaña francesa sobre Egipto y la proclamación de la yihad.", fr: "La campagne française en Égypte et la proclamation du djihad", ur: "مصر پر فرانسیسی مہم اور جہاد کا اعلان", tr: "Fransa'nın Mısır'a karşı yürüttüğü sefer ve cihat ilanı", id: "Kampanye Prancis melawan Mesir dan deklarasi jihad." }
summary:
  ar: "كان الهجوم الفرنسي على مصر سنة ١٢١٣هـ/١٧٩٨م أول هجوم على ولاية عربية من ولايات الدولة العثمانية في التاريخ الحديث، وعلى الفور أعلن السلطان سليم الثالث الجهاد فاستجاب المسلمون في الحجاز والشام وشمال أفريقية. يقول الجبرتي في حوادث شعبان ١٢١٣هـ: لما وردت أخبار الفرنسيين إلى الحجاز وأنهم ملكوا الديار المصرية انزعج أهل الحجاز وضجّوا بالحرم، وصار الشيخ محمد الكيلاني يعظ الناس ويدعوهم إلى الجهاد فاتعظ جملة من الناس وبذلوا أموالهم وأنفسهم واجتمع نحو الستمائة من المجاهدين وركبوا البحر إلى القصير، وصمّموا على الظفر بإحدى الحسنيين: الاستشهاد أو الانتصار، وتكونت منهم ومن مسلمي الوجه القبلي وعرب الهوارة وأهالي النوبة وقوات مراد بك جبهة حربية في مواجهة القوات الفرنسية. وبعد احتلال القاهرة واصل نابليون احتلاله لبقية مدن مصر وغزة والرملة ويافا، وحاول احتلال عكا لكن يقظة أهلها بقيادة أحمد باشا الجزار حالت بينه وبين ما يشتهي {cite:dawlat-uthmaniyya-salabi p. 329-330}."
  en: "The French campaign in Egypt, 1798 — Selim III proclaimed jihad at once; al-Jabarti records the Hijaz rising, six hundred volunteers sailing to al-Qusayr under Muhammad al-Kilani resolved on martyrdom or victory, while Ahmad Pasha al-Jazzar's watchfulness at Acre checked Napoleon himself {cite:dawlat-uthmaniyya-salabi p. 329-330}."
  es: "La campaña francesa en Egipto, 1798: Selim III proclamó la yihad de inmediato; al-Jabarti registra el levantamiento del Hiyaz, seiscientos voluntarios que navegaron hacia al-Qusayr bajo el mando de Muhammad al-Kilani decididos al martirio o la victoria, mientras que la vigilancia de Ahmad Pasha al-Jazzar en Acre contuvo al propio Napoleón {cite:dawlat-uthmaniyya-salabi p. 329-330}."
  fr: "La campagne française en Égypte, 1798 — Selim III proclama immédiatement le jihad; al-Jabarti rapporte le soulèvement du Hedjaz, six cents volontaires naviguant vers al-Qusayr sous le commandement de Muhammad al-Kilani résolus au martyre ou à la victoire, tandis que la vigilance d'Ahmad Pacha al-Jazzar à Acre arrêta Napoléon lui-même {cite:dawlat-uthmaniyya-salabi p. 329-330}."
  ur: "مصر میں فرانسیسی مہم، 1798 - سیلم سوم نے ایک ہی وقت میں جہاد کا اعلان کیا۔ الجبارتی نے حجاز کے عروج کو ریکارڈ کیا، محمد الکلانی کی قیادت میں چھ سو رضاکاروں نے القصیر کی طرف سفر کرتے ہوئے شہادت یا فتح کا عزم کیا، جبکہ احمد پاشا الجزار کی ایکڑ میں چوکسی نے خود نپولین کو چیک کیا۔ 329-330}۔"
  tr: "Hicri 1213/Miladi 1798'de Fransızların Mısır'a saldırısı, modern tarihte Osmanlı İmparatorluğu'nun bir Arap eyaletine yapılan ilk saldırıydı. Sultan III. Selim derhal cihat ilan etti ve Hicaz, Levant ve Kuzey Afrika'daki Müslümanlar karşılık verdi. El-Cebârti, Hicri 1213 Şaban ayındaki olayları şöyle anlatır: \"Fransızların Mısır'ı ele geçirdiği haberi Hicaz'a ulaştığında, Hicaz halkı telaşa kapıldı ve Kutsal Mabet'te gürültü kopardı. Şeyh Muhammed el-Kilani halka vaaz vermeye ve onları cihada çağırmaya başladı. Birçok kişi onun çağrısına kulak verdi ve mallarını ve canlarını feda etti. Yaklaşık alt yüz mücahit toplandı ve iki şanlı sonuçtan birini elde etmeye kararlı bir şekilde el-Kusayr'a doğru yelken açtı: şehitlik veya zafer. Onlar, Yukarı Mısır'dan Müslümanlar, Havara Arapları, Nubiyalılar ve Murad Bey'in güçleriyle birlikte Fransız güçlerine karşı bir askeri cephe oluşturdular.\" Kahire'yi işgal ettikten sonra Napolyon, Mısır'ın geri kalan şehirleri olan Gazze, Ramla ve Yafa'yı işgal etmeye devam etti ve Akka'yı da işgal etmeye çalıştı; ancak Ahmed Paşa el-Cezzar önderliğindeki halkın uyanıklığı, onun arzuladığına ulaşmasını engelledi. {cite:dawlat-uthmaniyya-salabi s. 329-330}"
  id: "Serangan Prancis terhadap Mesir pada tahun 1213 H/1798 M merupakan serangan pertama terhadap provinsi Arab Kekaisaran Ottoman dalam sejarah modern. Sultan Selim III segera menyatakan jihad, dan umat Muslim di Hijaz, Levant, dan Afrika Utara menanggapi seruan tersebut. Al-Jabarti, dalam catatannya tentang peristiwa bulan Sya'ban 1213 H, menyatakan: \"Ketika berita sampai ke Hijaz bahwa Prancis telah merebut Mesir, penduduk Hijaz merasa khawatir dan membuat keributan di Masjidil Haram. Syekh Muhammad al-Kilani mulai berdakwah kepada orang-orang dan menyeru mereka untuk berjihad. Sejumlah orang mengindahkan seruannya dan mengorbankan harta benda dan nyawa mereka. Sekitar enam ratus mujahidin berkumpul dan berlayar ke al-Qusayr, bertekad untuk mencapai salah satu dari dua hasil yang mulia: mati syahid atau kemenangan. Mereka, bersama dengan umat Muslim dari Mesir Hulu, orang-orang Arab Hawara, orang-orang Nubia, dan pasukan Murad Bey, membentuk front militer melawan pasukan Prancis.\" Setelah menduduki Kairo, Napoleon melanjutkan pendudukan atas kota-kota Mesir lainnya, Gaza, Ramla, dan Jaffa, dan mencoba menduduki Acre, tetapi kewaspadaan penduduknya, yang dipimpin oleh Ahmed Pasha al-Jazzar, mencegahnya mencapai apa yang diinginkannya. {cite:dawlat-uthmaniyya-salabi p. 329-330}."
