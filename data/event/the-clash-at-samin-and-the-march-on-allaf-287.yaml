id: event/the-clash-at-samin-and-the-march-on-allaf-287
class: event
kind: other
label:
  ar: "اصطدام الحييين بالأكيليين في سمعين وزحف الهادي على علاف، 287هـ"
  en: "The Hayyiyun clash with the Akilis at Sam'in and al-Hadi's march on Allaf, 287 AH"
  ur: "سمعین میں حییوں کا اکیلیوں سے ٹکرانا اور ہادی کا علاف کی طرف بڑھنا، 287ھ"
summary:
  ar: "أبصر الحييون جماعة من الأكيليين على جبل يقال له سمعين فاقتتلوا ولم يعلم الهادي حتى سمع الصراخ فرجع، ثم خرج بعد أيام إلى فروة وقطع أعنابها وتقدم إلى علاف فصعد القوم الجبل فانصرف إلى صعدة."
  en: "The Hayyiyun saw a party of Akilis on a mountain called Sam'in and fought them without al-Hadi knowing until a cry brought him back; days later he went out to Furwa, cut its vines and advanced to Allaf, the enemy climbing the mountain, and returned to Sa'da."
  ur: "حییوں نے سمعین نامی پہاڑ پر اکیلیوں کی ایک جماعت دیکھی اور لڑ پڑے، ہادی کو اس وقت تک خبر نہ ہوئی جب تک چیخ نے انہیں واپس نہ بلایا؛ کچھ دن بعد وہ فروہ گئے، اس کی بیلیں کاٹیں اور علاف کی طرف بڑھے، دشمن پہاڑ پر چڑھ گیا، اور وہ صعدہ لوٹ گئے۔"
