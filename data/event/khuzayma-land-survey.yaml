id: event/khuzayma-land-survey
class: event
kind: law-enacted
label: { ar: "سنّ خزيمة بن خازم المساحة بدبيل والنشوى", en: "Khuzayma ibn Khazim Institutes the Land Survey at Dabil and Nashwa", es: "Khuzayma ibn Khazim instituye el estudio de la tierra en Dabil y Nashwa", fr: "Khuzayma ibn Khazim institue l'arpentage à Dabil et Nashwa", ur: "خزیمہ بن خزیم نے دبیل اور نشوہ میں زمینی سروے کا ادارہ کیا۔" }
summary:
  ar: "عند البلاذري: من ولاة أرمينية للعباسيين بالتتابع عثمان بن عمادة بن خرثم ثم روح بن حاتم المهلابي ثم خزيمة بن خازم ثم يزيد بن مزيد الشيباني ثم عبيد الله بن المهدي ثم الفضل بن يحيى ثم سعيد بن سالم ثم محمد بن يزيد بن مزيد؛ وكان خزيمة أشدهم ولاية وهو الذي سنّ المساحة بدبيل والنشوى ولم يكن قبل ذلك. ولم يزل بطارقة أرمينية مقيمين في بلادهم يحمي كل واحد منهم ناحيته فإذا قدم الثغر عامل من عماله داروه فإن رأوا منه عفّة وصرامة وكان في قوة وعدة أدّوا إليه الخراج وأذعنوا له بالطاعة وإلا اغتمزوا فيه واستخفّوا بأمره؛ وولّيهم خالد بن يزيد بن مزيد في خلافة المأمون فقبل هداياهم وخلطهم بنفسه فأفسدهم ذلك من فعله وجرّأهم على من بعده من عمال المأمون."
  en: "In al-Baladhuri: Armenia's Abbasid governors ran in succession — Uthman ibn Umada ibn Khurathim, then Rawh ibn Hatim al-Muhallabi, then Khuzayma ibn Khazim, then Yazid ibn Mazyad al-Shaybani, then Ubaydallah ibn al-Mahdi, then al-Fadl ibn Yahya, then Sa'id ibn Salm, then Muhammad ibn Yazid ibn Mazyad; Khuzayma was the sternest of them in office, and it was he who instituted the land-survey at Dabil and Nashwa, which had not existed before. The Armenian patrikioses ever stayed in their lands, each guarding his district: when a march-governor arrived they surrounded him — if they saw continence and sternness in him while he had force and equipment, they paid him the kharaj and yielded obedience, but otherwise despised him and made light of his command; and Khalid ibn Yazid ibn Mazyad governed them in al-Ma'mun's caliphate, accepting their gifts and mixing them with his own person — that deed corrupted them and emboldened them against al-Ma'mun's governors who came after."
  es: "En al-Baladhuri: los gobernadores abasíes de Armenia se presentaron sucesivamente: Uthman ibn Umada ibn Khurathim, luego Rawh ibn Hatim al-Muhallabi, luego Khuzayma ibn Khazim, luego Yazid ibn Mazyad al-Shaybani, luego Ubaydallah ibn al-Mahdi, luego al-Fadl ibn Yahya, luego Sa'id ibn Salm, luego Muhammad ibn Yazid ibn Mazyad; Juzayma fue el más severo de ellos en el cargo, y fue él quien instituyó el estudio de tierras en Dabil y Nashwa, que no había existido antes. Los patricios armenios permanecieron siempre en sus tierras, cada uno custodiando su distrito: cuando llegaba un gobernador de la frontera, lo rodeaban; si veían en él continencia y severidad mientras tenía fuerza y equipo, le pagaban el kharaj y le obedecían, pero de lo contrario lo despreciaban y restaban importancia a su mando; y Khalid ibn Yazid ibn Mazyad los gobernó en el califato de al-Ma'mun, aceptando sus regalos y mezclándolos con su propia persona; ese acto los corrompió y los envalentonó contra los gobernadores de al-Ma'mun que vinieron después."
  fr: "À al-Baladhuri: les gouverneurs abbassides d'Arménie se sont succédé: Uthman ibn Umada ibn Khurathim, puis Rawh ibn Hatim al-Muhallabi, puis Khuzayma ibn Khazim, puis Yazid ibn Mazyad al-Shaybani, puis Ubaydallah ibn al-Mahdi, puis al-Fadl ibn Yahya, puis Sa'id ibn Salm, puis Muhammad ibn Yazid. ibn Mazyad; Khuzayma était le plus sévère d'entre eux en fonction, et c'est lui qui a institué l'arpentage à Dabil et Nashwa, qui n'existait pas auparavant. Les patrikioses arméniens restèrent toujours sur leurs terres, chacun gardant son district: lorsqu’un gouverneur de marche arrivait, ils l’encerclaient; s’ils constataient chez lui de la continence et de la sévérité, et qu’il disposait de la force et de l’équipement, ils lui payaient le kharaj et lui obéissaient, mais sinon, ils le méprisaient et prenaient son commandement à la légère; et Khalid ibn Yazid ibn Mazyad les gouverna dans le califat d’al-Ma’mun, acceptant leurs présents et les mêlant à sa propre personne; cet acte les corrompit et les enhardit contre les gouverneurs d’al-Ma’mun qui lui succédèrent."
  ur: "البلادھوری میں: آرمینیا کے عباسی گورنر یکے بعد دیگرے دوڑتے رہے - عثمان بن عمادہ بن خرثیم، پھر راح ابن حاتم المحلبی، پھر خزیمہ بن خزیم، پھر یزید بن مازیاد الشیبانی، پھر عبیداللّٰہ، پھر عبیداللہ، پھر عبیداللہ۔ پھر سعید بن سلم، پھر محمد بن یزید ابن مازیاد۔ خزیمہ دفتر میں ان میں سب سے سخت تھا، اور اسی نے دبیل اور ناشوا میں زمینی سروے کا آغاز کیا، جو پہلے موجود نہیں تھا۔ آرمینیائی باشندے ہمیشہ اپنی سرزمین میں ٹھہرے رہتے تھے، ہر ایک اپنے ضلع کی حفاظت کرتا تھا: جب کوئی مارچ کرنے والا گورنر آیا تو انہوں نے اسے گھیر لیا - اگر انہوں نے اس میں صبر اور سختی دیکھی جب کہ اس کے پاس طاقت اور سازوسامان تھا، تو انہوں نے اسے خراج ادا کیا اور اطاعت کی، لیکن دوسری صورت میں اسے حقیر سمجھا اور اس کے حکم کو ہلکا کیا۔ اور خالد بن یزید ابن مازیاد نے المامون کی خلافت میں ان پر حکومت کی، ان کے تحائف کو قبول کیا اور انہیں اپنے ہی شخص کے ساتھ ملایا - اس عمل نے ان کو بگاڑ دیا اور ان کو مامون کے بعد آنے والے گورنروں کے خلاف حوصلہ دیا۔"
