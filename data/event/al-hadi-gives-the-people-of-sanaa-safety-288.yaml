id: event/al-hadi-gives-the-people-of-sanaa-safety-288
class: event
kind: other
label:
  ar: "الهادي يؤمّن أهل صنعاء بعد دخولها، سنة 288هـ"
  en: "Al-Hadi gives the people of Sana'a safety after entering the city, 288 AH"
  ur: "ہادی صنعاء میں داخل ہو کر اہلِ صنعاء کو امان دیتے ہیں، 288ھ"
summary:
  ar: "كان أهل صنعاء يخافون أن يعاقبهم الهادي على إخراج علي بن سليمان وحربهم له، فلما دخلها لم يكشف أحداً منهم على ما كان، وبسط لهم الأمان وكتب لهم كتاباً قُرئ في الأسواق فاطمأنوا."
  en: "The people of Sana'a feared that al-Hadi would punish them for driving out Ali ibn Sulayman and for fighting him, but on entering he exposed none of them for what had happened, spread safety over them and wrote them a letter that was read in the markets, and they were reassured."
  ur: "اہلِ صنعاء کو ڈر تھا کہ ہادی علی بن سلیمان کو نکالنے اور اس سے لڑنے پر انہیں سزا دیں گے، مگر شہر میں داخل ہو کر انہوں نے کسی کو اس کی سابقہ حرکت پر بے پردہ نہ کیا، انہیں امان دی اور ایک تحریر لکھی جو بازاروں میں پڑھی گئی تو لوگ مطمئن ہو گئے۔"
