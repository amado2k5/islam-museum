label:
  ar: "رحلة السمعاني الثالثة مع ابنه عبد الرحيم إلى ما وراء النهر، ٥٤٩-٥٥٢هـ/١١٥٤-١١٥٧م"
  en: "Al-Sam'ani's third journey with his son 'Abd al-Rahim to Transoxiana, 549-552/1154-1157"
  ur: "سمعانی کا تیسرا سفر بیٹے عبدالرحیم کے ساتھ ماوراء النہر، 549-552ھ/1154-1157ء"
  es: "Tercer viaje de Al-Sam'ani con su hijo 'Abd al-Rahim a Transoxiana, 549-552/1154-1157"
  fr: "Troisième voyage d'Al-Sam'ani avec son fils 'Abd al-Rahim en Transoxiane, 549-552/1154-1157"
  tr: "El-Sam'ani'nin oğlu Abdül-Rahim ile birlikte Transoksanya'ya yaptığı üçüncü yolculuk, Hicri 549-552 / Miladi 1154-1157."
  id: "Perjalanan ketiga Al-Sam'ani bersama putranya Abd al-Rahim ke Transoxiana, 549-552 H/1154-1157 M"
summary:
  ar: "رحل السمعاني بابنه عبد الرحيم إلى نيسابور ونواحيها وهراة ونواحيها وبلخ وسمرقند وبخارى، وصنّف له معجماً، ثم عاد به إلى مرو {cite:tarikh-islam-dhahabi pp. 120-121}؛ وهي رحلته الثالثة الكبرى ٥٤٩-٥٥٢هـ/١١٥٤-١١٥٧م {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}؛ وخرّج له أبوه معجماً في ثمانية عشر جزءاً {cite:shadharat-dhahab p. 75}."
  en: "Al-Sam'ani travelled with his son 'Abd al-Rahim to Nishapur and its region, Herat and its region, Balkh, Samarqand and Bukhara, and compiled a mu'jam for him before bringing him back to Marw {cite:tarikh-islam-dhahabi pp. 120-121}. This was his third great journey, 549-552/1154-1157 {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}; the mu'jam he drew up for the boy ran to eighteen parts {cite:shadharat-dhahab p. 75}."
  ur: "سمعانی اپنے بیٹے عبدالرحیم کے ساتھ نیشاپور اور اس کے نواح، ہرات اور اس کے نواح، بلخ، سمرقند اور بخارا گئے اور اس کے لیے ایک معجم مرتب کیا، پھر اسے مرو واپس لائے {cite:tarikh-islam-dhahabi pp. 120-121}۔ یہ ان کا تیسرا بڑا سفر تھا، 549-552ھ/1154-1157ء {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}؛ بیٹے کے لیے مرتب کردہ معجم اٹھارہ اجزاء پر مشتمل تھا {cite:shadharat-dhahab p. 75}۔"
  es: "Al-Sam'ani viajó con su hijo 'Abd al-Rahim a Nishapur y su región, Herat y su región, Balkh, Samarcanda y Bujará, y compiló un mu'jam para él antes de traerlo de regreso a Marw {cite:tarikh-islam-dhahabi pp. 120-121}. Este fue su tercer gran viaje, 549-552/1154-1157 {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}; el mu'jam que redactó para el niño constaba de dieciocho partes {cite:shadharat-dhahab p. 75}."
  fr: "Al-Sam'ani voyagea avec son fils 'Abd al-Rahim à Nishapur et ses environs, à Hérat et ses environs, à Balkh, à Samarcande et à Boukhara, et rédigea un mu'jam pour lui avant de le ramener à Marw (voir: Tarikh Islam Dhahabi, p. 120-121). Ce fut son troisième grand voyage, entre 549 et 552/1154-1157 (voir: Encyclopaedia of Islam, vol. 8, p. 1024); le mu'jam qu'il rédigea pour le jeune garçon était divisé en dix-huit parties (voir: Hadharat Dhahab, p. 75)."
  tr: "El-Sam'ani, oğlu Abdülrahim ile birlikte Nişapur ve çevresine, Herat ve çevresine, Belh'e, Semerkant'a ve Buhara'ya seyahat etti ve onun için bir sözlük derledi, ardından onunla birlikte Merv'e döndü {kaynak:tarikh-islam-dhahabi s. 120-121}; bu onun üçüncü büyük yolculuğuydu, 549-552 Hicri/1154-1157 Miladi {kaynak:encyclopaedia-of-islam-2 cilt 8 s. 1024}; ve babası onun için on sekiz bölümden oluşan bir sözlük derledi {kaynak:shadharat-dhahab s. 75}."
  id: "Al-Sam'ani melakukan perjalanan bersama putranya Abd al-Rahim ke Nishapur dan sekitarnya, Herat dan sekitarnya, Balkh, Samarkand dan Bukhara, dan menyusun kamus untuknya, kemudian kembali bersamanya ke Merv {cite:tarikh-islam-dhahabi hlm. 120-121}; ini adalah perjalanan besar ketiganya, 549-552 H/1154-1157 M {cite:encyclopaedia-of-islam-2 vol. 8 hlm. 1024}; dan ayahnya menyusun kamus untuknya dalam delapan belas bagian {cite:shadharat-dhahab hlm. 75}."
