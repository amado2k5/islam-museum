id: event/samani-third-rihla-549
class: event
kind: other
label:
  ar: "رحلة السمعاني الثالثة مع ابنه عبد الرحيم إلى ما وراء النهر، ٥٤٩-٥٥٢هـ/١١٥٤-١١٥٧م"
  en: "Al-Sam'ani's third journey with his son 'Abd al-Rahim to Transoxiana, 549-552/1154-1157"
  ur: "سمعانی کا تیسرا سفر بیٹے عبدالرحیم کے ساتھ ماوراء النہر، 549-552ھ/1154-1157ء"
summary:
  ar: "رحل السمعاني بابنه عبد الرحيم إلى نيسابور ونواحيها وهراة ونواحيها وبلخ وسمرقند وبخارى، وصنّف له معجماً، ثم عاد به إلى مرو {cite:tarikh-islam-dhahabi pp. 120-121}؛ وهي رحلته الثالثة الكبرى ٥٤٩-٥٥٢هـ/١١٥٤-١١٥٧م {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}؛ وخرّج له أبوه معجماً في ثمانية عشر جزءاً {cite:shadharat-dhahab p. 75}."
  en: "Al-Sam'ani travelled with his son 'Abd al-Rahim to Nishapur and its region, Herat and its region, Balkh, Samarqand and Bukhara, and compiled a mu'jam for him before bringing him back to Marw {cite:tarikh-islam-dhahabi pp. 120-121}. This was his third great journey, 549-552/1154-1157 {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}; the mu'jam he drew up for the boy ran to eighteen parts {cite:shadharat-dhahab p. 75}."
  ur: "سمعانی اپنے بیٹے عبدالرحیم کے ساتھ نیشاپور اور اس کے نواح، ہرات اور اس کے نواح، بلخ، سمرقند اور بخارا گئے اور اس کے لیے ایک معجم مرتب کیا، پھر اسے مرو واپس لائے {cite:tarikh-islam-dhahabi pp. 120-121}۔ یہ ان کا تیسرا بڑا سفر تھا، 549-552ھ/1154-1157ء {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}؛ بیٹے کے لیے مرتب کردہ معجم اٹھارہ اجزاء پر مشتمل تھا {cite:shadharat-dhahab p. 75}۔"
