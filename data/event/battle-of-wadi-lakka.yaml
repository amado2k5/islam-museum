class: event
kind: battle
label: { ar: "وقعة وادي لكة", en: "Battle of Wadi Lakka", fr: "La bataille de Wadi Lakka", es: "Batalla de Wadi Lakka", ur: "وادی لکہ کی جنگ" }
summary:
  ar: "بين طارق بن زياد ولذريق ملك القوط، على نهر لكة من أعمال شذونة، في الليالي الأخيرة من رمضان سنة 92هـ. استمرت الحرب ثمانية أيام استشهد فيها ثلاثة آلاف من المسلمين، ثم انهزم القوط، وقيل إن لذريق غرق {cite:salabi-umayyad-state-2020 p.69}. ويذكر الكتاب أن طارقاً اختار ميدان القتال بعناية، فأسند ميمنته إلى البحيرة وميسرته إلى الوادي، وجعل مؤخرته في جبال رتينا {cite:salabi-umayyad-state-2020 p.69}."
  en: "The battle between Tariq ibn Ziyad and Ludhariq, king of the Goths, on the river Lakka in the districts of Shadhuna, took place in the last nights of Ramadan of 92 AH. The fighting lasted eight days, in which three thousand Muslims were martyred; then the Goths were routed, and it is said that Ludhariq drowned {cite:salabi-umayyad-state-2020 p.69}. The book notes that Tariq chose the field with care: he set his right wing against the lake, his left against the wadi, and his rear in the mountains of Ratina {cite:salabi-umayyad-state-2020 p.69}."
  fr: "La bataille entre Tariq ibn Ziyad et Ludhariq, roi des Goths, sur le fleuve Lakka, dans les districts de Shadhuna, eut lieu dans les dernières nuits de Ramadan 92 H. Le combat dura huit jours, pendant lesquels trois mille musulmans tombèrent en martyrs ; puis les Goths furent mis en déroute, et l'on dit que Ludhariq se noya {cite:salabi-umayyad-state-2020 p.69}. Le livre note que Tariq choisit le terrain avec soin : il appuya son aile droite au lac, sa gauche à l'oued, et ses arrières aux montagnes de Ratina {cite:salabi-umayyad-state-2020 p.69}."
  es: "La batalla entre Tariq ibn Ziyad y Ludhariq, rey de los godos, a orillas del río Lakka, en la región de Shadhuna, tuvo lugar durante las últimas noches del Ramadán del año 92 de la Hégira. La contienda duró ocho días, durante los cuales tres mil musulmanes fueron martirizados; finalmente, los godos fueron derrotados y se dice que Ludhariq se ahogó {cite:salabi-umayyad-state-2020 p.69}. El libro señala que Tariq eligió el campo de batalla con cuidado: colocó su flanco derecho contra el lago, su flanco izquierdo contra el valle y su retaguardia en las montañas de Ratina {cite:salabi-umayyad-state-2020 p.69}."
  ur: "طارق ابن زیاد اور گوٹھوں کے بادشاہ لدھیرک کے درمیان شدھونہ کے اضلاع میں دریائے لکہ پر معرکہ رمضان 92 ہجری کی آخری راتوں میں ہوا۔ یہ لڑائی آٹھ دن تک جاری رہی جس میں تین ہزار مسلمان شہید ہوئے۔ پھر گوٹھوں کو شکست دی گئی، اور کہا جاتا ہے کہ لدھیرک ڈوب گیا {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 69}۔ کتاب نوٹ کرتی ہے کہ طارق نے میدان کا انتخاب احتیاط کے ساتھ کیا: اس نے اپنا دایاں بازو جھیل کے خلاف، اپنا بایاں بازو وادی کے خلاف، اور اپنا عقب رتینہ کے پہاڑوں میں رکھا۔"
