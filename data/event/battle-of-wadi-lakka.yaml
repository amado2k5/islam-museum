label: { ar: "وقعة وادي لكة", en: "Battle of Wadi Lakka" }
summary:
  ar: "بين طارق بن زياد ولذريق ملك القوط، على نهر لكة من أعمال شذونة، في الليالي الأخيرة من رمضان سنة 92هـ. استمرت الحرب ثمانية أيام استشهد فيها ثلاثة آلاف من المسلمين، ثم انهزم القوط، وقيل إن لذريق غرق {cite:salabi-umayyad-state-2020 p.69}. ويذكر الكتاب أن طارقاً اختار ميدان القتال بعناية، فأسند ميمنته إلى البحيرة وميسرته إلى الوادي، وجعل مؤخرته في جبال رتينا {cite:salabi-umayyad-state-2020 p.69}."
  en: "The battle between Tariq ibn Ziyad and Ludhariq, king of the Goths, on the river Lakka in the districts of Shadhuna, took place in the last nights of Ramadan of 92 AH. The fighting lasted eight days, in which three thousand Muslims were martyred; then the Goths were routed, and it is said that Ludhariq drowned {cite:salabi-umayyad-state-2020 p.69}. The book notes that Tariq chose the field with care: he set his right wing against the lake, his left against the wadi, and his rear in the mountains of Ratina {cite:salabi-umayyad-state-2020 p.69}."
