label:
  ar: "الكتاب إلى بني الحارث: الإيذان بالحرب ومثل البعوضة والنخلة، ص277-278"
  en: "Al-Hadi's letter to Banu al-Harith: the notice of war and the gnat and the palm, pp. 277-278"
  ur: "بنو حارث کے نام ہادی کا خط: اعلانِ جنگ اور مچھر اور کھجور کی مثال، ص277-278"
summary:
  ar: "يأمر الكتاب بني الحارث بالأهبة ويقول إنهم نُبذ إليهم عهدهم ونُقض أمانهم، ويضرب مثل البعوضة التي وقعت على النخلة، ويذكر جيوشه وخيله وأمواله وطاعة اليمن إلا أقله، ويختم بالتوكل على الله."
  en: "The letter tells Banu al-Harith to make ready, says their covenant is cast aside and their safety broken, gives the parable of the gnat that lit on the palm, speaks of his armies, horses, money and the obedience of most of Yemen, and ends in trust in God."
  ur: "خط بنو حارث کو تیاری کا کہتا ہے، ان کا عہد توڑا اور امان ختم بتاتا ہے، کھجور پر بیٹھے مچھر کی مثال دیتا ہے، اپنے لشکروں، گھوڑوں، مال اور یمن کے اکثر حصے کی اطاعت کا ذکر کرتا ہے اور اللہ پر توکل پر ختم ہوتا ہے۔"
