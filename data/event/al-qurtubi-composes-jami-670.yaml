id: event/al-qurtubi-composes-jami-670
class: event
kind: other
label:
  ar: "القرطبي يصنف «الجامع لأحكام القرآن» وكتبه، حوالي ٦٧٠هـ"
  en: "Al-Qurtubi composes al-Jami' li-Ahkam al-Qur'an and his other books, c. 670/1272"
  ur: "قرطبی کی تصنیف «الجامع لاحکام القرآن» اور دیگر کتابیں، تقریباً 670ھ/1272ء"
summary:
  ar: "جمع القرطبي في تفسير القرآن كتابًا في خمسة عشر مجلدًا، وشرح أسماء الله الحسنى في مجلدين، وله «التذكرة في أمور الآخرة» وشرح التقصي وتآليف أخرى مفيدة {cite:nafh-tib-maqqari 2/210-211}؛ وقال الذهبي إن تفسيره العظيم الشأن سارت به الركبان {cite:nafh-tib-maqqari 2/211}. ويمتاز التفسير بكثرة الأحاديث والعناية باستنباط الأحكام وبيان المعنى، مع تقليل الإسرائيليات {cite:encyclopaedia-of-islam-2 vol. 5 p. 551}."
  en: "Al-Qurtubi assembled his Qur'an commentary in fifteen volumes, explained the Most Beautiful Names of God in two (al-Asna), and wrote al-Tadhkira on the matters of the hereafter, a commentary on al-Taqassi and other useful works {cite:nafh-tib-maqqari 2/210-211}. Al-Dhahabi said caravans carry his great commentary {cite:nafh-tib-maqqari 2/211}. The tafsir stands out for its wealth of hadiths, its attention to deriving rulings and clarifying the Law's meaning, and its sparing use of isra'iliyyat {cite:encyclopaedia-of-islam-2 vol. 5 p. 551}."
  ur: "قرطبی نے قرآن کی تفسیر پندرہ جلدوں میں جمع کی، اسمائے حسنیٰ کی شرح دو جلدوں میں (الأسنیٰ) لکھی، اور «التذکرۃ فی امور الآخرۃ»، شرح التقصی اور دیگر مفید تصانیف چھوڑیں {cite:nafh-tib-maqqari 2/210-211}۔ ذہبی کہتے ہیں کہ اس کی عظیم تفسیر قافلے اٹھا کر لے جاتے ہیں {cite:nafh-tib-maqqari 2/211}۔ تفسیر اپنی کثرتِ احادیث، احکام کے استنباط اور معانی کی وضاحت، اور اسرائیلیات کے محدود استعمال کے سبب ممتاز ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 551}۔"
