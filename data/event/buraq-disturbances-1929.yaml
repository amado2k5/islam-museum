label:
  ar: اضطرابات حائط البراق (1929)
  en: Buraq Wall disturbances (1929)
  fr: "Les troubles du mur d'al-Buraq (1929)"
  es: "Disturbios en el muro de Buraq (1929)"
  ur: "براق وال ڈسٹربنس (1929)"
  tr: "Batı Duvarı ayaklanmaları (1929)"
  id: "Kerusuhan Tembok Barat (1929)"
summary:
  ar: "اضطرابات في فلسطين في آب 1929م حول حائط البراق، عُرفت عند العرب بثورة البراق، فعيّنت حكومة الانتداب لجنة تحقيق، ثم طلبت الحكومة البريطانية من عصبة الأمم تشكيل لجنة دولية {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 65}{cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 67}."
  en: "Disturbances in Palestine in August 1929 over the Buraq Wall, known in Arab usage as the Buraq revolt; the Mandate government set up an inquiry, and the British government then asked the League of Nations for an international commission. Source: Imara's book, one source only."
  fr: "Troubles survenus en Palestine en août 1929 au sujet du mur d'al-Buraq, connus dans l'usage arabe sous le nom de révolte d'al-Buraq ; le gouvernement mandataire institua une enquête, puis le gouvernement britannique demanda à la Société des Nations une commission internationale. Source : le livre d'Imara, source unique."
  es: "Disturbios en Palestina en agosto de 1929 por el muro de Buraq, conocidos en el idioma árabe como la revuelta de Buraq; el gobierno del Mandato estableció una investigación, y el gobierno británico solicitó entonces a la Sociedad de Naciones una comisión internacional. Fuente: Libro de Imara, única fuente."
  ur: "براق دیوار پر اگست 1929 میں فلسطین میں ہنگامہ آرائی، جسے عربوں میں براق بغاوت کے نام سے جانا جاتا ہے۔ مینڈیٹ حکومت نے ایک انکوائری قائم کی، اور پھر برطانوی حکومت نے لیگ آف نیشنز سے ایک بین الاقوامی کمیشن طلب کیا۔ ماخذ: امارہ کی کتاب، صرف ایک ماخذ۔"
  tr: "Ağustos 1929'da Filistin'de Batı Duvarı çevresinde meydana gelen ve Araplar tarafından Burak Ayaklanması olarak bilinen karışıklıklar, Manda hükümetini bir soruşturma komisyonu atamaya sevk etti ve ardından İngiliz hükümeti Milletler Cemiyeti'nden uluslararası bir komisyon kurmasını istedi. {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar s. 65}{cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar s. 67}."
  id: "Kerusuhan di Palestina pada bulan Agustus 1929 M di sekitar Tembok Barat, yang dikenal oleh orang Arab sebagai Pemberontakan Buraq, mendorong pemerintah Mandat untuk menunjuk sebuah komisi penyelidikan, dan kemudian pemerintah Inggris meminta Liga Bangsa-Bangsa untuk membentuk komisi internasional {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 65}{cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 67}."
