date:
  start: { edtf: "0615~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 506}." }
summary:
  ar: "لما قتلت الأوس الغلمان الثلاثة رهن الديات جمعت الخزرج وحشدت والتقت بالأوس بالحدائق، وعلى الخزرج عبد الله بن أبي بن سلول وعلى الأوس أبو قيس بن الأسلت، فاقتتلوا قتالًا شديدًا حتى كاد بعضهم يفني بعضًا، وسمي يوم الفجار لغدرهم بالغلمان وهو الفجار الأول، وكان قيس بن الخطيم في حائط له فانصرف فوجد قومه قد برزوا فلم يقدر على سلاحه إلا السيف فخرج به وأبلى وجُرح جراحة شديدة عُظّم مقامه بها {cite:kamil-ibn-al-athir p. 506}."
  en: "The Khazraj mustered over the three murdered hostages and met the Aws at the gardens — ʿAbdallāh ibn Ubayy leading them against Abū Qays ibn al-Aslat — in a fight so savage they nearly destroyed one another. Named «the Fijār» for the betrayal of the lads, it was the first of that name. Qays ibn al-Khaṭīm, come late with only his sword, fought so well despite grave wounds that his standing was made {cite:kamil-ibn-al-athir p. 506}."
  es: "Los Khazraj reunieron a los tres rehenes asesinados y se enfrentaron a los Aws en los jardines —con ʿAbdallāh ibn Ubayy al frente contra Abū Qays ibn al-Aslat— en una lucha tan encarnizada que casi se aniquilaron mutuamente. Llamada «Fijār» por la traición a los jóvenes, fue la primera con ese nombre. Qays ibn al-Khaṭīm, que llegó tarde con solo su espada, luchó tan bien a pesar de sus graves heridas que su posición se consolidó {cite:kamil-ibn-al-athir p. 506}."
  fr: "Les Khazraj rassemblèrent les trois otages assassinés et affrontèrent les Aws dans les jardins. ʿAbdallāh ibn Ubayy les mena contre Abū Qays ibn al-Aslat. Le combat fut si féroce qu'ils faillirent s'entretuer. Surnommé « le Fijār » en raison de la trahison des jeunes hommes, ce fut le premier du genre. Qays ibn al-Khaṭīm, arrivé tardivement armé de sa seule épée, se battit avec une telle bravoure malgré ses graves blessures que sa réputation fut établie (voir: Kamil ibn al-Athir, p. 506)."
  ur: "خزرج نے تینوں قتل شدہ یرغمالیوں کو اکٹھا کیا اور باغوں میں اوس سے ملاقات کی - عبداللہ ابن ابی ابو قیس بن الاصلت کے خلاف ان کی رہنمائی کر رہے تھے - ایک لڑائی میں اس طرح وحشیانہ طور پر انہوں نے ایک دوسرے کو تقریبا تباہ کردیا۔ لڑکوں کی دھوکہ دہی کے لیے \"فجر\" کا نام دیا گیا، یہ اس نام کا پہلا تھا۔ قیس بن الخطیم، اپنی تلوار لے کر دیر سے آیا، شدید زخموں کے باوجود اس قدر لڑا کہ اس کا کھڑا ہونا ثابت ہو گیا۔ 506}۔"
  tr: "Evsler, kan parası karşılığında üç çocuğu rehin olarak öldürünce, Hazrecler toplanıp bahçelerde Evslerle karşılaştılar. Hazreclerin başında Abdullah bin Abi bin Salul, Evslerin başında ise Ebu Kays bin Al-Aslat vardı. Birbirlerini neredeyse yok edecek kadar şiddetli bir savaş verdiler. Çocuklara karşı yaptıkları ihanet nedeniyle bu güne \"Kötülerin Günü\" adı verildi ve bu, ilk kötü gün olarak kabul edilir. Kays bin Al-Hatim bahçesindeydi ve döndüğünde halkının dışarı çıktığını gördü. Kılıcından başka silahı olmadığı için onunla dışarı çıktı ve cesurca savaştı, ağır yaralandı ve bu da onun statüsünü büyük ölçüde yükseltti. {Kaynak: Kamil İbn Al-Athir, s. 506}"
  id: "Ketika kaum Aws membunuh ketiga anak laki-laki itu sebagai jaminan uang darah, kaum Khazraj berkumpul dan bertemu dengan kaum Aws di kebun. Abdullah bin Abi bin Salul memimpin kaum Khazraj dan Abu Qais bin Al-Aslat memimpin kaum Aws. Mereka bertempur sengit hingga sebagian dari mereka hampir saling memusnahkan. Peristiwa itu disebut Hari Orang Jahat karena pengkhianatan mereka terhadap anak-anak laki-laki itu, dan itu adalah Hari Orang Jahat yang pertama. Qais bin Al-Khatim berada di kebunnya dan kembali mendapati kaumnya telah keluar. Ia tidak dapat menemukan senjatanya kecuali pedang, jadi ia keluar dengan pedang itu dan bertempur dengan gagah berani dan terluka parah, yang sangat meningkatkan kedudukannya. {cite:kamil-ibn-al-athir p. 506}."
