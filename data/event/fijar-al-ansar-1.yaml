summary:
  ar: "لما قتلت الأوس الغلمان الثلاثة رهن الديات جمعت الخزرج وحشدت والتقت بالأوس بالحدائق، وعلى الخزرج عبد الله بن أبي بن سلول وعلى الأوس أبو قيس بن الأسلت، فاقتتلوا قتالًا شديدًا حتى كاد بعضهم يفني بعضًا، وسمي يوم الفجار لغدرهم بالغلمان وهو الفجار الأول، وكان قيس بن الخطيم في حائط له فانصرف فوجد قومه قد برزوا فلم يقدر على سلاحه إلا السيف فخرج به وأبلى وجُرح جراحة شديدة عُظّم مقامه بها {cite:kamil-ibn-al-athir p. 506}."
  en: "The Khazraj mustered over the three murdered hostages and met the Aws at the gardens — ʿAbdallāh ibn Ubayy leading them against Abū Qays ibn al-Aslat — in a fight so savage they nearly destroyed one another. Named «the Fijār» for the betrayal of the lads, it was the first of that name. Qays ibn al-Khaṭīm, come late with only his sword, fought so well despite grave wounds that his standing was made {cite:kamil-ibn-al-athir p. 506}."
