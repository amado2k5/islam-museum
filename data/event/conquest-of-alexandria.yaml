label: { ar: "فتح الإسكندرية", en: "The Conquest of Alexandria" }
summary:
  ar: "عند البلاذري بإسناد ابن لهيعة عن يزيد بن أبي حبيب: صالح الموقس عمرو بن العاص على أن يسير من الروم من أراد ويُقرّ من أراد الإقامة على أمر سمّاه وأن يُفرض على القبط ديناران، فبلغ ذلك ملك الروم فتسخّطه وبعث الجيوش فأغلقوا باب الإسكندرية وآذنوا عمراً بالحرب، فخرج إليه الموقس فقال أسألك ثلاثاً: أن لا تبذل للروم مثل الذي بذلت لي فإنهم قد استغشّوني، وأن لا تنقض بالقبط فإن النقض لم يأت من قبلهم، وإن متّ فمر بدفني في كنيسة بالإسكندرية ذكرها، فقال عمرو هذه لك. وفتح عمرو الإسكندرية عنوةً وكتب بذلك إلى عمر بن الخطاب: «أما بعد فإن الله قد فتح علينا الإسكندرية عنوة قسراً بغير عهد ولا عقد» — وهي كلها صلح في قول يزيد بن أبي حبيب. وفي خبر الفتح الآخر: سار عمرو إليها في سنة إحدى وعشرين واستخلف على مصر خارجة بن حذافة، وكان من دون الإسكندرية من الروم والقبط قد تجمّعوا له وقالوا نغزوه بالفسطاط قبل أن يبلغنا فلقيهم بالكريون فهزمهم وقتل منهم مقتلة عظيمة وكان فيهم من أهل سخا وياهيت والخيس وسلطيس قوم رفدوهم وأعانوهم؛ فوجد أهلها معدّين لقتاله إلا أن القبط يحبّون الموادعة فأرسل إليه الموقس يسأله الصلح والمهادنة إلى مدة فأبى عمرو فأمر الموقس النساء أن يقمن على سور المدينة مقبلات بوجوههن إلى داخله وأقام الرجال في السلاح مقبلين بوجوههم إلى المسلمين ليرهبهم بذلك فأرسل إليه عمرو إنا قد رأينا ما صنعت وما بالكثرة غلبنا من غلبنا قد لقينا هرقل ملككم فكان من أمره ما كان، فقال الموقس لأصحابه قد صدق هؤلاء القوم أخرجوا ملكنا من دار مملكته حتى أدخلوه القسطنطينية فنحن أولى بالإذعان فأغلظوا له القول وأبوا إلا الهاربة فقاتلهم المسلمون قتالاً شديداً وحصروهم ثلاثة أشهر ثم إن عمرواً فتحها بالسيف وغنم ما فيها واستبقى أهلها ولم يقتل ولم يسبِ وجعلهم ذمة كأهل اليونة وكتب إلى عمر بالفتح مع معاوية بن حديج الكندي ثم السكوني وبعث إليه معه بالخمس؛ ويُقال صالحه الموقس على ثلاثة عشر ألف دينار وعلى خروج من أراد وإقامة من أحب وعلى دينارين لكل حالم من القبط، واستخلف عمرو على الإسكندرية عبد الله بن حذافة في رابطة من المسلمين وانصرف إلى الفسطاط. وفي سكنى الرباط: كان الرجل يأتي المنزل الذي كان ينزله فيجد صاحبه قد نزله فقال عمرو إني أخاف أن تُخرب المنازل إذا كنتم تتعاودونها فلما صاروا عند الكريون قال سيروا على بركة الله فمن ركز منكم رمحاً في دار فهي له ولبني أبيه فكانت الدار بين النفسين والثلاثة وكان يزيد بن أبي حبيب يقول لا يحل لأحد شيء من كرائها ولا تباع ولا تورث إنما كانت لهم سكنى أيام رباطهم."
  en: "In al-Baladhuri on Ibn Lahia's chain from Yazid ibn Abi Habib: the Muqawqis compounded with Amr ibn al-As — that those Romans who wished might depart, those wishing to stay remain on a stated footing, and two dinars be laid on the Copts; when word reached the king of the Romans he grew most wroth, sent hosts who shut Alexandria's gate and declared war on Amr, whereupon the Muqawqis came out to him saying 'I ask three things of you: offer the Romans nothing like what you offered me, for they have deceived me; do not break with the Copts, for the breach came not from them; and if I die, have me buried in a church in Alexandria that he named' — and Amr answered 'it is yours'. Amr then took Alexandria by force, writing to Umar ibn al-Khattab: 'To proceed — God has opened Alexandria to us by force, violently, with neither covenant nor contract' — though in Yazid ibn Abi Habib's reading it was all treaty."
