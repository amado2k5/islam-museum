label: { ar: "فتح الإسكندرية", en: "The Conquest of Alexandria", es: "La conquista de Alejandría", fr: "La conquête d'Alexandrie", ur: "اسکندریہ کی فتح", tr: "İskenderiye'nin Fethi", id: "Penaklukan Alexandria" }
summary:
  ar: "عند البلاذري بإسناد ابن لهيعة عن يزيد بن أبي حبيب: صالح الموقس عمرو بن العاص على أن يسير من الروم من أراد ويُقرّ من أراد الإقامة على أمر سمّاه وأن يُفرض على القبط ديناران، فبلغ ذلك ملك الروم فتسخّطه وبعث الجيوش فأغلقوا باب الإسكندرية وآذنوا عمراً بالحرب، فخرج إليه الموقس فقال أسألك ثلاثاً: أن لا تبذل للروم مثل الذي بذلت لي فإنهم قد استغشّوني، وأن لا تنقض بالقبط فإن النقض لم يأت من قبلهم، وإن متّ فمر بدفني في كنيسة بالإسكندرية ذكرها، فقال عمرو هذه لك. وفتح عمرو الإسكندرية عنوةً وكتب بذلك إلى عمر بن الخطاب: «أما بعد فإن الله قد فتح علينا الإسكندرية عنوة قسراً بغير عهد ولا عقد» — وهي كلها صلح في قول يزيد بن أبي حبيب. وفي خبر الفتح الآخر: سار عمرو إليها في سنة إحدى وعشرين واستخلف على مصر خارجة بن حذافة، وكان من دون الإسكندرية من الروم والقبط قد تجمّعوا له وقالوا نغزوه بالفسطاط قبل أن يبلغنا فلقيهم بالكريون فهزمهم وقتل منهم مقتلة عظيمة وكان فيهم من أهل سخا وياهيت والخيس وسلطيس قوم رفدوهم وأعانوهم؛ فوجد أهلها معدّين لقتاله إلا أن القبط يحبّون الموادعة فأرسل إليه الموقس يسأله الصلح والمهادنة إلى مدة فأبى عمرو فأمر الموقس النساء أن يقمن على سور المدينة مقبلات بوجوههن إلى داخله وأقام الرجال في السلاح مقبلين بوجوههم إلى المسلمين ليرهبهم بذلك فأرسل إليه عمرو إنا قد رأينا ما صنعت وما بالكثرة غلبنا من غلبنا قد لقينا هرقل ملككم فكان من أمره ما كان، فقال الموقس لأصحابه قد صدق هؤلاء القوم أخرجوا ملكنا من دار مملكته حتى أدخلوه القسطنطينية فنحن أولى بالإذعان فأغلظوا له القول وأبوا إلا الهاربة فقاتلهم المسلمون قتالاً شديداً وحصروهم ثلاثة أشهر ثم إن عمرواً فتحها بالسيف وغنم ما فيها واستبقى أهلها ولم يقتل ولم يسبِ وجعلهم ذمة كأهل اليونة وكتب إلى عمر بالفتح مع معاوية بن حديج الكندي ثم السكوني وبعث إليه معه بالخمس؛ ويُقال صالحه الموقس على ثلاثة عشر ألف دينار وعلى خروج من أراد وإقامة من أحب وعلى دينارين لكل حالم من القبط، واستخلف عمرو على الإسكندرية عبد الله بن حذافة في رابطة من المسلمين وانصرف إلى الفسطاط. وفي سكنى الرباط: كان الرجل يأتي المنزل الذي كان ينزله فيجد صاحبه قد نزله فقال عمرو إني أخاف أن تُخرب المنازل إذا كنتم تتعاودونها فلما صاروا عند الكريون قال سيروا على بركة الله فمن ركز منكم رمحاً في دار فهي له ولبني أبيه فكانت الدار بين النفسين والثلاثة وكان يزيد بن أبي حبيب يقول لا يحل لأحد شيء من كرائها ولا تباع ولا تورث إنما كانت لهم سكنى أيام رباطهم."
  en: "In al-Baladhuri on Ibn Lahia's chain from Yazid ibn Abi Habib: the Muqawqis compounded with Amr ibn al-As — that those Romans who wished might depart, those wishing to stay remain on a stated footing, and two dinars be laid on the Copts; when word reached the king of the Romans he grew most wroth, sent hosts who shut Alexandria's gate and declared war on Amr, whereupon the Muqawqis came out to him saying 'I ask three things of you: offer the Romans nothing like what you offered me, for they have deceived me; do not break with the Copts, for the breach came not from them; and if I die, have me buried in a church in Alexandria that he named' — and Amr answered 'it is yours'. Amr then took Alexandria by force, writing to Umar ibn al-Khattab: 'To proceed — God has opened Alexandria to us by force, violently, with neither covenant nor contract' — though in Yazid ibn Abi Habib's reading it was all treaty."
  es: "En al-Baladhuri, en la cadena de transmisión de Ibn Lahia, de Yazid ibn Abi Habib: los Muqawqis llegaron a un acuerdo con Amr ibn al-As: aquellos romanos que lo desearan podrían marcharse, aquellos que desearan quedarse permanecerían en un estado de acuerdo, y se impusieron dos dinares a los coptos; cuando la noticia llegó al rey de los romanos, este se enfureció enormemente, envió ejércitos que cerraron la puerta de Alejandría y declararon la guerra a Amr, tras lo cual los Muqawqis salieron a su encuentro diciendo: «Te pido tres cosas: no ofrezcas a los romanos nada parecido a lo que me ofreciste, pues me han engañado; no rompas con los coptos, pues la ruptura no provino de ellos; y si muero, haz que me entierren en una iglesia de Alejandría que él mismo haya nombrado». Y Amr respondió: «Es tuya». Entonces Amr tomó Alejandría por la fuerza, escribiendo a Umar ibn al-Khattab: «Procedamos: Dios nos ha abierto Alejandría por la fuerza, violentamente, sin pacto ni contrato», aunque en la interpretación de Yazid ibn Abi Habib todo era tratado."
  fr: "Dans al-Baladhuri, suivant la chaîne d'Ibn Lahia d'après Yazid ibn Abi Habib: les Muqawqis s'allièrent avec Amr ibn al-As: les Romains qui le souhaitaient pouvaient partir, ceux qui voulaient rester demeuraient sur un pied d'égalité, et deux dinars étaient imposés aux Coptes. Lorsque la nouvelle parvint au roi des Romains, il entra dans une grande colère, envoya des armées qui fermèrent les portes d'Alexandrie et déclarèrent la guerre à Amr. Les Muqawqis vinrent alors à lui et dirent: « Je vous demande trois choses: n'offrez rien aux Romains comme vous m'avez offert, car ils m'ont trompé; ne rompez pas les liens avec les Coptes, car la rupture ne vient pas d'eux; et si je meurs, faites-moi enterrer dans une église d'Alexandrie qu'il a nommée. » Amr répondit: « Elle est à vous. » Amr prit alors Alexandrie par la force, écrivant à Umar ibn al-Khattab: « Pour continuer — Dieu nous a ouvert Alexandrie par la force, violemment, sans alliance ni contrat » — bien que, selon Yazid ibn Abi Habib, il s'agisse d'un traité."
  ur: "یزید بن ابی حبیب سے ابن لہیہ کے سلسلہ میں البلدوری میں ہے: مقوقس نے عمرو بن العاص کے ساتھ مل کر کیا - تاکہ رومی جو چاہیں چلے جائیں، جو ٹھہرنا چاہتے ہیں وہ ایک مقررہ قدم پر رہیں، اور قبطیوں پر دو دینار رکھے جائیں؛ جب یہ بات رومیوں کے بادشاہ تک پہنچی تو اس کا غصہ بڑھ گیا، اس نے اسکندریہ کا دروازہ بند کر دیا اور عمرو کے خلاف جنگ کا اعلان کر دیا، تو مقوی اس کے پاس آئے کہ میں تم سے تین چیزیں مانگتا ہوں: رومیوں کو کچھ نہ دینا جیسا کہ تم نے مجھے پیش کیا ہے، کیونکہ انہوں نے مجھے دھوکہ دیا ہے۔ قبطیوں کے ساتھ نہ توڑو، کیونکہ خلاف ورزی ان کی طرف سے نہیں ہوئی تھی۔ اور اگر میں مر جاؤں تو مجھے اسکندریہ کے ایک گرجا گھر میں دفن کر دو جس کا نام اس نے رکھا ہے - اور عمرو نے جواب دیا 'یہ تمہارا ہے'۔ اس کے بعد عمرو نے اسکندریہ کو زبردستی لے لیا، عمر بن الخطاب کو لکھا: 'آگے بڑھنے کے لیے - خدا نے اسکندریہ کو زبردستی ہمارے لیے کھول دیا ہے، نہ کوئی عہد اور نہ ہی معاہدہ' - حالانکہ یزید ابن ابی حبیب کے پڑھنے میں یہ سب معاہدہ تھا۔"
  tr: "El-Baladhuri'ye göre, İbn Lahia'dan Yazid ibn Abi Habib'in rivayetine dayanarak: El-Muqas, Amr ibn el-As ile Romalılardan ayrılmak isteyenlerin ayrılması, kalmak isteyenlerin ise belirlediği bir şartla kalması ve Kıptilerden iki dinar vergi alınması şartıyla barış yaptı. Bu durum Roma imparatoruna ulaştı ve imparator bundan hoşnut kalmadı. İskenderiye'nin kapılarını kapatan ordular göndererek Amr'a savaş ilan etti. El-Muqas onun yanına giderek, \"Senden üç şey istiyorum: Romalılara bana teklif ettiğin şeyi teklif etme, çünkü onlar beni aldattılar; Kıptilerle yaptığın anlaşmayı bozma, çünkü anlaşmayı bozan onlar değildi; ve eğer ölürsem, İskenderiye'deki bir kiliseye gömülmemi emret,\" dedi. Amr, \"Bu senin için,\" diye cevap verdi. Amr, İskenderiye'yi zorla fethetti ve Ömer ibn el-Hattab'a şöyle yazdı: \"Devam edelim, Allah bize İskenderiye'yi zorla, hiçbir antlaşma veya anlaşma olmaksızın fethetmiştir\" - Yezid ibn Abi Habib'e göre bunların hepsi bir barış antlaşmasıydı. Fetihle ilgili başka bir anlatımda ise şöyle deniyor: Amr, yirmi birinci yılda İskenderiye'ye doğru ilerledi ve Mısır'da vekili olarak Harice bin Hudefe'yi atadı. İskenderiye'nin aşağısındaki bölgeden Romalılar ve Kıptiler ona karşı toplanmış ve \"Bize ulaşmadan önce Fustat'ta ona saldıralım\" demişlerdi. Böylece Amr, onlarla el-Karyun'da karşılaştı, onları yendi ve birçoğunu öldürdü. Bunların arasında Saha, Yahit, el-Khis ve Sultis'ten insanlar da vardı ve onlar Amr'ı desteklediler ve ona yardım ettiler. Amr, bu insanların onunla savaşmaya hazır olduğunu gördü, ancak Kıptiler barışı seviyordu. Bu yüzden el-Mukas ona bir süreliğine barış ve ateşkes isteyen bir elçi gönderdi, ancak Amr reddetti. Bunun üzerine Mukas, kadınlara şehir surunda içe dönük şekilde durmalarını, erkeklerin ise Müslümanları korkutmak için silahlı bir şekilde onlara doğru durmalarını emretti. Amr ona şöyle bir mesaj gönderdi: “Yaptıklarınızı gördük ve sayıca üstün olduğumuz için bizi yenenleri yenemedik. Kralınız Heraklius ile karşılaştık ve başına gelenler oldu.” Mukas arkadaşlarına, “Bu insanlar doğru söylüyorlar. Kralımızı krallığından alıp Konstantinopolis'e getirdiler, bu yüzden biz daha çok boyun eğmeyi hak ediyoruz” dedi. Bunun üzerine ona sertçe konuştular ve kaçmaktan başka bir şey kabul etmediler. Bunun üzerine Müslümanlar onlarla şiddetli bir şekilde savaştılar ve üç ay boyunca onları kuşattılar. Sonra Amr, şehri kılıçla fethetti ve içindekileri ganimet olarak aldı, halkına dokunmadı, onları öldürmedi veya esir almadı ve onları Yunan halkı gibi koruma altına aldı. Muaviye bin Hudeyc el-Kindi ile birlikte yaptığı fetih hakkında Ömer'e yazdı, sonra el-Sakuni'yi de yanına aldı ve beşinci olarak onu da yanına gönderdi. Rivayete göre Salihah al-Muqas, on üç bin dinar ödemeyi kabul etmiş, ayrılmak isteyenlere izin vermiş, kalmak isteyenlere de kalmasına izin vermiş ve her Kıpti erkek için iki dinar daha vermiştir. Amr, Abdullah ibn Hudhafah'ı İskenderiye'de vekili olarak atamış, yanına bir grup Müslüman alarak Fustat'a doğru yola çıkmıştır. Ribat'taki (kale) konutlara gelince: Bir adam kaldığı eve vardığında, evin sahibinin oraya taşınmış olduğunu görürdü. Amr, \"Korkarım ki, bu evlere tekrar tekrar dönerseniz, evler harap olur\" demiştir. Ribat'ın eteklerine ulaştıklarında, \"Allah'ın bereketiyle ilerleyin. Sizden kim bir eve mızrak saplarsa, o ev ona ve akrabalarına ait olur\" demiştir. Böylece ev iki veya üç kişi arasında paylaştırılırdı. Yezid ibn Ebu Habib şöyle derdi: \"Kimsenin oradan kira alma hakkı yoktur, satılamaz veya miras bırakılamaz. Sadece ribat döneminde ikamet ettikleri yerdi.\""
  id: "Menurut al-Baladhuri, dengan sanad dari Ibn Lahia atas otoritas Yazid ibn Abi Habib: Al-Muqas berdamai dengan Amr ibn al-As dengan syarat bahwa siapa pun di antara orang Romawi yang ingin pergi akan diizinkan, dan siapa pun yang ingin tetap tinggal akan diizinkan dengan syarat yang ia tetapkan, dan bahwa dua dinar akan dipungut dari orang Koptik. Hal ini sampai kepada kaisar Romawi, yang tidak senang dan mengirimkan pasukan yang menutup gerbang Aleksandria dan menyatakan perang terhadap Amr. Al-Muqas pergi menemuinya dan berkata, “Aku meminta tiga hal kepadamu: agar engkau tidak menawarkan kepada orang Romawi apa yang telah engkau tawarkan kepadaku, karena mereka telah menipuku; agar engkau tidak melanggar perjanjian dengan orang Koptik, karena pelanggaran itu bukan berasal dari mereka; dan jika aku meninggal, perintahkan agar aku dimakamkan di sebuah gereja di Aleksandria,” sebutnya. Amr menjawab, “Ini untukmu.” Amr menaklukkan Alexandria dengan kekerasan dan menulis surat kepada Umar ibn al-Khattab tentang hal itu: “Untuk melanjutkan, Tuhan telah memberi kita kemenangan atas Alexandria dengan kekerasan, tanpa perjanjian atau kesepakatan apa pun”—yang semuanya, menurut Yazid ibn Abi Habib, adalah perjanjian damai. Dalam catatan lain tentang penaklukan tersebut: Amr bergerak menuju Alexandria pada tahun 21 dan menunjuk Kharijah bin Hudhafah sebagai wakilnya di Mesir. Ada orang Romawi dan Koptik dari daerah di bawah Alexandria yang berkumpul melawannya dan berkata, “Mari kita serang dia di Fustat sebelum dia mencapai kita.” Maka dia bertemu mereka di al-Karyun dan mengalahkan mereka serta membunuh banyak dari mereka. Di antara mereka ada orang-orang dari Sakha, Yahit, al-Khis, dan Sultis yang mendukung dan membantu mereka. Dia mendapati penduduknya siap untuk melawannya, tetapi orang-orang Koptik mencintai perdamaian. Maka al-Muqas mengirim utusan kepadanya meminta perdamaian dan gencatan senjata untuk jangka waktu tertentu, tetapi Amr menolak. Maka al-Muqas memerintahkan para wanita untuk berdiri di tembok kota menghadap ke dalam, dan para pria berdiri bersenjata menghadap kaum Muslim untuk mengintimidasi mereka. Amr mengirim pesan kepadanya, “Kami telah melihat apa yang telah kau lakukan, dan kami tidak mengalahkan mereka yang mengalahkan kami karena jumlah kami. Kami bertemu dengan rajamu Heraclius, dan apa yang terjadi padanya telah terjadi.” Al-Muqas berkata kepada para sahabatnya, “Orang-orang ini telah mengatakan yang sebenarnya. Mereka membawa raja kita keluar dari kerajaannya dan membawanya ke Konstantinopel, jadi kita lebih pantas untuk tunduk.” Maka mereka berbicara kasar kepadanya dan menolak kecuali untuk melarikan diri. Maka kaum Muslim memerangi mereka dengan sengit dan mengepung mereka selama tiga bulan. Kemudian Amr menaklukkannya dengan pedang dan mengambil apa yang ada di dalamnya sebagai rampasan perang, dan dia mengampuni penduduknya dan tidak membunuh atau menawan mereka, dan dia menjadikan mereka orang-orang yang dilindungi seperti orang-orang Yunani. Dia menulis kepada Umar tentang penaklukan bersama Muawiyah bin Hudayj al-Kindi, kemudian al-Sakuni, dan mengirimnya bersamanya orang kelima. Dikatakan bahwa Salihah al-Muqas setuju untuk membayar tiga belas ribu dinar, mengizinkan mereka yang ingin pergi untuk pergi dan mereka yang ingin tinggal untuk tetap tinggal, dan dua dinar untuk setiap pria dewasa Koptik. Amr menunjuk Abdullah ibn Hudhafah sebagai wakilnya di Alexandria, bersama dengan kontingen Muslim, dan berangkat ke Fustat. Mengenai tempat tinggal di ribat (pos berbenteng): seseorang akan tiba di rumah tempat dia tinggal, hanya untuk mendapati bahwa pemiliknya telah pindah. Amr berkata, \"Aku khawatir rumah-rumah itu akan rusak jika kalian terus kembali ke sana.\" Ketika mereka sampai di pinggiran ribat, dia berkata, \"Lanjutkan dengan berkah Allah. Siapa pun di antara kalian yang menancapkan tombak di sebuah rumah, rumah itu menjadi miliknya dan kerabatnya.\" Dengan demikian, rumah itu dibagi antara dua atau tiga orang. Yazid ibn Abi Habib biasa berkata, \"Tidak seorang pun berhak atas sewa darinya, juga tidak dapat dijual atau diwariskan. Itu hanya tempat tinggal mereka selama mereka berada di ribat.\""
