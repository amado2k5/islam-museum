id: event/al-hadi-routs-banu-al-harith-and-the-forty-horsemen-286
class: event
kind: other
label:
  ar: هزيمة بني الحارث في القرية ومحاربة الهادي الأربعين فارساً، 286هـ
  en: The rout of Banu al-Harith in the village and al-Hadi's charge on the forty horsemen, 286 AH
  ur: بستی میں بنو حارث کی شکست اور چالیس سواروں پر ہادی کا حملہ، 286ھ
summary:
  ar: يتواصل الضرب في بني الحارث حتى يخرجوا من القرية من حيث دخلوا ويتبعهم الهادي، وكانوا قد انتقوا نحو أربعين فارساً مدججين وأقسموهم أن يقفوا معاً ثم يحملوا حملة رجل واحد حين يرون الهادي، فلا يعبأ الهادي بالخبر ويخرج أول فارس في آثارهم ويحمل على تلك الخيل فلا يثبت له منهم فارس، وتتبعه همدان ويكثر القتلى.
  en: The fighting among Banu al-Harith goes on until they are driven out of the village the way they came, with al-Hadi after them; they had picked out about forty armoured horsemen and bound them by oath to stand together and charge as one man when they saw al-Hadi; he pays the report no heed, rides out first on their heels and charges that cavalry, no rider stands to him, Hamdan follows and many are killed.
  ur: بنو حارث کو مار پڑتی رہتی ہے یہاں تک کہ وہ بستی سے اسی راستے سے نکل جاتے ہیں جہاں سے داخل ہوئے تھے اور ہادی ان کے پیچھے جاتے ہیں؛ انہوں نے تقریباً چالیس مسلح سوار چن رکھے تھے اور قسم دلائی تھی کہ ساتھ کھڑے رہیں اور ہادی کو دیکھ کر ایک آدمی کی طرح ٹوٹ پڑیں؛ ہادی اس خبر کی پروا نہیں کرتے، سب سے پہلے سوار ہو کر ان کے پیچھے نکلتے ہیں اور اس رسالے پر حملہ کرتے ہیں، ان کے سامنے کوئی سوار نہیں ٹکتا، ہمدان پیچھے آتی ہے اور بہت سے مارے جاتے ہیں۔
