label: { ar: "وفاة ابن حزم منفيًّا في بادية لبلة", en: "Ibn Hazm dies in exile in the desert of Labla", ur: "ابن حزم لبلہ کے بادیے میں جلاوطنی کی حالت میں وفات پاتے ہیں", es: "Ibn Hazm muere en el exilio en el desierto de Labla.", fr: "Ibn Hazm meurt en exil dans le désert de Labla", tr: "İbn Hazm, Lebla çölünde sürgünde öldü.", id: "Ibn Hazm meninggal dalam pengasingan di padang gurun Lebla." }
summary:
  ar: "توفي أبو محمد ابن حزم بالبادية، في قريته منت لشم من بلد لبلة، عشية يوم الأحد لليلتين بقيتا من شعبان سنة 456هـ، بعد أن أقصاه الملوك وأبعدوه عن وطنه. {cite:nafh-tib-maqqari p. 80-81}"
  en: "Ibn Hazm died in the desert village of Mant Lisham, in the district of Labla, on the evening of a Sunday two nights before the end of Sha'ban, 456 AH, after rulers had driven him from his homeland. {cite:nafh-tib-maqqari p. 80-81}"
  ur: "ابن حزم 456ھ میں شعبان کی آخری دو راتیں باقی ہوتے ہوئے اتوار کی شام لبلہ کے علاقے کی بستی منت لشم کے بادیے میں وفات پائے، جب حکمرانوں نے انھیں وطن سے دور کر دیا تھا۔ {cite:nafh-tib-maqqari p. 80-81}"
  es: "Ibn Hazm murió en la aldea desértica de Mant Lisham, en el distrito de Labla, la noche de un domingo, dos noches antes del final de Sha'ban del año 456 de la Hégira, después de que los gobernantes lo expulsaran de su tierra natal. {cite:nafh-tib-maqqari p. 80-81}"
  fr: "Ibn Hazm mourut dans le village désertique de Mant Lisham, dans le district de Labla, un dimanche soir, deux nuits avant la fin du mois de Sha'ban de l'an 456 de l'Hégire, après avoir été chassé de sa terre natale par les souverains. {cite:nafh-tib-maqqari p. 80-81}"
  tr: "Ebu Muhammed İbn Hazm, kralların onu sürgün edip vatanından uzaklaştırmasının ardından, Hicri 456 yılında Şaban ayının bitimine iki gece kala, Pazar arifesinde, Lebla bölgesindeki Mint Lasham köyünde, çölde vefat etti. {cite:nafh-tib-maqqari s. 80-81}"
  id: "Abu Muhammad Ibn Hazm wafat di padang pasir, di desanya Mint Lasham di wilayah Lebla, pada malam Minggu, dua malam sebelum berakhirnya bulan Sya'ban tahun 456 H, setelah raja-raja mengusirnya dan mengasingkannya dari tanah kelahirannya. {cite:nafh-tib-maqqari hlm. 80-81}"
