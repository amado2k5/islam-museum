label: { ar: "تدوين الديوان وفرض العطاء", en: "The Writing of the Diwan and the Stipend", es: "La redacción del Diwan y el estipendio", fr: "L'écriture du Diwan et la bourse", ur: "دیوان کی تحریر اور وظیفہ" }
summary:
  ar: "استشار عمر بن الخطاب المسلمين في تدوين الديوان فقال علي بن أبي طالب تقسم كل سنة ما اجتمع إليك من مال ولا تمسك منه شيئاً وقال عثمان أرى مالاً كثيراً يسع الناس وإن لم يحصوا حتى يعرف من أخذ ممن لم يأخذ حسبت أن ينتشر الأمر فقال له الوليد بن هشام بن المغيرة قد جئت الشام فرأيت ملوكها قد دونوا ديواناً وجندوا جنداً فدون ديواناً وجند جنداً فأخذ بقوله فدعا عقيل بن أبي طالب ومخرمة بن نوفل وجبير بن مطعم وكانوا من ألسن قريش فقال اكتبوا الناس على منازلهم فبدؤوا ببني هاشم ثم أتبعوهم أبا بكر وقومه ثم عمر وقومه على الخلافة فلما نظر إليه عمر قال وددت والله أنه هكذا ولكن ابدؤوا بقرابة النبي الأقرب فالأقرب حتى تضعوا عمر حيث وضعه الله وجاءت بنو عدي فقالوا أنت خليفة رسول الله وخليفة أبي بكر وأبو بكر خليفة رسول الله فلو جعلت نفسك حيث جعلك هؤلاء القوم الذين كتبوا قال بخ بخ بني عدي أردتم الأكل على ظهري وأن أهب حسناتي لكم لا والله حتى تأتيكم الدعوة وأن يطبق عليكم الدفتر إن لي صاحبين سلكا طريقاً فإن خالفتهما خولف لي والله ما أدركنا الفضل في الدنيا وما زكو الثواب على عملنا إلا بمحمد فهو شرفنا وقومه أشرف العرب ثم الأقرب فالأقرب والله لئن جاءت الأعاجم بعمل وجئنا بغير عمل لهم أولى بمحمد منا يوم القيامة فإن من قصر به عمله لم يسرع به نسبه."
  en: "Umar consulted the Muslims on writing a diwan — Ali: 'divide each year all you gather, keep nothing'; Uthman: 'much wealth — uncounted, who took and who did not will go unmarked'; al-Walid ibn Hisham ibn al-Mughira: 'I saw Syria's kings with a diwan and an army — write a diwan, raise an army'. He took the last, and called Quraysh's genealogists — Aqil ibn Abi Talib, Makhrama ibn Nawfal, Jubayr ibn Mut'im — 'write the people by their ranks'. They began with Banu Hashim, then Abu Bakr's folk, then Umar's by the caliphate — 'I would it were so,' said Umar, 'but begin with the Prophet's kin, nearest then nearest, till you set Umar where God set him'. Banu Adi came arguing for his primacy — 'bakh, bakh, Banu Adi: you would eat off my back and take my hasanat — my two companions walked a road and I will not differ; we won favour and reward only through Muhammad, our honour and the noblest Arabs, then nearest then nearest; by God, if the Ajam come with works and we without, they are worthier of him on the Last Day — the slow of deed is not sped by lineage'."
  es: "Umar consultó a los musulmanes sobre cómo redactar un diwan: Ali: «Dividid cada año todo lo que reunáis, no guardéis nada»; Uthman: «Mucha riqueza, incontable, quienes la tomaron y quienes no, quedará sin registrar»; al-Walid ibn Hisham ibn al-Mughira: «Vi a los reyes de Siria con un diwan y un ejército; redactad un diwan, reunid un ejército». Tomó la última sugerencia y llamó a los genealogistas de Quraysh: Aqil ibn Abi Talib, Makhrama ibn Nawfal, Jubayr ibn Mut'im: «Escriban a la gente según su rango». Comenzaron con Banu Hashim, luego con la gente de Abu Bakr, luego con la de Umar según el califato: «Ojalá fuera así», dijo Umar, «pero comenzad con los parientes del Profeta, los más cercanos, hasta que coloquen a Umar donde Dios lo colocó». Banu Adi vino argumentando a favor de su primacía: «Bakh, bakh, Banu Adi: querríais comer de mi espalda y tomar mi hasanat; mis dos compañeros recorrieron un camino y no discreparé; ganamos favor y recompensa solo a través de Muhammad, nuestro honor y los árabes más nobles, luego los más cercanos, luego los más cercanos; por Dios, si los Ajam vienen con obras y nosotros sin ellas, ellos son más dignos de él en el Último Día; la lentitud de la acción no se acelera por el linaje»."
  fr: "Umar consulta les musulmans au sujet de la rédaction d'un diwan. Ali lui dit: « Divisez chaque année tout ce que vous amassez, ne gardez rien. » Uthman répondit: « Une immense richesse, incalculable; qui a pris et qui n'a pas pris restera inconnu. » Al-Walid ibn Hisham ibn al-Mughira s'exclama: « J'ai vu les rois de Syrie avec un diwan et une armée ! Rédigez un diwan, levez une armée ! » Il suivit ce dernier conseil et appela les généalogistes de Quraysh – Aqil ibn Abi Talib, Makhrama ibn Nawfal et Jubayr ibn Mut'im – à rédiger l'acte de naissance des gens selon leur rang. Ils commencèrent par les Banu Hashim, puis la famille d'Abu Bakr, puis celle d'Umar selon le califat. « Je le souhaiterais, dit Umar, mais commencez par les proches du Prophète, du plus proche au plus proche, jusqu'à placer Umar là où Dieu l'a placé. » Les Banu Adi sont venus plaider leur cause pour sa primauté — « Bakh, Bakh, Banu Adi: vous mangeriez à mes dépens et vous prendriez mon hasanat — mes deux compagnons ont suivi une voie et je ne m'y opposerai pas; nous n'avons obtenu faveur et récompense que par Muhammad, notre honneur et les plus nobles Arabes, puis les plus proches, puis les plus proches; par Dieu, si les Ajam viennent avec des œuvres et nous sans, ils sont plus dignes de lui au Jour du Jugement dernier — la lenteur de l'action n'est pas accélérée par la lignée »."
  ur: "عمر نے مسلمانوں سے ایک دیوان لکھنے پر مشورہ کیا - علی: 'ہر سال جو کچھ تم جمع کرتے ہو تقسیم کرو، کچھ نہ رکھو'۔ عثمان: 'زیادہ دولت - بے شمار، کس نے لیا اور کون نہیں بے نشان ہو جائے گا'۔ ولید بن ہشام بن مغیرہ: 'میں نے شام کے بادشاہوں کو دیوان اور فوج کے ساتھ دیکھا - دیوان لکھو، ایک لشکر تیار کرو'۔ اس نے آخری نمبر لیا، اور قریش کے نسب ناموں کو بلایا - عاقل ابن ابی طالب، مخرمہ بن نوفل، جبیر بن مطعم - 'لوگوں کو ان کی صفوں کے مطابق لکھو'۔ ان کی شروعات بنو ہاشم سے ہوئی، پھر ابوبکر کی قوم سے، پھر عمر کی خلافت کی طرف سے - 'میں ایسا ہوتا،' عمر نے کہا، 'لیکن نبی کے رشتہ داروں سے شروع کریں، قریب ترین پھر قریب، یہاں تک کہ آپ نے عمر کو وہیں کھڑا کر دیا جہاں اللہ نے انہیں رکھا تھا'۔ بنو عدی اپنی برتری کے لیے بحث کرتے ہوئے آئے — 'بخ، بخ، بنو عدی: تم میری پیٹھ کھاؤ گے اور میری حسنات چھین لو گے- میرے دونوں ساتھی ایک راستے پر چل پڑے اور میں اختلاف نہیں کروں گا۔ ہم نے احسان اور انعام صرف محمد کے ذریعے حاصل کیا، ہماری عزت اور بزرگ ترین عرب، پھر قریب ترین پھر قریب۔ خدا کی قسم، اگر عجم اعمال کے ساتھ آئے اور ہم اس کے بغیر، وہ آخرت کے دن اس کے لائق ہیں - عمل کی سستی حسب و نسب سے نہیں ہوتی۔"
