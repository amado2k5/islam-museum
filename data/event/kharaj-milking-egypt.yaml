label: { ar: "اللقاح وأولادها: خراج عمرو وعبد الله بن سعد", en: "The Milch-Camel Exchange: Amr's and Ibn Abi Sarh's Kharaj" }
summary:
  ar: "عند البلاذري عن يزيد بن أبي حبيب: جبى عمرو بن العاص خراج مصر وجزيتها ألفي ألف وجباها عبد الله بن سعد بن أبي سرح أربعة آلاف ألف فقال عثمان لعمرو إن اللقاح بمصر بعدك قد درّت ألبانها فقال ذاك لأنكم أعجفتم أولادها. وكان عمر بن الخطاب يكتب أموال عمّاله إذا ولّاهم ثم يقاسمهم ما زاد على ذلك وربما أخذه منهم فكتب إلى عمرو بن العاص أنه قد فشت له فاشية من متاع ورقيق وآنية وحيوان لم تكن حين وليت مصر."
  en: "In al-Baladhuri on Yazid ibn Abi Habib's report: Amr ibn al-As gathered Egypt's kharaj and jizya at two thousand thousand, while Abdallah ibn Sa'd ibn Abi Sarh gathered it at four thousand thousand — whereupon Uthman said to Amr 'the milch-camels of Egypt have milked fuller since you', and Amr answered 'that is because you have starved their calves'. And Umar ibn al-Khattab would record his governors' wealth when appointing them, then share with them whatever grew beyond it, sometimes taking it from them outright — so he wrote to Amr ibn al-As that goods, slaves, vessels and beasts had flourished for him beyond what he held when given Egypt."
