label: { ar: "اللقاح وأولادها: خراج عمرو وعبد الله بن سعد", en: "The Milch-Camel Exchange: Amr's and Ibn Abi Sarh's Kharaj", es: "El intercambio leche-camello: el Kharaj de Amr e Ibn Abi Sarh", fr: "L'échange Milch-Camel: le Kharaj d'Amr et Ibn Abi Sarh", ur: "دودھ اور اونٹ کا تبادلہ: عمرو اور ابن ابی سرح کا خرج", tr: "Aşı ve onun sonuçları: Amr ve Abdullah bin Saad'ın apsesi", id: "Vaksinasi dan dampaknya: Abses Amr dan Abdullah bin Saad" }
summary:
  ar: "عند البلاذري عن يزيد بن أبي حبيب: جبى عمرو بن العاص خراج مصر وجزيتها ألفي ألف وجباها عبد الله بن سعد بن أبي سرح أربعة آلاف ألف فقال عثمان لعمرو إن اللقاح بمصر بعدك قد درّت ألبانها فقال ذاك لأنكم أعجفتم أولادها. وكان عمر بن الخطاب يكتب أموال عمّاله إذا ولّاهم ثم يقاسمهم ما زاد على ذلك وربما أخذه منهم فكتب إلى عمرو بن العاص أنه قد فشت له فاشية من متاع ورقيق وآنية وحيوان لم تكن حين وليت مصر."
  en: "In al-Baladhuri on Yazid ibn Abi Habib's report: Amr ibn al-As gathered Egypt's kharaj and jizya at two thousand thousand, while Abdallah ibn Sa'd ibn Abi Sarh gathered it at four thousand thousand — whereupon Uthman said to Amr 'the milch-camels of Egypt have milked fuller since you', and Amr answered 'that is because you have starved their calves'. And Umar ibn al-Khattab would record his governors' wealth when appointing them, then share with them whatever grew beyond it, sometimes taking it from them outright — so he wrote to Amr ibn al-As that goods, slaves, vessels and beasts had flourished for him beyond what he held when given Egypt."
  es: "En al-Baladhuri sobre el informe de Yazid ibn Abi Habib: Amr ibn al-As reunió el kharaj y la jizya de Egipto en dos mil mil, mientras que Abdallah ibn Sa'd ibn Abi Sarh los reunió en cuatro mil mil, entonces Uthman le dijo a Amr 'las camellas lecheras de Egipto han dado más leche desde que tú', y Amr respondió 'eso es porque has dejado morir de hambre a sus terneros'. Y Umar ibn al-Khattab registraba la riqueza de sus gobernadores cuando los nombraba, luego compartía con ellos lo que crecía por encima de eso, a veces quitándoselo directamente, así que le escribió a Amr ibn al-As que los bienes, los esclavos, los barcos y los animales habían florecido para él más allá de lo que poseía cuando se le dio Egipto."
  fr: "Dans son ouvrage Al-Baladhuri, relatant le récit de Yazid ibn Abi Habib: Amr ibn al-As collecta le kharaj et la jizya d’Égypte à hauteur de deux mille mille shillings, tandis qu’Abdallah ibn Sa’d ibn Abi Sarh les collecta à quatre mille mille shillings. Uthman dit alors à Amr: « Depuis votre arrivée, les chamelles laitières d’Égypte produisent davantage de lait », ce à quoi Amr répondit: « C’est parce que vous avez affamé leurs veaux. » Quant à Umar ibn al-Khattab, il consignait la richesse de ses gouverneurs lors de leur nomination, puis partageait avec eux tout ce qui s’enrichissait au-delà, allant parfois jusqu’à le leur prendre purement et simplement. Ainsi, il écrivit à Amr ibn al-As que ses biens, esclaves, navires et bêtes avaient prospéré au-delà de ce qu’il possédait lorsqu’il reçut l’Égypte."
  ur: "البلاذری میں یزید بن ابی حبیب کی روایت ہے کہ: عمرو بن العاص نے مصر کا خرج اور جزیہ دو ہزار میں جمع کیا جبکہ عبداللہ بن سعد ابن ابی سرح نے چار ہزار جمع کیا، اس پر عثمان نے عمرو سے کہا کہ تم نے دودھ دینے والی اونٹنیوں کو جواب دیا کیونکہ تم نے مصر کے دودھ والے اونٹوں کو جواب دیا ہے۔ ان کے بچھڑوں کو بھوکا رکھا ہے۔ اور عمر بن الخطاب اپنے گورنروں کی تقرری کرتے وقت ان کی دولت کو ریکارڈ کرتے، پھر جو کچھ اس سے آگے بڑھتا وہ ان کے ساتھ بانٹتے، کبھی کبھی ان سے سیدھا لے لیتے - چنانچہ اس نے عمرو بن العاص کو لکھا کہ اس کے لیے مال، غلام، برتن اور جانور اس سے بڑھ کر بڑھے ہیں جو اس کے پاس جب مصر دیا گیا تھا۔"
  tr: "El-Baladhuri, Yezid ibn Abi Habib'den rivayetle şöyle aktarmıştır: Amr ibn al-As, Mısır için iki milyon dirhem vergi ve haraç toplarken, Abdullah ibn Saad ibn Abi Sarh dört milyon dirhem toplamıştır. Osman, Amr'a, \"Senin ayrılışından beri Mısır'daki dişi develerin süt verimi arttı\" demiştir. Amr, \"Çünkü sen onların yavrularını sütten mahrum bıraktın\" diye cevap vermiştir. Ömer ibn al-Khattab, valilerini atadığında onların mallarını kaydeder, fazlasını aralarında paylaştırır, hatta bazen onlardan alırdı. Amr ibn al-As'a yazdığı mektupta, Mısır valisi olarak atandığında sahip olmadığı çok miktarda mal, köle, gemi ve hayvan edindiğini belirtmiştir."
  id: "Al-Baladhuri, berdasarkan riwayat Yazid ibn Abi Habib, melaporkan: Amr ibn al-As mengumpulkan dua juta dirham dalam bentuk pajak dan upeti untuk Mesir, sementara Abdullah ibn Saad ibn Abi Sarh mengumpulkan empat juta dirham. Utsman berkata kepada Amr, \"Unta betina di Mesir telah meningkatkan produksi susunya sejak kepergianmu.\" Amr menjawab, \"Itu karena kamu telah merampas susu anak-anak unta tersebut.\" Umar ibn al-Khattab biasa mencatat kekayaan para gubernurnya ketika ia mengangkat mereka, kemudian membagi kelebihan kekayaan tersebut di antara mereka, bahkan kadang-kadang mengambilnya dari mereka. Ia menulis surat kepada Amr ibn al-As, mengatakan bahwa ia telah memperoleh sejumlah besar barang, budak, kapal, dan hewan yang tidak dimilikinya ketika ia diangkat menjadi gubernur Mesir."
