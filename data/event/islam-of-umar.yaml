education:
  did_you_know:
    ar: "أسلم عمر بن الخطاب في السنة السادسة بعد ثلاثة أيام من إسلام حمزة، إذ سمع صدر سورة طه في بيت أخته فمال قلبه."
    en: "Umar ibn al-Khattab embraced Islam in year six, three days after Hamza — moved by hearing the opening of Surah Ta-Ha in his sister's home."
    ur: "عمر بن خطاب نے چھٹے سال، حمزہ کے ایمان لانے کے تین دن بعد اسلام قبول کیا — اپنی بہن کے گھر سورۃ طہ کے آغاز کو سن کر ان کا دل جھک گیا۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
