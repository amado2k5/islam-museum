label: { en: "Umar accepts Islam", ar: "إسلام عمر بن الخطاب" }
summary:
  en: "In Dhu al-Hijja of year six — three days after Hamza — Umar, who had set out with his sword to kill the Prophet, was redirected by Nu'aym ibn Abdullah to his own sister's house; he heard the opening of sura Ta-Ha from Sa'id and Fatima, then went to the house of al-Arqam and declared the shahada, and the Muslims marched out in two rows and prayed openly at the Kaaba."
  ar: "في ذي الحجة من السنة السادسة — بعد ثلاثة أيام من إسلام حمزة — خرج عمر بسيفه يريد قتل النبي، فردّه نعيم بن عبد الله إلى بيت أخته؛ فسمع صدر سورة طه من سعيد وفاطمة، ثم أتى دار الأرقم فشهد الشهادة، وخرج المسلمون في صفين يتقدمهم حمزة وعمر حتى صلوا عند الكعبة جهاراً، فسمّاه النبي الفاروق."
