summary:
  en: "In Dhu al-Hijja of year six — three days after Hamza — Umar, who had set out with his sword to kill the Prophet, was redirected by Nu'aym ibn Abdullah to his own sister's house; he heard the opening of sura Ta-Ha from Sa'id and Fatima, then went to the house of al-Arqam and declared the shahada, and the Muslims marched out in two rows and prayed openly at the Kaaba."
  ar: "في ذي الحجة من السنة السادسة — بعد ثلاثة أيام من إسلام حمزة — خرج عمر بسيفه يريد قتل النبي، فردّه نعيم بن عبد الله إلى بيت أخته؛ فسمع صدر سورة طه من سعيد وفاطمة، ثم أتى دار الأرقم فشهد الشهادة، وخرج المسلمون في صفين يتقدمهم حمزة وعمر حتى صلوا عند الكعبة جهاراً، فسمّاه النبي الفاروق."
  es: "En Dhu al-Hijja del sexto año —tres días después de Hamza— Umar, que había salido con su espada para matar al Profeta, fue redirigido por Nu'aym ibn Abdullah a la casa de su propia hermana; allí escuchó la apertura de la sura Ta-Ha de Sa'id y Fátima, luego fue a la casa de al-Arqam y pronunció la shahada, y los musulmanes salieron en dos filas y oraron abiertamente en la Kaaba."
  fr: "En Dhu al-Hijja de l'an six — trois jours après Hamza — Umar, qui était parti avec son épée pour tuer le Prophète, fut redirigé par Nu'aym ibn Abdullah vers la maison de sa propre sœur; il entendit le début de la sourate Ta-Ha récitée par Sa'id et Fatima, puis se rendit à la maison d'al-Arqam et prononça la shahada, et les musulmans sortirent en deux rangs et prièrent ouvertement à la Kaaba."
  ur: "چھے سال کی ذی الحجہ میں - حمزہ کے تین دن بعد - عمر، جو نبی کو قتل کرنے کے لیے اپنی تلوار لے کر نکلے تھے، نعیم بن عبداللہ نے اسے اپنی بہن کے گھر بھیج دیا۔ اس نے سعید اور فاطمہ سے سورہ طہٰ کے کھلنے کی آواز سنی، پھر ارقم کے گھر جا کر شہادت کا اعلان کیا، اور مسلمان دو صفوں میں نکلے اور کعبہ کے پاس کھلے عام نماز ادا کی۔"
