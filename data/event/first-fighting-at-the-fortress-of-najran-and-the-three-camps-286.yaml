id: event/first-fighting-at-the-fortress-of-najran-and-the-three-camps-286
class: event
kind: other
label:
  ar: أول قتال عند حصن نجران وافتراق الحارثيين في ثلاثة معسكرات، ذو الحجة 286هـ
  en: The first fighting at the fortress of Najran and the split of Banu al-Harith into three camps, Dhu al-Hijja 286 AH
  ur: نجران کے قلعے پر پہلی لڑائی اور بنو حارث کا تین لشکروں میں بٹ جانا، ذی الحجہ 286ھ
summary:
  ar: يجمع الهادي همدان ونجران وثقيف والأحلاف ويعسكر على باب ميناس ويأمر بقتال أهل الحصن وفيه ابن بسطام وعشيرته وعامة بني الحارث، فيشتد القتال في الأزقة والسطوح حتى المساء ثم ينصرف إلى الحصن، ثم يقاتلهم يوماً ويتركهم يوماً ويضيق عليهم، فيتفرقون ثلاثة عساكر في سوحان وميناس وقرية الهجر ويتحالفون على نصرة بعضهم بعضاً.
  en: Al-Hadi musters Hamdan, Najran, Thaqif and al-Ahlaf, camps at the gate of Minas and orders the fortress fought, where Ibn Bustam, his clan and most of Banu al-Harith are; the fighting runs through lanes and over roofs until evening, after which he goes back to the fortress, then fights them a day and leaves them a day while pressing them hard, until they divide into three camps at Sawhan, Minas and the village of al-Hajar and swear to help one another.
  ur: ہادی ہمدان، نجران، ثقیف اور احلاف کو جمع کرتے ہیں، میناس کے دروازے پر پڑاؤ ڈالتے ہیں اور قلعے والوں سے لڑنے کا حکم دیتے ہیں جس میں ابن بسطام، اس کا قبیلہ اور بنو حارث کے اکثر لوگ ہیں؛ گلیوں اور چھتوں پر شام تک لڑائی ہوتی ہے پھر وہ قلعے لوٹ آتے ہیں، پھر ایک دن لڑتے اور ایک دن چھوڑتے اور ان پر تنگی کرتے ہیں، یہاں تک کہ وہ سوحان، میناس اور قریۂ ہجر میں تین لشکروں میں بٹ کر ایک دوسرے کی مدد کا حلف اٹھاتے ہیں۔
