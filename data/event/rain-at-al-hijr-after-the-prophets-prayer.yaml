label: { ar: "المطر بعد دعاء النبي بالحجر", en: "Rain falls after the Prophet's prayer at al-Hijr", es: "Cae la lluvia después de la oración del Profeta en al-Hijr.", fr: "La pluie tombe après la prière du Prophète à al-Hijr.", ur: "رسول اللہ کی نماز کے بعد بارش ہوئی" }
summary:
  ar: "أصبح الناس ولا ماء معهم فشكوا ذلك إلى النبي، فدعا فأرسل الله سحابة فأمطرت حتى ارتوى الناس واحتملوا حاجتهم من الماء. وفي رواية محمود بن لبيد أن رجلاً معروف النفاق قال حين رأى ذلك: سحابة مارّة."
  en: "The people woke with no water and complained to the Prophet; he prayed, and God sent a cloud that rained until they were quenched and carried away what they needed. In Mahmud ibn Labid's account, a man known for hypocrisy said on seeing it: a passing cloud."
  es: "La gente despertó sin agua y se quejó al Profeta; él oró, y Dios envió una nube que llovió hasta saciar su sed y se llevó lo que necesitaban. En el relato de Mahmud ibn Labid, un hombre conocido por su hipocresía dijo al verla: «Una nube pasajera»."
  fr: "Le peuple se réveilla sans eau et se plaignit au Prophète; celui-ci pria, et Dieu envoya une nuée qui fit pleuvoir jusqu’à ce que la soif les étanche et qu’ils aient trouvé ce dont ils avaient besoin. Selon le récit de Mahmud ibn Labid, un homme connu pour son hypocrisie déclara en la voyant: « Un nuage passager. »"
  ur: "لوگ پانی نہ ملنے پر بیدار ہوئے اور رسول اللہ سے شکایت کی۔ اُس نے دعا کی، اور خُدا نے ایک بادل بھیجا جو برستا رہا یہاں تک کہ وہ بجھ گئے اور اُن کی ضرورت کو بہا لے گئے۔ محمود بن لبید کے بیان میں، منافقت کے لیے مشہور ایک شخص نے اسے دیکھ کر کہا: ایک گزرتا ہوا بادل۔"
