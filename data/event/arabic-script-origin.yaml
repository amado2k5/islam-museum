label: { ar: "وضع الخط العربي وانتشاره", en: "The Devising and Spread of Arabic Script", es: "La creación y difusión de la escritura árabe", fr: "L'élaboration et la diffusion de l'écriture arabe", ur: "عربی رسم الخط کی تشکیل اور پھیلاؤ", tr: "Arap alfabesinin gelişimi ve yayılması", id: "Perkembangan dan penyebaran aksara Arab" }
summary:
  ar: "قال الشرقي بن القطامي اجتمع ثلاثة نفر من طيئ ببقة وهم مرامر بن مرة وأسلم بن سدرة وعامر بن جدرة فوضعوا الخط وقاسوا هجاء العربية على هجاء السريانية فتعلمه منهم قوم من أهل الأنبار ثم تعلمه أهل الحيرة من أهل الأنبار وكان بشر بن عبد الملك أخو أكيدر بن عبد الملك بن عبد الجن الكندي ثم السكوني صاحب دومة الجندل يأتي الحيرة فيقيم بها الحين وكان نصرانياً فتعلم بشر الخط العربي من أهل الحيرة ثم أتى مكة في بعض شأنه فرآه سفيان بن أمية بن عبد شمس وأبو قيس بن عبد مناف بن زهرة بن كلاب يكتب فسألاه أن يعلمهما الخط فعلمهما الهجاء ثم أراهما الخط فكتبا ثم إن بشراً وسفياناً وأبا قيس أتوا الطائف في تجارة فصحبهم غيلان بن سلمة الثقفي فتعلم الخط منهم وفارقهم بشر ومضى إلى ديار مضر فتعلم الخط منه عمرو بن زرارة بن عدس فيسمى عمرو الكاتب ثم أتى بشر الشام فتعلم الخط منه ناس هناك وتعلم الخط من الثلاثة الطائيين أيضاً رجل من طابخة فعلمه رجلاً من أهل وادي القرى فأقام بها وعلم الخط قوماً من أهلها."
  en: "Al-Sharqi ibn al-Quttami: three Tayyi' men met at Baqqa — Muramir ibn Murra, Aslam ibn Sidra and Amir ibn Jadara — and devised the script, measuring Arabic's spelling against the Syriac. Men of al-Anbar learned it from them, al-Hira from al-Anbar; and Bishr ibn Abd al-Malik — brother of Ukaydir, the Christian lord of Dumat al-Jandal who sojourned at al-Hira — learned it there, came to Mecca, and taught its letters then its script to Sufyan ibn Umayya ibn Abd Shams and Abu Qays ibn Abd Manaf ibn Zuhra ibn Kilab. The three went trading to al-Ta'if; Ghaylan ibn Salama al-Thaqafi learned with them. Bishr went on to Mudar's lands where Amr ibn Zurara ibn Udas learned — he is called Amr the Scribe — then to al-Sham where men learned it; and a man of Tabukha learned from the Tayyi' three and taught a man of Wadi al-Qura, who settled there and taught its people."
  es: "Al-Sharqi ibn al-Quttami: Tres hombres tayyi' se reunieron en Baqqa —Muramir ibn Murra, Aslam ibn Sidra y Amir ibn Jadara— y crearon la escritura, comparando la ortografía árabe con la siríaca. Los hombres de al-Anbar la aprendieron de ellos, al-Hira de al-Anbar; y Bishr ibn Abd al-Malik —hermano de Ukaydir, el señor cristiano de Dumat al-Jandal que residía en al-Hira— la aprendió allí, llegó a La Meca y enseñó sus letras y luego su escritura a Sufyan ibn Umayya ibn Abd Shams y Abu Qays ibn Abd Manaf ibn Zuhra ibn Kilab. Los tres se dedicaron al comercio en al-Ta'if; Ghaylan ibn Salama al-Thaqafi estudió con ellos. Bishr fue a las tierras de Mudar, donde aprendió Amr ibn Zurara ibn Udas —a quien se le llama Amr el Escriba—, luego a al-Sham, donde los hombres lo aprendieron; y un hombre de Tabukha aprendió de los tres Tayyi' y enseñó a un hombre de Wadi al-Qura, quien se estableció allí y enseñó a su gente."
  fr: "Al-Sharqi ibn al-Quttami rapporte que trois hommes de la tribu Tayyi' se rencontrèrent à Baqqa – Muramir ibn Murra, Aslam ibn Sidra et Amir ibn Jadara – et conçurent l'écriture en comparant l'orthographe arabe à l'orthographe syriaque. Les habitants d'al-Anbar l'apprirent d'eux, ceux d'al-Hira d'al-Anbar; et Bishr ibn Abd al-Malik – frère d'Ukaydir, seigneur chrétien de Dumat al-Jandal qui séjourna à al-Hira – l'apprit là-bas, vint à La Mecque et enseigna les lettres puis l'écriture à Sufyan ibn Umayya ibn Abd Shams et Abu Qays ibn Abd Manaf ibn Zuhra ibn Kilab. Tous trois partirent commercer à al-Ta'if; Ghaylan ibn Salama al-Thaqafi apprit auprès d'eux. Bishr se rendit ensuite sur les terres de Mudar où Amr ibn Zurara ibn Udas apprit — on l'appelle Amr le Scribe — puis à al-Sham où des hommes l'apprirent; et un homme de Tabukha apprit des trois Tayyi' et enseigna à un homme de Wadi al-Qura, qui s'y installa et enseigna à ses habitants."
  ur: "الشرقی ابن القطمی: تین طائی آدمی بقع میں ملے — مرامر ابن مرہ، اسلم ابن سدرہ اور عامر ابن جدرہ — اور رسم الخط تیار کیا، عربی کے ہجے کو سریانی کے مقابلے میں ناپ کر۔ الانبار والوں نے ان سے سیکھا، الحیرہ نے الانبار سے۔ اور بشر بن عبد الملک - دمت الجندل کے عیسائی سردار عقیدیر کے بھائی جو الحیرہ میں مقیم تھے - نے اسے وہاں سیکھا، مکہ آیا اور اس کے خطوط کو پڑھایا پھر اس کا رسم الخط سفیان بن امیہ ابن عبد شمس اور ابو قیس ابن عبد مناف ابن زھرہ کو سکھایا۔ تینوں تجارت کرتے ہوئے الطائف گئے۔ غیلان بن سلمہ ثقفی نے ان سے علم حاصل کیا۔ بشر مدر کی سرزمین پر گئے جہاں عمرو بن زرارہ ابن اُداس نے سیکھا تھا - اسے عمرو کاتب کہا جاتا ہے - پھر الشام میں جہاں لوگوں نے اسے سیکھا تھا۔ اور تبوخہ کے ایک آدمی نے طائی تین سے علم حاصل کیا اور وادی القریٰ کے ایک آدمی کو سکھایا جو وہاں آباد ہوا اور وہاں کے لوگوں کو سکھایا۔"
  tr: "El-Şarki ibn el-Katami şöyle dedi: Tayy kabilesinden üç adam Bukka'da bir araya geldi: Maramir ibn Murra, Aslam ibn Sidra ve Emir ibn Cedra. Bir yazı sistemi geliştirdiler ve Arapça yazımını Süryanice yazımına dayandırdılar. Enber'den bazı insanlar bunu onlardan öğrendi, sonra Hira halkı da Enber halkından öğrendi. Ukaydir ibn Abd el-Malik ibn Abd el-Cinn el-Kindi'nin kardeşi, daha sonra Dumat el-Cendal'in yöneticisi el-Sakuni olan Bişr ibn Abd el-Malik, Hira'ya gelir ve bir süre orada kalırdı. Hristiyan olan Bişr, Arapça yazıyı Hira halkından öğrendi. Sonra bazı işler için Mekke'ye gitti ve Sufyan ibn Umayya ibn Abd Şems ve Ebu Kays ibn Abd Manaf ibn Zuhra ibn Kilab onu yazarken gördüler. Ona yazıyı öğretmesini istediler, o da onlara yazıyı öğretti ve sonra yazıyı gösterdi ve onlar da yazdılar. Sonra Bişr, Sufyan ve Ebu Kays ticaret için Taif'e gittiler ve Gaylan ibn Salama el-Sakkafi de onlara eşlik ederek onlardan yazı öğrendi. Bişr onları bırakıp Mudar topraklarına gitti ve Amr ibn Zurara ibn Adas ondan yazı öğrendi ve ona \"Katip Amr\" denildi. Sonra Bişr Suriye'ye gitti ve oradaki insanlar ondan yazı öğrendiler ve o da bu üç kişiden yazı öğrendi. Tayy kabilesinin de Tabikha'dan bir adamı vardı ve o da ona Vadi el-Kura'dan bir adama yazı öğretti, böylece orada kaldı ve oradaki bazı insanlara yazı öğretti."
  id: "Al-Sharqi ibn al-Qatami berkata: Tiga orang dari suku Tayy bertemu di Buqqa: Maramir ibn Murra, Aslam ibn Sidra, dan Amir ibn Jadra. Mereka menciptakan sebuah aksara dan mendasarkan ejaan Arab pada ejaan Siria. Beberapa orang dari Anbar mempelajarinya dari mereka, dan kemudian penduduk Hira mempelajarinya dari penduduk Anbar. Bishr ibn Abd al-Malik, saudara dari Ukaydir ibn Abd al-Malik ibn Abd al-Jinn al-Kindi, kemudian al-Sakuni, penguasa Dumat al-Jandal, biasa datang ke Hira dan tinggal di sana untuk sementara waktu. Dia adalah seorang Kristen, dan Bishr mempelajari aksara Arab dari penduduk Hira. Kemudian dia pergi ke Mekah untuk urusan bisnis, dan Sufyan ibn Umayya ibn Abd Shams dan Abu Qays ibn Abd Manaf ibn Zuhra ibn Kilab melihatnya menulis. Mereka memintanya untuk mengajari mereka aksara, jadi dia mengajari mereka ejaannya dan kemudian menunjukkan aksaranya kepada mereka, dan mereka pun menulis. Kemudian Bishr, Sufyan, dan Abu Qays pergi ke Taif untuk berdagang, dan Ghaylan ibn Salama al-Thaqafi menemani mereka dan belajar aksara dari mereka. Bishr meninggalkan mereka dan pergi ke tanah Mudar, dan Amr ibn Zurara ibn Adas belajar aksara darinya, dan dia disebut Amr sang Juru Tulis. Kemudian Bishr pergi ke Suriah, dan orang-orang di sana belajar aksara darinya, dan dia belajar aksara dari ketiganya. Suku Tayy juga memiliki seorang pria dari Tabikha yang mengajarinya kepada seorang pria dari Wadi al-Qura, sehingga dia tinggal di sana dan mengajarkan menulis kepada beberapa orang di sana."
