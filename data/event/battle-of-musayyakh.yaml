summary:
  ar: "وقعة المصيّخ بني البرشاء: بعد مصاب أهل حصيد وهرب أهل الخنافس كتب خالد إلى القعقاع وأبي ليلى وأعبد وعروة وواعدهم ليلة وساعة يجتمعون فيها إلى المصيّخ فأغاروا على الهذيل بن عمران ومن معه وهم نائمون من ثلاثة أوجه فقتلوهم وأفلت الهذيل في ناس قليل؛ وقُتل في المعركة عبد العزى بن أبي رهم أخو أوس مناة ولبيد بن جرير وقد أسلما ومعهما كتاب أبي بكر بإسلامهما فبلغ ذلك أبا بكر فوداهما وأوصى بأولادهما، وكان عمر يعتدّ بقتلهما على خالد فيقول أبو بكر: كذلك يلقى من نازل أهل الشرك. وقد نصحهم حرقوص بن النعمان فلم يقبلوا فشرب هو وأهله خمر الوداع فضُرب رأسه فإذا هو في جفنة وقتلوا أولاده وأخذوا بناته {cite:kamil-ibn-al-athir p. 244-245}."
  en: "The night assault at al-Musayyakh: Khalid timed al-Qa'qa', Abu Layla and 'A'bad to converge on Hudhayl ibn 'Imran's camp in one hour and attacked the sleeping army from three sides. Among the dead were 'Abd al-'Uzza ibn Abi Ruhm and Labid ibn Jarir — two men who had already accepted Islam and carried Abu Bakr's letter confirming it; the caliph paid their blood-money and commended their children, and 'Umar counted their death against Khalid. Hurqus ibn al-Nu'man, who had warned the camp in vain, sat drinking a farewell cup until his head fell into the bowl {cite:kamil-ibn-al-athir p. 244-245}."
