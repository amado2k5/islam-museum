summary:
  ar: "وقعة المصيّخ بني البرشاء: بعد مصاب أهل حصيد وهرب أهل الخنافس كتب خالد إلى القعقاع وأبي ليلى وأعبد وعروة وواعدهم ليلة وساعة يجتمعون فيها إلى المصيّخ فأغاروا على الهذيل بن عمران ومن معه وهم نائمون من ثلاثة أوجه فقتلوهم وأفلت الهذيل في ناس قليل؛ وقُتل في المعركة عبد العزى بن أبي رهم أخو أوس مناة ولبيد بن جرير وقد أسلما ومعهما كتاب أبي بكر بإسلامهما فبلغ ذلك أبا بكر فوداهما وأوصى بأولادهما، وكان عمر يعتدّ بقتلهما على خالد فيقول أبو بكر: كذلك يلقى من نازل أهل الشرك. وقد نصحهم حرقوص بن النعمان فلم يقبلوا فشرب هو وأهله خمر الوداع فضُرب رأسه فإذا هو في جفنة وقتلوا أولاده وأخذوا بناته {cite:kamil-ibn-al-athir p. 244-245}."
  en: "The night assault at al-Musayyakh: Khalid timed al-Qa'qa', Abu Layla and 'A'bad to converge on Hudhayl ibn 'Imran's camp in one hour and attacked the sleeping army from three sides. Among the dead were 'Abd al-'Uzza ibn Abi Ruhm and Labid ibn Jarir — two men who had already accepted Islam and carried Abu Bakr's letter confirming it; the caliph paid their blood-money and commended their children, and 'Umar counted their death against Khalid. Hurqus ibn al-Nu'man, who had warned the camp in vain, sat drinking a farewell cup until his head fell into the bowl {cite:kamil-ibn-al-athir p. 244-245}."
  fr: "L'assaut nocturne d'al-Musayyakh : Khalid régla l'heure pour qu'al-Qa'qa', Abu Layla et 'A'bad convergent en même temps sur le camp de Hudhayl ibn 'Imran, et attaqua l'armée endormie de trois côtés. Parmi les morts se trouvaient 'Abd al-'Uzza ibn Abi Ruhm et Labid ibn Jarir, deux hommes qui avaient déjà embrassé l'islam et portaient une lettre d'Abu Bakr l'attestant ; le calife paya le prix de leur sang et recommanda leurs enfants, et 'Umar reprocha leur mort à Khalid. Hurqus ibn al-Nu'man, qui avait averti le camp en vain, buvait une coupe d'adieu quand sa tête tomba dans le bol {cite:kamil-ibn-al-athir p. 244-245}."
  es: "El asalto nocturno en al-Musayyakh: Khalid programó a al-Qa'qa', Abu Layla y 'A'bad para que convergieran en el campamento de Hudhayl ibn 'Imran en una hora y atacaron al ejército dormido desde tres flancos. Entre los muertos estaban 'Abd al-'Uzza ibn Abi Ruhm y Labid ibn Jarir, dos hombres que ya se habían convertido al Islam y portaban la carta de Abu Bakr que lo confirmaba; el califa pagó su indemnización y elogió a sus hijos, y 'Umar consideró su muerte como la responsabilidad de Khalid. Hurqus ibn al-Nu'man, quien había advertido al campamento en vano, se sentó a beber una copa de despedida hasta que su cabeza cayó en el cuenco {cite:kamil-ibn-al-athir p. 244-245}."
  ur: "المسیخ پر رات کا حملہ: خالد نے القعقا، ابو لیلیٰ اور عباد کو ایک گھنٹے میں ہذیل بن عمران کے کیمپ پر جمع ہونے کا وقت دیا اور سوئے ہوئے لشکر پر تین اطراف سے حملہ کیا۔ مرنے والوں میں عبد العزی ابن ابی رحم اور لبید بن جریر بھی شامل تھے - دو آدمی جو پہلے ہی اسلام قبول کر چکے تھے اور ابوبکر کا خط لے کر گئے تھے جس کی تصدیق ہوتی تھی۔ خلیفہ نے ان کے خون کی رقم ادا کی اور ان کے بچوں کی تعریف کی، اور عمر نے ان کی موت کو خالد کے خلاف شمار کیا۔ حرقس بن النعمان، جس نے کیمپ کو بیکار سے خبردار کیا تھا، الوداعی پیالہ پیتے ہوئے بیٹھا یہاں تک کہ اس کا سر پیالے میں گر گیا۔ 244-245}۔"
