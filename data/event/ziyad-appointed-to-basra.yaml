summary:
  ar: "في سنة خمس وأربعين ذكر الطبري ولاية زياد بن أبي سفيان البصرة، ضمن أخبار هذه السنة في فهرس الجزء الخامس ⁦(ص216 إلى 226)⁩ {cite:tabari-tarikh-abu-al-fadl j.5 p.629}."
  en: "In 45 al-Tabari recorded the appointment of Ziyad ibn Abi Sufyan to Basra, among that year's reports in the index of volume five (pp. 216 to 226) {cite:tabari-tarikh-abu-al-fadl j.5 p.629}."
  es: "En el año 45, al-Tabari registró el nombramiento de Ziyad ibn Abi Sufyan en Basora, entre los informes de ese año en el índice del volumen cinco (págs. 216 a 226) {cite:tabari-tarikh-abu-al-fadl j.5 p.629}."
  fr: "En 45, al-Tabari a enregistré la nomination de Ziyad ibn Abi Sufyan à Basra, parmi les rapports de cette année dans l'index du volume cinq (pp. 216 à 226) {cite:tabari-tarikh-abu-al-fadl j.5 p.629}."
  ur: "45 میں الطبری نے زیاد ابن ابی سفیان کی بصرہ میں تقرری کو درج کیا ہے، اس سال کی رپورٹوں میں سے جلد پانچ ⁦(صفحہ 216 تا 226)⁩ میں درج ہے۔"
  tr: "El-Tabari, 45. yılda, beşinci bölümün indeksinde (s. 216-226) bu yılın haberleri içinde Ziyad bin Abi Sufyan'ın Basra valiliğinden bahsetmiştir. {cite:tabari-tarikh-abu-al-fadl j.5 s.629}"
  id: "Pada tahun empat puluh lima, Al-Tabari menyebutkan pemerintahan Ziyad bin Abi Sufyan atas Basra, dalam berita tahun ini di indeks bagian kelima (hlm. 216 sampai 226) {cite:tabari-tarikh-abu-al-fadl j.5 p.629}."
