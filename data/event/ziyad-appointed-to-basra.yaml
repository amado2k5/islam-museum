  ar: "في سنة خمس وأربعين ذكر الطبري ولاية زياد بن أبي سفيان البصرة، ضمن أخبار هذه السنة في فهرس الجزء الخامس (ص216 إلى 226) {cite:tabari-tarikh-abu-al-fadl j.5 p.629}. ويذكر الكتاب أن معاوية عزل الحارث بن عبد الله الأزدي عن البصرة بعد أربعة أشهر، وولى زياداً في سنة خمس وأربعين {cite:bakr-umayyad-state-1134715 p. 129}."
