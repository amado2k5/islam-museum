id: event/bint-abi-nuh-funeral-riot-403
class: event
kind: other
label: { ar: "فتنة جنازة بنت أبي نوح ونهب بيعة دار الروم", en: "Riot at the funeral of Bint Abi Nuh and the plunder of the Dar al-Rum church", fr: "L'émeute aux funérailles de Bint Abi Nuh et le pillage de l'église de Dar al-Rum", es: "Disturbios durante el funeral de Bint Abi Nuh y el saqueo de la iglesia Dar al-Rum.", ur: "بنت ابی نوح کے جنازے پر ہنگامہ اور دارالرم کلیسا کی لوٹ مار" }
summary:
  ar: "في شوال سنة ثلاث وأربعمائة أُخرجت جنازة زوجة كاتب المناصح أبي الهيجاء نهاراً ومعها النوائح والطبول والزمور والرهبان والصلبان والشموع، فرجمها رجل هاشمي فشجّه أحد غلمان المناصح بدبوس، فهربت الجنازة إلى بيعة دار الروم فتبعهم المسلمون ونهبوا البيعة والدور المجاورة وثارت فتنة عظيمة ورُفعت المصاحف في الأسواق وغلقت أبواب المساجد وقُصدت دار الخليفة وامتنع الناس من صلاة الجمعة، حتى أصلح الخليفة طياره هماً بالخروج من البلد غضباً، إلى أن أُحضر كاتب المناصح وسُلم إلى دار الخلافة وكفّت العامة وأُلزم أهل الذمة الغيار {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
  en: "In Shawwal 403 the funeral of the wife of al-Munasih's secretary, Abu'l-Haja', was carried out by day, with keening women, drums, horns, monks, crosses and candles. A Hashimite man stoned the procession, and a servant of al-Munasih struck him with a mace and wounded his head; the bier fled into the church of Dar al-Rum, the Muslims pursued it and plundered the church and the houses beside it. A great strife followed: mushafs were raised in the markets, the mosque doors were shut, the caliph's palace was attacked and people stopped Friday prayer. The caliph, in anger, resolved to leave the city, until the secretary of al-Munasih was brought and handed over to the caliphal palace; the common people desisted, and the dhimmis were obliged to wear distinguishing marks {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
  fr: "En Shawwal 403, les funérailles de l'épouse du secrétaire d'al-Munasih, Abu'l-Haja', se déroulèrent de jour, avec des pleureuses, des tambours, des cors, des moines, des croix et des cierges. Un Hachémite lapida le cortège, et un serviteur d'al-Munasih le frappa d'une masse et le blessa à la tête ; le cercueil s'enfuit dans l'église de Dar al-Rum, les musulmans le poursuivirent et pillèrent l'église et les maisons voisines. Une grande discorde s'ensuivit : des mushafs furent élevés dans les marchés, les portes des mosquées furent fermées, le palais du calife fut attaqué et les gens cessèrent la prière du vendredi. Le calife, en colère, résolut de quitter la ville, jusqu'à ce que le secrétaire d'al-Munasih soit amené et livré au palais califal ; le peuple cessa alors, et les dhimmis furent obligés de porter des signes distinctifs {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
  es: "En Shawwal 403, el funeral de Abu'l-Haja', esposa del secretario de al-Munasih, se celebró de día, con mujeres llorando, tambores, cuernos, monjes, cruces y velas. Un hachemita apedreó la procesión, y un sirviente de al-Munasih lo golpeó con una maza, hiriéndole la cabeza. El féretro huyó a la iglesia de Dar al-Rum, pero los musulmanes lo persiguieron y saquearon la iglesia y las casas contiguas. Se desató una gran contienda: se levantaron mushafs en los mercados, se cerraron las puertas de las mezquitas, se atacó el palacio del califa y se suspendió la oración del viernes. El califa, enfurecido, decidió abandonar la ciudad hasta que el secretario de al-Munasih fuera entregado al palacio califal. El pueblo llano desistió, y los dhimmis se vieron obligados a llevar marcas distintivas {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
  ur: "شوال 403 میں المنصیح کے سکریٹری ابو الحجا کی بیوی کا جنازہ دن کے وقت پرجوش خواتین، ڈھول، سینگوں، راہبوں، صلیبوں اور موم بتیوں کے ساتھ ادا کیا گیا۔ ایک ہاشمی شخص نے جلوس پر سنگ باری کی، اور المناص کے ایک خادم نے اسے گدا مار کر اس کا سر زخمی کر دیا۔ بیئر بھاگ کر دارالرم کے چرچ میں داخل ہوا، مسلمانوں نے اس کا تعاقب کیا اور چرچ اور اس کے ساتھ والے مکانات کو لوٹ لیا۔ اس کے بعد ایک زبردست ہنگامہ ہوا: بازاروں میں مصحف برپا ہو گئے، مسجد کے دروازے بند کر دیے گئے، خلیفہ کے محل پر حملہ کیا گیا اور لوگوں نے نماز جمعہ ادا کرنا چھوڑ دی۔ خلیفہ نے غصے میں شہر چھوڑنے کا فیصلہ کیا، یہاں تک کہ المناص کے سیکرٹری کو لا کر خلیفہ کے محل کے حوالے کر دیا گیا۔ عام لوگ باز آ گئے، اور ذمیوں کو امتیازی نشانات پہننے کا پابند کیا گیا {حوالہ:منتظم ابن الجوزی ج.7 صفحہ 261-262}۔"
