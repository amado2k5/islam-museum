label: { ar: "فتنة جنازة بنت أبي نوح ونهب بيعة دار الروم", en: "Riot at the funeral of Bint Abi Nuh and the plunder of the Dar al-Rum church" }
summary:
  ar: "في شوال سنة ثلاث وأربعمائة أُخرجت جنازة زوجة كاتب المناصح أبي الهيجاء نهاراً ومعها النوائح والطبول والزمور والرهبان والصلبان والشموع، فرجمها رجل هاشمي فشجّه أحد غلمان المناصح بدبوس، فهربت الجنازة إلى بيعة دار الروم فتبعهم المسلمون ونهبوا البيعة والدور المجاورة وثارت فتنة عظيمة ورُفعت المصاحف في الأسواق وغلقت أبواب المساجد وقُصدت دار الخليفة وامتنع الناس من صلاة الجمعة، حتى أصلح الخليفة طياره هماً بالخروج من البلد غضباً، إلى أن أُحضر كاتب المناصح وسُلم إلى دار الخلافة وكفّت العامة وأُلزم أهل الذمة الغيار {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
  en: "In Shawwal 403 the funeral of the wife of al-Munasih's secretary, Abu'l-Haja', was carried out by day, with keening women, drums, horns, monks, crosses and candles. A Hashimite man stoned the procession, and a servant of al-Munasih struck him with a mace and wounded his head; the bier fled into the church of Dar al-Rum, the Muslims pursued it and plundered the church and the houses beside it. A great strife followed: mushafs were raised in the markets, the mosque doors were shut, the caliph's palace was attacked and people stopped Friday prayer. The caliph, in anger, resolved to leave the city, until the secretary of al-Munasih was brought and handed over to the caliphal palace; the common people desisted, and the dhimmis were obliged to wear distinguishing marks {cite:muntazam-ibn-al-jawzi j.7 p.261-262}."
