id: event/ibn-masud-and-the-uthmani-codex
class: event
kind: other
label:
  ar: "ابن مسعود والمصحف العثماني: ما نُقل عن اعتراضه ثم موافقته"
  en: "Ibn Mas'ud and the Uthmanic codex: what is reported of his objection and then his agreement"
  ur: "ابن مسعود اور مصحفِ عثمانی: ان کے اعتراض اور پھر موافقت کی روایات"
summary:
  ar: "نُقل عن عبد الله بن مسعود أنه أنكر أولاً مصاحف عثمان وأبى أن يحرق مصحفه، ثم رجع إلى الجماعة حين ظهرت له مزاياها؛ ويقول علي، فيما يروي السبت، إن عثمان ما حرّق المصاحف إلا عن ملأ من الصحابة {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 240} {cite:itqan-suyuti p. 391}."
  en: "It is reported of Abdallah ibn Mas'ud that he first objected to Uthman's codices and refused to burn his own, then returned to the community when their merits became clear to him; Ali says, as al-Sabt relays, that Uthman burned the codices only with the agreement of a group of the Companions {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 240} {cite:itqan-suyuti p. 391}."
  ur: "عبد اللہ بن مسعود کے بارے میں منقول ہے کہ انھوں نے پہلے عثمان کے مصاحف کا انکار کیا اور اپنا مصحف جلانے سے انکار کیا، پھر جب ان کی خوبیاں ظاہر ہوئیں تو جماعت میں لوٹ آئے؛ علی، جیسا کہ سبت روایت کرتے ہیں، کہتے ہیں کہ عثمان نے مصاحف صحابہ کی ایک جماعت کے اتفاق ہی سے جلائے {cite:manahil-irfan-sabt p. 239} {cite:manahil-irfan-sabt p. 240} {cite:itqan-suyuti p. 391}۔"
