id: event/ashraf-khalil-murder-693
class: event
kind: death
label: { ar: "قتل الملك الأشرف خليل سنة 693هـ", en: "The killing of al-Malik al-Ashraf Khalil in 693 AH", fr: "Le meurtre d'al-Malik al-Ashraf Khalil en 693 H", es: "El asesinato de al-Malik al-Ashraf Khalil en el año 693 de la Hégira.", ur: "693ھ میں الملک اشرف خلیل کا قتل", tr: "Kral El-Eşref Halil, Hicri 693 yılında öldürüldü.", id: "Raja Al-Ashraf Khalil terbunuh pada tahun 693 Hijriah." }
summary:
  ar: "في سنة ثلاث وتسعين وست مئة فتك بالملك الأشرف صلاح الدين خليل بن الملك المنصور الأمير بيدرا وذلك أنه جهز العسكر مع وزيره إلى القاهرة وتخلى بنفسه ليخلو مع خاصيته بسبب الصيد وترك نائبه الأمير بندار تحت الصناجق فلما كان وقت العصر وهو جالس بمفرده قدم الأمير بندار وصحبته جماعة من الأمراء فقتلوا السلطان وحلفوا البندار وسلطنوه ولقب بالملك القاهر وتوجهوا إلى مصر فلقيهم الخاصكية ومقدمهم الأمير زين الدين كتبغا فحملوا عليهم فانهزم الأمير بندار فأدركوه وقتلوه ومسكوا باقي الأمراء فقتلوهم وأقاموا الملك الناصر وخلفوا له واستقر الشجاعي وزيراً ومسك ابن السلعوس واستأصلوا أمواله وكتب إليه أحدهم تنبه يا وزير الأرض واعلم بأنك قد وطئت على الأفاعي وكن بالله معتصماً فإني أخاف عليك من نهش الشجاعي فكان كما قال فإنه مات من نهشة الشجاعي عاقبه إلى أن مات ولم يجد لنهشه درياقاً ثم إن الشجاعي عزم على قتل كتبغا فركب عليه وحصره في القلعة فقتله بعض مماليك السلطان ورموا به إلى كتبغا فسكنت الفتنة وفرح الناس بموته وطافوا به في البلد لما كان تعمد من المظالم {cite:shadharat-dhahab p. 422}."
  en: "In 693 the amir Baydara murdered al-Ashraf Salah al-Din Khalil as he sat alone after the hunt, was enthroned as al-Malik al-Qahir, then the Khasakiyya under Kitbugha routed and killed him and restored al-Nasir Muhammad; the vizier Ibn al-Sal'us was seized and stripped — warned in verse 'beware the bite of al-Shuja'i', he died of it — and when al-Shuja'i besieged Kitbugha in the Citadel the sultan's mamluks killed him and paraded him through the town to public joy {cite:shadharat-dhahab p. 422}."
  fr: "En 693, l'émir Baydara assassina al-Ashraf Salah al-Din Khalil alors qu'il était assis seul après la chasse, et fut intronisé sous le nom d'al-Malik al-Qahir ; puis les Khasakiyya menés par Kitbugha le mirent en déroute, le tuèrent et rétablirent al-Nasir Muhammad ; le vizir Ibn al-Sal'us fut saisi et dépouillé (averti en vers de « prendre garde à la morsure d'al-Shuja'i », il en mourut) ; et quand al-Shuja'i assiégea Kitbugha dans la Citadelle, les mamelouks du sultan le tuèrent et promenèrent sa dépouille dans la ville, à la joie publique {cite:shadharat-dhahab p. 422}."
  es: "En 693, el emir Baydara asesinó a al-Ashraf Salah al-Din Khalil mientras estaba sentado solo después de la cacería, fue entronizado como al-Malik al-Qahir, luego los Khasakiyya bajo Kitbugha lo derrotaron y mataron y restauraron a al-Nasir Muhammad; el visir Ibn al-Sal'us fue apresado y despojado —advertido en un verso 'cuidado con la mordedura de al-Shuja'i', murió por ella— y cuando al-Shuja'i sitió Kitbugha en la Ciudadela, los mamelucos del sultán lo mataron y lo pasearon por la ciudad para alegría pública {cite:shadharat-dhahab p. 422}."
  ur: "693 میں امیر بیدرہ نے اشرف صلاح الدین خلیل کو اس وقت قتل کر دیا جب وہ شکار کے بعد اکیلے بیٹھا تھا، الملک القاہر کے طور پر تخت نشین ہوا، پھر کتبغہ کے ماتحت خاصیہ نے اسے شکست دے کر قتل کر دیا اور النصیر محمد کو بحال کر دیا۔ وزیر ابن الصلوس کو پکڑا گیا اور اسے چھین لیا گیا - آیت 'الشجاعی کے کاٹنے سے ہوشیار رہو' میں تنبیہ کی گئی، وہ اس کی وجہ سے مر گیا - اور جب الشجاعی نے قلعہ میں کتبوغہ کا محاصرہ کیا تو سلطان کے مملوکوں نے اسے قتل کر دیا اور اسے شہر میں عوامی خوشی کے لیے لے جایا: pcidharat. 422}۔"
  tr: "Hicri 693 yılında (Miladi 1293), Sultan el-Eşref Salah el-Din Halil ibn el-Malik el-Mansur, Prens Baydar tarafından suikaste uğradı. Veziriyle birlikte Kahire'ye bir ordu hazırlamış, ardından av gezisi için sırdaşlarıyla yalnız kalmak üzere inzivaya çekilmiş ve sancakların altında vekili Prens Bundar'ı bırakmıştı. Öğle namazı vaktinde, yalnız başına otururken, Prens Bundar bir grup emirle birlikte geldi. Sultanı öldürdüler, Bundar'a biat ettiler ve onu sultan olarak tahta geçirdiler, ona el-Malik el-Kahir (Fatih) unvanını verdiler. Daha sonra Mısır'a gittiler ve orada Prens Zeyn el-Din Kitbugha liderliğindeki kraliyet muhafızlarıyla karşılaştılar. Muhafızlar onlara saldırdı ve Prens Bundar kaçtı. Onu yakalayıp öldürdüler ve kalan emirleri yakalayıp idam ettiler. Sultan el-Nasir'i tahta geçirdiler ve halefi olarak el-Şucai'yi atadılar. Şucayî vezir olarak atandı ve İbn Salus tutuklandı, servetine el konuldu. Onlardan biri ona şöyle yazdı: \"Ey ülke veziri, dikkat et ve bil ki, yılanların üzerine bastın. Allah'a sığın, çünkü Şucayî'nin ısırığından korkuyorum.\" Ve öyle de oldu; Şucayî'nin ısırığından öldü, Şucayî onu ölene kadar işkence etti ve hiçbir panzehir bulunamadı. Bunun üzerine Şucayî, Kitbugha'yı öldürmeye karar verdi, atına bindi ve onu kuşattı. Kalede, Sultan'ın Memlüklerinden bazıları onu öldürdü ve Kitbugha'ya attı, böylece çatışma dindi ve halk onun ölümüne sevindi ve işlediği haksızlıklar nedeniyle onu şehirde dolaştırdı. {kaynak: Şadharat-dhahab s. 422}"
  id: "Pada tahun 693 H (1293 M), Sultan al-Ashraf Salah al-Din Khalil ibn al-Malik al-Mansur dibunuh oleh Pangeran Baydar. Ia telah mempersiapkan pasukan bersama wazirnya untuk Kairo dan kemudian mengasingkan diri bersama para kepercayaannya untuk ekspedisi berburu, meninggalkan wakilnya, Pangeran Bundar, di bawah panji-panji. Pada waktu shalat Ashar, ketika ia sedang duduk sendirian, Pangeran Bundar tiba dengan sekelompok emir. Mereka membunuh sultan, bersumpah setia kepada Bundar, dan mengangkatnya sebagai sultan, memberinya gelar al-Malik al-Qahir (Sang Penakluk). Kemudian mereka melanjutkan perjalanan ke Mesir, di mana mereka disambut oleh pengawal kerajaan, yang dipimpin oleh Pangeran Zayn al-Din Kitbugha. Para pengawal menyerang mereka, dan Pangeran Bundar melarikan diri. Mereka mengejarnya dan membunuhnya, serta menangkap dan mengeksekusi emir-emir yang tersisa. Mereka mengangkat Sultan al-Nasir dan menunjuk al-Shuja'i sebagai penggantinya. Al-Shuja'i diangkat menjadi wazir, dan Ibn al-Sal'us ditangkap serta hartanya disita. Salah seorang dari mereka menulis kepadanya: \"Waspadalah, wazir negeri ini, dan ketahuilah bahwa engkau telah menginjak ular berbisa. Berlindunglah kepada Allah, karena aku khawatir engkau akan digigit oleh al-Shuja'i.\" Dan memang demikianlah yang terjadi, karena ia meninggal akibat gigitan al-Shuja'i, yang menyiksanya hingga ia meninggal, dan tidak ada penawar yang dapat ditemukan. Kemudian al-Shuja'i memutuskan untuk membunuh Kitbugha, jadi ia menunggang kudanya dan mengepungnya. Di benteng, beberapa Mamluk Sultan membunuhnya dan melemparkannya kepada Kitbugha, sehingga perselisihan mereda dan orang-orang bersukacita atas kematiannya dan mengaraknya keliling kota karena ketidakadilan yang telah dilakukannya. {cite:shadharat-dhahab p. 422}."
