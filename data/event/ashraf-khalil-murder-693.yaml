label: { ar: "قتل الملك الأشرف خليل سنة 693هـ" }
summary:
  ar: "في سنة ثلاث وتسعين وست مئة فتك بالملك الأشرف صلاح الدين خليل بن الملك المنصور الأمير بيدرا وذلك أنه جهز العسكر مع وزيره إلى القاهرة وتخلى بنفسه ليخلو مع خاصيته بسبب الصيد وترك نائبه الأمير بندار تحت الصناجق فلما كان وقت العصر وهو جالس بمفرده قدم الأمير بندار وصحبته جماعة من الأمراء فقتلوا السلطان وحلفوا البندار وسلطنوه ولقب بالملك القاهر وتوجهوا إلى مصر فلقيهم الخاصكية ومقدمهم الأمير زين الدين كتبغا فحملوا عليهم فانهزم الأمير بندار فأدركوه وقتلوه ومسكوا باقي الأمراء فقتلوهم وأقاموا الملك الناصر وخلفوا له واستقر الشجاعي وزيراً ومسك ابن السلعوس واستأصلوا أمواله وكتب إليه أحدهم تنبه يا وزير الأرض واعلم بأنك قد وطئت على الأفاعي وكن بالله معتصماً فإني أخاف عليك من نهش الشجاعي فكان كما قال فإنه مات من نهشة الشجاعي عاقبه إلى أن مات ولم يجد لنهشه درياقاً ثم إن الشجاعي عزم على قتل كتبغا فركب عليه وحصره في القلعة فقتله بعض مماليك السلطان ورموا به إلى كتبغا فسكنت الفتنة وفرح الناس بموته وطافوا به في البلد لما كان تعمد من المظالم {cite:shadharat-dhahab p. 422}."
  en: "In 693 the amir Baydara murdered al-Ashraf Salah al-Din Khalil as he sat alone after the hunt, was enthroned as al-Malik al-Qahir, then the Khasakiyya under Kitbugha routed and killed him and restored al-Nasir Muhammad; the vizier Ibn al-Sal'us was seized and stripped — warned in verse 'beware the bite of al-Shuja'i', he died of it — and when al-Shuja'i besieged Kitbugha in the Citadel the sultan's mamluks killed him and paraded him through the town to public joy {cite:shadharat-dhahab p. 422}."
