label: { ar: "خبر هارون الشاري والظفر به", en: "Report of Harun al-Shari and His Capture", fr: "Le récit de Harun al-Shari et de sa capture", es: "Informe sobre Harun al-Shari y su captura.", ur: "ہارون الشریع اور اس کی گرفتاری کی رپورٹ", tr: "Harun el-Şari'nin ve yakalanmasının haberi.", id: "Berita tentang Harun al-Shari dan penangkapannya" }
summary:
  ar: "في سنة ثلاث وثمانين ومائتين ذكر الطبري خبر هارون الشاري والظفر به؛ فقد خرج المعتضد إلى الموصل في المحرم، ووجّه الحسين بن حمدان في طلبه، ووصل كتاب بظفره به إلى بغداد في ربيع الأول {cite:tabari-tarikh-abu-al-fadl j.10 p.43}."
  en: "In the year 283 Tabari records the report of Harun al-Shari and his capture: al-Mu'tadid set out for Mosul in Muharram and sent al-Husayn ibn Hamdan in pursuit, and a letter announcing his capture reached Baghdad in Rabi' I {cite:tabari-tarikh-abu-al-fadl j.10 p.43}."
  fr: "En l'an 283, al-Tabari consigne le récit de Harun al-Shari et de sa capture : al-Mu'tadid partit pour Mossoul en Muharram et envoya al-Husayn ibn Hamdan à sa poursuite, et une lettre annonçant sa capture parvint à Bagdad en Rabi' I {cite:tabari-tarikh-abu-al-fadl j.10 p.43}."
  es: "En el año 283, Tabari registra el informe de Harun al-Shari y su captura: al-Mu'tadid partió hacia Mosul en Muharram y envió a al-Husayn ibn Hamdan en su persecución, y una carta que anunciaba su captura llegó a Bagdad en Rabi' I {cite:tabari-tarikh-abu-al-fadl j.10 p.43}."
  ur: "سنہ 283 میں طبری نے ہارون الشریع اور اس کی گرفتاری کی رپورٹ درج کی ہے: المتعدید محرم میں موصل کے لیے روانہ ہوا اور اس کے تعاقب میں الحسین بن حمدان کو بھیجا، اور ربیع الثانی میں اس کی گرفتاری کا اعلان کرنے والا ایک خط بغداد پہنچا۔"
  tr: "Hicri 283 yılında Taberi, Harun el-Şeri'nin haberini ve ona karşı kazanılan zaferi zikretti. Mu'tedid Muharrem ayında Musul'a gitti ve onu bulmak için Hüseyin ibn Hamdan'ı gönderdi; onun üzerindeki zaferine dair bir mektup Rabi' el-Evvel ayında Bağdat'a ulaştı. {cite:tabari-tarikh-abu-al-fadl j.10 p.43}"
  id: "Pada tahun 283 H, al-Tabari menyebutkan kabar tentang Harun al-Shari dan kemenangan atas dirinya. Al-Mu’tadid pergi ke Mosul pada bulan Muharram, dan mengutus al-Husayn ibn Hamdan untuk mencarinya, dan surat tentang kemenangannya atas Harun al-Shari sampai ke Baghdad pada bulan Rabi’ al-Awwal. {cite:tabari-tarikh-abu-al-fadl j.10 p.43}."
