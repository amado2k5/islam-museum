label: { ar: "موقعة مرج راهط", en: "Battle of Marj Rahit" }
summary:
  ar: "في نهاية سنة 64هـ وقعت بمرج راهط شرقي دمشق معركة بين مروان بن الحكم وأنصار بني أمية من جهة، وأنصار عبد الله بن الزبير من جهة أخرى، وكان النصر فيها لمروان، فكانت بداية استعادة الأمويين لدولتهم التي كانت قاب قوسين من الزوال {cite:umayyad-birth-to-fall-2006 p. 30}."
  en: "At the end of 64 AH a battle was fought at Marj Rahit, east of Damascus, between Marwan ibn al-Hakam and the supporters of the Umayyads on one side, and the supporters of Abd Allah ibn al-Zubayr on the other. Victory went to Marwan, and it marked the beginning of the Umayyads' recovery of their state, which had come within two bow-lengths of collapse {cite:umayyad-birth-to-fall-2006 p. 30}."
