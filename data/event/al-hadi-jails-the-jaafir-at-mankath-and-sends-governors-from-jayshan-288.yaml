id: event/al-hadi-jails-the-jaafir-at-mankath-and-sends-governors-from-jayshan-288
class: event
label:
  ar: "الهادي يحبس الجعافر بمنكث ويوجه العمال من جيشان، ربيع الأول 288هـ"
  en: "Al-Hadi jails the Ja'afir at Mankath, Abu al-Ushayra joins him and he sends governors from Jayshan, Rabi I 288 AH"
  ur: "ہادی منکث میں جعافر کو قید کرتے ہیں، ابو العشیرہ ان سے آ ملتے ہیں اور وہ جیشان سے عامل بھیجتے ہیں، ربیع الاول 288ھ"
summary:
  ar: "يخبر أبو العتاهية الهادي وهو بمنكث أن جماعة من الجعافر عزموا على إثارة فتنة في العسكر، فيأمر بجمعهم وإرسالهم إلى صنعاء ليُحبسوا في الحديد فينفذ عبد الله بن الحسين ذلك، ثم يقدم أبو العشيرة بن الروية بعسكر كثيف ويولي الهادي منكث عبد الله بن الحسين الفطيمي، وينزل جيشان ثلاثة أيام ويوجه علي بن در إلى عدن ويخلف أبا عبد الله الرازي."
  en: "At Mankath Abu al-Atahiya tells al-Hadi that a body of the Ja'afir have resolved to stir sedition in the army; al-Hadi has them all gathered and sent to Sana'a to be held in irons, and Abdullah ibn al-Husayn carries it out; Abu al-Ushayra ibn al-Ruwayya arrives with a dense army, al-Hadi puts Abdullah ibn al-Husayn al-Futayimi over Mankath, halts three days at Jayshan, sends Ali ibn Dirr to Aden and leaves Abu Abd Allah al-Razi behind."
  ur: "منکث میں ابو العتاہیہ ہادی کو بتاتے ہیں کہ جعافر کی ایک جماعت نے لشکر میں فتنہ اٹھانے کا ارادہ کیا ہے؛ ہادی ان سب کو جمع کر کے صنعاء بھیجنے کا حکم دیتے ہیں تاکہ وہ بیڑیوں میں قید رہیں اور عبد اللہ بن حسین اس پر عمل کرتے ہیں؛ ابو العشیرہ ابن الرویہ گھنے لشکر کے ساتھ آتے ہیں، ہادی عبد اللہ بن حسین فطیمی کو منکث کا والی بناتے ہیں، جیشان میں تین دن ٹھہرتے ہیں، علی بن درّ کو عدن بھیجتے ہیں اور ابو عبد اللہ رازی کو وہاں چھوڑتے ہیں۔"
