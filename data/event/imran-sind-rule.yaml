label: { ar: "ولاية عمران بن موسى السند وحربه الزط والميد", en: "Imran ibn Musa's Sind and the Zutt-Mayd Wars", es: "El Sind de Imran ibn Musa y las guerras de Zutt-Mayd", fr: "Le Sind d'Imran ibn Musa et les guerres de Zutt-Mayd", ur: "عمران بن موسیٰ کی سندھ اور غزوہ مید کی جنگیں", tr: "İmran ibn Musa el-Sind'in valiliği ve Zutt ile Mid'e karşı savaşı", id: "Masa pemerintahan Imran ibn Musa al-Sind dan perangnya melawan Zutt dan Mid" }
summary:
  ar: "كتب المعتصم لعمران بن موسى بولاية الثغر فخرج إلى القيقان وهم زط فقاتلهم فقلبهم وبنى مدينة سماها البيضاء وأسكنها الجند ثم أتى المنصورة وصار منها إلى قندابيل وهي مدينة على جبل وفيها متغلب يقال له محمد بن الخليل فقاتله وفتحها وحمل رؤساءها إلى قصدار ثم غزا الميد فقتل منهم ثلاثة آلاف وسكر سكراً يعرف بسكر الميد وعسكر عمران على نهر الرور ثم نادى بالزط الذين بحضرته فأتوه فختم أيديهم وأخذ الجزية منهم وأمرهم بأن يكون مع كل رجل منهم إذا اعترض عليه كلب فبلغ الكلب خمسين درهماً ثم غزا الميد ومعه وجوه الزط فحفر من البحر نهراً أجراه في بطيحتهم حتى ملح ماؤهم وشن الغارات عليهم ثم وقعت العصبية بين النزارية واليمانية فمال عمران إلى اليمانية فسار إليه عمر بن عبد العزيز الهباري فقتله وهو غار وكان جد عمر هذا ممن قدم السند مع الحكم بن عوانة الكلبي."
  en: "Al-Mu'tasim gave Imran ibn Musa the thaghr: he drove the Zutt of Qiqan, built al-Bayda and garrisoned it; took hill-top Qandabil from the mutaghallib Muhammad ibn al-Khalil and carried its chiefs to Qusdar; slew three thousand Mayd at Sikkar al-Mayd. On the Rur river he hand-stamped the Zutt, took their jizya, and bound each to keep a dog — till a dog fetched fifty dirhams — then raided the Mayd with Zutt chiefs, cutting a sea-channel that made their marsh water brackish. When Nizari-Yamani strife rose he leaned to the Yemenis, and Umar ibn Abd al-Aziz al-Habbari — whose grandfather came with al-Hakam — killed him unawares."
  es: "Al-Mu'tasim le dio a Imran ibn Musa el thaghr: expulsó a los Zutt de Qiqan, construyó al-Bayda y la guarneció; tomó Qandabil, en la cima de una colina, del mutaghallib Muhammad ibn al-Khalil y llevó a sus jefes a Qusdar; mató a tres mil Mayd en Sikkar al-Mayd. En el río Rur, marcó a mano a los Zutt, les quitó su jizya y los obligó a tener un perro —hasta que un perro valiera cincuenta dirhams—, luego asaltó a los Mayd con los jefes Zutt, abriendo un canal marítimo que convirtió el agua de sus marismas en salobre. Cuando aumentó el conflicto entre Nizari y Yamani, se inclinó hacia los yemeníes, y Umar ibn Abd al-Aziz al-Habbari —cuyo abuelo llegó con al-Hakam— lo mató sin saberlo."
  fr: "Al-Mu'tasim remit Imran ibn Musa au pouvoir: il chassa les Zutt de Qiqan, fonda al-Bayda et y établit une garnison; il prit la ville de Qandabil, perchée sur une colline, au mutaghallib Muhammad ibn al-Khalil et emmena ses chefs à Qusdar; il massacra trois mille Mayd à Sikkar al-Mayd. Sur les rives du Rur, il soumit les Zutt, préleva leur jizya et obligea chacun à garder un chien – jusqu'à ce qu'un chien rapporte cinquante dirhams – puis il pilla les Mayd avec des chefs Zutt, creusant un chenal qui rendit l'eau de leurs marais saumâtre. Lorsque les conflits entre Nizari et Yéménites s'intensifièrent, il se rallia aux Yéménites, et Umar ibn Abd al-Aziz al-Habbari – dont le grand-père avait accompagné al-Hakam – le tua par surprise."
  ur: "معتصم نے عمران بن موسیٰ کو طاغر دیا: اس نے ققان کی زت کو بھگا دیا، البیضاء بنایا اور اس کی چوکیداری کی۔ مطغلب محمد بن الخلیل سے پہاڑی کی چوٹی قندبیل چھین کر اس کے سرداروں کو قصدر لے گئے۔ تین ہزار مید کو سکھر المید میں قتل کیا۔ دریائے رُور پر اس نے زت پر ہاتھ سے مہر لگائی، ان کا جزیہ لیا، اور ہر ایک کو ایک کتا رکھنے کا پابند کیا - یہاں تک کہ ایک کتا پچاس درہم لے آیا - پھر زت کے سرداروں کے ساتھ مید پر چڑھائی کی، ایک سمندری نالہ کاٹ دیا جس سے ان کے دلدل کا پانی کھارا ہو گیا۔ جب نزاری یمنی تنازعہ کھڑا ہوا تو وہ یمنیوں کی طرف جھک گیا، اور عمر بن عبد العزیز الحباری - جن کے دادا الحکم کے ساتھ آئے تھے - نے بے خبری میں اسے قتل کردیا۔"
  tr: "El-Mu'tasim, İmran bin Musa'ya sınır bölgesinin valisi olarak atayan bir mektup yazdı. İmran, Zutt kabilesinden olan Kaykan kabilesine gitti ve onlarla savaşarak onları alt etti. El-Bayda adında bir şehir kurdu ve oraya asker yerleştirdi. Sonra El-Mansur'a geldi ve oradan dağda kurulu bir şehir olan Kandabil'e gitti. Kandabil'de Muhammed bin El-Halil adında bir isyancı vardı. Onunla savaştı, şehri fethetti ve liderlerini Kasdar'a götürdü. Sonra El-Mayd'a baskın düzenledi, üç bin kişiyi öldürdü ve El-Mayd şeker kamışı olarak bilinen bir şeker kamışı yetiştirdi. İmran, El-Rur nehri kıyısında kamp kurdu, sonra yanında bulunan Zutt kabilesine seslendi ve onlar da yanına geldiler. Ellerini mühürledi, cizyelerini aldı ve saldırıya uğradıkları takdirde her birinin yanında bir köpek bulundurmalarını emretti. Köpeğin fiyatı elli dirhemdi. Sonra Zutt liderleriyle birlikte El-Mayd'a baskın düzenledi ve denizden bir nehir kazarak bataklıklarına akıttı, böylece suları tuzlu hale geldi. Onlara karşı baskınlar düzenledi. Bunun üzerine Nizarlar ve Yemenliler arasında kabilecilik patlak verdi ve İmran Yemenlilerin safına geçti. Bunun üzerine Ömer bin Abdül Aziz el-Haberi ona gidip bir mağarada iken onu öldürdü. Bu Ömer'in dedesi, El-Hakam bin Avana el-Kalbi ile birlikte Sindh'e gelenlerden biriydi."
  id: "Al-Mu'tasim menulis surat kepada Imran bin Musa dan menunjuknya sebagai gubernur wilayah perbatasan. Ia pergi ke Qayqan, yang merupakan suku Zutt, dan memerangi mereka, mengalahkan mereka. Ia membangun sebuah kota bernama Al-Bayda dan menempatkan tentara di sana. Kemudian ia datang ke Al-Mansura dan dari sana pergi ke Qandabil, sebuah kota di atas gunung, dan di sana ada seorang pemberontak bernama Muhammad bin Al-Khalil. Ia memeranginya dan menaklukkannya serta membawa para pemimpinnya ke Qasdar. Kemudian ia menyerbu Al-Mayd dan membunuh tiga ribu orang dari mereka dan membuat tebu yang dikenal sebagai tebu Al-Mayd. Imran berkemah di sungai Al-Rur, kemudian ia memanggil suku Zutt yang berada di hadapannya, sehingga mereka datang kepadanya. Ia mengikat tangan mereka dan mengambil jizya dari mereka dan memerintahkan mereka untuk membawa seekor anjing bersama masing-masing jika mereka diserang. Anjing itu berharga lima puluh dirham. Kemudian ia menyerang Al-Mayd bersama para pemimpin Zutt, dan ia menggali sungai dari laut dan membuatnya mengalir di rawa mereka hingga air mereka menjadi asin. Ia melancarkan serangan terhadap mereka. Kemudian permusuhan antar suku antara Nizar dan Yaman pecah, dan Imran memihak Yaman. Maka Umar bin Abdul Aziz Al-Habari mendatanginya dan membunuhnya saat ia berada di dalam gua. Kakek Umar ini adalah salah satu orang yang datang ke Sindh bersama Al-Hakam bin Awana Al-Kalbi."
