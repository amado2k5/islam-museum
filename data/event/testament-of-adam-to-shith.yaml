id: event/testament-of-adam-to-shith
class: event
kind: death
label:
  ar: وصية آدم إلى شيث ووفاته ودفنه
  en: Testament of Adam to Shith and his death
  ur: آدم کی شیث کو وصیت اور ان کی وفات
  es: "Testamento de Adán a Shith y su muerte."
summary:
  ar: يروي ابن كثير عن ابن إسحاق أن آدم لما حضرته الوفاة عهد إلى ابنه شيث وعلّمه ساعات الليل والنهار وأعلمه بالطوفان {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 72}؛ وتذكر الروايات أن الملائكة جاءته بحنوط وكفن من الجنة فغسّلوه وكفّنوه ولحدوا له وصلّوا عليه {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 168}. ويختلف الرواة في موضع قبره بين جبل الهند الذي أُهبط عليه وجبل أبي قبيس بمكة وبيت المقدس {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 169}.
  en: 'Ibn Kathir relays from Ibn Ishaq that when death approached Adam he entrusted his son Shith, taught him the hours of night and day and told him of the Flood {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 72}; the reports say angels brought perfume and a shroud from Paradise, washed and shrouded him, dug the niche grave and prayed over him {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 168}. Narrators differ over his grave: the mountain in India where he was sent down, Mount Abu Qubays at Mecca, or Bayt al-Maqdis {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 169}.'
  ur: ابن کثیر ابن اسحاق سے نقل کرتے ہیں کہ آدم نے وفات کے وقت اپنے بیٹے شیث کو وصیت کی، انھیں رات دن کی گھڑیاں سکھائیں اور طوفان کی خبر دی {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 72}؛ روایات کے مطابق فرشتے جنت سے حنوط اور کفن لائے، غسل دیا، کفن پہنایا، لحد کھودی اور نماز پڑھی {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 168}۔ قبر کے بارے میں راوی ہند کے پہاڑ، مکہ کے جبل ابی قبیس اور بیت المقدس کے بیچ اختلاف کرتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 169}۔
  es: "Ibn Kathir relata de Ibn Ishaq que cuando la muerte se acercó a Adán, le confió a su hijo Shith, le enseñó las horas de la noche y del día y le habló del Diluvio {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 72}; los relatos dicen que los ángeles trajeron perfume y una mortaja del Paraíso, lo lavaron y lo amortajaron, cavaron la tumba en nicho y oraron por él {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {cite:tarikh-al-tabari scan vol. 2 p. 168}. Los narradores difieren sobre su tumba: la montaña en la India a la que fue enviado, el Monte Abu Qubays en La Meca, o Bayt al-Maqdis {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 73} {citar: escaneo de tarikh-al-tabari vol. 2p. 169}."
