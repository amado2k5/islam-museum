class: event
kind: other
label:
  ar: أحمد بن الضحاك ومروّع بن عبد الله عن دعاء الهادي على أبي محجن وجفتم، 286هـ
  en: Ahmad ibn al-Dahhak and Murawwi ibn Abdullah on al-Hadi's prayers against Abu Mihjan and Jaftam, 286 AH
  fr: "Ahmad ibn al-Dahhak et Murawwi ibn Abdullah sur les prières d’al-Hadi contre Abu Mihjan et Jaftam, 286 de l’hégire"
  ur: احمد بن ضحاک اور مروّع بن عبداللہ کی ابو محجن اور جفتم کے خلاف ہادی کی دعاؤں کی بابت روایت، 286ھ
  es: "Ahmad ibn al-Dahhak y Murawwi ibn Abdullah sobre las oraciones de al-Hadi contra Abu Mihjan y Jaftam, 286 AH"
  tr: "Ahmed ibn el-Dahhak ve Marwa' ibn Abdullah, el-Hadi'nin Ebu Mihjan ve Jaftam'a karşı duası üzerine, 286 H."
  id: "Ahmad ibn al-Dahhak dan Marwa’ ibn Abdullah, tentang doa al-Hadi terhadap Abu Mihjan dan Jaftam, 286 H."
summary:
  ar: يروي محمد بن سليمان عن أحمد بن الضحاك قاضي همدان وفقيهها، وعن مروّع بن عبد الله الصائدي، أنهما بايعا يحيى بن الحسين وهما يعلمان أنه أقوم الناس بحق الله، ورأيا علامة ذلك في دعائه على أبي محجن عبد آل يعفر الذي أخذ رسوله وحلق رأسه ولحيته وضربه فابتُلي في يديه حتى مات، وفي دعائه على جفتم فخرج من اليمن قبل أن يحول الحول، ثم يرويه عن ابن أبي محجن أبي العتاهية.
  en: Muhammad ibn Sulayman relates from Ahmad ibn al-Dahhak, qadi and jurist of Hamdan, and Murawwi ibn Abdullah al-Sa'idi that they pledged to Yahya ibn al-Husayn knowing him the most upright of men in God's right, and saw a sign of it in his prayer against Abu Mihjan, of the slaves of Al Ya'fur, who seized his messenger, shaved his head and beard and struck him, and was afflicted in his hands until he died, and in his prayer against Jaftam, who left Yemen before the year had turned; the report is repeated from a son called Abu al-Atahiya.
  fr: "Muhammad ibn Sulayman rapporte d’Ahmad ibn al-Dahhak, cadi et juriste de Hamdan, et de Murawwi ibn Abdullah al-Sa'idi qu’ils prêtèrent allégeance à Yahya ibn al-Husayn en le tenant pour le plus droit des hommes envers les droits de Dieu. Ils en virent un signe dans sa prière contre Abu Mihjan, esclave des Al Ya'fur, qui avait saisi son messager, rasé sa tête et sa barbe et l’avait frappé, puis souffert des mains jusqu’à sa mort ; et dans sa prière contre Jaftam, qui quitta le Yémen avant la fin de l’année. Le récit est repris d’un fils nommé Abu al-Atahiya."
  ur: محمد بن سلیمان قاضی اور فقیہِ ہمدان احمد بن ضحاک اور مروّع بن عبداللہ صائدی سے روایت کرتے ہیں کہ ان دونوں نے یحییٰ بن حسین سے بیعت کی یہ جانتے ہوئے کہ وہ اللہ کے حق کو سب سے زیادہ قائم کرنے والے ہیں، اور اس کی نشانی ان کی اس دعا میں دیکھی جو انہوں نے ابو محجن، آل یعفر کے غلام، کے خلاف کی جس نے ان کے قاصد کو پکڑا، اس کا سر اور داڑھی مونڈی اور اسے مارا اور وہ ہاتھوں میں مبتلا ہو کر مر گیا، اور جفتم کے خلاف دعا میں کہ وہ سال گزرنے سے پہلے یمن سے نکل گیا؛ یہ بات ابو العتاہیہ نامی ایک بیٹے سے بھی دہرائی جاتی ہے۔
  es: "Muhammad ibn Sulayman relata de Ahmad ibn al-Dahhak, cadí y jurista de Hamdan, y Murawwi ibn Abdullah al-Sa'idi que juraron lealtad a Yahya ibn al-Husayn, conociéndolo como el más recto de los hombres ante Dios, y vieron una señal de ello en su oración contra Abu Mihjan, de los esclavos de Al Ya'fur, quien apresó a su mensajero, le afeitó la cabeza y la barba y lo golpeó, y fue afligido en sus manos hasta morir, y en su oración contra Jaftam, quien abandonó Yemen antes de que terminara el año; el relato es repetido por un hijo llamado Abu al-Atahiya."
  tr: "Muhammed bin Süleyman, Hamadan'ın kadısı ve hukukçusu Ahmed bin el-Dahhak'tan ve Merve bin Abdullah el-Sa'idi'den rivayetle, Allah'ın haklarını savunmada en dürüst insan olduğunu bildikleri Yahya bin el-Hüseyin'e biat ettiklerini, bunun işaretini ise Ebu Mahjan Abdül Yafur'a karşı yaptığı duada gördüklerini; Ebu Mahjan'ın elçisini alıp başını ve sakalını tıraş edip dövdüğünü, bu yüzden Yahya'nın onun elinden eziyet görüp öldüğünü ve Yaftam'a karşı yaptığı duada da Yahya'nın bir yıl geçmeden Yemen'den ayrıldığını anlatır. Sonra bunu İbn Ebu Mahjan, Ebu el-Atahiye'den rivayet eder."
  id: "Muhammad bin Sulayman meriwayatkan dari Ahmad bin al-Dahhak, hakim dan ahli hukum Hamadan, dan dari Marwa’ bin Abdullah al-Sa’idi, bahwa mereka berbaiat kepada Yahya bin al-Husayn, karena mengetahui bahwa dia adalah orang yang paling jujur dalam menegakkan hak-hak Allah, dan mereka melihat tanda itu dalam doanya melawan Abu Mahjan Abd Al Ya’fur, yang mengambil utusannya, mencukur kepala dan janggutnya, dan memukulinya, sehingga dia menderita di tangannya sampai mati, dan dalam doanya melawan Jaftam, sehingga dia meninggalkan Yaman sebelum setahun berlalu. Kemudian dia meriwayatkannya dari Ibn Abi Mahjan, Abu al-Atahiyah."
