id: event/ahmad-ibn-al-dahhak-and-murawwi-on-al-hadis-prayers-against-abu-mihjan-and-jaftam-286
class: event
kind: other
label:
  ar: أحمد بن الضحاك ومروّع بن عبد الله عن دعاء الهادي على أبي محجن وجفتم، 286هـ
  en: Ahmad ibn al-Dahhak and Murawwi ibn Abdullah on al-Hadi's prayers against Abu Mihjan and Jaftam, 286 AH
  ur: احمد بن ضحاک اور مروّع بن عبداللہ کی ابو محجن اور جفتم کے خلاف ہادی کی دعاؤں کی بابت روایت، 286ھ
summary:
  ar: يروي محمد بن سليمان عن أحمد بن الضحاك قاضي همدان وفقيهها، وعن مروّع بن عبد الله الصائدي، أنهما بايعا يحيى بن الحسين وهما يعلمان أنه أقوم الناس بحق الله، ورأيا علامة ذلك في دعائه على أبي محجن عبد آل يعفر الذي أخذ رسوله وحلق رأسه ولحيته وضربه فابتُلي في يديه حتى مات، وفي دعائه على جفتم فخرج من اليمن قبل أن يحول الحول، ثم يرويه عن ابن أبي محجن أبي العتاهية.
  en: Muhammad ibn Sulayman relates from Ahmad ibn al-Dahhak, qadi and jurist of Hamdan, and Murawwi ibn Abdullah al-Sa'idi that they pledged to Yahya ibn al-Husayn knowing him the most upright of men in God's right, and saw a sign of it in his prayer against Abu Mihjan, of the slaves of Al Ya'fur, who seized his messenger, shaved his head and beard and struck him, and was afflicted in his hands until he died, and in his prayer against Jaftam, who left Yemen before the year had turned; the report is repeated from a son called Abu al-Atahiya.
  ur: محمد بن سلیمان قاضی اور فقیہِ ہمدان احمد بن ضحاک اور مروّع بن عبداللہ صائدی سے روایت کرتے ہیں کہ ان دونوں نے یحییٰ بن حسین سے بیعت کی یہ جانتے ہوئے کہ وہ اللہ کے حق کو سب سے زیادہ قائم کرنے والے ہیں، اور اس کی نشانی ان کی اس دعا میں دیکھی جو انہوں نے ابو محجن، آل یعفر کے غلام، کے خلاف کی جس نے ان کے قاصد کو پکڑا، اس کا سر اور داڑھی مونڈی اور اسے مارا اور وہ ہاتھوں میں مبتلا ہو کر مر گیا، اور جفتم کے خلاف دعا میں کہ وہ سال گزرنے سے پہلے یمن سے نکل گیا؛ یہ بات ابو العتاہیہ نامی ایک بیٹے سے بھی دہرائی جاتی ہے۔
