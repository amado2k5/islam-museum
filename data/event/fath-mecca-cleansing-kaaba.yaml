id: event/fath-mecca-cleansing-kaaba
class: event
kind: other
label: { en: "The cleansing of the Kaaba and destruction of idols", ar: "تطهير الكعبة وتكسير الأصنام" }
summary:
  en: "Upon entering the sacred precinct, the Prophet circumambulated the Kaaba on his mount, toppled three hundred and sixty lead-fastened idols with his staff while reciting Qur'an 17:81, opened the sanctuary with Uthman ibn Talha's key, effaced the wall frescoes inside while reciting Qur'an 3:67, and had Bilal deliver the adhan from atop the roof."
  ar: "طاف النبي بالبيت على راحلته، وأشار بقضيب في يده إلى 360 صنمًا مشدودة بالرصاص حول الكعبة فجعلت تسقط وهو يتلو 17:81، ثم تسلم المفتاح من عثمان بن طلحة، وطمس الصور وتماثيل الأزلام بداخلها متلوًّا 3:67، وأمر بلالاً فأذن من فوق ظهر الكعبة."
