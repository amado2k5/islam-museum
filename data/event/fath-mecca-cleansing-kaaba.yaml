id: event/fath-mecca-cleansing-kaaba
class: event
kind: other
label: { en: "The cleansing of the Kaaba and destruction of idols", ar: "تطهير الكعبة وتكسير الأصنام", es: "La purificación de la Kaaba y la destrucción de los ídolos.", fr: "Le nettoyage de la Kaaba et la destruction des idoles", ur: "کعبہ کی صفائی اور بتوں کو مسمار کرنا", tr: "Kabe'nin temizlenmesi ve putların yok edilmesi", id: "Menyucikan Ka'bah dan menghancurkan berhala-berhala" }
summary:
  en: "Upon entering the sacred precinct, the Prophet circumambulated the Kaaba on his mount, toppled three hundred and sixty lead-fastened idols with his staff while reciting Qur'an 17:81, opened the sanctuary with Uthman ibn Talha's key, effaced the wall frescoes inside while reciting Qur'an 3:67, and had Bilal deliver the adhan from atop the roof."
  ar: "طاف النبي بالبيت على راحلته، وأشار بقضيب في يده إلى 360 صنمًا مشدودة بالرصاص حول الكعبة فجعلت تسقط وهو يتلو 17:81، ثم تسلم المفتاح من عثمان بن طلحة، وطمس الصور وتماثيل الأزلام بداخلها متلوًّا 3:67، وأمر بلالاً فأذن من فوق ظهر الكعبة."
  es: "Al entrar en el recinto sagrado, el Profeta circunvaló la Kaaba a lomos de su montura, derribó trescientos sesenta ídolos sujetos con plomo con su bastón mientras recitaba el Corán 17:81, abrió el santuario con la llave de Uthman ibn Talha, borró los frescos de las paredes interiores mientras recitaba el Corán 3:67, e hizo que Bilal pronunciara el adhan desde lo alto del tejado."
  fr: "En entrant dans l'enceinte sacrée, le Prophète fit le tour de la Kaaba sur sa monture, renversa trois cent soixante idoles lestées de plomb avec son bâton tout en récitant le Coran 17:81, ouvrit le sanctuaire avec la clé d'Uthman ibn Talha, effaça les fresques murales à l'intérieur tout en récitant le Coran 3:67 et fit dire l'adhan à Bilal depuis le toit."
  ur: "احاطے میں داخل ہونے کے بعد، نبی نے اپنی سواری پر خانہ کعبہ کا طواف کیا، 17:81 کی تلاوت کرتے ہوئے اپنے عصا کے ساتھ سیسہ پلائی ہوئی تین سو ساٹھ بتوں کو گرایا، عثمان بن طلحہ کی چابی سے حرم کو کھولا، دیوار کے فریسکوز کو مٹا دیا، اور قرآن مجید کی تلاوت کرتے ہوئے: چھت کے اوپر."
  tr: "Peygamber, bineğiyle Kabe'nin etrafında tavaf etti ve elindeki bir sopayla Kabe'nin etrafına kurşunla bağlanmış 360 putu işaret etti; 17:81 ayetini okurken putlar düşmeye başladı. Sonra Osman bin Talha'dan anahtarı aldı ve 3:67 ayetini okuyarak içindeki ok heykellerini ve resimlerini yok etti ve Bilal'e Kabe'nin tepesinden ezan okumasını emretti."
  id: "Nabi mengelilingi Baitullah dengan kendaraannya, dan menunjuk dengan tongkat di tangannya ke 360 berhala yang diikat dengan timah di sekeliling Ka'bah, dan berhala-berhala itu mulai berjatuhan sementara beliau membaca ayat 17:81. Kemudian beliau menerima kunci dari Utsman bin Talha, dan menghancurkan gambar dan patung-patung anak panah di dalamnya sambil membaca ayat 3:67, dan memerintahkan Bilal untuk mengumandangkan azan dari puncak Ka'bah."
