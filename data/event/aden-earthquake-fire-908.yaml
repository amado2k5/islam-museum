label: { ar: "زلازل عدن وحريقها العظيم 908هـ", en: "Aden's earthquakes and great fire, 908", fr: "Séismes et grand incendie d’Aden, 908", es: "Los terremotos y el gran incendio de Adén, 908", ur: "عدن کے زلزلے اور عظیم آگ، 908", tr: "Hicri 908 yılında Aden'de meydana gelen depremler ve büyük yangın.", id: "Gempa bumi dan kebakaran besar di Aden pada tahun 908 Hijriah" }
summary:
  ar: "في سنة ثمان وتسعمائة حصل بمدينة عدن زلازل عظيمة تواترت ليلاً ونهاراً، ووقع بها حريق عظيم احترقت فيه دور كثيرة بلغ عدتها تسعمائة بيت، وذهب من الأموال والأنفس ما لا يعلمه إلا الله {cite:shadharat-dhahab p. 453}. ومن حرائق عدن المذكورة في المصدر أيضاً حريق سنة أربع عشرة {cite:shadharat-dhahab p. 478}."
  en: "In 908 the city of Aden was struck by great earthquakes recurring night and day, and a great fire in which houses numbering nine hundred burned, with loss of wealth and souls known only to God {cite:shadharat-dhahab p. 453}. A further Aden fire is recorded under 914 {cite:shadharat-dhahab p. 478}."
  fr: "En 908, la ville d’Aden subit de grands séismes se répétant nuit et jour, puis un grand incendie où neuf cents maisons brûlèrent, avec des pertes de biens et de vies connues de Dieu seul {cite:shadharat-dhahab p. 453}. Un autre incendie d’Aden est consigné en 914 {cite:shadharat-dhahab p. 478}."
  es: "En el año 908, la ciudad de Adén fue azotada por fuertes terremotos que se repetían día y noche, y por un gran incendio en el que se quemaron novecientas casas, con pérdidas de riquezas y almas conocidas solo por Dios {cite:shadharat-dhahab p. 453}. Se registra otro incendio en Adén en el año 914 {cite:shadharat-dhahab p. 478}."
  ur: "908 میں عدن شہر میں رات اور دن بار بار آنے والے بڑے زلزلوں نے تباہی مچائی، اور ایک زبردست آگ جس میں نو سو گھر جل گئے، جس میں جان و مال کا نقصان صرف خدا کو معلوم تھا۔ 453}۔ عدن کی مزید آگ 914 کے تحت درج کی گئی ہے۔ 478}۔"
  tr: "Hicri 908 yılında Aden şehrini gece gündüz büyük depremler vurdu. Ayrıca büyük bir yangın çıktı ve dokuz yüz ev yandı, mal ve can kayıplarının boyutunu yalnızca Allah bilir. {Kaynak: Şadharat-Dhaba s. 453}. Kaynakta bahsedilen Aden yangınları arasında Hicri 914 yılındaki yangın da bulunmaktadır. {Kaynak: Şadharat-Dhaba s. 478}."
  id: "Pada tahun 908 Hijriah, gempa bumi dahsyat melanda kota Aden, terjadi siang dan malam. Kebakaran besar juga terjadi, menghanguskan banyak rumah, berjumlah sembilan ratus, dan menyebabkan kerugian harta benda dan nyawa yang hanya Allah yang tahu. {cite:shadharat-dhahab hlm. 453}. Di antara kebakaran Aden yang disebutkan dalam sumber tersebut juga terdapat kebakaran tahun 914 Hijriah. {cite:shadharat-dhahab hlm. 478}."
