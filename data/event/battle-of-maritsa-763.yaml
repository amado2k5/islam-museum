label: { ar: "وقعة نهر الماريتسا (صيرمن)" }
summary:
  ar: "يذكر الصلابي أن ملوك البلقان (الصرب والبلغار والبوسنيين وغيرهم) تحالفوا ضد الدولة العثمانية وجمعوا جيشاً كبيراً نحو مئة ألف مقاتل تقدم حتى نهر الماريتسا قرب أدرنة، فهاجمهم القائد العثماني لاله شاهين ليلاً قبل طلوع الفجر وهو في عدد قليل، فأباد النصارى عن آخرهم وغرق كثير منهم في النهر، وفتح هذا النصر طريق البلقان أمام العثمانيين {cite:dawlat-uthmaniyya-salabi p. 58-59}. ويذكر الكتاب أن أخباراً من بلاد الروم جاءت إلى القاهرة فأقام المسلمون فيها الاحتفالات سبعة أيام {cite:dawlat-uthmaniyya-salabi p. 59}."
  en: "Maritsa (Sırpsındığı), early in Murad I's reign — al-Sallabi has a Balkan coalition of some hundred thousand camped on the river near Edirne when Lala Şahin's smaller Ottoman force struck before dawn and destroyed it, opening the Balkans to Ottoman advance; news reaching Cairo was met with seven days of public celebration {cite:dawlat-uthmaniyya-salabi p. 58-59}."
