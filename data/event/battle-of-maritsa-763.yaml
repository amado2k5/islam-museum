label: { ar: "وقعة نهر الماريتسا ⁦(صيرمن)⁩", fr: "La bataille de la Maritsa (Sırpsındığı)", tr: "Maritsa Nehri Muharebesi (Sirmen)", id: "Pertempuran Sungai Maritsa (Syrmen)" }
summary:
  ar: "يذكر الصلابي أن ملوك البلقان ⁦(الصرب والبلغار والبوسنيين وغيرهم)⁩ تحالفوا ضد الدولة العثمانية وجمعوا جيشاً كبيراً نحو مئة ألف مقاتل تقدم حتى نهر الماريتسا قرب أدرنة، فهاجمهم القائد العثماني لاله شاهين ليلاً قبل طلوع الفجر وهو في عدد قليل، فأباد النصارى عن آخرهم وغرق كثير منهم في النهر، وفتح هذا النصر طريق البلقان أمام العثمانيين {cite:dawlat-uthmaniyya-salabi p. 58-59}. ويذكر الكتاب أن أخباراً من بلاد الروم جاءت إلى القاهرة فأقام المسلمون فيها الاحتفالات سبعة أيام {cite:dawlat-uthmaniyya-salabi p. 59}."
  en: "Maritsa (Sırpsındığı), early in Murad I's reign — al-Sallabi has a Balkan coalition of some hundred thousand camped on the river near Edirne when Lala Şahin's smaller Ottoman force struck before dawn and destroyed it, opening the Balkans to Ottoman advance; news reaching Cairo was met with seven days of public celebration {cite:dawlat-uthmaniyya-salabi p. 58-59}."
  fr: "La Maritsa (Sırpsındığı), au début du règne de Murad Ier : selon al-Sallabi, une coalition balkanique d'environ cent mille hommes campait sur le fleuve près d'Edirne quand la petite force ottomane de Lala Şahin frappa avant l'aube et l'anéantit, ouvrant les Balkans à l'avance ottomane ; la nouvelle, parvenue au Caire, y fut accueillie par sept jours de réjouissances publiques {cite:dawlat-uthmaniyya-salabi p. 58-59}."
  es: "Maritsa (Sırpsındığı), a principios del reinado de Murad I: al-Sallabi cuenta que una coalición balcánica de unos cien mil hombres acampaba en el río cerca de Edirne cuando la fuerza otomana, más pequeña, de Lala Şahin atacó antes del amanecer y la destruyó, abriendo los Balcanes al avance otomano; la noticia que llegó a El Cairo fue recibida con siete días de celebración pública {cite:dawlat-uthmaniyya-salabi p. 58-59}."
  ur: "ماریتسا (Sırpsındığı)، مراد اول کے دورِ حکومت کے اوائل میں — السلبی کے پاس تقریباً ایک لاکھ بلقان اتحاد ہے جس نے ایڈرن کے قریب دریا پر ڈیرے ڈالے تھے جب لالہ شاہین کی چھوٹی عثمانی فوج نے طلوع فجر سے پہلے حملہ کیا اور اسے تباہ کر دیا، بلقان کو عثمانی پیش قدمی کے لیے کھول دیا۔ قاہرہ پہنچنے والی خبریں سات روزہ عوامی جشن کے ساتھ ملیں۔ 58-59}۔"
  tr: "El-Sallabi, Balkan krallarının (Sırplar, Bulgarlar, Boşnaklar ve diğerleri) Osmanlı devletine karşı ittifak kurarak yaklaşık yüz bin kişilik büyük bir ordu topladıklarını belirtir. Bu ordu, Edirne yakınlarındaki Maritsa Nehri'ne kadar ilerledi ve Osmanlı komutanı Lale Şahin, şafaktan önce geceleyin küçük bir kuvvetle onlara saldırdı. Hristiyanları yok etti ve birçoğu nehirde boğuldu. Bu zafer, Osmanlılar için Balkan yolunu açtı {cite:dawlat-uthmaniyya-salabi s. 58-59}. Kitap ayrıca, Bizans İmparatorluğu'ndan gelen haberlerin Kahire'ye ulaştığını ve Müslümanların yedi gün boyunca kutlamalar yaptığını da belirtir {cite:dawlat-uthmaniyya-salabi s. 59}."
  id: "Al-Sallabi menyebutkan bahwa raja-raja Balkan (Serbia, Bulgaria, Bosnia, dan lainnya) bersekutu melawan negara Ottoman dan mengumpulkan pasukan besar sekitar seratus ribu pejuang. Mereka maju hingga Sungai Maritsa dekat Edirne, di mana komandan Ottoman, Lale Shahin, menyerang mereka pada malam hari sebelum fajar dengan pasukan kecil. Dia memusnahkan orang-orang Kristen, dan banyak yang tenggelam di sungai. Kemenangan ini membuka jalur Balkan bagi Ottoman {cite:dawlat-uthmaniyya-salabi hlm. 58-59}. Buku ini juga menyebutkan bahwa berita dari Kekaisaran Bizantium sampai ke Kairo, di mana umat Muslim mengadakan perayaan selama tujuh hari {cite:dawlat-uthmaniyya-salabi hlm. 59}."
