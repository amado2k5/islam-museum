id: event/baqillani-mujaddid-fourth-century
class: event
kind: other
label:
  ar: "الباقلاني مجدد القرن الرابع عند المؤرخين، رأس المائة الرابعة ٤٠٠هـ"
  en: "Al-Baqillani counted the mujaddid of the fourth century, turn of 400 AH"
  ur: "باقلانی مؤرخین کے نزدیک چوتھی صدی کے مجدد، سرِ چوتھی صدی 400ھ"
  fr: "Al-Baqillani compté comme le mujaddid du IVe siècle, au tournant de 400 H"
  es: "Al-Baqillani contabilizó a los mujaddid del siglo IV, alrededor del año 400 de la Hégira."
  tr: "Tarihçiler, El-Baqillani'yi Hicri 4. yüzyılın başlarında (400 Hicri) dördüncü yüzyılın yeniden dirilticisi olarak kabul ederler."
  id: "Al-Baqillani dianggap oleh para sejarawan sebagai tokoh yang membangkitkan kembali peradaban abad keempat, pada awal abad keempat Hijriah (400 Hijriah)."
summary:
  ar: "عُدَّ القاضي أبو بكر الباقلاني في كتب التراجم «سيف السنة» ومجدد الدين على رأس المائة الرابعة على الصحيح، وقيل جُدِّد به وبأبي سهل الصعلوكي؛ وكان ورعاً لم تُحفظ عنه زلة ولا نقيصة، ونقل الشذرات عن ابن تيمية أنه «أفضل المتكلمين المنتسبين إلى الأشعري، ليس فيهم مثله لا قبله ولا بعده» {cite:shadharat-dhahab p. 169-170}."
  en: "The biographers counted the qadi Abu Bakr al-Baqillani 'the sword of the Sunna' and, on the soundest view, the mujaddid of the fourth Hijri century — some said the renewal was shared with Abu Sahl al-Su'luki. He was scrupulous: no lapse or fault was recorded of him, and the Shadharat quotes Ibn Taymiyya calling him 'the best of the mutakallimun attached to al-Ash'ari, with no equal before or after him' {cite:shadharat-dhahab p. 169-170}."
  ur: "مترجمین قاضی ابوبکر باقلانی کو «سیف السنہ» اور — مضبوط ترین قول کے مطابق — چوتھی صدی ہجری کے سرے پر دین کے مجدد شمار کرتے ہیں؛ بعض نے تجدید ان کے اور ابی سہل صعلوکی کے ساتھ شریک کی۔ وہ متقی تھے، ان سے کوئی زلہ یا نقص محفوظ نہیں، اور شذرات ابن تیمیہ کا قول نقل کرتی ہے کہ وہ «اشعری سے منسوب متکلمین میں بہترین ہیں، نہ ان سے پہلے کوئی ان جیسا نہ بعد میں» {cite:shadharat-dhahab p. 169-170}۔"
  fr: "Les biographes comptèrent le cadi Abu Bakr al-Baqillani comme « le sabre de la Sunna » et, selon l'avis le plus sûr, comme le mujaddid du IVe siècle de l'hégire ; certains dirent que le renouveau fut partagé avec Abu Sahl al-Su'luki. Il était scrupuleux : on ne lui connut ni écart ni faute, et les Shadharat citent Ibn Taymiyya l'appelant « le meilleur des mutakallimun rattachés à al-Ash'ari, sans égal avant ni après lui » {cite:shadharat-dhahab p. 169-170}."
  es: "Los biógrafos consideraban al cadí Abu Bakr al-Baqillani \"la espada de la Sunnah\" y, según la versión más sensata, el muyaddid del siglo IV Hégira; algunos dijeron que la renovación fue compartida con Abu Sahl al-Su'luki. Era escrupuloso: no se registró ningún error o falta de él, y el Shadharat cita a Ibn Taymiyya llamándolo \"el mejor de los mutakallimun adjuntos a al-Ash'ari, sin igual antes o después de él\" {cita: shadharat-dhahab p. 169-170}."
  tr: "Doğru görüşe göre, biyografi kitaplarında Ebu Bekir el-Bakilani, dördüncü yüzyılın başlarında \"Sünnetin kılıcı\" ve dinin yenileyicisi olarak kabul edilmiştir. Onun ve Ebu Sahl el-Sa'luki'nin yenilenme sürecinde yer aldıkları söylenmiştir. O, dindar bir kişiydi ve ondan hiçbir hata veya eksiklik kaydedilmemiştir. El-Şedharat, İbn Taymiyye'nin onun hakkında \"Eş'ari'ye bağlı ilahiyatçıların en iyisidir, ne ondan önce ne de ondan sonra onun gibisi yoktur\" dediğini aktarmıştır. {kaynak: Şadharat-Dhaba s. 169-170}."
  id: "Hakim Abu Bakr al-Baqillani dianggap dalam kitab-kitab biografi sebagai \"pedang Sunnah\" dan pembaharu agama pada awal abad keempat, menurut pandangan yang benar. Dikatakan bahwa beliau dan Abu Sahl al-Sa'luki adalah pembaharu. Beliau saleh, dan tidak ada kesalahan atau kekurangan yang tercatat darinya. Al-Shadharat mengutip Ibnu Taymiyyah yang mengatakan bahwa beliau adalah \"ahli teologi terbaik yang berafiliasi dengan al-Ash'ari, tidak ada seorang pun seperti beliau di antara mereka, baik sebelum beliau maupun sesudah beliau.\" {kutipan:shadharat-dhahab hlm. 169-170}."
