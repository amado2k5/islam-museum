id: event/ibn-tulun-enters-fustat-254
class: event
kind: other
label:
  ar: "دخول أحمد بن طولون الفسطاط نائباً عن باكبك، ٢٥٤هـ/٨٦٨م"
  en: "Ahmad ibn Tulun enters Fustat as Bayakbak's lieutenant, 254/868"
  ur: "احمد بن طولون کا بائکبک کے نائب کی حیثیت سے فسطاط میں داخلہ، 254ھ/868ء"
  es: "Ahmad ibn Tulun entra en Fustat como lugarteniente de Bayakbak, 254/868"
  fr: "Ahmad ibn Tulun entre à Fustat comme lieutenant de Bayakbak, 254/868"
  tr: "Ahmed ibn Tulun, Fustat'a Bakbak'ın vekili olarak girdi, 254 H./868 MS"
  id: "Ahmad bin Tulun masuk Fustat sebagai wakil Bakbak, 254 H/868 M"
summary:
  ar: "في سنة أربع وخمسين ومائتين جعل المعتز مصر إقطاعاً للأمير التركي باكبك الذي كان قد تزوج أرملة طولون والد أحمد، فعيّن أحمد بن طولون نائباً عنه فدخل الفسطات في ثلاث وعشرين ليلة من رمضان سنة أربع وخمسين — الخامس عشر من أيلول سنة ٨٦٨م — فكان أول وال مسلم لمصر يضم إليها الشام لاحقاً {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
  en: "In 254/868 the caliph al-Mu'tazz granted Egypt as an apanage to the Turkish general Bayakbak, who had married the widow of Tulun, Ahmad's father. Ahmad was appointed his stepfather's lieutenant and entered Fustat on 23 Ramadan 254/15 September 868 — the first Muslim governor of Egypt who would go on to annex Syria {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
  ur: "254ھ/868ء میں خلیفہ معتز نے مصر ترک سردار بائکبک کو اقطاع میں دیا، جس نے احمد کے والد طولون کی بیوہ سے شادی کی تھی۔ احمد بن طولون اپنے سوتیلے والد کا نائب مقرر ہوا اور 23 رمضان 254ھ/15 ستمبر 868ء کو فسطاط میں داخل ہوا — وہ پہلا مسلم والی تھا جس نے بعد میں شام کو بھی مصر سے ملا لیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}۔"
  es: "En 254/868, el califa al-Mu'tazz concedió Egipto como apanage al general turco Bayakbak, quien se había casado con la viuda de Tulun, padre de Ahmad. Ahmad fue nombrado lugarteniente de su padrastro y entró en Fustat el 23 de Ramadán de 254/15 de septiembre de 868, convirtiéndose en el primer gobernador musulmán de Egipto, quien posteriormente anexaría Siria {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
  fr: "En 254/868, le calife al-Mu'tazz accorda l'Égypte en apanage au général turc Bayakbak, qui avait épousé la veuve de Tulun, le père d'Ahmad. Ahmad fut nommé lieutenant de son beau-père et entra à Fustat le 23 Ramadan 254/15 septembre 868 – il devint le premier gouverneur musulman d'Égypte et allait par la suite annexer la Syrie."
  tr: "Hicri 254 yılında, Mu'tezz, Mısır'ı, Ahmed'in babası Tulun'un dul eşiyle evlenmiş olan Türk prensi Bakbak'a tımar olarak verdi. Ahmed ibn Tulun'u vekili olarak atadı ve o da Hicri 254 yılının Ramazan ayının yirmi üçüncü gecesinde (Miladi 868 yılının 15 Eylül'ünde) Fustat'a girdi. O, daha sonra Suriye'yi de Mısır'a katan ilk Müslüman Mısır valisi oldu. {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}"
  id: "Pada tahun 254 H, Al-Mu'tazz menjadikan Mesir sebagai wilayah kekuasaan bagi pangeran Turki Bakbak, yang telah menikahi janda Tulun, ayah Ahmad. Ia menunjuk Ahmad ibn Tulun sebagai wakilnya, dan ia memasuki Fustat pada malam ke-23 bulan Ramadan tahun 254 H — tanggal 15 September tahun 868 M — dan ia adalah gubernur Muslim pertama Mesir, yang kemudian mencaplok Suriah ke wilayah tersebut. {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
