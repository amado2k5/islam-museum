id: event/ibn-tulun-enters-fustat-254
class: event
kind: other
label:
  ar: "دخول أحمد بن طولون الفسطاط نائباً عن باكبك، ٢٥٤هـ/٨٦٨م"
  en: "Ahmad ibn Tulun enters Fustat as Bayakbak's lieutenant, 254/868"
  ur: "احمد بن طولون کا بائکبک کے نائب کی حیثیت سے فسطاط میں داخلہ، 254ھ/868ء"
summary:
  ar: "في سنة أربع وخمسين ومائتين جعل المعتز مصر إقطاعاً للأمير التركي باكبك الذي كان قد تزوج أرملة طولون والد أحمد، فعيّن أحمد بن طولون نائباً عنه فدخل الفسطات في ثلاث وعشرين ليلة من رمضان سنة أربع وخمسين — الخامس عشر من أيلول سنة ٨٦٨م — فكان أول وال مسلم لمصر يضم إليها الشام لاحقاً {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
  en: "In 254/868 the caliph al-Mu'tazz granted Egypt as an apanage to the Turkish general Bayakbak, who had married the widow of Tulun, Ahmad's father. Ahmad was appointed his stepfather's lieutenant and entered Fustat on 23 Ramadan 254/15 September 868 — the first Muslim governor of Egypt who would go on to annex Syria {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}."
  ur: "254ھ/868ء میں خلیفہ معتز نے مصر ترک سردار بائکبک کو اقطاع میں دیا، جس نے احمد کے والد طولون کی بیوہ سے شادی کی تھی۔ احمد بن طولون اپنے سوتیلے والد کا نائب مقرر ہوا اور 23 رمضان 254ھ/15 ستمبر 868ء کو فسطاط میں داخل ہوا — وہ پہلا مسلم والی تھا جس نے بعد میں شام کو بھی مصر سے ملا لیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 300} {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}۔"
