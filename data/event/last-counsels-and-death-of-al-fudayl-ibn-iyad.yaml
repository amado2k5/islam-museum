label:
  ar: وصايا الفضيل بن عياض ووفاته بمكة
  en: Last counsels and death of al-Fudayl ibn Iyad at Mecca
  ur: مکہ میں فضیل بن عیاض کی نصیحتیں اور وفات
  es: "Últimos consejos y muerte de al-Fudayl ibn Iyad en La Meca"
summary:
  ar: أقام الفضيل بن عياض بمكة حتى مات بها في أول سنة 187هـ في خلافة هارون {cite:siyar-alam-nubala scan vol. 1 p. 3043}، ويروي هشام بن عمار أنه توفي يوم عاشوراء {cite:tarikh-islam-dhahabi vol. 15 p. 344}. ومن أقواله قبل الموت أن الخوف أفضل من الرجاء في الصحة فإذا نزل الموت فالرجاء أفضل، وألا يجعل المرء الرجال أوصياءه وقد ضيّع وصيته بنفسه {cite:siyar-alam-nubala scan vol. 1 p. 3045}. ودُفن غيره من الصالحين إلى جانب قبره بمكة {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 501}.
  en: 'Al-Fudayl ibn Iyad stayed in Mecca until he died there at the start of 187 AH, in the caliphate of Harun {cite:siyar-alam-nubala scan vol. 1 p. 3043}; Hisham ibn Ammar says he died on the day of Ashura {cite:tarikh-islam-dhahabi vol. 15 p. 344}. Among his sayings on death: fear is better than hope in health but hope is better once death arrives, and do not make men your executors when you lost your own testament {cite:siyar-alam-nubala scan vol. 1 p. 3045}. Other righteous people were later buried beside his grave in Mecca {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 501}.'
  ur: فضیل بن عیاض مکہ میں مقیم رہے یہاں تک کہ ہارون کی خلافت میں 187ھ کے آغاز میں وہیں فوت ہوئے {cite:siyar-alam-nubala scan vol. 1 p. 3043}؛ ہشام بن عمار کے مطابق یومِ عاشورا کو {cite:tarikh-islam-dhahabi vol. 15 p. 344}۔ موت کے بارے میں ان کے اقوال میں ہے کہ تندرستی میں خوف رجاء سے بہتر ہے اور موت آ جائے تو رجاء بہتر، اور یہ کہ اپنی وصیت خود ضائع کرنے والا لوگوں کو وصی نہ بنائے {cite:siyar-alam-nubala scan vol. 1 p. 3045}۔ بعد میں دوسرے صالحین مکہ میں ان کی قبر کے پہلو میں دفن ہوئے {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 501}۔
  es: "Al-Fudayl ibn Iyad permaneció en La Meca hasta su muerte a principios del año 187 AH, durante el califato de Harún {cite:siyar-alam-nubala scan vol. 1 p. 3043}; Hisham ibn Ammar afirma que falleció el día de Ashura {cite:tarikh-islam-dhahabi vol. 15 p. 344}. Entre sus dichos sobre la muerte se encuentran: «Es mejor el temor que la esperanza en la salud, pero la esperanza es mejor una vez que llega la muerte», y «No designes a hombres como albaceas cuando hayas perdido tu propio testamento» {cite:siyar-alam-nubala scan vol. 1 p. 3045}. Posteriormente, otros justos fueron enterrados junto a su tumba en La Meca {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 501}."
