id: event/al-hadi-warns-the-harithis-of-najran-and-foretells-the-hanging-286
class: event
kind: other
label:
  ar: إنذار الهادي لمستأمنة بني الحارث بنجران وتنبؤه بتعليقهم، 286هـ
  en: Al-Hadi warns the Harithis of Najran and foretells the hanging, 286 AH
  ur: ہادی کا نجران کے بنو حارث کو خبردار کرنا اور لٹکائے جانے کی پیش گوئی، 286ھ
  es: "Al-Hadi advierte a los harithis de Najrán y predice la horca, 286 AH."
  fr: "Al-Hadi avertit les Harithis de Najran et prédit la pendaison, 286 AH"
  tr: "El-Hadi'nin Necran'daki koruma altındaki Beni el-Harith halkına yönelik uyarısı ve onların sürgüne gönderileceğine dair öngörüsü, Hicri 286."
  id: "Peringatan Al-Hadi kepada kaum Bani al-Harith yang dilindungi di Najran dan ramalannya tentang penangguhan perlindungan mereka, 286 H."
summary:
  ar: يستدعي الهادي من معه بنجران من مستأمنة بني الحارث وأهل القرار منهم ويطلب أن يلقوا القادمين وينصحوهم ويذكروهم بعفوه، فيفرحون ويتغامزون ظناً أن ذلك هيبة، فيردّهم ويقول إن كلامه حجة وإعذار وإنذار وإن الله ناصره، ويذكر ما سيحل بالقادمين، ثم يفوض أمره إلى الله.
  en: Al-Hadi summons the Harithis at Najran who are under his safe-conduct and those of settled homes, tells them to meet the oncoming men and counsel them, recalling his pardon; they rejoice and nudge one another, thinking it fear, so he calls them back, says his words are proof, excuse and warning and that God will help him, tells what will happen to the oncomers, and commits his affair to God.
  ur: ہادی اپنے پاس نجران میں موجود امان یافتہ بنو حارث اور ان کے مستقل باشندوں کو بلاتے ہیں اور کہتے ہیں کہ آنے والوں سے ملیں، انہیں نصیحت کریں اور ان کی معافی یاد دلائیں؛ وہ خوش ہو کر ایک دوسرے کو اشارے کرتے ہیں کہ یہ خوف ہے، تو وہ انہیں بلا لیتے ہیں، کہتے ہیں کہ ان کی بات حجت، عذر اور تنبیہ ہے اور اللہ ان کی مدد کرے گا، آنے والوں پر جو گزرے گا اسے بیان کرتے ہیں اور اپنا معاملہ اللہ کے سپرد کرتے ہیں۔
  es: "Al-Hadi convoca a los Harithis de Najran que están bajo su protección y a los de hogares establecidos, les dice que reciban a los hombres que se aproximan y les aconsejen, recordándoles su perdón; ellos se regocijan y se empujan unos a otros, pensando que es miedo, entonces él los llama de nuevo, dice que sus palabras son prueba, excusa y advertencia y que Dios lo ayudará, les dice lo que les sucederá a los que se aproximan y encomienda su asunto a Dios."
  fr: "Al-Hadi convoque les Harithis de Najran qui sont sous sa protection et ceux des foyers établis, leur dit d'aller à la rencontre des hommes qui arrivent et de les conseiller, leur rappelant son pardon; ils se réjouissent et se donnent des coups de coude, pensant que c'est de la peur, alors il les rappelle, dit que ses paroles sont une preuve, une excuse et un avertissement et que Dieu l'aidera, dit ce qui arrivera aux arrivants et confie son affaire à Dieu."
  tr: "El-Hadi, Necran'da yanında bulunan, koruma altındaki Beni El-Harith kabilesinden ve aralarındaki karar vericilerden olanları çağırır ve onlardan yeni gelenlerle görüşmelerini, onlara öğüt vermelerini ve affını hatırlatmalarını ister. Onlar sevinirler ve birbirlerine göz kırparlar, bunun bir huşu işareti olduğunu düşünürler. Onları geri gönderir ve sözlerinin delil, mazeret ve uyarı olduğunu, Allah'ın da onun destekçisi olduğunu söyler. Yeni gelenlerin başına gelecekleri anlatır, sonra da işini Allah'a emanet eder."
  id: "Al-Hadi memanggil orang-orang yang bersamanya di Najran dari Bani Al-Harith yang terlindungi dan para penguasa di antara mereka, dan meminta mereka untuk menemui para pendatang baru, menasihati mereka, dan mengingatkan mereka tentang pengampunannya. Mereka bergembira dan saling mengedipkan mata, mengira bahwa ini adalah tanda kekaguman. Dia mengirim mereka kembali dan mengatakan bahwa kata-katanya adalah bukti, alasan, dan peringatan, dan bahwa Allah adalah penolongnya. Dia menyebutkan apa yang akan terjadi pada para pendatang baru, kemudian dia menyerahkan masalahnya kepada Allah."
