id: event/al-hadi-warns-the-harithis-of-najran-and-foretells-the-hanging-286
class: event
kind: other
label:
  ar: إنذار الهادي لمستأمنة بني الحارث بنجران وتنبؤه بتعليقهم، 286هـ
  en: Al-Hadi warns the Harithis of Najran and foretells the hanging, 286 AH
  ur: ہادی کا نجران کے بنو حارث کو خبردار کرنا اور لٹکائے جانے کی پیش گوئی، 286ھ
summary:
  ar: يستدعي الهادي من معه بنجران من مستأمنة بني الحارث وأهل القرار منهم ويطلب أن يلقوا القادمين وينصحوهم ويذكروهم بعفوه، فيفرحون ويتغامزون ظناً أن ذلك هيبة، فيردّهم ويقول إن كلامه حجة وإعذار وإنذار وإن الله ناصره، ويذكر ما سيحل بالقادمين، ثم يفوض أمره إلى الله.
  en: Al-Hadi summons the Harithis at Najran who are under his safe-conduct and those of settled homes, tells them to meet the oncoming men and counsel them, recalling his pardon; they rejoice and nudge one another, thinking it fear, so he calls them back, says his words are proof, excuse and warning and that God will help him, tells what will happen to the oncomers, and commits his affair to God.
  ur: ہادی اپنے پاس نجران میں موجود امان یافتہ بنو حارث اور ان کے مستقل باشندوں کو بلاتے ہیں اور کہتے ہیں کہ آنے والوں سے ملیں، انہیں نصیحت کریں اور ان کی معافی یاد دلائیں؛ وہ خوش ہو کر ایک دوسرے کو اشارے کرتے ہیں کہ یہ خوف ہے، تو وہ انہیں بلا لیتے ہیں، کہتے ہیں کہ ان کی بات حجت، عذر اور تنبیہ ہے اور اللہ ان کی مدد کرے گا، آنے والوں پر جو گزرے گا اسے بیان کرتے ہیں اور اپنا معاملہ اللہ کے سپرد کرتے ہیں۔
