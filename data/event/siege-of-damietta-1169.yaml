summary:
  ar: "بطاقة أولية لحصار دمياط سنة ١١٦٩م، حملة ألمرى الصليبي المشتركة مع البيزنطيين على مصر الفاطمية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Damietta in 1169, King Amalric's joint Crusader–Byzantine attack on Fatimid Egypt; its sources are not yet checked on the page."
