  ur: "1169 میں ڈیمیٹا کے محاصرے کے لیے ڈرافٹ کارڈ، شاہ املرک کا فاطمی مصر پر مشترکہ صلیبی بازنطینی حملہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1169 yılında Dimyat kuşatmasının ön hazırlık kartı; Almería'nın Bizanslılarla birlikte Fatımi Mısır'ına karşı Haçlı seferi; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Peta pendahuluan pengepungan Damietta pada tahun 1169 M, kampanye Perang Salib Almería bersama Bizantium melawan Mesir Fatimiyah; sumber-sumber di halaman ini belum ditinjau."
