label: { ar: "غزوة غالب بن عبد الله أرض بني مرة ومقتل مرداس بن نهيك", en: "Ghalib ibn Abdullah's raid on the land of Banu Murra and the killing of Mirdas ibn Nahik" }
summary:
  ar: "سرية غالب بن عبد الله الكلبي الليثي إلى أرض بني مرة؛ أُصيب فيها مرداس بن نهيك، حليف لهم من الحرقة من جهينة، قتله أسامة بن زيد ورجل من الأنصار بعدما قال: أشهد أن لا إله إلا الله؛ فلما أخبرا النبي قال لأسامة: من لك بلا إله إلا الله؟ وكرّرها حتى تمنى أسامة أنه لم يُسلم قبل ذلك اليوم وأنه لم يقتله، وعاهد الله ألا يقتل رجلاً يقولها أبداً."
  en: "Ghalib ibn Abdullah al-Kalbi al-Laythi's detachment to the land of Banu Murra; Mirdas ibn Nahik, an ally of theirs from al-Huraqa of Juhayna, was killed there by Usama ibn Zayd and a man of the Ansar after he had said 'I testify there is no god but God'. When they told the Prophet, he said to Usama: 'Who will answer for la ilaha illa Allah on your behalf?' and kept repeating it until Usama wished his Islam had begun that very day and that he had not killed him, and vowed never again to kill a man who said it."
