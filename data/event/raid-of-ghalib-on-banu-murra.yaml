id: event/raid-of-ghalib-on-banu-murra
class: event
kind: raid
label: { ar: "غزوة غالب بن عبد الله أرض بني مرة ومقتل مرداس بن نهيك", en: "Ghalib ibn Abdullah's raid on the land of Banu Murra and the killing of Mirdas ibn Nahik", es: "La incursión de Ghalib ibn Abdullah en la tierra de Banu Murra y el asesinato de Mirdas ibn Nahik.", fr: "Le raid de Ghalib ibn Abdullah sur le territoire des Banu Murra et le meurtre de Mirdas ibn Nahik", ur: "بنو مرہ کی سرزمین پر غالب ابن عبداللہ کا حملہ اور میرداس بن نایق کا قتل" }
summary:
  ar: "سرية غالب بن عبد الله الكلبي الليثي إلى أرض بني مرة؛ أُصيب فيها مرداس بن نهيك، حليف لهم من الحرقة من جهينة، قتله أسامة بن زيد ورجل من الأنصار بعدما قال: أشهد أن لا إله إلا الله؛ فلما أخبرا النبي قال لأسامة: من لك بلا إله إلا الله؟ وكرّرها حتى تمنى أسامة أنه لم يُسلم قبل ذلك اليوم وأنه لم يقتله، وعاهد الله ألا يقتل رجلاً يقولها أبداً."
  en: "Ghalib ibn Abdullah al-Kalbi al-Laythi's detachment to the land of Banu Murra; Mirdas ibn Nahik, an ally of theirs from al-Huraqa of Juhayna, was killed there by Usama ibn Zayd and a man of the Ansar after he had said 'I testify there is no god but God'. When they told the Prophet, he said to Usama: 'Who will answer for la ilaha illa Allah on your behalf?' and kept repeating it until Usama wished his Islam had begun that very day and that he had not killed him, and vowed never again to kill a man who said it."
  es: "Durante el destacamento de Ghalib ibn Abdullah al-Kalbi al-Laythi a la tierra de Banu Murra, Mirdas ibn Nahik, un aliado suyo de al-Huraqa de Juhayna, fue asesinado allí por Usama ibn Zayd y un hombre de los Ansar después de haber dicho: \"Atestiguo que no hay más dios que Dios\". Cuando se lo contaron al Profeta, este le dijo a Usama: \"¿Quién responderá por ti por 'la ilaha illa Allah'?\" y lo repitió hasta que Usama deseó que su Islam hubiera comenzado ese mismo día y no haberlo matado, y juró no volver a matar jamás a un hombre que dijera eso."
  fr: "Lors du détachement de Ghalib ibn Abdullah al-Kalbi al-Laythi au pays des Banu Murra, Mirdas ibn Nahik, un de leurs alliés originaire d'al-Huraqa de Juhayna, fut tué par Usama ibn Zayd et un Ansar après avoir proclamé: « J'atteste qu'il n'y a de dieu que Dieu. » Lorsqu'ils en informèrent le Prophète, celui-ci demanda à Usama: « Qui répondra pour toi au sujet de \"la ilaha illa Allah\" ? » et répéta cette injonction jusqu'à ce qu'Usama regrette de l'avoir tué et souhaite s'être converti à l'islam ce jour-là. Il jura alors de ne plus jamais tuer quiconque prononcerait ces paroles."
  ur: "غالب ابن عبداللہ الکلبی لیثی کا بنو مرہ کی سرزمین سے لاتعلقی؛ مرداس بن نحیق، جو ان کا ایک حلیف جہینہ کے الحرکہ سے تھا، کو وہاں اسامہ بن زید اور انصار کے ایک آدمی نے اس وقت قتل کر دیا جب اس نے کہا تھا کہ میں گواہی دیتا ہوں کہ خدا کے سوا کوئی معبود نہیں ہے۔ جب انہوں نے رسول اللہ کو بتایا تو آپ نے اسامہ سے کہا: 'آپ کی طرف سے لا الہ الا اللہ کا جواب کون دے گا؟' اور اسے دہراتے رہے یہاں تک کہ اسامہ نے خواہش کی کہ اس دن اس کا اسلام شروع ہو گیا ہو اور اس نے اسے قتل نہ کیا ہو، اور اس نے اس بات کی قسم کھائی کہ آئندہ کبھی اس شخص کو نہیں ماروں گا جس نے یہ کہا تھا۔"
