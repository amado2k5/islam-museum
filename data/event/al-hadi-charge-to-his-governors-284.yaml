id: event/al-hadi-charge-to-his-governors-284
class: event
kind: declaration
label:
  ar: عهد الهادي إلى ولاته على جباية الأعشار في صعدة والمخاليف
  en: Al-Hadi's charge to his governors on collecting the tithes, Sa'da and its districts
  ur: 'ہادی کا اپنے عمال کے نام فرمان: صعدہ اور مخالیف میں عشر کی وصولی'
summary:
  ar: 'نص عهد كتبه الهادي لكل والٍ ولاه جباية قرية بعد وصوله صعدة: يدخل البلد بالسكينة ولا يقبل هدية، ويبدأ بالأمر بالمعروف وتعليم الصلاة، ويأخذ العشر أو نصفه بحسب السقي ولا يأخذ فيما دون خمسة أوسق، ويكتب أسماء الفقراء ويعزل لهم ربع الجباية ويكتب إليه بعددهم.'
  en: 'The text of a charge al-Hadi wrote for each governor he appointed over the collection of a village after reaching Sa''da: enter the town with calm, accept no gift, begin with enjoining good and teaching prayer, take a tenth or a half-tenth according to irrigation and nothing below five awsaq, list the poor and set aside a quarter of the collection for them, and write to him with their number.'
  ur: 'اس فرمان کا متن جو ہادی نے صعدہ پہنچنے کے بعد ہر اس عامل کو لکھا جسے کسی بستی کی وصولی پر مقرر کیا: بستی میں سکون و وقار سے داخل ہو، تحفہ قبول نہ کرے، نیکی کے حکم اور نماز کی تعلیم سے آغاز کرے، سیرابی کے مطابق عشر یا نصف عشر لے اور پانچ وسق سے کم پر کچھ نہ لے، فقراء کے نام لکھے اور ان کے لیے وصولی کا چوتھائی الگ رکھے اور انہیں ان کی تعداد لکھ بھیجے۔'
