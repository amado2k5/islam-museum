summary:
  ar: "دُعي لمبايعة إبراهيم بن المهدي بالخلافة في آخر سنة إحدى ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.555}، وبايعه أهل بغداد في المحرم من سنة اثنتين ومائتين وخلعوا المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.557}."
  en: "The call for the pledge to Ibrahim ibn al-Mahdi as caliph was made at the end of 201 AH {cite:tabari-tarikh-abu-al-fadl j.8 p.555}, and the people of Baghdad pledged to him in Muharram of 202 AH and deposed al-Ma'mun {cite:tabari-tarikh-abu-al-fadl j.8 p.557}."
  fr: "L'appel à l'allégeance à Ibrahim ibn al-Mahdi comme calife fut lancé à la fin de 201 H {cite:tabari-tarikh-abu-al-fadl j.8 p.555}, et les gens de Bagdad lui prêtèrent allégeance en Muharram 202 H et déposèrent al-Ma'mun {cite:tabari-tarikh-abu-al-fadl j.8 p.557}."
  es: "El llamamiento para jurar lealtad a Ibrahim ibn al-Mahdi como califa se realizó a finales del 201 AH {cite:tabari-tarikh-abu-al-fadl j.8 p.555}, y la gente de Bagdad le juró lealtad en Muharram del 202 AH y depuso a al-Ma'mun {cite:tabari-tarikh-abu-al-fadl j.8 p.557}."
  ur: "ابراہیم بن المہدی کو خلیفہ کے طور پر بیعت کرنے کی دعوت سنہ 201 ہجری کے آخر میں کی گئی تھی، اور اہل بغداد نے 202 ہجری کے محرم میں ان سے بیعت کی تھی اور معزول المطابع المعرفۃ المعرفی j.8 صفحہ 557}۔"
