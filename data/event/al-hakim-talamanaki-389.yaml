label:
  ar: "الطلمنكي يكتب علوم الحديث عن الحاكم، ٣٨٩هـ"
  en: "Al-Talamanaki writes the sciences of hadith from al-Hakim's circle, 389/999"
  ur: "طلمنکی نے حاکم کے حلقے سے علومِ حدیث لکھیں، 389ھ/999ء"
summary:
  ar: "حُدث الحاكم عنه في حياته؛ وكتب أبو عمر الطلمنكي علوم الحديث للحاكم عن شيخ له سنة تسع وثمانين وثلاثمائة بسماعه من صاحب الحاكم عنه، فوقع حديثه عالياً {cite:tarikh-islam-dhahabi p. 124}."
  en: "Al-Hakim's hadith was already transmitted from him in his own lifetime: in 389/999 Abu Umar al-Talamanaki wrote the sciences of hadith for al-Hakim's corpus through a shaykh of his, by hearing from a companion of al-Hakim, so that the transmission reached posterity with a high isnad {cite:tarikh-islam-dhahabi p. 124}."
  ur: "حاکم سے ان کی حیات میں ہی حدیث رویت ہونے لگی؛ 389ھ/999ء میں ابو عمر طلمنکی نے اپنے ایک شیخ کے واسطے سے حاکم کے صاحب کی سماعت سے ان کے علومِ حدیث لکھیں، جس سے ان کی روایت عالی اسناد کے ساتھ پہنچی {cite:tarikh-islam-dhahabi p. 124}۔"
