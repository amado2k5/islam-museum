id: event/tughril-takes-rayy-435
class: event
kind: conquest
label: { ar: "طغرلبك يستولي على الري", en: "Tughril Beg Seizes al-Rayy" }
summary:
  ar: "في سنة خمس وثلاثين وأربعمائة استولى طغرلبك السلجوقي على الري وخسّر بها عسكره بالقتل والنهب حتى لم يبق بها إلا نحو ثلاثة آلاف نفس، وجاءت رسل طغرلبك إلى بغداد فأرسل الخليفةُ القائم بأمر الله القاضيَ الماوردي إليه يذم له ما صنع في البلاد ويأمره بالإحسان إلى الرعية، فتلقّاه طغرلبك واحترمه إجلالاً لرسالة الخليفة {cite:shadharat-dhahab p. 254}. ويحكي ابن الجوزي أنه كتب من الري إلى جلال الدولة يقول «الملك الجليل جلال الدولة من طغربك بن ميكائيل مولى أمير المؤمنين» ويذكر أنه قدم على كسب وخيرٍ ليس بينهما عداوة، فردّ جلال الدولة بمثل ذلك وتضمّن كلامًا موقّعًا، وتلقّى طغربك رسولَ الخليفة أربعة فراسخ إجلالًا لرسالته {cite:muntazam-ibn-al-jawzi j.8 p.458-459}."
  en: "In 435 Tughril Beg the Seljuk seized al-Rayy, and his soldiery killed and plundered until barely three thousand souls were left in it; his envoys came to Baghdad, and the caliph al-Qadir sent the qadi al-Mawardi to censure the deed and command him to treat the subjects well — Tughril received al-Mawardi with honour, in deference to the caliph's letter {cite:shadharat-dhahab p. 254}."
