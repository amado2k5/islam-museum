id: event/tughril-takes-rayy-435
class: event
kind: conquest
label: { ar: "طغرلبك يستولي على الري", en: "Tughril Beg Seizes al-Rayy", es: "Tughril Beg se apodera de al-Rayy", fr: "Tughril Beg s'empare d'al-Rayy", ur: "طغرل بیگ نے الرّی کو پکڑ لیا۔", tr: "Tughril Beg, Rayy'nin kontrolünü ele geçiriyor.", id: "Tughril Beg mengambil alih kendali Rayy." }
summary:
  ar: "في سنة خمس وثلاثين وأربعمائة استولى طغرلبك السلجوقي على الري وخسّر بها عسكره بالقتل والنهب حتى لم يبق بها إلا نحو ثلاثة آلاف نفس، وجاءت رسل طغرلبك إلى بغداد فأرسل الخليفةُ القائم بأمر الله القاضيَ الماوردي إليه يذم له ما صنع في البلاد ويأمره بالإحسان إلى الرعية، فتلقّاه طغرلبك واحترمه إجلالاً لرسالة الخليفة {cite:shadharat-dhahab p. 254}. ويحكي ابن الجوزي أنه كتب من الري إلى جلال الدولة يقول «الملك الجليل جلال الدولة من طغربك بن ميكائيل مولى أمير المؤمنين» ويذكر أنه قدم على كسب وخيرٍ ليس بينهما عداوة، فردّ جلال الدولة بمثل ذلك وتضمّن كلامًا موقّعًا، وتلقّى طغربك رسولَ الخليفة أربعة فراسخ إجلالًا لرسالته {cite:muntazam-ibn-al-jawzi j.8 p.458-459}."
  en: "In 435 Tughril Beg the Seljuk seized al-Rayy, and his soldiery killed and plundered until barely three thousand souls were left in it; his envoys came to Baghdad, and the caliph al-Qadir sent the qadi al-Mawardi to censure the deed and command him to treat the subjects well — Tughril received al-Mawardi with honour, in deference to the caliph's letter {cite:shadharat-dhahab p. 254}."
  es: "En 435, Tughril Beg, el selyúcida, tomó al-Rayy, y su ejército mató y saqueó hasta que apenas quedaron tres mil almas; sus enviados llegaron a Bagdad, y el califa al-Qadir envió al cadí al-Mawardi para censurar el acto y ordenarle que tratara bien a los súbditos. Tughril recibió a al-Mawardi con honores, en deferencia a la carta del califa {cite:shadharat-dhahab p. 254}."
  fr: "En 435, Tughril Beg, le Seldjoukide, s'empara d'al-Rayy, et ses soldats massacrèrent et pillèrent jusqu'à ce qu'il ne reste plus que trois mille âmes dans la ville; ses envoyés arrivèrent à Bagdad, et le calife al-Qadir envoya le cadi al-Mawardi pour condamner l'acte et lui ordonner de bien traiter les sujets — Tughril reçut al-Mawardi avec honneur, en déférence à la lettre du calife {cite:shadharat-dhahab p. 254}."
  ur: "435 میں طغرل بیگ سلجوق نے الرائے پر قبضہ کر لیا، اور اس کے سپاہیوں نے قتل اور لوٹ مار کی یہاں تک کہ بمشکل تین ہزار جانیں اس میں رہ گئیں۔ اس کے ایلچی بغداد آئے، اور خلیفہ القادر نے قادی الماوردی کو اس عمل کی مذمت کرنے اور رعایا کے ساتھ اچھا سلوک کرنے کا حکم دینے کے لیے بھیجا- طغرل نے خلیفہ کے خط کے احترام میں الماوردی کو اعزاز سے نوازا۔ 254}۔"
  tr: "Hicri 435 yılında (Miladi 1047/1048), Selçuklu Tuğrul Bey, Rey'i ele geçirmiş ve oradaki ordusunu yağma ve katliamlarla yok ederek sadece üç bin kadar insanı hayatta bırakmıştır. Tuğrul Bey'den Bağdat'a elçiler gelmiş ve Halife el-Kaim bi-Amr Allah, ülkedeki eylemlerini kınayan ve halka iyi davranmasını emreden kadı el-Mawardi'yi ona göndermiştir. Tuğrul Bey onu kabul etmiş ve Halife'nin mesajına duyduğu saygıdan dolayı ona saygı göstermiştir. {Kaynak: Şadharat-Dhaba s. 254}. İbn el-Cevzi, Tuğrul Bey'in Rey'den Celal el-Devla'ya yazdığı mektupta, \"Şanlı Kral Celal el-Devla'ya, Müminlerin Komutanı'nın azatlı kölesi Tuğrul Bey ibn Mikail'den\" dediğini ve iyi niyetle geldiğini ve aralarında hiçbir düşmanlık olmadığını belirttiğini aktarır. Celaleddin-Devla da aynı şekilde karşılık verdi ve imzalı bir mektup gönderdi. Tuğrul Bey, mesajına duyduğu saygıdan dolayı halifenin elçisini dört fersah (yaklaşık 1240 CE) sonra kabul etti. {cite:muntazam-ibn-al-jawzi j.8 pp. 458-459}."
  id: "Pada tahun 435 H (1047/1048 M), Tughril Beg dari Seljuk merebut Rayy dan menghancurkan pasukannya di sana melalui pembunuhan dan penjarahan, hanya menyisakan sekitar tiga ribu orang yang selamat. Utusan dari Tughril Beg tiba di Baghdad, dan Khalifah al-Qa'im bi-Amr Allah mengutus hakim al-Mawardi kepadanya, mengutuk tindakannya di negeri itu dan memerintahkannya untuk memperlakukan rakyat dengan baik. Tughril Beg menerimanya dan menunjukkan rasa hormat kepadanya sebagai penghormatan terhadap pesan Khalifah {kutip:shadharat-dhahab hlm. 254}. Ibn al-Jawzi menceritakan bahwa Tughril Beg menulis dari Rayy kepada Jalal al-Dawla, mengatakan, \"Kepada Raja Jalal al-Dawla yang mulia, dari Tughril Beg ibn Mika'il, orang yang dibebaskan oleh Amirul Mukminin,\" menyebutkan bahwa ia datang dengan niat baik dan tidak ada permusuhan di antara mereka. Jalal al-Dawla membalas dengan cara yang sama, termasuk surat yang ditandatangani. Tughril Beg menerima utusan Khalifah sebanyak empat farsakh (sekitar tahun 1240 M) sebagai tanda penghormatan atas pesannya {cite:muntazam-ibn-al-jawzi j.8 pp. 458-459}."
