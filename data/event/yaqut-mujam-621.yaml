id: event/yaqut-mujam-621
class: event
kind: other
label:
  ar: "تمام المسوَّدة الأولى لمعجم البلدان بحلب، ٢٠ صفر ٦٢١هـ/١٣ مارس ١٢٢٤م"
  en: "The draft of the Mujam al-Buldan finished at Aleppo, 20 Safar 621/13 March 1224"
  ur: "معجم البلدان کی مسودہ حلب میں مکمل، 20 صفر 621ھ/13 مارچ 1224ء"
  es: "El borrador del Mujam al-Buldan se terminó en Alepo, el 20 de Safar de 621/13 de marzo de 1224."
  fr: "Le projet du Mujam al-Buldan s'acheva à Alep le 20 Safar 621/13 mars 1224."
  tr: "Ülkeler Sözlüğü'nün ilk taslağı, Hicri 20 Safer 621 / Miladi 13 Mart 1224 tarihinde Halep'te tamamlanmıştır."
  id: "Draf pertama Kamus Negara-Negara diselesaikan di Aleppo, 20 Safar 621 H / 13 Maret 1224 M."
summary:
  ar: "فرغ ياقوت من المسوَّدة الأولى لكتابه «معجم البلدان» في حلب — لا في الموصل كما يُظن غالباً — في العشرين من صفر سنة ٦٢١هـ/١٣ مارس ١٢٢٤م، وأهداه بخطه إلى خزانة القفطي {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}. وهو الكتاب الذي تجاوز حدود الجغرافيا إلى مواد أدبية وتراجم لأعلام البلدان {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  en: "Yaqut finished the draft of his Mujam al-Buldan at Aleppo — not at Mosul, as is often thought — on 20 Safar 621/13 March 1224, and gave an autograph copy to al-Qifti's library {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}. The work ranges beyond geography into literary matter and biographies of the notables of each place {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  ur: "یاقوت نے معجم البلدان کی مسودہ حلب میں — نہیں جیسا کہ عموماً سمجھا جاتا ہے موصل میں — 20 صفر 621ھ/13 مارچ 1224ء کو مکمل کی اور اپنی خطاطی کی نقل قفطی کے کتب خانے کو پیش کی {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}. یہ کتاب جغرافیہ سے آگے بڑھ کر ادبی مادہ اور ہر شہر کے اعلام کی تراجم بھی سمیٹتی ہے {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}۔"
  es: "Yaqut terminó el borrador de su Mujam al-Buldan en Alepo —no en Mosul, como se suele creer— el 20 de Safar de 621/13 de marzo de 1224, y entregó una copia autógrafa a la biblioteca de al-Qifti {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}. La obra abarca más que la geografía, incluyendo temas literarios y biografías de los notables de cada lugar {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
  fr: "Yaqut acheva la rédaction de son Mujam al-Buldan à Alep — et non à Mossoul, comme on le croit souvent — le 20 Safar 621/13 mars 1224, et en remit un exemplaire autographe à la bibliothèque d'al-Qifti (voir Encyclopaedia of Islam, vol. 11, p. 265; Mawsuat alam ulama adaba, p. 278). L'ouvrage aborde non seulement la géographie, mais aussi des sujets littéraires et des biographies des notables de chaque lieu (voir Encyclopaedia of Islam, vol. 11, p. 265-266)."
  tr: "Yaqut, \"Mu'jam al-Buldan\" (Ülkeler Sözlüğü) adlı kitabının ilk taslağını, genellikle sanıldığı gibi Musul'da değil, Halep'te, Hicri 621 yılının Safer ayının 20'sinde / Miladi 13 Mart 1224'te tamamladı ve kendi el yazısıyla el-Kifti Kütüphanesi'ne ithaf etti. Bu kitap, coğrafi sınırları aşarak çeşitli ülkelerden önde gelen şahsiyetlerin edebi eserlerini ve biyografilerini de içeriyordu."
  id: "Yaqut menyelesaikan draf pertama bukunya \"Mu'jam al-Buldan\" (Kamus Negara-Negara) di Aleppo—bukan di Mosul seperti yang sering diasumsikan—pada tanggal 20 Safar, 621 H/13 Maret 1224 M, dan mendedikasikannya dengan tulisan tangannya sendiri kepada Perpustakaan al-Qifti {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}. Buku ini melampaui batas-batas geografis untuk mencakup materi sastra dan biografi tokoh-tokoh terkemuka dari berbagai negara {cite:encyclopaedia-of-islam-2 vol. 11 p. 265-266}."
