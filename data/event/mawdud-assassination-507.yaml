label: { ar: "قتل مودود صاحب الموصل بجامع دمشق", en: "The Killing of Mawdud, Lord of Mosul, in the Mosque of Damascus", es: "El asesinato de Mawdud, señor de Mosul, en la mezquita de Damasco.", fr: "L'assassinat de Mawdud, seigneur de Mossoul, dans la mosquée de Damas" }
summary:
  ar: "في سنة سبع وخمس مئة جاء مودود صاحب الموصل بعسكر ليقاتل ملك الفرنج الذي بالقدس فوقع بينهم معركة هائلة ثم رجع مودود إلى دمشق فصلى الجمعة يوماً في الجامع وإذا بباطني وثب عليه فجرحه فمات من يومه فكتب ملك الفرنج إلى صاحب دمشق كتاباً فيه وإن أمة قتلت عميدها في يوم عيدها في بيت معبودها لحقيق على الله أن يبيدها {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  en: "In 507 Mawdud, lord of Mosul, marched against the Frankish king of Jerusalem; after a great battle he returned to Damascus and was praying Jumu'a in the mosque when a Batini leapt on him — he died the same day. The Frankish king wrote Damascus's lord: 'a nation that kills its chief, on its feast-day, in its house of worship, deserves that God blot it out' {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  es: "En el año 507, Mawdud, señor de Mosul, marchó contra el rey franco de Jerusalén. Tras una gran batalla, regresó a Damasco y se encontraba rezando el Jumu'a en la mezquita cuando un Batini se abalanzó sobre él; murió ese mismo día. El rey franco escribió al señor de Damasco: «Una nación que mata a su jefe en su día festivo, en su lugar de culto, merece que Dios la aniquile» {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  fr: "En 507, Mawdud, seigneur de Mossoul, marcha contre le roi franc de Jérusalem. Après une grande bataille, il retourna à Damas et priait la prière du vendredi à la mosquée lorsqu'un batini lui sauta dessus; il mourut le jour même. Le roi franc écrivit au seigneur de Damas: « Une nation qui tue son chef, le jour de sa fête, dans son lieu de culte, mérite que Dieu l'anéantisse. » (Voir: Tarikh-Khulafa-Minhaj-1434, p. 661)."
