summary:
  ar: "في سنة سبع وخمس مئة جاء مودود صاحب الموصل بعسكر ليقاتل ملك الفرنج الذي بالقدس فوقع بينهم معركة هائلة ثم رجع مودود إلى دمشق فصلى الجمعة يوماً في الجامع وإذا بباطني وثب عليه فجرحه فمات من يومه فكتب ملك الفرنج إلى صاحب دمشق كتاباً فيه وإن أمة قتلت عميدها في يوم عيدها في بيت معبودها لحقيق على الله أن يبيدها {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  en: "In 507 Mawdud, lord of Mosul, marched against the Frankish king of Jerusalem; after a great battle he returned to Damascus and was praying Jumu'a in the mosque when a Batini leapt on him — he died the same day. The Frankish king wrote Damascus's lord: 'a nation that kills its chief, on its feast-day, in its house of worship, deserves that God blot it out' {cite:tarikh-khulafa-minhaj-1434 p. 661}."
