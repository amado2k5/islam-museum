id: event/al-hadi-musters-at-saada-on-2-ramadan-and-scouts-al-sabra-287
class: event
kind: other
label:
  ar: "الهادي يحشد بصعدة يوم 2 رمضان 287هـ ويستطلع الصبرة"
  en: "Al-Hadi musters at Sa'da on 2 Ramadan 287 AH and scouts al-Sabra"
  ur: "2 رمضان 287ھ کو صعدہ میں ہادی کا لشکر جمع کرنا اور الصبرہ کی جاسوسی"
summary:
  ar: "يوم الأحد لليلتين خلتا من رمضان وجّه الهادي الصوارخ إلى سعد خولان فاجتمعوا بساحة صعدة، وأرسل أبا تراب محمد بن العباس العلوي في فرسان وجند ليدخل علاف من أعلاها، وعبّأ العسكر بالبقعة ثم الغريب، وتأمل تعبية القوم قرب الصبرة، وحذّره محمد بن مصبح."
  en: "On Sunday, two nights into Ramadan, al-Hadi sent criers to Sa'd Khawlan and they gathered in the square of Sa'da; he sent Abu Turab Muhammad ibn al-Abbas al-Alawi with horse and troops to enter Allaf from its top, drew up the army at al-Buq'a and then al-Ghurayb, studied the enemy's array near al-Sabra, and was warned by Muhammad ibn Musbih."
  ur: "اتوار کو رمضان کی دو راتیں گزرنے پر ہادی نے سعد خولان میں منادی بھیجی اور وہ صعدہ کے صحن میں جمع ہوئے؛ انہوں نے ابو تراب محمد بن عباس علوی کو سواروں اور فوج کے ساتھ علاف میں اس کی بلندی سے داخل ہونے بھیجا، البقعہ اور پھر الغریب میں لشکر صف بند کیا، الصبرہ کے قریب دشمن کی صف بندی دیکھی، اور محمد بن مصبح نے انہیں خبردار کیا۔"
