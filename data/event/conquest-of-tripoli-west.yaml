summary:
  ar: "فتح برقة وطرابلس: سار عمرو بن العاص من مصر إلى برقة فصالحه أهلها على ثلاثة عشر ألف دينار يؤدونها جزية وشرطوا أن يبيعوا من أرادوا من أولادهم في جزيتهم، ثم سار إلى طرابلس فحاصرها شهرًا فلم يظفر بها وكان قد نزل شرقيها. خرج رجل من بني مدلج يتصيد في سبعة نفر وسلكوا غرب المدينة فاشتد عليهم الحر فأخذوا على جانب البحر ولم يكن السور متصلًا بالبحر فرأوا مسلكًا بين البحر والبلد فدخلوا منه وكبّروا، فلم يكن للروم ملجأ إلا سفنهم ظنًا أن المسلمين دخلوا البلد، فأقبل عمرو بجيشه حتى دخل البلد فلم يفلت الروم إلا بما خف معهم في مراكبهم. وبها لواتة من البربر {cite:kamil-ibn-al-athir p. 408-409}."
  en: "Amr ibn al-'As took Barqa on a 13,000-dinar jizya — its people stipulating the sale of such children as they wished against their tax — then sat a month before Tripoli. A hunting party of the Banu Mudlij, hugging the shore, found a gap where the wall never reached the sea, slipped in and raised the takbir; the Romans thought the city stormed and fled to their ships, and Amr's army walked in. Then Sabra was surprised at dawn and Lawata of the Berbers had their terms {cite:kamil-ibn-al-athir p. 408-409}."
