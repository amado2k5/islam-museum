id: event/spider-web-at-ghar-thawr
class: event
kind: other
label:
  ar: "نسج العنكبوت على باب غار ثور"
  en: "The spider's web across the mouth of the cave of Thawr"
  ur: "غار ثور کے دہانے پر مکڑی کا جالا"
  es: "La telaraña que cruza la entrada de la cueva de Thawr"
  fr: "La toile d'araignée barrait l'entrée de la grotte de Thawr"
  tr: "Thawr'ın mağarasının girişindeki örümcek ağı."
  id: "Jaring laba-laba di pintu masuk gua Thawr"
summary:
  ar: "نقل ابن حجر، في ترجمة كرز بن علقمة الخزاعي، عن عروة بن الزبير أن كرزاً قفا أثر النبي وأبي بكر حتى انتهى إلى غار ثور، فرأى نسج العنكبوت على بابه، فقال: إلى ههنا انتهى أثره، ثم لا أدري أخذ يميناً أو شمالاً أو صعد الجبل {cite:ibn-hajar-isaba p.304}."
  en: "Ibn Hajar, in the biography of Kurz ibn Alqama al-Khuza'i, transmits from Urwa ibn al-Zubayr that Kurz followed the tracks of the Prophet and Abu Bakr to the cave of Thawr, saw a spider's web across its door, and said: the trail ends here; I do not know whether they took the right hand, the left, or climbed the mountain {cite:ibn-hajar-isaba p.304}. This is a report transmitted through later narrators; the early account of the three nights in the cave is in event/ghar-thawr."
  ur: "ابن حجر نے کرز بن علقمہ الخزاعی کے ترجمے میں عروہ بن الزبیر سے نقل کیا ہے کہ کرز نبی اور ابوبکر کے نشانِ قدم کے پیچھے غار ثور تک آئے، غار کے دروازے پر مکڑی کا جالا دیکھا، اور کہا: نشان یہیں ختم ہو گیا، معلوم نہیں دائیں گئے، بائیں یا پہاڑ پر چڑھ گئے {cite:ibn-hajar-isaba p.304}۔ یہ روایت بعد کے راویوں کے ذریعے پہنچی ہے؛ تین راتوں کا بیان event/ghar-thawr میں ہے۔"
  es: "Ibn Hajar, en la biografía de Kurz ibn Alqama al-Khuza'i, transmite de Urwa ibn al-Zubayr que Kurz siguió las huellas del Profeta y Abu Bakr hasta la cueva de Thawr, vio una telaraña en su entrada y dijo: «El rastro termina aquí; no sé si tomaron el camino de la derecha, el de la izquierda o subieron la montaña» {cita:ibn-hajar-isaba p.304}. Este es un relato transmitido por narradores posteriores; el relato más antiguo de las tres noches en la cueva se encuentra en event/ghar-thawr."
  fr: "Ibn Hajar, dans la biographie de Kurz ibn Alqama al-Khuza'i, rapporte d'après Urwa ibn al-Zubayr que Kurz suivit les traces du Prophète et d'Abu Bakr jusqu'à la grotte de Thawr, y vit une toile d'araignée à l'entrée et déclara: « La piste s'arrête ici; j'ignore s'ils prirent la droite, la gauche ou s'ils escaladèrent la montagne » (Ibn Hajar, p. 304). Ce récit a été transmis par des narrateurs postérieurs; le récit original des trois nuits passées dans la grotte se trouve dans l'ouvrage « event/ghar-thawr »."
  tr: "İbn Hacer, Kurz ibn Alkame el-Huzaî'nin biyografisinde, Urve ibn el-Zübeyr'den rivayet edildiğine göre, Kurz, Peygamber ve Ebu Bekir'in ayak izlerini takip ederek Sevr mağarasına ulaştı ve kapısında örümcek ağı gördü. Bunun üzerine şöyle dedi: \"Ayak izleri burada sona erdi, sonra sağa mı, sola mı gitti yoksa dağa mı tırmandı bilmiyorum.\" {İbn-Hacer-İsaba, s. 304}"
  id: "Ibn Hajar, dalam biografi Kurz ibn Alqamah al-Khuza’i, meriwayatkan dari Urwah ibn al-Zubayr bahwa Kurz mengikuti jejak Nabi dan Abu Bakar hingga sampai di gua Thawr, dan melihat jaring laba-laba di pintunya, lalu ia berkata: Jejak langkahnya berakhir di sini, kemudian aku tidak tahu apakah ia pergi ke kanan atau ke kiri atau mendaki gunung {kutip:ibn-hajar-isaba hlm.304}."
