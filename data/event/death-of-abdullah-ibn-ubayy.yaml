label: { en: "The death of Abdullah ibn Ubayy and the Prophet's prayer over him", ar: "وفاة عبد الله بن أبيّ والصلاة عليه" }
summary:
  en: "Soon after the return from Tabuk in 9 AH, Abdullah ibn Ubayy — chief of the hypocrites — died; the Prophet sought forgiveness for him and prayed over him despite Umar's attempt to dissuade him, and the revelation afterwards sided with Umar's objection, forbidding prayer over such people or standing at their graves."
  ar: "مات رأس المنافقين عبد الله بن أبيّ بعد مرجع النبي من تبوك سنة 9هـ؛ فاستغفر له النبي وصلى عليه وقد حاول عمر منعه عن الصلاة عليه، ثم نزل القرآن بعد ذلك بموافقة عمر ناهياً عن الصلاة على من كان كذلك وعن القيام على قبره. وفي الصحيح أن النبي أمر به بعدما أدخل حفرته فأخرج فوضعه على ركبتيه ونفث عليه من ريقه وألبسه قميصه {cite:sahih-al-bukhari 1350}."
