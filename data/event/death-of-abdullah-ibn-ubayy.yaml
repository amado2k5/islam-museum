perspectives:
  - tradition: sunni
    id: sunni-ibn-ishaq
    stance: { ar: "خبر يرويه عمر نفسه ويُنهي بنزول الآية" }
    summary: { ar: "يروي ابن إسحاق عن الزهري عن عبيد الله بن عبد الله عن ابن عباس قول عمر: أتصلي على عدو الله القائل كذا يوم كذا؟ والنبي يتبسم، فلما أكثر قال: أخّر عني، إني خيرت فاخترت، ولو أعلم أن الزيادة على السبعين تغفر له لزدت؛ ثم صلى ومشى معه حتى وقف على قبره، ثم نزلت الآيتان فما صلى بعدها على منافق." }
    sources: [source/ibn-hisham-saqqa, source/sahih-al-bukhari]
  - tradition: sunni
    id: sunni-later
    stance: { ar: "تأويل الاستغفار وتقدير الآية" }
    summary: { ar: "يذهب شرّاح الحديث المتأخرون إلى أن الاستغفار كان تأليفاً لقومه أو تعلقاً بالوعد الذي خيّره فيه الله، وأن الآية نهت عن الصلاة على المنافقين بعد ذلك؛ المراجع المحددة لم تُضف بعد (needs_source)." }
    sources: [source/sahih-al-bukhari]
  - tradition: academic
    id: academic
    summary: { ar: "تقرأ الدراسات الحديثة الخبر في سياق توحيد المدينة بعد تبوك، وتلاحظ أن موقف عمر فيه يُستعمل بعد ذلك لتعيين الحد الفاصل بين الجماعة والمنافقين؛ مرجع أكاديمي محدد لم يُضف بعد (needs_source)." }
    sources: [source/ibn-hisham-saqqa]
