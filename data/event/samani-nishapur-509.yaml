id: event/samani-nishapur-509
class: event
kind: other
label:
  ar: "أبو بكر السمعاني يحمل ابنه الطفل عبد الكريم إلى نيسابور للسماع، ٥٠٩هـ/١١١٥م"
  en: "Abu Bakr al-Sam'ani takes his small son 'Abd al-Karim to Nishapur for hadith hearings, 509/1115"
  ur: "ابو بکر سمعانی اپنے خردسال بیٹے عبدالکریم کو سماعتِ حدیث کے لیے نیشاپور لے جاتے ہیں، 509ھ/1115ء"
  es: "Abu Bakr al-Sam'ani lleva a su pequeño hijo 'Abd al-Karim a Nishapur para escuchar hadices, 509/1115"
  fr: "Abou Bakr al-Sam'ani emmène son jeune fils 'Abd al-Karim à Nishapur pour des audiences de hadiths, 509/1115"
  tr: "Ebu Bekir el-Sam'ani, henüz bebek olan oğlu Abdülkerim'i müzik dinlemeye götürmek için Hicri 509/Miladi 1115 yılında Nişapur'a götürüyor."
  id: "Abu Bakr al-Sam'ani membawa putranya yang masih bayi, Abd al-Karim, ke Nishapur untuk mendengarkan musik, 509 H/1115 M"
summary:
  ar: "حمل أبو بكر السمعاني ابنه عبد الكريم إلى نيسابور سنة تسع وخمسمائة، وأحضره السماع من عبد الغفار الشيروتي وأبي العلاء عبيد بن محمد القشيري وجماعة {cite:tarikh-islam-dhahabi p. 119}؛ وكان قد أخذه وهو ابن سنتين معه إلى مجالس الحديث، ورحل به ومع أخيه الأكبر سنة ٥٠٩هـ إلى نيسابور ليزيد في تعليمه على محدثيها {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  en: "Abu Bakr al-Sam'ani carried his son 'Abd al-Karim to Nishapur in 509 (1115), sat him in the hearings of 'Abd al-Ghaffar al-Shiruti, Abu al-'Ala' 'Ubayd ibn Muhammad al-Qushayri and others {cite:tarikh-islam-dhahabi p. 119}; he had already taken him as a two-year-old into the hadith sessions, and now travelled with him and his elder brother to Nishapur for further instruction by its traditionists {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  ur: "ابو بکر سمعانی نے 509ھ ⁦(1115ء)⁩ میں اپنے بیٹے عبدالکریم کو نیشاپور پہنچایا اور عبدالغفار شیروتی، ابوالعلا عبید بن محمد قشیری اور دیگر کے دروسِ سماعت میں بٹھایا {cite:tarikh-islam-dhahabi p. 119}؛ وہ اسے دو سال کی عمر سے ہی مجالسِ حدیث میں لے جاتے تھے اور اب بڑے بھائی سمیت نیشاپور لے گئے تاکہ وہاں کے محدثین سے مزید تعلیم دلائیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}۔"
  es: "Abu Bakr al-Sam'ani llevó a su hijo 'Abd al-Karim a Nishapur en 509 (1115), lo sentó en las audiencias de 'Abd al-Ghaffar al-Shiruti, Abu al-'Ala' 'Ubayd ibn Muhammad al-Qushayri y otros {cite:tarikh-islam-dhahabi p. 119}; ya lo había llevado cuando tenía dos años a las sesiones de hadices, y ahora viajó con él y su hermano mayor a Nishapur para recibir más instrucción de sus tradicionalistas {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  fr: "Abu Bakr al-Sam'ani emmena son fils 'Abd al-Karim à Nishapur en 509 (1115), le fit asseoir aux audiences de 'Abd al-Ghaffar al-Shiruti, Abu al-'Ala' 'Ubayd ibn Muhammad al-Qushayri et d'autres {cite:tarikh-islam-dhahabi p. 119}; il l'avait déjà emmené, alors âgé de deux ans, aux sessions de hadith, et voyagea maintenant avec lui et son frère aîné à Nishapur pour un enseignement plus poussé auprès de ses traditionnistes {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  tr: "Ebu Bekr el-Sam'ani, oğlu Abdülkerim'i Hicri 509 yılında Nişapur'a götürerek, Abdülgafer el-Şirüti, Ebu el-Ala' Ubeyd ibn Muhammed el-Kuşeri ve diğer bir grup hadis âliminden ders almasını sağladı. Oğlunu iki yaşındayken hadis toplantılarına götürmüş ve Hicri 509 yılında ağabeyiyle birlikte Nişapur'a giderek hadis âlimlerinden eğitimini artırmıştı."
  id: "Abu Bakr al-Sam’ani membawa putranya, Abd al-Karim, ke Nishapur pada tahun 509 H, dan membawanya untuk mendengarkan ceramah dari Abd al-Ghaffar al-Shirouti, Abu al-Ala’ Ubayd ibn Muhammad al-Qushayri, dan sekelompok ulama lainnya. Ia telah membawa Abd al-Karim ke pertemuan-pertemuan hadits ketika ia berusia dua tahun, dan ia melakukan perjalanan bersama Abd al-Karim dan kakak laki-lakinya pada tahun 509 H ke Nishapur untuk meningkatkan pendidikannya bersama para ulama hadits di sana."
