summary:
  ar: "بطاقة أولية لحصار إشقودرة من ١٩١٢ إلى ١٩١٣م، سقوط المدينة العثمانية بيد مونتنيغرو وصربيا في حرب البلقان؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Scutari of 1912–1913, the Ottoman city's fall to Montenegro and Serbia in the Balkan War; its sources are not yet checked on the page."
  es: "Boceto para el asedio de Scutari de 1912-1913, la caída de la ciudad otomana en manos de Montenegro y Serbia en la Guerra de los Balcanes; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de campagne pour le siège de Scutari de 1912-1913, la chute de la ville ottomane aux mains du Monténégro et de la Serbie pendant la guerre balkanique; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1912-1913 کے سکوٹاری کے محاصرے کے لیے ڈرافٹ کارڈ، بلقان جنگ میں عثمانی شہر کا مونٹی نیگرو اور سربیا میں زوال؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Balkan Savaşı'nda Osmanlı kenti Shkodër'in Karadağ ve Sırbistan'ın eline geçmesini konu alan, 1912-1913 yılları arasındaki Shkodër Kuşatması'na dair ön bilgiler; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pengepungan Shkodër dari tahun 1912 hingga 1913 M, jatuhnya kota Ottoman ke tangan Montenegro dan Serbia dalam Perang Balkan; sumber-sumber di halaman ini belum ditinjau."
