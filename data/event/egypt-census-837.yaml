label: { ar: "إحصاء النول والقرى 837هـ", en: "The Loom and Village Census of 837", es: "El Censo de Telar y Pueblo de 837", fr: "Le recensement des métiers à tisser et des villages de 1837", ur: "837 کی لوم اور گاؤں کی مردم شماری", tr: "Hicri 837 yılında köyler ve dokuma tezgahlarına ilişkin istatistikler.", id: "Statistik desa dan alat tenun, 837 H" }
summary:
  ar: "في شذرات الذهب سنة سبع وثلاثين وثمان مئة أحصى من بالإسكندرية من الحاكة فكان فيها ثمان مئة نول وكان ذلك آخر القرن الثامن أربعة عشر ألف نول ومن ذلك أن كتاب الجيش أحصوا قرى مصر قبليها وبحريها فكانت ألفين ومئة وسبعين قرية بعد أن كانت في أوائل دولة الفاطميين عشرة آلاف قرية {cite:shadharat-dhahab p. 226}."
  en: "A stark demographic register for 837: Alexandria's weavers' looms counted 800 against 14,000 at the eighth century's close, and the army clerks' census found Egypt's villages, Upper and Lower, at 2,170 against 10,000 under the early Fatimids {cite:shadharat-dhahab p. 226}."
  es: "Un crudo registro demográfico para el año 837: los telares de los tejedores de Alejandría contaban con 800 frente a 14.000 a finales del siglo VIII, y el censo de los escribanos del ejército encontró que las aldeas de Egipto, tanto la Alta como la Baja, tenían 2.170 habitantes frente a 10.000 bajo los primeros fatimíes {cita: shadharat-dhahab p. 226}."
  fr: "Un registre démographique saisissant pour 837: les métiers à tisser d'Alexandrie comptaient 800 contre 14 000 à la fin du VIIIe siècle, et le recensement des commis de l'armée a trouvé les villages d'Égypte, Haute et Basse, à 2 170 contre 10 000 sous les premiers Fatimides {cite: shadharat-dhahab p. 226}."
  ur: "837 کے لیے ایک مکمل آبادیاتی رجسٹر: آٹھویں صدی کے اختتام پر اسکندریہ کے بنکروں کی گنتی 14,000 کے مقابلے میں 800 تھی، اور فوج کے کلرکوں کی مردم شماری میں مصر کے دیہات، بالائی اور زیریں، ابتدائی فاطمیدوں کے تحت 10,000 کے مقابلے میں 2,170 تھے۔ 226}۔"
  tr: "Hicri 837 yılında Şadharat el-Dhahab'da İskenderiye'deki dokumacı sayısı sayılmış ve sekiz yüz tezgah olduğu tespit edilmiştir. Sekizinci yüzyılın sonunda ise on dört bin tezgah bulunmaktaydı. Ayrıca, ordu katipleri Mısır'ın hem kuzeyindeki hem de güneyindeki köyleri saymış ve Fatımi devletinin başlangıcında on bin köy varken, şimdi iki bin yüz yetmiş köy olduğu tespit edilmiştir. {kaynak: Şadharat el-Dhahab s. 226}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 837 H, jumlah penenun di Alexandria dihitung, dan terdapat delapan ratus alat tenun. Pada akhir abad kedelapan, terdapat empat belas ribu alat tenun. Selain itu, juru tulis militer menghitung desa-desa di Mesir, baik di utara maupun selatan, dan terdapat dua ribu seratus tujuh puluh desa, setelah sebelumnya terdapat sepuluh ribu desa pada awal berdirinya negara Fatimiyah. {cite:shadharat-dhahab hlm. 226}."
