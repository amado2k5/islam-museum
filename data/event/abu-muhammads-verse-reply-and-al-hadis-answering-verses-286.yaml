id: event/abu-muhammads-verse-reply-and-al-hadis-answering-verses-286
class: event
kind: other
label:
  ar: جواب أبي محمد بالشعر وجواب الهادي عليه، 286هـ
  en: Abu Muhammad's verse reply and al-Hadi's answering verses, 286 AH
  ur: ابو محمد کا منظوم جواب اور ہادی کے جوابی اشعار، 286ھ
summary:
  ar: يقرأ أبو محمد كتاب الهادي على الناس فيسرون، ثم يجيب بقصيدة يصدق فيها الهادي ويقول إنه لن يتخلف عن الحرب ويحكم بالكتاب، ويرد الهادي عليه بقصيدة يعلن فيها مودته ويذكر حقه وحق من يؤيدونه ويتوعد المخالفين.
  en: Abu Muhammad reads al-Hadi's letter to the people, who are glad, then answers with a poem that affirms al-Hadi and says he will not hold back from the war and will judge by the Book, and al-Hadi replies in a poem declaring his affection, naming his right and that of those who back him, and warning those who oppose.
  ur: ابو محمد ہادی کا خط لوگوں کو پڑھ کر سناتے ہیں اور وہ خوش ہوتے ہیں، پھر ایک قصیدے میں جواب دیتے ہیں جس میں ہادی کی تصدیق ہے اور کہتے ہیں کہ وہ جنگ سے پیچھے نہ رہیں گے اور کتاب کے مطابق فیصلہ کریں گے، اور ہادی ایک قصیدے میں جواب دیتے ہیں جس میں اپنی محبت کا اعلان، اپنے حق اور اپنے ساتھیوں کے حق کا ذکر اور مخالفوں کو تنبیہ ہے۔
