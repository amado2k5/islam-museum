id: event/al-hadi-marches-on-ibn-abbad-and-razes-the-houses-and-vines-of-allaf-290
class: event
kind: other
label:
  ar: "مسير الهادي إلى ابن عباد وهدم منازل علاف وقطع أعنابها، المحرم 290هـ"
  en: "Al-Hadi marches on Ibn Abbad and razes the houses and vines of Allaf, Muharram 290 AH"
  ur: "ہادی کی ابن عباد پر چڑھائی اور علاف کے گھروں اور انگوروں کی تباہی، محرم 290ھ"
  es: "Al-Hadi marcha sobre Ibn Abbad y arrasa las casas y los viñedos de Allaf, Muharram 290 AH."
  fr: "Al-Hadi marche sur Ibn Abbad et rase les maisons et les vignes d'Allaf, en ce mois de Muharram 290 AH."
  tr: "El-Hadi, İbn Abbad'a yürüdü ve Allaf'ın evlerini yıktı, üzüm bağlarını kesti. Bu olay Hicri 290 yılının Muharrem ayında gerçekleşti."
  id: "Al-Hadi bergerak menuju Ibnu Abbas dan menghancurkan rumah-rumah Allaf serta menebang tanaman anggur mereka, Muharram 290 H."
summary:
  ar: "في المحرم سنة 290هـ عزم الهادي على مناهضة القوم، وكان ابن الحكمي قد أمدّ ابن عباد بعسكر، فلما علموا فرّقوا عسكر آل طريف وعسكر الحكمي وبقي ابن عباد وعشيرته؛ فسار الهادي إلى الحدائق يوم الخميس وقاتل يوم السبت وطردهم في الجبال ودخل حصن علاف فهدم المنازل وقطع الأعناب، وطلب الزبير بن محمد الكليبي الأمان لنفسه ولأهله فآمنه، ثم آمن بني كليب جميعاً بطلب الزبير وبعد أن جاءه سليمان بن حجر."
  en: "In Muharram 290 AH al-Hadi resolved to march on the men; Ibn al-Hakami had sent Ibn Abbad an army, and when they learned of it they dispersed the armies of Al Tarif and al-Hakami, leaving Ibn Abbad and his clan; al-Hadi went to al-Hadaiq on Thursday and fought on Saturday, drove them into the mountains and entered the fort of Allaf, razing the houses and cutting the vines; al-Zubayr ibn Muhammad al-Kulaybi asked safety for himself and his household and received it, and then, when Sulayman ibn Hajar had come, al-Hadi gave safety to all of Banu Kulayb."
  ur: "محرم 290ھ میں ہادی نے مخالفوں پر چڑھائی کا ارادہ کیا؛ ابن الحکمی نے ابن عباد کو لشکر دیا تھا اور جب انہیں علم ہوا تو انہوں نے آل طریف اور حکمی کے لشکر بکھیر دیے اور ابن عباد اور اس کا قبیلہ رہ گئے؛ ہادی جمعرات کو حدائق گئے، ہفتے کو لڑے، انہیں پہاڑوں میں بھگایا اور علاف کے قلعے میں داخل ہو کر گھر گرائے اور انگور کاٹے؛ زبیر بن محمد کلیبی نے اپنے اور اپنے گھر والوں کے لیے امان مانگی جو انہیں ملی، پھر سلیمان بن حجر کے آنے پر ہادی نے سب بنو کلیب کو امان دی۔"
  es: "En Muharram del año 290 AH, al-Hadi decidió marchar contra los hombres; Ibn al-Hakami había enviado un ejército a Ibn Abbad, y cuando se enteraron, dispersaron los ejércitos de Al Tarif y al-Hakami, dejando a Ibn Abbad y su clan; al-Hadi fue a al-Hadaiq el jueves y luchó el sábado, los hizo retroceder a las montañas y entró en la fortaleza de Allaf, arrasando las casas y cortando las vides; al-Zubayr ibn Muhammad al-Kulaybi pidió protección para sí mismo y su familia y la recibió, y luego, cuando Sulayman ibn Hajar llegó, al-Hadi dio seguridad a todos los Banu Kulayb."
  fr: "En Muharram 290 AH, al-Hadi résolut de marcher sur les hommes; Ibn al-Hakami avait envoyé une armée à Ibn Abbad, et lorsqu'ils l'apprirent, ils dispersèrent les armées d'Al Tarif et d'al-Hakami, laissant Ibn Abbad et son clan; al-Hadi se rendit à al-Hadaiq le jeudi et combattit le samedi, les repoussant dans les montagnes et entrant dans le fort d'Allaf, rasant les maisons et coupant les vignes; al-Zubayr ibn Muhammad al-Kulaybi demanda la sécurité pour lui et sa famille et l'obtint, puis, lorsque Sulayman ibn Hajar arriva, al-Hadi accorda la sécurité à tous les Banu Kulayb."
  tr: "Hicri 290 yılının Muharrem ayında, Al-Hadi halka karşı koymaya karar verdi. İbn Al-Hakami, İbn Abbad'a bir ordu vermişti. Bunu öğrenince, Al-Tarif'in ve Al-Hakami'nin ordularını dağıttılar ve İbn Abbad ile kabilesi kaldı. Al-Hadi Perşembe günü bahçelere yürüdü ve Cumartesi günü savaşarak onları dağlara sürdü. Allaf kalesine girdi, evleri yıktı ve üzüm bağlarını kesti. Al-Zubayr ibn Muhammed Al-Kulaibi kendisi ve ailesi için güvenlik istedi ve ona güvenlik sağlandı. Daha sonra, Süleyman ibn Hacer'in yanına gelmesinden sonra, Al-Zubayr'ın isteği üzerine Beni Kulayb'ın tamamına güvenlik sağlandı."
  id: "Pada bulan Muharram tahun 290 H, Al-Hadi memutuskan untuk melawan orang-orang. Ibn Al-Hakami telah menyediakan pasukan untuk Ibn Abbad. Ketika mereka mengetahui hal ini, mereka membubarkan pasukan Al Tarif dan pasukan Al-Hakami, dan Ibn Abbad beserta keluarganya tetap tinggal. Al-Hadi bergerak menuju kebun-kebun pada hari Kamis dan berperang pada hari Sabtu, mengusir mereka ke pegunungan. Ia memasuki benteng Allaf, menghancurkan rumah-rumah, dan menebang tanaman anggur. Al-Zubayr ibn Muhammad Al-Kulaibi meminta perlindungan untuk dirinya dan keluarganya, dan permintaannya dikabulkan. Kemudian seluruh Bani Kulayb juga diberikan perlindungan atas permintaan Al-Zubayr, setelah Sulayman ibn Hajar datang kepadanya."
