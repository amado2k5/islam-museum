label: { ar: "تحقيق علي في مال الرجل المفقود", en: "Ali's inquiry into a missing traveller and his wealth" }
summary:
  ar: "شكا شاب إلى علي أن رفقة سافروا مع أبيه فعادوا ولم يعد أبوه، وأن ماله غاب معهم. أمر علي بالشرطة فوكّل بكل رجل رجلين، ومنعهم من الاجتماع أو الكلام، ثم استجوب كل واحد على حدة عن يوم الخروج والمنزل وكيفية السير وسبب الموت، وكتب الكاتب، فتناقضت أقوالهم، فاعترف أحدهم وأُغرموا المال {cite:sallabi-ali-vol1 p. 271}. يعرض الصلابي القصة في باب الشرطة وتحقيقها {cite:sallabi-ali-vol1 p. 271}."
  en: "A young man complained that a company of travellers came back without his father and with his father's money. Ali had the police guard each suspect separately, questioned each on the journey, the lodgings, the cause of death and the burial, and found their accounts contradictory; one confessed, and they were made to pay {cite:sallabi-ali-vol1 p. 271}."
