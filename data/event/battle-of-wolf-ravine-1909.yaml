summary:
  ar: "بطاقة أولية لمعركة وادي الذئاب سنة ١٩٠٩م، هزيمة الإسبانيين أمام الريفيين في حرب مليلية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of the Wolf Ravine (Barranco del Lobo) in 1909, the Rifian defeat of the Spanish column in the Melilla war; its sources are not yet checked on the page."
  es: "Boceto para la Batalla del Barranco del Lobo en 1909, la derrota rifeña de la columna española en la guerra de Melilla; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de convocation pour la bataille du ravin du Loup (Barranco del Lobo) en 1909, la défaite rifaine de la colonne espagnole lors de la guerre de Melilla; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1909 میں وولف ریوائن ⁦(بارانکو ڈیل لوبو)⁩ کی جنگ کے لیے ڈرافٹ کارڈ، میلیلا جنگ میں ہسپانوی کالم کی رفیان کی شکست؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1909 yılında gerçekleşen ve Melilla Savaşı'nda İspanyolların Rifialılar tarafından yenilgiye uğratıldığı Vadi el-Dhiab Muharebesi'ne dair ön bilgiler; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Wadi al-Dhiab pada tahun 1909 M, kekalahan Spanyol oleh penduduk Rifia dalam Perang Melilla; sumber-sumbernya belum ditinjau di halaman ini."
