summary:
  ar: "فتح خراسان على يد عبد الله بن عامر: نقض أهل خراسان لما قُتل عمر فسار ابن عامر والأحنف بن قيس على مقدمته، فصالحه أهل الطبسين وهما بابا خراسان وقوهستان على ستمائة ألف درهم، وفتح زام وباخرز وجوين، وقتل الأسود بن كلثوم العدوي الناسك عند ثلمة بيهق وقام أخوه أدهم فظفر بها — وكان الأسود يدعو الله أن يحشره من بطون السباع والطير فلم يواره أخوه. وحصر نيسابور أشهرًا فطلب صاحب أحد أرباعها الأمان فأدخلهم ليلًا ففتحوا الباب وتحصن مرزبانها الأكبر فصالحه على ألف ألف درهم وولّى نيسابور قيس بن الهيثم، وصالحه مرزبان هراة على ألف ألف ومرزبان مرو على ألفي ألف ومائتي ألف درهم، وسيّر الأحنف إلى طخارستان فحصر رستاق سوانجر فصالحوه على أن يؤذّن رجل منهم في القصر ويقيم فيهم حتى ينصرف، وحمل عليه ملك الصغانيان فانتزع الأحنف الرمح من يده فانهزم المشركون {cite:kamil-ibn-al-athir p. 493-495}."
  en: "Khurasan under 'Abdallah ibn 'Amir with al-Ahnaf ibn Qays in the van: the Tabasayn — Khurasan's gates — and Quhistan bought peace at 600,000 dirhams; al-Aswad ibn Kulthum the ascetic died at Bayhaq's breach and was left unburied by his own wish («raise me from the bellies of beast and bird«); Nishapur was let in at night through a quarter-master's treachery, its grand marzban ransoming all at a million dirhams; Herat a million, Marw 2,200,000. At Tukharistan al-Ahnaf made peace on condition a Muslim enter the fortress, give the adhan there and stay till he marched out — then wrenched the lance from the king of Sughaniyan's hand as he charged {cite:kamil-ibn-al-athir p. 493-495}."
  es: "Jorasán, bajo el mando de Abdallah ibn Amir con al-Ahnaf ibn Qays al frente: las puertas de Jorasán y Quhistán compraron la paz por 600.000 dirhams; al-Aswad ibn Kulthum, el asceta, murió en la brecha de Bayhaq y fue dejado sin sepultura por su propio deseo («sácame de las entrañas de las bestias y las aves»); Nishapur fue abierto de noche por la traición de un intendente, y su gran marzban rescató a todos por un millón de dirhams; Herat un millón, Marw 2.200.000. En Tukharistán, al-Ahnaf hizo la paz con la condición de que un musulmán entrara en la fortaleza, diera el adhan allí y permaneciera hasta que saliera marchando; luego le arrebató la lanza de la mano al rey de Sughaniyan mientras cargaba {cite:kamil-ibn-al-athir p. 493-495}."
  fr: "Au Khorasan, sous le règne d'Abdallah ibn Amir, avec al-Ahnaf ibn Qays en première ligne: les portes du Khorasan (Tabasayn) et Quhistan négocièrent la paix pour 600 000 dirhams; l'ascète al-Aswad ibn Kulthum mourut à la brèche de Bayhaq et, selon son vœu (« ressuscitez-moi du ventre des bêtes et des oiseaux »), sa dépouille ne fut pas enterrée; Nishapur fut prise de nuit grâce à la trahison d'un intendant, son grand marzban rachetant tout pour un million de dirhams; Hérat: un million; Marw: 2 200 000. À Tukharistan, al-Ahnaf conclut la paix à la condition qu'un musulman entre dans la forteresse, y fasse l'appel à la prière et y reste jusqu'à sa sortie; puis il arracha la lance des mains du roi de Sughaniyan alors qu'il chargeait (voir: Kamil ibn al-Athir, p. 493-495)."
  ur: "خراسان عبداللہ بن عامر کے ماتحت الاحنف ابن قیس کے ساتھ وین میں: تباسین - خراسان کے دروازے - اور کوہستان نے 600,000 درہم میں امن خریدا۔ اسود بن کلثوم کی موت بیہق کی خلاف ورزی پر ہوئی اور اپنی مرضی سے بے دفن رہ گیا نیشاپور کو ایک کوارٹر ماسٹر کی غداری کے ذریعے رات کے وقت اندر جانے دیا گیا، اس کے عظیم مرزبان نے ایک ملین درہم کا تاوان دیا تھا۔ ہرات ایک ملین، مرو 2,200,000۔ تخارستان الاحناف میں اس شرط پر صلح کی کہ ایک مسلمان قلعہ میں داخل ہوا، وہاں اذان دی اور باہر نکلنے تک ٹھہرے - پھر سغانیان کے بادشاہ کے ہاتھ سے نیزہ چھین لیا جیسا کہ اس نے الزام لگایا۔ 493-495}۔"
  tr: "Abdullah bin Amer'in Horasan'ı Fethi: Ömer öldürüldüğünde Horasan halkı ayrıldı, bunun üzerine İbn Amer ve Ahnaf bin Kays onun öncülüğünde yürüdüler ve Horasan ile Kuhistan'ın giriş kapısı olan Tabasin halkı onunla altı yüz bin dirhem karşılığında barış yaptı. Bunun üzerine Zam, Bakharz ve Juwayn'i fethetti ve Beyhak geçidinde münzevi el-Esved bin Kulsum el-Adavi'yi öldürdü. Kardeşi Adham ise isyan edip orayı fethetti. El-Esved, hayvanların ve kuşların karnından diriltilmesi için Allah'a dua ederdi, ancak kardeşi onu gömmedi. Nişapur aylarca kuşatıldı, bu yüzden mahallelerinden birinin yöneticisi güvenli geçiş istedi ve geceleyin onları içeri aldı. Kapıyı açtılar ve baş bölge yöneticisi kendini tahkim etti, bu yüzden onunla bir milyon dirhem karşılığında barış yaptı ve Kays bin Haytham'ı Nişapur valisi olarak atadı. Herat bölgesi yöneticisi de onunla bir milyon dirhem karşılığında, Merv bölgesi yöneticisi ise iki milyon iki yüz bin dirhem karşılığında barış yaptı. El-Ahnaf, Tokharistan'a gönderildi ve Suvancar bölgesini kuşattı, bunun üzerine onunla, adamlarından birinin sarayda ezan okuması ve o ayrılana kadar onlarla kalması şartıyla barış yaptılar. Sagan kralı ona saldırdı, bunun üzerine El-Ahnaf elinden mızrağı aldı ve müşrikler yenilgiye uğradı. {Kaynak: Kamil İbn El-Atir s. 493-495}"
  id: "Penaklukan Khorasan oleh Abdullah bin Amer: Penduduk Khorasan memisahkan diri ketika Umar terbunuh, sehingga Ibnu Amer dan Al-Ahnaf bin Qais berbaris di barisan depan, dan penduduk Tabasin, yang merupakan gerbang menuju Khorasan dan Quhistan, berdamai dengannya dengan imbalan enam ratus ribu dirham, dan ia menaklukkan Zam, Bakharz, dan Juwayn, dan ia membunuh Al-Aswad bin Kulthum Al-Adawi, seorang pertapa, di celah Bayhaq, dan saudaranya Adham bangkit dan menaklukkannya — dan Al-Aswad biasa berdoa kepada Tuhan untuk membangkitkannya dari perut binatang buas dan burung, tetapi saudaranya tidak menguburnya. Nishapur dikepung selama berbulan-bulan, sehingga penguasa salah satu wilayahnya meminta jalan aman, dan ia mengizinkan mereka masuk pada malam hari. Mereka membuka gerbang, dan kepala marzbannya membentengi diri, lalu ia berdamai dengannya dengan imbalan satu juta dirham dan mengangkat Qais bin Al-Haytham sebagai gubernur Nishapur. Marzban Herat berdamai dengannya dengan imbalan satu juta dirham, dan marzban Merv berdamai dengannya dengan imbalan dua juta dua ratus ribu dirham. Al-Ahnaf dikirim ke Tokharistan, lalu ia mengepung distrik Suwanjar, sehingga mereka berdamai dengannya dengan syarat salah satu orang mereka akan mengumandangkan azan di istana dan tinggal bersama mereka sampai ia pergi. Raja Saghania menyerangnya, lalu Al-Ahnaf merebut tombak dari tangannya, dan kaum musyrik dikalahkan. {cite:kamil-ibn-al-athir p. 493-495}"
