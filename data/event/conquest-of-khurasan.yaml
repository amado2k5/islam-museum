summary:
  ar: "فتح خراسان على يد عبد الله بن عامر: نقض أهل خراسان لما قُتل عمر فسار ابن عامر والأحنف بن قيس على مقدمته، فصالحه أهل الطبسين وهما بابا خراسان وقوهستان على ستمائة ألف درهم، وفتح زام وباخرز وجوين، وقتل الأسود بن كلثوم العدوي الناسك عند ثلمة بيهق وقام أخوه أدهم فظفر بها — وكان الأسود يدعو الله أن يحشره من بطون السباع والطير فلم يواره أخوه. وحصر نيسابور أشهرًا فطلب صاحب أحد أرباعها الأمان فأدخلهم ليلًا ففتحوا الباب وتحصن مرزبانها الأكبر فصالحه على ألف ألف درهم وولّى نيسابور قيس بن الهيثم، وصالحه مرزبان هراة على ألف ألف ومرزبان مرو على ألفي ألف ومائتي ألف درهم، وسيّر الأحنف إلى طخارستان فحصر رستاق سوانجر فصالحوه على أن يؤذّن رجل منهم في القصر ويقيم فيهم حتى ينصرف، وحمل عليه ملك الصغانيان فانتزع الأحنف الرمح من يده فانهزم المشركون {cite:kamil-ibn-al-athir p. 493-495}."
  en: "Khurasan under 'Abdallah ibn 'Amir with al-Ahnaf ibn Qays in the van: the Tabasayn — Khurasan's gates — and Quhistan bought peace at 600,000 dirhams; al-Aswad ibn Kulthum the ascetic died at Bayhaq's breach and was left unburied by his own wish («raise me from the bellies of beast and bird«); Nishapur was let in at night through a quarter-master's treachery, its grand marzban ransoming all at a million dirhams; Herat a million, Marw 2,200,000. At Tukharistan al-Ahnaf made peace on condition a Muslim enter the fortress, give the adhan there and stay till he marched out — then wrenched the lance from the king of Sughaniyan's hand as he charged {cite:kamil-ibn-al-athir p. 493-495}."
