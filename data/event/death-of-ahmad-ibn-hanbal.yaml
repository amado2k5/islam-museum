label: { ar: "وفاة أحمد بن حنبل وجنازته", en: "The death and funeral of Ahmad ibn Hanbal", es: "La muerte y el funeral de Ahmad ibn Hanbal", fr: "La mort et les funérailles d'Ahmad ibn Hanbal", ur: "احمد بن حنبل کی وفات اور تدفین", tr: "Ahmed ibn Hanbal'ın ölümü ve cenazesi", id: "Kematian dan pemakaman Ahmad ibn Hanbal" }
summary:
  ar: "توفي أحمد بن حنبل ببغداد يوم الجمعة سنة 241هـ، واختلفت الروايات التي يجمعها ابن عساكر في شهره: لاثنتي عشرة ليلة خلت من ربيع الأول عند حنبل بن إسحاق وعباس الدوري ومطيّن، ومن ربيع الآخر عند ابنه عبد الله والفضل بن زياد ويعقوب بن سفيان، ولثلاث عشرة بقيت منه عند نصر بن القاسم، وجعلها أبو أمية الطرسوسي سنة 242 ولم يُتابع. صلى عليه أمير بغداد محمد بن عبد الله بن طاهر، ودُفن بعد العصر، وتُروى في عدد المصلين عليه تقديرات متفاوتة بين ثمانمائة ألف رجل وستين ألف امرأة وألف ألف وسبعمائة ألف {cite:tarikh-dimashq-amrawi-v5 p. 326-335}."
  en: "Ahmad ibn Hanbal died in Baghdad on a Friday in 241 AH; the reports that Ibn Asakir gathers differ on the month: twelve nights into Rabi' al-Awwal according to Hanbal ibn Ishaq, Abbas al-Duri and Mutayyan, twelve nights into Rabi' al-Akhir according to his son Abd Allah, al-Fadl ibn Ziyad and Ya'qub ibn Sufyan, thirteen nights before its end according to Nasr ibn al-Qasim, while Abu Umayya al-Tarsusi gave 242 and was not followed. The governor of Baghdad Muhammad ibn Abd Allah ibn Tahir led the prayer, he was buried after the afternoon prayer, and estimates of those who prayed over him range from 800,000 men and 60,000 women to 1,700,000."
  es: "Ahmad ibn Hanbal murió en Bagdad un viernes del año 241 de la Hégira; los relatos que recopila Ibn Asakir difieren en cuanto al mes: doce noches después del inicio de Rabi' al-Awwal según Hanbal ibn Ishaq, Abbas al-Duri y Mutayyan; doce noches después del inicio de Rabi' al-Akhir según su hijo Abd Allah, al-Fadl ibn Ziyad y Ya'qub ibn Sufyan; trece noches antes de su fin según Nasr ibn al-Qasim; mientras que Abu Umayya al-Tarsusi indicó el año 242, pero esta versión no fue seguida. El gobernador de Bagdad, Muhammad ibn Abd Allah ibn Tahir, dirigió la oración; fue enterrado después de la oración de la tarde, y las estimaciones de quienes oraron por él varían entre 800.000 hombres y 60.000 mujeres y 1.700.000."
  fr: "Ahmad ibn Hanbal mourut à Bagdad un vendredi de l'an 241 de l'Hégire. Les sources recueillies par Ibn Asakir divergent quant à la date de son décès: douze nuits après le début du mois de Rabi' al-Awwal selon Hanbal ibn Ishaq, Abbas al-Duri et Mutayyan; douze nuits après le début du mois de Rabi' al-Akhir selon son fils Abd Allah, al-Fadl ibn Ziyad et Ya'qub ibn Sufyan; treize nuits avant la fin du mois selon Nasr ibn al-Qasim, tandis qu'Abu Umayya al-Tarsusi mentionne l'année 242, date qui n'a pas été suivie. Le gouverneur de Bagdad, Muhammad ibn Abd Allah ibn Tahir, dirigea la prière funéraire. Ahmad fut inhumé après la prière de l'après-midi. Le nombre de personnes ayant prié pour lui est estimé entre 800 000 hommes et 60 000 femmes et 1 700 000."
  ur: "احمد بن حنبل کی وفات 241ھ میں جمعہ کے دن بغداد میں ہوئی۔ ابن عساکر نے جو روایتیں جمع کی ہیں وہ اس مہینے میں مختلف ہیں: حنبل ابن اسحاق، عباس الدوری اور مطیعان کے مطابق ربیع الاول کی بارہ راتیں، ان کے بیٹے عبد اللہ کے مطابق ربیع الآخر کی بارہ راتیں، الفضل ابن زیاد اور یعقوب بن نصف کے مطابق رات ختم ہونے سے پہلے۔ القاسم، جبکہ ابو امیہ الطروسی نے 242 دیے اور اس کی پیروی نہیں کی گئی۔ بغداد کے گورنر محمد بن عبد اللہ ابن طاہر نے نماز کی امامت کی، انہیں عصر کی نماز کے بعد دفن کیا گیا، اور ان پر نماز پڑھنے والوں کا تخمینہ 800,000 مرد اور 60,000 خواتین سے لے کر 1,700,000 تک ہے۔"
  tr: "Ahmed ibn Hanbel, Hicri 241 yılında Cuma günü Bağdat'ta vefat etti. İbn Asakir'in derlediği rivayetler, ölüm ayı konusunda farklılık göstermektedir: Hanbel ibn İshak, Abbas el-Duri ve Mutayyin'e göre Rabi' el-Evvel ayının on ikinci gecesi; oğlu Abdullah, el-Fadl ibn Ziyad ve Yakub ibn Sufyan'a göre Rabi' el-Sani ayının on üçüncü gecesi; Nasr ibn el-Kâsım'a göre ise Rabi' el-Sani ayının on üçüncü gecesidir. Ebu Umeyye el-Tarsusi ise ölüm yılını Hicri 242 olarak belirtmiş, ancak bu kabul görmemiştir. Bağdat valisi Muhammed ibn Abdullah ibn Tahir cenaze namazını kıldırmış ve ikindi namazından sonra defnedilmiştir. Cenaze namazına katılanların sayısı sekiz yüz bin erkek ve altmış bin kadından bir milyon yedi yüz bine kadar değişmektedir. {alıntı:tarikh-dimashq-amrawi-v5 s. 326-335}"
  id: "Ahmad ibn Hanbal wafat di Baghdad pada hari Jumat tahun 241 Hijriah. Catatan yang dikumpulkan oleh Ibnu Asakir berbeda mengenai bulan kematiannya: Menurut Hanbal ibn Ishaq, Abbas al-Duri, dan Mutayyin, itu adalah malam kedua belas Rabi' al-Awwal; menurut putranya Abdullah, al-Fadl ibn Ziyad, dan Yaqub ibn Sufyan, itu adalah malam ketiga belas Rabi' al-Thani; dan menurut Nasr ibn al-Qasim, itu adalah malam ketiga belas Rabi' al-Thani. Abu Umayyah al-Tarsusi menempatkannya pada tahun 242 Hijriah, tetapi ini tidak diikuti. Gubernur Baghdad, Muhammad ibn Abdullah ibn Tahir, memimpin salat jenazah, dan beliau dimakamkan setelah salat Asar. Perkiraan jumlah orang yang salat pada pemakamannya bervariasi, mulai dari delapan ratus ribu laki-laki dan enam puluh ribu perempuan hingga satu juta tujuh ratus ribu. {mengutip:tarikh-dimashq-amrawi-v5 hal. 326-335}"
