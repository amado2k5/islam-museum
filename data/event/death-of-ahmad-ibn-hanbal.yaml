label: { ar: "وفاة أحمد بن حنبل وجنازته", en: "The death and funeral of Ahmad ibn Hanbal" }
summary:
  ar: "توفي أحمد بن حنبل ببغداد يوم الجمعة سنة 241هـ، واختلفت الروايات التي يجمعها ابن عساكر في شهره: لاثنتي عشرة ليلة خلت من ربيع الأول عند حنبل بن إسحاق وعباس الدوري ومطيّن، ومن ربيع الآخر عند ابنه عبد الله والفضل بن زياد ويعقوب بن سفيان، ولثلاث عشرة بقيت منه عند نصر بن القاسم، وجعلها أبو أمية الطرسوسي سنة 242 ولم يُتابع. صلى عليه أمير بغداد محمد بن عبد الله بن طاهر، ودُفن بعد العصر، وتُروى في عدد المصلين عليه تقديرات متفاوتة بين ثمانمائة ألف رجل وستين ألف امرأة وألف ألف وسبعمائة ألف {cite:tarikh-dimashq-amrawi-v5 p. 326-335}."
  en: "Ahmad ibn Hanbal died in Baghdad on a Friday in 241 AH; the reports that Ibn Asakir gathers differ on the month: twelve nights into Rabi' al-Awwal according to Hanbal ibn Ishaq, Abbas al-Duri and Mutayyan, twelve nights into Rabi' al-Akhir according to his son Abd Allah, al-Fadl ibn Ziyad and Ya'qub ibn Sufyan, thirteen nights before its end according to Nasr ibn al-Qasim, while Abu Umayya al-Tarsusi gave 242 and was not followed. The governor of Baghdad Muhammad ibn Abd Allah ibn Tahir led the prayer, he was buried after the afternoon prayer, and estimates of those who prayed over him range from 800,000 men and 60,000 women to 1,700,000."
