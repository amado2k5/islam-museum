label: { ar: "رؤية نسطورا له في رحلة خديجة", en: "Nastura's sighting on Khadija's venture", es: "El avistamiento de Nastura sobre la empresa de Khadija", fr: "L'observation de Nastura sur l'aventure de Khadija", ur: "خدیجہ کی مہم جوئی پر نستورہ کی نظر" }
summary:
  ar: "لما خرج النبي إلى الشام في تجارة خديجة مع غلامها ميسرة نظر نسطورا الراهب إليه وهو في صومعته وقد أظلته غمامة فقال هذا نبي وهذا آخر الأنبياء، وكان بين مشاهدته الفجار الرابع وبنيان الكعبة أربع سنين وتسعة أشهر وستة أيام على تدقيق المسعودي الزمني {cite:muruj-al-dhahab p. 569-570}."
  en: "On Khadija's Syria venture with her agent Maysara, the monk Nastura saw the cloud-shaded traveller from his cell and knew him — al-Mas'udi fixes it at four years, nine months and six days after the fourth Fijar {cite:muruj-al-dhahab p. 569-570}."
  es: "En la aventura de Khadija en Siria con su agente Maysara, el monje Nastura vio al viajero envuelto en nubes desde su celda y lo reconoció; al-Mas'udi sitúa el hecho cuatro años, nueve meses y seis días después del cuarto Fijar {cite:muruj-al-dhahab p. 569-570}."
  fr: "Lors du voyage de Khadija en Syrie avec son agent Maysara, le moine Nastura aperçut le voyageur à l'ombre des nuages depuis sa cellule et le reconnut — al-Mas'udi situe cela quatre ans, neuf mois et six jours après le quatrième Fijar {cite:muruj-al-dhahab p. 569-570}."
  ur: "خدیجہ کی شام کو اپنے ایجنٹ میسارا کے ساتھ مہم میں، راہب نستورا نے اپنے سیل سے بادل کے سایہ دار مسافر کو دیکھا اور اسے پہچان لیا - المسعودی نے اسے چوتھی فجر کے بعد چار سال، نو مہینے اور چھ دن میں طے کیا۔ 569-570}۔"
