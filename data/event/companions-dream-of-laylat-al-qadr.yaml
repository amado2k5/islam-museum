id: event/companions-dream-of-laylat-al-qadr
class: event
kind: other
label:
  ar: "رؤيا الصحابة ليلة القدر في السبع الأواخر"
  en: "The Companions' dream of Laylat al-Qadr in the last third"
  ur: "صحابہ کا لیلۃ القدر کا خواب آخری تہائی میں"
summary:
  ar: "بلغ أن رجالا من أصحاب رسول الله رأوا ليلة القدر في المنام في السبع الأواخر فقال رسول الله إني أرى رؤياكم قد تواطأت في السبع الأواخر فمن كان متحريا فليتحرها في السبع الأواخر {cite:muwatta-maruf-1997} [[passage/muwatta-5-895|الموطأ 895]]."
  en: "It reached Malik that men of the Companions saw Laylat al-Qadr in a dream in the last ten nights, and the Messenger of God said: I see your dreams have agreed on the last third; whoever seeks it should seek it in the last third {cite:muwatta-maruf-1997} [[passage/muwatta-5-895|Muwatta 895]]."
  ur: "مالک کو اطلاع ملی کہ رسول اللہ کے بعض صحابہ نے آخری عشرہ میں لیلۃ القدر کا خواب دیکھا، تو رسول اللہ نے کہا: میں تمہارا خواب دیکھتا ہوں کہ وہ آخری عشرہ میں متفق ہے؛ جو اس کی تلاش کرے وہ آخری عشرہ میں تلاش کرے {cite:muwatta-maruf-1997} [[passage/muwatta-5-895|موطأ 895]]۔"
