summary:
  ar: "بطاقة أولية لحصار نيقية سنة ١٠٩٧م، أولى وقائع الحملة الصليبية الأولى التي سقطت بها عاصمة سلاجقة الروم بيد الفرنج والبيزنطيين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Nicaea in 1097, the opening action of the First Crusade in which the Seljuk capital fell to the Crusader-Byzantine force; its sources are not yet checked on the page."
  es: "Boceto de ficha para el asedio de Nicea en 1097, la acción inicial de la Primera Cruzada en la que la capital selyúcida cayó en manos de las fuerzas cruzadas-bizantinas; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour le siège de Nicée en 1097, première action de la Première Croisade au cours de laquelle la capitale seldjoukide tomba aux mains des forces croisées-byzantines; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1097 میں نائسیہ کے محاصرے کے لیے ڈرافٹ کارڈ، پہلی صلیبی جنگ کی ابتدائی کارروائی جس میں سلجوق دارالحکومت صلیبی بازنطینی فوج کے ہاتھ میں آگیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, Selçuklu Rum Sultanlığı'nın başkentinin Franklar ve Bizanslıların eline geçtiği Birinci Haçlı Seferi'nin ilk olayı olan 1097 yılındaki İznik kuşatmasının ön anlatımını içermektedir; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Nicaea pada tahun 1097 M, peristiwa pertama dari Perang Salib Pertama di mana ibu kota Kesultanan Seljuk Rum jatuh ke tangan Frank dan Bizantium; sumber-sumbernya belum ditinjau di halaman ini."
