summary:
  ar: "ملك نور الدين قلعة جعبر، وهي من أمنع القلاع مطلة على الفرات من الجانب الشرقي وكانت بيد شهاب الدين مالك بن علي بن مالك العقلي وآبائه من أيام ملكشاه، وكان سببها أن صاحبها نزل يتصيد فأخذه بنو كلاب وحملوه إلى نور الدين فاعتقله ورغّبه ثم شدّد فأبى التسليم، فحصرها عسكر مقدمه فخر الدين مسعود الزعفرائي ثم أمدهم بعسكر عليه مجد الدين ابن الداية رضيع نور الدين، فسلك ابن الداية طريق اللين وأشار على صاحبها أن يأخذ العوض فقبل وسلّمها فأخذ عنها سروج وأعمالها والملاحة بين حلب وباب بزاعة وعشرين ألف دينار معجلة، وقيل له أيما أحب إليك سروج والشام أم القلعة فقال هذه أكثر مالًا وأما العز ففارقناه بالقلعة، وكان آخر أمر بني مالك بها {cite:kamil-ibn-al-athir p. 11}."
  en: "Qalʿat Jaʿbar — among the strongest castles, overlooking the Euphrates east bank, held by the Āl Mālik al-ʿAqilī since Malikshāh — passed to Nūr al-Dīn. Its lord Shihāb al-Dīn Mālik had been seized by Banū Kilāb while hunting and delivered to Nūr al-Dīn; refusing both inducement and threats, he yielded only when Majd al-Dīn Ibn al-Dāya counseled taking compensation: Sarūj and its lands, the Malāḥa district between Aleppo and Bāb Buzāʿa, and 20,000 dinars down. Asked which he preferred, he said «this is more money, but honor parted from us with the castle» {cite:kamil-ibn-al-athir p. 11}."
  es: "Qalʿat Jaʿbar —uno de los castillos más fuertes, con vistas a la orilla oriental del Éufrates, en manos de Āl Mālik al-ʿAqilī desde Malikshāh— pasó a Nūr al-Dīn. Su señor, Shihāb al-Dīn Mālik, había sido apresado por Banū Kilāb mientras cazaba y entregado a Nūr al-Dīn; rechazando tanto sobornos como amenazas, cedió únicamente cuando Majd al-Dīn Ibn al-Dāya le aconsejó aceptar una compensación: Sarūj y sus tierras, el distrito de Malāḥa entre Alepo y Bāb Buzāʿa, y 20 000 dinares menos. Al preguntársele qué prefería, respondió: «Esto es más dinero, pero el honor se separó de nosotros con el castillo» {cite:kamil-ibn-al-athir p. 11}."
  fr: "Qalʿat Jaʿbar, l'une des forteresses les plus imprenables dominant la rive orientale de l'Euphrate, tenue par les Āl Mālik al-ʿAqilī depuis Malikshāh, passa aux mains de Nūr al-Dīn. Son seigneur, Shihāb al-Dīn Mālik, avait été capturé par les Banū Kilāb lors d'une partie de chasse et livré à Nūr al-Dīn. Refusant toute tentative de persuasion ou de pression, il ne céda que lorsque Majd al-Dīn Ibn al-Dāya lui conseilla d'accepter une compensation: Sarūj et ses terres, le district de Malāḥa entre Alep et Bāb Buzāʿa, et 20 000 dinars. Interrogé sur sa préférence, il répondit: « C'est plus d'argent, mais nous avons perdu notre honneur avec la forteresse. » {cite: kamil-ibn-al-athir p. 11}."
  ur: "قلات جبار - سب سے مضبوط قلعوں میں سے، جو فرات کے مشرقی کنارے کو دیکھتا ہے، جو مالک شاہ کے بعد سے مالک العقیلی کے پاس تھا، نورالدین تک پہنچا۔ اس کے آقا شہاب الدین مالک کو بنو کلاب نے شکار کرتے ہوئے پکڑ لیا تھا اور نورالدین کے حوالے کر دیا تھا۔ لالچ اور دھمکیوں دونوں سے انکار کرتے ہوئے، اس نے صرف اس وقت نتیجہ اخذ کیا جب مجد الدین ابن الداعی نے معاوضہ لینے کی صلاح دی: سروج اور اس کی زمینیں، حلب اور باب بوزعہ کے درمیان ضلع ملاح، اور 20,000 دینار نیچے۔ یہ پوچھنے پر کہ وہ کس چیز کو ترجیح دیتے ہیں تو اس نے کہا کہ یہ زیادہ پیسہ ہے لیکن عزت ہم سے محل کے ساتھ جدا ہوگئی۔ 11}۔"
