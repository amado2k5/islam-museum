label: { ar: "نور الدين يملك قلعة جعبر", en: "Nūr al-Dīn acquires Qalʿat Jaʿbar from its 'Aqilid lords" }
date:
  start: { edtf: "1168~", hijri: "0564", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "ملك نور الدين قلعة جعبر، وهي من أمنع القلاع مطلة على الفرات من الجانب الشرقي وكانت بيد شهاب الدين مالك بن علي بن مالك العقلي وآبائه من أيام ملكشاه، وكان سببها أن صاحبها نزل يتصيد فأخذه بنو كلاب وحملوه إلى نور الدين فاعتقله ورغّبه ثم شدّد فأبى التسليم، فحصرها عسكر مقدمه فخر الدين مسعود الزعفرائي ثم أمدهم بعسكر عليه مجد الدين ابن الداية رضيع نور الدين، فسلك ابن الداية طريق اللين وأشار على صاحبها أن يأخذ العوض فقبل وسلّمها فأخذ عنها سروج وأعمالها والملاحة بين حلب وباب بزاعة وعشرين ألف دينار معجلة، وقيل له أيما أحب إليك سروج والشام أم القلعة فقال هذه أكثر مالًا وأما العز ففارقناه بالقلعة، وكان آخر أمر بني مالك بها {cite:kamil-ibn-al-athir p. 11}."
  en: "Qalʿat Jaʿbar — among the strongest castles, overlooking the Euphrates east bank, held by the Āl Mālik al-ʿAqilī since Malikshāh — passed to Nūr al-Dīn. Its lord Shihāb al-Dīn Mālik had been seized by Banū Kilāb while hunting and delivered to Nūr al-Dīn; refusing both inducement and threats, he yielded only when Majd al-Dīn Ibn al-Dāya counseled taking compensation: Sarūj and its lands, the Malāḥa district between Aleppo and Bāb Buzāʿa, and 20,000 dinars down. Asked which he preferred, he said «this is more money, but honor parted from us with the castle» {cite:kamil-ibn-al-athir p. 11}."
