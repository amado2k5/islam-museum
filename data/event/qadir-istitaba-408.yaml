label: { ar: "استتابة القادر للمبتدعة سنة 408", en: "Al-Qadir's recantation decree against the innovators (408 AH)", es: "Decreto de retractación de Al-Qadir contra los innovadores (408 AH)", fr: "Décret de rétractation d'Al-Qadir contre les innovateurs (408 AH)", ur: "جدت پسندوں کے خلاف القادر کا مکروہ فرمان ⁦(408ھ)⁩", tr: "El-Kadir'in 408 yılında sapkınlardan tövbe etmesi", id: "Taubat Al-Qadir terhadap kaum sesat pada tahun 408" }
summary:
  ar: "في سنة ثمان وأربعمائة استتاب القادر بالله أمير المؤمنين فقهاء المعتزلة الحنفية فأظهروا الرجوع وتبرؤوا من الاعتزال، ثم نهاهم عن الكلام والتدريس والمناظرة في الاعتزال والرفض والمقالات المخالفة للإسلام وأخذ خطوطهم بذلك وأنهم متى خالفوه حل بهم من النكال والعقوبة ما يتعظ به أمثالهم؛ وامتثل يمين الدولة وأمين الملة محمود أمير المؤمنين — أي سلطان غزنة — واستنّ في أعماله بخراسان وغيرها في قتل المعتزلة والرافضة والإسماعيلية والقرامطة والجهمية والمشبهة وصلبهم وحرقهم ونقمهم وأمر بلعنهم على منابر المسلمين وإبعاد كل طائفة من أهل البدع وطردهم عن ديارهم، وصار ذلك سنة في الإسلام {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  en: "408: al-Qadir bi'llah made the Hanafi Mu'tazili faqihs recant — they 'showed return and disavowed i'tizal' — and bound them in writing never to teach or debate i'tizal, rafd or 'doctrines contrary to Islam' on pain of exemplary punishment; Sultan Mahmud of Ghazna emulated the decree in Khurasan with killing, crucifixion, burning, minbar-curses and expulsion of Mu'tazilis, Rafidis, Ismailis, Qarmatis, Jahmis and Mushabbihas — 'and it became a sunna in Islam' {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  es: "408: al-Qadir bi'llah hizo que los faqihs Hanafi Mu'tazili se retractaran – \"mostraron retorno y repudiaron el i'tizal\" - y los comprometió por escrito a nunca enseñar ni debatir sobre i'tizal, rafd o 'doctrinas contrarias al Islam' bajo pena de un castigo ejemplar; El sultán Mahmud de Ghazna emuló el decreto de Khurasan con el asesinato, la crucifixión, la quema, las maldiciones minbar y la expulsión de Mu'tazilis, Rafidis, Ismailis, Qarmatis, Jahmis y Mushabbihas."
  fr: "408: al-Qadir bi'llah a obligé les faqihs Hanafi Mu'tazili à se rétracter — ils ont « fait preuve de retour et ont désavoué l'i'tizal » — et les a obligés par écrit à ne jamais enseigner ni débattre de l'i'tizal, du rafd ou des « doctrines contraires à l'Islam » sous peine de punition exemplaire; Le sultan Mahmud de Ghazna a imité le décret du Khurasan avec le meurtre, la crucifixion, l'incendie, les malédictions du minbar et l'expulsion des Mu'tazilis, Rafidis, Ismailis, Qarmatis, Jahmis et Mushabbihas."
  ur: "408: القادر باللہ نے حنفی معتزلی فقہا کو منحرف کر دیا - انہوں نے 'واپسی ظاہر کی اور اعتزال سے انکار کیا' - اور انہیں تحریری طور پر پابند کیا کہ وہ مثالی سزا کے درد پر کبھی بھی اعتکاف، رد یا 'اسلام کے خلاف عقائد' کی تعلیم یا بحث نہ کریں۔ غزنہ کے سلطان محمود نے خراسان میں معتزلیوں، رافدیوں، اسماعیلیوں، قرامطیوں، جہمیوں اور مشبیحوں کو قتل، مصلوب کرنے، جلانے، منبر پر لعنت بھیجنے اور ملک بدر کرنے کے فرمان کی تقلید کی۔"
  tr: "408 yılında, Müminlerin Emiri Kadir Billa, Hanefi Mu'tezile âlimlerini tövbeye çağırdı ve onlar da geri dönerek Mu'tezileliği reddettiler. Bunun üzerine Kadir Billa, onlara Mu'tezilecilik, retçilik ve İslam'a aykırı doktrinler hakkında konuşmayı, öğretmeyi ve tartışmayı yasakladı ve bu konudaki yazılı ifadelerini aldı. Ona karşı gelenlerin ise, kendileri gibi olan diğerlerine ibret olsun diye cezalandırılacaklarını ve intikam alacaklarını bildirdi. Devletin ve milletin emanetçisi olan Müminlerin Komutanı Mahmud, yani Gazne Sultanı, Horasan'da ve başka yerlerde Mu'tezilileri, Rafizileri, İsmailileri, Karmatileri, Cahmileri ve insan biçimcileri öldürmeyi, çarmıha germeyi, yakmayı ve cezalandırmayı emretti ve Müslümanların minberlerinde lanetlenmelerini ve her türlü bidatçi grubun evlerinden çıkarılıp kovulmasını emretti ve bu İslam'da bir gelenek haline geldi. {cite:muntazam-ibn-al-jawzi j.7 p.284}"
  id: "Pada tahun 408, Al-Qadir Billah, Amirul Mukminin, membuat para ulama Hanafi Mu'tazilah bertaubat, dan mereka menunjukkan kepulangan mereka serta meninggalkan Mu'tazilah. Kemudian beliau melarang mereka berbicara, mengajar, dan berdebat tentang Mu'tazilah, penolakan, dan doktrin yang bertentangan dengan Islam, dan beliau mengambil pernyataan tertulis mereka mengenai hal itu, dan bahwa jika mereka tidak taat kepadanya, mereka akan menderita hukuman dan pembalasan yang akan menjadi pelajaran bagi orang lain seperti mereka. Mahmud, Komandan Kaum Beriman—yaitu Sultan Ghazna—mentaati sumpah negara dan wali amanat bangsa, serta menetapkan dalam tindakannya di Khorasan dan tempat lain pembunuhan terhadap kaum Mu'tazilah, Rafidiyah, Ismailiyah, Qarmatian, Jahmit, dan penganut antropomorfisme, serta menyalib, membakar, dan menghukum mereka. Ia juga memerintahkan agar mereka dikutuk di mimbar-mimbar kaum Muslimin dan agar setiap kelompok orang yang menganut bid'ah disingkirkan dan diusir dari rumah mereka, dan hal ini menjadi tradisi dalam Islam. {cite:muntazam-ibn-al-jawzi j.7 p.284}."
