id: event/qadir-istitaba-408
class: event
kind: persecution
label: { ar: "استتابة القادر للمبتدعة سنة 408", en: "Al-Qadir's recantation decree against the innovators (408 AH)" }
summary:
  ar: "في سنة ثمان وأربعمائة استتاب القادر بالله أمير المؤمنين فقهاء المعتزلة الحنفية فأظهروا الرجوع وتبرؤوا من الاعتزال، ثم نهاهم عن الكلام والتدريس والمناظرة في الاعتزال والرفض والمقالات المخالفة للإسلام وأخذ خطوطهم بذلك وأنهم متى خالفوه حل بهم من النكال والعقوبة ما يتعظ به أمثالهم؛ وامتثل يمين الدولة وأمين الملة محمود أمير المؤمنين — أي سلطان غزنة — واستنّ في أعماله بخراسان وغيرها في قتل المعتزلة والرافضة والإسماعيلية والقرامطة والجهمية والمشبهة وصلبهم وحرقهم ونقمهم وأمر بلعنهم على منابر المسلمين وإبعاد كل طائفة من أهل البدع وطردهم عن ديارهم، وصار ذلك سنة في الإسلام {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  en: "408: al-Qadir bi'llah made the Hanafi Mu'tazili faqihs recant — they 'showed return and disavowed i'tizal' — and bound them in writing never to teach or debate i'tizal, rafd or 'doctrines contrary to Islam' on pain of exemplary punishment; Sultan Mahmud of Ghazna emulated the decree in Khurasan with killing, crucifixion, burning, minbar-curses and expulsion of Mu'tazilis, Rafidis, Ismailis, Qarmatis, Jahmis and Mushabbihas — 'and it became a sunna in Islam' {cite:muntazam-ibn-al-jawzi j.7 p.284}."
