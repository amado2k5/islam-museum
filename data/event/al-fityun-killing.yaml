label: { ar: "قتل الفطيون اليهودي على يد مالك بن العجلان", en: "the killing of the Jewish tyrant al-Fiṭyūn by Mālik ibn al-ʿAjlān", es: "El asesinato del tirano judío al-Fiṭyūn por Mālik ibn al-ʿAjlān", fr: "l'assassinat du tyran juif al-Fiṭyūn par Mālik ibn al-ʿAjlān", ur: "مالک بن عجلان کے ہاتھوں یہودی ظالم الفتیون کا قتل", tr: "Yahudi Fatiyun, Malik ibn al-Ajlan tarafından öldürüldü.", id: "Fatiyun yang beragama Yahudi dibunuh oleh Malik ibn al-Ajlan." }
date:
  start: { edtf: "0580~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 490}." }
summary:
  ar: "كان الاستيلاء على المدينة لليهود لما نزلها الأوس والخزرج وكانوا أبناء قيلة بنت كاهل، وملك عليهم الفطيون اليهودي وهو رجل سوء فاجر كان يدينون له ويمدّ يده إلى أعراضهم — لا تتزوج امرأة منهم إلا أُدخلت عليه قبل زوجها — حتى كان من مالك بن العجلان الخزرجي ما كان فقتله، فزالت الغلبة عن اليهود وعادت للأوس والخزرج {cite:kamil-ibn-al-athir p. 490}."
  en: "When the Aws and Khazraj settled Yathrib among the Jewish tribes — Qurayẓa, al-Naḍīr, Qaynuqāʿ and others who held the fortresses and the mastery — a Jewish tyrant named al-Fiṭyūn came to lord over them, a wicked profligate whose hand reached their honor: no woman among them was wed until she was brought to him first. Mālik ibn al-ʿAjlān of the Khazraj killed him, and mastery passed to the Aws and Khazraj, who stayed united until the war of Sāmir {cite:kamil-ibn-al-athir p. 490}."
  es: "Cuando los Aws y los Khazraj establecieron Yathrib entre las tribus judías —Qurayẓa, al-Naḍīr, Qaynuqāʿ y otras que controlaban las fortalezas y el dominio— un tirano judío llamado al-Fiṭyūn llegó para gobernarlos, un libertino malvado cuya mano atentaba contra su honor: ninguna mujer entre ellos se casaba sin antes ser llevada ante él. Mālik ibn al-ʿAjlān de los Khazraj lo mató, y el dominio pasó a los Aws y los Khazraj, quienes permanecieron unidos hasta la guerra de Sāmir {cite:kamil-ibn-al-athir p. 490}."
  fr: "Lorsque les Aws et les Khazraj s'installèrent à Yathrib parmi les tribus juives — les Qurayẓa, les al-Naḍīr, les Qaynuqāʿ et d'autres qui contrôlaient les forteresses et exerçaient le pouvoir —, un tyran juif nommé al-Fiṭyūn vint les dominer. Ce personnage cruel et dépravé s'attaqua à leur honneur: aucune femme ne pouvait être mariée sans lui avoir été présentée au préalable. Mālik ibn al-ʿAjlān, des Khazraj, le tua, et le pouvoir passa aux Aws et aux Khazraj, qui restèrent unis jusqu'à la guerre de Sāmir (voir: Kamil ibn al-Athir, p. 490)."
  ur: "جب اوس اور خزرج نے یثرب کو یہودی قبائل میں آباد کیا - قریظہ، النضیر، قینقاع اور دیگر جو قلعوں اور تسلط پر قابض تھے - الفطیون نامی ایک یہودی ظالم ان پر حکمرانی کرنے کے لیے آیا تو ایک فاسق ان کے پاس لایا: یہاں تک کہ ہم ان کے درمیان کسی عورت کو عزت دینے کے لیے نہیں پہنچے۔ خزرج کے مالک بن العجلان نے اسے قتل کر دیا، اور یہ تسلط اوس اور خزرج کے پاس چلا گیا، جو سامر کی جنگ تک متحد رہے۔ 490}۔"
  tr: "Yahudiler, Evs ve Hazrec kabileleri oraya yerleştiğinde şehri ele geçirdiler. Evs ve Hazrec kabileleri Kayla bint Kahil'in oğullarıydı. Yahudi Fatiyun onlara hükmediyordu. Fatiyun, kötü ve zalim bir adamdı ve Yahudiler ona borçluydular. Onların şerefini korumak için elini uzatırdı; aralarından hiçbir kadın, kocasından önce ona getirilmeden evlenmezdi. Ta ki Malik bin el-Ajlan el-Hazarci ile olan olaya kadar. Bunun üzerine Fatiyun onu öldürdü. Böylece Yahudiler egemenliklerini kaybettiler ve egemenlik Evs ve Hazrec kabilelerine geri döndü. {Kaynak: Kamil İbn el-Athir, s. 490}"
  id: "Orang-orang Yahudi merebut kota itu ketika Aws dan Khazraj menetap di sana. Mereka adalah putra-putra Qayla bint Kahil. Fatiyun, seorang Yahudi, memerintah mereka. Dia adalah orang jahat dan bejat yang kepadanya mereka berhutang budi, dan dia akan mengulurkan tangannya untuk menjaga kehormatan mereka—tidak ada wanita di antara mereka yang mau menikah tanpa dibawa kepadanya sebelum suaminya—sampai apa yang terjadi pada Malik bin Al-Ajlan Al-Khazraji, sehingga dia membunuhnya. Dengan demikian, orang-orang Yahudi kehilangan kekuasaan mereka, dan kekuasaan itu kembali kepada Aws dan Khazraj. {cite:kamil-ibn-al-athir p. 490}"
