summary:
  ar: "كان الاستيلاء على المدينة لليهود لما نزلها الأوس والخزرج وكانوا أبناء قيلة بنت كاهل، وملك عليهم الفطيون اليهودي وهو رجل سوء فاجر كان يدينون له ويمدّ يده إلى أعراضهم — لا تتزوج امرأة منهم إلا أُدخلت عليه قبل زوجها — حتى كان من مالك بن العجلان الخزرجي ما كان فقتله، فزالت الغلبة عن اليهود وعادت للأوس والخزرج {cite:kamil-ibn-al-athir p. 490}."
  en: "When the Aws and Khazraj settled Yathrib among the Jewish tribes — Qurayẓa, al-Naḍīr, Qaynuqāʿ and others who held the fortresses and the mastery — a Jewish tyrant named al-Fiṭyūn came to lord over them, a wicked profligate whose hand reached their honor: no woman among them was wed until she was brought to him first. Mālik ibn al-ʿAjlān of the Khazraj killed him, and mastery passed to the Aws and Khazraj, who stayed united until the war of Sāmir {cite:kamil-ibn-al-athir p. 490}."
