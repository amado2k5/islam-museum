id: "event/al-qasim-enters-saada-on-khawlans-call-and-swears-with-his-brother-al-hasan-in-rabi-ii-326-ah"
class: event
kind: other
label:
  ar: "يدخل القاسم بن أحمد صعدة بدعوة من خولان ويحلف مع أخيه الحسن في ربيع الآخر سنة 326هـ، ص410"
  en: "Al-Qasim ibn Ahmad enters Saada on Khawlan's call and swears with his brother al-Hasan in Rabi II 326 AH, p. 410"
  ur: "خولان کی دعوت پر قاسم بن احمد صعدہ میں داخل ہوتا ہے اور ربیع الآخر 326ھ میں بھائی حسن کے ساتھ قسم کھاتا ہے، ص410"
  es: "Al-Qasim ibn Ahmad entra en Saada a petición de Khawlan y jura con su hermano al-Hasan en Rabi II 326 AH, pág. 410."
  fr: "Al-Qasim ibn Ahmad entre à Saada sur l'appel de Khawlan et prête serment avec son frère al-Hasan en Rabi II 326 AH, p. 410"
summary:
  ar: "يشير مظفر بن عليان على القاسم بالمصير إلى صعدة، فيسير إليها ومعه جماعة من بكيل حتى يصل إلى أسل من بلد خولان، ثم يدخل البلد ويصطلح مع أخيه الحسن على أن أيديهما على الحق واحدة."
  en: "Muzaffar ibn Alyan advises al-Qasim to go to Saada. He sets out with a group from Bakil, reaches Asal in Khawlan, enters the town, and makes peace with his brother al-Hasan, each swearing that their hands are one in the right."
  ur: "مظفر بن علیان قاسم کو صعدہ جانے کا مشورہ دیتا ہے۔ وہ بکیل کے ایک گروہ کے ساتھ خولان کے علاقے اسل تک جاتا ہے، پھر شہر میں داخل ہوتا ہے اور بھائی حسن کے ساتھ صلح کرتا ہے، اور ہر ایک قسم کھاتا ہے کہ ان کے ہاتھ حق پر ایک ہیں۔"
  es: "Muzaffar ibn Alyan aconseja a al-Qasim que vaya a Saada. Este parte con un grupo desde Bakil, llega a Asal en Khawlan, entra en la ciudad y hace las paces con su hermano al-Hasan, jurando ambos que sus manos están unidas en la justicia."
  fr: "Muzaffar ibn Alyan conseille à al-Qasim de se rendre à Saada. Ce dernier part avec un groupe de Bakil, atteint Asal à Khawlan, entre dans la ville et fait la paix avec son frère al-Hasan, chacun jurant d'être d'accord."
