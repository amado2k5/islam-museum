label: { ar: "غزوة غازان للشام سنة 700هـ", en: "Ghazan's Campaign against Syria, 700 AH", es: "La campaña de Ghazan contra Siria, 700 d. C.", fr: "Campagne de Ghazan contre la Syrie, 700 AH", ur: "شام کے خلاف غازان کی مہم، 700 ہجری", tr: "Gazan'ın Hicri 700 yılında Suriye'yi işgali", id: "Invasi Ghazan ke Suriah pada tahun 700 Hijriah" }
summary:
  ar: "في سنة سبع مئة قويت الأراجيف بالتتار وأُكريت المحارة من الشام إلى مصر بخمسمائة درهم وأبيعت الأمتعة بالثمن البخس، وفي ربيع الآخر جاوز غازان بجيشه الفرات وقصد حلب وساق الشيخ تقي الدين بن تيمية في البريد إلى القاهرة يحرض الناس على الجهاد واجتمع بأكابر الأمراء ثم نودي في دمشق من قدر على الهرب فلينج بنفسه فانقلبت المدينة ورُصّ الخلق بالقلعة وأشرف الناس على خطة صعبة وبقي الخوف أياماً ثم تناقص برجعة غازان لما ناله من المشاق والثلوج {cite:shadharat-dhahab p. 429}."
  en: "In 700 Ghazan crossed the Euphrates for Aleppo; Ibn Taymiyya rode the barid post to Cairo rousing jihad while Damascus emptied at the crier's 'let him who can flee save himself' — then the fear eased as Ghazan turned back, worn by hardships and snows {cite:shadharat-dhahab p. 429}."
  ur: "700ھ میں غازان نے حلب کی طرف فرات عبور کیا؛ ابن تیمیہ برید میں قاہرہ روانہ ہو کر لوگوں کو جہاد پر ابھارتا رہا جبکہ منادی کی صدا — جو بھاگ سکتا ہے اپنی جان بچا لے — پر دمشق خالی ہوتا گیا؛ پھر غازان کی مشقت اور برفوں کی وجہ سے واپسی پر خوف کم ہو گیا {cite:shadharat-dhahab p. 429}۔"
  es: "En el año 700, Ghazan cruzó el Éufrates hacia Alepo; Ibn Taymiyya cabalgó en el puesto de guardia hacia El Cairo incitando a la yihad mientras Damasco se vaciaba al grito del pregonero: \"Que el que pueda huir se salve\"; entonces el miedo disminuyó cuando Ghazan regresó, agotado por las dificultades y las nieves {cita: shadharat-dhahab p. 429}."
  fr: "En 700, Ghazan traversa l'Euphrate pour Alep; Ibn Taymiyya chevaucha le poste de commandement jusqu'au Caire, éveillant le jihad tandis que Damas se vidait au cri du prédicateur: « Que celui qui peut fuir se sauve lui-même » — puis la peur s'apaisa lorsque Ghazan fit demi-tour, usé par les épreuves et la neige {cite:shadharat-dhahab p. 429}."
  tr: "Yedi yüz yılında Tatarlar hakkındaki söylentiler yoğunlaştı ve Suriye'den Mısır'a deniz yolu beş yüz dirheme kiralandı, mallar ucuz fiyata satıldı. Rabi' el-Sani'de Gazan ordusuyla Fırat'ı geçti ve Halep'e doğru ilerledi. Şeyh Taki el-Din İbn Taymiyye'yi insanları cihada teşvik etmesi için postayla Kahire'ye gönderdi. En kıdemli prenslerle görüştü ve ardından Şam'da kaçabilen herkesin kendini kurtarması gerektiği ilan edildi. Şehir altüst edildi ve insanlar kaleye tıkıldı. İnsanlar zor bir durumla karşı karşıyaydı ve korku günlerce sürdü. Daha sonra Gazan'ın çektiği zorluklar ve kar nedeniyle geri dönmesiyle korku azaldı. {kaynak:şadharat-dhahab s. 429}"
  id: "Pada tahun tujuh ratus, desas-desus tentang Tatar semakin intensif, dan laut disewakan dari Suriah ke Mesir dengan harga lima ratus dirham, dan barang-barang dijual dengan harga murah. Pada bulan Rabi' al-Thani, Ghazan menyeberangi Sungai Eufrat dengan pasukannya dan menuju Aleppo. Ia mengirim Syekh Taqi al-Din Ibn Taymiyyah melalui pos ke Kairo untuk menghasut orang-orang untuk berjihad. Ia bertemu dengan para pangeran paling senior, dan kemudian diumumkan di Damaskus bahwa siapa pun yang dapat melarikan diri harus menyelamatkan diri. Kota itu menjadi kacau balau, dan orang-orang dikerumuni di benteng. Orang-orang menghadapi rencana yang sulit, dan ketakutan tetap ada selama berhari-hari. Kemudian ketakutan itu berkurang dengan kembalinya Ghazan karena kesulitan dan salju yang telah ia alami. {cite:shadharat-dhahab hlm. 429}"
