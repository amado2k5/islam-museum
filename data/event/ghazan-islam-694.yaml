label: { ar: "إسلام قازان بن أرغون ملك التتار", en: "Ghazan ibn Arghun, Ruler of the Tatars, Embraces Islam", es: "Ghazan ibn Arghun, gobernante de los tártaros, se convierte al Islam.", fr: "Ghazan ibn Arghun, souverain des Tatars, se convertit à l'islam.", ur: "تاتاریوں کے حکمران غزن بن ارغون نے اسلام قبول کیا۔", tr: "Tatarların Kralı İslam Gazan ibn Argun", id: "Islam Ghazan ibn Arghun, Raja Tatar" }
summary:
  ar: "وفي سنة أربع وتسعين دخل في الإسلام قازان بن أرغون بن أبغا بن هولاكو ملك التتار وفرح الناس بذلك وفشا الإسلام في جيشه {cite:tarikh-khulafa-minhaj-1434 p. 731}. وفي شذرات الذهب قدم على ابن العماد شيخ الشيوخ صدر الدين إبراهيم بن الشيخ سعد الدين بن حموية الجويني مطالب حديث فأخبره أن ملك التتار غازان بن أرغون أسلم على يده بواسطة نائبه نوروز وكان يوماً مشهوداً، وفيها كان بمصر قحط شديد ووباء مفرط حتى أكلوا الجيف وأخرج في اليوم الواحد ألف وخمسمائة جنازة وكانوا يحفرون الحفائر الكبار ويدفنون فيها الجماعة الكثيرة {cite:shadharat-dhahab p. 437}."
  en: "In 694 Ghazan ibn Arghun ibn Abagha ibn Hulagu, king of the Tatars, entered Islam — the people rejoiced and Islam spread through his army {cite:tarikh-khulafa-minhaj-1434 p. 731}."
  es: "En 694, Ghazan ibn Arghun ibn Abagha ibn Hulagu, rey de los tártaros, ingresó al Islam; el pueblo se regocijó y el Islam se extendió a través de su ejército {cita:tarikh-khulafa-minhaj-1434 p. 731}."
  fr: "En 694, Ghazan ibn Arghun ibn Abagha ibn Hulagu, roi des Tatars, entra dans l'Islam - le peuple se réjouit et l'Islam se répandit à travers son armée {cite:tarikh-khulafa-minhaj-1434 p. 731}."
  ur: "694ء میں تاتاریوں کا بادشاہ غزن بن ارغون بن ابیغ ابن حلو اسلام میں داخل ہوا - لوگوں نے خوشی منائی اور اسلام اس کی فوج کے ذریعے پھیلا۔ 731}۔"
  tr: "94 yılında Tatarların kralı Gazan ibn Argun ibn Abaka ibn Hulagu İslamiyet'i kabul etti ve halk buna çok sevindi; İslamiyet onun ordusunda yayıldı. {Kaynak:tarikh-khulafa-minhaj-1434 s. 731}. Şadharat al-Dhahab'da, Şeyh Şeyh Sadr al-Din İbrahim ibn Şeyh Saad al-Din ibn Hamuya al-Juwayni'nin hadis talebiyle İbn al-İmad'a geldiği ve İbn al-İmad'ın ona Tatarların kralı Gazan ibn Argun'un, vekili Nevruz aracılığıyla onun eliyle İslamiyet'i kabul ettiğini ve bunun çok önemli bir gün olduğunu bildirdiği belirtilmektedir. O yıl Mısır'da şiddetli bir kıtlık ve aşırı bir salgın vardı; öyle ki insanlar leş yiyorlardı ve bir günde bin beş yüz cenaze töreni yapılıyordu; büyük çukurlar kazılıp büyük gruplar halinde insanlar bu çukurlara gömülüyordu. {kaynak: Shadharat-dhahab s. 437}"
  id: "Pada tahun 94, Ghazan ibn Arghun ibn Abaqa ibn Hulagu, raja Tatar, memeluk Islam, dan rakyat bergembira karenanya, dan Islam menyebar di pasukannya {cite:tarikh-khulafa-minhaj-1434 p. 731}. Dalam Shadharat al-Dhahab, disebutkan bahwa Syekh al-Shuyukh Sadr al-Din Ibrahim ibn Syekh Saad al-Din ibn Hamuya al-Juwayni datang kepada Ibn al-Imad dengan permintaan hadits, dan beliau memberitahukan bahwa raja Tatar, Ghazan ibn Arghun, telah memeluk Islam melalui wakilnya, Nawruz, dan itu adalah hari yang penting. Pada tahun itu, terjadi kelaparan hebat dan wabah penyakit ekstrem di Mesir, sampai-sampai orang-orang memakan bangkai, dan seribu lima ratus pemakaman diadakan dalam satu hari, dan mereka menggali lubang besar dan mengubur banyak orang di dalamnya {cite:shadharat-dhahab p. 437}."
