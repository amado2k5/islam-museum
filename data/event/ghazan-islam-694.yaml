label: { ar: "إسلام قازان بن أرغون ملك التتار" }
summary:
  ar: "وفي سنة أربع وتسعين دخل في الإسلام قازان بن أرغون بن أبغا بن هولاكو ملك التتار وفرح الناس بذلك وفشا الإسلام في جيشه {cite:tarikh-khulafa-minhaj-1434 p. 731}. وفي شذرات الذهب قدم على ابن العماد شيخ الشيوخ صدر الدين إبراهيم بن الشيخ سعد الدين بن حموية الجويني مطالب حديث فأخبره أن ملك التتار غازان بن أرغون أسلم على يده بواسطة نائبه نوروز وكان يوماً مشهوداً، وفيها كان بمصر قحط شديد ووباء مفرط حتى أكلوا الجيف وأخرج في اليوم الواحد ألف وخمسمائة جنازة وكانوا يحفرون الحفائر الكبار ويدفنون فيها الجماعة الكثيرة {cite:shadharat-dhahab p. 437}."
  en: "In 694 Ghazan ibn Arghun ibn Abagha ibn Hulagu, king of the Tatars, entered Islam — the people rejoiced and Islam spread through his army {cite:tarikh-khulafa-minhaj-1434 p. 731}."
