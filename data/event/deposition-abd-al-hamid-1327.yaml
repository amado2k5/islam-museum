label: { ar: "خلع السلطان عبد الحميد الثاني" }
summary:
  ar: "أجبرت مظاهرات جمعية الاتحاد والترقي في سلانيك ومناستر وإسكوب وسوسن السلطان عبد الحميد الثاني على إعلان الدستور وإحياء البرلمان في ٢٤ تموز ١٩٠٨م، ثم دُبرت أحداث ٣١ مارت ١٩٠٩م في إستانبول وقتل فيها بعض عسكر الاتحاد، فتحرك عسكر الاتحاد من سلانيك ودخل إستانبول. ووجهت الجمعية إلى السلطان تهم تدبير حادث ٣١ مارت وإحراق المصاحف والإسراف والظلم وسفك الدماء، وضُغط على شيخ الإسلام محمد ضياء الدين لإصدار فتوى الخلع فكتب مسودتها نائبه حمدي أفندي المالي وعُدّل قسمها الأخير على أن يعرض مجلس المبعوثان على السلطان التنازل أو الخلع، وفي الثلاثاء ٢٧ نيسان ١٩٠٩م اجتمع ٢٤٠ عضواً من مجلس الأعيان فقُرئت الفتوى ووُوفق على الخلع، فأُبلغه قرارٌ عبر لجنة من إيمانويل قراصو وآرام وأسعد طوبطاني وعارف حكمت. ويثبت الصلابي أن التهم لا تصمد أمام البحث فقد أظهرت الأدلة عدم علم السلطان بحادث ٣١ مارت واستحالة اتهام التقي المعروف بإحراق المصاحف {cite:dawlat-uthmaniyya-salabi p. 458-461}."
  en: "The 1909 deposition of Abdülhamid II — after the 31 March incident, CUP troops from Salonika entered Istanbul, a fetva was drafted and amended, and on 27 April a joint assembly of 240 members voted his removal, delivered by a committee including Emmanuel Carasso and Esad Toptani {cite:dawlat-uthmaniyya-salabi p. 458-461}."
