label: { ar: "خلع السلطان عبد الحميد الثاني", en: "Deposition of Sultan Abd al-Hamid II", es: "Deposición del sultán Abd al-Hamid II", fr: "Déposition du sultan Abd al-Hamid II", ur: "سلطان عبد الحمید ثانی کی معزولی", tr: "Sultan Abdülhamid II'nin tahttan indirilmesi", id: "Penggulingan Sultan Abdul Hamid II" }
summary:
  ar: "أجبرت مظاهرات جمعية الاتحاد والترقي في سلانيك ومناستر وإسكوب وسوسن السلطان عبد الحميد الثاني على إعلان الدستور وإحياء البرلمان في ٢٤ تموز ١٩٠٨م، ثم دُبرت أحداث ٣١ مارت ١٩٠٩م في إستانبول وقتل فيها بعض عسكر الاتحاد، فتحرك عسكر الاتحاد من سلانيك ودخل إستانبول. ووجهت الجمعية إلى السلطان تهم تدبير حادث ٣١ مارت وإحراق المصاحف والإسراف والظلم وسفك الدماء، وضُغط على شيخ الإسلام محمد ضياء الدين لإصدار فتوى الخلع فكتب مسودتها نائبه حمدي أفندي المالي وعُدّل قسمها الأخير على أن يعرض مجلس المبعوثان على السلطان التنازل أو الخلع، وفي الثلاثاء ٢٧ نيسان ١٩٠٩م اجتمع ٢٤٠ عضواً من مجلس الأعيان فقُرئت الفتوى ووُوفق على الخلع، فأُبلغه قرارٌ عبر لجنة من إيمانويل قراصو وآرام وأسعد طوبطاني وعارف حكمت. ويثبت الصلابي أن التهم لا تصمد أمام البحث فقد أظهرت الأدلة عدم علم السلطان بحادث ٣١ مارت واستحالة اتهام التقي المعروف بإحراق المصاحف {cite:dawlat-uthmaniyya-salabi p. 458-461}."
  en: "The 1909 deposition of Abdülhamid II — after the 31 March incident, CUP troops from Salonika entered Istanbul, a fetva was drafted and amended, and on 27 April a joint assembly of 240 members voted his removal, delivered by a committee including Emmanuel Carasso and Esad Toptani {cite:dawlat-uthmaniyya-salabi p. 458-461}."
  es: "La deposición de Abdülhamid II en 1909: después del incidente del 31 de marzo, las tropas del CUP procedentes de Salónica entraron en Estambul, se redactó y modificó un fetva, y el 27 de abril una asamblea conjunta de 240 miembros votó su destitución, llevada a cabo por un comité que incluía a Emmanuel Carasso y Esad Toptani {cite:dawlat-uthmaniyya-salabi p. 458-461}."
  fr: "La déposition d'Abdülhamid II en 1909 — après l'incident du 31 mars, les troupes du CUP de Salonique sont entrées à Istanbul, une fetva a été rédigée et amendée, et le 27 avril, une assemblée conjointe de 240 membres a voté sa destitution, présentée par un comité comprenant Emmanuel Carasso et Esad Toptani {cite:dawlat-uthmaniyya-salabi p. 458-461}."
  ur: "1909 میں عبد الحمید دوم کی معزولی - 31 مارچ کے واقعے کے بعد، سلونیکا سے سی یو پی کے دستے استنبول میں داخل ہوئے، ایک فتویٰ تیار کیا گیا اور اس میں ترمیم کی گئی، اور 27 اپریل کو 240 اراکین کی مشترکہ اسمبلی نے اس کی برطرفی کے حق میں ووٹ دیا، جس میں ایمانوئل کاراسو اور Esad Toptaniya-Toptani-Toptani-Toptani. 458-461}۔"
  tr: "Selanik, Monastir, Üsküp ve Sousse'de İttihat ve Terakki Komitesi'nin düzenlediği gösteriler, Sultan II. Abdülhamid'i 24 Temmuz 1908'de anayasa ilan etmeye ve parlamentoyu yeniden kurmaya zorladı. Ardından, 31 Mart 1909 olayları İstanbul'da düzenlendi ve bu olaylar sırasında bazı Komite askerleri öldürüldü. Komite birlikleri daha sonra Selanik'ten ayrılıp İstanbul'a girdi. Komite, Sultan'ı 31 Mart olayını düzenlemekle, Kur'an yakmakla, israfla, adaletsizlikle ve kan dökmekle suçladı. Şeyhülislam Muhammed Ziya el-Din'e tahttan feragat etmesi için fetva vermesi yönünde baskı yapıldı. Yardımcısı Hamdi Efendi el-Mal fetvayı hazırladı ve son bölümü, Temsilciler Meclisi'nin Sultan'a tahttan feragat veya görevden ayrılma seçeneğini sunacağı şeklinde değiştirildi. 27 Nisan 1909 Salı günü, Senato'nun 240 üyesi toplandı, fetva okundu ve görevden alma onaylandı. Karar daha sonra Emmanuel Karasu, Aram, Asad Toptani ve Arif Hikmet'ten oluşan bir komite aracılığıyla Sultan'a iletildi. El-Salabi, delillerin Sultan'ın 31 Mart olayından habersiz olduğunu ve Kur'an yakmasıyla bilinen El-Taki'yi suçlamanın imkansız olduğunu gösterdiğini, bu nedenle suçlamaların incelemeye dayanmadığını kanıtlamaktadır. {cite:dawlat-uthmaniyya-salabi s. 458-461}."
  id: "Demonstrasi oleh Komite Persatuan dan Kemajuan di Salonika, Monastir, Skopje, dan Sousse memaksa Sultan Abdul Hamid II untuk mendeklarasikan konstitusi dan menghidupkan kembali parlemen pada 24 Juli 1908. Kemudian, peristiwa 31 Maret 1909 direkayasa di Istanbul, di mana beberapa tentara Komite terbunuh. Pasukan Komite kemudian bergerak dari Salonika dan memasuki Istanbul. Komite menuduh Sultan merekayasa insiden 31 Maret, serta membakar Al-Qur'an, melakukan pemborosan, ketidakadilan, dan pertumpahan darah. Tekanan diberikan kepada Syekh al-Islam, Muhammad Zia al-Din, untuk mengeluarkan fatwa agar ia turun takhta. Wakilnya, Hamdi Efendi al-Mal, menyusun fatwa tersebut, dan bagian terakhirnya diubah untuk menetapkan bahwa Dewan Perwakilan Rakyat akan memberikan pilihan kepada Sultan antara turun takhta atau dicopot dari jabatannya. Pada hari Selasa, 27 April 1909, 240 anggota Senat berkumpul, fatwa dibacakan, dan pemecatan disetujui. Keputusan tersebut kemudian dikomunikasikan kepada Sultan melalui sebuah komite yang terdiri dari Emmanuel Karasu, Aram, Asad Toptani, dan Arif Hikmet. Al-Salabi membuktikan bahwa tuduhan tersebut tidak dapat dibuktikan kebenarannya, karena bukti menunjukkan bahwa Sultan tidak mengetahui kejadian tanggal 31 Maret dan bahwa tidak mungkin untuk menuduh Al-Taqi, yang dikenal karena membakar Al-Qur'an. {cite:dawlat-uthmaniyya-salabi p. 458-461}."
