summary:
  ar: "وفي سنة ثلاث وسبعين وسبع مئة أحدثت العلامة الخضراء على عمائم الشرفاء ليتميزوا بها بأمر السلطان وهذا أول ما أحدث وقال في ذلك أبو عبد الله بن جابر الأعمى النحوي صاحب شرح الألفية جعلوا لأبناء الرسول علامة إن العلامة شأن من لم يشهر نور النبوة في كريم وجوههم يغني الشريف عن الطراز الأخضر {cite:tarikh-khulafa-minhaj-1434 p. 757-758}."
  en: "In 773 the sultan instituted the green badge on the ashraf's turbans to mark them out — the first of its kind. Ibn Jabir al-A'ma, the blind versifier of the Alfiyya commentary: 'They made a sign for the Prophet's sons — though a sign befits one unrenowned; the light of prophethood on noble faces spares the sharif the green band' {cite:tarikh-khulafa-minhaj-1434 p. 757-758}."
