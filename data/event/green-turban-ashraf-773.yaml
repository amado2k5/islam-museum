label: { ar: "إحداث العلامة الخضراء على عمائم الشرفاء", en: "The Introduction of the Green Mark on the Turbans of the Ashraf", es: "La introducción de la marca verde en los turbantes de los Ashraf", fr: "L'introduction de la marque verte sur les turbans de l'Ashraf", ur: "اشرف کی پگڑیوں پر سبز نشان کا تعارف" }
summary:
  ar: "وفي سنة ثلاث وسبعين وسبع مئة أحدثت العلامة الخضراء على عمائم الشرفاء ليتميزوا بها بأمر السلطان وهذا أول ما أحدث وقال في ذلك أبو عبد الله بن جابر الأعمى النحوي صاحب شرح الألفية جعلوا لأبناء الرسول علامة إن العلامة شأن من لم يشهر نور النبوة في كريم وجوههم يغني الشريف عن الطراز الأخضر {cite:tarikh-khulafa-minhaj-1434 p. 757-758}."
  en: "In 773 the sultan instituted the green badge on the ashraf's turbans to mark them out — the first of its kind. Ibn Jabir al-A'ma, the blind versifier of the Alfiyya commentary: 'They made a sign for the Prophet's sons — though a sign befits one unrenowned; the light of prophethood on noble faces spares the sharif the green band' {cite:tarikh-khulafa-minhaj-1434 p. 757-758}."
  es: "En 773, el sultán instituyó la insignia verde en los turbantes de los ashraf para distinguirlos, la primera de su tipo. Ibn Jabir al-A'ma, el versificador ciego del comentario Alfiyya, escribió: «Hicieron una señal para los hijos del Profeta, aunque una señal es apropiada para alguien sin renombre; la luz de la profecía en rostros nobles exime al sharif de la banda verde» {cite:tarikh-khulafa-minhaj-1434 p. 757-758}."
  fr: "En 773, le sultan institua l'insigne vert sur les turbans des ashrafs pour les distinguer – une première. Ibn Jabir al-A'ma, le commentateur aveugle du commentaire Alfiyya, écrit: « Ils créèrent un signe pour les fils du Prophète – bien qu'un signe convienne à un homme peu connu; la lumière de la prophétie sur les visages nobles dispense le sharif de la bande verte. » (Voir: Tarikh-Khulafa-Minhaj-1434, p. 757-758)."
  ur: "773 میں سلطان نے اشرف کی پگڑیوں کو نشان زد کرنے کے لیے ان پر سبز رنگ کا نشان لگایا - اپنی نوعیت کا پہلا۔ ابن جابر العامہ، الفیہ تفسیر کے نابینا تصدیق کنندہ: 'انہوں نے پیغمبر کے بیٹوں کے لیے ایک نشان بنایا - حالانکہ یہ نشان کسی غیر معروف کے لیے ہے۔ شریف چہروں پر نبوت کا نور شریف سبز پٹی کو بچاتا ہے۔ 757-758}۔"
