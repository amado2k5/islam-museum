id: event/muakhat-of-salman-and-abu-al-darda
class: event
kind: other
label: { ar: "مؤاخاة سلمان الفارسي وأبي الدرداء", en: "The brothering of Salman al-Farisi and Abu al-Darda'", es: "La hermandad de Salman al-Farisi y Abu al-Darda'", fr: "La fraternité de Salman al-Farisi et Abu al-Darda'", ur: "سلمان فارسی اور ابو الدرداء کا بھائی", tr: "Salman el-Farsi ile Ebu el-Darda arasındaki kardeşlik", id: "Persaudaraan antara Salman al-Farsi dan Abu al-Darda" }
summary:
  ar: "آخى النبي بين سلمان الفارسي وأبي الدرداء؛ وزار سلمان أم الدرداء فرآها متبذلة فنصح أخاه بأن لجسده وربه وزوجه عليه حقاً — فصحب كل ذي حق حقه."
  en: "The Prophet paired Salman al-Farisi with Abu al-Darda'; visiting and finding Umm al-Darda' neglected in dress, Salman counselled his brother that his body, his Lord and his wife each had a right over him — 'give every right-holder his right'."
  es: "El Profeta puso en contacto a Salman al-Farisi con Abu al-Darda'; al visitar a Umm al-Darda' y encontrarla descuidada en su vestimenta, Salman aconsejó a su hermano que su cuerpo, su Señor y su esposa tenían cada uno un derecho sobre él: \"Den a cada poseedor de un derecho lo que le corresponde\"."
  fr: "Le Prophète a associé Salman al-Farisi à Abu al-Darda'; lors d'une visite, et constatant qu'Umm al-Darda' était négligée dans sa tenue, Salman a conseillé à son frère que son corps, son Seigneur et sa femme avaient chacun un droit sur lui — « rends à chacun son droit »."
  ur: "نبی نے سلمان الفارسی کو ابو الدرداء کے ساتھ جوڑا۔ ام الدرداء کو دیکھ کر سلمان نے اپنے بھائی کو مشورہ دیا کہ اس کے جسم، اس کے رب اور اس کی بیوی ہر ایک کا اس پر حق ہے - 'ہر حقدار کو اس کا حق دو'۔"
  tr: "Peygamberimiz, Salman el-Farsi ile Ebu el-Darda arasında kardeşlik kurdu; Salman, Ümmü el-Darda'yı ziyaret etti ve onu perişan bir halde görünce kardeşine, bedeninin, Rabbinin ve karısının kendisinden üstün olduğunu söyledi ve böylece kendisine hakkı olan herkesle birlikte oldu."
  id: "Nabi Muhammad SAW menjalin persaudaraan antara Salman al-Farsi dan Abu al-Darda; dan Salman mengunjungi Umm al-Darda dan melihatnya dalam keadaan berantakan, maka ia menasihati saudaranya bahwa tubuhnya, Tuhannya, dan istrinya memiliki hak atas dirinya — maka ia menemani setiap orang yang memiliki hak atas tubuhnya."
