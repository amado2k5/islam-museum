label: { ar: "حملة عبيد الله بن زياد على بيكند", en: "Ubaydallah ibn Ziyad's Baykand Campaign" }
summary:
  ar: "مات زياد فاستعمل معاوية عبيد الله بن زياد على خراسان وهو ابن خمس وعشرين سنة فقطع النهر في أربعة وعشرين ألفاً فأتى بيكند وكانت خاتون بمدينة بخارا فأرسلت إلى الترك تستمدهم فجاءها منهم دهم فلقيهم المسلمون فهزموهم وحاووا عسكرهم وأقبل المسلمون يخربون فبعثت إليهم خاتون تطلب الصلح والأمان فصالحها على ألف ألف ودخل المدينة وفتح رامدين وبيكند وبينهما فرسخان ورامدين تنسب إلى بيكند ويقال إنه فتح الصغانيان وقدم معه البصرة بخلق من أهل بخارا ففرض لهم."
  en: "On Ziyad's death Mu'awiya gave Khurasan to his son Ubaydallah, twenty-five years old; he crossed the river with twenty-four thousand and came on Baykand while the Khatun held Bukhara's city — her summons brought a Turkish swarm the Muslims routed, and as they laid waste she sued for peace and aman: a million dirhams, and he entered the city, taking Ramadin and Baykand, two farsakhs apart and Ramadin her dependency. It is said he also took the Saghaniyan, and brought Bukhara folk to Basra on stipends."
