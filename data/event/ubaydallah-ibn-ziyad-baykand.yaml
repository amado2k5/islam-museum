label: { ar: "حملة عبيد الله بن زياد على بيكند", en: "Ubaydallah ibn Ziyad's Baykand Campaign", es: "La campaña de Baykand de Ubaydallah ibn Ziyad", fr: "La campagne de Baykand d'Ubaydallah ibn Ziyad" }
summary:
  ar: "مات زياد فاستعمل معاوية عبيد الله بن زياد على خراسان وهو ابن خمس وعشرين سنة فقطع النهر في أربعة وعشرين ألفاً فأتى بيكند وكانت خاتون بمدينة بخارا فأرسلت إلى الترك تستمدهم فجاءها منهم دهم فلقيهم المسلمون فهزموهم وحاووا عسكرهم وأقبل المسلمون يخربون فبعثت إليهم خاتون تطلب الصلح والأمان فصالحها على ألف ألف ودخل المدينة وفتح رامدين وبيكند وبينهما فرسخان ورامدين تنسب إلى بيكند ويقال إنه فتح الصغانيان وقدم معه البصرة بخلق من أهل بخارا ففرض لهم."
  en: "On Ziyad's death Mu'awiya gave Khurasan to his son Ubaydallah, twenty-five years old; he crossed the river with twenty-four thousand and came on Baykand while the Khatun held Bukhara's city — her summons brought a Turkish swarm the Muslims routed, and as they laid waste she sued for peace and aman: a million dirhams, and he entered the city, taking Ramadin and Baykand, two farsakhs apart and Ramadin her dependency. It is said he also took the Saghaniyan, and brought Bukhara folk to Basra on stipends."
  es: "Tras la muerte de Ziyad, Mu'awiya le entregó Jorasán a su hijo Ubaydallah, de veinticinco años. Este cruzó el río con veinticuatro mil hombres y llegó a Baykand mientras la Khatun controlaba Bujará. Su llamado atrajo a un ejército turco que los musulmanes derrotaron, y mientras ellos arrasaban la ciudad, ella imploró paz y amén: un millón de dirhams. Él entró en la ciudad, llevándose a Ramadin y Baykand, separadas por dos farsakhs, y Ramadin quedó bajo su custodia. Se dice que también se llevó a Saghaniyan y trajo gente de Bujará a Basora a cambio de una asignación."
  fr: "À la mort de Ziyad, Mu'awiya confia le Khorasan à son fils Ubaydallah, âgé de vingt-cinq ans. Ce dernier traversa le Nil avec vingt-quatre mille hommes et arriva à Baykand, tandis que la Khatun tenait Boukhara. Son appel provoqua une horde turque que les musulmans mirent en déroute. Alors qu'ils ravageaient la ville, elle demanda la paix et l'aman: un million de dirhams. Mu'awiya entra dans la ville et prit Ramadin et Baykand, distantes de deux farsakhs, Ramadin devenant sa dépendance. On raconte qu'il prit également les Saghaniyan et qu'il amena des habitants de Boukhara à Bassora, moyennant une pension."
