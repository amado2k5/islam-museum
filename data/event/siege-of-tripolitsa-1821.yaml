summary:
  ar: "بطاقة أولية لحصار تريبوليتشا سنة ١٨٢١م، سقوط المدينة العثمانية بيد الثوار اليونانيين ومذبحة أهلها المسلمين واليهود؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Tripolitsa in 1821, the Ottoman city's fall to Greek insurgents and the massacre of its Muslims and Jews; its sources are not yet checked on the page."
  es: "Boceto de ficha para el asedio de Tripolitsa en 1821, la caída de la ciudad otomana en manos de los insurgentes griegos y la masacre de sus musulmanes y judíos; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le siège de Tripolitsa en 1821, la chute de la ville ottomane aux mains des insurgés grecs et le massacre de ses musulmans et juifs; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1821 میں طرابلس کے محاصرے کے لیے ڈرافٹ کارڈ، یونانی باغیوں کے ہاتھوں عثمانی شہر کا زوال اور اس کے مسلمانوں اور یہودیوں کا قتل عام؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1821 yılında gerçekleşen Trablusgarp kuşatması, Osmanlı kentinin Yunan devrimcilerinin eline geçmesi ve Müslüman ve Yahudi sakinlerinin katledilmesine dair ön bilgiler; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Tripolitania pada tahun 1821 M, jatuhnya kota Ottoman ke tangan para revolusioner Yunani dan pembantaian penduduk Muslim dan Yahudi; sumber-sumbernya belum ditinjau di halaman ini."
