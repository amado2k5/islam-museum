label: { en: "The Battle of Uhud", ar: "غزوة أحد" }
summary:
  en: "A battle near Mount Uhud in which the Quraysh gained the upper hand and Hamza, the Prophet's uncle, was killed."
  ar: "معركة قرب جبل أحد تفوّقت فيها قريش واستشهد فيها حمزة عم النبي. ومن أخبارها في صحيح البخاري: جعل النبي عبد الله بن جبير على الرماة فلما تركوا موضعهم أصاب المشركون من المسلمين سبعين، وقال أبو سفيان يومئذ «يوم بيوم بدر والحرب سجال» {cite:sahih-al-bukhari 3039}، وقول النبي لسعد بن أبي وقاص «ارم فداك أبي وأمي» {cite:sahih-al-bukhari 3725}، وصعوده أحد مع أبي بكر وعمر وعثمان فلما رجف بهم الجبل قال «اسكن أحد فليس عليك إلا نبي وصديق وشهيدان» {cite:sahih-al-bukhari 3697} ومنها أيضاً أن فاطمة كانت تغسل جرحه وعلي يسكب الماء بالمجن حتى ألصقت به قطعة حصير محرقة فاستمسك الدم وكسرت رباعيته {cite:sahih-al-bukhari 4075}، وأنه كان يجمع بين الرجلين من القتلى في ثوب واحد ويسأل «أيهم أكثر أخذاً للقرآن» فيقدمه في اللحد وأمر بدفنهم بدمائهم لم يغسلوا ولم يصل عليهم {cite:sahih-al-bukhari 4079}، ورؤياه السيف الذي انقطع صدره فكان ما أصيب به المؤمنون ثم هزه فعاد أحسن ما كان {cite:sahih-al-bukhari 4081}."
