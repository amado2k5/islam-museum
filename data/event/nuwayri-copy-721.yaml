label:
  ar: "نسخته الثانية من «نهاية الأرب»: ثمانية عشر مجلداً في أقل من عشرة أشهر، ٧٢١-٧٢٢هـ"
  en: "The second copy of the Nihaya: eighteen volumes in under ten months, 721-722/1321-1322"
  ur: "نہایۃ الارب کا دوسرا نسخہ: دس ماہ سے کم میں اٹھارہ جلدیں، 721-722ھ/1321-1322ء"
  es: "La segunda copia del Nihaya: dieciocho volúmenes en menos de diez meses, 721-722/1321-1322"
  fr: "La deuxième copie du Nihaya: dix-huit volumes en moins de dix mois, 721-722/1321-1322"
  tr: "“Nihayat al-Arab” adlı eserinin ikinci baskısı: on sekiz cilt, on aydan kısa sürede, Hicri 721-722 yılları arasında tamamlandı."
  id: "Edisi kedua karyanya “Nihayat al-Arab”: delapan belas jilid dalam waktu kurang dari sepuluh bulan, 721-722 H."
summary:
  ar: "شرع النويري في نسخة ثانية من موسوعته ففرغ من مجلدها الأول في ٢٠ ذي القعدة ٧٢١هـ/١١ ديسمبر ١٣٢١م، والخامس في ٢٢ جمادى الأولى ٧٢٢هـ/٨ يونيو ١٣٢٢م، والسابع عشر في ٧ رمضان ٧٢٢هـ/١٩ سبتمبر، والثامن عشر في ٢٦ رمضان/٨ أكتوبر — أي ثمانية عشر مجلداً في أقل من عشرة أشهر؛ وقد لاحظ مؤرخوه قدرته على ملء ثلاث كراريس في اليوم، يضاف إلى ما نسخ وباع ثماني نسخ من صحيح البخاري — يكتب النسخة ويملأها وينقل الطبقات والروايات عليها ويبيّضها بالألف — وعُدّ خطاطاً ممتازاً ومجلّد كتب {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {cite:durar-kamina-jil-1993 1/197}."
  en: "Al-Nuwayri began a second copy of his encyclopaedia, completing its first volume on 20 Dhu al-Qa'da 721/11 December 1321, the fifth on 22 Jumada I 722/8 June 1322, the seventeenth on 7 Ramadan 722/19 September and the eighteenth on 26 Ramadan/8 October — eighteen volumes in under ten months. His biographers noted his capacity to fill three manuscript notebooks in a day; besides the copies he made and sold there were eight copies of the Sahih of al-Bukhari — he wrote the copy, filled it, carried over its collations and readings and finished it off in a thousand — and he was deemed an excellent calligrapher and bookbinder {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {cite:durar-kamina-jil-1993 1/197}."
  ur: "نويری نے اپنے دائرۃ المعارف کا دوسرا نسخہ شروع کیا: پہلی جلد 20 ذیقعدہ 721ھ/11 دسمبر 1321ء کو مکمل، پانچویں 22 جمادی الاولیٰ 722ھ/8 جون 1322ء، سترہویں 7 رمضان 722ھ/19 ستمبر اور اٹھارہویں 26 رمضان/8 اکتوبر کو — دس ماہ سے کم میں اٹھارہ جلدیں۔ مؤرخین نے ایک دن میں تین مسودے بھرنے کی ان کی صلاحیت نوٹ کی؛ جو نسخے انہوں نے بکاؤ کے لیے نقل کیے ان کے علاوہ صحیح بخاری کی آٹھ نسخے بھی ہیں — نسخہ لکھتے، بھر دیتے، اس پر طبقات اور روایتیں نقل کرتے اور ایک دن میں بیاض کرتے — اور وہ ممتاز خطاط اور کتاب مجلد شمار ہوئے {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {cite:durar-kamina-jil-1993 1/197}۔"
  es: "Al-Nuwayri comenzó una segunda copia de su enciclopedia, completando su primer volumen el 20 de Dhu al-Qa'da de 721/11 de diciembre de 1321, el quinto el 22 de Jumada I de 722/8 de junio de 1322, el decimoséptimo el 7 de Ramadán de 722/19 de septiembre y el decimoctavo el 26 de Ramadán/8 de octubre: dieciocho volúmenes en menos de diez meses. Sus biógrafos destacaron su capacidad para llenar tres cuadernos manuscritos en un día; además de las copias que hizo y vendió, había ocho copias del Sahih de al-Bukhari: escribió la copia, la llenó, transfirió sus cotejos y lecturas y la terminó en mil, y fue considerado un excelente calígrafo y encuadernador {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {cite:durar-kamina-jil-1993 1/197}."
  fr: "Al-Nuwayri entreprit la rédaction d'un second exemplaire de son encyclopédie, achevant le premier volume le 20 Dhu al-Qa'da 721 (11 décembre 1321), le cinquième le 22 Jumada I 722 (8 juin 1322), le dix-septième le 7 Ramadan 722 (19 septembre) et le dix-huitième le 26 Ramadan (8 octobre) – soit dix-huit volumes en moins de dix mois. Ses biographes notèrent sa capacité à remplir trois cahiers manuscrits par jour; outre les copies qu'il réalisa et vendit, il existait huit exemplaires du Sahih d'al-Bukhari – il en rédigea l'exemplaire, le compléta, en reporta les collations et les lectures, et le termina en mille exemplaires – et il était considéré comme un excellent calligraphe et relieur."
  tr: "El-Nuveyri, ansiklopedisinin ikinci baskısına başladı ve ilk cildini 20 Zilhicce 721 Hicri/11 Aralık 1321 Miladi'de, beşincisini 22 Cemâde el-Ula 722 Hicri/8 Haziran 1322 Miladi'de, on yedincisini 7 Ramazan 722 Hicri/19 Eylül'de ve on sekizincisini 26 Ramazan/8 Ekim'de tamamladı; yani on aydan kısa bir sürede on sekiz cilt. Biyografi yazarları, kopyalayıp sattığı şeylere ek olarak, günde üç defter doldurma yeteneğine sahip olduğunu belirtmişlerdir: Sahih el-Buhari'nin sekiz nüshasını - kopyayı yazardı, doldururdu, sınıfları ve rivayetleri üzerine aktarırdı ve bin satırla kaplardı - ve mükemmel bir hattat ve kitap ciltçisi olarak kabul edilirdi. {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {alıntı:durar-kamina-jil-1993 1/197}."
  id: "Al-Nuwayri memulai edisi kedua ensiklopedianya, menyelesaikan jilid pertamanya pada tanggal 20 Dzul Qi'dah 721 H/11 Desember 1321 M, jilid kelima pada tanggal 22 Jumada Ula 722 H/8 Juni 1322 M, jilid ketujuh belas pada tanggal 7 Ramadan 722 H/19 September, dan jilid kedelapan belas pada tanggal 26 Ramadan/8 Oktober — yaitu, delapan belas jilid dalam waktu kurang dari sepuluh bulan. Para penulis biografinya mencatat kemampuannya untuk mengisi tiga buku catatan sehari, di samping apa yang ia salin dan jual: delapan salinan Sahih al-Bukhari — ia akan menulis salinannya, mengisinya, memindahkan kelas dan riwayat ke dalamnya, dan menutupinya dengan seribu baris — dan ia dianggap sebagai kaligrafer dan penjilid buku yang ulung. {cite:encyclopaedia-of-islam-2 vol. 8 p. 159} {kutip:durar-kamina-jil-1993 1/197}."
