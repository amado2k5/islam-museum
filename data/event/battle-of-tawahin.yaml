label: { ar: "وقعة الطواحين", en: "Battle of the Mills" }
summary:
  ar: "وقعة بين أبي العباس بن الموفق وأبي الجيش خمارويه بن أحمد بن طولون بالطواحين من أعمال فلسطين يوم الثلاثاء لأربع عشرة ليلة بقيت من شوال سنة إحدى وسبعين ومائتين، فكانت الهزيمة على أبي الجيش واحتوى أبو العباس على جميع عسكره، وأفلت خمارويه في جماعة من قواده حتى أتى الفسطاط، وتخلف غلامه سعد الأعسر فواقع أبا العباس فهزمه واستباح عسكره وقتل رؤساء قواده {cite:muruj-al-dhahab p. 579-580}. وعند ابن الجوزي وفي سادس عشر شوال سنة 271هـ كانت الوقعة بين أبي العباس وبين خمارويه بن أحمد بن طولون فهزمه أبو العباس فخرج خمارويه هارباً على حمار ووقع أصحاب أبي العباس في النهب ونزل أبو العباس في مضرب خمارويه وهو لا يرى أنه بقي له طالب فخرج كمين لخمارويه كان أكمنه فشد على أصحاب أبي العباس فانهزموا وذهب ما كان في العسكرين بالنهب {cite:muntazam-ibn-al-jawzi p. 101}"
  en: "271/885: al-Muwaffaq's son Abu l-Abbas routs Khumarawayh at the Mills in Palestine — then Khumarawayh's ghulam Sa'd al-A'sar counterattacks and sacks the victor's camp {cite:muruj-al-dhahab p. 579-580}."
