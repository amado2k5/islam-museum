summary:
  ar: "وقعة بين أبي العباس بن الموفق وأبي الجيش خمارويه بن أحمد بن طولون بالطواحين من أعمال فلسطين يوم الثلاثاء لأربع عشرة ليلة بقيت من شوال سنة إحدى وسبعين ومائتين، فكانت الهزيمة على أبي الجيش واحتوى أبو العباس على جميع عسكره، وأفلت خمارويه في جماعة من قواده حتى أتى الفسطاط، وتخلف غلامه سعد الأعسر فواقع أبا العباس فهزمه واستباح عسكره وقتل رؤساء قواده {cite:muruj-al-dhahab p. 579-580}. وعند ابن الجوزي وفي سادس عشر شوال سنة 271هـ كانت الوقعة بين أبي العباس وبين خمارويه بن أحمد بن طولون فهزمه أبو العباس فخرج خمارويه هارباً على حمار ووقع أصحاب أبي العباس في النهب ونزل أبو العباس في مضرب خمارويه وهو لا يرى أنه بقي له طالب فخرج كمين لخمارويه كان أكمنه فشد على أصحاب أبي العباس فانهزموا وذهب ما كان في العسكرين بالنهب {cite:muntazam-ibn-al-jawzi p. 101}"
  en: "271/885: al-Muwaffaq's son Abu l-Abbas routs Khumarawayh at the Mills in Palestine — then Khumarawayh's ghulam Sa'd al-A'sar counterattacks and sacks the victor's camp {cite:muruj-al-dhahab p. 579-580}."
  fr: "271/885 : Abu l-Abbas, fils d'al-Muwaffaq, met en déroute Khumarawayh aux Moulins, en Palestine ; puis le ghulam de Khumarawayh, Sa'd al-A'sar, contre-attaque et pille le camp du vainqueur {cite:muruj-al-dhahab p. 579-580}."
  es: "271/885: Abu l-Abbas, hijo de al-Muwaffaq, derrota a Khumarawayh en los molinos de Palestina; luego, Sa'd al-A'sar, el ghulam de Khumarawayh, contraataca y saquea el campamento del vencedor {cite:muruj-al-dhahab p. 579-580}."
  ur: "271/885: الموفق کے بیٹے ابو العباس نے فلسطین میں ملز میں خماراویہ کو شکست دی - پھر خماراویہ کے غلام سعد العصر نے جوابی حملہ کیا اور فاتح کے کیمپ کو توڑ دیا۔ 579-580}۔"
  tr: "271 yılında Şevval ayının bitiminden on dört gece önce, Salı günü, Filistin bölgesindeki el-Tawahin'de Ebu el-Abbas ibn el-Muvaffak ile Ebu el-Ceyş Humarawayh ibn Ahmed ibn Tulun arasında bir savaş gerçekleşti. Ebu el-Ceyş yenildi ve Ebu el-Abbas tüm ordusunu ele geçirdi. Humarawayh, komutanlarından bir grupla birlikte Fustat'a kadar kaçtı. Kölesi Sa'd el-A'sar geride kaldı ve Ebu el-Abbas ile savaştı, onu yendi, ordusunu ele geçirdi ve komutanlarının liderlerini öldürdü. {kaynak: Muruj-al-Dhahab s. 579-580}. İbn el-Cevzi'ye göre, 271 Hicri yılının Şevval ayının on altıncı gününde Ebu el-Abbas ile Humarawayh ibn Ahmed ibn Tulun arasında savaş gerçekleşti. Ebu el-Abbas onu yendi ve Humarawayh bir eşeğe binerek kaçtı. Ebu el-Abbas'ın arkadaşları yağmalama sırasında yakalandı ve Ebu el-Abbas, peşinde kimsenin kalmadığını düşünerek Humarawayh'ın çadırında kamp kurdu. Sonra Humarawayh'ın pusu kurduğu kişiler Ebu el-Abbas'ın arkadaşlarına saldırdı, böylece onlar da yenildi ve her iki kamptaki her şey yağmalandı. {cite:muntazam-ibn-al-jawzi s. 101}"
  id: "Pertempuran terjadi antara Abu al-Abbas ibn al-Muwaffaq dan Abu al-Jaysh Khumarawayh ibn Ahmad ibn Tulun di al-Tawahin di distrik Palestina pada hari Selasa, empat belas malam sebelum berakhirnya bulan Syawal tahun 271 Hijriah. Abu al-Jaysh dikalahkan, dan Abu al-Abbas merebut seluruh pasukannya. Khumarawayh melarikan diri bersama sekelompok komandannya hingga mencapai Fustat. Budaknya, Sa’d al-A’sar, tinggal di belakang dan melawan Abu al-Abbas, mengalahkannya dan mengambil pasukannya untuk dirinya sendiri serta membunuh para pemimpin komandannya. {cite:muruj-al-dhahab hlm. 579-580}. Menurut Ibn al-Jawzi, pada tanggal enam belas Syawal tahun 271 Hijriah, pertempuran terjadi antara Abu al-Abbas dan Khumarawayh ibn Ahmad ibn Tulun. Abu al-Abbas mengalahkannya, dan Khumarawayh melarikan diri dengan seekor keledai. Para sahabat Abu al-Abbas terjebak dalam penjarahan, dan Abu al-Abbas berkemah di tenda Khumarawayh, tanpa menyadari bahwa masih ada pengejar yang tersisa. Kemudian pasukan Khumarawayh keluar dan menyerang para sahabat Abu al-Abbas, sehingga mereka dikalahkan, dan semua yang ada di kedua perkemahan dijarah. {cite:muntazam-ibn-al-jawzi p. 101}"
