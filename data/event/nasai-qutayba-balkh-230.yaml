label:
  ar: "رحلة النسائي إلى قتيبة بن سعيد ببلخ وهو ابن خمس عشرة سنة، نحو ٢٣٠هـ"
  en: "Al-Nasa'i's journey to Qutayba ibn Sa'id at Balkh, aged fifteen, c. 230/844"
  ur: "نسائی کا قتیبہ بن سعید کے پاس بلخ کا سفر، پندرہ برس کی عمر میں، تقریباً 230ھ/844ء"
summary:
  ar: "رحل أحمد بن شعيب النسائي إلى قتيبة بن سعيد الثقفي — شيخ البخاري ومسلم ومحدث خراسان المقيم ببلخ — وهو ابن خمس عشرة سنة، وقال: «أقمت عنده سنة وشهرين» {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
  en: "Ahmad ibn Shu'ayb al-Nasa'i journeyed to Qutayba ibn Sa'id al-Thaqafi — shaykh of al-Bukhari and Muslim and the muhaddith of Khurasan resident at Balkh — when he was fifteen, and said: 'I stayed with him a year and two months' {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
  ur: "احمد بن شعیب نسائی قتیبہ بن سعید ثقفی — بخاری اور مسلم کے شیخ اور خراسان کے محدث، بلخ کے مقیم — کے پاس پندرہ برس کی عمر میں پہنچے، اور فرماتے ہیں: «میں ان کے ہاں ایک سال اور دو مہینے رہا» {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}۔"
