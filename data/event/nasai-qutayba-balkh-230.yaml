id: event/nasai-qutayba-balkh-230
class: event
kind: other
label:
  ar: "رحلة النسائي إلى قتيبة بن سعيد ببلخ وهو ابن خمس عشرة سنة، نحو ٢٣٠هـ"
  en: "Al-Nasa'i's journey to Qutayba ibn Sa'id at Balkh, aged fifteen, c. 230/844"
  ur: "نسائی کا قتیبہ بن سعید کے پاس بلخ کا سفر، پندرہ برس کی عمر میں، تقریباً 230ھ/844ء"
  es: "El viaje de Al-Nasa'i a Qutayba ibn Sa'id en Balkh, quince años, c. 230/844"
  fr: "Voyage d'Al-Nasa'i à Qutayba ibn Sa'id à Balkh, âgé de quinze ans, v. 230/844"
  tr: "El-Nasa'i'nin, yaklaşık 230 Hicri yılında, on beş yaşındayken Belh'teki Kuteybe ibn Sa'id'i ziyaret etmesi."
  id: "Perjalanan Al-Nasa’i ke Qutaybah ibn Sa’id di Balkh ketika ia berusia lima belas tahun, sekitar tahun 230 Hijriah."
summary:
  ar: "رحل أحمد بن شعيب النسائي إلى قتيبة بن سعيد الثقفي — شيخ البخاري ومسلم ومحدث خراسان المقيم ببلخ — وهو ابن خمس عشرة سنة، وقال: «أقمت عنده سنة وشهرين» {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
  en: "Ahmad ibn Shu'ayb al-Nasa'i journeyed to Qutayba ibn Sa'id al-Thaqafi — shaykh of al-Bukhari and Muslim and the muhaddith of Khurasan resident at Balkh — when he was fifteen, and said: 'I stayed with him a year and two months' {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
  ur: "احمد بن شعیب نسائی قتیبہ بن سعید ثقفی — بخاری اور مسلم کے شیخ اور خراسان کے محدث، بلخ کے مقیم — کے پاس پندرہ برس کی عمر میں پہنچے، اور فرماتے ہیں: «میں ان کے ہاں ایک سال اور دو مہینے رہا» {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}۔"
  es: "Ahmad ibn Shu'ayb al-Nasa'i viajó a Qutayba ibn Sa'id al-Thaqafi - shaykh de al-Bukhari y Muslim y muhaddith de Khurasan residente en Balkh - cuando tenía quince años, y dijo: 'Me quedé con él un año y dos meses' {cita:tazkirat-al-huffaz j.2 p. 617} {cita:tarikh-islam-dhahabi p. 106}."
  fr: "Ahmad ibn Shu'ayb al-Nasa'i s'est rendu à Qutayba ibn Sa'id al-Thaqafi — cheikh d'al-Bukhari et Muslim et muhaddith du Khurasan résidant à Balkh — quand il avait quinze ans, et a dit: « Je suis resté avec lui un an et deux mois » {cite: tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
  tr: "Ahmed ibn Şuayb el-Nasa'i, on beş yaşındayken Buhari ve Müslim şeyhi ve Horasan hadis alimi olan, Belh'te ikamet eden Kuteybe ibn Sa'id el-Sakafi'nin yanına gitti ve şöyle dedi: \"Onunla bir yıl iki ay kaldım.\" {cite:tazkirat-al-huffaz c.2 s. 617} {cite:tarikh-islam-dhahabi s. 106}."
  id: "Ahmad ibn Shu’ayb al-Nasa’i melakukan perjalanan ke Qutaybah ibn Sa’id al-Thaqafi — syekh al-Bukhari dan Muslim serta ulama hadits Khurasan yang tinggal di Balkh — ketika ia berusia lima belas tahun, dan ia berkata: “Aku tinggal bersamanya selama satu tahun dua bulan.” {cite:tazkirat-al-huffaz j.2 p. 617} {cite:tarikh-islam-dhahabi p. 106}."
