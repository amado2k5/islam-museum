id: event/khalid-expedition-to-ukaydir
class: event
kind: other
label: { ar: "بعث خالد إلى أكيدر دومة", en: "Khalid's mission to Ukaydir of Dumat al-Jandal" }
summary:
  ar: "دعا النبي خالد بن الوليد فبعثه إلى أكيدر بن عبد الملك الكندي النصراني ملك دومة وقال له إنه سيجده يصيد البقر؛ فخرج خالد، وفي ليلة مقمرة خرج أكيدر لما حكّت البقر قرونها بباب قصره، فتلقته خيل النبي فأخذته وقتلوا أخاه حسان، واستلب خالد قباءه الديباج المخوّص بالذهب وبعث به إلى النبي."
  en: The Prophet summoned Khalid ibn al-Walid and sent him to Ukaydir ibn Abd al-Malik al-Kindi, the Christian king of Duma, telling him he would find him hunting wild cows. Khalid set out, and on a moonlit night Ukaydir came out when the cows rubbed their horns against his palace gate; the Prophet's cavalry met him, captured him and killed his brother Hassan. Khalid took his brocade gown laced with gold and sent it to the Prophet.
