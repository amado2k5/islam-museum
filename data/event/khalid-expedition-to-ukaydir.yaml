id: event/khalid-expedition-to-ukaydir
class: event
kind: other
label: { ar: "بعث خالد إلى أكيدر دومة", en: "Khalid's mission to Ukaydir of Dumat al-Jandal", es: "La misión de Khalid a Ukaydir de Dumat al-Jandal", fr: "Mission de Khalid à Ukaydir de Dumat al-Jandal", ur: "خالد کا مشن دمت الجندل کے اوکیدیر کو", tr: "Halid, Akider Douma'ya gönderildi.", id: "Khalid mengirim pesan ke Akider Douma" }
summary:
  ar: "دعا النبي خالد بن الوليد فبعثه إلى أكيدر بن عبد الملك الكندي النصراني ملك دومة وقال له إنه سيجده يصيد البقر؛ فخرج خالد، وفي ليلة مقمرة خرج أكيدر لما حكّت البقر قرونها بباب قصره، فتلقته خيل النبي فأخذته وقتلوا أخاه حسان، واستلب خالد قباءه الديباج المخوّص بالذهب وبعث به إلى النبي."
  en: The Prophet summoned Khalid ibn al-Walid and sent him to Ukaydir ibn Abd al-Malik al-Kindi, the Christian king of Duma, telling him he would find him hunting wild cows. Khalid set out, and on a moonlit night Ukaydir came out when the cows rubbed their horns against his palace gate; the Prophet's cavalry met him, captured him and killed his brother Hassan. Khalid took his brocade gown laced with gold and sent it to the Prophet.
  es: "El Profeta convocó a Khalid ibn al-Walid y lo envió a ver a Ukaydir ibn Abd al-Malik al-Kindi, el rey cristiano de Duma, diciéndole que lo encontraría cazando vacas salvajes. Khalid partió, y en una noche de luna llena, Ukaydir salió cuando las vacas rozaron con sus cuernos la puerta de su palacio; la caballería del Profeta lo interceptó, lo capturó y mató a su hermano Hassan. Khalid tomó su túnica de brocado con bordados de oro y se la envió al Profeta."
  fr: "Le Prophète convoqua Khalid ibn al-Walid et l'envoya auprès d'Ukaydir ibn Abd al-Malik al-Kindi, roi chrétien de Douma, lui disant qu'il le trouverait en train de chasser des vaches sauvages. Khalid partit, et par une nuit de pleine lune, Ukaydir sortit au moment où les vaches frottaient leurs cornes contre la porte de son palais; la cavalerie du Prophète l'interpella, le captura et tua son frère Hassan. Khalid prit sa robe de brocart brodée d'or et l'envoya au Prophète."
  ur: "نبی نے خالد بن ولید کو بلوایا اور اسے دوما کے عیسائی بادشاہ عقیدیر بن عبد الملک الکندی کے پاس بھیجا اور اسے بتایا کہ وہ اسے جنگلی گایوں کا شکار کرتے ہوئے پائے گا۔ خالد روانہ ہوا، اور چاندنی رات کو عقیدیر باہر نکلا جب گائیں اس کے محل کے دروازے پر اپنے سینگ رگڑ رہی تھیں۔ نبی کے گھڑ سواروں نے اس سے ملاقات کی، اسے پکڑ لیا اور اس کے بھائی حسن کو قتل کر دیا۔ خالد نے سونے سے جڑا اپنا بروکیڈ گاؤن لیا اور اسے نبی کے پاس بھیج دیا۔"
  tr: "Peygamber, Halid ibn el-Velid'i çağırdı ve onu Dumat'ın Hristiyan kralı Ukaydir ibn Abd el-Malik el-Kindi'ye gönderdi ve ona sığır avlarken onu bulacağını söyledi. Halid dışarı çıktı ve ay ışığıyla aydınlanan bir gecede, Ukaydir dışarı çıktığında sığırlar boynuzlarını sarayının kapısına sürttü. Peygamberin süvarileri onu karşıladı, yakaladı ve kardeşi Hasan'ı öldürdü. Halid, altın işlemeli ipek elbisesini alıp Peygambere gönderdi."
  id: "Nabi memanggil Khalid bin al-Walid dan mengutusnya kepada Ukaydir bin Abd al-Malik al-Kindi, raja Kristen Dumat, dan memberitahunya bahwa beliau akan menemukannya sedang berburu ternak. Maka Khalid pergi, dan pada malam yang diterangi bulan, Ukaydir keluar ketika ternak menggesekkan tanduknya ke pintu istananya. Para penunggang kuda Nabi menemuinya, menangkapnya, dan membunuh saudaranya Hassan. Khalid mengambil jubah brokatnya yang disulam dengan emas dan mengirimkannya kepada Nabi."
