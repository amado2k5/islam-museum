label: { en: "Expedition to Hamra al-Asad", ar: "غزوة حمراء الأسد", es: "Expedición a Hamra al-Asad", fr: "Expédition à Hamra al-Asad", ur: "حمرا الاسد کی طرف مہم", tr: "Kırmızı Aslan Baskını", id: "Serangan Singa Merah" }
summary:
  ar: "صباح الأحد الثامن من شوال سنة 3هـ ندب النبي الناس لمتابعة قريش وقال: لا يخرج معنا إلا من شهد القتال. استجاب المسلمون على ما بهم من جراح. بلغوا حمراء الأسد على بعد ثمانية أميال من المدينة فعسكروا. أرسل النبي معبد بن أبي معبد الخزاعي إلى أبي سفيان، فشن عليه حرب أعصاب دعائية بالروحاء: «محمد خرج في جمع لم أر مثله قط يتحرقون عليكم». انهارت عزائم الجيش المكي فواصلوا الانسحاب إلى مكة. أرسل أبو سفيان ركباً من عبد القيس يبلّغ المسلمين تهديداً فلم يزدهم إلا إيماناً. أقام النبي الإثنين والثلاثاء والأربعاء ثم رجع وأعدم أبا عزة الجمحي الذي نكث عهده {cite:mubarakpuri-raheeq p.284}. وفي الصحيح أن الآية «الذين استجابوا لله والرسول من بعد ما أصابهم القرح» نزلت فيمن انتدب منهم سبعون رجلاً في أثر المشركين وكان فيهم أبو بكر والزبير {cite:sahih-al-bukhari 4077}."
  en: "On the morning of Sunday 8 Shawwal 3 AH the Prophet called the people to pursue Quraysh and said: only those who fought with us may come. The Muslims answered despite their wounds. They reached Hamra al-Asad, eight miles from Medina, and camped. The Prophet sent Ma'bad ibn Abi Ma'bad al-Khuza'i to Abu Sufyan, and at al-Rawha he waged a propaganda war of nerves on him: 'Muhammad has come out with a gathering I have never seen the like of, burning for you.' The Meccan army's resolve collapsed and they kept withdrawing to Mecca. Abu Sufyan sent riders of Abd al-Qays to threaten the Muslims, which only increased their faith. The Prophet stayed Monday, Tuesday and Wednesday, then returned and executed Abu Azza al-Jumahi, who had broken his pledge {cite:mubarakpuri-raheeq p.284}."
  es: "En la mañana del domingo 8 de Shawwal del año 3 de la Hégira, el Profeta llamó a la gente a perseguir a los Quraysh y dijo: «Solo pueden venir quienes hayan luchado con nosotros». Los musulmanes respondieron a pesar de sus heridas. Llegaron a Hamra al-Asad, a ocho millas de Medina, y acamparon. El Profeta envió a Ma'bad ibn Abi Ma'bad al-Khuza'i a Abu Sufyan, y en al-Rawha libró una guerra de propaganda psicológica contra él: «Mahoma ha salido con una multitud como nunca antes había visto, ardiendo por vosotros». La determinación del ejército de La Meca se derrumbó y continuaron retirándose hacia La Meca. Abu Sufyan envió jinetes de Abd al-Qays para amenazar a los musulmanes, lo que solo aumentó su fe. El Profeta permaneció allí el lunes, martes y miércoles, luego regresó y ejecutó a Abu Azza al-Jumahi, quien había roto su promesa {cite:mubarakpuri-raheeq p.284}."
  fr: "Le dimanche 8 Shawwal de l'an 3 de l'Hégire au matin, le Prophète appela le peuple à poursuivre les Qurayshites et déclara: « Seuls ceux qui ont combattu à nos côtés sont autorisés à venir. » Malgré leurs blessures, les musulmans répondirent présents. Ils atteignirent Hamra al-Asad, à huit milles de Médine, et y établirent leur campement. Le Prophète envoya Ma'bad ibn Abi Ma'bad al-Khuza'i auprès d'Abu Sufyan, et à al-Rawha, il mena contre lui une intense campagne de propagande, usant de rhétorique: « Muhammad est revenu avec une armée d'une ferveur sans pareille, qui brûle de votre soutien. » La détermination de l'armée mecquoise s'effondra et elle continua de se replier sur La Mecque. Abu Sufyan envoya des cavaliers d'Abd al-Qays menacer les musulmans, ce qui ne fit que renforcer leur foi. Le Prophète resta sur place les lundi, mardi et mercredi, puis revint et fit exécuter Abu Azza al-Jumahi, qui avait rompu son serment (voir Mubarakpuri-Raheeq, p. 284)."
  ur: "اتوار 8 شوال 3 ہجری کی صبح نبی کریم نے قریش کے تعاقب کے لیے لوگوں کو بلایا اور فرمایا: صرف وہی لوگ آ سکتے ہیں جو ہم سے لڑیں گے۔ مسلمانوں نے اپنے زخموں کے باوجود جواب دیا۔ مدینہ سے آٹھ میل کے فاصلے پر حمرہ الاسد پہنچے اور پڑاؤ ڈالا۔ نبی نے معبد بن ابی معبد الخزاعی کو ابو سفیان کے پاس بھیجا اور الروح میں اس پر اعصابی جنگ چھیڑ دی: 'محمد ایک ایسی مجلس کے ساتھ نکلے ہیں جو میں نے تمہارے لیے جلتے ہوئے کبھی نہیں دیکھی۔' مکہ کی فوج کا عزم ٹوٹ گیا اور وہ مکہ کی طرف پیچھے ہٹتے رہے۔ ابو سفیان نے عبد القیس کے سواروں کو مسلمانوں کو ڈرانے کے لیے بھیجا جس سے ان کے ایمان میں اضافہ ہوا۔ پیغمبر نے پیر، منگل اور بدھ کو قیام کیا، پھر واپس آئے اور ابو عزہ الجمعی کو قتل کر دیا، جس نے اپنا عہد توڑ دیا تھا {حوالہ:مبارکپوری الرحیق صفحہ 284}۔"
  tr: "Hicri 3. yılın Şevval ayının 8. Pazar sabahı, Peygamberimiz Kureyş kabilesini takip etmeleri için halkı çağırdı ve şöyle dedi: \"Sadece çatışmaya şahit olanlar bizimle birlikte gitsinler.\" Müslümanlar yaralarına rağmen karşılık verdiler. Medine'ye sekiz mil uzaklıktaki Hamra' el-Esad'a ulaştılar ve kamp kurdular. Peygamberimiz, Ma'bad ibn Abi Ma'bad el-Huza'i'yi Ebu Sufyan'a gönderdi. Ebu Sufyan, el-Ravha'da ona karşı psikolojik bir savaş başlattı ve şöyle dedi: \"Muhammed, daha önce hiç görmediğim türden bir orduyla çıktı ve onlar size karşı öfkeyle yanıyorlar.\" Mekke ordusunun morali çöktü ve Mekke'ye geri çekilmeye devam ettiler. Ebu Sufyan, Müslümanlara tehdit iletmek için Abdülkays kabilesinden bir kervan gönderdi, ancak bu sadece onların imanını artırdı. Peygamberimiz Pazartesi, Salı ve Çarşamba günleri orada kaldı, sonra geri döndü ve yeminini bozan Ebu Azze el-Cumahi'yi idam etti. Rivayetlere göre, \"Yaralandıktan sonra Allah'a ve Resulüne karşılık verenler\" ayeti, aralarında Ebu Bekir ve Zübeyr'in de bulunduğu yetmiş kişinin müşrikleri takip etmek için gönüllü olması üzerine nazil olmuştur."
  id: "Pada pagi hari Minggu, tanggal 8 Syawal 3 Hijriah, Nabi menyeru umat Islam untuk mengejar kaum Quraisy, seraya berkata, \"Hanya mereka yang menyaksikan pertempuranlah yang boleh ikut bersama kita.\" Kaum Muslimin menanggapi seruan tersebut meskipun terluka. Mereka sampai di Hamra' al-Asad, delapan mil dari Madinah, dan berkemah. Nabi mengutus Ma'bad bin Abi Ma'bad al-Khuza'i kepada Abu Sufyan, yang melancarkan kampanye perang psikologis terhadapnya di al-Rawha', dengan berkata, \"Muhammad telah keluar dengan pasukan yang belum pernah kulihat sebelumnya, dan mereka sangat marah kepadamu.\" Semangat pasukan Mekah runtuh, dan mereka melanjutkan mundurnya ke Mekah. Abu Sufyan mengirimkan kafilah dari suku 'Abd al-Qays untuk menyampaikan ancaman kepada kaum Muslimin, tetapi hal ini justru meningkatkan iman mereka. Nabi tinggal di Mekah pada hari Senin, Selasa, dan Rabu, kemudian kembali dan mengeksekusi Abu 'Azza al-Jumahi, yang telah melanggar sumpahnya. Telah diriwayatkan secara sahih bahwa ayat, \"Orang-orang yang menanggapi Allah dan Rasul setelah mereka terluka,\" diturunkan mengenai tujuh puluh orang yang secara sukarela mengejar kaum musyrik, di antaranya Abu Bakar dan al-Zubayr."
