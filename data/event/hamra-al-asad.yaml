summary:
  ar: "صباح الأحد الثامن من شوال سنة 3هـ ندب النبي الناس لمتابعة قريش وقال: لا يخرج معنا إلا من شهد القتال. استجاب المسلمون على ما بهم من جراح. بلغوا حمراء الأسد على بعد ثمانية أميال من المدينة فعسكروا. أرسل النبي معبد بن أبي معبد الخزاعي إلى أبي سفيان، فشن عليه حرب أعصاب دعائية بالروحاء: «محمد خرج في جمع لم أر مثله قط يتحرقون عليكم». انهارت عزائم الجيش المكي فواصلوا الانسحاب إلى مكة. أرسل أبو سفيان ركباً من عبد القيس يبلّغ المسلمين تهديداً فلم يزدهم إلا إيماناً. أقام النبي الإثنين والثلاثاء والأربعاء ثم رجع وأعدم أبا عزة الجمحي الذي نكث عهده {cite:mubarakpuri-raheeq p.284}."
