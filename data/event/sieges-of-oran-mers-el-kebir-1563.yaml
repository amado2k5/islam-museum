label: { ar: "حصار وهران والمرسى الكبير (٩٧١هـ/١٥٦٣م)", en: "Siege of Oran and Mers El Kébir (971/1563)" }
summary:
  ar: "خرج حسن بن خير الدين من الجزائر سنة ٩٧١هـ/١٥٦٣م بجيش من خمسة عشر ألف رماة بندقية وألف فارس صباحي تحت أمرة أحمد مقرن الزواوي واثني عشر ألفاً من زواوة وبني عباس، ونقل الأسطول المؤن إلى مستغانم قاعدة العمليات، فضرب الحصار على وهران والمرسى الكبير — آخر ما بقي للأسبان ببلاد الجزائر — في ١٣ أبريل. لكن النجدات الأسبانية والبرتغالية توالت استجابة لنداء الحاكم متخذة من مالطة مركز تجمع، وكان البيلربك على بعد ست مراحل، فرفع حسن الحصار قبل وصول المزيد {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  en: "In 971/1563 Hasan b. Khayr al-Din marched from Algiers with fifteen thousand musketeers, a thousand Sipahi horse under Ahmad Muqran, and twelve thousand Zawawa and Bani Abbas, the fleet carrying supplies to the Mostaganem base; on 13 April he invested Oran and Mers el-Kebir — Spain's last holdings in Algeria. But Spanish and Portuguese relief kept converging in answer to the governor's call, mustering at Malta, with the beylerbey six stages away; Hasan raised the siege before the rest arrived {cite:dawlat-uthmaniyya-salabi p. 250-251}."
