label: { ar: "حصار وهران والمرسى الكبير ⁦(٩٧١هـ/١٥٦٣م)⁩", en: "Siege of Oran and Mers El Kébir (971/1563)", es: "Asedio de Orán y Mers El Kébir (971/1563)", fr: "Siège d'Oran et de Mers El Kébir (971/1563)" }
summary:
  ar: "خرج حسن بن خير الدين من الجزائر سنة ٩٧١هـ/١٥٦٣م بجيش من خمسة عشر ألف رماة بندقية وألف فارس صباحي تحت أمرة أحمد مقرن الزواوي واثني عشر ألفاً من زواوة وبني عباس، ونقل الأسطول المؤن إلى مستغانم قاعدة العمليات، فضرب الحصار على وهران والمرسى الكبير — آخر ما بقي للأسبان ببلاد الجزائر — في ١٣ أبريل. لكن النجدات الأسبانية والبرتغالية توالت استجابة لنداء الحاكم متخذة من مالطة مركز تجمع، وكان البيلربك على بعد ست مراحل، فرفع حسن الحصار قبل وصول المزيد {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  en: "In 971/1563 Hasan b. Khayr al-Din marched from Algiers with fifteen thousand musketeers, a thousand Sipahi horse under Ahmad Muqran, and twelve thousand Zawawa and Bani Abbas, the fleet carrying supplies to the Mostaganem base; on 13 April he invested Oran and Mers el-Kebir — Spain's last holdings in Algeria. But Spanish and Portuguese relief kept converging in answer to the governor's call, mustering at Malta, with the beylerbey six stages away; Hasan raised the siege before the rest arrived {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  es: "En 971/1563, Hasan b. Khayr al-Din marchó desde Argel con quince mil mosqueteros, mil jinetes sipahis al mando de Ahmad Muqran y doce mil zawawas y bani abbás, la flota que transportaba suministros a la base de Mostaganem; el 13 de abril sitió Orán y Mers el-Kebir, las últimas posesiones españolas en Argelia. Pero los refuerzos españoles y portugueses seguían llegando en respuesta al llamado del gobernador, reuniéndose en Malta, con el beylerbey a seis etapas de distancia; Hasan levantó el asedio antes de que llegara el resto {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  fr: "En 971/1563, Hasan ben Khayr al-Din marcha d'Alger avec quinze mille mousquetaires, mille cavaliers sipahis sous le commandement d'Ahmad Muqran, et douze mille Zawawa et Bani Abbas, la flotte transportant des vivres pour la base de Mostaganem. Le 13 avril, il assiégea Oran et Mers el-Kebir, derniers bastions espagnols en Algérie. Mais les renforts espagnols et portugais continuaient d'affluer en réponse à l'appel du gouverneur, se rassemblant à Malte, le beylerbey étant à six étapes de là. Hasan leva le siège avant l'arrivée des autres troupes (voir: Dawlat-Uthmaniyya-Salabi, p. 250-251)."
