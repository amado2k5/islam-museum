label: { ar: "حصار وهران والمرسى الكبير ⁦(٩٧١هـ/١٥٦٣م)⁩", en: "Siege of Oran and Mers El Kébir (971/1563)", es: "Asedio de Orán y Mers El Kébir (971/1563)", fr: "Siège d'Oran et de Mers El Kébir (971/1563)", ur: "اوران اور مرس الکبیر کا محاصرہ (971/1563)", tr: "Oran ve Mers El Kebir Kuşatması (971 Hicri/1563 Miladi)", id: "Pengepungan Oran dan Mers El Kebir (971 H/1563 M)" }
summary:
  ar: "خرج حسن بن خير الدين من الجزائر سنة ٩٧١هـ/١٥٦٣م بجيش من خمسة عشر ألف رماة بندقية وألف فارس صباحي تحت أمرة أحمد مقرن الزواوي واثني عشر ألفاً من زواوة وبني عباس، ونقل الأسطول المؤن إلى مستغانم قاعدة العمليات، فضرب الحصار على وهران والمرسى الكبير — آخر ما بقي للأسبان ببلاد الجزائر — في ١٣ أبريل. لكن النجدات الأسبانية والبرتغالية توالت استجابة لنداء الحاكم متخذة من مالطة مركز تجمع، وكان البيلربك على بعد ست مراحل، فرفع حسن الحصار قبل وصول المزيد {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  en: "In 971/1563 Hasan b. Khayr al-Din marched from Algiers with fifteen thousand musketeers, a thousand Sipahi horse under Ahmad Muqran, and twelve thousand Zawawa and Bani Abbas, the fleet carrying supplies to the Mostaganem base; on 13 April he invested Oran and Mers el-Kebir — Spain's last holdings in Algeria. But Spanish and Portuguese relief kept converging in answer to the governor's call, mustering at Malta, with the beylerbey six stages away; Hasan raised the siege before the rest arrived {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  es: "En 971/1563, Hasan b. Khayr al-Din marchó desde Argel con quince mil mosqueteros, mil jinetes sipahis al mando de Ahmad Muqran y doce mil zawawas y bani abbás, la flota que transportaba suministros a la base de Mostaganem; el 13 de abril sitió Orán y Mers el-Kebir, las últimas posesiones españolas en Argelia. Pero los refuerzos españoles y portugueses seguían llegando en respuesta al llamado del gobernador, reuniéndose en Malta, con el beylerbey a seis etapas de distancia; Hasan levantó el asedio antes de que llegara el resto {cite:dawlat-uthmaniyya-salabi p. 250-251}."
  fr: "En 971/1563, Hasan ben Khayr al-Din marcha d'Alger avec quinze mille mousquetaires, mille cavaliers sipahis sous le commandement d'Ahmad Muqran, et douze mille Zawawa et Bani Abbas, la flotte transportant des vivres pour la base de Mostaganem. Le 13 avril, il assiégea Oran et Mers el-Kebir, derniers bastions espagnols en Algérie. Mais les renforts espagnols et portugais continuaient d'affluer en réponse à l'appel du gouverneur, se rassemblant à Malte, le beylerbey étant à six étapes de là. Hasan leva le siège avant l'arrivée des autres troupes (voir: Dawlat-Uthmaniyya-Salabi, p. 250-251)."
  ur: "971/1563 میں حسن بی۔ خیرالدین نے الجزائر سے پندرہ ہزار مشکیتوں، احمد مقران کے ماتحت ایک ہزار سپاہی گھوڑے، اور بارہ ہزار زاویہ اور بنی عباس کے ساتھ، مستگنیم بیس تک رسد لے جانے والے بحری بیڑے کے ساتھ مارچ کیا۔ 13 اپریل کو اس نے اوران اور مرس الکبیر - الجزائر میں اسپین کی آخری ہولڈنگز کی سرمایہ کاری کی۔ لیکن ہسپانوی اور پرتگالی ریلیف گورنر کی کال کے جواب میں ملتے رہے، مالٹا میں جمع ہوتے رہے، بیلربی چھ مراحل کے فاصلے پر۔ حسن نے باقیوں کے پہنچنے سے پہلے ہی محاصرہ بڑھایا۔ 250-251}۔"
  tr: "Hasan ibn Hayr ed-Din, Hicri 971/Miladi 1563 yılında Ahmed Muqrin el-Zawawi komutasındaki on beş bin tüfekli asker ve bin süvariden oluşan ordusuyla, Zawawa ve Beni Abbas kabilelerinden on iki bin kişiyle birlikte Cezayir'den ayrıldı. Filo, operasyon üssü olan Mostaganem'e erzak taşıdı ve 13 Nisan'da Cezayir'deki son İspanyol kaleleri olan Oran ve Mers El Kébir'i kuşattı. Ancak, valinin çağrısına karşılık olarak, Malta'yı toplanma noktası olarak kullanarak, İspanyol ve Portekiz takviye birlikleri art arda geldi. Beylerbey altı aşama uzaktaydı, bu nedenle Hasan, daha fazla takviye gelmeden önce kuşatmayı kaldırdı. {cite:dawlat-uthmaniyya-salabi s. 250-251}"
  id: "Hassan ibn Khayr ad-Din berangkat dari Aljir pada tahun 971 H/1563 M dengan pasukan yang terdiri dari lima belas ribu penembak jitu dan seribu kavaleri pagi di bawah komando Ahmad Muqrin al-Zawawi, bersama dengan dua belas ribu orang dari suku Zawawa dan Bani Abbas. Armada tersebut mengangkut perbekalan ke Mostaganem, basis operasi, dan mengepung Oran dan Mers El Kébir—benteng Spanyol terakhir yang tersisa di Aljazair—pada tanggal 13 April. Namun, bala bantuan Spanyol dan Portugis tiba secara berturut-turut sebagai tanggapan atas permohonan gubernur, menggunakan Malta sebagai titik berkumpul mereka. Beylerbey berjarak enam tahap, sehingga Hassan menghentikan pengepungan sebelum kedatangan bala bantuan lebih lanjut. {cite:dawlat-uthmaniyya-salabi hlm. 250-251}"
