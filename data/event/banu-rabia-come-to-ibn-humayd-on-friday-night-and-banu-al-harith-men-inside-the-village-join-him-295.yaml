id: event/banu-rabia-come-to-ibn-humayd-on-friday-night-and-banu-al-harith-men-inside-the-village-join-him-295
class: event
kind: other
label:
  ar: "بنو ربيعة يأتون ابن حميد ليلة الجمعة، وبعض بني الحارث داخل القرية يلتحقون به، 295هـ"
  en: "On the night of Friday 23 Dhu al-Hijja 295 AH, Banu Rabi'a come to Ibn Humayd and some Banu al-Harith inside the village agree to join him, pp. 368-369"
  ur: "جمعہ کی رات، 23 ذوالحجہ 295ھ، بنو ربیعہ کا ابن حمید کے پاس آنا اور گاؤں کے اندر کے بنو حارث کے کچھ آدمیوں کا اس کے ساتھ ملنا، ص368-369"
  fr: "La nuit du vendredi 23 Dhu al-Hijja 295 H, les Banu Rabi'a viennent à Ibn Humayd et des Banu al-Harith à l'intérieur du village acceptent de le rejoindre, p. 368-369"
summary:
  ar: "ليلة الجمعة بعث ابن حميد إلى بني ربيعة فحضروا إليه، ووافقه نفر من بني الحارث من بني بشر وبني عمرو كانوا في القرية مع محمد، فأجابوه إلى ما سأل. ولقيهم بنو عبد المدان في الليل، واتفقوا على موضعهم في جانب من القرية."
  en: "On the night of Friday Ibn Humayd sent to Banu Rabi'a, who came to him. Some men of Banu al-Harith, of Banu Bishr and Banu Amr, who were in the village with Muhammad, agreed to his request. Banu Abd al-Madan also met them in the night, and they agreed on their position on one side of the village."
  ur: "جمعہ کی رات ابن حمید نے بنو ربیعہ کو بلایا تو وہ اس کے پاس آ گئے۔ گاؤں میں محمد کے ساتھ موجود بنو حارث کے کچھ آدمی، یعنی بنو بشر اور بنو عمرو کے، اس کی درخواست پر راضی ہو گئے۔ رات کو بنو عبد المدان بھی ان سے ملے، اور انہوں نے گاؤں کے ایک پہلو میں اپنی جگہ پر اتفاق کیا۔"
  fr: "La nuit du vendredi, Ibn Humayd envoya chercher les Banu Rabi'a, qui vinrent à lui. Des hommes des Banu al-Harith, des Banu Bishr et des Banu Amr, qui étaient dans le village avec Muhammad, accédèrent à sa demande. Les Banu Abd al-Madan les rencontrèrent aussi dans la nuit, et ils s'accordèrent sur leur position d'un côté du village."
