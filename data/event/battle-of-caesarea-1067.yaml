summary:
  ar: "بطاقة أولية لوقعة قيصرية سنة ١٠٦٧م، غارة الأتراك السلاجقة على قيصرية فلسطين في زمن ألب أرسلان؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the raid on Caesarea in 1067, the Seljuk Turks' descent on the Palestinian coast under Alp Arslan; its sources are not yet checked on the page."
