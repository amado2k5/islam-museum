  fr: "Projet de fiche pour le raid sur Césarée en 1067, la descente des Turcs seldjoukides sur la côte palestinienne sous Alp Arslan; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1067 میں سیزریا پر چھاپے کے لیے ڈرافٹ کارڈ، الپ ارسلان کے تحت فلسطینی ساحل پر سلجوک ترکوں کی نسل؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Alp Arslan döneminde Selçuklu Türklerinin Filistin'deki Caesarea'ya düzenlediği baskını konu alan, MS 1067'deki Caesarea Muharebesi'ne ait ön taslak kart; kaynaklar henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Pertempuran Caesarea pada tahun 1067 M, serangan Turki Seljuk ke Caesarea di Palestina pada masa Alp Arslan; sumbernya belum ditinjau di halaman ini."
