summary:
  ar: "بطاقة أولية لاسترداد تشينغ لشينجيانغ من ١٨٧٦ إلى ١٨٧٨م، حملة تسو تسونغ تانغ على دولة يعقوب بيك؛ لم تُراجع مصادره على الصفحة بعد."
