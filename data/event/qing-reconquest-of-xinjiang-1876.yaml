  fr: "Projet de fiche pour la reconquête du Xinjiang par les Qing (1876-1878), campagne de Zuo Zongtang contre l'État de Yaqub Beg; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1876-1878 کے سنکیانگ کی چنگ کی دوبارہ فتح کے لیے ڈرافٹ کارڈ، یعقوب بیگ کی ریاست کے خلاف زوو زونگٹانگ کی مہم؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1876-1878 yılları arasında gerçekleşen Qing Hanedanlığı'nın Sincan'ı yeniden ele geçirme harekatının ön hazırlık kartı, Tsu Zongtang'ın Yakup Beg devletine karşı yürüttüğü seferi göstermektedir; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Peta pendahuluan tentang penaklukan kembali Xinjiang oleh Dinasti Qing dari tahun 1876 hingga 1878 M, kampanye Tsu Zongtang melawan negara Jacob Beg; sumber-sumber di halaman ini belum ditinjau."
