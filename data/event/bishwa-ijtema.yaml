  note: The first Tablighi Jamaat ijtema in what is now Bangladesh was held at Kakrail Mosque in 1946; the movement's gatherings
    ran from 1954 (Chittagong), and the event moved to Tongi in 1967 and took the name Bishwa Ijtema; the article's infobox
    dates the Bishwa Ijtema from 1969. The Hijri year is converter-derived.
