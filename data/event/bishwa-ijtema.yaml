id: event/bishwa-ijtema
class: event
kind: gathering
label:
  ar: الاجتماع العالمي ⁦(بشوا اجتماع)⁩
  en: Bishwa Ijtema
  ur: بشوا اجتماع ⁦(عالمی تبلیغی اجتماع)⁩
summary:
  ar: الاجتماع السنوي الذي ينظمه فرع جماعة التبليغ في بنغلاديش على ضفة نهر توراغ في تونغي شمال دكا منذ 1967، ثلاثة أيام من
    الصلاة والبيان تختم بالدعاء الختامي \u2066(آخري مناجات)\u2069؛ قُدّر حضوره بمليونين في 2001 وبأربعة ملايين في 2023، ويُعقد على مرحلتين
    منذ 2010 لكثرة الحضور.
  en: 'The annual gathering held by the Bangladeshi branch of the Tablighi Jamaat on the bank of the Turag at Tongi, north
    of Dhaka, since 1967: three days of prayer and talks closing with the final supplication (Akheri Munajat); attendance
    was estimated at 2 million in 2001 and 4 million in 2023, and it has been held in two phases since 2010 because of the
    crowds.'
  ur: 'تبلیغی جماعت کی بنگلہ دیش شاخ کا سالانہ اجتماع جو 1967 سے ڈھاکہ کے شمال میں تونگی میں دریائے توراغ کے کنارے ہوتا ہے:
    تین دن نماز اور بیانات، اور آخر میں «آخری مناجات»؛ حاضری کا اندازہ 2001 میں 20 لاکھ اور 2023 میں 40 لاکھ لگایا گیا، اور
    ہجوم کی وجہ سے 2010 سے یہ دو مرحلوں میں ہوتا ہے۔'
