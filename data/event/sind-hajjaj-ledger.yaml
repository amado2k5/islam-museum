label: { ar: "حساب الحجاج في غزو السند وما بعد داهر", en: "al-Hajjaj's Sind Ledger and the Conquests after Dahir", es: "El Libro de Cuentas de Sind de al-Hajjaj y las conquistas posteriores a Dahir", fr: "Le registre du Sind d'al-Hajjaj et les conquêtes après Dahir", ur: "الحجاج کا سندھ لیجر اور داہر کے بعد فتوحات", tr: "Sindh'in fethi ve Dahir'den sonraki hacıların öyküsü", id: "Kisah para peziarah dalam penaklukan Sindh dan setelah Dahir" }
summary:
  ar: "نظر الحجاج فإذا هو قد أنفق على محمد بن القاسم ستين ألف ألف ووجد ما حمل إليه عشرين ومائة ألف ألف فقال شفينا غيظنا وأدركنا ثأرنا وازددنا ستين ألف ألف درهم ورأس داهر ومات الحجاج فأتى محمداً وفاته فرجع عن الملتان إلى الرور وبغرور وكان قد فتحها فأعطى الناس ووجه إلى البيلمان جيشاً فلم يقاتلوا وأعطوا الطاعة وسالمه أهل سرسنت وهي مغزى أهل البصرة اليوم وأهلها الميد الذي يقطعون في الحر ثم أتى محمد الكيرج فخرج إليه دوهر فقاتله فانهزم العدو وهرب دوهر ويقال قتل ونزل أهل المدينة على حكم محمد فقتل وسبى وقال الشاعر نحن قتلنا داهراً ودوهراً والخيل تردي منسراً فمنسراً."
  en: "al-Hajjaj totted it up: sixty million spent on Muhammad ibn al-Qasim against a hundred and twenty million gained — 'we have sated our wrath, taken our revenge, gained sixty million dirhams — and Dahir's head'. Al-Hajjaj died while Muhammad fought on; back at al-Rur he gave stipends, took al-Baylaman's unresisted submission and Sursant's peace — today's Basran resort — then al-Kiraj, where Dahir's son Duhar sallied, fled or fell, and the city came down on terms amid killing and captives: 'we killed Dahir and Duhar, and horse fells knight after knight'."
  es: "Al-Hajjaj hizo cuentas: sesenta millones gastados en Muhammad ibn al-Qasim frente a ciento veinte millones ganados: «Hemos saciado nuestra ira, nos hemos vengado, hemos ganado sesenta millones de dirhams y la cabeza de Dahir». Al-Hajjaj murió mientras Muhammad seguía luchando; de vuelta en al-Rur, repartió estipendios, aceptó la sumisión sin resistencia de al-Baylaman y la paz de Sursant —el actual balneario de Basora—, y luego al-Kiraj, donde Duhar, hijo de Dahir, salió, huyó o cayó, y la ciudad se rindió en medio de matanzas y prisioneros: «Hemos matado a Dahir y a Duhar, y el caballo ha caído caballero tras caballero»."
  fr: "Al-Hajjaj fit le bilan: soixante millions dépensés pour Muhammad ibn al-Qasim contre cent vingt millions gagnés – « Nous avons assouvi notre colère, pris notre revanche, gagné soixante millions de dirhams – et la tête de Dahir ». Al-Hajjaj mourut tandis que Muhammad continuait le combat; de retour à al-Rur, il versa des pensions, obtint la soumission sans résistance d'al-Baylaman et la paix de Sursant – l'actuelle station balnéaire de Bassorah – puis al-Kiraj, où le fils de Dahir, Duhar, fit une sortie, s'enfuit ou périt, et la ville se soumit à ses conditions dans un bain de sang et de captivité: « Nous avons tué Dahir et Duhar, et les chevaux abattent chevalier après chevalier »."
  ur: "الحجاج نے اس کا خلاصہ کیا: محمد بن القاسم پر ساٹھ ملین خرچ ہوئے ایک سو بیس ملین حاصل ہوئے - 'ہم نے اپنا غضب ٹھنڈا کیا، اپنا بدلہ لیا، ساٹھ ملین درہم حاصل کیے - اور داہر کا سر'۔ الحجاج کی موت اس وقت ہوئی جب محمد لڑ رہے تھے۔ الرور میں واپس اس نے وظیفہ دیا، البیلاماں کی غیر مزاحمتی تابعداری اور سرسانت کا امن لیا - آج کا بسران سیرگاہ - پھر الکراج، جہاں داہر کا بیٹا دہر حملہ آور ہوا، بھاگ گیا یا گر گیا، اور شہر قتل و غارت اور قیدیوں کے درمیان شرائط پر اتر آیا: 'ہم نے داہر اور دہر کو مار ڈالا، اور رات کے بعد گھوڑے گرے۔'"
  tr: "Haccac baktı ve Muhammed bin el-Kasım'a altmış milyon bin dirhem harcadığını, kendisine yirmi milyon yüz bin dirhem getirildiğini gördü. \"Öfkemizi dindirdik, intikamımızı aldık, altmış milyon bin dirhem kazandık ve Dahir'in başını aldık\" dedi. Haccac öldü, Muhammed'in yanına geldi ve o da öldü. Bunun üzerine Multan'dan El-Rur ve Baghrur'a döndü ve oraları fethetti. Halkına verdi ve El-Bilman'a bir ordu gönderdi, ancak onlar savaşmadılar ve itaat ettiler. Sarsant halkı onunla barıştı ve bu, bugün Basra halkının baskınına ve halkına karşı savaşanlardır. Sonra Muhammed El-Kirj'e geldi, Dahir ona karşı çıktı ve onunla savaştı, düşman yenildi ve Dahir kaçtı. Öldürüldüğü söyleniyor. Medine halkı Muhammed'in yönetimine boyun eğdi, o da öldürdü ve esir aldı. Şair şöyle dedi: \"Dahir'i ve Dahir'i öldürdük ve atlar birbiri ardına yere yığılıyor.\""
  id: "Al-Hajjaj melihat dan mendapati bahwa ia telah menghabiskan enam puluh juta ribu dirham untuk Muhammad bin Al-Qasim dan mendapati bahwa apa yang dibawa kepadanya adalah dua puluh juta seratus ribu dirham. Ia berkata, “Kita telah memuaskan amarah kita dan mencapai pembalasan kita serta menambah enam puluh juta ribu dirham dan kepala Dahir.” Al-Hajjaj meninggal, lalu ia datang kepada Muhammad dan Muhammad pun meninggal, kemudian ia kembali dari Multan ke Al-Rur dan Baghrur, dan ia telah menaklukkannya, lalu ia memberikannya kepada rakyat dan mengirimkan pasukan ke Al-Bilman, tetapi mereka tidak berperang dan memberikan ketaatan. Penduduk Sarsant berdamai dengannya, dan sekarang terjadi penyerbuan oleh penduduk Basra, dan penduduknya adalah orang-orang yang berjuang dalam panasnya pertempuran. Kemudian Muhammad datang ke Al-Kirj, lalu Dahir keluar dan melawannya, sehingga musuh dikalahkan dan Dahir melarikan diri, dan dikatakan bahwa ia terbunuh, dan penduduk Madinah tunduk kepada pemerintahan Muhammad, lalu ia membunuh dan menawan banyak orang. Sang penyair berkata, “Kami membunuh Dahir dan Dahir, dan kuda-kuda itu berjatuhan satu demi satu.”"
