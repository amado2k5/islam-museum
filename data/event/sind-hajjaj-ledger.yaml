label: { ar: "حساب الحجاج في غزو السند وما بعد داهر", en: "al-Hajjaj's Sind Ledger and the Conquests after Dahir", es: "El Libro de Cuentas de Sind de al-Hajjaj y las conquistas posteriores a Dahir", fr: "Le registre du Sind d'al-Hajjaj et les conquêtes après Dahir" }
summary:
  ar: "نظر الحجاج فإذا هو قد أنفق على محمد بن القاسم ستين ألف ألف ووجد ما حمل إليه عشرين ومائة ألف ألف فقال شفينا غيظنا وأدركنا ثأرنا وازددنا ستين ألف ألف درهم ورأس داهر ومات الحجاج فأتى محمداً وفاته فرجع عن الملتان إلى الرور وبغرور وكان قد فتحها فأعطى الناس ووجه إلى البيلمان جيشاً فلم يقاتلوا وأعطوا الطاعة وسالمه أهل سرسنت وهي مغزى أهل البصرة اليوم وأهلها الميد الذي يقطعون في الحر ثم أتى محمد الكيرج فخرج إليه دوهر فقاتله فانهزم العدو وهرب دوهر ويقال قتل ونزل أهل المدينة على حكم محمد فقتل وسبى وقال الشاعر نحن قتلنا داهراً ودوهراً والخيل تردي منسراً فمنسراً."
  en: "al-Hajjaj totted it up: sixty million spent on Muhammad ibn al-Qasim against a hundred and twenty million gained — 'we have sated our wrath, taken our revenge, gained sixty million dirhams — and Dahir's head'. Al-Hajjaj died while Muhammad fought on; back at al-Rur he gave stipends, took al-Baylaman's unresisted submission and Sursant's peace — today's Basran resort — then al-Kiraj, where Dahir's son Duhar sallied, fled or fell, and the city came down on terms amid killing and captives: 'we killed Dahir and Duhar, and horse fells knight after knight'."
  es: "Al-Hajjaj hizo cuentas: sesenta millones gastados en Muhammad ibn al-Qasim frente a ciento veinte millones ganados: «Hemos saciado nuestra ira, nos hemos vengado, hemos ganado sesenta millones de dirhams y la cabeza de Dahir». Al-Hajjaj murió mientras Muhammad seguía luchando; de vuelta en al-Rur, repartió estipendios, aceptó la sumisión sin resistencia de al-Baylaman y la paz de Sursant —el actual balneario de Basora—, y luego al-Kiraj, donde Duhar, hijo de Dahir, salió, huyó o cayó, y la ciudad se rindió en medio de matanzas y prisioneros: «Hemos matado a Dahir y a Duhar, y el caballo ha caído caballero tras caballero»."
  fr: "Al-Hajjaj fit le bilan: soixante millions dépensés pour Muhammad ibn al-Qasim contre cent vingt millions gagnés – « Nous avons assouvi notre colère, pris notre revanche, gagné soixante millions de dirhams – et la tête de Dahir ». Al-Hajjaj mourut tandis que Muhammad continuait le combat; de retour à al-Rur, il versa des pensions, obtint la soumission sans résistance d'al-Baylaman et la paix de Sursant – l'actuelle station balnéaire de Bassorah – puis al-Kiraj, où le fils de Dahir, Duhar, fit une sortie, s'enfuit ou périt, et la ville se soumit à ses conditions dans un bain de sang et de captivité: « Nous avons tué Dahir et Duhar, et les chevaux abattent chevalier après chevalier »."
