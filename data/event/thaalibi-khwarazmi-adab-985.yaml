label:
  ar: "الثعالبي يقرأ الأدب على أبي بكر الخوارزمي، نحو ٣٧٥هـ"
  en: "Al-Tha'alibi studies adab under Abu Bakr al-Khwarazmi, c. 375/985"
  ur: "ثعالبی ابو بکر خوارزمی سے ادب پڑھتے ہیں، تقریباً 375ھ/985ء"
summary:
  ar: "قرأ الثعالبي الأدب في شبابه بنيسابور على الأديب المشهور أبي بكر الخوارزمي، ابن أخت الطبري وصاحب ديوان الرسائل، وذلك قبل وفاة شيخه سنة ٣٨٣هـ {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}."
  en: "In his youth at Nishapur al-Tha'alibi studied adab under the celebrated stylist Abu Bakr al-Khwarazmi — al-Tabari's nephew and author of a famous diwan of rasa'il — before the master's death in 383 AH {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}."
  ur: "جوانی میں ثعالبی نے نیشاپور میں مشہور ادیب ابو بکر خوارزمی — طبری کے بھانجے اور مشہور رسائل کے صاحب — سے ادب کی تعلیم حاصل کی، اپنے استاد کی وفات 383ھ سے پہلے {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}۔"
