label:
  ar: وفاة الغزالي ودفنه بالطابران
  en: Death and burial of al-Ghazali at al-Tabaran
  ur: طابران میں غزالی کی وفات اور تدفین
summary:
  ar: توفي أبو حامد الغزالي يوم الاثنين رابع عشر جمادى الآخرة سنة 505هـ وله خمس وخمسون سنة {cite:siyar-alam-nubala scan vol. 1 p. 3681}. ودُفن بمقبرة الطابران وهي قصبة بلاد طوس {cite:tarikh-islam-dhahabi vol. 38 p. 126}. وينقل الذهبي عن ابن النجار أن أباه أوصى عند احتضاره بولديه محمد وأحمد إلى صديق صوفي صالح {cite:tarikh-islam-dhahabi vol. 38 p. 126}. أما خبر الوضوء والكفن عن أخيه أحمد برواية ابن الجوزي فلم يوجد في المسوح المقروءة.
  en: Abu Hamid al-Ghazali died on Monday, 14 Jumada II 505 AH, aged fifty-five {cite:siyar-alam-nubala scan vol. 1 p. 3681}. He was buried in the cemetery of al-Tabaran, a town of the land of Tus {cite:tarikh-islam-dhahabi vol. 38 p. 126}. Al-Dhahabi relays from Ibn al-Najjar that his father, when dying, entrusted his sons Muhammad and Ahmad to a righteous Sufi friend {cite:tarikh-islam-dhahabi vol. 38 p. 126}. The report of the ablution and shroud from his brother Ahmad, on Ibn al-Jawzi's authority, was not found in the scans read.
  ur: ابو حامد غزالی پیر کے دن 14 جمادی الآخرہ 505ھ کو پچپن برس کی عمر میں فوت ہوئے {cite:siyar-alam-nubala scan vol. 1 p. 3681}۔ وہ طابران کے قبرستان میں دفن ہوئے جو طوس کا ایک قصبہ ہے {cite:tarikh-islam-dhahabi vol. 38 p. 126}۔ ذہبی ابن النجار سے نقل کرتے ہیں کہ ان کے والد نے نزع کے وقت اپنے بیٹوں محمد اور احمد کو ایک نیک صوفی دوست کے سپرد کیا {cite:tarikh-islam-dhahabi vol. 38 p. 126}۔ ابن الجوزی کی روایت سے بھائی احمد کی وضو اور کفن والی خبر پڑھے گئے سکین میں نہیں ملی۔
