label:
  ar: وفاة الغزالي ودفنه بالطابران
  en: Death and burial of al-Ghazali at al-Tabaran
  ur: طابران میں غزالی کی وفات اور تدفین
  es: "Muerte y entierro de al-Ghazali en al-Tabaran."
  fr: "Mort et inhumation d'al-Ghazali à al-Tabaran"
  tr: "Gazali'nin ölümü ve Tabaran'da defnedilmesi."
  id: "Kematian dan pemakaman Al-Ghazali di Tabaran"
summary:
  ar: توفي أبو حامد الغزالي يوم الاثنين رابع عشر جمادى الآخرة سنة 505هـ وله خمس وخمسون سنة {cite:siyar-alam-nubala scan vol. 1 p. 3681}. ودُفن بمقبرة الطابران وهي قصبة بلاد طوس {cite:tarikh-islam-dhahabi vol. 38 p. 126}. وينقل الذهبي عن ابن النجار أن أباه أوصى عند احتضاره بولديه محمد وأحمد إلى صديق صوفي صالح {cite:tarikh-islam-dhahabi vol. 38 p. 126}. أما خبر الوضوء والكفن عن أخيه أحمد برواية ابن الجوزي فلم يوجد في المسوح المقروءة.
  en: Abu Hamid al-Ghazali died on Monday, 14 Jumada II 505 AH, aged fifty-five {cite:siyar-alam-nubala scan vol. 1 p. 3681}. He was buried in the cemetery of al-Tabaran, a town of the land of Tus {cite:tarikh-islam-dhahabi vol. 38 p. 126}. Al-Dhahabi relays from Ibn al-Najjar that his father, when dying, entrusted his sons Muhammad and Ahmad to a righteous Sufi friend {cite:tarikh-islam-dhahabi vol. 38 p. 126}. The report of the ablution and shroud from his brother Ahmad, on Ibn al-Jawzi's authority, was not found in the scans read.
  ur: ابو حامد غزالی پیر کے دن 14 جمادی الآخرہ 505ھ کو پچپن برس کی عمر میں فوت ہوئے {cite:siyar-alam-nubala scan vol. 1 p. 3681}۔ وہ طابران کے قبرستان میں دفن ہوئے جو طوس کا ایک قصبہ ہے {cite:tarikh-islam-dhahabi vol. 38 p. 126}۔ ذہبی ابن النجار سے نقل کرتے ہیں کہ ان کے والد نے نزع کے وقت اپنے بیٹوں محمد اور احمد کو ایک نیک صوفی دوست کے سپرد کیا {cite:tarikh-islam-dhahabi vol. 38 p. 126}۔ ابن الجوزی کی روایت سے بھائی احمد کی وضو اور کفن والی خبر پڑھے گئے سکین میں نہیں ملی۔
  es: "Abu Hamid al-Ghazali murió el lunes 14 de Jumada II 505 AH, a la edad de cincuenta y cinco años {cite:siyar-alam-nubala scan vol. 1 p. 3681}. Fue enterrado en el cementerio de al-Tabaran, una ciudad de la tierra de Tus {cite:tarikh-islam-dhahabi vol. 38 p. 126}. Al-Dhahabi relata de Ibn al-Najjar que su padre, al morir, confió a sus hijos Muhammad y Ahmad a un amigo sufí justo {cite:tarikh-islam-dhahabi vol. 38 p. 126}. El informe de la ablución y la mortaja de su hermano Ahmad, según la autoridad de Ibn al-Jawzi, no se encontró en los escaneos leídos."
  fr: "Abou Hamid al-Ghazali mourut le lundi 14 Jumada II 505 AH, à l'âge de cinquante-cinq ans (source: Siyar-Alam-Nubala, vol. 1, p. 3681). Il fut inhumé au cimetière d'al-Tabaran, ville du pays de Tus (source: Tarikh-Islam-Dhahabi, vol. 38, p. 126). Al-Dhahabi rapporte d'après Ibn al-Najjar que son père, sur son lit de mort, confia ses fils Muhammad et Ahmad à un ami soufi pieux (source: Tarikh-Islam-Dhahabi, vol. 38, p. 126). Le récit des ablutions et du linceul de son frère Ahmad, rapporté par Ibn al-Jawzi, n'a pas été retrouvé dans les manuscrits consultés."
  tr: "Ebu Hamid el-Gazali, Hicri 505 yılının Cemadi el-Ahiret ayının on dördüncü Pazartesi günü, elli beş yaşında vefat etti. Tus'un başkenti Taberan'daki mezarlığa defnedildi. El-Dhahabi, İbn el-Necar'dan rivayetle, babasının ölüm döşeğinde iki oğlu Muhammed ve Ahmed'i salih bir Sufi dostuna emanet ettiğini bildirir. İbn el-Cevzi'nin rivayet ettiği, kardeşi Ahmed'in abdesti ve kefenlenmesiyle ilgili anlatım, hadis külliyatlarında bulunmamaktadır."
  id: "Abu Hamid al-Ghazali wafat pada hari Senin, tanggal empat belas Jumada al-Akhirah, 505 H, pada usia lima puluh lima tahun. Ia dimakamkan di pemakaman Tabaran, ibu kota Tus. Al-Dhahabi meriwayatkan dari Ibn al-Najjar bahwa ayahnya, di ranjang kematiannya, mempercayakan kedua putranya, Muhammad dan Ahmad, kepada seorang sahabat Sufi yang saleh. Kisah tentang wudhu dan kain kafan saudaranya Ahmad, sebagaimana diriwayatkan oleh Ibn al-Jawzi, tidak ditemukan dalam kumpulan hadits kanonik."
