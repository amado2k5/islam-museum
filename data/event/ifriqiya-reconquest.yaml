summary:
  ar: "انتقاض إفريقية: أرسل هرقل بطريقًا له إلى أهلها يأخذ منهم مثل ما أخذ المسلمون فأبوا وقالوا نؤدي ما كان يؤخذ منا وقد كان ينبغي له أن يسامحنا لما ناله المسلمون منا، فنزل البطريق قرطاجنة وجمع أهل إفريقية. وسيّر معاوية مع البطريق المطرود معاوية بن حديج السكوني فمضى إلى إفريقية وهي نار تضطرّم فنزل قمونية وأرسل البطريق إليه ثلاثين ألف مقاتل فقاتلوهم فانهزمت الروم واستولى ابن حديج على إفريقية {cite:kamil-ibn-al-athir p. 460}."
  en: "Ifriqiya rose: Heraclius's patrician landed at Carthage to reclaim the old tribute, and the Ifriqiyans answered «we pay what was always taken from us — he should have excused us after what the Muslims took.« Mu'awiya ibn Hudayj al-Sakuni marched into a burning land, camped at Qamuniya, and when the patrician hurled thirty thousand at him the Romans broke and Ibn Hudayj held Ifriqiya {cite:kamil-ibn-al-athir p. 460}."
