summary:
  ar: "فارق غياث الدين محمد صاحب غزنة وبعض خراسان مذهب الكرامية، وكان هو وأهل بيته قد دانوا به دهرًا حتى صار يعرف بهم، ثم هداه الله إلى مذهب السنة فصار يأمر بقتل الكرامية ويطردهم من بلاده {cite:kamil-ibn-al-athir p. 264}."
  en: "Ghiyath al-Din Muhammad, lord of Ghazna and half of Khurasan, quit the Karramiyya — the creed his house had long carried till they were known by it — for the Sunna, then drove the Karramis from his lands and ordered them killed {cite:kamil-ibn-al-athir p. 264}."
  es: "Ghiyath al-Din Muhammad, señor de Ghazna y de la mitad de Jorasán, abandonó la Karramiyya —el credo que su casa había mantenido durante mucho tiempo hasta que fueron conocidos por él— para adoptar la Sunna, luego expulsó a los Karramis de sus tierras y ordenó que los mataran {cite:kamil-ibn-al-athir p. 264}."
  fr: "Ghiyath al-Din Muhammad, seigneur de Ghazna et de la moitié du Khorasan, quitta la Karramiyya — la croyance que sa maison avait longtemps pratiquée jusqu'à ce qu'elle soit connue sous ce nom — pour la Sunna, puis chassa les Karramis de ses terres et ordonna qu'ils soient tués {cite:kamil-ibn-al-athir p. 264}."
  ur: "غیاث الدین محمد، غزنہ اور آدھے خراسان کے سردار، نے کرامیہ کو چھوڑ دیا - جو اس کے گھر والوں نے طویل عرصے تک چلایا تھا یہاں تک کہ وہ اس سے واقف تھے - سنت کے لیے، پھر کرمیوں کو ان کی سرزمین سے نکال دیا اور انہیں قتل کرنے کا حکم دیا۔ 264}۔"
