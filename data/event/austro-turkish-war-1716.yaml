  id: "Catatan pendahuluan tentang Perang Ottoman-Austria tahun 1716-1718 M, Perang Eugene dari Savoy yang berakhir dengan Perdamaian Pasarovich; sumber-sumbernya belum ditinjau di halaman ini."
