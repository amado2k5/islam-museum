summary:
  ar: "بطاقة أولية للحرب العثمانية النمساوية من ١٧١٦ إلى ١٧١٨م، حرب يوجين السافوي التي انتهت بصلح باساروفيتش؛ لم تُراجع مصادرها على الصفحة بعد."
