id: event/utba-offer
class: event
kind: council
label: { en: "Utba ibn Rabi'a's offer to the Prophet", ar: "مساومة عتبة بن ربيعة", es: "La oferta de Utba ibn Rabi'a al Profeta", fr: "L'offre d'Utba ibn Rabi'a au Prophète", ur: "عتبہ بن ربیعہ کی نبی کو پیشکش", tr: "Utbe ibn Rabi'ah'ın pazarlığı", id: "Tawar-menawar Utbah bin Rabi'ah" }
summary:
  en: "After the conversions of Hamza and Umar, Utba ibn Rabi'a volunteered to offer Muhammad wealth, leadership and kingship if he would abandon his call; the Prophet listened to the end, then recited the opening of sura Fussilat down to its prostration, and Utba went back urging Quraysh to leave the man be."
  ar: "بعد إسلام حمزة وعمر قام عتبة بن ربيعة يعرض على النبي المال والسيادة والملك والطب إن كف عن دعوته؛ فاستمع له النبي حتى فرغ ثم قرأ عليه صدر سورة فصلت إلى سجدتها، فعاد عتبة إلى قريش يوصيهم بخلّي بين الرجل وما هو فيه."
  es: "Tras las conversiones de Hamza y Umar, Utba ibn Rabi'a se ofreció a ofrecerle a Mahoma riqueza, liderazgo y la realeza si abandonaba su llamado; el Profeta escuchó hasta el final, luego recitó el comienzo de la sura Fussilat hasta su postración, y Utba regresó instando a los Quraysh a que dejaran en paz a aquel hombre."
  fr: "Après les conversions de Hamza et d'Umar, Utba ibn Rabi'a proposa à Muhammad la richesse, le pouvoir et la royauté s'il renonçait à son appel; le Prophète écouta jusqu'au bout, puis récita le début de la sourate Fussilat jusqu'à sa prosternation, et Utba retourna en exhortant les Quraysh à laisser l'homme tranquille."
  ur: "حمزہ اور عمر کی تبدیلی کے بعد، عتبہ بن ربیعہ نے رضاکارانہ طور پر محمد کو دولت، قیادت اور بادشاہی کی پیشکش کی اگر وہ اپنی دعوت کو ترک کر دیں؛ نبی نے آخر کو سنا، پھر سجدے میں سورہ فصیلات کی تلاوت کی، اور عتبہ قریش سے اس آدمی کو چھوڑنے کی تاکید کرتے ہوئے واپس چلا گیا۔"
  tr: "Hamza ve Ömer İslamiyet'i kabul ettikten sonra, Utbe ibn Rabi'ah, Peygamber'e, eğer bu çağrıyı bırakırsa para, egemenlik, krallık ve ilaç teklif etti. Peygamber, adam konuşmasını bitirene kadar onu dinledi, sonra ona Fussilat Suresi'nin başlangıcından secdeye kadar olan kısmını okudu. Utbe, Kureyş'e dönerek, adamı yaptığı şeyle baş başa bırakmalarını tavsiye etti."
  id: "Setelah Hamza dan Omar masuk Islam, Utbah bin Rabi’ah menawarkan uang, kekuasaan, kerajaan, dan obat-obatan kepada Nabi jika beliau mau menghentikan seruannya. Nabi mendengarkannya sampai selesai, kemudian beliau membacakan kepadanya bagian awal Surat Fussilat hingga sujudnya. Utbah kembali kepada kaum Quraisy, menasihati mereka untuk membiarkan orang itu melakukan apa yang sedang dilakukannya."
