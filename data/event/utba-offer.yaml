label: { en: "Utba ibn Rabi'a's offer to the Prophet", ar: "مساومة عتبة بن ربيعة" }
summary:
  en: "After the conversions of Hamza and Umar, Utba ibn Rabi'a volunteered to offer Muhammad wealth, leadership and kingship if he would abandon his call; the Prophet listened to the end, then recited the opening of sura Fussilat down to its prostration, and Utba went back urging Quraysh to leave the man be."
  ar: "بعد إسلام حمزة وعمر قام عتبة بن ربيعة يعرض على النبي المال والسيادة والملك والطب إن كف عن دعوته؛ فاستمع له النبي حتى فرغ ثم قرأ عليه صدر سورة فصلت إلى سجدتها، فعاد عتبة إلى قريش يوصيهم بخلّي بين الرجل وما هو فيه."
