id: "event/hasan-ibn-ahmad-dies-at-alaf-in-dhu-al-qadah-327-ah-and-is-buried-there"
class: event
kind: other
label:
  ar: "يموت الحسن بن أحمد في علاف في ذي القعدة سنة 327هـ ويدفن بها، ص414"
  en: "Al-Hasan ibn Ahmad dies at Alaf in Dhu al-Qa'da 327 AH and is buried there, p. 414"
  ur: "حسن بن احمد ذوالقعدہ 327ھ میں علاف میں وفات پاتے ہیں اور وہیں دفن ہوتے ہیں، ص414"
  es: "Al-Hasan ibn Ahmad muere en Alaf en Dhu al-Qa'da 327 AH y es enterrado allí, pág. 414"
  fr: "Al-Hasan ibn Ahmad meurt à Alaf en Dhu al-Qa'da 327 AH et y est enterré, p. 414"
  tr: "Hasan ibn Ahmed, Hicri 327 yılında Zilhicce ayında Elaf'ta vefat etmiş ve orada defnedilmiştir (s. 414)."
  id: "Al-Hasan ibn Ahmad wafat di Allaf pada bulan Dzul Qi'dah tahun 327 Hijriah dan dimakamkan di sana, hlm. 414"
summary:
  ar: "يمرض الحسن بن أحمد في علاف، ويتوفى يوم الخميس لإحدى عشرة ليلة خلت من ذي القعدة سنة 327هـ، ويدفن بعلاف."
  en: "Al-Hasan ibn Ahmad falls ill at Alaf and dies on Thursday, eleven nights into Dhu al-Qa'da 327 AH. He is buried at Alaf."
  ur: "حسن بن احمد علاف میں بیمار ہوتے ہیں اور ذوالقعدہ 327ھ کی گیارہ راتیں گزرنے پر جمعرات کو وفات پاتے ہیں، اور علاف میں دفن ہوتے ہیں۔"
  es: "Al-Hasan ibn Ahmad enferma en Alaf y fallece el jueves, once noches después del inicio de Dhu al-Qa'da del año 327 de la Hégira. Es enterrado en Alaf."
  fr: "Al-Hasan ibn Ahmad tombe malade à Alaf et meurt le jeudi 11 Dhu al-Qa'da 327 AH. Il est enterré à Alaf."
  tr: "Hasan ibn Ahmed, Allah'ta hastalandı ve Hicri 327 yılında Zilhicce ayının bitimine on bir gece kala Perşembe günü vefat etti ve Allah'a defnedildi."
  id: "Al-Hasan ibn Ahmad jatuh sakit di Allaf, dan meninggal pada hari Kamis, sebelas malam sebelum berakhirnya Dzul Qi'dah tahun 327 Hijriah, dan dimakamkan di Allaf."
