label:
  ar: "حجة السخاوي ٨٩٦هـ واستقراره الأخير في المدينة، ١٤٩١م"
  en: "Al-Sakhawi's hajj of 896 and final settling in Medina, 1491"
  ur: "سخاوی کا حج 896ھ اور مدینہ میں آخری سکونت، 1491ء"
  es: "La peregrinación de Al-Sakhawi en 896 y su establecimiento definitivo en Medina en 1491."
  fr: "Le pèlerinage d'Al-Sakhawi en 896 et son installation définitive à Médine en 1491"
  tr: "Hacı Sakhavi'nin Hicri 896 yılında ve Medine'ye nihai yerleşmesinin ardından yaşadığı dönem, Miladi 1491."
  id: "Haji al-Sakhawi 896 H dan pemukiman terakhirnya di Madinah, 1491 M"
summary:
  ar: "حج السخاوي في سنة ست وتسعين ⁦(٨٩٦هـ/١٤٩١م)⁩ ثم جاور بمكة إلى أثناء سنة ثمان وتسعين، فتوجه إلى المدينة النبوية فأقام بها أشهراً وصام بها رمضان ٨٩٨هـ، ثم عاد في شوالها إلى مكة؛ وجاور بالحرمين إلى أن مات، يعمل الناس من أهلهما والقادمين عليهما عنه رواية ودراية ويأخذون من تصانيفه {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}. وفي سنواته الأخيرة أتم هناك عدة من نصوصه ودرب الطلبة على نقل الحديث {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  en: "In 896/1491 al-Sakhawi made the hajj and sojourned in Mecca until mid-898, when he moved to Medina, stayed months and fasted Ramadan 898 there, then returned to Mecca in its Shawwal; he remained a resident of the two sanctuaries until his death, the people of both cities and their visitors transmitting from him and collecting his works {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}. In his final years he completed or refined several texts there and trained students in hadith transmission {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  ur: "896ھ/1491ء میں سخاوی نے حج کیا اور 898ھ کے وسط تک مکہ میں مجاور رہا، پھر مدینہ منتقل ہوا جہاں کئی ماہ قیام اور 898ھ کا رمضان وہیں روزے رکھے، اور اسی سال شوال میں مکہ لوٹا؛ وہ حرمین کا مقیم رہا یہاں تک کہ فوت ہوا، دونوں شہروں کے لوگ اور آنے والے اس سے روایت اور درایت اخذ کرتے اور اس کی تصانیف جمع کرتے {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}۔ آخری برسوں میں اس نے وہاں کئی متون مکمل یا بہتر کیے اور طلبہ کو حدیث کی نقل کی تربیت دی {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}۔"
  es: "En 896/1491, al-Sakhawi realizó el Hajj y residió en La Meca hasta mediados de 898, cuando se trasladó a Medina, donde permaneció varios meses y ayunó durante el Ramadán de 898. Luego regresó a La Meca en Shawwal; permaneció como residente de los dos santuarios hasta su muerte, y los habitantes de ambas ciudades y sus visitantes transmitieron y recopilaron sus obras {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}. En sus últimos años, completó o perfeccionó varios textos allí y formó a estudiantes en la transmisión de hadices {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  fr: "En 896/1491, al-Sakhawi accomplit le hajj et séjourna à La Mecque jusqu'à la mi-898, date à laquelle il se rendit à Médine. Il y demeura plusieurs mois et y observa le jeûne du Ramadan 898, avant de retourner à La Mecque au mois de Shawwal. Il résida dans les deux sanctuaires jusqu'à sa mort, et les habitants des deux villes ainsi que leurs visiteurs transmettaient et rassemblaient ses œuvres (voir: Daw-Lami-Jil-1992 8/14; voir: Hadharat-Dhahab, p. 432). Durant ses dernières années, il y acheva ou perfectionna plusieurs textes et forma des étudiants à la transmission du hadith (voir: Encyclopaedia-of-Islam-2, vol. 8, p. 947)."
  tr: "El-Sakhawi, Hicri 896 yılında (Miladi 1491) Hac ibadetini yerine getirdikten sonra Hicri 898 yılının ortasına kadar Mekke'de kaldı. Daha sonra Medine'ye gitti ve orada birkaç ay kalarak Hicri 898 yılında Ramazan ayını geçirdi. Aynı yılın Şevval ayında Mekke'ye döndü ve vefatına kadar Mescid-i Haram'da kaldı. Her iki şehirden ve onlara gelenlerden insanlar, hem rivayet hem de ilim bakımından ondan dersler aldılar ve yazılarından faydalandılar. Son yıllarında orada birkaç metnini tamamladı ve hadis rivayetinde öğrenciler yetiştirdi."
  id: "Al-Sakhawi melaksanakan ibadah haji pada tahun 896 H (1491 M), kemudian menetap di Mekah hingga pertengahan tahun 898 H. Setelah itu, ia pergi ke Madinah, tinggal selama beberapa bulan dan berbuka puasa Ramadan di sana pada tahun 898 H. Ia kembali ke Mekah pada bulan Syawal tahun itu dan tinggal di Dua Masjid Suci hingga wafatnya. Orang-orang dari kedua kota tersebut dan mereka yang datang ke sana belajar darinya, baik dalam hal riwayat maupun ilmu, dan mereka mengambil manfaat dari tulisannya. Di tahun-tahun terakhirnya, ia menyelesaikan beberapa teksnya di sana dan melatih murid-murid dalam periwayatan hadits."
