label:
  ar: "حجة السخاوي ٨٩٦هـ واستقراره الأخير في المدينة، ١٤٩١م"
  en: "Al-Sakhawi's hajj of 896 and final settling in Medina, 1491"
  ur: "سخاوی کا حج 896ھ اور مدینہ میں آخری سکونت، 1491ء"
summary:
  ar: "حج السخاوي في سنة ست وتسعين ⁦(٨٩٦هـ/١٤٩١م)⁩ ثم جاور بمكة إلى أثناء سنة ثمان وتسعين، فتوجه إلى المدينة النبوية فأقام بها أشهراً وصام بها رمضان ٨٩٨هـ، ثم عاد في شوالها إلى مكة؛ وجاور بالحرمين إلى أن مات، يعمل الناس من أهلهما والقادمين عليهما عنه رواية ودراية ويأخذون من تصانيفه {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}. وفي سنواته الأخيرة أتم هناك عدة من نصوصه ودرب الطلبة على نقل الحديث {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  en: "In 896/1491 al-Sakhawi made the hajj and sojourned in Mecca until mid-898, when he moved to Medina, stayed months and fasted Ramadan 898 there, then returned to Mecca in its Shawwal; he remained a resident of the two sanctuaries until his death, the people of both cities and their visitors transmitting from him and collecting his works {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}. In his final years he completed or refined several texts there and trained students in hadith transmission {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  ur: "896ھ/1491ء میں سخاوی نے حج کیا اور 898ھ کے وسط تک مکہ میں مجاور رہا، پھر مدینہ منتقل ہوا جہاں کئی ماہ قیام اور 898ھ کا رمضان وہیں روزے رکھے، اور اسی سال شوال میں مکہ لوٹا؛ وہ حرمین کا مقیم رہا یہاں تک کہ فوت ہوا، دونوں شہروں کے لوگ اور آنے والے اس سے روایت اور درایت اخذ کرتے اور اس کی تصانیف جمع کرتے {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432}۔ آخری برسوں میں اس نے وہاں کئی متون مکمل یا بہتر کیے اور طلبہ کو حدیث کی نقل کی تربیت دی {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}۔"
