id: event/al-ashari-moves-baghdad
class: event
kind: migration
label:
  ar: "انتقال الأشعري إلى بغداد في أواخر حياته"
  en: "Al-Ash'ari moves to Baghdad late in life"
  fr: "Al-Ash'ari s’installe à Bagdad à la fin de sa vie"
  ur: "اشعری کا آخری عمر میں بغداد منتقلی"
  es: "Al-Ash'ari se traslada a Bagdad en la última etapa de su vida."
  tr: "El-Eş'ari, hayatının son yıllarında Bağdat'a taşındı."
  id: "Al-Ash'ari pindah ke Baghdad di tahun-tahun terakhir hidupnya."
summary:
  ar: "انتقل أبو الحسن الأشعري في أواخر حياته إلى بغداد فأقام بها ودرّس فيها {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}، وأخذ عنه جملة من الأئمة منهم أبو الحسن الباهلي وأبو الحسن الكرماني وأبو زيد المروزي وأبو عبد الله بن مجاهد البصري وزاهر بن أحمد السرخسي وأبو سهل الصعلوكي، وبهؤلاء وأمثالهم انتشر طريقه في الكلام حتى عُرف أتباعه بالأشعرية {cite:siyar-alam-nubala 15/86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. وروى البيهقي عن زاهر بن أحمد السرخسي أن الأشعري استشهده في داره ببغداد قرب أجله {cite:siyar-alam-nubala 15/86}."
  en: "Late in life Abu al-Hasan al-Ash'ari moved to Baghdad, where he lived and taught {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. A group of imams took from him, among them Abu al-Hasan al-Bahili, Abu al-Hasan al-Kirmani, Abu Zayd al-Marwazi, Abu Abd Allah ibn Mujahid al-Basri, Zahir ibn Ahmad al-Sarakhsi and Abu Sahl al-Su'luki; through these and their like his way in kalam spread until his followers came to be known as the Ash'ariyya {cite:siyar-alam-nubala 15/86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. Al-Bayhaqi reports through Zahir ibn Ahmad al-Sarakhsi that al-Ash'ari called him to witness at his house in Baghdad near his death {cite:siyar-alam-nubala 15/86}."
  fr: "À la fin de sa vie, Abu al-Hasan al-Ash'ari s’installa à Bagdad, où il vécut et enseigna {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. Plusieurs imams reçurent son enseignement, dont Abu al-Hasan al-Bahili, Abu al-Hasan al-Kirmani, Abu Zayd al-Marwazi, Abu Abd Allah ibn Mujahid al-Basri, Zahir ibn Ahmad al-Sarakhsi et Abu Sahl al-Su'luki. Par eux et leurs semblables se diffusa sa méthode en kalam, jusqu’à ce que ses adeptes soient appelés Ash'ariyya {cite:siyar-alam-nubala 15/86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. Al-Bayhaqi rapporte par Zahir ibn Ahmad al-Sarakhsi qu’al-Ash'ari le prit à témoin chez lui à Bagdad, près de sa mort {cite:siyar-alam-nubala 15/86}."
  ur: "ابو الحسن اشعری آخری عمر میں بغداد منتقل ہوئے جہاں وہ مقیم ہوئے اور تدریس کرتے رہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}۔ متعدد ائمہ نے ان سے علم حاصل کیا، جن میں ابو الحسن باہلی، ابو الحسن کرمانی، ابو زید مروزی، ابو عبد اللہ بن مجاہد بصری، ظاہر بن احمد سرخسی اور ابو سہل صعلوکی شامل ہیں؛ انھی اور ان جیسوں کے ذریعے کلام میں ان کا طریقہ پھیلا اور ان کے پیروکار اشعریہ کہلائے {cite:siyar-alam-nubala 15/86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}۔ بیہقی ظاہر بن احمد سرخسی سے روایت کرتے ہیں کہ اشعری نے بغداد میں اپنے گھر اپنی وفات کے قریب انہیں گواہ بنایا {cite:siyar-alam-nubala 15/86}۔"
  es: "Al final de su vida, Abu al-Hasan al-Ash'ari se trasladó a Bagdad, donde vivió y enseñó {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. Un grupo de imanes aprendió de él, entre ellos Abu al-Hasan al-Bahili, Abu al-Hasan al-Kirmani, Abu Zayd al-Marwazi, Abu Abd Allah ibn Mujahid al-Basri, Zahir ibn Ahmad al-Sarakhsi y Abu Sahl al-Su'luki; a través de estos y otros como él, su camino en el kalam se extendió hasta que sus seguidores llegaron a ser conocidos como los Ash'ariyya {cite:siyar-alam-nubala 15/86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}. Al-Bayhaqi informa a través de Zahir ibn Ahmad al-Sarakhsi que al-Ash'ari lo llamó para que fuera testigo en su casa en Bagdad cerca de su muerte {cite:siyar-alam-nubala 15/86}."
  tr: "Ebu el-Hasan el-Eş'ari, hayatının son yıllarında Bağdat'a taşındı ve orada ikamet edip ders verdi. Aralarında Ebu el-Hasan el-Bahili, Ebu el-Hasan el-Kirmani, Ebu Zeyd el-Mervezi, Ebu Abdullah ibn Mücahid el-Basri, Zahir ibn Ahmed el-Sarakhsi ve Ebu Sahl el-Sa'luk'un da bulunduğu birçok önde gelen âlim onun yanında eğitim gördü. Bu âlimler ve benzerleri aracılığıyla, teolojideki düşünce ekolü yayıldı ve takipçileri Eş'ariler olarak tanındı. El-Beyhaki, Zahir ibn Ahmed el-Sarakhsi'den rivayetle, el-Eş'ari'nin onu ölümünden kısa bir süre önce Bağdat'taki evinde şehit ettirdiğini nakletmiştir."
  id: "Di tahun-tahun terakhirnya, Abu al-Hasan al-Ash'ari pindah ke Baghdad, tempat ia tinggal dan mengajar. Sejumlah ulama terkemuka belajar di bawah bimbingannya, termasuk Abu al-Hasan al-Bahili, Abu al-Hasan al-Kirmani, Abu Zayd al-Marwazi, Abu Abdullah ibn Mujahid al-Basri, Zahir ibn Ahmad al-Sarakhsi, dan Abu Sahl al-Sa'luki. Melalui para ulama ini dan ulama-ulama lain seperti mereka, aliran pemikiran teologinya menyebar, dan para pengikutnya dikenal sebagai Ash'ari. Al-Bayhaqi meriwayatkan dari Zahir ibn Ahmad al-Sarakhsi bahwa al-Ash'ari membunuhnya di rumahnya di Baghdad menjelang kematiannya."
