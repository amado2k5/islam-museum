label: { ar: "وقعة حمص الثانية على التتار سنة 680هـ", en: "The second battle of Homs, 680", es: "La segunda batalla de Homs, 680", fr: "La deuxième bataille de Homs, 680", ur: "حمص کی دوسری جنگ، 680", tr: "Hicri 680 yılında Tatarlara karşı yapılan ikinci Homs Muharebesi", id: "Pertempuran Homs kedua melawan Tatar pada tahun 680 Hijriah" }
summary:
  ar: "وقعة حمص الكبرى على التتار في سنة ثمانين وستمائة؛ استشهد فيها جماعة من الأمراء والعلماء، منهم الأمير عز الدين أزدمار الجمدار نائب دمشق لسنقر الأشقر — استشهد مقبلاً غير مدبر وله بضع وخمسون سنة — والفاضل الأديب شمس الدين محمد بن مكتوم البعلي شهيداً في وقعة حمص {cite:shadharat-dhahab p. 643-644}."
  en: "The great encounter at Homs in 680 — among the martyrs Azdamur the jamadar, Sunqur al-Ashqar's Damascus na'ib ('advancing, not retreating', at fifty-odd) and the adib Shams al-Din Ibn Maktum of Baalbek {cite:shadharat-dhahab p. 643-644}."
  es: "El gran encuentro en Homs en 680, entre los mártires Azdamur el jamadar, el na'ib de Damasco de Sunqur al-Ashqar ('avanzando, no retrocediendo', a los cincuenta y tantos) y el adib Shams al-Din Ibn Maktum de Baalbek {cita: shadharat-dhahab pág. 643-644}."
  fr: "La grande rencontre de Homs en 680 — parmi les martyrs Azdamur le jamadar, Sunqur al-Ashqar, le na'ib de Damas (« avançant, ne reculant pas », à une cinquantaine) et l'adib Shams al-Din Ibn Maktum de Baalbek {cite: shadharat-dhahab p. 643-644}."
  ur: "680 میں حمص میں عظیم معرکہ - شہداء عزامور جمعدار، سنقر العشر کا دمشق نائب ⁦('آگے بڑھنا، پیچھے نہ ہٹنا'، پچاس پر)⁩ اور بعلبک کے ادیب شمس الدین ابن مکتوم کے درمیان۔ 643-644}۔"
  tr: "680 yılında Tatarlara karşı yapılan büyük Homs Muharebesi'nde bir grup prens ve âlim şehit oldu. Bunların arasında Şam'ın Sanqur al-Ashqar valisi Prens İzz al-Din Azdamar al-Jamdar da vardı; ellili yaşlarında olmasına rağmen geriye dönmeden, öne doğru bakarak şehit oldu. Ayrıca, Homs Muharebesi'nde şehit olan erdemli yazar Şems al-Din Muhammed ibn Maktum al-Ba'li de şehitler arasındaydı. {kaynak: Shadharat-dhahab s. 643-644}"
  id: "Perang besar Homs melawan Tatar pada tahun enam ratus delapan puluh; sekelompok pangeran dan ulama gugur sebagai syahid di dalamnya, termasuk Pangeran Izz al-Din Azdamar al-Jamdar, wakil Damaskus untuk Sanqur al-Ashqar - ia gugur sebagai syahid menghadap ke depan, tidak menoleh ke belakang, dan usianya sekitar lima puluh tahun - dan penulis yang saleh Shams al-Din Muhammad ibn Maktum al-Ba’li, seorang syahid dalam perang Homs {cite:shadharat-dhahab hlm. 643-644}."
