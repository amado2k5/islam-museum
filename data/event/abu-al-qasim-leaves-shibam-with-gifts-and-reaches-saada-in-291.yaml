id: event/abu-al-qasim-leaves-shibam-with-gifts-and-reaches-saada-in-291
class: event
kind: other
label:
  ar: خروج أبي القاسم من شبام بالهدايا وبلوغه صعدة في أيام من سنة 291هـ
  en: Abu al-Qasim leaves Shibam with gifts and reaches Sa'da in the first days of 291 AH
  ur: ابو القاسم کا تحائف کے ساتھ شبام سے نکلنا اور 291ھ کے ابتدائی دنوں میں صعدہ پہنچنا
summary:
  ar: يكتب أبو القاسم إلى ابني يعفر يشكو طول مقامه، فيرسلان إليه دواب وخلعاً وسيفاً وكتباً تعتذر، فيقبل عذرهما ويفرق ما أرسلاه، ثم يخرج من شبام إلى الغيل ثم ريدة وورور وغيرها حتى يصل صعدة، ويذكّر الراوي بالرؤيا.
  en: Abu al-Qasim writes to the two sons of Ya'fur complaining of the length of his stay, and they send him mounts, robes, a sword and letters of excuse; he accepts their excuse and shares out what they sent, then leaves Shibam by al-Ghayl, Raydah, Warwar and other stops until he reaches Sa'da, and recalls the dream to the narrator.
  ur: ابو القاسم یعفر کے دونوں بیٹوں کو اپنے طویل قیام کی شکایت لکھتے ہیں، وہ سواریاں، خلعتیں، تلوار اور معذرت کے خط بھیجتے ہیں؛ وہ ان کا عذر قبول کر کے بھیجی ہوئی چیزیں بانٹ دیتے ہیں، پھر شبام سے غیل، ریدہ، ورور اور دیگر پڑاؤ سے ہوتے ہوئے صعدہ پہنچتے ہیں اور راوی کو خواب یاد دلاتے ہیں۔
