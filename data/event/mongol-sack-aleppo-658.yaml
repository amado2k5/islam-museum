label: { ar: "استيلاء التتار على حلب سنة 658هـ", en: "The Tatars take Aleppo, 658" }
summary:
  ar: "قطع هلاكو الفرات في المحرم سنة ثمان وخمسين ونهب نواحي حلب وطلب من متوليها بوران شاه بن السلطان صلاح الدين أن يجعل للتتار شحنة بالقلعة وشحنة بالبلد فأبى؛ فنزل التتار على حلب في ثاني صفر فحفروا خندقاً عمق قامة وعرض أربعة أذرع وبنوا حائطاً ارتفاعه خمسة أذرع ونصبوا عشرين منجنيقاً وألحوا بالرمى وشرعوا في نقب السور، وفي تاسع صفر ركبوا للأسوار ووضعوا السيف يومهم ومز الغد، واحتمى في حلب نحو خمسين ألفاً وقُتل أمم لا يحصون وبقي القتل والنهب خمسة أيام ثم نودي برفع السيف؛ ثم أحاطوا بالقلعة فسلمها الملك المعظم توران شاه بالأمان {cite:shadharat-dhahab p. 298-299}."
  en: "Hulagu crossed the Euphrates in Muharram 658 and demanded hostages-garrisons of Aleppo's warden Buran Shah, who refused. From 2 Safar the Tatars dug a man-deep ditch, raised a five-cubit wall, set twenty mangonels and sapped the curtain; on 9 Safar they stormed — some fifty thousand had sheltered in the city and the killing ran five days until the sword was lifted; the citadel then capitulated by aman under the elder Turanshah {cite:shadharat-dhahab p. 298-299}."
