label: { ar: "استيلاء التتار على حلب سنة 658هـ", en: "The Tatars take Aleppo, 658", es: "Los tártaros toman Alepo, 658", fr: "Les Tatars prennent Alep, 658", ur: "تاتاریوں نے حلب پر قبضہ کیا، 658", tr: "Tatarların Hicri 658'de Halep'i fethi", id: "Penaklukan Aleppo oleh Tatar pada tahun 658 Hijriah" }
summary:
  ar: "قطع هلاكو الفرات في المحرم سنة ثمان وخمسين ونهب نواحي حلب وطلب من متوليها بوران شاه بن السلطان صلاح الدين أن يجعل للتتار شحنة بالقلعة وشحنة بالبلد فأبى؛ فنزل التتار على حلب في ثاني صفر فحفروا خندقاً عمق قامة وعرض أربعة أذرع وبنوا حائطاً ارتفاعه خمسة أذرع ونصبوا عشرين منجنيقاً وألحوا بالرمى وشرعوا في نقب السور، وفي تاسع صفر ركبوا للأسوار ووضعوا السيف يومهم ومز الغد، واحتمى في حلب نحو خمسين ألفاً وقُتل أمم لا يحصون وبقي القتل والنهب خمسة أيام ثم نودي برفع السيف؛ ثم أحاطوا بالقلعة فسلمها الملك المعظم توران شاه بالأمان {cite:shadharat-dhahab p. 298-299}."
  en: "Hulagu crossed the Euphrates in Muharram 658 and demanded hostages-garrisons of Aleppo's warden Buran Shah, who refused. From 2 Safar the Tatars dug a man-deep ditch, raised a five-cubit wall, set twenty mangonels and sapped the curtain; on 9 Safar they stormed — some fifty thousand had sheltered in the city and the killing ran five days until the sword was lifted; the citadel then capitulated by aman under the elder Turanshah {cite:shadharat-dhahab p. 298-299}."
  es: "Hulagu cruzó el Éufrates en Muharram 658 y exigió guarniciones de rehenes al alcaide de Alepo, Buran Shah, quien se negó. Desde el 2 de Safar, los tártaros cavaron una zanja de un hombre de profundidad, levantaron una muralla de cinco codos, colocaron veinte mangoneles y derribaron la cortina; el 9 de Safar la asaltaron: unos cincuenta mil hombres se habían refugiado en la ciudad y la matanza duró cinco días hasta que se levantó la espada; la ciudadela capituló entonces por orden de un aman bajo el mando del anciano Turanshah {cite:shadharat-dhahab p. 298-299}."
  fr: "Hulagu traversa l'Euphrate en Muharram 658 et exigea des otages – les garnisons du gouverneur d'Alep, Buran Shah – qui refusa. À partir du 2 Safar, les Tatars creusèrent un fossé d'un homme de profondeur, érigèrent un mur de cinq coudées, installèrent vingt mangonneaux et sapèrent les fortifications. Le 9 Safar, ils lancèrent l'assaut. Quelque cinquante mille hommes s'étaient réfugiés dans la ville et les massacres durèrent cinq jours, jusqu'à la reddition. La citadelle capitula alors par un aman sous le commandement du vieux Turanshah (voir: shadharat-dhahab, p. 298-299)."
  ur: "ہلاگو نے محرم 658 میں فرات کو عبور کیا اور حلب کے وارڈن بران شاہ سے یرغمالی گیریژن کا مطالبہ کیا، جس نے انکار کر دیا۔ 2 صفر سے تاتاریوں نے ایک گہری کھائی کھودی، پانچ ہاتھ دیوار کھڑی کی، بیس مینگونیل لگائے اور پردے کو کچل دیا۔ 9 صفر کو انہوں نے دھاوا بول دیا - تقریباً پچاس ہزار لوگ شہر میں پناہ لیے ہوئے تھے اور یہ قتل و غارت پانچ دن تک جاری رہی جب تک کہ تلوار نہیں اٹھا لی گئی۔ قلعہ پھر بڑے توران شاہ کے ماتحت امان کے سپرد کر دیا گیا 298-299}۔"
  tr: "Hulagu, elli sekizinci yılın Muharrem ayında Fırat Nehri'ni kesti ve Halep'in dış mahallelerini yağmaladı. Sultan Selahaddin'in oğlu vali Buran Şah'tan Tatarlara kalenin ve şehrin kontrolünü vermesini istedi, ancak Buran Şah bunu reddetti. Bunun üzerine Tatarlar Safer ayının ikinci günü Halep'e saldırdılar, bir insan boyunda ve dört arşın genişliğinde bir hendek kazdılar, beş arşın yüksekliğinde bir duvar ördüler ve yirmi mancınık kurarak sürekli atış yaptılar ve duvarı yıkmaya başladılar. Safer ayının dokuzuncu günü surlara kadar geldiler ve ertesi gün kılıçlarını bıraktılar. Yaklaşık elli bin kişi Halep'e sığındı ve sayısız millet öldürüldü. Katliam ve yağma beş gün sürdü, sonra kılıçların bırakılması ilan edildi. Ardından kaleyi kuşattılar, bu yüzden büyük kral Turan Şah, güvenlik garantisi karşılığında kaleyi teslim etti. {alıntı: shadharat-dhahab s. 298-299}"
  id: "Hulagu memutus aliran Sungai Eufrat pada bulan Muharram tahun 58 dan menjarah pinggiran Aleppo. Ia meminta gubernurnya, Buran Shah, putra Sultan Saladin, untuk memberikan tugas kepada Tatar di benteng dan di kota, tetapi ia menolak. Maka Tatar menyerbu Aleppo pada tanggal 2 Safar, dan mereka menggali parit sedalam satu orang dan selebar empat hasta, dan mereka membangun tembok setinggi lima hasta, dan mereka memasang dua puluh ketapel dan mereka terus menerus melempar dan mereka mulai merobohkan tembok. Pada tanggal 9 Safar mereka menunggang kuda ke tembok dan meletakkan pedang mereka pada hari itu dan hari berikutnya. Sekitar lima puluh ribu orang berlindung di Aleppo, dan banyak bangsa terbunuh. Pembunuhan dan penjarahan berlanjut selama lima hari, kemudian diumumkan untuk meletakkan pedang. Kemudian mereka mengepung benteng, sehingga raja besar Turan Shah menyerahkannya dengan jaminan keselamatan. {cite:shadharat-dhahab hlm. 298-299}"
