summary:
  ar: "تزوج القمص ريموند صاحبة طبرية وأقام عندها، فلما مات ملك الفرنج المجذوم وأوصى بالملك لابن أخته الصغير كفله وطمع في الملك فلما توفي الصغير انتقل الملك إلى أمه فهوت رجلًا من الفرنج اسمه كي فتزوجته ونقلت الملك إليه وجعلت التاج على رأسه وأشهدت البطرك والقسوس والرؤساء على ردّها إياه، فعظم على ريموند وسقط في يده وطولب بأموال جباها مدة ولاية الصبي فجاهر بالمشاققة وراسل صلاح الدين واعتضد به وضمن له أن يجعله ملكًا مستقلًا للفرنج قاطبة وأطلق له فرسانه، فاختلفت كلمتهم وتفرق شملهم وكان ذلك من أعظم أسباب فتح بيت المقدس {cite:kamil-ibn-al-athir p. 141-142}."
  en: "Raymond of Tripoli, wedded to the lady of Tiberias, had ruled for Baldwin IV heir and tasted kingship; when the boy died the crown passed to his mother, who crowned the newcomer Guy before the patriarch — and demanded Raymond accounts. Openly estranged, he wrote to Saladin, embraced his alliance for a promise of rule over all the Franks, and freed the captive knights. Their word was split and their unity scattered — among the greatest causes of Jerusalem recovery, says Ibn al-Athir {cite:kamil-ibn-al-athir p. 141-142}."
