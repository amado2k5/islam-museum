summary:
  ar: "تزوج القمص ريموند صاحبة طبرية وأقام عندها، فلما مات ملك الفرنج المجذوم وأوصى بالملك لابن أخته الصغير كفله وطمع في الملك فلما توفي الصغير انتقل الملك إلى أمه فهوت رجلًا من الفرنج اسمه كي فتزوجته ونقلت الملك إليه وجعلت التاج على رأسه وأشهدت البطرك والقسوس والرؤساء على ردّها إياه، فعظم على ريموند وسقط في يده وطولب بأموال جباها مدة ولاية الصبي فجاهر بالمشاققة وراسل صلاح الدين واعتضد به وضمن له أن يجعله ملكًا مستقلًا للفرنج قاطبة وأطلق له فرسانه، فاختلفت كلمتهم وتفرق شملهم وكان ذلك من أعظم أسباب فتح بيت المقدس {cite:kamil-ibn-al-athir p. 141-142}."
  en: "Raymond of Tripoli, wedded to the lady of Tiberias, had ruled for Baldwin IV heir and tasted kingship; when the boy died the crown passed to his mother, who crowned the newcomer Guy before the patriarch — and demanded Raymond accounts. Openly estranged, he wrote to Saladin, embraced his alliance for a promise of rule over all the Franks, and freed the captive knights. Their word was split and their unity scattered — among the greatest causes of Jerusalem recovery, says Ibn al-Athir {cite:kamil-ibn-al-athir p. 141-142}."
  es: "Raimundo de Trípoli, casado con la dama de Tiberíades, había reinado para el heredero Balduino IV y había probado el trono; cuando el niño murió, la corona pasó a su madre, quien coronó al recién llegado Guido ante el patriarca y exigió cuentas a Raimundo. Abiertamente distanciado, escribió a Saladino, aceptó su alianza a cambio de la promesa de gobernar sobre todos los francos y liberó a los caballeros cautivos. Su palabra se dividió y su unidad se disolvió, una de las principales causas de la recuperación de Jerusalén, según Ibn al-Athir {cite:kamil-ibn-al-athir p. 141-142}."
  fr: "Raymond de Tripoli, époux de la dame de Tibériade, avait régné pour Baudouin IV, héritier du trône, et goûté à la royauté. À la mort du jeune homme, la couronne revint à sa mère, qui couronna le nouveau-né Guy devant le patriarche et exigea des comptes de Raymond. Ouvertement brouillé avec Saladin, ce dernier écrivit à ce dernier, s'allia à lui en échange de la promesse de gouverner tous les Francs et libéra les chevaliers captifs. Leur parole fut divisée et leur unité brisée – une des principales causes de la reconquête de Jérusalem, selon Ibn al-Athir (voir: Kamil Ibn al-Athir, p. 141-142)."
  ur: "طرابلس کے ریمنڈ نے، تبریاس کی خاتون سے شادی کی، بالڈون چہارم کے وارث کے لیے حکومت کی اور بادشاہی کا ذائقہ چکھا؛ جب لڑکا مر گیا تو تاج اس کی ماں کے پاس چلا گیا، جس نے نئے آنے والے لڑکے کو سرپرست کے سامنے تاج پہنایا - اور ریمنڈ اکاؤنٹس کا مطالبہ کیا۔ کھلے عام الگ ہو کر، اس نے صلاح الدین کو لکھا، تمام فرینکوں پر حکمرانی کے وعدے کے لیے اس کے اتحاد کو قبول کیا، اور قیدی شورویروں کو آزاد کر دیا۔ ان کا کلام تقسیم ہو گیا اور ان کا اتحاد بکھر گیا - یروشلم کی بحالی کے سب سے بڑے اسباب میں سے، ابن الثیر کہتے ہیں {حوالہ: کامل ابن الثیر ص۔ 141-142}۔"
