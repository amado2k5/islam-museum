id: event/safadi-copying-ibn-nubata-718
class: event
kind: other
label:
  ar: "أقدم شهادة على نسخ الصفدي بيده، ٧١٨هـ"
  en: "Al-Safadi's earliest attested copying, 718/1318"
  ur: "صفدی کی نقل نویسی کی قدیم ترین شہادت، 718ھ/1318ء"
  es: "La copia más antigua documentada de Al-Safadi, 718/1318."
  fr: "La plus ancienne copie attestée d'Al-Safadi, 718/1318"
  tr: "Safadi'nin el yazısıyla yazdığı kopyanın en eski kanıtı, Hicri 718 yılına aittir."
  id: "Bukti tertua berupa salinan tulisan tangan al-Safadi, 718 H."
summary:
  ar: "يُشهد نشاط الصفدي في النسخ بخطه من سنة ٧١٨هـ في نسخة من خطب ابن نباتة؛ وقد استمر ناسخاً مجداً حتى وجدت بخطه كتبٌ كتبها بيده تقارب خمسمائة مجلدة، وما كتبه في ديوان الإنشاء ضعف ذلك {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  en: "Al-Safadi's copying activity is already attested in 718/1318 by a manuscript of Ibn Nubata's Khutab in his hand; he went on copying so assiduously that autograph volumes he wrote number nearly five hundred, with twice as much again in his chancery production {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  ur: "صفدی کی نقل نویسی کی قدیم ترین شہادت 718ھ/1318ء کی ہے — ابن نباتہ کے خطبوں کی ایک وہ نقل جو اس کے اپنے ہاتھ کی ہے؛ وہ اس قدر نقل کرتا رہا کہ اس کے دستخطی مجلدات تقریباً پانچ سو ہیں اور دیوانِ انشا کی تحریریں اس سے بھی دگنی {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}۔"
  es: "La actividad de copiado de Al-Safadi ya está atestiguada en 718/1318 por un manuscrito del Khutab de Ibn Nubata escrito de su puño y letra; continuó copiando con tanta asiduidad que los volúmenes autógrafos que escribió suman casi quinientos, con el doble de esa cantidad en su producción de la cancillería {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  fr: "L'activité de copie d'Al-Safadi est déjà attestée en 718/1318 par un manuscrit du Khutab d'Ibn Nubata de sa main; il continua à copier avec une telle assiduité que le nombre de volumes autographes qu'il a écrits s'élève à près de cinq cents, avec deux fois plus dans sa production de chancellerie {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  tr: "El-Safadi'nin kopyalama faaliyeti, Hicri 718 yılına ait İbn Nubata'nın hutbelerinin bir kopyasında kendi el yazısıyla bulunmasıyla kanıtlanmaktadır; ve el yazısıyla yazılmış yaklaşık beş yüz ciltlik kitap bulunana kadar gayretli bir kopyacı olarak devam etmiştir ve Divan-ı İnşa'da yazdıkları bunun iki katıdır. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  id: "Aktivitas Al-Safadi dalam menyalin dibuktikan dengan tulisan tangannya dari tahun 718 H dalam salinan khutbah Ibnu Nubata; dan ia terus menjadi penyalin yang rajin hingga ditemukan buku-buku yang ditulis oleh tangannya yang berjumlah hampir lima ratus jilid, dan apa yang ditulisnya dalam Diwan al-Insha' dua kali lipat dari itu. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
