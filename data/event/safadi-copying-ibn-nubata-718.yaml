label:
  ar: "أقدم شهادة على نسخ الصفدي بيده، ٧١٨هـ"
  en: "Al-Safadi's earliest attested copying, 718/1318"
  ur: "صفدی کی نقل نویسی کی قدیم ترین شہادت، 718ھ/1318ء"
summary:
  ar: "يُشهد نشاط الصفدي في النسخ بخطه من سنة ٧١٨هـ في نسخة من خطب ابن نباتة؛ وقد استمر ناسخاً مجداً حتى وجدت بخطه كتبٌ كتبها بيده تقارب خمسمائة مجلدة، وما كتبه في ديوان الإنشاء ضعف ذلك {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  en: "Al-Safadi's copying activity is already attested in 718/1318 by a manuscript of Ibn Nubata's Khutab in his hand; he went on copying so assiduously that autograph volumes he wrote number nearly five hundred, with twice as much again in his chancery production {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}."
  ur: "صفدی کی نقل نویسی کی قدیم ترین شہادت 718ھ/1318ء کی ہے — ابن نباتہ کے خطبوں کی ایک وہ نقل جو اس کے اپنے ہاتھ کی ہے؛ وہ اس قدر نقل کرتا رہا کہ اس کے دستخطی مجلدات تقریباً پانچ سو ہیں اور دیوانِ انشا کی تحریریں اس سے بھی دگنی {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 89}۔"
