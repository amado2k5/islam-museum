id: event/abdallah-ibn-bistam-asks-al-hadi-to-free-ali-ibn-al-rabi-and-is-refused-294
class: event
kind: other
label:
  ar: "ابن بسطام يسأل الهادي إطلاق علي بن الربيع فيُرد، سنة 294هـ، ص346"
  en: "Ibn Bistam asks al-Hadi to free Ali ibn al-Rabi' and is refused, 294 AH, p. 346"
  fr: "Ibn Bistam demande à al-Hadi de libérer Ali ibn al-Rabi' et essuie un refus, 294 de l’hégire, p. 346"
  ur: "ابن بسطام کا ہادی سے علی بن الربیع کو رہا کرنے کی درخواست کرنا اور انکار، 294ھ، ص346"
  es: "Ibn Bistam le pide a al-Hadi que libere a Ali ibn al-Rabi' y este se niega, 294 AH, pág. 346"
  tr: "İbn Bistam, el-Hadi'den Ali ibn el-Rabi'yi serbest bırakmasını ister, ancak el-Hadi bunu reddeder. Hicri 294 yılı, s. 346"
  id: "Ibn Bistam meminta al-Hadi untuk membebaskan Ali ibn al-Rabi’, tetapi ia menolak. Tahun 294 H, hlm. 346"
summary:
  ar: "بعد وصول الأسرى إلى نجران طمع ابن بسطام في إطلاق علي بن الربيع، فسأل الهادي أن يهبه له، فرفض الهادي وذكر أنه من المفسدين، وقال الراوي إن طلب ابن بسطام لم يكن محبة لابن الربيع."
  en: "After the prisoners reached Najran, Ibn Bistam hoped to free Ali ibn al-Rabi' and asked al-Hadi to give him up. Al-Hadi refused, calling him a troublemaker. The narrator says Ibn Bistam did not ask out of affection for him."
  fr: "Après l’arrivée des prisonniers à Najran, Ibn Bistam espéra libérer Ali ibn al-Rabi' et demanda à al-Hadi de le lui céder. Al-Hadi refusa, le qualifiant de fauteur de troubles. Le narrateur dit qu’Ibn Bistam n’avait pas fait cette demande par affection pour lui."
  ur: "قیدیوں کے نجران پہنچنے کے بعد ابن بسطام نے علی بن الربیع کی رہائی کی امید کی اور ہادی سے انہیں ہبہ کرنے کی درخواست کی۔ ہادی نے انکار کیا اور انہیں فسادیوں میں شمار کیا۔ راوی کے مطابق ابن بسطام کی درخواست محبت کی وجہ سے نہیں تھی۔"
  es: "Tras la llegada de los prisioneros a Najrán, Ibn Bistam esperaba liberar a Ali ibn al-Rabi' y le pidió a al-Hadi que lo entregara. Al-Hadi se negó, llamándolo alborotador. El narrador afirma que Ibn Bistam no le pidió esto por afecto."
  tr: "Mahkumlar Necran'a vardıktan sonra, İbn Bustam Ali bin el-Rabi'nin serbest bırakılmasını çok istedi ve bu yüzden el-Hadi'den onu serbest bırakmasını rica etti. El-Hadi reddetti ve onun yozlaşmışlardan biri olduğunu belirtti. Rivayet eden kişi, İbn Bustam'ın bu isteğinin İbn el-Rabi'ye duyduğu sevgiden kaynaklanmadığını söyledi."
  id: "Setelah para tahanan tiba di Najran, Ibnu Bustam menginginkan pembebasan Ali bin Al-Rabi’, sehingga ia meminta Al-Hadi untuk membebaskannya. Al-Hadi menolak dan menyebutkan bahwa ia adalah salah satu orang yang korup. Perawi mengatakan bahwa permintaan Ibnu Bustam bukanlah karena cinta kepada Ibnu Al-Rabi’."
