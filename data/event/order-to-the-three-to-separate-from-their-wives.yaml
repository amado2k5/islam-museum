id: event/order-to-the-three-to-separate-from-their-wives
class: event
kind: other
label: { ar: "الأمر باعتزال نساء الثلاثة", en: "The order that the three keep apart from their wives", es: "La orden que los tres mantienen separados de sus esposas", fr: "L'ordre que les trois gardent séparés de leurs épouses", ur: "تینوں کو اپنی بیویوں سے الگ رکھنے کا حکم" }
summary:
  ar: "عند مضي أربعين ليلة أتى رسول النبي كعباً بأمر أن يعتزل امرأته ولا يقربها، وأُرسل إلى صاحبيه بمثل ذلك؛ فألحقها بأهلها، وأُذن لامرأة هلال بن أمية أن تخدمه دون أن يقربها."
  en: When forty nights had passed, the Prophet's messenger came to Ka'b ordering him to stay apart from his wife and not approach her, and the same was sent to his two companions. Ka'b sent his wife to her family, while Hilal ibn Umayya's wife was allowed to serve him without him approaching her.
  es: "Transcurridas cuarenta noches, el mensajero del Profeta se presentó ante Ka'b ordenándole que se mantuviera alejado de su esposa y no se acercara a ella; la misma orden se transmitió a sus dos compañeros. Ka'b envió a su esposa con su familia, mientras que a la esposa de Hilal ibn Umayya se le permitió servirle sin que él se acercara a ella."
  fr: "Quarante nuits s'étant écoulées, le messager du Prophète vint trouver Ka'b et lui ordonna de se tenir à l'écart de sa femme et de ne pas l'approcher. Le même ordre fut adressé à ses deux compagnons. Ka'b renvoya sa femme auprès de sa famille, tandis que l'épouse de Hilal ibn Umayya fut autorisée à le servir sans qu'il ait à l'approcher."
  ur: "جب چالیس راتیں گزر گئیں تو رسول اللہ کعب کے پاس آئے اور انہیں حکم دیا کہ وہ اپنی بیوی سے الگ رہیں اور اس کے قریب نہ جائیں، اور یہ بات ان کے دو ساتھیوں کے پاس بھیج دی گئی۔ کعب نے اپنی بیوی کو اس کے گھر والوں کے پاس بھیج دیا، جبکہ ہلال بن امیہ کی بیوی کو اجازت دی گئی کہ وہ اس کے پاس آئے بغیر اس کی خدمت کرے۔"
