label: { en: "The Settlement of Hajar and Ismail at Mecca", ar: "إسكان هاجر وإسماعيل بمكة" }
summary:
  en: "Ibrahim leaves his wife Hajar and the infant Ismail in a barren valley by the future site of the House, entrusting them to God; when the water runs out the spring of Zamzam breaks forth, and the Yemeni tribe of Jurhum settles by them with Hajar’s permission."
  ar: "أنزل إبراهيم زوجته هاجر ورضيعها إسماعيل بوادٍ غير ذي زرع عند موضع البيت، وتركهما أمانة عند الله؛ فلما نفد الماء فاضت لهما بئر زمزم، ثم نزلت جرهم اليمانية بإذن أم إسماعيل، فكان ذلك بدء عمران مكة."
