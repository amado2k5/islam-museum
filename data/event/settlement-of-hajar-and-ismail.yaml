id: event/settlement-of-hajar-and-ismail
class: event
kind: migration
label: { en: "The Settlement of Hajar and Ismail at Mecca", ar: "إسكان هاجر وإسماعيل بمكة", es: "El asentamiento de Hajar e Ismail en La Meca", fr: "L'établissement de Hajar et d'Ismaïl à La Mecque", ur: "مکہ میں حجر اور اسماعیل کی آباد کاری" }
summary:
  en: "Ibrahim leaves his wife Hajar and the infant Ismail in a barren valley by the future site of the House, entrusting them to God; when the water runs out the spring of Zamzam breaks forth, and the Yemeni tribe of Jurhum settles by them with Hajar’s permission."
  ar: "أنزل إبراهيم زوجته هاجر ورضيعها إسماعيل بوادٍ غير ذي زرع عند موضع البيت، وتركهما أمانة عند الله؛ فلما نفد الماء فاضت لهما بئر زمزم، ثم نزلت جرهم اليمانية بإذن أم إسماعيل، فكان ذلك بدء عمران مكة."
  es: "Ibrahim deja a su esposa Hajar y al pequeño Ismail en un valle árido junto al futuro emplazamiento de la Casa, encomendándolos a Dios; cuando se agota el agua, brota el manantial de Zamzam, y la tribu yemení de Jurhum se asienta junto a él con el permiso de Hajar."
  fr: "Ibrahim laisse sa femme Hajar et le nourrisson Ismaïl dans une vallée aride près du futur emplacement de la Maison, les confiant à Dieu; lorsque l'eau vient à manquer, la source de Zamzam jaillit, et la tribu yéménite de Jurhum s'installe près d'eux avec la permission de Hajar."
  ur: "ابراہیم اپنی بیوی حجر اور شیر خوار اسماعیل کو ایک بنجر وادی میں گھر کے مستقبل کے مقام کے پاس چھوڑ کر، انہیں خدا کے سپرد کرتا ہے۔ جب پانی ختم ہو جاتا ہے تو زمزم کا چشمہ پھوٹ پڑتا ہے اور یمنی قبیلہ جرہم حجر کی اجازت سے ان کے پاس آباد ہو جاتا ہے۔"
