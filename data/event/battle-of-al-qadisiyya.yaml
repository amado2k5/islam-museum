label: { ar: "وقعة القادسية" }
summary:
  ar: "ابتدأ أمرها في المحرم سنة أربع عشرة حين استشار عمر بن الخطاب أصحابه في المسير بنفسه، ثم وقعت الوقعة الكبرى بالقادسية وفيها يوم أرماث ويوم أغواث ويوم عماس وليلة القادسية {cite:tabari-tarikh-abu-al-fadl j.3 p.480}. وذكر الطبري أن الواقدي ثبّت سنة أربع عشرة، وقال ابن إسحاق خمس عشرة، وقال بعض أهل الكوفة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.590}."
