summary:
  ar: "وقعة القادسية انتصار المسلمين الكبير على جيش الملك الساساني يزدجرد الثالث بقيادة رستم، وقعت في جنوب العراق في تاريخ تضعه المصادر بين سنة ١٤ وسنة ١٦هـ، ويرجح مؤلف مقالة دائرة المعارف الإسلامية محرم سنة ١٥هـ. دامت ثلاثة أيام وليلة، وسقط فيها رستم، وفتحت للمسلمين الطريق إلى المدائن وإلى فتح العراق كله ثم الهضبة الإيرانية. ولأيامها أسماء مأثورة هي أرماث وأغواث وعماس وليلة الهرير وليلة القادسية."
  en: "The battle of al-Qadisiyya was the Muslims' great victory over the army of the Sasanian king Yazdagird III under Rustam, fought in southern Iraq at a date the sources place between 14 and 16 AH; the author of the Encyclopaedia of Islam article prefers Muharram 15. It lasted three days and a night, Rustam fell, and it opened the way to al-Mada'in, to the conquest of all Iraq and then of the Iranian plateau. Its days and nights carry traditional names: Armath, Aghwath, Amas, the Night of al-Harir and the Night of al-Qadisiyya."
  ur: "جنگِ قادسیہ ساسانی بادشاہ یزدجرد سوم کی فوج پر، جس کی قیادت رستم کے پاس تھی، مسلمانوں کی عظیم فتح تھی۔ یہ جنوبی عراق میں ہوئی اور مآخذ اس کی تاریخ سنہ ۱۴ اور ۱۶ھ کے درمیان بتاتے ہیں، جبکہ انسائیکلوپیڈیا آف اسلام کے مقالہ نگار محرم سنہ ۱۵ھ کو ترجیح دیتے ہیں۔ یہ تین دن اور ایک رات جاری رہی، رستم مارا گیا، اور اس سے مدائن، پورے عراق اور پھر ایرانی سطح مرتفع کی فتح کا راستہ کھلا۔ اس کے دنوں اور راتوں کے روایتی نام ارماث، اغواث، عماس، لیلۃ الہریر اور لیلۃ القادسیہ ہیں۔"
  fr: "La bataille d'al-Qadisiyya fut la grande victoire des musulmans sur l'armée du roi sassanide Yazdagird III commandée par Rustam, livrée dans le sud de l'Irak à une date que les sources placent entre 14 et 16 H ; l'auteur de l'article de l'Encyclopédie de l'Islam préfère Muharram 15. Elle dura trois jours et une nuit, Rustam y tomba, et elle ouvrit la voie à al-Mada'in, à la conquête de tout l'Irak puis du plateau iranien. Ses jours et ses nuits portent des noms traditionnels : Armath, Aghwath, Amas, la nuit d'al-Harir et la nuit d'al-Qadisiyya."
  es: "La batalla de al-Qadisiyya fue la gran victoria de los musulmanes sobre el ejército del rey sasánida Yazdagird III, gobernado por Rustam. Se libró en el sur de Irak, en una fecha que las fuentes sitúan entre el 14 y el 16 de la Hégira; el autor del artículo de la Enciclopedia del Islam prefiere el 15 de Muharram. Duró tres días y una noche, Rustam cayó y abrió el camino a al-Mada'in, a la conquista de todo Irak y, posteriormente, de la meseta iraní. Sus días y noches reciben nombres tradicionales: Armath, Aghwath, Amas, la Noche de al-Harir y la Noche de al-Qadisiyya."
  tr: "Kadisiye Muharebesi, Sasani kralı III. Yazdegerd'in Rostam önderliğindeki ordusuna karşı Müslümanların kazandığı büyük bir zaferdi. Irak'ın güneyinde gerçekleşen muharebenin tarihi kaynaklarca 14 ile 16 Hicri yılları arasına yerleştirilirken, İslam Ansiklopedisi'ndeki makalenin yazarı Muharrem 15 Hicri yılını önermektedir. Üç gün bir gece süren muharebe, Rostam'ın yenilgisiyle sonuçlandı ve Müslümanların Ktesifon'u, Irak'ın geri kalanını ve nihayetinde İran platosunu fethetmelerinin yolunu açtı. Muharebe günlerinin çeşitli isimleri vardır: Armath, Aghwath, Amas, Laylat al-Harir ve Laylat al-Qadisiyyah."
  id: "Perang al-Qadisiyyah adalah kemenangan besar umat Muslim atas pasukan raja Sasaniyah Yazdegerd III, yang dipimpin oleh Rostam. Perang ini terjadi di Irak selatan, dengan beberapa sumber menyebutkan antara tahun 14 dan 16 Hijriah, meskipun penulis artikel Ensiklopedia Islam menyebutkan Muharram 15 Hijriah. Perang berlangsung selama tiga hari dan satu malam, mengakibatkan kekalahan Rostam dan membuka jalan bagi umat Muslim untuk menaklukkan Ctesiphon, seluruh Irak, dan akhirnya dataran tinggi Iran. Hari-hari perang ini memiliki beberapa nama: Armath, Aghwath, Amas, Laylat al-Harir, dan Laylat al-Qadisiyyah."
