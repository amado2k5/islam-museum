id: event/battle-of-al-qadisiyya
education:
  did_you_know:
    ar: "ابتدأ أمر القادسية في المحرم سنة ١٤هـ حين استشار عمر أصحابه في المسير بنفسه؛ وكانت الوقعة أياماً فيها يوم أرماث ويوم أغواث ويوم عماس وليلة الهزيمة."
    en: "Qadisiyya opened in Muharram of year 14 when Umar consulted his companions about marching in person; the great battle ran on for days — the day of Armath, of Aghwath, of Imas, and the night of the rout."
    ur: "قادسیہ کا آغاز سن ۱۴ھ محرم میں ہوا جب عمر نے اپنے صحابہ سے خود چلنے پر مشورہ کیا؛ عظیم جنگ کئی دن چلی — ارماث کا دن، اغواث کا دن، عماس کا دن اور شکست کی رات۔"
    sources: [source/futuh-buldan-maarif-1407, source/tabari-tarikh-abu-al-fadl]
class: event
kind: battle
label: { ar: "وقعة القادسية", en: "The battle of al-Qadisiyya" }
summary:
  ar: "وقعة القادسية انتصار المسلمين الكبير على جيش الملك الساساني يزدجرد الثالث بقيادة رستم، وقعت في جنوب العراق في تاريخ تضعه المصادر بين سنة ١٤ وسنة ١٦هـ، ويرجح مؤلف مقالة دائرة المعارف الإسلامية محرم سنة ١٥هـ. دامت ثلاثة أيام وليلة، وسقط فيها رستم، وفتحت للمسلمين الطريق إلى المدائن وإلى فتح العراق كله ثم الهضبة الإيرانية. ولأيامها أسماء مأثورة هي أرماث وأغواث وعماس وليلة الهرير وليلة القادسية."
  en: "The battle of al-Qadisiyya was the Muslims' great victory over the army of the Sasanian king Yazdagird III under Rustam, fought in southern Iraq at a date the sources place between 14 and 16 AH; the author of the Encyclopaedia of Islam article prefers Muharram 15. It lasted three days and a night, Rustam fell, and it opened the way to al-Mada'in, to the conquest of all Iraq and then of the Iranian plateau. Its days and nights carry traditional names: Armath, Aghwath, Amas, the Night of al-Harir and the Night of al-Qadisiyya."
  ur: "جنگِ قادسیہ ساسانی بادشاہ یزدجرد سوم کی فوج پر، جس کی قیادت رستم کے پاس تھی، مسلمانوں کی عظیم فتح تھی۔ یہ جنوبی عراق میں ہوئی اور مآخذ اس کی تاریخ سنہ ۱۴ اور ۱۶ھ کے درمیان بتاتے ہیں، جبکہ انسائیکلوپیڈیا آف اسلام کے مقالہ نگار محرم سنہ ۱۵ھ کو ترجیح دیتے ہیں۔ یہ تین دن اور ایک رات جاری رہی، رستم مارا گیا، اور اس سے مدائن، پورے عراق اور پھر ایرانی سطح مرتفع کی فتح کا راستہ کھلا۔ اس کے دنوں اور راتوں کے روایتی نام ارماث، اغواث، عماس، لیلۃ الہریر اور لیلۃ القادسیہ ہیں۔"
