label: { en: "Burial of the Uhud martyrs", ar: "دفن شهداء أحد" }
summary:
  ar: "أشرف رسول الله على الشهداء وقال: «أنا شهيد على هؤلاء». أمر بردّ من كان نقل قتيله إلى المدينة، وأن يُدفنوا في مضاجعهم بثيابهم بعد نزع الحديد والجلود بلا غسل، وكان يجمع الاثنين والثلاثة في القبر ويقدّم أكثرهم أخذاً للقرآن. دُفن عبد الله بن عمرو بن حرام وعمرو بن الجموح في قبر واحد لمحبتهما. تفقّدوا حنظلة فوجدوه يقطر ماء فقال النبي: الملائكة تغسله، فسمي غسيل الملائكة. وجد في الشهداء مصعب بن عمير ولم يُجد له كفن إلا بردة {cite:mubarakpuri-raheeq p.281}."
