id: event/al-qurtubi-settles-munya-660
class: event
kind: other
label:
  ar: "القرطبي يستقر بمنية بني خصيب في صعيد مصر، حوالي ٦٦٠هـ"
  en: "Al-Qurtubi settles at Munyat Bani Khusayb in Upper Egypt, c. 660/1262"
  ur: "قرطبی کا صعید مصر کی منیۃ بنی خصیب میں سکونت، تقریباً 660ھ/1262ء"
summary:
  ar: "استقر القرطبي بمنية بني خصيب من صعيد مصر، فكان نزيلها وعمل فيها تفسيره الكبير وتعب عليه وحشاه بكل فريدة {cite:siyar-alam-nubala 17/97}؛ وفي دائرة المعارف أنه استقر بمنية أبي الخصيب في الصعيد ومات ودُفن بها {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}، وهي قرية عامرة على الضفة الشرقية من النيل {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "Al-Qurtubi settled at Munyat Bani Khusayb in Upper Egypt, became its resident and laboured there on his great Qur'an commentary, filling it with every rarity {cite:siyar-alam-nubala 17/97}. The Encyclopaedia of Islam confirms he settled at Munyat Abi l-Khusayb, where he died and was buried {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}; the village stood prosperous on the Nile's east bank {cite:nuzhat-al-mushtaq-2002 p. 124}."
  ur: "قرطبی صعید مصر کی منیۃ بنی خصیب میں مقیم ہوا اور وہیں اپنے عظیم تفسیری کارنامے پر محنت کرتا رہا، اسے ہر نایاب مادے سے مزین کیا {cite:siyar-alam-nubala 17/97}۔ انسائیکلوپیڈیا آف اسلام تصدیق کرتی ہے کہ وہ منیۃ ابی الخصیب میں مقیم، وہیں فوت ہوا اور دفن کیا گیا {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}؛ گاؤں دریائے نیل کے مشرقی کنارے آباد تھا {cite:nuzhat-al-mushtaq-2002 p. 124}۔"
