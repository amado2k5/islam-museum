id: event/al-qurtubi-settles-munya-660
class: event
kind: other
label:
  ar: "القرطبي يستقر بمنية بني خصيب في صعيد مصر، حوالي ٦٦٠هـ"
  en: "Al-Qurtubi settles at Munyat Bani Khusayb in Upper Egypt, c. 660/1262"
  ur: "قرطبی کا صعید مصر کی منیۃ بنی خصیب میں سکونت، تقریباً 660ھ/1262ء"
  es: "Al-Qurtubi se establece en Munyat Bani Khusayb en el Alto Egipto, c. 660/1262"
  fr: "Al-Qurtubi s'installe à Munyat Bani Khusayb en Haute-Égypte, v. 660/1262"
  tr: "El-Kurtubi, H. 660 civarında Yukarı Mısır'daki Munyat Bani Khasib'e yerleşti."
  id: "Al-Qurtubi menetap di Munyat Bani Khasib di Mesir Hulu, sekitar tahun 660 H."
summary:
  ar: "استقر القرطبي بمنية بني خصيب من صعيد مصر، فكان نزيلها وعمل فيها تفسيره الكبير وتعب عليه وحشاه بكل فريدة {cite:siyar-alam-nubala 17/97}؛ وفي دائرة المعارف أنه استقر بمنية أبي الخصيب في الصعيد ومات ودُفن بها {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}، وهي قرية عامرة على الضفة الشرقية من النيل {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "Al-Qurtubi settled at Munyat Bani Khusayb in Upper Egypt, became its resident and laboured there on his great Qur'an commentary, filling it with every rarity {cite:siyar-alam-nubala 17/97}. The Encyclopaedia of Islam confirms he settled at Munyat Abi l-Khusayb, where he died and was buried {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}; the village stood prosperous on the Nile's east bank {cite:nuzhat-al-mushtaq-2002 p. 124}."
  ur: "قرطبی صعید مصر کی منیۃ بنی خصیب میں مقیم ہوا اور وہیں اپنے عظیم تفسیری کارنامے پر محنت کرتا رہا، اسے ہر نایاب مادے سے مزین کیا {cite:siyar-alam-nubala 17/97}۔ انسائیکلوپیڈیا آف اسلام تصدیق کرتی ہے کہ وہ منیۃ ابی الخصیب میں مقیم، وہیں فوت ہوا اور دفن کیا گیا {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}؛ گاؤں دریائے نیل کے مشرقی کنارے آباد تھا {cite:nuzhat-al-mushtaq-2002 p. 124}۔"
  es: "Al-Qurtubi se estableció en Munyat Bani Khusayb, en el Alto Egipto, donde residió y trabajó arduamente en su gran comentario del Corán, llenándolo de toda clase de rarezas {cite:siyar-alam-nubala 17/97}. La Enciclopedia del Islam confirma que se estableció en Munyat Abi l-Khusayb, donde murió y fue enterrado {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}; el pueblo prosperaba en la orilla este del Nilo {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Al-Qurtubi s'établit à Munyat Bani Khusayb, en Haute-Égypte, où il devint résident et travailla à son grand commentaire du Coran, l'enrichissant de toutes les raretés {cite:siyar-alam-nubala 17/97}. L'Encyclopédie de l'Islam confirme qu'il s'établit à Munyat Abi l-Khusayb, où il mourut et fut enterré {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}; le village était prospère sur la rive orientale du Nil {cite:nuzhat-al-mushtaq-2002 p. 124}."
  tr: "Al-Qurtubi, Yukarı Mısır'daki Munyat Bani Khasib'e yerleşti ve orada ikamet ederek büyük tefsiri üzerinde çalıştı, üzerinde çok emek harcadı ve onu her türlü eşsiz bilgiyle doldurdu {cite:siyar-alam-nubala 17/97}; ve Ansiklopedide, Yukarı Mısır'daki Munyat Abi Al-Khasib'e yerleştiği, orada öldüğü ve oraya gömüldüğü belirtilmektedir {cite:encyclopaedia-of-islam-2 vol. 5 p. 550} ve bu, Nil'in doğu kıyısında müreffeh bir köydür {cite:nuzhat-al-mushtaq-2002 p. 124}."
  id: "Al-Qurtubi menetap di Munyat Bani Khasib di Mesir Hulu, dan beliau tinggal di sana serta mengerjakan tafsir besarnya di sana, dan beliau bekerja keras serta mengisinya dengan segala hal yang unik {cite:siyar-alam-nubala 17/97}; dan dalam Ensiklopedia disebutkan bahwa beliau menetap di Munyat Abi Al-Khasib di Mesir Hulu dan meninggal serta dimakamkan di sana {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}, dan itu adalah desa yang makmur di tepi timur Sungai Nil {cite:nuzhat-al-mushtaq-2002 p. 124}."
