label: { ar: "حرب زهير بن جناب على بكر وتغلب", en: "Zuhayr ibn Janab's War on Bakr and Taghlib", es: "La guerra de Zuhayr ibn Janab contra Bakr y Taghlib", fr: "La guerre de Zuhayr ibn Janab contre Bakr et Taghlib", ur: "زہیر بن جنب کی جنگ بکر اور تغلب کے خلاف" }
summary:
  ar: "حرب زهير بن جناب الكلبي على بكر وتغلب ابني وائل؛ كان أبرهة لما طلع إلى نجد أتاه زهير فأكرمه وفضله على من أتاه من العرب ثم أمره على بكر وتغلب فوليهم، فلما أصابتهم سنة اشتد عليهم ما يطلب منهم من الخراج فأقام بهم زهير في الحرب ومنعهم من النجعة حتى يؤدوا ما عليهم فكادت مواشيهم تهلك، فاعتمد ابن زيابة أحد بني تيم الله بن ثعلبة بالسيف على بطن زهير وهو نائم حتى خرج من ظهره وسلمت أمعاؤه وما في بطنه، وعلم زهير أنه قد سلم فلم يتحرك لئلا يجهز عليه، وانصرف التيمي فأعلمهم أنه قتل زهيراً، فأمر زهير أصحابه أن يظهروا أنه ميت ويستأذنوا بكراً وتغلب في دفنه فدفنوا ثياباً ملفوفة ثم ساروا مجدين إلى قومه، فجمع الجموع وغزا بكراً وتغلب {cite:kamil-ibn-al-athir p. 378}."
  en: "Zuhayr ibn Janab's war on Bakr and Taghlib: set over them as Abraha's tax-collector in a famine year, he pressed them until their herds nearly died — whereupon Ibn Ziyaba the Taym Allah drove a sword clean through the sleeping Zuhayr without killing him, and Zuhayr had his men stage a mock burial of bundled clothes with the tribes' leave, then marched on them {cite:kamil-ibn-al-athir p. 378}."
  es: "La guerra de Zuhayr ibn Janab contra Bakr y Taghlib: puesto sobre ellos como recaudador de impuestos de Abraha en un año de hambruna, los presionó hasta que sus rebaños casi murieron, momento en el que Ibn Ziyaba el Taym Allah atravesó con una espada a Zuhayr dormido sin matarlo, y Zuhayr hizo que sus hombres escenificaran un entierro simulado de paquetes de ropa con el permiso de las tribus, y luego marchó contra ellos {cite:kamil-ibn-al-athir p. 378}."
  fr: "La guerre de Zuhayr ibn Janab contre Bakr et Taghlib: nommé collecteur d'impôts d'Abraha lors d'une année de famine, il les pressa jusqu'à ce que leurs troupeaux soient presque morts — sur quoi Ibn Ziyaba le Taym Allah enfonça une épée à travers Zuhayr endormi sans le tuer, et Zuhayr fit mettre en scène par ses hommes une fausse cérémonie d'enterrement de vêtements emballés avec la permission des tribus, puis marcha sur eux {cite:kamil-ibn-al-athir p. 378}."
  ur: "بکر اور تغلب کے خلاف زہیر بن جنب کی جنگ: قحط سال میں ابرہہ کا ٹیکس وصول کرنے والا ان پر مقرر کیا، اس نے ان پر دباؤ ڈالا یہاں تک کہ ان کے ریوڑ مرنے کے قریب ہو گئے، اس کے بعد ابن زیبہ نے سوئے ہوئے ظہیر پر تلوار چلائی اور اسے قتل کیے بغیر صاف کر دیا، اور زہیر نے اپنے آدمیوں کو دھوکہ دہی کے ساتھ چھوڑ دیا، اور پھر اس نے اپنے آدمیوں کو طوطی کے کپڑے پہنائے۔ ان کا حوالہ: کامل ابن الاثیر ص۔ 378}۔"
