label: { ar: "حرب زهير بن جناب على بكر وتغلب", en: "Zuhayr ibn Janab's War on Bakr and Taghlib", es: "La guerra de Zuhayr ibn Janab contra Bakr y Taghlib", fr: "La guerre de Zuhayr ibn Janab contre Bakr et Taghlib", ur: "زہیر بن جنب کی جنگ بکر اور تغلب کے خلاف", tr: "Züheyr ibn Ceneb'in Bekir ve Tağlib'e karşı savaşı", id: "Perang Zuhair ibn Janab melawan Bakr dan Taghlib" }
summary:
  ar: "حرب زهير بن جناب الكلبي على بكر وتغلب ابني وائل؛ كان أبرهة لما طلع إلى نجد أتاه زهير فأكرمه وفضله على من أتاه من العرب ثم أمره على بكر وتغلب فوليهم، فلما أصابتهم سنة اشتد عليهم ما يطلب منهم من الخراج فأقام بهم زهير في الحرب ومنعهم من النجعة حتى يؤدوا ما عليهم فكادت مواشيهم تهلك، فاعتمد ابن زيابة أحد بني تيم الله بن ثعلبة بالسيف على بطن زهير وهو نائم حتى خرج من ظهره وسلمت أمعاؤه وما في بطنه، وعلم زهير أنه قد سلم فلم يتحرك لئلا يجهز عليه، وانصرف التيمي فأعلمهم أنه قتل زهيراً، فأمر زهير أصحابه أن يظهروا أنه ميت ويستأذنوا بكراً وتغلب في دفنه فدفنوا ثياباً ملفوفة ثم ساروا مجدين إلى قومه، فجمع الجموع وغزا بكراً وتغلب {cite:kamil-ibn-al-athir p. 378}."
  en: "Zuhayr ibn Janab's war on Bakr and Taghlib: set over them as Abraha's tax-collector in a famine year, he pressed them until their herds nearly died — whereupon Ibn Ziyaba the Taym Allah drove a sword clean through the sleeping Zuhayr without killing him, and Zuhayr had his men stage a mock burial of bundled clothes with the tribes' leave, then marched on them {cite:kamil-ibn-al-athir p. 378}."
  es: "La guerra de Zuhayr ibn Janab contra Bakr y Taghlib: puesto sobre ellos como recaudador de impuestos de Abraha en un año de hambruna, los presionó hasta que sus rebaños casi murieron, momento en el que Ibn Ziyaba el Taym Allah atravesó con una espada a Zuhayr dormido sin matarlo, y Zuhayr hizo que sus hombres escenificaran un entierro simulado de paquetes de ropa con el permiso de las tribus, y luego marchó contra ellos {cite:kamil-ibn-al-athir p. 378}."
  fr: "La guerre de Zuhayr ibn Janab contre Bakr et Taghlib: nommé collecteur d'impôts d'Abraha lors d'une année de famine, il les pressa jusqu'à ce que leurs troupeaux soient presque morts — sur quoi Ibn Ziyaba le Taym Allah enfonça une épée à travers Zuhayr endormi sans le tuer, et Zuhayr fit mettre en scène par ses hommes une fausse cérémonie d'enterrement de vêtements emballés avec la permission des tribus, puis marcha sur eux {cite:kamil-ibn-al-athir p. 378}."
  ur: "بکر اور تغلب کے خلاف زہیر بن جنب کی جنگ: قحط سال میں ابرہہ کا ٹیکس وصول کرنے والا ان پر مقرر کیا، اس نے ان پر دباؤ ڈالا یہاں تک کہ ان کے ریوڑ مرنے کے قریب ہو گئے، اس کے بعد ابن زیبہ نے سوئے ہوئے ظہیر پر تلوار چلائی اور اسے قتل کیے بغیر صاف کر دیا، اور زہیر نے اپنے آدمیوں کو دھوکہ دہی کے ساتھ چھوڑ دیا، اور پھر اس نے اپنے آدمیوں کو طوطی کے کپڑے پہنائے۔ ان کا حوالہ: کامل ابن الاثیر ص۔ 378}۔"
  tr: "Zuhair bin Janab el-Kalbi'nin Wael'in oğulları Bakr ve Taghlib'e karşı savaşı; Abraha Necd'e çıktığında, Zuhair onun yanına geldi. Bunun üzerine Abraha ona saygı gösterdi ve kendisine gelen Araplardan üstün tuttu. Sonra onu Bakr ve Taghlib'in başına atadı ve o da onları yönetti. Bir kıtlık baş gösterdiğinde, onlardan istenen vergiler çok ağırlaştı. Bunun üzerine Zuhair, borçlarını ödeyene kadar onları savaşta tuttu ve göç etmelerini engelledi. Bu yüzden hayvanları neredeyse telef oldu. Taym Allah bin Tha'laba'nın oğullarından İbn Ziyaba, uyurken kılıcını Zuhair'in karnına dayadı ve kılıç sırtından çıktı. Bağırsakları ve midesindekiler zarar görmedi. Zuhair zarar görmediğini bildiği için, öldürülmemek adına kıpırdamadı. Taymi ayrıldı ve Zuhair'i öldürdüğünü bildirdi. Bunun üzerine Zuhair, arkadaşlarına ölmüş gibi göstermelerini ve Bakr ile Taghlib'den kendisini gömmek için izin istemelerini emretti. Böylece onu giysilere sarıp gömdüler, sonra da hızla kendi halkının yanına gittiler. Zuhair de ordularını topladı ve Bakr ile Taghlib'e baskın düzenledi. {cite:kamil-ibn-al-athir s. 378}"
  id: "Perang Zuhair bin Janab al-Kalbi melawan Bakr dan Taghlib, putra-putra Wael; ketika Abraha pergi ke Najd, Zuhair datang kepadanya, lalu ia menghormatinya dan memberinya keutamaan di atas orang-orang Arab yang datang kepadanya, kemudian ia mengangkatnya sebagai penguasa Bakr dan Taghlib, sehingga ia memerintah mereka. Ketika kelaparan melanda mereka, pajak yang dituntut dari mereka menjadi sangat berat, sehingga Zuhair terus berperang dan mencegah mereka berhijrah sampai mereka membayar kewajiban mereka, sehingga ternak mereka hampir mati. Ibn Ziyaba, salah seorang putra Taym Allah bin Tha’laba, menyandarkan pedangnya di perut Zuhair saat ia tidur sampai pedang itu menembus punggungnya, dan usus serta isi perutnya tidak terluka. Zuhair tahu bahwa ia tidak terluka, jadi ia tidak bergerak agar tidak dibunuh. Orang Taymi itu pergi dan memberi tahu mereka bahwa dia telah membunuh Zuhair, sehingga Zuhair memerintahkan para pengikutnya untuk membuat seolah-olah dia telah mati dan meminta izin kepada Bakr dan Taghlib untuk menguburnya. Maka mereka menguburnya dengan kain yang dibungkus, lalu mereka segera berangkat menemui kaumnya. Maka dia mengumpulkan pasukan dan menyerang Bakr dan Taghlib. {cite:kamil-ibn-al-athir p. 378}."
