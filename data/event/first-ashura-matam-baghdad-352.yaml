label: { ar: "أول مأتم ببغداد على الحسين", en: "The first mourning for al-Husayn in Baghdad", es: "El primer duelo por al-Husayn en Bagdad", fr: "Premier deuil pour al-Husayn à Bagdad", ur: "بغداد میں حسین کا پہلا ماتم", tr: "Hüseyin için Bağdat'ta düzenlenen ilk yas töreni.", id: "Upacara berkabung pertama di Baghdad untuk Hussein" }
summary:
  ar: "يوم عاشوراء سنة اثنتين وخمسين وثلاث مئة ألزم معز الدولة أهل بغداد بالنوح والمأتم على الحسين وأمر بغلق الأسواق وعلقت عليها المسوح ومنع الطباخين من عمل الأطعمة وخرجت نساء الرافضة منشرات الشعور مضمخات الوجوه يلطمن ويفتن الناس، وهذا أول ما نيح عليه ببغداد قاله الذهبي في العبر؛ وفيها في ثامن عشر ذي الحجة عملت الرافضة عيد الغدير ودقت الكوسات وصلوا بالصحراء صلاة العيد {cite:shadharat-dhahab p. 17}."
  en: "On 'Ashura 352 Mu'izz al-Dawla obliged Baghdad to mourn al-Husayn: markets closed, sackcloth on the shops, cooks forbidden food, and the Rafida's women processing bare-haired and beating their faces — the first such mourning held at Baghdad per al-Dhahabi's 'Ibar; on 18 Dhu l-Hijja that year the Rafida also made Ghadir Khumm a festival with kettle-drums and an 'id prayer in the open {cite:shadharat-dhahab p. 17}."
  es: "En 'Ashura 352, Mu'izz al-Dawla obligó a Bagdad a guardar luto por al-Husayn: los mercados cerraron, las tiendas se cubrieron con cilicio, los cocineros tenían prohibido comer y las mujeres de los Rafida procedían con el pelo descubierto y golpeándose la cara; fue el primer luto de este tipo celebrado en Bagdad según el 'Ibar de al-Dhahabi; el 18 de Dhu l-Hijja de ese año, los Rafida también convirtieron Ghadir Khumm en un festival con timbales y una oración de 'id al aire libre {cite:shadharat-dhahab p. 17}."
  fr: "Le 18 Dhu l'Hijja de cette année-là, les Rafides firent également de Ghadir Khumm une fête avec des tambours et une prière de l'Aïd en plein air {cite:shadharat-dhahab p. 17}."
  ur: "عاشورہ 352 کو معیز الدولہ نے بغداد کو امام حسین کا ماتم کرنے پر مجبور کیا: بازار بند، دکانوں پر ٹاٹ اوڑھے، حرام کھانا پکانا، اور رفیدہ کی عورتیں ننگے بالوں والی پروسیسنگ کرتی ہیں اور منہ مارتی ہیں- اس طرح کا پہلا سوگ بغداد فی الذہبی میں منعقد ہوا۔ اسی سال 18 ذی الحجہ کو رفع یدین نے غدیر خم کو کیتلی کے ڈرموں کے ساتھ ایک تہوار بھی بنایا اور کھلے میں نماز عید ادا کی۔ 17}۔"
  tr: "Hicri 352 yılında Aşura günü, Mu'izz el-Davla, Bağdat halkını Hüseyin için yas tutmaya ve ağıt yakmaya zorladı. Pazarların kapatılmasını ve üzerlerine çuval asılmasını emretti. Aşçıların yemek hazırlamasını yasakladı. Rafizilerin kadınları saçlarını dağıtmış, yüzlerine parfüm sürmüş, kendilerini tokatlayarak ve insanları baştan çıkararak dışarı çıktılar. El-Dhahabi'nin el-İbar'da belirttiği gibi, bu Bağdat'ta ilk kez yas tutulmasıydı. Zilhicce ayının on sekizinci günü Rafiziler Gadir Bayramı'nı kutladılar, kabak dövdüler ve çölde bayram namazı kıldılar. {kaynak: Şadharat-Dhahab s. 17}"
  id: "Pada hari Asyura tahun 352 Hijriah, Mu’izz al-Dawla mewajibkan penduduk Baghdad untuk berkabung dan meratapi al-Husayn. Beliau memerintahkan pasar-pasar ditutup dan kain karung digantung di atasnya. Beliau melarang juru masak menyiapkan makanan. Para wanita Rafidiyah keluar dengan rambut acak-acakan dan wajah beraroma parfum, menampar diri sendiri dan menggoda orang banyak. Ini adalah pertama kalinya berkabung dilakukan di Baghdad, sebagaimana dikatakan al-Dhahabi dalam al-‘Ibar. Pada tanggal 18 Dzul Hijjah, kaum Rafidiyah merayakan Idul Ghadir, menumbuk zucchini, dan melaksanakan salat Id di padang pasir. {cite:shadharat-dhahab hlm. 17}"
