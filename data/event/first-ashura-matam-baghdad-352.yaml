label: { ar: "أول مأتم ببغداد على الحسين" }
summary:
  ar: "يوم عاشوراء سنة اثنتين وخمسين وثلاث مئة ألزم معز الدولة أهل بغداد بالنوح والمأتم على الحسين وأمر بغلق الأسواق وعلقت عليها المسوح ومنع الطباخين من عمل الأطعمة وخرجت نساء الرافضة منشرات الشعور مضمخات الوجوه يلطمن ويفتن الناس، وهذا أول ما نيح عليه ببغداد قاله الذهبي في العبر؛ وفيها في ثامن عشر ذي الحجة عملت الرافضة عيد الغدير ودقت الكوسات وصلوا بالصحراء صلاة العيد {cite:shadharat-dhahab p. 17}."
  en: "On 'Ashura 352 Mu'izz al-Dawla obliged Baghdad to mourn al-Husayn: markets closed, sackcloth on the shops, cooks forbidden food, and the Rafida's women processing bare-haired and beating their faces — the first such mourning held at Baghdad per al-Dhahabi's 'Ibar; on 18 Dhu l-Hijja that year the Rafida also made Ghadir Khumm a festival with kettle-drums and an 'id prayer in the open {cite:shadharat-dhahab p. 17}."
