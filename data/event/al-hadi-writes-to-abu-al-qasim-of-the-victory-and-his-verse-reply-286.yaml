id: event/al-hadi-writes-to-abu-al-qasim-of-the-victory-and-his-verse-reply-286
class: event
kind: other
label:
  ar: كتاب الهادي إلى أبي القاسم بالنصر وجوابه شعراً، 286هـ
  en: Al-Hadi writes to Abu al-Qasim of the victory and receives a verse reply, 286 AH
  ur: ہادی کا ابو القاسم کو فتح کی خبر لکھنا اور شعر میں ان کا جواب، 286ھ
summary:
  ar: يكتب الهادي إلى أبي القاسم بنصر الله له وتأييده وظفره على بني الحارث، فيجمع أبو القاسم الناس ويقرأ عليهم الكتاب فيسرّون، ويكتب جواباً ويعارضه بقصيدة يتحدث فيها عن صبره على المشاق وحبه الطعن في الحرب وعزمه على الذود عن حريم آل محمد، ويثني على همدان وسعد وخولان.
  en: Al-Hadi writes to Abu al-Qasim telling of God's help, support and success over Banu al-Harith; Abu al-Qasim gathers the people and reads it to them, they rejoice, and he writes back and answers with a poem about his patience in hardship, his liking for the thrust in war and his resolve to defend the family of Muhammad, praising Hamdan, Sa'd and Khawlan.
  ur: ہادی ابو القاسم کو بنو حارث پر اللہ کی مدد، تائید اور کامیابی کی خبر لکھتے ہیں؛ ابو القاسم لوگوں کو جمع کر کے خط پڑھ کر سناتے ہیں، وہ خوش ہوتے ہیں، اور وہ جواب لکھتے ہیں اور ایک قصیدے سے اس کا جواب دیتے ہیں جس میں مشقتوں پر صبر، جنگ میں وار کی محبت اور آل محمد کے حریم کی حفاظت کا عزم ہے، اور ہمدان، سعد اور خولان کی تعریف۔
