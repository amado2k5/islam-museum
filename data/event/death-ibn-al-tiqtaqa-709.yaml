label:
  ar: "وفاة ابن الطقطقي سنة ٧٠٩هـ"
  en: "Death of Ibn al-Tiqtaqa, 709/1309"
  ur: "ابن طقطقی کی وفات، 709ھ/1309ء"
  es: "Muerte de Ibn al-Tiqta, 709/1"
  fr: "Mort d'Ibn al-Tiqta, 709/1"
  tr: "İbn el-Tıktaki Hicri 709 yılında vefat etti."
  id: "Ibn al-Tiqtaqi meninggal pada tahun 709 Hijriah."
summary:
  ar: "توفي صفي الدين محمد بن علي المعروف بابن الطقطقي صاحب «الفخري» سنة ٧٠٩هـ كما يذكر الذهبي في فهرس مصادر «تاريخ الإسلام» {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}؛ وقصر الزركلي في «الأعلام» على ذكر سنة ١٣٠٢م، أي العام الذي أُلّف فيه الكتاب {cite:al-aalam j.3 p. 149}."
  en: "Safi al-Din Muhammad ibn Ali, known as Ibn al-Tiqtaqa, author of al-Fakhri, died in 709 AH as al-Dhahabi's source list to the Tarikh al-Islam records {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}; al-Zirikli in al-A'lam gives only 1302 CE, the year the book was composed {cite:al-aalam j.3 p. 149}."
  ur: "صفی الدین محمد بن علی المعروف ابن طقطقی، صاحب «فخری»، 709ھ میں فوت ہوئے جیسا کہ ذہبی نے تاریخ الاسلام کی فہرست مآخذ میں لکھا ہے {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}؛ زرکلی نے «الاعلام» میں صرف 1302ء لکھا ہے، یعنی وہی سال جس میں کتاب مرتب ہوئی {cite:al-aalam j.3 p. 149}۔"
  es: "Safi al-Din Muhammad ibn Ali, conocido como Ibn al-Tiqtaqa, autor de al-Fakhri, murió en el año 709 AH según la lista de fuentes de al-Dhahabi para los registros de Tarikh al-Islam {cite:tarikh-islam-dhahabi sa 601-610 p. 738}; al-Zirikli en al-A'lam solo da 1302 CE, el año en que se compuso el libro {cite:al-aalam j.3 p. 149}."
  fr: "Safi al-Din Muhammad ibn Ali, connu sous le nom d'Ibn al-Tiqtaqa, auteur d'al-Fakhri, est mort en 709 AH, selon la liste des sources d'al-Dhahabi pour les archives de Tarikh al-Islam {cite:tarikh-islam-dhahabi sa 601-610 p. 738}; al-Zirikli dans al-A'lam ne donne que 1302 CE, l'année de composition du livre {cite:al-aalam j.3 p. 149}."
  tr: "“el-Fakhri”nin yazarı olan Safi el-Din Muhammed ibn Ali, diğer adıyla İbn el-Tiqtaqi, “Tarikh el-İslam”ın kaynaklar indeksinde el-Dhahabi'nin belirttiği gibi 709 Hicri yılında vefat etmiştir {cite:tarikh-islam-dhahabi sa 601-610 s. 738}; ve el-Zarkali, “el-A’lam”da sadece kitabın yazıldığı yıl olan 1302 Miladi yılından bahsetmiştir {cite:al-aalam j.3 s. 149}."
  id: "Safi al-Din Muhammad ibn Ali, yang dikenal sebagai Ibn al-Tiqtaqi, penulis “al-Fakhri,” meninggal pada tahun 709 H, sebagaimana disebutkan oleh al-Dhahabi dalam indeks sumber “Tarikh al-Islam” {cite:tarikh-islam-dhahabi sa 601-610 p. 738}; dan al-Zarkali, dalam “al-A’lam,” hanya menyebutkan tahun 1302 M, yaitu tahun penulisan kitab tersebut {cite:al-aalam j.3 p. 149}."
