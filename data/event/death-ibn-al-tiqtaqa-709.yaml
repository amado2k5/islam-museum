  en: "Death of Ibn al-Tiqtaqa, 709/1309"
  ur: "ابن طقطقی کی وفات، 709ھ/1309ء"
summary:
  ar: "توفي صفي الدين محمد بن علي المعروف بابن الطقطقي صاحب «الفخري» سنة ٧٠٩هـ كما يذكر الذهبي في فهرس مصادر «تاريخ الإسلام» {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}؛ وقصر الزركلي في «الأعلام» على ذكر سنة ١٣٠٢م، أي العام الذي أُلّف فيه الكتاب {cite:al-aalam j.3 p. 149}."
  en: "Safi al-Din Muhammad ibn Ali, known as Ibn al-Tiqtaqa, author of al-Fakhri, died in 709 AH as al-Dhahabi's source list to the Tarikh al-Islam records {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}; al-Zirikli in al-A'lam gives only 1302 CE, the year the book was composed {cite:al-aalam j.3 p. 149}."
  ur: "صفی الدین محمد بن علی المعروف ابن طقطقی، صاحب «فخری»، 709ھ میں فوت ہوئے جیسا کہ ذہبی نے تاریخ الاسلام کی فہرست مآخذ میں لکھا ہے {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738}؛ زرکلی نے «الاعلام» میں صرف 1302ء لکھا ہے، یعنی وہی سال جس میں کتاب مرتب ہوئی {cite:al-aalam j.3 p. 149}۔"
