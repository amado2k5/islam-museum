label: { ar: "غزوة سلمان الخيل لأران والقوقاز", en: "Salman al-Khayl's Campaign in Arran and the Caucasus", es: "La campaña de Salman al-Khayl en Arran y el Cáucaso", fr: "La campagne de Salman al-Khayl à Arran et dans le Caucase" }
summary:
  ar: "عند البلاذري: سار سلمان بن ربيعة الباهلي حين أمره عثمان بالمسير إلى أران ففتح مدينة البيلقان صلحاً على أن أمّنهم على دمائهم وأموالهم وحيطان مدينتهم واشترط عليهم أداء الجزية والخراج، ثم أتى برذعة فعسكر على الثرثور — وهو نهر منها على أقل من فرسخ — فأغلق أهلها دونه أبوابهم فعاناها أياماً وشنّ الغارات في قراها وكانت زروعها مستحصدة فصالحوه على مثل صلح البيلقان ففتحوا له أبوابها فدخلها وأقام بها، ووجّه خيله ففتحت شفشين والمسفوان وأوذ والمسريان والهرحليان وتبار — وهي رساتيق — وفتح غيرها من أران ودعا أكراد اللاسجان إلى الإسلام فقاتلوه فظفر بهم فأقرّ بعضهم بالجزية وأدّى بعض الصدقة وهم قليل؛ ثم سار سلمان إلى مجمع الرس والكُرّ خلف برذعة فعبر الكُرّ ففتح قبلة وصالحه صاحب شكن والقميران على أتاوة وصالحه أهل خيزان وملك شروان وسائر ملوك الجبال وأهل مسقط والشابران ومدينة الباب."
  en: "In al-Baladhuri: Salman ibn Rabi'a al-Bahili marched when Uthman ordered him to Arran, taking the city of al-Baylaqan by treaty — securing their blood, wealth and city walls on condition of jizya and kharaj — then came to Bardha'a, camping on the al-Tharthur river less than a farsakh out; its people shut their gates against him, and he strove against it days, launching raids into its villages while its crops stood harvested, until they compounded on the like of al-Baylaqan's treaty, opened the gates, and he entered and stayed; he sent his cavalry who took Shafshin, al-Masfuwan, Awz, al-Misriyyan, al-Harhilyan and Tabar — these being rustaqs — and other forts of Arran, and called the Kurds of al-Lasjan to Islam — they fought him, he overcame them, some submitting to jizya and a few paying sadaqa; then Salman marched to the confluence of the al-Rass and the Kurr beyond Bardha'a, crossed the Kurr, took Qabala, and the lord of Shakkan and al-Qamiran compounded for tribute, as did the people of Khizan, the king of Shirwan, the rest of the mountain kings, and the people of Masqat, al-Shabiran and the city of al-Bab."
  es: "En al-Baladhuri: Salman ibn Rabi'a al-Bahili marchó cuando Uthman le ordenó ir a Arran, tomando la ciudad de al-Baylaqan por tratado, asegurándose su sangre, riquezas y murallas a cambio de jizya y kharaj, luego llegó a Bardha'a, acampando en el río al-Tharthur a menos de un farsakh de distancia; su gente le cerró las puertas, y él luchó contra ellos durante días, lanzando incursiones en sus aldeas mientras sus cosechas estaban recolectadas, hasta que llegaron a un acuerdo similar al tratado de al-Baylaqan, abrieron las puertas, y él entró y se quedó; Envió su caballería, que tomó Shafshin, al-Masfuwan, Awz, al-Misriyyan, al-Harhilyan y Tabar —que eran rustaqs— y otros fuertes de Arran, y llamó a los kurdos de al-Lasjan al Islam; lucharon contra él, los venció, algunos se sometieron a la jizya y unos pocos pagaron sadaqa; luego Salman marchó hasta la confluencia del al-Rass y el Kurr más allá de Bardha'a, cruzó el Kurr, tomó Qabala, y el señor de Shakkan y al-Qamiran pagó tributo, al igual que la gente de Khizan, el rey de Shirwan, el resto de los reyes de las montañas y la gente de Masqat, al-Shabiran y la ciudad de al-Bab."
  fr: "Dans al-Baladhuri: Salman ibn Rabi'a al-Bahili marcha sur l'ordre d'Uthman vers Arran, prenant la ville d'al-Baylaqan par traité — s'assurant ainsi le sang, les richesses et les remparts de la ville à condition de jizya et de kharaj — puis arriva à Bardha'a, campant sur la rivière al-Tharthur à moins d'un farsakh; ses habitants lui fermèrent leurs portes, et il lutta contre eux pendant des jours, lançant des raids dans leurs villages alors que leurs récoltes étaient encore moissonnées, jusqu'à ce qu'ils concluent un traité semblable à celui d'al-Baylaqan, ouvrent les portes, et il entra et resta; Il envoya sa cavalerie qui prit Shafshin, al-Masfuwan, Awz, al-Misriyyan, al-Harhilyan et Tabar — ces forteresses étant des rustaqs — ainsi que d'autres forts d'Arran, et appela les Kurdes d'al-Lasjan à l'islam — ils le combattirent, il les vainquit, certains se soumettant à la jizya et quelques-uns payant la sadaqa; puis Salman marcha jusqu'au confluent de l'al-Rass et du Kurr au-delà de Bardha'a, traversa le Kurr, prit Qabala, et le seigneur de Shakkan et d'al-Qamiran paya un tribut, tout comme les habitants de Khizan, le roi de Shirwan, le reste des rois des montagnes, et les habitants de Masqat, d'al-Shabiran et de la ville d'al-Bab."
