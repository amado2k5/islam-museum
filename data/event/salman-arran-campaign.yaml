label: { ar: "غزوة سلمان الخيل لأران والقوقاز", en: "Salman al-Khayl's Campaign in Arran and the Caucasus" }
summary:
  ar: "عند البلاذري: سار سلمان بن ربيعة الباهلي حين أمره عثمان بالمسير إلى أران ففتح مدينة البيلقان صلحاً على أن أمّنهم على دمائهم وأموالهم وحيطان مدينتهم واشترط عليهم أداء الجزية والخراج، ثم أتى برذعة فعسكر على الثرثور — وهو نهر منها على أقل من فرسخ — فأغلق أهلها دونه أبوابهم فعاناها أياماً وشنّ الغارات في قراها وكانت زروعها مستحصدة فصالحوه على مثل صلح البيلقان ففتحوا له أبوابها فدخلها وأقام بها، ووجّه خيله ففتحت شفشين والمسفوان وأوذ والمسريان والهرحليان وتبار — وهي رساتيق — وفتح غيرها من أران ودعا أكراد اللاسجان إلى الإسلام فقاتلوه فظفر بهم فأقرّ بعضهم بالجزية وأدّى بعض الصدقة وهم قليل؛ ثم سار سلمان إلى مجمع الرس والكُرّ خلف برذعة فعبر الكُرّ ففتح قبلة وصالحه صاحب شكن والقميران على أتاوة وصالحه أهل خيزان وملك شروان وسائر ملوك الجبال وأهل مسقط والشابران ومدينة الباب."
  en: "In al-Baladhuri: Salman ibn Rabi'a al-Bahili marched when Uthman ordered him to Arran, taking the city of al-Baylaqan by treaty — securing their blood, wealth and city walls on condition of jizya and kharaj — then came to Bardha'a, camping on the al-Tharthur river less than a farsakh out; its people shut their gates against him, and he strove against it days, launching raids into its villages while its crops stood harvested, until they compounded on the like of al-Baylaqan's treaty, opened the gates, and he entered and stayed; he sent his cavalry who took Shafshin, al-Masfuwan, Awz, al-Misriyyan, al-Harhilyan and Tabar — these being rustaqs — and other forts of Arran, and called the Kurds of al-Lasjan to Islam — they fought him, he overcame them, some submitting to jizya and a few paying sadaqa; then Salman marched to the confluence of the al-Rass and the Kurr beyond Bardha'a, crossed the Kurr, took Qabala, and the lord of Shakkan and al-Qamiran compounded for tribute, as did the people of Khizan, the king of Shirwan, the rest of the mountain kings, and the people of Masqat, al-Shabiran and the city of al-Bab."
