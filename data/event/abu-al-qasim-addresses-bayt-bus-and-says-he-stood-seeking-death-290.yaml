label:
  ar: "مخاطبة أبي القاسم بيت بوس وقوله إنه قام يطلب القتل، ص258-259، 290هـ"
  en: "Abu al-Qasim addresses Bayt Bus and says he stood seeking death, pp. 258-259, 290 AH"
  ur: "ابو القاسم کا بیت بوس سے خطاب اور یہ کہنا کہ وہ قتل کی طلب میں اٹھے تھے، ص258-259، 290ھ"
summary:
  ar: "مقطوعتان: يخاطب أبو القاسم بيت بوس ويقول إن حبسه هيّن وإن الدهر ذو عقب، ثم يقول إنه ما قام إلا طالباً للقتل راضياً، وإن الحبس والقيد لا يهولانه، ويذكر تربية أبيه له بحكم الكتاب."
  en: "Two pieces: Abu al-Qasim addresses Bayt Bus and says his imprisonment is light for him and that time turns; then he says he stood only seeking death, content in God, and that prison and fetter do not frighten him, and he recalls that his father raised him by the Book."
  ur: "دو ٹکڑے: ابو القاسم بیت بوس سے مخاطب ہو کر کہتے ہیں کہ ان کی قید ان کے لیے ہلکی ہے اور زمانہ پلٹتا ہے؛ پھر کہتے ہیں کہ وہ صرف قتل کی طلب میں اللہ میں راضی ہو کر اٹھے، قید اور بیڑی انہیں نہیں ڈراتی، اور والد نے انہیں کتاب کے حکم پر پالا۔"
