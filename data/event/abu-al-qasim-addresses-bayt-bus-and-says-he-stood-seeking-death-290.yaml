id: event/abu-al-qasim-addresses-bayt-bus-and-says-he-stood-seeking-death-290
class: event
kind: other
label:
  ar: "مخاطبة أبي القاسم بيت بوس وقوله إنه قام يطلب القتل، ص258-259، 290هـ"
  en: "Abu al-Qasim addresses Bayt Bus and says he stood seeking death, pp. 258-259, 290 AH"
  fr: "Abu al-Qasim s’adresse à Bayt Bus et dit qu’il se tenait là en quête de mort, p. 258-259, 290 de l’hégire"
  ur: "ابو القاسم کا بیت بوس سے خطاب اور یہ کہنا کہ وہ قتل کی طلب میں اٹھے تھے، ص258-259، 290ھ"
  es: "Abu al-Qasim se dirige a Bayt Bus y dice que buscaba la muerte, págs. 258-259, 290 AH"
  tr: "Ebu el-Kasım Beit Bos'a hitaben, öldürülmek için ayağa kalktığını söyleyen, s. 258-259, 290 Hicri"
  id: "Menyapa Abu al-Qasim Beit Bos dan mengatakan bahwa dia bangkit dengan tujuan untuk dibunuh, hlm. 258-259, 290 H"
summary:
  ar: "مقطوعتان: يخاطب أبو القاسم بيت بوس ويقول إن حبسه هيّن وإن الدهر ذو عقب، ثم يقول إنه ما قام إلا طالباً للقتل راضياً، وإن الحبس والقيد لا يهولانه، ويذكر تربية أبيه له بحكم الكتاب."
  en: "Two pieces: Abu al-Qasim addresses Bayt Bus and says his imprisonment is light for him and that time turns; then he says he stood only seeking death, content in God, and that prison and fetter do not frighten him, and he recalls that his father raised him by the Book."
  fr: "Deux pièces : Abu al-Qasim s’adresse à Bayt Bus, dit que son emprisonnement lui est léger et que le temps change ; puis il affirme qu’il ne se tenait là qu’en quête de mort, satisfait en Dieu, que prison et chaînes ne l’effraient pas, et rappelle que son père l’a élevé selon le Livre."
  ur: "دو ٹکڑے: ابو القاسم بیت بوس سے مخاطب ہو کر کہتے ہیں کہ ان کی قید ان کے لیے ہلکی ہے اور زمانہ پلٹتا ہے؛ پھر کہتے ہیں کہ وہ صرف قتل کی طلب میں اللہ میں راضی ہو کر اٹھے، قید اور بیڑی انہیں نہیں ڈراتی، اور والد نے انہیں کتاب کے حکم پر پالا۔"
  es: "Dos partes: Abu al-Qasim se dirige a Bayt Bus y dice que su encarcelamiento es leve para él y que el tiempo pasa; luego dice que solo buscaba la muerte, contento en Dios, y que la prisión y las cadenas no le asustan, y recuerda que su padre lo educó con el Libro."
  tr: "İki bölümden oluşuyor: Ebu el-Kâsım, Beyt Bos'a hitaben, hapis cezasının kolay olduğunu ve zamanın sonuçları olduğunu söylüyor; ardından, ölümü isteyerek aradığını, hapis ve zincirlerin kendisini korkutmadığını belirtiyor ve babasının kendisini Kitaba göre nasıl yetiştirdiğinden bahsediyor."
  id: "Dua bagian: Abu al-Qasim berbicara kepada Beit Bos dan mengatakan bahwa pemenjaraannya mudah dan bahwa waktu memiliki konsekuensi, kemudian dia mengatakan bahwa dia hanya berdiri mencari kematian dengan sukarela, dan bahwa pemenjaraan dan rantai tidak menakutinya, dan dia menyebutkan didikan ayahnya kepadanya sesuai dengan Kitab Suci."
