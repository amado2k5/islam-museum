label:
  ar: "عبد الله بن بسطام يلقى الهادي بيولس، وبنو الحارث يقبلون طاعته بالهجر، 294هـ، ص336"
  en: "Abdallah ibn Bistam meets al-Hadi at Yulis, and Banu al-Harith submit to him at al-Hijr, 294 AH, p. 336"
  ur: "عبداللہ بن بسطام کا یولس میں ہادی سے ملنا، اور بنی الحارث کا الہجر میں اطاعت قبول کرنا، 294ھ، ص336"
  fr: "Abdallah ibn Bistam rencontre al-Hadi à Yulis, et les Banu al-Harith se soumettent à lui à al-Hijr, 294 H, p. 336"
  es: "Abdallah ibn Bistam se encuentra con al-Hadi en Yulis, y Banu al-Harith se somete a él en al-Hijr, 294 AH, p. 336"
  tr: "Abdullah ibn Bustam, Yulus'ta el-Hadi ile tanışır ve Banu el-Haris, el-Hajr'da onun biatını kabul eder, 294 H., s. 336"
  id: "Abdullah ibn Bustam bertemu al-Hadi di Yulus, dan Bani al-Harits menerima kesetiaannya di al-Hajr, 294 H, hal. 336"
summary:
  ar: "لقي الهادي عبد الله بن بسطام بيولس، ثم أقبلت بنو الحارث إليه بالطاعة سوى الحارث بن حميد والحماسيين."
  en: "Al-Hadi met Abdallah ibn Bistam at Yulis; then Banu al-Harith came to him in submission, except al-Harith ibn Humayd and the Hamasiyin."
  ur: "ہادی کی یولس میں عبداللہ بن بسطام سے ملاقات ہوئی؛ پھر بنی الحارث سوائے الحارث بن حمید اور الحماسیین کے اطاعت کے ساتھ ان کے پاس آئے۔"
  fr: "Al-Hadi rencontra Abdallah ibn Bistam à Yulis ; puis les Banu al-Harith vinrent à lui en se soumettant, sauf al-Harith ibn Humayd et les Hamasiyin."
  es: "Al-Hadi se reunió con Abdallah ibn Bistam en Yulis; luego, los Banu al-Harith se sometieron a él, excepto al-Harith ibn Humayd y los Hamasiyin."
  tr: "El-Hadi, Yulus'ta Abdullah bin Bustam ile görüştü; ardından El-Harith bin Hamid ve Hamasiyyin hariç, Beni el-Harith kabilesi ona itaat ederek geldi."
  id: "Al-Hadi bertemu Abdullah bin Bustam di Yulus, kemudian Bani al-Harith datang kepadanya dalam ketaatan, kecuali al-Harith bin Hamid dan Hamasiyyin."
