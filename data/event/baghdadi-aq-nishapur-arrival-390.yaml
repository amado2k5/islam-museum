id: event/baghdadi-aq-nishapur-arrival-390
class: event
kind: other
label:
  ar: "عبد القاهر البغدادي يرد نيسابور مع أبيه طاهر، نحو ٣٩٠هـ"
  en: "Abd al-Qahir al-Baghdadi reaches Nishapur with his father Tahir, c. 390/1000"
  ur: "عبدالقاہر بغدادی اپنے والد طاہر کے ساتھ نیشاپور پہنچے، تقریباً 390ھ/1000ء"
summary:
  ar: "وُلد عبد القاهر بن طاهر بن محمد التميمي أبو منصور ببغداد ونشأ بها، ثم سافر مع أبيه أبي عبد الله طاهر إلى خراسان فسكنا نيسابور؛ وكان أبوه ذا مال وثروة ومروءة فأنفقه عبد القاهر على أهل العلم والحديث ولم يكتسب بعلمه مالاً {cite:mawsuat-a3lam-ulama-adaba p. 634} {cite:tabaqat-shafiiyya-subki p. 238}؛ والتاريخ تقريبي قبل دراسته على أبي إسحاق الإسفراييني المتوفى سنة ٤١٨هـ {cite:mawsuat-a3lam-ulama-adaba pp. 634-635}."
  en: "Abd al-Qahir ibn Tahir ibn Muhammad al-Tamimi, Abu Mansur, was born and raised in Baghdad, then travelled with his father Abu Abdallah Tahir to Khurasan and settled at Nishapur; the father was a man of wealth and honour, and the son spent it on the people of learning and hadith without earning money by his own scholarship {cite:mawsuat-a3lam-ulama-adaba p. 634} {cite:tabaqat-shafiiyya-subki p. 238}; the date is approximate, before his studies under Abu Ishaq al-Isfarayini who died in 418 {cite:mawsuat-a3lam-ulama-adaba pp. 634-635}."
  ur: "عبدالقاہر بن طاہر بن محمد تمیمی ابو منصور بغداد میں پیدا ہوئے اور وہیں پلے، پھر اپنے والد ابو عبداللہ طاہر کے ساتھ خراسان آئے اور نیشاپور میں مقیم ہوئے؛ والد مالدار اور باعزت تھے اور بیٹے نے یہ مال اہل علم و حدیث پر خرچ کیا، اپنے علم سے مال نہیں کمایا {cite:mawsuat-a3lam-ulama-adaba p. 634} {cite:tabaqat-shafiiyya-subki p. 238}؛ تاریخ تقریبی ہے، ابو اسحاق اسفرائینی ⁦(متوفی 418ھ)⁩ سے تحصیل سے پہلے {cite:mawsuat-a3lam-ulama-adaba pp. 634-635}۔"
