label: { ar: "أخذ الإنجليز الملتان ١٨٤٨-١٨٤٩م", en: "The British take Multan, 1848-1849" }
summary:
  ar: "في سنة ١٨٤٥م بدأ الإنجليز حملتهم على دولة السيخ المتفككة في البنجاب؛ وبعد اعتداء وقع في الملتان على ضابطين إنجليزيين سنة ١٨٤٨م احتل الإنجليز المدينة وضمّوها مع سائر الإقليم إلى ممتلكاتهم سنة ١٨٤٩م {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In 1845 the British began their campaign against the disintegrating Sikh state in the Panjab; after an assault in Multan on two British officers in 1848 the city was occupied by the British and annexed, with the rest of the province, to their possessions in 1849 {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "1845ء میں انگریزوں نے پنجاب کی بکھرتی ہوئی سکھ ریاست کے خلاف مہم شروع کی؛ ملتان میں دو انگریز افسروں پر 1848ء کے حملے کے بعد شہر پر انگریز قابض ہوئے اور 1849ء میں اسے باقی صوبے سمیت اپنی جاگیر میں ضم کر لیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
