summary:
  ar: "راسل بركة الملك الظاهر بيبرس ثم كانت وقعة هائلة بين بركة وبين ابن عمه هولاكو فانهزم هولاكو ولله الحمد وقتل خلق من رجاله وغرق خلق {cite:shadharat-dhahab p. 305}."
  en: "Berke corresponded with Baybars, then came the mighty battle between Berke and his cousin Hulagu — the first war of Mongol upon Mongol — in which Hulagu was routed, praise God, with multitudes of his men slain and drowned {cite:shadharat-dhahab p. 305}."
  fr: "Berke correspondit avec Baybars, puis vint la puissante bataille entre Berke et son cousin Hülegü, la première guerre de Mongols contre Mongols, où Hülegü fut mis en déroute, louange à Dieu, une multitude de ses hommes ayant été tués et noyés {cite:shadharat-dhahab p. 305}."
  es: "Berke se carteó con Baybars, luego vino la poderosa batalla entre Berke y su primo Hulagu —la primera guerra de mongol contra mongol— en la que Hulagu fue derrotado, alabado sea Dios, con multitudes de sus hombres muertos y ahogados {cite:shadharat-dhahab p. 305}."
