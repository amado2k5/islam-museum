id: event/abd-al-rahman-iii-minaret-cordoba
class: event
kind: founding
label: { ar: "صومعة عبد الرحمن الناصر على جامع قرطبة", en: "Al-Nasir's minaret on the mosque", fr: "Le minaret d’al-Nasir à la mosquée", es: "El minarete de Al-Nasir en la mezquita", ur: "مسجد پر النصیر کا مینار", tr: "Kurtuba Ulu Camii'ndeki Abdülrahman el-Nasır'ın minaresi.", id: "Menara Abd al-Rahman al-Nasir di Masjid Agung Cordoba" }
summary:
  ar: "بنى عبد الرحمن الناصر صومعة جامع قرطبة الشهيرة نحو سنة 951م، وكانت تُصعد بدرجين متخالفين وتحمل تفاحات الذهب والفضة {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
  en: "Abd al-Rahman al-Nasir built the mosque's celebrated minaret about 951 — climbed by twin staircases meeting only at the top and bearing apples of gold and silver {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
  fr: "Abd al-Rahman al-Nasir construisit le célèbre minaret de la mosquée vers 951 ; on y montait par deux escaliers qui ne se rejoignaient qu’au sommet, et il portait des pommes d’or et d’argent {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
  ur: "عبد الرحمن الناصر نے تقریباً 951ء میں مسجد کا مشہور مینار بنوایا جس میں دو الگ سیڑھیاں صرف چوٹی پر ملتیں اور سونے چاندی کے سیب لگے تھے {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
  es: "Abd al-Rahman al-Nasir construyó el célebre minarete de la mezquita alrededor del año 951, al que se accede por dos escaleras gemelas que se unen solo en la cima y que tienen manzanas de oro y plata {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
  tr: "Abdülrahman el-Nasir, Kurtuba Ulu Camii'nin ünlü minaresini yaklaşık 951 yılında inşa ettirmiştir. Minareye karşılıklı iki merdivenle çıkılıyordu ve üzerinde altın ve gümüş elmalar bulunuyordu. {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 s. 212-214}."
  id: "Abd al-Rahman al-Nasir membangun menara terkenal Masjid Agung Cordoba sekitar tahun 951 M. Menara ini diakses melalui dua tangga yang saling berhadapan dan memiliki apel emas dan perak. {cite:nafh-tib-maqqari} {cite:umari-masalik-1924 p. 212-214}."
