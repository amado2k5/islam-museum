id: "event/al-hadi-ila-al-haqq-dies-at-saada-in-dhu-al-hijja-298-ah-and-his-son-is-pledged"
class: event
kind: other
label:
  ar: "وفاة الهادي إلى الحق بصعدة في ذي الحجة سنة 298هـ، وبيعة ابنه في المحرم سنة 299هـ، ص397"
  en: "Al-Hadi ila al-Haqq dies at Sa'da in Dhu al-Hijja 298 AH and his son is pledged in Muharram 299 AH, p. 397"
  ur: "ہادی الی الحق کی صعدہ میں ذوالحجہ 298ھ میں وفات، اور ان کے بیٹے کی محرم 299ھ میں بیعت، ص397"
  es: "Al-Hadi ila al-Haqq muere en Sa'da en Dhu al-Hijja 298 AH y su hijo es prometido en Muharram 299 AH, pág. 397"
summary:
  ar: "توفي الهادي إلى الحق يحيى بن الحسين بصعدة يوم الأحد لعشر باقية من ذي الحجة سنة 298هـ، ودُفن يوم الإثنين قبل الزوال، وبايع الناس ابنه أبا القاسم محمد بن يحيى يوم الخميس مستهل المحرم سنة 299هـ."
  en: "Al-Hadi ila al-Haqq Yahya ibn al-Husayn dies at Sa'da on Sunday, ten nights before the end of Dhu al-Hijja 298 AH, and is buried on Monday before noon. People pledge allegiance to his son Abu al-Qasim Muhammad ibn Yahya on Thursday, the first of Muharram 299 AH."
  ur: "ہادی الی الحق یحییٰ بن الحسین ذوالحجہ 298ھ کے آخر سے دس راتیں پہلے اتوار کے دن صعدہ میں وفات پاتے ہیں اور پیر کو زوال سے پہلے دفن ہوتے ہیں۔ لوگ جمعرات، محرم 299ھ کی پہلی تاریخ کو ان کے بیٹے ابو القاسم محمد بن یحییٰ کی بیعت کرتے ہیں۔"
  es: "Al-Hadi ila al-Haqq Yahya ibn al-Husayn falleció en Sa'da el domingo, diez noches antes del final de Dhu al-Hijja del año 298 AH, y fue enterrado el lunes antes del mediodía. El jueves, primer día de Muharram del año 299 AH, la gente juró lealtad a su hijo Abu al-Qasim Muhammad ibn Yahya."
