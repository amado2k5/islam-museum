label: { ar: "حصر الفرنج بانياس وعودهم عنها", en: "the Franks besiege Bānyās — Ibn al-Muqaddam's bluff sends them home", es: "Los francos asedian Bānyās; el farol de Ibn al-Muqaddam los obliga a regresar a casa.", fr: "Les Francs assiègent Bānyās — Le bluff d'Ibn al-Muqaddam les fait rentrer chez eux" }
