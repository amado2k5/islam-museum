label: { ar: "حصر الفرنج بانياس وعودهم عنها", en: "the Franks besiege Bānyās — Ibn al-Muqaddam's bluff sends them home", es: "Los francos asedian Bānyās; el farol de Ibn al-Muqaddam los obliga a regresar a casa.", fr: "Les Francs assiègent Bānyās — Le bluff d'Ibn al-Muqaddam les fait rentrer chez eux", ur: "فرینکوں نے بنیاس کا محاصرہ کیا - ابن المقدم کی بلف نے انہیں گھر بھیج دیا", tr: "Franklar Banias'ı kuşattılar ve oradan çekildiler.", id: "Pasukan Frank mengepung Banias dan kemudian mundur." }
date:
  start: { edtf: "1173~", hijri: "0569", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "لما مات نور الدين اجتمعت الفرنج وساروا إلى بانياس فحصروها، فخرج إليها شمس الدين ابن المقدم بعسكر دمشق فراسلهم ولاطفهم ثم أغلظ: إن صالحتمونا وعدتم فنحن على ما كنا، وإلا نستنجد سيف الدين بالموصل وصلاح الدين بمصر ونقصد بلادكم من جهاتها كلها ولا تقومون لنا، وقد زال عن صلاح الدين خوف نور الدين فإذا طلبناه لا يمتنع، فعلموا صدقه فصالحوه على مال وأسرى أطلقوهم وتقررت الهدنة {cite:kamil-ibn-al-athir p. 60}."
  en: "The moment Nūr al-Dīn died the Franks besieged Bānyās. Shams al-Dīn Ibn al-Muqaddam marched out with Damascus's army and played good cop, bad cop in one letter: settle and withdraw, or we summon Sayf al-Dīn from Mosul and Saladin from Egypt — who no longer fears Nūr al-Dīn — and come at your lands from every side. Believing him, they made peace for money and freed captives {cite:kamil-ibn-al-athir p. 60}."
  es: "En el momento en que murió Nūr al-Dīn, los francos sitiaron Bānyās. Shams al-Dīn Ibn al-Muqaddam marchó con el ejército de Damasco y, en una carta, adoptó una estrategia ambigua: «Resuelvan la situación y retírense, o convocaremos a Sayf al-Dīn de Mosul y a Saladino de Egipto —quien ya no teme a Nūr al-Dīn— y atacaremos sus tierras por todos lados». Confiando en él, firmaron la paz a cambio de dinero y liberaron a los cautivos {cita:kamil-ibn-al-athir, pág. 60}."
  fr: "Dès la mort de Nūr al-Dīn, les Francs assiégèrent Bānyās. Shams al-Dīn Ibn al-Muqaddam sortit avec l'armée de Damas et, dans une lettre, joua sur les deux tableaux: « Négociez et retirez-vous, sinon nous ferons venir Sayf al-Dīn de Mossoul et Saladin d'Égypte – qui ne craint plus Nūr al-Dīn – et nous attaquerons vos terres de toutes parts. » Croyant en lui, ils conclurent la paix contre de l'argent et libérèrent les captifs (voir: Kamil Ibn al-Athir, p. 60)."
  ur: "جس لمحے نورالدین کی موت ہوئی فرانکس نے بنیا کا محاصرہ کر لیا۔ شمس الدین ابن المقدم دمشق کی فوج کے ساتھ نکلا اور ایک ہی خط میں اچھے پولیس والے، بری پولیس والے کا کردار ادا کیا: حل کرو اور واپس لو، یا ہم سیف الدین کو موصل سے اور صلاح الدین کو مصر سے بلوائیں - جو اب نورالدین سے نہیں ڈرتا ہے - اور ہر طرف سے اپنی سرزمین پر آئے۔ اس پر یقین کرتے ہوئے، انہوں نے مال کے لیے صلح کی اور اسیروں کو آزاد کر دیا۔ 60}۔"
  tr: "Nur ed-Din öldüğünde, Franklar toplanıp Banias'a yürüdüler ve şehri kuşattılar. Şems ed-Din İbn el-Mukaddim, Şam ordusuyla birlikte Banias'a gitti, onlara mesajlar gönderdi ve onları pohpohladı, sonra sertleşti: \"Eğer bizimle barış yapıp geri dönerseniz, eski halimize döneriz; aksi takdirde Musul'daki Seyf ed-Din'den ve Mısır'daki Selahaddin'den yardım isteyeceğiz ve topraklarınıza her yönden saldıracağız ve bize karşı koyamayacaksınız. Selahaddin, Nur ed-Din'den korkusunu kaybetti, bu yüzden ondan istersek reddetmeyecektir.\" Samimiyetini anladılar ve para ve esirleri serbest bırakmaları karşılığında onunla barış yaptılar ve ateşkes sağlandı. {Kaynak: Kamil İbn el-Athir, s. 60}"
  id: "Ketika Nur ad-Din meninggal, orang-orang Frank berkumpul dan berbaris ke Banias dan mengepungnya. Shams ad-Din Ibn al-Muqaddam pergi ke sana dengan pasukan Damaskus dan mengirimkan pesan serta merayu mereka, kemudian ia menjadi keras: Jika kalian berdamai dengan kami dan kembali, kami akan kembali seperti semula, jika tidak, kami akan meminta bantuan dari Saif ad-Din di Mosul dan Saladin di Mesir dan menyerang wilayah kalian dari segala arah dan kalian tidak akan mampu melawan kami. Saladin telah kehilangan rasa takutnya kepada Nur ad-Din, jadi jika kami memintanya, dia tidak akan menolak. Mereka mengetahui ketulusannya dan berdamai dengannya dengan imbalan uang dan tawanan yang mereka bebaskan, dan gencatan senjata pun ditegakkan. {cite:kamil-ibn-al-athir p. 60}."
