summary:
  ar: "لما مات نور الدين اجتمعت الفرنج وساروا إلى بانياس فحصروها، فخرج إليها شمس الدين ابن المقدم بعسكر دمشق فراسلهم ولاطفهم ثم أغلظ: إن صالحتمونا وعدتم فنحن على ما كنا، وإلا نستنجد سيف الدين بالموصل وصلاح الدين بمصر ونقصد بلادكم من جهاتها كلها ولا تقومون لنا، وقد زال عن صلاح الدين خوف نور الدين فإذا طلبناه لا يمتنع، فعلموا صدقه فصالحوه على مال وأسرى أطلقوهم وتقررت الهدنة {cite:kamil-ibn-al-athir p. 60}."
  en: "The moment Nūr al-Dīn died the Franks besieged Bānyās. Shams al-Dīn Ibn al-Muqaddam marched out with Damascus's army and played good cop, bad cop in one letter: settle and withdraw, or we summon Sayf al-Dīn from Mosul and Saladin from Egypt — who no longer fears Nūr al-Dīn — and come at your lands from every side. Believing him, they made peace for money and freed captives {cite:kamil-ibn-al-athir p. 60}."
