summary:
  ar: "لما مات نور الدين اجتمعت الفرنج وساروا إلى بانياس فحصروها، فخرج إليها شمس الدين ابن المقدم بعسكر دمشق فراسلهم ولاطفهم ثم أغلظ: إن صالحتمونا وعدتم فنحن على ما كنا، وإلا نستنجد سيف الدين بالموصل وصلاح الدين بمصر ونقصد بلادكم من جهاتها كلها ولا تقومون لنا، وقد زال عن صلاح الدين خوف نور الدين فإذا طلبناه لا يمتنع، فعلموا صدقه فصالحوه على مال وأسرى أطلقوهم وتقررت الهدنة {cite:kamil-ibn-al-athir p. 60}."
  en: "The moment Nūr al-Dīn died the Franks besieged Bānyās. Shams al-Dīn Ibn al-Muqaddam marched out with Damascus's army and played good cop, bad cop in one letter: settle and withdraw, or we summon Sayf al-Dīn from Mosul and Saladin from Egypt — who no longer fears Nūr al-Dīn — and come at your lands from every side. Believing him, they made peace for money and freed captives {cite:kamil-ibn-al-athir p. 60}."
  es: "En el momento en que murió Nūr al-Dīn, los francos sitiaron Bānyās. Shams al-Dīn Ibn al-Muqaddam marchó con el ejército de Damasco y, en una carta, adoptó una estrategia ambigua: «Resuelvan la situación y retírense, o convocaremos a Sayf al-Dīn de Mosul y a Saladino de Egipto —quien ya no teme a Nūr al-Dīn— y atacaremos sus tierras por todos lados». Confiando en él, firmaron la paz a cambio de dinero y liberaron a los cautivos {cita:kamil-ibn-al-athir, pág. 60}."
  fr: "Dès la mort de Nūr al-Dīn, les Francs assiégèrent Bānyās. Shams al-Dīn Ibn al-Muqaddam sortit avec l'armée de Damas et, dans une lettre, joua sur les deux tableaux: « Négociez et retirez-vous, sinon nous ferons venir Sayf al-Dīn de Mossoul et Saladin d'Égypte – qui ne craint plus Nūr al-Dīn – et nous attaquerons vos terres de toutes parts. » Croyant en lui, ils conclurent la paix contre de l'argent et libérèrent les captifs (voir: Kamil Ibn al-Athir, p. 60)."
