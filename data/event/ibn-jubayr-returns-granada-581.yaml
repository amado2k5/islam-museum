summary:
  ar: "عاد ابن جبير إلى غرناطة سنة 581هـ بعد سنتين من الرحلة وصنّف «تذكرة بالأخبار عما يقتضيه سفر القطرين» {cite:rihla-ibn-jubayr-1907}."
  en: "Ibn Jubayr returned to Granada in 581/1185 after two years' travel and wrote his rihla, the Tadhkira {cite:rihla-ibn-jubayr-1907}."
  ur: "581ھ میں ابن جبیر دو سال کے سفر کے بعد غرناطہ لوٹا اور اپنی رحلہ لکھی {cite:rihla-ibn-jubayr-1907}."
  es: "Ibn Jubayr regresó a Granada en 581/1185 después de dos años de viaje y escribió su rihla, la Tadhkira {cite:rihla-ibn-jubayr-1907}."
