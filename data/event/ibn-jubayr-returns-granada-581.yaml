  tr: "İbn Cübeyr, yolculuğun üzerinden iki yıl geçtikten sonra, Hicri 581 yılında Granada'ya döndü ve \"İki Ülkenin Yolculuğunun Gerektirdikleri Hakkında Haberlerin Kaydı\" adlı eseri derledi. {cite:rihla-ibn-jubayr-1907}"
  id: "Ibn Jubayr kembali ke Granada pada tahun 581 H, dua tahun setelah perjalanan tersebut, dan menyusun “Catatan Berita tentang Apa yang Diperlukan dalam Perjalanan Kedua Negeri” {cite:rihla-ibn-jubayr-1907}."
