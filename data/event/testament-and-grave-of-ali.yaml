id: event/testament-and-grave-of-ali
class: event
kind: death
tags: [wasaya-browser, wasaya-caliphs, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath, wasaya-marqad]
label: { ar: "وصية علي بن أبي طالب وغسله ودفنه وموضع قبره", en: "Testament, burial and grave of Ali ibn Abi Talib", ur: "علی بن ابی طالب کی وصیت، تدفین اور قبر", es: "Testamento, entierro y tumba de Ali ibn Abi Talib", fr: "Testament, sépulture et tombeau d'Ali ibn Abi Talib" }
summary:
  ar: "بعد أن ضربه ابن ملجم أمر علي بحبسه، فإن مات قُتل ولا يُمثَّل به {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 677}، وأوصى ابنيه الحسن والحسين بتقوى الله والصلاة والزكاة وكظم الغيظ وصلة الرحم وغيرها، وكتب وصية فيها الله الله في الأيتام والجيران والقرآن والصلاة {cite:al-bidaya-wal-nihaya scan vol. 4 p. 318} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. وتوفي ليلة الأحد، وغسله الحسن والحسين وعبد الله بن جعفر وصلى عليه الحسن {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. والمشهور عند ابن كثير أنه دُفن بدار الإمارة بالكوفة ليلاً وعُمّي قبره خوف الخوارج {cite:al-bidaya-wal-nihaya scan vol. 4 p. 320}، وتُنقل أقوال أخرى في موضع القبر منها البقيع والنجف {cite:al-bidaya-wal-nihaya scan vol. 4 p. 321}. وما خلّفه سبعمائة درهم من عطائه {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 596}."
  en: "After Ibn Muljam struck him Ali ordered him held, to be killed if he died but not mutilated {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 677}. He charged his sons al-Hasan and al-Husayn to fear God, pray, pay zakat, restrain anger and keep family ties, and wrote a testament commending orphans, neighbours, the Qur'an and prayer {cite:al-bidaya-wal-nihaya scan vol. 4 p. 318} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. He died on the night of Sunday; al-Hasan, al-Husayn and Abd Allah ibn Ja'far washed him and al-Hasan prayed over him {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. Ibn Kathir holds that he was buried by night in the Dar al-Imara at Kufa and the grave hidden for fear of the Kharijites {cite:al-bidaya-wal-nihaya scan vol. 4 p. 320}; other statements about the grave, including al-Baqi' and Najaf, are given with their sources {cite:al-bidaya-wal-nihaya scan vol. 4 p. 321}. He left seven hundred dirhams of his stipend {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 596}."
  ur: "ابن ملجم کے وار کے بعد علی نے حکم دیا کہ اسے قید رکھا جائے، وہ مر جائیں تو اسے قتل کیا جائے مگر مثلہ نہ ہو {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 677}۔ انھوں نے بیٹوں حسن اور حسین کو تقویٰ، نماز، زکاۃ، غصہ پینے اور صلہ رحمی وغیرہ کی وصیت کی اور ایک وصیت لکھوائی جس میں یتیموں، پڑوسیوں، قرآن اور نماز کے بارے میں تاکید ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 318} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}۔ وہ اتوار کی رات فوت ہوئے؛ حسن، حسین اور عبد اللہ بن جعفر نے غسل دیا اور حسن نے نماز پڑھائی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}۔ ابن کثیر کے نزدیک انھیں رات کو کوفہ کے دار الامارہ میں دفن کیا گیا اور خوارج کے خوف سے قبر چھپا دی گئی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 320}؛ قبر کے مقام کے دوسرے اقوال، بشمول بقیع اور نجف، ان کے ناقلین کے ساتھ دیے گئے ہیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 321}۔ انھوں نے اپنے وظیفے کے سات سو درہم چھوڑے {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 596}۔"
  es: "Después de que Ibn Muljam lo golpeara, Ali ordenó que lo retuvieran, para que lo mataran si moría pero no lo mutilaran {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 677}. Les encargó a sus hijos al-Hasan y al-Husayn que temieran a Dios, rezaran, pagaran el zakat, controlaran la ira y mantuvieran los lazos familiares, y escribió un testamento en el que elogiaba a los huérfanos, a los vecinos, al Corán y a la oración {cite:al-bidaya-wal-nihaya scan vol. 4 p. 318} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. Murió la noche del domingo; al-Hasan, al-Husayn y Abd Allah ibn Ja'far lo lavaron y al-Hasan rezó por él {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. Ibn Kathir sostiene que fue enterrado de noche en el Dar al-Imara en Kufa y que la tumba fue ocultada por temor a los jariyitas {cite:al-bidaya-wal-nihaya scan vol. 4 p. 320}; otras declaraciones sobre la tumba, incluyendo al-Baqi' y Najaf, se dan con sus fuentes {cite:al-bidaya-wal-nihaya scan vol. 4 p. 321}. Dejó setecientos dirhams de su estipendio {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 596}."
  fr: "Après qu'Ibn Muljam l'eut frappé, Ali ordonna qu'il soit détenu, avec la possibilité d'être tué s'il décédait, mais non mutilé (cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 677). Il exhorta ses fils al-Hasan et al-Husayn à craindre Dieu, à prier, à s'acquitter de la zakat, à maîtriser leur colère et à préserver les liens familiaux, et rédigea un testament faisant l'éloge des orphelins, des voisins, du Coran et de la prière (cite:al-bidaya-wal-nihaya scan vol. 4 p. 318) (cite:al-bidaya-wal-nihaya scan vol. 4 p. 319). Il mourut dans la nuit du dimanche; al-Hasan, al-Husayn et Abd Allah ibn Ja'far le lavèrent et al-Hasan pria sur lui (cite:al-bidaya-wal-nihaya scan vol. 4 p. 319). Ibn Kathir affirme qu'il fut enterré de nuit au Dar al-Imara de Kufa et que sa tombe fut dissimulée par crainte des Kharijites (cf. al-bidaya-wal-nihaya, vol. 4, p. 320). D'autres témoignages concernant sa tombe, notamment ceux d'al-Baqi' et de Najaf, sont cités avec leurs sources (cf. al-bidaya-wal-nihaya, vol. 4, p. 321). Il laissa sept cents dirhams de sa pension (cf. riyad-nadira-ilmiyya, 1984, vol. 3, p. 596)."
