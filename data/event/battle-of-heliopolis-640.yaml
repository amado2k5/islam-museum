summary:
  ar: "بطاقة أولية لمعركة عين شمس سنة ٦٤٠م، النصر الذي فتح لعمرو بن العاص طريق مصر بعد بابليون؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Heliopolis in 640, Amr ibn al-As's victory that opened the road into Egypt after Babylon; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Heliópolis en 640, la victoria de Amr ibn al-As que abrió el camino a Egipto después de Babilonia; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille d'Héliopolis en 640, la victoire d'Amr ibn al-As qui ouvrit la route vers l'Égypte après Babylone; ses sources ne sont pas encore vérifiées sur la page."
  ur: "640 میں ہیلیو پولس کی جنگ کے لیے ڈرافٹ کارڈ، عمرو بن العاص کی فتح جس نے بابل کے بعد مصر میں راستہ کھولا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "640 yılında gerçekleşen ve Amr ibn al-Aas'ın Babil'den sonra Mısır'a giriş yolunu açan Heliopolis Muharebesi'ne dair ön bir anlatım; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Heliopolis pada tahun 640 M, kemenangan yang membuka jalan bagi Amr ibn al-Aas ke Mesir setelah Babilonia; sumber-sumbernya belum ditinjau di halaman ini."
