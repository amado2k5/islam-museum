summary:
  ar: "في المحرم من السنة العاشرة من البعثة سعى هشام بن عمرو وزهير بن أبي أمية وانضم إليهما المطعم بن عدي وأبو البختري وزمعة بن الأسود في نقض الصحيفة التي علقتها قريش في الكعبة؛ فوجدوا الأرضة قد أكلتها إلا اسم الله، فخرج بنو هاشم من الشعب."
  en: "In Muharram of the tenth year of the mission Hisham ibn Amr and Zuhayr ibn Abi Umayya, joined by al-Mut'im ibn Adi, Abu al-Bakhtari and Zam'a ibn al-Aswad, moved to tear up the covenant Quraysh had hung in the Kaaba; they found that termites had eaten all of it except the Name of God, and Banu Hashim left the ravine."
