label: { ar: "نقض صحيفة المقاطعة وخروج بني هاشم من الشعب", en: "Nullification of the boycott covenant and the exit from Shi'b Abi Talib", es: "Anulación del pacto de boicot y salida de Shi'b Abi Talib.", fr: "Annulation du pacte de boycott et sortie de Shi'b Abi Talib", ur: "بائیکاٹ کے عہد کی منسوخی اور شعب ابی طالب سے خروج", tr: "Boykot belgesi reddedildi ve Beni Haşim halkı terk etti.", id: "Dokumen boikot itu ditolak, dan Bani Hasyim meninggalkan rakyat." }
summary:
  ar: "في المحرم من السنة العاشرة من البعثة سعى هشام بن عمرو وزهير بن أبي أمية وانضم إليهما المطعم بن عدي وأبو البختري وزمعة بن الأسود في نقض الصحيفة التي علقتها قريش في الكعبة؛ فوجدوا الأرضة قد أكلتها إلا اسم الله، فخرج بنو هاشم من الشعب."
  en: "In Muharram of the tenth year of the mission Hisham ibn Amr and Zuhayr ibn Abi Umayya, joined by al-Mut'im ibn Adi, Abu al-Bakhtari and Zam'a ibn al-Aswad, moved to tear up the covenant Quraysh had hung in the Kaaba; they found that termites had eaten all of it except the Name of God, and Banu Hashim left the ravine."
  es: "En Muharram del décimo año de la misión, Hisham ibn Amr y Zuhayr ibn Abi Umayya, junto con al-Mut'im ibn Adi, Abu al-Bakhtari y Zam'a ibn al-Aswad, procedieron a romper el pacto que los Quraysh habían colgado en la Kaaba; descubrieron que las termitas se lo habían comido todo excepto el Nombre de Dios, y los Banu Hashim abandonaron el barranco."
  fr: "Au mois de Muharram de la dixième année de la mission, Hisham ibn Amr et Zuhayr ibn Abi Umayya, rejoints par al-Mut'im ibn Adi, Abu al-Bakhtari et Zam'a ibn al-Aswad, se mirent en route pour déchirer l'alliance que les Quraysh avaient accrochée dans la Kaaba; ils constatèrent que les termites l'avaient entièrement dévorée, à l'exception du Nom de Dieu, et les Banu Hashim quittèrent le ravin."
  ur: "مشن کے دسویں سال کے محرم میں ہشام بن عمرو اور زہیر بن ابی امیہ، المطعم بن عدی، ابو البختری اور زمع بن الاسود کے ساتھ مل کر، قریش کے خانہ کعبہ میں لٹکائے ہوئے عہد کو توڑنے کے لیے آگے بڑھے۔ انہوں نے پایا کہ خدا کے نام کے سوا سب کچھ دیمک کھا گیا ہے اور بنو ہاشم نے کھائی چھوڑ دی۔"
  tr: "Misyonun onuncu yılının Muharrem ayında, Hişam bin Amr ve Zuhair bin Abi Umayya, Al-Mut'im bin Adi, Ebu'l-Bakhtari ve Zem'a bin Al-Aswad ile birlikte Kureyş'in Kâbe'ye astığı belgeyi kırmaya çalıştılar. Belgenin, Allah'ın ismi hariç, termitler tarafından yendiğini gördüler; bunun üzerine Beni Haşim vadiyi terk etti."
  id: "Pada bulan Muharram tahun kesepuluh misi tersebut, Hisham bin Amr dan Zuhair bin Abi Umayya, bersama dengan Al-Mut’im bin Adi, Abu Al-Bakhtari dan Zam’a bin Al-Aswad, berusaha untuk menghancurkan dokumen yang digantung oleh kaum Quraisy di Ka'bah. Mereka menemukan bahwa rayap telah memakannya kecuali nama Tuhan, sehingga Bani Hasyim meninggalkan lembah tersebut."
