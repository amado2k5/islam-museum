label: { ar: "نظر المأمون في مزارعة الأهواز", en: "al-Ma'mun's Review of the Ahwaz Estates", fr: "Examen du métayage d’Ahwaz par al-Ma'mun", es: "Reseña de al-Ma'mun sobre las propiedades de Ahwaz", ur: "اہواز اسٹیٹس کا المامون کا جائزہ", tr: "Al-Me'mun Ahvaz'ın yetiştirilmesini değerlendirdi", id: "Al-Ma'mun menganggap budidaya Ahwaz" }
summary:
  ar: "أقطع الرشيد عبيد الله بن المهدي مزارعة أرض الأهواز فدخل فيها شبهة فرفع في ذلك قوم إلى المأمون فأمر بالنظر فيها والوقوف عليها فما لم تكن فيه شبهة أنفذ وما شك فيه سمي المشكوك فيه وذلك معروف بالأهواز."
  en: "Al-Rashid granted Ubaydallah ibn al-Mahdi the Ahwaz musarra'a lands; a doubt entered the grant, was raised to al-Ma'mun, who ordered review — the undisputed executed, the doubted marked 'al-mashkuk fihi' — a designation still current in al-Ahwaz."
  fr: "Al-Rashid accorda à Ubayd Allah ibn al-Mahdi le métayage des terres d’Ahwaz. Un doute affecta la concession ; des personnes portèrent l’affaire devant al-Ma'mun, qui ordonna un examen et une inspection. Ce qui ne faisait l’objet d’aucun doute fut exécuté, et ce qui était douteux fut nommé « le douteux », appellation connue à Ahwaz."
  es: "Al-Rashid concedió a Ubaydallah ibn al-Mahdi las tierras de Ahwaz musarra'a; surgió una duda sobre la concesión, que fue planteada a al-Ma'mun, quien ordenó una revisión: lo no disputado se ejecutó, lo dudoso se marcó como 'al-mashkuk fihi', una designación que todavía se utiliza en al-Ahwaz."
  ur: "الرشید نے عبیداللہ ابن المہدی کو اہواز مسررہ کی زمینیں عطا کیں۔ گرانٹ میں ایک شبہ داخل ہوا، المامون کے پاس اٹھایا گیا، جس نے نظرثانی کا حکم دیا - غیر متنازعہ پھانسی دی گئی، مشکوک 'المشکوک فہی' - ایک عہدہ جو ابھی بھی الاہواز میں موجود ہے۔"
  tr: "Raşid, Ubeydullah ibn el-Mehdi'ye Ahvaz topraklarını ekip biçme hakkı verdi, ancak bu konuda şüpheler ortaya çıktı. Bazı kişiler bu meseleyi el-Ma'mun'a götürdü ve o da konunun incelenip soruşturulmasını emretti. Şüpheli olmayan kısımlar yerine getirildi, şüpheli olan kısımlar ise şüpheli mesele olarak adlandırıldı ve bu Ahvaz'da bilinmektedir."
  id: "Al-Rashid memberikan hak kepada Ubayd Allah ibn al-Mahdi untuk mengolah tanah Ahwaz, tetapi timbul kecurigaan mengenai hal itu. Beberapa orang menyampaikan masalah ini kepada al-Ma'mun, yang memerintahkan agar hal itu diperiksa dan diselidiki. Apa pun yang tidak mencurigakan dieksekusi, dan apa pun yang diragukan disebut sebagai perkara yang meragukan, dan hal itu dikenal di Ahwaz."
