label: { ar: "نظر المأمون في مزارعة الأهواز", en: "al-Ma'mun's Review of the Ahwaz Estates", fr: "Examen du métayage d’Ahwaz par al-Ma'mun" }
summary:
  ar: "أقطع الرشيد عبيد الله بن المهدي مزارعة أرض الأهواز فدخل فيها شبهة فرفع في ذلك قوم إلى المأمون فأمر بالنظر فيها والوقوف عليها فما لم تكن فيه شبهة أنفذ وما شك فيه سمي المشكوك فيه وذلك معروف بالأهواز."
  en: "Al-Rashid granted Ubaydallah ibn al-Mahdi the Ahwaz musarra'a lands; a doubt entered the grant, was raised to al-Ma'mun, who ordered review — the undisputed executed, the doubted marked 'al-mashkuk fihi' — a designation still current in al-Ahwaz."
  fr: "Al-Rashid accorda à Ubayd Allah ibn al-Mahdi le métayage des terres d’Ahwaz. Un doute affecta la concession ; des personnes portèrent l’affaire devant al-Ma'mun, qui ordonna un examen et une inspection. Ce qui ne faisait l’objet d’aucun doute fut exécuté, et ce qui était douteux fut nommé « le douteux », appellation connue à Ahwaz."
