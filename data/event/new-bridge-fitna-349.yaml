label: { ar: "فتنة القنطرة الجديدة بين السنة والشيعة سنة 349", en: "The New Bridge strife between Sunnis and Shi'is in 349", es: "El conflicto del Puente Nuevo entre sunitas y chiítas en 349", fr: "Le conflit du Nouveau Pont entre sunnites et chiites en 349", ur: "349 میں سنیوں اور شیعوں کے درمیان نیا پل جھگڑا۔" }
summary:
  ar: "في يوم الخميس لثلاث خلون من شعبان سنة 349هـ وقعت فتنة بين السنة والشيعة في القنطرة الجديدة ببغداد وتعطلت الجمعة من الغد في جميع المساجد الجامعة في الجانبين سوى مسجد براثا فإن الصلاة تمت فيه وقبض على جماعة من بني هاشم واعتقلوا في دار الوزير لأنهم كانوا سبب الفتنة وأطلقوا من الغد {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "On Thursday 3 Sha'ban 349 Sunni-Shii strife at the New Bridge shut down Friday prayer in every congregational mosque on both banks except Baratha; a group of the Banu Hashim were arrested as its cause and released next day {cite:muntazam-ibn-al-jawzi p. 687}."
  es: "El jueves 3 de Sha'ban de 349, los enfrentamientos entre sunitas y chiítas en el Puente Nuevo obligaron a suspender la oración del viernes en todas las mezquitas congregacionales de ambas orillas, excepto en Baratha; un grupo de los Banu Hashim fue arrestado como causante de los disturbios y liberado al día siguiente {cite:muntazam-ibn-al-jawzi p. 687}."
  fr: "Le jeudi 3 Sha'ban 349, des affrontements sunnites-chiites au Nouveau Pont ont interrompu la prière du vendredi dans toutes les mosquées congrégationnelles des deux rives, à l'exception de Baratha; un groupe de Banu Hashim a été arrêté comme cause de ces affrontements et libéré le lendemain {cite:muntazam-ibn-al-jawzi p. 687}."
  ur: "جمعرات 3 شعبان 349 کو نیو برج پر سنی شیعہ جھگڑے نے براتہ کے علاوہ دونوں کناروں پر ہر اجتماعی مسجد میں نماز جمعہ بند کردی۔ بنو ہاشم کے ایک گروہ کو اس کی وجہ سے گرفتار کر لیا گیا اور اگلے دن رہا کر دیا گیا۔ 687}۔"
