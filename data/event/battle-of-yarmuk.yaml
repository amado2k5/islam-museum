id: event/battle-of-yarmuk
class: event
kind: battle
label: { ar: "معركة اليرموك", en: "Battle of the Yarmuk" }
summary:
  ar: "وقعة كبرى بين المسلمين والروم على نهر اليرموك. بعد الهزيمة نادى أبو عبيدة بالرحيل، فارتحل المسلمون حتى وضعوا عساكرهم بمرج الصُّفَّر ثم نزلوا على دمشق {cite:tabari-tarikh-abu-al-fadl j.3 p.404}. ذكر الواقدي أنها كانت سنة خمس عشرة، وذكر الطبري رواية سيف بأنها كانت سنة ثلاث عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.441}. وعند البلاذري: جمع هرقل جموعاً من الروم وأهل الشام وأهل الجزيرة وأرمينية تكون زهاء مائتي ألف، وولى عليهم رجلاً من خاصته وبعث على مقدمته جبلة بن الأيهم الغساني في مستعربة الشام من لخم وجذام، وكان المسلمون أربعة وعشرين ألفاً، وتسلسلت الروم واتباعهم لئلا تطمع أنفسهم في الهرب؛ فاقتتلوا على اليرموك أشد قتال فقتل الله منهم زهاء سبعين ألفاً وهرب فلّهم إلى فلسطين وأنطاكية وحلب والجزيرة وأرمينية؛ وقاتل يوم اليرموك نساء من نساء المسلمين قتالاً شديداً وجعلت هند بنت عتبة أم معاوية تقول «عضّوا الغلفان بسيوفكم»، وذهبت فيه عين الأشعث بن قيس وعين هاشم بن عتبة بن أبي وقاص الزهري المرقال وعين قيس بن مكشوح؛ واستشهد عامر بن أبي وقاص الذي حمل كتاب عمر إلى أبي عبيدة بولايته الشام وقيل بل مات في الطاعون وقيل بأجنادين وليس بثبت؛ وعقد أبو عبيدة لحبيب بن مسلمة الفهري على خيل الطلب يقتل من أدرك؛ وانحاز جبلة بن الأيهم إلى الأنصار وقال أنتم إخوتنا وبنو أبينا وأظهر الإسلام ثم ارتد ودخل بلاد الروم حين طلب عمر الاقتصاص منه (وعند رواية أخرى أتى عمر على نصرانيته فأبى الجزية أنفاً فدخل بلاد الروم في ثلاثين ألفاً فندم عمر وعاتبه عبادة بن الصامت لو قبلت منه الصدقة لأسلم، فوجّه عمر سنة 21 عمير بن سعد الأنصاري في جيش وأمره أن يتملّق جبلة ويسترجعه على أن يؤدي ما كان بذل من الصدقة ويقيم على دينه فأبى إلا المقام، فانتهى عمير إلى موضع يعرف بالحمار فأوقع بأهله وأخربه)؛ وكان في يوم اليرموك أن المسلمين ردوا على أهل حمص ما كانوا أخذوا منهم من الخراج وقالوا قد شُغلنا عن نصرتكم فقال أهل حمص لولايتكم وعدلكم أحب إلينا مما كنا فيه من الظلم والغشم ولندفعن جند هرقل عن المدينة مع عاملكم ونهض اليهود فقالوا والتوراة لا يدخل عامل هرقل مدينة حمص إلا أن نُغلب ونجهد، فأغلقوا الأبواب وحرسوها وكذلك فعل أهل المدن المصالحة من النصارى واليهود؛ ولما بلغ هرقل خبر اليرموك هرب من أنطاكية إلى قسطنطينية فلما جاوز الدرب قال عليك يا سورية السلام، وكانت الوقعة في رجب سنة 15 {cite:futuh-buldan-maarif-1407 p.184–187}."
  en: "A great battle between the Muslims and the Byzantines at the Yarmuk river. After the defeat Abu Ubayda called for withdrawal, and the Muslims moved until they set their camps at Marj al-Suffar, then encamped at Damascus {cite:tabari-tarikh-abu-al-fadl j.3 p.404}. Al-Waqidi reported that it was in 15 AH; al-Tabari's report of the account of Sayf places it in 13 AH {cite:tabari-tarikh-abu-al-fadl j.3 p.441}. According to al-Baladhuri: Heraclius gathered a host of Byzantines, Syrians, people of al-Jazira and Armenia numbering some two hundred thousand, put one of his intimates in command, and sent Jabala ibn al-Ayham al-Ghassani at its vanguard, with the Arabized Syrians of Lakhm and Judham. The Muslims numbered twenty-four thousand. The Byzantines and their followers were chained together so that they would not be tempted to flee. They fought at the Yarmuk with the fiercest of battles; God slew some seventy thousand of them, and their remnant fled to Palestine, Antioch, Aleppo, al-Jazira and Armenia. Muslim women also fought hard on the day of the Yarmuk, and Hind bint Utba, mother of Mu'awiya, kept calling out: bite the sheaths with your swords. On that day the eye of al-Ash'ath ibn Qays was lost, as were the eye of Hashim ibn Utba ibn Abi Waqqas al-Zuhri, called al-Mirqal, and the eye of Qays ibn Maksuh. Amir ibn Abi Waqqas, who had carried Umar's letter to Abu Ubayda confirming his governorship of Syria, was martyred; it is also said that he died in the plague, or at Ajnadayn, but this is not established. Abu Ubayda appointed Habib ibn Maslama al-Fihri over the pursuing cavalry, to kill whoever they overtook. Jabala ibn al-Ayham sided with the Ansar and said: you are our brothers and the sons of our father; he showed Islam, then apostatised and entered Byzantine lands when Umar sought retaliation from him. In another account, Umar found him still a Christian; he refused the jizya out of pride and entered Byzantine lands with thirty thousand men. Umar regretted it, and Ubada ibn al-Samit reproached him that had he accepted his alms, he would have become a Muslim. So Umar sent Umayr ibn Sa'd al-Ansari with an army in 21 AH and ordered him to coax Jabala and bring him back, on condition that he pay what he had offered in alms and keep his religion; but Jabala refused except to stay, and Umayr reached a place known as al-Himar, fell upon its people and laid it waste. On the day of the Yarmuk the Muslims returned to the people of Homs the tribute they had taken from them, saying they had been too occupied to aid them. The people of Homs replied that the justice of their rule was dearer to them than the oppression they had suffered, and that they would repel Heraclius's troops from the city alongside their governor. The Jews rose and said: by the Torah, Heraclius's governor shall not enter the city of Homs unless we are overcome and worn out; they shut the gates and guarded them, and the Christians and Jews of the other cities under treaty did likewise. When news of the Yarmuk reached Heraclius he fled from Antioch to Constantinople, and when he crossed the pass he said: farewell, O Syria. The battle was in Rajab of 15 AH {cite:futuh-buldan-maarif-1407 p.184–187}."
