id: event/battle-of-yarmuk
class: event
kind: battle
label: { ar: "معركة اليرموك", en: "Battle of the Yarmuk" }
summary:
  ar: "معركة كبرى بين المسلمين والروم قرب ملتقى نهر اليرموك بوادي الرقاد، حسمت مصير الشام البيزنطية. وتذكر دائرة المعارف الإسلامية أنها استمرت أكثر من شهر مع المناورات التمهيدية وانتهت في 12 رجب سنة 15هـ الموافق 20 آب 636م، وأن المسلمين بقيادة أبي عبيدة بن الجراح استدرجوا الروم ثم قطع خالد بن الوليد عليهم الجسر في غارة ليلية فهُزموا. وفي الروايات العربية أن الطبري ينقل عن الواقدي أنها سنة 15هـ وعن سيف أنها سنة 13هـ، ويروي البلاذري أخبار جموع هرقل وقتال النساء وأثرها في أهل حمص."
  en: "A great battle between the Muslims and the Byzantines near the meeting of the Yarmuk river and the Wadi al-Rukkad, which decided the fate of Byzantine Syria. The Encyclopaedia of Islam says it lasted more than a month with the preliminary manoeuvres and ended on 12 Rajab 15 AH, 20 August 636, when the Muslims under Abu Ubayda ibn al-Jarrah drew the Byzantines in and Khalid ibn al-Walid seized their bridge in a night raid. Arabic sources differ on the year: al-Tabari reports 15 AH from al-Waqidi and 13 AH from Sayf, and al-Baladhuri tells of Heraclius's hosts, the women who fought and the effect on the people of Homs."
  ur: "مسلمانوں اور رومیوں کے درمیان دریائے یرموک اور وادیٔ رقاد کے سنگم کے قریب ایک بڑی جنگ جس نے بازنطینی شام کی قسمت کا فیصلہ کیا۔ اسلامی دائرۃ المعارف کے مطابق یہ ابتدائی چالوں سمیت ایک مہینے سے زیادہ جاری رہی اور 12 رجب سنہ 15ھ، یعنی 20 اگست سنہ 636ء کو ختم ہوئی؛ ابو عبیدہ بن الجراح کی قیادت میں مسلمانوں نے رومیوں کو کھینچ لیا اور خالد بن الولید نے رات کے حملے میں ان کا پل چھین لیا۔ عربی ماخذ سال میں مختلف ہیں: طبری واقدی سے سنہ 15ھ اور سیف سے سنہ 13ھ نقل کرتے ہیں، اور بلاذری ہرقل کے لشکروں، لڑنے والی عورتوں اور اہلِ حمص پر اثر کا ذکر کرتے ہیں۔"
