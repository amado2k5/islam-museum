label: { ar: "معركة اليرموك", en: "Battle of the Yarmuk", fr: "La bataille du Yarmouk", es: "Batalla de Yarmuk", ur: "یرموک کی جنگ", tr: "Yarmuk Muharebesi", id: "Pertempuran Yarmouk" }
summary:
  ar: "معركة كبرى بين المسلمين والروم قرب ملتقى نهر اليرموك بوادي الرقاد، حسمت مصير الشام البيزنطية. وتذكر دائرة المعارف الإسلامية أنها استمرت أكثر من شهر مع المناورات التمهيدية وانتهت في 12 رجب سنة 15هـ الموافق 20 آب 636م، وأن المسلمين بقيادة أبي عبيدة بن الجراح استدرجوا الروم ثم قطع خالد بن الوليد عليهم الجسر في غارة ليلية فهُزموا. وفي الروايات العربية أن الطبري ينقل عن الواقدي أنها سنة 15هـ وعن سيف أنها سنة 13هـ، ويروي البلاذري أخبار جموع هرقل وقتال النساء وأثرها في أهل حمص."
  en: "A great battle between the Muslims and the Byzantines near the meeting of the Yarmuk river and the Wadi al-Rukkad, which decided the fate of Byzantine Syria. The Encyclopaedia of Islam says it lasted more than a month with the preliminary manoeuvres and ended on 12 Rajab 15 AH, 20 August 636, when the Muslims under Abu Ubayda ibn al-Jarrah drew the Byzantines in and Khalid ibn al-Walid seized their bridge in a night raid. Arabic sources differ on the year: al-Tabari reports 15 AH from al-Waqidi and 13 AH from Sayf, and al-Baladhuri tells of Heraclius's hosts, the women who fought and the effect on the people of Homs."
  ur: "مسلمانوں اور رومیوں کے درمیان دریائے یرموک اور وادیٔ رقاد کے سنگم کے قریب ایک بڑی جنگ جس نے بازنطینی شام کی قسمت کا فیصلہ کیا۔ اسلامی دائرۃ المعارف کے مطابق یہ ابتدائی چالوں سمیت ایک مہینے سے زیادہ جاری رہی اور 12 رجب سنہ 15ھ، یعنی 20 اگست سنہ 636ء کو ختم ہوئی؛ ابو عبیدہ بن الجراح کی قیادت میں مسلمانوں نے رومیوں کو کھینچ لیا اور خالد بن الولید نے رات کے حملے میں ان کا پل چھین لیا۔ عربی ماخذ سال میں مختلف ہیں: طبری واقدی سے سنہ 15ھ اور سیف سے سنہ 13ھ نقل کرتے ہیں، اور بلاذری ہرقل کے لشکروں، لڑنے والی عورتوں اور اہلِ حمص پر اثر کا ذکر کرتے ہیں۔"
  fr: "Une grande bataille entre les musulmans et les Byzantins près du confluent du fleuve Yarmouk et du Wadi al-Rukkad, qui décida du sort de la Syrie byzantine. L'Encyclopédie de l'Islam dit qu'elle dura plus d'un mois avec les manœuvres préliminaires et se termina le 12 Rajab 15 H, 20 août 636, quand les musulmans sous Abu Ubayda ibn al-Jarrah attirèrent les Byzantins et que Khalid ibn al-Walid s'empara de leur pont lors d'un raid nocturne. Les sources arabes divergent sur l'année : al-Tabari rapporte 15 H d'après al-Waqidi et 13 H d'après Sayf, et al-Baladhuri parle des armées d'Héraclius, des femmes qui combattirent et de l'effet sur les gens de Homs."
  es: "Una gran batalla entre musulmanes y bizantinos cerca de la confluencia del río Yarmuk y el Wadi al-Rukkad, que decidió el destino de la Siria bizantina. La Enciclopedia del Islam dice que duró más de un mes con las maniobras preliminares y terminó el 12 de Rajab del año 15 de la Hégira, 20 de agosto de 636, cuando los musulmanes bajo el mando de Abu Ubayda ibn al-Jarrah atrajeron a los bizantinos y Khalid ibn al-Walid tomó su puente en una incursión nocturna. Las fuentes árabes difieren en el año: al-Tabari informa del año 15 de la Hégira según al-Waqidi y del año 13 de la Hégira según Sayf, y al-Baladhuri habla de las huestes de Heraclio, las mujeres que lucharon y el efecto en la gente de Homs."
  tr: "Yermuk Nehri ve Rakkad Vadisi'nin birleşme noktasına yakın bir yerde Müslümanlar ve Bizanslılar arasında yaşanan büyük bir savaş, Bizans Suriyesi'nin kaderini belirledi. İslam Ansiklopedisi, ön hazırlık manevraları da dahil olmak üzere bir aydan fazla sürdüğünü ve Hicri 15 yılının Receb ayının 12'sinde (20 Ağustos 636) sona erdiğini belirtir. Anlatıya göre, Ebu Ubeyde ibn el-Cerrah önderliğindeki Müslümanlar, Bizanslıları bir tuzağa düşürdükten sonra Halid ibn el-Velid'in gece baskınıyla köprülerini kesmesi sonucu Bizanslılar yenilgiye uğradı. Arapça kaynaklar, el-Taberi'nin el-Vakidi'den alıntı yaparak savaşı Hicri 15 yılına, Sayf'ın ise Hicri 13 yılına yerleştirdiğini belirtir. El-Baladhuri de Heraklius'un ordusu, kadınların savaşması ve bunun Homs halkı üzerindeki etkisiyle ilgili olayları anlatır."
  id: "Pertempuran besar antara kaum Muslim dan Bizantium di dekat pertemuan Sungai Yarmouk dan Wadi al-Raqad menentukan nasib Suriah Bizantium. Ensiklopedia Islam menyatakan bahwa pertempuran itu berlangsung lebih dari sebulan, termasuk manuver pendahuluan, dan berakhir pada tanggal 12 Rajab 15 H (20 Agustus 636 M). Ensiklopedia tersebut menceritakan bahwa kaum Muslim, yang dipimpin oleh Abu Ubaidah ibn al-Jarrah, memancing Bizantium ke dalam perangkap, dan kemudian Khalid ibn al-Walid memutus jembatan mereka dalam serangan malam hari, yang mengakibatkan kekalahan mereka. Catatan berbahasa Arab menyatakan bahwa al-Tabari, mengutip al-Waqidi, menempatkan pertempuran tersebut pada tahun 15 H, sementara Sayf menempatkannya pada tahun 13 H. Al-Baladhuri juga menceritakan peristiwa yang berkaitan dengan pasukan Heraclius, pertempuran yang dilakukan oleh para wanita, dan dampaknya terhadap penduduk Homs."
