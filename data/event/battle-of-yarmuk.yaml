label: { ar: "معركة اليرموك" }
summary:
  ar: "وقعة كبرى بين المسلمين والروم على نهر اليرموك. بعد الهزيمة نادى أبو عبيدة بالرحيل، فارتحل المسلمون حتى وضعوا عساكرهم بمرج الصُّفَّر ثم نزلوا على دمشق {cite:tabari-tarikh-abu-al-fadl j.3 p.404}. ذكر الواقدي أنها كانت سنة خمس عشرة، وذكر الطبري رواية سيف بأنها كانت سنة ثلاث عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.441}."
