label: { ar: "ملك التتر مراغة وقتل أهلها", en: "The Mongols Take Maragha and Slaughter Its People", es: "Los mongoles toman Maragha y masacran a su gente.", fr: "Les Mongols prennent Maragha et massacrent ses habitants", ur: "منگولوں نے مراگھ کو لے لیا اور اس کے لوگوں کو ذبح کیا۔" }
summary:
  ar: "في صفر سنة ثمان عشرة وستمائة سار التتر من ناحية الكرج إلى أذربيجان فصانعهم صاحب تبريز بمال وثياب ودواب فعدلوا عنها إلى مراغة فحصروها وليس بها صاحب يمنعها إذ كانت صاحبتها امرأة مقيمة بقلعة رويندز، فنصبوا عليها المجانيق وزحفوا وكان من عادتهم إذا قاتلوا مدينة قدّموا من معهم من أسارى المسلمين بين أيديهم يزحفون ويقاتلون فإن عادوا قتلوهم فيكون القتل في الأسارى وهم بنجوة منه، فأقاموا عليها أياماً ثم ملكوها عنوة رابع صفر ووضعوا السيف في أهلها فقتل منهم ما يخرج عن الحصر ونهبوا ما صلح لهم وأحرقوا ما لا، وكانوا يأخذون الأسارى فيأمرونهم ينادون في الدروب أن التتر قد رحلوا فإذا خرج من اختفى أُخذ وقُتل؛ ويحكي ابن الأثير عن أهلها أن رجلاً من التتر دخل درباً فيه مائة رجل فما زال يقتلهم واحداً واحداً حتى أفناهم ولم يمد أحد يده إليه لوضعت الذلة على الناس، وأن امرأة من التتر دخلت داراً وقتلت جماعة من أهلها وهم يظنونها رجلاً، ثم رحلوا عنها نحو إربل حتى بلغ خبرهم الموصل وهمّ بعض أهلها بالجلاء {cite:kamil-ibn-al-athir p. 411-412}."
  en: "In Safar 618 the Mongols marched from the Georgian side into Azerbaijan; the lord of Tabriz placated them with money, garments and mounts, so they turned aside to Maragha and besieged it. It had no lord to defend it, its lord being a woman who resided in the fortress of Ruwindiz. They set up catapults and advanced. Their custom, when attacking a city, was to send the Muslim captives they had with them ahead to advance and fight; if the captives turned back, they killed them, so the killing fell on the captives while they themselves stayed out of reach. They camped before the city for some days, then took it by storm on 4 Safar and put its people to the sword, killing an uncountable number; they plundered what was useful and burned the rest. They would take captives and make them call out through the lanes that the Mongols had departed; whoever came out of hiding was seized and killed. Ibn al-Athir relates, from its people, that a Mongol man entered a lane where a hundred men were, and kept killing them one by one until he had finished them, and no one raised a hand against him, or humiliation would have been laid upon all people; and that a Mongol woman entered a house and killed a number of its people, who took her for a man. They then departed toward Irbil; news reached Mosul, and some of its people resolved to leave {cite:kamil-ibn-al-athir p. 411-412}."
  es: "En el año 618 de Safar, los mongoles marcharon desde Georgia hacia Azerbaiyán. El señor de Tabriz los apaciguó con dinero, vestimentas y monturas, por lo que se desviaron hacia Maragha y la sitiaron. La ciudad carecía de un señor que la defendiera, pues su señora residía en la fortaleza de Ruwindiz. Instalaron catapultas y avanzaron. Su costumbre, al atacar una ciudad, era enviar a los cautivos musulmanes que llevaban consigo para que avanzaran y lucharan; si los cautivos retrocedían, los mataban, de modo que la matanza recaía sobre ellos mientras ellos mismos permanecían fuera de su alcance. Acamparon frente a la ciudad durante algunos días, luego la tomaron por asalto el 4 de Safar y pasaron a su gente a cuchillo, matando a un número incalculable; saquearon lo que era útil y quemaron el resto. Tomaban cautivos y los obligaban a gritar por los callejones que los mongoles habían dejado; cualquiera que saliera de su escondite era apresado y asesinado. Ibn al-Athir relata, según sus habitantes, que un mongol entró en un callejón donde se encontraban cien hombres y los fue matando uno a uno hasta acabar con todos, sin que nadie alzara la mano contra él, pues la humillación habría recaído sobre todos. Asimismo, una mujer mongola entró en una casa y mató a varios de sus habitantes, quienes la confundieron con un hombre. Posteriormente, partieron hacia Erbil; la noticia llegó a Mosul, y algunos de sus habitantes decidieron marcharse {cita:kamil-ibn-al-athir págs. 411-412}."
  fr: "En Safar 618, les Mongols marchèrent depuis la Géorgie vers l'Azerbaïdjan. Le seigneur de Tabriz les apaisa avec de l'argent, des vêtements et des montures, et ils se dirigèrent alors vers Maragha qu'ils assiégèrent. La ville n'avait pas de seigneur pour la défendre; sa souveraine était une femme qui résidait dans la forteresse de Ruwindiz. Ils installèrent des catapultes et avancèrent. Leur coutume, lorsqu'ils attaquaient une ville, était d'envoyer les captifs musulmans qui les accompagnaient en avant pour combattre. Si les captifs rebroussaient chemin, ils les tuaient, de sorte que le massacre retombait sur eux tandis qu'ils restaient hors de portée. Ils campèrent devant la ville pendant quelques jours, puis la prirent d'assaut le 4 Safar et massacrèrent ses habitants, faisant un nombre incalculable de victimes. Ils pillèrent ce qui était utile et incendièrent le reste. Ils faisaient des prisonniers et les obligeaient à crier dans les ruelles que les Mongols étaient partis; quiconque sortait de sa cachette était capturé et tué. Ibn al-Athir rapporte, d'après les habitants, qu'un Mongol entra dans une ruelle où se trouvaient une centaine d'hommes et les tua un à un jusqu'à ce qu'il ne les ait plus. Personne n'osa lever la main sur lui, car cela aurait exposé tout le peuple à l'humiliation. Il raconte aussi qu'une Mongole entra dans une maison et tua plusieurs de ses habitants, qui la prirent pour un homme. Ils partirent ensuite vers Erbil; la nouvelle parvint à Mossoul, et certains de ses habitants décidèrent de partir (voir: Kamil Ibn al-Athir, p. 411-412)."
  ur: "صفر 618 میں منگولوں نے جارجیا کی طرف سے آذربائیجان کی طرف کوچ کیا۔ تبریز کے آقا نے انہیں پیسے، کپڑوں اور سواریوں سے تسلی دی، چنانچہ وہ مرغا کی طرف مڑ گئے اور اس کا محاصرہ کر لیا۔ اس کا دفاع کرنے والا کوئی رب نہیں تھا، اس کی مالک ایک عورت تھی جو روینڈیز کے قلعے میں رہتی تھی۔ انہوں نے گلیلیں قائم کیں اور آگے بڑھے۔ ان کا دستور یہ تھا کہ جب کسی شہر پر حملہ کیا جائے تو ان مسلمان قیدیوں کو جو ان کے پاس تھے آگے بڑھنے اور لڑنے کے لیے بھیجتے تھے۔ اگر قیدی واپس لوٹے تو انہیں قتل کر دیا، چنانچہ قتل اسیروں پر پڑا جب کہ وہ خود ان کی پہنچ سے دور رہے۔ انہوں نے کچھ دنوں تک شہر کے سامنے ڈیرے ڈالے، پھر 4 صفر کو طوفان کے ذریعے اس پر قبضہ کر لیا اور اس کے لوگوں کو تلوار سے مار ڈالا، اور بے شمار تعداد میں مارے گئے۔ انہوں نے جو کچھ مفید تھا اسے لوٹ لیا اور باقی کو جلا دیا۔ وہ قیدیوں کو لے جاتے اور ان گلیوں سے پکارتے جن سے منگولوں نے نکلا تھا۔ جو بھی چھپ کر نکلا اسے پکڑ کر قتل کر دیا گیا۔ ابن اثیر اپنی قوم سے بیان کرتے ہیں کہ ایک منگول شخص ایک گلی میں داخل ہوا جہاں سو آدمی تھے اور ایک ایک کرکے انہیں قتل کرتا رہا یہاں تک کہ وہ ان کو ختم کر چکا اور کسی نے اس کے خلاف ہاتھ نہیں اٹھایا ورنہ تمام لوگوں پر ذلت نازل ہو جاتی۔ اور یہ کہ ایک منگول عورت نے ایک گھر میں گھس کر اس کے بہت سے لوگوں کو مار ڈالا، جنہوں نے اسے مرد بنا لیا۔ پھر وہ اربیل کی طرف روانہ ہوئے۔ یہ خبر موصل تک پہنچی اور وہاں کے کچھ لوگوں نے وہاں سے نکلنے کا عزم کر لیا۔ 411-412}۔"
