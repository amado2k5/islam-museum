label: { ar: "ملك التتر مراغة وقتل أهلها", en: "The Mongols Take Maragha and Slaughter Its People" }
summary:
  ar: "في صفر سنة ثمان عشرة وستمائة سار التتر من ناحية الكرج إلى أذربيجان فصانعهم صاحب تبريز بمال وثياب ودواب فعدلوا عنها إلى مراغة فحصروها وليس بها صاحب يمنعها إذ كانت صاحبتها امرأة مقيمة بقلعة رويندز، فنصبوا عليها المجانيق وزحفوا وكان من عادتهم إذا قاتلوا مدينة قدّموا من معهم من أسارى المسلمين بين أيديهم يزحفون ويقاتلون فإن عادوا قتلوهم فيكون القتل في الأسارى وهم بنجوة منه، فأقاموا عليها أياماً ثم ملكوها عنوة رابع صفر ووضعوا السيف في أهلها فقتل منهم ما يخرج عن الحصر ونهبوا ما صلح لهم وأحرقوا ما لا، وكانوا يأخذون الأسارى فيأمرونهم ينادون في الدروب أن التتر قد رحلوا فإذا خرج من اختفى أُخذ وقُتل؛ ويحكي ابن الأثير عن أهلها أن رجلاً من التتر دخل درباً فيه مائة رجل فما زال يقتلهم واحداً واحداً حتى أفناهم ولم يمد أحد يده إليه لوضعت الذلة على الناس، وأن امرأة من التتر دخلت داراً وقتلت جماعة من أهلها وهم يظنونها رجلاً، ثم رحلوا عنها نحو إربل حتى بلغ خبرهم الموصل وهمّ بعض أهلها بالجلاء {cite:kamil-ibn-al-athir p. 411-412}."
  en: "In Safar 618 the Mongols marched from the Georgian side into Azerbaijan; the lord of Tabriz placated them with money, garments and mounts, so they turned aside to Maragha and besieged it. It had no lord to defend it, its lord being a woman who resided in the fortress of Ruwindiz. They set up catapults and advanced. Their custom, when attacking a city, was to send the Muslim captives they had with them ahead to advance and fight; if the captives turned back, they killed them, so the killing fell on the captives while they themselves stayed out of reach. They camped before the city for some days, then took it by storm on 4 Safar and put its people to the sword, killing an uncountable number; they plundered what was useful and burned the rest. They would take captives and make them call out through the lanes that the Mongols had departed; whoever came out of hiding was seized and killed. Ibn al-Athir relates, from its people, that a Mongol man entered a lane where a hundred men were, and kept killing them one by one until he had finished them, and no one raised a hand against him, or humiliation would have been laid upon all people; and that a Mongol woman entered a house and killed a number of its people, who took her for a man. They then departed toward Irbil; news reached Mosul, and some of its people resolved to leave {cite:kamil-ibn-al-athir p. 411-412}."
