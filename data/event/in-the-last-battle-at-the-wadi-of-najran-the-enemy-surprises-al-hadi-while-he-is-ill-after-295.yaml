id: "event/in-the-last-battle-at-the-wadi-of-najran-the-enemy-surprises-al-hadi-while-he-is-ill-after-295"
class: event
kind: other
label:
  ar: "آخر حروب الهادي في وادي نجران وهو مريض، ومقتل يوسف بن أبي حرب، 295هـ بعدها، ص384"
  en: "The last battle of al-Hadi in the wadi of Najran while he is ill, and the killing of Yusuf ibn Abi Harb, after 295 AH, p. 384"
  ur: "نجران کی وادی میں ہادی کی آخری جنگ جب وہ بیمار تھے، اور یوسف بن ابی حرب کا قتل، 295ھ کے بعد، ص384"
  es: "La última batalla de al-Hadi en el wadi de Najran mientras estaba enfermo, y el asesinato de Yusuf ibn Abi Harb, después del año 295 AH, pág. 384"
summary:
  ar: "يروي أصحاب الهادي أن آخر حروبه كانت بوادي نجران، وهو مريض بالعلة التي توفي فيها، إذ بيّت العدو معسكره عند الحصن، فلما التقى الصفان انكشف أصحابه، وقُتل يوسف بن أبي حرب العبسي، آخر من استشهد معه."
  en: "Al-Hadi's companions tell that his last fighting was in the wadi of Najran, while he was ill with the illness of which he died. The enemy surprised his camp at the fort at night, and when the two lines met, his companions broke. Yusuf ibn Abi Harb al-Absi was killed, the last man to fall with al-Hadi."
  ur: "ہادی کے ساتھی بیان کرتے ہیں کہ ان کی آخری لڑائی نجران کی وادی میں ہوئی، جب وہ اس بیماری میں مبتلا تھے جس میں وہ فوت ہوئے۔ دشمن نے رات کو حصن میں ان کے پڑاؤ پر شبخون مارا، اور جب دونوں صفیں ملیں تو ان کے ساتھی بکھر گئے۔ یوسف بن ابی حرب العبسی قتل ہوا، جو ہادی کے ساتھ شہید ہونے والوں میں آخری تھا۔"
  es: "Los compañeros de Al-Hadi cuentan que su último combate tuvo lugar en el valle de Najrán, mientras padecía la enfermedad que le causó la muerte. El enemigo sorprendió su campamento en la fortaleza durante la noche, y cuando las dos líneas se encontraron, sus compañeros se dispersaron. Yusuf ibn Abi Harb al-Absi fue el último hombre en caer junto a Al-Hadi."
