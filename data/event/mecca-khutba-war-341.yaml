label: { ar: "حرب الخطبة بمكة بين العلوي والمصريين" }
summary:
  ar: "في سنة إحدى وأربعين وثلاثمائة ورد الخبر بحرب جرت بين أبي عبد الله أحمد بن عمر بن يحيى العلوي وبين المصريين بمكة وكانت على المصريين وقتل أمير مكة، وتم الحج في هذه السنة على طمأنينة فأقام أهل مصر الخطبة للإخشيدي وقت الظهر يوم عرفة وأقام العلوي الخطبة بعد الظهر لركن الدولة ومعز الدولة؛ وفي سنة اثنتين وأربعين جرت حروب بمكة لأجل الخطبة فانهزم المصريون {cite:muntazam-ibn-al-jawzi p. 663-664}."
  en: "In 341 war broke out at Mecca between the Alid Abu Abdallah Ahmad ibn 'Umar and the Egyptians — Mecca's amir killed — yet the Hajj passed in calm, the Egyptians holding the khutba for the Ikhshid at noon of 'Arafa while the Alid held an afternoon khutba for Rukn al-Dawla and Mu'izz al-Dawla; in 342 the Egyptians were routed {cite:muntazam-ibn-al-jawzi p. 663-664}."
