label: { ar: "حرب الخطبة بمكة بين العلوي والمصريين", en: "The War of the Khutba at Mecca between the Alid and the Egyptians", es: "La guerra de la jutba en La Meca entre los alid y los egipcios.", fr: "La guerre de la khutba à La Mecque entre les Alides et les Égyptiens", ur: "مکہ میں علید اور مصریوں کے درمیان خطبہ کی جنگ" }
summary:
  ar: "في سنة إحدى وأربعين وثلاثمائة ورد الخبر بحرب جرت بين أبي عبد الله أحمد بن عمر بن يحيى العلوي وبين المصريين بمكة وكانت على المصريين وقتل أمير مكة، وتم الحج في هذه السنة على طمأنينة فأقام أهل مصر الخطبة للإخشيدي وقت الظهر يوم عرفة وأقام العلوي الخطبة بعد الظهر لركن الدولة ومعز الدولة؛ وفي سنة اثنتين وأربعين جرت حروب بمكة لأجل الخطبة فانهزم المصريون {cite:muntazam-ibn-al-jawzi p. 663-664}."
  en: "In 341 war broke out at Mecca between the Alid Abu Abdallah Ahmad ibn 'Umar and the Egyptians — Mecca's amir killed — yet the Hajj passed in calm, the Egyptians holding the khutba for the Ikhshid at noon of 'Arafa while the Alid held an afternoon khutba for Rukn al-Dawla and Mu'izz al-Dawla; in 342 the Egyptians were routed {cite:muntazam-ibn-al-jawzi p. 663-664}."
  es: "En 341 estalló la guerra en La Meca entre el Alid Abu Abdallah Ahmad ibn 'Umar y los egipcios —el emir de La Meca fue asesinado—, sin embargo, el Hajj transcurrió en calma, los egipcios celebraron la jutba para el Ikhshid al mediodía de 'Arafa, mientras que el Alid celebró una jutba por la tarde para Rukn al-Dawla y Mu'izz al-Dawla; en 342 los egipcios fueron derrotados {cite:muntazam-ibn-al-jawzi p. 663-664}."
  fr: "En 341, la guerre éclata à La Mecque entre l'Alide Abu Abdallah Ahmad ibn 'Umar et les Égyptiens — l'émir de La Mecque fut tué — mais le Hajj se déroula dans le calme, les Égyptiens tenant le khutba pour les Ikhshid à midi à 'Arafa tandis que l'Alide tenait un khutba l'après-midi pour Rukn al-Dawla et Mu'izz al-Dawla; en 342, les Égyptiens furent mis en déroute {cite:muntazam-ibn-al-jawzi p. 663-664}."
  ur: "341 میں مکہ میں علید ابو عبداللہ احمد بن عمر اور مصریوں کے درمیان جنگ ہوئی - مکہ کا امیر مارا گیا - پھر بھی حج سکون سے گزرا، مصری عرفہ کی دوپہر کو خطبہ دیتے ہوئے خطبہ دیتے تھے جب کہ علید نے رکن الدولہ اور معاذ اللہ کے لیے دوپہر کا خطبہ دیا تھا۔ 342 میں مصریوں کو شکست دی گئی۔ 663-664}۔"
