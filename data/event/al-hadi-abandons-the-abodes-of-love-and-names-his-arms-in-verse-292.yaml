id: event/al-hadi-abandons-the-abodes-of-love-and-names-his-arms-in-verse-292
class: event
kind: other
label:
  ar: "قصيدة من الوافر للهادي يهجر فيها ديار زينب والرباب ويذكر فرسه ودرعه وسيفه ورمحه، ص314"
  en: "A wafir poem of al-Hadi leaving the abodes of Zaynab and al-Rabab and naming his horse, mail, sword and lance, p. 314"
  ur: "ہادی کی وافر نظم: زینب اور رباب کے ٹھکانے چھوڑنا اور اپنے گھوڑے، زرہ، تلوار اور نیزے کا ذکر، ص314"
  es: "Un poema wafir de al-Hadi abandonando las moradas de Zaynab y al-Rabab y nombrando su caballo, cota de malla, espada y lanza, pág. 314"
  fr: "Un poème wafir d'al-Hadi quittant les demeures de Zaynab et d'al-Rabab et nommant son cheval, sa cotte de mailles, son épée et sa lance, p. 314"
summary:
  ar: "قصيدة من الوافر بعنوان «وله أيضاً»: يقول الهادي إنه هجر ديار زينب والرباب وراح عن الغواية والتصابي، وإن العلم نهاه عن مواصلة الغواني لأنه يميل إلى المروءة والصواب، وإن همه فرس وسلاحه درع وسيف ورمح، وطعنه وضربه في الوغى."
  en: "A wafir poem under the heading \"and also of his\": al-Hadi says he has left the abodes of Zaynab and al-Rabab and turned from error and youthful folly, that knowledge forbade him the company of women because he inclines to manliness and what is right, and that his concern is a horse and his arms, mail, sword and lance, and his thrusting and striking in the fight."
  ur: "وافر بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت: ہادی کہتا ہے کہ اس نے زینب اور رباب کے ٹھکانے چھوڑ دیے اور گمراہی اور جوانی کی نادانی سے رخ پھیر لیا، علم نے اسے عورتوں کی صحبت سے روکا کیونکہ وہ مروت اور درستی کی طرف مائل ہے، اس کی فکر گھوڑا اور اس کے ہتھیار زرہ، تلوار اور نیزہ ہیں، اور لڑائی میں اس کا وار اور ضرب۔"
  es: "Un poema wafir bajo el título \"y también suyo\": al-Hadi dice que ha abandonado las moradas de Zaynab y al-Rabab y se ha apartado del error y la locura juvenil, que el conocimiento le prohibió la compañía de mujeres porque se inclina hacia la hombría y lo que es correcto, y que su preocupación es un caballo y sus armas, cota de malla, espada y lanza, y sus estocadas y golpes en la lucha."
  fr: "Un poème wafir sous le titre « et aussi de lui »: al-Hadi dit qu'il a quitté les demeures de Zaynab et d'al-Rabab et s'est détourné de l'erreur et de la folie de la jeunesse, que la connaissance lui interdisait la compagnie des femmes parce qu'il penche vers la virilité et ce qui est juste, et que sa préoccupation est un cheval et ses armes, cotte de mailles, épée et lance, et ses coups et ses frappes au combat."
