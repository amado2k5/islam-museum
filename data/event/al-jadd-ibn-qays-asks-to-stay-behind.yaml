id: event/al-jadd-ibn-qays-asks-to-stay-behind
class: event
kind: other
label: { ar: "استئذان الجد بن قيس في التخلف", en: "al-Jadd ibn Qays asks leave to stay behind", es: "Al-Jadd ibn Qays pide permiso para quedarse.", fr: "al-Jadd ibn Qays demande la permission de rester en arrière", ur: "الجد بن قیس نے پیچھے رہنے کی اجازت مانگی۔", tr: "Büyükbaba İbn Kays'ın geride kalma izni talebi.", id: "Permohonan kakek Ibn Qais untuk izin tinggal di belakang" }
summary:
  ar: "سأل النبي الجد بن قيس من بني سلمة هل له في قتال بني الأصفر، أي الروم، فاعتذر بأنه شديد الإعجاب بالنساء ويخشى الفتنة؛ فأعرض عنه النبي وأذن له. ويقول ابن إسحاق إن آية سورة التوبة نزلت فيه، ويشرحها بأن سقوطه في الفتنة بتخلفه أكبر مما خافه."
  en: Al-Jadd ibn Qays of Banu Salima asked the Prophet whether he had any part in fighting the Banu al-Asfar, meaning the Byzantines, and excused himself as a man too fond of women who feared temptation; the Prophet turned away from him and gave him leave. Ibn Ishaq says a verse of Sura al-Tawba was revealed about him, explaining that his falling into temptation by staying behind was greater than what he feared.
  es: "Al-Jadd ibn Qays, de Banu Salima, preguntó al Profeta si había participado en la lucha contra los Banu al-Asfar, es decir, los bizantinos, y se excusó diciendo que era un hombre demasiado aficionado a las mujeres y que temía la tentación; el Profeta se apartó de él y le dio permiso. Ibn Ishaq afirma que se reveló un versículo de la Sura al-Tawba sobre él, explicando que su caída en la tentación por quedarse atrás fue mayor de lo que temía."
  fr: "Al-Jadd ibn Qays, de la tribu des Banu Salima, interrogea le Prophète sur sa participation à la guerre contre les Banu al-Asfar (les Byzantins) et s'excusa, prétextant être trop épris des femmes et craindre la tentation. Le Prophète se détourna de lui et le laissa partir. Ibn Ishaq rapporte qu'un verset de la sourate At-Tawba fut révélé à son sujet, expliquant que le danger de succomber à la tentation en restant était plus grand encore que ce qu'il craignait."
  ur: "بنو سلیمہ کے الجد بن قیس نے رسول اللہ سے پوچھا کہ کیا بنو الاسفار یعنی بازنطینیوں سے لڑنے میں آپ کا کوئی حصہ تھا، اور اس نے اپنے آپ کو ایک مرد کی حیثیت سے عذر کیا جو فتنہ سے ڈرنے والی عورتوں سے بہت زیادہ پسند کرتے تھے۔ نبی نے اس سے منہ پھیر لیا اور اسے رخصت دے دی۔ ابن اسحاق کہتے ہیں کہ ان کے بارے میں سورۃ التوبہ کی ایک آیت نازل ہوئی جس میں بتایا گیا کہ پیچھے رہ کر ان کا فتنہ میں پڑنا اس سے بڑھ کر ہے جس سے وہ ڈرتا تھا۔"
  tr: "Peygamberimiz, Beni Salama kabilesinden Cedd ibn Kays'a Bizanslılara (yani Romalılara) karşı savaşa katılıp katılmayacağını sordu. Cedd, kadınlara çok düşkün olduğunu ve bunun sonucunda ortaya çıkacak günahlardan korktuğunu söyleyerek mazeretini kabul etti. Peygamberimiz ondan yüz çevirdi ve ona izin verdi. İbn İshak, Tevbe Suresi'ndeki ayetin onun hakkında indirildiğini ve geride kalmasının yol açacağı günahın, korktuğundan daha büyük olduğunu açıkladığını söyler."
  id: "Nabi bertanya kepada al-Jadd ibn Qays dari suku Banu Salama apakah ia mau ikut berperang melawan Bizantium (yaitu, Romawi). Al-Jadd beralasan, mengatakan bahwa ia sangat menyukai wanita dan takut akan godaan yang akan ditimbulkannya. Nabi berpaling darinya dan memberinya izin. Ibnu Ishaq mengatakan bahwa ayat dalam Surah At-Tawbah diturunkan mengenai dirinya, menjelaskan bahwa godaan yang ia terima karena tetap tinggal di belakang lebih besar daripada yang ia takutkan."
