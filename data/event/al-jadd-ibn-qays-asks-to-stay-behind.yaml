label: { ar: "استئذان الجد بن قيس في التخلف", en: "al-Jadd ibn Qays asks leave to stay behind" }
summary:
  ar: "سأل النبي الجد بن قيس من بني سلمة هل له في قتال بني الأصفر، أي الروم، فاعتذر بأنه شديد الإعجاب بالنساء ويخشى الفتنة؛ فأعرض عنه النبي وأذن له. ويقول ابن إسحاق إن آية سورة التوبة نزلت فيه، ويشرحها بأن سقوطه في الفتنة بتخلفه أكبر مما خافه."
  en: Al-Jadd ibn Qays of Banu Salima asked the Prophet whether he had any part in fighting the Banu al-Asfar, meaning the Byzantines, and excused himself as a man too fond of women who feared temptation; the Prophet turned away from him and gave him leave. Ibn Ishaq says a verse of Sura al-Tawba was revealed about him, explaining that his falling into temptation by staying behind was greater than what he feared.
