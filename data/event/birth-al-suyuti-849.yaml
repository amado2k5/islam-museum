summary:
  ar: "وُلد عبد الرحمن بن أبي بكر جلال الدين السيوطي في القاهرة يوم الأربعاء ١ رجب سنة ٨٤٩هـ الموافق ٣ تشرين الأول ١٤٤٥م، وكان أبوه يُدرّس الفقه الشافعي وينوب في القضاء؛ وينتسب السيوطي من جهة أبيه إلى أصل فارسي، وكانت الأسرة قد استقرت في أسيوط في العصر المملوكي، وأمه جارية شركسية. وتروى عن ولادته حكاية مبشّرة: قيل إن أمه وضعته وهي في مكتبة البيت، فلُقّب من أجل ذلك «ابن الكتب» {cite:encyclopaedia-of-islam-2 vol. 9 p. 913-914}."
  en: "Abd al-Rahman ibn Abi Bakr, Jalal al-Din al-Suyuti, was born in Cairo on 1 Rajab 849 (3 October 1445). His father taught Shafiʿi law and acted as substitute qadi; through him the family was of Persian origin and had settled in Asyut in the Mamluk period, while his mother was a Circassian slave. An anecdote prefigures his fertile career: his mother is said to have borne him in the family library, which earned him the nickname 'son of books' (ibn al-kutub) {cite:encyclopaedia-of-islam-2 vol. 9 p. 913-914}."
  ur: "عبد الرحمن بن ابی بکر، جلال الدین سیوطی، 1 رجب 849ھ ⁦(3 اکتوبر 1445ء)⁩ کو قاہرہ میں پیدا ہوئے۔ ان کے والد شافعی فقہ پڑھاتے اور نائب قاضی تھے؛ والد کی طرف سے خاندان فارسی نژاد تھا اور مملوک دور میں اسیوط میں آباد ہوا تھا، جبکہ والدہ ایک چرکسی لونڈی تھیں۔ ایک حکایت ان کے علمی مستقبل کی پیش بندی کرتی ہے: کہا جاتا ہے کہ والدہ نے انہیں گھر کی کتب خانے میں جنا، اسی لیے وہ «ابن الکتب» ⁦(کتابوں کا بیٹا)⁩ کہلائے {cite:encyclopaedia-of-islam-2 vol. 9 p. 913-914}۔"
  fr: "Abd al-Rahman ibn Abi Bakr, Jalal al-Din al-Suyuti, naquit au Caire le 1er Rajab 849 (3 octobre 1445). Son père enseignait le droit chaféite et exerçait comme cadi suppléant ; par lui, la famille était d'origine perse et s'était établie à Assiout à l'époque mamelouke, tandis que sa mère était une esclave circassienne. Une anecdote préfigure sa carrière féconde : sa mère l'aurait mis au monde dans la bibliothèque familiale, ce qui lui valut le surnom de « fils des livres » (ibn al-kutub) {cite:encyclopaedia-of-islam-2 vol. 9 p. 913-914}."
  es: "Abd al-Rahman ibn Abi Bakr, Jalal al-Din al-Suyuti, nació en El Cairo el 1 de Rajab de 849 (3 de octubre de 1445). Su padre enseñaba derecho shafi'í y ejercía como cadí suplente; a través de él, la familia era de origen persa y se había establecido en Asyut durante el período mameluco, mientras que su madre era una esclava circasiana. Una anécdota presagia su prolífica trayectoria: se dice que su madre lo dio a luz en la biblioteca familiar, lo que le valió el apodo de \"hijo de los libros\" (ibn al-kutub) {cite:encyclopaedia-of-islam-2 vol. 9 p. 913-914}."
  tr: "Abdülrahman ibn Ebu Bekr Celaleddin el-Suyuti, Hicri 849 yılının Receb ayının 1. Çarşamba günü (Miladi 3 Ekim 1445) Kahire'de doğdu. Babası Şafiî fıkıhı öğretmeni ve kadı olarak görev yapıyordu. El-Suyuti'nin baba tarafından soyu Fars kökenlidir ve aile Memlük döneminde Aşut'a yerleşmişti. Annesi Çerkes bir köleydi. Doğumuyla ilgili bir hikaye anlatılır: Annesinin onu evin kütüphanesinde doğurduğu, bu nedenle \"İbn el-Kutub\" (Kitapların Oğlu) lakabını aldığı söylenir."
  id: "Abd al-Rahman ibn Abi Bakr Jalal al-Din al-Suyuti lahir di Kairo pada hari Rabu, tanggal 1 Rajab, 849 H (3 Oktober 1445 M). Ayahnya mengajar fiqih mazhab Syafi'i dan menjabat sebagai hakim. Garis keturunan ayah Al-Suyuti berasal dari Persia, dan keluarganya menetap di Asyut pada masa Mamluk. Ibunya adalah seorang budak Circassian. Ada sebuah kisah tentang kelahirannya: konon ibunya melahirkannya di perpustakaan rumah, sehingga ia mendapat julukan \"Ibn al-Kutub\" (Putra Buku)."
