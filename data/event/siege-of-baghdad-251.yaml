id: event/siege-of-baghdad-251
class: event
kind: siege
label: { ar: "حصار بغداد في فتنة المستعين والمعتز", en: "Siege of Baghdad in the strife of al-Musta'in and al-Mu'tazz", es: "El asedio de Bagdad en la lucha entre al-Musta'in y al-Mu'tazz", fr: "Siège de Bagdad lors du conflit entre al-Musta'in et al-Mu'tazz", ur: "المستعین اور معتز کی لڑائی میں بغداد کا محاصرہ", tr: "Mustafan ve Mu'tezz Fitnesi Sırasında Bağdat Kuşatması", id: "Pengepungan Baghdad selama Fitnah al-Musta'in dan al-Mu'tazz" }
summary:
  ar: "في سنة إحدى وخمسين ومائتين قُتل بغا الصغير ووصيف على يد باغر التركي فاضطرب أمر الموالي بسامراء، ولحق المستعين ببغداد إلى محمد بن عبد الله بن طاهر، فقطع ابن طاهر الميرة عن أهل سامراء ومنع أن يصعد شيء منها من بغداد ولا ينحدر إليها، وأمره المستعين بتحصين بغداد فأقام عليها السور من باب الشماسية إلى سوق الثلاثاء ومن باب قطيعة أم جعفر إلى قصر حميد، وحفر الخنادق حول السورين في الجانبين وعمل مظلات يأوي إليها الفرسان في الحر والمطر، وبلغت النفقة ثلاثمائة ألف دينار وثلاثين ألف دينار، وجعل على باب الشماسية خمس شداخات بعرض الطريق ألبست بصفائح الحديد وشدت بالحبال، وباباً معلقاً يُرسل على من وافى الباب فيقتل من تحته، وعلى الباب الداخر عرادة وعلى الخارج خمس مجانيق كبار أكبرها المسمى الغضبان، وست عرادات ترمى ناحية رقة الشماسية، وعلى باب البردان ثماني عرادات أربعاً في كل ناحية وأربع شداخات، وكذلك على كل باب من أبواب بغداد في الجانبين الشرقي والغربي {cite:tabari-khayyat-part3 p. 279-280}، فلما صار الأتراك والمغاربة إلى أبواب مدينة السلام من الجانب الشرقي أُغلقت الأبواب في وجوههم ورُموا بالسهام والمنجنيقات والعرادات فقتل من الفريقين مقتل وجرح جماعة كثيرة ولم يزالوا كذلك إلى العصر {cite:tabari-khayyat-part3 p. 311}، ودامت الحرب بين أهل بغداد وعسكر سامراء حتى خلع المستعين نفسه وبويع المعتز يوم الجمعة لأربع خلون من المحرم سنة اثنتين وخمسين، ونُقل المستعين إلى قصر الحسن بن سهل بالمخرم وأُخذت منه القضيب والخاتم {cite:tabari-khayyat-part3 p. 374}."
  en: "In 251 Bugha al-Saghir and Wasif were killed at the hands of Bagir the Turk, and the affairs of the clients in Samarra were thrown into turmoil. Al-Musta'in fled to Baghdad, to Muhammad ibn Abd Allah ibn Tahir, who cut off supplies to the people of Samarra, forbidding anything to go up from Baghdad or down to it. Al-Musta'in ordered him to fortify Baghdad: a wall was raised from Bab al-Shammasiya to the Tuesday market and from Bab Qati'at Umm Ja'far to the palace of Humayd, trenches were dug round both walls on both sides, and shelters were built where horsemen could sit out heat and rain; the cost reached three hundred thousand dinars and thirty thousand dinars. At Bab al-Shammasiya five crushing engines were set across the road, plated with iron and tied with ropes, with a suspended gate released to crush whoever came beneath it; the inner gate had one catapult, the outer gate five large mangonels, the greatest called al-Ghadban, and six catapults faced toward Raqqat al-Shammasiya; at Bab al-Burdan there were eight catapults, four on each side, and four crushing engines; and the same was done at every gate of Baghdad on both the eastern and western sides {cite:tabari-khayyat-part3 p. 279-280}. When the Turks and the Maghariba reached the gates of the City of Peace on the eastern side, the gates were shut in their faces and they were struck with arrows, mangonels and catapults; many fell on both sides and many were wounded, and this went on until the afternoon {cite:tabari-khayyat-part3 p. 311}. The war between Baghdad's people and the Samarra army continued until al-Musta'in deposed himself; al-Mu'tazz was pledged allegiance on Friday, four days into Muharram 252. Al-Musta'in was moved to the palace of al-Hasan ibn Sahl at al-Mukharram, and his staff and ring were taken from him {cite:tabari-khayyat-part3 p. 374}."
  es: "En 251, Bugha al-Saghir y Wasif fueron asesinados por Bagir el Turco, y los asuntos de los clientes en Samarra se vieron sumidos en el caos. Al-Musta'in huyó a Bagdad, a la presencia de Muhammad ibn Abd Allah ibn Tahir, quien cortó los suministros a la gente de Samarra, prohibiendo que nada subiera o bajara de Bagdad. Al-Musta'in le ordenó fortificar Bagdad: se levantó una muralla desde Bab al-Shammasiya hasta el mercado de los martes y desde Bab Qati'at Umm Ja'far hasta el palacio de Humayd, se cavaron trincheras alrededor de ambas murallas a ambos lados, y se construyeron refugios donde los jinetes podían resguardarse del calor y la lluvia; el costo ascendió a trescientos mil dinares y treinta mil dinares. En Bab al-Shammasiya se colocaron cinco máquinas trituradoras a lo largo del camino, revestidas de hierro y atadas con cuerdas, con una compuerta suspendida que se abría para aplastar a cualquiera que pasara por debajo; La puerta interior tenía una catapulta, la puerta exterior cinco grandes mangoneles, el mayor llamado al-Ghadban, y seis catapultas apuntaban hacia Raqqat al-Shammasiya; en Bab al-Burdan había ocho catapultas, cuatro a cada lado, y cuatro máquinas trituradoras; y lo mismo se hizo en cada puerta de Bagdad en los lados este y oeste {cite:tabari-khayyat-part3 p. 279-280}. Cuando los turcos y los maghariba llegaron a las puertas de la Ciudad de la Paz en el lado este, las puertas se cerraron en sus caras y fueron atacados con flechas, mangoneles y catapultas; muchos cayeron en ambos lados y muchos resultaron heridos, y esto continuó hasta la tarde {cite:tabari-khayyat-part3 p. 311}. La guerra entre la gente de Bagdad y el ejército de Samarra continuó hasta que al-Musta'in se depuso a sí mismo; Al-Mu'tazz prestó juramento de lealtad el viernes, cuatro días después del comienzo de Muharram 252. Al-Musta'in fue trasladado al palacio de al-Hasan ibn Sahl en al-Mukharram, y le quitaron su bastón y su anillo {cite:tabari-khayyat-part3 p. 374}."
  fr: "En 251, Bugha al-Saghir et Wasif furent tués par Bagir le Turc, et les affaires des clients de Samarra furent plongées dans le chaos. Al-Musta'in s'enfuit à Bagdad, auprès de Muhammad ibn Abd Allah ibn Tahir, qui coupa les vivres aux habitants de Samarra, interdisant tout approvisionnement en provenance ou à destination de Bagdad. Al-Musta'in lui ordonna de fortifier Bagdad: un mur fut érigé de Bab al-Shammasiya au marché du mardi et de Bab Qati'at Umm Ja'far au palais d'Humayd; des tranchées furent creusées de part et d'autre des deux murs, et des abris furent construits pour protéger les cavaliers de la chaleur et de la pluie; le coût s'éleva à trois cent mille dinars et trente mille dinars respectivement. À Bab al-Shammasiya, cinq broyeurs furent placés en travers de la route, recouverts de fer et attachés par des cordes, avec une porte suspendue qui s'ouvrait pour écraser quiconque passait en dessous. La porte intérieure était équipée d'une catapulte, la porte extérieure de cinq grands mangonneaux, dont le plus imposant était nommé al-Ghadban, et de six catapultes orientées vers Raqqat al-Shammasiya; à Bab al-Burdan, on comptait huit catapultes, quatre de chaque côté, et quatre broyeurs; et il en allait de même à chaque porte de Bagdad, tant à l'est qu'à l'ouest {cite:tabari-khayyat-part3 p. 279-280}. Lorsque les Turcs et les Maghrébins atteignirent les portes de la Cité de la Paix, à l'est, celles-ci se refermèrent sur eux et ils furent bombardés de flèches, de mangonneaux et de catapultes; de nombreux soldats tombèrent des deux côtés et beaucoup furent blessés, et les combats se poursuivirent jusqu'à l'après-midi {cite:tabari-khayyat-part3 p. 311}. La guerre entre les Bagdadiens et l'armée de Samarra continua jusqu'à la destitution d'al-Musta'in. al-Mu'tazz a prêté allégeance le vendredi, quatre jours après le début du mois de Muharram 252. Al-Musta'in a été transféré au palais d'al-Hasan ibn Sahl à al-Mukharram, et son bâton et sa bague lui ont été retirés {cite:tabari-khayyat-part3 p. 374}."
  ur: "251 میں بغض الصغیر اور واصف باگیر ترک کے ہاتھوں مارے گئے اور سامرا میں مؤکلوں کے معاملات ہنگامہ آرائی میں پڑ گئے۔ المستعین بغداد کی طرف بھاگا، محمد بن عبد اللہ ابن طاہر کے پاس، جس نے سامرا کے لوگوں کے لیے سامان منقطع کر دیا، بغداد سے اوپر جانے یا نیچے جانے سے منع کر دیا۔ المستعین نے اسے بغداد کو مضبوط کرنے کا حکم دیا: باب الشمسیہ سے منگل کے بازار تک اور باب قتیط ام جعفر سے حمید کے محل تک ایک دیوار کھڑی کی گئی، دونوں دیواروں کے دونوں طرف خندقیں کھودی گئیں، اور پناہ گاہیں بنائی گئیں جہاں گھڑ سوار گرمی اور بارش سے بچ سکتے تھے۔ قیمت تین لاکھ دینار اور تیس ہزار دینار تک پہنچ گئی۔ باب الشماسیہ میں سڑک پر پانچ کرشنگ انجن لگائے گئے تھے، جو لوہے سے چڑھائے گئے تھے اور رسیوں سے بندھے ہوئے تھے، اس کے نیچے آنے والے کو کچلنے کے لیے ایک معلق گیٹ چھوڑ دیا گیا تھا۔ اندرونی دروازے پر ایک گلیل تھی، بیرونی دروازے پر پانچ بڑے مینگونل تھے، سب سے بڑا جسے الغدبان کہتے ہیں، اور چھ کیٹپلٹس کا رخ رقات الشمسیہ کی طرف تھا۔ باب البردان میں آٹھ کیٹپلٹس تھے، ہر طرف چار چار، اور چار کرشنگ انجن۔ اور مشرقی اور مغربی دونوں طرف بغداد کے ہر دروازے پر ایسا ہی کیا گیا۔ 279-280}۔ جب ترک اور مغریبہ مشرقی جانب شہر امن کے دروازے پر پہنچے تو دروازے ان کے منہ پر بند کر دیے گئے اور ان پر تیر، مینگونیل اور کیٹپلٹ مارے گئے۔ دونوں طرف سے بہت سے لوگ گرے اور بہت سے زخمی ہو گئے اور یہ سلسلہ دوپہر تک جاری رہا۔ 311}۔ بغداد کے لوگوں اور سامرا کی فوج کے درمیان جنگ اس وقت تک جاری رہی جب تک المستعین نے خود کو معزول نہ کر دیا۔ المعتز کی بیعت 252 محرم کے چار دن جمعہ کے دن ہوئی۔ المستعین کو المکرم میں حسن بن سہل کے محل میں منتقل کیا گیا اور اس کا عصا اور انگوٹھی اس سے لے لی گئی۔ 374}۔"
  tr: "Hicri 251 yılında (Miladi 867/868), Genç Buga ve Vasif, Türk Bağır tarafından öldürüldü. Bu olay, Samarra'daki Mevli (Arap olmayan Müslümanlar) arasında huzursuzluğa neden oldu. Bunun üzerine El-Musta'in, Muhammed ibn Abdullah ibn Tahir ile görüşmek üzere Bağdat'a gitti. İbn Tahir, Samarra halkının erzaklarını kesti ve Bağdat'a giden veya Bağdat'tan gelen tüm malların geçişini engelledi. El-Musta'in ona Bağdat'ı tahkim etmesini emretti. Şamasiya Kapısı'ndan Salı Pazarı'na ve Katia Ümmü Cafer Kapısı'ndan Hamid Sarayı'na kadar bir sur inşa etti. İki sur etrafına her iki taraftan hendekler kazdı ve süvarilerin sıcaktan ve yağmurdan korunmaları için sığınaklar inşa etti. Toplam maliyet 330.000 dinara ulaştı. Şamasiya Kapısı'nda, yolun genişliği boyunca beş siper yerleştirdi, bunları demir levhalarla kapladı ve halatlarla sabitledi. Ayrıca, kapıya yaklaşan herkesi vurup aşağıda öldürecek şekilde asma bir kapı da kurdurdu. İç kapıda bir savaş halatı, dış kapıda ise en büyüğüne el-Ghadban (Öfkeli) adı verilen beş büyük mancınık vardı. Şamasiye Kapısı'nın ince tarafına doğru altı savaş halatı daha yerleştirdi. Bardan Kapısı'nda ise her iki tarafta dörder olmak üzere sekiz savaş halatı ve dört savaş halatı vardı. Bağdat'ın doğu ve batı taraflarındaki her kapıda aynı şey yapıldı. Türkler ve Mağribiler, Barış Şehri'nin kapılarına doğu tarafından ulaştıklarında, kapılar yüzlerine kapatıldı ve oklar, mancınıklar ve patlayıcılarla bombalandılar. Her iki tarafta da birçok kişi öldü ve yaralandı ve bu durum öğleden sonraya kadar devam etti. Bağdat halkı ile Samarra ordusu arasındaki savaş, Mustafan'ın tahttan feragat edip Mu'tazz'ın elli iki yılının Muharrem ayının dördüncü Cuma günü biat etmesiyle sona erdi. Mustafan, Muhram'daki Hasan ibn Sahl'ın sarayına götürüldü ve asası ile yüzüğü elinden alındı. {Kaynak: Tabari-Hayyat-Bölüm 3, s. 374}"
  id: "Pada tahun 251 H (867/868 M), Bugha Muda dan Wasif dibunuh oleh Baghir orang Turki. Hal ini menyebabkan keresahan di kalangan Mawali (Muslim non-Arab) di Samarra. Al-Musta'in kemudian pergi ke Baghdad untuk bertemu dengan Muhammad ibn Abdullah ibn Tahir. Ibn Tahir memutus pasokan ke penduduk Samarra, mencegah barang apa pun masuk atau keluar dari Baghdad. Al-Musta'in memerintahkannya untuk membentengi Baghdad. Ia membangun tembok dari Gerbang Shamasiya ke Pasar Selasa dan dari Gerbang Qati'a Umm Ja'far ke Istana Hamid. Ia menggali parit di sekitar kedua tembok di kedua sisi dan membangun tempat berlindung bagi pasukan kavaleri untuk berlindung dari panas dan hujan. Total biaya mencapai 330.000 dinar. Di Gerbang Shamasiya, ia menempatkan lima benteng di sepanjang lebar jalan, ditutupi dengan lempengan besi dan diikat dengan tali. Ia juga memasang gerbang gantung yang akan menembak siapa pun yang mendekati gerbang, membunuh mereka di bawahnya. Di gerbang dalam, ia memiliki tali perang, dan di gerbang luar, ia memiliki lima ketapel besar, yang terbesar disebut al-Ghadban (yang Murka). Ia juga memiliki enam tali perang yang diarahkan ke sisi sempit Gerbang Shamasiya. Di Gerbang Bardan, ia memiliki delapan tali perang, empat di setiap sisi, dan empat tali perang. Hal yang sama dilakukan di setiap gerbang Baghdad di sisi timur dan barat {cite:tabari-khayyat-part3 p. 279-280}. Ketika Turki dan Maghreb mencapai gerbang Kota Perdamaian dari sisi timur, gerbang-gerbang itu ditutup di hadapan mereka dan mereka dibombardir dengan panah, ketapel, dan senjata peledak. Banyak yang tewas dan terluka di kedua belah pihak dan mereka terus seperti ini sampai sore hari {cite:tabari-khayyat-part3 p. 311}. Perang antara penduduk Baghdad dan tentara Samarra berlanjut hingga al-Musta'in turun takhta dan al-Mu'tazz disumpah setia pada hari Jumat, tanggal empat Muharram tahun lima puluh dua. Al-Musta'in dibawa ke istana al-Hasan ibn Sahl di al-Mukhram dan tongkat serta cincinnya diambil darinya {cite:tabari-khayyat-part3 p. 374}."
