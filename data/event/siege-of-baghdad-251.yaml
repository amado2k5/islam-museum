label: { ar: "حصار بغداد في فتنة المستعين والمعتز" }
summary:
  ar: "في سنة إحدى وخمسين ومائتين قُتل بغا الصغير ووصيف على يد باغر التركي فاضطرب أمر الموالي بسامراء، ولحق المستعين ببغداد إلى محمد بن عبد الله بن طاهر، فقطع ابن طاهر الميرة عن أهل سامراء ومنع أن يصعد شيء منها من بغداد ولا ينحدر إليها، وأمره المستعين بتحصين بغداد فأقام عليها السور من باب الشماسية إلى سوق الثلاثاء ومن باب قطيعة أم جعفر إلى قصر حميد، وحفر الخنادق حول السورين في الجانبين وعمل مظلات يأوي إليها الفرسان في الحر والمطر، وبلغت النفقة ثلاثمائة ألف دينار وثلاثين ألف دينار، وجعل على باب الشماسية خمس شداخات بعرض الطريق ألبست بصفائح الحديد وشدت بالحبال، وباباً معلقاً يُرسل على من وافى الباب فيقتل من تحته، وعلى الباب الداخر عرادة وعلى الخارج خمس مجانيق كبار أكبرها المسمى الغضبان، وست عرادات ترمى ناحية رقة الشماسية، وعلى باب البردان ثماني عرادات أربعاً في كل ناحية وأربع شداخات، وكذلك على كل باب من أبواب بغداد في الجانبين الشرقي والغربي {cite:tabari-khayyat-part3 p. 279-280}، فلما صار الأتراك والمغاربة إلى أبواب مدينة السلام من الجانب الشرقي أُغلقت الأبواب في وجوههم ورُموا بالسهام والمنجنيقات والعرادات فقتل من الفريقين مقتل وجرح جماعة كثيرة ولم يزالوا كذلك إلى العصر {cite:tabari-khayyat-part3 p. 311}، ودامت الحرب بين أهل بغداد وعسكر سامراء حتى خلع المستعين نفسه وبويع المعتز يوم الجمعة لأربع خلون من المحرم سنة اثنتين وخمسين، ونُقل المستعين إلى قصر الحسن بن سهل بالمخرم وأُخذت منه القضيب والخاتم {cite:tabari-khayyat-part3 p. 374}."
