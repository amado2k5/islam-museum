id: event/siege-of-baghdad-251
class: event
kind: siege
label: { ar: "حصار بغداد في فتنة المستعين والمعتز", en: "Siege of Baghdad in the strife of al-Musta'in and al-Mu'tazz" }
summary:
  ar: "في سنة إحدى وخمسين ومائتين قُتل بغا الصغير ووصيف على يد باغر التركي فاضطرب أمر الموالي بسامراء، ولحق المستعين ببغداد إلى محمد بن عبد الله بن طاهر، فقطع ابن طاهر الميرة عن أهل سامراء ومنع أن يصعد شيء منها من بغداد ولا ينحدر إليها، وأمره المستعين بتحصين بغداد فأقام عليها السور من باب الشماسية إلى سوق الثلاثاء ومن باب قطيعة أم جعفر إلى قصر حميد، وحفر الخنادق حول السورين في الجانبين وعمل مظلات يأوي إليها الفرسان في الحر والمطر، وبلغت النفقة ثلاثمائة ألف دينار وثلاثين ألف دينار، وجعل على باب الشماسية خمس شداخات بعرض الطريق ألبست بصفائح الحديد وشدت بالحبال، وباباً معلقاً يُرسل على من وافى الباب فيقتل من تحته، وعلى الباب الداخر عرادة وعلى الخارج خمس مجانيق كبار أكبرها المسمى الغضبان، وست عرادات ترمى ناحية رقة الشماسية، وعلى باب البردان ثماني عرادات أربعاً في كل ناحية وأربع شداخات، وكذلك على كل باب من أبواب بغداد في الجانبين الشرقي والغربي {cite:tabari-khayyat-part3 p. 279-280}، فلما صار الأتراك والمغاربة إلى أبواب مدينة السلام من الجانب الشرقي أُغلقت الأبواب في وجوههم ورُموا بالسهام والمنجنيقات والعرادات فقتل من الفريقين مقتل وجرح جماعة كثيرة ولم يزالوا كذلك إلى العصر {cite:tabari-khayyat-part3 p. 311}، ودامت الحرب بين أهل بغداد وعسكر سامراء حتى خلع المستعين نفسه وبويع المعتز يوم الجمعة لأربع خلون من المحرم سنة اثنتين وخمسين، ونُقل المستعين إلى قصر الحسن بن سهل بالمخرم وأُخذت منه القضيب والخاتم {cite:tabari-khayyat-part3 p. 374}."
  en: "In 251 Bugha al-Saghir and Wasif were killed at the hands of Bagir the Turk, and the affairs of the clients in Samarra were thrown into turmoil. Al-Musta'in fled to Baghdad, to Muhammad ibn Abd Allah ibn Tahir, who cut off supplies to the people of Samarra, forbidding anything to go up from Baghdad or down to it. Al-Musta'in ordered him to fortify Baghdad: a wall was raised from Bab al-Shammasiya to the Tuesday market and from Bab Qati'at Umm Ja'far to the palace of Humayd, trenches were dug round both walls on both sides, and shelters were built where horsemen could sit out heat and rain; the cost reached three hundred thousand dinars and thirty thousand dinars. At Bab al-Shammasiya five crushing engines were set across the road, plated with iron and tied with ropes, with a suspended gate released to crush whoever came beneath it; the inner gate had one catapult, the outer gate five large mangonels, the greatest called al-Ghadban, and six catapults faced toward Raqqat al-Shammasiya; at Bab al-Burdan there were eight catapults, four on each side, and four crushing engines; and the same was done at every gate of Baghdad on both the eastern and western sides {cite:tabari-khayyat-part3 p. 279-280}. When the Turks and the Maghariba reached the gates of the City of Peace on the eastern side, the gates were shut in their faces and they were struck with arrows, mangonels and catapults; many fell on both sides and many were wounded, and this went on until the afternoon {cite:tabari-khayyat-part3 p. 311}. The war between Baghdad's people and the Samarra army continued until al-Musta'in deposed himself; al-Mu'tazz was pledged allegiance on Friday, four days into Muharram 252. Al-Musta'in was moved to the palace of al-Hasan ibn Sahl at al-Mukharram, and his staff and ring were taken from him {cite:tabari-khayyat-part3 p. 374}."
