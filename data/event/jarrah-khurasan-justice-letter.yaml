label: { ar: "كتاب الجراح ورد عمر بن عبد العزيز" }
summary:
  ar: "كتب الجراح بن عبد الله إلى عمر بن عبد العزيز أن أهل خراسان قوم ساءت رعيتهم وإنه لا يصلحهم إلا السيف والسوط فإن رأى أمير المؤمنين أن يأذن له في ذلك، فكتب إليه عمر أما بعد فقد بلغني كتابك تذكر أن أهل خراسان قد ساءت رعيتهم وأنه لا يصلحهم إلا السيف والسوط فقد كذبت بل يصلحهم العدل والحق فابسط ذلك فيهم والسلام {cite:tarikh-khulafa-minhaj-1434 p. 393}."
  en: "Al-Jarrah ibn Abdallah wrote to Umar ibn Abd al-Aziz that the people of Khurasan were unruly subjects whom only the sword and the whip would set right, asking permission to apply them; Umar wrote back: 'Your letter reached me saying Khurasan's people are unruly and only sword and whip will mend them — you lie; justice and truth will mend them. Spread those among them, and peace' {cite:tarikh-khulafa-minhaj-1434 p. 393}."
