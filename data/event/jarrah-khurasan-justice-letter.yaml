label: { ar: "كتاب الجراح ورد عمر بن عبد العزيز", en: "The letter of al-Jarrah and Umar ibn Abd al-Aziz's reply", es: "La carta de al-Jarrah y la respuesta de Umar ibn Abd al-Aziz", fr: "La lettre d'al-Jarrah et la réponse d'Umar ibn Abd al-Aziz", ur: "الجراح کا خط اور عمر بن عبد العزیز کا جواب", tr: "Cerrahlar Kitabı ve Ömer ibn Abdülaziz'in Cevabı", id: "Kitab Para Ahli Bedah dan Tanggapan Umar ibn Abd al-Aziz" }
summary:
  ar: "كتب الجراح بن عبد الله إلى عمر بن عبد العزيز أن أهل خراسان قوم ساءت رعيتهم وإنه لا يصلحهم إلا السيف والسوط فإن رأى أمير المؤمنين أن يأذن له في ذلك، فكتب إليه عمر أما بعد فقد بلغني كتابك تذكر أن أهل خراسان قد ساءت رعيتهم وأنه لا يصلحهم إلا السيف والسوط فقد كذبت بل يصلحهم العدل والحق فابسط ذلك فيهم والسلام {cite:tarikh-khulafa-minhaj-1434 p. 393}."
  en: "Al-Jarrah ibn Abdallah wrote to Umar ibn Abd al-Aziz that the people of Khurasan were unruly subjects whom only the sword and the whip would set right, asking permission to apply them; Umar wrote back: 'Your letter reached me saying Khurasan's people are unruly and only sword and whip will mend them — you lie; justice and truth will mend them. Spread those among them, and peace' {cite:tarikh-khulafa-minhaj-1434 p. 393}."
  es: "Al-Jarrah ibn Abdallah escribió a Umar ibn Abd al-Aziz que el pueblo de Jorasán era rebelde y que solo la espada y el látigo podrían corregirlo, pidiéndole permiso para aplicarlos. Umar le respondió: «Me llegó tu carta diciendo que el pueblo de Jorasán es rebelde y que solo la espada y el látigo los enmendarán; mientes. La justicia y la verdad los enmendarán. Difunde eso entre ellos, y la paz». {cite:tarikh-khulafa-minhaj-1434 p. 393}."
  fr: "Al-Jarrah ibn Abdallah écrivit à Umar ibn Abd al-Aziz que les habitants du Khorasan étaient des sujets indisciplinés que seules l'épée et le fouet pourraient remettre dans le droit chemin, et demanda la permission de les employer. Umar répondit: « Ta lettre m'est parvenue, affirmant que les habitants du Khorasan sont indisciplinés et que seules l'épée et le fouet pourront les corriger; tu mens; seules la justice et la vérité les corrigeront. Répands-les parmi eux, et que la paix règne. » {cite:tarikh-khulafa-minhaj-1434 p. 393}."
  ur: "الجراح بن عبد اللہ نے عمر بن عبدالعزیز کو لکھا کہ خراسان کے لوگ بے قاعدہ رعایا ہیں جن کو صرف تلوار اور کوڑا ہی ٹھیک کر سکتا ہے، ان سے اجازت مانگنے کی درخواست کرتا ہے۔ عمر نے واپس لکھا: 'تمہارا خط مجھ تک پہنچا ہے کہ خراسان کے لوگ بے قاعدہ ہیں اور انہیں صرف تلوار اور کوڑا ہی ٹھیک کرے گا، تم جھوٹ بولتے ہو۔ انصاف اور سچائی ان کی اصلاح کرے گی۔ ان کے درمیان امن کو پھیلا دو۔ 393}۔"
  tr: "El-Cerrah ibn Abdullah, Ömer ibn Abdülaziz'e yazdığı mektupta, Horasan halkının tebaası kötüleşmiş bir halk olduğunu ve onları ancak kılıç ve kırbaçla ıslah edebileceklerini belirtmiştir. Eğer Müminlerin Emiri buna izin verirse, Ömer ona şöyle cevap yazmıştır: \"Bundan sonraki kısma gelince, mektubunuzda Horasan halkının kötüleştiğini ve onları ancak kılıç ve kırbaçla ıslah edebileceklerini belirtmişsiniz. Yalan söylemişsiniz. Aksine, adalet ve hakikat onları ıslah edecektir, bunu aralarında yayın. Selamün aleyküm.\" {cite:tarikh-khulafa-minhaj-1434 s. 393}"
  id: "Al-Jarrah ibn Abdullah menulis kepada Umar ibn Abd al-Aziz bahwa penduduk Khurasan adalah kaum yang rakyatnya telah menjadi jahat dan tidak ada yang dapat memperbaiki mereka kecuali pedang dan cambuk. Jika Amirul Mukminin berkenan mengizinkannya melakukan itu, maka Umar membalas suratnya: Adapun yang berikut ini, suratmu telah sampai kepadaku, di mana engkau menyebutkan bahwa penduduk Khurasan telah menjadi jahat dan tidak ada yang dapat memperbaiki mereka kecuali pedang dan cambuk. Engkau telah berbohong. Sebaliknya, keadilan dan kebenaranlah yang akan memperbaiki mereka, maka sebarkanlah itu di antara mereka. Semoga shalawat dan salam tercurah kepadamu. {cite:tarikh-khulafa-minhaj-1434 p. 393}."
