id: event/khatib-exodus-sham-451
class: event
kind: migration
label:
  ar: "خروج الخطيب من بغداد إلى الشام بعد فتنة البساسيري، ٤٥١هـ"
  en: "Al-Khatib leaves Baghdad for al-Sham after the Basasiri fitna, 451/1059"
  ur: "فتنہ بساسیری کے بعد خطیب کا بغداد سے شام کو رحلت، 451ھ/1059ء"
summary:
  ar: "خرج الخطيب من بغداد بعد فتنة البساسيري لتشوش الحال إلى الشام سنة إحدى وخمسين وأربعمائة، فأقام بها إلى صفر سنة سبع وخمسين {cite:tarikh-islam-dhahabi p. 92}؛ ويذكر ابن الجوزي أنه استتر ثم خرج من بغداد إلى الشام فدمشق وصور وطرابلس وحلب {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  en: "Al-Khatib left Baghdad for al-Sham in 451, as conditions fell into turmoil after the Basasiri fitna, and stayed in al-Sham until Safar 457 {cite:tarikh-islam-dhahabi p. 92}. Ibn al-Jawzi relates that he went into hiding, then left Baghdad for al-Sham — Damascus, Tyre, Tripoli and Aleppo {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  ur: "خطیب فتنہ بساسیری کے بعد بگاڑے ہوئے حالات میں 451ھ میں بغداد سے شام چلے گئے اور صفر 457ھ تک وہاں رہے {cite:tarikh-islam-dhahabi p. 92}؛ ابن الجوزی کے مطابق وہ پہلے چھپے، پھر بغداد سے شام — دمشق، صور، طرابلس اور حلب — روانہ ہوئے {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}۔"
