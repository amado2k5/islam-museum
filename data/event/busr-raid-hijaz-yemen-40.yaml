id: event/busr-raid-hijaz-yemen-40
class: event
kind: raid
label: { ar: "سرية بسر بن أبي أرطاة إلى الحجاز واليمن", en: "Busr ibn Abi Artat's raid through the Hijaz and Yemen (40 AH)" }
summary:
  ar: "في سنة أربعين بعث معاوية بسر بن أبي أرطاة في ثلاثة آلاف، فدخل المدينة وهرب عامل علي أبو أيوب الأنصاري، فصعد منبرها ونادى على بطون الأنصار بأسمائهم يوبخهم ثم قال: والله لولا ما عهد إلي معاوية ما تركت بها محتلماً، وأكره الناس على البيعة حتى جاء جابر بن عبد الله يستشير أم سلمة فبايع خوفاً؛ ثم سار إلى مكة فهرب أبو موسى الأشعري وأكره أهلها، ثم سار إلى اليمن وقد هرب عاملها عبيد الله بن العباس، فقتل واليها عبد الله بن عبد المدان وابنه، وأخذ ابني عبيد الله الصغيرين عبد الرحمن وقتام فقتلهما، وقاتل عنهما رجل من كنانة حتى قتل هو وهم، وخرجت امرأة من بني كنانة تقول: قتلت الرجال فعلام تقتل هذين؟ والله ما كانوا يقتلون في الجاهلية والإسلام؛ فأرسل علي جارية بن قدامة السعدي في ألفين ووهب بن مسعود في ألفين، فهرب بسر وأصحابه واتبعه جارية إلى مكة، ثم أتى المدينة وأبو هريرة يصلي بالناس فهرب منه، فبايع أهلها الحسن بن علي لما هلك أبوه، وولهت أم الغلامين فكانت لا تعقل وتناشدهما في المواسم {cite:kamil-ibn-al-athir p. 732-733}."
  en: "Mu'awiya's terror-raid of 40: Busr ibn Abi Artat entered Medina unopposed, mounted the minbar and mocked the Ansar clans by name — 'had Mu'awiya not bound me I would leave no grown man' — forced bay'a at Mecca, then in Yemen killed the governor and butchered Ubaydallah ibn al-Abbas's two small boys over a Kinani protector who died shielding them, while their mother went mad with grief. Ali's counter-column under Jariya ibn Qudama chased Busr to Mecca and took Medina's bay'a for al-Hasan {cite:kamil-ibn-al-athir p. 732-733}."
