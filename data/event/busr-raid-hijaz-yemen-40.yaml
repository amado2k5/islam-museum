label: { ar: "سرية بسر بن أبي أرطاة إلى الحجاز واليمن", en: "Busr ibn Abi Artat's raid through the Hijaz and Yemen (40 AH)", fr: "Le raid de Busr ibn Abi Artat à travers le Hedjaz et le Yémen (40 H)", es: "La incursión de Busr ibn Abi Artat a través del Hiyaz y Yemen (40 AH)", ur: "بسر بن ابی ارت کا حجاز اور یمن پر حملہ ⁦(40ھ)⁩", tr: "Busr ibn Abi Artat'ın Hicaz ve Yemen'e Seferi", id: "Ekspedisi Busr ibn Abi Artat ke Hijaz dan Yaman" }
summary:
  ar: "في سنة أربعين بعث معاوية بسر بن أبي أرطاة في ثلاثة آلاف، فدخل المدينة وهرب عامل علي أبو أيوب الأنصاري، فصعد منبرها ونادى على بطون الأنصار بأسمائهم يوبخهم ثم قال: والله لولا ما عهد إلي معاوية ما تركت بها محتلماً، وأكره الناس على البيعة حتى جاء جابر بن عبد الله يستشير أم سلمة فبايع خوفاً؛ ثم سار إلى مكة فهرب أبو موسى الأشعري وأكره أهلها، ثم سار إلى اليمن وقد هرب عاملها عبيد الله بن العباس، فقتل واليها عبد الله بن عبد المدان وابنه، وأخذ ابني عبيد الله الصغيرين عبد الرحمن وقتام فقتلهما، وقاتل عنهما رجل من كنانة حتى قتل هو وهم، وخرجت امرأة من بني كنانة تقول: قتلت الرجال فعلام تقتل هذين؟ والله ما كانوا يقتلون في الجاهلية والإسلام؛ فأرسل علي جارية بن قدامة السعدي في ألفين ووهب بن مسعود في ألفين، فهرب بسر وأصحابه واتبعه جارية إلى مكة، ثم أتى المدينة وأبو هريرة يصلي بالناس فهرب منه، فبايع أهلها الحسن بن علي لما هلك أبوه، وولهت أم الغلامين فكانت لا تعقل وتناشدهما في المواسم {cite:kamil-ibn-al-athir p. 732-733}."
  en: "Mu'awiya's terror-raid of 40: Busr ibn Abi Artat entered Medina unopposed, mounted the minbar and mocked the Ansar clans by name — 'had Mu'awiya not bound me I would leave no grown man' — forced bay'a at Mecca, then in Yemen killed the governor and butchered Ubaydallah ibn al-Abbas's two small boys over a Kinani protector who died shielding them, while their mother went mad with grief. Ali's counter-column under Jariya ibn Qudama chased Busr to Mecca and took Medina's bay'a for al-Hasan {cite:kamil-ibn-al-athir p. 732-733}."
  fr: "Le raid de terreur de Mu'awiya en 40 : Busr ibn Abi Artat entra à Médine sans opposition, monta sur le minbar et railla nommément les clans des Ansar (« si Mu'awiya ne m'avait pas lié, je ne laisserais aucun homme adulte »), imposa la bay'a à La Mecque, puis au Yémen tua le gouverneur et massacra les deux petits garçons d'Ubaydallah ibn al-Abbas, malgré un protecteur kinanite qui mourut en les défendant, tandis que leur mère devenait folle de chagrin. La colonne de riposte d'Ali, sous Jariya ibn Qudama, poursuivit Busr jusqu'à La Mecque et reçut la bay'a de Médine pour al-Hasan {cite:kamil-ibn-al-athir p. 732-733}."
  es: "La incursión de terror de Mu'awiya de 40: Busr ibn Abi Artat entró en Medina sin oposición, subió al minbar y se burló de los clanes Ansar por su nombre —«si Mu'awiya no me hubiera atado, no habría dejado a ningún hombre adulto»—, obligó a prestar juramento de lealtad en La Meca, y luego en Yemen mató al gobernador y masacró a los dos niños pequeños de Ubaydallah ibn al-Abbas por un protector Kinani que murió protegiéndolos, mientras su madre enloquecía de dolor. La contracolumna de Ali, bajo el mando de Jariya ibn Qudama, persiguió a Busr hasta La Meca y tomó el juramento de lealtad de Medina a favor de al-Hasan {cite:kamil-ibn-al-athir p. 732-733}."
  ur: "معاویہ کا 40 کا دہشت گردانہ حملہ: بسر بن ابی ارت بلا مقابلہ مدینہ میں داخل ہوا، منبر پر چڑھا اور انصار قبیلوں کا نام لے کر مذاق اڑایا - 'اگر معاویہ مجھے پابند نہ کرتا تو میں کسی بڑے آدمی کو نہ چھوڑتا' - مکہ میں زبردستی بیعت کی گئی، پھر یمن میں گورنر کو قتل کیا اور دو چھوٹے بچوں کو ابوعباس نے قتل کیا۔ کنانی محافظ جو انہیں بچاتے ہوئے مر گئے، جب کہ ان کی ماں غم سے پاگل ہو گئی۔ جریہ ابن قدامہ کے ماتحت علی کے جوابی کالم نے بصر کا مکہ تک پیچھا کیا اور الحسن کے لیے مدینہ کی بیع لے لی۔ 732-733}۔"
  tr: "Kırkıncı yılda Muaviye, Busr ibn Abi Artah'ı üç bin adamla gönderdi. Medine'ye girdiğinde, Ali'nin valisi Ebu Eyyub el-Ensari kaçtı. Busr, minbere çıktı ve Ensar kabilelerinin isimlerini okuyarak onları azarladı. Sonra şöyle dedi: \"Allah'a yemin ederim ki, Muaviye bana emanet ettiği şey olmasaydı, orada tek bir yetişkin erkek bırakmazdım.\" Cabir ibn Abdullah, Ümmü Seleme'ye danışmaya gelene ve korkudan biat edene kadar, halkı biat etmeye zorladı. Sonra Mekke'ye yürüdü ve Ebu Musa el-Eş'ari kaçtı, halkını da zorladı. Sonra Yemen'e yürüdü ve valisi Ubeydullah ibn el-Abbas kaçmıştı. Valisi Abdullah ibn Abd el-Medan'ı ve oğlunu öldürdü ve Ubeydullah'ın iki küçük oğlu Abd el-Rahman ve Katam'ı da alıp öldürdü. Kinanah kabilesinden bir adam onlar için savaştı, ta ki kendisi ve onlar öldürülene kadar. Beni Kinanah kabilesinden bir kadın çıkıp şöyle dedi: \"Erkekleri öldürdünüz, neden bu ikisini öldürüyorsunuz? Allah'a yemin ederim ki, onlar İslam öncesi dönemde de İslam'da da öldürülmediler.\" Bunun üzerine Ali, Cariye ibn Kudame el-Saadi'yi iki bin adamla ve Vahb ibn Mesud'u da iki bin adamla gönderdi. Busr ve arkadaşları kaçtı ve Cariye onu Mekke'ye kadar takip etti. Sonra Medine'ye geldiğinde Ebu Hurayra insanlara namaz kıldırıyordu, bu yüzden ondan kaçtı. Sonra Medine halkı, babası öldüğünde Hasan ibn Ali'ye biat etti. İki oğlanın annesi perişan haldeydi ve düşünmeden, hac zamanlarında onlara şiirler okurdu. {Kaynak: Kamil ibn el-Atir s. 732-733}"
  id: "Pada tahun keempat puluh, Muawiyah mengutus Busr ibn Abi Artah dengan tiga ribu orang. Ia memasuki Madinah, dan gubernur Ali, Abu Ayyub al-Ansari, melarikan diri. Ia naik ke mimbar dan memanggil nama-nama klan Ansar, menegur mereka. Kemudian ia berkata: Demi Allah, seandainya bukan karena apa yang dipercayakan Muawiyah kepadaku, aku tidak akan meninggalkan seorang pun laki-laki dewasa di sana. Ia memaksa orang-orang untuk berbaiat sampai Jabir ibn Abdullah datang untuk berkonsultasi dengan Umm Salamah dan berbaiat karena takut. Kemudian ia berbaris ke Mekah, dan Abu Musa al-Ash’ari melarikan diri, dan ia memaksa penduduknya. Kemudian ia berbaris ke Yaman, dan gubernurnya, Ubayd Allah ibn al-Abbas, telah melarikan diri. Ia membunuh gubernurnya, Abdullah ibn Abd al-Madan, dan putranya, dan ia mengambil dua putra muda Ubayd Allah, Abd al-Rahman dan Qatam, dan membunuh mereka. Seorang pria dari Kinanah berperang untuk mereka sampai dia dan mereka terbunuh. Seorang wanita dari Banu Kinanah keluar dan berkata: Kalian membunuh para pria, lalu mengapa kalian membunuh kedua anak ini? Demi Allah, mereka tidak terbunuh di era pra-Islam atau di dalam Islam. Maka Ali mengutus Jariyah ibn Qudamah al-Saadi dengan dua ribu orang dan Wahb ibn Masoud dengan dua ribu orang. Busr dan para sahabatnya melarikan diri, dan Jariyah mengikutinya ke Mekah. Kemudian dia sampai di Madinah ketika Abu Hurayrah sedang memimpin orang-orang dalam salat, sehingga dia melarikan diri darinya. Kemudian penduduk Madinah berbaiat kepada al-Hasan ibn Ali ketika ayahnya meninggal. Ibu dari kedua anak laki-laki itu sangat sedih dan tidak berpikir jernih, dan dia membacakan puisi untuk mereka selama musim haji. {cite:kamil-ibn-al-athir p. 732-733}"
