id: event/al-hadi-hangs-the-slain-of-banu-al-harith-and-lets-them-be-buried-286
class: event
kind: other
label:
  ar: تعليق قتلى بني الحارث ثم السماح بدفنهم، 286هـ
  en: The slain of Banu al-Harith are hung and then allowed burial, 286 AH
  ur: بنو حارث کے مقتولوں کو لٹکایا جانا اور پھر دفن کی اجازت، 286ھ
summary:
  ar: يعود الهادي إلى القرية آخر النهار فيأمر بجمع القتلى وتعليقهم منكسين في الشجر، ويقيم ثلاثة أيام أو أربعة حتى تنتن القرية فلا يقدر أحد على الأكل، فتأتي بنو الحارث فتقبّل رأسه ورجليه ويديه وتسأله أن يهب لهم جيف إخوانهم، فيأبى ثم يجيب بعد إلحاحهم ويذكّرهم بقوله، فتُطرح الجيف في آبار خربة وحفر خارج القرية.
  en: Al-Hadi returns to the village at the end of the day and orders the slain gathered and hung head down in the trees; he stays three or four days until the village stinks so that no one can eat, and Banu al-Harith come, kiss his head, feet and hands and ask him to give them their brothers' bodies; he refuses, then consents after they press him, reminds them of what he had said, and the bodies are cast into ruined wells and pits outside the village.
  ur: ہادی دن کے آخر میں بستی لوٹتے ہیں اور مقتولوں کو جمع کر کے درختوں میں الٹا لٹکانے کا حکم دیتے ہیں؛ وہ تین یا چار دن ٹھہرتے ہیں یہاں تک کہ بستی میں ایسی بو پھیل جاتی ہے کہ کوئی کھا نہیں سکتا، تو بنو حارث آ کر ان کا سر، پاؤں اور ہاتھ چومتے ہیں اور اپنے بھائیوں کی لاشیں مانگتے ہیں؛ وہ انکار کرتے ہیں پھر ان کے اصرار پر مان جاتے ہیں اور انہیں اپنی کہی بات یاد دلاتے ہیں، اور لاشیں بستی کے باہر اجڑے کنوؤں اور گڑھوں میں ڈالی جاتی ہیں۔
