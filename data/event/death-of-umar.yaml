label: { ar: "وفاة عمر بن الخطاب", en: "Death of Umar ibn al-Khattab", es: "Muerte de Umar ibn al-Khattab", fr: "Mort d'Umar ibn al-Khattab", ur: "عمر بن الخطاب کی وفات" }
summary:
  ar: "طعنه أبو لؤلؤة، غلام المغيرة بن شعبة، وكان نصرانياً، في سوق المدينة {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. ولما أُصيب عمر سأل ابنه عبد الله عن قاتله، فقال: «قتلك أبو لؤلؤة غلام المغيرة بن شعبة» فحمد الله أن لم تكن منيته على يد رجل سجد لله سجدة {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. وعند السيوطي أن عمر قال لأصحابه أوعدني العبد آنفاً بعد أن قال أبو لؤلؤة لأصنعن لك رحىً يتحدث الناس بها وأنه نفر من منى فأناخ بالأبطح ودعا اللهم كبرت سني وضعفت قوتي وانتشرت رعيتي فاقبضني إليك غير مضيع ولا مفرط فما انسلخ ذو الحجة حتى قتل {cite:tarikh-khulafa-minhaj-1434}."
  en: "Abu Lu'lu'a, a slave of al-Mughira ibn Shu'ba and a Christian, stabbed him in the market of Medina {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. When Umar was struck he asked his son Abdallah who had killed him; Abdallah answered: 'Abu Lu'lu'a, the slave of al-Mughira ibn Shu'ba, killed you.' Umar praised God that his death had not come at the hands of a man who had prostrated to God even once {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. In al-Suyuti, Umar told his companions that the slave had threatened him a moment earlier, after Abu Lu'lu'a had said, 'I will make you a mill that people will talk about'; that he had set out from Mina and halted at al-Abtah, and there prayed: 'O God, my years have grown great, my strength has weakened and my subjects have spread; take me to You, neither failing nor negligent.' Before Dhu'l-Hijja was out he had been killed {cite:tarikh-khulafa-minhaj-1434}."
  es: "Abu Lu'lu'a, esclavo de al-Mughira ibn Shu'ba y cristiano, lo apuñaló en el mercado de Medina {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. Cuando Umar fue herido, le preguntó a su hijo Abdallah quién lo había matado; Abdallah respondió: 'Abu Lu'lu'a, el esclavo de al-Mughira ibn Shu'ba, te mató'. Umar alabó a Dios porque su muerte no había llegado a manos de un hombre que se había postrado ante Dios ni siquiera una vez {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. En al-Suyuti, Umar les dijo a sus compañeros que el esclavo lo había amenazado un momento antes, después de que Abu Lu'lu'a dijera: 'Te haré un molino del que la gente hablará'; que partió de Mina y se detuvo en al-Abtah, y allí oró: «Oh Dios, mis años han llegado a ser muchos, mi fuerza se ha debilitado y mis súbditos se han dispersado; llévame a Ti, sin fallar ni descuidar». Antes de que terminara Dhu'l-Hijja, había sido asesinado {cite:tarikh-khulafa-minhaj-1434}."
  fr: "Abou Lu'lu'a, esclave d'al-Mughira ibn Shu'ba et chrétien, le poignarda sur le marché de Médine (voir Tabari Tarikh Abu al-Fadl, vol. 4, p. 190). Atteint, Umar demanda à son fils Abdallah qui l'avait tué; Abdallah répondit: « Abou Lu'lu'a, l'esclave d'al-Mughira ibn Shu'ba, t'a tué. » Umar loua Dieu de ce que sa mort ne lui soit pas venue des mains d'un homme qui s'était prosterné devant Lui ne serait-ce qu'une seule fois (voir Tabari Tarikh Abu al-Fadl, vol. 4, p. 192). Dans al-Suyuti, Umar raconta à ses compagnons que l'esclave l'avait menacé un instant auparavant, après qu'Abou Lu'lu'a eut dit: « Je te construirai un moulin dont on parlera. » qu'il était parti de Mina et s'était arrêté à al-Abtah, et là il avait prié: « Ô Dieu, mes années ont passé, ma force a faibli et mes sujets se sont répandus; emmène-moi vers Toi, sans faillir ni négliger. » Avant la fin de Dhu'l-Hijja, il avait été tué {cite:tarikh-khulafa-minhaj-1434}."
  ur: "مغیرہ بن شعبہ کے غلام اور ایک عیسائی نے ابو لولوعہ کو مدینہ کے بازار میں چھرا گھونپ کر مارا۔ جب عمر کو مارا گیا تو اس نے اپنے بیٹے عبداللہ سے پوچھا کہ اسے کس نے مارا ہے؟ عبداللہ نے جواب دیا: 'مغیرہ بن شعبہ کے غلام ابو للوع نے تمہیں قتل کیا ہے۔' عمر نے خدا کی حمد و ثنا بیان کی کہ ان کی موت ایسے شخص کے ہاتھ نہیں آئی جس نے ایک بار بھی خدا کو سجدہ کیا تھا السیوطی میں، عمر نے اپنے ساتھیوں کو بتایا کہ غلام نے ایک لمحہ پہلے اسے دھمکی دی تھی، جب ابو لعلعہ نے کہا تھا کہ 'میں تمہیں ایک چکی بناؤں گا جس کے بارے میں لوگ بات کریں گے'؛ وہ منیٰ سے روانہ ہوئے اور ابتہ میں رکے اور وہاں یہ دعا کی: اے اللہ، میرے سال بڑے ہو گئے، میری طاقت کمزور ہو گئی اور میری رعایا پھیل گئی۔ مجھے اپنے پاس لے جاؤ، نہ ناکام ہو کر نہ غافل ہو۔' ذی الحجہ کے باہر نکلنے سے پہلے اسے قتل کر دیا گیا تھا۔"
