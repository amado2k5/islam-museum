id: event/death-of-umar
class: event
kind: death
label: { ar: "وفاة عمر بن الخطاب", en: "Death of Umar ibn al-Khattab" }
summary:
  ar: "طعنه أبو لؤلؤة، غلام المغيرة بن شعبة، وكان نصرانياً، في سوق المدينة {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. ولما أُصيب عمر سأل ابنه عبد الله عن قاتله، فقال: «قتلك أبو لؤلؤة غلام المغيرة بن شعبة» فحمد الله أن لم تكن منيته على يد رجل سجد لله سجدة {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. وعند السيوطي أن عمر قال لأصحابه أوعدني العبد آنفاً بعد أن قال أبو لؤلؤة لأصنعن لك رحىً يتحدث الناس بها وأنه نفر من منى فأناخ بالأبطح ودعا اللهم كبرت سني وضعفت قوتي وانتشرت رعيتي فاقبضني إليك غير مضيع ولا مفرط فما انسلخ ذو الحجة حتى قتل {cite:tarikh-khulafa-minhaj-1434}."
  en: "Abu Lu'lu'a, a slave of al-Mughira ibn Shu'ba and a Christian, stabbed him in the market of Medina {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. When Umar was struck he asked his son Abdallah who had killed him; Abdallah answered: 'Abu Lu'lu'a, the slave of al-Mughira ibn Shu'ba, killed you.' Umar praised God that his death had not come at the hands of a man who had prostrated to God even once {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. In al-Suyuti, Umar told his companions that the slave had threatened him a moment earlier, after Abu Lu'lu'a had said, 'I will make you a mill that people will talk about'; that he had set out from Mina and halted at al-Abtah, and there prayed: 'O God, my years have grown great, my strength has weakened and my subjects have spread; take me to You, neither failing nor negligent.' Before Dhu'l-Hijja was out he had been killed {cite:tarikh-khulafa-minhaj-1434}."
