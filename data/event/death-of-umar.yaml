summary:
  ar: "طعنه أبو لؤلؤة، غلام المغيرة بن شعبة، وكان نصرانياً، في سوق المدينة {cite:tabari-tarikh-abu-al-fadl j.4 p.190}. ولما أُصيب عمر سأل ابنه عبد الله عن قاتله، فقال: «قتلك أبو لؤلؤة غلام المغيرة بن شعبة» فحمد الله أن لم تكن منيته على يد رجل سجد لله سجدة {cite:tabari-tarikh-abu-al-fadl j.4 p.192}."
