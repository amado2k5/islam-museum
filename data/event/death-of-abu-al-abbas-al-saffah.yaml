label: { ar: "وفاة أبي العباس السفاح", en: "The Death of Abu al-Abbas al-Saffah" }
summary:
  ar: "في سنة ست وثلاثين ومائة قدم أبو مسلم على أبي العباس بعد انقضاء الموسم {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وذكر الطبري موت أبي العباس السفاح، ومدة خلافته {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وعند السيوطي مات بالجدري في ذي الحجة سنة ست وثلاثين ومئة وكان قد عهد لأخيه أبي جعفر، وفي سنة أربع وثلاثين كان قد انتقل إلى الأنبار وصيرها دار الخلافة {cite:tarikh-khulafa-minhaj-1434 p. 419}"
  en: "In the year 136 Abu Muslim came to Abu al-Abbas after the pilgrimage season had ended {cite:tabari-tarikh-abu-al-fadl j.7 p.470}, and al-Tabari mentions the death of Abu al-Abbas al-Saffah and the length of his caliphate {cite:tabari-tarikh-abu-al-fadl j.7 p.470}. According to al-Suyuti he died of smallpox in Dhu al-Hijja of the year 136, having designated his brother Abu Ja'far as successor; in the year 134 he had moved to al-Anbar and made it the seat of the caliphate {cite:tarikh-khulafa-minhaj-1434 p. 419}"
