id: event/death-of-abu-al-abbas-al-saffah
class: event
kind: death
label: { ar: "وفاة أبي العباس السفاح", en: "The Death of Abu al-Abbas al-Saffah", es: "La muerte de Abu al-Abbas al-Saffah", fr: "La mort d'Abu al-Abbas al-Saffah" }
summary:
  ar: "في سنة ست وثلاثين ومائة قدم أبو مسلم على أبي العباس بعد انقضاء الموسم {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وذكر الطبري موت أبي العباس السفاح، ومدة خلافته {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وعند السيوطي مات بالجدري في ذي الحجة سنة ست وثلاثين ومئة وكان قد عهد لأخيه أبي جعفر، وفي سنة أربع وثلاثين كان قد انتقل إلى الأنبار وصيرها دار الخلافة {cite:tarikh-khulafa-minhaj-1434 p. 419}"
  en: "In the year 136 Abu Muslim came to Abu al-Abbas after the pilgrimage season had ended {cite:tabari-tarikh-abu-al-fadl j.7 p.470}, and al-Tabari mentions the death of Abu al-Abbas al-Saffah and the length of his caliphate {cite:tabari-tarikh-abu-al-fadl j.7 p.470}. According to al-Suyuti he died of smallpox in Dhu al-Hijja of the year 136, having designated his brother Abu Ja'far as successor; in the year 134 he had moved to al-Anbar and made it the seat of the caliphate {cite:tarikh-khulafa-minhaj-1434 p. 419}"
  es: "En el año 136, Abu Muslim llegó a Abu al-Abbas después de que terminara la temporada de peregrinación {cite:tabari-tarikh-abu-al-fadl j.7 p.470}, y al-Tabari menciona la muerte de Abu al-Abbas al-Saffah y la duración de su califato {cite:tabari-tarikh-abu-al-fadl j.7 p.470}. Según al-Suyuti, murió de viruela en Dhu al-Hijja del año 136, habiendo designado a su hermano Abu Ja'far como sucesor; en el año 134 se había trasladado a al-Anbar y la había convertido en la sede del califato {cite:tarikh-khulafa-minhaj-1434 p. 419}."
  fr: "En l'an 136, Abu Muslim se rendit auprès d'Abu al-Abbas après la fin du pèlerinage (cf. Tabari-Tarikh-Abu-al-Fadl, vol. 7, p. 470). Al-Tabari mentionne la mort d'Abu al-Abbas al-Saffah et la durée de son califat (cf. Tabari-Tarikh-Abu-al-Fadl, vol. 7, p. 470). Selon al-Suyuti, il mourut de la variole en Dhu al-Hijja de l'an 136, après avoir désigné son frère Abu Ja'far comme successeur. En l'an 134, il s'était installé à al-Anbar et en avait fait le siège du califat (cf. Tarikh-Khulafa-Minhaj, 1434, p. 419)."
