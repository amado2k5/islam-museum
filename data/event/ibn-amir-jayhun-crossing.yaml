label: { ar: "عبور ابن عامر النهر وإحرامه شكراً", en: "Ibn Amir's Crossing of the River and his Thanksgiving Ihram" }
summary:
  ar: "قال أبو عبيدة فتح ابن عامر ما دون النهر فلما بلغ ما وراء النهر أمره طلبوا إليه أن يصالحهم ففعل فيقال إنه عبر النهر حتى أتى موضعاً وقيل بل أتوه فصالحوه وبعث من قبض ذلك فأتته الدواب والوصيفاء والوصائف والحرير والثياب ثم إنه أحرم شكراً لله ولم يذكر غيره عبوره النهر ومصالحته أهل الجانب الشرقي وأهل بعمرة وقدم على عثمان."
  en: "Abu Ubayda: Ibn Amir conquered this side of the river; when his fame reached Transoxania they sued for peace — he crossed to a place, or they came to him and truced — and collectors brought beasts, wada'if, silk and garments, whereupon he made ihram in thanks to God. No one else reports his crossing or his sulh with the east-bank people; he then performed umra and came before Uthman."
