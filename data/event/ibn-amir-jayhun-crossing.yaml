id: event/ibn-amir-jayhun-crossing
class: event
kind: other
label: { ar: "عبور ابن عامر النهر وإحرامه شكراً", en: "Ibn Amir's Crossing of the River and his Thanksgiving Ihram", es: "El cruce del río por Ibn Amir y su Ihram de Acción de Gracias", fr: "La traversée du fleuve par Ibn Amir et son ihram de remerciement", ur: "ابن عامر کا دریا کو عبور کرنا اور اس کا تشکر کا احرام", tr: "İbn Amir'in nehri geçmesi ve şükran göstergesi olarak ihram haline girmesi.", id: "Penyeberangan sungai oleh Ibnu Amir dan masuknya beliau ke dalam keadaan ihram sebagai ungkapan terima kasih." }
summary:
  ar: "قال أبو عبيدة فتح ابن عامر ما دون النهر فلما بلغ ما وراء النهر أمره طلبوا إليه أن يصالحهم ففعل فيقال إنه عبر النهر حتى أتى موضعاً وقيل بل أتوه فصالحوه وبعث من قبض ذلك فأتته الدواب والوصيفاء والوصائف والحرير والثياب ثم إنه أحرم شكراً لله ولم يذكر غيره عبوره النهر ومصالحته أهل الجانب الشرقي وأهل بعمرة وقدم على عثمان."
  en: "Abu Ubayda: Ibn Amir conquered this side of the river; when his fame reached Transoxania they sued for peace — he crossed to a place, or they came to him and truced — and collectors brought beasts, wada'if, silk and garments, whereupon he made ihram in thanks to God. No one else reports his crossing or his sulh with the east-bank people; he then performed umra and came before Uthman."
  es: "Abu Ubayda: Ibn Amir conquistó esta orilla del río; cuando su fama llegó a Transoxiana, le pidieron la paz: cruzó a algún lugar, o bien ellos acudieron a él y firmaron una tregua. Los recaudadores le trajeron animales, wada'if, seda y vestimentas, tras lo cual entró en estado de ihram en agradecimiento a Dios. Nadie más relata su travesía ni su encuentro con la gente de la orilla oriental; luego realizó la umra y se presentó ante Uthman."
  fr: "Abou Oubayda: Ibn Amir conquit cette rive du fleuve. Lorsque sa renommée parvint en Transoxiane, on lui demanda la paix. Il traversa le fleuve jusqu'à un lieu précis, ou bien on vint à lui et on conclut une trêve. Des collecteurs lui apportèrent des bêtes, des wada'if, de la soie et des vêtements, et il fit l'ihram en remerciement à Dieu. Nul autre ne rapporte sa traversée ni sa trêve avec les habitants de la rive orientale. Il accomplit ensuite la umra et se présenta devant Uthman."
  ur: "ابو عبیدہ: ابن عامر نے دریا کے اس کنارے کو فتح کیا۔ جب اس کی شہرت Transoxania تک پہنچی تو انہوں نے صلح کے لیے مقدمہ کیا - وہ ایک جگہ عبور کر گیا، یا وہ اس کے پاس آئے اور صلح کی - اور جمع کرنے والے جانور، وداعیف، ریشم اور کپڑے لے آئے، جس پر اس نے خدا کے شکر میں احرام باندھا۔ مشرقی کنارے کے لوگوں کے ساتھ کوئی اور اس کے گزرنے یا اس کی سلح کی اطلاع نہیں دیتا ہے۔ پھر عمرہ کیا اور عثمان کے سامنے حاضر ہوئے۔"
  tr: "Ebu Ubeyde şöyle dedi: İbn Amir nehrin aşağısındaki bölgeyi fethetti ve nehrin ötesindeki bölgeye ulaştığında, onunla barışmasını istediler, o da barıştı. Rivayetlere göre, nehri geçip bir yere geldi ve orada ona gelip onunla barıştılar. Bunun üzerine birini göndererek bunları topladılar; böylece hayvanlar, cariyeler, ipek ve elbiseler ona geldi. Sonra Allah'a şükran olarak ihram haline girdi. Başka kimse onun nehri geçip doğu yakasındaki ve Umre'deki insanlarla barışmasından bahsetmedi ve Osman'ın yanına geldi."
  id: "Abu Ubaidah berkata: Ibnu Amir menaklukkan wilayah di bawah sungai, dan ketika ia sampai di wilayah seberang sungai, mereka memintanya untuk berdamai dengan mereka, lalu ia melakukannya. Dikatakan bahwa ia menyeberangi sungai hingga sampai di suatu tempat, dan dikatakan bahwa mereka datang kepadanya dan berdamai dengannya, lalu ia mengirim seseorang untuk mengumpulkan itu, sehingga hewan-hewan, para pelayan wanita, sutra, dan pakaian datang kepadanya. Kemudian ia memasuki keadaan ihram sebagai ungkapan syukur kepada Allah, dan tidak ada orang lain yang menyebutkan tentang penyeberangannya ke sungai dan perdamaiannya dengan penduduk sisi timur dan orang-orang Umrah, dan ia datang kepada Utsman."
