label: { ar: "غزوة علي بن أبي طالب اليمن (غزاها مرتين)", en: "Ali ibn Abi Talib's expeditions to Yemen (twice)" }
summary:
  ar: "يقول ابن إسحاق في جملة السرايا: وغزوة علي بن أبي طالب اليمن، غزاها مرتين؛ ويضيف ابن هشام عن أبي عمرو المدني أن النبي بعث علياً إلى اليمن وبعث خالد بن الوليد في جند آخر وقال: إن التقيتما فالأمير علي بن أبي طالب؛ ويلاحظ ابن هشام أن ابن إسحاق ذكر بعث خالد في حديثه ولم يذكره في عدة البعوث، فينبغي أن تكون العدة تسعة وثلاثين."
  en: "Ibn Ishaq says in his enumeration of detachments: and Ali ibn Abi Talib's expedition to Yemen, which he made twice; Ibn Hisham adds from Abu Amr al-Madani that the Prophet sent Ali to Yemen and Khalid ibn al-Walid with another force, saying: if you meet, Ali is the commander. Ibn Hisham notes that Ibn Ishaq mentioned Khalid's dispatch in his narrative but not in his count, so the number should be thirty-nine."
