id: event/anti-fatimid-manifesto-444
class: event
kind: declaration
label: { ar: "محاضر بغداد في القدح بنسب العبيديين", en: "The Baghdad attestations impugning the lineage of the Ubaydids", es: "Las declaraciones de Bagdad que ponen en duda el linaje de los Ubaydíes", fr: "Les attestations de Bagdad contestant la lignée des Oubaydides", ur: "بغداد کی سندیں عبیدیوں کے سلسلہ نسب کی تردید کرتی ہیں۔" }
summary:
  ar: "في سنة 444هـ كتبت محاضر في ديوان الخلافة ببغداد ذُكر فيها صاحب مصر ومن تقدّم من أسلافه بما يقدح في أنسابهم التي يدعونها، وجُحد اتصالهم برسول الله وبعلي وفاطمة وعزُّهم إلى الديصانية من المجوس والقداحية من اليهود وقيل أنهم خارجون عن الإسلام، وأخذت خطوط الأشراف والقضاة والشهود والعلماء بذلك — وكان قد جرى مثله أيام القادر {cite:muntazam-ibn-al-jawzi j.8 p.149-150}."
  en: "In 444 records were drawn up in the diwan of the caliphate at Baghdad, mentioning the lord of Egypt and his predecessors with statements that impugn the lineages they claimed. Their connection to the Messenger of God, to Ali and to Fatima was denied, and their descent was attributed to the Daysaniyya among the Magians and the Qaddahiyya among the Jews; it was also said that they had left Islam. The attestations of sharifs, judges, witnesses and scholars were taken to this effect, and something similar had happened in the days of al-Qadir {cite:muntazam-ibn-al-jawzi j.8 p.149-150}."
  es: "En el año 444 se redactaron registros en el diwan del califato en Bagdad, mencionando al señor de Egipto y a sus predecesores con declaraciones que ponían en duda los linajes que afirmaban. Se negó su conexión con el Mensajero de Dios, con Alí y con Fátima, y se atribuyó su descendencia a los Daysaniyya entre los magos y a los Qaddahiyya entre los judíos; también se dijo que habían abandonado el Islam. Se tomaron en cuenta los testimonios de sharifs, jueces, testigos y eruditos, y algo similar había ocurrido en tiempos de al-Qadir {cite:muntazam-ibn-al-jawzi, vol. 8, págs. 149-150}."
  fr: "En 444, des documents furent établis au diwan du califat de Bagdad, mentionnant le seigneur d'Égypte et ses prédécesseurs et contestant leurs lignées. Leur lien avec le Messager de Dieu, Ali et Fatima fut nié, et leur descendance fut attribuée aux Daysaniyya parmi les Mages et aux Qaddahiyya parmi les Juifs; il fut également affirmé qu'ils avaient renié l'islam. Les témoignages des chérifs, des juges, des témoins et des savants furent pris en compte, et un événement similaire s'était produit du temps d'al-Qadir (cf. Muntazam ibn al-Jawzi, vol. 8, p. 149-150)."
  ur: "بغداد میں خلافت کے دیوان میں 444 میں ریکارڈ تیار کیا گیا تھا، جس میں مصر کے آقا اور اس کے پیشروؤں کا ایسے بیانات کے ساتھ تذکرہ کیا گیا تھا جو ان کے دعویٰ کردہ نسبوں کی تردید کرتے تھے۔ ان کا رسول خدا، علی اور فاطمہ سے تعلق کا انکار کیا گیا، اور ان کے نزول کو مجوسیوں میں دیسانیہ اور یہودیوں میں قدحیہ سے منسوب کیا گیا۔ یہ بھی کہا گیا کہ انہوں نے اسلام چھوڑ دیا۔ اس سلسلے میں شریفوں، قاضیوں، گواہوں اور علماء کی شہادتیں لی گئیں اور کچھ ایسا ہی القادر کے زمانے میں بھی ہوا تھا۔"
