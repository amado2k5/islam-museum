label: { ar: "محاضر بغداد في القدح بنسب العبيديين", en: "The Baghdad attestations impugning the lineage of the Ubaydids" }
summary:
  ar: "في سنة 444هـ كتبت محاضر في ديوان الخلافة ببغداد ذُكر فيها صاحب مصر ومن تقدّم من أسلافه بما يقدح في أنسابهم التي يدعونها، وجُحد اتصالهم برسول الله وبعلي وفاطمة وعزُّهم إلى الديصانية من المجوس والقداحية من اليهود وقيل أنهم خارجون عن الإسلام، وأخذت خطوط الأشراف والقضاة والشهود والعلماء بذلك — وكان قد جرى مثله أيام القادر {cite:muntazam-ibn-al-jawzi j.8 p.149-150}."
  en: "In 444 records were drawn up in the diwan of the caliphate at Baghdad, mentioning the lord of Egypt and his predecessors with statements that impugn the lineages they claimed. Their connection to the Messenger of God, to Ali and to Fatima was denied, and their descent was attributed to the Daysaniyya among the Magians and the Qaddahiyya among the Jews; it was also said that they had left Islam. The attestations of sharifs, judges, witnesses and scholars were taken to this effect, and something similar had happened in the days of al-Qadir {cite:muntazam-ibn-al-jawzi j.8 p.149-150}."
