label: { ar: "فتح رودس وهدم حصنها", en: "The Conquest of Rhodes and the Demolition of Its Fort" }
summary:
  ar: "عند البلاذري: بعث معاوية بن أبي سفيان جنادة بن أبي أمية الأزدي إلى رودس ففتحها عنوة وكانت غيضة في البحر وأمره معاوية فأنزلها قوماً من المسلمين وكان ذلك في سنة ثلاث وخمسين؛ ورودس من أخصب الجزائر وهي نحو من ستين ميلاً فيها الزيتون والكروم والثمار والمياه العذبة. وعن الواقدي وغيره: أقام المسلمون برودس سبع سنين في حصن اتخذ لهم فلما مات معاوية كتب يزيد إلى جنادة يأمره بهدم الحصن والقفل وكان معاوية يعاقب بين الناس فيها وكان مجاهد بن جبر مقيماً بها يقرئ الناس القرآن."
  en: "In al-Baladhuri: Mu'awiya ibn Abi Sufyan sent Janada ibn Abi Umayya al-Azdi to Rhodes; he opened it by force — it being a thicket in the sea — and Mu'awiya ordered him to settle Muslim people in it, in year 53. Rhodes is among the most fertile islands, about sixty miles, with olives, vines, fruits and sweet waters. Via al-Waqidi and others: the Muslims stayed at Rhodes seven years in a fort taken for them; when Mu'awiya died Yazid wrote Janada ordering him to demolish the fort and return — Mu'awiya used to rotate the people there, and Mujahid ibn Jabr resided in it teaching the people Qur'an."
