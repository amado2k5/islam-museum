label: { ar: "فتح رودس وهدم حصنها", en: "The Conquest of Rhodes and the Demolition of Its Fort", es: "La conquista de Rodas y la demolición de su fuerte.", fr: "La conquête de Rhodes et la démolition de son fort" }
summary:
  ar: "عند البلاذري: بعث معاوية بن أبي سفيان جنادة بن أبي أمية الأزدي إلى رودس ففتحها عنوة وكانت غيضة في البحر وأمره معاوية فأنزلها قوماً من المسلمين وكان ذلك في سنة ثلاث وخمسين؛ ورودس من أخصب الجزائر وهي نحو من ستين ميلاً فيها الزيتون والكروم والثمار والمياه العذبة. وعن الواقدي وغيره: أقام المسلمون برودس سبع سنين في حصن اتخذ لهم فلما مات معاوية كتب يزيد إلى جنادة يأمره بهدم الحصن والقفل وكان معاوية يعاقب بين الناس فيها وكان مجاهد بن جبر مقيماً بها يقرئ الناس القرآن."
  en: "In al-Baladhuri: Mu'awiya ibn Abi Sufyan sent Janada ibn Abi Umayya al-Azdi to Rhodes; he opened it by force — it being a thicket in the sea — and Mu'awiya ordered him to settle Muslim people in it, in year 53. Rhodes is among the most fertile islands, about sixty miles, with olives, vines, fruits and sweet waters. Via al-Waqidi and others: the Muslims stayed at Rhodes seven years in a fort taken for them; when Mu'awiya died Yazid wrote Janada ordering him to demolish the fort and return — Mu'awiya used to rotate the people there, and Mujahid ibn Jabr resided in it teaching the people Qur'an."
  es: "En al-Baladhuri: Mu'awiya ibn Abi Sufyan envió a Janada ibn Abi Umayya al-Azdi a Rodas; este la abrió por la fuerza —siendo un matorral en el mar— y Mu'awiya le ordenó que asentara allí a los musulmanes, en el año 53. Rodas es una de las islas más fértiles, de unos sesenta kilómetros de extensión, con olivos, vides, frutas y aguas dulces. Según al-Waqidi y otros: los musulmanes permanecieron en Rodas siete años en una fortaleza tomada para ellos; cuando Mu'awiya murió, Yazid escribió a Janada ordenándole que demoliera la fortaleza y regresara. Mu'awiya solía rotar a la gente allí, y Mujahid ibn Jabr residió en ella enseñando el Corán a la gente."
  fr: "Selon al-Baladhuri: Mu'awiya ibn Abi Sufyan envoya Janada ibn Abi Umayya al-Azdi à Rhodes; ce dernier s'empara de l'île par la force – car il s'agissait d'un fourré en pleine mer – et Mu'awiya lui ordonna d'y installer des musulmans en l'an 53. Rhodes est l'une des îles les plus fertiles, d'une superficie d'environ 95 kilomètres, avec des oliviers, des vignes, des arbres fruitiers et une eau douce. D'après al-Waqidi et d'autres: les musulmans séjournèrent sept ans à Rhodes dans une forteresse qui leur avait été conquise; à la mort de Mu'awiya, Yazid écrivit à Janada pour lui ordonner de démolir la forteresse et de revenir – Mu'awiya y faisait tourner les habitants, et Mujahid ibn Jabr y résidait, enseignant le Coran."
