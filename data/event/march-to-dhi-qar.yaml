id: event/march-to-dhi-qar
class: event
kind: campaign
label: { ar: "استنفار علي من ذي قار", en: "Ali's muster at Dhi Qar" }
summary:
  ar: "بعد خروج طلحة والزبير وعائشة إلى البصرة، خرج علي من المدينة نحو الكوفة ومنها إلى ذي قار سنة 36هـ، فتثاقل أهل المدينة، وأرسل إلى الكوفة ابن عباس ثم عمار والحسن، وعزل أبا موسى الأشعري وولى قرظة بن كعب، فبلغ الجند في ذي قار نحو ستة إلى سبعة آلاف في البداية، ثم قارب اثني عشر ألفاً عند المعركة بحسب تقدير المؤلف، وكان القعقاع بن عمرو أبرز المحرضين {cite:sallabi-ali-vol2 p. 45}."
  en: "After Talha, Zubayr and Aisha left for Basra in 36 AH, Ali left Medina for Kufa and then camped at Dhi Qar; the Medinans were reluctant, he sent Ibn Abbas, then Ammar and Hasan, to Kufa, and al-Qa'qa' was the key speaker in mobilising the Kufans. The author gives the army as six to seven thousand at first and about twelve thousand by the battle."
