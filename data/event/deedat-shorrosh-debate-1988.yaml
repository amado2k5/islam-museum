summary:
  ar: "اللقاء الثاني بين ديدات وشوروش في [[place/birmingham|برمنغهام]] بإنجلترا سنة 1988 بعنوان «القرآن أم الإنجيل: أيهما كلمة الله؟»، وكانت مناظرة كتابين متقابلين لا عقيدة واحدة: ديدات يعرض حفظ القرآن وتواتر نقله ويعترض تاريخ نص الكتاب المقدس، وشوروش يدافع عن العهدين ويطعن في القرآن. وكثر تداول تفريغها وكراساتها في العالم كما جرى للمناظرة الأولى {cite:answering-islam-debates-index}."
  en: "The second Deedat–Shorrosh encounter, in [[place/birmingham|Birmingham]], England, in 1988, titled 'The Qur'an or the Bible: Which is God's Word?'. It was a debate of two books rather than one doctrine: Deedat presented the Qur'an's preservation and mass-transmitted recension and objected to the Bible's textual history; Shorrosh defended the Testaments and attacked the Qur'an. Its transcript and booklets circulated worldwide like the first debate {cite:answering-islam-debates-index}."
  es: "El segundo encuentro entre Deedat y Shorrosh tuvo lugar en Birmingham, Inglaterra, en 1988, bajo el título «El Corán o la Biblia: ¿Cuál es la Palabra de Dios?». Fue un debate sobre dos libros, no sobre una sola doctrina: Deedat defendió la preservación del Corán y su recensión transmitida masivamente, y objetó la historia textual de la Biblia; Shorrosh defendió los Testamentos y atacó el Corán. Su transcripción y folletos circularon por todo el mundo, al igual que el primer debate {cite:answering-islam-debates-index}."
  fr: "La seconde rencontre entre Deedat et Shorrosh, qui s'est tenue à Birmingham en 1988, en Angleterre, était intitulée « Le Coran ou la Bible: laquelle est la Parole de Dieu ? ». Il s'agissait d'un débat portant sur deux livres plutôt que sur une doctrine: Deedat défendait la préservation du Coran et sa recension largement diffusée, et contestait l'histoire textuelle de la Bible; Shorrosh, quant à lui, défendait les Testaments et s'attaquait au Coran. La transcription et les brochures de ce débat ont été diffusées dans le monde entier, à l'instar du premier."
