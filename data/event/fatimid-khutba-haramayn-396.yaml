label: { ar: "الخطبة للحاكم صاحب مصر بمكة والمدينة", en: "The khutba for al-Hakim, ruler of Egypt, in Mecca and Medina", es: "El sermón de Al-Hakim, gobernante de Egipto, en La Meca y Medina.", fr: "Le sermon d'al-Hakim, souverain d'Égypte, à La Mecque et à Médine" }
summary:
  ar: "في سنة ست وتسعين حج بالناس أحمد بن محمد بن عمر العلوي وخطب بمكة والمدينة للحاكم صاحب مصر على الرسم في ذلك، وأمر الناس في الحرمين بالقيام عند ذكره وفعل مثل ذلك بمصر وكان إذا ذكر قاموا وسجدوا في السوق ومواضع الاجتماع {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  en: "In 396 Ahmad ibn Muhammad ibn Umar al-Alawi led the pilgrimage and gave the khutba at Mecca and Medina for al-Hakim, ruler of Egypt, following the usual practice; he ordered the people of the two sanctuaries to stand whenever his name was mentioned, and did the same in Egypt, where, whenever he was mentioned, they stood and prostrated in the markets and gathering places {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  es: "En 396, Ahmad ibn Muhammad ibn Umar al-Alawi dirigió la peregrinación y pronunció el sermón en La Meca y Medina por al-Hakim, gobernante de Egipto, siguiendo la práctica habitual; ordenó a la gente de los dos santuarios que se pusiera de pie cada vez que se mencionara su nombre, e hizo lo mismo en Egipto, donde, cada vez que se le mencionaba, se ponían de pie y se postraban en los mercados y lugares de reunión {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  fr: "En 396, Ahmad ibn Muhammad ibn Umar al-Alawi dirigea le pèlerinage et prononça le sermon à La Mecque et à Médine pour al-Hakim, souverain d'Égypte, suivant la pratique habituelle; il ordonna aux habitants des deux sanctuaires de se lever chaque fois que son nom était mentionné, et fit de même en Égypte, où, chaque fois qu'il était mentionné, ils se levaient et se prosternaient sur les marchés et dans les lieux de rassemblement {cite: muntazam-ibn-al-jawzi j.7 p.231}."
