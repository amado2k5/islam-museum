summary:
  ar: "في سنة ست وتسعين حج بالناس أحمد بن محمد بن عمر العلوي وخطب بمكة والمدينة للحاكم صاحب مصر على الرسم في ذلك، وأمر الناس في الحرمين بالقيام عند ذكره وفعل مثل ذلك بمصر وكان إذا ذكر قاموا وسجدوا في السوق ومواضع الاجتماع {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  en: "In 396 Ahmad ibn Muhammad ibn Umar al-Alawi led the pilgrimage and gave the khutba at Mecca and Medina for al-Hakim, ruler of Egypt, following the usual practice; he ordered the people of the two sanctuaries to stand whenever his name was mentioned, and did the same in Egypt, where, whenever he was mentioned, they stood and prostrated in the markets and gathering places {cite:muntazam-ibn-al-jawzi j.7 p.231}."
