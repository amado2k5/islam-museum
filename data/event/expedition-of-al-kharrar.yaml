  es: "Una expedición liderada por Sa'd ibn Abi Waqqas con 20 Muhajirun en Dhu al-Qada 1 AH marchando a pie durante la noche hacia al-Kharrar, encontró que la caravana había pasado el día anterior."
  fr: "Une expédition menée par Sa'd ibn Abi Waqqas avec 20 Muhajirun en Dhu al-Qada 1 AH marchant à pied de nuit vers al-Kharrar; a constaté que la caravane était passée la veille."
  ur: "ذی القعدہ 1 ہجری میں سعد ابن ابی وقاص کی قیادت میں 20 مہاجرین کے ساتھ ایک مہم جو رات کو پیدل چل کر الخرار کی طرف چلی گئی۔ پتہ چلا کہ قافلہ پرسوں گزر گیا تھا۔"
