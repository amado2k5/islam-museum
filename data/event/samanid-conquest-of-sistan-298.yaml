label: { ar: "استيلاء السامانيين على سجستان" }
summary:
  ar: "في سنة 298هـ سار جيش الأمير أحمد بن إسماعيل الساماني إلى سجستان بقيادة الحسين بن علي المروروذي ومعه أحمد بن سهل ومحمد بن المظفر وسيمجور الدواتي، فحاصروا المعدل بن علي بن الليث آخر أمراء الصفاريين فصالحهم واستأمن لهم، وكان أحمد قد سار إلى أبي علي محمد بن علي بن الليث ببست فأخذه أسيراً، فاستولى السامانيون على سجستان واستعمل عليها أبا صالح منصور بن إسحاق، وحُمل المعدل وسبكري إلى بغداد مشهورين على فيلين {cite:kamil-ibn-al-athir p. 46-47}."
  en: "In 298 the Samanid army under al-Husayn ibn Ali al-Marwazi besieged al-Mu'addal ibn al-Layth, last Saffarid amir of Sistan, into surrender; the province passed to Abu Salih Mansur ibn Ishaq and the captives were paraded into Baghdad on elephants {cite:kamil-ibn-al-athir p. 46-47}."
