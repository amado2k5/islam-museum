id: event/samanid-conquest-of-sistan-298
class: event
kind: conquest
label: { ar: "استيلاء السامانيين على سجستان", en: "The Samanid seizure of Sistan", es: "La toma de Sistán por los Samánidas", fr: "La prise de Sistan par les Samanides", ur: "سیستان پر سامانی قبضہ", tr: "Samanilerin Sistan'ı fethi", id: "Penaklukan Sistan oleh Dinasti Samanid" }
summary:
  ar: "في سنة 298هـ سار جيش الأمير أحمد بن إسماعيل الساماني إلى سجستان بقيادة الحسين بن علي المروروذي ومعه أحمد بن سهل ومحمد بن المظفر وسيمجور الدواتي، فحاصروا المعدل بن علي بن الليث آخر أمراء الصفاريين فصالحهم واستأمن لهم، وكان أحمد قد سار إلى أبي علي محمد بن علي بن الليث ببست فأخذه أسيراً، فاستولى السامانيون على سجستان واستعمل عليها أبا صالح منصور بن إسحاق، وحُمل المعدل وسبكري إلى بغداد مشهورين على فيلين {cite:kamil-ibn-al-athir p. 46-47}."
  en: "In 298 the Samanid army under al-Husayn ibn Ali al-Marwazi besieged al-Mu'addal ibn al-Layth, last Saffarid amir of Sistan, into surrender; the province passed to Abu Salih Mansur ibn Ishaq and the captives were paraded into Baghdad on elephants {cite:kamil-ibn-al-athir p. 46-47}."
  es: "En 298, el ejército samaní, bajo el mando de al-Husayn ibn Ali al-Marwazi, sitió a al-Mu'addal ibn al-Layth, último emir safarí de Sistán, hasta obligarlo a rendirse; la provincia pasó a manos de Abu Salih Mansur ibn Ishaq y los cautivos fueron llevados a Bagdad en elefantes {cite:kamil-ibn-al-athir p. 46-47}."
  fr: "En 298, l'armée samanide sous al-Husayn ibn Ali al-Marwazi assiégea al-Mu'addal ibn al-Layth, dernier émir safaride du Sistan, jusqu'à sa reddition; la province passa aux mains d'Abu Salih Mansur ibn Ishaq et les captifs furent exhibés à Bagdad sur des éléphants {cite:kamil-ibn-al-athir p. 46-47}."
  ur: "298 میں الحسین ابن علی المروازی کے ماتحت سامانی فوج نے سیستان کے آخری صفری امیر المعدال بن لیث کا محاصرہ کر کے ہتھیار ڈال دیے۔ صوبہ ابو صالح منصور بن اسحاق کے پاس چلا گیا اور اسیروں کو ہاتھیوں پر سوار کر کے بغداد پہنچایا گیا۔ 46-47}۔"
  tr: "Hicri 298 yılında, Prens Ahmed ibn İsmail el-Samani'nin ordusu, Hüseyin ibn Ali el-Marvezi önderliğinde, Ahmed ibn Sahl, Muhammed ibn el-Muzaffar ve Simjur el-Dawati'nin eşliğinde Sijistan'a yürüdü. Saffari prenslerinin sonuncusu olan Mu'addal ibn Ali ibn el-Layth'ı kuşattılar; bunun üzerine Mu'addal onlarla barış yaptı ve onlara güvenli geçiş izni verdi. Ahmed, Bust'ta bulunan Ebu Ali Muhammed ibn Ali ibn el-Layth'ı ziyaret ederek onu esir aldı. Samaniler Sijistan'ı ele geçirdi ve Ebu Salih Mansur ibn İshak'ı vali olarak atadı. Mu'addal ve Sabkari, iki fil üzerinde büyük bir şöhretle Bağdat'a götürüldü. {kaynak: Kamil ibn el-Athir s. 46-47}"
  id: "Pada tahun 298 H, pasukan Pangeran Ahmad ibn Ismail al-Samani bergerak menuju Sijistan di bawah pimpinan al-Husayn ibn Ali al-Marwazi, didampingi oleh Ahmad ibn Sahl, Muhammad ibn al-Muzaffar, dan Simjur al-Dawati. Mereka mengepung al-Mu’addal ibn Ali ibn al-Layth, pangeran Saffarid terakhir, sehingga ia berdamai dengan mereka dan memberi mereka jalan aman. Ahmad kemudian bergerak menuju Abu Ali Muhammad ibn Ali ibn al-Layth di Bust dan menangkapnya. Dinasti Samanid merebut Sijistan dan mengangkat Abu Salih Mansur ibn Ishaq sebagai gubernurnya. Al-Mu’addal dan Sabkari dibawa ke Baghdad dalam keadaan bermartabat dengan dua gajah. {cite:kamil-ibn-al-athir hlm. 46-47}"
