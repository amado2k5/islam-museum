label: { ar: "استيلاء بدر الدين لؤلؤ على الموصل سنة 621", en: "Badr al-Din Lu'lu' seizes Mosul, 621", es: "Badr al-Din Lu'lu' toma Mosul, 621", fr: "Badr al-Din Lu'lu' s'empare de Mossoul, 621", ur: "بدر الدین لولو نے موصل پر قبضہ کر لیا، 621" }
summary:
  ar: "في سنة إحدى وعشرين وستمائة استولى بدر الدين لؤلؤ على الموصل وخنق ابن أستاذه محمود بن القاهر وزعم أنه مات {cite:shadharat-dhahab p. 95}، فانقرض بذلك الحكم الظاهري للبيت الزنكي بها وصار لؤلؤ يحكمها بنفسه في الواقع وإن بقي يحكم باسم الأتابكية شكلاً حتى تسلطن سنة إحدى وثلاثين."
  en: "In 621 Badr al-Din Lu'lu' seized Mosul and strangled Mahmud b. al-Qahir, son of his ustadh, claiming he had died a natural death {cite:shadharat-dhahab p. 95}; effective Zangid rule at Mosul ended, Lu'lu' ruling in fact under the Atabeg name until he took the sultanate openly in 631."
  es: "En 621, Badr al-Din Lu'lu' tomó Mosul y estranguló a Mahmud b. al-Qahir, hijo de su ustadh, alegando que había muerto de muerte natural {cite:shadharat-dhahab p. 95}; el gobierno efectivo de los Zangid en Mosul terminó, y Lu'lu' gobernó de hecho bajo el nombre de Atabeg hasta que tomó el sultanato abiertamente en 631."
  fr: "En 621, Badr al-Din Lu'lu' s'empara de Mossoul et étrangla Mahmud b. al-Qahir, fils de son ustadh, prétendant qu'il était mort de mort naturelle {cite:shadharat-dhahab p. 95}; le règne zangide effectif à Mossoul prit fin, Lu'lu' régnant en fait sous le nom d'Atabeg jusqu'à ce qu'il prenne ouvertement le sultanat en 631."
  ur: "621 میں بدر الدین لولو نے موصل پر قبضہ کیا اور محمود بن کا گلا گھونٹ دیا۔ اس کے استاذ کے بیٹے القاہر کا دعویٰ ہے کہ اس کی موت فطری موت ہوئی ہے۔ 95}; موصل پر زنگید کی مؤثر حکمرانی ختم ہو گئی، لولو کی حکومت دراصل اتابیگ کے نام سے اس وقت تک رہی جب تک کہ اس نے 631 میں سلطنت کو کھلے عام نہیں لے لیا۔"
