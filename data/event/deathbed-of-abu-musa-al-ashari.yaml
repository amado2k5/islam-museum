label: { ar: "احتضار أبي موسى الأشعري ووصيته في حفر قبره واختلاف موضع وفاته", en: "The deathbed of Abu Musa al-Ash'ari, his instruction about his grave, and the differing reports of where he died", ur: "ابو موسیٰ اشعری کی نزع، قبر کھودنے کی ہدایت اور جائے وفات میں اختلاف", es: "El lecho de muerte de Abu Musa al-Ash'ari, sus instrucciones sobre su tumba y los diferentes relatos sobre el lugar de su fallecimiento.", fr: "Le lit de mort d'Abu Musa al-Ash'ari, ses instructions concernant sa tombe et les récits divergents sur le lieu de son décès" }
summary:
  ar: "لما حضرت أبا موسى الأشعري الوفاة دعا فتيانه فأمرهم بحفر قبره وتوسيعه وتعميقه، وقال إنها إحدى منزلتين: إما أن يوسَّع عليه فيرى منزله في الجنة، وإما أن يضيق عليه فيرى الأغلال والسلاسل {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. وقال لبنيه، فيما يروي أبو بردة، أن يذكروا صاحب الرغيف، وساق قصة العابد الذي رجح رغيفه {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. ويختلف في وفاته: بمكة في قول، وبالثوية على ميلين من الكوفة في قول، وفي سنتها بين اثنتين وأربعين واثنتين وخمسين {cite:al-bidaya-wal-nihaya scan vol. 4 p. 425}."
  en: "When death came to Abu Musa al-Ash'ari he called his young men and told them to dig his grave wide and deep, saying it would be one of two places: either it would be widened and he would see his place in Paradise, or it would be narrowed and he would see chains and fetters {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. According to Abu Burda he told his sons to remember the man of the loaf, and told the story of the worshipper whose loaf outweighed his years {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. Where he died is disputed, Mecca in one account and al-Thawiyya, two miles from Kufa, in another, and the year ranges from 42 to 52 {cite:al-bidaya-wal-nihaya scan vol. 4 p. 425}."
  ur: "جب ابو موسیٰ اشعری کی وفات کا وقت آیا تو انھوں نے اپنے نوجوان خادموں کو بلا کر حکم دیا کہ ان کی قبر کھودو اور کشادہ اور گہری بناؤ، اور کہا کہ یہ دو منزلوں میں سے ایک ہوگی: یا تو قبر وسیع کی جائے گی اور وہ جنت میں اپنا ٹھکانا دیکھیں گے، یا تنگ کی جائے گی اور وہ بیڑیاں اور زنجیریں دیکھیں گے {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}۔ ابو بردہ کی روایت کے مطابق انھوں نے اپنے بیٹوں سے کہا کہ روٹی والے کو یاد رکھنا، اور اس عابد کا قصہ سنایا جس کی روٹی اس کے سالوں پر بھاری نکلی {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}۔ جائے وفات میں اختلاف ہے، ایک قول میں مکہ اور دوسرے میں کوفہ سے دو میل پر ثویہ، اور سال ۴۲ سے ۵۲ ہجری تک بتایا گیا ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 425}۔"
  es: "Cuando la muerte llegó a Abu Musa al-Ash'ari, llamó a sus jóvenes y les dijo que cavaran su tumba ancha y profunda, diciendo que sería uno de dos lugares: o se ensancharía y vería su lugar en el Paraíso, o se estrecharía y vería cadenas y grilletes {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. Según Abu Burda, les dijo a sus hijos que recordaran al hombre del pan y les contó la historia del adorador cuyo pan pesaba más que sus años {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. El lugar de su muerte es discutido, La Meca en una versión y al-Thawiyya, a dos millas de Kufa, en otra, y el año varía entre 42 y 52 {cite:al-bidaya-wal-nihaya scan vol. 4 p. 425}."
  fr: "À sa mort, Abou Moussa al-Ash'ari appela ses jeunes gens et leur ordonna de creuser une tombe large et profonde, expliquant qu'il y aurait deux issues possibles: soit sa tombe serait large et il verrait sa place au Paradis, soit elle serait étroite et il y verrait des chaînes et des fers {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. Selon Abou Burda, il demanda à ses fils de se souvenir de l'homme au pain et leur raconta l'histoire du dévot dont le pain pesait plus lourd que ses années {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 203}. Le lieu de sa mort est incertain: La Mecque selon une version, al-Thawiyya, à deux milles de Koufa selon une autre. L'année de sa mort varie entre 42 et 52 {cite:al-bidaya-wal-nihaya scan vol. 4 p. 203}. 425}."
