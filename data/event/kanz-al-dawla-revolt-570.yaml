label: { ar: "خلاف الكنز بالصعيد", en: "Kanz al-Dawla's revolt in Upper Egypt (570 AH)", es: "La revuelta de Kanz al-Dawla en el Alto Egipto (570 AH)", fr: "La révolte de Kanz al-Dawla en Haute-Égypte (570 AH)", ur: "بالائی مصر میں کنز الدولہ کی بغاوت ⁦(570ھ)⁩", tr: "Yukarı Mısır'da hazine anlaşmazlığı", id: "Sengketa harta karun di Mesir Hulu" }
summary:
  ar: "في أول سنة سبعين وخمسمائة خالف الكنز بصعيد مصر واجتمع إليه من رعية البلاد والسودان والعرب خلق كثير، فقتل أميراً من الصلاحية في أقطاعه وهو أخو الأمير أبي الهيجاء السمين؛ فسار أبو الهيجاء — وهو من أكبر الأمراء وأشجعهم — إلى قتاله وسيّر معه صلاح الدين جماعة من الأمراء وكثيراً من العسكر، فوصلوا مدينة طود فاحتمت عليهم فقاتلوا أهلها وظفروا بهم وقتلوا منهم كثيراً وذلوا بعد العز وقهروا، ثم سار العسكر بعد فراغه من طود إلى الكنز وهو في طغيانه يعمه فقاتلوه فقتل هو ومن معه من الأعراب وغيرهم، وأمنت بعده البلاد واطمأن أهلها {cite:kamil-ibn-al-athir p. 64-65}."
  en: "Early 570 (1174): Kanz rose in Upper Egypt, drawing crowds of locals, Sudanese and Arabs and killing a Salahiyya amir — brother of Abu al-Hayja 'the Fat'; Abu al-Hayja marched on him with a Saladin detachment, stormed Tud, then caught and killed Kanz and his Arabs, and the country was quiet after him {cite:kamil-ibn-al-athir p. 64-65}."
  es: "Principios del 570 (1174): Kanz se alzó en el Alto Egipto, atrayendo multitudes de lugareños, sudaneses y árabes, y mató a un emir salahía, hermano de Abu al-Hayja 'el Gordo'; Abu al-Hayja marchó contra él con un destacamento de Saladino, asaltó Tud, luego capturó y mató a Kanz y a sus árabes, y el país quedó en paz después de él {cita:kamil-ibn-al-athir págs. 64-65}."
  fr: "Début 570 (1174): Kanz se soulève en Haute-Égypte, attirant des foules de locaux, de Soudanais et d'Arabes et tuant un émir Salahiyya — frère d'Abu al-Hayja « le Gros »; Abu al-Hayja marche sur lui avec un détachement de Saladin, prend d'assaut Tud, puis capture et tue Kanz et ses Arabes, et le pays est calme après lui {cite: kamil-ibn-al-athir p. 64-65}."
  ur: "ابتدائی 570 (1174): بالائی مصر میں کنز کا عروج، مقامی لوگوں، سوڈانی اور عربوں کے ہجوم کو اپنی طرف متوجہ کیا اور ایک صالحیہ امیر کو قتل کر دیا - ابو الحیجہ 'دی فیٹ' کے بھائی؛ ابو الحیجہ نے صلاح الدین کے دستے کے ساتھ اس پر چڑھائی کی، تود پر حملہ کیا، پھر کنز اور اس کے عربوں کو پکڑ کر قتل کر دیا، اور اس کے بعد ملک میں خاموشی چھا گئی۔ 64-65}۔"
  tr: "Hicri 570 yılının ilk yılında, Yukarı Mısır'da El-Kanz isyan etti ve ülkenin, Sudan'ın ve Arapların büyük bir kısmı onun etrafında toplandı. El-Kanz, kendi tımarında, Emir Ebu el-Hayca el-Samin'in kardeşi olan Selahiya'dan bir emiri öldürdü. Emirlerin en büyük ve en cesurlarından biri olan Ebu el-Hayca, onunla savaşmaya gitti ve Selahaddin onunla birlikte bir grup emir ve büyük bir ordu gönderdi. Savunması kendilerine karşı olan Tod şehrine ulaştılar, halkıyla savaştılar ve onlara karşı zafer kazandılar, birçoğunu öldürdüler ve eski ihtişamlarından sonra aşağılandılar ve boyun eğdirildiler. Daha sonra ordu, Tod'u bitirdikten sonra, zulüm içinde olan El-Kanz'a gitti ve onun tarafından alt edildi. Onunla ve yanındaki Bedeviler ve diğerleriyle savaştılar ve onu öldürdüler. Bundan sonra ülke güvenli hale geldi ve halkı rahatladı. {alıntı: kamil-ibn-el-esir s. 64-65}."
  id: "Pada tahun pertama 570 H, Al-Kanz memberontak di Mesir Hulu, dan sejumlah besar orang dari negara itu, Sudan, dan Arab berkumpul di sekitarnya. Ia membunuh seorang emir dari Salahia di wilayah kekuasaannya, yang merupakan saudara dari Emir Abu Al-Haija Al-Samin. Abu Al-Haija—yang merupakan salah satu emir terbesar dan paling berani—pergi untuk melawannya, dan Saladin mengirimkan sekelompok emir dan pasukan besar bersamanya. Mereka mencapai kota Tod, yang dipertahankan dari serangan mereka, sehingga mereka memerangi penduduknya dan menang atas mereka, membunuh banyak dari mereka, dan mereka dipermalukan setelah kejayaan mereka dan ditaklukkan. Kemudian pasukan, setelah menyelesaikan Tod, pergi ke Al-Kanz, yang berada dalam kezalimannya dan dikalahkan olehnya, sehingga mereka memeranginya dan membunuhnya serta orang-orang Badui dan lainnya yang bersamanya, dan setelah itu negara itu aman dan rakyatnya merasa tenang. {cite:kamil-ibn-al-athir p. 64-65}."
