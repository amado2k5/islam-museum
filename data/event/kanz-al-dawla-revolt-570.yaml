label: { ar: "خلاف الكنز بالصعيد", en: "Kanz al-Dawla's revolt in Upper Egypt (570 AH)" }
summary:
  ar: "في أول سنة سبعين وخمسمائة خالف الكنز بصعيد مصر واجتمع إليه من رعية البلاد والسودان والعرب خلق كثير، فقتل أميراً من الصلاحية في أقطاعه وهو أخو الأمير أبي الهيجاء السمين؛ فسار أبو الهيجاء — وهو من أكبر الأمراء وأشجعهم — إلى قتاله وسيّر معه صلاح الدين جماعة من الأمراء وكثيراً من العسكر، فوصلوا مدينة طود فاحتمت عليهم فقاتلوا أهلها وظفروا بهم وقتلوا منهم كثيراً وذلوا بعد العز وقهروا، ثم سار العسكر بعد فراغه من طود إلى الكنز وهو في طغيانه يعمه فقاتلوه فقتل هو ومن معه من الأعراب وغيرهم، وأمنت بعده البلاد واطمأن أهلها {cite:kamil-ibn-al-athir p. 64-65}."
  en: "Early 570 (1174): Kanz rose in Upper Egypt, drawing crowds of locals, Sudanese and Arabs and killing a Salahiyya amir — brother of Abu al-Hayja 'the Fat'; Abu al-Hayja marched on him with a Saladin detachment, stormed Tud, then caught and killed Kanz and his Arabs, and the country was quiet after him {cite:kamil-ibn-al-athir p. 64-65}."
