id: event/al-hadi-pardons-the-group-at-khiwan-and-renews-their-pledges-286
class: event
kind: other
label:
  ar: عفو الهادي عن القوم بخيوان وتجديد بيعتهم، آخر شعبان 286هـ
  en: Al-Hadi pardons the group at Khiwan and their pledges are renewed, late Sha'ban 286 AH
  ur: خیوان میں ہادی کا قوم کو معاف کرنا اور بیعتوں کی تجدید، شعبان 286ھ کے آخر
summary:
  ar: يروي الكتاب أن القوم وصلوا إلى الهادي بأجمعهم يوم الجمعة وقد بقي من شعبان يومان، فاعتذروا وأقروا بخطئهم فصفح عنهم وجددوا بيعاتهم وانصرفوا، وأعاد الهادي الحسين بن الحسن العلوي إلى أثافت وصرف المجتمعين إلى أهاليهم.
  en: The book says the whole group reached al-Hadi on the Friday with two days of Sha'ban left, apologised and admitted their fault; he pardoned them, they renewed their pledges and went home, and he sent al-Husayn ibn al-Hasan al-Alawi back to Athafit and the men gathered to him back to their families.
  ur: کتاب کے مطابق جمعہ کے دن، جب شعبان کے دو دن باقی تھے، پوری قوم ہادی کے پاس پہنچی، معذرت کی اور اپنی خطا مانی؛ انہوں نے معاف کیا، بیعتیں تازہ ہوئیں اور لوگ لوٹ گئے، اور ہادی نے حسین بن حسن علوی کو اثافت واپس بھیجا اور جمع لوگوں کو ان کے گھروں کو۔
