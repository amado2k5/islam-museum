id: event/al-hadi-pardons-the-group-at-khiwan-and-renews-their-pledges-286
class: event
kind: other
label:
  ar: عفو الهادي عن القوم بخيوان وتجديد بيعتهم، آخر شعبان 286هـ
  en: Al-Hadi pardons the group at Khiwan and their pledges are renewed, late Sha'ban 286 AH
  ur: خیوان میں ہادی کا قوم کو معاف کرنا اور بیعتوں کی تجدید، شعبان 286ھ کے آخر
  es: "Al-Hadi perdona al grupo en Khiwan y renuevan sus promesas, a finales de Sha'ban del año 286 de la Hégira."
  fr: "Al-Hadi gracie le groupe à Khiwan et leurs engagements sont renouvelés, fin Sha'ban 286 AH"
  tr: "El-Hadi, Hicri 286 yılının Şaban ayının sonlarında Hayvan halkını affetti ve biatlarını yeniledi."
  id: "Al-Hadi mengampuni penduduk Khaywan dan memperbarui kesetiaan mereka, akhir bulan Sya'ban 286 Hijriah."
summary:
  ar: يروي الكتاب أن القوم وصلوا إلى الهادي بأجمعهم يوم الجمعة وقد بقي من شعبان يومان، فاعتذروا وأقروا بخطئهم فصفح عنهم وجددوا بيعاتهم وانصرفوا، وأعاد الهادي الحسين بن الحسن العلوي إلى أثافت وصرف المجتمعين إلى أهاليهم.
  en: The book says the whole group reached al-Hadi on the Friday with two days of Sha'ban left, apologised and admitted their fault; he pardoned them, they renewed their pledges and went home, and he sent al-Husayn ibn al-Hasan al-Alawi back to Athafit and the men gathered to him back to their families.
  ur: کتاب کے مطابق جمعہ کے دن، جب شعبان کے دو دن باقی تھے، پوری قوم ہادی کے پاس پہنچی، معذرت کی اور اپنی خطا مانی؛ انہوں نے معاف کیا، بیعتیں تازہ ہوئیں اور لوگ لوٹ گئے، اور ہادی نے حسین بن حسن علوی کو اثافت واپس بھیجا اور جمع لوگوں کو ان کے گھروں کو۔
  es: "El libro dice que todo el grupo llegó a Al-Hadi el viernes, cuando quedaban dos días de Sha'ban, se disculparon y admitieron su error; él los perdonó, renovaron sus promesas y regresaron a casa, y él envió a Al-Husayn ibn Al-Hasan Al-Alawi de vuelta con Athafit y los hombres que se reunieron con él volvieron con sus familias."
  fr: "Le livre raconte que tout le groupe arriva chez al-Hadi le vendredi, alors qu'il restait deux jours de Sha'ban, présenta ses excuses et reconnut sa faute; il leur accorda son pardon, ils renouvelèrent leurs engagements et rentrèrent chez eux, et il renvoya al-Husayn ibn al-Hasan al-Alawi à Athafit et les hommes se rassemblèrent auprès de lui pour retourner dans leurs familles."
  tr: "Kitapta, Şaban ayının bitiminden iki gün önce, Cuma günü, halkın tamamının Al-Hadi'nin evine geldiği anlatılıyor. Özür dileyip hatalarını kabul ettiler, bunun üzerine Al-Hadi onları affetti ve biat yeminlerini yenileyerek ayrıldılar. Al-Hadi, Al-Hussein bin Al-Hassan Al-Alawi'yi Athafit'e geri gönderdi ve toplanan halkı ailelerinin yanına geri gönderdi."
  id: "Kitab tersebut menceritakan bahwa orang-orang tiba di rumah Al-Hadi secara lengkap pada hari Jumat, dua hari sebelum berakhirnya bulan Sya'ban. Mereka meminta maaf dan mengakui kesalahan mereka, sehingga beliau memaafkan mereka, dan mereka memperbarui sumpah setia mereka lalu pergi. Al-Hadi mengembalikan Al-Hussein bin Al-Hassan Al-Alawi ke Athafit dan mengirim orang-orang yang berkumpul kembali ke keluarga mereka."
