label:
  ar: "سنون الاعتزال والتصنيف، ٧٤٣-٧٤٩هـ/١٣٤٢-١٣٤٩م"
  en: "The retirement years and the great works, 743-749/1342-1349"
  ur: "اعتزال اور تصانیف کے سال، 743-749ھ/1342-1349ء"
summary:
  ar: "أقام ابن فضل الله بدمشق معتزلاً من ٧٤٣هـ إلى وفاته، ويُرجَّح أن كتبه الكبرى كانت ثمرة فراغ تلك السنين: «مسالك الأبصار في ممالك الأمصار» في أكثر من عشرين مجلدًا، و«التعريف بالمصطلح الشريف» في نظام الديوان والمراسلات، وكتاب في تاريخ أسرته وفضائل آل عمر في أربع مجلدات، إلى جانب رسائل ونثر وشعر كثير {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "Al-Umari lived retired at Damascus from 743 until his death, and his great books were most likely the fruit of that leisure: the encyclopaedic Masalik al-Absar fi Mamalik al-Amsar in more than twenty volumes, al-Ta'rif bi'l-Mustalah al-Sharif on the chancery's order and correspondence, and a four-volume history of his family, the House of Umar — beside essays, ornate prose and much verse {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "عمری 743ھ سے اپنی وفات تک دمشق میں معتزل رہا، اور اس کی بزرگ کتابیں غالباً اسی فراغت کے ثمرے تھیں: بیس سے زائد جلدوں پر مشتمل دائرة المعارف «مسالک الابصار فی ممالک الامصار»، دیوان کے نظام اور مراسلات پر «التعریف بالمصطلح الشریف»، اور اپنے خاندان، آلِ عمر کی تاریخ پر چار جلدوں کی کتاب — اس کے علاوہ رسائل، مسجع نثر اور کثیر شاعری {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
