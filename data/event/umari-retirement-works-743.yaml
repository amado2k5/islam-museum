label:
  ar: "سنون الاعتزال والتصنيف، ٧٤٣-٧٤٩هـ/١٣٤٢-١٣٤٩م"
  en: "The retirement years and the great works, 743-749/1342-1349"
  ur: "اعتزال اور تصانیف کے سال، 743-749ھ/1342-1349ء"
  es: "Los años de jubilación y las grandes obras, 743-749/1342-1349"
  fr: "Les années de retraite et les grands ouvrages, 743-749/1342-1349"
  tr: "Tecrit ve sınıflandırma yılları, 743-749 Hicri / 1342-1349 Miladi"
  id: "Tahun-tahun pengasingan dan klasifikasi, 743-749 H / 1342-1349 M"
summary:
  ar: "أقام ابن فضل الله بدمشق معتزلاً من ٧٤٣هـ إلى وفاته، ويُرجَّح أن كتبه الكبرى كانت ثمرة فراغ تلك السنين: «مسالك الأبصار في ممالك الأمصار» في أكثر من عشرين مجلدًا، و«التعريف بالمصطلح الشريف» في نظام الديوان والمراسلات، وكتاب في تاريخ أسرته وفضائل آل عمر في أربع مجلدات، إلى جانب رسائل ونثر وشعر كثير {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "Al-Umari lived retired at Damascus from 743 until his death, and his great books were most likely the fruit of that leisure: the encyclopaedic Masalik al-Absar fi Mamalik al-Amsar in more than twenty volumes, al-Ta'rif bi'l-Mustalah al-Sharif on the chancery's order and correspondence, and a four-volume history of his family, the House of Umar — beside essays, ornate prose and much verse {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "عمری 743ھ سے اپنی وفات تک دمشق میں معتزل رہا، اور اس کی بزرگ کتابیں غالباً اسی فراغت کے ثمرے تھیں: بیس سے زائد جلدوں پر مشتمل دائرة المعارف «مسالک الابصار فی ممالک الامصار»، دیوان کے نظام اور مراسلات پر «التعریف بالمصطلح الشریف»، اور اپنے خاندان، آلِ عمر کی تاریخ پر چار جلدوں کی کتاب — اس کے علاوہ رسائل، مسجع نثر اور کثیر شاعری {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
  es: "Al-Umari vivió retirado en Damasco desde 743 hasta su muerte, y sus grandes libros fueron muy probablemente fruto de ese ocio: la enciclopédica Masalik al-Absar fi Mamalik al-Amsar en más de veinte volúmenes, al-Ta'rif bi'l-Mustalah al-Sharif sobre la orden y correspondencia de la cancillería, y una historia de su familia en cuatro volúmenes, la Casa de Umar, además de ensayos, prosa ornamentada y muchos versos {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  fr: "Al-Umari vécut retiré à Damas de 743 jusqu'à sa mort, et ses grands livres furent très probablement le fruit de ce loisir: l'encyclopédique Masalik al-Absar fi Mamalik al-Amsar en plus de vingt volumes, al-Ta'rif bi'l-Mustalah al-Sharif sur l'ordre et la correspondance de la chancellerie, et une histoire en quatre volumes de sa famille, la Maison d'Umar — outre des essais, une prose ornée et de nombreux vers {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  tr: "İbn Fadlallah, Hicri 743 yılından ölümüne kadar Şam'da inzivada yaşamıştır. Başlıca eserlerinin bu yıllardaki boş zamanının ürünü olduğu muhtemeldir: Yirmiden fazla ciltlik “Masalik al-Absar fi Mamalik al-Amsar”, Divan sistemi ve yazışmalar üzerine “Al-Ta’rif bil-Mustalah al-Sharif” ve ailesinin tarihi ile Ömer ailesinin faziletleri üzerine dört ciltlik bir kitap, ayrıca birçok mektup, düzyazı ve şiir. {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}"
  id: "Ibn Fadlallah hidup dalam pengasingan di Damaskus sejak tahun 743 H hingga wafatnya. Kemungkinan besar, buku-buku utamanya merupakan hasil dari waktu luangnya pada tahun-tahun tersebut: “Masalik al-Absar fi Mamalik al-Amsar” dalam lebih dari dua puluh jilid, “Al-Ta’rif bil-Mustalah al-Sharif” tentang sistem Diwan dan korespondensi, dan sebuah buku tentang sejarah keluarganya dan keutamaan keluarga Al Omar dalam empat jilid, di samping banyak surat, prosa, dan puisi {cite:durar-kamina-jil-1993 1/333} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
