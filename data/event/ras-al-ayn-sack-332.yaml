label: { ar: "دخول الروم رأس العين", en: "The Byzantine entry into Ra's al-'Ayn", es: "La entrada bizantina en Ra's al-'Ayn", fr: "L'entrée byzantine à Ra's al-'Ayn", ur: "راس العین میں بازنطینیوں کا داخلہ", tr: "Romalılar Ras al-Ayn'a girdiler.", id: "Bangsa Romawi memasuki Ras al-Ayn." }
summary:
  ar: "في ربيع الأول سنة اثنتين وثلاثين وثلاثمائة دخل الروم رأس العين وسبوا من أهلها ثلاثة آلاف إنسان ونهبوا البلاد، وكان الذي قصدها الدمستق في ثمانين ألفًا {cite:muntazam-ibn-al-jawzi p. 623}."
  en: "In Rabi' I 332 the Byzantines entered Ra's al-'Ayn, enslaved three thousand of its people and plundered the country — the Domesticos had come against it with eighty thousand {cite:muntazam-ibn-al-jawzi p. 623}."
  es: "En Rabi' I 332 los bizantinos entraron en Ra's al-'Ayn, esclavizaron a tres mil de sus habitantes y saquearon el país; los Domesticos habían venido contra él con ochenta mil {cite:muntazam-ibn-al-jawzi p. 623}."
  fr: "En Rabi' I 332, les Byzantins entrèrent à Ra's al-'Ayn, réduisirent en esclavage trois mille de ses habitants et pillèrent le pays — les Domesticos étaient venus contre lui avec quatre-vingt mille hommes {cite:muntazam-ibn-al-jawzi p. 623}."
  ur: "ربیع الثانی 332 میں بازنطینی راع العین میں داخل ہوئے، اس کے تین ہزار لوگوں کو غلام بنایا اور ملک کو لوٹ لیا۔ 623}۔"
  tr: "332 yılının baharında Romalılar Ras al-Ayn'a girdiler ve halkından 3000 kişiyi esir alıp ülkeyi yağmaladılar. Oraya giden Domestikos, 80.000 adamıyla birlikteydi. {cite:muntazam-ibn-al-jawzi s. 623}"
  id: "Pada musim semi tahun tiga ratus tiga puluh dua, bangsa Romawi memasuki Ras al-Ayn dan menangkap tiga ribu orang dari penduduknya serta menjarah negeri itu. Yang datang ke sana adalah Domestikos dengan delapan puluh ribu orang. {cite:muntazam-ibn-al-jawzi p. 623}."
