id: event/shaytan-made-qareen
kind: other
label:
  ar: من يعش عن ذكر الرحمن يُقيَّض له شيطانٌ قريناً
  en: Whoever turns from remembrance is assigned a shaytan as qareen
  ur: جو ذکرِ رحمان سے کنارہ کرے اس کے لیے شیطان قرین بنایا جاتا ہے
  es: "Quien se aparta del recuerdo es asignado a un shaytan como qareen."
  fr: "Quiconque se détourne du souvenir se voit attribuer un shaytan comme qareen"
  tr: "Rahman olan Allah'ı anmaktan yüz çeviren kimseye şeytan yoldaş olarak atanır."
  id: "Barang siapa berpaling dari mengingat Yang Maha Penyayang, maka setan akan dijadikan teman baginya."
summary:
  ar: 'قال تعالى: وَمَن يَعْشُ عَن ذِكْرِ الرَّحْمَٰنِ نُقَيِّضْ لَهُ شَيْطَانًا فَهُوَ لَهُ قَرِينٌ ۝ وَمَن يَكُنِ الشَّيْطَانُ لَهُ قَرِينًا فَسَاءَ قَرِينًا {cite:tanzil-quran} [[passage/quran-43-36|الزخرف 36]] [[passage/quran-43-38|الزخرف 38]] [[passage/quran-4-38|النساء 38]].'
  en: 'God says: and whoever turns away from the remembrance of the Merciful, We assign for him a shaytan who is his companion; and whoever has the shaytan as companion, evil is the companion {cite:tanzil-quran} [[passage/quran-43-36|Zukhruf 36]] [[passage/quran-43-38|Zukhruf 38]] [[passage/quran-4-38|Women 38]].'
  ur: 'اللہ فرماتا ہے: اور جو ذکرِ رحمان سے کنارہ کرے ہم اس کے لیے ایک شیطان تفویض کرتے ہیں جو اس کا قرین ہو؛ اور جو اس کا قرین شیطان ہو تو برا قرین ہے {cite:tanzil-quran} [[passage/quran-43-36|زخرف 36]] [[passage/quran-43-38|زخرف 38]] [[passage/quran-4-38|نساء 38]]۔'
  es: "Dios dice: y quien se aparta del recuerdo del Misericordioso, le asignamos un demonio que es su compañero; y quien tiene al demonio como compañero, mal es su compañero {cite:tanzil-quran} [[passage/quran-43-36|Zukhruf 36]] [[passage/quran-43-38|Zukhruf 38]] [[passage/quran-4-38|Women 38]]."
  fr: "Dieu dit: « Et quiconque se détourne du souvenir du Miséricordieux, Nous lui assignons un shaytan qui est son compagnon; et quiconque a le shaytan pour compagnon, quel mauvais compagnon ! » {cite:tanzil-quran} [[passage/quran-43-36|Zukhruf 36]] [[passage/quran-43-38|Zukhruf 38]] [[passage/quran-4-38|Women 38]]."
  tr: "Yüce Allah şöyle buyurmuştur: “Rahman'ı anmaktan yüz çeviren kimseye şeytanı nasip ederiz. Şeytan onun yoldaşı olur. İşte ona ne kötü bir yoldaştır!” (Kuran 43:36) (Kuran 43:38) (Kuran 43:38) (Kuran 43:38) (Kuran 44:38)"
  id: "Allah Yang Mahakuasa berfirman: “Dan barangsiapa berpaling dari mengingat Allah Yang Maha Penyayang, Kami akan memberikan kepadanya setan dan setan itu akan menjadi temannya. Dan barangsiapa menjadikan setan sebagai teman, sungguh buruk teman yang dia miliki!” (Quran 43:36) (Quran 43:38) (Quran 43:38) (Quran 43:38) (Quran 44:38)"
