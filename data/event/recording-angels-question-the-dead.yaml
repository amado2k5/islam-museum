id: event/recording-angels-question-the-dead
class: event
kind: other
label:
  ar: "سؤال الملكين للميت في القبر"
  en: "The two angels' questioning of the dead in the grave"
  ur: "قبر میں فرشتوں کا مردہ سے سوال"
  es: "El interrogatorio de los dos ángeles a los muertos en la tumba."
  fr: "Les deux anges interrogeant les morts dans la tombe"
  tr: "Mezardaki iki meleğin ölen kişiyi sorgulaması"
  id: "Pertanyaan yang diajukan kepada orang yang telah meninggal oleh dua malaikat di dalam kubur."
summary:
  ar: "يذكر أبو داود أن الميت يسمع خفق نعال الملكين إذا ولّيا مدبرين، فيقال له «يا هذا من ربك وما دينك ومن نبيك»، فيرد الجواب فيفرش له من الجنة أو يحد له من النار {cite:sunan-abi-dawud} [[passage/abudawud-4753|أبو داود 4753]]. وهو من أوضح نصوص السنة على مباشرة الملائكة لحال humans في القبر {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  en: "Abu Dawud relates that the dead person hears the stamping of the two angels' sandals as they turn away, and is asked 'this one — who is your Lord, what is your religion, who is your prophet'; the answer is given and he is furnished from Paradise or narrowed for him from the Fire {cite:sunan-abi-dawud} [[passage/abudawud-4753|Abu Dawud 4753]]. It is among the Sunnah's clearest texts on angels directly addressing human beings in the grave {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  ur: "ابو داود میں آیا ہے کہ مردہ شخص فرشتوں کے جوتوں کی دھمک سنتا ہے جب وہ لوٹتے ہیں، تو ان سے کہا جاتا ہے «اے یہ شخص، تمہارے رب کون، تمہارا دین کیا اور تمہارے نبی کون»؛ جواب دیا جاتا ہے تو اسے جنت کا بچھونا دیا جاتا ہے یا اس کے لیے دوزخ تنگ کی جاتی ہے {cite:sunan-abi-dawud} [[passage/abudawud-4753|ابو داود 4753]]۔ یہ قبر میں فرشتوں کے انسانوں سے براہ راست خطاب کی صریح ترین روایات میں سے ہے {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}۔"
  es: "Abu Dawud relata que el difunto oye el golpeteo de las sandalias de los dos ángeles al alejarse, y se le pregunta: «Este, ¿quién es tu Señor, cuál es tu religión, quién es tu profeta?». Se le da la respuesta y se le provee del Paraíso o se le reduce el fuego {cite:sunan-abi-dawud} [[passage/abudawud-4753|Abu Dawud 4753]]. Es uno de los textos más claros de la Sunnah sobre ángeles que se dirigen directamente a los seres humanos en la tumba {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  fr: "Abou Dawoud rapporte que le défunt entend le bruit des sandales des deux anges qui s'éloignent, et qu'on lui demande: « C'est moi ! Qui est ton Seigneur ? Quelle est ta religion ? Qui est ton prophète ? » La réponse est donnée et il est admis au Paradis ou préservé de l'Enfer {cite:sunan-abi-dawoud} [[passage/abudawoud-4753|Abou Dawoud 4753]]. C'est l'un des passages les plus clairs de la Sunna concernant les anges s'adressant directement aux êtres humains dans la tombe {cite:sunan-abi-dawoud} {cite:jami-al-tirmidhi}."
  tr: "Ebu Davud, ölen kişinin iki meleğin ayak seslerini duyduğunu ve onlara, “Ey sen! Rabbin kimdir? Din nedir? Peygamberin kimdir?” denildiğini aktarır. O da cevabını verir ve ardından cennette ona bir yatak hazırlanır veya cehennemin bir bölümü ona tahsis edilir. Bu, meleklerin kabirdeki insanların durumuyla doğrudan temasına dair Sünnetin en açık ayetlerinden biridir."
  id: "Abu Dawud menyebutkan bahwa orang yang meninggal mendengar langkah kaki dua malaikat ketika mereka berbalik, dan dikatakan kepadanya, “Wahai engkau, siapakah Tuhanmu, apakah agamamu, dan siapakah Nabimu?” Ia memberikan jawabannya, lalu sebuah tempat tidur dibentangkan untuknya di Surga atau sebagian dari Neraka disiapkan untuknya. Ini adalah salah satu teks Sunnah yang paling jelas mengenai kontak langsung para malaikat dengan keadaan manusia di dalam kubur."
