id: event/recording-angels-question-the-dead
class: event
kind: other
label:
  ar: "سؤال الملكين للميت في القبر"
  en: "The two angels' questioning of the dead in the grave"
  ur: "قبر میں فرشتوں کا مردہ سے سوال"
summary:
  ar: "يذكر أبو داود أن الميت يسمع خفق نعال الملكين إذا ولّيا مدبرين، فيقال له «يا هذا من ربك وما دينك ومن نبيك»، فيرد الجواب فيفرش له من الجنة أو يحد له من النار {cite:sunan-abi-dawud} [[passage/abudawud-4753|أبو داود 4753]]. وهو من أوضح نصوص السنة على مباشرة الملائكة لحال humans في القبر {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  en: "Abu Dawud relates that the dead person hears the stamping of the two angels' sandals as they turn away, and is asked 'this one — who is your Lord, what is your religion, who is your prophet'; the answer is given and he is furnished from Paradise or narrowed for him from the Fire {cite:sunan-abi-dawud} [[passage/abudawud-4753|Abu Dawud 4753]]. It is among the Sunnah's clearest texts on angels directly addressing human beings in the grave {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  ur: "ابو داود میں آیا ہے کہ مردہ شخص فرشتوں کے جوتوں کی دھمک سنتا ہے جب وہ لوٹتے ہیں، تو ان سے کہا جاتا ہے «اے یہ شخص، تمہارے رب کون، تمہارا دین کیا اور تمہارے نبی کون»؛ جواب دیا جاتا ہے تو اسے جنت کا بچھونا دیا جاتا ہے یا اس کے لیے دوزخ تنگ کی جاتی ہے {cite:sunan-abi-dawud} [[passage/abudawud-4753|ابو داود 4753]]۔ یہ قبر میں فرشتوں کے انسانوں سے براہ راست خطاب کی صریح ترین روایات میں سے ہے {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}۔"
