label: { ar: "اجتياح التتار بغداد وقتل المستعصم", en: "The Tatar sack of Baghdad and the killing of al-Musta'sim" }
summary:
  ar: "دخل التتار بقيادة هولاكو بغداد سنة 656هـ، وقُتل الخليفة المستعصم وانقطعت خلافة بغداد نحو ثلاث سنين ونصف {cite:tarikh-khulafa-minhaj-1434 p. 715-721}. وتذكر دائرة المعارف الإسلامية أن الخليفة استسلم استسلاماً غير مشروط في 4 صفر 656هـ الموافق 10 فبراير 1258م، وأُعمل السيف في أهل المدينة أكثر من أسبوع، وأن تقديرات القتلى تتراوح بين 800 ألف ومليونين، ويرى كاتب المقالة أن العدد ربما جاوز مئة ألف {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}. وبقيت بغداد بعد ذلك تحت الإيلخانيين حتى 740هـ/1339م وصارت مدينة إقليمية."
  en: "In 656 AH the Tatars under Hulagu entered Baghdad, the caliph al-Musta'sim was killed, and the caliphate of Baghdad lapsed for about three and a half years {cite:tarikh-khulafa-minhaj-1434 p. 715-721}. The Encyclopaedia of Islam says the caliph surrendered unconditionally on 4 Safar 656, or 10 February 1258, that the people were put to the sword for over a week, and that estimates of the dead range from 800,000 to two million, the author judging that the toll probably exceeded a hundred thousand {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}. Baghdad then stayed under the Ilkhans until 740/1339 as a provincial city."
  ur: "656ھ میں ہلاکو کی قیادت میں تاتری بغداد میں داخل ہوئے، خلیفہ مستعصم قتل ہوا اور بغداد کی خلافت تقریباً ساڑھے تین سال معطل رہی {cite:tarikh-khulafa-minhaj-1434 p. 715-721}۔ دائرۃ المعارف اسلامیہ کے مطابق خلیفہ نے 4 صفر 656ھ، یعنی 10 فروری 1258ء کو غیر مشروط ہتھیار ڈالے، شہر کے لوگ ایک ہفتے سے زیادہ تلوار کی نذر رہے، اور مقتولین کے اندازے آٹھ لاکھ سے بیس لاکھ کے درمیان ہیں، جبکہ مضمون نگار کے خیال میں تعداد غالباً ایک لاکھ سے زیادہ تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}۔ اس کے بعد بغداد 740ھ/1339ء تک ایلخانیوں کے ماتحت ایک صوبائی شہر رہا۔"
