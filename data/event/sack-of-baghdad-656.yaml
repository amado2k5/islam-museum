id: event/sack-of-baghdad-656
class: event
kind: battle
label: { ar: "اجتياح التتار بغداد وقتل المستعصم" }
summary:
  ar: "لما دخلت سنة ست وخمسين وصل التتار إلى بغداد وهم مئتا ألف ومقدمهم هولاكو فخرج إليهم عسكر الخليفة فهزم العسكر ودخلوا بغداد يوم عاشوراء فأشار الوزير على المستعصم بمصانعتهم وقال أخرج إليهم أنا في تقرير الصلح فخرج وتوثق بنفسه منهم ورد إلى الخليفة وقال إن الملك قد رغب في أن يزوج ابنته بابنك الأمير أبي بكر ويبقيك في منصب الخلافة كما أبقى صاحب الروم في سلطنته ولا يؤثر إلا أن تكون الطاعة له فخرج إليه الخليفة في جمع من الأعيان فأنزل في خيمة ثم دخل الوزير فاستدعى الفقهاء والأماثل ليحضروا العقد فخرجوا من بغداد فضربت أعناقهم وقتل الخليفة رفساً وقال الذهبي وما أظنه دفن وقتل معه جماعة من أولاده وأعمامه وأسر بعضهم وكانت بلية لم يصب الإسلام بمثلها وكان آخر خطبة خطبت ببغداد قال الخطيب في أولها الحمد لله الذي هدم بالموت مشيد الأعمار وحكم بالفناء على أهل هذه الدار هذا والسيف قائم بها، ولم يتم للوزير ما أراد وذاق من التتار الذل والهوان ولم تطل أيامه بعد ذلك ودخلت سنة سبع وخمسين والدنيا بلا خليفة وفي سنة تسع وخمسين أقيمت بمصر الخلافة فكان مدة انقطاع الخلافة ثلاث سنين ونصف {cite:tarikh-khulafa-minhaj-1434 p. 715-721}.، وعند ابن خلدون زحف هلاكو ملك التتر سنة 652هـ إلى العراق وقد فتح الري وأصبهان وهمدان وتتبع قلاع الإسماعيلية ثم قصد قلعة الموت سنة 655هـ فبلغه كتاب ابن العلقمي يستحثه لقصد بغداد ويهون عليه أمرها، وبرز لقائهم أيبك الدوادار فانكشف التتر أولاً ثم تذامروا فانهزم المسلمون واعترضهم دون بغداد ووحل مياه من انتفشت من دجلة فقتل الدوادار، ثم نزل هلاكو بغداد وخرج إليه الوزير مؤيد الدين بن العلقمي فاستأمن لنفسه ورجع بالأمان إلى المستعصم فخرج المستعصم ومعه أهل بيته ورجال مملكته وخزائنهم جميعاً فقتلوا وألقيت خزائنهم في دجلة {cite:tarikh-ibn-khaldun-ibar p. 900-901}"
  en: "In 656 the Tatars, two hundred thousand under Hulagu, reached Baghdad; the caliph's host broke, they entered on Ashura. The vizier counselled peace, won their trust, and told al-Musta'sim the king wished to wed his daughter to the prince Abu Bakr and keep him caliph as Rome's lord stayed sultan. The caliph went out with notables; the fuqaha' and gentry were summoned 'for the contract' — their necks struck — and the caliph was killed by trampling; al-Dhahabi doubts he was buried. The last khutba opened: 'Praise God who levels raised lives with death and decrees perishing on this house's folk — this, while the sword is drawn'. The vizier gained nothing but humiliation and died soon after; the world stayed caliphless three and a half years {cite:tarikh-khulafa-minhaj-1434 p. 715-721}."
