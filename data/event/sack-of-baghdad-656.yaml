id: event/sack-of-baghdad-656
class: event
kind: battle
label: { ar: "اجتياح التتار بغداد وقتل المستعصم", en: "The Tatar sack of Baghdad and the killing of al-Musta'sim", es: "El saqueo de Bagdad por los tártaros y el asesinato de al-Musta'sim.", fr: "Le sac de Bagdad par les Tatars et le meurtre d'al-Musta'sim", ur: "بغداد کی تاتاری بوری اور المستسم کا قتل" }
summary:
  ar: "دخل التتار بقيادة هولاكو بغداد سنة 656هـ، وقُتل الخليفة المستعصم وانقطعت خلافة بغداد نحو ثلاث سنين ونصف {cite:tarikh-khulafa-minhaj-1434 p. 715-721}. وتذكر دائرة المعارف الإسلامية أن الخليفة استسلم استسلاماً غير مشروط في 4 صفر 656هـ الموافق 10 فبراير 1258م، وأُعمل السيف في أهل المدينة أكثر من أسبوع، وأن تقديرات القتلى تتراوح بين 800 ألف ومليونين، ويرى كاتب المقالة أن العدد ربما جاوز مئة ألف {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}. وبقيت بغداد بعد ذلك تحت الإيلخانيين حتى 740هـ/1339م وصارت مدينة إقليمية."
  en: "In 656 AH the Tatars under Hulagu entered Baghdad, the caliph al-Musta'sim was killed, and the caliphate of Baghdad lapsed for about three and a half years {cite:tarikh-khulafa-minhaj-1434 p. 715-721}. The Encyclopaedia of Islam says the caliph surrendered unconditionally on 4 Safar 656, or 10 February 1258, that the people were put to the sword for over a week, and that estimates of the dead range from 800,000 to two million, the author judging that the toll probably exceeded a hundred thousand {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}. Baghdad then stayed under the Ilkhans until 740/1339 as a provincial city."
  ur: "656ھ میں ہلاکو کی قیادت میں تاتری بغداد میں داخل ہوئے، خلیفہ مستعصم قتل ہوا اور بغداد کی خلافت تقریباً ساڑھے تین سال معطل رہی {cite:tarikh-khulafa-minhaj-1434 p. 715-721}۔ دائرۃ المعارف اسلامیہ کے مطابق خلیفہ نے 4 صفر 656ھ، یعنی 10 فروری 1258ء کو غیر مشروط ہتھیار ڈالے، شہر کے لوگ ایک ہفتے سے زیادہ تلوار کی نذر رہے، اور مقتولین کے اندازے آٹھ لاکھ سے بیس لاکھ کے درمیان ہیں، جبکہ مضمون نگار کے خیال میں تعداد غالباً ایک لاکھ سے زیادہ تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 961}۔ اس کے بعد بغداد 740ھ/1339ء تک ایلخانیوں کے ماتحت ایک صوبائی شہر رہا۔"
  es: "En el año 656 de la Hégira, los tártaros, bajo el mando de Hulagu, entraron en Bagdad. El califa al-Musta'sim fue asesinado y el califato de Bagdad quedó en suspenso durante aproximadamente tres años y medio {cite:tarikh-khulafa-minhaj-1434 págs. 715-721}. La Enciclopedia del Islam afirma que el califa se rindió incondicionalmente el 4 de Safar del año 656, o el 10 de febrero de 1258, que el pueblo fue masacrado durante más de una semana y que las estimaciones de muertos oscilan entre 800.000 y dos millones, si bien el autor considera que la cifra probablemente superó los cien mil {cite:encyclopaedia-of-islam-2 vol. 1 pág. 961}. Bagdad permaneció entonces bajo el dominio de los Ilkhanes hasta el año 740/1339 como ciudad provincial."
  fr: "En 656 de l'Hégire, les Tatars, menés par Hulagu, entrèrent dans Bagdad. Le calife al-Musta'sim fut tué et le califat de Bagdad s'éteignit pendant environ trois ans et demi (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 715-721). L'Encyclopédie de l'Islam indique que le calife capitula sans condition le 4 Safar 656 (soit le 10 février 1258), que la population fut massacrée pendant plus d'une semaine et que le nombre de morts est estimé entre 800 000 et deux millions, l'auteur évaluant le bilan à plus de cent mille morts (voir: Encyclopédie de l'Islam, vol. 2, p. 961). Bagdad demeura ensuite sous domination ilkhanide jusqu'en 740 (1339) en tant que ville provinciale."
