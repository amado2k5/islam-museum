label: { ar: "احتلال فرنسا الجزائر" }
summary:
  ar: "بينما كانت جيوش محمد علي تمكن النصارى في بلاد الشام، اغتصبت جيوش فرنسا الجزائر عام ١٨٣٠م بعد ما ضعفت الخلافة العثمانية؛ دخلت القوات الفرنسية بما يعادل ثمانية وعشرين ألف مقاتل وأسطولاً يضم مائة سفينة، وكانت الدول الأوروبية مؤيدة لهذا الاغتصاب إذ حان - بزعمهم - توزيع تركة الرجل المريض وحل المسألة الشرقية بالطريقة الأوروبية. ويسائل الصلابي موقف محمد علي باشا الذي سكت عن احتلال الجزائر رغم قربه وقدرته، ويعتبره شاهداً على ارتباط مشروعه بالتسويات الأوروبية {cite:dawlat-uthmaniyya-salabi p. 369}."
  en: "France seized Algiers in 1830 with some 28,000 troops and a hundred-ship fleet while the caliphate was weakened — European powers endorsing it as the first share-out of the 'sick man's' estate {cite:dawlat-uthmaniyya-salabi p. 369}."
