label: { ar: "احتلال فرنسا الجزائر", en: "The French Occupation of Algiers", es: "La ocupación francesa de Argel", fr: "L'occupation française d'Alger", ur: "الجزائر پر فرانسیسی قبضہ" }
summary:
  ar: "بينما كانت جيوش محمد علي تمكن النصارى في بلاد الشام، اغتصبت جيوش فرنسا الجزائر عام ١٨٣٠م بعد ما ضعفت الخلافة العثمانية؛ دخلت القوات الفرنسية بما يعادل ثمانية وعشرين ألف مقاتل وأسطولاً يضم مائة سفينة، وكانت الدول الأوروبية مؤيدة لهذا الاغتصاب إذ حان - بزعمهم - توزيع تركة الرجل المريض وحل المسألة الشرقية بالطريقة الأوروبية. ويسائل الصلابي موقف محمد علي باشا الذي سكت عن احتلال الجزائر رغم قربه وقدرته، ويعتبره شاهداً على ارتباط مشروعه بالتسويات الأوروبية {cite:dawlat-uthmaniyya-salabi p. 369}."
  en: "France seized Algiers in 1830 with some 28,000 troops and a hundred-ship fleet while the caliphate was weakened — European powers endorsing it as the first share-out of the 'sick man's' estate {cite:dawlat-uthmaniyya-salabi p. 369}."
  es: "Francia tomó Argel en 1830 con unos 28.000 soldados y una flota de cien barcos mientras el califato estaba debilitado; las potencias europeas lo respaldaron como el primer reparto de la herencia del \"enfermo\" {cite:dawlat-uthmaniyya-salabi p. 369}."
  fr: "La France s'empara d'Alger en 1830 avec quelque 28 000 soldats et une flotte de cent navires alors que le califat était affaibli — les puissances européennes l'approuvant comme le premier partage de l'héritage du « malade » {cite:dawlat-uthmaniyya-salabi p. 369}."
  ur: "فرانس نے 1830 میں تقریباً 28,000 فوجیوں اور ایک سو بحری بیڑے کے ساتھ الجزائر پر قبضہ کر لیا جب کہ خلافت کمزور ہو گئی تھی - یورپی طاقتوں نے اسے 'بیمار آدمی' کی جاگیر کے پہلے حصہ کے طور پر توثیق کیا {حوالہ: دولت عثمانیہ صلابی 369}۔"
