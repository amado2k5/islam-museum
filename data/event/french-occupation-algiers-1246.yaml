label: { ar: "احتلال فرنسا الجزائر", en: "The French Occupation of Algiers", es: "La ocupación francesa de Argel", fr: "L'occupation française d'Alger", ur: "الجزائر پر فرانسیسی قبضہ", tr: "Fransa'nın Cezayir'i işgali", id: "Pendudukan Aljazair oleh Prancis" }
summary:
  ar: "بينما كانت جيوش محمد علي تمكن النصارى في بلاد الشام، اغتصبت جيوش فرنسا الجزائر عام ١٨٣٠م بعد ما ضعفت الخلافة العثمانية؛ دخلت القوات الفرنسية بما يعادل ثمانية وعشرين ألف مقاتل وأسطولاً يضم مائة سفينة، وكانت الدول الأوروبية مؤيدة لهذا الاغتصاب إذ حان - بزعمهم - توزيع تركة الرجل المريض وحل المسألة الشرقية بالطريقة الأوروبية. ويسائل الصلابي موقف محمد علي باشا الذي سكت عن احتلال الجزائر رغم قربه وقدرته، ويعتبره شاهداً على ارتباط مشروعه بالتسويات الأوروبية {cite:dawlat-uthmaniyya-salabi p. 369}."
  en: "France seized Algiers in 1830 with some 28,000 troops and a hundred-ship fleet while the caliphate was weakened — European powers endorsing it as the first share-out of the 'sick man's' estate {cite:dawlat-uthmaniyya-salabi p. 369}."
  es: "Francia tomó Argel en 1830 con unos 28.000 soldados y una flota de cien barcos mientras el califato estaba debilitado; las potencias europeas lo respaldaron como el primer reparto de la herencia del \"enfermo\" {cite:dawlat-uthmaniyya-salabi p. 369}."
  fr: "La France s'empara d'Alger en 1830 avec quelque 28 000 soldats et une flotte de cent navires alors que le califat était affaibli — les puissances européennes l'approuvant comme le premier partage de l'héritage du « malade » {cite:dawlat-uthmaniyya-salabi p. 369}."
  ur: "فرانس نے 1830 میں تقریباً 28,000 فوجیوں اور ایک سو بحری بیڑے کے ساتھ الجزائر پر قبضہ کر لیا جب کہ خلافت کمزور ہو گئی تھی - یورپی طاقتوں نے اسے 'بیمار آدمی' کی جاگیر کے پہلے حصہ کے طور پر توثیق کیا {حوالہ: دولت عثمانیہ صلابی 369}۔"
  tr: "Muhammed Ali'nin orduları Levant'ta Hristiyan kontrolünü pekiştirirken, Osmanlı Halifeliği zayıfladıktan sonra 1830'da Fransız kuvvetleri Cezayir'i işgal etti. Fransız ordusu yaklaşık 28.000 askerden oluşuyordu ve 100 gemilik bir filoyu içeriyordu. Avrupa güçleri, \"Avrupa'nın hasta adamı\"nın ganimetlerini paylaşmanın ve Doğu Sorununu Avrupa usulü çözmenin zamanı geldiğine inanarak bu işgali destekledi. El-Sallabi, Muhammed Ali Paşa'nın Cezayir işgali konusundaki sessizliğini, yakınlığına ve müdahale etme yeteneğine rağmen sorguluyor ve bunu projesinin Avrupa gündemleriyle bağlantılı olduğunun kanıtı olarak değerlendiriyor. {cite:dawlat-uthmaniyya-salabi s. 369}"
  id: "Sementara pasukan Muhammad Ali memperkuat kendali Kristen di Levant, pasukan Prancis menginvasi Aljazair pada tahun 1830 setelah Kekhalifahan Ottoman melemah. Tentara Prancis berjumlah sekitar 28.000 tentara dan termasuk armada 100 kapal. Kekuatan Eropa mendukung invasi ini, percaya bahwa sudah waktunya untuk membagi rampasan dari \"orang sakit Eropa\" dan menyelesaikan Masalah Timur dengan cara Eropa. Al-Sallabi mempertanyakan kebungkaman Muhammad Ali Pasha mengenai pendudukan Aljazair, meskipun ia dekat dan memiliki kemampuan untuk campur tangan, dan menganggapnya sebagai bukti keterkaitan proyeknya dengan agenda Eropa. {cite:dawlat-uthmaniyya-salabi p. 369}"
