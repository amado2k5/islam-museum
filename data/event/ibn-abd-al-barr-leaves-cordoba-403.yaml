id: event/ibn-abd-al-barr-leaves-cordoba-403
class: event
kind: migration
label:
  ar: "ابن عبد البر يجلو عن قرطبة بعد دخول البرابرة، نحو ٤٠٣هـ"
  en: "Ibn 'Abd al-Barr quits Cordoba after the Berber storming, about 403/1013"
  ur: "ابن عبد البر بربروں کے حملے کے بعد قرطبہ چھوڑ دیتے ہیں، تقریباً 403ھ/1013ء"
  es: "Ibn 'Abd al-Barr abandona Córdoba tras el asalto bereber, alrededor del año 403/1013."
  fr: "Ibn 'Abd al-Barr quitte Cordoue après l'assaut berbère, vers 403/1013."
  tr: "İbn Abdülbarr, Hicri 403 civarında Berberi istilasından sonra Kurtuba'dan kaçtı."
  id: "Ibn Abd al-Barr melarikan diri dari Cordoba setelah invasi Berber, sekitar tahun 403 H."
summary:
  ar: "جلا أبو عمر ابن عبد البر عن وطنه ومنشئه قرطبة بعدما دخلها البرابرة عنوة سنة ٤٠٣هـ {cite:nafh-tib-maqqari p. 464-465}، فكان في الغرب مدة ثم تحول إلى شرق الأندلس فسكن دانية وبلنسية وشاطبة وبها توفي {cite:tarikh-islam-dhahabi p. 141}."
  en: "Abu 'Amr Ibn 'Abd al-Barr left his birthplace Cordoba after the Berbers stormed it in 403 {cite:nafh-tib-maqqari p. 464-465}; he stayed in the west of al-Andalus for a while, then moved to its east and lived at Dania, Balansiya and Shatiba, where he died {cite:tarikh-islam-dhahabi p. 141}."
  ur: "ابو عمر ابن عبد البر اپنے وطن اور جائے پیدائش قرطبہ سے اس وقت نکلے جب بربروں نے 403ھ میں شہر پر قبضہ کیا {cite:nafh-tib-maqqari p. 464-465}؛ وہ کچھ عرصہ مغربی اندلس میں رہے پھر مشرقی اندلس منتقل ہو کر دانیہ، بلنسیہ اور شاطبہ میں رہے اور وہیں فوت ہوئے {cite:tarikh-islam-dhahabi p. 141}۔"
  es: "Abu 'Amr Ibn 'Abd al-Barr abandonó su lugar de nacimiento, Córdoba, después de que los bereberes la asaltaran en el año 403 {cite:nafh-tib-maqqari p. 464-465}; permaneció un tiempo en el oeste de al-Ándalus, luego se trasladó al este y vivió en Dania, Balansiya y Shatiba, donde murió {cite:tarikh-islam-dhahabi p. 141}."
  fr: "Abu 'Amr Ibn 'Abd al-Barr quitta sa ville natale de Cordoue après que les Berbères l'eurent prise d'assaut en 403 {cite:nafh-tib-maqqari p. 464-465}; il resta quelque temps dans l'ouest d'al-Andalus, puis se déplaça vers l'est et vécut à Dania, Balansiya et Shatiba, où il mourut {cite:tarikh-islam-dhahabi p. 141}."
  tr: "Ebu Ömer İbn Abdülberr, Hicri 403 yılında Berberilerin zorla ele geçirdiği memleketi ve doğum yeri Kurtuba'yı terk etti {kaynak: nafh-tib-makqkari s. 464-465}. Bir süre batıda kaldı, sonra Endülüs'ün doğusuna taşındı ve Denia, Valencia ve Xativa'da yaşadı ve orada vefat etti {kaynak: tarikh-islam-dhahabi s. 141}."
  id: "Abu Omar Ibn Abd al-Barr meninggalkan tanah kelahirannya, Cordoba, setelah bangsa Berber secara paksa memasuki wilayah itu pada tahun 403 Hijriah {cite:nafh-tib-maqqari hlm. 464-465}. Ia tinggal di wilayah barat untuk sementara waktu, kemudian pindah ke wilayah timur Andalusia, di mana ia tinggal di Denia, Valencia, dan Xativa, dan meninggal di sana {cite:tarikh-islam-dhahabi hlm. 141}."
