id: "event/al-hadi-walks-the-streets-repairs-walls-lights-dark-lanes-and-orders-women-to-veil-after-295"
class: event
kind: other
label:
  ar: "الهادي يتفقد الطرقات، فيأمر بإصلاح الجدران وإنارة الأزقة وستر النساء، بعد 295هـ، ص386"
  en: "Al-Hadi walks the streets, orders walls repaired, dark lanes lit and women veiled, after 295 AH, p. 386"
  ur: "ہادی گلیوں کا دورہ کرتا، دیواریں مرمت کرواتا، اندھیری گلیوں میں روشنی کرواتا اور عورتوں کو پردے کا حکم دیتا ہے، 295ھ کے بعد، ص386"
  es: "Al-Hadi recorre las calles, ordena reparar los muros, iluminar los callejones oscuros y velar a las mujeres, después del año 295 de la Hégira, pág. 386."
  fr: "Al-Hadi parcourt les rues, ordonne la réparation des murs, l'éclairage des ruelles sombres et le voile des femmes, après 295 AH, p. 386"
  tr: "Al-Hadi, Hicri 295 yılından sonra yolları denetler, duvarların onarılmasını, sokakların aydınlatılmasını ve kadınların örtünmesini emreder (s. 386)."
  id: "Al-Hadi memeriksa jalan-jalan, memerintahkan perbaikan tembok, penerangan lorong-lorong, dan penutup aurat bagi perempuan, setelah tahun 295 H, hlm. 386."
summary:
  ar: "يتفقد الهادي الأسواق والسكك، فيأمر بإصلاح الجدار المائل وتنقية الطريق وإنارة الزقاق المظلم، ويأمر النساء بالحجاب، ويذكر أنه أحدث البراقع للنساء باليمن."
  en: "Al-Hadi walks the markets and lanes, orders a leaning wall repaired, a road cleared and a dark alley lit at night, orders women to veil, and is said to have introduced the face-veil for women in Yemen."
  ur: "ہادی بازاروں اور گلیوں کا دورہ کرتا، جھکی ہوئی دیوار کی مرمت، راستہ صاف کرنے اور اندھیری گلی میں رات کو روشنی کا حکم دیتا، عورتوں کو پردے کا حکم دیتا، اور کہا جاتا ہے کہ اس نے یمن میں عورتوں کے لیے نقاب رائج کیا۔"
  es: "Al-Hadi recorre los mercados y callejones, ordena reparar un muro inclinado, despejar una carretera e iluminar un callejón oscuro por la noche, ordena a las mujeres que se cubran con el velo y se dice que introdujo el velo facial para las mujeres en Yemen."
  fr: "Al-Hadi parcourt les marchés et les ruelles, ordonne la réparation d'un mur penché, le déblaiement d'une route et l'éclairage nocturne d'une ruelle sombre, ordonne aux femmes de se voiler et aurait introduit le voile intégral pour les femmes au Yémen."
  tr: "El-Hadi, çarşıları ve yolları denetleyerek eğik duvarın onarılmasını, yolun temizlenmesini ve karanlık sokakların aydınlatılmasını emretti. Kadınların başörtüsü takmasını emretti ve Yemen'de kadınlar için burka uygulamasını kendisinin başlattığını belirtti."
  id: "Al-Hadi memeriksa pasar dan jalan-jalan, memerintahkan perbaikan tembok yang miring, pembersihan jalan, dan penerangan lorong yang gelap. Dia memerintahkan para wanita untuk mengenakan hijab, dan menyebutkan bahwa dialah yang memperkenalkan burqa untuk wanita di Yaman."
