id: event/thaalibi-tatimmat-al-yatima-1029
class: event
kind: other
label:
  ar: "الثعالبي يصنّف «تتمة اليتيمة» في أواخر عمره، نحو ٤٢٠هـ"
  en: "Al-Tha'alibi composes the Tatimmat al-Yatima late in life, c. 420/1029"
  ur: "ثعالبی کی آخری عمر میں «تتمۃ الیتیمہ» کی تصنیف، تقریباً 420ھ/1029ء"
summary:
  ar: "صنّف الثعالبي في أواخر عمره بنيسابور «تتمة اليتيمة» ذيلاً على «يتيمة الدهر في محاسن أهل العصر»، على نهجها في الترتيب الجغرافي، وجمع فيها أدباء برزوا في زمن رجولته، وحفل بتراجم تلامذته وأولهم الباخرزي صاحب «دمية القصر» {cite:encyclopaedia-of-islam-2 vol. 10 p. 451}."
  en: "Late in life at Nishapur al-Tha'alibi composed the Tatimmat al-Yatima, a supplement to his Yatimat al-Dahr following the same geographical arrangement, gathering the writers who had risen to prominence in his own adult lifetime, and giving generous publicity to his students — foremost al-Bakharzi, author of the Dumyat al-Qasr {cite:encyclopaedia-of-islam-2 vol. 10 p. 451}."
  ur: "آخری عمر میں نیشاپور میں ثعالبی نے «یتیمۃ الدہر» کا ذیل «تتمۃ الیتیمہ» لکھا، اسی جغرافیائی ترتیب پر، جس میں اپنے ہی زمانے کے ابھرے ادیب جمع کیے، اور اپنے شاگردوں کو خاطر خواہ مقام دیا — سب سے پہلے «دمیۃ القصر» کے مصنف باخرزی کو {cite:encyclopaedia-of-islam-2 vol. 10 p. 451}۔"
