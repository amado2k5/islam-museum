id: event/the-sons-of-yafur-plunder-arthal-and-the-reinforcement-of-ibn-khalaf-leaves-291
class: event
kind: other
label:
  ar: نهب ابني يعفر لأرثل وعودة مدد ابن خلف إلى صنعاء بلا نفقة، صفر 291هـ
  en: The sons of Ya'fur plunder Arthal and Ibn Khalaf's reinforcement goes back to Sana'a unpaid, Safar 291 AH
  ur: یعفر کے بیٹوں کا ارثل کو لوٹنا اور ابن خلف کی کمک کا بغیر تنخواہ صنعاء لوٹنا، صفر 291ھ
summary:
  ar: يوم السبت ينهب جند ابني يعفر ما في أرثل، ويرسل ابن خلف مدداً من صنعاء فيقف مع أهل القلعة إلى نصف النهار بلا قتال، ثم يطلب المدد النفقة فلا يعطيهم ابن خلف شيئاً فيرجعون إلى صنعاء.
  en: On the Saturday the troops of the two sons of Ya'fur plunder what is in Arthal; Ibn Khalaf sends a reinforcement from Sana'a that stands with the people of the fort until midday with no fighting, then it asks Ibn Khalaf for pay, he gives it nothing and it goes back to Sana'a.
  ur: ہفتے کے دن یعفر کے بیٹوں کے سپاہی ارثل کا مال لوٹتے ہیں؛ ابن خلف صنعاء سے کمک بھیجتا ہے جو قلعے والوں کے ساتھ دوپہر تک بغیر لڑائی کھڑی رہتی ہے، پھر کمک ابن خلف سے خرچ مانگتی ہے، وہ کچھ نہیں دیتا اور وہ صنعاء لوٹ جاتی ہے۔
