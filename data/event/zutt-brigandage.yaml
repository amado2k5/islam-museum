label: { ar: "قطع الزط ومحاربة عجيف لهم", en: "The Zutt Brigandage and Ujayf's War", es: "El bandolerismo de Zutt y la guerra de Ujayf", fr: "Le brigandage Zutt et la guerre d'Ujayf", ur: "زٹ بریگینڈیج اور عجیف کی جنگ", tr: "Zott'ların yolunu kesin ve düşmanlarıyla savaşın.", id: "Singkirkan Zott dan lawan musuh-musuh mereka." }
summary:
  ar: "أتي الحجاج بخلق من زط السند وأصناف ممن بها من الأمم معهم أهلوهم وأولادهم وجواميسهم فأسكنهم بأسافل كسكر فغلبوا على البطيحة وتناسلوا بها ثم ضم إليهم قوم من أباق العبيد وموالي باهلة وخولة محمد بن سليمان بن علي فشجعوهم على قطع الطريق ومبارزة السلطان بالمعصية وكان الناس في بعض أيام المأمون قد تحاموا الاجتياز بهم وانقطع عن بغداد جميع ما كان يحمل إليها من البصرة في السفن فلما استخلف المعتصم تجرد لهم وولى محاربتهم عجيف بن عنبسة من أهل خراسان وضم إليه من القواد والجند خلقاً ولم يمنعه شيئاً طلبه من الأموال فرتب بين البطائح ومدينة السلام خيلاً مضمرة مهلوبة الأذيال وكانت أخبار الزط تأتيه بمدينة السلام في ساعات من النهار أو أول الليل وأمر عجيفاً فسد عنهم الماء بالمؤن العظام حتى أخذوا فلم ينج منهم أحد وقدم بهم إلى مدينة السلام في الزواريق فجعل بعضهم بخانقين وفرق سائرهم في عين زربة والثغور."
  en: "Al-Hajjaj settled a mass of Sind's Zutt — families, children and buffaloes — in Kaskar's lowlands; they overran the batiha and bred, joined by runaway slaves and the Bahila and Khawla mawlas of Muhammad ibn Sulayman ibn Ali, who egged them to highway robbery and open defiance. In al-Ma'mun's days travellers avoided them and Baghdad lost all Basra shipping; al-Mu'tasim devoted himself to them, charging the Khurasani Ujayf ibn Anbasa with open funds — he staged lean tailed horses between the bata'ih and Baghdad so word reached him within hours — and Ujayf dammed the water against them with great works till not one escaped, barged them to Baghdad and scattered them: some at Khaniqin, the rest to Ayn Zarba and the frontier."
  es: "Al-Hajjaj asentó a una gran cantidad de Zutt de Sind —familias, niños y búfalos— en las tierras bajas de Kaskar; invadieron la batiha y se reprodujeron, a los que se unieron esclavos fugitivos y los mawlas Bahila y Khawla de Muhammad ibn Sulayman ibn Ali, quienes los incitaron al robo en los caminos y a la abierta rebeldía. En tiempos de al-Ma'mun, los viajeros los evitaban y Bagdad perdió todo el tráfico marítimo de Basora; al-Mu'tasim se dedicó a ellos, encargando al jorasán Ujayf ibn Anbasa fondos públicos —estableció caballos de cola flaca entre la batiha y Bagdad para que la noticia le llegara en cuestión de horas— y Ujayf represó el agua contra ellos con grandes obras hasta que no escapó ni uno solo, los transportó en barcazas a Bagdad y los dispersó: algunos en Khaniqin, el resto en Ayn Zarba y la frontera."
  fr: "Al-Hajjaj installa une foule de Zutt du Sind — familles, enfants et buffles — dans les plaines de Kaskar. Ils envahirent les batiha et s'y reproduisirent, rejoints par des esclaves fugitifs et les mawlas Bahila et Khawla de Muhammad ibn Sulayman ibn Ali, qui les incitèrent au brigandage et à la rébellion. À l'époque d'al-Ma'mun, les voyageurs les évitaient et Bagdad perdit tout son commerce avec Bassora. Al-Mu'tasim se consacra à eux, chargeant le Khorasani Ujayf ibn Anbasa de fonds. Il fit intervenir des chevaux maigres entre les bata'ih et Bagdad afin d'être informé en quelques heures. Ujayf construisit d'importants barrages pour les contenir, jusqu'à ce qu'aucun ne puisse s'échapper. Il les transporta par barge jusqu'à Bagdad et les dispersa: certains à Khaniqin, les autres à Ayn Zarba et à la frontière."
  ur: "الحجاج نے کاسکر کے نشیبی علاقوں میں سندھ کے زٹوں - خاندانوں، بچوں اور بھینسوں کو آباد کیا۔ انہوں نے بیتہا اور نسل پر قبضہ کر لیا، بھاگے ہوئے غلاموں اور محمد بن سلیمان ابن علی کے بہلہ اور خولہ مولا کے ساتھ شامل ہوئے، جنہوں نے انہیں شاہراہ پر ڈکیتی اور کھلے عام خلاف ورزی کرنے پر اکسایا۔ المامون کے دنوں میں مسافروں نے ان سے گریز کیا اور بغداد بصرہ کی تمام شپنگ سے محروم ہو گیا۔ المعتصم نے خراسانی عجف ابن عنباسہ کو کھلے فنڈز سے چارج کرتے ہوئے اپنے آپ کو ان کے لیے وقف کر دیا - اس نے بطعیہ اور بغداد کے درمیان دبلی پتلی دُم والے گھوڑے دوڑائے اور چند گھنٹوں میں یہ بات اس تک پہنچ گئی - اور عجیف نے بڑے کاموں کے ساتھ ان پر پانی بند کر دیا یہاں تک کہ کوئی بچ نہ سکا، انہیں بغداد اور زائد خان میں آرام کرنے کے لیے لے گیا: سرحد"
  tr: "Haccac, Sindh'den bir grup Zutt ve diğer milletlerden çeşitli insanları, aileleri, çocukları ve mandalarıyla birlikte getirdi. Onları Kaskar'ın aşağı kesimlerine yerleştirdi ve bataklıkları fethedip orada çoğaldılar. Sonra onlara, Bahila ve Khawla Muhammed bin Süleyman bin Ali'nin kaçak kölelerinden ve azat edilmiş kölelerinden oluşan bir grup ekledi. Onları yolu kesmeye ve Sultan'a itaatsizlik ederek meydan okumaya teşvik ettiler. El-Ma'mun döneminde bazı insanlar onlarla birlikte geçmekten kaçındılar ve Basra'dan Bağdat'a gemilerle getirilen her şey kesildi. El-Mu'tasim halife olunca, onlara karşı harekete geçti ve Horasan halkından Ajif bin Anbasa'yı onlarla savaşması için görevlendirdi. Ona bir grup komutan ve asker ekledi ve para konusunda istediği hiçbir şeyi esirgemedi. Bataklıklar ile Medine-i Selam (Barış Şehri) arasına uzun kuyruklu atlar yerleştirdi. Zutt'un haberleri, günün belirli saatlerinde veya gecenin başlangıcında Medine-i Salam'daki kendisine ulaşıyordu. Ajif'e, yakalanana kadar su kaynaklarını büyük miktarda erzakla kesmesini emretti ve hiçbiri kaçamadı. Onları teknelerle Medine-i Salam'a getirdi ve bir kısmını Hanıkin'e yerleştirdi, geri kalanını ise Ayn Zarba ve sınır bölgelerine dağıttı."
  id: "Hajjaj membawa sekelompok orang Zutt dari Sindh dan berbagai orang dari bangsa lain, beserta keluarga, anak-anak, dan kerbau mereka. Ia menempatkan mereka di daerah hilir Kaskar, dan mereka menaklukkan rawa-rawa serta berkembang biak di sana. Kemudian ia menambahkan sekelompok budak pelarian dan budak yang telah dibebaskan dari Bahila dan Khawla Muhammad bin Sulayman bin Ali. Mereka mendorong mereka untuk memblokir jalan dan menentang Sultan dengan pembangkangan. Selama beberapa hari pemerintahan Al-Ma'mun, orang-orang menghindari melewati daerah tersebut bersama mereka, dan semua barang yang dibawa ke Baghdad dari Basra melalui kapal terputus. Ketika Al-Mu'tasim menjadi Khalifah, ia berangkat melawan mereka dan menunjuk Ajif bin Anbasa dari penduduk Khorasan untuk memerangi mereka. Ia menambahkan sekelompok komandan dan tentara kepadanya dan tidak menahan apa pun yang dimintanya dalam hal uang. Ia mengatur agar kuda-kuda berekor panjang ditempatkan di antara rawa-rawa dan Madinat al-Salam (Kota Perdamaian). Kabar tentang Zutt akan sampai kepadanya di Madinat al-Salam pada waktu-waktu tertentu di siang hari atau awal malam. Dia memerintahkan Ajif untuk memblokir pasokan air kepada mereka dengan persediaan makanan yang banyak sampai mereka ditangkap, dan tidak seorang pun dari mereka berhasil melarikan diri. Dia membawa mereka ke Madinat al-Salam dengan perahu, dan dia menempatkan sebagian dari mereka di Khaniqin dan menyebar sisanya di Ain Zarba dan wilayah perbatasan."
