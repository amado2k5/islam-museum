id: event/muqtadir-deposition-restoration-317
class: event
kind: mutiny
label: { ar: "خلع المقتدر لمؤنس ورد الجند إياه" }
summary:
  ar: "في سنة سبع عشرة خرج مؤنس الخادم الملقب بالمظفر على المقتدر لكونه بلغه أنه يريد أن يولي إمرة الأمراء هارون بن غريب مكانه وركب معه سائر الجيش وجاؤوا إلى دار الخلافة وأخرج المقتدر ليلة أربع عشر المحرم ونهب لأمه ست مئة ألف دينار وأشهد على نفسه بالخلع وأحضر محمد بن المعتضد فبايعه مؤنس والأمراء ولقبوه القاهر بالله وفوضت الوزارة إلى ابن مقلة، وجلس القاهر يوم الأحد وعمل الموكب يوم الاثنين فجاء العسكر يطلبون رزق البيعة ورزق سنة فقتلوا الحاجب ومالوا إلى دار مؤنس يطلبون المقتدر ليردوه فحملوه على أعناقهم إلى قصر الخلافة وأخذ القاهر فجيء به وهو يبكي يقول الله الله في نفسي فقبَّله المقتدر وقال أنت والله لا ذنب لك فطب نفساً {cite:tarikh-khulafa-minhaj-1434 p. 591-592}.، وعند ابن الأثير كان منه أن أخرجوا المقتدر ووالدته وخالته وخواص جواريه وأولاده من دار الخلافة وحملوا إلى دار مؤنس فاعتُقلوا بها، وأحضروا القاضي أبا عمرو ليشهد عليه بالخلع وقام إليه ابن حمدان وقال يا سيدي يعز علي أن أراك على هذه الحال وقد كنت أخاها مليكك ودمعت عيناه وعينا المقتدر، وأودعوا كتاب الخلع عند القاضي أبي عمرو فكتمه ولم يُطلع عليه أحداً فلما عاد المقتدر سلمه إليه وأعلمه أنه لم يطلع عليه غيره فاستحسن ذلك وولّاه القضاء، ومضى بني بن نفيس إلى تربة لوالده المقتدر فأخرج من قبر فيها ستمائة ألف دينار، ولما تولى نازوك حجابة الخليفة أمر الرجالة المصافية بقلع خيامهم من دار الخليفة فعظم ذلك عليهم فكانوا سبب رد المقتدر، وجاءت الرجالة يوم الاثنين سابع عشر المحرم يطلبون حق البيعة ورزق سنة فارتفعت زعقاتهم ومالوا إلى دار مؤنس يطلبون المقتدر {cite:kamil-ibn-al-athir p. 148-150}، وعند ابن الجوزي ولقب القاهر بالله وقلد أبا علي بن مقلة وزارته وخلع المقتدر من الخلافة يوم السبت النصف من المحرم وأشهد على نفسه وجاء المقتدر بفلس وجيء بالقاهر إليه والقاهر يقول الله الله نفسي نفسي يا أمير المؤمنين {cite:muntazam-ibn-al-jawzi p. 514}"
  en: "In 317 Mu'nis al-Muzaffar rose on al-Muqtadir — the caliph meant to give the amirate to Harun ibn Gharib — marched the whole army to the palace, dragged the caliph out on the night of 14 Muharram, looted six hundred thousand dinars from his mother, made him witness his own deposition, and hailed Muhammad ibn al-Mu'tadid as al-Qahir with Ibn Muqla as vizier. Two days later the soldiers came demanding the accession bounty, killed the chamberlain, carried al-Muqtadir back on their necks, and brought al-Qahir weeping 'God, God, for my life' — al-Muqtadir kissed him: 'you have no sin' {cite:tarikh-khulafa-minhaj-1434 p. 591-592}."
