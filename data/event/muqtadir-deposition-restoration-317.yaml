id: event/muqtadir-deposition-restoration-317
class: event
kind: mutiny
label: { ar: "خلع المقتدر لمؤنس ورد الجند إياه", en: "Mu'nis's deposition of al-Muqtadir and the troops' restoration of him", es: "La deposición de al-Muqtadir por parte de Mu'nis y su posterior restitución por las tropas.", fr: "La destitution d'al-Muqtadir par Mu'nis et sa réintégration par les troupes.", ur: "مقتدیر کی معزولی اور فوجوں کا اس کی بحالی", tr: "El-Muktedir Mu'nis'i tahttan indirdi ve askerler onu geri verdi", id: "Al-Muqtadir menggulingkan Mu'nis dan tentara mengembalikannya" }
summary:
  ar: "في سنة سبع عشرة خرج مؤنس الخادم الملقب بالمظفر على المقتدر لكونه بلغه أنه يريد أن يولي إمرة الأمراء هارون بن غريب مكانه وركب معه سائر الجيش وجاؤوا إلى دار الخلافة وأخرج المقتدر ليلة أربع عشر المحرم ونهب لأمه ست مئة ألف دينار وأشهد على نفسه بالخلع وأحضر محمد بن المعتضد فبايعه مؤنس والأمراء ولقبوه القاهر بالله وفوضت الوزارة إلى ابن مقلة، وجلس القاهر يوم الأحد وعمل الموكب يوم الاثنين فجاء العسكر يطلبون رزق البيعة ورزق سنة فقتلوا الحاجب ومالوا إلى دار مؤنس يطلبون المقتدر ليردوه فحملوه على أعناقهم إلى قصر الخلافة وأخذ القاهر فجيء به وهو يبكي يقول الله الله في نفسي فقبَّله المقتدر وقال أنت والله لا ذنب لك فطب نفساً {cite:tarikh-khulafa-minhaj-1434 p. 591-592}. وعند ابن الأثير كان منه أن أخرجوا المقتدر ووالدته وخالته وخواص جواريه وأولاده من دار الخلافة وحملوا إلى دار مؤنس فاعتُقلوا بها، وأحضروا القاضي أبا عمرو ليشهد عليه بالخلع وقام إليه ابن حمدان وقال يا سيدي يعز علي أن أراك على هذه الحال وقد كنت أخاها مليكك ودمعت عيناه وعينا المقتدر، وأودعوا كتاب الخلع عند القاضي أبي عمرو فكتمه ولم يُطلع عليه أحداً فلما عاد المقتدر سلمه إليه وأعلمه أنه لم يطلع عليه غيره فاستحسن ذلك وولّاه القضاء، ومضى بني بن نفيس إلى تربة لوالده المقتدر فأخرج من قبر فيها ستمائة ألف دينار، ولما تولى نازوك حجابة الخليفة أمر الرجالة المصافية بقلع خيامهم من دار الخليفة فعظم ذلك عليهم فكانوا سبب رد المقتدر، وجاءت الرجالة يوم الاثنين سابع عشر المحرم يطلبون حق البيعة ورزق سنة فارتفعت زعقاتهم ومالوا إلى دار مؤنس يطلبون المقتدر {cite:kamil-ibn-al-athir p. 148-150}، وعند ابن الجوزي ولقب القاهر بالله وقلد أبا علي بن مقلة وزارته وخلع المقتدر من الخلافة يوم السبت النصف من المحرم وأشهد على نفسه وجاء المقتدر بفلس وجيء بالقاهر إليه والقاهر يقول الله الله نفسي نفسي يا أمير المؤمنين {cite:muntazam-ibn-al-jawzi p. 514}"
  en: "In 317 Mu'nis al-Muzaffar rose on al-Muqtadir — the caliph meant to give the amirate to Harun ibn Gharib — marched the whole army to the palace, dragged the caliph out on the night of 14 Muharram, looted six hundred thousand dinars from his mother, made him witness his own deposition, and hailed Muhammad ibn al-Mu'tadid as al-Qahir with Ibn Muqla as vizier. Two days later the soldiers came demanding the accession bounty, killed the chamberlain, carried al-Muqtadir back on their necks, and brought al-Qahir weeping 'God, God, for my life' — al-Muqtadir kissed him: 'you have no sin' {cite:tarikh-khulafa-minhaj-1434 p. 591-592}."
  es: "En 317, Mu'nis al-Muzaffar se enfrentó a al-Muqtadir —el califa que debía entregar el emirato a Harun ibn Gharib—, marchó con todo el ejército hasta el palacio, sacó al califa a rastras la noche del 14 de Muharram, le robó seiscientos mil dinares a su madre, lo obligó a presenciar su propia deposición y proclamó a Muhammad ibn al-Mu'tadid como al-Qahir, con Ibn Muqla como visir. Dos días después, los soldados llegaron exigiendo la recompensa por la ascensión al trono, mataron al chambelán, llevaron a al-Muqtadir de vuelta sobre sus cuellos y trajeron a al-Qahir llorando: «¡Dios, Dios, por mi vida!». Al-Muqtadir lo besó: «No tienes pecado» {cite:tarikh-khulafa-minhaj-1434 p. 591-592}."
  fr: "En 317, Mu'nis al-Muzaffar se souleva contre al-Muqtadir, le calife qui devait confier l'émirat à Harun ibn Gharib. Il mena toute son armée au palais, en arracha le calife des lieux dans la nuit du 14 Muharram, déroba six cent mille dinars à sa mère, le força à assister à sa propre destitution et proclama Muhammad ibn al-Mu'tadid al-Qahir, avec Ibn Muqla comme vizir. Deux jours plus tard, les soldats revinrent réclamer la prime d'accession au trône, tuèrent le chambellan, ramenèrent al-Muqtadir sur leur dos et ramenèrent al-Qahir qui pleurait: « Dieu, Dieu, pour ma vie ! » Al-Muqtadir l'embrassa: « Tu n'as commis aucun péché. » (Voir: Tarikh-Khulafa-Minhaj-1434, p. 591-592)."
  ur: "317 میں معنۃ المظفر المقتدیر پر چڑھا - خلیفہ کا مقصد ہارون بن غریب کو امارت دینا تھا - اس نے پوری فوج کو محل کی طرف کوچ کیا، 14 محرم کی رات خلیفہ کو گھسیٹ کر باہر لے گیا، اس کی والدہ سے چھ لاکھ دینار لوٹ لیے، اس کی ملکیت محمدی بنا لی، اور اس نے اپنی ملکیت میں لے لیا۔ المتدید القاہر کے ساتھ ابن مقلہ وزیر کے طور پر۔ دو دن بعد سپاہی الحاق کے فضل کا مطالبہ کرتے ہوئے آئے، چیمبرلین کو قتل کر دیا، مقتدیر کو ان کی گردنوں پر واپس لے گئے، اور القاہر کو روتے ہوئے 'خدا، خدا، میری زندگی کے لیے' لے آئے - مقتدر نے اسے بوسہ دیا: 'تمہارا کوئی گناہ نہیں ہے'۔ 591-592}۔"
  tr: "On yedinci yılda, lakabı el-Muzaffar olan hizmetçi Mu'nis, Muktadir'in yerine Harun ibn Gharib'i emirlerin komutanı olarak atamak istediğini duyunca ona isyan etti. Muktadir ve ordunun geri kalanıyla birlikte halifenin sarayına geldiler. Muktadir, Muharrem ayının on dördüncü gecesi dışarı çıkarıldı ve annesinden altı yüz bin dinar ele geçirildi. Feragat ettiğini ilan etti ve Muhammed ibn el-Mu'tadid'i getirdi. Mu'nis ve emirler ona biat ettiler ve ona el-Kahir Billa unvanını verdiler. Vezirlik İbn Muqlah'a emanet edildi. El-Kahir pazar günü oturdu ve tören pazartesi günü yapıldı. Ordu, biat bedeli ve yıllık ödemeyi istemek için geldi, bu yüzden saray görevlisini öldürdüler ve Mu'nis'in evine giderek Muktadir'i geri getirmek için aradılar. Onu omuzlarında halifenin sarayına taşıdılar ve el-Kahir'i de yanlarına aldılar. Ağlayarak ve \"Allah, Allah, benim için\" diyerek getirildi. El-Muktadir onu öptü ve \"Allah'a yemin ederim ki, günahın yok, neşelen\" dedi. {kaynak:tarikh-khulafa-minhaj-1434 s. 591-592}. İbn el-Athir'e göre, olayda el-Muktadir, annesi, teyzesi, en yakın kadın köleleri ve çocukları halifenin sarayından alınarak Mu'nis'in evinde hapsedildi. Kadı Ebu Amr, tahttan indirilmeye şahitlik etmesi için huzuruna getirildi. İbn Hamdan ona yaklaştı ve \"Efendim, sizi bu halde görmek beni üzüyor, çünkü siz bir zamanlar kardeşim, sizin kralınızdınız\" dedi. Hem onun hem de el-Muktadir'in gözleri yaşlarla doldu. İfade belgesi, onu gizli tutan ve kimseye açıklamayan Kadı Ebu Amr'a emanet edildi. Muktedir döndüğünde, belgeyi ona teslim etti ve başka kimsenin görmediğini bildirdi. Muktedir bunu takdir etti ve onu kadı olarak atadı. Beni İbn Nafis, babaları Muktedir'in türbesine giderek oradan altı yüz bin dinar çıkardılar. Nazuk halifenin kâhyası olunca, piyadelere çadırlarını halifenin sarayından kaldırmalarını emretti. Bu onları çok üzdü ve Muktedir'in düşüşüne sebep oldular. Muharrem ayının on yedinci Pazartesi günü, piyadeler biat ve bir yıllık maaşlarını talep ederek geldiler. Çığlıkları daha da yükseldi ve Muktedir'i aramak için Mu'nis'in evine yürüdüler. {cite:kamil-ibn-al-athir s. İbn el-Cevzi'ye göre, kendisine el-Kahir Billa unvanı verilmiş ve Ebu Ali ibn Mukla'yı veziri olarak atamıştır. Muharrem ayının ortasında, Cumartesi günü el-Muktadir'i halifelikten azletmiştir ve aleyhinde şahitleri vardır. El-Muktadir bir fils ile gelmiş ve el-Kahir ona getirilmiştir. El-Kahir, \"Allah, Allah, ben, ben, Ey Müminlerin Emiri\" diyordu. {alıntı:muntazam-ibn-al-jawzi s. 514}"
  id: "Pada tahun ketujuh belas, Mu'nis, seorang pelayan yang dijuluki al-Muzaffar, memberontak terhadap al-Muqtadir karena ia mendengar bahwa al-Muqtadir ingin mengangkat Harun ibn Gharib sebagai komandan para emir menggantikannya. Ia berkuda bersama Harun dan sisa pasukan dan mereka datang ke istana Khalifah. Al-Muqtadir dibawa keluar pada malam tanggal empat belas Muharram dan enam ratus ribu dinar disita dari ibunya. Ia menyatakan pengunduran dirinya dan membawa Muhammad ibn al-Mu'tadid, dan Mu'nis serta para emir berjanji setia kepadanya dan memberinya gelar al-Qahir Billah. Jabatan wazir dipercayakan kepada Ibn Muqlah. Al-Qahir duduk pada hari Minggu dan prosesi diadakan pada hari Senin. Pasukan datang untuk meminta pembayaran janji setia dan pembayaran tahunan, sehingga mereka membunuh kepala pelayan dan pergi ke rumah Mu'nis untuk mencari al-Muqtadir dan membawanya kembali. Mereka menggendongnya di pundak mereka ke istana Khalifah dan membawa al-Qahir. Ia dibawa masuk sambil menangis dan berkata, \"Ya Allah, ya Allah, demi aku.\" Al-Muqtadir menciumnya dan berkata, \"Demi Allah, kamu tidak berdosa, jadi bergembiralah.\" {cite:tarikh-khulafa-minhaj-1434 p. 591-592}. Menurut Ibn al-Athir, kejadian itu melibatkan al-Muqtadir, ibunya, bibi dari pihak ibunya, budak-budak perempuan terdekatnya, dan anak-anaknya yang dibawa dari istana Khalifah dan dipenjara di rumah Mu'nis. Hakim Abu 'Amr dibawa ke hadapannya untuk menyaksikan pemecatan tersebut. Ibn Hamdan mendekatinya dan berkata, \"Tuanku, aku sedih melihatmu dalam keadaan seperti ini, karena engkau pernah menjadi saudaraku, rajamu.\" Air mata menggenang di matanya dan di mata al-Muqtadir. Dokumen pemecatan itu dipercayakan kepada Hakim Abu 'Amr, yang merahasiakannya dan tidak mengungkapkannya kepada siapa pun. Ketika al-Muqtadir kembali, ia menyerahkannya kepadanya, memberitahunya bahwa tidak ada orang lain yang pernah melihatnya. Al-Muqtadir menghargai hal ini dan mengangkatnya sebagai hakim. Bani Ibnu Nafis pergi ke makam ayah mereka, al-Muqtadir, dan menggali enam ratus ribu dinar darinya. Ketika Nazuk menjadi bendahara Khalifah, ia memerintahkan pasukan infanteri untuk memindahkan tenda-tenda mereka dari istana Khalifah. Hal ini sangat membuat mereka sedih, dan mereka menjadi penyebab kejatuhan al-Muqtadir. Pada hari Senin, tanggal tujuh belas Muharram, pasukan infanteri datang menuntut kesetiaan mereka dan tunjangan setahun. Teriakan mereka semakin keras, dan mereka berbaris ke rumah Mu'nis untuk mencari al-Muqtadir. {cite:kamil-ibn-al-athir p. 148-150}, dan menurut Ibn al-Jawzi, ia diberi gelar al-Qahir Billah, dan ia mengangkat Abu Ali ibn Muqlah sebagai menterinya, dan ia menggulingkan al-Muqtadir dari kekhalifahan pada hari Sabtu, pertengahan Muharram, dan ia mempunyai saksi-saksi yang memberatkan dirinya, dan al-Muqtadir datang dengan seorang fils, dan al-Qahir dibawa kepadanya, dan al-Qahir berkata, “Allah, Allah, diriku, diriku, wahai Amirul Mukminin” {kutip:muntazam-ibn-al-jawzi hlm. 514}"
