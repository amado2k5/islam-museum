label: { ar: "كتاب القادر في الأصول" }
summary:
  ar: "قال الخطيب كان القادر من الديانة والسيادة وإدامة التهجد وكثرة الصدقات وحسن الطريقة على صفة اشتهرت عنه تفقه على العلامة أبي بشر الهروي الشافعي وقد صنف كتاباً في الأصول ذكر فيه فضائل الصحابة وإكفار المعتزلة والقائلين بخلق القرآن وكان ذلك الكتاب يقرأ في كل جمعة في حلقة أصحاب الحديث بجامع المهدي وبحضرة الناس {cite:tarikh-khulafa-minhaj-1434 p. 634}. ويوثق ابن الجوزي أن الاعتقاد القادري قرئ في الديوان سنة 433هـ بحضور الزهاد والعلماء، فكتب الشيخ أبو الحسن علي بن عمر القزويني خطه تحته قبل أن يكتب الفقهاء، وكتب الفقهاء خطوطهم فيه «إن هذا اعتقاد المسلمين ومن خالفه فقد فسق وكفر»، ويورد نصه كاملاً من «يجب على الإنسان أن يعلم أن الله عز وجل وحده لا شريك له لم يلد ولم يولد» إلى آخره {cite:muntazam-ibn-al-jawzi j.8 p.109-112}."
  en: "Al-Khatib: al-Qadir was marked by piety, night-prayer, abundant alms and good conduct; he studied fiqh under the Shafi'i master Abu Bishr al-Harawi and authored a book of usul containing the Companions' virtues and the takfir of the Mu'tazila and the Quran-creators — read every Friday in the ahl al-hadith circle at al-Mahdi's mosque before the people {cite:tarikh-khulafa-minhaj-1434 p. 634}."
