label: { ar: "كتاب القادر في الأصول", en: "Al-Qadir's book on the fundamentals (al-usul)", es: "El libro de Al-Qadir sobre los fundamentos (al-usul)", fr: "Le livre d'Al-Qadir sur les fondements (al-usul)", ur: "بنیادی اصولوں پر القادر کی کتاب ⁦(الصلوۃ)⁩", tr: "El-Kadir'in Prensipler Kitabı", id: "Kitab Prinsip-Prinsip Al-Qadir" }
summary:
  ar: "قال الخطيب كان القادر من الديانة والسيادة وإدامة التهجد وكثرة الصدقات وحسن الطريقة على صفة اشتهرت عنه تفقه على العلامة أبي بشر الهروي الشافعي وقد صنف كتاباً في الأصول ذكر فيه فضائل الصحابة وإكفار المعتزلة والقائلين بخلق القرآن وكان ذلك الكتاب يقرأ في كل جمعة في حلقة أصحاب الحديث بجامع المهدي وبحضرة الناس {cite:tarikh-khulafa-minhaj-1434 p. 634}. ويوثق ابن الجوزي أن الاعتقاد القادري قرئ في الديوان سنة 433هـ بحضور الزهاد والعلماء، فكتب الشيخ أبو الحسن علي بن عمر القزويني خطه تحته قبل أن يكتب الفقهاء، وكتب الفقهاء خطوطهم فيه «إن هذا اعتقاد المسلمين ومن خالفه فقد فسق وكفر»، ويورد نصه كاملاً من «يجب على الإنسان أن يعلم أن الله عز وجل وحده لا شريك له لم يلد ولم يولد» إلى آخره {cite:muntazam-ibn-al-jawzi j.8 p.109-112}."
  en: "Al-Khatib: al-Qadir was marked by piety, night-prayer, abundant alms and good conduct; he studied fiqh under the Shafi'i master Abu Bishr al-Harawi and authored a book of usul containing the Companions' virtues and the takfir of the Mu'tazila and the Quran-creators — read every Friday in the ahl al-hadith circle at al-Mahdi's mosque before the people {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  es: "Al-Khatib: Al-Qadir se caracterizó por su piedad, la oración nocturna, la abundancia de limosnas y su buena conducta; estudió fiqh con el maestro shafi'i Abu Bishr al-Harawi y fue autor de un libro de usul que contenía las virtudes de los Compañeros y el takfir de los Mu'tazila y los creadores del Corán, que se leía todos los viernes en el círculo de ahl al-hadith en la mezquita de al-Mahdi ante la gente {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  fr: "Al-Khatib: al-Qadir était marqué par la piété, la prière nocturne, l'aumône abondante et la bonne conduite; il a étudié le fiqh sous le maître Shafi'i Abu Bishr al-Harawi et a écrit un livre d'usul contenant les vertus des Compagnons et le takfir des Mu'tazilites et des créateurs du Coran — lu chaque vendredi dans le cercle ahl al-hadith à la mosquée d'al-Mahdi devant les gens {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  ur: "الخطیب: القادر کو تقویٰ، رات کی نماز، کثرت سے صدقہ اور حسن سلوک سے نشان زد کیا گیا تھا۔ اس نے شافعی ماسٹر ابو بشر الحروی کے ماتحت فقہ کی تعلیم حاصل کی اور صحابہ کے فضائل اور معتزلہ اور قرآن کریم کے تخلیق کاروں کی تکفیر پر مشتمل ایک کتاب تصنیف کی - ہر جمعہ کو مسجد المہدی میں اہل حدیث حلقہ میں لوگوں کے سامنے پڑھا کرتے تھے۔ 634}۔"
  tr: "El-Hatib şöyle dedi: El-Kadir, dindarlığı, önderliği, sürekli gece namazları, bol sadakası ve iyi davranışlarıyla meşhurdu. Fıkıh ilmini Ebu Bişr el-Haravi el-Şafii'nin yanında okudu ve Sahabelerin faziletlerini anlattığı, Mu'tezilileri ve Kur'an'ın yaratıldığını söyleyenleri kâfir ilan ettiği bir kitap yazdı. Bu kitap, her Cuma günü El-Mehdi Mescidi'nde hadis ehlinin huzurunda halkın önünde okunurdu. {Kaynak:tarikh-khulafa-minhaj-1434 s. 634}. İbn el-Cevzi, Kadiri akidesinin 433 Hicri yılında Divan'da zahitler ve âlimlerin huzurunda okunduğunu belgelemiştir. Şeyh Ebu el-Hasan Ali ibn Ömer el-Kazvini, hukukçular yazmadan önce kendi el yazısıyla altına yazdı ve hukukçular da kendi el yazılarıyla üzerine yazdılar: “Bu, Müslümanların akidesidir ve kim buna karşı çıkarsa, ahlaksızlık ve küfür işlemiş olur.” Metnin tamamını, “İnsanın bilmesi gerekir ki, Yüce Allah tektir, ortağı yoktur, O doğurmaz ve doğurulmaz” ayetinden sonuna kadar alıntılamıştır. {cite:muntazam-ibn-al-jawzi j.8 p.109-112}."
  id: "Al-Khatib berkata: Al-Qadir adalah seorang yang taat beragama, pemimpin, rajin shalat malam, banyak beramal, dan memiliki perilaku yang baik, yang membuatnya terkenal. Ia mempelajari fiqih di bawah bimbingan ulama Abu Bishr al-Harawi al-Shafi’i, dan ia menulis sebuah buku tentang prinsip-prinsip di mana ia menyebutkan keutamaan para Sahabat dan menyatakan kaum Mu’tazilah dan mereka yang mengatakan Al-Qur’an diciptakan sebagai orang kafir. Buku itu dibaca setiap Jumat dalam lingkaran para ahli Hadits di Masjid Al-Mahdi di hadapan orang-orang. {cite:tarikh-khulafa-minhaj-1434 p. 634}. Ibn al-Jawzi mendokumentasikan bahwa akidah Qadiri dibaca di Diwan pada tahun 433 H di hadapan para khalifah dan ulama. Syekh Abu al-Hasan Ali ibn Umar al-Qazwini menulis tulisan tangannya di bawahnya sebelum para ahli hukum menulis, dan para ahli hukum kemudian menulis tulisan tangan mereka di atasnya: “Inilah akidah kaum Muslimin, dan siapa pun yang tidak setuju dengannya telah berbuat kemaksiatan dan kekafiran.” Beliau mengutip teksnya secara lengkap, dari “Wajib bagi manusia untuk mengetahui bahwa Allah Yang Maha Kuasa tidak mempunyai sekutu, Dia tidak beranak dan tidak pula diperanakkan,” hingga akhir. {cite:muntazam-ibn-al-jawzi j.8 p.109-112}."
