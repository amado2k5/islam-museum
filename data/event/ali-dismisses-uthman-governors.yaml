summary:
  ar: "فرّق عليّ عماله على الأمصار أول خلافته: بعث عثمان بن حنيف على البصرة، وعمارة بن شهاب على الكوفة، وعبيد الله بن عباس على اليمن، وقيس بن سعد على مصر، وسهل بن حنيف على الشام. فأما سهل فلقيته خيل بتبوك فقالوا إن كان بعثك عثمان فحيّ هلا بك وإن كان بعثك غيره فارجع، فرجع. وأما عمارة فلقيه طليحة بن خويلد بزُبالة خارجًا يطلب بثأر عثمان فقال ارجع فإن القوم لا يريدون بأميرهم بدلًا فإن أبيت ضربت عنقك، فرجع. وأما قيس فقال لخيل أيلة إنه من فالّة عثمان يطلب النصرة حتى دخل مصر، وانقسم أهلها: فرقة معه، وفرقة اعتزلت بخربتا حتى يُقتل قتلة عثمان، وفرقة مع الجماعة ما لم يُقد من إخوانهم. ودخل عثمان بن حنيف البصرة ولم يرده أحد {cite:kamil-ibn-al-athir p. 565-566}."
  en: "ʿAli replaced ʿUthmān's governors at the outset of his caliphate: ʿUthmān ibn Ḥunayf took Basra unopposed; Sahl ibn Ḥunayf was turned back at Tabūk — «if ʿUthmān sent you, welcome; if another sent you, go back«; ʿUmāra ibn Shihāb was turned back at Zubāla by Ṭulayḥa ibn Khuwaylid on pain of death; and Qays ibn Saʿd passed the patrol at Ayla by claiming to be an avenger of ʿUthmān, then entered Egypt where its people split into three camps {cite:kamil-ibn-al-athir p. 565-566}."
