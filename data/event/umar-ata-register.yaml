summary:
  ar: "كتب الديوان سنة ٢٠ بدأ ببني هاشم في الدعوة ثم الأقرب فالأقرب برسول الله وكان القوم إذا استووا في القرابة قدم أهل السابقة ثم انتهى إلى الأنصار فقالوا بمن نبدأ فقال ابدؤوا برهط سعد بن معاذ الأشهلي من الأوس ثم الأقرب فالأقرب لسعد وكان أبو بكر قد سوى بين الناس في القسم فقيل لعمر في ذلك فقال لا أجعل من قاتل رسول الله كمن قاتل معه فبدأ بمن شهد بدراً من المهاجرين والأنصار ففرض لكل رجل منهم خمسة آلاف درهم في كل سنة حليفهم ومولاهم معهم بالسواء وفرض لمن كان له إسلام كإسلام أهل بدر ومن مهاجرة الحبشة ممن شهد أحداً أربعة آلاف درهم لكل رجل وفرض لأبناء البدريين ألفين ألفين إلا حسناً وحسيناً فإنه ألحقهما بفريضة أبيهما لقرابتهما برسول الله ففرض لكل واحد منهما خمسة آلاف وفرض للعباس بن عبد المطلب خمسة آلاف وقال بعضهم فرض له سبعة آلاف وقال سائرهم لم يفضل أحداً على أهل بدر إلا أزواج النبي فإنه فرض لهن اثني عشر ألفاً وألحق بهن جويرية بنت الحارث وصفية بنت حيي بن أخطب وفرض لمن هاجر قبل الفتح وفرض لعمر بن أبي سلمة أربعة آلاف فقال محمد بن عبد الله بن جحش لم تفضل عمر علينا وقد هاجر آباؤنا وشهدوا بدراً فقال أفضله لكانه من النبي فليأت الذي يستغيث بأم مثل أم سلمة أغيثه وفرض لأسامة بن زيد أربعة آلاف فقال عبد الله بن عمر فرضت لي في ثلاثة آلاف وفرضت لأسامة في أربعة آلاف وقد شهدت ما لم يشهد أسامة فقال زدته لأنه كان أحب إلى رسول الله منك وكان أبوه أحب إلى رسول الله من أبيك ثم فرض للناس على منازلهم وقراءتهم القرآن وجهادهم وفرض لأهل اليمن وقيس بالشام والعراق لكل رجل ما بين الألفين إلى الألف إلى تسعمائة إلى خمسمائة إلى ثلاثمائة ولم ينقص أحداً من ثلاثمائة وقال لئن كثر المال لأفرض لكل رجل أربعة آلاف درهم ألفاً لسفره وألفاً لسلاحه وألفاً يخلفه لأهله وألفاً لفرسه ونعله وفرض للمهاجرات وقال الواقدي روى أنه فرض للنساء المهاجرات ثلاثة آلاف لكل واحدة وكان يفرض للمنفوس مائة درهم فإذا ترعرع بلغ به مائتي درهم وكان إذا أتي باللقيط فرض له في مائة وفرض له رزقاً يأخذه وليه كل شهر ويحمل رضاعه ونفقته من بيت المال."
  en: "The diwan, written in 20h, opened with Banu Hashim, nearest to the Prophet first, sabiqa breaking kin-ties — and for the Ansar 'begin with Sa'd ibn Mu'adh's rah t of Aws'. Abu Bakr had made shares equal; Umar refused — 'I will not make who fought the Prophet like who fought with him': five thousand a year for every Badr man, allies and mawali equal; four thousand for Badr-like Islam, Abyssinia-migrants and Uhud-men; two thousand for Badris' sons, save Hasan and Husayn joined to their father's five thousand for kinship; al-Abbas five or seven thousand; above all, the Prophet's wives twelve thousand, Juwayriya and Safiyya joined. Umar ibn Abi Salama got four thousand — 'I favor his nearness: bring me a mother like Umm Salama' — and Usama ibn Zayd four thousand to Abdallah ibn Umar's three: 'he was dearer to the Prophet than you, his father dearer than yours'. The rest by rank, Qur'an and jihad; Yemen and Qays folk from two thousand to none below three hundred — 'were the wealth great I'd give each man four thousand: a thousand for travel, a thousand for arms, a thousand left home, a thousand for horse and shoe' — stipends for muhajirat women, a hundred for the exposed infant rising at weaning, a hundred and monthly keep for every foundling, suckling and upkeep on the bayt al-mal."
