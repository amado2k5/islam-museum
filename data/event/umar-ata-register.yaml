summary:
  ar: "كتب الديوان سنة ٢٠ بدأ ببني هاشم في الدعوة ثم الأقرب فالأقرب برسول الله وكان القوم إذا استووا في القرابة قدم أهل السابقة ثم انتهى إلى الأنصار فقالوا بمن نبدأ فقال ابدؤوا برهط سعد بن معاذ الأشهلي من الأوس ثم الأقرب فالأقرب لسعد وكان أبو بكر قد سوى بين الناس في القسم فقيل لعمر في ذلك فقال لا أجعل من قاتل رسول الله كمن قاتل معه فبدأ بمن شهد بدراً من المهاجرين والأنصار ففرض لكل رجل منهم خمسة آلاف درهم في كل سنة حليفهم ومولاهم معهم بالسواء وفرض لمن كان له إسلام كإسلام أهل بدر ومن مهاجرة الحبشة ممن شهد أحداً أربعة آلاف درهم لكل رجل وفرض لأبناء البدريين ألفين ألفين إلا حسناً وحسيناً فإنه ألحقهما بفريضة أبيهما لقرابتهما برسول الله ففرض لكل واحد منهما خمسة آلاف وفرض للعباس بن عبد المطلب خمسة آلاف وقال بعضهم فرض له سبعة آلاف وقال سائرهم لم يفضل أحداً على أهل بدر إلا أزواج النبي فإنه فرض لهن اثني عشر ألفاً وألحق بهن جويرية بنت الحارث وصفية بنت حيي بن أخطب وفرض لمن هاجر قبل الفتح وفرض لعمر بن أبي سلمة أربعة آلاف فقال محمد بن عبد الله بن جحش لم تفضل عمر علينا وقد هاجر آباؤنا وشهدوا بدراً فقال أفضله لكانه من النبي فليأت الذي يستغيث بأم مثل أم سلمة أغيثه وفرض لأسامة بن زيد أربعة آلاف فقال عبد الله بن عمر فرضت لي في ثلاثة آلاف وفرضت لأسامة في أربعة آلاف وقد شهدت ما لم يشهد أسامة فقال زدته لأنه كان أحب إلى رسول الله منك وكان أبوه أحب إلى رسول الله من أبيك ثم فرض للناس على منازلهم وقراءتهم القرآن وجهادهم وفرض لأهل اليمن وقيس بالشام والعراق لكل رجل ما بين الألفين إلى الألف إلى تسعمائة إلى خمسمائة إلى ثلاثمائة ولم ينقص أحداً من ثلاثمائة وقال لئن كثر المال لأفرض لكل رجل أربعة آلاف درهم ألفاً لسفره وألفاً لسلاحه وألفاً يخلفه لأهله وألفاً لفرسه ونعله وفرض للمهاجرات وقال الواقدي روى أنه فرض للنساء المهاجرات ثلاثة آلاف لكل واحدة وكان يفرض للمنفوس مائة درهم فإذا ترعرع بلغ به مائتي درهم وكان إذا أتي باللقيط فرض له في مائة وفرض له رزقاً يأخذه وليه كل شهر ويحمل رضاعه ونفقته من بيت المال."
  en: "The diwan, written in 20h, opened with Banu Hashim, nearest to the Prophet first, sabiqa breaking kin-ties — and for the Ansar 'begin with Sa'd ibn Mu'adh's rah t of Aws'. Abu Bakr had made shares equal; Umar refused — 'I will not make who fought the Prophet like who fought with him': five thousand a year for every Badr man, allies and mawali equal; four thousand for Badr-like Islam, Abyssinia-migrants and Uhud-men; two thousand for Badris' sons, save Hasan and Husayn joined to their father's five thousand for kinship; al-Abbas five or seven thousand; above all, the Prophet's wives twelve thousand, Juwayriya and Safiyya joined. Umar ibn Abi Salama got four thousand — 'I favor his nearness: bring me a mother like Umm Salama' — and Usama ibn Zayd four thousand to Abdallah ibn Umar's three: 'he was dearer to the Prophet than you, his father dearer than yours'. The rest by rank, Qur'an and jihad; Yemen and Qays folk from two thousand to none below three hundred — 'were the wealth great I'd give each man four thousand: a thousand for travel, a thousand for arms, a thousand left home, a thousand for horse and shoe' — stipends for muhajirat women, a hundred for the exposed infant rising at weaning, a hundred and monthly keep for every foundling, suckling and upkeep on the bayt al-mal."
  es: "El diwan, escrito en 20h, comenzó con Banu Hashim, los más cercanos al Profeta primero, sabiqa rompiendo lazos de parentesco, y para los Ansar 'comenzar con el rah t de Aws' de Sa'd ibn Mu'adh. Abu Bakr había hecho partes iguales; Umar se negó: 'No haré que quien luchó contra el Profeta sea igual a quien luchó con él': cinco mil al año para cada hombre de Badr, aliados y mawali iguales; cuatro mil para el Islam similar a Badr, los migrantes de Abisinia y los hombres de Uhud; dos mil para los hijos de Badris, excepto Hasan y Husayn unidos a los cinco mil de su padre por parentesco; al-Abbas cinco o siete mil; sobre todo, las esposas del Profeta doce mil, Juwayriya y Safiyya unidas. Umar ibn Abi Salama recibió cuatro mil — 'Prefiero su cercanía: tráiganme una madre como Umm Salama' — y Usama ibn Zayd cuatro mil frente a los tres de Abdallah ibn Umar: 'Él era más querido para el Profeta que tú, su padre más querido que el tuyo'. El resto por rango, Corán y yihad; gente de Yemen y Qays desde dos mil hasta ninguno por debajo de trescientos — 'Si la riqueza fuera grande, le daría a cada hombre cuatro mil: mil para viajar, mil para armas, mil para dejar el hogar, mil para caballo y herradura' — estipendios para mujeres muhajirat, cien para el infante expuesto al destete, cien y manutención mensual para cada expósito, lactancia y mantenimiento en el bayt al-mal."
  fr: "Le diwan, rédigé en l'an 20 de l'Hégire, commençait par les Banu Hashim, les plus proches du Prophète, la sabiqa rompant les liens de parenté. Quant aux Ansar, il était question de « commencer par la rah t de Sa'd ibn Mu'adh d'Aws ». Abou Bakr avait réparti les parts équitablement; Umar refusa: « Je ne traiterai pas ceux qui ont combattu le Prophète comme ceux qui ont combattu à ses côtés »: cinq mille par an pour chaque homme Badr, alliés et mawali confondus; quatre mille pour l'Islam de type Badr, les migrants abyssins et les hommes d'Uhud; deux mille pour les fils de Badr, à l'exception de Hassan et Hussein, ajoutés aux cinq mille de leur père au titre de la parenté; cinq ou sept mille pour al-Abbas; et surtout, douze mille pour les épouses du Prophète, Juwayriya et Safiyya réunies. Umar ibn Abi Salama reçut quatre mille shillings – « Je préfère sa proximité: donnez-moi une mère comme Umm Salama » – et Usama ibn Zayd quatre mille shillings contre trois pour Abdallah ibn Umar: « Il était plus cher au Prophète que toi, son père plus cher que le tien. » Les autres reçurent selon leur rang, leur connaissance du Coran et leur engagement dans le jihad; les Yéménites et les habitants de Qays reçurent de deux mille shillings à trois cents shillings – « Si la richesse était grande, je donnerais quatre mille shillings à chacun: mille pour le voyage, mille pour les armes, mille pour le foyer, mille pour le cheval et le ferrage » – des allocations pour les femmes muhajirat, cent shillings pour le nourrisson abandonné au moment du sevrage, cent shillings et une pension mensuelle pour chaque enfant trouvé, pour l’allaitement et l’entretien du bayt al-mal."
  ur: "یہ دیوان، جو 20ھ میں لکھا گیا، سب سے پہلے رسول اللہ کے قریب ترین بنو ہاشم کے ساتھ کھولا گیا، سبیقہ رشتہ توڑنے اور انصار کے لیے 'سعد بن معاذ کے اوس سے شروع ہوا'۔ ابوبکر نے حصص برابر کر دیے تھے۔ عمر نے انکار کر دیا - 'میں نبی سے لڑنے والے کو اس طرح نہیں بناؤں گا جس نے آپ کے ساتھ جنگ کی': ہر بدر مرد، حلیف اور موالی کے لیے پانچ ہزار سال برابر۔ بدر نما اسلام، حبشہ مہاجرین اور احد والوں کے لیے چار ہزار۔ دو ہزار بدری کے بیٹوں کے لیے، سوائے حسن اور حسین نے اپنے باپ کے پانچ ہزار رشتہ داری کے لیے۔ العباس پانچ یا سات ہزار؛ سب سے بڑھ کر بارہ ہزار ازواج مطہرات جویریہ اور صفیہ شامل ہوئیں۔ عمر بن ابی سلمہ کو چار ہزار ملے - 'میں ان کے قرب کا حامی ہوں: مجھے ام سلمہ جیسی ماں لاؤ' - اور اسامہ بن زید نے چار ہزار عبداللہ بن عمر کے تینوں کو: 'وہ نبی کو تم سے زیادہ پیارے تھے، ان کے والد تم سے زیادہ عزیز تھے'۔ باقی درجہ، قرآن اور جہاد کے لحاظ سے۔ یمن اور قیس کے لوگ دو ہزار سے لے کر تین سو سے کم تک - 'یہ دولت تھی کہ میں ہر آدمی کو چار ہزار دیتا: سفر کے لیے ایک ہزار، اسلحہ کے لیے ایک ہزار، ایک ہزار گھر چھوڑنے کے لیے، ایک ہزار گھوڑے اور جوتے کے لیے' - مہاجر خواتین کے لیے وظیفہ، دودھ چھڑانے کے وقت اٹھنے والے بچے کے لیے ایک سو، ایک سو، اور ہر ایک کے لیے ماہانہ کفایت شعاری کے لیے۔"
