label: { ar: "حصار أبي يعقوب المريني لتلمسان", en: "Siege of Tlemcen by Abu Ya'qub the Marinid", es: "Asedio de Tlemcen por Abu Ya'qub el Marinid", fr: "Siège de Tlemcen par Abu Ya'qub le Marinide", ur: "ابو یعقوب مرینیڈ کے ذریعہ تلمسن کا محاصرہ", tr: "Ebu Yaqub al-Marini'nin Tlemcen kuşatması", id: "Pengepungan Tlemcen oleh Abu Yaqub al-Marini" }
summary:
  ar: "حاصر أبو يعقوب يوسف المريني تلمسان على بني عبد الواد مائة شهر وبنى قبالتها مدينة المنصورة كاملة العمران فأشرف بنو عبد الواد على الهلاك وأذنوا بالانقراض، ثم هلك السلطان بالمنصورة سنة 707هـ فخربها آل يغمراسن عند ارتحال كتائبه {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  en: "The Marinid Abu Ya'qub besieged Tlemcen a hundred months behind the walls of his counter-city al-Mansura, and the Abd al-Wadids were near extinction when he died in 707 and his siege-city was razed {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  es: "El mariní Abu Ya'qub sitió Tlemcen durante cien meses tras las murallas de su ciudad vecina, al-Mansura, y los Abd al-Wadids estaban cerca de la extinción cuando murió en 707 y su ciudad sitiada fue arrasada {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  fr: "Le Mérinide Abu Ya'qub assiégea Tlemcen pendant cent mois derrière les murs de sa contre-ville al-Mansura, et les Abd al-Wadids étaient presque exterminés lorsqu'il mourut en 707 et que sa ville de siège fut rasée {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  ur: "مرنید ابو یعقوب نے تلمسن کا اپنے مخالف شہر المنصورہ کی دیواروں کے پیچھے سو ماہ تک محاصرہ کیا، اور عبد الودید اس وقت معدوم ہونے کے قریب تھے جب وہ 707 میں فوت ہوا اور اس کے محاصرے والے شہر کو مسمار کر دیا گیا۔ 1938}۔"
  tr: "Ebu Yakub Yusuf el-Marini, Banu Abdülvad'a karşı yüz ay boyunca Tlemcen'i kuşattı ve karşısına tam gelişmiş Mansur şehrini inşa etti. Banu Abdülvad yok olmanın eşiğindeydi ve neredeyse tamamen ortadan kaldırılacaktı. Sonra Sultan, Hicri 707 yılında Mansur'da öldü ve Banu Yaghmurasen, askerleri ayrıldıktan sonra şehri yıktı. {cite:tarikh-ibn-khaldun-ibar s. 1938}"
  id: "Abu Yaqub Yusuf al-Marini mengepung Tlemcen selama seratus bulan melawan Bani Abd al-Wad dan membangun kota Mansoura yang berkembang pesat di seberangnya. Bani Abd al-Wad berada di ambang kehancuran dan hampir musnah. Kemudian Sultan wafat di Mansoura pada tahun 707 Hijriah, dan Bani Yaghmurasen menghancurkannya ketika pasukannya pergi. {cite:tarikh-ibn-khaldun-ibar p. 1938}."
