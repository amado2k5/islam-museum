label: { ar: "ولاية سلم بن زياد خراسان", en: "Salm ibn Ziyad's Khurasan", es: "El Jorasán de Salm ibn Ziyad", fr: "Le Khorasan de Salm ibn Ziyad", ur: "سالم ابن زیاد کا خراسان", tr: "Selam bin Ziyad Horasan'ın durumu", id: "Keadaan Salam bin Ziyad Khurasan" }
summary:
  ar: "ولى يزيد بن معاوية سلم بن زياد خراسان فصالحه أهل خوارزم على أربعمائة ألف وحملوها إليه وقطع النهر ومعه امرأته أم محمد بنت عبد الله بن عثمان بن أبي العاص الثقفي وكانت أول عربية عبر بها النهر وأتى سمرقند فأعطاه أهلها ألف دية وولد له ابن سماه السغدي واستعارت امرأته من امرأة صاحب السغد حليها فكرته عليها وذهبت به ووجه سلم وهو بالسغد جيشاً إلى خجنده وفيهم أعشى همدان فهزموا وقال الأعشى في ذلك أبياته ثم رجع سلم إلى مرو ثم غزا منها فقطع النهر وقتل بندون السغدي وقد كان السغد جمعت له فقاتلها."
  en: "Yazid ibn Mu'awiya gave Salm ibn Ziyad Khurasan; the Khwarizmians truced at four hundred thousand borne to him. He crossed the river with his wife Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi — the first Arab woman across — came to Samarqand whose folk gave him a thousand-fold bloodwit; a son born to him was named al-Sughdi; his wife borrowed the Sughd lord's wife's jewels, wore and returned them. From Sughd he sent an army to Khujanda — with A'sha Hamdan among them — defeated; then back at Marw he campaigned again across the river and killed Bandun the Sughdi, whose people had mustered for him."
  es: "Yazid ibn Mu'awiya le dio a Salm ibn Ziyad Khurasan; los khwarizmianos le ofrecieron una tregua de cuatrocientos mil hombres. Cruzó el río con su esposa Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi —la primera mujer árabe en cruzar— y llegó a Samarcanda, cuya gente le dio mil veces la sangre; tuvo un hijo llamado al-Sughdi; su esposa tomó prestadas las joyas de la esposa del señor de Sughd, las usó y las devolvió. Desde Sughd envió un ejército a Khujanda —con A'sha Hamdan entre ellos—, que fue derrotado; luego, de regreso en Marw, volvió a hacer campaña cruzando el río y mató a Bandun el Sughdi, cuya gente se había reunido para él."
  fr: "Yazid ibn Mu'awiya livra Salm ibn Ziyad au Khorasan; les Khwarezmiens conclurent une trêve contre quatre cent mille hommes. Il traversa le fleuve avec son épouse, Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi – la première femme arabe à franchir le fleuve – et arriva à Samarcande, où son peuple lui offrit une récompense au centuple. Un fils, né de cette union, fut nommé al-Sughdi. Son épouse emprunta les bijoux de la femme du seigneur de Sughd, les porta puis les rendit. De Sughd, il envoya une armée à Khodjentanda – avec A'sha Hamdan parmi ses soldats – qui fut vaincue. De retour à Marw, il mena une nouvelle campagne, traversa le fleuve et tua Bandun le Sughdi, dont le peuple s'était rallié à sa cause."
  ur: "یزید بن معاویہ نے سالم ابن زیاد کو خراسان دیا۔ خوارزمیوں نے چار لاکھ اس کے ساتھ برداشت کیا۔ اس نے اپنی بیوی ام محمد بنت عبداللہ ابن عثمان ابن ابی العاص الثقفی کے ساتھ دریا کو پار کیا - جو پہلی عرب عورت تھی - سمرقند آئی جس کے لوگوں نے اسے ہزار گنا خون دیا؛ ان کے ہاں ایک بیٹا پیدا ہوا جس کا نام السغدی رکھا گیا۔ اس کی بیوی نے سغد صاحب کی بیوی کے زیورات ادھار لیے، پہنائے اور واپس کردیے۔ سغد سے اس نے خجندہ کی طرف ایک لشکر بھیجا - جس میں عائشہ ہمدان بھی تھیں - کو شکست ہوئی۔ پھر واپس مرو میں اس نے دریا کے اس پار دوبارہ مہم چلائی اور بندون صغدی کو قتل کر دیا جس کے لوگ اس کے لیے جمع ہوئے تھے۔"
  tr: "Yezid ibn Muaviye, Salim ibn Ziyad'ı Horasan valisi olarak atadı. Harezm halkı onunla dört yüz bin karşılığında barış yaptı ve parayı ona getirdi. Eşi Ümmü Muhammed bint Abdullah ibn Osman ibn Abi el-Es el-Sakkafi ile birlikte nehri geçti; Ümmü Muhammed, onunla birlikte nehri geçen ilk Arap kadınıydı. Semerkant'a geldi ve halkı ona bin kan parası verdi. El-Sağdi adını verdiği bir oğlu oldu. Eşi, mücevherlerini Soğdiana hükümdarının karısından ödünç aldı ve kadın da onu Salim'den geri aldı. Salim, Soğdiana'dayken Hucende'ye bir ordu gönderdi ve aralarında Aşa Hamdan da vardı. Yenildiler ve Aşa bu konuda şiirler okudu. Sonra Salim Merv'e döndü, oradan baskınlar düzenledi, nehri geçti ve Bandun el-Sağdi'yi öldürdü. Soğdiana halkı onun için toplandı, bu yüzden onlarla savaştı."
  id: "Yazid bin Muawiyah mengangkat Salim bin Ziyad sebagai gubernur Khorasan. Penduduk Khwarazm berdamai dengannya dengan memberikan empat ratus ribu dan membawanya kepadanya. Ia menyeberangi sungai bersama istrinya, Umm Muhammad bint Abdullah bin Uthman bin Abi al-As al-Thaqafi, yang merupakan wanita Arab pertama yang menyeberangi sungai bersamanya. Ia tiba di Samarkand, dan penduduknya memberinya seribu uang tebusan. Ia memiliki seorang putra yang diberi nama al-Saghdi. Istrinya meminjam perhiasannya dari istri penguasa Sogdiana, dan ia mengambilnya darinya. Salim, ketika berada di Sogdiana, mengirimkan pasukan ke Khujandah, dan di antara mereka ada A’sha Hamdan. Mereka dikalahkan, dan A’sha mengucapkan syair-syairnya tentang hal itu. Kemudian Salim kembali ke Merv, lalu ia menyerang dari sana dan menyeberangi sungai serta membunuh Bandun al-Saghdi. Penduduk Sogdiana telah berkumpul untuknya, sehingga ia melawan mereka."
