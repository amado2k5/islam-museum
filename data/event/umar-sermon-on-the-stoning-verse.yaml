id: event/umar-sermon-on-the-stoning-verse
class: event
kind: other
label: { ar: "خطبة عمر الجمعة في آية الرجم وبيعة أبي بكر", en: "Umar's Friday sermon on the stoning verse and on Abu Bakr's pledge", es: "El sermón del viernes de Umar sobre el versículo de la lapidación y sobre la promesa de Abu Bakr", fr: "Le sermon d'Umar du vendredi sur le verset de la lapidation et sur le serment d'Abou Bakr", ur: "رجم کی آیت اور ابوبکر کی بیعت پر عمر کا جمعہ کا خطبہ", tr: "Ömer'in cuma hutbesinde taşlama ayeti ve Ebu Bekir'e biat edilmesi üzerine yaptığı konuşma.", id: "Khutbah Jumat Umar tentang ayat rajam dan baiat kepada Abu Bakar" }
summary:
  ar: "في أول جمعة بعد الوفاة قام عمر فذكر آية الرجم التي كانت من كتاب الله فقرأها ووعاها ورُجم بعد النبي، وخشي أن يقول قائل ما نجد الرجم في كتاب الله؛ ثم قال إن بيعة أبي بكر كانت فلتة وقى الله شرها، ومن بايع رجلاً عن غير مشورة فلا بيعة له ولا للذي بايعه."
  en: "On the first Friday after the death Umar recalled a verse of stoning, which he said had been in God's book and had been recited, memorised and applied, and feared that someone might say there is no stoning in God's book; he then called the pledge to Abu Bakr a sudden act that God had averted the harm of, and said whoever pledges to a man without consultation has no pledge, nor has the one he pledged to."
  es: "El primer viernes después de la muerte, Umar recordó un versículo sobre la lapidación, que según él estaba en el libro de Dios y había sido recitado, memorizado y aplicado, y temió que alguien pudiera decir que no hay lapidación en el libro de Dios; luego calificó la promesa hecha a Abu Bakr como un acto repentino del que Dios había evitado el daño, y dijo que quien promete a un hombre sin consultarlo no tiene ninguna promesa, ni tampoco aquel a quien prometió."
  fr: "Le premier vendredi après le décès, Umar rappela un verset concernant la lapidation, qui, selon lui, figurait dans le livre de Dieu et avait été récité, mémorisé et appliqué. Craignant que quelqu'un ne dise qu'il n'y a pas de lapidation dans le livre de Dieu, il qualifia ensuite le serment fait à Abou Bakr d'acte impulsif dont Dieu avait préservé le mal, et déclara que quiconque s'engage envers un homme sans le consulter n'a aucun engagement, ni celui à qui il s'est engagé."
  ur: "موت کے بعد پہلے جمعہ کو عمر کو رجم کی ایک آیت یاد آئی، جو ان کے بقول خدا کی کتاب میں تھی اور اس کی تلاوت، حفظ اور اطلاق کی گئی تھی، اور اندیشہ تھا کہ کوئی کہے کہ خدا کی کتاب میں رجم نہیں ہے۔ اس کے بعد انہوں نے ابوبکر کی بیعت کو ایک ناگہانی عمل قرار دیا جس سے اللہ تعالیٰ نے نقصان کو ٹال دیا اور کہا کہ جو شخص بغیر مشورے کے کسی آدمی سے بیعت کرے اس کے پاس کوئی بیعت نہیں ہے اور نہ وہ جس کا اس نے عہد کیا ہے۔"
  tr: "Vefatın ardından gelen ilk Cuma günü Ömer ayağa kalktı ve Allah'ın Kitabında geçen taşlama ayetini okudu, anladı ve Peygamberden sonra taşlandı. Birilerinin \"Allah'ın Kitabında taşlama cezası yok\" demesinden korktu. Sonra da Ebu Bekir'e biat etmenin bir hata olduğunu, Allah'ın bizi bu kötülükten koruduğunu, istişare etmeden birine biat eden kimsenin de, kendisine biat edenin de biatının geçerli olmadığını söyledi."
  id: "Pada hari Jumat pertama setelah wafatnya Nabi, Umar berdiri dan menyebutkan ayat tentang rajam yang ada dalam Kitab Allah, lalu ia membacanya dan memahaminya, kemudian dirajam setelah Nabi. Ia khawatir ada yang mengatakan bahwa kita tidak menemukan hukum rajam dalam Kitab Allah. Kemudian ia berkata bahwa baiat kepada Abu Bakar adalah sebuah kesalahan, dan Allah melindungi kita dari keburukannya, dan siapa pun yang berbaiat kepada seseorang tanpa bermusyawarah, maka tidak ada baiat baginya atau bagi orang yang berbaiat kepadanya."
