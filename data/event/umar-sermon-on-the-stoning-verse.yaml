id: event/umar-sermon-on-the-stoning-verse
class: event
kind: other
label: { ar: "خطبة عمر الجمعة في آية الرجم وبيعة أبي بكر", en: "Umar's Friday sermon on the stoning verse and on Abu Bakr's pledge" }
summary:
  ar: "في أول جمعة بعد الوفاة قام عمر فذكر آية الرجم التي كانت من كتاب الله فقرأها ووعاها ورُجم بعد النبي، وخشي أن يقول قائل ما نجد الرجم في كتاب الله؛ ثم قال إن بيعة أبي بكر كانت فلتة وقى الله شرها، ومن بايع رجلاً عن غير مشورة فلا بيعة له ولا للذي بايعه."
  en: "On the first Friday after the death Umar recalled a verse of stoning, which he said had been in God's book and had been recited, memorised and applied, and feared that someone might say there is no stoning in God's book; he then called the pledge to Abu Bakr a sudden act that God had averted the harm of, and said whoever pledges to a man without consultation has no pledge, nor has the one he pledged to."
