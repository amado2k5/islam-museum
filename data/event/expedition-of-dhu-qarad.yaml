label: { en: "The Expedition of Dhu Qarad (Ghazwat al-Ghaba)", ar: "غزوة ذي قرد (غزوة الغابة)" }
summary:
  en: "Shortly before Khaybar in 7 AH, Uyayna ibn Hisn raided the Prophet's milch camels at al-Ghaba; Salama ibn al-Akwa' pursued them alone on foot with stones and arrows, holding off the raiders until the cavalry arrived, recovering the camels."
  ar: "قبيل خيبر في المحرم 7هـ، أغار عيينة بن حصن في فوارس من غطفان على لقاح النبي بالغابة؛ فطاردهم سلمة بن الأكوع وحده ماشياً على قدميه يرميهم بالنبل والحجارة حتى استنقذ اللقاح كلها، وقال النبي: «خير فرساننا أبو قتادة وخير رجالتنا سلمة»."
