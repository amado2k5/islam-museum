id: event/death-al-kulayni-329
class: event
kind: death
label:
  ar: "وفاة الكليني ببغداد، شعبان ٣٢٩هـ/أيار 941م"
  en: "Death of al-Kulayni at Baghdad, Sha'ban 329/May 941"
  ur: "کلینی کی بغداد میں وفات، شعبان 329ھ/مئی 941ء"
  es: "Muerte de al-Kulayni en Bagdad, Sha'ban 329/Mayo 941"
  fr: "Mort d'al-Kulayni à Bagdad, le 329 Sha'ban/mai 941"
  tr: "El-Kuleyni Bağdat'ta vefat etti, Şa'ban 329 H./Mayıs 941 AD"
  id: "Al-Kulayni wafat di Bagdad, Sya'ban 329 H/Mei 941 M"
summary:
  ar: "مات [[person/al-kulayni|الكليني]] ببغداد سنة ٣٢٨/939-940 أو ٣٢٩/940-941؛ والأرجح عند معجم الإسلام الثانية، لأن [[person/shaykh-al-tusi|الطوسي]] — وقد ذكر ٣٢٨ في فهرسته الأول — حدد في رجاله المتأخر شعبان ٣٢٩/أيار 941. وصلى على جنازته الحسني الإمامي [[person/abu-qirat-muhammad-ibn-jafar|أبو قيراط محمد بن جعفر]]، ودفن قرب باب الكوفة {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}. وعند تاريخ الإسلام في تراجم سنة ٣٢٩: «كان ببغداد وبها مات، وقبره ظاهر عليه لوح»، وروى عنه [[person/ahmad-ibn-ibrahim-al-saymari|أحمد بن إبراهيم الصيمري]] {cite:tarikh-islam-dhahabi p. 250}."
  en: "al-Kulayni died at Baghdad in 328/939-40 or 329/940-41; the EI2 prefers the latter, since al-Tusi — having given 328 in his earlier Fihrist — specifies Sha'ban 329/May 941 in his later Rijal. The funeral prayer was led by the Imami Hasanid Abu Qirat Muhammad ibn Ja'far, and he was buried near the Bab al-Kufa {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}. Tarikh al-Islam lists him under 329: 'he was at Baghdad and died there, and his tomb is visible with a tablet over it'; Ahmad ibn Ibrahim al-Saymari transmitted from him {cite:tarikh-islam-dhahabi p. 250}."
  ur: "کلینی بغداد میں 328/939-40 یا 329/940-41ء میں فوت ہوا؛ دائرۃ المعارفِ اسلام دوسری تاریخ کو رجحان دیتی ہے کیونکہ [[person/shaykh-al-tusi|طوسی]] نے — اپنی پہلی فہرست میں 328 دینے کے بعد — بعد کی رجال میں شعبان 329/مئی 941 مقرر کی۔ نمازِ جنازہ امامی حسنی [[person/abu-qirat-muhammad-ibn-jafar|ابو قیراط محمد بن جعفر]] نے پڑھائی اور وہ بابِ کوفہ کے قریب دفن ہوا {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}۔ تاریخِ اسلام اسے 329 کی تراجم میں لاتا ہے: «وہ بغداد میں تھا اور وہیں فوت ہوا، اور اس کا قبر ظاہر ہے جس پر لوح ہے»، اور [[person/ahmad-ibn-ibrahim-al-saymari|احمد بن ابراہیم صیمری]] اس سے روایت کرتا ہے {cite:tarikh-islam-dhahabi p. 250}۔"
  es: "Al-Kulayni murió en Bagdad en 328/939-40 o 329/940-41; el EI2 prefiere esta última fecha, ya que al-Tusi —habiendo dado 328 en su Fihrist anterior— especifica Sha'ban 329/mayo 941 en su Rijal posterior. La oración fúnebre fue dirigida por el imamí hasaní Abu Qirat Muhammad ibn Ja'far, y fue enterrado cerca de Bab al-Kufa {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}. Tarikh al-Islam lo enumera bajo 329: «estuvo en Bagdad y murió allí, y su tumba es visible con una lápida encima»; Ahmad ibn Ibrahim al-Saymari transmitió de él {cite:tarikh-islam-dhahabi p. 250}."
  fr: "Al-Kulayni mourut à Bagdad en 328/939-40 ou 329/940-41; l’EI2 privilégie cette dernière date, car al-Tusi – ayant mentionné 328 dans son Fihrist antérieur – précise 329 Sha’ban/mai 941 dans son Rijal postérieur. La prière funéraire fut dirigée par l’imam hassanide Abu Qirat Muhammad ibn Ja’far, et il fut inhumé près de Bab al-Kufa (voir: Encyclopaedia of Islam, vol. 5, p. 401). Tarikh al-Islam le mentionne en 329: « Il était à Bagdad et y mourut; sa tombe est visible, recouverte d’une plaque », information transmise par Ahmad ibn Ibrahim al-Saymari (voir: Tarikh al-Islam, Dhahabi, p. 250)."
  tr: "El-Kulayni, Hicri 328/939-940 veya Hicri 329/940-941 yıllarında Bağdat'ta vefat etmiştir; ikinci İslam Ansiklopedisi'ne göre ikincisi daha muhtemeldir, çünkü ilk indeksinde Hicri 328'den bahseden El-Tusi, daha sonraki biyografik eserinde Hicri 329 Şaban/Mayıs 941 yılını belirtmiştir. Hasani İmami Ebu Kırat Muhammed ibn Cafer onun için cenaze namazını kıldırmış ve Kufa Kapısı yakınlarına defnedilmiştir. İslam Tarihi'nde, 329 yılına ait biyografilerde: \"Bağdat'taydı ve orada vefat etti, mezarı üzerinde bir levha ile görülebilir\" denmektedir ve bu, [[Ahmad ibn İbrahim el-Saymari]] tarafından ondan rivayet edilmiştir. {cite:tarikh-islam-dhahabi s. 250}."
  id: "Al-Kulayni wafat di Baghdad pada tahun 328 H/939-940 M atau 329 H/940-941 M; yang terakhir lebih mungkin menurut Ensiklopedia Islam kedua, karena al-Tusi—yang menyebutkan 328 H dalam indeks pertamanya—menyebutkan dalam karya biografinya yang kemudian, Sya'ban, 329 H/Mei 941 M. Imam Hasani Abu Qirat Muhammad ibn Jafar memimpin salat jenazah untuknya, dan ia dimakamkan di dekat Gerbang Kufa. Dan dalam Sejarah Islam, dalam biografi tahun 329: “Dia berada di Baghdad dan dia wafat di sana, dan kuburnya terlihat dengan sebuah prasasti di atasnya,” dan diriwayatkan darinya oleh [[person/ahmad-ibn-ibrahim-al-saymari|Ahmad ibn Ibrahim al-Saymari]] {cite:tarikh-islam-dhahabi hlm. 250}."
