id: event/testament-of-muawiya-ibn-abi-sufyan
class: event
kind: death
label:
  ar: وصية معاوية بن أبي سفيان ليزيد وفي كفنه وشعر النبي ودفنه بدمشق
  en: Testament and burial of Mu'awiya ibn Abi Sufyan
  ur: معاویہ بن ابی سفیان کی وصیت اور دمشق میں تدفین
  es: "Testamento y entierro de Mu'awiya ibn Abi Sufyan"
  fr: "Testament et enterrement de Mu'awiya ibn Abi Sufyan"
  tr: "Muaviye ibn Ebu Sufyan'ın Yezid'e vasiyeti, kefeni, Peygamberin saçı ve Şam'daki defni."
  id: "Wasiat Muawiyah bin Abi Sufyan kepada Yazid, kain kafannya, rambut Nabi, dan pemakamannya di Damaskus."
summary:
  ar: "أوصى معاوية عند احتضاره بنصف ماله أن يُرد إلى بيت المال {cite:al-bidaya-wal-nihaya scan vol. 4 p. 511}، ونصح ابنه يزيد بالرفق بالناس والمشورة وإكرام أهل الشرف وحفظ شرف أهل الشام والحجاز في رواية الواقدي {cite:al-bidaya-wal-nihaya scan vol. 4 p. 600}. وأوصى أن يُكفَّن في ثوب كساه إياه النبي وأن يوضع ما عنده من شعره وقلامة أظفاره في فمه وأنفه وعينيه وأذنيه {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}. وتوفي بدمشق في رجب سنة ستين، وصلى عليه ابنه يزيد أو الضحاك بن قيس في اختلاف الروايات، ودُفن عند باب الصغير في قول الجمهور {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}."
  en: "As he lay dying Mu'awiya bequeathed half his wealth to be returned to the treasury {cite:al-bidaya-wal-nihaya scan vol. 4 p. 511} and, in al-Waqidi's report, counselled his son Yazid to be gentle with people, to take counsel, to honour men of standing and to guard the standing of the people of Syria and the Hijaz {cite:al-bidaya-wal-nihaya scan vol. 4 p. 600}. He asked to be shrouded in a garment the Prophet had given him and to have the hair and nail parings he kept from the Prophet placed in his mouth, nose, eyes and ears {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}. He died in Damascus in Rajab of the year 60; the reports differ on whether Yazid or al-Dahhak ibn Qays prayed over him, and most place his grave at Bab al-Saghir {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}."
  ur: "معاویہ نے آخری وقت میں اپنے نصف مال کو بیت المال میں لوٹانے کی وصیت کی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 511}، اور واقدی کی روایت کے مطابق بیٹے یزید کو لوگوں سے نرمی، مشورے، معززین کی تکریم اور اہلِ شام و حجاز کی عزت کی نصیحت کی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 600}۔ انھوں نے وصیت کی کہ انھیں نبی کے عطا کردہ کپڑے میں کفن دیا جائے اور نبی سے محفوظ کیے ہوئے بال اور ناخنوں کے تراشے ان کے منہ، ناک، آنکھوں اور کانوں میں رکھے جائیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}۔ وہ سن 60 کے رجب میں دمشق میں فوت ہوئے؛ نماز یزید نے پڑھائی یا ضحاک بن قیس نے، روایات مختلف ہیں، اور اکثر کے نزدیک قبر باب الصغیر میں ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}۔"
  es: "Mientras agonizaba, Mu'awiya legó la mitad de su riqueza para que fuera devuelta al tesoro {cite:al-bidaya-wal-nihaya scan vol. 4 p. 511} y, en el informe de al-Waqidi, aconsejó a su hijo Yazid que fuera amable con la gente, que buscara consejo, que honrara a los hombres de posición y que protegiera la posición del pueblo de Siria y el Hiyaz {cite:al-bidaya-wal-nihaya scan vol. 4 p. 600}. Pidió ser amortajado con una prenda que el Profeta le había dado y que los recortes de cabello y uñas que guardaba del Profeta fueran colocados en su boca, nariz, ojos y oídos {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}. Murió en Damasco en Rajab del año 60; Los informes difieren sobre si Yazid o al-Dahhak ibn Qays oraron por él, y la mayoría sitúa su tumba en Bab al-Saghir {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}."
  fr: "Sur son lit de mort, Mu'awiya légua la moitié de sa fortune au trésor public (source: al-bidaya-wal-nihaya, vol. 4, p. 511) et, selon le récit d'al-Waqidi, conseilla à son fils Yazid d'être doux envers les gens, de prendre conseil, d'honorer les hommes de haut rang et de préserver la réputation du peuple de Syrie et du Hedjaz (source: al-bidaya-wal-nihaya, vol. 4, p. 600). Il demanda à être enveloppé dans un linceul que le Prophète lui avait donné et à ce que les cheveux et les ongles qu'il avait conservés du Prophète soient placés dans sa bouche, son nez, ses yeux et ses oreilles (source: al-bidaya-wal-nihaya, vol. 4, p. 512). Il mourut à Damas en Rajab de l'an 60. Les rapports divergent quant à savoir si Yazid ou al-Dahhak ibn Qays ont prié sur lui, et la plupart situent sa tombe à Bab al-Saghir {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}."
  tr: "Ölüm döşeğinde Muaviye, servetinin yarısını devlet hazinesine vasiyet etti (bkz. el-Bidaya-wal-Nihaya, cilt 4, s. 511). El-Vakidi'nin rivayetine göre, oğlu Yezid'e insanlara nazik davranmasını, tavsiye almasını, soylu ailelere saygı göstermesini ve Suriye ile Hicaz halkının şerefini korumasını öğütledi (bkz. el-Bidaya-wal-Nihaya, cilt 4, s. 600). Ayrıca, Peygamber'in kendisine verdiği bir giysiyle kefenlenmesini ve saç ve tırnak parçalarının ağzına, burnuna, gözlerine ve kulaklarına konulmasını emretti (bkz. el-Bidaya-wal-Nihaya, cilt 4, s. 512). Hicri 60 yılının Receb ayında Şam'da vefat etti. Farklı rivayetlere göre oğlu Yezid veya el-Dahhak ibn Kays cenaze namazını kıldırdı. Çoğunluk görüşüne göre Bab el-Saghir yakınlarına gömülmüştür (bkz. el-bidaya-wal-nihaya tarama cilt 4, s. 512)."
  id: "Di ranjang kematiannya, Mu'awiya mewariskan setengah dari kekayaannya kepada kas negara (lihat al-bidaya-wal-nihaya jilid 4 hlm. 511). Ia menasihati putranya, Yazid, untuk memperlakukan orang dengan baik, meminta nasihat, menghormati orang-orang dari keturunan bangsawan, dan menjaga kehormatan rakyat Suriah dan Hijaz, menurut catatan al-Waqidi (lihat al-bidaya-wal-nihaya jilid 4 hlm. 600). Ia juga memerintahkan agar jenazahnya dikafani dengan kain yang diberikan Nabi kepadanya, dan agar potongan rambut dan kukunya diletakkan di mulut, hidung, mata, dan telinganya (lihat al-bidaya-wal-nihaya jilid 4 hlm. 512). Ia meninggal di Damaskus pada bulan Rajab tahun 60 Hijriah. Putranya, Yazid atau al-Dahhak ibn Qays, menurut berbagai catatan, memimpin salat jenazah. Menurut pendapat mayoritas, beliau dimakamkan di dekat Bab al-Saghir (lihat al-bidaya-wal-nihaya scan vol. 4 hal. 512)."
