id: event/shayatin-turned-servants-from-hanifiyya
kind: other
label:
  ar: أتتهم الشياطين فاجتالتهم عن دينهم
  en: The shayatin came to them and turned them from their religion
  ur: شیاطین ان کے پاس آئے اور انہیں اپنے دین سے ہٹایا
  es: "Los shayatin vinieron a ellos y los apartaron de su religión."
  fr: "Les démons vinrent à eux et les détournèrent de leur religion."
  tr: "Şeytanlar onlara geldi ve onları dinlerinden saptırdı."
  id: "Setan-setan datang kepada mereka dan menyesatkan mereka dari agama mereka."
summary:
  ar: 'في الحديث القدسي: إني خلقت عبادي حنفاء كلهم، وإنهم أتتهم الشياطين فاجتالتهم عن دينهم وحرمت عليهم ما أحللت لهم وأمرتهم أن يشركوا بي ما لم أنزل به سلطانا {cite:sahih-muslim} [[passage/muslim-2865|مسلم 2865]].'
  en: 'In the hadith qudsi: I created My servants hanif, all of them; but the shayatin came to them and turned them from their religion, forbade them what I permitted them, and ordered them to associate partners with Me without authority sent down by Me {cite:sahih-muslim} [[passage/muslim-2865|Muslim 2865]].'
  ur: 'حدیث قدسی میں: میں نے اپنے بندوں کو سب حنیف پیدا کیا، لیکن شیاطین ان کے پاس آئے اور انہیں اپنے دین سے ہٹایا، اور ان پر وہ حرام کیا جو میں نے حلال کیا تھا، اور انہیں میرے ساتھ شریک ٹھیرا کر حکم دیا جو میں نے نہیں نازل کیا تھا {cite:sahih-muslim} [[passage/muslim-2865|مسلم 2865]]۔'
  es: "En el hadiz qudsi: Creé a Mis siervos hanif, a todos ellos; pero los shayatin vinieron a ellos y los apartaron de su religión, les prohibieron lo que les permití y les ordenaron asociar copartícipes conmigo sin autoridad enviada por Mí {cite:sahih-muslim} [[passage/muslim-2865|Muslim 2865]]."
  fr: "Dans le hadith qudsi: J'ai créé Mes serviteurs hanif, tous; mais les shayatin sont venus à eux et les ont détournés de leur religion, leur ont interdit ce que Je leur avais permis, et leur ont ordonné d'associer à Moi des partenaires sans autorité révélée par Moi {cite:sahih-muslim} [[passage/muslim-2865|Muslim 2865])."
  tr: "Hadis-i Kudsi'de şöyle buyurulmaktadır: \"Ben bütün kullarımı tevhid ehli olarak yarattım, fakat cinler onlara gelip dinlerinden saptırdılar, onlara helal kıldığım şeyleri haram kıldılar ve bana ortak koşmalarını emrettiler ki, ben onlara hiçbir şekilde böyle bir emir indirmemiştim.\" {sahih-müslim} [[pasaj/müslim-2865|Müslim 2865]]."
  id: "Dalam Hadits Qudsi: Aku menciptakan semua hamba-Ku sebagai orang-orang yang beriman kepada Allah, tetapi setan-setan datang kepada mereka dan menyesatkan mereka dari agama mereka dan mengharamkan bagi mereka apa yang telah Aku halalkan bagi mereka dan memerintahkan mereka untuk menyekutukan-Ku dengan sesuatu yang tidak Aku turunkan buktinya. {cite:sahih-muslim} [[passage/muslim-2865|Muslim 2865]]."
