id: event/shayatin-turned-servants-from-hanifiyya
kind: other
label:
  ar: أتتهم الشياطين فاجتالتهم عن دينهم
  en: The shayatin came to them and turned them from their religion
  ur: شیاطین ان کے پاس آئے اور انہیں اپنے دین سے ہٹایا
summary:
  ar: 'في الحديث القدسي: إني خلقت عبادي حنفاء كلهم، وإنهم أتتهم الشياطين فاجتالتهم عن دينهم وحرمت عليهم ما أحللت لهم وأمرتهم أن يشركوا بي ما لم أنزل به سلطانا {cite:sahih-muslim} [[passage/muslim-2865|مسلم 2865]].'
  en: 'In the hadith qudsi: I created My servants hanif, all of them; but the shayatin came to them and turned them from their religion, forbade them what I permitted them, and ordered them to associate partners with Me without authority sent down by Me {cite:sahih-muslim} [[passage/muslim-2865|Muslim 2865]].'
  ur: 'حدیث قدسی میں: میں نے اپنے بندوں کو سب حنیف پیدا کیا، لیکن شیاطین ان کے پاس آئے اور انہیں اپنے دین سے ہٹایا، اور ان پر وہ حرام کیا جو میں نے حلال کیا تھا، اور انہیں میرے ساتھ شریک ٹھیرا کر حکم دیا جو میں نے نہیں نازل کیا تھا {cite:sahih-muslim} [[passage/muslim-2865|مسلم 2865]]۔'
