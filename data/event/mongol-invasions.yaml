  es: "Boceto de ficha para las invasiones y conquistas mongolas, la sucesión de campañas desde Gengis Kan hasta Tamerlán que arrasaron el mundo islámico y pusieron fin al califato abasí en Bagdad en 1258; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche sur les invasions et conquêtes mongoles, la succession de campagnes de Gengis Khan à Timour qui ont balayé le monde islamique et mis fin au califat abbasside à Bagdad en 1258; ses sources ne sont pas encore vérifiées sur la page."
  ur: "منگول حملوں اور فتوحات کے لیے ڈرافٹ کارڈ، چنگیز خان سے تیمور تک کی مہمات کی جانشینی جس نے اسلامی دنیا کو اپنی لپیٹ میں لے لیا اور 1258 میں بغداد میں عباسی خلافت کا خاتمہ کیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
