  ar: "بطاقة أولية للغزوات المغولية، سلسلة الفتوحات التي اجتاحت العالم الإسلامي من جنكيز خان حتى تيمور وأسقطت الخلافة العباسية في بغداد سنة ١٢٥٨م؛ لم تُراجع مصادره على الصفحة بعد."
