id: event/ibn-asakir-hajj-521
class: event
kind: pilgrimage
label:
  ar: "حج ابن عساكر وسماعه بمكة والكوفة في طريق العودة، ٥٢١هـ/١١٢٧م"
  en: "Ibn 'Asakir's hajj and hearings at Mecca and Kufa on the way back, 521/1127"
  ur: "ابن عساکر کا حج اور مکہ و کوفہ میں سماعت، واپسی کے سفر میں، 521ھ/1127ء"
summary:
  ar: "حج ابن عساكر في سنة إحدى وعشرين، فسمع بمكة من عبد الله بن محمد بن الغزال المصري صاحب كريمة المروزية، وسمع بالكوفة من عمر بن إبراهيم العلوي {cite:tarikh-islam-dhahabi p. 71}؛ وأمضى زمناً بمكة والمدينة ونزل الكوفة في رجوعه إلى بغداد {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "In 521 Ibn 'Asakir made the pilgrimage; at Mecca he heard 'Abdallah ibn Muhammad ibn al-Ghazzal al-Misri, pupil of Karima al-Marwaziyya, and at Kufa he heard 'Umar ibn Ibrahim al-'Alawi {cite:tarikh-islam-dhahabi p. 71}; he passed some time at Mecca and Medina and stopped at Kufa on his way back to Baghdad {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "521ھ میں ابن عساکر نے حج کیا؛ مکہ میں عبداللہ بن محمد بن الغزال مصری — شاگردِ کریمہ مروزیہ — سے اور کوفہ میں عمر بن ابراہیم علوی سے سماعت کی {cite:tarikh-islam-dhahabi p. 71}؛ بغداد واپسی پر مکہ و مدینہ میں کچھ وقت گزارا اور راستے میں کوفہ ٹھہرا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
