id: "event/abu-al-qasim-withdraws-from-sanaa-on-his-fathers-order-in-shawwal-297-ah-and-qarmatians-reenter"
class: event
kind: other
label:
  ar: "ينصرف أبو القاسم عن صنعاء بأمر أبيه في شوال سنة 297هـ، فيدخلها القرامطة، ص395"
  en: "Abu al-Qasim withdraws from Sanaa on his father's order in Shawwal 297 AH and the Qarmatians re-enter, p. 395"
  fr: "Abu al-Qasim se retire de Sanaa sur l’ordre de son père en shawwal 297 de l’hégire et les Qarmates y rentrent, p. 395"
  ur: "ابو القاسم والد کے حکم پر شوال 297ھ میں صنعاء چھوڑتے ہیں اور قرامطہ واپس آتے ہیں، ص395"
  es: "Abu al-Qasim se retira de Sanaa por orden de su padre en Shawwal 297 AH y los cármatas regresan, pág. 395"
  tr: "Ebu el-Kâsım, babasının emriyle Hicri 297 yılının Şevval ayında Sana'a'dan ayrıldı ve Karmatiler şehre girdi. (s. 395)"
  id: "Abu al-Qasim meninggalkan Sana'a atas perintah ayahnya pada bulan Syawal tahun 297 Hijriah, dan kaum Qarmatian memasuki kota itu. (hlm. 395)"
summary:
  ar: "ينصرف أبو القاسم عن صنعاء بأمر أبيه يوم السبت لاثنتي عشرة ليلة خلت من شوال سنة 297هـ، فيدخلها القرامطة من شبام، ويقيمون بها أربعة عشر يوما، ولا يجدون بها أحدا."
  en: "On his father's order Abu al-Qasim leaves Sanaa on Saturday, twelve nights into Shawwal 297 AH, so that he would not be fighting Ibn Kayyala and the Qarmatians at once. The Qarmatians from Shiban re-enter the city and stay fourteen days, finding no one there, the book says."
  fr: "Sur l’ordre de son père, Abu al-Qasim quitte Sanaa le samedi, douze nuits après le début de shawwal 297 de l’hégire, pour ne pas combattre à la fois Ibn Kayyala et les Qarmates. Les Qarmates venus de Shiban rentrent dans la ville, y restent quatorze jours et n’y trouvent personne, selon le livre."
  ur: "والد کے حکم پر ابو القاسم شوال 297ھ کی بارہ راتیں گزرنے پر ہفتے کے دن صنعاء چھوڑ دیتے ہیں، تاکہ ابن کیالہ اور قرامطہ دونوں سے بیک وقت لڑنا نہ پڑے۔ شبام کے قرامطہ شہر میں دوبارہ داخل ہو کر چودہ دن ٹھہرتے ہیں اور کتاب کے مطابق وہاں کسی کو نہیں پاتے۔"
  es: "Por orden de su padre, Abu al-Qasim abandona Saná el sábado, doce noches después del inicio de Shawwal del año 297 de la Hégira, para no tener que enfrentarse a Ibn Kayyala y a los cármatas de inmediato. Los cármatas de Shiban regresan a la ciudad y permanecen allí catorce días, sin encontrar a nadie, según relata el libro."
  tr: "Ebu el-Kâsim, babasının emriyle Hicri 297 yılında Şevval ayının bitimine on iki gece kala Cumartesi günü Sana'a'dan ayrıldı. Karmatiler Şibam'dan şehre girdiler ve on dört gün orada kaldılar, ancak orada kimseyi bulamadılar."
  id: "Abu al-Qasim berangkat dari Sana'a atas perintah ayahnya pada hari Sabtu, dua belas malam sebelum berakhirnya bulan Syawal tahun 297 Hijriah. Kaum Qarmatian memasuki kota itu dari Shibam dan tinggal di sana selama empat belas hari, tetapi mereka tidak menemukan siapa pun di sana."
