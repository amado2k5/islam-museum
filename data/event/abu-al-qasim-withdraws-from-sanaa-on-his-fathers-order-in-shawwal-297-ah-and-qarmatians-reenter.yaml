label:
  ar: "ينصرف أبو القاسم عن صنعاء بأمر أبيه في شوال سنة 297هـ، فيدخلها القرامطة، ص395"
  en: "Abu al-Qasim withdraws from Sanaa on his father's order in Shawwal 297 AH and the Qarmatians re-enter, p. 395"
  ur: "ابو القاسم والد کے حکم پر شوال 297ھ میں صنعاء چھوڑتے ہیں اور قرامطہ واپس آتے ہیں، ص395"
summary:
  ar: "ينصرف أبو القاسم عن صنعاء بأمر أبيه يوم السبت لاثنتي عشرة ليلة خلت من شوال سنة 297هـ، فيدخلها القرامطة من شبام، ويقيمون بها أربعة عشر يوما، ولا يجدون بها أحدا."
  en: "On his father's order Abu al-Qasim leaves Sanaa on Saturday, twelve nights into Shawwal 297 AH, so that he would not be fighting Ibn Kayyala and the Qarmatians at once. The Qarmatians from Shiban re-enter the city and stay fourteen days, finding no one there, the book says."
  ur: "والد کے حکم پر ابو القاسم شوال 297ھ کی بارہ راتیں گزرنے پر ہفتے کے دن صنعاء چھوڑ دیتے ہیں، تاکہ ابن کیالہ اور قرامطہ دونوں سے بیک وقت لڑنا نہ پڑے۔ شبام کے قرامطہ شہر میں دوبارہ داخل ہو کر چودہ دن ٹھہرتے ہیں اور کتاب کے مطابق وہاں کسی کو نہیں پاتے۔"
