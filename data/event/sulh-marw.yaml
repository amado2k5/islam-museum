id: event/sulh-marw
class: event
kind: treaty
label: { ar: "صلح مرو", en: "The Marw Sulh", es: "El Marw Sulh", fr: "Le Marw Sulh", ur: "مرو سلح", tr: "Merv'in Barışı", id: "Kedamaian Merv" }
summary:
  ar: "أتى كنازبك مرزبان طوس ابن عامر فصالحه عن طوس على ستمائة ألف درهم وأرسل مرزبان مرو الشاهجان يسأل الصلح فوجه ابن عامر إلى مرو حاتم بن النعمان الباهلي فصالحه على ألفي ألف ومائتي ألف درهم وقال بعضهم ألف ألف درهم ومائتا ألف جريب من بر وشعير وقال بعضهم ألف ألف ومائة ألف أوقية وكان في صلحهم أن يوسعوا للمسلمين في منازلهم وأن عليهم قسمة المال وليس على المسلمين إلا قبض ذلك وكانت مرو صلحاً كلها إلا قرية منها يقال لها السنج فإنها أخذت عنوة وقال أبو عبيدة صالحه على وصائف ووصفاء ودواب ومتاع ولم يكن عند القوم يومئذ عين وكان الخراج كله على ذلك حتى ولي يزيد بن معاوية فصيره مالاً."
  en: "Kanazbak, marzban of Tus, compounded Tus at six hundred thousand; Marw's marzban sent al-Shahijan suing for peace, and Hatim ibn al-Nu'man al-Bahili truced Marw at a million two hundred thousand — others say a million dirhams and two hundred thousand jarib of wheat and barley, or a million one hundred thousand uqiyya — on terms that they widen the Muslims' housing while the tax-division rested on them, the Muslims only collecting. All Marw was sulh save the village called al-Sanj, taken by force. Abu Ubayda has it in wada'if, beasts and goods — no cash then — the whole kharaj on that basis till Yazid ibn Mu'awiya made it money."
  es: "Kanazbak, marzban de Tus, impuso a Tus seiscientos mil; el marzban de Marw envió a al-Shahijan a pedir la paz, y Hatim ibn al-Nu'man al-Bahili pactó con Marw un millón doscientos mil —otros dicen un millón de dirhams y doscientos mil jarib de trigo y cebada, o un millón cien mil uqiyya— con la condición de que ampliaran las viviendas de los musulmanes mientras la división de impuestos recaía sobre ellos, siendo los musulmanes solo quienes recaudaban. Todo Marw era sulh, excepto la aldea llamada al-Sanj, tomada por la fuerza. Abu Ubayda lo sitúa en wada'if, ganado y bienes —no había dinero en efectivo entonces— todo el kharaj sobre esa base hasta que Yazid ibn Mu'awiya lo convirtió en dinero."
  fr: "Kanazbak, marzban de Tus, imposa à Tus une amende de six cent mille dirhams. Le marzban de Marw envoya al-Shahijan demander la paix, et Hatim ibn al-Nu'man al-Bahili conclut une trêve avec Marw pour un million deux cent mille dirhams – d'autres parlent d'un million de dirhams et de deux cent mille jaribs de blé et d'orge, ou encore d'un million cent mille uqiyya – à condition qu'ils agrandissent les logements des musulmans, tandis que la répartition des impôts leur incombait, les musulmans se contentant de les collecter. Tout Marw fut sulh, à l'exception du village d'al-Sanj, pris par la force. Abu Ubayda le mentionne en wada'if (paiement de bétail et de marchandises) – pas d'argent liquide à l'époque – tout le kharaj étant ainsi payé jusqu'à ce que Yazid ibn Mu'awiya le transforme en monnaie."
  ur: "کنزباک، طوس کے مرزبان نے طوس کو چھ لاکھ میں ملایا۔ مرو کے مرزبن نے شاہیجان کو صلح کے لیے مقدمہ بھیجا، اور حاتم بن النعمان الباہلی نے مرو کو ایک ملین دو لاکھ پر فتح کیا - دوسروں کا کہنا ہے کہ ایک ملین درہم اور دو لاکھ جریب گیہوں اور جو، یا ایک ملین ایک لاکھ اوقیہ - اس شرط پر کہ انہوں نے مسلمانوں کی رہائش کو وسیع کرتے ہوئے، صرف مسلمانوں کے ٹیکس کی وصولی کے لیے ان کو وسیع کیا۔ تمام مرو سلہہ تھا سوائے السنج نامی گاؤں کو، زبردستی چھین لیا گیا۔ ابو عبیدہ کے پاس یہ وداع، حیوانات اور سامان میں موجود ہے - پھر کوئی نقدی نہیں - اس کی بنیاد پر پورا خوارج یہاں تک کہ یزید بن معاویہ نے اسے رقم کردیا۔"
  tr: "Kanazbak, Marzban Tus İbn Amir'e gelerek Tus adına altı yüz bin dirhem karşılığında onunla barış yaptı. Marzban Merv el-Şahjan barış istemek için elçi gönderdi, bunun üzerine İbn Amir, Hatim İbn el-Nu'man el-Bahili'yi Merv'e göndererek onunla iki milyon iki yüz bin dirhem karşılığında barış yaptı. Bazıları bir milyon dirhem ve iki yüz bin jarib buğday ve arpa, bazıları ise bir milyon yüz bin ons dedi. Barış anlaşmaları, evlerinde Müslümanlara yer açmaları ve parayı bölüşmeleri, Müslümanların ise sadece parayı toplamaları şartını içeriyordu. Merv, zorla ele geçirilen el-Sanj adlı bir köy dışında tamamen barış içindeydi. Ebu Ubeyde, onunla kadın hizmetçiler, erkek hizmetçiler, hayvanlar ve mallar karşılığında barış yaptığını söyledi. O zamanlar halkın parası yoktu ve tüm vergiler, Yezid İbn Muaviye yönetimi ele geçirip paraya çevirene kadar buna dayanıyordu."
  id: "Kanazbak datang kepada Marzban Tus Ibn Amir dan berdamai dengannya atas nama Tus dengan imbalan enam ratus ribu dirham. Marzban Marw al-Shahjan mengirim utusan untuk meminta perdamaian, sehingga Ibn Amir mengirim Hatim Ibn al-Nu’man al-Bahili kepada Marw dan berdamai dengannya dengan imbalan dua juta dua ratus ribu dirham. Ada yang mengatakan satu juta dirham dan dua ratus ribu jarib gandum dan jelai. Ada pula yang mengatakan satu juta seratus ribu ons. Perjanjian damai mereka menetapkan bahwa mereka harus menyediakan tempat bagi kaum Muslim di rumah mereka dan bahwa mereka harus membagi uang tersebut, dan kaum Muslim hanya boleh mengambilnya. Marw sepenuhnya berdamai kecuali untuk sebuah desa bernama al-Sanj, yang direbut secara paksa. Abu Ubaidah mengatakan bahwa ia berdamai dengannya dengan imbalan pembantu perempuan, pembantu laki-laki, hewan, dan barang-barang. Orang-orang tidak memiliki uang pada waktu itu, dan semua pajak didasarkan pada hal itu sampai Yazid Ibn Mu’awiyah mengambil alih dan menjadikannya uang."
