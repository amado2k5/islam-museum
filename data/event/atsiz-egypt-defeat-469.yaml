label: { ar: "هزيمة أتسز أمام مصر", en: "Atsiz's defeat before Egypt", fr: "La défaite d'Atsiz devant l'Égypte", es: "La derrota de Atsiz ante Egipto", ur: "مصر کے سامنے عطیز کی شکست", tr: "Atz'ın Mısır'a karşı yenilgisi", id: "Kekalahan Atsz melawan Mesir" }
summary:
  ar: "لم يفلح قائد السلاجقة أتسز بن أوق في توحيد بلاد الشام ومصر بعد أن شكل السلاجقة تهديداً فعلياً للدولة الفاطمية داخل مصر؛ فعندما أراد غزوها حلت به الهزيمة على يد قوة من العرب قبل مواجهة الجيش الكبير الذي أعده الوزير بدر الجمالي في رجب ٤٦٩هـ/١٠٧٦م، وأدى فشله إلى مزيد من التشرذم والصراع الدامي لينتهي الأمر بمقتله سنة ١٠٧٨م تقريباً {cite:dawlat-uthmaniyya-salabi p. 34}."
  en: "Atsiz's Egypt gambit collapsed in Rajab 1076 — beaten by an Arab force before Badr al-Jamali's great army even engaged — and the defeat spiralled into the feuds that killed him by 1078 {cite:dawlat-uthmaniyya-salabi p. 34}."
  fr: "L'entreprise d'Atsiz contre l'Égypte s'effondra en Rajab 1076 : battu par une troupe arabe avant même que la grande armée de Badr al-Jamali n'engage le combat, il vit sa défaite dégénérer en querelles qui causèrent sa mort vers 1078 {cite:dawlat-uthmaniyya-salabi p. 34}."
  es: "La arriesgada apuesta de Atsiz por Egipto fracasó en Rajab 1076 —derrotado por una fuerza árabe antes incluso de que el gran ejército de Badr al-Jamali entrara en combate— y la derrota desencadenó las disputas que acabaron con su vida en 1078 {cite:dawlat-uthmaniyya-salabi p. 34}."
  ur: "رجب 1076 میں عطیز کا مصری جوا ٹوٹ گیا - بدر الجمالی کی عظیم فوج کے مشغول ہونے سے پہلے ایک عرب فوج کے ہاتھوں شکست ہوئی - اور شکست ان جھگڑوں میں پھیل گئی جس نے اسے 1078 تک مار ڈالا۔ 34}۔"
  tr: "Selçuklu lideri Atsız ibn Uk, Selçukluların Mısır içindeki Fatımi devletine gerçek bir tehdit oluşturmasının ardından Levant ve Mısır'ı birleştirmeyi başaramadı. Mısır'ı işgal etmek istediğinde, önce Araplardan oluşan bir kuvvet tarafından yenilgiye uğratıldı, ardından da Receb 469 Hicri/1076 Miladi yılında vezir Bedir el-Cemali'nin hazırladığı büyük orduyla karşılaştı. Başarısızlığı, daha fazla parçalanmaya ve kanlı çatışmalara yol açtı ve yaklaşık 1078 Miladi yılında ölümüyle sonuçlandı. {cite:dawlat-uthmaniyya-salabi s. 34}"
  id: "Pemimpin Seljuk, Atsiz ibn Uq, gagal menyatukan Levant dan Mesir setelah Seljuk menimbulkan ancaman nyata bagi negara Fatimiyah di Mesir. Ketika ia ingin menyerang Mesir, ia dikalahkan oleh pasukan Arab sebelum menghadapi pasukan besar yang disiapkan oleh menteri Badr al-Jamali pada bulan Rajab 469 H/1076 M. Kegagalannya menyebabkan perpecahan lebih lanjut dan konflik berdarah, yang berakhir dengan kematiannya sekitar tahun 1078 M. {cite:dawlat-uthmaniyya-salabi p. 34}."
