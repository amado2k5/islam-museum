label: { ar: "مناقلة حلب من الموصل إلى سنجار", en: "The exchange of Aleppo, from Mosul to Sinjar", es: "El intercambio de Alepo, de Mosul a Sinjar.", fr: "L'échange d'Alep, de Mossoul à Sinjar", ur: "حلب کا تبادلہ، موصل سے سنجار تک" }
summary:
  ar: "في رجب سنة سبع وسبعين وخمسمائة توفي الملك الصالح إسماعيل بن نور الدين بحلب وقد أوصى بتسليمها إلى ابن عمه عز الدين مسعود صاحب الموصل دون زوج أخته عماد الدين صاحب سنجار، فدخلها عز الدين في العشرين من شعبان وهرب تقي الدين عمر ابن أخي صلاح الدين من منبج إلى حماة وثار أهلها بشعار عز الدين، وأشار عسكر حلب عليه بقصد دمشق فأبى وقال بيننا يمين فلا نغدر به؛ ثم لجّ عماد الدين يطلب حلب بدل سنجار ويهدد بتسليم سنجار إلى صلاح الدين، فأشار الأمراء بتسليمها وكان أشدهم في ذلك مجاهد الدين قايماز خوفاً من عظمة عز الدين في نفسه، فتسلم عماد الدين حلب وسلم سنجار لأخيه وعاد عز الدين إلى الموصل، وكان صلاح الدين بمصر قد عظم عليه ملك عز الدين حلب فلما بلغه ملك عماد الدين لها خرج من يومه إلى الشام {cite:kamil-ibn-al-athir p. 106-108}."
  en: "In Rajab 577 al-Salih Isma'il ibn Nur al-Din died at Aleppo, having bequeathed it to his cousin Izz al-Din Mas'ud, lord of Mosul, passing over his sister's husband Imad al-Din, lord of Sinjar. Izz al-Din entered Aleppo on 20 Sha'ban. Taqi al-Din Umar, nephew of Salah al-Din, fled from Manbij to Hama, and its people rose under Izz al-Din's emblem. The Aleppo troops urged him to march on Damascus, but he refused, saying 'there is an oath between us, and we shall not betray him.' Imad al-Din then insisted on Aleppo in exchange for Sinjar and threatened to hand Sinjar over to Salah al-Din. The amirs advised yielding Aleppo to him, the most insistent among them being Mujahid al-Din Qaymaz, for fear of Izz al-Din's self-importance. So Imad al-Din took Aleppo and gave Sinjar to his brother, and Izz al-Din returned to Mosul. Salah al-Din in Egypt had found Izz al-Din's possession of Aleppo grievous; when news reached him that Imad al-Din had taken it, he set out for Syria the same day {cite:kamil-ibn-al-athir p. 106-108}."
  es: "En Rajab 577, al-Salih Isma'il ibn Nur al-Din murió en Alepo, tras haberla legado a su primo Izz al-Din Mas'ud, señor de Mosul, pasando por alto al esposo de su hermana, Imad al-Din, señor de Sinjar. Izz al-Din entró en Alepo el 20 de Sha'ban. Taqi al-Din Umar, sobrino de Salah al-Din, huyó de Manbij a Hama, y su gente se sublevó bajo el emblema de Izz al-Din. Las tropas de Alepo le instaron a marchar sobre Damasco, pero él se negó, diciendo: «Hay un juramento entre nosotros, y no lo traicionaremos». Imad al-Din entonces insistió en Alepo a cambio de Sinjar y amenazó con entregar Sinjar a Salah al-Din. Los emires aconsejaron cederle Alepo, siendo Mujahid al-Din Qaymaz el más insistente, por temor a la arrogancia de Izz al-Din. Así pues, Imad al-Din tomó Alepo y entregó Sinjar a su hermano, e Izz al-Din regresó a Mosul. Saladino, en Egipto, consideró grave la posesión de Alepo por parte de Izz al-Din; al enterarse de que Imad al-Din la había tomado, partió hacia Siria ese mismo día {cite:kamil-ibn-al-athir p. 106-108}."
  fr: "En Rajab 577, al-Salih Isma'il ibn Nur al-Din mourut à Alep, après avoir légué la ville à son cousin Izz al-Din Mas'ud, seigneur de Mossoul, au détriment de son beau-frère Imad al-Din, seigneur de Sinjar. Izz al-Din entra à Alep le 20 Sha'ban. Taqi al-Din Umar, neveu de Salah al-Din, s'enfuit de Manbij à Hama, et ses habitants se soulevèrent sous la bannière d'Izz al-Din. Les troupes d'Alep l'exhortèrent à marcher sur Damas, mais il refusa, déclarant: « Nous avons un serment et nous ne le trahirons pas. » Imad al-Din exigea alors Alep en échange de Sinjar et menaça de livrer cette dernière à Salah al-Din. Les émirs conseillèrent de lui céder Alep, le plus insistant étant Mujahid al-Din Qaymaz, par crainte de l'arrogance d'Izz al-Din. Imad al-Din prit donc Alep et confia Sinjar à son frère, tandis qu'Izz al-Din retournait à Mossoul. Saladin, en Égypte, avait trouvé la possession d'Alep par Izz al-Din insupportable; lorsqu'il apprit qu'Imad al-Din s'en était emparé, il partit pour la Syrie le jour même (voir: Kamil ibn al-Athir, p. 106-108)."
  ur: "رجب 577 میں الصالح اسماعیل ابن نورالدین نے حلب میں وفات پائی اور اس کی وصیت اپنے چچا زاد بھائی عزالدین مسعود، موصل کے سردار کو، اپنی بہن کے شوہر عماد الدین، سنجر کے سردار کے پاس سے گزری۔ عزالدین 20 شعبان کو حلب میں داخل ہوا۔ تقی الدین عمر، صلاح الدین کا بھتیجا، منبج سے حما کی طرف بھاگا، اور اس کے لوگ عزالدین کے نشان کے نیچے اٹھ کھڑے ہوئے۔ حلب کے فوجیوں نے اسے دمشق کی طرف مارچ کرنے کی ترغیب دی، لیکن اس نے یہ کہتے ہوئے انکار کر دیا کہ 'ہمارے درمیان حلف ہے، اور ہم اس کے ساتھ غداری نہیں کریں گے۔' عماد الدین نے سنجار کے بدلے حلب پر اصرار کیا اور سنجار کو صلاح الدین کے حوالے کرنے کی دھمکی دی۔ امیروں نے حلب کو اس کے حوالے کرنے کا مشورہ دیا، ان میں سب سے زیادہ اصرار مجاہد الدین قیاماز تھا، عزالدین کی اپنی اہمیت کے خوف سے۔ چنانچہ عماد الدین نے حلب لے لیا اور سنجار اپنے بھائی کو دے دیا، اور عزالدین واپس موصل چلا گیا۔ مصر میں صلاح الدین نے حلب پر عزالدین کے قبضے کو تشویشناک پایا۔ جب اسے خبر پہنچی کہ عماد الدین نے اسے لے لیا ہے تو وہ اسی دن شام کی طرف روانہ ہوا۔ 106-108}۔"
