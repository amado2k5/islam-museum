label: { ar: "مناقلة حلب من الموصل إلى سنجار", en: "The exchange of Aleppo, from Mosul to Sinjar" }
summary:
  ar: "في رجب سنة سبع وسبعين وخمسمائة توفي الملك الصالح إسماعيل بن نور الدين بحلب وقد أوصى بتسليمها إلى ابن عمه عز الدين مسعود صاحب الموصل دون زوج أخته عماد الدين صاحب سنجار، فدخلها عز الدين في العشرين من شعبان وهرب تقي الدين عمر ابن أخي صلاح الدين من منبج إلى حماة وثار أهلها بشعار عز الدين، وأشار عسكر حلب عليه بقصد دمشق فأبى وقال بيننا يمين فلا نغدر به؛ ثم لجّ عماد الدين يطلب حلب بدل سنجار ويهدد بتسليم سنجار إلى صلاح الدين، فأشار الأمراء بتسليمها وكان أشدهم في ذلك مجاهد الدين قايماز خوفاً من عظمة عز الدين في نفسه، فتسلم عماد الدين حلب وسلم سنجار لأخيه وعاد عز الدين إلى الموصل، وكان صلاح الدين بمصر قد عظم عليه ملك عز الدين حلب فلما بلغه ملك عماد الدين لها خرج من يومه إلى الشام {cite:kamil-ibn-al-athir p. 106-108}."
  en: "In Rajab 577 al-Salih Isma'il ibn Nur al-Din died at Aleppo, having bequeathed it to his cousin Izz al-Din Mas'ud, lord of Mosul, passing over his sister's husband Imad al-Din, lord of Sinjar. Izz al-Din entered Aleppo on 20 Sha'ban. Taqi al-Din Umar, nephew of Salah al-Din, fled from Manbij to Hama, and its people rose under Izz al-Din's emblem. The Aleppo troops urged him to march on Damascus, but he refused, saying 'there is an oath between us, and we shall not betray him.' Imad al-Din then insisted on Aleppo in exchange for Sinjar and threatened to hand Sinjar over to Salah al-Din. The amirs advised yielding Aleppo to him, the most insistent among them being Mujahid al-Din Qaymaz, for fear of Izz al-Din's self-importance. So Imad al-Din took Aleppo and gave Sinjar to his brother, and Izz al-Din returned to Mosul. Salah al-Din in Egypt had found Izz al-Din's possession of Aleppo grievous; when news reached him that Imad al-Din had taken it, he set out for Syria the same day {cite:kamil-ibn-al-athir p. 106-108}."
