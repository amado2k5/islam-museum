label: { ar: "ملك الكرج مدينة دوين", en: "The Georgian sack of Dvin (599 AH)" }
summary:
  ar: "في سنة تسع وتسعين وخمسمائة استولى الكرج على مدينة دوين من أذربيجان ونهبوها واستباحوها وأكثروا في أهلها، وكانت هي وجميع بلاد أذربيجان للأمير أبي بكر بن البهلوان، وكان على عادته مشغولاً بالشرب ليلاً ونهاراً لا يفيق ولا ينظر في أمر مملكته ورعيته، وكان أهل تلك البلاد أكثروا الاستغاثة إليه بقصد الكرج بلادهم مرة بعد أخرى فكأنهم ينادون صخرة صماء، فلما طال الحصار ضعف أهلها فأخذهم الكرج عنوة بالسيف؛ يقول ابن الأثير: فقد بلغنا من فعل الكرج بأهل دوين من القتل والسبي ما تقشعر منه الجلود {cite:kamil-ibn-al-athir p. 283-284}."
  en: "599: the Georgians stormed Dvin in Azerbaijan, sacked it and massacred its people — while its Atabeg Abu Bakr ibn al-Pahlawan, the last Eldiguzid ruler of Azerbaijan, 'occupied with drink night and day', ignored years of pleas from the border towns. Ibn al-Athir writes that reports of the killing and enslavement made skins shudder {cite:kamil-ibn-al-athir p. 283-284}."
