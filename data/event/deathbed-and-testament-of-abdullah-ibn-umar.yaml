id: event/deathbed-and-testament-of-abdullah-ibn-umar
class: event
kind: death
label:
  ar: مرض عبد الله بن عمر الأخير ووصيته بمكة
  en: Last illness and testament of Abdallah ibn Umar at Mecca
  ur: مکہ میں عبداللہ بن عمر کی آخری بیماری اور وصیت
  es: "Última enfermedad y testamento de Abdallah ibn Umar en La Meca"
  fr: "Dernière maladie et testament d'Abdallah ibn Umar à La Mecque"
summary:
  ar: "تذكر الكتب أن عبد الله بن عمر أصابه زجّ رمح في قدمه في زحام الحج، وفي رواية أنه من رجل من أصحاب الحجاج، فلما عاده الحجاج قال له إنه هو الذي أصابه لأنه أدخل السلاح الحرم {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. وأوصى ألا يُدفن في الحرم أو أن يُدفن في الحل، فلم يُقدَر على ذلك بسبب الحجاج، فدُفن بمكة، وصلى عليه الحجاج في رواية، وذُكر أن قبره في مقبرة المهاجرين بذي طوى أو بفخ {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. ومما يُروى من ندمه عند الموت أنه لا يأسى على شيء من الدنيا إلا ظمأ الهواجر ومكابدة الليل وأنه لم يقاتل الفئة الباغية {cite:siyar-alam-nubala scan vol. 1 p. 2442}. وعن نافع أنه أعتق ألف إنسان أو أكثر قبل أن يموت {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 206}."
  en: "The books report that Abdallah ibn Umar was struck on the foot by a spearhead in the crush of the pilgrimage, in one account by a man from al-Hajjaj's party, and that when al-Hajjaj visited him he said that al-Hajjaj himself had caused it by letting weapons into the sanctuary {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. He charged that he not be buried in the sanctuary, or that he be buried outside it, but this could not be done because of al-Hajjaj, so he was buried at Mecca, with al-Hajjaj praying over him in one account; his grave is placed in the cemetery of the Emigrants at Dhu Tuwa or at Fakhkh {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. As his words of regret at death it is reported that he grieved over nothing of the world except thirst in noonday heat, the labour of the night prayer, and not having fought the rebellious party {cite:siyar-alam-nubala scan vol. 1 p. 2442}. Nafi reports that he freed a thousand people or more before he died {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 206}."
  ur: "کتابیں بتاتی ہیں کہ حج کے ہجوم میں عبداللہ بن عمر کے پاؤں پر نیزے کی انی لگی، ایک روایت میں حجاج کے ساتھیوں میں سے کسی سے، اور جب حجاج عیادت کو آیا تو انھوں نے کہا کہ وہی اس کا سبب ہے کیونکہ اس نے حرم میں ہتھیار آنے دیے {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. انھوں نے وصیت کی کہ انھیں حرم میں دفن نہ کیا جائے یا حِل میں دفن کیا جائے، لیکن حجاج کے سبب ایسا نہ ہو سکا اور وہ مکہ میں دفن ہوئے، ایک روایت میں حجاج نے ان کی نماز پڑھائی؛ ان کی قبر ذی طویٰ کے مہاجرین کے قبرستان یا فخ میں بتائی جاتی ہے {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. موت کے وقت ان کے اظہارِ افسوس کے بارے میں روایت ہے کہ انھیں دنیا کی کسی چیز پر افسوس نہیں سوائے دوپہر کی پیاس، رات کی مشقت اور اس کے کہ انھوں نے باغی گروہ سے جنگ نہ کی {cite:siyar-alam-nubala scan vol. 1 p. 2442}. نافع بتاتے ہیں کہ وفات سے پہلے انھوں نے ایک ہزار یا زیادہ انسان آزاد کیے {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 206}."
  es: "Los libros informan que Abdallah ibn Umar fue golpeado en el pie por una punta de lanza en la estampida de la peregrinación, en un relato por un hombre del grupo de al-Hajjaj, y que cuando al-Hajjaj lo visitó dijo que al-Hajjaj mismo lo había causado al permitir armas en el santuario {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. Exigió que no lo enterraran en el santuario, o que lo enterraran fuera de él, pero esto no se pudo hacer debido a al-Hajjaj, por lo que fue enterrado en La Meca, con al-Hajjaj orando por él en un relato; su tumba está ubicada en el cementerio de los Emigrantes en Dhu Tuwa o en Fakhkh {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 pág. 229} {cita:isti-ab-ibn-abd-al-barr escaneo vol. 3 pág. 420}. En cuanto a sus palabras de arrepentimiento al morir, se informa que no se lamentó por nada del mundo excepto la sed en el calor del mediodía, el trabajo de la oración nocturna y no haber luchado contra el partido rebelde {cita:siyar-alam-nubala escaneo vol. 1 pág. 2442}. Nafi informa que liberó a mil personas o más antes de morir {cita:sifat-al-safwa-tartusi-2012 escaneo vol. 1 pág. 206}."
  fr: "Les livres rapportent qu'Abdallah ibn Umar fut frappé au pied par une pointe de lance dans la cohue du pèlerinage, selon un récit d'un homme du groupe d'al-Hajjaj, et que lorsque al-Hajjaj lui rendit visite, il dit qu'al-Hajjaj lui-même en était la cause, ayant laissé entrer des armes dans le sanctuaire {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. Il exigea qu'on ne l'enterre pas dans le sanctuaire, ou qu'on l'enterre à l'extérieur, mais cela était impossible à cause d'al-Hajjaj; il fut donc enterré à La Mecque, et al-Hajjaj pria sur lui, selon un récit. Sa tombe se trouve au cimetière des Émigrants à Dhu Tuwa ou à Fakhkh {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 229} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 420}. On rapporte que, dans ses derniers regrets, il déclara n'avoir éprouvé de chagrin que la soif sous la chaleur de midi, la peine de la prière nocturne et le regret de ne pas avoir combattu le parti rebelle {cite:siyar-alam-nubala scan vol. 1 p. 2442}. Nafi rapporte qu'il a libéré un millier de personnes, voire plus, avant de mourir {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 206}."
