label: { ar: "مناظرة ابن عباس للخوارج", en: "Ibn Abbas's Debate with the Khawarij", es: "El debate de Ibn Abbas con los jariyíes", fr: "Le débat d'Ibn Abbas avec les Kharijites", ur: "ابن عباس کا خوارج سے مناظرہ", tr: "İbn Abbas'ın Haricilerle tartışması", id: "Debat Ibnu Abbas dengan kaum Kharijites" }
summary:
  ar: "بعث علي بن أبي طالب إلى الخوارج بحروراء [[person/abdullah-ibn-abbas|عبد الله بن عباس]] يحاجّهم بعد أن أخذوا يقرؤون القرآن ويفتون الناس به، فخرج إليهم في عمامة حمراء ورداء وقال لهم: جئتكم من عند ابن عم رسول الله ألقى إليهم محاجّة القرآن {cite:musnad-ahmad 1/342-343}. سألهم: ما نقمتم على ابن عم رسول الله؟ فقالوا ثلاثاً: حكّم الرجال في دين الله، وقاتل ولم يسبِ ولم يغنم، ومحا نفسه من أمير المؤمنين. فأجابهم واحدة واحدة بالقرآن: التحكيم كحكم الرجلين في الصيد على الحرم وفي المرأة المشاققة؛ ولم يقاتلوا فئة باغية يقتلها إلا وقد نهى عن المثلة؛ ونزع اللقب فقال: أنا أسهل من نبيكم وقد رضيتم له بأن يكتب محمد رسول الله يوم الحديبية، ومحاها المشركون فكتب محمد بن عبد الله. فرجع منهم ألفان فدخلوا في جيش علي، وبقي ستة آلاف فضلّوا وقتلوا في النهروان {cite:al-bidaya-wal-nihaya 7/283-284}."
  en: "Ali ibn Abi Talib sent [[person/abdullah-ibn-abbas|Abdallah ibn Abbas]] to argue with the Khawarij at Harura after they had taken to reading the Qur'an and pronouncing judgement on the people by it. He went out to them in a red turban and cloak and said: I come to you from the cousin of the Messenger of God, and engaged them in Qur'anic disputation {cite:musnad-ahmad 1/342-343}. He asked: what do you hold against the cousin of the Messenger of God? They said three things: he let men arbitrate in God's religion; he fought without taking captives or spoils; and he struck the title Commander of the Faithful from his name. He answered each from the Qur'an: arbitration like the two men who judge an offering for a game killed while consecrated and the arbitrators appointed over a quarrelling couple; the enemy he fought were a rebellious faction whose slain were not mutilated; and on the title he said he was easier to satisfy than God's Prophet, for you accepted 'Muhammad the Messenger of God' written at al-Hudaybiyya, which the polytheists erased to 'Muhammad son of Abdallah'. Two thousand of them returned and entered Ali's army; six thousand held out and were killed at al-Nahrawan {cite:al-bidaya-wal-nihaya 7/283-284}."
  es: "Ali ibn Abi Talib envió a [[person/abdullah-ibn-abbas|Abdallah ibn Abbas]] a discutir con los jariyíes en Harura después de que estos se hubieran dedicado a leer el Corán y a pronunciar juicios sobre la gente basándose en él. Salió a su encuentro con un turbante y una capa rojos y dijo: Vengo a vosotros de parte del primo del Mensajero de Dios, y los entabló una disputa coránica {cite:musnad-ahmad 1/342-343}. Preguntó: ¿Qué tenéis en contra del primo del Mensajero de Dios? Dijeron tres cosas: que dejó que los hombres arbitraran en la religión de Dios; que luchó sin tomar cautivos ni botín; y que eliminó el título de Comandante de los Creyentes de su nombre. Respondió a cada una con el Corán: arbitraje como los dos hombres que juzgan una ofrenda por un animal cazado consagrado y los árbitros designados sobre una pareja que discute; El enemigo contra el que luchó era una facción rebelde cuyos muertos no fueron mutilados; y sobre el título dijo que era más fácil de complacer que el Profeta de Dios, pues aceptasteis «Mahoma el Mensajero de Dios» escrito en al-Hudaybiyya, que los politeístas borraron y pusieron «Mahoma hijo de Abdallah». Dos mil de ellos regresaron y se unieron al ejército de Ali; seis mil resistieron y murieron en al-Nahrawan {cite:al-bidaya-wal-nihaya 7/283-284}."
  fr: "Ali ibn Abi Talib envoya Abdallah ibn Abbas discuter avec les Kharijites à Harura, car ceux-ci s'étaient mis à lire le Coran et à prononcer des jugements sur le peuple en s'appuyant dessus. Il se présenta à eux, coiffé d'un turban rouge et vêtu d'un manteau, et leur dit: « Je viens à vous de la part du cousin du Messager de Dieu. » Il engagea alors avec eux une discussion coranique (voir Musnad-Ahmad 1/342-343). Il leur demanda: « Qu'avez-vous à reprocher au cousin du Messager de Dieu ? » Ils évoquèrent trois points: il laissait les hommes arbitrer en matière de religion; il combattait sans faire de prisonniers ni de butin; et il renonçait au titre de Commandeur des Croyants. Il répondit à chacun d'eux en se basant sur le Coran: « L'arbitrage est semblable à celui des deux hommes qui jugent le sacrifice d'un gibier abattu après avoir été consacré, et aux arbitres désignés pour un couple en conflit; L'ennemi qu'il combattit était une faction rebelle dont les morts ne furent pas mutilés; et concernant le titre, il déclara qu'il était plus facile à satisfaire que le Prophète de Dieu, car vous aviez accepté « Muhammad, le Messager de Dieu » inscrit à al-Hudaybiyya, que les polythéistes avaient effacé pour y inscrire « Muhammad, fils d'Abdallah ». Deux mille d'entre eux revinrent et rejoignirent l'armée d'Ali; six mille résistèrent et furent tués à al-Nahrawan (voir: al-bidaya-wal-nihaya 7/283-284)."
  ur: "علی ابن ابی طالب نے [[شخص/عبداللہ-بن-عباس|عبداللہ ابن عباس]] کو حررہ میں خوارج کے ساتھ بحث کرنے کے لیے بھیجا جب وہ قرآن پڑھنے اور اس کے ذریعے لوگوں پر فیصلہ سنانے کا ارادہ کر چکے تھے۔ وہ سرخ عمامہ اور چادر میں ان کے پاس آیا اور کہا: میں آپ کے پاس رسول اللہ کے چچا زاد بھائی کی طرف سے آیا ہوں، اور ان سے قرآنی جھگڑا کیا ⁦(حوالہ: مسند احمد ۱/۳۴۲-۳۴۳)⁩ اس نے پوچھا: رسول اللہ کے چچا زاد بھائی سے آپ کی کیا رائے ہے؟ انہوں نے تین باتیں کہی ہیں: اس نے لوگوں کو خدا کے دین میں ثالثی کرنے دیا۔ وہ قیدیوں یا مال غنیمت کے بغیر لڑا؛ اور اس نے اپنے نام سے کمانڈر آف دی فیتھفول کا خطاب مارا۔ اس نے قرآن سے ہر ایک کا جواب دیا: ثالثی جیسا کہ دو آدمی جو ایک کھیل کے لیے قربانی کا فیصلہ کرتے ہیں جب کہ تقدیس کی حالت میں قتل کیا جاتا ہے اور ایک جھگڑا کرنے والے جوڑے پر ثالث مقرر کیا جاتا ہے۔ وہ جس دشمن سے لڑا وہ ایک باغی گروہ تھا جس کے مقتول کو مسخ نہیں کیا گیا تھا۔ اور اس عنوان پر انہوں نے کہا کہ وہ خدا کے نبی سے زیادہ آسان ہیں، کیونکہ آپ نے الحدیبیہ میں لکھا ہوا 'محمد رسول اللہ' قبول کیا، جسے مشرکین نے 'محمد ابن عبداللہ' کے لیے مٹا دیا۔ ان میں سے دو ہزار واپس آئے اور علی کے لشکر میں داخل ہو گئے۔ چھ ہزار کو النہروان میں گرفتار کیا گیا اور قتل کر دیا گیا {حوالہ: البدایہ والنہایہ 7/283-284}۔"
  tr: "Ali ibn Abi Talib, Kur'an okumaya ve ona dayanarak dini hükümler vermeye başladıktan sonra Harura'daki Haricilere Abdullah ibn Abbas'a bir mesaj gönderdi. Kırmızı bir sarık ve pelerin giyerek yanlarına gitti ve onlara şöyle dedi: \"Size Allah Resulü'nün kuzeninden geldim, onlara Kur'an'ın delillerini sunmak için.\" {cite:musnad-ahmad 1/342-343}. Onlara sordu: \"Allah Resulü'nün kuzenine karşı şikayetiniz nedir?\" Üç şey söylediler: \"Din işlerinde insanları kadı olarak atadı, savaştı ama esir veya savaş ganimeti almadı ve Müminlerin Komutanı unvanını kaldırdı.\" Onlara Kur'an'dan ayetlerle tek tek cevap verdi: “Tahkim, kutsal mekânda avlanma veya isyankar bir kadın konusunda iki adamın hükmü gibidir; isyankar bir grupla savaşmadılar ve onları öldürmediler, ancak sakatlamayı yasakladıktan sonra; ve unvanı kaldırdı, şöyle dedi: ‘Ben sizin Peygamberinizden daha müsamahalıyım ve siz Hudeybiye günü onun “Muhammed, Allah'ın Elçisi” yazmasına razı oldunuz, fakat müşrikler onu sildi ve “Muhammed ibn Abdullah” yazdılar.’” Onlardan iki bini geri döndü ve Ali'nin ordusuna katıldı, altı bini ise kaldı, sapkınlığa düştü ve Nahravan'da öldürüldü. {al-bidaya-wal-nihaya 7/283-284}"
  id: "Ali ibn Abi Talib mengirim pesan kepada kaum Kharijites di Harura, [[person/abdullah-ibn-abbas|Abdullah ibn Abbas]], untuk berdebat dengan mereka setelah mereka mulai membaca Al-Quran dan mengeluarkan fatwa agama berdasarkan Al-Quran. Dia keluar menemui mereka dengan mengenakan sorban merah dan jubah dan berkata kepada mereka: “Aku datang kepada kalian dari sepupu Rasulullah, untuk menyampaikan kepada mereka argumen-argumen Al-Quran.” {cite:musnad-ahmad 1/342-343}. Dia bertanya kepada mereka: “Apa keluhan kalian terhadap sepupu Rasulullah?” Mereka mengatakan tiga hal: “Dia mengangkat orang sebagai hakim dalam masalah agama, dia berperang tetapi tidak mengambil tawanan atau rampasan perang, dan dia mencabut gelarnya sebagai Amirul Mukminin.” Dia menjawab mereka satu per satu dengan ayat-ayat dari Al-Quran: “Penengahan itu seperti keputusan dua orang mengenai perburuan di dalam tempat suci atau perempuan yang durhaka; mereka tidak memerangi kelompok pemberontak dan membunuh mereka kecuali setelah dia melarang mutilasi; dan dia menghapus gelar itu, seraya berkata: ‘Aku lebih lunak daripada Nabi kalian, dan kalian puas jika beliau menulis “Muhammad, Rasulullah” pada hari Hudaybiyyah, tetapi kaum musyrik menghapusnya dan menulis “Muhammad bin Abdullah.”’” Dua ribu dari mereka kembali dan bergabung dengan pasukan Ali, sementara enam ribu lainnya tetap tinggal dan tersesat serta terbunuh di Nahrawan {kutipan:al-bidaya-wal-nihaya 7/283-284}."
