label: { ar: "الخط الهمايوني", en: "The Khatt-i Humayun (Imperial Rescript)", es: "El Khatt-i Humayun (Rescripto Imperial)", fr: "Le Khatt-i Humayun (rescrit impérial)", ur: "خطِ ہمایوں ⁦(شاہی نسخہ)⁩" }
summary:
  ar: "صدر المرسوم المعروف بالخط الهمايوني عام ١٨٥٦م مؤكداً باسم السلطان عبد المجيد الأول مبادئ خط كلخانة وزائداً امتيازات وحصانات لرعايا الدولة غير المسلمين، وكان أكثر جرأة من الأول وأكثر اندفاعاً نحو الاقتباس من الغرب، وتضمن إلغاء نظام الالتزام والقضاء على الرشوة والفساد، والمساواة في التجنيد بين المسلمين وغير المسلمين، ومعاملة جميع رعايا الدولة معاملة متساوية مهما كانت أديانهم ومذاهبهم {cite:dawlat-uthmaniyya-salabi p. 376}."
  en: "The 1856 Reform Edict (Khatt-i Hümayun): Abdülmecid's decree confirming Gülhane and going further — abolishing tax-farming, equal conscription and equal treatment for every Ottoman subject whatever their faith {cite:dawlat-uthmaniyya-salabi p. 376}."
  es: "El Edicto de Reforma de 1856 (Khatt-i Hümayun): Decreto de Abdülmecid que confirma a Gülhane y va más allá: abole la recaudación de impuestos, el servicio militar obligatorio igualitario y el trato igualitario para todos los súbditos otomanos, independientemente de su fe {cite:dawlat-uthmaniyya-salabi p. 376}."
  fr: "L'édit de réforme de 1856 (Khatt-i Hümayun): décret d'Abdülmecid confirmant le Gülhane et allant plus loin — abolissant la ferme fiscale, la conscription égale et le traitement égal pour chaque sujet ottoman quelle que soit sa foi {cite:dawlat-uthmaniyya-salabi p. 376}."
  ur: "1856 کا اصلاحاتی حکم ⁦(خطِ ہمایوں)⁩: عبدالمصد کا فرمان گلہانے کی تصدیق کرتا ہے اور مزید آگے بڑھتا ہے - ٹیکس کاشتکاری کو ختم کرنا، یکساں بھرتی اور ہر عثمانی رعایا کے ساتھ یکساں سلوک جو بھی ان کا عقیدہ ہو۔ 376}۔"
