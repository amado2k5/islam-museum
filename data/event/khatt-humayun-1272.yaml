summary:
  ar: "صدر المرسوم المعروف بالخط الهمايوني عام ١٨٥٦م مؤكداً باسم السلطان عبد المجيد الأول مبادئ خط كلخانة وزائداً امتيازات وحصانات لرعايا الدولة غير المسلمين، وكان أكثر جرأة من الأول وأكثر اندفاعاً نحو الاقتباس من الغرب، وتضمن إلغاء نظام الالتزام والقضاء على الرشوة والفساد، والمساواة في التجنيد بين المسلمين وغير المسلمين، ومعاملة جميع رعايا الدولة معاملة متساوية مهما كانت أديانهم ومذاهبهم {cite:dawlat-uthmaniyya-salabi p. 376}."
