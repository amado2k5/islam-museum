id: event/killing-of-asma-bint-marwan
class: event
kind: death
label: { ar: "غزوة عمير بن عدي الخطمي لقتل عصماء بنت مروان", en: "Umayr ibn Adi al-Khatmi's mission to kill Asma' bint Marwan" }
summary:
  ar: "يروي ابن إسحاق عن عبد الله بن الحارث بن الفضيل عن أبيه أن عصماء بنت مروان، من بني أمية بن زيد وكانت تحت يزيد بن زيد الخطمي، نافقت بعد قتل أبي عفك وقالت شعراً تعيب فيه الإسلام وأهله وتحرّض على النبي، فأجابها حسان بن ثابت؛ فقال النبي حين بلغه: ألا آخذ لي من ابنة مروان؟ فسمعه عمير بن عدي الخطمي فسرى عليها في بيتها ليلاً فقتلها، فقال له النبي: نصرت الله ورسوله يا عمير، ولا ينتطح فيها عنزان؛ ويقول ابن إسحاق إن ذلك اليوم كان أول ما عزّ الإسلام في دار بني خطمة."
  en: "Ibn Ishaq relates from Abdullah ibn al-Harith ibn al-Fudayl from his father that Asma' bint Marwan, of Banu Umayya ibn Zayd and married to Yazid ibn Zayd of Banu Khatma, showed hypocrisy after Abu Afak's killing and composed verses reviling Islam and its people and inciting against the Prophet, which Hassan ibn Thabit answered; when it reached the Prophet he said 'is there no one to deal with the daughter of Marwan for me?' Umayr ibn Adi al-Khatmi heard him, went to her house that night and killed her, and the Prophet told him 'you have helped God and His Messenger, Umayr', and that no two goats would butt heads over her. Ibn Ishaq says that day was the first on which Islam became strong among Banu Khatma."
