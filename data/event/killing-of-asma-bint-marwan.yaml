id: event/killing-of-asma-bint-marwan
class: event
kind: death
label: { ar: "غزوة عمير بن عدي الخطمي لقتل عصماء بنت مروان", en: "Umayr ibn Adi al-Khatmi's mission to kill Asma' bint Marwan", es: "La misión de Umayr ibn Adi al-Khatmi de matar a Asma' bint Marwan", fr: "La mission d'Umayr ibn Adi al-Khatmi de tuer Asma' bint Marwan", ur: "عمیر بن عدی الخاتمی کا مشن اسماء بنت مروان کو قتل کرنا", tr: "'Umayr ibn' Adi el-Hatmi'nin 'Esma' bint Mervan'ı öldürmek için baskını", id: "Penggerebekan 'Umayr bin 'Adi al-Khatmi untuk membunuh 'Asma' binti Marwan" }
summary:
  ar: "يروي ابن إسحاق عن عبد الله بن الحارث بن الفضيل عن أبيه أن عصماء بنت مروان، من بني أمية بن زيد وكانت تحت يزيد بن زيد الخطمي، نافقت بعد قتل أبي عفك وقالت شعراً تعيب فيه الإسلام وأهله وتحرّض على النبي، فأجابها حسان بن ثابت؛ فقال النبي حين بلغه: ألا آخذ لي من ابنة مروان؟ فسمعه عمير بن عدي الخطمي فسرى عليها في بيتها ليلاً فقتلها، فقال له النبي: نصرت الله ورسوله يا عمير، ولا ينتطح فيها عنزان؛ ويقول ابن إسحاق إن ذلك اليوم كان أول ما عزّ الإسلام في دار بني خطمة."
  en: "Ibn Ishaq relates from Abdullah ibn al-Harith ibn al-Fudayl from his father that Asma' bint Marwan, of Banu Umayya ibn Zayd and married to Yazid ibn Zayd of Banu Khatma, showed hypocrisy after Abu Afak's killing and composed verses reviling Islam and its people and inciting against the Prophet, which Hassan ibn Thabit answered; when it reached the Prophet he said 'is there no one to deal with the daughter of Marwan for me?' Umayr ibn Adi al-Khatmi heard him, went to her house that night and killed her, and the Prophet told him 'you have helped God and His Messenger, Umayr', and that no two goats would butt heads over her. Ibn Ishaq says that day was the first on which Islam became strong among Banu Khatma."
  es: "Ibn Ishaq relata de Abdullah ibn al-Harith ibn al-Fudayl, quien a su vez lo contó de su padre, que Asma' bint Marwan, de Banu Umayya ibn Zayd y casada con Yazid ibn Zayd de Banu Khatma, mostró hipocresía tras el asesinato de Abu Afak y compuso versos que denigraban al Islam y a sus seguidores, e incitaban contra el Profeta. Hassan ibn Thabit respondió a estos versos, y cuando llegaron a oídos del Profeta, este preguntó: \"¿Acaso no hay nadie que se encargue de la hija de Marwan por mí?\". Umayr ibn Adi al-Khatmi lo escuchó, fue a su casa esa noche y la mató. El Profeta le dijo: \"Has ayudado a Dios y a Su Mensajero, Umayr\", y que ni dos cabras se pelearían por ella. Ibn Ishaq afirma que ese día fue el primero en que el Islam se fortaleció entre los Banu Khatma."
  fr: "Ibn Ishaq rapporte d'après Abdullah ibn al-Harith ibn al-Fudayl, qui tenait de son père, qu'Asma' bint Marwan, de la tribu des Banu Umayya ibn Zayd et épouse de Yazid ibn Zayd des Banu Khatma, fit preuve d'hypocrisie après le meurtre d'Abu Afak. Elle composa des versets injurieux envers l'islam et ses fidèles, et incitant à la haine contre le Prophète. Hassan ibn Thabit répondit à ces versets, et lorsque le Prophète en prit connaissance, il demanda: « N'y a-t-il donc personne pour régler le compte de la fille de Marwan ? » Umayr ibn Adi al-Khatmi l'entendit, se rendit chez elle cette nuit-là et la tua. Le Prophète lui dit alors: « Tu as aidé Dieu et Son Messager, Umayr », et que même deux chèvres ne se disputeraient pas son sort. Ibn Ishaq affirme que ce jour fut celui où l'islam se renforça véritablement parmi les Banu Khatma."
  ur: "ابن اسحاق نے عبداللہ بن حارث بن الفضیل سے اپنے والد سے نقل کیا ہے کہ بنو امیہ بن زید کی اسماء بنت مروان اور بنو خطمہ کے یزید بن زید سے شادی کر کے ابو آفاق کے قتل کے بعد نفاق کا مظاہرہ کیا اور ایسی آیات لکھیں جو اسلام میں حسن اور لوگوں کی توہین کرنے والی تھیں۔ جواب دیا؛ جب یہ بات نبی تک پہنچی تو آپ نے فرمایا کیا میرے لیے مروان کی بیٹی کا سودا کرنے والا کوئی نہیں ہے؟ عمیر بن عدی الخطمی نے اسے سنا، اس رات اس کے گھر گئے اور اسے قتل کر دیا، اور نبی نے اس سے کہا کہ تم نے خدا اور اس کے رسول عمیر کی مدد کی ہے، اور یہ کہ کوئی دو بکریاں اس کے سر پر نہیں چڑھیں گی۔ ابن اسحاق کہتے ہیں کہ وہ پہلا دن تھا جس دن بنو خطمہ میں اسلام مضبوط ہوا۔"
  tr: "İbn İshak, Abdullah bin Al-Harith bin Al-Fudayl'den, o da babasından rivayet ettiğine göre, Beni Umayya bin Zayd kabilesinden olan ve Yazid bin Zayd Al-Khatmi ile evli olan Asma bint Mervan, Ebu Afak'ın öldürülmesinden sonra münafık oldu ve İslam'ı ve Müslümanları eleştiren, Peygamber'e karşı kışkırtan şiirler yazdı. Hasan bin Sabit ona karşılık verdi. Peygamber bunu duyunca, \"Mervan'ın kızından intikam almamalı mıyım?\" dedi. Bunun üzerine Umeyr bin Adi Al-Khatmi onu duydu ve geceleyin evine gidip onu öldürdü. Peygamber ona, \"Ey Umeyr, sen Allah'ı ve Resulünü destekledin, bunda bir ihtilaf yoktur\" dedi. İbn İshak, o günün Beni Hatma kabilesinde İslam'ın ilk kez güçlendiği gün olduğunu söyler."
  id: "Ibn Ishaq meriwayatkan dari Abdullah bin Al-Harith bin Al-Fudayl yang meriwayatkan dari ayahnya bahwa Asma’ bint Marwan, dari Bani Umayyah bin Zayd, yang menikah dengan Yazid bin Zayd Al-Khatmi, menjadi munafik setelah pembunuhan Abu Afak dan melantunkan puisi yang mengkritik Islam dan umatnya serta menghasut melawan Nabi. Hassan bin Thabit menanggapinya. Ketika Nabi mendengar hal itu, beliau berkata: Tidakkah aku harus membalas dendam kepada putri Marwan? Kemudian Umayr bin Adi Al-Khatmi mendengarnya dan pergi ke rumahnya pada malam hari dan membunuhnya. Nabi berkata kepadanya: Engkau telah membela Allah dan Rasul-Nya, wahai Umayr, dan tidak ada perselisihan mengenai hal ini. Ibn Ishaq mengatakan bahwa pada hari itu adalah pertama kalinya Islam menjadi kuat di keluarga Bani Khatma."
