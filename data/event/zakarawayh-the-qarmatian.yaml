id: event/zakarawayh-the-qarmatian
class: event
kind: revolt
label: { ar: "خبر زكرويه بن مهرويه القرمطي", en: "Account of Zakarawayh ibn Mihrawayh the Qarmatian", es: "Relato de Zakarawayh ibn Mihrawayh el Qarmatian", fr: "Récit de Zakarawayh ibn Mihrawayh le Qarmate", ur: "زکراویہ بن مہرویح قرمطین کا بیان" }
summary:
  ar: "في سنة أربع وتسعين ومائتين ذكر الطبري خبر زكرويه بن مهرويه القرمطي، وورد الخبر في المحرم أنه ارتحل من نهر المثنية يريد الحاج، وفيها دخول ابن كيغلغ طرسوس غازياً في أول المحرم {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. وعند ابن الجوزي اعترض قوافل الحاج بالعقبة فقتل وسبى وأخذ ما قيمته ألف ألف دينار ثم أخذ القافلة الثانية بالطليح بعد ثلاثة أيام من القتال والعطش، ثم لقيه وصيف بن صوارتكين على طريق خفان فقُتل أصحابه وضُرب ضربة في دماغه فمات بعد خمسة أيام {cite:muntazam-ibn-al-jawzi p. 351-352}."
  en: "In 294 al-Tabari recorded the report of Zakarawayh ibn Mihrawayh the Qarmatian: word came in Muharram that he had set out from Nahr al-Muthanniya aiming at the pilgrims, and that year Ibn Kaghlagh entered Tarsus on a raid at the start of Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. According to Ibn al-Jawzi he intercepted the pilgrim caravans at al-Aqaba, killing, enslaving and taking spoil worth a million dinars; he then seized the second caravan at al-Tulayh after three days of fighting and thirst, and Wasif ibn Sawartekin met him on the Khaffan road, where his companions were killed and he took a blow to the head and died five days later {cite:muntazam-ibn-al-jawzi p. 351-352}."
  es: "En 294, al-Tabari registró el informe de Zakarawayh ibn Mihrawayh el Cármata: llegó la noticia en Muharram de que había partido de Nahr al-Muthanniya con el objetivo de atacar a los peregrinos, y ese año Ibn Kaghlagh entró en Tarso en una incursión al comienzo de Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. Según Ibn al-Jawzi, interceptó las caravanas de peregrinos en al-Aqaba, matando, esclavizando y apoderándose de un botín por valor de un millón de dinares; luego se apoderó de la segunda caravana en al-Tulayh después de tres días de lucha y sed, y Wasif ibn Sawartekin lo encontró en el camino de Khaffan, donde sus compañeros fueron asesinados y él recibió un golpe en la cabeza y murió cinco días después {cite:muntazam-ibn-al-jawzi p. 351-352}."
  fr: "En 294, al-Tabari rapporte le récit de Zakarawayh ibn Mihrawayh le Qarmate: la nouvelle parvint en Muharram qu’il était parti de Nahr al-Muthanniya en direction des pèlerins, et cette même année, Ibn Kaghlagh entra à Tarse lors d’un raid au début de Muharram (cite: Tabari Tarikh Abu al-Fadl, vol. 10, p. 130). Selon Ibn al-Jawzi, il intercepta les caravanes de pèlerins à al-Aqaba, tuant, réduisant en esclavage et s’emparant d’un butin d’une valeur d’un million de dinars; il s’empara ensuite de la seconde caravane à al-Tulayh après trois jours de combats et de soif, et Wasif ibn Sawartekin le rencontra sur la route de Khaffan, où ses compagnons furent tués et où il reçut un coup à la tête et mourut cinq jours plus tard (cite: Muntazam ibn al-Jawzi, p. 351-352)."
  ur: "الطبری نے 294 میں ذکراویہ بن مہرویح قرمطین کی رپورٹ درج کی ہے: محرم میں یہ لفظ آیا کہ وہ نہر المثنیہ سے حاجیوں کی طرف روانہ ہوا تھا، اور اسی سال محرم کے شروع میں ابن قغلغ ایک چھاپہ مار کر ترسس میں داخل ہوا تھا۔ صفحہ 130}۔ ابن الجوزی کے مطابق اس نے عقبہ میں حاجیوں کے قافلوں کو روکا، قتل کیا، غلام بنایا اور دس لاکھ دینار کا مال غنیمت لیا۔ اس نے تین دن کی لڑائی اور پیاس کے بعد الطلیح کے مقام پر دوسرے قافلے پر قبضہ کر لیا اور واصف بن سوارتکین نے اس سے خفان کی سڑک پر ملاقات کی جہاں اس کے ساتھی مارے گئے اور اس کے سر پر ایک ضرب لگ گئی اور پانچ دن بعد اس کی موت ہو گئی۔ 351-352}۔"
