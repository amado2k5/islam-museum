id: event/zakarawayh-the-qarmatian
class: event
kind: revolt
label: { ar: "خبر زكرويه بن مهرويه القرمطي", en: "Account of Zakarawayh ibn Mihrawayh the Qarmatian" }
summary:
  ar: "في سنة أربع وتسعين ومائتين ذكر الطبري خبر زكرويه بن مهرويه القرمطي، وورد الخبر في المحرم أنه ارتحل من نهر المثنية يريد الحاج، وفيها دخول ابن كيغلغ طرسوس غازياً في أول المحرم {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. وعند ابن الجوزي اعترض قوافل الحاج بالعقبة فقتل وسبى وأخذ ما قيمته ألف ألف دينار ثم أخذ القافلة الثانية بالطليح بعد ثلاثة أيام من القتال والعطش، ثم لقيه وصيف بن صوارتكين على طريق خفان فقُتل أصحابه وضُرب ضربة في دماغه فمات بعد خمسة أيام {cite:muntazam-ibn-al-jawzi p. 351-352}."
  en: "In 294 al-Tabari recorded the report of Zakarawayh ibn Mihrawayh the Qarmatian: word came in Muharram that he had set out from Nahr al-Muthanniya aiming at the pilgrims, and that year Ibn Kaghlagh entered Tarsus on a raid at the start of Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. According to Ibn al-Jawzi he intercepted the pilgrim caravans at al-Aqaba, killing, enslaving and taking spoil worth a million dinars; he then seized the second caravan at al-Tulayh after three days of fighting and thirst, and Wasif ibn Sawartekin met him on the Khaffan road, where his companions were killed and he took a blow to the head and died five days later {cite:muntazam-ibn-al-jawzi p. 351-352}."
