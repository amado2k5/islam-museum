id: event/khalid-frightening-dream
class: event
kind: other
label:
  ar: "رؤيا خالد بن الوليد المخيفة"
  en: "Khalid ibn al-Walid's frightening dream"
  ur: "خالد بن الولید کا خوفناک خواب"
summary:
  ar: "بلغ يحيى بن سعيد أن خالد بن الوليد قال لرسول الله إني أروع في منامي فقال له رسول الله قل أعوذ بكلمات الله التامة من غضبه وعقابه وشر عباده ومن همزات الشياطين وأن يحضرون {cite:muwatta-maruf-1997} [[passage/muwatta-31-2737|الموطأ 31:2737]]."
  en: "It reached Yahya ibn Sa'id that Khalid ibn al-Walid said to the Messenger of God: I am frightened in my dreams. The Messenger of God said to him: say: I seek refuge in God's perfect words from His wrath and punishment and the evil of His servants, and from the promptings of the devils and their presence {cite:muwatta-maruf-1997} [[passage/muwatta-31-2737|Muwatta 31:2737]]."
  ur: "یحیی بن سعید تک اطلاع پہنچی کہ خالد بن الولید نے رسول اللہ سے کہا: مجھے اپنے خوابوں میں ڈر لگتا ہے۔ رسول اللہ نے ان سے کہا: کہو: میں اللہ کے کامل الفاظ میں اس کے غضب اور سزا اور اس کے بندوں کی برائی سے، اور شیطانوں کی اٹکلوں اور ان کی موجودگی سے پناہ مانگتا ہوں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2737|موطأ 31:2737]]۔"
