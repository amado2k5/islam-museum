id: event/funeral-prayer-for-the-negus
class: event
kind: other
label: { en: "The Prophet's funeral prayer in absentia for the Negus", ar: "صلاة النبي على النجاشي صلاة الغائب", es: "La oración fúnebre del Profeta en ausencia por el Negus", fr: "Prière funéraire du Prophète en l'absence du Négus", ur: "نجاشی کی غائبانہ نماز جنازہ", tr: "Peygamberin nezarethanede kılınan gurbetçiler için duası, gıyaben kılınan dua.", id: "Doa Nabi untuk Negus, doa untuk mereka yang tidak hadir." }
summary:
  en: "In 9 AH news reached Medina of the death of Ashama, the Negus of Abyssinia, who had sheltered the Muslim emigrants; the Prophet announced his death the day he died and led the funeral prayer for him in absentia."
  ar: "في سنة 9هـ توفي النجاشي أصحمة ملك الحبشة الذي آوى المهاجرين الأولين وأحسن إليهم، فنُعي إلى النبي يوم مات، وخرج بالناس فصلّى عليه صلاة الغائب."
  es: "En el año 9 de la Hégira, llegó a Medina la noticia de la muerte de Ashama, el Negus de Abisinia, que había dado refugio a los emigrantes musulmanes; el Profeta anunció su muerte el mismo día en que falleció y dirigió la oración fúnebre por él en ausencia."
  fr: "En l'an 9 de l'Hégire, la nouvelle de la mort d'Ashama, le Négus d'Abyssinie, qui avait abrité les émigrants musulmans, parvint à Médine; le Prophète annonça sa mort le jour même et dirigea la prière funéraire en son absence."
  ur: "9 ہجری میں حبشہ کے نجاشی اشامہ کی موت کی خبر مدینہ پہنچی جس نے مسلمان مہاجرین کو پناہ دی تھی۔ نبی نے ان کی موت کا اعلان اسی دن کیا جس دن آپ کا انتقال ہوا اور غائبانہ نماز جنازہ پڑھائی۔"
  tr: "Hicri 9. yılda, ilk göçmenlere sığınak sağlayan ve onlara iyi davranan Habeşistan kralı Negus Aşama vefat etti. Peygamberimiz, vefat ettiği gün kendisine haber verildi ve halkla birlikte dışarı çıkarak onun için gıyabi namaz kıldı."
  id: "Pada tahun 9 Hijriah, Negus Ashama, raja Abyssinia yang melindungi para imigran pertama dan memperlakukan mereka dengan baik, meninggal dunia. Nabi diberitahu tentang kematiannya pada hari wafatnya, dan beliau pergi bersama orang-orang dan melaksanakan salat jenazah untuknya."
