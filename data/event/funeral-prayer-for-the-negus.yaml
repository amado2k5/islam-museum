label: { en: "The Prophet's funeral prayer in absentia for the Negus", ar: "صلاة النبي على النجاشي صلاة الغائب", es: "La oración fúnebre del Profeta en ausencia por el Negus", fr: "Prière funéraire du Prophète en l'absence du Négus" }
summary:
  en: "In 9 AH news reached Medina of the death of Ashama, the Negus of Abyssinia, who had sheltered the Muslim emigrants; the Prophet announced his death the day he died and led the funeral prayer for him in absentia."
  ar: "في سنة 9هـ توفي النجاشي أصحمة ملك الحبشة الذي آوى المهاجرين الأولين وأحسن إليهم، فنُعي إلى النبي يوم مات، وخرج بالناس فصلّى عليه صلاة الغائب."
  es: "En el año 9 de la Hégira, llegó a Medina la noticia de la muerte de Ashama, el Negus de Abisinia, que había dado refugio a los emigrantes musulmanes; el Profeta anunció su muerte el mismo día en que falleció y dirigió la oración fúnebre por él en ausencia."
  fr: "En l'an 9 de l'Hégire, la nouvelle de la mort d'Ashama, le Négus d'Abyssinie, qui avait abrité les émigrants musulmans, parvint à Médine; le Prophète annonça sa mort le jour même et dirigea la prière funéraire en son absence."
