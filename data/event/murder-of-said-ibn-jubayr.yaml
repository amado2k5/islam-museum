label: { ar: "مقتل سعيد بن جبير", en: "The murder of Sa'id ibn Jubayr", es: "El asesinato de Sa'id ibn Jubayr", fr: "Le meurtre de Sa'id ibn Jubayr", ur: "سعید بن جبیر کا قتل" }
summary:
  ar: "في سنة أربع وتسعين قتل الحجاج سعيد بن جبير، وكان قد خرج مع عبد الرحمن بن محمد بن الأشعث {cite:tabari-tarikh-abu-al-fadl j.6 p.487} {cite:tabari-tarikh-abu-al-fadl j.6 p.488}."
  en: "In 94 AH al-Hajjaj killed Sa'id ibn Jubayr, who had gone out with Abd al-Rahman ibn Muhammad ibn al-Ash'ath {cite:tabari-tarikh-abu-al-fadl j.6 p.487} {cite:tabari-tarikh-abu-al-fadl j.6 p.488}."
  es: "En 94 AH al-Hajjaj mató a Sa'id ibn Jubayr, que había salido con Abd al-Rahman ibn Muhammad ibn al-Ash'ath {cita:tabari-tarikh-abu-al-fadl j.6 p.487} {cita:tabari-tarikh-abu-al-fadl j.6 p.488}."
  fr: "En 94 AH, al-Hajjaj tua Sa'id ibn Jubayr, qui était sorti avec Abd al-Rahman ibn Muhammad ibn al-Ash'ath {cite:tabari-tarikh-abu-al-fadl j.6 p.487} {cite:tabari-tarikh-abu-al-fadl j.6 p.488}."
  ur: "94 ہجری میں الحجاج نے سعید بن جبیر کو قتل کر دیا جو عبدالرحمٰن بن محمد بن اشعث کے ساتھ نکلا تھا۔"
