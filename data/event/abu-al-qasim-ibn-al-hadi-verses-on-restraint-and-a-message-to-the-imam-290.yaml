label:
  ar: "أبيات أبي القاسم في ضبط النفس ورسالة إلى الإمام، ص259-260، 290هـ"
  en: "Abu al-Qasim's verses on restraint and a message to the imam, pp. 259-260, 290 AH"
  ur: "ضبطِ نفس پر ابو القاسم کے اشعار اور امام کو پیغام، ص259-260، 290ھ"
summary:
  ar: "مقطوعات يقول فيها أبو القاسم إنه حبس همته عن اللقاء تأنياً وإن همه ليس الخمر ولا المغني، ثم يخاطب أمير المؤمنين ألا يحفل ببعده وقربه، ويرضى بمحنته ويذكر اجتماعهم عند جده يوم الحساب."
  en: "Pieces in which Abu al-Qasim says he held back his drive from the meeting in patience and that his concern is not wine or the singer; then he tells the commander of the faithful not to heed his distance or nearness, is content with his trial and speaks of their gathering before his grandfather on the Day of Reckoning."
  ur: "ایسے ٹکڑے جن میں ابو القاسم کہتے ہیں کہ انہوں نے سوچ سمجھ کر ملاقات سے اپنی ہمت روک رکھی اور ان کی فکر شراب یا گانے والا نہیں؛ پھر امیر المؤمنین سے کہتے ہیں کہ ان کی دوری اور قربت کی پروا نہ کریں، اپنی آزمائش پر راضی ہیں اور یوم حساب جد کے پاس جمع ہونے کا ذکر کرتے ہیں۔"
