label: { ar: "مقابلة هرتزل للسلطان عبد الحميد", en: "Herzl's Audience with Sultan Abdulhamid II", es: "Audiencia de Herzl con el sultán Abdulhamid II", fr: "Audience de Herzl auprès du sultan Abdulhamid II", ur: "سلطان عبدالحمید ثانی کے ساتھ ہرزل کے سامعین", tr: "Herzl'in Sultan Abdülhamid ile görüşmesi", id: "Pertemuan Herzl dengan Sultan Abdul Hamid" }
summary:
  ar: "قابل تيودور هرتزل السلطان عبد الحميد الثاني عام ١٩٠١م بعد سنتين ⁦(١٨٩٩–١٩٠١)⁩ من الاحتكاك بكبار موظفي قصر يلدز، واقترح في مقابلة دامت ساعتين أن تساعد البنوك اليهودية الغنية في أوروبا الدولة العثمانية على تخفيف ديونها العامة القائمة منذ ١٨٨١م لقاء السماح بالاستيطان في فلسطين، وكان السلطان مستمعاً أكثر منه متكلماً حتى ظن هرتزل أنه نجح ثم أدرك أنه يسير في طريق مسدود. وكان عبد الحميد يرى ضرورة عدم توطين اليهود في فلسطين كي يحتفظ العنصر العربي بتفوقه، وأصدر إرادتين سنيتين في يونيو ويوليو ١٨٩٠م برفض قبول اليهود في الممالك العثمانية وبطلب دراسة حاسمة للمسألة، واتخذ التدابير لمنع بيع الأراضي لليهود في فلسطين {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  en: "Herzl's 1901 Yıldız audience: a two-hour offer of Jewish banking relief on the Ottoman debt in exchange for Palestine settlement, which Abdülhamid heard out and declined — after already issuing the 1890 irades refusing Jewish immigration {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  es: "La audiencia de Herzl en Yıldız en 1901: una oferta de dos horas de alivio bancario judío para la deuda otomana a cambio de un asentamiento en Palestina, que Abdülhamid escuchó y rechazó, después de haber emitido ya el irades de 1890 rechazando la inmigración judía {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  fr: "L'audience de Herzl à Yıldız en 1901: une offre de deux heures d'allégement bancaire juif sur la dette ottomane en échange d'une colonisation de la Palestine, qu'Abdülhamid a écoutée et refusée — après avoir déjà émis les irades de 1890 refusant l'immigration juive {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  ur: "ہرزل کا 1901 یلدز کے سامعین: فلسطین کی تصفیہ کے بدلے میں عثمانی قرض پر یہودی بینکنگ ریلیف کی دو گھنٹے کی پیشکش، جسے عبد الحمید نے سنا اور مسترد کر دیا — پہلے ہی 1890 میں یہودی امیگریشن سے انکار کرنے والے ایراڈز جاری کرنے کے بعد۔ 447-450}۔"
  tr: "Theodor Herzl, Yıldız Sarayı'ndaki üst düzey yetkililerle ilk temasından (1899-1901) iki yıl sonra, 1901'de Sultan II. Abdülhamid ile görüştü. İki saat süren görüşmede Herzl, Avrupa'daki zengin Yahudi bankalarının, 1881'den beri biriken Osmanlı İmparatorluğu'nun kamu borcunu hafifletmesine yardımcı olmasını, karşılığında ise Filistin'de Yahudi yerleşimine izin verilmesini teklif etti. Sultan, konuşmaktan çok dinledi ve bu durum Herzl'in başarılı olduğunu düşünmesine yol açtı; ancak daha sonra çıkmaz bir yolda olduğunu fark etti. Abdülhamid, Filistin'de Yahudi yerleşiminin Arap egemenliğini sürdürmek için gerekli olduğuna inanıyordu. Haziran ve Temmuz 1890'da, Yahudilerin Osmanlı İmparatorluğu'na kabulünü reddeden ve konunun kapsamlı bir şekilde incelenmesini emreden iki kraliyet fermanı yayınladı. Ayrıca Filistin'de Yahudilere toprak satışını engellemek için de önlemler aldı."
  id: "Theodor Herzl bertemu dengan Sultan Abdul Hamid II pada tahun 1901, dua tahun setelah kontak pertamanya dengan para pejabat senior di Istana Yıldız (1899–1901). Selama pertemuan dua jam, Herzl mengusulkan agar bank-bank Yahudi kaya di Eropa membantu Kekaisaran Ottoman meringankan utang publiknya, yang telah menumpuk sejak tahun 1881, sebagai imbalan atas izin pemukiman Yahudi di Palestina. Sultan lebih banyak mendengarkan daripada berbicara, membuat Herzl percaya bahwa ia telah berhasil, hanya untuk menyadari bahwa ia berada di jalan buntu. Abdul Hamid percaya bahwa pemukiman Yahudi di Palestina diperlukan untuk mempertahankan dominasi Arab. Ia mengeluarkan dua dekrit kerajaan pada bulan Juni dan Juli 1890 yang menolak penerimaan orang Yahudi ke Kekaisaran Ottoman dan memerintahkan studi menyeluruh tentang masalah tersebut. Ia juga mengambil langkah-langkah untuk mencegah penjualan tanah kepada orang Yahudi di Palestina."
