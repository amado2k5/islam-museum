label: { ar: "مقابلة هرتزل للسلطان عبد الحميد", en: "Herzl's Audience with Sultan Abdulhamid II", es: "Audiencia de Herzl con el sultán Abdulhamid II", fr: "Audience de Herzl auprès du sultan Abdulhamid II", ur: "سلطان عبدالحمید ثانی کے ساتھ ہرزل کے سامعین" }
summary:
  ar: "قابل تيودور هرتزل السلطان عبد الحميد الثاني عام ١٩٠١م بعد سنتين ⁦(١٨٩٩–١٩٠١)⁩ من الاحتكاك بكبار موظفي قصر يلدز، واقترح في مقابلة دامت ساعتين أن تساعد البنوك اليهودية الغنية في أوروبا الدولة العثمانية على تخفيف ديونها العامة القائمة منذ ١٨٨١م لقاء السماح بالاستيطان في فلسطين، وكان السلطان مستمعاً أكثر منه متكلماً حتى ظن هرتزل أنه نجح ثم أدرك أنه يسير في طريق مسدود. وكان عبد الحميد يرى ضرورة عدم توطين اليهود في فلسطين كي يحتفظ العنصر العربي بتفوقه، وأصدر إرادتين سنيتين في يونيو ويوليو ١٨٩٠م برفض قبول اليهود في الممالك العثمانية وبطلب دراسة حاسمة للمسألة، واتخذ التدابير لمنع بيع الأراضي لليهود في فلسطين {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  en: "Herzl's 1901 Yıldız audience: a two-hour offer of Jewish banking relief on the Ottoman debt in exchange for Palestine settlement, which Abdülhamid heard out and declined — after already issuing the 1890 irades refusing Jewish immigration {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  es: "La audiencia de Herzl en Yıldız en 1901: una oferta de dos horas de alivio bancario judío para la deuda otomana a cambio de un asentamiento en Palestina, que Abdülhamid escuchó y rechazó, después de haber emitido ya el irades de 1890 rechazando la inmigración judía {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  fr: "L'audience de Herzl à Yıldız en 1901: une offre de deux heures d'allégement bancaire juif sur la dette ottomane en échange d'une colonisation de la Palestine, qu'Abdülhamid a écoutée et refusée — après avoir déjà émis les irades de 1890 refusant l'immigration juive {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  ur: "ہرزل کا 1901 یلدز کے سامعین: فلسطین کی تصفیہ کے بدلے میں عثمانی قرض پر یہودی بینکنگ ریلیف کی دو گھنٹے کی پیشکش، جسے عبد الحمید نے سنا اور مسترد کر دیا — پہلے ہی 1890 میں یہودی امیگریشن سے انکار کرنے والے ایراڈز جاری کرنے کے بعد۔ 447-450}۔"
