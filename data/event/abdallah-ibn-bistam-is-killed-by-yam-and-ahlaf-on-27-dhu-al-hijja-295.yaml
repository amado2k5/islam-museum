id: event/abdallah-ibn-bistam-is-killed-by-yam-and-ahlaf-on-27-dhu-al-hijja-295
class: event
kind: other
label:
  ar: "مقتل عبد الله بن بسطام على يد يأم والأحلاف في 27 ذي الحجة 295هـ، ص358-359"
  en: "Abdallah ibn Bistam is killed by Yam and Ahlaf on 27 Dhu al-Hijja 295 AH, pp. 358-359"
  ur: "عبداللہ بن بسطام کا یأم اور احلاف کے ہاتھوں 27 ذوالحجہ 295ھ کو قتل، ص358-359"
summary:
  ar: "بعد أن استأمنت القبائل لابن بسطام تباعاً، أجمع يأم والأحلاف على قتله. فلما دخل قرية نجران يوم الأحد لسبع وعشرين من ذي الحجة، لقيه القوم بين منزله ومنزل أبي محمد بن عبيد الله وضربوه بالسيوف حتى سقط في الدار، فخرج الهادي فوقف عليه، ويذكر الكتاب أنه كان يلعن من قتله أو أمر بقتله."
  en: "After the tribes had sought amnesty through Ibn Bistam one by one, Yam and Ahlaf agreed to kill him. The book says that on Sunday, 27 Dhu al-Hijja, he came into the village of Najran; men of Yam and Ahlaf caught him between his lodging and the house of Abu Muhammad ibn Ubaydallah and struck him with swords until he fell in the courtyard. Al-Hadi came out and stood over him. The book says Ibn Bistam was cursing those who had killed him or ordered his death."
  ur: "قبائل کے ابن بسطام کے ذریعے امان مانگنے کے بعد یأم اور احلاف نے اسے قتل کرنے کا فیصلہ کیا۔ کتاب کے مطابق اتوار، 27 ذوالحجہ کو وہ نجران کی بستی میں آیا، تو یأم اور احلاف کے لوگوں نے اسے اس کے ٹھکانے اور ابو محمد بن عبیداللہ کے گھر کے درمیان جا لیا اور تلواروں سے وار کیے یہاں تک کہ وہ صحن میں گر پڑا۔ ہادی باہر آئے اور اس کے پاس کھڑے ہوئے۔ کتاب کے مطابق ابن بسطام اپنے قاتلوں اور حکم دینے والوں پر لعنت کر رہا تھا۔"
