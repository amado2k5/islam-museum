id: event/al-hadi-simple-meal-and-kindness-to-orphans
class: event
kind: other
label:
  ar: طعام الهادي البسيط ورحمته باليتامى في صعدة
  en: Al-Hadi's plain meal and his kindness to orphans at Sa'da
  ur: صعدہ میں ہادی کا سادہ کھانا اور یتیموں پر شفقت
  es: "La comida sencilla de Al-Hadi y su bondad con los huérfanos de Sa'da"
  fr: "Le repas simple d'Al-Hadi et sa bonté envers les orphelins de Sa'da"
  tr: "Hadi'nin sade yemekleri ve Saada'daki yetimlere gösterdiği merhamet."
  id: "Makanan sederhana Hadi dan kemurahan hatinya terhadap anak yatim di Saada."
summary:
  ar: 'يروي محمد بن سليمان الكوفي عشاءً بسيطاً مع الهادي: ثلاثة أقراص وشيرج، وقوله إن هذا مع الأمر بالمعروف كثير؛ ويروي علي بن محمد استقباله يتيماً ومسحه رأسه وأمره بكسوته، وعشاء ابن عم له بطعام قليل وقوله هذا الطعام مع الجهاد، ويتيمين أمر لهما بكسوة ونفقة.'
  en: Muhammad ibn Sulayman al-Kufi relates a plain supper with al-Hadi, three loaves and sesame oil, and his saying that with enjoining good this is plenty; Ali ibn Muhammad relates his receiving an orphan boy, stroking his head and ordering him clothes, his small supper for a cousin with the words "this is food with jihad", and two orphans for whom he ordered clothing and provision.
  ur: محمد بن سلیمان کوفی ہادی کے ساتھ سادہ شام کے کھانے کا ذکر کرتے ہیں، تین روٹیاں اور تل کا تیل، اور ان کا قول کہ نیکی کے حکم کے ساتھ یہ بہت ہے؛ علی بن محمد ایک یتیم بچے کو قریب بٹھانے، اس کا سر سہلانے اور کپڑے دلانے، ایک چچازاد کو تھوڑا کھانا دینے اور «یہ جہاد کے ساتھ کا کھانا ہے» کہنے، اور دو یتیموں کو کپڑے اور خرچ دینے کا ذکر کرتے ہیں۔
  es: "Muhammad ibn Sulayman al-Kufi relata una cena sencilla con al-Hadi, tres panes y aceite de sésamo, y su dicho de que con la orden del bien esto es abundancia; Ali ibn Muhammad relata que recibió a un niño huérfano, le acarició la cabeza y le ordenó ropa, su pequeña cena para un primo con las palabras \"esta es comida con la yihad\", y dos huérfanos para quienes ordenó ropa y provisiones."
  fr: "Muhammad ibn Sulayman al-Kufi raconte un simple souper avec al-Hadi, composé de trois pains et d'huile de sésame, et comment il déclara qu'avec l'injonction au bien, cela suffisait amplement; Ali ibn Muhammad raconte avoir reçu un garçon orphelin, lui avoir caressé la tête et lui avoir commandé des vêtements, avoir offert un petit souper à un cousin en disant « ceci est une nourriture avec jihad », et avoir commandé des vêtements et des provisions pour deux orphelins."
  tr: "Muhammed ibn Süleyman el-Kufi, el-Hadi ile birlikte yediği sade bir akşam yemeğini anlatır: üç somun ekmek ve susam yağı; ve bunun iyiliği emretmekle birlikte çok olduğunu söyler. Ali ibn Muhammed ise bir yetimi kabul edip başını sildiğini ve giydirmesini emrettiğini, bir kuzeniyle birlikte az yemekli bir akşam yemeği yediğini ve bunun cihatla birlikte olduğunu söylediğini ve iki yetim için giydirme ve masraf siparişi verdiğini anlatır."
  id: "Muhammad ibn Sulayman al-Kufi meriwayatkan makan malam sederhana bersama al-Hadi: tiga potong roti dan minyak wijen, dan beliau berkata bahwa ini adalah makanan yang banyak dengan menyeru kepada kebaikan; dan Ali ibn Muhammad meriwayatkan menerima seorang anak yatim dan mengusap kepalanya serta memerintahkannya untuk memberinya pakaian, dan makan malam dengan sepupunya dengan sedikit makanan dan beliau berkata bahwa makanan ini adalah untuk berjihad, dan dua anak yatim yang untuknya beliau memerintahkan pakaian dan biaya hidup."
