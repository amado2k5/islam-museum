label: { ar: "سقوط منارة المدرسة الفخرية 849هـ", en: "The Fakhriyya Minaret Collapse, 849", es: "El colapso del minarete de Fakhriyya, 849", fr: "L'effondrement du minaret de Fakhriyya, 849", ur: "فخریہ مینار گرنا، 849", tr: "El-Fakhriya Okulu'nun minaresi Hicri 849 yılında çöktü.", id: "Menara masjid Al-Fakhriya runtuh pada tahun 849 Hijriah." }
summary:
  ar: "في شذرات الذهب سنة تسع وأربعين وثمان مئة في ليلة الجمعة ثامن المحرم سقطت بالقاهرة المنارة التي بالمدرسة الفخرية في سويقة الصاحب التي أنشئت بعد الست مئة بقليل وهلك في الركام جماعة كثيرة {cite:shadharat-dhahab p. 274}."
  en: "Friday night, 8 Muharram 849: the minaret of Cairo's Fakhriyya madrasa in Suwayqat al-Sahib — built shortly after 600 — collapsed, killing a great crowd beneath the rubble {cite:shadharat-dhahab p. 274}."
  es: "Viernes por la noche, 8 de Muharram de 849: el minarete de la madrasa Fakhriyya de El Cairo en Suwayqat al-Sahib, construido poco después del año 600, se derrumbó, matando a una gran multitud bajo los escombros {cita: shadharat-dhahab p. 274}."
  fr: "Vendredi soir, 8 Muharram 849: le minaret de la madrasa Fakhriyya du Caire à Suwayqat al-Sahib – construite peu après 600 – s'est effondré, tuant une grande foule sous les décombres {cite: shadharat-dhahab p. 274}."
  ur: "جمعہ کی رات، 8 محرم 849: قاہرہ کے فخریہ مدرسہ سویقات الصاحب کا مینار - جو 600 کے بعد بنایا گیا تھا - منہدم ہو گیا، جس سے ملبے کے نیچے ایک بڑا ہجوم ہلاک ہو گیا۔ 274}۔"
  tr: "Hicri 849 yılında, Muharrem ayının sekizinci Cuma gecesi, Kahire'de, Hicri 600 yılından biraz sonra kurulan Suveykat el-Sahib'deki Fahriyye Okulu'nun minaresi yıkılmış ve enkaz altında büyük bir topluluk hayatını kaybetmiştir. {cite:shadharat-dhahab s. 274}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 849 H, pada malam Jumat, tanggal delapan Muharram, menara Mazhab Fakhriyya di Suwayqat al-Sahib, yang didirikan sedikit setelah tahun 600 H, runtuh di Kairo, dan sekelompok besar orang tewas tertimpa reruntuhan. {cite:shadharat-dhahab hlm. 274}."
