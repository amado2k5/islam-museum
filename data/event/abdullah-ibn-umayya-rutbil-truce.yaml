id: event/abdullah-ibn-umayya-rutbil-truce
class: event
kind: treaty
label: { ar: "صلح عبد الله بن أمية ورتبيل الثاني", en: "Abdullah ibn Umayya's Truce with the Second Rutbil", fr: "La trêve d’Abdullah ibn Umayya avec le second Rutbil", es: "Tregua de Abdullah ibn Umayya con el segundo Rutbil", ur: "عبداللہ بن امیہ کی دوسری رتبیل کے ساتھ صلح" }
summary:
  ar: "استعمل عبد الملك بن مروان أمية بن عبد الله بن خالد بن أسيد بن أبي العاص على خراسان فوجه ابنه عبد الله بن أمية على سجستان وعقد له عليها وهو بكرمان فلما غزا رتبيل الملك بعد رتبيل الأول المقتول وقد كان هاب المسلمين فصالح عبد الله حين نزل بست على ألف ألف ففعل وبعث إليه بهدايا ورقيق فأبى قبول ذلك وقال إن ملأ لي هذا الرواق ذهباً وإلا فلا صلح بيني وبينه وكان غروراً فخلى له رتبيل البلاد حتى إذا أوغل فيها أخذ عليه الشعاب والمضايق وطلب إليهم أن يخلوا عنه ولا يأخذ منهم شيئاً فأبى ذلك وقال بل تأخذ ثلاثمائة ألف درهم صلحاً وتكتب لنا بها كتاباً ولا تغزو بلادنا ما كنت والياً ولا تحرق ولا تخرب ففعل وبلغ عبد الملك بن مروان ذلك فعزله."
  en: "Abd al-Malik gave Khurasan to Umayya ibn Abdallah ibn Khalid ibn Asid, who sent his son Abdullah to Sijistan with covenant while at Kirman. The second Rutbil — king after the slain first — still feared the Muslims and truced Abdullah at Bust for a million; but when gifts and slaves were refused with 'fill this portico with gold or there is no peace', it proved a ruse: Rutbil emptied the land before him, then seized the defiles behind him and pressed him to withdraw taking nothing. Abdullah answered: 'rather take three hundred thousand as sulh, write us a deed, and never raid our land while I govern, nor burn nor ruin' — done; and Abd al-Malik, hearing, dismissed him."
  fr: "Abd al-Malik confia le Khurasan à Umayya ibn Abdallah ibn Khalid ibn Asid, qui envoya son fils Abdullah au Sijistan avec un mandat alors qu’il se trouvait à Kirman. Le second Rutbil — successeur du premier, tué — craignait encore les musulmans et conclut une trêve avec Abdullah à Bust pour un million ; mais, après le refus des présents et des esclaves accompagné de l’exigence « remplis ce portique d’or, sinon il n’y aura pas de paix », ce fut une ruse : Rutbil vida le pays devant lui, puis s’empara des défilés derrière lui et le pressa de se retirer sans rien emporter. Abdullah répondit : « Prenez plutôt trois cent mille au titre de la paix, rédigez-nous un acte et ne menez jamais de raid sur notre pays tant que je gouvernerai, sans le brûler ni le dévaster ». Cela fut fait et Abd al-Malik, informé, le destitua."
  es: "Abd al-Malik entregó Jorasán a Umayya ibn Abdallah ibn Khalid ibn Asid, quien envió a su hijo Abdullah a Sijistan con un pacto mientras estaba en Kirman. El segundo Rutbil —rey después del primero asesinado— todavía temía a los musulmanes y le ofreció una tregua a Abdullah en Bust a cambio de un millón; pero cuando se negaron a aceptar regalos y esclavos con la amenaza de «llenen este pórtico de oro o no habrá paz», resultó ser una estratagema: Rutbil vació la tierra frente a él, luego tomó los desfiladeros detrás de él y lo presionó para que se retirara sin llevarse nada. Abdullah respondió: «Mejor toma trescientos mil como sulh, escríbenos un documento y nunca saquees nuestra tierra mientras yo gobierne, ni la quemes ni la destruyas». Así se hizo; y Abd al-Malik, al oírlo, lo despidió."
  ur: "عبد الملک نے خراسان امیہ بن عبداللہ ابن خالد بن اسید کو دے دیا جس نے کرمان میں رہتے ہوئے اپنے بیٹے عبداللہ کو عہد کے ساتھ سجستان بھیجا۔ دوسرا رتبیل - پہلے مقتول کے بعد بادشاہ - پھر بھی مسلمانوں سے خوفزدہ تھا اور اس نے عبداللہ کو بسٹ میں دس لاکھ تک پھانسی دی۔ لیکن جب تحائف اور غلاموں کو یہ کہہ کر انکار کر دیا گیا کہ 'اس پورٹیکو کو سونے سے بھر دو ورنہ امن نہیں ہے'، تو یہ ایک فریب ثابت ہوا: رتبل نے اپنے سامنے زمین کو خالی کر دیا، پھر اپنے پیچھے موجود ناپاکوں کو پکڑ لیا اور اس پر دباؤ ڈالا کہ وہ کچھ بھی نہ لے۔ عبداللہ نے جواب دیا: 'بلکہ تین لاکھ کو سل کے طور پر لے لو، ہمیں ایک نامہ لکھو، اور جب تک میں حکومت کر رہا ہوں، ہماری زمین پر کبھی چھاپہ نہیں مارنا، نہ جلانا اور نہ ہی برباد کرنا'۔ اور عبد الملک نے سن کر اسے برطرف کر دیا۔"
