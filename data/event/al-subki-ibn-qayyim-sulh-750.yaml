label:
  ar: "الصلح بين السبكي وابن قيم الجوزية، ١٦ جمادى الآخرة ٧٥٠هـ"
  en: "Reconciliation between al-Subki and Ibn Qayyim al-Jawziyya, 16 Jumada II 750"
  ur: "سبکی اور ابن قیم الجوزیہ میں صلح، 16 جمادی الثانی 750ھ"
summary:
  ar: "في يوم الثلاثاء ١٦ جمادى الآخرة ٧٥٠هـ تمّ الصلح في بستان قاضي القضاة بين تقي الدين السبكي وشمس الدين ابن قيم الجوزية بوساطة الأمير سيف الدين بن فضل ملك العرب، وكان السبكي قد نقم عليه إكثاره الفتيا في مسألة الطلاق التي اختارها شيخه ابن تيمية، وجرت بينهما مناقشات فيها {cite:al-bidaya-wal-nihaya s.a. 750 p. 244}."
  en: "On Tuesday 16 Jumada II 750, in the chief qadi's orchard, Taqi al-Din al-Subki and Shams al-Din Ibn Qayyim al-Jawziyya were reconciled through the mediation of the amir Sayf al-Din ibn Fadl, lord of the Arabs. Al-Subki had taken exception to Ibn Qayyim's frequent fatwas on the divorce question espoused by his teacher Ibn Taymiyya, and there had been extended disputes between them {cite:al-bidaya-wal-nihaya s.a. 750 p. 244}."
  ur: "منگل 16 جمادی الثانی 750ھ کو قاضی القضاة کے باغ میں امیر سیف الدین بن فضل ملك العرب کی وساطت سے تقی الدین سبکی اور شمس الدین ابن قیم الجوزیہ میں صلح ہوئی۔ سبکی کو طلاق کے مسئلے پر ابن قیم کی کثیر فتاوے ناپسند تھے جو ان کے استاد ابن تیمیہ کے مؤخد تھا، اور دونوں میں طویل مباحث ہوئے تھے {cite:al-bidaya-wal-nihaya s.a. 750 p. 244}۔"
