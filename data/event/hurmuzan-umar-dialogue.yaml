label: { ar: "هرمزان بين يدي عمر", en: "Hurmuzan before Umar", es: "Hurmuzan antes de Umar", fr: "Hurmuzan avant Umar", ur: "ہرمزان عمر سے پہلے", tr: "Hormuzan, Ömer'in elinde.", id: "Hormuzan di tangan Umar" }
summary:
  ar: "حمل هرمزان إلى عمر فاستحياه وفرض له وكان أنس بن مالك الذي أتى به فقال له عمر تكلم فقال أكلام حي أم كلام ميت فقال لا بأس فقال هرمزان كنا معشر العجم ما خلى الله بيننا وبينكم نقضيكم ونقتلكم فلما كان الله معكم لم يكن لنا بكم يدان ثم قال ما تقول يا أنس قال تركت خلفي شوكة شديدة وعد كلباً فإن قتلته يئس القوم من الحياة فكان أشد لشوكتهم وإن استحييته طمع القوم في الحياة فقال عمر سبحان الله وكان البراء بن مالك ومجزأة بن ثور قالا ليس لك إلى قتله سبيل فلما تشكك عمر في الإذن له بالكلام خرج أنس فشهد له الزبير بن العوام فخلى سبيل هرمزان فأسلم وفرض له عمر ثم اتهم بمجالسة أبي لؤلؤة عبد المغيرة بن شعبة على قتل عمر فقال له عبيد الله بن عمر امض بنا ننظر إلى فرس لي فمضى وعبيد الله خلفه فضربه بالسيف وهو غافل فقتله."
  en: "Carried to Umar, Hurmuzan was spared and stipended; Anas ibn Malik, his escort, narrates: 'Speak' — 'a living man's speech or a dead man's?' — 'no harm'. 'We Persians, so long as God left us between you, raided and killed you; when God was with you we had no hands against you.' Then 'what say you, Anas?' — 'I left a fierce force behind; count him a dog: kill it and the folk despair of life and grow fiercer, spare it and they hope.' Umar marvelled — Bara' and Majza'a had warned Anas not to kill him; doubting whether 'no harm' licensed the speech, Anas went out and al-Zubayr bore witness for him. Freed, Hurmuzan converted — then, accused of counselling Abu Lu'lu'a over Umar's murder, Ubaydallah ibn Umar drew him to see a horse and struck him dead unawares."
  es: "Llevado ante Umar, Hurmuzan fue perdonado y recibió una compensación; Anas ibn Malik, su escolta, narra: «Habla» — «¿Las palabras de un vivo o de un muerto?» — «No hay problema». «Nosotros, los persas, mientras Dios nos dejó entre vosotros, os saqueamos y matamos; cuando Dios estaba con vosotros, no teníamos poder contra vosotros». Entonces «¿Qué dices, Anas?» — «Dejé atrás una fuerza feroz; considéralo un perro: mátalo y el pueblo desesperará de la vida y se volverá más feroz; perdónalo y tendrán esperanza». Umar se maravilló: Bara' y Majza'a habían advertido a Anas que no lo matara; dudando si el «no hay problema» justificaba el discurso, Anas salió y al-Zubayr testificó a su favor. Liberado, Hurmuzan se convirtió; entonces, acusado de aconsejar a Abu Lu'lu'a sobre el asesinato de Umar, Ubaydallah ibn Umar lo llevó a ver un caballo y lo mató por sorpresa."
  fr: "Conduit auprès d'Umar, Hurmuzan fut épargné et reçut une pension alimentaire. Anas ibn Malik, son accompagnateur, raconte: « Parle, toi qui es vivant ou mort ? » « Sans mal. Nous autres Perses, tant que Dieu nous laissait entre vous, nous vous pillions et vous tuions; quand Dieu était avec vous, nous ne pouvions rien faire contre vous. » Puis: « Qu'en dis-tu, Anas ? » « J'ai laissé derrière moi une force redoutable; considère-la comme un chien: tue-la et le peuple désespère et devient plus féroce, épargne-la et il garde espoir. » Umar s'étonna – Bara' et Majza'a avaient averti Anas de ne pas le tuer; doutant que l'expression « sans mal » justifie ces paroles, Anas sortit et al-Zubayr témoigna en sa faveur. Libéré, Hurmuzan se convertit – puis, accusé d'avoir conseillé Abu Lu'lu'a au sujet du meurtre d'Umar, Ubaydallah ibn Umar l'attira près d'un cheval et le frappa mortellement par surprise."
  ur: "عمر کے پاس لے جایا گیا، ہرمزان کو بخش دیا گیا اور وظیفہ دیا گیا۔ انس بن مالک، ان کے معاون، بیان کرتے ہیں: 'بولیں' - 'ایک زندہ آدمی کی بات یا مردہ کی؟' - 'کوئی نقصان نہیں'۔ 'ہم فارسی، جب تک خدا نے ہمیں تمہارے درمیان چھوڑ دیا، چھاپہ مار کر تمہیں مار ڈالا۔ جب خدا تمہارے ساتھ تھا تو ہمارا تمہارے خلاف کوئی ہاتھ نہیں تھا۔ پھر 'کیا کہتے ہو انس؟' - 'میں نے پیچھے ایک زبردست قوت چھوڑی ہے۔ اسے ایک کتا شمار کریں: اسے مار ڈالو اور زندگی کی لوک مایوسی اور شدید ہو جاؤ، اسے چھوڑ دو اور وہ امید رکھتے ہیں۔' عمر حیران ہوئے - براء اور مازاعہ نے انس کو خبردار کیا تھا کہ اسے قتل نہ کرو۔ اس بات پر شک کرتے ہوئے کہ آیا 'کوئی نقصان نہیں' نے تقریر کو لائسنس دیا، انس باہر چلا گیا اور الزبیر نے اس کی گواہی دی۔ آزاد ہوا، ہرمزان نے مذہب تبدیل کر لیا - پھر، عمر کے قتل پر ابو لولوعہ سے مشورہ کرنے کا الزام لگایا، عبیداللہ ابن عمر نے اسے گھوڑے کی طرف کھینچا اور بے خبری میں اسے مارا۔"
  tr: "Hormuzan, Ömer'in huzuruna getirildi; Ömer onun hayatını bağışladı ve ona bir maaş verdi. Onu getiren Enes bin Malik'ti. Ömer ona, \"Konuş\" dedi. Ömer, \"Canlı gibi mi konuşuyorsun, yoksa ölü gibi mi?\" diye sordu. Hormuzan, \"Sorun değil\" dedi. Hormuzan, \"Biz Persler, Allah sizinleyken sizi öldürürdük. Ama Allah sizinleyken, sizin üzerinizde hiçbir gücümüz yoktu\" dedi. Sonra Ömer, \"Ne diyorsun Enes?\" diye sordu. Enes, \"Geride çok güçlü bir diken ve bir köpek bıraktım. Eğer onu öldürürsem, insanlar hayattan ümidini keser ve o da onlar için daha büyük bir diken olur. Ama eğer onu bağışlarsam, insanlar hayattan umut ederler\" dedi. Ömer, \"Allah'a hamd olsun\" dedi. El-Bara' bin Malik ve Mücaze bin Sevr, \"Onu öldürmenin hiçbir yolu yok\" dediler. Ömer, Hormuzan'a konuşma izni vermekte tereddüt edince, Enes dışarı çıktı ve Zübeyr bin Evvem onun lehine şahitlik etti. Böylece Ömer, Hormuzan'ı serbest bıraktı ve Hormuzan İslam'ı kabul etti; Ömer de ona bir maaş verdi. Daha sonra, Ömer'i öldürmek için Muğira bin Şube'nin kölesi Ebu Lulu'a ile birlikte oturduğu suçlamasıyla karşı karşıya kaldı. Ubeydullah bin Ömer ona, \"Gidip atıma bakalım\" dedi. O da gitti ve Ubeydullah arkasından gelerek, farkında olmadan ona kılıçla vurdu ve onu öldürdü."
  id: "Hormuzan dibawa kepada Umar, yang mengampuni nyawanya dan memberinya uang saku. Anas bin Malik adalah orang yang membawanya. Umar berkata kepadanya, “Bicaralah.” Umar bertanya, “Apakah kamu berbicara seperti orang hidup atau seperti orang mati?” Hormuzan menjawab, “Tidak masalah.” Hormuzan berkata, “Kami, orang Persia, biasa membunuhmu dan membunuhmu ketika Allah bersamamu. Tetapi ketika Allah bersamamu, kami tidak memiliki kekuasaan atasmu.” Kemudian Umar bertanya, “Apa pendapatmu, Anas?” Hormuzan menjawab, “Aku meninggalkan duri yang sangat kuat dan seekor anjing. Jika aku membunuhnya, orang-orang akan putus asa akan kehidupan, dan itu akan menjadi duri yang lebih besar bagi mereka. Tetapi jika aku mengampuninya, orang-orang akan berharap untuk hidup.” Umar berkata, “Maha Suci Allah.” Al-Bara’ bin Malik dan Mujaz’ah bin Thawr berkata, “Kamu tidak punya cara untuk membunuhnya.” Ketika Umar ragu untuk memberinya izin berbicara, Anas keluar, dan Al-Zubayr bin Al-Awwam bersaksi untuknya. Maka ia membebaskan Hormuzan, dan ia memeluk Islam, dan Umar memberinya tunjangan. Kemudian ia dituduh duduk bersama Abu Lu’lu’ah, budak Al-Mughira bin Shu’bah, untuk membunuh Umar. Ubayd Allah bin Umar berkata kepadanya, “Mari kita pergi dan melihat kudaku.” Maka ia pergi, dan Ubayd Allah berada di belakangnya, dan ia menyerangnya dengan pedang saat ia lengah, dan ia membunuhnya."
