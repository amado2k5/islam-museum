id: event/muslim-sicily-collapse-647
class: event
kind: expulsion
label:
  ar: انهيار مسلمي صقلية بعد هلاك أبي زكريا
  en: The collapse of Muslim Sicily after Abu Zakariya's death
  es: "El colapso de la Sicilia musulmana tras la muerte de Abu Zakariya."
  fr: "L'effondrement de la Sicile musulmane après la mort d'Abu Zakariya"
summary:
  ar: "لما طار خبر مهلك السلطان أبي زكريا سنة 647هـ إلى صقلية، وكان المسلمون بمدينة بلرم قد عُقد لهم مع صاحب الجزيرة الاشتراك في البلد والضاحية فتساكنوا، بادر النصارى إلى العيث فيهم فلجؤوا إلى الحصون والأوعار، فحاصرهم طاغية صقلية بمعقلهم من الجبل حتى استنزلهم وأجازهم البحر إلى عدوته وأنزلهم بوجاره، ثم تعدى إلى جزيرة مالطة فأخرج المسلمين الذين كانوا بها."
  en: "When word of Sultan Abu Zakariya's death in 647 AH reached Sicily — whose Muslims of Palermo had a compact to share town and suburbs with the island's lord — the Christians fell upon them; they fled to strongholds, were besieged until they surrendered, ferried across the strait and settled on the facing coast, and then the lord of Sicily passed to Malta and expelled its Muslims too."
  es: "Cuando la noticia de la muerte del sultán Abu Zakariya en el año 647 de la Hégira llegó a Sicilia —cuyos musulmanes de Palermo tenían un pacto para compartir la ciudad y los suburbios con el señor de la isla— los cristianos se abalanzaron sobre ellos; huyeron a fortalezas, fueron sitiados hasta que se rindieron, cruzaron el estrecho en barcazas y se asentaron en la costa opuesta, y entonces el señor de Sicilia pasó a Malta y expulsó también a sus musulmanes."
  fr: "Lorsque la nouvelle de la mort du sultan Abu Zakariya en 647 AH parvint en Sicile — dont les musulmans de Palerme avaient conclu un pacte pour partager la ville et ses faubourgs avec le seigneur de l'île — les chrétiens se jetèrent sur eux; ils s'enfuirent dans des forteresses, furent assiégés jusqu'à leur reddition, traversèrent le détroit et s'installèrent sur la côte opposée, puis le seigneur de Sicile se rendit à Malte et en expulsa également les musulmans."
