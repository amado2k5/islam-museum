label:
  ar: انهيار مسلمي صقلية بعد هلاك أبي زكريا
  en: The collapse of Muslim Sicily after Abu Zakariya's death
summary:
  ar: "لما طار خبر مهلك السلطان أبي زكريا سنة 647هـ إلى صقلية، وكان المسلمون بمدينة بلرم قد عُقد لهم مع صاحب الجزيرة الاشتراك في البلد والضاحية فتساكنوا، بادر النصارى إلى العيث فيهم فلجؤوا إلى الحصون والأوعار، فحاصرهم طاغية صقلية بمعقلهم من الجبل حتى استنزلهم وأجازهم البحر إلى عدوته وأنزلهم بوجاره، ثم تعدى إلى جزيرة مالطة فأخرج المسلمين الذين كانوا بها."
  en: "When word of Sultan Abu Zakariya's death in 647 AH reached Sicily — whose Muslims of Palermo had a compact to share town and suburbs with the island's lord — the Christians fell upon them; they fled to strongholds, were besieged until they surrendered, ferried across the strait and settled on the facing coast, and then the lord of Sicily passed to Malta and expelled its Muslims too."
