id: event/al-hadi-pardons-ibn-humayd-and-the-captured-harithis-286
class: event
kind: other
label:
  ar: عفو الهادي عن ابن حميد وأسرى بني الحارث، 286هـ
  en: Al-Hadi pardons Ibn Humayd and the captured Harithis, 286 AH
  ur: ہادی کا ابن حمید اور قید بنو حارث کو معاف کرنا، 286ھ
summary:
  ar: يوبّخ الهادي ابن حميد وجماعته على ما فعلوا بعد إحسانه إليهم، فيقرّون بأنهم استحقوا ما نزل بهم، فيطرق ثم يقول كما قال يوسف لإخوته ويأمرهم بالعودة إلى أهلهم عفواً وصفحاً، ويبقى ابن حميد ساعة ويأكل عنده وينصرف على فرس عبد الله بن الحسين.
  en: Al-Hadi asks Ibn Humayd and his men what they thought when they acted so after his kindness to them; they admit they deserved what befell them, and after a long silence he speaks as Joseph spoke to his brothers, pardons them and sends them home; Ibn Humayd stays an hour, eats with him and goes off on Abdullah ibn al-Husayn's horse.
  ur: ہادی ابن حمید اور اس کے ساتھیوں سے پوچھتے ہیں کہ ان کے احسان کے بعد ایسا کرتے وقت انہوں نے کیا سوچا؛ وہ مانتے ہیں کہ جو ان پر آیا وہ اس کے مستحق تھے، تو دیر خاموش رہ کر وہ یوسف کی طرح اپنے بھائیوں سے کہی گئی بات کہتے ہیں، انہیں معاف کر کے گھر بھیجتے ہیں؛ ابن حمید ایک گھڑی ٹھہرتا ہے، ان کے ساتھ کھانا کھاتا ہے اور عبداللہ بن حسین کے گھوڑے پر روانہ ہوتا ہے۔
