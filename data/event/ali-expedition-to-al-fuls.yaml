id: event/ali-expedition-to-al-fuls
class: event
kind: raid
label: { en: "Ali's expedition to destroy al-Fuls, the idol of Tayy'", ar: "سرية علي بن أبي طالب إلى الفلس صنم طيء", es: "La expedición de Ali para destruir a al-Fuls, el ídolo de Tayy'.", fr: "L'expédition d'Ali pour détruire al-Fuls, l'idole de Tayy'", ur: "طائی کے بت الفلس کو تباہ کرنے کے لیے علی کی مہم", tr: "Ali ibn Abi Talib'in Tayy'ın putu olan El-Fals'a yaptığı sefer.", id: "Ekspedisi Ali ibn Abi Talib ke Al-Fals, berhala Tayy" }
summary:
  en: "In Rabi' al-Awwal 9 AH the Prophet sent Ali ibn Abi Talib with one hundred and fifty men — a hundred camels and fifty horses, a black banner and a white standard — to demolish al-Fuls, the idol-temple of Tayy'; they raided Hatim's quarter at dawn, demolished it, and took captives among them Adi ibn Hatim's sister, whose appeal to the Prophet led to her release and to Adi's coming from Syria and accepting Islam."
  ar: "بعث النبي علي بن أبي طالب في ربيع الأول سنة 9هـ في خمسين ومائة على مائة بعير وخمسين فرساً ومعه راية سوداء ولواء أبيض لهدم الفلس صنم طيء؛ فشنوا الغارة على محلة حاتم مع الفجر فهدموه وأصابوا سبياً ونعماً وشاءً، وفي السبي أخت عدي بن حاتم، فاستعطفته فمنّ عليها، فرجعت إلى أخيها بالشام فجاء عدي فأسلم على يد النبي."
  es: "En Rabi' al-Awwal 9 AH, el Profeta envió a Ali ibn Abi Talib con ciento cincuenta hombres —cien camellos y cincuenta caballos, un estandarte negro y un estandarte blanco— para demoler al-Fuls, el templo de ídolos de Tayy'; asaltaron el barrio de Hatim al amanecer, lo demolieron y tomaron cautiva entre ellos a la hermana de Adi ibn Hatim, cuya súplica al Profeta condujo a su liberación y a que Adi viniera de Siria y aceptara el Islam."
  fr: "En Rabi' al-Awwal de l'an 9 de l'Hégire, le Prophète envoya Ali ibn Abi Talib avec cent cinquante hommes — cent chameaux et cinquante chevaux, une bannière noire et un étendard blanc — pour démolir al-Fuls, le temple des idoles de Tayy'; ils pillèrent le quartier de Hatim à l'aube, le démolirent et firent des captifs, parmi lesquels la sœur d'Adi ibn Hatim, dont l'appel au Prophète entraîna sa libération et le retour d'Adi de Syrie pour se convertir à l'islam."
  ur: "ربیع الاول 9 ہجری میں نبی نے علی ابن ابی طالب کو ایک سو پچاس آدمیوں کے ساتھ بھیجا - ایک سو اونٹ اور پچاس گھوڑے، ایک سیاہ جھنڈا اور ایک سفید معیار - طی کے بت کو گرانے کے لیے۔ انہوں نے فجر کے وقت حاتم کے کوارٹر پر چھاپہ مارا، اسے منہدم کر دیا، اور اپنے درمیان عدی بن حاتم کی بہن کو قید کر لیا، جس کی درخواست نبی سے ان کی رہائی اور عدی کے شام سے آنے اور اسلام قبول کرنے پر منتج ہوئی۔"
  tr: "Peygamberimiz, Hicri 9. yılın Rebiü'l-Evvel ayında, Tayy putunu yıkmak için Ali ibn Ebu Talib'i yüz elli adam, yüz deve ve elli atla, siyah bir sancak ve beyaz bir bayrakla gönderdi. Şafak vakti Hatim mahallesine baskın düzenlediler, orayı yıktılar ve esirler, büyükbaş hayvanlar ve koyunlar aldılar. Esirler arasında Adi ibn Hatim'in kız kardeşi de vardı; kız kardeş Peygamberimize yalvardı ve Peygamberimiz ona merhamet gösterdi, böylece kız kardeş Suriye'deki kardeşinin yanına döndü. Sonra Adi geldi ve Peygamberimizin eliyle İslam'ı kabul etti."
  id: "Nabi Muhammad SAW mengutus Ali bin Abi Talib pada bulan Rabi' al-Awwal tahun 9 Hijriah dengan seratus lima puluh orang menunggangi seratus unta dan lima puluh kuda, membawa panji hitam dan bendera putih, untuk menghancurkan berhala Tayy. Mereka melancarkan serangan ke daerah Hatim pada waktu subuh, menghancurkannya, dan menangkap tawanan, ternak, dan domba. Di antara tawanan tersebut adalah saudara perempuan Adi bin Hatim, sehingga ia memohon kepadanya dan Adi menunjukkan belas kasihan kepadanya, lalu ia kembali kepada saudaranya di Suriah. Kemudian Adi datang dan masuk Islam di tangan Nabi."
