id: event/ali-expedition-to-al-fuls
class: event
kind: raid
label: { en: "Ali's expedition to destroy al-Fuls, the idol of Tayy'", ar: "سرية علي بن أبي طالب إلى الفلس صنم طيء" }
summary:
  en: "In Rabi' al-Awwal 9 AH the Prophet sent Ali ibn Abi Talib with one hundred and fifty men — a hundred camels and fifty horses, a black banner and a white standard — to demolish al-Fuls, the idol-temple of Tayy'; they raided Hatim's quarter at dawn, demolished it, and took captives among them Adi ibn Hatim's sister, whose appeal to the Prophet led to her release and to Adi's coming from Syria and accepting Islam."
  ar: "بعث النبي علي بن أبي طالب في ربيع الأول سنة 9هـ في خمسين ومائة على مائة بعير وخمسين فرساً ومعه راية سوداء ولواء أبيض لهدم الفلس صنم طيء؛ فشنوا الغارة على محلة حاتم مع الفجر فهدموه وأصابوا سبياً ونعماً وشاءً، وفي السبي أخت عدي بن حاتم، فاستعطفته فمنّ عليها، فرجعت إلى أخيها بالشام فجاء عدي فأسلم على يد النبي."
