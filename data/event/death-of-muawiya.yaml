label: { ar: "وفاة معاوية بن أبي سفيان", en: "Death of Mu'awiya ibn Abi Sufyan" }
summary:
  ar: "مات معاوية في رجب سنة ستين ودفن بين باب الجابية وباب الصغير بدمشق وقيل إنه عاش سبعاً وسبعين سنة، وكان عنده شيء من شعر رسول الله وقلامة أظفاره فأوصى أن تجعل في فمه وعينيه وقال افعلوا ذلك وخلوا بيني وبين أرحم الراحمين {cite:tarikh-khulafa-minhaj-1434 p. 329}. وكان أميراً على الشام عشرين سنة وخليفة عشرين سنة {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  en: "Mu'awiya died in Rajab of year 60 and was buried between Bab al-Jabiya and Bab al-Saghir at Damascus; he is said to have lived seventy-seven years. Keeping hairs and nail-parings of the Prophet, he willed they be placed in his mouth and eyes — 'do that, and leave me with the Most Merciful of the merciful'. He had been governor of Syria twenty years and caliph twenty more {cite:tarikh-khulafa-minhaj-1434 p. 325, 329}."
