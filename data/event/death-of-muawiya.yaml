label: { ar: "وفاة معاوية بن أبي سفيان", en: "Death of Mu'awiya ibn Abi Sufyan", es: "Muerte de Mu'awiya ibn Abi Sufyan", fr: "Mort de Mu'awiya ibn Abi Sufyan", ur: "معاویہ بن ابی سفیان کی وفات", tr: "Muaviye ibn Abi Süfyan'ın ölümü", id: "Meninggalnya Muawiyah bin Abi Sufyan" }
summary:
  ar: "مات معاوية في رجب سنة ستين ودفن بين باب الجابية وباب الصغير بدمشق وقيل إنه عاش سبعاً وسبعين سنة، وكان عنده شيء من شعر رسول الله وقلامة أظفاره فأوصى أن تجعل في فمه وعينيه وقال افعلوا ذلك وخلوا بيني وبين أرحم الراحمين {cite:tarikh-khulafa-minhaj-1434 p. 329}. وكان أميراً على الشام عشرين سنة وخليفة عشرين سنة {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  en: "Mu'awiya died in Rajab of year 60 and was buried between Bab al-Jabiya and Bab al-Saghir at Damascus; he is said to have lived seventy-seven years. Keeping hairs and nail-parings of the Prophet, he willed they be placed in his mouth and eyes — 'do that, and leave me with the Most Merciful of the merciful'. He had been governor of Syria twenty years and caliph twenty more {cite:tarikh-khulafa-minhaj-1434 p. 325, 329}."
  es: "Mu'awiya murió en Rajab del año 60 y fue enterrado entre Bab al-Jabiya y Bab al-Saghir en Damasco; se dice que vivió setenta y siete años. Conservando cabellos y uñas del Profeta, dispuso que se colocaran en su boca y ojos: «Hacedlo, y dejadme con el Misericordioso de los misericordiosos». Fue gobernador de Siria durante veinte años y califa durante veinte más {cite:tarikh-khulafa-minhaj-1434 p. 325, 329}."
  fr: "Mu'awiya mourut en Rajab de l'an 60 et fut enterré entre Bab al-Jabiya et Bab al-Saghir à Damas; on dit qu'il vécut soixante-dix-sept ans. Conservant des cheveux et des rognures d'ongles du Prophète, il souhaita qu'on les place dans sa bouche et ses yeux: « Faites cela, et confiez-moi au Tout Miséricordieux des miséricordieux. » Il fut gouverneur de Syrie pendant vingt ans et calife pendant vingt ans également (voir: Tarikh-Khulafa-Minhaj-1434, p. 325, 329)."
  ur: "معاویہ کی وفات 60 رجب میں ہوئی اور باب الجبیہ اور باب الصغیر کے درمیان دمشق میں دفن ہوئے۔ اس کے بارے میں کہا جاتا ہے کہ وہ ستر سال زندہ رہا۔ آپ کے بال اور ناخن کاٹتے ہوئے، آپ نے چاہا کہ وہ آپ کے منہ اور آنکھوں میں رکھے جائیں - 'ایسا کرو اور مجھے سب سے زیادہ رحم کرنے والے کے پاس چھوڑ دو'۔ وہ بیس سال شام کے گورنر رہے اور بیس سال خلیفہ رہے۔ 325، 329}۔"
  tr: "Muaviye, 60 yılının Receb ayında vefat etti ve Şam'da Bab el-Cabiye ile Bab el-Sağrir arasına defnedildi. Yetmiş yedi yıl yaşadığı rivayet edilir. Peygamberin saç ve tırnaklarından bir kısmını yanında bulundurmuş ve bunları ağzına ve gözlerine koymasını emrederek, \"Bunu yapın ve beni en merhametli olan Allah'a bırakın\" demiştir. Yirmi yıl Suriye valisi ve yirmi yıl halife olarak görev yapmıştır."
  id: "Muawiyah wafat pada bulan Rajab tahun enam puluh dan dimakamkan di antara Bab al-Jabiyah dan Bab al-Saghir di Damaskus. Dikatakan bahwa ia hidup selama tujuh puluh tujuh tahun. Ia memiliki beberapa helai rambut dan potongan kuku Nabi, dan ia memerintahkan agar itu diletakkan di mulut dan matanya, seraya berkata, \"Lakukan itu dan serahkan aku kepada Yang Maha Penyayang.\" Ia menjabat sebagai gubernur Suriah selama dua puluh tahun dan khalifah selama dua puluh tahun."
