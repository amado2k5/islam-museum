summary:
  ar: "توفي غياث الدين محمد بن سام ملك الغور وغزنة وما دان له من خراسان والهند، وكان من أعدل الملوك وأعقلهم وأسدّهم رأيًا حتى قيل ما رئي على الملك مثله، وشعر نفسه من العلماء، وملك بعده أخوه شهاب الدين محمد الغوري المستقل {cite:kamil-ibn-al-athir p. 281}."
  en: "Ghiyath al-Din Muhammad ibn Sam died — king of Ghur, Ghazna and the Khurasan-India empire; counted the most just and clear-headed of kings, a scholar among scholars. His brother Shihab al-Din Muhammad al-Ghuri now ruled alone {cite:kamil-ibn-al-athir p. 281}."
  es: "Murió Ghiyath al-Din Muhammad ibn Sam, rey de Ghur, Ghazna y el imperio de Jorasán en la India; considerado el más justo y lúcido de los reyes, un erudito entre los eruditos. Su hermano Shihab al-Din Muhammad al-Ghuri gobernaba ahora solo {cita:kamil-ibn-al-athir, pág. 281}."
  fr: "Ghiyath al-Din Muhammad ibn Sam mourut, roi de Ghur, de Ghazna et de l'empire du Khorasan-Inde; considéré comme le plus juste et le plus clairvoyant des rois, un érudit parmi les érudits. Son frère Shihab al-Din Muhammad al-Ghuri régnait désormais seul {cite:kamil-ibn-al-athir p. 281}."
  ur: "غیاث الدین محمد بن سام کا انتقال ہوا - غور، غزنا اور خراسان-انڈیا سلطنت کا بادشاہ؛ بادشاہوں میں سب سے زیادہ انصاف پسند اور صاف گو، اہل علم میں شمار ہوتا ہے۔ اس کا بھائی شہاب الدین محمد الثوری اب تنہا حکومت کرتا تھا 281}۔"
  tr: "Ghor, Gazne ve Horasan ile Hindistan'dan kendisine bağlı olan bölgelerin kralı Ghiyath al-Din Muhammad ibn Sam vefat etti. O, en adaletli, zeki ve bilge krallardan biriydi; öyle ki, onun gibi bir kralın daha önce hiç görülmediği söylenirdi. Kendini âlimlerden biri olarak kabul ederdi. Ondan sonra kardeşi Shihab al-Din Muhammad al-Ghauri al-Mustaqil kral oldu. {cite:kamil-ibn-al-athir s. 281}"
  id: "Ghiyath al-Din Muhammad ibn Sam, raja Ghor, Ghazna, dan wilayah yang berada di bawah kekuasaannya dari Khorasan dan India, wafat. Beliau adalah salah satu raja yang paling adil, cerdas, dan bijaksana, sampai-sampai dikatakan bahwa belum pernah ada raja seperti beliau. Beliau menganggap dirinya sebagai salah satu ulama. Setelahnya, saudaranya Shihab al-Din Muhammad al-Ghauri al-Mustaqil menjadi raja. {cite:kamil-ibn-al-athir p. 281}"
