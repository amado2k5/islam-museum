label: { ar: "وقعة الجمل", en: "Battle of the Camel" }
summary:
  ar: "خرج علي بن أبي طالب إلى البصرة بعد أن استأذنه طلحة والزبير، ونزل ذا قار، وبعث الحسن وعمار بن ياسر إلى الكوفة يستنفران الناس. ثم وقعت وقعة الجمل، وفيها مقتل الزبير بن العوام، ثم دخل علي على عائشة وبايعه أهل البصرة {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وأدرج الفهرس خبر الوقعة في سنة 36هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وعند السيوطي خرج طلحة والزبير إلى مكة فأخذا عائشة وخرجوا إلى البصرة يطلبون بدم عثمان، فلقيهم علي بالبصرة وكانت الوقعة في جمادى الآخرة سنة ست وثلاثين وقتل بها طلحة والزبير وبلغت القتلى ثلاثة عشر ألفاً، وأقام علي بالبصرة خمس عشرة ليلة ثم انصرف إلى الكوفة {cite:tarikh-khulafa-minhaj-1434 p. 294}. وذكر المسعودي أن قتلى الجمل من أهل البصرة وغيرهم ثلاثة عشر ألفاً وقتل من أصحاب علي خمسة آلاف وتنازعوا في ذلك فالمقلل يقول سبعة آلاف والمكثر يقول عشرة آلاف على حسب ميل الناس وأهوائهم إلى كل فريق {cite:muruj-al-dhahab p. 645}، وأمر علي أن لا يجهزوا على جريح ولا يقتلوا أسيراً ولا يتبعوا مولياً ولا يكشفوا عورة ولا يمثلوا بقتيل ولا يقربوا من أموالهم إلا ما في عسكرهم من سلاح وكراع وعبد وأمة، وخرج حاسراً على بغلة رسول الله فذكر الزبير قول النبي له إنك لتقاتلنه وأنت له ظالم فرجع، وقتل الزبير عمرو بن جرموز في الصلاة بوادي السباع، ورمى مروان بن الحكم طلحة في أكحله فقتله وهو يقول ندامة الكسعي لما طلبت رضا بني جرم بزعمي {cite:muruj-al-dhahab p. 655-658}، ودخل علي بيت مال البصرة فقال يا صفراء غري غيري ويا بيضاء غري غيري ثم أمر فقسم بين من معه خمسمائة خمسمائة وهم اثنا عشر ألفاً وأخذ لنفسه كسهم واحد منهم، وولاّ عبد الله بن عباس عليها وسار إلى الكوفة {cite:muruj-al-dhahab p. 664}"
  en: "Ali set out for Basra after Talha and al-Zubayr had asked his leave; he camped at Dhi Qar and sent al-Hasan and Ammar ibn Yasir to Kufa to rouse the people. Then the Battle of the Camel took place, in which al-Zubayr ibn al-Awwam was killed. Ali then entered upon Aisha, and the people of Basra gave him their allegiance {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. The index places the account of the battle in 36 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. According to al-Suyuti, Talha and al-Zubayr went to Mecca, took Aisha with them, and went to Basra seeking vengeance for the blood of Uthman; Ali met them at Basra. The battle took place in Jumada II 36 AH; Talha and al-Zubayr were killed there, and the dead numbered thirteen thousand. Ali stayed at Basra fifteen nights and then returned to Kufa {cite:tarikh-khulafa-minhaj-1434 p. 294}. Al-Mas'udi mentions that the dead of the Camel, from Basra and elsewhere, numbered thirteen thousand, and that Ali's side lost five thousand, though people disputed this: the one who minimized it said seven thousand and the one who maximized it said ten thousand, depending on each person's leaning toward one side or the other {cite:muruj-al-dhahab p. 645}. Ali ordered that no wounded man be finished off, no captive killed, no fugitive pursued, no one's nakedness exposed, no corpse mutilated, and that no one approach their property except for the weapons, mounts, and male and female slaves in their camp. He went out bareheaded on the mule of the Messenger of God; al-Zubayr recalled the Prophet's words to him, 'You will fight him while you are wronging him', and turned back. Al-Zubayr was killed by Amr ibn Jurmuz while at prayer in Wadi al-Siba'. Marwan ibn al-Hakam shot Talha in the arm-vein and killed him, while Talha recited: 'The regret of al-Kasi, when I sought the pleasure of Banu Jurm, as I imagined' {cite:muruj-al-dhahab p. 655-658}. Ali entered the treasury of Basra and said, 'O yellow one, deceive another than me! O white one, deceive another than me!' Then he ordered it divided among those with him, five hundred each, they being twelve thousand, and took for himself a single share like one of them. He appointed Abd Allah ibn Abbas over Basra and went to Kufa {cite:muruj-al-dhahab p. 664}."
