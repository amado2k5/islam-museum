id: event/battle-of-the-camel
class: event
kind: battle
label: { ar: "وقعة الجمل" }
summary:
  ar: "خرج علي بن أبي طالب إلى البصرة بعد أن استأذنه طلحة والزبير، ونزل ذا قار، وبعث الحسن وعمار بن ياسر إلى الكوفة يستنفران الناس. ثم وقعت وقعة الجمل، وفيها مقتل الزبير بن العوام، ثم دخل علي على عائشة وبايعه أهل البصرة {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وأدرج الفهرس خبر الوقعة في سنة 36هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وعند السيوطي خرج طلحة والزبير إلى مكة فأخذا عائشة وخرجوا إلى البصرة يطلبون بدم عثمان، فلقيهم علي بالبصرة وكانت الوقعة في جمادى الآخرة سنة ست وثلاثين وقتل بها طلحة والزبير وبلغت القتلى ثلاثة عشر ألفاً، وأقام علي بالبصرة خمس عشرة ليلة ثم انصرف إلى الكوفة {cite:tarikh-khulafa-minhaj-1434 p. 294}.، وذكر المسعودي أن قتلى الجمل من أهل البصرة وغيرهم ثلاثة عشر ألفاً وقتل من أصحاب علي خمسة آلاف وتنازعوا في ذلك فالمقلل يقول سبعة آلاف والمكثر يقول عشرة آلاف على حسب ميل الناس وأهوائهم إلى كل فريق {cite:muruj-al-dhahab p. 645}"
