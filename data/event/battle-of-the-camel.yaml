  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition is critical of Aisha chiefly for leading the forces that fought Ali at the Battle of the Camel.", ar: "يُنتقد في التقليد الشيعي الاثني عشري دور عائشة أساساً لقيادتها الجيش الذي قاتل عليّاً في موقعة الجمل." }
    sources: [source/momen-1985]
