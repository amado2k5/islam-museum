id: event/battle-of-the-camel
class: event
kind: battle
label: { ar: "وقعة الجمل", en: "Battle of the Camel", fr: "La bataille du Chameau", es: "Batalla del Camello", ur: "اونٹ کی لڑائی", tr: "Deve Savaşı", id: "Pertempuran Unta" }
summary:
  ar: "خرج علي بن أبي طالب إلى البصرة بعد أن استأذنه طلحة والزبير، ونزل ذا قار، وبعث الحسن وعمار بن ياسر إلى الكوفة يستنفران الناس. ثم وقعت وقعة الجمل، وفيها مقتل الزبير بن العوام، ثم دخل علي على عائشة وبايعه أهل البصرة {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وأدرج الفهرس خبر الوقعة في سنة 36هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. وعند السيوطي خرج طلحة والزبير إلى مكة فأخذا عائشة وخرجوا إلى البصرة يطلبون بدم عثمان، فلقيهم علي بالبصرة وكانت الوقعة في جمادى الآخرة سنة ست وثلاثين وقتل بها طلحة والزبير وبلغت القتلى ثلاثة عشر ألفاً، وأقام علي بالبصرة خمس عشرة ليلة ثم انصرف إلى الكوفة {cite:tarikh-khulafa-minhaj-1434 p. 294}. وذكر المسعودي أن قتلى الجمل من أهل البصرة وغيرهم ثلاثة عشر ألفاً وقتل من أصحاب علي خمسة آلاف وتنازعوا في ذلك فالمقلل يقول سبعة آلاف والمكثر يقول عشرة آلاف على حسب ميل الناس وأهوائهم إلى كل فريق {cite:muruj-al-dhahab p. 645}، وأمر علي أن لا يجهزوا على جريح ولا يقتلوا أسيراً ولا يتبعوا مولياً ولا يكشفوا عورة ولا يمثلوا بقتيل ولا يقربوا من أموالهم إلا ما في عسكرهم من سلاح وكراع وعبد وأمة، وخرج حاسراً على بغلة رسول الله فذكر الزبير قول النبي له إنك لتقاتلنه وأنت له ظالم فرجع، وقتل الزبير عمرو بن جرموز في الصلاة بوادي السباع، ورمى مروان بن الحكم طلحة في أكحله فقتله وهو يقول ندامة الكسعي لما طلبت رضا بني جرم بزعمي {cite:muruj-al-dhahab p. 655-658}، ودخل علي بيت مال البصرة فقال يا صفراء غري غيري ويا بيضاء غري غيري ثم أمر فقسم بين من معه خمسمائة خمسمائة وهم اثنا عشر ألفاً وأخذ لنفسه كسهم واحد منهم، وولاّ عبد الله بن عباس عليها وسار إلى الكوفة {cite:muruj-al-dhahab p. 664}. ويذهب الصلابي في تحليله إلى أن أثر السبئية، أنصار ابن سبأ، في إذكاء القتال بين الفريقين مما يكاد يجمع عليه العلماء، ناقلاً عن الباقلاني اتفاقهم على أن قتلة عثمان خافوا أن يُكشف أمرهم فدبّروا إشعال الحرب بين الفريقين، وعن ابن حزم أن الفسقة من قتلة عثمان بيتوا عسكر طلحة والزبير بالليل؛ وأن كعب بن سور قاضي البصرة تقدّم حاملاً المصحف فخرّقوه بالنبل فمات والمصحف في يده {cite:sallabi-ali-tawzi-2004 p. 488-490} {cite:sallabi-ali-tawzi-2004 p. 494-495} وفي العرض الأكاديمي لدائرة المعارف الإسلامية، جرت الوقعة قرب البصرة في جمادى الآخرة سنة 36هـ، نحو نوفمبر–ديسمبر 656م، بين علي وعائشة ومعها طلحة والزبير، وانتهت بعقر الجمل وانسحاب طلحة والزبير من القتال ثم مقتلهما، وأُرجعت عائشة إلى المدينة وولّى علي ابن عباس على البصرة."
  en: "Ali set out for Basra after Talha and al-Zubayr had asked his leave; he camped at Dhi Qar and sent al-Hasan and Ammar ibn Yasir to Kufa to rouse the people. Then the Battle of the Camel took place, in which al-Zubayr ibn al-Awwam was killed. Ali then entered upon Aisha, and the people of Basra gave him their allegiance {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. The index places the account of the battle in 36 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. According to al-Suyuti, Talha and al-Zubayr went to Mecca, took Aisha with them, and went to Basra seeking vengeance for the blood of Uthman; Ali met them at Basra. The battle took place in Jumada II 36 AH; Talha and al-Zubayr were killed there, and the dead numbered thirteen thousand. Ali stayed at Basra fifteen nights and then returned to Kufa {cite:tarikh-khulafa-minhaj-1434 p. 294}. Al-Mas'udi mentions that the dead of the Camel, from Basra and elsewhere, numbered thirteen thousand, and that Ali's side lost five thousand, though people disputed this: the one who minimized it said seven thousand and the one who maximized it said ten thousand, depending on each person's leaning toward one side or the other {cite:muruj-al-dhahab p. 645}. Ali ordered that no wounded man be finished off, no captive killed, no fugitive pursued, no one's nakedness exposed, no corpse mutilated, and that no one approach their property except for the weapons, mounts, and male and female slaves in their camp. He went out bareheaded on the mule of the Messenger of God; al-Zubayr recalled the Prophet's words to him, 'You will fight him while you are wronging him', and turned back. Al-Zubayr was killed by Amr ibn Jurmuz while at prayer in Wadi al-Siba'. Marwan ibn al-Hakam shot Talha in the arm-vein and killed him, while Talha recited: 'The regret of al-Kasi, when I sought the pleasure of Banu Jurm, as I imagined' {cite:muruj-al-dhahab p. 655-658}. Ali entered the treasury of Basra and said, 'O yellow one, deceive another than me! O white one, deceive another than me!' Then he ordered it divided among those with him, five hundred each, they being twelve thousand, and took for himself a single share like one of them. He appointed Abd Allah ibn Abbas over Basra and went to Kufa {cite:muruj-al-dhahab p. 664}. In his analysis al-Sallabi holds that the hand of the Sabaiyya, the partisans of Ibn Saba, in fanning the fighting between the two camps is close to agreed among scholars; he quotes al-Baqillani that Uthman's killers feared exposure and plotted to open the war between the camps, and Ibn Hazm that the vicious among Uthman's killers fell on Talha's and al-Zubayr's camp by night; and that Ka'b ibn Sur, Basra's qadi, advanced bearing the mushaf and was shot down with it in his hand {cite:sallabi-ali-tawzi-2004 p. 488-490} {cite:sallabi-ali-tawzi-2004 p. 494-495}. In the academic account of the Encyclopaedia of Islam the battle was fought near Basra in Jumada II 36 AH, about November to December 656, between Ali and Aisha with Talha and al-Zubayr; it ended when the camel was hamstrung and Talha and al-Zubayr had withdrawn from the fighting and died. Aisha was sent back to Medina and Ali made Ibn Abbas governor of Basra."
  ur: "جنگِ جمل جمادی الآخرہ 36ھ، تقریباً نومبر تا دسمبر 656ء، میں بصرہ کے قریب علی اور عائشہ کے درمیان ہوئی جن کے ساتھ طلحہ اور زبیر تھے۔ انسائیکلوپیڈیا آف اسلام کے علمی بیان کے مطابق اونٹ کی ٹانگیں کاٹے جانے پر لڑائی ختم ہوئی، طلحہ اور زبیر لڑائی سے الگ ہو کر وفات پا چکے تھے، عائشہ کو مدینہ واپس بھیجا گیا اور علی نے ابن عباس کو بصرہ کا گورنر بنایا۔ مقتولین کی تعداد مصادر میں چھ ہزار سے تیس ہزار تک بتائی گئی ہے، اور مضمون کی مصنفہ بڑے عدد کو مبالغہ آمیز قرار دیتی ہیں۔"
  fr: "Ali partit pour Bassora après que Talha et al-Zubayr lui eurent demandé congé ; il campa à Dhi Qar et envoya al-Hasan et Ammar ibn Yasir à Koufa pour soulever les gens. Puis eut lieu la bataille du Chameau, où al-Zubayr ibn al-Awwam fut tué. Ali se rendit ensuite auprès d'Aïcha, et les gens de Bassora lui prêtèrent allégeance {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. L'index place le récit de la bataille en 36 H {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. Selon al-Suyuti, Talha et al-Zubayr se rendirent à La Mecque, emmenèrent Aïcha avec eux et allèrent à Bassora pour réclamer vengeance du sang d'Uthman ; Ali les rencontra à Bassora. La bataille eut lieu en Jumada II 36 H ; Talha et al-Zubayr y furent tués, et les morts furent treize mille. Ali resta quinze nuits à Bassora puis revint à Koufa {cite:tarikh-khulafa-minhaj-1434 p. 294}. Al-Mas'udi mentionne que les morts du Chameau, de Bassora et d'ailleurs, furent treize mille, et que le camp d'Ali en perdit cinq mille, bien que les gens en aient disputé : celui qui minimisait disait sept mille et celui qui exagérait dix mille, selon le penchant de chacun pour l'un ou l'autre camp {cite:muruj-al-dhahab p. 645}. Ali ordonna qu'on n'achève aucun blessé, qu'on ne tue aucun captif, qu'on ne poursuive aucun fuyard, qu'on ne découvre la nudité de personne, qu'on ne mutile aucun cadavre, et que nul ne touche à leurs biens, sauf les armes, les montures et les esclaves, hommes et femmes, de leur camp. Il sortit tête nue sur la mule du Messager de Dieu ; al-Zubayr se rappela les paroles du Prophète : « Tu le combattras alors que tu seras injuste envers lui », et rebroussa chemin. Al-Zubayr fut tué par Amr ibn Jurmuz alors qu'il priait dans le Wadi al-Siba'. Marwan ibn al-Hakam atteignit Talha d'une flèche à la veine du bras et le tua, tandis que Talha récitait : « Le regret d'al-Kasi, quand j'ai cherché à plaire aux Banu Jurm, comme je l'imaginais » {cite:muruj-al-dhahab p. 655-658}. Ali entra dans le trésor de Bassora et dit : « Ô jaune, trompe un autre que moi ! Ô blanc, trompe un autre que moi ! » Puis il ordonna qu'on le partage entre ceux qui étaient avec lui, cinq cents chacun, eux qui étaient douze mille, et prit pour lui une seule part comme l'un d'eux. Il nomma Abd Allah ibn Abbas sur Bassora et partit pour Koufa {cite:muruj-al-dhahab p. 664}. Dans son analyse, al-Sallabi estime que la main des Saba'iyya, partisans d'Ibn Saba, dans l'attisement du combat entre les deux camps fait presque l'accord des savants ; il cite al-Baqillani selon qui les meurtriers d'Uthman craignaient d'être démasqués et complotèrent d'ouvrir la guerre entre les camps, et Ibn Hazm selon qui les pires des meurtriers d'Uthman fondirent de nuit sur le camp de Talha et d'al-Zubayr ; et que Ka'b ibn Sur, cadi de Bassora, s'avança en portant le mushaf et fut abattu d'une flèche, le mushaf à la main {cite:sallabi-ali-tawzi-2004 p. 488-490} {cite:sallabi-ali-tawzi-2004 p. 494-495}. Dans le récit académique de l'Encyclopédie de l'Islam, la bataille fut livrée près de Bassora en Jumada II 36 H, vers novembre-décembre 656, entre Ali et Aïcha avec Talha et al-Zubayr ; elle prit fin quand le chameau eut les jarrets tranchés et que Talha et al-Zubayr se furent retirés du combat et furent morts. Aïcha fut renvoyée à Médine et Ali nomma Ibn Abbas gouverneur de Bassora."
  es: "Ali partió hacia Basora después de que Talha y al-Zubayr le pidieran permiso; acampó en Dhi Qar y envió a al-Hasan y Ammar ibn Yasir a Kufa para despertar al pueblo. Luego tuvo lugar la Batalla del Camello, en la que murió al-Zubayr ibn al-Awwam. Ali entró entonces en Aisha, y el pueblo de Basora le juró lealtad {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. El índice sitúa el relato de la batalla en el año 36 de la Hégira {cite:tabari-tarikh-abu-al-fadl j.4 p.583}. Según al-Suyuti, Talha y al-Zubayr fueron a La Meca, llevaron a Aisha con ellos y fueron a Basora buscando venganza por la sangre de Uthman; Ali los encontró en Basora. La batalla tuvo lugar en Jumada II del año 36 de la Hégira; Talha y al-Zubayr fueron asesinados allí, y los muertos sumaron trece mil. Ali permaneció en Basora quince noches y luego regresó a Kufa {cite:tarikh-khulafa-minhaj-1434 p. 294}. Al-Mas'udi menciona que los muertos del Camello, de Basora y otros lugares, sumaron trece mil, y que el bando de Ali perdió cinco mil, aunque la gente discutió esto: el que lo minimizó dijo siete mil y el que lo maximizó dijo diez mil, dependiendo de la inclinación de cada persona hacia un lado u otro {cite:muruj-al-dhahab p. 645}. Ali ordenó que ningún hombre herido fuera rematado, ningún cautivo asesinado, ningún fugitivo perseguido, nadie expuesto desnudo, ningún cadáver mutilado, y que nadie se acercara a su propiedad excepto las armas, monturas y esclavos y esclavas en su campamento. Salió con la cabeza descubierta en la mula del Mensajero de Dios; Al-Zubayr recordó las palabras del Profeta: «Lucharás contra él mientras le haces daño», y regresó. Al-Zubayr fue asesinado por Amr ibn Jurmuz mientras oraba en Wadi al-Siba'. Marwan ibn al-Hakam disparó a Talha en la vena del brazo y lo mató, mientras Talha recitaba: «El arrepentimiento de al-Kasi, cuando busqué el placer de Banu Jurm, como lo imaginé» {cite:muruj-al-dhahab p. 655-658}. Ali entró en el tesoro de Basora y dijo: «¡Oh, amarillo, engaña a otro que a mí! ¡Oh, blanco, engaña a otro que a mí!». Luego ordenó que se repartiera entre los que estaban con él, quinientos cada uno, siendo ellos doce mil, y tomó para sí una sola parte como uno de ellos. Nombró a Abd Allah ibn Abbas al frente de Basora y fue a Kufa {cite:muruj-al-dhahab p. 664}. En su análisis, al-Sallabi sostiene que la mano de los Sabaiyya, los partidarios de Ibn Saba, en avivar la lucha entre los dos bandos es un hecho casi unánime entre los eruditos; cita a al-Baqillani que los asesinos de Uthman temían ser descubiertos y conspiraron para iniciar la guerra entre los bandos, y a Ibn Hazm que los más crueles entre los asesinos de Uthman atacaron el campamento de Talha y al-Zubayr por la noche; y que Ka'b ibn Sur, el cadí de Basora, avanzó portando el mushaf y fue abatido a tiros con él en la mano {cite:sallabi-ali-tawzi-2004 p. 488-490} {cite:sallabi-ali-tawzi-2004 p. 494-495}. En la Enciclopedia del Islam, la batalla se libró cerca de Basora en Jumada II del año 36 de la Hégira, aproximadamente entre noviembre y diciembre de 656, entre Ali y Aisha, junto con Talha y al-Zubayr. Terminó cuando el camello quedó inmovilizado y Talha y al-Zubayr se retiraron del combate y murieron. Aisha fue enviada de regreso a Medina y Ali nombró a Ibn Abbas gobernador de Basora."
  tr: "Ali ibn Abi Talib, Talha ve Zubeyr'in iznini aldıktan sonra Basra'ya gitti. Zikar'da kamp kurdu ve halkı bir araya getirmek için Hasan ve Ammar ibn Yasir'i Kufa'ya gönderdi. Ardından Deve Muharebesi gerçekleşti ve bu muharebede Zubeyr ibn el-Evvem öldürüldü. Ali daha sonra Ayşe'nin yanına gitti ve Basra halkı ona biat etti. Dizin, 36 Hicri yılında gerçekleşen muharebenin anlatımını içermektedir. El-Suyuti'ye göre, Talha ve Zubeyr Mekke'ye gittiler, Ayşe'yi yanlarına aldılar ve Osman'ın kanının intikamını almak için Basra'ya gittiler. Ali onlarla Basra'da buluştu ve muharebe 36 Hicri yılının Cemâde el-Ahiret ayında gerçekleşti. Talha ve Zubeyr öldürüldü ve ölü sayısı on üç bine ulaştı. Ali on beş gece Basra'da kaldı ve sonra Kufa'ya döndü. 294} El-Mas'udi, Deve Muharebesi'nde Basra halkından ve diğerlerinden on üç bin kişinin öldürüldüğünü ve Ali'nin beş bin arkadaşının da öldürüldüğünü belirtmiştir. Bu konuda görüş ayrılığı vardı; kimileri yedi bin, kimileri ise on bin diyordu; bu, insanların her iki tarafa olan eğilim ve arzularına göre değişiyordu. {Kaynak: Muruj-al-Dhahab s. 645}. Ali, yaralıları öldürmemelerini, esirleri öldürmemelerini, kaçanları takip etmemelerini, mahrem yerlerini açığa çıkarmamalarını, ölüleri sakatlamamalarını ve kamplarında bulunan silahlar, atlar, köleler ve kadın köleler dışında mallarına yaklaşmamalarını emretti. Peygamberin katırına başı açık binerek çıktı ve Zübeyr, Peygamberin kendisine söylediği \"Sen haksızken onunla savaşacaksın\" sözünü hatırlayarak geri döndü. El-Zubayr, Vadi el-Siba'da namaz kılarken Amr ibn Jurmuz'u öldürdü ve Mervan ibn el-Hakam, Talha'yı şah damarından vurarak öldürdü. El-Zubayr, \"Banu Jurm'un onayını aradığımda el-Kisa'i'nin pişmanlığı, bence...\" dedi. {kaynak:muruj-al-dhahab s. 655-658} Basra hazinesine girdi ve \"Ey sarı olan, başkasını kandır! Ey beyaz olan, başkasını kandır!\" dedi. Sonra, yanındaki on iki bin kişiden beş yüzünün paylaştırılmasını emretti ve kendisi de onlardan bir pay aldı. Abdullah ibn Abbas'ı vali olarak atadı ve Kufa'ya yürüdü. {kaynak:muruj-al-dhahab s. 664} Al-Sallabi, analizinde, İbn Saba'nın destekçileri olan Saba'iyye'nin iki taraf arasındaki çatışmayı kışkırtmadaki etkisinin, âlimlerin neredeyse oybirliğiyle hemfikir olduğu bir konu olduğunu belirtiyor. Al-Baqillani'nin, Osman'ın katillerinin ilişkilerinin ortaya çıkmasından korktukları için iki taraf arasında savaş çıkarmak üzere komplo kurdukları konusunda hemfikir olduklarını söylediğini aktarıyor. Ayrıca İbn Hazm'ın, Osman'ın katilleri arasındaki yozlaşmış olanların geceleyin Talha ve el-Zubayr'ın ordusuna pusu kurduklarını; Basra kadısı Ka'b ibn Sur'un Kur'an'ı taşıyarak ilerlediğini, bunun üzerine oklarla Kur'an'ı parçaladıklarını ve Kur'an elinde iken öldüğünü söylediğini aktarıyor. {cite:sallabi-ali-tawzi-2004 s. 488-490} {cite:sallabi-ali-tawzi-2004 s. 494-495} İslam Ansiklopedisi'nin akademik sunumunda, savaşın Hicri 36. yılda Cemâde-i Ahiret'te, yaklaşık Kasım-Aralık 656'da, Basra yakınlarında Ali, Ayşe, Talha ve Zubeyr arasında gerçekleştiği belirtilir. Savaş, devenin sakatlanması ve Talha ile Zubeyr'in savaştan çekilmesi, ardından da öldürülmesiyle sona ermiştir. Ayşe Medine'ye geri dönmüş ve Ali, İbn Abbas'ı Basra'nın başına atamıştır."
  id: "Ali bin Abi Talib pergi ke Basra setelah Talha dan Zubayr meminta izinnya. Ia berkemah di Dhi Qar dan mengirim al-Hasan dan Ammar bin Yasir ke Kufa untuk mengumpulkan rakyat. Kemudian terjadilah Perang Unta, di mana Zubayr bin al-Awwam terbunuh. Ali kemudian pergi menemui Aisyah, dan penduduk Basra berjanji setia kepadanya. Indeks tersebut mencakup catatan pertempuran pada tahun 36 H. Menurut al-Suyuti, Talha dan Zubayr pergi ke Mekah, membawa Aisyah, dan pergi ke Basra untuk membalas dendam atas darah Utsman. Ali menemui mereka di Basra, dan pertempuran terjadi pada Jumada al-Akhirah tahun 36 H. Talha dan Zubayr terbunuh, dan jumlah korban tewas mencapai tiga belas ribu. Ali tinggal di Basra selama lima belas malam dan kemudian kembali ke Kufa. 294}. Al-Mas'udi menyebutkan bahwa jumlah korban tewas dalam Perang Unta dari penduduk Basra dan lainnya adalah tiga belas ribu, dan lima ribu sahabat Ali tewas. Terdapat perbedaan pendapat mengenai hal ini, dengan pihak yang meremehkan mengatakan tujuh ribu dan pihak yang melebih-lebihkan mengatakan sepuluh ribu, sesuai dengan kecenderungan dan keinginan orang-orang terhadap masing-masing pihak {kutip:muruj-al-dhahab hlm. 645}. Ali memerintahkan agar mereka tidak menghabisi yang terluka, tidak membunuh tawanan, tidak mengejar orang yang melarikan diri, tidak memperlihatkan bagian tubuh yang seharusnya, tidak memutilasi orang mati, dan tidak mendekati harta benda mereka kecuali yang ada di perkemahan mereka berupa senjata, kuda, budak, dan budak perempuan. Ia keluar tanpa mengenakan penutup kepala dengan menunggang keledai Nabi, dan Al-Zubayr teringat sabda Nabi kepadanya, \"Kamu akan melawannya sementara kamu berada di pihak yang salah,\" maka ia kembali. Al-Zubayr membunuh Amr ibn Jurmuz saat sedang shalat di Wadi al-Siba', dan Marwan ibn al-Hakam menembak Talha di pembuluh darah lehernya, membunuhnya, sementara dia berkata, \"Penyesalan al-Kisa'i ketika aku mencari persetujuan Bani Jurm, menurut pendapatku\" {kutip:muruj-al-dhahab hlm. 655-658}, dan dia memasuki perbendaharaan Basra dan berkata, “Wahai yang kuning, tipu orang lain! Wahai yang putih, tipu orang lain!” Kemudian dia memerintahkan agar lima ratus dibagi di antara orang-orang yang bersamanya, yang berjumlah dua belas ribu, dan dia mengambil satu bagian untuk dirinya sendiri dari mereka. Dia mengangkat Abdullah ibn Abbas sebagai gubernur dan berbaris ke Kufa. {kutip:muruj-al-dhahab hlm. 664}. Al-Sallabi, dalam analisisnya, melanjutkan dengan mengatakan bahwa pengaruh Saba’iyyah, pendukung Ibn Saba’, dalam menghasut pertempuran antara kedua pihak adalah sesuatu yang hampir disepakati secara bulat oleh para ulama. Ia mengutip al-Baqillani yang mengatakan bahwa mereka sepakat bahwa para pembunuh Utsman takut urusan mereka akan terbongkar, sehingga mereka bersekongkol untuk menyulut perang antara kedua pihak. Ia juga mengutip Ibn Hazm yang mengatakan bahwa orang-orang korup di antara para pembunuh Utsman menyergap pasukan Talha dan al-Zubayr di malam hari; dan bahwa Ka’b ibn Sur, hakim Basra, maju sambil membawa Al-Qur'an, sehingga mereka merobeknya dengan panah, dan ia meninggal dengan Al-Qur'an di tangannya. {cite:sallabi-ali-tawzi-2004 p. 488-490} {cite:sallabi-ali-tawzi-2004 p. 494-495} Dalam penyajian akademis Ensiklopedia Islam, pertempuran terjadi di dekat Basra pada Jumada al-Akhirah tahun 36 H, sekitar November-Desember 656 M, antara Ali dan Aisyah, bersama Talha dan Zubair. Pertempuran berakhir dengan unta yang lumpuh dan mundurnya Talha dan Zubair dari pertempuran, kemudian mereka terbunuh. Aisyah dikembalikan ke Madinah dan Ali menunjuk Ibnu Abbas sebagai penguasa Basra."
