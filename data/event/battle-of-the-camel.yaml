id: event/battle-of-the-camel
class: event
kind: battle
label: { en: "The Battle of the Camel (al-Jamal)", ar: "موقعة الجمل" }
summary:
  en: "After the killing of Uthman, Ali's accession brought a dispute over the pursuit of his killers; Talha, al-Zubayr and Aisha went to Basra, and a clash broke out between their men and Ali's army. Aisha's camel fell, and she was later escorted back to Medina with honour."
  ar: "بعد مقتل عثمان وبيعة علي بالخلافة، اختلف الناس في سبيل القصاص من قتلته؛ فسار طلحة والزبير وعائشة إلى البصرة، ووقع القتال بين الفريقين رغم محاولات الصلح، فسقط جمل عائشة وحُمل هودجها بعيداً عن القتال، ثم جهّزها علي للعودة إلى المدينة."
