perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "The book follows the Sunni frame: Aisha is honoured as a Mother of the Believers, she regretted her journey to Basra and wept over it, and Ali sent her back with honour and praise.", ar: "يعرض الكتاب الرواية السنية: عائشة أم المؤمنين، ندمت على مسيرها إلى البصرة وبكت عليه، وأعادها علي إليها مكرّمة." }
