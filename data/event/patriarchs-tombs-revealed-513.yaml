label: { ar: "ظهور قبور إبراهيم وإسحاق ويعقوب سنة 513", en: "The Revealing of the Tombs of Ibrahim, Ishaq and Ya'qub in 513", es: "El descubrimiento de las tumbas de Ibrahim, Ishaq y Ya'qub en 513", fr: "La révélation des tombeaux d'Ibrahim, d'Ishaq et de Ya'qub en 513", ur: "513 میں ابراہیم، اسحاق اور یعقوب کے مقبروں کا انکشاف", tr: "İbrahim, İshak ve Yakup'un mezarları 513 yılında ortaya çıktı.", id: "Makam Abraham, Ishak, dan Yakub muncul pada tahun 513." }
summary:
  ar: "في سنة ثلاث عشرة وخمسمائة ظهر قبر إبراهيم خليل الله وإسحاق ويعقوب ورآهم جماعة لم تبل أجسادهم، وعندهم في تلك المغارة قناديل من ذهب وفضة؛ رواية حمزة بن القلانسي في تاريخه {cite:shadharat-dhahab p. 515}."
  en: "In 513 the tombs of Ibrahim, Ishaq and Ya'qub were uncovered — people saw them with their bodies undecayed, and in the cave were lamps of gold and silver; the report of Hamza b. al-Qalanisi in his history {cite:shadharat-dhahab p. 515}."
  es: "En 513 se descubrieron las tumbas de Ibrahim, Ishaq y Ya'qub; la gente las vio con sus cuerpos intactos, y en la cueva había lámparas de oro y plata; el informe de Hamza b. al-Qalanisi en su historia {cite:shadharat-dhahab p. 515}."
  fr: "En 513, les tombes d'Ibrahim, d'Ishaq et de Ya'qub furent découvertes — on les vit avec leurs corps intacts, et dans la grotte se trouvaient des lampes d'or et d'argent; rapport de Hamza b. al-Qalanisi dans son histoire {cite:shadharat-dhahab p. 515}."
  ur: "513 میں ابراہیم، اسحاق اور یعقوب کی قبریں کھلی ہوئی تھیں - لوگوں نے انہیں ان کی لاشوں کے ساتھ دیکھا، اور غار میں سونے اور چاندی کے چراغ تھے۔ حمزہ بی کی رپورٹ القلانیسی نے اپنی تاریخ میں {حوالہ: شدھارت ذہاب ص۱۱۱۔ 515}۔"
  tr: "513 yılında, Allah'ın dostu İbrahim'in, İshak'ın ve Yakup'un kabri ortaya çıktı ve bir grup insan onları gördü; bedenleri çürümemişti ve o mağarada altın ve gümüş lambalar vardı; Hamza bin Al-Qalanisi'nin tarih kitabındaki rivayetine göre {şadharat-dhahab s. 515}."
  id: "Pada tahun 513, makam Ibrahim, sahabat Allah, serta Ishak dan Yakub tampak, dan sekelompok orang melihat mereka yang jasadnya belum membusuk, dan di dalam gua itu mereka memiliki lampu emas dan perak; riwayat Hamza bin Al-Qalanisi dalam sejarahnya {kutip:shadharat-dhahab hlm. 515}."
