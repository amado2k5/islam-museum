label: { ar: "غزوة صرد بن عبد الله لجرش وإسلام أهلها", en: "Surad ibn Abdullah's campaign against Jurash and the conversion of its people" }
summary:
  ar: "سار صرد بأمر النبي حتى نزل بجرش، مدينة مغلقة فيها قبائل من اليمن لجأت إليهم خثعم، فحاصرهم نحو شهر ثم رجع، فلما بلغ جبل شكر ظنوا أنه منهزم وطلبوه فعطف عليهم فقتلهم قتلاً شديداً. وكان أهل جرش قد بعثوا رجلين إلى النبي، فقال لهما بعد العصر: إن بُدن الله لتُنحر الآن عند شكر، فسألاه أن يدعو فقال: اللهم ارفع عنهم، فوجدا قومهما أصيبوا في ذلك اليوم والساعة. ثم قدم وفد جرش فأسلموا، وحمى لهم النبي حمى حول قريتهم للفرس والراحلة وبقرة الحرث."
  en: "Surad marched at the Prophet's order to Jurash, a walled town sheltering Yemeni tribes and Khath'am, besieged it for about a month and withdrew; when at the mountain of Shakar its people pursued him thinking him beaten, he turned and slaughtered them. Jurash had sent two men to the Prophet, who told them after the afternoon prayer that God's sacrificial camels were being slaughtered at Shakar at that moment, then prayed at their request that it be lifted; they found their people struck that very day and hour. The delegation of Jurash then came and embraced Islam, and the Prophet set a protected reserve around their village for the horse, the mount and the plough-ox."
