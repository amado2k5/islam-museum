id: event/surad-campaign-against-jurash
class: event
kind: siege
label: { ar: "غزوة صرد بن عبد الله لجرش وإسلام أهلها", en: "Surad ibn Abdullah's campaign against Jurash and the conversion of its people", es: "La campaña de Surad ibn Abdullah contra Jurash y la conversión de su gente.", fr: "La campagne de Surad ibn Abdullah contre Jurash et la conversion de sa population", ur: "جرش کے خلاف سورد بن عبداللہ کی مہم اور اس کے لوگوں کی تبدیلی", tr: "Surad ibn Abdullah'ın Ceraş'a düzenlediği baskın ve halkının İslam'a geçmesi", id: "Penyerbuan Surad ibn Abdullah ke Jarash dan pengislaman penduduknya." }
summary:
  ar: "سار صرد بأمر النبي حتى نزل بجرش، مدينة مغلقة فيها قبائل من اليمن لجأت إليهم خثعم، فحاصرهم نحو شهر ثم رجع، فلما بلغ جبل شكر ظنوا أنه منهزم وطلبوه فعطف عليهم فقتلهم قتلاً شديداً. وكان أهل جرش قد بعثوا رجلين إلى النبي، فقال لهما بعد العصر: إن بُدن الله لتُنحر الآن عند شكر، فسألاه أن يدعو فقال: اللهم ارفع عنهم، فوجدا قومهما أصيبوا في ذلك اليوم والساعة. ثم قدم وفد جرش فأسلموا، وحمى لهم النبي حمى حول قريتهم للفرس والراحلة وبقرة الحرث."
  en: "Surad marched at the Prophet's order to Jurash, a walled town sheltering Yemeni tribes and Khath'am, besieged it for about a month and withdrew; when at the mountain of Shakar its people pursued him thinking him beaten, he turned and slaughtered them. Jurash had sent two men to the Prophet, who told them after the afternoon prayer that God's sacrificial camels were being slaughtered at Shakar at that moment, then prayed at their request that it be lifted; they found their people struck that very day and hour. The delegation of Jurash then came and embraced Islam, and the Prophet set a protected reserve around their village for the horse, the mount and the plough-ox."
  es: "Surad marchó por orden del Profeta hacia Jurash, una ciudad amurallada que albergaba tribus yemeníes y a Khath'am, la sitió durante aproximadamente un mes y luego se retiró. Cuando en el monte Shakar sus habitantes lo persiguieron creyendo que había sido derrotado, él se dio la vuelta y los masacró. Jurash había enviado a dos hombres al Profeta, quien les dijo después de la oración de la tarde que los camellos de sacrificio de Dios estaban siendo sacrificados en Shakar en ese momento, y luego oró a petición de ellos para que se levantara la prohibición; encontraron a su gente atacada ese mismo día y a esa misma hora. La delegación de Jurash llegó entonces y abrazó el Islam, y el Profeta estableció una reserva protegida alrededor de su aldea para el caballo, la montura y el buey de arado."
  fr: "Sur l'ordre du Prophète, Surad marcha sur Jurash, ville fortifiée abritant des tribus yéménites et Khath'am. Il l'assiégea pendant environ un mois, puis se retira. Arrivé au mont Shakar, ses habitants le poursuivirent, le croyant vaincu. Il se retourna et les massacra. Jurash avait envoyé deux hommes auprès du Prophète, qui leur annonça, après la prière de l'après-midi, que les chameaux sacrificiels de Dieu étaient en train d'être immolés à Shakar. Il pria ensuite, à leur demande, pour que le sacrifice soit levé. Ils découvrirent que leur peuple était frappé ce jour-là même. La délégation de Jurash revint alors se convertir à l'islam, et le Prophète établit une réserve protégée autour de leur village pour les chevaux, les montures et les bœufs de labour."
  ur: "سورد نے نبی کے حکم پر جراش کی طرف کوچ کیا، جو کہ یمنی قبائل اور خثعم کو پناہ دینے والے ایک فصیل دار شہر ہے، تقریباً ایک ماہ تک اس کا محاصرہ کیا اور پیچھے ہٹ گیا۔ جب شکر کے پہاڑ پر اس کے لوگوں نے اس کا تعاقب کیا یہ سمجھ کر کہ اسے مارا گیا تو اس نے پلٹا اور انہیں ذبح کردیا۔ جراش نے دو آدمیوں کو نبی کے پاس بھیجا، جنہوں نے عصر کی نماز کے بعد انہیں بتایا کہ اس وقت شکر میں خدا کے قربانی کے اونٹ ذبح کیے جا رہے ہیں، پھر ان کی درخواست پر دعا کی کہ اسے اٹھا لیا جائے۔ انہوں نے اپنے لوگوں کو اسی دن اور گھنٹے مارا ہوا پایا۔ پھر جراش کا وفد آیا اور اسلام قبول کر لیا، اور نبی نے ان کے گاؤں کے ارد گرد گھوڑے، سوار اور ہل کے بیل کے لیے ایک محفوظ جگہ رکھی۔"
  tr: "Surad, Peygamber'in emriyle Yemen'den gelen kabilelerin, özellikle de Hatim kabilesinin yaşadığı surlarla çevrili bir şehir olan Ceraş'a kadar yürüdü. Onları yaklaşık bir ay kuşattıktan sonra geri döndü. Cebel Şukr'a vardığında, kaçtığını sandılar ve onu takip ettiler, ancak Surad geri döndü ve onları acımasızca katletti. Ceraş halkı Peygamber'e iki adam gönderdi ve Peygamber, ikindi namazından sonra onlara, \"Şukr'da Allah'ın kurbanlık hayvanları kesiliyor\" dedi. Onlar için dua etmesini istediler ve Peygamber, \"Ey Allah'ım, onlara yardım et\" dedi. Halklarının o gün ve o saatte sıkıntıya düştüğünü gördüler. Daha sonra Ceraş'tan bir heyet geldi ve İslam'ı kabul etti ve Peygamber, köylerinin etrafında, tarım için kullandıkları atları, develeri ve büyükbaş hayvanları için korunaklı bir alan verdi."
  id: "Surad berbaris atas perintah Nabi hingga mencapai Jarash, sebuah kota berbenteng yang dihuni oleh suku-suku dari Yaman, termasuk suku Khatham. Ia mengepung mereka selama sekitar satu bulan, kemudian kembali. Ketika ia sampai di Jabal Shukr, mereka mengira ia telah melarikan diri dan mengejarnya, tetapi ia berbalik dan membantai mereka dengan kejam. Penduduk Jarash telah mengirim dua orang kepada Nabi, yang memberi tahu mereka setelah salat Asar, \"Hewan kurban Allah sedang disembelih sekarang di Shukr.\" Mereka meminta beliau untuk mendoakan mereka, dan beliau berkata, \"Ya Allah, bebaskanlah mereka.\" Mereka mendapati kaum mereka telah ditimpa musibah pada hari dan jam itu juga. Kemudian sebuah delegasi dari Jarash tiba dan memeluk Islam, dan Nabi memberi mereka daerah yang dilindungi di sekitar desa mereka untuk kuda, unta, dan sapi yang digunakan untuk pertanian."
