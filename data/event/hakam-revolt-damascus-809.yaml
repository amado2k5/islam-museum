summary:
  ar: "في شذرات الذهب سنة تسع وثمان مئة قامت فتن حكم وشيخ ونوروز حتى بويع حكم بالسلطنة بالشام ولقب بالعادل ثم قتل في أثناء ذلك كبا به فرسه فمات {cite:shadharat-dhahab p. 88}."
  en: "809: the fitnas of the amirs Hakam, Shaykh and Nawruz in Syria — Hakam was acclaimed sultan with the title al-Adil, then mid-affair his horse stumbled and he died {cite:shadharat-dhahab p. 88}."
  es: "809: las fitnas de los emires Hakam, Shaykh y Nawruz en Siria: Hakam fue aclamado sultán con el título de al-Adil, luego en medio de un romance su caballo tropezó y murió {cita: shadharat-dhahab p. 88}."
  fr: "809: les fitnas des émirs Hakam, Shaykh et Nawruz en Syrie — Hakam fut acclamé sultan avec le titre d'al-Adil, puis au milieu de l'affaire, son cheval trébucha et il mourut {cite: shadharat-dhahab p. 88}."
  ur: "809: شام میں امیروں حاکم، شیخ اور نوروز کے فتنے - حاکم کو العدل کے لقب سے سلطان کہا جاتا تھا، پھر درمیان میں اس کے گھوڑے کو ٹھوکر لگی اور وہ مر گیا۔ 88}۔"
  tr: "Şadharat el-Dhahab'da, 809 yılında, Hakam, Şeyh ve Nevruz arasında çatışmalar yaşanmış, sonunda Hakam Levant Sultanı olarak biat yemini etmiş ve el-Adil unvanını almıştır. Daha sonra, o sırada atının tökezlemesi sonucu ölmüştür. {kaynak:şadharat-dhahab s. 88}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 809, terjadi konflik antara Hakam, Syekh, dan Nawruz hingga Hakam disumpah setia sebagai Sultan di Levant dan diberi gelar al-Adil. Kemudian, pada saat itu, ia terbunuh ketika kudanya tersandung dan ia meninggal. {cite:shadharat-dhahab hlm. 88}."
