  ar: "بالفرات أرضون أسلم أهلها عليها حين دخلها المسلمون وأرضون خرجت من أيدي أهلها إلى قوم مسلمين بهبات فصيرت عشرية وكانت خراجية فردها الحجاج إلى الخراج ثم ردها عمر بن عبد العزيز إلى الصدقة ثم ردها عمر بن هبيرة إلى الخراج فلما ولي هشام بن عبد الملك رد بعضها إلى الصدقة ثم إن المهدي جعلها كلها من أراضي الصدقة."
  en: "Euphrates lands whose holders surrendered them when the Muslims entered, or which passed to Muslim hands as gifts, were made ushr-lands; they had been kharaj — al-Hajjaj returned them to kharaj, Umar ibn Abd al-Aziz to sadaqa, Umar ibn Hubayra back to kharaj, Hisham part to sadaqa, and al-Mahdi at last made them all sadaqa-lands."
