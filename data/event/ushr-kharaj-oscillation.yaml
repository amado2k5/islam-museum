summary:
  ar: "بالفرات أرضون أسلم أهلها عليها حين دخلها المسلمون وأرضون خرجت من أيدي أهلها إلى قوم مسلمين بهبات فصيرت عشرية وكانت خراجية فردها الحجاج إلى الخراج ثم ردها عمر بن عبد العزيز إلى الصدقة ثم ردها عمر بن هبيرة إلى الخراج فلما ولي هشام بن عبد الملك رد بعضها إلى الصدقة ثم إن المهدي جعلها كلها من أراضي الصدقة."
  en: "Euphrates lands whose holders surrendered them when the Muslims entered, or which passed to Muslim hands as gifts, were made ushr-lands; they had been kharaj — al-Hajjaj returned them to kharaj, Umar ibn Abd al-Aziz to sadaqa, Umar ibn Hubayra back to kharaj, Hisham part to sadaqa, and al-Mahdi at last made them all sadaqa-lands."
  es: "Las tierras del Éufrates cuyos propietarios las cedieron cuando entraron los musulmanes, o que pasaron a manos musulmanas como regalos, se convirtieron en tierras ushr; habían sido kharaj: al-Hajjaj las devolvió a kharaj, Umar ibn Abd al-Aziz a sadaqa, Umar ibn Hubayra de nuevo a kharaj, Hisham una parte a sadaqa, y al-Mahdi finalmente las convirtió todas en tierras sadaqa."
  fr: "Les terres de l'Euphrate dont les détenteurs les ont cédées lors de l'entrée des musulmans, ou qui sont passées entre les mains des musulmans en guise de dons, sont devenues des terres ushr; elles avaient été kharaj — al-Hajjaj les a rendues kharaj, Umar ibn Abd al-Aziz à sadaqa, Umar ibn Hubayra de nouveau kharaj, Hisham en a fait partie à sadaqa, et al-Mahdi les a finalement toutes transformées en terres sadaqa."
  ur: "فرات کی وہ سرزمین جن کے مالکان نے مسلمانوں کے داخل ہونے پر انہیں ہتھیار ڈال دیے، یا جو تحفے کے طور پر مسلمانوں کے ہاتھ میں دے دیے گئے، انہیں عشر زمین بنا دیا گیا۔ وہ خارج تھے - الحجاج نے ان کو خرج میں واپس کر دیا، عمر بن عبدالعزیز نے صدقہ، عمر بن ہبیرہ نے خرج میں، ہشام نے حصہ صدقہ کیا اور آخر میں المہدی نے ان سب کو صدقہ کی زمین بنا دیا۔"
