label: { ar: "توبة أبي الوفاء ابن عقيل", en: "The recantation of Abu'l-Wafa' Ibn 'Aqil", es: "La retractación de Abu'l-Wafa' Ibn 'Aqil", fr: "La rétractation d'Abu'l-Wafa' Ibn 'Aqil" }
summary:
  ar: "في يوم الأربعاء عاشر محرم سنة خمس وستين وأربعمائة حضر أبو الوفاء علي بن عقيل الديوان ومعه جماعة من الحنابلة فاصطلحوا، وكتب ابن عقيل بخطه نسخة توبته: «يقول علي بن عقيل إني أبرأ إلى الله تعالى من مذاهب المبتدعة والاعتزال وغيره، ومن صحبة أربابه وتعظيم أئمتهم والترحم على أسلافهم، وما كنت علّقته ووُجد بخطي به من مذاهبهم وضلالاتهم فأنا تائب إلى الله تعالى من كتابته، وإنه لا يحل كتابته ولا قراءته ولا اعتقاده»، وأقرّ أنه علّق مسألة الليل في جزء عن قوم قالوا «هو أجسام سود»، وأنه كان اعتقد في الحلاج أنه من أهل الدين والزهد والكرامات ونصّ على ذلك في جزء عمله «وأنا تائب إلى الله تعالى منه، وإنه قُتل بإجماع فقهاء عصره وأصابوا في ذلك وأخطأ هو»، وشهد عليه بذلك جماعة كثيرة من الشهود؛ ومضى ابن عقيل إلى بيت الشريف أبي جعفر فصالحه {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
  en: "On Wednesday 10 Muharram 465, Abu'l-Wafa' Ali ibn 'Aqil — the most learned Hanbali of his age — appeared at the diwan with the Hanbali elders and made peace, writing out in his own hand a recantation: renouncing the doctrines of the innovators and the Mu'tazila, the keeping of their company and veneration of their imams, declaring unlawful all he had written of their teaching — including his treatise on the Night Journey ('a company of men said they are black bodies') and his profession of Hallaj's saintliness ('he was killed by the consensus of the jurists of his time and they were right; he erred') — witnessed by a great company, after which he went to make his peace with Sharif Abu Ja'far {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
  es: "El miércoles 10 de Muharram de 465, Abu'l-Wafa' Ali ibn 'Aqil —el hanbalí más erudito de su época— apareció en el diwan con los ancianos hanbalíes e hizo las paces, escribiendo de su puño y letra una retractación: renunciando a las doctrinas de los innovadores y los mu'tazilíes, a mantener su compañía y a venerar a sus imanes, declarando ilícito todo lo que había escrito sobre sus enseñanzas —incluido su tratado sobre el Viaje Nocturno ('un grupo de hombres dijo que son cuerpos negros') y su profesión de la santidad de Hallaj ('fue asesinado por consenso de los juristas de su tiempo y ellos tenían razón; él erró')— en presencia de una gran compañía, después de lo cual fue a hacer las paces con Sharif Abu Ja'far {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
  fr: "Le mercredi 10 Muharram 465, Abu'l-Wafa' Ali ibn 'Aqil, le plus savant Hanbalite de son époque, se présenta au diwan avec les anciens Hanbalites et fit la paix, rédigeant de sa propre main une rétractation: renonçant aux doctrines des innovateurs et des Mu'tazilites, à fréquenter leur compagnie et à vénérer leurs imams, déclarant illicite tout ce qu'il avait écrit sur leur enseignement — y compris son traité sur le Voyage nocturne (« un groupe d'hommes a dit qu'ils étaient des corps noirs ») et sa profession de foi sur la sainteté de Hallaj (« il a été tué par le consensus des juristes de son temps et ils avaient raison; il s'est trompé ») — en présence d'une grande assemblée, après quoi il alla faire la paix avec Sharif Abu Ja'far {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
