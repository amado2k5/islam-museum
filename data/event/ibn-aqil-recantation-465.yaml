id: event/ibn-aqil-recantation-465
class: event
kind: declaration
label: { ar: "توبة أبي الوفاء ابن عقيل" }
summary:
  ar: "في يوم الأربعاء عاشر محرم سنة خمس وستين وأربعمائة حضر أبو الوفاء علي بن عقيل الديوان ومعه جماعة من الحنابلة فاصطلحوا، وكتب ابن عقيل بخطه نسخة توبته: «يقول علي بن عقيل إني أبرأ إلى الله تعالى من مذاهب المبتدعة والاعتزال وغيره، ومن صحبة أربابه وتعظيم أئمتهم والترحم على أسلافهم، وما كنت علّقته ووُجد بخطي به من مذاهبهم وضلالاتهم فأنا تائب إلى الله تعالى من كتابته، وإنه لا يحل كتابته ولا قراءته ولا اعتقاده»، وأقرّ أنه علّق مسألة الليل في جزء عن قوم قالوا «هو أجسام سود»، وأنه كان اعتقد في الحلاج أنه من أهل الدين والزهد والكرامات ونصّ على ذلك في جزء عمله «وأنا تائب إلى الله تعالى منه، وإنه قُتل بإجماع فقهاء عصره وأصابوا في ذلك وأخطأ هو»، وشهد عليه بذلك جماعة كثيرة من الشهود؛ ومضى ابن عقيل إلى بيت الشريف أبي جعفر فصالحه {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
  en: "On Wednesday 10 Muharram 465, Abu'l-Wafa' Ali ibn 'Aqil — the most learned Hanbali of his age — appeared at the diwan with the Hanbali elders and made peace, writing out in his own hand a recantation: renouncing the doctrines of the innovators and the Mu'tazila, the keeping of their company and veneration of their imams, declaring unlawful all he had written of their teaching — including his treatise on the Night Journey ('a company of men said they are black bodies') and his profession of Hallaj's saintliness ('he was killed by the consensus of the jurists of his time and they were right; he erred') — witnessed by a great company, after which he went to make his peace with Sharif Abu Ja'far {cite:muntazam-ibn-al-jawzi j.8 p.617-618}."
