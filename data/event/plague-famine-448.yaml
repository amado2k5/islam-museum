label: { ar: "الطاعون والمجاعة العظمى", en: "The Great Plague and Famine", es: "La Gran Plaga y la Hambruna", fr: "La Grande Peste et la Famine", ur: "عظیم طاعون اور قحط", tr: "Veba ve Büyük Kıtlık", id: "Wabah dan Kelaparan Besar" }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة عمّ الغلاء والوباء بغداد ومصر ومكة والحجاز والبصرة والموصل وخراسان والجبال والدنيا كلها، حتى بلغ الكر من الحنطة ببغداد تسعين دينارًا ثم مائة وثمانين، وكان يموت في اليوم الألف نفس وكفّن السلطان من ماله ثمانية عشر ألف إنسان وحُمل كل أربعة وخمسة في تابوت، وباع عطّار في يوم ألف قارورة فيها شراب {cite:muntazam-ibn-al-jawzi j.8 p.512-513}. وفي سنة ٤٤٩ ورد كتاب من تجار ما وراء النهر أن الوباء خرج من إقليمهم في يوم واحد ثمانية عشر ألف جنازة، وأُحصي من مات حتى كُتب الكتاب فكانوا ألف ألف وستمائة ألف وخمسين ألفًا، وأتى الخبر بمثله عن آذربيجان والأهواز وواسط والنيل ومطيراباذ والكوفة حتى كان يُحفر للعشرين زبية فيُلقون فيها؛ وأكل الفقراء الكلاب ونبشوا القبور، وشُوهدت امرأة تمضغ فخذ كلب ميت ورُؤي رجل شوى صبيّة في أتون فأكلها فقُتل، وسُدّت أبواب دور مات أهلها، وطُويت التجارات وليس للناس شغل إلا غسل الأموات ودفنهم، وتاب الناس وأراقوا الخمور وكسّروا المعازف ولزموا المساجد {cite:muntazam-ibn-al-jawzi j.8 p.521-522}."
  en: "The great plague-and-famine of 448–449: wheat at 90 then 180 dinars the kurr in Baghdad, a thousand deaths a day, the sultan shrouding 18,000 corpses at his own expense four and five to a bier; a Transoxianan merchants' letter counting 18,000 funerals in a single day and 1,650,000 dead before the ink dried — graves dug for twenty at a time, markets empty, the poor eating dogs and exhuming the dead, and a general repentance of wine-pouring and instrument-breaking {cite:muntazam-ibn-al-jawzi j.8 p.512-513,521-522}."
  es: "La gran plaga y hambruna de 448-449: el trigo a 90 y luego a 180 dinares el kurr en Bagdad, mil muertes al día, el sultán amortajando 18.000 cadáveres a su propio costo, cuatro y cinco por féretro; una carta de comerciantes de Transoxiana contabilizando 18.000 funerales en un solo día y 1.650.000 muertos antes de que se secara la tinta: tumbas cavadas para veinte a la vez, mercados vacíos, los pobres comiendo perros y exhumando a los muertos, y un arrepentimiento generalizado de derramar vino y romper instrumentos {cite:muntazam-ibn-al-jawzi j.8 p.512-513,521-522}."
  fr: "La grande peste et famine de 448-449: le blé à 90 puis 180 dinars le kurr à Bagdad, mille morts par jour, le sultan enveloppant à ses propres frais 18 000 cadavres, quatre ou cinq par brancard; une lettre de marchands transoxeans comptant 18 000 funérailles en une seule journée et 1 650 000 morts avant que l'encre ne sèche — des tombes creusées pour vingt à la fois, des marchés vides, les pauvres mangeant des chiens et exhumant les morts, et un repentir général de verser du vin et de briser des instruments {cite: muntazam-ibn-al-jawzi j.8 p.512-513,521-522}."
  ur: "448-449 کا عظیم طاعون اور قحط: بغداد میں 90 پر گندم پھر 180 دینار کُر، ایک دن میں ایک ہزار اموات، سلطان اپنے خرچ پر 18،000 لاشوں کو چار اور پانچ سے ایک بیئر پر کفن دیتا ہے۔ ٹرانس آکسیان کے تاجروں کا خط جس میں ایک ہی دن میں 18,000 جنازے اور سیاہی خشک ہونے سے پہلے 1,650,000 مردہ ہو گئے — ایک وقت میں بیس قبریں کھودی گئیں، بازار خالی، غریب کتے کھا رہے ہیں اور مُردوں کو نکال رہے ہیں، اور شراب بہانے اور ان کے استعمال سے عام توبہ۔ {حوالہ:منتظم ابن الجوزی ج8 ص512-513,521-522}۔"
  tr: "Hicri 448 yılında, Bağdat, Mısır, Mekke, Hicaz, Basra, Musul, Horasan, dağlar ve tüm dünyada kıtlık ve veba yayıldı; Bağdat'ta bir kurr buğdayın fiyatı önce doksan dinara, sonra yüz seksen dinara ulaştı. Her gün bin kişi öldü ve Sultan kendi parasıyla on sekiz bin kişiyi kefenledi; her tabuta dört veya beş kişi sığdırıldı. Bir parfümcü bir günde bin şişe şarap sattı. Hicri 449 yılında, nehrin ötesindeki tüccarlardan vebanın bir günde bölgelerini terk ettiğini ve on sekiz bin cenaze töreni yapıldığını bildiren bir mektup geldi. Mektup yazılana kadar ölenlerin sayısı sayıldı ve bir milyon altı yüz elli bine ulaştı. Azerbaycan, Ahvaz, Vasit, Nil, Mutayrabad ve Kufa'dan da benzer haberler geldi; öyle ki onlar için yirmi çukur kazıldı ve içine atıldılar. Fakirler köpek yediler ve mezarları kazdılar. Bir kadının ölü bir köpeğin budu çiğnediği, bir adamın da bir kızı fırında kızartıp yediği görüldü; bu yüzden adam öldürüldü. Ölenlerin evlerinin kapıları kapatıldı, ticaret durdu ve insanların ölüleri yıkamak ve gömmekten başka bir işi kalmadı. İnsanlar tövbe ettiler, şarap döktüler, müzik aletlerini kırdılar ve camilere gittiler. {cite:muntazam-ibn-al-jawzi j.8 p.521-522}"
  id: "Pada tahun 448 H, kelaparan dan wabah penyakit menyebar ke seluruh Baghdad, Mesir, Mekah, Hijaz, Basra, Mosul, Khorasan, pegunungan, dan seluruh dunia, hingga harga satu kurr gandum di Baghdad mencapai sembilan puluh dinar, kemudian seratus delapan puluh dinar. Seribu orang meninggal setiap hari, dan Sultan mengkafani delapan belas ribu orang dengan uangnya sendiri, dan empat atau lima orang dibawa dalam setiap peti mati. Seorang penjual parfum menjual seribu botol anggur dalam satu hari {cite:muntazam-ibn-al-jawzi j.8 p.512-513}. Pada tahun 449 H, sebuah surat tiba dari para pedagang di seberang sungai yang menyatakan bahwa wabah penyakit telah meninggalkan wilayah mereka dalam satu hari, dengan delapan belas ribu pemakaman. Jumlah orang yang meninggal dihitung hingga surat itu ditulis, dan jumlahnya mencapai satu juta enam ratus lima puluh ribu. Kabar serupa datang dari Azerbaijan, Ahwaz, Wasit, Nil, Mutayrabadh, dan Kufa, sampai-sampai dua puluh lubang digali untuk mereka, dan mereka dilemparkan ke dalamnya. Orang miskin memakan anjing dan menggali kuburan. Seorang wanita terlihat mengunyah paha anjing mati, dan seorang pria terlihat memanggang seorang gadis di dalam tungku dan memakannya, sehingga ia dibunuh. Pintu-pintu rumah yang penghuninya telah meninggal ditutup, dan perdagangan berhenti, dan orang-orang tidak memiliki pekerjaan selain memandikan dan mengubur orang mati. Orang-orang bertobat, menumpahkan anggur, menghancurkan alat musik, dan sering mengunjungi masjid. {cite:muntazam-ibn-al-jawzi j.8 p.521-522}"
