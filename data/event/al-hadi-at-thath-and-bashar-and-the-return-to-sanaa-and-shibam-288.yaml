id: event/al-hadi-at-thath-and-bashar-and-the-return-to-sanaa-and-shibam-288
class: event
label:
  ar: "الهادي بثات وبشار ثم العودة إلى صنعاء وشبام وإرسال أبي القاسم إلى بلد همدان، ربيع الأول 288هـ"
  en: "Al-Hadi at Thath and Bashar, the return to Sana'a and Shibam and Abu al-Qasim sent to Hamdan's land, Rabi I 288 AH"
  ur: "ہادی ثات اور بشار میں، صنعاء اور شبام کی واپسی اور ابو القاسم کا ہمدان کے علاقے کی طرف بھیجا جانا، ربیع الاول 288ھ"
summary:
  ar: "ينزل الهادي موضعاً من مخاليف جيشان ثم ثات فيجمع أهلها ويقيم أياماً ويولي ثات محمد بن أبي الزبير اليرسمي ويأذن لأبي العشيرة بالمقام بها، ثم ينزل بشار من بلاد عنس ويخلف فيها رجلاً من اليرسميين ثم يكلا ويدخل صنعاء آخر ربيع الأول، ويوجه أخاه أبا محمد إلى الحجاز ليأتيه بمشايخه وحرمه، ثم يخرج آخر ربيع الآخر إلى شبام ويخلف علي بن سليمان بصنعاء، ويوجه في جمادى الآخرة ابنه أبا القاسم بعسكر إلى بلد همدان."
  en: "Al-Hadi halts at a place in the districts of Jayshan and then at Thath, gathers its people, stays some days, puts Muhammad ibn Abi al-Zubayr al-Yarsami over Thath and lets Abu al-Ushayra stay there; he goes on to Bashar in the land of Ans, leaves a Yarsami there, halts at Yakla and enters Sana'a at the end of Rabi I; he sends his brother Abu Muhammad to the Hijaz to bring his elders and household, goes to Shibam at the end of Rabi II leaving Ali ibn Sulayman at Sana'a, and in Jumada II sends his son Abu al-Qasim with an army to the land of Hamdan."
  ur: "ہادی جیشان کے اضلاع میں ایک جگہ اور پھر ثات اترتے ہیں، وہاں کے لوگوں کو جمع کرتے ہیں، چند دن رہتے ہیں، محمد بن ابی زبیر یرسمی کو ثات کا والی بناتے ہیں اور ابو العشیرہ کو وہاں ٹھہرنے کی اجازت دیتے ہیں؛ پھر عنس کی سرزمین میں بشار جاتے ہیں، وہاں یرسمیوں میں سے ایک شخص چھوڑتے ہیں، یکلا اترتے ہیں اور ربیع الاول کے آخر میں صنعاء میں داخل ہوتے ہیں؛ بھائی ابو محمد کو حجاز بھیجتے ہیں تاکہ وہ ان کے بزرگوں اور گھر والوں کو لائیں، ربیع الآخر کے آخر میں شبام جاتے ہیں اور علی بن سلیمان کو صنعاء میں چھوڑتے ہیں، اور جمادی الآخرہ میں بیٹے ابو القاسم کو لشکر کے ساتھ ہمدان کے علاقے کی طرف روانہ کرتے ہیں۔"
