label: { ar: "دخول علي الكوفة سنة 36هـ", en: "Ali enters Kufa in 36 AH", es: "Ali entra en Kufa en el año 36 de la Hégira.", fr: "Ali entre à Koufa en 36 AH", ur: "علی 36ھ میں کوفہ میں داخل ہوئے۔", tr: "Ali, Hicri 36 yılında Kufa'ya girdi.", id: "Ali memasuki Kufa pada tahun 36 Hijriah." }
summary:
  ar: "دخل علي الكوفة يوم الاثنين لاثنتي عشرة ليلة خلت من رجب سنة 36هـ بعد أن شيّع عائشة في طريقها إلى مكة؛ فقيل له: انزل بالقصر الأبيض، فأبى وقال إن عمر كان يكره النزول به فهو يكرهه لذلك، فنزل الرحبة وصلى في الجامع الأعظم ركعتين ⁦(ص155)⁩."
  tr: "Ali, Hicri 36 yılının Recep ayının on ikinci gecesi, Pazartesi günü, Ayşe'yi Mekke'ye uğurladıktan sonra Kufa'ya girdi. Ona, \"Beyaz Saray'da kal\" denildi, ancak o reddetti ve Ömer'in orada kalmaktan hoşlanmadığını, bu yüzden kendisinin de orayı sevmediğini söyledi. Bunun üzerine Rahba Camii'ne indi ve Büyük Mescid'de iki rekat namaz kıldı (s. 155)."
  id: "Ali memasuki Kufa pada hari Senin, malam kedua belas bulan Rajab tahun 36 Hijriah, setelah mengantar Aisyah dalam perjalanannya ke Mekah. Ia diberitahu: Tinggallah di Istana Putih, tetapi ia menolak dan berkata bahwa Umar tidak suka tinggal di sana, jadi ia tidak menyukainya karena alasan itu. Maka ia pergi ke Al-Rahba dan shalat dua rakaat di Masjidil Haram (hlm. 155)."
