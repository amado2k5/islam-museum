label: { en: "Ghadir Khumm", ar: "غدير خم" }
summary:
  en: "A halt at the pool of Khumm on the return from the Farewell Pilgrimage, at which the Prophet spoke about Ali."
  ar: "وقفة عند غدير خم في طريق العودة من حجة الوداع، تحدّث فيها النبي عن علي. وروى مسلم عن زيد بن أرقم أن النبي خطب عند ماء يدعى خُمّاً بين مكة والمدينة فقال «إني تارك فيكم ثقلين: أحدهما كتاب الله» ثم «وأهل بيتي، أذكركم الله في أهل بيتي»، وعيّن زيد أهل البيت بمن حُرم الصدقة بعده {cite:sahih-muslim 2408}."
