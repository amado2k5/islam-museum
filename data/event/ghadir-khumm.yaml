summary:
  en: "A halt at the pool of Khumm on the return from the Farewell Pilgrimage, at which the Prophet spoke about Ali."
  ar: "وقفة عند غدير خم في طريق العودة من حجة الوداع، تحدّث فيها النبي عن علي. وروى مسلم عن زيد بن أرقم أن النبي خطب عند ماء يدعى خُمّاً بين مكة والمدينة فقال «إني تارك فيكم ثقلين: أحدهما كتاب الله» ثم «وأهل بيتي، أذكركم الله في أهل بيتي»، وعيّن زيد أهل البيت بمن حُرم الصدقة بعده {cite:sahih-muslim 2408}."
  es: "Una parada en el estanque de Khumm al regresar de la Peregrinación de Despedida, donde el Profeta habló sobre Ali."
  fr: "Une halte à la piscine de Khumm sur le retour du pèlerinage d'adieu, où le Prophète parla d'Ali."
  ur: "حجۃ الوداع سے واپسی پر خم کے تالاب پر ٹھہرنا، جس پر پیغمبر نے علی کے بارے میں بات کی۔"
  tr: "Veda Hacından dönüş yolunda Gadir Hum'da verilen bir molada, Peygamberimiz Ali hakkında konuştu. Müslim, Zeyd ibn Arkam'dan rivayetle, Peygamberimizin Mekke ile Medine arasında bulunan Hum adlı bir su kaynağında hutbe verdiğini ve şöyle buyurduğunu aktarmıştır: \"Size iki ağır şey bırakıyorum: Biri Allah'ın Kitabı, sonra da ailem. Ailem konusunda Allah'ı size hatırlatıyorum.\" Zeyd, Peygamberimizin ailesinin, ondan sonra sadaka almaktan men edilenler olduğunu belirtmiştir. {sahih müslim 2408}"
  id: "Berhenti sejenak di Ghadir Khumm dalam perjalanan pulang dari Haji Perpisahan, tempat Nabi berbicara tentang Ali. Muslim meriwayatkan dari Zayd ibn Arqam bahwa Nabi berkhutbah di tempat pemandian bernama Khumm antara Mekah dan Madinah, seraya berkata, “Aku meninggalkan di antara kalian dua hal yang penting: salah satunya adalah Kitab Allah,” kemudian, “dan keluargaku. Aku mengingatkan kalian tentang Allah mengenai keluargaku.” Zayd menjelaskan bahwa keluarga Nabi adalah orang-orang yang dilarang menerima sedekah setelah beliau wafat. {cite:sahih-muslim 2408}"
