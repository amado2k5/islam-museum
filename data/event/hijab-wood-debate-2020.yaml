summary:
  ar: "مناظرة رقمية مطوّلة سنة 2020 بين الداعية السني [[person/muhammad-hijab|محمد حجاب]] والدفاعي المسيحي [[person/david-wood|ديفيد وود]] في صحة القرآن والأناجيل تاريخياً ونصياً، انتشر تسجيلها وتفريغها وشرحها التحليلي انتشاراً واسعاً وصارت مثالاً للمناظرة الطويلة الرقمية {cite:answering-islam-debates-index}."
  en: "A long-form digital debate in 2020 between the Sunni speaker [[person/muhammad-hijab|Muhammad Hijab]] and the Christian apologist [[person/david-wood|David Wood]] on the historical and textual reliability of the Qur'an and the Gospels. Its recording, transcript and analytical breakdowns spread widely, making it the example of the long-form digital debate {cite:answering-islam-debates-index}."
  es: "Un extenso debate digital celebrado en 2020 entre el orador sunita Muhammad Hijab y el apologista cristiano David Wood sobre la fiabilidad histórica y textual del Corán y los Evangelios. Su grabación, transcripción y análisis se difundieron ampliamente, convirtiéndolo en un ejemplo de debate digital de larga duración (véase: answering-islam-debates-index)."
  fr: "Un long débat numérique de 2020 entre le prédicateur sunnite Muhammad Hijab et l'apologiste chrétien David Wood a porté sur la fiabilité historique et textuelle du Coran et des Évangiles. Son enregistrement, sa transcription et ses analyses ont été largement diffusés, faisant de lui un exemple de débat numérique de longue durée (voir Answering Islam Debates Index)."
  ur: "2020 میں ایک طویل شکل کی ڈیجیٹل بحث سنی مقرر [[شخص/محمد-حجاب|محمد حجاب]] اور عیسائی معذرت خواہ [[person/david-wood|David Wood]] کے درمیان قرآن اور انجیل کی تاریخی اور متنی اعتبار پر۔ اس کی ریکارڈنگ، ٹرانسکرپٹ اور تجزیاتی خرابی بڑے پیمانے پر پھیل گئی ہے، جس سے یہ طویل شکل کی ڈیجیٹل بحث کی مثال ہے {cite:answering-islam-debates-index}۔"
  tr: "2020 yılında Sünni vaiz [[person/muhammad-hijab|محمد حجاب]] ile Hristiyan apologet [[person/david-wood|دافيد وود]] arasında Kur'an ve İncillerin tarihsel ve metinsel gerçekliği üzerine yapılan uzun bir dijital tartışma; bu tartışmanın kaydı, yazıya geçirilmesi ve analitik açıklaması geniş çapta yayıldı ve uzun bir dijital tartışmanın örneği haline geldi {cite:answering-islam-debates-index}."
  id: "Debat digital yang panjang pada tahun 2020 antara pendakwah Sunni [[person/muhammad-hijab|محمد حجاب]] dan apologis Kristen [[person/david-wood|دافيد وود]] mengenai keaslian historis dan tekstual Al-Qur'an dan Injil, yang rekaman, transkripsi, dan penjelasan analitisnya menyebar luas dan menjadi contoh debat digital yang panjang {cite:answering-islam-debates-index}."
