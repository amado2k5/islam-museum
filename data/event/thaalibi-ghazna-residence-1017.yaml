id: event/thaalibi-ghazna-residence-1017
class: event
kind: other
label:
  ar: "إقامة الثعالبي بغزنة دار الغزنويين، نحو ٤٠٨هـ"
  en: "Al-Tha'alibi resides at Ghazna, the Ghaznavid capital, c. 408/1017"
  ur: "غزنویوں کے دارالحکومت غزنہ میں ثعالبی کا قیام، تقریباً 408ھ/1017ء"
  es: "Al-Tha'alibi residía en Ghazna, la capital gaznávida, alrededor del año 408/1017."
  fr: "Al-Tha'alibi réside à Ghazna, capitale des Ghaznévides, vers 408/1017."
  tr: "El-Salibi, Hicri 408 civarında Gaznevi hanedanlığının başkenti Gazne'de ikamet etmiştir."
  id: "Al-Tha'alibi tinggal di Ghazna, ibu kota dinasti Ghaznavid, sekitar tahun 408 Hijriah."
summary:
  ar: "انتقل الثعالبي من خوارزم إلى غزنة عاصمة الدولة الغزنوية الحديثة فأقام بها مدة {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ وفي هذه البيئة كانت نهضة الفارسية الحديثة تجري حوله في بلاط محمود، وإن خلت مصنفاته عن ذكرها إذ بقي نصيراً متشدداً للعربية وأدبها {cite:encyclopaedia-of-islam-2 vol. 10 p. 452}."
  en: "From Khwarazm al-Tha'alibi moved on to Ghazna, capital of the recently established Ghaznavid dynasty, and resided there for some time {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; the flowering of New Persian was unfolding around him at Mahmud's court, yet his works stay silent about it, for he remained a strident champion of Arabic and its literature {cite:encyclopaedia-of-islam-2 vol. 10 p. 452}."
  ur: "خوارزم سے ثعالبی غزنہ منتقل ہوئے، جو غزنوی سلطنت کا نیا دارالحکومت تھا، اور کچھ عرصہ وہاں رہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ محمود کے دربار میں نو فارسی ادب کا عروج ان کے گرد جاری تھا مگر ان کی تصانیف اس پر خاموش ہیں، کیونکہ وہ عربی اور اس کے ادب کے پرجوش حامی رہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 452}۔"
  es: "Desde Khwarazm al-Tha'alibi se trasladó a Ghazna, capital de la recién establecida dinastía gaznávida, y residió allí durante algún tiempo {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; el florecimiento del persa moderno se desplegaba a su alrededor en la corte de Mahmud, sin embargo, sus obras permanecen en silencio al respecto, pues siguió siendo un defensor acérrimo del árabe y su literatura {cite:encyclopaedia-of-islam-2 vol. 10 p. 452}."
  fr: "De Khwarezm, al-Tha'alibi se rendit à Ghazna, capitale de la dynastie ghaznévide récemment établie, et y résida pendant un certain temps {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; l'épanouissement du nouveau persan se déployait autour de lui à la cour de Mahmud, pourtant ses œuvres restent muettes à ce sujet, car il demeura un fervent défenseur de l'arabe et de sa littérature {cite:encyclopaedia-of-islam-2 vol. 10 p. 452}."
  tr: "El-Salibi, Harezm'den modern Gaznevi devletinin başkenti Gazne'ye taşındı ve bir süre orada kaldı. Bu ortamda, Mahmud'un sarayında modern Fars Rönesansı yaşanıyordu; ancak eserlerinde bundan bahsetmedi, zira kendisi Arap dilinin ve Arap edebiyatının sadık bir destekçisi olarak kaldı."
  id: "Al-Tha’alibi pindah dari Khwarazm ke Ghazna, ibu kota negara Ghaznavid modern, dan tinggal di sana untuk beberapa waktu. Di lingkungan ini, kebangkitan Persia modern berlangsung di sekitarnya di istana Mahmud, meskipun karya-karyanya tidak menyebutkannya, karena ia tetap menjadi pendukung setia bahasa Arab dan sastranya."
