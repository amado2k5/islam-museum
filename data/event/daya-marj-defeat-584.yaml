label: { ar: "انهزام عسكر الخليفة بدية مرج", en: "The caliphal army's rout at Daya Marj (584 AH)" }
summary:
  ar: "جهّز الخليفة الناصر لدين الله عسكراً كثيراً وجعل المقدم عليهم وزيره جلال الدين عبيد الله بن يونس وسيّرهم إلى مساعدة قزل ليكفّ الناس السلطان طغرل عن البلاد؛ فسار العسكر ثالث صفر سنة أربع وثمانين وخمسمائة إلى أن قارب همذان ولم يصل قزل إليهم، فأقبل طغرل إليهم فالتقوا ثامن ربيع الأول بدية مرج عند همذان فاقتتلوا فلم يثبت عسكر بغداد وانهزموا وتفرقوا، وثبت الوزير قائماً ومعه مصحف وسيف حتى أسره رجل من عسكر طغرل وأخذ ما معه من خزانة وسلاح ودواب؛ وكان ابن الأثير حينئذ بالشام في عسكر صلاح الدين فقال لما جاء الخبر بمسيرهم: كأنكم وقد وصل الخبر بانهزامهم — فأصحابي وأهلي أعرف بالحرب من الوزير وأطوع في العسكر منه ومع ذلك أخاف على من أرسله في سرية، وهذا الوزير غير عارف بالحرب قريب العهد بالولاية ولا يراه الأمراء أهلاً أن يطاع وفي مقابله سلطان شجاع قد باشر الحرب بنفسه — فكان الأمر كذلك، وقال بعض الشعراء في انهزامهم أبياتاً يهجو بها الوزير {cite:kamil-ibn-al-athir p. 178-179}."
  en: "Al-Nasir sent a great army under his vizier Jalal al-Din Ubaydallah ibn Yunus to prop up Qizil against Sultan Tughril III; at Daya Marj near Hamadan, 8 Rabi' I 584, the Baghdadis broke and scattered while the vizier stood with mushaf and sword until captured — Ibn al-Athir was in Saladin's camp when the march was announced and heard him predict the rout: a minister new to office and war, whom no amir thinks worth obeying, facing a battle-hardened sultan; satirists had their day {cite:kamil-ibn-al-athir p. 178-179}."
