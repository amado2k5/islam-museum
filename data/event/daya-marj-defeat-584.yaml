label: { ar: "انهزام عسكر الخليفة بدية مرج", en: "The caliphal army's rout at Daya Marj (584 AH)", es: "La derrota del ejército califal en Daya Marj (584 AH)", fr: "La déroute de l'armée califale à Daya Marj (584 AH)", ur: "دیا مرج میں خلیفہ کی فوج کی شکست ⁦(584ھ)⁩", tr: "Marj döneminin başında Halifenin ordusunun yenilgisi", id: "Kekalahan pasukan Khalifah pada awal Marj." }
summary:
  ar: "جهّز الخليفة الناصر لدين الله عسكراً كثيراً وجعل المقدم عليهم وزيره جلال الدين عبيد الله بن يونس وسيّرهم إلى مساعدة قزل ليكفّ الناس السلطان طغرل عن البلاد؛ فسار العسكر ثالث صفر سنة أربع وثمانين وخمسمائة إلى أن قارب همذان ولم يصل قزل إليهم، فأقبل طغرل إليهم فالتقوا ثامن ربيع الأول بدية مرج عند همذان فاقتتلوا فلم يثبت عسكر بغداد وانهزموا وتفرقوا، وثبت الوزير قائماً ومعه مصحف وسيف حتى أسره رجل من عسكر طغرل وأخذ ما معه من خزانة وسلاح ودواب؛ وكان ابن الأثير حينئذ بالشام في عسكر صلاح الدين فقال لما جاء الخبر بمسيرهم: كأنكم وقد وصل الخبر بانهزامهم — فأصحابي وأهلي أعرف بالحرب من الوزير وأطوع في العسكر منه ومع ذلك أخاف على من أرسله في سرية، وهذا الوزير غير عارف بالحرب قريب العهد بالولاية ولا يراه الأمراء أهلاً أن يطاع وفي مقابله سلطان شجاع قد باشر الحرب بنفسه — فكان الأمر كذلك، وقال بعض الشعراء في انهزامهم أبياتاً يهجو بها الوزير {cite:kamil-ibn-al-athir p. 178-179}."
  en: "Al-Nasir sent a great army under his vizier Jalal al-Din Ubaydallah ibn Yunus to prop up Qizil against Sultan Tughril III; at Daya Marj near Hamadan, 8 Rabi' I 584, the Baghdadis broke and scattered while the vizier stood with mushaf and sword until captured — Ibn al-Athir was in Saladin's camp when the march was announced and heard him predict the rout: a minister new to office and war, whom no amir thinks worth obeying, facing a battle-hardened sultan; satirists had their day {cite:kamil-ibn-al-athir p. 178-179}."
  es: "Al-Nasir envió un gran ejército bajo el mando de su visir Jalal al-Din Ubaydallah ibn Yunus para apoyar a Qizil contra el sultán Tughril III; en Daya Marj, cerca de Hamadán, el 8 de Rabi' I de 584, los bagdadíes se dispersaron mientras el visir se mantuvo firme con el Corán y la espada hasta que fue capturado. Ibn al-Athir estaba en el campamento de Saladino cuando se anunció la marcha y lo oyó predecir la derrota: un ministro nuevo en el cargo y en la guerra, a quien ningún emir considera digno de obediencia, enfrentándose a un sultán curtido en la batalla; los satíricos tuvieron su momento {cite:kamil-ibn-al-athir p. 178-179}."
  fr: "Al-Nasir envoya une grande armée sous le commandement de son vizir Jalal al-Din Ubaydallah ibn Yunus pour soutenir Qizil contre le sultan Tughril III; à Daya Marj près d'Hamadan, le 8 Rabi' I 584, les Bagdadis se débandèrent et se dispersèrent tandis que le vizir tint bon avec son mushaf et son épée jusqu'à sa capture — Ibn al-Athir était dans le camp de Saladin lorsque la marche fut annoncée et l'entendit prédire la déroute: un ministre nouveau dans ses fonctions et dans la guerre, qu'aucun émir ne juge digne d'obéissance, face à un sultan aguerri; les satiristes eurent leur heure de gloire {cite:kamil-ibn-al-athir p. 178-179}."
  ur: "الناصر نے اپنے وزیر جلال الدین عبیداللہ ابن یونس کے ماتحت ایک عظیم لشکر سلطان طغرل III کے خلاف قزل کو سہارا دینے کے لیے بھیجا۔ 8 ربیع الاول 584 کو ہمدان کے قریب دیا مرج میں، بغدادی ٹوٹ گئے اور بکھر گئے جب تک کہ وزیر پکڑے جانے تک مصحف اور تلوار لے کر کھڑا رہا - ابن الثیر صلاح الدین کے کیمپ میں تھا جب مارچ کا اعلان ہوا اور اس نے اسے شکست کی پیشین گوئی کرتے ہوئے سنا: دفتر اور جنگ میں نیا وزیر، جسے جنگ کے قابل نہیں سمجھتا تھا۔ سلطان طنز نگاروں کا اپنا دن تھا۔ 178-179}۔"
  tr: "Halife Nasır li-Din Allah büyük bir ordu hazırladı ve veziri Celaleddin Ubeyd Allah ibn Yunus'u komutan olarak atayarak, Sultan Tuğrul'un ülkeye saldırmasını engellemek için Kızıl'a yardım etmeleri için onları gönderdi. Ordu, Hicri 584 yılının Safer ayının üçüncü gününde Hamadan'a kadar ilerledi, ancak Kızıl onlara ulaşamadı. Tuğrul onlara doğru geldi ve Hamadan yakınlarındaki Merc'in başlangıcında, Rebiü'l-Evvel ayının sekizinci gününde karşılaştılar. Savaştılar ve Bağdat ordusu direnemedi, yenildi ve dağıldı. Vezir, Kur'an ve kılıçla dimdik durdu, ta ki Tuğrul'un ordusundan bir adam onu yakalayıp hazinesini, silahlarını ve hayvanlarını alana kadar. İbn el-Athir o sırada Selahaddin'in ordusunda Suriye'deydi ve onların yürüyüş haberi geldiğinde şöyle dedi: \"Sanki yenilgilerinin haberini duymuşsunuz gibi; çünkü arkadaşlarım ve ailem, bakandan daha çok savaş bilgisine sahip ve orduda ondan daha itaatkârlar, yine de gizli göreve gönderdiğim kişi için endişeleniyorum. Bu bakan savaş konusunda bilgisiz, valilikte yeni ve prensler onu itaate layık görmüyorlar. Ve onun önünde, bizzat savaşa katılmış cesur bir sultan var - ve öyle de oldu. Bazı şairler de yenilgileri hakkında, bakanı hicveden şiirler yazdılar.\" {cite:kamil-ibn-al-athir s. 178-179}"
  id: "Khalifah Al-Nasir li-Din Allah mempersiapkan pasukan besar dan menunjuk menterinya, Jalal al-Din Ubayd Allah ibn Yunus, sebagai komandan mereka, lalu mengirim mereka untuk membantu Qizil menghentikan Sultan Tughrul menyerang negeri itu. Pasukan tersebut bergerak pada tanggal 3 Safar tahun 584 H hingga mendekati Hamadan, tetapi Qizil tidak berhasil mencapai mereka. Tughrul datang menghampiri mereka, dan mereka bertemu pada tanggal 8 Rabi’ al-Awwal di awal bulan Marj dekat Hamadan. Mereka bertempur, dan pasukan Baghdad tidak bertahan dengan teguh sehingga dikalahkan dan tercerai-berai. Menteri itu tetap teguh, dengan Al-Qur'an dan pedang, hingga seorang pria dari pasukan Tughrul menangkapnya dan mengambil harta benda, senjata, dan hewan ternaknya. Ibn al-Athir saat itu berada di Suriah dalam pasukan Saladin, dan ketika berita tentang pergerakan mereka sampai, dia berkata: “Seolah-olah kalian telah mendengar berita kekalahan mereka — karena para sahabat dan keluargaku lebih tahu tentang perang daripada menteri dan lebih patuh di dalam pasukan daripada dia, namun aku khawatir akan orang yang kukirim dalam misi rahasia. Menteri ini tidak berpengetahuan tentang perang, baru menjabat sebagai gubernur, dan para pangeran tidak menganggapnya layak untuk ditaati. Dan di depannya ada seorang sultan pemberani yang telah terlibat langsung dalam perang — dan memang demikianlah adanya. Dan beberapa penyair menulis syair tentang kekalahan mereka, menyindir menteri.” {cite:kamil-ibn-al-athir hlm. 178-179}"
