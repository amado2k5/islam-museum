label: { ar: "هدم مسجد الضرار", en: "The demolition of Masjid al-Dirar" }
summary:
  ar: "لما نزل النبي بذي أوان قافلاً من تبوك أتاه خبر المسجد، فدعا مالك بن الدخشم ومعن بن عدي (أو أخاه عاصماً) وأمرهما بهدمه وإحراقه، فنفّذا ذلك وتفرّق أهله، ونزل فيهم قرآن بحسب ابن إسحاق."
  en: When the Prophet stopped at Dhi Awan on his return from Tabuk, news of the mosque reached him; he summoned Malik ibn al-Dukhshum and Ma'n ibn Adi (or his brother Asim) and ordered them to demolish and burn it. They did so, its people dispersed, and Qur'an was revealed about them, according to Ibn Ishaq.
