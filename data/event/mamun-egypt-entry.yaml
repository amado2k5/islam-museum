summary:
  ar: "سار المأمون سنة خمس عشرة إلى غزو الروم ففتح حصن قرة عنوة وحصن ماجدة ثم سار إلى دمشق، وعاد في سنة ست عشرة إلى الروم فافتتح عدة حصون، ثم توجه إلى مصر ودخلها فهو أول من دخلها من الخلفاء العباسيين ثم عاد في سنة سبع عشرة إلى دمشق والروم {cite:tarikh-khulafa-minhaj-1434 p. 488}."
