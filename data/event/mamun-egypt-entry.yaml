label: { ar: "دخول المأمون مصر", en: "al-Ma'mun Enters Egypt", es: "Al-Ma'mun entra en Egipto", fr: "al-Ma'mun entre en Égypte", ur: "المامون مصر میں داخل ہوا۔" }
summary:
  ar: "سار المأمون سنة خمس عشرة إلى غزو الروم ففتح حصن قرة عنوة وحصن ماجدة ثم سار إلى دمشق، وعاد في سنة ست عشرة إلى الروم فافتتح عدة حصون، ثم توجه إلى مصر ودخلها فهو أول من دخلها من الخلفاء العباسيين ثم عاد في سنة سبع عشرة إلى دمشق والروم {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  en: "In year 215 al-Ma'mun marched against the Byzantines, taking the fortresses Qurra and Majida, then went to Damascus; in 216 he returned and took several more. He then made for Egypt and entered it — the first Abbasid caliph ever to do so — before returning in 217 to Damascus and the frontier {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  es: "En el año 215, al-Ma'mun marchó contra los bizantinos, tomando las fortalezas de Qurra y Majida, y luego se dirigió a Damasco; en 216 regresó y tomó varias más. Luego se dirigió a Egipto y entró en él —el primer califa abasí en hacerlo— antes de regresar en 217 a Damasco y la frontera {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  fr: "En 215, al-Ma'mun marcha contre les Byzantins, s'empara des forteresses de Qurra et Majida, puis se rendit à Damas; en 216, il revint et conquit plusieurs autres forteresses. Il se dirigea ensuite vers l'Égypte et y entra – devenant ainsi le premier calife abbasside à le faire – avant de retourner en 217 à Damas et à la frontière {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  ur: "215 میں المامون نے بازنطینیوں کے خلاف مارچ کیا، قرہ اور ماجدہ قلعوں کو لے کر دمشق چلا گیا۔ 216 میں وہ واپس آیا اور کئی اور لے گیا۔ اس کے بعد اس نے مصر کا رخ کیا اور اس میں داخل ہوا - ایسا کرنے والا پہلا عباسی خلیفہ - 217 میں دمشق اور سرحد پر واپس آنے سے پہلے۔ 488}۔"
