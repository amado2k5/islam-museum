label: { ar: "التماس ملك الروم منديل الرها", en: "The Byzantine King's Request for the Mandylion of Edessa", es: "La petición del rey bizantino del Mandylion de Edesa", fr: "La requête du roi byzantin pour le mandylion d'Édesse", ur: "بازنطینی بادشاہ کی ایڈیسا کے مینڈیلین کی درخواست" }
summary:
  ar: "في سنة إحدى وثلاثين وثلاثمائة ورد كتاب من ملك الروم يلتمس منديلًا كان للمسيح مسح به وجهه فصارت صورة وجهه فيه، وذلك المنديل في بيعة الرها، ووعد إن أُنفذ إليه أن يطلق أسرى المسلمين {cite:muntazam-ibn-al-jawzi p. 623}."
  en: "In 331 a letter came from the Byzantine king seeking the kerchief on which — the account runs — Christ had wiped his face, leaving its image, kept in the church of Edessa; he promised Muslim captives' release if it were sent {cite:muntazam-ibn-al-jawzi p. 623}."
  es: "En 331 llegó una carta del rey bizantino solicitando el pañuelo en el que —según el relato— Cristo se había limpiado el rostro, dejando su imagen, que se conservaba en la iglesia de Edesa; prometió la liberación de los cautivos musulmanes si se lo enviaba {cite:muntazam-ibn-al-jawzi p. 623}."
  fr: "En 331, une lettre arriva du roi byzantin demandant le mouchoir sur lequel — selon le récit — le Christ s'était essuyé le visage, laissant son image, conservée dans l'église d'Édesse; il promit la libération des captifs musulmans si celui-ci était envoyé {cite:muntazam-ibn-al-jawzi p. 623}."
  ur: "331 میں بازنطینی بادشاہ کی طرف سے ایک خط آیا جس میں رومال کی تلاش تھی - جس پر اکاؤنٹ چلتا ہے - مسیح نے اپنا چہرہ صاف کیا تھا، اس کی تصویر کو، ایڈیسا کے چرچ میں رکھا ہوا تھا۔ اس نے مسلمانوں کے اسیروں کی رہائی کا وعدہ کیا اگر اسے بھیج دیا جائے 623}۔"
