summary:
  ar: "في سنة إحدى وثلاثين وثلاثمائة ورد كتاب من ملك الروم يلتمس منديلًا كان للمسيح مسح به وجهه فصارت صورة وجهه فيه، وذلك المنديل في بيعة الرها، ووعد إن أُنفذ إليه أن يطلق أسرى المسلمين {cite:muntazam-ibn-al-jawzi p. 623}."
  en: "In 331 a letter came from the Byzantine king seeking the kerchief on which — the account runs — Christ had wiped his face, leaving its image, kept in the church of Edessa; he promised Muslim captives' release if it were sent {cite:muntazam-ibn-al-jawzi p. 623}."
  es: "En 331 llegó una carta del rey bizantino solicitando el pañuelo en el que —según el relato— Cristo se había limpiado el rostro, dejando su imagen, que se conservaba en la iglesia de Edesa; prometió la liberación de los cautivos musulmanes si se lo enviaba {cite:muntazam-ibn-al-jawzi p. 623}."
