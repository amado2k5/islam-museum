label:
  ar: "المقريزي ينتقل إلى دمشق، نحو ٨١٠هـ/١٤٠٨م"
  en: "Al-Maqrizi moves to Damascus, c. 810/1408"
  ur: "مقریزی کا دمشق میں قیام، تقریباً 810ھ/1408ء"
  es: "Al-Maqrizi se traslada a Damasco, c. 810/1408."
  fr: "Al-Maqrizi s'installe à Damas, vers 810/1408"
  tr: "El-Makrizi yaklaşık 810 Hicri/1408 Miladi yılında Şam'a taşındı."
  id: "Al-Maqrizi pindah ke Damaskus sekitar tahun 810 H/1408 M."
summary:
  ar: "انتقل المقريزي إلى دمشق نحو سنة ٨١٠هـ/١٤٠٨م فأقام بها نحو عشر سنين؛ درّس بالإقبالية، ونظر في أوقاف القلانيسية والبيمارستان النوري الكبير مع أن النظر عليه كان محفوظاً شرعاً لقاضي دمشق الشافعي — وقد عُرض عليه قضاء دمشق نفسه من طرف الناصر بن برقوق فأباه. وفي الشام يبدو أنه عزم على ترك الوظائف التي لم تُرضِه والتفرغ للتاريخ {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}."
  en: "Around 810/1408 al-Maqrizi moved to Damascus and spent about ten years there. He taught at the Iqbaliyya and administered the endowments of the Qalanisiyya and the great Nuri hospital — a post legally reserved for the Shafi'i judge of Damascus. That judgeship itself was offered to him by al-Nasir ibn Barquq, but he refused it. In Syria he seems to have resolved to give up an unsatisfying public career and devote himself wholly to historical scholarship {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}."
  ur: "تقریباً 810ھ/1408ء میں مقریزی دمشق منتقل ہوئے اور وہاں دس سال رہے۔ انہوں نے اقبالیہ میں تدریس کی اور قلانیسیہ اور عظیم نوری بیمارستان کے اوقاف کی نگرانی کی — یہ منصب قانوناً دمشق کے شافعی قاضی کے لیے مخصوص تھا۔ ناصر بن برقوق نے انہیں خود وہی قضاء عرض کیا مگر انہوں نے انکار کر دیا۔ شام میں ہی انہوں نے غالباً یہ فیصلہ کیا کہ نامطمئن کن سرکاری ملازمت چھوڑ کر تاریخ کے لیے مکمل وقف ہو جائیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}۔"
  es: "Hacia el año 810/1408, al-Maqrizi se trasladó a Damasco, donde residió durante unos diez años. Impartió clases en la escuela Iqbaliyya y administró los fondos de la escuela Qalanisiyya y del gran hospital Nuri, un cargo legalmente reservado para el juez shafi'í de Damasco. Al-Nasir ibn Barquq le ofreció dicho cargo, pero él lo rechazó. En Siria, parece haber decidido abandonar una carrera pública insatisfactoria y dedicarse por completo a la investigación histórica {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}."
  fr: "Vers 810/1408, al-Maqrizi s'installa à Damas où il séjourna une dizaine d'années. Il enseigna à l'Iqbaliyya et administra les fondations de la Qalanisiyya et du grand hôpital Nuri – une fonction légalement réservée au juge chaféite de Damas. Ce poste de juge lui avait été proposé par al-Nasir ibn Barquq, mais il le refusa. En Syrie, il semble avoir renoncé à une carrière publique insatisfaisante pour se consacrer entièrement à l'étude de l'histoire."
  tr: "El-Makrizi, Hicri 810/Miladi 1408 civarında Şam'a taşındı ve orada yaklaşık on yıl kaldı. İkbaliyye Medresesi'nde ders verdi ve yasal olarak Şam'ın Şafiî kadısına ait olan bu kurumların yönetimini üstlendi. Hatta El-Nasır ibn Barquq tarafından kendisine Şam kadılığı teklif edildi, ancak bunu reddetti. Şam'dayken, kendisini tatmin etmeyen görevleri terk etmeye ve tarihe adamaya karar vermiş gibi görünüyor."
  id: "Al-Maqrizi pindah ke Damaskus sekitar tahun 810 H/1408 M dan menetap di sana selama kurang lebih sepuluh tahun. Ia mengajar di Madrasah Iqbaliyya dan mengawasi wakaf Qalanisiyya dan Rumah Sakit Nuri Agung, meskipun pengawasan atas lembaga-lembaga tersebut secara hukum diperuntukkan bagi hakim Damaskus yang bermazhab Syafi'i. Ia bahkan ditawari posisi hakim Damaskus oleh al-Nasir ibn Barquq, tetapi ia menolak. Selama di Damaskus, tampaknya ia memutuskan untuk meninggalkan posisi-posisi yang tidak memuaskannya dan mengabdikan dirinya pada sejarah."
