label:
  ar: "المقريزي ينتقل إلى دمشق، نحو ٨١٠هـ/١٤٠٨م"
  en: "Al-Maqrizi moves to Damascus, c. 810/1408"
  ur: "مقریزی کا دمشق میں قیام، تقریباً 810ھ/1408ء"
summary:
  ar: "انتقل المقريزي إلى دمشق نحو سنة ٨١٠هـ/١٤٠٨م فأقام بها نحو عشر سنين؛ درّس بالإقبالية، ونظر في أوقاف القلانيسية والبيمارستان النوري الكبير مع أن النظر عليه كان محفوظاً شرعاً لقاضي دمشق الشافعي — وقد عُرض عليه قضاء دمشق نفسه من طرف الناصر بن برقوق فأباه. وفي الشام يبدو أنه عزم على ترك الوظائف التي لم تُرضِه والتفرغ للتاريخ {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}."
  en: "Around 810/1408 al-Maqrizi moved to Damascus and spent about ten years there. He taught at the Iqbaliyya and administered the endowments of the Qalanisiyya and the great Nuri hospital — a post legally reserved for the Shafi'i judge of Damascus. That judgeship itself was offered to him by al-Nasir ibn Barquq, but he refused it. In Syria he seems to have resolved to give up an unsatisfying public career and devote himself wholly to historical scholarship {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}."
  ur: "تقریباً 810ھ/1408ء میں مقریزی دمشق منتقل ہوئے اور وہاں دس سال رہے۔ انہوں نے اقبالیہ میں تدریس کی اور قلانیسیہ اور عظیم نوری بیمارستان کے اوقاف کی نگرانی کی — یہ منصب قانوناً دمشق کے شافعی قاضی کے لیے مخصوص تھا۔ ناصر بن برقوق نے انہیں خود وہی قضاء عرض کیا مگر انہوں نے انکار کر دیا۔ شام میں ہی انہوں نے غالباً یہ فیصلہ کیا کہ نامطمئن کن سرکاری ملازمت چھوڑ کر تاریخ کے لیے مکمل وقف ہو جائیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 255}۔"
