label:
  ar: "خلال الموفّق الثلاث: استيطان أبي داود البصرة ٢٧٠هـ تقريباً"
  en: "Al-Muwaffaq's three wishes: Abu Dawud settles at Basra, c. 272/885"
  fr: "Les trois souhaits d’al-Muwaffaq : Abu Dawud s’installe à Bassora, vers 272/885"
  ur: "موفق کی تین خواہشیں: ابو داؤد کا بصرہ میں قیام، تقریباً 272ھ/885ء"
  es: "Los tres deseos de Al-Muwaffaq: Abu Dawud se instala en Basora, c. 272/885."
  tr: "Üç başarılı dönem boyunca: Ebu Davud, Hicri 270 civarında Basra'ya yerleşti."
  id: "Selama tiga periode sukses tersebut: Abu Dawood menetap di Basra sekitar tahun 270 Hijriah."
summary:
  ar: "حدّث الخطابي عن أبي بكر بن جابر خادم أبي داود قال: كنت مع أبي داود ببغداد فصلينا المغرب فجاءه الأمير أبو أحمد الموفق فدخل، فقال له أبو داود: ما جاء بالأمير في مثل هذا الوقت؟ قال: خلال ثلاث: تنتقل إلى البصرة فتتخذها وطناً ليرحل إليك طلبة العلم فتعمر بك، فإنها قد خربت وانقطع عنها الناس لما جرى عليها من محنة الزنج؛ وتروي لأولادي السنن؛ وتفرد لهم مجلساً فإن أولاد الخلفاء لا يقعدون مع العامة. قال: أما هذه فلا سبيل إليها، لأن الناس في العلم سواء. فكانوا يحضرون ويقعدون في كمّ ضُرب عليه ستر ويسمعون مع العامة {cite:tarikh-islam-dhahabi pp. 361-362}. وبذلك استقر بالبصرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  en: "Al-Khattabi reported from Abu Bakr ibn Jabir, Abu Dawud's servant: I was with Abu Dawud at Baghdad when, after the sunset prayer, the amir Abu Ahmad al-Muwaffaq came in. Abu Dawud asked what brought the amir at such an hour, and he answered: three wishes — move to Basra and make it your home so that seekers of knowledge travel to you and it flourishes through you, for it lies ruined and deserted after the ordeal of the Zanj; transmit the Sunan to my sons; and hold them a separate session, for the sons of caliphs do not sit with the common folk. Abu Dawud answered: as for that, there is no way — people are equal in knowledge. So the princes attended, sitting behind a curtain drawn over a sleeve, hearing with the rest {cite:tarikh-islam-dhahabi pp. 361-362}. He accordingly settled at Basra {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  fr: "Al-Khattabi rapporte d’Abu Bakr ibn Jabir, serviteur d’Abu Dawud : j’étais avec Abu Dawud à Bagdad quand, après la prière du coucher du soleil, l’émir Abu Ahmad al-Muwaffaq entra. Abu Dawud lui demanda ce qui l’amenait à cette heure, et il répondit : trois souhaits — installe-toi à Bassora pour que les étudiants viennent à toi et qu’elle prospère grâce à toi, car elle est ruinée et déserte après l’épreuve des Zanj ; transmets les Sunan à mes fils ; réserve-leur une séance, car les fils des califes ne s’assoient pas avec le commun. Abu Dawud répondit : pour cela, il n’en est pas question, les gens sont égaux dans le savoir. Les princes assistèrent donc aux séances derrière un rideau tiré sur une manche, écoutant avec les autres {cite:tarikh-islam-dhahabi pp. 361-362}. Il s’établit ainsi à Bassora {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  ur: "خطابی نے ابو بکر بن جابر — ابو داؤد کے خادم — سے روایت کی: میں بغداد میں ابو داؤد کے ساتھ تھا کہ مغرب کی نماز کے بعد امیر ابو احمد موفق اندر آئے۔ ابو داؤد نے پوچھا امیر کو اس وقت کیا لایا؟ انہوں نے کہا: تین خواہشیں — بصرہ منتقل ہو کر اسے اپنا وطن بنا لو تاکہ طالبانِ علم تمہاری طرف آئیں اور وہ تمہارے سبب آباد ہو، کیونکہ وہ زنج کی محنت سے ویران پڑی ہے؛ میرے بیٹوں کو سنن روایت کرو؛ اور ان کے لیے الگ مجلس رکھو کیونکہ خلفا کے بیٹے عوام کے ساتھ نہیں بیٹھتے۔ ابو داؤد نے کہا: یہ ممکن نہیں، کیونکہ علم میں سب برابر ہیں۔ پھر وہ حاضر ہوتے، پردہ کئے ہوئے آستین میں بیٹھتے اور عوام کے ساتھ سنتے {cite:tarikh-islam-dhahabi pp. 361-362}۔ اسی طرح وہ بصرہ میں مستقر ہو گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}۔"
  es: "Al-Khattabi relató de Abu Bakr ibn Jabir, sirviente de Abu Dawud: Estaba con Abu Dawud en Bagdad cuando, después de la oración del atardecer, entró el emir Abu Ahmad al-Muwaffaq. Abu Dawud le preguntó qué lo traía a esa hora, y él respondió: tres deseos: mudarse a Basora y hacerla tu hogar para que los buscadores de conocimiento viajen a ti y florezca a través de ti, pues yace en ruinas y desierta después de la prueba del Zanj; transmitir el Sunan a mis hijos; y celebrar una sesión aparte para ellos, pues los hijos de los califas no se sientan con la gente común. Abu Dawud respondió: en cuanto a eso, no hay manera; todos somos iguales en conocimiento. Así que los príncipes asistieron, sentados detrás de una cortina corrida sobre una manga, escuchando con los demás {cite:tarikh-islam-dhahabi pp. 361-362}. En consecuencia, se estableció en Basora {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  tr: "El-Hattabî, Ebu Davud'un hizmetlisi Ebu Bekr ibn Cabir'den rivayet ettiğine göre şöyle demiştir: \"Bağdat'ta Ebu Davud ile birlikteydim ve akşam namazını kılıyorduk. Sonra Emir Ebu Ahmed el-Muveffak geldi ve içeri girdi. Ebu Davud ona, 'Emir'i böyle bir zamanda buraya getiren nedir?' diye sordu. Emir şöyle cevap verdi: 'Üç sebepten dolayı: Birincisi, Basra'ya taşınman ve orayı yurt edinmen, böylece ilim talebeleri sana gelsin ve senin sayende orası gelişsin; çünkü Zenc İsyanı yüzünden harap olmuş ve insanlar orayı terk etmişti. İkincisi, çocuklarıma sünneti öğretmen. Üçüncüsü ise, onlar için ayrı bir toplantı düzenlemen; çünkü halifelerin çocukları sıradan insanlarla birlikte oturmazlar.' Emir şöyle dedi: 'Bunun bir yolu yok, çünkü bütün insanlar ilim bakımından eşittir.' Böylece onlar, perdesi çekilmiş küçük bir odada oturup sıradan insanlarla birlikte dinlerlerdi.\" {cite:tarikh-islam-dhahabi ss. 361-362}. Ve böylece Basra'ya yerleşti. {cite:encyclopaedia-of-islam-2 cilt 1 s. 133}."
  id: "Al-Khattabi meriwayatkan dari Abu Bakr ibn Jabir, pelayan Abu Dawud, yang berkata: Aku bersama Abu Dawud di Baghdad, dan kami shalat Maghrib. Kemudian Amir Abu Ahmad al-Muwaffaq datang kepadanya dan masuk. Abu Dawud bertanya kepadanya, \"Apa yang membawa Amir ke sini pada waktu seperti ini?\" Beliau menjawab, \"Karena tiga alasan: Pertama, agar engkau pindah ke Basra dan menjadikannya rumahmu sehingga para pencari ilmu akan datang kepadamu dan kota itu akan berkembang karena engkau, karena kota itu telah hancur dan orang-orang telah meninggalkannya karena Pemberontakan Zanj. Kedua, agar engkau mengajarkan Sunnah kepada anak-anakku. Dan ketiga, agar engkau mengadakan pertemuan terpisah untuk mereka, karena anak-anak khalifah tidak duduk bersama orang biasa.\" Beliau berkata, \"Adapun hal ini, tidak ada cara untuk melakukannya, karena semua orang sama dalam ilmu.\" Maka mereka akan hadir dan duduk di sebuah ruangan kecil dengan tirai yang ditarik di atasnya dan mendengarkan bersama orang biasa. {cite:tarikh-islam-dhahabi pp. 361-362}. Dan demikianlah ia menetap di Basra. {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
