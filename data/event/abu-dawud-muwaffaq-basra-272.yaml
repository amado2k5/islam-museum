class: event
kind: other
label:
  ar: "خلال الموفّق الثلاث: استيطان أبي داود البصرة ٢٧٠هـ تقريباً"
  en: "Al-Muwaffaq's three wishes: Abu Dawud settles at Basra, c. 272/885"
  ur: "موفق کی تین خواہشیں: ابو داؤد کا بصرہ میں قیام، تقریباً 272ھ/885ء"
summary:
  ar: "حدّث الخطابي عن أبي بكر بن جابر خادم أبي داود قال: كنت مع أبي داود ببغداد فصلينا المغرب فجاءه الأمير أبو أحمد الموفق فدخل، فقال له أبو داود: ما جاء بالأمير في مثل هذا الوقت؟ قال: خلال ثلاث: تنتقل إلى البصرة فتتخذها وطناً ليرحل إليك طلبة العلم فتعمر بك، فإنها قد خربت وانقطع عنها الناس لما جرى عليها من محنة الزنج؛ وتروي لأولادي السنن؛ وتفرد لهم مجلساً فإن أولاد الخلفاء لا يقعدون مع العامة. قال: أما هذه فلا سبيل إليها، لأن الناس في العلم سواء. فكانوا يحضرون ويقعدون في كمّ ضُرب عليه ستر ويسمعون مع العامة {cite:tarikh-islam-dhahabi pp. 361-362}. وبذلك استقر بالبصرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  en: "Al-Khattabi reported from Abu Bakr ibn Jabir, Abu Dawud's servant: I was with Abu Dawud at Baghdad when, after the sunset prayer, the amir Abu Ahmad al-Muwaffaq came in. Abu Dawud asked what brought the amir at such an hour, and he answered: three wishes — move to Basra and make it your home so that seekers of knowledge travel to you and it flourishes through you, for it lies ruined and deserted after the ordeal of the Zanj; transmit the Sunan to my sons; and hold them a separate session, for the sons of caliphs do not sit with the common folk. Abu Dawud answered: as for that, there is no way — people are equal in knowledge. So the princes attended, sitting behind a curtain drawn over a sleeve, hearing with the rest {cite:tarikh-islam-dhahabi pp. 361-362}. He accordingly settled at Basra {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}."
  ur: "خطابی نے ابو بکر بن جابر — ابو داؤد کے خادم — سے روایت کی: میں بغداد میں ابو داؤد کے ساتھ تھا کہ مغرب کی نماز کے بعد امیر ابو احمد موفق اندر آئے۔ ابو داؤد نے پوچھا امیر کو اس وقت کیا لایا؟ انہوں نے کہا: تین خواہشیں — بصرہ منتقل ہو کر اسے اپنا وطن بنا لو تاکہ طالبانِ علم تمہاری طرف آئیں اور وہ تمہارے سبب آباد ہو، کیونکہ وہ زنج کی محنت سے ویران پڑی ہے؛ میرے بیٹوں کو سنن روایت کرو؛ اور ان کے لیے الگ مجلس رکھو کیونکہ خلفا کے بیٹے عوام کے ساتھ نہیں بیٹھتے۔ ابو داؤد نے کہا: یہ ممکن نہیں، کیونکہ علم میں سب برابر ہیں۔ پھر وہ حاضر ہوتے، پردہ کئے ہوئے آستین میں بیٹھتے اور عوام کے ساتھ سنتے {cite:tarikh-islam-dhahabi pp. 361-362}۔ اسی طرح وہ بصرہ میں مستقر ہو گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}۔"
