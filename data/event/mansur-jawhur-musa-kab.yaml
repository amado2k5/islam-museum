label: { ar: "مقتل مغلس وغلب موسى بن كعب السند", en: "Mughallis Slain and Musa ibn Ka'b's Sind", es: "Mughallis asesinado y Sind de Musa ibn Ka'b", fr: "Mughallis tué et Sind de Musa ibn Ka'b" }
summary:
  ar: "صار مغلس العبدي إلى منصور بن جمهور الكلبي وهو بالسند فلقيه منصور فقتله وهزم جنده فلما بلغ أبا مسلم ذلك عقد لموسى بن كعب التميمي ثم وجهه إلى السند فلما قدمها كان بينه وبين منصور بن جمهور مهران ثم التقيا فهزم منصوراً وجيشه وقتل منظوراً أخاه وخرج منصور مفلولاً هارباً حتى ورد الرمل فمات عطشاً وولى موسى السند فرم المنصورة وزاد في مسجدها وغزا وافتتح."
  en: "Mughallis al-Abdi reached Mansur ibn Jawhur al-Kalbi and was killed with his army; Abu Muslim then sent Musa ibn Ka'b al-Tamimi, who met Mansur across the Mihran, routed him and slew his brother Mundhir — Mansur fled broken to die of thirst in the sands. Musa governed Sind, repaired al-Mansura, enlarged its mosque, and raided on."
  es: "Mughallis al-Abdi llegó hasta Mansur ibn Jawhur al-Kalbi y murió junto con su ejército. Abu Muslim envió entonces a Musa ibn Ka'b al-Tamimi, quien se enfrentó a Mansur al otro lado del Mihran, lo derrotó y mató a su hermano Mundhir. Mansur huyó destrozado y murió de sed en las arenas. Musa gobernó Sind, reparó al-Mansura, amplió su mezquita y continuó realizando incursiones."
  fr: "Mughallis al-Abdi atteignit Mansur ibn Jawhur al-Kalbi et fut tué avec son armée; Abu Muslim envoya alors Musa ibn Ka'b al-Tamimi, qui rencontra Mansur de l'autre côté du Mihran, le mit en déroute et tua son frère Mundhir. Mansur, vaincu, s'enfuit et mourut de soif dans le sable. Musa gouverna le Sind, fit restaurer al-Mansura, agrandit sa mosquée et poursuivit ses raids."
