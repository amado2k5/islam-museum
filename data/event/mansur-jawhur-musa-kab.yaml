label: { ar: "مقتل مغلس وغلب موسى بن كعب السند", en: "Mughallis Slain and Musa ibn Ka'b's Sind", es: "Mughallis asesinado y Sind de Musa ibn Ka'b", fr: "Mughallis tué et Sind de Musa ibn Ka'b", ur: "مغلیہ مقتول اور موسیٰ بن کعب کی سندھ", tr: "Babürlerin öldürülmesi ve Musa ibn Ka'b al-Sind'in yenilgisi", id: "Pembunuhan orang-orang Mughal dan kekalahan Musa ibn Ka'b al-Sind" }
summary:
  ar: "صار مغلس العبدي إلى منصور بن جمهور الكلبي وهو بالسند فلقيه منصور فقتله وهزم جنده فلما بلغ أبا مسلم ذلك عقد لموسى بن كعب التميمي ثم وجهه إلى السند فلما قدمها كان بينه وبين منصور بن جمهور مهران ثم التقيا فهزم منصوراً وجيشه وقتل منظوراً أخاه وخرج منصور مفلولاً هارباً حتى ورد الرمل فمات عطشاً وولى موسى السند فرم المنصورة وزاد في مسجدها وغزا وافتتح."
  en: "Mughallis al-Abdi reached Mansur ibn Jawhur al-Kalbi and was killed with his army; Abu Muslim then sent Musa ibn Ka'b al-Tamimi, who met Mansur across the Mihran, routed him and slew his brother Mundhir — Mansur fled broken to die of thirst in the sands. Musa governed Sind, repaired al-Mansura, enlarged its mosque, and raided on."
  es: "Mughallis al-Abdi llegó hasta Mansur ibn Jawhur al-Kalbi y murió junto con su ejército. Abu Muslim envió entonces a Musa ibn Ka'b al-Tamimi, quien se enfrentó a Mansur al otro lado del Mihran, lo derrotó y mató a su hermano Mundhir. Mansur huyó destrozado y murió de sed en las arenas. Musa gobernó Sind, reparó al-Mansura, amplió su mezquita y continuó realizando incursiones."
  fr: "Mughallis al-Abdi atteignit Mansur ibn Jawhur al-Kalbi et fut tué avec son armée; Abu Muslim envoya alors Musa ibn Ka'b al-Tamimi, qui rencontra Mansur de l'autre côté du Mihran, le mit en déroute et tua son frère Mundhir. Mansur, vaincu, s'enfuit et mourut de soif dans le sable. Musa gouverna le Sind, fit restaurer al-Mansura, agrandit sa mosquée et poursuivit ses raids."
  ur: "مغلس العبدی منصور بن جوہر الکلبی تک پہنچا اور اپنے لشکر کے ساتھ مارا گیا۔ اس کے بعد ابو مسلم نے موسیٰ بن کعب التمیمی کو بھیجا، جس نے منصور سے میہران کے پار ملاقات کی، اسے شکست دی اور اس کے بھائی منڈھیر کو قتل کر دیا - منصور ریت میں پیاس سے مرنے کے لیے بھاگ گیا۔ موسیٰ نے سندھ پر حکومت کی، المنصورہ کی مرمت کی، اس کی مسجد کو بڑا کیا، اور چھاپہ مارا۔"
  tr: "Mughalis al-Abdi, Sindh'te bulunan Mansur ibn Jumhur al-Kalbi'nin yanına gitti. Mansur onunla karşılaştı, onu öldürdü ve ordusunu mağlup etti. Ebu Müslim bunu duyunca, Musa ibn Ka'b al-Tamimi'yi görevlendirdi ve onu Sindh'e gönderdi. Oraya vardığında, onunla Mansur ibn Jumhur arasında bir savaş oldu ve sonra karşılaştılar. Musa, Mansur'u ve ordusunu mağlup etti ve kardeşi Manzur'u öldürdü. Mansur yenilerek kaçtı ve kumlara ulaştı, orada susuzluktan öldü. Musa, Sindh valiliğine atandı, böylece Mansurah'ı inşa etti, camisini genişletti ve baskınlar düzenleyip fethetti."
  id: "Mughalis al-Abdi pergi menemui Mansur ibn Jumhur al-Kalbi, yang berada di Sindh. Mansur menemuinya, membunuhnya, dan mengalahkan pasukannya. Ketika Abu Muslim mendengar hal ini, ia menunjuk Musa ibn Ka’b al-Tamimi dan mengirimnya ke Sindh. Ketika ia tiba di sana, terjadi pertempuran antara dia dan Mansur ibn Jumhur, dan kemudian mereka bertemu. Ia mengalahkan Mansur dan pasukannya serta membunuh saudaranya, Manzur. Mansur pergi dengan kekalahan dan melarikan diri hingga mencapai padang pasir, di mana ia mati kehausan. Musa diangkat menjadi gubernur Sindh, sehingga ia membangun al-Mansurah, memperluas masjidnya, dan melakukan penyerangan serta penaklukan."
