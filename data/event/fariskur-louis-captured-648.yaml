summary:
  ar: "استهلت سنة ثمان وأربعين وستمائة والفرنج على المنصورة والمسلمون بازائهم مستظهرون لانقطاع الميرة عن الفرنج ووقوع المرض في خيلهم؛ ثم عزم ملكهم الفرنسيس على المسير ليلاً إلى دمياط ففطن المسلمون، وكان الفرنج قد عملوا جسراً على النيل فنسوا قطعة فعبر عليها الناس وأحدقوا بهم؛ فاجتمع إلى الفرنسيس خمسمائة فارس من أبطاله فحملوا على المسلمين حملة واحدة ففرّج لهم المسلمون فلما صاروا في وسطهم أطبقوا عليهم فلم ينجُ منهم أحد، وأمسك الفرنسيس أسرة سيف الدين القيمري باني المارستان بصالحية دمشق؛ قال سعد الدين بن هموية كانت الأسرى نيفاً وعشرين ألفاً فيهم ملوك وكبار وكانت القتلى سبعة آلاف واستشهد من المسلمين نحو مائتي نفس؛ وخلع الملك المعظم على كبار الفرنج خمسين خلعة فامتنع الفرنسيس من لبسها وقال أنا مملكتي بقدر مملكة صاحب مصر كيف ألبس خلعته؛ واعتقل بالمنصورة وذلك في أول يوم من المحرم {cite:shadharat-dhahab p. 247-248}."
  en: "At the year's opening (Muharram 648) the Franks' king Louis marched by night toward Damietta; a forgotten section of their Nile bridge let the Muslims across to encircle them. Five hundred of Louis's champions charged, were let through, and were swallowed — not one escaped; Sayf al-Din al-Qaymari's men took Louis, twenty-five-odd thousand captives in all, seven thousand slain for about two hundred Muslim martyrs. Offered a khil'a, Louis refused: 'my kingdom is as big as Egypt's king's' {cite:shadharat-dhahab p. 247-248}."
  es: "Al comienzo del año (Muharram 648), el rey Luis de los francos marchó de noche hacia Damietta; un tramo olvidado de su puente sobre el Nilo permitió a los musulmanes cruzar y rodearlos. Quinientos campeones de Luis cargaron, fueron dejados pasar y fueron engullidos; ninguno escapó. Los hombres de Sayf al-Din al-Qaymari capturaron a Luis, con un total de veinticinco mil cautivos, siete mil muertos por unos doscientos mártires musulmanes. Ofrecido a un khil'a, Luis lo rechazó: «Mi reino es tan grande como el del rey de Egipto» {cita: shadharat-dhahab págs. 247-248}."
  fr: "Au début de l'année (Muharram 648), le roi des Francs, Louis, marcha de nuit vers Damiette. Un tronçon oublié de leur pont sur le Nil permit aux musulmans de les encercler. Cinq cents des champions de Louis chargèrent, furent autorisés à passer et furent engloutis – aucun ne s'échappa. Les hommes de Sayf al-Din al-Qaymari capturèrent Louis, faisant au total quelque vingt-cinq mille prisonniers, sept mille tués pour environ deux cents martyrs musulmans. On lui proposa le khil'a, mais Louis refusa: « Mon royaume est aussi vaste que celui du roi d'Égypte » (cf. shadharat-dhahab, p. 247-248)."
  ur: "سال کے آغاز پر ⁦(محرم 648)⁩ فرینکس کے بادشاہ لوئس نے رات کو ڈیمیٹا کی طرف کوچ کیا۔ ان کے نیل کے پل کے ایک بھولے ہوئے حصے نے مسلمانوں کو ان کا گھیراؤ کرنے کی اجازت دی۔ لوئس کے پانچ سو چیمپینز پر الزام لگایا گیا، گزرنے دیا گیا، اور نگل لیا گیا - ایک بھی بچ نہیں سکا۔ سیف الدین القیمری کے آدمیوں نے لوئیس کو لے لیا، مجموعی طور پر پچیس ہزار اسیر ہوئے، تقریباً دو سو مسلمان شہیدوں کے بدلے سات ہزار قتل ہوئے۔ خلع کی پیشکش کی تو لوئس نے انکار کر دیا: 'میری سلطنت مصر کے بادشاہ کی طرح بڑی ہے'۔ 247-248}۔"
