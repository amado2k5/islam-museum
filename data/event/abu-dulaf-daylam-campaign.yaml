label: { ar: "غزو أبي دلف للديلم", en: "Abu Dulaf's Daylam Campaign", fr: "Campagne d’Abu Dulaf au Daylam", es: "Campaña de Abu Dulaf en Daylam", ur: "ابو دلف کی دیلام مہم" }
summary:
  ar: "كان أبو دلف القاسم بن عيسى غزا الديلم في خلافة المأمون وهو والٍ في خلافة المعتصم أيام ولاية الأفشين الجبال ففتح حصوناً منها إقلسم صالح أهله على أتاوة ومنها بومج فتحه عنوة ثم صالح أهله على أتاوة ومنها الإبلام ومنها أنداق في حصون أخر وأغزى الأفشين غير أبي دلف ففتح أيضاً من الديلم حصوناً."
  en: "Abu Dulaf al-Qasim ibn Isa raided Daylam in al-Ma'mun's reign and was governor under al-Mu'tasim in al-Afshin's Jibal command, taking fortresses — Iqlism whose people treated for tribute, Bumaj taken by force then brought to tribute-terms, al-Iblam and Andaq among others — while al-Afshin sent other raiders who took Daylami forts as well."
  fr: "Abu Dulaf al-Qasim ibn Isa mena un raid au Daylam sous al-Ma'mun et fut gouverneur sous al-Mu'tasim dans le commandement d’al-Afshin au Jibal. Il prit des forteresses, dont Iqlism, dont les habitants négocièrent un tribut, Bumaj, prise de force puis soumise à un accord de tribut, al-Iblam et Andaq ; al-Afshin envoya aussi d’autres hommes qui prirent des forts du Daylam."
  es: "Abu Dulaf al-Qasim ibn Isa saqueó Daylam durante el reinado de al-Ma'mun y fue gobernador bajo el mando de al-Mu'tasim en Jibal, territorio gobernado por al-Afshin, tomando fortalezas como Iqlism, cuyos habitantes eran sometidos a tributo; Bumaj, tomada por la fuerza y luego sometida a condiciones de tributo; al-Iblam y Andaq, entre otras. Al mismo tiempo, al-Afshin envió a otros asaltantes que también tomaron fortalezas daylamitas."
  ur: "ابو دلف القاسم ابن عیسیٰ نے المامون کے دور حکومت میں دیلام پر چھاپہ مارا اور المعتصم کے ماتحت الافشین کی جبل کمان میں گورنر تھا، قلعوں پر قبضہ کیا - اقلیت جس کے لوگوں نے خراج تحسین پیش کیا، بوماج کو زبردستی لیا گیا پھر خراج تحسین پیش کیا گیا، الاقفین اور دوسرے لوگوں کے درمیان جنہوں نے الاقفین اور دوسرے لوگوں کو بھیجا دیلامی قلعے بھی۔"
