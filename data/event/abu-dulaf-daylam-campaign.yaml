  ar: "كان أبو دلف القاسم بن عيسى غزا الديلم في خلافة المأمون وهو والٍ في خلافة المعتصم أيام ولاية الأفشين الجبال ففتح حصوناً منها إقلسم صالح أهله على أتاوة ومنها بومج فتحه عنوة ثم صالح أهله على أتاوة ومنها الإبلام ومنها أنداق في حصون أخر وأغزى الأفشين غير أبي دلف ففتح أيضاً من الديلم حصوناً."
  en: "Abu Dulaf al-Qasim ibn Isa raided Daylam in al-Ma'mun's reign and was governor under al-Mu'tasim in al-Afshin's Jibal command, taking fortresses — Iqlism whose people treated for tribute, Bumaj taken by force then brought to tribute-terms, al-Iblam and Andaq among others — while al-Afshin sent other raiders who took Daylami forts as well."
