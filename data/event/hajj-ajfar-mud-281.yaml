summary:
  ar: "حجّ بالناس سنة إحدى وثمانين ومائتين محمد بن هارون، وأصاب الحاج بالأجفر مطر عظيم فمات منهم بشر كثير، وكان الرجل يغرق في الوحل فلا يقدر أحد على إخراجه {cite:muntazam-ibn-al-jawzi p. 147}."
  en: "In the 281 pilgrimage a great rain struck the caravan at al-Ajfar; many perished, a man would sink into the mud and none could pull him out {cite:muntazam-ibn-al-jawzi p. 147}."
  es: "En la peregrinación del año 281, una gran lluvia azotó la caravana en al-Ajfar; muchos perecieron, un hombre se hundía en el lodo y nadie podía sacarlo {cite:muntazam-ibn-al-jawzi p. 147}."
  fr: "Lors du pèlerinage de 281, une grande pluie s'abattit sur la caravane à al-Ajfar; beaucoup périrent, un homme s'enfonçait dans la boue et personne ne pouvait le sortir {cite:muntazam-ibn-al-jawzi p. 147}."
  ur: "281 حج میں قافلہ الاجفر پر زبردست بارش ہوئی۔ بہت سے لوگ ہلاک ہو گئے، آدمی کیچڑ میں دھنس جائے گا اور کوئی اسے باہر نہ نکال سکے گا۔ 147}۔"
  tr: "Hicri 281 yılında Muhammed ibn Harun, Hac ibadetinde insanlara önderlik etti. El-Ajfar'da hacıların üzerine şiddetli bir yağmur yağdı ve birçoğu öldü. Bir adam çamura saplanıyor, kimse onu çıkaramıyordu. {cite:muntazam-ibn-al-jawzi s. 147}"
  id: "Pada tahun 281 Hijriah, Muhammad bin Harun memimpin umat Islam dalam ibadah haji. Hujan deras mengguyur para jamaah haji di Al-Ajfar, dan banyak dari mereka meninggal dunia. Seorang pria akan tenggelam ke dalam lumpur, dan tidak ada seorang pun yang dapat mengeluarkannya. {cite:muntazam-ibn-al-jawzi p. 147}"
