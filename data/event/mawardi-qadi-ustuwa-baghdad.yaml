id: event/mawardi-qadi-ustuwa-baghdad
class: event
kind: other
label:
  ar: "الماوردي مدرّسًا ثم قاضيًا بأستوى ثم ببغداد"
  en: "Al-Mawardi as teacher, then qadi at Ustuwa and at Baghdad"
  ur: "ماوردی بطور مدرس، پھر استویٰ اور بغداد میں قاضی"
  es: "Al-Mawardi como maestro, luego cadí en Ustuwa y Bagdad"
  fr: "Al-Mawardi comme enseignant, puis cadi à Ustuwa et à Bagdad"
  tr: "El-Mawardi önce öğretmen, sonra İstiva'da ve ardından Bağdat'ta hakimlik yaptı."
  id: "Al-Mawardi adalah seorang guru dan kemudian menjadi hakim di Istawa dan kemudian di Baghdad."
summary:
  ar: "بعد إتمام دراسته بالبصرة وبغداد صار [[person/al-mawardi|الماوردي]] مدرّسًا، ولفت إليه سعة علمه وتنوّعه أنظار الأمراء فوُلي القضاء في بلدان عدة، منها أستوى قرب [[place/nishapur|نيسابور]]، ثم قضاء بغداد نفسها {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  en: "After completing his studies at Basra and Baghdad, [[person/al-mawardi|al-Mawardi]] became a teacher; the breadth of his learning drew the attention of the authorities, and he was appointed qadi in several towns — among them Ustuwa near [[place/nishapur|Nishapur]] — before holding the office at Baghdad itself {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  ur: "بصرہ اور بغداد میں تعلیم مکمل کرنے کے بعد [[person/al-mawardi|ماوردی]] مدرس بن گئے؛ ان کے علم کی وسعت نے حکمرانوں کی توجہ حاصل کی اور وہ کئی شہروں میں قاضی مقرر ہوئے — جن میں [[place/nishapur|نیشاپور]] کے قریب استویٰ بھی تھا — اس سے پہلے کہ وہ خود بغداد میں یہ منصب سنبھالیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔"
  es: "Después de completar sus estudios en Basora y Bagdad, [[person/al-mawardi|al-Mawardi]] se convirtió en maestro; la amplitud de sus conocimientos atrajo la atención de las autoridades, y fue nombrado cadí en varias ciudades, entre ellas Ustuwa cerca de [[place/nishapur|Nishapur]], antes de ocupar el cargo en la propia Bagdad {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  fr: "Après avoir terminé ses études à Bassora et à Bagdad, [[person/al-mawardi|al-Mawardi]] devint enseignant; l'étendue de son savoir attira l'attention des autorités, et il fut nommé cadi dans plusieurs villes — parmi lesquelles Ustuwa près de [[place/nishapur|Nishapur]] — avant d'occuper la fonction à Bagdad même {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  tr: "Basra ve Bağdat'taki eğitimini tamamladıktan sonra El-Mawardi öğretmen oldu. Bilgisinin genişliği ve çeşitliliği prenslerin dikkatini çekti ve Nişapur yakınlarındaki Astawa da dahil olmak üzere çeşitli yerlerde, daha sonra da Bağdat'ın yargısında görevlendirildi."
  id: "Setelah menyelesaikan studinya di Basra dan Baghdad, Al-Mawardi menjadi seorang guru. Luas dan beragamnya pengetahuannya menarik perhatian para pangeran, dan ia diangkat menjadi hakim di beberapa negara, termasuk Astawa dekat Nishapur, dan kemudian menjadi hakim di Baghdad sendiri."
