id: event/mawardi-qadi-ustuwa-baghdad
class: event
kind: other
label:
  ar: "الماوردي مدرّسًا ثم قاضيًا بأستوى ثم ببغداد"
  en: "Al-Mawardi as teacher, then qadi at Ustuwa and at Baghdad"
  ur: "ماوردی بطور مدرس، پھر استویٰ اور بغداد میں قاضی"
summary:
  ar: "بعد إتمام دراسته بالبصرة وبغداد صار [[person/al-mawardi|الماوردي]] مدرّسًا، ولفت إليه سعة علمه وتنوّعه أنظار الأمراء فوُلي القضاء في بلدان عدة، منها أستوى قرب [[place/nishapur|نيسابور]]، ثم قضاء بغداد نفسها {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  en: "After completing his studies at Basra and Baghdad, [[person/al-mawardi|al-Mawardi]] became a teacher; the breadth of his learning drew the attention of the authorities, and he was appointed qadi in several towns — among them Ustuwa near [[place/nishapur|Nishapur]] — before holding the office at Baghdad itself {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  ur: "بصرہ اور بغداد میں تعلیم مکمل کرنے کے بعد [[person/al-mawardi|ماوردی]] مدرس بن گئے؛ ان کے علم کی وسعت نے حکمرانوں کی توجہ حاصل کی اور وہ کئی شہروں میں قاضی مقرر ہوئے — جن میں [[place/nishapur|نیشاپور]] کے قریب استویٰ بھی تھا — اس سے پہلے کہ وہ خود بغداد میں یہ منصب سنبھالیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔"
