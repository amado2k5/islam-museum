label: { ar: "صاعقة المسجد النبوي سنة 886هـ" }
summary:
  ar: "في رمضان سنة ست وثمانين وثمان مئة كانت الصاعقة التي احترق بشرارها المسجد الشريف النبوي سقفه وحواصله وخزائن كتبه وربعاته ولم يبق من قناطره وأساطينه إلا اليسير وكانت آية من آيات الله تعالى وقال بعضهم فيه لم يحترق حرم النبي لريبة تخشى عليه وما به من عار لكنما أيدي الروافض لامست تلك الرسوم فطهرت بالنار وفيها في سابع عشر المحرم كانت بمكة زلزلة هائلة لم يسمع بمثلها {cite:shadharat-dhahab p. 343-344}."
  en: "In Ramadan 886 a lightning strike burned the Prophet's noble Mosque — its roof, stores, book-treasury and lodgings, little of its arches and pillars left standing; some recited over it: 'the Prophet's sanctuary burned for no suspicion feared upon him nor any stain — but the Rawafid's hands touched those traces and fire purified them'. On 17 Muharram of the same year a tremendous quake struck Mecca, the like unheard of {cite:shadharat-dhahab p. 343-344}."
