label: { ar: "صاعقة المسجد النبوي سنة 886هـ", en: "The lightning strike on the Prophet's Mosque, 886", es: "El rayo que cayó sobre la Mezquita del Profeta, 886", fr: "La foudre frappe la mosquée du Prophète, 886", ur: "مسجد نبوی پر آسمانی بجلی گرنا، 886", tr: "Hicri 886 yılında Peygamber Mescidi'ne yıldırım düşmesi.", id: "Sambaran petir di Masjid Nabi pada tahun 886 Hijriah" }
summary:
  ar: "في رمضان سنة ست وثمانين وثمان مئة كانت الصاعقة التي احترق بشرارها المسجد الشريف النبوي سقفه وحواصله وخزائن كتبه وربعاته ولم يبق من قناطره وأساطينه إلا اليسير وكانت آية من آيات الله تعالى وقال بعضهم فيه لم يحترق حرم النبي لريبة تخشى عليه وما به من عار لكنما أيدي الروافض لامست تلك الرسوم فطهرت بالنار وفيها في سابع عشر المحرم كانت بمكة زلزلة هائلة لم يسمع بمثلها {cite:shadharat-dhahab p. 343-344}."
  en: "In Ramadan 886 a lightning strike burned the Prophet's noble Mosque — its roof, stores, book-treasury and lodgings, little of its arches and pillars left standing; some recited over it: 'the Prophet's sanctuary burned for no suspicion feared upon him nor any stain — but the Rawafid's hands touched those traces and fire purified them'. On 17 Muharram of the same year a tremendous quake struck Mecca, the like unheard of {cite:shadharat-dhahab p. 343-344}."
  es: "En Ramadán 886, un rayo arrasó la noble Mezquita del Profeta: su techo, almacenes, tesoro de libros y aposentos, y pocos de sus arcos y pilares quedaron en pie. Algunos recitaron sobre ella: «El santuario del Profeta ardió sin temor alguno sobre él ni mancha alguna, sino que las manos del Rawafid tocaron esas huellas y el fuego las purificó». El 17 de Muharram del mismo año, un tremendo terremoto sacudió La Meca, sin precedentes {cite:shadharat-dhahab p. 343-344}."
  fr: "Durant le Ramadan 886, la foudre frappa la mosquée du Prophète, détruisant son toit, ses réserves, sa bibliothèque et ses appartements. Seules quelques arches et piliers restèrent debout. Certains récitèrent alors: « Le sanctuaire du Prophète brûla sans qu'aucun soupçon ne pèse sur lui, sans qu'aucune souillure ne soit entachée. Mais les mains des Rawafid touchèrent ces traces et le feu les purifia. » Le 17 Muharram de la même année, un terrible tremblement de terre frappa La Mecque, un séisme sans précédent (voir: shadharat-dhahab, p. 343-344)."
  ur: "رمضان 886 میں آسمانی بجلی گرنے سے مسجد نبوی جل گئی - اس کی چھت، دکانیں، کتابوں کے خزانے اور قیام گاہیں، اس کی چھوٹی محرابیں اور ستون کھڑے رہ گئے۔ بعض نے اس پر یہ تلاوت کی: 'مقدس رسول کو اس لیے جلایا گیا کہ اس پر کسی شک کا اندیشہ نہ ہو اور نہ ہی کوئی داغ، لیکن رافضیوں کے ہاتھوں نے ان نشانات کو چھو لیا اور آگ نے انہیں پاک کر دیا۔' اسی سال 17 محرم کو مکہ مکرمہ میں ایک زبردست زلزلہ آیا، جیسا کہ کبھی سنا نہیں گیا تھا۔ 343-344}۔"
  tr: "Hicri 886 yılının Ramazan ayında, kıvılcımları Peygamber Mescidi'ni, çatısını, depolarını, kitap hazinelerini ve avlularını yakan bir yıldırım düştü; kemerlerinin ve sütunlarının sadece küçük bir kısmı ayakta kaldı. Bu, Yüce Allah'ın işaretlerinden biriydi. Bazıları, Peygamber Mescidi'nin yakılmasının, ondan duyulan herhangi bir şüphe veya utançtan dolayı olmadığını, aksine Rafizilerin ellerinin o kutsal sembollere dokunduğu için ateşle temizlendiğini söylediler. Ve on yedinci Muharrem'de Mekke'de, daha önce hiç duyulmamış kadar büyük bir deprem oldu. {Kaynak: Şadharat-dahab s. 343-344}"
  id: "Pada bulan Ramadan tahun 886 Hijriah, terjadi sambaran petir yang percikannya membakar Masjid Nabi, atapnya, ruang penyimpanannya, perbendaharaan kitabnya, dan halamannya, dan hanya sedikit lengkungan dan pilarnya yang tersisa. Itu adalah tanda dari tanda-tanda Allah Yang Maha Kuasa. Sebagian dari mereka mengatakan tentang hal itu bahwa tempat suci Nabi tidak terbakar karena kecurigaan yang dikhawatirkan, atau karena rasa malu di dalamnya, tetapi tangan kaum Rafid menyentuh simbol-simbol itu, sehingga simbol-simbol itu disucikan oleh api. Dan di dalamnya, pada tanggal tujuh belas Muharram, terjadi gempa bumi dahsyat di Mekah, yang belum pernah terjadi sebelumnya. {cite:shadharat-dhahab hlm. 343-344}"
