id: event/musa-bugha-expedition-263
class: event
kind: campaign
label:
  ar: "جيش موسى بن بغا لعزل ابن طولون يتفرق، ٢٦٣هـ/٨٧٧م"
  en: "Musa ibn Bugha's army sent to remove Ibn Tulun dissolves, 263/877"
  ur: "موسیٰ بن بغا کی ابن طولون کی برطرفی کے لیے روانہ فوج کا بکھرنا، 263ھ/877ء"
  es: "El ejército de Musa ibn Bugha, enviado para expulsar a Ibn Tulun, se disuelve, 263/877."
  fr: "L'armée de Musa ibn Bugha envoyée pour destituer Ibn Tulun se dissout, 263/877"
  tr: "İbn Tulun'u tahttan indirmek için gönderilen Musa ibn Bugha'nın ordusu, Hicri 263/Miladi 877 yılında dağıldı."
  id: "Pasukan Musa bin Bugha, yang dikirim untuk menggulingkan Ibnu Tulun, bubar, 263 H/877 M"
summary:
  ar: "لما رأى الموفق — المنشغل بحرب الزنج — أن ما بعث به ابن طولون من المال دون مراده، جهّز سنة ثلاث وستين ومائتين جيشاً بقيادة موسى بن بغا لعزله، فانهارت الحملة بمطالب الجند وبما بثّته قوى ابن طولون من الخوف؛ وكان ابن طولون قد كتب إلى الموفق يذكّره أن لا ولاية له على مصر أصلاً {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
  en: "When al-Muwaffaq, absorbed in the Zanj war, judged Ibn Tulun's remittance insufficient, he dispatched in 263/877 a force under Musa ibn Bugha to remove him; the expedition collapsed under the soldiers' demands and the fear Ibn Tulun's forces inspired. Ibn Tulun had written to al-Muwaffaq pointing out that he had no formal jurisdiction over Egypt at all {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
  ur: "جب موفق — جو زنج کی جنگ میں مصروف تھا — نے ابن طولون کی بھیجی ہوئی رقم ناکافی پائی تو 263ھ/877ء میں اس نے موسیٰ بن بغا کی قیادت میں اسے ہٹانے کے لیے فوج بھیجی؛ مگر سپاہیوں کے مطالبوں اور ابن طولون کی قوتوں سے بکھرنے والے خوف سے مہم ناکام ہو گئی۔ ابن طولون نے موفق کو لکھا تھا کہ مصر پر اس کا کوئی باقاعدہ اختیار ہی نہیں {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}۔"
  es: "Cuando al-Muwaffaq, absorto en la guerra de Zanj, consideró insuficiente la remisión de Ibn Tulun, envió en 263/877 una fuerza al mando de Musa ibn Bugha para expulsarlo; la expedición fracasó debido a las exigencias de los soldados y al temor que inspiraban las fuerzas de Ibn Tulun. Ibn Tulun le había escrito a al-Muwaffaq señalando que no tenía jurisdicción formal alguna sobre Egipto {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
  fr: "Lorsque al-Muwaffaq, absorbé par la guerre du Zanj, jugea la remise d'Ibn Tulun insuffisante, il dépêcha en 263/877 une armée sous le commandement de Musa ibn Bugha pour le destituer; l'expédition échoua face aux revendications des soldats et à la crainte inspirée par les troupes d'Ibn Tulun. Ce dernier avait écrit à al-Muwaffaq pour lui faire remarquer qu'il n'avait aucune juridiction officielle sur l'Égypte."
  tr: "Zenc Savaşı ile meşgul olan Muvaffak, İbn Tulun'un gönderdiği paranın ihtiyaçlarını karşılamaya yetmediğini görünce, Hicri 263 yılında onu devirmek için Musa İbn Bugha komutasında bir ordu hazırladı. Ancak askerlerin talepleri ve İbn Tulun'un güçlerinin yaydığı korku nedeniyle sefer başarısız oldu. İbn Tulun, Muvaffak'a Mısır üzerinde hiçbir yetkisinin olmadığını hatırlatan bir mektup yazmıştı. {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}"
  id: "Ketika Al-Muwaffaq—yang sedang sibuk dengan Perang Zanj—melihat bahwa uang yang dikirim Ibn Tulun tidak cukup untuk kebutuhannya, ia mempersiapkan pasukan pada tahun 263 H di bawah komando Musa Ibn Bugha untuk menggulingkannya. Kampanye tersebut gagal karena tuntutan para prajurit dan ketakutan yang disebarkan oleh pasukan Ibn Tulun. Ibn Tulun telah menulis surat kepada Al-Muwaffaq untuk mengingatkannya bahwa ia sama sekali tidak memiliki wewenang atas Mesir. {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
