id: event/musa-bugha-expedition-263
class: event
kind: campaign
label:
  ar: "جيش موسى بن بغا لعزل ابن طولون يتفرق، ٢٦٣هـ/٨٧٧م"
  en: "Musa ibn Bugha's army sent to remove Ibn Tulun dissolves, 263/877"
  ur: "موسیٰ بن بغا کی ابن طولون کی برطرفی کے لیے روانہ فوج کا بکھرنا، 263ھ/877ء"
summary:
  ar: "لما رأى الموفق — المنشغل بحرب الزنج — أن ما بعث به ابن طولون من المال دون مراده، جهّز سنة ثلاث وستين ومائتين جيشاً بقيادة موسى بن بغا لعزله، فانهارت الحملة بمطالب الجند وبما بثّته قوى ابن طولون من الخوف؛ وكان ابن طولون قد كتب إلى الموفق يذكّره أن لا ولاية له على مصر أصلاً {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
  en: "When al-Muwaffaq, absorbed in the Zanj war, judged Ibn Tulun's remittance insufficient, he dispatched in 263/877 a force under Musa ibn Bugha to remove him; the expedition collapsed under the soldiers' demands and the fear Ibn Tulun's forces inspired. Ibn Tulun had written to al-Muwaffaq pointing out that he had no formal jurisdiction over Egypt at all {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}."
  ur: "جب موفق — جو زنج کی جنگ میں مصروف تھا — نے ابن طولون کی بھیجی ہوئی رقم ناکافی پائی تو 263ھ/877ء میں اس نے موسیٰ بن بغا کی قیادت میں اسے ہٹانے کے لیے فوج بھیجی؛ مگر سپاہیوں کے مطالبوں اور ابن طولون کی قوتوں سے بکھرنے والے خوف سے مہم ناکام ہو گئی۔ ابن طولون نے موفق کو لکھا تھا کہ مصر پر اس کا کوئی باقاعدہ اختیار ہی نہیں {cite:encyclopaedia-of-islam-2 vol. 1 p. 300-301} {cite:encyclopaedia-of-islam-2 vol. 10 p. 668}۔"
