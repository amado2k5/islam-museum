summary:
  ar: "عند البلاذري: لما انصرف أبو موسى وعبد الله بن قيس الأشعري من نهاوند سارا إلى الأهواز فاستقراها ثم أتيا قم فأقاما عليها أياماً ثم افتتحاها ووجه الأحنف بن قيس واسمه الضحاك بن قيس التميمي إلى قاشان ففتحها عنوة ثم لحق به وروي أن الأشعري نزل بأصبهان فعرض عليهم الإسلام فأبوا فعرض عليهم الجزية فصالحوه عليها فباتوا على صلح ثم أصبحوا على غدر فقاتلهم فأظهره الله عليهم قال محمد بن سعد أحسبه عن أهل قم."
  en: "In al-Baladhuri: when Abu Musa and Abdallah ibn Qays al-Ash'ari returned from Nihawand they went to al-Ahwaz and settled it, then came to Qumm and stayed upon it days before taking it; al-Ahnaf ibn Qays — his name al-Dahhak ibn Qays al-Tamimi — was sent to Qashan, took it by force, and joined them. It is also related that al-Ash'ari camped at Isbahan — or, Ibn Sa'd thinks, Qumm — offered them Islam which they refused, then jizya which they accepted by night, broke faith at morning, and he fought them until God gave him the mastery."
  es: "En al-Baladhuri: cuando Abu Musa y Abdallah ibn Qays al-Ash'ari regresaron de Nihawand, fueron a al-Ahwaz y se establecieron allí, luego llegaron a Qumm y permanecieron allí durante días antes de tomarla; al-Ahnaf ibn Qays —su nombre al-Dahhak ibn Qays al-Tamimi— fue enviado a Qashan, la tomó por la fuerza y se unió a ellos. También se relata que al-Ash'ari acampó en Isbahan —o, según Ibn Sa'd, Qumm—, les ofreció el Islam, que ellos rechazaron, luego la yizia, que aceptaron por la noche, rompieron su fe por la mañana, y él luchó contra ellos hasta que Dios le concedió la victoria."
  fr: "Selon al-Baladhuri: lorsqu’Abu Musa et Abdallah ibn Qays al-Ash’ari revinrent de Nihawand, ils se rendirent à al-Ahwaz et s’y installèrent, puis arrivèrent à Qumm et y séjournèrent plusieurs jours avant de s’en emparer. al-Ahnaf ibn Qays – plus connu sous le nom d’al-Dahhak ibn Qays al-Tamimi – fut envoyé à Qashan, s’en empara par la force et se joignit à eux. Il est également rapporté qu’al-Ash’ari campa à Isbahan – ou, selon Ibn Sa’d, à Qumm – leur proposa l’islam, qu’ils refusèrent, puis la jizya, qu’ils acceptèrent de nuit. Au matin, ils renoncèrent à leur foi, et il les combattit jusqu’à ce que Dieu lui accorde la victoire."
  ur: "البلادوری میں ہے: جب ابو موسیٰ اور عبداللہ بن قیس اشعری نہوند سے واپس آئے تو وہ الاہواز گئے اور اسے آباد کیا، پھر قم آئے اور اسے لینے سے کچھ دن پہلے اس پر قیام کیا۔ الاحنف ابن قیس - اس کا نام الضحاک ابن قیس التمیمی - کو کاشان بھیجا گیا، اسے زبردستی لے لیا اور ان کے ساتھ شامل ہوگیا۔ یہ بھی روایت ہے کہ اشعری نے اصبہان میں ڈیرہ ڈالا یا ابن سعد کے خیال میں قم نے انہیں اسلام پیش کیا جس سے انہوں نے انکار کر دیا، پھر جزیہ جو انہوں نے رات کو قبول کر لیا، صبح کو ایمان توڑ دیا، اور وہ ان سے اس وقت تک لڑتے رہے جب تک کہ اللہ تعالیٰ نے اسے اقتدار عطا نہ کر دیا۔"
  tr: "El-Baladhuri'ye göre: Ebu Musa ve Abdullah bin Kays el-Eş'ari Nahavand'dan ayrılıp Ahvaz'a gittiler ve oraya yerleştiler. Sonra Kum'a geldiler ve orada birkaç gün kaldılar. Daha sonra Kum'u fethettiler ve adı El-Dahhak bin Kays el-Tamimi olan El-Ahnaf bin Kays'ı Kaşan'a gönderdiler. O da Kaşan'ı zorla fethetti ve sonra onlara katıldı. Rivayet edildiğine göre El-Eş'ari İsfahan'da kaldı ve onlara İslam'ı teklif etti, ancak onlar reddettiler. Bunun üzerine onlara cizye teklif etti ve onlar da onunla barıştılar. Huzur içinde uyudular, sonra sabahleyin hainlik ettiler. Bunun üzerine El-Eş'ari onlarla savaştı ve Allah onu onlara karşı galip kıldı. Muhammed bin Sa'd dedi ki, sanırım bu Kum halkının rivayetine dayanmaktadır."
  id: "Menurut Al-Baladhuri: Ketika Abu Musa dan Abdullah bin Qais Al-Ash’ari meninggalkan Nahavand, mereka pergi ke Ahwaz dan menetap di sana. Kemudian mereka datang ke Qum dan tinggal di sana selama beberapa hari. Kemudian mereka menaklukkannya dan mengirim Al-Ahnaf bin Qais, yang bernama Al-Dahhak bin Qais Al-Tamimi, ke Kashan. Dia menaklukkannya dengan kekerasan dan kemudian bergabung dengannya. Diriwayatkan bahwa Al-Ash’ari tinggal di Isfahan dan menawarkan Islam kepada mereka, tetapi mereka menolak. Maka dia menawarkan jizya kepada mereka, dan mereka berdamai dengannya atas hal itu. Mereka tidur dengan damai, kemudian mereka menjadi khianat di pagi hari. Maka dia memerangi mereka, dan Allah memberinya kemenangan atas mereka. Muhammad bin Sa’d berkata, saya pikir itu berdasarkan riwayat dari penduduk Qum."
