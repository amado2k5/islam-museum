label: { ar: "فتح قم وقاشان", en: "The Conquest of Qumm and Qashan" }
summary:
  ar: "عند البلاذري: لما انصرف أبو موسى وعبد الله بن قيس الأشعري من نهاوند سارا إلى الأهواز فاستقراها ثم أتيا قم فأقاما عليها أياماً ثم افتتحاها ووجه الأحنف بن قيس واسمه الضحاك بن قيس التميمي إلى قاشان ففتحها عنوة ثم لحق به وروي أن الأشعري نزل بأصبهان فعرض عليهم الإسلام فأبوا فعرض عليهم الجزية فصالحوه عليها فباتوا على صلح ثم أصبحوا على غدر فقاتلهم فأظهره الله عليهم قال محمد بن سعد أحسبه عن أهل قم."
  en: "In al-Baladhuri: when Abu Musa and Abdallah ibn Qays al-Ash'ari returned from Nihawand they went to al-Ahwaz and settled it, then came to Qumm and stayed upon it days before taking it; al-Ahnaf ibn Qays — his name al-Dahhak ibn Qays al-Tamimi — was sent to Qashan, took it by force, and joined them. It is also related that al-Ash'ari camped at Isbahan — or, Ibn Sa'd thinks, Qumm — offered them Islam which they refused, then jizya which they accepted by night, broke faith at morning, and he fought them until God gave him the mastery."
