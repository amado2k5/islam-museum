label: { ar: "ضياع ماردة عن ابن هود", en: "Loss of Merida from Ibn Hud", es: "La pérdida de Mérida por Ibn Hud", fr: "La perte de Mérida d'après Ibn Hud", ur: "ابن ہود سے مریدہ کا نقصان", tr: "İbn Hud'dan Mardah'ın kaybı", id: "Hilangnya Mardah dari Ibnu Hud" }
summary:
  ar: "دخل العدو كورة ماردة من محمد بن هود سنة ست وعشرين وستمائة، وكانت مفتتح المصائب على يده، وهي قاعدة بلاد الجوف في مدة العرب والعجم، وبين ماردة وقرطبة خمسة أيام {cite:nafh-tib-maqqari p. 469-470}."
  en: "The Christians took the district of Merida from Muhammad ibn Hud in 626 — 'the opener of calamities at his hand,' for Merida had been the capital of the al-Jawf country in Arab and Ajam days {cite:nafh-tib-maqqari p. 469-470}."
  es: "Los cristianos tomaron el distrito de Mérida de Muhammad ibn Hud en 626, 'el que abrió las calamidades por su mano', pues Mérida había sido la capital del país de al-Jawf en los días árabes y ajamíes {cite:nafh-tib-maqqari p. 469-470}."
  fr: "Les chrétiens prirent le district de Mérida à Muhammad ibn Hud en 626 — « celui qui a déclenché les calamités de sa main », car Mérida avait été la capitale du pays d'al-Jawf à l'époque arabe et ajam {cite:nafh-tib-maqqari p. 469-470}."
  ur: "عیسائیوں نے 626 میں محمد بن ہود سے مریدہ کا ضلع چھین لیا - 'اس کے ہاتھ پر آفات کا آغاز'، کیونکہ مریدا عرب اور عجم کے زمانے میں الجوف ملک کا دار الحکومت تھا۔ 469-470}۔"
  tr: "Düşman, altı yüz yirmi altı yılında Muhammed ibn Hud'dan Mérida bölgesine girdi ve bu, onun elinden gelen felaketlerin başlangıcı oldu. Bu bölge, Araplar ve Arap olmayanlar döneminde El-Jawf topraklarının merkezidir ve Mérida ile Kurtuba arasında beş gün mesafe vardır. {Kaynak: Nafh-tib-maqqari, s. 469-470}"
  id: "Musuh memasuki wilayah Mérida dari Muhammad ibn Hud pada tahun enam ratus dua puluh enam, dan itu adalah awal dari malapetaka yang ditimbulkannya. Wilayah ini merupakan dasar dari tanah Al-Jawf pada masa Arab dan non-Arab, dan jarak antara Mérida dan Cordoba adalah lima hari {cite:nafh-tib-maqqari p. 469-470}."
