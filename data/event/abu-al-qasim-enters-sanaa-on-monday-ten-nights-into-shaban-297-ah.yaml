id: "event/abu-al-qasim-enters-sanaa-on-monday-ten-nights-into-shaban-297-ah"
class: event
kind: other
label:
  ar: "يدخل أبو القاسم صنعاء يوم الإثنين لعشر ليال خلت من شعبان سنة 297هـ، ص395"
  en: "Abu al-Qasim enters Sanaa on Monday, ten nights into Sha'ban 297 AH, p. 395"
  fr: "Abu al-Qasim entre à Sanaa le lundi, dix nuits après le début de sha'ban 297 de l’hégire, p. 395"
  ur: "ابو القاسم شعبان 297ھ کی دس راتیں گزرنے پر پیر کے دن صنعاء میں داخل ہوتے ہیں، ص395"
  es: "Abu al-Qasim entra en Sanaa el lunes, diez noches después del inicio de Sha'ban 297 AH, pág. 395."
  tr: "Ebu el-Kasım, Hicri 297 yılında Şaban ayının onuncu gecesi, Pazartesi günü Sana'a'ya girdi (s. 395)."
  id: "Abu al-Qasim memasuki Sana'a pada hari Senin, malam kesepuluh bulan Sya'ban tahun 297 H, hlm. 395"
summary:
  ar: "يبعث الهادي ابنه أبا القاسم في جماعة من خولان وهمدان، فيدخل صنعاء يوم الإثنين لعشر ليال خلت من شعبان سنة 297هـ، ويقيم بها، فتدخل إليه نواحيها، ويُقتل من دعاة القرامطة جماعة."
  en: "Al-Hadi sends his son Abu al-Qasim with men of Khawlan and Hamdan. He enters Sanaa on Monday, ten nights into Sha'ban 297 AH, stays there, and several districts come under him. The book says a number of Qarmatian preachers were killed."
  fr: "Al-Hadi envoie son fils Abu al-Qasim avec des hommes des Khawlan et des Hamdan. Il entre à Sanaa le lundi, dix nuits après le début de sha'ban 297 de l’hégire, y reste et prend le contrôle de plusieurs districts. Le livre dit que plusieurs prédicateurs qarmates furent tués."
  ur: "ہادی اپنے بیٹے ابو القاسم کو خولان اور ہمدان کے لوگوں کے ساتھ بھیجتے ہیں، جو شعبان 297ھ کی دس راتیں گزرنے پر پیر کے دن صنعاء میں داخل ہو کر وہاں قیام کرتے ہیں۔ کتاب کے مطابق قرامطہ کے کئی داعی مارے گئے۔"
  es: "Al-Hadi envía a su hijo Abu al-Qasim con hombres de Khawlan y Hamdan. Entra en Saná el lunes, diez noches después del inicio de Sha'ban del año 297 de la Hégira, permanece allí y varios distritos quedan bajo su control. El libro menciona que varios predicadores cármatas fueron asesinados."
  tr: "El-Hadi, oğlu Ebu el-Kâsım'ı Havlan ve Hamdan'dan bir grupla gönderir ve o, Hicri 297 yılında Şaban ayının bitimine on gece kala Pazartesi günü Sana'a'ya girer ve orada kalır. Daha sonra çevredeki bölgelerden insanlar ona gelir ve Karmati vaizlerinden bir grup öldürülür."
  id: "Al-Hadi mengutus putranya, Abu al-Qasim, bersama sekelompok orang dari Khawlan dan Hamdan, dan ia memasuki Sana'a pada hari Senin, sepuluh malam sebelum berakhirnya bulan Sya'ban tahun 297 Hijriah, dan tinggal di sana. Kemudian orang-orang di sekitarnya datang kepadanya, dan sekelompok pengkhotbah Qarmatian dibunuh."
