label: { ar: "خلاف رافع بن ليث بسمرقند", en: "The rebellion of Rafi' ibn Layth at Samarqand", es: "La rebelión de Rafi' ibn Layth en Samarcanda", fr: "La rébellion de Rafi' ibn Layth à Samarqand", ur: "سمرقند میں رافع بن لیث کی بغاوت", tr: "Rafi' ibn Layth'in Semerkant'taki tartışması", id: "Perselisihan Rafi' ibn Layth di Samarkand" }
summary:
  ar: "في سنة تسعين ومائة ظهر رافع بن ليث بن نصر بن سيار بسمرقند مخالفاً لهارون، فخلعه ونزع يده من طاعته {cite:tabari-tarikh-abu-al-fadl j.8 p.319}."
  en: "In 190 Rafi' ibn Layth ibn Nasr ibn Sayyar appeared at Samarqand in opposition to Harun, renounced him and withdrew his hand from obedience to him {cite:tabari-tarikh-abu-al-fadl j.8 p.319}."
  es: "En 190 Rafi' ibn Layth ibn Nasr ibn Sayyar apareció en Samarcanda en oposición a Harún, lo repudió y retiró su mano de obediencia a él {cite:tabari-tarikh-abu-al-fadl j.8 p.319}."
  fr: "En 190, Rafi' ibn Layth ibn Nasr ibn Sayyar apparut à Samarcande en opposition à Harun, le renonça et retira sa main de l'obéissance à lui {cite:tabari-tarikh-abu-al-fadl j.8 p.319}."
  ur: "190 میں رافع بن لیث بن نصر بن سیار سمرقند میں ہارون کی مخالفت میں حاضر ہوا، اس سے دستبردار ہوا اور اس کی اطاعت سے اپنا ہاتھ واپس لے لیا۔"
  tr: "190 yılında Rafi' ibn Layth ibn Nasr ibn Sayyar, Harun'a karşı Semerkant'ta ortaya çıktı; bunun üzerine Harun onu tahttan indirdi ve ona olan bağlılığından elini çekti. {Kaynak: Tabari-tarikh-abu-al-fadl, 8. cilt, 319}"
  id: "Pada tahun seratus sembilan puluh, Rafi’ ibn Layth ibn Nasr ibn Sayyar muncul di Samarkand untuk menentang Harun, sehingga ia menggulingkannya dan menarik tangannya dari ketaatannya {cite:tabari-tarikh-abu-al-fadl j.8 p.319}."
