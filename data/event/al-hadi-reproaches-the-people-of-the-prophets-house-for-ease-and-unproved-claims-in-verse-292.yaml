id: event/al-hadi-reproaches-the-people-of-the-prophets-house-for-ease-and-unproved-claims-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يعاتب فيها أهل النبوة على ركونهم إلى الخفض وعلى دعاوى بلا برهان ويذكر أنه كالوالد الحدب، ص317-318"
  en: "Verses of al-Hadi reproaching the people of prophethood for choosing ease and for claims without proof, saying he acts as a tender father, pp. 317-318"
  ur: "ہادی کے اشعار جن میں وہ اہل نبوت کو آرام پسندی اور بے دلیل دعووں پر عتاب کرتا ہے اور کہتا ہے کہ وہ شفیق باپ کی طرح ہے، ص317-318"
  es: "Versículos de al-Hadi reprochando a la gente del profeta por elegir la comodidad y hacer afirmaciones sin pruebas, diciendo que actúa como un padre tierno, págs. 317-318."
  fr: "Versets d'al-Hadi reprochant aux gens de la prophétie de choisir la facilité et de faire des affirmations sans preuve, disant qu'il agit comme un père tendre, pp. 317-318"
summary:
  ar: "يتابع الهادي القصيدة ⁦(ص317-318)⁩ فيسأل أهل النبوة ما شأنه وشأنهم وكيف خافوا عليه بلا سبب حين قام داعياً بالكتاب على حذو النبي، وكيف حالفوا الخفض واللذات وانغمدت سيوفهم عنه في ساعة التعب، وكيف ادعوا أموراً قبل البراهين على رجل لم يخن ولاه بالكذب؛ ويقول إنه كالوالد الحدب وإنه لو رأى لهم عيباً لستره، وإنهم قبلوا قول رجل يصفه بالكذب؛ وتسجل الحاشية أن هذا البيت وسبعة بعده ساقطة من نسخة ص."
  en: "Al-Hadi goes on with the poem (pp. 317-318), asking the people of prophethood what is between him and them, how they feared for him without cause when he rose calling to the Book in the footsteps of the Prophet, how they allied with ease and pleasures while their swords were sheathed from him in the hour of toil, and how they made claims before proofs against a man who never betrayed his friends with a lie; he says he acts as a tender father and would cover a fault of theirs, and that they accepted the word of a man he charges with lying; the footnote records that this line and seven after it are missing from manuscript S."
  ur: "ہادی نظم جاری رکھتا ہے ⁦(ص317-318)⁩ اور اہل نبوت سے پوچھتا ہے کہ اس کا اور ان کا کیا معاملہ ہے، کہ جب وہ نبی کے نقش قدم پر کتاب کی دعوت دینے اٹھا تو وہ بلا سبب اس سے کیوں ڈرے، کہ وہ آرام اور لذتوں کے حلیف کیوں ہوئے اور مشقت کی گھڑی میں ان کی تلواریں اس سے نیام میں رہیں، اور کہ انہوں نے ایسے آدمی پر جس نے اپنے ساتھیوں سے کبھی جھوٹ بول کر خیانت نہ کی دلیلوں سے پہلے دعوے کیوں کیے؛ وہ کہتا ہے کہ وہ شفیق باپ کی طرح ہے اور ان کی کسی خامی پر پردہ ڈالتا، اور کہ انہوں نے ایسے آدمی کی بات مان لی جسے وہ جھوٹا کہتا ہے؛ حاشیہ بتاتا ہے کہ یہ شعر اور اس کے بعد کے سات شعر نسخہ ص میں نہیں۔"
  es: "Al-Hadi prosigue con el poema (pp. 317-318), preguntando a la gente de la profecía qué hay entre él y ellos, cómo temieron por él sin motivo cuando se levantó llamando al Libro siguiendo los pasos del Profeta, cómo se aliaron con facilidad y placeres mientras sus espadas estaban envainadas para él en la hora del trabajo, y cómo hicieron acusaciones antes de pruebas contra un hombre que nunca traicionó a sus amigos con una mentira; dice que actúa como un padre tierno y cubriría una falta suya, y que aceptaron la palabra de un hombre al que acusa de mentir; la nota al pie registra que esta línea y siete posteriores faltan en el manuscrito S."
  fr: "Al-Hadi poursuit le poème (pp. 317-318), interrogeant les gens de la prophétie sur ce qui les lie, sur leur crainte injustifiée lorsqu'il s'est levé, appelant au Livre sur les traces du Prophète, sur leur alliance facile et complaisante alors que leurs épées étaient rangées à l'abri des épreuves, et sur leurs accusations, sans preuves à l'appui, contre un homme qui n'a jamais trahi ses amis par le mensonge. Il affirme agir comme un père tendre, prêt à couvrir leurs fautes, et déplore qu'ils aient cru sur parole un homme qu'il accuse de mensonge. La note de bas de page indique que ce vers et les sept suivants sont absents du manuscrit S."
