label: { ar: "عذاب يوم الظلة", en: "The torment of the Day of the Shadow" }
summary:
  ar: "عند المسعودي أن عذاب يوم الظلة كان في ملك كلمن ملك مدين، وأن شعيباً دعاهم فكذبوه فوعدهم بعذاب يوم الظلة ففتح عليهم باب من السماء من نار، وانحاز شعيب بمن آمن معه إلى الموضع المعروف بالأيكة وهي غيضة نحو مدين، فلما اشتد عليهم الحر طلبوه وأظلتهم سحابة بيضاء طيبة النسيم لا يجدون فيها ألم العذاب فأخرجوه ومن آمن معه من موضعهم فجعلها الله عليهم ناراً فأتت عليهم، فرثت حارثة بنت كلمن أباها وكانت بالحجاز {cite:muruj-al-dhahab p. 459}."
  en: "In al-Mas'udi the Day of the Shadow fell in king Kalamn's reign at Madyan — a door of fire opened from the sky while Shu'ayb sheltered at the thicket of al-Ayka, and the white pleasant cloud the people drove the believers into became their fire; Kalamn's daughter Haritha lamented him from the Hijaz {cite:muruj-al-dhahab p. 459}."
