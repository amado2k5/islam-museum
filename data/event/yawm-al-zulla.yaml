label: { ar: "عذاب يوم الظلة", en: "The torment of the Day of the Shadow", es: "El tormento del Día de la Sombra", fr: "Le tourment du Jour de l'Ombre", ur: "سایہ کے دن کا عذاب" }
summary:
  ar: "عند المسعودي أن عذاب يوم الظلة كان في ملك كلمن ملك مدين، وأن شعيباً دعاهم فكذبوه فوعدهم بعذاب يوم الظلة ففتح عليهم باب من السماء من نار، وانحاز شعيب بمن آمن معه إلى الموضع المعروف بالأيكة وهي غيضة نحو مدين، فلما اشتد عليهم الحر طلبوه وأظلتهم سحابة بيضاء طيبة النسيم لا يجدون فيها ألم العذاب فأخرجوه ومن آمن معه من موضعهم فجعلها الله عليهم ناراً فأتت عليهم، فرثت حارثة بنت كلمن أباها وكانت بالحجاز {cite:muruj-al-dhahab p. 459}."
  en: "In al-Mas'udi the Day of the Shadow fell in king Kalamn's reign at Madyan — a door of fire opened from the sky while Shu'ayb sheltered at the thicket of al-Ayka, and the white pleasant cloud the people drove the believers into became their fire; Kalamn's daughter Haritha lamented him from the Hijaz {cite:muruj-al-dhahab p. 459}."
  es: "En al-Mas'udi, el Día de la Sombra cayó durante el reinado del rey Kalamn en Madyan: una puerta de fuego se abrió desde el cielo mientras Shu'ayb se refugiaba en la espesura de al-Ayka, y la blanca y agradable nube en la que la gente condujo a los creyentes se convirtió en su fuego; la hija de Kalamn, Haritha, lo lamentó desde el Hiyaz {cite:muruj-al-dhahab p. 459}."
  fr: "À al-Mas'udi, le Jour de l'Ombre tomba sous le règne du roi Kalamn à Madyan — une porte de feu s'ouvrit du ciel tandis que Shu'ayb s'abritait dans le fourré d'al-Ayka, et le nuage blanc et agréable dans lequel les gens poussèrent les croyants devint leur feu; la fille de Kalamn, Haritha, le pleura depuis le Hedjaz {cite:muruj-al-dhahab p. 459}."
  ur: "المسعودی میں سایہ کا دن مدین میں بادشاہ کالمن کے دور حکومت میں گرا - آسمان سے آگ کا ایک دروازہ کھلا جب کہ شعیب نے العیقہ کی جھاڑی میں پناہ لی، اور سفید خوشنما بادل لوگوں نے مومنوں کو آگ میں ڈال دیا؛ کلمن کی بیٹی حارثہ نے حجاز سے ان پر افسوس کا اظہار کیا {حوالہ: مروج الذہب صفحہ 2000 459}۔"
