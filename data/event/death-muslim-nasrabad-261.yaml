id: event/death-muslim-nasrabad-261
class: event
kind: death
label:
  ar: "وفاة الإمام مسلم بن الحجاج بنصر آباد ظاهر نيسابور، ٢٥ رجب ٢٦١هـ"
  en: "Death of Imam Muslim ibn al-Hajjaj at Nasrabad outside Nishapur, 25 Rajab 261/875"
  ur: "امام مسلم بن حجاج کی وفات نصرآبادِ نیشاپور، 25 رجب 261ھ/875ء"
  es: "Muerte del Imam Muslim ibn al-Hajjaj en Nasrabad en las afueras de Nishapur, 25 de Rajab 261/875"
  fr: "Décès de l'Imam Muslim ibn al-Hajjaj à Nasrabad près de Nishapur, 25 Rajab 261/875"
  tr: "İmam Müslim ibn el-Haccac'ın Hicri 261 yılının Receb ayının 25'inde Nişapur yakınlarındaki Nasrabad'da vefatı."
  id: "Wafatnya Imam Muslim ibn al-Hajjaj di Nasrabad, dekat Nishapur, pada tanggal 25 Rajab, 261 Hijriah."
summary:
  ar: "توفي مسلم بن الحجاج عشية يوم الأحد ودُفن بنصر آباد ظاهر نيسابور يوم الاثنين لخمس بقين من شهر رجب الفرد سنة إحدى وستين ومائتين، وعمره خمس وخمسون سنة قمرياً {cite:wafayat-ayan v p. 195}؛ فتكون ولادته سنة ست ومائتين {cite:wafayat-ayan v p. 195}، وروى عنه أهل بغداد في دخولاته إليها وعدّه الترمذي من الثقات {cite:wafayat-ayan v p. 195}."
  en: "Muslim ibn al-Hajjaj died on the eve of Sunday and was buried at Nasrabad outside Nishapur on Monday, five nights before the end of Rajab, in the year 261, aged fifty-five lunar years {cite:wafayat-ayan v p. 195} — which places his birth in 206 {cite:wafayat-ayan v p. 195}; the people of Baghdad had transmitted from him on his visits and al-Tirmidhi counted him among the trustworthy {cite:wafayat-ayan v p. 195}."
  ur: "مسلم بن حجاج اتوار کی شام کو فوت ہوئے اور نیشاپور کے باہر نصرآباد میں پیر کو رجب الفرد کے آخری پانچ دن باقی رہتے ہوئے 261ھ میں سپردِ خاک ہوئے؛ ان کی عمر پچپن قمری برس تھی {cite:wafayat-ayan v p. 195} — جس سے ان کی پیدائش 206ھ بنتی ہے {cite:wafayat-ayan v p. 195}؛ بغداد کے لوگوں نے ان کے سفروں میں ان سے روایت کی اور ترمذی نے انہیں ثقہ شمار کیا {cite:wafayat-ayan v p. 195}۔"
  es: "Muslim ibn al-Hajjaj murió en la víspera del domingo y fue enterrado en Nasrabad, a las afueras de Nishapur, el lunes, cinco noches antes del final de Rajab, en el año 261, a la edad de cincuenta y cinco años lunares {cite:wafayat-ayan v p. 195}, lo que sitúa su nacimiento en 206 {cite:wafayat-ayan v p. 195}; la gente de Bagdad había transmitido de él en sus visitas y al-Tirmidhi lo contó entre los dignos de confianza {cite:wafayat-ayan v p. 195}."
  fr: "Muslim ibn al-Hajjaj mourut à la veille du dimanche et fut enterré à Nasrabad, près de Nishapur, le lundi, cinq nuits avant la fin du mois de Rajab, en l'an 261, à l'âge de cinquante-cinq ans lunaires {cite:wafayat-ayan v p. 195} — ce qui situe sa naissance en 206 {cite:wafayat-ayan v p. 195}; les habitants de Bagdad avaient reçu des enseignements de lui lors de ses visites et al-Tirmidhi le comptait parmi les personnes dignes de confiance {cite:wafayat-ayan v p. 195}."
  tr: "Müslim ibn el-Haccac, Pazar arifesinde vefat etmiş ve Pazartesi günü, Recep ayının bitiminden beş gün önce, 261 yılında, elli beş yaşında iken Nişapur dışındaki Nasrabad'a defnedilmiştir. {Kaynak: Vefayat-Ayan v, s. 195}; dolayısıyla doğumu 206 yılındadır. {Kaynak: Vefayat-Ayan v, s. 195}. Bağdat halkı, onun Bağdat'ı ziyaretleri sırasında ondan rivayetlerde bulunmuş ve Tirmizi onu güvenilir kişiler arasında saymıştır. {Kaynak: Vefayat-Ayan v, s. 195}"
  id: "Muslim ibn al-Hajjaj wafat pada malam Minggu dan dimakamkan di Nasrabad, di luar Nishapur, pada hari Senin, lima hari sebelum berakhirnya bulan Rajab, pada tahun 261, pada usia 55 tahun menurut kalender lunar {cite:wafayat-ayan v p. 195}; sehingga kelahirannya diperkirakan pada tahun 261 {cite:wafayat-ayan v p. 195}. Penduduk Baghdad meriwayatkan darinya selama kunjungannya ke sana, dan al-Tirmidhi menganggapnya sebagai salah satu orang yang terpercaya {cite:wafayat-ayan v p. 195}."
