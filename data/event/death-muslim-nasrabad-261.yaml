label:
  ar: "وفاة الإمام مسلم بن الحجاج بنصر آباد ظاهر نيسابور، ٢٥ رجب ٢٦١هـ"
  en: "Death of Imam Muslim ibn al-Hajjaj at Nasrabad outside Nishapur, 25 Rajab 261/875"
  ur: "امام مسلم بن حجاج کی وفات نصرآبادِ نیشاپور، 25 رجب 261ھ/875ء"
summary:
  ar: "توفي مسلم بن الحجاج عشية يوم الأحد ودُفن بنصر آباد ظاهر نيسابور يوم الاثنين لخمس بقين من شهر رجب الفرد سنة إحدى وستين ومائتين، وعمره خمس وخمسون سنة قمرياً {cite:wafayat-ayan v p. 195}؛ فتكون ولادته سنة ست ومائتين {cite:wafayat-ayan v p. 195}، وروى عنه أهل بغداد في دخولاته إليها وعدّه الترمذي من الثقات {cite:wafayat-ayan v p. 195}."
  en: "Muslim ibn al-Hajjaj died on the eve of Sunday and was buried at Nasrabad outside Nishapur on Monday, five nights before the end of Rajab, in the year 261, aged fifty-five lunar years {cite:wafayat-ayan v p. 195} — which places his birth in 206 {cite:wafayat-ayan v p. 195}; the people of Baghdad had transmitted from him on his visits and al-Tirmidhi counted him among the trustworthy {cite:wafayat-ayan v p. 195}."
  ur: "مسلم بن حجاج اتوار کی شام کو فوت ہوئے اور نیشاپور کے باہر نصرآباد میں پیر کو رجب الفرد کے آخری پانچ دن باقی رہتے ہوئے 261ھ میں سپردِ خاک ہوئے؛ ان کی عمر پچپن قمری برس تھی {cite:wafayat-ayan v p. 195} — جس سے ان کی پیدائش 206ھ بنتی ہے {cite:wafayat-ayan v p. 195}؛ بغداد کے لوگوں نے ان کے سفروں میں ان سے روایت کی اور ترمذی نے انہیں ثقہ شمار کیا {cite:wafayat-ayan v p. 195}۔"
