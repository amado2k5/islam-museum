label:
  ar: "محاضر الديوان في القدح في أنساب العبيديين"
  en: "The diwan manifesto impugning the Ubaydid genealogy"
summary:
  ar: "في سنة أربع وأربعين وأربعمائة كُتبت في الديوان محاضر تذكر صاحب مصر ومن تقدم من أسالفه بما يقدح في أنسابهم التي يدّعونها، وجحدوا اتصالهم برسول الله وبعلي وفاطمة، وعزوهم إلى الديصانية من المجوس والقداحية من اليهود، وأنهم خارجون عن الإسلام — على ما جرى مثله في أيام القادر — وأُخذت خطوط الأشراف والقضاة والشهود والعلماء بذلك {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
  en: "In 444 manifestos were drawn up at the diwan recounting Egypt's ruler and his forebears in terms impugning the genealogy they claim — denying their descent from the Prophet through Ali and Fatima, attributing them instead to the Daysaniyya of the Magians and the Qaddahiyya of the Jews, and declaring them outside Islam, as had been done in al-Qadir's days — and the signatures of the ashraf, qadis, witnesses and scholars were taken upon it {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
