id: event/anti-fatimid-mahadir-444
class: event
kind: declaration
label:
  ar: "محاضر الديوان في القدح في أنساب العبيديين"
  en: "The diwan manifesto impugning the Ubaydid genealogy"
  es: "El manifiesto del diwan que impugna la genealogía de Ubaydid"
  fr: "Le manifeste du diwan contestant la généalogie des Ubaydides"
summary:
  ar: "في سنة أربع وأربعين وأربعمائة كُتبت في الديوان محاضر تذكر صاحب مصر ومن تقدم من أسالفه بما يقدح في أنسابهم التي يدّعونها، وجحدوا اتصالهم برسول الله وبعلي وفاطمة، وعزوهم إلى الديصانية من المجوس والقداحية من اليهود، وأنهم خارجون عن الإسلام — على ما جرى مثله في أيام القادر — وأُخذت خطوط الأشراف والقضاة والشهود والعلماء بذلك {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
  en: "In 444 manifestos were drawn up at the diwan recounting Egypt's ruler and his forebears in terms impugning the genealogy they claim — denying their descent from the Prophet through Ali and Fatima, attributing them instead to the Daysaniyya of the Magians and the Qaddahiyya of the Jews, and declaring them outside Islam, as had been done in al-Qadir's days — and the signatures of the ashraf, qadis, witnesses and scholars were taken upon it {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
  es: "En 444 se redactaron manifiestos en el diwan que relataban al gobernante de Egipto y a sus antepasados en términos que impugnaban la genealogía que afirmaban, negando su descendencia del Profeta a través de Ali y Fátima, atribuyéndolos en cambio a la Daysaniyya de los magos y a la Qaddahiyya de los judíos, y declarándolos fuera del Islam, como se había hecho en los días de al-Qadir; y se recogieron las firmas de los ashraf, cadíes, testigos y eruditos {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
  fr: "En 444, des manifestes furent rédigés au diwan relatant l'histoire du souverain d'Égypte et de ses ancêtres en des termes contestant la généalogie qu'ils prétendaient — niant leur descendance du Prophète par Ali et Fatima, les attribuant plutôt à la Daysaniyya des Mages et à la Qaddahiyya des Juifs, et les déclarant hors de l'Islam, comme cela avait été fait à l'époque d'al-Qadir — et les signatures des ashraf, des qadis, des témoins et des érudits y furent apposées {cite:muntazam-ibn-al-jawzi j.8 p.496-497}."
