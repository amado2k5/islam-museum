label: { ar: "وقعة باسي جمن (ياسي جمن)", en: "The Battle of Yassi Jaman (Basi Jaman)" }
summary:
  ar: "يوم السبت الثامن والعشرين من رمضان سنة سبع وعشرين وستمائة انهزم جلال الدين بن خوارزم شاه بمكان يعرف بباسي حمار من أعمال أرزنجان من علاء الدين كيقباذ بن كيخسرو صاحب بلاد الروم والملك الأشرف صاحب دمشق وديار الجزيرة وخلاط؛ وسببه أن صاحب أرزن الروم أطاع جلال الدين وأعانه على حصر خلاط فخافه علاء الدين فتابع الرسل إلى الملك الكامل وإلى أخيه الأشرف حتى قيل إنه وصلهما منه في يوم واحد خمسة رسل يحث الأشرف على الاجتماع به ولو وحده، فجمع الأشرف عساكر الجزيرة والشام فاجتمعا بسيواس وسارا نحو خلاط فسار إليهما جلال الدين مجداً فالتقوا، وكان مع علاء الدين نحو عشرين ألف فارس ومع الأشرف نحو خمسة آلاف من العساكر الجيدة الشجعان المقدم عليهم عز الدين عمر بن علي من الأكراد الهكارية، فلما التقوا بهت جلال الدين لكثرة العساكر لا سيما عسكر الشام إذ شاهد من تجملهم وسلاحهم ودوابهم ما ملأ صدره رعباً، فأنشب عز الدين بن علي القتال بعسكر حلب فلم يصمد له جلال الدين ومضى منهزماً هو وعسكره فتمزقوا كل ممزق وعاد إلى خلاط ثم إلى خوى بأذربيجان، وأُخذ صاحب أرزن الروم أسيراً فقالوا خرجت النعامة تطلب قرنين فعادت بلا أذنين {cite:kamil-ibn-al-athir p. 486-487}."
  en: "On Saturday, the twenty-eighth of Ramadan in the year 627, Jalal al-Din ibn Khwarazm Shah was routed at a place known as Basi Hamar, in the lands of Arzinjan, by Ala al-Din Kayqubad ibn Kaykhusraw, lord of the lands of Rum, and al-Malik al-Ashraf, lord of Damascus, the Jazira and Khilat. The cause was that the lord of Arzan al-Rum obeyed Jalal al-Din and helped him besiege Khilat. Ala al-Din feared him and kept sending messengers to al-Malik al-Kamil and to his brother al-Ashraf, to the point that it was said five messengers reached them from him in a single day, urging al-Ashraf to meet him even if alone. Al-Ashraf gathered the armies of the Jazira and Syria, and the two met at Sivas and marched toward Khilat; Jalal al-Din advanced against them eagerly and they met. Ala al-Din had about twenty thousand horsemen, and al-Ashraf about five thousand fine, brave troops under the command of Izz al-Din Umar ibn Ali of the Hakkari Kurds. When they met, Jalal al-Din was taken aback by their numbers, especially the army of Syria, for he saw such finery in their equipment, arms and mounts that terror filled his breast. Izz al-Din ibn Ali opened the fighting against the army of Aleppo, and Jalal al-Din could not hold his ground; he fled with his army, and they scattered in every direction. He returned to Khilat, then to Khoy in Azerbaijan. The lord of Arzan al-Rum was taken prisoner, and they said: the ostrich went out seeking two horns and came back without ears. {cite:kamil-ibn-al-athir p. 486-487}"
