label: { ar: "وقعة باسي جمن (ياسي جمن)" }
summary:
  ar: "يوم السبت الثامن والعشرين من رمضان سنة سبع وعشرين وستمائة انهزم جلال الدين بن خوارزم شاه بمكان يعرف بباسي حمار من أعمال أرزنجان من علاء الدين كيقباذ بن كيخسرو صاحب بلاد الروم والملك الأشرف صاحب دمشق وديار الجزيرة وخلاط؛ وسببه أن صاحب أرزن الروم أطاع جلال الدين وأعانه على حصر خلاط فخافه علاء الدين فتابع الرسل إلى الملك الكامل وإلى أخيه الأشرف حتى قيل إنه وصلهما منه في يوم واحد خمسة رسل يحث الأشرف على الاجتماع به ولو وحده، فجمع الأشرف عساكر الجزيرة والشام فاجتمعا بسيواس وسارا نحو خلاط فسار إليهما جلال الدين مجداً فالتقوا، وكان مع علاء الدين نحو عشرين ألف فارس ومع الأشرف نحو خمسة آلاف من العساكر الجيدة الشجعان المقدم عليهم عز الدين عمر بن علي من الأكراد الهكارية، فلما التقوا بهت جلال الدين لكثرة العساكر لا سيما عسكر الشام إذ شاهد من تجملهم وسلاحهم ودوابهم ما ملأ صدره رعباً، فأنشب عز الدين بن علي القتال بعسكر حلب فلم يصمد له جلال الدين ومضى منهزماً هو وعسكره فتمزقوا كل ممزق وعاد إلى خلاط ثم إلى خوى بأذربيجان، وأُخذ صاحب أرزن الروم أسيراً فقالوا خرجت النعامة تطلب قرنين فعادت بلا أذنين {cite:kamil-ibn-al-athir p. 486-487}."
