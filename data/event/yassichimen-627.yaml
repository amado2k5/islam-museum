label: { ar: "وقعة باسي جمن ⁦(ياسي جمن)⁩", en: "The Battle of Yassi Jaman (Basi Jaman)", es: "La batalla de Yassi Jaman (Basi Jaman)", fr: "La bataille de Yassi Jaman (Basi Jaman)", ur: "یاسی جمن کی جنگ ⁦(بسی جمن)⁩" }
summary:
  ar: "يوم السبت الثامن والعشرين من رمضان سنة سبع وعشرين وستمائة انهزم جلال الدين بن خوارزم شاه بمكان يعرف بباسي حمار من أعمال أرزنجان من علاء الدين كيقباذ بن كيخسرو صاحب بلاد الروم والملك الأشرف صاحب دمشق وديار الجزيرة وخلاط؛ وسببه أن صاحب أرزن الروم أطاع جلال الدين وأعانه على حصر خلاط فخافه علاء الدين فتابع الرسل إلى الملك الكامل وإلى أخيه الأشرف حتى قيل إنه وصلهما منه في يوم واحد خمسة رسل يحث الأشرف على الاجتماع به ولو وحده، فجمع الأشرف عساكر الجزيرة والشام فاجتمعا بسيواس وسارا نحو خلاط فسار إليهما جلال الدين مجداً فالتقوا، وكان مع علاء الدين نحو عشرين ألف فارس ومع الأشرف نحو خمسة آلاف من العساكر الجيدة الشجعان المقدم عليهم عز الدين عمر بن علي من الأكراد الهكارية، فلما التقوا بهت جلال الدين لكثرة العساكر لا سيما عسكر الشام إذ شاهد من تجملهم وسلاحهم ودوابهم ما ملأ صدره رعباً، فأنشب عز الدين بن علي القتال بعسكر حلب فلم يصمد له جلال الدين ومضى منهزماً هو وعسكره فتمزقوا كل ممزق وعاد إلى خلاط ثم إلى خوى بأذربيجان، وأُخذ صاحب أرزن الروم أسيراً فقالوا خرجت النعامة تطلب قرنين فعادت بلا أذنين {cite:kamil-ibn-al-athir p. 486-487}."
  en: "On Saturday, the twenty-eighth of Ramadan in the year 627, Jalal al-Din ibn Khwarazm Shah was routed at a place known as Basi Hamar, in the lands of Arzinjan, by Ala al-Din Kayqubad ibn Kaykhusraw, lord of the lands of Rum, and al-Malik al-Ashraf, lord of Damascus, the Jazira and Khilat. The cause was that the lord of Arzan al-Rum obeyed Jalal al-Din and helped him besiege Khilat. Ala al-Din feared him and kept sending messengers to al-Malik al-Kamil and to his brother al-Ashraf, to the point that it was said five messengers reached them from him in a single day, urging al-Ashraf to meet him even if alone. Al-Ashraf gathered the armies of the Jazira and Syria, and the two met at Sivas and marched toward Khilat; Jalal al-Din advanced against them eagerly and they met. Ala al-Din had about twenty thousand horsemen, and al-Ashraf about five thousand fine, brave troops under the command of Izz al-Din Umar ibn Ali of the Hakkari Kurds. When they met, Jalal al-Din was taken aback by their numbers, especially the army of Syria, for he saw such finery in their equipment, arms and mounts that terror filled his breast. Izz al-Din ibn Ali opened the fighting against the army of Aleppo, and Jalal al-Din could not hold his ground; he fled with his army, and they scattered in every direction. He returned to Khilat, then to Khoy in Azerbaijan. The lord of Arzan al-Rum was taken prisoner, and they said: the ostrich went out seeking two horns and came back without ears. {cite:kamil-ibn-al-athir p. 486-487}"
  es: "El sábado veintiocho de Ramadán del año 627, Jalal al-Din ibn Khwarazm Shah fue derrotado en un lugar conocido como Basi Hamar, en las tierras de Arzinjan, por Ala al-Din Kayqubad ibn Kaykhusraw, señor de las tierras de Rum, y al-Malik al-Ashraf, señor de Damasco, Jazira y Khilat. La causa fue que el señor de Arzan al-Rum obedeció a Jalal al-Din y lo ayudó a sitiar Khilat. Ala al-Din le temía y seguía enviando mensajeros a al-Malik al-Kamil y a su hermano al-Ashraf, hasta el punto de que se dice que cinco mensajeros llegaron a ellos en un solo día, instando a al-Ashraf a reunirse con él aunque fuera solo. Al-Ashraf reunió a los ejércitos de Jazira y Siria, y los dos se encontraron en Sivas y marcharon hacia Khilat; Jalal al-Din avanzó con ímpetu contra ellos y se encontraron. Ala al-Din contaba con unos veinte mil jinetes, y al-Ashraf con unos cinco mil valientes soldados al mando de Izz al-Din Umar ibn Ali, de los kurdos Hakkari. Al encontrarse, Jalal al-Din quedó impresionado por su número, especialmente el del ejército de Siria, pues vio tal magnificencia en su equipamiento, armas y monturas que el terror lo invadió. Izz al-Din ibn Ali inició la lucha contra el ejército de Alepo, y Jalal al-Din no pudo resistir; huyó con su ejército, que se dispersó en todas direcciones. Regresó a Khilat y luego a Khoy, en Azerbaiyán. El señor de Arzan al-Rum fue hecho prisionero, y se dijo: «El avestruz salió en busca de dos cuernos y regresó sin orejas». {cite:kamil-ibn-al-athir p. 486-487}"
  fr: "Le samedi 28 Ramadan de l'an 627, Jalal al-Din ibn Khwarazm Shah fut défait à Basi Hamar, en Arzinjan, par Ala al-Din Kayqubad ibn Kaykhusraw, seigneur du Rum, et al-Malik al-Ashraf, seigneur de Damas, de la Jazira et du Califat. La cause de cette défaite était l'obéissance du seigneur d'Arzan al-Rum à Jalal al-Din et son aide lors du siège du Califat. Craignant ce dernier, Ala al-Din envoya sans cesse des messagers à al-Malik al-Kamil et à son frère al-Ashraf, à tel point que, selon la légende, cinq messagers leur parvinrent de sa part en une seule journée, les exhortant à le rencontrer, même seul. Al-Ashraf rassembla les armées de la Jazira et de la Syrie, et les deux armées se rencontrèrent à Sivas et marchèrent vers Califat. Jalal al-Din s'avança avec ardeur contre elles et elles se rencontrèrent. Al-Ashraf disposait d'environ vingt mille cavaliers, et al-Ashraf d'environ cinq mille soldats d'élite et courageux sous le commandement d'Izz al-Din Umar ibn Ali, un Kurde Hakkari. Lors de leur rencontre, Jalal al-Din fut surpris par le nombre de ses troupes, en particulier par l'armée syrienne, car la beauté de leur équipement, de leurs armes et de leurs montures le saisit d'effroi. Izz al-Din ibn Ali engagea le combat contre l'armée d'Alep, et Jalal al-Din ne put tenir ses positions; il prit la fuite avec son armée, qui se dispersa dans toutes les directions. Il retourna à Califat, puis à Khoy, en Azerbaïdjan. Le seigneur d'Arzan al-Rum fut fait prisonnier, et l'on disait: « L'autruche est partie chercher deux cornes et est revenue sans oreilles. » { citer: kamil-ibn-al-athir p. 486-487}"
  ur: "627 رمضان المبارک کی اٹھائیسویں بروز ہفتہ جلال الدین ابن خوارزم شاہ کو ارزنجان کی سرزمین میں بسی حمار کے نام سے مشہور مقام پر علاءالدین کیقباد ابن کیخسرو کے ہاتھوں مارا گیا۔ جزیرہ اور خلعت۔ وجہ یہ تھی کہ ارزن الروم کے رب نے جلال الدین کی اطاعت کی اور خلت کا محاصرہ کرنے میں اس کی مدد کی۔ علاء الدین اس سے ڈرتا تھا اور مالک الکامل اور اس کے بھائی اشرف کی طرف قاصد بھیجتا رہا، یہاں تک کہ کہا جاتا ہے کہ ان کے پاس سے ایک ہی دن میں پانچ قاصد پہنچے اور اشرف کو اکیلے ہونے کے باوجود اس سے ملنے کی تاکید کی۔ الاشرف نے جزیرہ اور شام کی فوجیں جمع کیں اور دونوں نے سیواس میں ملاقات کی اور خلعت کی طرف کوچ کیا۔ جلال الدین نے بے تابی سے ان کے خلاف پیش قدمی کی اور وہ مل گئے۔ علاء الدین کے پاس تقریباً بیس ہزار گھڑ سوار تھے اور اشرف کے پاس پانچ ہزار کے قریب عمدہ، بہادر دستے ہکاری کردوں کے عزالدین عمر بن علی کی کمان میں تھے۔ جب وہ ملے تو جلال الدین ان کی تعداد سے حیران رہ گئے، خاص طور پر شام کی فوج، کیونکہ اس نے ان کے ساز و سامان، ہتھیاروں اور پہاڑوں میں ایسی باریکیاں دیکھی کہ اس کے سینے میں دہشت چھا گئی۔ عزالدین ابن علی نے حلب کی فوج کے خلاف لڑائی شروع کر دی، اور جلال الدین اپنی جگہ پر قائم نہ رہ سکے۔ وہ اپنی فوج کے ساتھ بھاگ گیا، اور وہ ہر طرف بکھر گئے۔ وہ خلت واپس آیا، پھر آذربائیجان میں خوئے چلا گیا۔ ارزن الروم کے آقا کو قیدی بنا لیا گیا اور کہا: شتر مرغ دو سینگ ڈھونڈتا ہوا نکلا اور بغیر کانوں کے واپس آ گیا۔ {حوالہ: کامل ابن الاثیر ص۔ 486-487}"
