label: { ar: "وقعة الدينور بين سنجر وأبناء أخيه سنة 526" }
summary:
  ar: "في سنة ست وعشرين وخمسمائة كانت الوقعة بناحية الدينور بين السلطان سنجر وبين ابني أخيه سلجوق شاه ومسعود؛ قال ابن الجوزي كان مع سنجر مائة وسبعون ألفاً ومع مسعود ثلاثون ألفاً وبلغت القتلى أربعين ألفاً وقُتلوا قتلة جاهلية على الملك لا على الدين، وفرّ مسعود حتى دخل بين يدي سنجر فعفا عنه وأعاده إلى كنفه، وقرر سلطنة بغداد لطغرل بك ورجع إلى خراسان {cite:shadharat-dhahab p. 558-559}."
  en: "In 526 the battle near Dinawar pitted Sultan Sanjar against his nephews Saljuq-shah and Mas'ud; Ibn al-Jawzi puts Sanjar's host at 170,000 against Mas'ud's 30,000, with 40,000 slain 'a jahiliyya killing over kingship, not religion'; Mas'ud fled into Sanjar's presence and was pardoned and restored, while the Baghdad sultanate was settled on Tughril Beg and Sanjar returned to Khurasan {cite:shadharat-dhahab p. 558-559}."
