label: { ar: "وقعة الدينور بين سنجر وأبناء أخيه سنة 526", en: "The battle of Dinawar between Sanjar and his nephews in 526", fr: "La bataille de Dinawar entre Sanjar et ses neveux en 526", es: "La batalla de Dinawar entre Sanjar y sus sobrinos en 526", ur: "سنجر اور اس کے بھتیجوں کے درمیان 526 میں دیناور کی لڑائی", tr: "526 yılında Sanjar ile yeğenleri arasında gerçekleşen Dinaver Muharebesi", id: "Pertempuran Dinawar antara Sanjar dan keponakannya pada tahun 526" }
summary:
  ar: "في سنة ست وعشرين وخمسمائة كانت الوقعة بناحية الدينور بين السلطان سنجر وبين ابني أخيه سلجوق شاه ومسعود؛ قال ابن الجوزي كان مع سنجر مائة وسبعون ألفاً ومع مسعود ثلاثون ألفاً وبلغت القتلى أربعين ألفاً وقُتلوا قتلة جاهلية على الملك لا على الدين، وفرّ مسعود حتى دخل بين يدي سنجر فعفا عنه وأعاده إلى كنفه، وقرر سلطنة بغداد لطغرل بك ورجع إلى خراسان {cite:shadharat-dhahab p. 558-559}."
  en: "In 526 the battle near Dinawar pitted Sultan Sanjar against his nephews Saljuq-shah and Mas'ud; Ibn al-Jawzi puts Sanjar's host at 170,000 against Mas'ud's 30,000, with 40,000 slain 'a jahiliyya killing over kingship, not religion'; Mas'ud fled into Sanjar's presence and was pardoned and restored, while the Baghdad sultanate was settled on Tughril Beg and Sanjar returned to Khurasan {cite:shadharat-dhahab p. 558-559}."
  fr: "En 526, la bataille près de Dinawar opposa le sultan Sanjar à ses neveux Saljuq-shah et Mas'ud ; Ibn al-Jawzi évalue l'armée de Sanjar à 170 000 hommes contre 30 000 pour Mas'ud, avec 40 000 tués, « une tuerie de la jahiliyya pour la royauté, non pour la religion » ; Mas'ud s'enfuit et se présenta devant Sanjar, qui lui pardonna et le rétablit, tandis que le sultanat de Bagdad était fixé sur Tughril Beg et que Sanjar retournait au Khorassan {cite:shadharat-dhahab p. 558-559}."
  es: "En 526, la batalla cerca de Dinawar enfrentó al sultán Sanjar contra sus sobrinos Saljuq-shah y Mas'ud; Ibn al-Jawzi calcula que el ejército de Sanjar contaba con 170.000 hombres frente a los 30.000 de Mas'ud, con 40.000 muertos en \"una matanza de la época jahiliyya por la realeza, no por la religión\"; Mas'ud huyó a la presencia de Sanjar y fue perdonado y restituido, mientras que el sultanato de Bagdad se estableció en Tughril Beg y Sanjar regresó a Jorasán {cite:shadharat-dhahab p. 558-559}."
  ur: "526 میں دیناور کے قریب جنگ میں سلطان سنجر کو اس کے بھتیجوں سلجوق شاہ اور مسعود کے خلاف کھڑا کیا گیا۔ ابن الجوزی نے مسعود کے 30,000 کے مقابلے میں سنجار کے میزبان کی تعداد 170,000 بتائی ہے، جس میں 40,000 مقتولین 'بادشاہی پر جاہلیت کا قتل، مذہب نہیں'؛ مسعود سنجر کی موجودگی میں فرار ہو گیا اور اسے معاف کر دیا گیا اور بحال کر دیا گیا، جبکہ بغداد کی سلطنت طغرل بیگ پر آباد ہو گئی اور سنجار خراسان واپس آیا۔ 558-559}۔"
  tr: "Hicri 526 yılında, Dinaver bölgesinde Sultan Sancar ile iki yeğeni Selçuk Şah ve Mesud arasında bir savaş yaşandı. İbn el-Cevzi, Sancar'ın 170.000, Mesud'un ise 30.000 askeri olduğunu ve ölü sayısının 40.000'e ulaştığını belirtmiştir. Bu kişiler, din uğruna değil, krallık uğruna İslam öncesi usullere göre öldürülmüşlerdir. Mesud kaçtıktan sonra Sancar'ın huzuruna çıkmış, Sancar onu affedip koruması altına almıştır. Mesud, Tuğrul Bey için Bağdat Sultanlığı'nı kurmuş ve Horasan'a geri dönmüştür. {kaynak: Şadharat-Dhaba, s. 558-559}"
  id: "Pada tahun 526 H, pertempuran terjadi di wilayah Dinawar antara Sultan Sanjar dan dua keponakannya, Seljuk Shah dan Masoud. Ibn al-Jawzi mengatakan bahwa Sanjar memiliki 170.000 orang dan Masoud memiliki 30.000 orang, dan jumlah korban tewas mencapai 40.000. Mereka terbunuh dengan cara pra-Islam demi kerajaan, bukan demi agama. Masoud melarikan diri hingga ia menghadap Sanjar, yang mengampuninya dan membawanya kembali ke perlindungannya. Ia mendirikan Kesultanan Baghdad untuk Tughril Beg dan kembali ke Khorasan. {cite:shadharat-dhahab hlm. 558-559}"
