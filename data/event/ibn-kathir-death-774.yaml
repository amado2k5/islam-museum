id: event/ibn-kathir-death-774
class: event
kind: death
label:
  ar: "وفاة ابن كثير بدمشق، شعبان ٧٧٤هـ"
  en: "Ibn Kathir dies at Damascus, Sha'ban 774/February 1373"
  ur: "ابن کثیر کی وفات دمشق میں، شعبان 774ھ/فروری 1373ء"
  es: "Ibn Kathir muere en Damasco, Sha'ban 774/febrero de 1373"
  fr: "Ibn Kathir meurt à Damas, Sha'ban 774/février 1373"
  tr: "İbn Kesir Şa'ban'da 774 H.'de Şam'da öldü."
  id: "Ibnu Katsir wafat di Damaskus, Sya'ban 774 H"
summary:
  ar: "توفي الشيخ عماد الدين أبو الفداء إسماعيل بن الشهاب الدين عمر بن كثير القرشي الشافعي، الإمام المفسر المحدث الواعظ الفقيه، يوم الخميس سادس عشر شعبان سنة ٧٧٤هـ بدمشق عن أربع وسبعين سنة {cite:suluk-maqrizi j.3 q.1 p. 208}؛ وقال ابن حجر في الدرر: مات في شعبان سنة ٧٧٤هـ وكان قد أضرّ في أواخر عمره {cite:durar-kamina-jil-1993 1/374}."
  en: "The shaykh 'Imad al-Din Abu l-Fida' Isma'il, son of Shihab al-Din 'Umar ibn Kathir, al-Qurashi al-Shafi'i — the imam, mufassir, muhaddith, preacher and jurist — died on Thursday 16 Sha'ban 774 at Damascus, aged seventy-four {cite:suluk-maqrizi j.3 q.1 p. 208}; Ibn Hajar likewise dates his death to Sha'ban 774, noting that he had gone blind in his last years {cite:durar-kamina-jil-1993 1/374}."
  ur: "شیخ عماد الدین ابوالفدا اسماعیل بن شہاب الدین عمر بن کثیر قرشی شافعی — امام، مفسر، محدث، واعظ اور فقیہ — جمعرات 16 شعبان 774ھ کو دمشق میں چوہتر برس کی عمر میں فوت ہوئے {cite:suluk-maqrizi j.3 q.1 p. 208}؛ ابن حجر بھی وفات شعبان 774ھ لکھتے ہیں اور بتاتے ہیں کہ وہ آخر عمر میں نابینا ہو گئے تھے {cite:durar-kamina-jil-1993 1/374}۔"
  es: "El jeque 'Imad al-Din Abu l-Fida' Isma'il, hijo de Shihab al-Din 'Umar ibn Kathir, al-Qurashi al-Shafi'i —el imán, mufassir, muhaddith, predicador y jurista— murió el jueves 16 de Sha'ban 774 en Damasco, a la edad de setenta y cuatro {cite:suluk-maqrizi j.3 q.1 p. 208}; Ibn Hajar también fecha su muerte en Sha'ban 774, señalando que se había quedado ciego en sus últimos años {cite:durar-kamina-jil-1993 1/374}."
  fr: "Le cheikh 'Imad al-Din Abu l-Fida' Isma'il, fils de Shihab al-Din 'Umar ibn Kathir, al-Qurashi al-Shafi'i — l'imam, mufassir, muhaddith, prédicateur et juriste — est décédé le jeudi 16 Sha'ban 774 à Damas, à l'âge de soixante-quatorze ans {cite:suluk-maqrizi j.3 q.1 p. 208}; Ibn Hajar date également sa mort à Sha'ban 774, notant qu'il était devenu aveugle dans ses dernières années {cite:durar-kamina-jil-1993 1/374}."
  tr: "İmam, tefsirci, hadis alimi, vaiz ve fıkıhçı Şeyh İmaddin Ebu el-Fida İsmail ibn Şihab el-Din Ömer ibn Kathir el-Kureşi el-Şafii, Hicri 774 yılının Şaban ayının on altıncı Perşembe günü Şam'da yetmiş dört yaşında vefat etmiştir. {Kaynak: Suluk-makrizi, 3. cilt, 1. soru, s. 208}; İbn Hacer ise el-Durar'da şöyle demiştir: Hicri 774 yılının Şaban ayında vefat etmiş ve son yıllarında hastalanmıştır. {Kaynak: Durar-kamina-cil, 1993, 1/374}"
  id: "Syekh Imad al-Din Abu al-Fida Ismail ibn Shihab al-Din Omar ibn Kathir al-Qurashi al-Shafi’i, Imam, penafsir, ulama hadits, pendakwah, ahli hukum, wafat pada hari Kamis, tanggal 16 Sya'ban 774 H, di Damaskus pada usia tujuh puluh empat tahun. {cite:suluk-maqrizi j.3 q.1 p. 208}; dan Ibn Hajar berkata dalam al-Durar: Beliau wafat pada bulan Sya'ban 774 H, dan beliau jatuh sakit di tahun-tahun terakhirnya. {cite:durar-kamina-jil-1993 1/374}."
