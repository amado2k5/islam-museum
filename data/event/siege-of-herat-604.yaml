label: { ar: "حصار هراة وقتل ابن خرميل" }
summary:
  ar: "في سنة أربع وستمائة قبض حسين بن خرميل صاحب هراة على عسكر خوارزم شاه لسوء معاملتهم الرعية فاعتذر إليه، فكتب إليه خوارزم شاه يتحسن فعله وأسر إلى عز الدين جلدك بن طغرل صاحب الخام أن يكون عنده وأن يحتال في القبض عليه، فسار جلدك في ألفي فارس فتجاسر ابن خرميل على الخروج إليه رغم تحذير وزيره خواجه الصاحب، فلما بصر كل منهما بصاحبه ترجلا للالتقاء فاختلط أصحاب جلدك بهما وقبضوا عليه، فأمر الوزير بإغلاق الباب والطلوع إلى الأسوار ونادى بشعار غياث الدين محمود الغوري وقال لجلدك لا أسلم البلد إليك ولا إلى الغادر ابن خرميل وإنما هو لغياث الدين ولأبيه قبله، فقدموا ابن خرميل إلى السور فأمره بالتسليم فلم يفعل فقتلوه؛ وكان ابن خرميل قد حصن هراة بأربعة أسوار محكمة وحفر خندقها وقال بقيت أخاف على هذه المدينة أن تُسكر المياه أياماً ثم ترسل دفعة واحدة فتخرق أسوارها، فسمع الحاصرون قوله فسكروا المياه حتى اجتمعت ثم أطلقوها على هراة فأحاطت بها ولم تصل إلى السور لارتفاع أرض المدينة فامتلأ الخندق ماء وصار حولها وحل فامتنع القرب منها، فكان ذلك من أحسن الحيل {cite:kamil-ibn-al-athir p. 334-335}."
