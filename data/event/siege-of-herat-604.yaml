label: { ar: "حصار هراة وقتل ابن خرميل", en: "Siege of Herat and the killing of Ibn Kharmil", es: "El asedio de Herat y el asesinato de Ibn Kharmil.", fr: "Siège d'Hérat et assassinat d'Ibn Kharmil", ur: "ہرات کا محاصرہ اور ابن خرمل کا قتل" }
summary:
  ar: "في سنة أربع وستمائة قبض حسين بن خرميل صاحب هراة على عسكر خوارزم شاه لسوء معاملتهم الرعية فاعتذر إليه، فكتب إليه خوارزم شاه يتحسن فعله وأسر إلى عز الدين جلدك بن طغرل صاحب الخام أن يكون عنده وأن يحتال في القبض عليه، فسار جلدك في ألفي فارس فتجاسر ابن خرميل على الخروج إليه رغم تحذير وزيره خواجه الصاحب، فلما بصر كل منهما بصاحبه ترجلا للالتقاء فاختلط أصحاب جلدك بهما وقبضوا عليه، فأمر الوزير بإغلاق الباب والطلوع إلى الأسوار ونادى بشعار غياث الدين محمود الغوري وقال لجلدك لا أسلم البلد إليك ولا إلى الغادر ابن خرميل وإنما هو لغياث الدين ولأبيه قبله، فقدموا ابن خرميل إلى السور فأمره بالتسليم فلم يفعل فقتلوه؛ وكان ابن خرميل قد حصن هراة بأربعة أسوار محكمة وحفر خندقها وقال بقيت أخاف على هذه المدينة أن تُسكر المياه أياماً ثم ترسل دفعة واحدة فتخرق أسوارها، فسمع الحاصرون قوله فسكروا المياه حتى اجتمعت ثم أطلقوها على هراة فأحاطت بها ولم تصل إلى السور لارتفاع أرض المدينة فامتلأ الخندق ماء وصار حولها وحل فامتنع القرب منها، فكان ذلك من أحسن الحيل {cite:kamil-ibn-al-athir p. 334-335}."
  en: "In 604 Husayn ibn Kharmil, lord of Herat, seized Khwarazm Shah's troops for mistreating the subjects, and apologized to the Shah. The Shah wrote commending his conduct, while secretly telling Izz al-Din Jaldak ibn Tughril, lord of Khaam, to stay with Ibn Kharmil and find a way to seize him. Jaldak rode out with two thousand horse, and Ibn Kharmil ventured out to meet him despite the warning of his vizier Khwaja al-Sahib. When the two saw each other they dismounted to meet, and Jaldak's men mingled with them and seized him. The vizier ordered the gate shut and the men onto the walls, called the slogan of Ghiyath al-Din Mahmud al-Ghuri, and told Jaldak he would surrender the city neither to him nor to the treacherous Ibn Kharmil, since it belonged to Ghiyath al-Din and his father before him. They brought Ibn Kharmil up to the wall; when he refused to order its surrender, they killed him. Ibn Kharmil had fortified Herat with four strong walls and dug its moat, and he had said he feared the water might be held back for days and then released all at once to breach the walls. The besiegers heard this, dammed the water until it gathered, and released it on Herat. The flood did not reach the wall because the town stood on high ground, but the moat filled and the ground around became a morass that kept people from approaching, which the chronicler counts among the finest of stratagems {cite:kamil-ibn-al-athir p. 334-335}."
  es: "En el año 604, Husayn ibn Kharmil, señor de Herat, capturó las tropas de Khwarazm Shah por maltratar a sus súbditos y se disculpó con el Shah. Este le escribió elogiando su conducta, mientras que secretamente le indicó a Izz al-Din Jaldak ibn Tughril, señor de Khaam, que se quedara con Ibn Kharmil y buscara la manera de capturarlo. Jaldak partió con dos mil caballos, e Ibn Kharmil se aventuró a su encuentro a pesar de la advertencia de su visir Khwaja al-Sahib. Al verse, desmontaron para encontrarse, y los hombres de Jaldak se unieron a ellos y lo capturaron. El visir ordenó cerrar la puerta y llevar a los hombres a las murallas, llamó al eslogan de Ghiyath al-Din Mahmud al-Ghuri, y le dijo a Jaldak que no entregaría la ciudad ni a él ni al traidor Ibn Kharmil, ya que pertenecía a Ghiyath al-Din y a su padre antes que a él. Llevaron a Ibn Kharmil hasta la muralla; cuando se negó a ordenar su rendición, lo mataron. Ibn Kharmil había fortificado Herat con cuatro fuertes murallas y cavado su foso, y había dicho que temía que el agua pudiera ser retenida durante días y luego liberada de golpe para derribar las murallas. Los sitiadores oyeron esto, represaron el agua hasta que se acumuló y la liberaron sobre Herat. La inundación no llegó a la muralla porque la ciudad estaba en terreno elevado, pero el foso se llenó y el terreno circundante se convirtió en un lodazal que impidió que la gente se acercara, lo que el cronista cuenta entre las mejores estratagemas {cite:kamil-ibn-al-athir p. 334-335}."
  fr: "En 604, Husayn ibn Kharmil, seigneur d'Hérat, fit arrêter les troupes de Khwarezm Shah pour mauvais traitements infligés à ses sujets et présenta ses excuses au Shah. Ce dernier, dans une lettre, loua sa conduite et chargea secrètement Izz al-Din Jaldak ibn Tughril, seigneur de Kham, de rester auprès d'Ibn Kharmil et de trouver un moyen de le capturer. Jaldak partit à la tête de deux mille cavaliers et Ibn Kharmil s'aventura à sa rencontre malgré l'avertissement de son vizir Khwaja al-Sahib. Lorsqu'ils se virent, ils mirent pied à terre pour se rencontrer, et les hommes de Jaldak se mêlèrent à eux et s'emparèrent d'Ibn Kharmil. Le vizir ordonna de fermer la porte et de placer les hommes sur les remparts, lança le cri de ralliement de Ghiyath al-Din, Mahmud al-Ghuri, et déclara à Jaldak qu'il ne livrerait la ville ni à lui ni au traître Ibn Kharmil, car elle avait appartenu à Ghiyath al-Din et à son père avant lui. Ils amenèrent Ibn Kharmil jusqu'aux remparts; lorsqu'il refusa d'ordonner la reddition, ils le tuèrent. Ibn Kharmil avait fortifié Hérat de quatre solides murailles et creusé des douves, et il avait dit craindre que l'eau ne soit retenue pendant des jours puis relâchée d'un coup pour percer les murailles. Les assiégeants, ayant entendu cela, endiguèrent l'eau jusqu'à ce qu'elle s'accumule, puis la déversèrent sur Hérat. L'inondation n'atteignit pas les remparts car la ville était située sur un terrain élevé, mais les douves se remplirent et le terrain alentour devint un marécage qui empêchait toute approche, ce que le chroniqueur considère comme l'une des plus ingénieuses ruses (cite: Kamil Ibn al-Athir, p. 1). 334-335}."
  ur: "604 میں ہرات کے بادشاہ حسین بن خرمل نے خوارزم شاہ کی فوجوں کو رعایا کے ساتھ بدسلوکی کرنے پر پکڑا اور شاہ سے معافی مانگی۔ شاہ نے اس کے طرز عمل کی تعریف کرتے ہوئے لکھا، جب کہ خم کے بادشاہ عزالدین جلادک ابن تغرل کو خفیہ طور پر ابن خرمل کے ساتھ رہنے اور اسے پکڑنے کا راستہ تلاش کرنے کو کہا۔ جلادک دو ہزار گھوڑے لے کر نکلا اور ابن خرمل اپنے وزیر خواجہ الصاحب کی تنبیہ کے باوجود اس سے ملنے کے لیے نکلا۔ جب دونوں نے ایک دوسرے کو دیکھا تو وہ ملنے کے لیے اترے اور جلدک کے آدمی ان کے ساتھ گھل مل گئے اور اسے پکڑ لیا۔ وزیر نے گیٹ بند کرنے کا حکم دیا اور آدمیوں کو دیواروں پر چڑھا دیا، جس نے غیاث الدین محمود الثوری کا نعرہ لگایا، اور جلادک سے کہا کہ وہ شہر کو نہ تو اس کے حوالے کرے گا اور نہ ہی غدار ابن خرمل کے حوالے کرے گا، کیونکہ یہ شہر غیاث الدین اور اس سے پہلے اس کے والد کا تھا۔ وہ ابن خرمل کو دیوار تک لے آئے۔ جب اس نے ہتھیار ڈالنے کا حکم دینے سے انکار کیا تو انہوں نے اسے قتل کر دیا۔ ابن خرمل نے ہرات کو چار مضبوط دیواروں کے ساتھ مضبوط کیا تھا اور اس کی کھائی کھودی تھی، اور اس نے کہا تھا کہ اسے خدشہ ہے کہ پانی کئی دنوں تک روکے رکھا جائے گا اور پھر دیواروں کو توڑنے کے لیے ایک ساتھ چھوڑ دیا جائے گا۔ محاصرہ کرنے والوں نے یہ سنا، پانی جمع ہونے تک بند کر دیا اور اسے ہرات پر چھوڑ دیا۔ سیلاب دیوار تک نہیں پہنچا کیونکہ یہ بستی اونچی زمین پر کھڑی تھی، لیکن کھائی بھر گئی اور اردگرد کی زمین ایک دلدل بن گئی جس نے لوگوں کو قریب آنے سے روک دیا، جسے تاریخ نگار نے بہترین حکمت عملیوں میں شمار کیا ہے۔ 334-335}۔"
