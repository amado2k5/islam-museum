label: { ar: "حصر العزيز دمشق والصلح على قسمة البلاد", en: "al-Aziz's siege of Damascus and the partition settlement (590 AH)", es: "El asedio de Damasco por al-Aziz y el acuerdo de partición (590 AH)", fr: "Le siège de Damas par al-Aziz et le règlement du partage (590 AH)" }
summary:
  ar: "في سنة تسعين وخمسمائة وصل الملك العزيز عثمان بن صلاح الدين صاحب مصر إلى دمشق فحصرها وبها أخوه الأكبر الملك الأفضل، وكان ابن الأثير حينئذ بدمشق؛ فأرسل الأفضل إلى عمه الملك العادل أبي بكر بن أيوب صاحب الديار الجزرية يستنجده، فسار العادل والملك الظاهر غازي بن صلاح الدين صاحب حلب وناصر الدين محمد بن تقي الدين صاحب حماة وأسد الدين شيركوه صاحب حمص وعسكر الموصل كلهم إلى دمشق واتفقوا على حفظها — علماً منهم أن العزيز إن ملكها أخذ بلادهم — فلما رأى العزيز اجتماعهم علم أنه لا قدرة له على البلد، فاستقرت القاعدة على أن يكون بيت المقدس وما جاوره من أعمال فلسطين للعزيز، وتبقى دمشق وطبرية والغور للأفضل على ما كانت عليه، وأن يعطي الأفضل أخاه الملك الظاهر جبلة واللاذقية، وأن يكون للعادل بمصر إقطاعه الأول؛ فعاد العزيز إلى مصر ورجع كل واحد من الملوك إلى بلده {cite:kamil-ibn-al-athir p. 234}."
  en: "590: al-Aziz of Egypt besieged his elder brother al-Afdal in Damascus — Ibn al-Athir was inside — until al-Adil, al-Zahir of Aleppo, Nasir al-Din of Hama, Asad al-Din Shirkuh of Homs and Mosul's army converged to hold the city, knowing their own lands were next; the settlement gave al-Aziz Jerusalem and Palestine, kept Damascus, Tiberias and the Ghawr for al-Afdal, added Jabla and Latakia to al-Zahir, and restored al-Adil's Egyptian iqta' {cite:kamil-ibn-al-athir p. 234}."
  es: "590: al-Aziz de Egipto sitió a su hermano mayor al-Afdal en Damasco —Ibn al-Athir estaba dentro— hasta que al-Adil, al-Zahir de Alepo, Nasir al-Din de Hama, Asad al-Din Shirkuh de Homs y el ejército de Mosul convergieron para tomar la ciudad, sabiendo que sus propias tierras serían las siguientes; el acuerdo otorgó a al-Aziz Jerusalén y Palestina, conservó Damasco, Tiberíades y el Ghawr para al-Afdal, añadió Jabla y Latakia a al-Zahir y restauró el iqta' egipcio de al-Adil {cite:kamil-ibn-al-athir p. 234}."
  fr: "590: al-Aziz d'Égypte assiégea son frère aîné al-Afdal à Damas — Ibn al-Athir se trouvait à l'intérieur — jusqu'à ce qu'al-Adil, al-Zahir d'Alep, Nasir al-Din de Hama, Asad al-Din Shirkuh de Homs et l'armée de Mossoul convergent pour tenir la ville, sachant que leurs propres terres seraient les prochaines; le règlement donna Jérusalem et la Palestine à al-Aziz, garda Damas, Tibériade et le Ghawr pour al-Afdal, ajouta Jabla et Lattaquié à al-Zahir et rétablit l'iqta' égyptienne d'al-Adil {cite: kamil-ibn-al-athir p. 234}."
