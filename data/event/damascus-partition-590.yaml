label: { ar: "حصر العزيز دمشق والصلح على قسمة البلاد", en: "al-Aziz's siege of Damascus and the partition settlement (590 AH)", es: "El asedio de Damasco por al-Aziz y el acuerdo de partición (590 AH)", fr: "Le siège de Damas par al-Aziz et le règlement du partage (590 AH)", ur: "العزیز کا دمشق کا محاصرہ اور تقسیم کا معاہدہ ⁦(590ھ)⁩", tr: "El-Aziz, Şam'ı kuşattı ve ülkenin bölünmesi konusunda barış anlaşması yaptı.", id: "Al-Aziz mengepung Damaskus dan mendamaikan negara yang terpecah belah itu." }
summary:
  ar: "في سنة تسعين وخمسمائة وصل الملك العزيز عثمان بن صلاح الدين صاحب مصر إلى دمشق فحصرها وبها أخوه الأكبر الملك الأفضل، وكان ابن الأثير حينئذ بدمشق؛ فأرسل الأفضل إلى عمه الملك العادل أبي بكر بن أيوب صاحب الديار الجزرية يستنجده، فسار العادل والملك الظاهر غازي بن صلاح الدين صاحب حلب وناصر الدين محمد بن تقي الدين صاحب حماة وأسد الدين شيركوه صاحب حمص وعسكر الموصل كلهم إلى دمشق واتفقوا على حفظها — علماً منهم أن العزيز إن ملكها أخذ بلادهم — فلما رأى العزيز اجتماعهم علم أنه لا قدرة له على البلد، فاستقرت القاعدة على أن يكون بيت المقدس وما جاوره من أعمال فلسطين للعزيز، وتبقى دمشق وطبرية والغور للأفضل على ما كانت عليه، وأن يعطي الأفضل أخاه الملك الظاهر جبلة واللاذقية، وأن يكون للعادل بمصر إقطاعه الأول؛ فعاد العزيز إلى مصر ورجع كل واحد من الملوك إلى بلده {cite:kamil-ibn-al-athir p. 234}."
  en: "590: al-Aziz of Egypt besieged his elder brother al-Afdal in Damascus — Ibn al-Athir was inside — until al-Adil, al-Zahir of Aleppo, Nasir al-Din of Hama, Asad al-Din Shirkuh of Homs and Mosul's army converged to hold the city, knowing their own lands were next; the settlement gave al-Aziz Jerusalem and Palestine, kept Damascus, Tiberias and the Ghawr for al-Afdal, added Jabla and Latakia to al-Zahir, and restored al-Adil's Egyptian iqta' {cite:kamil-ibn-al-athir p. 234}."
  es: "590: al-Aziz de Egipto sitió a su hermano mayor al-Afdal en Damasco —Ibn al-Athir estaba dentro— hasta que al-Adil, al-Zahir de Alepo, Nasir al-Din de Hama, Asad al-Din Shirkuh de Homs y el ejército de Mosul convergieron para tomar la ciudad, sabiendo que sus propias tierras serían las siguientes; el acuerdo otorgó a al-Aziz Jerusalén y Palestina, conservó Damasco, Tiberíades y el Ghawr para al-Afdal, añadió Jabla y Latakia a al-Zahir y restauró el iqta' egipcio de al-Adil {cite:kamil-ibn-al-athir p. 234}."
  fr: "590: al-Aziz d'Égypte assiégea son frère aîné al-Afdal à Damas — Ibn al-Athir se trouvait à l'intérieur — jusqu'à ce qu'al-Adil, al-Zahir d'Alep, Nasir al-Din de Hama, Asad al-Din Shirkuh de Homs et l'armée de Mossoul convergent pour tenir la ville, sachant que leurs propres terres seraient les prochaines; le règlement donna Jérusalem et la Palestine à al-Aziz, garda Damas, Tibériade et le Ghawr pour al-Afdal, ajouta Jabla et Lattaquié à al-Zahir et rétablit l'iqta' égyptienne d'al-Adil {cite: kamil-ibn-al-athir p. 234}."
  ur: "590: مصر کے العزیز نے دمشق میں اپنے بڑے بھائی الفضل کا محاصرہ کیا - ابن العثیر اندر تھا - یہاں تک کہ العدیل، حلب کے الظاہر، حما کے ناصر الدین، حمص کے اسد الدین شرکوہ اور موصل کی فوج نے اپنے شہر پر قبضہ کرنے کے لیے اکٹھے ہو گئے، اگلے شہر کو اپنے قبضے میں لے لیا۔ اس بستی نے العزیز کو یروشلم اور فلسطین دیا، دمشق، تبریاس اور غاور کو الافدل کے لیے رکھا، جبلہ اور لطاکیہ کو الظاہر میں شامل کیا، اور العدل کی مصری اقامت بحال کردی۔ 234}۔"
  tr: "Hicri 590 yılında, Mısır hükümdarı Kral Aziz Osman ibn Salah el-Din, Şam'a geldi ve şehri kuşattı. Ağabeyi Kral Afdal oradaydı ve İbn el-Athir de o sırada Şam'daydı. Afdal, amcası, Cezire bölgesinin hükümdarı Kral Adil Ebu Bekir ibn Eyyub'dan yardım istedi. Halep hükümdarı Kral Zahir Gazi ibn Salah el-Din, Hama hükümdarı Nasır el-Din Muhammed ibn Takî el-Din, Humus hükümdarı Esad el-Din Şirkuh ve Musul ordusu Şam'a doğru yürüdüler ve şehri savunmayı kabul ettiler; çünkü Aziz'in şehri ele geçirmesi durumunda topraklarını da alacağını biliyorlardı. Aziz onların toplandığını görünce, şehir üzerinde hiçbir gücünün olmadığını anladı. Böylece Kudüs ve Filistin'in çevresindeki toprakların Aziz'e, Şam, Taberiye ve Ürdün Vadisi'nin ise Afdal'da kalmasına, Afdal'ın kardeşi Kral Zahir'e Cebel ve Latakia'yı vermesine ve Adil'in de Mısır'daki ilk tımarını almasına karar verildi. Böylece Aziz Mısır'a döndü ve kralların her biri kendi ülkesine döndü. {Kaynak: Kamil İbn el-Atir s. 234}"
  id: "Pada tahun 590 H, Raja Al-Aziz Utsman ibn Salah al-Din, penguasa Mesir, tiba di Damaskus dan mengepungnya. Kakak laki-lakinya, Raja Al-Afdal, berada di sana, dan Ibn Al-Athir juga berada di Damaskus pada waktu itu. Al-Afdal mengirim utusan kepada pamannya, Raja Al-Adil Abu Bakr ibn Ayyub, penguasa wilayah Jazira, untuk meminta bantuan. Al-Adil, Raja Al-Zahir Ghazi ibn Salah al-Din, penguasa Aleppo, Nasir al-Din Muhammad ibn Taqi al-Din, penguasa Hama, Asad al-Din Shirkuh, penguasa Homs, dan pasukan Mosul semuanya berbaris ke Damaskus dan setuju untuk mempertahankannya—mengetahui bahwa jika Al-Aziz merebutnya, ia akan merebut tanah mereka. Ketika Al-Aziz melihat mereka berkumpul, ia tahu bahwa ia tidak memiliki kekuasaan atas kota itu. Maka disepakati bahwa Yerusalem dan wilayah-wilayah sekitarnya di Palestina akan diberikan kepada Al-Aziz, dan Damaskus, Tiberias, dan Lembah Yordania akan tetap berada di bawah kekuasaan Al-Afdal seperti semula, dan bahwa Al-Afdal akan memberikan kepada saudaranya, Raja Al-Zahir, Jableh dan Latakia, dan bahwa Al-Adil akan mendapatkan wilayah kekuasaan pertamanya di Mesir. Maka Al-Aziz kembali ke Mesir, dan masing-masing raja kembali ke negaranya. {cite:kamil-ibn-al-athir p. 234}"
