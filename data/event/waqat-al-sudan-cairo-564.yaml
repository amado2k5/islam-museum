id: event/waqat-al-sudan-cairo-564
class: event
kind: battle
label: { ar: "وقعة السودان بين القصرين", en: "The battle of the Sudan between the two palaces", es: "La batalla de Sudán entre los dos palacios", fr: "La bataille du Soudan entre les deux palais", ur: "دو محلوں کے درمیان سوڈان کی جنگ" }
summary:
  ar: "في أوائل ذي القعدة سنة أربع وستين وخمسمائة قُتل مؤتمن الخلافة، خصي قصر العاضد الفاطمي والمتحكم فيه، بعد افتضاح مكاتبته الفرنج لاستدعائهم إلى مصر؛ فعزل صلاح الدين خدم القصر واستعمل عليهم بهاء الدين قراقوش. فغضب السودان لقتله للجنسية وكان يتعصب لهم، فحشدوا حتى زادت عدتهم على خمسين ألفاً وقصدوا حرب الأجناد الصلاحية، فاقتتلوا بين القصرين وكثر القتل في الفريقين، فأرسل صلاح الدين من أحرق محلتهم المعروفة بالمنصورة على أموالهم وأولادهم، فانهزموا وركبهم السيف وأخذت عليهم أفواه السكك، فطلبوا الأمان وأخرجوا من مصر إلا من لجأ إلى الجيزة، فعبر إليهم شمس الدولة أخو صلاح الدين في طائفة من العسكر فأبادهم بالسيف إلا القليل الشريد {cite:kamil-ibn-al-athir p. 18-19}."
  en: "Dhu al-Qa'da 564 (1169): after Saladin executed Mu'tamin al-Khilafa — the Fatimid palace eunuch caught corresponding with the Franks — and set Baha al-Din Qaraqush over the palace, the Sudanese troops of Cairo, over fifty thousand strong out of solidarity, rose against the Salahiyya regiments and fought them between the two palaces; Saladin had their Mansura quarter burned over their families, they broke, took safe-conduct out of Egypt, and Turanshah destroyed the remnant at Giza — the end of the Fatimid army {cite:kamil-ibn-al-athir p. 18-19}."
  es: "Dhu al-Qa'da 564 (1169): después de que Saladino ejecutara a Mu'tamin al-Khilafa —el eunuco fatimí del palacio sorprendido carteándose con los francos— y pusiera a Baha al-Din Qaraqush al frente del palacio, las tropas sudanesas de El Cairo, más de cincuenta mil hombres por solidaridad, se alzaron contra los regimientos salahíyya y lucharon contra ellos entre los dos palacios; Saladino hizo quemar su barrio de Mansura sobre sus familias, se desbandaron, obtuvieron salvoconducto para salir de Egipto y Turanshah destruyó el remanente en Giza —el fin del ejército fatimí {cite:kamil-ibn-al-athir p. 18-19}."
  fr: "Dhu al-Qa'da 564 (1169): après que Saladin eut exécuté Mu'tamin al-Khilafa — l'eunuque du palais fatimide surpris en train de correspondre avec les Francs — et placé Baha al-Din Qaraqush à la tête du palais, les troupes soudanaises du Caire, fortes de plus de cinquante mille hommes, se soulevèrent par solidarité contre les régiments Salahiyya et les combattirent entre les deux palais; Saladin fit incendier leur quartier de Mansoura sur leurs familles, ils se débandèrent, prirent un sauf-conduit hors d'Égypte, et Turanshah détruisit le reste à Gizeh — la fin de l'armée fatimide {cite:kamil-ibn-al-athir p. 18-19}."
  ur: "ذوالقعدہ 564 (1169): جب صلاح الدین نے معتمرین الخلافہ کو پھانسی دے دی - فاطمی محل کے خواجہ سرا نے فرینکوں کے ساتھ میل جول پکڑ لیا - اور بہاء الدین قراقش کو محل پر مسلط کیا، قاہرہ کی سوڈانی فوجیں پچاس ہزار سے زیادہ سپاہیوں اور سپاہیوں کے خلاف اٹھ کھڑی ہوئیں۔ دو محلوں کے درمیان ان سے لڑا۔ صلاح الدین نے منصورہ کو ان کے خاندانوں پر جلا دیا، انہوں نے توڑ دیا، مصر سے محفوظ طریقے سے باہر لے گئے، اور تورانشاہ نے گیزہ میں باقیات کو تباہ کر دیا - فاطمی فوج کا خاتمہ۔ 18-19}۔"
