class: event
kind: other
label:
  ar: "البغدادي يقرأ أصول الدين على الأستاذ أبي إسحاق الإسفراييني، نحو ٤٠٥هـ"
  en: "Al-Baghdadi reads the principles of religion under Abu Ishaq al-Isfarayini, c. 405/1015"
  ur: "بغدادی نے ابو اسحاق اسفرائینی سے اصول دین پڑھا، تقریباً 405ھ/1015ء"
summary:
  ar: "درس عبد القاهر البغدادي بنيسابور على الأستاذ أبي إسحاق إبراهيم بن محمد الإسفراييني — الأصولي الأشعري الفقيه الشافعي صاحب المدرسة المشهورة — فقرأ عليه أصول الدين ومهر في فنون عديدة وخصوصاً في علم الحساب {cite:mawsuat-a3lam-ulama-adaba p. 634}؛ وسمع أيضاً أبا عمرو بن نجيد وأبا عمرو محمد بن جعفر بن مطر وأبا بكر الإسماعيلي وأبا أحمد بن عدي {cite:tarikh-islam-dhahabi p. 265} {cite:tabaqat-shafiiyya-subki p. 238}؛ والتاريخ تقريبي داخل حياة أستاذه المتوفى سنة ٤١٨هـ."
  en: "At Nishapur al-Baghdadi studied under the master Abu Ishaq Ibrahim ibn Muhammad al-Isfarayini — the Ash'ari jurist and theologian whose school was famous — reading the principles of religion under him and mastering many fields, above all arithmetic {cite:mawsuat-a3lam-ulama-adaba p. 634}; he also heard Abu Amr ibn Nujayd, Abu Amr Muhammad ibn Ja'far ibn Matar, Abu Bakr al-Isma'ili and Abu Ahmad ibn Adi {cite:tarikh-islam-dhahabi p. 265} {cite:tabaqat-shafiiyya-subki p. 238}; the date is approximate within his teacher's lifetime (d. 418)."
  ur: "نیشاپور میں بغدادی نے استاد ابو اسحاق ابراہیم بن محمد اسفرائینی — مشہور مدرسے کے مالک اشعری اصولی شافعی فقیہ — سے اصول دین پڑھا اور کئی فنون خصوصاً علم حساب میں مہارت حاصل کی {cite:mawsuat-a3lam-ulama-adaba p. 634}؛ اس کے علاوہ ابو عمرو بن نجید، ابو عمرو محمد بن جعفر بن مطر، ابو بکر اسماعیلی اور ابو احمد بن عدی سے سماع کیا {cite:tarikh-islam-dhahabi p. 265} {cite:tabaqat-shafiiyya-subki p. 238}؛ تاریخ استاد کی حیات ⁦(متوفی 418ھ)⁩ کے اندر تقریبی ہے۔"
