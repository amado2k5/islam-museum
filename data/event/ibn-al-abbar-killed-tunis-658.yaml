id: event/ibn-al-abbar-killed-tunis-658
class: event
kind: death
label:
  ar: "مقتل ابن الأبار بتونس، ٢٠ المحرم ٦٥٨هـ"
  en: "The killing of Ibn al-Abbar at Tunis, 20 Muharram 658/6 January 1260"
  ur: "تونس میں ابن ابار کا قتل، 20 محرم 658ھ/6 جنوری 1260ء"
summary:
  ar: "لما مات أبو زكريا أبقى خلفه المستنصر ابن الأبار قريبًا منه، فأغاظه مسلكه هو وحواشيه حتى أمر بتعذيبه وصودرت مؤلفاته فوُجد فيها هجاء للأمير زاده غيظًا، فأمر به فطُعن بالرماح حتى مات صبيحة العشرين من المحرم سنة ٦٥٨هـ (٦ يناير 1260م)، ومن الغد أُحرقت جثته مع كتبه ودواوينه ورسائله جميعًا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}؛ وقال ابن العماد: قتله صاحب تونس ظلمًا في العشرين من المحرم وله ثلاث وستون سنة {cite:shadharat-dhahab p. 303}."
  en: "When Abu Zakariyya' died, his successor al-Mustansir kept Ibn al-Abbar close to him, but his attitude so irritated the sovereign and his courtiers that he was ordered to be tortured; his writings were confiscated and a satire against the amir was found among them, enraging him further — he ordered Ibn al-Abbar killed by lance-thrusts on the morning of 20 Muharram 658 (6 January 1260), and the next day his corpse was burnt together with his books, poems and diplomas {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}. Ibn al-Imad records that the lord of Tunis had him killed unjustly on 20 Muharram at the age of sixty-three {cite:shadharat-dhahab p. 303}."
  ur: "ابو زکریا کی وفات کے بعد جانشین مستنصر نے ابن ابار کو اپنے قریب رکھا مگر اس کی روش نے سلطان اور درباریوں کو اس قدر ناراض کیا کہ اس کے تعذیض کا حکم دیا گیا؛ اس کی تصانیف ضبط کی گئیں اور ان میں امیر کے خلاف ایک ہجو پائی گئی جس نے غصہ بڑھا دیا — پھر حکم ہوا کہ اسے برچھیوں کے وار سے قتل کیا جائے، اور 20 محرم 658ھ (6 جنوری 1260ء) کی صبح وہ مارا گیا؛ اگلے دن اس کی لاش اس کی کتابوں، اشعار اور خطوط کے ساتھ جلا دی گئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}۔ ابن العماد کے بقول صاحب تونس نے اسے 20 محرم کو تریسٹھ برس کی عمر میں ظلماً قتل کرایا {cite:shadharat-dhahab p. 303}."
