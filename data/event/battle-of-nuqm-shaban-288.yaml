label:
  ar: "معركة نقم في شعبان، سنة 288هـ"
  en: "The battle of Nuqm in Sha'ban, 288 AH"
  ur: "شعبان میں معرکۂ نقم، 288ھ"
summary:
  ar: "في يوم الأحد لأربع عشرة مضت من شعبان اجتمعت عساكر القوم في أصل نقم، وقال راوٍ يثق به الراوي إنهم نحو اثني عشر ألفاً، فخرج الهادي من صنعاء في نحو خمسمائة من المهاجرين وغيرهم من أهل صنعاء، وحمل عليهم بعد أن ركد القتال ساعة فانهزموا، وقُتل من الطبريين خمسة نفر."
  en: "On Sunday, fourteen days of Sha'ban gone, the men's armies gathered at the foot of Nuqm; an informant the narrator trusts puts them at about twelve thousand, and al-Hadi went out from Sana'a with about five hundred of the emigrants and others from Sana'a, charged them after the fighting had held for an hour and they were routed; five of the Tabaris were killed."
  ur: "شعبان کی چودہ تاریخ گزرنے پر اتوار کے دن مخالف لشکر نقم کے دامن میں جمع ہو گئے؛ ایک شخص جس پر راوی اعتماد کرتا ہے ان کی تعداد قریباً بارہ ہزار بتاتا ہے، اور ہادی صنعاء سے مہاجرین اور اہلِ صنعاء میں سے قریباً پانچ سو کے ساتھ نکلے، گھنٹہ بھر لڑائی کے رکے رہنے کے بعد حملہ کیا تو مخالف ہار گئے؛ طبریوں میں سے پانچ آدمی مارے گئے۔"
