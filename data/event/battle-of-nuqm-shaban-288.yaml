id: event/battle-of-nuqm-shaban-288
class: event
kind: other
label:
  ar: "معركة نقم في شعبان، سنة 288هـ"
  en: "The battle of Nuqm in Sha'ban, 288 AH"
  ur: "شعبان میں معرکۂ نقم، 288ھ"
  fr: "La bataille de Nuqm en Sha'ban 288 H"
  es: "La batalla de Nuqm en Sha'ban, 288 AH."
  tr: "Naqam Muharebesi, Hicri 288 yılının Şaban ayında gerçekleşti."
  id: "Perang Naqam terjadi pada bulan Sya'ban, tahun 288 Hijriah."
summary:
  ar: "في يوم الأحد لأربع عشرة مضت من شعبان اجتمعت عساكر القوم في أصل نقم، وقال راوٍ يثق به الراوي إنهم نحو اثني عشر ألفاً، فخرج الهادي من صنعاء في نحو خمسمائة من المهاجرين وغيرهم من أهل صنعاء، وحمل عليهم بعد أن ركد القتال ساعة فانهزموا، وقُتل من الطبريين خمسة نفر."
  en: "On Sunday, fourteen days of Sha'ban gone, the men's armies gathered at the foot of Nuqm; an informant the narrator trusts puts them at about twelve thousand, and al-Hadi went out from Sana'a with about five hundred of the emigrants and others from Sana'a, charged them after the fighting had held for an hour and they were routed; five of the Tabaris were killed."
  ur: "شعبان کی چودہ تاریخ گزرنے پر اتوار کے دن مخالف لشکر نقم کے دامن میں جمع ہو گئے؛ ایک شخص جس پر راوی اعتماد کرتا ہے ان کی تعداد قریباً بارہ ہزار بتاتا ہے، اور ہادی صنعاء سے مہاجرین اور اہلِ صنعاء میں سے قریباً پانچ سو کے ساتھ نکلے، گھنٹہ بھر لڑائی کے رکے رہنے کے بعد حملہ کیا تو مخالف ہار گئے؛ طبریوں میں سے پانچ آدمی مارے گئے۔"
  fr: "Le dimanche, quatorze jours de Sha'ban étant passés, les armées des hommes se rassemblèrent au pied du Nuqm ; un informateur auquel le narrateur se fie les estime à environ douze mille, et al-Hadi sortit de Sanaa avec environ cinq cents des émigrés et d'autres gens de Sanaa, les chargea après que le combat eut tenu une heure, et ils furent mis en déroute ; cinq des Tabaris furent tués."
  es: "El domingo, transcurridos catorce días de Sha'ban, los ejércitos masculinos se reunieron al pie de Nuqm; un informante en quien el narrador confía calcula que eran unos doce mil, y al-Hadi salió de Sana'a con unos quinientos emigrantes y otros procedentes de Sana'a, los atacó después de que la lucha se prolongara durante una hora y fueron derrotados; cinco de los tabaris murieron."
  tr: "Şaban ayının on dördüncü Pazar günü, halk ordusu Naqam'ın eteğinde toplandı. Güvenilir bir rivayetçi, sayılarının yaklaşık on iki bin olduğunu söyledi. Hadi, Sana'a'dan Muhacirlerden ve Sana'a halkından yaklaşık beş yüz kişiyle birlikte çıktı ve çatışmalar bir saat kadar dindikten sonra onlara saldırdı. Böylece yenilgiye uğradılar ve Taberilerden beş kişi öldürüldü."
  id: "Pada hari Minggu, tanggal empat belas Sya'ban, pasukan rakyat berkumpul di kaki Naqam. Seorang perawi yang dapat dipercaya mengatakan bahwa jumlah mereka sekitar dua belas ribu. Al-Hadi keluar dari Sana'a dengan sekitar lima ratus orang Muhajirin dan orang-orang lain dari Sana'a, dan dia menyerang mereka setelah pertempuran mereda selama satu jam, sehingga mereka dikalahkan, dan lima orang dari kaum Tabari tewas."
