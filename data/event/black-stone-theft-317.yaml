id: event/black-stone-theft-317
class: event
kind: raid
label: { ar: "أخذ القرامطة الحجر الأسود", en: "The Qarmatians take the Black Stone", fr: "Les Qarmates emportent la Pierre noire", es: "Los Qarmatianos toman la Piedra Negra.", ur: "قرامطیوں نے حجر اسود کو لے لیا۔", tr: "Karmatiler Kara Taşı aldılar.", id: "Bangsa Qarmatian mengambil Batu Hitam." }
summary:
  ar: "سير المقتدر ركب الحاج مع منصور الديلمي فوصلوا مكة سالمين فوافاهم يوم التروية سنة سبع عشرة أبو طاهر القرمطي فقتل الحجيج في المسجد الحرام قتلاً ذريعاً وطرح القتلى في بئر زمزم وضرب الحجر الأسود بدبوس فكسره ثم اقتلعه وأقام بها أحد عشر يوماً ثم رحل وبقي الحجر الأسود عندهم أكثر من عشرين سنة ودفع لهم فيه خمسون ألف دينار فأبوا حتى أعيد في خلافة المطيع، وصعد القرمطي على باب الكعبة وهو يقول أنا بالله وبالله أنا يخلق الخلق وأفنيهم أنا ولم يفلح بعدها وتقطع جسده بالجدري {cite:tarikh-khulafa-minhaj-1434 p. 592-593}، وأعيد الحجر سنة تسع وثلاثين في خلافة المطيع وجعل له طوق فضة وزنه ثلاثة آلاف وسبع مئة وتسعون درهماً ونصف {cite:tarikh-khulafa-minhaj-1434 p. 616}. وعند ابن الجوزي وفي سنة 317هـ لقى أبو طاهر الجنابي الحاج في مكة يوم التروية فقتل الحجاج في المسجد الحرام والفجاج والناس في الطواف يقتلون وكان في الجماعة علي بن بلبورية وانتزع الحجر الأسود وقلع قبة بئر زمزم وعرى الكعبة وقلع باب البيت واصعد رجلاً من أصحابه ليقلع الميزاب فتردى الرجل على رأسه ومات وطرح القتلى في بئر زمزم ودفن باقيهم في مصلوبهم وفي المسجد الحرام من غير أن يصلى عليهم وانصرف إلى بلده وحمل معه الحجر الأسود فبقي عندهم أكثر من عشرين سنة إلى أن ردوه {cite:muntazam-ibn-al-jawzi p. 514-515}"
  en: "In 317, on yawm al-tarwiya, Abu Tahir al-Qarmati fell on the pilgrims inside the Haram, slaughtered them, cast the dead into Zamzam, struck the Black Stone with a club till it broke, then wrenched it out. The Qarmatians kept it over twenty years, refusing fifty thousand dinars, until it was returned under al-Muti'. Abu Tahir climbed the Ka'ba's door crying 'I create mankind and destroy them' — he prospered no more, his body torn by smallpox {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  fr: "En 317, le jour de la tarwiya, Abu Tahir al-Qarmati tomba sur les pèlerins à l'intérieur du Haram, les massacra, jeta les morts dans Zamzam, frappa la Pierre noire d'un gourdin jusqu'à la briser, puis l'arracha. Les Qarmates la gardèrent plus de vingt ans, refusant cinquante mille dinars, jusqu'à ce qu'elle soit rendue sous al-Muti'. Abu Tahir monta à la porte de la Ka'ba en criant « je crée les hommes et je les anéantis » ; il ne prospéra plus, son corps rongé par la variole {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  es: "En el año 317, en el día de Yawm al-Tarwiya, Abu Tahir al-Qarmati atacó a los peregrinos dentro del Haram, los masacró, arrojó los cadáveres al Zamzam, golpeó la Piedra Negra con un garrote hasta romperla y luego la arrancó. Los cármatas la conservaron durante más de veinte años, rechazando cincuenta mil dinares, hasta que fue devuelta bajo el dominio de al-Muti'. Abu Tahir subió a la puerta de la Kaaba gritando: «Yo creo a la humanidad y la destruyo». No prosperó más, pues su cuerpo fue desgarrado por la viruela {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  ur: "317 میں یوم الطرویہ کو ابو طاہر القرمتی حرم کے اندر زائرین پر گرے، انہیں ذبح کیا، میت کو زمزم میں ڈالا، حجر اسود کو ایک لقمے سے مارا یہاں تک کہ وہ ٹوٹ گیا، پھر اسے ٹکڑے ٹکڑے کر دیا۔ قرمطیوں نے اسے بیس سال تک اپنے پاس رکھا، پچاس ہزار دینار سے انکار کرتے ہوئے، یہاں تک کہ اسے موتی کے تحت واپس کر دیا گیا۔ ابو طاہر یہ پکارتے ہوئے کعبہ کے دروازے پر چڑھے کہ 'میں انسانوں کو پیدا کرتا ہوں اور انہیں تباہ کرتا ہوں' - وہ مزید خوشحال نہیں ہوا، اس کے جسم کو چیچک نے پھاڑ دیا۔ 592-593}۔"
  tr: "Muktedir, Mansur el-Daylami eşliğinde hacılarla birlikte yolculuk etti ve Mekke'ye sağ salim vardılar. On yedinci yılın Terviye Günü'nde Ebu Tahir el-Karmati onlarla karşılaştı ve Mescid-i Haram'da hacıları katletti, ölüleri Zemzem Kuyusu'na attı. Kara Taşı bir iğneyle vurarak kırdı, sonra da kökünden söktü. Orada on bir gün kaldı, sonra ayrıldı. Kara Taş yirmi yıldan fazla bir süre onlarla kaldı ve onlara elli bin dinar teklif edildi, ancak Muti halifeliği döneminde geri verilene kadar reddettiler. El-Karmati, Kâbe'nin kapısına çıkarak, \"Ben Allah'a yemin ederim ki, Allah'a yemin ederim ki varım. Yaratanları da ben yaratırım, yok ederim.\" dedi. Bundan sonra başarılı olamadı ve bedeni çiçek hastalığından parçalandı. Taş, otuz dokuzuncu yılda el-Muti halifeliği döneminde iade edildi ve üzerine üç bin yedi yüz doksan buçuk dirhem ağırlığında gümüş bir kolye yapıldı. İbn el-Cevzi'ye göre, Hicri 317 yılında Ebu Tahir el-Cenabi, Terviye Günü'nde Mekke'deki hacılarla karşılaştı ve Mescid-i Haram'da ve sokaklarda hacıları öldürdü; tavaf edenler de öldürülüyordu. Ali ibn Balburiye de bu grubun içindeydi. Kara Taşı ele geçirdi, Zemzem Kuyusu'nun kubbesini kaldırdı, Kâbe'yi tamamen boşalttı, Kâbe'nin kapısını söktü ve arkadaşlarından birini oluğu sökmesi için gönderdi, ancak adam başının üzerine düşüp öldü. Ölenleri Zemzem Kuyusu'na attı ve geri kalanlarını da çarmıha gerildikleri yere ve Mescid-i Haram'a namaz kılmadan gömdü. Daha sonra ülkesine döndü ve Kara Taşı da yanına aldı; taş, yirmi yıldan fazla bir süre onlarla kaldı, ta ki onu geri verene kadar. {cite:muntazam-ibn-al-jawzi s. 514-515}"
  id: "Al-Muqtadir berkendara bersama para peziarah, didampingi oleh Mansur al-Daylami, dan mereka tiba di Mekah dengan selamat. Pada Hari Tarwiyah tahun ketujuh belas, Abu Tahir al-Qarmati menemui mereka dan membantai para peziarah di Masjidil Haram, melemparkan mayat-mayat ke Sumur Zamzam. Dia memukul Batu Hitam dengan peniti, memecahkannya, lalu mencabutnya. Dia tinggal di sana selama sebelas hari, lalu pergi. Batu Hitam tetap bersama mereka selama lebih dari dua puluh tahun, dan mereka ditawari lima puluh ribu dinar untuknya, tetapi mereka menolak sampai batu itu dikembalikan pada masa kekhalifahan al-Muti. Al-Qarmati naik ke pintu Ka'bah, seraya berkata, “Aku adalah Allah, dan aku adalah Allah. Aku menciptakan ciptaan dan aku menghancurkannya.” Dia tidak berhasil setelah itu, dan tubuhnya terkoyak oleh cacar. Batu itu dikembalikan pada tahun 39 pada masa kekhalifahan al-Muti, dan dibuatkan kalung perak untuknya seberat tiga ribu tujuh ratus sembilan puluh setengah dirham. Menurut Ibn al-Jawzi, pada tahun 317 H, Abu Tahir al-Janabi bertemu dengan para peziarah di Mekah pada Hari Tarwiyah dan membunuh para peziarah di Masjidil Haram dan jalan-jalan, dan orang-orang dibunuh saat melakukan tawaf. Ali ibn Balburiyah berada di antara rombongan tersebut. Ia merebut Batu Hitam, membongkar kubah Sumur Zamzam, melucuti Ka'bah hingga telanjang, membongkar pintu Rumah, dan mengirim salah seorang temannya untuk membongkar talang, tetapi orang itu jatuh terbentur kepalanya dan meninggal. Ia melemparkan mayat-mayat itu ke Sumur Zamzam dan mengubur sisanya di tempat penyaliban mereka dan di Masjidil Haram tanpa mendoakan mereka. Kemudian ia kembali ke negaranya dan membawa Batu Hitam bersamanya, dan batu itu tetap berada di tangan mereka selama lebih dari dua puluh tahun hingga mereka mengembalikannya. {cite:muntazam-ibn-al-jawzi p. 514-515}"
