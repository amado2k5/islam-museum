id: event/black-stone-theft-317
class: event
kind: raid
label: { ar: "أخذ القرامطة الحجر الأسود" }
summary:
  ar: "سير المقتدر ركب الحاج مع منصور الديلمي فوصلوا مكة سالمين فوافاهم يوم التروية سنة سبع عشرة أبو طاهر القرمطي فقتل الحجيج في المسجد الحرام قتلاً ذريعاً وطرح القتلى في بئر زمزم وضرب الحجر الأسود بدبوس فكسره ثم اقتلعه وأقام بها أحد عشر يوماً ثم رحل وبقي الحجر الأسود عندهم أكثر من عشرين سنة ودفع لهم فيه خمسون ألف دينار فأبوا حتى أعيد في خلافة المطيع، وصعد القرمطي على باب الكعبة وهو يقول أنا بالله وبالله أنا يخلق الخلق وأفنيهم أنا ولم يفلح بعدها وتقطع جسده بالجدري {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  en: "In 317, on yawm al-tarwiya, Abu Tahir al-Qarmati fell on the pilgrims inside the Haram, slaughtered them, cast the dead into Zamzam, struck the Black Stone with a club till it broke, then wrenched it out. The Qarmatians kept it over twenty years, refusing fifty thousand dinars, until it was returned under al-Muti'. Abu Tahir climbed the Ka'ba's door crying 'I create mankind and destroy them' — he prospered no more, his body torn by smallpox {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
