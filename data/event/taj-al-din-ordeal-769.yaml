id: event/taj-al-din-ordeal-769
class: event
kind: other
label:
  ar: "محنة تاج الدين السبكي وعزله وحبسه، ٧٦٩هـ"
  en: "The ordeal, dismissal and imprisonment of Taj al-Din al-Subki, 769"
  ur: "تاج الدین سبکی کی آزمائش، معزولی اور قید، 769ھ"
summary:
  ar: "في جمادى الأولى سنة ٧٦٩هـ أمر السلطان بأخذ زكوات التجار، وامتنع قاضي القضاة تاج الدين السبكي عن إقرار وصولات مال الأيتام لم يُعيَّن فيها اسم القابض، فكان ذلك من أقوى أسباب عزله؛ فعزله الأمير علي نائب السلطنة وقرّر مكانه في القضاء والخطابة الشيخ سراج الدين البلقيني وحُكم بحبس تاج الدين، ثم أُطلق بسعي أوليائه وأُعيد إلى القضاء بعد أن خرج البلقيني بأهله إلى القاهرة، فكانت تلك ولايته الأخيرة التي مات فيها؛ وتذكر الموسوعة الإسلامية أنه سُجن ثمانين يوماً سنة ٧٦٩هـ بتهمة اختلاس مال قاصر {cite:durar-kamina-jil-1993 2/425-426} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "In Jumada I 769 the sultan ordered the merchants' alms-tax to be collected; chief qadi Taj al-Din al-Subki refused to confirm guardians' receipts that did not name the payer, and this was among the strongest causes of his dismissal. The regent Amir Ali removed him and installed Siraj al-Din al-Bulqini as qadi and preacher, and Taj al-Din was imprisoned by order of the qadi of al-Jabal; his friends then secured his release, and when al-Bulqini left for Cairo he was restored — his last spell of office. The Encyclopaedia of Islam records an eighty-day imprisonment in 769 on a charge of misappropriating a minor's property {cite:durar-kamina-jil-1993 2/425-426} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "جمادی الاولٰی 769ھ میں سلطان نے تاجروں سے زکوٰۃ وصول کرنے کا حکم دیا؛ قاضی القضاة تاج الدین سبکی نے ایسی وصولیوں کی تصدیق سے انکار کیا جن میں وصول کنندہ کا نام درج نہ تھا، اور یہ ان کی معزولی کا بڑا سبب بنا۔ نائب السلطنہ امیر علی نے انہیں معزول کر کے سراج الدین بلقینی کو قضاء اور خطابت دیا اور قاضی الجبل کے حکم سے تاج الدین قید ہوئے؛ پھر دوستوں کی سعی سے رہا ہوئے اور بلقینی کے قاہرہ روانہ ہونے پر بحال ہوئے — یہ ان کی آخری ولایت تھی۔ اسلامی دائرۃ المعارف کے مطابق انہیں 769ھ میں نابالغ کی جائیداد کے اختلاس کے الزام میں اسی دن قید رہے {cite:durar-kamina-jil-1993 2/425-426} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
