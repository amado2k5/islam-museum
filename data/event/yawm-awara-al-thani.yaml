id: event/yawm-awara-al-thani
class: event
kind: battle
label: { ar: "يوم أوارة الثاني", en: "The Second Day of Awara", es: "El segundo día de Awara", fr: "Le deuxième jour d'Awara", ur: "آوارہ کا دوسرا دن", tr: "Awara'nın ikinci günü", id: "Hari kedua Awara" }
summary:
  ar: "اليوم الثاني بأوارة؛ كان عمرو بن المنذر اللخمي قد ترك ابناً له اسمه أسعد عند زرارة بن عدس التميمي فقتله سويد بن عبد الله بن دارم وهرب إلى مكة، فلما توفي زرارة أوصى ابنه حاجباً، وغزا عمرو بن المنذر بني دارم وقد حلف ليقتلن منهم مائة، فسار يطلبهم حتى بلغ أوارة وقد أنذروا به فتفرقوا، فبث سراياه فيهم فأتوه بتسعة وتسعين رجلاً سوى من قتلوه في غاراتهم فأحرقهم، فمر رجل من البراجم شم قتار اللحم فظن أن الملك يتخذ طعاماً فقصده، فقال من أنت قال أبيت اللعن أنا وافد البراجم، فقال عمرو إن الشقي وافد البراجم وأمر به فقُذف في النار إتماماً للمائة، فذهبت مقولته مثلاً وقيل إنه لذلك سُمي محرقاً، وعير به جرير الفرزدق: أين الذين بنار عمرو أحرقوا، أم أين أسعد فيكم المسترضع {cite:kamil-ibn-al-athir p. 412-413}."
  en: "The second day of Awara: Amr ibn al-Mundhir 'al-Muharriq' avenged his foster-son As'ad, killed by Suwayd al-Darimi, by burning ninety-nine Darim captives to fulfil his vow of a hundred — and when a man of the Burajim wandered up drawn by the smell of roasting meat, he cried 'the wretch is the one who comes to Burajim' and had him cast into the fire to complete the count; Jarir taunted al-Farazdaq with it {cite:kamil-ibn-al-athir p. 412-413}."
  es: "El segundo día de Awara: Amr ibn al-Mundhir 'al-Muharriq' vengó a su hijo adoptivo As'ad, asesinado por Suwayd al-Darimi, quemando noventa y nueve cautivos darim para cumplir su promesa de cien; y cuando un hombre de los Burajim se acercó atraído por el olor a carne asada, gritó '¡el miserable es el que viene a los Burajim!' y lo hizo arrojar al fuego para completar el recuento; Jarir se burló de al-Farazdaq con esto {cite:kamil-ibn-al-athir p. 412-413}."
  fr: "Le deuxième jour d'Awara: Amr ibn al-Mundhir 'al-Muharriq' vengea son fils adoptif As'ad, tué par Suwayd al-Darimi, en brûlant quatre-vingt-dix-neuf captifs Darim pour accomplir son vœu de cent — et lorsqu'un homme des Burajim s'approcha, attiré par l'odeur de viande rôtie, il cria « le malheureux est celui qui vient chez les Burajim » et le fit jeter dans le feu pour compléter le compte; Jarir se moqua d'al-Farazdaq avec cela {cite:kamil-ibn-al-athir p. 412-413}."
  ur: "آوارہ کا دوسرا دن: عمرو بن المنذر المحرق نے اپنے رضاعی بیٹے اسعد کا بدلہ لیا جسے سوید دارمی نے قتل کیا، اپنی سو کی نذر پوری کرنے کے لیے ننانوے داریم اسیروں کو جلا کر اور جب بروجیم کا ایک آدمی بدبو سے کھینچا ہوا گھومتا تھا تو وہ مجھے بھوننے کے لیے آتا تھا۔ براجم اور اسے گنتی مکمل کرنے کے لیے آگ میں ڈال دیا۔ جریر نے اس سے الفرازدق کو طعنہ دیا {حوالہ: کامل ابن الاثیر ص۔ 412-413}۔"
  tr: "Awara'daki ikinci günde, Amr ibn al-Mundhir al-Lakhmi, As'ad adındaki oğlunu Zurarah ibn 'Adas al-Tamimi'ye bırakmıştı. Suwaid ibn 'Abd Allah ibn Darim onu öldürdü ve Mekke'ye kaçtı. Zurarah öldüğünde, oğlunu vezir olarak atadı. Amr ibn al-Mundhir, yüz kişiyi öldürmeye yemin ederek Beni Darim kabilesine baskın düzenledi. Onları Awara'ya kadar takip etti; kabile onun yaklaşmasından haberdar olmuş ve dağılmıştı. Amr, aralarına askerlerini gönderdi ve onlar da baskınlarda öldürdüklerine ek olarak doksan dokuz adam getirdiler. Amr onları yaktı. Barajim kabilesinden bir adam oradan geçerken et kokusunu aldı ve kralın yemek hazırladığını düşünerek ona yaklaştı. \"Sen kimsin?\" diye sordu. Kral, \"Suçsuz kalmanı dilerim, ben Barajim kabilesinin elçisiyim\" diye cevap verdi. Amr, \"Bu zavallı, Barajim'in elçisidir\" dedi ve yüz sayısını tamamlamak için onu ateşe atılmasını emretti. Bu sözü bir atasözü haline geldi ve bu nedenle ona \"Yakıcı\" denildiği söylenir. Cerir, bu sözle el-Farazdaq'ı alaya aldı: \"Amr'ın ateşinde yakılanlar nerede? Ya da aranızda emzirilen Asad nerede?\" 412-413}."
  id: "Pada hari kedua di Awara, Amr ibn al-Mundhir al-Lakhmi telah menitipkan seorang putranya bernama As'ad kepada Zurarah ibn 'Adas al-Tamimi. Suwaid ibn 'Abd Allah ibn Darim membunuhnya dan melarikan diri ke Mekah. Ketika Zurarah meninggal, ia mengangkat putranya sebagai kepala pelayannya. Amr ibn al-Mundhir menyerang Bani Darim, setelah bersumpah untuk membunuh seratus orang dari mereka. Ia mengejar mereka hingga mencapai Awara, di mana mereka telah diperingatkan tentang kedatangannya dan telah berpencar. Ia mengirimkan pasukannya di antara mereka, dan mereka membawakan sembilan puluh sembilan orang kepadanya, selain orang-orang yang telah mereka bunuh dalam penyerangan mereka. Ia membakar mereka. Seorang pria dari suku Barajim lewat, mencium aroma daging, dan mengira raja sedang menyiapkan makanan, jadi ia mendekatinya. Ia bertanya, \"Siapakah Anda?\" Raja menjawab, \"Semoga Anda terhindar dari celaan, saya adalah utusan dari Barajim.\" Amr berkata, \"Orang malang itu adalah utusan Barajim,\" dan memerintahkan agar dia dilemparkan ke dalam api untuk melengkapi seratus orang. Ucapannya menjadi sebuah peribahasa, dan dikatakan bahwa karena alasan inilah dia disebut Sang Pembakar. Jarir mengejek al-Farazdaq dengan itu: \"Di manakah orang-orang yang terbakar oleh api Amr? Atau di manakah As'ad di antara kalian, orang yang diasuh?\" (412-413)."
