label: { ar: "يوم أوارة الثاني" }
summary:
  ar: "اليوم الثاني بأوارة؛ كان عمرو بن المنذر اللخمي قد ترك ابناً له اسمه أسعد عند زرارة بن عدس التميمي فقتله سويد بن عبد الله بن دارم وهرب إلى مكة، فلما توفي زرارة أوصى ابنه حاجباً، وغزا عمرو بن المنذر بني دارم وقد حلف ليقتلن منهم مائة، فسار يطلبهم حتى بلغ أوارة وقد أنذروا به فتفرقوا، فبث سراياه فيهم فأتوه بتسعة وتسعين رجلاً سوى من قتلوه في غاراتهم فأحرقهم، فمر رجل من البراجم شم قتار اللحم فظن أن الملك يتخذ طعاماً فقصده، فقال من أنت قال أبيت اللعن أنا وافد البراجم، فقال عمرو إن الشقي وافد البراجم وأمر به فقُذف في النار إتماماً للمائة، فذهبت مقولته مثلاً وقيل إنه لذلك سُمي محرقاً، وعير به جرير الفرزدق: أين الذين بنار عمرو أحرقوا، أم أين أسعد فيكم المسترضع {cite:kamil-ibn-al-athir p. 412-413}."
  en: "The second day of Awara: Amr ibn al-Mundhir 'al-Muharriq' avenged his foster-son As'ad, killed by Suwayd al-Darimi, by burning ninety-nine Darim captives to fulfil his vow of a hundred — and when a man of the Burajim wandered up drawn by the smell of roasting meat, he cried 'the wretch is the one who comes to Burajim' and had him cast into the fire to complete the count; Jarir taunted al-Farazdaq with it {cite:kamil-ibn-al-athir p. 412-413}."
