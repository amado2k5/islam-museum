  ar: "توفي أسد الدين شيركوه بعد ولايته الوزارة بأيام قلائل، وقيل كان يكثر أكل العظام الدسمة فاختنقت به نفسه، فأمر العاضد بضرب الوزارة على صلاح الدين يوسف بن أيوب ابن أخيه وكان أصغر أمرائهم سنًا وكان الأمراء النورية قد كاتبوا العاضد أن يوليه لما رأوا من تواضعه وحسن سيرته ورفقه بأصحابه {cite:kamil-ibn-al-athir p. 15}."
