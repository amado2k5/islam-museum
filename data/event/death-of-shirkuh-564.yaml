summary:
  ar: "توفي أسد الدين شيركوه بعد ولايته الوزارة بأيام قلائل، وقيل كان يكثر أكل العظام الدسمة فاختنقت به نفسه، فأمر العاضد بضرب الوزارة على صلاح الدين يوسف بن أيوب ابن أخيه وكان أصغر أمرائهم سنًا وكان الأمراء النورية قد كاتبوا العاضد أن يوليه لما رأوا من تواضعه وحسن سيرته ورفقه بأصحابه {cite:kamil-ibn-al-athir p. 15}."
  en: "Shīrkūh died days into his vizierate — said to have choked on the rich marrow he loved. Al-ʿĀḍid invested his nephew Saladin Yūsuf ibn Ayyūb, the youngest of the emirs, because the Nūrid commanders had written recommending him: they saw his humility, his good conduct, his kindness to his companions {cite:kamil-ibn-al-athir p. 15}."
  es: "Shīrkūh murió a los pocos días de asumir el visirismo; se dice que se ahogó con la rica médula que tanto amaba. Al-ʿĀḍid investió a su sobrino Saladin Yūsuf ibn Ayyūb, el más joven de los emires, porque los comandantes Nūrid habían escrito recomendándolo: vieron su humildad, su buena conducta y su bondad con sus compañeros {cite:kamil-ibn-al-athir p. 15}."
  fr: "Shīrkūh mourut quelques jours après son entrée en fonction comme vizirat, étouffé, dit-on, par la moelle qu'il affectionnait tant. Al-ʿĀḍid investit son neveu Saladin Yūsuf ibn Ayyūb, le plus jeune des émirs, car les commandants nūrides l'avaient recommandé par écrit: ils avaient constaté son humilité, sa bonne conduite et sa bienveillance envers ses compagnons (voir: Kamil ibn al-Athir, p. 15)."
  ur: "شرقوہ اپنی وزیریٹی کے دنوں میں مر گیا - کہا جاتا ہے کہ وہ اس امیر میرو پر دم گھٹ گیا جس سے وہ پیار کرتا تھا۔ العدید نے اپنے بھتیجے صلاح الدین یوسف ابن ایوب کو جو کہ امیروں میں سب سے چھوٹے تھے سرمایہ کاری کی تھی، کیونکہ نورید کمانڈروں نے اس کی سفارش کرتے ہوئے لکھا تھا: انہوں نے اس کی عاجزی، اس کے حسن سلوک، اپنے ساتھیوں کے ساتھ اس کی مہربانی کو دیکھا۔ 15}۔"
