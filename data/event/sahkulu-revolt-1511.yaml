summary:
  ar: "بطاقة أولية لعصيان شاه قلي سنة ١٥١١م، الانتفاضة القزلباشية الكبرى في الأناضول التي سحقها الأجناد مرتين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Şahkulu revolt of 1511, the great Qizilbash rising in Anatolia that cost two grand viziers; its sources are not yet checked on the page."
  es: "Boceto de ficha para la revuelta de Şahkulu de 1511, el gran levantamiento Qizilbash en Anatolia que costó dos grandes visires; sus fuentes aún no se han verificado en la página."
  fr: "Projet de fiche pour la révolte de Şahkulu de 1511, le grand soulèvement des Qizilbash en Anatolie qui coûta la vie à deux grands vizirs; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1511 کی Şahkulu بغاوت کے لیے ڈرافٹ کارڈ، اناطولیہ میں اٹھنے والا عظیم قزلباش جس کی قیمت دو عظیم وزیروں کی تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Anadolu'da askerler tarafından iki kez bastırılan büyük Kızılbaş ayaklanması olan 1511 yılındaki Şah Qoli isyanına dair ön bilgiler; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang pemberontakan Shah Qoli tahun 1511 M, pemberontakan besar Qizilbash di Anatolia yang dua kali dihancurkan oleh tentara; sumber-sumbernya di halaman ini belum ditinjau."
