label: { ar: "أسر الغلمان لجلال الدولة وإهانتهم ٤٢٤", en: "The ghilman's seizure and humiliation of Jalal al-Dawla, 424", es: "La captura y humillación de Jalal al-Dawla por parte del ghilman, 424", fr: "Saisie et humiliation de Jalal al-Dawla par le ghilman, 424", ur: "غلمان کا قبضہ اور ذلت جلال الدولہ ص 424", tr: "Devlet görevlilerinin yakalanması ve aşağılanması 424", id: "Penangkapan dan penghinaan terhadap para pegawai negeri 424" }
summary:
  ar: "في رمضان سنة ٤٢٤ اجتمع الغلمان عند مسجد القهرمانة يشكون، فوجد بعضهم باب بستان دار المملكة مفتوحًا فدخلوا، وخرج الملك يقول تعالوا أسمع كلامكم فأمسكوه وسحبوه إلى دجلة وأركبوه سميرية كادت تغرق وهم يهزؤون به، ثم أوقفوه في الشمس وحبسوه في مسجد ثم نقلوه إلى دار المحلبية؛ ونجّده القاعد أبو الوفاء بنحو عشرين غلامًا فعبر إلى الكرخ إلى دار جميل للشريف المرتضى؛ وكتب الغلمان إليه «نحن عبيدك ومماليكك ملّكناك أمورنا ابتداء» فتلطّف بهم، واستمال صغار الأمراء ليلًا فجاؤوا إلى دار المرتضى يقبّلون الأرض ويعتذرون وأركبوه وقالوا جلال الدولة ملكنا ونحن جنده، وقبل وزيرًا أبا القاسم {cite:muntazam-ibn-al-jawzi j.8 p.414-417}."
  en: "In Ramadan 424 the ghilman gathered at the mosque of al-Qahramana to lodge a complaint. Some of them found the gate of the garden of the royal residence open and went in. The king came out saying, 'Come, let me hear what you have to say'; they seized him, dragged him to the Tigris and put him in a samiriyya boat that nearly capsized, mocking him as they did. Then they left him standing in the sun, confined him in a mosque, and moved him to the house of al-Mahalibiyya. Abu'l-Wafa' al-Qa'id came to his aid with about twenty ghilman and crossed to al-Karkh, to the house of Jamil belonging to al-Sharif al-Murtada. The ghilman wrote to him: 'We are your slaves and your mamluks; we made you king over our affairs from the start.' He dealt with them tactfully, and by night he won over the junior amirs, who came to al-Murtada's house kissing the ground and apologising; they mounted him and said, 'Jalal al-Dawla is our king and we are his troops.' He accepted Abu'l-Qasim as vizier {cite:muntazam-ibn-al-jawzi j.8 p.414-417}."
  es: "En Ramadán 424, los ghilman se reunieron en la mezquita de al-Qahramana para presentar una queja. Algunos encontraron la puerta del jardín de la residencia real abierta y entraron. El rey salió diciendo: «Venid, quiero oír lo que tenéis que decir». Lo apresaron, lo arrastraron hasta el Tigris y lo metieron en una barca samiriyya que casi zozobró, burlándose de él. Luego lo dejaron de pie bajo el sol, lo confinaron en una mezquita y lo trasladaron a la casa de al-Mahalibiyya. Abu'l-Wafa' al-Qa'id acudió en su ayuda con unos veinte ghilman y cruzó a al-Karkh, a la casa de Jamil, perteneciente a al-Sharif al-Murtada. Los ghilman le escribieron: «Somos tus esclavos y tus mamelucos; desde el principio te hemos hecho rey de nuestros asuntos». Los trató con tacto y, por la noche, se ganó a los emires menores, quienes llegaron a la casa de al-Murtada besando el suelo y pidiendo disculpas; se subieron a su lomo y dijeron: «Jalal al-Dawla es nuestro rey y nosotros somos sus tropas». Aceptó a Abu'l-Qasim como visir {cite:muntazam-ibn-al-jawzi j.8 p.414-417}."
  fr: "En Ramadan 424, les ghilmans se rassemblèrent à la mosquée d'al-Qahramana pour porter plainte. Certains d'entre eux trouvèrent la porte du jardin de la résidence royale ouverte et y entrèrent. Le roi sortit et dit: « Venez, laissez-moi entendre ce que vous avez à dire. » Ils s'emparèrent de lui, le traînèrent jusqu'au Tigre et le jetèrent dans une barque samiriya qui faillit chavirer, tout en se moquant de lui. Puis ils le laissèrent debout au soleil, l'enfermèrent dans une mosquée et le conduisirent à la maison d'al-Mahalibiyya. Abu'l-Wafa' al-Qa'id vint à son secours avec une vingtaine de ghilmans et traversèrent le fleuve jusqu'à al-Karkh, à la maison de Jamil, appartenant à al-Sharif al-Murtada. Les ghilmans lui écrivirent: « Nous sommes vos esclaves et vos mamelouks; nous vous avons établi roi sur nos affaires dès le début. » Il les traita avec tact, et la nuit venue, il gagna les suffrages des émirs subalternes, qui vinrent chez al-Murtada embrasser le sol et s'excuser; ils montèrent sur lui et dirent: « Jalal al-Dawla est notre roi et nous sommes ses troupes. » Il accepta Abu'l-Qasim comme vizir {cite:muntazam-ibn-al-jawzi j.8 p.414-417}."
  ur: "رمضان المبارک 424 میں غلمان مسجد القہرمانہ میں شکایت درج کرانے کے لیے جمع ہوئے۔ ان میں سے بعض نے شاہی رہائش کے باغ کا دروازہ کھلا پایا اور اندر چلے گئے۔ بادشاہ یہ کہہ کر باہر آیا کہ آؤ میں سنوں کہ تم کیا کہنا چاہتے ہو۔ انہوں نے اسے پکڑ لیا، اسے دجلہ تک گھسیٹ کر لے گئے اور اسے ایک سامریہ کشتی میں ڈال دیا جو تقریباً الٹ گئی تھی، اس کا مذاق اڑاتے ہوئے جیسے وہ کرتے تھے۔ پھر انہوں نے اسے دھوپ میں کھڑا چھوڑ دیا، اسے مسجد میں بند کر دیا، اور المحلبیہ کے گھر لے گئے۔ ابو الوفاء القائد تقریباً بیس غلمان کے ساتھ اس کی مدد کے لیے آیا اور الکرخ کو عبور کر کے الشریف المرتضیٰ سے تعلق رکھنے والے جمیل کے گھر پہنچا۔ غلمان نے اسے لکھا: 'ہم آپ کے غلام اور آپ کے مملوک ہیں۔ ہم نے آپ کو شروع سے اپنے معاملات کا بادشاہ بنایا ہے۔' اس نے ان کے ساتھ تدبیر سے معاملہ کیا، اور رات گئے اس نے جونیئر امیروں پر فتح حاصل کی، جو زمین کو چومتے اور معافی مانگتے ہوئے المرتضیٰ کے گھر آئے۔ انہوں نے اسے سوار کیا اور کہا کہ جلال الدولہ ہمارا بادشاہ ہے اور ہم اس کے لشکر ہیں۔ اس نے ابوالقاسم کو وزیر کے طور پر قبول کیا {حوالہ:منتظم ابن الجوزی ج8 ص 414-417}۔"
  tr: "424 yılının Ramazan ayında, hizmetkarlar şikayette bulunmak için Kahramana Camii'nde toplandılar. Bazıları kraliyet sarayının bahçesinin kapısının açık olduğunu görünce içeri girdiler. Kral dışarı çıktı ve \"Gelin, sözlerinizi dinleyelim\" dedi. Bunun üzerine onu yakalayıp Dicle'ye sürüklediler ve neredeyse batmak üzere olan bir semiriyeye bindirip onunla alay ettiler. Sonra onu güneşte bekletip bir camiye hapsettiler, ardından Mahlabiye Sarayı'na götürdüler. Kadı Ebu el-Vafa, yaklaşık yirmi hizmetkarıyla birlikte yardımına koştu ve Şerif el-Murtada'nın yanına, Cemil'in evine gitti. Hizmetkarlar ona şöyle yazdılar: \"Biz sizin köleleriniziz ve hizmetkarlarınızız. İşlerimizi başından beri size emanet ettik.\" Bunun üzerine onlara karşı nazik davrandı ve geceleyin küçük prenslerin gönlünü kazandı; böylece yere öperek ve özür dileyerek el-Murtada'nın evine geldiler. Onu bir ata bindirdiler ve \"Celale el-Davla bizim kralımız, biz de onun askerleriyiz\" dediler. Ve Ebu el-Kâsım'ı vezir olarak kabul etti."
  id: "Pada bulan Ramadan tahun 424, para pelayan berkumpul di Masjid Qahramana untuk mengadu. Beberapa dari mereka mendapati gerbang taman istana kerajaan terbuka, sehingga mereka masuk. Raja keluar dan berkata, “Mari, sampaikan keluhan kalian.” Maka mereka menangkapnya dan menyeretnya ke Sungai Tigris dan menempatkannya di atas Samiriyya yang hampir tenggelam sementara mereka mengejeknya. Kemudian mereka menyuruhnya berdiri di bawah terik matahari dan memenjarakannya di sebuah masjid, lalu mereka memindahkannya ke Istana Mahlabiya. Qa’id Abu al-Wafa’ datang membantunya dengan sekitar dua puluh pelayan, sehingga ia menyeberang ke al-Karkh ke rumah Jamil untuk Sharif al-Murtada. Para pelayan menulis kepadanya, “Kami adalah hamba dan pelayanmu. Kami telah mempercayakan urusan kami kepadamu sejak awal.” Maka ia berbaik hati kepada mereka, dan ia membujuk para pangeran muda di malam hari, sehingga mereka datang ke rumah al-Murtada sambil mencium tanah dan meminta maaf. Mereka menaikkannya ke atas kuda dan berkata, “Jalal al-Dawla adalah raja kami dan kami adalah tentaranya.” Dan dia menerima Abu al-Qasim sebagai menteri."
