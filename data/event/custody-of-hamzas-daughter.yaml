summary:
  ar: "عند خروج النبي من مكة بعد عمرة القضاء تبعته ابنة حمزة تنادي يا عم، فتناولها علي، واختصم فيها علي وجعفر وزيد، فقضى النبي بها لخالتها، زوجة جعفر، وقال: الخالة بمنزلة الأم."
  tr: "Peygamberimiz Kaza Umresinden sonra Mekke'den ayrıldığında, Hamza'nın kızı onu takip ederek, \"Ey amca!\" diye seslendi. Ali onu yanına aldı ve Ali, Cafer ve Zeyd onun için çekişmeye girdiler. Peygamberimiz kızın teyzesi, yani Cafer'in karısının lehine hüküm verdi ve şöyle buyurdu: \"Teyze, anne gibidir.\""
  id: "Ketika Nabi meninggalkan Mekah setelah umrah Qada, putri Hamza mengikutinya sambil berseru, “Wahai paman!” Ali menerimanya, dan Ali, Jaafar, dan Zaid berselisih memperebutkannya. Nabi memutuskan untuk memihak bibinya dari pihak ibu, istri Jaafar, dan berkata: “Bibi dari pihak ibu itu seperti seorang ibu.”"
