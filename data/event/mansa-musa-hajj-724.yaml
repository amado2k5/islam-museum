id: event/mansa-musa-hajj-724
class: event
kind: pilgrimage
label:
  ar: حج منسا موسى
  en: The hajj of Mansa Musa
  es: "El Hajj de Mansa Musa"
  fr: "Le pèlerinage de Mansa Moussa"
summary:
  ar: رحلة منسا موسى ملك مالي إلى الحجاز سنة 724هـ في موكب أدهش أهل مصر والحجاز، جاوزت وصائفه اثني عشر ألفاً لابسات أقبية الديباج والحرير اليماني، وكان يتحف الناس في كل منزل بطرف المآكل والحلاوات، فأنشأت مصر تحكي عن سخائه وعن ملك مالي وعظمته ما لا تزال تتناقله، وأراد أن يتخذ بيتاً في قاعدة سلطانه محكم البناء مجللاً بالكلس لغرابته.
  en: The journey of Mali's king Mansa Musa to the Hijaz in 724 AH in a caravan that astonished Egypt and the Hijaz — over twelve thousand attendants in brocade and Yemeni silk, feasting every halt on rare foods and sweets — leaving Egypt retelling his munificence for generations, while he planned a lime-plastered guest house in his capital for his returning entourage.
  es: "El viaje del rey Mansa Musa de Malí al Hiyaz en el año 724 de la Hégira en una caravana que asombró a Egipto y al Hiyaz —más de doce mil acompañantes vestidos con brocados y seda yemení, que disfrutaban en cada parada de comidas y dulces exquisitos— dejó a Egipto narrando su generosidad durante generaciones, mientras él planeaba construir una casa de huéspedes encalada en su capital para su séquito a su regreso."
  fr: "Le voyage du roi Mansa Moussa du Mali au Hedjaz en 724 AH dans une caravane qui stupéfia l'Égypte et le Hedjaz — plus de douze mille serviteurs vêtus de brocart et de soie yéménite, se régalant à chaque étape de mets et de sucreries rares — laissa l'Égypte raconter sa munificence pendant des générations, tandis qu'il planifiait une maison d'hôtes enduite de chaux dans sa capitale pour sa suite de retour."
