  en: The hajj of Mansa Musa
summary:
  ar: رحلة منسا موسى ملك مالي إلى الحجاز سنة 724هـ في موكب أدهش أهل مصر والحجاز، جاوزت وصائفه اثني عشر ألفاً لابسات أقبية الديباج والحرير اليماني، وكان يتحف الناس في كل منزل بطرف المآكل والحلاوات، فأنشأت مصر تحكي عن سخائه وعن ملك مالي وعظمته ما لا تزال تتناقله، وأراد أن يتخذ بيتاً في قاعدة سلطانه محكم البناء مجللاً بالكلس لغرابته.
  en: The journey of Mali's king Mansa Musa to the Hijaz in 724 AH in a caravan that astonished Egypt and the Hijaz — over twelve thousand attendants in brocade and Yemeni silk, feasting every halt on rare foods and sweets — leaving Egypt retelling his munificence for generations, while he planned a lime-plastered guest house in his capital for his returning entourage.
