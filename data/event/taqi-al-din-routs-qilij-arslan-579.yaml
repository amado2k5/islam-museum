  ar: "طمع قلج أرسلان صاحب الروم في الشام لوقوعها بين الملك الصالح وصلاح الدين فاجتمع عليه جمع كثير يقال كانوا عشرين ألفًا، فأرسل إليهم صلاح الدين أخاه تقي الدين في ألف فارس فواقعهم وهزمهم وعاد ولم يحضر معه غير تخريب حصن الأحزان، وكان يفتخر ويقول هزمت بألف مقاتل عشرين ألفًا {cite:kamil-ibn-al-athir p. 97}."
