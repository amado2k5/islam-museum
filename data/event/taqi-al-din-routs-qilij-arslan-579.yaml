label: { ar: "هزيمة عساكر قلج أرسلان بألف فارس", en: "Taqi al-Dīn routs Qilij Arslān's twenty thousand with a thousand horse", es: "Taqi al-Dīn derrota a los veinte mil de Qilij Arslān con mil caballos", fr: "Taqi al-Dīn met en déroute les vingt mille hommes de Qilij Arslān avec mille chevaux", ur: "تقی الدین نے قلیج ارسلان کے بیس ہزار کو ایک ہزار گھوڑے سے شکست دی", tr: "Kilij Arslan'ın bin süvariden oluşan ordusunun yenilgisi", id: "Kekalahan pasukan Kilij Arslan dengan seribu penunggang kuda." }
date:
  start: { edtf: "1183~", hijri: "0579", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "طمع قلج أرسلان صاحب الروم في الشام لوقوعها بين الملك الصالح وصلاح الدين فاجتمع عليه جمع كثير يقال كانوا عشرين ألفًا، فأرسل إليهم صلاح الدين أخاه تقي الدين في ألف فارس فواقعهم وهزمهم وعاد ولم يحضر معه غير تخريب حصن الأحزان، وكان يفتخر ويقول هزمت بألف مقاتل عشرين ألفًا {cite:kamil-ibn-al-athir p. 97}."
  en: "Qilij Arslān of Rūm, scenting weakness while Aleppo stood between al-Ṣāliḥ and Saladin, crossed with a host said to be twenty thousand. Saladin sent his brother Taqī al-Dīn ʿUmar with a thousand horse; he broke them and returned having only demolished the Aḥzān fort — boasting ever after «I routed twenty thousand with a thousand» {cite:kamil-ibn-al-athir p. 97}."
  es: "Qilij Arslān de Rūm, percibiendo debilidad mientras Alepo se interponía entre al-Ṣāliḥ y Saladino, cruzó con un ejército de veinte mil hombres. Saladino envió a su hermano Taqī al-Dīn ʿUmar con mil caballos; este los derrotó y regresó habiendo destruido únicamente la fortaleza de Aḥzān, jactándose desde entonces: «Derroté a veinte mil con mil» {cite:kamil-ibn-al-athir p. 97}."
  fr: "Qilij Arslān de Rūm, flairant la faiblesse d'Alep alors qu'elle se trouvait entre al-Ṣāliḥ et Saladin, traversa la ville avec une armée estimée à vingt mille hommes. Saladin envoya son frère Taqī al-Dīn ʿUmar avec mille cavaliers; celui-ci les mit en déroute et revint n'ayant détruit que la forteresse d'Aḥzān, se vantant dès lors: « J'ai mis en déroute vingt mille hommes avec mille » {cite: kamil-ibn-al-athir p. 97}."
  ur: "روم کا قلیج ارسلان، کمزوری کو خوشبو لگا رہا تھا جب کہ حلب الصلاح اور صلاح الدین کے درمیان کھڑا تھا، بیس ہزار کے لشکر کے ساتھ گزرا۔ صلاح الدین نے اپنے بھائی تقی الدین عمر کو ایک ہزار گھوڑے کے ساتھ بھیجا۔ اس نے ان کو توڑ دیا اور قلعہ احزان کو منہدم کر کے واپس لوٹا - \"میں نے بیس ہزار کو ایک ہزار سے شکست دی\" کے بعد فخر کرتے ہوئے کہا۔ 97}۔"
  tr: "Romalıların hükümdarı Kilij Arslan, Kral Salih ile Selahaddin arasında bulunduğu için Levant'ı ele geçirmek istiyordu. Ona karşı yirmi bin kişi olduğu söylenen büyük bir grup toplandı. Selahaddin, kardeşi Takîddin'i bin süvariyle onlara gönderdi ve Takîddin onlarla savaştı, onları yendi ve Ahzan kalesinin yıkımından başka hiçbir şey getirmeden geri döndü. \"Bin savaşçıyla yirmi bin kişiyi yendim\" diyerek övünürdü. {kaynak: Kamil İbn el-Athir, s. 97}"
  id: "Qilij Arslan, penguasa Romawi, menginginkan Levant karena letaknya di antara Raja Al-Salih dan Saladin. Sekelompok besar orang berkumpul melawannya, konon berjumlah dua puluh ribu. Saladin mengirim saudaranya, Taqi al-Din, dengan seribu penunggang kuda untuk melawan mereka, dan ia melawan mereka, mengalahkan mereka, dan kembali tanpa membawa apa pun kecuali kehancuran benteng Al-Ahzan. Ia biasa membual dan berkata, “Aku mengalahkan dua puluh ribu orang dengan seribu pejuang.” {cite:kamil-ibn-al-athir p. 97}"
