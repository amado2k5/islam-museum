label: { ar: "دخول أبي طاهر الجنابي البصرة سنة 311" }
summary:
  ar: "ورد الخبر في ربيع الآخر سنة 311هـ بدخول أبي طاهر سليمان بن الحسن الجنابي القرمطي البصرة سحراً يوم الاثنين لخمس بقين من ربيع الآخر في ألف وسبعمائة رجل فنصب سلالم بالليل على سورها وصعد على أعلى السور ثم نزل إلى البلد وقتل البوابين الذين على الأبواب وفتح الأبواب وطرح بين كل مصراعين حصباء ورملاً كان معه على الجمال لئلا يمكن غلق الأبواب عليه ووضع السيف في أهل البصرة وأحرق المربد ونقض الجامع ومسجد قبر طلحة وهرب الناس فطرحوا أنفسهم في الماء فغرق أكثرهم وأقام أبو طاهر بالبصرة سبعة عشر يوماً يحمل على جماله كل ما يقدر عليه من الأمتعة والنساء والصبيان {cite:muntazam-ibn-al-jawzi p. 466}."
  en: "In Rabi II 311 Abu Tahir al-Jannabi entered Basra before dawn with seventeen hundred men, raised ladders on the wall by night, opened the gates and wedged gravel between their leaves, put the city to the sword, burned the Mirbad and demolished the congregational mosque and Talha's tomb-mosque, staying seventeen days while his camels carried off goods, women and children {cite:muntazam-ibn-al-jawzi p. 466}."
