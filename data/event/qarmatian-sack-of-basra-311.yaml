id: event/qarmatian-sack-of-basra-311
class: event
kind: massacre
label: { ar: "دخول أبي طاهر الجنابي البصرة سنة 311", en: "Abu Tahir al-Janabi's entry into Basra, 311", es: "Entrada de Abu Tahir al-Janabi en Basora, 311", fr: "Entrée d'Abu Tahir al-Janabi à Bassora, 311", ur: "ابو طاہر الجنبی کا بصرہ میں داخلہ، 311", tr: "Ebu Tahir el-Cennebi 311 yılında Basra'ya girdi.", id: "Abu Tahir al-Jannabi memasuki Basra pada tahun 311." }
summary:
  ar: "ورد الخبر في ربيع الآخر سنة 311هـ بدخول أبي طاهر سليمان بن الحسن الجنابي القرمطي البصرة سحراً يوم الاثنين لخمس بقين من ربيع الآخر في ألف وسبعمائة رجل فنصب سلالم بالليل على سورها وصعد على أعلى السور ثم نزل إلى البلد وقتل البوابين الذين على الأبواب وفتح الأبواب وطرح بين كل مصراعين حصباء ورملاً كان معه على الجمال لئلا يمكن غلق الأبواب عليه ووضع السيف في أهل البصرة وأحرق المربد ونقض الجامع ومسجد قبر طلحة وهرب الناس فطرحوا أنفسهم في الماء فغرق أكثرهم وأقام أبو طاهر بالبصرة سبعة عشر يوماً يحمل على جماله كل ما يقدر عليه من الأمتعة والنساء والصبيان {cite:muntazam-ibn-al-jawzi p. 466}."
  en: "In Rabi II 311 Abu Tahir al-Jannabi entered Basra before dawn with seventeen hundred men, raised ladders on the wall by night, opened the gates and wedged gravel between their leaves, put the city to the sword, burned the Mirbad and demolished the congregational mosque and Talha's tomb-mosque, staying seventeen days while his camels carried off goods, women and children {cite:muntazam-ibn-al-jawzi p. 466}."
  es: "En Rabi II 311 Abu Tahir al-Jannabi entró en Basora antes del amanecer con mil setecientos hombres, levantó escaleras en la muralla durante la noche, abrió las puertas y colocó grava entre sus hojas, pasó la ciudad a cuchillo, quemó el Mirbad y demolió la mezquita congregacional y la tumba-mezquita de Talha, permaneciendo diecisiete días mientras sus camellos se llevaban mercancías, mujeres y niños {cite:muntazam-ibn-al-jawzi p. 466}."
  fr: "En Rabi II 311, Abu Tahir al-Jannabi entra à Bassora avant l'aube avec mille sept cents hommes, installa des échelles sur le mur pendant la nuit, ouvrit les portes et coinça du gravier entre leurs battants, mit la ville au fil de l'épée, brûla le Mirbad et démolit la mosquée du vendredi et le tombeau-mosquée de Talha, restant dix-sept jours pendant que ses chameaux emportaient des biens, des femmes et des enfants {cite:muntazam-ibn-al-jawzi p. 466}."
  ur: "ربیع دوم 311 میں ابو طاہر الجنبی سترہ سو آدمیوں کے ساتھ فجر سے پہلے بصرہ میں داخل ہوئے، رات کو دیوار پر سیڑھیاں چڑھائیں، دروازے کھولے اور ان کے پتوں کے درمیان کنکر باندھے، شہر کو تلوار سے باندھ دیا، میرباد کو جلایا اور اجتماعی مسجد اور طلحہ کی قبر کی مسجد کو مسمار کر دیا، اس کے سات دن تک خواتین اور بچوں کو اچھی طرح سے لے جایا گیا۔ {حوالہ:منتظم ابن الجوزی ص۔ 466}۔"
  tr: "Hicri 311 yılının Rebiü'l-Sani ayında, Ebu Tahir Süleyman ibn el-Hasan el-Cennebi el-Karmati'nin Rebiü'l-Sani ayının bitimine beş gün kala, Pazartesi sabahı şafak vakti bin yedi yüz adamıyla Basra'ya girdiği haberi geldi. Geceleyin surlara merdivenler kurup tepeye tırmandı, sonra şehre indi ve kapılarda bulunan bekçileri öldürdü. Kapıları açtı ve her bir kapı arasına develerinde taşıdığı çakıl taşları ve kumları attı ki kapılar kapanamasın. Basra halkına kılıç çekti, harman yerini yaktı ve camiyi ve Talha'nın türbesinin bulunduğu camiyi yıktı. Halk kaçtı ve suya atladı, çoğu boğuldu. Ebu Tahir, on yedi gün Basra'da kaldı ve develerine taşıyabildiği tüm eşyalarını, kadınları ve çocukları yükledi. {cite:muntazam-ibn-al-jawzi s. 466}."
  id: "Berita itu datang pada bulan Rabi' al-Thani tahun 311 H bahwa Abu Tahir Sulayman ibn al-Hasan al-Jannabi al-Qarmati memasuki Basra pada subuh hari Senin, lima hari sebelum akhir Rabi' al-Thani, dengan seribu tujuh ratus orang. Ia memasang tangga di malam hari di tembok kota dan memanjat hingga ke puncak tembok, kemudian turun ke kota dan membunuh para penjaga gerbang yang berada di gerbang. Ia membuka gerbang dan melemparkan kerikil dan pasir yang dibawanya di antara setiap pasang daun pada unta-untanya agar gerbang tidak dapat ditutup. Ia menodongkan pedang kepada penduduk Basra dan membakar tempat pengirikan serta menghancurkan masjid dan masjid makam Talha. Orang-orang melarikan diri dan menceburkan diri ke dalam air, dan sebagian besar dari mereka tenggelam. Abu Tahir tinggal di Basra selama tujuh belas hari, memuat semua barang miliknya, wanita, dan anak-anak ke atas unta-untanya. {kutip:muntazam-ibn-al-jawzi hal. 466}."
