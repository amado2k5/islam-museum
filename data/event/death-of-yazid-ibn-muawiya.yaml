label: { ar: "وفاة يزيد بن معاوية", en: "Death of Yazid ibn Mu'awiya", es: "Muerte de Yazid ibn Mu'awiya", fr: "Mort de Yazid ibn Mu'awiya", ur: "یزید بن معاویہ کی وفات", tr: "Yezid ibn Muaviye'nin Ölümü", id: "Kematian Yazid ibn Mu'awiya" }
summary:
  ar: "أهلك الله يزيد بن معاوية في نصف ربيع الأول سنة أربع وستين وجيشه يحاصر ابن الزبير بمكة، فجاء خبره والقتال مستمر فنادى ابن الزبير يا أهل الشام إن طاغيتكم قد هلك فانفلوا وذلوا، وقال الذهبي لما فعل بأهل المدينة ما فعل مع شربه الخمر وإتيانه المنكرات اشتد عليه الناس وخرج عليه غير واحد ولم يبارك الله في عمره {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  en: "Yazid ibn Mu'awiya perished in mid-Rabi' I of year 64 while his army besieged Ibn al-Zubayr at Mecca; the news reached them mid-battle — 'people of Syria, your tyrant has perished' — and they broke away humiliated. Al-Dhahabi remarks that after what he did to the people of Medina, with his wine and outrages, men rose against him on every side and his years were not blessed {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  es: "Yazid ibn Mu'awiya pereció a mediados de Rabi' I del año 64 mientras su ejército sitiaba a Ibn al-Zubayr en La Meca; la noticia les llegó en plena batalla: «¡Pueblo de Siria, vuestro tirano ha perecido!», y se retiraron humillados. Al-Dhahabi comenta que, tras lo que hizo al pueblo de Medina, con su vino y sus ultrajes, los hombres se alzaron contra él por todas partes y sus años no fueron bendecidos {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  fr: "Yazid ibn Mu'awiya périt au milieu du mois de Rabi' I de l'an 64, alors que son armée assiégeait Ibn al-Zubayr à La Mecque. La nouvelle leur parvint en plein combat: « Peuple de Syrie, votre tyran est mort ! » Ils se retirèrent, humiliés. Al-Dhahabi rapporte qu'après les exactions commises contre les habitants de Médine, par son alcoolisme et ses exactions, des hommes se soulevèrent contre lui de toutes parts et ses années ne furent pas bénies (voir: Tarikh-Khulafa-Minhaj-1434, p. 345)."
  ur: "یزید بن معاویہ سنہ 64 کے وسط ربیع الثانی میں ہلاک ہو گیا جبکہ اس کی فوج نے مکہ میں ابن الزبیر کا محاصرہ کر لیا۔ جنگ کے وسط میں ان تک یہ خبر پہنچی - 'اہل شام، تمہارا ظالم ہلاک ہو گیا' - اور وہ ذلیل ہو کر الگ ہو گئے۔ الذہبی نے کہا ہے کہ اس نے اہل مدینہ کے ساتھ جو کچھ کیا، اس کے بعد شراب اور غصے کے ساتھ ہر طرف سے لوگ اس کے خلاف اٹھ کھڑے ہوئے اور اس کے سال مبارک نہیں ہوئے۔ 345}۔"
  tr: "Allah, Yezid bin Muaviye'yi 64. yılın Rebiü'l-Evvel ayının ortasında, ordusu Mekke'de İbnü'l-Zübeyr'i kuşatırken helak etti. Haber, çatışmalar devam ederken geldi ve İbnü'l-Zübeyr, \"Ey Suriye halkı, zaliminiz helak oldu, kaçın ve aşağılanın!\" diye seslendi. El-Dhahabi şöyle dedi: \"Medine halkına yaptıklarından, şarap içmesinden ve günah işlemesinden sonra, halk ona çok kızdı ve birden fazla kişi ona karşı isyan etti ve Allah onun canına bereket vermedi.\" {Kaynak:tarikh-khulafa-minhaj-1434 s. 345}"
  id: "Allah membinasakan Yazid bin Muawiyah pada pertengahan bulan Rabi' al-Awwal tahun enam puluh empat, ketika pasukannya mengepung Ibn al-Zubayr di Mekah. Kabar tentangnya datang ketika pertempuran masih berlangsung, sehingga Ibn al-Zubayr berseru, “Wahai penduduk Suriah, zalim kalian telah binasa, maka larilah dan hinakanlah diri kalian.” Al-Dhahabi berkata, “Ketika dia melakukan kepada penduduk Madinah apa yang dia lakukan, dengan minum anggur dan berbuat dosa, orang-orang menjadi sangat marah kepadanya, dan lebih dari satu orang memberontak terhadapnya, dan Allah tidak memberkati hidupnya.” {cite:tarikh-khulafa-minhaj-1434 p. 345}"
