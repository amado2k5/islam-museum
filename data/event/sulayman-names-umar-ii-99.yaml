label: { ar: "عهد سليمان بن عبد الملك بالخلافة إلى عمر بن عبد العزيز", en: "Sulayman ibn Abd al-Malik designates Umar ibn Abd al-Aziz as caliph" }
summary:
  ar: "لما حضرت سليمان بن عبد الملك الوفاة بمرج دابق دعا رجاء بن حيوة ومحمد بن شهاب الزهري ومكحولاً وغيرهم من العلماء ممن كان في عسكره، فكتب وصيته وأشهدهم عليها، وأمرهم إذا مات أن ينادوا بالصلاة جامعة ثم يقرأوا الكتاب على الناس {cite:bakr-umayyad-state-1134715 p. 261-262}. فلما فرغ من دفنه نودي بذلك، فقام الزهري فسأل الناس أرضوا بمن سماه أمير المؤمنين في وصيته؟ فقرأ الكتاب فإذا فيه اسم عمر بن عبد العزيز ومن بعده يزيد بن عبد الملك {cite:bakr-umayyad-state-1134715 p. 262}. وكان عمر في أواخر الناس، فلما دُعي باسمه استرجع، فأُخذ بيده حتى صعد المنبر، وكان أول من بايعه يزيد بن عبد الملك، وبايع الناس، ثم بايع سعيد وهشام بعد يومين {cite:bakr-umayyad-state-1134715 p. 262}. وذكر الكتاب أن ذلك كان لعشر بقين من صفر سنة تسع وتسعين، وهو يوم وفاة سليمان {cite:bakr-umayyad-state-1134715 p. 261}."
  en: "When death came upon Sulayman ibn Abd al-Malik at Marj Dabiq, he summoned Raja' ibn Haywa, Muhammad ibn Shihab al-Zuhri, Makhul and other scholars of his army. They wrote his will and he had them bear witness to it, instructing that when he died they should proclaim that the people must assemble for prayer, and then read the letter to them {cite:bakr-umayyad-state-1134715 p. 261-262}. When his burial was finished, the proclamation was made; al-Zuhri stood and asked the people, 'Are you content with the one whom the Commander of the Faithful named in his will?' He then read the letter, which named Umar ibn Abd al-Aziz, and after him Yazid ibn Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 262}. Umar was among the last of the people; when his name was called he said the formula of return (istirja'), and he was taken by the hand until he climbed the pulpit. Yazid ibn Abd al-Malik was the first to pledge allegiance, the people pledged after him, and Sa'id and Hisham pledged two days later {cite:bakr-umayyad-state-1134715 p. 262}. The book states that this was ten days before the end of Safar 99 AH, the day of Sulayman's death {cite:bakr-umayyad-state-1134715 p. 261}."
