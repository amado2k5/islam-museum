label: { ar: "عهد سليمان بن عبد الملك بالخلافة إلى عمر بن عبد العزيز", en: "Sulayman ibn Abd al-Malik designates Umar ibn Abd al-Aziz as caliph", es: "Sulayman ibn Abd al-Malik designa a Umar ibn Abd al-Aziz como califa.", fr: "Sulayman ibn Abd al-Malik désigne Umar ibn Abd al-Aziz comme calife" }
summary:
  ar: "لما حضرت سليمان بن عبد الملك الوفاة بمرج دابق دعا رجاء بن حيوة ومحمد بن شهاب الزهري ومكحولاً وغيرهم من العلماء ممن كان في عسكره، فكتب وصيته وأشهدهم عليها، وأمرهم إذا مات أن ينادوا بالصلاة جامعة ثم يقرأوا الكتاب على الناس {cite:bakr-umayyad-state-1134715 p. 261-262}. فلما فرغ من دفنه نودي بذلك، فقام الزهري فسأل الناس أرضوا بمن سماه أمير المؤمنين في وصيته؟ فقرأ الكتاب فإذا فيه اسم عمر بن عبد العزيز ومن بعده يزيد بن عبد الملك {cite:bakr-umayyad-state-1134715 p. 262}. وكان عمر في أواخر الناس، فلما دُعي باسمه استرجع، فأُخذ بيده حتى صعد المنبر، وكان أول من بايعه يزيد بن عبد الملك، وبايع الناس، ثم بايع سعيد وهشام بعد يومين {cite:bakr-umayyad-state-1134715 p. 262}. وذكر الكتاب أن ذلك كان لعشر بقين من صفر سنة تسع وتسعين، وهو يوم وفاة سليمان {cite:bakr-umayyad-state-1134715 p. 261}."
  en: "When death came upon Sulayman ibn Abd al-Malik at Marj Dabiq, he summoned Raja' ibn Haywa, Muhammad ibn Shihab al-Zuhri, Makhul and other scholars of his army. They wrote his will and he had them bear witness to it, instructing that when he died they should proclaim that the people must assemble for prayer, and then read the letter to them {cite:bakr-umayyad-state-1134715 p. 261-262}. When his burial was finished, the proclamation was made; al-Zuhri stood and asked the people, 'Are you content with the one whom the Commander of the Faithful named in his will?' He then read the letter, which named Umar ibn Abd al-Aziz, and after him Yazid ibn Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 262}. Umar was among the last of the people; when his name was called he said the formula of return (istirja'), and he was taken by the hand until he climbed the pulpit. Yazid ibn Abd al-Malik was the first to pledge allegiance, the people pledged after him, and Sa'id and Hisham pledged two days later {cite:bakr-umayyad-state-1134715 p. 262}. The book states that this was ten days before the end of Safar 99 AH, the day of Sulayman's death {cite:bakr-umayyad-state-1134715 p. 261}."
  es: "Cuando Sulayman ibn Abd al-Malik falleció en Marj Dabiq, convocó a Raja' ibn Haywa, Muhammad ibn Shihab al-Zuhri, Makhul y otros eruditos de su ejército. Ellos redactaron su testamento y él les pidió que lo firmaran como testigos, instruyendo que, al morir, proclamaran que el pueblo debía reunirse para la oración y luego leerles la carta {cite:bakr-umayyad-state-1134715 p. 261-262}. Una vez finalizado su entierro, se hizo la proclamación; al-Zuhri se puso de pie y preguntó al pueblo: \"¿Están conformes con aquel a quien el Comandante de los Creyentes nombró en su testamento?\". Luego leyó la carta, que nombraba a Umar ibn Abd al-Aziz, y después de él a Yazid ibn Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 262}. Umar fue uno de los últimos en llegar; cuando se mencionó su nombre, pronunció la fórmula de retorno (istirja'), y fue llevado de la mano hasta que subió al púlpito. Yazid ibn Abd al-Malik fue el primero en jurar lealtad, el pueblo juró después de él, y Sa'id e Hisham juraron dos días después {cite:bakr-umayyad-state-1134715 p. 262}. El libro indica que esto ocurrió diez días antes del final de Safar del año 99 de la Hégira, el día de la muerte de Sulayman {cite:bakr-umayyad-state-1134715 p. 261}."
  fr: "Lorsque Sulayman ibn Abd al-Malik mourut à Marj Dabiq, il convoqua Raja' ibn Haywa, Muhammad ibn Shihab al-Zuhri, Makhul et d'autres érudits de son armée. Ils rédigèrent son testament et il leur demanda d'en être témoins, leur enjoignant qu'à sa mort, ils proclament l'assemblée pour la prière, puis lisent le texte de sa lettre (voir: bakr-umayyad-state-1134715, p. 261-262). Une fois l'inhumation terminée, la proclamation fut faite; al-Zuhri se leva et demanda à l'assemblée: « Êtes-vous satisfaits de celui que le Commandeur des Croyants a désigné dans son testament ? » Il lut ensuite la lettre, qui nommait Umar ibn Abd al-Aziz, puis Yazid ibn Abd al-Malik (voir: bakr-umayyad-state-1134715, p. 262). Umar fut parmi les derniers à prêter serment d'allégeance; lorsqu'on appela son nom, il prononça la formule de retour (istirja') et fut conduit par la main jusqu'à la chaire. Yazid ibn Abd al-Malik fut le premier à prêter allégeance, suivi par le peuple, puis par Saïd et Hisham deux jours plus tard (voir Bakr-Umayyad-State, 1134715, p. 262). L'ouvrage précise que cela se passa dix jours avant la fin du mois de Safar 99 AH, jour de la mort de Sulayman (voir Bakr-Umayyad-State, 1134715, p. 261)."
