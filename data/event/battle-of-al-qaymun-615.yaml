label: { ar: "وقعة القيمون سنة 615هـ", en: "The battle of al-Qaymun, 615 AH (1218)", ur: "615ھ ⁦(1218ء)⁩ میں قیمون کی لڑائی", fr: "La bataille d'al-Qaymun, 615 H (1218)", es: "La batalla de al-Qaymun, 615 AH (1218)", tr: "Hicri 615 yılında gerçekleşen Kaymun Muharebesi", id: "Pertempuran Qaymun pada tahun 615 Hijriah" }
summary:
  ar: "لقاء الملك المعظم عيسى بن العادل بالفرنج على القيمون في جمادى الآخرة سنة 615هـ، في أثناء نزول الفرنج على دمياط، فنُصر عليهم وقتل منهم مقتلة عظيمة وأسر مئة فارس من الداوية أدخلهم القدس منكّسة أعلامهم، كما يرويه سبط ابن الجوزي، ويذكر أنها كانت يوم الخميس خامس جمادى الآخرة وقيل يوم الأربعاء، قبل وفاة العادل بيومين أو ثلاثة {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
  en: "The encounter of al-Malik al-Mu'azzam Isa ibn al-Adil with the Franks at al-Qaymun in Jumada II 615 AH, while the Franks were besieging Damietta. Sibt ibn al-Jawzi says he defeated them with great slaughter and took a hundred Templar knights captive, bringing them into Jerusalem with their banners reversed, on Thursday 5 Jumada II (or Wednesday), two or three days before al-Adil's death {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
  fr: "L'affrontement d'al-Malik al-Mu'azzam Isa ibn al-Adil avec les Francs à al-Qaymun en Jumada II 615 H, pendant que les Francs assiégeaient Damiette. Sibt ibn al-Jawzi dit qu'il les vainquit avec un grand carnage et fit prisonniers cent chevaliers templiers, qu'il fit entrer à Jérusalem bannières renversées, le jeudi 5 Jumada II (ou le mercredi), deux ou trois jours avant la mort d'al-Adil {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
  es: "El encuentro de al-Malik al-Mu'azzam Isa ibn al-Adil con los francos en al-Qaymun en Jumada II 615 AH, mientras los francos sitiaban Damietta. Sibt ibn al-Jawzi dice que los derrotó con una gran matanza y tomó cautivos a cien caballeros templarios, llevándolos a Jerusalén con sus estandartes al revés, el jueves 5 de Jumada II (o miércoles), dos o tres días antes de la muerte de al-Adil {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
  ur: "الجمادہ دوم 615 ہجری میں القیمون کے مقام پر المالک المعظم عیسیٰ ابن العدیل کا فرینکوں سے مقابلہ اس وقت ہوا جب فرینک دمیتا کا محاصرہ کر رہے تھے۔ سبط ابن الجوزی کا کہنا ہے کہ اس نے انہیں بڑی ذبح کے ساتھ شکست دی اور ایک سو ٹمپلر نائٹوں کو اسیر کر کے یروشلم لے گئے اور ان کے بینرز الٹتے ہوئے جمعرات 5 جمادی الثانی ⁦(یا بدھ)⁩ کو، العدل کی موت سے دو یا تین دن پہلے۔ 228} {حوالہ: میرات الزمان رسالہ 2013-v22 ص۔ 231}۔"
  tr: "Sibt İbn el-Cevzi'nin rivayetine göre, Kral Mu'azzam İsa bin el-Adil'in Hicri 615 yılında Cemadi el-Ahire ayında Frankların Dimyet'e çıkarma yaptığı sırada El-Kaymun'da Franklarla karşılaşması, onlara karşı zafer kazanması, çok sayıda Frankı öldürmesi ve Tapınak Şövalyelerinden yüz şövalyeyi esir alarak sancakları indirilmiş halde Kudüs'e getirmesi, Cemadi el-Ahire ayının beşinci günü olan Perşembe günü gerçekleşmiştir. (Çarşamba günü, el-Adil'in ölümünden iki veya üç gün önce olduğu rivayet edilmiştir.)"
  id: "Pertemuan Raja Al-Mu'azzam Isa bin Al-Adil dengan kaum Frank di Al-Qaymun pada bulan Jumada Al-Akhirah tahun 615 H, saat kaum Frank mendarat di Damietta, sehingga beliau menang atas mereka dan membunuh banyak dari mereka serta menangkap seratus ksatria dari Templar dan membawa mereka ke Yerusalem dengan bendera mereka diturunkan, sebagaimana diriwayatkan oleh Sibt Ibn Al-Jawzi, dan beliau menyebutkan bahwa itu terjadi pada hari Kamis, tanggal lima Jumada Al-Akhirah, dan dikatakan pada hari Rabu, dua atau tiga hari sebelum kematian Al-Adil {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
