label: { ar: "وقعة القيمون سنة 615هـ", en: "The battle of al-Qaymun, 615 AH (1218)", ur: "615ھ (1218ء) میں قیمون کی لڑائی" }
summary:
  ar: "لقاء الملك المعظم عيسى بن العادل بالفرنج على القيمون في جمادى الآخرة سنة 615هـ، في أثناء نزول الفرنج على دمياط، فنُصر عليهم وقتل منهم مقتلة عظيمة وأسر مئة فارس من الداوية أدخلهم القدس منكّسة أعلامهم، كما يرويه سبط ابن الجوزي، ويذكر أنها كانت يوم الخميس خامس جمادى الآخرة وقيل يوم الأربعاء، قبل وفاة العادل بيومين أو ثلاثة {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
  en: "The encounter of al-Malik al-Mu'azzam Isa ibn al-Adil with the Franks at al-Qaymun in Jumada II 615 AH, while the Franks were besieging Damietta. Sibt ibn al-Jawzi says he defeated them with great slaughter and took a hundred Templar knights captive, bringing them into Jerusalem with their banners reversed, on Thursday 5 Jumada II (or Wednesday), two or three days before al-Adil's death {cite:mirat-al-zaman-risala-2013-v22 p. 228} {cite:mirat-al-zaman-risala-2013-v22 p. 231}."
