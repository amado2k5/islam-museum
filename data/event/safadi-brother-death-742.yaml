label:
  ar: "وفاة جمال الدين إبراهيم أخي الصفدي، ٧٤٢هـ"
  en: "Death of al-Safadi's brother Jamal al-Din Ibrahim, 742/1341"
  ur: "صفدی کے بھائی جمال الدین ابراہیم کی وفات، 742ھ/1341ء"
summary:
  ar: "توفي أبو إسحاق جمال الدين إبراهيم، أخو الصفدي الأصغر، في رابع جمادى الآخرة سنة ٧٤٢هـ (١٥ نوفمبر ١٣٤١م)، فكتب له الصفدي ترجمة رثاء حافلة أثبت فيها كثيراً من أبياته في رثائه {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  en: "Al-Safadi's younger brother Abu Ishaq Jamal al-Din Ibrahim died on 4 Jumada II 742/15 November 1341; al-Safadi devoted to him an emotional obituary in his Wafi including many of his elegiac verses {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  ur: "صفدی کے چھوٹے بھائی ابو اسحاق جمال الدین ابراہیم 4 جمادی الثانی 742ھ/15 نومبر 1341ء کو وفات پا گئے؛ صفدی نے «الوافی بالوفیات» میں ان کے لیے ایک جذباتی ترجمہ لکھا جس میں مرثیے کے کئی ابیات شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}۔"
