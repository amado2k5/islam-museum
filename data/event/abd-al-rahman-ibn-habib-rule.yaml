label: { ar: "استقلال عبد الرحمن بن حبيب بثغر المغرب", en: "Abd al-Rahman ibn Habib's Independent Rule of the Maghreb Frontier", fr: "Le gouvernement indépendant d’Abd al-Rahman ibn Habib sur la frontière du Maghreb", es: "El gobierno independiente de Abd al-Rahman ibn Habib en la frontera del Magreb", ur: "عبدالرحمٰن بن حبیب کا مغرب فرنٹیئر کی آزاد حکومت", tr: "Abdülrahman ibn Habib'in Fas sınır bölgesindeki bağımsızlığı", id: "Kemerdekaan Abd al-Rahman ibn Habib di wilayah perbatasan Maroko" }
summary:
  ar: "عند البلاذري: لما قام الوليد بن يزيد بن عبد الملك خالف عليه عبد الرحمن بن حبيب الفهري وكان محبّاً في ذلك الثغر لما كان من آثار جده عقبة بن نافع فيه فغلب عليه وانصرف عنه حنظلة فبقي عبد الرحمن عليه؛ ولّي يزيد بن الوليد فلم يبعث إلى المغرب عاملاً وقام مروان بن محمد فكاتبه عبد الرحمن وأظهر له الطاعة وبعث إليه بالهدايا — وكان كاتبه خالد بن ربيعة الإفريقي وبينه وبين عبد الحميد بن يحيى مودة ومكاتبة — فأقرّه مروان على الثغر ثم ولّى بعده إلياس بن حبيب ثم حبيب بن عبد الرحمن ثم غلب البربر والإباضية من الخوارج."
  en: "In al-Baladhuri: when al-Walid ibn Yazid ibn Abd al-Malik rose, Abd al-Rahman ibn Habib al-Fihri opposed him — beloved in that frontier for his grandfather Uqba ibn Nafi's traces there — and prevailed over it, Hanzala withdrawing; Yazid ibn al-Walid sent no governor to the Maghreb, and when Marwan ibn Muhammad rose, Abd al-Rahman corresponded with him, showed obedience and sent gifts — his scribe being Khalid ibn Rabi'a al-Ifriqi, between whom and Abd al-Hamid ibn Yahya ran friendship and letters — so Marwan confirmed him over the frontier; then Ilyas ibn Habib ruled after him, then Habib ibn Abd al-Rahman, then the Berbers and the Ibadis of the Khawarij prevailed."
  fr: "Chez al-Baladhuri : lors de l’avènement d’al-Walid ibn Yazid ibn Abd al-Malik, Abd al-Rahman ibn Habib al-Fihri s’opposa à lui — apprécié sur cette frontière pour les traces qu’y avait laissées son grand-père Uqba ibn Nafi — et s’en rendit maître, tandis que Hanzala se retirait. Yazid ibn al-Walid n’envoya aucun gouverneur au Maghreb ; à l’avènement de Marwan ibn Muhammad, Abd al-Rahman correspondit avec lui, manifesta son obéissance et envoya des présents — son secrétaire était Khalid ibn Rabi'a al-Ifriqi, qu’une amitié et des échanges épistolaires liaient à Abd al-Hamid ibn Yahya —, et Marwan le confirma à la tête de la frontière. Ilyas ibn Habib gouverna après lui, puis Habib ibn Abd al-Rahman, avant que les Berbères et les ibadites parmi les kharijites ne l’emportent."
  es: "En al-Baladhuri: cuando al-Walid ibn Yazid ibn Abd al-Malik ascendió al poder, Abd al-Rahman ibn Habib al-Fihri se le opuso —amado en esa frontera por los vestigios de su abuelo Uqba ibn Nafi allí— y prevaleció sobre ella, retirándose Hanzala; Yazid ibn al-Walid no envió ningún gobernador al Magreb, y cuando Marwan ibn Muhammad ascendió al poder, Abd al-Rahman se carteó con él, le mostró obediencia y le envió regalos —su escriba fue Khalid ibn Rabi'a al-Ifriqi, entre quien y Abd al-Hamid ibn Yahya corría la amistad y las cartas— así que Marwan lo confirmó sobre la frontera; luego Ilyas ibn Habib gobernó después de él, luego Habib ibn Abd al-Rahman, luego los bereberes y los ibadíes de los jariyíes prevalecieron."
  ur: "البلادوری میں ہے: جب الولید بن یزید ابن عبد الملک اٹھے تو عبدالرحمٰن بن حبیب الفہری نے اس کی مخالفت کی - اس سرحد میں اپنے دادا عقبہ بن نافع کے آثار کی وجہ سے محبوب تھے - اور اس پر غالب آ گئے، حنظلہ پیچھے ہٹ گیا۔ یزید بن الولید نے مغرب میں کوئی گورنر نہیں بھیجا اور جب مروان بن محمد اٹھے تو عبدالرحمٰن نے اس سے خط و کتابت کی، فرمانبرداری کا مظاہرہ کیا اور تحائف بھیجے - اس کا کاتب خالد بن ربیعہ العفریقی تھا، جس کے اور عبد الحمید بن یحییٰ کے درمیان دوستی کی تصدیق ہوئی؛ چنانچہ مروان اور مروان کے درمیان خط و کتابت کا محاذ چل گیا۔ پھر ان کے بعد الیاس بن حبیب نے حکومت کی، پھر حبیب بن عبدالرحمٰن، پھر خوارج کے بربر اور عبادات غالب ہوئے۔"
  tr: "El-Baladhuri'ye göre: El-Walid ibn Yazid ibn Abd al-Malik ayaklandığında, Abd al-Rahman ibn Habib al-Fihri ona karşı çıktı. Dedesi Uqba ibn Nafi'nin oradaki mirası nedeniyle o sınır bölgesinin dostuydu. Bu yüzden orada üstünlük sağladı ve Hanzala ondan yüz çevirdi, böylece Abd al-Rahman orada kaldı. Yazid ibn al-Walid atandı, bu yüzden Mağrip'e vali göndermedi. Marwan ibn Muhammed ayaklandı, bu yüzden Abd al-Rahman ona mektuplar yazdı, itaat gösterdi ve hediyeler gönderdi - ve kâtibi Halid ibn Rabi'a al-Ifriqi idi ve onunla Abd al-Hamid ibn Yahya arasında sevgi ve yazışma vardı - böylece Marwan onu sınırda onayladı, sonra ondan sonra İlyas ibn Habib'i, sonra Habib ibn Abd al-Rahman'ı atadı, sonra da Berberiler ve Haricilerin İbadiler üstünlük sağladı."
  id: "Menurut Al-Baladhuri: Ketika Al-Walid ibn Yazid ibn Abd al-Malik bangkit, Abd al-Rahman ibn Habib al-Fihri menentangnya. Ia adalah sahabat perbatasan itu karena warisan kakeknya, Uqba ibn Nafi’, di sana. Maka ia berhasil menguasainya, dan Hanzala berpaling darinya, sehingga Abd al-Rahman tetap berkuasa di sana. Yazid ibn al-Walid diangkat, sehingga ia tidak mengirim gubernur ke Maghreb. Marwan bin Muhammad bangkit, lalu Abd al-Rahman menulis surat kepadanya dan menunjukkan ketaatan serta mengirimkan hadiah kepadanya — dan juru tulisnya adalah Khalid bin Rabi’a al-Ifriqi, dan antara dia dan Abd al-Hamid bin Yahya terdapat kasih sayang dan korespondensi — maka Marwan mengukuhkannya di perbatasan, kemudian ia menunjuk Ilyas bin Habib setelahnya, lalu Habib bin Abd al-Rahman, kemudian kaum Berber dan Ibadi dari Kharijites berkuasa."
