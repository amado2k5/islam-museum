summary:
  ar: "أقام عمرو بن معدي كرب في قومه من بني زبيد وعليهم فروة بن مسيك، فلما توفي النبي ارتد وقال بيتين يذم فيهما ملك فروة ويكنّيه أبا عمير؛ ثم أُسر في الردة وعاود الإسلام فيما يرويه ابن حجر عن سيف."
  en: "Amr ibn Ma'dikarib stayed among Banu Zubayd under Farwa ibn Musayk; when the Prophet died he apostatised and said two verses disparaging Farwa's rule, calling him Abu Umayr. He was later captured in the ridda and returned to Islam, as Ibn Hajar reports from Sayf."
