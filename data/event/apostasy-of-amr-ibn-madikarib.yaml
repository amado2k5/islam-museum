id: event/apostasy-of-amr-ibn-madikarib
class: event
kind: defection
label: { ar: "ارتداد عمرو بن معدي كرب بعد وفاة النبي", en: "Amr ibn Ma'dikarib's apostasy after the Prophet's death", es: "La apostasía de Amr ibn Ma'dikarib tras la muerte del Profeta.", fr: "L'apostasie d'Amr ibn Ma'dikarib après la mort du Prophète", ur: "رسول اللہ کی وفات کے بعد عمرو بن معدکریب کا ارتداد", tr: "Peygamberin ölümünden sonra Amr ibn Ma'di Karib'in dinden dönmesi", id: "Kemurtadan Amr ibn Ma'di Karib setelah wafatnya Nabi" }
summary:
  ar: "أقام عمرو بن معدي كرب في قومه من بني زبيد وعليهم فروة بن مسيك، فلما توفي النبي ارتد وقال بيتين يذم فيهما ملك فروة ويكنّيه أبا عمير؛ ثم أُسر في الردة وعاود الإسلام فيما يرويه ابن حجر عن سيف."
  en: "Amr ibn Ma'dikarib stayed among Banu Zubayd under Farwa ibn Musayk; when the Prophet died he apostatised and said two verses disparaging Farwa's rule, calling him Abu Umayr. He was later captured in the ridda and returned to Islam, as Ibn Hajar reports from Sayf."
  es: "Amr ibn Ma'dikarib permaneció entre los Banu Zubayd bajo el mando de Farwa ibn Musayk; tras la muerte del Profeta, apostó y pronunció dos versículos que menospreciaban el gobierno de Farwa, llamándolo Abu Umayr. Posteriormente fue capturado durante la Ridda y regresó al Islam, según relata Ibn Hajar citando a Sayf."
  fr: "Amr ibn Ma'dikarib demeura parmi les Banu Zubayd sous l'autorité de Farwa ibn Musayk. À la mort du Prophète, il apostasia et prononça deux versets dénigrant le règne de Farwa, qu'il qualifia d'Abu Umayr. Il fut ensuite capturé lors de la ridda et se reconvertit à l'islam, comme le rapporte Ibn Hajar d'après Sayf."
  ur: "عمرو بن معدکرب بنو زبید میں فروا بن مسیک کے ماتحت رہے۔ جب رسول اللہ کی وفات ہوئی تو آپ نے مرتد کیا اور فروا کے حکم کی توہین کرنے والی دو آیتیں کہیں اور انہیں ابو عمیر کہا۔ بعد میں اسے ردا میں گرفتار کر لیا گیا اور وہ اسلام میں واپس آ گئے جیسا کہ ابن حجر نے سیف سے نقل کیا ہے۔"
  tr: "Amr ibn Ma'di Karb, Beni Zubayd kabilesinden olan halkıyla birlikte kaldı ve Farwa ibn Musayk onların önderliğindeydi. Peygamber vefat edince, Amr ibn Ma'di Karb dinden döndü ve Farwa'nın krallığını eleştirdiği ve ona Ebu Umeyr dediği iki ayet okudu. Daha sonra dinden döndüğü sırada yakalandı ve İbn Hacer'in Sayf'tan rivayet ettiği üzere İslam'a geri döndü."
  id: "Amr bin Ma'di Karb tinggal bersama kaumnya dari Bani Zubayd, dan Farwa bin Musayk memimpin mereka. Ketika Nabi wafat, beliau murtad dan membacakan dua ayat yang isinya mengkritik kepemimpinan Farwa dan menyebutnya Abu Umayr. Kemudian, Farwa ditangkap selama masa kemurtadan dan kembali memeluk Islam, sebagaimana diriwayatkan oleh Ibnu Hajar dari Sayf."
