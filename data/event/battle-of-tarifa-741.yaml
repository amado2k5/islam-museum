label: { ar: "واقعة طريف وتمحيص المسلمين", en: "Battle of Tarifa and the Testing of the Muslims", fr: "La bataille de Tarifa et l'épreuve des musulmans", es: "La batalla de Tarifa y la prueba a la que se sometieron los musulmanes", ur: "طائفہ کی جنگ اور مسلمانوں کی آزمائش", tr: "Tarife olayı ve Müslümanların incelenmesi", id: "Insiden Tarif dan pengawasan terhadap umat Muslim" }
summary:
  ar: "أجاز السلطان أبو الحسن المريني في أسطوله وخاصته آخر سنة 740هـ ونزل بساحة طريف فوافاه سلطان الأندلس أبو الحجاج يوسف بن السلطان أبي الوليد بعسكر الأندلس فأحاطوا بطريف نطاقاً واحداً ونصبوا عليها الآلات، وجهز الطاغية أسطولاً اعترض به الزقاق فقطع المرافق عن المعسكر وطال ثواهم ففنيت أزودتهم ووهن الظهر، واحتشد الطاغية أمم النصرانية وظاهره البرتغال صاحب أشبونة فجاء معه في قومه، ودسّ إلى طريف جيشاً كميناً دخلوها ليلاً، فلما نشبت الحرب في اليوم التالي برز الجيش الكمين على ظهور المسلمين فاختل مصافهم وارتدوا على أعقابهم، وقتل النصارى النساء اللواتي دافعن عن أنفسهن وخلصوا إلى حظايا السلطان عائشة بنت عمه أبي يحيى بن يعقوب وفاطمة، وكانت هزيمة تمحّصت بها جموع المسلمين وعزّ بها ملك الطاغية على ثغور الأندلس {cite:tarikh-ibn-khaldun-ibar p. 1965-1966}."
  en: "Sultan Abu al-Hasan crossed in late 740 and encamped before Tarifa; Yusuf I of Granada joined him with the Andalus army, they ringed the town and set engines — but the Taghiya's second fleet sealed the Strait, starved the camp, and he mustered the Christian nations with Afonso of Portugal at his side; a hidden force he slipped into Tarifa by night burst on the Muslim rear as battle joined, their lines dissolved, the royal women were taken — Aisha the sultan's cousin and Fatima among them — and the Christian king's power over the Andalus frontier was sealed {cite:tarikh-ibn-khaldun-ibar p. 1965-1966}."
  fr: "Le sultan Abu al-Hasan traversa à la fin de 740 et campa devant Tarifa ; Yusuf Ier de Grenade le rejoignit avec l'armée d'al-Andalus, ils encerclèrent la ville et dressèrent des machines ; mais la seconde flotte du Taghiya ferma le détroit, affama le camp, et il rassembla les nations chrétiennes, avec Alphonse de Portugal à ses côtés ; une force cachée qu'il fit entrer de nuit dans Tarifa surgit sur les arrières musulmans quand la bataille s'engagea, leurs lignes se défirent, les femmes royales furent prises, parmi elles Aïcha, cousine du sultan, et Fatima, et la puissance du roi chrétien sur la frontière d'al-Andalus fut scellée {cite:tarikh-ibn-khaldun-ibar p. 1965-1966}."
  es: "El sultán Abu al-Hasan cruzó a finales del año 740 y acampó frente a Tarifa; Yusuf I de Granada se unió a él con el ejército andalusí, rodearon la ciudad y pusieron en marcha máquinas de guerra, pero la segunda flota de Taghiya selló el estrecho, dejó al campamento sin comida, y él reunió a las naciones cristianas con Afonso de Portugal a su lado; una fuerza oculta que introdujo en Tarifa por la noche irrumpió en la retaguardia musulmana cuando comenzó la batalla, sus líneas se disolvieron, las mujeres de la realeza fueron capturadas —entre ellas Aisha, prima del sultán, y Fátima— y el poder del rey cristiano sobre la frontera andalusí quedó sellado {cite:tarikh-ibn-khaldun-ibar p. 1965-1966}."
  ur: "سلطان ابو الحسن نے 740 کے آخر میں عبور کیا اور طائفہ کے سامنے ڈیرے ڈالے۔ غرناطہ کے یوسف اول نے اندلس کی فوج کے ساتھ اس کے ساتھ شمولیت اختیار کی، انہوں نے شہر کو گھیرے میں لے لیا اور انجن لگائے — لیکن طاغیہ کے دوسرے بحری بیڑے نے آبنائے کو سیل کر دیا، کیمپ کو بھوکا مار دیا، اور اس نے پرتگال کے افونسو کے ساتھ عیسائی قوموں کو اکٹھا کیا۔ ایک چھپی ہوئی طاقت جو وہ رات کے وقت طائفہ میں گھس گئی جب جنگ میں شامل ہو گئے مسلمانوں کے عقب میں پھٹ گئی، ان کی صفیں تحلیل ہو گئیں، شاہی خواتین کو لے لیا گیا - سلطان کی کزن عائشہ اور ان میں فاطمہ بھی - اور اندلس کی سرحد پر عیسائی بادشاہ کے اقتدار پر مہر ثبت کر دی گئی۔ 1965-1966}۔"
  tr: "Hicri 740 yılının sonlarında Sultan Ebu el-Hasan el-Marini, filosu ve maiyetiyle Tarifa'ya çıktı. Orada, Endülüs Sultanı Ebu el-Haccac Yusuf ibn Sultan Ebu el-Valid ordusuyla ona katıldı. Tarifa'yı tek bir kuşatma altına alıp kuşatma makinelerini kurdular. Zalim hükümdar daha sonra dar geçidi kapatan ve kampa giden ikmal yollarını kesen bir filo hazırladı. Kuşatma uzadı, erzakları tükendi ve sırtları zayıfladı. Zalim hükümdar, Lizbon hükümdarı Portekiz'in ordusuyla birlikte gelmesiyle Hristiyan uluslarını bir araya topladı. Gizlice Tarifa'ya bir pusu ordusu gönderdi ve bu ordu gece şehre girdi. Ertesi gün savaş çıktığında, pusu ordusu ortaya çıktı, Müslümanları saflarından çıkardı ve geri çekilmeye zorladı. Hristiyanlar kendilerini savunan ve Sultan'ın cariyeleri, amcası Ebu Yahya ibn Yakub'un kızı Ayşe ve Fatıma'ya kaçan kadınları öldürdüler. Bu, Müslüman güçler için ezici bir yenilgi oldu ve zalim hükümdarın Endülüs sınırlarında hakimiyetini güçlendirdi. {cite:tarikh-ibn-khaldun-ibar s. 1965-1966}"
  id: "Pada akhir tahun 740 H, Sultan Abu al-Hasan al-Marini, bersama armada dan pengawal pribadinya, mendarat di Tarifa. Di sana, ia bergabung dengan Sultan Andalusia Abu al-Hajjaj Yusuf ibn Sultan Abu al-Walid beserta pasukannya. Mereka mengepung Tarifa dalam satu pengepungan dan memasang mesin pengepungan. Sang tiran kemudian menyiapkan armada yang memblokir jalan sempit, memutus pasokan ke perkemahan. Pengepungan mereka berlangsung lama, persediaan mereka habis, dan kekuatan mereka melemah. Sang tiran mengumpulkan bangsa-bangsa Kristen, didukung oleh Portugal, penguasa Lisbon, yang datang dengan pasukannya. Ia secara diam-diam mengirimkan pasukan penyergapan ke Tarifa, yang memasuki kota pada malam hari. Ketika pertempuran pecah keesokan harinya, pasukan penyergapan muncul, mengusir kaum Muslim dari barisan mereka dan memaksa mereka mundur. Orang-orang Kristen membunuh para wanita yang membela diri dan melarikan diri ke selir-selir Sultan, Aisyah, putri pamannya Abu Yahya ibn Yaqub, dan Fatimah. Ini merupakan kekalahan telak bagi pasukan Muslim dan memperkuat cengkeraman tiran di perbatasan Andalusia. {cite:tarikh-ibn-khaldun-ibar p. 1965-1966}."
