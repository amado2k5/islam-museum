summary:
  en: "The assassination of the Jewish poet Ka'b ibn al-Ashraf in Rabi' al-Awwal 3 AH by a band led by Muhammad ibn Maslama, after he incited Quraysh to war and satirized Muslim women."
  ar: "مقتل الشاعر كعب بن الأشرف في حصنه بنواحي المدينة في ربيع الأول 3هـ على يد مفرزة من الأوس بقيادة محمد بن مسلمة، بعد تحريضه قريشاً على قتال المسلمين وتشبيبه بنسائهم."
