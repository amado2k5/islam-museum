perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni sources record that Ka'b ibn al-Ashraf openly broke the covenant of Medina by traveling to Mecca to incite Quraysh to wage war on Muslims, writing abusive satire against Muslim women, and planning treachery.", ar: "تعد الرواية السنية كعب بن الأشرف محارباً نقض العهد جهاراً؛ برحيله إلى مكة وتحريضه قريشاً على الثأر، ونظمه قصائد تهجو النبي وتشتم نساء المسلمين، فكان قتله حكماً عسكرياً مشروعاً على خائن ومحارب." }
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari, source/ibn-hisham-sira]
  - tradition: academic
    id: academic
    summary: { en: "Western historians analyze the assassination as a targeted political strike against a prominent opposition leader whose poetry threatened community morale and coalition stability.", ar: "ينظر المؤرخون الأكاديميون إلى مقتل كعب بوصفه اغتيالاً سياسياً استراتيجياً استهدف زعيم معارضة شاعراً كان يهدد تماسك حلف المدينة ويثير قوى خارجية لغزوها." }
    sources: [source/watt-1956-medina]
