label: { ar: "حلقة حنين بن إسحاق للترجمة", en: "Ḥunayn ibn Isḥāq's translation circle", es: "El círculo de traducción de Ḥunayn ibn Isḥāq", fr: "Le cercle de traduction de Hunayn ibn Isḥāq", ur: "حنین بن اسحاق کا ترجمہ حلقہ", tr: "Huneyn ibn İshak'ın tercüme çevresi", id: "Lingkaran penerjemahan Hunayn ibn Ishaq" }
summary:
  ar: "قام حنين بن إسحاق ومن داره من التراجمة بأعظم حركة نقل عن اليونانية إلى العربية في عهد المأمون ومن بعده، حتى صار بيت الحكمة بهم رأس حركة الترجمة {cite:fihrist-ibn-al-nadim}."
  en: "Ḥunayn ibn Isḥāq and the translators of his circle carried through the greatest rendering of Greek books into Arabic under al-Maʾmūn and after him, making the Bayt al-Ḥikma the head of the translation movement {cite:fihrist-ibn-al-nadim}."
  ur: "حنین ابن اسحاق اور اس کے حلقے کے مترجمین نے مامون اور اس کے بعد کے عہد میں یونانی سے عربی ترجمے کی سب سے بڑی تحریک چلائی اور بیت الحکمہ اس تحریک کا مرکز بنا {cite:fihrist-ibn-al-nadim}."
  es: "Ḥunayn ibn Isḥāq y los traductores de su círculo llevaron a cabo la mayor traducción de libros griegos al árabe bajo al-Maʾmūn y después de él, convirtiendo a la Bayt al-Ḥikma en la cabeza del movimiento de traducción {cite:fihrist-ibn-al-nadim}."
  fr: "Ḥunayn ibn Isḥāq et les traducteurs de son cercle ont réalisé la plus grande traduction de livres grecs en arabe sous al-Maʾmūn et après lui, faisant du Bayt al-Ḥikma le chef de file du mouvement de traduction {cite:fihrist-ibn-al-nadim}."
  tr: "Huneyn ibn İshak ve tercüman ailesi, el-Ma'mun döneminde ve sonrasında Yunancadan Arapçaya en büyük tercüme hareketini gerçekleştirdiler ve bu sayede Bilgelik Evi, tercüme hareketinin başı oldu. {cite:fihrist-ibn-al-nadim}"
  id: "Hunayn ibn Ishaq dan keluarganya yang merupakan penerjemah melakukan gerakan penerjemahan terbesar dari bahasa Yunani ke bahasa Arab selama pemerintahan al-Ma’mun dan setelahnya, hingga Baitul Hikmah menjadi pelopor gerakan penerjemahan karena mereka {cite:fihrist-ibn-al-nadim}."
