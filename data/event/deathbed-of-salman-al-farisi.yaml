id: event/deathbed-of-salman-al-farisi
class: event
kind: death
label:
  ar: احتضار سلمان الفارسي في المدائن وما وُجد في بيته
  en: Deathbed of Salman al-Farisi at al-Mada'in
  ur: مدائن میں سلمان فارسی کا آخری وقت اور ان کے گھر سے ملنے والا سامان
  es: "Lecho de muerte de Salman al-Farisi en al-Mada'in"
  fr: "Lit de mort de Salman al-Farisi à al-Mada'in"
summary:
  ar: "لما حضرت سلمان الفارسي الوفاة بكى، فسأله من حوله وفيهم سعد بن أبي وقاص، فقال إنه لا يبكي جزعاً من الموت ولا حرصاً على الدنيا ولكن النبي عهد إليهم أن يكون بلاغ أحدهم كزاد الراكب وقال وحولي هذه الأساود، وليس حوله إلا إجانة أو جفنة أو مطهرة {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. ولما سأله سعد عهداً قال اذكر الله عند همك وعند حكمك وعند قسمك {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. وطلب صرة المسك التي أصابها يوم فتح جلولاء فمرسها في ماء وأمر بنضحها حول فراشه لزوار ليسوا من الإنس ولا الجان، فلم يمكث بعد ذلك إلا قليلاً حتى قُبض {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. وكان ما وُجد في بيته إكافاً ووطاءً ومتاعاً قُوّم نحو عشرين درهماً، وقيل أربعة عشر درهماً وقيل خمسة عشر ديناراً {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 1 p. 197}. وتوفي بالمدائن في خلافة عثمان، وقيل سنة اثنتين وثلاثين، وقيل ست وثلاثين {cite:siyar-alam-nubala scan vol. 1 p. 412}."
  en: "When death came to Salman al-Farisi he wept; those around him, among them Sa'd ibn Abi Waqqas, asked why, and he said he wept neither in dread of death nor out of longing for the world but because the Prophet had charged them that each one's provision be like a rider's, and added, 'and around me these serpents', when all that lay around him was a basin, a bowl or a water-jug {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. Sa'd asked for a covenant and he said: remember God in your concern, in your judgement and in your giving {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. He asked for the pouch of musk he had taken at the conquest of Jalula', had it dissolved in water and sprinkled around his bed for visitors who were neither human nor jinn, and soon afterwards he died {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. In his house were found a saddle-cloth, a mat and some goods valued at about twenty dirhams; other reports say fourteen dirhams, or fifteen dinars {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 1 p. 197}. He died at al-Mada'in in Uthman's caliphate; reports give the year as 32 or 36 {cite:siyar-alam-nubala scan vol. 1 p. 412}."
  ur: "سلمان فارسی کی وفات کا وقت آیا تو وہ روئے؛ پاس موجود لوگوں، جن میں سعد بن ابی وقاص تھے، نے سبب پوچھا تو کہا کہ نہ موت کی گھبراہٹ سے روتا ہوں نہ دنیا کی حرص سے، بلکہ نبی نے ہم سے عہد لیا تھا کہ ہر ایک کا سامانِ سفر سوار کے توشے جیسا ہو، اور کہا کہ میرے گرد یہ ‘اساود’ ⁦(سانپ)⁩ ہیں، حالانکہ ان کے ارد گرد صرف ایک طشت، پیالہ یا لوٹا تھا {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. سعد نے کوئی عہد مانگا تو کہا: اپنی فکر، اپنے فیصلے اور اپنی تقسیم کے وقت اللہ کو یاد رکھو {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. انھوں نے جلولاء کی فتح میں ملی مشک کی تھیلی منگوائی، پانی میں گھلوائی اور بستر کے گرد چھڑکوائی کہ ملاقاتی نہ انسان ہیں نہ جن، اور اس کے تھوڑی دیر بعد ان کی روح قبض ہو گئی {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. ان کے گھر سے ایک نمدہ، بچھونا اور کچھ سامان نکلا جس کی قیمت تقریباً بیس درہم لگی؛ دوسری روایات میں چودہ درہم یا پندرہ دینار ہیں {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 1 p. 197}. وہ مدائن میں عثمان کی خلافت میں فوت ہوئے؛ سال 32 یا 36 بتایا گیا ہے {cite:siyar-alam-nubala scan vol. 1 p. 412}."
  es: "Cuando la muerte le llegó a Salman al-Farisi, lloró; quienes lo rodeaban, entre ellos Sa'd ibn Abi Waqqas, le preguntaron por qué, y él dijo que no lloraba ni por temor a la muerte ni por anhelo del mundo, sino porque el Profeta les había ordenado que la provisión de cada uno fuera como la de un jinete, y añadió: \"y a mi alrededor estas serpientes\", cuando todo lo que había a su alrededor era una palangana, un cuenco o una jarra de agua {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. Sa'd pidió un pacto y él dijo: recuerda a Dios en tu preocupación, en tu juicio y en tu generosidad {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. Pidió la bolsa de almizcle que había tomado en la conquista de Jalula', la hizo disolver en agua y rociarla alrededor de su cama para los visitantes que no eran ni humanos ni genios, y poco después murió {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. En su casa se encontraron una manta de silla de montar, una estera y algunos bienes valorados en unos veinte dirhams; otros informes dicen catorce dirhams o quince dinares {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 1 p. 197}. Murió en al-Mada'in en el califato de Uthman; los informes dan el año como 32 o 36 {cite:siyar-alam-nubala scan vol. 1 p. 412}."
  fr: "Lorsque Salman al-Farisi mourut, il pleura. Ceux qui l'entouraient, parmi lesquels Sa'd ibn Abi Waqqas, lui demandèrent pourquoi. Il répondit qu'il ne pleurait ni par crainte de la mort ni par nostalgie de ce monde, mais parce que le Prophète leur avait enjoint que leurs provisions soient semblables à celles d'un cavalier, ajoutant: « et autour de moi, ces serpents », alors qu'il n'avait autour de lui qu'un bassin, un bol ou une cruche. Sa'd lui demanda alors de conclure une alliance, et il répondit: « Souviens-toi de Dieu dans tes sollicitudes, dans tes jugements et dans tes dons. » Il demanda la poche de musc qu'il avait emportée lors de la conquête de Jalula', la fit dissoudre dans l'eau et en aspergea son lit pour les visiteurs qui n'étaient ni humains ni djinns, et mourut peu après {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 200}. On trouva dans sa maison une housse de selle, une natte et quelques biens d'une valeur d'environ vingt dirhams; d'autres sources parlent de quatorze dirhams, ou de quinze dinars {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 1 p. 197}. Il mourut à al-Mada'in, sous le califat d'Uthman; les sources indiquent l'année 32 ou 36 {cite:siyar-alam-nubala scan vol. 1 p. 412}."
