summary:
  ar: "بطاقة أولية لثورة العلويين سنة ٧٦٢م، انتفاضة محمد النفس الزكية وأخيه إبراهيم على المنصور؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Alid Revolt of 762, Muhammad al-Nafs al-Zakiyya and his brother Ibrahim's rising against al-Mansur; its sources are not yet checked on the page."
  es: "Boceto de ficha para la revuelta alí de 762, el levantamiento de Muhammad al-Nafs al-Zakiyya y su hermano Ibrahim contra al-Mansur; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la révolte alide de 762, le soulèvement de Muhammad al-Nafs al-Zakiyya et de son frère Ibrahim contre al-Mansur; ses sources ne sont pas encore vérifiées sur la page."
  ur: "762 کی علید بغاوت کے لیے ڈرافٹ کارڈ، محمد النفس الزکیہ اور اس کے بھائی ابراہیم کا المنصور کے خلاف اٹھنا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, 762 yılında gerçekleşen Alevi isyanı, yani Muhammed el-Nafs el-Zakiyye ve kardeşi İbrahim'in el-Mansur'a karşı ayaklanması hakkında ön bilgiler içermektedir; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pemberontakan Alawiyah tahun 762 M, pemberontakan Muhammad al-Nafs al-Zakiyya dan saudaranya Ibrahim melawan al-Mansur; sumber-sumbernya belum ditinjau di halaman ini."
