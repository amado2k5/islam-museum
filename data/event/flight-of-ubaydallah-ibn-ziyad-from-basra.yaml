id: event/flight-of-ubaydallah-ibn-ziyad-from-basra
class: event
kind: other
label:
  ar: خروج عبيد الله بن زياد من البصرة بعد موت يزيد
  en: Ubaydallah ibn Ziyad's flight from Basra after Yazid's death
  ur: یزید کی موت کے بعد عبید اللہ بن زیاد کا بصرہ سے فرار
summary:
  ar: يروي الدينوري أن عبيد الله بن زياد استجار بالأزد بعد موت يزيد، وأن أهل البصرة بقوا تسعة أيام بغير والٍ، ثم خرج إلى الشام فحرّض مروان على طلب الخلافة {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}.
  en: Al-Dinawari reports that after Yazid's death Ubaydallah ibn Ziyad sought the protection of the Azd, that Basra was left nine days without a governor, and that he then went to Syria and urged Marwan to claim the caliphate {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}.
  ur: دینوری روایت کرتے ہیں کہ یزید کی موت کے بعد عبید اللہ بن زیاد نے ازد کی پناہ لی، اہلِ بصرہ نو دن بغیر والی کے رہے، اور پھر وہ شام جا کر مروان کو خلافت کا دعویٰ کرنے پر ابھارا {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}۔
