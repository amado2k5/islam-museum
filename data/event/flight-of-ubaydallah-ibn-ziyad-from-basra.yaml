id: event/flight-of-ubaydallah-ibn-ziyad-from-basra
class: event
kind: other
label:
  ar: خروج عبيد الله بن زياد من البصرة بعد موت يزيد
  en: Ubaydallah ibn Ziyad's flight from Basra after Yazid's death
  ur: یزید کی موت کے بعد عبید اللہ بن زیاد کا بصرہ سے فرار
  es: "La huida de Ubaydallah ibn Ziyad de Basora tras la muerte de Yazid."
  fr: "La fuite d'Ubaydallah ibn Ziyad de Bassora après la mort de Yazid"
  tr: "Ubeydullah ibn Ziyad, Yezid'in ölümünden sonra Basra'dan ayrıldı."
  id: "Ubayd Allah ibn Ziyad meninggalkan Basra setelah kematian Yazid"
summary:
  ar: يروي الدينوري أن عبيد الله بن زياد استجار بالأزد بعد موت يزيد، وأن أهل البصرة بقوا تسعة أيام بغير والٍ، ثم خرج إلى الشام فحرّض مروان على طلب الخلافة {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}.
  en: Al-Dinawari reports that after Yazid's death Ubaydallah ibn Ziyad sought the protection of the Azd, that Basra was left nine days without a governor, and that he then went to Syria and urged Marwan to claim the caliphate {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}.
  ur: دینوری روایت کرتے ہیں کہ یزید کی موت کے بعد عبید اللہ بن زیاد نے ازد کی پناہ لی، اہلِ بصرہ نو دن بغیر والی کے رہے، اور پھر وہ شام جا کر مروان کو خلافت کا دعویٰ کرنے پر ابھارا {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}۔
  es: "Al-Dinawari informa que después de la muerte de Yazid, Ubaydallah ibn Ziyad buscó la protección de Azd, que Basora quedó sin gobernador durante nueve días, y que luego fue a Siria e instó a Marwan a reclamar el califato {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}."
  fr: "Al-Dinawari rapporte qu'après la mort de Yazid, Ubaydallah ibn Ziyad a cherché la protection des Azd, que Bassora est restée neuf jours sans gouverneur, et qu'il est ensuite allé en Syrie et a exhorté Marwan à revendiquer le califat {cite:akhbar-tiwal-amir p. 281} {cite:akhbar-tiwal-amir p. 283} {cite:akhbar-tiwal-amir p. 285}."
  tr: "El-Dinawari rivayet eder ki, Ubeydullah ibn Ziyad, Yezid'in ölümünden sonra Azd kabilesine sığınmış ve Basra halkı dokuz gün boyunca valisiz kalmıştır. Daha sonra Suriye'ye giderek Mervan'ı halifeliği istemeye teşvik etmiştir. {cite:akhbar-tiwal-amir s. 281} {cite:akhbar-tiwal-amir s. 283} {cite:akhbar-tiwal-amir s. 285}"
  id: "Al-Dinawari meriwayatkan bahwa Ubayd Allah ibn Ziyad mencari perlindungan kepada Azd setelah kematian Yazid, dan bahwa penduduk Basra selama sembilan hari tanpa seorang gubernur, kemudian ia pergi ke Suriah dan menghasut Marwan untuk mencari kekhalifahan. {cite:akhbar-tiwal-amir hlm. 281} {cite:akhbar-tiwal-amir hlm. 283} {cite:akhbar-tiwal-amir hlm. 285}."
