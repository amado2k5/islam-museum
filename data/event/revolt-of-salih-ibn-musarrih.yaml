id: event/revolt-of-salih-ibn-musarrih
class: event
kind: revolt
label: { ar: "خروج صالح بن مسرح", en: "The revolt of Salih ibn Musarrih", es: "La revuelta de Salih ibn Musarrih", fr: "La révolte de Salih ibn Musarrih", ur: "صالح بن مسرّح کی بغاوت" }
summary:
  ar: "في سنة ست وسبعين ذكر الطبري خروج صالح بن مسرح التميمي، وكان رجلاً ناسكاً مخبتاً صاحب عبادة، وله أصحاب بدارا وأرض الموصل والجزيرة يقرئهم القرآن {cite:tabari-tarikh-abu-al-fadl j.6 p.216}."
  en: "In 76 al-Tabari records the revolt of Salih ibn Musarrih al-Tamimi, a devout, humble man given to worship, who had followers in Dara and in the land of Mosul and the Jazira, whom he taught the Qur'an {cite:tabari-tarikh-abu-al-fadl j.6 p.216}."
  es: "En el año 76, al-Tabari registra la revuelta de Salih ibn Musarrih al-Tamimi, un hombre devoto y humilde, entregado a la adoración, que tenía seguidores en Dara y en la tierra de Mosul y Jazira, a quienes enseñó el Corán {cite:tabari-tarikh-abu-al-fadl j.6 p.216}."
  fr: "En 76, al-Tabari relate la révolte de Salih ibn Musarrih al-Tamimi, un homme pieux et humble voué au culte, qui avait des disciples à Dara et dans la région de Mossoul et de la Jazira, à qui il enseignait le Coran {cite:tabari-tarikh-abu-al-fadl j.6 p.216}."
  ur: "الطبری نے 76 میں صالح بن مسرریح التمیمی کی بغاوت کو درج کیا ہے، جو عبادت کے لیے دیا گیا ایک متقی، عاجز آدمی تھا، جس کے درعا اور سرزمین موصل اور جزیرہ میں پیروکار تھے، جن کو اس نے قرآن پڑھایا تھا۔"
