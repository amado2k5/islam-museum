  end: { edtf: "0622-09-24", hijri: "0001-03-12", calendar: julian, precision: day, status: tradition, note: "دخول المدينة يوم الجمعة؛ نزل قباء يوم الإثنين 8 ربيع الأول الموافق 23 سبتمبر 622م (الرحيق ص170، 172). The calendar epoch (1 Muharram 1 AH = 16 July 622) was fixed later under Umar." }
