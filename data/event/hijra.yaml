id: event/hijra
class: event
kind: migration
label: { en: The Hijra, ar: الهجرة النبوية }
summary:
  en: The migration of the Prophet Muhammad and his followers from Mecca to Medina in 622 CE, the event from which the Islamic calendar is counted. The Encyclopaedia of Islam links it to the loss of clan protection after the death of Abu Talib and to the agreement made at al-Aqaba during the pilgrimage of 622. Muhammad slipped out of Mecca with Abu Bakr, spent three days in a cave, and reached Quba near Medina, while his followers had already left in small parties.
  ar: هجرة النبي محمد وأصحابه من مكة إلى المدينة سنة 622م، وهي الحدث الذي يبدأ منه التقويم الهجري. وضبط المسعودي تواريخها فكانت سنة اثنتين وثلاثين من ملك كسرى أبرويز وسنة تسع من ملك هرقل وسنة تسعمائة وثلاث وثلاثين من ملك الإسكندر المقدوني، ودخل المدينة يوم الاثنين لاثنتي عشرة ليلة مضت من ربيع الأول {cite:muruj-al-dhahab p. 577}
  ur: نبی محمد اور ان کے پیروکاروں کی 622ء میں مکہ سے مدینہ کی طرف ہجرت، وہ واقعہ جس سے اسلامی کیلنڈر شمار ہوتا ہے۔ انسائیکلوپیڈیا آف اسلام اسے ابو طالب کی وفات کے بعد قبیلے کی حفاظت کے خاتمے اور 622ء کے حج میں عقبہ کے معاہدے سے جوڑتا ہے۔ محمد ابوبکر کے ساتھ چپکے سے مکہ سے نکلے، غار میں تین دن رہے اور مدینہ کے قریب قباء پہنچے، جبکہ ان کے پیروکار پہلے ہی چھوٹی ٹولیوں میں جا چکے تھے۔
