label: { en: The Hijra, ar: الهجرة النبوية }
summary:
  en: The migration of the Prophet Muhammad and his followers from Mecca to Medina in 622 CE, the event from which the Islamic calendar is counted.
  ar: هجرة النبي محمد وأصحابه من مكة إلى المدينة سنة 622م، وهي الحدث الذي يبدأ منه التقويم الهجري. وضبط المسعودي تواريخها فكانت سنة اثنتين وثلاثين من ملك كسرى أبرويز وسنة تسع من ملك هرقل وسنة تسعمائة وثلاث وثلاثين من ملك الإسكندر المقدوني، ودخل المدينة يوم الاثنين لاثنتي عشرة ليلة مضت من ربيع الأول {cite:muruj-al-dhahab p. 577}
