id: event/killing-of-amin
class: event
kind: death
label: { ar: "قتل الأمين", en: "The killing of al-Amin", es: "El asesinato de al-Amin", fr: "Le meurtre d'al-Amin", ur: "الامین کا قتل" }
summary:
  ar: "في سنة ثمان وتسعين ومائة استولى طاهر على بغداد {cite:tabari-tarikh-abu-al-fadl j.8 p.472}، وذكر الطبري قتل محمد الأمين في السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.478}، ووثب الجند بطاهر بعد مقتله بخمسة أيام {cite:tabari-tarikh-abu-al-fadl j.8 p.496}، وعند السيوطي استهلت سنة ثمان وتسعين فدخل طاهر بغداد بالسيف قسراً فخرج الأمين بأمه وأهله إلى مدينة المنصور، وكان في ليلته الأخيرة يشرب مع إبراهيم بن المهدي فغنت جارية اسمها ضعف فتطير من اسمها ثم عثرت في قدح بلور له قيمة فكسرته فقال ما أظن أمري إلا قد قرب وسمع صوتاً من دجلة قضي الأمر الذي فيه تستفتيان فقتل بعد ليلة أو ليلتين أخذ وحبس ثم أدخل عليه قوم من العجم ليلاً فضربوه بالسيف ثم ذبحوه من قفاه وذهبوا برأسه إلى طاهر فنصبها على حائط بستان ونودي هذا رأس المخلوع محمد وجرت جثته بحبل وبعث طاهر بالرأس والبرد والقضيب والمصلى إلى المأمون فاشتد عليه قتل أخيه وكان يحب أن يرسل إليه حياً فحقد ذلك على طاهر إلى أن مات، وكان الأمين كتب إلى طاهر لما انتدب لحربه يا طاهر ما قام لنا منذ قمنا قائم بحقنا فكان جزاؤه عندنا إلا السيف {cite:tarikh-khulafa-minhaj-1434 p. 476-477}، وكتبت أم جعفر إلى المأمون بعد قتله أصبت بأدنى الناس منك قرابة أتى طاهر لا طهر الله طاهراً فبكى المأمون وقال اللهم إني أقول كما قال علي بن أبي طالب لما بلغه قتل عثمان والله ما قتلت ولا أمرت ولا رضيت {cite:muruj-al-dhahab p. 398}"
  en: "In the year 198 Tahir took Baghdad {cite:tabari-tarikh-abu-al-fadl j.8 p.472}. Al-Tabari mentions the killing of Muhammad al-Amin in the same year {cite:tabari-tarikh-abu-al-fadl j.8 p.478}, and reports that the troops turned on Tahir five days after the killing {cite:tabari-tarikh-abu-al-fadl j.8 p.496}. According to al-Suyuti, the year 198 began and Tahir entered Baghdad by force of the sword; al-Amin left with his mother and family for the city of al-Mansur. On his last night he was drinking with Ibrahim ibn al-Mahdi; a slave-girl named Di'f sang, and he took it as an omen from her name; then she stumbled over a valuable crystal cup and broke it. He said: 'I do not think my affair is anything but near,' and he heard a voice from the Tigris: 'The matter about which you two sought a ruling has been decided.' He was killed a night or two later. He was seized and imprisoned; then a group of Persians came in at night and struck him with the sword, then slaughtered him from the nape of the neck, and took his head to Tahir, who had it set on a garden wall while it was proclaimed: 'This is the head of the deposed Muhammad.' His body was dragged with a rope. Tahir sent the head, the mantle, the staff and the prayer rug to al-Ma'mun. Al-Ma'mun was grieved at the killing of his brother; he had wished to have him sent to him alive, and he bore a grudge against Tahir until he died. When al-Amin had written to Tahir, as he was appointed to fight him, 'O Tahir, no one has stood up for our right since we rose, and his reward from us is nothing but the sword' {cite:tarikh-khulafa-minhaj-1434 p. 476-477}. After the killing, Umm Ja'far wrote to al-Ma'mun: 'You were struck by the most distant of people kin to you; Tahir did it; may God not purify Tahir.' Al-Ma'mun wept and said: 'O God, I say what Ali ibn Abi Talib said when news reached him of the killing of Uthman: by God, I neither killed nor ordered nor approved' {cite:muruj-al-dhahab p. 398}."
  es: "En el año 198 Tahir tomó Bagdad {cite:tabari-tarikh-abu-al-fadl j.8 p.472}. Al-Tabari menciona el asesinato de Muhammad al-Amin en el mismo año {cite:tabari-tarikh-abu-al-fadl j.8 p.478}, e informa que las tropas se volvieron contra Tahir cinco días después del asesinato {cite:tabari-tarikh-abu-al-fadl j.8 p.496}. Según al-Suyuti, el año 198 comenzó y Tahir entró en Bagdad por la fuerza de la espada; al-Amin partió con su madre y su familia hacia la ciudad de al-Mansur. En su última noche estaba bebiendo con Ibrahim ibn al-Mahdi; una esclava llamada Di'f cantó, y él lo tomó como un presagio por su nombre; luego ella tropezó con una valiosa copa de cristal y la rompió. Dijo: «No creo que mi asunto esté lejos de resolverse», y oyó una voz del Tigris: «El asunto sobre el que ambos buscaban un dictamen ha sido resuelto». Murió una o dos noches después. Fue apresado y encarcelado; entonces, un grupo de persas llegó de noche y lo apuñaló con la espada, luego lo degolló desde la nuca y llevó su cabeza a Tahir, quien la hizo colocar en el muro de un jardín mientras se proclamaba: «Esta es la cabeza del depuesto Mahoma». Su cuerpo fue arrastrado con una cuerda. Tahir envió la cabeza, el manto, el bastón y la alfombra de oración a al-Ma'mun. Al-Ma'mun se afligió por la muerte de su hermano; había deseado que se lo enviaran con vida y guardó rencor a Tahir hasta su muerte. Cuando al-Amin le escribió a Tahir, ya que le habían encomendado la tarea de luchar contra él: «Oh Tahir, nadie ha defendido nuestro derecho desde que nos alzamos, y su recompensa de nuestra parte no es más que la espada» {cite:tarikh-khulafa-minhaj-1434 p. 476-477}. Después del asesinato, Umm Ja'far le escribió a al-Ma'mun: «Fuiste atacado por el más lejano de tus parientes; Tahir lo hizo; que Dios no purifique a Tahir». Al-Ma'mun lloró y dijo: «Oh Dios, digo lo que dijo Ali ibn Abi Talib cuando le llegó la noticia del asesinato de Uthman: por Dios, ni maté, ni ordené, ni aprobé» {cite:muruj-al-dhahab p. 398}."
  fr: "En l'an 198, Tahir prit Bagdad (cf. Tabari-tarikh-abu-al-fadl j.8 p.472). Al-Tabari mentionne la mort de Muhammad al-Amin la même année (cf. Tabari-tarikh-abu-al-fadl j.8 p.478) et rapporte que les troupes se retournèrent contre Tahir cinq jours après ce meurtre (cf. Tabari-tarikh-abu-al-fadl j.8 p.496). Selon al-Suyuti, l'année 198 commença et Tahir entra dans Bagdad par la force des armes; al-Amin partit avec sa mère et sa famille pour la ville d'al-Mansur. Lors de sa dernière nuit, il buvait avec Ibrahim ibn al-Mahdi; une esclave nommée Di'f chanta, et il interpréta cela comme un présage de son nom; elle trébucha alors sur une précieuse coupe de cristal et la brisa. Il dit: « Je ne pense pas que mon sort soit loin », et il entendit une voix venant du Tigre: « La question sur laquelle vous sollicitiez une décision a été tranchée. » Il fut tué une nuit ou deux plus tard. Il fut arrêté et emprisonné; puis, de nuit, un groupe de Perses fit irruption et le frappa d'un coup d'épée, puis l'égorgea et apporta sa tête à Tahir, qui la fit déposer sur un mur de jardin en proclamant: « Voici la tête du déchu Muhammad. » Son corps fut traîné à la corde. Tahir envoya la tête, le manteau, le bâton et le tapis de prière à al-Ma'mun. Al-Ma'mun fut affligé par la mort de son frère; il avait souhaité le recevoir vivant et il garda rancune à Tahir jusqu'à sa mort. Lorsqu'al-Amin écrivit à Tahir, désigné pour le combattre: « Ô Tahir, nul n'a défendu notre cause depuis notre soulèvement, et sa seule récompense sera l'épée » (voir: Tarikh-Khulafa-Minhaj-1434, p. 476-477). Après le meurtre, Umm Ja'far écrivit à al-Ma'mun: « Tu as été frappé par le plus éloigné de tes proches parents; c'est Tahir qui l'a fait; que Dieu ne le purifie pas ! » Al-Ma'mun pleura et dit: « Ô Dieu, je répète ce qu'Ali ibn Abi Talib a dit lorsqu'il apprit le meurtre d'Uthman: par Dieu, je n'ai ni tué, ni ordonné, ni approuvé » (voir: Muruj-Al-Dhahab, p. 398)."
  ur: "سال 198 میں طاہر نے بغداد لے لیا {حوالہ: طبری-تاریخ-ابو الفضل ج8 ص472}۔ الطبری نے اسی سال محمد الامین کے قتل کا ذکر کیا ہے {حوالہ:طبری-تاریخ-ابو الفضل ج.8 ص.478}، اور رپورٹ کرتا ہے کہ فوج نے طاہر کو قتل کرنے کے پانچ دن بعد تبدیل کر دیا {حوالہ:طبری-تاریخ-ابو الفضل ج.8 ص.496}۔ السیوطی کے مطابق، سال 198 شروع ہوا اور طاہر تلوار کے زور پر بغداد میں داخل ہوا۔ الامین اپنی ماں اور خاندان کے ساتھ المنصور شہر کے لیے روانہ ہوا۔ اپنی آخری رات وہ ابراہیم بن المہدی کے ساتھ شراب پی رہے تھے۔ دیف نامی ایک لونڈی نے گایا، اور اس نے اسے اپنے نام سے شگون کے طور پر لیا۔ پھر اس نے ایک قیمتی کرسٹل کپ سے ٹھوکر کھائی اور اسے توڑ دیا۔ اس نے کہا: 'میں نہیں سمجھتا کہ میرا معاملہ قریب ہے،' اور اس نے دجلہ سے آواز سنی: 'تم دونوں نے جس بات کا فیصلہ کیا تھا اس کا فیصلہ ہو چکا ہے۔' اسے ایک یا دو رات بعد قتل کر دیا گیا۔ اسے پکڑ کر قید کر دیا گیا۔ پھر رات کو فارسیوں کا ایک گروہ آیا اور اسے تلوار سے مارا، پھر اس کی گردن سے ذبح کر کے اس کا سر طاہر کے پاس لے گیا، جس نے اسے باغ کی دیوار پر لگا رکھا تھا جب کہ یہ اعلان کیا گیا تھا: 'یہ معزول محمد کا سر ہے۔' اس کی لاش کو رسی سے گھسیٹا گیا تھا۔ طاہر نے سر، چادر، لاٹھی اور نمازی قالین المامون کو بھیج دیا۔ المامون اپنے بھائی کے قتل پر غمزدہ تھا۔ اس کی خواہش تھی کہ وہ اسے زندہ اپنے پاس بھیجے، اور اس نے طاہر سے اس وقت تک نفرت کی جب تک وہ مر گیا۔ جب الامین نے طاہر کو لکھا تھا کہ وہ اس سے لڑنے کے لیے مقرر کیا گیا تھا کہ اے طاہر جب سے ہم اٹھے ہیں کوئی ہمارے حق کے لیے کھڑا نہیں ہوا اور اس کا صلہ ہم سے تلوار کے سوا کچھ نہیں ہے۔ 476-477}۔ قتل کے بعد ام جعفر نے المامون کو لکھا: 'آپ کو آپ کے قریبی رشتہ داروں نے مارا ہے۔ طاہر نے کیا خدا طاہر کو پاک نہ کرے۔ مامون نے روتے ہوئے کہا: اے خدا، میں وہی کہتا ہوں جو علی ابن ابی طالب نے کہا جب انہیں عثمان کے قتل کی خبر پہنچی: خدا کی قسم میں نے نہ قتل کیا، نہ حکم دیا اور نہ ہی منظور کیا۔ 398}۔"
