label: { ar: "قتل الأمين", en: "The killing of al-Amin" }
summary:
  ar: "في سنة ثمان وتسعين ومائة استولى طاهر على بغداد {cite:tabari-tarikh-abu-al-fadl j.8 p.472}، وذكر الطبري قتل محمد الأمين في السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.478}، ووثب الجند بطاهر بعد مقتله بخمسة أيام {cite:tabari-tarikh-abu-al-fadl j.8 p.496}، وعند السيوطي استهلت سنة ثمان وتسعين فدخل طاهر بغداد بالسيف قسراً فخرج الأمين بأمه وأهله إلى مدينة المنصور، وكان في ليلته الأخيرة يشرب مع إبراهيم بن المهدي فغنت جارية اسمها ضعف فتطير من اسمها ثم عثرت في قدح بلور له قيمة فكسرته فقال ما أظن أمري إلا قد قرب وسمع صوتاً من دجلة قضي الأمر الذي فيه تستفتيان فقتل بعد ليلة أو ليلتين أخذ وحبس ثم أدخل عليه قوم من العجم ليلاً فضربوه بالسيف ثم ذبحوه من قفاه وذهبوا برأسه إلى طاهر فنصبها على حائط بستان ونودي هذا رأس المخلوع محمد وجرت جثته بحبل وبعث طاهر بالرأس والبرد والقضيب والمصلى إلى المأمون فاشتد عليه قتل أخيه وكان يحب أن يرسل إليه حياً فحقد ذلك على طاهر إلى أن مات، وكان الأمين كتب إلى طاهر لما انتدب لحربه يا طاهر ما قام لنا منذ قمنا قائم بحقنا فكان جزاؤه عندنا إلا السيف {cite:tarikh-khulafa-minhaj-1434 p. 476-477}، وكتبت أم جعفر إلى المأمون بعد قتله أصبت بأدنى الناس منك قرابة أتى طاهر لا طهر الله طاهراً فبكى المأمون وقال اللهم إني أقول كما قال علي بن أبي طالب لما بلغه قتل عثمان والله ما قتلت ولا أمرت ولا رضيت {cite:muruj-al-dhahab p. 398}"
  en: "In the year 198 Tahir took Baghdad {cite:tabari-tarikh-abu-al-fadl j.8 p.472}. Al-Tabari mentions the killing of Muhammad al-Amin in the same year {cite:tabari-tarikh-abu-al-fadl j.8 p.478}, and reports that the troops turned on Tahir five days after the killing {cite:tabari-tarikh-abu-al-fadl j.8 p.496}. According to al-Suyuti, the year 198 began and Tahir entered Baghdad by force of the sword; al-Amin left with his mother and family for the city of al-Mansur. On his last night he was drinking with Ibrahim ibn al-Mahdi; a slave-girl named Di'f sang, and he took it as an omen from her name; then she stumbled over a valuable crystal cup and broke it. He said: 'I do not think my affair is anything but near,' and he heard a voice from the Tigris: 'The matter about which you two sought a ruling has been decided.' He was killed a night or two later. He was seized and imprisoned; then a group of Persians came in at night and struck him with the sword, then slaughtered him from the nape of the neck, and took his head to Tahir, who had it set on a garden wall while it was proclaimed: 'This is the head of the deposed Muhammad.' His body was dragged with a rope. Tahir sent the head, the mantle, the staff and the prayer rug to al-Ma'mun. Al-Ma'mun was grieved at the killing of his brother; he had wished to have him sent to him alive, and he bore a grudge against Tahir until he died. When al-Amin had written to Tahir, as he was appointed to fight him, 'O Tahir, no one has stood up for our right since we rose, and his reward from us is nothing but the sword' {cite:tarikh-khulafa-minhaj-1434 p. 476-477}. After the killing, Umm Ja'far wrote to al-Ma'mun: 'You were struck by the most distant of people kin to you; Tahir did it; may God not purify Tahir.' Al-Ma'mun wept and said: 'O God, I say what Ali ibn Abi Talib said when news reached him of the killing of Uthman: by God, I neither killed nor ordered nor approved' {cite:muruj-al-dhahab p. 398}."
