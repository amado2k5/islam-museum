label: { ar: "قتل الأمين، وعند السيوطي استهلت سنة ثمان وتسعين فدخل طاهر بغداد بالسيف قسراً فخرج الأمين بأمه وأهله إلى مدينة المنصور، وكان في ليلته الأخيرة يشرب مع إبراهيم بن المهدي فغنت جارية اسمها ضعف فتطير من اسمها ثم عثرت في قدح بلور له قيمة فكسرته فقال ما أظن أمري إلا قد قرب وسمع صوتاً من دجلة قضي الأمر الذي فيه تستفتيان فقتل بعد ليلة أو ليلتين أخذ وحبس ثم أدخل عليه قوم من العجم ليلاً فضربوه بالسيف ثم ذبحوه من قفاه وذهبوا برأسه إلى طاهر فنصبها على حائط بستان ونودي هذا رأس المخلوع محمد وجرت جثته بحبل وبعث طاهر بالرأس والبرد والقضيب والمصلى إلى المأمون فاشتد عليه قتل أخيه وكان يحب أن يرسل إليه حياً فحقد ذلك على طاهر إلى أن مات، وكان الأمين كتب إلى طاهر لما انتدب لحربه يا طاهر ما قام لنا منذ قمنا قائم بحقنا فكان جزاؤه عندنا إلا السيف {cite:tarikh-khulafa-minhaj-1434 p. 476-477}" }
summary:
  ar: "في سنة ثمان وتسعين ومائة استولى طاهر على بغداد {cite:tabari-tarikh-abu-al-fadl j.8 p.472}، وذكر الطبري قتل محمد الأمين في السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.478}، ووثب الجند بطاهر بعد مقتله بخمسة أيام {cite:tabari-tarikh-abu-al-fadl j.8 p.496}."
