summary:
  ar: "في أواخر سنة 1353م عاد ابن بطوطة إلى المغرب، وأملى بطلب من السلطان ذكرياته على الكاتب ابن جزي، فكانت كتاب الرحلة. {cite:britannica-ibn-battuta}"
  en: "Towards the end of 1353 Ibn Battuta returned to Morocco and, at the sultan's request, dictated his memories to the writer Ibn Juzayy; they became the Rihla."
  ur: "1353ء کے آخر میں ابن بطوطہ مراکش لوٹے اور سلطان کی فرمائش پر اپنی یادیں کاتب ابن جزی کو املا کرائیں، جو سفرنامہ ⁦(رحلہ)⁩ بنیں۔"
  es: "Hacia finales de 1353, Ibn Battuta regresó a Marruecos y, a petición del sultán, dictó sus memorias al escritor Ibn Juzayy; estas se convirtieron en la Rihla."
  fr: "Vers la fin de l'année 1353, Ibn Battuta retourna au Maroc et, à la demande du sultan, dicta ses mémoires à l'écrivain Ibn Juzayy; celles-ci devinrent la Rihla."
  tr: "1353 yılının sonlarında İbn Battuta Fas'a döndü ve Sultan'ın isteği üzerine anılarını kâtip İbn Cuzay'a dikte ettirdi; bu da onun seyahatnamesine yol açtı. {cite:britannica-ibn-battuta}"
  id: "Pada akhir tahun 1353 M, Ibn Battuta kembali ke Maroko dan, atas permintaan Sultan, mendiktekan memoarnya kepada juru tulis Ibn Juzayy, yang menghasilkan catatan perjalanannya. {cite:britannica-ibn-battuta}"
