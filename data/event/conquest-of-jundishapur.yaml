summary:
  ar: "مصالحة جنديسابور: سار المسلمون عن السوس فنزلوا بجنديسابور وكان زِرّ بن عبد الله محاصرًا أهلها، وانضم إليه المقترب بن ربيعة بعد مسير أبي موسى إلى البصرة فصالحوه {cite:kamil-ibn-al-athir p. 372}."
  en: "Jundishapur capitulated to Zirr ibn 'Abdallah, joined after Sus by al-Muqtarib ibn Rabi'a — the city that held out through the whole Khuzestan campaign accepted terms {cite:kamil-ibn-al-athir p. 372}."
  es: "Jundishapur capituló ante Zirr ibn 'Abdallah, al que se unió después de Sus al-Muqtarib ibn Rabi'a; la ciudad que resistió durante toda la campaña de Khuzestán aceptó los términos {cite:kamil-ibn-al-athir p. 372}."
  fr: "Jundishapur capitula devant Zirr ibn 'Abdallah, rejointe après Sus par al-Muqtarib ibn Rabi'a — la ville qui a résisté tout au long de la campagne du Khuzestan a accepté les conditions {cite:kamil-ibn-al-athir p. 372}."
  ur: "جندیشا پور نے زر بن عبداللہ کے حوالے کر دیا، المختارب ابن ربیعہ کے ذریعہ سوس کے بعد شامل ہوا - وہ شہر جس نے خوزستان کی پوری مہم کے دوران اپنی شرائط کو قبول کیا {حوالہ: کامل ابن الاثیر صفحہ 372}۔"
  tr: "Cundişapur'un uzlaşması: Müslümanlar Susa'dan yürüyerek Cundişapur'a yerleştiler ve Zirr ibn Abdullah halkı kuşatma altındaydı. Ebu Musa'nın Basra'ya yürümesinden sonra El-Muktarib ibn Rabi'ah ona katıldı ve onunla barıştılar. {Kaynak: Kamil ibn el-Athir s. 372}"
  id: "Rekonsiliasi Jundishapur: Kaum Muslimin berbaris dari Susa dan menetap di Jundishapur, dan Zirr ibn Abdullah mengepung penduduknya. Al-Muqtarib ibn Rabi’ah bergabung dengannya setelah Abu Musa berbaris ke Basra, dan mereka berdamai dengannya. {cite:kamil-ibn-al-athir p. 372}."
