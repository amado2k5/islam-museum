id: event/ibn-rajab-death-795
class: event
kind: other
label:
  ar: "وفاة ابن رجب بدمشق ودفنه بمقبرة الباب الصغير، رجب أو رمضان ٧٩٥هـ"
  en: "Death of Ibn Rajab in Damascus and burial at Bab al-Saghir cemetery, Rajab or Ramadan 795"
  ur: "دمشق میں ابن رجب کی وفات اور باب الصغیر میں تدفین، رجب یا رمضان 795ھ"
  es: "Muerte de Ibn Rajab en Damasco y sepultura en el cementerio de Bab al-Saghir, Rajab o Ramadán de 795."
  fr: "Décès d'Ibn Rajab à Damas et inhumation au cimetière de Bab al-Saghir, Rajab ou Ramadan 795"
  tr: "İbn Receb Şam'da vefat etti ve Hicri 795 yılının Receb veya Ramazan ayında Bab el-Sağrir mezarlığına defnedildi."
  id: "Ibn Rajab wafat di Damaskus dan dimakamkan di pemakaman Bab al-Saghir, pada bulan Rajab atau Ramadan 795 H."
summary:
  ar: "توفي ابن رجب بدمشق سنة ٧٩٥هـ بلا خلاف في العام، واختلفوا في الشهر: رمضان عند السخاوي وابن العماد، ورجب عند ابن حجر والسيوطي، وتوقف أبو المحاسن الدمشقي بينهما؛ ودفن بمقبرة الباب الصغير جوار قبر الشيخ أبي الفرج عبد الواحد الشيرازي المقدسي ⁦(ت ٤٨٦هـ)⁩، وروى ابن ناصر الدين أن حفار قبره لقيه قبل موته بأيام فحفر له لحداً في تلك البقعة فنزل فيه فأعجبه {cite:ibn-rajab-jami-ulum-hikam p. 9} {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:durar-kamina-jil-1993 2/322}."
  en: "Ibn Rajab died in Damascus in 795, with no disagreement over the year; the sources differ on the month — Ramadan for al-Sakhawi and Ibn al-Imad, Rajab for Ibn Hajar and al-Suyuti, while Abu al-Mahasin al-Dimashqi hesitated between them. He was buried at Bab al-Saghir cemetery beside the grave of the shaykh Abu al-Faraj Abd al-Wahid al-Shirazi al-Maqdisi (d. 486). Ibn Nasir al-Din relates that the gravedigger met him days before his death, dug his niche on that very spot, and Ibn Rajab lay down in it and approved {cite:ibn-rajab-jami-ulum-hikam p. 9} {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:durar-kamina-jil-1993 2/322}."
  ur: "ابن رجب 795ھ میں دمشق میں فوت ہوئے، اس سال پر کوئی اختلاف نہیں؛ مہینے میں اختلاف ہے — سخاوی اور ابن العماد کے نزدیک رمضان، ابن حجر اور سیوطی کے نزدیک رجب، جب کہ ابو المحاسن دمشقی دونوں میں متوقف رہے۔ وہ باب الصغیر کے قبرستان میں شیخ ابو الفرج عبد الواحد شیرازی مقدسی ⁦(وفات 486ھ)⁩ کی قبر کے پاس دفن ہوئے۔ ابن ناصر الدین روایت کرتے ہیں کہ قبر کھودنے والا ان سے موت سے چند دن پہلے ملا، اسی جگہ لحد کھودا اور ابن رجب اس میں لیٹ کر اسے پسند آیا {cite:ibn-rajab-jami-ulum-hikam p. 9} {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:durar-kamina-jil-1993 2/322}۔"
  es: "Ibn Rajab murió en Damasco en 795, sin desacuerdo sobre el año; las fuentes difieren en el mes: Ramadán para al-Sakhawi e Ibn al-Imad, Rajab para Ibn Hajar y al-Suyuti, mientras que Abu al-Mahasin al-Dimashqi dudó entre ellos. Fue enterrado en el cementerio de Bab al-Saghir junto a la tumba del shaykh Abu al-Faraj Abd al-Wahid al-Shirazi al-Maqdisi (m. 486). Ibn Nasir al-Din relata que el sepulturero lo encontró días antes de su muerte, cavó su nicho en ese mismo lugar, e Ibn Rajab se acostó en él y lo aprobó {cite:ibn-rajab-jami-ulum-hikam p. 9} {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cita:durar-kamina-jil-1993 2/322}."
  fr: "Ibn Rajab mourut à Damas en 795, l'année faisant consensus; les sources divergent quant au mois: Ramadan pour al-Sakhawi et Ibn al-Imad, Rajab pour Ibn Hajar et al-Suyuti, tandis qu'Abu al-Mahasin al-Dimashqi hésitait entre les deux. Il fut inhumé au cimetière de Bab al-Saghir, près de la tombe du cheikh Abu al-Faraj Abd al-Wahid al-Shirazi al-Maqdisi (mort en 486). Ibn Nasir al-Din rapporte que le fossoyeur le rencontra quelques jours avant sa mort, creusa sa niche à cet endroit précis, et qu'Ibn Rajab s'y allongea et l'approuva."
  tr: "İbn Receb, Hicri 795 yılında Şam'da vefat etmiştir. Yıl konusunda ihtilaf yoktur, ancak ay konusunda görüş ayrılığı vardır: Sakhavi ve İbn İmad'a göre Ramazan, İbn Hacer ve Suyuti'ye göre Receb; Ebu el-Mahasin el-Dimaşki ise aralarında kararsızdır. İbn Receb, Şeyh Ebu el-Faraj Abd el-Vahid el-Şirazi el-Makdisi'nin (ö. Hicri 486) mezarının yanındaki Bab el-Sağrir mezarlığına defnedilmiştir. İbn Nasır el-Din rivayet eder ki, mezar kazıcısı ölümünden birkaç gün önce onunla görüşmüş ve o noktada onun için bir niş kazmıştır. İbn Receb nişine inmiş ve orayı beğenmiştir. {cite:ibn-rajab-jami-ulum-hikam s. 9} {cite:encyclopaedia-of-islam-2 cilt 3 s. 934} {alıntı:durar-kamina-jil-1993 2/322}."
  id: "Ibn Rajab wafat di Damaskus pada tahun 795 H, tanpa perselisihan mengenai tahunnya, tetapi mereka berbeda pendapat mengenai bulannya: Ramadan menurut al-Sakhawi dan Ibn al-Imad, dan Rajab menurut Ibn Hajar dan al-Suyuti, dan Abu al-Mahasin al-Dimashqi tidak yakin di antara mereka; dan beliau dimakamkan di pemakaman Bab al-Saghir di sebelah makam Syekh Abu al-Faraj Abd al-Wahid al-Shirazi al-Maqdisi (wafat 486 H). Ibn Nasir al-Din meriwayatkan bahwa penggali kuburnya bertemu dengannya beberapa hari sebelum kematiannya dan menggali sebuah ceruk untuknya di tempat itu, dan beliau masuk ke dalamnya dan menyukainya. {cite:ibn-rajab-jami-ulum-hikam p. 9} {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {kutip:durar-kamina-jil-1993 2/322}."
