label: { ar: "وصايا النبي في مرض وفاته", en: "The Prophet's last counsels in his final illness", ur: "مرضِ وفات میں نبی کی آخری وصیتیں", es: "Los últimos consejos del Profeta en su enfermedad final.", fr: "Les derniers conseils du Prophète dans sa maladie finale", tr: "Peygamberin son hastalığı sırasındaki son dilekleri.", id: "Wasiat terakhir Nabi saat sakit parah." }
summary:
  ar: "تروي كتب الحديث والتاريخ عن النبي في مرضه الأخير وصايا قصيرة متفرقة عند رواة مختلفين: الصلاة وما ملكت الأيمان عن أنس وأم سلمة وعلي {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}، وثلاث وصايا يوم الخميس رواها ابن عباس هي إخراج المشركين من جزيرة العرب وإجازة الوفد، وسكت الراوي عن الثالثة أو نسيها {cite:fath-al-bari scan vol. 3 p. 132}، وقوله «لا يبقين دينان بأرض العرب» في مرسل عمر بن عبد العزيز عند مالك {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}، والأمر بحسن الظن بالله عن جابر قبل موته بثلاث {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}، وما أسرّه إلى فاطمة من الاستعداد للقاء ربه ووصيتها بالتقوى والصبر {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}."
  en: "The books of hadith and history report short, scattered counsels of the Prophet in his last illness, each from a different narrator: prayer and those whom one's right hand possesses, from Anas, Umm Salama and Ali {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}; the three counsels of the Thursday, reported by Ibn Abbas, to expel the polytheists from the Arabian Peninsula and to reward the delegations, the third being passed over in silence or forgotten by the narrator {cite:fath-al-bari scan vol. 3 p. 132}; the saying that two religions must not remain in the land of the Arabs, in the mursal report of Umar ibn Abd al-Aziz in Malik's Muwatta {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; the command to think well of God, from Jabir, three days before his death {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; and what he confided to Fatima, a word of his approaching meeting with his Lord and a charge to fear God and be patient {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}."
  ur: "حدیث اور تاریخ کی کتابیں نبی کی آخری بیماری کی مختصر اور بکھری ہوئی وصیتیں مختلف راویوں سے نقل کرتی ہیں: نماز اور ماتحتوں کے بارے میں، انس، ام سلمہ اور علی سے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}؛ جمعرات کی تین وصیتیں جو ابن عباس نے روایت کیں، یعنی مشرکوں کو جزیرۂ عرب سے نکالنا اور وفود کو انعام دینا، اور تیسری پر راوی خاموش رہا یا بھول گیا {cite:fath-al-bari scan vol. 3 p. 132}؛ یہ بات کہ عرب کی سرزمین میں دو دین باقی نہ رہیں، عمر بن عبد العزیز کی مرسل روایت میں جو موطا مالک میں ہے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}؛ اللہ سے حسنِ ظن کی تلقین، جابر کی روایت میں وفات سے تین دن پہلے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}؛ اور وہ بات جو آپ نے فاطمہ کے کان میں کہی، یعنی اپنے رب سے ملاقات کے قریب ہونے کی خبر اور تقویٰ و صبر کی نصیحت {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}۔"
  es: "Los libros de hadices e historia informan consejos breves y dispersos del Profeta en su última enfermedad, cada uno de un narrador diferente: la oración y aquellos a quienes uno posee la mano derecha, de Anas, Umm Salama y Ali {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}; los tres consejos del jueves, informados por Ibn Abbas, para expulsar a los politeístas de la Península Arábiga y recompensar a las delegaciones, el tercero siendo pasado por alto en silencio u olvidado por el narrador {cite:fath-al-bari scan vol. 3 p. 132}; el dicho de que dos religiones no deben permanecer en la tierra de los árabes, en el informe mursal de Umar ibn Abd al-Aziz en el Muwatta de Malik {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; el mandato de pensar bien de Dios, de Jabir, tres días antes de su muerte {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; y lo que le confió a Fátima, una palabra de su próximo encuentro con su Señor y un mandato de temer a Dios y ser paciente {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}."
  fr: "Les recueils de hadiths et d'histoire rapportent de courts conseils épars du Prophète lors de sa dernière maladie, chacun provenant d'un narrateur différent: la prière et ceux que l'on possède de la main droite, rapportés par Anas, Umm Salama et Ali {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}; les trois conseils du jeudi, rapportés par Ibn Abbas, d'expulser les polythéistes de la péninsule arabique et de récompenser les délégations, le troisième étant passé sous silence ou oublié par le narrateur {cite:fath-al-bari scan vol. 3 p. 132}; l'adage selon lequel deux religions ne doivent pas subsister au pays des Arabes, dans le hadith mursal d'Umar ibn Abd al-Aziz rapporté dans le Muwatta de Malik {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}. le commandement de penser bien à Dieu, de la part de Jabir, trois jours avant sa mort {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; et ce qu'il a confié à Fatima, une parole de sa rencontre imminente avec son Seigneur et une injonction à craindre Dieu et à être patient {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}."
  tr: "Hadis ve tarih kitapları, Peygamberimizin son hastalığı sırasında farklı ravilerden kısa ve dağınık talimatlar verdiğini rivayet eder: Enes, Ümmü Seleme ve Ali'nin rivayetine göre namaz ve kişinin sağ elinin sahip olduğu (köleler) {al-bidaya-wal-nihaya, cilt 3, s. 263}{al-bidaya-wal-nihaya, cilt 3, s. 264}; İbn Abbas'ın rivayetine göre Perşembe günü üç talimat, yani müşriklerin Arap Yarımadası'ndan kovulması ve heyetlere izin verilmesi, ravi üçüncü talimat hakkında sessiz kalmış veya unutmuştur {fath-al-bari, cilt 3, s. 132}; Malik'in rivayet ettiği Ömer ibn Abdülaziz'in mursal hadisinde geçen, \"Araplar diyarında iki din bir arada kalmayacaktır\" sözü {al-bidaya-wal-nihaya, cilt 3, s. 263}. ve Cabir'in ölümünden üç gün önce Allah hakkında güzel düşüncelere sahip olma emrini vermesi (kaynak: el-bidaya-wal-nihaya, cilt 3, sayfa 263) ve Fatıma'ya Rabbine kavuşmaya hazırlanmak hakkında anlattıklarını ve ona dindar ve sabırlı olması yönündeki tavsiyelerini (kaynak: el-bidaya-wal-nihaya, cilt 3, sayfa 250) içermektedir."
  id: "Kitab-kitab hadits dan sejarah meriwayatkan dari Nabi selama sakit terakhirnya petunjuk-petunjuk singkat dan terpisah dari berbagai perawi: salat dan apa yang dimiliki tangan kanan seseorang (budak) berdasarkan riwayat Anas, Umm Salama, dan Ali {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}; tiga petunjuk pada hari Kamis yang diriwayatkan oleh Ibnu Abbas, yaitu, mengusir kaum musyrik dari Semenanjung Arab dan memberikan izin untuk delegasi, dengan perawi tersebut bungkam tentang yang ketiga atau melupakannya {cite:fath-al-bari scan vol. 3 p. 132}; sabdanya, \"Tidak akan ada dua agama yang tetap ada di negeri Arab,\" dalam hadits mursal Umar ibn Abd al-Aziz yang diriwayatkan oleh Malik {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}; dan perintah untuk mempunyai pikiran baik tentang Tuhan berdasarkan riwayat Jabir tiga hari sebelum kematiannya {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}, dan apa yang dia sampaikan kepada Fatima tentang persiapan bertemu dengan Tuhannya dan nasihatnya kepada Fatima untuk menjadi saleh dan sabar {cite:al-bidaya-wal-nihaya scan vol. 3 p. 250}."
