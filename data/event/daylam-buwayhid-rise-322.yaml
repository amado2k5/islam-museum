id: event/daylam-buwayhid-rise-322
class: event
kind: revolt
label: { ar: "ظهور الديلم واستيلاء علي بن بويه على فارس" }
summary:
  ar: "في سنة اثنتين وعشرين دخل أصحاب مرداويج أصبهان وكان من قواده علي بن بويه فاقتطع مالاً جليلاً فانفرد عن مخدومه ثم التقى هو ومحمد بن ياقوت نائب الخليفة فهزم محمداً واستولى ابن بويه على فارس، وكان بويه فقيراً صعلوكاً يصيد السمك رأى كأنه بال فخرج من ذكره عمود نار فتشعب حتى ملأ الدنيا فعبرت بأن أولاده يملكون الدنيا، وأرسله مرداويج يستخرج له مالاً من الكرخ فاستخرج خمس مئة ألف درهم وأتى همذان ليملكها فغلق أهلها في وجهه الأبواب فقاتلهم وفتحها عنوة وقتل خلقاً ثم صار إلى شيراز، ونام على ظهره فخرجت حية من سقف المجلس فنقضه فخرجت صناديق ملأى ذهباً فأنفقها في جنده، وركب يوماً فساخت قوائم فرسه فحفروه فوجدوا كنزاً، وخرجت خراسان وفارس عن حكم الخلافة {cite:tarikh-khulafa-minhaj-1434 p. 598}."
  en: "In 322 Mardawij's men entered Isfahan; among his captains Ali ibn Buya drew a great sum then broke from his master, beat the caliph's deputy Muhammad ibn Yaqut, and took Fars. Buya had been a poor fisherman who dreamed fire issued from him and filled the world — read as his sons ruling it. Sent by Mardawij to extract money from Karkh he took five hundred thousand dirhams, stormed Hamadhan, moved to Shiraz, and twice uncovered chests of gold — under a snake-cleared ceiling and beneath his horse's hooves. Khurasan and Fars left the caliphate's rule {cite:tarikh-khulafa-minhaj-1434 p. 598}."
