id: "event/al-hadi-enters-sanaa-on-the-wednesday-four-nights-into-jumada-ii-293-ah-with-the-notables-of-yemen-behind-him"
class: event
kind: other
label:
  ar: "الهادي يدخل صنعاء في جمادى الآخرة سنة 293هـ، ومعه آل يعفر والدعام ووجوه اليمن، ص391-392"
  en: "Al-Hadi enters Sanaa in Jumada II 293 AH, with the Al Ya'fur, the Da'am and the notables of Yemen behind him, pp. 391-392"
  ur: "ہادی جمادی الآخرہ 293ھ میں صنعاء میں داخل ہوتا ہے، اس کے ساتھ آل یعفر، دعام اور یمن کے معززین ہیں، ص391-392"
  es: "Al-Hadi entra en Sanaa en Jumada II 293 AH, con Al Ya'fur, Da'am y los notables de Yemen detrás de él, pp. 391-392"
  fr: "Al-Hadi entre à Sanaa en Jumada II 293 AH, avec les Al Ya'fur, les Da'am et les notables du Yémen derrière lui, pp. 391-392"
summary:
  ar: "صار أبو القاسم ابن الهادي إلى صنعاء في جمادى الأولى، ثم خرج الهادي مع وفد أهل صنعاء الذين استنهضوه، فدخل صنعاء يوم الأربعاء لأربع ليال من جمادى الآخرة سنة 293، ومعه آل يعفر والدعام ووجوه اليمن مطيعين له."
  en: "Abu al-Qasim, the son of al-Hadi, reached Sanaa in Jumada I. Then al-Hadi went out with a delegation of the people of Sanaa who had called him to rise, and entered Sanaa on the Wednesday four nights into Jumada II 293 AH, with the Al Ya'fur, the Da'am and the notables of Yemen obeying him."
  ur: "ہادی کا بیٹا ابو القاسم جمادی الاولیٰ میں صنعاء پہنچا، پھر ہادی ان اہل صنعاء کے وفد کے ساتھ نکلا جنہوں نے اسے بلایا تھا، اور جمادی الآخرہ 293ھ کی چار راتوں کے بعد بدھ کو صنعاء میں داخل ہوا، اس کے ساتھ آل یعفر، دعام اور یمن کے معززین اطاعت کرتے ہوئے تھے۔"
  es: "Abu al-Qasim, hijo de al-Hadi, llegó a Sanaa en Jumada I. Entonces al-Hadi salió con una delegación de la gente de Sanaa que lo había llamado a levantarse, y entró en Sanaa el miércoles de la cuarta noche de Jumada II del año 293 AH, con Al Ya'fur, Da'am y los notables de Yemen obedeciéndole."
  fr: "Abou al-Qasim, le fils d'al-Hadi, arriva à Sanaa en Jumada I. Puis al-Hadi sortit avec une délégation des habitants de Sanaa qui l'avaient appelé à se lever, et entra à Sanaa le mercredi quatre nuits de Jumada II 293 AH, avec les Al Ya'fur, les Da'am et les notables du Yémen qui lui obéissaient."
