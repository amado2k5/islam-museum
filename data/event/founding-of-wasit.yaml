summary:
  ar: "عند البلاذري: أحدث الحجاج مدينة واسط في سنة 83 أو سنة 84 وبنى مسجدها وقصرها وقبة الخضراء بها وكانت واسط أرض قصب فسميت واسط القصب وبينها وبين الأهواز والبصرة والكوفة مقدار واحد وقال ابن القرية بناه في غير بلده ويتركها لغير ولده وقال شيخ من أهل واسط إن الحجاج لما فرغ من واسط كتب إلى عبد الملك بن مروان إني اتخذت مدينة في كرش من الأرض بين الجبل والمصرين وسميتها واسطاً فلذلك سمي أهل واسط الكرشيين وكان الحجاج قبل اتخاذه واسطاً أراد تزويل الصين من كسكر فحفر نهر الصين ثم بدا له فأحدث واسطاً فنزلها واحتفر النيل والزابي وسماه زابياً لأخذه من الزابي القديم وأحيا ما على هذين النهرين من الأرضين وأحدث المدينة التي تعرف بالنيل ومصرها وعمد إلى ضياع كان عبد الله بن دراج مولى معاوية استخرجها له أيام ولايته خراج الكوفة مع المغيرة بن شعبة من موات مرفوض ونقوض مياه ومغايص وآجام ضرب عليها المسنيات ثم قلع قصبها فحازها لعبد الملك وعمرها ونقل الحجاج إلى قصره والمسجد الجامع بواسط أبواباً من زنتورد والدوقرة ودار أوساط ودير ماسرجسان وشرابيط فضج أهل هذه المدن وقالوا قد آثرنا على مدننا وأموالنا فلم يلتفت إلى قولهم."
  en: "In al-Baladhuri: al-Hajjaj founded the city of Wasit in year 83 or 84, building its mosque, palace and Green Dome — it was reed-land, whence 'Wasit al-Qasab', equidistant from al-Ahwaz, Basra and Kufa; Ibn al-Qirriyya quipped 'he built it in a land not his own and will leave it to sons not his own.' A Wasit shaykh related that when finished al-Hajjaj wrote Abd al-Malik: 'I have founded a city in a karsh of land between the mountain and the two garrison towns and named it Wasit' — hence the Wasitis are called al-Karshiyyin. Before founding it he had meant to move al-Sin's people from Kaskar and dug Nahr al-Sin, then reconsidered, founded Wasit, dug the Nil and Zabi canals, revived their lands and founded the city called al-Nil. He seized Abdallah ibn Darraj's estates — reclaimed deadland, stagnant waters, springs and reed-beds marked with milestones under his Kufa kharaj office with al-Mughira — cleared their reeds and took them for Abd al-Malik, cultivating them; and he stripped doors from Zantaward, al-Dawqara, Dar Awsat, Dayr Masarjasan and Sharabit for his palace and Wasit's congregational mosque — those cities protested 'you have preferred us over our own cities and wealth,' and he paid them no heed."
  es: "En al-Baladhuri: al-Hajjaj fundó la ciudad de Wasit en el año 83 o 84, construyendo su mezquita, palacio y la Cúpula Verde; era una tierra de juncos, de donde proviene 'Wasit al-Qasab', equidistante de al-Ahwaz, Basora y Kufa; Ibn al-Qirriyya bromeó: 'la construyó en una tierra que no era suya y la dejará a hijos que no son suyos'. Un jeque de Wasit relató que cuando terminó, al-Hajjaj escribió a Abd al-Malik: 'He fundado una ciudad en un karsh de tierra entre la montaña y las dos ciudades guarnición y la he llamado Wasit'; de ahí que los Wasitis sean llamados al-Karshiyyin. Antes de fundarla, había tenido la intención de trasladar a la gente de al-Sin desde Kaskar y excavó Nahr al-Sin, luego reconsideró, fundó Wasit, excavó los canales Nil y Zabi, recuperó sus tierras y fundó la ciudad llamada al-Nil. Se apoderó de las propiedades de Abdallah ibn Darraj —recuperó tierras baldías, aguas estancadas, manantiales y cañaverales marcados con mojones bajo su oficina de kharaj de Kufa con al-Mughira—, despejó sus cañas y se las llevó a Abd al-Malik, cultivándolas; y despojó las puertas de Zantaward, al-Dawqara, Dar Awsat, Dayr Masarjasan y Sharabit para su palacio y la mezquita congregacional de Wasit —esas ciudades protestaron diciendo \"nos has preferido a nosotras por encima de nuestras propias ciudades y riquezas\", pero él no les prestó atención."
  fr: "Selon al-Baladhuri: al-Hajjaj fonda la ville de Wasit en 83 ou 84, y construisant sa mosquée, son palais et son Dôme Vert. La région était alors une zone de roseaux, d'où le nom « Wasit al-Qasab », à égale distance d'al-Ahwaz, de Bassora et de Koufa. Ibn al-Qirriyya fit remarquer avec ironie: « Il l'a construite sur une terre qui n'était pas la sienne et la laissera à des fils qui ne sont pas les siens. » Un cheikh de Wasit rapporta qu'une fois les travaux terminés, al-Hajjaj écrivit à Abd al-Malik: « J'ai fondé une ville dans un karsh de terre entre la montagne et les deux villes de garnison et je l'ai nommée Wasit »; c'est ainsi que les habitants de Wasit sont appelés al-Karshiyyin. Avant de la fonder, il avait prévu de déplacer les habitants d'al-Sin de Kaskar et de creuser le Nahr al-Sin, puis il se ravisa, fonda Wasit, creusa les canaux du Nil et du Zabi, remit en état leurs terres et fonda la ville appelée al-Nil. Il s'empara des terres d'Abdallah ibn Darraj — terres arides, eaux stagnantes, sources et roselières balisées de bornes milliaires sous son bureau de Kufa kharaj avec al-Mughira — en fit défricher les roseaux et les prit pour Abd al-Malik, les cultivant; et il fit enlever les portes de Zantaward, al-Dawqara, Dar Awsat, Dayr Masarjasan et Sharabit pour son palais et la mosquée de Wasit — ces villes protestèrent: « Tu nous as préférés à nos propres villes et richesses », mais il n'en tint aucun compte."
  ur: "البلادوری میں ہے: الحجاج نے 83 یا 84 میں وصیت شہر کی بنیاد رکھی، اس کی مسجد، محل اور سبز گنبد تعمیر کیا - یہ سرکنڈوں کی سرزمین تھی، جہاں سے 'وصیت القصاب'، جو الاہواز، بصرہ اور کوفہ سے مساوی ہے؛ ابن القریہ نے طنز کیا کہ 'اس نے اسے ایسی زمین میں بنایا جو اپنی نہیں اور اسے اپنے بیٹوں کے لیے چھوڑ دے گا'۔ ایک واسط شیخ نے بیان کیا ہے کہ جب الحجاج نے فارغ کیا تو عبد الملک نے لکھا: میں نے پہاڑ اور دو چوکیوں کے درمیان ایک کرش زمین میں ایک شہر کی بنیاد رکھی اور اس کا نام وصیت رکھا۔ اس کی بنیاد رکھنے سے پہلے اس کا مقصد السین کے لوگوں کو کاسکر سے منتقل کرنا تھا اور نہر السین کو کھودا، پھر دوبارہ غور کیا، واسط کی بنیاد رکھی، نیل اور زبی نہریں کھودیں، اپنی زمینوں کو زندہ کیا اور النیل نامی شہر کی بنیاد رکھی۔ اس نے عبداللہ ابن دراج کی جاگیروں پر قبضہ کر لیا — دوبارہ حاصل شدہ ڈیڈ لینڈ، ٹھہرے ہوئے پانی، چشمے اور سرکنڈوں کے بستر جن پر المغیرہ کے ساتھ اس کے کوفہ خرج کے دفتر کے نیچے سنگ میل کے نشان ہیں — ان کے سرکنڈوں کو صاف کر کے عبد الملک کے لیے لے گئے، ان کی کاشت کرتے ہوئے؛ اور اس نے اپنے محل اور واسط کی اجتماعی مسجد کے لیے زانتوارد، الدوقرہ، دار اوسط، دائر مسرجان اور شرابیت سے دروازے چھین لیے - ان شہروں نے احتجاج کیا کہ 'تم نے ہمیں ہمارے اپنے شہروں اور دولت پر ترجیح دی ہے' اور اس نے ان پر کوئی توجہ نہیں دی۔"
  tr: "El-Baladhuri'ye göre: El-Haccac, Hicri 83 veya 84 yılında Wasit şehrini kurmuş ve camisini, sarayını ve Yeşil Kubbesini inşa ettirmiştir. Wasit, kamışlık bir bölgeydi, bu nedenle adı Wasit el-Kasab (Kamışların Wasiti) idi. Ahvaz, Basra ve Kufe'ye eşit uzaklıktaydı. İbn el-Karya, şehri kendi topraklarının dışında kurduğunu ve kendi oğlundan başka birine bıraktığını söylemiştir. Wasit'ten bir şeyh, El-Haccac'ın Wasit'i inşa etmeyi bitirdiğinde Abdülmalik ibn Mervan'a şöyle yazdığını belirtmiştir: \"Dağlar ve iki şehir arasındaki bir vadide bir şehir kurdum ve ona Wasit adını verdim.\" Bu nedenle Wasit halkına Karaşiyyin denmiştir. Wasit'i kurmadan önce El-Haccac, Kaskar'dan su çekmeyi amaçlamış ve Çin Kanalı'nı kazmıştır. Sonra Wasit'i kurmaya karar verdi, oraya yerleşti ve Nil ile Zabi nehirlerini kazarak, eski Zabi nehrinden su alarak buraya Zabi adını verdi. Bu iki nehir boyunca uzanan toprakları canlandırdı ve Nil olarak bilinen şehri ve başkentini kurdu. Ayrıca, Muaviye'nin azatlı kölesi Abdullah ibn Darraj'ın Kufa valiliği sırasında kendisi için edindiği, sahipsiz topraklardan, su kaynaklarından ve çalılıklardan elde ettiği toprakları, el-Mughira ibn Şuba ile birlikte ele geçirdi ve vergilendirdi. Sonra Mesniyat'ın sazlıklarını söktü, Abdülmalik için ele geçirdi, geliştirdi ve hacıları sarayına ve Wasit'teki Büyük Cami'ye taşıdı; bu cami, Zantourd, El-Duqra, Dar Awsat, Deir Masarjasan ve Şarabit'ten kapıdaydı. Bu şehirlerin halkı şikayet ederek, \"Şehirlerimize ve paramıza göre bize daha fazla ayrıcalık tanıdı\" dediler, ancak o onların sözlerine kulak asmadı."
  id: "Menurut al-Baladhuri: Al-Hajjaj mendirikan kota Wasit pada tahun 83 atau 84 Hijriah, membangun masjid, istana, dan Kubah Hijau. Wasit adalah tanah alang-alang, karena itu namanya, Wasit al-Qasab (Wasit Alang-alang). Letaknya sama jauhnya dari Ahwaz, Basra, dan Kufa. Ibn al-Qarya mengatakan bahwa ia membangunnya di luar tanah miliknya sendiri dan mewariskannya kepada orang lain selain putranya sendiri. Seorang syekh dari Wasit mengatakan bahwa ketika al-Hajjaj selesai membangun Wasit, ia menulis kepada Abd al-Malik ibn Marwan, \"Aku telah mendirikan sebuah kota di lembah antara pegunungan dan dua kota, dan aku menamainya Wasit.\" Oleh karena itu, penduduk Wasit disebut Karashiyyin. Sebelum mendirikan Wasit, al-Hajjaj bermaksud untuk mengalihkan air dari Kaskar, sehingga ia menggali Terusan Cina. Kemudian ia memutuskan untuk mendirikan Wasit, menetap di sana dan menggali Sungai Nil dan Zabi, menamainya Zabi setelah mengambil air dari Zabi lama. Ia menghidupkan kembali tanah di sepanjang kedua sungai ini dan mendirikan kota yang dikenal sebagai Nil dan ibu kotanya. Ia juga mengambil alih tanah yang telah diperoleh Abdullah ibn Darraj, seorang budak yang dibebaskan oleh Muawiyah, untuknya selama masa pemerintahannya di Kufa, bersama dengan al-Mughira ibn Shu'ba, dari tanah tak bertuan, lubang air, dan semak belukar, dan ia memungut pajak dari mereka. Al-Masniyat, kemudian ia mencabut alang-alangnya dan merebutnya untuk Abd al-Malik dan mengembangkannya serta memindahkan para peziarah ke istananya dan Masjid Agung di Wasit, pintu gerbang dari Zantourd, Al-Duqra, Dar Awsat, Deir Masarjasan dan Sharabit. Penduduk kota-kota ini mengeluh dan berkata, “Dia telah mengutamakan kami daripada kota-kota kami dan uang kami,” tetapi ia tidak memperhatikan kata-kata mereka."
