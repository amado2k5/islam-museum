id: event/tahlil-shield-from-shaytan
class: event
kind: other
label:
  ar: "حصن التهليل من الشيطان"
  en: "The tahlil fortress against the shaytan"
  ur: "شیطان سے تہلیل کا قلعہ"
summary:
  ar: "من قال في يوم مئة مرة لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير كانت له حرزا من الشيطان يومه ذلك حتى يمسي {cite:muwatta-maruf-1997} [[passage/muwatta-1-560|الموطأ 560]]."
  en: "Whoever says a hundred times in a day: there is no god but God alone, without partner, His is the kingdom and His is the praise, and He is able over all things — it becomes a fortress for him against the shaytan that day until evening {cite:muwatta-maruf-1997} [[passage/muwatta-1-560|Muwatta 560]]."
  ur: "جو شخص دن میں سو بار کہے: لا الہ الا اللہ وحدہ لا شریک لہ، وتک ملکہ وتک حمد، اور وہ ہر چیز پر قادر ہے — یہ اس کے لیے اس دن شام تک شیطان سے تحفظ بن جاتا ہے {cite:muwatta-maruf-1997} [[passage/muwatta-1-560|موطأ 560]]۔"
