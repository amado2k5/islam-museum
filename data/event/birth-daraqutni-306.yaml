id: event/birth-daraqutni-306
class: event
kind: birth
label:
  ar: "ولادة الدارقطني ببغداد، ذو القعدة ٣٠٦هـ"
  en: "Al-Daraqutni is born in Baghdad, Dhu al-Qa'da 306/918"
  ur: "دارقطنی کی ولادت بغداد میں، ذوالقعدہ 306ھ/918ء"
summary:
  ar: "وُلد علي بن عمر بن أحمد بن مهدي بن مسعود بن النعمان بن دينار بن عبد الله أبو الحسن الدارقطني ببغداد لخمس خلون من ذي القعدة سنة ست وثلاثمائة، وقيل سنة خمس، والدارقطني نسبة إلى دار القطن محلة ببغداد {cite:muntazam-ibn-al-jawzi j.7 p.184} {cite:tarikh-islam-dhahabi p.101} {cite:shadharat-dhahab p.116}."
  en: "'Ali ibn 'Umar ibn Ahmad ibn Mahdi ibn Mas'ud ibn al-Nu'man ibn Dinar ibn 'Abdallah Abu al-Hasan al-Daraqutni was born in Baghdad on 5 Dhu al-Qa'da 306 — the year 305 is also given — his nisba pointing to Dar al-Qutn, a quarter of Baghdad {cite:muntazam-ibn-al-jawzi j.7 p.184} {cite:tarikh-islam-dhahabi p.101} {cite:shadharat-dhahab p.116}."
  ur: "علی بن عمر بن احمد بن مہدی بن مسعود بن النعمان بن دینار بن عبداللہ ابوالحسن دارقطنی بغداد میں 5 ذوالقعدہ 306ھ کو پیدا ہوئے — سال 305ھ بھی منقول ہے — اور ان کی نسبت بغداد کے محلہ دارالقطن کی طرف ہے {cite:muntazam-ibn-al-jawzi j.7 p.184} {cite:tarikh-islam-dhahabi p.101} {cite:shadharat-dhahab p.116}۔"
