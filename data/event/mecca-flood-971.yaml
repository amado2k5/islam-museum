label: { ar: "سيل مكة الكبير 971هـ", en: "The great Mecca flood, 971", es: "El gran diluvio de La Meca, 971", fr: "Le grand déluge de La Mecque, 971", ur: "مکہ کا عظیم سیلاب، 971", tr: "Mekke'nin Büyük Tufanı, Hicri 971", id: "Banjir Besar Mekah, 971 Hijriah" }
summary:
  ar: "في سنة إحدى وسبعين وتسعمائة كان سيل عظيم بمكة المشرفة بل سيول، فدخل السيل الحرم الشريف وعلا على الركن اليماني ذراعاً؛ فقال مؤرخاً لذلك الأديب صلاح الدين القرشي: «يا سائلي تاريخ سيل طمى — علا على الركن اليماني ذراع» {cite:shadharat-dhahab p. 358-359}."
  en: "In 971 floods — a great one among them — entered the Sacred Haram of Mecca and rose a cubit over the Yamani Corner; the chronogram ran 'it rose over the Yamani Corner a cubit' {cite:shadharat-dhahab p. 358-359}."
  es: "En 971, una gran inundación entró en el Sagrado Haram de La Meca y subió un codo por encima del Rincón Yamani; el cronograma decía: \"subió un codo por encima del Rincón Yamani\" {cita: shadharat-dhahab págs. 358-359}."
  fr: "En 971, des inondations — dont une grande parmi elles — pénétrèrent dans le Haram sacré de La Mecque et montèrent d'une coudée au-dessus du coin Yamani; le chronogramme disait « elle monta d'une coudée au-dessus du coin Yamani » {cite: shadharat-dhahab p. 358-359}."
  ur: "971 میں سیلاب - ان میں سے ایک عظیم - مکہ کے مقدس حرم میں داخل ہوا اور یمنی کونے پر ایک ہاتھ بڑھ گیا۔ تاریخ رقم 'یہ یمنی کونے کے اوپر سے ایک ہاتھ بڑھ گیا' 358-359}۔"
  tr: "971 yılında Mekke'de büyük bir sel oldu, daha doğrusu birkaç sel oldu. Sel, Kutsal Mabet'e girdi ve Yemen Köşesi'nin bir kol boyu yukarısına kadar yükseldi. Yazar Selahaddin Eyruşi, bu olayın tarihçisi olarak şöyle demiştir: \"Ey Tuma selinin tarihini soran sizler - o sel Yemen Köşesi'nin bir kol boyu yukarısına kadar yükseldi.\" {kaynak: Şadharat-Dhaba s. 358-359}."
  id: "Pada tahun 971, terjadi banjir besar di Mekah, atau lebih tepatnya beberapa kali banjir. Banjir tersebut memasuki Tempat Suci dan mencapai ketinggian sejauh lengan di atas Sudut Yaman. Penulis Salah al-Din al-Qurashi berkata, sebagai sejarawan peristiwa itu: “Wahai kalian yang bertanya tentang sejarah banjir Tuma — banjir itu mencapai ketinggian sejauh lengan di atas Sudut Yaman.” {cite:shadharat-dhahab hlm. 358-359}."
