label:
  ar: "قتل إبراهيم بن خلف عند تحراني بعد خروجه إلى جبل بيت ذخار، سنة 292هـ، ص388"
  en: "Ibrahim ibn Khalaf is killed at Tuhrani after setting out for Mount Bayt Dhakhar, in 292 AH, p. 388"
  ur: "ابراہیم بن خلف جبل بیت ذخار کی طرف نکلنے کے بعد تحرانی میں قتل ہوتا ہے، 292ھ، ص388"
summary:
  ar: "يخرج إبراهيم بن خلف من الكدراء في محرم سنة 292 يريد جبل بيت ذخار، فيقتله عبيد لعدنان صاحب الموضع عند تحراني، فيُبعث برأسه إلى مواليه."
  en: "Ibrahim ibn Khalaf sets out from al-Kudra' in Muharram 292 AH for Mount Bayt Dhakhar. The servants of Adnan, the lord of the place, kill him at Tuhrani and his head is sent to his mawali."
  ur: "ابراہیم بن خلف محرم 292ھ میں کدراء سے جبل بیت ذخار کی طرف نکلتا ہے، اس جگہ کے مالک عدنان کے غلام تحرانی میں اسے قتل کرتے ہیں اور اس کا سر اس کے موالی کو بھیجا جاتا ہے۔"
