id: "event/ibrahim-ibn-khalaf-is-killed-at-tuhrani-after-setting-out-for-mount-bayt-dhakhar-in-292-ah"
class: event
kind: other
label:
  ar: "قتل إبراهيم بن خلف عند تحراني بعد خروجه إلى جبل بيت ذخار، سنة 292هـ، ص388"
  en: "Ibrahim ibn Khalaf is killed at Tuhrani after setting out for Mount Bayt Dhakhar, in 292 AH, p. 388"
  ur: "ابراہیم بن خلف جبل بیت ذخار کی طرف نکلنے کے بعد تحرانی میں قتل ہوتا ہے، 292ھ، ص388"
  es: "Ibrahim ibn Khalaf es asesinado en Tuhrani después de partir hacia el monte Bayt Dhakhar, en 292 AH, p. 388"
  fr: "Ibrahim ibn Khalaf est tué à Tuhrani après être parti pour le mont Bayt Dhakhar, en 292 AH, p. 388"
  tr: "İbrahim ibn Halef, Hicri 292 yılında Cebel Beyt Dahar'a gittikten sonra Tahrani'de öldürüldü (s. 388)."
  id: "Ibrahim bin Khalaf terbunuh di Tahrani setelah ia pergi ke Jabal Bayt Dhakhar, pada tahun 292 H, hlm. 388."
summary:
  ar: "يخرج إبراهيم بن خلف من الكدراء في محرم سنة 292 يريد جبل بيت ذخار، فيقتله عبيد لعدنان صاحب الموضع عند تحراني، فيُبعث برأسه إلى مواليه."
  en: "Ibrahim ibn Khalaf sets out from al-Kudra' in Muharram 292 AH for Mount Bayt Dhakhar. The servants of Adnan, the lord of the place, kill him at Tuhrani and his head is sent to his mawali."
  ur: "ابراہیم بن خلف محرم 292ھ میں کدراء سے جبل بیت ذخار کی طرف نکلتا ہے، اس جگہ کے مالک عدنان کے غلام تحرانی میں اسے قتل کرتے ہیں اور اس کا سر اس کے موالی کو بھیجا جاتا ہے۔"
  es: "Ibrahim ibn Khalaf parte de al-Kudra' en Muharram del año 292 AH hacia el monte Bayt Dhakhar. Los sirvientes de Adnan, el señor del lugar, lo matan en Tuhrani y su cabeza es enviada a su mawali."
  fr: "Ibrahim ibn Khalaf quitte al-Kudra' en Muharram 292 AH pour se rendre au mont Bayt Dhakhar. Les serviteurs d'Adnan, seigneur du lieu, le tuent à Tuhrani et sa tête est envoyée à son mawali."
  tr: "İbrahim bin Halaf, 292 yılının Muharrem ayında El-Kadra'dan ayrılarak Beyt-ı Dakka'ya doğru yola çıkar. Tahrani yakınlarında, yerin sahibi Adnan'ın köleleri tarafından öldürülür ve başı efendilerine gönderilir."
  id: "Ibrahim bin Khalaf meninggalkan Al-Kadra’ pada bulan Muharram tahun 292, menuju gunung Beit Dhakhar. Ia dibunuh oleh budak-budak Adnan, pemilik tempat itu, di dekat Tahrani, dan kepalanya dikirim kepada tuannya."
