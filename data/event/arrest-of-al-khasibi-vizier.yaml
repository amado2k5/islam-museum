label: { ar: "القبض على الوزير الخصيبي وولاية علي بن عيسى", en: "The arrest of the vizier al-Khasibi and the appointment of Ali ibn Isa" }
summary:
  ar: "في سنة أربع عشرة وثلاثمائة أمر المقتدر بالقبض على الوزير أحمد بن عبيد الله الخصيبي وعلى ابنه، وكان علي بن عيسى بالمغرب متولياً للأشراف، فاستُخلف عنه عبيد الله بن محمد الكلواذي إلى أن يقدم، وأُرسل إليه من يستعجل قدومه {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
  en: "In the year 314 al-Muqtadir ordered the arrest of the vizier Ahmad ibn Ubayd Allah al-Khasibi and of his son. Ali ibn Isa was then in al-Maghrib in charge of the sharifs, so Ubayd Allah ibn Muhammad al-Kalwadhi was appointed to act for him until he arrived, and a messenger was sent to him to hasten his coming {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
