label: { ar: "القبض على الوزير الخصيبي وولاية علي بن عيسى", en: "The arrest of the vizier al-Khasibi and the appointment of Ali ibn Isa", fr: "L'arrestation du vizir al-Khasibi et la nomination d'Ali ibn Isa", es: "El arresto del visir al-Khasibi y el nombramiento de Ali ibn Isa" }
summary:
  ar: "في سنة أربع عشرة وثلاثمائة أمر المقتدر بالقبض على الوزير أحمد بن عبيد الله الخصيبي وعلى ابنه، وكان علي بن عيسى بالمغرب متولياً للأشراف، فاستُخلف عنه عبيد الله بن محمد الكلواذي إلى أن يقدم، وأُرسل إليه من يستعجل قدومه {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
  en: "In the year 314 al-Muqtadir ordered the arrest of the vizier Ahmad ibn Ubayd Allah al-Khasibi and of his son. Ali ibn Isa was then in al-Maghrib in charge of the sharifs, so Ubayd Allah ibn Muhammad al-Kalwadhi was appointed to act for him until he arrived, and a messenger was sent to him to hasten his coming {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
  fr: "En l'an 314, al-Muqtadir ordonna l'arrestation du vizir Ahmad ibn Ubayd Allah al-Khasibi et de son fils. Ali ibn Isa se trouvait alors au Maghreb, chargé des chérifs ; Ubayd Allah ibn Muhammad al-Kalwadhi fut donc nommé pour le suppléer jusqu'à son arrivée, et un messager lui fut envoyé pour hâter sa venue {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
  es: "En el año 314, al-Muqtadir ordenó el arresto del visir Ahmad ibn Ubayd Allah al-Khasibi y de su hijo. Ali ibn Isa se encontraba entonces en al-Maghrib a cargo de los sharifs, por lo que Ubayd Allah ibn Muhammad al-Kalwadhi fue designado para actuar en su lugar hasta su llegada, y se le envió un mensajero para apresurar su llegada {cite:tabari-tarikh-abu-al-fadl j.11 p.112}."
