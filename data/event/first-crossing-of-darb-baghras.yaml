id: event/first-crossing-of-darb-baghras
class: event
kind: raid
label: { ar: "أول قطع الدرب", en: "The First Crossing of the Darb", es: "El primer cruce del Darb", fr: "La première traversée du Darb", ur: "دارب کی پہلی کراسنگ" }
summary:
  ar: "عند البلاذري: اختلفوا في أول من قطع الدرب — وهو درب بغراس — فقال بعضهم قطعه ميسرة بن مسروق العبسي وجّهه أبو عبيدة بن الجراح فلقي جمعاً للروم ومعهم مستعربة من غسان وتنوخ وإياد يريدون اللحاق بهرقل فأوقع بهم وقتل منهم مقتلة عظيمة ثم لحق به مالك الأشتر النخعي مدداً من قبل أبي عبيدة وهو بأنطاكية، وقال بعضهم أول من قطع الدرب عمير بن سعد الأنصاري حين توجه في أمر جبلة بن الأيهم، وقال أبو الخطاب الأزدي بلغه أن أبا عبيدة نفسه غزا الصائفة فمر بالمصيصة وطرسوس وقد جلا أهلها وأهل الحصون التي تليها فأدرب فبلغ في غزاته زندة — وقال غيره إنما وجّه ميسرة بن مسروق فبلغ زندة."
  en: "In al-Baladhuri: they differ on who first cut the Darb — the Baghras pass — some saying it was Maysara ibn Masruq al-Absi, sent by Abu Ubayda ibn al-Jarrah, who met a Byzantine gathering with musta'riba of Ghassan, Tanukh and Iyad making to join Heraclius, fell on them and killed a great slaughter, after which Malik al-Ashtar al-Nakha'i joined him as reinforcement from Abu Ubayda at Antioch; others say the first to cut it was Umayr ibn Sa'd al-Ansari when he went out on the matter of Jabala ibn al-Ayham; and Abu al-Khattab al-Azdi heard that Abu Ubayda himself led the summer raid, passing Masisa and Tarsus — their people having evacuated with the forts beyond — and crossed the pass reaching Zanda, while others say he merely sent Maysara ibn Masruq who reached Zanda."
  es: "En al-Baladhuri: difieren sobre quién cortó primero el Darb —el paso de Baghras— algunos dicen que fue Maysara ibn Masruq al-Absi, enviado por Abu Ubayda ibn al-Jarrah, quien se encontró con una reunión bizantina con musta'riba de Ghassan, Tanukh e Iyad que se dirigían a unirse a Heraclio, los atacó y mató a una gran matanza, después de lo cual Malik al-Ashtar al-Nakha'i se unió a él como refuerzo de Abu Ubayda en Antioquía; otros dicen que el primero en cortarlo fue Umayr ibn Sa'd al-Ansari cuando salió por el asunto de Jabala ibn al-Ayham; y Abu al-Khattab al-Azdi escuchó que el propio Abu Ubayda dirigió la incursión de verano, pasando Masisa y Tarso —su gente había evacuado con los fuertes más allá— y cruzó el paso llegando a Zanda, mientras que otros dicen que simplemente envió a Maysara ibn Masruq que llegó a Zanda."
  fr: "Dans al-Baladhuri: les avis divergent quant à l’identité de celui qui a ouvert le Darb (le col de Baghras) en premier. Certains affirment que ce fut Maysara ibn Masruq al-Absi, envoyé par Abu Ubayda ibn al-Jarrah, qui rencontra un rassemblement byzantin avec les musta'riba de Ghassan, Tanukh et Iyad s’apprêtant à rejoindre Héraclius. Il les attaqua et causa un grand massacre, après quoi Malik al-Ashtar al-Nakha'i le rejoignit en renfort, envoyé par Abu Ubayda à Antioche. D’autres attribuent cette ouverture à Umayr ibn Sa’d al-Ansari, parti régler l’affaire de Jabala ibn al-Ayham. Abu al-Khattab al-Azdi rapporte qu’Abu Ubayda lui-même mena le raid d’été, passant par Masisa et Tarse (leurs populations ayant évacué les forts situés au-delà), et franchit le col pour atteindre Zanda. D’autres encore soutiennent qu’il envoya simplement Maysara ibn Masruq, qui atteignit Zanda."
  ur: "البلادوری میں ہے: ان کا اس بات پر اختلاف ہے کہ سب سے پہلے درب کو کس نے کاٹا تھا - کچھ کہتے ہیں کہ یہ میسرہ بن مسروق العبسی تھا، جسے ابو عبیدہ بن الجراح نے بھیجا تھا، جس نے غسان، تنوخ اور عیاد کے مستریبہ کے ساتھ بازنطینی مجمع سے ملاقات کی تھی، جس نے ہرقلس کے قتل کے بعد ان کے ساتھ مل کر ایک عظیم الشان حملہ کیا تھا۔ الاشتر النخعی انطاکیہ میں ابو عبیدہ سے کمک کے طور پر اس کے ساتھ شامل ہوئے۔ بعض کہتے ہیں کہ سب سے پہلے عمیر بن سعد الانصاری تھے جب وہ جبلہ بن الیہم کے معاملے میں باہر نکلے تھے۔ اور ابو الخطاب الازدی نے سنا کہ ابو عبیدہ نے خود موسم گرما کے چھاپے کی قیادت کی، مسیسا اور ترسوس سے گزرتے ہوئے - ان کے لوگ قلعوں سے باہر نکل گئے تھے - اور درہ عبور کر کے زندا پہنچ گئے، جب کہ دوسروں کا کہنا ہے کہ اس نے صرف میسرہ بن مسروق کو بھیجا تھا جو زندہ تک پہنچا تھا۔"
