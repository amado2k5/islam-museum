id: event/banu-mamar-come-down-on-khiwan-on-15-shaban-and-are-routed-286
class: event
kind: other
label:
  ar: بنو معمر يظهرون على جبل قرب خيوان ويُهزمون يوم النصف من شعبان 286هـ
  en: Banu Ma'mar appear on a hill near Khiwan and are routed on the fifteenth of Sha'ban 286 AH
  ur: بنو معمر خیوان کے قریب پہاڑ پر نمودار ہوتے ہیں اور 15 شعبان 286ھ کو شکست کھاتے ہیں
  fr: "Les Banu Ma'mar apparaissent sur une colline près de Khiwan et sont mis en déroute le quinze Sha'ban 286 H"
  es: "Los Banu Ma'mar aparecen en una colina cerca de Khiwan y son derrotados el quince de Sha'ban del año 286 de la Hégira."
  tr: "Beni Muammer, Hayvan yakınlarındaki bir dağda ortaya çıktı ve Hicri 286 yılının Şaban ayının 15'inde yenilgiye uğradı."
  id: "Banu Muammar muncul di sebuah gunung dekat Khaywan dan dikalahkan pada tanggal 15 Sya'ban, 286 Hijriah."
summary:
  ar: بعد أيام من عفو الهادي بلغه أن القوم اجتمعوا للسير إلى خيوان، ولم يصدق ذلك، ويذكر الراوي أن بعض الناس قال إن قوماً في خيوان حرّضوهم. وفي فجر الأحد النصف من شعبان أشرف نحو ثلاثمائة منهم على جبل قريب، فنهى الهادي الناس عن الخروج وأرسل ابنه أبا القاسم لردهم، ثم ركب بنفسه بعد حوار قصير مع القوم فاقتتلوا فهُزم القوم بجراح خفيفة في صفوف الهادي، وعفا عمن أُسر.
  en: Some days after the pardon word reached al-Hadi that the group had gathered to march on Khiwan; he did not believe it, and the narrator says some people reported that men inside Khiwan had urged them on. After the dawn prayer on Sunday, the fifteenth of Sha'ban, about three hundred of them appeared on a hill near the town; al-Hadi first held his own people back and sent his son Abu al-Qasim to turn them, then, after a short exchange with the group, rode out himself, the two sides fought, the group was routed with only light wounds on al-Hadi's side, and he forgave those taken.
  ur: معافی کے چند دن بعد ہادی کو خبر پہنچی کہ قوم خیوان پر چڑھائی کے لیے اکٹھی ہوئی ہے؛ انہوں نے اس پر یقین نہ کیا، اور راوی کہتا ہے کہ بعض لوگوں نے بتایا کہ خیوان کے کچھ لوگوں نے انہیں بھڑکایا تھا۔ پندرہ شعبان اتوار کو فجر کی نماز کے بعد ان کے تقریباً تین سو آدمی قریب کے پہاڑ پر نمودار ہوئے؛ ہادی نے پہلے اپنے لوگوں کو روکا اور بیٹے ابو القاسم کو بھیجا کہ انہیں لوٹائیں، پھر قوم سے مختصر بات چیت کے بعد خود سوار ہوئے، لڑائی ہوئی، قوم ہادی کی طرف ہلکے زخموں کے ساتھ ہار کر بھاگی، اور جو پکڑے گئے انہیں معاف کر دیا۔
  fr: "Quelques jours après le pardon, la nouvelle parvint à al-Hadi que le groupe s'était rassemblé pour marcher sur Khiwan ; il n'y crut pas, et le narrateur dit que certains rapportèrent que des hommes à l'intérieur de Khiwan les y avaient poussés. Après la prière de l'aube, le dimanche quinze Sha'ban, environ trois cents d'entre eux apparurent sur une colline près de la ville ; al-Hadi retint d'abord les siens et envoya son fils Abu al-Qasim les faire revenir, puis, après un bref échange avec le groupe, sortit lui-même à cheval ; les deux camps combattirent, le groupe fut mis en déroute avec seulement de légères blessures du côté d'al-Hadi, et il pardonna à ceux qui furent pris."
  es: "Algunos días después de que le llegara a al-Hadi la noticia del perdón, de que el grupo se había reunido para marchar sobre Khiwan, él no lo creyó. El narrador cuenta que algunas personas informaron que hombres dentro de Khiwan los habían incitado a seguir adelante. Después de la oración del amanecer del domingo 15 de Sha'ban, unos trescientos de ellos aparecieron en una colina cerca de la ciudad. Al-Hadi primero contuvo a su propia gente y envió a su hijo Abu al-Qasim para que los hiciera retroceder. Luego, tras un breve intercambio con el grupo, salió él mismo. Ambos bandos lucharon, el grupo fue derrotado y al-Hadi solo sufrió heridas leves. Perdonó a los caídos."
  tr: "Hadi'nin affından günler sonra, grubun Hayvan'a doğru yürüyüşe geçmek için toplandığını öğrendi, ancak buna inanmadı. Anlatıcı, bazı kişilerin Hayvan'daki bazı kişilerin onları kışkırttığını söylediğini belirtiyor. Şaban ayının on beşinci Pazar günü şafak vakti, yaklaşık üç yüz kişi yakındaki bir dağda belirdi. Hadi, insanların dışarı çıkmasını yasakladı ve onları geri çevirmesi için oğlu Ebu el-Kâsım'ı gönderdi. Daha sonra, grupla kısa bir görüşmeden sonra kendisi de yola çıktı ve bir çatışma yaşandı. Grup yenildi, Hadi'nin saflarında sadece küçük yaralanmalar oldu ve esir alınanları affetti."
  id: "Beberapa hari setelah pengampunan al-Hadi, ia mengetahui bahwa kelompok itu telah berkumpul untuk berbaris menuju Khaywan, tetapi ia tidak mempercayainya. Perawi menyebutkan bahwa beberapa orang mengatakan bahwa beberapa orang di Khaywan telah menghasut mereka. Pada subuh hari Minggu, tanggal lima belas Sya'ban, sekitar tiga ratus orang dari mereka muncul di sebuah gunung terdekat. Al-Hadi melarang orang-orang itu keluar dan mengirim putranya, Abu al-Qasim, untuk menghalau mereka. Kemudian, setelah diskusi singkat dengan kelompok itu, ia sendiri keluar, dan pertempuran pun terjadi. Kelompok itu dikalahkan, dengan hanya luka ringan di antara barisan al-Hadi, dan ia mengampuni mereka yang telah ditawan."
