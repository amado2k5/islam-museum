id: event/banu-mamar-come-down-on-khiwan-on-15-shaban-and-are-routed-286
class: event
kind: other
label:
  ar: بنو معمر يظهرون على جبل قرب خيوان ويُهزمون يوم النصف من شعبان 286هـ
  en: Banu Ma'mar appear on a hill near Khiwan and are routed on the fifteenth of Sha'ban 286 AH
  ur: بنو معمر خیوان کے قریب پہاڑ پر نمودار ہوتے ہیں اور 15 شعبان 286ھ کو شکست کھاتے ہیں
summary:
  ar: بعد أيام من عفو الهادي بلغه أن القوم اجتمعوا للسير إلى خيوان، ولم يصدق ذلك، ويذكر الراوي أن بعض الناس قال إن قوماً في خيوان حرّضوهم. وفي فجر الأحد النصف من شعبان أشرف نحو ثلاثمائة منهم على جبل قريب، فنهى الهادي الناس عن الخروج وأرسل ابنه أبا القاسم لردهم، ثم ركب بنفسه بعد حوار قصير مع القوم فاقتتلوا فهُزم القوم بجراح خفيفة في صفوف الهادي، وعفا عمن أُسر.
  en: Some days after the pardon word reached al-Hadi that the group had gathered to march on Khiwan; he did not believe it, and the narrator says some people reported that men inside Khiwan had urged them on. After the dawn prayer on Sunday, the fifteenth of Sha'ban, about three hundred of them appeared on a hill near the town; al-Hadi first held his own people back and sent his son Abu al-Qasim to turn them, then, after a short exchange with the group, rode out himself, the two sides fought, the group was routed with only light wounds on al-Hadi's side, and he forgave those taken.
  ur: معافی کے چند دن بعد ہادی کو خبر پہنچی کہ قوم خیوان پر چڑھائی کے لیے اکٹھی ہوئی ہے؛ انہوں نے اس پر یقین نہ کیا، اور راوی کہتا ہے کہ بعض لوگوں نے بتایا کہ خیوان کے کچھ لوگوں نے انہیں بھڑکایا تھا۔ پندرہ شعبان اتوار کو فجر کی نماز کے بعد ان کے تقریباً تین سو آدمی قریب کے پہاڑ پر نمودار ہوئے؛ ہادی نے پہلے اپنے لوگوں کو روکا اور بیٹے ابو القاسم کو بھیجا کہ انہیں لوٹائیں، پھر قوم سے مختصر بات چیت کے بعد خود سوار ہوئے، لڑائی ہوئی، قوم ہادی کی طرف ہلکے زخموں کے ساتھ ہار کر بھاگی، اور جو پکڑے گئے انہیں معاف کر دیا۔
