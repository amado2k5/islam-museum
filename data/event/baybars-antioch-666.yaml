  en: "In Jumada I 666 al-Zahir Baybars took Jaffa by the sword and its citadel by safe-conduct and razed it, took al-Shaqif after a ten-day siege by safe-conduct, raided the lands of Tripoli, camped beneath the fortress of the Kurds until they submitted, then marched on Antioch and took it in four days {cite:shadharat-dhahab p.560}."
