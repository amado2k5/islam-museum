summary:
  ar: "في جمادى الأولى سنة ست وستين افتتح الظاهر بيبرس يافا بالسيف وقلعتها بالأمان ثم هدمها، ثم حاصر الشقيف عشرة أيام وأخذها بالأمان، ثم أغار على أعمال طرابلس وقطع أشجارها وغور أنهارها، ثم نزل تحت حصن الأكراد فخضعوا له، فترحل إلى حماة ثم إلى فامية ثم ساق وطلب أنطاكية فأخذها في أربعة أيام وحصر من قتل بها فكانوا أكثر من أربعين ألفاً {cite:shadharat-dhahab p. 560}."
  en: "Jumada I 666: Jaffa stormed, its citadel aman'd, the town demolished; Beaufort taken in ten days by aman; Tripoli's orchards felled and rivers diverted; Hisn al-Akrad submitted at sight — then Antioch, the ancient patriarchate-city, in four days, with more than forty thousand slain {cite:shadharat-dhahab p. 560}."
