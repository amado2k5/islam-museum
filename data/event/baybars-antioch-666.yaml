id: event/baybars-antioch-666
class: event
kind: conquest
label: { ar: "افتتاح بيبرس يافا وأنطاكية 666هـ", en: "Baybars takes Jaffa and Antioch, 666 AH", fr: "Baybars prend Jaffa et Antioche, 666 H", es: "Baybars conquista Jaffa y Antioquía, 666 d. C.", ur: "Baybars Jaffa اور Antioch، 666 ہجری لیتا ہے۔" }
summary:
  ar: "في جمادى الأولى سنة ست وستين وستمائة افتتح الظاهر بيبرس يافا بالسيف وقلعتها بالأمان ثم هدمها، وحاصر الشقيف فأخذها بالأمان، وأغار على أعمال طرابلس، ونزل تحت حصن الأكراد فخضعوا له، ثم ساق إلى أنطاكية فأخذها في أربعة أيام {cite:shadharat-dhahab p.560}."
  en: "In Jumada I 666 al-Zahir Baybars took Jaffa by the sword and its citadel by safe-conduct and razed it, took al-Shaqif after a ten-day siege by safe-conduct, raided the lands of Tripoli, camped beneath the fortress of the Kurds until they submitted, then marched on Antioch and took it in four days {cite:shadharat-dhahab p.560}."
  fr: "En Jumada I 666, al-Zahir Baybars prit Jaffa par l'épée et sa citadelle par sauf-conduit, puis la rasa, prit al-Shaqif par sauf-conduit après un siège de dix jours, razzia les terres de Tripoli, campa au pied de la forteresse des Kurdes jusqu'à ce qu'ils se soumettent, puis marcha sur Antioche et la prit en quatre jours {cite:shadharat-dhahab p.560}."
  es: "En Jumada I 666 al-Zahir Baybars tomó Jaffa por la espada y su ciudadela por salvoconducto y la arrasó, tomó al-Shaqif después de un asedio de diez días por salvoconducto, saqueó las tierras de Trípoli, acampó bajo la fortaleza de los kurdos hasta que se sometieron, luego marchó sobre Antioquía y la tomó en cuatro días {cite:shadharat-dhahab p.560}."
  ur: "جمادی الثانی 666 میں الظاہر بیبرس نے تلوار کے ذریعے جفا اور اس کے قلعہ کو محفوظ طریقے سے لے لیا اور اسے مسمار کر دیا، دس دن کے محاصرے کے بعد الشقیف کو محفوظ طریقے سے لے لیا، طرابلس کی سرزمین پر چھاپہ مارا، کردوں کے قلعے کے نیچے ڈیرے ڈالے یہاں تک کہ وہ تسلیم ہو گئے، پھر چار دن تک انتفاضہ پر چڑھائی کی۔ صفحہ 560}۔"
