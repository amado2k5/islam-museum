label: { ar: "ملك الفرنج عكا وقتل الأسرى", en: "The Franks take Acre and kill the captives", es: "Los Franks toman Acre y matan a los cautivos.", fr: "Les Francs prennent Acre et tuent les captifs.", ur: "فرینک ایکڑ لے کر قیدیوں کو مار ڈالتے ہیں۔", tr: "Akka'nın Frank kralı esirleri öldürdü.", id: "Raja Frankia dari Acre membunuh para tawanan." }
summary:
  ar: "في يوم الجمعة سابع عشر جمادى الآخرة سنة سبع وثمانين وخمسمائة استولى الفرنج على عكا بعد حصار طويل، وكان من أوهن ما دخل على من بالبلد أن الأمير سيف الدين علي بن أحمد الهكاري المعروف بالمشطوب خرج إلى ملك أفرنسيس يبذل تسليم البلد على إطلاق من فيه فلم يجبه فوهن الناس، واتخذ أميران منها الليل جملاً وركبا البحر سراً فلحقا بعسكر المسلمين فأيقن أهلها بالعطب، وقرر المشطوب مع الفرنج تسليم البلد على مائتي ألف دينار وخمسمائة أسير معروف وإعادة صليب الصلبوت وأربعة عشر ألف دينار للمركيس صاحب صور ومدة تحصيلها شهرين، فلما ملكوها غدروا بمن فيها وحبسوهم، وجمع صلاح الدين مائة ألف دينار فاستشار الأمراء فأشاروا ألا يرسل شيئاً حتى يضمن الداوية الوفاء فقال الداوية لا نحلف ولا نضمن لأنا نخاف غدراً من عندنا، فعلم صلاح الدين عزمهم على الغدر فلم يرسل شيئاً، فلما كان يوم الثلاثاء سابع وعشرين رجب خرج الفرنج إلى ظاهر البلد وإذا أكثر من كان عندهم من المسلمين قتلى قد وضعوا فيهم السيف واستبقوا الأمراء ومن له مال ليطلبوا منهم الفداء، فتصرف صلاح الدين في المال الذي جمعه وسيّر الأسرى والصليب إلى دمشق {cite:kamil-ibn-al-athir p. 205-207}."
  en: "On Friday, 17 Jumada II 587, the Franks took Acre after a long siege. Among the things that most weakened its defenders was that Amir Sayf al-Din Ali ibn Ahmad al-Hakkari, known as al-Mashtub, went out to King Afrinsis offering to hand over the city in exchange for freeing those inside; the king did not answer him, and the people lost heart. Two amirs from within used the night as a mount, secretly took to the sea by boat, and reached the Muslim army, so the city's people were certain of ruin. Al-Mashtub agreed with the Franks to surrender the city for two hundred thousand dinars, five hundred named captives, the return of the Cross of the Crucifixion, and fourteen thousand dinars for the Marquis, lord of Tyre, with two months allowed to collect it. Once they had taken the city, the Franks betrayed those inside and imprisoned them. Saladin gathered a hundred thousand dinars and consulted his amirs, who advised him to send nothing until the Templars guaranteed good faith; the Templars refused to swear or to guarantee, saying they feared treachery from their own side. Saladin, realising their intent to betray, sent nothing. On Tuesday, 27 Rajab, the Franks went out to the outskirts of the city and found most of the Muslims in their hands already slain by the sword; they spared the amirs and those with wealth, to seek ransom from them. Saladin spent the money he had gathered and sent the captives and the cross to Damascus {cite:kamil-ibn-al-athir p. 205-207}."
  es: "El viernes 17 de Jumada II de 587, los francos tomaron Acre tras un largo asedio. Entre los factores que más debilitaron a sus defensores se encontraba la salida del emir Sayf al-Din Ali ibn Ahmad al-Hakkari, conocido como al-Mashtub, quien ofreció al rey Afrinsis entregar la ciudad a cambio de la liberación de sus habitantes. El rey no respondió, y el pueblo perdió la esperanza. Dos emires, aprovechando la noche, se lanzaron clandestinamente al mar en barco y llegaron hasta el ejército musulmán, lo que puso en peligro la destrucción de la ciudad. Al-Mashtub acordó con los francos entregar la ciudad a cambio de doscientos mil dinares, quinientos prisioneros identificados, la devolución de la Cruz de la Crucifixión y catorce mil dinares para el marqués, señor de Tiro, con un plazo de dos meses para cobrarlos. Una vez tomada la ciudad, los francos traicionaron a sus habitantes y los encarcelaron. Saladino reunió cien mil dinares y consultó con sus emires, quienes le aconsejaron no enviar nada hasta que los templarios garantizaran su buena fe; los templarios se negaron a jurar o garantizar, alegando que temían una traición de su propio bando. Saladino, al darse cuenta de su intención de traicionarlos, no envió nada. El martes 27 de Rajab, los francos salieron a las afueras de la ciudad y encontraron a la mayoría de los musulmanes en sus manos ya muertos a espada; perdonaron a los emires y a los ricos para pedirles rescate. Saladino gastó el dinero que había reunido y envió a los cautivos y la cruz a Damasco {cita:kamil-ibn-al-athir págs. 205-207}."
  fr: "Le vendredi 17 Jumada II 587, les Francs s'emparèrent d'Acre après un long siège. Parmi les éléments qui affaiblirent le plus les défenseurs, il y eut la proposition de l'émir Sayf al-Din Ali ibn Ahmad al-Hakkari, dit al-Mashtub, de se présenter devant le roi Afrinsis de lui livrer la ville en échange de la libération de ses habitants. Le roi refusa de répondre, et le peuple perdit courage. Deux émirs profitèrent de la nuit pour s'enfuir secrètement par bateau et rejoindre l'armée musulmane, plongeant ainsi les habitants dans le désespoir. Al-Mashtub accepta de livrer la ville aux Francs contre deux cent mille dinars, la libération de cinq cents captifs, la restitution de la Croix de la Crucifixion et quatorze mille dinars pour le marquis de Tyr, qui disposait de deux mois pour les réunir. Une fois la ville prise, les Francs trahirent les habitants et les emprisonnèrent. Saladin réunit cent mille dinars et consulta ses émirs, qui lui conseillèrent de ne rien envoyer tant que les Templiers n'auraient pas garanti leur bonne foi. Les Templiers refusèrent de jurer ou de se porter garants, prétextant craindre une trahison de leur part. Saladin, pressentant leur intention de trahir, n'envoya rien. Le mardi 27 Rajab, les Francs se rendirent aux abords de la ville et trouvèrent la plupart des musulmans déjà massacrés. Ils épargnaient les émirs et les riches, afin d'exiger une rançon. Saladin dépensa l'argent qu'il avait rassemblé et envoya les captifs et la croix à Damas (voir Kamil ibn al-Athir, p. 205-207)."
  ur: "جمعہ 17 جمادی الثانی 587 کو، فرینکوں نے ایک طویل محاصرے کے بعد ایکر پر قبضہ کر لیا۔ جن چیزوں نے اس کے محافظوں کو سب سے زیادہ کمزور کیا ان میں سے ایک یہ تھی کہ امیر سیف الدین علی ابن احمد الحکری، جو المشتوب کے نام سے جانا جاتا ہے، بادشاہ آفرینسیس کے پاس یہ پیشکش کرنے کے لیے نکلا کہ وہ اندر کے لوگوں کو آزاد کرنے کے بدلے شہر کو حوالے کر دے؛ بادشاہ نے اسے کوئی جواب نہ دیا اور لوگوں کا حوصلہ ہار گیا۔ اندر سے دو امیر رات کو پہاڑی کے طور پر استعمال کرتے تھے، چپکے سے کشتی کے ذریعے سمندر میں چلے گئے، اور مسلم فوج کے پاس پہنچ گئے، اس لیے شہر کے لوگوں کی بربادی یقینی تھی۔ المشتوب نے فرینکوں کے ساتھ دو لاکھ دینار، پانچ سو نامی قیدیوں، صلیب کی صلیب کی واپسی، اور ٹائیر کے مالک مارکوس کے لیے چودہ ہزار دینار، دو ماہ کے لیے جمع کرنے کے لیے شہر کے حوالے کرنے پر اتفاق کیا۔ ایک بار جب انہوں نے شہر پر قبضہ کر لیا، فرانکس نے اندر والوں کو دھوکہ دیا اور انہیں قید کر لیا۔ صلاح الدین نے ایک لاکھ دینار جمع کیے اور اپنے امیروں سے مشورہ کیا، جنہوں نے اسے مشورہ دیا کہ جب تک ٹیمپلرز نیک نیتی کی ضمانت نہ دے دیں کچھ نہ بھیجیں۔ ٹیمپلرز نے یہ کہتے ہوئے قسم کھانے یا ضمانت دینے سے انکار کر دیا کہ انہیں اپنی طرف سے غداری کا خدشہ ہے۔ صلاح الدین نے دھوکہ دینے کے ان کے ارادے کو بھانپتے ہوئے کچھ بھی نہ بھیجا۔ 27 رجب بروز منگل، فرینک شہر کے مضافات میں گئے اور انہوں نے اکثر مسلمانوں کو اپنے ہاتھوں میں پہلے ہی تلوار سے مارے ہوئے پایا۔ انہوں نے امیروں اور مال داروں کو چھوڑ دیا کہ ان سے تاوان طلب کریں۔ صلاح الدین نے جمع کی ہوئی رقم خرچ کی اور اسیروں اور صلیب کو دمشق بھیج دیا۔ 205-207}۔"
  tr: "Hicri 587 yılının Cemadi ahiret ayının on yedinci Cuma günü (Miladi 1184), Franklar uzun bir kuşatmanın ardından Akka şehrini ele geçirdi. Şehir halkı için en yıkıcı darbelerden biri, el-Mashtub olarak bilinen Prens Saif el-Din Ali ibn Ahmed el-Hakkari'nin, Frank kralına şehri esirlerin serbest bırakılması karşılığında teslim etmeyi teklif etmesiydi. Kralın teklifi reddetmesi halkın moralini bozdu. Frank prenslerinden ikisi, gece vakti develere binerek gizlice Müslüman ordusuna katıldı. Şehir halkı kaderlerinin kesin olduğuna emindi. Bunun üzerine El-Mashtub, Franklarla 200.000 dinar, 500 bilinen esir, Haç'ın iadesi ve Sur Markizi'ne 14.000 dinar karşılığında şehri teslim etme konusunda anlaştı. Ödeme iki ay içinde yapılacaktı. Ancak şehri ele geçirdikten sonra ihanete uğradılar ve sakinlerini hapse attılar. Selahaddin 100.000 dinar topladı ve prenslerle görüştü; prensler, Çarlar ödeme garantisi verene kadar hiçbir şey göndermemesini tavsiye ettiler. Çarlar, kendi saflarından bir ihanetten korkarak yemin etmeyi veya garanti vermeyi reddettiler. Selahaddin, kendisine ihanet etme niyetlerinin farkında olarak hiçbir şey göndermedi. Salı günü, Receb ayının 27. gününde, Franklar şehrin dışına çıktılar ve esir aldıkları Müslümanların çoğunun başlarının kesilerek öldürüldüğünü gördüler. Prensleri ve parası olanları fidye istemek için tuttular, bu yüzden Selahaddin topladığı parayı kullanarak esirleri ve haçı Şam'a gönderdi. {Kaynak: Kamil İbn el-Atir s. 205-207}"
  id: "Pada hari Jumat, tanggal tujuh belas Jumada al-Akhirah, tahun 587 H (1184 M), bangsa Frank merebut Acre setelah pengepungan yang panjang. Salah satu pukulan terberat bagi penduduk kota adalah ketika Pangeran Saif al-Din Ali ibn Ahmad al-Hakkari, yang dikenal sebagai al-Mashtub, pergi menemui raja Frank dan menawarkan untuk menyerahkan kota dengan imbalan pembebasan para tahanannya. Raja menolak, yang membuat rakyat putus asa. Dua pangeran Frank, di bawah lindungan malam, menaiki unta dan diam-diam berlayar untuk bergabung dengan tentara Muslim. Penduduk kota yakin akan kehancuran mereka. Al-Mashtub kemudian bernegosiasi dengan bangsa Frank untuk menyerahkan kota dengan imbalan 200.000 dinar, 500 tahanan yang diketahui, pengembalian Salib Sejati, dan 14.000 dinar kepada Marquis dari Tyre. Pembayaran harus dilakukan dalam waktu dua bulan. Namun, setelah menguasai kota, mereka mengkhianatinya dan memenjarakan penduduknya. Saladin mengumpulkan 100.000 dinar dan berkonsultasi dengan para pangeran, yang menasihatinya untuk tidak mengirim apa pun sampai Tsar menjamin pembayaran. Para Tsar menolak untuk bersumpah atau memberikan jaminan, karena takut akan pengkhianatan dari dalam barisan mereka. Saladin, menyadari niat mereka untuk mengkhianatinya, tidak mengirim apa pun. Pada hari Selasa, tanggal 27 Rajab, orang-orang Frank muncul di pinggiran kota dan menemukan sebagian besar Muslim yang mereka tangkap telah tewas, setelah dipenggal kepalanya. Mereka menahan para pangeran dan orang-orang yang memiliki uang untuk meminta tebusan, sehingga Saladin menggunakan uang yang dikumpulkannya dan mengirim para tawanan dan salib ke Damaskus {cite:kamil-ibn-al-athir hlm. 205-207}."
