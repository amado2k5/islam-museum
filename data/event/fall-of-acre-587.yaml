id: event/fall-of-acre-587
class: event
kind: siege
label: { ar: "ملك الفرنج عكا وقتل الأسرى", en: "The Franks take Acre and kill the captives" }
summary:
  ar: "في يوم الجمعة سابع عشر جمادى الآخرة سنة سبع وثمانين وخمسمائة استولى الفرنج على عكا بعد حصار طويل، وكان من أوهن ما دخل على من بالبلد أن الأمير سيف الدين علي بن أحمد الهكاري المعروف بالمشطوب خرج إلى ملك أفرنسيس يبذل تسليم البلد على إطلاق من فيه فلم يجبه فوهن الناس، واتخذ أميران منها الليل جملاً وركبا البحر سراً فلحقا بعسكر المسلمين فأيقن أهلها بالعطب، وقرر المشطوب مع الفرنج تسليم البلد على مائتي ألف دينار وخمسمائة أسير معروف وإعادة صليب الصلبوت وأربعة عشر ألف دينار للمركيس صاحب صور ومدة تحصيلها شهرين، فلما ملكوها غدروا بمن فيها وحبسوهم، وجمع صلاح الدين مائة ألف دينار فاستشار الأمراء فأشاروا ألا يرسل شيئاً حتى يضمن الداوية الوفاء فقال الداوية لا نحلف ولا نضمن لأنا نخاف غدراً من عندنا، فعلم صلاح الدين عزمهم على الغدر فلم يرسل شيئاً، فلما كان يوم الثلاثاء سابع وعشرين رجب خرج الفرنج إلى ظاهر البلد وإذا أكثر من كان عندهم من المسلمين قتلى قد وضعوا فيهم السيف واستبقوا الأمراء ومن له مال ليطلبوا منهم الفداء، فتصرف صلاح الدين في المال الذي جمعه وسيّر الأسرى والصليب إلى دمشق {cite:kamil-ibn-al-athir p. 205-207}."
  en: "On Friday, 17 Jumada II 587, the Franks took Acre after a long siege. Among the things that most weakened its defenders was that Amir Sayf al-Din Ali ibn Ahmad al-Hakkari, known as al-Mashtub, went out to King Afrinsis offering to hand over the city in exchange for freeing those inside; the king did not answer him, and the people lost heart. Two amirs from within used the night as a mount, secretly took to the sea by boat, and reached the Muslim army, so the city's people were certain of ruin. Al-Mashtub agreed with the Franks to surrender the city for two hundred thousand dinars, five hundred named captives, the return of the Cross of the Crucifixion, and fourteen thousand dinars for the Marquis, lord of Tyre, with two months allowed to collect it. Once they had taken the city, the Franks betrayed those inside and imprisoned them. Saladin gathered a hundred thousand dinars and consulted his amirs, who advised him to send nothing until the Templars guaranteed good faith; the Templars refused to swear or to guarantee, saying they feared treachery from their own side. Saladin, realising their intent to betray, sent nothing. On Tuesday, 27 Rajab, the Franks went out to the outskirts of the city and found most of the Muslims in their hands already slain by the sword; they spared the amirs and those with wealth, to seek ransom from them. Saladin spent the money he had gathered and sent the captives and the cross to Damascus {cite:kamil-ibn-al-athir p. 205-207}."
