label: { ar: "ملك الكرج قرس وموت ملكتهم", en: "The Georgians Take Qars and the Death of Their Queen", es: "Los georgianos toman Qars y la muerte de su reina.", fr: "Les Géorgiens prennent Qars et la mort de leur reine", ur: "جارجیائی قار اور اپنی ملکہ کی موت کو لے لیتے ہیں۔" }
summary:
  ar: "في سنة أربع وستمائة ملك الكرج حصن قرس من أعمال خلاط بعد أن حاصروه مدة طويلة وضيقوا على من فيه وأخذوا دخل الولاية عدة سنين وكل من نزل خلاط لم ينجدهم، فلما طال الأمر على واليها ولم يجب له دعاء صالح الكرج على تسليم القلعة على مال كثير وإقطاع، فقال ابن الأثير صارت دار شرك بعد أن كانت دار توحيد، ثم أمات الله ملكة الكرج واختلفوا فيما بينهم فكفى شرهم إلى آخر السنة {cite:kamil-ibn-al-athir p. 331}."
  en: "In 604 the Georgians took the fortress of Qars, one of the districts of Khilat, after besieging it a long time, straitening those within and taking the province's revenue for several years, while no one who came to Khilat relieved them. When the matter dragged on for its governor, and his prayer went unanswered, he made peace with the Georgians for the surrender of the citadel in return for much money and an iqta' grant. Ibn al-Athir said it had become a house of polytheism after having been a house of monotheism. Then God caused the Georgian queen to die, and they fell to disputing among themselves, so their harm was averted until the year's end {cite:kamil-ibn-al-athir p. 331}."
  es: "En 604, los georgianos tomaron la fortaleza de Qars, uno de los distritos de Khilat, tras un largo asedio, oprimiendo a sus habitantes y apropiándose de los ingresos de la provincia durante varios años, sin que nadie que acudiera a Khilat les prestara auxilio. Ante la prolongada situación para su gobernador, cuya súplica quedó sin respuesta, este hizo las paces con los georgianos a cambio de la entrega de la ciudadela y una generosa suma de dinero y una concesión de iqta'. Ibn al-Athir afirmó que, tras haber sido monoteísta, se había convertido en un lugar de politeísmo. Entonces, Dios provocó la muerte de la reina georgiana, y las disputas entre ellos se prolongaron, evitando así el daño hasta finales de año {cite:kamil-ibn-al-athir p. 331}."
  fr: "En 604, les Géorgiens s'emparèrent de la forteresse de Qars, un des districts du Califat, après un long siège. Ils opprimèrent ses occupants et s'approprièrent les revenus de la province pendant plusieurs années, sans que personne ne vienne à leur secours. Face à l'inaction du gouverneur et à l'absence de réponse à ses prières, celui-ci conclut la paix avec les Géorgiens: la citadelle leur fut rendue en échange d'une importante somme d'argent et d'une iqta' (concession). Ibn al-Athir rapporta que la forteresse, autrefois monothéiste, était devenue un foyer de polythéisme. Puis, Dieu fit mourir la reine géorgienne, et les Géorgiens se livrèrent à des querelles intestines. Le danger fut ainsi écarté jusqu'à la fin de l'année (voir: Kamil Ibn al-Athir, p. 331)."
  ur: "604 میں جارجیوں نے خلت کے اضلاع میں سے ایک قلعہ قارس پر قبضہ کر لیا، اس کا ایک طویل محاصرہ کرنے کے بعد، اس کے اندر رہنے والوں کو تنگ کیا اور کئی سالوں تک صوبے کی آمدنی پر قبضہ کر لیا، جب کہ خلعت میں آنے والے کسی نے بھی انہیں فارغ نہیں کیا۔ جب معاملہ اس کے گورنر کے لئے گھسیٹتا ہے، اور اس کی دعا بے نتیجہ رہی، تو اس نے جارجیوں کے ساتھ بہت زیادہ رقم اور ایک اقتا گرانٹ کے بدلے قلعہ کے ہتھیار ڈالنے کے لیے صلح کر لی۔ ابن اثیر نے کہا کہ توحید کا گھر ہونے کے بعد یہ شرک کا گھر بن گیا ہے۔ پھر خدا نے جارجیا کی ملکہ کو موت کے گھاٹ اتار دیا اور وہ آپس میں جھگڑنے لگے، چنانچہ سال کے آخر تک ان کا نقصان ٹل گیا۔ 331}۔"
