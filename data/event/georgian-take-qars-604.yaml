label: { ar: "ملك الكرج قرس وموت ملكتهم", en: "The Georgians Take Qars and the Death of Their Queen" }
summary:
  ar: "في سنة أربع وستمائة ملك الكرج حصن قرس من أعمال خلاط بعد أن حاصروه مدة طويلة وضيقوا على من فيه وأخذوا دخل الولاية عدة سنين وكل من نزل خلاط لم ينجدهم، فلما طال الأمر على واليها ولم يجب له دعاء صالح الكرج على تسليم القلعة على مال كثير وإقطاع، فقال ابن الأثير صارت دار شرك بعد أن كانت دار توحيد، ثم أمات الله ملكة الكرج واختلفوا فيما بينهم فكفى شرهم إلى آخر السنة {cite:kamil-ibn-al-athir p. 331}."
  en: "In 604 the Georgians took the fortress of Qars, one of the districts of Khilat, after besieging it a long time, straitening those within and taking the province's revenue for several years, while no one who came to Khilat relieved them. When the matter dragged on for its governor, and his prayer went unanswered, he made peace with the Georgians for the surrender of the citadel in return for much money and an iqta' grant. Ibn al-Athir said it had become a house of polytheism after having been a house of monotheism. Then God caused the Georgian queen to die, and they fell to disputing among themselves, so their harm was averted until the year's end {cite:kamil-ibn-al-athir p. 331}."
