summary:
  ar: "أول عزم بحرية كبرى في الإسلام: خرج قسطنطين بن هرقل في جمع لم تجمع الروم مثله مذ كان الإسلام في خمسمائة مركب أو ستمائة، وخرج المسلمون وعلى أهل الشام معاوية بن أبي سفيان وعلى البحر عبد الله بن سعد بن أبي سرح؛ وبات الطرفان ليلتهم والمسلمون يقرأون القرآن ويصلون والروم يضربون بالنواقيس، وفي الغد قاربوا السفن وربطوها بعضها ببعض واقتتلوا بالسيوف والخناجر فقتل من الروم ما لا يحصى وانهزم قسطنطين جريحاً ولم ينج من الروم إلا الشريد؛ وقيل إنه سار إلى صقلية فأدخلوه الحمام وقتلوه، وفي هذه الغزوة بدأ محمد بن أبي حذيفة ومحمد بن أبي بكر بالكلام في أمر عثمان {cite:kamil-ibn-al-athir pp. 488–490 v.2}."
  en: "Dhat al-Sawari, 'the Battle of the Masts' (AH 31): the first great naval armament of Islam — Constans sailed in five or six hundred ships, the Muslims under Abdullah ibn Sa'd lashed their hulls together and fought sword to sword until the Byzantines broke and their emperor fled wounded, in the Arabic telling to be killed in a Sicilian bath; Ibn al-Athir notes the victory field was also where talk against Uthman began {cite:kamil-ibn-al-athir v.2 pp. 488–490}."
