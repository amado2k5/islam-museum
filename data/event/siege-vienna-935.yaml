label: { ar: "حصار فيينا الأول", en: "The first siege of Vienna", es: "El primer asedio de Viena", fr: "Le premier siège de Vienne", ur: "ویانا کا پہلا محاصرہ", tr: "Viyana'nın Birinci Kuşatması", id: "Pengepungan Wina Pertama" }
summary:
  ar: "تابع السلطان سليمان القانوني ضغطه بعد موهاكس حتى بلغت جيوشه أسوار فيينا عاصمة الإمبراطورية الرومانية المقدسة عام ١٥٢٩م، إلا أن طول خطوط المواصلات وتحول شارل كان من قتال فرانسوا إلى التصالح معه للتفرغ لحرب العثمانيين ولإنقاذ عاصمة الهابسبورج جعل من المستحيل على سليمان فتح هذه العاصمة، فتراجع عنها بينما استمر الصراع بين سليمان والقوى الأوروبية المؤيدة لملك المجر من أجل السيطرة على هذه المملكة حتى وفاة سليمان {cite:dawlat-uthmaniyya-salabi p. 202}."
  en: "The first siege of Vienna, 1529 — Sulayman's army reached the Habsburg capital's walls but long supply lines and Charles V's new peace with France forced the withdrawal {cite:dawlat-uthmaniyya-salabi p. 202}."
  es: "El primer asedio de Viena, 1529: el ejército de Sulayman llegó a las murallas de la capital de los Habsburgo, pero las largas líneas de suministro y la nueva paz de Carlos V con Francia forzaron la retirada {cite:dawlat-uthmaniyya-salabi p. 202}."
  fr: "Le premier siège de Vienne, 1529 — L'armée de Sulayman atteignit les murs de la capitale des Habsbourg, mais de longues lignes d'approvisionnement et la nouvelle paix de Charles Quint avec la France forcèrent le retrait {cite:dawlat-uthmaniyya-salabi p. 202}."
  ur: "ویانا کا پہلا محاصرہ، 1529 - سلیمان کی فوج دارالحکومت ہیبسبرگ کی دیواروں تک پہنچ گئی لیکن طویل سپلائی لائنز اور فرانس کے ساتھ چارلس پنجم کے نئے امن نے انخلاء پر مجبور کر دیا۔ 202}۔"
  tr: "Kanuni Sultan Süleyman, Mohaç Savaşı'ndan sonra da baskısını sürdürerek ordularını 1529 yılında Kutsal Roma İmparatorluğu'nun başkenti Viyana surlarına kadar ulaştırdı. Ancak, iletişim hatlarının uzunluğu ve V. Charles'ın I. Francis ile savaşmaktan vazgeçip Osmanlılarla savaşmaya ve Habsburg başkentini kurtarmaya odaklanması, Süleyman'ın bu başkenti fethetmesini imkansız hale getirdi ve geri çekildi. Bu arada, Süleyman ile Macaristan Kralı'nı destekleyen Avrupa güçleri arasındaki bu krallığın kontrolü için yaşanan çatışma, Süleyman'ın ölümüne kadar devam etti."
  id: "Sultan Suleiman yang Agung melanjutkan tekanannya setelah Mohács hingga pasukannya mencapai tembok Wina, ibu kota Kekaisaran Romawi Suci pada tahun 1529 M. Namun, panjangnya jalur komunikasi dan perubahan sikap Charles V dari memerangi Francis I menjadi berdamai dengannya untuk mengabdikan diri memerangi Ottoman dan menyelamatkan ibu kota Habsburg membuat Suleiman tidak mungkin menaklukkan ibu kota ini, sehingga ia mundur. Sementara itu, konflik antara Suleiman dan kekuatan Eropa yang mendukung Raja Hongaria untuk menguasai kerajaan ini berlanjut hingga kematian Suleiman {cite:dawlat-uthmaniyya-salabi p. 202}."
