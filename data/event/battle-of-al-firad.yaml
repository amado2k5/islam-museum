summary:
  ar: "وقعة الفراض، وهي تخوم الشام والعراق والجزيرة: سار إليها خالد من الرضاب وأفطر بها رمضان لاتصال الغزوات، وحميت الروم واستعانوا بمسالح الفرس واجتمعت معهم تغلب وإياد والنمر. قالوا لخالد إما أن تعبر إلينا وإما أن نعبر إليك فقال اعبروا أسفل منا، وقالت الروم امتازوا حتى نعرف من يثبت ممن يولّي، فاقتتلوا قتالًا عظيمًا وانهزمت الروم ومن معهم وأمر خالد المسلمين أن لا يرفعوا عنهم فقُتل في المعركة والطلب مائة ألف، وأقام على الفراض عشرًا ثم أذن بالرجوع إلى الحيرة لخمس بقين من ذي القعدة وجعل شجر بن الأعز على الساقة وأظهر أنه فيها. ثم خرج حاجًّا من الفراض سرًّا ومعه عدة من أصحابه يعتسف البلاد فحج ورجع مع صاحب الساقة وقد حلّقوا رؤوسهم فلم يعلم أبو بكر إلا بعد رجوعه فعتب عليه. وكان أهل العراق أيام عليّ إذا بلغهم عن معاوية شيء قالوا نحن أصحاب ذات السلاسل ويسمّون ما بينها وبين الفراض ولا يذكرون ما بعدها احتقارًا لما كان بعدها {cite:kamil-ibn-al-athir p. 245-246}."
  en: "Al-Firad, at the meeting-point of Syria, Iraq and the Jazira: Khalid broke his Ramadan fast there for unbroken campaigning, faced a coalition of Byzantines, Persian border-troops and the Arab tribes Taghlib, Iyad and al-Namir, let them cross below his position — 'cross over', he told them — then annihilated them, a hundred thousand said to be killed in the fight and pursuit, and held the field ten days. From al-Firad he slipped away in secret on Hajj, letting his rear-guard commander impersonate him; Abu Bakr learned of it only on his return and reproached him. The 'Iraqis of 'Ali's day would say 'we are the men of Dhat al-Salasil' and name everything between it and al-Firad, contemptuous of whatever came after {cite:kamil-ibn-al-athir p. 245-246}."
  fr: "Al-Firad, au point de rencontre de la Syrie, de l'Irak et de la Jazira : Khalid y rompit son jeûne de Ramadan en raison de campagnes ininterrompues, fit face à une coalition de Byzantins, de troupes frontalières perses et des tribus arabes Taghlib, Iyad et al-Namir, les laissa traverser en contrebas de sa position (« traversez », leur dit-il), puis les anéantit ; cent mille hommes auraient été tués dans le combat et la poursuite, et il tint le terrain dix jours. D'al-Firad, il s'éclipsa en secret pour le pèlerinage, laissant le commandant de son arrière-garde se faire passer pour lui ; Abu Bakr ne l'apprit qu'à son retour et le lui reprocha. Les Irakiens du temps d'Ali disaient « nous sommes les gens de Dhat al-Salasil » et nommaient tout ce qui s'étend entre elle et al-Firad, méprisant ce qui vint ensuite {cite:kamil-ibn-al-athir p. 245-246}."
  es: "Al-Firad, en el punto de encuentro de Siria, Irak y Jazira: Khalid rompió allí su ayuno de Ramadán para continuar la campaña, se enfrentó a una coalición de bizantinos, tropas fronterizas persas y las tribus árabes Taghlib, Iyad y al-Namir, les permitió cruzar por debajo de su posición —«cruzad», les dijo— y luego los aniquiló; se dice que cien mil murieron en la lucha y la persecución, y mantuvo el control del campo de batalla durante diez días. De Al-Firad se escabulló en secreto para realizar el Hajj, dejando que su comandante de la retaguardia se hiciera pasar por él; Abu Bakr se enteró de ello solo a su regreso y lo reprendió. Los iraquíes de la época de Ali decían «somos los hombres de Dhat al-Salasil» y nombraban todo lo que había entre este y Al-Firad, despreciando todo lo que vino después {cite:kamil-ibn-al-athir p. 245-246}."
  ur: "الفراد، شام، عراق اور جزیرہ کے جلسہ گاہ پر: خالد نے غیر منقطع مہم کے لیے وہاں رمضان کا روزہ توڑ دیا، بازنطینیوں، فارس کے سرحدی دستوں اور عرب قبائل تغلب، عیاد اور النمیر کے اتحاد کا سامنا کیا، انہیں اپنی پوزیشن سے نیچے عبور کرنے دو - 'کراس اوور'، اس نے کہا کہ ایک سو مارے جائیں، پھر ان سے کہا کہ ایک سو مارے جائیں اور ایک ہزار لڑے۔ تعاقب، اور دس دن میدان منعقد کیا. الفراد سے وہ خفیہ طور پر حج پر چلا گیا، اپنے پیچھے گارڈ کمانڈر کو اس کی نقالی کرنے دیتا تھا۔ ابوبکر کو واپسی پر ہی اس کا علم ہوا اور اسے ملامت کی۔ علی کے زمانے کے عراقی کہتے تھے کہ ہم ثلثل کے آدمی ہیں اور اس کے اور الفراد کے درمیان ہر چیز کا نام لیتے ہیں، اس کے بعد آنے والی چیزوں کو حقیر سمجھتے ہیں۔ 245-246}۔"
  tr: "Suriye, Irak ve Cezire sınırlarında bulunan El-Furat Muharebesi: Halid, El-Radab'dan oraya yürüdü ve seferlerin devamlılığı nedeniyle Ramazan orucunu orada bozdu. Romalılar toparlandılar ve Pers garnizonlarından yardım istediler; Teğlib, İyad ve El-Nimr kabileleri de onlara katıldı. Halid'e, \"Ya sen bize geçersin, ya da biz sana geçeriz\" dediler. Halid, \"Bizim altımızdan geçin\" diye cevap verdi. Romalılar, \"Kimin direndiğini, kimin kaçtığını görelim diye kendinizi ayırt edin\" dediler. Büyük bir savaş çıktı ve Romalılar ile müttefikleri yenildi. Halid, Müslümanlara kuşatmayı kaldırmamalarını emretti. Savaşta ve takipte yüz bin kişi öldü. On gün El-Furat'ta kaldı, ardından Zilhicce ayının bitimine beş gün kala El-Hirah'a dönme izni verdi. Şacer ibn el-A'azz'ı artçı birliğin komutanlığına atadı ve orada bulunuyormuş gibi yaptı. Sonra birkaç arkadaşıyla birlikte gizlice Furat'tan hacca gitti ve ülkeyi dolaştı. Hac ibadetini yerine getirdi ve artçı birliğin komutanıyla birlikte geri döndü; ikisi de saçlarını kazıtmıştı. Ebu Bekir bunu ancak dönüşünden sonra öğrendi ve onu azarladı. Ali zamanında, Irak halkı Muaviye hakkında bir şey duyduğunda, \"Biz Dhat el-Salasil halkıyız\" derlerdi ve onunla Furat arasındaki bölgeyi sayarlardı, sonrasında gelenleri ise küçümseyerek anmazlardı. {Kaynak: Kamil ibn el-Ashir s. 245-246}"
  id: "Perang Al-Furath, di perbatasan Suriah, Irak, dan Jazira: Khalid berangkat ke sana dari Al-Radhab dan berbuka puasa Ramadan di sana karena kelanjutan kampanye. Pasukan Romawi berkumpul dan meminta bantuan dari garnisun Persia, dan suku Taghlib, Iyad, dan Al-Nimr bergabung dengan mereka. Mereka berkata kepada Khalid, \"Entah kau menyeberang ke arah kami, atau kami akan menyeberang ke arahmu.\" Dia menjawab, \"Menyeberanglah di bawah kami.\" Pasukan Romawi berkata, \"Tunjukkan keberanian kalian agar kami dapat melihat siapa yang bertahan dan siapa yang melarikan diri.\" Pertempuran besar pun terjadi, dan pasukan Romawi beserta sekutunya dikalahkan. Khalid memerintahkan kaum Muslimin untuk tidak menghentikan pengepungan. Seratus ribu orang tewas dalam pertempuran dan pengejaran. Dia tinggal di Al-Furath selama sepuluh hari, kemudian memberi izin untuk kembali ke Al-Hirah lima hari sebelum berakhirnya Dzul Qi'dah. Dia menempatkan Shajar ibn al-A'azz sebagai komandan barisan belakang dan membuatnya tampak seolah-olah dia ada di sana. Kemudian dia diam-diam pergi berziarah dari Al-Furath bersama beberapa sahabatnya, melintasi negeri itu. Dia menunaikan ibadah haji dan kembali bersama komandan barisan belakang, yang keduanya telah mencukur rambut kepala mereka. Abu Bakr tidak mengetahui hal ini sampai setelah kepulangannya dan menegurnya. Pada masa Ali, ketika penduduk Irak mendengar sesuatu tentang Muawiyah, mereka akan berkata, “Kami adalah penduduk Dhat al-Salasil,” dan mereka akan menyebutkan daerah antara itu dan al-Furad, dan mereka tidak akan menyebutkan apa yang ada setelahnya, dengan meremehkan apa yang ada setelahnya. {cite:kamil-ibn-al-athir hlm. 245-246}."
