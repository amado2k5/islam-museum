summary:
  ar: "وقعة الفراض، وهي تخوم الشام والعراق والجزيرة: سار إليها خالد من الرضاب وأفطر بها رمضان لاتصال الغزوات، وحميت الروم واستعانوا بمسالح الفرس واجتمعت معهم تغلب وإياد والنمر. قالوا لخالد إما أن تعبر إلينا وإما أن نعبر إليك فقال اعبروا أسفل منا، وقالت الروم امتازوا حتى نعرف من يثبت ممن يولّي، فاقتتلوا قتالًا عظيمًا وانهزمت الروم ومن معهم وأمر خالد المسلمين أن لا يرفعوا عنهم فقُتل في المعركة والطلب مائة ألف، وأقام على الفراض عشرًا ثم أذن بالرجوع إلى الحيرة لخمس بقين من ذي القعدة وجعل شجر بن الأعز على الساقة وأظهر أنه فيها. ثم خرج حاجًّا من الفراض سرًّا ومعه عدة من أصحابه يعتسف البلاد فحج ورجع مع صاحب الساقة وقد حلّقوا رؤوسهم فلم يعلم أبو بكر إلا بعد رجوعه فعتب عليه. وكان أهل العراق أيام عليّ إذا بلغهم عن معاوية شيء قالوا نحن أصحاب ذات السلاسل ويسمّون ما بينها وبين الفراض ولا يذكرون ما بعدها احتقارًا لما كان بعدها {cite:kamil-ibn-al-athir p. 245-246}."
  en: "Al-Firad, at the meeting-point of Syria, Iraq and the Jazira: Khalid broke his Ramadan fast there for unbroken campaigning, faced a coalition of Byzantines, Persian border-troops and the Arab tribes Taghlib, Iyad and al-Namir, let them cross below his position — 'cross over', he told them — then annihilated them, a hundred thousand said to be killed in the fight and pursuit, and held the field ten days. From al-Firad he slipped away in secret on Hajj, letting his rear-guard commander impersonate him; Abu Bakr learned of it only on his return and reproached him. The 'Iraqis of 'Ali's day would say 'we are the men of Dhat al-Salasil' and name everything between it and al-Firad, contemptuous of whatever came after {cite:kamil-ibn-al-athir p. 245-246}."
