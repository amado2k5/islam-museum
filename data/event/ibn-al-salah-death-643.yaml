id: event/ibn-al-salah-death-643
class: event
kind: death
label:
  ar: "وفاة ابن الصلاح بدمشق ودفنه بمقابر الصوفية، ٢٥ ربيع الآخر ٦٤٣هـ/سبتمبر ١٢٤٥م"
  en: "Death of Ibn al-Salah at Damascus and burial in the Sufi cemetery, 25 Rabi' II 643/Sept. 1245"
  ur: "دمشق میں ابن الصلاح کی وفات اور صوفیہ کے قبرستان میں تدفین، 25 ربیع الآخر 643ھ/ستمبر 1245ء"
  es: "Muerte de Ibn al-Salah en Damasco y sepultura en el cementerio sufí, 25 de Rabi' II de 643/septiembre de 1245."
  fr: "Décès d'Ibn al-Salah à Damas et inhumation au cimetière soufi, le 25 Rabi' II 643/septembre 1245"
  tr: "İbn al-Salah, Hicri 643 yılının Rebiü'l-Sani ayının 25'inde Şam'da vefat etti ve Sufi mezarlığına defnedildi."
  id: "Ibn al-Salah wafat di Damaskus dan dimakamkan di pemakaman Sufi, 25 Rabi' al-Thani 643 H / September 1245 M"
summary:
  ar: "انتقل ابن الصلاح إلى رحمة الله في سحر يوم الأربعاء الخامس والعشرين من ربيع الآخر سنة ثلاث وأربعين وستمائة بدمشق، وحُمل على الرؤوس وازدحم عليه الخلق، فصُلي عليه بالجامع ثم بداخل باب الفرج ثانيةً، ورجع الناس لأجل حصار البلد بالخوارزمية فخرجوا به دون العشرة ودفنوه بمقابر الصوفية وقبره في طرفها الغربي على الطريق ظاهر؛ وعاش ستة وستين سنة {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
  en: "Ibn al-Salah passed away at dawn on Wednesday, the twenty-fifth of Rabi' II 643 (September 1245) at Damascus. He was carried on shoulders and the crowds pressed round him; the prayer was held at the Jami', then a second prayer inside Bab al-Faraj, and the people turned back because of the Khwarazmian siege of the city, so fewer than ten bore him out and buried him in the Sufi cemetery, his grave visible on the road at its western edge. He was sixty-six {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
  ur: "ابن الصلاح بدھ کی سحری 25 ربیع الآخر 643ھ ⁦(ستمبر 1245ء)⁩ کو دمشق میں انتقال کر گئے۔ جنازہ سروں پر اٹھایا گیا اور لوگوں کا ہجوم تھا؛ جامع میں نماز پڑھی گئی، پھر باب الفرج کے اندر دوسری نماز، اور خوارزموں کے محاصرے کی وجہ سے لوگ واپس لوٹ گئے تو دس سے کم افراد انہیں لے جا کر صوفیہ کے قبرستان میں دفن کیا، قبر اس کے مغربی کنارے راستے پر ظاہر ہے۔ وہ چھیاسٹھ برس کے تھے {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}۔"
  es: "Ibn al-Salah falleció al amanecer del miércoles 25 de Rabi' II de 643 (septiembre de 1245) en Damasco. Fue llevado en hombros y la multitud se agolpó a su alrededor; se realizó la oración en el Jami', luego una segunda oración dentro de Bab al-Faraj, y la gente tuvo que retroceder debido al asedio de la ciudad por parte de los corasmios, por lo que menos de diez personas lo sacaron y lo enterraron en el cementerio sufí, cuya tumba es visible en el camino en su extremo occidental. Tenía sesenta y seis años. {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
  fr: "Ibn al-Salah s'éteignit à l'aube du mercredi 25 Rabi' II 643 (septembre 1245) à Damas. Porté sur les épaules, il fut entouré d'une foule compacte. La prière eut lieu à la mosquée Jami', puis une seconde prière à l'intérieur de la porte Bab al-Faraj. Le siège de la ville par les Khwarezmiens obligea la foule à rebrousser chemin; moins de dix personnes le portèrent et l'inhumèrent au cimetière soufi, sa tombe étant visible depuis la route, à son extrémité ouest. Il avait soixante-six ans."
  tr: "İbn el-Salah, 643 yılında, Rebiü'l-Sani ayının 25. Çarşamba günü şafak vaktinde Şam'da vefat etti. Cenazesi başlarda taşınarak insanların etrafına toplandı. Cenaze namazı önce camide, sonra da Bab el-Faraj'da ikinci kez kılındı. Şehrin Harezmliler tarafından kuşatılması nedeniyle insanlar geri döndüler ve onu on kişiden az bir grupla dışarı çıkarıp Sufi mezarlıklarına defnettiler. Mezarı, yolun batı tarafında, görülebilir bir yerdedir. Altmış altı yıl yaşamıştır. {cite:tarikh-islam-dhahabi s. 188} {cite:shadharat-dhahab s. 230}"
  id: "Ibn al-Salah wafat pada subuh hari Rabu, tanggal 25 Rabi' al-Thani, tahun 643, di Damaskus. Jenazahnya diusung di atas kepala orang-orang dan orang-orang berkerumun di sekelilingnya. Shalat jenazah dilakukan untuknya di masjid dan kemudian di dalam Bab al-Faraj untuk kedua kalinya. Orang-orang kembali karena pengepungan kota oleh kaum Khwarazmian, sehingga mereka mengeluarkan jenazahnya dengan kurang dari sepuluh orang dan menguburkannya di pemakaman Sufi. Makamnya berada di sisi barat jalan, terlihat jelas. Ia hidup selama enam puluh enam tahun. {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
