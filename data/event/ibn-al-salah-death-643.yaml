id: event/ibn-al-salah-death-643
class: event
kind: death
label:
  ar: "وفاة ابن الصلاح بدمشق ودفنه بمقابر الصوفية، ٢٥ ربيع الآخر ٦٤٣هـ/سبتمبر ١٢٤٥م"
  en: "Death of Ibn al-Salah at Damascus and burial in the Sufi cemetery, 25 Rabi' II 643/Sept. 1245"
  ur: "دمشق میں ابن الصلاح کی وفات اور صوفیہ کے قبرستان میں تدفین، 25 ربیع الآخر 643ھ/ستمبر 1245ء"
summary:
  ar: "انتقل ابن الصلاح إلى رحمة الله في سحر يوم الأربعاء الخامس والعشرين من ربيع الآخر سنة ثلاث وأربعين وستمائة بدمشق، وحُمل على الرؤوس وازدحم عليه الخلق، فصُلي عليه بالجامع ثم بداخل باب الفرج ثانيةً، ورجع الناس لأجل حصار البلد بالخوارزمية فخرجوا به دون العشرة ودفنوه بمقابر الصوفية وقبره في طرفها الغربي على الطريق ظاهر؛ وعاش ستة وستين سنة {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
  en: "Ibn al-Salah passed away at dawn on Wednesday, the twenty-fifth of Rabi' II 643 (September 1245) at Damascus. He was carried on shoulders and the crowds pressed round him; the prayer was held at the Jami', then a second prayer inside Bab al-Faraj, and the people turned back because of the Khwarazmian siege of the city, so fewer than ten bore him out and buried him in the Sufi cemetery, his grave visible on the road at its western edge. He was sixty-six {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}."
  ur: "ابن الصلاح بدھ کی سحری 25 ربیع الآخر 643ھ ⁦(ستمبر 1245ء)⁩ کو دمشق میں انتقال کر گئے۔ جنازہ سروں پر اٹھایا گیا اور لوگوں کا ہجوم تھا؛ جامع میں نماز پڑھی گئی، پھر باب الفرج کے اندر دوسری نماز، اور خوارزموں کے محاصرے کی وجہ سے لوگ واپس لوٹ گئے تو دس سے کم افراد انہیں لے جا کر صوفیہ کے قبرستان میں دفن کیا، قبر اس کے مغربی کنارے راستے پر ظاہر ہے۔ وہ چھیاسٹھ برس کے تھے {cite:tarikh-islam-dhahabi p. 188} {cite:shadharat-dhahab p. 230}۔"
