id: event/siege-of-lahore-1241
class: event
kind: siege
label:
  ar: "المغول يأخذون لاهور ويسلبونها، ٦٣٩هـ/١٢٤١م"
  en: "The Mongols take and sack Lahore, 639/1241"
  ur: "منگولوں کا لہور پر قبضہ اور لٹ مار، 639ھ/1241ء"
summary:
  ar: "في زمن خلفاء إلتمش الضعفاء كثر تمرد ولاة لاهور، وكان كبير خان أياز مستقلًا فيها فعليًا حين أخذها المغول وسلبوها سنة ٦٣٩هـ/١٢٤١م؛ غير أنهم لم يتبعوا نصرهم بل هجروا المدينة فورًا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "Under Iltutmish's weak successors the governors of Lahore were frequently in rebellion, and Kabir Khan Ayaz was virtually independent there when the Mongols took and sacked the city in 639/1241; they did not follow up their victory but abandoned it immediately {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "التتمش کے کمزور جانشینوں کے زمانے میں لہور کے گورنر اکثر باغی رہتے تھے اور کبیر خان ایاز وہاں عملاً خود مختار تھا جب 639ھ/1241ء میں منگولوں نے شہر پر قبضہ کر کے اسے لوٹا؛ لیکن انہوں نے اپنی فتح کا پیچھا نہ کیا اور شہر کو فوراً چھوڑ دیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
