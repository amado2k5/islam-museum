id: event/siege-of-lahore-1241
class: event
kind: siege
label:
  ar: "المغول يأخذون لاهور ويسلبونها، ٦٣٩هـ/١٢٤١م"
  en: "The Mongols take and sack Lahore, 639/1241"
  ur: "منگولوں کا لہور پر قبضہ اور لٹ مار، 639ھ/1241ء"
  es: "Los mongoles toman y saquean Lahore, 639/1241"
  fr: "Les Mongols prennent et pillent Lahore, 639/1241"
  tr: "Babürler, Hicri 639/Miladi 1241 yılında Lahor'u ele geçirip yağmaladı."
  id: "Dinasti Mughal merebut dan menjarah Lahore, 639 H/1241 M"
summary:
  ar: "في زمن خلفاء إلتمش الضعفاء كثر تمرد ولاة لاهور، وكان كبير خان أياز مستقلًا فيها فعليًا حين أخذها المغول وسلبوها سنة ٦٣٩هـ/١٢٤١م؛ غير أنهم لم يتبعوا نصرهم بل هجروا المدينة فورًا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "Under Iltutmish's weak successors the governors of Lahore were frequently in rebellion, and Kabir Khan Ayaz was virtually independent there when the Mongols took and sacked the city in 639/1241; they did not follow up their victory but abandoned it immediately {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "التتمش کے کمزور جانشینوں کے زمانے میں لہور کے گورنر اکثر باغی رہتے تھے اور کبیر خان ایاز وہاں عملاً خود مختار تھا جب 639ھ/1241ء میں منگولوں نے شہر پر قبضہ کر کے اسے لوٹا؛ لیکن انہوں نے اپنی فتح کا پیچھا نہ کیا اور شہر کو فوراً چھوڑ دیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  es: "Bajo los débiles sucesores de Iltutmish, los gobernadores de Lahore se rebelaron con frecuencia, y Kabir Khan Ayaz era prácticamente independiente allí cuando los mongoles tomaron y saquearon la ciudad en 639/1241; no aprovecharon su victoria, sino que la abandonaron inmediatamente {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  fr: "Sous les faibles successeurs d'Iltutmish, les gouverneurs de Lahore étaient fréquemment en rébellion, et Kabir Khan Ayaz y était pratiquement indépendant lorsque les Mongols prirent et pillèrent la ville en 639/1241; ils ne profitèrent pas de leur victoire mais l'abandonnèrent immédiatement {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  tr: "İltutmiş'in zayıf halefleri döneminde Lahor valilerinin isyanı arttı ve Kabir Han Ayaz, Moğollar 639 Hicri/1241 Miladi yılında şehri ele geçirip yağmaladığında fiilen bağımsızdı; ancak Moğollar zaferlerinin ardından şehri hemen terk ettiler {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  id: "Pada masa pemerintahan penerus Iltutmish yang lemah, pemberontakan para gubernur Lahore meningkat, dan Kabir Khan Ayaz secara efektif independen dalam pemberontakan tersebut ketika bangsa Mongol merebut dan menjarahnya pada tahun 639 H/1241 M; namun, mereka tidak mengikuti kemenangan tersebut tetapi segera meninggalkan kota itu {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
