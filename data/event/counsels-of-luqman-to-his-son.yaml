id: event/counsels-of-luqman-to-his-son
class: event
kind: other
label:
  ar: وصايا لقمان لابنه وأقواله المأثورة
  en: Luqman's counsels to his son and his reported sayings
  ur: لقمان کی اپنے بیٹے کو نصیحتیں اور ان کے منقول اقوال
summary:
  ar: 'يشرح ابن كثير والقرطبي وصايا لقمان لابنه في سورة لقمان 13-19: النهي عن الشرك والتذكير بعلم الله بالخفي والأمر بالصلاة والمعروف والصبر والتواضع والاقتصاد في المشي وخفض الصوت {cite:tafsir-ibn-kathir scan vol. 1 p. 3608} {cite:tafsir-ibn-kathir scan vol. 1 p. 3610} {cite:tafsir-ibn-kathir scan vol. 1 p. 3611}؛ ثم يذكر ابن كثير أقوالاً أخرى تُنسب إلى لقمان، كل منها بإسناده {cite:tafsir-ibn-kathir scan vol. 1 p. 3612} {cite:tafsir-ibn-kathir scan vol. 1 p. 3613}؛ ويذكر الخلاف في نبوته فجمهور السلف أنه حكيم لا نبي {cite:tafsir-ibn-kathir scan vol. 1 p. 3606} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5371}.'
  en: 'Ibn Kathir and al-Qurtubi explain Luqman''s counsels to his son in Qur''an 31:13-19: against shirk, reminders that God knows what is hidden, prayer, enjoining good, patience, humility, moderation in walking and a lowered voice {cite:tafsir-ibn-kathir scan vol. 1 p. 3608} {cite:tafsir-ibn-kathir scan vol. 1 p. 3610} {cite:tafsir-ibn-kathir scan vol. 1 p. 3611}; Ibn Kathir then gives further sayings attributed to Luqman, each with its own chain {cite:tafsir-ibn-kathir scan vol. 1 p. 3612} {cite:tafsir-ibn-kathir scan vol. 1 p. 3613}, and notes that most early scholars held him to be a sage and not a prophet {cite:tafsir-ibn-kathir scan vol. 1 p. 3606} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5371}.'
  ur: 'ابن کثیر اور قرطبی سورۃ لقمان 13-19 میں لقمان کی بیٹے کو نصیحتوں کی تشریح کرتے ہیں: شرک سے ممانعت، پوشیدہ باتوں میں اللہ کے علم کی یاد دہانی، نماز، امر بالمعروف، صبر، تواضع، چال میں اعتدال اور آواز پست رکھنا {cite:tafsir-ibn-kathir scan vol. 1 p. 3608} {cite:tafsir-ibn-kathir scan vol. 1 p. 3610} {cite:tafsir-ibn-kathir scan vol. 1 p. 3611}؛ پھر ابن کثیر لقمان سے منسوب دوسرے اقوال ان کی اپنی اسناد کے ساتھ لاتے ہیں {cite:tafsir-ibn-kathir scan vol. 1 p. 3612} {cite:tafsir-ibn-kathir scan vol. 1 p. 3613}، اور بتاتے ہیں کہ جمہور سلف کے نزدیک وہ حکیم تھے، نبی نہیں {cite:tafsir-ibn-kathir scan vol. 1 p. 3606} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5371}۔'
