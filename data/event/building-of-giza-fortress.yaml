id: event/building-of-giza-fortress
class: event
kind: founding
label:
  ar: بناء حصن الجيزة
  en: Building of the Giza fortress
  ur: جیزہ کے قلعے کی تعمیر
summary:
  ar: بنى عمرو بن العاص لهمدان ومن والاهم حصناً بالجيزة من فيء المسلمين، بأمر عمر، لما أبوا أن يتحولوا إلى الفسطاط، فبدأه سنة إحدى وعشرين وفرغ منه سنة اثنتين وعشرين {cite:futuh-misr-amir-1999 p. 175} {cite:futuh-misr-amir-1999 p. 176}.
  en: Amr ibn al-As built a fortress at Giza from the Muslims' fay' for Hamdan and their allies, on Umar's order, when they refused to move to al-Fustat; he began it in the year 21 and finished it in the year 22 {cite:futuh-misr-amir-1999 p. 175} {cite:futuh-misr-amir-1999 p. 176}.
  ur: عمرو بن العاص نے عمر کے حکم پر مسلمانوں کے فے سے ہمدان اور ان کے حلیفوں کے لیے جیزہ میں قلعہ بنایا جب انہوں نے فسطاط منتقل ہونے سے انکار کیا؛ اس کی تعمیر سنہ 21 میں شروع ہوئی اور سنہ 22 میں مکمل ہوئی {cite:futuh-misr-amir-1999 p. 175} {cite:futuh-misr-amir-1999 p. 176}۔
