label: { ar: "تسلطن بدر الدين لؤلؤ بالموصل وانقراض البيت الأتابكي سنة 631", en: "Badr al-Din Lu'lu' Made Sultan at Mosul and the End of the Atabegid House in 631", es: "Badr al-Din Lu'lu' fue nombrado sultán en Mosul y se produjo el fin de la dinastía Atabegid en 631.", fr: "Badr al-Din Lu'lu' est nommé sultan à Mossoul et marque la fin de la dynastie atabégide en 631.", ur: "بدر الدین لولو نے 631 میں موصل میں سلطان بنایا اور عتبیگیڈ ہاؤس کا خاتمہ", tr: "Badr al-Din Lu'lu' Musul Sultanı oldu ve Atabeg hanedanlığı 631 Hicri yılında sona erdi.", id: "Badr al-Din Lu'lu' menjadi Sultan Mosul dan dinasti Atabeg berakhir pada tahun 631 Hijriah." }
summary:
  ar: "في سنة إحدى وثلاثين وستمائة تسلطن بدر الدين لؤلؤ بالموصل وانقرض البيت الأتابكي {cite:shadharat-dhahab p. 143}؛ وكان لؤلؤ قد استولى على البلد سنة إحدى وعشرين وخنق ابن أستاذه الملك القاهر فظل يدبر المملكة عشر سنين باسم الأتابكية حتى جلس للملك رسمياً وخطب له على المنابر."
  en: "In 631 Badr al-Din Lu'lu' was formally sultan at Mosul and the Atabegid (Zangid) house was extinguished — ten years after he had seized the city in 621 and strangled his master's son, ruling meanwhile in the Atabegid name {cite:shadharat-dhahab p. 143}."
  es: "En 631, Badr al-Din Lu'lu' fue formalmente sultán en Mosul y la casa Atabegid (Zangid) se extinguió, diez años después de que se apoderara de la ciudad en 621 y estrangulara al hijo de su señor, gobernando mientras tanto en nombre de los Atabegid {cite:shadharat-dhahab p. 143}."
  fr: "En 631, Badr al-Din Lu'lu' était officiellement sultan de Mossoul et la maison Atabegid (Zangid) s'éteignit — dix ans après qu'il eut pris la ville en 621 et étranglé le fils de son maître, régnant entre-temps sous le nom Atabegid {cite:shadharat-dhahab p. 143}."
  ur: "631 میں بدر الدین لولو باضابطہ طور پر موصل کا سلطان تھا اور عتبیگید ⁦(زنگید)⁩ کا گھر بجھا دیا گیا تھا - دس سال بعد جب اس نے 621 میں شہر پر قبضہ کر لیا تھا اور اپنے آقا کے بیٹے کا گلا گھونٹ دیا تھا، اس دوران عتبیگیڈ نام پر حکومت کرتا تھا۔ 143}۔"
  tr: "Hicri 631 yılında Bedir din Lulu, Musul Sultanı oldu ve Atabeg hanedanlığı sona erdi {kaynak: Şadharat-Dhaba s. 143}. Lulu, Hicri 621 yılında ülkenin kontrolünü ele geçirmiş ve efendisi Kral Kayir'in oğlunu boğarak öldürmüştü. On yıl boyunca Atabegler adına krallığı yönetmeye devam etti, daha sonra resmen kral oldu ve minberlerde kendi adına vaazlar verdi."
  id: "Pada tahun 631 H, Badr al-Din Lu’lu’ menjadi Sultan Mosul dan dinasti Atabeg berakhir {cite:shadharat-dhahab hlm. 143}. Lu’lu’ telah merebut kendali negara pada tahun 621 H dan mencekik putra tuannya, Raja al-Qahir. Ia terus memerintah kerajaan selama sepuluh tahun atas nama dinasti Atabeg hingga ia secara resmi duduk sebagai raja dan khotbah-khotbah disampaikan atas namanya di mimbar-mimbar."
