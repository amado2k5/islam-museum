id: event/conquest-of-sind-89
class: event
kind: conquest
label: { ar: "فتح السند", en: "The Conquest of Sind", es: "La conquista de Sind", fr: "La conquête du Sind" }
summary:
  ar: "أعدّ الحجاج بن يوسف الثقفي فتح إقليم السند بعد استقرار أمره في جنوب بلاد فارس، وأسنده إلى ابن عمه محمد بن القاسم الثقفي، وكان دون العشرين من عمره، وأمده بستة آلاف جندي من أهل الشام. انطلق من مقاطعة مهران، فحاصر الديبل بعد قتال دام ثلاثة أيام، وترك بها حامية وبنى لها مسجداً، ثم تابع إلى البيرون وراوَد وبرهمناباذ والرور وبهرور، وعبر نهر بياس إلى الملتان. وذكر الكتاب أن الحجاج توفي وابن القاسم في الفتح، ثم عزله سليمان بن عبد الملك عن القيادة وسجنه حتى مات {cite:umayyad-birth-to-fall-2006 p. 50}{cite:umayyad-birth-to-fall-2006 p. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
  en: "Al-Hajjaj ibn Yusuf al-Thaqafi prepared the conquest of the province of Sind once his authority was settled in southern Persia, and entrusted it to his cousin Muhammad ibn al-Qasim al-Thaqafi, who was under twenty years of age, supplying him with six thousand soldiers from Syria. Setting out from the district of Mahran, he besieged al-Daybul after three days of fighting, left a garrison there and built it a mosque, then advanced through al-Bayrun, Rawwad, Brahmanabad, al-Rur and Bahrur, and crossed the Bias river to Multan. The book mentions that al-Hajjaj died while Ibn al-Qasim was still on the campaign, after which Sulayman ibn Abd al-Malik removed him from command and imprisoned him until he died {cite:umayyad-birth-to-fall-2006 p. 50}{cite:umayyad-birth-to-fall-2006 p. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
  es: "Al-Hajjaj ibn Yusuf al-Thaqafi preparó la conquista de la provincia de Sind una vez que su autoridad se estableció en el sur de Persia, y se la confió a su primo Muhammad ibn al-Qasim al-Thaqafi, que era menor de veinte años, proporcionándole seis mil soldados de Siria. Partiendo del distrito de Mahran, sitió al-Daybul después de tres días de lucha, dejó una guarnición allí y construyó una mezquita, luego avanzó a través de al-Bayrun, Rawwad, Brahmanabad, al-Rur y Bahrur, y cruzó el río Bias hasta Multan. El libro menciona que al-Hajjaj murió mientras Ibn al-Qasim todavía estaba en la campaña, después de lo cual Sulayman ibn Abd al-Malik lo destituyó del mando y lo encarceló hasta su muerte {cite:umayyad-birth-to-fall-2006 p. 50}{cite:umayyad-birth-to-fall-2006 p. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
  fr: "Al-Hajjaj ibn Yusuf al-Thaqafi, une fois son autorité établie dans le sud de la Perse, prépara la conquête de la province du Sind et la confia à son cousin Muhammad ibn al-Qasim al-Thaqafi, alors âgé de moins de vingt ans, en lui fournissant six mille soldats venus de Syrie. Partant du district de Mahran, il assiégea al-Daybul après trois jours de combats, y laissa une garnison et y fit construire une mosquée, puis progressa à travers al-Bayrun, Rawwad, Brahmanabad, al-Rur et Bahrur, et traversa la rivière Bias pour atteindre Multan. L'ouvrage mentionne qu'al-Hajjaj mourut alors qu'Ibn al-Qasim était encore en campagne, après quoi Sulayman ibn Abd al-Malik le destitua de son commandement et l'emprisonna jusqu'à sa mort. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
