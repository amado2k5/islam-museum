  start: { hijri: "0089", precision: year, status: historical, note: "يذكر الكتاب المدة (٨٩–٩٦هـ) في موضع (ص50)، وفي موضع آخر من الصفحة نفسها يكتب السنة «٥٨٩» ولعله خطأ مطبعي؛ لم يُحوَّل إلى الميلادي." }
  end: { hijri: "0096", precision: year, status: historical, note: "المدة كما يذكرها الكتاب (ص50)؛ لم يُحوَّل إلى الميلادي." }
