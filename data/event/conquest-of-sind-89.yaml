id: event/conquest-of-sind-89
class: event
kind: conquest
label: { ar: "فتح السند", en: "The Conquest of Sind" }
summary:
  ar: "أعدّ الحجاج بن يوسف الثقفي فتح إقليم السند بعد استقرار أمره في جنوب بلاد فارس، وأسنده إلى ابن عمه محمد بن القاسم الثقفي، وكان دون العشرين من عمره، وأمده بستة آلاف جندي من أهل الشام. انطلق من مقاطعة مهران، فحاصر الديبل بعد قتال دام ثلاثة أيام، وترك بها حامية وبنى لها مسجداً، ثم تابع إلى البيرون وراوَد وبرهمناباذ والرور وبهرور، وعبر نهر بياس إلى الملتان. وذكر الكتاب أن الحجاج توفي وابن القاسم في الفتح، ثم عزله سليمان بن عبد الملك عن القيادة وسجنه حتى مات {cite:umayyad-birth-to-fall-2006 p. 50}{cite:umayyad-birth-to-fall-2006 p. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
  en: "Al-Hajjaj ibn Yusuf al-Thaqafi prepared the conquest of the province of Sind once his authority was settled in southern Persia, and entrusted it to his cousin Muhammad ibn al-Qasim al-Thaqafi, who was under twenty years of age, supplying him with six thousand soldiers from Syria. Setting out from the district of Mahran, he besieged al-Daybul after three days of fighting, left a garrison there and built it a mosque, then advanced through al-Bayrun, Rawwad, Brahmanabad, al-Rur and Bahrur, and crossed the Bias river to Multan. The book mentions that al-Hajjaj died while Ibn al-Qasim was still on the campaign, after which Sulayman ibn Abd al-Malik removed him from command and imprisoned him until he died {cite:umayyad-birth-to-fall-2006 p. 50}{cite:umayyad-birth-to-fall-2006 p. 51}{cite:umayyad-birth-to-fall-2006 p. 52}."
