id: event/qutayba-sulayman-estrangement
class: event
kind: other
label: { ar: "استيحاش قتيبة من سليمان بن عبد الملك", en: "Qutayba's Estrangement from Sulayman", es: "El alejamiento de Qutayba de Sulayman", fr: "L'éloignement de Qutayba de Sulayman", ur: "قتیبہ کی سلیمان سے علیحدگی" }
summary:
  ar: "كان قتيبة مستوحشاً من سليمان بن عبد الملك وذلك أنه سعى في بيعة عبد العزيز بن الوليد فأراد دفعها عن سليمان فلما مات الوليد وقام سليمان خطب الناس فذم هبنقة العائشي وهو يزيد بن تزوان الذي كان يؤثر سمان إبله بالعلف والمرعى ويقول أنا لا أصلح ما أفسد الله ودعا الناس إلى خلعه فلم يجبه أحد إلى ذلك فشتم بني تميم ونسبهم إلى الغدر وقال لستم ببني تميم ولكنكم بني ذميم وذم بني بكر بن وائل وقال يا إخوة مسلمة وذم الأزد فقال بدلتم الرماح بالمرادي وبالسفن أعنة الحصن وقال يا أهل السافلة ولا أقول أهل العالية لا ضعنكم بحيث وضعكم الله فكتب سليمان إلى قتيبة بالولاية وأمره بإطلاق كل من في حبسه وأن يعطي الناس أعطياتهم ويأذن لمن أراد القفول في القفول وأمر رسوله بإعلام الناس ما كتب به فقال قتيبة هذا من تدبيره علي وقام فقال أيها الناس إن سليمان قد مناكم مخ أعضاد البعوض وإنكم ستدعون إلى بيعة أنور صبي لا تحل ذبيحته وكانوا حنقين عليه لشتمه إياهم فاعتذر من ذلك وقال إني غضبت فلم أدر ما قلت وما أردت لكم إلا الخير فتكلموا وقالوا إن أذن لنا في القفول كان خيراً له وإن لم يفعل فلا يلومن إلا نفسه."
  en: "Qutayba dreaded Sulayman, having backed Abd al-Aziz ibn al-Walid for the succession. When al-Walid died Sulayman took the pulpit and railed at Habanqa al-'A'ishi — Yazid ibn Tazwan, who prized fat camels saying 'I do not mend what God has corrupted' — then at Tamim ('not Banu Tamim but Banu Dhamim'), Bakr ibn Wa'il, and the Azd, 'ya ahl al-safila — I will not say ahl al-'aliya — may He set you where He set you'. His letter granting Qutayba the governorship came with orders to free prisoners, pay stipends and permit departures — broadcast by the messenger — and Qutayba called it his design, telling the people 'Sulayman has made you great as mosquitoes' marrow, and you will yet be asked bay'a to Anwar, a boy whose slaughter is unlawful'. Stung by his curses they heard his apology — 'I was angry, knew not what I said' — and answered: if he lets us go home, good; if not, he blames only himself."
  es: "Qutayba temía a Sulayman, pues había apoyado a Abd al-Aziz ibn al-Walid para la sucesión. Cuando al-Walid murió, Sulayman subió al púlpito y arremetió contra Habanqa al-'A'ishi —Yazid ibn Tazwan, quien apreciaba los camellos gordos diciendo: «No reparo lo que Dios ha corrompido»—, luego contra Tamim («no Banu Tamim sino Banu Dhamim»), Bakr ibn Wa'il y Azd, «ya ahl al-safila —no diré ahl al-'aliya— que Él os coloque donde Él os coloque». Su carta otorgando a Qutayba el gobierno venía con órdenes de liberar prisioneros, pagar estipendios y permitir salidas —difundidas por el mensajero— y Qutayba lo llamó su designio, diciendo al pueblo: «Sulayman os ha hecho tan grandes como la médula de los mosquitos, y aún se os pedirá bay'a a Anwar, un muchacho cuya matanza es ilícita». Molestos por sus insultos, oyeron su disculpa —«Estaba enfadado, no sabía lo que decía»— y respondieron: si nos deja ir a casa, bien; si no, solo tendrá la culpa él mismo."
  fr: "Qutayba redoutait Sulayman, ayant soutenu Abd al-Aziz ibn al-Walid pour la succession. À la mort d'al-Walid, Sulayman prit la parole et s'en prit violemment à Habanqa al-'A'ishi – Yazid ibn Tazwan, qui appréciait les chameaux gras, déclarant: « Je ne répare pas ce que Dieu a corrompu » – puis à Tamim (« non pas les Banu Tamim, mais les Banu Dhamim »), Bakr ibn Wa'il et les Azd, s'écriant: « Ya ahl al-safila » – « Je ne dirai pas ahl al-'aliya » – « Qu'Il vous remette là où Il vous a remis ». Sa lettre accordant le poste de gouverneur à Qutayba s'accompagnait d'ordres de libération des prisonniers, de versement des pensions et d'autorisation des départs – ordres diffusés par le messager – et Qutayba affirma que c'était son dessein, déclarant au peuple: « Sulayman vous a rendus aussi puissants que la moelle des moustiques, et pourtant on vous demandera de prêter allégeance à Anwar, un garçon dont le meurtre est illicite. » Piqués au vif par ses injures, ils entendirent ses excuses — « J'étais en colère, je ne savais pas ce que je disais » — et répondirent: s'il nous laisse rentrer chez nous, tant mieux; sinon, il ne peut s'en prendre qu'à lui-même."
  ur: "قتیبہ سلیمان سے خوفزدہ تھا، اس نے جانشینی کے لیے عبد العزیز ابن الولید کی حمایت کی۔ جب الولید کا انتقال ہو گیا تو سلیمان نے منبر لیا اور حبانقہ العاشی پر چڑھائی - یزید بن تزوان، جس نے موٹے اونٹوں کو یہ کہہ کر قیمتی قرار دیا تھا کہ 'میں اس چیز کو ٹھیک نہیں کرتا جو خدا نے خراب کیا ہے' - پھر تمیم ⁦('بنو تمیم نہیں بلکہ بنو ثم')⁩، بکر ابن واعیل - اور بکر بن عضلی نے کہا: اہل عالیہ - وہ آپ کو وہاں رکھے جہاں اس نے آپ کو رکھا ہے۔ قتیبہ کو گورنری دینے والا اس کا خط قیدیوں کو آزاد کرنے، وظیفہ ادا کرنے اور روانگی کی اجازت دینے کے احکامات کے ساتھ آیا تھا - جو قاصد کے ذریعہ نشر کیا گیا تھا - اور قتیبہ نے اسے اپنا ڈیزائن قرار دیا، لوگوں سے کہا کہ 'سلیمان نے تم کو مچھروں کے گودے کی طرح عظیم بنا دیا ہے، اور پھر بھی تم سے بیعت پوچھی جائے گی کہ انور کس کا لڑکا ہے'۔ اس کی لعنتوں سے گھبرا کر انہوں نے اس کی معافی سنی - 'میں ناراض تھا، نہیں جانتا تھا کہ میں نے کیا کہا' - اور جواب دیا: اگر وہ ہمیں گھر جانے دیتا ہے، اچھا؛ اگر نہیں، تو وہ صرف اپنے آپ کو قصوروار ٹھہراتا ہے۔"
