label: { ar: "استيحاش قتيبة من سليمان بن عبد الملك", en: "Qutayba's Estrangement from Sulayman" }
summary:
  ar: "كان قتيبة مستوحشاً من سليمان بن عبد الملك وذلك أنه سعى في بيعة عبد العزيز بن الوليد فأراد دفعها عن سليمان فلما مات الوليد وقام سليمان خطب الناس فذم هبنقة العائشي وهو يزيد بن تزوان الذي كان يؤثر سمان إبله بالعلف والمرعى ويقول أنا لا أصلح ما أفسد الله ودعا الناس إلى خلعه فلم يجبه أحد إلى ذلك فشتم بني تميم ونسبهم إلى الغدر وقال لستم ببني تميم ولكنكم بني ذميم وذم بني بكر بن وائل وقال يا إخوة مسلمة وذم الأزد فقال بدلتم الرماح بالمرادي وبالسفن أعنة الحصن وقال يا أهل السافلة ولا أقول أهل العالية لا ضعنكم بحيث وضعكم الله فكتب سليمان إلى قتيبة بالولاية وأمره بإطلاق كل من في حبسه وأن يعطي الناس أعطياتهم ويأذن لمن أراد القفول في القفول وأمر رسوله بإعلام الناس ما كتب به فقال قتيبة هذا من تدبيره علي وقام فقال أيها الناس إن سليمان قد مناكم مخ أعضاد البعوض وإنكم ستدعون إلى بيعة أنور صبي لا تحل ذبيحته وكانوا حنقين عليه لشتمه إياهم فاعتذر من ذلك وقال إني غضبت فلم أدر ما قلت وما أردت لكم إلا الخير فتكلموا وقالوا إن أذن لنا في القفول كان خيراً له وإن لم يفعل فلا يلومن إلا نفسه."
  en: "Qutayba dreaded Sulayman, having backed Abd al-Aziz ibn al-Walid for the succession. When al-Walid died Sulayman took the pulpit and railed at Habanqa al-'A'ishi — Yazid ibn Tazwan, who prized fat camels saying 'I do not mend what God has corrupted' — then at Tamim ('not Banu Tamim but Banu Dhamim'), Bakr ibn Wa'il, and the Azd, 'ya ahl al-safila — I will not say ahl al-'aliya — may He set you where He set you'. His letter granting Qutayba the governorship came with orders to free prisoners, pay stipends and permit departures — broadcast by the messenger — and Qutayba called it his design, telling the people 'Sulayman has made you great as mosquitoes' marrow, and you will yet be asked bay'a to Anwar, a boy whose slaughter is unlawful'. Stung by his curses they heard his apology — 'I was angry, knew not what I said' — and answered: if he lets us go home, good; if not, he blames only himself."
