label: { ar: "اعتزال النبي أزواجه", en: "The Prophet's withdrawal from his wives" }
date:
  start: { edtf: "0629~", hijri: "0009~", calendar: julian, precision: year, status: tradition, note: "السنة المروية؛ تختلف الروايات في سبب الاعتزال ومدته (شهر أو تسع وعشرين ليلة)." }
summary:
  ar: "اعتزل النبي أزواجه في مشربة له مدة شهر في ما يعرف بحادثة الإيلاء. يروي عمر — وقد كان أبوه — أنه صعد إلى المشربة بعد أن فزع إلى الخبر، فوجد النبي على حصير ما بينه وبينه شيء، وتحت رأسه وسادة من أدم حشوها ليف، وعند رجليه قرظ مصبوب وعند رأسه أهب معلقة، فرأى أثر الحصير في جنبه فبكى وقال: إن كسرى وقيصر فيما هما فيه وأنت رسول الله، فقال «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» {cite:sahih-al-bukhari 4913}. وعند ابن عباس أنه أراد أن يسأل عمر عن المرأتين اللتين تظاهرتا على النبي فأجابه قبل تمام كلامه: عائشة وحفصة {cite:sahih-al-bukhari 4914}."
  en: "The Prophet withdrew from his wives to an upper chamber for a month in the incident known as the ila'. Umar climbed to find him on a mat with nothing between it and his skin, a leather pillow stuffed with palm-fibre under his head; the mat had marked his side, and when Umar wept comparing him to the emperors he answered 'are you not content that they have this world and we have the next?' {cite:sahih-al-bukhari 4913}; Ibn Abbas reports Umar naming Aisha and Hafsa as the two wives {cite:sahih-al-bukhari 4914}."
