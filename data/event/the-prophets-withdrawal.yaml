label: { ar: "اعتزال النبي أزواجه", en: "The Prophet's withdrawal from his wives", es: "El alejamiento del Profeta de sus esposas", fr: "Le retrait du Prophète de ses épouses", ur: "نبی کا اپنی ازواج سے کنارہ کشی" }
date:
  start: { edtf: "0629~", hijri: "0009~", calendar: julian, precision: year, status: tradition, note: "السنة المروية؛ تختلف الروايات في سبب الاعتزال ومدته ⁦(شهر أو تسع وعشرين ليلة)⁩." }
summary:
  ar: "اعتزل النبي أزواجه في مشربة له مدة شهر في ما يعرف بحادثة الإيلاء. يروي عمر — وقد كان أبوه — أنه صعد إلى المشربة بعد أن فزع إلى الخبر، فوجد النبي على حصير ما بينه وبينه شيء، وتحت رأسه وسادة من أدم حشوها ليف، وعند رجليه قرظ مصبوب وعند رأسه أهب معلقة، فرأى أثر الحصير في جنبه فبكى وقال: إن كسرى وقيصر فيما هما فيه وأنت رسول الله، فقال «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» {cite:sahih-al-bukhari 4913}. وعند ابن عباس أنه أراد أن يسأل عمر عن المرأتين اللتين تظاهرتا على النبي فأجابه قبل تمام كلامه: عائشة وحفصة {cite:sahih-al-bukhari 4914}."
  en: "The Prophet withdrew from his wives to an upper chamber for a month in the incident known as the ila'. Umar climbed to find him on a mat with nothing between it and his skin, a leather pillow stuffed with palm-fibre under his head; the mat had marked his side, and when Umar wept comparing him to the emperors he answered 'are you not content that they have this world and we have the next?' {cite:sahih-al-bukhari 4913}; Ibn Abbas reports Umar naming Aisha and Hafsa as the two wives {cite:sahih-al-bukhari 4914}."
  es: "El Profeta se retiró de sus esposas a una cámara superior durante un mes en el incidente conocido como el ila'. Umar subió y lo encontró sobre una estera sin nada entre esta y su piel, con una almohada de cuero rellena de fibra de palma bajo su cabeza; la estera le había marcado el costado, y cuando Umar lloró comparándolo con los emperadores, él respondió: \"¿No te contentas con que ellos tengan este mundo y nosotros el próximo?\" {cita:sahih-al-bukhari 4913}; Ibn Abbas relata que Umar nombró a Aisha y Hafsa como sus dos esposas {cita:sahih-al-bukhari 4914}."
  fr: "Le Prophète se retira de ses épouses dans une chambre haute pendant un mois, lors de l'épisode connu sous le nom d'ila'. Umar monta et le trouva allongé sur une natte, à même le sol, un oreiller de cuir rempli de fibres de palmier sous sa tête. La natte avait marqué son flanc. Umar, en pleurant et en le comparant aux empereurs, lui répondit: « N'es-tu pas content qu'ils aient ce monde et que nous ayons l'autre ? » (Sahih al-Bukhari 4913). Ibn Abbas rapporte qu'Umar nomma Aïcha et Hafsa comme ses deux épouses (Sahih al-Bukhari 4914)."
  ur: "نبی اپنی ازواج سے ایک ماہ کے لیے بالاخانے میں چلے گئے اس واقعے میں جسے الٰہ کہا جاتا ہے۔ عمر اسے ایک چٹائی پر ڈھونڈنے کے لیے چڑھا جس کے اور اس کی جلد کے درمیان کچھ نہیں تھا، ایک چمڑے کا تکیہ اس کے سر کے نیچے کھجور کے ریشے سے بھرا ہوا تھا۔ چٹائی نے اس کے پہلو کو نشان زد کیا تھا، اور جب عمر نے اس کا موازنہ شہنشاہوں سے کیا تو اس نے جواب دیا کہ کیا تم اس بات پر راضی نہیں ہو کہ ان کے پاس یہ دنیا ہے اور ہمارے پاس آخرت ہے؟ {حوالہ: صحیح البخاری 4913}؛ ابن عباس روایت کرتے ہیں کہ عمر نے عائشہ اور حفصہ کا نام دو بیویاں رکھا۔"
