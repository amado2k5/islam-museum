id: event/al-hadi-sermon-on-intention-and-self-training-and-his-remark-on-dress-286
class: event
kind: other
label:
  ar: موعظة الهادي في النية ومحاسبة النفس وقوله في اللباس
  en: Al-Hadi's admonition on intention and self-training, and his remark on dress
  ur: نیت اور نفس کی تربیت پر ہادی کی نصیحت اور لباس پر ان کا قول
  es: "La amonestación de Al-Hadi sobre la intención y el autoentrenamiento, y su comentario sobre la vestimenta."
  fr: "L'exhortation d'Al-Hadi sur l'intention et l'auto-entraînement, et sa remarque sur la tenue vestimentaire"
  tr: "Peygamberin niyet ve öz-hesap üzerine vaazı ve giyim üzerine sözleri."
  id: "Khutbah Nabi tentang niat dan pertanggungjawaban diri, serta perkataan beliau tentang pakaian."
summary:
  ar: يروي محمد بن عبيد الله أن الهادي كان يعظ الناس بالتقوى في السر والعلانية وبأن يجعلوا كل ما يفعلونه لله خالصاً، حتى إصلاح السلاح وعلف الدابة والمشي، وبمحاسبة النفس في الخلوات وترك الغضب، وأنه استغفر إذ خرج لعيادة مريض بقميص وإزار خشية أن يُستهان بهيبة الإسلام، مستشهداً بآية الإعداد للعدو ⁦(الأنفال 60)⁩. ويروي كذلك قوله في السحر وفي ما يلحقه من الهمّ.
  en: Muhammad ibn Ubaydallah reports that al-Hadi urged people to piety in private and in public and to make all they did sincerely for God, even mending weapons, feeding a mount or walking somewhere, to train themselves in solitude and give up anger; he asked forgiveness for riding out to visit a sick man in only a shirt and wrapper, fearing that the awe of Islam would be slighted, and cited the verse on preparing strength against an enemy (al-Anfal 60). He also reports a remark made at dawn and one on the distress his task brought him.
  ur: محمد بن عبید اللہ روایت کرتے ہیں کہ ہادی لوگوں کو خلوت و جلوت میں تقویٰ کی نصیحت کرتے اور کہتے کہ جو کچھ کریں اسے خالص اللہ کے لیے کریں، یہاں تک کہ ہتھیار سنوارنا، سواری کو چارہ دینا یا چلنا بھی؛ تنہائی میں نفس کی تربیت اور غصہ ترک کرنے کی تلقین کرتے؛ اور یہ کہ وہ ایک مریض کی عیادت کے لیے صرف قمیص اور تہبند میں نکلے تو استغفار کیا کہ کہیں اسلام کی ہیبت ہلکی نہ ہو، اور دشمن کے مقابلے کی تیاری والی آیت ⁦(الانفال 60)⁩ سے استدلال کیا۔ وہ سحر کے وقت کا ایک قول اور اپنی ذمہ داری کے بوجھ پر ایک بات بھی روایت کرتے ہیں۔
  es: "Muhammad ibn Ubaydallah relata que al-Hadi exhortó a la gente a practicar la piedad en privado y en público, y a realizar todas sus acciones con sinceridad para Dios, incluso reparar armas, alimentar a un caballo o simplemente caminar, a entrenarse en soledad y a abandonar la ira. Pidió perdón por haber salido a visitar a un enfermo vestido únicamente con una camisa y un manto, temiendo que se menospreciara el respeto al Islam, y citó el versículo sobre la preparación para la lucha contra el enemigo (al-Anfal 60). También relata un comentario hecho al amanecer y otro sobre la angustia que le causaba su tarea."
  fr: "Muhammad ibn Ubaydallah rapporte qu'al-Hadi exhortait les gens à la piété en privé comme en public, les encourageant à accomplir sincèrement tous leurs actes pour Dieu, même réparer des armes, nourrir un cheval ou se promener, à s'exercer à la solitude et à renoncer à la colère. Il demanda pardon d'être allé rendre visite à un malade vêtu seulement d'une chemise et d'un pagne, craignant de manquer de respect à l'islam, et cita le verset sur la préparation de la force contre l'ennemi (al-Anfal 60). Il rapporte également une remarque faite à l'aube et une autre sur la détresse que lui causait sa tâche."
  tr: "Muhammed ibn Ubeyd Allah rivayet eder ki, Hadid insanlara özelde ve kamusal alanda takvayı öğütler, yaptıkları her şeyi, hatta silah tamir etmeyi, hayvanları beslemeyi ve yürümeyi bile yalnızca Allah'a adamaları gerektiğini söylerdi. Ayrıca yalnızlıkta tefekkür etmeyi ve öfkeden uzak durmayı da öğütlerdi. Hadid'in, İslam'ın saygınlığına saygısızlık edilmesinden korkarak, sadece gömlek ve peştamal giyerek hasta birini ziyarete gittiğinde, düşmana hazırlıkla ilgili ayeti (Enfal Suresi 60) örnek göstererek af dilediğini aktarır. Ayrıca, sabahın erken saatleri ve bu saatlere eşlik eden kaygılar hakkındaki sözlerini de nakleder."
  id: "Muhammad ibn Ubayd Allah meriwayatkan bahwa al-Hadi biasa berdakwah kepada orang-orang tentang ketakwaan baik secara pribadi maupun di depan umum, dan bahwa mereka harus mendedikasikan segala sesuatu yang mereka lakukan hanya kepada Allah semata, bahkan memperbaiki senjata, memberi makan hewan, dan berjalan. Beliau juga berdakwah tentang introspeksi diri dalam kesendirian dan menahan amarah. Beliau menceritakan bahwa al-Hadi memohon ampunan ketika ia pergi mengunjungi orang sakit hanya dengan mengenakan kemeja dan kain penutup aurat, karena khawatir martabat Islam akan dinodai, dengan mengutip ayat tentang bersiap menghadapi musuh (Al-Anfal 60). Beliau juga meriwayatkan kata-katanya mengenai waktu subuh dan kecemasan yang menyertainya."
