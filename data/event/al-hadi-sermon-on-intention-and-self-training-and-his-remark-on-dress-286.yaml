id: event/al-hadi-sermon-on-intention-and-self-training-and-his-remark-on-dress-286
class: event
kind: other
label:
  ar: موعظة الهادي في النية ومحاسبة النفس وقوله في اللباس
  en: Al-Hadi's admonition on intention and self-training, and his remark on dress
  ur: نیت اور نفس کی تربیت پر ہادی کی نصیحت اور لباس پر ان کا قول
summary:
  ar: يروي محمد بن عبيد الله أن الهادي كان يعظ الناس بالتقوى في السر والعلانية وبأن يجعلوا كل ما يفعلونه لله خالصاً، حتى إصلاح السلاح وعلف الدابة والمشي، وبمحاسبة النفس في الخلوات وترك الغضب، وأنه استغفر إذ خرج لعيادة مريض بقميص وإزار خشية أن يُستهان بهيبة الإسلام، مستشهداً بآية الإعداد للعدو ⁦(الأنفال 60)⁩. ويروي كذلك قوله في السحر وفي ما يلحقه من الهمّ.
  en: Muhammad ibn Ubaydallah reports that al-Hadi urged people to piety in private and in public and to make all they did sincerely for God, even mending weapons, feeding a mount or walking somewhere, to train themselves in solitude and give up anger; he asked forgiveness for riding out to visit a sick man in only a shirt and wrapper, fearing that the awe of Islam would be slighted, and cited the verse on preparing strength against an enemy (al-Anfal 60). He also reports a remark made at dawn and one on the distress his task brought him.
  ur: محمد بن عبید اللہ روایت کرتے ہیں کہ ہادی لوگوں کو خلوت و جلوت میں تقویٰ کی نصیحت کرتے اور کہتے کہ جو کچھ کریں اسے خالص اللہ کے لیے کریں، یہاں تک کہ ہتھیار سنوارنا، سواری کو چارہ دینا یا چلنا بھی؛ تنہائی میں نفس کی تربیت اور غصہ ترک کرنے کی تلقین کرتے؛ اور یہ کہ وہ ایک مریض کی عیادت کے لیے صرف قمیص اور تہبند میں نکلے تو استغفار کیا کہ کہیں اسلام کی ہیبت ہلکی نہ ہو، اور دشمن کے مقابلے کی تیاری والی آیت ⁦(الانفال 60)⁩ سے استدلال کیا۔ وہ سحر کے وقت کا ایک قول اور اپنی ذمہ داری کے بوجھ پر ایک بات بھی روایت کرتے ہیں۔
