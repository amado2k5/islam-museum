label: { ar: "البيعة للمعتضد بولاية العهد", en: "Bay'a to al-Mu'tadid as heir apparent" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين ذكر الطبري البيعة لأبي العباس بولاية العهد في صفر، ولُقّب بالمعتضد بالله {cite:tabari-tarikh-abu-al-fadl j.10 p.22}، وذكر في سنة تسع وسبعين خلع جعفر المفوّض من العهد وتولية المعتضد في المحرم {cite:tabari-tarikh-abu-al-fadl j.10 p.28}، وعند السيوطي جلس المعتمد مجلساً عاماً سنة تسع وسبعين أشهد فيه على نفسه أنه خلع ولده المفوض من ولاية العهد وبايع لأبي العباس ولقبه المعتضد {cite:tarikh-khulafa-minhaj-1434 p. 569}."
  en: "In 278 AH al-Tabari records the pledge to Abu al-Abbas as heir apparent in Safar, and that he was given the laqab al-Mu'tadid billah {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. He records that in 279 AH Ja'far al-Mufawwad was removed from the succession and al-Mu'tadid was installed in Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. According to al-Suyuti, in 279 AH al-Mu'tamid held a general session at which he had witnesses attest that he removed his son al-Mufawwad from the heir apparency, pledged to Abu al-Abbas, and gave him the laqab al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 569}."
