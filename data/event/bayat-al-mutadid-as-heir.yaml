id: event/bayat-al-mutadid-as-heir
class: event
kind: gathering
label: { ar: "البيعة للمعتضد بولاية العهد", en: "Bay'a to al-Mu'tadid as heir apparent", fr: "La bay'a d'al-Mu'tadid comme héritier présomptif", es: "Bay'a a al-Mu'tadid como heredero aparente", ur: "بیع المتدید کو بطور وارث ظاہر ہے۔", tr: "Veliaht Prens olarak el-Mu'tadid'e bağlılık.", id: "Kesetiaan kepada al-Mu'tadid sebagai Putra Mahkota" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين ذكر الطبري البيعة لأبي العباس بولاية العهد في صفر، ولُقّب بالمعتضد بالله {cite:tabari-tarikh-abu-al-fadl j.10 p.22}، وذكر في سنة تسع وسبعين خلع جعفر المفوّض من العهد وتولية المعتضد في المحرم {cite:tabari-tarikh-abu-al-fadl j.10 p.28}، وعند السيوطي جلس المعتمد مجلساً عاماً سنة تسع وسبعين أشهد فيه على نفسه أنه خلع ولده المفوض من ولاية العهد وبايع لأبي العباس ولقبه المعتضد {cite:tarikh-khulafa-minhaj-1434 p. 569}."
  en: "In 278 AH al-Tabari records the pledge to Abu al-Abbas as heir apparent in Safar, and that he was given the laqab al-Mu'tadid billah {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. He records that in 279 AH Ja'far al-Mufawwad was removed from the succession and al-Mu'tadid was installed in Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. According to al-Suyuti, in 279 AH al-Mu'tamid held a general session at which he had witnesses attest that he removed his son al-Mufawwad from the heir apparency, pledged to Abu al-Abbas, and gave him the laqab al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 569}."
  fr: "En 278 H, al-Tabari consigne l'allégeance à Abu al-Abbas comme héritier présomptif en Safar, et qu'il reçut le laqab d'al-Mu'tadid billah {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Il consigne qu'en 279 H Ja'far al-Mufawwad fut écarté de la succession et qu'al-Mu'tadid fut installé en Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. Selon al-Suyuti, en 279 H al-Mu'tamid tint une séance générale où il fit attester par des témoins qu'il retirait à son fils al-Mufawwad la qualité d'héritier présomptif, prêtait allégeance à Abu al-Abbas et lui donnait le laqab d'al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 569}."
  es: "En 278 AH al-Tabari registra la promesa a Abu al-Abbas como heredero aparente en Safar, y que se le dio el laqab al-Mu'tadid billah {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Registra que en 279 AH Ja'far al-Mufawwad fue removido de la sucesión y al-Mu'tadid fue instalado en Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. Según al-Suyuti, en 279 AH al-Mu'tamid celebró una sesión general en la que hizo testigos de que removió a su hijo al-Mufawwad de la apariencia de heredero, se comprometió con Abu al-Abbas y le dio el laqab al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 569}."
  ur: "278ھ میں الطبری نے صفر میں ظاہری طور پر ابو العباس کے وارث کے طور پر بیعت درج کی ہے، اور یہ کہ انہیں لقب المتدد باللہ {حوالہ: طبری-تاریخ-ابو الفضل ج.10 ص 22} دیا گیا تھا۔ انہوں نے لکھا ہے کہ 279 ہجری میں جعفر المفواد کو جانشینی سے ہٹا دیا گیا اور محرم میں المعتدد کو نصب کیا گیا {حوالہ: طبری تاریخ ابو الفضل ج10 ص 28}۔ السیوطی کے مطابق، 279 ہجری میں المتمید نے ایک عام اجلاس منعقد کیا جس میں اس کے گواہوں نے گواہی دی تھی کہ اس نے اپنے بیٹے المفواد کو وارث کے عہدہ سے ہٹا دیا، ابو العباس کے پاس بیعت کی، اور اسے لقب المتعدید دیا۔ 569}۔"
  tr: "Hicri 278 yılında Taberi, Safer ayında Ebu el-Abbas'ın veliaht olarak biat ettiğini ve kendisine el-Mu'tadid Billah unvanının verildiğini belirtmiştir (kaynak: tabari-tarikh-abu el-fadl, cilt 10, s. 22). Hicri 279 yılında ise Cafer el-Mufawwad'ın veliahtlıktan uzaklaştırıldığını ve Muharrem ayında el-Mu'tadid'in atandığını belirtmiştir (kaynak: tabari-tarikh-abu el-fadl, cilt 10, s. 28). El-Suyuti'ye göre, el-Mu'tamid, Hicri 279 yılında halka açık bir meclis düzenledi ve burada oğlu el-Mufawwad'ı veliahtlıktan uzaklaştırdığını, Ebu el-Abbas'a biat ettiğini ve ona el-Mu'tadid unvanını verdiğini beyan etti. {Kaynak:tarikh-khulafa-minhaj-1434 s. 569}"
  id: "Pada tahun 278 H, al-Tabari menyebutkan sumpah setia kepada Abu al-Abbas sebagai putra mahkota pada bulan Safar, dan ia diberi gelar al-Mu'tadid Billah {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Ia menyebutkan pada tahun 279 H pencopotan Ja'far al-Mufawwad dari posisi putra mahkota dan pengangkatan al-Mu'tadid pada bulan Muharram {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. Menurut al-Suyuti, al-Mu'tadid mengadakan dewan publik pada tahun 279 H di mana ia bersaksi bahwa ia telah mencopot putranya al-Mufawwad dari posisi putra mahkota dan bersumpah setia kepada Abu al-Abbas serta memberinya gelar al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 569}."
