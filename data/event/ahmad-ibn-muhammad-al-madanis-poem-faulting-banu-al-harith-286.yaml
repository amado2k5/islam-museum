label:
  ar: قصيدة أحمد بن محمد المداني يخطّئ فيها بني الحارث، 286هـ
  en: The poem of Ahmad ibn Muhammad al-Madani faulting Banu al-Harith, 286 AH
  ur: احمد بن محمد مدانی کا وہ قصیدہ جس میں وہ بنو حارث کو خطا کار ٹھہراتے ہیں، 286ھ
summary:
  ar: يقول الكتاب إن أحمد بن محمد المداني قال، عند دخول الهادي القرية وقتله بني الحارث وأخذه ابن حميد، شعراً يخطّئ فيه بني الحارث، يذكر فيه أنه سهر من الهمّ لما نزل بقومه حين ضلت حلومهم وحاربوا الله وابن نبيه، وأنهم أُنذروا ونُصحوا، ويصف الهادي سليل الطهارة والتقى وإماماً شجاعاً.
  en: 'The book says Ahmad ibn Muhammad al-Madani spoke, when al-Hadi entered the village, killed Banu al-Harith and took Ibn Humayd, a poem faulting Banu al-Harith for what they did: he lost sleep through grief at what came on his people when their wits went astray and they fought God and the son of His prophet, says they were warned and counselled, and describes al-Hadi as a descendant of the pure and godfearing and a brave imam.'
  ur: 'کتاب کہتی ہے کہ احمد بن محمد مدانی نے، ہادی کے بستی میں داخل ہونے، بنو حارث کو قتل کرنے اور ابن حمید کو پکڑنے کے وقت، ایک قصیدہ کہا جس میں وہ بنو حارث کو ان کے فعل پر خطا کار ٹھہراتے ہیں: ان کی قوم پر جو آیا اس کے غم میں نیند چلی گئی جب ان کی عقلیں بہک گئیں اور انہوں نے اللہ اور اس کے نبی کے بیٹے سے جنگ کی، انہیں خبردار اور نصیحت کی گئی، اور وہ ہادی کو پاکیزگی و تقویٰ کی نسل اور بہادر امام بتاتے ہیں۔'
