label: { ar: "وفاة حبيب بن مسلمة بدمشق", en: "The Death of Habib ibn Maslama at Damascus", es: "La muerte de Habib ibn Maslama en Damasco", fr: "La mort d'Habib ibn Maslama à Damas", ur: "حبیب بن مسلمہ کی وفات دمشق میں", tr: "Habib ibn Maslama Şam'da öldü.", id: "Habib ibn Maslama meninggal di Damaskus." }
summary:
  ar: "عند البلاذري: لما فتح حبيب ما فتح من أرض أرمينية كتب به إلى عثمان بن عفان فوافاه كتابه وقد نُعي إليه سلمان فهمّ أن يوليه جميع أرمينية ثم رأى أن يجعله غازياً بثغور الشام والجزيرة لغنائه فيما كان ينهض له من ذلك فولّى ثغر أرمينية حذيفة بن اليمن العبسي فشخّص إلى برذعة ووجّه عمّاله على ما بينها وبين قاليقلا وإلى خيزان فورد عليه كتاب عثمان يأمره بالانصراف وتخليف صلة بن زفر العبسي وكان معه فخلّفه، وسار حبيب راجعاً إلى الشام وكان يغزو الروم ونزل حمص فنقله معاوية إلى دمشق فتوفى بها سنة 42 وهو ابن خمس وثلاثين سنة، وكان معاوية وجّه حبيباً في جيش لنصرة عثمان حين حوصر فلما انتهى إلى وادي القرى بلغه مقتل عثمان فرجع."
  en: "In al-Baladhuri: when Habib had taken what he took of Armenia's land he wrote of it to Uthman ibn Affan, whose answer reached him with Salman's death reported — Uthman near giving him all Armenia, then judging it better to make him a raider of the Syrian and Jaziran frontier for his worth in such service, and gave Armenia's march to Hudhayfa ibn al-Yaman al-Absi, who repaired to Bardha'a posting his agents over what lay between it and Qaliqala and to Khizan, until Uthman's writ came ordering his return and the leaving behind of Sila ibn Zufar al-Absi who was with him — and he left him; Habib marched back to Syria raiding the Romans, camped at Hims, and Mu'awiya moved him to Damascus where he died in year 42, being thirty-five years old; Mu'awiya had earlier sent Habib at the head of an army to Uthman's aid when he was besieged, but at Wadi al-Qura word of Uthman's killing reached him and he turned back."
  es: "En al-Baladhuri: cuando Habib hubo tomado lo que tomó de la tierra de Armenia, escribió sobre ello a Uthman ibn Affan, cuya respuesta le llegó con la noticia de la muerte de Salman; Uthman estuvo a punto de darle toda Armenia, pero luego juzgó que era mejor convertirlo en un asaltante de la frontera siria y jaziran por su valía en tal servicio, y le dio la marcha de Armenia a Hudhayfa ibn al-Yaman al-Absi, quien se dirigió a Bardha'a colocando a sus agentes en lo que había entre esta y Qaliqala y a Khizan, hasta que llegó el mandato de Uthman ordenando su regreso y el abandono de Sila ibn Zufar al-Absi que estaba con él; y lo dejó; Habib marchó de regreso a Siria asaltando a los romanos, acampó en Hims, y Mu'awiya lo trasladó a Damasco donde murió en el año 42, a la edad de treinta y cinco años; Anteriormente, Mu'awiya había enviado a Habib al frente de un ejército para ayudar a Uthman cuando este se encontraba sitiado, pero en Wadi al-Qura le llegó la noticia de la muerte de Uthman y dio media vuelta."
  fr: "Dans al-Baladhuri: lorsque Habib eut pris ce qu'il avait pris du territoire arménien, il en fit part à Uthman ibn Affan, dont la réponse lui parvint avec la nouvelle de la mort de Salman — Uthman était sur le point de lui donner toute l'Arménie, puis jugea préférable de le faire piller la frontière syrienne et jaziréenne pour sa valeur dans un tel service, et confia la marche de l'Arménie à Hudhayfa ibn al-Yaman al-Absi, qui se rendit à Bardha'a, postant ses agents sur ce qui se trouvait entre elle et Qaliqala et jusqu'à Khizan, jusqu'à ce que l'ordre d'Uthman arrive, ordonnant son retour et le départ de Sila ibn Zufar al-Absi qui était avec lui — et il le quitta; Habib retourna en Syrie, pillant les Romains, campa à Hims, et Mu'awiya le transféra à Damas où il mourut en l'an 42, à l'âge de trente-cinq ans; Mu'awiya avait auparavant envoyé Habib à la tête d'une armée au secours d'Uthman lorsqu'il était assiégé, mais à Wadi al-Qura, la nouvelle de la mort d'Uthman lui parvint et il fit demi-tour."
  ur: "البلادوری میں ہے: جب حبیب نے آرمینیا کی زمین میں سے جو کچھ لیا تھا وہ لے کر عثمان بن عفان کو لکھا، جس کا جواب سلمان کی موت کے ساتھ اس کے پاس پہنچا - عثمان نے اسے تمام آرمینیا دینے کے قریب ہے، پھر اسے شام اور جزیران کی سرحدوں کا حملہ آور بنانا بہتر سمجھا اور اس قدر خدمت کے لیے اسے شامی اور جزیران کی سرحدوں کا حملہ آور بنا دیا، اور حوثی اربعین کو دیا۔ العبسی، جس نے بردعہ کی مرمت کی جو اس کے اور قلقلہ اور خزان کے درمیان واقع ہے پر اپنے ایجنٹوں کو بھیجتا رہا، یہاں تک کہ عثمان کی رٹ اس کے واپس آنے اور سیلا بن زفر العبسی کو چھوڑنے کا حکم دیتی جو اس کے ساتھ تھا - اور اس نے اسے چھوڑ دیا۔ حبیب نے رومیوں پر چھاپہ مار کر واپس شام کی طرف کوچ کیا، حمس میں پڑاؤ ڈالا، اور معاویہ نے اسے دمشق منتقل کر دیا جہاں وہ پینتیس سال کی عمر میں سن 42 میں انتقال کر گئے۔ معاویہ نے پہلے حبیب کو ایک لشکر کے سربراہ کے طور پر عثمان کی مدد کے لیے بھیجا تھا جب وہ محصور تھے، لیکن وادی القریٰ پر عثمان کے قتل کی بات اس تک پہنچی اور وہ واپس پلٹ گیا۔"
  tr: "El-Baladhuri'ye göre: Habib Ermeni topraklarını fethettiğinde, Osman ibn Affan'a bu konuda bir mektup yazdı. Mektubu ona ulaştı ve Salman onun ölümünden haberdar oldu. Onu tüm Ermenistan'ın valisi olarak atamayı düşündü, ancak daha sonra, üstlenebileceği işlerdeki uzmanlığı nedeniyle onu Suriye ve Cezire'nin sınır bölgelerinin komutanı yapmaya karar verdi. Böylece Hudeyfa ibn el-Yaman el-Absi'yi Ermeni sınır bölgesinin valisi olarak atadı. Bardha'a'ya doğru yola çıktı ve ajanlarını Bardha'a ile Kalikla ve Hızan arasındaki bölgeye gönderdi. Sonra Osman'ın mektubu geldi ve ona ayrılmasını ve yanında bulunan Sila ibn Zufar el-Absi'yi geride bırakmasını emretti. Böylece onu geride bıraktı ve Habib Suriye'ye geri döndü ve orada Romalılara baskınlar düzenledi. Homs'ta kaldı ve Muaviye onu Şam'a götürdü; orada 42 yılında, otuz beş yaşında öldü. Muaviye, Osman kuşatma altındayken ona destek olması için Habib'i bir orduyla göndermişti. Habib, Vadi el-Kura'ya vardığında Osman'ın öldürüldüğünü duyunca geri döndü."
  id: "Menurut Al-Baladhuri: Ketika Habib menaklukkan tanah Armenia, ia menulis surat kepada Utsman ibn Affan tentang hal itu. Suratnya sampai kepadanya, dan Salman diberitahu tentang kematiannya. Ia bermaksud mengangkatnya sebagai gubernur seluruh Armenia, tetapi kemudian ia memutuskan untuk menjadikannya komandan wilayah perbatasan Suriah dan Jazira, karena keahliannya dalam bidang yang mampu ia laksanakan. Maka ia mengangkat Hudhayfa ibn al-Yaman al-Absi sebagai gubernur wilayah perbatasan Armenia. Ia berangkat ke Bardha’a dan mengirim agen-agennya ke daerah antara Bardha’a dan Qaliqla serta ke Khizan. Kemudian surat Utsman tiba yang memerintahkannya untuk pergi dan meninggalkan Sila ibn Zufar al-Absi, yang bersamanya. Maka ia meninggalkannya, dan Habib kembali ke Suriah, di mana ia menyerang bangsa Romawi. Ia tinggal di Homs, dan Muawiya memindahkannya ke Damaskus, di mana ia meninggal pada tahun 42, pada usia tiga puluh lima tahun. Muawiya telah mengirim Habib dengan pasukan untuk mendukung Uthman ketika ia dikepung. Ketika ia sampai di Wadi al-Qura, ia mendengar tentang pembunuhan Uthman, sehingga ia kembali."
