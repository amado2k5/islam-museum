id: event/end-beylerbey-algiers-995
class: event
kind: law-enacted
label:
  ar: "انتهاء نظام البايلربك في الجزائر ⁦(٩٩٥هـ/١٥٨٧م)⁩"
  en: "End of the beylerbey system in Algiers (995/1587)"
  es: "Fin del sistema de beylerbeyes en Argel (995/1587)"
  fr: "Fin du système des beylerbeys à Alger (995/1587)"
  ur: "الجزائر میں بیلربی سسٹم کا خاتمہ (995/1587)"
summary:
  ar: "بوفاة قلج علي سنة ٩٩٥هـ/١٥٨٧م انتهى في الجزائر نظام البايلربك الذي جعل من حكامها ملوكاً واسعي السلطة، واستُعيض عنه بنظام الباشوية مثل تونس وطرابلس: باشا موظف ترسله الأستانة ثلاث سنوات دون سند محلي — ويفسر الصلابي التغيير بخوف السلطان أن يتجه البايلربك بقوتهم وضعف البحرية نحو الاستقلال. وبذلك انقسم الشمال الأفريقي إثر ليبانتو ⁦(٩٧٨هـ/١٥٧١م)⁩ من بايلربك واحد بالجزائر إلى ثلاث ولايات عادية: طرابلس وتونس والجزائر {cite:dawlat-uthmaniyya-salabi p. 272-273}."
  en: "With Uluj Ali's death in 995/1587 the beylerbey system ended in Algiers — the arrangement that had made her governors near-sovereigns — replaced by the pasha system as in Tunis and Tripoli: a salaried pasha sent from Istanbul for three years with no local base. Al-Salabi explains the change as the sultan's fear that strong beylerbeys, with the navy weakened, would drift toward independence. So after Lepanto (978/1571) Ottoman North Africa split from a single beylerbey at Algiers into three ordinary wilayas: Tripoli, Tunis and Algiers {cite:dawlat-uthmaniyya-salabi p. 272-273}."
  es: "Con la muerte de Uluj Ali en 995/1587, el sistema de beylerbeys llegó a su fin en Argel —el sistema que había convertido a sus gobernadores en casi soberanos—, siendo reemplazado por el sistema de pachás, como en Túnez y Trípoli: un pachá asalariado enviado desde Estambul durante tres años sin base local. Al-Salabi explica el cambio como el temor del sultán a que los beylerbeys fuertes, con la armada debilitada, se inclinaran hacia la independencia. Así, después de Lepanto (978/1571), el norte de África otomano se dividió de un único beylerbey en Argel en tres wilayas ordinarias: Trípoli, Túnez y Argel {cite:dawlat-uthmaniyya-salabi p. 272-273}."
  fr: "Avec la mort d'Uluj Ali en 995/1587, le système des beylerbeys prit fin à Alger – un système qui conférait aux gouverneurs un pouvoir quasi souverain – et fut remplacé par le système des pachas, comme à Tunis et à Tripoli: un pacha salarié, détaché d'Istanbul pour un mandat de trois ans sans autorité locale. Al-Salabi explique ce changement par la crainte du sultan que des beylerbeys puissants, dont la marine était affaiblie, ne tendent vers l'indépendance. Ainsi, après Lépante (978/1571), l'Afrique du Nord ottomane se divisa d'un beylerbey unique à Alger en trois wilayas: Tripoli, Tunis et Alger (voir: Dawlat-Uthmaniyya-Salabi, p. 272-273)."
  ur: "الوج علی کی 995/1587 میں موت کے ساتھ ہی الجزائر میں بیلربی کا نظام ختم ہو گیا - وہ انتظام جس نے اس کے گورنروں کو خودمختار بنا دیا تھا - اس کی جگہ پاشا نظام نے لے لی جیسا کہ تیونس اور طرابلس میں: ایک تنخواہ دار پاشا کو تین سال کے لیے استنبول سے بھیجا گیا جس کا کوئی مقامی بنیاد نہیں تھا۔ السلابی اس تبدیلی کی وضاحت کرتے ہوئے سلطان کے خوف کے طور پر بتاتے ہیں کہ بحریہ کے کمزور ہونے کے ساتھ مضبوط بیلربی آزادی کی طرف بڑھیں گے۔ چنانچہ لیپینٹو (978/1571) کے بعد عثمانی شمالی افریقہ الجزائر کے ایک ہی بیلربی سے تین عام ولایتوں میں تقسیم ہو گیا: طرابلس، تیونس اور الجزائر۔ 272-273}۔"
