label:
  ar: "انتهاء نظام البايلربك في الجزائر (٩٩٥هـ/١٥٨٧م)"
  en: "End of the beylerbey system in Algiers (995/1587)"
summary:
  ar: "بوفاة قلج علي سنة ٩٩٥هـ/١٥٨٧م انتهى في الجزائر نظام البايلربك الذي جعل من حكامها ملوكاً واسعي السلطة، واستُعيض عنه بنظام الباشوية مثل تونس وطرابلس: باشا موظف ترسله الأستانة ثلاث سنوات دون سند محلي — ويفسر الصلابي التغيير بخوف السلطان أن يتجه البايلربك بقوتهم وضعف البحرية نحو الاستقلال. وبذلك انقسم الشمال الأفريقي إثر ليبانتو (٩٧٨هـ/١٥٧١م) من بايلربك واحد بالجزائر إلى ثلاث ولايات عادية: طرابلس وتونس والجزائر {cite:dawlat-uthmaniyya-salabi p. 272-273}."
  en: "With Uluj Ali's death in 995/1587 the beylerbey system ended in Algiers — the arrangement that had made her governors near-sovereigns — replaced by the pasha system as in Tunis and Tripoli: a salaried pasha sent from Istanbul for three years with no local base. Al-Salabi explains the change as the sultan's fear that strong beylerbeys, with the navy weakened, would drift toward independence. So after Lepanto (978/1571) Ottoman North Africa split from a single beylerbey at Algiers into three ordinary wilayas: Tripoli, Tunis and Algiers {cite:dawlat-uthmaniyya-salabi p. 272-273}."
