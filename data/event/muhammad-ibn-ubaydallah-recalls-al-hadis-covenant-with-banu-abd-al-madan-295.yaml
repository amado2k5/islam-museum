id: event/muhammad-ibn-ubaydallah-recalls-al-hadis-covenant-with-banu-abd-al-madan-295
class: event
kind: other
label:
  ar: "محمد بن عبيد الله يذكّر بني عبد المدان بعهد الهادي فيحلفون له، 295هـ"
  en: "Muhammad ibn Ubaydallah recalls al-Hadi's covenant with Banu Abd al-Madan, who swear to him, 295 AH, pp. 363-364"
  ur: "محمد بن عبیداللہ کا بنو عبد المدان کو ہادی کا عہد یاد دلانا اور ان کا قسم کھانا، 295ھ، ص363-364"
  es: "Muhammad ibn Ubaydallah recuerda el pacto de al-Hadi con Banu Abd al-Madan, quienes le juran lealtad, 295 AH, pp. 363-364."
  fr: "Muhammad ibn Ubaydallah rappelle l'alliance d'al-Hadi avec les Banu Abd al-Madan, qui lui prêtent serment, 295 AH, pp. 363-364"
  tr: "Muhammed ibn Ubeyd Allah, Beni Abdülmeden kabilesine Hadi'nin ahdini hatırlatır ve onlar da ona yemin ederler, 295 Hicri."
  id: "Muhammad ibn Ubayd Allah mengingatkan Bani Abd al-Madan tentang perjanjian al-Hadi, dan mereka bersumpah kepadanya, 295 H."
summary:
  ar: "أرسل محمد بن عبيد الله إلى بني عبد المدان يعلمهم بقدوم ابن حميد، ويذكّرهم بعهد الهادي إليهم قبل خروجه إلى صعدة. فلما سألهم عن رأيهم قالوا إن فتنة بني الحارث أهون عليهم من فتنة الهادي، وحلفوا له أن أنفسهم تكون قبل نفسه، ثم قبل منهم ذلك."
  en: "Muhammad ibn Ubaydallah sent to Banu Abd al-Madan to tell them of Ibn Humayd's approach and to recall the covenant al-Hadi had made with them before leaving for Sa'da. When he asked for their counsel they answered that the strife of Banu al-Harith was lighter for them than the strife of al-Hadi, and swore that their own lives would come before his. He accepted their oath."
  ur: "محمد بن عبیداللہ نے بنو عبد المدان کو ابن حمید کے آنے کی خبر دی اور ہادی کا وہ عہد یاد دلایا جو انہوں نے صعدہ جانے سے پہلے ان سے لیا تھا۔ جب اس نے ان سے رائے مانگی تو انہوں نے کہا کہ بنو حارث کا فتنہ ان کے لیے ہادی کے فتنے سے ہلکا ہے، اور قسم کھائی کہ ان کی جانیں اس کی جان سے پہلے ہوں گی۔ اس نے ان کی یہ بات قبول کر لی۔"
  es: "Muhammad ibn Ubaydallah envió mensajeros a Banu Abd al-Madan para informarles de la llegada de Ibn Humayd y recordarles el pacto que al-Hadi había hecho con ellos antes de partir hacia Sa'da. Al pedirles consejo, respondieron que la lucha de Banu al-Harith era menos grave para ellos que la de al-Hadi, y juraron que antepondrían sus vidas a la de él. Muhammad aceptó su juramento."
  fr: "Muhammad ibn Ubaydallah envoya des messagers aux Banu Abd al-Madan pour les informer de l'arrivée d'Ibn Humayd et leur rappeler l'accord qu'al-Hadi avait conclu avec eux avant son départ pour Sa'da. Lorsqu'il leur demanda conseil, ils répondirent que la lutte des Banu al-Harith leur paraissait moins grave que celle d'al-Hadi, et jurèrent que leur vie passerait avant la sienne. Il accepta leur serment."
  tr: "Muhammed ibn Ubeyd Allah, İbn Hamid'in gelişini Banu Abdülmeden'e bildirdi ve onlara Hadi'nin Sa'de'ye gitmeden önce onlarla yaptığı ahdi hatırlattı. Onların fikrini sorduğunda, Banu el-Harith'in isyanının Hadi'nin isyanından daha katlanılabilir olduğunu söylediler ve canlarının kendisinden önce geleceğine dair yemin ettiler; o da bu yemini kabul etti."
  id: "Muhammad ibn Ubayd Allah mengirim pesan kepada Bani Abd al-Madan untuk memberitahukan kedatangan Ibnu Hamid dan mengingatkan mereka tentang perjanjian al-Hadi dengan mereka sebelum keberangkatannya ke Sa'dah. Ketika beliau menanyakan pendapat mereka, mereka berkata bahwa pemberontakan Bani al-Harith lebih mudah mereka tanggung daripada pemberontakan al-Hadi, dan mereka bersumpah kepadanya bahwa nyawa mereka akan didahulukan daripada nyawanya, dan beliau menerima janji mereka."
