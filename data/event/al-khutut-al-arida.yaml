summary:
  ar: "رسالة سورية سنية مختصرة واسعة الانتشار ألّفها العالِم [[person/muhibb-al-din-al-khatib|محب الدين الخطيب]] في ستينات القرن العشرين رداً على المؤلفات الشيعية المعاصرة ودعوات التقريب، تفحص الفروق الجوهرية — التقية ومقام الصحابة وحفظ القرآن — بأسلوب موجز ترجم وطبع مراراً، فهي أشهر المصنفات السنية الميسرة في باب الرد المنهجي {cite:al-islam-murajaat}."
  en: "A concise, widely spread Syrian Sunni treatise composed by the scholar [[person/muhibb-al-din-al-khatib|Muhibb al-Din al-Khatib]] in the 1960s in reply to contemporary Shia writings and ecumenical appeals, examining the core differences — taqiyya, the standing of the Companions and Qur'anic preservation — in a brief style repeatedly translated and printed; it is the most accessible modern Sunni manual in the discipline of methodical refutation {cite:al-islam-murajaat}."
  es: "Un tratado sunita sirio conciso y ampliamente difundido, compuesto por el erudito [[person/muhibb-al-din-al-khatib|Muhibb al-Din al-Khatib]] en la década de 1960 en respuesta a escritos chiítas contemporáneos y llamamientos ecuménicos, que examina las diferencias fundamentales —la taqiyya, la posición de los Compañeros y la preservación coránica— en un estilo breve, traducido e impreso repetidamente; es el manual sunita moderno más accesible en la disciplina de la refutación metódica {cite:al-islam-murajaat}."
