summary:
  ar: "رسالة سورية سنية مختصرة واسعة الانتشار ألّفها العالِم [[person/muhibb-al-din-al-khatib|محب الدين الخطيب]] في ستينات القرن العشرين رداً على المؤلفات الشيعية المعاصرة ودعوات التقريب، تفحص الفروق الجوهرية — التقية ومقام الصحابة وحفظ القرآن — بأسلوب موجز ترجم وطبع مراراً، فهي أشهر المصنفات السنية الميسرة في باب الرد المنهجي {cite:al-islam-murajaat}."
  en: "A concise, widely spread Syrian Sunni treatise composed by the scholar [[person/muhibb-al-din-al-khatib|Muhibb al-Din al-Khatib]] in the 1960s in reply to contemporary Shia writings and ecumenical appeals, examining the core differences — taqiyya, the standing of the Companions and Qur'anic preservation — in a brief style repeatedly translated and printed; it is the most accessible modern Sunni manual in the discipline of methodical refutation {cite:al-islam-murajaat}."
  es: "Un tratado sunita sirio conciso y ampliamente difundido, compuesto por el erudito [[person/muhibb-al-din-al-khatib|Muhibb al-Din al-Khatib]] en la década de 1960 en respuesta a escritos chiítas contemporáneos y llamamientos ecuménicos, que examina las diferencias fundamentales —la taqiyya, la posición de los Compañeros y la preservación coránica— en un estilo breve, traducido e impreso repetidamente; es el manual sunita moderno más accesible en la disciplina de la refutación metódica {cite:al-islam-murajaat}."
  fr: "Un traité sunnite syrien concis et largement diffusé, composé par l'érudit Muhibb al-Din al-Khatib dans les années 1960 en réponse aux écrits chiites contemporains et aux appels œcuméniques, examinant les différences fondamentales — la taqiyya, le statut des Compagnons et la préservation du Coran — dans un style bref, traduit et imprimé à plusieurs reprises; il s'agit du manuel sunnite moderne le plus accessible dans la discipline de la réfutation méthodique {cite:al-islam-murajaat}."
  ur: "عصری شیعہ تحریروں اور علمی اپیلوں کے جواب میں 1960 کی دہائی میں عالم [[شخص/محیب الدین الخطیب|محیب الدین الخطیب]] کی طرف سے مرتب کردہ ایک جامع، وسیع پیمانے پر پھیلے ہوئے شامی سنی مقالے، بنیادی اختلافات کی جانچ پڑتال کرتے ہوئے - تقیہ اور قرآنی اسلوب کے مختصر اصولوں پر مشتمل ہے۔ بار بار ترجمہ اور طباعت؛ یہ طریقہ کار کی تردید کے نظم و ضبط میں سب سے زیادہ قابل رسائی جدید سنی کتابچہ ہے۔"
  tr: "Muhibb el-Din el-Hatib'in 1960'larda çağdaş Şii yazılara ve yakınlaşma çağrılarına yanıt olarak kaleme aldığı, özlü ve yaygın olarak kullanılan bir Sünni risaledir. Takiyye, Sahabelerin statüsü ve Kur'an'ın korunması gibi temel farklılıkları özlü bir üslupla inceler. Birçok kez tercüme edilip basılmış olup, sistematik reddiye alanındaki erişilebilir Sünni eserler arasında en ünlüsüdür."
  id: "Sebuah risalah Sunni yang ringkas dan tersebar luas karya ulama [[person/muhibb-al-din-al-khatib|Muhibb al-Din al-Khatib]] pada tahun 1960-an sebagai tanggapan terhadap tulisan-tulisan Syiah kontemporer dan seruan untuk rekonsiliasi. Risalah ini mengkaji perbedaan-perbedaan mendasar — taqiyyah, kedudukan para Sahabat, dan pelestarian Al-Qur'an — dengan gaya yang ringkas. Risalah ini telah diterjemahkan dan dicetak berkali-kali, dan merupakan karya Sunni yang paling terkenal dan mudah diakses di bidang bantahan sistematis {cite:al-islam-murajaat}."
