id: "event/two-akili-leaders-are-killed-at-ghayl-in-rajab-327-ah"
class: event
kind: other
label:
  ar: "يقتل الوجيه وأحمد ابنا عباد بن عبدالله الأكيلي في الغيل في رجب سنة 327هـ، ص414"
  en: "Al-Wajih and Ahmad, sons of Abbad ibn Abdallah al-Akili, are killed at al-Ghayl in Rajab 327 AH, p. 414"
  ur: "الوجیہ اور احمد، عباد بن عبداللہ الاکیلی کے بیٹے، رجب 327ھ میں غیل میں مارے جاتے ہیں، ص414"
  es: "Al-Wajih y Ahmad, hijos de Abbad ibn Abdallah al-Akili, son asesinados en al-Ghayl en Rajab 327 AH, p. 414"
  fr: "Al-Wajih et Ahmad, fils d'Abbad ibn Abdallah al-Akili, sont tués à al-Ghayl à Rajab 327 AH, p. 414"
  tr: "Abbad bin Abdullah El-Akili'nin oğulları El-Vajih ve Ahmed, H. 327 yılının Receb ayında El-Ghayl'de öldürüldü, s. 414"
  id: "Al-Wajih dan Ahmad, putra Abbad bin Abdullah Al-Akili, terbunuh di Al-Ghayl pada Rajab tahun 327 H, hal. 414"
summary:
  ar: "يخرج الأكيليون من علاف ومعهم ابن الضحاك، فيأتون الغيل يوم الأربعاء لست عشرة ليلة خلت من رجب سنة 327هـ، فيخرج إليهم القاسم، فيقتل ابنا عباد الأكيلي ومعهما جماعة، وينهزمون إلى علاف."
  en: "The Akil leave Alaf with Ibn al-Dahhak and come to al-Ghayl on Wednesday, sixteen nights into Rajab 327 AH. Al-Qasim goes out against them, and the two sons of Abbad al-Akili are killed with a group of their men, and they flee back to Alaf."
  ur: "اکیلی ابن الضحاک کے ساتھ علاف سے نکلتے ہیں اور رجب 327ھ کی سولہ راتیں گزرنے پر بدھ کو غیل آتے ہیں۔ قاسم ان کے مقابلے کو نکلتا ہے، عباد الاکیلی کے دونوں بیٹے اپنے کچھ ساتھیوں سمیت مارے جاتے ہیں، اور وہ علاف کی طرف بھاگ جاتے ہیں۔"
  es: "Los Akil abandonan Alaf con Ibn al-Dahhak y llegan a al-Ghayl el miércoles dieciséis días después del inicio de Rajab del año 327 de la Hégira. Al-Qasim sale a su encuentro, y los dos hijos de Abbad al-Akili mueren junto con un grupo de sus hombres, tras lo cual huyen de regreso a Alaf."
  fr: "Les Akil quittent Alaf avec Ibn al-Dahhak et arrivent à al-Ghayl le mercredi 16 Rajab 327 AH. Al-Qasim sort contre eux, et les deux fils d'Abbad al-Akili sont tués avec un groupe de leurs hommes, puis ils s'enfuient vers Alaf."
  tr: "Akili halkı, İbn el-Dahhak eşliğinde El-Allaf'tan ayrılır ve Hicri 327 yılının Recep ayının on altıncı gecesi, Çarşamba günü El-Ghayl'e gelirler. El-Kasım onların yanına gider ve Abbad el-Akili'nin iki oğlunu ve bir grup Akili'yi öldürür; bunun üzerine Akili halkı El-Allaf'a kaçar."
  id: "Kaum Akili meninggalkan Al-Allaf, didampingi oleh Ibnu Al-Dahhak, dan mereka tiba di Al-Ghayl pada hari Rabu, malam keenam belas bulan Rajab tahun 327 H. Al-Qasim keluar menemui mereka dan membunuh dua putra Abbad Al-Akili dan sekelompok dari mereka, lalu mereka melarikan diri ke Al-Allaf."
