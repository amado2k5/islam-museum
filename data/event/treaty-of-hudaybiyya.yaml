label: { en: "The Treaty of Hudaybiyya", ar: "صلح الحديبية" }
summary:
  en: "In Dhu al-Qa'da 6 AH (March 628 CE), the Prophet marched towards Mecca with 1,400 companions for Umrah; halted at al-Hudaybiyya by Quraysh, negotiations through Suhayl ibn Amr produced a historic ten-year peace treaty described in the Qur'an as a 'Manifest Victory'."
  ar: "في ذي القعدة سنة 6هـ (مارس 628م)، خرج النبي في ألف وأربعمائة معتمراً لا يريد حرباً؛ فلما صدته قريش بالحديبية تمت مفاوضات انتهت بصلح تاريخي عقده مع سهيل بن عمرو يقضي بوضع الحرب عشر سنين ورد من يأتي مسلماً بلا إذن وليه، وسماه الله في سورة الفتح «فتحاً مبيناً»."
