label: { en: "The Treaty of Hudaybiyya", ar: "صلح الحديبية" }
summary:
  ar: "في ذي القعدة سنة 6هـ ⁦(مارس 628م)⁩ خرج النبي في نحو ألف وأربعمائة من أتباعه إلى مكة للعمرة، فصدته قريش عند الحديبية على حافة الحرم، وتبادل المبعوثون الرسائل حتى عُقد صلح مدته عشر سنين. ومن بنوده انصراف المسلمين وعودتهم العام التالي لثلاثة أيام، ووضع الإغارة بين الطرفين، ورد من يأتي من قريش بغير إذن وليه، وحرية القبائل في الدخول في حلف أي من الطرفين. وبقي الصلح نحو عشرة أشهر بعد عمرة العام التالي ثم انتهى بخلاف بين الحليفين وفتح مكة."
  en: "In Dhu al-Qa'da 6 AH (March 628 CE) the Prophet set out for Mecca with about 1,400 followers to perform the umra. Quraysh barred the way at al-Hudaybiyya on the edge of the sacred territory, and envoys went back and forth until a ten-year treaty was agreed. Its chief terms were withdrawal for that year and a three-day visit the next, no raiding between the parties, the return of Qurashis who came without their protector's leave, and freedom for others to ally with either side. It lasted about ten months after the next year's pilgrimage, until a quarrel between allies led to the conquest of Mecca."
  ur: "ذوالقعدہ 6ھ ⁦(مارچ 628ء)⁩ میں نبی تقریباً 1400 ساتھیوں کے ساتھ عمرہ کے لیے مکہ روانہ ہوئے۔ قریش نے حرم کی سرحد پر حدیبیہ میں راستہ روکا اور قاصدوں کی آمد و رفت کے بعد دس سالہ صلح طے پائی۔ اس کی اہم شقیں یہ تھیں کہ اس سال واپسی اور اگلے سال تین دن کی آمد، دونوں فریقوں کے درمیان غارت گری نہ ہونا، سرپرست کی اجازت کے بغیر آنے والے قریشیوں کی واپسی، اور دوسروں کو کسی بھی فریق کا حلیف بننے کی آزادی۔ اگلے سال کے حج کے بعد یہ صلح تقریباً دس ماہ چلی، پھر حلیفوں کے جھگڑے سے فتحِ مکہ ہوئی۔"
