label: { ar: "أسر الدمستق على يد سيف الدولة", en: "Sayf al-Dawla captures the Domesticos", es: "Sayf al-Dawla captura a los Domésticos", fr: "Sayf al-Dawla capture les Domesticos", ur: "سیف الدولہ نے ڈومیسٹیکو کو پکڑ لیا۔" }
summary:
  ar: "في ربيع الآخر سنة اثنتين وأربعين وثلاثمائة ورد الخبر بغزاة لسيف الدولة وأنه غنم وقتل وسبى وأسر قسطنطين بن الدمستق؛ وفي سنة ثلاث وأربعين ورد الخبر بوقعة عظيمة بين الدمستق وسيف الدولة قُتل فيها خلق من أصحاب الدمستق ورؤساء بطارقته {cite:muntazam-ibn-al-jawzi p. 664, 666}."
  en: "In Rabi' II 342 word came of Sayf al-Dawla's raid: plunder, captives, and Constantine the Domesticos taken; in 343 a great battle cost the Domesticos many of his men and patrician chiefs {cite:muntazam-ibn-al-jawzi p. 664, 666}."
  es: "En Rabi' II 342 llegó la noticia de la incursión de Sayf al-Dawla: saqueo, cautivos y Constantino el Domesticos capturado; en 343 una gran batalla le costó al Domesticos muchos de sus hombres y jefes patricios {cite:muntazam-ibn-al-jawzi p. 664, 666}."
  fr: "En Rabi' II 342, la nouvelle du raid de Sayf al-Dawla parvint: butin, captifs et Constantin le Domesticos pris; en 343, une grande bataille coûta au Domesticos beaucoup de ses hommes et chefs patriciens {cite: muntazam-ibn-al-jawzi p. 664, 666}."
  ur: "ربیع دوم 342 میں سیف الدولہ کے چھاپے کا لفظ آیا: لوٹ مار، اسیر، اور قسطنطین دی ڈومیسٹیکوز۔ 343 میں ایک عظیم جنگ میں ڈومیسٹیکوس کو اس کے بہت سے آدمیوں اور سرپرستوں کے سرداروں کو نقصان اٹھانا پڑا۔ 664، 666}۔"
