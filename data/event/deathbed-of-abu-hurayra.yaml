label: { ar: "مرض أبي هريرة الأخير ووصيته في جنازته", en: "The last illness and funeral instructions of Abu Hurayra", ur: "ابو ہریرہ کا آخری مرض اور جنازے سے متعلق وصیت", es: "La última enfermedad e instrucciones para el funeral de Abu Hurayra" }
summary:
  ar: "لما مرض أبو هريرة مرضه الأخير بكى، فلما سُئل قال إنه لا يبكي على الدنيا وإنما على بُعد السفر وقلة الزاد وأن منزله بعدها إلى جنة أو نار {cite:siyar-alam-nubala scan vol. 1 p. 4075}. وزاره مروان بن الحكم فدعا أبو هريرة بأن يحب الله لقاءه كما يحب هو لقاء الله، ثم مات قبل أن يبلغ مروان السوق {cite:isaba scan vol. 2 p. 1793}. وأوصى ألا تُضرب عليه خيمة ولا يُتبع بمجمرة وأن يُسرع بجنازته {cite:isaba scan vol. 2 p. 1792}. ودُفن بالبقيع وشيّعه ابن عمر وأبو سعيد، ويختلف في سنة وفاته بين سبع وخمسين وتسع وخمسين {cite:siyar-alam-nubala scan vol. 1 p. 4075}."
  en: "In his last illness Abu Hurayra wept, and when asked said he was weeping not over this world but over the length of the journey, the scarcity of provisions and the climb after which he would be taken to Garden or Fire {cite:siyar-alam-nubala scan vol. 1 p. 4075}. When Marwan ibn al-Hakam visited him he prayed that God love to meet him as he loved to meet God, and died before Marwan reached the market {cite:isaba scan vol. 2 p. 1793}. He left word that no tent be pitched over him, no censer follow him, and that his bier be hurried {cite:isaba scan vol. 2 p. 1792}. He was buried in al-Baqi', Ibn Umar and Abu Sa'id escorting him; the year of his death is given as 57, 58 or 59 {cite:siyar-alam-nubala scan vol. 1 p. 4075}."
  ur: "اپنے آخری مرض میں ابو ہریرہ روئے، اور پوچھا گیا تو کہا کہ وہ اس دنیا پر نہیں روتے بلکہ سفر کی دوری، زادِ راہ کی کمی اور اس چڑھائی پر روتے ہیں جس کے بعد انھیں جنت یا دوزخ کی طرف لے جایا جائے گا {cite:siyar-alam-nubala scan vol. 1 p. 4075}۔ مروان بن الحکم عیادت کو آئے تو انھوں نے دعا کی کہ اللہ ان کی ملاقات کو پسند کرے جیسے وہ اللہ کی ملاقات کو پسند کرتے ہیں، اور مروان کے بازار تک پہنچنے سے پہلے وفات پا گئے {cite:isaba scan vol. 2 p. 1793}۔ وصیت کی کہ ان پر خیمہ نہ لگایا جائے، انگیٹھی ساتھ نہ چلے اور جنازے میں جلدی کی جائے {cite:isaba scan vol. 2 p. 1792}۔ وہ بقیع میں دفن ہوئے، ابن عمر اور ابو سعید جنازے کے ساتھ گئے؛ سنِ وفات ۵۷، ۵۸ یا ۵۹ بیان ہوا ہے {cite:siyar-alam-nubala scan vol. 1 p. 4075}۔"
  es: "En su última enfermedad, Abu Hurayra lloró, y cuando se le preguntó, dijo que no lloraba por este mundo sino por la duración del viaje, la escasez de provisiones y la subida después de la cual sería llevado al Jardín o al Fuego {cite:siyar-alam-nubala scan vol. 1 p. 4075}. Cuando Marwan ibn al-Hakam lo visitó, oró para que Dios amara encontrarse con él como él amaba encontrarse con Dios, y murió antes de que Marwan llegara al mercado {cite:isaba scan vol. 2 p. 1793}. Dejó instrucciones de que no se instalara ninguna tienda sobre él, que ningún incensario lo siguiera y que su féretro fuera apresurado {cite:isaba scan vol. 2 p. 1792}. Fue enterrado en al-Baqi', Ibn Umar y Abu Sa'id lo escoltaron; el año de su muerte se da como 57, 58 o 59 {cite:siyar-alam-nubala scan vol. 1 p. 4075}."
