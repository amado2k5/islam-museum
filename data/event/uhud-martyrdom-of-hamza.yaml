label: { en: "Martyrdom of Hamza ibn Abd al-Muttalib at Uhud", ar: "استشهاد حمزة بن عبد المطلب في أحد" }
summary:
  ar: "كان حمزة بن عبد المطلب يقاتل في عرض الناس كالجمل الأورق يهد الصفوف هداً. أرصده وحشي بن حرب، وهو عبد حبشي لجبير بن مطعم، من وراء شجرة أو حجر. وعد جبير وحشي بالعتق إن هو قتل حمزة ثأراً لعمه طعيمة بن عدي الذي أصيب في بدر. «هززتُ حربتي حتى إذا رضيتُ منها دفعتُها إليه فوقعت في ثنته حتى خرجت من بين رجليه» {cite:mubarakpuri-raheeq p.261}. قضى وحشي وعاد إلى مكة فأُعتق. ثم جاءت هند بنت عتبة فبقرت كبد حمزة فلاكتها فلم تستطع إساغتها {cite:mubarakpuri-raheeq p.276}."
