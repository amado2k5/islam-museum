id: event/uhud-martyrdom-of-hamza
class: event
kind: death
label: { en: "Martyrdom of Hamza ibn Abd al-Muttalib at Uhud", ar: "استشهاد حمزة بن عبد المطلب في أحد", es: "Martirio de Hamza ibn Abd al-Muttalib en Uhud", fr: "Martyre de Hamza ibn Abd al-Muttalib à Uhud", ur: "احد میں حمزہ بن عبدالمطلب کی شہادت", tr: "Hamza bin Abdülmuttalib'in Uhud'da şehadeti", id: "Kesyahidan Hamzah bin Abd al-Muttalib di Uhud" }
summary:
  ar: "كان حمزة بن عبد المطلب يقاتل في عرض الناس كالجمل الأورق يهد الصفوف هداً. أرصده وحشي بن حرب، وهو عبد حبشي لجبير بن مطعم، من وراء شجرة أو حجر. وعد جبير وحشي بالعتق إن هو قتل حمزة ثأراً لعمه طعيمة بن عدي الذي أصيب في بدر. «هززتُ حربتي حتى إذا رضيتُ منها دفعتُها إليه فوقعت في ثنته حتى خرجت من بين رجليه» {cite:mubarakpuri-raheeq p.261}. قضى وحشي وعاد إلى مكة فأُعتق. ثم جاءت هند بنت عتبة فبقرت كبد حمزة فلاكتها فلم تستطع إساغتها {cite:mubarakpuri-raheeq p.276}."
  en: "Hamza ibn Abd al-Muttalib was fighting in the open like a grey camel, sweeping the ranks aside. Wahshi ibn Harb, an Abyssinian slave of Jubayr ibn Mut'im, lay in wait behind a tree or rock; Jubayr had promised Wahshi his freedom if he killed Hamza in revenge for his uncle Tu'ayma ibn Adi, slain at Badr. 'I shook my spear until I was satisfied, then hurled it at him; it struck his flank and came out between his legs' {cite:mubarakpuri-raheeq p.261}. Wahshi finished him and returned to Mecca and was freed. Then Hind bint Utba came and cut open his liver and chewed it but could not swallow it {cite:mubarakpuri-raheeq p.276}."
  es: "Hamza ibn Abd al-Muttalib luchaba a campo abierto como un camello gris, barriendo las filas enemigas. Wahshi ibn Harb, un esclavo abisinio de Jubayr ibn Mut'im, estaba al acecho detrás de un árbol o una roca; Jubayr le había prometido a Wahshi su libertad si mataba a Hamza en venganza por su tío Tu'ayma ibn Adi, asesinado en Badr. «Agité mi lanza hasta quedar satisfecho, luego se la lancé; le dio en el flanco y salió entre sus piernas» {cite:mubarakpuri-raheeq p.261}. Wahshi lo remató y regresó a La Meca, donde fue liberado. Entonces llegó Hind bint Utba, le abrió el hígado y lo masticó, pero no pudo tragarlo {cite:mubarakpuri-raheeq p.276}."
  fr: "Hamza ibn Abd al-Muttalib combattait à découvert, tel un chameau gris, balayant les rangs ennemis. Wahshi ibn Harb, un esclave abyssinien de Jubayr ibn Mut'im, l'attendait, caché derrière un arbre ou un rocher. Jubayr lui avait promis sa liberté s'il tuait Hamza pour venger son oncle Tu'ayma ibn Adi, tué à Badr. « J'ai agité ma lance jusqu'à ce que je sois satisfait, puis je l'ai lancée sur lui; elle l'a frappé au flanc et est ressortie entre ses jambes » (Mubarakpuri-Raheeq, p. 261). Wahshi l'acheva et retourna à La Mecque où il fut affranchi. Hind bint Utba vint alors lui ouvrir le foie et le mâcha, mais ne put l'avaler (Mubarakpuri-Raheeq, p. 276)."
  ur: "حمزہ بن عبدالمطلب سرمئی اونٹ کی طرح کھلے میدان میں صفوں کو جھاڑتے ہوئے لڑ رہے تھے۔ وحشی بن حرب، جبیر بن مطعم کا ایک حبشی غلام، ایک درخت یا چٹان کے پیچھے انتظار میں پڑا تھا۔ جبیر نے وحشی سے وعدہ کیا تھا کہ اگر وہ حمزہ کو اپنے چچا طعیمہ بن عدی کے بدلے میں قتل کر دے جو بدر میں مارا گیا تھا۔ 'میں نے اپنا نیزہ ہلایا یہاں تک کہ میں مطمئن ہو گیا، پھر اسے اس پر پھینک دیا۔ یہ اس کی طرف سے ٹکرایا اور اس کی ٹانگوں کے درمیان سے باہر نکل آیا۔ وحشی اسے ختم کر کے مکہ واپس آیا اور آزاد ہو گیا۔ پھر ہند بنت عتبہ آئی اور اپنا جگر کاٹ کر چبایا لیکن اسے نگل نہ سکی۔"
  tr: "Hamza ibn Abd al-Muttalib, düşman saflarının arasında çevik, gri bir deve gibi savaştı, hatlarını amansızca yarıp geçti. Cübeyr ibn Mut'im'in Habeşli kölesi Vahşi ibn Harb, bir ağacın veya kayanın arkasına saklanarak onu bekliyordu. Cübeyr, Vahşi'ye, Bedir'de öldürülen amcası Tuayme ibn Adi'nin intikamını almak için Hamza'yı öldürmesi karşılığında özgürlüğünü vereceğine söz vermişti. \"Mızrağımı uygun pozisyona gelene kadar salladım, sonra ona sapladım ve kasıklarını delip bacaklarının arasından çıktı\" {cite:mubarakpuri-raheeq s.261}. Vahşi öldü ve Mekke'ye döndü, orada serbest bırakıldı. Sonra Hind bint Utbah geldi ve Hamza'nın ciğerini kesip çiğnedi ama yutamadı {cite:mubarakpuri-raheeq s.276}."
  id: "Hamza ibn Abd al-Muttalib bertempur di tengah barisan musuh seperti unta abu-abu yang cepat, tanpa henti menerobos garis pertahanan mereka. Wahshi ibn Harb, seorang budak Abyssinia milik Jubayr ibn Mut'im, menunggunya, bersembunyi di balik pohon atau batu. Jubayr telah menjanjikan kebebasan kepada Wahshi jika ia membunuh Hamza sebagai balas dendam atas pamannya, Tu'aymah ibn Adi, yang telah terbunuh di Badr. \"Aku mengacungkan tombakku sampai aku puas dengan posisinya, lalu aku menusukkannya ke arahnya, dan tombak itu menembus selangkangannya dan keluar di antara kedua kakinya\" {kutip:mubarakpuri-raheeq hlm. 261}. Wahshi meninggal dan kembali ke Mekah, di mana ia dibebaskan. Kemudian Hind bint Utbah datang dan membelah hati Hamza, mengunyahnya tetapi tidak mampu menelannya {kutip:mubarakpuri-raheeq hlm. 276}."
