id: event/al-suyuti-completes-tafsir-al-jalalayn-870
class: event
kind: publication
label:
  ar: "إتمام السيوطي تفسير الجلالين، 870هـ/1466م"
  en: "Al-Suyuti completes Tafsir al-Jalalayn, 870/1466"
  ur: "سیوطی کا تفسیر الجلالین کو مکمل کرنا، 870ھ/1466ء"
summary:
  ar: "بدأ جلال الدين السيوطي تكملة تفسير شيخ عصره جلال الدين المحلي يوم الأربعاء مستهل رمضان سنة 870هـ، وفرغ منها يوم الأحد عاشر شوال من السنة نفسها، وفرغ من تبييضها يوم الأربعاء سادس صفر سنة 871هـ؛ وهي من أول البقرة إلى آخر الإسراء {cite:tafsir-jalalayn-lithograph-1278 p.370} {cite:tafsir-jalalayn-lithograph-1278 p.4}."
  en: "Jalal al-Din al-Suyuti began his completion of Jalal al-Din al-Mahalli's commentary on Wednesday 1 Ramadan 870 AH, finished it on Sunday 10 Shawwal of the same year and finished the fair copy on Wednesday 6 Safar 871; it runs from the start of al-Baqara to the end of al-Isra' {cite:tafsir-jalalayn-lithograph-1278 p.370} {cite:tafsir-jalalayn-lithograph-1278 p.4}."
  ur: "جلال الدین سیوطی نے جلال الدین محلی کی تفسیر کا تکملہ بدھ یکم رمضان 870ھ کو شروع کیا، اسی سال اتوار دس شوال کو مکمل کیا، اور بدھ چھ صفر 871ھ کو اس کا صاف نسخہ تیار کیا؛ یہ سورۂ بقرہ کے آغاز سے سورۂ اسرا کے آخر تک ہے {cite:tafsir-jalalayn-lithograph-1278 p.370} {cite:tafsir-jalalayn-lithograph-1278 p.4}۔"
