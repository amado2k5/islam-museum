id: event/mutah-prophets-grief-and-condolence
class: event
kind: other
label: { ar: "حزن النبي على جعفر وأمره بإطعام أهله", en: "The Prophet's grief over Ja'far and his instruction to feed his family", es: "El dolor del Profeta por Ja'far y su instrucción de alimentar a su familia.", fr: "Le chagrin du Prophète pour Ja'far et son instruction de nourrir sa famille", ur: "جعفر پر پیغمبر کا غم اور اپنے گھر والوں کو کھانا کھلانے کی ہدایت" }
summary:
  ar: "لما أُصيب جعفر جاء النبي إلى بيت أسماء بنت عميس وطلب أبناء جعفر، فلما رآهم تشممهم وذرفت عيناه. وأخبر أسماء باستشهاد جعفر وأصحابه ذلك اليوم. وأمر الناس ألا يُغفلوا آل جعفر من إطعامهم. وأخبرت عائشة أن الحزن ظهر في وجه النبي حين جاء نعي جعفر."
  en: "When Ja'far was killed the Prophet visited Asma' bint Umays, asked for Ja'far's children, smelled them and wept. He told her they had been struck down that day, and instructed the community not to neglect Ja'far's household and to send them food. Aisha reported that grief was visible on the Prophet's face when the news of Ja'far arrived."
  es: "Cuando Ja'far fue asesinado, el Profeta visitó a Asma bint Umays, preguntó por los hijos de Ja'far, los olió y lloró. Le contó que habían fallecido ese día e instruyó a la comunidad a no descuidar a la familia de Ja'far y a enviarles comida. Aisha relató que el dolor se reflejó en el rostro del Profeta al recibir la noticia de la muerte de Ja'far."
  fr: "Lorsque Ja'far fut tué, le Prophète rendit visite à Asma' bint Umays, s'enquit des enfants de Ja'far, les huma et pleura. Il lui annonça qu'ils avaient été frappés par la mort ce jour-là et demanda à la communauté de ne pas négliger la famille de Ja'far et de leur envoyer de la nourriture. Aïcha rapporta que la douleur se lisait sur le visage du Prophète à l'annonce de la mort de Ja'far."
  ur: "جب جعفر کو قتل کیا گیا تو نبی اسماء بنت عمیس کے پاس گئے، جعفر کے بچوں کے بارے میں پوچھا، انہیں سونگھ لیا اور رونے لگے۔ اس نے اسے بتایا کہ وہ اس دن مارے گئے تھے، اور کمیونٹی کو ہدایت کی کہ جعفر کے گھر والوں کو نظر انداز نہ کریں اور انہیں کھانا بھیجیں۔ عائشہ ا نے بیان کیا کہ جب جعفر کی خبر پہنچی تو رسول اللہ کے چہرے پر غم نمایاں تھا۔"
