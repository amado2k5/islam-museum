label: { ar: "حزن النبي على جعفر وأمره بإطعام أهله", en: "The Prophet's grief over Ja'far and his instruction to feed his family" }
summary:
  ar: "لما أُصيب جعفر جاء النبي إلى بيت أسماء بنت عميس وطلب أبناء جعفر، فلما رآهم تشممهم وذرفت عيناه. وأخبر أسماء باستشهاد جعفر وأصحابه ذلك اليوم. وأمر الناس ألا يُغفلوا آل جعفر من إطعامهم. وأخبرت عائشة أن الحزن ظهر في وجه النبي حين جاء نعي جعفر."
  en: "When Ja'far was killed the Prophet visited Asma' bint Umays, asked for Ja'far's children, smelled them and wept. He told her they had been struck down that day, and instructed the community not to neglect Ja'far's household and to send them food. Aisha reported that grief was visible on the Prophet's face when the news of Ja'far arrived."
