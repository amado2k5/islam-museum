id: event/djerba-capture-683
class: event
kind: conquest
label:
  ar: استيلاء أسطول الأرغون على جزيرة جربة
  en: The Aragonese capture of Djerba
summary:
  ar: "من أعظم الحوادث وأشجى الوقائع للمسلمين: استولت أساطيل فدريك بن ملك برشلونة على جزيرة جربة في رجب سنة 683هـ في نحو سبعين أسطولاً من غربان وشواني، ورئاسة الجزيرة يومئذ لمحمد بن سمون من شيخ الوهبية وابن أمغار شيخ النكازة وهما فرقتا الخوارج، فانتهبوا أموالها وحملوا أهلها أسراً وسبياً وقيل بلغوا ثمانية آلاف بعد أن رموا بالرضع في الجبوب، وبنوا بساحلها حصناً وشحنوه حامية وسلاحاً وفرضوا على الباقين مغرم مائة ألف دينار كل سنة، وبقيت في ملك النصارى إلى أواخر الأربعين من المائة الثامنة."
  en: "One of the gravest disasters and most grievous of days for the Muslims: the fleet of Frederick, son of the king of Barcelona, seized the island of Djerba in Rajab 683 with some seventy galleys and shallops — the island then led by Muhammad ibn Samun of the Wahbi shaykhs and Ibn Umghar shaykh of the Nukkaz, the two Khariji sects — plundering its wealth and carrying off its people, eight thousand by report, having thrown the infants into wells; they built a garrisoned fort on its coast, imposed an annual tribute of a hundred thousand dinars, and held it until the late 740s."
