id: event/djerba-capture-683
class: event
kind: conquest
label:
  ar: استيلاء أسطول الأرغون على جزيرة جربة
  en: The Aragonese capture of Djerba
  es: "La captura de Djerba por los aragoneses"
  fr: "La prise de Djerba par les Aragonais"
  ur: "اراگونیوں کا جربا پر قبضہ"
  tr: "Aragon filosu Djerba adasını ele geçirdi."
  id: "Armada Aragon berhasil merebut pulau Djerba."
summary:
  ar: "من أعظم الحوادث وأشجى الوقائع للمسلمين: استولت أساطيل فدريك بن ملك برشلونة على جزيرة جربة في رجب سنة 683هـ في نحو سبعين أسطولاً من غربان وشواني، ورئاسة الجزيرة يومئذ لمحمد بن سمون من شيخ الوهبية وابن أمغار شيخ النكازة وهما فرقتا الخوارج، فانتهبوا أموالها وحملوا أهلها أسراً وسبياً وقيل بلغوا ثمانية آلاف بعد أن رموا بالرضع في الجبوب، وبنوا بساحلها حصناً وشحنوه حامية وسلاحاً وفرضوا على الباقين مغرم مائة ألف دينار كل سنة، وبقيت في ملك النصارى إلى أواخر الأربعين من المائة الثامنة."
  en: "One of the gravest disasters and most grievous of days for the Muslims: the fleet of Frederick, son of the king of Barcelona, seized the island of Djerba in Rajab 683 with some seventy galleys and shallops — the island then led by Muhammad ibn Samun of the Wahbi shaykhs and Ibn Umghar shaykh of the Nukkaz, the two Khariji sects — plundering its wealth and carrying off its people, eight thousand by report, having thrown the infants into wells; they built a garrisoned fort on its coast, imposed an annual tribute of a hundred thousand dinars, and held it until the late 740s."
  es: "Uno de los desastres más graves y uno de los días más aciagos para los musulmanes: la flota de Federico, hijo del rey de Barcelona, se apoderó de la isla de Djerba en Rajab 683 con unas setenta galeras y chalupas —la isla estaba entonces gobernada por Muhammad ibn Samun de los shaykhs wahabíes e Ibn Umghar shaykh de los Nukkaz, las dos sectas jariyíes—, saqueando sus riquezas y llevándose a su gente, ocho mil según los informes, tras haber arrojado a los bebés a pozos; construyeron un fuerte guarnecido en su costa, impusieron un tributo anual de cien mil dinares y la mantuvieron hasta finales de la década de 740."
  fr: "L'un des plus grands désastres et des jours les plus douloureux pour les musulmans: la flotte de Frédéric, fils du roi de Barcelone, s'empara de l'île de Djerba en Rajab 683 avec quelque soixante-dix galères et chaloupes — l'île était alors dirigée par Muhammad ibn Samun, cheikh wahbi, et Ibn Umghar, cheikh nukkaz, les deux sectes kharijites — pillant ses richesses et emmenant ses habitants, huit mille selon les rapports, après avoir jeté les nourrissons dans des puits; ils construisirent un fort garnison sur sa côte, imposèrent un tribut annuel de cent mille dinars et l'occupèrent jusqu'à la fin des années 740."
  ur: "مسلمانوں کے لیے سب سے بڑی آفات اور سب سے زیادہ المناک دنوں میں سے ایک: بارسلونا کے بادشاہ کے بیٹے فریڈرک کے بحری بیڑے نے رجب 683 میں جزیرے جزیربہ پر تقریباً 70 گیلیوں اور ڈھلوانوں کے ساتھ قبضہ کر لیا - اس جزیرے کی قیادت پھر وہبی شیخوں کے محمد بن سمعون اور ابن خضر عمش کے دو شیخوں نے کی۔ - اس کی دولت کو لوٹنا اور اس کے لوگوں کو اٹھانا، رپورٹ کے مطابق آٹھ ہزار، شیر خوار بچوں کو کنوؤں میں پھینک دینا۔ انہوں نے اس کے ساحل پر ایک چوکیدار قلعہ بنایا، ایک لاکھ دینار کا سالانہ خراج عائد کیا اور 740 کی دہائی کے آخر تک اسے اپنے پاس رکھا۔"
  tr: "Müslümanlar için en büyük ve en trajik olaylardan biri, Barselona kralı Frederick'in filolarının, Hicri 683 yılının Receb ayında yaklaşık yetmiş gemi ve kruvazörden oluşan bir filo ile Cerbe adasını ele geçirmesiydi. O dönemde adanın yönetimini Vahhabi şeyhi Muhammed bin Samun ve Nakaza şeyhi İbn Amghar üstlenmişti ve bunlar Haricilerin iki grubuydu. Adanın zenginliklerini yağmaladılar, halkını esir alıp köleleştirdiler ve bebekleri kuyulara attıktan sonra sayılarının sekiz bine ulaştığı söyleniyordu. Kıyısına bir kale inşa edip garnizon ve silahlarla doldurdular ve geri kalanından her yıl yüz bin dinar vergi aldılar. Ada, sekizinci yüzyılın kırklı yıllarının sonuna kadar Hristiyanların elinde kaldı."
  id: "Salah satu peristiwa terbesar dan paling tragis bagi umat Islam adalah ketika armada Frederick, raja Barcelona, merebut pulau Djerba pada bulan Rajab tahun 683 H dengan sekitar tujuh puluh armada kapal dan perahu. Kepemimpinan pulau pada waktu itu berada di tangan Muhammad bin Samoun, syekh Wahhabiyah, dan Ibn Amghar, syekh Nakaza, dan mereka adalah dua kelompok Kharijites. Mereka menjarah kekayaan pulau itu dan menawan serta memperbudak penduduknya, dan konon jumlah mereka mencapai delapan ribu orang setelah mereka melemparkan bayi-bayi ke dalam lubang. Mereka membangun benteng di pantainya dan menempatkan garnisun dan persenjataan di sana, serta memungut denda seratus ribu dinar setiap tahun dari penduduk lainnya. Pulau itu tetap berada di bawah kekuasaan orang Kristen hingga akhir tahun 1840-an."
