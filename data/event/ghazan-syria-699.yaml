label: { ar: "فتنة غازان بالشام سنة 699هـ", en: "Ghazan's devastation of Syria, 699", es: "La devastación de Siria por Ghazan, 699", fr: "La dévastation de la Syrie par Ghazan, 699", ur: "غازان کی شام کی تباہی، 699", tr: "Hicri 699 yılında Suriye'de Gazan'ın isyanı", id: "Pemberontakan Ghazan di Suriah pada tahun 699 Hijriah" }
summary:
  ar: "في سنة تسع وتسعين كانت بالشام فتنة غازان ملك التتار: توفي فيها من شيوخ الحديث بدمشق والجبل — يعني بالصالحية — أكثر من مائة نفس، وقُتل بالجبل ومات برداً وجوعاً نحو أربعمائة نفس، وأُسر نحو أربعة آلاف منهم سبعون نسمة من ذرية الشيخ أبي عمر {cite:shadharat-dhahab p. 775}."
  en: "In 699 the Tatar ruler Ghazan's upheaval struck Syria: more than a hundred souls, among them hadith shaykhs in Damascus and al-Jabal (meaning al-Salihiyya), died; some four hundred were killed in al-Jabal or died of cold and hunger; and some four thousand were taken captive, seventy of them descendants of Shaykh Abu Umar {cite:shadharat-dhahab p. 775}."
  ur: "699ھ میں تاتاری حاکم غازان کی خرابی نے شام کو متاثر کیا: دمشق اور جبل ⁦(یعنی صالحیہ)⁩ میں محدثین سمیت سو سے زائد افراد فوت ہوئے؛ جبل میں تقریباً چار سو قتل یا سردی و بھوک سے مرے؛ اور تقریباً چار ہزار قیدی بنائے گئے جن میں ستر شیخ ابو عمر کی اولاد تھیں {cite:shadharat-dhahab p. 775}۔"
  es: "En 699, la revuelta del gobernante tártaro Ghazan azotó Siria: murieron más de cien personas, entre ellas jeques de hadices en Damasco y al-Jabal (que significa al-Salihiyya); unas cuatrocientas fueron asesinadas en al-Jabal o murieron de frío y hambre; y unas cuatro mil fueron tomadas cautivas, setenta de ellas descendientes del jeque Abu Umar {cita: shadharat-dhahab p. 775}."
  fr: "En 699, le soulèvement du souverain tatar Ghazan frappa la Syrie: plus d'une centaine d'âmes, parmi lesquelles des cheikhs du hadith à Damas et à al-Jabal (signifiant al-Salihiyya), moururent; quelque quatre cents furent tués à al-Jabal ou moururent de froid et de faim; et quelque quatre mille furent faits prisonniers, dont soixante-dix descendants du cheikh Abu Umar {cite: shadharat-dhahab p. 775}."
  tr: "99. yılda Tatarların kralı Gazan tarafından Levant'ta bir felaket yaşandı: Şam'da ve dağda (yani el-Salihiyye'de) hadis şeyhlerinden yüzden fazlası öldü; dağda yaklaşık dört yüz kişi soğuktan ve açlıktan öldü; yaklaşık dört bin kişi ise esir alındı. Bunların arasında Şeyh Ebu Ömer'in soyundan yetmiş kişi de vardı. {Kaynak: Şadharat-dhahab s. 775}"
  id: "Pada tahun sembilan puluh sembilan, terjadi penderitaan di Levant oleh Ghazan, raja Tatar: lebih dari seratus syekh Hadits meninggal di Damaskus dan gunung — maksudnya di al-Salihiyya — dan sekitar empat ratus orang terbunuh di gunung dan meninggal karena kedinginan dan kelaparan, dan sekitar empat ribu orang ditawan, termasuk tujuh puluh orang dari keturunan Syekh Abu Omar {cite:shadharat-dhahab p. 775}."
