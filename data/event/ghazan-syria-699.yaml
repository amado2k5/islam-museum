label: { ar: "فتنة غازان بالشام سنة 699هـ", en: "Ghazan's devastation of Syria, 699" }
summary:
  ar: "في سنة تسع وتسعين كانت بالشام فتنة غازان ملك التتار: توفي فيها من شيوخ الحديث بدمشق والجبل — يعني بالصالحية — أكثر من مائة نفس، وقُتل بالجبل ومات برداً وجوعاً نحو أربعمائة نفس، وأُسر نحو أربعة آلاف منهم سبعون نسمة من ذرية الشيخ أبي عمر {cite:shadharat-dhahab p. 775}."
  en: "In 699 the Tatar ruler Ghazan's upheaval struck Syria: more than a hundred souls, among them hadith shaykhs in Damascus and al-Jabal (meaning al-Salihiyya), died; some four hundred were killed in al-Jabal or died of cold and hunger; and some four thousand were taken captive, seventy of them descendants of Shaykh Abu Umar {cite:shadharat-dhahab p. 775}."
  ur: "699ھ میں تاتاری حاکم غازان کی خرابی نے شام کو متاثر کیا: دمشق اور جبل (یعنی صالحیہ) میں محدثین سمیت سو سے زائد افراد فوت ہوئے؛ جبل میں تقریباً چار سو قتل یا سردی و بھوک سے مرے؛ اور تقریباً چار ہزار قیدی بنائے گئے جن میں ستر شیخ ابو عمر کی اولاد تھیں {cite:shadharat-dhahab p. 775}۔"
