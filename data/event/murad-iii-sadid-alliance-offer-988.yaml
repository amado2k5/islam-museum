label: { ar: "عرض مراد الثالث التحالف على السعديين لاسترداد الأندلس", en: "Murad III's offer of an alliance with the Sa'dids to recover al-Andalus", es: "La oferta de Murad III de una alianza con los Sa'id para recuperar al-Ándalus.", fr: "L'offre d'alliance de Murad III avec les Sa'didides pour reconquérir al-Andalus", ur: "مراد سوم کی الاندلس کی بازیابی کے لیے سعدیوں کے ساتھ اتحاد کی پیشکش", tr: "Murad III, Endülüs'ü geri almak için Saadi hanedanına ittifak teklif etti.", id: "Murad III menawarkan aliansi kepada Dinasti Saadia untuk merebut kembali Andalusia." }
summary:
  ar: "لما ابتزّت القوات الإسبانية الأراضي البرتغالية وضمتها سنة ٩٨٨هـ/١٥٨٠م، اقترح السلطان مراد الثالث عقد تحالف عسكري مع الدولة السعدية ضد الإسبان على أساس إمدادها بأسطول حربي وقوات عسكرية، فبعث برسالتين في رجب ٩٨٨هـ/سبتمبر ١٥٨٠م قال فيهما: فلما وصل بمسامعنا الشريفة خبر طاغية قشتالة وأنه احتوى على سلطنة برتغال وأنه جعل أهلها في الأغلال والأصفاد، حرّكنا الحمية الإسلامية لإظهار الألفة الأزلية أن تتخذوا عهداً وتؤكدوا أن المملكتين محروستا الجوانب ونعلق العهد بالكعبة، فإذا تم هذا الشأن نوجه لكم ثلاثمائة غراب سلطاني وجيش عز ونصر وكماة عثمانية تستفتحون بها إن شاء الله بلاد الأندلس {cite:dawlat-uthmaniyya-salabi p. 270}."
  en: "Rajab 988/September 1580 — as Spain swallowed Portugal, Murad III wrote the Sa'dids proposing an alliance sworn at the Ka'ba: three hundred imperial galleys and an Ottoman army to 'open the land of al-Andalus' {cite:dawlat-uthmaniyya-salabi p. 270}."
  es: "Rajab 988/septiembre de 1580 — mientras España se tragaba Portugal, Murad III escribió a los Sa'id proponiendo una alianza jurada en la Kaaba: trescientas galeras imperiales y un ejército otomano para 'abrir la tierra de al-Ándalus' {cite:dawlat-uthmaniyya-salabi p. 270}."
  fr: "Rajab 988/septembre 1580 — alors que l'Espagne engloutissait le Portugal, Murad III écrivit aux Sa'didides pour leur proposer une alliance jurée à la Ka'ba: trois cents galères impériales et une armée ottomane pour « ouvrir le pays d'al-Andalus » {cite: dawlat-uthmaniyya-salabi p. 270}."
  ur: "رجب 988/ستمبر 1580 - جیسا کہ اسپین نے پرتگال کو نگل لیا، مراد III نے سعدیوں کو کعبہ میں حلف برداری کی تجویز لکھی: تین سو شاہی گیلیاں اور ایک عثمانی فوج 'اندلس کی سرزمین کو کھولنے' کے لیے۔ 270}۔"
  tr: "İspanyol kuvvetleri 988 Hicri/1580 Miladi yılında Portekiz topraklarını ele geçirip ilhak ettiğinde, Sultan III. Murad, Saadi devletiyle İspanyollara karşı, donanma ve askeri güç tedarikine dayalı bir askeri ittifak teklif etti. 988 Hicri/Eylül 1580 Receb ayında iki mektup göndererek şunları söyledi: “Kastilya tiranının Portekiz Sultanlığı'nı ele geçirdiği ve halkını zincire vurduğu haberi asil kulaklarımıza ulaştığında, ebedi bağı göstermek için İslami bir şevkle harekete geçtik; iki krallığın her yönden korunduğunu teyit eden bir antlaşma yapmanızı ve bu antlaşmayı Kâbe'ye bağlamamızı istedik. Bu iş tamamlanırsa, size üç yüz Sultanlık kargası ve kudret ve zafer ordusu ile Osmanlı savaşçıları göndereceğiz; Allah'ın izniyle, bunlarla Endülüs topraklarını fethedeceksiniz.” {cite:dawlat-uthmaniyya-salabi s. 270}."
  id: "Ketika pasukan Spanyol merebut dan mencaplok tanah Portugis pada tahun 988 H/1580 M, Sultan Murad III mengusulkan aliansi militer dengan negara Saadi melawan Spanyol, berdasarkan penyediaan armada angkatan laut dan pasukan militer. Beliau mengirimkan dua surat pada bulan Rajab 988 H/September 1580 M, di mana beliau berkata: “Ketika berita tentang tiran Kastilia sampai ke telinga kami yang mulia, bahwa ia telah merebut Kesultanan Portugal dan bahwa ia telah membelenggu dan mengikat rakyatnya, kami tergerak oleh semangat Islam untuk menunjukkan ikatan abadi, bahwa Anda membuat perjanjian dan menegaskan bahwa kedua kerajaan dilindungi di semua sisi, dan kami melampirkan perjanjian itu pada Ka'bah. Jika masalah ini diselesaikan, kami akan mengirimkan tiga ratus burung gagak Sultan dan pasukan yang perkasa dan penuh kemenangan serta prajurit Ottoman yang dengannya Anda, insya Allah, akan menaklukkan tanah Andalusia.” {cite:dawlat-uthmaniyya-salabi p. 270}."
