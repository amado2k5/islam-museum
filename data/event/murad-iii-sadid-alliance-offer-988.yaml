label: { ar: "عرض مراد الثالث التحالف على السعديين لاسترداد الأندلس" }
summary:
  ar: "لما ابتزّت القوات الإسبانية الأراضي البرتغالية وضمتها سنة ٩٨٨هـ/١٥٨٠م، اقترح السلطان مراد الثالث عقد تحالف عسكري مع الدولة السعدية ضد الإسبان على أساس إمدادها بأسطول حربي وقوات عسكرية، فبعث برسالتين في رجب ٩٨٨هـ/سبتمبر ١٥٨٠م قال فيهما: فلما وصل بمسامعنا الشريفة خبر طاغية قشتالة وأنه احتوى على سلطنة برتغال وأنه جعل أهلها في الأغلال والأصفاد، حرّكنا الحمية الإسلامية لإظهار الألفة الأزلية أن تتخذوا عهداً وتؤكدوا أن المملكتين محروستا الجوانب ونعلق العهد بالكعبة، فإذا تم هذا الشأن نوجه لكم ثلاثمائة غراب سلطاني وجيش عز ونصر وكماة عثمانية تستفتحون بها إن شاء الله بلاد الأندلس {cite:dawlat-uthmaniyya-salabi p. 270}."
  en: "Rajab 988/September 1580 — as Spain swallowed Portugal, Murad III wrote the Sa'dids proposing an alliance sworn at the Ka'ba: three hundred imperial galleys and an Ottoman army to 'open the land of al-Andalus' {cite:dawlat-uthmaniyya-salabi p. 270}."
