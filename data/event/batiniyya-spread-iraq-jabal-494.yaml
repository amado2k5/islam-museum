label: { ar: "استفحال دعوة الباطنية بالعراق والجبل سنة 494", en: "The spread of the Batiniyya mission in Iraq and the Jibal in 494", fr: "L'expansion de la mission des Batiniyya en Irak et au Jibal en 494", es: "La expansión de la misión Batiniyya en Irak y el Jibal en 494", ur: "494 میں عراق اور جبل میں بطینی مشن کا پھیلاؤ" }
summary:
  ar: "في سنة أربع وتسعين وأربعمائة كثرت الباطنية بالعراق والجبل وزعيمهم الحسن بن الصباح، فملكوا القلاع وقطعوا السيل وأهم الناس شأنهم واستفحل أمرهم لاشتغال أولاد ملكشاه بنفوسهم {cite:shadharat-dhahab p. 400}."
  en: "In 494 the Batiniyya multiplied through Iraq and the Jibal under their leader Hasan b. Sabbah — they took the fortresses, cut the road, and became the people's pressing concern as Malikshah's sons stayed busy fighting one another {cite:shadharat-dhahab p. 400}."
  fr: "En 494, les Batiniyya se multiplièrent à travers l'Irak et le Jibal sous leur chef Hasan ibn Sabbah ; ils prirent les forteresses, coupèrent les routes et devinrent le souci pressant des gens, tandis que les fils de Malikshah restaient occupés à se combattre {cite:shadharat-dhahab p. 400}."
  es: "En 494, los Batiniyya se multiplicaron por Irak y el Jibal bajo el mando de su líder Hasan b. Sabbah; tomaron las fortalezas, cortaron el camino y se convirtieron en la principal preocupación del pueblo, ya que los hijos de Malikshah estaban ocupados luchando entre sí {cita: shadharat-dhahab p. 400}."
  ur: "494 میں بطنیہ عراق اور جبل میں ان کے رہنما حسن بن کے ماتحت بڑھ گئے۔ سبھا - انہوں نے قلعے لے لیے، سڑک کاٹ دی، اور ملک شاہ کے بیٹے ایک دوسرے سے لڑنے میں مصروف رہنے کے بعد لوگوں کی پریشانی کا باعث بن گئے۔ 400}۔"
