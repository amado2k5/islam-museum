label: { ar: "وفاة قثم بن العباس بسمرقند", en: "Qutham ibn al-Abbas's Death at Samarqand", es: "Muerte de Qutham ibn al-Abbas en Samarcanda", fr: "Mort de Qutham ibn al-Abbas à Samarqand", ur: "قطام ابن عباس کی سمرقند میں وفات", tr: "Kutham ibn al-Abbas'ın Semerkant'ta ölümü", id: "Kematian Qutham ibn al-Abbas di Samarkand" }
summary:
  ar: "كان قثم بن العباس بن عبد المطلب مع سعيد بن عثمان فتوفى بسمرقند ويقال استشهد بها فقال عبد الله بن العباس حين بلغته وفاته شتان ما بين مولده ومقبره فأقبل يصلي فقيل له ما هذا فقرأ الآية في الاستعانة بالصبر والصلاة وقد قدم قثم على سعيد بن عثمان بخراسان فعرض عليه سعيد من المغنم خمسة أسهم فقال لا ولكن أعطني سهماً لي وسهماً لفرسي."
  en: "Qutham ibn al-Abbas ibn Abd al-Muttalib died with Sa'id's army at Samarqand — some say martyred; hearing it, Ibn Abbas said 'what a distance between his birthplace and his grave' and turned to prayer, citing the verse on seeking help in patience and prayer. Earlier, offered five booty-shares by Sa'id at Khurasan, Qutham had asked only for one share for himself and one for his horse."
  es: "Qutham ibn al-Abbas ibn Abd al-Muttalib murió con el ejército de Sa'id en Samarcanda; algunos dicen que fue martirizado. Al oírlo, Ibn Abbas exclamó: «¡Qué distancia hay entre su lugar de nacimiento y su tumba!» y se dedicó a la oración, citando el versículo que habla de buscar consuelo en la paciencia y la oración. Anteriormente, Sa'id le había ofrecido cinco partes del botín en Jorasán, pero Qutham solo había pedido una para sí mismo y otra para su caballo."
  fr: "Qutham ibn al-Abbas ibn Abd al-Muttalib mourut avec l'armée de Sa'id à Samarcande – certains disent en martyr. À cette nouvelle, Ibn Abbas s'exclama: « Quelle distance entre son lieu de naissance et sa tombe ! » et se mit à prier, citant le verset sur la patience et la prière. Auparavant, à Khorasan, Sa'id lui avait offert cinq parts du butin; Qutham n'en avait demandé qu'une pour lui et une pour son cheval."
  ur: "قطام بن العباس بن عبد المطلب سعید کی فوج کے ساتھ سمرقند میں مر گیا - بعض کہتے ہیں کہ شہید ہو گئے؛ یہ سن کر ابن عباس نے کہا کہ اس کی جائے پیدائش اور اس کی قبر کے درمیان کتنا فاصلہ ہے اور صبر اور نماز میں مدد مانگنے والی آیت کا حوالہ دیتے ہوئے نماز کی طرف متوجہ ہوئے۔ اس سے پہلے خراسان میں سعید کی طرف سے غنیمت کے پانچ حصص پیش کیے گئے، قطام نے صرف ایک حصہ اپنے لیے اور ایک اپنے گھوڑے کے لیے مانگا تھا۔"
  tr: "Kutham ibn el-Abbas ibn Abd el-Muttalib, Said ibn Osman'ın Semerkant'ta öldüğü sırada onun yanındaydı. Orada şehit edildiği söylenir. Abdullah ibn el-Abbas, ölüm haberini aldığında, \"Doğumu ile mezarı ne kadar farklı!\" dedi. Bunun üzerine namaz kılmaya başladı. Ona, \"Bu nedir?\" diye soruldu. O da sabır ve dua ile yardım dilemekle ilgili ayeti okudu. Kutham, Horasan'da Said ibn Osman'ın yanına gelmişti ve Said ona ganimetin beş payını teklif etmişti. Kutham, \"Hayır, ama bana bir payını kendim için, bir payını da atım için ver\" demişti."
  id: "Qutham ibn al-Abbas ibn Abd al-Muttalib bersama Saeed ibn Uthman ketika beliau wafat di Samarkand. Dikatakan bahwa beliau syahid di sana. Abdullah ibn al-Abbas berkata ketika kabar kematiannya sampai kepadanya, “Betapa berbedanya kelahirannya dengan kuburnya!” Maka beliau mulai berdoa. Beliau ditanya, “Apa ini?” Maka beliau membacakan ayat tentang memohon pertolongan melalui kesabaran dan doa. Qutham datang kepada Saeed ibn Uthman di Khorasan, dan Saeed menawarkannya lima bagian dari rampasan perang. Qutham berkata, “Tidak, tetapi berikanlah satu bagian untuk diriku dan satu bagian untuk kudaku.”"
