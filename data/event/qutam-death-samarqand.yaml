label: { ar: "وفاة قثم بن العباس بسمرقند", en: "Qutham ibn al-Abbas's Death at Samarqand", es: "Muerte de Qutham ibn al-Abbas en Samarcanda", fr: "Mort de Qutham ibn al-Abbas à Samarqand" }
summary:
  ar: "كان قثم بن العباس بن عبد المطلب مع سعيد بن عثمان فتوفى بسمرقند ويقال استشهد بها فقال عبد الله بن العباس حين بلغته وفاته شتان ما بين مولده ومقبره فأقبل يصلي فقيل له ما هذا فقرأ الآية في الاستعانة بالصبر والصلاة وقد قدم قثم على سعيد بن عثمان بخراسان فعرض عليه سعيد من المغنم خمسة أسهم فقال لا ولكن أعطني سهماً لي وسهماً لفرسي."
  en: "Qutham ibn al-Abbas ibn Abd al-Muttalib died with Sa'id's army at Samarqand — some say martyred; hearing it, Ibn Abbas said 'what a distance between his birthplace and his grave' and turned to prayer, citing the verse on seeking help in patience and prayer. Earlier, offered five booty-shares by Sa'id at Khurasan, Qutham had asked only for one share for himself and one for his horse."
  es: "Qutham ibn al-Abbas ibn Abd al-Muttalib murió con el ejército de Sa'id en Samarcanda; algunos dicen que fue martirizado. Al oírlo, Ibn Abbas exclamó: «¡Qué distancia hay entre su lugar de nacimiento y su tumba!» y se dedicó a la oración, citando el versículo que habla de buscar consuelo en la paciencia y la oración. Anteriormente, Sa'id le había ofrecido cinco partes del botín en Jorasán, pero Qutham solo había pedido una para sí mismo y otra para su caballo."
  fr: "Qutham ibn al-Abbas ibn Abd al-Muttalib mourut avec l'armée de Sa'id à Samarcande – certains disent en martyr. À cette nouvelle, Ibn Abbas s'exclama: « Quelle distance entre son lieu de naissance et sa tombe ! » et se mit à prier, citant le verset sur la patience et la prière. Auparavant, à Khorasan, Sa'id lui avait offert cinq parts du butin; Qutham n'en avait demandé qu'une pour lui et une pour son cheval."
