  ar: "بطاقة أولية لحصار شماخي سنة ١٥٧٨م، أخذ العثمانيين لها من الصفويين في حرب القوقاز؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Shamakhi in 1578, the Ottoman capture of the city from the Safavids in the Caucasus war; its sources are not yet checked on the page."
