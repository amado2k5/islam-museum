  ur: "1578 میں شاماخی کے محاصرے کے لیے ڈرافٹ کارڈ، قفقاز کی جنگ میں صفویوں سے شہر پر عثمانیوں کا قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Osmanlıların Kafkas Savaşları sırasında Safevilerden ele geçirdiği, 1578 yılındaki Şamahı kuşatmasına dair ön hazırlık niteliğinde bir kart; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Sebuah kartu pendahuluan untuk pengepungan Shamakhi pada tahun 1578 M, yang direbut oleh Ottoman dari Safavid dalam Perang Kaukasus; sumbernya belum ditinjau di halaman ini."
