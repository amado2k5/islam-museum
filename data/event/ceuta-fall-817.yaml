summary:
  ar: "في سابع شعبان سنة سبع عشرة وثمانمائة دخل الفرنج مدينة سبتة من بلاد المغرب وخربوها وأخذوا ما كان بها من الأموال والذخائر حتى الكتب العلمية وتركوها قاعاً خراباً وبقيت بأيديهم؛ وكان أهلها وهم محاصرون قد أرسلوا قصيدة طنانة يستجدون فيها أهل الإسلام من أهل مصر وغيرها فلم يُغِثهم أحد ولم يجبهم إلا قصيدة من نظم ابن حجة {cite:shadharat-dhahab p. 132}."
  en: "7 Sha'ban 817 — the Franks stormed Ceuta, razed it and carried off its wealth and stores down to the scholars' books, leaving it an empty ruin that stayed in their hands; its besieged people had sent a ringing poem begging the Muslims of Egypt and beyond for rescue and were answered only with a poem by Ibn Hijja {cite:shadharat-dhahab p. 132}."
