label: { ar: "امتناع رتبيل عن أتاوة العمال", en: "Rutbil's Refusal of the Governors' Tribute", es: "La negativa de Rutbil a aceptar el tributo de los gobernadores", fr: "Le refus de Rutbil de payer le tribut des gouverneurs", ur: "رتبل کا گورنروں کے خراج سے انکار" }
summary:
  ar: "لم يعط رتبيل عمال يزيد بن عبد الملك شيئاً وقيل له ما فعل قوم كانوا يأتونا خماص البطون سود الوجوه من الصلاة نعالهم خوص قالوا انقرضوا قال أولئك أوفى منكم عهداً وأشد بأساً وإن كنتم أحسن منهم وجوهاً وقيل له ما بالك كنت تعطي الحجاج الأتاوة ولا تعطيناها فقال كان الحجاج رجلاً لا ينظر فيما أنفق إذا ظفر ببغيته ولو لم يرجع إليه درهم وأنتم لا تنفقون درهماً إلا إذا طمعتم في أن يرجع إليكم مكانه عشرة ثم لم يعط أحداً من عمال بني أمية ولا عمال ابن الزبير على سجستان من تلك الأتاوة شيئاً."
  en: "To Yazid ibn Abd al-Malik's men Rutbil paid nothing. Asked what had become of the folk who used to come 'hollow-bellied, faces blackened by prayer, sandals of palm-fibre' — 'they are gone' — 'those were your betters in covenant and might, though you have fairer faces'. And why he paid al-Hajjaj but not them: 'al-Hajjaj never looked at what he spent once he won his purpose, though not a dirham returned; you never spend a dirham unless you hope ten come back for it'. Neither Umayyad nor Zubayrid governors of Sijistan took that atawa from him."
  es: "Rutbil no pagó nada a los hombres de Yazid ibn Abd al-Malik. Al preguntarle qué había sido de la gente que solía venir «con el vientre hundido, el rostro ennegrecido por la oración y sandalias de fibra de palma», respondió: «Ya no están». «Eran superiores a vosotros en pacto y poder, aunque vosotros tengáis rostros más bellos». Y al preguntarle por qué había pagado a al-Hajjaj pero no a ellos, Rutbil respondió: «Al-Hajjaj nunca se fijó en lo que gastaba una vez que conseguía su objetivo, aunque no recuperara ni un dirham; uno nunca gasta un dirham a menos que espere que diez regresen por él». Ni los gobernadores omeyas ni los zubaíes de Sijistan aceptaron esa respuesta de él."
  fr: "Rutbil ne paya rien aux hommes de Yazid ibn Abd al-Malik. Interrogé sur le sort de ceux qui venaient autrefois « le ventre creux, le visage noirci par la prière, chaussés de sandales de fibres de palmier », il répondit: « Ils ont disparu. Ceux-là étaient vos supérieurs en alliance et en force, même si vous avez des visages plus beaux. » Quant à savoir pourquoi il avait payé al-Hajjaj mais pas eux, il expliqua: « Al-Hajjaj ne s'est jamais soucié de ses dépenses une fois son objectif atteint, et il n'a jamais récupéré un dirham. On ne dépense jamais un dirham sans espérer en récupérer un. » Ni les gouverneurs omeyyades ni les zubayrides du Sijistan n'acceptèrent cette atawa de sa part."
  ur: "یزید بن عبد الملک کے آدمیوں کو رتبیل نے کچھ نہیں دیا۔ ان سے پوچھا گیا کہ جو لوگ 'کھوکھلے پیٹ والے، نماز سے سیاہ چہرے، کھجور کے جوتے' آتے تھے - 'وہ چلے گئے' - 'وہ لوگ آپ کے عہد اور طاقت میں بہتر تھے، اگرچہ آپ کے چہرے زیادہ خوبصورت ہیں'۔ اور اس نے حجاج کو کیوں ادا کیا لیکن ان کو نہیں: 'الحجاج نے کبھی اس کی طرف نہیں دیکھا کہ اس نے اپنے مقصد کو حاصل کرنے کے بعد کیا خرچ کیا، حالانکہ ایک درہم واپس نہیں آیا۔ آپ کبھی ایک درہم بھی خرچ نہیں کرتے جب تک آپ کو امید نہ ہو کہ اس کے لیے دس واپس آئیں گے''۔ نہ امیہ اور نہ ہی سجستان کے زبیرید گورنروں نے اس سے وہ عطیہ لیا۔"
