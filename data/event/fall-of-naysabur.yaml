id: event/fall-of-naysabur
class: event
kind: conquest
label: { ar: "فتح نيسابور", en: "The Conquest of Naysabur", es: "La conquista de Naysabur", fr: "La conquête de Naysabur" }
summary:
  ar: "أتى ابن عامر أبرشهر وهي مدينة نيسابور فحصر أهلها أشهراً وكان على كل ربع منها رجل موكل به فطلب صاحب ربع من تلك الأرباع الأمان على أن يدخل المسلمين المدينة فأعطيه وأدخلهم إياها ليلاً ففتحوا الباب وتحصن مرزبانها في القهندز ومعه جماعة فطلب الأمان على أن يصالحه من جميع نيسابور على وظيفة يؤديها فصالحه على ألف ألف درهم ويقال سبعمائة ألف درهم وولى نيسابور حين فتحها قيس بن الهيثم السلمي."
  en: "Ibn Amir besieged Abarshahr — Naysabur's city — for months, each quarter under its own warden; one quarter-warden took aman to admit the Muslims by night, they opened the gate, and the marzban fortified in the qahandaz, then sought aman to compound for all Naysabur on a fixed wazifa — concluded at a million dirhams, some say seven hundred thousand. Qays ibn al-Haytham al-Sulami was made its governor at the conquest."
  es: "Ibn Amir sitió Abarshahr —la ciudad de Naysabur— durante meses, con cada barrio bajo su propio guardián. Un guardián de barrio solicitó permiso para permitir la entrada de los musulmanes por la noche, abrieron la puerta y el marzban se fortificó en el qahandaz. Luego, solicitó un acuerdo para toda Naysabur mediante un wazifa fijo, acordado en un millón de dirhams, según algunos, setecientos mil. Qays ibn al-Haytham al-Sulami fue nombrado gobernador tras la conquista."
  fr: "Ibn Amir assiégea Abarshahr, la ville de Naysabur, pendant des mois, chaque quartier étant placé sous l'autorité d'un intendant. L'un des intendants accepta un aman pour laisser entrer les musulmans de nuit; une fois la porte ouverte, le marzban se retrancha dans le qahandaz et chercha un aman pour conclure un pacte (wazifa) pour l'ensemble de Naysabur, prêché à un million de dirhams, voire sept cent mille selon certains. Qays ibn al-Haytham al-Sulami fut nommé gouverneur de la ville après la conquête."
