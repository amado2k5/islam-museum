id: event/fall-of-naysabur
class: event
kind: conquest
label: { ar: "فتح نيسابور", en: "The Conquest of Naysabur", es: "La conquista de Naysabur", fr: "La conquête de Naysabur", ur: "نیصابور کی فتح", tr: "Nişapur'un Fethi", id: "Penaklukan Nishapur" }
summary:
  ar: "أتى ابن عامر أبرشهر وهي مدينة نيسابور فحصر أهلها أشهراً وكان على كل ربع منها رجل موكل به فطلب صاحب ربع من تلك الأرباع الأمان على أن يدخل المسلمين المدينة فأعطيه وأدخلهم إياها ليلاً ففتحوا الباب وتحصن مرزبانها في القهندز ومعه جماعة فطلب الأمان على أن يصالحه من جميع نيسابور على وظيفة يؤديها فصالحه على ألف ألف درهم ويقال سبعمائة ألف درهم وولى نيسابور حين فتحها قيس بن الهيثم السلمي."
  en: "Ibn Amir besieged Abarshahr — Naysabur's city — for months, each quarter under its own warden; one quarter-warden took aman to admit the Muslims by night, they opened the gate, and the marzban fortified in the qahandaz, then sought aman to compound for all Naysabur on a fixed wazifa — concluded at a million dirhams, some say seven hundred thousand. Qays ibn al-Haytham al-Sulami was made its governor at the conquest."
  es: "Ibn Amir sitió Abarshahr —la ciudad de Naysabur— durante meses, con cada barrio bajo su propio guardián. Un guardián de barrio solicitó permiso para permitir la entrada de los musulmanes por la noche, abrieron la puerta y el marzban se fortificó en el qahandaz. Luego, solicitó un acuerdo para toda Naysabur mediante un wazifa fijo, acordado en un millón de dirhams, según algunos, setecientos mil. Qays ibn al-Haytham al-Sulami fue nombrado gobernador tras la conquista."
  fr: "Ibn Amir assiégea Abarshahr, la ville de Naysabur, pendant des mois, chaque quartier étant placé sous l'autorité d'un intendant. L'un des intendants accepta un aman pour laisser entrer les musulmans de nuit; une fois la porte ouverte, le marzban se retrancha dans le qahandaz et chercha un aman pour conclure un pacte (wazifa) pour l'ensemble de Naysabur, prêché à un million de dirhams, voire sept cent mille selon certains. Qays ibn al-Haytham al-Sulami fut nommé gouverneur de la ville après la conquête."
  ur: "ابن عامر نے ابرشہر — نیصابور کے شہر — کا کئی مہینوں تک محاصرہ کیا، ہر سہ ماہی اپنے اپنے وارڈن کے تحت؛ ایک چوتھائی وارڈن نے رات کو مسلمانوں کو داخل کرنے کے لئے امان لیا، انہوں نے دروازہ کھولا، اور مرزبان نے قہندز میں قلعہ بندی کی، پھر ایک مقررہ وظیفہ پر تمام نیصابور کے لیے امان کی تلاش کی - جس کا نتیجہ دس لاکھ درہم پر ہوا، بعض کا کہنا ہے کہ سات لاکھ۔ قیس بن الہیثم السلمی کو فتح کے وقت اس کا گورنر بنایا گیا۔"
  tr: "İbn Amir, Nişapur şehri olan Abarşahr'a geldi ve aylarca halkını kuşattı. Şehrin her mahallesinin sorumlusu bir kişiydi. Bu mahallelerden birinin sahibi, Müslümanların şehre girmesi şartıyla güvenlik istedi; böylece mahalle ona verildi ve Müslümanlar geceleyin şehre girdiler. Kapıyı açtılar ve Marzbanı, bir grup insanla birlikte Kahandaz'da kendini tahkim etti. Nişapur'un tamamıyla barış yapması ve bir görevi yerine getirmesi şartıyla güvenlik istedi. Bunun üzerine Nişapur halkı, bir milyon dirhem (ve rivayete göre yedi yüz bin dirhem) karşılığında onunla barış yaptı. Nişapur'u fethettiğinde, Kays bin Haytham el-Sulami vali olarak atandı."
  id: "Ibn Amir datang ke Abarshahr, yang merupakan kota Nishapur, dan mengepung penduduknya selama berbulan-bulan. Ada seorang pemimpin yang bertanggung jawab atas setiap wilayah kota itu. Pemilik salah satu wilayah tersebut meminta perlindungan dengan syarat kaum Muslim memasuki kota, sehingga wilayah itu diberikan kepadanya dan mereka memasuki kota pada malam hari. Mereka membuka gerbang dan Marzban (pemimpin) wilayah itu membentengi diri di Qahandaz (tempat perlindungan) dengan sekelompok orang. Ia meminta perlindungan dengan syarat ia akan berdamai dengan seluruh Nishapur dengan syarat ia akan melaksanakan suatu kewajiban. Maka ia berdamai dengannya dengan syarat satu juta dirham, dan ada juga yang mengatakan tujuh ratus ribu dirham. Ketika ia menaklukkan Nishapur, Qais bin Al-Haytham Al-Sulami diangkat menjadi gubernur."
