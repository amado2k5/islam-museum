label: { ar: "فتح نيسابور", en: "The Conquest of Naysabur" }
summary:
  ar: "أتى ابن عامر أبرشهر وهي مدينة نيسابور فحصر أهلها أشهراً وكان على كل ربع منها رجل موكل به فطلب صاحب ربع من تلك الأرباع الأمان على أن يدخل المسلمين المدينة فأعطيه وأدخلهم إياها ليلاً ففتحوا الباب وتحصن مرزبانها في القهندز ومعه جماعة فطلب الأمان على أن يصالحه من جميع نيسابور على وظيفة يؤديها فصالحه على ألف ألف درهم ويقال سبعمائة ألف درهم وولى نيسابور حين فتحها قيس بن الهيثم السلمي."
  en: "Ibn Amir besieged Abarshahr — Naysabur's city — for months, each quarter under its own warden; one quarter-warden took aman to admit the Muslims by night, they opened the gate, and the marzban fortified in the qahandaz, then sought aman to compound for all Naysabur on a fixed wazifa — concluded at a million dirhams, some say seven hundred thousand. Qays ibn al-Haytham al-Sulami was made its governor at the conquest."
