label:
  ar: "مخاطبة أبي القاسم الإمام وسجّانه شعراً، ص256-257، 290هـ"
  en: "Abu al-Qasim addresses the imam and his gaoler in verse, pp. 256-257, 290 AH"
  ur: "ابو القاسم کا امام اور اپنے محافظِ قید سے منظوم خطاب، ص256-257، 290ھ"
summary:
  ar: "مقطوعتان في الكتاب: في الأولى يخاطب أبو القاسم الإمام الهادي ويقول إنه على عهده لم يتبدل ولا يجزع من الحديد، وفي الثانية يخاطب سجانه ويقول إن القتل في الله أحلى عنده من العسل وإنه يفخر بنسبه."
  en: "Two pieces in the book: in the first Abu al-Qasim addresses al-Hadi and says he is on his covenant unchanged and does not shrink at the iron; in the second he addresses his gaoler and says that death for God is sweeter to him than honey, and he boasts of his descent."
  ur: "کتاب کے دو ٹکڑے: پہلے میں ابو القاسم امام ہادی سے مخاطب ہو کر کہتے ہیں کہ وہ اپنے عہد پر بدلے نہیں اور لوہے سے نہیں گھبراتے؛ دوسرے میں اپنے قید کرنے والے سے مخاطب ہو کر کہتے ہیں کہ اللہ کی راہ میں قتل ان کے نزدیک شہد سے میٹھا ہے اور اپنے نسب پر فخر کرتے ہیں۔"
