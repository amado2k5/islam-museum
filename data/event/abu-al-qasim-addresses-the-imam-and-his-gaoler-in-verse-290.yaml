id: event/abu-al-qasim-addresses-the-imam-and-his-gaoler-in-verse-290
class: event
kind: other
label:
  ar: "مخاطبة أبي القاسم الإمام وسجّانه شعراً، ص256-257، 290هـ"
  en: "Abu al-Qasim addresses the imam and his gaoler in verse, pp. 256-257, 290 AH"
  fr: "Abu al-Qasim s’adresse en vers à l’imam et à son geôlier, p. 256-257, 290 de l’hégire"
  ur: "ابو القاسم کا امام اور اپنے محافظِ قید سے منظوم خطاب، ص256-257، 290ھ"
  es: "Abu al-Qasim se dirige al imán y a su carcelero en verso, págs. 256-257, 290 AH"
  tr: "İmam Ebu el-Kasım'a ve onun gardiyanına şiirle hitaben, s. 256-257, 290 Hicri"
  id: "Menyampaikan pesan kepada Abu al-Qasim, sang Imam, dan sipir penjaranya dalam bentuk syair, hlm. 256-257, 290 H."
summary:
  ar: "مقطوعتان في الكتاب: في الأولى يخاطب أبو القاسم الإمام الهادي ويقول إنه على عهده لم يتبدل ولا يجزع من الحديد، وفي الثانية يخاطب سجانه ويقول إن القتل في الله أحلى عنده من العسل وإنه يفخر بنسبه."
  en: "Two pieces in the book: in the first Abu al-Qasim addresses al-Hadi and says he is on his covenant unchanged and does not shrink at the iron; in the second he addresses his gaoler and says that death for God is sweeter to him than honey, and he boasts of his descent."
  fr: "Deux pièces du livre : dans la première, Abu al-Qasim s’adresse à al-Hadi, affirme rester fidèle à son pacte sans changer et ne pas reculer devant les fers ; dans la seconde, il s’adresse à son geôlier, dit que mourir pour Dieu lui est plus doux que le miel et se glorifie de son ascendance."
  ur: "کتاب کے دو ٹکڑے: پہلے میں ابو القاسم امام ہادی سے مخاطب ہو کر کہتے ہیں کہ وہ اپنے عہد پر بدلے نہیں اور لوہے سے نہیں گھبراتے؛ دوسرے میں اپنے قید کرنے والے سے مخاطب ہو کر کہتے ہیں کہ اللہ کی راہ میں قتل ان کے نزدیک شہد سے میٹھا ہے اور اپنے نسب پر فخر کرتے ہیں۔"
  es: "El libro consta de dos partes: en la primera, Abu al-Qasim se dirige a al-Hadi y le dice que se mantiene firme en su pacto y que no se acobarda ante el hierro; en la segunda, se dirige a su carcelero y le dice que la muerte por Dios le resulta más dulce que la miel, y se jacta de su linaje."
  tr: "Kitapta iki bölüm var: Birincisinde, Ebu el-Kâsım, İmam el-Hadi'ye hitaben, sözünden dönmediğini ve demirden korkmadığını söylüyor. İkincisinde ise, gardiyanına hitaben, Allah yolunda öldürülmenin kendisi için baldan daha tatlı olduğunu ve soyundan gurur duyduğunu belirtiyor."
  id: "Terdapat dua bagian dalam buku tersebut: Pada bagian pertama, Abu al-Qasim berbicara kepada Imam al-Hadi dan mengatakan bahwa ia tidak mengubah kata-katanya dan tidak takut pada besi. Pada bagian kedua, ia berbicara kepada sipir penjara dan mengatakan bahwa terbunuh karena Allah lebih manis baginya daripada madu dan bahwa ia bangga dengan garis keturunannya."
