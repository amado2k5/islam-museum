issue: { ar: "ماذا أراد النبي بالكتاب، ولماذا لم يُكتب؟", en: "What did the Prophet intend by the writing, and why was it not made?" }
perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sallabi, through Qadi Iyad, al-Qurtubi and Ibn Taymiyya: the Prophet left the writing because of the dispute, and he had already delivered the religion (the verse of completion); the disagreement among the Companions was ijtihad, no one was rebuked, and Umar's counsel was a legitimate reading.", ar: "يعرض الكتاب عن القاضي عياض والقرطبي وابن تيمية: ترك النبي الكتابة لما وقع من النزاع، وقد بلّغ الدين؛ واختلاف الصحابة اجتهاد مسوغ لم يُعنّف عليه أحد، ورأي عمر قراءة مشروعة." }
    sources: [source/sallabi-ali-vol1]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Imami readings, as reported by the book, hold that the Prophet meant the writing as a designation of Ali and that his wish was blocked; Sallabi refutes this at length, saying it would make the Prophet neglect what God commanded.", ar: "تذهب القراءة الإمامية، كما ينقلها الكتاب، إلى أن النبي أراد بالكتاب النص على علي فمُنع منه؛ ويرد الكتاب ذلك بتفصيل، ويرى أنه يجعل النبي مقصراً في التبليغ." }
    sources: [source/sallabi-ali-vol1]
