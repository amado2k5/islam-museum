id: event/prophets-deathbed-writing-request
class: event
kind: other
label: { en: "The Prophet's request for a writing in his last illness", ar: "طلب النبي الكتاب في مرض موته" }
summary:
  en: "In his last illness the Prophet asked for a writing that would keep the community from error; those present disagreed, one said the book of God was enough, and the writing was not made. Sallabi reads the episode within the Sunni frame as a matter of ijtihad that no one was blamed for; Imami readings that take it as a designation of Ali he treats as false."
  ar: "في مرض موته طلب النبي كتاباً لا تضلون بعده، فاختلف الحاضرون، فقال بعضهم: حسبنا كتاب الله، فلم يُكتب الكتاب. يقرأ الصلابي الواقعة في إطار السنة اجتهاداً مسوغاً لم يُعنّف عليه أحد، ويرد القراءات الإمامية التي تجعلها نصاً على علي."
