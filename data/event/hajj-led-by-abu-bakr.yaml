label: { en: "The pilgrimage led by Abu Bakr", ar: "حجة أبي بكر", es: "La peregrinación dirigida por Abu Bakr", fr: "Le pèlerinage dirigé par Abou Bakr", ur: "ابوبکر کی قیادت میں حج", tr: "Ebu Bekir'in argümanı", id: "Argumen Abu Bakr" }
summary:
  en: "The Prophet sent Abu Bakr to lead the pilgrimage of the ninth year after the Hijra, the first led by the Muslims after the conquest of Mecca."
  ar: "أرسل النبي أبا بكر ليقود حج السنة التاسعة للهجرة، وهو أول حج يقيمه المسلمون بعد فتح مكة."
  es: "El Profeta envió a Abu Bakr para dirigir la peregrinación del noveno año después de la Hégira, la primera dirigida por los musulmanes tras la conquista de La Meca."
  fr: "Le Prophète envoya Abou Bakr diriger le pèlerinage de la neuvième année après l'Hégire, le premier effectué par les musulmans après la conquête de La Mecque."
  ur: "نبی نے ابوبکر کو ہجرت کے نویں سال کی قیادت کے لیے بھیجا، فتح مکہ کے بعد مسلمانوں کی پہلی قیادت۔"
  tr: "Peygamberimiz, Hicretin dokuzuncu yılındaki Hac ibadetine önderlik etmesi için Ebu Bekir'i görevlendirdi; bu, Mekke'nin fethinden sonra Müslümanlar tarafından gerçekleştirilen ilk Hac idi."
  id: "Nabi Muhammad SAW mengutus Abu Bakar untuk memimpin ibadah haji pada tahun kesembilan Hijrah, yang merupakan ibadah haji pertama yang dilakukan oleh umat Muslim setelah penaklukan Mekah."
