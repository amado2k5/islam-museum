id: event/the-sortie-to-hadda-and-safa-and-abu-al-ushayra-razes-the-fort-of-ziyad-289
class: event
kind: other
label:
  ar: "غارة حدة وسفاع وهدم أبي العشيرة قلعة زياد، سنة 289هـ"
  en: "The sortie to Hadda and Safa' and Abu al-Ushayra razes the fort of Ziyad, 289 AH"
  ur: "حدہ اور سفاع کی مہم اور ابو العشیرہ کا قلعۂ زیاد گرانا، سنہ 289ھ"
summary:
  ar: "أمر الهادي أخاه وابنه فخرجا بعسكر إلى حدة وسفاع فهجما على غرة وقاتل القوم وانهزموا، ثم قدمت مادة من الجعفري على أبي العشيرة بن الروية فنهض بهم حتى دخل قلعة زياد وقتل فيها وهدمها، وسأل الهادي أن يبعث إليه أخاه الربيع بن الروية بعسكره مع فرسان من الجعفري، فنزلوا إلى جانب غيمان."
  en: "Al-Hadi sent his brother and his son out with an army to Hadda and Safa', where they fell on the men unawares, fought them and routed them; then a reinforcement from the Ja'fari reached Abu al-Ushayra ibn al-Ruwayya, who went with them into the fort of Ziyad, killed men there and razed it, and asked al-Hadi to send his brother Rabi' ibn al-Ruwayya with the army he had and more Ja'fari horse; they settled beside Ghayman."
  ur: "ہادی نے اپنے بھائی اور بیٹے کو لشکر کے ساتھ حدہ اور سفاع بھیجا جہاں وہ بے خبری میں ان پر ٹوٹے، لڑے اور انہیں ہٹا دیا؛ پھر جعفری کی طرف سے کمک ابو العشیرہ بن الرویہ کے پاس آئی تو وہ ان کے ساتھ قلعۂ زیاد میں داخل ہوئے، وہاں آدمی مارے اور اسے گرا دیا، اور ہادی سے کہلایا کہ اپنے بھائی ربیع بن الرویہ کو اس لشکر کے ساتھ جو ان کے پاس ہے اور جعفری سواروں کے اضافے کے ساتھ بھیجیں؛ وہ غیمان کے پہلو میں اتر پڑے۔"
