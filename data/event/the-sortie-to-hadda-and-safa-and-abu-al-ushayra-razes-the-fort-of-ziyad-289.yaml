id: event/the-sortie-to-hadda-and-safa-and-abu-al-ushayra-razes-the-fort-of-ziyad-289
class: event
kind: other
label:
  ar: "غارة حدة وسفاع وهدم أبي العشيرة قلعة زياد، سنة 289هـ"
  en: "The sortie to Hadda and Safa' and Abu al-Ushayra razes the fort of Ziyad, 289 AH"
  ur: "حدہ اور سفاع کی مہم اور ابو العشیرہ کا قلعۂ زیاد گرانا، سنہ 289ھ"
  es: "La incursión a Hadda y Safa' y Abu al-Ushayra arrasan la fortaleza de Ziyad, 289 AH."
  fr: "La sortie vers Hadda, Safa' et Abu al-Ushaira rase le fort de Ziyad, en 289 AH."
  tr: "Hicri 289 yılında Hadda ve Safaa'ya yapılan baskın ve Ebu el-Eşira'nın Ziyad kalesinin yıkılması."
  id: "Penyerbuan Hadda dan Safaa serta penghancuran benteng Ziyad milik Abu al-Ashira, pada tahun 289 Hijriah."
summary:
  ar: "أمر الهادي أخاه وابنه فخرجا بعسكر إلى حدة وسفاع فهجما على غرة وقاتل القوم وانهزموا، ثم قدمت مادة من الجعفري على أبي العشيرة بن الروية فنهض بهم حتى دخل قلعة زياد وقتل فيها وهدمها، وسأل الهادي أن يبعث إليه أخاه الربيع بن الروية بعسكره مع فرسان من الجعفري، فنزلوا إلى جانب غيمان."
  en: "Al-Hadi sent his brother and his son out with an army to Hadda and Safa', where they fell on the men unawares, fought them and routed them; then a reinforcement from the Ja'fari reached Abu al-Ushayra ibn al-Ruwayya, who went with them into the fort of Ziyad, killed men there and razed it, and asked al-Hadi to send his brother Rabi' ibn al-Ruwayya with the army he had and more Ja'fari horse; they settled beside Ghayman."
  ur: "ہادی نے اپنے بھائی اور بیٹے کو لشکر کے ساتھ حدہ اور سفاع بھیجا جہاں وہ بے خبری میں ان پر ٹوٹے، لڑے اور انہیں ہٹا دیا؛ پھر جعفری کی طرف سے کمک ابو العشیرہ بن الرویہ کے پاس آئی تو وہ ان کے ساتھ قلعۂ زیاد میں داخل ہوئے، وہاں آدمی مارے اور اسے گرا دیا، اور ہادی سے کہلایا کہ اپنے بھائی ربیع بن الرویہ کو اس لشکر کے ساتھ جو ان کے پاس ہے اور جعفری سواروں کے اضافے کے ساتھ بھیجیں؛ وہ غیمان کے پہلو میں اتر پڑے۔"
  es: "Al-Hadi envió a su hermano y a su hijo con un ejército a Hadda y Safa', donde atacaron a los hombres por sorpresa, lucharon contra ellos y los derrotaron; luego, un refuerzo de los Ja'fari llegó a Abu al-Ushayra ibn al-Ruwayya, quien fue con ellos al fuerte de Ziyad, mató a hombres allí y lo arrasó, y le pidió a al-Hadi que enviara a su hermano Rabi' ibn al-Ruwayya con el ejército que tenía y más caballos Ja'fari; se establecieron junto a Ghayman."
  fr: "Al-Hadi envoya son frère et son fils avec une armée à Hadda et Safa', où ils attaquèrent les hommes par surprise, les combattirent et les mirent en déroute; puis un renfort des Ja'fari atteignit Abu al-Ushayra ibn al-Ruwayya, qui les accompagna dans le fort de Ziyad, y tua des hommes et le rasa, puis demanda à al-Hadi d'envoyer son frère Rabi' ibn al-Ruwayya avec l'armée qu'il avait et davantage de cavalerie Ja'fari; ils s'installèrent près de Ghayman."
  tr: "El-Hadi, kardeşine ve oğluna Hadda ve Safa'ya bir orduyla gitmelerini emretti. Ani bir saldırı düzenleyerek halkla savaştılar ve yenildiler. Ardından El-Caafari'den bir grup Ebu el-Aşira bin el-Raviye'nin yanına geldi ve o da onları Ziyad'ın kalesine kadar götürdü, oradaki insanları öldürdü ve kaleyi yıktı. El-Hadi, kardeşi El-Rabi' bin el-Raviye'nin ordusu ve El-Caafari'den gelen süvarileriyle birlikte kendisine gönderilmesini istedi ve onlar da Gayman tarafına indiler."
  id: "Al-Hadi memerintahkan saudara laki-laki dan putranya untuk pergi bersama pasukan ke Hadda dan Safaa. Mereka menyerang secara tiba-tiba dan memerangi penduduk, dan mereka dikalahkan. Kemudian sekelompok orang dari Al-Jaafari datang kepada Abu Al-Ashira bin Al-Rawiya, dan dia memimpin mereka sampai mereka memasuki benteng Ziyad, membunuh orang-orang di dalamnya, dan menghancurkannya. Al-Hadi meminta agar saudara laki-lakinya, Al-Rabi’ bin Al-Rawiya, dikirim kepadanya bersama pasukannya dan pasukan berkuda dari Al-Jaafari, dan mereka pergi ke sisi Ghayman."
