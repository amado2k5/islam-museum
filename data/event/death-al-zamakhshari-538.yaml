summary:
  ar: "توفي أبو القاسم الزمخشري بجرجانية خوارزم ليلة عرفة سنة ٥٣٨هـ بعد رجوعه من مكة، وعاش إحدى وسبعين سنة {cite:shadharat-dhahab p. 599-601}؛ وتذكر الموسوعة الإسلامية أنه توفي في ٩ ذي الحجة ٥٣٨هـ الموافق ١٤ حزيران ١١٤٤م ودُفن قرب المدينة، وقد بلغت مجاوراته بمكة خمس سنين وحجّ سبع حجج بشهادته، فعُرف بلقب «جار الله» وسُمّي في بلاده «فخر خوارزم» {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}."
  en: "Abu al-Qasim al-Zamakhshari died at Jurjaniyya in Khwarazm on the night of Arafa in 538, after returning from Mecca, aged seventy-one {cite:shadharat-dhahab p. 599-601}. The Encyclopaedia of Islam gives 9 Dhu al-Hijja 538, corresponding to 14 June 1144; he was buried near the town. By his own testimony he had lived at Mecca five years and made the pilgrimage seven times, earning the laqab 'Jar Allah', while at home he was known as the Glory of Khwarazm {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}."
  ur: "ابوالقاسم زمخشری 538ھ میں مکہ سے واپسی کے بعد جرجانیہ خوارزم میں یوم عرفہ کی رات فوت ہوئے؛ ان کی عمر اکہتر برس تھی {cite:shadharat-dhahab p. 599-601}۔ دائرۃ المعارف الاسلامیہ کے مطابق وفات 9 ذی الحجہ 538ھ بمطابق 14 جون 1144ء ہوئی اور انہیں شہر کے قریب دفنایا گیا۔ اپنی شہادت کے مطابق انہوں نے مکہ میں پانچ برس قیام کیا اور سات بار حج کیا، جس سے «جار اللہ» کا لقب پایا، جبکہ اپنے وطن میں «فخر خوارزم» کہلائے {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}۔"
  es: "Abu al-Qasim al-Zamakhshari murió en Jurjaniyya, en Khwarazm, la noche de Arafa del año 538, tras regresar de La Meca, a la edad de setenta y un años {cite:shadharat-dhahab p. 599-601}. La Enciclopedia del Islam indica que nació el 9 de Dhu al-Hijja del año 538, que corresponde al 14 de junio de 1144; fue enterrado cerca de la ciudad. Según su propio testimonio, vivió en La Meca cinco años y realizó la peregrinación siete veces, obteniendo el laqab 'Jar Allah', mientras que en su tierra natal era conocido como la Gloria de Khwarazm {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}."
  fr: "Abou al-Qasim al-Zamakhshari mourut à Jurjaniyya, au Khwarezm, la nuit d'Arafat en 538, après son retour de La Mecque, à l'âge de soixante et onze ans (cf.: shadharat-dhahab, p. 599-601). L'Encyclopédie de l'Islam indique le 9 Dhu al-Hijja 538, correspondant au 14 juin 1144; il fut inhumé près de la ville. Selon son propre témoignage, il avait vécu à La Mecque pendant cinq ans et accompli le pèlerinage à sept reprises, obtenant ainsi le laqab « Jar Allah », tandis qu'au Khwarezm, il était connu comme la Gloire du Khwarezm (cf.: encyclopaedia-of-islam-2, vol. 12, p. 918)."
  tr: "Ebu el-Kâsım el-Zemahşari, Mekke'den döndükten sonra Hicri 538 yılında Arafat gecesi Harezm'in Cürceniye şehrinde vefat etti. Yetmiş bir yıl yaşadı (kaynak: Şadharat-Dhaba, s. 599-601). İslam Ansiklopedisi, Hicri 538 yılının Zilhicce ayının 9. gününde (Miladi 14 Haziran 1144) vefat ettiğini ve Medine yakınlarına defnedildiğini belirtir. Mekke'de beş yıl kaldı ve kendi rivayetine göre yedi kez Hac yaptı. \"Cer Allah\" unvanıyla tanınıyordu ve ülkesinde \"Fahhr Harezm\" olarak anılırdı (kaynak: İslam Ansiklopedisi 2, cilt 12, s. 918)."
  id: "Abu al-Qasim al-Zamakhshari wafat di Jurjaniyah, Khwarazm, pada malam Arafah tahun 538 H, setelah kembali dari Mekah. Beliau hidup selama tujuh puluh satu tahun {cite:shadharat-dhahab hlm. 599-601}. Ensiklopedia Islam menyebutkan bahwa beliau wafat pada tanggal 9 Dzul Hijjah 538 H, bertepatan dengan 14 Juni 1144 M, dan dimakamkan di dekat Madinah. Masa tinggalnya di Mekah berlangsung selama lima tahun, dan beliau menunaikan ibadah haji tujuh kali, menurut kesaksiannya. Beliau dikenal dengan gelar \"Jar Allah\" dan di negaranya disebut \"Fakhr Khwarazm\" {cite:encyclopaedia-of-islam-2 vol. 12 hlm. 918}."
