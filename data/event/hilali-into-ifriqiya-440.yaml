label: { ar: "أول دخول العربان إلى إفريقية" }
summary:
  ar: "في سنة أربعين وأربعمائة أقام المعز بن باديس الدعوة بالمغرب للقائم بأمر الله العباسي وخلع طاعة المستنصر العبيدي، فبعث المستنصر جيشاً من العرب يحاربونه، فذلك أول دخول العربان إلى إفريقية، وهم بنو رياح وبنو زغبة، وتمّت لهم أمور يطول شرحها {cite:shadharat-dhahab p. 264}."
  en: "In 440 al-Mu'izz b. Badis raised the da'wa in the Maghreb for the Abbasid al-Qa'im bi-Amr Allah and cast off the obedience of the Fatimid al-Mustansir; al-Mustansir sent an army of Arabs to fight him — the first entry of the Arab tribes into Ifriqiya: Banu Riyah and Banu Zughba, whose story lengthens beyond telling {cite:shadharat-dhahab p. 264}."
