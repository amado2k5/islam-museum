id: event/hilali-into-ifriqiya-440
class: event
kind: migration
label: { ar: "أول دخول العربان إلى إفريقية", en: "The First Entry of the Arab Tribes into Ifriqiya", es: "La primera entrada de las tribus árabes en Ifriqiya", fr: "Première entrée des tribus arabes en Ifriqiya", ur: "عفریقیہ میں عرب قبائل کا پہلا داخلہ", tr: "Arapların Afrika'ya ilk girişi", id: "Kedatangan pertama bangsa Arab ke Afrika" }
summary:
  ar: "في سنة أربعين وأربعمائة أقام المعز بن باديس الدعوة بالمغرب للقائم بأمر الله العباسي وخلع طاعة المستنصر العبيدي، فبعث المستنصر جيشاً من العرب يحاربونه، فذلك أول دخول العربان إلى إفريقية، وهم بنو رياح وبنو زغبة، وتمّت لهم أمور يطول شرحها {cite:shadharat-dhahab p. 264}."
  en: "In 440 al-Mu'izz b. Badis raised the da'wa in the Maghreb for the Abbasid al-Qa'im bi-Amr Allah and cast off the obedience of the Fatimid al-Mustansir; al-Mustansir sent an army of Arabs to fight him — the first entry of the Arab tribes into Ifriqiya: Banu Riyah and Banu Zughba, whose story lengthens beyond telling {cite:shadharat-dhahab p. 264}."
  es: "En 440, al-Mu'izz b. Badis levantó la da'wa en el Magreb para el abasí al-Qa'im bi-Amr Allah y rechazó la obediencia del fatimí al-Mustansir; al-Mustansir envió un ejército de árabes para luchar contra él, la primera entrada de las tribus árabes en Ifriqiya: Banu Riyah y Banu Zughba, cuya historia se extiende más allá de ser contada {cite:shadharat-dhahab p. 264}."
  fr: "En 440, al-Mu'izz b. Badis lança la da'wa au Maghreb pour l'Abbasside al-Qa'im bi-Amr Allah et rejeta l'obéissance du Fatimide al-Mustansir; al-Mustansir envoya une armée d'Arabes pour le combattre — la première entrée des tribus arabes en Ifriqiya: Banu Riyah et Banu Zughba, dont l'histoire s'étend au-delà du récit {cite:shadharat-dhahab p. 264}."
  ur: "440 المعز ب میں۔ بادیوں نے مغرب میں عباسی القائم بن عمرو اللہ کے لیے دعوت بلند کی اور فاطمی المستنصر کی اطاعت کو ترک کر دیا۔ المستنصر نے اس سے لڑنے کے لیے عربوں کی ایک فوج بھیجی - عفریقیہ میں عرب قبائل کا پہلا داخلہ: بنو ریاح اور بنو زغبہ، جن کی کہانی بیان کرنے سے باہر ہے۔ 264}۔"
  tr: "Hicri 440 yılında, El-Mu'izz ibn Bedis, Mağrip'te El-Ka'im bi-Amr Allah el-Abbasi'ye biat ilan etti ve El-Mustansir el-Ubaidi'ye olan bağlılığını reddetti. Bunun üzerine El-Mustansir, onunla savaşmak için Araplardan oluşan bir ordu gönderdi. Bu, Arapların Afrika'ya ilk girişiydi ve bunlar Beni Riye ve Beni Züğbe kabileleriydi ve başlarına gelen olayları anlatmak çok uzun sürerdi. {Kaynak: Şadharat-Dhaba s. 264}"
  id: "Pada tahun 440 H, Al-Mu’izz ibn Badis menyerukan Al-Qa’im bi-Amr Allah Al-Abbasi di Maghreb dan melepaskan baiatnya kepada Al-Mustansir Al-Ubaidi. Maka Al-Mustansir mengirimkan pasukan Arab untuk melawannya. Itulah masuknya bangsa Arab pertama ke Afrika, dan mereka adalah Banu Riyah dan Banu Zughba, dan terjadilah berbagai peristiwa yang terlalu panjang untuk dijelaskan {cite:shadharat-dhahab p. 264}."
