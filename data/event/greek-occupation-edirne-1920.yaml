label: { ar: "الاحتلال اليوناني لأدرنة", en: "Greek occupation of Edirne", ur: "ادرنہ پر یونانی قبضہ", es: "Ocupación griega de Edirne", fr: "L'occupation grecque d'Edirne", tr: "Edirne'nin Yunan işgali", id: "Pendudukan Yunani di Edirne" }
summary:
  ar: "سقطت أدرنة تحت الاحتلال البلغاري لفترة وجيزة سنة 1913م بعد حربي البلقان، ثم احتلها اليونان بين عامي 1920 و1922م، وصارت منذ ذلك الحين مدينة حدود تركية {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}."
  en: "After the Balkan Wars Edirne fell briefly under Bulgarian occupation in 1913, then was occupied by the Greeks between 1920 and 1922, and has since been a Turkish frontier city {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}."
  ur: "بلقان جنگوں کے بعد ادرنہ 1913ء میں مختصر مدت کے لیے بلغاری قبضے میں آیا، پھر 1920ء سے 1922ء تک یونانیوں کے زیرِ قبضہ رہا، اور تب سے یہ ترکی کا سرحدی شہر ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}۔"
  es: "Después de las Guerras Balcánicas, Edirne cayó brevemente bajo ocupación búlgara en 1913, luego fue ocupada por los griegos entre 1920 y 1922, y desde entonces ha sido una ciudad fronteriza turca {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}."
  fr: "Après les guerres balkaniques, Edirne est brièvement tombée sous occupation bulgare en 1913, puis a été occupée par les Grecs entre 1920 et 1922, et est depuis lors une ville frontière turque {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}."
  tr: "Edirne, Balkan Savaşları'ndan sonra 1913'te kısa bir süre Bulgar işgali altına girdi, ardından 1920-1922 yılları arasında Yunanistan tarafından işgal edildi ve o zamandan beri bir Türk sınır kenti olmuştur. {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}"
  id: "Edirne sempat berada di bawah pendudukan Bulgaria untuk periode singkat pada tahun 1913 setelah Perang Balkan, kemudian diduduki oleh Yunani antara tahun 1920 dan 1922, dan sejak saat itu menjadi kota perbatasan Turki {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}."
