label: { ar: "حادثة بربشتر" }
summary:
  ar: "قال ابن حيان: كان تغلب العدو على بربشتر قصبة بلد برطانية وهي تقرب من سرقسطة سنة ست وخمسين وأربعمائة، وذلك أن جيش الأردمانيين نازلها وحاصرها وقصر يوسف بن سليمان بن هود في حمايتها ووكل أهلها إلى نفوسهم، فأقام العدو عليها أربعين يوماً ووقع بين أهلها تنازع في القوت لقلته، ثم دخل المدينة الأولى في خمسة آلاف مدرع فتحصن الناس بالمدينة الداخلة وجرت حروب قتل فيها خمسمائة إفرنجي، حتى اتفق أن القناة التي كان الماء يجري فيها من النهر إلى المدينة تحت الأرض في سرب موزون انهارت ووقعت فيها صخرة سدت السرب بأسره فانقطع الماء ويئس من بها من الحياة، وكانت المرأة تقف على السور تنادي من يقرب أن يعطيها جرعة ماء لنفسها أو ولدها فيقول أعطيني ما معك فتعطيه ما معها من كسوة وحلي، فلاذوا بطلب الأمان على أنفسهم خاصة دون مال وعيال فأعطاهم العدو الأمان فلما خرجوا نكث بهم وغدر وقتل منهم نيفاً وستة آلاف قتيل، ثم نودي بالبقية أن يبادر كل منهم إلى داره بأهله وله الأمان فلما حصل كل واحد بمن معه اقتسمهم الإفرنج بأمر الملك وأخذ كل واحد داراً بمن فيها، وقُدر من قتل وأسر بمائة ألف نفس وقيل خمسون ألفاً، وخص قائد خيل رومة بنحو ألف وخمسمائة جارية أبكاراً، وجرى من افتضاض الأبكار بحضرة الآباء ما لم يُشهد للمسلمين مثله قط فيما مضى من الزمان، وتخير ملك الروم من بنات المسلمين وصبيانهم ألوفاً حملها معه وترك ببربشتر ألفاً وخمسمائة فارس وألفين راجل، وختم ابن حيان الخبر بنادرة التاجر اليهودي الذي وجد قومساً من الرابطة جالساً مكان رب الدار على فراشه والمجلس والسرير كما تخلفهما ربهما يوم محتته، وجارية بنت صاحب المنزل تغنيه على نشواته ودمعها يقطر على خدها {cite:nafh-tib-maqqari p. 449-452}."
  en: "Ibn Hayyan's account of the Barbastro catastrophe of 456: the Nordmanni host besieged the town forty days, its underground water channel collapsed, the people surrendered on safe-conduct for their lives alone — then the aman was broken, over six thousand killed, fifty to a hundred thousand reckoned dead or captive, virgins apportioned house by house. He closes with the Jewish merchant's eyewitness scene of a Frankish soldier seated in a Muslim's own bed while the householder's daughter sang to him, tears on her cheeks {cite:nafh-tib-maqqari p. 449-452}."
