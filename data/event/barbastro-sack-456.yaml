summary:
  ar: "قال ابن حيان: كان تغلب العدو على بربشتر قصبة بلد برطانية وهي تقرب من سرقسطة سنة ست وخمسين وأربعمائة، وذلك أن جيش الأردمانيين نازلها وحاصرها وقصر يوسف بن سليمان بن هود في حمايتها ووكل أهلها إلى نفوسهم، فأقام العدو عليها أربعين يوماً ووقع بين أهلها تنازع في القوت لقلته، ثم دخل المدينة الأولى في خمسة آلاف مدرع فتحصن الناس بالمدينة الداخلة وجرت حروب قتل فيها خمسمائة إفرنجي، حتى اتفق أن القناة التي كان الماء يجري فيها من النهر إلى المدينة تحت الأرض في سرب موزون انهارت ووقعت فيها صخرة سدت السرب بأسره فانقطع الماء ويئس من بها من الحياة، وكانت المرأة تقف على السور تنادي من يقرب أن يعطيها جرعة ماء لنفسها أو ولدها فيقول أعطيني ما معك فتعطيه ما معها من كسوة وحلي، فلاذوا بطلب الأمان على أنفسهم خاصة دون مال وعيال فأعطاهم العدو الأمان فلما خرجوا نكث بهم وغدر وقتل منهم نيفاً وستة آلاف قتيل، ثم نودي بالبقية أن يبادر كل منهم إلى داره بأهله وله الأمان فلما حصل كل واحد بمن معه اقتسمهم الإفرنج بأمر الملك وأخذ كل واحد داراً بمن فيها، وقُدر من قتل وأسر بمائة ألف نفس وقيل خمسون ألفاً، وخص قائد خيل رومة بنحو ألف وخمسمائة جارية أبكاراً، وجرى من افتضاض الأبكار بحضرة الآباء ما لم يُشهد للمسلمين مثله قط فيما مضى من الزمان، وتخير ملك الروم من بنات المسلمين وصبيانهم ألوفاً حملها معه وترك ببربشتر ألفاً وخمسمائة فارس وألفين راجل، وختم ابن حيان الخبر بنادرة التاجر اليهودي الذي وجد قومساً من الرابطة جالساً مكان رب الدار على فراشه والمجلس والسرير كما تخلفهما ربهما يوم محتته، وجارية بنت صاحب المنزل تغنيه على نشواته ودمعها يقطر على خدها {cite:nafh-tib-maqqari p. 449-452}."
  en: "Ibn Hayyan's account of the Barbastro catastrophe of 456: the Nordmanni host besieged the town forty days, its underground water channel collapsed, the people surrendered on safe-conduct for their lives alone — then the aman was broken, over six thousand killed, fifty to a hundred thousand reckoned dead or captive, virgins apportioned house by house. He closes with the Jewish merchant's eyewitness scene of a Frankish soldier seated in a Muslim's own bed while the householder's daughter sang to him, tears on her cheeks {cite:nafh-tib-maqqari p. 449-452}."
  fr: "Le récit d'Ibn Hayyan sur la catastrophe de Barbastro en 456 : l'armée des Nordmanni assiégea la ville quarante jours, sa canalisation d'eau souterraine s'effondra, les habitants se rendirent contre une sauvegarde pour leur seule vie ; puis l'aman fut rompu, plus de six mille furent tués, cinquante à cent mille comptés morts ou captifs, les vierges réparties maison par maison. Il conclut par la scène dont un marchand juif fut témoin : un soldat franc assis dans le propre lit d'un musulman pendant que la fille du maître de maison chantait pour lui, les larmes sur les joues {cite:nafh-tib-maqqari p. 449-452}."
  es: "El relato de Ibn Hayyan sobre la catástrofe de Barbastro en 456: el ejército nórdico sitió la ciudad durante cuarenta días, su canal de agua subterráneo se derrumbó, la gente se rindió bajo fianza a cambio de sus vidas; luego se rompió el aman, murieron más de seis mil personas, se estima que entre cincuenta y cien mil murieron o fueron capturadas, y las vírgenes fueron repartidas casa por casa. Concluye con la escena presenciada por un comerciante judío de un soldado franco sentado en la cama de un musulmán mientras la hija del dueño de la casa le cantaba con lágrimas en las mejillas {cite:nafh-tib-maqqari p. 449-452}."
  ur: "456 کی بارباسٹرو تباہی کے بارے میں ابن حیان کا بیان: نورڈمنی کے میزبان نے قصبے کا چالیس دن تک محاصرہ کیا، اس کا زیر زمین پانی کا نالہ ٹوٹ گیا، لوگوں نے تنہا اپنی زندگی کے لیے محفوظ طریقے سے ہتھیار ڈال دیے - پھر امان ٹوٹ گئی، چھ ہزار سے زیادہ مارے گئے، پچاس سے ایک لاکھ مردہ قرار دیے گئے، گھروں میں قیدی بنائے گئے۔ وہ یہودی تاجر کے عینی شاہد کے منظر کے ساتھ بند ہوتا ہے جس میں ایک فرانسیسی فوجی ایک مسلمان کے اپنے بستر پر بیٹھا ہوا تھا جب کہ گھر والے کی بیٹی اسے گا رہی تھی، اس کے گالوں پر آنسو تھے۔ 449-452}۔"
  tr: "İbn Hayyan şöyle dedi: Düşman, Hicri 456 yılında (Miladi 1067/1068) Zaragoza yakınlarındaki Bretonya bölgesinin başkenti Barbastro'yu fethetti. Ardmaniler ordusu şehri kuşattı ve Yusuf ibn Süleyman ibn Hud şehri savunmakta başarısız oldu, böylece halkı kendi başlarının çaresine bakmak zorunda kaldı. Düşman kırk gün boyunca orada kaldı ve bu süre zarfında halk, yiyecek kıtlığı nedeniyle yiyecek konusunda kavga etti. Sonra düşman, beş bin zırhlı adamla şehre girdi. Halk iç şehirde kendilerini tahkim etti ve beş yüz Frank'ın öldürüldüğü çatışmalar yaşandı. Sonra, nehirden şehre su taşıyan yeraltı kanalı çöktü ve içine bir kaya düşerek tüm geçidi tıkadı. Su kaynağı kesildi ve içeridekiler hayatta kalma umudunu yitirdi. Kadınlar surda durarak yakındakilere seslenip kendileri veya çocukları için bir yudum su istediler. Yabancı, \"Ne varsa verin,\" diye cevap verirdi ve onlar da sahip oldukları tüm giysileri ve mücevherleri ona verirlerdi. Sığınma talebinde bulunarak, mallarına ve ailelerine dokunulmadan, yalnızca kendileri için güvenli geçiş istediler. Düşman onlara güvenli geçiş sağladı, ancak ayrıldıklarında düşman sözünü tutmadı ve altı binden fazlasını öldürdü. Ardından, kalan sakinlerin kaçışlarını hızlandırmaları için çağrı yapıldı. Her biri ailesiyle birlikte evine gitti ve güvenliğe kavuştu. Herkes arkadaşlarıyla birlikte vardığında, Franklar kralın emriyle onları böldüler ve her biri sakinleriyle birlikte bir ev aldı. Yüz bin kişinin öldürüldüğü ve esir alındığı tahmin ediliyor, elli bin kişi olduğu söyleniyor. Roma süvari komutanına yaklaşık bin beş yüz bakire kız verildi ve babaların huzurunda bakirelerin bekaretlerinin bozulması gerçekleşti; bu, geçmişte Müslümanlar arasında hiç görülmemiş bir şeydi. Roma kralı binlerce Müslüman kız ve oğlanı seçti ve onları yanına aldı, Barbastro'da bin beş yüz süvari ve iki bin piyade bıraktı. İbn Hayyan, anlatıyı, bir Yahudi tüccarın, evin sahibinin yatağında onun yerine loncadan bir kâhyanın oturduğunu, koltuğun ve yatağın efendisinin ölüm gününde bıraktığı gibi durduğunu ve evin sahibinin kızı olan bir cariyenin, onun zevkleri sırasında ona şarkılar söylediğini ve yanaklarından gözyaşlarının süzüldüğünü anlatan bir anekdotla sonlandırdı. {cite:nafh-tib-maqqari s. 449-452}"
  id: "Ibn Hayyan berkata: Musuh menaklukkan Barbastro, ibu kota wilayah Brittany dekat Zaragoza, pada tahun 456 H (1067/1068 M). Pasukan Ardmanis mengepungnya, dan Yusuf ibn Sulayman ibn Hud gagal mempertahankannya, sehingga penduduknya dibiarkan berjuang sendiri. Musuh bertahan selama empat puluh hari, di mana penduduk bertengkar memperebutkan makanan karena kelangkaannya. Kemudian, musuh memasuki kota dengan lima ribu orang bersenjata. Penduduk membentengi diri di dalam kota, dan pertempuran pun terjadi di mana lima ratus orang Frank tewas. Kemudian, terjadilah bahwa kanal bawah tanah tempat air mengalir dari sungai ke kota runtuh, dan sebuah batu jatuh ke dalamnya, menghalangi seluruh jalur. Pasokan air terputus, dan mereka yang berada di dalam kota putus asa untuk bertahan hidup. Para wanita berdiri di tembok memanggil siapa pun yang ada di dekatnya, meminta seteguk air untuk diri mereka sendiri atau anak-anak mereka. Orang asing itu akan menjawab, \"Berikan apa yang kalian miliki,\" dan mereka akan memberikan pakaian dan perhiasan apa pun yang mereka miliki. Mereka mencari perlindungan, meminta jalan aman hanya untuk mereka sendiri, meninggalkan harta benda dan keluarga mereka tanpa disentuh. Musuh memberi mereka jalan aman, tetapi ketika mereka pergi, musuh mengingkari janji mereka dan membunuh lebih dari enam ribu dari mereka. Kemudian, seruan dibuat agar penduduk yang tersisa segera melarikan diri. Masing-masing dari mereka pergi ke rumahnya bersama keluarganya dan selamat. Ketika masing-masing telah tiba dengan teman-temannya, orang-orang Frank membagi mereka atas perintah raja dan masing-masing mengambil sebuah rumah beserta penghuninya. Diperkirakan seratus ribu orang terbunuh dan ditangkap, dan dikatakan lima puluh ribu. Komandan kavaleri Romawi diberi sekitar seribu lima ratus gadis perawan, dan penodaan perawan di hadapan para ayah terjadi, yang belum pernah disaksikan di antara umat Muslim sebelumnya. Raja Romawi memilih ribuan gadis dan anak laki-laki Muslim dan membawa mereka bersamanya dan meninggalkan seribu lima ratus penunggang kuda dan dua ribu tentara infanteri di Barbastro. Ibn Hayyan mengakhiri kisahnya dengan anekdot tentang seorang pedagang Yahudi yang mendapati seorang pengurus dari perkumpulan duduk di tempat tidur tuan rumah, dan tempat duduk serta tempat tidur itu masih seperti yang ditinggalkan tuannya pada hari kematiannya, dan seorang budak perempuan, putri pemilik rumah, sedang bernyanyi untuknya saat ia sedang bersenang-senang, dan air matanya menetes di pipinya. {cite:nafh-tib-maqqari p. 449-452}."
