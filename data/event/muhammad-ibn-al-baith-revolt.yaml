id: event/muhammad-ibn-al-baith-revolt
class: event
kind: revolt
label: { ar: "خروج محمد بن البعيث", en: "Muhammad ibn al-Ba'ith's Revolt", es: "La revuelta de Muhammad ibn al-Ba'ith", fr: "La révolte de Muhammad ibn al-Ba'ith", ur: "محمد بن البیث کی بغاوت" }
summary:
  ar: "مرند قرية صغيرة نزلها حلبس أبو البعيث ثم حصنها البعيث ثم ابنه محمد بن البعيث وبنى بها قصوراً وكان محمد قد خالف في خلافة المتوكل فحاربه بنا الصغير مولى أمير المؤمنين حتى ظفر به وحمله إلى سر من رأى وهدم حائط مرند وذلك القصر والبعيث من ولد عتيب بن عمرو بن وهب بن أفصى بن دعمي بن جديلة بن أسد بن ربيعة ويقال عتيب بن عوف بن سنان."
  en: "Marand was a small village settled by Halbas Abu al-Ba'ith, fortified by al-Ba'ith then his son Muhammad ibn al-Ba'ith who built palaces there; Muhammad broke away in al-Mutawakkil's caliphate, and Buna al-Saghir the caliph's mawla fought him till he took him, carried him to Samarra, and razed Marand's wall and that palace — the Ba'ithids descending from Utayb ibn Amr of Asad ibn Rabi'a, or Utayb ibn Awf ibn Sinan as the Utaybis tell it."
  es: "Marand era una pequeña aldea fundada por Halbas Abu al-Ba'ith, fortificada por al-Ba'ith y luego por su hijo Muhammad ibn al-Ba'ith, quien construyó palacios allí; Muhammad se separó del califato de al-Mutawakkil, y Buna al-Saghir, el mawla del califa, luchó contra él hasta que lo capturó, lo llevó a Samarra y arrasó la muralla de Marand y ese palacio; los baítas descendían de Utayb ibn Amr de Asad ibn Rabi'a, o Utayb ibn Awf ibn Sinan, como lo cuentan los utaítas."
  fr: "Marand était un petit village fondé par Halbas Abu al-Ba'ith, fortifié par al-Ba'ith puis par son fils Muhammad ibn al-Ba'ith qui y construisit des palais; Muhammad fit sécession lors du califat d'al-Mutawakkil, et Buna al-Saghir, le mawla du calife, le combattit jusqu'à ce qu'il le capture, l'emmena à Samarra et rasa les remparts de Marand ainsi que le palais — les Ba'ithides descendant d'Utayb ibn Amr d'Asad ibn Rabi'a, ou d'Utayb ibn Awf ibn Sinan, comme le racontent les Utaybis."
  ur: "مرند ایک چھوٹا سا گاؤں تھا جسے حلباس ابو البیث نے آباد کیا تھا، جسے البیت نے قلعہ بند کیا تھا پھر اس کے بیٹے محمد بن البیث نے وہاں محلات بنائے تھے۔ محمد متوکل کی خلافت میں ٹوٹ گیا، اور خلیفہ کے مولا بونا الصغیر نے اس سے لڑا یہاں تک کہ وہ اسے لے گیا، اسے سامرا لے گیا، اور مرند کی دیوار اور اس محل کو مسمار کر دیا - اسد ابن ربیعان عطیب بن عمرو کی طرف سے آنے والے بعثت، Utaybis اسے بتائیں."
