id: event/al-hadi-at-tartar-returns-what-the-hakami-had-taken-from-the-people-292
class: event
kind: other
label:
  ar: "نزول الهادي بطرطر وردّه على أهل القرية ما أخذه الحكمي منهم، ص296"
  en: "Al-Hadi at Tartar returns to the villagers what the Hakami had taken, p. 296"
  ur: "ہادی کا طرطر میں اترنا اور حکمی کی لی ہوئی چیزیں بستی والوں کو لوٹانا، ص296"
summary:
  ar: "ينزل الهادي بطرطر فيلقاه رسل الحكمي بغنم وبقر وطعام وأعلاف أمر بها نزلاً له، وكان الحكمي قد أخذ من أهل البلد، فيرسل الهادي إلى أهل القرية ويردّ عليهم ما أُخذ لهم ويقول إن هذا الأمر لا يحل لهم أخذه، ويصرف رسل الحكمي إليه فيخبرونه، فيعجب هو وأهل البلد ويرغبون في قربه."
  en: "Al-Hadi halts at Tartar and the Hakami's envoys meet him with sheep, cattle, food and fodder that the Hakami had ordered as hospitality for him; the Hakami had taken from the people of the land, so al-Hadi sends to the villagers and gives back what was taken, saying it is not lawful for them to take it, and sends the envoys back to the Hakami, who marvels with the people, and they come to desire his nearness."
  ur: "ہادی طرطر میں اترتے ہیں تو حکمی کے قاصد بھیڑ بکریاں، گائیں، کھانا اور چارہ لے کر ملتے ہیں جو حکمی نے ان کی مہمانی کے لیے مقرر کیا تھا؛ حکمی نے علاقے والوں سے کچھ لیا ہوا تھا، سو ہادی بستی والوں کو پیغام بھیج کر ان کا لیا ہوا مال لوٹاتے ہیں اور کہتے ہیں کہ ان کے لیے اسے لینا جائز نہیں، اور قاصدوں کو حکمی کے پاس واپس بھیجتے ہیں جو اسے بتاتے ہیں، تو وہ اور علاقے والے حیران ہوتے ہیں اور ان کے قرب کی رغبت کرتے ہیں۔"
