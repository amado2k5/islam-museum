id: event/shaytan-insinuates-at-one-or-two
class: event
kind: other
label:
  ar: الشيطان يهم بالواحد والاثنين
  en: The shaytan intends one or two, not three
  ur: شیطان ایک یا دو پر ارادہ کرتا ہے، تین پر نہیں
summary:
  ar: 'عن سعيد بن المسيب أنه كان يقول قال رسول الله: الشيطان يهم بالواحد والاثنين فإذا كانوا ثلاثة لم يهم بهم {cite:muwatta-maruf-1997} [[passage/muwatta-31-2802|الموطأ 2802]].'
  en: 'Sa id ibn al-Musayyib used to say: the Messenger of God said: the shaytan intends one or two; when they are three he does not intend them {cite:muwatta-maruf-1997} [[passage/muwatta-31-2802|Muwatta
    2802]].'
  ur: 'سعید بن مسیب کہتے تھے: رسول اللہ نے کہا: شیطان ایک یا دو پر ارادہ کرتا ہے، لیکن جب وہ تین ہوں تو اس کا ارادہ نہیں ہوتا {cite:muwatta-maruf-1997} [[passage/muwatta-31-2802|موطأ 2802]]۔'
