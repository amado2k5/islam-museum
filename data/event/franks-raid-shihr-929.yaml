summary:
  ar: "في سنة تسع وعشرين وتسعمائة دخل الإفرنج الشحر وقتلوا وأسروا ونهبوا، واستُشهد في تلك الوقعة العلامة شهاب الدين أحمد بن عبد الله بالحاج الشافعي بعد فجر يوم الجمعة عاشر ربيع الثاني {cite:shadharat-dhahab p. 562}."
  en: "In 929 the Franks entered al-Shihr on the Hadramawt coast killing, taking captives and looting; the jurist Shihab al-Din Ibn Balhaj al-Shafi'i was martyred in the assault after dawn Friday 10 Rabi' II {cite:shadharat-dhahab p. 562}."
  es: "En 929, los francos entraron en al-Shihr, en la costa de Hadramawt, matando, tomando prisioneros y saqueando; el jurista Shihab al-Din Ibn Balhaj al-Shafi'i fue martirizado en el asalto después del amanecer del viernes 10 de Rabi' II {cita: shadharat-dhahab p. 562}."
  fr: "En 929, les Francs entrèrent à al-Shihr sur la côte d'Hadramawt, tuant, prenant des captifs et pillant; le juriste Shihab al-Din Ibn Balhaj al-Shafi'i fut martyrisé lors de l'assaut après l'aube du vendredi 10 Rabi' II {cite:shadharat-dhahab p. 562}."
