id: event/ridda-wars
class: event
kind: war
label: { ar: "حروب الردة", en: "The Ridda Wars", es: "Las guerras de Ridda", fr: "Les guerres de Ridda" }
summary:
  ar: "عند البلاذري: لما استخلف أبو بكر ارتدت طوائف من العرب ومنعت الصدقة وقال قوم «نقيم الصلاة ولا نؤدي الزكاة»، فقال أبو بكر «لو منعوني عقالاً لقاتلتهم» ويقال «عناقاً» — والعقال صدقة السنة؛ وروى مسلم الحوار نفسه في حديث الزهري عن أبي هريرة: سؤال عمر «كيف تقاتل الناس» وجواب أبي بكر وإقرار عمر به {cite:sahih-muslim 20}؛ وقال عبد الله بن مسعود إن المسلمين قاموا بعد النبي مقاماً كادوا يهلكون فيه لولا منّة الله بأبي بكر: اجتمع رأيهم على أن لا يقاتلوا على بنت مخاض وابن لبون «وأن نأكل قرى عربية ونعبد الله حتى يأتينا اليقين» فعزم الله له على قتالهم، ولم يرضَ منهم إلا بالخطة المخزية أو الحرب المجلية — الخطة المخزية أن يقرّوا بأن قتلاهم في النار وأن ما أخذوا من الأموال مردود، والحرب المجلية أن يخرجوا من ديارهم؛ وفي رواية طارق بن شهاب خيّرهم بين الحرب المجلية والسلم المخزية: نزع الحلقة والكراع، وردّ ما أصيب من المسلمين، وأداء ديات القتلى، وقتلاهم في النار؛ وقالت عائشة «توفي رسول الله فنزل بأبي ما لو نزل بالجبال الراسيات لهاضها: أشرأب النفاق بالمدينة وارتدت العرب»؛ وخرج أبو بكر إلى القَصّة يوجّه الزحوف إلى أهل الردة فصدهم خارجة بن حصن ومنظور بن زبان الفزاريان فانهزموا وتبعهم طلحة بن عبيد الله إلى أسفل ثنايا عوسجة، ثم عقد لخالد بن الوليد على الناس ولثابت بن قيس على الأنصار وبدأ بطليحة بن خويلد ببزاخة ثم تبعتها وقائع اليمامة والبحرين وعمان واليمن وحضرموت ومكة وتهامة والعراق. ويروي الصلابي أن استشهاد كثير من حفظة القرآن يوم اليمامة حمل عمر بن الخطاب على أبي بكر أن يجمع القرآن خشية أن يذهب كثير منه مع القتلى في المواطن كلها، فكلّف زيد بن ثابت بجمعه من الرقاع والعظام والسعف وصدر الرجال حتى وُجدت خاتمة سورة براءة مع أبي خزيمة الأنصاري لم توجد عند غيره {cite:sallabi-abu-bakr-tawzi-2003 p. 283-284} وفي مقالة دائرة المعارف الإسلامية: حروب الردة سلسلة معارك ضد قبائل بدوية وحضرية بدأت قبيل وفاة النبي واستمرت طوال خلافة أبي بكر، وتروي المصادر السنية أن طوائف من العرب منعت الصدقة فعزم أبو بكر على قتالها ووجّه الجيوش بقيادة خالد بن الوليد. وتذكر مقالة دائرة المعارف الإسلامية أن التسمية غير دقيقة في حالات كثيرة، وأن بعض القبائل قادها مدّعو نبوة كمسيلمة وطليحة وسجاح والأسود العنسي وذي التاج لقيط، وأن الردة مهّدت للفتوح وغيّرت علاقة المركز بالقبائل."
  en: "In al-Baladhuri: when Abu Bakr succeeded, groups of the Arabs apostatized and withheld the alms, some saying 'we keep the prayer but will not pay the zakat', whereupon Abu Bakr said 'if they withheld from me a hobbling-cord — some say a she-goat kid — I would fight them', the 'iqal being a year's alms; Abdullah ibn Masud said the Muslims had stood after the Prophet at a station where they nearly perished had God not graced them with Abu Bakr: they had all agreed not to fight over a young she-camel or a weaned camel 'and to eat the Arab villages' yield and worship God until certainty came to us', but God resolved him to fight, and he accepted from them only the humiliating condition or the annihilating war — the first that they confess their slain are in the Fire and return what they took of Muslim property, the second that they leave their homes; in Tariq ibn Shihab's report he offered the Buzakha delegation the choice of the annihilating war or the humiliating peace: surrender of armour and mounts, return of what was taken, blood-money for the slain Muslims, their own slain in the Fire; Aisha said 'when the Prophet died there befell my father what would have crushed the firm mountains — hypocrisy reared its head in Medina and the Arabs apostatized'; Abu Bakr went out to al-Qassa directing the columns against the apostates, was attacked by Kharija ibn Hisn and Manzur ibn Zabban the Fazaris who were routed with Talha ibn Ubaydillah pursuing them to lower Thaniyyat Awsaja, then appointed Khalid ibn al-Walid over the army and Thabit ibn Qays over the Ansar, beginning with Tulayha ibn Khuwaylid at Buzakha, followed by the affairs of Yamama, Bahrain, Oman, Yemen, Hadramawt, Mecca, Tihama and Iraq. Al-Sallabi relates that the slaughter of many Qur'an memorizers at Yamama moved Umar ibn al-Khattab to press Abu Bakr to compile the Qur'an, fearing much of it would perish with the slain in every battlefield; Zayd ibn Thabit was charged with gathering it from leather, bones, palm fronds and men's breasts, until the closing passage of Surat al-Tawba was found only with Abu Khuzayma al-Ansari {cite:sallabi-abu-bakr-tawzi-2003 p. 283-284}. In the Encyclopaedia of Islam article: The Ridda Wars were a series of battles against nomadic and settled tribes that began shortly before the Prophet's death and ran through Abu Bakr's caliphate. The early Sunni sources report that groups of Arabs withheld the alms, and that Abu Bakr resolved to fight them and sent out armies under Khalid ibn al-Walid. The Encyclopaedia of Islam article judges the name inexact in many cases, notes tribes led by claimants to prophethood such as Musaylima, Tulayha, Sajah, al-Aswad al-Ansi and Dhu al-Taj Lakit, and sees the wars as a prelude to the conquests that changed the centre's relation to the tribes."
  ur: "ردہ کی جنگیں خانہ بدوش اور بستیوں میں بسنے والے قبائل کے خلاف لڑائیوں کا ایک سلسلہ تھیں جو نبی کی وفات سے ذرا پہلے شروع ہوا اور ابوبکر کی خلافت میں جاری رہا۔ ابتدائی سنی مآخذ بتاتے ہیں کہ عرب کے کچھ گروہوں نے زکوٰۃ روک لی تو ابوبکر نے ان سے لڑنے کا فیصلہ کیا اور خالد بن ولید کی قیادت میں لشکر بھیجے۔ دائرۃ المعارف اسلامیہ کا مضمون کہتا ہے کہ بہت سی صورتوں میں یہ نام درست نہیں، کئی قبائل کی قیادت مسیلمہ، طلیحہ، سجاح، اسود عنسی اور ذو التاج لقیط جیسے مدعیان نبوت کے پاس تھی، اور ردہ فتوحات کا پیش خیمہ بنی اور مرکز و قبائل کا تعلق بدل گیا۔"
  es: "En al-Baladhuri: cuando Abu Bakr tuvo éxito, grupos de árabes apostataron y retuvieron la limosna, algunos diciendo 'mantenemos la oración pero no pagaremos el zakat', a lo que Abu Bakr dijo 'si me retuvieran una cuerda para atar, algunos dicen una cabrita, lucharía contra ellos', siendo el 'iqal la limosna de un año; Abdullah ibn Masud dijo que los musulmanes habían permanecido después del Profeta en una estación donde casi perecieron si Dios no los hubiera bendecido con Abu Bakr: todos habían acordado no luchar por una camella joven o un camello destetado 'y comer la cosecha de las aldeas árabes y adorar a Dios hasta que nos llegara la certeza', pero Dios resolvió que luchara, y él aceptó de ellos solo la condición humillante o la guerra aniquiladora: la primera, que confesaran que sus muertos están en el Fuego y devolvieran lo que tomaron de la propiedad musulmana, la segunda, que abandonaran sus hogares; En el informe de Tariq ibn Shihab, ofreció a la delegación de Buzakha la opción de una guerra aniquiladora o una paz humillante: la rendición de las armaduras y las monturas, la devolución de lo tomado, una compensación por los musulmanes asesinados, sus propios muertos en el Fuego; Aisha dijo: «Cuando murió el Profeta, le sobrevino a mi padre lo que habría aplastado las montañas más firmes: la hipocresía alzó su cabeza en Medina y los árabes apostataron». Abu Bakr salió a al-Qassa dirigiendo las columnas contra los apóstatas, fue atacado por Kharija ibn Hisn y Manzur ibn Zabban los Fazaris, quienes fueron derrotados, con Talha ibn Ubaydillah persiguiéndolos hasta bajar Thaniyyat Awsaja, luego nombró a Khalid ibn al-Walid sobre el ejército y a Thabit ibn Qays sobre los Ansar, comenzando con Tulayha ibn Khuwaylid en Buzakha, seguido por los asuntos de Yamama, Bahrain, Omán, Yemen, Hadramawt, La Meca, Tihama e Irak. Al-Sallabi relata que la matanza de muchos memorizadores del Corán en Yamama impulsó a Umar ibn al-Khattab a presionar a Abu Bakr para que compilara el Corán, temiendo que gran parte de él pereciera con los muertos en cada campo de batalla; Zayd ibn Thabit fue encargado de recolectarlo del cuero, los huesos, las hojas de palma y los pechos de los hombres, hasta que el pasaje final de la Sura al-Tawba se encontró solo con Abu Khuzayma al-Ansari {cite:sallabi-abu-bakr-tawzi-2003 p. 283-284}. En el artículo de la Enciclopedia del Islam: Las Guerras de Ridda fueron una serie de batallas contra tribus nómadas y sedentarias que comenzaron poco antes de la muerte del Profeta y se extendieron por el califato de Abu Bakr. Las primeras fuentes sunitas informan que grupos de árabes retuvieron las limosnas, y que Abu Bakr decidió luchar contra ellos y envió ejércitos bajo el mando de Khalid ibn al-Walid. El artículo de la Enciclopedia del Islam considera que el nombre es inexacto en muchos casos, menciona tribus lideradas por personas que se proclamaban profetas, como Musaylima, Tulayha, Sajah, al-Aswad al-Ansi y Dhu al-Taj Lakit, y ve las guerras como un preludio de las conquistas que cambiaron la relación del centro con las tribus."
  fr: "Dans al-Baladhuri: lorsque Abou Bakr réussit, des groupes d'Arabes apostasièrent et refusèrent de verser l'aumône, certains disant: « Nous accomplissons la prière mais ne payons pas la zakat ». Abou Bakr répondit alors: « S'ils me refusaient une cordelette – certains disent un chevreau – je les combattrais », l'iqal étant l'aumône annuelle. Abdullah ibn Masud rapporte que les musulmans, après le Prophète, se trouvaient au bord du gouffre et faillirent périr si Dieu ne leur avait pas accordé la grâce d'Abou Bakr. Ils avaient tous convenu de ne pas se battre pour une jeune chamelle ou un chameau sevré, « de manger les récoltes des villages arabes et d'adorer Dieu jusqu'à ce que la certitude nous parvienne », mais Dieu décida de le faire combattre et n'accepta d'eux que l'humiliation ou la guerre d'anéantissement: la première, qu'ils confessent que leurs morts sont en Enfer et restituent ce qu'ils ont pris aux biens musulmans; la seconde, qu'ils quittent leurs foyers. Dans son rapport, Tariq ibn Shihab offrit à la délégation de Buzakha le choix entre la guerre d'anéantissement et la paix humiliante: la reddition des armures et des montures, la restitution de ce qui avait été pris, le prix du sang pour les musulmans tués, leurs propres compatriotes tués dans le Feu; Aïcha dit: « Lorsque le Prophète mourut, il arriva à mon père ce qui aurait écrasé les montagnes les plus fermes: l'hypocrisie se manifesta à Médine et les Arabes apostasièrent. » Abou Bakr se rendit à al-Qassa, dirigeant les colonnes contre les apostats. Il fut attaqué par Kharija ibn Hisn et Manzur ibn Zabban, les Fazaris, qui furent mis en déroute. Talha ibn Ubaydillah les poursuivit jusqu'à Thaniyyat Awsaja. Il nomma ensuite Khalid ibn al-Walid à la tête de l'armée et Thabit ibn Qays à la tête des Ansar. Il commença par Tulayha ibn Khuwaylid à Buzakha, puis s'occupa des affaires de Yamama, Bahreïn, Oman, le Yémen, le Hadramaout, La Mecque, Tihama et l'Irak. Al-Sallabi rapporte que le massacre de nombreux mémorisateurs du Coran à Yamama incita Umar ibn al-Khattab à presser Abou Bakr de compiler le Coran, craignant qu'une grande partie ne soit perdue avec les morts sur les champs de bataille. Zayd ibn Thabit fut chargé de collecter l'aumône sur du cuir, des os, des palmes et des poitrines d'hommes, jusqu'à ce que le passage final de la sourate At-Tawba ne soit retrouvé qu'avec Abu Khuzayma al-Ansari (voir: Sallabi Abu Bakr Atawzi, 2003, p. 283-284). Dans l'article de l'Encyclopédie de l'Islam: Les guerres de Ridda furent une série de batailles contre des tribus nomades et sédentaires qui commencèrent peu avant la mort du Prophète et se poursuivirent durant le califat d'Abu Bakr. Les premières sources sunnites rapportent que des groupes d'Arabes refusèrent de verser l'aumône et qu'Abu Bakr résolut de les combattre et envoya des armées sous le commandement de Khalid ibn al-Walid. L'article de l'Encyclopédie de l'Islam juge le nom inexact dans de nombreux cas, note les tribus dirigées par des prétendants à la prophétie tels que Musaylima, Tulayha, Sajah, al-Aswad al-Ansi et Dhu al-Taj Lakit, et considère les guerres comme un prélude aux conquêtes qui ont changé la relation du centre avec les tribus."
