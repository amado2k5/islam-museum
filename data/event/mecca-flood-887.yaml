label: { ar: "سيل مكة الهائل سنة 887هـ", en: "The Great Flood of Mecca in 887 AH", es: "El gran diluvio de La Meca en el año 887 de la Hégira.", fr: "Le grand déluge de La Mecque en 887 AH", ur: "887 ہجری میں مکہ کا عظیم سیلاب" }
summary:
  ar: "في أثناء ذي القعدة سنة سبع وثمانين وثمان مئة كان بمكة السيل الهائل الذي لم يسمع بمثله خرب نحو ربع بيوت مكة وجاز في المسجد الحرام حلق باب الكعبة ومات من الخلق من لا يحصيهم إلا الله تعالى {cite:shadharat-dhahab p. 346}."
  en: "In mid-Dhu'l-Qa'da 887 came the tremendous flood of Mecca, the like unheard of: nearly a quarter of Mecca's houses ruined, the water passing the Kaaba's door inside the Sacred Mosque, and of God's creatures unnumbered dead {cite:shadharat-dhahab p. 346}."
  es: "A mediados de Dhu'l-Qa'da 887 sobrevino la tremenda inundación de La Meca, como nunca antes se había oído: casi una cuarta parte de las casas de La Meca quedaron destruidas, el agua pasó por la puerta de la Kaaba dentro de la Mezquita Sagrada, y de las criaturas de Dios murieron innumerables {cite:shadharat-dhahab p. 346}."
  fr: "Au milieu du mois de Dhu'l-Qa'da 887 survint la terrible inondation de La Mecque, sans précédent: près d'un quart des maisons de La Mecque furent détruites, l'eau passa la porte de la Kaaba à l'intérieur de la Mosquée sacrée, et d'innombrables créatures de Dieu périrent {cite: shadharat-dhahab p. 346}."
  ur: "ذوالقعدہ 887 کے وسط میں مکہ کا زبردست سیلاب آیا، جیسا کہ سنا نہیں تھا: مکہ کے تقریباً ایک چوتھائی مکانات اجڑ گئے، کعبہ کے دروازے سے پانی مسجد حرام کے اندر سے گزرا، اور خدا کی مخلوقات بے شمار مردہ ہو گئیں۔ 346}۔"
