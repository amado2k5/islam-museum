label: { ar: "إحراق المسجد الأقصى (1969)", en: "Arson at al-Aqsa Mosque (1969)", fr: "Incendie criminel de la mosquée al-Aqsa, 1969", es: "Incendio provocado en la mezquita de Al-Aqsa (1969)", ur: "مسجد اقصیٰ میں آتشزدگی (1969)", tr: "Mescid-i Aksa'nın yakılması (1969)", id: "Pembakaran Masjid Al-Aqsa (1969)" }
summary:
  ar: "حريق شب في المسجد الأقصى صباح الخميس 21 أغسطس 1969م فأتى على المكتبة والجانب الشرقي منه، ويعدّه الكتاب جريمة نسبها إلى إسرائيل. عقد مجمع البحوث الإسلامية جلسة طارئة في 23 أغسطس 1969م وأصدر بياناً وقرارات تدعو إلى تحرك إسلامي وإلى مطالبة الأمم المتحدة بتنفيذ قراراتها في القدس {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
  en: "A fire at the al-Aqsa Mosque on the morning of Thursday 21 August 1969 destroyed its library and the eastern side, which the book attributes to Israeli forces. The Academy of Islamic Research met in emergency session on 23 August 1969 and issued a statement and resolutions calling for Islamic action and for the United Nations to enforce its resolutions on Jerusalem {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
  fr: "Un incendie à la mosquée al-Aqsa, le jeudi 21 août 1969 au matin, détruisit sa bibliothèque et son côté oriental ; le livre l’attribue aux forces israéliennes. L’Académie de recherches islamiques se réunit en urgence le 23 août 1969 et publia une déclaration et des résolutions appelant à une action islamique et à l’application par les Nations unies de leurs résolutions sur Jérusalem {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
  es: "Un incendio en la mezquita de Al-Aqsa la mañana del jueves 21 de agosto de 1969 destruyó su biblioteca y el lado este, un hecho que el libro atribuye a las fuerzas israelíes. La Academia de Investigación Islámica se reunió en sesión de emergencia el 23 de agosto de 1969 y emitió una declaración y resoluciones que pedían acciones islámicas y que las Naciones Unidas hicieran cumplir sus resoluciones sobre Jerusalén {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
  ur: "جمعرات 21 اگست 1969 کی صبح مسجد اقصیٰ میں لگنے والی آگ نے اس کی لائبریری اور مشرقی جانب کو تباہ کر دیا، جس کا انتساب کتاب اسرائیلی افواج سے کرتی ہے۔ اکیڈمی آف اسلامک ریسرچ نے 23 اگست 1969 کو ہنگامی اجلاس میں ایک بیان اور قراردادیں جاری کیں جس میں اسلامی اقدام اور اقوام متحدہ سے یروشلم پر اپنی قراردادوں کو نافذ کرنے کا مطالبہ کیا گیا تھا۔ 79، 102-104}۔"
  tr: "21 Ağustos 1969 Perşembe sabahı Mescid-i Aksa'da yangın çıktı ve kütüphane ile doğu tarafı tamamen yandı. Kitap, bunu İsrail'e atfedilen bir suç olarak değerlendiriyor. İslam Araştırma Akademisi 23 Ağustos 1969'da acil bir toplantı düzenleyerek, İslam'ın harekete geçmesini ve Birleşmiş Milletler'in Kudüs ile ilgili kararlarını uygulamaya koymasını talep eden bir bildiri ve kararlar yayınladı. {cite:bayt-al-maqdis-fi-al-islam-azhar s. 79, 102-104}"
  id: "Kebakaran terjadi di Masjid Al-Aqsa pada pagi hari Kamis, 21 Agustus 1969, menghancurkan perpustakaan dan sisi timurnya. Buku ini menganggap kejadian tersebut sebagai kejahatan yang dilakukan oleh Israel. Akademi Penelitian Islam mengadakan sesi darurat pada tanggal 23 Agustus 1969, dan mengeluarkan pernyataan serta resolusi yang menyerukan tindakan Islam dan menuntut agar Perserikatan Bangsa-Bangsa melaksanakan resolusinya mengenai Yerusalem. {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}"
