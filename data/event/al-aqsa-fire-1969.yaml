summary:
  ar: "حريق شب في المسجد الأقصى صباح الخميس 21 أغسطس 1969م فأتى على المكتبة والجانب الشرقي منه، ويعدّه الكتاب جريمة نسبها إلى إسرائيل. عقد مجمع البحوث الإسلامية جلسة طارئة في 23 أغسطس 1969م وأصدر بياناً وقرارات تدعو إلى تحرك إسلامي وإلى مطالبة الأمم المتحدة بتنفيذ قراراتها في القدس {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
  en: "A fire at the al-Aqsa Mosque on the morning of Thursday 21 August 1969 destroyed its library and the eastern side, which the book attributes to Israeli forces. The Academy of Islamic Research met in emergency session on 23 August 1969 and issued a statement and resolutions calling for Islamic action and for the United Nations to enforce its resolutions on Jerusalem {cite:bayt-al-maqdis-fi-al-islam-azhar p. 79, 102-104}."
