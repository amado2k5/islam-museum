id: event/deathbed-of-khalid-ibn-al-walid
class: event
kind: death
label:
  ar: احتضار خالد بن الوليد ووصيته إلى عمر
  en: Deathbed of Khalid ibn al-Walid and his bequest to Umar
  ur: خالد بن الولید کا آخری وقت اور عمر کے نام ان کی وصیت
  es: "El lecho de muerte de Khalid ibn al-Walid y su legado a Umar."
summary:
  ar: "تروي الكتب أن خالد بن الوليد بكى حين حضرته الوفاة وقال إنه شهد مئة زحف أو نحوها وما في جسده موضع شبر إلا وفيه ضربة أو طعنة أو رمية، ثم ها هو يموت على فراشه كما يموت البعير، فلا نامت أعين الجبناء {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. وتذكر روايات أنه جعل فرسه وسلاحه في سبيل الله وداره بالمدينة صدقة وأوصى إلى عمر بن الخطاب {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. وعند الواقدي ومن تابعه أنه مات بقرية على ميل من حمص سنة إحدى وعشرين، وعند دحيم أنه مات بالمدينة، وصحح ابن كثير الأول {cite:al-bidaya-wal-nihaya scan vol. 4 p. 116}. ولما بلغ عمر اجتماع نساء بني المغيرة للبكاء عليه قال ما عليهن أن يبكين أبا سليمان ما لم يكن نقع أو لقلقة {cite:usd-al-ghaba scan vol. 1 p. 334}."
  en: "The books report that Khalid ibn al-Walid wept as death came, saying he had fought a hundred battles or thereabouts and there was no handspan of his body without a blow, thrust or arrow-wound, yet here he was dying on his bed as a camel dies; may the eyes of cowards never sleep {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. Reports say he put his horse and weapons in the cause of God, made his house in Medina a charity and appointed Umar ibn al-Khattab as executor of his bequest {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. According to al-Waqidi and those who follow him he died in a village a mile from Homs in the year 21, while Duhaym says he died in Medina; Ibn Kathir judges the first sounder {cite:al-bidaya-wal-nihaya scan vol. 4 p. 116}. When Umar heard that the women of Banu al-Mughira had gathered to weep for him he said there was no harm in their weeping for Abu Sulayman so long as there was no dust-throwing or shrieking {cite:usd-al-ghaba scan vol. 1 p. 334}."
  ur: "کتابوں میں ہے کہ خالد بن الولید نزع کے وقت روئے اور کہا کہ انھوں نے سو یا اس کے لگ بھگ معرکے دیکھے اور ان کے جسم پر ایک بالشت جگہ بھی ایسی نہیں جس پر زخم، نیزے یا تیر کا نشان نہ ہو، پھر بھی اب بستر پر اس طرح مر رہے ہیں جیسے اونٹ مرتا ہے؛ بزدلوں کی آنکھیں کبھی نہ سوئیں {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. روایات میں ہے کہ انھوں نے اپنا گھوڑا اور ہتھیار اللہ کی راہ میں وقف کیے، مدینے کا گھر صدقہ کیا اور عمر بن الخطاب کو اپنی وصیت کا ذمہ دار بنایا {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. واقدی اور ان کے متبعین کے مطابق وہ حمص سے ایک میل دور ایک بستی میں سن 21 ہجری میں فوت ہوئے، جبکہ دحیم کے نزدیک مدینے میں؛ ابن کثیر پہلے قول کو صحیح کہتے ہیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 116}. جب عمر کو معلوم ہوا کہ بنو مغیرہ کی عورتیں رونے کے لیے جمع ہیں تو انھوں نے کہا کہ ابو سلیمان پر رونے میں حرج نہیں جب تک خاک اڑانا یا چیخنا چلانا نہ ہو {cite:usd-al-ghaba scan vol. 1 p. 334}."
  es: "Los libros informan que Khalid ibn al-Walid lloró al llegar la muerte, diciendo que había luchado en un centenar de batallas o alrededor de ellas y que no había un palmo de su cuerpo sin un golpe, estocada o herida de flecha, sin embargo, allí estaba muriendo en su cama como muere un camello; que los ojos de los cobardes nunca duerman {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. Los informes dicen que puso su caballo y armas en la causa de Dios, convirtió su casa en Medina en una obra de caridad y nombró a Umar ibn al-Khattab como albacea de su legado {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 235}. Según al-Waqidi y quienes lo siguen, murió en una aldea a una milla de Homs en el año 21, mientras que Duhaym dice que murió en Medina; Ibn Kathir juzga el primer sonido {cite:al-bidaya-wal-nihaya scan vol. 4 p. 116}. Cuando Umar oyó que las mujeres de Banu al-Mughira se habían reunido para llorar por él, dijo que no había nada de malo en que lloraran por Abu Sulayman siempre y cuando no arrojaran polvo ni gritaran {cite:usd-al-ghaba scan vol. 1 p. 334}."
