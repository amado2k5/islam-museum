id: event/ibn-rajab-damascus-744
class: event
kind: other
label:
  ar: "انتقال ابن رجب مع أبيه إلى دمشق، ٧٤٤هـ"
  en: "Ibn Rajab moves to Damascus with his father, 744"
  ur: "ابن رجب کا والد کے ساتھ دمشق آمد، 744ھ"
summary:
  ar: "رحل والد ابن رجب، الشيخ شهاب الدين أحمد بن رجب البغدادي، مع أولاده من بغداد إلى دمشق سنة أربع وأربعين وسبعمئة، وكان ابن رجب يومها في الثامنة من عمره؛ وقد سمع أبوه من مشايخ بغداد قبل الرحيل {cite:ibn-rajab-jami-ulum-hikam p. 8} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  en: "Ibn Rajab's father, the shaykh Shihab al-Din Ahmad ibn Rajab al-Baghdadi, moved with his children from Baghdad to Damascus in 744/1343, when Ibn Rajab was about eight years old; the father had already heard hadith from the masters of Baghdad before the move {cite:ibn-rajab-jami-ulum-hikam p. 8} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  ur: "ابن رجب کے والد شیخ شہاب الدین احمد بن رجب بغدادی اپنے بچوں سمیت بغداد سے دمشق منتقل ہوئے، جب ابن رجب کی عمر تقریباً آٹھ برس تھی؛ والد نے رحلت سے پہلے بغداد کے مشائخ سے سماعت کی تھی {cite:ibn-rajab-jami-ulum-hikam p. 8} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}۔"
