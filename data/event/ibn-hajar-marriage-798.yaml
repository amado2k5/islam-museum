id: event/ibn-hajar-marriage-798
class: event
kind: other
label:
  ar: "زواج ابن حجر من أنس خاتون، ٧٩٨هـ/١٣٩٦م"
  en: "Ibn Hajar's marriage to Uns Khatun, 798/1396"
  ur: "ابن حجر کا ازدواج اُنس خاتون سے، 798ھ/1396ء"
summary:
  ar: "في شعبان سنة ٧٩٨هـ/مايو ١٣٩٦م زوّجه وصيّه وأستاذه ابن القطان بفتاة من بيت كريم، أنس بنت ناظر الجيش عبد الكريم بن أحمد، وكان لها من جهة أمها حفيدةُ بنت الأمير منكوتمر مؤسس المدرسة المنكوتمرية؛ وانتقل ابن حجر إلى دار آل زوجته فسكنها حتى مماته، وعاشت أنس بعده نحو أربع عشرة سنة {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}."
  en: "In Sha'ban 798 (May 1396) his guardian-teacher Ibn al-Qattan arranged Ibn Hajar's marriage to Uns, daughter of the army inspector Abd al-Karim ibn Ahmad — on her mother's side a great-granddaughter of the amir Mankutimur, founder of the Mankutimuriyya college. Ibn Hajar moved into his wife's family mansion and lived there until his death; Uns survived him by almost fourteen years {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}."
  ur: "شعبان 798ھ (مئی 1396ء) میں ان کے سرپرست-استاد ابن القطان نے ابن حجر کا نکاح اُنس سے کرایا جو ناظر الجیش عبدالکریم بن احمد کی بیٹی تھیں — والدہ کی طرف سے وہ امیر منکوتمر، بانیِ مدرسہ منکوتمریہ، کی پڑنواسی تھیں۔ ابن حجر اپنی بیوی کے آبائی گھر منتقل ہوئے اور وفات تک وہیں رہے؛ اُنس ان کے بعد تقریباً چودہ برس جیتی رہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}۔"
