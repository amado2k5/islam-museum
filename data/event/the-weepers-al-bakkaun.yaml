id: event/the-weepers-al-bakkaun
class: event
kind: other
label: { ar: "البكاؤون: سبعة طلبوا الحمل", en: "The Weepers: seven who asked to be carried", es: "Los Llorones: siete que pidieron ser llevados en brazos", fr: "Les Pleureurs: sept personnes qui ont demandé à être portées", ur: "رونے والے: سات جنہوں نے لے جانے کو کہا" }
summary:
  ar: "جاء إلى النبي سبعة رجال من الأنصار وغيرهم من بني عمرو بن عوف يُسمّون البكائين، أهل حاجة، يستحملونه، فقال لا أجد ما أحملكم عليه، فتولّوا وأعينهم تفيض من الدمع حزناً ألا يجدوا ما ينفقون؛ وأعطى بعضهم ابن يامين بن عمير النضري ناضحاً وتمراً."
  en: "Seven men of the Ansar and of Banu Amr ibn Awf, called the Weepers, needy men, came to the Prophet begging for mounts; he said: I find nothing to carry you on — and they turned away, their eyes overflowing with tears that they had nothing to spend. Ibn Yamin ibn Umayr al-Nadri gave one of them a camel and dates."
  es: "Siete hombres de los Ansar y de Banu Amr ibn Awf, llamados los Llorones, hombres necesitados, acudieron al Profeta suplicando monturas. Él les dijo: «No encuentro nada para transportarlos», y ellos se marcharon, con los ojos llenos de lágrimas al darse cuenta de que no tenían nada que gastar. Ibn Yamin ibn Umayr al-Nadri le dio a uno de ellos un camello y dátiles."
  fr: "Sept hommes des Ansar et des Banu Amr ibn Awf, surnommés les Pleureurs, des hommes nécessiteux, vinrent implorer le Prophète de leur prêter des montures. Il leur répondit: « Je ne trouve rien pour vous transporter. » Ils s’en allèrent, les yeux emplis de larmes, n’ayant rien à offrir. Ibn Yamin ibn Umayr al-Nadri donna alors à l’un d’eux un chameau et des dattes."
  ur: "انصار اور بنو عمرو بن عوف کے سات آدمی، جنہیں رونے والے، محتاج آدمی کہا جاتا ہے، رسول اللہ کے پاس سواری مانگنے آئے۔ اس نے کہا: مجھے آپ کو لے جانے کے لیے کچھ نہیں ملا - اور وہ منہ موڑ گئے، ان کی آنکھیں آنسوؤں سے بہہ رہی تھیں کہ ان کے پاس خرچ کرنے کے لیے کچھ نہیں تھا۔ ابن یامین بن عمیر النادری نے ان میں سے ایک کو اونٹ اور کھجور دی۔"
