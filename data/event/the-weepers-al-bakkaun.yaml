label: { ar: "البكاؤون: سبعة طلبوا الحمل", en: "The Weepers: seven who asked to be carried" }
summary:
  ar: "جاء إلى النبي سبعة رجال من الأنصار وغيرهم من بني عمرو بن عوف يُسمّون البكائين، أهل حاجة، يستحملونه، فقال لا أجد ما أحملكم عليه، فتولّوا وأعينهم تفيض من الدمع حزناً ألا يجدوا ما ينفقون؛ وأعطى بعضهم ابن يامين بن عمير النضري ناضحاً وتمراً."
  en: "Seven men of the Ansar and of Banu Amr ibn Awf, called the Weepers, needy men, came to the Prophet begging for mounts; he said: I find nothing to carry you on — and they turned away, their eyes overflowing with tears that they had nothing to spend. Ibn Yamin ibn Umayr al-Nadri gave one of them a camel and dates."
