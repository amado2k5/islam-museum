label: { en: "The pause of revelation (Fatra)", ar: "فترة الوحي" }
summary:
  en: "The pause in revelation after the first descent at Hira — days rather than years in the reading of Ibn Sa'd via Ibn Abbas that the book prefers — ending when Jibril appeared seated on a throne between heaven and earth and surat al-Muddaththir came down with the command to rise and warn."
  ar: "انقطاع الوحي بعد نزوله الأول بحراء، ويرجّح الكتاب أنه كان أياماً لا سنين برواية ابن سعد عن ابن عباس؛ ثم انتهى بظهور الملك قاعداً على كرسي بين السماء والأرض ونزول «يا أيها المدثر» بأمر القيام والإنذار."
