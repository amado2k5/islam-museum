summary:
  en: "The pause in revelation after the first descent at Hira — days rather than years in the reading of Ibn Sa'd via Ibn Abbas that the book prefers — ending when Jibril appeared seated on a throne between heaven and earth and surat al-Muddaththir came down with the command to rise and warn."
  ar: "انقطاع الوحي بعد نزوله الأول بحراء، ويرجّح الكتاب أنه كان أياماً لا سنين برواية ابن سعد عن ابن عباس؛ ثم انتهى بظهور الملك قاعداً على كرسي بين السماء والأرض ونزول «يا أيها المدثر» بأمر القيام والإنذار."
  es: "La pausa en la revelación después del primer descenso en Hira —días en lugar de años en la lectura de Ibn Sa'd a través de Ibn Abbas que prefiere el libro— termina cuando Jibril apareció sentado en un trono entre el cielo y la tierra y la sura al-Muddaththir descendió con la orden de levantarse y advertir."
  fr: "La pause dans la révélation après la première descente à Hira — des jours plutôt que des années dans la lecture d'Ibn Sa'd via Ibn Abbas que le livre préfère — prend fin lorsque Jibril apparaît assis sur un trône entre ciel et terre et que la sourate al-Muddaththir descend avec l'ordre de se lever et d'avertir."
  ur: "حیرہ میں پہلے نزول کے بعد وحی میں وقفہ - ابن سعد کے ذریعہ ابن عباس کے پڑھنے میں سالوں کے بجائے دنوں کے مقابلے میں جو کتاب کو ترجیح دیتی ہے - اس وقت ختم ہوئی جب جبرائیل آسمان اور زمین کے درمیان ایک تخت پر بیٹھے ہوئے نمودار ہوئے اور سورۃ المدثر اٹھنے اور خبردار کرنے کے حکم کے ساتھ نازل ہوئی۔"
  tr: "Vahiy, Hira'daki ilk inişinden sonra sona erdi ve kitap, İbn Saad'ın İbn Abbas'tan rivayetine göre, bunun yıllar değil, günler sürdüğünü öne sürüyor; daha sonra gök ile yer arasında bir sandalyede oturan meleğin görünmesi ve \"Ey örtülü olanlar!\" diye inerek kalkıp uyarma emrini vermesiyle sona erdi."
  id: "Wahyu itu berhenti setelah turun pertama kali di Hira, dan kitab tersebut menyebutkan bahwa itu berlangsung selama beberapa hari, bukan bertahun-tahun, menurut riwayat Ibnu Saad dari Ibnu Abbas; kemudian berakhir dengan munculnya malaikat yang duduk di kursi antara langit dan bumi dan turunnya seruan “Wahai orang-orang yang terbungkus” dengan perintah untuk bangkit dan memberi peringatan."
