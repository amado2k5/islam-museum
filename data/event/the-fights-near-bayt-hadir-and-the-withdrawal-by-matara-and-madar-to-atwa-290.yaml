id: event/the-fights-near-bayt-hadir-and-the-withdrawal-by-matara-and-madar-to-atwa-290
class: event
kind: other
label:
  ar: "قتال بيت حاضر وانسحاب الهادي بمطرة ومدر إلى أتوة، جمادى الآخرة 290هـ"
  en: "The fights near Bayt Hadir and al-Hadi's withdrawal by Matara and Madar to Atwa, Jumada II 290 AH"
  ur: "بیت حاضر کی لڑائیاں اور ہادی کی مطرہ اور مدر کے راستے اتوہ کی طرف پسپائی، جمادی الآخرہ 290ھ"
  es: "Las luchas cerca de Bayt Hadir y la retirada de al-Hadi por parte de Matara y Madar a Atwa, Jumada II 290 AH"
  fr: "Les combats près de Bayt Hadir et le retrait d'al-Hadi par Matara et Madar vers Atwa, Jumada II 290 AH"
  tr: "Beyt Hadhir savaşı ve el-Hadi'nin Matrah ve Madar ile birlikte Atwah'a çekilmesi, Cemada el-Ahirah 290 H."
  id: "Pertempuran Bayt Hadhir dan mundurnya al-Hadi bersama Matrah dan Madar ke Atwah, Jumada al-Akhirah 290 H"
summary:
  ar: "أنزل ابن خلف بعض عسكره قرب عسكر الهادي فأخرج الهادي عسكراً من الخولانيين فاقتتلوا مرتين وأمدّهم برجال من همدان، وأصيب رجلان من أصحاب الهادي، ثم ارتحل ليلاً فبات بمطرة يومين ثم بمدر وأذن لمن معه من خولان وهمدان ونجران، ثم نهض إلى أتوة بعدما نزل آل طريف قريباً منه ووقف آل يعفر في موضعهم."
  en: "Ibn Khalaf camped part of his army near al-Hadi's and al-Hadi sent out an army of Khawlanis, who fought twice, and he reinforced them with Hamdani men; two of his men were hit, and he left by night, spent two days at Matara, then reached Madar and gave leave to the men with him from Khawlan, Hamdan and Najran, and went on to Atwa after Al Tarif had halted near him and Al Ya'fur had held to their place."
  ur: "ابن خلف نے اپنے لشکر کا ایک حصہ ہادی کے لشکر کے قریب اتارا تو ہادی نے خولانیوں کا ایک لشکر نکالا جو دو بار لڑے، اور انہوں نے ہمدانی مردوں سے ان کی مدد کی؛ ان کے دو آدمی زخمی ہوئے، پھر وہ رات کو روانہ ہوئے، مطرہ میں دو دن رہے، پھر مدر پہنچ کر ساتھ والے خولان، ہمدان اور نجران کے لوگوں کو رخصت دی، اور جب آل طریف ان کے قریب اترے اور آل یعفر اپنی جگہ پر رکے رہے تو وہ اتوہ چلے گئے۔"
  es: "Ibn Khalaf acampó parte de su ejército cerca del de al-Hadi, y este envió un ejército de Khawlanis, que lucharon dos veces, y los reforzó con hombres de Hamdan; dos de sus hombres fueron heridos, y partió de noche, pasó dos días en Matara, luego llegó a Madar y despidió a los hombres que lo acompañaban de Khawlan, Hamdan y Najran, y continuó hacia Atwa después de que Al Tarif se detuviera cerca de él y Al Ya'fur mantuviera su posición."
  fr: "Ibn Khalaf campa une partie de son armée près de celle d'al-Hadi, et al-Hadi envoya une armée de Khawlanis, qui combattirent deux fois, et il les renforça avec des hommes de Hamdani; deux de ses hommes furent touchés, et il partit de nuit, passa deux jours à Matara, puis atteignit Madar et donna congé aux hommes qui l'accompagnaient de Khawlan, Hamdan et Najran, et continua vers Atwa après qu'Al Tarif se fut arrêté près de lui et qu'Al Ya'fur eut tenu sa position."
  tr: "İbn Halef, askerlerinden bazılarını Hadi'nin kampının yakınına yerleştirdi; bunun üzerine Hadi, Havlan kabilesinden askerler gönderdi ve iki kez savaştılar. Onlara Hamdan'dan adamlar gönderdi ve Hadi'nin arkadaşlarından iki kişi yaralandı. Daha sonra geceleyin yola çıktı ve iki gün Matrah'ta, ardından Madar'da kaldı ve Havlan, Hamdan ve Necran'dan yanındakilere izin verdi. Ardından, Tarif kabilesi yanına yerleştikten ve Yafur kabilesi onların yerini aldıktan sonra Atve'ye doğru yola çıktı."
  id: "Ibn Khalaf menempatkan sebagian pasukannya di dekat perkemahan al-Hadi, sehingga al-Hadi mengirimkan pasukan dari kaum Khawlani, dan mereka bertempur dua kali. Ia memasok mereka dengan orang-orang dari Hamdan, dan dua orang dari para sahabat al-Hadi terluka. Kemudian ia berangkat pada malam hari dan menghabiskan dua hari di Matrah, lalu di Madar, dan memberi izin kepada orang-orang yang bersamanya dari Khawlan, Hamdan, dan Najran. Kemudian ia berangkat ke Atwah setelah klan Al Tarif menetap di dekatnya, dan klan Al Ya'fur menggantikan tempat mereka."
