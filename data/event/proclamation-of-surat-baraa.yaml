id: event/proclamation-of-surat-baraa
class: event
kind: declaration
label: { en: "The proclamation of Bara'a at Mina", ar: "الأذان ببراءة يوم النحر", es: "La proclamación de Bara'a en Mina", fr: "La proclamation de Bara'a à Mina", ur: "منٰی میں براءت کا اعلان", tr: "Kurban Bayramı için dua çağrısı", id: "Seruan untuk salat pada Hari Raya Kurban" }
summary:
  en: "On the Day of Sacrifice in 9 AH Ali ibn Abi Talib, sent after Abu Bakr by the Prophet, proclaimed the opening of Surat Bara'a (al-Tawba) at the Jamrah: treaties with the polytheists were dissolved with a four-month respite, and after that year no polytheist would perform the pilgrimage nor would anyone circle the House naked."
  ar: "أذّن علي بن أبي طالب يوم النحر سنة 9هـ عند الجمرة بأوائل سورة براءة مبعوثاً من النبي خلف أبي بكر: نُبذت مواثيق المشركين وأُجل أربعة أشهر، ولا يحج بعد العام مشرك ولا يطوف بالبيت عريان."
  es: "El Día del Sacrificio del año 9 de la Hégira, Ali ibn Abi Talib, enviado por el Profeta tras Abu Bakr, proclamó la apertura de la Sura Bara'a (al-Tawba) en la Jamrah: los tratados con los politeístas se disolvieron con una tregua de cuatro meses, y después de ese año ningún politeísta realizaría la peregrinación ni nadie circunvalaría la Casa desnudo."
  fr: "Le jour du sacrifice de l'an 9 de l'Hégire, Ali ibn Abi Talib, envoyé après Abu Bakr par le Prophète, proclama l'ouverture de la sourate Bara'a (al-Tawba) à Jamrah: les traités avec les polythéistes furent dissous avec un délai de quatre mois, et après cette année, aucun polythéiste n'accomplirait le pèlerinage ni personne ne ferait le tour de la Maison nu."
  ur: "9 ہجری میں قربانی کے دن علی ابن ابی طالب نے، جسے رسول اللہ نے ابوبکر کے بعد بھیجا تھا، جمرہ میں سورۃ براء ⁦(التوبہ)⁩ کے کھولنے کا اعلان کیا: مشرکین کے ساتھ معاہدے کو چار ماہ کی مہلت کے ساتھ تحلیل کر دیا گیا، اور اس سال کے بعد کوئی مشرک کسی کے گھر کا چکر نہیں لگائے گا۔"
  tr: "Hicri 9. yılda Kurban Bayramı günü, Ali ibn Abi Talib, Peygamberimiz tarafından Ebu Bekir'in arkasından gönderilen ezan metninin başlangıcı olan Bera'ah Suresi ile Cemarat'ta ezan okudu: \"Müşriklerin anlaşmaları reddedildi ve dört aylık bir süre tanındı. Bu yıldan sonra hiçbir müşrik hac yapmayacak, kimse de Kabe'yi çıplak tavaf etmeyecektir.\""
  id: "Pada Hari Raya Kurban tahun 9 Hijriah, Ali bin Abi Talib mengumandangkan azan di Jamarat dengan awal Surah Bara’ah, yang diturunkan oleh Nabi di belakang Abu Bakar: Perjanjian-perjanjian kaum musyrik telah ditolak dan masa tenggang empat bulan telah diberikan. Tidak seorang pun dari kaum musyrik boleh melaksanakan haji setelah tahun ini, dan tidak seorang pun boleh melakukan tawaf di Baitullah dengan telanjang."
