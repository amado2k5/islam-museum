label: { en: "The proclamation of Bara'a at Mina", ar: "الأذان ببراءة يوم النحر" }
summary:
  en: "On the Day of Sacrifice in 9 AH Ali ibn Abi Talib, sent after Abu Bakr by the Prophet, proclaimed the opening of Surat Bara'a (al-Tawba) at the Jamrah: treaties with the polytheists were dissolved with a four-month respite, and after that year no polytheist would perform the pilgrimage nor would anyone circle the House naked."
  ar: "أذّن علي بن أبي طالب يوم النحر سنة 9هـ عند الجمرة بأوائل سورة براءة مبعوثاً من النبي خلف أبي بكر: نُبذت مواثيق المشركين وأُجل أربعة أشهر، ولا يحج بعد العام مشرك ولا يطوف بالبيت عريان."
