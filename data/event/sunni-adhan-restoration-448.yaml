id: event/sunni-adhan-restoration-448
class: event
kind: declaration
label: { ar: "إعادة الأذان السني بالكرخ والتضييق على الشيعة" }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة، بعد استقرار السلطان طغربك ببغداد، أُقيم الأذان في المشهد بمقابر قريش ومشهد العتيقة ومساجد الكرخ بـ«الصلاة خير من النوم»، وأُزيل ما كانوا يستعملونه في الأذان «حي على خير العمل»، وقُلع جميع ما كان على أبواب الدور والدروب من كتابة «وعلى خير البشر»، ودخل إلى الكرخ منشدو أهل السنة من باب البصرة فأنشدوا الأشعار في مدح الصحابة. وتقدّم رئيس الرؤساء ابن المسلمة إلى ابن النسوي بقتل أبي عبد الله بن الجلاب شيخ البزازين بباب الطاق لما كان يتظاهر به من غلوّ الرفض فقُتل وصُلب على باب دكانه، وهرب أبو جعفر الطوسي ونُهبت داره {cite:muntazam-ibn-al-jawzi j.8 p.514}. وفي صفر ٤٤٩ كُبست دار أبي جعفر الطوسي متكلم الشيعة بالكرخ وأُخذ ما وُجد من دفاتره وكرسيه الذي كان يجلس عليه للكلام وأُخرج إلى الكرخ، وأُلحق به ثلاثة مجانيق بيض كان الزوار يحملونها معهم إذا تصدّوا لزيارة الكوفة فأُحرق الجميع {cite:muntazam-ibn-al-jawzi j.8 p.521}. وفي ٤٤٨ تقدّم رئيس الرؤساء بنصب أعلام سود في الكرخ فانزعج أهلها، وكان يجتهد في أذاهم وإنما كان يدفع عنهم عميد الملك الكندري {cite:muntazam-ibn-al-jawzi j.8 p.513}."
  en: "After Tughril Beg's takeover, the Sunni adhan 'al-salatu khayrun min al-nawm' was imposed on the shrines of the Quraysh cemetery, the 'Atiqa mashhad and the mosques of Karkh, 'hayya ila khayr al-amal' was stripped, the door-inscriptions torn down, and Sunni chanters entered from Bab al-Basra praising the Companions; the Bazzazin shaykh Ibn al-Jallab was executed and crucified over his shop, and the Shi'i theologian Abu Ja'far al-Tusi fled — his house stormed in Safar 449, his books, teaching chair and the pilgrims' three white mangonels burned in Karkh {cite:muntazam-ibn-al-jawzi j.8 p.514,521}."
