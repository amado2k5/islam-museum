id: event/sunni-adhan-restoration-448
class: event
kind: declaration
label: { ar: "إعادة الأذان السني بالكرخ والتضييق على الشيعة", en: "Restoration of the Sunni Adhan in Karkh and Restrictions on the Shi'a", es: "Restablecimiento del Adhan sunita en Karkh y restricciones para los chiítas.", fr: "Rétablissement de l'adhan sunnite à Karkh et restrictions imposées aux chiites", ur: "کرخ میں سنی اذان کی بحالی اور شیعوں پر پابندیاں", tr: "Karkh'ta Sünni ezanının yeniden okunması ve Şiilerin kısıtlanması", id: "Mengembalikan seruan azan Sunni di Karkh dan membatasi Syiah." }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة، بعد استقرار السلطان طغربك ببغداد، أُقيم الأذان في المشهد بمقابر قريش ومشهد العتيقة ومساجد الكرخ بـ«الصلاة خير من النوم»، وأُزيل ما كانوا يستعملونه في الأذان «حي على خير العمل»، وقُلع جميع ما كان على أبواب الدور والدروب من كتابة «وعلى خير البشر»، ودخل إلى الكرخ منشدو أهل السنة من باب البصرة فأنشدوا الأشعار في مدح الصحابة. وتقدّم رئيس الرؤساء ابن المسلمة إلى ابن النسوي بقتل أبي عبد الله بن الجلاب شيخ البزازين بباب الطاق لما كان يتظاهر به من غلوّ الرفض فقُتل وصُلب على باب دكانه، وهرب أبو جعفر الطوسي ونُهبت داره {cite:muntazam-ibn-al-jawzi j.8 p.514}. وفي صفر ٤٤٩ كُبست دار أبي جعفر الطوسي متكلم الشيعة بالكرخ وأُخذ ما وُجد من دفاتره وكرسيه الذي كان يجلس عليه للكلام وأُخرج إلى الكرخ، وأُلحق به ثلاثة مجانيق بيض كان الزوار يحملونها معهم إذا تصدّوا لزيارة الكوفة فأُحرق الجميع {cite:muntazam-ibn-al-jawzi j.8 p.521}. وفي ٤٤٨ تقدّم رئيس الرؤساء بنصب أعلام سود في الكرخ فانزعج أهلها، وكان يجتهد في أذاهم وإنما كان يدفع عنهم عميد الملك الكندري {cite:muntazam-ibn-al-jawzi j.8 p.513}."
  en: "After Tughril Beg's takeover, the Sunni adhan 'al-salatu khayrun min al-nawm' was imposed on the shrines of the Quraysh cemetery, the 'Atiqa mashhad and the mosques of Karkh, 'hayya ila khayr al-amal' was stripped, the door-inscriptions torn down, and Sunni chanters entered from Bab al-Basra praising the Companions; the Bazzazin shaykh Ibn al-Jallab was executed and crucified over his shop, and the Shi'i theologian Abu Ja'far al-Tusi fled — his house stormed in Safar 449, his books, teaching chair and the pilgrims' three white mangonels burned in Karkh {cite:muntazam-ibn-al-jawzi j.8 p.514,521}."
  es: "Después de la toma del poder por Tughril Beg, el adhan sunita 'al-salatu khayrun min al-nawm' fue impuesto en los santuarios del cementerio de Quraysh, el 'Atiqa mashhad y las mezquitas de Karkh, 'hayya ila khayr al-amal' fue arrancado, las inscripciones de las puertas arrancadas, y los cantores sunitas entraron desde Bab al-Basra alabando a los Compañeros; el bazzazin shaykh Ibn al-Jallab fue ejecutado y crucificado sobre su tienda, y el teólogo chiíta Abu Ja'far al-Tusi huyó; su casa fue asaltada en Safar 449, sus libros, su silla de enseñanza y los tres mangoneles blancos de los peregrinos fueron quemados en Karkh {cite:muntazam-ibn-al-jawzi j.8 p.514,521}."
  fr: "Après la prise de pouvoir de Tughril Beg, l'adhan sunnite « al-salatu khayrun min al-nawm » fut imposé sur les sanctuaires du cimetière de Quraysh, le mashhad d'Atiqa et les mosquées de Karkh; « hayya ila khayr al-amal » fut supprimé, les inscriptions des portes arrachées, et des chantres sunnites entrèrent de Bab al-Basra en louant les Compagnons; le cheikh Bazzazin Ibn al-Jallab fut exécuté et crucifié au-dessus de sa boutique, et le théologien chiite Abu Ja'far al-Tusi s'enfuit — sa maison fut prise d'assaut en Safar 449, ses livres, sa chaire d'enseignement et les trois mangonneaux blancs des pèlerins brûlés à Karkh {cite:muntazam-ibn-al-jawzi j.8 p.514,521}."
  ur: "طغرل بیگ کے اقتدار پر قبضے کے بعد قریش کے قبرستان کے مزارات پر سنی اذان 'الصلوۃ خیرون من النوم' نافذ کر دی گئی، 'عتیقہ مشہد اور کرخ کی مساجد'، 'حیا الخیر العمل' کو چھین لیا گیا، دروازوں کے نقاشی اور کتب کو پھاڑ دیا گیا، بابن کے اندر داخل ہو گئے۔ صحابہ کی تعریف؛ بزازین شیخ ابن الجلب کو ان کی دکان پر پھانسی دے کر سولی پر چڑھایا گیا، اور شیعہ عالم ابو جعفر الطوسی فرار ہو گئے - صفر 449 میں ان کے گھر پر دھاوا بول دیا گیا، کرخ میں ان کی کتابیں، درس و تدریس کی کرسی اور حجاج کے تین سفید منگولوں کو جلا دیا گیا۔ صفحہ 514,521}۔"
  tr: "Hicri 448 yılında (Miladi 1050/1051), Sultan Tuğrbek Bağdat'a yerleştikten sonra, Kureyş mezarlığındaki türbelerde, Atika türbesinde ve Kerh camilerinde ezan \"Namaz uykudan daha hayırlıdır\" ifadesiyle okunmaya başlandı. Ezandan \"En hayırlı amel için gelin\" ifadesi kaldırıldı ve evlerin ve sokakların kapılarındaki \"Ve insanlığın en hayırlısına\" yazılı tüm yazılar söküldü. Sünni okuyucular Basra Kapısı'ndan Kerh'e girerek Peygamberin Sahabelerini öven şiirler okudular. Baş reis İbn el-Musallama, İbn el-Nasavi'ye, Bab el-Tak'taki kumaş tüccarlarının başı Ebu Abdullah ibn el-Cellab'ı, aşırı Şiilik gösterileri nedeniyle öldürmesini emretti. Ebu Abdullah, dükkanının kapısında öldürüldü ve çarmıha gerildi. Ebu Cafer el-Tusi kaçtı ve evi yağmalandı. Safer 449'da, Şii ilahiyatçı Ebu Cafer el-Tusi'nin Kerh'deki evi yağmalandı ve kitapları ile konuşma yaptığı sandalye Kerh'e götürüldü. Hacılar Kufa'yı ziyaret ederken yanlarında taşıdıkları üç beyaz sapan da eve getirildi ve yakıldı. {cite:muntazam-ibn-al-jawzi j.8 s.521}. 448'de, reislerin reisi Kerh'de siyah sancakların dikilmesini emretti ve bu durum halkı alarma geçirdi. Onlara zarar vermeye kararlıydı, ancak aslında onları kralın reisi el-Kandari'den koruyordu. {cite:muntazam-ibn-al-jawzi j.8 s.513}."
  id: "Pada tahun 448 H (1050/1051 M), setelah Sultan Tughrbek menetap di Baghdad, seruan azan dikumandangkan di makam-makam Quraisy, makam al-Atiqa, dan masjid-masjid al-Karkh dengan kalimat \"Shalat lebih baik daripada tidur.\" Kalimat \"Marilah kepada amalan-amalan terbaik\" dihapus dari seruan azan, dan semua tulisan di pintu-pintu rumah dan lorong-lorong yang bertuliskan \"Dan kepada manusia-manusia terbaik\" dirobohkan. Para pembaca syair Sunni memasuki al-Karkh melalui Gerbang Basra dan membacakan syair-syair yang memuji para Sahabat Nabi. Pemimpin tertinggi, Ibn al-Musallama, memerintahkan Ibn al-Nasawi untuk membunuh Abu Abdullah ibn al-Jallab, kepala pedagang kain di Bab al-Taq, karena penampilannya yang menunjukkan ekstremisme Syiah. Ia dibunuh dan disalib di depan pintu tokonya. Abu Ja'far al-Tusi melarikan diri, dan rumahnya dijarah. Pada tahun Safar 449, rumah Abu Ja'far al-Tusi, seorang teolog Syiah, di Karkh diserbu, dan buku-bukunya serta kursi yang digunakannya untuk berbicara dibawa ke Karkh. Tiga ketapel putih, yang dibawa para peziarah ketika mereka mengunjungi Kufa, juga dibawa ke rumah itu dan dibakar. {cite:muntazam-ibn-al-jawzi j.8 p.521}. Pada tahun 448, kepala para kepala memerintahkan pengibaran bendera hitam di Karkh, yang membuat penduduknya khawatir. Ia bertekad untuk mencelakai mereka, tetapi ia hanya melindungi mereka dari kepala raja, al-Kandari. {cite:muntazam-ibn-al-jawzi j.8 p.513}."
