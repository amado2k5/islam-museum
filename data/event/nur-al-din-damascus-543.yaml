id: event/nur-al-din-damascus-543
class: event
kind: battle
label: { ar: "نور الدين يفك حصار الفرنج عن دمشق", en: "Nur al-Din Lifts the Frankish Siege of Damascus", es: "Nur al-Din levanta el asedio franco de Damasco.", fr: "Nur al-Din lève le siège franc de Damas", ur: "نورالدین نے دمشق کا فرینکش محاصرہ ختم کیا۔", tr: "Nureddin Şam'daki Frenk kuşatmasını kırdı", id: "Nur ad-Din mematahkan pengepungan kaum Frank di Damaskus" }
summary:
  ar: "في سنة ثلاث وأربعين حاصرت الفرنج دمشق فوصل إليها نور الدين محمود بن زنكي وهو صاحب حلب يومئذ وأخوه غازي صاحب الموصل فنصر المسلمون ولله الحمد وهزم الفرنج واستمر نور الدين في قتال الفرنج وأخذ ما استولوا عليه من بلاد المسلمين {cite:tarikh-khulafa-minhaj-1434 p. 673}. وفي شذرات الذهب في ربيع الأول نازلت الفرنج دمشق في عشرة آلاف فارس وستين ألف راجل فخرج المسلمون من دمشق للمصاف واستشهد منهم نحو المائتين ثم بريزوا في اليوم الثاني فاستشهد جماعة وقتل من الفرنج عدد كثير فلما كان في اليوم الخامس وصل غازي الأتابك وأخوه نور الدين في عشرين ألفاً إلى حماة وكان أهل دمشق في الاستغاثة والتضرع إلى الله وأخرجوا المصحف العثماني إلى صحن الجامع وضج الناس والنساء والأطفال فأغاثهم، وركب قسيس الفرنج وفي عنقه صليب وفي يديه صليبان وقال أنا قد وعدني المسيح بأخذ دمشق فاجتمعوا حوله وحمل على الذي حمل عليه المسلمون فقتلوه وقتلوا جماعة وأحرقوا الصلبان ووصلت النجدة فانهزمت الفرنج وأصيب منهم خلق {cite:shadharat-dhahab p. 614}."
  en: "In 543 the Franks besieged Damascus; Nur al-Din Mahmud ibn Zangi, then lord of Aleppo, reached it with his brother Ghazi, lord of Mosul — the Muslims were victorious and the Franks routed. Nur al-Din pressed on against them, taking what they had seized of Muslim lands {cite:tarikh-khulafa-minhaj-1434 p. 673}."
  es: "En 543, los francos sitiaron Damasco; Nur al-Din Mahmud ibn Zangi, entonces señor de Alepo, llegó a ella con su hermano Ghazi, señor de Mosul. Los musulmanes resultaron victoriosos y los francos fueron derrotados. Nur al-Din persiguió a los francos, apoderándose de los territorios musulmanes que estos habían conquistado {cite:tarikh-khulafa-minhaj-1434 p. 673}."
  fr: "En 543, les Francs assiégèrent Damas; Nur al-Din Mahmud ibn Zangi, alors seigneur d’Alep, y parvint avec son frère Ghazi, seigneur de Mossoul. Les musulmans remportèrent la victoire et les Francs furent mis en déroute. Nur al-Din poursuivit son offensive contre eux, reprenant les territoires musulmans conquis."
  ur: "543 میں فرانکس نے دمشق کا محاصرہ کیا۔ نورالدین محمود ابن زنگی، جو اس وقت حلب کا سردار تھا، اپنے بھائی غازی، موصل کے مالک کے ساتھ اس تک پہنچا - مسلمانوں کی فتح ہوئی اور فرینکوں نے شکست کھائی۔ نورالدین نے مسلمانوں کی زمینوں پر جو قبضہ کیا تھا اسے لے کر ان کے خلاف دباؤ ڈالا۔ 673}۔"
  tr: "43 yılında Franklar Şam'ı kuşattılar ve o sırada Halep'in yöneticisi olan Nur ed-Din Mahmud ibn Zangi ile kardeşi, Musul'un yöneticisi olan Gazi oraya geldiler. Allah'a şükürler olsun, Müslümanlar zafer kazandı ve Franklar yenildi. Nur ed-Din Franklarla savaşmaya devam etti ve Müslümanların topraklarından ele geçirdikleri yerleri geri aldı. {cite:tarikh-khulafa-minhaj-1434 s. 673}. Rabi' el-Evvel ayında, Şadharat el-Dhahab'da, Franklar on bin süvari ve altmış bin piyade ile Şam'a saldırdılar. Müslümanlar Şam'dan savaş alanına çıktılar ve yaklaşık iki yüzleri şehit oldu. Sonra ikinci gün savaştılar ve bir grup Müslüman şehit oldu, Franklardan da birçoğu öldürüldü. Beşinci gün, Gazi el-Atabak ve kardeşi Nur el-Din, yirmi bin adamla Hama'ya geldiler. Şam halkı yardım çağırıyor ve Allah'a yalvarıyordu; Osmanî Kur'an'ı caminin avlusuna getirdiler. Halk, kadınlar ve çocuklar feryat edince, o da yardıma koştu. Frank rahibi boynunda bir haç ve ellerinde iki haçla atına bindi ve \"İsa bana Şam'ı alacağımı vaat etti\" dedi. Bunun üzerine etrafına toplandılar ve Müslümanların saldırdığı kişiye saldırdı; onu ve bir grup Müslümanı öldürdüler ve haçları yaktılar. Sonra takviye kuvvetler geldi ve Franklar yenildi, birçoğu öldürüldü. {kaynak: Şadharat-dhahab s. 614}"
  id: "Pada tahun 43, kaum Frank mengepung Damaskus, dan Nur ad-Din Mahmud ibn Zangi, yang saat itu merupakan penguasa Aleppo, dan saudaranya Ghazi, penguasa Mosul, tiba di sana. Umat Islam meraih kemenangan, alhamdulillah, dan kaum Frank dikalahkan. Nur ad-Din terus memerangi kaum Frank dan merebut kembali apa yang telah mereka rebut dari tanah kaum Muslim. {cite:tarikh-khulafa-minhaj-1434 p. 673}. Pada bulan Shadharat al-Dhahab, di bulan Rabi' al-Awwal, kaum Frank menyerang Damaskus dengan sepuluh ribu pasukan berkuda dan enam puluh ribu pasukan infanteri. Kaum Muslim berangkat dari Damaskus ke medan perang, dan sekitar dua ratus dari mereka gugur sebagai syuhada. Kemudian mereka berperang pada hari kedua, dan sebagian dari mereka gugur sebagai syuhada, dan banyak dari kaum Frank terbunuh. Pada hari kelima, Ghazi al-Atabak dan saudaranya Nur al-Din tiba dengan dua puluh ribu orang di Hama. Penduduk Damaskus memohon pertolongan dan berdoa kepada Tuhan, dan mereka membawa Al-Qur'an Utsmani ke halaman masjid. Orang-orang, wanita, dan anak-anak berteriak, sehingga ia datang untuk membantu mereka. Imam Frank itu menunggang kuda dengan salib di lehernya dan dua salib di tangannya dan berkata, \"Kristus telah berjanji kepadaku bahwa aku akan merebut Damaskus.\" Maka mereka berkumpul di sekelilingnya, dan ia menyerang orang yang diserang oleh kaum Muslim, dan mereka membunuh orang itu dan sekelompok dari mereka dan membakar salib-salib itu. Kemudian bala bantuan tiba, dan kaum Frank dikalahkan, dan banyak dari mereka terbunuh. {cite:shadharat-dhahab p. 614}"
