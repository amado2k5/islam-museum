summary:
  ar: "في سنة ثمان وثلاثين كبست الروم دمياط ونهبوا وأحرقوا وسبوا منها ست مئة امرأة وولوا مسرعين في البحر {cite:tarikh-khulafa-minhaj-1434 p. 540}."
  en: "In 238 the Byzantines raided Damietta, plundering and burning, carried off six hundred women and sped out to sea {cite:tarikh-khulafa-minhaj-1434 p. 540}."
  es: "En 238, los bizantinos asaltaron Damietta, saqueándola e incendiándola, se llevaron a seiscientas mujeres y huyeron rápidamente hacia el mar {cite:tarikh-khulafa-minhaj-1434 p. 540}."
  fr: "En 238, les Byzantins pillèrent Damiette, la saccagèrent et l'incendièrent, emmenèrent six cents femmes et se précipitèrent vers la mer {cite:tarikh-khulafa-minhaj-1434 p. 540}."
  ur: "238 میں بازنطینیوں نے دمیٹا پر چڑھائی کی، لوٹ مار اور جلایا، چھ سو عورتوں کو لے کر سمندر کی طرف روانہ ہوئے۔ 540}۔"
  tr: "38. yılda Romalılar Dimyat'a baskın düzenlediler, yağmaladılar, yaktılar ve altı yüz kadını esir aldıktan sonra hızla denize kaçtılar. {cite:tarikh-khulafa-minhaj-1434 s. 540}."
  id: "Pada tahun tiga puluh delapan, bangsa Romawi menyerbu Damietta, menjarah, membakar, dan menawan enam ratus wanita, lalu melarikan diri dengan cepat ke laut. {cite:tarikh-khulafa-minhaj-1434 p. 540}."
