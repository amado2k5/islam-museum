label: { ar: "دخول التتار دمشق واستسلامها سنة 658هـ", en: "Damascus submits to the Tatars, 658", es: "Damasco se somete a los tártaros, 658", fr: "Damas se soumet aux Tatars, 658" }
summary:
  ar: "وصل خبر أخذ حلب إلى دمشق يوم السبت فهرب الملك الناصر ودخل رسل هلاكو يومئذ وقرئ الفرمان بأمان دمشق، وحُملت مفاتيح حماة إلى هلاكو وسار صاحبها والناصر إلى نحو غزة؛ وعصت قلعة دمشق فحاصرتها التتار وألحوا بعشرين منجنيقاً على برج الطارمة فتشقق فطلب أهلها الأمان فأمّنهم وسكنها النائب كتبغا، وتسلموا بعلبك وقلعتها وأخذوا نابلس ونواحيها بالسيف، ثم ظفروا بالملك الناصر وأخذوه بالأمان فبقي في خدمة هلاكو أشهراً ثم قطع هلاكو الفرات راجعاً وترك بالشام فرقة من التتار؛ وثارت النصارى بدمشق ورفعوا الصليب ومروا به وألزموا الناس بالقيام له من حوانيتهم في الثاني والعشرين من رمضان {cite:shadharat-dhahab p. 298-299}."
  en: "When Aleppo's fall reached Damascus on a Saturday, al-Nasir fled; Hulagu's aman was proclaimed and Hama's keys sent after him — while the citadel resisted until twenty mangonels cracked the Tarama tower, then yielded for aman and Kitbugha was installed. Baalbek and Nablus fell, al-Nasir was taken under aman into Hulagu's service, and the khan recrossed the Euphrates leaving a detachment — while Damascus's Christians raised the cross through the markets {cite:shadharat-dhahab p. 298-299}."
  es: "Cuando la caída de Alepo llegó a Damasco un sábado, al-Nasir huyó; se proclamó el aman de Hulagu y se enviaron las llaves de Hama tras él, mientras la ciudadela resistió hasta que veinte mangoneles agrietaron la torre de Tarama, momento en el que cedió ante el aman y se instaló Kitbugha. Baalbek y Nablus cayeron, al-Nasir fue llevado bajo el aman al servicio de Hulagu, y el khan cruzó de nuevo el Éufrates dejando un destacamento, mientras los cristianos de Damasco alzaban la cruz por los mercados {cite:shadharat-dhahab p. 298-299}."
  fr: "Lorsque la chute d'Alep atteignit Damas un samedi, al-Nasir s'enfuit; l'aman d'Hulagu fut proclamé et les clés de Hama envoyées à sa poursuite. La citadelle résista jusqu'à ce que vingt mangonneaux percent la tour de Tarama, puis se rendirent et Kitbugha fut installé comme aman. Baalbek et Naplouse tombèrent, al-Nasir fut placé sous aman au service d'Hulagu, et le khan retraversa l'Euphrate en laissant un détachement. Pendant ce temps, les chrétiens de Damas dressaient la croix sur les marchés (voir: shadharat-dhahab, p. 298-299)."
