summary:
  ar: "وصل خبر أخذ حلب إلى دمشق يوم السبت فهرب الملك الناصر ودخل رسل هلاكو يومئذ وقرئ الفرمان بأمان دمشق، وحُملت مفاتيح حماة إلى هلاكو وسار صاحبها والناصر إلى نحو غزة؛ وعصت قلعة دمشق فحاصرتها التتار وألحوا بعشرين منجنيقاً على برج الطارمة فتشقق فطلب أهلها الأمان فأمّنهم وسكنها النائب كتبغا، وتسلموا بعلبك وقلعتها وأخذوا نابلس ونواحيها بالسيف، ثم ظفروا بالملك الناصر وأخذوه بالأمان فبقي في خدمة هلاكو أشهراً ثم قطع هلاكو الفرات راجعاً وترك بالشام فرقة من التتار؛ وثارت النصارى بدمشق ورفعوا الصليب ومروا به وألزموا الناس بالقيام له من حوانيتهم في الثاني والعشرين من رمضان {cite:shadharat-dhahab p. 298-299}."
  en: "When Aleppo's fall reached Damascus on a Saturday, al-Nasir fled; Hulagu's aman was proclaimed and Hama's keys sent after him — while the citadel resisted until twenty mangonels cracked the Tarama tower, then yielded for aman and Kitbugha was installed. Baalbek and Nablus fell, al-Nasir was taken under aman into Hulagu's service, and the khan recrossed the Euphrates leaving a detachment — while Damascus's Christians raised the cross through the markets {cite:shadharat-dhahab p. 298-299}."
