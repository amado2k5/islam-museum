label: { ar: "وقعة كربلاء", en: "Battle of Karbala" }
summary:
  ar: "في سنة إحدى وستين، وفي كربلاء صلّى الحسين بأصحابه والحر بن يزيد وجيشه، ثم خطب فيهم وقال: «إن تتقوا وتعرفوا الحق لأهله يكن أرضى لله» {cite:tabari-tarikh-abu-al-fadl j.5 p.402}. وهو ما يسرده الطبري في أخبار سنة 61هـ. وعند السيوطي وجّه عبيد الله بن زياد جيشاً أربعة آلاف عليهم عمر بن سعد بن أبي وقاص فخذله أهل الكوفة، فلما أرهقه السلاح عرض الاستسلام والرجوع أو المضي إلى يزيد فيضع يده في يده فأبوا إلا قتله، فقتل يوم عاشوراء بكربلاء وتعرف بالطف وقتل معه ستة عشر رجلاً من آل بيته، وفي قاتله روايات: سنان بن أنس النخعي جد شريك القاضي، وقيل رجل من مذحج، وقيل شمر بن ذي الجوشن، وأجهز عليه خولي بن يزيد الأصبحي فجز رأسه وأتى به عبيد الله بن زياد، وكسفت الشمس ذلك اليوم واحمرت آفاق السماء ستة أشهر بعده {cite:tarikh-khulafa-minhaj-1434 p. 341-342}. وروى الثعالبي عن عبد الملك بن عمير قال رأيت في قصر الإمارة بالكوفة رأس الحسين بين يدي عبيد الله بن زياد على ترس، ثم رأس عبيد الله بين يدي المختار، ثم رأس المختار بين يدي مصعب، ثم رأس مصعب بين يدي عبد الملك، فحدثت به عبد الملك فتطير منه وفارق مكانه {cite:tarikh-khulafa-minhaj-1434 p. 342}. وعند المسعودي كتب أهل الكوفة إلى الحسين أنا قد حبسنا أنفسنا على بيعتك، فنصحه ابن عباس أن يشخص إلى اليمن ويبث دعاته ولا يخرج نساءه وولده معه فقال لأن أقتل بمكان كذا أحب إلي من أن أستحل بمكة، وقال له ابن الزبير حين يئس ابن عباس قرت عينك يا ابن الزبير وأنشد يا لك من قبرة بمعمر خلا لك الجو فبيضي واصفري {cite:muruj-al-dhahab p. 53-55}، وجد بالحسين ثلاث وثلاثون طعنة وأربع وثلاثون ضربة، ضرب زرعة بن شريك كفه اليسرى وطعنه سنان بن أنس ثم احتز رأسه، وأمر عمرو بن سعد بأن توطئه الخيل فانتدب إسحاق بن حيوة، ودفنه أهل العاضرية من بني أسد بعد قتله بيوم وقتل من جيش عمر ثمانية وثمانون، وقتل الحسين لعشر خلون من المحرم سنة إحدى وستين وهو ابن خمس وخمسين وقيل تسع {cite:muruj-al-dhahab p. 60-61}"
  en: "In 61 AH, at Karbala, Husayn led his companions and al-Hurr ibn Yazid and his army in prayer, then addressed them, saying: “If you fear God and acknowledge the truth for its people, that will be more pleasing to God” {cite:tabari-tarikh-abu-al-fadl j.5 p.402}. This is the account al-Tabari gives under the events of 61 AH. According to al-Suyuti, Ubayd Allah ibn Ziyad sent an army of four thousand under Umar ibn Sa'd ibn Abi Waqqas, but the people of Kufa forsook him. When the fighting bore down on him, he offered to make peace and return, or to go to Yazid and place his hand in Yazid's hand; they refused except to kill him. He was killed on the day of Ashura at Karbala, also called al-Taff, and sixteen men of his household were killed with him. There are accounts about his killer: Sinan ibn Anas al-Nakha'i, grandfather of the judge Shurayk; it is also said a man of Madhhij; and it is said Shimr ibn Dhi al-Jawshan. Khuli ibn Yazid al-Asbahi finished him off, cut off his head and brought it to Ubayd Allah ibn Ziyad. The sun was eclipsed that day, and the horizons of the sky stayed red for six months after it {cite:tarikh-khulafa-minhaj-1434 p. 341-342}. Al-Tha'alibi reports from Abd al-Malik ibn Umayr: “I saw in the governor's palace in Kufa the head of Husayn before Ubayd Allah ibn Ziyad on a shield; then the head of Ubayd Allah before al-Mukhtar; then the head of al-Mukhtar before Mus'ab; then the head of Mus'ab before Abd al-Malik.” When I told Abd al-Malik this, he was unsettled by it and moved from his place {cite:tarikh-khulafa-minhaj-1434 p. 342}. In al-Mas'udi's account, the people of Kufa wrote to Husayn that they had pledged themselves to his allegiance, and Ibn Abbas advised him to go to Yemen, send out his missionaries, and not take his women and children with him. Husayn replied that being killed at such-and-such a place was dearer to him than violating the sanctity of Mecca. Ibn al-Zubayr said to him, when Ibn Abbas had despaired, “May your eyes be cooled, O Ibn al-Zubayr,” and recited the line: “What a lark you are in Ma'mar; the open air is yours, so chirp and pipe” {cite:muruj-al-dhahab p. 53-55}. Husayn was found with thirty-three stab wounds and thirty-four blows: Zar'a ibn Shurayk struck his left hand, Sinan ibn Anas stabbed him, and then he cut off his head. Umar ibn Sa'd ordered horses to trample the body, and Ishaq ibn Hayawa volunteered; the people of al-Ghadiriyya of Bani Asad buried him a day after his killing. Eighty-eight of Umar's men were killed. Husayn was killed on the tenth of Muharram in 61 AH, aged fifty-five, or as some say fifty-nine {cite:muruj-al-dhahab p. 60-61}."
