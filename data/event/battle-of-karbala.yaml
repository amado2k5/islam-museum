label: { ar: "وقعة كربلاء" }
summary:
  ar: "في سنة إحدى وستين، وفي كربلاء صلّى الحسين بأصحابه والحر بن يزيد وجيشه، ثم خطب فيهم وقال: «إن تتقوا وتعرفوا الحق لأهله يكن أرضى لله» {cite:tabari-tarikh-abu-al-fadl j.5 p.402}. وهو ما يسرده الطبري في أخبار سنة 61هـ. وعند السيوطي وجّه عبيد الله بن زياد جيشاً أربعة آلاف عليهم عمر بن سعد بن أبي وقاص فخذله أهل الكوفة، فلما أرهقه السلاح عرض الاستسلام والرجوع أو المضي إلى يزيد فيضع يده في يده فأبوا إلا قتله، فقتل يوم عاشوراء بكربلاء وتعرف بالطف وقتل معه ستة عشر رجلاً من آل بيته، وفي قاتله روايات: سنان بن أنس النخعي جد شريك القاضي، وقيل رجل من مذحج، وقيل شمر بن ذي الجوشن، وأجهز عليه خولي بن يزيد الأصبحي فجز رأسه وأتى به عبيد الله بن زياد، وكسفت الشمس ذلك اليوم واحمرت آفاق السماء ستة أشهر بعده {cite:tarikh-khulafa-minhaj-1434 p. 341-342}. وروى الثعالبي عن عبد الملك بن عمير قال رأيت في قصر الإمارة بالكوفة رأس الحسين بين يدي عبيد الله بن زياد على ترس، ثم رأس عبيد الله بين يدي المختار، ثم رأس المختار بين يدي مصعب، ثم رأس مصعب بين يدي عبد الملك، فحدثت به عبد الملك فتطير منه وفارق مكانه {cite:tarikh-khulafa-minhaj-1434 p. 342}. وعند المسعودي كتب أهل الكوفة إلى الحسين أنا قد حبسنا أنفسنا على بيعتك، فنصحه ابن عباس أن يشخص إلى اليمن ويبث دعاته ولا يخرج نساءه وولده معه فقال لأن أقتل بمكان كذا أحب إلي من أن أستحل بمكة، وقال له ابن الزبير حين يئس ابن عباس قرت عينك يا ابن الزبير وأنشد يا لك من قبرة بمعمر خلا لك الجو فبيضي واصفري {cite:muruj-al-dhahab p. 53-55}، وجد بالحسين ثلاث وثلاثون طعنة وأربع وثلاثون ضربة، ضرب زرعة بن شريك كفه اليسرى وطعنه سنان بن أنس ثم احتز رأسه، وأمر عمرو بن سعد بأن توطئه الخيل فانتدب إسحاق بن حيوة، ودفنه أهل العاضرية من بني أسد بعد قتله بيوم وقتل من جيش عمر ثمانية وثمانون، وقتل الحسين لعشر خلون من المحرم سنة إحدى وستين وهو ابن خمس وخمسين وقيل تسع {cite:muruj-al-dhahab p. 60-61}"
