id: event/ahnaf-basra-petition
class: event
kind: other
label: { ar: "خطبة الأحنف لعمر في أهل البصرة", en: "al-Ahnaf's Petition to Umar for Basra", fr: "La requête d’al-Ahnaf à Omar en faveur de Bassora", es: "Petición de al-Ahnaf a Umar para Basora", ur: "احناف کی عمر سے بصرہ کی درخواست" }
summary:
  ar: "قدم الأحنف بن قيس على عمر في أهل البصرة فجعل يسألهم رجلاً رجلاً والأحنف في ناحية البيت في بيت لا يتكلم فقال له عمر أما لك حاجة فقال إن إخواننا من أهل الأمصار نزلوا منازل الأمم الخالية بين المياه العذبة والجنان الملتفة وإنا نزلنا سبخة بشاشة لا يجف نداها ولا ينبت مرعاها ناحيتها من قبل المشرق البحر الأجاج ومن قبل المغرب الفلاة فليس لنا زرع ولا ضرع يأتينا منافعنا وميرتنا في مثل مريء النعامة يخرج الرجل الضعيف فيستعذب الماء من فرسخين وتخرج المرأة لذلك فتربق ولدها فإن لا ترفع خسيستنا وتجبر فاقتنا نكن كقوم هلكوا فألحق عمر ذراري أهل البصرة في العطاء وكتب إلى أبي موسى يأمره أن يحتفر لهم نهراً."
  en: "Al-Ahnaf ibn Qays came to Umar with the Basrans; Umar heard them one by one while al-Ahnaf sat silent in a corner till asked — then: 'our brothers of the garrison towns dwell between sweet waters and tangled gardens, and we in a reeking marsh whose dew never dries nor pasture grows, the briny sea eastward, the waste westward, no tillage no milk, our due reaching us like an ostrich's gullet; the weak man walks two farsakhs for sweet water and the woman miscarries her child going — lift our misery and mend our poverty or we are a people lost'. Umar joined Basra's children to the stipend and wrote Abu Musa to dig them a canal."
  fr: "Al-Ahnaf ibn Qays vint auprès d’Omar avec les habitants de Bassora. Omar les entendit un à un, tandis qu’al-Ahnaf restait silencieux dans un coin jusqu’à ce qu’on l’interroge. Il décrivit leurs frères des villes de garnison installés entre eaux douces et jardins touffus, alors qu’eux vivaient dans un marais malodorant dont la rosée ne séchait jamais et où ne poussait aucun pâturage, la mer salée à l’est, le désert à l’ouest, sans cultures ni lait, leurs rations ne leur parvenant que difficilement. Le faible marchait deux parasanges pour de l’eau douce, et les femmes perdaient leur enfant en chemin ; il demanda qu’on soulage leur misère et leur pauvreté, sans quoi ils étaient perdus. Omar inscrivit les enfants de Bassora aux allocations et écrivit à Abu Musa de leur creuser un canal."
  es: "Al-Ahnaf ibn Qays llegó a Umar con los basranos; Umar los escuchó uno por uno mientras al-Ahnaf permanecía en silencio en un rincón hasta que le preguntaron: «Nuestros hermanos de las ciudades guarnición habitan entre aguas dulces y jardines enmarañados, y nosotros en un pantano fétido cuyo rocío nunca se seca ni crece pasto, el mar salobre al este, el páramo al oeste, sin cultivo ni leche, lo que nos corresponde nos llega como la garganta de un avestruz; el hombre débil camina dos farsakhs para conseguir agua dulce y la mujer aborta a su hijo al ir; alivia nuestra miseria y remedia nuestra pobreza o seremos un pueblo perdido». Umar incluyó a los niños de Basora en el estipendio y escribió a Abu Musa para que les cavara un canal."
  ur: "احنف بن قیس بصریوں کے ساتھ عمر کے پاس آئے۔ عمر نے انہیں ایک ایک کر کے سنا جب کہ احناف پوچھنے تک ایک کونے میں خاموش بیٹھے رہے - پھر: 'ہمارے گیریژن شہروں کے بھائی میٹھے پانیوں اور الجھے ہوئے باغات کے درمیان رہتے ہیں، اور ہم ایک ایسی دلدل میں رہتے ہیں جس میں نہ کبھی اوس خشک ہوتی ہے اور نہ ہی چراگاہ اگتی ہے، مشرق کی طرف چمکدار سمندر، مغرب کی طرف کچرا، کوئی کھیتی نہیں، جیسے ہمارے دودھ کی فصل تک نہیں پہنچتی۔ کمزور آدمی میٹھے پانی کے لیے دو فرسخ پیدل چلتا ہے اور عورت اپنے بچے کو اسقاط حمل کر دیتی ہے، ہمارے دکھ اٹھاؤ اور ہماری غربت دور کرو ورنہ ہم ہارے ہوئے لوگ ہیں۔ عمر نے بصرہ کے بچوں کو وظیفہ میں شامل کیا اور ابو موسیٰ کو لکھا کہ وہ ان کے لیے نہر کھودیں۔"
