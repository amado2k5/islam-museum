id: event/al-hadi-enters-khiwan-and-preaches-to-its-people-286
class: event
kind: other
label:
  ar: الهادي يدخل خيوان ويخطب في أهلها ويعظهم، صفر 286هـ
  en: Al-Hadi enters Khiwan and preaches to its people, Safar 286 AH
  ur: ہادی کا خیوان میں داخلہ اور اہل خیوان کو خطبہ و نصیحت، صفر 286ھ
summary:
  ar: دخل الهادي خيوان فلبس الناس العافية واطمأنوا، وفي اليوم الثاني خرج إلى المسجد فصعد المنبر وخطب، فذكر الدهر وصروفه وأن العاقبة للمتقين وعاتب أهلها على نقض البيعة والعهد والحلف والوعد، وقال إنه لولا ما عنده من الحلم والفضل لأنزل بهم العقوبة، ثم عفا عنهم متمثلاً بقول يوسف، وحلفهم على السمع والطاعة.
  en: Al-Hadi entered Khiwan and the people put on well-being and felt at ease; on the second day he went to the mosque, climbed the minbar and preached. He spoke of time and its reverses and that the outcome is for the God-fearing, reproached its people for breaking pledge, covenant, oath and promise, said that but for his forbearance and grace he would have brought punishment on them, then pardoned them echoing the words of Yusuf, and had them swear to hear and obey.
  ur: ہادی خیوان میں داخل ہوئے تو لوگوں نے عافیت کا لباس اوڑھ لیا اور مطمئن ہو گئے؛ دوسرے دن وہ مسجد گئے، منبر پر چڑھے اور خطبہ دیا۔ انہوں نے زمانے اور اس کے پلٹوں کا ذکر کیا اور کہا کہ انجام پرہیزگاروں کا ہے، اہل خیوان کو بیعت، عہد، قسم اور وعدہ توڑنے پر ملامت کی، کہا کہ اگر ان کا حلم اور فضل نہ ہوتا تو وہ ان پر سزا اتارتے، پھر یوسف کے قول کے مطابق انہیں معاف کیا اور ان سے سمع و طاعت پر قسم لی۔
