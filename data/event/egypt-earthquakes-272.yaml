summary:
  ar: "ورد الخبر في جمادى الأولى سنة اثنتين وسبعين ومائتين أن مصر زُلزلت زلازل أخربت الدور ومسجد الجامع، وأنه أُحصي بها في يوم واحد ألف جنازة {cite:muntazam-ibn-al-jawzi p. 85}."
  en: "News reached Baghdad in Jumada I 272 that Egypt had been shaken by earthquakes that ruined houses and the congregational mosque, with a thousand funerals counted in a single day {cite:muntazam-ibn-al-jawzi p. 85}."
  es: "Llegaron noticias a Bagdad en Jumada I 272 de que Egipto había sido sacudido por terremotos que arruinaron casas y la mezquita congregacional, con mil funerales contabilizados en un solo día {cite:muntazam-ibn-al-jawzi p. 85}."
  fr: "La nouvelle parvint à Bagdad en Jumada I 272 que l'Égypte avait été secouée par des tremblements de terre qui avaient détruit des maisons et la mosquée du vendredi, et qu'un millier de funérailles avaient été recensées en une seule journée {cite:muntazam-ibn-al-jawzi p. 85}."
  ur: "جمعہ اول 272 میں بغداد تک یہ خبر پہنچی کہ مصر زلزلے سے لرز اٹھا ہے جس سے مکانات اور مسجدیں اجڑ گئی ہیں، ایک ہی دن میں ایک ہزار جنازے ہوئے ہیں۔ 85}۔"
  tr: "272 yılının Cemâdî Ula ayında Mısır'ın depremlerle sarsıldığı, evlerin ve Mescid-i Haram'ın yıkıldığı ve bir günde bin cenazenin sayıldığı haberi geldi. {cite:muntazam-ibn-al-jawzi s. 85}"
  id: "Berita itu sampai pada Jumada al-Ula tahun dua ratus tujuh puluh dua bahwa Mesir diguncang gempa bumi yang menghancurkan rumah-rumah dan Masjid Agung, dan bahwa seribu pemakaman tercatat dalam satu hari di sana {cite:muntazam-ibn-al-jawzi p. 85}."
