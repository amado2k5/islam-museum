label:
  ar: "عودة ابن عساكر إلى دمشق سنة مقتل تاج الملك بوري، ٥٢٥هـ/١١٣١م"
  en: "Ibn 'Asakir returns to Damascus in the year of Taj al-Mulk Buri's assassination, 525/1131"
  ur: "تاج الملک بوری کے قتل کے سال ابن عساکر کی دمشق واپسی، 525ھ/1131ء"
summary:
  ar: "زار ابن عساكر نواحي الموصل ثم عاد إلى دمشق سنة خمس وعشرين وخمسمائة، وهي سنة اغتيال تاج الملك بوري {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}؛ ويظهر أنه تزوج في أواخر هذه المدة، إذ وُلد ابنه القاسم سنة سبع وعشرين {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Ibn 'Asakir visited the Mosul region and returned to Damascus in 525, the year Taj al-Mulk Buri was assassinated {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. He seems to have married toward the end of this period, for his son al-Qasim was born in 527/1133 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "ابن عساکر نے موصل کے نواح کا دورہ کیا اور 525ھ میں دمشق لوٹ آئے — یہی وہ سال ہے جب تاج الملک بوری قتل ہوا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}؛ ظاہر ہے اسی زمانے کے آخر میں شادی کی، کیونکہ بیٹا قاسم 527ھ/1133ء میں پیدا ہوا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
