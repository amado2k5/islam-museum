id: event/ibn-asakir-return-damascus-525
class: event
kind: other
label:
  ar: "عودة ابن عساكر إلى دمشق سنة مقتل تاج الملك بوري، ٥٢٥هـ/١١٣١م"
  en: "Ibn 'Asakir returns to Damascus in the year of Taj al-Mulk Buri's assassination, 525/1131"
  ur: "تاج الملک بوری کے قتل کے سال ابن عساکر کی دمشق واپسی، 525ھ/1131ء"
  es: "Ibn 'Asakir regresa a Damasco en el año del asesinato de Taj al-Mulk Buri, 525/1131."
  fr: "Ibn 'Asakir retourne à Damas l'année de l'assassinat de Taj al-Mulk Buri, 525/1131."
  tr: "İbn Asakir, Tac el-Malik Buri'nin suikasta uğradığı yıl olan 525 Hicri/1131 Miladi yılında Şam'a döndü."
  id: "Ibn Asakir kembali ke Damaskus pada tahun pembunuhan Taj al-Malik Buri, 525 H/1131 M."
summary:
  ar: "زار ابن عساكر نواحي الموصل ثم عاد إلى دمشق سنة خمس وعشرين وخمسمائة، وهي سنة اغتيال تاج الملك بوري {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}؛ ويظهر أنه تزوج في أواخر هذه المدة، إذ وُلد ابنه القاسم سنة سبع وعشرين {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Ibn 'Asakir visited the Mosul region and returned to Damascus in 525, the year Taj al-Mulk Buri was assassinated {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. He seems to have married toward the end of this period, for his son al-Qasim was born in 527/1133 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "ابن عساکر نے موصل کے نواح کا دورہ کیا اور 525ھ میں دمشق لوٹ آئے — یہی وہ سال ہے جب تاج الملک بوری قتل ہوا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}؛ ظاہر ہے اسی زمانے کے آخر میں شادی کی، کیونکہ بیٹا قاسم 527ھ/1133ء میں پیدا ہوا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
  es: "Ibn 'Asakir visitó la región de Mosul y regresó a Damasco en 525, el año en que Taj al-Mulk Buri fue asesinado {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. Parece que se casó hacia el final de este período, ya que su hijo al-Qasim nació en 527/1133 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  fr: "Ibn 'Asakir visita la région de Mossoul et retourna à Damas en 525, année de l'assassinat de Taj al-Mulk Buri {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. Il semble s'être marié vers la fin de cette période, car son fils al-Qasim naquit en 527/1133 {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  tr: "İbn Asakir, Hicri 525 yılında Musul bölgesini ziyaret ettikten sonra Şam'a döndü; bu yıl, Tac el-Malik Buri'nin suikasta uğradığı yıldır {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 746}; ve görünüşe göre bu dönemin sonlarına doğru evlendi, zira oğlu el-Kasım Hicri 527 yılında doğdu {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 746}."
  id: "Ibn Asakir mengunjungi wilayah Mosul dan kemudian kembali ke Damaskus pada tahun 525 H, yang merupakan tahun pembunuhan Taj al-Malik Buri {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}; dan tampaknya ia menikah menjelang akhir periode ini, karena putranya al-Qasim lahir pada tahun 527 H {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
