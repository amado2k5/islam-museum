label: { ar: "فتح طرابزون", en: "Conquest of Trebizond", es: "Conquista de Trebisonda", fr: "La conquête de Trébizonde", ur: "Trebizond کی فتح", tr: "Trabzon'un Fethi", id: "Penaklukan Trabzon" }
summary:
  ar: "سار السلطان محمد الفاتح بنفسه إلى طرابزون آخر ممالك الروم البنطية على البحر الأسود ففتحها وانقضت بذلك دولة الكومنين {cite:dawlat-uthmaniyya-salabi}."
  en: "Mehmed II marched in person on Trebizond, the last Byzantine Greek state on the Black Sea, took it and ended the Komnenos empire {cite:dawlat-uthmaniyya-salabi}."
  ur: "سلطان محمد فاتح خود بحیرہ اسود پر بازنطینی یونانیوں کی آخری ریاست طرابزون کی طرف بڑھا، اسے فتح کیا اور کومنینوس کی سلطنت ختم ہوئی {cite:dawlat-uthmaniyya-salabi}."
  es: "Mehmed II marchó personalmente sobre Trebisonda, el último estado griego bizantino en el Mar Negro, lo tomó y puso fin al imperio de los Comneno {cite:dawlat-uthmaniyya-salabi}."
  fr: "Mehmed II marcha en personne sur Trébizonde, le dernier État grec byzantin sur la mer Noire, le prit et mit fin à l'empire des Comnènes {cite:dawlat-uthmaniyya-salabi}."
  tr: "Fatih Sultan Sultan Muhammed bizzat Karadeniz'deki son Pontus Roma krallığı olan Trabzon'a yürüdü ve burayı fethederek Komnene devletine son verdi."
  id: "Sultan Muhammad Sang Penakluk sendiri berbaris ke Trabzon, kerajaan Romawi Pontus terakhir di Laut Hitam, dan menaklukkannya, sehingga mengakhiri negara Komnene."
