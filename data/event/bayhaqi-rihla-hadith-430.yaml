label:
  ar: "الرحلة في طلب الحديث، نحو ٤٣٠هـ"
  en: "Travels in pursuit of hadith, c. 430/1038"
  ur: "طلبِ حدیث کے سفر، تقریباً 430ھ/1038ء"
  fr: "Les voyages en quête du hadith, vers 430/1038"
  es: "Viajes en busca de hadices, c. 430/1038"
  tr: "Hadis arayışı yolculuğu, yaklaşık 430 Hicri yılı."
  id: "Perjalanan dalam pencarian Hadits, sekitar tahun 430 Hijriah"
summary:
  ar: "رحل البيهقي في طلب الحديث في بلاد كثيرة حتى قيل إنه روى عن نحو مائة شيخ، وكان في الاعتقاد أشعرياً وفي حاله ورعاً مقتصداً صاحبَ علم {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  en: "Al-Bayhaqi travelled through many lands in pursuit of hadith and is credited with transmitting from about a hundred shaykhs; in creed he was an Ash'arite, and by character frugal, pious and scholarly {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  ur: "بيهقی نے طلبِ حدیث کے لیے کئی ملکوں کے سفر کیے اور تقریباً سو شیوخ سے روایت کیے؛ عقیدے میں اشعری تھے اور طبعاً متقی، پرہیزگار اور صاحبِ علم {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}۔"
  fr: "Al-Bayhaqi parcourut de nombreux pays en quête du hadith et on lui attribue la transmission d'environ cent cheikhs ; dans sa croyance il était ash'arite, et de caractère frugal, pieux et savant {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  es: "Al-Bayhaqi viajó por muchas tierras en busca de hadices y se le atribuye la transmisión de aproximadamente cien shaykhs; en cuanto a su credo, era ash'arita, y por su carácter era frugal, piadoso y erudito {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  tr: "El-Beyhakî, hadis aramak için birçok ülkeyi dolaştı ve rivayete göre yaklaşık yüz şeyhten rivayet etti. İnanç olarak Eş'ari idi ve hali itibariyle dindar, ölçülü ve bilgiliydi. {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}"
  id: "Al-Bayhaqi melakukan perjalanan mencari hadits di banyak negara hingga dikatakan bahwa ia meriwayatkan dari sekitar seratus syekh. Ia beriman dengan aliran Asy'ariyah dan dalam keadaannya ia saleh, moderat, dan berpengetahuan luas. {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
