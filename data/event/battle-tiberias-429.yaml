summary:
  ar: "جهز الخليفة الظاهر العساكر من مصر إلى الشام لقتال صالح بن مرداس صاحب حلب وحسان بن مفرج صاحب الرملة، وعليهم أنوشتكين الدزبري، فلقيهما على الأردن بطبرية فانهزما وقتل صالح بن مرداس وولده الأصغر، ونجا ولده الأكبر نصر (شبل الدولة) إلى حلب."
  en: "Caliph al-Zahir dispatched armies from Egypt to Syria under Anushtakin al-Dizbiri against Salih ibn Mirdas of Aleppo and Hasan ibn Mufarrij of Ramla; he met them on the Jordan at Tiberias, routed them, and killed Salih and his younger son — his elder son Nasr (Shibl al-Dawla) escaped to Aleppo."
