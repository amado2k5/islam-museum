label: { ar: "فتح أرجان وشيراز وبلاد فارس", en: "The Joint Conquests of Fars" }
summary:
  ar: "اجتمع أبو موسى الأشعري وعثمان بن أبي العاص في آخر خلافة عمر ففتحا أرجان صلحاً على الجزية والخراج وفتحا شيراز وهي من أرض أردشير خرة على أن يكونوا ذمة يؤدون الخراج إلا من أحب منهم الجلاء ولا يقتلوا ولا يستعبدوا وفتحا سينيز من أرض أردشير خرة وترك أهلها عماراً للأرض وفتح عثمان حصن جنابا بأمان وجرا وكازرون والنوبندجان من سابور وفتح هرم بن حيان العبدي قلعة شبير عنوة بعد حصار وقتال."
  en: "Late in Umar's caliphate Abu Musa and Uthman ibn Abi al-As joined: Arrajan by sulh on jizya and kharaj; Shiraz of Ardashir-Khurra — dhimma paying kharaj, free exodus for who wished, no killing no enslaving; Siniz whose folk stayed land-workers; Uthman took Hisn Jannaba by aman, and Jarra, Kazarun and Nawbandajan of Sabur; Harim ibn Hayyan took Qal'at Shabir by force after siege and fighting."
