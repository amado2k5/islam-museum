label: { ar: "فتح أرجان وشيراز وبلاد فارس", en: "The Joint Conquests of Fars", es: "Las conquistas conjuntas de Fars", fr: "Les conquêtes communes de Fars", ur: "فارس کی مشترکہ فتوحات" }
summary:
  ar: "اجتمع أبو موسى الأشعري وعثمان بن أبي العاص في آخر خلافة عمر ففتحا أرجان صلحاً على الجزية والخراج وفتحا شيراز وهي من أرض أردشير خرة على أن يكونوا ذمة يؤدون الخراج إلا من أحب منهم الجلاء ولا يقتلوا ولا يستعبدوا وفتحا سينيز من أرض أردشير خرة وترك أهلها عماراً للأرض وفتح عثمان حصن جنابا بأمان وجرا وكازرون والنوبندجان من سابور وفتح هرم بن حيان العبدي قلعة شبير عنوة بعد حصار وقتال {cite:futuh-buldan-maarif-1407 p. 546-547}."
  en: "Late in Umar's caliphate Abu Musa and Uthman ibn Abi al-As joined: Arrajan by sulh on jizya and kharaj; Shiraz of Ardashir-Khurra — dhimma paying kharaj, free exodus for who wished, no killing no enslaving; Siniz whose folk stayed land-workers; Uthman took Hisn Jannaba by aman, and Jarra, Kazarun and Nawbandajan of Sabur; Harim ibn Hayyan took Qal'at Shabir by force after siege and fighting {cite:futuh-buldan-maarif-1407 p. 546-547}."
  es: "A finales del califato de 'Umar, Abu Musa y Uthman ibn Abi al-As se unieron: Arrajan por sulh sobre jizya y kharaj; Shiraz de Ardashir-Khurra — la cuestión del pago de kharaj, éxodo libre para quien lo deseara, sin matar ni esclavizar; cínicos cuya gente siguió siendo labradores; Uthman tomó Su Paraíso por Aman, y Jarra, Kazarun y Nawbandajan de Sabur; Harim ibn Hayyan tomó Qal'at Shabir por la fuerza después de un asedio y lucha {cite:futuh-buldan-maarif-1407 p. 546-547}."
  fr: "Vers la fin du califat d'Umar, Abu Musa et Uthman ibn Abi al-As s'unirent: Arrajan par sulh sur la jizya et le kharaj; Shiraz d'Ardashir-Khurra — la question du paiement du kharaj, l'exode libre pour quiconque le souhaitait, ni meurtre ni esclavage; les Cyniques dont le peuple resta paysan; Uthman prit son Paradis par Aman, et Jarra, Kazarun et Nawbandajan de Sabur; Harim ibn Hayyan prit Qal'at Shabir par la force après un siège et des combats {cite:futuh-buldan-maarif-1407 p. 546-547}."
  ur: "عمر کی خلافت کے اواخر میں ابو موسیٰ اور عثمان بن ابی العاص شامل ہوئے: جزیہ اور خرج پر اراجان؛ اردشیر خرہ کا شیراز - خرج کی ادائیگی کا مسئلہ، جو چاہے اس کے لیے آزادانہ خروج، نہ قتل نہ غلامی؛ مذموم جن کے لوگ زمین پر کام کرنے والے رہے۔ عثمان نے اپنی جنت کو امان کے ذریعے لے لیا، اور صبور کے جررا، کازارون اور نوبندجان۔ حریم بن حیان نے قلعہ شبیر کو محاصرے اور لڑائی کے بعد طاقت کے ذریعے اپنے قبضے میں لے لیا۔ 546-547}۔"
