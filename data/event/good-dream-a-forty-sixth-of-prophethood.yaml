summary:
  ar: "الرؤيا الحسنة من الرجل الصالح جزء من ستة وأربعين جزءا من النبوة وليس يبقى بعدي من النبوة إلا الرؤيا الصالحة هي المبشرات {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|الموطأ 2746]] [[passage/muwatta-31-2749|الموطأ 2749]] [[passage/muwatta-31-2748|الموطأ 2748]]."
  en: "The good dream of a righteous man is a forty-sixth part of prophethood, and nothing remains of prophethood after me but the good dream, which are the glad tidings {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Muwatta 2746]] [[passage/muwatta-31-2749|Muwatta 2749]] [[passage/muwatta-31-2748|Muwatta 2748]]."
  ur: "نیک آدمی کا نیک خواب نبوت کا سینتالیسواں حصہ ہے، اور میرے بعد نبوت میں سے صرف نیک خواب باقی رہتا ہے جو مبشرات ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|موطأ 2746]] [[passage/muwatta-31-2749|موطأ 2749]] [[passage/muwatta-31-2748|موطأ 2748]]۔"
  es: "El buen sueño de un hombre justo es una cuadragésima sexta parte de la profecía, y nada queda de la profecía después de mí sino el buen sueño, que son las buenas nuevas {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Muwatta 2746]] [[passage/muwatta-31-2749|Muwatta 2749]] [[passage/muwatta-31-2748|Muwatta 2748]]."
  fr: "Le bon rêve d'un homme juste est la quarante-sixième partie de la prophétie, et il ne reste de la prophétie après moi que le bon rêve, qui sont les bonnes nouvelles {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Muwatta 2746]] [[passage/muwatta-31-2749|Muwatta 2749]] [[passage/muwatta-31-2748|Muwatta 2748]]."
  tr: "Salih insanın iyi görümü, peygamberliğin kırk altı bölümünden biridir ve benden sonra peygamberlikten geriye iyi görümden başka bir şey kalmayacaktır ki bu da müjdedir. {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Al-Muwatta 2746]] [[passage/muwatta-31-2749|Al-Muwatta 2749]] [[passage/muwatta-31-2748|Al-Muwatta 2748]]."
  id: "Penglihatan yang baik dari orang yang saleh adalah salah satu dari empat puluh enam bagian kenabian, dan tidak akan ada lagi kenabian setelahku kecuali penglihatan yang baik, yaitu kabar gembira. {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Al-Muwatta 2746]] [[passage/muwatta-31-2749|Al-Muwatta 2749]] [[passage/muwatta-31-2748|Al-Muwatta 2748]]."
