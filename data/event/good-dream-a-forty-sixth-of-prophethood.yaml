label:
  ar: "الرؤيا الحسنة جزء من ستة وأربعين جزءا من النبوة"
  en: "The good dream: a forty-sixth part of prophethood"
  ur: "نیک خواب: نبوت کا سینتالیسواں حصہ"
summary:
  ar: "الرؤيا الحسنة من الرجل الصالح جزء من ستة وأربعين جزءا من النبوة وليس يبقى بعدي من النبوة إلا الرؤيا الصالحة هي المبشرات {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|الموطأ 2746]] [[passage/muwatta-31-2749|الموطأ 2749]] [[passage/muwatta-31-2748|الموطأ 2748]]."
  en: "The good dream of a righteous man is a forty-sixth part of prophethood, and nothing remains of prophethood after me but the good dream, which are the glad tidings {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|Muwatta 2746]] [[passage/muwatta-31-2749|Muwatta 2749]] [[passage/muwatta-31-2748|Muwatta 2748]]."
  ur: "نیک آدمی کا نیک خواب نبوت کا سینتالیسواں حصہ ہے، اور میرے بعد نبوت میں سے صرف نیک خواب باقی رہتا ہے جو مبشرات ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2746|موطأ 2746]] [[passage/muwatta-31-2749|موطأ 2749]] [[passage/muwatta-31-2748|موطأ 2748]]۔"
