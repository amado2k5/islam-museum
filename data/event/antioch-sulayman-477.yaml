id: event/antioch-sulayman-477
class: event
kind: conquest
label: { ar: "أخذ سليمان بن قتلمش أنطاكية من الروم", en: "Sulayman ibn Qutlumush takes Antioch from the Romans", es: "Sulayman ibn Qutlumush toma Antioquía de los romanos.", fr: "Sulayman ibn Qutlumush prend Antioche aux Romains", ur: "سلیمان بن قطلمش نے رومیوں سے انطاکیہ لے لیا۔", tr: "Süleyman ibn Kutulmaş, Antakya'yı Romalılardan ele geçirdi.", id: "Sulayman bin Qutalmish merebut Antiokhia dari Romawi." }
summary:
  ar: "في سنة سبع وسبعين سار سليمان بن قتلمش السلجوقي صاحب قونية وأقصرا بجيوشه إلى الشام فأخذ أنطاكية وكانت بيد الروم من سنة ثمان وخمسين وثلاث مئة وأرسل إلى السلطان ملكشاه يبشره وقال الذهبي وآل سلجوق هم ملوك بلاد الروم وقد امتدت أيامهم وبقي منهم بقية إلى زمن الملك الظاهر بيبرس {cite:tarikh-khulafa-minhaj-1434 p. 651-652}."
  en: "In 477 Sulayman ibn Qutlumush, the Seljuk lord of Qonya and Aqsaray, marched on Syria and took Antioch — in Roman hands since 358 — sending the glad tidings to sultan Malikshah. Al-Dhahabi: Al Saljuq are the kings of the lands of Rum, their line lasting to the days of al-Malik al-Zahir Baybars {cite:tarikh-khulafa-minhaj-1434 p. 651-652}."
  es: "En 477, Sulayman ibn Qutlumush, señor selyúcida de Qonya y Aqsaray, marchó sobre Siria y tomó Antioquía —en manos romanas desde 358— enviando buenas noticias al sultán Malikshah. Al-Dhahabi: Los selyúcidas son los reyes de las tierras de Rum, su linaje perdura hasta los días de al-Malik al-Zahir Baybars {cite:tarikh-khulafa-minhaj-1434 p. 651-652}."
  fr: "En 477, Sulayman ibn Qutlumush, seigneur seldjoukide de Qonya et d'Aqsaray, marcha sur la Syrie et prit Antioche – alors sous domination romaine depuis 358 – annonçant la bonne nouvelle au sultan Malikshah. Al-Dhahabi: Les Seldjoukides sont les rois des terres de Roum, leur lignée s'étendant jusqu'au règne d'al-Malik al-Zahir Baybars {cite: tarikh-khulafa-minhaj-1434 p. 651-652}."
  ur: "477 میں قونیہ اور اقسرے کے سلجوقی سردار سلیمان ابن قتلمش نے شام پر چڑھائی کی اور انطاکیہ کو لے لیا - 358 سے رومی ہاتھوں میں - سلطان ملک شاہ کو خوشخبری بھیجی۔ الذہبی: سلجوق سرزمین روم کے بادشاہ ہیں، ان کا سلسلہ ملک الظاہر بیبرس کے زمانے تک جاری رہا 651-652}۔"
  tr: "Yetmiş yedinci yılda, Konya ve Aksar hükümdarı Süleyman bin Kutalmış el-Saljuki, ordularıyla Levant'a yürüdü ve 358 yılından beri Romalıların elinde olan Antakya'yı ele geçirdi. Sultan Malikşah'a müjdeyi iletmek için haber gönderdi. El-Dhahabi şöyle dedi: Selçuklular, Roma topraklarının hükümdarlarıydı ve günleri uzun sürdü; onlardan geriye kalanlar, Kral el-Zahir Baybars zamanına kadar varlığını sürdürdü. {cite:tarikh-khulafa-minhaj-1434 s. 651-652}"
  id: "Pada tahun tujuh puluh tujuh, Suleiman bin Qutalmish al-Saljuqi, penguasa Konya dan Aksar, berbaris dengan pasukannya ke Levant dan merebut Antiokhia, yang telah berada di tangan Romawi sejak tahun tiga ratus lima puluh delapan. Ia mengirim utusan kepada Sultan Malikshah untuk menyampaikan kabar baik tersebut. Al-Dhahabi berkata: Seljuk adalah raja-raja di wilayah Romawi, dan masa pemerintahan mereka panjang, dan sebagian dari mereka tetap ada hingga masa pemerintahan Raja al-Zahir Baybars. {cite:tarikh-khulafa-minhaj-1434 p. 651-652}."
