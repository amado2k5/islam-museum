  en: "In 477 Sulayman ibn Qutlumush, the Seljuk lord of Qonya and Aqsaray, marched on Syria and took Antioch — in Roman hands since 358 — sending the glad tidings to sultan Malikshah. Al-Dhahabi: Al Saljuq are the kings of the lands of Rum, their line lasting to the days of al-Malik al-Zahir Baybars {cite:tarikh-khulafa-minhaj-1434 p. 651-652}."
