id: event/ibn-al-mulaqqin-tulun-733
class: event
kind: gathering
label:
  ar: "قراءة ابن الملقن القرآن والعمدة وسماعه بمصر، نحو ٧٣٣هـ"
  en: "Qur'an, the 'Umda and first hearings at Cairo, about 733/1333"
  ur: "قرآن، عمدہ اور قاہرہ میں ابتدائی سماعت، تقریباً 733ھ/1333ء"
summary:
  ar: "قرأه زوجُ أمه الملقن القرآنَ ثم العمدة، وأراد أن يشغله على مذهب الإمام مالك فقال له بعض أولاد ابن جماعة: أقرئه المنهاج؛ فأقرأه وأسمعه على الحافظين ابن سيد الناس وقطب الدين الحلبي، وأجاز له الحافظ المزي وغيره من دمشق ومصر وحلب {cite:shadharat-dhahab 7/44}. وسمع من أبي الفتح بن سيد الناس — توفي سنة ٧٣٤هـ — وأحمد بن علي المشتولي وأبي نعيم بن الإسعردي {cite:durar-kamina-jil-1993 dhayl p. 121}."
  en: "His stepfather al-Mulaqqin taught him the Qur'an then the 'Umda, and meant to school him on Imam Malik's madhhab until one of Ibn Jama'a's sons said: teach him the Minhaj. He did, and had him hear the two hafizes Ibn Sayyid al-Nas and Qutb al-Din al-Halabi, while the hafiz al-Mizzi and others of Damascus, Egypt and Aleppo gave him ijazas {cite:shadharat-dhahab 7/44}. Among those he heard was Abu l-Fath Ibn Sayyid al-Nas, who died in 734 {cite:durar-kamina-jil-1993 dhayl p. 121}."
  ur: "سوتیلے باپ ملقن نے انہیں قرآن پھر عمدہ پڑھایا اور امام مالک کے مذہب پر مشق کرانا چاہی، مگر ابن جماعہ کے ایک فرزند نے کہا: منہاج پڑھاؤ؛ پس انہی نے منہاج پڑھائی اور حافظین ابن سید الناس اور قطب الدین حلبی سے سماعت کرائی، اور حافظ مزی سمیت دمشق، مصر اور حلب کے علماء نے اجازتیں دیں {cite:shadharat-dhahab 7/44}۔ ان کے سماعت کرنے والوں میں ابوالفتح ابن سید الناس بھی تھے جو 734ھ میں فوت ہوئے {cite:durar-kamina-jil-1993 dhayl p. 121}۔"
