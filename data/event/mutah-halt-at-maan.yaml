id: event/mutah-halt-at-maan
class: event
kind: other
label: { ar: "توقف الجيش بمعان وخطبة ابن رواحة", en: "The army's halt at Ma'an and Ibn Rawaha's speech", es: "La parada del ejército en Ma'an y el discurso de Ibn Rawaha", fr: "L'arrêt de l'armée à Ma'an et le discours d'Ibn Rawaha", ur: "معن اور ابن رواحہ کی تقریر پر فوج کا رک جانا", tr: "Ordu Ma'an'da durdu ve İbn Ravaha bir vaaz verdi.", id: "Pasukan berhenti di Ma'an dan Ibnu Rawaha memberikan khutbah." }
summary:
  ar: "نزل جيش مؤتة بمعان من أرض الشام، فبلغهم أن هرقل نزل بمآب من البلقاء في مئة ألف من الروم، وانضم إليه مثلهم من لخم وجذام والقين وبهراء وبلي. تردد الناس يومين في طلب الإمداد، فشجعهم عبد الله بن رواحة وحثّهم على المضي لطلب إحدى الحسنيين: النصر أو الشهادة."
  en: "The Mu'tah army camped at Ma'an in Syria; news reached them that Heraclius had encamped at Ma'ab in al-Balqa' with a hundred thousand Romans, joined by equal numbers from Lakhm, Judham, al-Qayn, Bahra' and Bali under Malik ibn Zaflah. When the men debated sending for reinforcements, Abd Allah ibn Rawaha urged them forward with a speech about the two good outcomes."
  es: "El ejército de Mu'tah acampó en Ma'an, Siria. Les llegó la noticia de que Heraclio había acampado en Ma'ab, en al-Balqa', con cien mil romanos, a los que se unieron otros tantos procedentes de Lakhm, Judham, al-Qayn, Bahra' y Bali, bajo el mando de Malik ibn Zaflah. Cuando los hombres debatieron si debían pedir refuerzos, Abd Allah ibn Rawaha los animó a seguir adelante con un discurso sobre las dos buenas consecuencias."
  fr: "L'armée de Mu'tah campait à Ma'an, en Syrie. La nouvelle leur parvint qu'Héraclius avait établi son camp à Ma'ab, dans la région d'al-Balqa', avec cent mille Romains, rejoints par des troupes d'effectifs équivalents venues de Lakhm, Judham, al-Qayn, Bahra' et Bali, sous le commandement de Malik ibn Zaflah. Alors que les hommes débattaient de l'opportunité d'envoyer des renforts, Abd Allah ibn Rawaha les encouragea à agir, leur présentant les deux issues favorables possibles."
  ur: "مطہ کی فوج نے شام میں معن کے مقام پر ڈیرے ڈالے۔ انہیں خبر پہنچی کہ ہرقل نے مالک بن غفلہ کے ماتحت لخم، جُدھم، القین، بحرہ اور بالی سے برابر تعداد کے ساتھ ایک لاکھ رومیوں کے ساتھ بلقع میں مآب میں ڈیرہ ڈالا ہے۔ جب ان افراد نے کمک بھیجنے کے بارے میں بحث کی تو عبداللہ بن رواحہ نے انہیں دو اچھے نتائج کے بارے میں ایک تقریر کے ساتھ آگے بڑھانے پر زور دیا۔"
  tr: "Mu'tah'ın ordusu Suriye topraklarındaki Ma'an'a saldırdı ve Heraklius'un Balqa'daki Ma'ab'da yüz bin Romalı ile kamp kurduğu ve Lakhm, Judham, Qayn, Bahra' ve Bali kabilelerinden de aynı sayıda kişinin ona katıldığı haberi onlara ulaştı. Halk, takviye istemeyi düşünerek iki gün tereddüt etti, ta ki Abdullah ibn Rawahah onları cesaretlendirip iki yüce amaçtan birini, zafer ya da şehitliği hedeflemeleri için harekete geçmeye teşvik edene kadar."
  id: "Pasukan Mu'tah turun ke Ma'an di tanah Suriah, dan kabar sampai kepada mereka bahwa Heraclius telah berkemah di Ma'ab di Balqa' dengan seratus ribu orang Romawi, dan bahwa jumlah yang sama telah bergabung dengannya dari suku Lakhm, Judham, Qayn, Bahra', dan Bali. Orang-orang ragu-ragu selama dua hari, mempertimbangkan untuk meminta bala bantuan, sampai Abdullah ibn Rawahah mendorong mereka dan mendesak mereka untuk melanjutkan perjalanan demi salah satu dari dua tujuan mulia: kemenangan atau mati syahid."
