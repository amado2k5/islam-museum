label: { ar: "توقف الجيش بمعان وخطبة ابن رواحة", en: "The army's halt at Ma'an and Ibn Rawaha's speech" }
summary:
  ar: "نزل جيش مؤتة بمعان من أرض الشام، فبلغهم أن هرقل نزل بمآب من البلقاء في مئة ألف من الروم، وانضم إليه مثلهم من لخم وجذام والقين وبهراء وبلي. تردد الناس يومين في طلب الإمداد، فشجعهم عبد الله بن رواحة وحثّهم على المضي لطلب إحدى الحسنيين: النصر أو الشهادة."
  en: "The Mu'tah army camped at Ma'an in Syria; news reached them that Heraclius had encamped at Ma'ab in al-Balqa' with a hundred thousand Romans, joined by equal numbers from Lakhm, Judham, al-Qayn, Bahra' and Bali under Malik ibn Zaflah. When the men debated sending for reinforcements, Abd Allah ibn Rawaha urged them forward with a speech about the two good outcomes."
