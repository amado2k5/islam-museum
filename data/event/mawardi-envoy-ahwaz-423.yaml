id: event/mawardi-envoy-ahwaz-423
class: event
kind: other
label:
  ar: "سفارة الماوردي إلى أبي كاليجار بالأهواز في شأن اللقب، ٤٢٣هـ"
  en: "Al-Mawardi's embassy to Abu Kalijar at al-Ahwaz over the laqab, 423/1032"
  ur: "لقب کے معاملے پر ماوردی کی اہواز میں ابوکلیجار کے پاس سفارت، 423ھ/1032ء"
summary:
  ar: "في سنة ثلاث وعشرين وأربعمائة بعث الخليفة [[person/al-qaim-bi-amr-illah|القائم بأمر الله]] القاضي [[person/al-mawardi|أبا الحسن الماوردي]] إلى الملك [[person/abu-kalijar|أبي كاليجار]] بالأهواز بكتاب؛ ويحكي الماوردي بضمير المتكلم أنهم تقدموا عليه فتلقّاه وأنزله دارًا عامرة، واقترحوا أن يكون اللقب «السلطان المعظم» فقال: لا يمكن، لأن السلطان المعظم الخليفة، وكذلك «مالك الأمم»، فعدلوا إلى «ملك الدولة» فأجاز على احتمال، واشترطوا تقديم الخدمة للخليفة بالطائف قبل التلقيب ففُعل، وحملوا معه عشرين ألف دينار وخمسة وعشرين ألف درهم وكساوي وعطورًا {cite:muntazam-ibn-al-jawzi j.8 p.407-409}. ويعدّها معجم الإسلام أول أربع مهمات سياسية ائتمنه عليها الخليفة القائم في سنين ٤٢٢ و٤٢٨ و٤٣٤ و٤٣٥هـ {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  en: "In 423 AH the caliph [[person/al-qaim-bi-amr-illah|al-Qa'im bi-amr Allah]] sent the qadi [[person/al-mawardi|Abu al-Hasan al-Mawardi]] with a letter to the king [[person/abu-kalijar|Abu Kalijar]] at al-Ahwaz. Al-Mawardi narrates in the first person that they went ahead of him, received him and lodged him; when the proposed laqab 'al-Sultan al-Mu'azzam' came up he said it could not be, for the Greatest Sultan is the caliph — and likewise 'Malik al-Umam' — so they turned to 'Malik al-Dawla', which he allowed as possible on condition that the service to the caliph be performed first, and it was done; he returned carrying twenty thousand dinars, twenty-five thousand dirhams, robes and perfumes {cite:muntazam-ibn-al-jawzi j.8 p.407-409}. The EI2 counts it the first of four political missions the caliph al-Qa'im entrusted to him in 422, 428, 434 and 435 {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  ur: "423ھ میں خلیفہ [[person/al-qaim-bi-amr-illah|قائم بامر اللہ]] نے قاضی [[person/al-mawardi|ابوالحسن ماوردی]] کو خط کے ساتھ اہواز میں بادشاہ [[person/abu-kalijar|ابوکلیجار]] کے پاس بھیجا۔ ماوردی خود بیان کرتے ہیں کہ انہیں استقبال کیا گیا اور ٹھہرایا گیا؛ جب تجویز ہوا کہ لقب «سلطان معظم» ہو تو انھوں نے کہا یہ ممکن نہیں، کیونکہ سلطانِ معظم خلیفہ ہے، اور اسی طرح «مالک الامم» بھی؛ پھر «ملک الدولہ» کی طرف آئے جسے انھوں نے اس شرط پر ممکن جانا کہ تلقیب سے پہلے خلیفہ کی خدمت پیش کی جائے، اور ایسا ہی ہوا؛ وہ بیس ہزار دینار، پچیس ہزار درہم، خلعتیں اور خوشبوئیں لیے لوٹے {cite:muntazam-ibn-al-jawzi j.8 p.407-409}۔ دائرۃ المعارفِ اسلام اسے چار سیاسی مہموں میں پہلی گنتی ہے جو خلیفہ قائم نے انھیں 422، 428، 434 اور 435ھ میں سونپیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔"
