label: { ar: "أخذ الملك الكامل آمد سنة 630", en: "Al-Malik al-Kamil takes Amid, 630", es: "Al-Malik al-Kamil toma Amid, 630", fr: "Al-Malik al-Kamil prend Amid, 630", ur: "الملک الکامل امید، 630 لیتا ہے۔", tr: "Kral El-Kamil, Amid'i 630 yılında ele geçirdi.", id: "Raja Al-Kamil merebut Amid pada tahun 630." }
summary:
  ar: "في سنة ثلاثين وستمائة حاصر الملك الكامل آمد وأخذها من صاحبها الملك المسعود، فضربها بالمجانيق فلما رأى المسعود الغلبة خرج وفي رقبته منديل فرسم عليه وتسلم منه البلد، وطلب منه تسليم القلاع فسلم الجميع إلا حصن كيفا فعذبه بأنواع العذاب وكان يبغضه؛ وكان المسعود فاسقاً يأخذ الحرم غصباً حتى وجدوا في قصره خمسمائة حرة من بنات الناس {cite:shadharat-dhahab p. 135}."
  en: "In 630 al-Kamil besieged Amid and took it from its lord al-Malik al-Mas'ud; battered by mangonels, al-Mas'ud came out with a kerchief round his neck and yielded the city. When he surrendered every fortress save Kayfa, al-Kamil tortured him for it — a prince he loathed, and justly infamous: they found five hundred free women seized as concubines in his palace {cite:shadharat-dhahab p. 135}."
  es: "En 630, al-Kamil sitió Amid y se la arrebató a su señor, al-Malik al-Mas'ud. Tras ser atacado con mangoneles, al-Mas'ud salió con un pañuelo al cuello y entregó la ciudad. Cuando rindió todas las fortalezas excepto Kayfa, al-Kamil lo torturó por ello; era un príncipe al que odiaba y cuya infamia era justificada: encontraron quinientas mujeres libres tomadas como concubinas en su palacio {cita: shadharat-dhahab p. 135}."
  fr: "En 630, al-Kamil assiégea Amid et la prit à son seigneur, al-Malik al-Mas'ud. Malmené par les mangonneaux, al-Mas'ud sortit, un mouchoir autour du cou, et se rendit. Lorsqu'il livra toutes les forteresses à l'exception de Kayfa, al-Kamil le tortura pour cela – un prince qu'il haïssait et dont la réputation était justifiée: on découvrit dans son palais cinq cents femmes libres, réduites à l'état de concubines (cf. shadharat-dhahab, p. 135)."
  ur: "630 میں الکامل نے امید کا محاصرہ کیا اور اسے اپنے آقا المالک المسعود سے چھین لیا۔ مینگونیل سے مارا مارا، المسعود اپنی گردن میں رومال لے کر باہر نکلا اور شہر کو حاصل کیا۔ جب اس نے کیفہ کے علاوہ ہر قلعہ کو ہتھیار ڈال دیا، تو الکامل نے اس کے لیے اس پر تشدد کیا - ایک شہزادہ جس سے وہ نفرت کرتا تھا، اور منصفانہ طور پر بدنام تھا: انھوں نے اس کے محل میں پانچ سو آزاد عورتوں کو لونڈیوں کے طور پر پکڑا ہوا پایا۔ 135}۔"
  tr: "630 yılında Kral Kamil, Amid'i kuşattı ve sahibi Kral Mesud'dan aldı. Şehri mancınıklarla bombaladı. Mesud zaferi görünce boynunda bir mendille çıktı, onu çekti ve şehri ondan aldı. Kaleleri teslim etmesini istedi, o da Kaifa kalesi hariç hepsini teslim etti. Bunun üzerine onu her türlü işkenceye maruz bıraktı ve ondan nefret etti. Mesud, sarayında halktan beş yüz özgür kadını zorla alıkoyan bir ahlaksızdı. {kaynak: Şadharat-Dhaba s. 135}"
  id: "Pada tahun 630, Raja Al-Kamil mengepung Amid dan merebutnya dari pemiliknya, Raja Al-Masoud. Ia membombardir kota itu dengan ketapel. Ketika Al-Masoud melihat kemenangan itu, ia keluar dengan saputangan di lehernya, lalu Raja Al-Kamil menarik saputangan itu dan merebut kota tersebut darinya. Ia meminta Raja Al-Masoud untuk menyerahkan benteng-benteng, dan Raja Al-Kamil menyerahkan semuanya kecuali benteng Kaifa. Raja Al-Kamil kemudian menyiksanya dengan berbagai macam siksaan, dan Raja Al-Kamil membencinya. Al-Masoud adalah seorang yang bejat yang akan mengambil wanita secara paksa hingga mereka menemukan lima ratus wanita merdeka dari kalangan putri rakyat di istananya. {cite:shadharat-dhahab p. 135}"
