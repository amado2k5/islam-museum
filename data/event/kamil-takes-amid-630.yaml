label: { ar: "أخذ الملك الكامل آمد سنة 630" }
summary:
  ar: "في سنة ثلاثين وستمائة حاصر الملك الكامل آمد وأخذها من صاحبها الملك المسعود، فضربها بالمجانيق فلما رأى المسعود الغلبة خرج وفي رقبته منديل فرسم عليه وتسلم منه البلد، وطلب منه تسليم القلاع فسلم الجميع إلا حصن كيفا فعذبه بأنواع العذاب وكان يبغضه؛ وكان المسعود فاسقاً يأخذ الحرم غصباً حتى وجدوا في قصره خمسمائة حرة من بنات الناس {cite:shadharat-dhahab p. 135}."
  en: "In 630 al-Kamil besieged Amid and took it from its lord al-Malik al-Mas'ud; battered by mangonels, al-Mas'ud came out with a kerchief round his neck and yielded the city. When he surrendered every fortress save Kayfa, al-Kamil tortured him for it — a prince he loathed, and justly infamous: they found five hundred free women seized as concubines in his palace {cite:shadharat-dhahab p. 135}."
