  ur: "1716 میں پیٹرووارادین کی جنگ کے لیے ڈرافٹ کارڈ، آسٹرو-ترک جنگ میں عثمانی فوج پر ساوائے کی فتح کے یوجین؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1716'da gerçekleşen Petrovaradin Muharebesi'nin (Savoyeli Eugene'in Avusturya-Türk Savaşı'nda Osmanlı ordusuna karşı kazandığı zafer) ön raporu; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Petrovaradin pada tahun 1716, kemenangan Eugene dari Savoy atas tentara Ottoman dalam Perang Austro-Turki; sumber-sumber di halaman ini belum ditinjau."
