id: "event/author-charges-ibn-al-fadl-with-deviant-doctrine-at-al-mudhaykhira-in-297-ah"
class: event
kind: other
label:
  ar: "يتهم المؤلف ابن الفضل بإظهار مذهب مخالف للإسلام في المذيخرة سنة 297هـ، ص394"
  en: "The author charges Ibn al-Fadl with deviant doctrine at al-Mudhaykhira in 297 AH, p. 394"
  ur: "مصنف ابن الفضل پر 297ھ میں المذیخرہ میں غیر اسلامی عقیدے کا الزام لگاتا ہے، ص394"
  fr: "L'auteur accuse Ibn al-Fadl de doctrine déviante à al-Mudhaykhira en 297 H, p. 394"
summary:
  ar: "يتهم المؤلف ابن الفضل، بعد عودته إلى المذيخرة، بإظهار المجوسية والأمر بما حرّمه الإسلام، وبقتل من امتنع. والمتحف ينقل هذه الاتهامات بوصفها اتهامات المؤلف، لا وقائع مثبتة."
  en: "Back at al-Mudhaykhira, the author charges Ibn al-Fadl with professing Magianism, ordering acts that Islam forbids, and killing those who refused. The museum records these as the author's charges, not as established facts."
  ur: "المذیخرہ واپسی پر مصنف ابن الفضل پر الزام لگاتا ہے کہ اس نے مجوسیت کا اظہار کیا، اسلام کی حرام کردہ باتوں کا حکم دیا، اور انکار کرنے والوں کو قتل کیا۔ میوزیم ان باتوں کو مصنف کے الزامات کے طور پر درج کرتا ہے، ثابت شدہ واقعات کے طور پر نہیں۔"
  fr: "De retour à al-Mudhaykhira, l'auteur accuse Ibn al-Fadl d'avoir professé le mazdéisme, ordonné des actes que l'islam interdit et fait tuer ceux qui refusaient. Le musée consigne ces accusations comme celles de l'auteur, non comme des faits établis."
