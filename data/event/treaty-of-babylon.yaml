id: event/treaty-of-babylon
class: event
kind: treaty
label:
  ar: صلح عمرو بن العاص والقبط
  en: Peace between Amr ibn al-As and the Copts
  ur: عمرو بن العاص اور قبطیوں کی صلح
summary:
  ar: الصلح الذي عقده عمرو بن العاص مع المقوقس بعد حصار الحصن، على ديناران على كل قبطي بالغ وضيافة المسلمين ثلاثة أيام، وأن تبقى لهم أرضهم وأموالهم. ويذكر ابن عبد الحكم أن العرفاء أحصوا أكثر من ستة آلاف ألف نفس فكانت فريضتهم اثني عشر ألف ألف دينار في السنة، وفي رواية ثمانية آلاف ألف {cite:futuh-misr-amir-1999 p. 103} {cite:futuh-misr-amir-1999 p. 104}.
  en: 'The peace Amr ibn al-As made with al-Muqawqis after the siege of the fortress: two dinars on every adult Copt, three days'' hospitality for Muslims, and their land and property left to them. Ibn Abd al-Hakam reports that the headmen counted more than six million persons, giving twelve million dinars a year; another report says eight million were counted {cite:futuh-misr-amir-1999 p. 103} {cite:futuh-misr-amir-1999 p. 104}.'
  ur: 'وہ صلح جو عمرو بن العاص نے قلعے کے محاصرے کے بعد مقوقس سے کی: ہر بالغ قبطی پر دو دینار، مسلمانوں کے لیے تین دن کی ضیافت، اور ان کی زمین اور مال انہی کے پاس۔ ابن عبد الحکم کے مطابق عرفاء نے ساٹھ لاکھ سے زیادہ افراد گنے، جن سے سالانہ ایک کروڑ بیس لاکھ دینار بنے؛ ایک روایت میں اسی لاکھ گنے گئے {cite:futuh-misr-amir-1999 p. 103} {cite:futuh-misr-amir-1999 p. 104}۔'
