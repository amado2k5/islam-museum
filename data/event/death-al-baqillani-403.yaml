label:
  ar: "وفاة القاضي أبي بكر الباقلاني ببغداد، ٢٣ ذو القعدة ٤٠٣هـ/٥ يونيو ١٠١٣م"
  en: "Death of the qadi Abu Bakr al-Baqillani in Baghdad, 23 Dhu'l-Qa'da 403/5 June 1013"
  ur: "قاضی ابوبکر باقلانی کی وفات، بغداد، 23 ذوالقعدہ 403ھ/5 جون 1013ء"
summary:
  ar: "توفي القاضي أبو بكر الباقلاني آخر يوم السبت لسبع بقين من ذي القعدة سنة ثلاث وأربعمائة — أي ٢٣ ذو القعدة ٤٠٣هـ الموافق ٥ يونيو ١٠١٣م — ببغداد، وصلى عليه ابنه الحسن، ودُفن في داره بدرب المجوس ثم نُقل بعد ذلك فدُفن في مقبرة باب حرب؛ ورثاه شعراء عصره {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "The qadi Abu Bakr al-Baqillani died at the end of a Saturday, seven nights before the close of Dhu'l-Qa'da 403 — 23 Dhu'l-Qa'da 403, corresponding to 5 June 1013 — in Baghdad. His son al-Hasan led the funeral prayer; he was buried in his house in Darb al-Majus and later transferred to the Bab Harb cemetery, and poets of the age mourned him {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "قاضی ابوبکر باقلانی ہفتے کی آخری وقت، ذوالقعدہ کے سات دن باقی رہتے ہوئے — یعنی 23 ذوالقعدہ 403ھ بمطابق 5 جون 1013ء — بغداد میں وفات پا گئے۔ ان کے بیٹے حسن نے نماز جنازہ پڑھائی؛ پہلے درب مجوس میں اپنے گھر میں دفن ہوئے، پھر باب حرب کے قبرستان منتقل کیے گئے، اور عہد کے شعرا نے ان کا رنج کیا {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
