id: event/ibn-al-abbar-embassy-tunis-635
class: event
kind: other
label:
  ar: "وفد ابن الأبار إلى سلطان إفريقية يستغيث به لبلنسية، ٦٣٥هـ"
  en: "Ibn al-Abbar's embassy to the sultan of Ifriqiya for beleaguered Valencia, 635/1238"
  ur: "محصور بلنسیہ کے لیے ابن ابار کا افریقیہ کے سلطان کے پاس وفد، 635ھ/1238ء"
summary:
  ar: "لما حاصر جيمس الأول ملك أرغون بلنسية في رمضان ٦٣٥هـ (أبريل–مايو 1238م)، بُعث ابن الأبار في وفد إلى سلطان إفريقية الحفصي أبي زكريا يستمده النجدة؛ وأنشد أمامه قصيدته السينية في الرابع من المحرم (أغسطس 1238م كما طبع) مصوِّرًا فيها بلده المحاصَر تصويرًا موجعًا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}، فبادر السلطان بإعانة أهلها وشحن الأساطيل بالمدد من المال والأقوات والكسى {cite:nafh-tib-maqqari p. 464}."
  en: "When James I of Aragon besieged Valencia in Ramadan 635 (April–May 1238), Ibn al-Abbar was sent with a deputation to the Hafsid sovereign Abu Zakariyya' of Tunis to beg assistance; he recited before him his qasida rhyming in sin on 4 Muharram (17 August 1238 as printed), painting a moving picture of his besieged native city {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}. The sultan hastened to aid its people, loading fleets with money, provisions and clothing {cite:nafh-tib-maqqari p. 464}."
  ur: "جب جیمز اول آراگونی نے رمضان 635ھ (اپریل–مئی 1238ء) میں بلنسیہ کا محاصرہ کیا تو ابن ابار کو حفصی سلطان ابو زکریا کے پاس امداد مانگنے کے لیے وفد میں بھیجا گیا؛ انہوں نے 4 محرم کو (مطبوعہ تاریخ کے مطابق 17 اگست 1238ء) سلطان کے سامنے اپنی سین راء قصیدہ پڑھا جس میں محصور آبائی شہر کا تکلیف دہ منظر کھینچا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}۔ سلطان نے فوراً اہل شہر کی مدد کی اور بیڑوں کو مال، خوراک اور کپڑے سے لد کر روانہ کیا {cite:nafh-tib-maqqari p. 464}."
