id: event/birth-al-mawardi-364
class: event
kind: birth
label:
  ar: "مولد أبي الحسن علي بن محمد الماوردي بالبصرة، ٣٦٤هـ"
  en: "Birth of Abu al-Hasan Ali ibn Muhammad al-Mawardi at Basra, 364/974"
  ur: "ابوالحسن علی بن محمد ماوردی کی پیدائش بصرہ میں، 364ھ/974ء"
summary:
  ar: "وُلد أبو الحسن علي بن محمد بن حبيب الماوردي البصري الشافعي بالبصرة سنة أربع وستين وثلاثمائة، وكان أبوه صانع ماء الورد وبائعه، وإليه نُسب {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وتوفي عن ست وثمانين سنة في ربيع الأول سنة خمسين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  en: "Abu al-Hasan Ali ibn Muhammad ibn Habib al-Mawardi al-Basri al-Shafi'i was born at Basra in 364/974; his father was a maker and seller of rose-water, from which his nisba derives {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. He died aged eighty-six in Rabi' I 450 {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  ur: "ابوالحسن علی بن محمد بن حبیب ماوردی بصری شافعی 364ھ/974ء میں بصرہ میں پیدا ہوئے؛ ان کے والد گلاب کا پانی بنانے اور بیچنے والے تھے، جس سے ان کی نسبت پڑی {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ وہ چھیاسی برس کی عمر میں ربيع الاول 450ھ میں فوت ہوئے {cite:muntazam-ibn-al-jawzi j.8 p.199-200}۔"
