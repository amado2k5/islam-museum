id: event/birth-al-mawardi-364
class: event
kind: birth
label:
  ar: "مولد أبي الحسن علي بن محمد الماوردي بالبصرة، ٣٦٤هـ"
  en: "Birth of Abu al-Hasan Ali ibn Muhammad al-Mawardi at Basra, 364/974"
  ur: "ابوالحسن علی بن محمد ماوردی کی پیدائش بصرہ میں، 364ھ/974ء"
  fr: "La naissance d'Abu al-Hasan Ali ibn Muhammad al-Mawardi à Bassora, 364/974"
  es: "Nacimiento de Abu al-Hasan Ali ibn Muhammad al-Mawardi en Basora, 364/974"
  tr: "Ebu el-Hasan Ali ibn Muhammed el-Maverdi'nin Basra'da doğumu, H. 364"
  id: "Kelahiran Abu al-Hasan Ali bin Muhammad al-Mawardi di Basra, 364 H."
summary:
  ar: "وُلد أبو الحسن علي بن محمد بن حبيب الماوردي البصري الشافعي بالبصرة سنة أربع وستين وثلاثمائة، وكان أبوه صانع ماء الورد وبائعه، وإليه نُسب {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وتوفي عن ست وثمانين سنة في ربيع الأول سنة خمسين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  en: "Abu al-Hasan Ali ibn Muhammad ibn Habib al-Mawardi al-Basri al-Shafi'i was born at Basra in 364/974; his father was a maker and seller of rose-water, from which his nisba derives {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. He died aged eighty-six in Rabi' I 450 {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  ur: "ابوالحسن علی بن محمد بن حبیب ماوردی بصری شافعی 364ھ/974ء میں بصرہ میں پیدا ہوئے؛ ان کے والد گلاب کا پانی بنانے اور بیچنے والے تھے، جس سے ان کی نسبت پڑی {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ وہ چھیاسی برس کی عمر میں ربيع الاول 450ھ میں فوت ہوئے {cite:muntazam-ibn-al-jawzi j.8 p.199-200}۔"
  fr: "Abu al-Hasan Ali ibn Muhammad ibn Habib al-Mawardi al-Basri al-Shafi'i naquit à Bassora en 364/974 ; son père fabriquait et vendait de l'eau de rose, d'où dérive sa nisba {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. Il mourut à quatre-vingt-six ans en Rabi' I 450 {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  es: "Abu al-Hasan Ali ibn Muhammad ibn Habib al-Mawardi al-Basri al-Shafi'i nació en Basora en 364/974; su padre era fabricante y vendedor de agua de rosas, de donde deriva su nisba {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. Murió a los ochenta y seis años en Rabi' I 450 {cite:muntazam-ibn-al-jawzi j.8 p.199-200}."
  tr: "Ebu el-Hasan Ali ibn Muhammed ibn Habib el-Mevdi el-Basri el-Şafii, Hicri 364 yılında Basra'da doğdu. Babası gül suyu üreticisi ve satıcısıydı ve adını ondan aldı. Hicri 450 yılında, Rabi' el-Evvel ayında seksen altı yaşında vefat etti."
  id: "Abu al-Hasan Ali ibn Muhammad ibn Habib al-Mawardi al-Basri al-Shafi’i lahir di Basra pada tahun 364 H. Ayahnya adalah seorang pembuat dan penjual air mawar, dan ia diberi nama sesuai nama ayahnya. Ia meninggal pada usia delapan puluh enam tahun pada bulan Rabi’ al-Awwal tahun 450 H."
