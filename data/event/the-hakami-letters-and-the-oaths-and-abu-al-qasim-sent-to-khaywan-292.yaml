id: event/the-hakami-letters-and-the-oaths-and-abu-al-qasim-sent-to-khaywan-292
class: event
kind: other
label:
  ar: "كتب الحكميين إلى الهادي وحلفهم وإرسال أبي القاسم إلى خيوان، ص295"
  en: "The letters of the two Hakamis to al-Hadi, their oaths and Abu al-Qasim's sending to Khaywan, p. 295"
  ur: "دونوں حکمیوں کے ہادی کو خطوط، ان کے حلف اور ابو القاسم کا خیوان بھیجا جانا، ص295"
  es: "Las cartas de los dos Hakamis a al-Hadi, sus juramentos y el envío de Abu al-Qasim a Khaywan, pág. 295"
  fr: "Les lettres des deux Hakamis à al-Hadi, leurs serments et l'envoi par Abu al-Qasim à Khaywan, p. 295"
  tr: "İki hakem, el-Hadi'ye mektup yazdı, yemin etti ve Ebu el-Kasım'ı Hayvan'a gönderdi (s. 295)."
  id: "Kedua arbiter itu menulis surat kepada al-Hadi, bersumpah, dan mengirim Abu al-Qasim ke Khaywan, hlm. 295."
summary:
  ar: "وصلت الهادي بصعدة كتب من إبراهيم بن علي والغطريف الحكميين يسألانه المسير إلى بلدهما ويسلّمان إليه ما في أيديهما، فلم يجبهما لعلمه بقلة وفاء أهل اليمن حتى استحلف ثقاته إياهما، فأرسل الصوارخ في خولان وبعث ابنه أبا القاسم إلى خيوان."
  en: "Letters reached al-Hadi at Sa'da from the two Hakamis Ibrahim ibn Ali and al-Ghatrif asking him to come to their country and offering to hand over what they held; he would not agree, knowing the Yemenis' fickleness, until his trusted men had taken their oaths, and then he sent criers among Khawlan and his son Abu al-Qasim to Khaywan."
  ur: "صعدہ میں ہادی کو دونوں حکمیوں، ابراہیم بن علی اور الغطریف کے خطوط پہنچے جن میں ان سے اپنے ملک آنے کی درخواست تھی اور جو کچھ ان کے ہاتھ میں تھا اسے سونپنے کی پیشکش؛ انہوں نے اہل یمن کی کم وفائی جان کر نہ مانا جب تک ان کے معتمدوں نے ان سے حلف نہ لیا، پھر خولان میں پکارنے والے بھیجے اور بیٹے ابو القاسم کو خیوان روانہ کیا۔"
  es: "Al-Hadi llegó a Sa'da cartas de los dos Hakamis, Ibrahim ibn Ali y al-Ghatrif, pidiéndole que fuera a su país y ofreciéndole entregar lo que poseían; él no accedió, conociendo la inconstancia de los yemeníes, hasta que sus hombres de confianza prestaron juramento, y entonces envió pregoneros entre Khawlan y su hijo Abu al-Qasim a Khaywan."
  fr: "Des lettres parvinrent à al-Hadi à Sa'da de la part des deux Hakamis Ibrahim ibn Ali et al-Ghatrif lui demandant de venir dans leur pays et lui offrant de leur remettre ce qu'ils détenaient; il n'accepta pas, connaissant la versatilité des Yéménites, tant que ses hommes de confiance n'auraient pas prêté serment, puis il envoya des crieurs parmi Khawlan et son fils Abu al-Qasim à Khaywan."
  tr: "Sa'de'de bulunan El-Hadi, İbrahim bin Ali ve El-Ghatrif El-Hakimi'den ülkelerine gelip ellerindeki malları kendisine teslim etmesini isteyen mektuplar aldı. Yemen halkının sadakatsizliğini bildiği için onlara cevap vermedi; ancak güvendiği adamlarına yemin ettirdi. Bunun üzerine El-Savarih'i Havlan'a, oğlu Ebu el-Kasım'ı da Hayvan'a gönderdi."
  id: "Al-Hadi menerima surat di Sa'dah dari Ibrahim bin Ali dan Al-Ghatrif Al-Hakimi yang memintanya untuk datang ke negeri mereka dan menyerahkan apa yang mereka miliki. Dia tidak menanggapi mereka karena dia mengetahui kurangnya kesetiaan rakyat Yaman sampai dia membuat orang-orang kepercayaannya bersumpah setia kepada mereka. Maka dia mengirim Al-Sawarikh ke Khawlan dan mengirim putranya, Abu Al-Qasim, ke Khaywan."
