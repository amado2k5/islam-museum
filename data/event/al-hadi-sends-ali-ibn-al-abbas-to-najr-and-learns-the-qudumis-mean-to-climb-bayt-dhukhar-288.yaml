id: event/al-hadi-sends-ali-ibn-al-abbas-to-najr-and-learns-the-qudumis-mean-to-climb-bayt-dhukhar-288
class: event
kind: other
label:
  ar: "الهادي يبعث علي بن العباس إلى نجر ويبلغه عزم القدميين على الطلوع إلى جبل بيت ذخار، جمادى الآخرة 288هـ"
  en: "Al-Hadi sends Ali ibn al-Abbas to Najr and hears that the Qudumis mean to climb to Bayt Dhukhar, Jumada II 288 AH"
  ur: "ہادی علی بن عباس کو نجر بھیجتے ہیں اور سنتے ہیں کہ قدمی بیت ذخار پر چڑھنا چاہتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "بعث الهادي علي بن العباس العلوي بعسكر إلى موضع من البون يقال له نجر وأقام هو بشبام وكتب إلى ابنه أبي القاسم أن يصير إليه، ثم بلغه يوم الجمعة لإحدى عشرة ليلة ماضية من جمادى الآخرة أن القدميين وأهل المصانع عزموا على الطلوع إلى جبل بيت ذخار، فاستنهض أهل صنعاء وأهل ظهر."
  en: "Al-Hadi sent Ali ibn al-Abbas al-Alawi with a force to a place in al-Bawn called Najr while he stayed at Shibam and wrote to his son Abu al-Qasim to come to him; on a Friday, eleven nights gone of Jumada II, he heard that the Qudumis and the people of al-Masani had agreed to climb the mountain of Bayt Dhukhar, and he called up the men of Sana'a and Zahr."
  ur: "ہادی نے علی بن عباس علوی کو لشکر کے ساتھ البون کی ایک جگہ نجر بھیجا اور خود شبام میں رہے اور بیٹے ابو القاسم کو لکھا کہ ان کے پاس آ جائیں؛ پھر جمادی الآخرہ کی گیارہ راتیں گزرنے پر جمعے کے دن انہیں خبر ملی کہ قدمی اور اہل المصانع بیت ذخار کے پہاڑ پر چڑھنے کا ارادہ کر چکے ہیں تو انہوں نے صنعاء اور ظہر کے لوگوں کو بلایا۔"
