id: event/death-of-abu-talib
class: event
kind: death
label: { ar: "وفاة أبي طالب", en: "Death of Abu Talib", es: "Muerte de Abu Talib", fr: "Mort d'Abou Talib", ur: "ابو طالب کی وفات" }
summary:
  ar: "توفي أبو طالب، عم النبي وحاميه، في رجب من السنة العاشرة من البعثة بعد خروج بني هاشم من الشعب بستة أشهر على ترجيح الكتاب، وقيل في رمضان قبل وفاة خديجة بثلاثة أيام؛ وقد دعاه النبي عند موته إلى قول لا إله إلا الله فأبى وبقي على ملة عبد المطلب."
  en: "Abu Talib, the Prophet's uncle and protector, died in Rajab of the tenth year of the mission, six months after Banu Hashim left the ravine on the book's reckoning, though another view places it in Ramadan three days before Khadija's death; the Prophet asked him at the end to say there is no god but God, and he refused, remaining on the religion of Abd al-Muttalib."
  es: "Abu Talib, tío y protector del Profeta, murió en Rajab del décimo año de la misión, seis meses después de que Banu Hashim abandonara el barranco según el cómputo del libro, aunque otra opinión lo sitúa en Ramadán, tres días antes de la muerte de Khadija; el Profeta le pidió al final que dijera que no hay más dios que Dios, y él se negó, permaneciendo en la religión de Abd al-Muttalib."
  fr: "Abou Talib, l'oncle et protecteur du Prophète, mourut en Rajab de la dixième année de la mission, six mois après que les Banu Hashim eurent quitté le ravin selon le calendrier liturgique, bien qu'une autre version situe sa mort en Ramadan, trois jours avant celle de Khadija; le Prophète lui demanda à la fin de dire « il n'y a de dieu que Dieu », ce qu'il refusa, restant fidèle à la religion d'Abd al-Muttalib."
  ur: "ابو طالب، رسول اللہ کے چچا اور محافظ، مشن کے دسویں سال رجب میں، بنو ہاشم کے حساب کتاب پر کھائی چھوڑنے کے چھ ماہ بعد فوت ہوئے، حالانکہ ایک اور قول خدیجہ کی وفات سے تین دن پہلے رمضان میں بتاتا ہے۔ نبی نے آخر میں اس سے کہا کہ خدا کے سوا کوئی معبود نہیں ہے، اور اس نے عبد المطلب کے مذہب پر قائم رہنے سے انکار کر دیا۔"
