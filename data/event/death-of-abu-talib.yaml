label: { ar: "وفاة أبي طالب", en: "Death of Abu Talib" }
summary:
  ar: "توفي أبو طالب، عم النبي وحاميه، في رجب من السنة العاشرة من البعثة بعد خروج بني هاشم من الشعب بستة أشهر على ترجيح الكتاب، وقيل في رمضان قبل وفاة خديجة بثلاثة أيام؛ وقد دعاه النبي عند موته إلى قول لا إله إلا الله فأبى وبقي على ملة عبد المطلب."
  en: "Abu Talib, the Prophet's uncle and protector, died in Rajab of the tenth year of the mission, six months after Banu Hashim left the ravine on the book's reckoning, though another view places it in Ramadan three days before Khadija's death; the Prophet asked him at the end to say there is no god but God, and he refused, remaining on the religion of Abd al-Muttalib."
