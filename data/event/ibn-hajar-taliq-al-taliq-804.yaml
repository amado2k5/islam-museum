id: event/ibn-hajar-taliq-al-taliq-804
class: event
kind: publication
label:
  ar: "ابن حجر يتم مسوّدة «تعليق التعليق»، ٨٠٤هـ/١٤٠١م"
  en: "Ibn Hajar completes the draft of Ta'liq al-Ta'liq, 804/1401"
  ur: "ابن حجر کی کتاب «تعلیق التعلیق» کی مسودہ تکمیل، 804ھ/1401ء"
summary:
  ar: "أكمل ابن حجر، وفي مطلع ثلاثيناته، مسوّدة «تعليق التعليق» في أسانيد صحيح البخاري سنة ٨٠٤هـ/١٤٠١-١٤٠٢م ونشرها بعد ثلاث سنين، فثبّت بها مكانته العلمية؛ وهو أول ما اشتهر من أعماله على البخاري، وكانت سنتا ٧٩٥هـ قد شهدتا أول مصنفاته المنشورة، رسالة في العروض وتقريظًا لكتاب الدماميني {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "In his early thirties Ibn Hajar completed in 804/1401-2 the draft of Ta'liq al-Ta'liq, a work on the isnads of al-Bukhari's Sahih, publishing it three years later; it securely established his scholarly reputation and was the first of his works on al-Bukhari to win fame. His earliest recorded publications — a paper on prosody and a laudatory notice for al-Damamini's book — had appeared in 795 {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "تیس کے عشرے کے آغاز میں ابن حجر نے 804ھ/1401-02ء میں «تعلیق التعلیق» کی مسودہ مکمل کی، جو صحیح بخاری کے اسانید پر کتاب تھی، اور تین برس بعد شائع کی؛ اسی کتاب سے ان کی علمی شہرت مستحکم ہوئی اور بخاری پر ان کی پہلی مشہور تصنیف بنی۔ ان کی اولین شائع شدہ تصانیف — عروض پر ایک رسالہ اور دمامینی کی کتاب کی تحسین — 795ھ میں سامنے آئی تھیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
