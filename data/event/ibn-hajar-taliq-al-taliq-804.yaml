label:
  ar: "ابن حجر يتم مسوّدة «تعليق التعليق»، ٨٠٤هـ/١٤٠١م"
  en: "Ibn Hajar completes the draft of Ta'liq al-Ta'liq, 804/1401"
  ur: "ابن حجر کی کتاب «تعلیق التعلیق» کی مسودہ تکمیل، 804ھ/1401ء"
  es: "Ibn Hajar completa el borrador de Ta'liq al-Ta'liq, 804/1"
  fr: "Ibn Hajar achève le brouillon du Ta'liq al-Ta'liq, 804/1"
  tr: "İbn Hacer, \"Ta'liq al-Ta'liq\" (Şerh Üzerine Şerh) taslağını tamamladı, 804 H./1401 MS"
  id: "Ibnu Hajar menyelesaikan draf “Ta’liq al-Ta’liq” (Tafsiran Atas Komentar), 804 H/1401 M."
summary:
  ar: "أكمل ابن حجر، وفي مطلع ثلاثيناته، مسوّدة «تعليق التعليق» في أسانيد صحيح البخاري سنة ٨٠٤هـ/١٤٠١-١٤٠٢م ونشرها بعد ثلاث سنين، فثبّت بها مكانته العلمية؛ وهو أول ما اشتهر من أعماله على البخاري، وكانت سنتا ٧٩٥هـ قد شهدتا أول مصنفاته المنشورة، رسالة في العروض وتقريظًا لكتاب الدماميني {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "In his early thirties Ibn Hajar completed in 804/1401-2 the draft of Ta'liq al-Ta'liq, a work on the isnads of al-Bukhari's Sahih, publishing it three years later; it securely established his scholarly reputation and was the first of his works on al-Bukhari to win fame. His earliest recorded publications — a paper on prosody and a laudatory notice for al-Damamini's book — had appeared in 795 {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "تیس کے عشرے کے آغاز میں ابن حجر نے 804ھ/1401-02ء میں «تعلیق التعلیق» کی مسودہ مکمل کی، جو صحیح بخاری کے اسانید پر کتاب تھی، اور تین برس بعد شائع کی؛ اسی کتاب سے ان کی علمی شہرت مستحکم ہوئی اور بخاری پر ان کی پہلی مشہور تصنیف بنی۔ ان کی اولین شائع شدہ تصانیف — عروض پر ایک رسالہ اور دمامینی کی کتاب کی تحسین — 795ھ میں سامنے آئی تھیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
  es: "A principios de sus treinta años, Ibn Hajar completó en 804/1401-2 el borrador de Ta'liq al-Ta'liq, una obra sobre los isnads del Sahih de al-Bukhari, publicándola tres años después; esta obra consolidó su reputación académica y fue la primera de sus obras sobre al-Bukhari en alcanzar renombre. Sus primeras publicaciones registradas —un artículo sobre prosodia y una reseña elogiosa del libro de al-Damamini— habían aparecido en 795 {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  fr: "Au début de la trentaine, Ibn Hajar acheva en 804/1401-1402 la première version de *Ta'liq al-Ta'liq*, un ouvrage sur les isnads du *Sahih* d'al-Bukhari, qu'il publia trois ans plus tard. Ce livre consolida sa réputation d'érudit et fut le premier de ses ouvrages sur al-Bukhari à acquérir une grande renommée. Ses premières publications connues – un article sur la prosodie et une critique élogieuse du livre d'al-Damamini – parurent en 795 (voir *Encyclopaedia of Islam*, vol. 3, p. 810)."
  tr: "İbn Hacer, otuzlu yaşlarının başlarında, Hicri 804/Miladi 1401-1402 yılında Sahih el-Buhari'nin rivayet zincirleri üzerine yazdığı \"Ta'liq al-Ta'liq\" adlı eserinin taslağını tamamladı ve üç yıl sonra yayımlayarak ilim dünyasındaki konumunu sağlamlaştırdı. Bu, Buhari üzerine yazdığı ve ünlenen ilk eseri oldu. Hicri 795 yılında ise ilk yayımlanmış eserleri, vezin üzerine bir risale ve el-Damamini'nin kitabına bir övgü yazısı yayımlandı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}"
  id: "Di usia awal tiga puluhan, Ibnu Hajar menyelesaikan draf “Ta’liq al-Ta’liq” tentang sanad periwayatan Sahih al-Bukhari pada tahun 804 H/1401-1402 M dan menerbitkannya tiga tahun kemudian, sehingga memantapkan kedudukannya sebagai seorang cendekiawan. Karya ini merupakan karya pertamanya tentang al-Bukhari yang menjadi terkenal. Tahun 795 H menjadi tahun terbitnya karya-karya pertamanya, sebuah risalah tentang prosodi dan dukungan terhadap buku al-Damamini {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
