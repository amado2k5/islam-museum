label: { en: "The skirmish of al-Khandama", ar: "وقعة الخندمة" }
summary:
  en: "A sharp clash on the heights of al-Khandama where armed resisters from Quraysh and Banu Bakr under Safwan ibn Umayya, Ikrima ibn Abi Jahl, and Suhayl ibn Amr attempted to bar Khalid ibn al-Walid's entry; the resistance was quickly routed, leaving twelve to thirteen Meccan fighters dead, while Kurz ibn Jabir, Khunays ibn Khalid, and Salama ibn al-Mayla' fell on the Muslim side."
  ar: "مناوشة بالسلاح على جبل الخندمة تجمع فيها مقاتلون من قريش وبني بكر بقيادة صفوان وعكرمة وسهيل لصد مجنبة خالد بن الوليد؛ انهزم المقاتلون سريعاً بعد مقتل 12 أو 13 رجلاً منهم، واستشهد من المسلمين كرز بن جابر وخنيس بن خالد وسلمة بن الميلاء."
