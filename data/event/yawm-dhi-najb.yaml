id: event/yawm-dhi-najb
class: event
kind: battle
label: { ar: "يوم ذي نجب", en: "The Day of Dhi Najb", es: "El día de Dhi Najb", fr: "Le jour de Dhi Najb", ur: "یوم ذی نجب", tr: "Zilhicce Günü", id: "Hari Dhu Najb" }
summary:
  ar: "يوم ذي نجب، وقع بعد يوم جبلة بسنة؛ لما أصابت بنو عامر من تميم يوم جبلة رجوا استئصالهم فكاتبوا حسان بن كبشة ملكاً من ملوك كندة فأقبل معهم بصنائعه يغزو بني حنظلة من تميم، فتحولت بنو مالك خلف بني يربوع فصارت يربوع تلي الملك، فلما كان وجه الصبح اقتتلوا وشهدت بنو مالك القتال معهم فضرب جشيش بن نمران الرياحي الملك ابن كبشة على رأسه فقتله، وقتل عمرو بن الأحوص بن جعفر رئيس عامر، وانهزمت عامر وصنائع ابن كبشة، وهلك الأحوص أسفاً على ابنه، وقال جرير في الإسلام يذكر اليوم «بذي نجب ذدنا وواكل مالك أخاً لم يكن عند الطعان بواكل» {cite:kamil-ibn-al-athir p. 455}."
  en: "The day of Dhi Najb, a year after Jabala: seeking to finish Tamim, Banu Amir brought in the Kindite king Hassan ibn Kabsha with his retainers against Banu Hanzala — but Yarbu' stood the brunt, Jushaysh ibn Numran brained the king himself, Amir's chief Amr ibn al-Ahwas fell, and Jarir still boasted of the day under Islam {cite:kamil-ibn-al-athir p. 455}."
  es: "El día de Dhi Najb, un año después de Jabala: buscando acabar con Tamim, Banu Amir trajo al rey kindita Hassan ibn Kabsha con sus vasallos contra Banu Hanzala, pero Yarbu' resistió el golpe, Jushaysh ibn Numran golpeó al rey en la cabeza, el jefe de Amir, Amr ibn al-Ahwas, cayó, y Jarir aún se jactaba del día bajo el Islam {cite:kamil-ibn-al-athir p. 455}."
  fr: "Le jour de Dhi Najb, un an après Jabala: cherchant à anéantir Tamim, les Banu Amir firent venir le roi Kindite Hassan ibn Kabsha avec ses hommes contre les Banu Hanzala — mais Yarbu' en subit les conséquences, Jushaysh ibn Numran assomma le roi lui-même, le chef d'Amir, Amr ibn al-Ahwas, tomba, et Jarir se vantait encore de cette journée sous l'Islam {cite:kamil-ibn-al-athir p. 455}."
  ur: "جبلہ کے ایک سال بعد ذی نجب کا دن: تمیم کو ختم کرنے کی کوشش میں، بنو عامر نے کندیت کے بادشاہ حسن بن کبشہ کو اپنے محافظوں کے ساتھ بنو حنظلہ کے خلاف لایا - لیکن یثرب کا مقابلہ ہوا، جوشیش ابن نمران نے خود بادشاہ کا دماغ بنایا، امیر کے سردار عمرو ابن الجواس اور بواسطہ کے دن بھی اسلام کے زیر اثر رہے۔ {حوالہ: کامل ابن الاثیر ص۔ 455}"
  tr: "Neceb Günü, Cebelah Günü'nden bir yıl sonra gerçekleşti. Tamim'in Beni Emir kabilesi Cebelah Günü'nde yenilgiye uğrayınca, tamamen yok olmayı umdular. Bu yüzden Kindah krallarının kralı Hasan ibn Kabşa'ya mektup yazdılar ve o da askerleriyle birlikte Tamim'in Beni Hanzalah kabilesine baskın yapmak için geldi. Beni Malik kabilesi Beni Yarbu'nun arkasına geçti, bu yüzden Yarbu' kabilesi kralın peşinden geldi. Sabah olunca savaştılar ve Beni Malik kabilesi de savaşı onlarla birlikte izledi. Caşiş ibn Nimran el-Riyahi, kral İbn Kabşa'nın başına vurarak onu öldürdü. Emir'in başı Amr ibn el-Ahvas ibn Cafer öldürüldü ve Emir ile İbn Kabşa'nın askerleri yenilgiye uğradı. El-Ahvas, oğlunun acısından öldü. Jarir, İslam'da o günü anarak şöyle demiştir: \"Zhi Najab'da püskürttük ve Malik, mızraklar saplandığında ihanet edecek biri olmayan bir kardeşimize ihanet etti.\" {cite:kamil-ibn-al-athir s. 455}."
  id: "Hari Dhi Najab terjadi setahun setelah Hari Jabalah. Ketika Bani Amir dari Tamim mengalami kekalahan pada Hari Jabalah, mereka berharap untuk dimusnahkan. Maka mereka menulis surat kepada Hassan ibn Kabshah, seorang raja dari raja-raja Kindah, dan ia datang bersama mereka dengan pasukannya untuk menyerang Bani Hanzalah dari Tamim. Bani Malik bergerak di belakang Bani Yarbu’, sehingga Yarbu’ mengejar raja. Ketika pagi tiba, mereka bertempur, dan Bani Malik menyaksikan pertempuran itu bersama mereka. Jashish ibn Nimran al-Riyahi memukul kepala raja, Ibn Kabshah, dan membunuhnya. Amr ibn al-Ahwas ibn Ja’far, kepala Amir, terbunuh, dan Amir serta pasukan Ibn Kabshah dikalahkan. Al-Ahwas meninggal karena kesedihan atas kematian putranya. Jarir berkata dalam Islam, menyebutkan hari itu: “Di Dhi Najab kami memukul mundur dan Malik mengkhianati seorang saudara yang bukanlah orang yang akan berkhianat ketika tombak ditancapkan.” {kutip:kamil-ibn-al-athir hlm. 455}."
