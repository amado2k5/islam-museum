label: { ar: "هزيمة رافع بن هرثمة وقتله", en: "The defeat and killing of Rafi' ibn Harthama" }
summary:
  ar: "في سنة ثلاث وثمانين ومائتين خرج عمرو بن الليث من نيسابور فخالفه إليها رافع بن هرثمة فدخلها وخُطب فيها لمحمد بن زيد الطالبي ولأبيه، فقيل اللهم أصلح الداعي إلى الحق، ثم تواقعا فهُزم رافع ثم جاء الخبر بقتله، وفي محرم سنة أربع وثمانين قُدِّم برأسه إلى المعتضد فنُصب بالجانب الشرقي إلى الظهر ثم حُوّل إلى الجانب الغربي إلى الليل {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  en: "In 283 Amr ibn al-Layth left Nishapur; Rafi' ibn Harthama entered it behind him and had the khutba said for the Alid Muhammad ibn Zayd, then the two met in battle, Rafi' was routed and killed, and his head was displayed in Baghdad — east side till noon, west side till nightfall {cite:muntazam-ibn-al-jawzi p. 162, 171}."
