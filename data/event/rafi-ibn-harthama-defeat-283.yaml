label: { ar: "هزيمة رافع بن هرثمة وقتله", en: "The defeat and killing of Rafi' ibn Harthama", es: "La derrota y muerte de Rafi' ibn Harthama", fr: "La défaite et la mort de Rafi' ibn Harthama", ur: "رافع بن حارثمہ کی شکست اور قتل" }
summary:
  ar: "في سنة ثلاث وثمانين ومائتين خرج عمرو بن الليث من نيسابور فخالفه إليها رافع بن هرثمة فدخلها وخُطب فيها لمحمد بن زيد الطالبي ولأبيه، فقيل اللهم أصلح الداعي إلى الحق، ثم تواقعا فهُزم رافع ثم جاء الخبر بقتله، وفي محرم سنة أربع وثمانين قُدِّم برأسه إلى المعتضد فنُصب بالجانب الشرقي إلى الظهر ثم حُوّل إلى الجانب الغربي إلى الليل {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  en: "In 283 Amr ibn al-Layth left Nishapur; Rafi' ibn Harthama entered it behind him and had the khutba said for the Alid Muhammad ibn Zayd, then the two met in battle, Rafi' was routed and killed, and his head was displayed in Baghdad — east side till noon, west side till nightfall {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  es: "En 283, Amr ibn al-Layth salió de Nishapur; Rafi' ibn Harthama entró tras él e hizo que se pronunciara el sermón en nombre del Alid Muhammad ibn Zayd, luego los dos se enfrentaron en batalla, Rafi' fue derrotado y muerto, y su cabeza fue exhibida en Bagdad, en el lado este hasta el mediodía y en el lado oeste hasta el anochecer {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  fr: "En 283, Amr ibn al-Layth quitta Nishapur; Rafi' ibn Harthama y entra derrière lui et fit dire le khutba pour l'Alid Muhammad ibn Zayd, puis les deux se rencontrèrent au combat, Rafi' fut mis en déroute et tué, et sa tête fut exposée à Bagdad — côté est jusqu'à midi, côté ouest jusqu'à la tombée de la nuit {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  ur: "283 میں عمرو بن لیث نیشاپور سے نکلا۔ رافع بن حارثمہ اس کے پیچھے پیچھے داخل ہوا اور علید محمد بن زید کے لیے خطبہ کہا، پھر دونوں جنگ میں ملے، رافع کو مارا گیا اور مارا گیا، اور اس کا سر بغداد میں دکھایا گیا - مشرق کی طرف دوپہر تک، مغرب کی طرف شام تک۔ 162، 171}۔"
