id: event/muhammad-ibn-ubaydallah-leaves-al-hajar-for-al-hisn-and-the-strife-of-banu-al-harith-288
class: event
kind: other
label:
  ar: "محمد بن عبيد الله ينتقل من الهجر إلى الحصن وفتنة بني الحارث، سنة 288هـ"
  en: "Muhammad ibn Ubaydallah moves from al-Hajar to al-Hisn and the strife of Banu al-Harith, 288 AH"
  ur: "محمد بن عبید اللہ ہجر سے حصن کی طرف جاتے ہیں اور بنو حارث کا فتنہ، 288ھ"
  es: "Muhammad ibn Ubaydallah se traslada de al-Hajar a al-Hisn y la lucha de Banu al-Harith, 288 AH"
  fr: "Muhammad ibn Ubaydallah quitte al-Hajar pour al-Hisn et la lutte des Banu al-Harith, 288 AH"
  tr: "Muhammed ibn Ubeyd Allah, Hicri 288 yılında Hacer'den Hisn'e ve Beni El-Harith isyanına doğru hareket etti."
  id: "Muhammad ibn Ubayd Allah pindah dari Al-Hajar ke Al-Hisn dan pemberontakan Banu Al-Harith, pada tahun 288 H."
summary:
  ar: "خرج محمد بن عبيد الله من الهجر إلى الحصن ورفض دعوة ابن بسطام إلى ميناس، وأرسل إلى ربيع بن أبي الركود فصيّر إليه حرمه وصبيانه، وكتب إلى الهادي فأمره بالبقاء في موضعه، ثم أغار بنو الحارث بعد خروجه وأخذوا أموال الضعفاء وجباية البلد، وأغارت عليه بادية شاكر بجعل من ابن بسطام فثبت وأقام أهل الحصن معه، فاعتذروا، وأقام عشرة أشهر ووقعت الفتنة بين بني الحارث وبين يام وشاكر."
  en: "Muhammad ibn Ubaydallah went from al-Hajar to al-Hisn and refused Ibn Bustam's call to Minas; he sent to Rabi' ibn Abi al-Rukud who brought his womenfolk and children to al-Hisn, and he wrote to al-Hadi, who told him to stay where he was; Banu al-Harith then raided after his leaving and took the property of the weak and the tax of the town, and the Bedouin of Shakir, paid by Ibn Bustam, raided him; he held, the people of al-Hisn stood with him, the Bedouin excused themselves, he stayed ten months, and strife fell between Banu al-Harith and Yam and Shakir."
  ur: "محمد بن عبید اللہ ہجر سے حصن کی طرف نکلے اور ابن بسطام کی میناس چلنے کی دعوت رد کی؛ انہوں نے ربیع بن ابی الرکود کو بلا بھیجا جو ان کی خواتین اور بچوں کو حصن لے آیا، اور انہوں نے ہادی کو لکھا تو ہادی نے انہیں اپنی جگہ ٹھہرے رہنے کا حکم دیا؛ پھر ان کے نکلنے کے بعد بنو حارث نے حملے کیے اور کمزوروں کا مال اور شہر کی وصولی لے لی، اور ابن بسطام کے مال دینے پر شاکر کے بدویوں نے ان پر حملہ کیا مگر وہ ڈٹے رہے اور حصن کے لوگ ان کے ساتھ کھڑے ہوئے، بدویوں نے معذرت کی، وہ دس مہینے رہے اور بنو حارث اور یام و شاکر کے درمیان فتنہ پڑ گیا۔"
  es: "Muhammad ibn Ubaydallah fue de al-Hajar a al-Hisn y rechazó la invitación de Ibn Bustam a Minas; envió a Rabi' ibn Abi al-Rukud, quien llevó a sus mujeres y niños a al-Hisn, y escribió a al-Hadi, quien le dijo que se quedara donde estaba; luego, los Banu al-Harith saquearon después de su partida y tomaron las propiedades de los débiles y los impuestos de la ciudad, y los beduinos de Shakir, pagados por Ibn Bustam, lo saquearon; él resistió, la gente de al-Hisn lo apoyó, los beduinos se excusaron, él permaneció diez meses, y surgió un conflicto entre los Banu al-Harith y Yam y Shakir."
  fr: "Muhammad ibn Ubaydallah quitta al-Hajar pour al-Hisn et refusa l'appel d'Ibn Bustam à Minas; il envoya des messagers à Rabi' ibn Abi al-Rukud qui amena ses femmes et ses enfants à al-Hisn, et il écrivit à al-Hadi, qui lui conseilla de rester où il était; les Banu al-Harith lancèrent alors un raid après son départ et s'emparèrent des biens des faibles et des impôts de la ville, et les Bédouins de Shakir, payés par Ibn Bustam, l'attaquèrent à leur tour; il tint bon, les habitants d'al-Hisn le soutinrent, les Bédouins se retirèrent, il resta dix mois, et des conflits éclatèrent entre les Banu al-Harith et Yam et Shakir."
  tr: "Muhammed ibn Ubeyd Allah, Hacer'den Hisn'e gitti ve İbn Bustam'ın Minas'a davetini reddetti. Rabi' ibn Abi el-Rakoud'a haber gönderdi ve o da ailesini ve çocuklarını ona emanet etti. El-Hadi'ye yazdı ve o da yerinde kalmasını emretti. Ayrıldıktan sonra Beni el-Harith baskın düzenledi ve zayıfların parasını ve şehrin vergisini aldı. Şakir'in Badya kabilesi, İbn Bustam'ın yardımıyla ona baskın düzenledi, ancak o direndi ve Hisn halkı onunla birlikte kaldı. Özür dilediler ve o on ay kaldı; bu sırada Beni el-Harith ile Yam ve Şakir arasında çekişme çıktı."
  id: "Muhammad ibn Ubayd Allah meninggalkan al-Hajar menuju al-Hisn dan menolak undangan Ibn Bustam ke Minas. Ia mengirim utusan kepada Rabi’ ibn Abi al-Rakoud, yang mempercayakan keluarga dan anak-anaknya kepadanya. Ia menulis surat kepada al-Hadi, yang memerintahkannya untuk tetap tinggal di tempatnya. Kemudian Banu al-Harith menyerang setelah kepergiannya dan mengambil uang orang-orang lemah dan pajak kota. Suku Badia Shakir menyerangnya dengan bantuan Ibn Bustam, tetapi ia tetap teguh, dan penduduk al-Hisn tetap bersamanya. Mereka meminta maaf, dan ia tinggal selama sepuluh bulan, dan perselisihan pecah antara Banu al-Harith dan Yam serta Shakir."
