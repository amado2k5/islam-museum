label: { ar: "حصار أدرنة", en: "Siege of Adrianople", es: "Sitio de Adrianópolis", fr: "Siège d'Andrinople", ur: "ایڈریانوپل کا محاصرہ", tr: "Edirne Kuşatması", id: "Pengepungan Edirne" }
summary:
  ar: "حاصر البلغاريون أدرنة في حرب البلقان الأولى 1912-1913م فسقطت المدينة العثمانية تحت الاحتلال البلغاري سنة 1913م، ودمّر الحصار مئذنة جامع دار الحديث {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}."
  en: "The Bulgarians besieged Edirne in the First Balkan War of 1912-13 and the Ottoman city fell under Bulgarian occupation in 1913; the siege destroyed the minaret of the Dar al-Hadith mosque {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}."
  ur: "پہلی بلقان جنگ 1912-13ء میں بلغاریوں نے ادرنہ کا محاصرہ کیا اور 1913ء میں عثمانی شہر بلغاری قبضے میں آ گیا؛ محاصرے نے جامع دار الحدیث کا مینار تباہ کیا {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}۔"
  es: "Los búlgaros sitiaron Edirne en la Primera Guerra de los Balcanes de 1912-13 y la ciudad otomana cayó bajo ocupación búlgara en 1913; el asedio destruyó el minarete de la mezquita Dar al-Hadith {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}."
  fr: "Les Bulgares assiégèrent Edirne lors de la Première Guerre balkanique de 1912-13 et la ville ottomane tomba sous occupation bulgare en 1913; le siège détruisit le minaret de la mosquée Dar al-Hadith {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}."
  tr: "Bulgarlar, 1912-1913 yılları arasında gerçekleşen Birinci Balkan Savaşı'nda Edirne'yi kuşattı ve Osmanlı kenti 1913 yılında Bulgar işgaline girdi. Kuşatma sırasında Darü'l-Hadis Camii'nin minaresi yıkıldı. {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}"
  id: "Bulgaria mengepung Edirne dalam Perang Balkan Pertama tahun 1912-1913 M, dan kota Ottoman itu jatuh di bawah pendudukan Bulgaria pada tahun 1913 M. Pengepungan tersebut menghancurkan menara Masjid Dar al-Hadith {cite:encyclopaedia-of-islam-2 vol. 2 pp. 710, 712}."
