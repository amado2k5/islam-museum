summary:
  ar: "وقعت الوحشة بين نور الدين وصلاح الدين باطنًا وستراها عن الناس، وسببها أن صلاح الدين عجّل في العود إلى مصر بعد ملكه أيلة والرحيل عن الشام من غير إذن، وتمنّع عن الإعانة بمال مصر، حتى همّ نور الدين بقصد مصر ونزعها من يده {cite:kamil-ibn-al-athir p. 35}."
  en: "A private estrangement opened between Nūr al-Dīn and Saladin, concealed from the public: Saladin had hurried back to Egypt after taking Ayla without leave, and kept back Egypt's money from him — until Nūr al-Dīn thought of marching on Egypt to take it from his hand {cite:kamil-ibn-al-athir p. 35}."
  es: "Se produjo un distanciamiento privado entre Nūr al-Dīn y Saladino, oculto al público: Saladino se había apresurado a regresar a Egipto después de tomar Ayla sin permiso, y le había retenido el dinero de Egipto, hasta que Nūr al-Dīn pensó en marchar sobre Egipto para arrebatárselo {cite:kamil-ibn-al-athir p. 35}."
  fr: "Une brouille privée s'est ouverte entre Nūr al-Dīn et Saladin, cachée au public: Saladin s'était précipité en Égypte après avoir emmené Ayla sans permission, et lui avait retenu l'argent de l'Égypte — jusqu'à ce que Nūr al-Dīn pense à marcher sur l'Égypte pour le lui prendre {cite:kamil-ibn-al-athir p. 35}."
  ur: "نورالدین اور صلاح الدین کے درمیان ایک پرائیویٹ رنجش کھل گئی، جو عوام سے پوشیدہ تھی: صلاح الدین عائلہ کو بغیر چھٹی کے لے جانے کے بعد جلدی سے واپس مصر چلا گیا تھا، اور اس سے مصر کی رقم واپس لے لی تھی - یہاں تک کہ نورالدین نے اسے اپنے ہاتھ سے لینے کے لیے مصر کی طرف کوچ کرنے کا سوچا تھا۔ 35}۔"
  tr: "Nur ed-Din ile Selahaddin arasındaki soğukluk gizlice gerçekleşti ve halk tarafından görülecekti. Bunun sebebi, Selahaddin'in Ayla'yı fethettikten ve Suriye'den izinsiz ayrıldıktan sonra Mısır'a dönmekte acele etmesi ve Nur ed-Din Mısır'a saldırmayı ve onu elinden almayı planlayana kadar Mısır parasıyla yardım etmeyi reddetmesiydi. {Kaynak: Kamil İbn el-Atir s. 35}"
  id: "Keretakan hubungan antara Nur ad-Din dan Saladin terjadi secara diam-diam dan akan terlihat oleh orang banyak. Alasannya adalah Saladin bergegas kembali ke Mesir setelah penaklukannya atas Ayla dan kepergiannya dari Suriah tanpa izin, dan ia menolak memberikan bantuan berupa uang Mesir, sampai Nur ad-Din bermaksud menyerang Mesir dan merebutnya dari tangannya {cite:kamil-ibn-al-athir p. 35}."
