summary:
  ar: "المناظرة الأشهر طبعاً وتفريغاً في التاريخ الحديث: وقف [[person/ahmed-deedat|أحمد ديدات]] الداعية السني الجنوب أفريقي أمام القس التلفزيوني الأمريكي [[person/jimmy-swaggart|جيمي سواغرت]] في جامعة ولاية لويزيانا بباتون روج سنة 1986 في موضوع «هل الكتاب المقدس كلمة الله؟». طُبعت المناظرة كاملة وفرّغت ووزّعت في أنحاء العالم، وصارت نصاً مرجعياً في أدب المناظرات الحديثة: ديدات يدفع بأن الكتاب المقدس المتداول لا يثبت له سند إلهي متصل كالقرآن، وسواغرت يدافع عن وحي العهدين. ويبقى تسجيلها وترجماتها من أوسع نصوص المناظرة انتشاراً. {cite:answering-islam-debates-index}"
  en: "The most printed and transcribed debate of the modern era: the South African Sunni da'wah pioneer [[person/ahmed-deedat|Ahmed Deedat]] faced the American televangelist [[person/jimmy-swaggart|Jimmy Swaggart]] at Louisiana State University, Baton Rouge, in 1986, on 'Is the Bible the Word of God?'. The debate was printed in full, transcribed and distributed worldwide, becoming a reference text of modern disputation literature — Deedat pressing that the received Bible lacks a continuous divine chain such as the Qur'an's, Swaggart defending the inspiration of the two Testaments. Its recording and translations remain among the most widely circulated debate texts. {cite:answering-islam-debates-index}"
  es: "El debate más impreso y transcrito de la era moderna: el pionero sunita de la da'wah, Ahmed Deedat, se enfrentó al teleevangelista estadounidense Jimmy Swaggart en la Universidad Estatal de Luisiana, Baton Rouge, en 1986, sobre \"¿Es la Biblia la Palabra de Dios?\". El debate se imprimió íntegramente, se transcribió y se distribuyó por todo el mundo, convirtiéndose en un texto de referencia de la literatura moderna sobre debates. Deedat insistió en que la Biblia recibida carece de una cadena divina continua como la del Corán, mientras que Swaggart defendió la inspiración de ambos Testamentos. Su grabación y traducción siguen estando entre los textos de debate más difundidos. {cite:answering-islam-debates-index}"
  fr: "Le débat le plus imprimé et retranscrit de l'ère moderne: Ahmed Deedat, pionnier sunnite de la da'wah en Afrique du Sud, a affronté Jimmy Swaggart, télévangéliste américain, à l'Université d'État de Louisiane à Baton Rouge en 1986, sur le thème « La Bible est-elle la Parole de Dieu ? ». Le débat a été intégralement publié, retranscrit et diffusé dans le monde entier, devenant un texte de référence de la littérature moderne sur la controverse religieuse. Deedat y défendait l'absence d'une chaîne de transmission divine continue, contrairement au Coran, tandis que Swaggart soutenait l'inspiration des deux Testaments. L'enregistrement et les traductions de ce débat figurent parmi les textes les plus diffusés."
  ur: "جدید دور کی سب سے زیادہ چھپی ہوئی اور نقل شدہ بحث: جنوبی افریقی سنی دعوتی علمبردار [[person/ahmed-deedat|احمد دیدات]] کا سامنا امریکی ٹیلی ویژن کے ماہر [[person/jimmy-swaggart|Jimmy Swaggart]] سے ہوا جو کہ Louisiana State University, Baton Rouges, the Words of the B1'6 میں ہے۔ یہ بحث پوری دنیا میں چھپی، نقل کی گئی اور دنیا بھر میں تقسیم کی گئی، جو کہ جدید تنازعات کے ادب کا ایک حوالہ متن بن گیا — دیدات نے دباؤ ڈالا کہ موصول ہونے والی بائبل میں ایک مسلسل الہی سلسلہ کا فقدان ہے جیسا کہ قرآن، سویگرٹ دو عہد ناموں کے الہام کا دفاع کرتا ہے۔ اس کی ریکارڈنگ اور ترجمے سب سے زیادہ زیر بحث مباحثے میں شامل ہیں۔ {حوالہ:جواب دینا-اسلام-بحثات-انڈیکس}"
  tr: "Modern tarihin hem içerik hem de yazıya dökülme açısından en ünlü tartışması: Güney Afrikalı Sünni vaiz Ahmed Deedat, 1986'da Baton Rouge'daki Louisiana Eyalet Üniversitesi'nde Amerikalı televizyon vaizi Jimmy Swaggart'ın karşısına \"İncil Tanrı'nın Sözü müdür?\" konusu üzerine çıktı. Tartışmanın tamamı basıldı, yazıya döküldü ve dünya çapında dağıtıldı; modern tartışma literatüründe temel bir metin haline geldi. Deedat, mevcut İncil'in Kur'an gibi kesintisiz bir ilahi aktarım zincirinden yoksun olduğunu savunurken, Swaggart hem Eski hem de Yeni Ahit'in ilahi ilhamla yazıldığını savundu. Tartışmanın kayıtları ve çevirileri, tartışmanın en yaygın olarak dolaşan metinleri arasında yer almaktadır. {cite:answering-islam-debates-index}"
  id: "Debat paling terkenal, baik dari segi isi maupun transkripsi, dalam sejarah modern: Pendakwah Sunni Afrika Selatan Ahmed Deedat berdiri di hadapan penginjil televisi Amerika Jimmy Swaggart di Universitas Negeri Louisiana di Baton Rouge pada tahun 1986 dengan topik, \"Apakah Alkitab Firman Tuhan?\" Seluruh debat tersebut dicetak, ditranskripsikan, dan didistribusikan ke seluruh dunia, menjadi teks penting dalam literatur debat modern. Deedat berpendapat bahwa Alkitab yang ada saat ini tidak memiliki rantai transmisi ilahi yang berkelanjutan seperti Al-Quran, sementara Swaggart membela inspirasi ilahi dari Perjanjian Lama dan Perjanjian Baru. Rekaman dan terjemahan debat tersebut tetap menjadi salah satu teks debat yang paling banyak beredar. {cite:answering-islam-debates-index}"
