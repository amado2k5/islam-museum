label: { ar: "مناظرة أحمد ديدات وجيمي سواغرت", en: "Deedat–Swaggart Debate (1986)", es: "Debate entre Deedat y Swaggart (1986)" }
summary:
  ar: "المناظرة الأشهر طبعاً وتفريغاً في التاريخ الحديث: وقف [[person/ahmed-deedat|أحمد ديدات]] الداعية السني الجنوب أفريقي أمام القس التلفزيوني الأمريكي [[person/jimmy-swaggart|جيمي سواغرت]] في جامعة ولاية لويزيانا بباتون روج سنة 1986 في موضوع «هل الكتاب المقدس كلمة الله؟». طُبعت المناظرة كاملة وفرّغت ووزّعت في أنحاء العالم، وصارت نصاً مرجعياً في أدب المناظرات الحديثة: ديدات يدفع بأن الكتاب المقدس المتداول لا يثبت له سند إلهي متصل كالقرآن، وسواغرت يدافع عن وحي العهدين. ويبقى تسجيلها وترجماتها من أوسع نصوص المناظرة انتشاراً. {cite:answering-islam-debates-index}"
  en: "The most printed and transcribed debate of the modern era: the South African Sunni da'wah pioneer [[person/ahmed-deedat|Ahmed Deedat]] faced the American televangelist [[person/jimmy-swaggart|Jimmy Swaggart]] at Louisiana State University, Baton Rouge, in 1986, on 'Is the Bible the Word of God?'. The debate was printed in full, transcribed and distributed worldwide, becoming a reference text of modern disputation literature — Deedat pressing that the received Bible lacks a continuous divine chain such as the Qur'an's, Swaggart defending the inspiration of the two Testaments. Its recording and translations remain among the most widely circulated debate texts. {cite:answering-islam-debates-index}"
  es: "El debate más impreso y transcrito de la era moderna: el pionero sunita de la da'wah, Ahmed Deedat, se enfrentó al teleevangelista estadounidense Jimmy Swaggart en la Universidad Estatal de Luisiana, Baton Rouge, en 1986, sobre \"¿Es la Biblia la Palabra de Dios?\". El debate se imprimió íntegramente, se transcribió y se distribuyó por todo el mundo, convirtiéndose en un texto de referencia de la literatura moderna sobre debates. Deedat insistió en que la Biblia recibida carece de una cadena divina continua como la del Corán, mientras que Swaggart defendió la inspiración de ambos Testamentos. Su grabación y traducción siguen estando entre los textos de debate más difundidos. {cite:answering-islam-debates-index}"
