label: { ar: "فتنة قرطبة وخروج ابن عبد الجبار", en: "The Cordoba Strife and the Rising of Ibn Abd al-Jabbar", es: "La contienda de Córdoba y el ascenso de Ibn Abd al-Jabbar", fr: "La guerre de Cordoue et le soulèvement d'Ibn Abd al-Jabbar", ur: "قرطبہ کی لڑائی اور ابن عبد الجبار کا عروج" }
summary:
  ar: "في ربيع الأول سنة ثمان وتسعين وثلاثمائة أخرج المؤيد هشام من تدبير الأمور في حياته إلى الحاجب عبد الرحمن بن المنصور بن أبي عامر وفوّض إليه الخلافة بعد وفاته بعهد الله وميثاقه وذمة نبيه وذمم الخلفاء الراشدين من آبائه، وكان لقبه في الناس سانجيل، فنقم أهل الدولة ذلك وأسيفوا تحويل الأمر من المضرية إلى اليمنية فاجتمع الأمويون والقرشيون لشأنهم ووثبوا بصاحب الشرطة فقتلوه سنة تسع وتسعين وخلعوا هشاماً المؤيد {cite:nafh-tib-maqqari p. 425-426}؛ وفي جمادى الآخرة سنة تسع وتسعين وثلاثمائة ظهر بقرطبة محمد بن هشام بن عبد الجبار بن عبد الرحمن الناصر في اثني عشر رجلاً فبايعه الناس وتلقّب بالمهدي بالله وملك قرطبة، وأخذ الخليفة المؤيد هشاماً فحبسه في القصر ثم أخرج جثة نصراني يشبهه وذكر أنه المؤيد فصلّى الناس عليه ودفنوه في مقابر المسلمين؛ ونقم الناس على ابن عبد الجبار أشياء منها أنه كان يعمل النبيذ في قصره فيسميه نبّاذاً، فخرج عليه عمه هشام بن سليمان فتلقّب بالرشيد فهزمه وقتله أسيراً، ثم خرج سليمان بن الحكم المستعين يستنجد بالنصارى فالتقوا بالوقعة المشهورة قُتل فيها خمسة وثلاثون ألفاً فانهزم ابن عبد الجبار وتحصّن بقصر قرطبة، ودخل سليمان البلد وقصره فاحتال ابن عبد الجبار في الهرب واختفى، وبويع سليمان بالخلافة في شوال سنة أربعمائة وأغار البربر والروم على قرطبة فنهبوها وسبوا وأسروا عدداً عظيماً، ثم عاد ابن عبد الجبار من طليطلة بعسكر من النصارى فهزم سليمان ودخل قرطبة وجدد البيعة لنفسه {cite:kamil-ibn-al-athir p. 499-502}."
  en: "The Cordoba fitna of 399–400: the Umayyad Muhammad ibn Hisham rose as 'al-Mahdi', hid the caliph Hisham al-Mu'ayyad and buried a Christian lookalike in his name; his uncle Hisham's counter-revolt failed, then Sulayman al-Musta'in marched in with Christian allies, won the great battle (35,000 dead), and took the bay'a while Berbers and Christians sacked the city {cite:kamil-ibn-al-athir p. 499-502}."
  es: "La fitna de Córdoba de 399-400: el omeya Muhammad ibn Hisham se alzó como 'al-Mahdi', escondió al califa Hisham al-Mu'ayyad y enterró a un cristiano parecido a él en su nombre; la contrarrevuelta de su tío Hisham fracasó, entonces Sulayman al-Musta'in marchó con aliados cristianos, ganó la gran batalla (35.000 muertos) y tomó la bay'a mientras los bereberes y los cristianos saqueaban la ciudad {cite:kamil-ibn-al-athir p. 499-502}."
  fr: "La fitna de Cordoue de 399-400: l'Omeyyade Muhammad ibn Hisham s'est élevé au rang d'« al-Mahdi », a caché le calife Hisham al-Mu'ayyad et a enterré un sosie chrétien en son nom; la contre-révolte de son oncle Hisham a échoué, puis Sulayman al-Musta'in est entré avec des alliés chrétiens, a remporté la grande bataille (35 000 morts) et a pris la bay'a tandis que les Berbères et les chrétiens pillaient la ville {cite:kamil-ibn-al-athir p. 499-502}."
  ur: "399-400 کا قرطبہ فتنہ: اموی محمد بن ہشام 'المہدی' کے طور پر اٹھے، خلیفہ ہشام المیعاد کو چھپا دیا اور اس کے نام پر ایک عیسائی شکل کو دفن کیا؛ اس کے چچا ہشام کی جوابی بغاوت ناکام ہوگئی، پھر سلیمان المستعین نے عیسائی اتحادیوں کے ساتھ مل کر مارچ کیا، عظیم جنگ جیت لی ⁦(35,000 ہلاک)⁩، اور بیع پر قبضہ کر لیا جب کہ بربروں اور عیسائیوں نے اس شہر کو توڑ ڈالا۔ 499-502}۔"
