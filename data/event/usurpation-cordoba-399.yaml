label: { ar: "فتنة قرطبة وخروج ابن عبد الجبار", en: "The Cordoba Strife and the Rising of Ibn Abd al-Jabbar", es: "La contienda de Córdoba y el ascenso de Ibn Abd al-Jabbar", fr: "La guerre de Cordoue et le soulèvement d'Ibn Abd al-Jabbar", ur: "قرطبہ کی لڑائی اور ابن عبد الجبار کا عروج", tr: "Kurtuba Fitnesi ve İbn Abdülcebar İsyanı", id: "Fitnah Cordoba dan Pemberontakan Ibnu Abd al-Jabbar" }
summary:
  ar: "في ربيع الأول سنة ثمان وتسعين وثلاثمائة أخرج المؤيد هشام من تدبير الأمور في حياته إلى الحاجب عبد الرحمن بن المنصور بن أبي عامر وفوّض إليه الخلافة بعد وفاته بعهد الله وميثاقه وذمة نبيه وذمم الخلفاء الراشدين من آبائه، وكان لقبه في الناس سانجيل، فنقم أهل الدولة ذلك وأسيفوا تحويل الأمر من المضرية إلى اليمنية فاجتمع الأمويون والقرشيون لشأنهم ووثبوا بصاحب الشرطة فقتلوه سنة تسع وتسعين وخلعوا هشاماً المؤيد {cite:nafh-tib-maqqari p. 425-426}؛ وفي جمادى الآخرة سنة تسع وتسعين وثلاثمائة ظهر بقرطبة محمد بن هشام بن عبد الجبار بن عبد الرحمن الناصر في اثني عشر رجلاً فبايعه الناس وتلقّب بالمهدي بالله وملك قرطبة، وأخذ الخليفة المؤيد هشاماً فحبسه في القصر ثم أخرج جثة نصراني يشبهه وذكر أنه المؤيد فصلّى الناس عليه ودفنوه في مقابر المسلمين؛ ونقم الناس على ابن عبد الجبار أشياء منها أنه كان يعمل النبيذ في قصره فيسميه نبّاذاً، فخرج عليه عمه هشام بن سليمان فتلقّب بالرشيد فهزمه وقتله أسيراً، ثم خرج سليمان بن الحكم المستعين يستنجد بالنصارى فالتقوا بالوقعة المشهورة قُتل فيها خمسة وثلاثون ألفاً فانهزم ابن عبد الجبار وتحصّن بقصر قرطبة، ودخل سليمان البلد وقصره فاحتال ابن عبد الجبار في الهرب واختفى، وبويع سليمان بالخلافة في شوال سنة أربعمائة وأغار البربر والروم على قرطبة فنهبوها وسبوا وأسروا عدداً عظيماً، ثم عاد ابن عبد الجبار من طليطلة بعسكر من النصارى فهزم سليمان ودخل قرطبة وجدد البيعة لنفسه {cite:kamil-ibn-al-athir p. 499-502}."
  en: "The Cordoba fitna of 399–400: the Umayyad Muhammad ibn Hisham rose as 'al-Mahdi', hid the caliph Hisham al-Mu'ayyad and buried a Christian lookalike in his name; his uncle Hisham's counter-revolt failed, then Sulayman al-Musta'in marched in with Christian allies, won the great battle (35,000 dead), and took the bay'a while Berbers and Christians sacked the city {cite:kamil-ibn-al-athir p. 499-502}."
  es: "La fitna de Córdoba de 399-400: el omeya Muhammad ibn Hisham se alzó como 'al-Mahdi', escondió al califa Hisham al-Mu'ayyad y enterró a un cristiano parecido a él en su nombre; la contrarrevuelta de su tío Hisham fracasó, entonces Sulayman al-Musta'in marchó con aliados cristianos, ganó la gran batalla (35.000 muertos) y tomó la bay'a mientras los bereberes y los cristianos saqueaban la ciudad {cite:kamil-ibn-al-athir p. 499-502}."
  fr: "La fitna de Cordoue de 399-400: l'Omeyyade Muhammad ibn Hisham s'est élevé au rang d'« al-Mahdi », a caché le calife Hisham al-Mu'ayyad et a enterré un sosie chrétien en son nom; la contre-révolte de son oncle Hisham a échoué, puis Sulayman al-Musta'in est entré avec des alliés chrétiens, a remporté la grande bataille (35 000 morts) et a pris la bay'a tandis que les Berbères et les chrétiens pillaient la ville {cite:kamil-ibn-al-athir p. 499-502}."
  ur: "399-400 کا قرطبہ فتنہ: اموی محمد بن ہشام 'المہدی' کے طور پر اٹھے، خلیفہ ہشام المیعاد کو چھپا دیا اور اس کے نام پر ایک عیسائی شکل کو دفن کیا؛ اس کے چچا ہشام کی جوابی بغاوت ناکام ہوگئی، پھر سلیمان المستعین نے عیسائی اتحادیوں کے ساتھ مل کر مارچ کیا، عظیم جنگ جیت لی ⁦(35,000 ہلاک)⁩، اور بیع پر قبضہ کر لیا جب کہ بربروں اور عیسائیوں نے اس شہر کو توڑ ڈالا۔ 499-502}۔"
  tr: "Hicri 398 yılının baharında, Muayyad, Hişam'ı hayattayken devlet yönetiminden uzaklaştırarak, vezir Abdülrahman ibn el-Mansur ibn Ebi Emir'e devretti ve ölümünden sonra halifeliği, Allah'ın ahdi, vaadi, Peygamberinin garantisi ve atalarından gelen doğru yolda olan halifelerin güvencesiyle ona emanet etti. Halk arasında Sanjil unvanını aldı. Devlet halkı bundan rahatsız oldu ve meselenin Mudhar'dan Yemenliye devredilmesinden üzüntü duydu. Bunun üzerine Emeviler ve Kureyş kendi işleri için bir araya gelerek polis şefine saldırdılar ve onu Hişam Muayyad'ı öldürerek tahttan indirdiler. {Kaynak: Nafh-tib-makqkari s. 425-426} Hicri 399 yılının Cemâde-i Ahiret ayında, Muhammed ibn Hişam ibn Abdülceber ibn Abdülrahman el-Nasır, on iki adamıyla birlikte Kurtuba'da ortaya çıktı. Halk ona biat etti ve o da el-Mehdi Billa unvanını alarak Kurtuba'yı yönetti. Halife el-Muayyad, Hişam'ı yakalayıp sarayda hapsetti. Sonra ona benzeyen bir Hristiyanın cesedini çıkarıp el-Muayyad olduğunu iddia etti. Halk onun için dua etti ve onu Müslüman mezarlıklarına gömdü. Halk, İbn Abdülceber'e çeşitli nedenlerden dolayı kızmıştı; bunlardan biri de sarayında şarap yapması ve buna şarap yapımı demesiydi. Amcası Hişam ibn Süleyman ona karşı ayaklandı, el-Raşid unvanını aldı, onu yendi ve esir olarak öldürdü. Süleyman ibn el-Hakam el-Musta'in, Hristiyanlardan yardım istemek için yola çıktı ve otuz beş bin kişinin öldüğü meşhur savaşta karşılaştılar. İbn Abd el-Cabbar yenildi ve Kurtuba sarayında kendini tahkim etti. Süleyman şehre ve sarayına girince, İbn Abd el-Cabbar kaçmak için bir plan yaptı ve saklandı. Süleyman, 400 yılının Şevval ayında halife olarak biat etti. Berberiler ve Romalılar Kurtuba'ya baskın düzenleyerek şehri yağmaladılar ve çok sayıda esir aldılar. Bunun üzerine İbn Abd el-Cabbar, Hristiyanlardan oluşan bir orduyla Toledo'dan döndü, Süleyman'ı yendi, Kurtuba'ya girdi ve kendisine biat etti. {cite:kamil-ibn-al-athir s. 499-502}"
  id: "Pada musim semi tahun 398 H, Al-Mu'ayyad memindahkan Hisham dari pengelolaan urusan selama hidupnya ke bendahara Abd al-Rahman ibn al-Mansur ibn Abi Amir, dan mempercayakan kekhalifahan kepadanya setelah kematiannya berdasarkan perjanjian Allah dan janji-Nya serta jaminan Nabi-Nya dan jaminan para Khalifah yang diberi petunjuk dari leluhurnya. Gelarnya di antara rakyat adalah Sanjil. Rakyat negara membenci hal ini dan sedih atas pengalihan masalah dari Mudhar ke Yaman. Maka Umayyah dan Quraisy berkumpul untuk urusan mereka sendiri dan menyerang kepala polisi dan membunuhnya pada tahun 399 H dan menggulingkan Hisham Al-Mu'ayyad {cite:nafh-tib-maqqari hlm. 425-426}; Pada bulan Jumada al-Akhirah tahun 399 H, Muhammad ibn Hisham ibn Abd al-Jabbar ibn Abd al-Rahman al-Nasir muncul di Cordoba bersama dua belas orang. Orang-orang berbaiat kepadanya, dan ia mengambil gelar al-Mahdi Billah dan memerintah Cordoba. Khalifah al-Mu'ayyad menangkap Hisham dan memenjarakannya di istana. Kemudian ia mengeluarkan jenazah seorang Kristen yang menyerupainya dan mengaku sebagai al-Mu'ayyad. Orang-orang mendoakan jenazahnya dan menguburkannya di pemakaman Muslim. Orang-orang membenci Ibn Abd al-Jabbar karena beberapa hal, termasuk karena ia biasa membuat anggur di istananya dan menyebutnya pembuatan anggur. Pamannya, Hisham ibn Sulayman, bangkit melawannya, mengambil gelar al-Rashid, mengalahkannya, dan membunuhnya sebagai tawanan. Kemudian Sulaiman bin al-Hakam al-Musta'in pergi meminta bantuan dari orang-orang Kristen, dan mereka bertemu dalam pertempuran terkenal yang menewaskan tiga puluh lima ribu orang. Ibn Abd al-Jabbar dikalahkan dan membentengi dirinya di istana Cordoba. Sulaiman memasuki kota dan istananya, sehingga Ibn Abd al-Jabbar merancang rencana untuk melarikan diri dan bersembunyi. Sulaiman disumpah setia sebagai Khalifah pada bulan Syawal tahun 400. Bangsa Berber dan Romawi menyerbu Cordoba, menjarahnya dan menawan serta memenjarakan banyak orang. Kemudian Ibn Abd al-Jabbar kembali dari Toledo dengan pasukan Kristen, mengalahkan Sulaiman, memasuki Cordoba, dan memperbarui sumpah setia kepada dirinya sendiri. {cite:kamil-ibn-al-athir hlm. 499-502}."
