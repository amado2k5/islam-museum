label: { ar: "فتنة قرطبة وخروج ابن عبد الجبار" }
summary:
  ar: "في جمادى الآخرة سنة تسع وتسعين وثلاثمائة ظهر بقرطبة محمد بن هشام بن عبد الجبار بن عبد الرحمن الناصر في اثني عشر رجلاً فبايعه الناس وتلقّب بالمهدي بالله وملك قرطبة، وأخذ الخليفة المؤيد هشاماً فحبسه في القصر ثم أخرج جثة نصراني يشبهه وذكر أنه المؤيد فصلّى الناس عليه ودفنوه في مقابر المسلمين؛ ونقم الناس على ابن عبد الجبار أشياء منها أنه كان يعمل النبيذ في قصره فيسميه نبّاذاً، فخرج عليه عمه هشام بن سليمان فتلقّب بالرشيد فهزمه وقتله أسيراً، ثم خرج سليمان بن الحكم المستعين يستنجد بالنصارى فالتقوا بالوقعة المشهورة قُتل فيها خمسة وثلاثون ألفاً فانهزم ابن عبد الجبار وتحصّن بقصر قرطبة، ودخل سليمان البلد وقصره فاحتال ابن عبد الجبار في الهرب واختفى، وبويع سليمان بالخلافة في شوال سنة أربعمائة وأغار البربر والروم على قرطبة فنهبوها وسبوا وأسروا عدداً عظيماً، ثم عاد ابن عبد الجبار من طليطلة بعسكر من النصارى فهزم سليمان ودخل قرطبة وجدد البيعة لنفسه {cite:kamil-ibn-al-athir p. 499-502}."
  en: "The Cordoba fitna of 399–400: the Umayyad Muhammad ibn Hisham rose as 'al-Mahdi', hid the caliph Hisham al-Mu'ayyad and buried a Christian lookalike in his name; his uncle Hisham's counter-revolt failed, then Sulayman al-Musta'in marched in with Christian allies, won the great battle (35,000 dead), and took the bay'a while Berbers and Christians sacked the city {cite:kamil-ibn-al-athir p. 499-502}."
