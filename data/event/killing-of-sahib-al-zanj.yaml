label: { ar: "قتل صاحب الزنج" }
summary:
  ar: "استمر القتال مع الزنج من حين تولى المعتمد سنة ست وخمسين إلى سنة سبعين فقتل فيها رأس الزنج وكان قد ادعى أنه أرسل إلى الخلق فرد الرسالة وأنه يطلع على المغيبات، فدخل برأسه بغداد على رمح وعملت قباب الزينة وضج الناس بالدعاء للموفق ومدحه الشعراء وكان يوماً مشهوداً وأمن الناس وتراجعوا إلى المدن التي أخذها ومنها واسط ورامهرمز {cite:tarikh-khulafa-minhaj-1434 p. 564-565}.، وعند المسعودي قتل ليلة السبت لليلتين خلتا من صفر سنة سبعين ومائتين في خلافة المعتمد {cite:muruj-al-dhahab p. 568}"
  en: "The fighting ran from al-Mu'tamid's accession in 256 to 270, when the Zanj chief — who claimed he had sent creation letters to creation and knew the unseen — was killed; his head entered Baghdad on a lance, domes of celebration were raised, the crowd roared prayers for al-Muwaffaq, poets praised him, and people safely re-entered the cities the Zanj had taken, Wasit and Ramhurmuz among them {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
