id: event/killing-of-sahib-al-zanj
class: event
kind: death
label: { ar: "قتل صاحب الزنج", en: "The killing of the Zanj leader", es: "El asesinato del líder Zanj", fr: "L'assassinat du chef Zanj", ur: "زنج لیڈر کا قتل", tr: "Zanj'ın sahibi öldürüldü.", id: "Pemilik Zanj tewas." }
summary:
  ar: "استمر القتال مع الزنج من حين تولى المعتمد سنة ست وخمسين إلى سنة سبعين فقتل فيها رأس الزنج وكان قد ادعى أنه أرسل إلى الخلق فرد الرسالة وأنه يطلع على المغيبات، فدخل برأسه بغداد على رمح وعملت قباب الزينة وضج الناس بالدعاء للموفق ومدحه الشعراء وكان يوماً مشهوداً وأمن الناس وتراجعوا إلى المدن التي أخذها ومنها واسط ورامهرمز {cite:tarikh-khulafa-minhaj-1434 p. 564-565}. وعند المسعودي قتل ليلة السبت لليلتين خلتا من صفر سنة سبعين ومائتين في خلافة المعتمد {cite:muruj-al-dhahab p. 568}، وعند ابن الجوزي حرّض أبو أحمد الموفق على حربه ورغّب الناس في جهاد العدو فصار معه جماعة من المطوعة ورتّب الناس وأمرهم أن يزحفوا جميعاً مرة واحدة فعبر يوم الاثنين لثلاث بقين من المحرم فنصر وملأ أكناف القوم فانهزموا وقُتل ما لا يُحصى وحُويت مدينة الخبيث بأسرها واستُنقذ ما فيها من الأسارى رجالاً ونساءً وصبياناً وهرب الخبيث وخواصه إلى موضع كان وطّأه لنفسه ملجأً، وغدا أبو أحمد يوم السبت لليلتين خلتا من صفر فلقي الناس قواده فأُسروا وجاء البشير بقتله ثم جاء رجل معه رأسه فسجد الناس شكراً، وأمر أبو أحمد بالنداء في أهل البصرة والأبلة وكور الأهواز وواسط بالرجوع إلى أوطانهم، ووصل ابنه أبو العباس بغداد بالرأس على قناة ليلة السبت لاثني عشر ليلة بقيت من جمادى الأولى فركب في جيش لم يُرَ مثله من سوق الثلاثاء إلى الخرّم وباب الطاق حتى انحدر في دجلة إلى قصر الخلافة وضُربت القباب وزُيّنت الحيطان {cite:muntazam-ibn-al-jawzi j.5 p. 74-75}"
  en: "The fighting ran from al-Mu'tamid's accession in 256 to 270, when the Zanj chief — who claimed he had sent creation letters to creation and knew the unseen — was killed; his head entered Baghdad on a lance, domes of celebration were raised, the crowd roared prayers for al-Muwaffaq, poets praised him, and people safely re-entered the cities the Zanj had taken, Wasit and Ramhurmuz among them {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
  es: "Los combates se extendieron desde la ascensión de al-Mu'tamid en 256 hasta 270, cuando el jefe Zanj —quien afirmaba haber enviado cartas de creación a la creación y conocer lo invisible— fue asesinado; su cabeza entró en Bagdad en una lanza, se levantaron cúpulas de celebración, la multitud rugió oraciones por al-Muwaffaq, los poetas lo elogiaron y la gente regresó a salvo a las ciudades que los Zanj habían tomado, entre ellas Wasit y Ramhurmuz {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
  fr: "Les combats se déroulèrent de l'accession au trône d'al-Mu'tamid en 256 à 270, date à laquelle le chef des Zanj — qui prétendait avoir envoyé des lettres de création à la création et connaître l'invisible — fut tué; sa tête entra dans Bagdad sur une lance, des dômes de célébration furent érigés, la foule rugit des prières pour al-Muwaffaq, les poètes le louèrent et les gens réintégrèrent en toute sécurité les villes que les Zanj avaient prises, Wasit et Ramhurmuz parmi elles {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
  ur: "یہ لڑائی المتمید کے الحاق سے 256 سے 270 تک جاری رہی، جب زنج کا سربراہ - جس نے دعویٰ کیا کہ اس نے تخلیق کو تخلیق کے خطوط بھیجے تھے اور غیب کو جانتے تھے - مارا گیا تھا۔ اس کا سر جھکتے ہوئے بغداد میں داخل ہوا، جشن کے گنبد بلند ہوئے، ہجوم نے الموفق کے لیے دعائیں مانگیں، شاعروں نے اس کی تعریف کی، اور لوگ بحفاظت ان شہروں میں داخل ہو گئے جن کو زنج نے لے لیا تھا، ان میں وسط اور رامہرمز بھی شامل ہیں۔ 564-565}۔"
  tr: "Zence ile savaş, Mu'tamid'in 256 Hicri yılında iktidara gelmesinden, Zence liderinin öldürüldüğü 270 Hicri yılına kadar devam etti. Zence lideri, halka bir mesaj gönderdiğini iddia etmişti, ancak halk bunu reddetmişti ve gaybı bildiğini söylemişti. Başı bir mızrağın ucuna takılarak Bağdat'a getirildi ve süslü kubbeler dikildi. Halk Muvaffak için dua etti ve şairler onu övdü. Bu önemli bir gündü ve halk kendini güvende hissederek, Wasit ve Ramhormoz da dahil olmak üzere ele geçirdiği şehirlere çekildi. {kaynak:tarikh-khulafa-minhaj-1434 s. 564-565}. Mesudi'ye göre, Mu'tamid'in halifeliği döneminde, 270 Hicri yılında Safar ayının bitiminden iki gece önce, Cumartesi gecesi öldürüldü. {kaynak:muruj-al-dhahab s. 568} İbn el-Cevzi'ye göre, Ebu Ahmed el-Muveffak insanları kendisine karşı savaşmaya kışkırttı ve onları düşmana karşı cihat etmeye teşvik etti. Bir grup gönüllü ona katıldı ve o da insanları organize ederek hepsinin birden yürüyüşe geçmesini emretti. Muharrem ayının bitiminden üç gün önce, Pazartesi günü nehri geçti ve zafer kazandı. Düşmanın kanatlarını doldurdu, böylece düşman yenildi ve sayısız insan öldürüldü. Kötü adamın tüm şehri ele geçirildi ve içindeki tüm esirler, erkekler, kadınlar ve çocuklar kurtarıldı. Kötü adam ve yakın arkadaşları, kendisi için hazırladığı bir sığınak yerine kaçtılar. Safer ayının bitiminden iki gece önce, Cumartesi günü, Ebu Ahmed esir alınmış olan komutanlarıyla buluştu. Bir haberci onun öldürüldüğü haberini getirdi, sonra bir adam onun başıyla geldi ve insanlar şükranla secde ettiler. Ebu Ahmed, Basra, Ubulla, Ahvaz ve Vasit bölgelerindeki insanlara evlerine dönmeleri için bir bildiri yayınlanmasını emretti. Oğlu Ebu el-Abbas, Cemâdî Ula'nın bitiminden on iki gece önce, Cumartesi gecesi bir kanal üzerinde başıyla Bağdat'a geldi. Salı Pazarı'ndan el-Khurram ve Bab el-Taq'a kadar, daha önce hiç görülmemiş bir orduyla at sürdü ve sonunda Dicle Nehri'ne inerek halifenin sarayına ulaştı. Kubbeler inşa edildi ve duvarlar süslendi. {cite:muntazam-ibn-al-jawzi j.5 s. 74-75}"
  id: "Perang dengan Zanj berlanjut sejak al-Mu'tamid berkuasa pada tahun 256 H hingga 270 H, ketika pemimpin Zanj terbunuh. Ia mengaku telah mengirim pesan kepada rakyat, tetapi mereka menolaknya, dan bahwa ia memiliki pengetahuan tentang hal gaib. Kepalanya dibawa ke Baghdad dengan tombak, dan kubah-kubah hias didirikan. Rakyat berseru memohon kesembuhan untuk al-Muwaffaq, dan para penyair memujinya. Itu adalah hari yang penting, dan rakyat merasa aman dan mundur ke kota-kota yang telah direbutnya, termasuk Wasit dan Ramhormoz. {cite:tarikh-khulafa-minhaj-1434 hlm. 564-565}. Menurut al-Mas'udi, ia terbunuh pada Sabtu malam, dua malam sebelum berakhirnya Safar pada tahun 270 H, selama kekhalifahan al-Mu'tamid. {cite:muruj-al-dhahab hlm. 568} Menurut Ibn al-Jawzi, Abu Ahmad al-Muwaffaq menghasut orang-orang untuk melawannya dan mendorong mereka untuk berjihad melawan musuh. Sekelompok sukarelawan bergabung dengannya, dan dia mengorganisir orang-orang dan memerintahkan mereka untuk berbaris sekaligus. Dia menyeberang pada hari Senin, tiga hari sebelum berakhirnya Muharram, dan meraih kemenangan. Dia memenuhi sisi-sisi musuh, sehingga mereka dikalahkan, dan banyak sekali yang terbunuh. Seluruh kota si jahat direbut, dan semua tawanan di dalamnya, laki-laki, perempuan, dan anak-anak, diselamatkan. Si jahat dan para sekutunya melarikan diri ke tempat yang telah dia siapkan untuk dirinya sendiri sebagai tempat perlindungan. Pada hari Sabtu, dua malam sebelum berakhirnya Safar, Abu Ahmad bertemu dengan para komandannya, yang telah ditangkap. Seorang utusan datang dengan berita tentang kematiannya, dan kemudian seorang pria datang dengan kepalanya, sehingga orang-orang bersujud sebagai tanda syukur. Abu Ahmad memerintahkan pengumuman untuk disampaikan kepada penduduk Basra, al-Ubulla, distrik Ahwaz, dan Wasit untuk kembali ke rumah mereka. Putranya, Abu al-Abbas, tiba di Baghdad dengan membawa kepala di atas kanal pada Sabtu malam, dua belas malam sebelum berakhirnya Jumada al-Ula. Ia berkuda dengan pasukan yang belum pernah terlihat sebelumnya, dari Pasar Selasa ke al-Khurram dan Bab al-Taq, hingga ia turun ke Sungai Tigris menuju istana Khalifah. Kubah-kubah didirikan dan dinding-dinding dihias. {cite:muntazam-ibn-al-jawzi j.5 p. 74-75}"
