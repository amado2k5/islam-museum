summary:
  ar: "بطاقة أولية لمعركة بسكرة ⁦(فيسكيرا)⁩ سنة ٦٨٢م، هزيمة عقبة بن نافع واستشهاده في رجعته من المغرب؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Vescera in 682, where Uqba ibn Nafi' was defeated and killed on his return from the far Maghreb; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Vescera en 682, donde Uqba ibn Nafi' fue derrotado y muerto a su regreso del lejano Magreb; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte provisoire pour la bataille de Vescera en 682, où Uqba ibn Nafi' fut vaincu et tué à son retour du lointain Maghreb; ses sources ne sont pas encore vérifiées sur la page."
  ur: "682 میں ویسیرا کی جنگ کے لیے ڈرافٹ کارڈ، جہاں عقبہ بن نافع کو مغرب سے واپسی پر شکست ہوئی اور مارا گیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "682 yılında gerçekleşen Biskra (Fiskira) Muharebesi'nin, Uqba ibn Nafi'nin yenilgisinin ve Fas'tan dönüşünde şehit edilmesinin ön anlatımı; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Biskra (Fiskira) pada tahun 682 M, kekalahan Uqba ibn Nafi dan kemartirannya saat kembali dari Maroko; sumber-sumbernya belum ditinjau di halaman ini."
