label: { ar: "أمطار بغداد وخراب الدور وكبسات اللصوص", en: "Rains, Collapsed Houses and Night Raids in Baghdad", fr: "Pluies, maisons effondrées et raids nocturnes à Bagdad", es: "Lluvias, casas derrumbadas y redadas nocturnas en Bagdad.", ur: "بغداد میں بارش، منہدم مکانات اور رات کے چھاپے۔", tr: "Bağdat'ta yağmur, yıkılmış evler ve hırsızların baskınları.", id: "Hujan di Baghdad, rumah-rumah yang hancur, dan serangan para pencuri." }
summary:
  ar: "في جمادى الأولى سنة اثنتين وثلاثين وثلاثمائة كثرت الأمطار فتساقطت منازل الناس ومات خلق كثير تحت الهدم، وما زالت قيمة العقار ببغداد تنقص وزاد الأمر بسبب الغلاء وبلغ الخبز الحشكار ثلاثة أرطال بدرهم والتمر رطلين بدرهم، وأُغلقت عدة حمامات وتعطلت أسواق ومساجد حتى صار يُطلب من يسكن الدور بأجرة يُعطاها ليحفظها، وكثرت الكبسات بالليل من اللصوص بالسلاح والشمع وتحارس الناس بالليل بالبواتات {cite:muntazam-ibn-al-jawzi p. 623}."
  en: "In Jumada I 332 heavy rains brought houses down on their people; property values collapsed with the famine until cheap bread and dates returned — hammams, markets and mosques stood closed, men were paid to occupy houses just to guard them, and armed night-raiders forced the people to keep watch {cite:muntazam-ibn-al-jawzi p. 623}."
  fr: "En Jumada I 332, de fortes pluies firent s'écrouler des maisons sur leurs habitants ; la valeur des biens s'effondra avec la famine jusqu'au retour du pain et des dattes bon marché ; hammams, marchés et mosquées restaient fermés, on payait des hommes pour occuper des maisons afin de seulement les garder, et des pillards nocturnes armés obligeaient les gens à monter la garde {cite:muntazam-ibn-al-jawzi p. 623}."
  es: "En Jumada I 332, las fuertes lluvias derribaron casas sobre sus habitantes; el valor de las propiedades se desplomó con la hambruna hasta que volvieron el pan barato y los dátiles; los hammams, los mercados y las mezquitas permanecieron cerrados, se pagaba a los hombres para que ocuparan las casas solo para vigilarlas, y asaltantes nocturnos armados obligaban a la gente a mantenerse alerta {cite:muntazam-ibn-al-jawzi p. 623}."
  ur: "جمادی الثانی میں 332 موسلا دھار بارش نے لوگوں کے مکانات کو گرا دیا۔ قحط کے ساتھ املاک کی قیمتیں تباہ ہوگئیں یہاں تک کہ سستی روٹی اور کھجوریں واپس آگئیں - حمام، بازار اور مساجد بند رہیں، مردوں کو گھروں پر صرف ان کی حفاظت کے لیے قبضہ کرنے کے لیے ادائیگی کی گئی، اور مسلح رات کے حملہ آوروں نے لوگوں کو چوکس رہنے پر مجبور کیا۔ 623}۔"
  tr: "Hicri 332 yılının Cemâde-i Ula ayında yağmurlar arttı, bu yüzden insanların evleri yıkıldı ve birçok insan enkaz altında kaldı. Bağdat'taki gayrimenkullerin değeri düşmeye devam etti ve yüksek fiyatlar nedeniyle durum daha da kötüleşti. Haşkar ekmeğinin fiyatı bir dirhem için üç liraya, hurmanın fiyatı ise bir dirhem için iki liraya ulaştı. Birçok hamam kapatıldı, pazarlar ve camiler aksadı, hatta insanlardan kendilerini korumak için ücret karşılığında evlerde yaşamaları istendi. Geceleyin silahlı ve mumlu hırsızlar tarafından birçok baskın düzenlendi ve insanlar geceleyin at arabalarıyla korundu. {cite:muntazam-ibn-al-jawzi s. 623}"
  id: "Pada bulan Jumada al-Ula tahun 332 H, curah hujan meningkat, sehingga rumah-rumah penduduk runtuh dan banyak orang tewas tertimpa reruntuhan. Nilai properti di Baghdad terus menurun, dan masalah semakin memburuk karena harga yang tinggi. Harga roti hashkar mencapai tiga pound untuk satu dirham dan kurma dua pound untuk satu dirham. Beberapa pemandian umum ditutup, dan pasar serta masjid terganggu hingga orang-orang diminta untuk tinggal di rumah-rumah dengan imbalan uang yang akan diberikan untuk perlindungan. Terjadi banyak perampokan di malam hari oleh pencuri bersenjata dan lilin, dan orang-orang dijaga di malam hari oleh kereta kuda. {cite:muntazam-ibn-al-jawzi p. 623}."
