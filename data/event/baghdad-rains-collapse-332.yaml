label: { ar: "أمطار بغداد وخراب الدور وكبسات اللصوص", en: "Rains, Collapsed Houses and Night Raids in Baghdad" }
summary:
  ar: "في جمادى الأولى سنة اثنتين وثلاثين وثلاثمائة كثرت الأمطار فتساقطت منازل الناس ومات خلق كثير تحت الهدم، وما زالت قيمة العقار ببغداد تنقص وزاد الأمر بسبب الغلاء وبلغ الخبز الحشكار ثلاثة أرطال بدرهم والتمر رطلين بدرهم، وأُغلقت عدة حمامات وتعطلت أسواق ومساجد حتى صار يُطلب من يسكن الدور بأجرة يُعطاها ليحفظها، وكثرت الكبسات بالليل من اللصوص بالسلاح والشمع وتحارس الناس بالليل بالبواتات {cite:muntazam-ibn-al-jawzi p. 623}."
  en: "In Jumada I 332 heavy rains brought houses down on their people; property values collapsed with the famine until cheap bread and dates returned — hammams, markets and mosques stood closed, men were paid to occupy houses just to guard them, and armed night-raiders forced the people to keep watch {cite:muntazam-ibn-al-jawzi p. 623}."
