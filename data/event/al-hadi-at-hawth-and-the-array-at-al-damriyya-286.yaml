id: event/al-hadi-at-hawth-and-the-array-at-al-damriyya-286
class: event
kind: other
label:
  ar: الهادي بحوث وتعبئة الجيش عند بركة الضمرية، رجب 286هـ
  en: Al-Hadi at Hawth and the array at the pond of al-Damriyya, Rajab 286 AH
  ur: حوث میں ہادی اور ضمریہ کے حوض کے پاس لشکر کی صف بندی، رجب 286ھ
  es: "Al-Hadi en Hawth y el conjunto de estatuas en el estanque de al-Damriyya, Rajab 286 AH"
  fr: "Al-Hadi à Hawth et le groupe de l'étang d'al-Damriyya, Rajab 286 AH"
  tr: "Al-Hadi, Birkat al-Damriya'da Ordunun Araştırması ve Seferberliği, Receb 286 H."
  id: "Al-Hadi, Penelitian dan Mobilisasi Tentara di Birkat al-Damriya, Rajab 286 H."
summary:
  ar: يروي محمد بن علي الطبري مجلساً خرج فيه الناس يتشاورون في حرب القوم، وكلام رجل منهم نهاهم عن قتال بني عمهم ثم مرضه مرضاً شديداً. وفي الخميس خرج الهادي وجمع الناس، وطمأن الخولانيين على قسيّهم وسلاحهم من الغيث، ورأى القوم قرب بركة الضمرية فعبّأ جيشه ميمنة وميسرة وقلباً بأسماء قادتها، فجاءه رسول القوم بأنهم يحضرون ويعطون ما يجب عليهم، فأمر بجلبهم إلى الغبيّب، ورفض اقتراح إسماعيل بن المسلم قطع أعنابهم وهدم منازلهم قبل دعوتهم، حتى حضرت الصلاة.
  en: Muhammad ibn Ali al-Tabari relates a meeting in which people went out to consult about fighting the group and one man urged them not to fight their cousins and then fell gravely ill. On Thursday al-Hadi went out and gathered the people, reassured the Khawlanis that rain would not spoil their bows and weapons, saw the group near the pond of al-Damriyya and drew up his army with named commanders of the left, right and centre; a messenger came from the group saying they would all come and give what was due, and he told him to bring them to al-Ghubayyib, and he rejected Ismail ibn al-Muslim's proposal to cut their vines and pull down their houses before calling them, until the prayer time came.
  ur: محمد بن علی طبری ایک مجلس بیان کرتے ہیں جس میں لوگ قوم سے جنگ پر مشورہ کرنے نکلے اور ان میں سے ایک شخص نے انہیں اپنے چچازادوں سے لڑنے سے روکا اور پھر وہ سخت بیمار ہو گیا۔ جمعرات کو ہادی نکلے اور لوگوں کو جمع کیا، خولانیوں کو تسلی دی کہ بارش ان کی کمانوں اور ہتھیاروں کو خراب نہ کرے گی، ضمریہ نامی حوض کے قریب قوم کو دیکھا اور بائیں، دائیں اور قلب کی صفیں ان کے سالاروں کے نام کے ساتھ ترتیب دیں؛ قوم کی طرف سے قاصد آیا کہ وہ سب حاضر ہوں گے اور جو واجب ہے دیں گے، تو انہوں نے اسے غبیّب کی طرف لانے کا کہا، اور اسماعیل بن المسلم کی یہ تجویز رد کر دی کہ انہیں دعوت دینے سے پہلے ان کے انگور کٹوا دیے جائیں اور گھر گرا دیے جائیں، یہاں تک کہ نماز کا وقت ہو گیا۔
  es: "Muhammad ibn Ali al-Tabari relata una reunión en la que la gente salió a consultar sobre la lucha contra el grupo y un hombre les instó a no luchar contra sus primos y luego cayó gravemente enfermo. El jueves, al-Hadi salió y reunió a la gente, tranquilizó a los Khawlanis asegurándoles que la lluvia no dañaría sus arcos y armas, vio al grupo cerca del estanque de al-Damriyya y formó su ejército con comandantes nombrados para la izquierda, la derecha y el centro; llegó un mensajero del grupo diciendo que todos vendrían y darían lo que les correspondía, y le dijo que los llevara a al-Ghubayyib, y rechazó la propuesta de Ismail ibn al-Muslim de cortar sus vides y derribar sus casas antes de llamarlos, hasta que llegara la hora de la oración."
  fr: "Muhammad ibn Ali al-Tabari relate une réunion où les gens se consultèrent sur l'opportunité de combattre le groupe. Un homme les exhorta à ne pas s'en prendre à leurs cousins, puis tomba gravement malade. Le jeudi suivant, al-Hadi sortit, rassembla le peuple, rassura les Khawlanis en leur affirmant que la pluie n'abîmerait ni leurs arcs ni leurs armes, aperçut le groupe près de l'étang d'al-Damriyya et déploya son armée, désignant des commandants pour les ailes gauche, droite et centre. Un messager du groupe annonça qu'ils viendraient tous s'acquitter de leurs obligations. Il lui demanda de les conduire auprès d'al-Ghubayyib et rejeta la proposition d'Ismail ibn al-Muslim de couper leurs vignes et de démolir leurs maisons avant de les appeler, jusqu'à l'heure de la prière."
  tr: "Muhammed ibn Ali el-Taberi, insanların kabileye karşı savaşı görüşmek üzere toplandığı bir toplantıyı ve adamlarından birinin, kuzenleriyle savaşmalarını yasaklamasının ardından ağır hastalandığını anlatır. Perşembe günü, el-Hadi dışarı çıkıp insanları topladı ve Havlani kabile mensuplarına yaylarının ve silahlarının yağmurdan korunacağına dair güvence verdi. Kabileyi Damriya havuzunun yakınında görünce, ordusunu sağ kanat, sol kanat ve merkez olmak üzere üç bölüme ayırdı ve komutanlarının isimlerini atadı. Kabileden bir elçi gelip, onlardan isteneni vereceklerini söyledi. Bunun üzerine, onları el-Gübeyb'e getirmelerini emretti ve İsmail ibn el-Müslim'in, namaz vakti gelene kadar onları çağırmadan önce üzüm bağlarını kesme ve evlerini yıkma önerisini reddetti."
  id: "Muhammad ibn Ali al-Tabari menceritakan sebuah pertemuan di mana orang-orang berkumpul untuk membahas perang melawan suku tersebut, dan kata-kata salah seorang dari mereka yang melarang mereka untuk berperang melawan sepupu mereka, setelah itu ia jatuh sakit parah. Pada hari Kamis, al-Hadi keluar dan mengumpulkan orang-orang, dan meyakinkan suku Khawlani bahwa busur dan senjata mereka akan aman dari hujan. Ia melihat suku itu di dekat kolam al-Damriya, jadi ia mengatur pasukannya menjadi sayap kanan, sayap kiri, dan tengah, serta menetapkan nama-nama komandan mereka. Seorang utusan dari suku itu datang kepadanya dan mengatakan bahwa mereka akan datang dan memberikan apa yang menjadi hak mereka, jadi ia memerintahkan mereka untuk dibawa ke al-Ghubayb, dan ia menolak saran Ismail ibn al-Muslim untuk menebang tanaman anggur mereka dan menghancurkan rumah-rumah mereka sebelum memanggil mereka, sampai waktu salat tiba."
