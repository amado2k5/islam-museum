id: event/al-hadi-at-hawth-and-the-array-at-al-damriyya-286
class: event
kind: other
label:
  ar: الهادي بحوث وتعبئة الجيش عند بركة الضمرية، رجب 286هـ
  en: Al-Hadi at Hawth and the array at the pond of al-Damriyya, Rajab 286 AH
  ur: حوث میں ہادی اور ضمریہ کے حوض کے پاس لشکر کی صف بندی، رجب 286ھ
summary:
  ar: يروي محمد بن علي الطبري مجلساً خرج فيه الناس يتشاورون في حرب القوم، وكلام رجل منهم نهاهم عن قتال بني عمهم ثم مرضه مرضاً شديداً. وفي الخميس خرج الهادي وجمع الناس، وطمأن الخولانيين على قسيّهم وسلاحهم من الغيث، ورأى القوم قرب بركة الضمرية فعبّأ جيشه ميمنة وميسرة وقلباً بأسماء قادتها، فجاءه رسول القوم بأنهم يحضرون ويعطون ما يجب عليهم، فأمر بجلبهم إلى الغبيّب، ورفض اقتراح إسماعيل بن المسلم قطع أعنابهم وهدم منازلهم قبل دعوتهم، حتى حضرت الصلاة.
  en: Muhammad ibn Ali al-Tabari relates a meeting in which people went out to consult about fighting the group and one man urged them not to fight their cousins and then fell gravely ill. On Thursday al-Hadi went out and gathered the people, reassured the Khawlanis that rain would not spoil their bows and weapons, saw the group near the pond of al-Damriyya and drew up his army with named commanders of the left, right and centre; a messenger came from the group saying they would all come and give what was due, and he told him to bring them to al-Ghubayyib, and he rejected Ismail ibn al-Muslim's proposal to cut their vines and pull down their houses before calling them, until the prayer time came.
  ur: محمد بن علی طبری ایک مجلس بیان کرتے ہیں جس میں لوگ قوم سے جنگ پر مشورہ کرنے نکلے اور ان میں سے ایک شخص نے انہیں اپنے چچازادوں سے لڑنے سے روکا اور پھر وہ سخت بیمار ہو گیا۔ جمعرات کو ہادی نکلے اور لوگوں کو جمع کیا، خولانیوں کو تسلی دی کہ بارش ان کی کمانوں اور ہتھیاروں کو خراب نہ کرے گی، ضمریہ نامی حوض کے قریب قوم کو دیکھا اور بائیں، دائیں اور قلب کی صفیں ان کے سالاروں کے نام کے ساتھ ترتیب دیں؛ قوم کی طرف سے قاصد آیا کہ وہ سب حاضر ہوں گے اور جو واجب ہے دیں گے، تو انہوں نے اسے غبیّب کی طرف لانے کا کہا، اور اسماعیل بن المسلم کی یہ تجویز رد کر دی کہ انہیں دعوت دینے سے پہلے ان کے انگور کٹوا دیے جائیں اور گھر گرا دیے جائیں، یہاں تک کہ نماز کا وقت ہو گیا۔
