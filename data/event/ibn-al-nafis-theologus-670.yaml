label:
  ar: "ابن النفيس يصنّف «الرسالة الكاملية» ⁦(فاضل بن ناطق)⁩ بالقاهرة، نحو ٦٧٠هـ"
  en: "Ibn al-Nafis composes the Theologus Autodidactus (Fadil ibn Natiq) at Cairo, c. 670/1270"
  ur: "ابن نفیس قاہرہ میں «رسالہ کاملیہ» ⁦(فاضل بن ناطق)⁩ تصنیف کرتے ہیں، تقریباً 670ھ/1270ء"
  es: "Ibn al-Nafis compone el Theologus Autodidactus (Fadil ibn Natiq) en El Cairo, c. 670/1270"
  fr: "Ibn al-Nafis compose le Theologus Autodidactus (Fadil ibn Natiq) au Caire, v. 670/1270"
  tr: "İbnü'n-Nefis, \"Al-Risalah al-Kamiliyyah\"ı (Fadıl ibn Natik) H. 670 civarında Kahire'de derledi."
  id: "Ibnu al-Nafis menyusun “Al-Risalah al-Kamiliyyah” (Fadil ibn Natiq) di Kairo, sekitar tahun 670 H."
summary:
  ar: "صنّف ابن النفيس بالقاهرة «الرسالة الكاملية في السيرة النبوية» — فاضل بن ناطق — توراً فكرياً يجعل فيه رجلاً وحيداً في جزيرة يسمّى كامل يستنبط بالعقل المجرّد أن أحداث سيرة النبي وتاريخ الجماعة، حتى وقائع المغول في عصره وحتى ملامح السلطان الذي لا شك أنه بيبرس، هي خير ما كان يمكن أن يقع، فيختم بتفسير طبيعي للنهايات {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}؛ ولأنها تصوّر بيبرس ⁦(٦٥٨–٦٧٦هـ)⁩ فيّاً جرى التأريخ داخل عهده تقريباً."
  en: "At Cairo Ibn al-Nafis composed al-Risala al-Kamiliyya fi al-sira al-nabawiyya — the Theologus Autodidactus — an intellectual tour de force in which a solitary man called Kamil on a desert island deduces by abstract reasoning that the events of the Prophet's life and the community's history, including the Mongol incursions of his own lifetime and even the physical appearance of the Muslim ruler — no doubt sultan Baybars — were the best things that could possibly have happened, ending with a naturalistic account of the Last Things {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}; since it portrays the living Baybars (658–676 AH) the dating is placed approximately within his reign."
  ur: "قاہرہ میں ابن نفیس نے «الرسالہ کاملیہ فی السیرۃ النبویہ» — تھیولوگس آٹوڈیڈاکٹس — تصنیف کی: ایک فکری مہارت جس میں ایک صحرا جزیرے کے تنہا انسان کامل محض عقلی استدلال سے یہ نتیجہ نکالتا ہے کہ سیرتِ نبوی اور امت کی تاریخ کے واقعات، بشمول اسی زمانے کے مغول حملوں اور مسلم حکمران — بلاشبہ سلطان بیبرس — کے اوصاف تک، بہترین ممکنہ وقوع تھے، اور آخرت کی ایک طبیعیت پسندانہ تعبیر پر ختم ہوتی ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}؛ چونکہ یہ زندہ بیبرس ⁦(658–676ھ)⁩ کی تصویر کھینچتی ہے اس لیے تاریخ تقریباً اسی عہد میں رکھی گئی ہے۔"
  es: "En El Cairo, Ibn al-Nafis compuso al-Risala al-Kamiliyya fi al-sira al-nabawiyya — el Theologus Autodidactus — una obra maestra intelectual en la que un hombre solitario llamado Kamil en una isla desierta deduce mediante razonamiento abstracto que los acontecimientos de la vida del Profeta y la historia de la comunidad, incluidas las incursiones mongolas de su propia época e incluso la apariencia física del gobernante musulmán —sin duda el sultán Baybars — fueron lo mejor que pudo haber sucedido, terminando con un relato naturalista de las Últimas Cosas {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}; dado que retrata al Baybars vivo (658–676 AH), la datación se sitúa aproximadamente dentro de su reinado."
  fr: "Au Caire, Ibn al-Nafis composa al-Risala al-Kamiliyya fi al-sira al-nabawiyya — le Théologue Autodidacte — un tour de force intellectuel dans lequel un homme solitaire nommé Kamil, sur une île déserte, déduit par un raisonnement abstrait que les événements de la vie du Prophète et de l'histoire de la communauté, y compris les incursions mongoles de son vivant et même l'apparence physique du souverain musulman — sans doute le sultan Baybars — furent les meilleures choses qui pouvaient arriver, se terminant par un récit naturaliste des fins dernières {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}; puisqu'il dépeint Baybars vivant (658–676 AH), la datation se situe approximativement durant son règne."
  tr: "İbn el-Nafis, Kahire'de \"Peygamberin Hayatı Üzerine Tam Mektup\" - Fadil ibn Natiq - adlı eseri, Kamil adasında yalnız başına yaşayan bir adamın, Peygamberin hayatındaki olayların, toplumun tarihinin, hatta kendi dönemindeki Moğolların olaylarının ve şüphesiz Baybars olan Sultanın özelliklerinin, olabilecek en iyi olaylar olduğunu saf akıl yürütmeyle çıkardığı ve sonların doğal bir yorumuyla sonuçlandırdığı entelektüel bir devrim olarak sınıflandırmıştır. {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}; ve Baybars'ı (658-676 Hicri) bir sultan olarak tasvir ettiği için, tarih neredeyse onun döneminde yazılmıştır."
  id: "Ibn al-Nafis di Kairo mengklasifikasikan “Surat Lengkap tentang Biografi Nabi” — Fadil ibn Natiq — sebagai revolusi intelektual di mana ia menjadikan seorang pria kesepian di sebuah pulau bernama Kamil yang menyimpulkan dengan akal sehat bahwa peristiwa-peristiwa dalam biografi Nabi dan sejarah masyarakat, bahkan peristiwa-peristiwa Mongol di zamannya dan bahkan ciri-ciri Sultan, yang tidak diragukan lagi adalah Baybars, adalah yang terbaik yang mungkin terjadi, dan ia menyimpulkan dengan interpretasi alami dari akhir cerita {cite:encyclopaedia-of-islam-2 vol. 3 p. 898}; dan karena menggambarkan Baybars (658–676 H) sebagai seorang sultan, sejarah tersebut ditulis hampir dalam zamannya."
