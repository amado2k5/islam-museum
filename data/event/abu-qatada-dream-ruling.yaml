id: event/abu-qatada-dream-ruling
class: event
kind: other
label:
  ar: "الرؤيا الصالحة من الله والحلم من الشيطان"
  en: "The good dream is from God and the bad dream is from the shaytan"
  ur: "نیک خواب اللہ کی طرف سے اور برا خواب شیطان کی طرف سے"
summary:
  ar: "يذكر الموطأ عن أبي قتادة بن ربعي أن النبي قال «الرؤيا الصالحة من الله، والحلم من الشيطان، فإذا حلم أحدكم فليستعذ بالله وليتفل عن يساره ثلاثاً، وليتجنب حديثه» {cite:muwatta-maruf-1997} [[passage/muwatta-31-2750|الموطأ 31:2750]]."
  en: "Al-Muwatta relates from Abu Qatada ibn Rib'i that the Prophet said 'the good dream is from God, and the bad dream is from the shaytan; so when any of you dreams, let him seek refuge in God, spit on his left three times, and avoid talking about it' {cite:muwatta-maruf-1997} [[passage/muwatta-31-2750|Muwatta 31:2750]]."
  ur: "موطأ ابو قتادہ بن ربعی سے روایت کرتے ہیں کہ نبی نے کہا «نیک خواب اللہ کی طرف سے ہے، اور برا خواب شیطان کی طرف سے؛ پس جب تم میں سے کوئی خواب دیکھے تو اللہ سے پناہ مانگے، اپنے بائیں طرف تین بار تھوکے، اور اس کی بات سے گریز کرے» {cite:muwatta-maruf-1997} [[passage/muwatta-31-2750|موطأ 31:2750]]۔"
