label: { ar: "مراقبة علي لولاته: المفتشون والشكاوى والتأديب", en: "Ali's oversight of his governors: inspectors, complaints and discipline" }
summary:
  ar: "كان علي يتابع ولاته بعدة وسائل: يبعث مفتشين يسألون الناس عن الولاة، ويتلقى تقارير سرية، ويفتح الباب لكل شكوى، ويكتب إليهم بالنصيحة والتوجيه. وقد أدّب واليا بالحبس والضرب بالدرة بعد ثبوت التهمة، ويقول إذا بلغته شكوى: «اللهم إني لم آمرهم أن يظلموا خلقك أو يتركوا حقك» {cite:sallabi-ali-vol1 p. 359}."
  en: "Ali followed his governors through inspectors who questioned people about them, secret reports, an open door for every complaint, and written advice. When a charge against a governor was proven he jailed and whipped him with a rod, and on hearing a complaint he would say, 'O God, I did not order them to wrong Your creation or to leave Your right unpaid' {cite:sallabi-ali-vol1 p. 359}."
