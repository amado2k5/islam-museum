id: event/qarmatians-enter-kufa-375
class: event
kind: other
label: { ar: "دخول القرامطة الكوفة 375هـ", en: "The Qarmatians enter Kufa, 375", es: "Los qarmatianos entran en Kufa, 375", fr: "Les Qarmates entrent à Kufa, 375", ur: "قرمطین کوفہ میں داخل ہوئے، 375", tr: "Karmatiler Hicri 375 yılında Kufa'ya girdiler.", id: "Bangsa Qarmatian memasuki Kufa pada tahun 375 Hijriah." }
summary:
  ar: "في سنة خمس وسبعين وثلثمائة هجم جيش القرامطة في ربيع الأول على الكوفة فهزم الغساوي ابن السوداء أميرها فهرب إلى بغداد، ودخلوها فجعلت فيها يوم الجمعة الراية العلوية ونودي بركوب الناس إلى الطاعة، وبعد ثلاثة أيام أُمر أهلها بقصد صوف ربيعة فوقع حريق بين العلويين والقرامطة أهرق ما بينهم من الدماء {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  en: "In Rabi' I 375 the Qarmatian army struck Kufa, routed its amir al-Ghassawi ibn al-Sawda' who fled to Baghdad, and entered the city; on Friday the 'Alid banner was raised and the people called to obey it, but three days later the townsmen were ordered out toward Suf Rabi'a and a pitched fight between 'Alids and Qarmatians spilled blood {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  es: "En Rabi' I 375, el ejército cármata atacó Kufa, derrotó a su emir al-Ghassawi ibn al-Sawda', quien huyó a Bagdad, y entró en la ciudad; el viernes se izó la bandera 'Alí y se llamó al pueblo a obedecerla, pero tres días después se ordenó a los habitantes de la ciudad que salieran hacia Suf Rabi'a y se derramó sangre en una batalla campal entre 'Alíes y Cármatas {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  fr: "En Rabi' I 375, l'armée qarmate frappa Kufa, mit en déroute son émir al-Ghassawi ibn al-Sawda' qui s'enfuit à Bagdad, et entra dans la ville; le vendredi, la bannière alide fut hissée et le peuple appelé à lui obéir, mais trois jours plus tard, les habitants de la ville reçurent l'ordre de se diriger vers Suf Rabi'a et une bataille rangée entre les Alides et les Qarmates fit couler le sang {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  ur: "ربیع الثانی 375 میں قرمتی فوج نے کوفہ پر حملہ کیا، اس کے امیر الغساوی ابن السودہ کو شکست دی جو بغداد کی طرف بھاگا اور شہر میں داخل ہوا۔ جمعہ کے دن علید کا جھنڈا بلند کیا گیا اور لوگوں کو اس کی اطاعت کی دعوت دی گئی لیکن تین دن بعد شہر والوں کو صوف ربیعہ کی طرف نکلنے کا حکم دیا گیا اور الید اور قرمطیوں کے درمیان ایک گھمسان کی لڑائی ہوئی جس میں خون بہہ گیا۔"
  tr: "Hicri 375 yılında, Karmati ordusu Rabi'ü'l-Evvel ayında Kufa'ya saldırdı ve emiri Gazevi ibn el-Sevde'yi yenerek Bağdat'a kaçmasına neden oldu. Bağdat'a girdiler ve Cuma günü orada Alevi sancağı dikildi ve halkın itaat etmesi gerektiği ilan edildi. Üç gün sonra, halka Rabi'a'daki Sufi mahallesine gitmeleri emredildi ve Aleviler ile Karmatiler arasında kanlı bir çatışma çıktı. {cite:muntazam-ibn-al-jawzi j.7 p.145}"
  id: "Pada tahun 375 H, pasukan Qarmatian menyerang Kufa pada bulan Rabi’ al-Awwal, mengalahkan al-Ghasawi ibn al-Sawda’, pemimpinnya, yang melarikan diri ke Baghdad. Mereka memasuki kota itu dan pada hari Jumat panji Alawiyah dikibarkan di sana, dan diumumkan bahwa rakyat harus taat. Setelah tiga hari, penduduknya diperintahkan untuk pergi ke kawasan Sufi di Rabi’a, dan terjadilah pertikaian antara kaum Alawiyah dan Qarmatian, yang menyebabkan pertumpahan darah di antara mereka. {cite:muntazam-ibn-al-jawzi j.7 p.145}."
