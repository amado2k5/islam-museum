summary:
  ar: "في سنة خمس وسبعين وثلثمائة هجم جيش القرامطة في ربيع الأول على الكوفة فهزم الغساوي ابن السوداء أميرها فهرب إلى بغداد، ودخلوها فجعلت فيها يوم الجمعة الراية العلوية ونودي بركوب الناس إلى الطاعة، وبعد ثلاثة أيام أُمر أهلها بقصد صوف ربيعة فوقع حريق بين العلويين والقرامطة أهرق ما بينهم من الدماء {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  en: "In Rabi' I 375 the Qarmatian army struck Kufa, routed its amir al-Ghassawi ibn al-Sawda' who fled to Baghdad, and entered the city; on Friday the 'Alid banner was raised and the people called to obey it, but three days later the townsmen were ordered out toward Suf Rabi'a and a pitched fight between 'Alids and Qarmatians spilled blood {cite:muntazam-ibn-al-jawzi j.7 p.145}."
