id: event/conquest-of-arwad
class: event
kind: conquest
label: { ar: "فتح أرواد", en: "The Conquest of Arwad", es: "La conquista de Arwad", fr: "La conquête d'Arwad", ur: "ارواد کی فتح", tr: "Arwad'ın Açılışı", id: "Pembukaan Arwad" }
summary:
  ar: "عند البلاذري: فتح جنادة بن أبي أمية في سنة أربع وخمسين أرواد وأسكنها معاوية المسلمين وكان ممن فتحها مجاهد وتُبَيْع بن امرأة كعب الأحبار وبها أقرأ مجاهد تبيعاً القرآن ويُقال إنه أقرأه القرآن برودس — وأرواد جزيرة بالقرب من القسطنطينية."
  en: "In al-Baladhuri: Janada ibn Abi Umayya opened Arwad in year 54 and Mu'awiya settled the Muslims in it; among its openers were Mujahid and Tubay' ibn imra'at Ka'b al-Ahbar — there Mujahid taught Tubay' the Qur'an, though it is said he taught it to him at Rhodes — and Arwad is an island near Constantinople."
  es: "En al-Baladhuri: Janada ibn Abi Umayya abrió Arwad en el año 54 y Mu'awiya asentó a los musulmanes en ella; entre sus fundadores estaban Mujahid y Tubay' ibn imra'at Ka'b al-Ahbar —allí Mujahid enseñó el Corán a Tubay', aunque se dice que se lo enseñó en Rodas— y Arwad es una isla cerca de Constantinopla."
  fr: "Selon al-Baladhuri: Janada ibn Abi Umayya a ouvert Arwad en l'an 54 et Mu'awiya y a installé les musulmans; parmi ses fondateurs figuraient Mujahid et Tubay' ibn imra'at Ka'b al-Ahbar — c'est là que Mujahid a enseigné le Coran à Tubay', bien qu'il soit dit qu'il le lui ait enseigné à Rhodes — et Arwad est une île près de Constantinople."
  ur: "البلاذری میں ہے: جنادہ ابن ابی امیہ نے 54 میں عرواد کو کھولا اور معاویہ نے اس میں مسلمانوں کو آباد کیا۔ اس کے آغاز کرنے والوں میں مجاہد اور طوبیٰ ابن عمرات کعب الاحبار تھے - وہاں مجاہد نے طوبے کو قرآن پڑھایا، حالانکہ کہا جاتا ہے کہ اس نے اسے روڈس میں پڑھایا تھا - اور ارود قسطنطنیہ کے قریب ایک جزیرہ ہے۔"
  tr: "El-Baladhuri'ye göre: Cünede ibn Ebu Ümeyye, elli dördüncü yılda Erved'i fethetti ve Muaviye oraya Müslümanları yerleştirdi. Fethedenler arasında Mücahid ve Ka'b el-Ahber'in karısı Tubey' de vardı. Mücahid, Tubey'e orada Kur'an öğretti ve rivayete göre ona Rodos'ta Kur'an öğretti - Erved ise İstanbul yakınlarındaki bir adadır."
  id: "Menurut Al-Baladhuri: Junadah ibn Abi Umayyah menaklukkan Arwad pada tahun 54 dan Muawiyah menempatkan kaum Muslim di sana. Di antara mereka yang menaklukkannya adalah Mujahid dan Tubay’ ibn istri Ka’b al-Ahbar. Mujahid mengajarkan Al-Qur'an kepada Tubay’ di sana, dan dikatakan bahwa ia mengajarkannya Al-Qur'an di Rhodes — dan Arwad adalah sebuah pulau di dekat Konstantinopel."
