  ar: "عند البلاذري: فتح جنادة بن أبي أمية في سنة أربع وخمسين أرواد وأسكنها معاوية المسلمين وكان ممن فتحها مجاهد وتُبَيْع بن امرأة كعب الأحبار وبها أقرأ مجاهد تبيعاً القرآن ويُقال إنه أقرأه القرآن برودس — وأرواد جزيرة بالقرب من القسطنطينية."
  en: "In al-Baladhuri: Janada ibn Abi Umayya opened Arwad in year 54 and Mu'awiya settled the Muslims in it; among its openers were Mujahid and Tubay' ibn imra'at Ka'b al-Ahbar — there Mujahid taught Tubay' the Qur'an, though it is said he taught it to him at Rhodes — and Arwad is an island near Constantinople."
