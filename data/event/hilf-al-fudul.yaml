id: event/hilf-al-fudul
class: event
kind: treaty
label: { en: "Hilf al-Fudul (the pact of the virtuous)", ar: "حلف الفضول" }
summary:
  en: "A pact sworn in Dhu al-Qa'da at the house of Abdullah ibn Jud'an by the clans of Hashim, al-Muttalib, Asad ibn Abd al-Uzza, Zuhra ibn Kilab and Taym ibn Murra, to stand with anyone wronged in Mecca until his right is restored; the young Muhammad witnessed it and praised it after prophethood."
  ar: "حلف تعاقدت عليه قبائل بنو هاشم وبنو المطلب وأسد بن عبد العزى وزهرة بن كلاب وتيم بن مرة في دار عبد الله بن جدعان في ذي القعدة، على أن لا يجدوا بمكة مظلوماً من أهلها وغيرهم إلا قاموا معه حتى ترد عليه مظلمته؛ شهده النبي وقال بعد الرسالة إنه لو أُدعى به في الإسلام لأجاب.، وعند المسعودي كان حلف الفضول بعد منصرفهم من الفجار مباشرة {cite:muruj-al-dhahab p. 568}"
wings: [time, people]
periods: [period/prophetic-era]
regions: [arabia]
date:
  start: { edtf: "0586~", calendar: julian, precision: year, status: tradition, note: "على أثر حرب الفجار في ذي القعدة (الرحيق ص59)." }
significance:
  ar: "وصفه الكتاب بأن روحه تنافي الحمية الجاهلية؛ وقال النبي بعد الرسالة: لقد شهدت في دار عبد الله بن جدعان حلفاً ما أحب أن لي به حمر النعم، ولو أدعى به في الإسلام لأجبت (الرحيق ص59-60؛ ابن هشام 1/113، 1/135)."
