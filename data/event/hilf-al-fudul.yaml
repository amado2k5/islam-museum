label: { en: "Hilf al-Fudul (the pact of the virtuous)", ar: "حلف الفضول", es: "Hilf al-Fudul (el pacto de los virtuosos)", fr: "Hilf al-Fudul (le pacte des vertueux)", ur: "ہلف الفضول ⁦(نیک لوگوں کا معاہدہ)⁩", tr: "Erdemlilerin İttifakı", id: "Aliansi Orang-orang Berbudi Luhur" }
summary:
  en: "A pact sworn in Dhu al-Qa'da at the house of Abdullah ibn Jud'an by the clans of Hashim, al-Muttalib, Asad ibn Abd al-Uzza, Zuhra ibn Kilab and Taym ibn Murra, to stand with anyone wronged in Mecca until his right is restored; the young Muhammad witnessed it and praised it after prophethood."
  ar: "حلف تعاقدت عليه قبائل بنو هاشم وبنو المطلب وأسد بن عبد العزى وزهرة بن كلاب وتيم بن مرة في دار عبد الله بن جدعان في ذي القعدة، على أن لا يجدوا بمكة مظلوماً من أهلها وغيرهم إلا قاموا معه حتى ترد عليه مظلمته؛ شهده النبي وقال بعد الرسالة إنه لو أُدعى به في الإسلام لأجاب. وعند المسعودي كان حلف الفضول بعد منصرفهم من الفجار مباشرة {cite:muruj-al-dhahab p. 568}"
  es: "Un pacto jurado en Dhu al-Qa'da, en la casa de Abdullah ibn Jud'an, por los clanes de Hashim, al-Muttalib, Asad ibn Abd al-Uzza, Zuhra ibn Kilab y Taym ibn Murra, para apoyar a cualquiera que haya sido agraviado en La Meca hasta que se le restituya su derecho; el joven Muhammad fue testigo de él y lo elogió después de su profecía."
  fr: "Un pacte fut scellé à Dhu al-Qa'da, dans la maison d'Abdullah ibn Jud'an, par les clans de Hashim, al-Muttalib, Asad ibn Abd al-Uzza, Zuhra ibn Kilab et Taym ibn Murra, pour soutenir toute personne lésée à La Mecque jusqu'à ce que ses droits soient rétablis; le jeune Muhammad en fut témoin et le loua après sa prophétie."
  ur: "ذوالقعدہ میں عبداللہ بن جدعان کے گھر میں قبیلہ ہاشم، المطلب، اسد بن عبد العزہ، زہرہ بن کلاب اور تیم بن مرہ کے درمیان حلف لیا گیا، مکہ میں کسی بھی مظلوم کے ساتھ اس کا حق بحال ہونے تک کھڑے رہنے کا۔ نوجوان محمد نے اسے دیکھا اور نبوت کے بعد اس کی تعریف کی۔"
  tr: "Beni Haşim, Beni el-Muttalib, Esad ibn Abdül-Uzza, Zuhrah ibn Kilab ve Taym ibn Murrah kabileleri, Zülkide'de Abdullah ibn Jud'an'ın evinde bir araya gelerek, Mekke'de haksızlığa uğramış herhangi birini, gerek yerli gerekse başkalarından, mağduriyeti giderilene kadar yanında durarak karşılayacaklarına dair bir ittifak kurdular. Peygamberimiz bu ittifaka şahit oldu ve peygamberliğinden sonra, İslam'da bu ittifakı desteklemesi istenirse karşılık vereceğini söyledi. El-Mas'udi'ye göre, Hilf el-Fudul (Erdemlilerin Anlaşması) Ficar'dan ayrılmalarının hemen ardından gerçekleşti. {kaynak:muruj-al-dhahab s. 568}"
  id: "Sebuah persekutuan yang dibentuk oleh suku Banu Hashim, Banu al-Muttalib, Asad ibn Abd al-Uzza, Zuhrah ibn Kilab, dan Taym ibn Murrah di rumah Abdullah ibn Jud'an pada bulan Dzul Qi'dah, menetapkan bahwa mereka tidak akan menemukan siapa pun di Mekah, baik penduduknya maupun orang lain, yang telah dizalimi, tanpa berdiri di sisinya sampai keluhannya diselesaikan. Nabi menyaksikan persekutuan ini dan berkata setelah kenabiannya bahwa jika beliau diminta untuk menegakkannya dalam Islam, beliau akan menanggapinya. Menurut al-Mas'udi, Hilf al-Fudul (Perjanjian Orang-orang Saleh) terjadi segera setelah mereka meninggalkan Fijar. {cite:muruj-al-dhahab hlm. 568}"
