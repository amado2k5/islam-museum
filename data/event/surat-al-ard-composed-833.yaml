  ur: "خوارزمی نے صورة الارض لکھی جس میں معروف دنیا کے مقامات کے محل وقوع دیے اور بطلیموس کی اصلاح کی، نیز المأمون کے حکم پر بننے والی عالمی نقشے میں بھی حصہ لیا {cite:britannica-al-khwarizmi}."
