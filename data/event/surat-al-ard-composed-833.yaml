label: { ar: "تصنيف «صورة الأرض»", en: "Ṣūrat al-arḍ composed", es: "Ṣūrat al-arḍ compuesto", fr: "Ṣūrat al-arḍ composé", ur: "صورۃ الارد پر مشتمل ہے۔", tr: "Dünya sınıflandırmasının görüntüsü", id: "Klasifikasi Citra Bumi" }
summary:
  ar: "وضع الخوارزمي كتاب «صورة الأرض» مبنياً على جغرافية بطليموس مع قيم أصح لطول البحر المتوسط ومواضع مدن آسيا وأفريقيا، وأسهم كذلك في خريطة العالم التي أمر بها المأمون {cite:britannica-al-khwarizmi}."
  en: "Al-Khwārizmī wrote the Ṣūrat al-arḍ (Image of the Earth), giving coordinates of the known world's localities that corrected Ptolemy's Mediterranean length and Asian and African cities, and he helped build al-Maʾmūn's world map {cite:britannica-al-khwarizmi}."
  ur: "خوارزمی نے صورة الارض لکھی جس میں معروف دنیا کے مقامات کے محل وقوع دیے اور بطلیموس کی اصلاح کی، نیز المأمون کے حکم پر بننے والی عالمی نقشے میں بھی حصہ لیا {cite:britannica-al-khwarizmi}."
  es: "Al-Khwārizmī escribió el Ṣūrat al-arḍ (Imagen de la Tierra), que proporciona coordenadas de las localidades conocidas del mundo, corrigiendo la longitud del Mediterráneo y las ciudades asiáticas y africanas de Ptolomeo, y ayudó a construir el mapamundi de al-Maʾmūn {cite:britannica-al-khwarizmi}."
  fr: "Al-Khwārizmī a écrit le Ṣūrat al-arḍ (Image de la Terre), donnant les coordonnées des localités du monde connu qui corrigeaient la longueur méditerranéenne de Ptolémée et les villes asiatiques et africaines, et il a aidé à construire la carte du monde d'al-Maʾmūn {cite:britannica-al-khwarizmi}."
  tr: "El-Harezmi, Akdeniz'in uzunluğu ve Asya ile Afrika'daki şehirlerin konumları için daha doğru değerler içeren Batlamyus'un coğrafyasına dayanarak \"Dünyanın Görüntüsü\" adlı kitabı yazdı ve ayrıca El-Ma'mun'un sipariş ettiği dünya haritasına da katkıda bulundu."
  id: "Al-Khwarizmi menulis buku “Citra Bumi” berdasarkan geografi Ptolemy dengan nilai yang lebih akurat untuk panjang Laut Mediterania dan lokasi kota-kota di Asia dan Afrika, dan dia juga berkontribusi pada peta dunia yang dipesan oleh Al-Ma’mun {cite:britannica-al-khwarizmi}."
