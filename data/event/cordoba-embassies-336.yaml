label: { ar: "سفارات أوروبا إلى الناصر بالزهراء", en: "Embassies from Europe to al-Nasir at Madinat al-Zahra", es: "Embajadas de Europa en al-Nasir en Madinat al-Zahra", fr: "Ambassades d'Europe à al-Nasir à Madinat al-Zahra", ur: "مدینہ الزہرہ میں یورپ سے النصیر کے سفارت خانے" }
summary:
  ar: "في سنة ست وثلاثين وثلاثمائة وفدت على الناصر عبد الرحمن رسل صاحب قسطنطينية قسطنطين بن ليون بهديته فاحتفل لقدومهم في يوم مشهود بالزهراء؛ ركبت العساكر بالسلاح في أكمل شكة وزُيّن القصر الخلافي بأنواع الزينة وأصناف الستور وجُمل السرير الحلواني بمقاعد الأبناء والإخوة والأعمام والقرابة، ودخل الرسل فهالهم ما رأوه ودفعوا كتاب ملكهم وهو في رقّ مصبوغ لوناً سماوياً مكتوب بالذهب بالخط الإغريقي وعليه طابع ذهب وزنه أربعة مثاقيل على الوجه الواحد منه صورة المسيح وعلى الآخر صورة قسطنطين وولده، وأمر الأعلام أن يخطبوا فوجموا فقام منذر بن سعيد البلوطي من غير استعداد ولا روية فخطب وأنشد شعراً ارتجله ففاز بفخر المجلس وولاه الناصر القضاء بعدها، وبعث الناصر مع الرسل مشحم بن هذيل بهدية حافلة فأحكم ما شاء وجاءت معه رسل قسطنطين، ثم جاء رسول من ملك الصقالبة هوتو ورسول آخر من ملك الألمان ورسول من ملك الإفرنجة وراء البرت أوه ورسول من ملك الإفرنجة بقاصية المشرق كلدة، فاحتفل الناصر لقدومهم وبعث مع رسول الصقالبة ربيعاً الأسقف إلى ملكهم هوتو {cite:nafh-tib-maqqari p. 400-402}."
  en: "In 336 al-Nasir Abd al-Rahman staged a reception at Madinat al-Zahra for the envoys of Constantine VII — a sky-blue charter in gold Greek script sealed with four-mithqal gold — where Mundhir ibn Sa'id's impromptu sermon won him the qadiship; then followed embassies from Otto king of the Saqaliba, the German king, and the Frankish kings Hugh and Childebert, to whom al-Nasir sent back Rabi' the bishop {cite:nafh-tib-maqqari p. 400-402}."
  es: "En 336, al-Nasir Abd al-Rahman ofreció una recepción en Madinat al-Zahra para los enviados de Constantino VII —una carta azul celeste en escritura griega dorada sellada con oro de cuatro mithqal— donde el sermón improvisado de Mundhir ibn Sa'id le valió el cadí; luego siguieron las embajadas de Otón, rey de los Saqaliba, el rey alemán y los reyes francos Hugo y Childeberto, a quienes al-Nasir envió de vuelta al obispo Rabi' {cite:nafh-tib-maqqari p. 400-402}."
  fr: "En 336, al-Nasir Abd al-Rahman organisa une réception à Madinat al-Zahra pour les envoyés de Constantin VII — une charte bleu ciel en écriture grecque dorée scellée avec quatre mithqal d'or — où le sermon impromptu de Mundhir ibn Sa'id lui valut le qadiship; suivirent ensuite les ambassades du roi ottoman des Saqaliba, du roi allemand et des rois francs Hugues et Childebert, auxquels al-Nasir renvoya l'évêque Rabi' {cite:nafh-tib-maqqari p. 400-402}."
  ur: "336 میں الناصر عبدالرحمٰن نے قسطنطین VII کے ایلچیوں کے لیے مدینۃ الزہرہ میں ایک استقبالیہ کا اہتمام کیا - سونے کے یونانی رسم الخط میں ایک آسمانی نیلا چارٹر جس پر چار مثقال سونے کی مہر لگی ہوئی تھی - جہاں منذر بن سعید کے فوری خطبہ نے انھیں قادیانیت حاصل کی۔ اس کے بعد صقلیبہ کے بادشاہ اوٹو، جرمن بادشاہ، اور فرانک کے بادشاہوں ہیو اور چائلڈبرٹ کے سفارت خانوں کی پیروی کی، جنہیں النصیر نے ربیع کو بشپ واپس بھیجا تھا۔ 400-402}۔"
