summary:
  ar: "في سنة ست وثلاثين وثلاثمائة وفدت على الناصر عبد الرحمن رسل صاحب قسطنطينية قسطنطين بن ليون بهديته فاحتفل لقدومهم في يوم مشهود بالزهراء؛ ركبت العساكر بالسلاح في أكمل شكة وزُيّن القصر الخلافي بأنواع الزينة وأصناف الستور وجُمل السرير الحلواني بمقاعد الأبناء والإخوة والأعمام والقرابة، ودخل الرسل فهالهم ما رأوه ودفعوا كتاب ملكهم وهو في رقّ مصبوغ لوناً سماوياً مكتوب بالذهب بالخط الإغريقي وعليه طابع ذهب وزنه أربعة مثاقيل على الوجه الواحد منه صورة المسيح وعلى الآخر صورة قسطنطين وولده، وأمر الأعلام أن يخطبوا فوجموا فقام منذر بن سعيد البلوطي من غير استعداد ولا روية فخطب وأنشد شعراً ارتجله ففاز بفخر المجلس وولاه الناصر القضاء بعدها، وبعث الناصر مع الرسل مشحم بن هذيل بهدية حافلة فأحكم ما شاء وجاءت معه رسل قسطنطين، ثم جاء رسول من ملك الصقالبة هوتو ورسول آخر من ملك الألمان ورسول من ملك الإفرنجة وراء البرت أوه ورسول من ملك الإفرنجة بقاصية المشرق كلدة، فاحتفل الناصر لقدومهم وبعث مع رسول الصقالبة ربيعاً الأسقف إلى ملكهم هوتو {cite:nafh-tib-maqqari p. 400-402}."
  en: "In 336 al-Nasir Abd al-Rahman staged a reception at Madinat al-Zahra for the envoys of Constantine VII — a sky-blue charter in gold Greek script sealed with four-mithqal gold — where Mundhir ibn Sa'id's impromptu sermon won him the qadiship; then followed embassies from Otto king of the Saqaliba, the German king, and the Frankish kings Hugh and Childebert, to whom al-Nasir sent back Rabi' the bishop {cite:nafh-tib-maqqari p. 400-402}."
  es: "En 336, al-Nasir Abd al-Rahman ofreció una recepción en Madinat al-Zahra para los enviados de Constantino VII —una carta azul celeste en escritura griega dorada sellada con oro de cuatro mithqal— donde el sermón improvisado de Mundhir ibn Sa'id le valió el cadí; luego siguieron las embajadas de Otón, rey de los Saqaliba, el rey alemán y los reyes francos Hugo y Childeberto, a quienes al-Nasir envió de vuelta al obispo Rabi' {cite:nafh-tib-maqqari p. 400-402}."
  fr: "En 336, al-Nasir Abd al-Rahman organisa une réception à Madinat al-Zahra pour les envoyés de Constantin VII — une charte bleu ciel en écriture grecque dorée scellée avec quatre mithqal d'or — où le sermon impromptu de Mundhir ibn Sa'id lui valut le qadiship; suivirent ensuite les ambassades du roi ottoman des Saqaliba, du roi allemand et des rois francs Hugues et Childebert, auxquels al-Nasir renvoya l'évêque Rabi' {cite:nafh-tib-maqqari p. 400-402}."
  ur: "336 میں الناصر عبدالرحمٰن نے قسطنطین VII کے ایلچیوں کے لیے مدینۃ الزہرہ میں ایک استقبالیہ کا اہتمام کیا - سونے کے یونانی رسم الخط میں ایک آسمانی نیلا چارٹر جس پر چار مثقال سونے کی مہر لگی ہوئی تھی - جہاں منذر بن سعید کے فوری خطبہ نے انھیں قادیانیت حاصل کی۔ اس کے بعد صقلیبہ کے بادشاہ اوٹو، جرمن بادشاہ، اور فرانک کے بادشاہوں ہیو اور چائلڈبرٹ کے سفارت خانوں کی پیروی کی، جنہیں النصیر نے ربیع کو بشپ واپس بھیجا تھا۔ 400-402}۔"
  tr: "Hicri 336 yılında, Konstantinopolis hükümdarı Konstantin'in elçileri, hediyeleriyle birlikte Nasır Abdülrahman'ın sarayına geldiler ve Halife, Zehra'da unutulmaz bir günde onların gelişini kutladı. Askerler tam zırhlarıyla atlarına bindiler ve Halife'nin sarayı çeşitli süslemeler ve perdelerle donatıldı. Kraliyet yatağı, oğulları, kardeşleri, amcaları ve akrabaları için yerlerle döşendi. Elçiler içeri girdiler ve gördükleri karşısında hayrete düştüler. Kralın mektubunu sundular; mektup gök mavisi renkte boyanmış parşömen üzerine altın harflerle Yunanca yazılmış ve dört mithkal ağırlığında altın bir mühür taşıyordu. Bir tarafında İsa'nın, diğer tarafında ise Konstantin ve oğlunun resmi vardı. Kral, ileri gelenlere konuşmalarını emretti, ancak onlar sessiz kaldılar. Sonra, Mundhir ibn Sa'id el-Baluti, hiçbir hazırlık veya düşünme olmaksızın ayağa kalktı ve doğaçlama olarak yazdığı bir konuşma yaptı ve şiirler okudu. Meclisin saygısını kazandı ve bundan sonra el-Nasır onu kadı olarak atadı. El-Nasır, Muşham ibn Hudeyl'i elçilerle birlikte gönderdi ve onlar da uygun gördüğü şekilde düzenleme yaptılar. Konstantin'in elçileri onunla birlikte geldi. Sonra Slavların kralı Hutu'dan bir elçi, Almanların kralından bir elçi, Albert'in ötesindeki Frankların kralından bir elçi ve uzak doğudaki Frankların kralı Kaldea'dan bir elçi geldi. El-Nasır onların gelişini kutladı ve bir elçiyle birlikte Slavlar, piskoposu kralları Hutu'ya gönderdi. {Kaynak: Nafh-tib-makqkari s. 400-402}"
  id: "Pada tahun 336 H, utusan dari Konstantinus, penguasa Konstantinopel, tiba di istana Al-Nasir Abd Al-Rahman dengan membawa hadiah, dan beliau merayakan kedatangan mereka pada hari yang istimewa di Al-Zahra. Para prajurit menaiki kuda mereka dengan mengenakan baju zirah lengkap, dan istana Khalifah dihiasi dengan berbagai dekorasi dan tirai. Ranjang kerajaan dilengkapi dengan tempat duduk untuk putra, saudara laki-laki, paman, dan kerabat. Para utusan masuk dan takjub dengan apa yang mereka lihat. Mereka mempersembahkan surat raja mereka, yang ditulis di atas perkamen berwarna biru langit, ditulis dengan tinta emas dalam aksara Yunani, dan memiliki segel emas seberat empat mithqal. Di satu sisi terdapat gambar Kristus, dan di sisi lain, gambar Konstantinus dan putranya. Raja memerintahkan para pejabat untuk berbicara, tetapi mereka terdiam. Kemudian, Mundhir ibn Sa'id al-Baluti bangkit tanpa persiapan atau pertimbangan dan menyampaikan pidato serta membacakan puisi yang telah ia ciptakan secara spontan. Ia memperoleh kehormatan dari majelis, dan al-Nasir kemudian mengangkatnya menjadi hakim. Al-Nasir mengutus Mushham ibn Hudhayl bersama para utusan, yang mengaturnya sesuai keinginannya. Para utusan Konstantinus tiba bersamanya. Kemudian datang seorang utusan dari raja Slavia, Hutu, seorang lagi dari raja Jerman, seorang utusan dari raja Frank di seberang Albert, dan seorang utusan dari raja Frank di Timur Jauh, Chaldea. Al-Nasir merayakan kedatangan mereka dan bersama seorang utusan mengirim uskup Slavia kepada raja mereka, Hutu {cite:nafh-tib-maqqari hlm. 400-402}."
