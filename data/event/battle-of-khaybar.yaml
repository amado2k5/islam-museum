label: { en: "The Conquest of Khaybar", ar: "غزوة خيبر" }
summary:
  en: "In Muharram 7 AH (May-June 628 CE), the Prophet marched with 1,400 companions of Hudaybiyya against the formidable Jewish oasis of Khaybar; following fierce assaults and the capture of eight major fortresses (including Na'im, al-Sa'b ibn Mu'adh, al-Zubayr, Ubayy, and al-Qamus), the Jewish leaders surrendered and agreed to cultivate the land for half of its produce."
  ar: "في المحرم سنة 7هـ (مايو 628م)، سار النبي في ألف وأربعمائة من أصحاب بيعة الرضوان لفتح واحة خيبر المنيعة؛ فحوصرت حصونها الثمانية حصناً حصناً حتى فتحها الله على يدي علي بن أبي طالب بقتله مرحباً، ونزل أهل خيبر على الصلح بحقن دمائهم ومزارعة أرضهم على نصف ما يخرج من ثمر وزرع."
