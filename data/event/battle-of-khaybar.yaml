label: { en: "The Conquest of Khaybar", ar: "غزوة خيبر" }
summary:
  ar: "في المحرم سنة 7هـ، مايو ويونيو 628م، سار النبي محمد إلى واحة خيبر التي تبعد نحو 150 كيلومتراً عن المدينة، فحاصر المسلمون حصونها واحداً بعد آخر حتى استسلم اليهود على أن يبقوا في أرضهم ويدفعوا نصف غلتها. وتعرض دائرة المعارف الإسلامية دوافع الحملة عند كايتاني ومونتغمري وات وهيكل، منسوبة إلى أصحابها، وتذكر أن عمر بن الخطاب راجع هذا الترتيب سنة 20هـ. وتجعل المقالة أهمية الحدث في الاتفاق نفسه الذي رسم نمط العلاقة بين المسلمين والشعوب غير المسلمة التي حكموها."
  en: "In Muharram 7 AH, May to June 628 CE, the Prophet Muhammad marched on the oasis of Khaybar, about 150 km from Medina. The Muslims besieged its strongholds one after another until the Jewish inhabitants capitulated and agreed to stay on their land and hand over half its produce. The Encyclopaedia of Islam reports the motives given by Caetani, Montgomery Watt and Haykal, each attributed to its author, and notes that Umar revised the arrangement in 20 AH. It locates the event's importance in the pact itself, which set the pattern for relations between Muslims and the non-Muslim peoples they later ruled."
  ur: "محرم 7 ھ یعنی مئی جون 628ء میں نبی محمد مدینہ سے تقریباً 150 کلومیٹر دور نخلستان خیبر کی طرف روانہ ہوئے۔ مسلمانوں نے اس کے قلعوں کا ایک کے بعد ایک محاصرہ کیا یہاں تک کہ یہودی باشندوں نے ہتھیار ڈالے اور اپنی زمین پر رہنے اور اس کی آدھی پیداوار دینے پر راضی ہوئے۔ دائرۃ المعارف اسلامیہ کایتانی، منٹگمری واٹ اور ہیکل کے بیان کردہ محرکات ان کے ناموں سے نقل کرتا ہے اور بتاتا ہے کہ عمر نے بیس ہجری میں اس انتظام پر نظر ثانی کی۔ مضمون اس واقعے کی اہمیت خود معاہدے میں دیکھتا ہے جس نے مسلمانوں اور بعد میں ان کے زیر حکومت آنے والی غیر مسلم اقوام کے تعلقات کا انداز طے کیا۔"
