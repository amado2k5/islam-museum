  did_you_know:
    ar: "في محرم سنة ٧هـ سار النبي في أصحاب بيعة الرضوان لفتح واحة خيبر المنيعة، فتتابعت حصونها حتى افتُتحت كما في الصحيحين."
    en: "In Muharram of year 7 the Prophet marched with the companions of the Ridwan pledge on the fortified oasis of Khaybar, whose strongholds fell one by one, as the two Sahihs tell."
    ur: "محرم ساتویں ہجری میں نبی بیعتِ رضوان کے اصحاب کے ساتھ خیبر کی محصور واحہ پر چلے، اور صحیحین کے بیان میں اس کے قلعے ایک ایک کرکے فتح ہوئے۔"
