id: event/antioch-earthquake-455
class: event
kind: other
label: { ar: "زلزلة أنطاكية واللاذقية", en: "The earthquake of Antioch and Latakia", es: "El terremoto de Antioquía y Latakia", fr: "Le tremblement de terre d'Antioche et de Lattaquié", ur: "انطاکیہ اور لطاکیہ کا زلزلہ", tr: "Antakya ve Latakia depremi", id: "Gempa bumi Antiokhia dan Latakia" }
summary:
  ar: "في سنة خمس وخمسين وأربعمائة كانت زلزلة بأنطاكية واللاذقية وقطعة من بلاد الروم، وفي ذي الحجة منها كانت زلزلة بأرض واسط لبثت طويلًا، ووقع الوباء بمضر فكان يخرج منها في اليوم الواحد نحو ألف جنازة {cite:muntazam-ibn-al-jawzi j.8 p.566}."
  en: "In 455 an earthquake struck Antioch, Latakia and a tract of the Roman lands; in Dhu'l-Hijja Wasit shook for a long while, and plague in Egypt took near a thousand funerals a day {cite:muntazam-ibn-al-jawzi j.8 p.566}."
  es: "En 455 un terremoto azotó Antioquía, Latakia y una extensión de tierras romanas; en Dhu'l-Hijja Wasit tembló durante mucho tiempo, y la peste en Egipto causó cerca de mil funerales al día {cite:muntazam-ibn-al-jawzi j.8 p.566}."
  fr: "En 455, un tremblement de terre frappa Antioche, Lattaquié et une partie des terres romaines; en Dhu'l-Hijja, Wasit trembla pendant longtemps, et la peste en Égypte fit près de mille enterrements par jour {cite:muntazam-ibn-al-jawzi j.8 p.566}."
  ur: "455 میں انطاکیہ، لاطاکیہ اور رومی سرزمین کے ایک حصے میں زلزلہ آیا۔ ذوالحجہ میں وسط کافی دیر تک لرزتا رہا اور مصر میں طاعون نے ایک دن میں ایک ہزار کے قریب جنازے اٹھائے"
  tr: "Hicri 455 yılında Antakya, Latakia ve Roma topraklarının bir kısmında deprem oldu. Aynı yılın Zilhicce ayında ise Wasit bölgesinde uzun süren bir deprem meydana geldi. Mudar'da veba salgını çıktı ve bir günde yaklaşık bin cenaze töreni yapıldı. {cite:muntazam-ibn-al-jawzi j.8 p.566}"
  id: "Pada tahun 455 H, terjadi gempa bumi di Antiokhia, Latakia, dan sebagian wilayah Romawi. Pada bulan Dzul Hijjah tahun itu, terjadi gempa bumi di tanah Wasit yang berlangsung lama. Wabah penyakit merebak di Mudar, dan sekitar seribu jenazah dimakamkan di sana dalam satu hari. {cite:muntazam-ibn-al-jawzi j.8 p.566}."
