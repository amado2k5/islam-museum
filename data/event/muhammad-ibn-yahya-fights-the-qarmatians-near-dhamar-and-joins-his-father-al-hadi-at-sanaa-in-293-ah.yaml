id: "event/muhammad-ibn-yahya-fights-the-qarmatians-near-dhamar-and-joins-his-father-al-hadi-at-sanaa-in-293-ah"
class: event
kind: other
label:
  ar: "محمد بن يحيى يحارب القرامطة بناحية ذمار ثم يلحق بأبيه في صنعاء، 293هـ، ص392"
  en: "Muhammad ibn Yahya fights the Qarmatians in the district of Dhamar and then joins his father in Sanaa, in 293 AH, p. 392"
  ur: "محمد بن یحیی ذمار کے علاقے میں قرامطہ سے لڑتا ہے، پھر صنعاء میں اپنے والد کے پاس پہنچتا ہے، 293ھ، ص392"
  es: "Muhammad ibn Yahya lucha contra los cármatas en el distrito de Dhamar y luego se reúne con su padre en Sanaa, en el año 293 de la Hégira, pág. 392."
  fr: "Muhammad ibn Yahya combat les Qarmates dans le district de Dhamar puis rejoint son père à Sanaa, en 293 AH, p. 392"
  tr: "Muhammed ibn Yahya, Damar bölgesinde Karmatilerle savaştıktan sonra, Hicri 293 yılında babasının yanına Sana'a'ya gitti (s. 392)."
  id: "Muhammad ibn Yahya berperang melawan Qarmatian di wilayah Dhamar, kemudian bergabung dengan ayahnya di Sana'a, 293 H, hlm. 392"
summary:
  ar: "حارب محمد بن يحيى القرامطة في ناحية ذمار، فلما تقدم القرامطة نحو ذمار خرج، فلحق بأبيه الهادي في صنعاء."
  en: "Muhammad ibn Yahya fought the Qarmatians in the Dhamar district. When they advanced on Dhamar he left and joined his father al-Hadi at Sanaa."
  ur: "محمد بن یحیی ذمار کے علاقے میں قرامطہ سے لڑا، جب قرامطہ ذمار کی طرف بڑھے تو وہ نکل کر صنعاء میں اپنے والد ہادی کے پاس پہنچ گیا۔"
  es: "Muhammad ibn Yahya combatió contra los cármatas en el distrito de Dhamar. Cuando estos avanzaron sobre Dhamar, él se retiró y se reunió con su padre al-Hadi en Sanaa."
  fr: "Muhammad ibn Yahya combattit les Qarmates dans le district de Dhamar. Lorsque ces derniers avancèrent sur Dhamar, il partit et rejoignit son père al-Hadi à Sanaa."
  tr: "Muhammed ibn Yahya, Damar bölgesinde Karmatilerle savaştı. Karmatiler Damar'a doğru ilerleyince, oradan ayrılıp babası el-Hadi'nin yanına, Sana'a'ya gitti."
  id: "Muhammad ibn Yahya berperang melawan kaum Qarmatian di wilayah Dhamar. Ketika kaum Qarmatian maju menuju Dhamar, ia pergi dan bergabung dengan ayahnya, al-Hadi, di Sana'a."
