      ar: "يعرض الصلابي الحكم بوصفه قضاء علي بالجلد ثم الرجم، ويستشهد بالبخاري وأحمد في لفظ أن علياً قال: «جلدتها بكتاب الله، ورجمتها بسنة رسول الله» {cite:sallabi-ali-vol1 p. 304}، ويصف الحكم بأنه حكم قضائي لعلي وأنه مختلف فيه بين الفقهاء {cite:sallabi-ali-vol1 p. 304}."
      en: "Al-Sallabi presents the ruling as Ali's judgment, citing Bukhari and Ahmad for the wording that the flogging was by the Book of God and the stoning by the sunna of the Prophet {cite:sallabi-ali-vol1 p. 304}."
