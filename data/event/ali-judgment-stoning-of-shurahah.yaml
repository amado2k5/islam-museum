id: event/ali-judgment-stoning-of-shurahah
class: event
kind: court-ruling
label: { ar: "حكم علي بجلد شراحة ورجمها بعد اعترافها بالزنا", en: "Ali's judgment: Shurahah flogged and stoned after confessing zina" }
summary:
  ar: "أقرّت شراحة بالزنا وكان بها حمل، فجلدها علي يوم الخميس مائة جلدة ورجمها يوم الجمعة، وقال إن الرجم سنة سنها رسول الله، وإن أول من يرجم عند الاعتراف الإمام. ويعرض الصلابي الحكم بوصفه قضاء لعلي، ويذكر أن الجمع بين الجلد والرجم مختلف فيه بين الفقهاء {cite:sallabi-ali-vol1 p. 303}{cite:sallabi-ali-vol1 p. 304}."
  en: "Shurahah confessed to zina while pregnant; Ali flogged her a hundred lashes on Thursday and stoned her on Friday, saying stoning is the Prophet's sunna. The book notes that combining flogging with stoning is disputed among jurists."
