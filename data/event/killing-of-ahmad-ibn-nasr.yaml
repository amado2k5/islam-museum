label: { en: "Killing of Ahmad ibn Nasr al-Khuza'i", ar: "قتل أحمد بن نصر الخزاعي", es: "Asesinato de Ahmad ibn Nasr al-Khuza'i", fr: "Meurtre d'Ahmad ibn Nasr al-Khuza'i", ur: "احمد بن نصر الخزاعی کا قتل", tr: "Ahmed ibn Nasr el-Khuza'i öldürüldü", id: "Ahmad bin Nasr al-Khuza'i terbunuh" }
summary:
  ar: "في سنة إحدى وثلاثين قتل الواثق أحمد بن نصر الخزاعي، وكان من أهل الحديث قائماً بالأمر بالمعروف، أحضر من بغداد إلى سامراء مقيداً وسئل عن القرآن فقال ليس بمخلوق وعن الرؤية فقال كذا جاءت الرواية وروى الحديث فقال له الواثق تكذب فقال بل تكذب أنت، فاستشار فقهاء المعتزلة فقالوا هو حلال الضرب فدعا الواثق بالسيف وقال إذا قمت إليه فلا يقومن أحد معي فإني أحتسب خطاي إلى هذا الكافر الذي يعبد رباً لا نعبده، فضرب عنقه بنفسه وهو مقيد على النطع وحمل رأسه إلى بغداد فصلب وصلبت جثته بسر من رأى واستمر ذلك ست سنين إلى أن ولي المتوكل فأنزله ودفنه، وكتب في أذنه ورقة هذا رأس أحمد بن نصر بن مالك دعاه عبد الله الإمام هارون إلى القول بخلق القرآن ونفي التشبيه فأبى إلا المعاندة فعجله الله إلى ناره، وذكر الموكل بالرأس أنه رآه بالليل يستدير إلى القبلة بوجهه فيقرأ سورة يس بلسان طلق {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  en: "In 231 al-Wathiq killed Ahmad ibn Nasr al-Khuza'i, a hadith man devoted to commanding right. Brought shackled from Baghdad to Samarra, he refused createdness, transmitted the vision hadith — 'you lie?' — 'you lie!' — and the Mu'tazili jurists ruled his blood lawful. Al-Wathiq struck his neck himself upon the nat'a, his head was crucified at Baghdad and his body at Sur man Ra'a for six years until al-Mutawakkil buried him; a note in its ear named him and his charge, and the appointed watchman swore he saw the head turn to the qibla and recite Ya-Sin {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  es: "En 231, al-Wathiq mató a Ahmad ibn Nasr al-Khuza'i, un hombre de hadices devoto de la justicia. Llevado encadenado desde Bagdad a Samarra, rechazó la creación, transmitió el hadiz de la visión —'¿Mientes?'— ¡Mientes!— y los juristas mutazilíes dictaminaron que su sangre era lícita. Al-Wathiq se golpeó el cuello él mismo contra el nat'a, su cabeza fue crucificada en Bagdad y su cuerpo en Sur man Ra'a durante seis años hasta que al-Mutawakkil lo enterró; una nota en su oído lo nombró a él y a su cargo, y el vigía designado juró haber visto la cabeza girar hacia la qibla y recitar Ya-Sin {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  fr: "En 231, al-Wathiq tua Ahmad ibn Nasr al-Khuza'i, un érudit du hadith dévoué à la justice. Enchaîné, il fut amené de Bagdad à Samarra, niant la création, et transmit le hadith de la vision: « Tu mens ? » – « Tu mens ! » – et les juristes mu'tazilites jugèrent son sang licite. Al-Wathiq se frappa lui-même la nuque sur le nat'a; sa tête fut crucifiée à Bagdad et son corps à Sur man Ra'a pendant six ans, jusqu'à ce qu'al-Mutawakkil l'inhume. Un billet glissé dans son oreille mentionnait son nom et celui de la personne chargée de sa protection, et le gardien désigné jura avoir vu la tête se tourner vers la qibla et réciter Ya-Sin (voir: Tarikh-Khulafa-Minhaj-1434, p. 529-530)."
  ur: "231 میں الوثیق نے احمد بن نصر الخزاعی کو قتل کر دیا، جو ایک حدیثی آدمی تھا جو حکم حق کے لیے وقف تھا۔ بغداد سے بیڑیوں میں جکڑا کر سامرہ لایا، اس نے خلقت سے انکار کیا، حدیث کی رویت منتقل کی - 'تم جھوٹ بولتے ہو؟' - 'تم جھوٹ بولتے ہو!' اور معتزلی فقہاء نے اس کے خون کو حلال قرار دیا۔ الوثیق نے خود اس کی گردن نعت پر ماری، اس کا سر بغداد میں مصلوب کیا گیا اور اس کے جسم کو سور من راع میں چھ سال تک رکھا گیا یہاں تک کہ متوکل نے اسے دفن کر دیا۔ اس کے کان میں ایک نوٹ اس کا اور اس کے انچارج کا نام تھا، اور مقرر کردہ چوکیدار نے قسم کھائی کہ اس نے سر کو قبلہ کی طرف پھیرتے ہوئے یا سین کا ورد کرتے ہوئے دیکھا۔ 529-530}۔"
  tr: "Hicri 31 yılında, Vahık, hadis âlimi ve iyiliği emredip kötülüğü yasaklamayı savunan Ahmed ibn Nasr el-Huzai'yi öldürdü. Bağdat'tan zincire vurularak Samarra'ya getirildi ve Kur'an hakkında sorguya çekildi. Kur'an'ın yaratılmadığını söyledi. Allah'ın görümü hakkında sorulduğunda, \"Rivayet böyle diyor\" dedi ve hadisi anlattı. Vahık onu yalan söylemekle suçladı. O da, \"Aslında yalan söyleyen sensin\" diye cevap verdi. Vahık, Mu'tezile âlimlerine danıştı ve onlar da onu öldürmenin caiz olduğunu söylediler. Vahık kılıcı istedi ve \"Ona gittiğimde kimse benimle durmasın, çünkü tapmadığımız bir tanrıya tapan bu kâfire doğru attığım adımları bir tür ibadet sayıyorum\" dedi. Sonra onu celladın hasırına bağlıyken kendi eliyle başını kesti. Başı Bağdat'a götürülüp çarmıha gerildi ve cesedi Samarra'da sergilendi. Bu durum, el-Mutavakkil iktidara gelene kadar altı yıl sürdü. El-Mutavakkil onu indirdi ve gömdü, kulağına bir kağıt parçasına şunları yazdı: \"Bu, Ahmed ibn Nasr ibn Malik'in başıdır. İmam Harun Abdullah onu Kur'an'ın yaratılmışlığını savunmaya ve insan biçimliliği reddetmeye çağırdı, ancak o inatçılığından başka bir şey yapmadı. Bu yüzden Allah onu ateşine götürdü.\" Başın sorumlusu, onu geceleri yüzünü kıbleye çevirip Yasin Suresi'ni akıcı bir şekilde okurken gördüğünü bildirdi. {cite:tarikh-khulafa-minhaj-1434 s. 529-530}"
  id: "Pada tahun 31 Hijriah, al-Wathiq membunuh Ahmad ibn Nasr al-Khuza'i, seorang ulama Hadits dan pendukung amar ma'ruf dan nahi munkar. Ia dibawa dari Baghdad ke Samarra dalam keadaan terikat dan ditanyai tentang Al-Quran. Ia menjawab bahwa Al-Quran tidak diciptakan. Ketika ditanya tentang penglihatan Tuhan, ia berkata, \"Inilah yang disebutkan dalam riwayat,\" dan ia meriwayatkan Hadits tersebut. Al-Wathiq menuduhnya berbohong. Ia menjawab, \"Justru Andalah yang berbohong.\" Al-Wathiq berkonsultasi dengan ulama Mu'tazilah, yang mengatakan bahwa diperbolehkan untuk memukulnya. Al-Wathiq meminta pedang dan berkata, \"Ketika aku pergi kepadanya, jangan ada seorang pun yang berdiri bersamaku, karena aku menganggap langkahku menuju orang kafir yang menyembah tuhan yang tidak kita sembah sebagai suatu bentuk ibadah.\" Kemudian ia sendiri memenggal kepalanya saat ia masih terikat di atas tikar algojo. Kepalanya dibawa ke Baghdad dan disalibkan, dan tubuhnya dipamerkan di Samarra. Hal ini berlanjut selama enam tahun hingga al-Mutawakkil berkuasa. Ia menurunkannya dan menguburnya, menulis di selembar kertas di telinganya: \"Ini adalah kepala Ahmad ibn Nasr ibn Malik. Abdullah, Imam Harun, menyerunya untuk mengakui penciptaan Al-Quran dan menolak antropomorfisme, tetapi ia menolak kecuali karena keras kepala. Maka Allah mempercepatnya ke dalam api-Nya.\" Perwira yang bertanggung jawab atas kepala tersebut melaporkan melihatnya pada malam hari menghadap ke arah kiblat dan melafalkan Surah Ya-Sin dengan lancar. {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
