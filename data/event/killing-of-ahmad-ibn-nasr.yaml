label: { en: "Killing of Ahmad ibn Nasr al-Khuza'i", ar: "قتل أحمد بن نصر الخزاعي" }
summary:
  ar: "في سنة إحدى وثلاثين قتل الواثق أحمد بن نصر الخزاعي، وكان من أهل الحديث قائماً بالأمر بالمعروف، أحضر من بغداد إلى سامراء مقيداً وسئل عن القرآن فقال ليس بمخلوق وعن الرؤية فقال كذا جاءت الرواية وروى الحديث فقال له الواثق تكذب فقال بل تكذب أنت، فاستشار فقهاء المعتزلة فقالوا هو حلال الضرب فدعا الواثق بالسيف وقال إذا قمت إليه فلا يقومن أحد معي فإني أحتسب خطاي إلى هذا الكافر الذي يعبد رباً لا نعبده، فضرب عنقه بنفسه وهو مقيد على النطع وحمل رأسه إلى بغداد فصلب وصلبت جثته بسر من رأى واستمر ذلك ست سنين إلى أن ولي المتوكل فأنزله ودفنه، وكتب في أذنه ورقة هذا رأس أحمد بن نصر بن مالك دعاه عبد الله الإمام هارون إلى القول بخلق القرآن ونفي التشبيه فأبى إلا المعاندة فعجله الله إلى ناره، وذكر الموكل بالرأس أنه رآه بالليل يستدير إلى القبلة بوجهه فيقرأ سورة يس بلسان طلق {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  en: "In 231 al-Wathiq killed Ahmad ibn Nasr al-Khuza'i, a hadith man devoted to commanding right. Brought shackled from Baghdad to Samarra, he refused createdness, transmitted the vision hadith — 'you lie?' — 'you lie!' — and the Mu'tazili jurists ruled his blood lawful. Al-Wathiq struck his neck himself upon the nat'a, his head was crucified at Baghdad and his body at Sur man Ra'a for six years until al-Mutawakkil buried him; a note in its ear named him and his charge, and the appointed watchman swore he saw the head turn to the qibla and recite Ya-Sin {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
