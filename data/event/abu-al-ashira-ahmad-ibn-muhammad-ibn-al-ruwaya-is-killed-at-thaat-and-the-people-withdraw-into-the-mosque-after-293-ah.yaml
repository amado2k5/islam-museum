id: "event/abu-al-ashira-ahmad-ibn-muhammad-ibn-al-ruwaya-is-killed-at-thaat-and-the-people-withdraw-into-the-mosque-after-293-ah"
class: event
kind: other
label:
  ar: "أبو العشيرة أحمد بن محمد بن الرُّوية يُقتل بثات، ويتحصن الناس بالمسجد، بعد 293هـ، ص392"
  en: "Abu al-Ashira Ahmad ibn Muhammad ibn al-Ruwaya is killed at Tha'at, and the people withdraw into the mosque, after 293 AH, p. 392"
  ur: "ابو العشیرہ احمد بن محمد بن الرویہ ثات میں قتل ہوتا ہے اور لوگ مسجد میں پناہ لیتے ہیں، 293ھ کے بعد، ص392"
summary:
  ar: "صار أبو العشيرة أحمد بن محمد بن الرّوية إلى ثات ورداع، فحاربه ابن ذي الطوق وعيسى اليافعي بثات، فقُتل أبو العشيرة، واستبيح البلد، وانحاز الناس إلى المسجد."
  en: "Abu al-Ashira Ahmad ibn Muhammad ibn al-Ruwaya went to Tha'at and Rada'. Ibn Dhi al-Tawq and Isa al-Yafi'i fought him at Tha'at, Abu al-Ashira was killed, the town was plundered, and the people withdrew into the mosque. The sentence breaks off at the foot of the page."
  ur: "ابو العشیرہ احمد بن محمد بن الرویہ ثات اور رداع کی طرف گیا، ابن ذی الطوق اور عیسیٰ الیافعی نے ثات میں اس سے جنگ کی، ابو العشیرہ قتل ہوا، شہر لوٹا گیا اور لوگ مسجد کی طرف چلے گئے۔ جملہ صفحے کے آخر پر ٹوٹتا ہے۔"
