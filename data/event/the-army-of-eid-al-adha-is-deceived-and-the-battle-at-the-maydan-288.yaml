id: event/the-army-of-eid-al-adha-is-deceived-and-the-battle-at-the-maydan-288
class: event
kind: other
label:
  ar: "خديعة جيش يوم عيد النحر والقتال في ميدان صنعاء، ذو الحجة 288هـ"
  en: "The army of the day of sacrifice is deceived and the battle on the parade ground of Sana'a, Dhu al-Hijja 288 AH"
  ur: "عید الاضحیٰ کے دن لشکر کو فریب دیا جاتا ہے اور صنعاء کے میدان میں معرکہ، ذی الحجہ 288ھ"
  es: "El ejército del día del sacrificio es engañado y la batalla se libra en el campo de desfiles de Sana'a, Dhu al-Hijja 288 AH."
  fr: "L'armée du jour du sacrifice est trompée et la bataille fait rage sur le terrain de parade de Sanaa, en Dhu al-Hijja 288 AH."
  tr: "Ordunun Kurban Bayramı günü yaptığı aldatmaca ve Sana'a meydanındaki çatışmalar, Zilhicce 288 Hicri"
  id: "Tipu daya tentara pada hari raya Idul Adha dan pertempuran di alun-alun Sana'a, Dzul Hijjah 288 Hijriah"
summary:
  ar: "في يوم عيد النحر جمع آل يعفر وآل طريف عساكرهم وخدعوا الناس بأنهم صالحوا الهادي على أن يخلي لهم صنعاء، فاجتمع لهم عسكر ذُكر أنه عشرون ألفاً وساروا ليلاً إلى ميدان صنعاء، فقاتلهم الهادي في نحو ألف رجل، وبعد أن كُشف جناحاه وتقدم أمام أصحابه رجع جناحاه وهزم القوم، ثم أرسل رجلاً من خدمه يدعو ابن خلف إلى المبارزة فتأخر."
  en: "On the day of sacrifice Al Ya'fur and Al Tarif gathered their armies and deceived the people by saying that they had agreed with al-Hadi that he would leave Sana'a to them; a great army, said to be twenty thousand, gathered to them and marched by night to the parade ground of Sana'a, and al-Hadi fought them with about a thousand men; after his wings gave way he went forward before his companions, his wings came back and the men were routed, and he then sent one of his servants to challenge Ibn Khalaf to single combat, who held back."
  ur: "عید الاضحیٰ کے دن آل یعفر اور آل طریف نے اپنے لشکر جمع کیے اور لوگوں کو یہ کہہ کر فریب دیا کہ انہوں نے ہادی سے صلح کر لی ہے کہ وہ صنعاء ان کے لیے خالی کر دیں؛ ان کے پاس ایک بڑا لشکر جمع ہوا جس کے بارے میں بتایا گیا کہ بیس ہزار تھا اور وہ رات میں صنعاء کے میدان کی طرف چلے، اور ہادی نے قریباً ایک ہزار آدمیوں کے ساتھ ان سے جنگ کی؛ بازو ہٹ جانے کے بعد وہ ساتھیوں کے آگے بڑھے، بازو لوٹ آئے اور مخالف ہار گئے، پھر انہوں نے اپنے ایک خادم کو ابن خلف کو مبارزت کی دعوت دینے بھیجا جو پیچھے ہٹ گیا۔"
  es: "El día del sacrificio, Al Ya'fur y Al Tarif reunieron a sus ejércitos y engañaron al pueblo diciendo que habían acordado con al-Hadi que les dejaría Sana'a; un gran ejército, de unos veinte mil hombres, se reunió con ellos y marchó de noche hasta la plaza de armas de Sana'a, y al-Hadi luchó contra ellos con unos mil hombres; después de que sus alas fallaran, avanzó delante de sus compañeros, sus alas volvieron a su posición original y los hombres fueron derrotados, y entonces envió a uno de sus sirvientes a desafiar a Ibn Khalaf a un combate singular, quien se contuvo."
  fr: "Le jour du sacrifice, Al Ya'fur et Al Tarif rassemblèrent leurs armées et trompèrent le peuple en prétendant avoir convenu avec al-Hadi qu'il leur laisserait Sanaa. Une grande armée, forte de vingt mille hommes selon les dires, se rassembla à leurs côtés et marcha de nuit vers le terrain de parade de Sanaa. Al-Hadi les affronta avec environ mille hommes. Lorsque ses ailes cédèrent, il s'avança devant ses compagnons, ses ailes revinrent et ses hommes furent mis en déroute. Il envoya alors un de ses serviteurs défier Ibn Khalaf en duel, mais celui-ci se retira."
  tr: "Kurban Bayramı günü, Ya'fur ve Tarif aileleri askerlerini topladılar ve Hadi ile Sana'yı kendilerine bırakması şartıyla barış yaptıklarını iddia ederek halkı kandırdılar. Onlar için yirmi bin kişilik bir ordu toplandı ve geceleyin Sana'ya meydanına yürüdüler. Hadi yaklaşık bin adamıyla onlarla savaştı. Kanatları açığa çıktıktan ve arkadaşlarının önünde ilerledikten sonra, kanatları tekrar ortaya çıktı ve halkı yenilgiye uğrattı. Sonra hizmetkarlarından birini İbn Halef'i düelloya çağırması için gönderdi, ancak İbn Halef geri çekildi."
  id: "Pada hari raya Idul Adha, keluarga Ya’fur dan Tarif mengumpulkan pasukan mereka dan menipu orang-orang dengan mengklaim bahwa mereka telah berdamai dengan al-Hadi dengan syarat dia akan meninggalkan Sana’a untuk mereka. Sebuah pasukan berjumlah dua puluh ribu orang dikumpulkan untuk mereka dan mereka berbaris di malam hari menuju alun-alun Sana’a. Al-Hadi melawan mereka dengan sekitar seribu orang. Setelah sayapnya terlihat dan dia maju di depan para pengikutnya, sayapnya kembali dan mengalahkan orang-orang. Kemudian dia mengirim seorang dari para pelayannya untuk menantang Ibn Khalaf berduel, tetapi Ibn Khalaf menolak."
