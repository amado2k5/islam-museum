label:
  ar: "فتاوى الطلاق وسجن قلعة دمشق، ٧١٨-٧٢١هـ/١٣١٨-١٣٢١م"
  en: "The divorce fatwas and the Damascus citadel imprisonment, 718-721/1318-1321"
  ur: "طلاق کے فتاویٰ اور قلعہ دمشق کی قید، 718-721ھ/1318-1321ء"
  es: "Las fatuas del divorcio y el encarcelamiento en la ciudadela de Damasco, 718-721/1318-1321"
  fr: "Les fatwas de divorce et l'emprisonnement dans la citadelle de Damas, 718-721/1318-1321"
  tr: "Boşanma kararları ve Şam Kalesi'nin hapsedilmesi, Hicri 718-721 / Miladi 1318-1321"
  id: "Putusan perceraian dan pemenjaraan Benteng Damaskus, 718-721 H/1318-1321 M"
summary:
  ar: "في ٧١٨هـ/١٣١٨م جاء مكتوب السلطان ينهى ابن تيمية عن الإفتاء في الطلاق بخلاف مذهب الحنابلة الجاري؛ كان قد أنكر وقوع الطلاق الثلاث بلفظ واحد وعدّ يمين الطلاق يميناً واحدة إن لم يُنوَ بها الطلاق. عُقد مجلسان برئاسة تنكز في ٧١٨هـ و٧١٩هـ ثم مجلس ثالث في ٢٠ رجب ٧٢٠هـ/٢٦ أغسطس ١٣٢٠م اتهمه بمخالفة نهي السلطان وحكم عليه بالسجن، فحُبس في قلعة دمشق نحو خمسة أشهر حتى أفرج عنه مكتوب الناصر في ١٠ محرم ٧٢١هـ/٩ فبراير ١٣٢١م {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  en: "In 718/1318 a letter from the sultan forbade Ibn Taymiyya to issue fatwas on repudiation contrary to prevailing Hanbali doctrine: he had denied that three repudiations uttered at once took effect and counted an oath of repudiation a single oath where no repudiation was intended. Two councils presided over by Tankiz in 718 and 719 were followed by a third on 20 Rajab 720/26 August 1320, which found him in breach of the prohibition and condemned him to prison; he spent just over five months in the Damascus citadel, released on 10 Muharram 721/9 February 1321 by decree of al-Malik al-Nasir {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  ur: "718ھ/1318ء میں سلطان کے فرمان نے ابن تیمیہ کو حنبلی مسلک کے خلاف طلاق کے فتاویٰ دینے سے روکا؛ انہوں نے ایک ہی لفظ میں تین طلاق کے واقع ہونے کا انکار اور طلاق کی قسم کو ایک ہی قسم شمار کیا تھا جب طلاق مراد نہ ہو۔ تنکز کی صدارت میں 718ھ اور 719ھ میں دو مجالس کے بعد تیسری مجلس 20 رجب 720ھ/26 اگست 1320ء کو انہیں حکم کی خلاف ورزی کا مرتکب پا کر قید کا حکم سنایا؛ وہ قلعہ دمشق میں پانچ ماہ سے کچھ زیادہ رہے اور 10 محرم 721ھ/9 فروری 1321ء کو الملک الناصر کے فرمان سے رہا ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}۔"
  es: "En 718/1318, una carta del sultán prohibió a Ibn Taymiyya emitir fatuas sobre el repudio contrarias a la doctrina hanbalí imperante: había negado que tres repudios pronunciados a la vez tuvieran efecto y consideraba un juramento de repudio como un solo juramento cuando no había intención de repudiar. Dos concilios presididos por Tankiz en 718 y 719 fueron seguidos por un tercero el 20 de Rajab de 720/26 de agosto de 1320, que lo encontró culpable de infringir la prohibición y lo condenó a prisión; pasó poco más de cinco meses en la ciudadela de Damasco, siendo liberado el 10 de Muharram de 721/9 de febrero de 1321 por decreto de al-Malik al-Nasir {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  fr: "En 718/1318, une lettre du sultan interdit à Ibn Taymiyya d'émettre des fatwas sur la répudiation, contrairement à la doctrine hanbalite en vigueur: il avait nié que trois répudiations prononcées simultanément soient valides et considérait un serment de répudiation comme un seul serment, même lorsqu'aucune répudiation n'était envisagée. Deux conciles présidés par Tankiz en 718 et 719 furent suivis d'un troisième le 20 Rajab 720/26 août 1320, qui le déclara coupable d'avoir enfreint cette interdiction et le condamna à la prison; il passa un peu plus de cinq mois dans la citadelle de Damas, avant d'être libéré le 10 Muharram 721/9 février 1321 par décret d'al-Malik al-Nasir (voir: Encyclopaedia of Islam, vol. 3, p. 985)."
  tr: "Hicri 718/Miladi 1318 yılında Sultan'dan İbn Taymiyye'ye, Hanbeli mezhebinin hakim görüşüne aykırı olarak boşanma fetvaları vermesini yasaklayan bir mektup geldi. İbn Taymiyye, tek bir sözde üç boşanmanın tek bir boşanma sayılmadığını ve boşanma niyeti yoksa boşanma yeminini tek bir yemin olarak kabul ettiğini savunmuştu. Hicri 718 ve 719 yıllarında Tankiz'in başkanlığında iki konsil toplandı, ardından Hicri 20 Receb 720/Miladi 26 Ağustos 1320'de üçüncü bir konsil toplandı ve İbn Taymiyye Sultan'ın yasağına karşı gelmekle suçlanarak hapse mahkum edildi. Yaklaşık beş ay Şam Kalesi'nde hapsedildikten sonra, Hicri 10 Muharrem 721/Miladi 9 Şubat 1321'de el-Nasır'dan gelen bir mektupla serbest bırakıldı."
  id: "Pada tahun 718 H/1318 M, sebuah surat tiba dari Sultan yang melarang Ibnu Taymiyyah mengeluarkan fatwa tentang perceraian yang bertentangan dengan mazhab Hanbali yang berlaku. Ia menolak anggapan bahwa tiga kali talak yang diucapkan dalam satu ucapan merupakan satu kali talak dan menganggap sumpah talak hanya sebagai satu sumpah jika perceraian tidak dimaksudkan. Dua dewan diadakan, dipimpin oleh Tankiz, pada tahun 718 H dan 719 H, diikuti oleh dewan ketiga pada tanggal 20 Rajab 720 H/26 Agustus 1320 M, yang menuduhnya melanggar larangan Sultan dan menjatuhkan hukuman penjara kepadanya. Ia dipenjara di Benteng Damaskus selama kurang lebih lima bulan hingga dibebaskan melalui surat dari al-Nasir pada tanggal 10 Muharram 721 H/9 Februari 1321 M."
