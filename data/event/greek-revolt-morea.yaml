summary:
  ar: "اندلع تمرد الروم في المورة في عهد السلطان محمود الثاني؛ يذكر الصلابي أن القساوسة كُلفوا بإبلاغ القرى أن الهجوم على الأتراك سيحدث ليلة عيد الفصح، وأن رجال الدين كانوا على صلة وثيقة بجمعية الفكرة العظمى وسمحوا باستخدام الأديرة مخازن للمدافع والبارود وملاجئ للمتمردين، ودفعت الكنيسة لهم الأموال. انسحب العثمانيون احتياطاً إلى القلاع فسقطت واحدة تلو الأخرى، وسيطر المتمردون في نحو ثلاثة أسابيع على المورة كلها عدا قلعة تريبوليجة مركز الولاية التي صمدت شهوراً، وقتل الروم العثمانيين الذين وقعوا في الأسر وسلبوا أموالهم. وكشفت مداهمة البطريركية وثائق تثبت تورط البطريرك جريجوريوس فأُعدم يوم عيد الفصح، ثم استدعى السلطان جيوش محمد علي باشا بقيادة ابنه إبراهيم ففتح نافرين عام ١٢٤٠هـ ودخل أثينا عام ١٢٤١هـ {cite:dawlat-uthmaniyya-salabi p. 363-365}."
  en: "The Greek War of Independence in the Morea — an Easter-night rising that overran the peninsula except Tripolitsa, patriarch Gregory executed after incriminating papers were seized, and Ibrahim Pasha's Egyptian army called in to crush the revolt {cite:dawlat-uthmaniyya-salabi p. 363-365}."
