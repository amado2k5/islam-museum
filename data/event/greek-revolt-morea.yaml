label: { ar: "ثورة المورة ⁦(اليونان)⁩", en: "The Morea Revolt (Greece)", es: "La revuelta de Morea (Grecia)", fr: "La révolte de Morée (Grèce)", ur: "موریا بغاوت ⁦(یونان)⁩", tr: "Mora İsyanı (Yunanistan)", id: "Pemberontakan Morea (Yunani)" }
summary:
  ar: "اندلع تمرد الروم في المورة في عهد السلطان محمود الثاني؛ يذكر الصلابي أن القساوسة كُلفوا بإبلاغ القرى أن الهجوم على الأتراك سيحدث ليلة عيد الفصح، وأن رجال الدين كانوا على صلة وثيقة بجمعية الفكرة العظمى وسمحوا باستخدام الأديرة مخازن للمدافع والبارود وملاجئ للمتمردين، ودفعت الكنيسة لهم الأموال. انسحب العثمانيون احتياطاً إلى القلاع فسقطت واحدة تلو الأخرى، وسيطر المتمردون في نحو ثلاثة أسابيع على المورة كلها عدا قلعة تريبوليجة مركز الولاية التي صمدت شهوراً، وقتل الروم العثمانيين الذين وقعوا في الأسر وسلبوا أموالهم. وكشفت مداهمة البطريركية وثائق تثبت تورط البطريرك جريجوريوس فأُعدم يوم عيد الفصح، ثم استدعى السلطان جيوش محمد علي باشا بقيادة ابنه إبراهيم ففتح نافرين عام ١٢٤٠هـ ودخل أثينا عام ١٢٤١هـ {cite:dawlat-uthmaniyya-salabi p. 363-365}."
  en: "The Greek War of Independence in the Morea — an Easter-night rising that overran the peninsula except Tripolitsa, patriarch Gregory executed after incriminating papers were seized, and Ibrahim Pasha's Egyptian army called in to crush the revolt {cite:dawlat-uthmaniyya-salabi p. 363-365}."
  es: "La guerra de independencia griega en Morea: un levantamiento en la noche de Pascua que invadió la península excepto Tripolitsa, el patriarca Gregorio fue ejecutado después de que se incautaran documentos incriminatorios, y el ejército egipcio de Ibrahim Pasha fue llamado para aplastar la revuelta {cite:dawlat-uthmaniyya-salabi p. 363-365}."
  fr: "La guerre d'indépendance grecque en Morée — un soulèvement de la nuit de Pâques qui a envahi la péninsule à l'exception de Tripolitsa, le patriarche Grégoire exécuté après la saisie de documents compromettants, et l'armée égyptienne d'Ibrahim Pacha appelée pour écraser la révolte {cite:dawlat-uthmaniyya-salabi p. 363-365}."
  ur: "موریا میں یونانی جنگ آزادی - ایک ایسٹر کی رات جس نے طرابلس کے علاوہ جزیرہ نما کو اپنی لپیٹ میں لے لیا، پادری گریگوری کو مجرمانہ کاغذات ضبط کرنے کے بعد پھانسی دی گئی، اور ابراہیم پاشا کی مصری فوج نے بغاوت کو کچلنے کے لیے بلایا۔ 363-365}۔"
  tr: "Sultan II. Mahmud döneminde Mora Yarımadası'nda Yunan isyanı patlak verdi. El-Salabi, rahiplerin köylere Türklere karşı saldırının Paskalya gecesi gerçekleşeceğini bildirmekle görevlendirildiğini ve din adamlarının Büyük İdeal Cemiyeti ile yakın bağlantılı olduğunu, manastırların top ve barut deposu olarak kullanılmasına ve isyancılar için sığınak olarak kullanılmasına izin verdiklerini belirtir. Kilise onlara para ödüyordu. Osmanlılar önlem olarak kalelerine çekildiler ve kaleleri birbiri ardına düştü. Yaklaşık üç hafta içinde isyancılar, eyalet başkenti Trablusgarp kalesi hariç Mora Yarımadası'nın tamamını kontrol altına aldılar; Trablusgarp kalesi aylarca direndi. Yunanlar ele geçirdikleri Osmanlıları öldürdüler ve servetlerini yağmaladılar. Patrikhaneye yapılan bir baskında, Paskalya Pazarında idam edilen Patrik Gregory'nin olaya karıştığını kanıtlayan belgeler bulundu. Sultan daha sonra oğlu İbrahim'in komutasındaki Muhammed Ali Paşa'nın ordularını çağırdı; İbrahim, Hicri 1240 yılında Navarino'yu fethetti ve Hicri 1241 yılında Atina'ya girdi. {cite:dawlat-uthmaniyya-salabi s. 363-365}"
  id: "Pemberontakan Yunani meletus di Peloponnese selama pemerintahan Sultan Mahmud II. Al-Salabi menyebutkan bahwa para pendeta ditugaskan untuk memberi tahu penduduk desa bahwa serangan terhadap Turki akan terjadi pada malam Paskah, dan bahwa para pendeta memiliki hubungan erat dengan Masyarakat Ide Agung dan mengizinkan penggunaan biara sebagai gudang meriam dan bubuk mesiu, serta tempat perlindungan bagi para pemberontak. Gereja membayar mereka sejumlah uang. Pasukan Ottoman mundur ke benteng mereka sebagai tindakan pencegahan, dan benteng-benteng itu jatuh satu demi satu. Dalam waktu sekitar tiga minggu, para pemberontak menguasai seluruh Peloponnese kecuali benteng Tripolitania, ibu kota provinsi, yang bertahan selama berbulan-bulan. Orang-orang Yunani membunuh orang-orang Ottoman yang ditawan dan menjarah kekayaan mereka. Sebuah penggerebekan di Patriarkat mengungkap dokumen yang membuktikan keterlibatan Patriark Gregorius, yang dieksekusi pada Minggu Paskah. Sultan kemudian memanggil pasukan Muhammad Ali Pasha, yang dipimpin oleh putranya Ibrahim, yang menaklukkan Navarino pada tahun 1240 H dan memasuki Athena pada tahun 1241 H {cite:dawlat-uthmaniyya-salabi p. 363-365}."
