id: event/qifti-jerusalem-583
class: event
kind: other
label:
  ar: "القفطي ينتقل إلى القدس مع أبيه، ٥٨٣هـ"
  en: "Al-Qifti moves to Jerusalem with his father, 583/1187"
  ur: "قفطی والد کے ہمراہ قدس منتقل ہوئے، 583ھ/1187ء"
  es: "Al-Qifti se traslada a Jerusalén con su padre, 583/1187"
  fr: "Al-Qifti s'installe à Jérusalem avec son père, 583/1187"
  tr: "El-Kifti, 583 Hicri yılında babasıyla birlikte Kudüs'e taşındı."
  id: "Al-Qifti pindah ke Yerusalem bersama ayahnya pada tahun 583 Hijriah."
summary:
  ar: "تلقى القفطي تعليمه الأول بالقاهرة ثم انتقل سنة ثلاث وثمانين وخمسمائة إلى القدس حيث عُيِّن أبوه نائباً للقاضي الفاضل، كاتب صلاح الدين الشهير ومستشاره؛ وبقي طالباً بها سنوات طويلة يجمع مادة كتبه اللاحقة {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "After his early education in Cairo, al-Qifti went in 583/1187 to Jerusalem, where his father had been appointed deputy to the Qadi al-Fadil, Salah al-Din's famous chancellor and adviser; he spent many years there as a student, already gathering the material for his later works {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "قفطی نے ابتدائی تعلیم قاہرہ میں حاصل کی، پھر 583ھ/1187ء کو قدس گئے جہاں ان کے والد صلاح الدین کے نامور کاتب و مشیر قاضی فاضل کے نائب مقرر ہوئے؛ وہ وہاں برسوں طالب علم رہے اور اپنی آئندہ تصانیف کی مادہ جمع کرتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
  es: "Después de su educación inicial en El Cairo, al-Qifti fue en 583/1187 a Jerusalén, donde su padre había sido nombrado lugarteniente del Qadi al-Fadil, el famoso canciller y consejero de Saladino; pasó muchos años allí como estudiante, recopilando ya el material para sus obras posteriores {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  fr: "Après ses premières études au Caire, al-Qifti se rendit en 583/1187 à Jérusalem, où son père avait été nommé adjoint du cadi al-Fadil, le célèbre chancelier et conseiller de Salah al-Din; il y passa de nombreuses années comme étudiant, rassemblant déjà la matière de ses œuvres ultérieures {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  tr: "El-Kifti ilk eğitimini Kahire'de aldı, ardından Hicri 583 yılında babasının Selahaddin'in ünlü kâtibi ve danışmanı El-Kadı El-Fadil'in yardımcısı olarak atanması üzerine Kudüs'e taşındı; ve orada uzun yıllar öğrenim görerek daha sonraki kitapları için malzeme topladı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}"
  id: "Al-Qifti menerima pendidikan pertamanya di Kairo, kemudian pada tahun 583 H ia pindah ke Yerusalem di mana ayahnya diangkat menjadi wakil Al-Qadi Al-Fadil, juru tulis terkenal dan penasihat Saladin; dan ia tetap menjadi pelajar di sana selama bertahun-tahun mengumpulkan materi untuk buku-bukunya di kemudian hari {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
