label:
  ar: "القفطي ينتقل إلى القدس مع أبيه، ٥٨٣هـ"
  en: "Al-Qifti moves to Jerusalem with his father, 583/1187"
  ur: "قفطی والد کے ہمراہ قدس منتقل ہوئے، 583ھ/1187ء"
summary:
  ar: "تلقى القفطي تعليمه الأول بالقاهرة ثم انتقل سنة ثلاث وثمانين وخمسمائة إلى القدس حيث عُيِّن أبوه نائباً للقاضي الفاضل، كاتب صلاح الدين الشهير ومستشاره؛ وبقي طالباً بها سنوات طويلة يجمع مادة كتبه اللاحقة {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "After his early education in Cairo, al-Qifti went in 583/1187 to Jerusalem, where his father had been appointed deputy to the Qadi al-Fadil, Salah al-Din's famous chancellor and adviser; he spent many years there as a student, already gathering the material for his later works {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "قفطی نے ابتدائی تعلیم قاہرہ میں حاصل کی، پھر 583ھ/1187ء کو قدس گئے جہاں ان کے والد صلاح الدین کے نامور کاتب و مشیر قاضی فاضل کے نائب مقرر ہوئے؛ وہ وہاں برسوں طالب علم رہے اور اپنی آئندہ تصانیف کی مادہ جمع کرتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
