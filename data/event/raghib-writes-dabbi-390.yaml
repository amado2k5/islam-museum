label:
  ar: "الراغب يؤلف في أيام وزارة أبي العباس الدبّي، ٣٨٥–٣٩٩هـ"
  en: "al-Raghib writes during the vizierate of Abu al-Abbas al-Dabbi, 385–399"
  ur: "راغب کی تصنیف، ابو العباس دبّی کی وزارت کے ایام میں، 385–399ھ"
summary:
  ar: "يذكر الراغب الأصفهاني خلفَ الصاحب بن عباد في الوزارة، أبا العباس الدبّي (ت ٣٩٩هـ/١٠٠٨م)، بلقبه الكامل على خلاف عادته في التسمية، فيرجّح محرر مقالته في «دائرة المعارف الإسلامية» أنه كان يكتب في مدة وزارة الدبّي نفسها {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  en: "al-Raghib refers to Ibn Abbad's successor in the vizierate, Abu al-Abbas al-Dabbi (d. 399/1008), exceptionally by his full title, which suggests to his EI2 biographer that he may have been writing during al-Dabbi's own vizierate {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  ur: "راغب اصفہانی ابن عباد کے جانشین وزیر ابو العباس دبّی (وفات 399ھ/1008ء) کا نام خلافِ عادت پورے لقب کے ساتھ لیتے ہیں، جس سے «انسائیکلوپیڈیا آف اسلام» کے مدبر کے نزدیک یہ امکان پیدا ہوتا ہے کہ وہ دبّی کی خود وزارت کے زمانے میں لکھ رہے تھے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}۔"
