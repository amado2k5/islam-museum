id: event/umar-prayer-at-the-sunrise
class: event
kind: other
label:
  ar: "صلاة عمر عند طلوع الشمس وقرن الشيطان"
  en: "Umar on prayer at sunrise and the shaytan's horn"
  ur: "طلوع آفتاب کے وقت عمر کی نماز اور شیطان کی سینگ"
summary:
  ar: "كان عمر يقول لا تحروا بصلاتكم طلوع الشمس ولا غروبها فإن الشيطان يطلع قرناه مع طلوع الشمس ويغربان مع غروبها وكان يضرب الناس على تلك الصلاة {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|الموطأ 589]]."
  en: "Umar used to say: do not seek your prayer at sunrise or sunset, for the shaytan's horns rise with the sunrise and set with the sunset; he would beat people for praying then {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Muwatta 589]]."
  ur: "عمر کہتے تھے: اپنی نماز طلوع یا غروب آفتاب کے وقت نہ پڑھو، کیونکہ شیطان کی سینگیں طلوع آفتاب کے ساتھ نکلتی ہیں اور غروب کے ساتھ غائب ہوتی ہیں؛ اور وہ لوگوں کو اس وقت کی نماز پر مارتے تھے {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|موطأ 589]]۔"
