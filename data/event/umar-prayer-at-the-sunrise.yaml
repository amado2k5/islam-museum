id: event/umar-prayer-at-the-sunrise
class: event
kind: other
label:
  ar: "صلاة عمر عند طلوع الشمس وقرن الشيطان"
  en: "Umar on prayer at sunrise and the shaytan's horn"
  ur: "طلوع آفتاب کے وقت عمر کی نماز اور شیطان کی سینگ"
  es: "Umar sobre la oración al amanecer y el cuerno de Satanás"
  fr: "Umar parle de la prière au lever du soleil et de la corne de Satan."
  tr: "Ömer'in gün doğarken ettiği dua ve Şeytan'ın boynuzu"
  id: "Doa Omar saat matahari terbit dan tanduk Setan"
summary:
  ar: "كان عمر يقول لا تحروا بصلاتكم طلوع الشمس ولا غروبها فإن الشيطان يطلع قرناه مع طلوع الشمس ويغربان مع غروبها وكان يضرب الناس على تلك الصلاة {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|الموطأ 589]]."
  en: "Umar used to say: do not seek your prayer at sunrise or sunset, for the shaytan's horns rise with the sunrise and set with the sunset; he would beat people for praying then {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Muwatta 589]]."
  ur: "عمر کہتے تھے: اپنی نماز طلوع یا غروب آفتاب کے وقت نہ پڑھو، کیونکہ شیطان کی سینگیں طلوع آفتاب کے ساتھ نکلتی ہیں اور غروب کے ساتھ غائب ہوتی ہیں؛ اور وہ لوگوں کو اس وقت کی نماز پر مارتے تھے {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|موطأ 589]]۔"
  es: "Umar solía decir: no busques tu oración al amanecer ni al atardecer, pues los cuernos de shaytan se elevan con el amanecer y se ponen con el atardecer; golpeaba a la gente por orar en esos momentos {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Muwatta 589]]."
  fr: "Umar disait: ne cherchez pas votre prière au lever ou au coucher du soleil, car les cornes de shaytan se lèvent avec le lever du soleil et se couchent avec le coucher du soleil; il battait les gens pour avoir prié à ce moment-là {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Muwatta 589]]."
  tr: "Ömer şöyle derdi: \"Namazlarınızı güneş doğarken veya güneş batarken kılmayın, çünkü şeytanın boynuzları güneş doğarken yükselir ve güneş batarken iner.\" Ve bu yüzden insanları döverdi. {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Al-Muwatta 589]]."
  id: "Omar biasa berkata: Janganlah kalian melaksanakan salat saat matahari terbit atau terbenam, karena tanduk setan muncul saat matahari terbit dan terbenam saat matahari terbenam. Dan dia biasa memukuli orang-orang karena salat itu. {cite:muwatta-maruf-1997} [[passage/muwatta-1-589|Al-Muwatta 589]]."
