id: event/sariyya-of-zayd-to-madyan
class: event
kind: raid
label: { ar: "سرية زيد بن حارثة إلى مدين وقصة السبي", en: "Zayd ibn Haritha's detachment to Madyan and the captives" }
summary:
  ar: "يرويها ابن هشام عن عبد الله بن حسن بن حسن عن أمه فاطمة بنت الحسين: بعث النبي زيد بن حارثة نحو مدين ومعه ضميرة مولى علي بن أبي طالب وأخ له، فأصاب سبياً من أهل ميناء وهي السواحل، فبيعوا وفُرّق بينهم، فخرج النبي وهم يبكون فسأل عنهم فقيل: فُرّق بينهم، فقال: لا تبيعوهم إلا جميعاً؛ قال ابن هشام: أراد الأمهات والأولاد."
  en: "Ibn Hisham tells it from Abdullah ibn Hasan ibn Hasan from his mother Fatima bint al-Husayn: the Prophet sent Zayd ibn Haritha towards Madyan with Dumayra, the client of Ali ibn Abi Talib, and a brother of his; he took captives from the people of Mina', the coasts, who were sold and separated; the Prophet came out as they wept, asked what ailed them, was told they had been separated, and said: sell them only together. Ibn Hisham: he meant mothers and children."
