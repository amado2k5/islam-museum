summary:
  ar: "يذكر شكيب أرسلان في فصل «فتح الترك للقسطنطينية» أن بايزيد الأول كان يحاصر القسطنطينية سنة 1396م، فبلغه أن جيشاً فرنسياً بقيادة سيجيسموند ملك المجر جاء لنجدة المدينة، فالتقاه في نيقوبوليس ببلاد البلغار. ويذكر أن المعركة وقعت في 25 سبتمبر من تلك السنة، وأن الجيش المسيحي انهزم، واستُؤصل أكثره قتلاً وأسراً. ويذكر أن بعض التواريخ الفرنسية تذكر معركتين، إحداهما سنة 1393م. يعرض هذا عن المؤلف، ولم يتحقق منه هنا،"
  en: "In Arslan's account of the Ottoman siege of Constantinople, Bayezid I, besieging the city in 1396, learned of a relief army led by Sigismund of Hungary, with French knights, and met it at Nicopolis in Bulgaria. Arslan gives 25 September 1396 as the date, reports a crushing defeat of the Christian army, and notes a French source that speaks of two battles. This is Arslan's report and has not been checked against the standard histories."
  fr: "Dans le récit d'Arslan sur le siège ottoman de Constantinople, Bayezid Ier, qui assiégeait la ville en 1396, apprit l'arrivée d'une armée de secours menée par Sigismond de Hongrie, avec des chevaliers français, et la rencontra à Nicopolis, en Bulgarie. Arslan donne pour date le 25 septembre 1396, rapporte une défaite écrasante de l'armée chrétienne et signale une source française qui parle de deux batailles. C'est le récit d'Arslan, et il n'a pas été vérifié dans les histoires de référence."
  es: "En el relato de Arslan sobre el asedio otomano de Constantinopla, Bayezid I, que asedió la ciudad en 1396, tuvo conocimiento de un ejército de socorro liderado por Segismundo de Hungría, con caballeros franceses, y lo recibió en Nicópolis, Bulgaria. Arslan indica el 25 de septiembre de 1396 como fecha, informa de una aplastante derrota del ejército cristiano y cita una fuente francesa que habla de dos batallas. Este es el relato de Arslan y no ha sido contrastado con las crónicas oficiales."
