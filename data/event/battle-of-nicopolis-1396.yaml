summary:
  ar: "يذكر شكيب أرسلان في فصل «فتح الترك للقسطنطينية» أن بايزيد الأول كان يحاصر القسطنطينية سنة 1396م، فبلغه أن جيشاً فرنسياً بقيادة سيجيسموند ملك المجر جاء لنجدة المدينة، فالتقاه في نيقوبوليس ببلاد البلغار. ويذكر أن المعركة وقعت في 25 سبتمبر من تلك السنة، وأن الجيش المسيحي انهزم، واستُؤصل أكثره قتلاً وأسراً. ويذكر أن بعض التواريخ الفرنسية تذكر معركتين، إحداهما سنة 1393م. يعرض هذا عن المؤلف، ولم يتحقق منه هنا،"
  en: "In Arslan's account of the Ottoman siege of Constantinople, Bayezid I, besieging the city in 1396, learned of a relief army led by Sigismund of Hungary, with French knights, and met it at Nicopolis in Bulgaria. Arslan gives 25 September 1396 as the date, reports a crushing defeat of the Christian army, and notes a French source that speaks of two battles. This is Arslan's report and has not been checked against the standard histories."
