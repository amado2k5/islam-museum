id: event/battle-of-kom-sharik
class: event
kind: battle
label:
  ar: وقعة كوم شريك
  en: Battle of Kom Sharik
  ur: کوم شریک کی لڑائی
summary:
  ar: لقاء بين جيش عمرو بن العاص وجموع الروم في طريقه من الفسطاط إلى الإسكندرية، دام ثلاثة أيام عند الكوم الذي سُمّي بعدُ كوم شريك نسبة إلى شريك بن سمي، وانهزم فيه الروم {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
  en: An encounter between Amr ibn al-As's army and the assembled Romans on his road from al-Fustat to Alexandria, lasting three days at the mound later called Kom Sharik after Sharik ibn Sumayy, ending in a Roman rout {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
  ur: فسطاط سے اسکندریہ جاتے ہوئے عمرو بن العاص کے لشکر اور رومی لشکر کا مقابلہ، جو تین دن اس ٹیلے پر جاری رہا جو بعد میں شریک بن سمی کے نام پر کوم شریک کہلایا، اور رومیوں کی شکست پر ختم ہوا {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}۔
