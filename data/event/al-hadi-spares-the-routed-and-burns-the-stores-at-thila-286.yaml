id: event/al-hadi-spares-the-routed-and-burns-the-stores-at-thila-286
class: event
kind: other
label:
  ar: عفو الهادي عن المنهزمين وإحراقه مخازن ثلا، 286هـ
  en: Al-Hadi spares the routed and burns the stores at Thila, 286 AH
  ur: ہادی کا بھاگنے والوں کو معاف کرنا اور ثلا کے ذخیرے جلانا، 286ھ
  es: "Al-Hadi perdona a los derrotados y quema los almacenes en Thila, 286 AH."
  fr: "Al-Hadi épargne les vaincus et incendie les dépôts à Thila, en 286 AH."
  tr: "El-Hadi, yenilgiye uğrayanları affetti ve Hicri 286 yılında Thula'nın depolarını yaktı."
  id: "Al-Hadi mengampuni pihak yang kalah dan membakar perbekalan di Thula, 286 H."
summary:
  ar: يعفو الهادي عن المنهزمين والجرحى ويأمر الجيش ألا يتبعهم ويمنع الناس من رقي الجبل عليهم، ويأخذ الرؤوس ويغلق دروب القرية، ثم يخرج بعد الظهر إلى رجلاء فيفرّ الحارثيون من أسفل النخل ويتبعهم إلى ماء مذود ثم يرجع، ويسلّم طريق نسائهم وإبلهم وأثقالهم، ويأمر بنهب مخازن حصن ثلا وهدمه وإحراقه.
  en: Al-Hadi spares the routed and wounded, orders the army not to follow them and keeps people from climbing the mountain after them, has the heads collected and the village lanes shut; after the noon prayer he rides out to Rajla, the Harithis flee from below the palms and he follows to the water of Madhud, then turns back, lets their women, camels and baggage pass, and orders the stores of the fort of Thila plundered, pulled down and burned.
  ur: ہادی بھاگنے والوں اور زخمیوں کو معاف کرتے ہیں، لشکر کو پیچھا نہ کرنے کا حکم دیتے ہیں اور لوگوں کو پہاڑ پر چڑھنے سے روکتے ہیں، سر جمع کروا لیتے ہیں اور بستی کے راستے بند کرواتے ہیں؛ ظہر کے بعد رجلاء کی طرف نکلتے ہیں، حارثی کھجوروں کے نیچے سے بھاگ جاتے ہیں اور وہ مذود کے پانی تک ان کے پیچھے جا کر لوٹ آتے ہیں، ان کی عورتوں، اونٹوں اور سامان کو گزرنے دیتے ہیں اور ثلا کے قلعے کے ذخیرے لوٹنے، ڈھانے اور جلانے کا حکم دیتے ہیں۔
  es: "Al-Hadi perdona a los huidos y heridos, ordena al ejército que no los persiga e impide que la gente suba la montaña tras ellos, ordena recoger las cabezas y cerrar los caminos del pueblo; después de la oración del mediodía cabalga hacia Rajla, los Harithis huyen de debajo de las palmeras y él los persigue hasta las aguas de Madhud, luego regresa, deja pasar a sus mujeres, camellos y equipaje, y ordena que se saqueen, derriben y quemen los depósitos del fuerte de Thila."
  fr: "Al-Hadi épargne les vaincus et les blessés, ordonne à l'armée de ne pas les poursuivre et empêche les gens de gravir la montagne après eux, fait ramasser les têtes et fermer les ruelles du village; après la prière de midi, il se rend à Rajla, les Harithis fuient sous les palmiers et il les suit jusqu'à l'eau de Madhud, puis fait demi-tour, laisse passer leurs femmes, leurs chameaux et leurs bagages, et ordonne que les réserves du fort de Thila soient pillées, détruites et brûlées."
  tr: "El-Hadi, yenilenleri ve yaralıları affeder, orduya onları takip etmemelerini emreder ve insanların dağa tırmanıp onlara ulaşmalarını engeller. Başlarını alır ve köy yollarını kapatır. Sonra öğleden sonra Rajla'ya gider ve Harithi halkı hurma ağaçlarının altından kaçar. Onları Madhoud sularına kadar takip eder, sonra geri döner ve kadınlarına, develerine ve eşyalarına güvenli geçiş sağlar. Thula kalesinin depolarının yağmalanmasını, yıkılmasını ve yakılmasını emreder."
  id: "Al-Hadi mengampuni yang kalah dan yang terluka, memerintahkan pasukan untuk tidak mengejar mereka, dan mencegah orang-orang mendaki gunung untuk menemui mereka. Dia memenggal kepala mereka dan menutup jalan-jalan desa. Kemudian, setelah tengah hari, dia pergi ke Rajla, dan orang-orang Harithi melarikan diri dari bawah pohon kurma. Dia mengikuti mereka ke sungai Madhoud, lalu kembali, dan memberikan jalan aman bagi wanita, unta, dan barang bawaan mereka. Dia memerintahkan penjarahan gudang-gudang benteng Thula, penghancurannya, dan pembakarannya."
