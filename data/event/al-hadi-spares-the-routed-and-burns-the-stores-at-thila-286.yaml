id: event/al-hadi-spares-the-routed-and-burns-the-stores-at-thila-286
class: event
kind: other
label:
  ar: عفو الهادي عن المنهزمين وإحراقه مخازن ثلا، 286هـ
  en: Al-Hadi spares the routed and burns the stores at Thila, 286 AH
  ur: ہادی کا بھاگنے والوں کو معاف کرنا اور ثلا کے ذخیرے جلانا، 286ھ
summary:
  ar: يعفو الهادي عن المنهزمين والجرحى ويأمر الجيش ألا يتبعهم ويمنع الناس من رقي الجبل عليهم، ويأخذ الرؤوس ويغلق دروب القرية، ثم يخرج بعد الظهر إلى رجلاء فيفرّ الحارثيون من أسفل النخل ويتبعهم إلى ماء مذود ثم يرجع، ويسلّم طريق نسائهم وإبلهم وأثقالهم، ويأمر بنهب مخازن حصن ثلا وهدمه وإحراقه.
  en: Al-Hadi spares the routed and wounded, orders the army not to follow them and keeps people from climbing the mountain after them, has the heads collected and the village lanes shut; after the noon prayer he rides out to Rajla, the Harithis flee from below the palms and he follows to the water of Madhud, then turns back, lets their women, camels and baggage pass, and orders the stores of the fort of Thila plundered, pulled down and burned.
  ur: ہادی بھاگنے والوں اور زخمیوں کو معاف کرتے ہیں، لشکر کو پیچھا نہ کرنے کا حکم دیتے ہیں اور لوگوں کو پہاڑ پر چڑھنے سے روکتے ہیں، سر جمع کروا لیتے ہیں اور بستی کے راستے بند کرواتے ہیں؛ ظہر کے بعد رجلاء کی طرف نکلتے ہیں، حارثی کھجوروں کے نیچے سے بھاگ جاتے ہیں اور وہ مذود کے پانی تک ان کے پیچھے جا کر لوٹ آتے ہیں، ان کی عورتوں، اونٹوں اور سامان کو گزرنے دیتے ہیں اور ثلا کے قلعے کے ذخیرے لوٹنے، ڈھانے اور جلانے کا حکم دیتے ہیں۔
