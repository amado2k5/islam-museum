label: { ar: "أشرس والجزية عن أهل ما وراء النهر", en: "al-Ashras and the Converts' Jizya", fr: "Al-Ashras et la jizya des convertis", es: "al-Ashras y la yizia de los conversos", ur: "العشرس اور مذہب تبدیل کرنے والوں کا جزیہ", tr: "Transoksanya halkı için en vahşi ve acımasız saygı duruşu.", id: "Penghormatan paling ganas dan brutal untuk rakyat Transoxiana" }
summary:
  ar: "استعمل هشام أشرس بن عبد الله السلمي على خراسان وكان معه كاتب نبطي يسمى عميرة يكنى أبا أمية فزين له الشر فزاد أشرس في وظائف خراسان واستخف بالدهاقين ودعا أهل ما وراء النهر إلى الإسلام وأمر بطرح الجزية عمن أسلم فسارعوا إلى الإسلام وانكسر الخراج فلما رأى أشرس ذلك أخذ المسالمة فأنكروا ذلك وألحوا منه وغضب لهم ثابت قطنة الأزدي وإنما قيل له قطنة لأن عينه فقئت فكان يضع عليها قطنة فبعث إليهم أشرس من فرق جمعهم وأخذ ثابتاً فحبسه ثم خلاه بكفالة ووجهه في وجه فخرجت عليه الترك فقتلته."
  en: "Al-Ashras ibn Abdallah al-Sulami, swayed by his Nabati katib Umayra, raised Khurasan's levies, scorned the dahqans, summoned Transoxanians to Islam and dropped jizya from converts — they rushed to Islam and the kharaj collapsed — so he took musalama anyway, to their protest. Thabit 'Qutna' al-Azdi — cotton-plugged for his gouged eye — raged for them; al-Ashras scattered the gathering, jailed and bailed him, then sent him on a posting where the Turks killed him."
  fr: "Al-Ashras ibn Abdallah al-Sulami, influencé par son katib nabatéen Umayra, augmenta les prélèvements du Khorasan, méprisa les dahqans, appela les Transoxianais à l'islam et supprima la jizya pour les convertis ; ils se précipitèrent vers l'islam et le kharaj s'effondra ; il préleva donc malgré tout la jizya sur les musalama, qui protestèrent. Thabit « Qutna » al-Azdi, surnommé ainsi pour le coton bouchant son œil crevé, s'indigna pour eux ; al-Ashras dispersa le rassemblement, l'emprisonna puis le libéra sous caution, et l'envoya ensuite à un poste où les Turcs le tuèrent."
  es: "Al-Ashras ibn Abdallah al-Sulami, influenciado por su katib nabati Umayra, aumentó las levas de Jorasán, despreció a los dahqans, llamó a los transoxanos al Islam y eliminó la jizya de los conversos; estos se apresuraron a convertirse al Islam y el kharaj se derrumbó, por lo que, a pesar de sus protestas, tomó la musalama. Thabit 'Qutna' al-Azdi, con un tapón de algodón en el ojo arrancado, se enfureció por ellos; al-Ashras dispersó a la multitud, lo encarceló y luego lo puso en libertad bajo fianza, para finalmente enviarlo a un puesto donde los turcos lo mataron."
  ur: "العشراس بن عبداللہ السلمی نے، اپنے نباتی کاتب عمیرہ کے زیر اثر، خراسان کے لیویز کو بڑھایا، دہقانوں کو لعن طعن کیا، ٹرانسکسانیوں کو اسلام میں بلایا اور مذہب تبدیل کرنے والوں سے جزیہ ختم کیا - وہ اسلام کی طرف بڑھے اور خوارج منہدم ہو گیا - تو اس نے ان کے خلاف احتجاج کیا۔ ثابت 'قطنا' العزدی - اس کی پھٹی ہوئی آنکھ کے لیے روئی سے جڑی ہوئی - ان کے لیے غصے میں آگئی؛ العشرس نے اجتماع کو پراگندہ کیا، جیل میں ڈالا اور ضمانت پر رہا، پھر اسے ایک پوسٹنگ پر بھیج دیا جہاں ترکوں نے اسے قتل کر دیا۔"
  tr: "Hişam, Aşras bin Abdullah el-Sulami'yi Horasan valisi olarak atadı. Yanında, kötülüğü çekici bulan, Umayra lakaplı bir Nabatî kâtip vardı. Aşras, Horasan'ın vergilerini artırdı ve toprak sahiplerini küçümsedi. Transoksanya halkını İslam'a çağırdı ve din değiştirenlerden cizye alınmasını emretti. Onlar İslam'a hızla geçtiler ve Harac dağıldı. Aşras bunu görünce, Müslümanlığı aldı, ancak onlar bunu reddettiler ve ısrar ettiler. Sabit Kutna el-Azdi onlara kızdı. Kutna denmesinin sebebi, gözünün oyulmuş olması ve üzerine pamuk koymasıydı. Aşras, onların yanına bazı adamlar gönderdi; onlar da onların topluluğunu dağıttılar, Sabit'i yakalayıp hapse attılar. Sonra onu kefaletle serbest bıraktı ve bir yolculuğa gönderdi. Türkler ona karşı çıktılar ve onu öldürdüler."
  id: "Hisham mengangkat Ashras bin Abdullah Al-Sulami sebagai gubernur Khorasan. Ia membawa serta seorang juru tulis Nabatea bernama Umayra, yang dijuluki Abu Umayya, yang membuat kejahatan tampak menarik baginya. Ashras meningkatkan pajak Khorasan dan meremehkan para pemilik tanah. Ia menyeru penduduk Transoxiana untuk masuk Islam dan memerintahkan agar jizya dihapuskan bagi mereka yang masuk Islam. Mereka bergegas masuk Islam dan kharaj pun runtuh. Ketika Ashras melihat ini, ia mengambil Musalama, tetapi mereka menolaknya dan bersikeras mempertahankannya. Thabit Qutna Al-Azdi marah karena mereka. Ia disebut Qutna karena matanya dicungkil, sehingga ia biasa menaruh kapas di atasnya. Ashras mengirim beberapa orang kepada mereka yang membubarkan pertemuan mereka dan menangkap Thabit serta memenjarakannya. Kemudian ia membebaskannya dengan jaminan dan mengirimnya dalam perjalanan. Orang-orang Turki menyerangnya dan membunuhnya."
