id: event/ibn-al-mulaqqin-death-804
class: event
kind: death
label:
  ar: "وفاة ابن الملقن بالقاهرة، ربيع الأول ٨٠٤هـ"
  en: "Ibn al-Mulaqqin dies at Cairo, Rabi' I 804/October 1401"
  ur: "ابن ملقن کی وفات قاہرہ میں، ربیع الاول 804ھ/اکتوبر 1401ء"
summary:
  ar: "تغيّر حال ابن الملقن بآخرته فحجبه ولده نور الدين علي إلى أن مات في سادس شهر ربيع الأول سنة ٨٠٤هـ بالقاهرة، ودُفن على والده بحوش الصوفية خارج باب النصر، وقد عاش إحدى وثمانين سنة {cite:shadharat-dhahab 7/45} {cite:durar-kamina-jil-1993 dhayl p. 123}."
  en: "Ibn al-Mulaqqin's state changed at the end of his life and his son Nur al-Din 'Ali confined him until he died on 6 Rabi' I 804 at Cairo, aged eighty-one; he was buried beside his father in the hawsh of the Sufis outside Bab al-Nasr {cite:shadharat-dhahab 7/45} {cite:durar-kamina-jil-1993 dhayl p. 123}."
  ur: "آخری عمر میں ابن ملقن کی حالت بدل گئی اور ان کے فرزند نور الدین علی نے انہیں محدود رکھا یہاں تک کہ وہ 6 ربیع الاول 804ھ کو قاہرہ میں فوت ہوئے، عمر اکیاسی برس؛ انہیں باب النصر کے باہر حوش صوفیہ میں والد کے پہلو میں دفن کیا گیا {cite:shadharat-dhahab 7/45} {cite:durar-kamina-jil-1993 dhayl p. 123}۔"
