label: { ar: "سقوط نصيبين وفتنة بغداد 362هـ", en: "The fall of Nisibis and the Baghdad riot, 362" }
summary:
  ar: "في سنة اثنتين وستين وثلثمائة دخلت جموع الروم نصيبين فاستباحوها وقتلوا كثيراً من رجالها وسبوا من نسائها وصبيانها وأقاموا بها نيفاً وعشرين يوماً وغلبوا على ديار ربيعة بأسرها؛ وورد إلى بغداد خلق كثير من أهل تلك البلاد فانتشروا في الجوامع وكسروا المنابر ومنعوا الخطبة وحاولوا الهجوم على دار المطيع لله حتى غُلقت أبوابها ورماهم الغلمان بالنشاب، وخاطبوه بما نسبوه فيه إلى العجز، فاستقبل الناس وخرج من العوام عدد الرمل، ثم أنفذ جيشاً فهزم الروم وقتل منهم خلقاً كثيراً وأسر أميرهم وجماعة من بطارقتهم وأُنفذت رؤوس القتلى إلى بغداد وكُتب معها كتاب إلى المطيع لله يبشر بالفتح {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
  en: "In 362 the Byzantine host entered Nisibis, sacked it and held it twenty-two days, overrunning all Diyar Rabi'a; refugees reaching Baghdad stormed the mosques, broke minbars, barred the khutba and attacked al-Muti''s palace, denouncing him for weakness — the people rose in their thousands, an army was sent, the Byzantines were routed and their amir and patricians taken, the heads sent to Baghdad with a victory letter {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
