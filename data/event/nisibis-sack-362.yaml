label: { ar: "سقوط نصيبين وفتنة بغداد 362هـ", en: "The fall of Nisibis and the Baghdad riot, 362", es: "La caída de Nisibis y los disturbios de Bagdad, 362", fr: "La chute de Nisibe et l'émeute de Bagdad, 362", ur: "نسیبیوں کا زوال اور بغداد کا فساد، 362", tr: "Nisibis'in düşüşü ve Hicri 362 yılındaki Bağdat ayaklanmaları", id: "Jatuhnya Nisibis dan kerusuhan Baghdad tahun 362 Hijriah" }
summary:
  ar: "في سنة اثنتين وستين وثلثمائة دخلت جموع الروم نصيبين فاستباحوها وقتلوا كثيراً من رجالها وسبوا من نسائها وصبيانها وأقاموا بها نيفاً وعشرين يوماً وغلبوا على ديار ربيعة بأسرها؛ وورد إلى بغداد خلق كثير من أهل تلك البلاد فانتشروا في الجوامع وكسروا المنابر ومنعوا الخطبة وحاولوا الهجوم على دار المطيع لله حتى غُلقت أبوابها ورماهم الغلمان بالنشاب، وخاطبوه بما نسبوه فيه إلى العجز، فاستقبل الناس وخرج من العوام عدد الرمل، ثم أنفذ جيشاً فهزم الروم وقتل منهم خلقاً كثيراً وأسر أميرهم وجماعة من بطارقتهم وأُنفذت رؤوس القتلى إلى بغداد وكُتب معها كتاب إلى المطيع لله يبشر بالفتح {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
  en: "In 362 the Byzantine host entered Nisibis, sacked it and held it twenty-two days, overrunning all Diyar Rabi'a; refugees reaching Baghdad stormed the mosques, broke minbars, barred the khutba and attacked al-Muti''s palace, denouncing him for weakness — the people rose in their thousands, an army was sent, the Byzantines were routed and their amir and patricians taken, the heads sent to Baghdad with a victory letter {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
  es: "En 362, el ejército bizantino entró en Nisibis, la saqueó y la mantuvo durante veintidós días, invadiendo todo Diyar Rabi'a; los refugiados que llegaron a Bagdad asaltaron las mezquitas, rompieron los minbares, impidieron la jutba y atacaron el palacio de al-Muti, denunciándolo por debilidad; el pueblo se levantó por miles, se envió un ejército, los bizantinos fueron derrotados y su emir y patricios fueron capturados, sus cabezas enviadas a Bagdad con una carta de victoria {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
  fr: "En 362, l'armée byzantine entra à Nisibe, la pilla et la tint pendant vingt-deux jours, envahissant tout Diyar Rabi'a; les réfugiés atteignant Bagdad prirent d'assaut les mosquées, brisèrent les minbars, empêchèrent le khutba et attaquèrent le palais d'al-Muti', le dénonçant pour sa faiblesse — le peuple se souleva par milliers, une armée fut envoyée, les Byzantins furent mis en déroute et leur émir et leurs patriciens furent faits prisonniers, leurs têtes envoyées à Bagdad avec une lettre de victoire {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
  ur: "362 میں بازنطینی میزبان نسیبس میں داخل ہوا، اسے برطرف کر دیا اور اسے 22 دن تک روکے رکھا، تمام دیار ربیعہ کو زیر کر لیا۔ بغداد پہنچنے والے مہاجرین نے مساجد پر دھاوا بول دیا، منبر توڑ دیے، خطبہ سے روک دیا اور المطیٰ کے محل پر حملہ کیا، اس کی کمزوری کی مذمت کرتے ہوئے - لوگ ہزاروں کی تعداد میں اٹھے، ایک لشکر بھیج دیا گیا، بازنطینیوں کو شکست دی گئی اور ان کے امیر اور سرپرستوں کو لے لیا گیا، سرداروں کو ایک خط کے ساتھ بغداد بھیجا گیا j.7 صفحہ 64-65}۔"
  tr: "Hicri 362 yılında Roma orduları Nisibis'e girdi ve şehri yağmaladı, birçok erkeğini öldürdü ve kadınlarını ve çocuklarını esir aldı. Yirmi günden fazla orada kaldılar ve Rabi'ah topraklarının tamamını fethettiler. Bu topraklardan çok sayıda insan Bağdat'a geldi ve camilere dağılarak minberleri kırdı ve vaazları engelledi. El-Muti'li-Allah'ın evine saldırmaya çalıştılar, ancak kapıları kapandı ve hizmetkarlar onlara ok attı. Ona, zayıflık olarak nitelendirdikleri şeylerle saldırdılar. Bunun üzerine o da halkı kabul etti ve kum taneleri kadar çok sayıda sıradan insan çıktı. Sonra Romalıları yenen, birçoğunu öldüren ve liderlerini ve bir grup patriklerini esir alan bir ordu gönderdi. Öldürülenlerin başları Bağdat'a gönderildi ve onlarla El-Muti'li-Allah'a zaferi ilan eden bir mektup yazıldı. {alıntı:muntazam-ibn-el-cevzi j.7 s.64-65}."
  id: "Pada tahun 362 H, pasukan Romawi memasuki Nisibis dan menjarahnya, membunuh banyak laki-laki dan menawan perempuan serta anak-anaknya. Mereka tinggal di sana selama lebih dari dua puluh hari dan menaklukkan seluruh wilayah Rabi’ah. Sejumlah besar orang dari wilayah tersebut datang ke Baghdad dan menyebar di masjid-masjid, merusak mimbar dan mencegah khotbah. Mereka mencoba menyerang rumah Al-Muti’ li-Allah hingga pintunya tertutup dan para pelayan menembakkan panah ke arah mereka. Mereka menuduhnya lemah. Maka beliau menerima orang-orang itu dan jumlah rakyat jelata keluar sebanyak butiran pasir. Kemudian beliau mengirimkan pasukan yang mengalahkan Romawi dan membunuh banyak dari mereka serta menangkap pemimpin mereka dan sekelompok leluhur mereka. Kepala-kepala orang yang terbunuh dikirim ke Baghdad dan sebuah surat ditulis bersama kepala-kepala tersebut kepada Al-Muti’ li-Allah yang mengumumkan kemenangan. {cite:muntazam-ibn-al-jawzi j.7 p.64-65}."
