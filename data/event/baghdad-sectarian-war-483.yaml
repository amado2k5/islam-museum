label: { ar: "فتنة السنة والرافضة ببغداد سنة 483", en: "Sunni-Rafida Strife in Baghdad in 483", fr: "Troubles entre sunnites et Rafida à Bagdad en 483", es: "Lucha entre sunitas y Rafida en Bagdad en 483", ur: "483 میں بغداد میں سنی-رفیدہ جھگڑا۔" }
summary:
  ar: "في سنة ثلاث وثمانين وأربعمائة قامت ببغداد فتنة هائلة لم يسمع بمثلها بين السنة والرافضة فقتل بينهم عدد كثير وعجز والي البلد، واستطهرت السنة بكثرة من معهم من أعوان الخليفة واستكانت الشيعة وذلوا ولزموا التقية حتى كتبوا على مساجد الكرخ خير الناس بعد رسول الله أبو بكر {cite:shadharat-dhahab p. 368}."
  en: "In 483 an unprecedented fitna broke out in Baghdad between the Sunna and the Rafida with many killed and the governor helpless; the Sunna prevailed with the caliph's backers until the Shi'a humbled, kept taqiyya, and wrote on the Karkh mosques 'the best of men after the Messenger of God is Abu Bakr' {cite:shadharat-dhahab p. 368}."
  fr: "En 483, une fitna sans précédent éclata à Bagdad entre la Sunna et les Rafida, faisant de nombreux morts, le gouverneur étant impuissant ; la Sunna l'emporta avec les partisans du calife jusqu'à ce que les chiites, humiliés, pratiquent la taqiyya et écrivent sur les mosquées de Karkh « le meilleur des hommes après le Messager de Dieu est Abu Bakr » {cite:shadharat-dhahab p. 368}."
  es: "En 483 estalló en Bagdad una fitna sin precedentes entre los sunitas y los rafidíes, con muchos muertos y el gobernador impotente; los sunitas prevalecieron con el apoyo de los califas hasta que los chiítas se humillaron, practicaron la taqiyya y escribieron en las mezquitas de Karkh: \"El mejor de los hombres después del Mensajero de Dios es Abu Bakr\" {cita: shadharat-dhahab p. 368}."
  ur: "483 میں بغداد میں سنت اور رفیدہ کے درمیان ایک بے مثال فتنہ پھوٹ پڑا جس میں بہت سے لوگ مارے گئے اور گورنر بے بس ہو گئے۔ خلیفہ کے حامیوں کے ساتھ سنت غالب رہی یہاں تک کہ شیعہ عاجزی کرتے رہے، تقیہ کرتے رہے اور کرخ مساجد پر لکھا کہ ''رسول اللہ کے بعد سب سے بہتر آدمی ابوبکر ہیں''۔ 368}۔"
