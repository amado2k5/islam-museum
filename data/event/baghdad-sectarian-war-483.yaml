summary:
  ar: "في سنة ثلاث وثمانين وأربعمائة قامت ببغداد فتنة هائلة لم يسمع بمثلها بين السنة والرافضة فقتل بينهم عدد كثير وعجز والي البلد، واستطهرت السنة بكثرة من معهم من أعوان الخليفة واستكانت الشيعة وذلوا ولزموا التقية حتى كتبوا على مساجد الكرخ خير الناس بعد رسول الله أبو بكر {cite:shadharat-dhahab p. 368}."
  en: "In 483 an unprecedented fitna broke out in Baghdad between the Sunna and the Rafida with many killed and the governor helpless; the Sunna prevailed with the caliph's backers until the Shi'a humbled, kept taqiyya, and wrote on the Karkh mosques 'the best of men after the Messenger of God is Abu Bakr' {cite:shadharat-dhahab p. 368}."
