label: { ar: "بناء مدرسة قرة طاي بقونية، ٦٤٩هـ", en: "The Karatay madrasa is built at Konya, 649/1251", ur: "قونیہ میں قرہ طائے مدرسہ کی تعمیر، 649ھ/1251ء", es: "La madrasa Karatay se construye en Konya, 649/1251", fr: "La madrasa Karatay est construite à Konya, 649/1251", tr: "Konya'da Karatay Medresesi'nin inşaatı, H. 649", id: "Pembangunan Madrasah Karatay di Konya, 649 H" }
summary:
  ar: "بُنيت مدرسة قرة طاي بقونية سنة ٦٤٩هـ/١٢٥١–١٢٥٢م على شهادة كتابتها، وقد بقي منها مدخلها الرخامي الشهير — نظير أناضولي لأسلوب دمشق — وقبتها المرصعة بالنجوم ذات الفتحة العليا فوق بركة صحن الإيوان محمولةً على مقرنصات مبلطة؛ وتضم اليوم مجموعة الخزف السلجوقي {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  en: "The Karatay Medrese at Konya was built in 649/1251-52, as its inscription records. It retains its famous marble portal — an Anatolian variant of the Damascus style — and the starscape dome with an oculus over the pool of the court-hall, borne on deep fan-shaped tiled pendentives; the monument now houses a collection of Seljuk ceramics {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  ur: "قونیہ کا قرہ طائے مدرسہ اپنی کتبے کی گواہی سے 649ھ/1251–52ء میں تعمیر ہوا۔ اس کا مشہور سنگِ مرمر کا داخلی دروازہ — دمشقی طرز کی اناطولی قسم — اور ایوان کے صحن کے حوض کے اوپر محرابی چنوتوں پر اٹھی ستاروں سے سجی گنبد ابھی باقی ہے؛ یہ عمارت آج سلجوقی سفال کا عجائب گھر ہے۔"
  es: "La madraza Karatay de Konya fue construida en el año 649/1251-52, como consta en su inscripción. Conserva su famoso portal de mármol —una variante anatolia del estilo de Damasco— y la cúpula estrellada con un óculo sobre la piscina del patio, sostenida por profundas pechinas de azulejos en forma de abanico; el monumento alberga actualmente una colección de cerámica selyúcida {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  fr: "La médersa Karatay de Konya fut construite en 649/1251-52, comme l'indique son inscription. Elle conserve son célèbre portail en marbre – une variante anatolienne du style damasque – et la coupole étoilée percée d'un oculus au-dessus du bassin de la salle d'audience, soutenue par de profonds pendentifs en faïence en forme d'éventail; le monument abrite aujourd'hui une collection de céramiques seldjoukides (voir: Encyclopaedia of Islam, vol. 5.1, p. 289)."
  tr: "Konya'daki Karatay Medresesi, kitabeye göre 649 Hicri/1251-1252 Miladi yılında inşa edilmiştir. Şam tarzının Anadolu'daki karşılığı olan ünlü mermer girişi ve eyvan avlusunun havuzunun üzerindeki üst açıklığı çini mukarnaslarla desteklenen yıldızlarla süslü kubbesi günümüze kadar ulaşmıştır. Günümüzde Selçuklu seramikleri koleksiyonuna ev sahipliği yapmaktadır."
  id: "Madrasah Karatay di Konya dibangun pada tahun 649 H/1251–1252 M, menurut prasastinya. Pintu masuknya yang terkenal dari marmer — yang merupakan padanan gaya Damaskus di Anatolia — dan kubah bertabur bintang dengan bukaan atas di atas kolam halaman iwan, yang ditopang oleh muqarnas berubin, masih tetap ada. Saat ini, madrasah ini menyimpan koleksi keramik Seljuk."
