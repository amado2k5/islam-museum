  ar: "وقع الخلف بين جلال الدين بن خوارزم شاه وأخيه غياث الدين الذي كان نازلًا عند الإسماعيلية، فتفرق كثير من عساكر جلال الدين إليه {cite:kamil-ibn-al-athir p. 476}."
  en: "A breach opened between Jalal al-Din and his brother Ghiyath al-Din, who had lodged with the Ismailis; many of Jalal al-Din's troops defected to him {cite:kamil-ibn-al-athir p. 476}."
