  ur: "جلال الدین اور اس کے بھائی غیاث الدین، جو اسماعیلیوں کے ساتھ مقیم تھے، کے درمیان ایک شگاف کھل گیا۔ جلال الدین کی بہت سی فوجیں اس کی طرف مائل ہو گئیں۔ 476}۔"
  tr: "Celaleddin ibn Harezm Şah ile İsmaililer arasında kalan kardeşi Gıyateddin arasında bir anlaşmazlık çıktı ve Celaleddin'in askerlerinin çoğu onun tarafına geçti. {Kaynak: Kamil ibn el-Atir s. 476}"
  id: "Terjadi perselisihan antara Jalal al-Din ibn Khwarazm Shah dan saudaranya Ghiyath al-Din, yang tinggal bersama kaum Ismaili, dan banyak tentara Jalal al-Din berpencar ke pihaknya {cite:kamil-ibn-al-athir p. 476}."
