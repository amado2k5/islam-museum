label:
  ar: كتب الهادي إلى أهل المدينة في ذي القعدة سنة 283هـ
  en: Al-Hadi's letters to Medina, Dhu al-Qa'da 283 AH
  ur: ہادی کے خطوط مدینہ کے نام، ذو القعدہ 283ھ
summary:
  ar: وردت في ذي القعدة سنة 283هـ كتب من الهادي على نفر من بني أبي طالب بالمدينة يدعوهم إلى طاعة الله والجهاد، ويخبرهم أن أهل اليمن كتبوا إليه يسألونه الخروج ويعطونه بيعاتهم.
  en: In Dhu al-Qa'da 283 AH letters from al-Hadi reached a group of the Banu Abi Talib and others at Medina, calling them to obey God and strive, and telling them that Yemenis had written asking him to come and giving their pledges.
  ur: ذو القعدہ 283ھ میں ہادی کے خطوط مدینہ میں بنو ابی طالب وغیرہ کے کچھ لوگوں کو ملے، جن میں انہیں اللہ کی اطاعت اور جہاد کی دعوت تھی اور بتایا گیا تھا کہ اہل یمن نے ان سے آنے کی درخواست کی اور بیعتیں دی ہیں۔
