label: { ar: "آخر أيام عثمان ووصيته ودفنه في حش كوكب", en: "Last days, testament and burial of Uthman at Hashsh Kawkab", ur: "عثمان کے آخری دن، وصیت اور حش کوکب میں تدفین" }
summary:
  ar: "قبل يوم مقتله قال عثمان لمن في الدار، وهم نحو سبعمائة، إنه يقسم على من له عليه حق أن يكف يده وينطلق، وأعتق من أغمد سيفه من رقيقه {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180}. وتُروى رؤياه في ليلة مقتله بصور منها أن النبي قال له أفطر عندنا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 181}، ووُجدت في صندوق خزانته ورقة هي وصيته بالشهادة والبعث {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}، وقيل أوصى إلى الزبير {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}. ودُفن ليلاً في حش كوكب شرقي البقيع وهو أول من دُفن فيه، وصلى عليه جبير بن مطعم في المشهور، واختُلف في غسله {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 514} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 189}."
  en: "The day before he was killed Uthman told those in the house, about seven hundred, that he charged anyone who owed him loyalty to hold back his hand and go, and freed any slave who sheathed his sword {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180}. His dream on the night of his death is told in several forms, among them the Prophet saying 'break your fast with us' {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 181}; a sheet found in a chest in his treasury is his testament of faith and resurrection {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}, and he is said to have made al-Zubayr his executor {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}. He was buried by night at Hashsh Kawkab, east of al-Baqi', the first buried there, with Jubayr ibn Mut'im named most often as having prayed over him; whether he was washed is disputed {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 514} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 189}."
  ur: "قتل سے ایک دن پہلے عثمان نے گھر میں موجود تقریباً سات سو افراد سے کہا کہ جن کا ان پر حق ہو وہ ہاتھ روک کر چلے جائیں، اور جس غلام نے تلوار نیام میں ڈالی اسے آزاد کر دیا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180}۔ ان کی شہادت کی رات کے خواب کئی صورتوں میں مروی ہیں، ایک میں نبی کہتے ہیں کہ ہمارے پاس افطار کرو {cite:al-bidaya-wal-nihaya scan vol. 4 p. 180} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 181}؛ خزانے کے صندوق سے ملنے والا ورق ان کی ایمان و بعث کی وصیت ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}، اور کہا جاتا ہے کہ انھوں نے زبیر کو وصی بنایا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 182}۔ انھیں رات کو بقیع کے مشرق میں حش کوکب میں دفن کیا گیا، وہ اس میں پہلے دفن ہونے والے تھے، اور جبیر بن مطعم کا نام نماز پڑھانے والے کے طور پر سب سے زیادہ آتا ہے؛ ان کے غسل میں اختلاف ہے {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 514} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 189}۔"
