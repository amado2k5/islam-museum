label:
  ar: 'أقوال الهادي في صعدة كما سمعها محمد بن عبيد الله: العزم والدعاء ومصحف بينه وبين الناس'
  en: 'Al-Hadi''s sayings at Sa''da as Muhammad ibn Ubaydallah heard them: resolve, prayer, and the Qur''an between him and the people'
  ur: 'صعدہ میں ہادی کے اقوال جیسے محمد بن عبید اللہ نے سنے: عزم، دعا اور لوگوں کے درمیان مصحف'
  es: "Los dichos de Al-Hadi en Sa'da, tal como los escuchó Muhammad ibn Ubaydallah: resolución, oración y el Corán entre él y la gente."
  fr: "Paroles d'Al-Hadi à Sa'da, telles que Muhammad ibn Ubaydallah les a entendues: la détermination, la prière et le Coran entre lui et le peuple"
  tr: "Muhammed ibn Ubeyd'in rivayetine göre, Sa'de'de Hadi'nin sözleri şöyledir: Allah, kendisiyle insanlar arasında azim, dua ve Kur'an-ı Kerim'in bir kopyasını bulundurur."
  id: "Ucapan-ucapan Al-Hadi dalam Sa'dah, sebagaimana didengar oleh Muhammad ibn Ubayd: Allah: tekad, doa, dan salinan Al-Quran antara dia dan orang-orang."
summary:
  ar: 'يروي محمد بن عبيد الله ما سمعه من الهادي في صعدة: تمنيه الصبر وتحمل الجوع في سبيل إصلاح الأمة، ودعاؤه حين مرض أن يحييه الله حتى يبلغه الجهاد، ووصفه راية أصحابه براية بدر، وقوله لو علم أن أحداً من أهل البيت أقوم بالأمر منه لاتبعه، وإمساكه المصحف وقوله إنه إن خالفه بحرف فلا طاعة له.'
  en: 'Muhammad ibn Ubaydallah relates what he heard al-Hadi say at Sa''da: his wish to endure hunger for the good of the community, his prayer when ill that God keep him alive to reach jihad, his comparing his followers'' banner to that of Badr, his saying that he would follow anyone of the family better fitted for the task, and his holding up the Qur''an and saying that if he departed from it by a letter he was owed no obedience.'
  ur: 'محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے صعدہ میں ہادی سے کیا سنا: امت کی اصلاح کے لیے بھوک سہنے کی تمنا، بیماری میں یہ دعا کہ اللہ انہیں جہاد تک زندہ رکھے، اپنے ساتھیوں کے جھنڈے کو بدر کے جھنڈے سے تشبیہ، یہ کہنا کہ اہل بیت میں سے کوئی اس کام کے لیے ان سے بہتر ہو تو وہ اس کی پیروی کریں گے، اور مصحف اٹھا کر کہنا کہ اگر وہ ایک حرف بھی اس کے خلاف جائیں تو ان کی اطاعت نہیں۔'
  es: "Muhammad ibn Ubaydallah relata lo que oyó decir a al-Hadi en Sa'da: su deseo de soportar el hambre por el bien de la comunidad, su oración cuando estaba enfermo para que Dios lo mantuviera con vida para llegar a la yihad, su comparación del estandarte de sus seguidores con el de Badr, su afirmación de que seguiría a cualquiera de la familia mejor capacitado para la tarea, y su exhibición del Corán diciendo que si se apartaba de él ni siquiera por una letra, no se le debía obediencia alguna."
  fr: "Muhammad ibn Ubaydallah rapporte ce qu'il a entendu dire à al-Hadi à Sa'da: son souhait d'endurer la faim pour le bien de la communauté, sa prière lorsqu'il était malade pour que Dieu le garde en vie afin qu'il puisse atteindre le jihad, sa comparaison de la bannière de ses partisans à celle de Badr, sa déclaration qu'il suivrait n'importe quel membre de la famille mieux apte à la tâche, et son geste de brandir le Coran en disant que s'il s'en écartait d'une seule lettre, il ne méritait aucune obéissance."
  tr: "Muhammed ibn Ubeyd Allah, Sa'de'de el-Hadi'den duyduklarını şöyle aktarır: ümmeti ıslah etmek uğruna sabretme ve açlığa katlanma isteği; hastayken Allah'tan kendisini iyileştirmesini ve cihat edebilmesini dilemesi; arkadaşlarının sancağını Bedir sancağı olarak nitelendirmesi; aileden birinin kendisinden daha yetenekli olduğunu bilseydi onu takip edeceğini söylemesi; Kur'an'ı elinde tutması ve Kur'an'a bir harf bile aykırı düşerse kendisine itaat edilmeyeceğini söylemesi."
  id: "Muhammad ibn Ubayd Allah meriwayatkan apa yang didengarnya dari al-Hadi di Sa’dah: harapannya akan kesabaran dan ketahanan menahan lapar demi mereformasi bangsa, doanya ketika sakit agar Allah menghidupkannya kembali sehingga ia dapat mencapai jihad, deskripsinya tentang panji para sahabatnya sebagai panji Badar, ucapannya bahwa jika ia mengetahui bahwa seseorang dari keluarganya lebih mampu dalam suatu perkara daripada dirinya, ia akan mengikutinya, ia memegang Al-Qur'an dan ucapannya bahwa jika ia bertentangan dengannya bahkan hanya dengan satu huruf, maka tidak ada ketaatan kepadanya."
