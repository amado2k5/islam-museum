id: event/qifti-dies-646
class: event
kind: death
label:
  ar: "وفاة القاضي الأكرم القفطي بحلب، رمضان ٦٤٦هـ"
  en: "The Qadi al-Akram al-Qifti dies at Aleppo, Ramadan 646/1248"
  ur: "قاضی اکرم قفطی کا حلب میں انتقال، رمضان 646ھ/1248ء"
  es: "El Qadi al-Akram al-Qifti muere en Alepo, Ramadán 646/1248"
  fr: "Le Qadi al-Akram al-Qifti meurt à Alep, Ramadan 646/1248"
  tr: "Hakimin Akram el-Kifti'nin Halep'te vefatı, Hicri 646 Ramazan ayı."
  id: "Wafatnya Hakim Akram al-Qifti di Aleppo, Ramadan 646 Hijriah"
summary:
  ar: "توفي الوزير الأكرم جمال الدين علي بن يوسف الشيباني القفطي في رمضان سنة ست وأربعين وستمائة {cite:tarikh-islam-dhahabi p. 326} {cite:shadharat-dhahab p. 236}؛ جمع من الكتب ما لم يجمعه أحد، ولم يكن له دار ولا زوجة، وأوصى بكتبه — وكانت تساوي خمسين ألف دينار — للناصر صاحب حلب {cite:tarikh-islam-dhahabi p. 325}."
  en: "The vizier al-Qadi al-Akram Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti died in Ramadan 646/1248-9 {cite:tarikh-islam-dhahabi p. 326} {cite:shadharat-dhahab p. 236}; he had assembled a library no one else had matched, kept neither house nor wife, and bequeathed his books — worth fifty thousand dinars — to al-Malik al-Nasir of Aleppo {cite:tarikh-islam-dhahabi p. 325}."
  ur: "وزیر قاضی اکرم جمال الدین علی بن یوسف شیبانی قفطی رمضان 646ھ/1248ء میں حلب میں فوت ہوئے {cite:tarikh-islam-dhahabi p. 326} {cite:shadharat-dhahab p. 236}؛ انھوں نے کتب کا وہ مجموعہ جمع کیا جو کسی اور کے پاس نہیں تھا، نہ گھر تھا نہ زوجہ، اور اپنی کتب — پچاس ہزار دینار مالیت — ناصر صاحب حلب کے لیے وصیت کی {cite:tarikh-islam-dhahabi p. 325}۔"
  es: "El visir al-Qadi al-Akram Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti murió en Ramadán 646/1248-9 {cite:tarikh-islam-dhahabi p. 326} {cite:shadharat-dhahab p. 236}; había reunido una biblioteca que nadie más había igualado, no tenía ni casa ni esposa, y legó sus libros —valorados en cincuenta mil dinares— a al-Malik al-Nasir de Alepo {cite:tarikh-islam-dhahabi p. 325}."
  fr: "Le vizir al-Qadi al-Akram Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti mourut en Ramadan 646/1248-9 {cite:tarikh-islam-dhahabi p. 326} {cite:shadharat-dhahab p. 236}; il avait constitué une bibliothèque que personne d'autre n'avait égalée, ne possédait ni maison ni femme, et légua ses livres — d'une valeur de cinquante mille dinars — à al-Malik al-Nasir d'Alep {cite:tarikh-islam-dhahabi p. 325}."
  tr: "En şerefli vezir Cemaleddin Ali ibn Yusuf el-Şeybani el-Kifti, Hicri 646 yılının Ramazan ayında vefat etti {kaynak:tarikh-islam-dhahabi s. 326} {kaynak:şadharat-dhahab s. 236}; herkesten daha fazla kitap toplamıştı ve ne evi ne de karısı vardı; elli bin dinar değerindeki kitaplarını Halep hükümdarı el-Nasır'a miras bıraktı {kaynak:tarikh-islam-dhahabi s. 325}."
  id: "Menteri yang terhormat, Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti, wafat pada bulan Ramadan tahun 646 H {cite:tarikh-islam-dhahabi hlm. 326} {cite:shadharat-dhahab hlm. 236}; beliau mengumpulkan lebih banyak buku daripada siapa pun, dan beliau tidak memiliki rumah maupun istri, dan beliau mewariskan buku-bukunya — yang bernilai lima puluh ribu dinar — kepada al-Nasir, penguasa Aleppo {cite:tarikh-islam-dhahabi hlm. 325}."
