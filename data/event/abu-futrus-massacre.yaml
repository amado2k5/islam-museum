label: { ar: "قتل بني أمية على نهر أبي فطرس", en: "the Abu Futrus massacre", fr: "Le massacre d’Abu Futrus", es: "La masacre de Abu Futrus", ur: "ابو فیوٹرس کا قتل عام", tr: "Emeviler, Ebu Futrus Nehri kıyısında öldürüldüler.", id: "Dinasti Umayyah terbunuh di tepi Sungai Abu Futrus." }
summary:
  ar: "نزل عبد الله بن علي على نهر أبي فطرس من بلاد فلسطين والأردن فقتل من بني أمية هناك بضعاً وثمانين رجلاً يوم الأربعاء للنصف من ذي القعدة سنة اثنتين وثلاثين ومائة، وقتل بالبلقاء سليمان بن يزيد بن عبد الملك وحمل رأسه إليه {cite:muruj-al-dhahab p. 232-233}."
  en: "'Abd Allah ibn 'Ali's slaughter of eighty-odd Umayyads at Nahr Abi Futrus in Palestine — Wednesday, mid-Dhu'l-Qa'da 132 {cite:muruj-al-dhahab p. 232-233}."
  fr: "Abd Allah ibn Ali massacra plus de quatre-vingts Omeyyades à Nahr Abi Futrus, en Palestine, le mercredi, au milieu de dhu al-qa'da 132 {cite:muruj-al-dhahab p. 232-233}."
  es: "La masacre de 'Abd Allah ibn 'Ali de ochenta omeyas en Nahr Abi Futrus en Palestina - miércoles, mediados de Dhu'l-Qa'da 132 {cita:muruj-al-dhahab p. 232-233}."
  ur: "عبد اللہ ابن علی کا فلسطین میں نہر ابی فطرس میں اسّی امویوں کا قتل – بدھ، ذوالقعدہ 132 کے وسط میں 232-233}۔"
  tr: "Abdullah bin Ali, Filistin ve Ürdün topraklarındaki Ebu Futrus Nehri'ne indi ve 132 yılında, Zilhicce ayının ortasında, Çarşamba günü orada Beni Umayya kabilesinden seksen kişiyi öldürdü. Balka'da Süleyman bin Yazid bin Abdülmalik'i öldürdü ve başını ona götürdü. {cite:muruj-al-dhahab s. 232-233}"
  id: "Abdullah bin Ali turun ke Sungai Abu Futrus di tanah Palestina dan Yordania, dan dia membunuh delapan puluh orang dari Bani Umayyah di sana pada hari Rabu, pertengahan Dzul Qa'dah, tahun seratus tiga puluh dua. Dia membunuh Sulaiman bin Yazid bin Abd al-Malik di Balqa dan membawa kepalanya kepadanya. {cite:muruj-al-dhahab hlm. 232-233}."
