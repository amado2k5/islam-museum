id: event/mustansir-great-famine
class: event
kind: famine
label: { ar: "غلاء مصر العظيم في أيام المستنصر", en: "The great famine in Egypt under al-Mustansir", es: "La gran hambruna en Egipto bajo el mandato de al-Mustansir.", fr: "La grande famine en Égypte sous al-Mustansir", ur: "المستنصر کے تحت مصر میں عظیم قحط", tr: "Al-Mustansir'in hükümdarlığı döneminde Mısır'da büyük enflasyon yaşandı.", id: "Inflasi besar di Mesir selama pemerintahan Al-Mustansir" }
summary:
  ar: "قال الذهبي في أيام المستنصر العبيدي كان الغلاء بمصر الذي ما عهد مثله منذ زمان يوسف فأقام سبع سنين حتى أكل الناس بعضهم بعضاً وحتى قيل إنه بيع رغيف بخمسين ديناراً {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  en: "Al-Dhahabi: under the Ubaydid al-Mustansir came Egypt's famine unmatched since Joseph's days — it lasted seven years till people ate one another and a loaf was said to sell for fifty dinars {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  es: "Al-Dhahabi: bajo el Ubaydid al-Mustansir sobrevino en Egipto una hambruna sin precedentes desde los tiempos de José; duró siete años hasta que la gente se comía entre sí y se decía que un pan se vendía por cincuenta dinares {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  fr: "Al-Dhahabi: sous le règne d'Ubaydid al-Mustansir, la famine en Égypte survint, sans précédent depuis l'époque de Joseph; elle dura sept ans, jusqu'à ce que les gens se mangent entre eux et qu'un pain se vende, dit-on, cinquante dinars {cite: tarikh-khulafa-minhaj-1434 p. 644}."
  ur: "الذہبی: عبید المستنصر کے تحت مصر کا قحط جوزف کے زمانے سے بے مثال آیا - یہ سات سال تک جاری رہا یہاں تک کہ لوگ ایک دوسرے کو کھا گئے اور کہا گیا کہ ایک روٹی پچاس دینار میں بکتی ہے۔ 644}۔"
  tr: "El-Dhahabi şöyle dedi: El-Mustansir El-Ubaidi zamanında Mısır'da Yusuf zamanından beri görülmemiş bir kıtlık yaşandı. Yedi yıl sürdü ve insanlar birbirlerini yediler. Bir somun ekmeğin elli dinara satıldığı rivayet edilir. {cite:tarikh-khulafa-minhaj-1434 s. 644}"
  id: "Al-Dhahabi berkata: Pada masa Al-Mustansir Al-Ubaidi, terjadi kelaparan di Mesir yang belum pernah terjadi sebelumnya sejak zaman Yusuf. Kelaparan itu berlangsung selama tujuh tahun hingga orang-orang saling memakan satu sama lain, dan dikatakan bahwa sepotong roti dijual seharga lima puluh dinar. {cite:tarikh-khulafa-minhaj-1434 p. 644}."
