summary:
  ar: "طلب الحاكم أبو عبد الله ابن البيّع العلم من الصغر باعتناء أبيه وخاله، فكان أول سماعه سنة ثلاثين وثلاثمائة وهو ابن نحو تسع سنين {cite:tarikh-islam-dhahabi pp. 122-127}."
  en: "Al-Hakim Abu Abd Allah Ibn al-Bayyi' sought knowledge from childhood under the care of his father and maternal uncle; his first hearing of hadith came in 330/941-2, when he was about nine years old {cite:tarikh-islam-dhahabi pp. 122-127}."
  ur: "حاکم ابو عبداللہ ابن بیّع نے بچپن سے ہی اپنے والد اور ماموں کی کفالت میں علم کی طلب شروع کی؛ ان کی اولین سماعِ حدیث 330ھ/941ء میں ہوئی جب وہ تقریباً نو برس کے تھے {cite:tarikh-islam-dhahabi pp. 122-127}۔"
