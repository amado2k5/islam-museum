label:
  ar: "النويري صاحب ديوان الإنشاء بطرابلس، صفر ٧١٠هـ/يوليو ١٣١٠م"
  en: "Al-Nuwayri arrives at Tripoli as sahib diwan al-insha', Safar 710/July 1310"
  ur: "نويری طرابلس میں صاحب دیوان انشاء، صفر 710ھ/جولائی 1310ء"
summary:
  ar: "وصل النويري إلى طرابلس في صفر ٧١٠هـ/يوليو ١٣١٠م صاحبَ ديوان الإنشاء خلفاً لكبير الموظفين تاج الدين الطويل مستوفي الدولة ⁦(ت ٧١١هـ)⁩، وبعد أشهر في السنة نفسها عُيّن ناظر الجيش خلفاً لنجم الدين القصير الذي مات قريباً؛ وسافر كثيراً في طرابلس كما فعل قبلها بالصعيد ودمشق، وأقام بها حتى سنة ٧١٢هـ فشهد انشقاق نائب دمشق إلى المغول {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  en: "Al-Nuwayri reached Tripoli in Safar 710 (July 1310) as sahib diwan al-insha', head of the correspondence office, replacing the senior official Taj al-Din al-Tawil, mustawfi al-dawla (d. 711); a few months later the same year he was appointed nazir al-jaysh in place of the lately deceased Najm al-Din al-Qasir. He travelled extensively during his time at Tripoli, as he had in Upper Egypt and Damascus, and stayed until 712/1312, witnessing the governor of Damascus's defection to the Mongols {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  ur: "نويری صفر 710ھ (جولائی 1310ء) میں طرابلس پہنچے، صاحب دیوان انشاء کے طور پر — مراسلات کے دفتر کے سربراہ — سینئر افسر تاج الدین طویل مستوفی الدولة (وفات 711ھ) کے جانشیں؛ اسی سال چند ماہ بعد انھیں ناظر الجیش مقرر کیا گیا حال ہی میں فوت ہونے والے نجم الدین قصیر کے بجائے۔ انہوں نے طرابلس قیام کے دوران وسیع سفر کیا جیسے پہلے صعید اور دمشق میں کیا تھا، اور 712ھ/1312ء تک وہاں رہے، دمشق کے نائب کے منگولوں سے الحاق کا مشاہدہ کیا {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}۔"
