id: event/umar-devil-avoids-his-path
class: event
kind: other
label:
  ar: "الشيطان لا يلقى عمر في فج إلا سلك فجاً غيره"
  en: "The shaytan never meets Umar on a path but takes another"
  ur: "شیطان عمر کے راستے پر کبھی نہیں آتا مگر دوسرا راستہ اختیار کرتا ہے"
summary:
  ar: "يقول النبي لعمر «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim} [[passage/muslim-2396|مسلم 2396]]."
  en: "The Prophet says to Umar 'by Him in Whose hand is my soul, Satan has never met you walking a path but he took another path than yours' {cite:sahih-muslim} [[passage/muslim-2396|Muslim 2396]]."
  ur: "نبی عمر سے کہتے ہیں «اس کی قسم جس کے ہاتھ میں میری جان ہے، شیطان تمہیں کبھی راستہ چلتے نہیں ملا مگر اس نے تمہارے راستے سے غیر راستہ اختیار کیا» {cite:sahih-muslim} [[passage/muslim-2396|مسلم 2396]]۔"
