id: event/umar-devil-avoids-his-path
class: event
kind: other
label:
  ar: "الشيطان لا يلقى عمر في فج إلا سلك فجاً غيره"
  en: "The shaytan never meets Umar on a path but takes another"
  ur: "شیطان عمر کے راستے پر کبھی نہیں آتا مگر دوسرا راستہ اختیار کرتا ہے"
  es: "El shaytan nunca se encuentra con Umar en un camino, sino que toma otro."
  fr: "Le shaytan ne rencontre jamais Umar sur un chemin, mais en emprunte un autre."
  tr: "Şeytan, Ömer'le bir yoldan karşılaşmadan asla başka bir yola sapmaz."
  id: "Iblis tidak pernah bertemu Omar di satu jalan tanpa mengambil jalan lain."
summary:
  ar: "يقول النبي لعمر «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim} [[passage/muslim-2396|مسلم 2396]]."
  en: "The Prophet says to Umar 'by Him in Whose hand is my soul, Satan has never met you walking a path but he took another path than yours' {cite:sahih-muslim} [[passage/muslim-2396|Muslim 2396]]."
  ur: "نبی عمر سے کہتے ہیں «اس کی قسم جس کے ہاتھ میں میری جان ہے، شیطان تمہیں کبھی راستہ چلتے نہیں ملا مگر اس نے تمہارے راستے سے غیر راستہ اختیار کیا» {cite:sahih-muslim} [[passage/muslim-2396|مسلم 2396]]۔"
  es: "El Profeta le dice a Umar: \"Por Aquel en cuya mano está mi alma, Satanás nunca te ha encontrado caminando por un camino que no haya tomado otro que el tuyo\" {cite:sahih-muslim} [[passage/muslim-2396|Muslim 2396]]."
  fr: "Le Prophète dit à Umar: « Par Celui qui tient mon âme entre Ses mains, Satan ne t'a jamais rencontré sur un chemin sans en emprunter un autre que le tien » {cite:sahih-muslim} [[passage/muslim-2396|Muslim 2396])."
  tr: "Peygamberimiz Ömer'e şöyle buyurdu: \"Canım elinde olan Allah'a yemin ederim ki, şeytan seninle bir yolda yürürken karşılaştığında her zaman senin yolundan sapmıştır.\" {sahih-müslim} [[pasaj/müslim-2396|Müslim 2396]]."
  id: "Nabi Muhammad SAW bersabda kepada Umar, “Demi Dia yang jiwaku berada di tangan-Nya, setan tidak pernah bertemu denganmu di jalan mana pun kecuali ia menempuh jalan yang berbeda dari jalanmu.” {cite:sahih-muslim} [[passage/muslim-2396|Muslim 2396]]."
