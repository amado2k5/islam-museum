label:
  ar: "تمام «فتح الباري» شرح صحيح البخاري، ٨٤٢هـ/١٤٣٨م"
  en: "Completion of Fath al-Bari, the commentary on Sahih al-Bukhari, 842/1438"
  ur: "«فتح الباری» شرح صحیح بخاری کی تکمیل، 842ھ/1438ء"
summary:
  ar: "أتم ابن حجر شرحه الكبير على صحيح البخاري «فتح الباري» في ١ رجب ٨٤٢هـ/١٨ ديسمبر ١٤٣٨م، وقد صاغت مقدمته سنة ٨١٣هـ/١٤١٠-١٤١١م وتشكّل عبر دروس ألقاها من ٨١٧هـ/١٤١٤م إلى تمامه {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. وبلغت شهرة الكتاب حداً جعل شاهرخ حاكم التيموريين على فارس وسجستان يطلب من سلطان مصر برسباي سنة ٨٣٣هـ/١٤٢٩-١٤٣٠م أن يوصل إليه نسخاً مما نُشر منه، كما فعل الحفصي أبو فارس عبد العزيز من المغرب {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "Ibn Hajar finished Fath al-Bari, his great commentary on Sahih al-Bukhari, on 1 Rajab 842 (18 December 1438). Its introduction had been composed in 813/1410-11 and the work itself grew out of lecture courses he gave from 817/1414 until its completion {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. Its fame was such that in 833/1429-30 the Timurid ruler of Fars and Sijistan, Shah Rukh, asked Egypt's sultan Barsbay to send him copies of what had so far been published — a request echoed from the other end of the Muslim world by the Hafsid Abu Faris Abd al-Aziz {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "ابن حجر نے صحیح بخاری کی اپنی عظیم شرح «فتح الباری» 1 رجب 842ھ (18 دسمبر 1438ء) کو مکمل کی۔ اس کا مقدمہ 813ھ/1410-11ء میں لکھا گیا اور خود کتاب 817ھ/1414ء سے تکمیل تک دیے گئے دروس سے جنم لیتی رہی {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔ اس کی شہرت ایسی تھی کہ 833ھ/1429-30ء میں فارس و سجستان کے تیموری حکمران شاہ رخ نے مصر کے سلطان برسبائی سے اب تک کے شائع شدہ حصوں کی نقلیں بھیجنے کا کہا — اور مسلم دنیا کے دوسرے کنارے سے حفصی ابو فارس عبدالعزیز نے بھی ایسی ہی درخواست کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
