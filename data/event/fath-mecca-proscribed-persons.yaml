id: event/fath-mecca-proscribed-persons
class: event
kind: other
label: { en: "The proscribed persons on the day of the Conquest", ar: "من أهدرت دماؤهم يوم فتح مكة" }
summary:
  en: "Prior to entering Mecca, the Prophet ordered the army to fight only those who offered armed resistance, except for a small named group of individuals accused of apostasy combined with murder, severe physical harm, or treasonous incitement, ordered slain even if found under the Kaaba's curtains. Several were executed, while others were granted protection and returned to Islam."
  ar: "عهد النبي إلى أمرائه ألا يقاتلوا إلا من قاتلهم، واستثنى نفرًا محددين سمّاهم وأمر بقتلهم ولو تعلقوا بأستار الكعبة لجرائم قتل مقترنة بالردة أو أذى شديد أو هجاء تحريضي؛ فقُتل بعضهم واستؤمن لآخرين فعفا عنهم وأسلموا."
