id: event/fath-mecca-proscribed-persons
class: event
kind: other
label: { en: "The proscribed persons on the day of the Conquest", ar: "من أهدرت دماؤهم يوم فتح مكة", es: "Las personas proscritas el día de la Conquista", fr: "Les personnes proscrites le jour de la Conquête", ur: "فتح کے دن ممنوعہ افراد", tr: "Mekke'nin fethi gününde kanı dökülenler", id: "Mereka yang darahnya tertumpah pada hari penaklukan Mekah" }
summary:
  en: "Prior to entering Mecca, the Prophet ordered the army to fight only those who offered armed resistance, except for a small named group of individuals accused of apostasy combined with murder, severe physical harm, or treasonous incitement, ordered slain even if found under the Kaaba's curtains. Several were executed, while others were granted protection and returned to Islam."
  ar: "عهد النبي إلى أمرائه ألا يقاتلوا إلا من قاتلهم، واستثنى نفرًا محددين سمّاهم وأمر بقتلهم ولو تعلقوا بأستار الكعبة لجرائم قتل مقترنة بالردة أو أذى شديد أو هجاء تحريضي؛ فقُتل بعضهم واستؤمن لآخرين فعفا عنهم وأسلموا."
  es: "Antes de entrar en La Meca, el Profeta ordenó al ejército que combatiera únicamente a quienes ofrecieran resistencia armada, con la excepción de un pequeño grupo de individuos acusados de apostasía combinada con asesinato, lesiones graves o incitación a la traición, a quienes se ordenó ejecutar incluso si se les encontraba bajo las cortinas de la Kaaba. Varios fueron ejecutados, mientras que a otros se les concedió protección y se convirtieron al Islam."
  fr: "Avant d'entrer à La Mecque, le Prophète ordonna à l'armée de ne combattre que ceux qui offriraient une résistance armée, à l'exception d'un petit groupe d'individus nommément désignés, accusés d'apostasie aggravée par un meurtre, des violences graves ou une incitation à la trahison, et condamnés à mort même s'ils étaient trouvés sous les rideaux de la Kaaba. Plusieurs furent exécutés, tandis que d'autres bénéficièrent d'une protection et se convertirent à l'islam."
  ur: "مکہ میں داخل ہونے سے پہلے، نبی نے فوج کو صرف ان لوگوں سے لڑنے کا حکم دیا جنہوں نے مسلح مزاحمت کی، سوائے ان افراد کے ایک چھوٹے سے گروپ کے جن پر قتل، شدید جسمانی نقصان، یا غداری کے لیے اکسانے کا الزام لگایا گیا تھا، چاہے وہ کعبہ کے پردے کے نیچے ہی کیوں نہ ہوں، قتل کرنے کا حکم دیا۔ کئی کو پھانسی دے دی گئی، جب کہ دیگر کو تحفظ دیا گیا اور اسلام واپس آ گئے۔"
  tr: "Peygamber, komutanlarına sadece kendileriyle savaşanlarla savaşmalarını emretti ve Kâbe'nin perdelerine tutunsalar bile öldürülmelerini emrettiği belirli bir grup insan için istisna yaptı; bu kişiler cinayet, küfür, ağır yaralama veya alaya alma suçlarından dolayı öldürüleceklerdi. Bazıları öldürüldü, diğerlerine ise güvenli geçiş sağlandı; böylece Peygamber onları affetti ve onlar da İslam'ı kabul ettiler."
  id: "Nabi memerintahkan para komandannya untuk tidak berperang kecuali melawan mereka yang memerangi mereka, dan beliau membuat pengecualian untuk kelompok orang tertentu yang beliau sebutkan namanya dan perintahkan untuk dibunuh meskipun mereka berpegangan pada tirai Ka'bah, karena kejahatan pembunuhan yang disertai dengan kemurtadan, penganiayaan berat, atau menghasut satire. Sebagian dari mereka terbunuh, dan sebagian lainnya diberi jalan aman, sehingga beliau mengampuni mereka dan mereka masuk Islam."
