class: event
kind: treaty
label: { ar: "صلح الأحنف قصر الأحنف ومرو الروذ", en: "al-Ahnaf's Sulh at Qasr al-Ahnaf and Marw al-Rudh", fr: "Accords d’al-Ahnaf à Qasr al-Ahnaf et Marw al-Rudh", es: "Sulh de al-Ahnaf en Qasr al-Ahnaf y Marw al-Rudh" }
summary:
  ar: "وجه ابن عامر الأحنف بن قيس نحو طغارستان فأتى الموضع الذي يقال له قصر الأحنف وهو حصن من مرو الروذ وله رستاق عظيم يعرف برستاق الأحنف ويدعى بشق الجرذ فحصر أهله فصالحوه على ثلاثمائة ألف فقال الأحنف أصالحكم على أن يدخل رجل منا القصر فيؤذن فيه ويقيم فيكم حتى أنصرف فرضوا وكان الصلح على جميع الرستاق ومضى الأحنف إلى مرو الروذ فحصر أهلها وقاتلوه قتالاً شديداً فهزمهم المسلمون فاضطروهم إلى حصنهم وكان المرزبان من ولد باذان صاحب اليمن أو ذا قرابة له فكتب إلى الأحنف إنه دعاني إلى الصلح إسلام باذان فصالحه على ستين ألفاً وقال المدائني قال قوم ستمائة ألف وقد كانت للأحنف خيل سارت فأخذت رستاقاً يقال له بغ واستاقت منه مواشي فكان الصلح بعد ذلك."
  en: "Al-Ahnaf went toward Tugharistan to the place called Qasr al-Ahnaf — a fortress of Marw al-Rudh whose great rustaq bears his name, 'Shaqq al-Jarradh' — besieged it, and its folk truced at three hundred thousand; his condition: 'a man of ours enters the castle, gives the adhan in it, and stays among you till I return' — accepted, and the sulh covered the whole rustaq. At Marw al-Rudh they fought hard before being forced into the fort; its marzban, of Badhan of Yemen's line or kin, wrote that Badhan's Islam summoned him to peace — truced at sixty thousand, al-Mada'ini's sources say six hundred — after al-Ahnaf's horse had already taken Rustaq Bagh with its herds."
  fr: "Al-Ahnaf marcha vers le Tugharistan jusqu’au lieu nommé Qasr al-Ahnaf, forteresse de Marw al-Rudh dont le vaste district porte son nom, « Shaqq al-Jarradh ». Il l’assiégea, et les habitants conclurent la paix pour trois cent mille, à condition qu’un de ses hommes entrât dans le château, y lançât l’appel à la prière et y restât jusqu’à son retour. L’accord couvrait tout le district. À Marw al-Rudh, les habitants combattirent âprement avant d’être refoulés dans le fort ; leur marzban, descendant ou parent de Badhan du Yémen, écrivit que l’islam de Badhan l’invitait à la paix. L’accord fut conclu pour soixante mille, ou six cent mille selon les sources d’al-Mada'ini, après que les cavaliers d’al-Ahnaf eurent déjà pris le district de Bagh et ses troupeaux."
  es: "Al-Ahnaf se dirigió hacia Tugharistán, al lugar llamado Qasr al-Ahnaf, una fortaleza de Marw al-Rudh cuyo gran rustaq lleva su nombre, 'Shaqq al-Jarradh'. La sitió, y su gente pagó una tregua de trescientos mil hombres; su condición: 'un hombre nuestro entrará en el castillo, dará el adhan en él y permanecerá entre vosotros hasta que yo regrese'. Fue aceptada, y el sulh cubrió todo el rustaq. En Marw al-Rudh lucharon con fiereza antes de ser forzados a entrar en la fortaleza; su marzban, de la línea o pariente de Badhan de Yemen, escribió que el Islam de Badhan lo llamó a la paz —patrulló por sesenta mil hombres, las fuentes de al-Mada'ini dicen seiscientos— después de que la caballería de al-Ahnaf ya hubiera tomado Rustaq Bagh con sus rebaños."
