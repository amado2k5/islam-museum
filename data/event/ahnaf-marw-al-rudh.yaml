label: { ar: "صلح الأحنف قصر الأحنف ومرو الروذ", en: "al-Ahnaf's Sulh at Qasr al-Ahnaf and Marw al-Rudh", fr: "Accords d’al-Ahnaf à Qasr al-Ahnaf et Marw al-Rudh", es: "Sulh de al-Ahnaf en Qasr al-Ahnaf y Marw al-Rudh", ur: "الاحناف کی سلح قصر الاحناف اور مروۃ الرض", tr: "Al-Ahnaf barış antlaşması, Al-Ahnaf sarayı ve Merw al-Rudh", id: "Perjanjian damai Al-Ahnaf, istana Al-Ahnaf dan Marw al-Rudh" }
summary:
  ar: "وجه ابن عامر الأحنف بن قيس نحو طغارستان فأتى الموضع الذي يقال له قصر الأحنف وهو حصن من مرو الروذ وله رستاق عظيم يعرف برستاق الأحنف ويدعى بشق الجرذ فحصر أهله فصالحوه على ثلاثمائة ألف فقال الأحنف أصالحكم على أن يدخل رجل منا القصر فيؤذن فيه ويقيم فيكم حتى أنصرف فرضوا وكان الصلح على جميع الرستاق ومضى الأحنف إلى مرو الروذ فحصر أهلها وقاتلوه قتالاً شديداً فهزمهم المسلمون فاضطروهم إلى حصنهم وكان المرزبان من ولد باذان صاحب اليمن أو ذا قرابة له فكتب إلى الأحنف إنه دعاني إلى الصلح إسلام باذان فصالحه على ستين ألفاً وقال المدائني قال قوم ستمائة ألف وقد كانت للأحنف خيل سارت فأخذت رستاقاً يقال له بغ واستاقت منه مواشي فكان الصلح بعد ذلك."
  en: "Al-Ahnaf went toward Tugharistan to the place called Qasr al-Ahnaf — a fortress of Marw al-Rudh whose great rustaq bears his name, 'Shaqq al-Jarradh' — besieged it, and its folk truced at three hundred thousand; his condition: 'a man of ours enters the castle, gives the adhan in it, and stays among you till I return' — accepted, and the sulh covered the whole rustaq. At Marw al-Rudh they fought hard before being forced into the fort; its marzban, of Badhan of Yemen's line or kin, wrote that Badhan's Islam summoned him to peace — truced at sixty thousand, al-Mada'ini's sources say six hundred — after al-Ahnaf's horse had already taken Rustaq Bagh with its herds."
  fr: "Al-Ahnaf marcha vers le Tugharistan jusqu’au lieu nommé Qasr al-Ahnaf, forteresse de Marw al-Rudh dont le vaste district porte son nom, « Shaqq al-Jarradh ». Il l’assiégea, et les habitants conclurent la paix pour trois cent mille, à condition qu’un de ses hommes entrât dans le château, y lançât l’appel à la prière et y restât jusqu’à son retour. L’accord couvrait tout le district. À Marw al-Rudh, les habitants combattirent âprement avant d’être refoulés dans le fort ; leur marzban, descendant ou parent de Badhan du Yémen, écrivit que l’islam de Badhan l’invitait à la paix. L’accord fut conclu pour soixante mille, ou six cent mille selon les sources d’al-Mada'ini, après que les cavaliers d’al-Ahnaf eurent déjà pris le district de Bagh et ses troupeaux."
  es: "Al-Ahnaf se dirigió hacia Tugharistán, al lugar llamado Qasr al-Ahnaf, una fortaleza de Marw al-Rudh cuyo gran rustaq lleva su nombre, 'Shaqq al-Jarradh'. La sitió, y su gente pagó una tregua de trescientos mil hombres; su condición: 'un hombre nuestro entrará en el castillo, dará el adhan en él y permanecerá entre vosotros hasta que yo regrese'. Fue aceptada, y el sulh cubrió todo el rustaq. En Marw al-Rudh lucharon con fiereza antes de ser forzados a entrar en la fortaleza; su marzban, de la línea o pariente de Badhan de Yemen, escribió que el Islam de Badhan lo llamó a la paz —patrulló por sesenta mil hombres, las fuentes de al-Mada'ini dicen seiscientos— después de que la caballería de al-Ahnaf ya hubiera tomado Rustaq Bagh con sus rebaños."
  ur: "الاحناف تغرستان کی طرف قصر الاحناف نامی جگہ پر گیا - مرو الرض کا ایک قلعہ جس کا عظیم رستاق اس کا نام 'شق الجراد' ہے - نے اس کا محاصرہ کیا، اور اس کے لوگ تین لاکھ پر شکست کھا گئے۔ اس کی شرط: 'ہمارا ایک آدمی قلعہ میں داخل ہوتا ہے، اس میں اذان دیتا ہے، اور جب تک میں واپس نہیں آتا تمہارے درمیان رہے گا' - قبول کر لیا گیا، اور سلح نے پورے رستاق کو ڈھانپ لیا۔ مرو الرض میں انہوں نے زبردستی قلعہ میں داخل ہونے سے پہلے سخت جنگ کی۔ اس کے مرزبان نے، جو یمن کے قبیلہ کے بدھان سے ہے، لکھا ہے کہ بدھان کے اسلام نے اسے صلح کے لیے بلایا - ساٹھ ہزار پر صلح کی، المدینی کے ذرائع کے مطابق چھ سو - جب الاحناف کا گھوڑا اپنے ریوڑ کے ساتھ رستاق باغ لے چکا تھا۔"
  tr: "İbn Amir, El-Ahnaf bin Kays'ı Togaristan'a yönlendirdi. Merv el-Rudh'da bulunan Kasr el-Ahnaf denilen bir kaleye geldi. Burası, El-Ahnaf bölgesi olarak bilinen ve Şak el-Cerdh olarak adlandırılan büyük bir mahalleye sahipti. Halkını kuşattı ve halk onunla üç yüz bin karşılığında barış yaptı. El-Ahnaf, \"Sizinle barış yapacağım, ancak adamlarımızdan biri saraya girip ezan okuyacak ve ben ayrılana kadar sizinle kalacak\" dedi. Kabul ettiler ve barış tüm mahalle için geçerli oldu. El-Ahnaf, Merv el-Rudh'a gitti ve halkını kuşattı; halk ona karşı şiddetli bir şekilde savaştı. Müslümanlar onları yenerek kalelerine geri püskürttüler. Marzban, Yemen hükümdarı Bedan'ın soyundan veya onun bir akrabasıydı. El-Ahnaf'a, \"Bedan'ın İslam'ı beni barışa çağırdı\" diye yazdı. Bunun üzerine El-Ahnaf onunla altmış bin karşılığında barış yaptı. El-Madaini, “Bazıları altı yüz bin dedi” diye belirtti. El-Ahnaf'ın atları vardı, ilerleyip Bagh denen bir bölgeyi ele geçirdiler ve oradan hayvanlara el koydular. Bundan sonra barış sağlandı."
  id: "Ibn Amir mengarahkan Al-Ahnaf bin Qais ke Togaristan. Ia sampai di tempat yang disebut Qasr Al-Ahnaf, yang merupakan benteng di Marw Al-Rudh. Di sana terdapat distrik besar yang dikenal sebagai distrik Al-Ahnaf, dan disebut Shaq Al-Jardh. Ia mengepung penduduknya, dan mereka berdamai dengannya dengan imbalan tiga ratus ribu orang. Al-Ahnaf berkata, “Aku akan berdamai dengan kalian dengan syarat salah seorang dari kita memasuki istana, mengumandangkan azan di dalamnya, dan tinggal bersama kalian sampai aku pergi.” Mereka setuju, dan perdamaian itu berlaku untuk seluruh distrik. Al-Ahnaf pergi ke Marw Al-Rudh dan mengepung penduduknya, dan mereka melawannya dengan sengit. Kaum Muslim mengalahkan mereka dan memaksa mereka kembali ke benteng mereka. Marzban berasal dari keturunan Badhan, penguasa Yaman, atau kerabatnya. Ia menulis kepada Al-Ahnaf, “Islam Badhan telah menyeruku untuk berdamai.” Maka ia berdamai dengannya dengan imbalan enam puluh ribu orang. Al-Madaini berkata, “Sebagian orang mengatakan enam ratus ribu.” Al-Ahnaf memiliki kuda-kuda yang berbaris dan merebut sebuah distrik bernama Bagh dan mengambil ternak dari sana. Perdamaian pun terjalin setelah itu."
