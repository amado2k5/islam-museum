summary:
  ar: "بطاقة أولية لمعركة دير الرسل المقدسة سنة ١٩٠١م، صمود أندرانيك والفدائيين الأرمن أمام الجيش العثماني في موش؛ لم تُراجع مصادره على الصفحة بعد."
