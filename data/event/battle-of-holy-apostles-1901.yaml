  ur: "1901 میں مقدس رسولوں کی خانقاہ کی جنگ کے لیے ڈرافٹ کارڈ، اندرانک اور آرمینی فدائیوں کا موش میں عثمانی فوج کے خلاف موقف؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1901 yılında gerçekleşen Kutsal Havariler Manastırı Muharebesi'nin ön anlatımı; Andranik ve Ermeni komandolarının Muş'ta Osmanlı ordusuna karşı direnişi; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Biara Para Rasul Suci pada tahun 1901 M, perlawanan Andranik dan pasukan komando Armenia terhadap tentara Ottoman di Mush; sumber-sumbernya belum ditinjau di halaman ini."
