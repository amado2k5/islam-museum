id: event/death-of-abdullah-ibn-abd-al-muttalib
education:
  did_you_know:
    ar: "توفي عبد الله والد النبي في المدينة ودُفن فيها قبل مولد ابنه عند أكثر المؤرخين، وله نحو خمس وعشرين سنة."
    en: "Abdullah, the Prophet's father, died and was buried in Medina before his son's birth in the majority view, aged about twenty-five."
    ur: "عبداللہ، نبی کے والد، مدینہ میں وفات پا کر وہیں دفن ہوئے — اکثر مؤرخین کے نزدیک اپنے بیٹے کی پیدائش سے پہلے، عمر تقریباً پچیس برس۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: event
kind: death
label: { ar: "وفاة عبد الله بن عبد المطلب بالمدينة", en: "Death of Abdullah ibn Abd al-Muttalib at Medina" }
summary:
  ar: "أرسل عبد المطلب ابنه عبد الله إلى المدينة يمتار تمراً، وقيل خرج تاجراً إلى الشام فنزل بها مريضاً، فمات ودُفن في دار النابغة الجعدي وله خمس وعشرون سنة، قبل مولد ابنه عند أكثر المؤرخين وبعده بشهرين في قول، وخلّف خمسة أجمال وقطعة غنم وجارية حبشية هي أم أيمن."
  en: "Abd al-Muttalib sent his son Abdullah to Medina to buy dates, or by another report he fell ill there returning from trade in Syria; he died aged twenty-five and was buried in the house of al-Nabigha al-Jadi, before his son's birth according to most historians or two months after it by one report, leaving five camels, a flock of sheep and an Abyssinian girl, Umm Ayman."
