label: { ar: "وفاة عضد الدولة ابن بويه" }
summary:
  ar: "في شوال سنة اثنتين وسبعين وثلاثمائة مات عضد الدولة بن ركن الدولة بعلة الصرع عن سبع وأربعين سنة وأحد عشر شهراً، وقيل جُدّدت مكوس ومظالم فأُنشد أبياتاً فلازمه الصرع بعدها إلى أن مات، ولما نزل به الموت كان يقول «ما أغنى عني ماليه هلك عني سلطانه» ويرددها إلى أن مات، وأُنشد في احتضاره شعر القاسم بن عبيد الله «فها أنا ذا في حفرتي عاجلاً مُلقى»؛ ودفن في دار المملكة وكُتم موته ثم حُمل بعد ذلك إلى مشهد علي بن أبي طالب، وكان أول من خوطب بشاهنشاه في الإسلام وأول من خُطب له على المنابر ببغداد بعد الخليفة، وهو الذي أظهر قبر علي بالكوفة وبنى عليه المشهد وعمّر النواحي وحفر الأنهار وأصلح طريق مكة وبنى على مدينة النبي سوراً وبنى المارستان العضدي ببغداد وأنفق عليه أموالاً لا تحصى، وبلغ دخله في العام ثلاثمائة ألف ألف وعشرين ألف ألف درهم؛ وأُظهرت وفاته في المحرم سنة ثلاث وسبعين حتى أحضروا ولده صمصام الدولة فجلس للعزاء {cite:shadharat-dhahab p. 78-80}."
  en: "In Shawwal 372 Adud al-Dawla b. Rukn al-Dawla died of epilepsy at forty-seven, repeating 'my wealth avails me not, my sultanate has perished'; buried at Dar al-Mamlaka then moved to Ali's mashhad. The first Buyid hailed as shahinshah, builder of the Kufa shrine, the Medina wall, the Mecca road and Baghdad's Maristan al-Adudi {cite:shadharat-dhahab p. 78-80}."
