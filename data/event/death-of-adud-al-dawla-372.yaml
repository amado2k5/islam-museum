label: { ar: "وفاة عضد الدولة ابن بويه", en: "Death of Adud al-Dawla ibn Buwayh", es: "Muerte de Adud al-Dawla ibn Buwayh", fr: "Mort d'Adud al-Dawla ibn Buwayh", ur: "عود الدولہ ابن بویح کی وفات", tr: "Adud al-Dawla ibn Buwayh'in ölümü", id: "Kematian Adud al-Dawla bin Buwayh" }
summary:
  ar: "في شوال سنة اثنتين وسبعين وثلاثمائة مات عضد الدولة بن ركن الدولة بعلة الصرع عن سبع وأربعين سنة وأحد عشر شهراً، وقيل جُدّدت مكوس ومظالم فأُنشد أبياتاً فلازمه الصرع بعدها إلى أن مات، ولما نزل به الموت كان يقول «ما أغنى عني ماليه هلك عني سلطانه» ويرددها إلى أن مات، وأُنشد في احتضاره شعر القاسم بن عبيد الله «فها أنا ذا في حفرتي عاجلاً مُلقى»؛ ودفن في دار المملكة وكُتم موته ثم حُمل بعد ذلك إلى مشهد علي بن أبي طالب، وكان أول من خوطب بشاهنشاه في الإسلام وأول من خُطب له على المنابر ببغداد بعد الخليفة، وهو الذي أظهر قبر علي بالكوفة وبنى عليه المشهد وعمّر النواحي وحفر الأنهار وأصلح طريق مكة وبنى على مدينة النبي سوراً وبنى المارستان العضدي ببغداد وأنفق عليه أموالاً لا تحصى، وبلغ دخله في العام ثلاثمائة ألف ألف وعشرين ألف ألف درهم؛ وأُظهرت وفاته في المحرم سنة ثلاث وسبعين حتى أحضروا ولده صمصام الدولة فجلس للعزاء {cite:shadharat-dhahab p. 78-80}."
  en: "In Shawwal 372 Adud al-Dawla b. Rukn al-Dawla died of epilepsy at forty-seven, repeating 'my wealth avails me not, my sultanate has perished'; buried at Dar al-Mamlaka then moved to Ali's mashhad. The first Buyid hailed as shahinshah, builder of the Kufa shrine, the Medina wall, the Mecca road and Baghdad's Maristan al-Adudi {cite:shadharat-dhahab p. 78-80}."
  es: "En Shawwal 372, Adud al-Dawla b. Rukn al-Dawla murió de epilepsia a los cuarenta y siete años, repitiendo: «Mi riqueza no me sirve de nada, mi sultanato ha perecido». Fue enterrado en Dar al-Mamlaka y posteriormente trasladado al mashhad de Ali. El primer Buyid fue aclamado como shahinshah, constructor del santuario de Kufa, la muralla de Medina, el camino a La Meca y Maristan al-Adudi de Bagdad {cita: shadharat-dhahab págs. 78-80}."
  fr: "En Shawwal 372, Adud al-Dawla b. Rukn al-Dawla mourut d'épilepsie à l'âge de quarante-sept ans, répétant: « Ma richesse ne me sert à rien, mon sultanat a péri ». Inhumé à Dar al-Mamlaka, sa dépouille fut ensuite transférée à Mashhad, le fief d'Ali. Le premier Bouyide fut salué comme shahinshah, bâtisseur du sanctuaire de Koufa, des remparts de Médine, de la route de La Mecque et du Maristan al-Adudi de Bagdad (voir: shadharat-dhahab, p. 78-80)."
  ur: "شوال 372 عدو الدولہ میں۔ رکن الدولہ سینتالیس سال کی عمر میں مرگی کے مرض میں مبتلا ہو کر انتقال کر گئے، یہ دہراتے ہوئے کہ 'میرا مال میرے کام نہیں آیا، میری سلطنت ختم ہو گئی'؛ دار المملکہ میں دفن ہوئے پھر علی کے مشہد میں منتقل ہوئے۔ پہلے بیع کو شاہین شاہ، کوفہ کے مزار، مدینہ کی دیوار، مکہ سڑک اور بغداد کا مرستان العدودی کا معمار کہا جاتا ہے۔ 78-80}۔"
  tr: "Hicri 372 yılının Şevval ayında, Adud el-Davla ibn Rukn el-Davla, kırk yedi yaş on bir aylıkken epilepsiden öldü. Rivayetlere göre, vergiler ve haksızlıklar yeniden gündeme gelince, şiirler okudu ve epilepsi, ölümüne kadar onunla birlikte kaldı. Ölüm anında, \"Servetim bana fayda vermedi, gücüm benden gitti\" diyordu ve ölene kadar bunu tekrarladı. Ölüm sancıları sırasında, el-Kâsım ibn Ubeydullah'ın \"İşte buradayım, mezarımda yatıyorum, yakında toprağa vereceğim\" şiiri okundu. Kraliyet sarayına defnedildi ve ölümü gizli tutuldu. Daha sonra Ali ibn Ebu Talib türbesine götürüldü. İslam'da Şahanshah olarak hitap edilen ilk kişi ve Halife'den sonra Bağdat'taki minberlerde vaaz verilen ilk kişi oldu. O, Kufa'daki Ali'nin kabrini ortaya çıkaran, üzerine türbe inşa eden, çevreyi geliştiren, kanallar açan, Mekke yolunu onaran, Peygamber şehrinin etrafına sur ören ve Bağdat'ta Adudi Hastanesi'ni inşa ettiren ve bunun için sayısız miktarda para harcayan kişiydi. Yıllık geliri üç yüz milyon yirmi milyon dirheme ulaştı. Ölümü, yetmiş üçüncü yılın Muharrem ayında, oğlu Samsam el-Dawla getirilip yas tutulana kadar ortaya çıktı. {Kaynak: Şadharat-Dhab, s. 78-80}"
  id: "Pada bulan Syawal tahun 372 H, Adud al-Dawla ibn Rukn al-Dawla meninggal dunia karena epilepsi pada usia empat puluh tujuh tahun sebelas bulan. Dikatakan bahwa pajak dan ketidakadilan kembali meningkat, sehingga ia membaca ayat-ayat suci, dan epilepsi tetap menyertainya hingga ia meninggal. Ketika ajal menjemputnya, ia berkata, “Kekayaanku tidak berguna bagiku, kekuatanku telah lenyap dariku,” dan ia terus mengulanginya hingga meninggal. Selama sakaratul mautnya, puisi al-Qasim ibn Ubayd Allah dibacakan, “Di sinilah aku, terbaring di kuburku, sebentar lagi akan dibaringkan.” Ia dimakamkan di istana kerajaan, dan kematiannya dirahasiakan. Kemudian jenazahnya dibawa ke makam Ali ibn Abi Talib. Ia adalah orang pertama yang disebut sebagai Shahanshah dalam Islam dan orang pertama yang khutbahnya disampaikan di mimbar-mimbar di Baghdad setelah Khalifah. Dialah yang menyingkapkan makam Ali di Kufa dan membangun tempat suci di atasnya, serta mengembangkan daerah sekitarnya, menggali kanal, memperbaiki jalan menuju Mekah, membangun tembok di sekitar kota Nabi, dan membangun Rumah Sakit Adudi di Baghdad serta menghabiskan banyak uang untuknya. Pendapatannya pada tahun itu mencapai tiga ratus juta dua puluh juta dirham. Kematiannya diwahyukan pada bulan Muharram tahun tujuh puluh tiga hingga mereka membawa putranya, Samsam al-Dawla, dan dia duduk untuk berkabung {cite:shadharat-dhahab hlm. 78-80}."
