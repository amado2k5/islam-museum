label: { ar: "احتضار أبي بكر وما خلّفه ودفنه", en: "Last hours, estate and burial of Abu Bakr", ur: "ابو بکر کے آخری لمحات، ترکہ اور تدفین", es: "Últimas horas, herencia y entierro de Abu Bakr.", fr: "Dernières heures, succession et inhumation d'Abou Bakr", tr: "Ebu Bekir'in ölümü, geride bıraktıkları ve cenazesi", id: "Kematian Abu Bakr, apa yang ditinggalkannya, dan pemakamannya." }
summary:
  ar: "توفي أبو بكر ليلة الثلاثاء لثمان ليال بقين من جمادى الآخرة سنة ثلاث عشرة وهو ابن ثلاث وستين {cite:kamil-ibn-al-athir scan vol. 1 p. 262}. أوصى أن تغسله زوجته أسماء بنت عميس وابنه عبد الرحمن، وأن يُكفَّن في ثوبيه مع ثالث {cite:kamil-ibn-al-athir scan vol. 1 p. 262}، وأمر برد ما زاد في ماله منذ ولي إلى عمر، فبعثوا عبداً وناضحاً {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}، وردّ ما نحله عائشة إلى الميراث {cite:kamil-ibn-al-athir scan vol. 1 p. 265}. وصلى عليه عمر ونزل في قبره عمر وعثمان وطلحة وابنه عبد الرحمن، ودُفن ليلاً إلى جنب النبي {cite:kamil-ibn-al-athir scan vol. 1 p. 262} {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 258}."
  en: "Abu Bakr died on the night of Tuesday with eight nights left of Jumada II 13 AH, aged sixty-three {cite:kamil-ibn-al-athir scan vol. 1 p. 262}. He ordered that his wife Asma bint Umays and his son wash him and that he be shrouded in his own two garments with a third {cite:kamil-ibn-al-athir scan vol. 1 p. 262}; he had what had increased in his property since taking office sent to Umar, a slave and a water-camel {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}, and the gift he had made to Aisha returned to the inheritance {cite:kamil-ibn-al-athir scan vol. 1 p. 265}. Umar prayed over him; Umar, Uthman, Talha and his son Abd al-Rahman went down into the grave, and he was buried by night beside the Prophet {cite:kamil-ibn-al-athir scan vol. 1 p. 262} {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 258}."
  ur: "ابو بکر منگل کی رات، جمادی الآخرہ سنہ 13ھ کی آٹھ راتیں باقی تھیں، تریسٹھ برس کی عمر میں فوت ہوئے {cite:kamil-ibn-al-athir scan vol. 1 p. 262}۔ انھوں نے وصیت کی کہ ان کی بیوی اسماء بنت عمیس اور بیٹا انھیں غسل دیں اور اپنے دو کپڑوں کے ساتھ تیسرے میں کفن دیا جائے {cite:kamil-ibn-al-athir scan vol. 1 p. 262}؛ خلافت کے بعد مال میں جو اضافہ ہوا وہ عمر کو بھیجا گیا، ایک غلام اور ایک پانی کھینچنے والا اونٹ {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}، اور عائشہ کو دیا ہوا عطیہ میراث میں لوٹا دیا گیا {cite:kamil-ibn-al-athir scan vol. 1 p. 265}۔ عمر نے نماز پڑھائی؛ عمر، عثمان، طلحہ اور بیٹا عبد الرحمن قبر میں اترے اور انھیں رات کو نبی کے پہلو میں دفن کیا گیا {cite:kamil-ibn-al-athir scan vol. 1 p. 262} {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 258}۔"
  es: "Abu Bakr murió la noche del martes, con ocho noches restantes de Jumada II 13 AH, a la edad de sesenta y tres {cite:kamil-ibn-al-athir scan vol. 1 p. 262}. Ordenó que su esposa Asma bint Umays y su hijo lo lavaran y que lo envolvieran en sus dos propias vestiduras con una tercera {cite:kamil-ibn-al-athir scan vol. 1 p. 262}; hizo que lo que había aumentado en sus bienes desde que asumió el cargo fuera enviado a Umar, un esclavo y un camello de agua {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 102}, y el regalo que había hecho a Aisha fue devuelto a la herencia {cite:kamil-ibn-al-athir scan vol. 1 p. 265}. Umar oró por él; Umar, Uthman, Talha y su hijo Abd al-Rahman descendieron a la tumba, y fue enterrado de noche junto al Profeta {cite:kamil-ibn-al-athir scan vol. 1 p. 262} {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 258}."
  fr: "Abou Bakr mourut dans la nuit de mardi à mercredi, à huit nuits de la fin du mois de Jumada II de l'an 13 de l'Hégire, à l'âge de soixante-trois ans. Il ordonna à sa femme Asma bint Umays et à son fils de le laver et qu'il soit enveloppé dans ses deux vêtements et un troisième. Il fit envoyer à Omar ce qui avait accru sa fortune depuis son entrée en fonction, un esclave et un chameau. Le don qu'il avait fait à Aïcha fut réintégré à l'héritage. Omar pria pour lui. Umar, Uthman, Talha et son fils Abd al-Rahman descendirent dans la tombe, et il fut enterré de nuit à côté du Prophète {cite:kamil-ibn-al-athir scan vol. 1 p. 262} {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 258}."
  tr: "Ebu Bekir, Hicri on üçüncü yılda Cemâde-i Ahiret'in bitimine sekiz gece kala, Salı gecesi, altmış üç yaşında vefat etti. Karısı Esme bint Ümeys ve oğlu Abdurrahman'ın bedenini yıkamalarını ve iki elbisesiyle birlikte üçüncü bir kişiyle kefenlenmesini vasiyet etti. Halifeliğinden bu yana servetindeki artışın Ömer'e iade edilmesini emretti; bunun üzerine bir köle ve bir deve gönderildi. Ayrıca Ayşe'ye verdiği mal varlığını da miras olarak iade etti. Cenaze namazını Ömer kıldırdı ve Ömer, Osman, Talha ve oğlu Abdurrahman onun kabrine indiler. Geceleyin Peygamber'in yanına defnedildi."
  id: "Abu Bakr wafat pada Selasa malam, delapan malam sebelum berakhirnya Jumada al-Akhirah tahun ke-13 (Hijrah), pada usia enam puluh tiga tahun. Beliau memerintahkan istrinya, Asma binti Umays, dan putranya, Abd al-Rahman, untuk memandikan jenazahnya, dan agar ia dikafani dengan dua kain kafannya bersama orang ketiga. Beliau memerintahkan agar setiap peningkatan kekayaannya sejak masa kekhalifahannya dikembalikan kepada Umar, sehingga mereka mengirimkan seorang budak dan seekor unta. Beliau juga mengembalikan apa yang telah diberikannya kepada Aisyah sebagai warisan. Umar memimpin salat jenazah, dan Umar, Utsman, Talha, dan putranya Abd al-Rahman turun ke kuburnya. Beliau dimakamkan pada malam hari di samping Nabi. {cite:riyad-nadira-ilmiyya-1984 scan vol. 3p. 258}."
