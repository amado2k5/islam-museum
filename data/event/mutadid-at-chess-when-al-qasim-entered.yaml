summary:
  ar: "كان المعتضد يلعب الشطرنج حين دخل عليه القاسم بن عبيد الله، فأنشد المعتضد بيتاً لعلي بن بسام، ولما رأى القاسم استحيا فأمره أن يقطع عنه لسان ابن بسام، فمضى القاسم مسرعاً ليفعل، حتى أمره المعتضد بالكف {cite:muruj-al-dhahab p. 660}."
  en: "Al-Mu'tadid was playing chess when al-Qasim ibn Ubaydallah came in. The caliph recited a line by Ali ibn Bassam; seeing al-Qasim, he was embarrassed and told him to silence Ibn Bassam. Al-Qasim hurried to do so until the caliph told him to desist {cite:muruj-al-dhahab p. 660}."
  ur: "معتضد شطرنج کھیل رہا تھا جب قاسم بن عبیداللہ اندر آیا۔ خلیفہ نے علی بن بسام کا ایک شعر پڑھا، قاسم کو دیکھ کر شرمندہ ہوا اور اسے ابن بسام کی زبان بند کرنے کو کہا۔ قاسم جلدی سے گیا یہاں تک کہ خلیفہ نے اسے روک دیا {cite:muruj-al-dhahab p. 660}."
