label: { ar: "خروج النبي من داره ليلة الهجرة والاختباء في غار ثور", en: "The Prophet's escape from his house on the night of the Hijra and the hiding in the cave of Thawr", es: "La huida del Profeta de su casa en la noche de la Hégira y su ocultamiento en la cueva de Thawr.", fr: "La fuite du Prophète de sa maison la nuit de l'Hégire et sa cachette dans la grotte de Thawr" }
summary:
  ar: "بعد أن أعلمه جبريل بمؤامرة قريش خرج النبي ليلاً من داره وذر التراب على رؤوس المحاصرين، وخرج مع أبي بكر من خوخة في داره حتى غار ثور، فمكثا فيه ثلاث ليال، وكان ابن أبي بكر يأتيهما بالأخبار، وعامر بن فهيرة يرعى الغنم عليهما؛ ثم طاردتهما قريش فلم يبلغوا باب الغار."
  en: "After Gabriel warned him of Quraysh's plot, the Prophet left his house at night, threw dust over the heads of those watching it, and went out through a back door of Abu Bakr's house to the cave of Thawr, where they hid three nights; Abu Bakr's son brought them news and Amir ibn Fuhayra grazed sheep over their tracks; Quraysh pursued them but did not reach the cave's door."
  es: "Después de que Gabriel le advirtiera del complot de los Quraysh, el Profeta salió de su casa por la noche, arrojó polvo sobre las cabezas de quienes lo observaban y salió por una puerta trasera de la casa de Abu Bakr hacia la cueva de Thawr, donde se escondieron durante tres noches. El hijo de Abu Bakr les trajo noticias y Amir ibn Fuhayra hizo pastorear ovejas sobre sus huellas. Los Quraysh los persiguieron, pero no llegaron a la puerta de la cueva."
  fr: "Après que Gabriel l'eut averti du complot des Quraysh, le Prophète quitta sa maison de nuit, jeta de la poussière sur la tête de ceux qui l'observaient et sortit par une porte arrière de la maison d'Abu Bakr pour se réfugier dans la grotte de Thawr, où ils se cachèrent pendant trois nuits; le fils d'Abu Bakr leur apporta des nouvelles et Amir ibn Fuhayra fit paître des moutons sur leurs traces; les Quraysh les poursuivirent mais n'atteignirent pas la porte de la grotte."
