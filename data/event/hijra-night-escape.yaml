label: { ar: "خروج النبي من داره ليلة الهجرة والاختباء في غار ثور", en: "The Prophet's escape from his house on the night of the Hijra and the hiding in the cave of Thawr" }
summary:
  ar: "بعد أن أعلمه جبريل بمؤامرة قريش خرج النبي ليلاً من داره وذر التراب على رؤوس المحاصرين، وخرج مع أبي بكر من خوخة في داره حتى غار ثور، فمكثا فيه ثلاث ليال، وكان ابن أبي بكر يأتيهما بالأخبار، وعامر بن فهيرة يرعى الغنم عليهما؛ ثم طاردتهما قريش فلم يبلغوا باب الغار."
  en: "After Gabriel warned him of Quraysh's plot, the Prophet left his house at night, threw dust over the heads of those watching it, and went out through a back door of Abu Bakr's house to the cave of Thawr, where they hid three nights; Abu Bakr's son brought them news and Amir ibn Fuhayra grazed sheep over their tracks; Quraysh pursued them but did not reach the cave's door."
