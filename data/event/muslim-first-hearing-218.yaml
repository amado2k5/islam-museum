label:
  ar: "أول سماع مسلم بن الحجاج للحديث، ٢١٨هـ"
  en: "Muslim ibn al-Hajjaj's first hearing of hadith, 218/833"
  ur: "مسلم بن حجاج کا پہلا سماعِ حدیث، 218ھ/833ء"
summary:
  ar: "أول سماع مسلم بن الحجاج سنة ثمانية عشر ومائتين، وهو ابن نحو اثني عشر سنة؛ ثم أكثر الرواية عن يحيى بن يحيى النيسابوري والتميمي والقعنبي وأحمد بن يونس اليربوعي وإسماعيل بن أبي أويس وسعيد بن منصور وأحمد بن حنبل وخلق كثير {cite:tazkirat-al-huffaz j.2 p. 526-527}."
  en: "Muslim ibn al-Hajjaj first heard hadith in 218, when he was about twelve years old; he then transmitted widely from Yahya ibn Yahya al-Naysaburi, al-Tamimi, al-Qa'nabi, Ahmad ibn Yunus al-Yarbu'i, Isma'il ibn Abi Uways, Sa'id ibn Mansur, Ahmad ibn Hanbal and a great many others {cite:tazkirat-al-huffaz j.2 p. 526-527}."
  ur: "مسلم بن حجاج کا پہلا سماع 218ھ میں تھا جب وہ تقریباً بارہ برس کے تھے؛ پھر انہوں نے یحییٰ بن یحییٰ نیشاپوری، تمیمی، قعنبی، احمد بن یونس یربوعی، اسماعیل بن ابی اویس، سعید بن منصور، احمد بن حنبل اور بہت سے مشائخ سے کثرت سے روایت کی {cite:tazkirat-al-huffaz j.2 p. 526-527}۔"
