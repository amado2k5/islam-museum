label:
  ar: "أول سماع مسلم بن الحجاج للحديث، ٢١٨هـ"
  en: "Muslim ibn al-Hajjaj's first hearing of hadith, 218/833"
  ur: "مسلم بن حجاج کا پہلا سماعِ حدیث، 218ھ/833ء"
  es: "Primera escucha de un hadiz por Muslim ibn al-Hajjaj, 218/833"
  fr: "Première réception d'un hadith par Muslim ibn al-Hajjaj, 218/833"
  tr: "Müslim ibn el-Haccac hadisleri ilk kez Hicri 218 yılında işitti."
  id: "Pertama kali Muslim Ibnu al-Hajjaj mendengar hadits adalah pada tahun 218 Hijriah."
summary:
  ar: "أول سماع مسلم بن الحجاج سنة ثمانية عشر ومائتين، وهو ابن نحو اثني عشر سنة؛ ثم أكثر الرواية عن يحيى بن يحيى النيسابوري والتميمي والقعنبي وأحمد بن يونس اليربوعي وإسماعيل بن أبي أويس وسعيد بن منصور وأحمد بن حنبل وخلق كثير {cite:tazkirat-al-huffaz j.2 p. 526-527}."
  en: "Muslim ibn al-Hajjaj first heard hadith in 218, when he was about twelve years old; he then transmitted widely from Yahya ibn Yahya al-Naysaburi, al-Tamimi, al-Qa'nabi, Ahmad ibn Yunus al-Yarbu'i, Isma'il ibn Abi Uways, Sa'id ibn Mansur, Ahmad ibn Hanbal and a great many others {cite:tazkirat-al-huffaz j.2 p. 526-527}."
  ur: "مسلم بن حجاج کا پہلا سماع 218ھ میں تھا جب وہ تقریباً بارہ برس کے تھے؛ پھر انہوں نے یحییٰ بن یحییٰ نیشاپوری، تمیمی، قعنبی، احمد بن یونس یربوعی، اسماعیل بن ابی اویس، سعید بن منصور، احمد بن حنبل اور بہت سے مشائخ سے کثرت سے روایت کی {cite:tazkirat-al-huffaz j.2 p. 526-527}۔"
  es: "Muslim ibn al-Hajjaj escuchó un hadiz por primera vez en 218, cuando tenía unos doce años; luego transmitió ampliamente desde Yahya ibn Yahya al-Naysaburi, al-Tamimi, al-Qa'nabi, Ahmad ibn Yunus al-Yarbu'i, Isma'il ibn Abi Uways, Sa'id ibn Mansur, Ahmad ibn Hanbal y muchos otros {citar:tazkirat-al-huffaz j.2 p. 526-527}."
  fr: "Muslim ibn al-Hajjaj a entendu le hadith pour la première fois en 218, alors qu'il avait environ douze ans; il a ensuite largement transmis Yahya ibn Yahya al-Naysaburi, al-Tamimi, al-Qa'nabi, Ahmad ibn Yunus al-Yarbu'i, Isma'il ibn Abi Uways, Sa'id ibn Mansur, Ahmad ibn Hanbal et bien d'autres {cite: tazkirat-al-huffaz j.2 p. 526-527}."
  tr: "Müslim ibn el-Haccac'ın ilk hadis rivayeti Hicri 218 yılında, yaklaşık on iki yaşındayken gerçekleşmiştir; daha sonra Yahya ibn Yahya el-Naysaburi, el-Tamimi, el-Ka'nabi, Ahmed ibn Yunus el-Yarbu'i, İsmail ibn Abi Uveys, Sa'id ibn Mansur, Ahmed ibn Hanbel ve daha birçoklarından hadislerin çoğunu nakletmiştir. {cite:tazkirat-al-huffaz c.2 s. 526-527}."
  id: "Pertama kali Muslim ibn al-Hajjaj mendengar hadits adalah pada tahun 218 H, ketika ia berusia sekitar dua belas tahun; kemudian ia meriwayatkan sebagian besar hadits dari Yahya ibn Yahya al-Naysaburi, al-Tamimi, al-Qa’nabi, Ahmad ibn Yunus al-Yarbu’i, Ismail ibn Abi Uways, Sa’id ibn Mansur, Ahmad ibn Hanbal, dan banyak lainnya. {cite:tazkirat-al-huffaz j.2 p. 526-527}."
