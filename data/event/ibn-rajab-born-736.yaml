id: event/ibn-rajab-born-736
class: event
kind: other
label:
  ar: "ولادة ابن رجب ببغداد، ربيع الأول ٧٣٦هـ"
  en: "Birth of Ibn Rajab in Baghdad, Rabi' I 736"
  ur: "ابن رجب کی پیدائش بغداد میں، ربیع الاول 736ھ"
  es: "Nacimiento de Ibn Rajab en Bagdad, Rabi' I 736"
  fr: "Naissance d'Ibn Rajab à Bagdad, Rabi' I 736"
  tr: "İbn Receb, H. 736'da Rabi'ul-Evvel'de Bağdat'ta doğdu."
  id: "Ibnu Rajab lahir di Bagdad, Rabi' al-Awwal 736 H."
summary:
  ar: "وُلد زين الدين أبو الفرج عبد الرحمن بن أحمد بن عبد الرحمن بن الحسن السلامي البغدادي الحنبلي، المعروف بابن رجب على لقب جده، ببغداد مدينة السلام في ربيع الأول سنة ست وثلاثين وسبعمئة، باتفاق المصادر التي اطلع عليها محقق «جامع العلوم والحكم»؛ وأرخه ابن حجر سنة ست وسبعمئة ويراه المحقق سبق قلم {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  en: "Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Abd al-Rahman ibn al-Hasan al-Salami al-Baghdadi, known as Ibn Rajab after his grandfather's laqab, was born in Baghdad in Rabi' al-Awwal 736 AH, by agreement of the sources consulted by the editor of Jami' al-Ulum wal-Hikam; Ibn Hajar dated it 706, which the editor considers a slip of the pen {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  ur: "زین الدین ابو الفرج عبد الرحمن بن احمد بن عبد الرحمن بن حسن سلامی بغدادی حنبلی، اپنے دادا کے لقب پر ابن رجب کے نام سے معروف، بغداد میں ربیع الاول 736ھ میں پیدا ہوئے، «جامع العلوم والحکم» کے محقق کی دیکھی ہوئی مصادر کے اتفاق سے؛ ابن حجر نے 706ھ لکھی ہے جسے محقق قلم کی لغزش سمجھتے ہیں {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}۔"
  es: "Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Abd al-Rahman ibn al-Hasan al-Salami al-Baghdadi, conocido como Ibn Rajab por el laqab de su abuelo, nació en Bagdad en Rabi' al-Awwal 736 AH, según el acuerdo de las fuentes consultadas por el editor de Jami' al-Ulum wal-Hikam; Ibn Hajar lo fechó en 706, lo que el editor considera un error de pluma {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  fr: "Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Abd al-Rahman ibn al-Hasan al-Salami al-Baghdadi, connu sous le nom d'Ibn Rajab d'après le laqab de son grand-père, est né à Bagdad en Rabi' al-Awwal 736 AH, selon l'accord des sources consultées par l'éditeur de Jami' al-Ulum wal-Hikam; Ibn Hajar le date de 706, ce que l'éditeur considère comme une erreur de plume {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  tr: "Zeynel Din Ebu el-Faraj Abdülrahman ibn Ahmed ibn Abdülrahman ibn el-Hasan el-Selam el-Bağdadi el-Hanbeli, dedesinin lakabından dolayı İbn Receb olarak bilinir, \"Cami' el-Ulum ve el-Hikam\"ın editörünün danıştığı kaynakların ittifakına göre, yedi yüz otuz altı yılının Rebiü'l-Evvel ayında, Barış Şehri Bağdat'ta doğmuştur; İbn Hacer bunu yedi yüz altı yılına tarihlendirirken, editör bunu bir yazım hatası olarak değerlendirmektedir. {cite:ibn-rajab-jami-ulum-hikam s. 7} {cite:encyclopaedia-of-islam-2 cilt 3 s. 933}"
  id: "Zain al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Abd al-Rahman ibn al-Hasan al-Salami al-Baghdadi al-Hanbali, yang dikenal sebagai Ibn Rajab sesuai dengan julukan kakeknya, lahir di Baghdad, Kota Perdamaian, pada bulan Rabi’ al-Awwal tahun tujuh ratus tiga puluh enam, menurut konsensus sumber-sumber yang dikonsultasikan oleh editor “Jami’ al-‘Ulum wa al-Hikam”; Ibn Hajar memberi tanggal tahun tujuh ratus enam, dan editor menganggapnya sebagai kesalahan penulisan {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
