id: event/ibn-rajab-born-736
class: event
kind: other
label:
  ar: "ولادة ابن رجب ببغداد، ربيع الأول ٧٣٦هـ"
  en: "Birth of Ibn Rajab in Baghdad, Rabi' I 736"
  ur: "ابن رجب کی پیدائش بغداد میں، ربیع الاول 736ھ"
summary:
  ar: "وُلد زين الدين أبو الفرج عبد الرحمن بن أحمد بن عبد الرحمن بن الحسن السلامي البغدادي الحنبلي، المعروف بابن رجب على لقب جده، ببغداد مدينة السلام في ربيع الأول سنة ست وثلاثين وسبعمئة، باتفاق المصادر التي اطلع عليها محقق «جامع العلوم والحكم»؛ وأرخه ابن حجر سنة ست وسبعمئة ويراه المحقق سبق قلم {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  en: "Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad ibn Abd al-Rahman ibn al-Hasan al-Salami al-Baghdadi, known as Ibn Rajab after his grandfather's laqab, was born in Baghdad in Rabi' al-Awwal 736 AH, by agreement of the sources consulted by the editor of Jami' al-Ulum wal-Hikam; Ibn Hajar dated it 706, which the editor considers a slip of the pen {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}."
  ur: "زین الدین ابو الفرج عبد الرحمن بن احمد بن عبد الرحمن بن حسن سلامی بغدادی حنبلی، اپنے دادا کے لقب پر ابن رجب کے نام سے معروف، بغداد میں ربیع الاول 736ھ میں پیدا ہوئے، «جامع العلوم والحکم» کے محقق کی دیکھی ہوئی مصادر کے اتفاق سے؛ ابن حجر نے 706ھ لکھی ہے جسے محقق قلم کی لغزش سمجھتے ہیں {cite:ibn-rajab-jami-ulum-hikam p. 7} {cite:encyclopaedia-of-islam-2 vol. 3 p. 933}۔"
