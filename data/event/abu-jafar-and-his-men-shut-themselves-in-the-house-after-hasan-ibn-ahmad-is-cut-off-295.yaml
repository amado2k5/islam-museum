id: "event/abu-jafar-and-his-men-shut-themselves-in-the-house-after-hasan-ibn-ahmad-is-cut-off-295"
class: event
kind: other
label:
  ar: "أبو جعفر ومن بقي معه يغلقون باب الدار بعد انقطاع الحسن بن أحمد، 295هـ"
  en: "Abu Ja'far and his remaining men shut the door of the house after Hasan ibn Ahmad is cut off, 295 AH, p. 372-373"
  fr: "Abu Ja'far et les hommes qui lui restent ferment la porte de la maison après qu’Hasan ibn Ahmad est isolé, 295 de l’hégire, p. 372-373"
  ur: "حسن بن احمد کے کٹ جانے کے بعد ابو جعفر اور اس کے باقی ساتھی گھر کا دروازہ بند کر لیتے ہیں، 295ھ، ص372-373"
  es: "Abu Ja'far y los hombres que le quedaban cerraron la puerta de la casa después de que Hasan ibn Ahmad fue asesinado, 295 AH, págs. 372-373."
summary:
  ar: "كثرت القوم على الحسن بن أحمد وابن منير، فحالوا بينهما وبين أصحابهما، ثم دخل أبو جعفر بمن بقي معه الدار، وأغلقوا عليهم الباب. وكان آخر ما رآه الراوي منه قبل إغلاق الباب مشمّراً أطراف جوشنه، في يده سيفه ودرقته."
  en: "The enemy pressed on Hasan ibn Ahmad and Ibn Munir and came between them and their companions. Abu Ja'far then went into the house with the men still with him, and they shut the door on themselves. The narrator's last sight of him before the door closed was of Abu Ja'far with the skirts of his mail gathered up, sword and shield in hand."
  fr: "L’ennemi pressa Hasan ibn Ahmad et Ibn Munir et les sépara de leurs compagnons. Abu Ja'far entra alors dans la maison avec les hommes qui lui restaient et ils s’y enfermèrent. La dernière image qu’en eut le narrateur avant la fermeture de la porte était celle d’Abu Ja'far, les pans de sa cotte de mailles relevés, l’épée et le bouclier à la main."
  ur: "دشمن نے حسن بن احمد اور ابن منیر کو گھیر لیا اور انہیں ان کے ساتھیوں سے الگ کر دیا۔ پھر ابو جعفر اپنے باقی ساتھیوں کے ساتھ گھر میں داخل ہوا اور انہوں نے دروازہ بند کر لیا۔ راوی نے دروازہ بند ہونے سے پہلے اسے آخری بار اس حال میں دیکھا کہ اس نے زرہ کے دامن سمیٹے ہوئے تھے، ہاتھ میں تلوار اور ڈھال تھی۔"
  es: "El enemigo presionó a Hasan ibn Ahmad e Ibn Munir, interponiéndose entre ellos y sus compañeros. Entonces Abu Ja'far entró en la casa con los hombres que aún lo acompañaban, y cerraron la puerta tras de sí. La última imagen que el narrador tuvo de él antes de que la puerta se cerrara fue la de Abu Ja'far con los faldones de su cota de malla recogidos, espada y escudo en mano."
