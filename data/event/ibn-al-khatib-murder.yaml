label: { ar: "مقتل ابن الخطيب في محبسه", en: "The killing of Ibn al-Khatib in his prison", es: "El asesinato de Ibn al-Khatib en su prisión.", fr: "L'assassinat d'Ibn al-Khatib dans sa prison", ur: "ابن الخطیب کا جیل میں قتل" }
summary:
  ar: "قتل لسان الدين ابن الخطيب وزير ابن الأحمر بمحبسه بغرناطة؛ ويروي ابن خلدون عن نفسه أن ابن الخطيب بعث إليه من محبسه مستصرخاً ومتوسلاً فخاطب في شأنه أهل الدولة وعول على ابن ماساي فلم تنجح تلك السعاية وقتل بمحبسه، ثم أغري بابن خلدون لشفاعته فيه فأوعز له بمقامه بهنين ثم استقر بتلمسان وفيها أخذ في بث العلم سنة 776هـ {cite:tarikh-ibn-khaldun-ibar p. 2016}."
  en: "Lisan al-Din Ibn al-Khatib was killed in his Granada prison cell; Ibn Khaldun records at first hand the vizier's plea to him from prison and his failed intercession, which then drove his own withdrawal to Tlemcen in 776 {cite:tarikh-ibn-khaldun-ibar p. 2016}."
  es: "Lisan al-Din Ibn al-Khatib fue asesinado en su celda de la prisión de Granada; Ibn Khaldun registra de primera mano la súplica del visir desde la prisión y su fallida intercesión, lo que luego provocó su propia retirada a Tremecén en 776 {cite:tarikh-ibn-khaldun-ibar p. 2016}."
  fr: "Lisan al-Din Ibn al-Khatib fut tué dans sa cellule de prison à Grenade; Ibn Khaldun relate de première main la supplique du vizir depuis sa prison et son intercession infructueuse, qui le poussa ensuite à se retirer à Tlemcen en 776 {cite:tarikh-ibn-khaldun-ibar p. 2016}."
  ur: "لسان الدین ابن الخطیب کو اس کے غرناطہ کی جیل میں قتل کر دیا گیا۔ ابن خلدون نے پہلے ہاتھ میں وزیر کی طرف سے جیل سے اس کی درخواست اور اس کی ناکام شفاعت کو ریکارڈ کیا ہے، جس کے بعد 776 میں اس نے خود کو تلمسن سے واپس لے لیا تھا۔ 2016}۔"
