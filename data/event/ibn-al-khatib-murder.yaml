  en: "Lisan al-Din Ibn al-Khatib was killed in his Granada prison cell; Ibn Khaldun records at first hand the vizier's plea to him from prison and his failed intercession, which then drove his own withdrawal to Tlemcen in 776 {cite:tarikh-ibn-khaldun-ibar p. 2016}."
