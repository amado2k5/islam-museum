id: event/expedition-to-tabuk
education:
  levels: [sprouts, explorers, scholars]
  flagged_for_kids: true
  did_you_know:
    ar: "قاد النبي آخر حملاته إلى تبوك شمال المدينة سنة تسع للهجرة، ولم يقع قتال بحسب سيرة ابن إسحاق."
    en: "The Prophet led his last campaign to Tabuk, north of Medina, in year nine of the Hijra; no fighting occurred, per the sirah of Ibn Ishaq."
    ur: "نبی نے ہجرت کے نویں سال مدینہ کے شمال میں تبوک کی آخری مہم کی قیادت کی؛ ابن اسحاق کی سیرت کے مطابق کوئی لڑائی نہیں ہوئی۔"
    sources: [source/ibn-ishaq-guillaume, source/watt-1956-medina]
class: event
kind: other
label: { en: "The expedition to Tabuk", ar: "غزوة تبوك" }
summary:
  en: "The Prophet led a large expedition north toward the Byzantine frontier as far as Tabuk; no battle took place. وفي صحيح البخاري يروي كعب بن مالك قصة تخلفه عنها بلسانه: المسير في الحر الشديد والمفازة البعيدة، وأن النبي كان يوري بغير الغزوة حتى جلاها هذه المرة، وأن المسلمين كانوا «كثيراً ولا يجمعهم كتاب حافظ» {cite:sahih-al-bukhari 4418}، وعدّها يعلى بن أمية «أوثق أعمالي» {cite:sahih-al-bukhari 4417}."
  ar: "قاد النبي حملة كبيرة شمالًا نحو الحدود البيزنطية حتى تبوك في رجب سنة تسع، ولم يقع قتال بحسب سيرة ابن إسحاق. فصّل ابن إسحاق في رواية ابن هشام الاستنفار في زمن عسرة، وإنفاق الأغنياء، والبكائين، والمتخلفين من المؤمنين والمنافقين، ومسير الجيش بالحجر، وصلح النبي مع صاحب أيلة وأكيدر دومة، والعودة."
