label: { en: "The expedition to Tabuk", ar: "غزوة تبوك", es: "La expedición a Tabuk", fr: "L'expédition à Tabuk", ur: "تبوک کی مہم" }
summary:
  en: "The Prophet led a large expedition north toward the Byzantine frontier as far as Tabuk; no battle took place. وفي صحيح البخاري يروي كعب بن مالك قصة تخلفه عنها بلسانه: المسير في الحر الشديد والمفازة البعيدة، وأن النبي كان يوري بغير الغزوة حتى جلاها هذه المرة، وأن المسلمين كانوا «كثيراً ولا يجمعهم كتاب حافظ» {cite:sahih-al-bukhari 4418}، وعدّها يعلى بن أمية «أوثق أعمالي» {cite:sahih-al-bukhari 4417}."
  ur: "نبی ایک بڑا لشکر شمال کی طرف بازنطینی سرحد تک، تبوک تک لے گئے؛ کوئی جنگ نہیں ہوئی۔ صحیح بخاری میں کعب بن مالک اپنے اس غزوے سے پیچھے رہ جانے کا قصہ خود بیان کرتے ہیں: شدید گرمی اور لمبے بیابان کا سفر، اور یہ کہ نبی عموماً اپنی منزل کو چھپاتے تھے یہاں تک کہ اس بار اسے واضح کر دیا، اور یہ کہ مسلمان بہت زیادہ تھے اور انہیں کوئی محفوظ دفتر جمع نہیں کرتا تھا {cite:sahih-al-bukhari 4418}، اور یعلیٰ بن امیہ نے اسے اپنے سب سے قابلِ اعتماد عمل میں شمار کیا {cite:sahih-al-bukhari 4417}۔"
  ar: "قاد النبي حملة كبيرة شمالًا نحو الحدود البيزنطية حتى تبوك في رجب سنة تسع، ولم يقع قتال بحسب سيرة ابن إسحاق. فصّل ابن إسحاق في رواية ابن هشام الاستنفار في زمن عسرة، وإنفاق الأغنياء، والبكائين، والمتخلفين من المؤمنين والمنافقين، ومسير الجيش بالحجر، وصلح النبي مع صاحب أيلة وأكيدر دومة، والعودة."
  es: "El Profeta dirigió una gran expedición hacia el norte, hacia la frontera bizantina, hasta Tabuk; no se libró ninguna batalla. En Sahih al-Bukhari, Ka'b ibn Malik narra la historia de su ausencia en ella con sus propias palabras: el viaje bajo el intenso calor y el desierto lejano, y que el Profeta había estado insinuando algo más que la expedición hasta que lo dejó claro esta vez, y que los musulmanes eran \"muchos y no había ningún libro que los mantuviera unidos\" {cita:sahih-al-bukhari 4418}, y Ya'la ibn Umayya la consideró \"la más fiable de mis obras\" {cita:sahih-al-bukhari 4417}."
  fr: "Le Prophète mena une importante expédition vers le nord, en direction de la frontière byzantine, jusqu'à Tabuk; aucune bataille n'eut lieu. Dans le Sahih al-Bukhari, Ka'b ibn Malik relate son absence: le voyage sous une chaleur intense et dans un désert lointain; le Prophète avait laissé entendre qu'il s'agissait d'autre chose que de cette expédition jusqu'à ce qu'il le précise cette fois-ci; les musulmans étaient « nombreux et aucun livre ne les unissait » (Sahih al-Bukhari, p. 4418); et Ya'la ibn Umayya considéra cette expédition comme « la plus digne de mes actions » (Sahih al-Bukhari, p. 4417)."
