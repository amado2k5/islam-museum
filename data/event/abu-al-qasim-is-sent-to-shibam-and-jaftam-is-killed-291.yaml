id: event/abu-al-qasim-is-sent-to-shibam-and-jaftam-is-killed-291
class: event
kind: other
label:
  ar: إقامة أبي القاسم بشبام وقتل جفتم، 291هـ
  en: Abu al-Qasim's stay at Shibam and the killing of Jaftam, 291 AH
  ur: ابو القاسم کا شبام میں قیام اور جفتم کا قتل، 291ھ
summary:
  ar: يصل أبو القاسم إلى شبام ومعه الرجل الذي أرسله ابنا يعفر، فيقيم أياماً والكتب تجري بينه وبينهما وهما يعدانه بالإذن بالانصراف، حتى يُقتل جفتم فيأمنون بعده أياماً.
  en: Abu al-Qasim reaches Shibam with the man the sons of Ya'fur sent, stays some days while letters pass between him and them and they promise him leave to go, until Jaftam is killed and they feel secure for some days after.
  ur: ابو القاسم اس آدمی کے ساتھ شبام پہنچتے ہیں جسے یعفر کے بیٹوں نے بھیجا تھا، کچھ دن رہتے ہیں، خط ان کے اور ان کے درمیان چلتے رہتے ہیں اور وہ انہیں جانے کی اجازت کا وعدہ دیتے ہیں، یہاں تک کہ جفتم قتل ہوتا ہے اور اس کے بعد وہ کچھ دن بے خوف رہتے ہیں۔
