id: "event/ali-ibn-al-fadl-advances-on-sanaa-and-is-fought-at-bahrir-in-294-ah"
class: event
kind: other
label:
  ar: "يتقدم علي بن الفضل نحو صنعاء فيقاتله أسعد عند بحرير سنة 294هـ، ص393"
  en: "Ali ibn al-Fadl advances on Sanaa and is fought at Bahrir in 294 AH, p. 393"
  ur: "علی بن الفضل 294ھ میں صنعاء کی طرف بڑھتا ہے اور بحریر میں اس سے لڑائی ہوتی ہے، ص393"
  es: "Ali ibn al-Fadl avanza sobre Sanaa y es combatido en Bahrir en el año 294 de la Hégira, pág. 393."
  fr: "Ali ibn al-Fadl avance sur Sanaa et est combattu à Bahrir en 294 AH, p. 393"
  tr: "Ali ibn al-Fadl Sana'a'ya doğru ilerler ve As'ad, Hicri 294 yılında Bahrir'de onunla savaşır (s. 393)."
  id: "Ali ibn al-Fadl bergerak maju menuju Sana'a, dan As'ad memeranginya di Bahrir pada tahun 294 H, hlm. 393"
summary:
  ar: "ينهض ابن الفضل من المذيخرة في آخر جمادى سنة 294هـ نحو صنعاء، فيقاتله أسعد ومن معه عند بحرير، ويقتلون من أصحابه نحو ستين رجلا، ثم يرجع إلى ما ورد من أمر عسكره وصنعاء."
  en: "Ali ibn al-Fadl sets out from al-Mudhaykhira at the end of Jumada for Sanaa, reaches Bahrir, and is fought by Asad and his men, who kill about sixty of his men. Jarrah and his men then press back against him toward Sanaa."
  ur: "علی بن الفضل جمادی کے آخر میں المذیخرہ سے صنعاء کی طرف چلتا ہے، بحریر پہنچتا ہے، اور اسعد اور ان کے ساتھی اس سے لڑتے ہیں اور اس کے تقریباً ساٹھ ساتھی مارتے ہیں۔ پھر جراح اور اس کے ساتھی اسے صنعاء کی طرف پیچھے دھکیلتے ہیں۔"
  es: "Ali ibn al-Fadl parte de al-Mudhaykhira al final del Jumada rumbo a Sanaa, llega a Bahrir y es combatido por Asad y sus hombres, quienes matan a unos sesenta de ellos. Jarrah y sus hombres lo repliegan hacia Sanaa."
  fr: "Ali ibn al-Fadl quitte al-Mudhaykhira à la fin du mois de Jumada pour Sanaa, atteint Bahrir et est attaqué par Asad et ses hommes, qui tuent une soixantaine de ses hommes. Jarrah et ses hommes le repoussent alors vers Sanaa."
  tr: "İbn el-Fadl, Hicri 294 yılının Cemadi ayının sonlarında el-Mudhaykhirah'tan Sana'a doğru yola çıkar. Esad ve yanındakiler Harir'de onunla savaşır ve yaklaşık altmış arkadaşını öldürürler. Daha sonra ordusu ve Sana'a hakkında anlatılanlara geri döner."
  id: "Ibn al-Fadl bangkit dari al-Mudhaykhirah pada akhir bulan Jumada tahun 294 H menuju Sana'a. As'ad dan orang-orang yang bersamanya memeranginya di Harir, dan mereka membunuh sekitar enam puluh sahabatnya. Kemudian dia kembali ke tempat yang telah dikisahkan tentang pasukannya dan Sana'a."
