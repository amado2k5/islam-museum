label:
  ar: "يتقدم علي بن الفضل نحو صنعاء فيقاتله أسعد عند بحرير سنة 294هـ، ص393"
  en: "Ali ibn al-Fadl advances on Sanaa and is fought at Bahrir in 294 AH, p. 393"
  ur: "علی بن الفضل 294ھ میں صنعاء کی طرف بڑھتا ہے اور بحریر میں اس سے لڑائی ہوتی ہے، ص393"
summary:
  ar: "ينهض ابن الفضل من المذيخرة في آخر جمادى سنة 294هـ نحو صنعاء، فيقاتله أسعد ومن معه عند بحرير، ويقتلون من أصحابه نحو ستين رجلا، ثم يرجع إلى ما ورد من أمر عسكره وصنعاء."
  en: "Ali ibn al-Fadl sets out from al-Mudhaykhira at the end of Jumada for Sanaa, reaches Bahrir, and is fought by Asad and his men, who kill about sixty of his men. Jarrah and his men then press back against him toward Sanaa."
  ur: "علی بن الفضل جمادی کے آخر میں المذیخرہ سے صنعاء کی طرف چلتا ہے، بحریر پہنچتا ہے، اور اسعد اور ان کے ساتھی اس سے لڑتے ہیں اور اس کے تقریباً ساٹھ ساتھی مارتے ہیں۔ پھر جراح اور اس کے ساتھی اسے صنعاء کی طرف پیچھے دھکیلتے ہیں۔"
