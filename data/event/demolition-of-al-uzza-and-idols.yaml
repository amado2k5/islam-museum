label: { en: "The Demolition of al-Uzza and Major Idols", ar: "هدم العزى ومنائر الأصنام الكبرى" }
summary:
  en: "In Ramadan 8 AH immediately following the conquest of Mecca, the Prophet dispatched detachments to obliterate the major pagan sanctuaries of Arabia: Khalid ibn al-Walid destroyed al-Uzza at Nakhla, Amr ibn al-As demolished Suwa' of Hudhayl, and Sa'd ibn Zayd al-Ashhali destroyed Manat at al-Mushallal."
  ar: "في أواخر رمضان 8هـ إثر فتح مكة، بث النبي سراياه لهدم معاقل الوثنية الكبرى في جزيرة العرب: فهدم خالد بن الوليد العزى بنخلة، وهدم عمرو بن العاص سواعاً لهذيل برهاط، وهدم سعد بن زيد الأشهلي مناة بالمشلل."
