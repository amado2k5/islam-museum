id: event/demolition-of-al-uzza-and-idols
class: event
kind: raid
label: { en: "The Demolition of al-Uzza and Major Idols", ar: "هدم العزى ومنائر الأصنام الكبرى", es: "La demolición de al-Uzza y los ídolos mayores", fr: "La démolition d'al-Uzza et des idoles majeures", ur: "العزہ اور بڑے بتوں کا انہدام", tr: "El-Uzza ve büyük put minarelerinin yıkımı", id: "Pembongkaran Al-Uzza dan menara-menara berhala besar" }
summary:
  en: "In Ramadan 8 AH immediately following the conquest of Mecca, the Prophet dispatched detachments to obliterate the major pagan sanctuaries of Arabia: Khalid ibn al-Walid destroyed al-Uzza at Nakhla, Amr ibn al-As demolished Suwa' of Hudhayl, and Sa'd ibn Zayd al-Ashhali destroyed Manat at al-Mushallal."
  ar: "في أواخر رمضان 8هـ إثر فتح مكة، بث النبي سراياه لهدم معاقل الوثنية الكبرى في جزيرة العرب: فهدم خالد بن الوليد العزى بنخلة، وهدم عمرو بن العاص سواعاً لهذيل برهاط، وهدم سعد بن زيد الأشهلي مناة بالمشلل."
  es: "En el Ramadán del año 8 de la Hégira, inmediatamente después de la conquista de La Meca, el Profeta envió destacamentos para aniquilar los principales santuarios paganos de Arabia: Khalid ibn al-Walid destruyó al-Uzza en Nakhla, Amr ibn al-As demolió Suwa' de Hudhayl y Sa'd ibn Zayd al-Ashhali destruyó Manat en al-Mushallal."
  fr: "Au cours du Ramadan de l'an 8 de l'Hégire, immédiatement après la conquête de La Mecque, le Prophète envoya des détachements pour anéantir les principaux sanctuaires païens d'Arabie: Khalid ibn al-Walid détruisit al-Uzza à Nakhla, Amr ibn al-As démolit Suwa' de Hudhayl et Sa'd ibn Zayd al-Ashhali détruisit Manat à al-Mushallal."
  ur: "رمضان المبارک 8 ہجری میں فتح مکہ کے فوراً بعد، نبی نے عرب کے بڑے مشرکین کے مقدس مقامات کو ختم کرنے کے لیے دستے روانہ کیے: خالد بن الولید نے نخلہ میں العزہ کو تباہ کر دیا، عمرو بن العاص نے ہذیل کے سواع کو منہدم کر دیا، اور سعد بن زید المنصور کو تباہ کر دیا۔"
  tr: "Hicri 8. yılın Ramazan ayının sonlarında, Mekke'nin fethinden sonra, Peygamberimiz Arap Yarımadası'ndaki başlıca putperest kalelerini yıkmak için birliklerini gönderdi: Halid ibn el-Velid, Nahla'daki el-Uzza'yı, Amr ibn el-As, Rahat'taki Hudeyl'in Suwa'sını ve Sa'd ibn Zeyd el-Eşhali, el-Muşallal'daki Manat'ı yıktı."
  id: "Pada akhir Ramadan tahun 8 Hijriah, setelah penaklukan Mekah, Nabi mengirimkan pasukannya untuk menghancurkan benteng-benteng penyembahan berhala utama di Semenanjung Arab: Khalid ibn al-Walid menghancurkan al-Uzza di Nakhla, Amr ibn al-Aas menghancurkan Suwa’ di Hudhayl di Rahat, dan Sa’d ibn Zayd al-Ashhali menghancurkan Manat di al-Mushallal."
