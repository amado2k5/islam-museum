label: { ar: "فتح الرقة", en: "The Conquest of al-Raqqa", es: "La conquista de al-Raqqa", fr: "La conquête d'al-Raqqa", ur: "الرقہ کی فتح", tr: "Rakka'nın Fethi", id: "Penaklukan Raqqa" }
summary:
  ar: "عند البلاذري: نزل إياد بن غنم بالرقة فقاتله أهلها حتى جرح بعض المسلمين فتأخر عنهم لئلا تبلغه حجارتهم وسهامهم وركب فطاف حول المدينة ووضع على أبوابها روابط وبث السرايا فجعلوا يأتون بالأسرى من القرى والأطعمة الكثيرة وكانت الزروع مستحصدة، فلما مضت خمسة أيام أو ستة وهم على ذلك أرسل بطريق المدينة إلى إياد يطلب الأمان فصالحه على أن آمن جميع أهلها على أنفسهم وذراريهم وأموالهم ومدينتهم وقال «الأرض لنا قد وطئناها وأحرزناها» فأقرّها في أيديهم على الخراج ودفع منها ما لم يرده أهل الذمة فرفضوه إلى المسلمين على العشر ووضع الجزية على رقابهم فألزم كل رجل منهم ديناراً في كل سنة وأخرج النساء والصبيان ووظف عليهم مع الدينار أقفزة من قمح وشيئاً من زيت وخل وعسل — فلما ولي معاوية جعل ذلك جزية عليهم — وأقاموا للمسلمين سوقاً على باب الرها، وكتب لهم: «بسم الله الرحمن الرحيم، هذا ما أعطى إياد بن غنم أهل الرقة يوم دخلها: أعطاهم أماناً لأنفسهم وأموالهم وكنائسهم لا تخرب ولا تسكن إذا أعطوا الجزية التي عليهم ولم يحدثوا مغيلة، وعلى أن لا يحدثوا كنيسة ولا بيعة ولا يظهروا ناقوساً ولا باعوثاً ولا صليباً، شهد الله وكفى بالله شهيداً» وختم إياد بخاتمه؛ ويقال ألزم كل حالم أربعة دنانير والأثبت أن عمر كتب إلى عمير بن سعد وهو واليه أن ألزم كل امرئ منهم أربعة دنانير كما ألزم أهل الذهب."
  en: "In al-Baladhuri: Iyad ibn Ghanm camped on al-Raqqa and its people fought until some Muslims were wounded, so he drew back out of their stones and arrows, rode a circuit of the city posting guards on its gates and loosed raiding parties bringing captives and abundant provisions from the villages, the crops standing ripe; after five or six days of this the city's patrician sent to Iyad seeking aman, and he compounded on safety for all its people's lives, children, wealth and city — saying 'the land is ours, we have trodden and seized it' — leaving it in their hands on kharaj, what of it the dhimmis declined reverting to the Muslims at the tithe, laying jizya on their necks at a dinar a man yearly — women and boys exempt — with measures of wheat and portions of oil, vinegar and honey charged with it, which Mu'awiya later made their jizya; they opened the gates and kept a Muslims' market at the Ruha gate, and Iyad wrote them: 'In God's name — this is what Iyad ibn Ghanm gave the people of al-Raqqa the day he entered it: safety for their lives, wealth and churches, which shall not be ruined nor left uninhabited, provided they pay the jizya upon them and contrive no treachery, and that they raise no church or synagogue, display no clapper, paschal or cross; God witnesses and suffices as witness' — and he sealed it; some say he bound each adult at four dinars, the sounder report being that Umar later wrote to Umayr ibn Sa'd, his governor, to bind each man at four dinars like the gold-tier."
  es: "En al-Baladhuri: Iyad ibn Ghanm acampó en al-Raqqa y su gente luchó hasta que algunos musulmanes resultaron heridos, entonces se retiró de sus piedras y flechas, recorrió la ciudad colocando guardias en sus puertas y soltó partidas de asalto trayendo cautivos y abundantes provisiones de las aldeas, las cosechas estaban maduras; después de cinco o seis días de esto el patricio de la ciudad envió a Iyad pidiendo aman, y él llegó a un acuerdo sobre la seguridad para la vida de toda su gente, niños, riquezas y ciudad, diciendo 'la tierra es nuestra, la hemos pisoteado y tomado', dejándola en sus manos en kharaj, lo que los dhimmis rechazaron, volviendo a los musulmanes en el diezmo, poniendo jizya sobre sus cuellos a un dinar por hombre al año, mujeres y niños exentos, con medidas de trigo y porciones de aceite, vinagre y miel cargados con ella, que Mu'awiya luego hizo su jizya; Abrieron las puertas y establecieron un mercado musulmán en la puerta de Ruha, e Iyad les escribió: «En el nombre de Dios, esto es lo que Iyad ibn Ghanm les dio a los habitantes de al-Raqqa el día que entró: seguridad para sus vidas, riquezas e iglesias, que no serán arruinadas ni quedarán deshabitadas, siempre que paguen la jizya sobre ellas y no tramen ninguna traición, y que no levanten ninguna iglesia ni sinagoga, ni exhiban ningún badajo, pascual o cruz; Dios es testigo y basta como testigo». Y lo selló; algunos dicen que fijó a cada adulto en cuatro dinares, siendo el relato más fiable que Umar escribió más tarde a Umayr ibn Sa'd, su gobernador, para que fijara a cada hombre en cuatro dinares como en el nivel de oro."
  fr: "Dans al-Baladhuri: Iyad ibn Ghanm campa à al-Raqqa et ses habitants combattirent jusqu'à ce que certains musulmans soient blessés. Il se retira alors de leurs pierres et de leurs flèches, fit le tour de la ville, posta des gardes à ses portes et lança des raids, ramenant des captifs et d'abondantes provisions des villages, les récoltes étant mûres. Après cinq ou six jours de ce régime, le patricien de la ville envoya une requête à Iyad pour obtenir l'aman, et celui-ci assuma la sécurité de tous ses habitants, de leurs vies, de leurs biens et de la ville, déclarant: « La terre est à nous, nous l'avons foulée aux pieds et conquise. » Il la laissa entre leurs mains au kharaj. Que se passerait-il si les dhimmis refusaient de retourner aux musulmans pour la dîme, leur imposant la jizya à hauteur d'un dinar par homme et par an (femmes et garçons exemptés), avec des mesures de blé et des portions d'huile, de vinaigre et de miel, que Mu'awiya imposa plus tard comme leur jizya; Ils ouvrirent les portes et établirent un marché musulman à la porte de Ruha. Iyad leur écrivit alors: « Au nom de Dieu, voici ce qu'Iyad ibn Ghanm accorda aux habitants d'al-Raqqa le jour de son entrée: la sécurité de leurs vies, de leurs biens et de leurs églises, qui ne seront ni ruinées ni abandonnées, à condition qu'ils s'acquittent de la jizya et ne commettent aucune trahison, qu'ils n'édifient ni église ni synagogue, et qu'ils n'exposent ni clocher, ni croix pascale. Dieu en est témoin et cela suffit. » Puis il scella le document. Certains affirment qu'il imposa une amende de quatre dinars à chaque adulte, mais la version la plus crédible rapporte qu'Umar écrivit plus tard à Umayr ibn Sa'd, son gouverneur, pour qu'il impose une amende de quatre dinars à chaque homme, comme le faisait le régime de l'or."
  ur: "البلادوری میں ہے: عیاض بن غنم نے الرقہ پر پڑاؤ ڈالا اور وہاں کے لوگوں سے لڑتے رہے یہاں تک کہ کچھ مسلمان زخمی ہو گئے، چنانچہ وہ اپنے پتھروں اور تیروں سے پیچھے ہٹ گیا، شہر کے ایک چکر پر سوار ہوا اور اس کے دروازوں پر پہرے دار تعینات کیے اور چھاپہ مار گروہوں کو ڈھیل دیا جو قیدیوں کو لاتے ہوئے اور وافر سامان لے کر آئے، گاؤں سے فصلیں کھڑی تھیں۔ اس کے پانچ یا چھ دن کے بعد شہر کے سرپرست نے امان کی تلاش میں عیاد کے پاس بھیجا، اور اس نے تمام لوگوں کی جان، اولاد، مال اور شہر کی حفاظت پر اکتفا کیا - کہنے لگا کہ 'زمین ہماری ہے، ہم نے اسے پامال کیا اور اس پر قبضہ کر لیا' - اسے خرج پر چھوڑ دیا، اس کی کیا بات ہے کہ ذمیوں نے ایک سال کی نچلی رات میں مسلمانوں کی طرف لوٹنے سے انکار کر دیا۔ عورتیں اور لڑکے مستثنیٰ ہیں - گندم کی پیمائش اور اس کے ساتھ تیل، سرکہ اور شہد کے کچھ حصے، جسے بعد میں معاویہ نے اپنا جزیہ بنا لیا۔ انہوں نے دروازے کھولے اور روحہ کے دروازے پر مسلمانوں کا بازار رکھا، اور عیاض نے ان پر لکھا: 'خدا کے نام پر - یہ وہی ہے جو عیاض بن غنم نے الرقہ کے لوگوں کو اس دن دیا تھا جس دن وہ اس میں داخل ہوا تھا: ان کی جانوں، مالوں اور گرجا گھروں کی حفاظت، جو تباہ نہ ہوں گے اور نہ ہی ویران رہیں گے، بشرطیکہ وہ ان پر کوئی معاوضہ ادا نہ کریں اور نہ ہی ان کی قیمت ادا کریں۔ کوئی چرچ یا عبادت گاہ نہ بنائیں، کوئی تالی، پاسچل یا کراس نہ دکھائیں۔ خدا گواہ ہے اور گواہ کے طور پر کافی ہے' - اور اس نے اس پر مہر لگا دی۔ بعض کہتے ہیں کہ اس نے ہر بالغ کو چار دینار باندھا تھا، اس کی اچھی خبر یہ ہے کہ بعد میں عمر نے اپنے گورنر عمیر بن سعد کو لکھا کہ ہر آدمی کو سونے کے درجے کی طرح چار دینار کا پابند کیا جائے۔"
  tr: "El-Baladhuri'ye göre: İyad ibn Ghanm Rakka'ya indi ve halkı ona karşı savaştı, bazı Müslümanlar yaralandı. Taş ve oklarından kaçınmak için geri çekildi, sonra atıyla şehri kuşattı, kapılarına muhafızlar yerleştirdi ve köylerden esirler ve bol miktarda erzak getiren baskın birlikleri gönderdi. Mahsuller zaten hasat edilmişti. Beş altı gün sonra, güvenli geçiş için İyad'a bir elçi gönderdi. İyad, tüm halkın, ailelerinin, mallarının ve şehrin güvenliğini garanti eden bir anlaşmayı kabul etti. \"Toprak bizimdir; onu fethettik ve güvence altına aldık\" dedi. Toprak vergisi (haraç) şartıyla toprağı ellerinde tutmalarına izin verdi ve gayrimüslimlerin Müslümanlara ödemeyi reddettiği vergiyi ödediler, gayrimüslimler de bunu ödemeyi reddetti. Onlara yıllık bir dinar ödemelerini gerektiren bir cizye vergisi koydu. Ayrıca kadınları ve çocukları dışladı ve onlara dinarın yanı sıra bir miktar buğday, biraz yağ, sirke ve bal verdi. Muaviye iktidara geldiğinde bunu onlar için bir kafa vergisi haline getirdi. Edessa kapısında Müslümanlar için bir pazar kurdular ve onlara şöyle yazdı: \"Rahman ve Rahim olan Allah'ın adıyla. İyad ibn Ganm'ın... halkına verdiği şey budur.\" Rakka'ya girdiği gün, onlara kendileri, paraları ve kiliseleri için güvence verdi; cizye ödemeleri ve herhangi bir suç işlememeleri şartıyla, kilise veya sinagog inşa etmemeleri, çan, vaftiz veya haç asmamaları şartıyla, yıkılmayacaklarına veya yerleşmeyeceklerine dair güvence verdi. Allah şahittir ve Allah şahit olarak yeterlidir.\" İyad mührünü vurdu. Her yetişkinin dört dinar ödemesini zorunlu kıldığı söylenir ve en güvenilir rivayete göre Ömer, valisi Umeyr ibn Saad'a, tıpkı altın sahiplerine uyguladığı gibi, aralarındaki her erkeğin de dört dinar ödemesini zorunlu kılmasını yazmıştır."
  id: "Menurut al-Baladhuri: Iyad ibn Ghanm turun ke Raqqa, dan penduduknya memeranginya hingga beberapa Muslim terluka. Ia mundur untuk menghindari lemparan batu dan panah mereka, kemudian berkuda dan mengelilingi kota, menempatkan penjaga di gerbangnya dan mengirimkan pasukan penyerang yang membawa kembali tawanan dari desa-desa dan persediaan makanan yang melimpah. Tanaman sudah dipanen. Setelah lima atau enam hari, ia mengirim utusan kepada Iyad untuk meminta jalan aman. Iyad menyetujui perjanjian yang menjamin keselamatan semua penduduk, keluarga mereka, harta benda mereka, dan kota mereka. Ia menyatakan, \"Tanah ini milik kita; kita telah menaklukkan dan mengamankannya.\" Ia mengizinkan mereka untuk mempertahankannya, dengan syarat pajak tanah (kharaj), dan mereka membayar apa yang ditolak oleh kaum non-Muslim kepada kaum Muslim, yang kemudian ditolak oleh kaum Muslim untuk dibayar. Ia mengenakan pajak kepala (jizya) kepada mereka, yang mengharuskan setiap pria membayar satu dinar setiap tahun. Ia juga mengecualikan perempuan dan anak-anak dan mengenakan kepada mereka, bersama dengan dinar, sejumlah gandum, sedikit minyak, cuka, dan madu. Ketika Mu'awiya berkuasa, ia menjadikan ini sebagai pajak kepala bagi mereka. Mereka mendirikan pasar untuk kaum Muslim di gerbang Edessa, dan ia menulis kepada mereka: \"Dengan nama Allah, Yang Maha Pengasih, Yang Maha Penyayang. Inilah yang diberikan Iyad bin Ghanm kepada penduduk...\" Pada hari ia memasuki Raqqa, ia memberi mereka jaminan untuk diri mereka sendiri, uang mereka, dan gereja-gereja mereka, bahwa gereja-gereja itu tidak akan dihancurkan atau dihuni jika mereka membayar jizya yang wajib mereka bayarkan dan tidak melakukan kejahatan apa pun, dan dengan syarat mereka tidak membangun gereja atau sinagoge, atau memajang lonceng, baptisan, atau salib. Allah adalah saksi, dan Allah cukup sebagai saksi.” Iyad membubuhkan capnya. Dikatakan bahwa ia mewajibkan setiap orang dewasa untuk membayar empat dinar, dan catatan yang paling dapat diandalkan adalah bahwa Umar menulis kepada Umayr bin Saad, yang merupakan gubernurnya, untuk mewajibkan setiap orang di antara mereka untuk membayar empat dinar, sebagaimana ia mewajibkan kaum emas."
