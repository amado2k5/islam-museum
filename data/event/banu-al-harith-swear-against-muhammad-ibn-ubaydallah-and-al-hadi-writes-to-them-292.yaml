id: event/banu-al-harith-swear-against-muhammad-ibn-ubaydallah-and-al-hadi-writes-to-them-292
class: event
kind: other
label:
  ar: تحالف بني الحارث على محمد بن عبيد الله في جمادى الأولى 292هـ وبدء كتاب الهادي إليهم، ص275
  en: Banu al-Harith swear against Muhammad ibn Ubaydallah in Jumada I 292 AH and the opening of al-Hadi's letter to them, p. 275
  ur: جمادی الاولیٰ 292ھ میں بنو حارث کا محمد بن عبید اللہ کے خلاف عہد اور ہادی کے خط کا آغاز، ص275
summary:
  ar: في جمادى الأولى سنة 292هـ تتداعى بنو الحارث عند حضور الثمرة وتتحالف على محمد بن عبيد الله، ويجتمعون إلى ابن حميد ويوجهون إلى أبي جعفر يؤذنونه بالحرب، فيكتب إلى الهادي فيكتب إليهم كتاباً تبدأ نسخته في ص275 بالحديث عن نعمة الله وتغيير ما بالأنفس.
  en: In Jumada I 292 AH Banu al-Harith call to one another at the coming of the fruit and swear against Muhammad ibn Ubaydallah, gather to Ibn Humayd and send word of war to Abu Ja'far, who writes to al-Hadi, and al-Hadi writes to them a letter whose copy begins on p. 275 with the favour of God and the changing of what is in men's selves.
  ur: جمادی الاولیٰ 292ھ میں بنو حارث پھل کے آنے پر ایک دوسرے کو پکارتے اور محمد بن عبید اللہ کے خلاف عہد کرتے ہیں، ابن حمید کے پاس جمع ہوتے اور ابو جعفر کو جنگ کی اطلاع بھیجتے ہیں، وہ ہادی کو لکھتے ہیں اور ہادی ان کو خط لکھتے ہیں جس کی نقل ص275 پر نعمتِ الٰہی اور نفوس کے حال بدلنے کے ذکر سے شروع ہوتی ہے۔
