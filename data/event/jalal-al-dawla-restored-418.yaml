summary:
  ar: "في سنة ثمان عشرة وأربعمائة اجتمعت الحاشية ببغداد وضمّروا على الخليفة حتى عزل أبا كاليجار وأُعيدت الخطبة لجلال الدولة أبي طاهر {cite:shadharat-dhahab p. 209}."
  en: "In 418 the Baghdad crowd pressed the caliph until Abu Kalijar was deposed and the khutba was restored to Jalal al-Dawla Abu Tahir {cite:shadharat-dhahab p. 209}."
  es: "En 418, la multitud de Bagdad presionó al califa hasta que Abu Kalijar fue depuesto y la jutba fue restaurada a Jalal al-Dawla Abu Tahir {cite:shadharat-dhahab p. 209}."
  fr: "En 418, la foule de Bagdad pressa le calife jusqu'à ce qu'Abu Kalijar soit déposé et que la khutba soit rendue à Jalal al-Dawla Abu Tahir {cite:shadharat-dhahab p. 209}."
  ur: "418 میں بغداد کے ہجوم نے خلیفہ پر دباؤ ڈالا یہاں تک کہ ابواللیجر کو معزول کر دیا گیا اور خطبہ جلال الدولہ ابو طاہر کو بحال کر دیا گیا۔ 209}۔"
  tr: "Hicri 418 yılında saray mensupları Bağdat'ta toplanarak halifeye karşı komplo kurdular; bunun sonucunda Ebu Kalijar görevden alındı ve vaaz görevi Celaleddin-Devle Ebu Tahir'e iade edildi. {Kaynak: Şadharat-dahab s. 209}"
  id: "Pada tahun 418 H, para pejabat istana berkumpul di Baghdad dan bersekongkol melawan Khalifah hingga Abu Kalijar dipecat dan khutbah dikembalikan kepada Jalal al-Dawla Abu Tahir {cite:shadharat-dhahab p. 209}."
