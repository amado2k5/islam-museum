class: event
kind: other
label: { ar: "تدبير أبي جهل لضرب النبي بحجر وهو ساجد", en: "Abu Jahl's plan to crush the Prophet's head with a stone", fr: "Projet d’Abu Jahl d’écraser la tête du Prophète avec une pierre", es: "El plan de Abu Jahl para aplastar la cabeza del Profeta con una piedra.", ur: "ابو جہل کا نبی کے سر کو پتھر سے کچلنے کا منصوبہ" }
summary:
  ar: "أعلن أبو جهل أنه سيجلس للنبي بحجر ليضرب به رأسه حين يسجد، فلما دنا منه رأى فحلاً من الإبل عرض له فرجع منهزماً؛ وقال النبي إنه جبريل لو دنا لأخذه."
  en: "Abu Jahl announced that he would sit in wait for the Prophet with a stone to crush his head when he prostrated; when he drew near he saw a stallion camel barring his way and fled; the Prophet said it was Gabriel, who would have seized him had he come closer."
  fr: "Abu Jahl annonça qu’il guetterait le Prophète avec une pierre pour lui écraser la tête lors de sa prosternation ; en approchant, il vit un chameau mâle lui barrer le chemin et s’enfuit. Le Prophète dit qu’il s’agissait de Gabriel, qui l’aurait saisi s’il s’était approché davantage."
  es: "Abu Jahl anunció que esperaría al Profeta con una piedra para aplastarle la cabeza cuando se postrara; cuando se acercó, vio un camello semental que le bloqueaba el paso y huyó; el Profeta dijo que era Gabriel, quien lo habría apresado si se hubiera acercado más."
  ur: "ابو جہل نے اعلان کیا کہ جب وہ سجدہ کرے گا تو وہ پتھر لے کر نبی کے سر کو کچل دے گا۔ جب وہ قریب آیا تو اس نے دیکھا کہ ایک اونٹ اس کا راستہ روک رہا ہے اور بھاگ گیا۔ آپ نے فرمایا کہ یہ جبرائیل ہے، اگر وہ قریب آتا تو اسے پکڑ لیتا۔"
