id: event/prophets-speech-to-the-ansar
class: event
kind: declaration
label: { en: "The Prophet's speech to the Ansar at al-Ji'rana", ar: "خطبة النبي للأنصار في الحظيرة بالجعرانة", es: "El discurso del Profeta a los Ansar en al-Ji'rana", fr: "Discours du Prophète aux Ansar à al-Ji'rana", ur: "الجیرانہ میں انصار سے پیغمبر کا خطاب" }
summary:
  en: "After the Ansar felt grieved that newly reconciled Qurashi and Bedouin chieftains received large gifts while they received nothing, the Prophet gathered them in an enclosure at al-Ji'rana and delivered an impassioned, tearful address: 'Are you not pleased that people return with sheep and camels while you return with the Messenger of God to your dwellings?', moving the entire gathering to tears."
  ar: "حين وجد الأنصار في أنفسهم إثر تفضيل قريش وسادات نجد بالعطايا، جمعهم النبي وحدهم في حظيرة بالجعرانة وخطب فيهم خطبته المؤثرة: «ألا ترضون يا معشر الأنصار أن يذهب الناس بالشاة والبعير وترجعون برسول الله إلى رحالكم؟»، فبكى القوم حتى أخضلوا لحاهم وقالوا رضينا برسول الله قسماً وحظاً."
  es: "Después de que los Ansar se sintieran afligidos porque los jefes Qurashi y beduinos recién reconciliados recibieron grandes regalos mientras que ellos no recibieron nada, el Profeta los reunió en un recinto en al-Ji'rana y pronunció un discurso apasionado y entre lágrimas: \"¿No os alegra que la gente regrese con ovejas y camellos mientras vosotros regresáis con el Mensajero de Dios a vuestras moradas?\", conmoviendo a todos los presentes hasta las lágrimas."
  fr: "Après que les Ansar se soient sentis affligés de voir que les chefs qurashis et bédouins nouvellement réconciliés recevaient de généreux présents alors qu'eux-mêmes ne recevaient rien, le Prophète les réunit dans un enclos à al-Ji'rana et leur adressa un discours passionné et émouvant: « N'êtes-vous pas satisfaits que les gens repartent avec des moutons et des chameaux tandis que vous, vous retournez dans vos demeures avec le Messager de Dieu ? », ce qui fit pleurer toute l'assemblée."
  ur: "جب انصار نے یہ غم محسوس کیا کہ نئے صلح شدہ قریشیوں اور بدو سرداروں کو بڑے تحائف ملے جبکہ انہیں کچھ بھی نہیں ملا تو نبی نے انہیں الجیرانہ کے ایک احاطہ میں اکٹھا کیا اور روتے ہوئے خطاب فرمایا: کیا تم اس بات پر راضی نہیں ہو کہ لوگ بھیڑ بکریوں اور اونٹوں کے ساتھ لوٹیں جب کہ تم رسول اللہ کے ساتھ اپنی پوری چائے پیتے ہوئے واپس آؤ؟"
