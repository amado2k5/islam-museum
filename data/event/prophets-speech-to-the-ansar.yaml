label: { en: "The Prophet's speech to the Ansar at al-Ji'rana", ar: "خطبة النبي للأنصار في الحظيرة بالجعرانة" }
summary:
  en: "After the Ansar felt grieved that newly reconciled Qurashi and Bedouin chieftains received large gifts while they received nothing, the Prophet gathered them in an enclosure at al-Ji'rana and delivered an impassioned, tearful address: 'Are you not pleased that people return with sheep and camels while you return with the Messenger of God to your dwellings?', moving the entire gathering to tears."
  ar: "حين وجد الأنصار في أنفسهم إثر تفضيل قريش وسادات نجد بالعطايا، جمعهم النبي وحدهم في حظيرة بالجعرانة وخطب فيهم خطبته المؤثرة: «ألا ترضون يا معشر الأنصار أن يذهب الناس بالشاة والبعير وترجعون برسول الله إلى رحالكم؟»، فبكى القوم حتى أخضلوا لحاهم وقالوا رضينا برسول الله قسماً وحظاً."
