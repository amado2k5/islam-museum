label: { ar: "غلبة المهدي العبيدي على المغرب وخروجه من أمر بني العباس", en: "The Ubaydid al-Mahdi's triumph in the Maghreb and its departure from Abbasid rule", es: "El triunfo de Ubaydid al-Mahdi en el Magreb y su ruptura con el dominio abasí.", fr: "Le triomphe d'Ubayd al-Mahdi au Maghreb et sa rupture avec le pouvoir abbasside" }
summary:
  ar: "في أيام المقتدر غلب أمر المهدي بالمغرب وسلم عليه بالإمامة ودعي له بالخلافة وبسط في الناس العدل والإحسان فانحرفوا إليه ومهدت له المغرب وعظم ملكه وبنى المهدية وهرب أمير إفريقية زيادة الله بن الأغلب إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ فكانت مدة ملكهم جميع الممالك الإسلامية مئة وبضعاً وستين سنة ومن هنا دخل النقص عليهم، وسار المهدي يريد مصر في أربعين ألفاً من البربر فحال النيل بينه وبينها فرجع إلى الإسكندرية فأفسد فيها وقتل ثم ملكها والفيوم، وعاد القائم محمد بن المهدي فأخذ أكثر الصعيد وملكت جيوشه الجزيرة من الفسطاط {cite:tarikh-khulafa-minhaj-1434 p. 587-590}. وعند المسعودي أخرج أبو عبد الله المحتسب الداعية في كتامة والبربر زيادة الله بن عبد الله من إفريقية سنة ست وتسعين ومائتين ودعا إلى عبيد الله صاحب المغرب، ولم يزل آل الأغلب أمراء إفريقية منذ قلد الرشيد إبراهيم بن الأغلب أمرها بالرقة سنة أربع وثمانين ومائة {cite:muruj-al-dhahab p. 647-648}"
  en: "Under al-Muqtadir the Mahdi's cause prevailed in the Maghreb: he was saluted as imam and caliph, built al-Mahdiyya, and the Aghlabid amir Ziyadat Allah fled to Egypt then Iraq — 'from this date the Maghreb left the Abbasids' command', after a hundred and sixty-odd years of their rule over all the Islamic realms. The Mahdi marched on Egypt with forty thousand Berbers; the Nile barred him, so he took Alexandria and the Fayyum, while his son al-Qa'im later seized most of Upper Egypt and the Fustat quarter {cite:tarikh-khulafa-minhaj-1434 p. 587-590}."
  es: "Bajo el mandato de al-Muqtadir, la causa del Mahdi prevaleció en el Magreb: fue aclamado como imán y califa, construyó al-Mahdiyya, y el emir aglabí Ziyadat Allah huyó a Egipto y luego a Irak; «a partir de esta fecha, el Magreb se separó del dominio de los abasíes», tras ciento sesenta y tantos años de su gobierno sobre todos los reinos islámicos. El Mahdi marchó sobre Egipto con cuarenta mil bereberes; el Nilo le impidió el paso, por lo que tomó Alejandría y el Fayum, mientras que su hijo al-Qa'im se apoderó posteriormente de la mayor parte del Alto Egipto y el barrio de Fustat {cite:tarikh-khulafa-minhaj-1434 p. 587-590}."
  fr: "Sous al-Muqtadir, la cause du Mahdi triompha au Maghreb: il fut salué comme imam et calife, fit construire al-Mahdiyya, et l’émir aghlabide Ziyadat Allah s’enfuit en Égypte puis en Irak. « À partir de cette date, le Maghreb échappa à l’autorité des Abbassides », après plus de cent soixante ans de domination sur l’ensemble des territoires islamiques. Le Mahdi marcha sur l’Égypte avec quarante mille Berbères; le Nil lui barra la route, il s’empara donc d’Alexandrie et du Fayoum, tandis que son fils al-Qa’im conquit plus tard la majeure partie de la Haute-Égypte et la région de Fustat (voir: Tarikh-Khulafa-Minhaj-1434, p. 587-590)."
