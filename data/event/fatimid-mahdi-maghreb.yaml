label: { ar: "غلبة المهدي العبيدي على المغرب وخروجه من أمر بني العباس" }
summary:
  ar: "في أيام المقتدر غلب أمر المهدي بالمغرب وسلم عليه بالإمامة ودعي له بالخلافة وبسط في الناس العدل والإحسان فانحرفوا إليه ومهدت له المغرب وعظم ملكه وبنى المهدية وهرب أمير إفريقية زيادة الله بن الأغلب إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ فكانت مدة ملكهم جميع الممالك الإسلامية مئة وبضعاً وستين سنة ومن هنا دخل النقص عليهم، وسار المهدي يريد مصر في أربعين ألفاً من البربر فحال النيل بينه وبينها فرجع إلى الإسكندرية فأفسد فيها وقتل ثم ملكها والفيوم، وعاد القائم محمد بن المهدي فأخذ أكثر الصعيد وملكت جيوشه الجزيرة من الفسطاط {cite:tarikh-khulafa-minhaj-1434 p. 587-590}.، وعند المسعودي أخرج أبو عبد الله المحتسب الداعية في كتامة والبربر زيادة الله بن عبد الله من إفريقية سنة ست وتسعين ومائتين ودعا إلى عبيد الله صاحب المغرب، ولم يزل آل الأغلب أمراء إفريقية منذ قلد الرشيد إبراهيم بن الأغلب أمرها بالرقة سنة أربع وثمانين ومائة {cite:muruj-al-dhahab p. 647-648}"
  en: "Under al-Muqtadir the Mahdi's cause prevailed in the Maghreb: he was saluted as imam and caliph, built al-Mahdiyya, and the Aghlabid amir Ziyadat Allah fled to Egypt then Iraq — 'from this date the Maghreb left the Abbasids' command', after a hundred and sixty-odd years of their rule over all the Islamic realms. The Mahdi marched on Egypt with forty thousand Berbers; the Nile barred him, so he took Alexandria and the Fayyum, while his son al-Qa'im later seized most of Upper Egypt and the Fustat quarter {cite:tarikh-khulafa-minhaj-1434 p. 587-590}."
