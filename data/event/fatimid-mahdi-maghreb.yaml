label: { ar: "غلبة المهدي العبيدي على المغرب وخروجه من أمر بني العباس", en: "The Ubaydid al-Mahdi's triumph in the Maghreb and its departure from Abbasid rule", es: "El triunfo de Ubaydid al-Mahdi en el Magreb y su ruptura con el dominio abasí.", fr: "Le triomphe d'Ubayd al-Mahdi au Maghreb et sa rupture avec le pouvoir abbasside", ur: "مغرب میں عبید المہدی کی فتح اور عباسی حکومت سے علیحدگی", tr: "Fatımi Halifesi el-Mehdi'nin Fas'a karşı kazandığı zafer ve Abbasi Halifeliğinden ayrılması", id: "Kemenangan Khalifah Fatimiyah al-Mahdi atas Maroko dan kepergiannya dari Kekhalifahan Abbasiyah" }
summary:
  ar: "في أيام المقتدر غلب أمر المهدي بالمغرب وسلم عليه بالإمامة ودعي له بالخلافة وبسط في الناس العدل والإحسان فانحرفوا إليه ومهدت له المغرب وعظم ملكه وبنى المهدية وهرب أمير إفريقية زيادة الله بن الأغلب إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ فكانت مدة ملكهم جميع الممالك الإسلامية مئة وبضعاً وستين سنة ومن هنا دخل النقص عليهم، وسار المهدي يريد مصر في أربعين ألفاً من البربر فحال النيل بينه وبينها فرجع إلى الإسكندرية فأفسد فيها وقتل ثم ملكها والفيوم، وعاد القائم محمد بن المهدي فأخذ أكثر الصعيد وملكت جيوشه الجزيرة من الفسطاط {cite:tarikh-khulafa-minhaj-1434 p. 587-590}. وعند المسعودي أخرج أبو عبد الله المحتسب الداعية في كتامة والبربر زيادة الله بن عبد الله من إفريقية سنة ست وتسعين ومائتين ودعا إلى عبيد الله صاحب المغرب، ولم يزل آل الأغلب أمراء إفريقية منذ قلد الرشيد إبراهيم بن الأغلب أمرها بالرقة سنة أربع وثمانين ومائة {cite:muruj-al-dhahab p. 647-648}"
  en: "Under al-Muqtadir the Mahdi's cause prevailed in the Maghreb: he was saluted as imam and caliph, built al-Mahdiyya, and the Aghlabid amir Ziyadat Allah fled to Egypt then Iraq — 'from this date the Maghreb left the Abbasids' command', after a hundred and sixty-odd years of their rule over all the Islamic realms. The Mahdi marched on Egypt with forty thousand Berbers; the Nile barred him, so he took Alexandria and the Fayyum, while his son al-Qa'im later seized most of Upper Egypt and the Fustat quarter {cite:tarikh-khulafa-minhaj-1434 p. 587-590}."
  es: "Bajo el mandato de al-Muqtadir, la causa del Mahdi prevaleció en el Magreb: fue aclamado como imán y califa, construyó al-Mahdiyya, y el emir aglabí Ziyadat Allah huyó a Egipto y luego a Irak; «a partir de esta fecha, el Magreb se separó del dominio de los abasíes», tras ciento sesenta y tantos años de su gobierno sobre todos los reinos islámicos. El Mahdi marchó sobre Egipto con cuarenta mil bereberes; el Nilo le impidió el paso, por lo que tomó Alejandría y el Fayum, mientras que su hijo al-Qa'im se apoderó posteriormente de la mayor parte del Alto Egipto y el barrio de Fustat {cite:tarikh-khulafa-minhaj-1434 p. 587-590}."
  fr: "Sous al-Muqtadir, la cause du Mahdi triompha au Maghreb: il fut salué comme imam et calife, fit construire al-Mahdiyya, et l’émir aghlabide Ziyadat Allah s’enfuit en Égypte puis en Irak. « À partir de cette date, le Maghreb échappa à l’autorité des Abbassides », après plus de cent soixante ans de domination sur l’ensemble des territoires islamiques. Le Mahdi marcha sur l’Égypte avec quarante mille Berbères; le Nil lui barra la route, il s’empara donc d’Alexandrie et du Fayoum, tandis que son fils al-Qa’im conquit plus tard la majeure partie de la Haute-Égypte et la région de Fustat (voir: Tarikh-Khulafa-Minhaj-1434, p. 587-590)."
  ur: "المقتدیر کے تحت مغرب میں مہدی کا نصب العین غالب ہوا: انہیں امام اور خلیفہ کی حیثیت سے سلام کیا گیا، المہدیہ کی تعمیر کی گئی، اور اغلب امیر زیادت اللہ مصر پھر عراق فرار ہو گئے - 'اس تاریخ سے مغرب نے عباسیوں کی کمان چھوڑ دی'، ایک سو ساٹھ سال کی تمام حقیقی اسلامی حکمرانی کے بعد۔ مہدی نے چالیس ہزار بربروں کے ساتھ مصر پر کوچ کیا۔ دریائے نیل نے اسے روک دیا، اس لیے اس نے اسکندریہ اور فیوم کو لے لیا، جب کہ اس کے بیٹے القائم نے بعد میں بالائی مصر اور فوستات کے کوارٹر پر قبضہ کر لیا۔ 587-590}۔"
  tr: "Muktadir döneminde, Mecdî'nin otoritesi Mağrip'te hüküm sürdü ve kendisine İmam unvanı verildi ve halifelik çağrısında bulunuldu. Halk arasında adalet ve iyilik yaydı, bu yüzden insanlar ona yöneldiler. Mağrip onun için hazırlandı ve krallığı büyüdü. Mehdi'yi kurdu ve İfrikiye Emiri Ziyadet Allah ibn el-Ağlab Mısır'a kaçtı. Sonra Irak'a geldi ve Mağrip bu tarihten itibaren Abbasilerin yönetiminden kurtuldu. Abbasilerin tüm İslam krallıkları üzerindeki yönetim süreleri yüz altmış yılı aşkındı ve buradan itibaren gerilemeleri başladı. Mecdî kırk bin Berberi ile Mısır'a doğru yürüdü, ancak Nil nehri onunla Mısır arasında engel teşkil etti, bu yüzden İskenderiye'ye döndü, orada yıkım ve katliamlar yaptı, sonra İskenderiye ve Faymun'un kontrolünü ele geçirdi. El-Kaim Muhammed ibn el-Mehdi geri döndü ve Yukarı Mısır'ın büyük bir kısmını ele geçirdi; orduları da Fustat'tan adanın kontrolünü aldı. {kaynak:tarikh-khulafa-minhaj-1434 s. 587-590}. El-Mas'udi'ye göre ise, Kutama ve Berberilerde vaaz veren Ebu Abdullah el-Muhtasib, 296 yılında Ziyadet Allah bin Abdullah'ı İfrikiye'den kovdu ve Mağrip hükümdarı Ubeyd Allah'ı çağırdı. Ağlabiler, 184 yılında El-Raşid'in İbrahim bin el-Ağlab'ı Rakka'daki işlerine emanet etmesinden beri İfrikiye'nin yöneticileri olarak kaldılar. {kaynak:muruj-al-dhahab s. 647-648}"
  id: "Pada masa Al-Muqtadir, kekuasaan Al-Mahdi berkuasa di Maghreb, dan ia disambut dengan gelar Imam serta diserukan untuk menjadi Khalifah. Ia menyebarkan keadilan dan kebajikan di antara rakyat, sehingga mereka berpaling kepadanya. Maghreb dipersiapkan untuknya, dan kerajaannya berkembang. Ia membangun Mahdia, dan Emir Ifriqiya, Ziyadat Allah ibn al-Aghlab, melarikan diri ke Mesir. Kemudian ia datang ke Irak, dan Maghreb melepaskan diri dari kekuasaan Abbasiyah sejak saat itu. Masa pemerintahan mereka atas seluruh kerajaan Islam berlangsung selama seratus enam puluh tahun lebih, dan dari sinilah kemunduran mereka dimulai. Al-Mahdi bergerak menuju Mesir dengan empat puluh ribu orang Berber, tetapi Sungai Nil menjadi penghalang antara dirinya dan Mesir, sehingga ia kembali ke Alexandria, di mana ia menimbulkan kekacauan dan pembunuhan, kemudian ia menguasai Alexandria dan Fayoum. Al-Qaim Muhammad ibn al-Mahdi kembali dan merebut sebagian besar Mesir Hulu, dan pasukannya menguasai pulau itu dari Fustat. {cite:tarikh-khulafa-minhaj-1434 hlm. 587-590}. Dan menurut Al-Mas’udi, Abu Abdullah Al-Muhtasib, pendakwah di Kutama dan Berber, mengusir Ziyadat Allah bin Abdullah dari Ifriqiya pada tahun 296 dan menyerukan Ubayd Allah, penguasa Maghreb. Dan Dinasti Aghlabid tetap menjadi penguasa Ifriqiya sejak Al-Rashid mempercayakan urusannya di Raqqa kepada Ibrahim bin Al-Aghlab pada tahun 184. {cite:muruj-al-dhahab hlm. 647-648}"
