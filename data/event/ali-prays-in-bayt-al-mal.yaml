id: event/ali-prays-in-bayt-al-mal
class: event
kind: other
label: { ar: "علي يفرّغ بيت المال ويصلي فيه", en: "Ali empties the treasury and prays in it" }
summary:
  ar: "جاء ابن النبّاح إلى علي فأخبره أن بيت مال المسلمين امتلأ بالذهب والفضة، فقام علي إليه متوكئاً على ابن النبّاح، وأنشد بيتاً في الذهب، ثم نادى أشياع الكوفة فأعطاهم جميع ما في بيت المال حتى لم يبق منه دينار ولا درهم، ثم أمر بنضحه وصلى فيه ركعتين {cite:sallabi-ali-vol1 p. 206}. وفي رواية أبي نعيم أنه كان يكنس بيت المال ويصلي فيه رجاء أن يشهد له يوم القيامة {cite:sallabi-ali-vol1 p. 206}."
  en: "Ali was told the treasury of the Muslims was full of gold and silver; he went, leaning on the informant, gave all of it away to the people of Kufa until nothing remained, had the place sprinkled, and prayed two rak'as in it. The book reads the act as detachment from worldly goods."
