id: event/al-hadi-counsels-the-writer-to-repent-and-hold-to-the-sons-of-al-qasim-292
class: event
kind: other
label:
  ar: "تتمة جواب الهادي: يحث المكتوب إليه على التوبة ولزوم آل محمد وبني القاسم ويمدحهم، ص313-314"
  en: "The rest of al-Hadi's answer, urging the addressee to repent and cling to the family of Muhammad and the sons of al-Qasim, whom he praises, pp. 313-314"
  ur: "ہادی کے جواب کا باقی حصہ: مخاطب کو توبہ اور آل محمد اور بنو قاسم سے وابستگی پر ابھارنا اور ان کی مدح، ص313-314"
summary:
  ar: "تتمة قصيدة الطويل: يقول الهادي إنه حمّل المخاطَب الهم والعنا، ويحثه على أن يكون أول قائم في صميم الحق، وعلى التوبة والاستغفار ومعاداة معادي آل محمد وموالاة وليّهم، ثم يمدح بني القاسم ويقول إنهم أحيوا الإسلام وأظهروا الحدود، وينتهي بتحذير من الرأي الضعيف."
  en: "The rest of the tawil poem: al-Hadi says he has laid worry and hardship on the addressee, urges him to be first to rise in the heart of the truth, to repent and seek forgiveness, to oppose those who oppose the family of Muhammad and befriend their friends, then praises the sons of al-Qasim as having revived Islam and brought out God's limits, and ends warning him against weak opinion."
  ur: "طویل نظم کا باقی حصہ: ہادی کہتا ہے کہ اس نے مخاطب پر فکر اور مشقت ڈالی، اسے حق کے بیچ سب سے پہلے اٹھنے، توبہ اور استغفار، آل محمد کے مخالفین سے دشمنی اور ان کے دوستوں سے دوستی پر ابھارتا ہے، پھر بنو قاسم کی مدح کرتا ہے کہ انہوں نے اسلام کو زندہ کیا اور حدود کو ظاہر کیا، اور کمزور رائے سے خبردار کر کے ختم کرتا ہے۔"
