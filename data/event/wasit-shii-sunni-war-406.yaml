id: event/wasit-shii-sunni-war-406
class: event
kind: civil-war
label: { ar: "فتنة الشيعة والسنة بواسط", en: "The Shi'i–Sunni war at Wasit (406–407 AH)", es: "La guerra entre chiíes y suníes en Wasit (406-407 AH)", fr: "La guerre chiite-sunnite à Wasit (406-407 AH)", ur: "وسط میں شیعہ سنی جنگ ⁦(406-407ھ)⁩", tr: "Wasit'teki Şii-Sünni çatışması", id: "Konflik Syiah-Sunni di Wasit" }
summary:
  ar: "اتصلت الفتنة بين الشيعة والسنة بواسط فنهبت محال الشيعة والزيدية بواسط واحترقت وهرب وجوه الشيعة والعلويين فقصدوا على بني مزيد واستنصروه {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  en: "406–407: Wasit's confessional war burned out the Shi'i and Zaydi quarters and drove their notables and Alawids into exile — they fled to Banu Mazyad begging his aid, an early sign of the Mazyadids' rise as patrons of the Alawids {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  es: "406–407: La guerra confesional de Wasit arrasó los barrios chiíes y zaidíes y obligó a sus notables y a los alauitas al exilio; huyeron a Banu Mazyad implorando su ayuda, una señal temprana del ascenso de los mazyadíes como protectores de los alauitas {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  fr: "406–407: La guerre confessionnelle de Wasit a ravagé les quartiers chiites et zaydites et a poussé leurs notables et les Alaouites en exil — ils se sont réfugiés chez les Banu Mazyad en implorant son aide, un signe précoce de la montée en puissance des Mazyadides en tant que protecteurs des Alaouites {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  ur: "406-407: وصیت کی اعترافی جنگ نے شیعہ اور زیدی حلقوں کو جلا دیا اور ان کے معززین اور علویوں کو جلاوطن کر دیا - وہ اس سے مدد مانگتے ہوئے بنو مازیاد کی طرف بھاگے، یہ علویوں کے سرپرستوں کے طور پر مازیادیوں کے عروج کی ابتدائی علامت ہے۔"
  tr: "Şiiler ve Sünniler arasındaki çekişme Wasit'e kadar ulaştı; Wasit'teki Şii ve Zeydi dükkanları yağmalanıp yakıldı ve Şii ve Alevi liderler kaçarak Beni Mazid'e gidip ondan yardım istediler. {cite:muntazam-ibn-al-jawzi j.7 p.283}"
  id: "Perselisihan antara Syiah dan Sunni mencapai Wasit, sehingga toko-toko Syiah dan Zaidi di Wasit dijarah dan dibakar, dan para pemimpin Syiah dan Alawiyah melarikan diri dan pergi ke Bani Mazid dan meminta bantuannya {cite:muntazam-ibn-al-jawzi j.7 p.283}."
