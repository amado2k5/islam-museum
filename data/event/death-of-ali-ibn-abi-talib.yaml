label: { ar: "مقتل علي بن أبي طالب" }
summary:
  ar: "في سنة أربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.141}، دبّر عبد الرحمن بن ملجم ومعه البرك بن عبد الله وعمرو بن بكر خطة لاغتيال علي ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وفهرس الجزء يذكر «مقتل علي بن أبي طالب» وما بعده في الصفحات 141 إلى 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. وعند السيوطي أن الثلاثة اجتمعوا بمكة وتعاهدوا على قتل علي ومعاوية وعمرو بن العاص ليلة سبع عشرة من رمضان فتوجه كل منهم إلى مصر صاحبه، وقدم ابن ملجم الكوفة فضرب عليًا بالسيف على جبهته إلى قرنه ووصل إلى دماغه حين خرج ينادي الصلاة الصلاة، فأقام علي الجمعة والسبت وتوفي ليلة الأحد سنة أربعين وكان له ثلاث وستون سنة في المشهور، وغسله الحسن والحسين وعبد الله بن جعفر وصلى عليه الحسن ودفن بدار الإمارة بالكوفة ليلاً وعُمّي قبره لئلا تنبشه الخوارج، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار {cite:tarikh-khulafa-minhaj-1434 p. 295-297}."
