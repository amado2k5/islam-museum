label: { ar: "مقتل علي بن أبي طالب", en: "Killing of Ali ibn Abi Talib" }
summary:
  ar: "في سنة أربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.141}، دبّر عبد الرحمن بن ملجم ومعه البرك بن عبد الله وعمرو بن بكر خطة لاغتيال علي ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وفهرس الجزء يذكر «مقتل علي بن أبي طالب» وما بعده في الصفحات 141 إلى 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. وعند السيوطي أن الثلاثة اجتمعوا بمكة وتعاهدوا على قتل علي ومعاوية وعمرو بن العاص ليلة سبع عشرة من رمضان فتوجه كل منهم إلى مصر صاحبه، وقدم ابن ملجم الكوفة فضرب عليًا بالسيف على جبهته إلى قرنه ووصل إلى دماغه حين خرج ينادي الصلاة الصلاة، فأقام علي الجمعة والسبت وتوفي ليلة الأحد سنة أربعين وكان له ثلاث وستون سنة في المشهور، وغسله الحسن والحسين وعبد الله بن جعفر وصلى عليه الحسن ودفن بدار الإمارة بالكوفة ليلاً وعُمّي قبره لئلا تنبشه الخوارج، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار {cite:tarikh-khulafa-minhaj-1434 p. 295-297}. وعند المسعودي ضربه ابن ملجم على قرنه وهو يوقظ الناس للصلاة وشبيب ومجاشع معه فأصاب شبيب عتبة الباب وهرب مجاشع، ومر ابن ملجم قبلها بالأشعث فقال فضحك الصبح فسمعها حجر بن عدي فقال قتلته يا أعور قتلك الله، ولم ينم علي تلك الليلة وصاح بط للصبيان فقال دعهن فإنهن نوائح، وأوصى الحسن والحسين ومحمد بن الحنفية، وقال إنها الليلة التي ضرب فيها يوشع بن نون، وقبض ليلة الأحد لإحدى وعشرين من رمضان ودفن بالرحبة عند مسجد الكوفة وصلى عليه الحسن مكبراً سبعاً، ولم يترك إلا سبعمائة درهم بقيت من عطائه وقيل مائتين وخمسين ومصحفه وسيفه {cite:muruj-al-dhahab p. 702-704}"
  en: "In 40 Tabari records that Abd al-Rahman ibn Muljam, with al-Barak ibn Abdullah and Amr ibn Bakr, planned to assassinate Ali and Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. The index of that volume lists the killing of Ali ibn Abi Talib and what follows on pages 141 to 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. In al-Suyuti the three met in Mecca and pledged to kill Ali, Mu'awiya and Amr ibn al-As on the night of 17 Ramadan, each heading to the region of another. Ibn Muljam came to Kufa and struck Ali with a sword on the forehead down to the horn, reaching the brain, as Ali came out calling to prayer. Ali kept Friday and Saturday and died on the night of Sunday in the year 40, aged sixty-three in the familiar account. Al-Hasan, al-Husayn and Abdullah ibn Ja'far washed him and al-Hasan led the prayer; he was buried by night in the Dar al-Imara at Kufa and his grave was concealed so the Kharijites would not dig it up. Ibn Muljam's limbs were cut off, placed in a basket and burned {cite:tarikh-khulafa-minhaj-1434 p. 295-297}. In al-Mas'udi, Ibn Muljam struck him on the horn while he was waking people for prayer, with Shabib and Mujashi' alongside; Shabib hit the threshold and Mujashi' fled. Just before, Ibn Muljam had passed al-Ash'ath and spoken a line; Hujr ibn Adi heard it and said, 'You have killed him, one-eyed man, may God kill you.' Ali did not sleep that night; he called out, 'Leave them, for they are wailers', and charged al-Hasan, al-Husayn and Muhammad ibn al-Hanafiyya, saying this was the night in which Yusha ibn Nun had been struck. He died on the night of Sunday, 21 Ramadan, and was buried at al-Rahba beside the mosque of Kufa; al-Hasan prayed over him with seven takbirs. He left only seven hundred dirhams of his stipend, or it is said two hundred and fifty, together with his mushaf and his sword {cite:muruj-al-dhahab p. 702-704}."
