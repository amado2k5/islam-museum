id: event/death-of-ali-ibn-abi-talib
class: event
kind: death
label: { ar: "مقتل علي بن أبي طالب", en: "Killing of Ali ibn Abi Talib", es: "Asesinato de Ali ibn Abi Talib", fr: "L'assassinat d'Ali ibn Abi Talib", ur: "علی ابن ابی طالب کا قتل", tr: "Ali ibn Abi Talib'in öldürülmesi", id: "Pembunuhan Ali bin Abi Talib" }
summary:
  ar: "في سنة أربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.141}، دبّر عبد الرحمن بن ملجم ومعه البرك بن عبد الله وعمرو بن بكر خطة لاغتيال علي ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وفهرس الجزء يذكر «مقتل علي بن أبي طالب» وما بعده في الصفحات 141 إلى 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. وعند السيوطي أن الثلاثة اجتمعوا بمكة وتعاهدوا على قتل علي ومعاوية وعمرو بن العاص ليلة سبع عشرة من رمضان فتوجه كل منهم إلى مصر صاحبه، وقدم ابن ملجم الكوفة فضرب عليًا بالسيف على جبهته إلى قرنه ووصل إلى دماغه حين خرج ينادي الصلاة الصلاة، فأقام علي الجمعة والسبت وتوفي ليلة الأحد سنة أربعين وكان له ثلاث وستون سنة في المشهور، وغسله الحسن والحسين وعبد الله بن جعفر وصلى عليه الحسن ودفن بدار الإمارة بالكوفة ليلاً وعُمّي قبره لئلا تنبشه الخوارج، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار {cite:tarikh-khulafa-minhaj-1434 p. 295-297}. وعند المسعودي ضربه ابن ملجم على قرنه وهو يوقظ الناس للصلاة وشبيب ومجاشع معه فأصاب شبيب عتبة الباب وهرب مجاشع، ومر ابن ملجم قبلها بالأشعث فقال فضحك الصبح فسمعها حجر بن عدي فقال قتلته يا أعور قتلك الله، ولم ينم علي تلك الليلة وصاح بط للصبيان فقال دعهن فإنهن نوائح، وأوصى الحسن والحسين ومحمد بن الحنفية، وقال إنها الليلة التي ضرب فيها يوشع بن نون، وقبض ليلة الأحد لإحدى وعشرين من رمضان ودفن بالرحبة عند مسجد الكوفة وصلى عليه الحسن مكبراً سبعاً، ولم يترك إلا سبعمائة درهم بقيت من عطائه وقيل مائتين وخمسين ومصحفه وسيفه {cite:muruj-al-dhahab p. 702-704}"
  en: "In 40 Tabari records that Abd al-Rahman ibn Muljam, with al-Barak ibn Abdullah and Amr ibn Bakr, planned to assassinate Ali and Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. The index of that volume lists the killing of Ali ibn Abi Talib and what follows on pages 141 to 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. In al-Suyuti the three met in Mecca and pledged to kill Ali, Mu'awiya and Amr ibn al-As on the night of 17 Ramadan, each heading to the region of another. Ibn Muljam came to Kufa and struck Ali with a sword on the forehead down to the horn, reaching the brain, as Ali came out calling to prayer. Ali kept Friday and Saturday and died on the night of Sunday in the year 40, aged sixty-three in the familiar account. Al-Hasan, al-Husayn and Abdullah ibn Ja'far washed him and al-Hasan led the prayer; he was buried by night in the Dar al-Imara at Kufa and his grave was concealed so the Kharijites would not dig it up. Ibn Muljam's limbs were cut off, placed in a basket and burned {cite:tarikh-khulafa-minhaj-1434 p. 295-297}. In al-Mas'udi, Ibn Muljam struck him on the horn while he was waking people for prayer, with Shabib and Mujashi' alongside; Shabib hit the threshold and Mujashi' fled. Just before, Ibn Muljam had passed al-Ash'ath and spoken a line; Hujr ibn Adi heard it and said, 'You have killed him, one-eyed man, may God kill you.' Ali did not sleep that night; he called out, 'Leave them, for they are wailers', and charged al-Hasan, al-Husayn and Muhammad ibn al-Hanafiyya, saying this was the night in which Yusha ibn Nun had been struck. He died on the night of Sunday, 21 Ramadan, and was buried at al-Rahba beside the mosque of Kufa; al-Hasan prayed over him with seven takbirs. He left only seven hundred dirhams of his stipend, or it is said two hundred and fifty, together with his mushaf and his sword {cite:muruj-al-dhahab p. 702-704}."
  es: "En 40 Tabari registra que Abd al-Rahman ibn Muljam, con al-Barak ibn Abdullah y Amr ibn Bakr, planearon asesinar a Ali y Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.141} {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. El índice de ese volumen enumera el asesinato de Ali ibn Abi Talib y lo que sigue en las páginas 141 a 152 {cite:tabari-tarikh-abu-al-fadl j.5 p.628}. En al-Suyuti los tres se reunieron en La Meca y juraron matar a Ali, Mu'awiya y Amr ibn al-As la noche del 17 de Ramadán, dirigiéndose cada uno a la región de otro. Ibn Muljam llegó a Kufa y golpeó a Ali con una espada en la frente, hasta el cuerno, alcanzando el cerebro, cuando Ali salió llamando a la oración. Ali observó el viernes y el sábado y murió la noche del domingo del año 40, a la edad de sesenta y tres años según el relato conocido. Al-Hasan, al-Husayn y Abdullah ibn Ja'far lo lavaron y al-Hasan dirigió la oración; fue enterrado de noche en el Dar al-Imara en Kufa y su tumba fue ocultada para que los jariyitas no la desenterraran. Las extremidades de Ibn Muljam fueron cortadas, colocadas en una cesta y quemadas {cite:tarikh-khulafa-minhaj-1434 p. 295-297}. En al-Mas'udi, Ibn Muljam lo golpeó en el cuerno mientras despertaba a la gente para la oración, con Shabib y Mujashi' a su lado; Shabib golpeó el umbral y Mujashi' huyó. Justo antes, Ibn Muljam había pasado por al-Ash'ath y había dicho una frase; Hujr ibn Adi la oyó y dijo: «Lo has matado, tuerto, que Dios te mate». Ali no durmió esa noche; gritó: «Dejadlos, pues son unos llorones», y acusó a al-Hasan, al-Husayn y Muhammad ibn al-Hanafiyya, diciendo que esa era la noche en que Yusha ibn Nun había sido herido. Murió la noche del domingo 21 de Ramadán y fue enterrado en al-Rahba, junto a la mezquita de Kufa; al-Hasan rezó por él con siete takbirs. Dejó solo setecientos dirhams de su estipendio, o se dice que doscientos cincuenta, junto con su mushaf y su espada {cite:muruj-al-dhahab p. 702-704}."
  fr: "Dans le volume 40 du Tabari, il est rapporté qu'Abd al-Rahman ibn Muljam, avec al-Barak ibn Abdullah et Amr ibn Bakr, a comploté pour assassiner Ali et Mu'awiya (voir Tabari-tarikh-abu-al-fadl, volume 5, p. 141, 143 et 144). L'index de ce volume mentionne le meurtre d'Ali ibn Abi Talib et les événements qui ont suivi aux pages 141 à 152 (voir Tabari-tarikh-abu-al-fadl, volume 5, p. 628). Dans al-Suyuti, les trois hommes se sont rencontrés à La Mecque et ont juré de tuer Ali, Mu'awiya et Amr ibn al-As dans la nuit du 17 Ramadan, chacun se dirigeant vers la région de l'autre. Ibn Muljam se rendit à Koufa et frappa Ali d'un coup d'épée au front, jusqu'à la corne, atteignant le cerveau, alors qu'Ali sortait pour appeler à la prière. Ali observa les prières du vendredi et du samedi et mourut dans la nuit du dimanche de l'an 40, à l'âge de soixante-trois ans, selon la tradition orale. Al-Hasan, al-Husayn et Abdullah ibn Ja'far le lavèrent et al-Hasan dirigea la prière; il fut enterré de nuit au Dar al-Imara à Koufa et sa tombe fut dissimulée afin que les Kharijites ne la profanent pas. Les membres d'Ibn Muljam furent coupés, placés dans un panier et brûlés (voir: Tarikh-Khulafa-Minhaj-1434, p. 295-297). À al-Mas'udi, Ibn Muljam le frappa à la corne alors qu'il réveillait les fidèles pour la prière, en présence de Shabib et Mujashi'; Shabib heurta le seuil et Mujashi' prit la fuite. Peu avant, Ibn Muljam avait dépassé al-Ash'ath et prononcé une phrase. Hujr ibn Adi l'entendit et dit: « Tu l'as tué, borgne ! Que Dieu te punisse ! » Ali ne dormit pas cette nuit-là. Il cria: « Laissez-les, car ce sont des pleureurs ! » et chargea al-Hasan, al-Husayn et Muhammad ibn al-Hanafiyya, affirmant que c'était la nuit où Yusha ibn Nun avait été frappé. Il mourut dans la nuit du dimanche 21 Ramadan et fut enterré à al-Rahba, près de la mosquée de Kufa. Al-Hasan récita sept takbirs pour le protéger. Il ne laissa que sept cents dirhams de sa subsistance, ou, selon certaines sources, deux cent cinquante, ainsi que son mushaf et son épée (voir Muruj-al-Dhahab, p. 702-704)."
  ur: "40 طبری میں درج ہے کہ عبدالرحمٰن ابن ملجم نے البرک ابن عبداللہ اور عمرو بن بکر کے ساتھ مل کر علی اور معاویہ کو قتل کرنے کا منصوبہ بنایا تھا۔ {حوالہ: طبری-تاریخ-ابو الفضل ج5 ص144}۔ اس جلد کے اشاریہ میں علی ابن ابی طالب کے قتل اور اس کے بعد صفحہ 141 تا 152 پر درج ہے {حوالہ: طبری تاریخ ابو الفضل ج.5 ص628}۔ السیوطی میں تینوں نے مکہ میں ملاقات کی اور 17 رمضان کی رات علی، معاویہ اور عمرو بن العاص کو قتل کرنے کا عہد کیا، ہر ایک دوسرے کے علاقے کی طرف روانہ ہوا۔ ابن ملجم کوفہ آیا اور علی کو پیشانی پر تلوار سے سینگ تک مارا، دماغ تک پہنچ گیا، جب علی نماز کے لیے باہر نکلے۔ علی نے جمعہ اور ہفتہ رکھا اور اتوار کی رات کو 40 سال کی عمر میں، واقف اکاؤنٹ میں تریسٹھ سال کی عمر میں وفات پائی۔ حسن، الحسین اور عبداللہ ابن جعفر نے اسے غسل دیا اور امام حسن نے نماز پڑھائی۔ انہیں رات کو کوفہ کے دار الامارہ میں دفن کیا گیا اور ان کی قبر کو چھپا دیا گیا تاکہ خوارج اسے کھود نہ سکیں۔ ابن ملجم کے اعضاء کو کاٹ کر ایک ٹوکری میں رکھ کر جلا دیا گیا۔ 295-297}۔ المسعودی میں، ابن ملجم نے اسے سینگ پر مارا جب وہ لوگوں کو نماز کے لیے جگا رہے تھے، شبیب اور مجاشی بھی ساتھ تھے۔ شبیب نے دہلیز کو مارا اور مجاشی بھاگ گیا۔ اس سے کچھ پہلے ابن ملجم نے اشعث سے گزر کر ایک سطر کہی تھی۔ حجر بن عدی نے یہ سن کر کہا، 'تم نے اسے قتل کیا ہے، ایک آنکھ والے آدمی، خدا تمہیں قتل کرے۔' اس رات علی کو نیند نہیں آئی۔ اس نے پکارا، 'انہیں چھوڑ دو، کیونکہ یہ فریاد کرنے والے ہیں'، اور حسن، الحسین اور محمد بن الحنفیہ پر الزام لگایا کہ یہ وہ رات تھی جس میں یوشع بن نون کو مارا گیا تھا۔ آپ کا انتقال 21 رمضان المبارک بروز اتوار کی رات ہوا اور آپ کو کوفہ کی مسجد کے پاس الرحبہ میں دفن کیا گیا۔ حسن نے ان پر سات تکبیریں پڑھیں۔ اس نے اپنے مصحف اور تلوار کے ساتھ اپنے وظیفہ میں سے صرف سات سو درہم چھوڑے، یا ڈھائی سو کہا جاتا ہے۔ 702-704}۔"
  tr: "Hicri 40 yılında (Miladi 1050), Abdülrahman ibn Mulcem, el-Barak ibn Abd Allah ve Amr ibn Bakr ile birlikte Ali ve Muaviye'yi öldürmeyi planladı. Bu cildin indeksinde 141-152. sayfalarda \"Ali ibn Abi Talib'in Öldürülmesi\" ve sonrasında yaşananlar anlatılmaktadır. El-Suyuti'ye göre, üçü Mekke'de buluşmuş ve Ramazan'ın on yedinci gecesi Ali, Muaviye ve Amr ibn el-As'ı öldürmek için komplo kurmuşlardır. Her biri kendi arkadaşının Mısır'ına gitmiş, İbn Mulcem ise Kufa'ya gelerek Ali'yi namaz için dışarı çıktığı sırada kılıcıyla alnından, şakağından ve beyninden vurmuştur. Ali cuma ve cumartesi namazlarını kılmış ve kırkıncı yılın pazar gecesi ölmüştür; bilinen rivayete göre altmış üç yaşındadır. Hasan, Hüseyin ve Abdullah ibn Cafer onu yıkamış ve Hasan onun için dua etmiştir. İbn Mulcem geceleyin Kufa'daki vali konağına gömüldü ve mezarı Haricilerin kazıp çıkarmaması için kapatıldı. İbn Mulcem'in uzuvları kesildi, bir sepete konuldu ve ateşte yakıldı. {cite:tarikh-khulafa-minhaj-1434 s. 295-297} El-Mas'udi'ye göre, İbn Mulcem, insanları namaza uyandırırken başına vurdu; Şabib ve Mücaşi' de onunla birlikteydi. Şabib kapı eşiğine vurdu ve Mücaşi' kaçtı. İbn Mulcem daha önce El-Aş'at'ın yanından geçmiş ve \"Sabah güldü\" demişti. Hucer ibn Adi bunu duydu ve \"Onu öldürdün, tek gözlü! Allah seni kahretsin!\" dedi. Ali o gece uyuyamadı ve çocuklara seslenerek, \"Onları bırakın, ağlıyorlar\" dedi. Vasiyetini Hasan, Hüseyin ve Muhammed ibn Hanefiye'ye verdi ve \"Bu, Nun bin Yeşu'nun vurulduğu gecedir\" dedi. Ramazan ayının yirmi birinci Pazar gecesi vefat etti ve Kufe camisinin yakınındaki Rahbe'ye defnedildi. Hasan, yedi defa tekbir getirerek onun için dua etti. Geride sadece yedi yüz dirhem (ya da rivayete göre iki yüz elli dirhem), Kur'an-ı Kerim'ini ve kılıcını bıraktı. {kaynak: Muruj-al-Dhahab s. 702-704}"
  id: "Pada tahun 40 H (1050 M), Abd al-Rahman ibn Muljam, bersama dengan al-Barak ibn Abd Allah dan Amr ibn Bakr, bersekongkol untuk membunuh Ali dan Muawiyah. Indeks buku ini menyebutkan \"Pembunuhan Ali ibn Abi Talib\" dan uraian selanjutnya pada halaman 141 hingga 152. Menurut Al-Suyuti, ketiganya bertemu di Mekah dan bersekongkol untuk membunuh Ali, Muawiyah, dan Amr ibn al-As pada malam tanggal tujuh belas Ramadan. Masing-masing dari mereka pergi ke Mesir tempat sahabatnya berada, dan Ibn Muljam datang ke Kufa dan menebas Ali dengan pedang di dahinya, mengenai pelipis dan otaknya, ketika ia keluar untuk mengumandangkan azan. Ali melaksanakan salat Jumat dan Sabtu dan meninggal pada malam Minggu tahun empat puluh, dan ia berusia enam puluh tiga tahun menurut riwayat yang terkenal. Al-Hasan, Al-Husayn, dan Abdullah ibn Ja’far memandikannya, dan Al-Hasan mendoakannya. Ia dimakamkan di rumah gubernur di Kufa pada malam hari, dan kuburnya ditutup agar kaum Kharijites tidak menggalinya. Anggota tubuh Ibn Muljam dipotong, dan ia diletakkan dalam keranjang lalu dibakar. {cite:tarikh-khulafa-minhaj-1434 p. 295-297} Menurut Al-Mas'udi, Ibn Muljam memukul kepalanya ketika ia sedang membangunkan orang-orang untuk salat, dan Shabib dan Mujashi' bersamanya. Shabib memukul ambang pintu, dan Mujashi' melarikan diri. Ibn Muljam sebelumnya telah melewati Al-Ash'ath dan berkata, \"Pagi tertawa.\" Hujr ibn 'Adi mendengarnya dan berkata, \"Kau membunuhnya, wahai orang bermata satu! Semoga Allah membunuhmu!\" Ali tidak tidur malam itu dan memanggil anak-anaknya, \"Tinggalkan mereka, karena mereka menangis.\" Dia memberikan wasiatnya kepada Al-Hasan, Al-Husayn, dan Muhammad ibn Al-Hanafiyyah, dan berkata, \"Ini adalah malam di mana Yosua bin Nun ditimpa musibah.\" Dia meninggal pada malam Minggu, tanggal 21 Ramadan, dan dimakamkan di Al-Rahbah dekat masjid Kufa. Al-Hasan mendoakannya, dengan membaca takbir tujuh kali. Dia hanya meninggalkan tujuh ratus dirham, yang tersisa dari uang sakunya, atau konon dua ratus lima puluh, salinan Al-Quran miliknya, dan pedangnya. {cite:muruj-al-dhahab hlm. 702-704}"
