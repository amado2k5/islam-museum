id: event/al-hadi-humility-greetings-and-the-poor-at-the-mosque
class: event
kind: other
label:
  ar: 'تواضع الهادي: السلام على الناس وطلب المساكين في المسجد وإنصاف العجائز'
  en: 'Al-Hadi''s humility: greeting everyone, calling the poor at the mosque, and hearing old women''s complaints'
  ur: 'ہادی کی تواضع: سب کو سلام، مسجد میں فقراء کو پکارنا اور بوڑھی عورتوں کی شکایت سننا'
  es: "La humildad de Al-Hadi: saludar a todos, llamar a los pobres en la mezquita y escuchar las quejas de las ancianas."
  fr: "L'humilité d'Al-Hadi: saluer tout le monde, appeler les pauvres à la mosquée et écouter les plaintes des vieilles femmes"
  tr: "Peygamberin tevazusu: insanları selamlaması, camide fakirlere yardım istemesi ve yaşlılara adil davranması."
  id: "Kerendahan hati Nabi: menyapa orang, meminta pertolongan bagi fakir miskin di masjid, dan bersikap adil kepada orang tua."
summary:
  ar: في باب تواضع يحيى بن الحسين يروي محمد بن عبيد الله أنه كان يسلم على كل من يمر به ويعود المرضى وينهى أن يُدعى سيداً، وينادي بعد الجمعة في المسجد على الفقراء وأبناء السبيل، ويقف مع الغريب والعجائز الشاكيات ويأمر محمد بن سليمان الكوفي بإنصافهن من خصومهن.
  en: In the chapter on his humility, Muhammad ibn Ubaydallah relates that al-Hadi greeted everyone he passed, visited the sick, objected to being called "master", had a crier call the poor and travellers in the mosque after the Friday prayer, and stood with a stranger and with old women complaining of wrong, sending Muhammad ibn Sulayman al-Kufi to see them righted.
  ur: تواضع کے باب میں محمد بن عبید اللہ بتاتے ہیں کہ ہادی ہر گزرنے والے کو سلام کرتے، بیماروں کی عیادت کرتے، «سید» کہلانا ناپسند کرتے، جمعہ کے بعد مسجد میں فقراء اور مسافروں کو پکارنے کا حکم دیتے، اجنبی اور شکایت کرنے والی بوڑھی عورتوں کے ساتھ ٹھہرتے اور محمد بن سلیمان کوفی کو ان کا حق دلانے بھیجتے۔
  es: "En el capítulo sobre su humildad, Muhammad ibn Ubaydallah relata que al-Hadi saludaba a todos los que se cruzaba en su camino, visitaba a los enfermos, se oponía a que lo llamaran \"maestro\", hacía que un pregonero llamara a los pobres y a los viajeros en la mezquita después de la oración del viernes, y se quedó con un desconocido y con ancianas que se quejaban de una injusticia, enviando a Muhammad ibn Sulayman al-Kufi para que se hiciera justicia."
  fr: "Dans le chapitre consacré à son humilité, Muhammad ibn Ubaydallah raconte qu'al-Hadi saluait tous ceux qu'il croisait, rendait visite aux malades, refusait d'être appelé « maître », faisait appeler les pauvres et les voyageurs à la mosquée par un crieur public après la prière du vendredi, et se tenait aux côtés d'un étranger et de vieilles femmes se plaignant d'une injustice, envoyant Muhammad ibn Sulayman al-Kufi veiller à ce qu'ils soient redressés."
  tr: "Yahya ibn al-Husayn'ın tevazusu bölümünde, Muhammed ibn Ubayd Allah, onun yanından geçen herkese selam verdiğini, hastaları ziyaret ettiğini, kendisine efendi denmesini yasakladığını, cuma namazından sonra camide fakirler ve yolcular için dua ettiğini, yabancıların ve şikayetçi yaşlı kadınların yanında durduğunu ve Muhammed ibn Sulayman al-Kufi'ye düşmanlarına karşı adalet sağlamasını emrettiğini anlatır."
  id: "Dalam bab tentang kerendahan hati Yahya ibn al-Husayn, Muhammad ibn Ubayd Allah meriwayatkan bahwa beliau biasa menyapa setiap orang yang lewat di dekatnya, mengunjungi orang sakit, melarang dipanggil sebagai tuan, menyerukan seruan setelah salat Jumat di masjid untuk kaum fakir dan musafir, berdiri bersama orang asing dan wanita tua yang mengeluh, dan memerintahkan Muhammad ibn Sulayman al-Kufi untuk memberikan keadilan kepada mereka terhadap musuh-musuh mereka."
