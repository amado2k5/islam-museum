id: event/al-hadi-humility-greetings-and-the-poor-at-the-mosque
class: event
kind: other
label:
  ar: 'تواضع الهادي: السلام على الناس وطلب المساكين في المسجد وإنصاف العجائز'
  en: 'Al-Hadi''s humility: greeting everyone, calling the poor at the mosque, and hearing old women''s complaints'
  ur: 'ہادی کی تواضع: سب کو سلام، مسجد میں فقراء کو پکارنا اور بوڑھی عورتوں کی شکایت سننا'
summary:
  ar: في باب تواضع يحيى بن الحسين يروي محمد بن عبيد الله أنه كان يسلم على كل من يمر به ويعود المرضى وينهى أن يُدعى سيداً، وينادي بعد الجمعة في المسجد على الفقراء وأبناء السبيل، ويقف مع الغريب والعجائز الشاكيات ويأمر محمد بن سليمان الكوفي بإنصافهن من خصومهن.
  en: In the chapter on his humility, Muhammad ibn Ubaydallah relates that al-Hadi greeted everyone he passed, visited the sick, objected to being called "master", had a crier call the poor and travellers in the mosque after the Friday prayer, and stood with a stranger and with old women complaining of wrong, sending Muhammad ibn Sulayman al-Kufi to see them righted.
  ur: تواضع کے باب میں محمد بن عبید اللہ بتاتے ہیں کہ ہادی ہر گزرنے والے کو سلام کرتے، بیماروں کی عیادت کرتے، «سید» کہلانا ناپسند کرتے، جمعہ کے بعد مسجد میں فقراء اور مسافروں کو پکارنے کا حکم دیتے، اجنبی اور شکایت کرنے والی بوڑھی عورتوں کے ساتھ ٹھہرتے اور محمد بن سلیمان کوفی کو ان کا حق دلانے بھیجتے۔
