id: event/al-hadi-halts-before-minas-and-razes-sawhan-292
class: event
kind: other
label:
  ar: "وقوف الهادي قبالة ميناس وتخريب سوحان، ص290-291"
  en: "Al-Hadi halts before Minas and razes Sawhan, pp. 290-291"
  ur: "ہادی کا میناس کے سامنے رکنا اور سوحان کو ڈھانا، ص290-291"
  es: "Al-Hadi se detiene ante Minas y arrasa Sawhan, págs. 290-291"
  fr: "Al-Hadi s'arrête devant Minas et rase Sawhan, pp. 290-291"
  tr: "El-Hadi'nin Minas'a karşı duruşu ve Suhan'ın sabotajı, s. 290-291"
  id: "Sikap Al-Hadi yang menentang Minas dan sabotase terhadap Suhan, hlm. 290-291"
summary:
  ar: "يوم الخميس جمع الهادي عساكره ودنا من ميناس فأوقفها ناحية لأن ابن بسطام كان يكاتبه، ثم مضى إلى سوحان فأخربها وهدمها وطمع أن يخرج القوم فلم يخرجوا، ثم عاد إلى الحصن فأقام الجمعة والسبت."
  en: "On Thursday al-Hadi gathered his troops and drew near Minas, halted them to one side because Ibn Bustam was writing to him, stood an hour facing it, then went on to Sawhan, ruined and demolished it, hoped the people would come out and they did not, and went back to al-Hisn for Friday and Saturday."
  ur: "جمعرات کو ہادی نے لشکر جمع کیا اور میناس کے قریب پہنچے، لشکر کو ایک طرف روک دیا کیونکہ ابن بسطام ان سے خط و کتابت کرتا تھا، ایک ساعت اس کے سامنے ٹھہرے، پھر سوحان گئے، اسے ویران اور مسمار کیا، لوگوں کے نکلنے کی امید کی مگر کوئی نہ نکلا، اور جمعہ و ہفتہ الحصن میں رہے۔"
  es: "El jueves, al-Hadi reunió a sus tropas y se acercó a Minas, las detuvo a un lado porque Ibn Bustam le estaba escribiendo, permaneció una hora frente a ella, luego siguió hacia Sawhan, la arruinó y la demolió, esperando que la gente saliera, pero no lo hicieron, y regresó a al-Hisn para el viernes y el sábado."
  fr: "Jeudi, al-Hadi rassembla ses troupes et s'approcha de Minas, les arrêta sur le côté parce qu'Ibn Bustam lui écrivait, resta une heure face à la ville, puis continua vers Sawhan, la ruina et la démolit, espérant que les habitants sortiraient, mais ils ne le firent pas, et retourna à al-Hisn pour vendredi et samedi."
  tr: "Perşembe günü, El-Hadi askerlerini topladı ve Minas'a yaklaştı; İbn Bastam'ın kendisiyle mektuplaştığını görünce şehri bir kenara çekti. Sonra Suhan'a gitti, şehri yerle bir etti ve insanların dışarı çıkacağını umdu, ama çıkmadılar. Ardından kaleye döndü ve Cuma ve Cumartesi günlerini orada geçirdi."
  id: "Pada hari Kamis, Al-Hadi mengumpulkan pasukannya dan mendekati Minas, menghentikannya di pinggir jalan karena Ibnu Bastam sedang berkorespondensi dengannya. Kemudian dia pergi ke Suhan, menghancurkannya, merobohkannya, dan berharap orang-orang akan keluar, tetapi mereka tidak keluar. Kemudian dia kembali ke benteng dan tinggal di sana pada hari Jumat dan Sabtu."
