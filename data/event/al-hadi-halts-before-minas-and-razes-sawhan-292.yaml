id: event/al-hadi-halts-before-minas-and-razes-sawhan-292
class: event
kind: other
label:
  ar: "وقوف الهادي قبالة ميناس وتخريب سوحان، ص290-291"
  en: "Al-Hadi halts before Minas and razes Sawhan, pp. 290-291"
  ur: "ہادی کا میناس کے سامنے رکنا اور سوحان کو ڈھانا، ص290-291"
summary:
  ar: "يوم الخميس جمع الهادي عساكره ودنا من ميناس فأوقفها ناحية لأن ابن بسطام كان يكاتبه، ثم مضى إلى سوحان فأخربها وهدمها وطمع أن يخرج القوم فلم يخرجوا، ثم عاد إلى الحصن فأقام الجمعة والسبت."
  en: "On Thursday al-Hadi gathered his troops and drew near Minas, halted them to one side because Ibn Bustam was writing to him, stood an hour facing it, then went on to Sawhan, ruined and demolished it, hoped the people would come out and they did not, and went back to al-Hisn for Friday and Saturday."
  ur: "جمعرات کو ہادی نے لشکر جمع کیا اور میناس کے قریب پہنچے، لشکر کو ایک طرف روک دیا کیونکہ ابن بسطام ان سے خط و کتابت کرتا تھا، ایک ساعت اس کے سامنے ٹھہرے، پھر سوحان گئے، اسے ویران اور مسمار کیا، لوگوں کے نکلنے کی امید کی مگر کوئی نہ نکلا، اور جمعہ و ہفتہ الحصن میں رہے۔"
