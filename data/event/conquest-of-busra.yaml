label: { ar: "فتح بصرى", en: "The Conquest of Busra" }
summary:
  ar: "عند البلاذري: لما قدم خالد بن الوليد على المسلمين ببصرى — مدينة حوران — اجتمعوا عليها وأمروا خالداً في حربها ثم ألصقوا بها وحاربوا بطريقها حتى ألجأوها (ويقال بل كان يزيد بن أبي سفيان المتقلد لأمر الحرب لأن ولايتها وإمرتها كانت إليه لأنها من دمشق)، ثم إن أهلها صالحوا على أن يؤمنوا على دمائهم وأموالهم وأولادهم على أن يؤدوا الجزية، وذكر بعض الرواة أنهم صالحوا على أن يؤدوا عن كل حالم ديناراً وجريب حنطة؛ وافتتح المسلمون جميع أرض كورة حوران وغلبوا عليها، وتوجه أبو عبيدة بن الجراح في جماعة كثيفة من أصحاب الأمراء ضُمّوا إليه فأتى مآب من أرض البلقاء وبها جمع العدو فافتتحها صلحاً على مثل صلح بصرى — وقال بعضهم إن فتح مآب قبل فتح بصرى، وقال بعضهم إن أبا عبيدة فتحها وهو أمير على جميع الشام أيام عمر."
  en: "In al-Baladhuri: when Khalid ibn al-Walid reached the Muslims at Busra — the city of Hawran — they joined upon it and commissioned Khalid for its war, then pressed against it and fought its patrician until they forced it (some say Yazid ibn Abi Sufyan was the one undertaking the war, its governorship being his as it belonged to Dimashq); its people then made terms to be secured for their lives, wealth and children upon paying the jizya — some transmitters say they compounded for a dinar and a jarib of wheat per adult; the Muslims conquered all the land of the Hawran district and mastered it; Abu Ubayda ibn al-Jarrah then went with a dense company of the commanders' men joined to him and came to Ma'ab in the land of al-Balqa' holding a gathering of the enemy, and conquered it by treaty on the like of Busra's terms — some say Ma'ab's conquest preceded Busra's, others that Abu Ubayda took it as commander of all Syria in Umar's days."
