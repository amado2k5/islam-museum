id: event/conquest-of-busra
class: event
kind: conquest
label: { ar: "فتح بصرى", en: "The Conquest of Busra", es: "La conquista de Busra", fr: "La conquête de Busra", ur: "بصرہ کی فتح" }
summary:
  ar: "عند البلاذري: لما قدم خالد بن الوليد على المسلمين ببصرى — مدينة حوران — اجتمعوا عليها وأمروا خالداً في حربها ثم ألصقوا بها وحاربوا بطريقها حتى ألجأوها ⁦(ويقال بل كان يزيد بن أبي سفيان المتقلد لأمر الحرب لأن ولايتها وإمرتها كانت إليه لأنها من دمشق)⁩، ثم إن أهلها صالحوا على أن يؤمنوا على دمائهم وأموالهم وأولادهم على أن يؤدوا الجزية، وذكر بعض الرواة أنهم صالحوا على أن يؤدوا عن كل حالم ديناراً وجريب حنطة؛ وافتتح المسلمون جميع أرض كورة حوران وغلبوا عليها، وتوجه أبو عبيدة بن الجراح في جماعة كثيفة من أصحاب الأمراء ضُمّوا إليه فأتى مآب من أرض البلقاء وبها جمع العدو فافتتحها صلحاً على مثل صلح بصرى — وقال بعضهم إن فتح مآب قبل فتح بصرى، وقال بعضهم إن أبا عبيدة فتحها وهو أمير على جميع الشام أيام عمر."
  en: "In al-Baladhuri: when Khalid ibn al-Walid reached the Muslims at Busra — the city of Hawran — they joined upon it and commissioned Khalid for its war, then pressed against it and fought its patrician until they forced it (some say Yazid ibn Abi Sufyan was the one undertaking the war, its governorship being his as it belonged to Dimashq); its people then made terms to be secured for their lives, wealth and children upon paying the jizya — some transmitters say they compounded for a dinar and a jarib of wheat per adult; the Muslims conquered all the land of the Hawran district and mastered it; Abu Ubayda ibn al-Jarrah then went with a dense company of the commanders' men joined to him and came to Ma'ab in the land of al-Balqa' holding a gathering of the enemy, and conquered it by treaty on the like of Busra's terms — some say Ma'ab's conquest preceded Busra's, others that Abu Ubayda took it as commander of all Syria in Umar's days."
  es: "En al-Baladhuri: cuando Khalid ibn al-Walid llegó a Busra, la ciudad de Hawran, los musulmanes se unieron a ella y le encargaron a Khalid la guerra, luego la presionaron y lucharon contra su patricio hasta que lo obligaron (algunos dicen que Yazid ibn Abi Sufyan fue quien emprendió la guerra, ya que el gobierno era suyo porque pertenecía a Dimashq); entonces su gente hizo condiciones para que se les asegurara la vida, la riqueza y los hijos pagando la jizya (algunos transmisores dicen que acordaron un dinar y un jarib de trigo por adulto); los musulmanes conquistaron toda la tierra del distrito de Hawran y la dominaron; Abu Ubayda ibn al-Jarrah partió entonces con una numerosa compañía de hombres de los comandantes que se le unieron y llegó a Ma'ab, en la tierra de al-Balqa', donde se celebraba una reunión del enemigo, y la conquistó mediante un tratado en términos similares a los de Busra; algunos dicen que la conquista de Ma'ab precedió a la de Busra, otros que Abu Ubayda la tomó como comandante de toda Siria en tiempos de Umar."
  fr: "Dans al-Baladhuri: lorsque Khalid ibn al-Walid atteignit les musulmans à Busra — la ville de Hawran —, ils s'allièrent à elle et chargèrent Khalid de la guerre, puis l'assaillirent et combattirent son patricien jusqu'à ce qu'ils la contraignent (certains disent que c'est Yazid ibn Abi Sufyan qui entreprit la guerre, le gouvernement étant le sien car la ville appartenait à Dimashq); ses habitants négocièrent alors des conditions pour garantir leur vie, leurs biens et leurs enfants en échange du paiement de la jizya — certains transmetteurs disent qu'ils convinrent d'un dinar et d'un jarib de blé par adulte; les musulmans conquirent tout le territoire du district de Hawran et le dominèrent; Abou Ubayda ibn al-Jarrah partit ensuite avec une importante troupe d'hommes de commandants qui le rejoignirent et arriva à Ma'ab, au pays d'al-Balqa', où il tenait un rassemblement de l'ennemi, et la conquit par un traité aux termes similaires à ceux de Busra — certains disent que la conquête de Ma'ab a précédé celle de Busra, d'autres qu'Abou Ubayda l'a prise en tant que commandant de toute la Syrie à l'époque d'Omar."
  ur: "البلادوری میں ہے: جب خالد بن الولید مسلمانوں کے پاس بصرہ یعنی حوران کے شہر پہنچا تو وہ اس کے ساتھ شامل ہوئے اور خالد کو اس کی جنگ کا حکم دیا، پھر اس کے خلاف دباؤ ڈالا اور اس کے سرپرست سے لڑتے رہے یہاں تک کہ انہوں نے اسے مجبور کیا ⁦(بعض کا کہنا ہے کہ یزید بن ابی سفیان جنگ کا آغاز کرنے والا تھا، اس کی گورنری اس کی ملکیت تھی)⁩؛ اس کے لوگوں نے جزیہ ادا کرنے پر ان کی جان، مال اور اولاد کی حفاظت کی شرطیں لگائیں - کچھ ٹرانسمیٹر کہتے ہیں کہ انہوں نے فی بالغ ایک دینار اور ایک جریب گیہوں کے حساب سے جمع کیا۔ مسلمانوں نے ضلع حوران کی تمام سرزمین فتح کر لی اور اس پر قبضہ کر لیا۔ ابو عبیدہ بن الجراح اس کے بعد سرداروں کی ایک گھنی جماعت کے ساتھ اس کے ساتھ گئے اور بلقاء کی سرزمین میں معب کے پاس آئے جس میں دشمن کا ایک اجتماع تھا، اور بصری کی شرائط کی طرح معاہدہ کرکے اسے فتح کر لیا، بعض کہتے ہیں کہ مآب کی فتح شام میں ابوعبیدہ کے حکم سے پہلے تھی، اور بعض کہتے ہیں کہ ابوعبیدہ کے حکم پر ابوعبیدہ کی فتح ہوئی تھی۔ دن"
