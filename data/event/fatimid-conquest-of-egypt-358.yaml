id: event/fatimid-conquest-of-egypt-358
class: event
kind: conquest
label: { ar: "فتح جوهر مصر واختطاط القاهرة" }
summary:
  ar: "في سنة سبع ملك القرامطة دمشق وعزموا على قصد مصر فجاء العبيديون فأخذوها وذلك أن كافوراً الإخشيدي صاحب مصر لما مات اختل النظام وقلت الأموال على الجند فكتب جماعة إلى المعز يطلبون منه عسكراً ليسلموا إليه مصر فأرسل مولاه جوهراً القائد في مئة ألف فارس فملكها ونزل موضع مدينة القاهرة اليوم واختطها وبنى دار الإمارة للمعز وهي المعروفة بالقصرين وقطع خطبة بني العباس ولبس السواد وألبس الخطباء البياض وأمر أن يقال في الخطبة اللهم صل على محمد المصطفى وعلى علي المرتضى وعلى فاطمة البتول وعلى الحسن والحسين سبطي الرسول وصل على الأئمة آباء أمير المؤمنين المعز بالله وذلك كله في شعبان سنة ثمان وخمسين، وفي رمضان سنة اثنين وستين دخل المعز إلى مصر ومعه توابيت آبائه {cite:tarikh-khulafa-minhaj-1434 p. 620-622}. وعند ابن الأثير سير المعز لدين الله أبو تميم معد بن إسماعيل أبا الحسن جوهراً غلام والده المنصور — وهو رومي — في جيش كثيف إلى الديار المصرية فاستولى عليها {cite:kamil-ibn-al-athir p. 444}"
  en: "In 357 the Qarmatians took Damascus and meant for Egypt — the Ubaydids took it first. On Kafur's death order broke down and the pay ran short, so notables wrote to al-Mu'izz asking for an army to surrender the country; he sent his mawla Jawhar the commander with a hundred thousand horse. Jawhar took Egypt, laid out the city on Cairo's present site, built the dar al-imara known as the Two Palaces, cut the Abbasid khutba, clad himself in black and the preachers in white, and ordered the new formula — 'bless Muhammad the Chosen, Ali the Approved, Fatima the Virgin, al-Hasan and al-Husayn the Prophet's grandsons, and the imams, fathers of amir al-mu'minin al-Mu'izz bi'llah' — all in Sha'ban 358. In Ramadan 362 al-Mu'izz himself entered Egypt with his fathers' coffins {cite:tarikh-khulafa-minhaj-1434 p. 620-622}، ودخل جوهر البلد يوم الثلاثاء لسبع عشرة ليلة خلت من شعبان وأقام عسكره يدخل البلد مسبعاً أيام، وقطع خطبة بني العباس عن المنابر وأسماهم من على السكة وعوض عن ذلك باسم المعز وأزال الشعار الأسود وألبس الخطباء الثياب البيض، وأذن بحي على خير العمل في جامع مصر العتيق في جمادى الأولى سنة تسع وخمسين وسر جوهر بذلك وكتب إلى المعز يبشره، وفرغ من بناء الجامع الأزهر في سابع رمضان سنة إحدى وستين وجمع فيه الجمعة {cite:shadharat-dhahab p. 107-108}"
