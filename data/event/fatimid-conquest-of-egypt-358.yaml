id: event/fatimid-conquest-of-egypt-358
class: event
kind: conquest
label: { ar: "فتح جوهر مصر واختطاط القاهرة", en: "Jawhar's conquest of Egypt and the laying out of Cairo", es: "La conquista de Egipto por Jawhar y el trazado de El Cairo", fr: "La conquête de l'Égypte par Jawhar et l'aménagement du Caire", ur: "جوہر کی مصر کی فتح اور قاہرہ کا قیام", tr: "Mısır'ın fethi ve Kahire'nin planlanması", id: "Penaklukan Mesir dan perencanaan Kairo" }
summary:
  ar: "في سنة سبع ملك القرامطة دمشق وعزموا على قصد مصر فجاء العبيديون فأخذوها وذلك أن كافوراً الإخشيدي صاحب مصر لما مات اختل النظام وقلت الأموال على الجند فكتب جماعة إلى المعز يطلبون منه عسكراً ليسلموا إليه مصر فأرسل مولاه جوهراً القائد في مئة ألف فارس فملكها ونزل موضع مدينة القاهرة اليوم واختطها وبنى دار الإمارة للمعز وهي المعروفة بالقصرين وقطع خطبة بني العباس ولبس السواد وألبس الخطباء البياض وأمر أن يقال في الخطبة اللهم صل على محمد المصطفى وعلى علي المرتضى وعلى فاطمة البتول وعلى الحسن والحسين سبطي الرسول وصل على الأئمة آباء أمير المؤمنين المعز بالله وذلك كله في شعبان سنة ثمان وخمسين، وفي رمضان سنة اثنين وستين دخل المعز إلى مصر ومعه توابيت آبائه {cite:tarikh-khulafa-minhaj-1434 p. 620-622}. وعند ابن الأثير سير المعز لدين الله أبو تميم معد بن إسماعيل أبا الحسن جوهراً غلام والده المنصور — وهو رومي — في جيش كثيف إلى الديار المصرية فاستولى عليها {cite:kamil-ibn-al-athir p. 444}"
  en: "In 357 the Qarmatians took Damascus and meant for Egypt — the Ubaydids took it first. On Kafur's death order broke down and the pay ran short, so notables wrote to al-Mu'izz asking for an army to surrender the country; he sent his mawla Jawhar the commander with a hundred thousand horse. Jawhar took Egypt, laid out the city on Cairo's present site, built the dar al-imara known as the Two Palaces, cut the Abbasid khutba, clad himself in black and the preachers in white, and ordered the new formula — 'bless Muhammad the Chosen, Ali the Approved, Fatima the Virgin, al-Hasan and al-Husayn the Prophet's grandsons, and the imams, fathers of amir al-mu'minin al-Mu'izz bi'llah' — all in Sha'ban 358. In Ramadan 362 al-Mu'izz himself entered Egypt with his fathers' coffins {cite:tarikh-khulafa-minhaj-1434 p. 620-622}، ودخل جوهر البلد يوم الثلاثاء لسبع عشرة ليلة خلت من شعبان وأقام عسكره يدخل البلد مسبعاً أيام، وقطع خطبة بني العباس عن المنابر وأسماهم من على السكة وعوض عن ذلك باسم المعز وأزال الشعار الأسود وألبس الخطباء الثياب البيض، وأذن بحي على خير العمل في جامع مصر العتيق في جمادى الأولى سنة تسع وخمسين وسر جوهر بذلك وكتب إلى المعز يبشره، وفرغ من بناء الجامع الأزهر في سابع رمضان سنة إحدى وستين وجمع فيه الجمعة {cite:shadharat-dhahab p. 107-108}"
  es: "En 357 los cármatas tomaron Damasco y se dirigieron a Egipto; los ubaydíes lo tomaron primero. A la muerte de Kafur, la orden se rompió y la paga escaseó, por lo que los notables escribieron a al-Mu'izz pidiendo un ejército para rendir el país; él envió a su mawla Jawhar, el comandante, con cien mil caballos. Jawhar tomó Egipto, trazó la ciudad en el sitio actual de El Cairo, construyó el dar al-imara conocido como los Dos Palacios, cortó la jutba abasí, se vistió de negro y a los predicadores de blanco amir al-mu'minin al-Mu'izz bi'llah', todo en Sha'ban 358. En Ramadán 362, el propio al-Mu'izz entró en Egipto con los ataúdes de sus padres {cite:tarikh-khulafa-minhaj-1434 p. 620-622}, y entró en la ciudad el martes para las siete décimas noches de Sha'ban, y el ejército entró en la ciudad siete días después En la moneda y rezando por ese hermoso nombre y el eslogan negro y el hermoso vestido de discurso púrpura, y permiso para hacer buenas obras en la antigua mezquita egipcia en Jamadi al-Awli Sunnah decimonoveno y decimoquinto y el secreto de la joya de esto y el libro al Ma'az es liberado, y vacío del edificio de la Mezquita Al-Azhar el séptimo de Ramadán, el primer día de Ramadán y reunión el viernes {cite:shadharat-dhahab p. 107-108}"
  fr: "En 357, les Qarmates prirent Damas et se dirigèrent vers l'Égypte, que les Oubayidides conquirent en premier. À la mort de Kafur, l'ordre s'effondra et la solde vint à manquer. Des notables écrivirent alors à al-Mu'izz pour lui demander une armée afin de capituler. Il envoya son mawla Jawhar, commandant en chef, avec cent mille cavaliers. Jawhar prit l'Égypte, traça la ville sur le site actuel du Caire, fit construire le Dar al-Imara, connu sous le nom des Deux Palais, supprima le khutba abbasside, se vêtit de noir et fit revêtir les prédicateurs de blanc, proclamant « amir al-mu'minin al-Mu'izz bi'llah' » (émir des croyants, al-Mu'izz bi'llah') – tout cela en Sha'ban 358. Au Ramadan 362, al-Mu'izz lui-même entra en Égypte avec les cercueils de ses pères. 620-622}, et entra dans la ville le mardi pendant sept nuits du dixième jour de Sha'ban, et l'armée entra dans la ville sept jours plus tard. Sur la pièce et priant pour ce beau nom et le slogan noir et la belle robe de discours violette, et la permission de faire de bonnes actions dans l'ancienne mosquée égyptienne dans Jamadi al-Awli Sunnah dix-neuvième et quinzième et le secret du joyau de ceci et le livre au Ma'az est révélé, et vide du bâtiment de la mosquée Al-Azhar le septième Ramadan, le premier jour de Ramadan et le rassemblement le vendredi {cite:shadharat-dhahab p. 107-108}"
  ur: "357 میں قرامطیوں نے دمشق پر قبضہ کر لیا اور اس کا مطلب مصر کے لیے تھا - عبیدیوں نے اسے پہلے لیا۔ کافور کی موت کا حکم ٹوٹ گیا اور تنخواہ کم پڑ گئی، چنانچہ معززین نے المعز کو خط لکھا کہ ملک کو ہتھیار ڈالنے کے لیے فوج طلب کی جائے۔ اس نے اپنے سپہ سالار مولا جوہر کو ایک لاکھ گھوڑے کے ساتھ بھیجا۔ جوہر نے مصر لے لیا، قاہرہ کے موجودہ مقام پر شہر بسایا، دار الامارہ تعمیر کیا جسے دو محل کہا جاتا ہے، عباسی خطبہ کاٹتے ہیں، سیاہ لباس پہنتے ہیں اور مبلغین سفید امیر المومنین المعز باللہ - یہ سب کچھ شعبان 358 میں ہوا تھا۔ رمضان المبارک میں اپنے والد المومنین کے ساتھ مصر میں داخل ہوئے۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 620-622}، اور شعبان کی سات دسویں راتوں کو منگل کے دن شہر میں داخل ہوئے، اور فوج سات دن بعد شہر میں داخل ہوئی، سکے پر اور اس خوبصورت نام اور سیاہ نعرے اور خوبصورت ارغوانی تقریری لباس کے لیے دعا، اور جمادی الاولیٰ میں قدیم مصری مسجد میں نیک اعمال کی اجازت اور اس کتاب کی انیسویں اور انیسویں اور اس کتاب کے پانچویں راز تک۔ جاری کیا گیا ہے، اور ساتویں رمضان کو، رمضان کے پہلے دن اور جمعۃ المبارک کو مسجد الازہر کی عمارت سے خالی کر دیا گیا ہے۔ 107-108}"
  tr: "7. yılda Karmatiler Şam'ı ele geçirdi ve Mısır'a doğru ilerlemeyi amaçladılar, ancak Fatimiler gelip Mısır'ı ele geçirdi. Bunun nedeni, Mısır hükümdarı Kafur el-İhşidi'nin ölümüyle sistemin bozulması ve ordunun kaynaklarının azalmasıydı. Bir grup, Mısır'ı kendisine teslim etmek için bir ordu talep eden bir mektup yazdı. Bunun üzerine, azat ettiği kölesi Cevher'i komutan olarak yüz bin süvariyle gönderdi; bu süvariler Mısır'ın kontrolünü ele geçirdi ve bugünkü Kahire şehrinin bulunduğu yere yerleşti. Şehrin planlarını çizdi ve el-Muizz için el-Kasreyn olarak bilinen Emir konutunu inşa etti. Abbasiler adına vaaz vermeyi bıraktı, siyah giydi ve vaizlerin beyaz giymelerini sağladı. O, vaazda şöyle denmesini emretti: \"Ey Allah'ım, Seçilmiş Muhammed'e, Seçilmiş Ali'ye, Temiz Fatıma'ya, Resul'ün torunları Hasan ve Hüseyin'e ve Müminlerin Emiri Muizz Billah'ın babaları olan İmamlara salât ve selam eyle.\" Bütün bunlar 58 yılının Şaban ayında oldu. 62 yılının Ramazan ayında Muizz, babalarının tabutlarıyla Mısır'a girdi. {kaynak:tarikh-khulafa-minhaj-1434 s. 620-622} İbn el-Athir'e göre, babası Romalı olan Mansur'un kölesi Muizz li-Din Allah Ebu Tamim Ma'ad ibn İsmail Ebu el-Hasan Cevher, büyük bir orduyla Mısır topraklarına girdi ve onları ele geçirdi. {kaynak:kamil-ibn-al-athir s. 444}"
  id: "Pada tahun 7, kaum Qarmatian menguasai Damaskus dan bermaksud untuk menyerbu Mesir, tetapi kaum Fatimiyah datang dan merebutnya. Hal ini karena ketika Kafur al-Ikhshidi, penguasa Mesir, meninggal, sistem pemerintahan terganggu dan dana tentara menipis. Sekelompok orang menulis surat kepada al-Mu'izz meminta pasukan untuk menyerahkan Mesir kepadanya. Maka ia mengirimkan budak yang telah dibebaskannya, Jawhar, sebagai komandan, dengan seratus ribu pasukan berkuda, yang menguasai wilayah tersebut dan menetap di lokasi kota Kairo saat ini. Ia menyusun rencana dan membangun kediaman Emir untuk al-Mu'izz, yang dikenal sebagai al-Qasrayn. Ia menghentikan khotbah atas nama Abbasiyah, mengenakan pakaian hitam, dan membuat para pengkhotbah mengenakan pakaian putih. Ia memerintahkan agar khutbah tersebut berbunyi: \"Ya Allah, berkatilah Muhammad sang Terpilih, dan Ali sang Terpilih, dan Fatimah yang Suci, dan al-Hasan dan al-Husayn, cucu-cucu Rasulullah, dan berkatilah para Imam, ayah dari Amirul Mukminin, al-Mu'izz Billah.\" Semua ini terjadi pada bulan Sya'ban tahun 58. Pada bulan Ramadhan tahun 62, al-Mu'izz memasuki Mesir dengan peti mati para leluhurnya. {cite:tarikh-khulafa-minhaj-1434 hlm. 620-622} Menurut Ibn al-Athir, al-Mu'izz li-Din Allah Abu Tamim Ma'ad ibn Isma'il Abu al-Hasan Jawhar, budak ayahnya al-Mansur — yang merupakan seorang Romawi — memimpin pasukan besar ke tanah Mesir dan merebutnya. {cite:kamil-ibn-al-athir hlm. 444}"
