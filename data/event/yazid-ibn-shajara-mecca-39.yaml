label: { ar: "إرسال يزيد بن شجرة إلى مكة ليأخذ البيعة لمعاوية", en: "Yazīd ibn Shajara sent to seize the Ḥajj and Mecca's bayʿa for Muʿāwiya (39 AH)", es: "Yazīd ibn Shajara enviado a apoderarse del Ḥajj y la bayʿa de La Meca para Muʿāwiya (39 AH)", fr: "Yazīd ibn Shajara envoyé pour s'emparer du Ḥajj et de la bayʿa de La Mecque pour Muʿāwiya (39 AH)", ur: "یزید بن شجرہ نے معاویہ کے لیے حج اور مکہ کی بیع پر قبضہ کرنے کے لیے بھیجا ⁦(39ھ)⁩", tr: "Muaviye'ye biat etmek için Yezid ibn Shajara'yı Mekke'ye göndermek", id: "Mengirim Yazid ibn Shajara ke Mekah untuk mengamankan kesetiaan kepada Mu'awiya" }
date:
  start: { edtf: "0659", hijri: "0039", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 39؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 726}." }
summary:
  ar: "دعا معاوية يزيد بن شجرة الرهاوي فقال له إني أريد أن أوجهك إلى مكة لتقيم للناس الحج وتأخذ لي البيعة بمكة وتنفي عنها عامل علي {cite:kamil-ibn-al-athir p. 726}."
  en: "Muʿāwiya commissioned Yazīd ibn Shajara al-Rahāwī: «I mean to send you to Mecca to conduct the people's Ḥajj, take the bayʿa for me there, and expel ʿAli's governor from it» {cite:kamil-ibn-al-athir p. 726}."
  es: "Muʿāwiya encargó a Yazīd ibn Shajara al-Rahāwī: «Quiero enviarte a La Meca para que dirijas el Ḥajj del pueblo, tomes el bayʿa por mí allí y expulses al gobernador de ʿAli de allí» {cite:kamil-ibn-al-athir p. 726}."
  fr: "Muʿāwiya chargea Yazīd ibn Shajara al-Rahāwī: « Je compte t’envoyer à La Mecque pour diriger le pèlerinage du peuple, prendre ma bayʿa là-bas et expulser le gouverneur d’ʿAli » {cite:kamil-ibn-al-athir p. 726}."
  ur: "معاویہ نے یزید بن شجرہ الرحاوی کو حکم دیا: \"میرا مطلب یہ ہے کہ آپ لوگوں کے حج کے لیے آپ کو مکہ بھیجیں، وہاں میرے لیے بیعت کریں، اور علی کے گورنر کو وہاں سے نکال دیں\"۔ 726}۔"
  tr: "Muaviye, Yezid ibn Şecere el-Rahavi'yi çağırdı ve ona şöyle dedi: \"Seni Mekke'ye göndermek istiyorum; insanlar için Hac yapmanı, Mekke'de bana biat etmeni ve Ali'nin valisini oradan kovmanı istiyorum.\" {Kaynak: Kamil ibn el-Atir s. 726}"
  id: "Muawiyah memanggil Yazid ibn Shajarah al-Rahawi dan berkata kepadanya, “Aku ingin mengirimmu ke Mekah untuk melaksanakan ibadah haji bagi umat Islam, untuk mengucapkan sumpah setia kepadaku di Mekah, dan untuk mengusir gubernur Ali dari sana.” {cite:kamil-ibn-al-athir p. 726}"
