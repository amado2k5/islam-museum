summary:
  ar: "وقّعت معاهدة كارلوفتس جنوب غرب زغرب على نهر الدانوب عام ١١١٠هـ/١٦٩٩م في عهد السلطان مصطفى الثاني، وطبقاً لشروطها انسحب العثمانيون من بلاد المجر وإقليم ترانسلفانيا، وأصبحت كل الدول التي كانت تدفع الجزية ممتنعة من دفعها. وكان تنازل العثمانيين عن أراضيهم بداية الانسحاب العثماني من أوروبا ويسجل الانتقال إلى عصر التفكك والاضمحلال السريع {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Karlowitz, 1699 — the treaty that opened the Ottoman retreat from Europe: Hungary and Transylvania surrendered, and every tributary state stopped paying {cite:dawlat-uthmaniyya-salabi p. 310}."
  es: "Karlowitz, 1699 — el tratado que abrió la retirada otomana de Europa: Hungría y Transilvania se rindieron, y todos los estados tributarios dejaron de pagar {cite:dawlat-uthmaniyya-salabi p. 310}."
  fr: "Karlowitz, 1699 — le traité qui a ouvert la retraite ottomane d'Europe: la Hongrie et la Transylvanie ont capitulé, et chaque État tributaire a cessé de payer {cite:dawlat-uthmaniyya-salabi p. 310}."
  ur: "کارلووٹز، 1699 - وہ معاہدہ جس نے عثمانیوں کو یورپ سے پسپائی کا آغاز کیا: ہنگری اور ٹرانسلوانیا نے ہتھیار ڈال دیے، اور ہر معاون ریاست نے ادائیگی بند کردی۔ 310}۔"
  tr: "Karlovak Antlaşması, Sultan II. Mustafa döneminde, Hicri 1110/Miladi 1699 yılında, Zagreb'in güneybatısında, Tuna Nehri kıyısında imzalanmıştır. Antlaşmanın şartlarına göre, Osmanlılar Macaristan ve Transilvanya'dan çekilmiş ve vergi ödeyen tüm devletler vergi ödemeyi bırakmıştır. Osmanlıların topraklarından vazgeçmesi, Avrupa'dan çekilmelerinin başlangıcını ve hızlı bir dağılma ve gerileme dönemine geçişi işaret etmiştir. {cite:dawlat-uthmaniyya-salabi s. 310}"
  id: "Perjanjian Karlovac ditandatangani di sebelah barat daya Zagreb di Sungai Danube pada tahun 1110 H/1699 M pada masa pemerintahan Sultan Mustafa II. Menurut ketentuan perjanjian tersebut, Ottoman menarik diri dari Hongaria dan Transylvania, dan semua negara yang sebelumnya membayar upeti berhenti melakukannya. Pelepasan wilayah Ottoman menandai awal penarikan mereka dari Eropa dan menandakan transisi ke era disintegrasi dan kemunduran yang cepat. {cite:dawlat-uthmaniyya-salabi p. 310}"
