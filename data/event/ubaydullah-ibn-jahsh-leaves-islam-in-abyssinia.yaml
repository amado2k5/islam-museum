id: event/ubaydullah-ibn-jahsh-leaves-islam-in-abyssinia
class: event
kind: other
label: { ar: "تنصّر عبيد الله بن جحش بأرض الحبشة", en: "Ubaydullah ibn Jahsh becomes a Christian in Abyssinia", es: "Ubaydullah ibn Jahsh se convierte al cristianismo en Abisinia.", fr: "Ubaydullah ibn Jahsh se convertit au christianisme en Abyssinie", ur: "عبید اللہ ابن جحش حبشہ میں عیسائی ہو گیا۔", tr: "Ubayd Allah ibn Jahsh, Habeşistan'da Hristiyanlığı kabul etti.", id: "Ubayd Allah ibn Jahsh memeluk agama Kristen di Abyssinia." }
summary:
  ar: "قال ابن إسحاق: خرج عبيد الله بن جحش مع المسلمين مهاجراً إلى أرض الحبشة، فلما قدمها تنصّر وفارق الإسلام ومات هناك نصرانياً، ثم خلف النبي على امرأته أم حبيبة بنت أبي سفيان من بعده. ولا يؤرخ الكتاب هذه الواقعة."
  en: "Ibn Ishaq says: Ubaydullah ibn Jahsh went out with the Muslims emigrating to Abyssinia, and when he arrived he became a Christian, left Islam and died there a Christian; the Prophet afterwards married his wife Umm Habiba bint Abi Sufyan. The book does not date the event."
  es: "Ibn Ishaq relata: Ubaydullah ibn Jahsh partió con los musulmanes que emigraron a Abisinia, y al llegar se convirtió al cristianismo, abandonó el islam y murió allí siendo cristiano. Posteriormente, el Profeta se casó con su esposa Umm Habiba bint Abi Sufyan. El libro no fecha este acontecimiento."
  fr: "Ibn Ishaq rapporte: Ubaydullah ibn Jahsh partit avec les musulmans émigrés en Abyssinie. À son arrivée, il se convertit au christianisme, puis abandonna l'islam et mourut chrétien. Le Prophète épousa ensuite sa femme, Umm Habiba bint Abi Sufyan. L'ouvrage ne précise pas la date de cet événement."
  ur: "ابن اسحاق کہتے ہیں: عبید اللہ ابن جحش مسلمانوں کے ساتھ حبشہ کی طرف ہجرت کر کے نکلا، اور جب وہ وہاں پہنچا تو عیسائی ہو گیا، اسلام چھوڑ دیا اور وہیں عیسائی ہو کر مر گیا۔ اس کے بعد نبی نے اپنی بیوی ام حبیبہ بنت ابی سفیان سے شادی کی۔ کتاب میں واقعہ کی تاریخ نہیں ہے۔"
  tr: "İbn İshak şöyle demiştir: Ubeydullah ibn Cahş, Müslümanlarla birlikte Habeşistan topraklarına hicret etti. Oraya vardığında Hristiyanlığı kabul etti, İslam'ı terk etti ve orada Hristiyan olarak vefat etti. Daha sonra Peygamber, onun eşi Ümmü Habibe bint Ebu Sufyan ile evlendi. Kitap bu olayın tarihini belirtmemektedir."
  id: "Ibn Ishaq berkata: Ubayd Allah ibn Jahsh pergi bersama kaum Muslimin sebagai muhajirin ke negeri Abyssinia. Ketika tiba di sana, ia memeluk agama Kristen dan meninggalkan Islam, lalu meninggal di sana sebagai seorang Kristen. Kemudian Nabi menikahi istrinya, Umm Habibah bint Abi Sufyan, setelahnya. Kitab ini tidak menyebutkan tanggal kejadian tersebut."
