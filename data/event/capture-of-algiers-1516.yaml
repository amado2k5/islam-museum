label: { ar: "دخول عروج بربروسة الجزائر ⁦(٩٢٢هـ/١٥١٦م)⁩", en: "Aruj Barbarossa enters Algiers (1516)", fr: "Aruj Barberousse entre à Alger (1516)", es: "Aruj Barbarroja entra en Argel (1516)", ur: "اروج بارباروسا الجزائر میں داخل ہوا (1516)", tr: "Aruj Barbarossa'nın Cezayir'e girişi (922 Hicri/1516 Miladi)", id: "Masuknya Aruj Barbarossa ke Aljazair (922 H/1516 M)" }
summary:
  ar: "بعد فشل الأخوين عروج وخير الدين في فتح بجاية وحصارهما في جيجل بين الحفصيين وبين سالم التؤمي حاكم الجزائر المدعوم من الأسبان، وصل الدعم العثماني فاتفق الطرفان على الإسراع بدخول الجزائر قبل القوات الأسبانية لموقعها الممتاز. فدخلها عروج وقتل حاكمها بعد أن تأكد من مساعيه للاستعانة بالقوات الأسبانية، ودخل ميناء شرشال، واجتمع له الأمر في الجزائر في السنة نفسها التي هُزمت فيها القوات المملوكية أمام العثمانيين في موقعة مرج دابق سنة ١٥١٦م {cite:dawlat-uthmaniyya-salabi p. 210}."
  en: "After failing at Bougie and being trapped at Jijel between the Hafsids and Salim al-Tumi, Aruj entered Algiers with Ottoman support, killed its ruler on proof of his dealings with Spain, and took Cherchell — in the same 1516 that saw Marj Dabiq {cite:dawlat-uthmaniyya-salabi p. 210}."
  fr: "Après avoir échoué à Bougie et s'être trouvé pris au piège à Jijel entre les Hafsides et Salim al-Tumi, Aruj entra à Alger avec le soutien ottoman, tua son souverain sur preuve de ses tractations avec l'Espagne, et prit Cherchell, en cette même année 1516 qui vit Marj Dabiq {cite:dawlat-uthmaniyya-salabi p. 210}."
  es: "Después de fracasar en Bougie y quedar atrapado en Jijel entre los Hafsids y Salim al-Tumi, Aruj entró en Argel con el apoyo otomano, mató a su gobernante tras probar sus tratos con España y tomó Cherchell, en el mismo 1516 que vio a Marj Dabiq {cite:dawlat-uthmaniyya-salabi p. 210}."
  ur: "بوگی میں ناکام ہونے کے بعد اور حفصیوں اور سلیم التومی کے درمیان جیجل میں پھنس جانے کے بعد، عروج عثمانی حمایت کے ساتھ الجزائر میں داخل ہوا، اسپین کے ساتھ اس کے معاملات کے ثبوت پر اس کے حکمران کو مار ڈالا، اور چرچل کو لے لیا - اسی 1516 میں جس نے مرج دابیق کو دیکھا۔ 210}۔"
  tr: "Oruç ve Khair ad-Din kardeşler Béjaïa'yı fethetme girişimlerinde başarısız olduktan ve Hafsidler ile İspanyol destekli Cezayir hükümdarı Salim al-Tuami tarafından Jijel'de kuşatıldıktan sonra, Osmanlı takviye birlikleri geldi. Her iki taraf da stratejik konumu nedeniyle İspanyol kuvvetlerinden önce Cezayir'e girişlerini hızlandırma konusunda anlaştı. Oruç şehre girdi, İspanyol yardımını alma girişimlerini doğruladıktan sonra hükümdarı öldürdü ve Cherchell limanına girdi. 1516 yılında Memlük kuvvetlerinin Osmanlılar tarafından Marj Dabiq Muharebesi'nde yenilgiye uğratıldığı yıl Cezayir'deki gücünü pekiştirdi. {cite:dawlat-uthmaniyya-salabi s. 210}"
  id: "Setelah saudara Oruç dan Khair ad-Din gagal menaklukkan Bejaïa dan dikepung di Jijel oleh Hafsid dan Salim al-Tuami, penguasa Aljir yang didukung Spanyol, bala bantuan Ottoman tiba. Kedua pihak sepakat untuk mempercepat masuknya mereka ke Aljir sebelum pasukan Spanyol karena lokasinya yang strategis. Oruç memasuki kota, membunuh penguasanya setelah memastikan upayanya untuk mendapatkan bantuan Spanyol, dan memasuki pelabuhan Cherchell. Ia mengkonsolidasikan kekuasaannya di Aljir pada tahun yang sama ketika pasukan Mamluk dikalahkan oleh Ottoman dalam Pertempuran Marj Dabiq pada tahun 1516 M. {cite:dawlat-uthmaniyya-salabi p. 210}"
