summary:
  ar: "في سنة تسع وخمسين ومائتين ذكر الطبري مقتل كنجور، وكان والي الكوفة، فانصرف عنها إلى سامراء بغير إذن، فأمر بالرجوع فأبى {cite:tabari-tarikh-abu-al-fadl j.9 p.502}."
  en: "In the year 259 al-Tabari mentions the killing of Kanjur, governor of Kufa, who left for Samarra without permission; when ordered to return he refused {cite:tabari-tarikh-abu-al-fadl j.9 p.502}."
  es: "En el año 259, al-Tabari menciona el asesinato de Kanjur, gobernador de Kufa, quien partió hacia Samarra sin permiso; cuando se le ordenó regresar, se negó {cite:tabari-tarikh-abu-al-fadl j.9 p.502}."
  fr: "En l'an 259, al-Tabari mentionne le meurtre de Kanjur, gouverneur de Kufa, qui partit pour Samarra sans autorisation; lorsqu'on lui ordonna de revenir, il refusa {cite:tabari-tarikh-abu-al-fadl j.9 p.502}."
