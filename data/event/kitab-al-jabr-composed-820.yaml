summary:
  ar: "صنّف الخوارزمي في بيت الحكمة ببغداد كتابه «المختصر في حساب الجبر والمقابلة» في عهد المأمون، وفيه قواعد حل المعادلات الخطية والتربيعية ببراهين هندسية؛ ومن ترجمته اللاتينية جاءت كلمة algebra {cite:britannica-al-khwarizmi}."
  en: "At the House of Wisdom in Baghdad under al-Maʾmūn, al-Khwārizmī composed his Algebra — rules and geometric demonstrations for solving linear and quadratic equations; its Latin translation gave Europe the word algebra {cite:britannica-al-khwarizmi}."
  ur: "بغداد کے دارالحکمہ میں المأمون کے عہد میں خوارزمی نے الجبر کی کتاب لکھی جس میں خطی اور درجہ دوم مساوات کے ہندسی برہان تھے؛ اس کی لاطینی ترجمے سے algebra کا لفظ بنا {cite:britannica-al-khwarizmi}."
