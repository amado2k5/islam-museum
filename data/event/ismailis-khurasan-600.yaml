summary:
  ar: "أُلقي كتاب إلى شهاب الدين الغوري من مقدم الإسماعيلية فحمله على قتل طائفة منهم بخراسان؛ قيل إنه فخّ دُبّر عليه ليستميله العامة {cite:kamil-ibn-al-athir p. 288}."
  en: "A letter from an Ismaili leader reached Shihab al-Din and led to a slaughter of Ismailis in Khurasan — said by some to be a trap laid to turn public feeling against him {cite:kamil-ibn-al-athir p. 288}."
  es: "Una carta de un líder ismaelita llegó a Shihab al-Din y provocó una masacre de ismaelitas en Jorasán, que según algunos fue una trampa tendida para poner al público en su contra {cite:kamil-ibn-al-athir p. 288}."
  fr: "Une lettre d'un chef ismaélien parvint à Shihab al-Din et conduisit à un massacre d'Ismaéliens au Khorasan — selon certains, il s'agissait d'un piège tendu pour retourner l'opinion publique contre lui {cite:kamil-ibn-al-athir p. 288}."
  ur: "ایک اسماعیلی رہنما کا ایک خط شہاب الدین تک پہنچا اور خراسان میں اسماعیلیوں کے قتل عام کا باعث بنا - بعض لوگوں نے اسے اپنے خلاف عوامی جذبات کو پھیرنے کے لیے بچھایا ہوا جال قرار دیا۔ 288}۔"
  tr: "İsmailîlerin liderinden Şihab el-Din el-Gavri'ye bir mektup atılmış ve bu mektup üzerine Horasan'da bir grup İsmailîyi öldürmüştür; bunun, halkın desteğini kazanmak için kurulmuş bir tuzak olduğu söylenmektedir. {Kaynak: Kamil ibn el-Atir s. 288}"
  id: "Sebuah surat dilemparkan kepada Shihab al-Din al-Ghawri dari pemimpin Ismailiyah, yang mendorongnya untuk membunuh sekelompok dari mereka di Khorasan; dikatakan bahwa itu adalah jebakan yang dibuat agar dia dapat memenangkan hati rakyat jelata {cite:kamil-ibn-al-athir p. 288}."
