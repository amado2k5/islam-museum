label: { ar: "فتح بيت المقدس" }
summary:
  ar: "قدم عمر بن الخطاب الجابية، فخرج إليه أهل إيلياء طالبين الأمان، فصالحوه على الجزية وفتحوا المدينة له. وأشار عليه يهودي كان يسأله عن الدجال بأن لا يرجع حتى يفتح الله إيلياء {cite:tabari-tarikh-abu-al-fadl j.3 p.607}. وفهرس الجزء يضع الذكر في سنة خمس عشرة، صفحات 607 إلى 613 {cite:tabari-tarikh-abu-al-fadl j.3 p.632}."
