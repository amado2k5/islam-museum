label: { ar: "فتح بيت المقدس", en: "Conquest of Bayt al-Maqdis (Jerusalem)" }
summary:
  ar: "قدم عمر بن الخطاب الجابية، فخرج إليه أهل إيلياء طالبين الأمان، فصالحوه على الجزية وفتحوا المدينة له. وأشار عليه يهودي كان يسأله عن الدجال بأن لا يرجع حتى يفتح الله إيلياء {cite:tabari-tarikh-abu-al-fadl j.3 p.607}. وفهرس الجزء يضع الذكر في سنة خمس عشرة، صفحات 607 إلى 613 {cite:tabari-tarikh-abu-al-fadl j.3 p.632}."
  en: "Umar ibn al-Khattab came to al-Jabiya; the people of Iliya came out to him seeking safe-conduct, made peace with him on payment of the jizya, and opened the city to him. A Jewish man who used to question him about the Dajjal advised him not to turn back until God had opened Iliya to him {cite:tabari-tarikh-abu-al-fadl j.3 p.607}. The volume's index places the account under the year 15, pages 607 to 613 {cite:tabari-tarikh-abu-al-fadl j.3 p.632}."
