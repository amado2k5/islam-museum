id: event/conquest-of-jerusalem
class: event
kind: conquest
label: { ar: "فتح بيت المقدس", en: "Conquest of Bayt al-Maqdis (Jerusalem)" }
summary:
  ar: "سلّم أهل إيلياء المدينة للمسلمين في عهد عمر بن الخطاب، بصلح على الجزية، وتختلف المصادر في من تلقّى التسليم وفي نص المعاهدة وفي السنة. تذكر دائرة المعارف الإسلامية أن أقدم الروايات تجعل الصلح مع قائد قبلي قليل الشهرة هو خالد بن ثابت الفهمي، وتصف روايات زيارة عمر وشروط العهدة العمرية بأنها متأخرة ولا يوثق بها. وفي رواية الطبري قدم عمر الجابية فخرج إليه أهل إيلياء طالبين الأمان {cite:tabari-tarikh-abu-al-fadl j.3 p.607}، ويضع فهرس الجزء الثالث الخبر في سنة خمس عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.632}، وتضعه المقالة في مطلع سنة 638م، أي آخر 16هـ أو أول 17هـ."
  en: "The people of Iliya surrendered the city to the Muslims in the time of Umar ibn al-Khattab, making peace on payment of the jizya; the sources differ on who received the surrender, on the treaty text and on the year. The Encyclopaedia of Islam says the oldest accounts make the peace with a little-known tribal commander, Khalid ibn Thabit al-Fahmi, and calls the stories of Umar's visit and the terms of the Covenant of Umar later and unreliable. In al-Tabari, Umar came to al-Jabiya and the people of Iliya went out to him seeking safe-conduct {cite:tabari-tarikh-abu-al-fadl j.3 p.607}; the volume's index places the account under the year 15 {cite:tabari-tarikh-abu-al-fadl j.3 p.632}, while the encyclopaedia dates the fall to early 638, the end of 16 or beginning of 17 AH."
  ur: "عمر بن الخطاب کے زمانے میں ایلیاء کے لوگوں نے جزیے پر صلح کر کے شہر مسلمانوں کے حوالے کیا؛ ماخذ اس میں مختلف ہیں کہ سپردگی کس نے قبول کی، معاہدے کا متن کیا تھا اور سال کون سا تھا۔ دائرۃ المعارف اسلامیہ کے مطابق قدیم ترین روایات میں صلح ایک کم معروف قبائلی سالار خالد بن ثابت فہمی سے ہوئی، اور عمر کی آمد اور عہدِ عمری کی شرائط کی روایات متاخر اور ناقابلِ اعتماد ہیں۔ طبری کے ہاں عمر الجابیہ آئے تو ایلیاء کے لوگ امان مانگتے ہوئے نکلے {cite:tabari-tarikh-abu-al-fadl j.3 p.607}؛ جلد کی فہرست اسے سنہ 15 کے تحت رکھتی ہے {cite:tabari-tarikh-abu-al-fadl j.3 p.632}، جبکہ دائرۃ المعارف سقوط کو 638ء کے آغاز، یعنی 16ھ کے اختتام یا 17ھ کے آغاز، میں رکھتا ہے."
