id: event/killing-of-yusuf-al-marwazi
class: event
kind: civil-war
label: { ar: "قتل البطارقة يوسف المروزي", en: "The Patrikioses' Killing of Yusuf al-Marwazi", es: "El asesinato de Yusuf al-Marwazi por los patricios", fr: "L'assassinat de Yusuf al-Marwazi par les Patrikioses" }
summary:
  ar: "عند البلاذري: ولّى المعتصم الحسن بن علي الباذغيسي المعروف بالمأموني الثغر فأهمل بطارقة أرمينية وأحرارها ولين لهم حتى ازدادوا فساداً على السلطان وتكلّباً على من يليهم من الرعية وغلب إسحاق بن إسماعيل بن شعيب مولى بني أمية على جرزان ووثب سهل بن سنباط البطريق على عامل حيدر بن كاوس الأفشين على أرمينية فقتل كاتبه وأفلت بحشاشة نفسه ثم ولّى أرمينية عمال كانوا يقبلون من أهلها العفو ويرضون من خراجها بالميسور؛ ثم ولّى المتوكل يوسف بن محمد بن يوسف المروزي أرمينية لسنتين من خلافته فلما صار بخلاط أخذ بطريقها بقراط بن أشوط فحمله إلى سر من رأى فأوحش البطارقة والأحرار والمتغلبة ذلك منه ثم إنه عمد عامل له يقال له الملاء بن أحمد إلى دير بالسيسجان يعرف بدير الأقداح لم تزل نصارى أرمينية تعظّمه وتهدي إليه فأخذ منه جميع ما كان فيه وعسف أهله فأكبرت البطارقة ذلك وأعظمته وتكاتبت فيه وحضّ بعضها بعضاً على الخلاف والنقض ودسّوا إلى الخويثية وهم عاوج يعرفون بالأزطان في الوثوب بيوسف وحرّضوهم عليه لما كان من حمله بقراط بطريقهم ووجّه كل امرئ منهم ومن المتغلبة خيلاً ورجالاً ليؤيدوهم على ذلك فوثبوا به بطرون وقد فرّق أصحابه في القرى فقتلوه واحتووا على ما كان في عسكره."
  en: "In al-Baladhuri: al-Mu'tasim gave the march to al-Hasan ibn Ali al-Badhaghisi, known as al-Ma'muni, who neglected Armenia's patrikioses and freemen, going soft with them till they worsened in corruption against the sultan and in savaging the subjects beneath them; Ishaq ibn Isma'il ibn Shu'ayb, a mawla of Banu Umayya, mastered Jurzan, and Sahl ibn Sanbat the patrikios ambushed Haydar ibn Kawus al-Afshin's governor over Armenia, killed his scribe, and escaped by a hair; then governors came to Armenia who accepted pardon from its people and contented themselves with easy kharaj; then al-Mutawakkil gave Armenia for two years of his caliphate to Yusuf ibn Muhammad ibn Yusuf al-Marwazi — who at Khilat seized its patrikios Buqrat ibn Ashut and carried him to Samarra, estranging the patrikioses, freemen and warlords; then his agent called al-Mala' ibn Ahmad made for a monastery in Sisajan known as Dayr al-Aqdah, which Armenia's Christians had ever venerated and gifted, took everything in it and brutalised its people — the patrikioses held that enormity unbearable, wrote to one another urging breach and rupture, and sent to the Khwaythiyya — the Aztan — to ambush Yusuf, inciting them over his carrying off their patrikios Buqrat, each man of them and of the warlords sending horse and foot to back it; they ambushed him at Batrun while his men were dispersed among the villages, killed him and seized all that was in his camp."
  es: "En al-Baladhuri: al-Mu'tasim dio la marcha a al-Hasan ibn Ali al-Badhaghisi, conocido como al-Ma'muni, quien descuidó a los patricios y a los hombres libres de Armenia, siendo blando con ellos hasta que empeoraron en su corrupción contra el sultán y en su ataque salvaje a sus súbditos; Ishaq ibn Isma'il ibn Shu'ayb, un mawla de Banu Umayya, dominó a Jurzan, y Sahl ibn Sanbat, los patrikios, tendieron una emboscada al gobernador de Armenia de Haydar ibn Kawus al-Afshin, mataron a su escriba y escapó por un pelo; luego llegaron a Armenia gobernadores que aceptaron el perdón de su pueblo y se contentaron con un kharaj fácil; Entonces al-Mutawakkil le dio Armenia durante dos años de su califato a Yusuf ibn Muhammad ibn Yusuf al-Marwazi, quien en Khilat se apoderó de su patricio Buqrat ibn Ashut y lo llevó a Samarra, enemistando a los patricios, hombres libres y señores de la guerra; luego su agente llamado al-Mala' ibn Ahmad se dirigió a un monasterio en Sisajan conocido como Dayr al-Aqdah, que los cristianos de Armenia siempre habían venerado y al que habían dado ofrendas, tomó todo lo que había en él y brutalizó a su gente; los patricios consideraron esa atrocidad insoportable, se escribieron unos a otros instando a la ruptura y la secesión, y enviaron a los Khwaythiyya —los Aztan— para emboscar a Yusuf, incitándolos por el secuestro de su patricio Buqrat, y cada uno de ellos y de los señores de la guerra envió caballería e infantería para respaldarlo; Le tendieron una emboscada en Batrun mientras sus hombres estaban dispersos entre las aldeas, lo mataron y se apoderaron de todo lo que había en su campamento."
  fr: "À al-Baladhuri: al-Mu'tasim a donné la marche à al-Hasan ibn Ali al-Badhaghisi, connu sous le nom d'al-Ma'muni, qui a négligé les patrikioses et les hommes libres d'Arménie, devenant doux avec eux jusqu'à ce qu'ils s'aggravent dans la corruption contre le sultan et en sauvagerie les sujets sous eux; Ishaq ibn Isma'il ibn Shu'ayb, un mawla de Banu Umayya, maîtrisa Jurzan, et Sahl ibn Sanbat le patrikios tendit une embuscade au gouverneur de Haydar ibn Kawus al-Afshin sur l'Arménie, tua son scribe et s'échappa d'un cheveu; puis des gouverneurs vinrent en Arménie qui acceptèrent le pardon de son peuple et se contentèrent d'un kharaj facile; al-Mutawakkil confia ensuite l'Arménie, pour deux ans de son califat, à Yusuf ibn Muhammad ibn Yusuf al-Marwazi. Ce dernier, à Khilat, s'empara du patriarche Buqrat ibn Ashut et l'emmena à Samarra, s'aliénant ainsi les patriarches, les hommes libres et les chefs de guerre. Son agent, al-Mala' ibn Ahmad, se dirigea alors vers un monastère de Sisajan, connu sous le nom de Dayr al-Aqdah, que les chrétiens d'Arménie avaient toujours vénéré et enrichi. Il prit tout ce qu'il contenait et brutalisa ses habitants. Les patriarches, indignés par cet acte, s'écrivirent pour appeler à la révolte et envoyèrent des hommes aux Khwaythiyya (les Aztan) tendre une embuscade à Yusuf, les incitant à la révolte suite à l'enlèvement de leur patriarche Buqrat. Chacun d'eux, ainsi que les chefs de guerre, envoya des cavaliers et des fantassins pour le soutenir. Ils lui ont tendu une embuscade à Batrun alors que ses hommes étaient dispersés dans les villages, l'ont tué et se sont emparés de tout ce qui se trouvait dans son camp."
