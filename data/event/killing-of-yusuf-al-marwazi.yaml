id: event/killing-of-yusuf-al-marwazi
class: event
kind: civil-war
label: { ar: "قتل البطارقة يوسف المروزي", en: "The Patrikioses' Killing of Yusuf al-Marwazi" }
summary:
  ar: "عند البلاذري: ولّى المعتصم الحسن بن علي الباذغيسي المعروف بالمأموني الثغر فأهمل بطارقة أرمينية وأحرارها ولين لهم حتى ازدادوا فساداً على السلطان وتكلّباً على من يليهم من الرعية وغلب إسحاق بن إسماعيل بن شعيب مولى بني أمية على جرزان ووثب سهل بن سنباط البطريق على عامل حيدر بن كاوس الأفشين على أرمينية فقتل كاتبه وأفلت بحشاشة نفسه ثم ولّى أرمينية عمال كانوا يقبلون من أهلها العفو ويرضون من خراجها بالميسور؛ ثم ولّى المتوكل يوسف بن محمد بن يوسف المروزي أرمينية لسنتين من خلافته فلما صار بخلاط أخذ بطريقها بقراط بن أشوط فحمله إلى سر من رأى فأوحش البطارقة والأحرار والمتغلبة ذلك منه ثم إنه عمد عامل له يقال له الملاء بن أحمد إلى دير بالسيسجان يعرف بدير الأقداح لم تزل نصارى أرمينية تعظّمه وتهدي إليه فأخذ منه جميع ما كان فيه وعسف أهله فأكبرت البطارقة ذلك وأعظمته وتكاتبت فيه وحضّ بعضها بعضاً على الخلاف والنقض ودسّوا إلى الخويثية وهم عاوج يعرفون بالأزطان في الوثوب بيوسف وحرّضوهم عليه لما كان من حمله بقراط بطريقهم ووجّه كل امرئ منهم ومن المتغلبة خيلاً ورجالاً ليؤيدوهم على ذلك فوثبوا به بطرون وقد فرّق أصحابه في القرى فقتلوه واحتووا على ما كان في عسكره."
  en: "In al-Baladhuri: al-Mu'tasim gave the march to al-Hasan ibn Ali al-Badhaghisi, known as al-Ma'muni, who neglected Armenia's patrikioses and freemen, going soft with them till they worsened in corruption against the sultan and in savaging the subjects beneath them; Ishaq ibn Isma'il ibn Shu'ayb, a mawla of Banu Umayya, mastered Jurzan, and Sahl ibn Sanbat the patrikios ambushed Haydar ibn Kawus al-Afshin's governor over Armenia, killed his scribe, and escaped by a hair; then governors came to Armenia who accepted pardon from its people and contented themselves with easy kharaj; then al-Mutawakkil gave Armenia for two years of his caliphate to Yusuf ibn Muhammad ibn Yusuf al-Marwazi — who at Khilat seized its patrikios Buqrat ibn Ashut and carried him to Samarra, estranging the patrikioses, freemen and warlords; then his agent called al-Mala' ibn Ahmad made for a monastery in Sisajan known as Dayr al-Aqdah, which Armenia's Christians had ever venerated and gifted, took everything in it and brutalised its people — the patrikioses held that enormity unbearable, wrote to one another urging breach and rupture, and sent to the Khwaythiyya — the Aztan — to ambush Yusuf, inciting them over his carrying off their patrikios Buqrat, each man of them and of the warlords sending horse and foot to back it; they ambushed him at Batrun while his men were dispersed among the villages, killed him and seized all that was in his camp."
