  es: "A su regreso del Hajj, el arquitecto andalusí Abu Ishaq al-Sahili lo acompañó y construyó la mezquita de Djinguereber en Tombuctú alrededor del año 1327 {cite:tarikh-ibn-khaldun-ibar}."
  fr: "Au retour de Mansa Musa du hajj, l'architecte andalou Abu Ishaq al-Sahili est venu avec lui et a construit la mosquée Djinguereber à Tombouctou vers 1327 {cite:tarikh-ibn-khaldun-ibar}."
