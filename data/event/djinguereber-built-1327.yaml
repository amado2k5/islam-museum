  ar: "لما رجع منسا موسى من الحج رافقه المعمار الأندلسي أبو إسحاق الساحلي وبنى له مسجد جنكريبر بتمبكتو سنة 1327م تقريباً {cite:tarikh-ibn-khaldun-ibar}."
  en: "On Mansa Musa's return from the hajj the Andalusian architect Abu Ishaq al-Sahili came with him and built the Djinguereber mosque at Timbuktu about 1327 {cite:tarikh-ibn-khaldun-ibar}."
