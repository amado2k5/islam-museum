id: event/yazid-ibn-asid-armenia
class: event
kind: other
label: { ar: "ولاية يزيد بن أسيد السلمي لأرمينية", en: "Yazid ibn Asid al-Sulami's Governorship of Armenia", es: "Gobernación de Armenia de Yazid ibn Asid al-Sulami", fr: "Yazid ibn Asid al-Sulami est le gouverneur de l'Arménie", ur: "یزید بن اسید السلمی کی آرمینیا کی گورنر شپ" }
summary:
  ar: "عند البلاذري: ولّى المنصور يزيد بن أسيد السلمي أرمينية ففتح باب اللان ورتّب فيه رابطة من أهل الديوان ودوّخ الصنارية حتى أذعنوا بإعطاء الخراج فكتب إليه المنصور يأمره بمصاهرة ملك الخزر ففعل وولدت له ابنته ابناً فمات وماتت في نفاسها، وبعث يزيد إلى نقّاطة أرض شروان وملّاحاتها فجباها ووكّل به، وبنى يزيد مدينة أرجيل الصغرى ومدينة أرجيل الكبرى وأنزلهما أهل فلسطين؛ ويُروى عن جماعة من مشايخ أهل برذعة أن الشماخية التي في عمل شروان نُسبت إلى الشماخ بن شجاع وكان ملك شروان في ولاية سعيد بن سام الباهلي أرمينية."
  en: "In al-Baladhuri: al-Mansur gave Armenia to Yazid ibn Asid al-Sulami, who opened Bab al-Lan, stationed there a ribat of diwan men, and tamed the Sanariyya till they submitted to kharaj; al-Mansur wrote ordering him to marry into the Khazar king's family — he did so, the Khaqan's daughter bearing him a son who died while she died in her lying-in; Yazid sent to Shirwan's salt-source and salt-pans, taxed them and set a deputy over it; he built the city of Arjil the Lesser and Arjil the Greater, settling Palestine's people in them; and it is told from a body of Bardha'a's shaykhs that al-Shamakhiyya in Shirwan's district was named for al-Shamakh ibn Shuja', who was king of Shirwan in Sa'id ibn Sam al-Bahili's governorship of Armenia."
  es: "En al-Baladhuri: al-Mansur le dio Armenia a Yazid ibn Asid al-Sulami, quien abrió Bab al-Lan, estableció allí un ribat de hombres diwan y sometió a los Sanariyya hasta que se sometieron a kharaj; al-Mansur escribió ordenándole que se casara con la familia del rey jázaro; así lo hizo, la hija del Khaqan le dio un hijo que murió mientras ella moría en su parto; Yazid envió a la fuente de sal y a las salinas de Shirwan, las gravó y puso un lugarteniente sobre ellas; construyó la ciudad de Arjil el Menor y Arjil el Mayor, asentando en ellas al pueblo de Palestina; y se dice de un grupo de shaykhs de Bardha'a que al-Shamakhiyya en el distrito de Shirwan recibió su nombre de al-Shamakh ibn Shuja', quien fue rey de Shirwan durante el gobierno de Sa'id ibn Sam al-Bahili en Armenia."
  fr: "Dans al-Baladhuri: al-Mansur donna l’Arménie à Yazid ibn Asid al-Sulami, qui ouvrit Bab al-Lan, y installa un ribat d’hommes du diwan et soumit les Sanariyya jusqu’à ce qu’ils se soumettent au kharaj; al-Mansur lui ordonna d’épouser une femme de la famille du roi khazar – ce qu’il fit, la fille du Khaqan lui donnant un fils qui mourut pendant qu’elle gisait sur son lit de mort; Yazid envoya des émissaires à la source de sel et aux marais salants de Shirwan, les taxa et y nomma un représentant; il fit construire les villes d’Arjil la Petite et d’Arjil la Grande, y installant les habitants de Palestine; et il est rapporté par un groupe de cheikhs de Bardha’a qu’al-Shamakhiyya, dans le district de Shirwan, fut nommée en l’honneur d’al-Shamakh ibn Shuja’, qui était roi de Shirwan sous le gouvernement arménien de Sa’id ibn Sam al-Bahili."
  ur: "البلادھوری میں ہے: المنصور نے آرمینیا کو یزید بن اسید السلمی کو دے دیا، جس نے باب الان کو کھولا، وہاں دیوان والوں کا ایک رباط تعینات کیا، اور سناریہ کو اس وقت تک قابو میں رکھا جب تک کہ وہ خرج کے تابع نہ رہے۔ المنصور نے اسے خزر بادشاہ کے خاندان میں شادی کرنے کا حکم دیتے ہوئے لکھا - اس نے ایسا کیا، خاقان کی بیٹی نے اس کے لیے ایک بیٹا پیدا کیا جو اس وقت مر گیا جب وہ اس کے لیٹے ہوئے مر گئی۔ یزید نے شیروان کے نمکین اور نمک کے برتنوں کو بھیجا، ان پر ٹیکس لگا کر اس پر ایک نائب مقرر کیا۔ اس نے ارجیل دی لیزر اور ارجیل دی گریٹر کا شہر بنایا، ان میں فلسطین کے لوگوں کو بسایا۔ اور بردعا کے شیوخ کی ایک جماعت سے بتایا گیا ہے کہ ضلع شیروان میں الشمخیہ کا نام الشمخ ابن شجاع کے نام پر رکھا گیا تھا جو سعید بن سام الباہلی کی آرمینیا کی گورنری میں شیروان کا بادشاہ تھا۔"
