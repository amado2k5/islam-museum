id: event/kami-ibn-abi-dhira-carries-ibn-humayds-consultation-to-banu-al-harith-295
class: event
kind: other
label:
  ar: "الكمي بن أبي ذراع يحمل مشورة ابن حميد إلى بني الحارث، ثم يفر ابن حميد إلى سوحسان، 295هـ"
  en: "Al-Kami ibn Abi Dhira' carries Ibn Humayd's consultation to Banu al-Harith, and Ibn Humayd withdraws to Sawhan, 295 AH, pp. 362-363"
  ur: "الکمی بن ابی ذراع کا ابن حمید کی مشاورت بنو حارث تک لے جانا، اور ابن حمید کا سوحسان کی طرف پسپائی، 295ھ، ص362-363"
  es: "Al-Kami ibn Abi Dhira' lleva la consulta de Ibn Humayd a Banu al-Harith, e Ibn Humayd se retira a Sawhan, 295 AH, pp. 362-363."
  fr: "Al-Kami ibn Abi Dhira' rapporte la consultation d'Ibn Humayd aux Banu al-Harith, et Ibn Humayd se retire à Sawhan, 295 AH, pp. 362-363"
summary:
  ar: "بعد عيد الأضحى أرسل ابن حميد الكمي بن أبي ذراع الأوتري من موضع النَّخل إلى بني الحارث يستشيرهم في الحَدَث. فأجابوه إلى ما طلب، ووجدهم في طلب الحَدَث أشد منه، فرجع إليه بالخبر، ففر ابن حميد إلى نجران ونزل بسوحسان في عشرين فارساً وخمسين راجلاً."
  en: "After the Eid al-Adha, Ibn Humayd sent al-Kami ibn Abi Dhira' al-Awtari from al-Nakhl, three days from Najran, to consult Banu al-Harith about the disturbance. They gave him the answer he asked for, and he found them keener than Ibn Humayd to pursue it. Ibn Humayd then withdrew to Najran and lodged at Sawhan with twenty horsemen and fifty foot soldiers."
  ur: "عید الاضحیٰ کے بعد ابن حمید نے کمی بن ابی ذراع الاوتری کو نخل سے، جو نجران سے تین دن کی مسافت پر ہے، بنو حارث کے پاس بھیجا تاکہ اس واقعے کے بارے میں ان سے مشورہ کرے۔ انہوں نے وہی جواب دیا جو وہ چاہتا تھا، اور وہ ابن حمید سے بھی بڑھ کر اس معاملے کے پیچھے لگے ہوئے نظر آئے۔ ابن حمید نجران کی طرف لوٹ گیا اور سوحسان میں بیس گھڑسوار اور پچاس پیادوں کے ساتھ ٹھہرا۔"
  es: "Tras el Eid al-Adha, Ibn Humayd envió a al-Kami ibn Abi Dhira' al-Awtari desde al-Nakhl, a tres días de Najrán, para consultar a los Banu al-Harith sobre el disturbio. Le dieron la respuesta que buscaba, y Ibn Humayd los encontró más interesados que él en investigar el asunto. Entonces, Ibn Humayd se retiró a Najrán y se alojó en Sawhan con veinte jinetes y cincuenta soldados de infantería."
  fr: "Après l'Aïd al-Adha, Ibn Humayd envoya al-Kami ibn Abi Dhira' al-Awtari d'al-Nakhl, à trois jours de Najran, consulter les Banu al-Harith au sujet des troubles. Ils lui donnèrent la réponse qu'il attendait et il les trouva plus déterminés qu'Ibn Humayd à approfondir la question. Ibn Humayd se retira alors à Najran et s'installa à Sawhan avec vingt cavaliers et cinquante fantassins."
