id: event/deathbed-and-burial-of-sad-ibn-muadh
class: event
kind: death
label:
  ar: احتضار سعد بن معاذ ودفنه بالبقيع بعد الخندق
  en: Last days, death and burial of Sad ibn Muadh after the Trench
  ur: خندق کے بعد سعد بن معاذ کے آخری ایام، وفات اور تدفین
  es: "Últimos días, muerte y entierro de Sad ibn Muadh tras la trinchera."
  fr: "Derniers jours, décès et enterrement de Sad ibn Muadh après la bataille du Fossé"
summary:
  ar: "أُصيب سعد بن معاذ في أكحله يوم الخندق، فدعا الله ألا يميته حتى يقرّ عينه من بني قريظة، وضُربت له خيمة في المسجد ليعوده النبي {cite:ibn-hisham-sira scan p. 459} {cite:sahih-al-bukhari 4122}. ولما نزلت قريظة على حكمه حُمل على حمار فأشار بقتل مقاتلتهم وسبي ذراريهم وقسمة أموالهم، فقال النبي إنه حكم بحكم الله {cite:siyar-alam-nubala scan vol. 1 p. 220} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278}. ثم انفجر جرحه فمات في السنة الخامسة بعد الخندق بنحو شهر، وروي أن العرش اهتز لموته وأن الملائكة حملت جنازته {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278} {cite:sahih-al-bukhari 3803} {cite:siyar-alam-nubala scan vol. 1 p. 221}. وروى الواقدي أنه دُفن بالبقيع عند دار عقيل ونزل في قبره أربعة وصلى عليه النبي {cite:al-waqidi-maghazi scan vol. 1 p. 528} {cite:al-waqidi-maghazi scan vol. 1 p. 529}."
  en: "Sad ibn Muadh was struck in the arm vein on the day of the Trench; he prayed that God not let him die until He had cooled his eyes over Banu Qurayza, and a tent was pitched in the mosque so that the Prophet could visit him {cite:ibn-hisham-sira scan p. 459} {cite:sahih-al-bukhari 4122}. When Qurayza surrendered to his judgement he was carried on a donkey and advised killing their fighters, taking their offspring captive and dividing their property; the Prophet said he had judged by God's judgement {cite:siyar-alam-nubala scan vol. 1 p. 220} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278}. His wound then burst and he died in year 5, about a month after the Trench; it is reported that the Throne shook at his death and that angels carried his bier {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278} {cite:sahih-al-bukhari 3803} {cite:siyar-alam-nubala scan vol. 1 p. 221}. Al-Waqidi relays that he was buried in al-Baqi near the house of Aqil, four men went down into the grave and the Prophet prayed over him {cite:al-waqidi-maghazi scan vol. 1 p. 528} {cite:al-waqidi-maghazi scan vol. 1 p. 529}."
  ur: "غزوۂ خندق کے دن سعد بن معاذ کی بازو کی رگ پر تیر لگا؛ انھوں نے دعا کی کہ اللہ انھیں اس وقت تک موت نہ دے جب تک بنو قریظہ کے معاملے میں ان کی آنکھیں ٹھنڈی نہ کر دے، اور مسجد میں ان کے لیے خیمہ لگایا گیا تاکہ نبی ان کی عیادت کر سکیں {cite:ibn-hisham-sira scan p. 459} {cite:sahih-al-bukhari 4122}. جب قریظہ ان کے فیصلے پر اترے تو انھیں گدھے پر لایا گیا اور انھوں نے مشورہ دیا کہ ان کے جنگجو قتل ہوں، اولاد قید ہو اور مال تقسیم ہو؛ نبی نے فرمایا کہ انھوں نے اللہ کے حکم کے مطابق فیصلہ کیا {cite:siyar-alam-nubala scan vol. 1 p. 220} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278}. پھر ان کا زخم پھٹ گیا اور وہ خندق کے تقریباً ایک ماہ بعد پانچ ہجری میں فوت ہوئے؛ روایت ہے کہ ان کی موت پر عرش ہلا اور فرشتوں نے ان کا جنازہ اٹھایا {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278} {cite:sahih-al-bukhari 3803} {cite:siyar-alam-nubala scan vol. 1 p. 221}. واقدی نقل کرتے ہیں کہ وہ بقیع میں دارِ عقیل کے پاس دفن ہوئے، چار آدمی قبر میں اترے اور نبی نے نماز پڑھائی {cite:al-waqidi-maghazi scan vol. 1 p. 528} {cite:al-waqidi-maghazi scan vol. 1 p. 529}."
  es: "Sad ibn Muadh fue alcanzado en la vena del brazo el día de la Trinchera; oró para que Dios no lo dejara morir hasta que Él hubiera enfriado sus ojos sobre Banu Qurayza, y se levantó una tienda en la mezquita para que el Profeta pudiera visitarlo {cite:ibn-hisham-sira scan p. 459} {cite:sahih-al-bukhari 4122}. Cuando Qurayza se rindió a su juicio, fue llevado en un burro y se le aconsejó matar a sus combatientes, tomar a sus hijos cautivos y dividir sus propiedades; el Profeta dijo que había juzgado por el juicio de Dios {cite:siyar-alam-nubala scan vol. 1 p. 220} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278}. Su herida luego se abrió y murió en el año 5, aproximadamente un mes después de la Trinchera; Se informa que el Trono tembló a su muerte y que los ángeles llevaron su féretro {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278} {cite:sahih-al-bukhari 3803} {cite:siyar-alam-nubala scan vol. 1 p. 221}. Al-Waqidi relata que fue enterrado en al-Baqi cerca de la casa de Aqil, cuatro hombres bajaron a la tumba y el Profeta oró sobre él {cite:al-waqidi-maghazi scan vol. 1 p. 528} {cite:al-waqidi-maghazi scan vol. 1 p. 529}."
  fr: "Sad ibn Muadh fut blessé à la veine du bras le jour de la bataille du Fossé. Il pria Dieu de ne pas le laisser mourir avant qu'Il n'ait apaisé son chagrin envers les Banu Qurayza. Une tente fut dressée dans la mosquée afin que le Prophète puisse lui rendre visite (Ibn Hisham Sira, p. 459; Sahih al-Bukhari, p. 4122). Lorsque les Qurayza se soumirent à son jugement, il fut transporté sur un âne et reçut le conseil de tuer leurs guerriers, de faire prisonniers leurs enfants et de partager leurs biens. Le Prophète déclara qu'il avait jugé selon la volonté divine (Siyar Alam Nubala, vol. 1, p. 220; Isti Ab ibn Abd al-Barr, vol. 3, p. 278). Sa blessure s'ouvrit alors et il mourut la cinquième année, environ un mois après la bataille du Fossé. Il est rapporté que le Trône trembla à sa mort et que des anges portèrent son cercueil {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 278} {cite:sahih-al-bukhari 3803} {cite:siyar-alam-nubala scan vol. 1 p. 221}. Al-Waqidi rapporte qu'il fut enterré à al-Baqi, près de la maison d'Aqil, que quatre hommes descendirent dans la tombe et que le Prophète pria sur lui {cite:al-waqidi-maghazi scan vol. 1 p. 528} {cite:al-waqidi-maghazi scan vol. 1 p. 529}."
