label:
  ar: "مشيخة دار الحديث الأشرفية والنورية بدمشق، ١٧ ربيع الأول ٧٤٠هـ"
  en: "Shaykh of the Ashrafiyya and Nuriyya hadith schools, Damascus, 17 Rabi' I 740"
  ur: "دار الحدیث اشرفیہ اور نوریہ دمشق کی شیخت، 17 ربیع الاول 740ھ"
  es: "Shaykh de las escuelas de hadices Ashrafiyya y Nuriyya, Damasco, 17 Rabi' I 740"
  fr: "Cheikh des écoles de hadiths d'Achrafiyya et de Nouriyya, Damas, 17 Rabi' I 740"
  tr: "Şam'daki Dar el-Hadis el-Eşrefiyye ve el-Nuriyye Şeyhliği, 17 Rebi'ül-Evvel 740 H."
  id: "Syekh Dar al-Hadits al-Ashrafiyya dan al-Nuriyya di Damaskus, 17 Rabi' al-Awwal 740 H"
summary:
  ar: "في يوم الأربعاء ١٧ ربيع الأول ٧٤٠هـ حضر قاضي القضاة تقي الدين السبكي بدار الحديث الأشرفية بدمشق عوضاً عن الحافظ جمال الدين المزي، وباشر أيضاً مشيخة دار الحديث النورية عوضاً عن ابنه {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}."
  en: "On Wednesday 17 Rabi' I 740 chief qadi Taqi al-Din al-Subki took up the shaykhhood of the Ashrafiyya hadith school in Damascus in succession to the hafiz Jamal al-Din al-Mizzi, and also assumed the Nuriyya hadith school in place of al-Mizzi's son {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}."
  ur: "بدھ 17 ربیع الاول 740ھ کو قاضی القضاة تقی الدین سبکی نے دمشق کی دار الحدیث اشرفیہ کی شیخت حافظ جمال الدین مزی کی جگہ سنبھالی اور دار الحدیث نوریہ کی شیخت ان کے بیٹے کی جگہ لی {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}۔"
  es: "El miércoles 17, Rabi' I 740, el cadí jefe Taqi al-Din al-Subki asumió el cargo de shaykh de la escuela de hadices Ashrafiyya en Damasco en sucesión del hafiz Jamal al-Din al-Mizzi, y también asumió la escuela de hadices Nuriyya en lugar del hijo de al-Mizzi {citar:al-bidaya-wal-nihaya sa 740 p. 204}."
  fr: "Le mercredi 17 Rabi' I 740, le cadi en chef Taqi al-Din al-Subki a pris la direction de l'école de hadiths d'Achrafiyya à Damas en succession au hafiz Jamal al-Din al-Mizzi, et a également assumé l'école de hadiths de Nuriyya à la place du fils d'al-Mizzi {cite: al-bidaya-wal-nihaya sa 740 p. 204}."
  tr: "Hicri 740 yılının Rebiü'l-Evvel ayının 17. Çarşamba günü, Başyargıç Takîddin el-Subki, Hafız Cemal el-Din el-Mizzi'nin yerine Şam'daki Eşrafiyye Hadis Evi'ne katıldı ve ayrıca oğlunun yerine Nuriyye Hadis Evi'nin liderliğini devraldı. {cite:al-bidaya-wal-nihaya sa 740 s. 204}"
  id: "Pada hari Rabu, tanggal 17 Rabi’ al-Awwal, 740 H, Ketua Mahkamah Agung Taqi al-Din al-Subki menghadiri Majelis Hadits Ashrafiyya di Damaskus, menggantikan al-Hafiz Jamal al-Din al-Mizzi, dan juga mengambil alih kepemimpinan Majelis Hadits Nuriyya, menggantikan putranya. {cite:al-bidaya-wal-nihaya sa 740 p. 204}."
