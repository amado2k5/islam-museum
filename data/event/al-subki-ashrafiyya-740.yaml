  en: "Shaykh of the Ashrafiyya and Nuriyya hadith schools, Damascus, 17 Rabi' I 740"
  ur: "دار الحدیث اشرفیہ اور نوریہ دمشق کی شیخت، 17 ربیع الاول 740ھ"
summary:
  ar: "في يوم الأربعاء ١٧ ربيع الأول ٧٤٠هـ حضر قاضي القضاة تقي الدين السبكي بدار الحديث الأشرفية بدمشق عوضاً عن الحافظ جمال الدين المزي، وباشر أيضاً مشيخة دار الحديث النورية عوضاً عن ابنه {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}."
  en: "On Wednesday 17 Rabi' I 740 chief qadi Taqi al-Din al-Subki took up the shaykhhood of the Ashrafiyya hadith school in Damascus in succession to the hafiz Jamal al-Din al-Mizzi, and also assumed the Nuriyya hadith school in place of al-Mizzi's son {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}."
  ur: "بدھ 17 ربیع الاول 740ھ کو قاضی القضاة تقی الدین سبکی نے دمشق کی دار الحدیث اشرفیہ کی شیخت حافظ جمال الدین مزی کی جگہ سنبھالی اور دار الحدیث نوریہ کی شیخت ان کے بیٹے کی جگہ لی {cite:al-bidaya-wal-nihaya s.a. 740 p. 204}۔"
