label: { ar: "أول غزوة لصقلية وسبي عبد الله بن قيس لها", en: "The First Raid on Sicily and Abdallah ibn Qays's Plunder" }
summary:
  ar: "عند البلاذري: غزا معاوية بن حديج الكندي أيام معاوية بن أبي سفيان صقلية وكان أول من غزاها ولم تزل تُغزى بعد ذلك. وقال الواقدي: سبى عبد الله بن قيس بن مخلد الدزقي صقلية فأصاب أصنام ذهب وفضة مكللة بالجوهر فبعث بها إلى معاوية فوجّه بها معاوية إلى البصرة لتحمل إلى الهند فتباع هناك ليثمن بها."
  en: "In al-Baladhuri: Mu'awiya ibn Khudayj al-Kindi raided Sicily in Mu'awiya ibn Abi Sufyan's days — the first to raid it — and it kept being raided thereafter. Al-Waqidi said: Abdallah ibn Qays ibn Mukhallad al-Dazzaqi plundered Sicily, taking gold and silver idols crowned with jewels which he sent to Mu'awiya, who forwarded them to Basra to be carried to India and sold there for their price."
