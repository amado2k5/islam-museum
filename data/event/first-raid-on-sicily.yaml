label: { ar: "أول غزوة لصقلية وسبي عبد الله بن قيس لها", en: "The First Raid on Sicily and Abdallah ibn Qays's Plunder", es: "El primer ataque a Sicilia y el saqueo de Abdallah ibn Qays", fr: "Le premier raid sur la Sicile et le butin d'Abdallah ibn Qays", ur: "سسلی پر پہلا حملہ اور عبداللہ بن قیس کی لوٹ مار", tr: "Sicilya'nın ilk işgali ve orada Abdullah ibn Qais'in yakalanması", id: "Invasi pertama ke Sisilia dan penangkapan Abdullah ibn Qais di sana." }
summary:
  ar: "عند البلاذري: غزا معاوية بن حديج الكندي أيام معاوية بن أبي سفيان صقلية وكان أول من غزاها ولم تزل تُغزى بعد ذلك. وقال الواقدي: سبى عبد الله بن قيس بن مخلد الدزقي صقلية فأصاب أصنام ذهب وفضة مكللة بالجوهر فبعث بها إلى معاوية فوجّه بها معاوية إلى البصرة لتحمل إلى الهند فتباع هناك ليثمن بها."
  en: "In al-Baladhuri: Mu'awiya ibn Khudayj al-Kindi raided Sicily in Mu'awiya ibn Abi Sufyan's days — the first to raid it — and it kept being raided thereafter. Al-Waqidi said: Abdallah ibn Qays ibn Mukhallad al-Dazzaqi plundered Sicily, taking gold and silver idols crowned with jewels which he sent to Mu'awiya, who forwarded them to Basra to be carried to India and sold there for their price."
  es: "En al-Baladhuri: Mu'awiya ibn Khudayj al-Kindi saqueó Sicilia en tiempos de Mu'awiya ibn Abi Sufyan —el primero en saquearla— y continuó siendo saqueada a partir de entonces. Al-Waqidi dijo: Abdallah ibn Qays ibn Mukhallad al-Dazzaqi saqueó Sicilia, llevándose ídolos de oro y plata coronados con joyas que envió a Mu'awiya, quien los envió a Basora para que fueran llevados a la India y vendidos allí por su valor."
  fr: "Selon al-Baladhuri: Mu'awiya ibn Khudayj al-Kindi a mené un raid en Sicile du temps de Mu'awiya ibn Abi Sufyan – le premier à le faire – et les pillages se sont poursuivis par la suite. Al-Waqidi rapporte: Abdallah ibn Qays ibn Mukhallad al-Dazzaqi a pillé la Sicile, emportant des idoles d'or et d'argent couronnées de pierres précieuses qu'il a envoyées à Mu'awiya. Ce dernier les a expédiées à Bassora pour qu'elles soient acheminées en Inde et vendues à leur juste valeur."
  ur: "البلادوری میں ہے: معاویہ ابن خدیج الکندی نے معاویہ ابن ابی سفیان کے زمانے میں سسلی پر چھاپہ مارا - جس نے سب سے پہلے اس پر چھاپہ مارا - اور اس کے بعد اس پر چھاپہ مارا جاتا رہا۔ الواقدی نے کہا: عبداللہ بن قیس ابن مخلد الدزاقی نے سسلی کو لوٹ لیا، سونے اور چاندی کے بت زیورات سے مزین لے کر معاویہ کے پاس بھیجے، جس نے انہیں ہندوستان لے جانے کے لیے بصرہ بھیج دیا اور وہاں ان کی قیمت پر بیچ دیا۔"
  tr: "El-Baladhuri'ye göre: Mu'aviye ibn Hudeyc el-Kindi, Mu'aviye ibn Abi Sufyan'ın hükümdarlığı döneminde Sicilya'yı fethetti ve burayı fetheden ilk kişi oldu. Bundan sonra da fethedilmeye devam etti. El-Vakidi şöyle dedi: Abdullah ibn Kays ibn Mukhallad el-Dazqi, Sicilya'yı ele geçirdi ve mücevherlerle süslenmiş altın ve gümüş putları ele geçirdi. Bunları Mu'aviye'ye gönderdi, o da bunları Basra'ya göndererek Hindistan'a taşınmasını ve orada değerleri üzerinden satılmasını sağladı."
  id: "Menurut al-Baladhuri: Mu'awiya ibn Hudayj al-Kindi menaklukkan Sisilia pada masa pemerintahan Mu'awiya ibn Abi Sufyan, dan dialah yang pertama menaklukkannya. Penaklukan terus berlanjut setelah itu. Al-Waqidi berkata: Abdullah ibn Qays ibn Mukhallad al-Dazqi merebut Sisilia dan menyita berhala-berhala emas dan perak yang dihiasi permata. Dia mengirimkannya kepada Mu'awiya, yang kemudian mengirimkannya ke Basra untuk diangkut ke India dan dijual di sana sesuai nilainya."
