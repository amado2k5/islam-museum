label:
  ar: "ولادة الثعالبي بنيسابور، ٣٥٠هـ"
  en: "Al-Tha'alibi is born at Nishapur, 350/961"
  ur: "ثعالبی کی ولادت نیشاپور میں، 350ھ/961ء"
summary:
  ar: "وُلد أبو منصور عبد الملك بن محمد بن إسماعيل الثعالبي النيسابوري سنة خمسين وثلاثمائة بنيسابور {cite:wafayat-ayan}، المدينة التي صارت في جيله منافساً ثقافياً لبغداد {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}؛ وذكر ابن العماد أنه عاش ثمانين سنة {cite:shadharat-dhahab p. 246-247}."
  en: "Abu Mansur Abd al-Malik ibn Muhammad ibn Isma'il al-Tha'alibi was born in 350 AH at Nishapur {cite:wafayat-ayan}, the city that in his generation became a cultural rival to Baghdad {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}; Ibn al-Imad notes he lived eighty years {cite:shadharat-dhahab p. 246-247}."
  ur: "ابو منصور عبدالملک بن محمد بن اسماعیل ثعالبی 350ھ میں نیشاپور میں پیدا ہوئے {cite:wafayat-ayan} — وہ شہر جو ان کے دور میں بغداد کا علمی حریف بن گیا {cite:encyclopaedia-of-islam-2 vol. 10 p. 450}؛ ابن عماد کے مطابق وہ اسی برس جیے {cite:shadharat-dhahab p. 246-247}۔"
