label: { ar: "ظهور أبي عبد الله الشيعي بالمغرب", en: "The Appearance of Abu Abd Allah al-Shi'i in the Maghreb", fr: "L’apparition d’Abu Abd Allah al-Shi'i au Maghreb", es: "La aparición de Abu Abd Allah al-Shi'i en el Magreb", ur: "ابو عبد اللہ الشیعی کا مغرب میں ظہور", tr: "Ebu Abdullah el-Şii'nin Fas'ta ortaya çıkışı", id: "Kemunculan Abu Abdullah al-Shi'i di Maroko" }
summary:
  ar: "في سنة ثمان وثمانين ظهر أبو عبد الله الشيعي بالمغرب فدعا قبيلة كتامة إلى الإمام المهدي فاستجابوا فهذا أول ظهور العبيدية الذين صاروا ملوك ديار مصر {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  en: "In 288 Abu Abd Allah al-Shi'i appeared in the Maghreb calling the tribe of Kutama to the Imam al-Mahdi — they answered: the first emergence of the Ubaydids who became kings of Egypt {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  fr: "En 288, Abu Abd Allah al-Shi'i apparut au Maghreb, appelant la tribu des Kutama à l’imam al-Mahdi ; ils répondirent à son appel : ce fut la première manifestation des Ubaydides, qui devinrent les souverains de l’Égypte {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  es: "En 288 Abu Abd Allah al-Shi'i apareció en el Magreb llamando a la tribu de Kutama al Imam al-Mahdi; ellos respondieron: el primer surgimiento de los Ubaydids que se convirtieron en reyes de Egipto {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  ur: "288 میں ابو عبد اللہ الشیعی مغرب میں قطاما کے قبیلے کو امام مہدی کی طرف بلاتے ہوئے نمودار ہوئے - انہوں نے جواب دیا: عبیدیوں کا پہلا خروج جو مصر کے بادشاہ بنے {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 576}۔"
  tr: "MS 88 yılında Ebu Abdullah el-Şii Fas'ta ortaya çıktı ve Kutama kabilesini İmam el-Mehdi'ye çağırdı ve onlar da karşılık verdiler. Bu, Mısır kralları olan Ubeydidlerin ilk ortaya çıkışıydı. {cite:tarikh-khulafa-minhaj-1434 s. 576}"
  id: "Pada tahun 88, Abu Abdullah al-Shi’i muncul di Maroko dan menyeru suku Kutama kepada Imam al-Mahdi, dan mereka menanggapi seruan tersebut. Inilah kemunculan pertama Dinasti Ubaydid, yang kemudian menjadi raja-raja Mesir. {cite:tarikh-khulafa-minhaj-1434 p. 576}."
