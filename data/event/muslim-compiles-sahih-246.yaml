id: event/muslim-compiles-sahih-246
class: event
kind: publication
label:
  ar: "مسلم بن الحجاج يصنّف الجامع الصحيح في خمس عشرة سنة، نحو ٢٤٦-٢٦١هـ"
  en: "Muslim ibn al-Hajjaj compiles the Jami' al-Sahih over fifteen years, c. 246-261/860-875"
  ur: "مسلم بن حجاج نے پندرہ برس میں جامع صحیح مرتب کیا، تقریباً 246-261ھ/860-875ء"
  es: "Muslim ibn al-Hajjaj compila el Jami' al-Sahih a lo largo de quince años, c. 246-261/860-875."
  fr: "Muslim ibn al-Hajjaj compile le Jami' al-Sahih sur une période de quinze ans, vers 246-261/860-875."
  tr: "Müslim ibn el-Haccac, Sahih külliyatını yaklaşık 246-261 Hicri yılları arasında, on beş yıldan fazla bir sürede derlemiştir."
  id: "Muslim ibn al-Hajjaj menyusun koleksi Sahih selama lebih dari lima belas tahun, sekitar tahun 246-261 Hijriah."
summary:
  ar: "قال محمد بن الماسرجسي إنه سمع مسلماً يقول إنه صنّف هذا الصحيح من ثلاثمائة ألف حديث مسموعة، وقال أحمد بن سلمة إنه كتب مع مسلم في صحيحه خمس عشرة سنة وهو نحو أربعة آلاف حديث {cite:tazkirat-al-huffaz j.2 p. 527}؛ وهو «الجامع الصحيح» الذي أجمع أهل الحديث أنه مع صحيح البخاري أصحّ الكتب، وعدّه محررها الحديث محمد فؤاد عبد الباقي ما يزيد قليلاً على ثلاثة آلاف حديث مختلف {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  en: "Muhammad ibn al-Masirjisi heard Muslim say that he compiled this Sahih from three hundred thousand hadiths he had heard, and Ahmad ibn Salama says he worked with Muslim on the Sahih for fifteen years, the book running to about four thousand hadiths {cite:tazkirat-al-huffaz j.2 p. 527}; it is the Jami' al-Sahih, which the traditionists agree stands with al-Bukhari's Sahih as the soundest of books, and its modern editor Muhammad Fu'ad Abd al-Baqi counts a little over three thousand distinct traditions {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  ur: "محمد بن ماسرجسی نے مسلم کو کہتے سنا کہ انہوں نے یہ صحیح تین لاکھ مسموعہ احادیث سے مرتب کی، اور احمد بن سلمہ کہتے ہیں کہ وہ صحیح پر مسلم کے ساتھ پندرہ برس لکھتے رہے اور یہ تقریباً چار ہزار احادیث پر مشتمل ہے {cite:tazkirat-al-huffaz j.2 p. 527}؛ یہی «جامع صحیح» ہے جسے محدثین صحیح بخاری کے ساتھ صحیح ترین کتاب قرار دیتے ہیں، اور اس کے جدید مدون محمد فواد عبدالباقی کے شمار میں تین ہزار سے کچھ زیادہ متماثل احادیث ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}۔"
  es: "Muhammad ibn al-Masirjisi escuchó a Muslim decir que compiló este Sahih a partir de trescientos mil hadices que había escuchado, y Ahmad ibn Salama dice que trabajó con Muslim en el Sahih durante quince años, el libro consta de unos cuatro mil hadices {cite:tazkirat-al-huffaz j.2 p. 527}; es el Jami' al-Sahih, que los tradicionalistas coinciden en que se sitúa junto con el Sahih de al-Bukhari como el más sólido de los libros, y su editor moderno Muhammad Fu'ad Abd al-Baqi cuenta un poco más de tres mil tradiciones distintas {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  fr: "Muhammad ibn al-Masirjisi a entendu Muslim dire qu'il avait compilé ce Sahih à partir de trois cent mille hadiths qu'il avait entendus, et Ahmad ibn Salama dit avoir travaillé avec Muslim sur le Sahih pendant quinze ans, le livre comptant environ quatre mille hadiths {cite:tazkirat-al-huffaz j.2 p. 527}; il s'agit du Jami' al-Sahih, que les traditionnistes considèrent, avec le Sahih d'al-Bukhari, comme l'ouvrage le plus fiable, et son éditeur moderne, Muhammad Fu'ad Abd al-Baqi, dénombre un peu plus de trois mille traditions distinctes {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  tr: "Muhammed ibn el-Masarjisi, Müslim'in bu Sahih'i üç yüz bin hadisten derlediğini söylediğini işittiğini belirtmiştir. Ahmed ibn Seleme ise Müslim ile birlikte Sahih'i yazmak için on beş yıl çalıştığını ve bunun yaklaşık dört bin hadis içerdiğini söylemiştir (kaynak: Tezkirat el-Huffaz, cilt 2, s. 527). Bu eser, hadis âlimlerinin Sahih el-Buhari ile birlikte en sahih kitap olarak kabul ettiği \"el-Cami' el-Sahih\"tir. Editörü hadis âlimi Muhammed Fuad Abd el-Baki, eserin üç binden biraz fazla farklı hadis içerdiğini belirtmiştir (kaynak: İslam Ansiklopedisi 2, cilt 7, s. 690-692)."
  id: "Muhammad ibn al-Masarjisi mengatakan bahwa ia mendengar Muslim mengatakan bahwa ia menyusun kitab Sahih ini dari tiga ratus ribu hadits yang didengar. Ahmad ibn Salamah mengatakan bahwa ia menulis kitab Sahih ini bersama Muslim selama lima belas tahun dan isinya sekitar empat ribu hadits {cite:tazkirat-al-huffaz j.2 p. 527}; dan kitab ini adalah “al-Jami’ al-Sahih” yang menurut para ahli hadits, bersama dengan Sahih al-Bukhari, merupakan kitab yang paling otentik. Penyuntingnya, ulama hadits Muhammad Fuad Abd al-Baqi, menghitungnya sedikit lebih dari tiga ribu hadits yang berbeda {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
