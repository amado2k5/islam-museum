label: { ar: "مصرع الأغلب بن سالم بسهم ودحر حريش", en: "al-Aghlab ibn Salim's Death by an Arrow and Harish's Rout", es: "La muerte de al-Aghlab ibn Salim por una flecha y la derrota de Harish", fr: "La mort d'al-Aghlab ibn Salim par une flèche et la déroute de Harish", ur: "اغلب بن سلیم کی ایک تیر سے موت اور حارث کی شکست", tr: "El-Ağlab bin Salim bir okla öldürüldü ve Hariş mağlup oldu.", id: "Al-Aghlab bin Salem tewas terkena panah, dan Harish dikalahkan." }
summary:
  ar: "عند البلاذري عن أحمد بن نافع مولى بني الأغلب: كان الأغلب بن سالم التميمي من أهل مرو الروذ فيمن قدم مع الدعاة العباسيين من خراسان فولّاه موسى الهادي المغرب فجمع له حريش — وهو رجل كان من جند الثغر من تونس — جمعاً وسار إليه وهو بقيروان إفريقية فحصره ثم إن الأغلب خرج إليه فقاتله فأصابه في المعركة سهم فسقط ميتاً وأصحابه لا يعلمون بمصابه ولم يعلم به أصحاب حريش ثم إن حريشاً انهزم وجيشه فأتبعهم أصحاب الأغلب ثلاثة أيام فقتلوهم وقتلوا حريشاً بموضع يعرف بسوق الأحد فسمّي الأغلب الشهيد."
  en: "In al-Baladhuri via Ahmad ibn Nafi', mawla of the Aghlab family: al-Aghlab ibn Salim al-Tamimi was of Marw al-Rudh's people among the Masawwida who came from Khurasan; Musa al-Hadi gave him the Maghreb, and Harish — a man of the frontier army of Tunis — gathered him a host and marched on him at Qayrawan of Ifriqiya, besieging him; al-Aghlab sallied and fought him, an arrow struck him in the battle and he fell dead, his companions not knowing of his fall nor Harish's companions knowing; then Harish and his army fled, al-Aghlab's men pursued three days and killed them, killing Harish at a place known as Suq al-Ahad — and al-Aghlab was called al-Shahid."
  es: "En al-Baladhuri, a través de Ahmad ibn Nafi', mawla de la familia Aghlab: al-Aghlab ibn Salim al-Tamimi era del pueblo de Marw al-Rudh entre los Masawwida que vinieron de Jorasán; Musa al-Hadi le dio el Magreb, y Harish —un hombre del ejército fronterizo de Túnez— reunió un ejército y marchó sobre él en Qayrawan de Ifriqiya, sitiándolo; al-Aghlab salió y luchó contra él, una flecha lo alcanzó en la batalla y cayó muerto, sin que sus compañeros supieran de su caída ni los compañeros de Harish lo supieran; entonces Harish y su ejército huyeron, los hombres de al-Aghlab los persiguieron durante tres días y los mataron, matando a Harish en un lugar conocido como Suq al-Ahad — y al-Aghlab fue llamado al-Shahid."
  fr: "Dans al-Baladhuri, via Ahmad ibn Nafi', mawla de la famille Aghlab: al-Aghlab ibn Salim al-Tamimi était du peuple de Marw al-Rudh parmi les Masawwida venus du Khorasan; Musa al-Hadi lui donna le Maghreb, et Harish — un homme de l'armée frontalière de Tunis — rassembla une armée pour lui et marcha sur lui à Qayrawan d'Ifriqiya, l'assiégeant; al-Aghlab fit une sortie et le combattit, une flèche le frappa au cours de la bataille et il tomba mort, ses compagnons ignorant sa mort, tout comme ceux de Harish; puis Harish et son armée s'enfuirent, les hommes d'al-Aghlab les poursuivirent pendant trois jours et les tuèrent, tuant Harish à un endroit connu sous le nom de Suq al-Ahad — et al-Aghlab fut appelé al-Shahid."
  ur: "البلادوری میں احمد بن نافع بذریعہ، اغلب خاندان کے مولا: اغلب بن سالم التمیمی مساویدہ کے لوگوں میں سے تھے جو خراسان سے آئے تھے۔ موسیٰ الہادی نے اسے مغرب دیا، اور حارث - تیونس کی سرحدی فوج کے ایک آدمی نے اس کے لیے ایک لشکر جمع کیا اور اس کا محاصرہ کرتے ہوئے عفریقیہ کے قیروان پر اس پر چڑھائی کی۔ اغلب نے اس سے مقابلہ کیا، جنگ میں ایک تیر اس پر لگا اور وہ مر گیا، اس کے ساتھیوں کو اس کے گرنے کی خبر نہ تھی اور نہ حارث کے ساتھیوں کو خبر تھی۔ پھر حارث اور اس کی فوج فرار ہو گئی، الاغلب کے آدمیوں نے تین دن تک تعاقب کیا اور انہیں قتل کر دیا، حارث کو سوق الاحد کے نام سے ایک جگہ پر قتل کر دیا اور الاغلب کو الشہد کہا گیا۔"
  tr: "El-Baladhuri, Beni el-Ağlab kabilesinin azatlı kölesi Ahmed ibn Nafi'den rivayetle şunları aktarmıştır: El-Ağlab ibn Salim el-Tamimi, Horasan'dan Abbasi vaizleriyle birlikte gelenler arasında, Merv el-Rudh halkındandı. Musa el-Hadi onu Mağrip valisi olarak atadı. Hariş, Tunus'tan sınır askerlerinden birini yanına alarak bir grup topladı ve o Kayrevan, İfrikiye'deyken ona doğru yürüdüler ve onu kuşattılar. Sonra El-Ağlab ona karşı çıktı ve onunla savaştı; savaşta bir ok ona isabet etti ve öldü. Arkadaşları onun yaralandığını bilmiyorlardı, Hariş'in arkadaşları da bilmiyordu. Sonra Hariş ve ordusu yenildi ve El-Ağlab'ın arkadaşları onları üç gün boyunca kovaladılar, onları ve Hariş'i Çarşı el-Ahad denilen bir yerde öldürdüler. El-Ağlab Şehit olarak anıldı."
  id: "Al-Baladhuri meriwayatkan dari Ahmad ibn Nafi, seorang budak yang dibebaskan dari Banu al-Aghlab: Al-Aghlab ibn Salim al-Tamimi berasal dari kaum Marw al-Rudh, di antara mereka yang datang bersama para pendakwah Abbasiyah dari Khorasan. Musa al-Hadi mengangkatnya sebagai gubernur Maghreb. Harish mengumpulkan sekelompok orang—seorang pria dari pasukan perbatasan dari Tunis—dan berbaris menuju dia ketika dia berada di Kairouan, Ifriqiya, dan mengepungnya. Kemudian al-Aghlab keluar dan melawannya, dan sebuah panah mengenainya dalam pertempuran, dan dia jatuh tewas. Para sahabatnya tidak mengetahui lukanya, begitu pula para sahabat Harish. Kemudian Harish dan pasukannya dikalahkan, dan para sahabat al-Aghlab mengejar mereka selama tiga hari, membunuh mereka dan membunuh Harish di tempat yang dikenal sebagai Souq al-Ahad. Al-Aghlab disebut sebagai Syahid."
