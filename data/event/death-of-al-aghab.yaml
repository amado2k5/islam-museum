label: { ar: "مصرع الأغلب بن سالم بسهم ودحر حريش", en: "al-Aghlab ibn Salim's Death by an Arrow and Harish's Rout" }
summary:
  ar: "عند البلاذري عن أحمد بن نافع مولى بني الأغلب: كان الأغلب بن سالم التميمي من أهل مرو الروذ فيمن قدم مع الدعاة العباسيين من خراسان فولّاه موسى الهادي المغرب فجمع له حريش — وهو رجل كان من جند الثغر من تونس — جمعاً وسار إليه وهو بقيروان إفريقية فحصره ثم إن الأغلب خرج إليه فقاتله فأصابه في المعركة سهم فسقط ميتاً وأصحابه لا يعلمون بمصابه ولم يعلم به أصحاب حريش ثم إن حريشاً انهزم وجيشه فأتبعهم أصحاب الأغلب ثلاثة أيام فقتلوهم وقتلوا حريشاً بموضع يعرف بسوق الأحد فسمّي الأغلب الشهيد."
  en: "In al-Baladhuri via Ahmad ibn Nafi', mawla of the Aghlab family: al-Aghlab ibn Salim al-Tamimi was of Marw al-Rudh's people among the Masawwida who came from Khurasan; Musa al-Hadi gave him the Maghreb, and Harish — a man of the frontier army of Tunis — gathered him a host and marched on him at Qayrawan of Ifriqiya, besieging him; al-Aghlab sallied and fought him, an arrow struck him in the battle and he fell dead, his companions not knowing of his fall nor Harish's companions knowing; then Harish and his army fled, al-Aghlab's men pursued three days and killed them, killing Harish at a place known as Suq al-Ahad — and al-Aghlab was called al-Shahid."
