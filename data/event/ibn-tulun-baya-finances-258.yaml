id: event/ibn-tulun-baya-finances-258
class: event
kind: declaration
label:
  ar: "بيعة جند ابن طولون لنفسه وولايته ماليات مصر والثغور، ٢٥٨هـ/٨٧١-٨٧٢م"
  en: "Ibn Tulun's troops swear personal allegiance; he takes Egypt's and the Marches' finances, 258/871-872"
  ur: "ابن طولون کے لشکر کی ذاتی بیعت اور مصر و سرحدوں کے مالیات کی ولایت، 258ھ/871-872ء"
  es: "Las tropas de Ibn Tulun juran lealtad personal; él se apropia de las finanzas de Egipto y de las Marcas, 258/871-872"
  fr: "Les troupes d'Ibn Tulun prêtent allégeance personnelle; il prend le contrôle des finances de l'Égypte et des Marches, 258/871-872"
  tr: "İbn Tulun'un askerlerinin kendisine olan bağlılığı ve Mısır ile sınır bölgelerinin maliyesini kontrol etmesi, Hicri 258/Miladi 871-872."
  id: "Kesetiaan tentara Ibnu Tulun kepadanya dan kendalinya atas keuangan Mesir dan wilayah perbatasan, 258 H/871-872 M"
summary:
  ar: "في سنة ثمان وخمسين ومائتين عقد ابن طولون مجلساً بايعت فيه قواته شخصه — الجند والشاكرية والموالي — بيعةً لنفسه {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}. وفيها خلف جعفر بن المعتمد — المفوّض إلى الله لاحقاً — يرجوخ في إقطاع مصر، وكان المتوكّل عليه الفعلي الموفق، فصار الخليفة يطلب من ابن طولون نفسه أموال مصر سراً عن أخيه، وأسند إليه الإدارة المالية لمصر وللثغور الشامية {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  en: "In 258/871 Ibn Tulun held a ceremony in which his forces — the regular army, the Shakiriyya and the mawali — swore personal allegiance to himself (al-bay'a li-nafsihi) {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}. The same year Ja'far ibn al-Mu'tamid (later al-Mufawwad ila Allah) succeeded Yarjukh as apanagist of Egypt, with al-Muwaffaq the real power; the caliph now addressed his requests for Egyptian contributions to Ibn Tulun himself, keeping the sums secret from his brother, and entrusted him with the financial administration of Egypt and the Syrian Marches {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  ur: "258ھ/871ء میں ابن طولون نے ایک تقریب منعقد کی جس میں اس کی افواج — باقاعدہ لشکر، شاکریہ اور موالی — نے اس کی ذات کے لیے بیعت کی {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}۔ اسی سال جعفر بن معتمد ⁦(بعد میں مفوّض الی اللہ)⁩ یرجوخ کا جانشین بنا اور خلیفہ نے مصر کی مداخل کے مطالبے خود ابن طولون سے کیے، رقمیں اپنے بھائی سے پوشیدہ رکھتے ہوئے، اور مصر اور شامی سرحدوں کا مالی نظم اسے سونپ دیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}۔"
  es: "En 258/871, Ibn Tulun celebró una ceremonia en la que sus fuerzas —el ejército regular, la Shakiriyya y la mawali— le juraron lealtad personal (al-bay'a li-nafsihi) {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}. Ese mismo año, Ja'far ibn al-Mu'tamid (más tarde al-Mufawwad ila Allah) sucedió a Yarjukh como apanagista de Egipto, siendo al-Muwaffaq el verdadero poder; el califa dirigió entonces sus peticiones de contribuciones egipcias al propio Ibn Tulun, manteniendo las sumas en secreto para su hermano, y le confió la administración financiera de Egipto y las Marcas Sirias {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  fr: "En 258/871, Ibn Tulun organisa une cérémonie au cours de laquelle ses forces – l'armée régulière, la Shakiriyya et les mawali – lui prêtèrent serment d'allégeance (al-bay'a li-nafsihi) {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}. La même année, Ja'far ibn al-Mu'tamid (plus tard al-Mufawwad ila Allah) succéda à Yarjukh comme apanagiste d'Égypte, al-Muwaffaq détenant alors le véritable pouvoir. Le calife adressa désormais ses demandes de contributions égyptiennes directement à Ibn Tulun, dissimulant les sommes à son frère, et lui confia l'administration financière de l'Égypte et des Marches syriennes {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  tr: "Hicri 258 yılında İbn Tulun, askerleri, Şakiriya ve Mevleli'den oluşan ordusunun kendisine şahsen biat ettiği bir meclis topladı. (Kaynak: encyclopaedia-of-islam-2 cilt 10, s. 666) O yıl, daha sonra el-Mufawwad ila Allah olarak bilinen Cafer ibn el-Mute'mid, Mısır beyliğinde Yarjukh'un yerine geçti ve el-Mutawakkil fiili yönetici oldu. Halife, kardeşinin bilgisi olmadan, gizlice İbn Tulun'dan Mısır'ın fonlarını istemeye başladı ve ona Mısır ve Suriye sınır bölgelerinin mali yönetimini emanet etti. (Kaynak: encyclopaedia-of-islam-2 cilt 1, s. 300)"
  id: "Pada tahun 258 H, Ibn Tulun mengadakan dewan di mana pasukannya—para tentara, Shakiriyah, dan Mawali—menyatakan kesetiaan kepadanya secara pribadi {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}. Pada tahun itu, Ja'far ibn al-Mu'ta'mid—yang kemudian dikenal sebagai al-Mufawwad ila Allah—menggantikan Yarjukh di wilayah kekuasaan Mesir, dan al-Mutawakkil menjadi penguasa de facto. Khalifah mulai secara diam-diam meminta dana Mesir dari Ibn Tulun sendiri, tanpa sepengetahuan saudaranya, dan mempercayakan kepadanya administrasi keuangan Mesir dan wilayah perbatasan Suriah {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
