label:
  ar: "ولاية تاج الدين السبكي توقيع الدست، ٧٥٤هـ"
  en: "Taj al-Din al-Subki holds the tawqi' al-dast, 754"
  ur: "تاج الدین سبکی کا توقیع دست کا منصب، 754ھ"
summary:
  ar: "ولي تاج الدين السبكي توقيع الدست بدمشق سنة ٧٥٤هـ؛ وكان قد ولي دار الحديث الأشرفية بتعيين أبيه وولي خطابة الجامع، وناب عن أبيه في الحكم {cite:durar-kamina-jil-1993 2/425}."
  en: "In 754 Taj al-Din al-Subki held the tawqi' al-dast in Damascus; he had already been appointed by his father to the Dar al-Hadith al-Ashrafiyya, held the preachership of the mosque, and deputised for his father in judgment {cite:durar-kamina-jil-1993 2/425}."
  ur: "754ھ میں تاج الدین سبکی نے دمشق میں توقیع دست کا منصب سنبھالا؛ اس سے پہلے والد کی طرف سے دار الحدیث اشرفیہ کی شیخت اور جامع کی خطابت ملی تھی اور وہ والد کے حکم میں نائب رہے {cite:durar-kamina-jil-1993 2/425}۔"
