id: event/abu-tahir-takes-kufa-312
class: event
kind: raid
label: { ar: "دخول أبي طاهر القرمطي الكوفة", en: "Abu Tahir al-Qarmati Enters Kufa", fr: "Abu Tahir al-Qarmati entre à Koufa", es: "Abu Tahir al-Qarmati entra en Kufa", ur: "ابو طاہر القرماتی کوفہ میں داخل ہوئے۔" }
summary:
  ar: "في سنة 312هـ أطلق أبو طاهر القرمطي من كان عنده من أسارى الحجاج وأرسل إلى المقتدر يطلب البصرة والأهواز فلم يُجب، فسار من هجر بريد الحجاج وكان جعفر بن ورقاء الشيباني متولي أعمال الكوفة وطريق مكة فسار بين أيدي الحجاج بألف رجل من بني شيبان فلقيه أبو طاهر فانهزم ودخل أبو طاهر الكوفة وأقام ستة أيام بظاهرها يدخل البلد نهاراً فيقيم في الجامع إلى الليل ثم يخرج يبيت في عسكره وحمل منها ما قدر عليه من الأموال والثياب وعاد إلى هجر، فسار إليها مؤنس المظفر فبلغها وقد عاد القرامطة عنها فاستخلف عليها ياقوتاً وسار إلى واسط خوفاً عليها من أبي طاهر {cite:kamil-ibn-al-athir p. 115-116}."
  en: "In 312 Abu Tahir, refused Basra and Ahwaz, marched from Hajar, routed Ja'far ibn Warqa' al-Shaybani's thousand and held Kufa six days — entering by day, lodging in the mosque, sleeping in camp — then returned to Hajar with its wealth; Mu'nis arrived to find them gone and garrisoned it under Ya'qut {cite:kamil-ibn-al-athir p. 115-116}."
  fr: "En 312, Abu Tahir, n’ayant pas obtenu Bassora et Ahwaz, partit de Hajar, mit en déroute les mille hommes de Ja'far ibn Warqa' al-Shaybani et tint Koufa six jours : il entrait le jour, restait à la mosquée et dormait au camp, puis revint à Hajar avec ses richesses. Mu'nis arriva après leur départ et y plaça une garnison sous Ya'qut {cite:kamil-ibn-al-athir p. 115-116}."
  es: "En 312, Abu Tahir rechazó Basora y Ahwaz, marchó desde Hajar, derrotó a los mil hombres de Ja'far ibn Warqa' al-Shaybani y mantuvo Kufa durante seis días, entrando de día, alojándose en la mezquita y durmiendo en el campamento; luego regresó a Hajar con sus riquezas. Los Mu'nis llegaron y los encontraron desaparecidos, por lo que la guarnecieron bajo el mando de Ya'qut {cite:kamil-ibn-al-athir p. 115-116}."
  ur: "312 میں ابو طاہر نے بصرہ اور اہواز سے انکار کیا، حجر سے کوچ کیا، جعفر بن ورقع الشیبانی کے ہزار کو شکست دی اور چھ دن تک کوفہ پر قابض رہے - دن میں داخل ہوتے، مسجد میں قیام کرتے، کیمپ میں سوتے - پھر اپنے مال کے ساتھ حجر واپس آئے۔ معنیس ان کو گئے ہوئے پا کر وہاں پہنچا اور اسے یاقوت کے تحت محصور کر لیا۔ 115-116}۔"
