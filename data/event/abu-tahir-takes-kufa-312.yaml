label: { ar: "دخول أبي طاهر القرمطي الكوفة", en: "Abu Tahir al-Qarmati Enters Kufa" }
summary:
  ar: "في سنة 312هـ أطلق أبو طاهر القرمطي من كان عنده من أسارى الحجاج وأرسل إلى المقتدر يطلب البصرة والأهواز فلم يُجب، فسار من هجر بريد الحجاج وكان جعفر بن ورقاء الشيباني متولي أعمال الكوفة وطريق مكة فسار بين أيدي الحجاج بألف رجل من بني شيبان فلقيه أبو طاهر فانهزم ودخل أبو طاهر الكوفة وأقام ستة أيام بظاهرها يدخل البلد نهاراً فيقيم في الجامع إلى الليل ثم يخرج يبيت في عسكره وحمل منها ما قدر عليه من الأموال والثياب وعاد إلى هجر، فسار إليها مؤنس المظفر فبلغها وقد عاد القرامطة عنها فاستخلف عليها ياقوتاً وسار إلى واسط خوفاً عليها من أبي طاهر {cite:kamil-ibn-al-athir p. 115-116}."
  en: "In 312 Abu Tahir, refused Basra and Ahwaz, marched from Hajar, routed Ja'far ibn Warqa' al-Shaybani's thousand and held Kufa six days — entering by day, lodging in the mosque, sleeping in camp — then returned to Hajar with its wealth; Mu'nis arrived to find them gone and garrisoned it under Ya'qut {cite:kamil-ibn-al-athir p. 115-116}."
