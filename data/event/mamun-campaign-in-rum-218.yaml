label: { ar: "غزوة المأمون أرض الروم", en: "al-Ma'mun's Anatolian campaign", es: "La campaña de Anatolia de al-Ma'mun", fr: "Campagne anatolienne d'al-Ma'mun", ur: "المامون کی اناطولیہ مہم", tr: "El-Ma'mun'un Roma topraklarına yaptığı istila", id: "Invasi Al-Ma'mun ke wilayah Romawi" }
summary:
  ar: "في سنة ثماني عشرة ومائتين غزا المأمون أرض الروم وقد شرع في بناء الطوانة مدينة على فم الدرب مما يلي طرسوس وعمد إلى سائر حصون الروم يخيرهم بين الإسلام والجزية والسيف، وجاءه رسول ملك الروم بالبديدون يخيره بين رد نفقته أو إخراج كل أسير مسلم أو إعمار ما خربت النصرانية، فصلى ركعتين واستخار ثم رد الثلاثة وقال ليس بيني وبينه إلا السيف ففتح خمسة عشر حصناً ثم نزل على عين البديدون فكانت فيها وفاته {cite:muruj-al-dhahab p. 434-435}."
  en: "The 218 campaign — al-Tawwana founded at the pass-mouth by Tarsus, the Byzantine king's three offers refused, fifteen fortresses taken, and the death-halt at al-Badhidhun {cite:muruj-al-dhahab p. 434-435}."
  es: "La campaña del 218: al-Tawwana fundada en la desembocadura del paso por Tarso, las tres ofertas del rey bizantino rechazadas, quince fortalezas tomadas y la parada mortal en al-Badhidhun {cite:muruj-al-dhahab p. 434-435}."
  fr: "La campagne de 218 — al-Tawwana fondée à l'embouchure du col près de Tarse, les trois offres du roi byzantin refusées, quinze forteresses prises et l'arrêt fatal à al-Badhidhun {cite:muruj-al-dhahab p. 434-435}."
  ur: "218 مہم - التوانہ کی بنیاد ترسوس کے پاس منہ پر رکھی گئی، بازنطینی بادشاہ کی تین پیشکشیں ٹھکرا دی گئیں، پندرہ قلعے لے لیے گئے، اور البدیھون میں موت کا خاتمہ۔ 434-435}۔"
  tr: "Hicri 218 yılında, El-Ma'mun Roma topraklarına saldırdı ve Tarsus'a giden yolun ağzında El-Tawana şehrini kurmaya başladı. Romalıların tüm kalelerine gitti ve onlara İslam, cizye ve kılıç arasında seçim yapma şansı verdi. Roma kralının elçisi El-Badidun'da ona geldi ve ona masraflarını geri verme, tüm Müslüman esirleri serbest bırakma veya Hristiyanların yıktığı yerleri yeniden inşa etme seçeneklerini sundu. İki rekat namaz kıldı ve Allah'tan hidayet diledi, sonra üçünü de reddetti ve \"Benimle onun arasında kılıçtan başka bir şey yok\" dedi. On beş kaleyi fethetti ve sonra El-Badidun pınarına indi ve orada öldü. {cite:muruj-al-dhahab s. 434-435}"
  id: "Pada tahun 218 H, Al-Ma'mun menyerbu tanah Romawi dan mulai membangun Al-Tawana, sebuah kota di muara jalan menuju Tarsus. Ia pergi ke semua benteng Romawi, memberi mereka pilihan antara Islam, jizya, dan pedang. Utusan raja Romawi datang kepadanya di Al-Badidun, memberinya pilihan antara mengembalikan biaya perjalanannya, membebaskan setiap tahanan Muslim, atau membangun kembali apa yang telah dihancurkan oleh orang-orang Kristen. Ia shalat dua rakaat dan memohon petunjuk dari Allah, kemudian menolak ketiga pilihan tersebut dan berkata, \"Tidak ada yang memisahkan aku dan dia selain pedang.\" Ia menaklukkan lima belas benteng dan kemudian turun ke mata air Al-Badidun, dan di sanalah ia wafat. {cite:muruj-al-dhahab hlm. 434-435}"
