label: { ar: "بعث عمرو بن أمية الضمري لقتل أبي سفيان وما صنع في طريقه", en: "The dispatch of Amr ibn Umayya al-Damri to kill Abu Sufyan, and what he did on the way" }
summary:
  ar: "يرويه ابن هشام عمن يثق به من أهل العلم فيما لم يذكره ابن إسحاق: بعث النبي عمرو بن أمية الضمري بعد مقتل خبيب بن عدي وأصحابه إلى مكة ليقتل أبا سفيان بن حرب، ومعه جبار بن صخر الأنصاري؛ فطافا بالبيت ليلاً، وعُرف عمرو فهربا إلى جبل وباتا في كهف، فقتل عمرو قرشياً اطّلع عليهما، ثم أنزل خشبة خبيب وألقاها في جرف، وفي طريق عودته قتل شيخاً أعور من بني الدِّيل أنشد أنه لن يسلم ما عاش، وقتل أحد عينَي قريش وأسر الآخر فقدم به المدينة."
  en: "Ibn Hisham tells it, from a scholar he trusts, among what Ibn Ishaq did not include: after the killing of Khubayb ibn Adi and his companions the Prophet sent Amr ibn Umayya al-Damri to Mecca to kill Abu Sufyan ibn Harb, with Jabbar ibn Sakhr al-Ansari; they circled the Ka'ba at night, Amr was recognised and the two fled to a mountain and spent the night in a cave, where Amr killed a Qurayshi who came upon them; he then took down Khubayb's body from its stake and threw it into a ravine; on his way home he killed a one-eyed old man of Banu al-Dil who sang that he would never be a Muslim, killed one of two Quraysh spies and brought the other bound to Medina."
