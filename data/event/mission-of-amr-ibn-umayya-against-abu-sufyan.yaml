id: event/mission-of-amr-ibn-umayya-against-abu-sufyan
class: event
kind: raid
label: { ar: "بعث عمرو بن أمية الضمري لقتل أبي سفيان وما صنع في طريقه", en: "The dispatch of Amr ibn Umayya al-Damri to kill Abu Sufyan, and what he did on the way", es: "El envío de Amr ibn Umayya al-Damri para matar a Abu Sufyan y lo que hizo en el camino.", fr: "L'envoi d'Amr ibn Umayya al-Damri pour tuer Abu Sufyan et ce qu'il fit en chemin.", ur: "عمرو بن امیہ الدمری کا ابو سفیان کو قتل کرنے کے لیے روانہ، اور اس نے راستے میں کیا کیا؟" }
summary:
  ar: "يرويه ابن هشام عمن يثق به من أهل العلم فيما لم يذكره ابن إسحاق: بعث النبي عمرو بن أمية الضمري بعد مقتل خبيب بن عدي وأصحابه إلى مكة ليقتل أبا سفيان بن حرب، ومعه جبار بن صخر الأنصاري؛ فطافا بالبيت ليلاً، وعُرف عمرو فهربا إلى جبل وباتا في كهف، فقتل عمرو قرشياً اطّلع عليهما، ثم أنزل خشبة خبيب وألقاها في جرف، وفي طريق عودته قتل شيخاً أعور من بني الدِّيل أنشد أنه لن يسلم ما عاش، وقتل أحد عينَي قريش وأسر الآخر فقدم به المدينة."
  en: "Ibn Hisham tells it, from a scholar he trusts, among what Ibn Ishaq did not include: after the killing of Khubayb ibn Adi and his companions the Prophet sent Amr ibn Umayya al-Damri to Mecca to kill Abu Sufyan ibn Harb, with Jabbar ibn Sakhr al-Ansari; they circled the Ka'ba at night, Amr was recognised and the two fled to a mountain and spent the night in a cave, where Amr killed a Qurayshi who came upon them; he then took down Khubayb's body from its stake and threw it into a ravine; on his way home he killed a one-eyed old man of Banu al-Dil who sang that he would never be a Muslim, killed one of two Quraysh spies and brought the other bound to Medina."
  es: "Ibn Hisham lo cuenta, de un erudito en quien confía, entre lo que Ibn Ishaq no incluyó: después del asesinato de Khubayb ibn Adi y sus compañeros, el Profeta envió a Amr ibn Umayya al-Damri a La Meca para matar a Abu Sufyan ibn Harb, con Jabbar ibn Sakhr al-Ansari; rodearon la Kaaba por la noche, Amr fue reconocido y los dos huyeron a una montaña y pasaron la noche en una cueva, donde Amr mató a un Quraysh que los encontró; luego bajó el cuerpo de Khubayb de su estaca y lo arrojó a un barranco; de camino a casa mató a un anciano tuerto de Banu al-Dil que cantaba que nunca sería musulmán, mató a uno de los dos espías Quraysh y llevó al otro atado a Medina."
  fr: "Ibn Hisham rapporte, d'après un érudit de confiance, un récit qu'Ibn Ishaq n'a pas inclus: après le meurtre de Khubayb ibn Adi et de ses compagnons, le Prophète envoya Amr ibn Umayya al-Damri à La Mecque pour tuer Abu Sufyan ibn Harb, accompagné de Jabbar ibn Sakhr al-Ansari; ils firent le tour de la Kaaba pendant la nuit, Amr fut reconnu et les deux hommes s'enfuirent vers une montagne et passèrent la nuit dans une grotte, où Amr tua un Qurayshite qui les avait surpris; il descendit ensuite le corps de Khubayb de son pieu et le jeta dans un ravin; sur le chemin du retour, il tua un vieillard borgne des Banu al-Dil qui chantait qu'il ne se convertirait jamais à l'islam, tua l'un des deux espions qurayshites et ramena l'autre, ligoté, à Médine."
  ur: "ابن ہشام اس کو ایک عالم سے کہتے ہیں جن پر وہ اعتماد کرتا ہے، ابن اسحاق نے ان میں سے جو کچھ شامل نہیں کیا تھا: خبیب بن عدی اور اس کے ساتھیوں کے قتل کے بعد نبی نے عمرو بن امیہ الدمری کو جبار بن صخر الانصاری کے ساتھ ابو سفیان بن حرب کو قتل کرنے کے لیے مکہ بھیجا تھا۔ انہوں نے رات کو کعبہ کا طواف کیا، عمرو کو پہچان لیا گیا اور دونوں ایک پہاڑ کی طرف بھاگے اور ایک غار میں رات گزاری، وہاں عمرو نے ایک قریشی کو قتل کیا جو ان پر آیا۔ اس کے بعد اس نے خبیب کی لاش کو اس کے داؤ سے اتار کر ایک کھائی میں پھینک دیا۔ گھر جاتے ہوئے اس نے بنو دل کے ایک ایک آنکھ والے بوڑھے کو قتل کر دیا جس نے گایا کہ وہ کبھی مسلمان نہیں ہو گا، قریش کے دو جاسوسوں میں سے ایک کو قتل کر دیا اور دوسرے کو پابند سلاسل مدینہ لے آیا۔"
