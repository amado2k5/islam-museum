id: event/burial-of-ibrahim-at-hebron
class: event
kind: death
label:
  ar: وفاة إبراهيم ودفنه في مغارة الخليل
  en: Death and burial of Ibrahim at Hebron
  ur: ابراہیم کی وفات اور خلیل میں تدفین
  fr: "La mort et l'inhumation d'Ibrahim à Hébron"
  es: "Muerte y sepultura de Ibrahim en Hebrón."
  tr: "İbrahim'in ölümü ve Hebron mağarasına gömülmesi"
  id: "Kematian Abraham dan penguburannya di gua Hebron"
summary:
  ar: يذكر ابن كثير أن إبراهيم مرض ومات ودُفن في المغارة التي اشتراها من عفرون بن صخر الحيثي بحبرون عند زوجته سارة، وتولى دفنه إسماعيل وإسحاق {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178}؛ ويورد حديثاً عن ابن حبان في عمره، وأخباراً عن مجيء ملك الموت إليه مأخوذة عن أهل الكتاب يقول فيها «الله أعلم بصحتها» {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}.
  en: Ibn Kathir says Ibrahim fell ill and died and was buried in the cave at Habrun bought from Ephron ibn Sakhr the Hittite, beside his wife Sara, with Ismail and Ishaq seeing to the burial {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178}; he cites a report from Ibn Hibban on his age, and reports drawn from the People of the Book about the angel of death's coming to him, of which he says 'God knows best how sound they are' {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}.
  ur: ابن کثیر بتاتے ہیں کہ ابراہیم بیمار ہو کر فوت ہوئے اور حبرون میں عفرون بن صخر حیثی سے خریدی ہوئی غار میں اپنی اہلیہ سارہ کے پاس دفن ہوئے اور اسماعیل و اسحاق نے ان کی تدفین کی {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178}؛ وہ ابن حبان کی ایک روایت ان کی عمر کے بارے میں لاتے ہیں اور ملک الموت کے آنے کی وہ خبریں جو اہلِ کتاب سے ماخوذ ہیں، جن کے بارے میں کہتے ہیں «ان کی صحت کا علم اللہ کو ہے» {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}۔
  fr: "Ibn Kathir dit qu'Ibrahim tomba malade, mourut et fut enterré dans la grotte de Habrun achetée à Éphron ibn Sakhr le Hittite, à côté de son épouse Sara, Ismail et Ishaq veillant à l'inhumation {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178} ; il cite un récit d'Ibn Hibban sur son âge, ainsi que des récits tirés des Gens du Livre sur la venue à lui de l'ange de la mort, dont il dit « Dieu sait mieux ce qu'ils valent » {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}."
  es: "Ibn Kathir dice que Ibrahim enfermó y murió y fue enterrado en la cueva de Habrun comprada a Efrón ibn Sakhr el hitita, junto a su esposa Sara, con Ismail e Ishaq a cargo del entierro {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178}; cita un informe de Ibn Hibban sobre su edad, e informes extraídos de la Gente del Libro sobre la venida del ángel de la muerte a él, de lo cual dice 'Dios sabe mejor cuán sanos están' {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}."
  tr: "İbn Kathir, İbrahim'in hastalanıp öldüğünü ve karısı Sara ile birlikte Hebron'da Hititli Sakhr bin Ephron'dan satın aldığı mağaraya gömüldüğünü, İsmail ve İshak'ın da cenaze işlemlerini üstlendiğini belirtir. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178} Ayrıca, İbrahim'in yaşıyla ilgili İbn Hibban'dan bir hadis ve Kitap Ehli'nden alınan, Azrail'in ona gelişiyle ilgili rivayetler de ekler ve \"Allah bunların doğruluğunu en iyi bilir\" der. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}"
  id: "Ibn Kathir menyebutkan bahwa Ibrahim jatuh sakit dan meninggal dunia, lalu dimakamkan di gua yang dibelinya dari Ephron bin Sakhr orang Het di Hebron bersama istrinya Sarah, dan Ismail serta Ishak mengurus pemakamannya {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 178}; dan ia menyertakan hadits dari Ibn Hibban tentang usianya, dan meriwayatkan tentang kedatangan Malaikat Maut kepadanya yang diambil dari Ahli Kitab, di mana ia berkata, “Allah Maha Mengetahui tentang keaslian hadits-hadits tersebut” {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 237}."
