label: { ar: "القبض على الوزير الخاقاني وولاية أحمد الخصيبي", en: "The arrest of the vizier al-Khaqani and the appointment of Ahmad al-Khasibi", fr: "L'arrestation du vizir al-Khaqani et la nomination d'Ahmad al-Khasibi", es: "El arresto del visir al-Khaqani y el nombramiento de Ahmad al-Khasibi", ur: "وزیر الخاقانی کی گرفتاری اور احمد الخصیبی کی تقرری", tr: "Bakan El-Hakani'nin tutuklanması ve Ahmed El-Hasibi'nin atanması", id: "Penangkapan Menteri Al-Khaqani dan pengangkatan Ahmed Al-Khasibi" }
summary:
  ar: "في سنة ثلاث عشرة وثلاثمائة قُبض على الوزير عبد الله بن محمد الخاقاني ووُكّل به في منزله، وخُلع في اليوم نفسه على أحمد بن عبيد الله الخصيبي للوزارة {cite:tabari-tarikh-abu-al-fadl j.11 p.109}."
  en: "In the year 313 the vizier Abdallah ibn Muhammad al-Khaqani was arrested and placed under guard at his house, and on the same day Ahmad ibn Ubayd Allah al-Khasibi was invested with the vizierate {cite:tabari-tarikh-abu-al-fadl j.11 p.109}."
  fr: "En l'an 313, le vizir Abdallah ibn Muhammad al-Khaqani fut arrêté et placé sous garde dans sa maison, et le même jour Ahmad ibn Ubayd Allah al-Khasibi fut investi du vizirat {cite:tabari-tarikh-abu-al-fadl j.11 p.109}."
  es: "En el año 313, el visir Abdallah ibn Muhammad al-Khaqani fue arrestado y puesto bajo custodia en su casa, y ese mismo día Ahmad ibn Ubayd Allah al-Khasibi fue investido con el visirato {cite:tabari-tarikh-abu-al-fadl j.11 p.109}."
  ur: "سنہ 313 میں وزیر عبد اللہ بن محمد الخاقانی کو گرفتار کر کے ان کے گھر پر پہرہ دے دیا گیا اور اسی دن احمد بن عبید اللہ الخصیبی کو وزیر کے ساتھ لگا دیا گیا۔"
  tr: "Hicri 313 yılında, bakan Abdullah bin Muhammed el-Hakani tutuklanarak ev hapsine alındı ve aynı gün Ahmed bin Ubeyd Allah el-Hasibi'ye bakanlık görevi verildi. {Kaynak: Tabari-tarikh-ebu-el-fadl c.11 s.109}"
  id: "Pada tahun 313 H, menteri Abdullah bin Muhammad al-Khaqani ditangkap dan ditempatkan di bawah tahanan rumah, dan pada hari yang sama, Ahmad bin Ubaid Allah al-Khasibi diberi jabatan menteri {cite:tabari-tarikh-abu-al-fadl j.11 p.109}."
