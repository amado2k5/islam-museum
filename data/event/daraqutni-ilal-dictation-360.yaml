class: event
kind: other
label:
  ar: "الدارقطني يملي العلل على البرقاني في مجالس ابن حمدان، نحو ٣٦٠هـ"
  en: "Al-Daraqutni dictates the 'Ilal to al-Barqani at Ibn Hamdan's gatherings, about 360/971"
  ur: "دارقطنی ابن حمدان کے مجالس میں برقانی پر علل املا کرتے ہیں، تقریباً 360ھ/971ء"
  es: "Al-Daraqutni dicta el 'Ilal a al-Barqani en las reuniones de Ibn Hamdan, alrededor de 360/971"
  fr: "Al-Daraqutni dicte le 'Ilal à al-Barqani lors des rassemblements d'Ibn Hamdan, vers 360/971"
  tr: "Al-Darakutni, H. 360 civarında İbn Hamdan'ın toplantılarında el-Barkani'ye kusurları dikte eder."
  id: "Al-Daraqutni mendiktekan kecacatan kepada Al-Barqani dalam pertemuan Ibnu Hamdan, sekitar tahun 360 H."
summary:
  ar: "كان أبو منصور إبراهيم بن الحسن بن حمدان الصيرفي واسع السماع يريد أن يصنف مسنداً معللاً، وكان الدارقطني يحضر عنده في كل أسبوع يوماً، يتعلل على الأحاديث في أصوله وينقلها أبو بكر البرقاني ويملي عليه الدارقطني علل الحديث حتى خرج من ذلك شيء كثير، وتوفي أبو منصور قبل استتمامه، فنقل البرقاني كلام الدارقطني فهو كتاب «العلل» الذي يرويه الناس عن الدارقطني {cite:muntazam-ibn-al-jawzi j.7 p.183}؛ وقال البرقاني: كان الدارقطني يملي علي العلل من حفظه، فمن أراد أن يعرف قدر ذلك فليطالع كتاب «العلل» ليعرف كيف كان الحفاظ {cite:tarikh-islam-dhahabi p.103}."
  en: "Abu Mansur Ibrahim ibn al-Hasan ibn Hamdan al-Sayrafi, a widely-heard scholar who wished to compile a mu'allal musnad, held a weekly day on which al-Daraqutni attended him; al-Daraqutni would give the defects of the hadiths against his own notebooks while Abu Bakr al-Barqani transferred them and al-Daraqutni dictated the 'ilal to him, until a great deal had come out of it. Abu Mansur died before it was finished, so al-Barqani transmitted al-Daraqutni's words — that is the Kitab al-'Ilal which people narrate from al-Daraqutni {cite:muntazam-ibn-al-jawzi j.7 p.183}. Al-Barqani said: al-Daraqutni dictated the 'Ilal to me from memory; whoever would know what that means, let him read the Kitab al-'Ilal to learn what the huffaz were {cite:tarikh-islam-dhahabi p.103}."
  ur: "ابو منصور ابراہیم بن حسن بن حمدان صیرفی، جو وسیع سماعت والے اور معلل مسند کی تصنیف چاہتے تھے، ہر ہفتے ایک دن رکھتے تھے جس میں دارقطنی ان کے پاس حاضر ہوتے؛ دارقطنی اپنے اصولوں کے سامنے احادیث کی علل بیان کرتے اور ابو بکر برقانی انہیں منتقل کرتے اور دارقطنی ان پر علل املا کرتے، یہاں تک کہ بہت کچھ مرتب ہوا؛ ابو منصور اس کے مکمل ہونے سے پہلے فوت ہوئے، پس برقانی نے دارقطنی کے کلام کو منتقل کیا — یہی وہ کتاب العلل ہے جو لوگ دارقطنی سے روایت کرتے ہیں {cite:muntazam-ibn-al-jawzi j.7 p.183}؛ برقانی کہتے ہیں: دارقطنی مجھ پر علل حفظ سے املا کرتے تھے؛ جو اس کا قدر جاننا چاہے وہ کتاب العلل پڑھے تاکہ جانے حفاظ کیسے تھے {cite:tarikh-islam-dhahabi p.103}۔"
  es: "Abu Mansur Ibrahim ibn al-Hasan ibn Hamdan al-Sayrafi, un erudito muy conocido que deseaba compilar un mu'allal musnad, tenía un día semanal en el que al-Daraqutni lo asistía; al-Daraqutni le daba los defectos de los hadices contra sus propios cuadernos mientras Abu Bakr al-Barqani los transcribía y al-Daraqutni le dictaba el 'ilal, hasta que se había extraído gran parte de él. Abu Mansur murió antes de que se terminara, así que al-Barqani transmitió las palabras de al-Daraqutni; ese es el Kitab al-'Ilal que la gente narra de al-Daraqutni {cite:muntazam-ibn-al-jawzi j.7 p.183}. Al-Barqani dijo: al-Daraqutni me dictó el 'Ilal de memoria; Quien quiera saber lo que eso significa, que lea el Kitab al-'Ilal para aprender lo que eran los huffaz {cite:tarikh-islam-dhahabi p.103}."
  fr: "Abu Mansur Ibrahim ibn al-Hasan ibn Hamdan al-Sayrafi, un érudit renommé qui souhaitait compiler un mu'allal musnad, organisait une séance hebdomadaire à laquelle assistait al-Daraqutni. Ce dernier examinait les défauts des hadiths en les comparant à ses propres notes, tandis qu'Abu Bakr al-Barqani les recopiait et qu'al-Daraqutni lui dictait le 'ilal, jusqu'à ce que le travail soit suffisamment conséquent. Abu Mansur mourut avant que le musnad ne soit achevé, et al-Barqani transmit alors les paroles d'al-Daraqutni – c'est ainsi que le Kitab al-'Ilal, tel qu'il est rapporté par la tradition (cit.: muntazam-ibn-al-jawzi j.7 p.183). Al-Barqani déclara: « al-Daraqutni me dictait le 'Ilal de mémoire. » Quiconque voudrait savoir ce que cela signifie, qu'il lise le Kitab al-'Ilal pour apprendre ce que sont les huffaz {cite:tarikh-islam-dhahabi p.103}."
  tr: "Ebu Mansur İbrahim ibn el-Hasan ibn Hamdan el-Sayrafi geniş bir dinleyici kitlesine sahipti ve eksiklikleri olan bir Musned derlemek istiyordu. El-Daraqutni her hafta onun toplantılarına katılır, kaynaklarındaki hadislerdeki eksiklikleri tartışırdı. Daha sonra Ebu Bekr el-Barqani bu eksiklikleri iletir ve el-Daraqutni de eksiklikleri ona dikte ettirirdi, ta ki çok sayıda eser ortaya çıkana kadar. Ebu Mansur, eseri tamamlamadan önce vefat etti, bu yüzden el-Barqani, el-Daraqutni'nin sözlerini aktardı ve bu da insanların el-Daraqutni'den rivayet ettiği \"el-İlal\" kitabıdır. {alıntı:muntazam-ibn-al-jawzi c.7 s.183}. El-Barqani şöyle dedi: El-Daraqutni eksiklikleri bana hafızasından dikte ettirirdi. Bunun değerini öğrenmek isteyen herkes, ezbercilerin nasıl bir yöntem izlediğini görmek için “el-İlal” kitabını okumalıdır. {cite:tarikh-islam-dhahabi s.103}"
  id: "Abu Mansur Ibrahim ibn al-Hasan ibn Hamdan al-Sayrafi memiliki jangkauan pendengaran yang luas dan ingin menyusun Musnad yang memiliki kekurangan. Al-Daraqutni akan menghadiri pertemuan-pertemuan beliau setiap minggu, membahas kekurangan hadits dalam sumber-sumbernya. Abu Bakr al-Barqani kemudian akan meriwayatkan kekurangan-kekurangan tersebut, dan al-Daraqutni akan mendiktekan kekurangan-kekurangan tersebut kepadanya hingga banyak sekali yang dihasilkan. Abu Mansur meninggal sebelum menyelesaikannya, sehingga al-Barqani meriwayatkan kata-kata al-Daraqutni, dan inilah kitab “al-`Ilal” yang diriwayatkan orang-orang dari al-Daraqutni {kutip:muntazam-ibn-al-jawzi j.7 hlm.183}. Al-Barqani berkata: Al-Daraqutni akan mendiktekan kekurangan-kekurangan tersebut kepadaku dari ingatannya. Siapa pun yang ingin mengetahui nilai dari hal ini hendaknya membaca buku “al-`Ilal” untuk melihat bagaimana para penghafalnya {cite:tarikh-islam-dhahabi p.103}."
