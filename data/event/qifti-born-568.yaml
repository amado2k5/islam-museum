id: event/qifti-born-568
class: event
kind: birth
label:
  ar: "ولادة جمال الدين القفطي بقفط في الصعيد، ٥٦٨هـ"
  en: "Jamal al-Din al-Qifti is born at Qift in Upper Egypt, 568/1172"
  ur: "جمال الدین قفطی کی ولادت قفط، صعید مصر میں، 568ھ/1172ء"
  es: "Jamal al-Din al-Qifti nació en Qift, en el Alto Egipto, en el año 568/1172."
  fr: "Jamal al-Din al-Qifti naît à Qift, en Haute-Égypte, en 568/1172."
  tr: "Cemal el-Din el-Kifti, Hicri 568 yılında Yukarı Mısır'ın Kift şehrinde doğdu."
  id: "Jamal al-Din al-Qifti lahir di Qift, Mesir Hulu, pada tahun 568 Hijriah."
summary:
  ar: "وُلد جمال الدين أبو الحسن علي بن يوسف بن إبراهيم بن عبد الواحد الشيباني القفطي سنة ثمان وستين وخمسمائة بقفط في صعيد مصر {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ وذكر الإدفوي في الطالع السعيد مولده سنة ثلاث وستين بقفط {cite:tarikh-islam-dhahabi p. 325}."
  en: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf ibn Ibrahim ibn Abd al-Wahid al-Shaybani al-Qifti was born in 568/1172 at Qift in Upper Egypt {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; al-Idfawi's al-Tali' al-Sa'id gives the earlier year 563 {cite:tarikh-islam-dhahabi p. 325}."
  ur: "جمال الدین ابو الحسن علی بن یوسف بن ابراہیم بن عبدالواحد شیبانی قفطی 568ھ/1172ء کو صعید مصر کے شہر قفط میں پیدا ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ ادفوی کی الطالع السعید میں سن 563ھ درج ہے {cite:tarikh-islam-dhahabi p. 325}۔"
  es: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf ibn Ibrahim ibn Abd al-Wahid al-Shaybani al-Qifti nació en 568/1172 en Qift en el Alto Egipto {cita:enciclopedia-del-islam-2 vol. 3 p. 872}; Al-Tali' al-Sa'id de al-Idfawi da el año anterior 563 {cita:tarikh-islam-dhahabi p. 325}."
  fr: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf ibn Ibrahim ibn Abd al-Wahid al-Shaybani al-Qifti est né en 568/1172 à Qift en Haute-Égypte {cite:encyclopaedia-of-islam-2 vol. 15h. 872}; al-Tali' al-Sa'id d'al-Idfawi donne l'année précédente 563 {cite:tarikh-islam-dhahabi p. 325}."
  tr: "Cemaleddin Ebu el-Hasan Ali ibn Yusuf ibn İbrahim ibn Abd al-Wahid el-Şeybani el-Kıfti, H. 568 yılında Yukarı Mısır'ın Qift şehrinde doğdu {cite:encyclopaedia-of-islam-2 vol. 3 s. 872}; ve el-İdfavi, el-Tali' el-Sa'id'de kendisinin H. 563 yılında Kıft'ta doğduğunu belirtmektedir {cite:tarikh-islam-dhahabi s. 325}."
  id: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf ibn Ibrahim ibn Abd al-Wahid al-Shaybani al-Qifti lahir pada tahun 568 H di Qift, Mesir Hulu {cite:encyclopaedia-of-islam-2 vol. 3 hal. 872}; dan al-Idfawi menyebutkan dalam al-Tali’ al-Sa’id bahwa beliau dilahirkan pada tahun 563 H di Qift {cite:tarikh-islam-dhahabi p. 325}."
