  en: "Jamal al-Din al-Qifti is born at Qift in Upper Egypt, 568/1172"
  ur: "جمال الدین قفطی کی ولادت قفط، صعید مصر میں، 568ھ/1172ء"
summary:
  ar: "وُلد جمال الدين أبو الحسن علي بن يوسف بن إبراهيم بن عبد الواحد الشيباني القفطي سنة ثمان وستين وخمسمائة بقفط في صعيد مصر {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ وذكر الإدفوي في الطالع السعيد مولده سنة ثلاث وستين بقفط {cite:tarikh-islam-dhahabi p. 325}."
  en: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf ibn Ibrahim ibn Abd al-Wahid al-Shaybani al-Qifti was born in 568/1172 at Qift in Upper Egypt {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; al-Idfawi's al-Tali' al-Sa'id gives the earlier year 563 {cite:tarikh-islam-dhahabi p. 325}."
  ur: "جمال الدین ابو الحسن علی بن یوسف بن ابراہیم بن عبدالواحد شیبانی قفطی 568ھ/1172ء کو صعید مصر کے شہر قفط میں پیدا ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ ادفوی کی الطالع السعید میں سن 563ھ درج ہے {cite:tarikh-islam-dhahabi p. 325}۔"
