  tr: "712 yılında gerçekleşen Urur Muharebesi'nin, Muhammed ibn al-Qasim'in Raja Dahir'e karşı kazandığı zaferin ve Sind'in fethinin ön anlatımı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Urur pada tahun 712 M, kemenangan Muhammad ibn al-Qasim atas Raja Dahir dan penaklukan Sindh; sumber-sumbernya belum ditinjau di halaman ini."
