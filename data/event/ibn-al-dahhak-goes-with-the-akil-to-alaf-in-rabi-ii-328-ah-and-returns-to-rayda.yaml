id: "event/ibn-al-dahhak-goes-with-the-akil-to-alaf-in-rabi-ii-328-ah-and-returns-to-rayda"
class: event
kind: other
label:
  ar: "يخرج ابن الضحاك مع الأكيليين إلى علاف في ربيع الآخر سنة 328هـ ثم يعود إلى ريدة، ص414"
  en: "Ibn al-Dahhak goes with the Akil to Alaf in Rabi II 328 AH, and then returns to Rayda, p. 414"
  ur: "ابن الضحاک ربیع الآخر 328ھ میں اکیلیوں کے ساتھ علاف جاتا ہے اور پھر ریدہ لوٹ آتا ہے، ص414"
  es: "Ibn al-Dahhak va con el Akil a Alaf en Rabi II 328 AH, y luego regresa a Rayda, pág. 414."
  fr: "Ibn al-Dahhak accompagne les Akil à Alaf en Rabi II 328 AH, puis retourne à Rayda, p. 414"
summary:
  ar: "يستنهض الأكيليون ابن الضحاك في ربيع الآخر فيخرج معهم يوم السبت لثماني ليال من الشهر إلى علاف، ثم يحارب اليرسميون، فيقتل منهم رجل، فيعود ابن الضحاك إلى ريدة، ويبقى يحيى بن أحمد في الغيل."
  en: "The Akil call Ibn al-Dahhak out in Rabi II. He goes with them to Alaf on Saturday, eight nights into the month. The Yirsamis fight them, and one of them is killed. Ibn al-Dahhak returns to Rayda, and Yahya ibn Ahmad stays at al-Ghayl."
  ur: "ربیع الآخر میں اکیلی ابن الضحاک کو بلاتے ہیں تو وہ مہینے کی آٹھ راتیں گزرنے پر ہفتے کے دن ان کے ساتھ علاف جاتا ہے۔ یرسمی لڑتے ہیں اور ایک آدمی مارا جاتا ہے، پھر ابن الضحاک ریدہ لوٹ آتا ہے اور یحییٰ بن احمد غیل میں ٹھہرے رہتے ہیں۔"
  es: "Los Akil llaman a Ibn al-Dahhak en Rabi II. Él los acompaña a Alaf un sábado, ocho noches después de iniciado el mes. Los Yirsami luchan contra ellos, y uno de ellos muere. Ibn al-Dahhak regresa a Rayda, y Yahya ibn Ahmad se queda en al-Ghayl."
  fr: "Les Akil convoquent Ibn al-Dahhak au deuxième jour du mois de Rabi. Il les accompagne à Alaf le samedi, huit nuits après le début du mois. Les Yirsamis les affrontent et l'un d'eux est tué. Ibn al-Dahhak retourne à Rayda, tandis que Yahya ibn Ahmad demeure à al-Ghayl."
