  en: "Abu 'Amr Ibn 'Abd al-Barr recorded that his father Abu Muhammad 'Abd Allah ibn Muhammad ibn 'Abd al-Barr died in Rabi' II 380, having been born in 330 {cite:wafayat-ayan p. 71}; Ibn 'Abd al-Barr was then a boy of twelve."
  ur: "ابو عمر ابن عبد البر نے لکھا کہ ان کے والد ابو محمد عبد اللہ بن محمد بن عبد البر ربیع الثانی 380ھ میں فوت ہوئے اور ان کی پیدائش 330ھ میں ہوئی {cite:wafayat-ayan p. 71}؛ اس وقت ابن عبد البر کی عمر بارہ سال تھی۔"
