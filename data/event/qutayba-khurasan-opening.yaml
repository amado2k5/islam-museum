id: event/qutayba-khurasan-opening
class: event
kind: campaign
label: { ar: "افتتاح قتيبة ما وراء النهر", en: "Qutayba's Opening beyond the River", es: "La apertura de Qutayba más allá del río", fr: "L'ouverture de Qutayba au-delà du fleuve", ur: "قطیبہ کا دریا کے پار کھلنا" }
summary:
  ar: "ولى الحجاج قتيبة بن مسلم الباهلي خراسان فخرج يريد آخرون فلما كان بالطالقان تلقاه دهاقين بلخ فمبوا النهر فأتاه حين عبر النهر ملك الصغانيان بهدايا ومفتاح من ذهب وأعطاه الطاعة ودعاه إلى نزول بلاده وكان ملك آخرون وشومان قد ضيق على ملك الصغانيان وغزاه فلذلك أعطى قتيبة ما أعطاه وأتى قتيبة ملك كفيان بنحو ما أتاه به ملك الصغانيان وسلما إليه بلديهما فانصرف قتيبة إلى مرو وخلف أخاه صالحاً على ما وراء النهر ففتح صالح كاسان وأورشت وهي من فرغانة وكان نصر بن سيار معه في جيشه وفتح سخر وفتح أخسكت من فرغانة وهي مدينتها القديمة وكان آخر من فتح كاسان وأورشت وقد انتقض أهلها نوح بن أسد في خلافة المنصور وأرسل ملك الجوزجان إلى قتيبة فصالحه على أن يأتيه فصار إليه ثم رجع فمات بالطالقان."
  en: "Al-Hajjaj gave Qutayba ibn Muslim al-Bahili Khurasan; marching on Akharun he was met at Talaqan by Balkh's dahqans bridging the river, and at the crossing by the Saghaniyan king bearing gifts and a golden key, yielding obedience and inviting him into his land — pressed by Akharun and Shuman's king — and Kafiyan's king came likewise, both surrendering their lands. Qutayba left his brother Salih beyond the river, who took Kasan and Urusht of Farghana — Nasr ibn Sayyar in his army — and Sakhr and Akhsikath, Farghana's old city; Kasan and Urusht, breached later, were last reopened by Nuh ibn Asad under al-Mansur. Juzjan's king truced on coming in person, came, returned, and died at Talaqan."
  es: "Al-Hajjaj le dio a Qutayba ibn Muslim al-Bahili Jorasán; marchando hacia Akharun, fue recibido en Talaqan por los dahqans de Balkh que cruzaban el río, y en el cruce por el rey de Saghaniyan que traía regalos y una llave de oro, rindiéndole obediencia e invitándolo a su tierra —presionado por Akharun y el rey de Shuman— y el rey de Kafiyan también llegó, ambos entregando sus tierras. Qutayba dejó a su hermano Salih al otro lado del río, quien tomó Kasan y Urusht de Farghana —Nasr ibn Sayyar en su ejército— y Sakhr y Akhsikath, la ciudad vieja de Farghana; Kasan y Urusht, conquistadas más tarde, fueron reabiertas por última vez por Nuh ibn Asad bajo el mando de al-Mansur. El rey de Juzjan se negó a venir en persona, llegó, regresó y murió en Talaqan."
  fr: "Al-Hajjaj offrit le Khorasan à Qutayba ibn Muslim al-Bahili. Marchant sur Akharun, il fut accueilli à Talaqan par les dahqans de Balkh qui enjambaient le fleuve. Au passage, le roi de Saghaniyan, apportant des présents et une clé d'or, lui soumit et l'invita sur ses terres, pressé par Akharun et le roi de Shuman. Le roi de Kafiyan arriva également, et tous deux cédèrent leurs terres. Qutayba laissa son frère Salih au-delà du fleuve, qui prit Kasan et Urusht de Ferghana – Nasr ibn Sayyar faisant partie de son armée – ainsi que Sakhr et Akhsikath, la vieille ville de Ferghana. Kasan et Urusht, reprises plus tard, furent rouvertes pour la dernière fois par Nuh ibn Asad sous le commandement d'al-Mansur. Le roi de Juzjan accepta une trêve à l'avance, vint, repartit et mourut à Talaqan."
  ur: "الحجاج نے قتیبہ بن مسلم الباہلی کو خراسان دیا۔ اخرون پر چلتے ہوئے اس کی ملاقات تالقان میں بلخ کے دہقانوں نے دریا کو پلتے ہوئے کی، اور کراسنگ پر صغانیان بادشاہ نے تحفے اور ایک سونے کی چابی لے کر، اطاعت کی اور اسے اپنی سرزمین میں مدعو کیا - جسے اخرون اور شومن کے بادشاہ نے دبایا - اور اسی طرح کافیان کے بادشاہ دونوں کی سرزمین پر اتر آئے۔ قتیبہ نے اپنے بھائی صالح کو دریا کے پار چھوڑ دیا، جس نے فرغانہ کے کاسان اور ارشت - نصر بن سیار کو اپنی فوج میں لے لیا - اور فرغانہ کا پرانا شہر صخر اور اخسیکت؛ کاسان اور اُرشت، جو بعد میں ٹوٹ گئے تھے، کو آخری بار نوح بن اسد نے المنصور کے تحت دوبارہ کھولا تھا۔ جوزجان کے بادشاہ نے ذاتی طور پر آنے پر یقین کیا، آیا، واپس آیا، اور طلقان میں مر گیا۔"
