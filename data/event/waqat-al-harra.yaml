label: { ar: "وقعة الحرة", en: "The Battle of al-Harra", es: "La batalla de al-Harra", fr: "La bataille d'al-Harra", ur: "حرہ کی جنگ", tr: "El-Harrah Muharebesi", id: "Pertempuran al-Harrah" }
summary:
  ar: "في سنة ثلاث وستين خلع أهل المدينة يزيد وخرجوا عليه لإسرافه في المعاصي — قال عبد الله بن حنظلة ابن الغسيل والله ما خرجنا على يزيد حتى خفنا أن نرمى بالحجارة من السماء — فأرسل إليهم جيشاً كثيفاً بقتالهم ثم المسير إلى مكة لقتال ابن الزبير، فكانت وقعة الحرة على باب طيبة، قال الحسن والله ما كاد ينجو منهم أحد قتل فيها خلق من الصحابة ومن غيرهم ونهبت المدينة وافتض فيها ألف عذراء، وكان عدد المقتولين فيها من قريش والأنصار ثلاث مئة وستة رجال {cite:tarikh-khulafa-minhaj-1434 p. 344-346}. وعند المسعودي قتل فيها خلق من بني هاشم وسائر قريش والأنصار منهم عبد الله بن جعفر وجعفر بن محمد بن علي والفضل بن العباس بن ربيعة وحمزة بن عبد الله بن نوفل والعباس بن عتبة بن أبي لهب وبضع وتسعون من قريش ومثلهم من الأنصار وأربعة آلاف ممن أدركه الإحصاء، وبايع الناس على أنهم عبيد ليزيد إلا علي بن الحسين وعلي بن عبد الله بن العباس، وفيها يقول محمد بن أسلم فإن تقتلونا يوم حرة واقم فنحن على الإسلام أول من قتل {cite:muruj-al-dhahab p. 67-68}"
  en: "In year 63 the Medinese deposed Yazid and rose against him for his excesses — Abdullah ibn Hanzala, son of the Ghassil, said 'we did not march out until we feared stones raining from heaven'. Yazid sent a dense army with orders to fight them then march on Mecca against Ibn al-Zubayr; the battle of the Harra fell on Medina's very gate — 'by God, scarcely one escaped', said al-Hasan; many Companions and others were killed, the city was pillaged, a thousand maidens violated, and the slain of Quraysh and the Ansar numbered three hundred and six {cite:tarikh-khulafa-minhaj-1434 p. 344-346}."
  es: "En el año 63, los medinenses depusieron a Yazid y se sublevaron contra él por sus excesos. Abdullah ibn Hanzala, hijo del Ghassil, dijo: «No salimos hasta que temimos que llovieran piedras del cielo». Yazid envió un numeroso ejército con órdenes de combatirlos y luego marchar sobre La Meca contra Ibn al-Zubayr. La batalla de Harra tuvo lugar a las puertas de Medina. «Por Dios, casi nadie escapó», dijo al-Hasan. Muchos Compañeros y otros fueron asesinados, la ciudad fue saqueada, mil doncellas fueron violadas y los muertos de los Quraysh y los Ansar ascendieron a trescientos seis {cite:tarikh-khulafa-minhaj-1434 p. 344-346}."
  fr: "En l'an 63, les Médinois déposèrent Yazid et se soulevèrent contre lui pour ses exactions. Abdullah ibn Hanzala, fils de Ghassil, déclara: « Nous ne sommes sortis en guerre que lorsque nous avons craint une pluie de pierres du ciel. » Yazid envoya une armée dense avec l'ordre de les combattre puis de marcher sur La Mecque contre Ibn al-Zubayr. La bataille de Harra eut lieu aux portes mêmes de Médine. « Par Dieu, presque personne n'en réchappa », dit al-Hasan. De nombreux Compagnons et d'autres furent tués, la ville fut pillée, mille jeunes filles violées, et les pertes parmi les Qurayshites et les Ansar s'élevèrent à trois cent six hommes (voir: Tarikh-Khulafa-Minhaj-1434, p. 344-346)."
  ur: "سنہ 63 میں مدینہ والوں نے یزید کو معزول کیا اور اس کی زیادتیوں پر اس کے خلاف اٹھ کھڑے ہوئے - عبداللہ ابن حنظلہ، ابن غسل نے کہا کہ 'ہم اس وقت تک باہر نہیں نکلے جب تک کہ ہمیں آسمان سے پتھروں کی بارش کا اندیشہ نہ ہو'۔ یزید نے ان سے لڑنے کا حکم دے کر ایک گھنی فوج بھیجی اور پھر ابن الزبیر کے خلاف مکہ کی طرف کوچ کیا۔ حرہ کی لڑائی مدینہ کے دروازے پر پڑی - 'خدا کی قسم، شاید ہی کوئی بچ سکے'، الحسن نے کہا؛ بہت سے صحابہ اور دوسرے مارے گئے، شہر کو لوٹ لیا گیا، ایک ہزار کنیزوں نے خلاف ورزی کی، اور قریش اور انصار کے مقتولین کی تعداد تین سو چھ تھی۔ 344-346}۔"
  tr: "63. yılda Medine halkı, aşırı günahları nedeniyle Yezid'i tahttan indirdi ve ona karşı isyan etti. Abdullah bin Hanzala bin Al-Ghasil, \"Allah'a yemin olsun ki, gökten taşlanmaktan korkana kadar Yezid'e karşı isyan etmedik\" dedi. Bunun üzerine onlarla savaşmak ve daha sonra İbn Al-Zubayr ile savaşmak için Mekke'ye yürümek üzere büyük bir ordu gönderdi. Taybe kapısında Harrah Muharebesi gerçekleşti. Hasan şöyle dedi: \"Allah'a yemin olsun ki, onlardan neredeyse hiç kimse kurtulamadı. Sahabelerden ve diğerlerinden birçoğu öldürüldü, Medine yağmalandı ve bin bakire namussuz edildi. Kureyş ve Ensar'dan öldürülenlerin sayısı üç yüz altı kişiydi.\" {cite:tarikh-khulafa-minhaj-1434 s. 344-346} El-Mas'udi'ye göre, bu olayda Beni Haşim'den, Kureyş'in geri kalanından ve Ensar'dan birçok kişi öldürüldü. Bunlar arasında Abdullah bin Cafer, Cafer bin Muhammed bin Ali, El-Fadl bin El-Abbas bin Rabi'ah, Hamza bin Abdullah bin Nevfel, El-Abbas bin Utbe bin Ebu Lahab, Kureyş'ten doksan küsur kişi ve Ensar'dan aynı sayıda kişi ile sayılan dört bin kişi vardı. Ali bin Hüseyin ve Ali bin Abdullah bin El-Abbas hariç, bu insanlar Yezid'e köle olarak biat ettiler. Muhammed bin Aslam şöyle dedi: \"Eğer bizi Harrah Vakim günü öldürürseniz, İslam için öldürülen ilk kişiler biz oluruz.\" {kaynak: Muruj-al-Dhahab s. 67-68}"
  id: "Pada tahun 63, penduduk Madinah menggulingkan Yazid dan memberontak terhadapnya karena dosa-dosanya yang berlebihan. Abdullah bin Hanzala bin Al-Ghasil berkata, “Demi Allah, kami tidak memberontak terhadap Yazid sampai kami takut akan dilempari batu dari langit.” Maka ia mengirimkan pasukan besar untuk melawan mereka dan kemudian berbaris ke Mekah untuk melawan Ibnu Al-Zubayr. Perang Al-Harrah terjadi di gerbang Taybah. Al-Hasan berkata, “Demi Allah, hampir tidak ada yang selamat dari mereka. Banyak Sahabat dan lainnya terbunuh di dalamnya, dan Madinah dijarah serta seribu perawan dinodai di dalamnya. Jumlah orang yang terbunuh di dalamnya dari kaum Quraisy dan Ansar adalah tiga ratus enam orang.” {cite:tarikh-khulafa-minhaj-1434 p. 344-346} Menurut Al-Mas’udi, banyak orang dari Bani Hasyim, sisa kaum Quraisy, dan kaum Ansar terbunuh di dalamnya, termasuk Abdullah bin Ja’far, Ja’far bin Muhammad bin Ali, Al-Fadl bin Al-Abbas bin Rabi’ah, Hamza bin Abdullah bin Nawfal, Al-Abbas bin Utbah bin Abi Lahab, sekitar sembilan puluh orang dari kaum Quraisy, dan jumlah yang sama dari kaum Ansar, dan empat ribu orang yang dihitung. Orang-orang tersebut berbaiat kepada Yazid sebagai budak, kecuali Ali bin Al-Hussein dan Ali bin Abdullah bin Al-Abbas. Di dalamnya, Muhammad bin Aslam berkata, “Jika kalian membunuh kami pada hari Harrah Waqim, maka kamilah yang pertama kali terbunuh karena Islam.” {kutip:muruj-al-dhahab hlm. 67-68}"
