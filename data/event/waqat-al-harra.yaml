label: { ar: "وقعة الحرة", en: "The Battle of al-Harra" }
summary:
  ar: "في سنة ثلاث وستين خلع أهل المدينة يزيد وخرجوا عليه لإسرافه في المعاصي — قال عبد الله بن حنظلة ابن الغسيل والله ما خرجنا على يزيد حتى خفنا أن نرمى بالحجارة من السماء — فأرسل إليهم جيشاً كثيفاً بقتالهم ثم المسير إلى مكة لقتال ابن الزبير، فكانت وقعة الحرة على باب طيبة، قال الحسن والله ما كاد ينجو منهم أحد قتل فيها خلق من الصحابة ومن غيرهم ونهبت المدينة وافتض فيها ألف عذراء، وكان عدد المقتولين فيها من قريش والأنصار ثلاث مئة وستة رجال {cite:tarikh-khulafa-minhaj-1434 p. 344-346}. وعند المسعودي قتل فيها خلق من بني هاشم وسائر قريش والأنصار منهم عبد الله بن جعفر وجعفر بن محمد بن علي والفضل بن العباس بن ربيعة وحمزة بن عبد الله بن نوفل والعباس بن عتبة بن أبي لهب وبضع وتسعون من قريش ومثلهم من الأنصار وأربعة آلاف ممن أدركه الإحصاء، وبايع الناس على أنهم عبيد ليزيد إلا علي بن الحسين وعلي بن عبد الله بن العباس، وفيها يقول محمد بن أسلم فإن تقتلونا يوم حرة واقم فنحن على الإسلام أول من قتل {cite:muruj-al-dhahab p. 67-68}"
  en: "In year 63 the Medinese deposed Yazid and rose against him for his excesses — Abdullah ibn Hanzala, son of the Ghassil, said 'we did not march out until we feared stones raining from heaven'. Yazid sent a dense army with orders to fight them then march on Mecca against Ibn al-Zubayr; the battle of the Harra fell on Medina's very gate — 'by God, scarcely one escaped', said al-Hasan; many Companions and others were killed, the city was pillaged, a thousand maidens violated, and the slain of Quraysh and the Ansar numbered three hundred and six {cite:tarikh-khulafa-minhaj-1434 p. 344-346}."
