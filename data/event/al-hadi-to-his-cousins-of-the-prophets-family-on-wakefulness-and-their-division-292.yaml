id: event/al-hadi-to-his-cousins-of-the-prophets-family-on-wakefulness-and-their-division-292
class: event
kind: other
label:
  ar: "قصيدة الهادي إلى بني عمه من آل الرسول في السهر وتفرق الطالبيين، ص300-301"
  en: "Al-Hadi's poem to his cousins of the family of the Messenger on sleeplessness and the division of the Talibids, pp. 300-301"
  ur: "ہادی کی اپنے رسول کی آل کے چچازادوں کے نام نظم: بے خوابی اور طالبیوں کی تفرقہ بازی، ص300-301"
  es: "Poema de Al-Hadi a sus primos de la familia del Mensajero sobre el insomnio y la división de los talibanes, págs. 300-301."
summary:
  ar: "تبدأ في آخر ص300 قصيدة «إلى بني عمه من آل رسول الله» يقول فيها إن الهموم أبعدت النوم عن عينيه وإنه يفكر في الدنيا وحقارة شأنها، ثم يصف في ص301 حرص الناس على شهواتهم وجمعهم وبخلهم، ويشكو أن أهل الحق قليل خذلهم أنصارهم، وأن آل الرسول انشغلوا بالحقد والضغائن، وأن الطالبيين لم يطلبوا إرث النبوة بالقنا وحقهم عند غيرهم."
  en: "At the foot of p. 300 a poem \"to his cousins of the family of the Messenger\" begins in which he says that cares have driven sleep from his eyes and that he thinks about the world and the smallness of its affairs; on p. 301 he describes people's hunger for their desires, their hoarding and miserliness, and complains that the people of the right are few and left by their helpers, that the family of the Messenger are busied with rancour and grudges, and that the Talibids have not sought the inheritance of prophecy with the lance while their right lies with others."
  ur: "ص300 کے آخر میں «اپنے رسول اللہ کی آل کے چچازادوں کے نام» ایک نظم شروع ہوتی ہے جس میں وہ کہتا ہے کہ فکروں نے اس کی آنکھوں سے نیند اڑا دی ہے اور وہ دنیا اور اس کی حقیر باتوں کے بارے میں سوچتا ہے؛ ص301 پر وہ لوگوں کی اپنی خواہشوں کی حرص، جمع اندوزی اور بخل کا حال بیان کرتا ہے اور شکایت کرتا ہے کہ اہل حق تھوڑے ہیں جنہیں ان کے مددگاروں نے چھوڑ دیا، کہ رسول کی آل کینے اور عداوتوں میں لگ گئی، اور طالبیوں نے نبوت کی میراث کو نیزے سے طلب نہیں کیا جب کہ ان کا حق دوسروں کے پاس ہے۔"
  es: "Al pie de la página 300 comienza un poema \"a sus primos de la familia del Mensajero\" en el que dice que las preocupaciones le han quitado el sueño y que piensa en el mundo y en la pequeñez de sus asuntos; en la página 301 describe el hambre de la gente por sus deseos, su avaricia y tacañería, y se queja de que la gente de derecha es poca y está abandonada por sus ayudantes, que la familia del Mensajero está ocupada con rencores y resentimientos, y que los talíbidas no han buscado la herencia de la profecía con la lanza mientras que su derecho está en manos de otros."
