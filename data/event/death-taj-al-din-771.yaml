id: event/death-taj-al-din-771
class: event
kind: other
label:
  ar: "وفاة تاج الدين السبكي بدمشق، ٧ ذي الحجة ٧٧١هـ"
  en: "Death of Taj al-Din al-Subki in Damascus, 7 Dhu al-Hijja 771"
  ur: "تاج الدین سبکی کی وفات، دمشق، 7 ذی الحجہ 771ھ"
  es: "Muerte de Taj al-Din al-Subki en Damasco, 7 Dhu al-Hijja 771"
  fr: "Décès du Taj al-Din al-Subki à Damas, le 7 Dhu al-Hijja 771"
  tr: "Taj al-Din al-Subki'nin Şam'da ölümü, Zilhicce'nin 7. yılı H. 771"
  id: "Wafatnya Taj al-Din al-Subki di Damaskus, 7 Dzulhijjah 771 H"
summary:
  ar: "توفي قاضي القضاة تاج الدين عبد الوهاب بن تقي الدين السبكي بدمشق ليلة الثلاثاء سابع ذي الحجة سنة ٧٧١هـ، أي نحو ٢ يوليو ١٣٧٠م، وقد خُطب يوم الجمعة قبلها فطُعن ليلة السبت رابع الشهر؛ وتذكر الموسوعة الإسلامية أنه مات بالطاعون بعد قليل من إطلاقه {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Chief qadi Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki died in Damascus on the night of Tuesday 7 Dhu al-Hijja 771 (c. 2 July 1370), having been stricken on the preceding Saturday night after the Friday sermon; the Encyclopaedia of Islam records that he died of plague soon after his release {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "قاضی القضاة تاج الدین عبد الوہاب بن تقی الدین سبکی دمشق میں منگل کی رات 7 ذی الحجہ 771ھ ⁦(تقریباً 2 جولائی 1370ء)⁩ کو فوت ہوئے؛ جمعے کی خطبت کے بعد ہفتے کی رات اچانک بیمار ہوئے تھے۔ اسلامی دائرۃ المعارف کے مطابق وہ رہائی کے فوراً بعد طاعون سے فوت ہوئے {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
  es: "El cadí principal Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki murió en Damasco la noche del martes 7 de Dhu al-Hijja 771 (c. 2 de julio de 1370), tras haber sido afectado la noche del sábado anterior después del sermón del viernes; la Enciclopedia del Islam registra que murió de peste poco después de su liberación {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  fr: "Le grand cadi Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki est décédé à Damas dans la nuit du mardi 7 Dhu al-Hijja 771 (vers le 2 juillet 1370), après avoir été frappé par la peste la nuit précédente, après le sermon du vendredi; l'Encyclopédie de l'Islam rapporte qu'il est mort de la peste peu après sa libération {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  tr: "Başyargıç Tecddin Abdülvahab ibn Takîddin Subki, Hicri 771 yılının Zilhicce ayının yedinci Salı gecesi (yaklaşık 2 Temmuz 1370 Miladi) Şam'da vefat etti. Bundan önce Cuma hutbesini vermişti ve ayın dördüncü Cumartesi gecesi bıçaklanmıştı. İslam Ansiklopedisi, serbest bırakıldıktan kısa bir süre sonra vebadan öldüğünü belirtmektedir. {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}"
  id: "Ketua Mahkamah Agung Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki wafat di Damaskus pada malam Selasa, tanggal 7 Dzul Hijjah, 771 H, yang kira-kira bertepatan dengan tanggal 2 Juli 1370 M. Sebelumnya, beliau telah menyampaikan khutbah Jumat, dan ditikam pada malam Sabtu, tanggal 4 bulan tersebut. Ensiklopedia Islam menyebutkan bahwa beliau meninggal karena wabah penyakit tak lama setelah dibebaskan. {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
