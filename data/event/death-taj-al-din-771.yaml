label:
  ar: "وفاة تاج الدين السبكي بدمشق، ٧ ذي الحجة ٧٧١هـ"
  en: "Death of Taj al-Din al-Subki in Damascus, 7 Dhu al-Hijja 771"
  ur: "تاج الدین سبکی کی وفات، دمشق، 7 ذی الحجہ 771ھ"
summary:
  ar: "توفي قاضي القضاة تاج الدين عبد الوهاب بن تقي الدين السبكي بدمشق ليلة الثلاثاء سابع ذي الحجة سنة ٧٧١هـ، أي نحو ٢ يوليو ١٣٧٠م، وقد خُطب يوم الجمعة قبلها فطُعن ليلة السبت رابع الشهر؛ وتذكر الموسوعة الإسلامية أنه مات بالطاعون بعد قليل من إطلاقه {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Chief qadi Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki died in Damascus on the night of Tuesday 7 Dhu al-Hijja 771 (c. 2 July 1370), having been stricken on the preceding Saturday night after the Friday sermon; the Encyclopaedia of Islam records that he died of plague soon after his release {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "قاضی القضاة تاج الدین عبد الوہاب بن تقی الدین سبکی دمشق میں منگل کی رات 7 ذی الحجہ 771ھ (تقریباً 2 جولائی 1370ء) کو فوت ہوئے؛ جمعے کی خطبت کے بعد ہفتے کی رات اچانک بیمار ہوئے تھے۔ اسلامی دائرۃ المعارف کے مطابق وہ رہائی کے فوراً بعد طاعون سے فوت ہوئے {cite:durar-kamina-jil-1993 2/426-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
