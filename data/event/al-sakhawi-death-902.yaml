label:
  ar: "وفاة الحافظ السخاوي بالمدينة ودفنه بالبقيع، ٢٨ شعبان ٩٠٢هـ/١٤٩٧م"
  en: "Death of the hafiz al-Sakhawi in Medina, buried in al-Baqi', 28 Sha'ban 902/1497"
  ur: "حافظ سخاوی کی مدینہ میں وفات اور بقیع میں تدفین، 28 شعبان 902ھ/1497ء"
  es: "Muerte del hafiz al-Sakhawi en Medina, enterrado en al-Baqi', 28 Sha'ban 902/1497"
  fr: "Décès du hafiz al-Sakhawi à Médine, enterré à al-Baqi', 28 Sha'ban 902/1497"
  tr: "El-Hafız El-Sakhavi, Medine'de öldü ve El-Baki'de gömüldü, 28 Şaban 902 H./1497"
  id: "Al-Hafiz Al-Sakhawi wafat di Madinah dan dimakamkan di Al-Baqi', 28 Sya'ban 902 H/1497 M."
summary:
  ar: "توفي السخاوي بالمدينة المنورة يوم الأحد ثامن وعشرين شعبان سنة ٩٠٢هـ ⁦(نحو أول مايو ١٤٩٧م)⁩، وصُلي عليه بعد صلاة صبح يوم الاثنين ووُقف بنعشه تجاه الحجرة النبوية، ودُفن بالبقيع بجوار مشهد الإمام مالك؛ وقال ابن العماد «ولم يخلف بعده مثله» {cite:shadharat-dhahab p. 433}. وانتهى إليه علم الجرح والتعديل حتى قيل لم يكن بعد الذهبي أحد سلك مسلكه {cite:shadharat-dhahab p. 432}."
  en: "Al-Sakhawi died in Medina on Sunday 28 Sha'ban 902 (c. 1 May 1497); the funeral prayer was held after the dawn prayer on the Monday, his bier was stood facing the Prophetic Chamber, and he was buried in al-Baqi' beside the shrine of Imam Malik — 'he left no one like him', wrote Ibn al-Imad {cite:shadharat-dhahab p. 433}. With him the science of jarh wa-ta'dil reached its end: none after al-Dhahabi had walked his path, it was said {cite:shadharat-dhahab p. 432}."
  ur: "سخاوی اتوار 28 شعبان 902ھ ⁦(تقریباً یکم مئی 1497ء)⁩ کو مدینہ میں فوت ہوا؛ پیر کو نمازِ فجر کے بعد نمازِ جنازہ ادا کی گئی، اس کا جنازہ حجرہ نبوی کے سامنے رکھا گیا اور وہ بقیع میں امام مالک کے مقبرے کے پہلو میں دفن کیا گیا — ابن عماد لکھتا ہے «اس کے بعد اس جیسا کوئی نہ چھوڑا» {cite:shadharat-dhahab p. 433}۔ اسی کے ساتھ علمِ جرح و تعدیل اپنے اختتام کو پہنچا: کہا جاتا ہے ذہبی کے بعد کسی نے اس کا راستہ نہ اختیار کیا {cite:shadharat-dhahab p. 432}۔"
  es: "Al-Sakhawi murió en Medina el domingo 28 de Sha'ban de 902 (aprox. 1 de mayo de 1497); la oración fúnebre se celebró después de la oración del amanecer del lunes, su féretro fue colocado frente a la Cámara Profética y fue enterrado en al-Baqi' junto al santuario del Imam Malik. «No dejó a nadie como él», escribió Ibn al-Imad {cita: shadharat-dhahab p. 433}. Con él llegó a su fin la ciencia del jarh wa-ta'dil: nadie después de al-Dhahabi había seguido su camino, se decía {cita: shadharat-dhahab p. 432}."
  fr: "Al-Sakhawi mourut à Médine le dimanche 28 Sha'ban 902 (vers le 1er mai 1497). La prière funéraire eut lieu après la prière de l'aube du lundi. Son cercueil fut placé face à la Chambre du Prophète et il fut inhumé à al-Baqi', près du mausolée de l'imam Malik. « Il n'a laissé personne comme lui », écrivit Ibn al-Imad (cf. shadharat-dhahab, p. 433). Avec lui, la science du jarh wa-ta'dil s'éteignit: nul après al-Dhahabi n'eut suivi sa voie, disait-on (cf. shadharat-dhahab, p. 432)."
  tr: "El-Sakhawi, Hicri 902 yılının Şaban ayının 28. Pazar günü (yaklaşık olarak 1 Mayıs 1497 Miladi) Medine'de vefat etti. Cenaze namazı Pazartesi günü sabah namazından sonra kılındı ve tabutu Peygamberimizin odasına doğru yerleştirildi. İmam Malik türbesinin yakınındaki el-Baki mezarlığına defnedildi. İbn el-İmad, \"Ondan sonra onun gibisi kalmadı\" demiştir (kaynak: Şadharat-Dhahab, s. 433). Biyografik değerlendirme ilmi (el-cerh ve el-te'dil) ona kadar aktarılmış, hatta El-Dhahabi'den sonra kimsenin onun yolunu izlemediği söylenmiştir (kaynak: Şadharat-Dhahab, s. 432)."
  id: "Al-Sakhawi wafat di Madinah pada hari Minggu, tanggal 28 Sya'ban 902 H (kira-kira 1 Mei 1497 M). Shalat jenazahnya dilaksanakan setelah shalat Subuh pada hari Senin, dan peti jenazahnya diletakkan menghadap kamar Nabi. Beliau dimakamkan di pemakaman al-Baqi' dekat makam Imam Malik. Ibn al-'Imad berkata, \"Tidak ada seorang pun yang seperti beliau setelahnya\" {kutip:shadharat-dhahab hlm. 433}. Ilmu evaluasi biografi (al-jarh wa al-ta'dil) diwariskan kepadanya, hingga dikatakan tidak ada seorang pun setelah al-Dhahabi yang mengikuti jejaknya {kutip:shadharat-dhahab hlm. 432}."
