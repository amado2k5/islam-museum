label:
  ar: "وفاة الحافظ السخاوي بالمدينة ودفنه بالبقيع، ٢٨ شعبان ٩٠٢هـ/١٤٩٧م"
  en: "Death of the hafiz al-Sakhawi in Medina, buried in al-Baqi', 28 Sha'ban 902/1497"
  ur: "حافظ سخاوی کی مدینہ میں وفات اور بقیع میں تدفین، 28 شعبان 902ھ/1497ء"
summary:
  ar: "توفي السخاوي بالمدينة المنورة يوم الأحد ثامن وعشرين شعبان سنة ٩٠٢هـ ⁦(نحو أول مايو ١٤٩٧م)⁩، وصُلي عليه بعد صلاة صبح يوم الاثنين ووُقف بنعشه تجاه الحجرة النبوية، ودُفن بالبقيع بجوار مشهد الإمام مالك؛ وقال ابن العماد «ولم يخلف بعده مثله» {cite:shadharat-dhahab p. 433}. وانتهى إليه علم الجرح والتعديل حتى قيل لم يكن بعد الذهبي أحد سلك مسلكه {cite:shadharat-dhahab p. 432}."
  en: "Al-Sakhawi died in Medina on Sunday 28 Sha'ban 902 (c. 1 May 1497); the funeral prayer was held after the dawn prayer on the Monday, his bier was stood facing the Prophetic Chamber, and he was buried in al-Baqi' beside the shrine of Imam Malik — 'he left no one like him', wrote Ibn al-Imad {cite:shadharat-dhahab p. 433}. With him the science of jarh wa-ta'dil reached its end: none after al-Dhahabi had walked his path, it was said {cite:shadharat-dhahab p. 432}."
  ur: "سخاوی اتوار 28 شعبان 902ھ ⁦(تقریباً یکم مئی 1497ء)⁩ کو مدینہ میں فوت ہوا؛ پیر کو نمازِ فجر کے بعد نمازِ جنازہ ادا کی گئی، اس کا جنازہ حجرہ نبوی کے سامنے رکھا گیا اور وہ بقیع میں امام مالک کے مقبرے کے پہلو میں دفن کیا گیا — ابن عماد لکھتا ہے «اس کے بعد اس جیسا کوئی نہ چھوڑا» {cite:shadharat-dhahab p. 433}۔ اسی کے ساتھ علمِ جرح و تعدیل اپنے اختتام کو پہنچا: کہا جاتا ہے ذہبی کے بعد کسی نے اس کا راستہ نہ اختیار کیا {cite:shadharat-dhahab p. 432}۔"
