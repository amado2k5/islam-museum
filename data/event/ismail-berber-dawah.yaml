label: { ar: "دعوة إسماعيل بن عبد الله وعمر للبربر", en: "Isma'il ibn Abdallah and Umar II's Mission to the Berbers", es: "La misión de Isma'il ibn Abdallah y Umar II a los bereberes.", fr: "La mission d'Ismaïl ibn Abdallah et d'Omar II auprès des Berbères", ur: "اسماعیل بن عبداللہ اور عمر دوم کا بربروں کا مشن" }
summary:
  ar: "عند البلاذري: لما كانت خلافة عمر بن عبد العزيز ولّى المغرب إسماعيل بن عبد الله بن أبي المهاجر مولى بني مخزوم فسار أحسن سيرة ودعا البربر إلى الإسلام وكتب إليهم عمر بن عبد العزيز كتباً يدعوهم بعدُ إلى ذلك فقرأها إسماعيل عليهم في النواحي فغلب الإسلام على المغرب."
  en: "In al-Baladhuri: in Umar ibn Abd al-Aziz's caliphate he gave the Maghreb to Isma'il ibn Abdallah ibn Abi al-Muhajir, mawla of Banu Makhzum, who walked the best of paths and called the Berbers to Islam — and Umar ibn Abd al-Aziz wrote them letters summoning them to it besides, which Isma'il read out to them through the districts, until Islam mastered the Maghreb."
  es: "En al-Baladhuri: durante el califato de Umar ibn Abd al-Aziz, este entregó el Magreb a Isma'il ibn Abdallah ibn Abi al-Muhajir, mawla de Banu Makhzum, quien recorrió los mejores caminos y llamó a los bereberes al Islam; además, Umar ibn Abd al-Aziz les escribió cartas invitándolos a unirse a él, las cuales Isma'il les leyó por los distritos, hasta que el Islam dominó el Magreb."
  fr: "Dans al-Baladhuri: sous le califat d'Umar ibn Abd al-Aziz, celui-ci confia le Maghreb à Isma'il ibn Abdallah ibn Abi al-Muhajir, mawla des Banu Makhzum, qui suivit la meilleure voie et appela les Berbères à l'islam — et Umar ibn Abd al-Aziz leur écrivit également des lettres les y invitant, qu'Isma'il leur lut à travers les districts, jusqu'à ce que l'islam domine le Maghreb."
  ur: "البلادوری میں ہے: عمر بن عبد العزیز کی خلافت میں اس نے مغرب بنو مخزوم کے مولا اسماعیل بن عبداللہ ابن ابی المہاجر کو دیا، جو بہترین راستے پر چلتے تھے اور بربروں کو اسلام کی طرف بلاتے تھے- اور عمر بن عبدالعزیز نے انہیں عبدالعزیز کے نام خط لکھا تھا۔ انہیں اضلاع میں پڑھ کر سنائیں، یہاں تک کہ اسلام مغرب پر عبور حاصل کر لیا۔"
