summary:
  ar: "عند البلاذري: لما كانت خلافة عمر بن عبد العزيز ولّى المغرب إسماعيل بن عبد الله بن أبي المهاجر مولى بني مخزوم فسار أحسن سيرة ودعا البربر إلى الإسلام وكتب إليهم عمر بن عبد العزيز كتباً يدعوهم بعدُ إلى ذلك فقرأها إسماعيل عليهم في النواحي فغلب الإسلام على المغرب."
  en: "In al-Baladhuri: in Umar ibn Abd al-Aziz's caliphate he gave the Maghreb to Isma'il ibn Abdallah ibn Abi al-Muhajir, mawla of Banu Makhzum, who walked the best of paths and called the Berbers to Islam — and Umar ibn Abd al-Aziz wrote them letters summoning them to it besides, which Isma'il read out to them through the districts, until Islam mastered the Maghreb."
