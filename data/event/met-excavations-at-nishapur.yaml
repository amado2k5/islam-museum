label: { ar: "حفريات متحف المتروبوليتان في نيسابور ⁦(1935–1940، 1947)⁩", en: "The Metropolitan Museum's excavations at Nishapur (1935–1940, 1947)", ur: "نیشاپور میں میٹروپولیٹن میوزیم کی کھدائیاں ⁦(1935–1940، 1947)⁩", es: "Las excavaciones del Museo Metropolitano en Nishapur (1935-1940, 1947)", fr: "Les fouilles du Metropolitan Museum à Nishapur (1935-1940, 1947)", tr: "Nişapur'daki Metropolitan Sanat Müzesi Kazıları (1935–1940, 1947)", id: "Penggalian Museum Seni Metropolitan di Nishapur (1935–1940, 1947)" }
summary:
  ar: "حفريات البعثة الإيرانية لمتحف المتروبوليتان في مدينة نيسابور القديمة بخراسان، بدأت بحفريات تجريبية سنة 1935 واستمرت إلى 1940 ثم موسم 1947، وكشفت بيوتًا ومصليات ومجمعًا رسميًا في تبه مدرسة ونقودًا كثيرة وأفران فخار، ولم تجد أثرًا لنيسابور الساسانية {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 25} {cite:wilkinson-nishapur-pottery p. 27}."
  en: "The excavations of the Metropolitan Museum's Iranian Expedition at ancient Nishapur in Khurasan, from test digs in 1935 to 1940 and a season in 1947, which uncovered houses, prayer halls, an official complex at Tepe Madraseh, many coins and pottery kilns, but no trace of Sasanian Nishapur {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 25} {cite:wilkinson-nishapur-pottery p. 27}."
  ur: "خراسان کے قدیم شہر نیشاپور میں میٹروپولیٹن میوزیم کی ایرانی مہم کی کھدائیاں، 1935ء کی آزمائشی کھدائی سے 1940ء تک اور 1947ء کا موسم؛ مکانات، نماز گاہیں، تپہ مدرسہ کا سرکاری احاطہ، بہت سے سکے اور بھٹیاں ملیں، مگر ساسانی نیشاپور کا نشان نہ ملا {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 27}."
  es: "Las excavaciones de la Expedición Iraní del Museo Metropolitano en la antigua Nishapur en Khurasan, desde excavaciones de prueba en 1935 a 1940 y una temporada en 1947, que desenterraron casas, salas de oración, un complejo oficial en Tepe Madraseh, muchas monedas y hornos de cerámica, pero ningún rastro de la Nishapur sasánida {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 25} {cite:wilkinson-nishapur-pottery p. 27}."
  fr: "Les fouilles de l'expédition iranienne du Metropolitan Museum à l'ancienne Nishapur du Khorasan, depuis les fouilles de sondage de 1935 à 1940 et une saison en 1947, qui ont mis au jour des maisons, des salles de prière, un complexe officiel à la madrasa de Tepe, de nombreuses pièces de monnaie et des fours de poterie, mais aucune trace de Nishapur sassanide {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 25} {cite:wilkinson-nishapur-pottery p. 27}."
  tr: "Metropolitan Müzesi'nin İran misyonunun Horasan'daki antik Nişapur kentindeki kazıları, 1935'te deneysel kazılarla başladı ve 1940'a kadar, ardından 1947 sezonuna kadar devam etti. Kazılarda evler, şapeller, Tepe Medresesi'nde resmi bir kompleks, çok sayıda sikke ve çömlek fırını bulundu, ancak Sasani Nişapur'una dair herhangi bir iz bulunamadı. {cite:wilkinson-nishapur-pottery s. 24} {cite:wilkinson-nishapur-pottery s. 25} {cite:wilkinson-nishapur-pottery s. 27}"
  id: "Penggalian yang dilakukan oleh misi Iran dari Museum Metropolitan di kota kuno Nishapur di Khorasan dimulai dengan penggalian eksperimental pada tahun 1935 dan berlanjut hingga tahun 1940 dan kemudian musim penggalian tahun 1947, dan mengungkap rumah-rumah, kapel, kompleks resmi di Madrasah Tepe, banyak koin dan tempat pembakaran tembikar, tetapi tidak menemukan jejak Nishapur Sasanian {cite:wilkinson-nishapur-pottery p. 24} {cite:wilkinson-nishapur-pottery p. 25} {cite:wilkinson-nishapur-pottery p. 27}."
