summary:
  en: "A successful raid in Jumada al-Akhirah 3 AH led by Zayd ibn Haritha with 100 riders to al-Qarada in Najd, intercepting a rich Quraysh caravan led by Safwan ibn Umayya valued at 100,000 dirhams."
  ar: "سرية ناجحة قادها زيد بن حارثة في مائة راكب في جمادى الآخرة 3هـ إلى ماء القردة بنجد؛ فاجأت قافلة صفوان بن أمية السالكة طريق العراق فغنم المسلمون فضة وبضائع بمائة ألف درهم وأسروا فرات بن حيان."
  es: "Una incursión exitosa en Jumada al-Akhirah 3 AH dirigida por Zayd ibn Haritha con 100 jinetes a al-Qarada en Najd, interceptando una rica caravana Quraysh liderada por Safwan ibn Umayya valorada en 100.000 dirhams."
  fr: "Un raid réussi à Jumada al-Akhirah 3 AH mené par Zayd ibn Haritha avec 100 cavaliers jusqu'à al-Qarada dans le Najd, interceptant une riche caravane Quraysh dirigée par Safwan ibn Umayya d'une valeur de 100 000 dirhams."
  ur: "جمادی الآخرہ 3 ہجری میں زید بن حارثہ کی قیادت میں 100 سواروں کے ساتھ نجد میں القرادہ کی طرف ایک کامیاب حملہ، صفوان بن امیہ کی قیادت میں قریش کے ایک امیر قافلہ کو روکا جس کی قیمت 100,000 درہم تھی۔"
