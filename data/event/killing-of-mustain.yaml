id: event/killing-of-mustain
class: event
kind: death
label: { ar: "مقتل المستعين" }
summary:
  ar: "في شوال سنة اثنتين وخمسين ومائتين قُتل المستعين، بعد أن نُقل من واسط إلى القاطول، واختلفت الروايات في كيفية قتله {cite:tabari-tarikh-abu-al-fadl j.9 p.362} {cite:tabari-tarikh-abu-al-fadl j.9 p.363}، وذكر الطبري في الموضع نفسه حمل جماعة من الطالبيين من بغداد إلى سامراء {cite:tabari-tarikh-abu-al-fadl j.9 p.369}، وعند السيوطي أرسل المعتز إلى أحمد بن طولون أن يقتله فقال والله لا أقتل أولاد الخلفاء فندب له سعيد الحاجب فذبحه ثالث شوال من السنة وله إحدى وثلاثون سنة {cite:tarikh-khulafa-minhaj-1434 p. 556}. وعند المسعودي بعث المعتز سعيد بن صالح الحاجب في شهر رمضان سنة اثنتين وخمسين ومائتين فلقيه قرب القاطول فقنعه بالسوط وأضجعه وقعد على صدره واحتز رأسه وترك جثته على الطريق حتى دفنتها العامة، وكان قد أحدر إلى دار الحسن بن وهب ببغداد ثم إلى واسط ووكيله أحمد بن طولون التركي قبل ولايته مصر، وكانت وفاته يوم الأربعاء لست خلون من شوال وهو ابن خمس وثلاثين سنة {cite:muruj-al-dhahab p. 545-546}"
