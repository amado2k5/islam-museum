label: { ar: "مقتل المستعين", en: "The killing of al-Musta'in" }
summary:
  ar: "في شوال سنة اثنتين وخمسين ومائتين قُتل المستعين، بعد أن نُقل من واسط إلى القاطول، واختلفت الروايات في كيفية قتله {cite:tabari-tarikh-abu-al-fadl j.9 p.362} {cite:tabari-tarikh-abu-al-fadl j.9 p.363}، وذكر الطبري في الموضع نفسه حمل جماعة من الطالبيين من بغداد إلى سامراء {cite:tabari-tarikh-abu-al-fadl j.9 p.369}، وعند السيوطي أرسل المعتز إلى أحمد بن طولون أن يقتله فقال والله لا أقتل أولاد الخلفاء فندب له سعيد الحاجب فذبحه ثالث شوال من السنة وله إحدى وثلاثون سنة {cite:tarikh-khulafa-minhaj-1434 p. 556}. وعند المسعودي بعث المعتز سعيد بن صالح الحاجب في شهر رمضان سنة اثنتين وخمسين ومائتين فلقيه قرب القاطول فقنعه بالسوط وأضجعه وقعد على صدره واحتز رأسه وترك جثته على الطريق حتى دفنتها العامة، وكان قد أحدر إلى دار الحسن بن وهب ببغداد ثم إلى واسط ووكيله أحمد بن طولون التركي قبل ولايته مصر، وكانت وفاته يوم الأربعاء لست خلون من شوال وهو ابن خمس وثلاثين سنة {cite:muruj-al-dhahab p. 545-546}"
  en: "In Shawwal of the year 252 al-Musta'in was killed, after being moved from Wasit to al-Qatul; the accounts differ on how he was killed {cite:tabari-tarikh-abu-al-fadl j.9 p.362} {cite:tabari-tarikh-abu-al-fadl j.9 p.363}. In the same place al-Tabari mentions that a group of the Talibids were carried from Baghdad to Samarra {cite:tabari-tarikh-abu-al-fadl j.9 p.369}. According to al-Suyuti, al-Mu'tazz sent to Ahmad ibn Tulun to kill him; he said: 'By God, I will not kill the sons of caliphs', so al-Mu'tazz commissioned the chamberlain Sa'id, who slaughtered him on the third of Shawwal of that year, when he was thirty-one {cite:tarikh-khulafa-minhaj-1434 p. 556}. According to al-Mas'udi, al-Mu'tazz sent Sa'id ibn Salih the chamberlain in Ramadan of the year 252; he met him near al-Qatul, struck him on the head with a whip, threw him down, sat on his chest, and cut off his head, leaving his body on the road until the common people buried it. He had been moved down to the house of al-Hasan ibn Wahb in Baghdad, then to Wasit, where his agent was Ahmad ibn Tulun the Turk, before Ahmad's appointment to Egypt. He died on Wednesday, six nights into Shawwal, aged thirty-five {cite:muruj-al-dhahab p. 545-546}."
