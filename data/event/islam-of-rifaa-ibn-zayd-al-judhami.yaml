label: { ar: "قدوم رفاعة بن زيد الجذامي وإسلامه وكتاب النبي لقومه", en: "Rifa'a ibn Zayd al-Judhami comes to the Prophet, embraces Islam and carries his letter to his people", es: "Rifa'a ibn Zayd al-Judhami acude al Profeta, abraza el Islam y lleva su carta a su pueblo.", fr: "Rifa'a ibn Zayd al-Judhami se rend auprès du Prophète, se convertit à l'islam et porte sa lettre à son peuple.", ur: "رفاعہ بن زید الجثمی رسول اللہ کے پاس آئے، اسلام قبول کیا اور اپنا خط اپنی قوم کے پاس لے گئے۔" }
summary:
  ar: "قدم رفاعة بن زيد الجذامي ثم الضبيبي على النبي في هدنة الحديبية قبل خيبر، فأهدى له غلاماً وأسلم فحسن إسلامه، وكتب له النبي كتاباً إلى قومه: إنه بعثه إلى قومه عامة ومن دخل فيهم يدعوهم إلى الله ورسوله، فمن أقبل فهو في حزب الله وحزب رسوله، ومن أدبر فله أمان شهرين؛ فلما قدم على قومه أجابوا وأسلموا ثم ساروا إلى حرة الرجلاء فنزلوها."
  en: "Rifa'a ibn Zayd al-Judhami, of the Dubayb, came to the Prophet during the Hudaybiyya truce before Khaybar, gave him a slave and became a good Muslim; the Prophet wrote him a letter to his people: he sent him to all his people and whoever joined them, to call them to God and His Messenger, and whoever came forward was in God's party and the Messenger's, while whoever turned away had two months' safety. His people answered and embraced Islam, then moved to Harrat al-Rajla' and settled there."
  es: "Rifa'a ibn Zayd al-Judhami, de Dubayb, se presentó ante el Profeta durante la tregua de Hudaybiyya, antes de Khaybar, le ofreció un esclavo y se convirtió en un buen musulmán. El Profeta le escribió una carta a su pueblo: lo envió a todos sus súbditos y a quienes se unieran a ellos, para que los invitaran a Dios y a Su Mensajero. Quien se presentara formaría parte del bando de Dios y del Mensajero, mientras que quien se apartara tendría dos meses de protección. Su pueblo respondió y abrazó el Islam, tras lo cual se trasladó a Harrat al-Rajla' y se estableció allí."
  fr: "Rifa'a ibn Zayd al-Judhami, de la tribu des Dubayb, vint trouver le Prophète durant la trêve des Hudaybiyya, avant Khaybar. Il lui offrit un esclave et se convertit à l'islam. Le Prophète lui écrivit une lettre à son peuple: il l'envoya appeler tous les siens et ceux qui se joignaient à lui à Dieu et à Son Messager. Quiconque répondait à l'appel entrait dans le camp de Dieu et du Messager, tandis que quiconque se détournait bénéficiait d'une protection de deux mois. Son peuple répondit à l'appel et embrassa l'islam, puis se rendit à Harrat al-Rajla' où il s'établit."
  ur: "رفاع بن زید الجثمی، دبئی کے، خیبر سے پہلے حدیبیہ کی جنگ کے دوران نبی کے پاس آئے، انہیں ایک غلام دیا اور ایک اچھا مسلمان ہو گیا۔ نبی نے اسے اپنی قوم کے نام ایک خط لکھا: آپ نے اسے اپنی تمام امتوں اور جو بھی ان کے ساتھ شامل ہوا انہیں خدا اور اس کے رسول کی طرف بلانے کے لیے بھیجا، اور جو بھی آگے آیا وہ خدا اور رسول کی جماعت میں تھا، جب کہ جس نے منہ موڑا اس کے لیے دو مہینے کی حفاظت ہے۔ اس کی قوم نے جواب دیا اور اسلام قبول کر لیا، پھر حرات رجلہ میں جا کر آباد ہو گئے۔"
