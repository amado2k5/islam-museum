summary:
  ar: "قدم رفاعة بن زيد الجذامي ثم الضبيبي على النبي في هدنة الحديبية قبل خيبر، فأهدى له غلاماً وأسلم فحسن إسلامه، وكتب له النبي كتاباً إلى قومه: إنه بعثه إلى قومه عامة ومن دخل فيهم يدعوهم إلى الله ورسوله، فمن أقبل فهو في حزب الله وحزب رسوله، ومن أدبر فله أمان شهرين؛ فلما قدم على قومه أجابوا وأسلموا ثم ساروا إلى حرة الرجلاء فنزلوها."
  en: "Rifa'a ibn Zayd al-Judhami, of the Dubayb, came to the Prophet during the Hudaybiyya truce before Khaybar, gave him a slave and became a good Muslim; the Prophet wrote him a letter to his people: he sent him to all his people and whoever joined them, to call them to God and His Messenger, and whoever came forward was in God's party and the Messenger's, while whoever turned away had two months' safety. His people answered and embraced Islam, then moved to Harrat al-Rajla' and settled there."
