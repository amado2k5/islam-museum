label: { en: "Abu Bakr leads the prayers during the final illness", ar: "إمامة أبي بكر في مرض النبي" }
summary:
  en: "When the illness grew too heavy for the Prophet to come out, he sent word that Abu Bakr should lead the people; Abu Bakr led seventeen prayers, the Prophet once joined him sitting at his left, and Sunni tradition reads the appointment as a sign of Abu Bakr's standing."
  ar: "لما ثقل على النبي الخروج أرسل إلى أبي بكر أن يصلي بالناس، فصلى بهم سبع عشرة صلاة، وخرج إليه النبي مرة فأجلس عن يساره فكان أبو بكر يقتدي بصلاته والناس يسمعون التكبير؛ وتقرأ السنة الإمامة دليلاً على مكانة أبي بكر."
