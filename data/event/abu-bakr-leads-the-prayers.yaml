label: { en: "Abu Bakr leads the prayers during the final illness", fr: "Abu Bakr dirige les prières pendant la dernière maladie", ar: "إمامة أبي بكر في مرض النبي", es: "Abu Bakr dirige las oraciones durante la enfermedad final." }
summary:
  en: "When the illness grew too heavy for the Prophet to come out, he sent word that Abu Bakr should lead the people; Abu Bakr led seventeen prayers, the Prophet once joined him sitting at his left, and Sunni tradition reads the appointment as a sign of Abu Bakr's standing."
  fr: "Lorsque la maladie devint trop lourde pour que le Prophète pût sortir, il fit dire qu’Abu Bakr devait diriger la prière ; celui-ci dirigea dix-sept prières, le Prophète le rejoignit une fois assis à sa gauche, et la tradition sunnite interprète cette désignation comme un signe de la place d’Abu Bakr."
  ar: "لما ثقل على النبي الخروج أرسل إلى أبي بكر أن يصلي بالناس، فصلى بهم سبع عشرة صلاة، وخرج إليه النبي مرة فأجلس عن يساره فكان أبو بكر يقتدي بصلاته والناس يسمعون التكبير؛ وتقرأ السنة الإمامة دليلاً على مكانة أبي بكر."
  es: "Cuando la enfermedad se agravó demasiado como para que el Profeta pudiera salir, envió un mensaje para que Abu Bakr dirigiera al pueblo; Abu Bakr dirigió diecisiete oraciones, el Profeta se unió a él una vez sentado a su izquierda, y la tradición sunita interpreta este nombramiento como una señal de la posición de Abu Bakr."
