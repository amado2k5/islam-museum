id: event/abu-bakr-leads-the-prayers
education:
  did_you_know:
    ar: "لما ثقل على النبي الخروج أمر أبا بكر أن يصلي بالناس، فصلى بهم سبع عشرة صلاة، وخرج إليه النبي مرة فأجلسه عن يساره فكان يقتدي بصلاته."
    en: "When going out grew heavy for the Prophet he sent word to Abu Bakr to lead the people; he led seventeen prayers, and once the Prophet came out and sat at his left while Abu Bakr followed his prayer."
    ur: "جب نبی کے لیے باہر نکلنا دشوار ہوا تو ابوبکر کو نماز پڑھانے کا حکم دیا؛ انہوں نے سترہ نمازیں پڑھائیں، اور ایک بار نبی ان کے بائیں بیٹھے تو ابوبکر ان کی نماز کی پیروی کرتے رہے۔"
    sources: [source/sahih-al-bukhari, source/mubarakpuri-raheeq]
