label: { ar: "نقض الحجاج بنيان الكعبة وإعادتها", en: "Al-Hajjaj Tears Down and Rebuilds the Kaaba", es: "Al-Hajjaj derriba y reconstruye la Kaaba", fr: "Al-Hajjaj démolit et reconstruit la Kaaba", ur: "الحجاج نے کعبہ کو پھاڑ کر دوبارہ تعمیر کیا۔", tr: "Haccac Kabe'yi yıkıp yeniden inşa etti", id: "Hajjaj menghancurkan Ka'bah dan membangunnya kembali" }
summary:
  ar: "في سنة أربع وسبعين نقض الحجاج بن يوسف بنيان الكعبة الذي بناه ابن الزبير، وكان قد أدخل الحجر وجعل لها بابين، فأعادها الحجاج على بنائها الأول {cite:tabari-tarikh-abu-al-fadl j.6 p.195}."
  en: "In 74 al-Hajjaj ibn Yusuf tore down the Kaaba's building that Ibn al-Zubayr had erected, which had taken the Hijr in and given the Kaaba two doors, and restored it to its original construction {cite:tabari-tarikh-abu-al-fadl j.6 p.195}."
  es: "En el año 74, al-Hajjaj ibn Yusuf derribó el edificio de la Kaaba que Ibn al-Zubayr había erigido, el cual había acogido el Hijr y le había dado a la Kaaba dos puertas, y lo restauró a su construcción original {cite:tabari-tarikh-abu-al-fadl j.6 p.195}."
  fr: "En 74, al-Hajjaj ibn Yusuf a démoli le bâtiment de la Kaaba qu'Ibn al-Zubayr avait érigé, qui avait intégré le Hijr et donné à la Kaaba deux portes, et l'a restauré à sa construction d'origine {cite:tabari-tarikh-abu-al-fadl j.6 p.195}."
  ur: "74 میں حجاج ابن یوسف نے کعبہ کی عمارت کو گرا دیا جسے ابن الزبیر نے تعمیر کیا تھا، جس نے ہجرت کو اندر لے لیا تھا اور کعبہ کو دو دروازے دیے تھے، اور اسے اس کی اصل تعمیر میں بحال کر دیا تھا۔"
  tr: "Yetmiş dördüncü yılda, İbnü'l-Zübeyr'in inşa ettiği Kâbe'yi yıktıran Haccac bin Yusuf, Kâbe'ye Hicr'i de dahil etmiş ve iki kapı yaptırmıştı. Bunun üzerine Haccac, Kâbe'yi eski haline getirdi. {cite:tabari-tarikh-abu-al-fadl j.6 p.195}"
  id: "Pada tahun tujuh puluh empat, Al-Hajjaj bin Yusuf merobohkan Ka'bah yang telah dibangun oleh Ibnu Al-Zubayr, dan beliau telah memasukkan Hijr dan membuat dua pintu untuknya, sehingga Al-Hajjaj mengembalikannya ke struktur aslinya {cite:tabari-tarikh-abu-al-fadl j.6 p.195}."
