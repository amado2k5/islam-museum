label: { ar: "حرب الأخوين: شرف الدولة يطيح بصمصام الدولة", en: "War of the brothers: Sharaf al-Dawla overthrows Samsam al-Dawla", fr: "La guerre des frères : Sharaf al-Dawla renverse Samsam al-Dawla", es: "Guerra de hermanos: Sharaf al-Dawla derroca a Samsam al-Dawla.", ur: "بھائیوں کی جنگ: شرف الدولہ نے صمصام الدولہ کا تختہ الٹ دیا۔", tr: "Kardeşlerin Savaşı: Devletin Onuru Devletin Kılıcını Deviriyor", id: "Perang Saudara: Kehormatan Negara Mengalahkan Pedang Negara" }
summary:
  ar: "في سنة ست وسبعين وثلاثمائة شرعت دولة بني بويه تضعف: مال العسكر عن صمصام الدولة إلى أخيه شرف الدولة، فذلّ الصمصام وسافر إلى أخيه راضياً بما يعامله به فدخل وقبّل الأرض مرات فقال له شرف الدولة كيف أنت أوحشتنا ثم اعتقله؛ ووقع بين الديلم — وكانوا تسعة عشر ألفاً — وبين الترك وكانوا ثلاثة آلاف، فالتقوا فانهزمت الديلم وقتل منهم ثلاثة آلاف، واحتفت الترك بشرف الدولة وقدموا به بغداد فأنشأ له الطائع يهشّه، ثم خفي خبر صمصام الدولة وأُكمل {cite:shadharat-dhahab p. 86-87}."
  en: "In 376 the Buyid house broke: the army deserted Samsam al-Dawla for his brother Sharaf al-Dawla; Samsam submitted, kissed the ground, was jailed — then nineteen thousand Daylamites met three thousand Turks, the Daylamites were routed losing three thousand, and the Turks rode Sharaf into Baghdad where al-Ta'i' received him; Samsam's news vanished — he was blinded {cite:shadharat-dhahab p. 86-87}."
  fr: "En 376, la maison bouyide se brisa : l'armée abandonna Samsam al-Dawla pour son frère Sharaf al-Dawla ; Samsam se soumit, baisa le sol et fut emprisonné ; puis dix-neuf mille Daylamites affrontèrent trois mille Turcs, les Daylamites furent mis en déroute en perdant trois mille hommes, et les Turcs escortèrent Sharaf jusqu'à Bagdad, où al-Ta'i' le reçut ; on n'eut plus de nouvelles de Samsam : il fut aveuglé {cite:shadharat-dhahab p. 86-87}."
  es: "En 376, la casa Buyí se rompió: el ejército abandonó a Samsam al-Dawla en favor de su hermano Sharaf al-Dawla; Samsam se sometió, besó el suelo y fue encarcelado; luego, diecinueve mil daylamitas se encontraron con tres mil turcos, los daylamitas fueron derrotados perdiendo tres mil, y los turcos llevaron a Sharaf a Bagdad, donde al-Ta'i' lo recibió; las noticias de Samsam se desvanecieron: quedó ciego {cite:shadharat-dhahab p. 86-87}."
  ur: "376 میں بوئڈ کا گھر ٹوٹ گیا: فوج نے صمصام الدولہ کو اس کے بھائی شرف الدولہ کے لیے چھوڑ دیا۔ صمصام نے عرض کیا، زمین کو بوسہ دیا، جیل میں ڈال دیا گیا - پھر انیس ہزار دیلامائٹس تین ہزار ترکوں سے ملے، دیلامائٹس تین ہزار سے ہار گئے، اور ترک شرف پر سوار ہو کر بغداد پہنچے جہاں الطائی نے ان کا استقبال کیا۔ صمصام کی خبر غائب ہو گئی - وہ اندھا ہو گیا 86-87}۔"
  tr: "Hicri 376 yılında Buyid devleti zayıflamaya başladı: Ordu, Samsam el-Dawla'yı kardeşi Şaraf el-Dawla'ya yönlendirdi. Bunun üzerine Samsam aşağılandı ve kardeşinin yanına gitti. Orada gördüğü muameleden memnun kaldı. İçeri girdi ve birkaç kez yere eğildi. Şaraf el-Dawla ona, \"Nasılsın? Bizi yalnız hissettirdin.\" dedi ve onu tutukladı. On dokuz bin kişilik Deylemliler ile üç bin kişilik Türkler arasında bir savaş çıktı. Karşılaştılar ve Deylemliler yenildi, üç bin kişi öldürüldü. Türkler Şaraf el-Dawla'yı karşıladı ve Bağdat'a getirdi. El-Ta'i onu neşelendirmek için bir şiir yazdı. Ardından Samsam el-Dawla'nın haberi gizlendi ve tamamlandı. {Kaynak: Şadharat-Dhaba s. 86-87}"
  id: "Pada tahun 376 H, negara Buyid mulai melemah: pasukan berpaling dari Samsam al-Dawla kepada saudaranya, Sharaf al-Dawla, sehingga Samsam merasa terhina dan pergi menemui saudaranya, merasa puas dengan perlakuan yang diterimanya. Ia masuk dan mencium tanah beberapa kali, dan Sharaf al-Dawla berkata kepadanya, “Apa kabarmu? Kau telah membuat kami merasa kesepian.” Kemudian ia menangkapnya. Terjadi pertempuran antara kaum Daylam—yang berjumlah sembilan belas ribu—dan kaum Turki, yang berjumlah tiga ribu. Mereka bertemu, dan kaum Daylam dikalahkan, dan tiga ribu dari mereka terbunuh. Kaum Turki menyambut Sharaf al-Dawla dan membawanya ke Baghdad, dan al-Ta’i menggubah sebuah puisi untuk menghiburnya. Kemudian berita tentang Samsam al-Dawla disembunyikan dan diselesaikan {cite:shadharat-dhahab p. 86-87}."
