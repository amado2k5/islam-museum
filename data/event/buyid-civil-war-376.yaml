label: { ar: "حرب الأخوين: شرف الدولة يطيح بصمصام الدولة" }
summary:
  ar: "في سنة ست وسبعين وثلاثمائة شرعت دولة بني بويه تضعف: مال العسكر عن صمصام الدولة إلى أخيه شرف الدولة، فذلّ الصمصام وسافر إلى أخيه راضياً بما يعامله به فدخل وقبّل الأرض مرات فقال له شرف الدولة كيف أنت أوحشتنا ثم اعتقله؛ ووقع بين الديلم — وكانوا تسعة عشر ألفاً — وبين الترك وكانوا ثلاثة آلاف، فالتقوا فانهزمت الديلم وقتل منهم ثلاثة آلاف، واحتفت الترك بشرف الدولة وقدموا به بغداد فأنشأ له الطائع يهشّه، ثم خفي خبر صمصام الدولة وأُكمل {cite:shadharat-dhahab p. 86-87}."
  en: "In 376 the Buyid house broke: the army deserted Samsam al-Dawla for his brother Sharaf al-Dawla; Samsam submitted, kissed the ground, was jailed — then nineteen thousand Daylamites met three thousand Turks, the Daylamites were routed losing three thousand, and the Turks rode Sharaf into Baghdad where al-Ta'i' received him; Samsam's news vanished — he was blinded {cite:shadharat-dhahab p. 86-87}."
