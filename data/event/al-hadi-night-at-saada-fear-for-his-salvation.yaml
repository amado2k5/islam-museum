id: event/al-hadi-night-at-saada-fear-for-his-salvation
class: event
kind: other
label:
  ar: 'ليلة في صعدة: خوف الهادي على نجاته وصوت القراءة'
  en: 'A night at Sa''da: al-Hadi''s fear for his salvation and the sound of recitation'
  ur: 'صعدہ کی ایک رات: ہادی کا اپنی نجات کا خوف اور تلاوت کی آواز'
  es: "Una noche en Sa'da: el temor de al-Hadi por su salvación y el sonido de la recitación."
  fr: "Une nuit à Sa'da: la peur d'al-Hadi pour son salut et le son de la récitation"
  tr: "Saada'da Bir Gece: El-Hadi'nin Hayatta Kalma Korkusu ve Kur'an Okumasının Sesi"
  id: "Suatu Malam di Saada: Ketakutan Al-Hadi akan Kelangsungan Hidupnya dan Suara Bacaan Al-Quran"
summary:
  ar: يروي محمد بن عبيد الله أنه صلى مع الهادي في المسجد، وفي المنزل قال له إن قلبه لا يشتفي حتى يطاع الله في جميع البلاد، ثم سمع صوتاً فظنه غناء فإذا هو قراءة، وسأل الراوي أتراني أنجو من النار، فأجابه نعم، فقال كيف أنجو وأنا راقد على هذا الفراش.
  en: Muhammad ibn Ubaydallah relates that he prayed with al-Hadi in the mosque; at the house al-Hadi told him his heart would not be healed until God is obeyed in all lands; hearing a sound he took it for singing and it was recitation; and he asked the narrator whether he would be saved from the Fire, and on being told yes, said how could he be while lying on that bed.
  ur: محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ہادی کے ساتھ مسجد میں نماز پڑھی؛ گھر میں ہادی نے کہا کہ ان کا دل اس وقت تک مطمئن نہیں ہوتا جب تک تمام شہروں میں اللہ کی اطاعت نہ ہو؛ پھر ایک آواز سنی جسے گانا سمجھا اور وہ تلاوت نکلی؛ اور راوی سے پوچھا کیا میں آگ سے بچوں گا، جواب ملا ہاں، تو بولے میں اس بستر پر لیٹا ہوں کیسے بچوں گا۔
  es: "Muhammad ibn Ubaydallah relata que oró con al-Hadi en la mezquita; en la casa, al-Hadi le dijo que su corazón no sanaría hasta que Dios fuera obedecido en todas las tierras; al oír un sonido, lo tomó por un canto y era una recitación; y le preguntó al narrador si se salvaría del Fuego, y al oír que sí, dijo cómo podía estarlo estando acostado en esa cama."
  fr: "Muhammad ibn Ubaydallah raconte qu'il a prié avec al-Hadi à la mosquée; chez lui, al-Hadi lui a dit que son cœur ne serait pas guéri tant que Dieu ne serait pas obéi sur toutes les terres; entendant un son, il l'a pris pour un chant et c'était une récitation; et il a demandé au narrateur s'il serait sauvé du Feu, et lorsqu'on lui a répondu oui, il a dit comment cela pourrait-il être possible alors qu'il était allongé sur ce lit."
  tr: "Muhammed ibn Ubeyd Allah rivayet eder ki, mescitte Hadi ile birlikte namaz kıldı ve evde ona, Allah'a bütün âlemlerde itaat edilene kadar kalbinin iyileşmeyeceğini söyledi. Sonra bir ses duydu ve şarkı söylediğini sandı, ama okuyordu. Râvî sordu: \"Sence cehennem ateşinden kurtulacak mıyım?\" Hadid cevap verdi: \"Evet.\" Râvî dedi ki: \"Bu yatakta yatarken nasıl kurtulabilirim ki?\""
  id: "Muhammad ibn Ubayd Allah meriwayatkan bahwa ia shalat bersama al-Hadi di masjid, dan di rumah ia berkata kepadanya bahwa hatinya tidak akan sembuh sampai Allah ditaati di seluruh negeri. Kemudian ia mendengar suara dan mengira itu nyanyian, tetapi ternyata itu bacaan. Perawi bertanya, “Apakah menurutmu aku akan selamat dari api neraka?” Ia menjawab, “Ya.” Ia berkata, “Bagaimana aku bisa selamat sementara aku berbaring di tempat tidur ini?”"
