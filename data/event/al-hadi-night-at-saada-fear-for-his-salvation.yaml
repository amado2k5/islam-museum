id: event/al-hadi-night-at-saada-fear-for-his-salvation
class: event
kind: other
label:
  ar: 'ليلة في صعدة: خوف الهادي على نجاته وصوت القراءة'
  en: 'A night at Sa''da: al-Hadi''s fear for his salvation and the sound of recitation'
  ur: 'صعدہ کی ایک رات: ہادی کا اپنی نجات کا خوف اور تلاوت کی آواز'
summary:
  ar: يروي محمد بن عبيد الله أنه صلى مع الهادي في المسجد، وفي المنزل قال له إن قلبه لا يشتفي حتى يطاع الله في جميع البلاد، ثم سمع صوتاً فظنه غناء فإذا هو قراءة، وسأل الراوي أتراني أنجو من النار، فأجابه نعم، فقال كيف أنجو وأنا راقد على هذا الفراش.
  en: Muhammad ibn Ubaydallah relates that he prayed with al-Hadi in the mosque; at the house al-Hadi told him his heart would not be healed until God is obeyed in all lands; hearing a sound he took it for singing and it was recitation; and he asked the narrator whether he would be saved from the Fire, and on being told yes, said how could he be while lying on that bed.
  ur: محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ہادی کے ساتھ مسجد میں نماز پڑھی؛ گھر میں ہادی نے کہا کہ ان کا دل اس وقت تک مطمئن نہیں ہوتا جب تک تمام شہروں میں اللہ کی اطاعت نہ ہو؛ پھر ایک آواز سنی جسے گانا سمجھا اور وہ تلاوت نکلی؛ اور راوی سے پوچھا کیا میں آگ سے بچوں گا، جواب ملا ہاں، تو بولے میں اس بستر پر لیٹا ہوں کیسے بچوں گا۔
