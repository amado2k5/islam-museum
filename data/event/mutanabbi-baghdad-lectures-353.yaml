label:
  ar: "المتنبي يقرأ ديوانه ببغداد، ٣٥٣هـ/٩٦٤م"
  en: "Lectures on his Diwan at Baghdad, 353/964"
  ur: "بغداد میں دیوان کے دروس، 353ھ/964ء"
summary:
  ar: "في بغداد راودت المتنبي فكرة الالتحاق بديوان الوزير البويهي الشهير المهلبي الذي جمع حوله بلاطاً لامعاً، لكنه أيسع منها أمام عداوة شعراء البلاط وعلمائه كابن الحجاج وأبي الفرج الأصفهاني صاحب كتاب الأغاني؛ فقضى سنة ٣٥٣هـ/٩٦٤م يلقي دروساً يشرح فيها لجماعة من الأصدقاء ما نظمه حتى ذلك التاريخ {cite:encyclopaedia-of-islam-2 vol. 7 p. 770-771}."
  en: "In Baghdad al-Mutanabbi thought of attaching himself to the famous Buyid vizier al-Muhallabi, who had gathered a brilliant court, but abandoned hope in face of the hostility of the court's poets and scholars, among them Ibn al-Hajjaj and Abu al-Faraj al-Isfahani, author of the Kitab al-Aghani. He spent the year 353/964 giving lectures in which he expounded to a group of friends the work he had done to that date {cite:encyclopaedia-of-islam-2 vol. 7 p. 770-771}."
  ur: "بغداد میں متنبی کا خیال تھا کہ مشہور بویہی وزیر مہلبی سے وابستہ ہو جائیں جس نے اپنے گرد شاندار دربار جمع کر رکھا تھا، مگر دربار کے شعراء و علماء — جن میں ابن الحجاج اور صاحب کتاب الاغانی ابوالفرج اصفہانی تھے — کی دشمنی نے اس امید کو ختم کر دیا۔ انہوں نے 353ھ/964ء کا برس دوستوں کے ایک حلقے کو اپنی اس وقت تک کی نظموں کے دروس دینے میں گزارا {cite:encyclopaedia-of-islam-2 vol. 7 p. 770-771}۔"
