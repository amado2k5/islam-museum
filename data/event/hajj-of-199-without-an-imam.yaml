id: event/hajj-of-199-without-an-imam
class: event
kind: pilgrimage
label:
  ar: حج سنة تسع وتسعين ومئة بغير إمام
  en: The pilgrimage of 199 AH without an imam
  ur: 199ھ کا حج بغیر امام کے
summary:
  ar: يروي خليفة بن خياط أن المأمون بعث سليمان بن داود بن عيسى لإقامة الحج سنة تسع وتسعين ومئة، فوثب ابن الأفطس بمكة وبيّض، فانصرف سليمان ولم يأت عرفة، ووقف الناس بغير إمام {cite:tarikh-khalifa-umari-1985 p. 469}.
  en: Khalifa ibn Khayyat reports that al-Ma'mun sent Sulayman ibn Dawud ibn Isa to lead the pilgrimage of 199 AH, but Ibn al-Aftas rose at Mecca and raised the white banner; Sulayman withdrew without going to Arafa, and the people stood at Arafa without an imam {cite:tarikh-khalifa-umari-1985 p. 469}.
  ur: خلیفہ بن خیاط روایت کرتے ہیں کہ مامون نے 199ھ کے حج کی امارت کے لیے سلیمان بن داود بن عیسیٰ کو بھیجا، مگر ابن الافطس نے مکہ میں بغاوت کر کے سفید جھنڈا بلند کیا؛ سلیمان عرفہ گئے بغیر لوٹ گئے، اور لوگوں نے بغیر امام کے وقوف کیا {cite:tarikh-khalifa-umari-1985 p. 469}۔
