label: { ar: "اغتيالات الباطنية للعلماء سنة 502" }
summary:
  ar: "في سنة اثنتين وخمسمائة قتلت الباطنية بهمذان قاضي قضاة أصبهان عبيد الله بن علي الخطيبي، وقتلت بأصبهان يوم عيد الفطر أبا العلاء صاعد بن محمد البخاري المفتي الحنفي عن خمس وخمسين سنة، وقتلت بجامع آمل يوم الجمعة حادي عشر المحرم شيخ الشافعية أبا المحاسن عبد الواحد بن إسماعيل الروياني وهو يلقي الإملاء؛ وعظم الخطب بهم وخافهم كل أمير وعالم لإقدامهم على الناس {cite:shadharat-dhahab p. 484}."
  en: "In 502 the Batiniyya murdered at Hamadan Isfahan's chief qadi Ubayd Allah al-Khatibi, at Isfahan on Eid al-Fitr the Hanafi mufti Abu al-Ala Sa'id al-Bukhari, and at Amol's mosque on Friday 11 Muharram the Shafi'i shaykh Abu al-Mahasin al-Ruyani mid-dictation; the terror grew until every amir and scholar feared them {cite:shadharat-dhahab p. 484}."
