id: event/batiniyya-assassinations-502
class: event
kind: other
label: { ar: "اغتيالات الباطنية للعلماء سنة 502", en: "Batiniyya assassinations of scholars in 502", fr: "Les assassinats de savants par les Batiniyya en 502", es: "Asesinatos de eruditos por parte de la Batiniyya en 502", ur: "502 میں علمائے کرام کے قتل بطنیہ", tr: "502 yılında Batiniyye tarafından âlimlerin öldürülmesi.", id: "Pembunuhan para ulama oleh Batiniyya pada tahun 502" }
summary:
  ar: "في سنة اثنتين وخمسمائة قتلت الباطنية بهمذان قاضي قضاة أصبهان عبيد الله بن علي الخطيبي، وقتلت بأصبهان يوم عيد الفطر أبا العلاء صاعد بن محمد البخاري المفتي الحنفي عن خمس وخمسين سنة، وقتلت بجامع آمل يوم الجمعة حادي عشر المحرم شيخ الشافعية أبا المحاسن عبد الواحد بن إسماعيل الروياني وهو يلقي الإملاء؛ وعظم الخطب بهم وخافهم كل أمير وعالم لإقدامهم على الناس {cite:shadharat-dhahab p. 484}."
  en: "In 502 the Batiniyya murdered at Hamadan Isfahan's chief qadi Ubayd Allah al-Khatibi, at Isfahan on Eid al-Fitr the Hanafi mufti Abu al-Ala Sa'id al-Bukhari, and at Amol's mosque on Friday 11 Muharram the Shafi'i shaykh Abu al-Mahasin al-Ruyani mid-dictation; the terror grew until every amir and scholar feared them {cite:shadharat-dhahab p. 484}."
  fr: "En 502, les Batiniyya assassinèrent à Hamadan le grand cadi d'Ispahan Ubayd Allah al-Khatibi, à Ispahan le jour de l'Aïd al-Fitr le mufti hanafite Abu al-Ala Sa'id al-Bukhari, et dans la mosquée d'Amol le vendredi 11 Muharram le cheikh chaféite Abu al-Mahasin al-Ruyani en pleine dictée ; la terreur grandit jusqu'à ce que chaque émir et chaque savant les craigne {cite:shadharat-dhahab p. 484}."
  es: "En 502, Batiniyya asesinó en Hamadan Isfahan al cadí principal Ubayd Allah al-Khatibi, en Isfahan en Eid al-Fitr al muftí hanafi Abu al-Ala Sa'id al-Bukhari, y en la mezquita de Amol el viernes 11 Muharram al shaykh Shafi'i Abu al-Mahasin al-Ruyani en medio del dictado; el terror creció hasta que todos los emir y eruditos les temieron {citar: shadharat-dhahab p. 484}."
  ur: "502 میں بطنیہ نے ہمدان اصفہان کے سربراہ قاضی عبید اللہ الخطیبی کو، عید الفطر کے دن اصفہان میں، حنفی مفتی ابو الاعلٰی سعید البخاری کو، اور جمعہ 11 محرم کو امول کی مسجد میں، شافعی شیخ شیخ ابو المعظیم الرحمٰن کو قتل کیا۔ دہشت بڑھتی گئی یہاں تک کہ ہر امیر اور عالم ان سے ڈرنے لگے۔ 484}۔"
  tr: "502 yılında Batiniyye, İsfahan Başkadı Ubeydullah ibn Ali el-Hatibi'yi öldürdü ve İsfahan'da Ramazan Bayramı günü, Hanefi müftüsü Ebu el-Ala' Sa'id ibn Muhammed el-Buhari'yi elli beş yaşında öldürdüler. Muharrem ayının on birinci Cuma günü, Amol Camii'nde Şafiî Şeyhi Ebu el-Mahasin Abdül-Vahid ibn İsmail el-Ruyani'yi, dikte ederken öldürdüler. Onlar yüzünden mesele ciddileşti ve her prens ve alim, halka karşı gösterdikleri cüretkarlık nedeniyle onlardan korktu. {Kaynak: Şadharat-Dhaba, s. 484}"
  id: "Pada tahun 502, Batiniyya membunuh Ketua Hakim Isfahan, Ubayd Allah ibn Ali al-Khatibi, dan di Isfahan pada hari raya Idul Fitri, mereka membunuh Abu al-Ala’ Sa’id ibn Muhammad al-Bukhari, Mufti Hanafi, pada usia lima puluh lima tahun. Mereka membunuh di masjid Amol pada hari Jumat, tanggal sebelas Muharram, Syekh Syafi'i, Abu al-Mahasin Abd al-Wahid ibn Ismail al-Ruyani, saat beliau sedang mendiktekan. Masalah menjadi serius karena mereka, dan setiap pangeran dan ulama takut kepada mereka karena keberanian mereka terhadap rakyat. {cite:shadharat-dhahab p. 484}"
