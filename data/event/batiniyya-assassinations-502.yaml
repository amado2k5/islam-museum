label: { ar: "اغتيالات الباطنية للعلماء سنة 502", en: "Batiniyya assassinations of scholars in 502", fr: "Les assassinats de savants par les Batiniyya en 502", es: "Asesinatos de eruditos por parte de la Batiniyya en 502" }
summary:
  ar: "في سنة اثنتين وخمسمائة قتلت الباطنية بهمذان قاضي قضاة أصبهان عبيد الله بن علي الخطيبي، وقتلت بأصبهان يوم عيد الفطر أبا العلاء صاعد بن محمد البخاري المفتي الحنفي عن خمس وخمسين سنة، وقتلت بجامع آمل يوم الجمعة حادي عشر المحرم شيخ الشافعية أبا المحاسن عبد الواحد بن إسماعيل الروياني وهو يلقي الإملاء؛ وعظم الخطب بهم وخافهم كل أمير وعالم لإقدامهم على الناس {cite:shadharat-dhahab p. 484}."
  en: "In 502 the Batiniyya murdered at Hamadan Isfahan's chief qadi Ubayd Allah al-Khatibi, at Isfahan on Eid al-Fitr the Hanafi mufti Abu al-Ala Sa'id al-Bukhari, and at Amol's mosque on Friday 11 Muharram the Shafi'i shaykh Abu al-Mahasin al-Ruyani mid-dictation; the terror grew until every amir and scholar feared them {cite:shadharat-dhahab p. 484}."
  fr: "En 502, les Batiniyya assassinèrent à Hamadan le grand cadi d'Ispahan Ubayd Allah al-Khatibi, à Ispahan le jour de l'Aïd al-Fitr le mufti hanafite Abu al-Ala Sa'id al-Bukhari, et dans la mosquée d'Amol le vendredi 11 Muharram le cheikh chaféite Abu al-Mahasin al-Ruyani en pleine dictée ; la terreur grandit jusqu'à ce que chaque émir et chaque savant les craigne {cite:shadharat-dhahab p. 484}."
  es: "En 502, Batiniyya asesinó en Hamadan Isfahan al cadí principal Ubayd Allah al-Khatibi, en Isfahan en Eid al-Fitr al muftí hanafi Abu al-Ala Sa'id al-Bukhari, y en la mezquita de Amol el viernes 11 Muharram al shaykh Shafi'i Abu al-Mahasin al-Ruyani en medio del dictado; el terror creció hasta que todos los emir y eruditos les temieron {citar: shadharat-dhahab p. 484}."
