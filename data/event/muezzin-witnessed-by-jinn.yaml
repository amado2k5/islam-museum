id: event/muezzin-witnessed-by-jinn
kind: other
label:
  ar: لا يسمع مدى صوت المؤذن جن ولا إنس إلا شهد له يوم القيامة
  en: No jinn, no human and nothing hears the muezzin to its extent but it testifies
    for him on the Day of Resurrection
  ur: اذان کی آواز کی انتہا تک نہ جن سنتا ہے نہ انسان سوائے اس کے جو قیامت کے دن اس
    کی گواہی دے گا
  es: "Ningún genio, ningún humano y nada escucha al muecín en toda su extensión, pero testifica por él en el Día de la Resurrección."
  fr: "Aucun djinn, aucun humain, rien n'entend le muezzin dans toute sa puissance sans que celui-ci ne témoigne pour lui le Jour de la Résurrection."
  tr: "Cinler de insan da dahil olmak üzere hiç kimse, kıyamet gününde müezzinin sesini duymadan ona şahitlik etmeden geçmez."
  id: "Tidak seorang pun, baik jin maupun manusia, yang mendengar suara muazin tanpa menjadi saksi baginya pada Hari Kiamat."
summary:
  ar: أخبر أبو سعيد الخدري عبد الرحمن بن أبي صعصعة أنه يراه يحب الغنم والبادية، فإذا
    كان في غنمه أو باديته وأُذن للصلاة فليلْوِّ بصوته؛ فإنه لا يسمع مدى صوت المؤذن
    جن ولا إنس ولا شيء إلا شهد له يوم القيامة {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|الموطأ
    176]].
  en: 'Abu Sa''id al-Khudri told Abd al-Rahman ibn Abi Sa''sa''a that he saw him loving
    sheep and the open country, so when he was among his flock and the prayer was
    announced he should raise his voice: no jinn, no human being and nothing hears
    the muezzin''s call to its extent but it will testify for him on the Day of Resurrection
    {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Muwatta 176]].'
  ur: 'ابو سعید خزری نے عبدالرحمن بن ابی صعصعہ کو بتایا کہ وہ اسے بھیڑ اور دیہات پسند
    کرتا دیکھتا تھا، اس لیے جب وہ اپنی بھیڑوں میں یا دیہات میں ہو اور اذان دی جائے
    تو اپنی آواز اونچی کرے: اذان کی آواز کی انتہا تک نہ جن سنتا ہے نہ انسان اور نہ
    کوئی اور مخلوق سوائے اس کے جو قیامت کے دن اس کی گواہی دے گی {cite:muwatta-maruf-1997}
    [[passage/muwatta-1-176|موطأ 176]]۔'
  es: "Abu Sa'id al-Khudri le dijo a Abd al-Rahman ibn Abi Sa'sa'a que lo vio amando a las ovejas y el campo abierto, así que cuando estuviera entre su rebaño y se anunciara la oración, debía alzar la voz: ningún genio, ningún ser humano y nada escucha el llamado del muecín en toda su extensión sin que testifique por él en el Día de la Resurrección {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Muwatta 176]]."
  fr: "Abu Sa'id al-Khudri a dit à Abd al-Rahman ibn Abi Sa'sa'a qu'il l'avait vu aimer les moutons et la campagne ouverte, alors quand il était au milieu de son troupeau et que la prière était annoncée, il devait élever la voix: aucun djinn, aucun être humain et rien n'entend l'appel du muezzin dans toute son ampleur sans que cela ne témoigne pour lui le Jour de la Résurrection {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Muwatta 176])."
  tr: "Ebu Said el-Hudri, Abdurrahman bin Ebu Sa'sa'ya, onun koyunları ve çölü sevdiğini gördüğünü, bu yüzden koyunlarıyla birlikteyken veya çölde iken ezan okunduğunda sesini yükseltmesi gerektiğini, çünkü kıyamet gününde müezzinin sesini duyan hiçbir cin, insan veya başka bir şeyin onun lehine şahitlik etmeden geçmeyeceğini söylemiştir. {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Al-Muwatta 176]]."
  id: "Abu Saeed Al-Khudri berkata kepada Abd Al-Rahman bin Abi Sa’sa’ah bahwa ia melihat Abd Al-Rahman mencintai domba dan padang pasir, sehingga jika ia sedang bersama dombanya atau di padang pasir dan seruan azan dikumandangkan, ia harus meninggikan suaranya; karena tidak ada jin, manusia, atau makhluk lain yang mendengar suara muazin tanpa suara itu menjadi saksi baginya pada Hari Kiamat. {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Al-Muwatta 176]]."
