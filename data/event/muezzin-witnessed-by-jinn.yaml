id: event/muezzin-witnessed-by-jinn
kind: other
label:
  ar: لا يسمع مدى صوت المؤذن جن ولا إنس إلا شهد له يوم القيامة
  en: No jinn, no human and nothing hears the muezzin to its extent but it testifies
    for him on the Day of Resurrection
  ur: اذان کی آواز کی انتہا تک نہ جن سنتا ہے نہ انسان سوائے اس کے جو قیامت کے دن اس
    کی گواہی دے گا
summary:
  ar: أخبر أبو سعيد الخدري عبد الرحمن بن أبي صعصعة أنه يراه يحب الغنم والبادية، فإذا
    كان في غنمه أو باديته وأُذن للصلاة فليلْوِّ بصوته؛ فإنه لا يسمع مدى صوت المؤذن
    جن ولا إنس ولا شيء إلا شهد له يوم القيامة {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|الموطأ
    176]].
  en: 'Abu Sa''id al-Khudri told Abd al-Rahman ibn Abi Sa''sa''a that he saw him loving
    sheep and the open country, so when he was among his flock and the prayer was
    announced he should raise his voice: no jinn, no human being and nothing hears
    the muezzin''s call to its extent but it will testify for him on the Day of Resurrection
    {cite:muwatta-maruf-1997} [[passage/muwatta-1-176|Muwatta 176]].'
  ur: 'ابو سعید خزری نے عبدالرحمن بن ابی صعصعہ کو بتایا کہ وہ اسے بھیڑ اور دیہات پسند
    کرتا دیکھتا تھا، اس لیے جب وہ اپنی بھیڑوں میں یا دیہات میں ہو اور اذان دی جائے
    تو اپنی آواز اونچی کرے: اذان کی آواز کی انتہا تک نہ جن سنتا ہے نہ انسان اور نہ
    کوئی اور مخلوق سوائے اس کے جو قیامت کے دن اس کی گواہی دے گی {cite:muwatta-maruf-1997}
    [[passage/muwatta-1-176|موطأ 176]]۔'
