label: { ar: "دفن عبد الله ذي البجادين بتبوك", en: "The burial of Dhu al-Bijadayn at Tabuk" }
summary:
  ar: "روى ابن إسحاق عن محمد بن إبراهيم بن الحارث التيمي أن عبد الله بن مسعود حدّث أنه قام في جوف الليل في غزوة تبوك فرأى شعلة نار في ناحية العسكر، فإذا النبي وأبو بكر وعمر وقد مات عبد الله ذو البجادين المزني وحفروا له والنبي في حفرته يدلّيانه إليه، ويقول: أدنيا إليّ أخاكما؛ ثم دعا له؛ وقال ابن مسعود يا ليتني كنت صاحب الحفرة."
  en: "Ibn Ishaq relates from Muhammad ibn Ibrahim ibn al-Harith al-Taymi that Abdullah ibn Mas'ud told how he rose in the depth of night on the Tabuk campaign and saw a fire-brand at the edge of the camp: the Prophet, Abu Bakr and Umar were burying Abdullah Dhu al-Bijadayn al-Muzani, who had died; the Prophet was in the grave receiving the body, saying: bring your brother close to me. He then prayed for him, and Ibn Mas'ud said: would that I had been the man of that grave."
