label: { ar: "دفن عبد الله ذي البجادين بتبوك", en: "The burial of Dhu al-Bijadayn at Tabuk", fr: "L'inhumation de Dhu al-Bijadayn à Tabuk", es: "El entierro de Dhu al-Bijadayn en Tabuk", ur: "تبوک میں ذی الجادین کی تدفین", tr: "Abdullah Zi el-Bajadin Tebük'te defnedildi", id: "Abdullah Dhi al-Bajadin dimakamkan di Tabuk" }
summary:
  ar: "روى ابن إسحاق عن محمد بن إبراهيم بن الحارث التيمي أن عبد الله بن مسعود حدّث أنه قام في جوف الليل في غزوة تبوك فرأى شعلة نار في ناحية العسكر، فإذا النبي وأبو بكر وعمر وقد مات عبد الله ذو البجادين المزني وحفروا له والنبي في حفرته يدلّيانه إليه، ويقول: أدنيا إليّ أخاكما؛ ثم دعا له؛ وقال ابن مسعود يا ليتني كنت صاحب الحفرة."
  en: "Ibn Ishaq relates from Muhammad ibn Ibrahim ibn al-Harith al-Taymi that Abdullah ibn Mas'ud told how he rose in the depth of night on the Tabuk campaign and saw a fire-brand at the edge of the camp: the Prophet, Abu Bakr and Umar were burying Abdullah Dhu al-Bijadayn al-Muzani, who had died; the Prophet was in the grave receiving the body, saying: bring your brother close to me. He then prayed for him, and Ibn Mas'ud said: would that I had been the man of that grave."
  fr: "Ibn Ishaq rapporte, d'après Muhammad ibn Ibrahim ibn al-Harith al-Taymi, qu'Abdullah ibn Mas'ud raconta s'être levé au plus profond de la nuit pendant l'expédition de Tabuk et avoir vu un tison au bord du camp : le Prophète, Abu Bakr et Umar enterraient Abdullah Dhu al-Bijadayn al-Muzani, qui était mort ; le Prophète était dans la tombe et recevait le corps, disant : approchez de moi votre frère. Puis il pria pour lui, et Ibn Mas'ud dit : que n'ai-je été l'homme de cette tombe !"
  es: "Ibn Ishaq relata de Muhammad ibn Ibrahim ibn al-Harith al-Taymi que Abdullah ibn Mas'ud contó cómo se levantó en la oscuridad de la noche durante la campaña de Tabuk y vio una antorcha en el borde del campamento: el Profeta, Abu Bakr y Umar estaban enterrando a Abdullah Dhu al-Bijadayn al-Muzani, que había muerto; el Profeta estaba en la tumba recibiendo el cuerpo, diciendo: acerca a tu hermano a mí. Luego oró por él, e Ibn Mas'ud dijo: ojalá yo hubiera sido el hombre de esa tumba."
  ur: "ابن اسحاق نے محمد بن ابراہیم بن حارث التیمی سے نقل کیا ہے کہ عبداللہ بن مسعود نے بتایا کہ کس طرح وہ تبوک کی مہم میں رات کی گہرائی میں اٹھے اور کیمپ کے کنارے پر آگ کا نشان دیکھا: رسول اللہ، ابوبکر اور عمر عبداللہ ذوالبیجادین کو دفن کر رہے تھے۔ نبی کریم قبر میں میت کو لے رہے تھے، فرمایا: اپنے بھائی کو میرے قریب لاؤ۔ پھر آپ نے اس کے لیے دعا کی، اور ابن مسعود نے کہا: کاش میں اس قبر کا آدمی ہوتا۔"
  tr: "İbn İshak, Muhammed ibn İbrahim ibn el-Harith el-Taymi'den rivayetle Abdullah ibn Mesud'un şöyle dediğini aktardı: Tebük Savaşı sırasında gece yarısı kalktım ve kamp yönünde bir ateş alevi gördüm. Orada Peygamber, Ebu Bekir ve Ömer vardı ve Abdullah Zülbicadeyn el-Muzani ölmüştü ve onun için bir mezar kazmışlardı. Peygamber onun mezarındaydı, onu yanına indiriyordu ve şöyle dedi: Kardeşini bana yaklaştır. Sonra onun için dua etti. İbn Mesud dedi ki: Keşke mezarı ben kazmış olsaydım."
  id: "Ibn Ishaq meriwayatkan dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi bahwa Abdullah ibn Masoud berkata bahwa ia bangun di tengah malam selama Perang Tabuk dan melihat nyala api ke arah perkemahan. Kemudian Nabi, Abu Bakar, dan Umar berada di sana, dan Abdullah Dhu al-Bijadayn al-Muzani telah meninggal dan mereka telah menggali kuburan untuknya, dan Nabi berada di dalam kuburannya, menurunkannya kepadanya, dan beliau berkata: Dekatkan saudaramu kepadaku. Kemudian beliau berdoa untuknya. Ibn Masoud berkata: Aku berharap akulah yang menggali kuburan itu."
