label: { ar: "غزو يزيد بن المهلب جرجان", en: "Yazid ibn al-Muhallab's Jurjan Campaign", es: "Campaña Jurjan de Yazid ibn al-Muhallab", fr: "Campagne Jurjan de Yazid ibn al-Muhallab", ur: "یزید ابن المحلب کی جرجان مہم" }
summary:
  ar: "ولّى سليمان بن عبد الملك يزيد بن المهلب العراق فخرج إلى خراسان فعرض له صول التركي في طريقه فاستأذن سليمان في غزوه فأذن له فغزا جيلان وسارية ثم أتى دهستان وبها صول فحصرها وألح وقطع المواد عنهم فسأله صول الصلح على أن يؤمنه على نفسه وماله وأهل بيته ويدفع المدينة فقبل ووفى له وقتل يزيد أربعة عشر ألفاً من الترك وقال أبو عبيدة إن صولاً قتل ثم أتى جرجان فتلقاه أهلها بأتاوة سعيد فنقضوا فوجه جهم بن زحر الجعفي ففتحها وروي أنه غزاها في مائة وعشرين ألفاً وكان عليها حائط من آجر تحصنوا به من الترك طرفه في البحر غلبت عليه الترك وسموا ملكهم صولاً فوجده نازلاً في البحيرة فحصره ستة أشهر فصالحه على ثلاثمائة من أهل بيته ودفع البحيرة ثم نقض أهل جرجان ثانية فتحصن مرزبانهم بوجاه في غياض وأشب فنزل عليها سبعة أشهر ونصب المنجنيق حتى دلهم رجل على طريق بسلالم جلود فعقد لجهم وقال إن غلبت على الحياة فلا تغلبن على الموت فانتهى إلى القلعة ولم يشعر العدو بعيد العصر إلا بالتكبير من ورائهم ففتحت وقادهم إلى وادي جرجان يقتلهم حتى سالت الدماء وهو بنى مدينة جرجان."
  en: "Sulayman gave Yazid ibn al-Muhallab Iraq; bound for Khurasan he met Sul al-Turki on the road, took the caliph's leave to raid him — Jilan and Sariya — then besieged him in Dihistan, cut his supplies, and accepted his treaty: safe self, property and household for the city — and kept faith, while killing fourteen thousand Turks, though Abu Ubayda reports Sul slain. Jurjan paid him Sa'id's tribute, breached, and Jahm ibn Zahr retook it — one account has a hundred and twenty thousand in his host against the fired-brick wall the Turks had seized, one end in the sea; he found Sul at al-Buhayra, besieged him six months and treated him out with three hundred of his household. When Jurjan breached again its marzban fortified at Wajah among thickets — seven months, mangonels, then an informer's path and hide-ladders; Jahm swore 'if I am spared life, let me not be spared death', the gate-keepers fell, and the enemy knew only the takbir behind them — the captives driven to Wadi Jurjan were slaughtered till the blood ran, and Yazid built Madinat Jurjan."
  es: "Sulayman le dio Irak a Yazid ibn al-Muhallab; rumbo a Jorasán se encontró con Sul al-Turki en el camino, tomó permiso del califa para saquearlo — Jilan y Sariya — luego lo sitió en Dihistan, cortó sus suministros y aceptó su tratado: su seguridad, propiedad y casa para la ciudad — y cumplió su palabra, mientras mataba a catorce mil turcos, aunque Abu Ubayda informa que Sul fue asesinado. Jurjan le pagó el tributo de Sa'id, rompió la defensa, y Jahm ibn Zahr la retomó — un relato dice que ciento veinte mil en su ejército contra la muralla de ladrillos cocidos que los turcos habían tomado, un extremo en el mar; encontró a Sul en al-Buhayra, lo sitió durante seis meses y lo agasajó con trescientos de su casa. Cuando Jurjan rompió de nuevo su marzban fortificado en Wajah entre matorrales — siete meses, mangoneles, luego un sendero de informantes y escaleras de pieles; Jahm juró \"si me perdonan la vida, que no me perdonen la muerte\", los guardianes cayeron y el enemigo solo conoció el takbir que los seguía; los cautivos llevados a Wadi Jurjan fueron masacrados hasta que la sangre corrió, y Yazid construyó Madinat Jurjan."
  fr: "Sulayman confia l'Irak à Yazid ibn al-Muhallab. En route pour le Khorasan, il rencontra Sul al-Turki, obtint la permission du calife de le piller (Jilan et Sariya), puis l'assiégea à Dihistan, coupa ses approvisionnements et accepta son traité: la sécurité pour lui-même, ses biens et sa famille. Il tint parole, tuant quatorze mille Turcs, bien qu'Abu Ubayda rapporte la mort de Sul. Jurjan lui paya le tribut de Sa'id, puis la prit. Jahm ibn Zahr reprit la ville; selon un récit, ses troupes comptaient cent vingt mille hommes contre le mur de briques cuites que les Turcs avaient conquis, une extrémité donnant sur la mer. Il retrouva Sul à al-Buhayra, l'assiégea six mois et le libéra avec trois cents membres de sa famille. Lorsque Jurjan prit de nouveau d'assaut son marzban fortifié à Wajah, au milieu des fourrés, il fallut sept mois de lutte, à l'aide de mangonneaux, puis d'un sentier emprunté par un informateur et d'échelles de cuir. Jahm jura: « Si la vie m’est épargnée, que la mort ne m’échappe pas », les gardiens tombèrent, et l’ennemi ne perçut que le takbir derrière eux — les captifs conduits à Wadi Jurjan furent massacrés jusqu’à ce que le sang coule, et Yazid construisit Madinat Jurjan."
  ur: "سلیمان نے یزید ابن المحلب کو عراق دیا۔ خراسان کی طرف جاتے ہوئے اس نے راستے میں سل الترکی سے ملاقات کی، اس پر چھاپہ مارنے کے لیے خلیفہ کی اجازت لی - جیلان اور ساریہ - پھر اس کا دہستان میں محاصرہ کیا، اس کا سامان کاٹ لیا، اور اس کے معاہدے کو قبول کیا: شہر کے لیے اپنی جان، مال اور گھر کی حفاظت - اور ایمان برقرار رکھا، جبکہ چودہ ہزار ترکوں کو قتل کیا، حالانکہ ابو عبیدہ نے سُول کی خبر دی ہے۔ جرجان نے اسے سعید کا خراج ادا کیا، خلاف ورزی کی، اور جہم ابن زہر نے اسے واپس لے لیا - ایک اکاؤنٹ کے مطابق اس کی میزبانی میں ایک لاکھ 20 ہزار ہیں اس فائر اینٹ کی دیوار کے خلاف جس پر ترکوں نے قبضہ کر لیا تھا، جس کا ایک سرہ سمندر میں تھا۔ اس نے سل کو البحیرہ میں پایا، اس کا چھ ماہ تک محاصرہ کیا اور اس کے تین سو گھر والوں کے ساتھ اس کا علاج کیا۔ جب جرجان نے دوبارہ توڑا تو اس کا مرزبان واجہ میں جھاڑیوں کے درمیان قلعہ بند ہوا - سات ماہ، منگونل، پھر ایک مخبر کا راستہ اور چھپنے کی سیڑھیاں؛ جہم نے قسم کھائی کہ 'اگر مجھے زندگی بخشی گئی تو مجھے موت سے نہیں بچایا جائے گا'، دربان گر گئے، اور دشمن کو صرف ان کے پیچھے تکبیر کا علم تھا - وادی جرجان کی طرف لے جانے والے اسیروں کو قتل کیا گیا یہاں تک کہ خون بہہ گیا، اور یزید نے مدینہ جرجان کو تعمیر کیا۔"
