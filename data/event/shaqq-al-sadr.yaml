label: { en: "The opening of the breast", ar: "حادثة شق الصدر" }
summary:
  en: "The tradition, narrated by Muslim via Anas, that Jibril opened the boy Muhammad's breast while he played with the lads in Banu Sa'd, removed 'Satan's share' and washed his heart with Zamzam water — after which Halima returned him to his mother. ويروي البخاري الشق الثاني ليلة الإسراء بلسان مالك بن صعصعة: «فشُقّ من النحر إلى مراقّ البطن ثم غُسل البطن بماء زمزم ثم مُلئ حكمة وإيماناً» {cite:sahih-al-bukhari 3207}."
  ar: "ما يرويه مسلم عن أنس: أتى جبريل النبي وهو غلام يلعب مع الغلمان في بني سعد فشقّ عن قلبه وأخرج منه علقة وغسله في طست من ذهب بماء زمزم؛ وبعد هذه الوقعة خشيت عليه حليمة فردّته إلى أمه."
