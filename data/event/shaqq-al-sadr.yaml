id: event/shaqq-al-sadr
class: event
kind: other
label: { en: "The opening of the breast", ar: "حادثة شق الصدر", es: "La abertura del pecho", fr: "L'ouverture du sein", ur: "چھاتی کا کھلنا" }
summary:
  en: "The tradition, narrated by Muslim via Anas, that Jibril opened the boy Muhammad's breast while he played with the lads in Banu Sa'd, removed 'Satan's share' and washed his heart with Zamzam water — after which Halima returned him to his mother. ويروي البخاري الشق الثاني ليلة الإسراء بلسان مالك بن صعصعة: «فشُقّ من النحر إلى مراقّ البطن ثم غُسل البطن بماء زمزم ثم مُلئ حكمة وإيماناً» {cite:sahih-al-bukhari 3207}."
  ar: "ما يرويه مسلم عن أنس: أتى جبريل النبي وهو غلام يلعب مع الغلمان في بني سعد فشقّ عن قلبه وأخرج منه علقة وغسله في طست من ذهب بماء زمزم؛ وبعد هذه الوقعة خشيت عليه حليمة فردّته إلى أمه."
  es: "La tradición, narrada por Muslim a través de Anas, cuenta que Jibril abrió el pecho del niño Muhammad mientras jugaba con los muchachos de Banu Sa'd, extrajo la \"parte de Satanás\" y lavó su corazón con agua de Zamzam; después, Halima lo devolvió a su madre. Al-Bujari narra la segunda parte del Viaje Nocturno según la autoridad de Malik ibn Sa'sa'ah: \"Le abrieron el pecho desde la garganta hasta la parte baja del abdomen, luego le lavaron el abdomen con agua de Zamzam y lo llenaron de sabiduría y fe\". {cite:sahih-al-bukhari 3207}"
  fr: "Selon la tradition, rapportée par Muslim d'après Anas, Jibril ouvrit la poitrine du jeune Muhammad alors qu'il jouait avec les garçons de Banu Sa'd, en retira la part de Satan et lava son cœur avec l'eau de Zamzam. Halima le rendit ensuite à sa mère. Al-Bukhari relate la seconde partie du Voyage nocturne d'après Malik ibn Sa'sa'ah: « Il fut ouvert de la gorge jusqu'au bas-ventre, puis son abdomen fut lavé avec l'eau de Zamzam, et enfin empli de sagesse et de foi. » {cite:sahih-al-bukhari 3207}"
  ur: "مسلم نے انس کے ذریعے روایت کی ہے کہ جبریل نے بنو سعد میں لڑکوں کے ساتھ کھیلتے ہوئے لڑکے محمد کا سینہ کھولا، 'شیطان کا حصہ' ہٹا دیا اور اس کے دل کو زمزم کے پانی سے دھویا - اس کے بعد حلیمہ نے اسے اس کی ماں کے پاس واپس کردیا۔ بخاری نے رات کے سفر کا دوسرا حصہ مالک بن صعصع کی روایت سے نقل کیا ہے: \"آپ کو حلق سے پیٹ کے نچلے حصے تک پھاڑا گیا، پھر زمزم کے پانی سے پیٹ کو دھویا گیا، پھر اسے حکمت اور ایمان سے بھر دیا گیا۔\" {حوالہ: صحیح البخاری 3207}"
