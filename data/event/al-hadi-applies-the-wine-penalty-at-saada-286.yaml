id: event/al-hadi-applies-the-wine-penalty-at-saada-286
class: event
kind: other
label:
  ar: إقامة الهادي حد الخمر وتأديب بعض من وُجد مع نساء، رواية محمد بن عبيد الله
  en: Al-Hadi applies the penalty for wine and corrects others, as Muhammad ibn Ubaydallah tells it
  ur: ہادی کا شراب کی حد جاری کرنا اور بعض لوگوں کی تادیب، بروایت محمد بن عبید اللہ
summary:
  ar: 'يروي محمد بن عبيد الله أنه رأى الهادي يؤتى برجل سكران فيشهد عليه ثقتان بأنه شارب خمر، فيحبسه إلى أن يفيق ثم يجلده ثمانين سوطاً بسوط اختاره بنفسه، ويروي حادثة أربعة رجال وامرأتين: جُلد اثنان بالخمر ثمانين لكل منهما، وجُلد اثنان من جنده سبعين لكل منهما تأديباً أقل من الحد لأنهما شُهد بحديثهما مع المرأتين، وفُحصت المرأتان ووُضعت أمرهما على اعتبار الحمل والحرية، وجُلدت إحداهما ستين تأديباً.'
  en: 'Muhammad ibn Ubaydallah relates that he saw al-Hadi brought a drunken man; two trusted men testified he had drunk wine, he was held until sober and then given eighty lashes with a whip al-Hadi chose himself. He tells too of four men and two women: two were given eighty each for wine and two of al-Hadi''s own soldiers were given seventy each, as correction below the penalty, on testimony that they had been talking with the women; the women were examined, one found pregnant being held in a house or guaranteed until delivery, and the other, a free woman, received sixty as correction.'
  ur: 'محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ہادی کے سامنے ایک نشے میں مبتلا آدمی کو لایا جاتے دیکھا؛ دو معتبر آدمیوں نے گواہی دی کہ اس نے شراب پی ہے، اسے ہوش میں آنے تک قید رکھا گیا اور پھر ہادی کے خود چنے ہوئے کوڑے سے اسّی کوڑے لگائے گئے۔ وہ چار مردوں اور دو عورتوں کا واقعہ بھی بتاتے ہیں: دو کو شراب پر اسّی اسّی کوڑے لگے اور ہادی کے دو سپاہیوں کو، جن کے بارے میں گواہی ہوئی کہ وہ عورتوں سے باتیں کر رہے تھے، حد سے کم ستر ستر کوڑے تادیباً لگے؛ دونوں عورتوں کا جائزہ لیا گیا، ایک حاملہ پائی گئی اور ولادت تک اس کی ضمانت یا قید کا حکم ہوا، دوسری آزاد عورت کو ساٹھ کوڑے تادیباً لگائے گئے۔'
