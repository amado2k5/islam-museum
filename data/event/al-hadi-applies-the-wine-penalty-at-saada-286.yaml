id: event/al-hadi-applies-the-wine-penalty-at-saada-286
class: event
kind: other
label:
  ar: إقامة الهادي حد الخمر وتأديب بعض من وُجد مع نساء، رواية محمد بن عبيد الله
  en: Al-Hadi applies the penalty for wine and corrects others, as Muhammad ibn Ubaydallah tells it
  ur: ہادی کا شراب کی حد جاری کرنا اور بعض لوگوں کی تادیب، بروایت محمد بن عبید اللہ
  es: "Al-Hadi aplica el castigo por el vino y corrige a los demás, como lo cuenta Muhammad ibn Ubaydallah."
  fr: "Al-Hadi applique la peine pour le vin et corrige les autres, comme le rapporte Muhammad ibn Ubaydallah."
  tr: "Muhammed ibn Ubeyd Allah'ın rivayetine göre, El-Hadi alkol içmenin cezasını belirlemiş ve kadınlarla birlikte yakalananlardan bazılarını cezalandırmıştır."
  id: "Al-Hadi menetapkan hukuman bagi orang yang minum alkohol dan mendisiplinkan sebagian orang yang kedapatan bersama wanita, menurut riwayat Muhammad ibn Ubayd Allah."
summary:
  ar: 'يروي محمد بن عبيد الله أنه رأى الهادي يؤتى برجل سكران فيشهد عليه ثقتان بأنه شارب خمر، فيحبسه إلى أن يفيق ثم يجلده ثمانين سوطاً بسوط اختاره بنفسه، ويروي حادثة أربعة رجال وامرأتين: جُلد اثنان بالخمر ثمانين لكل منهما، وجُلد اثنان من جنده سبعين لكل منهما تأديباً أقل من الحد لأنهما شُهد بحديثهما مع المرأتين، وفُحصت المرأتان ووُضعت أمرهما على اعتبار الحمل والحرية، وجُلدت إحداهما ستين تأديباً.'
  en: 'Muhammad ibn Ubaydallah relates that he saw al-Hadi brought a drunken man; two trusted men testified he had drunk wine, he was held until sober and then given eighty lashes with a whip al-Hadi chose himself. He tells too of four men and two women: two were given eighty each for wine and two of al-Hadi''s own soldiers were given seventy each, as correction below the penalty, on testimony that they had been talking with the women; the women were examined, one found pregnant being held in a house or guaranteed until delivery, and the other, a free woman, received sixty as correction.'
  ur: 'محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ہادی کے سامنے ایک نشے میں مبتلا آدمی کو لایا جاتے دیکھا؛ دو معتبر آدمیوں نے گواہی دی کہ اس نے شراب پی ہے، اسے ہوش میں آنے تک قید رکھا گیا اور پھر ہادی کے خود چنے ہوئے کوڑے سے اسّی کوڑے لگائے گئے۔ وہ چار مردوں اور دو عورتوں کا واقعہ بھی بتاتے ہیں: دو کو شراب پر اسّی اسّی کوڑے لگے اور ہادی کے دو سپاہیوں کو، جن کے بارے میں گواہی ہوئی کہ وہ عورتوں سے باتیں کر رہے تھے، حد سے کم ستر ستر کوڑے تادیباً لگے؛ دونوں عورتوں کا جائزہ لیا گیا، ایک حاملہ پائی گئی اور ولادت تک اس کی ضمانت یا قید کا حکم ہوا، دوسری آزاد عورت کو ساٹھ کوڑے تادیباً لگائے گئے۔'
  es: "Muhammad ibn Ubaydallah relata que vio a al-Hadi traer a un hombre ebrio; dos hombres de confianza testificaron que había bebido vino, lo retuvieron hasta que se le pasó la borrachera y luego le dieron ochenta latigazos con un látigo que al-Hadi escogió personalmente. También cuenta que a cuatro hombres y dos mujeres se les impusieron ochenta latigazos cada uno por el vino, y a dos soldados del propio al-Hadi se les impusieron setenta cada uno, como castigo menor a la pena, tras testificar que habían estado hablando con las mujeres; las mujeres fueron examinadas, una de ellas estaba embarazada y se encontraba retenida en una casa o bajo custodia hasta el parto, y la otra, una mujer libre, recibió sesenta latigazos como castigo."
  fr: "Muhammad ibn Ubaydallah rapporte avoir vu al-Hadi amener un homme ivre; deux hommes de confiance attestèrent qu'il avait bu du vin. On le retint jusqu'à ce qu'il soit sobre, puis on lui infligea quatre-vingts coups de fouet choisis par al-Hadi lui-même. Il relate également le cas de quatre hommes et deux femmes: deux reçurent quatre-vingts coups chacun pour avoir bu du vin, et deux soldats d'al-Hadi reçurent soixante-dix coups chacun, à titre de correction, après avoir témoigné qu'ils avaient parlé avec les femmes. Ces dernières furent interrogées; l'une d'elles, enceinte, était retenue dans une maison ou sous surveillance jusqu'à l'accouchement, tandis que l'autre, une femme libre, reçut soixante coups à titre de correction."
  tr: "Muhammed ibn Ubeyd Allah, Hadi'nin sarhoş bir adamı getirdiğini gördüğünü ve iki güvenilir şahidin adamın şarap içtiğine dair tanıklık ettiğini anlatır. Adamı ayılıncaya kadar hapse attıktan sonra, kendi seçtiği bir kırbaçla seksen kırbaçladı. Ayrıca dört erkek ve iki kadının olayını da anlatır: İkisi şarap içtikleri için seksener kırbaçla, askerlerinden ikisi ise iki kadınla konuştukları için daha hafif bir ceza olarak yetmişer kırbaçla cezalandırıldı. İki kadın incelendi ve hamilelikleri ve özgürlükleri göz önünde bulundurularak, içlerinden biri altmış kırbaçla cezalandırıldı."
  id: "Muhammad ibn Ubayd Allah menceritakan bahwa ia melihat al-Hadi membawa seorang pria mabuk, dan dua saksi yang dapat dipercaya bersaksi bahwa pria itu sedang minum anggur. Ia memenjarakan pria itu sampai ia sadar, kemudian mencambuknya delapan puluh kali dengan cambuk yang dipilihnya sendiri. Ia juga menceritakan kejadian empat pria dan dua wanita: dua orang dicambuk delapan puluh kali masing-masing karena minum anggur, dan dua tentaranya dicambuk tujuh puluh kali masing-masing sebagai hukuman yang lebih ringan karena mereka terlihat berbicara dengan kedua wanita tersebut. Kedua wanita itu diperiksa, dan status mereka dipertimbangkan berdasarkan kehamilan dan kebebasan, dan salah satu dari mereka dicambuk enam puluh kali sebagai hukuman."
