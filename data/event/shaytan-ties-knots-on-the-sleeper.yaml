id: event/shaytan-ties-knots-on-the-sleeper
class: event
kind: other
label:
  ar: "عقد الشيطان على قافية رأس النائم"
  en: "The shaytan's knots on the sleeper's crown"
  ur: "سونے والے کی پیشانی پر شیطان کی گانٹھیں"
summary:
  ar: "يعقد الشيطان على قافية رأس أحدهم إذا نام ثلاث عقد يضرب مكان كل عقدة عليك ليل طويل فارقد فإن استيقظ فذكر الله انحلت عقدة فإن توضأ انحلت عقدة فإن صلى انحلت عقدة {cite:muwatta-maruf-1997} [[passage/muwatta-1-486|الموطأ 486]]."
  en: "The shaytan ties three knots on the crown of one who sleeps: on each knot he strikes 'your night is long, sleep'; if he wakes and remembers God a knot is loosed, if he performs ablution a knot is loosed, if he prays a knot is loosed {cite:muwatta-maruf-1997} [[passage/muwatta-1-486|Muwatta 486]]."
  ur: "شیطان اس شخص کی پیشانی پر جو سوئے تین گانٹھیں باندھتا ہے، اور ہر گانٹھ کی جگہ مارتا ہے «تمہاری رات لمبی ہے سو جاؤ»؛ اگر جاگ کر اللہ کا ذکر کرے تو ایک گانٹھ کھلتی ہے، وضو کرے تو ایک، نماز پڑھے تو ایک {cite:muwatta-maruf-1997} [[passage/muwatta-1-486|موطأ 486]]۔"
