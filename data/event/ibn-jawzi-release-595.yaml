id: event/ibn-jawzi-release-595
class: event
kind: other
label:
  ar: "إطلاق سراح ابن الجوزي وعودته إلى بغداد سنة ٥٩٥هـ"
  en: "Ibn al-Jawzi released and returns to Baghdad, 595/1198–9"
  ur: "ابن الجوزی کی رہائی اور بغداد واپسی، 595ھ/1198–9ء"
  es: "Ibn al-Jawzi es liberado y regresa a Bagdad, 595/1198–9"
  fr: "Ibn al-Jawzi est libéré et retourne à Bagdad, 595/1198–9"
  tr: "İbn el-Cevzi, Hicri 595 yılında serbest bırakılarak Bağdat'a döndü."
  id: "Ibn al-Jawzi dibebaskan dan kembali ke Baghdad pada tahun 595 Hijriah."
summary:
  ar: "أُطلق سراح ابن الجوزي من منفاه في واسط سنة ٥٩٥هـ/١١٩٨–١١٩٩م بشفاعة أم الخليفة الناصر — وكانت امرأة متدينة جداً كسب مودّتها ابن الواعظ الشيخ محيي الدين يوسف الذي كان سيعمل في خدمة الخلافة — فعاد ابن الجوزي إلى بغداد عودة ظافرة، ثم توفي بعد ذلك بقليل سنة ٥٩٧هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  en: "Ibn al-Jawzi was set free from his exile at Wasit in 595/1198–9 on the intervention of the caliph al-Nasir's mother, a very devout woman whose sympathy had been gained by one of the preacher's sons, the shaykh Muhyi al-Din Yusuf, who was to make his career in the service of the caliphate. Ibn al-Jawzi made a triumphant return to Baghdad, but died soon after, in 597 {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  ur: "ابن الجوزی 595ھ/1198–9ء میں واسط کی جلاوطنی سے رہا ہوئے، خلیفہ ناصر کی والدہ کی سفارش پر — ایک نہایت دیندار خاتون جس کا دل ان کے فرزند شیخ محی الدین یوسف نے پا لیا تھا جو بعد میں خلافت کی خدمت میں رہا۔ ابن الجوزی کی بغداد واپسی فتح مندانہ ہوئی مگر وہ جلد ہی 597ھ میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}۔"
  es: "Ibn al-Jawzi fue liberado de su exilio en Wasit en 595/1198–9 gracias a la intervención de la madre del califa al-Nasir, una mujer muy devota cuya simpatía había sido ganada por uno de los hijos del predicador, el jeque Muhyi al-Din Yusuf, quien haría carrera al servicio del califato. Ibn al-Jawzi regresó triunfalmente a Bagdad, pero murió poco después, en 597 {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  fr: "Ibn al-Jawzi fut libéré de son exil à Wasit en 595/1198-1199 grâce à l'intervention de la mère du calife al-Nasir, une femme très pieuse dont la sympathie avait été gagnée par l'un des fils du prédicateur, le cheikh Muhyi al-Din Yusuf, qui allait consacrer sa carrière au service du califat. Ibn al-Jawzi fit un retour triomphal à Bagdad, mais mourut peu après, en 597."
  tr: "İbn el-Cevzi, Hicri 595/Miladi 1198-1199 yılında Halife el-Nasır'ın annesinin arabuluculuğuyla Wasit'teki sürgününden kurtuldu. Bu kadın çok dindar bir kadındı ve vaizin oğlu Şeyh Muhi el-Din Yusuf'un da desteğini kazanmıştı; Şeyh Muhi el-Din Yusuf da halifeliğin hizmetinde çalışacaktı. Böylece İbn el-Cevzi zaferle Bağdat'a döndü ve biraz sonra Hicri 597 yılında vefat etti. {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}"
  id: "Ibn al-Jawzi dibebaskan dari pengasingannya di Wasit pada tahun 595 H/1198–1199 M melalui perantaraan ibu Khalifah al-Nasir — beliau adalah seorang wanita yang sangat religius yang mendapatkan restu dari putra pendakwah tersebut, Syekh Muhi al-Din Yusuf, yang kemudian bertugas dalam pelayanan Kekhalifahan — sehingga Ibn al-Jawzi kembali ke Baghdad dengan penuh kemenangan, dan kemudian meninggal dunia beberapa waktu kemudian pada tahun 597 H {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
