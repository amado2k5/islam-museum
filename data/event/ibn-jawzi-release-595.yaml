label:
  ar: "إطلاق سراح ابن الجوزي وعودته إلى بغداد سنة ٥٩٥هـ"
  en: "Ibn al-Jawzi released and returns to Baghdad, 595/1198–9"
  ur: "ابن الجوزی کی رہائی اور بغداد واپسی، 595ھ/1198–9ء"
summary:
  ar: "أُطلق سراح ابن الجوزي من منفاه في واسط سنة ٥٩٥هـ/١١٩٨–١١٩٩م بشفاعة أم الخليفة الناصر — وكانت امرأة متدينة جداً كسب مودّتها ابن الواعظ الشيخ محيي الدين يوسف الذي كان سيعمل في خدمة الخلافة — فعاد ابن الجوزي إلى بغداد عودة ظافرة، ثم توفي بعد ذلك بقليل سنة ٥٩٧هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  en: "Ibn al-Jawzi was set free from his exile at Wasit in 595/1198–9 on the intervention of the caliph al-Nasir's mother, a very devout woman whose sympathy had been gained by one of the preacher's sons, the shaykh Muhyi al-Din Yusuf, who was to make his career in the service of the caliphate. Ibn al-Jawzi made a triumphant return to Baghdad, but died soon after, in 597 {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  ur: "ابن الجوزی 595ھ/1198–9ء میں واسط کی جلاوطنی سے رہا ہوئے، خلیفہ ناصر کی والدہ کی سفارش پر — ایک نہایت دیندار خاتون جس کا دل ان کے فرزند شیخ محی الدین یوسف نے پا لیا تھا جو بعد میں خلافت کی خدمت میں رہا۔ ابن الجوزی کی بغداد واپسی فتح مندانہ ہوئی مگر وہ جلد ہی 597ھ میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}۔"
