id: event/distribution-of-hunayn-spoils
class: event
kind: other
label: { en: "The distribution of Hunayn spoils at al-Ji'rana", ar: "قسمة غنائم حنين وعطايا المؤلفة بالجعرانة" }
summary:
  en: "At al-Ji'rana the Prophet divided the vast spoils of Hunayn (twenty-four thousand camels, forty thousand sheep, and four thousand silver awqiya); he warned against the misappropriation of spoils, and bestowed major grants upon Meccan notables and Najdi tribal chieftains to reconcile their hearts to Islam. وعند البخاري جمع النبي الأنصار في قبة من أدم بعدما قالت فيهم نفسها حين أعطى قريشاً وتركهم «وسيوفنا تقطر من دمائهم»، فقال «أما ترضون أن يذهب الناس بالأموال وتذهبون بالنبي إلى رحالكم»، وقال «الأنصار شعار والناس دثار، إنكم ستلقون بعدي أثرة فاصبروا حتى تلقوني على الحوض» {cite:sahih-al-bukhari 4330}، {cite:sahih-al-bukhari 4331}. وجاءه وفد هوازن يسأل رد الأموال أو السبي فخيرهم بينهما فاختاروا سبيهم فردّهم {cite:sahih-al-bukhari 2539}."
  ar: "قسم النبي بالجعرانة أموال حنين العظيمة (24 ألف بعير وأكثر من 40 ألف شاة و4 آلاف أوقية فضة) بعد حجز الخمس؛ وحذر من الغلول، وخص سادات قريش ورؤساء قبائل نجد بعطايا جزيلة تأليفاً لقلوبهم."
