label: { en: "The distribution of Hunayn spoils at al-Ji'rana", ar: "قسمة غنائم حنين وعطايا المؤلفة بالجعرانة" }
summary:
  en: "At al-Ji'rana the Prophet divided the vast spoils of Hunayn (twenty-four thousand camels, forty thousand sheep, and four thousand silver awqiya); he warned against the misappropriation of spoils, and bestowed major grants upon Meccan notables and Najdi tribal chieftains to reconcile their hearts to Islam."
  ar: "قسم النبي بالجعرانة أموال حنين العظيمة (24 ألف بعير وأكثر من 40 ألف شاة و4 آلاف أوقية فضة) بعد حجز الخمس؛ وحذر من الغلول، وخص سادات قريش ورؤساء قبائل نجد بعطايا جزيلة تأليفاً لقلوبهم."
