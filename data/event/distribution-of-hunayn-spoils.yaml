id: event/distribution-of-hunayn-spoils
class: event
kind: other
label: { en: "The distribution of Hunayn spoils at al-Ji'rana", ar: "قسمة غنائم حنين وعطايا المؤلفة بالجعرانة", es: "El reparto del botín de Hunayn en al-Ji'rana", fr: "La distribution du butin de Hunayn à al-Ji'rana", ur: "حنین کی تقسیم الجیرانہ میں غنیمت ہے۔", tr: "Huneyn'in ganimetlerinin paylaşımı ve yazarın El-Ceranah'taki hediyeleri", id: "Pembagian rampasan perang Hunayn dan hadiah dari penulis di Al-Ja'ranah" }
summary:
  en: "At al-Ji'rana the Prophet divided the vast spoils of Hunayn (twenty-four thousand camels, forty thousand sheep, and four thousand silver awqiya); he warned against the misappropriation of spoils, and bestowed major grants upon Meccan notables and Najdi tribal chieftains to reconcile their hearts to Islam. وعند البخاري جمع النبي الأنصار في قبة من أدم بعدما قالت فيهم نفسها حين أعطى قريشاً وتركهم «وسيوفنا تقطر من دمائهم»، فقال «أما ترضون أن يذهب الناس بالأموال وتذهبون بالنبي إلى رحالكم»، وقال «الأنصار شعار والناس دثار، إنكم ستلقون بعدي أثرة فاصبروا حتى تلقوني على الحوض» {cite:sahih-al-bukhari 4330}، {cite:sahih-al-bukhari 4331}. وجاءه وفد هوازن يسأل رد الأموال أو السبي فخيرهم بينهما فاختاروا سبيهم فردّهم {cite:sahih-al-bukhari 2539}."
  ar: "قسم النبي بالجعرانة أموال حنين العظيمة ⁦(24 ألف بعير وأكثر من 40 ألف شاة و4 آلاف أوقية فضة)⁩ بعد حجز الخمس؛ وحذر من الغلول، وخص سادات قريش ورؤساء قبائل نجد بعطايا جزيلة تأليفاً لقلوبهم."
  es: "En al-Ji'rana, el Profeta distribuyó el vasto botín de Hunayn (veinticuatro mil camellos, cuarenta mil ovejas y cuatro mil monedas de plata); advirtió contra la malversación del botín y otorgó importantes concesiones a notables de La Meca y jefes tribales de Najd para que se convirtieran al Islam. Según al-Bujari, el Profeta reunió a los Ansar en una tienda de cuero después de que, al entregarles sus bienes a los Quraysh y dejarlos, dijeran: «Nuestras espadas aún goteaban con su sangre». Les preguntó: «¿No os conformáis con que la gente se lleve las riquezas mientras vosotros lleváis al Profeta de vuelta a vuestros hogares?». También dijo: «Los Ansar son el círculo interno, y el resto de la gente es el círculo externo. Recibiréis favoritismos después de mí, así que sed pacientes hasta que me encontréis en la Cisterna». (Sahih al-Bukhari 4330, 4331) Una delegación de Hawazin se presentó ante él pidiéndole la devolución de su dinero o de sus cautivos. Les dio a elegir entre las dos opciones, y ellos escogieron a sus cautivos, así que él se los devolvió. {cite:sahih-al-bukhari 2539}"
  fr: "À al-Ji'rana, le Prophète partagea le vaste butin de Hunayn (vingt-quatre mille chameaux, quarante mille moutons et quatre mille pièces d'argent). Il mit en garde contre le détournement de ce butin et accorda d'importantes dotations aux notables mecquois et aux chefs tribaux du Najd afin de les ramener à l'islam. Selon al-Bukhari, le Prophète réunit les Ansar sous une tente de cuir après qu'ils eurent dit, lorsqu'il avait donné aux Quraysh et les avait laissés « tandis que nos épées dégoulinaient de leur sang ». Il leur dit: « N'êtes-vous pas satisfaits que le peuple s'empare des richesses tandis que vous ramenez le Prophète chez vous ? » Il ajouta: « Les Ansar forment le cercle restreint, et le reste du peuple, le cercle extérieur. Vous rencontrerez du favoritisme après moi, alors soyez patients jusqu'à ce que vous me retrouviez à la Cimetière. » (Sahih al-Bukhari 4330, 4331) Une délégation de Hawazin vint le trouver pour lui demander de lui restituer son argent ou ses captifs. Il leur laissa le choix, et ils choisirent leurs captifs, qu'il leur rendit. {cite:sahih-al-bukhari 2539}"
  ur: "الجیرانہ میں نبی نے حنین کے مال غنیمت کو تقسیم کیا ⁦(چوبیس ہزار اونٹ، چالیس ہزار بھیڑیں اور چار ہزار چاندی کے اوقیہ)⁩۔ اس نے مال غنیمت کے غلط استعمال کے خلاف خبردار کیا، اور مکہ کے معززین اور نجدی قبائلی سرداروں کو ان کے دلوں کو اسلام کے ساتھ ملانے کے لیے بڑی گرانٹس عطا کیں۔ بخاری کے مطابق، نبی نے انصار کو چمڑے کے خیمے میں جمع کیا جب وہ آپس میں کہہ چکے تھے، جب آپ نے قریش کو دیا اور انہیں چھوڑ دیا، \"جب کہ ہماری تلواریں ان کے خون سے ٹپک رہی تھیں۔\" آپ نے فرمایا: ”کیا تم اس بات پر راضی نہیں ہو کہ لوگ مال لے جائیں جب کہ تم نبی کو اپنے گھروں میں لے جا رہے ہو؟ آپ نے یہ بھی فرمایا کہ انصار اندرونی حلقہ ہیں اور باقی لوگ بیرونی حلقہ ہیں، میرے بعد تم پر احسان ہو گا، لہٰذا صبر کرو یہاں تک کہ تم حوض پر مجھ سے مل جاؤ۔ ⁦(صحیح البخاری 4330، 4331)⁩ ہوازن کا ایک وفد اس کے پاس آیا کہ ان کی رقم یا ان کے اسیروں کی واپسی کا مطالبہ کیا۔ اُس نے اُن دونوں میں سے ایک کا انتخاب کیا اور اُنہوں نے اپنے قیدیوں کو چُن لیا تو اُس نے اُن کو واپس کر دیا۔ {حوالہ: صحیح البخاری 2539}"
  tr: "Peygamber, El-Ciranah'da Huneyn'in büyük servetini (24.000 deve, 40.000'den fazla koyun ve 4.000 ons gümüş) beşte birini ayırdıktan sonra paylaştırdı; zimmete geçirmeye karşı uyardı ve Kureyş önderlerine ve Necd kabilelerinin reislerine gönüllerini kazanmak için cömert hediyeler verdi."
  id: "Nabi membagi kekayaan besar Hunayn (24.000 unta, lebih dari 40.000 domba, dan 4.000 ons perak) di Al-Ji'ranah setelah menyisihkan seperlima; beliau memperingatkan terhadap penggelapan, dan memberikan hadiah yang berlimpah kepada para pemimpin Quraisy dan kepala suku Najd untuk memenangkan hati mereka."
