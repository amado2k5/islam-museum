id: event/orhan-reburies-uthman-bursa-726
class: event
kind: other
label: { ar: "أورخان يعيد دفن أبيه عثمان في بورصة", en: "Orhan reburies his father Osman in Bursa", ur: "اورخان نے اپنے والد عثمان کو بورصہ میں دوبارہ دفنایا", es: "Orhan vuelve a enterrar a su padre Osman en Bursa", fr: "Orhan réenterre son père Osman à Bursa", tr: "Orhan, babası Osman'ı Bursa'da diriltti", id: "Orhan menguburkan kembali ayahnya Osman di Bursa" }
summary:
  ar: "توفي عثمان غازي بسوغوت قبل الفتح بنحو سنتين، فنقله ابنه أورخان بعد دخول بورصة وأعاد دفنه فيما كان معمدية كنيسة النبي إلياس التي حُوّلت إلى مسجد بعد الفتح {cite:freely-ottoman-architecture-2011 p. 36-37}."
  en: "Osman Gazi died at Söğüt about two years before the conquest; after entering Bursa his son Orhan reburied him in what had been the baptistry of the church of St. Elias the Prophet, converted into a mosque after the conquest {cite:freely-ottoman-architecture-2011 p. 36-37}."
  ur: "عثمان غازی فتح سے تقریباً دو برس قبل سوغوت میں انتقال کر گئے؛ بورصہ میں داخلے کے بعد ان کے بیٹے اورخان نے انہیں قدیم کلیسائے ایلیاس کے بپتسمہ خانے میں دوبارہ دفنایا جو فتح کے بعد مسجد بنا دیا گیا تھا {cite:freely-ottoman-architecture-2011 p. 36-37}۔"
  es: "Osman Gazi murió en Söğüt unos dos años antes de la conquista; después de entrar en Bursa, su hijo Orhan lo volvió a enterrar en lo que había sido el baptisterio de la iglesia de San Elías el Profeta, convertida en mezquita después de la conquista {cite:freely-ottoman-architecture-2011 p. 36-37}."
  fr: "Osman Gazi mourut à Söğüt environ deux ans avant la conquête; après son entrée à Bursa, son fils Orhan le réenterra dans ce qui avait été le baptistère de l'église Saint-Élie-le-Prophète, converti en mosquée après la conquête {cite:freely-ottoman-architecture-2011 p. 36-37}."
  tr: "Osman Gazi, fetihten yaklaşık iki yıl önce Söğüt'te vefat etmişti; bu nedenle oğlu Orhan, Bursa'ya girdikten sonra onu başka bir yere taşıyarak, fetihten sonra camiye çevrilen Peygamber İlyas Kilisesi'nin vaftizhanesine yeniden defnettirdi. {cite:freely-ottoman-architecture-2011 s. 36-37}"
  id: "Osman Ghazi meninggal di Söğüt sekitar dua tahun sebelum penaklukan, sehingga putranya Orhan memindahkannya setelah memasuki Bursa dan menguburkannya kembali di tempat yang dulunya merupakan tempat pembaptisan Gereja Nabi Elia, yang kemudian diubah menjadi masjid setelah penaklukan {cite:freely-ottoman-architecture-2011 p. 36-37}."
