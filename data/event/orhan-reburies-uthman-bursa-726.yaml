label: { ar: "أورخان يعيد دفن أبيه عثمان في بورصة", en: "Orhan reburies his father Osman in Bursa", ur: "اورخان نے اپنے والد عثمان کو بورصہ میں دوبارہ دفنایا" }
summary:
  ar: "توفي عثمان غازي بسوغوت قبل الفتح بنحو سنتين، فنقله ابنه أورخان بعد دخول بورصة وأعاد دفنه فيما كان معمدية كنيسة النبي إلياس التي حُوّلت إلى مسجد بعد الفتح {cite:freely-ottoman-architecture-2011 p. 36-37}."
  en: "Osman Gazi died at Söğüt about two years before the conquest; after entering Bursa his son Orhan reburied him in what had been the baptistry of the church of St. Elias the Prophet, converted into a mosque after the conquest {cite:freely-ottoman-architecture-2011 p. 36-37}."
  ur: "عثمان غازی فتح سے تقریباً دو برس قبل سوغوت میں انتقال کر گئے؛ بورصہ میں داخلے کے بعد ان کے بیٹے اورخان نے انہیں قدیم کلیسائے ایلیاس کے بپتسمہ خانے میں دوبارہ دفنایا جو فتح کے بعد مسجد بنا دیا گیا تھا {cite:freely-ottoman-architecture-2011 p. 36-37}۔"
