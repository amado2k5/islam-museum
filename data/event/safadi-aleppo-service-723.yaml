label:
  ar: "الصفدي في الخدمة الديوانية: صفد وحلب والرحبة، ٧٢٣-٧٢٦هـ"
  en: "Al-Safadi's chancery service: Safad, Aleppo, al-Rahba, 723-726/1323-1326"
  ur: "صفدی کی دیوانی خدمات: صفد، حلب، رحبہ، 723-726ھ/1323-1326ء"
  es: "Servicio de cancillería de Al-Safadi: Safad, Alepo, al-Rahba, 723-726/1323-1326"
  fr: "Chancellerie d'Al-Safadi: Safad, Alep, al-Rahba, 723-726/1323-1326"
  tr: "Al-Safadi'nin Divan hizmetindeki çalışmaları: Safed, Halep ve Al-Rahba, Hicri 723-726"
  id: "Al-Safadi dalam pelayanan Diwani: Safed, Aleppo dan Al-Rahba, 723-726 H"
summary:
  ar: "فتحت براعة الصفدي في الإنشاء وحسن خطه أبواب الخدمة الحكومية؛ وكان أول ما وَلِيَ كتابة الدرج بصفد ثم بالقاهرة، وباشر كتابة السر بحلب وقتاً بين ٧٢٣هـ و٧٢٦هـ، وبالرحبة وقتاً في أواخر العقد، وبقي يتردد بين العاصمتين دمشق والقاهرة {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  en: "Al-Safadi's gifts as a stylist and calligrapher opened government service to him: he first held kitabat al-darj at Safad, then at Cairo; he conducted kitabat al-sirr at Aleppo for a time between 723/1323 and 726/1326, and briefly at al-Rahba toward the end of the decade, while shuttling between the capitals Damascus and Cairo {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  ur: "انشا اور خوش خطی کی صلاحیت نے صفدی کے لیے سرکاری خدمات کے دروازے کھولے: پہلے صفد میں کتاتۃ الدرج پھر قاہرہ میں؛ 723ھ/1323ء تا 726ھ/1326ء کے درمیان حلب میں کتاتۃ السر کا منصب سونپا گیا، اور دہائی کے آخر میں مختصر مدت کے لیے رحبہ میں؛ وہ دمشق اور قاہرہ کے درمیان آتا جاتا رہا {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}۔"
  es: "Los dones de Al-Safadi como estilista y calígrafo le abrieron las puertas del servicio gubernamental: primero dirigió el kitabat al-darj en Safad, luego en El Cairo; dirigió el kitabat al-sirr en Alepo durante un tiempo entre 723/1323 y 726/1326, y brevemente en al-Rahba hacia finales de la década, mientras viajaba entre las capitales Damasco y El Cairo {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  fr: "Les dons d'Al-Safadi en tant que styliste et calligraphe lui ont ouvert les portes du service gouvernemental: il a d'abord dirigé le kitabat al-darj à Safad, puis au Caire; il a dirigé le kitabat al-sirr à Alep pendant un certain temps entre 723/1323 et 726/1326, et brièvement à al-Rahba vers la fin de la décennie, tout en faisant la navette entre les capitales Damas et Le Caire {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  tr: "Safadi'nin kompozisyon yeteneği ve güzel el yazısı, devlet hizmetinin kapılarını ona açtı. İlk olarak Safad'da, daha sonra Kahire'de kutsal metinlerin yazımını üstlendi. 723-726 Hicri yılları arasında bir süre Halep'te, on yılın sonlarında ise bir süre Rahba'da gizli metinlerin yazımını üstlendi. Şam ve Kahire olmak üzere iki başkent arasında gidip gelmeye devam etti. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}"
  id: "Keahlian Al-Safadi dalam menulis dan tulisan tangannya yang bagus membuka pintu bagi kariernya di pemerintahan. Ia pertama kali mengambil alih penulisan gulungan di Safad dan kemudian di Kairo. Ia mengambil alih penulisan kitab rahasia di Aleppo untuk sementara waktu antara tahun 723 H dan 726 H, dan di Al-Rahba untuk sementara waktu di akhir dekade tersebut. Ia terus berpindah-pindah antara dua ibu kota, Damaskus dan Kairo. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
