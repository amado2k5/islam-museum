id: event/lahore-balban-restore-664
class: event
kind: other
label:
  ar: "بلبان يعمر لاهور بعد توليه العرش، ٦٦٤هـ/١٢٦٦م"
  en: "Balban restores Lahore after his accession, 664/1266"
  ur: "بلبن کی تخت نشینی کے بعد لہور کی تعمیر نو، 664ھ/1266ء"
summary:
  ar: "أعاد السلطان غياث الدين بلبن تعمير لاهور عقب توليه عرش دهلي سنة ٦٦٤هـ/١٢٦٦م، بعد خراب أصابها منذ السلب المغولي سنة ٦٣٩هـ/١٢٤١م؛ وظلت مع ذلك لعقود منطقة ثغور تتعرض للغارات المغولية المتكررة {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "The sultan Ghiyath al-Din Balban restored Lahore soon after his accession to the throne of Delhi in 664/1266, following the ruin left by the Mongol sack of 639/1241; it nevertheless remained for decades a frontier region exposed to regular Mongol attacks {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "سلطان غیاث الدین بلبن نے 664ھ/1266ء میں دہلی کے تخت پر بیٹھنے کے فوراً بعد لہور کی تعمیر نو کی، جب کہ شہر 639ھ/1241ء کے منگولوں کی لٹ مار سے تباہ ہوا تھا؛ اس کے باوجود یہ شہر کئی دہائیوں تک ایک سرحدی علاقہ رہا جہاں منگولوں کے باقاعدہ حملے ہوتے رہے {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
