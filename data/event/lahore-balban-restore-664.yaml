id: event/lahore-balban-restore-664
class: event
kind: other
label:
  ar: "بلبان يعمر لاهور بعد توليه العرش، ٦٦٤هـ/١٢٦٦م"
  en: "Balban restores Lahore after his accession, 664/1266"
  ur: "بلبن کی تخت نشینی کے بعد لہور کی تعمیر نو، 664ھ/1266ء"
  es: "Balban restaura Lahore tras su ascenso al trono, 664/1266"
  fr: "Balban restaure Lahore après son accession au pouvoir, 664/1266"
  tr: "Balban, tahta geçtikten sonra (Hicri 664/Miladi 1266) Lahor'u yeniden inşa etti."
  id: "Balban membangun kembali Lahore setelah naik tahta, 664 H/1266 M."
summary:
  ar: "أعاد السلطان غياث الدين بلبن تعمير لاهور عقب توليه عرش دهلي سنة ٦٦٤هـ/١٢٦٦م، بعد خراب أصابها منذ السلب المغولي سنة ٦٣٩هـ/١٢٤١م؛ وظلت مع ذلك لعقود منطقة ثغور تتعرض للغارات المغولية المتكررة {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "The sultan Ghiyath al-Din Balban restored Lahore soon after his accession to the throne of Delhi in 664/1266, following the ruin left by the Mongol sack of 639/1241; it nevertheless remained for decades a frontier region exposed to regular Mongol attacks {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "سلطان غیاث الدین بلبن نے 664ھ/1266ء میں دہلی کے تخت پر بیٹھنے کے فوراً بعد لہور کی تعمیر نو کی، جب کہ شہر 639ھ/1241ء کے منگولوں کی لٹ مار سے تباہ ہوا تھا؛ اس کے باوجود یہ شہر کئی دہائیوں تک ایک سرحدی علاقہ رہا جہاں منگولوں کے باقاعدہ حملے ہوتے رہے {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  es: "El sultán Ghiyath al-Din Balban restauró Lahore poco después de su ascenso al trono de Delhi en 664/1266, tras la ruina dejada por el saqueo mongol de 639/1241; sin embargo, durante décadas siguió siendo una región fronteriza expuesta a ataques mongoles regulares {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  fr: "Le sultan Ghiyath al-Din Balban restaura Lahore peu après son accession au trône de Delhi en 664/1266, suite aux ruines laissées par le sac mongol de 639/1241; elle resta néanmoins pendant des décennies une région frontalière exposée à des attaques mongoles régulières {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  tr: "Sultan Ghiyasuddin Balban, 639 Hicri/1241 Miladi yılında Moğol yağmasından sonra harap olmuş olan Lahor'u, 664 Hicri/1266 Miladi yılında Delhi tahtına geçtikten sonra yeniden inşa etti; ancak şehir, onlarca yıl boyunca sık sık Moğol baskınlarına maruz kalan bir sınır bölgesi olarak kaldı. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}"
  id: "Sultan Ghiyasuddin Balban membangun kembali Lahore setelah naik tahta Delhi pada tahun 664 H/1266 M, setelah kota itu hancur akibat penjarahan Mongol pada tahun 639 H/1241 M; namun, selama beberapa dekade kota itu tetap menjadi wilayah perbatasan yang sering menjadi sasaran serangan Mongol {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
