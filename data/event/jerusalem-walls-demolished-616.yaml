label: { ar: "هدم سور بيت المقدس سنة 616", en: "Demolition of the walls of Jerusalem, 616" }
summary:
  ar: "في أول سنة ست عشرة وستمائة خرَّب الملك المعظم سور بيت المقدس خوفاً وعجزاً من الفرنج أن تملكه، فشرعوا في هدم السور في أول يوم من المحرم وضج الناس وخرج النساء المخدرات والبنات والشيوخ والعجائز والشباب إلى الصخرة والأقصى فقطعوا شعورهم وخرجوا هاربين وتركوا أموالهم، وما شكوا أن الفرنج يصبحوهم فهرب بعضهم إلى مصر وبعضهم إلى الكرك وبعضهم إلى دمشق ومات خلق من الجوع والعطش ونهبت الأموال التي كانت لهم بالقدس وأبيع القنطار الزيت بعشرة دراهم، وذم الناس الملك المعظم {cite:shadharat-dhahab p. 65-66}."
  en: "At the start of 616 al-Malik al-Mu'azzam had the walls of Jerusalem destroyed, out of fear and helplessness lest the Franks take it. Work on the wall began on the first day of Muharram. The people cried out; secluded women, girls, old men and women, and young men went out to the Sakhra and al-Aqsa, cut their hair, and fled, leaving their property behind, sure that the Franks would reach them by morning. Some fled to Egypt, some to al-Karak, some to Damascus; multitudes died of hunger and thirst; the wealth they had in Jerusalem was plundered; and a qintar of oil was sold for ten dirhams. The people blamed al-Malik al-Mu'azzam {cite:shadharat-dhahab p. 65-66}."
