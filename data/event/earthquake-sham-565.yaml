kind: disaster-relief
label: { ar: "الزلزلة العظمى بالشام سنة 565هـ", en: "The Great Earthquake in Syria, 565 AH", es: "El gran terremoto de Siria, 565 AH", fr: "Le grand tremblement de terre en Syrie, 565 AH", ur: "شام میں عظیم زلزلہ، 565ھ", tr: "Hicri 565 yılında Levant'ta meydana gelen Büyük Deprem", id: "Gempa Bumi Besar di Levant pada tahun 565 Hijriah" }
summary:
  ar: "في شوال سنة خمس وستين وخمس مئة كانت الزلزلة العظمى بالشام فوقع معظم دمشق وشرفات جامع بني أمية ووقع نصف قلعة حلب والباب وهلك من أهالي حماة ثمانون ألفاً ووقعت قلعة حصن الأكراد ولم يبق لسورها أثر {cite:shadharat-dhahab p. 696}."
  en: "In Shawwal 565 the great earthquake struck Syria — most of Damascus and the Umayyad Mosque's porticoes fell, half Aleppo's citadel and its gate, eighty thousand of Hamah's people perished, and Hisn al-Akrad's castle collapsed leaving no trace of its wall {cite:shadharat-dhahab p. 696}."
  es: "En Shawwal 565, el gran terremoto azotó Siria: la mayor parte de Damasco y los pórticos de la Mezquita de los Omeyas se derrumbaron, la mitad de la ciudadela de Alepo y su puerta, ochenta mil habitantes de Hamah perecieron y el castillo de Hisn al-Akrad se derrumbó sin dejar rastro de su muralla {cite:shadharat-dhahab p. 696}."
  fr: "En Shawwal 565, le grand tremblement de terre frappa la Syrie — la majeure partie de Damas et les portiques de la mosquée des Omeyyades s'effondrèrent, la moitié de la citadelle d'Alep et sa porte, quatre-vingt mille habitants de Hama périrent et le château de Hisn al-Akrad s'écroula sans laisser de trace de ses murs {cite:shadharat-dhahab p. 696}."
  ur: "شوال 565 میں شام میں زبردست زلزلہ آیا - دمشق اور اموی مسجد کے بیشتر حصے گر گئے، حلب کا آدھا قلعہ اور اس کا دروازہ، حماہ کے اسّی ہزار لوگ مارے گئے، اور حسن الکرد کا قلعہ منہدم ہو گیا، اس کی دیوار کا کوئی نشان نہیں بچا۔ 696}۔"
  tr: "Hicri 565 yılının Şevval ayında Levant'ta büyük bir deprem oldu; Şam'ın büyük bir kısmı ve Emevi Camii'nin balkonları yıkıldı, Halep Kalesi'nin yarısı ve kapısı çöktü, Hama'dan seksen bin kişi öldü ve Hisn el-Akrad kalesi yıkıldı, surlarından eser kalmadı. {cite:shadharat-dhahab s. 696}"
  id: "Pada bulan Syawal tahun 565 Hijriah, terjadi gempa bumi besar di Levant, dan sebagian besar Damaskus serta balkon Masjid Umayyah runtuh, separuh Benteng Aleppo dan gerbangnya roboh, delapan puluh ribu orang dari Hama tewas, dan benteng Hisn al-Akrad runtuh, dan tidak ada jejak temboknya yang tersisa. {cite:shadharat-dhahab hlm. 696}"
