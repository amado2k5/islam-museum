id: event/qifti-diwan-zahir-606
class: event
kind: other
label:
  ar: "الملك الظاهر يولي القفطي ديوان المال بحلب، نحو ٦٠٦هـ"
  en: "Al-Malik al-Zahir puts al-Qifti over Aleppo's diwan of finances, c. 606/1210"
  ur: "ملک ظاہر نے قفطی کو حلب کے دیوان مال پر مقرر کیا، تقریباً 606ھ/1210ء"
summary:
  ar: "وضع أتابك حلب الملك الظاهر غازي القفطيَ على ديوان المال، وهو عمل اضطلع به على كره منه، وجاءه به اللقب المشهور «القاضي الأكرم» {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ والتاريخ تقريبي داخل ولاية الظاهر ⁦(٥٨٢–٦١٣هـ)⁩ قبل وفاته واستقالة القفطي سنة ٦١٣هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "The Atabeg of Aleppo, al-Malik al-Zahir Ghazi, placed al-Qifti in charge of the diwan of finances — a task he undertook only reluctantly, but which brought him the honorific title al-Qadi al-Akram {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; the date is approximate within al-Zahir's reign (582–613), before his death and al-Qifti's resignation in 613 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "حلب کے اتابک ملک ظاہر غازی نے قفطی کو دیوان مال کا ذمہ دار بنایا — وہ کام انہوں نے بے رغبتی سے قبول کیا مگر اسی سے انھیں «قاضی اکرم» کا خطاب ملا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ تاریخ ظاہر کی دور حکومت ⁦(582–613ھ)⁩ میں تقریبی ہے، ان کی وفات اور قفطی کے 613ھ میں مستعفی ہونے سے پہلے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
