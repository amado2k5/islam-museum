summary:
  ar: "بنى بايزيد الأول الجامع الكبير ببورصة في الأعوام 1396-1399م، وموّله بغنائم نصره في معركة نيقوبوليس في 24 سبتمبر 1396م؛ وهو أعظم الجوامع الأناضولية التي شُيّدت في القرنين اللذين سبقا فتح القسطنطينية {cite:freely-ottoman-architecture-2011 p. 42}."
  en: "Bayezid I built Bursa's Grand Mosque (Ulu Cami) in 1396-1399 CE, financed with the spoil of his victory over the crusader army at Nicopolis on 24 September 1396; it is the grandest Anatolian mosque of the two centuries before the conquest of Constantinople {cite:freely-ottoman-architecture-2011 p. 42}."
  ur: "بایزید اول نے 1396-1399ء میں بورصہ کی عظیم مسجد بنوائی، جس کی لاگت نیکوپولس کی فتح (24 ستمبر 1396ء) کے مالِ غنیمت سے ادا ہوئی؛ یہ فتح قسطنطنیہ سے پہلے کی دو صدیوں کی عظیم ترین اناطولیائی مسجد ہے {cite:freely-ottoman-architecture-2011 p. 42}۔"
