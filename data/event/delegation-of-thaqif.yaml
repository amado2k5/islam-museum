label: { en: "The delegation of Thaqif", ar: "وفد ثقيف" }
summary:
  en: "In Ramadan 9 AH six men of Thaqif led by Abd Yalil ibn Amr came to Medina; after requesting exemptions the Prophet refused, they surrendered and accepted Islam, stipulating that the Prophet himself order the demolition of al-Lat, and he appointed the youngest of them, Uthman ibn Abi al-As, over them."
  ar: "قدم ستة من ثقيف بقيادة عبد ياليل بن عمرو المدينة في رمضان سنة 9هـ، فسألوا النبي الإذن لهم بالزنا والخمر والربا وبقاء اللات والإعفاء من الصلاة فأبى، فأسلموا واشترطوا أن يتولى هدم اللات، وأمّر عليهم أصغرهم عثمان بن أبي العاص."
