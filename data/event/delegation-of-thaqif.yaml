id: event/delegation-of-thaqif
class: event
kind: treaty
label: { en: "The delegation of Thaqif", ar: "وفد ثقيف", es: "La delegación de Thaqif", fr: "La délégation de Thaqif", ur: "ثقیف کا وفد" }
summary:
  en: "In Ramadan 9 AH six men of Thaqif led by Abd Yalil ibn Amr came to Medina; after requesting exemptions the Prophet refused, they surrendered and accepted Islam, stipulating that the Prophet himself order the demolition of al-Lat, and he appointed the youngest of them, Uthman ibn Abi al-As, over them."
  ar: "قدم ستة من ثقيف بقيادة عبد ياليل بن عمرو المدينة في رمضان سنة 9هـ، فسألوا النبي الإذن لهم بالزنا والخمر والربا وبقاء اللات والإعفاء من الصلاة فأبى، فأسلموا واشترطوا أن يتولى هدم اللات، وأمّر عليهم أصغرهم عثمان بن أبي العاص."
  es: "En Ramadán del año 9 de la Hégira, seis hombres de Thaqif, liderados por Abd Yalil ibn Amr, llegaron a Medina; tras solicitar exenciones que el Profeta denegó, se rindieron y aceptaron el Islam, estipulando que el propio Profeta ordenara la demolición de al-Lat, y designó al más joven de ellos, Uthman ibn Abi al-As, como jefe de ellos."
  fr: "Au Ramadan de l'an 9 de l'Hégire, six hommes de Thaqif, menés par Abd Yalil ibn Amr, arrivèrent à Médine; après avoir demandé des exemptions, le Prophète les refusa, ils se rendirent et acceptèrent l'Islam, stipulant que le Prophète lui-même ordonne la démolition d'al-Lat, et il nomma le plus jeune d'entre eux, Uthman ibn Abi al-As, à leur tête."
  ur: "رمضان 9 ہجری میں عبد یلیل بن عمرو کی قیادت میں ثقیف کے چھ آدمی مدینہ آئے۔ استثنیٰ کی درخواست کرنے کے بعد نبی نے انکار کر دیا، انہوں نے ہتھیار ڈال دیے اور اسلام قبول کر لیا، یہ شرط رکھی کہ رسول اللہ نے خود لات کو منہدم کرنے کا حکم دیا، اور آپ نے ان میں سب سے چھوٹے عثمان بن ابی العاص کو ان پر مقرر کیا۔"
