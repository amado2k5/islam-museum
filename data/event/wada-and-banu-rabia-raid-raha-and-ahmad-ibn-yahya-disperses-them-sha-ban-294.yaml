id: event/wada-and-banu-rabia-raid-raha-and-ahmad-ibn-yahya-disperses-them-sha-ban-294
class: event
kind: other
label:
  ar: "غارة بني ربيعة والوادعيين على راحة، وصرف أحمد بن يحيى لهم، شعبان 294هـ، ص337-338"
  en: "The raid of Banu Rabi'a and Wada'a on Raha, and Ahmad ibn Yahya disperses them, Sha'ban 294 AH, pp. 337-338"
  ur: "بنی ربیعہ اور وادعہ کا راحہ پر حملہ، اور احمد بن یحییٰ کا انہیں منتشر کرنا، شعبان 294ھ، ص337-338"
  es: "La incursión de Banu Rabi'a y Wada'a en Raha, y Ahmad ibn Yahya los dispersa, Sha'ban 294 AH, págs. 337-338."
  fr: "Le raid des Banu Rabi'a et des Wada'a sur Raha, et Ahmad ibn Yahya les disperse, Sha'ban 294 AH, pp. 337-338"
summary:
  ar: "أمر عبد الله بن بسطام والوادعيون بالغارة على راحة، فاشتبك الفريقان، فأرسل الهادي ابنه أحمد بن يحيى فصرف بني ربيعة ومن معهم إليه."
  en: "Abdallah ibn Bistam and Wada'a ordered a raid on Raha, the sides fought, and al-Hadi sent his son Ahmad ibn Yahya, who turned Banu Rabi'a and their companions back to his father."
  ur: "عبداللہ بن بسطام اور وادعہ نے راحہ پر حملے کا حکم دیا، دونوں فریق لڑ پڑے، اور ہادی نے بیٹے احمد بن یحییٰ کو بھیجا جنہوں نے بنی ربیعہ اور ان کے ساتھیوں کو واپس موڑ کر والد کے پاس لایا۔"
  es: "Abdallah ibn Bistam y Wada'a ordenaron una incursión en Raha, los bandos lucharon y al-Hadi envió a su hijo Ahmad ibn Yahya, quien convenció a los Banu Rabi'a y a sus compañeros de regresar con su padre."
  fr: "Abdallah ibn Bistam et Wada'a ordonnèrent un raid sur Raha, les deux camps se battirent, et al-Hadi envoya son fils Ahmad ibn Yahya, qui ramena Banu Rabi'a et leurs compagnons à son père."
