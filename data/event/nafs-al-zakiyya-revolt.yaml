id: event/nafs-al-zakiyya-revolt
class: event
kind: revolt
label: { ar: "خروج محمد النفس الزكية وأخيه إبراهيم", en: "The uprising of Muhammad al-Nafs al-Zakiyya and his brother Ibrahim", es: "El levantamiento de Muhammad al-Nafs al-Zakiyya y su hermano Ibrahim", fr: "Le soulèvement de Muhammad al-Nafs al-Zakiyya et de son frère Ibrahim", ur: "محمد النفس الزکیہ اور ان کے بھائی ابراہیم کی بغاوت" }
summary:
  ar: "في سنة خمس وأربعين ومئة خرج محمد وإبراهيم ابنا عبد الله بن حسن بن الحسن بن علي بن أبي طالب فظفر بهما المنصور فقتلهما وجماعة كثيرة من آل البيت، وكان المنصور أول من أوقع الفتنة بين العباسيين والعلويين وكانوا قبل شيئاً واحداً، وآذى خلقاً من العلماء ممن خرج معهما أو أمر بالخروج قتلاً وضرباً منهم أبو حنيفة وعبد الحميد بن جعفر وابن عجلان، وممن أفتى بجواز الخروج مالك بن أنس وقال إنما بايعتم مكرهين وليس على مكره يمين {cite:tarikh-khulafa-minhaj-1434 p. 424-425}. وعند المسعودي استشار المنصور شيخاً عقيلياً فأشار بشحن البصرة بالرجال فظهر إبراهيم بها كما قال، وأخرج إليه عيسى بن موسى من الكوفة في أربعة آلاف فارس وألفي رجل وأتبعه محمد بن قحطبة فقتل بالمدينة وهو ابن خمس وأربعين سنة، ولما اتصل بإبراهيم قتل أخيه وهو بالبصرة صعد المنبر فنعاه وتمثل بأبالمنازل يا خير الفوارس {cite:muruj-al-dhahab p. 284-285}"
  en: "In year 145 Muhammad and Ibrahim, sons of Abdallah ibn al-Hasan the Hasanid, rose; al-Mansur overcame and killed them with a great company of the Prophet's house. He was the first to sow strife between Abbasids and Alids — hitherto one party — and harmed scholars who joined or sanctioned the rising, killing and flogging: Abu Hanifa, Abd al-Hamid ibn Ja'far and Ibn Ajlan among them. Malik ibn Anas ruled the rising lawful: 'your bay'a was coerced, and there is no oath upon the coerced' {cite:tarikh-khulafa-minhaj-1434 p. 424-425}."
  es: "En el año 145, Muhammad e Ibrahim, hijos de Abdallah ibn al-Hasan el Hasaní, se sublevaron. Al-Mansur los venció y los asesinó con un gran grupo de la casa del Profeta. Fue el primero en sembrar la discordia entre los abasíes y los alíes —hasta entonces un solo partido— y perjudicó a los eruditos que se unieron o apoyaron la sublevación, matándolos y azotándolos: Abu Hanifa, Abd al-Hamid ibn Ja'far e Ibn Ajlan, entre ellos. Malik ibn Anas declaró lícita la sublevación: «Tu bay'a fue forzada, y no hay juramento sobre lo forzado» {cita: tarikh-khulafa-minhaj-1434 págs. 424-425}."
  fr: "En l'an 145, Muhammad et Ibrahim, fils d'Abdallah ibn al-Hasan le Hasanide, se soulevèrent. Al-Mansur les vainquit et les tua avec une importante armée de la famille du Prophète. Il fut le premier à semer la discorde entre les Abbassides et les Alides – jusque-là unis – et s'en prit aux savants qui avaient rejoint ou approuvé le soulèvement, les tuant et les flagellant, parmi lesquels Abu Hanifa, Abd al-Hamid ibn Ja'far et Ibn Ajlan. Malik ibn Anas déclara le soulèvement licite: « Votre bay'a vous a été extorquée, et nul ne peut prêter serment sous la contrainte » (voir: Tarikh-Khulafa-Minhaj-1434, p. 424-425)."
  ur: "سال 145 میں محمد اور ابراہیم، عبداللہ بن الحسن حسنید کے بیٹے، اٹھے۔ المنصور نے غلبہ پا کر ان کو رسول اللہ کے گھر کی ایک بڑی جماعت کے ساتھ قتل کر دیا۔ اس نے سب سے پہلے عباسیوں اور الیدوں کے درمیان جھگڑے کا بیج بویا - اب تک ایک فریق - اور اس نے علماء کو نقصان پہنچایا جنہوں نے اٹھنے، قتل اور کوڑے مارنے میں شمولیت اختیار کی یا ان کی منظوری دی: ابو حنیفہ، عبد الحامد ابن جعفر اور ابن عجلان ان میں سے۔ مالک بن انس نے اٹھنے والوں کو حلال قرار دیا: 'تمہاری بیعت زبردستی کی گئی تھی اور جبر پر کوئی قسم نہیں ہے'۔ 424-425}۔"
