label: { ar: "حصار بسطة واستسلام الزغل" }
summary:
  ar: "في عام أربعة وتسعين وثمانمائة نازل صاحب قشتالة بسطة، وكان صاحب وادي آش الزغل لما تعين العدو بمحلته بعث جميع جنده وقواده وحشد أهل نجدة تلك البلاد من وادي آش والمرية والمنكب والبشرات فدخلوها ووقعت حروب عظيمة حتى تقهقر العدو ولم يقدر على منع الداخل والخارج رجباً وشعبان ورمضان، ثم شد الحصار وقرب المدافع من الأسوار واشتد الحال في ذي القعدة وذي الحجة وقل الطعام، وكانوا طامعين في إقلاع العدو عند دخول الشتاء فإذا به ثبت وعزم على الإقامة؛ فاحتال أهل البلد في إظهار جميع أنواع الطعام بالأسواق وأبدوا للعدو القوة وهم في غاية الضعف والحرب خدعة، حتى إن كبيراً من النصارى دخل عيناً يرى صفة الناس {cite:nafh-tib-maqqari p. 525}. ودخل النصارى قلعة بسطة يوم الجمعة عاشر محرم سنة خمس وتسعين وثمانمائة وأخرجوا المسلمين من البلد وأسكنوهم بالربض خوف الثورة، ثم ارتحل للمرية فنزل صاحب وادي آش للقائه وأخذ الحصون والقلاع ومكنه من قلعة وادي آش أوائل صفر، وأطاعته جميع البلاد ولم يبق غير غرناطة وقراها، وجميع ما كان في حكم صاحب وادي آش صار للنصارى في طرفة عين {cite:nafh-tib-maqqari p. 526}."
  en: "The siege of Baza (Rajab 894–Muharram 895): al-Zaghal threw in every levy from Guadix, Almeria and the Alpujarras and held the Castilians off all summer until siege engines sealed the town; starving, the defenders staged full markets to bluff the enemy spy — 'war is deception' — then surrendered the citadel on Friday 10 Muharram 895. Al-Zaghal himself met the Castilian at Almeria and handed over Guadix's citadel in early Safar: everything east of Granada passed to Castile 'in the blink of an eye' {cite:nafh-tib-maqqari p. 525-526}."
