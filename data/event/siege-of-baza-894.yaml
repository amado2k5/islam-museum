label: { ar: "حصار بسطة واستسلام الزغل", en: "Siege of Baza and the surrender of al-Zaghal", es: "El asedio de Baza y la rendición de al-Zaghal", fr: "Siège de Baza et reddition d'al-Zaghal", ur: "بازار کا محاصرہ اور الزغل کا ہتھیار ڈالنا", tr: "Basta kuşatması ve Zaghloul'un teslimiyeti", id: "Pengepungan Basta dan penyerahan diri Zaghloul" }
summary:
  ar: "في عام أربعة وتسعين وثمانمائة نازل صاحب قشتالة بسطة، وكان صاحب وادي آش الزغل لما تعين العدو بمحلته بعث جميع جنده وقواده وحشد أهل نجدة تلك البلاد من وادي آش والمرية والمنكب والبشرات فدخلوها ووقعت حروب عظيمة حتى تقهقر العدو ولم يقدر على منع الداخل والخارج رجباً وشعبان ورمضان، ثم شد الحصار وقرب المدافع من الأسوار واشتد الحال في ذي القعدة وذي الحجة وقل الطعام، وكانوا طامعين في إقلاع العدو عند دخول الشتاء فإذا به ثبت وعزم على الإقامة؛ فاحتال أهل البلد في إظهار جميع أنواع الطعام بالأسواق وأبدوا للعدو القوة وهم في غاية الضعف والحرب خدعة، حتى إن كبيراً من النصارى دخل عيناً يرى صفة الناس {cite:nafh-tib-maqqari p. 525}. ودخل النصارى قلعة بسطة يوم الجمعة عاشر محرم سنة خمس وتسعين وثمانمائة وأخرجوا المسلمين من البلد وأسكنوهم بالربض خوف الثورة، ثم ارتحل للمرية فنزل صاحب وادي آش للقائه وأخذ الحصون والقلاع ومكنه من قلعة وادي آش أوائل صفر، وأطاعته جميع البلاد ولم يبق غير غرناطة وقراها، وجميع ما كان في حكم صاحب وادي آش صار للنصارى في طرفة عين {cite:nafh-tib-maqqari p. 526}."
  en: "The siege of Baza (Rajab 894–Muharram 895): al-Zaghal threw in every levy from Guadix, Almeria and the Alpujarras and held the Castilians off all summer until siege engines sealed the town; starving, the defenders staged full markets to bluff the enemy spy — 'war is deception' — then surrendered the citadel on Friday 10 Muharram 895. Al-Zaghal himself met the Castilian at Almeria and handed over Guadix's citadel in early Safar: everything east of Granada passed to Castile 'in the blink of an eye' {cite:nafh-tib-maqqari p. 525-526}."
  es: "El asedio de Baza (Rajab 894–Muharram 895): al-Zaghal envió todas las tropas de Guadix, Almería y las Alpujarras y contuvo a los castellanos durante todo el verano hasta que las máquinas de asedio sellaron la ciudad; hambrientos, los defensores organizaron grandes mercados para engañar al espía enemigo —«la guerra es engaño»— y luego rindieron la ciudadela el viernes 10 de Muharram de 895. El propio al-Zaghal se reunió con el castellano en Almería y entregó la ciudadela de Guadix a principios de Safar: todo lo que estaba al este de Granada pasó a Castilla «en un abrir y cerrar de ojos» {cite:nafh-tib-maqqari p. 525-526}."
  fr: "Le siège de Baza (Rajab 894 – Muharram 895): al-Zaghal mobilisa toutes les troupes levées à Guadix, Almeria et dans les Alpujarras et tint tête aux Castillans tout l’été, jusqu’à ce que les engins de siège encerclent la ville. Affamés, les défenseurs organisèrent des marchés florissants pour tromper l’espion ennemi – « la guerre est tromperie » – puis capitulèrent et remirent la citadelle le vendredi 10 Muharram 895. Al-Zaghal rencontra lui-même le Castillan à Almeria et lui remit la citadelle de Guadix au début du mois de Safar: tout ce qui se trouvait à l’est de Grenade passa aux mains de la Castille « en un clin d’œil » (voir: Nafh-Tib-Maqqari, p. 525-526)."
  ur: "بازار کا محاصرہ ⁦(رجب 894-محرم 895)⁩: الزغال نے گواڈکس، المیریا اور الپوجراس سے ہر محصول کو پھینک دیا اور تمام موسم گرما میں کاسٹیلین کو روکے رکھا جب تک کہ محاصرے کے انجنوں نے قصبے کو سیل نہ کر دیا۔ بھوک سے مرتے ہوئے، محافظوں نے دشمن کے جاسوس کو بجھانے کے لیے پورے بازاروں کا مظاہرہ کیا - 'جنگ دھوکہ ہے' - پھر 10 محرم 895 بروز جمعہ کو قلعہ کو ہتھیار ڈال دیا۔ الزغل نے خود المیریا میں کاسٹیلین سے ملاقات کی اور صفر کے اوائل میں گواڈکس کے قلعے کے حوالے کر دیا: غرناطہ کے مشرق کی ہر چیز کاسٹیل کی ایک آنکھ سے گزری۔ {حوالہ: نفح تبع مقری ص۔ 525-526}۔"
  tr: "894 yılında Kastilya hükümdarı Baza'ya indi ve Vadi Aş'ın hükümdarı Zeğl idi. Düşmanın kampında olduğunu anlayınca, tüm askerlerini ve komutanlarını gönderdi ve Necd halkını Vadi Aş, Almeria, Almunkab ve Albusherat bölgelerinden seferber etti. Halk şehre girdi ve düşman geri çekilene kadar büyük savaşlar yaşandı. Receb, Şaban ve Ramazan aylarında giriş çıkışları engelleyemedi. Bunun üzerine kuşatmayı sıkılaştırdı ve topları surlara yaklaştırdı. Zilhicce ve Zilhicce aylarında durum daha da kötüleşti ve yiyecek kıtlığı baş gösterdi. Kış gelince düşmanın ayrılacağını umuyorlardı, ancak düşman inatla ve kararlılıkla yerinde kaldı. Bu yüzden şehir halkı, son derece zayıf oldukları halde düşmana güç gösterisi yapmak için pazarlarda her türlü yiyeceği sergilemeye başladı. Savaş bir aldatmacadır; öyle ki, halkın durumunu görmek için büyük bir Hristiyan casus olarak şehre girdi. {cite:nafh-tib-maqqari s. 525}. Hristiyanlar, Hicri 895 yılının Muharrem ayının onuncu Cuma günü Baza kalesine girdiler ve Müslümanları şehirden kovarak isyan korkusuyla banliyölere yerleştirdiler. Sonra Almeria'ya gitti ve Vadi Aş hükümdarı onu karşılamaya geldi, kaleleri ve hisarları ele geçirdi ve Safar ayının başında Vadi Aş kalesini ele geçirmesini sağladı. Bütün ülkeler ona itaat etti ve Granada ve köyleri dışında hiçbir şey kalmadı; Vadi Aş hükümdarının yönetimi altındaki her şey bir anda Hristiyanların eline geçti. {cite:nafh-tib-maqqari s. 526}."
  id: "Pada tahun 894, penguasa Kastilia turun ke Baza, dan penguasa Wadi Ash adalah Zaghl. Ketika musuh bertekad untuk berada di perkemahannya, ia mengirim semua tentara dan komandannya serta memobilisasi penduduk Najd dari wilayah Wadi Ash, Almeria, Almunkab, dan Albusherat. Mereka memasuki wilayah tersebut dan pertempuran besar terjadi hingga musuh mundur dan tidak dapat mencegah mereka yang masuk dan keluar selama bulan Rajab, Sya'ban, dan Ramadan. Kemudian ia memperketat pengepungan dan mendekatkan meriam ke tembok, dan situasi memburuk pada bulan Dzul Qa'dah dan Dzul Hijjah dan makanan menjadi langka. Mereka berharap musuh akan pergi ketika musim dingin tiba, tetapi musuh tetap teguh dan bertekad untuk tinggal. Maka penduduk kota mulai memamerkan segala macam makanan di pasar dan menunjukkan kekuatan mereka kepada musuh sementara mereka sangat lemah, dan perang adalah tipu daya, sehingga seorang Kristen terkemuka masuk sebagai mata-mata untuk melihat kondisi penduduk. {cite:nafh-tib-maqqari hlm. 525}. Orang-orang Kristen memasuki benteng Baza pada hari Jumat, tanggal sepuluh Muharram, tahun 895 H, dan mengusir kaum Muslim dari kota dan menempatkan mereka di pinggiran kota karena takut akan pemberontakan. Kemudian ia pergi ke Almeria, dan penguasa Wadi Ash datang menemuinya dan merebut benteng-benteng dan kastil-kastil serta memungkinkannya untuk merebut benteng Wadi Ash pada awal Safar. Semua negeri menaatinya dan tidak ada yang tersisa kecuali Granada dan desa-desanya, dan segala sesuatu yang berada di bawah kekuasaan penguasa Wadi Ash menjadi milik orang-orang Kristen dalam sekejap mata. {cite:nafh-tib-maqqari hlm. 526}."
