id: event/fall-of-istakhr
class: event
kind: conquest
label: { ar: "فتح أصطخر عنوة", en: "The Forced Taking of Istakhr", es: "La toma forzosa de Istakhr", fr: "La prise forcée d'Istakhr", ur: "استخارہ کا زبردستی لینا", tr: "İstikhr zorla ele geçirildi.", id: "Istakhr ditaklukkan dengan kekerasan." }
summary:
  ar: "سار عبد الله بن عامر إلى أصطخر سنة ٢٨ فصالحه ماهك عن أهلها ثم خرج يريد جور فلما فارقها نكثوا وقتلوا عامله عليهم فلما فتح جور كر عليهم ففتحها عنوة بعد قتال شديد ورمى بالمجانيق وقتل بها من الأعاجم أربعين ألفاً وأفنى أكثر أهل البيوتات ووجوه الأساورة وكانوا قد لجأوا إليها وقيل بلغ من قتل فيها نحو مائة ألف وكان على مقدمة ابن عامر عبيد الله بن معتر التيمي فاستقبله أهل أصطخر ببرامجرد فقاتلهم فقتلوه فدفن في بستان برامجرد فأقبل ابن عامر مسرعاً وعلى ميمنته أبو برزة نضلة بن عبيد الله الأسلمي وعلى ميسرته معقل بن يسار المزني وعلى الخيل عمران بن الحصين الخزاعي وعلى الرجال خالد بن المعمر الذهلي فهزمهم حتى أدخلهم أصطخر وروى أن أهل أصطخر غدروا في ولاية عبد الله بن عباس العراق لعلي ففتحها."
  en: "Ibn Amir marched on Istakhr in 28h — Mahak truced for its folk, he left for Jur, and they broke and killed his agent; Jur fallen, he returned and took Istakhr by storm after heavy fighting and mangonels — forty thousand Ajam killed, most house-holders and asawira chiefs who had sheltered there destroyed, some say near a hundred thousand. On his vanguard Ubaydallah ibn Ma'tar al-Taymi had met them at Bramjard and fallen, buried in Bramjard's garden; Ibn Amir hurried — Abu Barza al-Aslami right, Ma'qil ibn Yasar left, Imran ibn al-Husayn horse, Khalid ibn al-Mu'ammar foot — and drove them inside. In another telling they betrayed under Ibn Abbas's Iraq governorship for Ali and were reconquered."
  es: "Ibn Amir marchó sobre Istakhr en el año 28. Mahak pactó una tregua con su gente, partió hacia Jur, donde lo derrotaron y mataron a su agente. Tras la caída de Jur, regresó y tomó Istakhr por asalto después de intensos combates y ataques con mangoneles. Cuarenta mil Ajam murieron, y la mayoría de los jefes de las casas y de las asawiras que se habían refugiado allí fueron destruidos; algunos dicen que cerca de cien mil. En su vanguardia, Ubaydallah ibn Ma'tar al-Taymi los había recibido en Bramjard y había caído, siendo enterrado en el jardín de Bramjard. Ibn Amir se apresuró —Abu Barza al-Aslami a la derecha, Ma'qil ibn Yasar a la izquierda, Imran ibn al-Husayn a caballo y Khalid ibn al-Mu'ammar a pie— y los hizo retroceder. Según otra versión, traicionaron a Ali durante el gobierno de Irak de Ibn Abbas y fueron reconquistados."
  fr: "Ibn Amir marcha sur Istakhr en 28 heures. Mahak ayant conclu une trêve pour ses habitants, il partit pour Jur, mais les troupes rompirent les rangs et tuèrent son agent. Jur tomba, et il revint et prit Istakhr d'assaut après de violents combats et l'utilisation de mangonneaux. Quarante mille Ajam furent tués, la plupart des chefs de famille et des chefs asawira qui s'y étaient réfugiés furent anéantis, certains parlent de près de cent mille morts. À son avant-garde, Ubaydallah ibn Ma'tar al-Taymi les avait rencontrés à Bramjard et était tombé, enterré dans le jardin de Bramjard. Ibn Amir se hâta – Abu Barza al-Aslami à droite, Ma'qil ibn Yasar à gauche, Imran ibn al-Husayn à cheval, Khalid ibn al-Mu'ammar à pied – et les repoussa à l'intérieur de la ville. Selon une autre version, ils trahirent sous le gouvernement d'Ibn Abbas en Irak pour Ali et furent reconquis."
  ur: "ابن عامر نے 28 ہجری میں استخار پر کوچ کیا - مہک نے اپنے لوگوں کے لیے جنگ کی، وہ جور کی طرف روانہ ہوا، اور انہوں نے اس کے ایجنٹ کو توڑا اور مار ڈالا۔ جور گرا، وہ واپس آیا اور زبردست لڑائی اور منگولوں کے بعد طوفان کے ذریعے استخارہ لے لیا - چالیس ہزار عجم مارے گئے، زیادہ تر گھر والے اور اساویرہ کے سردار جنہوں نے وہاں پناہ لی تھی تباہ ہو گئے، بعض کا کہنا ہے کہ ایک لاکھ کے قریب۔ عبیداللہ ابن معطر التیمی ان کے نگہبان پر ان سے برامجرد میں ملے تھے اور گر کر برامجرد کے باغ میں دفن ہوئے تھے۔ ابن عامر نے جلدی کی — ابو برزہ اسلمی دائیں، معقل بن یسار بائیں، عمران بن الحسین گھوڑا، خالد بن المعمر پیاد — اور انہیں اندر لے گیا۔ ایک اور بیان میں انہوں نے ابن عباس کی عراقی گورنری کے تحت علی کے لیے دھوکہ دیا اور دوبارہ فتح کر لیے گئے۔"
  tr: "Abdullah bin Amer, MS 28 yılında İstakhr'a yürüdü ve Mahak halkı adına onunla barıştı. Sonra Jur'a gitmek üzere yola çıktı. Oradan ayrıldığında, halk verdiği sözü tutmadı ve valisini öldürdü. Jur'u fethettiğinde, onlara saldırdı ve şiddetli bir savaşın ardından şehri zorla ele geçirdi. Oradaki kırk bin gayrimüslimi mancınıklarla öldürdü ve oraya sığınmış olan Asavire ailelerinin ve liderlerinin çoğunu yok etti. Orada öldürülenlerin sayısının yüz bine yakın olduğu söylenir. İbn Amer'in öncüsü Ubaidullah bin Mu'tar el-Taymi idi. İstakhr halkı onu Barajard'da karşıladı, bu yüzden onlarla savaştı ve onu öldürdüler, bu yüzden Barajard bahçesine gömüldü. İbn Amer hızla geldi; sağında Ebu Berza Nadla bin Ubeydullah el-Aslami, solunda Ma'kal bin Yasar el-Muzani, süvarilerde İmran bin el-Hüseyn el-Huzai ve askerlerde Halid bin el-Mu'ammer el-Dhahli vardı. Onları İstakhr'a kadar yendi. Rivayet edildiğine göre, İstakhr halkı Irak valiliğinde Abdullah bin Abbas'a ihanet ederek Ali'nin tarafına geçti ve Ali de Irak'ı fethetti."
  id: "Abdullah bin Amer berbaris ke Istakhr pada tahun 28, dan Mahak berdamai dengannya atas nama penduduknya. Kemudian ia pergi dengan maksud menuju Jur. Ketika ia meninggalkan Jur, mereka mengingkari janji dan membunuh gubernurnya. Ketika ia menaklukkan Jur, ia menyerang mereka dan menaklukkannya dengan paksa setelah pertempuran sengit. Ia melemparkan ketapel dan membunuh empat puluh ribu orang non-Arab di sana, dan ia memusnahkan sebagian besar penduduk keluarga dan pemimpin Asawira yang telah berlindung di sana. Dikatakan bahwa jumlah orang yang terbunuh di sana mencapai sekitar seratus ribu. Pelopor Ibn Amer adalah Ubaidullah bin Mu’tar al-Taymi. Penduduk Istakhr bertemu dengannya di Barajard, sehingga ia melawan mereka dan mereka membunuhnya, lalu ia dimakamkan di taman Barajard. Kemudian Ibnu Amer datang dengan cepat, dan di sebelah kanannya ada Abu Barza Nadla bin Ubaidullah al-Aslami, dan di sebelah kirinya ada Ma’qal bin Yasar al-Muzani, dan di pasukan berkuda ada Imran bin al-Husayn al-Khuza’i, dan di pasukan darat ada Khalid bin al-Mu’ammar al-Dhahli. Dia mengalahkan mereka hingga membawa mereka ke Istakhr. Diriwayatkan bahwa penduduk Istakhr mengkhianati Abdullah bin Abbas dalam pemerintahan Irak untuk Ali, sehingga dia menaklukkannya."
