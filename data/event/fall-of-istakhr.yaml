id: event/fall-of-istakhr
class: event
kind: conquest
label: { ar: "فتح أصطخر عنوة", en: "The Forced Taking of Istakhr", es: "La toma forzosa de Istakhr", fr: "La prise forcée d'Istakhr" }
summary:
  ar: "سار عبد الله بن عامر إلى أصطخر سنة ٢٨ فصالحه ماهك عن أهلها ثم خرج يريد جور فلما فارقها نكثوا وقتلوا عامله عليهم فلما فتح جور كر عليهم ففتحها عنوة بعد قتال شديد ورمى بالمجانيق وقتل بها من الأعاجم أربعين ألفاً وأفنى أكثر أهل البيوتات ووجوه الأساورة وكانوا قد لجأوا إليها وقيل بلغ من قتل فيها نحو مائة ألف وكان على مقدمة ابن عامر عبيد الله بن معتر التيمي فاستقبله أهل أصطخر ببرامجرد فقاتلهم فقتلوه فدفن في بستان برامجرد فأقبل ابن عامر مسرعاً وعلى ميمنته أبو برزة نضلة بن عبيد الله الأسلمي وعلى ميسرته معقل بن يسار المزني وعلى الخيل عمران بن الحصين الخزاعي وعلى الرجال خالد بن المعمر الذهلي فهزمهم حتى أدخلهم أصطخر وروى أن أهل أصطخر غدروا في ولاية عبد الله بن عباس العراق لعلي ففتحها."
  en: "Ibn Amir marched on Istakhr in 28h — Mahak truced for its folk, he left for Jur, and they broke and killed his agent; Jur fallen, he returned and took Istakhr by storm after heavy fighting and mangonels — forty thousand Ajam killed, most house-holders and asawira chiefs who had sheltered there destroyed, some say near a hundred thousand. On his vanguard Ubaydallah ibn Ma'tar al-Taymi had met them at Bramjard and fallen, buried in Bramjard's garden; Ibn Amir hurried — Abu Barza al-Aslami right, Ma'qil ibn Yasar left, Imran ibn al-Husayn horse, Khalid ibn al-Mu'ammar foot — and drove them inside. In another telling they betrayed under Ibn Abbas's Iraq governorship for Ali and were reconquered."
  es: "Ibn Amir marchó sobre Istakhr en el año 28. Mahak pactó una tregua con su gente, partió hacia Jur, donde lo derrotaron y mataron a su agente. Tras la caída de Jur, regresó y tomó Istakhr por asalto después de intensos combates y ataques con mangoneles. Cuarenta mil Ajam murieron, y la mayoría de los jefes de las casas y de las asawiras que se habían refugiado allí fueron destruidos; algunos dicen que cerca de cien mil. En su vanguardia, Ubaydallah ibn Ma'tar al-Taymi los había recibido en Bramjard y había caído, siendo enterrado en el jardín de Bramjard. Ibn Amir se apresuró —Abu Barza al-Aslami a la derecha, Ma'qil ibn Yasar a la izquierda, Imran ibn al-Husayn a caballo y Khalid ibn al-Mu'ammar a pie— y los hizo retroceder. Según otra versión, traicionaron a Ali durante el gobierno de Irak de Ibn Abbas y fueron reconquistados."
  fr: "Ibn Amir marcha sur Istakhr en 28 heures. Mahak ayant conclu une trêve pour ses habitants, il partit pour Jur, mais les troupes rompirent les rangs et tuèrent son agent. Jur tomba, et il revint et prit Istakhr d'assaut après de violents combats et l'utilisation de mangonneaux. Quarante mille Ajam furent tués, la plupart des chefs de famille et des chefs asawira qui s'y étaient réfugiés furent anéantis, certains parlent de près de cent mille morts. À son avant-garde, Ubaydallah ibn Ma'tar al-Taymi les avait rencontrés à Bramjard et était tombé, enterré dans le jardin de Bramjard. Ibn Amir se hâta – Abu Barza al-Aslami à droite, Ma'qil ibn Yasar à gauche, Imran ibn al-Husayn à cheval, Khalid ibn al-Mu'ammar à pied – et les repoussa à l'intérieur de la ville. Selon une autre version, ils trahirent sous le gouvernement d'Ibn Abbas en Irak pour Ali et furent reconquis."
