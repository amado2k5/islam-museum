id: event/banu-kulayb-ask-al-hadi-for-safety-and-the-akili-crops-are-cut-287
class: event
kind: other
label:
  ar: "بنو كليب يطلبون الأمان من الهادي وقلع ذرة الأكيليين، 287هـ"
  en: "Banu Kulayb ask al-Hadi for safety and the Akili crops are cut, 287 AH"
  ur: "بنو کلیب کی ہادی سے امان کی درخواست اور اکیلیوں کی مکئی کی کٹائی، 287ھ"
summary:
  ar: "يقيم الهادي بصعدة يوم الاثنين ثم يغدو الثلاثاء إلى البقعة ويأمر بقلع ذرة الأكيليين، ثم يمضي إلى علاف فيجد جماعة من الكليبيين يرأسهم الزبير بن محمد يستأمنونه فيؤمنهم على إخراج الأكيليين من جبل العدنة ويؤمّن أبناء عمومتهم ثم يعود إلى صعدة."
  en: "Al-Hadi stays at Sa'da on the Monday, goes out to al-Buqa on the Tuesday and orders the Akilis' sorghum pulled up, then marches to Allaf where a party of Kulaybis under al-Zubayr ibn Muhammad ask his protection; he grants safety on condition they remove the Akilis from the mountain of al-Adana, extends it to their cousins and returns to Sa'da."
  ur: "ہادی پیر کو صعدہ میں رہتے ہیں، منگل کو البقعہ جاتے ہیں اور اکیلیوں کی جوار اکھاڑنے کا حکم دیتے ہیں، پھر علاف کی طرف بڑھتے ہیں جہاں زبیر بن محمد کی سربراہی میں کلیبیوں کی ایک جماعت امان مانگتی ہے؛ وہ اس شرط پر امان دیتے ہیں کہ اکیلیوں کو العدنہ پہاڑ سے نکالیں، ان کے چچازادوں کو بھی امان دیتے ہیں اور صعدہ لوٹ جاتے ہیں۔"
