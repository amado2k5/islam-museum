label: { ar: "عمارة طريق مكة وإصلاح المنابر", en: "Works on the Mecca road and reform of the minbars", es: "Obras en la carretera a La Meca y reforma de los minbares.", fr: "Travaux sur la route de La Mecque et réforme des minbars", ur: "مکہ روڈ پر کام اور منبروں کی اصلاح", tr: "Mekke yolunun mimarisi ve minberlerin restorasyonu", id: "Arsitektur jalan Mekah dan restorasi mimbar-mimbar" }
summary:
  ar: "في سنة إحدى وستين ومئة أمر المهدي بعمارة طريق مكة وبنى بها قصوراً وعمل البرك، وأمر بترك المقاصير التي في جوامع الإسلام وقصر المنابر وصيرها على مقدار منبر رسول الله، وفي سنة ستين حج فأنهى إليه حجبة الكعبة أنهم يخافون هدمها لكثرة ما عليها من الأستار فأمر بها فجردت واقتصر على كسوته وحمل إليه الثلج إلى مكة وقال الذهبي لم يتهيأ ذلك لملك قط {cite:tarikh-khulafa-minhaj-1434 p. 442}."
  en: "In year 161 al-Mahdi ordered the hajj road to Mecca made good, building palaces and constructing pools along it; he ordered the maqasir in the mosques of Islam removed and the minbars shortened to the measure of the Prophet's minbar. In year 160 he performed hajj: the Ka'ba's custodians warned that the weight of hangings threatened to bring it down, so he had them stripped and limited it to his own kiswa — and snow was carried to him at Mecca, a thing, al-Dhahabi says, granted to no king before {cite:tarikh-khulafa-minhaj-1434 p. 442}."
  es: "En el año 161, al-Mahdi ordenó mejorar el camino del Hajj a La Meca, construyendo palacios y estanques a lo largo del mismo; ordenó eliminar los maqasir de las mezquitas del Islam y acortar los minbares a la medida del minbar del Profeta. En el año 160 realizó el Hajj: los custodios de la Kaaba advirtieron que el peso de las cortinas amenazaba con derrumbarla, por lo que las hizo despojar de ellas y las limitó a su propia kiswa; y le trajeron nieve a La Meca, algo que, según al-Dhahabi, no se le había concedido a ningún rey antes {cite:tarikh-khulafa-minhaj-1434 p. 442}."
  fr: "En l'an 161, al-Mahdi ordonna l'amélioration de la route du pèlerinage à La Mecque, faisant construire des palais et des bassins le long de celle-ci. Il ordonna également la suppression des maqasir dans les mosquées et le raccourcissement des minbars à la hauteur de celui du Prophète. En l'an 160, il accomplit le hajj. Les gardiens de la Kaaba l'avertirent que le poids des tentures menaçait de la faire s'effondrer; il les fit donc retirer et ne conserva que sa propre kiswa. De la neige lui fut apportée à La Mecque, un privilège, selon al-Dhahabi, jamais accordé à un roi auparavant (cite: tarikh-khulafa-minhaj-1434 p. 442)."
  ur: "سنہ 161 میں المہدی نے مکہ جانے والی حج سڑک کو عمدہ بنانے، محلات بنانے اور اس کے ساتھ تالاب بنانے کا حکم دیا۔ اس نے حکم دیا کہ اسلام کی مساجد میں مقصر کو ہٹا دیا جائے اور منبروں کو نبی کے منبر کے پیمانے پر چھوٹا کر دیا جائے۔ سنہ 160 میں اس نے حج کیا: کعبہ کے متولیوں نے خبردار کیا کہ پھانسی کے وزن سے اسے نیچے لانے کا خطرہ ہے، اس لیے اس نے انہیں اتار کر اپنے کسوا تک محدود کر دیا - اور مکہ میں اس کے پاس برف لے جایا گیا، الذہبی کہتے ہیں کہ اس سے پہلے کسی بادشاہ کو یہ اجازت نہیں دی گئی تھی۔ 442}۔"
  tr: "161 yılında El-Mehdi, Mekke'ye giden yolun yapımını emretti ve orada saraylar ve havuzlar yaptırdı. İslam camilerindeki surların kaldırılmasını ve minberlerin kısaltılarak Allah Resulü'nün minberinin boyutuna getirilmesini emretti. 160 yılında Hac ibadetini yerine getirdi ve Kâbe'nin bekçileri, üzerindeki çok sayıda perde nedeniyle yıkılmasından korktuklarını bildirdiler. Bunun üzerine perdelerin kaldırılmasını emretti ve sadece kendisi örtüyle yetindi ve Mekke'ye kar getirdi. El-Dhahabi, bunun hiçbir kral için mümkün olmadığını söyledi. {kaynak:tarikh-khulafa-minhaj-1434 s. 442}"
  id: "Pada tahun 161, Al-Mahdi memerintahkan pembangunan jalan menuju Mekah dan membangun istana serta kolam di sana. Ia memerintahkan penghapusan penutup di masjid-masjid Islam dan pemendekan mimbar, menjadikannya seukuran mimbar Rasulullah. Pada tahun 160, ia melaksanakan ibadah haji, dan para penjaga Ka'bah memberitahunya bahwa mereka khawatir Ka'bah akan dihancurkan karena banyaknya tirai di atasnya. Maka ia memerintahkan agar tirai-tirai itu dilepas dan ia hanya menggunakan penutupnya saja, dan ia membawa salju ke Mekah. Al-Dhahabi mengatakan bahwa hal ini tidak mungkin dilakukan oleh raja mana pun. {cite:tarikh-khulafa-minhaj-1434 p. 442}."
