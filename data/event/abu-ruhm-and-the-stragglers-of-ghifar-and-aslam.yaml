id: event/abu-ruhm-and-the-stragglers-of-ghifar-and-aslam
class: event
kind: other
label: { ar: "حديث أبي رهم عن المتخلفين من غفار وأسلم", en: "Abu Ruhm and the stragglers of Ghifar and Aslam", fr: "Abu Ruhm et les retardataires des Ghifar et des Aslam", es: "Abu Ruhm y los rezagados de Ghifar y Aslam", ur: "ابورحم اور غفار اور اسلم کے لڑکھڑانے والے", tr: "Ebu Rahm'ın Ghifar ve Aslam'dan geride kalanlar hakkındaki rivayeti.", id: "Riwayat Abu Rahm tentang orang-orang yang tertinggal dari Ghifar dan Aslam." }
summary:
  ar: "روى ابن إسحاق عن الزهري عن ابن أكيمة الليثي عن ابن أخي أبي رهم الغفاري أن أبا رهم كلثوم بن الحصين، وكان ممن بايعوا تحت الشجرة، غزا تبوك وسار ليلة قريباً من النبي بالأخضر فزاحمت راحلته راحلة النبي، فسأله النبي عمن تخلف من بني غفار، ثم عن رهط من أسلم حلفائهم، وقال إن أعز أهله عليه ألا يتخلف عنه المهاجرون من قريش والأنصار وغفار وأسلم."
  en: "Ibn Ishaq relates from al-Zuhri, from Ibn Ukayma al-Laythi, from the nephew of Abu Ruhm al-Ghifari that Abu Ruhm Kulthum ibn al-Husayn — one of those who pledged under the tree — campaigned to Tabuk. Riding near the Prophet at al-Akhdar his mount jostled the Prophet's, and the Prophet asked him about the Ghifar men who had stayed behind, then about a party of their Aslam allies, and said that the dearest of his people to him were those who did not stay behind: the Muhajirun of Quraysh, the Ansar, Ghifar and Aslam."
  fr: "Ibn Ishaq rapporte d’al-Zuhri, d’après Ibn Ukayma al-Laythi, d’après le neveu d’Abu Ruhm al-Ghifari, qu’Abu Ruhm Kulthum ibn al-Husayn, de ceux qui prêtèrent serment sous l’arbre, participa à l’expédition de Tabuk. Chevauchant près du Prophète à al-Akhdar, sa monture heurta celle du Prophète, qui l’interrogea sur les Ghifar restés en arrière, puis sur un groupe de leurs alliés Aslam, et dit que les plus chers des siens étaient ceux qui n’étaient pas restés : les Muhajirun de Quraysh, les Ansar, les Ghifar et les Aslam."
  es: "Ibn Ishaq relata de al-Zuhri, de Ibn Ukayma al-Laythi, del sobrino de Abu Ruhm al-Ghifari que Abu Ruhm Kulthum ibn al-Husayn —uno de los que juraron lealtad bajo el árbol— hizo campaña hacia Tabuk. Cabalgando cerca del Profeta en al-Akhdar, su montura empujó a la del Profeta, y el Profeta le preguntó por los hombres de Ghifar que se habían quedado atrás, luego por un grupo de sus aliados Aslam, y dijo que los más queridos de su gente para él eran los que no se habían quedado atrás: los Muhajirun de Quraysh, los Ansar, Ghifar y Aslam."
  ur: "ابن اسحاق نے الزہری سے، ابن عکیمہ لیثی سے، وہ ابو روح غفاری کے بھتیجے سے نقل کرتے ہیں کہ ابو روح کلثوم بن الحسین جو کہ درخت کے نیچے بیعت کرنے والوں میں سے ایک تھا، نے تبوک کی طرف مہم چلائی۔ اخدر کے مقام پر نبی کے پاس سوار ہو کر آپ کو جھٹکا دیا، آپ نے آپ سے پیچھے رہ جانے والے غفار آدمیوں کے بارے میں پوچھا، پھر ان کے اسلم کے ساتھیوں کی ایک جماعت کے بارے میں پوچھا، اور فرمایا کہ آپ کی امت میں سب سے زیادہ عزیز وہ ہیں جو پیچھے نہیں رہے: مہاجرین قریش، انصار، غفار اور اسلم۔"
  tr: "İbn İshak, Zühri'den, o da İbn Akima el-Leyti'den, o da Ebu Rahm el-Gifari'nin yeğeninden rivayet ettiğine göre, ağacın altında biat edenlerden olan Ebu Rahm Kulsum bin el-Hüseyin, Tebük'e baskın düzenledi ve bir gece El-Akhdar'da Peygamber'in yanında yolculuk etti. Bineği Peygamber'in bineğine çarptı. Bunun üzerine Peygamber ona Beni Gifer'den geride kalanları, sonra da Aslam'dan müttefiklerinden bir grubu sordu. O da, kendisine en sevgili olanın Kureyş'ten, Ensar'dan, Gifer'den ve Aslam'dan Muhacirler olduğunu, geride bırakılmamaları gerektiğini söyledi."
  id: "Ibn Ishaq meriwayatkan dari Al-Zuhri, dari Ibn Akima Al-Laythi, dari keponakan Abu Rahm Al-Ghifari, bahwa Abu Rahm Kulthum bin Al-Husayn, yang termasuk di antara mereka yang berbaiat di bawah pohon, menyerbu Tabuk dan melakukan perjalanan pada suatu malam di dekat Nabi di Al-Akhdar, sehingga tunggangannya menyenggol tunggangan Nabi, lalu Nabi bertanya kepadanya tentang orang-orang dari Bani Ghifar yang tertinggal, kemudian tentang sekelompok sekutu mereka dari Aslam, dan dia berkata bahwa yang paling dicintai oleh kaumnya adalah agar kaum Muhajirin dari Quraisy, Ansar, Ghifar, dan Aslam tidak tertinggal."
