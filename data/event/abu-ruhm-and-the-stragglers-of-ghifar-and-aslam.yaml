label: { ar: "حديث أبي رهم عن المتخلفين من غفار وأسلم", en: "Abu Ruhm and the stragglers of Ghifar and Aslam" }
summary:
  ar: "روى ابن إسحاق عن الزهري عن ابن أكيمة الليثي عن ابن أخي أبي رهم الغفاري أن أبا رهم كلثوم بن الحصين، وكان ممن بايعوا تحت الشجرة، غزا تبوك وسار ليلة قريباً من النبي بالأخضر فزاحمت راحلته راحلة النبي، فسأله النبي عمن تخلف من بني غفار، ثم عن رهط من أسلم حلفائهم، وقال إن أعز أهله عليه ألا يتخلف عنه المهاجرون من قريش والأنصار وغفار وأسلم."
  en: "Ibn Ishaq relates from al-Zuhri, from Ibn Ukayma al-Laythi, from the nephew of Abu Ruhm al-Ghifari that Abu Ruhm Kulthum ibn al-Husayn — one of those who pledged under the tree — campaigned to Tabuk. Riding near the Prophet at al-Akhdar his mount jostled the Prophet's, and the Prophet asked him about the Ghifar men who had stayed behind, then about a party of their Aslam allies, and said that the dearest of his people to him were those who did not stay behind: the Muhajirun of Quraysh, the Ansar, Ghifar and Aslam."
