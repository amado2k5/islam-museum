id: event/lahore-iltutmish-capture-613
class: event
kind: conquest
label:
  ar: "أخذ قوات إلتمش للاهور، ٦١٣هـ/١٢١٧م"
  en: "Iltutmish's forces take Lahore, 613/1217"
  ur: "التتمش کی فوجوں کا لہور پر قبضہ، 613ھ/1217ء"
  es: "Las fuerzas de Iltutmish toman Lahore, 613/1217"
  fr: "Les forces d'Iltutmish prennent Lahore, 613/1217"
  tr: "İltumş'un kuvvetleri Lahor'u ele geçirdi, Hicri 613/Miladi 1217."
  id: "Pasukan Iltumsh merebut Lahore, 613 H/1217 M"
summary:
  ar: "وصف حسن نظامي في «تاج المآثر» بالتفصيل أخذ قوات شمس الدين إلتمش للاهور سنة ٦١٣هـ/١٢١٧م، بعد أن ظلت المدينة موضع نزاع بين قواد الغوريين السابقين قبجة ويلدز وإلتمش منذ مقتل معز الدين محمد بن سام سنة ٦٠٢هـ/١٢٠٦م {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "Hasan Nizami describes at length in the Taj al-ma'athir the capture of Lahore by Shams al-Din Iltutmish's forces in 613/1217, after the city had been disputed among the former Ghurid officers Qubacha, Yildiz and Iltutmish since the murder of Mu'izz al-Din Muhammad b. Sam in 602/1206 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "حسن نظامی نے «تاج المآثر» میں 613ھ/1217ء میں شمس الدین التتمش کی فوجوں کے لہور پر قبضے کا تفصیلی ذکر کیا ہے؛ 602ھ/1206ء میں معز الدین محمد بن سام کے قتل کے بعد سے یہ شہر سابق غوری سرداروں قباچہ، یلدز اور التتمش کے درمیان متنازع رہا تھا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  es: "Hasan Nizami describe extensamente en el Taj al-ma'athir la captura de Lahore por las fuerzas de Shams al-Din Iltutmish en 613/1217, después de que la ciudad hubiera sido disputada entre los antiguos oficiales gúridas Qubacha, Yildiz e Iltutmish desde el asesinato de Mu'izz al-Din Muhammad b. Sam en 602/1206 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  fr: "Hasan Nizami décrit en détail dans le Taj al-ma'athir la prise de Lahore par les forces de Shams al-Din Iltutmish en 613/1217, après que la ville ait été disputée entre les anciens officiers ghurides Qubacha, Yildiz et Iltutmish depuis le meurtre de Mu'izz al-Din Muhammad b. Sam en 602/1206 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  tr: "Hasan Nizami, “Taj al-Ma’athir” adlı eserinde, 613 Hicri/1217 Miladi yılında Şemseddin İltutmiş'in güçlerinin Lahor'u ele geçirmesini ayrıntılı olarak anlatmıştır. Şehir, 602 Hicri/1206 Miladi yılında Mu'izz al-Din Muhammed ibn Sam'ın öldürülmesinden bu yana, önceki Gürid komutanları Kabja Yıldız ve İltutmiş arasında bir çekişme noktası olarak kalmıştı. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}"
  id: "Hasan Nizami menjelaskan secara rinci dalam “Taj al-Ma’athir” penaklukan Lahore oleh pasukan Shams al-Din Iltutmish pada tahun 613 H/1217 M, setelah kota itu menjadi titik perselisihan antara komandan Ghurid sebelumnya, Qabja Yildiz dan Iltutmish, sejak pembunuhan Mu’izz al-Din Muhammad ibn Sam pada tahun 602 H/1206 M {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
