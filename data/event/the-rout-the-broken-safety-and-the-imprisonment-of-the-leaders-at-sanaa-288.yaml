id: event/the-rout-the-broken-safety-and-the-imprisonment-of-the-leaders-at-sanaa-288
class: event
label:
  ar: "هزيمة الخصوم بصنعاء ونقض أمانهم وحبس كبارهم، محرم 288هـ"
  en: "The rout of the opponents at Sana'a, the broken safety and the imprisonment of their leaders, Muharram 288 AH"
  ur: "صنعاء میں مخالفین کی شکست، امان کا ٹوٹنا اور ان کے بڑوں کی قید، محرم 288ھ"
summary:
  ar: "ينهزم القوم حتى يخرجوا من صنعاء ويخرج الهادي في آثارهم ثم يعود بسؤال أبي العتاهية، ويسأل الجفاتم الأمان فيمنحهم أبو العتاهية بإذن الهادي، ثم يبلغ الهادي منهم كلام قبيح وينتقض الأمان ويجمعون على حربه، فيستدعي كبارهم ورؤساءهم فيحبسهم في الحديد ويوزع سلاحهم ودوابهم على الطبريين، ويقول الراوي إن الفتنة انقطعت."
  en: "The opponents are routed and leave Sana'a, al-Hadi follows them and returns at Abu al-Atahiya's request; the Jafatim ask Abu al-Atahiya for safety, which he gives with al-Hadi's leave, but ugly words from them reach al-Hadi, the safety is broken and they agree to fight him; he sends for their leaders and chief men, has them put in prison and irons, and shares their weapons and mounts among the Tabaris, and the narrator says the sedition was ended."
  ur: "مخالفین شکست کھا کر صنعاء سے نکل جاتے ہیں، ہادی ان کے پیچھے جاتے ہیں اور ابو العتاہیہ کے کہنے پر لوٹتے ہیں؛ جفاتم ابو العتاہیہ سے امان مانگتے ہیں جو وہ ہادی کی اجازت سے دیتے ہیں، پھر ان کی طرف سے بری باتیں ہادی تک پہنچتی ہیں، امان ٹوٹ جاتی ہے اور وہ جنگ پر اتفاق کر لیتے ہیں؛ ہادی ان کے بڑوں اور سرداروں کو بلا کر قید اور بیڑیوں میں ڈال دیتے ہیں اور ان کے ہتھیار اور سواریاں طبریوں میں بانٹ دیتے ہیں، اور راوی کہتا ہے کہ فتنہ ختم ہو گیا۔"
