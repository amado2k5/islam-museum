label: { ar: "وقعة باب شيراز ٢٩٧هـ", en: "The battle at the gate of Shiraz, 297", fr: "La bataille à la porte de Chiraz, 297", es: "La batalla en la puerta de Shiraz, 297", ur: "شیراز کے دروازے پر جنگ، 297", tr: "Bab Şiraz Muharebesi, Hicri 297", id: "Pertempuran Bab Shiraz, 297 H" }
summary:
  ar: "لما عاد مؤنس عن سبكري استولى كاتبُه عبد الرحمن بن جعفر على الأمور فأوعز أصحاب سبكري إلى العصيان، فعلم ابن الفرات وزير المقتدر أن مؤنساً يميل إلى سبكري فانفكّ وصيفَ كاتبه وجماعة من القواد ومحمد بن جعفر الفاريابي وعوّل عليه في فتح فارس. فسار محمد بن جعفر إلى فارس وواقع سبكري على باب شيراز فانهزم سبكري إلى المدينة وتحصّن بها، فتبعه محمد بن جعفر وحصره بها، فخرج إليه سبكري وحاربه مرة ثانية فهزمه ونهب ماله، ودخل سبكري مفازة خراسان فظفر به صاحب خراسان، واستولى محمد بن جعفر على فارس {cite:kamil-ibn-al-athir p. 45-46}."
  en: "When Mu'nis returned without Subkari, his secretary Abd al-Rahman ibn Ja'far took charge and Subkari's men pushed him to rebellion. The vizier Ibn al-Furat, seeing Mu'nis lean toward Subkari, detached his secretary, a body of commanders and Muhammad ibn Ja'far al-Faryabi, and charged him with the conquest of Fars. Muhammad ibn Ja'far marched to Fars and met Subkari at the gate of Shiraz; Subkari broke for the city and fortified himself inside it, so al-Faryabi pursued and besieged him. Subkari sallied out and fought a second battle, was defeated and his baggage plundered; he entered the Khurasan desert road where the lord of Khurasan caught him, while Muhammad ibn Ja'far took possession of Fars {cite:kamil-ibn-al-athir p. 45-46}."
  fr: "Quand Mu'nis revint sans Subkari, le secrétaire de celui-ci, Abd al-Rahman ibn Ja'far, prit les affaires en main, et les hommes de Subkari le poussèrent à la rébellion. Le vizir Ibn al-Furat, voyant Mu'nis pencher vers Subkari, détacha son secrétaire, un groupe de commandants et Muhammad ibn Ja'far al-Faryabi, et le chargea de la conquête du Fars. Muhammad ibn Ja'far marcha sur le Fars et rencontra Subkari à la porte de Chiraz ; Subkari se replia sur la ville et s'y fortifia, si bien qu'al-Faryabi le poursuivit et l'assiégea. Subkari fit une sortie et livra une seconde bataille, fut vaincu et ses bagages pillés ; il prit la route du désert du Khorassan, où le seigneur du Khorassan le captura, tandis que Muhammad ibn Ja'far prenait possession du Fars {cite:kamil-ibn-al-athir p. 45-46}."
  es: "Cuando Mu'nis regresó sin Subkari, su secretario Abd al-Rahman ibn Ja'far tomó el mando y los hombres de Subkari lo incitaron a la rebelión. El visir Ibn al-Furat, al ver que Mu'nis se inclinaba hacia Subkari, separó a su secretario, un cuerpo de comandantes y a Muhammad ibn Ja'far al-Faryabi, y le encomendó la conquista de Fars. Muhammad ibn Ja'far marchó hacia Fars y se encontró con Subkari en la puerta de Shiraz; Subkari huyó hacia la ciudad y se fortificó en su interior, por lo que al-Faryabi lo persiguió y lo sitió. Subkari salió y libró una segunda batalla, fue derrotado y su equipaje saqueado; entró en el camino del desierto de Jorasán, donde el señor de Jorasán lo capturó, mientras que Muhammad ibn Ja'far tomó posesión de Fars {cite:kamil-ibn-al-athir p. 45-46}."
  ur: "جب معنیس سبکاری کے بغیر واپس آیا تو اس کے سکریٹری عبدالرحمٰن ابن جعفر نے چارج سنبھال لیا اور سبکاری کے آدمیوں نے اسے بغاوت کی طرف دھکیل دیا۔ وزیر ابن الفرات نے معنیس کو سبکاری کی طرف جھکاؤ دیکھ کر اپنے سیکرٹری، کمانڈروں کی ایک جماعت اور محمد بن جعفر الفریابی کو الگ کر دیا اور اس پر فارس کی فتح کا الزام لگایا۔ محمد بن جعفر نے فارس کی طرف کوچ کیا اور شیراز کے دروازے پر سبکاری سے ملاقات کی۔ سبکاری نے شہر کے لیے توڑ پھوڑ کی اور اس کے اندر اپنے آپ کو مضبوط کر لیا، چنانچہ الفریابی نے اس کا تعاقب کیا اور محاصرہ کیا۔ سبکاری باہر نکلا اور دوسری جنگ لڑی، اسے شکست ہوئی اور اس کا سامان لوٹ لیا گیا۔ وہ خراسان کے صحرائی راستے میں داخل ہوا جہاں خراسان کے بادشاہ نے اسے پکڑ لیا، جب کہ محمد ابن جعفر نے فارس پر قبضہ کر لیا۔ 45-46}۔"
  tr: "Mu'nis, Subkari'den döndüğünde, kâtibi Abdülrahman ibn Cafer, işlerin kontrolünü ele geçirdi ve Subkari'nin takipçilerini isyana kışkırttı. Muktadir'in veziri İbn el-Furat, Mu'nis'in Subkari'ye meyilli olduğunu öğrenince, kâtibinin yardımcısını, bir grup komutanı ve Muhammed ibn Cafer el-Faryabi'yi görevden alarak Fars'ı fethetme işini ona bıraktı. Muhammed ibn Cafer, Fars'a doğru ilerledi ve Şiraz'ın kapılarında Subkari ile karşılaştı. Subkari şehre kaçtı ve orada kendini tahkim etti. Muhammed ibn Cafer onu takip etti ve kuşattı. Subkari onunla karşılaşmak için dışarı çıktı ve ikinci kez savaştı, ancak Muhammed ibn Cafer onu yendi ve servetini yağmaladı. Subkari daha sonra Horasan çölüne girdi ve orada Horasan hükümdarı tarafından yakalandı. Ardından Muhammed ibn Cafer, Fars'ın kontrolünü ele geçirdi. {alıntı: kamil-ibn-el-esir s. 45-46}"
  id: "Ketika Mu'nis kembali dari Subkari, juru tulisnya, Abd al-Rahman ibn Ja'far, mengambil alih kendali dan menghasut pengikut Subkari untuk memberontak. Ibn al-Furat, wazir al-Muqtadir, mengetahui bahwa Mu'nis condong kepada Subkari, sehingga ia memecat asisten juru tulisnya, sekelompok komandan, dan Muhammad ibn Ja'far al-Faryabi, mengandalkannya untuk menaklukkan Fars. Muhammad ibn Ja'far berbaris ke Fars dan menghadapi Subkari di gerbang Shiraz. Subkari melarikan diri ke kota dan membentengi dirinya di sana. Muhammad ibn Ja'far mengejarnya dan mengepungnya. Subkari keluar untuk menemuinya dan melawannya untuk kedua kalinya, tetapi Muhammad ibn Ja'far mengalahkannya dan menjarah kekayaannya. Subkari kemudian memasuki gurun Khurasan, di mana ia ditangkap oleh penguasa Khurasan. Muhammad ibn Ja'far kemudian mengambil alih kendali Fars. {mengutip: kamil-ibn-al-athir hal. 45-46}"
