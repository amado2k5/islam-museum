id: event/fatima-inheritance-claim-fadak
class: event
kind: other
label: { en: "Fatima's claim to the Prophet's inheritance and Fadak", ar: "مطالبة فاطمة بميراث النبي وفدك" }
summary:
  en: "After the Prophet's death Fatima and al-Abbas asked Abu Bakr for their share of the Prophet's estate, the land of Fadak and his share of Khaybar. Abu Bakr answered with the report that prophets leave no inheritance, and said he would keep the Prophet's practice. Sallabi records the Sunni reply to the Imami claims and reports that Fatima was pleased with Abu Bakr before her death."
  ar: "بعد وفاة النبي طلبت فاطمة والعباس ميراثهما: أرضه في فدك وسهمه من خيبر، فاحتج أبو بكر بحديث لا نورث ما تركنا صدقة، وقال إنه سيعمل بكل ما كان النبي يعمل به. ويعرض الصلابي الرد السني على الروايات الإمامية، وينقل أن فاطمة رضيت عن أبي بكر قبل وفاتها على رواية الشعبي."
