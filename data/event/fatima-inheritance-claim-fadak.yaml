issue: { ar: "هل يُورَث النبي، وهل كان أبو بكر ظالماً في منع فدك؟", en: "Did the Prophet leave an inheritance, and was Abu Bakr wrong to withhold Fadak?" }
perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sallabi, citing Ibn Taymiyya and Ibn Kathir: the hadith that prophets are not inherited is reported by a wide group of Companions, Umar, Uthman, Ali, Talha, al-Zubayr, Sa'd, Abd al-Rahman ibn Awf, al-Abbas, the wives of the Prophet and Abu Hurayra; Ali did not divide the estate when he held power; and Fatima was reconciled with Abu Bakr.", ar: "يعرض الكتاب عن ابن تيمية وابن كثير: حديث أن الأنبياء لا يورثون رواه جماعة من الصحابة منهم عمر وعثمان وعلي وطلحة والزبير وسعد وعبد الرحمن بن عوف والعباس وأزواج النبي وأبو هريرة، ولم يقسم علي التركة في خلافته، ورضيت فاطمة عن أبي بكر." }
    sources: [source/sallabi-ali-vol1]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Imami reports, as cited by the book, say Abu Bakr and Umar seized Fatima's inheritance and Fadak, that the Prophet's heritage was Fatima's alone, and that the Prophet's words on not being inherited were invented; Sallabi refutes these reports on their chains, their logic and their consistency.", ar: "تروي الإمامية، كما ينقل الكتاب، أن أبا بكر وعمر غصبا فاطمة فدكاً، وأن ميراث النبي كان لفاطمة وحدها، وأن حديث عدم الإرث موضوع؛ ويرد الكتاب هذه الروايات سنداً ومنطقاً وتناقضاً." }
    sources: [source/sallabi-ali-vol1]
