label: { ar: "اقتسام مناصب مكة بين بني عبد مناف وبني عبد الدار", en: "The partition of the Meccan offices between Abd Manaf and Abd al-Dar" }
summary:
  ar: "لما هلك عبد مناف نافس أبناؤه بني عمهم عبد الدار في المناصب التي أوصى بها قصي لعبد الدار، وافترقت قريش فرقتين وكاد يكون بينهم قتال، فتداعوا إلى الصلح واقتسموها: السقاية والرفادة لبني عبد مناف، ودار الندوة واللواء والحجابة لبني عبد الدار؛ ثم خرجت قرعة بني عبد مناف لهاشم فوليهما حتى مات، ثم المطلب ثم عبد المطلب ثم بنوه حتى جاء الإسلام والولاية إلى العباس."
  en: "After Abd Manaf's death his sons contested with their cousins of Abd al-Dar the offices Qusayy had bequeathed to Abd al-Dar; Quraysh split in two and nearly fought, then settled: the watering and feeding of pilgrims to Abd Manaf, Dar al-Nadwa, the banner and the custody of the Kaaba to Abd al-Dar; the Abd Manaf lot fell to Hashim, then al-Muttalib, then Abd al-Muttalib and his sons down to al-Abbas at the coming of Islam."
