id: event/partition-of-meccan-offices
class: event
kind: council
label: { ar: "اقتسام مناصب مكة بين بني عبد مناف وبني عبد الدار", en: "The partition of the Meccan offices between Abd Manaf and Abd al-Dar", es: "La división de las oficinas de La Meca entre Abd Manaf y Abd al-Dar", fr: "Le partage des bureaux mecquois entre Abd Manaf et Abd al-Dar", ur: "عبد مناف اور عبد الدار کے درمیان مکہ کے دفاتر کی تقسیم", tr: "Mekke'deki mevzilerin Banu Abd Manaf ve Banu Abd al-Dar arasında paylaşımı", id: "Pembagian posisi di Mekah antara Bani Abd Manaf dan Bani Abd al-Dar" }
summary:
  ar: "لما هلك عبد مناف نافس أبناؤه بني عمهم عبد الدار في المناصب التي أوصى بها قصي لعبد الدار، وافترقت قريش فرقتين وكاد يكون بينهم قتال، فتداعوا إلى الصلح واقتسموها: السقاية والرفادة لبني عبد مناف، ودار الندوة واللواء والحجابة لبني عبد الدار؛ ثم خرجت قرعة بني عبد مناف لهاشم فوليهما حتى مات، ثم المطلب ثم عبد المطلب ثم بنوه حتى جاء الإسلام والولاية إلى العباس."
  en: "After Abd Manaf's death his sons contested with their cousins of Abd al-Dar the offices Qusayy had bequeathed to Abd al-Dar; Quraysh split in two and nearly fought, then settled: the watering and feeding of pilgrims to Abd Manaf, Dar al-Nadwa, the banner and the custody of the Kaaba to Abd al-Dar; the Abd Manaf lot fell to Hashim, then al-Muttalib, then Abd al-Muttalib and his sons down to al-Abbas at the coming of Islam."
  es: "Tras la muerte de Abd Manaf, sus hijos disputaron con sus primos de Abd al-Dar los cargos que Qusayy le había legado a Abd al-Dar; los Quraysh se dividieron en dos y casi se enfrentaron, pero finalmente llegaron a un acuerdo: el suministro de agua y comida a los peregrinos a Abd Manaf, Dar al-Nadwa, el estandarte y la custodia de la Kaaba para Abd al-Dar; la herencia de Abd Manaf pasó a Hashim, luego a al-Muttalib, y después a Abd al-Muttalib y sus hijos hasta llegar a al-Abbas con la llegada del Islam."
  fr: "Après la mort d'Abd Manaf, ses fils se disputèrent avec leurs cousins d'Abd al-Dar les charges que Qusayy avait léguées à Abd al-Dar; les Quraysh se divisèrent en deux et faillirent s'affronter, puis finirent par trouver un accord: l'approvisionnement en eau et en nourriture des pèlerins revint à Abd Manaf, Dar al-Nadwa, l'étendard et la garde de la Kaaba à Abd al-Dar; le lot d'Abd Manaf passa à Hashim, puis à al-Muttalib, puis à Abd al-Muttalib et à ses fils jusqu'à al-Abbas à l'avènement de l'Islam."
  ur: "عبد مناف کی موت کے بعد اس کے بیٹوں نے عبد الدار کے اپنے کزنوں کے ساتھ مقابلہ کیا جو دفاتر قصی نے عبد الدار کو وصیت کی تھی۔ قریش دو حصوں میں بٹ گئے اور تقریباً لڑائی ہوئی، پھر آباد ہو گئے: عبد مناف، دار الندوہ، جھنڈا اور خانہ کعبہ کی حفاظت عبد الدار کو پانی پلانا اور کھانا کھلانا؛ عبد مناف کا قرعہ ہاشم، پھر المطلب، پھر عبد المطلب اور اس کے بیٹوں نے اسلام کے آنے پر عباس کے پاس گرا۔"
  tr: "Abd Manaf öldüğünde, oğulları, Kusay'ın Abd el-Dar'a tavsiye ettiği makamlar için kuzenleri Abd el-Dar ile rekabete girdiler. Kureyş iki gruba ayrıldı ve neredeyse birbirleriyle savaşacaklardı, bu yüzden barış çağrısında bulundular ve makamları paylaştırdılar: Su ve yiyecek temini Abd Manaf'ın oğullarına, Meclis, sancak ve muhafızlık ise Abd el-Dar'ın oğullarına verildi. Daha sonra Abd Manaf'ın oğullarının payı Haşim'e gitti ve o da ölene kadar onların yönetimini üstlendi, ardından el-Muttalib, sonra Abd el-Muttalib, sonra da oğulları, İslam'ın gelişiyle birlikte liderlik el-Abbas'a geçene kadar."
  id: "Ketika Abd Manaf meninggal, putra-putranya bersaing dengan sepupu mereka, Abd al-Dar, untuk memperebutkan posisi yang telah direkomendasikan Qusay kepada Abd al-Dar. Kaum Quraisy terpecah menjadi dua faksi dan hampir berperang satu sama lain, sehingga mereka menyerukan perdamaian dan membaginya: pasokan air dan pasokan makanan untuk putra-putra Abd Manaf, dan Majelis, panji, dan perwalian untuk putra-putra Abd al-Dar. Kemudian bagian putra-putra Abd Manaf jatuh ke tangan Hasyim, sehingga ia memimpin mereka hingga wafat, kemudian al-Muttalib, lalu Abd al-Muttalib, kemudian putra-putranya hingga Islam datang dan kepemimpinan beralih ke al-Abbas."
