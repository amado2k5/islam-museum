label: { en: "The delegation of Banu Hanifa", ar: "وفد بني حنيفة", es: "La delegación de Banu Hanifa", fr: "La délégation de Banu Hanifa", ur: "بنو حنیفہ کا وفد", tr: "Bani Hanifa heyeti", id: "Delegasi Bani Hanifa" }
summary:
  en: "Seventeen men of Banu Hanifa of al-Yamama, among them Musaylima, lodged with an Ansari household in Medina in 9 AH and declared Islam; the sources differ on Musaylima's own conduct, and on his return home he claimed a share in prophethood."
  ar: "قدم وفد بني حنيفة أهل اليمامة فيهم مسيلمة المدينة في سنة الوفود، فنزلوا في دار بنت الحارث امرأة من الأنصار من بني النجار وأسلموا؛ يروي ابن إسحاق روايتين في شأن مسيلمة: أنه جيء به مستوراً بالثياب فقال له النبي: لو سألتني هذا العسيب ما أعطيتكه، أو أنه خُلّف في الرحال فقال النبي: ليس بشركم مكاناً. والمصادر المتأخرة تجعلهم سبعة عشر رجلاً. ثم ادعى مسيلمة النبوة بعد رجوعه."
  es: "Diecisiete hombres de Banu Hanifa de al-Yamama, entre ellos Musaylima, se alojaron en una casa de los Ansari en Medina en el año 9 de la Hégira y se convirtieron al Islam; las fuentes difieren sobre la conducta de Musaylima, y a su regreso a casa reclamó una parte de la profecía."
  fr: "Dix-sept hommes de Banu Hanifa d'al-Yamama, parmi lesquels Musaylima, logèrent chez une famille Ansari à Médine en 9 AH et se convertirent à l'islam; les sources divergent sur la conduite de Musaylima lui-même, et à son retour chez lui, il revendiqua une part de la prophétie."
  ur: "یمامہ کے بنو حنیفہ کے سترہ آدمیوں میں سے مسیلمہ نے 9 ہجری میں مدینہ میں ایک انصاری گھرانے میں قیام کیا اور اسلام کا اعلان کیا۔ مسیلمہ کے اپنے طرز عمل کے بارے میں ذرائع میں اختلاف ہے، اور گھر واپسی پر اس نے نبوت میں حصہ داری کا دعویٰ کیا۔"
  tr: "Beni Hanifa kabilesinden, Yamama halkından, Musaylima'nın da aralarında bulunduğu bir heyet, Heyetler Yılı'nda Medine'ye geldi. Beni Necar kabilesinin Ensar'ından bir kadın olan Bint el-Harith'in evinde kaldılar ve İslam'ı kabul ettiler. İbn İshak, Musaylima hakkında iki rivayet aktarır: Birincisi, örtülü olarak getirildiğinde Peygamber'in ona, \"Benden bu hurma yaprağını isteseydin, sana vermezdim\" dediği; ikincisi ise, eşyalarla birlikte geride bırakıldığında Peygamber'in, \"En kötü yerde değil\" dediğidir. Daha sonraki kaynaklar, aralarında on yedi erkek olduğunu belirtir. Musaylima, dönüşünden sonra peygamberlik iddiasında bulundu."
  id: "Sebuah delegasi dari Bani Hanifa, kaum Yamama, termasuk Musailima, datang ke Madinah pada Tahun Delegasi. Mereka tinggal di rumah Binti al-Harit, seorang wanita dari kaum Ansar Bani Najjar, dan memeluk Islam. Ibnu Ishaq meriwayatkan dua kisah tentang Musailima: bahwa ia dibawa dalam keadaan tertutup pakaian, dan Nabi berkata kepadanya, \"Jika engkau meminta daun kurma ini kepadaku, aku tidak akan memberikannya kepadamu,\" atau bahwa ia ditinggalkan bersama barang-barang miliknya, dan Nabi berkata, \"Dia tidak berada di tempat yang paling buruk.\" Sumber-sumber selanjutnya menyatakan bahwa ada tujuh belas orang di antara mereka. Musailima kemudian mengaku sebagai nabi setelah kembali."
