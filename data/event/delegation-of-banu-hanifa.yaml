label: { en: "The delegation of Banu Hanifa", ar: "وفد بني حنيفة" }
summary:
  en: "Seventeen men of Banu Hanifa of al-Yamama, among them Musaylima, lodged with an Ansari household in Medina in 9 AH and declared Islam; the sources differ on Musaylima's own conduct, and on his return home he claimed a share in prophethood."
  ar: "قدم وفد بني حنيفة أهل اليمامة فيهم مسيلمة المدينة في سنة الوفود، فنزلوا في دار بنت الحارث امرأة من الأنصار من بني النجار وأسلموا؛ يروي ابن إسحاق روايتين في شأن مسيلمة: أنه جيء به مستوراً بالثياب فقال له النبي: لو سألتني هذا العسيب ما أعطيتكه، أو أنه خُلّف في الرحال فقال النبي: ليس بشركم مكاناً. والمصادر المتأخرة تجعلهم سبعة عشر رجلاً. ثم ادعى مسيلمة النبوة بعد رجوعه."
