label: { ar: "عاصفة وبرد الكوفة والبصرة سنة ٢٨٥", en: "Storm and hail at Kufa and Basra, 285", es: "Tormenta y granizo en Kufa y Basora, 285", fr: "Orages et grêle à Koufa et Bassora, 285" }
summary:
  ar: "في ربيع الأول سنة خمس وثمانين ومائتين كتب صاحب البريد من الكوفة أن ريحًا صفراء ارتفعت ثم استحالت سوداء والناس في تضرع، ثم مطرت السماء مطرًا شديدًا برعود وبروق متصلة، ومطرت قرية تُعرف بأحمد آباذ حجارة بيضًا وسودًا؛ وورد من البصرة أن الريح ارتفعت بعد الجمعة صفراء ثم خضراء ثم سوداء مع أمطار لم يُرَ مثلها، ووقع برد وزن البردة الواحدة مائة وخمسون درهمًا، واقتلعت الريح من نهر الحسن خمسمائة نخلة ومن نهر معقل مائة نخلة، وزادت دجلة زيادة مفرطة لم يُرَ مثلها فتهدمت أبنية كثيرة حولها {cite:muntazam-ibn-al-jawzi p. 294-295}."
  en: "In Rabi' I 285 postal dispatches reported a yellow-then-black wind over Kufa with stones raining on Ahmadabadh village, and at Basra a yellow, green, then black storm with hailstones of a hundred and fifty dirhams, five hundred palms uprooted on the Nahr al-Hasan, and a Tigris surge that wrecked riverside buildings {cite:muntazam-ibn-al-jawzi p. 294-295}."
  es: "En Rabi' I 285, despachos postales informaron de un viento amarillo y luego negro sobre Kufa con lluvia de piedras sobre la aldea de Ahmadabadh, y en Basora una tormenta amarilla, verde y luego negra con granizo de ciento cincuenta dirhams, quinientas palmeras arrancadas de raíz en el Nahr al-Hasan y una crecida del Tigris que destrozó edificios ribereños {cite:muntazam-ibn-al-jawzi p. 294-295}."
  fr: "En Rabi' I 285, des dépêches postales ont signalé un vent jaune puis noir sur Kufa avec une pluie de pierres sur le village d'Ahmadabadh, et à Basra une tempête jaune, verte puis noire avec des grêlons de cent cinquante dirhams, cinq cents palmiers déracinés sur le Nahr al-Hasan et une crue du Tigre qui a détruit des bâtiments riverains {cite:muntazam-ibn-al-jawzi p. 294-295}."
