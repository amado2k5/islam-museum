label: { ar: "عاصفة وبرد الكوفة والبصرة سنة ٢٨٥" }
summary:
  ar: "في ربيع الأول سنة خمس وثمانين ومائتين كتب صاحب البريد من الكوفة أن ريحًا صفراء ارتفعت ثم استحالت سوداء والناس في تضرع، ثم مطرت السماء مطرًا شديدًا برعود وبروق متصلة، ومطرت قرية تُعرف بأحمد آباذ حجارة بيضًا وسودًا؛ وورد من البصرة أن الريح ارتفعت بعد الجمعة صفراء ثم خضراء ثم سوداء مع أمطار لم يُرَ مثلها، ووقع برد وزن البردة الواحدة مائة وخمسون درهمًا، واقتلعت الريح من نهر الحسن خمسمائة نخلة ومن نهر معقل مائة نخلة، وزادت دجلة زيادة مفرطة لم يُرَ مثلها فتهدمت أبنية كثيرة حولها {cite:muntazam-ibn-al-jawzi p. 294-295}."
  en: "In Rabi' I 285 postal dispatches reported a yellow-then-black wind over Kufa with stones raining on Ahmadabadh village, and at Basra a yellow, green, then black storm with hailstones of a hundred and fifty dirhams, five hundred palms uprooted on the Nahr al-Hasan, and a Tigris surge that wrecked riverside buildings {cite:muntazam-ibn-al-jawzi p. 294-295}."
