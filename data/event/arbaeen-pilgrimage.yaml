summary:
  ar: أكبر تجمع بشري سنوي في العالم — مسيرة ملايين الزوار، أغلبهم شيعة، مشياً من النجف إلى كربلاء في أربعينية الحسين.
  en: The world's largest annual gathering — millions, mostly Shia, walking Najaf to Karbala for the fortieth day of Husayn's
    death.
  es: "La mayor concentración anual del mundo: millones de personas, en su mayoría chiítas, caminan de Nayaf a Karbala en el cuadragésimo día de la muerte de Husayn."
  fr: "Le plus grand rassemblement annuel au monde — des millions de personnes, principalement des chiites, marchant de Najaf à Karbala pour le quarantième jour suivant la mort de Husayn."
  ur: "دنیا کا سب سے بڑا سالانہ اجتماع - لاکھوں، زیادہ تر شیعہ، حسین کی وفات کے چالیسویں دن کے لیے نجف سے کربلا کی طرف پیدل چل رہے ہیں۔"
  tr: "Dünyanın en büyük yıllık insan buluşması — çoğunluğu Şii olan milyonlarca ziyaretçinin Hüseyin'in Erbain'i için Necef'ten Kerbela'ya yaya olarak yaptığı yürüyüş."
  id: "Pertemuan manusia tahunan terbesar di dunia — pawai jutaan pengunjung, sebagian besar Syiah, berjalan kaki dari Najaf ke Karbala untuk Arbaeen Hussein."
