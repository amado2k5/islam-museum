id: event/uhud-defense-of-the-prophet
class: event
kind: battle
label: { en: "Defense of the Prophet at Uhud", ar: "الدفاع عن رسول الله في أحد", es: "Defensa del Profeta en Uhud", fr: "Défense du Prophète à Uhud", ur: "احد میں دفاعِ رسول" }
summary:
  ar: "بعد حركة الالتفاف لم يكن مع النبي في المؤخرة إلا تسعة نفر. رماه عتبة بن أبي وقاص بالحجارة فوقع لشقه وأُصيبت رباعيته اليمنى السفلى وجُرحت شفته. ضربه عبد الله بن قمئة على وجنته بالسيف فدخلت حلقتان من حلق المغفر في وجنته. وبقي مع النبي في أحرج لحظة طلحة بن عبيد الله وسعد بن أبي وقاص فحَموه. تناضل سعد حتى نُثلت كنانته. قاتل طلحة قتال الأحد عشر حتى قُطعت أصابعه وجُرح خمساً وثلاثين أو تسعاً وثلاثين جرحاً. أزال أبو عبيدة بن الجراح حلقتي المغفر من وجنته بثنيّتيه. سترهُ أبو دجانة بظهره من النبل. دافعت أم عمارة نسيبة بنت كعب حتى أصابها اثنا عشر جرحاً {cite:mubarakpuri-raheeq p.267}."
  en: "After the wheeling manoeuvre only nine men remained with the Prophet at the rear. Utba ibn Abi Waqqas threw stones at him; his lower right incisor was broken and his lip wounded. Abdullah ibn Qami'a struck his cheek with a sword so that two rings of the helmet sank into it. In the hardest moment Talha ibn Ubaydullah and Sa'd ibn Abi Waqqas stood with him and shielded him. Sa'd shot until his quiver was emptied; Talha fought like eleven men until his fingers were cut and he bore thirty-five or thirty-nine wounds. Abu Ubayda ibn al-Jarrah pulled the two helmet rings from his cheek with his front teeth. Abu Dujana shielded him with his back from the arrows. Umm Umara Nusayba bint Ka'b defended him until she took twelve wounds {cite:mubarakpuri-raheeq p.267}."
  es: "Tras la maniobra de giro, solo nueve hombres permanecieron con el Profeta en la retaguardia. Utba ibn Abi Waqqas le arrojó piedras; se le rompió el incisivo inferior derecho y se hirió el labio. Abdullah ibn Qami'a le golpeó la mejilla con una espada, de modo que dos anillos del casco se incrustaron en ella. En el momento más crítico, Talha ibn Ubaydullah y Sa'd ibn Abi Waqqas permanecieron a su lado y lo protegieron. Sa'd disparó hasta vaciar su carcaj; Talha luchó como once hombres hasta que se cortó los dedos y recibió treinta y cinco o treinta y nueve heridas. Abu Ubayda ibn al-Jarrah le arrancó los dos anillos del casco de la mejilla con los dientes. Abu Dujana lo protegió de las flechas con la espalda. Umm Umara Nusayba bint Ka'b lo defendió hasta que recibió doce heridas {cite:mubarakpuri-raheeq p.267}."
  fr: "Après la manœuvre de retournement, seuls neuf hommes restaient avec le Prophète à l'arrière. Utba ibn Abi Waqqas lui lança des pierres; son incisive inférieure droite fut cassée et sa lèvre blessée. Abdullah ibn Qami'a le frappa à la joue d'un coup d'épée, si bien que deux anneaux de son casque s'y enfoncèrent. Au plus fort de la bataille, Talha ibn Ubaydullah et Sa'd ibn Abi Waqqas se tinrent à ses côtés et le protégèrent. Sa'd tira jusqu'à épuisement de son carquois; Talha se battit avec une force herculéenne jusqu'à ce que ses doigts soient coupés et qu'il reçoive trente-cinq ou trente-neuf blessures. Abu Ubayda ibn al-Jarrah retira les deux anneaux de son casque de sa joue avec ses dents de devant. Abu Dujana le protégea des flèches en lui tournant le dos. Umm Umara Nusayba bint Ka'b le défendit jusqu'à recevoir douze blessures (voir: Mubarakpuri-Raheeq, p. 267)."
  ur: "وہیلنگ کے ہتھکنڈے کے بعد نبی کے ساتھ عقب میں صرف نو آدمی رہ گئے۔ عتبہ بن ابی وقاص نے اس پر پتھر برسائے۔ اس کا نچلا دائیں چیرا ٹوٹ گیا اور اس کا ہونٹ زخمی ہوگیا۔ عبداللہ بن قمیع نے ان کے گال پر تلوار کا ایسا مارا کہ ہیلمٹ کے دو کڑے اس میں دھنس گئے۔ مشکل ترین وقت میں طلحہ بن عبید اللہ اور سعد بن ابی وقاص ان کے ساتھ کھڑے ہوئے اور ان کی حفاظت کی۔ سعد نے اس وقت تک گولی ماری جب تک اس کا ترکش خالی نہ ہو گیا۔ طلحہ گیارہ آدمیوں کی طرح لڑتا رہا یہاں تک کہ اس کی انگلیاں کٹ گئیں اور اسے پینتیس یا انتیس زخم آئے۔ ابو عبیدہ بن الجراح نے اپنے گال سے ہیلمٹ کی دو انگوٹھیاں اپنے اگلے دانتوں سے کھینچ لیں۔ ابو دجانہ نے اسے اپنی پیٹھ سے تیروں سے بچا لیا۔ ام عمارہ نصیبہ بنت کعب نے اس کا دفاع کیا یہاں تک کہ اس نے بارہ زخم لگائے۔"
