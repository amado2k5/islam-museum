id: event/uhud-defense-of-the-prophet
class: event
kind: battle
label: { en: "Defense of the Prophet at Uhud", ar: "الدفاع عن رسول الله في أحد" }
summary:
  ar: "بعد حركة الالتفاف لم يكن مع النبي في المؤخرة إلا تسعة نفر. رماه عتبة بن أبي وقاص بالحجارة فوقع لشقه وأُصيبت رباعيته اليمنى السفلى وجُرحت شفته. ضربه عبد الله بن قمئة على وجنته بالسيف فدخلت حلقتان من حلق المغفر في وجنته. وبقي مع النبي في أحرج لحظة طلحة بن عبيد الله وسعد بن أبي وقاص فحَموه. تناضل سعد حتى نُثلت كنانته. قاتل طلحة قتال الأحد عشر حتى قُطعت أصابعه وجُرح خمساً وثلاثين أو تسعاً وثلاثين جرحاً. أزال أبو عبيدة بن الجراح حلقتي المغفر من وجنته بثنيّتيه. سترهُ أبو دجانة بظهره من النبل. دافعت أم عمارة نسيبة بنت كعب حتى أصابها اثنا عشر جرحاً {cite:mubarakpuri-raheeq p.267}."
  en: "After the wheeling manoeuvre only nine men remained with the Prophet at the rear. Utba ibn Abi Waqqas threw stones at him; his lower right incisor was broken and his lip wounded. Abdullah ibn Qami'a struck his cheek with a sword so that two rings of the helmet sank into it. In the hardest moment Talha ibn Ubaydullah and Sa'd ibn Abi Waqqas stood with him and shielded him. Sa'd shot until his quiver was emptied; Talha fought like eleven men until his fingers were cut and he bore thirty-five or thirty-nine wounds. Abu Ubayda ibn al-Jarrah pulled the two helmet rings from his cheek with his front teeth. Abu Dujana shielded him with his back from the arrows. Umm Umara Nusayba bint Ka'b defended him until she took twelve wounds {cite:mubarakpuri-raheeq p.267}."
