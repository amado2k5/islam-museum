label:
  ar: "إقامة الخطيب بصور وزيارته بيت المقدس، ٤٥٧هـ"
  en: "Al-Khatib settles at Tyre and visits Jerusalem, 457/1065"
  ur: "صور میں خطیب کا قیام اور بیت المقدس کی زیارات، 457ھ/1065ء"
summary:
  ar: "خرج الخطيب من دمشق إلى صور فأقام بها من صفر سنة سبع وخمسين وأربعمائة، وكان يزور البيت المقدس ويعود إلى صور، إلى سنة اثنتين وستين وأربعمائة {cite:tarikh-islam-dhahabi pp. 92-93}."
  en: "Al-Khatib moved from Damascus to Tyre, residing there from Safar 457, and would visit Jerusalem and return to Tyre, until the year 462 {cite:tarikh-islam-dhahabi pp. 92-93}."
  ur: "خطیب دمشق سے صور منتقل ہوئے اور صفر 457ھ سے وہاں مقیم رہے؛ وہ بیت المقدس کی زیارت کرتے اور صور واپس آ جاتے، یہ سلسلہ 462ھ تک جاری رہا {cite:tarikh-islam-dhahabi pp. 92-93}۔"
