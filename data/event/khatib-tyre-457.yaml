label:
  ar: "إقامة الخطيب بصور وزيارته بيت المقدس، ٤٥٧هـ"
  en: "Al-Khatib settles at Tyre and visits Jerusalem, 457/1065"
  ur: "صور میں خطیب کا قیام اور بیت المقدس کی زیارات، 457ھ/1065ء"
  es: "Al-Khatib se instala en Tiro y visita Jerusalén, 457/1065"
  fr: "Al-Khatib s'installe à Tyr et visite Jérusalem, 457/1065"
  tr: "Vaizin Sur'da kalışı ve Kudüs ziyareti, Hicri 457"
  id: "Masa tinggal pengkhotbah di Tirus dan kunjungannya ke Yerusalem, 457 H"
summary:
  ar: "خرج الخطيب من دمشق إلى صور فأقام بها من صفر سنة سبع وخمسين وأربعمائة، وكان يزور البيت المقدس ويعود إلى صور، إلى سنة اثنتين وستين وأربعمائة {cite:tarikh-islam-dhahabi pp. 92-93}."
  en: "Al-Khatib moved from Damascus to Tyre, residing there from Safar 457, and would visit Jerusalem and return to Tyre, until the year 462 {cite:tarikh-islam-dhahabi pp. 92-93}."
  ur: "خطیب دمشق سے صور منتقل ہوئے اور صفر 457ھ سے وہاں مقیم رہے؛ وہ بیت المقدس کی زیارت کرتے اور صور واپس آ جاتے، یہ سلسلہ 462ھ تک جاری رہا {cite:tarikh-islam-dhahabi pp. 92-93}۔"
  es: "Al-Khatib se trasladó de Damasco a Tiro, residiendo allí desde Safar 457, y visitaba Jerusalén y regresaba a Tiro hasta el año 462 {cite:tarikh-islam-dhahabi pp. 92-93}."
  fr: "Al-Khatib a quitté Damas pour Tyr, où il a résidé à partir de Safar 457, et visitait Jérusalem et retournait à Tyr, jusqu'en l'an 462 {cite:tarikh-islam-dhahabi pp. 92-93}."
  tr: "El-Hatib, Hicri 457 yılının Safer ayından itibaren Şam'dan Sur'a gitti ve orada kaldı. 462 Hicri yılına kadar Kutsal Evi ziyaret edip Sur'a geri dönüyordu. {kaynak:tarikh-islam-dhahabi s. 92-93}"
  id: "Al-Khatib meninggalkan Damaskus menuju Tirus dan tinggal di sana sejak bulan Safar tahun 457 H. Beliau biasa mengunjungi Baitullah dan kembali ke Tirus, hingga tahun 462 H. {cite:tarikh-islam-dhahabi pp. 92-93}."
