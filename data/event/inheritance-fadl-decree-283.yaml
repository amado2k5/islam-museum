class: event
kind: court-ruling
label: { ar: "أمر المعتضد برد فضل المواريث على ذوي الأرحام", en: "Al-Mu'tadid's decree on returning the residue of inheritances to blood kin", es: "Decreto de Al-Mu'tadid sobre la devolución del remanente de las herencias a los parientes consanguíneos.", fr: "Le décret d'Al-Mu'tadid relatif à la restitution du reliquat des héritages aux parents par le sang" }
summary:
  ar: "لعشر بقين من جمادى الأولى سنة ثلاث وثمانين ومائتين أمر المعتضد بالكتاب إلى جميع النواحي بردّ الفاضل من سهام المواريث على ذوي الأرحام فنُفّذت الكتب وقُرئت على المنابر، وكان سببها أنه استفتى القضاة فكتب أبو خازم القاضي وعلي بن محمد بن أبي الشوارب بردها على ذوي الأرحام وذكرا اتفاق عمر وعلي وابن مسعود، وأفتى يوسف بن يعقوب بقول زيد بن ثابت بردها إلى بيت المال، فأُمر بالعمل بقول أبي خازم والإعراض عن فتيا يوسف {cite:muntazam-ibn-al-jawzi p. 162-163}."
  en: "In Jumada I 283 al-Mu'tadid decreed that the residue of inheritance shares revert to blood kin rather than the treasury, and had the decree read from the pulpits — following Abu Khazim and Ibn Abi'l-Shawarib's opinion citing the agreement of Umar, Ali and Ibn Mas'ud, and setting aside Yusuf ibn Ya'qub's fatwa in favor of Zayd ibn Thabit's view {cite:muntazam-ibn-al-jawzi p. 162-163}."
  es: "En Jumada I 283 al-Mu'tadid decretó que el remanente de las participaciones de la herencia revirtiera a los parientes consanguíneos en lugar de al tesoro, e hizo leer el decreto desde los púlpitos, siguiendo la opinión de Abu Khazim e Ibn Abi'l-Shawarib, citando el acuerdo de Umar, Ali e Ibn Mas'ud, y dejando de lado la fatwa de Yusuf ibn Ya'qub a favor de la opinión de Zayd ibn Thabit {cite:muntazam-ibn-al-jawzi p. 162-163}."
  fr: "En Jumada I 283, al-Mu'tadid décréta que le reste des parts d'héritage reviendrait aux parents par le sang plutôt qu'au trésor, et fit lire le décret depuis les chaires — suivant l'opinion d'Abu Khazim et d'Ibn Abi'l-Shawarib citant l'accord d'Umar, d'Ali et d'Ibn Mas'ud, et mettant de côté la fatwa de Yusuf ibn Ya'qub en faveur de l'avis de Zayd ibn Thabit {cite:muntazam-ibn-al-jawzi p. 162-163}."
