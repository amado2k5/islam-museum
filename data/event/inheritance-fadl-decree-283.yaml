class: event
kind: court-ruling
label: { ar: "أمر المعتضد برد فضل المواريث على ذوي الأرحام", en: "Al-Mu'tadid's decree on returning the residue of inheritances to blood kin", es: "Decreto de Al-Mu'tadid sobre la devolución del remanente de las herencias a los parientes consanguíneos.", fr: "Le décret d'Al-Mu'tadid relatif à la restitution du reliquat des héritages aux parents par le sang", ur: "وراثت کی باقیات خونی رشتہ داروں کو واپس کرنے کے بارے میں المتدید کا حکم", tr: "El-Mu'tadid, miras fazlasının akrabalara iade edilmesini emretti.", id: "Al-Mu'tadid memerintahkan agar kelebihan warisan dikembalikan kepada kerabat." }
summary:
  ar: "لعشر بقين من جمادى الأولى سنة ثلاث وثمانين ومائتين أمر المعتضد بالكتاب إلى جميع النواحي بردّ الفاضل من سهام المواريث على ذوي الأرحام فنُفّذت الكتب وقُرئت على المنابر، وكان سببها أنه استفتى القضاة فكتب أبو خازم القاضي وعلي بن محمد بن أبي الشوارب بردها على ذوي الأرحام وذكرا اتفاق عمر وعلي وابن مسعود، وأفتى يوسف بن يعقوب بقول زيد بن ثابت بردها إلى بيت المال، فأُمر بالعمل بقول أبي خازم والإعراض عن فتيا يوسف {cite:muntazam-ibn-al-jawzi p. 162-163}."
  en: "In Jumada I 283 al-Mu'tadid decreed that the residue of inheritance shares revert to blood kin rather than the treasury, and had the decree read from the pulpits — following Abu Khazim and Ibn Abi'l-Shawarib's opinion citing the agreement of Umar, Ali and Ibn Mas'ud, and setting aside Yusuf ibn Ya'qub's fatwa in favor of Zayd ibn Thabit's view {cite:muntazam-ibn-al-jawzi p. 162-163}."
  es: "En Jumada I 283 al-Mu'tadid decretó que el remanente de las participaciones de la herencia revirtiera a los parientes consanguíneos en lugar de al tesoro, e hizo leer el decreto desde los púlpitos, siguiendo la opinión de Abu Khazim e Ibn Abi'l-Shawarib, citando el acuerdo de Umar, Ali e Ibn Mas'ud, y dejando de lado la fatwa de Yusuf ibn Ya'qub a favor de la opinión de Zayd ibn Thabit {cite:muntazam-ibn-al-jawzi p. 162-163}."
  fr: "En Jumada I 283, al-Mu'tadid décréta que le reste des parts d'héritage reviendrait aux parents par le sang plutôt qu'au trésor, et fit lire le décret depuis les chaires — suivant l'opinion d'Abu Khazim et d'Ibn Abi'l-Shawarib citant l'accord d'Umar, d'Ali et d'Ibn Mas'ud, et mettant de côté la fatwa de Yusuf ibn Ya'qub en faveur de l'avis de Zayd ibn Thabit {cite:muntazam-ibn-al-jawzi p. 162-163}."
  ur: "جمادیہ اول 283 میں المتعد نے حکم دیا کہ وراثت کے حصص کی باقیات خزانے کی بجائے رشتہ داروں کو واپس کر دی جائیں اور منبروں سے یہ فرمان پڑھا جائے - ابو خزیم اور ابن ابی الشعورب کی رائے کے بعد عمر، علی، اور یوسف اور ابن عباس ما کے معاہدے کا حوالہ دیتے ہوئے زید بن ثابت کے قول کے حق میں یعقوب کا فتویٰ 162-163}۔"
  tr: "283 yılında Cemâdî-i Ula ayının bitimine on gün kala, el-Mu'tedid, miras paylarının fazlasının akrabalara iade edilmesi için tüm bölgelere mektup gönderilmesini emretti. Mektuplar yerine getirildi ve minberlerden okundu. Bunun sebebi, kadılardan fetva istemesiydi ve kadı Ebu Hazim ile Ali bin Muhammed bin Ebu el-Şevarib, miras paylarının akrabalara iade edilmesi yönünde yazmış ve Ömer, Ali ve İbn Mesud'un da bu görüş birliğine vardıklarını belirtmişlerdi. Yusuf bin Yakub ise Zeyd bin Sabit'in sözüne dayanarak miras paylarının hazineye iade edilmesi yönünde fetva vermişti; bu nedenle el-Mu'tedid, Ebu Hazim'in sözüne göre hareket edilmesini ve Yusuf'un fetvasının dikkate alınmamasını emretti. {Kaynak: Muntazam ibn el-Cevzi, s. 162-163}"
  id: "Sepuluh hari sebelum berakhirnya Jumada al-Ula pada tahun 283, al-Mu’tadid memerintahkan agar surat dikirim ke seluruh wilayah untuk mengembalikan kelebihan bagian warisan kepada kerabat. Surat-surat tersebut dilaksanakan dan dibacakan dari mimbar. Alasannya adalah karena ia meminta fatwa dari para hakim, dan Abu Khazim, hakim, dan Ali bin Muhammad bin Abi al-Shawarib menulis untuk mengembalikannya kepada kerabat, dan mereka menyebutkan kesepakatan Umar, Ali, dan Ibnu Masoud. Yusuf bin Ya’qub memberikan fatwa berdasarkan pendapat Zayd bin Thabit untuk mengembalikannya ke perbendaharaan, sehingga ia memerintahkan untuk mengikuti pendapat Abu Khazim dan mengabaikan fatwa Yusuf. {cite:muntazam-ibn-al-jawzi hlm. 162-163}."
