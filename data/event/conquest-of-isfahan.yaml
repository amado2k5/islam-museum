summary:
  ar: "فتح أصبهان: بعث عمر إليها عبد الله بن عبد الله بن عتبان وكان شجاعًا من أشراف الصحابة ووجوه الأنصار حليف بني الحبلي، وأمده بأبي موسى وجعل على مجنبتيه عبد الله بن ورقاء الرياحي وعصمة بن عبد الله. وعلى جندها الأسبيدان وعلى مقدمتها شهريار بن جاذويه شيخ كبير في جمع عظيم، فدعا الشيخ إلى البراز فبرز له عبد الله بن ورقاء فقتله وانهزم أهلها. ثم سار عبد الله إلى مدينة جَيّ فحاصرها وقاتلها ثم صالحه الفاذوسفان على أصبهان على أن على من أقام الجزية وأقام على ماله ومن أبى وذهب كانت أرضه لهم {cite:kamil-ibn-al-athir p. 401-402}."
  en: "Isfahan fell to 'Abdallah ibn 'Abdallah ibn 'Utban, the Ansari ally of the Hubla clan, reinforced by Abu Musa. Its vanguard commander Shahriyar ibn Jadhawiya, an aged shaykh, called for a duel and was killed by 'Abdallah ibn Warqa' al-Riyahi; the army broke, Jayy was besieged, and the Fadhusfan capitulated on jizya terms — those who stayed kept their property, the lands of those who fled became the Muslims' {cite:kamil-ibn-al-athir p. 401-402}."
  es: "Isfahán cayó en manos de Abdallah ibn Abdallah ibn Utban, aliado ansarí del clan Hubla, reforzado por Abu Musa. Su comandante de vanguardia, Shahriyar ibn Jadhawiya, un anciano jeque, pidió un duelo y fue asesinado por Abdallah ibn Warqa al-Riyahi; el ejército se desmoronó, Jayy fue sitiada y los Fadhusfan capitularon en términos de jizya: quienes se quedaron conservaron sus propiedades, y las tierras de quienes huyeron pasaron a ser de los musulmanes {cite:kamil-ibn-al-athir p. 401-402}."
  fr: "Ispahan tomba aux mains d'Abdallah ibn Abdallah ibn Utban, allié des Ansar du clan Hubla, renforcé par Abou Moussa. Son commandant d'avant-garde, Shahriyar ibn Jadhawiya, un cheikh âgé, provoqua un duel et fut tué par Abdallah ibn Warqa' al-Riyahi; l'armée se débanda, Jayy fut assiégée et les Fadhusfan capitulèrent aux conditions de la jizya: ceux qui restèrent conservèrent leurs biens, les terres de ceux qui s'enfuirent devinrent musulmanes."
  ur: "اصفہان عبداللہ بن عبداللہ ابن عتبان کے پاس گرا، جو حبلہ قبیلہ کے انصاری حلیف تھے، جنہیں ابو موسیٰ نے تقویت دی۔ اس کے سرکردہ کمانڈر شہریار ابن جادھویہ، ایک بوڑھے شیخ نے جنگ کے لیے بلایا اور اسے عبداللہ بن ورقع الریاضی نے قتل کر دیا۔ فوج ٹوٹ گئی، جئے کا محاصرہ کیا گیا، اور فدھوسفان نے جزیہ کی شرائط پر سر تسلیم خم کر دیا - جو ٹھہرے رہے انہوں نے اپنی جائیدادیں رکھ لیں، بھاگنے والوں کی زمینیں مسلمانوں کی بن گئیں۔ 401-402}۔"
  tr: "İsfahan'ın Fethi: Ömer, cesur ve soylu bir Sahabe ve önde gelen Ensar'dan, Beni el-Habli'nin müttefiki olan Abdullah ibn Abdullah ibn Utban'ı İsfahan'a gönderdi. Ona Ebu Musa'yı takviye etti ve Abdullah ibn Varakü'l-Riyahi ile İsme ibn Abdullah'ı kanatlarına yerleştirdi. Orduya Asbidan komuta ediyordu ve öncü birliğine büyük bir kuvvete sahip yaşlı bir adam olan Şahriyar ibn Cedveyveyh önderlik ediyordu. Yaşlı adam orduyu teke tek düelloya davet etti ve Abdullah ibn Varakü'l-iyice öne çıkıp onu öldürdü ve İsfahan halkı bozguna uğradı. Ardından Abdullah, Jay şehrine yürüdü, şehri kuşattı ve savaştı. Daha sonra Fazhusfan, İsfahan konusunda onunla barış yaptı; şart olarak, kalanların cizye ödeyip mallarına sahip olmaları, reddedip ayrılanların ise topraklarının kendilerine verilmesi istendi. {Kaynak: Kamil ibn el-Athir s. 401-402}"
  id: "Penaklukan Isfahan: Umar mengutus Abdullah ibn Abdullah ibn Utban, seorang Sahabat yang gagah berani dan mulia serta tokoh Ansar terkemuka, sekutu Banu al-Habli, ke sana. Ia memperkuatnya dengan Abu Musa dan menempatkan Abdullah ibn Warqa' al-Riyahi dan Ismah ibn Abdullah di sisi sayapnya. Pasukan dipimpin oleh Asbidan, dan barisan depannya dipimpin oleh Shahriyar ibn Jadhawayh, seorang lelaki tua dengan pasukan yang besar. Lelaki tua itu menantang pasukan untuk duel satu lawan satu, dan Abdullah ibn Warqa' maju dan membunuhnya, dan penduduk Isfahan dikalahkan. Kemudian Abdullah berbaris ke kota Jayy, mengepungnya, dan memeranginya. Kemudian Fadhusfan berdamai dengannya mengenai Isfahan, dengan syarat bahwa siapa pun yang tinggal akan membayar jizya dan tetap memiliki hartanya, dan siapa pun yang menolak dan pergi akan kehilangan tanahnya. {cite:kamil-ibn-al-athir p. 401-402}"
