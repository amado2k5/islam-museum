summary:
  ar: "فتح أصبهان: بعث عمر إليها عبد الله بن عبد الله بن عتبان وكان شجاعًا من أشراف الصحابة ووجوه الأنصار حليف بني الحبلي، وأمده بأبي موسى وجعل على مجنبتيه عبد الله بن ورقاء الرياحي وعصمة بن عبد الله. وعلى جندها الأسبيدان وعلى مقدمتها شهريار بن جاذويه شيخ كبير في جمع عظيم، فدعا الشيخ إلى البراز فبرز له عبد الله بن ورقاء فقتله وانهزم أهلها. ثم سار عبد الله إلى مدينة جَيّ فحاصرها وقاتلها ثم صالحه الفاذوسفان على أصبهان على أن على من أقام الجزية وأقام على ماله ومن أبى وذهب كانت أرضه لهم {cite:kamil-ibn-al-athir p. 401-402}."
  en: "Isfahan fell to 'Abdallah ibn 'Abdallah ibn 'Utban, the Ansari ally of the Hubla clan, reinforced by Abu Musa. Its vanguard commander Shahriyar ibn Jadhawiya, an aged shaykh, called for a duel and was killed by 'Abdallah ibn Warqa' al-Riyahi; the army broke, Jayy was besieged, and the Fadhusfan capitulated on jizya terms — those who stayed kept their property, the lands of those who fled became the Muslims' {cite:kamil-ibn-al-athir p. 401-402}."
