id: event/siege-of-taif
education:
  did_you_know:
    ar: "حاصر المسلمون الطائف بعد حنين ثم انسحبوا دون فتحها، فأسلمت ثقيف بوفودها في العام التالي نفسه كما تروي السيرة."
    en: "The Muslims besieged Taif after Hunayn, then withdrew without taking it; Thaqif sent delegations and embraced Islam the following year, per the sirah."
    ur: "حنین کے بعد مسلمانوں نے طائف کا محاصرہ کیا پھر بغیر فتح کے واپس ہوئے؛ اگلے ہی سال ثقیف نے وفود بھیج کر اسلام قبول کیا، جیسا کہ سیرت بیان کرتی ہے۔"
    sources: [source/ibn-hisham-saqqa, source/lings-1983]
