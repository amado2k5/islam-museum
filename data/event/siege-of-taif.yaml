label: { en: "The siege of Ta'if", ar: "حصار الطائف" }
summary:
  en: "After Hunayn, the Muslims besieged the fortified town of Ta'if, home of the Thaqif; the siege was lifted without taking it, and the Thaqif accepted Islam the next year."
  ar: "حاصر المسلمون الطائف المحصنة موطن ثقيف بعد حنين، ثم رفعوا الحصار دون فتحها، وأسلمت ثقيف في العام التالي. ويروي ابن عمر في الصحيح: «حاصر النبي أهل الطائف فلم يفتحها فقال: إنا قافلون إن شاء الله، فقال المسلمون: نقفل ولم نفتح؟ قال: فاغدوا على القتال فغدوا فأصابتهم جراحات، قال النبي: إنا قافلون غداً إن شاء الله — فكأن ذلك أعجبهم فتبسم رسول الله» {cite:sahih-al-bukhari 7480}."
