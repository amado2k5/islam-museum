summary:
  ar: "أشهر مناظرة إسلامية–تنصيرية في القرن التاسع عشر: التقت في [[place/agra|آغرا]] بالهند سنة 1854 حلقة مناظرة بين العالم السني الهندي [[person/rahmatullah-kairanawi|رحمة الله الكيرانوي]] والمبشر البروتستانتي الألماني [[person/karl-gottlieb-pfander|كارل غوتليب فاندر]] صاحب «ميزان الحق»، بحضور جمع من العلماء والموظفين، وتدارس الطرفان نقد الكتاب المقدس وعقيدة التثليث ونبوة محمد. وجمع الكيرانوي مباحثها ومطوّلها في مصنفه «إظهار الحق» الذي صار أشهر متن سني حديث في الرد على التنصير وأساس أدب المناظرات المعاصر {cite:researchgate-pfander-legacy}."
  en: "The most famous Muslim–Christian missionary debate of the nineteenth century: at [[place/agra|Agra]] in India in 1854, the Indian Sunni scholar [[person/rahmatullah-kairanawi|Rahmatullah Kairanawi]] met the German Protestant missionary [[person/karl-gottlieb-pfander|Karl Gottlieb Pfander]], author of Mizan al-Haqq, before an assembly of scholars and officials; the parties examined biblical criticism, the doctrine of the Trinity and the prophethood of Muhammad. Kairanawi gathered its exchanges, expanded, into his composition Izhar al-Haqq, which became the foremost modern Sunni text against the missions and the foundation of contemporary disputation literature {cite:researchgate-pfander-legacy}."
