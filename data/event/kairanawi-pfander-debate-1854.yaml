label: { ar: "مناظرة آغرا بين رحمة الله الكيرانوي وكارل فاندر", en: "The Agra Debate — Kairanawi vs Pfander (1854)", es: "El debate de Agra: Kairanawi contra Pfander (1854)", fr: "Le débat d'Agra - Kairanawi contre Pfander (1854)", ur: "آگرہ بحث - کیرانوی بمقابلہ فانڈر (1854)", tr: "Rahmatullah Al-Kiranawi ve Karl Vander arasındaki Agra tartışması", id: "Agra perdebatan antara Rahmatullah Al-Kiranawi dan Karl Vander" }
summary:
  ar: "أشهر مناظرة إسلامية–تنصيرية في القرن التاسع عشر: التقت في [[place/agra|آغرا]] بالهند سنة 1854 حلقة مناظرة بين العالم السني الهندي [[person/rahmatullah-kairanawi|رحمة الله الكيرانوي]] والمبشر البروتستانتي الألماني [[person/karl-gottlieb-pfander|كارل غوتليب فاندر]] صاحب «ميزان الحق»، بحضور جمع من العلماء والموظفين، وتدارس الطرفان نقد الكتاب المقدس وعقيدة التثليث ونبوة محمد. وجمع الكيرانوي مباحثها ومطوّلها في مصنفه «إظهار الحق» الذي صار أشهر متن سني حديث في الرد على التنصير وأساس أدب المناظرات المعاصر {cite:researchgate-pfander-legacy}."
  en: "The most famous Muslim–Christian missionary debate of the nineteenth century: at [[place/agra|Agra]] in India in 1854, the Indian Sunni scholar [[person/rahmatullah-kairanawi|Rahmatullah Kairanawi]] met the German Protestant missionary [[person/karl-gottlieb-pfander|Karl Gottlieb Pfander]], author of Mizan al-Haqq, before an assembly of scholars and officials; the parties examined biblical criticism, the doctrine of the Trinity and the prophethood of Muhammad. Kairanawi gathered its exchanges, expanded, into his composition Izhar al-Haqq, which became the foremost modern Sunni text against the missions and the foundation of contemporary disputation literature {cite:researchgate-pfander-legacy}."
  es: "El debate misionero musulmán-cristiano más famoso del siglo XIX tuvo lugar en Agra, India, en 1854, donde el erudito sunita indio Rahmatullah Kairanawi se reunió con el misionero protestante alemán Karl Gottlieb Pfander, autor de Mizan al-Haqq, ante una asamblea de eruditos y funcionarios. Las partes analizaron la crítica bíblica, la doctrina de la Trinidad y la profecía de Mahoma. Kairanawi recopiló y amplió estos intercambios en su obra Izhar al-Haqq, que se convirtió en el texto sunita moderno más importante contra las misiones y en la base de la literatura de debate contemporánea."
  fr: "Le plus célèbre débat missionnaire musulman-chrétien du XIXe siècle: à Agra, en Inde, en 1854, le savant sunnite indien Rahmatullah Kairanawi rencontra le missionnaire protestant allemand Karl Gottlieb Pfander, auteur de Mizan al-Haqq, devant une assemblée de savants et de dignitaires. Les deux hommes examinèrent la critique biblique, le dogme de la Trinité et la prophétie de Mahomet. Kairanawi rassembla et développa ces échanges dans son ouvrage Izhar al-Haqq, qui devint le principal texte sunnite moderne s'opposant aux missions et posa les fondements de la littérature polémique contemporaine."
  ur: "انیسویں صدی کا سب سے مشہور مسلم-عیسائی مشنری مباحثہ: 1854 میں ہندوستان میں [[جگہ/آگرہ|آگرہ]] میں، ہندوستانی سنی اسکالر [[شخص/رحمت اللہ کیرانوی الحق، علماء اور حکام کی ایک مجلس کے سامنے؛ فریقین نے بائبل کی تنقید، تثلیث کے نظریے اور محمد کی نبوت کا جائزہ لیا۔ کیرانوی نے اس کے تبادلے کو جمع کیا، اپنی ساخت اظہار الحق میں توسیع کی، جو مشنوں کے خلاف جدید ترین سنی متن بن گیا اور عصری تنازعات کے ادب کی بنیاد بن گیا۔"
  tr: "19. yüzyılın en ünlü İslam-Hristiyan tartışması: 1854'te Hindistan'ın Agra şehrinde, Hintli Sünni alim Rahmatullah Kayranevi ile \"Mizan el-Hakk\" (Hakikatin Terazisi) adlı eserin yazarı Alman Protestan misyoner Karl Gottlieb Pfander arasında bir tartışma gerçekleşti. Çok sayıda alim ve yetkilinin katıldığı tartışma, İncil'i, Teslis doktrinini ve Muhammed'in peygamberliğini eleştirmeye odaklandı. Kayranevi, bu tartışmaları \"İzhar el-Hakk\" (Hakikatin Tezahürü) adlı eserinde derleyip detaylandırdı; bu eser, Hristiyan misyonerlik çalışmalarını çürüten en ünlü modern Sünni metin ve çağdaş tartışma literatürünün temel metni haline geldi."
  id: "Debat Islam-Kristen paling terkenal di abad kesembilan belas: Pada tahun 1854, sebuah debat berlangsung di Agra, India, antara cendekiawan Sunni India Rahmatullah Kairanawi dan misionaris Protestan Jerman Karl Gottlieb Pfander, penulis \"Mizan al-Haqq\" (Keseimbangan Kebenaran). Debat tersebut, yang dihadiri oleh sejumlah cendekiawan dan pejabat, berfokus pada kritik terhadap Alkitab, doktrin Trinitas, dan kenabian Muhammad. Kairanawi mengumpulkan dan menguraikan diskusi-diskusi ini dalam karyanya \"Izhar al-Haqq\" (Manifestasi Kebenaran), yang menjadi teks Sunni modern paling terkenal yang membantah karya misionaris Kristen dan teks dasar bagi literatur debat kontemporer."
