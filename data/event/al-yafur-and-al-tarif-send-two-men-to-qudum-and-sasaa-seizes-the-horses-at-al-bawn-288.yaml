id: event/al-yafur-and-al-tarif-send-two-men-to-qudum-and-sasaa-seizes-the-horses-at-al-bawn-288
class: event
kind: other
label:
  ar: "آل يعفر وآل طريف يخرجون رجلين إلى قدم وصعصعة يستولي على الخيل بالبون، سنة 288هـ"
  en: "Al Ya'fur and Al Tarif send two men to Qudum and Sa'sa'a seizes the horses at al-Bawn, 288 AH"
  ur: "آل یعفر اور آل طریف دو آدمی قدم بھیجتے ہیں اور صعصعہ البون میں گھوڑے لے لیتا ہے، 288ھ"
summary:
  ar: "لما قلّ عسكر الهادي بعد خروج أبي القاسم من شبام أجمع آل يعفر وآل طريف على إخراج رجلين من آل يعفر إلى بلد قدم، فاجتمع إليهما سفهاء كثير، وبلغ ذلك صعصعة بن جعفر فوثب بالبون وأخذ خيل الهادي وفرقها وأفسد البون، بحسب الراوي."
  en: "When al-Hadi's army grew small after Abu al-Qasim left Shibam, Al Ya'fur and Al Tarif agreed to send two men of Al Ya'fur to the land of Qudum, where many fools gathered to them; Sa'sa'a ibn Ja'far then rose at al-Bawn, took the horses kept for al-Hadi, shared them out and disordered al-Bawn, in the narrator's account."
  ur: "ابو القاسم کے شبام سے نکلنے کے بعد جب ہادی کا لشکر کم ہو گیا تو آل یعفر اور آل طریف نے آل یعفر کے دو آدمی بلدِ قدم بھیجنے پر اتفاق کیا جہاں بہت سے ناسمجھ ان کے گرد جمع ہو گئے؛ پھر راوی کے بیان کے مطابق صعصعہ بن جعفر نے البون میں اٹھ کر ہادی کے گھوڑے لے لیے، انہیں بانٹ دیا اور البون میں بگاڑ پیدا کیا۔"
