summary:
  ar: "نحو سنة 1352م، وهو في نحو العشرين من عمره، أُسند إلى ابن خلدون منصب في بلاط تونس، ثم صار كاتبًا للسلطان المريني في فاس بعد ثلاث سنين. {cite:britannica-ibn-khaldun}"
  en: "Around 1352, at about the age of twenty, Ibn Khaldun was given a post at the court of Tunis; three years later he became secretary to the Marinid sultan in Fez. {cite:britannica-ibn-khaldun}"
  ur: "1352ء کے لگ بھگ، تقریباً بیس برس کی عمر میں، ابن خلدون کو تیونس کے دربار میں منصب ملا؛ تین برس بعد وہ فاس میں مرینی سلطان کے کاتب ہو گئے۔"
  es: "Hacia 1352, a la edad de unos veinte años, Ibn Khaldun recibió un puesto en la corte de Túnez; tres años después se convirtió en secretario del sultán mariní en Fez. {cite:britannica-ibn-khaldun}"
  fr: "Vers 1352, à l'âge d'une vingtaine d'années, Ibn Khaldoun obtint un poste à la cour de Tunis; trois ans plus tard, il devint secrétaire du sultan mérinide à Fès. {cite:britannica-ibn-khaldun}"
  tr: "İbn Haldun, yaklaşık yirmi yaşında olduğu 1352 yılı civarında Tunus sarayında bir göreve getirildi ve üç yıl sonra da Fez'deki Marinid sultanının kâtibi oldu. {cite:britannica-ibn-khaldun}"
  id: "Sekitar tahun 1352 M, ketika ia berusia sekitar dua puluh tahun, Ibn Khaldun diberi posisi di istana Tunis, dan kemudian tiga tahun kemudian ia menjadi juru tulis sultan Marinid di Fez. {cite:britannica-ibn-khaldun}"
