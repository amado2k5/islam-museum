label:
  ar: "تصنيف «السنن» وعرضه على أحمد بن حنبل قبل ٢٤١هـ"
  en: "The Sunan composed and shown to Ahmad ibn Hanbal, before 241/855"
  fr: "Composition des Sunan et présentation à Ahmad ibn Hanbal, avant 241/855"
  ur: "«سنن» کی تصنیف اور امام احمد بن حنبل پر عرض، 241ھ/855ء سے پہلے"
  es: "El Sunan compuesto y mostrado a Ahmad ibn Hanbal, antes del año 241/855."
  tr: "\"Sunan\"ın sınıflandırılması ve Hicri 241 yılından önce Ahmed ibn Hanbel'e sunulması"
  id: "Klasifikasi \"Sunan\" dan penyajiannya kepada Ahmad ibn Hanbal sebelum tahun 241 Hijriah"
summary:
  ar: "يُقال إن أبا داود صنّف «السنن» فعرضه على الإمام أحمد فاستجاده واستحسنه {cite:tarikh-islam-dhahabi p. 359}؛ وتؤكد الموسوعة الإسلامية الخبر نفسه {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. وقال ابن داسة: سمعت أبا داود يقول: كتبت عن رسول الله خمسمائة ألف حديث وانتخبت منها ما ضمّنته كتاب السنن، جمعت فيه أربعة آلاف وثمانمائة حديث، ذكرت الصحيح وما يشبهه ويقاربه {cite:tarikh-islam-dhahabi p. 360}. وتفقّه بأحمد بن حنبل ولازمه مدة وكان من نجباء أصحابه {cite:tarikh-islam-dhahabi p. 360}؛ وبما أن أحمد توفي سنة ٢٤١هـ فالعرض واقع قبلها."
  en: "It is said that Abu Dawud composed the Sunan and presented it to the Imam Ahmad, who admired and approved it {cite:tarikh-islam-dhahabi p. 359}, a report the Encyclopaedia of Islam confirms {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Ibn Dasa heard him say: I wrote down five hundred thousand traditions from the Messenger of God and selected from them what I placed in the Sunan — four thousand eight hundred traditions — naming the sound ones and those resembling or approaching them {cite:tarikh-islam-dhahabi p. 360}. He read law with Ahmad ibn Hanbal, kept his company for a time and was among the elite of his pupils {cite:tarikh-islam-dhahabi p. 360}; as Ahmad died in 241, the presentation falls before that year."
  fr: "Il est dit qu’Abu Dawud composa les Sunan et les présenta à l’imam Ahmad, qui les admira et les approuva {cite:tarikh-islam-dhahabi p. 359}, récit confirmé par l’Encyclopédie de l’Islam {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Ibn Dasa l’entendit dire : j’ai consigné cinq cent mille traditions du Messager de Dieu et en ai sélectionné celles que j’ai placées dans les Sunan — quatre mille huit cents traditions —, en indiquant les authentiques et celles qui leur ressemblent ou s’en approchent {cite:tarikh-islam-dhahabi p. 360}. Il étudia le droit auprès d’Ahmad ibn Hanbal, le fréquenta un temps et fut parmi l’élite de ses élèves {cite:tarikh-islam-dhahabi p. 360} ; Ahmad étant mort en 241, la présentation est antérieure à cette année."
  ur: "کہا جاتا ہے کہ ابو داؤد نے «سنن» مرتب کی اور امام احمد کے سامنے پیش کی تو انہوں نے اسے پسند فرمایا {cite:tarikh-islam-dhahabi p. 359}؛ یہی روایت دائرة المعارف الإسلامية بھی دیتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}۔ ابن داسہ نے ان سے سنا: میں نے رسول اللہ سے پانچ لاکھ احادیث لکھیں اور ان میں سے چن کر کتاب السنن میں چار ہزار آٹھ سو حدیثیں جمع کیں، جن میں صحیح اور اس کے مشابہ و قریب ذکر کیے {cite:tarikh-islam-dhahabi p. 360}۔ انہوں نے احمد بن حنبل سے فقہ حاصل کی، مدت ان کی صحبت میں رہے اور ان کے برگزیدہ شاگردوں میں شمار ہوئے {cite:tarikh-islam-dhahabi p. 360}؛ چونکہ احمد 241ھ میں فوت ہوئے، یہ عرض اس سے پہلے واقع ہوا۔"
  es: "Se dice que Abu Dawud compuso el Sunan y se lo presentó al Imam Ahmad, quien lo admiró y aprobó {cite:tarikh-islam-dhahabi p. 359}, un informe que confirma la Enciclopedia del Islam {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Ibn Dasa lo oyó decir: Escribí quinientas mil tradiciones del Mensajero de Dios y seleccioné de ellas las que puse en el Sunan —cuatro mil ochocientas tradiciones— nombrando las auténticas y las que se asemejan o se aproximan a ellas {cite:tarikh-islam-dhahabi p. 360}. Estudió derecho con Ahmad ibn Hanbal, lo acompañó durante un tiempo y estuvo entre la élite de sus discípulos {cite:tarikh-islam-dhahabi p. 360}; como Ahmad murió en 241, la presentación se sitúa antes de ese año."
  tr: "Rivayet olunur ki, Ebu Davud Sünen'ini derleyip İmam Ahmed'e sunmuş, o da onaylamış ve övmüştür {kaynak:tarikh-islam-dhahabi s. 359}; ve İslam Ansiklopedisi de aynı rivayeti doğrulamaktadır {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 133}. İbn Dasah şöyle demiştir: Ebu Davud'un şöyle dediğini işittim: \"Allah Resulü'nden beş yüz bin hadis yazdım ve bunlardan Sünen kitabına dahil ettiklerimi seçtim; bu kitapta dört bin sekiz yüz hadis derledim, sahih olanları ve onlara benzer olanları zikrettim\" {kaynak:tarikh-islam-dhahabi s. 360}. Ahmed ibn Hanbel'den fıkıh eğitimi aldı, bir süre onunla kaldı ve en seçkin arkadaşlarından biriydi {kaynak:tarikh-islam-dhahabi s. 360}. Ahmed 241 Hicri yılında vefat ettiğinden, sunum bundan önce gerçekleşmiştir."
  id: "Dikatakan bahwa Abu Dawud menyusun kitab Sunan dan mempersembahkannya kepada Imam Ahmad, yang menyetujui dan memujinya {cite:tarikh-islam-dhahabi hlm. 359}; dan Ensiklopedia Islam mengkonfirmasi riwayat yang sama {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 133}. Ibnu Dasah berkata: Saya mendengar Abu Dawud berkata: Saya mencatat lima ratus ribu hadits dari Rasulullah, dan saya memilih dari hadits-hadits tersebut apa yang saya masukkan ke dalam kitab Sunan, di mana saya menyusun empat ribu delapan ratus hadits, menyebutkan hadits-hadits yang sahih dan hadits-hadits yang serupa dan dekat dengannya {cite:tarikh-islam-dhahabi hlm. 360}. Beliau mempelajari fiqih di bawah Ahmad ibn Hanbal dan tinggal bersamanya untuk beberapa waktu dan merupakan salah satu sahabatnya yang paling terkemuka {cite:tarikh-islam-dhahabi hlm. 360}; dan karena Ahmad wafat pada tahun 241 H, maka persembahan tersebut terjadi sebelum itu."
