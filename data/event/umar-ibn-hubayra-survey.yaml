label: { ar: "مساحة عمر بن هبيرة للقطائع", en: "Umar ibn Hubayra's Survey of the Grants" }
summary:
  ar: "كتب يزيد بن عبد الملك إلى عمر بن هبيرة أنه ليست لأمير المؤمنين بأرض العرب خرصة فسر على القطائع فخذ فضولها لأمير المؤمنين فجعل عمر يأتي القطيعة فيسأل عنها ثم يمسحها حتى وقف على أرض فقال لمن هذه فقال صاحبها لي فقال ومن أين هي لك فقال ورثناها عن آباء صدق ويورثها إذا متنا بنينا ثم إن الناس ضجوا من ذلك فأمسك."
  en: "Yazid ibn Abd al-Malik wrote Umar ibn Hubayra: 'the Commander of the Faithful holds no share in Arab land — go through the grants and take their surplus for me'; Umar walked each qati'a asking its owner how he held it, till one answered 'we inherited them from truthful fathers, and when we die our sons inherit' — the people cried out, and he stopped."
