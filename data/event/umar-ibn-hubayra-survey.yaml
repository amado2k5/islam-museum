label: { ar: "مساحة عمر بن هبيرة للقطائع", en: "Umar ibn Hubayra's Survey of the Grants", es: "Estudio de las subvenciones realizado por Umar ibn Hubayra", fr: "L'étude des subventions d'Umar ibn Hubayra", ur: "عمر بن ہبیرہ کا سروے آف دی گرانٹس" }
summary:
  ar: "كتب يزيد بن عبد الملك إلى عمر بن هبيرة أنه ليست لأمير المؤمنين بأرض العرب خرصة فسر على القطائع فخذ فضولها لأمير المؤمنين فجعل عمر يأتي القطيعة فيسأل عنها ثم يمسحها حتى وقف على أرض فقال لمن هذه فقال صاحبها لي فقال ومن أين هي لك فقال ورثناها عن آباء صدق ويورثها إذا متنا بنينا ثم إن الناس ضجوا من ذلك فأمسك."
  en: "Yazid ibn Abd al-Malik wrote Umar ibn Hubayra: 'the Commander of the Faithful holds no share in Arab land — go through the grants and take their surplus for me'; Umar walked each qati'a asking its owner how he held it, till one answered 'we inherited them from truthful fathers, and when we die our sons inherit' — the people cried out, and he stopped."
  es: "Yazid ibn Abd al-Malik escribió a Umar ibn Hubayra: «El Comandante de los Creyentes no posee ninguna parte de las tierras árabes; revisa las concesiones y toma el excedente para mí». Umar recorrió cada qati'a preguntando a su dueño cómo la poseía, hasta que uno respondió: «Las heredamos de padres veraces, y cuando muramos, nuestros hijos las heredarán». La gente gritó y él se detuvo."
  fr: "Yazid ibn Abd al-Malik écrivit à Umar ibn Hubayra: « Le Commandeur des Croyants ne possède aucune part dans les terres arabes — examine les concessions et prends leur surplus pour moi »; Umar parcourut chaque qati'a en demandant à son propriétaire comment il la détenait, jusqu'à ce que l'un réponde: « Nous les avons héritées de pères véridiques, et lorsque nous mourrons, nos fils hériteront » — les gens crièrent, et il s'arrêta."
  ur: "یزید بن عبد الملک نے عمر بن ہبیرہ کو لکھا: 'وفاداروں کے سپہ سالار کا عرب کی سرزمین میں کوئی حصہ نہیں ہے - گرانٹ کے ذریعے جاؤ اور ان کا اضافی میرے لیے لے لو'؛ عمر نے ہر قطیہ کے مالک سے پوچھا کہ اس نے اسے کیسے رکھا ہے، یہاں تک کہ ایک نے جواب دیا کہ 'ہم نے انہیں سچے باپوں سے وراثت میں ملا ہے، اور جب ہم مرتے ہیں تو ہمارے بیٹے وارث ہوتے ہیں' - لوگوں نے پکارا، اور وہ رک گیا۔"
