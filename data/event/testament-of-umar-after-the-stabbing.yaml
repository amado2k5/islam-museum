id: event/testament-of-umar-after-the-stabbing
class: event
kind: declaration
tags: [wasaya-browser, wasaya-caliphs, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath]
label: { ar: "وصية عمر بن الخطاب بعد الطعن", en: "Testament of Umar after the stabbing", ur: "طعن کے بعد عمر بن الخطاب کی وصیت" }
summary:
  ar: "بعد أن طعنه أبو لؤلؤة في صلاة الفجر لأربع بقين من ذي الحجة سنة 23هـ {cite:al-bidaya-wal-nihaya scan vol. 4 p. 138} طلب عمر أن يُنظر في دينه فوجدوه نحو ستة وثمانين ألفاً وأمر بوفائه من مال آل عمر ثم بني عدي ثم قريش {cite:fath-al-bari scan vol. 1 p. 403}. وأرسل إلى عائشة يستأذنها أن يُدفن مع صاحبيه {cite:fath-al-bari scan vol. 1 p. 404}، وأوصى الخليفة بعده بالمهاجرين الأولين والأنصار وأهل الأمصار والأعراب وأهل الذمة، وجعل الأمر شورى بين ستة {cite:fath-al-bari scan vol. 1 p. 404}. وتنقل الرياض النضرة وصاياه إلى الناس بكتاب الله وبهذه الطبقات {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 415}، وتختلف الروايات في مبلغ الدين {cite:fath-al-bari scan vol. 1 p. 412}."
  en: "After Abu Lu'lu'a stabbed him in the dawn prayer four nights before the end of Dhu al-Hijja 23 AH {cite:al-bidaya-wal-nihaya scan vol. 4 p. 138}, Umar had his debt reckoned at about eighty-six thousand and ordered it paid from the property of the family of Umar, then Banu Adi, then Quraysh {cite:fath-al-bari scan vol. 1 p. 403}. He sent to Aisha for permission to be buried with his two companions {cite:fath-al-bari scan vol. 1 p. 404}, charged the next caliph to look after the first Emigrants, the Ansar, the people of the garrison towns, the Bedouin and the protected peoples, and made the succession a consultation among six {cite:fath-al-bari scan vol. 1 p. 404}. Al-Muhibb al-Tabari relays his counsel to the people to hold to the Book of God and to care for these groups {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 415}; the reports differ on the amount of the debt {cite:fath-al-bari scan vol. 1 p. 412}."
  ur: "23ھ میں ذی الحجہ کے چار دن باقی تھے جب ابو لؤلؤہ نے فجر کی نماز میں عمر پر وار کیا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 138}؛ عمر نے اپنا قرض گنوایا جو تقریباً چھیاسی ہزار نکلا اور حکم دیا کہ آلِ عمر، پھر بنی عدی، پھر قریش کے مال سے ادا ہو {cite:fath-al-bari scan vol. 1 p. 403}۔ انھوں نے عائشہ سے اپنے دونوں ساتھیوں کے ساتھ دفن ہونے کی اجازت مانگی {cite:fath-al-bari scan vol. 1 p. 404}، آنے والے خلیفہ کو اولین مہاجرین، انصار، شہروں کے باشندوں، دیہاتی عربوں اور ذمیوں کے بارے میں وصیت کی، اور خلافت چھ آدمیوں کے مشورے پر چھوڑی {cite:fath-al-bari scan vol. 1 p. 404}۔ الریاض النضرہ لوگوں کو کتاب اللہ اور انھی طبقات کی وصیت نقل کرتی ہے {cite:riyad-nadira-ilmiyya-1984 scan vol. 3 p. 415}؛ قرض کی مقدار میں روایتیں مختلف ہیں {cite:fath-al-bari scan vol. 1 p. 412}۔"
