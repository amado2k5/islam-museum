summary:
  ar: "أتم ابن خلدون مقدمته في خمسة أشهر، وانتهى من تأليفها منتصف سنة 779هـ، ثم نقّحها وهذّبها وألحق بها تواريخ العرب والبربر في كتاب العِبر {cite:muqaddima-ibn-khaldun p. 652}."
  en: "Ibn Khaldun finished composing the Muqaddima in five months, by the middle of 779 AH, then revised it and added the histories of the Arabs and Berbers as the Kitab al-'Ibar {cite:muqaddima-ibn-khaldun p. 652}."
  ur: "ابن خلدون نے پانچ مہینوں میں مقدمہ مکمل کیا، جو 779ھ کے وسط تک تصنیف ہوا، پھر اس پر نظرِ ثانی کی اور عربوں و بربروں کی تاریخ کتاب العبر کے طور پر شامل کی {cite:muqaddima-ibn-khaldun p. 652}."
