  ar: "أول ما بدئ به من الوحي الرؤيا الصالحة ستة أشهر — جزء من ستة وأربعين جزءاً من النبوة — ثم جاءه الملك في رمضان فأنزل الله عليه أوائل العلق ⁦(بخاري عن عائشة؛ الرحيق ص66-67)⁩."
