id: event/first-revelation
class: event
kind: revelation
label: { en: "The first revelation", ar: "بدء الوحي في غار حراء" }
summary:
  en: "The descent of Jibril upon the Prophet in the cave of Hira with the opening verses of surat al-Alaq, on the night of Monday 21 Ramadan in the book's preferred reckoning, corresponding to 10 August 610 CE, when the Prophet was forty lunar years, six months and twelve days old. The Encyclopaedia of Islam summarises the Muslim accounts of this first revelation and of the experience of wahy, and sets beside them the academic view that the traditional stories of a first revelation are doubtful."
  ar: "نزول جبريل على النبي في غار حراء بأوائل سورة العلق، ليلة الإثنين الحادي والعشرين من رمضان في ترجيح الكتاب، الموافق 10 أغسطس 610م، وعمره إذ ذاك أربعون سنة قمرية وستة أشهر واثنا عشر يوماً. وتلخص دائرة المعارف الإسلامية الروايات الإسلامية عن هذا الوحي الأول وعن تجربة الوحي، وتضع إلى جانبها الرأي الأكاديمي القائل إن القصص التقليدية عن وحي أول مشكوك فيها."
  ur: "غارِ حرا میں نبی پر جبریل کا سورۃ العلق کی ابتدائی آیات کے ساتھ نزول، کتاب کی ترجیح کے مطابق پیر کی رات 21 رمضان، جو 10 اگست 610ء کے مطابق ہے، جب نبی کی عمر چالیس قمری سال، چھ ماہ اور بارہ دن تھی۔ دائرۃ المعارف الاسلامیہ اس پہلی وحی اور وحی کے تجربے کی اسلامی روایتیں خلاصے کے طور پر دیتی ہے اور ان کے ساتھ یہ علمی رائے رکھتی ہے کہ پہلی وحی کے روایتی قصے مشکوک ہیں۔"
