id: event/first-revelation
class: event
kind: revelation
label: { en: "The first revelation", ar: "بدء الوحي في غار حراء", es: "La primera revelación", fr: "La première révélation", ur: "پہلی وحی", tr: "Hira mağarasında vahyin başlangıcı", id: "Awal wahyu di gua Hira" }
summary:
  en: "The descent of Jibril upon the Prophet in the cave of Hira with the opening verses of surat al-Alaq, on the night of Monday 21 Ramadan in the book's preferred reckoning, corresponding to 10 August 610 CE, when the Prophet was forty lunar years, six months and twelve days old. The Encyclopaedia of Islam summarises the Muslim accounts of this first revelation and of the experience of wahy, and sets beside them the academic view that the traditional stories of a first revelation are doubtful."
  ar: "نزول جبريل على النبي في غار حراء بأوائل سورة العلق، ليلة الإثنين الحادي والعشرين من رمضان في ترجيح الكتاب، الموافق 10 أغسطس 610م، وعمره إذ ذاك أربعون سنة قمرية وستة أشهر واثنا عشر يوماً. وتلخص دائرة المعارف الإسلامية الروايات الإسلامية عن هذا الوحي الأول وعن تجربة الوحي، وتضع إلى جانبها الرأي الأكاديمي القائل إن القصص التقليدية عن وحي أول مشكوك فيها."
  ur: "غارِ حرا میں نبی پر جبریل کا سورۃ العلق کی ابتدائی آیات کے ساتھ نزول، کتاب کی ترجیح کے مطابق پیر کی رات 21 رمضان، جو 10 اگست 610ء کے مطابق ہے، جب نبی کی عمر چالیس قمری سال، چھ ماہ اور بارہ دن تھی۔ دائرۃ المعارف الاسلامیہ اس پہلی وحی اور وحی کے تجربے کی اسلامی روایتیں خلاصے کے طور پر دیتی ہے اور ان کے ساتھ یہ علمی رائے رکھتی ہے کہ پہلی وحی کے روایتی قصے مشکوک ہیں۔"
  es: "El descenso de Jibril sobre el Profeta en la cueva de Hira con los versículos iniciales de la sura al-Alaq, en la noche del lunes 21 de Ramadán según el cómputo preferido del libro, que corresponde al 10 de agosto del año 610 d. C., cuando el Profeta tenía cuarenta años lunares, seis meses y doce días. La Enciclopedia del Islam resume los relatos musulmanes de esta primera revelación y de la experiencia del wahy, y contrapone a ellos la opinión académica que considera dudosas las historias tradicionales de una primera revelación."
  fr: "La descente de Jibril sur le Prophète dans la grotte de Hira, accompagnée des premiers versets de la sourate al-Alaq, eut lieu la nuit du lundi 21 Ramadan selon le calendrier islamique, correspondant au 10 août 610 de l'ère chrétienne, alors que le Prophète était âgé de quarante années lunaires, six mois et douze jours. L'Encyclopédie de l'Islam résume les récits musulmans de cette première révélation et de l'expérience de la vision (wahy), et présente en parallèle l'opinion académique selon laquelle les récits traditionnels d'une première révélation sont sujets à caution."
  tr: "Cebrail'in, Peygamber Efendimiz'e Hira Mağarası'nda, Al-Alaq Suresi'nin ilk ayetleriyle birlikte inmesi, tercih edilen rivayete göre Ramazan ayının 21. Pazartesi gecesi, yani 10 Ağustos 610 milatından sonra, Peygamber Efendimiz kırk yaşında, altı aylık ve on iki günlükken gerçekleşmiştir. İslam Ansiklopedisi, bu ilk vahiy ve vahiy deneyimine dair İslami rivayetleri özetlerken, aynı zamanda ilk vahiy hakkındaki geleneksel anlatıların sorgulanabilir olduğu yönündeki akademik görüşü de sunmaktadır."
  id: "Turunnya Jibril kepada Nabi di Gua Hira dengan ayat-ayat pembuka Surah Al-Alaq, pada malam Senin, tanggal 21 Ramadan menurut riwayat yang lebih disukai, bertepatan dengan tanggal 10 Agustus 610 M, ketika beliau berusia empat puluh tahun lunar, enam bulan, dan dua belas hari. Ensiklopedia Islam merangkum narasi Islam tentang wahyu pertama ini dan pengalaman wahyu, sekaligus menyajikan pandangan akademis bahwa riwayat tradisional tentang wahyu pertama tersebut patut dipertanyakan."
