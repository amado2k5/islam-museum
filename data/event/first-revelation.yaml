label: { en: "The first revelation", ar: "بدء الوحي في غار حراء" }
summary:
  en: "The descent of Jibril upon the Prophet in the cave of Hira with the opening verses of surat al-Alaq — on the night of Monday 21 Ramadan in the book's preferred reckoning, corresponding to 10 August 610 CE, when the Prophet was forty lunar years, six months and twelve days old."
  ar: "نزول جبريل على النبي في غار حراء بأوائل سورة العلق — ليلة الإثنين الحادي والعشرين من رمضان في ترجيح الكتاب، الموافق 10 أغسطس 610م، وعمره إذ ذاك أربعون سنة قمرية وستة أشهر واثنا عشر يوماً."
