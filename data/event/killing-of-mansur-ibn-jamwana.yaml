id: event/killing-of-mansur-ibn-jamwana
class: event
kind: death
label: { ar: "قتل منصور بن جاونة بن الحارث", en: "The Killing of Mansur ibn Jamwana", es: "El asesinato de Mansur ibn Jamwana", fr: "Le meurtre de Mansur ibn Jamwana", ur: "منصور بن جموانہ کا قتل", tr: "Mansur ibn Jauna ibn el-Harith öldürüldü", id: "Mansur ibn Jauna ibn al-Harits terbunuh" }
summary:
  ar: "عند البلاذري عن أبي عمرو الباهلي وغيره: نُسب حصن منصور إلى منصور بن جاونة بن الحارث العامري من قيس لأنه تولى بناءه ومرمّته وكان مقيماً به أيام مروان ليردّ العدو ومعه جند كثيف من أهل الشام والجزيرة، وكان منصور هذا على أهل الرها حين امتنعوا في أول الدولة فحصرهم المنصور وهو عامل العباس على الجزيرة وأرمينية فلما فتحها هرب منصور ثم أُمن فظهر، فلما خلع عبد الله بن علي أبا جعفر المنصور ولّاه شرطته فلما هرب عبد الله إلى البصرة استخفى فدُلّ عليه في سنة 141 فأُتي المنصور به فقتله بالرقة منصرفه من بيت المقدس — وقوم يقولون إنه أُمن بعد هرب ابن علي فظهر ثم وُجدت له كتب إلى الروم بغشّ الإسلام فلما قدم المنصور الرقة من بيت المقدس سنة 141 وجّه من أتاه به فضرب عنقه بالرقة ثم انصرف إلى الهاشمية بالكوفة؛ وكان الرشيد بنى حصن منصور وشحنه في خلافة المهدي."
  en: "In al-Baladhuri from Abu Amr al-Bahili and others: Hisn Mansur is named for Mansur ibn Jamwana ibn al-Harith al-Amiri of Qays, who undertook its building and upkeep, being stationed there in Marwan's days with a dense Syrian and Jaziran host to repel the enemy; this Mansur was set over al-Ruha's people when they withheld in the dynasty's first days, whereupon al-Mansur besieged them — as al-Abbas's governor of the Jazira and Armenia — and when he took it Mansur fled, then was given aman and came out; when Abdallah ibn Ali deposed Abu Ja'far al-Mansur he made him chief of his police, and when Abdallah fled to Basra he went into hiding, was betrayed in year 141, brought before al-Mansur and killed at al-Raqqa as the caliph returned from Bayt al-Maqdis — others say he was amaned after Ibn Ali's flight, appeared, and was then found to have letters to the Romans betraying Islam, so when al-Mansur reached al-Raqqa from Bayt al-Maqdis in year 141 he sent for him and struck off his head there before departing for al-Hashimiyya at Kufa; al-Rashid had built and garrisoned Hisn Mansur in al-Mahdi's caliphate."
  es: "En al-Baladhuri de Abu Amr al-Bahili y otros: Hisn Mansur recibe su nombre de Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, quien emprendió su construcción y mantenimiento, estando allí destinado en los días de Marwan con un denso ejército sirio y yazireño para repeler al enemigo; este Mansur fue puesto sobre el pueblo de al-Ruha cuando se resistieron en los primeros días de la dinastía, entonces al-Mansur los sitió —como gobernador de al-Abbas de Jazira y Armenia— y cuando lo tomó Mansur huyó, luego se le dio un aman y salió; Cuando Abdallah ibn Ali depuso a Abu Ja'far al-Mansur, lo nombró jefe de su policía, y cuando Abdallah huyó a Basora, se escondió, fue traicionado en el año 141, llevado ante al-Mansur y asesinado en al-Raqqa cuando el califa regresaba de Bayt al-Maqdis. Otros dicen que fue amonizado después de la huida de Ibn Ali, apareció y luego se descubrió que tenía cartas a los romanos traicionando al Islam, así que cuando al-Mansur llegó a al-Raqqa desde Bayt al-Maqdis en el año 141, lo mandó llamar y le cortó la cabeza allí antes de partir hacia al-Hashimiyya en Kufa; al-Rashid había construido y guarnecido Hisn Mansur en el califato de al-Mahdi."
  fr: "Dans al-Baladhuri d'après Abu Amr al-Bahili et autres: Hisn Mansur tire son nom de Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, qui entreprit sa construction et son entretien, étant stationné là à l'époque de Marwan avec une importante armée syrienne et jaziréenne pour repousser l'ennemi; ce Mansur fut placé à la tête du peuple d'al-Ruha lorsqu'ils résistèrent dans les premiers jours de la dynastie, après quoi al-Mansur les assiégea — en tant que gouverneur d'al-Abbas de la Jazira et de l'Arménie — et lorsqu'il s'en empara, Mansur s'enfuit, puis reçut l'aman et sortit; Lorsqu'Abdallah ibn Ali déposa Abu Ja'far al-Mansur, il le nomma chef de sa police. Après sa fuite à Bassora, Abdallah se cacha, mais fut trahi en l'an 141. Il fut amené devant al-Mansur et tué à Raqqa au retour du calife de Bayt al-Maqdis. D'autres affirment qu'il fut amaned après la fuite d'Ibn Ali, qu'il réapparut et qu'on découvrit alors qu'il était en possession de lettres destinées aux Romains, trahissant l'islam. Ainsi, lorsqu'al-Mansur arriva à Raqqa depuis Bayt al-Maqdis en l'an 141, il le fit venir et le décapita avant de partir pour al-Hashimiyya à Kufa. Al-Rashid avait construit et garnisonné Hisn Mansur dans le califat d'al-Mahdi."
  ur: "البلادھوری میں ابو عمرو الباہلی اور دیگر سے: حسن منصور کا نام قیس کے منصور بن جموانہ بن الحارث العمیری کے نام پر رکھا گیا ہے، جس نے اس کی تعمیر اور دیکھ بھال کا کام کیا، مروان کے دنوں میں دشمن کو پسپا کرنے کے لیے ایک گھنے شامی اور جزیران کے لشکر کے ساتھ وہاں تعینات کیا گیا تھا۔ اس منصور کو الروحہ کے لوگوں پر مقرر کیا گیا تھا جب وہ خاندان کے پہلے دنوں میں روکے ہوئے تھے، اس کے بعد المنصور نے ان کا محاصرہ کیا - جیسا کہ العباس کے جزیرہ اور آرمینیا کے گورنر - اور جب اس نے اسے لیا تو منصور بھاگ گیا، پھر امان دیا گیا اور باہر نکل آیا؛ جب عبداللہ ابن علی نے ابو جعفر المنصور کو معزول کیا تو اس نے انہیں اپنی پولیس کا سربراہ بنایا، اور جب عبداللہ بصرہ فرار ہو گئے تو وہ روپوش ہو گئے، 141 میں اسے دھوکہ دیا گیا، المنصور کے سامنے لایا گیا اور رقہ میں قتل کر دیا گیا جب خلیفہ بیت المقدس سے واپس آیا تھا- دوسروں کا کہنا ہے کہ میں نے علی کو خط بھیجنے کے بعد خط لکھا تھا، جس کے بعد مجھے خط ملا۔ رومیوں کو اسلام سے غداری کی، چنانچہ جب المنصور 141 میں بیت المقدس سے الرقہ پہنچا تو اس نے اسے بلوایا اور کوفہ میں الہاشمیہ کے لیے روانہ ہونے سے پہلے وہاں اس کا سر مار دیا۔ الرشید نے المہدی کی خلافت میں حسن منصور کو تعمیر کیا تھا اور اس کی حفاظت کی تھی۔"
  tr: "El-Baladhuri'ye göre, Ebu Amr el-Bahili ve diğerlerinin rivayetine dayanarak: Mansur kalesi, Kayslı Mansur bin Cevna bin El-Harit el-Amiri'ye atfedilir; çünkü kalenin inşası ve onarımından o sorumluydu ve Mervan günlerinde düşmanı püskürtmek için orada bulunuyordu ve yanında Levant ve Cezire halkından büyük bir ordu vardı. Bu Mansur, devletin başlangıcında Edessa halkı direndiğinde onların sorumluluğunu üstlenmişti; bu yüzden Cezire ve Ermenistan'ın Abbasi valisi olan El-Mansur onları kuşattı. Onları fethettiğinde Mansur kaçtı, sonra kendisine güvenlik sağlandı ve ortaya çıktı. Abdullah bin Ali, Ebu Cafer el-Mansur'u görevden aldığında, onu polisi olarak atadı. Abdullah Basra'ya kaçtığında saklandı ve 141 yılında ona gösterildi. Böylece Mansur ona getirildi ve Kudüs'ten dönüşünde Rakka'da onu öldürdü. Bazı kişiler İbn Ali kaçtıktan sonra ona koruma sağlandığını, sonra ortaya çıktığını ve Romalılara İslam'ı aldatmakla suçlayan mektuplar bulunduğunu söylüyor. Mansur 141 yılında Kudüs'ten Rakka'ya geldiğinde, onu ona getiren birini gönderdi ve Rakka'da başını kesti, sonra Kufa'daki Haşimiye'ye döndü. Raşid, Mansur'un kalesini inşa etti ve Mehdi'nin halifeliği döneminde kaleyi doldurdu."
  id: "Menurut Al-Baladhuri, berdasarkan riwayat Abu Amr Al-Bahili dan lainnya: Benteng Mansur dikaitkan dengan Mansur bin Jawna bin Al-Harith Al-Amiri dari Qais, karena ia bertanggung jawab atas pembangunan dan perbaikannya, dan ia tinggal di sana selama masa Marwan untuk mengusir musuh, dan bersamanya ada pasukan besar dari penduduk Levant dan Jazira. Mansur ini bertanggung jawab atas penduduk Edessa ketika mereka menolak pada awal berdirinya negara, sehingga Al-Mansur, yang merupakan gubernur Abbasiyah di Jazira dan Armenia, mengepung mereka. Setelah menaklukkannya, Mansur melarikan diri, kemudian ia diberi perlindungan dan muncul kembali. Ketika Abdullah bin Ali menggulingkan Abu Jaafar Al-Mansur, ia mengangkatnya sebagai polisi. Ketika Abdullah melarikan diri ke Basra, ia bersembunyi, dan ia diperlihatkan kepadanya pada tahun 141, sehingga Al-Mansur dibawa kepadanya dan ia membunuhnya di Raqqa saat kembali dari Yerusalem — dan beberapa orang mengatakan bahwa ia diberi perlindungan setelah Ibn Ali melarikan diri, kemudian ia muncul, lalu ditemukan surat-surat yang ditujukan kepadanya kepada orang Romawi yang menuduhnya menipu Islam. Ketika Al-Mansur datang ke Raqqa dari Yerusalem pada tahun 141, ia mengirim seseorang yang membawanya kepadanya, sehingga ia memenggal kepalanya di Raqqa, kemudian ia kembali ke Al-Hashimiyya di Kufa. Al-Rashid membangun benteng Mansur dan mempersenjatainya selama kekhalifahan Al-Mahdi."
