label: { ar: "وقعة الأرك" }
summary:
  ar: "وقعة الأرك الشهيرة: لما انقضت مدة الهدنة خرجت طائفة من الإفرنج إلى بلاد المسلمين فنهبوا وعاثوا، فجاز السلطان الموحدي يعقوب المنصور إلى الأندلس سنة إحدى وتسعين وخمسمائة وقيل إنه لما أراد الحواز من مدينة سلا مرض مرضاً شديداً يئس منه أطباؤه فعاث الأذفونش وانتهز الفرصة، فكان المصاف شمالي قرطبة على قرب قلعة رباح يوم الخميس تاسع شعبان سنة ٥٩١، وجعل يعقوب مكانه تحت الأعلام السلطانية الشيخ أبا يحيى بن أبي حفص فقصد الإفرنج الأعلام ظناً أن السلطان تحتها فأثروا في المسلمين أثراً قبيحاً واستُشهد جمع كبير، حتى أشرف عليهم يعقوب بعد كسر شوكتهم فهزمهم شر هزيمة وهرب الأذفونش في طائفة يسيرة، وحكي أن ما حصل لبيت المال من دروع الإفرنج ستون ألفاً وأما الدواب على اختلاف أنواعها فلم يُحصر لها عدد، ولم يُسمع بعد وقعة الزلاقة بمثلها وربما صرح بعض المؤرخين بأنها أعظم من الزلاقة، ثم لحق الفلُّ بقلعة رباح فحاصرها يعقوب حتى أخذها وحاصر طليطلة وقطع أشجارها وخرب نواحيها وهدم أسوارها ورجع إلى إشبيلية، ثم عاد سنة ٥٩٣ ففعل في بلاد الفرنج الأفاعيل حتى طلبوا الصلح {cite:nafh-tib-maqqari p. 381-382}."
  en: "The famous Battle of al-Arak (Alarcos): after the truce lapsed and the Franks raided, the Almohad sultan Ya'qub al-Mansur crossed to al-Andalus in 591; the armies met north of Cordoba near Qal'at Rabah on Thursday 9 Sha'ban, the Franks charged the sultan's flags held by Abu Yahya ibn Abi Hafs — a decoy — then al-Mansur broke them utterly; sixty thousand Frankish mail-coats entered the treasury and chroniclers ranked it with or above Zallaqa {cite:nafh-tib-maqqari p. 381-382}."
