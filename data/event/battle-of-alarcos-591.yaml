summary:
  ar: "يروي ابن الأثير أن الفنش ملك الفرنج كتب إلى يعقوب كتاب تحدٍ عظيم يستفزه فيه إلى القتال ويعتذر عنه بأن يعبر إليه بحملته ليبارزه في أعز الأماكن عنده، فكتب يعقوب في أعلى كتابه آية النمل — ارجع إليهم فلنأتينهم بجنود لا قبل لهم بها — وأعاده إليه وجمع العساكر وعبر المجاز {cite:kamil-ibn-al-athir p. 236-237}. وقعة الأرك الشهيرة: لما انقضت مدة الهدنة خرجت طائفة من الإفرنج إلى بلاد المسلمين فنهبوا وعاثوا، فجاز السلطان الموحدي يعقوب المنصور إلى الأندلس سنة إحدى وتسعين وخمسمائة وقيل إنه لما أراد الحواز من مدينة سلا مرض مرضاً شديداً يئس منه أطباؤه فعاث الأذفونش وانتهز الفرصة، فكان المصاف شمالي قرطبة على قرب قلعة رباح يوم الخميس تاسع شعبان سنة ٥٩١، وجعل يعقوب مكانه تحت الأعلام السلطانية الشيخ أبا يحيى بن أبي حفص فقصد الإفرنج الأعلام ظناً أن السلطان تحتها فأثروا في المسلمين أثراً قبيحاً واستُشهد جمع كبير، حتى أشرف عليهم يعقوب بعد كسر شوكتهم فهزمهم شر هزيمة وهرب الأذفونش في طائفة يسيرة، وحكي أن ما حصل لبيت المال من دروع الإفرنج ستون ألفاً وأما الدواب على اختلاف أنواعها فلم يُحصر لها عدد، ولم يُسمع بعد وقعة الزلاقة بمثلها وربما صرح بعض المؤرخين بأنها أعظم من الزلاقة، ثم لحق الفلُّ بقلعة رباح فحاصرها يعقوب حتى أخذها وحاصر طليطلة وقطع أشجارها وخرب نواحيها وهدم أسوارها ورجع إلى إشبيلية، ثم عاد سنة ٥٩٣ ففعل في بلاد الفرنج الأفاعيل حتى طلبوا الصلح {cite:nafh-tib-maqqari p. 381-382}. ونجا الأذفونش ملك النصارى إلى طليطلة في أسول حال فحلق رأسه ولحيته ونكس صليبه وآلى أن لا ينام على فراش ولا يقرب النساء ولا يركب فرساً ولا دابة حتى يأخذ بالثأر، وساق يعقوب خلفه إلى طليطلة وحاصرها ورمى عليها بالمجانيق وضيق عليها حتى لم يبق إلا فتحها فخرجت إليه والدة الأذفونش وبناته ونساؤه يبكين بين يديه وسألنه إبقاء البلد عليهن فرق لهن ومن عليهن بها ووهب لهن من الأموال والجواهر ما جل وردهن مكرمات وعفا بعد القدرة {cite:nafh-tib-maqqari p. 479-480}."
  en: "The famous Battle of al-Arak (Alarcos): after the truce lapsed and the Franks raided, the Almohad sultan Ya'qub al-Mansur crossed to al-Andalus in 591; the armies met north of Cordoba near Qal'at Rabah on Thursday 9 Sha'ban, the Franks charged the sultan's flags held by Abu Yahya ibn Abi Hafs — a decoy — then al-Mansur broke them utterly; sixty thousand Frankish mail-coats entered the treasury and chroniclers ranked it with or above Zallaqa {cite:nafh-tib-maqqari p. 381-382}."
  fr: "La célèbre bataille d'al-Arak (Alarcos) : à l'expiration de la trêve, les Francs lancèrent des raids, et le sultan almohade Ya'qub al-Mansur passa en al-Andalus en 591 ; les armées se rencontrèrent au nord de Cordoue près de Qal'at Rabah le jeudi 9 Sha'ban ; les Francs chargèrent les étendards du sultan tenus par Abu Yahya ibn Abi Hafs, un leurre, puis al-Mansur les brisa complètement ; soixante mille cottes de mailles franques entrèrent au trésor, et les chroniqueurs la placèrent à l'égal de Zallaqa, voire au-dessus {cite:nafh-tib-maqqari p. 381-382}."
  es: "La famosa batalla de al-Arak (Alarcos): después de que la tregua expiró y los francos saquearon, el sultán almohade Ya'qub al-Mansur cruzó a al-Ándalus en 591; los ejércitos se encontraron al norte de Córdoba cerca de Qal'at Rabah el jueves 9 de Sha'ban, los francos cargaron contra las banderas del sultán sostenidas por Abu Yahya ibn Abi Hafs —un señuelo— luego al-Mansur las rompió por completo; sesenta mil cotas de malla francas entraron en el tesoro y los cronistas lo clasificaron al mismo nivel o por encima de Zallaqa {cite:nafh-tib-maqqari p. 381-382}."
  ur: "مشہور جنگ العرک ⁦(الارکوس)⁩: جنگ بندی ختم ہونے اور فرینکوں کے چھاپے کے بعد، المحدث سلطان یعقوب المنصور 591 میں اندلس کی طرف بڑھے۔ فوجیں قرطبہ کے شمال میں قلات رباح کے قریب جمعرات 9 شعبان کو ملیں، فرانکس نے ابو یحییٰ بن ابی حفص کے ہاتھوں میں رکھے ہوئے سلطان کے جھنڈوں کو چارج کر دیا جو کہ ایک فریب ہے، پھر المنصور نے انہیں بالکل توڑ دیا۔ خزانے میں ساٹھ ہزار فرینکش میل کوٹ داخل ہوئے اور تاریخ نگاروں نے اسے ذالقع یا اس سے اوپر درجہ دیا۔ 381-382}۔"
  tr: "İbn el-Athir, Frank kralının Yaqub'a büyük bir meydan okuma mektubu yazdığını, onu savaşa kışkırttığını ve ordusuyla birlikte en değerli yerlerinde onunla düello yapmak için karşıya geçmeyi teklif ettiğini anlatır. Bunun üzerine Yaqub mektubunun başına karıncanın şu dizesini yazdı: \"Onlara geri dönün, çünkü onlara karşı koyamayacakları askerlerle geleceğiz.\" Ve mektubu ona geri verdi, birliklerini topladı ve geçidi geçti. {kaynak: İbn el-Athir, s. 236-237}. Ünlü Alarcos Savaşı: Ateşkes sona erdiğinde, bir grup Frank Müslüman topraklarını işgal ederek yağma ve yıkım yaptı. Almohad Sultanı Yaqub el-Mansur, Hicri 591 yılında (Miladi 1190) Endülüs'e girdi. Salé şehrinden ayrılmak üzereyken ağır hastalandığı ve doktorlarının iyileşmesinden umudu kestiği söylenir. Alfonso fırsatı değerlendirdi ve savaş, Hicri 591 yılının Şaban ayının dokuzuncu Perşembe günü (Miladi 1190) Kurtuba'nın kuzeyinde, Rabah kalesi yakınlarında gerçekleşti. Yakub, Şeyh Ebu Yahya ibn Abi Hafs'ı kraliyet sancaklarının altına yerleştirdi. Sultanın kendilerinden aşağıda olduğunu düşünen Franklar, sancaklara doğru hücum ederek Müslümanlara korkunç kayıplar verdirdiler. Çok sayıda kişi şehit oldu. Yakub, güçlerini kırdıktan sonra onları alt etti ve kesin bir şekilde mağlup etti. Alfonso küçük bir kuvvetle kaçtı. Hazinenin altmış bin Frank kalkanı aldığı ve her türden hayvanın sayısının sayısız olduğu söylenir. Zallaqa Savaşı'ndan beri böyle bir savaş duyulmamıştı ve bazı tarihçiler bu savaşı Zallaqa Savaşı'ndan bile daha büyük ilan etmişlerdir. Zallaqa, ardından Al-Fal, Rabah Kalesi'ni takip etti; bu yüzden Yaqub kaleyi kuşattı ve ele geçirdi. Ardından Toledo'yu kuşattı, ağaçlarını kesti, çevresini tahrip etti, surlarını yıktı ve Sevilla'ya döndü. Sonra 593 yılında geri döndü ve Frank topraklarında korkunç şeyler yaptı, ta ki barış isteyene kadar. {cite:nafh-tib-maqqari s. 381-382}. Hristiyan kral Alfonso, korkunç bir halde Toledo'ya kaçtı. Saçını ve sakalını tıraş etti, haçını indirdi ve intikamını alana kadar yatakta uyumayacağına, kadınlara yaklaşmayacağına, ata veya hayvana binmeyeceğine yemin etti. Yakup'u Toledo'ya gönderdi, şehri kuşattı ve mancınıklarla bombaladı, kuşatmayı sıkılaştırdı ve sonunda şehrin ele geçirilmesinden başka bir şey kalmadı. Sonra Alfonso'nun annesi, kızları ve eşleri ağlayarak onun önüne çıktılar ve şehri kendileri için bağışlamasını istediler. Onlara acıdı, onlara para ve mücevher hediye etti, onları onurlandırarak geri gönderdi ve cezalandırma gücüne sahip olduğu halde onları affetti. {cite:nafh-tib-maqqari s. 479-480}"
  id: "Ibn al-Athir menceritakan bahwa raja Frank menulis surat kepada Yaqub yang berisi tantangan besar, memprovokasinya untuk berperang dan menawarkan untuk menyeberangi jalan dengan pasukannya untuk berduel dengannya di tempat-tempat yang paling berharga baginya. Maka Yaqub menulis di bagian atas suratnya ayat tentang semut — Kembalilah kepada mereka, karena kami akan datang kepada mereka dengan tentara yang tidak dapat mereka lawan — dan mengembalikannya kepada raja Frank, mengumpulkan pasukan, dan menyeberangi celah gunung {kutip: kamil-ibn-al-athir hlm. 236-237}. Pertempuran Alarcos yang terkenal: Ketika gencatan senjata berakhir, sekelompok orang Frank menyerbu tanah Muslim, menjarah dan menimbulkan malapetaka. Sultan Almohad Yaqub al-Mansur menyeberang ke Andalusia pada tahun 591 H (1190 M). Dikatakan bahwa ketika ia hendak berangkat dari kota Salé, ia jatuh sakit parah, dan para dokternya putus asa akan kesembuhannya. Alfonso memanfaatkan kesempatan itu, dan pertempuran terjadi di utara Cordoba, dekat benteng Rabah, pada hari Kamis, tanggal sembilan Sya'ban, 591 H (1190 M). Yaqub menempatkan Syekh Abu Yahya ibn Abi Hafs di tempatnya di bawah panji-panji kerajaan. Orang-orang Frank, yang mengira Sultan berada di bawah mereka, menyerbu ke arah panji-panji dan menimbulkan kerugian besar pada kaum Muslim. Sejumlah besar orang gugur sebagai syuhada. Yaqub, setelah mematahkan kekuatan mereka, mengalahkan mereka dan menaklukkan mereka secara telak. Alfonso melarikan diri dengan pasukan kecil. Dikatakan bahwa perbendaharaan menerima enam puluh ribu perisai Frank, dan jumlah hewan dari segala jenis tak terhitung. Belum pernah terdengar peristiwa serupa sejak Pertempuran Zallaqa, dan beberapa sejarawan bahkan menyatakan bahwa pertempuran ini lebih besar daripada Pertempuran Zallaqa. Zallaqa, kemudian Al-Fal mengikuti Kastil Rabah, sehingga Yaqub mengepungnya sampai ia merebutnya dan mengepung Toledo, menebang pohon-pohonnya, menghancurkan sekitarnya, meruntuhkan tembok-temboknya, dan kembali ke Sevilla. Kemudian ia kembali pada tahun 593 dan melakukan hal-hal mengerikan di tanah-tanah Frank sampai mereka meminta perdamaian. {cite:nafh-tib-maqqari hlm. 381-382}. Alfonso, raja Kristen, melarikan diri ke Toledo dalam keadaan yang mengerikan. Ia mencukur kepala dan janggutnya, menurunkan salibnya, dan bersumpah untuk tidak tidur di tempat tidur, tidak mendekati wanita, tidak menunggang kuda atau hewan sampai ia membalas dendam. Ia mengirim Yakub untuk mengejarnya ke Toledo, mengepungnya, dan membombardirnya dengan ketapel, memperketat pengepungan sampai tidak ada yang tersisa selain penaklukannya. Kemudian ibu, anak perempuan, dan istri-istri Alfonso keluar menemuinya sambil menangis dan memintanya untuk menyelamatkan kota itu untuk mereka. Dia merasa kasihan kepada mereka dan memberi mereka hadiah berupa uang dan perhiasan, lalu mengembalikan mereka dengan kehormatan dan mengampuni mereka setelah memiliki kekuasaan untuk menghukum mereka. {cite:nafh-tib-maqqari p. 479-480}"
