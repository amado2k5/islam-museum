label:
  ar: "وفاة الحاكم النيسابوري، ٣ صفر ٤٠٥هـ"
  en: "Death of al-Hakim al-Nisaburi, 3 Safar 405/1014"
  ur: "حاکم نیشاپوری کی وفات، 3 صفر 405ھ/1014ء"
  es: "Muerte de al-Hakim al-Nisaburi, 3 de Safar de 405/1014"
  fr: "Mort d'al-Hakim al-Nisaburi, le 3 Safar 405/1014"
  tr: "Nişapur valisinin ölümü, Hicri 405 yılının 3 Safer günü."
  id: "Wafatnya gubernur Nishapur, 3 Safar 405 Hijriah"
summary:
  ar: "دخل الحاكم الحمام واغتسل وخرج ثم قال «آه» فقبضت روحه وهو متزر لم يلبس قميصه بعد، ودفن بعد العصر يوم الأربعاء وصلى عليه القاضي أبو بكر الجيري؛ توفي يوم الثلاثاء ثالث صفر سنة خمس وأربعمائة، وفي تاريخ الإسلام ثامنه، وقال الخليلي سنة ثلاث وأربعمائة وهو وهم {cite:tarikh-islam-dhahabi pp. 129-130} {cite:wafayat-ayan}."
  en: "Al-Hakim entered the bathhouse, washed and came out, said 'ah' — and his soul was taken while he was still wrapped in his waist-cloth before he had put on his shirt; he was buried after the 'asr prayer on Wednesday and the qadi Abu Bakr al-Jiri led his funeral prayer. He died on Tuesday 3 Safar 405/1014 — Tarikh al-Islam gives the 8th of Safar, and al-Khalili's dating to 403 is an error {cite:tarikh-islam-dhahabi pp. 129-130} {cite:wafayat-ayan}."
  ur: "حاکم حمام میں گئے، غسل کیا اور نکلے تو «آہ» کہا اور ان کی روح قبض ہو گئی جب وہ ابھی تہبند باندھے ہوئے تھے اور قمیص نہیں پہنی تھی؛ بدھ کو نمازِ عصر کے بعد دفن ہوئے اور قاضی ابو بکر جیری نے نمازِ جنازہ پڑھائی۔ وفات منگل کے روز 3 صفر 405ھ/1014ء ہوئی — تاریخ الاسلام میں 8 صفر مذکور ہے اور خلیلی کی 403ھ والی تاریح غلط ہے {cite:tarikh-islam-dhahabi pp. 129-130} {cite:wafayat-ayan}۔"
  es: "Al-Hakim entró en el baño, se lavó y salió, dijo 'ah', y su alma fue tomada mientras aún estaba envuelto en su taparrabos antes de que se hubiera puesto la camisa; fue enterrado después de la oración 'asr del miércoles y el cadí Abu Bakr al-Jiri dirigió su oración fúnebre. Murió el martes 3 de Safar 405/1014; Tarikh al-Islam da el 8 de Safar, y la datación de al-Khalili en 403 es un error {cite:tarikh-islam-dhahabi pp. 129-130} {cite:wafayat-ayan}."
  fr: "Al-Hakim entra dans le bain public, se lava, puis sortit en prononçant « ah ». Son âme s'éteignit alors qu'il était encore enveloppé dans son pagne, avant même d'avoir revêtu sa chemise. Il fut enterré après la prière de l'après-midi du mercredi, et le cadi Abu Bakr al-Jiri dirigea la prière funéraire. Il mourut le mardi 3 Safar 405/1014 (Tarikh al-Islam indique le 8 Safar, et la datation de 403 par al-Khalili est erronée)."
  tr: "Vali hamama girdi, yıkandı ve çıktı. Sonra \"Ah\" dedi ve henüz gömleğini giymemiş, sadece belinde bir bez parçası varken ruhu alındı. Çarşamba günü ikindi namazından sonra defnedildi ve Kadı Ebu Bekir el-Ciri onun için dua etti. Hicri 405 yılının Safer ayının üçüncü günü, Salı günü vefat etti ve İslam tarihinde sekizinci olarak geçmektedir. El-Halili ise Hicri 403 yılını belirtmiştir ki bu bir hatadır. {kaynak:tarikh-islam-dhahabi s. 129-130} {kaynak:wafayat-ayan}."
  id: "Gubernur itu memasuki pemandian umum, mandi, dan keluar. Kemudian dia berkata, \"Ah,\" dan jiwanya diambil ketika dia masih mengenakan cawat dan belum mengenakan bajunya. Dia dimakamkan setelah salat Ashar pada hari Rabu, dan Hakim Abu Bakr al-Jiri mendoakannya. Dia wafat pada hari Selasa, tanggal 3 Safar, tahun 405 Hijriah, dan dalam Sejarah Islam itu adalah tahun kedelapan. Al-Khalili mengatakan tahun 403 Hijriah, yang merupakan kesalahan. {cite:tarikh-islam-dhahabi hlm. 129-130} {cite:wafayat-ayan}."
