label: { en: "Expedition of Buwat", ar: "غزوة بواط", es: "Expedición de Buwat", fr: "Expédition de Buwat", ur: "بوات کی مہم", tr: "Buwat Muharebesi", id: "Pertempuran Buwat" }
summary:
  en: "An expedition led by the Prophet in Rabi' al-Awwal 2 AH with 200 companions to intercept a Quraysh caravan led by Umayya ibn Khalaf; reached Mount Buwat without encounter."
  ar: "غزوة قادها النبي في مائتي رجل من المهاجرين في ربيع الأول 2هـ لاعتراض قافلة لأمية بن خلف في مائة من قريش وألفين وخمسمائة بعير، فبلغ جبل بواط ورجع دون قتال."
  es: "Una expedición liderada por el Profeta en Rabi' al-Awwal 2 AH con 200 compañeros para interceptar una caravana Quraysh liderada por Umayya ibn Khalaf; llegaron al Monte Buwat sin encontrar ningún enemigo."
  fr: "Une expédition menée par le Prophète en Rabi' al-Awwal 2 AH avec 200 compagnons pour intercepter une caravane Quraysh dirigée par Umayya ibn Khalaf; atteignit le mont Buwat sans rencontre."
  ur: "ربیع الاول 2 ہجری میں نبی کی قیادت میں 200 صحابہ کے ساتھ امیہ بن خلف کی قیادت میں قریش کے قافلے کو روکنے کے لیے ایک مہم؛ بغیر کسی مقابلے کے کوہ بوات پہنچ گئے۔"
  tr: "Peygamberimiz, Hicri 2. Rabiü'l-Evvel ayında, Muhacirlerden iki yüz adamla birlikte, Ümeyye bin Halef'in Kureyş'ten yüz adamı ve iki bin beş yüz deveden oluşan kervanını durdurmak için bir baskın düzenledi. Cebel-i Buvat'a kadar ulaştı ve savaşmadan geri döndü."
  id: "Sebuah serangan yang dipimpin oleh Nabi dengan dua ratus orang dari kaum Muhajirin pada bulan Rabi' al-Awwal 2 H untuk mencegat kafilah Umayyah bin Khalaf dengan seratus orang dari kaum Quraisy dan dua ribu lima ratus unta. Beliau sampai di Jabal Buwat dan kembali tanpa pertempuran."
