label: { ar: "فتنة الحنابلة والأشاعرة بدمشق 835هـ", en: "The Hanbali-Ash'ari Fitna at Damascus, 835", es: "La Fitna Hanbali-Ash'ari en Damasco, 835", fr: "La Fitna Hanbali-Ash'ari à Damas, 835", ur: "حنبلی اشعری فتنہ دمشق، 835", tr: "Hicri 835 yılında Şam'da Hanbeliler ve Eş'ariler arasında yaşanan çatışma.", id: "Konflik antara mazhab Hanbali dan Asy'ari di Damaskus pada tahun 835 Hijriah." }
summary:
  ar: "في شذرات الذهب عن ابن حجر سنة خمس وثلاثين وثمان مئة ثارت فتنة عظيمة بين الحنابلة والأشاعرة بدمشق وتعصب الشيخ علاء الدين البخاري نزيل دمشق على الحنابلة وبالغ في الحط على ابن تيمية وصرح بتكفيره فتعصب جماعة من الدماشقة لابن تيمية وصنف الحافظ شمس الدين بن ناصر الدين جزءاً في فضل ابن تيمية وسرد أسماء من أثنى عليه وعظمه من أهل عصره فمن بعدهم على حروف المعجم مبيناً لكلامهم وأرسله إلى القاهرة فكتب عليه غالب المصريين التصويب وخالفوا علاء الدين البخاري في إطلاق القول بتكفيره وتكفير من أطلق عليه أنه شيخ الإسلام وخرج مرسوم السلطان بأن كل أحد لا يعترض على مذهب غيره ومن أظهر شيئاً مجمعاً عليه سُمع منه وسكن الأمر {cite:shadharat-dhahab p. 222-223}."
  en: "835: a great fitna flared at Damascus between Hanbalis and Ash'aris — Ala' al-Din al-Bukhari openly declared takfir of Ibn Taymiyya; Damascenes rallied to him; Ibn Nasir al-Din composed a fascicle of his praisers which Cairo's scholars endorsed; and a sultanic decree forbade impugning another's madhhab until the matter subsided {cite:shadharat-dhahab p. 222-223}."
  es: "835: una gran fitna estalló en Damasco entre hanbalíes y ash'aris: Ala' al-Din al-Bukhari declaró abiertamente takfir a Ibn Taymiyya; los damascenos se unieron a él; Ibn Nasir al-Din compuso un fascículo de sus elogiadores que los eruditos de El Cairo respaldaron; y un decreto sultánico prohibió impugnar la madhhab de otro hasta que el asunto se calmara {cite:shadharat-dhahab p. 222-223}."
  fr: "835: une grande fitna éclata à Damas entre les Hanbalites et les Ash'arites — Ala' al-Din al-Bukhari déclara ouvertement takfir d'Ibn Taymiyya; les Damascènes se rallièrent à lui; Ibn Nasir al-Din composa un fascicule de ses louanges que les savants du Caire approuvèrent; et un décret sultan interdit de contester le madhhab d'autrui jusqu'à ce que la question soit apaisée {cite: shadharat-dhahab p. 222-223}."
  ur: "835: حنبلیوں اور اشعریوں کے درمیان دمشق میں ایک زبردست فتنہ بھڑک اٹھا - علاء الدین البخاری نے کھلم کھلا ابن تیمیہ کی تکفیر کا اعلان کیا۔ دمشقین اس کے پاس آئے۔ ابن ناصر الدین نے اپنے مدح سرائیوں کا ایک فقرہ بنایا جس کی قاہرہ کے علماء نے تائید کی۔ اور ایک سلطانی فرمان میں کسی دوسرے کے مذھب کی تذلیل کرنے سے منع کیا گیا جب تک کہ معاملہ رفع نہ ہو جائے۔ 222-223}۔"
  tr: "İbn Hacer'in rivayetine göre, Şadharat el-Dhahab'da, Hicri 835 yılında Şam'da Hanbeliler ve Eş'ariler arasında büyük bir çekişme çıktı. Şam'da ikamet eden Şeyh Ala' el-Din el-Buhari, Hanbelilere karşı fanatikleşti ve İbn Teymiye'yi eleştirmede aşırıya kaçarak onu kâfir ilan etti. Şamlılardan bir grup ise İbn Teymiye'yi fanatik bir şekilde desteklemeye başladı. El-Hafız Şems el-Din ibn Nasir el-Din, İbn Teymiye'nin faziletleri üzerine bir risale yazdı ve onun zamanından ve ondan sonra gelenlerden onu öven ve saygı gösterenlerin isimlerini alfabetik harflere göre sıralayarak sözlerini açıkladı. Bunu Kahire'ye gönderdi ve Mısırlıların çoğu bunu destekleyen yazılar yazdı ve Ala' al-Din al-Bukhari'nin onu kâfir ilan etmesine ve onu İslam Şeyhi diye adlandıranları kâfir ilan etmesine karşı çıktı. Sultan, kimsenin başkasının öğretisine itiraz etmemesi ve üzerinde ittifak edilmiş bir şeyi ortaya koyan herkesin dinlenmesi gerektiğine dair bir ferman yayınladı ve mesele çözüldü. {kaynak: Shadharat-dhahab s. 222-223}"
  id: "Dalam kitab Shadharat al-Dhahab, berdasarkan riwayat Ibnu Hajar, pada tahun 835 H, terjadi perselisihan besar antara mazhab Hanbali dan Asy'ari di Damaskus. Syekh Ala' al-Din al-Bukhari, yang tinggal di Damaskus, menjadi fanatik terhadap mazhab Hanbali dan sangat keras mengkritik Ibnu Taymiyyah serta menyatakannya sebagai kafir. Sekelompok penduduk Damaskus menjadi fanatik dalam mendukung Ibnu Taymiyyah. Al-Hafiz Shams al-Din ibn Nasir al-Din menulis sebuah risalah tentang keutamaan Ibnu Taymiyyah dan mencantumkan nama-nama orang yang memuji dan menghormatinya sejak zamannya dan orang-orang yang datang setelahnya, sesuai dengan huruf-huruf alfabet, serta menjelaskan ucapan mereka. Dia mengirimkannya ke Kairo, dan sebagian besar orang Mesir menulis dukungan terhadapnya dan tidak setuju dengan Ala' al-Din al-Bukhari yang menyatakan dia sebagai kafir dan menyatakan sebagai kafir orang-orang yang menyebutnya sebagai Syekh Islam. Sultan mengeluarkan dekrit bahwa tidak seorang pun boleh menentang ajaran orang lain, dan siapa pun yang mengungkapkan sesuatu yang disepakati harus didengarkan darinya, dan masalah itu pun terselesaikan. {cite:shadharat-dhahab hlm. 222-223}."
