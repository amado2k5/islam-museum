id: event/the-people-wonder-at-al-hadis-steadfastness-and-his-prayer-in-battle-288
class: event
kind: other
label:
  ar: "الناس يعجبون من صبر الهادي ودعاؤه في القتال، سنة 288هـ"
  en: "The people wonder at al-Hadi's steadfastness, and his prayer in battle, 288 AH"
  ur: "لوگ ہادی کے صبر پر حیران ہوتے ہیں اور ان کی لڑائی میں دعا، 288ھ"
summary:
  ar: "مات الرجل العقيلي المطعون، وكان الناس يتعجبون من صبر الهادي وأصحابه على قلتهم أمام كثرة خيل خصومهم ورجالهم، فقال الهادي بحسب الراوي إنه لو كان معه ألفا راجل وخمسمائة فارس صابرون مؤمنون لدوّخ بهم عامة الأرض، وكان يدعو الله بالصبر عند القتال."
  en: "The stabbed Aqili man died, and the people wondered at the steadfastness of al-Hadi and his men in spite of their few numbers against the many horse and foot of their opponents; the narrator reports al-Hadi as saying that with two thousand foot and five hundred horse of steadfast believers he would subdue most of the earth, and he used to pray for patience in the fight."
  ur: "زخمی عقیلی شخص فوت ہو گیا، اور لوگ ہادی اور ان کے ساتھیوں کے صبر پر حیران ہوتے تھے کہ مخالفوں کے بہت سے سواروں اور پیادوں کے مقابل وہ کتنے کم تھے؛ راوی کے مطابق ہادی نے کہا کہ اگر ان کے پاس ثابت قدم مومنوں میں سے دو ہزار پیادے اور پانچ سو سوار ہوتے تو وہ ان سے زمین کے بیشتر حصے کو زیر کر لیتے، اور وہ لڑائی میں صبر کی دعا کرتے تھے۔"
