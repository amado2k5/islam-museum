summary:
  ar: "بطاقة أولية لحصار بلفن سنة ١٨٧٧م، صمود عثمان باشا العثماني أشهراً أمام الجيش الروسي في حرب ١٨٧٧؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Plevna in 1877, Osman Pasha's months-long stand against the Russian army in the war of 1877–78; its sources are not yet checked on the page."
  es: "Ficha de reclutamiento para el asedio de Plevna en 1877, la resistencia de varios meses de Osman Pasha contra el ejército ruso en la guerra de 1877-78; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de convocation pour le siège de Plevna en 1877, la résistance de plusieurs mois d'Osman Pacha contre l'armée russe pendant la guerre de 1877-1878; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1877 میں پلیونا کے محاصرے کے لیے ڈرافٹ کارڈ، 1877-78 کی جنگ میں روسی فوج کے خلاف عثمان پاشا کا مہینوں طویل موقف؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1877 yılında gerçekleşen Pleven kuşatması ve Osmanlı Osmanlı Paşası'nın 1877 savaşında Rus ordusuna karşı aylarca süren direnişine dair ön bir anlatım; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Pleven pada tahun 1877 M, perlawanan Ottoman Osman Pasha selama berbulan-bulan terhadap tentara Rusia dalam perang tahun 1877; sumber-sumbernya belum ditinjau di halaman ini."
