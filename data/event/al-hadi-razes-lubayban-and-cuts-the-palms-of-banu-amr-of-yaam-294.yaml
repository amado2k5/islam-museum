label:
  ar: "الهادي يهدم قرية لبيبان ويقطع نخيل بني عمرو من اليأميين، شعبان 294هـ، ص336"
  en: "Al-Hadi razes the village of Lubayban and cuts the palms of Banu Amr of the Ya'am, Sha'ban 294 AH, p. 336"
  ur: "ہادی کا لبیبان گاؤں کو مسمار کرنا اور یامیین کے بنی عمرو کے کھجور کے درخت کاٹنا، شعبان 294ھ، ص336"
summary:
  ar: "في 4 شعبان سنة 294هـ خرج الهادي بعساكره، فهدم قرية لبيبان وأمر بقطع نخيل بني عمرو من اليأميين ونخيل رجل من السنانيين، وفق ما يرويه الكتاب."
  en: "On 4 Sha'ban 294 AH al-Hadi marched out with his army, razed the village of Lubayban, and ordered the palms of Banu Amr of the Ya'am and of a man of the Sinan cut, as the narrator reports."
  ur: "4 شعبان 294ھ کو ہادی لشکر کے ساتھ نکلے، لبیبان گاؤں کو گرایا اور یامیین کے بنی عمرو اور سنانیوں کے ایک شخص کے کھجور کے درخت کاٹنے کا حکم دیا، جیسا کہ راوی بیان کرتا ہے۔"
