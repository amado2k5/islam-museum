summary:
  ar: "بطاقة أولية لمعركة ديدجوري سنة ١١٢١م، النصر الجورجي الكبير لداوود الباني على ائتلاف السلاجقة الذي استرد به تفليس؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Didgori in 1121, David the Builder's great Georgian victory over the Seljuk-led coalition that recovered Tbilisi; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Didgori en 1121, la gran victoria georgiana de David el Constructor sobre la coalición liderada por los selyúcidas que recuperó Tiflis; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Didgori en 1121, la grande victoire géorgienne de David le Bâtisseur sur la coalition menée par les Seldjoukides qui a repris Tbilissi; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1121 میں ڈیڈگوری کی جنگ کے لیے ڈرافٹ کارڈ، ڈیوڈ دی بلڈر کی سلجوک کی زیرقیادت اتحاد پر جارجیائی فتح جس نے تبلیسی کو دوبارہ حاصل کیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1121 yılında gerçekleşen Didjori Muharebesi'nin ön anlatımı; bu muharebeyle David Bani, Selçuklu koalisyonu üzerinde büyük bir Gürcü zaferi kazanmış ve Tiflis'i geri almıştır; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Didjori pada tahun 1121 M, kemenangan besar Georgia yang diraih oleh David Bani atas koalisi Seljuk, di mana ia merebut kembali Tbilisi; sumber-sumbernya belum ditinjau di halaman ini."
