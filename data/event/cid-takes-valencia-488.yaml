label: { ar: "استيلاء القنبيطور على بلنسية", en: "Capture of Valencia by al-Qanbiyatur (the Campeador)", fr: "La prise de Valence par al-Qanbiyatur (le Campeador)", es: "Toma de Valencia por al-Qanbiyatur (el Campeador)", ur: "القنبیاطور ⁦(کیمپیڈور)⁩ کے ذریعہ والنسیا پر قبضہ", tr: "Capitoline hanedanının Valensiya'yı fethi", id: "Penaklukan Valencia oleh Capitoline" }
summary:
  ar: "لما صار أمر بلنسية إلى الفقيه القاضي أبي أحمد ابن جحاف صيرها لأمير المسلمين يوسف بن تاشفين، وأنهض يوسف بن أحمد بن هود صاحب سرقسطة ردريق الطاغية للاستيلاء عليها فدخلها وعاهده القاضي واشترط عليه إحضار ذخيرة كانت للقادر بن ذي النون فأقسم أنها ليست عنده فاشترط عليه أنه إن وجدها عنده قتله فاتفق أنها وجدت عنده فأحرقه بالنار وعاث في بلنسية، وكان استيلاء القنبيطور عليها سنة ثمان وثمانين وأربعمائة وقيل في التي قبلها وبه جزم ابن الأبار قائلاً فتم حصار القنبيطور إياها عشرين شهراً، وذكر أنه دخلها صلحاً وقال غيره إنه دخلها عنوة وأحرقها وعاث فيها وممن أحرق فيها الأديب أبو جعفر ابن البني الشاعر، فبعث أمير المؤمنين يوسف بن تاشفين الأمير أبا محمد مزدلي ففتحها الله على يديه سنة خمس وتسعين وأربعمائة {cite:nafh-tib-maqqari p. 455-456}."
  en: "Valencia's fall to Rodrigo el Campeador in 488 (some say 487): raised by Ibn Hud of Zaragoza, he took the city after a twenty-month siege, burned the qadi Ibn Jahhaf over the concealed treasury, and destroyed it — the poet Ibn al-Banna among the burned — until the Almoravid amir Mazdali retook it for Yusuf ibn Tashfin in 495 {cite:nafh-tib-maqqari p. 455-456}."
  fr: "La chute de Valence aux mains de Rodrigue le Campeador en 488 (certains disent 487) : suscité par Ibn Hud de Saragosse, il prit la ville après un siège de vingt mois, fit brûler le cadi Ibn Jahhaf pour le trésor dissimulé, et la ravagea, le poète Ibn al-Banna figurant parmi les brûlés, jusqu'à ce que l'émir almoravide Mazdali la reprenne pour Yusuf ibn Tashfin en 495 {cite:nafh-tib-maqqari p. 455-456}."
  es: "La caída de Valencia ante Rodrigo el Campeador en 488 (algunos dicen 487): levantada por Ibn Hud de Zaragoza, tomó la ciudad tras un asedio de veinte meses, quemó al cadí Ibn Jahhaf sobre el tesoro oculto y lo destruyó —el poeta Ibn al-Banna entre los quemados— hasta que el emir almorávide Mazdali la reconquistó para Yusuf ibn Tashfin en 495 {cite:nafh-tib-maqqari p. 455-456}."
  ur: "والنسیا کا 488 میں روڈریگو ایل کیمپیڈور کا زوال ⁦(بعض کا کہنا ہے کہ 487)⁩: زرگوزا کے ابن ہود نے اس کی پرورش کی، اس نے بیس ماہ کے محاصرے کے بعد شہر پر قبضہ کر لیا، قادی ابن جحف کو چھپے ہوئے خزانے پر جلا دیا، اور اسے تباہ کر دیا - ابن الزمیر کے شاعر ابن المعروف کے درمیان جلانے تک۔ اسے یوسف بن تاشفین کے لیے 495 میں دوبارہ حاصل کیا۔ 455-456}۔"
  tr: "Valencia'nın işleri hukukçu ve kadı Ebu Ahmed ibn Cahhaf'ın yetkisine geçtiğinde, o da şehri Müslümanların Emiri Yusuf ibn Tashfin'e emanet etti. Zaragoza hükümdarı Yusuf ibn Ahmed ibn Hud, şehri ele geçirmek için zalim Roderic'i gönderdi. Roderic şehre girdi ve kadı onunla bir anlaşma yaptı; anlaşmaya göre Roderic, kendisine el-Kadir ibn Dhi el-Nun'a ait bir hazineyi getirecekti. Roderic hazinenin kendisinde olmadığını yemin ederek söyledi, bunun üzerine kadı hazineyi onda bulursa onu öldüreceğini söyledi. Tesadüfen hazine onda bulundu, bunun üzerine Roderic onu ateşe verdi ve Valencia'da büyük bir yıkıma yol açtı. El Cinnaputor'un Valencia'yı fethi Hicri 488 yılında gerçekleşti, ya da bir yıl önce olduğu söyleniyor ve İbn el-Abbar bunu doğrulayarak El Cinnaputor'un şehri yirmi ay boyunca kuşattığını belirtti. Onun oraya barışçıl bir şekilde girdiği söylenirken, diğerleri zorla girdiğini, orayı yaktığını ve büyük tahribat yarattığını söylüyor. Orada yaktığı kişiler arasında edebiyatçı Ebu Cafer ibn el-Bani, şair de vardı. Bunun üzerine Müminlerin Emiri Yusuf ibn Teşfin, Emir Ebu Muhammed Mazdali'yi gönderdi ve Allah ona Hicri 495 yılında zafer nasip etti. (455-456)"
  id: "Ketika urusan Valencia berada di bawah wewenang ahli hukum dan hakim Abu Ahmad ibn Jahhaf, ia mempercayakannya kepada Amir Muslim, Yusuf ibn Tashfin. Yusuf ibn Ahmad ibn Hud, penguasa Zaragoza, mengutus Roderic sang tiran untuk merebutnya. Roderic memasuki kota itu, dan hakim membuat perjanjian dengannya, dengan syarat ia membawa harta karun yang pernah menjadi milik al-Qadir ibn Dhi al-Nun. Roderic bersumpah bahwa ia tidak memilikinya, sehingga hakim menetapkan bahwa jika ia menemukannya, ia akan membunuhnya. Ternyata harta karun itu ditemukan padanya, sehingga Roderic membakarnya dan menimbulkan malapetaka di Valencia. Penaklukan Valencia oleh El Cinnaputor terjadi pada tahun 488 H, atau dikatakan pada tahun sebelumnya, dan Ibn al-Abbar menegaskan hal ini, dengan mengatakan bahwa El Cinnaputor mengepungnya selama dua puluh bulan. Disebutkan bahwa ia memasukinya dengan damai, dan ada pula yang mengatakan bahwa ia memasukinya dengan paksa, membakarnya, dan menimbulkan malapetaka di dalamnya. Di antara mereka yang dibakarnya di sana adalah tokoh sastra Abu Ja'far ibn al-Bani, seorang penyair. Kemudian Amirul Mukminin, Yusuf ibn Tashfin, mengutus Amirul Abu Muhammad Mazdali, dan Allah menganugerahkan kemenangan kepadanya pada tahun 495 H. 455-456}."
