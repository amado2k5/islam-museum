id: event/cid-takes-valencia-488
class: event
kind: conquest
label: { ar: "استيلاء القنبيطور على بلنسية", en: "Capture of Valencia by al-Qanbiyatur (the Campeador)", fr: "La prise de Valence par al-Qanbiyatur (le Campeador)", es: "Toma de Valencia por al-Qanbiyatur (el Campeador)", ur: "القنبیاطور ⁦(کیمپیڈور)⁩ کے ذریعہ والنسیا پر قبضہ" }
summary:
  ar: "لما صار أمر بلنسية إلى الفقيه القاضي أبي أحمد ابن جحاف صيرها لأمير المسلمين يوسف بن تاشفين، وأنهض يوسف بن أحمد بن هود صاحب سرقسطة ردريق الطاغية للاستيلاء عليها فدخلها وعاهده القاضي واشترط عليه إحضار ذخيرة كانت للقادر بن ذي النون فأقسم أنها ليست عنده فاشترط عليه أنه إن وجدها عنده قتله فاتفق أنها وجدت عنده فأحرقه بالنار وعاث في بلنسية، وكان استيلاء القنبيطور عليها سنة ثمان وثمانين وأربعمائة وقيل في التي قبلها وبه جزم ابن الأبار قائلاً فتم حصار القنبيطور إياها عشرين شهراً، وذكر أنه دخلها صلحاً وقال غيره إنه دخلها عنوة وأحرقها وعاث فيها وممن أحرق فيها الأديب أبو جعفر ابن البني الشاعر، فبعث أمير المؤمنين يوسف بن تاشفين الأمير أبا محمد مزدلي ففتحها الله على يديه سنة خمس وتسعين وأربعمائة {cite:nafh-tib-maqqari p. 455-456}."
  en: "Valencia's fall to Rodrigo el Campeador in 488 (some say 487): raised by Ibn Hud of Zaragoza, he took the city after a twenty-month siege, burned the qadi Ibn Jahhaf over the concealed treasury, and destroyed it — the poet Ibn al-Banna among the burned — until the Almoravid amir Mazdali retook it for Yusuf ibn Tashfin in 495 {cite:nafh-tib-maqqari p. 455-456}."
  fr: "La chute de Valence aux mains de Rodrigue le Campeador en 488 (certains disent 487) : suscité par Ibn Hud de Saragosse, il prit la ville après un siège de vingt mois, fit brûler le cadi Ibn Jahhaf pour le trésor dissimulé, et la ravagea, le poète Ibn al-Banna figurant parmi les brûlés, jusqu'à ce que l'émir almoravide Mazdali la reprenne pour Yusuf ibn Tashfin en 495 {cite:nafh-tib-maqqari p. 455-456}."
  es: "La caída de Valencia ante Rodrigo el Campeador en 488 (algunos dicen 487): levantada por Ibn Hud de Zaragoza, tomó la ciudad tras un asedio de veinte meses, quemó al cadí Ibn Jahhaf sobre el tesoro oculto y lo destruyó —el poeta Ibn al-Banna entre los quemados— hasta que el emir almorávide Mazdali la reconquistó para Yusuf ibn Tashfin en 495 {cite:nafh-tib-maqqari p. 455-456}."
  ur: "والنسیا کا 488 میں روڈریگو ایل کیمپیڈور کا زوال ⁦(بعض کا کہنا ہے کہ 487)⁩: زرگوزا کے ابن ہود نے اس کی پرورش کی، اس نے بیس ماہ کے محاصرے کے بعد شہر پر قبضہ کر لیا، قادی ابن جحف کو چھپے ہوئے خزانے پر جلا دیا، اور اسے تباہ کر دیا - ابن الزمیر کے شاعر ابن المعروف کے درمیان جلانے تک۔ اسے یوسف بن تاشفین کے لیے 495 میں دوبارہ حاصل کیا۔ 455-456}۔"
