id: event/mizzi-imprisonment-705
class: event
kind: other
label:
  ar: "حبس المزي بسبب ابن تيمية وكتاب «خلق أفعال العباد»، سنة ٧٠٥هـ"
  en: "Al-Mizzi is jailed over Ibn Taymiyya and the Khalq Af'al al-Ibad, 705/1305"
  ur: "ابن تیمیہ اور کتاب «خلق افعال العباد» کے سبب مزی کی قید، 705ھ/1305ء"
  es: "Al-Mizzi es encarcelado por Ibn Taymiyya y el Khalq Af'al al-Ibad, 705/1305"
  fr: "Al-Mizzi est emprisonné à cause d'Ibn Taymiyya et du Khalq Af'al al-Ibad, 705/1305"
  tr: "El-Mizzi, İbn Taymiyye ve onun \"Kulların Amellerinin Yaratılışı\" adlı kitabı nedeniyle Hicri 705 yılında hapsedildi."
  id: "Al-Mizzi dipenjara karena Ibnu Taymiyyah dan bukunya \"Penciptaan Perbuatan Hamba\" pada tahun 705 Hijriah."
summary:
  ar: "أُوذي المزي سنة ٧٠٥هـ بسبب ابن تيمية، لما وقعت له المناظرة مع الشافعية وبحث مع الصفي الهندي ثم ابن الزملكاني بالقصر الأبلق، شرع يقرأ كتاب «خلق أفعال العباد» للبخاري وفيه فصل في الرد على الجهمية، فتنقّصه بعضهم وقالوا نحن المقصودون بهذا، فبالغ ذلك القاضي الشافعي يومئذ فأمر بسجنه، فتوجه ابن تيمية وأخرجه من السجن، فتقصّب النائب فأُعيد ثم أُفرج عنه، وأمر النائب وهو الأفرم أن يُنادى بأن من يتكلم في العقائد يُقتل {cite:durar-kamina-jil-1993 4/458}؛ وذكر الذهبي أنه حُبس لقراءة شيء من كتاب «أفعال العباد» فصبر وكظم {cite:tarikh-islam-dhahabi p. 490-491}."
  en: "In 705/1305 al-Mizzi was harmed on account of Ibn Taymiyya: after the latter's disputation with the Shafi'is and his sessions with al-Safi al-Hindi then Ibn al-Zamlakani at the Ablaq palace, al-Mizzi began reading al-Bukhari's Khalq Af'al al-Ibad, which contains a chapter refuting the Jahmiyya; some held themselves meant by it, and the Shafi'i qadi of the day ordered him jailed. Ibn Taymiyya went and had him released; the deputy al-Afram had him re-jailed, then freed, and ordered proclamation that whoever discusses creed is killed {cite:durar-kamina-jil-1993 4/458}; al-Dhahabi records that he was imprisoned for reading part of the Af'al al-Ibad book, and bore it patiently {cite:tarikh-islam-dhahabi p. 490-491}."
  ur: "705ھ/1305ء میں مزی کو ابن تیمیہ کے سبب تکلیف پہنچی: ان کی شافعیوں کے ساتھ مناظرے اور صفی ہندی پھر ابن الزملکانی کے ساتھ قصرِ ابلق میں مباحث کے بعد مزی نے بخاری کی «خلق افعال العباد» پڑھنا شروع کی جس میں جہمیہ کے رد کا باب ہے؛ کچھ لوگوں نے خود کو اس کا ہدف سمجھا اور اس وقت کے شافعی قاضی نے انہیں قید کرا دیا؛ ابن تیمیہ نے جا کر انہیں چھڑوایا، پھر نائب الافرم نے دوبارہ قید کرایا اور بعد میں رہا کیا، اور منادی کرادی کہ جو عقائد پر بات کرے گا قتل کیا جائے گا {cite:durar-kamina-jil-1993 4/458}؛ ذہبی نے لکھا کہ وہ افعال العباد کی کتاب کے کچھ حصے کی قراءت پر قید ہوئے اور صبر کیا {cite:tarikh-islam-dhahabi p. 490-491}۔"
  es: "En 705/1305 al-Mizzi fue perjudicado por causa de Ibn Taymiyya: después de la disputa de este último con los shafi'ís y sus sesiones con al-Safi al-Hindi y luego con Ibn al-Zamlakani en el palacio de Ablaq, al-Mizzi comenzó a leer el Khalq Af'al al-Ibad de al-Bujari, que contiene un capítulo que refuta a los jahmiyya; algunos se sintieron atraídos por él, y el cadí shafi'í de la época ordenó su encarcelamiento. Ibn Taymiyya fue y consiguió su liberación; el diputado al-Afram lo hizo encarcelar de nuevo, luego liberar, y ordenó proclamar que quien discutiera sobre el credo sería asesinado {cite:durar-kamina-jil-1993 4/458}; Al-Dhahabi relata que fue encarcelado por leer parte del libro Af'al al-Ibad, y que lo soportó con paciencia {cite:tarikh-islam-dhahabi p. 490-491}."
  fr: "En 705/1305, al-Mizzi fut persécuté à cause d'Ibn Taymiyya: après la dispute de ce dernier avec les chaféites et ses entretiens avec al-Safi al-Hindi puis Ibn al-Zamlakani au palais d'Ablaq, al-Mizzi commença à lire le Khalq Af'al al-Ibad d'al-Bukhari, qui contient un chapitre réfutant les Jahmiyya; certains s'y reconnurent, et le cadi chaféite de l'époque ordonna son emprisonnement. Ibn Taymiyya intervint et obtint sa libération; le député al-Afram le fit de nouveau emprisonner, puis libérer, et ordonna la proclamation que quiconque discuterait de religion serait mis à mort {cite:durar-kamina-jil-1993 4/458}. al-Dhahabi rapporte qu'il a été emprisonné pour avoir lu une partie du livre Af'al al-Ibad, et qu'il l'a supporté patiemment {cite:tarikh-islam-dhahabi p. 490-491}."
  tr: "El-Mizzi, Hicri 705 yılında İbn Taymiyye yüzünden zarar gördü. Şafiîlerle bir tartışmaya girmiş, önce Safi el-Hindi, sonra da İbn el-Zamalkani ile Ablak Sarayı'nda görüşmüş. Buhari'nin \"Kulların Amellerinin Yaratılışı\" adlı kitabını okumaya başlamış ve bu kitapta Cahmiîleri çürüten bir bölüm yer alıyordu. Bazıları onu küçümseyerek, \"Bundan kastedilen biziz\" demişti. O zamanki Şafiî kadı bunu abartarak onu hapse attırmıştı. İbn Taymiyye gidip onu hapisten çıkarmıştı. Vekil tutuklanmış, El-Mizzi geri getirilmiş ve sonra serbest bırakılmıştı. Vekil El-Afram, inançlar hakkında konuşan herkesin öldürülmesi emrini vermişti. El-Dhahabi, El-Mizzi'nin \"Kulların Amellerinin Yaratılışı\" kitabından bir şey okuduğu için hapse atıldığını, bu yüzden sabırlı ve ölçülü davrandığını belirtmiştir."
  id: "Al-Mizzi dirugikan pada tahun 705 H karena Ibnu Taymiyyah, ketika ia berdebat dengan mazhab Syafi'i dan berdiskusi dengan al-Safi al-Hindi dan kemudian Ibnu al-Zamalkani di Istana Ablaq. Ia mulai membaca kitab “Penciptaan Amalan Hamba” karya al-Bukhari, yang berisi bab yang membantah kaum Jahmiyah. Sebagian dari mereka meremehkannya dan berkata, “Kamilah yang dimaksud dengan ini.” Hakim Syafi'i pada saat itu melebih-lebihkan hal ini dan memerintahkan agar ia dipenjara. Ibnu Taymiyyah pergi dan membebaskannya dari penjara. Wakilnya ditangkap dan ia dibawa kembali lalu dibebaskan. Wakil tersebut, yang bernama al-Afram, memerintahkan agar diumumkan bahwa siapa pun yang berbicara tentang keyakinan harus dibunuh. Al-Dhahabi menyebutkan bahwa ia dipenjara karena membaca sesuatu dari kitab “Amalan Hamba,” sehingga ia bersabar dan menahan diri."
