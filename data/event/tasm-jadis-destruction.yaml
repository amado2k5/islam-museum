label: { ar: "فناء طسم وجديس باليمامة", en: "The Annihilation of Tasm and Jadis at al-Yamama", es: "La aniquilación de Tasm y Jadis en al-Yamama", fr: "L'anéantissement de Tasm et Jadis à al-Yamama" }
summary:
  ar: "نزلت طسم بين اليمن واليمامة ونزلت جديس بموضع اليمامة وكانت تعرف بجوّ، وكانت بينهما حروب أفنت جديسٌ فيها أكثر طسم حتى قيل «يا طسم ما لاقيت من جديس»، ثم انضمت بقية طسم إلى جديس باليمامة، فتوجه تبّع من اليمن وقدم عبد كلال بن مثوب فقتل طسماً وجديساً باليمامة وصلب امرأة من جديس يقال لها اليمامة بنت مرّ على باب جوّ فسمت جوّ اليمامة باسمها؛ وقيل منعت جديس خراجاً كان عليها فأُخذت طسم بذنبهم {cite:ansab-al-ashraf p. 8}."
  en: "Tasm settled between Yemen and Yamama and Jadis at Yamama itself, then called Jaww; their wars destroyed most of Tasm — 'O Tasm, what Jadis did to you!' — till the remnant merged into Jadis; then the Tubba' Abd Kulal ibn Muthawwib came up from Yemen and killed both peoples, crucifying Yamama bint Murr on the gate of Jaww, which bears her name {cite:ansab-al-ashraf p. 8}."
  es: "Tasm se estableció entre Yemen y Yamama y Jadis en la misma Yamama, entonces llamada Jaww; sus guerras destruyeron la mayor parte de Tasm — '¡Oh Tasm, lo que Jadis te hizo!' — hasta que el remanente se fusionó con Jadis; entonces Tubba' Abd Kulal ibn Muthawwib vino de Yemen y mató a ambos pueblos, crucificando a Yamama bint Murr en la puerta de Jaww, que lleva su nombre {cite:ansab-al-ashraf p. 8}."
  fr: "Tasm s'est installé entre le Yémen et Yamama et Jadis à Yamama même, alors appelée Jaww; leurs guerres ont détruit la majeure partie de Tasm — « Ô Tasm, ce que Jadis t'a fait ! » — jusqu'à ce que le reste se fonde dans Jadis; puis Tubba' Abd Kulal ibn Muthawwib est venu du Yémen et a tué les deux peuples, crucifiant Yamama bint Murr à la porte de Jaww, qui porte son nom {cite:ansab-al-ashraf p. 8}."
