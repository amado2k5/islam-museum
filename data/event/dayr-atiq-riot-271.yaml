label: { ar: "وثبة العامة على الدير العتيق", en: "The Mob Attack on Dayr al-Atiq", es: "El ataque de la turba contra Dayr al-Atiq", fr: "L'attaque de la foule contre Dayr al-Atiq", ur: "دن عتیق پر ہجوم کا حملہ", tr: "Halkın antik manastıra yönelik saldırısı", id: "Serangan publik terhadap biara kuno tersebut" }
summary:
  ar: "في سنة 271هـ وثبت العامة على النصارى وخربوا الدير العتيق الذي وراء نهر عيسى وانتهبوا كل ما كان فيه من متاع وقلعوا الأبواب والخشب وهدموا بعض حيطانه وسقوفه ونبشوا الموتى، فصار إليهم الحسين بن إسماعيل صاحب شرط بغداد فمنعهم من هدم ما بقي منه وكان يتردد إليه أياماً والعامة تجتمع في تلك الأيام حتى يكون بينهم قتال، ثم بُني ما كانت العامة هدمته وكانت إعادة بنائه بقوة عبدون بن مخلد النصراني {cite:muntazam-ibn-al-jawzi p. 81-82}."
  en: "In 271 the Baghdad mob stormed the Christians' Old Monastery across the Isa canal — looted its furnishings, tore out doors and beams, breached walls and dug up the dead; the chief of police Husayn ibn Isma'il held them off for days until the ruins were rebuilt by the Christian Abdun ibn Makhlad {cite:muntazam-ibn-al-jawzi p. 81-82}."
  es: "En 271, la turba de Bagdad asaltó el antiguo monasterio cristiano al otro lado del canal Isa, saqueó sus muebles, arrancó puertas y vigas, derribó muros y desenterró a los muertos; el jefe de policía Husayn ibn Isma'il los contuvo durante días hasta que las ruinas fueron reconstruidas por el cristiano Abdun ibn Makhlad {cite:muntazam-ibn-al-jawzi p. 81-82}."
  fr: "En 271, la foule de Bagdad a pris d'assaut le vieux monastère des chrétiens de l'autre côté du canal d'Isa — a pillé son mobilier, arraché les portes et les poutres, percé les murs et déterré les morts; le chef de la police Husayn ibn Isma'il les a tenus en échec pendant des jours jusqu'à ce que les ruines soient reconstruites par le chrétien Abdun ibn Makhlad {cite:muntazam-ibn-al-jawzi p. 81-82}."
  ur: "271 میں بغداد کے ہجوم نے عیسیٰ کی نہر کے پار عیسائیوں کی پرانی خانقاہ پر دھاوا بول دیا - اس کا سامان لوٹ لیا، دروازے اور شہتیر پھاڑ دیے، دیواروں کو توڑ دیا اور مرنے والوں کو کھود دیا۔ پولیس کے سربراہ حسین بن اسماعیل نے انہیں کئی دنوں تک روکے رکھا یہاں تک کہ عیسائی عبدون بن مخلد نے کھنڈرات کو دوبارہ تعمیر کیا۔ 81-82}۔"
  tr: "Hicri 271 yılında, halk Hristiyanlara saldırdı ve İsa Nehri'nin ötesindeki eski manastırı yıktı. Tüm eşyalarını yağmaladılar, kapılarını ve tahtalarını söktüler, duvarlarının ve çatılarının bir kısmını yıktılar ve ölüleri mezarlarından çıkardılar. Bağdat polis şefi Hüseyin ibn İsmail onlara geldi ve manastırın kalanını yıkmalarını engelledi. Günlerce manastırı ziyaret etti ve halk bu günlerde toplandı, aralarında çatışmalar çıktı. Daha sonra halkın yıktığı kısımlar yeniden inşa edildi ve bu yeniden inşa, Hristiyan Abdün ibn Muhallad'ın gücüyle gerçekleşti. {cite:muntazam-ibn-al-jawzi s. 81-82}"
  id: "Pada tahun 271 Hijriah, rakyat jelata menyerang orang-orang Kristen dan menghancurkan biara kuno di seberang Sungai Isa. Mereka menjarah semua harta benda biara, mencabut pintu dan kayu, merobohkan sebagian dinding dan atapnya, dan menggali kembali jenazah orang-orang yang telah meninggal. Al-Husayn ibn Isma’il, kepala polisi di Baghdad, datang kepada mereka dan mencegah mereka menghancurkan sisa-sisa biara tersebut. Ia mengunjungi biara itu selama berhari-hari, dan rakyat jelata berkumpul selama hari-hari itu hingga terjadi pertempuran di antara mereka. Kemudian apa yang telah dihancurkan oleh rakyat jelata dibangun kembali, dan rekonstruksinya dilakukan oleh Abdun ibn Mukhallad, seorang Kristen. {cite:muntazam-ibn-al-jawzi hlm. 81-82}."
