label: { ar: "وثبة العامة على الدير العتيق" }
summary:
  ar: "في سنة 271هـ وثبت العامة على النصارى وخربوا الدير العتيق الذي وراء نهر عيسى وانتهبوا كل ما كان فيه من متاع وقلعوا الأبواب والخشب وهدموا بعض حيطانه وسقوفه ونبشوا الموتى، فصار إليهم الحسين بن إسماعيل صاحب شرط بغداد فمنعهم من هدم ما بقي منه وكان يتردد إليه أياماً والعامة تجتمع في تلك الأيام حتى يكون بينهم قتال، ثم بُني ما كانت العامة هدمته وكانت إعادة بنائه بقوة عبدون بن مخلد النصراني {cite:muntazam-ibn-al-jawzi p. 81-82}."
  en: "In 271 the Baghdad mob stormed the Christians' Old Monastery across the Isa canal — looted its furnishings, tore out doors and beams, breached walls and dug up the dead; the chief of police Husayn ibn Isma'il held them off for days until the ruins were rebuilt by the Christian Abdun ibn Makhlad {cite:muntazam-ibn-al-jawzi p. 81-82}."
