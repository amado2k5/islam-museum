  ur: "1569 میں تیونس پر قبضے کے لیے کارڈ کا مسودہ، اسپین کے حفصید اتحادیوں سے الوج علی کا قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
