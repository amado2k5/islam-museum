  id: "Sebuah kartu pendahuluan untuk penaklukan Tunisia pada tahun 1569 M, perebutan wilayah itu oleh Ali Pasha dari Dinasti Hafsid, sekutu Spanyol; sumber-sumbernya belum ditinjau di halaman ini."
