id: event/raid-on-afqayn-and-the-return-of-the-fifth-to-the-mahadhir-287
class: event
kind: other
label:
  ar: "الغارة على أفقين ورد الخمس على المهاذر، 287هـ"
  en: "The raid on Afqayn and the return of the fifth to the Mahadhir, 287 AH"
  ur: "افقین پر چھاپہ اور مہاذر کو خمس کی واپسی، 287ھ"
  es: "El ataque a Afqayn y el regreso del quinto al Mahadhir, 287 AH"
  fr: "Le raid sur Afqayn et le retour du cinquième au Mahadhir, 287 AH"
  tr: "Afqayn baskını ve beşincinin Al-Mahadhir'e dönüşü, Hicri 287"
  id: "Penyerbuan ke Afqayn dan kembalinya orang kelima kepada Al-Mahadhir, 287 H."
summary:
  ar: "بلغ الهادي أن دواب المهاذر أُوضعت بأفقين ومعها جماعة منهم، فأرسل علي بن محمد ومحمد بن القاسم بقطعة من الخيل والرجّالة فأغارا وغنما، وقُسمت الغنيمة على خمسة أسهم، ثم استأمن المهاذر فرد عليهم الهادي الخمس."
  en: "Word reached al-Hadi that the Mahadhir's animals had been put out at Afqayn with a party of them, so he sent Ali ibn Muhammad and Muhammad ibn al-Qasim with a party of horse and foot, who raided and took spoils; the spoil was divided in five shares and the Mahadhir then sought safety and al-Hadi returned the fifth to them."
  ur: "ہادی کو خبر ملی کہ مہاذر کے جانور ان کی ایک جماعت کے ساتھ افقین میں چھوڑے گئے ہیں تو انہوں نے علی بن محمد اور محمد بن قاسم کو سواروں اور پیادوں کی ایک ٹکڑی کے ساتھ بھیجا جنہوں نے چھاپہ مار کر غنیمت لی؛ غنیمت پانچ حصوں میں بانٹی گئی، پھر مہاذر نے امان مانگی تو ہادی نے خمس انہیں لوٹا دیا۔"
  es: "Llegó a oídos de al-Hadi la noticia de que los animales del Mahadhir habían sido soltados en Afqayn con un grupo de ellos, así que envió a Ali ibn Muhammad y a Muhammad ibn al-Qasim con un grupo de caballería e infantería, quienes saquearon y tomaron botín; el botín se dividió en cinco partes y el Mahadhir buscó refugio, y al-Hadi les devolvió la quinta parte."
  fr: "La nouvelle parvint à al-Hadi que les animaux du Mahadhir avaient été mis à Afqayn avec un groupe d'entre eux, alors il envoya Ali ibn Muhammad et Muhammad ibn al-Qasim avec un groupe de cavaliers et d'infanterie, qui pillèrent et prirent du butin; le butin fut divisé en cinq parts et le Mahadhir chercha alors refuge et al-Hadi leur rendit la cinquième."
  tr: "El-Hadi'ye, Mahadhir'in hayvanlarının ve bir grup Mahadhir'in Afaqin'de bulunduğu bildirildi. Bunun üzerine Ali bin Muhammed ve Muhammed bin El-Kasım'ı bir grup at ve piyadeyle birlikte gönderdi ve baskın düzenleyerek ganimet aldılar. Ganimetin beş payı bölündü, ardından Mahadhir'e güvenli geçiş sağlandı ve El-Hadi beşinci payı onlara iade etti."
  id: "Al-Hadi mendapat informasi bahwa hewan-hewan milik Mahadhir ditempatkan di Afaqin, bersama dengan sekelompok dari mereka. Maka ia mengutus Ali bin Muhammad dan Muhammad bin Al-Qasim dengan sekelompok kuda dan prajurit berjalan kaki, dan mereka menyerbu serta mengambil rampasan perang. Rampasan perang dibagi menjadi lima bagian, kemudian Mahadhir diberi jalan aman, dan Al-Hadi mengembalikan bagian kelima kepada mereka."
