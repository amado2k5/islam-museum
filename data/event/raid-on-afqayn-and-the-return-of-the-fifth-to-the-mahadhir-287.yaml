id: event/raid-on-afqayn-and-the-return-of-the-fifth-to-the-mahadhir-287
class: event
kind: other
label:
  ar: "الغارة على أفقين ورد الخمس على المهاذر، 287هـ"
  en: "The raid on Afqayn and the return of the fifth to the Mahadhir, 287 AH"
  ur: "افقین پر چھاپہ اور مہاذر کو خمس کی واپسی، 287ھ"
summary:
  ar: "بلغ الهادي أن دواب المهاذر أُوضعت بأفقين ومعها جماعة منهم، فأرسل علي بن محمد ومحمد بن القاسم بقطعة من الخيل والرجّالة فأغارا وغنما، وقُسمت الغنيمة على خمسة أسهم، ثم استأمن المهاذر فرد عليهم الهادي الخمس."
  en: "Word reached al-Hadi that the Mahadhir's animals had been put out at Afqayn with a party of them, so he sent Ali ibn Muhammad and Muhammad ibn al-Qasim with a party of horse and foot, who raided and took spoils; the spoil was divided in five shares and the Mahadhir then sought safety and al-Hadi returned the fifth to them."
  ur: "ہادی کو خبر ملی کہ مہاذر کے جانور ان کی ایک جماعت کے ساتھ افقین میں چھوڑے گئے ہیں تو انہوں نے علی بن محمد اور محمد بن قاسم کو سواروں اور پیادوں کی ایک ٹکڑی کے ساتھ بھیجا جنہوں نے چھاپہ مار کر غنیمت لی؛ غنیمت پانچ حصوں میں بانٹی گئی، پھر مہاذر نے امان مانگی تو ہادی نے خمس انہیں لوٹا دیا۔"
