label: { ar: "وصايا أبي بكر العشر ليزيد ووداعه جيش أسامة", en: "Abu Bakr's ten commands to Yazid and his farewell to Usama's army", fr: "Les dix recommandations d’Abu Bakr à Yazid et ses adieux à l’armée d’Usama", ur: "ابو بکر کی یزید کو دس وصیتیں اور اسامہ کے لشکر کی رخصتی", es: "Las diez órdenes de Abu Bakr a Yazid y su despedida al ejército de Usama.", tr: "Ebu Bekir'in Yezid'e verdiği on emir ve Usame'nin ordusuna veda edişi.", id: "Sepuluh perintah Abu Bakr kepada Yazid dan perpisahannya dengan pasukan Usama." }
summary:
  ar: "روى مالك عن يحيى بن سعيد أن أبا بكر خرج ماشياً مع يزيد بن أبي سفيان أمير ربع من جيوش الشام وهو راكب، وقال إنه يحتسب خطاه في سبيل الله، وأوصاه بعشر منها ألا يقتل امرأة ولا صبياً ولا كبيراً هرماً ولا يقطع شجراً مثمراً {cite:muwatta-maruf-1997 p. 577}. ويذكر ابن كثير أنه عقد له لواء ومعه جمهور الناس وجعل له دمشق {cite:al-bidaya-wal-nihaya scan vol. 4 p. 8}. وفي وداع جيش أسامة مشى أبو بكر وأسامة راكب، وأوصى الجيش بترك الخيانة والغدر والتمثيل وقتل الطفل والشيخ والمرأة وعقر النخل {cite:kamil-ibn-al-athir scan vol. 1 p. 195} {cite:kamil-ibn-al-athir scan vol. 1 p. 196}، وأبى أن يعزل أسامة حين طلب الأنصار أقدم سناً منه {cite:kamil-ibn-al-athir scan vol. 1 p. 195}."
  en: "Malik reports from Yahya ibn Sa'id that Abu Bakr walked beside Yazid ibn Abi Sufyan, commander of a quarter of the armies for Syria, as Yazid rode, saying he counted his steps in God's way, and gave him ten charges including not to kill a woman, a boy or a very old man and not to cut fruit-bearing trees {cite:muwatta-maruf-1997 p. 577}. Ibn Kathir says he tied Yazid's banner, with most of the people under him, and gave him Damascus {cite:al-bidaya-wal-nihaya scan vol. 4 p. 8}. At the army of Usama he walked while Usama rode and charged the army against treachery, breach of faith, mutilation, killing a child, an old man or a woman, and cutting palms {cite:kamil-ibn-al-athir scan vol. 1 p. 195} {cite:kamil-ibn-al-athir scan vol. 1 p. 196}; he refused to remove Usama when the Ansar asked for an older man {cite:kamil-ibn-al-athir scan vol. 1 p. 195}."
  fr: "Malik rapporte de Yahya ibn Sa'id qu’Abu Bakr marcha à côté de Yazid ibn Abi Sufyan, commandant du quart des armées destinées à la Syrie, tandis que Yazid montait à cheval. Il dit compter ses pas dans la voie de Dieu et lui donna dix recommandations, dont ne tuer ni femme, ni garçon, ni homme très âgé, et ne pas couper les arbres fruitiers {cite:muwatta-maruf-1997 p. 577}. Ibn Kathir dit qu’il noua la bannière de Yazid, qui avait sous ses ordres la plupart des hommes, et lui confia Damas {cite:al-bidaya-wal-nihaya scan vol. 4 p. 8}. Auprès de l’armée d’Usama, il marcha tandis qu’Usama montait à cheval, et interdit à l’armée la trahison, la rupture des engagements, la mutilation, le meurtre des enfants, vieillards ou femmes, et l’abattage des palmiers {cite:kamil-ibn-al-athir scan vol. 1 p. 195} {cite:kamil-ibn-al-athir scan vol. 1 p. 196} ; il refusa de destituer Usama lorsque les Ansar demandèrent un homme plus âgé {cite:kamil-ibn-al-athir scan vol. 1 p. 195}."
  ur: "مالک یحییٰ بن سعید سے روایت کرتے ہیں کہ ابو بکر شام کے لشکروں کے ایک چوتھائی کے امیر یزید بن ابی سفیان کے ساتھ، جو سوار تھے، پیدل چلے اور کہا کہ وہ اپنے قدم اللہ کی راہ میں شمار کرتے ہیں، اور انھیں دس باتوں کی وصیت کی جن میں عورت، لڑکے اور بہت بوڑھے کو قتل نہ کرنا اور پھل دار درخت نہ کاٹنا ہیں {cite:muwatta-maruf-1997 p. 577}۔ ابن کثیر کے مطابق انھوں نے یزید کا جھنڈا باندھا جن کے ساتھ لوگوں کی اکثریت تھی اور انھیں دمشق دیا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 8}۔ اسامہ کے لشکر کو رخصت کرتے ہوئے وہ پیدل چلے اور اسامہ سوار تھے، اور لشکر کو خیانت، عہد شکنی، مثلے، بچے، بوڑھے اور عورت کے قتل اور کھجور کے درخت کاٹنے سے منع کیا {cite:kamil-ibn-al-athir scan vol. 1 p. 195} {cite:kamil-ibn-al-athir scan vol. 1 p. 196}؛ جب انصار نے بڑی عمر والے امیر کا مطالبہ کیا تو انھوں نے اسامہ کو ہٹانے سے انکار کیا {cite:kamil-ibn-al-athir scan vol. 1 p. 195}۔"
  es: "Malik informa de Yahya ibn Sa'id que Abu Bakr caminó junto a Yazid ibn Abi Sufyan, comandante de un cuarto de los ejércitos para Siria, mientras Yazid cabalgaba, diciendo que contaba sus pasos en el camino de Dios, y le dio diez órdenes, incluyendo no matar a una mujer, un niño o un anciano y no cortar árboles frutales {cite:muwatta-maruf-1997 p. 577}. Ibn Kathir dice que ató el estandarte de Yazid, con la mayoría de la gente bajo su mando, y le dio Damasco {cite:al-bidaya-wal-nihaya scan vol. 4 p. 8}. En el ejército de Usama caminó mientras Usama cabalgaba y ordenó al ejército contra la traición, la violación de la fe, la mutilación, matar a un niño, un anciano o una mujer, y cortar palmas {cite:kamil-ibn-al-athir scan vol. 1 p. 195} {cite:kamil-ibn-al-athir scan vol. 1 p. 196}; se negó a destituir a Usama cuando los Ansar pidieron a un hombre mayor {cite:kamil-ibn-al-athir scan vol. 1 p. 195}."
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, Ebu Bekir, Suriye ordusunun bir bölümünün komutanı Yazid ibn Abi Sufyan ile birlikte yaya olarak yola çıktı. Yazid binek üzerindeyken, Ebu Bekir onun adımlarını Allah yolunda olduğunu düşünerek ona on emir verdi. Bu emirler arasında kadın, çocuk veya yaşlı öldürmemek ve meyve ağacı kesmemek de vardı. {cite:muwatta-maruf-1997 s. 577}. İbn Kathir ise ona bir sancak verdiğini, yanında büyük bir grup insan olduğunu ve ona Şam'ı verdiğini belirtir. {cite:al-bidaya-wal-nihaya scan cilt 4 s. 8}. Usame'nin ordusuna veda ederken Ebu Bekir yürürken Usame binek üzerindeydi ve orduya ihanetten, aldatmadan, sakat bırakmaktan, çocukları, yaşlıları ve kadınları öldürmekten ve hurma ağaçlarını kesmekten kaçınmaları talimatını verdi. {cite:kamil-ibn-al-athir scan vol. 1 s. 195} 196} ve Ensar kendisinden daha yaşlı birini istediğinde Usama'yı görevden almayı reddetti {cite:kamil-ibn-al-athir scan vol. 1 s. 195}."
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abu Bakr berjalan kaki bersama Yazid ibn Abi Sufyan, komandan seperempat pasukan Suriah, sementara Yazid menunggang kuda. Ia berkata bahwa ia menganggap langkah Yazid berada di jalan Allah, dan ia memberinya sepuluh instruksi, termasuk tidak membunuh wanita, anak-anak, atau orang tua, dan tidak menebang pohon buah-buahan. {kutipan:muwatta-maruf-1997 hlm. 577}. Ibn Kathir menyebutkan bahwa Abu Bakr memberinya panji, dan bersamanya ada sekelompok besar orang, dan ia memberinya Damaskus. {kutipan:al-bidaya-wal-nihaya scan vol. 4 hlm. 8}. Dan dalam mengucapkan selamat tinggal kepada pasukan Usama, Abu Bakr berjalan kaki sementara Usama menunggang kuda, dan ia menginstruksikan pasukan untuk menahan diri dari pengkhianatan, penipuan, penganiayaan, pembunuhan anak-anak, orang tua, dan wanita, serta menebang pohon kurma. {cite:kamil-ibn-al-athir scan vol. 1 p. 195} 196}, dan dia menolak untuk memecat Usama ketika kaum Ansar meminta seseorang yang lebih tua darinya {cite:kamil-ibn-al-athir scan vol. 1 p. 195}."
