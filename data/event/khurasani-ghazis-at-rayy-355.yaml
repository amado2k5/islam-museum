summary:
  ar: "قدم الري سنة 355هـ جمع من خراسان يُحزرون عشرين ألفاً يُظهرون أنهم غزاة إلى ثغور الروم، فطالبوا ركن الدولة بخراج البلدان، وكفّروا الديلم، ثم قاتلوهم في رمضان وهجموا على المدينة يوم الأربعاء منتصف رمضان، حتى ردّهم ركن الدولة بحيلة أوهم فيها جنده بوصول المدد؛ رواه مسكويه شاهداً، وكان معه خزانة كتب ابن العميد فسلمت من النهب {cite:tajarib-al-umam-surush-v6 p.259} {cite:tajarib-al-umam-surush-v6 p.263} {cite:tajarib-al-umam-surush-v6 p.264} {cite:tajarib-al-umam-surush-v6 p.265} {cite:tajarib-al-umam-surush-v6 p.262}."
  en: "In 355 AH a host from Khurasan, estimated at twenty thousand and professing to be ghazis bound for the Byzantine frontier, came to Rayy, demanded the land-tax of the provinces from Rukn al-Dawla, denounced the Daylamis as unbelievers, then fought them in Ramadan and stormed the city on Wednesday mid-Ramadan, until Rukn al-Dawla drove them off with a ruse that made his troops think reinforcements had arrived. Miskawayh tells it as an eyewitness; Ibn al-Amid's library was in his keeping and escaped the plunder."
