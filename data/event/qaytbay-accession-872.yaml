label: { ar: "وفاة خشقدم وتداول السلطنة على يلباي وتمر بغا ثم قايتباي", en: "Khushqadam's death and the succession through Yalbay and Timurbugha to Qaytbay", es: "La muerte de Khushqadam y la sucesión a través de Yalbay y Timurbugha hasta Qaytbay.", fr: "La mort de Khushqadam et la succession par Yalbay et Timurbugha à Qaytbay", ur: "خوشقدم کی موت اور یلبع اور تیموربغہ کے ذریعے قیتبے تک جانشینی" }
summary:
  ar: "توفي السلطان الظاهر خشقدم يوم السبت لعشر خلون من ربيع الأول سنة اثنتين وسبعين وثمانمائة بعد ست سنين ونصف، فتسلطن في ذلك اليوم الملك الظاهر بلباي المؤيدي وهو الرابع عشر من ملوك الجراكسة فخلعه الأمراء بعد شهرين إلا أربعة أيام، ثم تسلطن الملك الظاهر تمر بغا الظاهري الخامس عشر فكانت سلطنته شهرين إلا يوماً واحداً وخلع ونفي إلى الإسكندرية، وولي السلطنة الملك الأشرف قايتباي المحمودي في ظهر يوم الاثنين سادس ذي الحجة سنة اثنتين وسبعين وثمانمائة وهو السادس عشر من ملوك الجراكسة {cite:shadharat-dhahab p. 315}."
  en: "Khushqadam died Saturday 10 Rabi' I 872 after six and a half years; the amirs seated Yalbay (14th of the Circassian kings) then deposed him after two months minus four days, raised Timurbugha (15th) whose sultanate lasted two months minus one day before exile to Alexandria, and invested al-Ashraf Qaytbay (16th) at midday Monday 6 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 315}."
  es: "Khushqadam murió el sábado 10 Rabi' I 872 después de seis años y medio; los emires sentaron a Yalbay (14º de los reyes circasianos) y luego lo depusieron después de dos meses menos cuatro días, nombraron a Timurbugha (15º) cuyo sultanato duró dos meses menos un día antes del exilio a Alejandría, e investieron a al-Ashraf Qaytbay (16º) al mediodía del lunes 6 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 315}."
  fr: "Khushqadam mourut le samedi 10 Rabi' I 872 après six ans et demi; les émirs installèrent Yalbay (14e des rois circassiens) puis le déposèrent après deux mois moins quatre jours, élevèrent Timurbugha (15e) dont le sultanat dura deux mois moins un jour avant l'exil à Alexandrie, et investirent al-Ashraf Qaytbay (16e) à midi le lundi 6 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 315}."
  ur: "خوشقدم کا انتقال ہفتہ 10 ربیع الاول 872 کو ساڑھے چھ سال بعد ہوا۔ امیروں نے یالبی ⁦(سرکیسی بادشاہوں میں سے 14 ویں)⁩ کو بٹھایا پھر اسے دو ماہ منفی چار دن کے بعد معزول کیا، تیموربوغہ ⁦(15 ویں)⁩ کو اٹھایا جس کی سلطنت اسکندریہ کی جلاوطنی سے ایک دن پہلے دو ماہ تک قائم رہی، اور الاشرف قیطبے ⁦(16 تاریخ)⁩ کو دوپہر D'Hij8-26 ہجری پیر کے درمیان سرمایہ کاری کی۔ {حوالہ: شدھارت ذہاب ص۔ 315}۔"
