label: { ar: "وفاة خشقدم وتداول السلطنة على يلباي وتمر بغا ثم قايتباي", en: "Khushqadam's death and the succession through Yalbay and Timurbugha to Qaytbay" }
summary:
  ar: "توفي السلطان الظاهر خشقدم يوم السبت لعشر خلون من ربيع الأول سنة اثنتين وسبعين وثمانمائة بعد ست سنين ونصف، فتسلطن في ذلك اليوم الملك الظاهر بلباي المؤيدي وهو الرابع عشر من ملوك الجراكسة فخلعه الأمراء بعد شهرين إلا أربعة أيام، ثم تسلطن الملك الظاهر تمر بغا الظاهري الخامس عشر فكانت سلطنته شهرين إلا يوماً واحداً وخلع ونفي إلى الإسكندرية، وولي السلطنة الملك الأشرف قايتباي المحمودي في ظهر يوم الاثنين سادس ذي الحجة سنة اثنتين وسبعين وثمانمائة وهو السادس عشر من ملوك الجراكسة {cite:shadharat-dhahab p. 315}."
  en: "Khushqadam died Saturday 10 Rabi' I 872 after six and a half years; the amirs seated Yalbay (14th of the Circassian kings) then deposed him after two months minus four days, raised Timurbugha (15th) whose sultanate lasted two months minus one day before exile to Alexandria, and invested al-Ashraf Qaytbay (16th) at midday Monday 6 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 315}."
