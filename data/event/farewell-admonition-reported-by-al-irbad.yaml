label: { ar: "موعظة المودّع التي رواها العرباض بن سارية", en: "The farewell-like admonition reported by al-Irbad ibn Sariya", ur: "عرباض بن ساریہ کی روایت کردہ الوداعی نصیحت", es: "La advertencia a modo de despedida reportada por al-Irbad ibn Sariya", fr: "L'admonition semblable à un adieu rapportée par al-Irbad ibn Sariya" }
summary:
  ar: "يروي العرباض بن سارية أن النبي وعظهم موعظة وجلت منها القلوب وذرفت منها العيون، فقالوا كأنها موعظة مودّع فأوصنا، فأوصاهم بتقوى الله والسمع والطاعة وإن تأمّر عليهم عبد، وأخبرهم أن من يعش منهم بعده فسيرى اختلافاً كثيراً فعليهم بسنته وسنة الخلفاء الراشدين المهديين وأن يعضوا عليها بالنواجذ وأن يحذروا محدثات الأمور {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}. وقد خرّجه أحمد وأبو داود والترمذي وابن ماجه، وقال الترمذي حسن صحيح، ونقل ابن رجب في جامع العلوم والحكم اختلاف الرواة في زياداته {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 582}، ثم شرح السنة والسمع والطاعة والخلفاء الراشدين {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 591}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 592}."
  en: "Al-Irbad ibn Sariya reports that the Prophet gave them an admonition at which hearts trembled and eyes streamed, so they said it seemed the admonition of one saying farewell and asked for counsel; he counselled them to fear God, to hear and obey even if a slave were set over them, and told them that whoever of them lived after him would see much disagreement, so they should hold to his sunna and the sunna of the rightly guided successors, bite on it with their molars, and beware of newly invented matters {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}. Ahmad, Abu Dawud, al-Tirmidhi and Ibn Majah transmit it, al-Tirmidhi calls it hasan sahih, and Ibn Rajab in Jami' al-Ulum wa-l-Hikam records the narrators' differences over its additions {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 582}, then explains the sunna, hearing and obeying, and the rightly guided successors {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 591}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 592}."
  ur: "عرباض بن ساریہ روایت کرتے ہیں کہ نبی نے انھیں ایسی نصیحت کی جس سے دل لرز گئے اور آنکھیں بہہ پڑیں؛ انھوں نے کہا گویا یہ رخصت ہونے والے کی نصیحت ہے، اس لیے کوئی وصیت کیجیے۔ آپ نے انھیں اللہ سے ڈرنے اور سننے اور ماننے کی وصیت کی، چاہے ان پر غلام امیر بنا دیا جائے، اور بتایا کہ جو تم میں سے میرے بعد زندہ رہے گا وہ بہت اختلاف دیکھے گا، پس میری سنت اور ہدایت یافتہ خلفائے راشدین کی سنت کو مضبوطی سے، داڑھوں سے، تھامے رکھو اور نئی باتوں سے بچو {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}۔ اسے احمد، ابو داود، ترمذی اور ابن ماجہ نے روایت کیا، ترمذی نے اسے حسن صحیح کہا، اور ابن رجب نے جامع العلوم والحکم میں اس کے اضافوں پر راویوں کے اختلاف کا ذکر کیا {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 582}، پھر سنت، سمع و طاعت اور خلفائے راشدین کی شرح کی {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 591}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 592}۔"
  es: "Al-Irbad ibn Sariya relata que el Profeta les dio una amonestación que les hizo temblar los corazones y llorar, por lo que dijeron que parecía la amonestación de alguien que se despedía y pidieron consejo; él les aconsejó que temieran a Dios, que escucharan y obedecieran incluso si un esclavo estuviera a cargo de ellos, y les dijo que quienquiera que viviera después de él vería mucha discordia, por lo que debían aferrarse a su sunna y a la sunna de los sucesores bien guiados, morderla con sus molares y tener cuidado con los asuntos recién inventados {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}. Ahmad, Abu Dawud, al-Tirmidhi e Ibn Majah lo transmiten, al-Tirmidhi lo llama hasan sahih, e Ibn Rajab en Jami' al-Ulum wa-l-Hikam registra las diferencias de los narradores sobre sus adiciones {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 581}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 582}, luego explica la sunna, escuchar y obedecer, y los sucesores bien guiados {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 591}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 592}."
  fr: "Al-Irbad ibn Sariya rapporte que le Prophète leur adressa une exhortation si profonde qu'ils en eurent les larmes aux yeux. Ils dirent qu'il s'agissait d'un adieu et demandèrent conseil. Il leur conseilla de craindre Dieu, d'écouter et d'obéir même si un esclave était placé à leur tête, et leur dit que quiconque parmi eux survivrait verrait de nombreuses dissensions. Ils devaient donc s'attacher à sa sunna et à celle des successeurs bien guidés, s'y accrocher fermement et se méfier des inventions récentes (Ibn Rajab, Jami' al-Ulum wa-l-Hikam, vol. 2, p. 581). Ahmad, Abu Dawud, al-Tirmidhi et Ibn Majah l'ont transmis. al-Tirmidhi le qualifie de hasan sahih, et Ibn Rajab, dans Jami' al-Ulum wa-l-Hikam, relate les divergences entre les narrateurs concernant ses ajouts (Ibn Rajab, Jami' al-Ulum wa-l-Hikam, vol. 2, p. 581). 2 p. 581}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 582}, puis explique la sunna, l'écoute et l'obéissance, et les successeurs bien guidés {cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 591}{cite:ibn-rajab-jami-ulum-hikam scan vol. 2 p. 592}."
