id: event/conquest-of-antioch
class: event
kind: conquest
label: { ar: "فتح أنطاكية", en: "The Conquest of Antioch", es: "La conquista de Antioquía", fr: "La conquête d'Antioche", ur: "انطاکیہ کی فتح" }
summary:
  ar: "عند البلاذري: سار أبو عبيدة من حلب إلى أنطاكية وقد تحصن بها خلق من أهل جند قنسرين فلما صار بهروبة — وهي على قريب فرسخين من المدينة — لقيه جمع للعدو ففضّهم وألجأهم إلى المدينة وحاصر أهلها من جميع أبوابها وكان معظم الجيش على باب فارس والباب الذي يدعى باب البحر، ثم صالحوه على الجزية والجلاء فجلا بعضهم وأقام بعضهم فأمنهم ووضع على كل حالم منهم ديناراً وجريباً، ثم نقضوا العهد فوجه إليهم إياد بن غنم وحبيب بن مسلمة ففتحاها على الصلح الأول — ويقال بل نقضوا بعد رجوعه إلى فلسطين فوجه عمرو بن العاص من إيلياء ففتحها؛ وكتب عمر إلى أبي عبيدة أن رتب بأنطاكية جماعة من المسلمين أهل نيات وحسبة واجعلهم بها مرابطة ولا تحبس عنهم المطاء، ولما ولّى معاوية كتب إليه بمثل ذلك أما عثمان فكتب يأمره أن يلزمها قوماً وأن يقطع قطائع ففعل؛ ونقل معاوية إلى أنطاكية سنة 42 جماعة من الفرس وأهل بعلبك وحمص ومن المصرين وكان الوليد بن عبد الملك أقطع جنداً بها أرض سلوقية عند الساحل وصيّر الفلثر بدينار ومدي قمح فعمروها وبنى حصن سلوقية؛ وكان مسلم بن عبد الله — جد عبد الله بن حبيب بن النعمان الأنطاكي — من منقوليها وقتله علج بحجر على السور فسمي باب بأنطاكية باب مسلم."
  en: "In al-Baladhuri: Abu Ubayda went from Aleppo to Antioch, where a body of the people of the Qinnasrin jund had fortified themselves; at Haruba — near two farsakhs from the city — an enemy gathering met him and he scattered them back into the city, besieging it at all its gates, the bulk of the army at Bab Faris and the gate called Bab al-Bahr; they then compounded for jizya and evacuation, some departing and some staying, and he secured them setting on each adult a dinar and a jarib; when they broke the covenant he sent Iyad ibn Ghanm and Habib ibn Maslama, who retook it on the first treaty — others say they broke it after he returned to Filastin and Amr ibn al-As was sent from Iliya' to take it; Umar wrote to Abu Ubayda to station at Antioch a company of Muslims of right intent and scruple as murabita, withholding no mounts from them, and Mu'awiya received the same when in office while Uthman ordered him to settle men there and grant land — which he did; Mu'awiya transferred to Antioch in year 42 companies of Persians and people of Ba'labakk, Hims and the two Misrs, and al-Walid ibn Abd al-Malik granted troops land at Saluqiyya by the coast rating the filthir at a dinar and two mudds of wheat — they cultivated it and he built Hisn Saluqiyya; among the transferees was Muslim ibn Abdullah — grandfather of Abdullah ibn Habib ibn al-Nu'man al-Antaki — whom a Byzantine killed with a stone on the wall, a gate of Antioch being named Bab Muslim after him."
  es: "En al-Baladhuri: Abu Ubayda fue de Alepo a Antioquía, donde un grupo de la gente del jund Qinnasrin se había fortificado; en Haruba —a dos farsakhs de la ciudad— una reunión enemiga lo encontró y los dispersó de regreso a la ciudad, sitiándola en todas sus puertas, la mayor parte del ejército en Bab Faris y la puerta llamada Bab al-Bahr; luego llegaron a un acuerdo sobre la jizya y la evacuación, algunos partieron y otros se quedaron, y él los aseguró fijando a cada adulto un dinar y un jarib; cuando rompieron el pacto envió a Iyad ibn Ghanm y Habib ibn Maslama, quienes lo retomaron en el primer tratado; otros dicen que lo rompieron después de que regresó a Filastin y Amr ibn al-As fue enviado desde Iliya' para tomarlo; Umar escribió a Abu Ubayda para que estacionara en Antioquía una compañía de musulmanes de buena fe y escrúpulos como murabita, sin negarles ningún tipo de ayuda, y Mu'awiya recibió lo mismo cuando estaba en el cargo, mientras que Uthman le ordenó que asentara hombres allí y concediera tierras, lo cual hizo; Mu'awiya transfirió a Antioquía en el año 42 compañías de persas y gente de Ba'labakk, Hims y los dos Misrs, y al-Walid ibn Abd al-Malik concedió a las tropas tierras en Saluqiyya junto a la costa, valorando el filthir en un dinar y dos mudds de trigo; ellos lo cultivaron y él construyó Hisn Saluqiyya; entre los transferidos estaba Muslim ibn Abdullah, abuelo de Abdullah ibn Habib ibn al-Nu'man al-Antaki, a quien un bizantino mató con una piedra en la muralla, y una puerta de Antioquía recibió el nombre de Bab Muslim en su honor."
  fr: "Dans al-Baladhuri: Abu Ubayda partit d'Alep pour Antioche, où un groupe d'habitants du Qinnasrin jund s'était retranché; à Haruba — à deux farsakhs de la ville — un rassemblement ennemi l'attendait et il les dispersa dans la ville, l'assiégeant par toutes ses portes, le gros de l'armée à Bab Faris et à la porte appelée Bab al-Bahr; ils s'allièrent alors pour payer la jizya et évacuer, certains partant et d'autres restant, et il les soutint en fixant à chaque adulte un dinar et un jarib; lorsqu'ils rompirent le pacte, il envoya Iyad ibn Ghanm et Habib ibn Maslama, qui reprirent la ville lors du premier traité — d'autres disent qu'ils la rompirent après son retour à Filastin et qu'Amr ibn al-As fut envoyé d'Iliya' pour la reprendre; Umar écrivit à Abu Ubayda pour qu'il stationne à Antioche une compagnie de musulmans intègres et sans scrupules, en tant que murabita, sans leur refuser de montures. Mu'awiya reçut cette même commande lorsqu'il était en fonction, tandis qu'Uthman lui ordonnait d'y installer des hommes et de leur octroyer des terres, ce qu'il fit. Mu'awiya transféra à Antioche, en l'an 42, des compagnies de Perses et d'habitants de Ba'labakk, Hims et des deux Misrs. Al-Walid ibn Abd al-Malik octroya à ses troupes des terres à Saluqiyya, près de la côte, fixant le loyer à un dinar et deux mudds de blé. Ils les cultivèrent et il y construisit Hisn Saluqiyya. Parmi les bénéficiaires de ces transferts figurait Muslim ibn Abdullah, grand-père d'Abdullah ibn Habib ibn al-Nu'man al-Antaki, qui fut tué par un Byzantin à coups de pierre contre le mur. Une porte d'Antioche fut nommée Bab Muslim en son honneur."
  ur: "البلادوری میں ہے: ابو عبیدہ حلب سے انطاکیہ گئے، جہاں کنسرین جند کے لوگوں کی ایک لاش نے اپنے آپ کو مضبوط کر رکھا تھا۔ حروبہ کے مقام پر - شہر سے دو فرسخ کے قریب - دشمن کا ایک اجتماع اس سے ملا اور اس نے ان کو واپس شہر میں تتر بتر کردیا، اس کے تمام دروازوں پر اس کا محاصرہ کیا، باب فارس اور باب البحر نامی دروازے پر فوج کا بڑا حصہ۔ اس کے بعد انہوں نے جزیہ اور انخلاء کے لیے اکٹھا کیا، کچھ روانہ ہوئے اور کچھ ٹھہرے، اور اس نے انہیں ہر بالغ پر ایک دینار اور ایک جریب مقرر کیا۔ جب انہوں نے عہد توڑا تو اس نے عیاض بن غنم اور حبیب ابن مسلمہ کو بھیجا، جنہوں نے اسے پہلے معاہدے پر دوبارہ حاصل کیا - دوسروں کا کہنا ہے کہ انہوں نے فلاسطن واپس آنے کے بعد اسے توڑ دیا اور عمرو بن العاص کو ایلیا کی طرف سے اسے لینے کے لیے بھیجا گیا تھا۔ عمر نے ابو عبیدہ کو انطاکیہ میں مسلمانوں کی ایک جماعت کو مربیتا کے طور پر صحیح ارادے اور سخت مزاج رکھنے کے لیے لکھا، ان کی طرف سے کوئی سواری نہیں روکی گئی، اور معاویہ کو وہی مل گیا جب وہ عہدہ پر تھا جب کہ عثمان نے اسے وہاں مردوں کو آباد کرنے اور زمین دینے کا حکم دیا - جو اس نے کیا؛ معاویہ نے سال 42 میں فارسیوں اور بعلبک کے لوگوں کی کمپنیاں انطاکیہ منتقل کیں، ہمس اور دو مسرور، اور الولید بن عبد الملک نے صلقیہ کے مقام پر فوجیوں کو ایک دینار میں گندم کے دو منڈے اور اس کی کھیتی کی اور ہسلقیہ کو ساحل پر زمین عطا کی۔ منتقلی کرنے والوں میں مسلم بن عبداللہ بھی تھا - عبداللہ ابن حبیب ابن النعمان الانتکی کے دادا - جنہیں ایک بازنطینی نے دیوار پر پتھر مار کر قتل کر دیا تھا، انطاکیہ کے ایک دروازے کو ان کے نام پر باب مسلم کا نام دیا گیا تھا۔"
