label: { ar: "خبيص عتبة بن فرقد", en: "Utba ibn Farqad's Khabis Baskets", es: "Cestas Khabis de Utba ibn Farqad", fr: "Paniers Khabis d'Utba ibn Farqad", ur: "عتبہ بن فرقد کی خبیث ٹوکریاں", tr: "Khabees Utbah ibn Farqad", id: "Khabees Utbah ibn Farqad" }
summary:
  ar: "بعث عمر إلى عتبة بن فرقد والي أذربيجان بأخبصة أدرجها في كرابيس فلما وردت عليه قال أورق قالوا لا قال فما هي قال لطف بعث به فلما نظر إليه قال ردوها عليه وصنع عتبة سفطين من خبيص وألبسهما الجلود واللبود ثم بعث إلى عمر مع سحيم مولاه فذاق عمر الخبيص فقال إن هذا لطيب أكل المهاجرين أكلاً منه شبعة فكتب إليه من عبد الله عمر أمير المؤمنين إلى عتبة بن فرقد أما بعد فليس من كدك ولا كد أمك ولا كد أبيك فلا تأكل إلا ما يشبع منه المسلمون في رحالهم."
  en: "Umar sent his Azerbaijan governor Utba ibn Farqad a hamper of khabis-sweets among the felt-rolls; Utba asked if it was money, then had it sent back. Utba later made two baskets of khabis wrapped in hides and felt, sent by his mawla Suhaym — Umar tasted, 'fine indeed; did the Emigrants eat their fill of it? It is yours alone' — and wrote back: 'it is not your toil nor your mother's nor your father's; eat nothing but what fills the Muslims in their camps'."
  es: "Umar envió a su gobernador de Azerbaiyán, Utba ibn Farqad, una cesta de dulces khabis entre los rollos de fieltro; Utba preguntó si era dinero y luego la mandó devolver. Más tarde, Utba preparó dos cestas de khabis envuelto en pieles y fieltro, que envió su mawla Suhaym. Umar las probó y exclamó: «¡Qué ricas! ¿Se habrán saciado los emigrantes? Son solo tuyas». Y le escribió: «No es fruto de tu esfuerzo, ni del de tu madre, ni de tu padre; no comas nada más que lo que sacia a los musulmanes en sus campamentos»."
  fr: "Umar envoya à son gouverneur d'Azerbaïdjan, Utba ibn Farqad, un panier de khabis (des douceurs) parmi des rouleaux de feutre. Utba demanda s'il s'agissait d'argent, puis le fit renvoyer. Plus tard, Utba confectionna deux paniers de khabis enveloppés de peaux et de feutre, envoyés par son mawla Suhaym. Umar y goûta et dit: « C'est vraiment délicieux; les émigrants en ont-ils mangé à leur faim ? C'est pour toi seul. » Il répondit: « Ce n'est ni ton labeur, ni celui de ta mère, ni celui de ton père; ne mange que ce qui rassasie les musulmans dans leurs camps. »"
  ur: "عمر نے اپنے آذربائیجان کے گورنر عتبہ ابن فرقد کو کھابیوں کی مٹھائیوں کا ایک دستہ بھیجا۔ عتبہ نے پوچھا کہ اگر یہ رقم تھی تو واپس بھیج دی تھی۔ عتبہ نے بعد میں کھبیوں کی دو ٹوکریاں کھالوں میں لپیٹیں اور محسوس کیں، جو اس کے مولا سہیم نے بھیجی ہیں - عمر نے چکھا، 'واقعی ٹھیک ہے؛ کیا مہاجرین نے پیٹ بھر کر کھا لیا؟ یہ صرف آپ کا ہے' - اور واپس لکھا: 'یہ آپ کی محنت نہیں ہے، نہ آپ کی ماں کی اور نہ ہی آپ کے والد کی؛ کچھ نہیں کھاؤ سوائے اس کے کہ جو مسلمانوں کو ان کے کیمپوں میں بھرتا ہے۔"
  tr: "Ömer, Azerbaycan valisi Utbe bin Farqad'a, karabise sardığı bir çeşit tatlı (hubaisah) gönderdi. Tatlılar gelince, \"Yeşil mi?\" diye sordu. \"Hayır,\" dediler. Ömer, \"Öyleyse nedir?\" diye sordu. \"Onun gönderdiği bir çeşit yiyecek,\" dediler. Utbe tatlılara bakınca, \"Ona geri verin,\" dedi. Utbe iki sepet hubai yaptı ve üzerlerini deri ve keçe ile kapladı. Sonra bunları azatlı kölesi Suhaym ile Ömer'e gönderdi. Ömer hubaileri tattı ve \"Bu, Muhacirlerin yediği güzel bir yiyecektir. Açlığını giderene kadar ye,\" dedi. Sonra ona şöyle yazdı: \"Müminlerin Emiri Abdullah Ömer'den Utbe bin Farqad'a: Bundan sonra gelenler ne senin, ne annenin, ne de babanın emeğinden değildir. Öyleyse, Müslümanların kamplarında açlıklarını gidermek için yedikleri şeylerden başka bir şey yeme.\""
  id: "Omar mengirimkan kepada Utbah bin Farqad, gubernur Azerbaijan, beberapa khubaisah (sejenis makanan manis) yang telah dibungkusnya dengan kain karabi. Ketika tiba, ia bertanya, “Apakah warnanya hijau?” Mereka menjawab, “Tidak.” Ia bertanya lagi, “Lalu apa ini?” Utbah menjawab, “Ini adalah sejenis makanan yang dikirimnya.” Setelah melihatnya, ia berkata, “Kembalikan kepadanya.” Utbah membuat dua keranjang khubaisah dan membungkusnya dengan kulit dan kain felt. Kemudian ia mengirimkannya kepada Omar melalui Suhaim, budak yang telah dibebaskannya. Omar mencicipi khubaisah itu dan berkata, “Ini adalah makanan enak yang dimakan oleh kaum Muhajirin. Makanlah secukupnya untuk memuaskan rasa laparmu.” Maka ia menulis surat kepadanya, “Dari Abdullah Omar, Amirul Mukminin, kepada Utbah bin Farqad: Adapun apa yang berikut ini, bukanlah hasil jerih payahmu, bukan pula jerih payah ibumu, dan bukan pula jerih payah ayahmu. Maka janganlah makan kecuali apa yang dimakan kaum Muslimin untuk memuaskan rasa lapar mereka di perkemahan mereka.”"
