  tr: "Bu metin, 16. yüzyılın sonlarında gerçekleşen, Osmanlı devletine karşı büyük Anadolu ayaklanmaları olan Celali ayaklanmalarına dair ön bir açıklamadır; sayfadaki kaynaklar henüz incelenmemiştir."
