summary:
  ar: "بطاقة أولية للفتح الإسلامي للمغرب، حملات حسان بن النعمان وموسى بن نصير التي ضمت إفريقية وبلاد البربر إلى الدولة بين ٦٧٠ و٧١٠م تقريباً؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Muslim conquest of the Maghreb, the campaigns of Hassan ibn al-Nu'man and Musa ibn Nusayr that joined Ifriqiya and the Berber lands to the caliphate roughly between 670 and 710; its sources are not yet checked on the page."
  es: "Boceto de ficha para la conquista musulmana del Magreb, las campañas de Hassan ibn al-Nu'man y Musa ibn Nusayr que unieron Ifriqiya y las tierras bereberes al califato aproximadamente entre 670 y 710; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la conquête musulmane du Maghreb, les campagnes de Hassan ibn al-Nu'man et Musa ibn Nusayr qui ont joint l'Ifriqiya et les terres berbères au califat entre 670 et 710 environ; ses sources ne sont pas encore vérifiées sur la page."
  ur: "مغرب کی مسلمانوں کی فتح کے لیے ڈرافٹ کارڈ، حسن بن النعمان اور موسیٰ بن نصیر کی مہمات جو افریقیہ اور بربر سے تقریباً 670 اور 710 کے درمیان خلافت میں شامل ہوئیں۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Fas'ın İslam tarafından fethine dair ön bir anlatım; yaklaşık 670 ile 710 yılları arasında İfrikiye ve Berberi topraklarını devlete katan Hasan ibn el-Nu'man ve Musa ibn Nusayr'ın seferleri anlatılmaktadır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang penaklukan Islam atas Maroko, kampanye Hassan ibn al-Nu’man dan Musa ibn Nusayr yang mencaplok Ifriqiya dan wilayah Berber ke negara tersebut antara sekitar tahun 670 dan 710 M; sumber-sumber di halaman ini belum ditinjau."
