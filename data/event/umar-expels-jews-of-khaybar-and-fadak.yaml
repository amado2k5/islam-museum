id: event/umar-expels-jews-of-khaybar-and-fadak
class: event
kind: expulsion
label: { ar: "إجلاء يهود خيبر وفدك", en: "Umar's Expulsion of the Jews of Khaybar and Fadak" }
summary:
  ar: "عند البلاذري: بقي يهود خيبر على أراضيهم بالشطر حياة النبي وأبي بكر وصدراً من خلافة عمر، ثم أتاهم عبد الله بن عمر في حاجة فبيّتوه فأخرجهم عمر منها وقسمها بين من حضرها من المسلمين وجعل لأزواج النبي فيها نصيباً وخيّرهن بين الثمرة والضيعة؛ وقال فيها إن النبي قال «لا يجتمع دينان في جزيرة العرب» فأجلى يهود خيبر؛ وأما فدك فلما أجلى عمر يهود الحجاز وجّه أبا الحيثم مالك بن التيّهان وسهل بن أبي حيشمة وزيد بن ثابت الأنصاريين فقوّموا نصف تربتها بقيمة عدل فدفعها إلى يهود وأجلاهم إلى الشام."
  en: "In al-Baladhuri: the Jews of Khaybar stayed on their lands under the half-share arrangement through the Prophet's life and Abu Bakr's and into the early part of Umar's caliphate, until Abdullah ibn Umar came to them on an errand and they set upon him by night — whereupon Umar removed them, dividing Khaybar among the Muslims present and allotting a share to the Prophet's wives with the choice between the produce and the estate; Umar cited the Prophet's saying 'two religions shall not coexist in the Arabian peninsula' in expelling Khaybar's Jews; as for Fadak, when Umar exiled the Jews of the Hijaz he sent Abu al-Haytham Malik ibn al-Tayyihan, Sahl ibn Abi Haythama and Zayd ibn Thabit, who valued half its soil at a fair price paid out to the Jews, and exiled them to Syria."
