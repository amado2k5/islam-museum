id: event/umar-expels-jews-of-khaybar-and-fadak
class: event
kind: expulsion
label: { ar: "إجلاء يهود خيبر وفدك", en: "Umar's Expulsion of the Jews of Khaybar and Fadak", es: "La expulsión de los judíos de Khaybar y Fadak por parte de Umar", fr: "Expulsion des Juifs de Khaybar et de Fadak par Umar", ur: "عمر کا خیبر اور فدک کے یہودیوں کو نکال باہر کرنا" }
summary:
  ar: "عند البلاذري: بقي يهود خيبر على أراضيهم بالشطر حياة النبي وأبي بكر وصدراً من خلافة عمر، ثم أتاهم عبد الله بن عمر في حاجة فبيّتوه فأخرجهم عمر منها وقسمها بين من حضرها من المسلمين وجعل لأزواج النبي فيها نصيباً وخيّرهن بين الثمرة والضيعة؛ وقال فيها إن النبي قال «لا يجتمع دينان في جزيرة العرب» فأجلى يهود خيبر؛ وأما فدك فلما أجلى عمر يهود الحجاز وجّه أبا الحيثم مالك بن التيّهان وسهل بن أبي حيشمة وزيد بن ثابت الأنصاريين فقوّموا نصف تربتها بقيمة عدل فدفعها إلى يهود وأجلاهم إلى الشام."
  en: "In al-Baladhuri: the Jews of Khaybar stayed on their lands under the half-share arrangement through the Prophet's life and Abu Bakr's and into the early part of Umar's caliphate, until Abdullah ibn Umar came to them on an errand and they set upon him by night — whereupon Umar removed them, dividing Khaybar among the Muslims present and allotting a share to the Prophet's wives with the choice between the produce and the estate; Umar cited the Prophet's saying 'two religions shall not coexist in the Arabian peninsula' in expelling Khaybar's Jews; as for Fadak, when Umar exiled the Jews of the Hijaz he sent Abu al-Haytham Malik ibn al-Tayyihan, Sahl ibn Abi Haythama and Zayd ibn Thabit, who valued half its soil at a fair price paid out to the Jews, and exiled them to Syria."
  es: "En al-Baladhuri: los judíos de Khaybar permanecieron en sus tierras bajo el acuerdo de participación del 50% durante la vida del Profeta y de Abu Bakr y hasta la primera parte del califato de Umar, hasta que Abdullah ibn Umar fue a ellos en una misión y lo atacaron de noche, tras lo cual Umar los expulsó, dividiendo Khaybar entre los musulmanes presentes y asignando una parte a las esposas del Profeta con la opción entre la cosecha y la propiedad; Umar citó el dicho del Profeta \"dos religiones no coexistirán en la península arábiga\" para expulsar a los judíos de Khaybar; en cuanto a Fadak, cuando Umar exilió a los judíos del Hiyaz envió a Abu al-Haytham Malik ibn al-Tayyihan, Sahl ibn Abi Haythama y Zayd ibn Thabit, quienes valoraron la mitad de su territorio a un precio justo pagado a los judíos, y los exiliaron a Siria."
  fr: "Selon al-Baladhuri: les Juifs de Khaybar restèrent sur leurs terres, selon un accord de partage à parts égales, durant la vie du Prophète et d’Abu Bakr, et jusqu’au début du califat d’Umar, lorsqu’Abdullah ibn Umar vint leur rendre visite pour une mission. Ils l’attaquèrent alors de nuit, et Umar les expulsa, divisant Khaybar entre les musulmans présents et attribuant une part aux épouses du Prophète, avec le choix entre les récoltes et le domaine. Umar invoqua le hadith du Prophète: « Deux religions ne doivent pas coexister dans la péninsule arabique », pour justifier l’expulsion des Juifs de Khaybar. Quant à Fadak, lorsqu’Umar exila les Juifs du Hedjaz, il envoya Abu al-Haytham Malik ibn al-Tayyihan, Sahl ibn Abi Haythama et Zayd ibn Thabit, qui estimèrent la moitié du sol à un juste prix versé aux Juifs, et les exila en Syrie."
  ur: "البلادوری میں ہے: خیبر کے یہودی رسول اللہ اور ابوبکر اور عمر کی خلافت کے ابتدائی حصے میں آدھے حصے کے انتظام کے تحت اپنی زمینوں پر ٹھہرے رہے، یہاں تک کہ عبداللہ بن عمر ان کے پاس ایک کام پر آئے اور وہ راتوں رات ان پر سوار ہو گئے، اس کے بعد عمر نے انہیں ہٹا دیا، خیبر کو تمام مسلمانوں کے درمیان تقسیم کر کے نبی کے درمیان حصہ لینے کے لیے حاضر ہونے کا انتخاب کیا۔ اور اسٹیٹ؛ عمر نے خیبر کے یہودیوں کو نکالنے میں نبی کے اس قول کا حوالہ دیا کہ 'جزیرہ نما عرب میں دو مذاہب ایک ساتھ نہیں رہیں گے'۔ جہاں تک فدک کا تعلق ہے، جب عمر نے حجاز کے یہودیوں کو جلاوطن کیا تو اس نے ابو الہیثم مالک بن الطیحان، سہل ابن ابی حیثمہ اور زید بن ثابت کو بھیجا، جنہوں نے یہودیوں کو اس کی آدھی زمین کی مناسب قیمت ادا کی اور انہیں شام کی طرف جلاوطن کردیا۔"
