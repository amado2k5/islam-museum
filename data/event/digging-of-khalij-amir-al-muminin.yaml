id: event/digging-of-khalij-amir-al-muminin
class: event
kind: other
label:
  ar: حفر خليج أمير المؤمنين
  en: Digging of the Canal of the Commander of the Faithful
  ur: خلیجِ امیر المؤمنین کی کھدائی
summary:
  ar: أمر عمر بن الخطاب عمرو بن العاص بعد عام الرمادة أن يحفر خليجاً من النيل إلى البحر يحمل فيه الطعام إلى المدينة ومكة، فحفره عمرو في حاشية الفسطاط إلى القلزم، ولم يأت الحول حتى جرت فيه السفن {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}.
  en: After the Year of al-Ramada, Umar ibn al-Khattab ordered Amr ibn al-As to dig a canal from the Nile to the sea to carry food to Medina and Mecca; Amr dug it at the edge of al-Fustat to al-Qulzum, and within the year ships were sailing in it {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}.
  ur: عام الرمادہ کے بعد عمر بن الخطاب نے عمرو بن العاص کو حکم دیا کہ نیل سے سمندر تک ایک نہر کھودیں جس میں مدینہ اور مکہ کو غلہ جائے؛ عمرو نے فسطاط کے کنارے سے قلزم تک اسے کھودا اور سال پورا ہونے سے پہلے اس میں کشتیاں چلنے لگیں {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}۔
