id: event/digging-of-khalij-amir-al-muminin
class: event
kind: other
label:
  ar: حفر خليج أمير المؤمنين
  en: Digging of the Canal of the Commander of the Faithful
  ur: خلیجِ امیر المؤمنین کی کھدائی
  es: "Excavación del canal del Comandante de los Fieles"
  fr: "Creusement du canal du Commandeur des Fidèles"
  tr: "Emirü'l-Müminin Körfezi'nin Kazıları"
  id: "Penggalian Teluk Amir al-Mu'minin"
summary:
  ar: أمر عمر بن الخطاب عمرو بن العاص بعد عام الرمادة أن يحفر خليجاً من النيل إلى البحر يحمل فيه الطعام إلى المدينة ومكة، فحفره عمرو في حاشية الفسطاط إلى القلزم، ولم يأت الحول حتى جرت فيه السفن {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}.
  en: After the Year of al-Ramada, Umar ibn al-Khattab ordered Amr ibn al-As to dig a canal from the Nile to the sea to carry food to Medina and Mecca; Amr dug it at the edge of al-Fustat to al-Qulzum, and within the year ships were sailing in it {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}.
  ur: عام الرمادہ کے بعد عمر بن الخطاب نے عمرو بن العاص کو حکم دیا کہ نیل سے سمندر تک ایک نہر کھودیں جس میں مدینہ اور مکہ کو غلہ جائے؛ عمرو نے فسطاط کے کنارے سے قلزم تک اسے کھودا اور سال پورا ہونے سے پہلے اس میں کشتیاں چلنے لگیں {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}۔
  es: "Después del año de al-Ramada, Umar ibn al-Khattab ordenó a Amr ibn al-As que cavara un canal desde el Nilo hasta el mar para llevar alimentos a Medina y La Meca; Amr lo cavó en el borde de al-Fustat hasta al-Qulzum, y dentro del año los barcos navegaban por él {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}."
  fr: "Après l'année d'al-Ramada, Umar ibn al-Khattab ordonna à Amr ibn al-As de creuser un canal du Nil à la mer pour transporter de la nourriture à Médine et à La Mecque; Amr le creusa à la limite d'al-Fustat jusqu'à al-Qulzum, et dans l'année, des navires y naviguaient {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}."
  tr: "Kül Yılı'ndan sonra Ömer ibn el-Hattab, Amr ibn el-Aas'a Nil'den denize, Medine ve Mekke'ye yiyecek taşımak için bir kanal kazmasını emretti. Amr, Fustat'ın eteklerinde, Kulzum'a kadar kanalı kazdı ve bir yıl geçmeden gemiler bu kanalda seyrediyordu. {cite:futuh-misr-amir-1999 s. 219} {cite:futuh-misr-amir-1999 s. 220}"
  id: "Setelah Tahun Abu, Umar ibn al-Khattab memerintahkan Amr ibn al-Aas untuk menggali kanal dari Sungai Nil ke laut untuk mengangkut makanan ke Madinah dan Mekah. Amr menggali kanal tersebut di pinggiran Fustat menuju Qulzum, dan sebelum satu tahun berlalu, kapal-kapal sudah berlayar di kanal tersebut. {cite:futuh-misr-amir-1999 p. 219} {cite:futuh-misr-amir-1999 p. 220}."
