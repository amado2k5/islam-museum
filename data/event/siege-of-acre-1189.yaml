summary:
  ar: "بطاقة أولية لحصار عكا من ١١٨٩ إلى ١١٩١م، وقعة الحملة الصليبية الثالثة التي انتهت باسترداد الفرنج المدينة من صلاح الدين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Acre from 1189 to 1191, the Third Crusade's long investment that ended with the Crusaders retaking the city from Saladin; its sources are not yet checked on the page."
  es: "Boceto de ficha para el asedio de Acre entre 1189 y 1191, la larga incursión de la Tercera Cruzada que culminó con la reconquista de la ciudad por parte de los cruzados a Saladino; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour le siège d'Acre de 1189 à 1191, le long engagement de la Troisième Croisade qui s'est terminé par la reprise de la ville par les Croisés à Saladin; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1189 سے 1191 تک ایکڑ کے محاصرے کے لیے ڈرافٹ کارڈ، تیسری صلیبی جنگ کی طویل سرمایہ کاری جو صلیبیوں کے صلاح الدین سے شہر واپس لینے کے ساتھ ختم ہوئی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Üçüncü Haçlı Seferi'nin bir parçası olan ve Frankların şehri Selahaddin'den geri almasıyla sonuçlanan, 1189-1191 yılları arasındaki Akka kuşatmasının ön anlatımı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Acre dari tahun 1189 hingga 1191 M, peristiwa Perang Salib Ketiga yang berakhir dengan direbutnya kembali kota itu oleh bangsa Frank dari Saladin; sumber-sumber yang tercantum di halaman ini belum ditinjau."
