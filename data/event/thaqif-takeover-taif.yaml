id: event/thaqif-takeover-taif
class: event
kind: conquest
label: { ar: "غلبة ثقيف على الطائف", en: "Thaqif's Takeover of al-Ta'if", es: "La toma de control de al-Ta'if por parte de Thaqif", fr: "La prise de contrôle d'al-Ta'if par Thaqif", ur: "ثقیف کا الطائف پر قبضہ" }
summary:
  ar: "استيلاء ثقيف على الطائف؛ كانت أرض الطائف لعدوان بن عمرو بن قيس عيلان فغلبهم عليها بنو عامر بن صعصعة بعد قتال شديد، وكانت مساكن ثقيف حول الطائف فأعجبهم نباتها وطيب ثمرها فقالوا لبني عامر إن هذه الأرض لا تصلح للزرع إنما هي أرض ضرع فادفعوا إلينا بلادكم نثيرها ونغرسها ونكلفها بغير مؤنة عليكم وإذا أدرك الثمر فلكم النصف ولنا النصف بعملنا، فرغب بنو عامر فسلموا إليهم الأرض فزرعت ثقيف الأعناب والثمار ووفوا بالشرط حيناً، ثم لما كثروا وشرفت حصنت بلادها بنوا سوراً على الطائف ومنعوا عامراً نصف الثمار، فأرادت عامر أخذه فلم تقدر فقاتلتهم فلم تظفر {cite:kamil-ibn-al-athir p. 512}."
  en: "Thaqif's acquisition of Ta'if: the valley had passed from Adwan to Banu Amir ibn Sa'sa'a by the sword; Thaqif, camped around it, persuaded Amir to hand them the land to till and plant at no cost for half the harvest — then, grown strong, walled the town, kept the halves, and Amir could not win it back {cite:kamil-ibn-al-athir p. 512}."
  es: "La adquisición de Ta'if por Thaqif: el valle había pasado de Adwan a Banu Amir ibn Sa'sa'a por la espada; Thaqif, acampado a su alrededor, persuadió a Amir para que les entregara la tierra para cultivarla y sembrarla sin costo alguno a cambio de la mitad de la cosecha; luego, fortalecido, amuralló la ciudad, se quedó con las mitades y Amir no pudo recuperarla {cite:kamil-ibn-al-athir p. 512}."
  fr: "L'acquisition de Taïf par Thaqif: la vallée était passée d'Adwan à Banu Amir ibn Sa'sa'a par l'épée; Thaqif, campant autour, persuada Amir de leur céder la terre à cultiver et à planter gratuitement pour la moitié de la récolte — puis, devenus forts, ils encerclèrent la ville, conservèrent les moitiés, et Amir ne put la récupérer {cite:kamil-ibn-al-athir p. 512}."
  ur: "ثقیف کا طائف کا حصول: وادی عدوان سے بنو عامر بن صاعع تک تلوار کے زور پر گزری تھی۔ ثقیف نے اس کے ارد گرد ڈیرے ڈالے، امیر کو قائل کیا کہ وہ زمین ان کے حوالے کر دے اور بغیر کسی قیمت کے آدھی فصل کا پودا لگا دے- پھر مضبوط ہوا، شہر کی دیواریں لگا دیں، آدھے حصے کو محفوظ کر لیا، اور امیر اسے واپس نہ جیت سکا۔ 512}۔"
