label: { ar: "غلبة ثقيف على الطائف", en: "Thaqif's Takeover of al-Ta'if", es: "La toma de control de al-Ta'if por parte de Thaqif", fr: "La prise de contrôle d'al-Ta'if par Thaqif", ur: "ثقیف کا الطائف پر قبضہ", tr: "Thaqif'in Taif'e karşı zaferi", id: "Kemenangan Thaqif atas Taif" }
summary:
  ar: "استيلاء ثقيف على الطائف؛ كانت أرض الطائف لعدوان بن عمرو بن قيس عيلان فغلبهم عليها بنو عامر بن صعصعة بعد قتال شديد، وكانت مساكن ثقيف حول الطائف فأعجبهم نباتها وطيب ثمرها فقالوا لبني عامر إن هذه الأرض لا تصلح للزرع إنما هي أرض ضرع فادفعوا إلينا بلادكم نثيرها ونغرسها ونكلفها بغير مؤنة عليكم وإذا أدرك الثمر فلكم النصف ولنا النصف بعملنا، فرغب بنو عامر فسلموا إليهم الأرض فزرعت ثقيف الأعناب والثمار ووفوا بالشرط حيناً، ثم لما كثروا وشرفت حصنت بلادها بنوا سوراً على الطائف ومنعوا عامراً نصف الثمار، فأرادت عامر أخذه فلم تقدر فقاتلتهم فلم تظفر {cite:kamil-ibn-al-athir p. 512}."
  en: "Thaqif's acquisition of Ta'if: the valley had passed from Adwan to Banu Amir ibn Sa'sa'a by the sword; Thaqif, camped around it, persuaded Amir to hand them the land to till and plant at no cost for half the harvest — then, grown strong, walled the town, kept the halves, and Amir could not win it back {cite:kamil-ibn-al-athir p. 512}."
  es: "La adquisición de Ta'if por Thaqif: el valle había pasado de Adwan a Banu Amir ibn Sa'sa'a por la espada; Thaqif, acampado a su alrededor, persuadió a Amir para que les entregara la tierra para cultivarla y sembrarla sin costo alguno a cambio de la mitad de la cosecha; luego, fortalecido, amuralló la ciudad, se quedó con las mitades y Amir no pudo recuperarla {cite:kamil-ibn-al-athir p. 512}."
  fr: "L'acquisition de Taïf par Thaqif: la vallée était passée d'Adwan à Banu Amir ibn Sa'sa'a par l'épée; Thaqif, campant autour, persuada Amir de leur céder la terre à cultiver et à planter gratuitement pour la moitié de la récolte — puis, devenus forts, ils encerclèrent la ville, conservèrent les moitiés, et Amir ne put la récupérer {cite:kamil-ibn-al-athir p. 512}."
  ur: "ثقیف کا طائف کا حصول: وادی عدوان سے بنو عامر بن صاعع تک تلوار کے زور پر گزری تھی۔ ثقیف نے اس کے ارد گرد ڈیرے ڈالے، امیر کو قائل کیا کہ وہ زمین ان کے حوالے کر دے اور بغیر کسی قیمت کے آدھی فصل کا پودا لگا دے- پھر مضبوط ہوا، شہر کی دیواریں لگا دیں، آدھے حصے کو محفوظ کر لیا، اور امیر اسے واپس نہ جیت سکا۔ 512}۔"
  tr: "Sakif'in Taif'i fethi; Taif toprakları Adwan ibn Amr ibn Qais Aylan'a aitti, ancak Beni Amir ibn Sa'sa'ah şiddetli bir savaşın ardından onları alt etti. Sakif'in yerleşim yerleri Taif çevresindeydi ve bölgenin bitki örtüsü ve meyvelerinin bereketinden etkilenmişlerdi. Beni Amir'e, \"Bu toprak ekime uygun değil; sadece süt diyarı. Bize topraklarınızı verin ki biz onu ekip biçelim, ekelim ve size hiçbir masraf çıkarmadan bakımını yapalım. Meyveler olgunlaştığında yarısı sizin, yarısı da emeğimizin karşılığı olarak bizim olsun.\" dediler. Beni Amir kabul etti ve toprakları onlara verdi. Sakif üzüm ve meyve yetiştirdi ve bir süre bu şartı yerine getirdi. Sonra sayıları artıp öne çıktıklarında, topraklarını tahkim ettiler, Taif'in etrafına bir duvar ördüler ve Amir'in meyvelerin yarısını almasını engellediler. Amir meyvelerin yarısını almak istedi ama başaramadı, bu yüzden onlarla savaştılar ama başarılı olamadılar. {alıntı: kamil-ibn-el-esir s. 512}."
  id: "Penaklukan Taif oleh Thaqif; tanah Taif adalah milik Adwan ibn Amr ibn Qais Aylan, tetapi Banu Amir ibn Sa'sa'ah mengalahkan mereka setelah pertempuran sengit. Tempat tinggal Thaqif berada di sekitar Taif, dan mereka terkesan oleh tumbuh-tumbuhan dan kualitas buahnya. Mereka berkata kepada Banu Amir, \"Tanah ini tidak cocok untuk pertanian; ini hanya tanah penghasil susu. Berikan tanahmu kepada kami agar kami dapat mengolahnya, menanaminya, dan merawatnya tanpa biaya apa pun bagimu. Ketika buahnya matang, setengahnya akan menjadi milikmu dan setengahnya lagi akan menjadi milik kami sebagai imbalan atas kerja kami.\" Banu Amir bersedia dan menyerahkan tanah itu kepada mereka. Thaqif menanam anggur dan buah-buahan dan memenuhi syarat tersebut untuk sementara waktu. Kemudian, ketika jumlah mereka bertambah dan menjadi berpengaruh, mereka membentengi tanah mereka, membangun tembok di sekitar Taif, dan mencegah Amir mengambil setengah dari buah tersebut. Amir ingin mengambilnya tetapi tidak bisa, jadi mereka melawan mereka tetapi tidak berhasil. {mengutip: kamil-ibn-al-athir hal. 512}."
