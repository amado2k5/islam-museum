summary:
  ar: "غضب النعمان بن المنذر لما اعترضت بنو عامر لطيمة كسرى فجهز مع جنوده عيرًا وأمرهم أن يمروا بعكاظ وإذا فرغ الناس وانسلخت الأشهر أقصدوا بني عامر وهم بنواحي السلان، فكتموا أمرهم، فنبّههم عبد الله بن جدعان، وعاد عليهم عامر بن مالك ملاعب الأسنة، فالتقوا بالسلان فأسر يزيد بن الصعق وبرة بن رومانس أخا النعمان لأمه، فهمّ الجيش بالهزيمة فقام بأمرهم ضرار بن عمرو الضبي وقاتل هو وبنوه حتى سقط شيخًا وخلصوه فقال من سرّه بنوه ساءته نفسه فذهبت مثلًا، وخدعه أبو براء عامر بن مالك أن دلّه على رجل له فداء فدلّه على حبيش بن دلف فأسره ثم تبين أنه سيد فافتدى بأربعمائة بعير، وافتدى وبرة نفسه بألف بعير وفرس فاستغنى يزيد وكان خفيف الحال، وهزم جيش النعمان {cite:kamil-ibn-al-athir p. 479-480}."
  en: "Stung when Banū ʿĀmir seized part of Khusraw's trading convoy, al-Nuʿmān sent his host disguised as merchants: strike Banū ʿĀmir at al-Silān when the fair ends and the sacred months lapse. ʿAbdallāh ibn Judʿān carried the warning and Abū Barāʾ ʿĀmir ibn Mālik «player of lances» returned to lead them. Yazīd ibn al-Ṣaʿq captured the king's half-brother Wabra; the host nearly broke until Dirār ibn ʿAmr and his nine sons held the line — old Dirār, saved by his sons, gave the proverb «whoever delights in his sons is grieved by himself». Abū Barāʾ was tricked into taking Ḥubaysh ibn Dalaf «a man worth a ransom»; Ḥubaysh bought freedom with four hundred camels, Wabra with a thousand — making poor Yazīd rich — and al-Nuʿmān's army was routed {cite:kamil-ibn-al-athir p. 479-480}."
