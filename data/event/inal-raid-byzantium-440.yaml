label:
  ar: "غزوة إينال إلى نواحي القسطنطينية"
  en: "Ibrahim Inal's raid toward Constantinople"
summary:
  ar: "في سنة أربعين وأربعمائة أتى كثير من الغز من ما وراء النهر إلى إبراهيم ينال أخي طغربك، فقال لهم: ضاقت بلادنا عن مقامكم، والوجه أن نمضي إلى غزاة الروم ومجاهدتهم، فساروا وسار بعدهم حتى بقي بينه وبين القسطنطينية خمسة عشر يومًا، وحصل له من السبي ما يزيد على مائة ألف رأس، وغنم منهم أربعة آلاف درع، وحمل ما وصل إليه على عشرة آلاف عجلة، وعاد {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  en: "In 440 masses of Ghuzz from beyond the Oxus came to Ibrahim Inal, Tughril Beg's brother; he told them the land could not hold them and the right course was to raid the Byzantines, so they marched with him in their rear until only fifteen days remained between him and Constantinople. He returned with more than a hundred thousand captives, four thousand coats of mail, and booty carried on ten thousand wagons {cite:muntazam-ibn-al-jawzi j.8 p.479}."
