id: event/inal-raid-byzantium-440
class: event
kind: conquest
label:
  ar: "غزوة إينال إلى نواحي القسطنطينية"
  en: "Ibrahim Inal's raid toward Constantinople"
  es: "La incursión de Ibrahim Inal hacia Constantinopla"
  fr: "Le raid d'Ibrahim Inal vers Constantinople"
  ur: "ابراہیم انال کا قسطنطنیہ کی طرف حملہ"
summary:
  ar: "في سنة أربعين وأربعمائة أتى كثير من الغز من ما وراء النهر إلى إبراهيم ينال أخي طغربك، فقال لهم: ضاقت بلادنا عن مقامكم، والوجه أن نمضي إلى غزاة الروم ومجاهدتهم، فساروا وسار بعدهم حتى بقي بينه وبين القسطنطينية خمسة عشر يومًا، وحصل له من السبي ما يزيد على مائة ألف رأس، وغنم منهم أربعة آلاف درع، وحمل ما وصل إليه على عشرة آلاف عجلة، وعاد {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  en: "In 440 masses of Ghuzz from beyond the Oxus came to Ibrahim Inal, Tughril Beg's brother; he told them the land could not hold them and the right course was to raid the Byzantines, so they marched with him in their rear until only fifteen days remained between him and Constantinople. He returned with more than a hundred thousand captives, four thousand coats of mail, and booty carried on ten thousand wagons {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  es: "En el año 440, grandes hordas de Ghuzz procedentes de más allá del Oxus llegaron a Ibrahim Inal, hermano de Tughril Beg. Les dijo que la tierra no podía contenerlos y que lo correcto era atacar a los bizantinos, así que marcharon con él a sus espaldas hasta que solo quedaron quince días entre él y Constantinopla. Regresó con más de cien mil cautivos, cuatro mil cotas de malla y un botín transportado en diez mil carros {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  fr: "En 440, des hordes de Ghuzz, venues d'au-delà de l'Oxus, se présentèrent à Ibrahim Inal, frère de Tughril Beg. Celui-ci leur expliqua que le pays ne pouvait les retenir et que la meilleure solution était de piller les Byzantins. Ils marchèrent donc à sa suite jusqu'à ce qu'il ne leur reste plus que quinze jours de marche jusqu'à Constantinople. Il revint avec plus de cent mille captifs, quatre mille cottes de mailles et un butin transporté sur dix mille chariots (voir Muntazam ibn al-Jawzi, vol. 8, p. 479)."
  ur: "440 میں غز کے لوگ آکسس کے پار سے تغرل بیگ کے بھائی ابراہیم انال کے پاس آئے۔ اس نے انہیں بتایا کہ زمین ان پر قبضہ نہیں کر سکتی اور صحیح راستہ بازنطینیوں پر حملہ کرنا تھا، لہذا وہ اس کے ساتھ اپنے عقب میں مارچ کرتے رہے یہاں تک کہ اس کے اور قسطنطنیہ کے درمیان صرف پندرہ دن رہ گئے۔ وہ ایک لاکھ سے زیادہ اسیروں، چار ہزار ڈاک اور دس ہزار گاڑیوں پر مال غنیمت لے کر واپس آیا۔"
