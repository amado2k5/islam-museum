id: event/al-hadi-says-in-verse-he-built-a-house-of-glory-and-revived-the-book-292
class: event
kind: other
label:
  ar: "قول الهادي في شعره إنه بنى لهم بيتاً من المجد وأحيا كتاب الله، ص302-303"
  en: "Al-Hadi says in verse that he built them a house of glory and revived the Book of God, pp. 302-303"
  ur: "ہادی کا اشعار میں کہنا کہ اس نے ان کے لیے مجد کا گھر بنایا اور اللہ کی کتاب کو زندہ کیا، ص302-303"
  es: "Al-Hadi dice en verso que les construyó una casa de gloria y revivió el Libro de Dios, págs. 302-303."
  fr: "Al-Hadi dit en vers qu'il leur a construit une maison de gloire et a fait revivre le Livre de Dieu, pp. 302-303"
summary:
  ar: "يقول الشاعر إنه نهض ولم يعجز وقال مواعظ هي ذخائر علم، وإنه بنى لهم بيتاً من المجد فصار لهم به عز وفخر، وإنه بعث كتاب الله بعد هلاكه وحرّم ما حرّمته نصوصه وإن آل محمد كلهم عزّوا بفعله وإن شيعتهم عالون في كل حجة، لأنهم أحيوا كتاباً وسنة."
  en: "The poet says that he rose and was not found wanting and spoke counsels that are stores of knowledge, that he built them a house of glory through which they gained honour and pride, that he revived the Book of God after its destruction, forbade what its texts forbid, that all the family of Muhammad were raised by his deed and their partisans stand high in every argument, because they revived a Book and a Sunna."
  ur: "شاعر کہتا ہے کہ وہ اٹھا اور عاجز نہ ہوا اور ایسی نصیحتیں کیں جو علم کے خزانے ہیں، کہ اس نے ان کے لیے مجد کا گھر بنایا جس سے انہیں عزت اور فخر ملا، کہ اس نے اللہ کی کتاب کو اس کے تباہ ہو جانے کے بعد زندہ کیا، وہ حرام ٹھہرایا جو اس کی نصوص نے حرام کیا کہ آل محمد سب اس کے عمل سے سربلند ہوئے اور ان کے پیروکار ہر دلیل میں بلند ہیں، کیونکہ انہوں نے ایک کتاب اور ایک سنت کو زندہ کیا۔"
  es: "El poeta dice que se levantó y no fue hallado falto y pronunció consejos que son depósitos de conocimiento, que les construyó una casa de gloria a través de la cual obtuvieron honor y orgullo, que revivió el Libro de Dios después de su destrucción, prohibió lo que sus textos prohíben, que toda la familia de Mahoma fue elevada por su acción y sus partidarios se mantienen firmes en cada argumento, porque revivieron un Libro y una Sunna."
  fr: "Le poète dit qu'il s'est levé et n'a pas été trouvé en défaut, et a prononcé des conseils qui sont des sources de connaissance; qu'il leur a construit une maison de gloire grâce à laquelle ils ont acquis honneur et fierté; qu'il a fait revivre le Livre de Dieu après sa destruction, a interdit ce que ses textes interdisent; que toute la famille de Muhammad a été élevée par son acte et que leurs partisans se tiennent haut dans chaque débat, car ils ont fait revivre un Livre et une Sunna."
