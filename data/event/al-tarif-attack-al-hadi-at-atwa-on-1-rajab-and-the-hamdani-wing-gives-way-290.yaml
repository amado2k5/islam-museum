id: event/al-tarif-attack-al-hadi-at-atwa-on-1-rajab-and-the-hamdani-wing-gives-way-290
class: event
kind: other
label:
  ar: "هجوم آل طريف على الهادي بأتوة يوم أول رجب وانهزام ميمنته الهمدانية، رجب 290هـ"
  en: "Al Tarif attack al-Hadi at Atwa on the first of Rajab and the Hamdani wing gives way, Rajab 290 AH"
  ur: "رجب کے پہلے دن اتوہ میں آل طریف کا ہادی پر حملہ اور ہمدانی بازو کا ہٹ جانا، رجب 290ھ"
  es: "Al Tarif ataca a al-Hadi en Atwa el primer día de Rajab y el ala de Hamdani cede, Rajab 290 AH"
  fr: "Al Tarif attaque al-Hadi à Atwa le 1er Rajab et l'aile Hamdani cède, Rajab 290 AH"
  tr: "Hicri 290 yılının Receb ayının ilk gününde El Tarif boyunun Atva'da El-Hadi'ye saldırması ve Hamdani sağ kanadının yenilgiye uğratılması."
  id: "Serangan klan Al Tarif terhadap Al-Hadi di Atwa pada hari pertama bulan Rajab dan kekalahan sayap kanan Hamdani-nya, Rajab 290 H."
summary:
  ar: "سار آل طريف إلى أتوة يوم الثلاثاء أول رجب فعبّأ الهادي عسكره، الهمدانيون ميمنة والخولانيون ميسرة وهو في القلب مع الطبريين والعلويين، وسمّى الراوي من كان معه من العلويين يومئذ؛ ثم حملت ميسرته على ميمنتهم فطردتها، وتقدمت ميسرتهم إلى ميمنة الهادي فانهزمت من غير قتال بعد إشارة رجل من خيوان، بحسب الراوي، فصار القوم من وراء الهادي."
  en: "Al Tarif marched on Atwa on Tuesday, the first of Rajab, and al-Hadi drew up his army, the Hamdanis on the right, the Khawlanis on the left and himself in the centre among the Tabaris and Alawites, and the narrator names the Alawites who were with him that day; his left wing then charged their right and drove it back, while their left advanced on al-Hadi's right, which gave way without fighting after a signal from a man of Khiwan, according to the narrator, so that the men got behind al-Hadi."
  ur: "آل طریف منگل کے دن رجب کی پہلی کو اتوہ کی طرف بڑھے تو ہادی نے اپنا لشکر آراستہ کیا، دائیں بازو پر ہمدانی اور بائیں پر خولانی اور خود وسط میں طبریوں اور علویوں کے ساتھ، اور راوی ان علویوں کے نام لیتا ہے جو اس دن ان کے ساتھ تھے؛ پھر ان کے بائیں بازو نے ان کے دائیں پر حملہ کر کے اسے ہٹایا، جبکہ ان کا بایاں ہادی کے دائیں کی طرف بڑھا اور راوی کے مطابق خیوان کے ایک شخص کے اشارے پر لڑے بغیر ہٹ گیا، یوں مخالف ہادی کے پیچھے پہنچ گئے۔"
  es: "Al Tarif marchó sobre Atwa el martes, primero de Rajab, y al-Hadi dispuso su ejército: los Hamdanis a la derecha, los Khawlanis a la izquierda y él mismo en el centro entre los Tabaris y los Alauitas. El narrador nombra a los Alauitas que estaban con él ese día. Su flanco izquierdo cargó contra el derecho de al-Hadi y lo hizo retroceder, mientras que su flanco izquierdo avanzó hacia el derecho de al-Hadi, que cedió sin luchar tras una señal de un hombre de Khiwan, según el narrador, de modo que los hombres se colocaron detrás de al-Hadi."
  fr: "Al Tarif marcha sur Atwa le mardi, premier jour de Rajab, et al-Hadi déploya son armée, les Hamdanis à droite, les Khawlanis à gauche et lui-même au centre parmi les Tabaris et les Alaouites. Le narrateur nomme les Alaouites qui étaient avec lui ce jour-là. Son aile gauche chargea alors leur droite et la repoussa, tandis que leur gauche avançait sur la droite d'al-Hadi, qui céda sans combattre après un signal d'un homme de Khiwan, selon le narrateur, de sorte que les hommes se placèrent derrière al-Hadi."
  tr: "Tarif kabilesi, Recep ayının ilk günü olan Salı günü Atva'ya yürüdü. Hadid, ordusunu topladı; sağda Hamdaniyyun, solda Havlaniyyun vardı ve kendisi Taberiyyun ve Alevilerle birlikte merkezde yer aldı. Rivayet eden kişi, o gün Alevilerden yanında bulunanların isimlerini zikretti. Sonra sol kanadı onların sağ kanadına saldırdı ve onları geri püskürttü; onların sol kanadı ise Hadid'in sağ kanadına doğru ilerledi ve rivayet eden kişiye göre, Hayvan'dan bir adamın işaretiyle savaşmadan yenilgiye uğradılar, böylece halk Hadid'in arkasında kaldı."
  id: "Klan Al Tarif bergerak menuju Atwa pada hari Selasa, tanggal 1 Rajab. Al-Hadi mengumpulkan pasukannya, kaum Hamdaniyyun di sebelah kanan dan kaum Khawlaniyyun di sebelah kiri, dan ia berada di tengah bersama kaum Tabariyyun dan kaum Alawiyah. Perawi menyebutkan nama-nama orang yang bersamanya dari kaum Alawiyah pada hari itu. Kemudian sayap kirinya menyerang sayap kanan mereka dan mengusir mereka, dan sayap kiri mereka maju ke sayap kanan Al-Hadi dan dikalahkan tanpa pertempuran setelah isyarat dari seorang pria dari Khaywan, menurut perawi, sehingga orang-orang berada di belakang Al-Hadi."
