id: event/al-hadi-calls-the-family-of-ahmad-to-unite-like-a-torrent-292
class: event
kind: other
label:
  ar: "دعوة الهادي آل أحمد إلى الاتحاد والنهوض كالسيل والصبر في الوغى، ص302"
  en: "Al-Hadi calls the family of Ahmad to unite and rise like a torrent and to patience in battle, p. 302"
  ur: "ہادی کی آل احمد کو اتحاد، سیلاب کی طرح اٹھنے اور میدان میں صبر کی دعوت، ص302"
  es: "Al-Hadi exhorta a la familia de Ahmad a unirse y alzarse como un torrente, y a tener paciencia en la batalla, pág. 302."
  fr: "Al-Hadi appelle la famille d'Ahmad à s'unir et à se soulever comme un torrent, et à faire preuve de patience dans la bataille, p. 302"
  tr: "Al-Hadi Al-Ahmad'ın birlik ve sel gibi yükselme çağrısı ve savaşta sabır, s. 302"
  id: "Seruan Al-Hadi Al-Ahmad untuk persatuan dan bangkit seperti banjir, serta kesabaran dalam pertempuran, hlm. 302"
summary:
  ar: "تتابع القصيدة في ص302 فيصف الشاعر أعداء آل الرسول بأنهم في غبطة وعيش ذائع الملك، ويدعو آل أحمد إلى أن يشدّوا وينهضوا ويصونوا دينهم ويتحاشدوا كما تحاشد غيرهم، لأن العز في الصبر في ساحة القتال، وأن الملك عز وأمر وغنى، ويقول إنهم بقايا السيوف وإن أبوهم أمير المؤمنين وجدهم رسول الله."
  en: "On p. 302 the poem goes on: the poet describes the enemies of the family of the Messenger as in ease and a spreading kingdom, and calls the family of Ahmad to brace themselves, rise, guard their religion and muster as others have mustered, for honour lies in patience in the field of battle and kingship is honour, command and wealth; he says they are the remnant of the blades and that their father is the Commander of the Believers and their grandfather the Messenger."
  ur: "ص302 پر نظم آگے بڑھتی ہے: شاعر رسول کی آل کے دشمنوں کو عیش اور پھیلتی ہوئی بادشاہی میں بتاتا ہے اور آل احمد کو دعوت دیتا ہے کہ کمر کس لیں، اٹھ کھڑے ہوں، اپنے دین کی حفاظت کریں اور اسی طرح جمع ہوں جیسے دوسرے جمع ہوئے، کیونکہ عزت میدان جنگ میں صبر میں ہے اور بادشاہی عزت، حکم اور دولت ہے؛ وہ کہتا ہے کہ وہ تلواروں کی بقیہ ہیں اور ان کے باپ امیر المومنین اور ان کے دادا رسول اللہ ہیں۔"
  es: "En la página 302, el poema prosigue: el poeta describe a los enemigos de la familia del Mensajero como personas que viven cómodamente y que poseen un reino en expansión, y llama a la familia de Ahmad a prepararse, levantarse, proteger su religión y reunirse como otros lo han hecho, pues el honor reside en la paciencia en el campo de batalla y la realeza es honor, mando y riqueza; dice que son el remanente de las espadas y que su padre es el Comandante de los Creyentes y su abuelo el Mensajero."
  fr: "À la page 302, le poème continue: le poète décrit les ennemis de la famille du Messager comme étant à l'aise et ayant un royaume en expansion, et appelle la famille d'Ahmad à se préparer, à se lever, à défendre leur religion et à se rassembler comme d'autres l'ont fait, car l'honneur réside dans la patience sur le champ de bataille et la royauté est honneur, commandement et richesse; il dit qu'ils sont le reste des lames et que leur père est le Commandeur des Croyants et leur grand-père le Messager."
  tr: "Şiir 302. sayfada devam ediyor; şair, Peygamber ailesinin düşmanlarını mutluluk içinde ve geniş bir egemenlik içinde yaşadıklarını anlatıyor ve Ahmed ailesini güçlenmeye, ayağa kalkmaya, dinlerini korumaya ve diğerleri gibi bir araya gelmeye çağırıyor; çünkü zafer savaş meydanında sabırdadır ve egemenlik zafer, komuta ve zenginliktir diyor ve onların kılıçların kalıntıları olduğunu, babalarının Müminlerin Komutanı, dedelerinin ise Allah'ın Elçisi olduğunu söylüyor."
  id: "Puisi tersebut berlanjut di halaman 302, di mana penyair menggambarkan musuh-musuh keluarga Nabi sebagai orang-orang yang berbahagia dan hidup dalam kekuasaan yang luas, dan menyerukan kepada keluarga Ahmad untuk memperkuat dan bangkit serta melindungi agama mereka dan bersatu seperti yang telah dilakukan orang lain, karena kemuliaan terletak pada kesabaran di medan perang, dan kekuasaan adalah kemuliaan, komando, dan kekayaan, dan dia mengatakan bahwa mereka adalah sisa-sisa pedang dan bahwa ayah mereka adalah Amirul Mukminin dan kakek mereka adalah Rasulullah."
