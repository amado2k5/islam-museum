summary:
  ar: "حج الصفدي سنة ٧٥٥هـ رفقة الشاعر محمد بن يوسف بن عبد الله الخياط، كما يفيد سماعه في «أعيان العصر»؛ ودار أحد كتبه «حقيقة المفاز إلى الحجاز» حول هذه الرحلة {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  en: "Al-Safadi made the pilgrimage in 755/1354 together with the poet Muhammad ibn Yusuf ibn Abd Allah al-Khayyat, as his own sama' note in A'yan al-'asr attests; one of his works, Hakikat al-mafaz ila al-Hijaz, appears to have centred on this journey {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  ur: "صفدی نے 755ھ/1354ء میں شاعر محمد بن یوسف بن عبداللہ خیاط کے ساتھ حج کیا، جیسا کہ «أعيان العصر» میں اس کے سماع کی یادداشت گواہ ہے؛ اس کی کتاب «حقيقة المفاز إلى الحجاز» اسی سفر پر مبنی معلوم ہوتی ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}۔"
