label:
  ar: "حج الصفدي، ٧٥٥هـ"
  en: "Al-Safadi's pilgrimage, 755/1354"
  ur: "صفدی کا حج، 755ھ/1354ء"
  es: "La peregrinación de Al-Safadi, 755/1354"
  fr: "Le pèlerinage d'Al-Safadi, 755/1354"
summary:
  ar: "حج الصفدي سنة ٧٥٥هـ رفقة الشاعر محمد بن يوسف بن عبد الله الخياط، كما يفيد سماعه في «أعيان العصر»؛ ودار أحد كتبه «حقيقة المفاز إلى الحجاز» حول هذه الرحلة {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  en: "Al-Safadi made the pilgrimage in 755/1354 together with the poet Muhammad ibn Yusuf ibn Abd Allah al-Khayyat, as his own sama' note in A'yan al-'asr attests; one of his works, Hakikat al-mafaz ila al-Hijaz, appears to have centred on this journey {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  ur: "صفدی نے 755ھ/1354ء میں شاعر محمد بن یوسف بن عبداللہ خیاط کے ساتھ حج کیا، جیسا کہ «أعيان العصر» میں اس کے سماع کی یادداشت گواہ ہے؛ اس کی کتاب «حقيقة المفاز إلى الحجاز» اسی سفر پر مبنی معلوم ہوتی ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}۔"
  es: "Al-Safadi realizó la peregrinación en 755/1354 junto con el poeta Muhammad ibn Yusuf ibn Abd Allah al-Khayyat, como lo atestigua su propia nota sama' en A'yan al-'asr; una de sus obras, Hakikat al-mafaz ila al-Hijaz, parece haberse centrado en este viaje {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  fr: "Al-Safadi a effectué le pèlerinage en 755/1354 avec le poète Muhammad ibn Yusuf ibn Abd Allah al-Khayyat, comme l'atteste sa propre note sama' dans A'yan al-'asr; l'une de ses œuvres, Hakikat al-mafaz ila al-Hijaz, semble s'être concentrée sur ce voyage {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
