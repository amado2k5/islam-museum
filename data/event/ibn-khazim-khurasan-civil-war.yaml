id: event/ibn-khazim-khurasan-civil-war
class: event
kind: civil-war
label: { ar: "حرب ابن خازم على ولاية خراسان", en: "Ibn Khazim's War for Khurasan", es: "La guerra de Ibn Khazim por Jorasán", fr: "La guerre d'Ibn Khazim pour le Khorasan", ur: "ابن خزیم کی خراسان کے لیے جنگ" }
summary:
  ar: "تلقى عبد الله بن خازم السلمي سلم بن زياد منصرفه من خراسان بنيسابور فكتب له سلم عهداً على خراسان وأعانه بمائة ألف درهم فاجتمع جمع كثير من بكر بن وائل وغيرهم فقالوا على ما يأكل هؤلاء خراسان دوننا فأغاروا على ثقل ابن خازم فقاتلوهم عنه فكفوا وأرسل سليمان بن مرثد إلى ابن خازم إن العهد الذي معك لو استطاع صاحبه أن يقيم بخراسان لم يخرج عنها ويوجهك وأقبل سليمان فنزل بمشرعة سليمان ونزل ابن خازم بمرو واتفقا أن يكتبا إلى ابن الزبير فأيهما أمره فهو الأمير فولى ابن الزبير عبد الله بن خازم خراسان فقدم إليه بعهده عروة بن قطبة بعد ستة أشهر فأبى سليمان أن يقبل ذلك وقال إن ابن الزبير بخليفة وإنما هو رجل عائذ بالبيت فحاربه ابن خازم وهو في ستة آلاف وسليمان في خمسة عشر ألفاً فقتل سليمان قتله قيس بن عاصم السلمي واحتز رأسه وكان شعار ابن خازم حمر لا ينصرون وشعار سليمان يا نصر اقترب واجتمع فل سليمان إلى عمر بن مرثد بالطالقان فسار إليه ابن خازم فقاتله فقتله واجتمعت ربيعة إلى أوس بن ثعلبة بهراة فاستخلف ابن خازم موسى ابنه وسار إليه وكانت بين أصحابهما وقائع واغتنمت الترك ذلك فكانت تغير حتى بلغت قرب نيسابور ودس ابن خازم إلى أوس من سمه فمرض واجتمعوا للقتال فحض ابن خازم أصحابه فقال اجعلوه يومكم واطعنوا الخيل من مناخرها فإنه لم يطمن فرس قط في منخره فأدبر فاقتتلوا قتالاً شديداً وأصابت أوساً جراحة وهو عليل فمات منها بعد أيام."
  en: "Ibn Khazim met the departing Salm at Naysabur and carried his covenant over Khurasan with a hundred thousand dirhams; Bakr ibn Wa'il's masses resented 'these men eating Khurasan over us' and raided his baggage before being fought off. Sulayman ibn Marthad told him the covenant was worthless — its issuer could not stay himself — and they agreed to let Ibn al-Zubayr arbitrate; six months on, Urwa ibn Qatiba brought Ibn Khazim the governorship — and Sulayman refused it: 'Ibn al-Zubayr is no caliph, only a man sheltering at the House'. Six thousand against fifteen thousand, cries 'humr la yunsarun' against 'ya nasr iqtarib' — Sulayman fell to Qays ibn Asim al-Sulami, who took his head; his remnant under Umar ibn Marthad at Talaqan was destroyed next. When Rabi'a gathered to Aws ibn Tha'laba at Herat, Ibn Khazim left Musa over Marw and marched — the Turks exploiting their strife to raid near Naysabur — had Aws poisoned, and before battle urged his men to stab the horses' nostrils, 'no horse ever endured that and stayed'; Aws, already ailing, took a wound and died days later."
  es: "Ibn Khazim se reunió con Salm, que partía, en Naysabur y llevó su pacto sobre Jorasán con cien mil dirhams; las masas de Bakr ibn Wa'il se indignaron porque \"estos hombres se estaban comiendo Jorasán por nosotros\" y saquearon su equipaje antes de ser rechazadas. Sulayman ibn Marthad le dijo que el pacto no tenía valor —su emisor no podía quedarse— y acordaron dejar que Ibn al-Zubayr arbitrara; seis meses después, Urwa ibn Qatiba le ofreció a Ibn Khazim el cargo de gobernador, y Sulayman lo rechazó: \"Ibn al-Zubayr no es califa, solo un hombre que se refugia en la Casa\". Seis mil contra quince mil, gritos de \"humr la yunsarun\" contra \"ya nasr iqtarib\" — Sulayman cayó ante Qays ibn Asim al-Sulami, quien le cortó la cabeza; su remanente bajo Umar ibn Marthad en Talaqan fue destruido después. Cuando Rabi'a reunió a Aws ibn Tha'laba en Herat, Ibn Khazim dejó a Musa en Marw y marchó —los turcos aprovecharon su conflicto para saquear cerca de Naysabur—, envenenó a Aws y, antes de la batalla, instó a sus hombres a apuñalar las fosas nasales de los caballos, «ningún caballo jamás soportó eso y sobrevivió»; Aws, que ya estaba enfermo, recibió una herida y murió días después."
  fr: "Ibn Khazim rencontra Salm à Naysabur, sur le point de partir, et lui apporta son pacte avec le Khorasan, assorti de cent mille dirhams. Les troupes de Bakr ibn Wa'il, indignées que « ces hommes dévorent le Khorasan à notre place », pillèrent ses bagages avant d'être repoussées. Sulayman ibn Marthad lui déclara que le pacte était sans valeur – son auteur n'ayant pu se maintenir lui-même – et ils convinrent de laisser Ibn al-Zubayr arbitrer. Six mois plus tard, Urwa ibn Qatiba proposa le poste de gouverneur à Ibn Khazim, mais Sulayman le refusa: « Ibn al-Zubayr n'est pas un calife, seulement un homme qui se réfugie au Temple. » Six mille contre quinze mille, crient « Humr la yunsarun » contre « Ya nasr iqtarib » – Sulayman tomba aux mains de Qays ibn Asim al-Sulami, qui le décapita. Ses troupes restantes, sous le commandement d'Umar ibn Marthad à Talaqan, furent ensuite anéanties. Lorsque Rabi'a se rassembla auprès d'Aws ibn Tha'laba à Hérat, Ibn Khazim laissa Musa au-delà de Marw et marcha — les Turcs exploitant leur conflit pour mener un raid près de Naysabur — fit empoisonner Aws et, avant la bataille, exhorta ses hommes à poignarder les narines des chevaux, « aucun cheval n'a jamais enduré cela et est resté »; Aws, déjà malade, fut blessé et mourut quelques jours plus tard."
  ur: "ابن خزیم نے رخصت ہونے والے سالم سے نیصابور میں ملاقات کی اور خراسان پر ایک لاکھ درہم کا عہد کیا۔ بکر بن وائل کی عوام نے 'یہ لوگ ہم پر خراسان کھا رہے ہیں' پر ناراضگی ظاہر کی اور لڑائی سے پہلے اس کے سامان پر چھاپہ مارا۔ سلیمان ابن مرثد نے اسے بتایا کہ یہ عہد بیکار ہے - اس کا جاری کرنے والا خود نہیں رہ سکتا ہے - اور وہ ابن الزبیر کو ثالثی کرنے پر راضی ہوگئے؛ چھ ماہ بعد عروہ بن قتیبہ ابن خزیم کو گورنری لایا - اور سلیمان نے اس سے انکار کر دیا: 'ابن الزبیر کوئی خلیفہ نہیں ہے، صرف ایک آدمی ہے جو ایوان میں پناہ لے رہا ہے'۔ پندرہ ہزار کے مقابلے میں چھ ہزار، یا نصر اقطارب کے خلاف 'حمر لا ینسارون' پکارتا ہے - سلیمان قیس بن عاصم السلمی کے پاس گرا، جس نے اس کا سر لیا؛ اس کے بعد طلقان میں عمر بن مرثد کی قیادت میں اس کی باقیات کو تباہ کر دیا گیا۔ جب ربیعہ ہرات میں اوس بن ثعلبہ کے پاس جمع ہوا تو ابن خزیم نے موسیٰ کو مرو کے اوپر چھوڑ دیا اور کوچ کیا - ترکوں نے نیصابور کے قریب چھاپہ مارنے کے لیے ان کی لڑائی کا فائدہ اٹھایا - اوس کو زہر دیا گیا تھا، اور جنگ سے پہلے اپنے آدمیوں کو گھوڑوں کے نتھنوں پر وار کرنے کی تاکید کی تھی، 'کوئی گھوڑا کبھی برداشت نہیں ہوا' اور وہ ٹھہرا۔ اوس، پہلے سے بیمار تھا، ایک زخم کھایا اور دن بعد مر گیا۔"
