label: { ar: "فتح المفرج بن سلام أربعة وعشرين حصناً", en: "al-Mufarraj ibn Sallam's Conquest of Twenty-Four Fortresses", es: "La conquista de veinticuatro fortalezas por al-Mufarraj ibn Sallam", fr: "La conquête des vingt-quatre forteresses par al-Mufarraj ibn Sallam" }
summary:
  ar: "عند البلاذري: قام بعد خلفون رجل يقال له المفرج — وفي نسخة المفرخ — بن سلام ففتح أربعة وعشرين حصناً واستولى عليها وكتب إلى صاحب البريد بمصر يعلمه خبره وأنه لا يرى لنفسه ومن معه من المسلمين صلاة الأبان ويقد له الإمام على ناحيته ويوليه إياها ليخرج من حد المتغلبين وبنى مسجداً جامعاً ثم إن أصحابه شغبوا عليه فقتلوه وقام بعده سوران — وجاءت سودان — فوجه رسوله إلى أمير المؤمنين المتوكل يسأله عقداً وكتاب ولاية فتوفي قبل أن ينصرف رسوله إليه وتوفي المنتصر بالله وكانت خلافته ستة أشهر وقام المستعين بالله أحمد بن محمد بن المعتصم فأمر عامله على المغرب وهو أوتامش مولى أمير المؤمنين بأن يعقد له على ناحيته فلم يشخص رسوله من سر من رأى حتى قتل أوتامش وولّى الناحية وصيف مولى أمير المؤمنين فعقد له وأنفذه."
  en: "In al-Baladhuri: after Khalafun rose a man called al-Mufarraj — one copy: al-Mufarrikh — ibn Sallam who opened twenty-four fortresses and seized them; he wrote the postmaster in Egypt his news and that he deemed the absentee prayer unlawful for himself and the Muslims with him, asking the imam to contract him over his district and appoint him, to leave the state of usurpers — and he built a congregational mosque. Then his companions mutinied and killed him; Sawran — also read Sudan — succeeded and sent his envoy to al-Mutawakkil asking patent and letter of appointment, but al-Mutawakkil died before the envoy reached him, and al-Muntasir died whose caliphate was six months; al-Musta'in Ahmad ibn Muhammad ibn al-Mu'tasim ordered his Maghreb agent Utamish — the caliph's mawla — to contract it for him, but before his envoy could leave Samarra Utamish was killed and Wasif the caliph's mawla took the district and contracted and dispatched it."
  es: "En al-Baladhuri: después de que Khalafun se alzó un hombre llamado al-Mufarraj —una copia: al-Mufarrikh— ibn Sallam que abrió veinticuatro fortalezas y las tomó; escribió al jefe de correos en Egipto su noticia y que consideraba ilícita la oración ausente para él y los musulmanes con él, pidiendo al imán que lo contratara sobre su distrito y lo nombrara, para dejar el estado de usurpadores —y construyó una mezquita congregacional. Entonces sus compañeros se amotinaron y lo mataron; Sawran —también leído Sudán— sucedió y envió a su enviado a al-Mutawakkil pidiendo patente y carta de nombramiento, pero al-Mutawakkil murió antes de que el enviado llegara a él, y al-Muntasir murió cuyo califato duró seis meses; Al-Musta'in Ahmad ibn Muhammad ibn al-Mu'tasim ordenó a su agente del Magreb, Utamish —el mawla del califa— que lo contratara para él, pero antes de que su enviado pudiera salir de Samarra, Utamish fue asesinado y Wasif, el mawla del califa, tomó el distrito, contrató el servicio y lo envió."
  fr: "Selon al-Baladhuri: après l’avènement de Khalafun, un homme nommé al-Mufarraj (ou al-Mufarrikh), ibn Sallam, ouvrit et s’empara de vingt-quatre forteresses. Il écrivit au maître de poste d’Égypte pour lui faire part de ses nouvelles et lui annoncer qu’il considérait la prière par procuration comme illicite pour lui-même et les musulmans qui l’accompagnaient. Il demanda à l’imam de lui confier la gestion de son district et de le nommer administrateur, afin qu’il quitte l’État des usurpateurs. Il fit construire une mosquée pour les fidèles. Ses compagnons se mutinèrent alors et le tuèrent. Sawran (ou Sudan) lui succéda et envoya un émissaire auprès d’al-Mutawakkil pour obtenir des lettres patentes et une lettre de nomination. Cependant, al-Mutawakkil mourut avant que l’émissaire ne parvienne à ses fins, et al-Muntasir mourut également après six mois de califat. al-Musta'in Ahmad ibn Muhammad ibn al-Mu'tasim ordonna à son agent maghrébin Utamish — le mawla du calife — de conclure le contrat pour lui, mais avant que son envoyé ne puisse quitter Samarra, Utamish fut tué et Wasif, le mawla du calife, prit le district, conclut le contrat et l'expédia."
