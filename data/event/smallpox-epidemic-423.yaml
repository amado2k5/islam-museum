summary:
  ar: "تتابع الموتان أربع سنين: ففي ٤٢٢ تأخر المطر فنشفت الأبدان وكثرت النازلات والسعال حتى روج بيع الحساء؛ وفي ٤٢٣ عمّ الوباء الهند وغزنة وخراسان وجرجان والري، ودفن بأصبهان في أيام قليلة أربعون ألفًا، وببلد الجبل، ومات بالموصل أربعة آلاف صبي بالجدري، وعمّ بغداد الجدري من نيسان إلى تشرين فلم يسلم بيت؛ وفي ٤٢٤ حصل الجدري للخليفة نفسه حين دخل الحمام فأُقيم؛ وفي ٤٢٥ كثر الموت لا سيما في النساء بالهوانق، وقيل في ذي الحجة مات ببغداد سبعون ألفًا {cite:muntazam-ibn-al-jawzi j.8 p.402} {cite:muntazam-ibn-al-jawzi j.8 p.411-412} {cite:muntazam-ibn-al-jawzi j.8 p.414} {cite:muntazam-ibn-al-jawzi j.8 p.419} {cite:muntazam-ibn-al-jawzi j.8 p.422}."
  en: "The deaths ran on for four years. In 422 rain came late, bodies dried out, coughing and sickness multiplied, to the point that the sale of broth boomed. In 423 the epidemic spread over India, Ghazna, Khurasan, Jurjan and al-Rayy; forty thousand were buried in Isfahan within a few days, and in the land of al-Jibal, while four thousand boys died of smallpox in Mosul, and smallpox swept Baghdad from April to October so that no house was spared. In 424 smallpox befell the caliph himself when he entered the bath, and he was lifted out of it. In 425 death multiplied, especially among women in al-Hawaniq, and it was said that in Dhu al-Hijjah seventy thousand died in Baghdad {cite:muntazam-ibn-al-jawzi j.8 p.402} {cite:muntazam-ibn-al-jawzi j.8 p.411-412} {cite:muntazam-ibn-al-jawzi j.8 p.414} {cite:muntazam-ibn-al-jawzi j.8 p.419} {cite:muntazam-ibn-al-jawzi j.8 p.422}."
