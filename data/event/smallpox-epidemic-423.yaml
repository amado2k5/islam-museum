label: { ar: "موتان الجدري والوباء ٤٢٢–٤٢٥", en: "Smallpox and epidemic deaths, 422–425", es: "Viruela y muertes epidémicas, 422–425", fr: "Variole et décès épidémiques, 422–425", ur: "چیچک اور وبائی امراض سے ہونے والی اموات، 422–425", tr: "Çiçek hastalığı salgını 422–425", id: "Wabah cacar tahun 422–425" }
summary:
  ar: "تتابع الموتان أربع سنين: ففي ٤٢٢ تأخر المطر فنشفت الأبدان وكثرت النازلات والسعال حتى روج بيع الحساء؛ وفي ٤٢٣ عمّ الوباء الهند وغزنة وخراسان وجرجان والري، ودفن بأصبهان في أيام قليلة أربعون ألفًا، وببلد الجبل، ومات بالموصل أربعة آلاف صبي بالجدري، وعمّ بغداد الجدري من نيسان إلى تشرين فلم يسلم بيت؛ وفي ٤٢٤ حصل الجدري للخليفة نفسه حين دخل الحمام فأُقيم؛ وفي ٤٢٥ كثر الموت لا سيما في النساء بالهوانق، وقيل في ذي الحجة مات ببغداد سبعون ألفًا {cite:muntazam-ibn-al-jawzi j.8 p.402} {cite:muntazam-ibn-al-jawzi j.8 p.411-412} {cite:muntazam-ibn-al-jawzi j.8 p.414} {cite:muntazam-ibn-al-jawzi j.8 p.419} {cite:muntazam-ibn-al-jawzi j.8 p.422}."
  en: "The deaths ran on for four years. In 422 rain came late, bodies dried out, coughing and sickness multiplied, to the point that the sale of broth boomed. In 423 the epidemic spread over India, Ghazna, Khurasan, Jurjan and al-Rayy; forty thousand were buried in Isfahan within a few days, and in the land of al-Jibal, while four thousand boys died of smallpox in Mosul, and smallpox swept Baghdad from April to October so that no house was spared. In 424 smallpox befell the caliph himself when he entered the bath, and he was lifted out of it. In 425 death multiplied, especially among women in al-Hawaniq, and it was said that in Dhu al-Hijjah seventy thousand died in Baghdad {cite:muntazam-ibn-al-jawzi j.8 p.402} {cite:muntazam-ibn-al-jawzi j.8 p.411-412} {cite:muntazam-ibn-al-jawzi j.8 p.414} {cite:muntazam-ibn-al-jawzi j.8 p.419} {cite:muntazam-ibn-al-jawzi j.8 p.422}."
  es: "Las muertes se prolongaron durante cuatro años. En 422, la lluvia llegó tarde, los cuerpos se secaron, la tos y la enfermedad se multiplicaron, hasta el punto de que la venta de caldo se disparó. En 423, la epidemia se extendió por la India, Ghazna, Jorasán, Jurjan y al-Rayy; cuarenta mil personas fueron enterradas en Isfahán en pocos días, y en la tierra de al-Jibal, mientras que cuatro mil niños murieron de viruela en Mosul, y la viruela asoló Bagdad de abril a octubre, de modo que ninguna casa se salvó. En 424, la viruela afectó al propio califa cuando entró en el baño, y tuvieron que sacarlo de él. En 425 las muertes se multiplicaron, especialmente entre las mujeres en al-Hawaniq, y se decía que en Dhu al-Hijjah murieron setenta mil en Bagdad {cita:muntazam-ibn-al-jawzi j.8 p.402} {cita:muntazam-ibn-al-jawzi j.8 p.411-412} {cita:muntazam-ibn-al-jawzi j.8 p.414} {cita:muntazam-ibn-al-jawzi j.8 p.419} {cita:muntazam-ibn-al-jawzi j.8 p.422}."
  fr: "Les décès se poursuivirent pendant quatre ans. En 422, les pluies arrivèrent tardivement, les corps se desséchèrent, la toux et les maladies se multiplièrent, au point que le commerce du bouillon explosa. En 423, l'épidémie se propagea en Inde, à Ghazni, au Khorasan, au Jurjan et à al-Rayy; quarante mille personnes furent enterrées à Ispahan en quelques jours, ainsi qu'au pays d'al-Jibal, tandis que quatre mille garçons moururent de la variole à Mossoul. La variole ravagea Bagdad d'avril à octobre, sans qu'aucune maison ne soit épargnée. En 424, la variole frappa le calife lui-même alors qu'il prenait un bain, et il dut en sortir. En 425, les décès se multiplièrent, notamment parmi les femmes d'al-Hawaniq, et on dit qu'à Dhu al-Hijjah, soixante-dix mille moururent à Bagdad {cite:muntazam-ibn-al-jawzi j.8 p.402} {cite:muntazam-ibn-al-jawzi j.8 p.411-412} {cite:muntazam-ibn-al-jawzi j.8 p.414} {cite:muntazam-ibn-al-jawzi j.8 p.419} {cite:muntazam-ibn-al-jawzi j.8 p.422}."
  ur: "یہ اموات چار سال تک جاری رہیں۔ 422 میں بارش دیر سے ہوئی، لاشیں خشک ہو گئیں، کھانسی اور بیماریاں اس حد تک بڑھ گئیں کہ شوربے کی فروخت میں اضافہ ہوا۔ 423 میں یہ وبا ہندوستان، غزنہ، خراسان، جرجان اور الرّی میں پھیل گئی۔ چند دنوں میں اصفہان میں اور الجبل کی سرزمین میں چالیس ہزار کو دفن کیا گیا جبکہ موصل میں چیچک سے چار ہزار لڑکے مر گئے اور اپریل سے اکتوبر تک چیچک نے بغداد کو اپنی لپیٹ میں لے لیا تاکہ کوئی گھر بھی نہ بچا۔ 424 میں چیچک خود خلیفہ پر پڑی جب وہ حمام میں داخل ہوا تو اسے وہاں سے اٹھا لیا گیا۔ 425 میں موت کی تعداد میں کئی گنا اضافہ ہوا، خاص طور پر الحوانیق میں عورتوں میں، اور کہا جاتا ہے کہ ذی الحجہ میں بغداد میں ستر ہزار مرے {حوالہ:منتظم ابن الجوزی ج8 ص 402} {حوالہ:منتظم ابن الجوزی ج8ص414} {حوالہ:منتظم ابن الجوزی ج8ص419} {حوالہ:منتظم ابن الجوزی ج8ص422}"
  tr: "İki ölüm olayı dört yıl boyunca devam etti: 422'de yağmur gecikti, bu yüzden cesetler kurudu ve nezle ile öksürük arttı, çorba satışı yaygınlaştı; 423'te veba Hindistan, Gazne, Horasan, Curcan ve Rayy'a yayıldı ve İsfahan'da birkaç gün içinde kırk bin kişi gömüldü; dağlık bölgede, Musul'da dört bin erkek çocuk çiçek hastalığından öldü ve çiçek hastalığı Nisan'dan Ekim'e kadar Bağdat'a yayıldı, hiçbir ev kurtulamadı; 424'te Halife hamama girdiğinde çiçek hastalığına yakalandı, bu yüzden ayakta bekletildi. 425'te ölüm, özellikle Havaniq'taki kadınlar arasında arttı. Zilhicce ayında Bağdat'ta yetmiş bin kişinin öldüğü söylenir. {alıntı:muntazam-ibn-el-cevzi j.8 s.402} {alıntı:muntazam-ibn-el-cevzi j.8 s.411-412} {alıntı:muntazam-ibn-el-cevzi j.8 s.414} {alıntı:muntazam-ibn-el-cevzi j.8 s.419} {cite:muntazam-ibn-al-jawzi j.8 s.422}."
  id: "Dua wabah kematian berlanjut selama empat tahun: Pada tahun 422, hujan terlambat turun, sehingga mayat mengering, dan pilek serta batuk meningkat hingga penjualan sup menjadi populer; pada tahun 423, wabah menyebar ke seluruh India, Ghazna, Khorasan, Jurjan, dan Rayy, dan empat puluh ribu orang dimakamkan di Isfahan dalam beberapa hari, dan di wilayah pegunungan, empat ribu anak laki-laki meninggal di Mosul karena cacar, dan cacar menyebar ke seluruh Baghdad dari April hingga Oktober, sehingga tidak ada rumah yang terhindar; pada tahun 424, Khalifah sendiri tertular cacar ketika memasuki pemandian umum, sehingga ia disuruh berdiri. Pada tahun 425, kematian meningkat, terutama di kalangan wanita di Al-Hawaniq. Dikatakan bahwa pada bulan Dzul Hijjah, tujuh puluh ribu orang meninggal di Baghdad. {cite:muntazam-ibn-al-jawzi j.8 hal.402} {cite:muntazam-ibn-al-jawzi j.8 hal.411-412} {cite:muntazam-ibn-al-jawzi j.8 hal.414} {cite:muntazam-ibn-al-jawzi j.8 hal.419} {kutip:muntazam-ibn-al-jawzi j.8 hal.422}."
