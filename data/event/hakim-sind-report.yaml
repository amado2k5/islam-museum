label: { ar: "تقرير حكيم بن جبلة عن ثغر الهند", en: "Hakim ibn Jabala's Report on the Indian Frontier" }
summary:
  ar: "لما ولي عثمان بن عفان وولى عبد الله بن عامر بن كريز العراق كتب إليه يأمره أن يوجه إلى ثغر الهند من يعلم علمه وينصرف إليه بخبره فوجه حكيم بن جبلة العبدي فلما رجع أوعده إلى عثمان فسأله عن حال البلاد فقال يا أمير المؤمنين قد عرفتها وتنحرتها قال فصفها لي قال ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا فقال له عثمان أخائر أم ساجع فلم يغزها أحداً."
  en: "Uthman had Abdallah ibn Amir send Hakim ibn Jabala al-Abdi to scout the Indian frontier; his report — 'its water is scant, its fruit worthless, its thief a nobody; few troops would perish, many would starve' — drew the caliph's 'are you a poet or a rhymester?', and no campaign followed."
