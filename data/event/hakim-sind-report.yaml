label: { ar: "تقرير حكيم بن جبلة عن ثغر الهند", en: "Hakim ibn Jabala's Report on the Indian Frontier", es: "Informe de Hakim ibn Jabala sobre la frontera india", fr: "Rapport de Hakim ibn Jabala sur la frontière indienne", ur: "ہندوستانی سرحد پر حکیم ابن جبلہ کی رپورٹ", tr: "Hakim ibn Jabalah'ın Hindistan sınırına ilişkin raporu", id: "Laporan Hakim ibn Jabalah di perbatasan India" }
summary:
  ar: "لما ولي عثمان بن عفان وولى عبد الله بن عامر بن كريز العراق كتب إليه يأمره أن يوجه إلى ثغر الهند من يعلم علمه وينصرف إليه بخبره فوجه حكيم بن جبلة العبدي فلما رجع أوعده إلى عثمان فسأله عن حال البلاد فقال يا أمير المؤمنين قد عرفتها وتنحرتها قال فصفها لي قال ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا فقال له عثمان أخائر أم ساجع فلم يغزها أحداً."
  en: "Uthman had Abdallah ibn Amir send Hakim ibn Jabala al-Abdi to scout the Indian frontier; his report — 'its water is scant, its fruit worthless, its thief a nobody; few troops would perish, many would starve' — drew the caliph's 'are you a poet or a rhymester?', and no campaign followed."
  es: "Uthman ordenó a Abdallah ibn Amir que enviara a Hakim ibn Jabala al-Abdi a explorar la frontera india; su informe —«su agua es escasa, su fruta no vale nada, su ladrón es un don nadie; pocas tropas perecerían, muchas morirían de hambre»— provocó que el califa le preguntara «¿eres poeta o rimador?», y no se llevó a cabo ninguna campaña."
  fr: "Uthman chargea Abdallah ibn Amir d'envoyer Hakim ibn Jabala al-Abdi explorer la frontière indienne; son rapport — « son eau est rare, ses fruits sans valeur, son voleur un inconnu; peu de troupes périraient, beaucoup mourraient de faim » — provoqua chez le calife le « es-tu un poète ou un rimeur ? », et aucune campagne ne suivit."
  ur: "عثمان نے عبداللہ بن عامر نے حکیم ابن جبلہ العبدی کو ہندوستانی سرحدوں کی تلاش کے لیے بھیجا۔ اس کی رپورٹ - 'اس کا پانی کم ہے، اس کا پھل بیکار ہے، اس کا چور کوئی نہیں ہے۔ چند فوجی ہلاک ہو جائیں گے، بہت سے بھوکے مر جائیں گے' - خلیفہ کی طرف متوجہ کیا 'کیا تم شاعر ہو یا شاعر؟'، اور کوئی مہم نہیں چلائی گئی۔"
  tr: "Osman ibn Affan göreve geldiğinde ve Abdullah ibn Amir ibn Kurayz'ı Irak valiliğine atadığında, ona Hindistan sınırına, sırlarını bilen ve kendisine haber getirecek birini göndermesini emretti. Böylece Hakim ibn Jabalah al-Abdi'yi gönderdi. Hakim döndüğünde, Osman'a söz verdi. Osman ona ülkenin durumu hakkında sorular sordu. Hakim, \"Ey Müminlerin Komutanı, ben orayı biliyorum ve ziyaret ettim\" dedi. Osman, \"Öyleyse bana anlat\" dedi. Hakim, \"Suyu kıt, meyvesi kalitesiz ve hırsızları kahraman. Oradaki ordu azsa yok olur, büyükse aç kalır\" dedi. Osman ona, \"Bu bir bilmece mi yoksa bir tekerleme mi?\" dedi. Bu yüzden orayı fethetmek için kimseyi göndermedi."
  id: "Ketika Utsman bin Affan menjabat dan mengangkat Abdullah bin Amir bin Kurayz sebagai gubernur Irak, ia menulis surat kepadanya memerintahkannya untuk mengirim seseorang ke perbatasan India yang mengetahui rahasianya dan akan kembali kepadanya dengan kabar tentang hal itu. Maka ia mengirim Hakim bin Jabalah al-Abdi. Ketika ia kembali, ia menjanjikannya kepada Utsman, yang menanyakan kepadanya tentang keadaan negara itu. Ia berkata, “Wahai Amirul Mukminin, aku mengetahuinya dan telah mengunjunginya.” Utsman berkata, “Kalau begitu, gambarkan kepadaku.” Ia berkata, “Airnya langka, buah-buahannya berkualitas buruk, dan para pencurinya adalah pahlawan. Jika pasukannya sedikit, mereka akan kalah, dan jika banyak, mereka akan kelaparan.” Utsman berkata kepadanya, “Apakah ini teka-teki atau sajak?” Maka ia tidak mengirim siapa pun untuk menaklukkannya."
