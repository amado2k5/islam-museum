label: { ar: "تقرير حكيم بن جبلة عن ثغر الهند", en: "Hakim ibn Jabala's Report on the Indian Frontier", es: "Informe de Hakim ibn Jabala sobre la frontera india", fr: "Rapport de Hakim ibn Jabala sur la frontière indienne" }
summary:
  ar: "لما ولي عثمان بن عفان وولى عبد الله بن عامر بن كريز العراق كتب إليه يأمره أن يوجه إلى ثغر الهند من يعلم علمه وينصرف إليه بخبره فوجه حكيم بن جبلة العبدي فلما رجع أوعده إلى عثمان فسأله عن حال البلاد فقال يا أمير المؤمنين قد عرفتها وتنحرتها قال فصفها لي قال ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا فقال له عثمان أخائر أم ساجع فلم يغزها أحداً."
  en: "Uthman had Abdallah ibn Amir send Hakim ibn Jabala al-Abdi to scout the Indian frontier; his report — 'its water is scant, its fruit worthless, its thief a nobody; few troops would perish, many would starve' — drew the caliph's 'are you a poet or a rhymester?', and no campaign followed."
  es: "Uthman ordenó a Abdallah ibn Amir que enviara a Hakim ibn Jabala al-Abdi a explorar la frontera india; su informe —«su agua es escasa, su fruta no vale nada, su ladrón es un don nadie; pocas tropas perecerían, muchas morirían de hambre»— provocó que el califa le preguntara «¿eres poeta o rimador?», y no se llevó a cabo ninguna campaña."
  fr: "Uthman chargea Abdallah ibn Amir d'envoyer Hakim ibn Jabala al-Abdi explorer la frontière indienne; son rapport — « son eau est rare, ses fruits sans valeur, son voleur un inconnu; peu de troupes périraient, beaucoup mourraient de faim » — provoqua chez le calife le « es-tu un poète ou un rimeur ? », et aucune campagne ne suivit."
