id: event/uthman-iqta-grants
class: event
kind: other
label: { ar: "قطائع عثمان بالعراق", en: "Uthman's Land-Grants in Iraq" }
summary:
  ar: "عند البلاذري عن موسى بن طلحة: أول من أقطع العراق عثمان بن عفان أقطع قطائع من صوافي كسرى وما كان من أرض الجالية فأقطع طلحة النشاستج وأقطع واثل بن حجر الحضرمي ما والى أرارة وأقطع خباب بن الأرت اسبينا وأقطع عدي بن حاتم الطائي الروحاء وأقطع خالد بن عرفطة أرضاً عند حمام أعين وأقطع الأشعث بن قيس الكندي طيزناباذ وأقطع جرير بن عبد الله البجلي أرضه على شاطئ الفرات وأقطع عبد الله بن مسعود أرضاً بالنهرين وأقطع عمار بن ياسر اسبينا وأقطع خباب بن الأرت صعنبا وأقطع سعداً قرية هرمز وأقطع طلحة بن عبيد الله النشاستج وأقطع أسامة بن زيد أرضاً باعها وكان ابن مسعود وسعد يعطيان أرضيهما بالثلث والربع."
  en: "In al-Baladhuri via Musa ibn Talha: the first to make land-grants in Iraq was Uthman ibn Affan, granting qata'i' from Khusraw's safaya and the Jalandima land — Talha's al-Nashastaj, Wathil ibn Hujr al-Hadrami's land adjoining Urara, Khabbab ibn al-Aratt's Istiniya, Adi ibn Hatim al-Ta'i's al-Rawha', Khalid ibn Urfuta's land by Hammam A'yan, al-Ash'ath ibn Qays al-Kindi's Tizanabadh, Jarir ibn Abdallah al-Bajali's land on the Euphrates bank, Abdallah ibn Mas'ud's land at al-Nahrayn, Ammar ibn Yasir's Istiniya, Khabbab's Sa'naba, Sa'd's village of Hurmuz, Talha ibn Ubayd Allah's al-Nashastaj, and Usama ibn Zayd's land which he sold; Ibn Mas'ud and Sa'd let their lands at a third and a quarter crop-share."
