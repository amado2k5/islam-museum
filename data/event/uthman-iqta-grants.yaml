id: event/uthman-iqta-grants
class: event
kind: other
label: { ar: "قطائع عثمان بالعراق", en: "Uthman's Land-Grants in Iraq", es: "Las concesiones de tierras de Uthman en Irak", fr: "Les concessions de terres d'Uthman en Irak", ur: "عراق میں عثمان کی زمینی گرانٹس", tr: "Osmanlı'nın Irak'taki toprakları", id: "Wilayah Ottoman di Irak" }
summary:
  ar: "عند البلاذري عن موسى بن طلحة: أول من أقطع العراق عثمان بن عفان أقطع قطائع من صوافي كسرى وما كان من أرض الجالية فأقطع طلحة النشاستج وأقطع واثل بن حجر الحضرمي ما والى أرارة وأقطع خباب بن الأرت اسبينا وأقطع عدي بن حاتم الطائي الروحاء وأقطع خالد بن عرفطة أرضاً عند حمام أعين وأقطع الأشعث بن قيس الكندي طيزناباذ وأقطع جرير بن عبد الله البجلي أرضه على شاطئ الفرات وأقطع عبد الله بن مسعود أرضاً بالنهرين وأقطع عمار بن ياسر اسبينا وأقطع خباب بن الأرت صعنبا وأقطع سعداً قرية هرمز وأقطع طلحة بن عبيد الله النشاستج وأقطع أسامة بن زيد أرضاً باعها وكان ابن مسعود وسعد يعطيان أرضيهما بالثلث والربع."
  en: "In al-Baladhuri via Musa ibn Talha: the first to make land-grants in Iraq was Uthman ibn Affan, granting qata'i' from Khusraw's safaya and the Jalandima land — Talha's al-Nashastaj, Wathil ibn Hujr al-Hadrami's land adjoining Urara, Khabbab ibn al-Aratt's Istiniya, Adi ibn Hatim al-Ta'i's al-Rawha', Khalid ibn Urfuta's land by Hammam A'yan, al-Ash'ath ibn Qays al-Kindi's Tizanabadh, Jarir ibn Abdallah al-Bajali's land on the Euphrates bank, Abdallah ibn Mas'ud's land at al-Nahrayn, Ammar ibn Yasir's Istiniya, Khabbab's Sa'naba, Sa'd's village of Hurmuz, Talha ibn Ubayd Allah's al-Nashastaj, and Usama ibn Zayd's land which he sold; Ibn Mas'ud and Sa'd let their lands at a third and a quarter crop-share."
  es: "En al-Baladhuri a través de Musa ibn Talha: el primero en otorgar concesiones de tierras en Irak fue Uthman ibn Affan, otorgando qata'i' de la safaya de Khusraw y la tierra de Jalandima: al-Nashastaj de Talha, la tierra de Wathil ibn Hujr al-Hadrami contigua a Urara, Istiniya de Khabbab ibn al-Aratt, Adi ibn Hatim al-Rawha' de al-Ta'i, la tierra de Khalid ibn Urfuta junto a Hammam A'yan, el Tizanabadh de al-Ash'ath ibn Qays al-Kindi, la tierra de Jarir ibn Abdallah al-Bajali en la orilla del Éufrates, la tierra de Abdallah ibn Mas'ud en al-Nahrayn, la Istiniya de Ammar ibn Yasir, Sa'naba de Khabbab, la aldea de Sa'd de Hurmuz, Talha ibn Ubayd Allah's al-Nashastaj y Usama ibn Zayd vendieron sus tierras; Ibn Mas'ud y Sa'd arrendaron sus tierras a razón de un tercio y un cuarto de la cosecha."
  fr: "À al-Baladhuri via Musa ibn Talha: le premier à accorder des concessions de terres en Irak fut Uthman ibn Affan, accordant des qata'i 'de la safaya de Khusraw et de la terre de Jalandima - al-Nashastaj de Talha, la terre de Wathil ibn Hujr al-Hadrami adjacente à Urara, l'Istiniya de Khabbab ibn al-Aratt, Adi ibn Hatim al-Rawha' d'al-Ta'i, la terre de Khalid ibn Urfuta près de Hammam A'yan, la terre de Tizanabadh d'al-Ash'ath ibn Qays al-Kindi, la terre de Jarir ibn Abdallah al-Bajali sur la rive de l'Euphrate, la terre d'Abdallah ibn Mas'ud à al-Nahrayn, l'Istiniya d'Ammar ibn Yasir, la Sa'naba de Khabbab, Le village de Saad de Hurmuz, de Talha ibn Ubayd Allah's al-Nashastaj, et de la terre d'Usama ibn Zayd qu'il a vendue; Ibn Mas'ud et Sa'd ont loué leurs terres à un tiers et un quart de la récolte."
  ur: "البلادوری میں موسیٰ بن طلحہ کے ذریعے: عراق میں زمین دینے والے سب سے پہلے عثمان بن عفان تھے، انہوں نے خسرو کی صفیہ اور جالندیمہ کی زمین سے قطعی عطا کی تھی- طلحہ کی النستاج، واثل بن حجر الحدرمی کی زمین اُربابت، الخضراء کی زمین۔ استنیہ، عدی بن حاتم الطائی کی الرواہ، خالد بن عرفوطہ کی زمین از ہمام عیان، اشعث بن قیس الکندی کی تزان آباد، جریر بن عبداللہ البجلی کی فرات کے کنارے کی سرزمین، عمارۃ النبی کی سرزمین۔ ابن یاسر کا استنیہ، خباب کا صعنبہ، سعد کا گاؤں ہرمز، طلحہ بن عبید اللہ کا النستاج، اور اسامہ بن زید کی وہ زمین جو اس نے بیچی تھی۔ ابن مسعود اور سعد نے اپنی زمینیں ایک تہائی اور چوتھائی فصل کے حصے میں دیں۔"
  tr: "El-Baladhuri, Musa bin Talha'dan rivayetle şöyle demiştir: Irak'ta toprak bağışlayan ilk kişi Osman bin Affan'dır. O, Kisra'nın temiz topraklarından ve ümmet topraklarından toprak bağışlamıştır. O, Talha el-Nashastaj'a, Wathil bin Hajar el-Hadrami'ye Arara'ya bitişik olan bölgeyi, Khabbab bin el-Aratt Asbina'ya, Adi bin Hatim el-Ta'i el-Rawha'ya, Halid bin Arfata'ya Hammam A'yan yakınlarındaki araziyi, el-Ash'ath bin Qais el-Kindi Tayznabad'ı, Jarir bin Abdullah el-Bajali'ye Fırat Nehri kıyısındaki arazisini, Abdullah bin Masoud'a iki nehir kıyısındaki araziyi, Ammar bin Yasir Asbina'yı, Khabbab bin el-Aratt Sa'naba'yı, Sa'd'a Hormuz köyünü, Talha bin Ubaid Allah el-Nashastaj'a ve Usama bin Zaid'e sattığı araziyi verdi. İbn Masoud ve Sa'd, arazilerini üçte bir ve dörtte bir oranında veriyorlardı."
  id: "Al-Baladhuri, berdasarkan riwayat Musa bin Talha, berkata: Orang pertama yang memberikan tanah di Irak adalah Utsman bin Affan. Beliau memberikan tanah dari tanah suci Kisra dan dari tanah milik masyarakat. Dia memberikan tanah kepada Talha al-Nashastaj, dan dia memberikan tanah kepada Wathil bin Hajar al-Hadrami yang berdekatan dengan Arara, dan dia memberikan tanah kepada Khabbab bin al-Aratt di Asbina, dan dia memberikan tanah kepada Adi bin Hatim al-Ta’i al-Rawha’, dan dia memberikan tanah kepada Khalid bin Arfata di dekat Hammam A’yan, dan dia memberikan tanah kepada al-Ash’ath bin Qais al-Kindi di Tayznabad, dan dia memberikan tanah kepada Jarir bin Abdullah al-Bajali di tepi Sungai Eufrat, dan dia memberikan tanah kepada Abdullah bin Masoud di dua sungai, dan dia memberikan tanah kepada Ammar bin Yasir di Asbina, dan dia memberikan tanah kepada Khabbab bin al-Aratt di Sa’naba, dan dia memberikan tanah kepada Sa’d di desa Hormuz, dan dia memberikan tanah kepada Talha bin Ubaid di Allah al-Nashastaj, dan dia memberikan tanah kepada Usama bin Zaid yang kemudian dijualnya. Ibn Masoud dan Sa’d biasa memberikan tanah mereka dengan harga sepertiga seperempat."
