label: { ar: "موت السلطان شرف الدولة وفوضى بغداد", en: "Death of Sharaf al-Dawla and Anarchy in Baghdad", fr: "La mort de Sharaf al-Dawla et l'anarchie à Bagdad", es: "Muerte de Sharaf al-Dawla y anarquía en Bagdad", ur: "شرف الدولہ کی موت اور بغداد میں انارکی", tr: "Sultan Şaraf el-Davla'nın ölümü ve Bağdat'taki kaos", id: "Kematian Sultan Sharaf al-Dawla dan kekacauan di Baghdad" }
summary:
  ar: "في سنة ست عشرة وأربعمائة مات السلطان شرف الدولة ونُهبت خزائنه، وتسلطن جلال الدولة أبو طاهر ولد بهاء الدولة وهو بالبصرة فخلع على وزيره علم الدين شرف الملك أبي سعيد بن ماكولا، ثم إن الجند عدلوا إلى الملك أبي كاليجار ونوّهوا باسمه وكان وليّ عهد أبيه سلطان الدولة فخُطب له ببغداد؛ واخْتَبط الناس وأخذت العيّارون الناس جهاراً وكانوا يمشون بالليل بالشمع والمشاعل ويكبسون البيت ويأخذون صاحبه ويعذبونه حتى يقرّ لهم بذخائره، وأحرقوا دار الشريف المرتضى ولم يخرج ركب من بغداد {cite:shadharat-dhahab p. 204}."
  en: "In 416 Sultan Sharaf al-Dawla died and his treasuries were looted; Jalal al-Dawla Abu Tahir b. Baha' al-Dawla succeeded from Basra, but the soldiery defected to al-Malik Abu Kalijar, heir of his father Sultan al-Dawla, who was proclaimed at Baghdad. The city broke down: night-roaming gangs robbed openly, broke into houses and tortured owners for their hoards, burned the house of al-Sharif al-Murtada, and no caravan left Baghdad {cite:shadharat-dhahab p. 204}."
  fr: "En 416 mourut le sultan Sharaf al-Dawla et ses trésors furent pillés ; Jalal al-Dawla Abu Tahir ibn Baha' al-Dawla lui succéda depuis Bassora, mais la soldatesque passa à al-Malik Abu Kalijar, héritier de son père le sultan al-Dawla, qui fut proclamé à Bagdad. La ville sombra : des bandes nocturnes volaient ouvertement, forçaient les maisons et torturaient les propriétaires pour leurs trésors, incendièrent la maison d'al-Sharif al-Murtada, et aucune caravane ne quitta Bagdad {cite:shadharat-dhahab p. 204}."
  es: "En 416 murió el sultán Sharaf al-Dawla y sus tesoros fueron saqueados; Jalal al-Dawla Abu Tahir b. Baha' al-Dawla sucedió en Basora, pero la milicia desertó y se pasó al bando de al-Malik Abu Kalijar, heredero de su padre, el sultán al-Dawla, quien fue proclamado en Bagdad. La ciudad se sumió en el caos: bandas nocturnas robaban abiertamente, irrumpían en las casas y torturaban a los dueños para apoderarse de sus tesoros, incendiaron la casa de al-Sharif al-Murtada y ninguna caravana salía de Bagdad {cita: shadharat-dhahab p. 204}."
  ur: "416 میں سلطان شرف الدولہ کا انتقال ہوا اور اس کے خزانے لوٹ لیے گئے۔ جلال الدولہ ابو طاہر ب۔ بہاء الدولہ بصرہ سے کامیاب ہوا، لیکن سپاہی اپنے والد سلطان الدولہ کے وارث الملک ابو کلیجار کے پاس چلی گئی، جسے بغداد میں اعلان کیا گیا تھا۔ شہر ٹوٹ گیا: رات کو گھومنے والے گروہوں نے کھلے عام لوٹ مار کی، گھروں میں گھس کر ان کے ذخیرے کے لیے مالکان کو تشدد کا نشانہ بنایا، شریف المرتضیٰ کے گھر کو جلایا، اور کوئی قافلہ بغداد سے نہ نکلا۔ 204}۔"
  tr: "Hicri 416 yılında Sultan Şaraf el-Davla öldü ve hazinesi yağmalandı. Bahâ' el-Davla'nın oğlu Celal el-Davla Ebu Tahir, Basra'dayken sultan oldu. Veziri Alam el-Din Şaraf el-Malik Ebu Sa'id ibn Makula'ya şeref cübbesi verdi. Ardından askerler Kral Ebu Kalijar'a yöneldiler ve onun adını duyurdular. O, babası Sultan el-Davla'nın veliaht prensiydi ve Bağdat'ta cuma hutbesi onun adına okundu. Halk karışıklık içindeydi ve eşkıyalar açıkça insanları yakalıyordu. Geceleyin mum ve meşalelerle dolaşıp evlere giriyor, sahiplerini yakalayıp hazineleri hakkında itiraf edene kadar işkence ediyorlardı. Şerif el-Murtada'nın evini yaktılar ve Bağdat'tan hiçbir kervan ayrılmadı. {kaynak:şadharat-dhahab s. 204}"
  id: "Pada tahun 416 H, Sultan Sharaf al-Dawla wafat dan harta bendanya dijarah. Jalal al-Dawla Abu Tahir, putra Baha' al-Dawla, menjadi Sultan saat berada di Basra. Ia menganugerahkan jubah kehormatan kepada menterinya, Alam al-Din Sharaf al-Malik Abu Sa'id ibn Makula. Kemudian para prajurit beralih kepada Raja Abu Kalijar dan memperkenalkan namanya. Ia adalah putra mahkota ayahnya, Sultan al-Dawla, dan khutbah Jumat disampaikan atas namanya di Baghdad. Rakyat berada dalam keadaan kebingungan, dan para perampok secara terang-terangan menangkap orang-orang. Mereka berjalan di malam hari dengan lilin dan obor, menerobos masuk ke rumah-rumah, menangkap pemiliknya, dan menyiksa mereka sampai mereka mengaku tentang harta benda mereka. Mereka membakar rumah Sharif al-Murtada, dan tidak ada kafilah yang meninggalkan Baghdad. {cite:shadharat-dhahab hlm. 204}"
