id: event/baghdad-anarchy-416
class: event
kind: civil-war
label: { ar: "موت السلطان شرف الدولة وفوضى بغداد" }
summary:
  ar: "في سنة ست عشرة وأربعمائة مات السلطان شرف الدولة ونُهبت خزائنه، وتسلطن جلال الدولة أبو طاهر ولد بهاء الدولة وهو بالبصرة فخلع على وزيره علم الدين شرف الملك أبي سعيد بن ماكولا، ثم إن الجند عدلوا إلى الملك أبي كاليجار ونوّهوا باسمه وكان وليّ عهد أبيه سلطان الدولة فخُطب له ببغداد؛ واخْتَبط الناس وأخذت العيّارون الناس جهاراً وكانوا يمشون بالليل بالشمع والمشاعل ويكبسون البيت ويأخذون صاحبه ويعذبونه حتى يقرّ لهم بذخائره، وأحرقوا دار الشريف المرتضى ولم يخرج ركب من بغداد {cite:shadharat-dhahab p. 204}."
  en: "In 416 Sultan Sharaf al-Dawla died and his treasuries were looted; Jalal al-Dawla Abu Tahir b. Baha' al-Dawla succeeded from Basra, but the soldiery defected to al-Malik Abu Kalijar, heir of his father Sultan al-Dawla, who was proclaimed at Baghdad. The city broke down: night-roaming gangs robbed openly, broke into houses and tortured owners for their hoards, burned the house of al-Sharif al-Murtada, and no caravan left Baghdad {cite:shadharat-dhahab p. 204}."
