id: event/al-hadi-reaches-al-hisn-and-refuses-ibn-bistams-apology-for-banu-al-harith-295
class: event
kind: other
label:
  ar: "الهادي يصل الحصن ويرفض اعتذار ابن بسطام عن بني الحارث، شوال سنة 295هـ، ص354"
  en: "Al-Hadi reaches al-Hisn and refuses Ibn Bistam's apology for Banu al-Harith, Shawwal 295 AH, p. 354"
  ur: "ہادی کا الحصن پہنچنا اور بنو الحارث کی طرف سے ابن بسطام کی معذرت مسترد کرنا، شوال 295ھ، ص354"
  es: "Al-Hadi llega a al-Hisn y rechaza la disculpa de Ibn Bistam por Banu al-Harith, Shawwal 295 AH, p. 354"
summary:
  ar: "وصل الهادي إلى الحصن في شوال سنة 295هـ، فلقيه ابن بسطام معتذراً عن بني الحارث، فلم يقبل منه الإمام دون مسألة أبي جعفر محمد بن عبيد الله وكشف الأمور، فرجع ابن بسطام مغموماً، ثم دخل الهادي القرية ونزل في داره."
  en: "Al-Hadi reached al-Hisn in Shawwal 295. Ibn Bistam met him and apologised for Banu al-Harith, but al-Hadi would not accept the apology without questioning Abu Ja'far Muhammad ibn Ubaydallah and clarifying the whole matter. Ibn Bistam went home downcast. Al-Hadi then entered the village and lodged in a house there."
  ur: "ہادی شوال 295ھ میں الحصن پہنچا۔ ابن بسطام نے بنو الحارث کی طرف سے معذرت کی، مگر ابو جعفر محمد بن عبیداللہ سے پوچھ گچھ اور معاملات واضح کیے بغیر ہادی نے معذرت قبول نہ کی۔ ابن بسطام افسردہ ہو کر لوٹ گیا، پھر ہادی بستی میں داخل ہوا اور ایک گھر میں ٹھہرا۔"
  es: "Al-Hadi llegó a al-Hisn en Shawwal de 295. Ibn Bistam lo recibió y se disculpó por los Banu al-Harith, pero Al-Hadi no aceptó la disculpa sin antes interrogar a Abu Ja'far Muhammad ibn Ubaydallah y aclarar todo el asunto. Ibn Bistam regresó a casa cabizbajo. Al-Hadi entró entonces en la aldea y se hospedó en una casa."
