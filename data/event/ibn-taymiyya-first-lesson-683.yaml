label:
  ar: "أول درس لابن تيمية في السكرية بدمشق، ٦٨٣هـ/١٢٨٤م"
  en: "Ibn Taymiyya's first lesson at the Sukkariyya, Damascus, 683/1284"
  ur: "ابن تیمیہ کا پہلا درس، مدرسہ سکریہ دمشق، 683ھ/1284ء"
summary:
  ar: "خلف ابن تيمية أباه عبد الحليم (ت ٦٨٢هـ/١٢٨٤م) في وظيفته بمدرسة السكرية، فألقى أول درس له فيها يوم ٢ محرم ٦٨٣هـ/٢١ مارس ١٢٨٤م، وبعد سنة، في ١ صفر ٦٨٤هـ/١٧ أبريل ١٢٨٥م، شرع يدرّس التفسير {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  en: "Succeeding his father Abd al-Halim (d. 682/1284) in his post at the Sukkariyya madrasa, Ibn Taymiyya gave his first lesson there on 2 Muharram 683/21 March 1284; a year later, on 1 Safar 684/17 April 1285, he began teaching Qur'anic exegesis {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  ur: "اپنے والد عبد الحلیم (وفات 682ھ/1284ء) کی جگہ مدرسہ سکریہ کا منصب سنبھالتے ہوئے ابن تیمیہ نے وہاں 2 محرم 683ھ/21 مارچ 1284ء کو پہلا درس دیا؛ ایک سال بعد، 1 صفر 684ھ/17 اپریل 1285ء کو، انہوں نے تفسیر پڑھانا شروع کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}۔"
