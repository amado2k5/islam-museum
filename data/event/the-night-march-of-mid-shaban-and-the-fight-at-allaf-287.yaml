label:
  ar: "مسير ليلة النصف من شعبان والقتال في علاف، 287هـ"
  en: "The night march of mid-Sha'ban and the fight at Allaf, 287 AH"
  ur: "نصف شعبان کی رات کی روانگی اور علاف کی لڑائی، 287ھ"
summary:
  ar: "قبل النصف من شعبان بيومين دعا الهادي بني سعد ثم خرج ليلة النصف إلى مصلى خارج صعدة ثم إلى نسرين، وأرسل جماعة لتلزم أكمة بعلاف، وفي الغداة عبّأ عسكره بالبقعة وقاتل القوم وقُتل فارس منهم يسمى ابن عبد الأعلى."
  en: "Two days before mid-Sha'ban al-Hadi called out Banu Sa'd, left Sa'da on the night of the fifteenth for a prayer-ground outside it and then Nasrin, sent a party to hold a rise at Allaf, and next morning drew up his army at al-Buq'a and fought; a rider called Ibn Abd al-A'la was killed."
  ur: "نصف شعبان سے دو دن پہلے ہادی نے بنو سعد کو بلایا، پندرھویں رات صعدہ سے باہر ایک نماز گاہ اور پھر نسرین گئے، ایک جماعت کو علاف کے ایک ٹیلے پر رکنے بھیجا، اور صبح البقعہ میں لشکر کی صف بندی کر کے لڑے؛ ابن عبد الاعلیٰ نامی ایک سوار مارا گیا۔"
