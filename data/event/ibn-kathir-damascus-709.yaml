id: event/ibn-kathir-damascus-709
class: event
kind: migration
label:
  ar: "انتقال ابن كثير إلى دمشق ونشأته بها، نحو ٧٠٩هـ"
  en: "Ibn Kathir moves to Damascus and grows up there, about 709/1309"
  ur: "ابن کثیر کا دمشق منتقل ہونا اور وہیں پرورش، تقریباً 709ھ/1309ء"
  es: "Ibn Kathir se traslada a Damasco y crece allí, alrededor del año 709/1309."
  fr: "Ibn Kathir s'installe à Damas et y grandit, vers 709/1309."
  tr: "İbn Kathir'in Hicri 709 civarında Şam'a taşınması ve orada yetişmesi."
  id: "Kepindahan Ibn Kathir ke Damaskus dan masa kecilnya di sana, sekitar tahun 709 Hijriah."
summary:
  ar: "قال الزركلي: انتقل مع أبيه إلى دمشق سنة ٧٠٩هـ {cite:al-aalam 1/112}؛ وقال ابن حجر في الدرر: مات أبوه سنة ٧٠٣هـ ونشأ هو بدمشق، فسمع من ابن الشحنة وابن الزراد وإسحاق الآمدي وابن عساكر والمزي وابن الرضي وطائفة، وأجاز له من مصر الدبوسي واللواني والختني وغيرهم {cite:durar-kamina-jil-1993 1/374}."
  en: "Al-Zirikli says he moved with his father to Damascus in 709 {cite:al-aalam 1/112}; Ibn Hajar records that his father died in 703 and that the boy grew up in Damascus, hearing from Ibn al-Shihna, Ibn al-Zarrad, Ishaq al-Amidi, Ibn 'Asakir, al-Mizzi and Ibn al-Raddi among others, with ijazas from Egyptian scholars {cite:durar-kamina-jil-1993 1/374}."
  ur: "زرکلی کے مطابق وہ اپنے والد کے ساتھ 709ھ میں دمشق منتقل ہوئے {cite:al-aalam 1/112}؛ ابن حجر لکھتے ہیں کہ ان کے والد 703ھ میں فوت ہوئے اور وہ دمشق میں پلے، جہاں انہوں نے ابن الشحنہ، ابن زراد، اسحاق آمدی، ابن عساکر، مزی اور ابن رضی سمیت دیگر سے سماعت کی اور مصری علماء سے اجازتیں حاصل کیں {cite:durar-kamina-jil-1993 1/374}۔"
  es: "Al-Zirikli dice que se mudó con su padre a Damasco en 709 {cite:al-aalam 1/112}; Ibn Hajar registra que su padre murió en 703 y que el niño creció en Damasco, escuchando a Ibn al-Shihna, Ibn al-Zarrad, Ishaq al-Amidi, Ibn 'Asakir, al-Mizzi e Ibn al-Raddi, entre otros, con ijazas de eruditos egipcios {cite:durar-kamina-jil-1993 1/374}."
  fr: "Al-Zirikli dit qu'il a déménagé avec son père à Damas en 709 {cite:al-aalam 1/112}; Ibn Hajar rapporte que son père est mort en 703 et que le garçon a grandi à Damas, écoutant Ibn al-Shihna, Ibn al-Zarrad, Ishaq al-Amidi, Ibn 'Asakir, al-Mizzi et Ibn al-Raddi entre autres, avec des ijazas de savants égyptiens {cite:durar-kamina-jil-1993 1/374}."
  tr: "El-Zarkali şöyle demiştir: Babasıyla birlikte Hicri 709 yılında Şam'a taşındı. {al-aalam 1/112} İbn Hacer ise El-Durar'da şöyle demiştir: Babası Hicri 703 yılında vefat etti ve Şam'da büyüdü. İbn Şahna, İbn El-Zarrad, İshak El-Amidi, İbn Asakir, El-Mizzi, İbn El-Radi ve bir grup insandan bilgi aldı ve El-Dabusi, El-Lawani, El-Hatni ve diğerleri tarafından Mısır'dan izin verildi. {durar-kamina-jil-1993 1/374}"
  id: "Al-Zarkali berkata: Dia pindah bersama ayahnya ke Damaskus pada tahun 709 H {kutip: al-aalam 1/112}; dan Ibn Hajar berkata dalam Al-Durar: Ayahnya meninggal pada tahun 703 H dan dia dibesarkan di Damaskus, sehingga dia mendengar dari Ibn Al-Shahna, Ibn Al-Zarrad, Ishaq Al-Amidi, Ibn Asakir, Al-Mizzi, Ibn Al-Radi dan sekelompok orang, dan dia mendapat izin dari Mesir dari Al-Dabusi, Al-Lawani, Al-Khatni dan lainnya {kutip: durar-kamina-jil-1993 1/374}."
