id: event/al-hadi-is-hemmed-in-and-the-tabaris-ask-him-to-leave-290
class: event
kind: other
label:
  ar: "إحاطة القوم بالهادي وإلحاح الطبريين عليه بالخروج وشقّه طريقه جريحاً، رجب 290هـ"
  en: "Al-Hadi is hemmed in, the Tabaris ask him to leave and he breaks through wounded, Rajab 290 AH"
  ur: "ہادی کا گھر جانا، طبریوں کا ان سے نکل جانے کی التجا کرنا اور ان کا زخمی ہو کر راستہ بنانا، رجب 290ھ"
summary:
  ar: "وجّه الهادي ابنه أحمد إلى الدعام يسأله أن يصير إليه بمن معه فرده بقوله إن على أبيه أن ينجو بنفسه، وقال له ابنه أبو القاسم أن يتخلص، فهمّ بالنزول ليقاتل مع الطبريين فسألوه ألا يفعل وقالوا له إن بقاءه خير للدين، فمضى يقاتل ومن معه ثم لحقه القوم برماحهم فكسر رمحاً بيده ونفذ وبه جراح كبيرة."
  en: "al-Hadi sent his son Ahmad to al-Da'am asking him to come to him with his men and was answered that he should save himself; his son Abu al-Qasim told him to get clear, he moved to dismount and fight with the Tabaris, and they begged him not to, telling him his survival was better for the faith; he rode on, fighting with those with him, then the men reached him with their spears, he broke one with his hand and got through with great wounds."
  ur: "ہادی نے اپنے بیٹے احمد کو دعام کے پاس بھیجا کہ وہ اپنے ساتھیوں سمیت ان کے پاس آئیں تو جواب ملا کہ وہ اپنی جان بچائیں؛ ان کے بیٹے ابو القاسم نے انہیں نکل جانے کو کہا، وہ طبریوں کے ساتھ لڑنے کے لیے اترنے لگے تو انہوں نے التجا کی کہ ایسا نہ کریں اور کہا کہ ان کا زندہ رہنا دین کے لیے بہتر ہے؛ وہ ساتھیوں کے ساتھ لڑتے ہوئے آگے بڑھے، پھر مخالفوں نے نیزوں سے انہیں جا لیا، انہوں نے ہاتھ سے ایک نیزہ توڑا اور بڑے زخموں کے ساتھ نکل گئے۔"
