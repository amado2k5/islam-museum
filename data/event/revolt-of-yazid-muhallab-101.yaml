label: { ar: "ثورة يزيد بن المهلب ويوم العقر" }
summary:
  ar: "خرج يزيد بن المهلب سنة إحدى ومائة فأقبل إلى البصرة وقد جمع علي بن أرطاة نائبها أهلها وخندق عليها، فجمع محمد بن المهلب رجالاً من أهل بيته ومواليه وأقبل في كتيبة تَهُول من رآها وشد على أهل البصرة، واستقبله المغيرة بن عبد الله الثقفي في الخيل ليحمل عليه فأفرج له عن الطريق، وأقبل يزيد لا يمر بخيل من خيلهم ولا قبيلة من قبائلهم إلا تنحت له عن السبيل حتى نزل داره واختلف الناس إليه، فبعث إلى علي بن أرطاة أن ادفعني إلى إخوتي وأنا أصالحك على البصرة حتى آخذ لنفسي ما أحب من يزيد بن عبد الملك فلم يقبل، ثم خرج يزيد حتى نزل جبانة بني يشكر وهو المنصف بينه وبين القصر فقاتل وانهزم أصحاب علي، وكان إخوة يزيد في الحبس عند علي يقول عبد الملك بن المهلب إني أرى النشاب تقع في القصر وإني لا آمن أن يأتونا فيقتلونا قبل أن يصل إلينا يزيد فلتُلقوا عليه ثياباً، وجاء عبد الله بن دينار مولى ابن عامر وهو على حرس علي يشتد إلى الباب فوضع بنو المهلب متاعاً على الباب واتكأوا عليه فمنعوه، وملك يزيد البصرة؛ ثم سار إلى واسط فاستخلف عليها معاذ بن سعيد وسار حتى نزل العقر، وأقبل مسلمة بن عبد الملك على شاطئ الفرات حتى نزل الأنبار وعبر، واستقبل يزيدَ العباسُ بن الوليد بسواد فاصطفوا واقتتلوا، وكان أهل البصرة قد شدوا على أهل الشام شدة كشفوهم فيها ثم كر أهل الشام فكشفوهم، وكان يزيد على بردون له أشهب فأقبل نحو مسلمة لا يريد غيره حتى إذا دنا منه أدعى مسلمة فرسه اليركب فعطفت عليه خيول أهل الشام فقتل يزيد بن المهلب وقتل ابنه السميدع وقتل أخوه محمد بن المهلب، وكان الفضل بن عياش من بني جابر بن زهير الكلبي من محلب قد قال لأهل الشام هذا والله يزيد والله لأقتلنه أو ليقتلني فحمل عليه واضطربوا ساعة فانفرج الغبار عن يزيد قتيلاً وعن الفضل بن عياش بآخر رمق فأومأ إلى أصحابه أني قتلته ويومئ إلى نفسه أنه هو قتلني، وجيء برأس يزيد فغسل وعمم وبعث به إلى يزيد بن عبد الملك، وكان قتله في صفر سنة اثنتين ومائة {cite:tabari-khayyat-part2 p. 110-112,124-125}."
