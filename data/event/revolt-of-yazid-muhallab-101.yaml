id: event/revolt-of-yazid-muhallab-101
class: event
kind: revolt
label: { ar: "ثورة يزيد بن المهلب ويوم العقر", en: "The revolt of Yazid ibn al-Muhallab and the Day of al-'Aqr", es: "La revuelta de Yazid ibn al-Muhallab y el Día de al-'Aqr", fr: "La révolte de Yazid ibn al-Muhallab et le jour d'al-'Aqr", ur: "یزید ابن المحلب کی بغاوت اور یوم الآخر", tr: "Yezid ibn el-Muhallab'ın devrimi ve Akr Günü", id: "Revolusi Yazid ibn al-Muhallab dan Hari al-Aqr" }
summary:
  ar: "خرج يزيد بن المهلب سنة إحدى ومائة فأقبل إلى البصرة وقد جمع علي بن أرطاة نائبها أهلها وخندق عليها، فجمع محمد بن المهلب رجالاً من أهل بيته ومواليه وأقبل في كتيبة تَهُول من رآها وشد على أهل البصرة، واستقبله المغيرة بن عبد الله الثقفي في الخيل ليحمل عليه فأفرج له عن الطريق، وأقبل يزيد لا يمر بخيل من خيلهم ولا قبيلة من قبائلهم إلا تنحت له عن السبيل حتى نزل داره واختلف الناس إليه، فبعث إلى علي بن أرطاة أن ادفعني إلى إخوتي وأنا أصالحك على البصرة حتى آخذ لنفسي ما أحب من يزيد بن عبد الملك فلم يقبل، ثم خرج يزيد حتى نزل جبانة بني يشكر وهو المنصف بينه وبين القصر فقاتل وانهزم أصحاب علي، وكان إخوة يزيد في الحبس عند علي يقول عبد الملك بن المهلب إني أرى النشاب تقع في القصر وإني لا آمن أن يأتونا فيقتلونا قبل أن يصل إلينا يزيد فلتُلقوا عليه ثياباً، وجاء عبد الله بن دينار مولى ابن عامر وهو على حرس علي يشتد إلى الباب فوضع بنو المهلب متاعاً على الباب واتكأوا عليه فمنعوه، وملك يزيد البصرة؛ ثم سار إلى واسط فاستخلف عليها معاذ بن سعيد وسار حتى نزل العقر، وأقبل مسلمة بن عبد الملك على شاطئ الفرات حتى نزل الأنبار وعبر، واستقبل يزيدَ العباسُ بن الوليد بسواد فاصطفوا واقتتلوا، وكان أهل البصرة قد شدوا على أهل الشام شدة كشفوهم فيها ثم كر أهل الشام فكشفوهم، وكان يزيد على بردون له أشهب فأقبل نحو مسلمة لا يريد غيره حتى إذا دنا منه أدعى مسلمة فرسه اليركب فعطفت عليه خيول أهل الشام فقتل يزيد بن المهلب وقتل ابنه السميدع وقتل أخوه محمد بن المهلب، وكان الفضل بن عياش من بني جابر بن زهير الكلبي من محلب قد قال لأهل الشام هذا والله يزيد والله لأقتلنه أو ليقتلني فحمل عليه واضطربوا ساعة فانفرج الغبار عن يزيد قتيلاً وعن الفضل بن عياش بآخر رمق فأومأ إلى أصحابه أني قتلته ويومئ إلى نفسه أنه هو قتلني، وجيء برأس يزيد فغسل وعمم وبعث به إلى يزيد بن عبد الملك، وكان قتله في صفر سنة اثنتين ومائة {cite:tabari-khayyat-part2 p. 110-112,124-125}."
  en: "In 101 Yazid ibn al-Muhallab rose and came to Basra, where 'Ali ibn Artat, its governor, had gathered its people and dug a trench around the city. Muhammad ibn al-Muhallab gathered men of his household and clients and came on in a column so terrifying to see that it charged the people of Basra. Al-Mughira ibn 'Abd Allah al-Thaqafi met it with horsemen, meaning to charge at it, but opened the way for it. Yazid kept on, and no horsemen or tribe of theirs came against him without making way, until he reached his house, and people came and went to him. He sent to 'Ali ibn Artat: hand me over to my brothers, and I will make terms with you over Basra until I take for myself what I want from Yazid ibn 'Abd al-Malik. He refused. Yazid then went out and camped at the open ground of the Banu Yashkur, midway between him and the palace. He fought, and 'Ali's men were routed. Yazid's brothers were held in 'Ali's custody, and 'Abd al-Malik ibn al-Muhallab said: I see arrows falling on the palace, and I fear they will come for us and kill us before Yazid reaches us, so throw garments over him. 'Abd Allah ibn Dinar, mawla of Ibn 'Amir, who commanded 'Ali's guard, rushed to the door, but the sons of al-Muhallab piled goods against the door, leaned on them, and stopped him. Yazid took Basra. He then marched to Wasit, leaving Mu'adh ibn Sa'id as his deputy there, and marched on until he camped at al-'Aqr. Maslama ibn 'Abd al-Malik came along the bank of the Euphrates until he camped at al-Anbar and crossed. Al-'Abbas ibn al-Walid met Yazid at Sawad, and they lined up and fought. The people of Basra had charged the Syrians so hard that they routed them, but the Syrians came back and routed them in turn. Yazid was on a grey mule and made for Maslama, wanting no one else. When he drew near, Maslama called for his horse to mount, and the Syrian horsemen wheeled upon Yazid. Yazid ibn al-Muhallab was killed, with his son al-Sumaydi, and his brother Muhammad ibn al-Muhallab was killed too. Al-Fadl ibn 'Ayyash of the Banu Jabir ibn Zuhayr al-Kalbi, of Mahlab, had told the Syrians: 'This is Yazid; by God, I will kill him or he will kill me.' He charged at him, they struggled for a while, and when the dust cleared Yazid was dead and al-Fadl was at his last breath. He signalled to his companions that he had killed him, and gestured at himself to show that Yazid had killed him. Yazid's head was washed, wrapped in a turban and sent to Yazid ibn 'Abd al-Malik. His killing was in Safar 102 {cite:tabari-khayyat-part2 p. 110-112,124-125}."
  es: "En el año 101, Yazid ibn al-Muhallab se levantó y llegó a Basora, donde Ali ibn Artat, su gobernador, había reunido a la gente y cavado una zanja alrededor de la ciudad. Muhammad ibn al-Muhallab reunió a los hombres de su casa y a sus clientes y avanzó en una columna tan aterradora que cargó contra la gente de Basora. Al-Mughira ibn Abd Allah al-Thaqafi la recibió con jinetes, con la intención de cargar contra ella, pero le abrió el paso. Yazid continuó su avance, y ningún jinete ni tribu de ellos se le acercó sin cederle el paso, hasta que llegó a su casa, y la gente iba y venía a su encuentro. Envió un mensaje a Ali ibn Artat: «Entrégame a mis hermanos, y llegaré a un acuerdo contigo sobre Basora hasta que tome para mí lo que quiero de Yazid ibn Abd al-Malik». Él se negó. Entonces Yazid salió y acampó en el terreno abierto de los Banu Yashkur, a medio camino entre él y el palacio. Luchó y los hombres de Ali fueron derrotados. Los hermanos de Yazid fueron puestos bajo la custodia de Ali, y Abd al-Malik ibn al-Muhallab dijo: Veo flechas cayendo sobre el palacio, y temo que vengan por nosotros y nos maten antes de que Yazid llegue a nosotros, así que cúbranlo con ropas. Abd Allah ibn Dinar, mawla de Ibn Amir, quien comandaba la guardia de Ali, corrió hacia la puerta, pero los hijos de al-Muhallab apilaron bienes contra la puerta, se apoyaron en ellos y lo detuvieron. Yazid tomó Basora. Luego marchó a Wasit, dejando a Mu'adh ibn Sa'id como su lugarteniente allí, y marchó hasta acampar en al-Aqr. Maslama ibn Abd al-Malik llegó a lo largo de la orilla del Éufrates hasta acampar en al-Anbar y cruzar. Al-Abbas ibn al-Walid se encontró con Yazid en Sawad, y se alinearon y lucharon. La gente de Basora había atacado a los sirios con tanta fuerza que los derrotaron, pero los sirios contraatacaron y los derrotaron a su vez. Yazid, montado en una mula gris, se dirigió a Maslama, sin buscar a nadie más. Al acercarse, Maslama ordenó a su caballo que montara, y los jinetes sirios se abalanzaron sobre Yazid. Yazid ibn al-Muhallab murió, junto con su hijo al-Sumaydi, y su hermano Muhammad ibn al-Muhallab también murió. Al-Fadl ibn 'Ayyash, de los Banu Jabir ibn Zuhayr al-Kalbi, de Mahlab, les había dicho a los sirios: «Este es Yazid; por Dios, lo mataré o él me matará a mí». Lo atacó, lucharon durante un rato, y cuando el polvo se disipó, Yazid estaba muerto y al-Fadl estaba en sus últimos momentos. Les indicó a sus compañeros que lo había matado y se señaló a sí mismo para mostrar que Yazid lo había asesinado. La cabeza de Yazid fue lavada, envuelta en un turbante y enviada a Yazid ibn 'Abd al-Malik. Su muerte ocurrió en Safar 102 {cite:tabari-khayyat-part2 p. 110-112,124-125}."
  fr: "En 101, Yazid ibn al-Muhallab se leva et arriva à Bassora, où Ali ibn Artat, son gouverneur, avait rassemblé ses hommes et fait creuser un fossé autour de la ville. Muhammad ibn al-Muhallab rassembla les hommes de sa famille et ses fidèles et s'avança en une colonne si terrifiante qu'elle chargea les habitants de Bassora. Al-Mughira ibn 'Abd Allah al-Thaqafi la rencontra avec des cavaliers, avec l'intention de charger, mais lui ouvrit le passage. Yazid poursuivit sa route, et aucun cavalier ni aucune tribu ne put l'affronter sans s'écarter, jusqu'à ce qu'il atteigne sa maison, où les gens allaient et venaient. Il envoya dire à Ali ibn Artat: « Livre-moi à mes frères, et je négocierai avec toi au sujet de Bassora jusqu'à ce que j'obtienne ce que je veux de Yazid ibn 'Abd al-Malik. » Ce dernier refusa. Yazid sortit alors et campa sur le terrain vague des Banu Yashkur, à mi-chemin entre lui et le palais. Il combattit et les hommes d'Ali furent mis en déroute. Les frères de Yazid furent retenus prisonniers par Ali, et Abd al-Malik ibn al-Muhallab dit: « Je vois des flèches tomber sur le palais et je crains qu'elles ne viennent nous chercher et nous tuer avant que Yazid ne nous atteigne. Jetez donc des vêtements sur lui. » Abd Allah ibn Dinar, mawla d'Ibn Amir, qui commandait la garde d'Ali, se précipita vers la porte, mais les fils d'al-Muhallab entassèrent des marchandises contre celle-ci, s'appuyèrent dessus et l'arrêtèrent. Yazid prit Bassora. Il marcha ensuite sur Wasit, laissant Mu'adh ibn Sa'id comme adjoint, et poursuivit sa marche jusqu'à camper à al-Aqr. Maslama ibn 'Abd al-Malik longea la rive de l'Euphrate jusqu'à son campement à al-Anbar, qu'il traversa. Al-'Abbas ibn al-Walid rencontra Yazid à Sawad; ils s'alignèrent et combattirent. Les habitants de Bassora chargèrent les Syriens avec une telle force qu'ils les mirent en déroute, mais les Syriens revinrent et les mirent en déroute à leur tour. Yazid, monté sur une mule grise, se dirigea vers Maslama, ne désirant personne d'autre. Lorsqu'il fut près de lui, Maslama appela son cheval, et les cavaliers syriens se jetèrent sur Yazid. Yazid ibn al-Muhallab fut tué, ainsi que son fils al-Sumaydi et son frère Muhammad ibn al-Muhallab. Al-Fadl ibn 'Ayyash, des Banu Jabir ibn Zuhayr al-Kalbi, de Mahlab, avait dit aux Syriens: « Voici Yazid; « Par Dieu, je le tuerai ou il me tuera ! » Il se jeta sur lui, ils luttèrent un moment, et lorsque la poussière retomba, Yazid était mort et al-Fadl rendait son dernier souffle. Il fit signe à ses compagnons qu'il l'avait tué et se désigna lui-même pour montrer que Yazid l'avait tué. La tête de Yazid fut lavée, enveloppée dans un turban et envoyée à Yazid ibn 'Abd al-Malik. Son meurtre eut lieu en Safar 102 (voir: Tabari Khayyat, partie 2, p. 110-112, 124-125)."
  ur: "101 میں یزید ابن المحلب اٹھ کر بصرہ آیا جہاں اس کے گورنر علی ابن ارتط نے اپنے لوگوں کو جمع کیا تھا اور شہر کے گرد خندق کھودی تھی۔ محمد بن المحلب نے اپنے گھر والوں اور مؤکلوں کو اکٹھا کیا اور ایک کالم میں اس قدر خوفناک دیکھا کہ اس نے بصرہ کے لوگوں پر الزام لگایا۔ المغیرہ بن عبد اللہ الثقفی نے اس سے گھڑ سواروں سے ملاقات کی، یعنی اس پر حملہ کرنا، لیکن اس کے لیے راستہ کھول دیا۔ یزید آگے بڑھتا رہا اور کوئی بھی گھڑ سوار یا قبیلہ اس کے خلاف راستہ بنائے بغیر نہ آیا یہاں تک کہ وہ اپنے گھر پہنچ گیا اور لوگ اس کے پاس آئے اور چلے گئے۔ اس نے علی بن ارتط کو بھیجا کہ مجھے میرے بھائیوں کے حوالے کر دو، میں بصرہ پر تم سے معاہدہ کروں گا یہاں تک کہ میں یزید بن عبدالملک سے جو کچھ چاہتا ہوں وہ لے لوں۔ اس نے انکار کر دیا۔ اس کے بعد یزید نے نکل کر بنو یشکور کے کھلے میدان میں پڑاؤ ڈالا جو اس کے اور محل کے درمیان تھا۔ وہ لڑا، اور علی کے آدمیوں کو شکست دی گئی۔ یزید کے بھائی علی کی قید میں تھے، عبدالمالک بن المحلب نے کہا: میں محل پر تیر گرتے دیکھتا ہوں، مجھے ڈر ہے کہ وہ ہمارے پاس آئیں گے اور یزید کے ہم تک پہنچنے سے پہلے ہمیں مار ڈالیں گے، لہٰذا اس پر کپڑے ڈال دو۔ عبداللہ بن دینار، ابن عامر کا مولا، جس نے علی کے محافظ کو حکم دیا تھا، دروازے کی طرف بڑھے، لیکن المحلب کے بیٹوں نے دروازے پر سامان کا ڈھیر لگا دیا، ان پر ٹیک لگا کر اسے روک دیا۔ یزید بصرہ لے گیا۔ اس کے بعد اس نے معاذ بن سعید کو اپنا نائب بنا کر وصیت کی طرف کوچ کیا اور یہاں تک کہ اس نے العقر میں پڑاؤ ڈالا۔ مسلمہ بن عبد الملک فرات کے کنارے آئے یہاں تک کہ انہوں نے الانبار میں ڈیرہ ڈالا اور عبور کیا۔ عباس بن الولید نے سواد کے مقام پر یزید سے ملاقات کی اور وہ صف آرا ہو کر لڑے۔ بصرہ کے لوگوں نے شامیوں پر اتنا سخت الزام لگایا کہ انہوں نے ان کو شکست دے دی، لیکن شامی واپس آئے اور جواب میں انہیں شکست دی۔ یزید ایک سرمئی خچر پر سوار تھا اور اس نے مسلمہ کے لیے بنایا تھا، کسی اور کو نہیں چاہتا تھا۔ جب وہ قریب آیا تو مسلمہ نے اپنے گھوڑے کو سوار کرنے کے لیے بلایا اور شامی گھڑ سوار یزید پر چڑھ دوڑے۔ یزید بن المحلب اپنے بیٹے السمیدی کے ساتھ مارا گیا اور اس کا بھائی محمد بن المحلب بھی مارا گیا۔ مہلب کے بنو جابر بن زہیر کلبی کے الفضل بن عیاش نے شامیوں سے کہا تھا: 'یہ یزید ہے۔ خدا کی قسم میں اسے مار ڈالوں گا یا وہ مجھے مار ڈالے گا۔ اس نے اس پر الزام لگایا، وہ تھوڑی دیر تک جدوجہد کرتے رہے، اور جب غبار صاف ہوا تو یزید مر چکا تھا اور الفضل اپنی آخری سانسوں پر تھا۔ اس نے اپنے ساتھیوں کو اشارہ کیا کہ اس نے اسے قتل کر دیا ہے، اور اپنی طرف اشارہ کر کے یہ ظاہر کیا کہ یزید نے اسے قتل کیا ہے۔ یزید کا سر دھو کر پگڑی میں لپیٹ کر یزید بن عبد الملک کے پاس بھیج دیا گیا۔ ان کا قتل صفر 102 میں ہوا۔ 110-112,124-125}۔"
  tr: "Hicri 101 yılında Yezid ibn el-Muhallab Basra'ya doğru yola çıktı. Vali Ali ibn Artat, halkı toplamış ve şehri bir hendekle tahkim etmişti. Muhammed ibn el-Muhallab ailesinden adamlar ve azat edilmiş köleler toplayarak korkunç bir güçle ilerledi ve Basra halkına saldırdı. El-Muğira ibn Abdullah el-Sakkafi, süvarileriyle onu karşıladı ve saldırmak niyetindeydi, ancak el-Muğira ona yol açtı. Yezid, kendisine açık bir yol verilene kadar hiçbir süvari veya kabileye rastlamadan ilerledi ve ikametgahına ulaştı. İnsanlar ona akın etti. Ali ibn Artat'a haber göndererek, \"Beni kardeşlerime teslim et, Basra konusunda seninle barış yapayım ki Yezid ibn Abd el-Malik'ten istediğim her şeyi elde edeyim\" dedi. Ali reddetti. Yezid daha sonra kampı ile sarayı arasında bulunan Beni Yashkur mezarlığına ulaşana kadar yürüdü. Savaştı ve Ali'nin adamları yenildi. Yezid'in kardeşleri Ali tarafından hapsedildi. Abdülmalik ibn el-Muhallab, \"Saraya oklar yağdığını görüyorum ve Yezid bize ulaşmadan önce gelip bizi öldüreceklerinden korkuyorum. Üzerine elbiseler atın.\" dedi. İbn Amir'in azatlı kölesi Abdullah ibn Dinar, Ali'nin muhafızlarının başındayken geldi. Kapıya gittiğinde, el-Muhallab'ın oğulları kapıya eşyalar koyup yaslanarak içeri girmesini engellediler. Yezid daha sonra Basra'nın kontrolünü ele geçirdi. Ardından Mu'azh ibn Sa'id'i vekili olarak atayarak Wasit'e doğru ilerledi ve Ukr'a ulaşana kadar devam etti. Maslama ibn Abdülmalik, Fırat nehrinin kıyılarına kadar ilerleyerek Enbar'a ulaştı ve karşıya geçti. Yezid, el-Abbas ibn el-Valid ile siyah bir ordu tarafından karşılandı ve saf tutarak savaştılar. Basra halkı Suriye halkına şiddetli bir saldırı düzenleyerek onları bozguna uğratmıştı, ancak Suriyeliler de karşı saldırıya geçerek onları bozguna uğratmıştı. Yezid gri bir pelerin üzerinde Maslama'ya doğru ilerliyordu ve başka bir niyeti yoktu. Yaklaştığında Maslama atı el-Yarkab'ı çağırdı ve Suriye süvarileri ona saldırdı, Yezid ibn el-Muhalleb'i, oğlu el-Sumayda'yı ve kardeşi Muhammed ibn el-Muhalleb'i öldürdü. Beni Mahlab kabilesinin Beni Cabir ibn Zuhayr el-Kalbi kolundan El-Fadl ibn Ayyaş, Suriyelilere, \"Bu Yezid! Allah'a yemin ederim ki, onu ben öldüreceğim, yoksa o beni öldürecek!\" dedi. Bunun üzerine ona saldırdı ve bir süre çatıştılar. Toz bulutu dağıldığında Yezid'in ölü, El-Fadl ibn Ayyaş'ın ise son nefesini verdiği görüldü. Arkadaşlarına, \"Onu ben öldürdüm,\" diye işaret etti ve kendi kendine, \"O beni öldürdü,\" dedi. Yezid'in başı getirildi, yıkandı, sarığa sarıldı ve Yezid ibn Abdülmalik'e gönderildi. İkinci yılın Safar ayında öldürüldü. Yüz {cite:tabari-khayyat-part2 s. 110-112,124-125}."
  id: "Pada tahun 101 Hijriah, Yazid ibn al-Muhallab berangkat menuju Basra. Ali ibn Artat, gubernur kota itu, telah mengumpulkan penduduknya dan membentengi kota dengan parit. Muhammad ibn al-Muhallab mengumpulkan orang-orang dari keluarganya dan para budak yang telah dibebaskan, lalu maju dengan kekuatan yang menakutkan, menyerang penduduk Basra. Al-Mughira ibn Abdullah al-Thaqafi menemuinya dengan pasukan berkuda, bermaksud untuk menyerang, tetapi al-Mughira membuka jalan baginya. Yazid maju, melewati pasukan berkuda atau suku mana pun tanpa diberi jalan yang jelas hingga ia mencapai kediamannya. Orang-orang berbondong-bondong mendatanginya. Ia mengirim pesan kepada Ali ibn Artat, mengatakan, \"Serahkan aku kepada saudara-saudaraku, dan aku akan berdamai denganmu mengenai Basra, agar aku dapat memperoleh apa pun yang kuinginkan dari Yazid ibn Abd al-Malik.\" Ali menolak. Yazid kemudian berbaris hingga mencapai pemakaman Banu Yashkur, yang terletak di antara perkemahannya dan istana. Ia berperang, dan pasukan Ali dikalahkan. Saudara-saudara Yazid dipenjarakan oleh Ali. Abd al-Malik ibn al-Muhallab berkata, \"Aku melihat panah berjatuhan di istana, dan aku takut mereka akan datang dan membunuh kita sebelum Yazid mencapai kita. Selimutkan pakaian padanya.\" Abdullah ibn Dinar, seorang budak yang dibebaskan oleh Ibn Amir, tiba saat bertugas sebagai pengawal Ali. Ia pergi ke pintu, sehingga putra-putra Al-Muhallab meletakkan barang-barang di pintu dan bersandar padanya, sehingga mencegahnya masuk. Yazid kemudian menguasai Basra. Kemudian ia berbaris ke Wasit, menunjuk Mu'adh ibn Sa'id sebagai wakilnya di sana, dan melanjutkan perjalanan hingga mencapai al-'Uqr. Maslama ibn 'Abd al-Malik maju ke tepi Sungai Eufrat hingga mencapai al-Anbar dan menyeberanginya. Yazid disambut oleh al-'Abbas ibn al-Walid dengan pasukan hitam, dan mereka berbaris dan bertempur. Penduduk Basra melancarkan serangan sengit terhadap penduduk Suriah, mengalahkan mereka, tetapi kemudian orang-orang Suriah melakukan serangan balik dan mengalahkan mereka. Yazid menunggangi jubah abu-abu dan maju menuju Maslama, tanpa maksud lain. Ketika dia mendekat, Maslama memanggil kudanya, al-Yarkab, dan kavaleri Suriah menyerangnya, membunuh Yazid ibn al-Muhallab, putranya al-Sumayda', dan saudaranya Muhammad ibn al-Muhallab. Al-Fadl ibn 'Ayyash, dari klan Banu Jabir ibn Zuhayr al-Kalbi dari Banu Mahlab, berkata kepada orang-orang Suriah, \"Ini Yazid! Demi Allah, aku akan membunuhnya, atau dia akan membunuhku!\" Maka dia menyerangnya, dan mereka bertempur untuk sementara waktu. Debu mereda, memperlihatkan Yazid yang telah mati dan al-Fadl ibn 'Ayyash yang menghembuskan napas terakhirnya. Dia memberi isyarat kepada para sahabatnya, \"Aku membunuhnya,\" dan kepada dirinya sendiri, \"Dia membunuhku.\" Kepala Yazid dibawa, dicuci, dan dibungkus dengan sorban, lalu dikirim kepada Yazid ibn 'Abd al-Malik. Dia terbunuh pada bulan Safar tahun kedua. Seratus {cite:tabari-khayyat-part2 p. 110-112,124-125}."
