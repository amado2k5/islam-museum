label: { ar: "ثورة يزيد بن المهلب ويوم العقر", en: "The revolt of Yazid ibn al-Muhallab and the Day of al-'Aqr" }
summary:
  ar: "خرج يزيد بن المهلب سنة إحدى ومائة فأقبل إلى البصرة وقد جمع علي بن أرطاة نائبها أهلها وخندق عليها، فجمع محمد بن المهلب رجالاً من أهل بيته ومواليه وأقبل في كتيبة تَهُول من رآها وشد على أهل البصرة، واستقبله المغيرة بن عبد الله الثقفي في الخيل ليحمل عليه فأفرج له عن الطريق، وأقبل يزيد لا يمر بخيل من خيلهم ولا قبيلة من قبائلهم إلا تنحت له عن السبيل حتى نزل داره واختلف الناس إليه، فبعث إلى علي بن أرطاة أن ادفعني إلى إخوتي وأنا أصالحك على البصرة حتى آخذ لنفسي ما أحب من يزيد بن عبد الملك فلم يقبل، ثم خرج يزيد حتى نزل جبانة بني يشكر وهو المنصف بينه وبين القصر فقاتل وانهزم أصحاب علي، وكان إخوة يزيد في الحبس عند علي يقول عبد الملك بن المهلب إني أرى النشاب تقع في القصر وإني لا آمن أن يأتونا فيقتلونا قبل أن يصل إلينا يزيد فلتُلقوا عليه ثياباً، وجاء عبد الله بن دينار مولى ابن عامر وهو على حرس علي يشتد إلى الباب فوضع بنو المهلب متاعاً على الباب واتكأوا عليه فمنعوه، وملك يزيد البصرة؛ ثم سار إلى واسط فاستخلف عليها معاذ بن سعيد وسار حتى نزل العقر، وأقبل مسلمة بن عبد الملك على شاطئ الفرات حتى نزل الأنبار وعبر، واستقبل يزيدَ العباسُ بن الوليد بسواد فاصطفوا واقتتلوا، وكان أهل البصرة قد شدوا على أهل الشام شدة كشفوهم فيها ثم كر أهل الشام فكشفوهم، وكان يزيد على بردون له أشهب فأقبل نحو مسلمة لا يريد غيره حتى إذا دنا منه أدعى مسلمة فرسه اليركب فعطفت عليه خيول أهل الشام فقتل يزيد بن المهلب وقتل ابنه السميدع وقتل أخوه محمد بن المهلب، وكان الفضل بن عياش من بني جابر بن زهير الكلبي من محلب قد قال لأهل الشام هذا والله يزيد والله لأقتلنه أو ليقتلني فحمل عليه واضطربوا ساعة فانفرج الغبار عن يزيد قتيلاً وعن الفضل بن عياش بآخر رمق فأومأ إلى أصحابه أني قتلته ويومئ إلى نفسه أنه هو قتلني، وجيء برأس يزيد فغسل وعمم وبعث به إلى يزيد بن عبد الملك، وكان قتله في صفر سنة اثنتين ومائة {cite:tabari-khayyat-part2 p. 110-112,124-125}."
  en: "In 101 Yazid ibn al-Muhallab rose and came to Basra, where 'Ali ibn Artat, its governor, had gathered its people and dug a trench around the city. Muhammad ibn al-Muhallab gathered men of his household and clients and came on in a column so terrifying to see that it charged the people of Basra. Al-Mughira ibn 'Abd Allah al-Thaqafi met it with horsemen, meaning to charge at it, but opened the way for it. Yazid kept on, and no horsemen or tribe of theirs came against him without making way, until he reached his house, and people came and went to him. He sent to 'Ali ibn Artat: hand me over to my brothers, and I will make terms with you over Basra until I take for myself what I want from Yazid ibn 'Abd al-Malik. He refused. Yazid then went out and camped at the open ground of the Banu Yashkur, midway between him and the palace. He fought, and 'Ali's men were routed. Yazid's brothers were held in 'Ali's custody, and 'Abd al-Malik ibn al-Muhallab said: I see arrows falling on the palace, and I fear they will come for us and kill us before Yazid reaches us, so throw garments over him. 'Abd Allah ibn Dinar, mawla of Ibn 'Amir, who commanded 'Ali's guard, rushed to the door, but the sons of al-Muhallab piled goods against the door, leaned on them, and stopped him. Yazid took Basra. He then marched to Wasit, leaving Mu'adh ibn Sa'id as his deputy there, and marched on until he camped at al-'Aqr. Maslama ibn 'Abd al-Malik came along the bank of the Euphrates until he camped at al-Anbar and crossed. Al-'Abbas ibn al-Walid met Yazid at Sawad, and they lined up and fought. The people of Basra had charged the Syrians so hard that they routed them, but the Syrians came back and routed them in turn. Yazid was on a grey mule and made for Maslama, wanting no one else. When he drew near, Maslama called for his horse to mount, and the Syrian horsemen wheeled upon Yazid. Yazid ibn al-Muhallab was killed, with his son al-Sumaydi, and his brother Muhammad ibn al-Muhallab was killed too. Al-Fadl ibn 'Ayyash of the Banu Jabir ibn Zuhayr al-Kalbi, of Mahlab, had told the Syrians: 'This is Yazid; by God, I will kill him or he will kill me.' He charged at him, they struggled for a while, and when the dust cleared Yazid was dead and al-Fadl was at his last breath. He signalled to his companions that he had killed him, and gestured at himself to show that Yazid had killed him. Yazid's head was washed, wrapped in a turban and sent to Yazid ibn 'Abd al-Malik. His killing was in Safar 102 {cite:tabari-khayyat-part2 p. 110-112,124-125}."
