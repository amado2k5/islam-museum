id: event/muhammad-ibn-ubaydallah-leaves-minas-for-wadia-and-writes-to-al-hadi-292
class: event
kind: other
label:
  ar: "خروج أبي جعفر من ميناس إلى وادعة وكتابه إلى الهادي وجواب الهادي، ص283-284"
  en: "Abu Ja'far leaves Minas for Wadi'a, writes to al-Hadi and receives his answer, pp. 283-284"
  ur: "ابو جعفر کا میناس سے وادعہ کو جانا، ہادی کو لکھنا اور ہادی کا جواب، ص283-284"
  es: "Abu Ja'far abandona Minas para ir a Wadi'a, escribe a al-Hadi y recibe su respuesta, págs. 283-284."
  fr: "Abou Ja'far quitte Minas pour Wadi'a, écrit à al-Hadi et reçoit sa réponse, pp. 283-284"
  tr: "Ebu Cafer'in Minas'tan Vada'ya gidişi, el-Hadi'ye yazdığı mektup ve el-Hadi'nin cevabı, s. 283-284"
  id: "Keberangkatan Abu Ja'far dari Minas ke Wad'ah, suratnya kepada al-Hadi, dan balasan al-Hadi, hlm. 283-284"
summary:
  ar: "يلقى الابنان ووادعة أباهما وقد خرج من ميناس، فيخبرهم أن ابن بسطام أرسل إليه يخاف عليه ويقترح أن يسير في همدان، فعلم أنه لا يريد مقامه فخرج، وفضّل وادعة على الحصن، فأنزلته وادعة وأكرمته، وكتب إلى الهادي فأجابه بأنه سيصير إليه وألا يغتم."
  en: "The sons and Wadi'a meet their father after he has left Minas; he tells them Ibn Bustam sent word fearing for him and proposing he go among Hamdan, so he knew Ibn Bustam did not want him to stay, chose Wadi'a over al-Hisn, and was honoured there; he wrote to al-Hadi, who replied that he would come to him and that he should not grieve."
  ur: "بیٹے اور وادعہ باپ سے ملتے ہیں جو میناس سے نکل چکے؛ وہ بتاتے ہیں کہ ابن بسطام نے ان کے لیے اندیشہ ظاہر کیا اور ہمدان جانے کا مشورہ دیا، تو انہوں نے جانا کہ وہ ان کا قیام نہیں چاہتا، حصن کے بجائے وادعہ چنا اور وہاں عزت پائی؛ ہادی کو لکھا اور ہادی نے جواب دیا کہ وہ ان کے پاس آئیں گے اور فکر نہ کریں۔"
  es: "Los hijos y Wadi'a se encuentran con su padre después de que este abandona Minas; él les cuenta que Ibn Bustam envió un mensaje temiendo por él y proponiéndole que fuera a vivir con Hamdan, por lo que sabía que Ibn Bustam no quería que se quedara, eligió a Wadi'a en lugar de al-Hisn, y allí fue honrado; le escribió a al-Hadi, quien le respondió que iría a verlo y que no debía afligirse."
  fr: "Les fils et Wadi'a rencontrent leur père après son départ de Minas; il leur raconte qu'Ibn Bustam a envoyé un message, craignant pour lui et lui proposant d'aller chez Hamdan. Il savait donc qu'Ibn Bustam ne voulait pas qu'il reste, il a choisi Wadi'a plutôt qu'al-Hisn et y a été honoré; il a écrit à al-Hadi, qui lui a répondu qu'il viendrait le voir et qu'il ne devait pas s'affliger."
  tr: "İki oğul ve Wad’ah, Minas’tan ayrılmış olan babalarıyla buluştular. Babaları onlara İbn Bustam’ın kendisine endişesini dile getiren ve Hamadan’a gitmesini öneren bir mesaj gönderdiğini söyledi. Orada kalmak istemediğini bildiği için, kaleye kıyasla Wad’ah’ı tercih ederek oradan ayrılmıştı. Wad’ah onu yanına almış ve ona saygıyla davranmıştı. Al-Hadi’ye bir mektup yazmış, Al-Hadi de ona geleceğini ve üzülmemesi gerektiğini söylemişti."
  id: "Kedua putra dan Wad’ah bertemu dengan ayah mereka, yang telah meninggalkan Minas. Ia memberi tahu mereka bahwa Ibnu Bustam telah mengiriminya pesan yang menyatakan kekhawatirannya terhadap dirinya dan menyarankan agar ia pergi ke Hamadan. Ia tahu bahwa ia tidak ingin tinggal di sana, jadi ia pergi, lebih memilih Wad’ah daripada benteng itu. Wad’ah menerimanya dan memperlakukannya dengan hormat. Ia menulis surat kepada Al-Hadi, yang menjawab bahwa ia akan datang kepadanya dan bahwa ia tidak perlu bersedih."
