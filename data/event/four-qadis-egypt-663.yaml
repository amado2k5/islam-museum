label: { ar: "تعيين أربعة قضاة للمذاهب بمصر سنة 663هـ", en: "Four madhhab qadis appointed in Egypt, 663", es: "Cuatro cadíes de madhhab nombrados en Egipto, 663", fr: "Quatre cadis de madhhab nommés en Égypte, 663", ur: "مصر میں 4مذہب قادیان مقرر، 663", tr: "Hicri 663 yılında Mısır'da farklı düşünce ekolleri için dört yargıcın atanması", id: "Pengangkatan empat hakim untuk berbagai aliran pemikiran di Mesir pada tahun 663 Hijriah." }
summary:
  ar: "جُرد بديار مصر سنة ثلاث وستين أربعة حكام من المذاهب الأجل — توقف تاج الدين بن بنت الأعز عن تنفيذ كثير من القضايا فتعطلت الأمور، فأشار بذلك جمال الدين آيدغدي العزيزي فأعجب السلطان وفعله في آخر السنة، ثم فعل ذلك بدمشق {cite:shadharat-dhahab p. 542}."
  en: "The four-madhhab judiciary instituted in Egypt in 663: when Taj al-Din Ibn Bint al-A'azz's sole Shafi'i bench stalled the casework, Jamal al-Din Aydoghdi al-Azizi proposed appointing four qadis, one per madhhab — the sultan approved and enacted it at year's end, then extended it to Damascus {cite:shadharat-dhahab p. 542}."
  es: "El sistema judicial de cuatro madhhabs instituido en Egipto en 663: cuando el único tribunal shafi'i de Taj al-Din Ibn Bint al-A'azz paralizó el trabajo judicial, Jamal al-Din Aydoghdi al-Azizi propuso nombrar cuatro cadíes, uno por madhhab; el sultán lo aprobó y promulgó a finales de año, y luego lo extendió a Damasco {cite:shadharat-dhahab p. 542}."
  fr: "Le système judiciaire à quatre madhhab institué en Égypte en 663: lorsque le seul banc Shafi'i de Taj al-Din Ibn Bint al-A'azz a bloqué le travail des affaires, Jamal al-Din Aydoghdi al-Azizi a proposé de nommer quatre qadis, un par madhhab — le sultan l'a approuvé et promulgué à la fin de l'année, puis l'a étendu à Damas {cite:shadharat-dhahab p. 542}."
  ur: "663ء میں مصر میں چارمذہب عدلیہ کا قیام: جب تاج الدین ابن بنت العزیز کی واحد شافعی بنچ نے کیس کا کام روک دیا، جمال الدین ایدوغدی العزیز نے چار قادیان مقرر کرنے کی تجویز پیش کی، ایک فی مذہب - اور اس کے بعد سلطان نے اس کی توسیع کر دی، اور اس کے بعد اس کی مدت میں توسیع کر دی گئی۔ {حوالہ: شدھارت ذہاب ص۔ 542}۔"
  tr: "63. yılda, en önde gelen düşünce ekollerinden dört yönetici Mısır topraklarından uzaklaştırıldı. Tec'ddin ibn Bint el-A'azz birçok davayı uygulamaktan vazgeçtiği için işler karıştı. Cemal-Din Aydağdi el-Azizi bunu önerdi ve Sultan bundan memnun kaldı ve yılın sonunda bunu yaptı. Sonra Şam'da da aynısını yaptı. {kaynak: Şadharat-dhahab s. 542}"
  id: "Pada tahun 63, empat penguasa dari aliran pemikiran paling terkemuka diberhentikan dari tanah Mesir. Taj al-Din ibn Bint al-A’azz berhenti melaksanakan banyak kasus, sehingga berbagai hal menjadi kacau. Jamal al-Din Aydaghdi al-Azizi menyarankan hal ini, dan Sultan merasa senang dan melaksanakannya pada akhir tahun. Kemudian beliau melakukan hal yang sama di Damaskus. {cite:shadharat-dhahab p. 542}"
