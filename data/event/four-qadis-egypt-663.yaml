label: { ar: "تعيين أربعة قضاة للمذاهب بمصر سنة 663هـ", en: "Four madhhab qadis appointed in Egypt, 663", es: "Cuatro cadíes de madhhab nombrados en Egipto, 663", fr: "Quatre cadis de madhhab nommés en Égypte, 663" }
summary:
  ar: "جُرد بديار مصر سنة ثلاث وستين أربعة حكام من المذاهب الأجل — توقف تاج الدين بن بنت الأعز عن تنفيذ كثير من القضايا فتعطلت الأمور، فأشار بذلك جمال الدين آيدغدي العزيزي فأعجب السلطان وفعله في آخر السنة، ثم فعل ذلك بدمشق {cite:shadharat-dhahab p. 542}."
  en: "The four-madhhab judiciary instituted in Egypt in 663: when Taj al-Din Ibn Bint al-A'azz's sole Shafi'i bench stalled the casework, Jamal al-Din Aydoghdi al-Azizi proposed appointing four qadis, one per madhhab — the sultan approved and enacted it at year's end, then extended it to Damascus {cite:shadharat-dhahab p. 542}."
  es: "El sistema judicial de cuatro madhhabs instituido en Egipto en 663: cuando el único tribunal shafi'i de Taj al-Din Ibn Bint al-A'azz paralizó el trabajo judicial, Jamal al-Din Aydoghdi al-Azizi propuso nombrar cuatro cadíes, uno por madhhab; el sultán lo aprobó y promulgó a finales de año, y luego lo extendió a Damasco {cite:shadharat-dhahab p. 542}."
  fr: "Le système judiciaire à quatre madhhab institué en Égypte en 663: lorsque le seul banc Shafi'i de Taj al-Din Ibn Bint al-A'azz a bloqué le travail des affaires, Jamal al-Din Aydoghdi al-Azizi a proposé de nommer quatre qadis, un par madhhab — le sultan l'a approuvé et promulgué à la fin de l'année, puis l'a étendu à Damas {cite:shadharat-dhahab p. 542}."
