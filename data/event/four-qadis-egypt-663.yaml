summary:
  ar: "جُرد بديار مصر سنة ثلاث وستين أربعة حكام من المذاهب الأجل — توقف تاج الدين بن بنت الأعز عن تنفيذ كثير من القضايا فتعطلت الأمور، فأشار بذلك جمال الدين آيدغدي العزيزي فأعجب السلطان وفعله في آخر السنة، ثم فعل ذلك بدمشق {cite:shadharat-dhahab p. 542}."
  en: "The four-madhhab judiciary instituted in Egypt in 663: when Taj al-Din Ibn Bint al-A'azz's sole Shafi'i bench stalled the casework, Jamal al-Din Aydoghdi al-Azizi proposed appointing four qadis, one per madhhab — the sultan approved and enacted it at year's end, then extended it to Damascus {cite:shadharat-dhahab p. 542}."
