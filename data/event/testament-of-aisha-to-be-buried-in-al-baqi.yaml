id: event/testament-of-aisha-to-be-buried-in-al-baqi
class: event
kind: death
label:
  ar: وصية عائشة بأن تُدفن بالبقيع ووفاتها
  en: Testament and burial of Aisha in al-Baqi
  ur: عائشہ کی بقیع میں دفن ہونے کی وصیت اور وفات
  es: "Testamento y entierro de Aisha en al-Baqi"
  fr: "Testament et sépulture d'Aïcha à al-Baqi"
  tr: "Ayşe'nin El-Baki'de defnedilmeyi vasiyeti ve vefatı."
  id: "Wasiat Aisyah agar dia dimakamkan di Al-Baqi' dan kematiannya"
summary:
  ar: "روى ابن كثير عن هشام بن عروة عن أبيه عن عائشة أنها أوصت عبد الله بن الزبير ألا تُدفن مع النبي وصاحبيه في الحجرة وأن تُدفن مع صواحبها بالبقيع {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. وفي مرض موتها استأذن عليها ابن عباس فتردّدت ثم أذنت، فبشّرها بأنه لا يفصلها عن لقاء النبي والأحبة إلا خروج الروح، وذكّرها بنزول براءتها، فقالت إنها تتمنى لو كانت نسياً منسياً {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:fath-al-bari scan vol. 3 p. 483}. وتوفيت في رمضان سنة ثمان وخمسين في الأشهر، وقيل قبلها بسنة، ودُفنت ليلاً بعد الوتر بالبقيع وصلّى عليها أبو هريرة، ونزل في قبرها خمسة من أبناء إخوتها وأخواتها {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  en: "Ibn Kathir reports, from Hisham ibn Urwa through his father, that Aisha charged Abdallah ibn al-Zubayr not to bury her with the Prophet and his two companions in the room but with her companions in al-Baqi {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. In her last illness Ibn Abbas asked leave to enter; she hesitated and then allowed him, and he gave her the good news that only the departure of the soul lay between her and meeting the Prophet and the loved ones, reminding her of the revelation of her vindication; she answered that she wished she had been something forgotten and lost {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:fath-al-bari scan vol. 3 p. 483}. She died in Ramadan of 58 AH on the commonest account, a year earlier or later in others, was buried by night after the witr prayer in al-Baqi, Abu Hurayra led the prayer, and five of her nephews descended into the grave {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  ur: "ابن کثیر ہشام بن عروہ کے واسطے سے عائشہ کی روایت نقل کرتے ہیں کہ انھوں نے عبداللہ بن زبیر کو وصیت کی کہ انھیں حجرے میں نبی اور آپ کے دونوں ساتھیوں کے ساتھ دفن نہ کیا جائے بلکہ بقیع میں ان کی سہیلیوں کے ساتھ دفن کیا جائے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. مرضِ وفات میں ابن عباس نے اندر آنے کی اجازت مانگی؛ وہ پہلے ہچکچائیں پھر اجازت دے دی، اور انھوں نے خوشخبری دی کہ نبی اور پیاروں سے ملاقات میں صرف روح کے نکلنے کی دیر ہے، اور ان کی براءت کے نزول کی یاد دلائی؛ عائشہ نے کہا کہ کاش وہ بھولی بسری چیز ہوتیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:fath-al-bari scan vol. 3 p. 483}. مشہور ترین قول میں وہ ۵۸ھ کے رمضان میں فوت ہوئیں، بعض کے نزدیک ایک سال پہلے یا بعد، رات کو وتر کے بعد بقیع میں دفن ہوئیں، ابوہریرہ نے نماز پڑھائی اور ان کے پانچ بھتیجے بھانجے قبر میں اترے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  es: "Ibn Kathir relata, de Hisham ibn Urwa a través de su padre, que Aisha le encargó a Abdallah ibn al-Zubayr que no la enterrara con el Profeta y sus dos compañeros en la habitación, sino con sus compañeros en al-Baqi {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. En su última enfermedad, Ibn Abbas pidió permiso para entrar; ella dudó y luego se lo permitió, y él le dio la buena noticia de que solo la partida del alma la separaba del encuentro con el Profeta y los seres queridos, recordándole la revelación de su vindicación; ella respondió que deseaba haber sido algo olvidado y perdido {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:fath-al-bari scan vol. 3 p. 483}. Murió en Ramadán del año 58 AH según la versión más común, un año antes o después según otras, fue enterrada de noche después de la oración witr en al-Baqi, Abu Hurayra dirigió la oración, y cinco de sus sobrinos descendieron a la tumba {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  fr: "Ibn Kathir rapporte, d'après Hisham ibn Urwa transmis par son père, qu'Aïcha a demandé à Abdallah ibn al-Zubayr de ne pas l'inhumer avec le Prophète et ses deux compagnons dans la même pièce, mais avec ses compagnons à al-Baqi (cf. al-bidaya-wal-nihaya, vol. 3, p. 300). Lors de sa dernière maladie, Ibn Abbas demanda la permission d'entrer; elle hésita, puis l'y autorisa. Il lui annonça alors la bonne nouvelle: seul le passage de l'âme la séparait de la rencontre avec le Prophète et ses proches, lui rappelant la révélation de sa justification. Elle répondit qu'elle aurait préféré être oubliée et perdue (cf. al-bidaya-wal-nihaya, vol. 4, p. 461; cf. fath-al-bari, vol. 3, p. 483). Elle mourut au Ramadan de l'an 58 de l'Hégire selon la version la plus courante, un an plus tôt ou plus tard selon d'autres, fut enterrée de nuit après la prière du witr à al-Baqi, Abu Hurayra dirigea la prière, et cinq de ses neveux descendirent dans la tombe {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  tr: "İbn Kathir, Hişam ibn Urve'den, o da babasından, o da Ayşe'den rivayet ettiğine göre, Hz. Aişe, Abdullah ibn el-Zübeyr'e kendisini Peygamber ve iki arkadaşıyla birlikte aynı odaya değil, arkadaşlarıyla birlikte el-Baki'ye defnetmesini emretmiştir. {al-bidaya-wal-nihaya, cilt 3, s. 300}. Son hastalığı sırasında İbn Abbas, Hz. Aişe'yi görmek için izin istemiş, Hz. Aişe tereddüt etmiş, sonra izin vermiştir. İbn Abbas, Hz. Aişe'ye, ruhunun ayrılmasından başka hiçbir şeyin onu Peygamber ve sevdikleriyle buluşmaktan ayıramayacağını müjdelemiş ve masumiyetinin vahyedildiğini hatırlatmıştır. Hz. Aişe, tamamen unutulmayı dilediğini söylemiştir. {al-bidaya-wal-nihaya, cilt 4, s. 461} {fath-al-bari, cilt 3, s. 483}. Aylara göre elli sekizinci yılın Ramazan ayında vefat etti, ancak bir yıl önce vefat ettiği de rivayet edilir. Vitr namazından sonra geceleyin Bakî'de defnedildi ve Ebu Hurayra onun için dua etti. Beş yeğeni de onun mezarına indi. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
  id: "Ibn Kathir meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa ia memerintahkan Abdullah ibn al-Zubayr untuk tidak menguburnya bersama Nabi dan dua sahabatnya di kamar, tetapi menguburnya bersama para sahabatnya di al-Baqi'. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. Selama sakitnya yang terakhir, Ibn Abbas meminta izin untuk menemuinya, dan ia ragu-ragu, lalu mengabulkannya. Ia memberinya kabar gembira bahwa tidak ada yang akan memisahkannya dari pertemuan dengan Nabi dan orang-orang yang dicintainya kecuali wafatnya, dan ia mengingatkannya tentang wahyu tentang kesuciannya. Ia berkata bahwa ia berharap dirinya benar-benar dilupakan. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:fath-al-bari scan vol. 3 p. 483}. Ia wafat pada bulan Ramadan tahun 58, menurut perhitungan bulan, dan dikatakan setahun sebelumnya. Ia dimakamkan pada malam hari setelah shalat Witir di Al-Baqi’, dan Abu Hurayrah mendoakannya. Lima keponakan dan kemenakannya masuk ke dalam kuburnya. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 461} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 921}."
