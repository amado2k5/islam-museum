label: { en: "Ali's counsel in Umar's judgments", ar: "مشورة علي لعمر في القضاء" }
summary:
  en: "During Umar's caliphate Ali repeatedly corrected or advised the judgments: he stopped the stoning of a woman with a mental affliction, asked Umar what authority he had over the unborn child of a confessing pregnant woman, showed by a test that a woman's claim of assault was false, and said that the innovated marriage should be returned to the Sunna. Umar is reported to have said that he sought refuge from a problem Abu al-Hasan could not solve."
  ar: "في خلافة عمر أشار علي مراراً بتصويب الأحكام: منع رجم امرأة مبتلاة بالجنون، وسأل عمر عن سلطانه على ما في بطن حامل اعترفت بالفجور، وكشف بالتجربة كذب امرأة ادعت أن شاباً راودها، وردّ نكاحاً في العدة إلى السنة. وتذكر الرواية أن عمر قال: أعوذ بالله من معضلة ليس لها أبو الحسن."
