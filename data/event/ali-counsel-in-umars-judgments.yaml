id: event/ali-counsel-in-umars-judgments
class: event
kind: other
label: { en: "Ali's counsel in Umar's judgments", ar: "مشورة علي لعمر في القضاء", es: "El abogado de Ali en los juicios de Umar", fr: "L'avocat d'Ali dans les jugements d'Umar", ur: "عمر کے فیصلوں میں علی کا وکیل", tr: "Ali'nin Ömer'e yargı sistemiyle ilgili tavsiyesi", id: "Nasihat Ali kepada Omar mengenai lembaga peradilan" }
summary:
  en: "During Umar's caliphate Ali repeatedly corrected or advised the judgments: he stopped the stoning of a woman with a mental affliction, asked Umar what authority he had over the unborn child of a confessing pregnant woman, showed by a test that a woman's claim of assault was false, and said that the innovated marriage should be returned to the Sunna. Umar is reported to have said that he sought refuge from a problem Abu al-Hasan could not solve."
  ar: "في خلافة عمر أشار علي مراراً بتصويب الأحكام: منع رجم امرأة مبتلاة بالجنون، وسأل عمر عن سلطانه على ما في بطن حامل اعترفت بالفجور، وكشف بالتجربة كذب امرأة ادعت أن شاباً راودها، وردّ نكاحاً في العدة إلى السنة. وتذكر الرواية أن عمر قال: أعوذ بالله من معضلة ليس لها أبو الحسن."
  es: "Durante el califato de Umar, Ali corrigió o aconsejó repetidamente sobre los juicios: impidió la lapidación de una mujer con una enfermedad mental, preguntó a Umar qué autoridad tenía sobre el feto de una mujer embarazada que confesaba, demostró mediante una prueba que la denuncia de agresión de una mujer era falsa y afirmó que el matrimonio innovador debía volver a la Sunna. Se dice que Umar afirmó haber buscado refugio de un problema que Abu al-Hasan no había podido resolver."
  fr: "Durant le califat d'Umar, Ali corrigea ou conseilla à plusieurs reprises les décisions judiciaires: il fit cesser la lapidation d'une femme atteinte de troubles mentaux, interrogea Umar sur son autorité concernant l'enfant à naître d'une femme enceinte qui avait avoué sa grossesse, démontra par une épreuve la fausseté de l'accusation d'agression portée par une femme et déclara que le mariage, considéré comme une innovation, devait être rétabli selon la Sunna. On rapporte qu'Umar aurait déclaré avoir cherché refuge auprès d'Abu al-Hasan face à un problème qu'il ne parvenait pas à résoudre."
  ur: "عمر کی خلافت کے دوران علی نے بار بار فیصلوں کی اصلاح یا نصیحت کی: اس نے ایک ذہنی تکلیف میں مبتلا عورت کو سنگسار کرنے سے روک دیا، عمر سے پوچھا کہ اسے حاملہ عورت کے حاملہ ہونے والے بچے پر کیا اختیار ہے، ایک ٹیسٹ سے ثابت ہوا کہ عورت کے حملے کا دعویٰ جھوٹا ہے، اور کہا کہ بدعت شدہ شادی کو سنت کی طرف لوٹایا جانا چاہیے۔ عمر کے بارے میں کہا جاتا ہے کہ انہوں نے ایک ایسے مسئلے سے پناہ مانگی جس کو ابو الحسن حل نہ کر سکے۔"
  tr: "Ömer'in halifeliği döneminde Ali, yasal hükümlere defalarca düzeltmeler getirdi: akıl hastası bir kadının taşlanarak öldürülmesini yasakladı, zina itirafında bulunan hamile bir kadının doğmamış çocuğu üzerindeki yetkisi konusunda Ömer'i sorguladı, bir kadının genç bir adamın kendisine cinsel tacizde bulunduğu iddiasının yanlışlığını ortaya koydu ve bekleme süresi içinde evlilikle ilgili Sünneti yeniden tesis etti. Rivayette Ömer'in şöyle dediği belirtilir: \"Ebu el-Hasan'ın (Ali) çözüm bulamadığı bir sorundan Allah'a sığınırım.\""
  id: "Selama kekhalifahan Umar, Ali berulang kali memberikan koreksi terhadap hukum-hukum: ia melarang rajam terhadap wanita yang menderita gangguan jiwa, mempertanyakan Umar tentang kewenangannya atas janin dari wanita hamil yang mengaku berzina, membongkar kepalsuan klaim seorang wanita bahwa seorang pemuda telah mendekatinya, dan mengembalikan Sunnah mengenai pernikahan selama masa iddah. Riwayat tersebut menyebutkan bahwa Umar berkata: \"Aku berlindung kepada Allah dari suatu masalah yang tidak dapat dipecahkan oleh Abu al-Hasan (Ali).\""
