label: { ar: "الملحمة الكبرى بين التتار والقفجاق والروس سنة 620", en: "The great battle between the Tatars, the Qipchaq and the Russians, 620", es: "La gran batalla entre los tártaros, los kipchaq y los rusos, 620", fr: "La grande bataille entre les Tatars, les Qiptchaks et les Russes, 620", ur: "تاتاریوں، کیپچاق اور روسیوں کے درمیان عظیم جنگ، 620", tr: "620 yılında Tatarlar, Kıpçaklar ve Ruslar arasında yaşanan büyük savaş.", id: "Pertempuran besar antara Tatar, Kipchak, dan Rusia pada tahun 620" }
summary:
  ar: "في سنة عشرين وستمائة كانت الملحمة الكبرى بين التتار وبين القفجاق والروس، وثبت الجمعان أياماً ثم انتصرت التتار وعلُوا أولئك بالسيف {cite:shadharat-dhahab p. 87}."
  en: "In 620 the great battle took place between the Tatars and the Qipchaq and the Russians. The two hosts held their ground for days, then the Tatars prevailed and overpowered the others by the sword {cite:shadharat-dhahab p. 87}."
  es: "En el año 620 tuvo lugar la gran batalla entre los tártaros, los kipchaq y los rusos. Ambos ejércitos resistieron durante días, hasta que los tártaros se impusieron y vencieron a los demás por la espada {cita: shadharat-dhahab p. 87}."
  fr: "En 620, une grande bataille opposa les Tatars aux Qiptchaks et aux Russes. Les deux camps tinrent bon pendant plusieurs jours, puis les Tatars l'emportèrent par l'épée (cf. shadharat-dhahab, p. 87)."
  ur: "620 میں تاتاریوں اور کیپچاق اور روسیوں کے درمیان زبردست جنگ ہوئی۔ دونوں میزبانوں نے کئی دنوں تک اپنی زمین پر قبضہ جمائے رکھا، پھر تاتاری غالب آ گئے اور تلوار کے ذریعے دوسروں پر غالب آ گئے۔ 87}۔"
  tr: "Hicri 620 yılında Tatarlar, Kıpçaklar ve Ruslar arasında büyük bir savaş yaşandı. İki ordu günlerce direndi, sonra Tatarlar kılıçlarıyla zafer kazandı ve Ruslara üstünlük sağladı. {cite:shadharat-dhahab s. 87}"
  id: "Pada tahun 620 Hijriah, terjadi pertempuran besar antara Tatar dan Kipchak melawan Rusia. Kedua pasukan bertahan dengan gigih selama beberapa hari, kemudian Tatar meraih kemenangan dan mengalahkan mereka dengan pedang. {cite:shadharat-dhahab hlm. 87}"
