label: { ar: "من جان بلاط إلى طومان باي إلى قانصوه الغوري 905–906هـ", en: "From Jan Balat through Tuman Bay to Qansuh al-Ghuri, 905–906" }
summary:
  ar: "بعد مقتل الملك الناصر محمد بن قايتباي غلب الأمير الكبير جان بلاط مملوك قايتباي على السلطان الظاهر قانصوه فخرج من قلعة مصر وتركها له، فتسلطن جان بلاط في ضحوة يوم الاثنين ثاني ذي القعدة سنة خمس وتسعمائة فأقام نصف سنة وستة عشر يوماً وبنى المدرسة الجنبلاطية خارج باب النصر، ثم خُلع ونُفي إلى الإسكندرية وقتل بها خنقاً، وبويع بعده الملك العادل طومان باي في ثامن عشر جمادى الآخرة سنة ست فأقام ثلاثة أشهر وثلاثة وعشرين يوماً من حين بيعته بقلعة الجبل وبنى المدرسة العادلية، ثم هجم عليه العسكر وقتلوه، وتولى بعده الملك الأشرف أبو النصر قانصوه الغوري يوم الاثنين عيد الفطر من سنة ست وتسعمائة — وهي ولايته الثانية بعد نحو أحد عشر يوماً كانت له سنة 902 حين فر إلى غزة وفُقد في وقعة خان يونس {cite:shadharat-dhahab p. 439-440, 445}."
  en: "After al-Nasir Muhammad b. Qaytbay was killed, the amir-kabir Jan Balat overcame Sultan al-Zahir Qansuh, who vacated the citadel; Jan Balat took the sultanate at mid-morning Monday 2 Dhu'l-Qa'da 905, held it half a year and sixteen days and built the Janbalatiyya madrasa outside Bab al-Nasr before deposition, exile to Alexandria and strangulation. Al-'Adil Tuman Bay was then invested on 18 Jumada II 906, held the Citadel three months and twenty-three days and built the 'Adiliyya before the army killed him; al-Ashraf Abu al-Nasr Qansuh al-Ghuri followed on 'Id al-Fitr 906 — his second reign after about eleven days in 902 when he fled to Gaza and was lost at the battle of Khan Yunus {cite:shadharat-dhahab p. 439-440, 445}."
