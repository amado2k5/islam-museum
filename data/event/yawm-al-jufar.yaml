summary:
  ar: "يوم الجفار ويسمى الصيلم لكثرة من قتل به؛ لما كان على رأس الحول من يوم النسار اجتمع من العرب من شهد النسار برؤسائهم فالتقوا بالجفار واقتتلوا فصبرت تميم فعظم القتل في بني عامر وخاصة في بني عمرو بن تميم، وهرب مالك بن كعب جواب قنب العير عن ضرتيه، وفيه شعر بشر بن أبي خازم في عصبة تميم «عصبت تميم أن يقتل عامر، ولا النساء وكان القوم أحراباً» {cite:kamil-ibn-al-athir p. 466}."
  en: "The day of al-Jufar, called al-Saylim 'the shearing' for its slaughter: a year after al-Nasar the same hosts met again and Tamim stood fast, cutting deep into Banu Amir — Malik ibn Ka'b 'Jawab' fled from his two wives, and Bishr ibn Abi Khazim sang of Tamim's squadrons {cite:kamil-ibn-al-athir p. 466}."
