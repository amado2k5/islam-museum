id: event/battle-of-dayr-al-jathaliq
class: event
kind: battle
label: { ar: "وقعة دير الجاثليق", en: "Battle of Dayr al-Jathaliq", fr: "La bataille de Dayr al-Jathaliq", es: "Batalla de Dayr al-Jathaliq", ur: "دیر الجثالق کی جنگ" }
summary:
  ar: "في سنة اثنتين وسبعين خرج مصعب بن الزبير بأهل العراق يريد عبد الملك بن مروان بالشام، فنزل عبد الملك بدير الجاثليق من أرض السواد، ولحقت به رايات من ربيعة، وأُفرد مصعب في سبعة نفر بعد أن تخلى عنه من كان معه من مصر واليمن، فقاتل حتى قُتل، وجيء برأسه إلى عبد الملك {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
  en: "In 72 AH Musab ibn al-Zubayr set out from Iraq with its people against Abd al-Malik ibn Marwan in Syria. Abd al-Malik camped at Dayr al-Jathaliq in the countryside of al-Sawad, and banners from Rabi'a joined him. Musab was left with seven men after those who had been with him from Egypt and Yemen abandoned him; he fought until he was killed, and his head was brought to Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
  fr: "En 72 H, Mus'ab ibn al-Zubayr partit d'Irak avec ses gens contre Abd al-Malik ibn Marwan en Syrie. Abd al-Malik campa à Dayr al-Jathaliq, dans la campagne du Sawad, et des bannières de Rabi'a le rejoignirent. Mus'ab resta avec sept hommes après que l'eurent abandonné ceux d'Égypte et du Yémen qui étaient avec lui ; il combattit jusqu'à être tué, et sa tête fut apportée à Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
  es: "En el año 72 de la Hégira, Musab ibn al-Zubayr partió de Irak con su gente contra Abd al-Malik ibn Marwan en Siria. Abd al-Malik acampó en Dayr al-Jathaliq, en la campiña de al-Sawad, y se le unieron estandartes de Rabi'a. Musab se quedó con siete hombres después de que quienes lo habían acompañado desde Egipto y Yemen lo abandonaran; luchó hasta morir, y su cabeza fue llevada ante Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
  ur: "72ھ میں مصعب بن الزبیر اپنے لوگوں کے ساتھ عراق سے شام میں عبد الملک بن مروان کے خلاف نکلا۔ عبد الملک نے السواد کے دیہی علاقوں میں دیر الجثالق میں ڈیرہ ڈالا اور ربیعہ کے بینرز اس کے ساتھ شامل ہوگئے۔ مصعب سات آدمیوں کے ساتھ رہ گیا جب مصر اور یمن سے اس کے ساتھ رہنے والوں نے اسے چھوڑ دیا۔ وہ لڑتا رہا یہاں تک کہ وہ مارا گیا اور اس کا سر عبد الملک کے پاس لایا گیا۔ 216}{حوالہ:بکر-امیاد-ریاست-1134715 صفحہ۔ 218}{حوالہ:بکر-امیاد-ریاست-1134715 صفحہ۔ 220}۔"
