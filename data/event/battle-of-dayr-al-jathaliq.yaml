id: event/battle-of-dayr-al-jathaliq
class: event
kind: battle
label: { ar: "وقعة دير الجاثليق", en: "Battle of Dayr al-Jathaliq" }
summary:
  ar: "في سنة اثنتين وسبعين خرج مصعب بن الزبير بأهل العراق يريد عبد الملك بن مروان بالشام، فنزل عبد الملك بدير الجاثليق من أرض السواد، ولحقت به رايات من ربيعة، وأُفرد مصعب في سبعة نفر بعد أن تخلى عنه من كان معه من مصر واليمن، فقاتل حتى قُتل، وجيء برأسه إلى عبد الملك {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
  en: "In 72 AH Musab ibn al-Zubayr set out from Iraq with its people against Abd al-Malik ibn Marwan in Syria. Abd al-Malik camped at Dayr al-Jathaliq in the countryside of al-Sawad, and banners from Rabi'a joined him. Musab was left with seven men after those who had been with him from Egypt and Yemen abandoned him; he fought until he was killed, and his head was brought to Abd al-Malik {cite:bakr-umayyad-state-1134715 p. 216}{cite:bakr-umayyad-state-1134715 p. 218}{cite:bakr-umayyad-state-1134715 p. 220}."
