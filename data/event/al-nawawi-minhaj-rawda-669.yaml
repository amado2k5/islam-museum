label:
  ar: "النووي يفرغ من «المنهاج» و«الروضة»، ٦٦٩هـ/١٢٧٠-١٢٧١م"
  en: "Al-Nawawi finishes the Minhaj and the Rawda, 669/1270-71"
  ur: "نووی کی «منہاج» اور «روضہ» کی تکمیل، 669ھ/1270-71ء"
  es: "Al-Nawawi finaliza el Minhaj y el Rawda, 669/1270-71"
  fr: "Al-Nawawi achève le Minhaj et la Rawda, 669/1270-71"
  tr: "Al-Nawawi “Al-Minhaj” ve “Al-Rawda”yı tamamladı, 669 H./1270-1271 MS"
  id: "Al-Nawawi menyelesaikan “Al-Minhaj” dan “Al-Rawda”, 669 H/1270-1271 M."
summary:
  ar: "فرغ النووي سنة ٦٦٩هـ/١٢٧٠-١٢٧١م من كتابيه «منهاج الطالبين» و«الروضة في مختصر شرح الوجيز» للغزالي؛ وصار المنهاج — وهو منتخب من محرر الرافعي — مع شرحيه تحفة ابن حجر ونهاية الرملي أعلى مرجع عند الشافعية منذ القرن العاشر الهجري {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
  en: "In 669/1270-71 al-Nawawi completed two works: the Minhaj al-Talibin, an abridgement of al-Rafiʿi's Muharrar, and the Rawda, an abridged commentary on al-Ghazali's Wajiz. With its two great commentaries, Ibn Hajar's Tuhfa and al-Ramli's Nihaya, the Minhaj came to be regarded from the tenth Islamic century as the supreme authority of the Shafiʿi school {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
  ur: "669ھ/1270-71ء میں نووی نے دو کتابیں مکمل کیں: منہاج الطالبین، جو رافعی کی محرر کا انتخاب ہے، اور روضہ، جو غزالی کی وجیز کا مختصر شرح ہے۔ منہاج اپنے دو عظیم شروح ابن حجر کی تحفہ اور رملی کی نہایہ کے ساتھ دسویں صدی ہجری سے شافعی مذہب کی اعلیٰ مرجع شمار ہوئی {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}۔"
  es: "En 669/1270-71, al-Nawawi completó dos obras: el Minhaj al-Talibin, un compendio del Muharrar de al-Rafiʿi, y el Rawda, un comentario abreviado del Wajiz de al-Ghazali. Con sus dos grandes comentarios, el Tuhfa de Ibn Hajar y el Nihaya de al-Ramli, el Minhaj llegó a ser considerado, a partir del siglo X islámico, como la máxima autoridad de la escuela Shafiʿi {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
  fr: "En 669/1270-71, al-Nawawi acheva deux ouvrages: le Minhaj al-Talibin, un abrégé du Muharrar d’al-Rafiʿi, et le Rawda, un commentaire abrégé du Wajiz d’al-Ghazali. Grâce à ses deux grands commentaires, le Tuhfa d’Ibn Hajar et le Nihaya d’al-Ramli, le Minhaj fut considéré, à partir du Xᵉ siècle de l’Hégire, comme l’autorité suprême de l’école shafi’ite (voir: Encyclopaedia of Islam, vol. 7, p. 1096)."
  tr: "Hicri 669/Miladi 1270-1271 yılında El-Nawawi, “Minhaj al-Talibin” ve Gazali'nin “Al-Rawda fi Mukhtasar Sharh al-Wajiz” adlı iki kitabını tamamladı. El-Rafi'i'nin eserlerinin bir derlemesi olan El-Minhaj, iki tefsiriyle birlikte (Tuhfat Ibn Hajar ve Nihayat al-Ramli), Hicri onuncu yüzyıldan beri Şafiîler için en önemli referans kaynağı oldu. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}"
  id: "Pada tahun 669 H/1270-1271 M, Al-Nawawi menyelesaikan dua bukunya, “Minhaj al-Talibin” dan “Al-Rawda fi Mukhtasar Sharh al-Wajiz” karya Al-Ghazali. Al-Minhaj—yang merupakan antologi karya Al-Rafi’i—bersama dengan dua komentarnya, Tuhfat Ibn Hajar dan Nihayat al-Ramli, menjadi referensi tertinggi bagi mazhab Syafi’i sejak abad kesepuluh H {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
