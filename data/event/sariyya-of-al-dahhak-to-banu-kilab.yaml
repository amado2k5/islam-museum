  en: "In Rabi' al-Awwal 9 AH the Prophet sent al-Dahhak ibn Sufyan al-Kilabi to his own people Banu Kilab to invite them to Islam; they refused and fought, and the Muslims routed them and killed one man."
  ar: "بعث النبي الضحاك بن سفيان الكلابي في ربيع الأول سنة 9هـ إلى قومه بني كلاب لدعوتهم إلى الإسلام؛ فأبوا وقاتلوا، فهزمهم المسلمون وقتلوا منهم رجلاً."
