id: event/al-hadi-calls-the-prophets-kin-to-ride-against-the-enemy-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يسأل فيها آل النبي متى يقومون ويحثهم على التأهب وتروح الخيل إلى العدو، ص310-311"
  en: "Verses of al-Hadi asking the family of the Prophet when they will rise, urging them to prepare and their horses to go out against the enemy, pp. 310-311"
  ur: "ہادی کے اشعار جن میں وہ آل نبی سے پوچھتا ہے کہ کب اٹھیں گے، انہیں تیاری اور دشمن کی طرف گھوڑے لے جانے پر ابھارتا ہے، ص310-311"
  es: "Versículos de al-Hadi preguntando a la familia del Profeta cuándo resucitarán, exhortándolos a prepararse y a que sus caballos salgan contra el enemigo, págs. 310-311"
  fr: "Versets d'al-Hadi demandant à la famille du Prophète quand ils se lèveront, les exhortant à se préparer et à faire sortir leurs chevaux contre l'ennemi, pp. 310-311"
  tr: "Hadid'in, Peygamber ailesine ne zaman ayağa kalkacaklarını sorduğu ve hazırlık yapmaları için onları teşvik ettiği, atların düşmana gideceği ayetleri (s. 310-311)."
  id: "Ayat-ayat Al-Hadi di mana ia bertanya kepada keluarga Nabi kapan mereka akan bangkit dan mendesak mereka untuk bersiap-siap dan kuda-kuda akan pergi ke musuh, hlm. 310-311"
summary:
  ar: "قصيدة من الكامل بعنوان «وله أيضاً» تبدأ في أسفل ص310 بأن السيوف تُسلّ وتنتمي إلى محمد، ثم يسأل الهادي آل النبي ورهطه متى يقومون وكم يألفون مضاجع الأزواج، ويحثهم على التشمّر، ويصف عسكراً مدججاً وفرساناً وخيلاً، وتقول الحاشية إن بيتاً وما بعده سقط من نسخة ص."
  en: "A poem in the kamil metre under the heading \"and also of his\", begun at the foot of p. 310 with swords drawn and claiming Muhammad as their kin, in which al-Hadi asks the Prophet's family and clan when they will rise and how long they will keep to the beds of their wives, urges them to gird up, and pictures an armed host with its horsemen and horses; the footnote says a line and what follows is missing from manuscript S."
  ur: "کامل بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت جو ص310 کے آخر میں شروع ہوتی ہے، تلواریں نکلتی ہیں اور محمد سے نسبت جتاتی ہیں، اور ہادی آل نبی اور ان کے قبیلے سے پوچھتا ہے کہ کب اٹھیں گے اور کب تک بیویوں کے بستروں سے مانوس رہیں گے، انہیں کمر کسنے پر ابھارتا ہے اور مسلح لشکر، سواروں اور گھوڑوں کا نقشہ کھینچتا ہے؛ حاشیہ کے مطابق ایک شعر اور اس کے بعد کا حصہ نسخہ ص میں نہیں۔"
  es: "Un poema en metro kamil bajo el título \"y también de él\", que comienza al pie de la página 310 con espadas desenvainadas y reclamando a Mahoma como su pariente, en el que al-Hadi pregunta a la familia y al clan del Profeta cuándo se levantarán y cuánto tiempo permanecerán en los lechos de sus esposas, los insta a prepararse y describe un ejército armado con sus jinetes y caballos; la nota al pie dice que falta una línea y lo que sigue en el manuscrito S."
  fr: "Un poème en mètre kamil sous le titre « et aussi de lui », commençant au bas de la page 310 avec des épées dégainées et revendiquant Muhammad comme leur parent, dans lequel al-Hadi demande à la famille et au clan du Prophète quand ils se lèveront et combien de temps ils resteront au lit de leurs épouses, les exhorte à se préparer et décrit une armée armée avec ses cavaliers et ses chevaux; la note de bas de page indique qu'une ligne et ce qui suit manquent dans le manuscrit S."
  tr: "Kamil ölçüsünde yazılmış \"Ve Ona da\" başlıklı bir şiir, 310. sayfanın alt kısmında kılıçların çekildiğini ve Muhammed'e ait olduğunu belirterek başlar; ardından Al-Hadi, Peygamber ailesine ve kabilesine ne zaman kalkacaklarını ve eşlerinin yataklarına ne sıklıkla alıştıklarını sorar ve kendilerini hazırlamaları için onları teşvik eder; silahlı bir orduyu, şövalyeleri ve atları anlatır ve dipnotta 310. sayfanın kopyasında bir ayetin ve onu takip eden kısmın eksik olduğu belirtilir."
  id: "Sebuah puisi dalam meter Kamil berjudul “Dan Kepadanya Juga” dimulai di bagian bawah halaman 310 dengan menyebutkan bahwa pedang-pedang telah dihunus dan milik Muhammad, kemudian Al-Hadi bertanya kepada keluarga Nabi dan klannya kapan mereka akan bangkit dan seberapa sering mereka terbiasa dengan ranjang pasangan mereka, dan dia mendesak mereka untuk mempersiapkan diri, dan dia menggambarkan pasukan bersenjata, ksatria dan kuda, dan catatan kaki mengatakan bahwa satu bait dan apa yang mengikutinya hilang dari salinan halaman 310."
