id: event/the-same-poem-boasts-of-the-forefathers-the-sons-of-al-zahra-and-the-faith-given-to-yemen-and-sham
class: event
kind: other
label:
  ar: "تتمة قصيدة الوافر: الفخر بالآباء وببني الزهراء وبما قدموه لليمن والشام، ص329 إلى ص330"
  en: "The rest of the wafir poem: the boast of the forefathers, the sons of al-Zahra and what the line gave Yemen and Sham, pp. 329 to 330"
  ur: "وافر کی نظم کا بقیہ: آباء اور بنی زہرا پر فخر اور اس پر کہ نسل نے یمن اور شام کو کیا دیا، ص329 تا ص330"
  es: "El resto del poema del wafir: el orgullo de los antepasados, los hijos de al-Zahra y lo que el linaje aportó a Yemen y Sham, págs. 329 a 330."
  fr: "Le reste du poème wafir: la vantardise des ancêtres, les fils d'al-Zahra et ce que la lignée a donné au Yémen et au Sham, pp. 329 à 330"
  tr: "Şiirin Vafir vezninde devamı: Zahra'nın babaları ve oğullarıyla Yemen ve Suriye'ye sundukları gurur, s. 329-330"
  id: "Kelanjutan puisi dalam meter Waafir: Kebanggaan pada para ayah dan putra Zahra dan apa yang mereka persembahkan untuk Yaman dan Suriah, hlm. 329-330"
summary:
  ar: "تتمة القصيدة في ص329 وأول ص330، يصف فيها الشاعر ممدوحاً بأنه كان في السلم هدى ونوراً وفي الوغى سيفاً، ويذكر ما فعله قوم بني الزهراء من دفاع وانتقام، ويفتخر بأن أباه الهادي وجده رسول الله وبأن أولهم نبي وآخرهم إمام، ويذكر في ص330 أنهم ملأوا الأرض إسلاماً وعدلاً وملكوا الورى يمناً وشاماً وأن الناس لولاهم ما صلوا ولا حجوا ولا زكوا ولا صاموا."
  en: "The rest of the poem on p. 329 and the top of p. 330, in which the poet says of a praised man that he was guidance and light in peace and a sword in battle, tells what the people of the sons of al-Zahra did in defence and vengeance, and boasts that his father is al-Hadi, his grandfather the Messenger of God, and that the first of them was a prophet and the last an imam; on p. 330 he says they filled the earth with Islam and justice, ruled the peoples of Yemen and Sham, and that without them people would not have prayed, made pilgrimage, paid zakat or fasted."
  ur: "ص329 اور ص330 کے آغاز میں نظم کا بقیہ، جس میں شاعر ایک ممدوح کے بارے میں کہتا ہے کہ وہ امن میں ہدایت اور نور تھا اور جنگ میں تلوار، بتاتا ہے کہ بنی زہرا کی قوم نے دفاع اور انتقام میں کیا کیا، اور فخر کرتا ہے کہ اس کا والد ہادی ہے، دادا رسول اللہ، اور ان میں پہلا نبی اور آخری امام ہے؛ ص330 پر وہ کہتا ہے کہ انہوں نے زمین کو اسلام اور عدل سے بھر دیا، یمن اور شام کے لوگوں پر حکومت کی، اور ان کے بغیر لوگ نہ نماز پڑھتے، نہ حج کرتے، نہ زکوٰۃ دیتے، نہ روزے رکھتے۔"
  es: "El resto del poema en la página 329 y la parte superior de la página 330, en la que el poeta dice de un hombre alabado que fue guía y luz en la paz y una espada en la batalla, cuenta lo que hizo la gente de los hijos de al-Zahra en defensa y venganza, y se jacta de que su padre es al-Hadi, su abuelo el Mensajero de Dios, y que el primero de ellos fue un profeta y el último un imán; en la página 330 dice que llenaron la tierra con el Islam y la justicia, gobernaron a los pueblos de Yemen y Sham, y que sin ellos la gente no habría rezado, peregrinado, pagado el zakat ni ayunado."
  fr: "Le reste du poème, à la page 329 et en haut de la page 330, où le poète dit d'un homme loué qu'il était un guide et une lumière en temps de paix et une épée au combat, raconte ce que les descendants d'al-Zahra ont fait en matière de défense et de vengeance, et se vante que son père est al-Hadi, son grand-père le Messager de Dieu, et que le premier d'entre eux était un prophète et le dernier un imam; à la page 330, il dit qu'ils ont rempli la terre d'Islam et de justice, ont gouverné les peuples du Yémen et du Levant, et que sans eux, les gens n'auraient pas prié, fait le pèlerinage, payé la zakat ou jeûné."
  tr: "Şiirin geri kalanı 329. sayfada ve 330. sayfanın başında yer almaktadır; burada şair, övülen kişiyi barışta rehber ve ışık, savaşta ise kılıç olarak tanımlar. Beni Zehra halkının savunma ve intikam için neler yaptığından bahseder ve babasının Hadidi, dedesinin ise Allah'ın Elçisi olduğunu, ilkinin peygamber, sonuncusunun ise imam olduğunu övünerek anlatır. 330. sayfada, yeryüzünü İslam ve adaletle doldurduklarını, Yemen ve Suriye'de insanlığa hükmettiklerini ve onlar olmasaydı insanların namaz kılmayacaklarını, hac yapmayacaklarını, zekât vermeyeceklerini veya oruç tutmayacaklarını belirtir."
  id: "Bagian selanjutnya dari puisi tersebut terdapat di halaman 329 dan awal halaman 330, di mana penyair menggambarkan orang yang dipuji sebagai penuntun dan cahaya di masa damai serta pedang di masa perang. Ia menyebutkan apa yang dilakukan oleh kaum Bani Zahra dalam membela diri dan membalas dendam, dan ia membanggakan bahwa ayahnya adalah Al-Hadi dan kakeknya adalah Rasulullah, dan bahwa yang pertama dari mereka adalah seorang nabi dan yang terakhir adalah seorang imam. Di halaman 330, ia menyebutkan bahwa mereka memenuhi bumi dengan Islam dan keadilan serta memerintah umat manusia di Yaman dan Suriah, dan bahwa tanpa mereka orang-orang tidak akan shalat, melaksanakan haji, memberikan zakat, atau berpuasa."
