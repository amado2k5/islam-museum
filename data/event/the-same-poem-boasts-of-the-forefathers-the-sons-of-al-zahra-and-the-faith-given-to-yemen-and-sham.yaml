id: event/the-same-poem-boasts-of-the-forefathers-the-sons-of-al-zahra-and-the-faith-given-to-yemen-and-sham
class: event
kind: other
label:
  ar: "تتمة قصيدة الوافر: الفخر بالآباء وببني الزهراء وبما قدموه لليمن والشام، ص329 إلى ص330"
  en: "The rest of the wafir poem: the boast of the forefathers, the sons of al-Zahra and what the line gave Yemen and Sham, pp. 329 to 330"
  ur: "وافر کی نظم کا بقیہ: آباء اور بنی زہرا پر فخر اور اس پر کہ نسل نے یمن اور شام کو کیا دیا، ص329 تا ص330"
summary:
  ar: "تتمة القصيدة في ص329 وأول ص330، يصف فيها الشاعر ممدوحاً بأنه كان في السلم هدى ونوراً وفي الوغى سيفاً، ويذكر ما فعله قوم بني الزهراء من دفاع وانتقام، ويفتخر بأن أباه الهادي وجده رسول الله وبأن أولهم نبي وآخرهم إمام، ويذكر في ص330 أنهم ملأوا الأرض إسلاماً وعدلاً وملكوا الورى يمناً وشاماً وأن الناس لولاهم ما صلوا ولا حجوا ولا زكوا ولا صاموا."
  en: "The rest of the poem on p. 329 and the top of p. 330, in which the poet says of a praised man that he was guidance and light in peace and a sword in battle, tells what the people of the sons of al-Zahra did in defence and vengeance, and boasts that his father is al-Hadi, his grandfather the Messenger of God, and that the first of them was a prophet and the last an imam; on p. 330 he says they filled the earth with Islam and justice, ruled the peoples of Yemen and Sham, and that without them people would not have prayed, made pilgrimage, paid zakat or fasted."
  ur: "ص329 اور ص330 کے آغاز میں نظم کا بقیہ، جس میں شاعر ایک ممدوح کے بارے میں کہتا ہے کہ وہ امن میں ہدایت اور نور تھا اور جنگ میں تلوار، بتاتا ہے کہ بنی زہرا کی قوم نے دفاع اور انتقام میں کیا کیا، اور فخر کرتا ہے کہ اس کا والد ہادی ہے، دادا رسول اللہ، اور ان میں پہلا نبی اور آخری امام ہے؛ ص330 پر وہ کہتا ہے کہ انہوں نے زمین کو اسلام اور عدل سے بھر دیا، یمن اور شام کے لوگوں پر حکومت کی، اور ان کے بغیر لوگ نہ نماز پڑھتے، نہ حج کرتے، نہ زکوٰۃ دیتے، نہ روزے رکھتے۔"
