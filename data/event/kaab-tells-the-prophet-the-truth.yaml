id: event/kaab-tells-the-prophet-the-truth
class: event
kind: other
label: { ar: "كعب يصدق النبي القول", en: "Ka'b tells the Prophet the truth", es: "Ka'b le dice la verdad al Profeta", fr: "Ka'b dit la vérité au Prophète", ur: "کعب نے نبی سے سچ کہا", tr: "Ka'b, Peygamberin sözünü doğruladı.", id: "Ka'b membenarkan pernyataan Nabi." }
summary:
  ar: "لما بلغ كعباً قفول النبي من تبوك عزم على الصدق، فلما سلّم على النبي في المسجد وسأله عن سبب تخلفه أقر بأنه لا عذر له، فقال له النبي: قد صدقت، فقم حتى يقضي الله فيك؛ فتبعه رجال من بني سلمة يلومونه."
  en: "When news of the Prophet's return from Tabuk reached Ka'b he resolved on honesty. When he greeted the Prophet in the mosque and was asked why he had stayed behind, he admitted he had no excuse; the Prophet said: you have told the truth — rise until God decides your case. Men of Banu Salima followed him out, blaming him."
  es: "Cuando la noticia del regreso del Profeta de Tabuk llegó a Ka'b, decidió ser honesto. Al saludar al Profeta en la mezquita y preguntarle por qué se había quedado, admitió no tener excusa. El Profeta le dijo: «Has dicho la verdad; levántate hasta que Dios decida tu caso». Los hombres de Banu Salima lo siguieron, culpándolo."
  fr: "Lorsque la nouvelle du retour du Prophète de Tabouk parvint à Ka'b, il résolut de dire la vérité. Lorsqu'il salua le Prophète à la mosquée et qu'on lui demanda pourquoi il était resté en arrière, il admit n'avoir aucune excuse. Le Prophète dit alors: « Tu as dit la vérité; lève-toi jusqu'à ce que Dieu rende son verdict. » Les hommes de Banu Salima le suivirent dehors, le blâmant."
  ur: "جب نبی کی تبوک سے واپسی کی خبر کعب کو پہنچی تو آپ نے ایمانداری کا عزم کیا۔ جب اس نے مسجد میں نبی کو سلام کیا اور پوچھا گیا کہ آپ کیوں پیچھے رہے تو اس نے اعتراف کیا کہ اس کے پاس کوئی عذر نہیں ہے۔ آپ نے فرمایا: تم نے سچ کہا، اٹھو یہاں تک کہ اللہ تمہارے معاملے کا فیصلہ کر دے۔ بنو سلیمہ کے آدمی اس پر الزام لگاتے ہوئے اس کے پیچھے پیچھے نکل گئے۔"
  tr: "Ka'b, Peygamber'in Tebük'ten döndüğünü duyunca doğruyu söylemeye karar verdi. Mescitte Peygamber'i selamlayıp yokluğunun sebebini sorduğunda, hiçbir mazereti olmadığını itiraf etti. Peygamber ona şöyle dedi: \"Doğruyu söyledin, Allah kaderini belirlesin diye ayakta dur.\" Beni Salama'dan adamlar onu kınayarak peşinden gittiler."
  id: "Ketika Ka’b mendengar bahwa Nabi telah kembali dari Tabuk, ia bertekad untuk jujur. Ketika ia memberi salam kepada Nabi di masjid dan menanyakan alasan ketidakhadirannya, ia mengakui bahwa ia tidak punya alasan. Nabi berkata kepadanya: \"Engkau telah jujur, maka berdirilah sampai Allah memutuskan nasibmu.\" Orang-orang dari Bani Salama mengikutinya, sambil mencelanya."
