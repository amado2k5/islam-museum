summary:
  ar: "لما بلغ كعباً قفول النبي من تبوك عزم على الصدق، فلما سلّم على النبي في المسجد وسأله عن سبب تخلفه أقر بأنه لا عذر له، فقال له النبي: قد صدقت، فقم حتى يقضي الله فيك؛ فتبعه رجال من بني سلمة يلومونه."
  en: "When news of the Prophet's return from Tabuk reached Ka'b he resolved on honesty. When he greeted the Prophet in the mosque and was asked why he had stayed behind, he admitted he had no excuse; the Prophet said: you have told the truth — rise until God decides your case. Men of Banu Salima followed him out, blaming him."
