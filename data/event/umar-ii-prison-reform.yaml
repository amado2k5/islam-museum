id: event/umar-ii-prison-reform
class: event
kind: other
label: { ar: "إصلاح أحوال السجون في عهد عمر بن عبد العزيز", en: "Prison Reform under Umar ibn Abd al-Aziz" }
summary:
  ar: "أمر عمر بن عبد العزيز بتعجيل النظر في أمر المتهمين، فيؤدَّب من يستحق ويُطلق من لا قضية عليه، ورأى أن إقامة الحدود تقلل عدد المسجونين {cite:salabi-umayyad-state-2020 p.378}. وأمر بالإنفاق على السجناء من الصدقة شهراً بشهر، وبكسوتهم في الشتاء والصيف، وبأن يُكفَّن من مات منهم ولا ولي له ويُدفن من بيت المال، وبتعهد مرضاهم، وبأن يُجعل للنساء سجن على حدة، وبأن يُولّى على السجن من يُوثق بأمانته ولا يرتشي {cite:salabi-umayyad-state-2020 pp.378-379}."
  en: "Umar ibn Abd al-Aziz ordered that the cases of accused prisoners be examined without delay: whoever deserved punishment was punished, and whoever had no charge against him was released. He judged that carrying out the hudud penalties would reduce the number of prisoners {cite:salabi-umayyad-state-2020 p.378}. He ordered that prisoners be provided for from charitable alms month by month and clothed in winter and summer; that any who died without kin be shrouded and buried from the public treasury; that their sick be cared for; that women have a separate prison; and that the prison be entrusted to a man known for trustworthiness who takes no bribes {cite:salabi-umayyad-state-2020 pp.378-379}."
