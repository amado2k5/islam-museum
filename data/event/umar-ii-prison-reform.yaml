label: { ar: "إصلاح أحوال السجون في عهد عمر بن عبد العزيز" }
summary:
  ar: "أمر عمر بن عبد العزيز بتعجيل النظر في أمر المتهمين، فيؤدَّب من يستحق ويُطلق من لا قضية عليه، ورأى أن إقامة الحدود تقلل عدد المسجونين {cite:salabi-umayyad-state-2020 p.378}. وأمر بالإنفاق على السجناء من الصدقة شهراً بشهر، وبكسوتهم في الشتاء والصيف، وبأن يُكفَّن من مات منهم ولا ولي له ويُدفن من بيت المال، وبتعهد مرضاهم، وبأن يُجعل للنساء سجن على حدة، وبأن يُولّى على السجن من يُوثق بأمانته ولا يرتشي {cite:salabi-umayyad-state-2020 pp.378-379}."
