label: { ar: "تصنيف «كتاب المناظر»", en: "Kitāb al-Manāẓir composed", es: "Kitāb al-Manāẓir compuesto", fr: "Kitāb al-Manāẓir composé", ur: "کتاب المنیر کی تشکیل", tr: "\"Optik Kitabı\"nın Sınıflandırılması", id: "Klasifikasi \"Buku Optik\"" }
summary:
  ar: "صنّف ابن الهيثم بالقاهرة «كتاب المناظر» في علم البصريات، أعظم كتبه، بُني على التجربة لا على القياس وحده فغيّر علم البصر إلى القرن السابع عشر {cite:britannica-ibn-al-haytham}."
  en: "In Cairo Ibn al-Haytham composed the Book of Optics, his greatest work — built on experiment rather than conjecture, and it remade the science of vision into the seventeenth century {cite:britannica-ibn-al-haytham}."
  ur: "قاہرہ میں ابن ہیشم نے بصریات پر «کتاب المناظر» لکھی — تجربے پر مبنی اس کا اہم ترین کام جس نے بصریات کی صنعت سترہویں صدی تک بدل دی {cite:britannica-ibn-al-haytham}."
  es: "En El Cairo, Ibn al-Haytham compuso el Libro de Óptica, su obra más importante, basada en la experimentación más que en la conjetura, y que transformó la ciencia de la visión en el siglo XVII {cite:britannica-ibn-al-haytham}."
  fr: "Au Caire, Ibn al-Haytham composa le Livre d'optique, son œuvre majeure — fondée sur l'expérimentation plutôt que sur la conjecture, et qui remodela la science de la vision au XVIIe siècle {cite:britannica-ibn-al-haytham}."
  tr: "İbn el-Haytham, optik bilimi üzerine yazdığı en büyük eseri olan \"Optik Kitabı\"nı Kahire'de kaleme aldı. Bu eser, yalnızca ölçüme değil, deneylere de dayanıyordu ve on yedinci yüzyıla kadar görme bilimini değiştirdi. {cite:britannica-ibn-al-haytham}"
  id: "Ibn al-Haytham menulis di Kairo “Kitab Optik” tentang ilmu optik, buku terbesarnya, yang didasarkan pada eksperimen dan bukan hanya pada pengukuran, dan buku ini mengubah ilmu penglihatan hingga abad ketujuh belas {cite:britannica-ibn-al-haytham}."
