id: event/juwayni-succeeds-father-438
class: event
kind: other
label:
  ar: "الجويني يُقعد مكان أبيه للتدريس قبل العشرين، ٤٣٨هـ"
  en: "Al-Juwayni takes his father's teaching chair before twenty, 438/1047"
  ur: "جوینی بیس سال سے پہلے والد کی جگہ درس پر بیٹھتے ہیں، 438ھ/1047ء"
summary:
  ar: "توفي والده الإمام أبو محمد عبد الله بن يوسف الجويني في ذي القعدة سنة ثمان وثلاثين وأربعمائة {cite:wafayat-ayan}، وقد تفقه عليه أبو المعالي حتى أتى على تسعة من مصنفاته، فأُقعد مكانه للتدريس ولم يكمل عشرين سنة، وكان يدرس ويخرج إلى مدرسة البيهقي، وأحكم الأصول على أبي القاسم الإسفراييني الإسكاف، وكان ينفق من ميراثه ومما يدخله من معلومه {cite:tarikh-islam-dhahabi pp. 230-231} {cite:siyar-alam-nubala j.18 pp. 2574-2575}؛ وعند EI2 أنه واصل تدريس أبيه قبل أن يبلغ العشرين {cite:encyclopaedia-of-islam-2 vol. 2 p. 605}."
  en: "His father the imam Abu Muhammad Abdallah ibn Yusuf al-Juwayni died in Dhu al-Qa'da 438/1047 {cite:wafayat-ayan}; Abu al-Ma'ali had studied fiqh under him until he mastered nine of his works, and was seated in his place to teach before completing twenty years — he taught while going out to al-Bayhaqi's madrasa, perfected the usul under Abu al-Qasim al-Isfara'ini al-Iskaf, and spent on himself from his inheritance and teaching stipend {cite:tarikh-islam-dhahabi pp. 230-231} {cite:siyar-alam-nubala j.18 pp. 2574-2575}; EI2 likewise has him continuing his father's teaching before the age of twenty {cite:encyclopaedia-of-islam-2 vol. 2 p. 605}."
  ur: "ان کے والد امام ابو محمد عبداللہ بن یوسف جوینی 438ھ/1047ء میں ذی القعدہ میں فوت ہوئے {cite:wafayat-ayan}؛ ابو المعالی نے ان سے اس قدر فقہ پڑھی کہ ان کی تصانیف میں سے نو مکمل کر لیں اور بیس سال پورے کیے بغیر ان کی جگہ درس پر بٹھا دیے گئے — وہ درس دیتے اور بيهقی کی مدرسے میں بھی جاتے، ابو القاسم اسفرائینی اسکاف سے اصول میں مہارت حاصل کی، اور میراث و معلوم سے خرچ کرتے رہے {cite:tarikh-islam-dhahabi pp. 230-231} {cite:siyar-alam-nubala j.18 pp. 2574-2575}؛ EI2 کے مطابق بھی انہوں نے بیس سال سے پہلے والد کی تدریس جاری رکھی {cite:encyclopaedia-of-islam-2 vol. 2 p. 605}۔"
