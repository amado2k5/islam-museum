id: event/battle-mohacs-932
class: event
kind: battle
label: { ar: "موقعة موهاكس وفتح بودا", en: "The battle of Mohács and the conquest of Buda" }
summary:
  ar: "دارت معركة موهاكس الأولى في ٢١ ذي القعدة ٩٣٢هـ، أغسطس ١٥٢٦م، بين جيش سليمان القانوني وجيش ملك المجر لويس الثاني، وهُزم فيها الجيش المجري هزيمة تامة في نحو ساعة ونصف وقُتل الملك غرقاً. ودخل سليمان بعدها بودا دون مقاومة، ولم يضم المجر لكنه عدها ملكاً له. وكانت الهزيمة منعطفاً في تاريخ المجر، إذ تلتها فوضى طويلة وانقسام البلاد ثلاث مناطق أكثر من مئة وخمسين سنة. {cite:encyclopaedia-of-islam-2 vol. 7 p. 246} {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}"
  en: "The first battle of Mohács was fought on 21 Dhu 'l-Qa'da 932 AH, August 1526, between Suleiman's army and that of the Hungarian king Louis II. The Hungarian army was completely beaten in about an hour and a half and the king drowned. Suleiman then entered Buda without resistance; he did not annex Hungary but regarded it as his own. The defeat was a turning point, followed by long anarchy and the division of the country into three zones for over 150 years. {cite:encyclopaedia-of-islam-2 vol. 7 p. 246} {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}"
  ur: "موہاچ کی پہلی جنگ ٢١ ذوالقعدہ 932ھ، اگست 1526ء کو سلیمان کے لشکر اور ہنگری کے بادشاہ لوئی ثانی کے لشکر کے درمیان لڑی گئی۔ ہنگری کا لشکر تقریباً ڈیڑھ گھنٹے میں مکمل طور پر شکست کھا گیا اور بادشاہ ڈوب کر مارا گیا۔ سلیمان پھر بغیر مزاحمت کے بودا میں داخل ہوا؛ اس نے ہنگری کو شامل نہیں کیا مگر اپنی ملکیت سمجھا۔ یہ شکست ہنگری کی تاریخ کا موڑ تھی، جس کے بعد طویل انتشار رہا اور ملک ڈیڑھ سو سال سے زیادہ تین حصوں میں بٹا رہا۔ {cite:encyclopaedia-of-islam-2 vol. 7 p. 246} {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}"
