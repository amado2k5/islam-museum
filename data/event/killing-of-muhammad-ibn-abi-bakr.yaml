id: event/killing-of-muhammad-ibn-abi-bakr
class: event
kind: death
label: { ar: "قتل محمد بن أبي بكر بمصر", en: "The Killing of Muhammad ibn Abi Bakr in Egypt", es: "El asesinato de Muhammad ibn Abi Bakr en Egipto", fr: "L'assassinat de Muhammad ibn Abi Bakr en Égypte", ur: "مصر میں محمد بن ابی بکر کا قتل", tr: "Muhammed ibn Abi Bekir Mısır'da öldürüldü.", id: "Muhammad ibn Abi Bakr terbunuh di Mesir." }
summary:
  ar: "عند البلاذري: لما قُتل عثمان وغلب محمد بن أبي حذيفة على مصر — وهو كان أنغلها على عثمان — ولّى عليٌّ قيس بن سعد بن عبادة الأنصاري مصر ثم عزله واستعمل عليها محمد بن أبي بكر الصديق ثم عزله وولّى مالكاً الأشتر فاعتلّ بالقلزم ثم ولّى محمد بن أبي بكر ثانية وردّه عليها فقتله معاوية بن حديج وأحرقه في جوف حمار."
  en: "In al-Baladhuri: when Uthman was killed and Muhammad ibn Abi Hudhayfa seized Egypt — he had made it hostile to Uthman — Ali gave Qays ibn Sa'd ibn Ubada al-Ansari Egypt, dismissed him, employed Muhammad ibn Abi Bakr al-Siddiq over it, dismissed him, gave it to Malik al-Ashtar who sickened at al-Qulzum, then gave Muhammad ibn Abi Bakr it a second time and sent him back to it — whereupon Mu'awiya ibn Khudayj killed him and burned him inside a donkey's belly."
  es: "En al-Baladhuri: cuando Uthman fue asesinado y Muhammad ibn Abi Hudhayfa se apoderó de Egipto —lo había vuelto hostil a Uthman— Ali le dio Egipto a Qays ibn Sa'd ibn Ubada al-Ansari, lo destituyó, puso a Muhammad ibn Abi Bakr al-Siddiq al frente, lo destituyó, se lo dio a Malik al-Ashtar, quien enfermó en al-Qulzum, luego se lo dio a Muhammad ibn Abi Bakr por segunda vez y lo envió de regreso a Egipto, tras lo cual Mu'awiya ibn Khudayj lo mató y lo quemó dentro del vientre de un burro."
  fr: "Dans al-Baladhuri: lorsque Uthman fut tué et que Muhammad ibn Abi Hudhayfa s'empara de l'Égypte — qu'il avait rendue hostile à Uthman —, Ali confia l'Égypte à Qays ibn Sa'd ibn Ubada al-Ansari, le congédia, y employa Muhammad ibn Abi Bakr al-Siddiq, le congédia, la confia à Malik al-Ashtar qui tomba malade à al-Qulzum, puis la confia une seconde fois à Muhammad ibn Abi Bakr et le renvoya sur place — après quoi Mu'awiya ibn Khudayj le tua et le brûla dans le ventre d'un âne."
  ur: "البلادوری میں ہے: جب عثمان قتل ہوا اور محمد بن ابی حذیفہ نے مصر پر قبضہ کر لیا - اس نے عثمان سے دشمنی کی تھی - علی نے قیس بن سعد بن عبادہ الانصاری کو مصر دیا، اسے برطرف کیا، محمد بن ابی بکر الصدیق کو اس پر ملازم رکھا، اسے برطرف کیا، جس نے اسے ملک عشاق کو دے دیا۔ قلزم، پھر محمد بن ابی بکر کو دوسری بار دیا اور اسے واپس بھیج دیا - اس پر معاویہ بن خدیج نے اسے قتل کر کے گدھے کے پیٹ میں جلا دیا۔"
  tr: "El-Baladhuri'ye göre: Osman öldürüldüğünde ve Muhammed ibn Abi Hudeyfa Mısır'ın kontrolünü ele geçirdiğinde -ki o Osman'a en düşman olanlardan biriydi- Ali, Kays ibn Saad ibn Ubadah el-Ensari'yi Mısır valisi olarak atadı, sonra onu görevden alıp Muhammed ibn Abi Bekr el-Siddik'i vali olarak atadı, sonra onu da görevden alıp Malik el-Eşter'i vali olarak atadı, Malik el-Eşter Kulzum'da hastalandı, sonra Muhammed ibn Abi Bekr'i ikinci kez vali olarak atadı ve onu tekrar göreve getirdi, bunun üzerine Muaviye ibn Hudeyj onu öldürüp bir eşeğin içinde yaktı."
  id: "Menurut Al-Baladhuri: Ketika Utsman terbunuh dan Muhammad ibn Abi Hudhayfa menguasai Mesir — dan dialah yang paling memusuhi Utsman — Ali menunjuk Qays ibn Saad ibn Ubadah al-Ansari sebagai gubernur Mesir, kemudian memecatnya dan menunjuk Muhammad ibn Abi Bakr al-Siddiq sebagai gubernur, kemudian memecatnya lagi dan menunjuk Malik al-Ashtar, yang jatuh sakit di Qulzum, kemudian menunjuk Muhammad ibn Abi Bakr untuk kedua kalinya dan mengembalikannya ke jabatan tersebut, sehingga Muawiyah ibn Hudayj membunuhnya dan membakarnya di dalam seekor keledai."
