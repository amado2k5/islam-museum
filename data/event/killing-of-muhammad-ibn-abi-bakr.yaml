label: { ar: "قتل محمد بن أبي بكر بمصر", en: "The Killing of Muhammad ibn Abi Bakr in Egypt" }
summary:
  ar: "عند البلاذري: لما قُتل عثمان وغلب محمد بن أبي حذيفة على مصر — وهو كان أنغلها على عثمان — ولّى عليٌّ قيس بن سعد بن عبادة الأنصاري مصر ثم عزله واستعمل عليها محمد بن أبي بكر الصديق ثم عزله وولّى مالكاً الأشتر فاعتلّ بالقلزم ثم ولّى محمد بن أبي بكر ثانية وردّه عليها فقتله معاوية بن حديج وأحرقه في جوف حمار."
  en: "In al-Baladhuri: when Uthman was killed and Muhammad ibn Abi Hudhayfa seized Egypt — he had made it hostile to Uthman — Ali gave Qays ibn Sa'd ibn Ubada al-Ansari Egypt, dismissed him, employed Muhammad ibn Abi Bakr al-Siddiq over it, dismissed him, gave it to Malik al-Ashtar who sickened at al-Qulzum, then gave Muhammad ibn Abi Bakr it a second time and sent him back to it — whereupon Mu'awiya ibn Khudayj killed him and burned him inside a donkey's belly."
