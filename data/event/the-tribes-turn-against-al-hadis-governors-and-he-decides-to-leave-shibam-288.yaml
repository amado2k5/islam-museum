id: event/the-tribes-turn-against-al-hadis-governors-and-he-decides-to-leave-shibam-288
class: event
kind: other
label:
  ar: "العشائر تخالف وتخرج عمال الهادي وهو يعزم على الخروج من شبام، جمادى الآخرة 288هـ"
  en: "The tribes turn against al-Hadi's governors and he decides to leave Shibam, Jumada II 288 AH"
  ur: "قبائل ہادی کے عاملوں کے خلاف اٹھتی ہیں اور وہ شبام سے نکلنے کا فیصلہ کرتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "لما علمت العشائر بإخراج علي بن سليمان خالفوا من كل المواضع وأخرجوا عمال الهادي وأخذوا ما معهم من دواب ومتاع، وكان مع الهادي بشبام كثير من النساء من آل النبي، فرأى بحسب الراوي ألا يخاطر بهن وخاف ألا يقيم معه عسكره، فعزم على الخروج وأمر يوم الجمعة بشد الإبل وحمل الأثاث والسلاح."
  en: "When the clans learned that Ali ibn Sulayman had been put out they turned in every district, expelled al-Hadi's governors and took their animals and goods; al-Hadi had many women of the Prophet's household with him at Shibam, and the narrator says he judged it unwise to risk them and feared his troops would not stay, so he resolved to leave and on the Friday ordered the camels loaded with his furniture and arms."
  ur: "جب قبائل کو علی بن سلیمان کے نکالے جانے کا علم ہوا تو ہر جگہ پھر گئیں، ہادی کے عاملوں کو نکال دیا اور ان کے جانور اور سامان لے لیا؛ ہادی کے ساتھ شبام میں آلِ نبی کی بہت سی خواتین تھیں، راوی کے بقول انہوں نے ان کو خطرے میں ڈالنا مناسب نہ سمجھا اور خوف کیا کہ لشکر ان کے ساتھ نہ ٹھہرے گا، سو نکلنے کا فیصلہ کیا اور جمعے کو اونٹ کسنے اور سامان و ہتھیار لادنے کا حکم دیا۔"
