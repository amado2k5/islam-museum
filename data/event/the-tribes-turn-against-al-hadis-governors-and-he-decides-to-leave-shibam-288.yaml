id: event/the-tribes-turn-against-al-hadis-governors-and-he-decides-to-leave-shibam-288
class: event
kind: other
label:
  ar: "العشائر تخالف وتخرج عمال الهادي وهو يعزم على الخروج من شبام، جمادى الآخرة 288هـ"
  en: "The tribes turn against al-Hadi's governors and he decides to leave Shibam, Jumada II 288 AH"
  ur: "قبائل ہادی کے عاملوں کے خلاف اٹھتی ہیں اور وہ شبام سے نکلنے کا فیصلہ کرتے ہیں، جمادی الآخرہ 288ھ"
  es: "Las tribus se rebelan contra los gobernadores de al-Hadi y este decide abandonar Shibam, Jumada II 288 AH."
  fr: "Les tribus se retournent contre les gouverneurs d'al-Hadi, qui décide de quitter Shibam (Jumada II 288 AH)."
  tr: "Kabileler isyan edip Hadi'nin işçilerini kovarlar ve Hadi de Şibam'dan ayrılmaya karar verir. (Hicri 288 Cemâde el-Ahire)"
  id: "Suku-suku memberontak dan mengusir para pekerja al-Hadi, dan dia bermaksud meninggalkan Shibam, Jumada al-Akhirah 288 H."
summary:
  ar: "لما علمت العشائر بإخراج علي بن سليمان خالفوا من كل المواضع وأخرجوا عمال الهادي وأخذوا ما معهم من دواب ومتاع، وكان مع الهادي بشبام كثير من النساء من آل النبي، فرأى بحسب الراوي ألا يخاطر بهن وخاف ألا يقيم معه عسكره، فعزم على الخروج وأمر يوم الجمعة بشد الإبل وحمل الأثاث والسلاح."
  en: "When the clans learned that Ali ibn Sulayman had been put out they turned in every district, expelled al-Hadi's governors and took their animals and goods; al-Hadi had many women of the Prophet's household with him at Shibam, and the narrator says he judged it unwise to risk them and feared his troops would not stay, so he resolved to leave and on the Friday ordered the camels loaded with his furniture and arms."
  ur: "جب قبائل کو علی بن سلیمان کے نکالے جانے کا علم ہوا تو ہر جگہ پھر گئیں، ہادی کے عاملوں کو نکال دیا اور ان کے جانور اور سامان لے لیا؛ ہادی کے ساتھ شبام میں آلِ نبی کی بہت سی خواتین تھیں، راوی کے بقول انہوں نے ان کو خطرے میں ڈالنا مناسب نہ سمجھا اور خوف کیا کہ لشکر ان کے ساتھ نہ ٹھہرے گا، سو نکلنے کا فیصلہ کیا اور جمعے کو اونٹ کسنے اور سامان و ہتھیار لادنے کا حکم دیا۔"
  es: "Cuando los clanes se enteraron de que Ali ibn Sulayman había sido expulsado, se volcaron en cada distrito, expulsaron a los gobernadores de al-Hadi y se apoderaron de sus animales y bienes. Al-Hadi tenía consigo en Shibam a muchas mujeres de la familia del Profeta, y el narrador dice que consideró imprudente arriesgarlas y temía que sus tropas no se quedaran, por lo que decidió marcharse y el viernes ordenó que cargaran los camellos con sus muebles y armas."
  fr: "Lorsque les clans apprirent qu'Ali ibn Sulayman avait été chassé, ils se retournèrent dans chaque district, expulsèrent les gouverneurs d'al-Hadi et prirent leurs animaux et leurs biens; al-Hadi avait avec lui à Shibam de nombreuses femmes de la famille du Prophète, et le narrateur dit qu'il jugea imprudent de les mettre en danger et craignit que ses troupes ne restent pas, il résolut donc de partir et, le vendredi, ordonna de charger les chameaux de ses meubles et de ses armes."
  tr: "Kabileler Ali bin Süleyman'ın sürgün edildiğini öğrenince her yerden isyan ettiler ve Hadi'nin işçilerini, hayvanlarını ve eşyalarını alarak kovdular. Hadi'nin Şibam'da Peygamber ailesinden birçok kadını vardı, bu yüzden rivayet edene göre onlarla ilgili bir risk görmedi ve ordusunun kendisiyle kalmayacağından korktuğu için ayrılmaya karar verdi ve Cuma günü develerin eyerlenmesini, mobilyaların ve silahların yüklenmesini emretti."
  id: "Ketika suku-suku mengetahui tentang pengusiran Ali bin Suleiman, mereka memberontak dari segala tempat dan mengusir para pekerja al-Hadi, membawa serta hewan dan barang-barang mereka. Al-Hadi memiliki banyak wanita dari keluarga Nabi bersamanya di Shibam, jadi, menurut perawi, dia tidak melihat risiko dengan mereka dan khawatir pasukannya tidak akan tetap bersamanya, sehingga dia memutuskan untuk pergi dan pada hari Jumat memerintahkan unta-unta untuk dipasangi pelana dan perabotan serta senjata untuk dimuat."
