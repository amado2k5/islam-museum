label:
  ar: "ابن تيمية في نصر شقحب، ٧٠٢هـ/١٣٠٣م"
  en: "Ibn Taymiyya at the victory of Shaqhab, 702/1303"
  ur: "ابن تیمیہ اور شقحب کی فتح، 702ھ/1303ء"
summary:
  ar: "في الغزو المغولي الجديد سنة ٧٠٢هـ/١٣٠٣م حضر ابن تيمية نصر شقحب يوم ٤ رمضان ٧٠٢هـ/٢٢ أبريل ١٣٠٣م على التتار، وقد كُلّف بإصدار فتوى بجواز الإفطار للمقاتلين. وقبلها في ٧٠٠هـ ساق في البريد إلى القاهرة في جمادى الأولى يحرض الناس على الجهاد ويطلب من السلطان الناصر محمد بن قلاوون التدخل في الشام {cite:encyclopaedia-of-islam-2 vol. 3 p. 983} {cite:shadharat-dhahab p. 429}."
  en: "During the new Mongol invasion of 702/1303 Ibn Taymiyya was present at the victory of Shaqhab on 4 Ramadan 702/22 April 1303, having been commissioned to issue a fatwa permitting the fighters to break the fast. Before that, in 700, he had ridden the barid post to Cairo in Jumada I, rousing the people to jihad and asking Sultan al-Nasir Muhammad ibn Qalawun to intervene in Syria {cite:encyclopaedia-of-islam-2 vol. 3 p. 983} {cite:shadharat-dhahab p. 429}."
  ur: "702ھ/1303ء کی نئی منگول یلغار کے موقع پر ابن تیمیہ 4 رمضان 702ھ/22 اپریل 1303ء کو شقحب کی فتح میں موجود تھے، جہاں انہیں لڑنے والوں کے لیے روزہ افطار کی اجازت کا فتوى دینے کا حکم ملا تھا۔ اس سے پہلے 700ھ میں وہ جمادی الاولیٰ میں برید سواری سے قاہرہ گئے، لوگوں کو جہاد پر ابھارتے اور سلطان الناصر محمد بن قلاوون سے شام میں مداخلت کی درخواست کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 983} {cite:shadharat-dhahab p. 429}۔"
