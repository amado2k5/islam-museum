class: event
kind: conquest
label: { ar: "فتح ميسان", en: "Conquest of Maysan", es: "Conquista de Maysan", fr: "Conquête de Maysan", ur: "میسان کی فتح" }
summary:
  ar: "غزا المغيرة بن شعبة ميسان ففتحها عنوة بعد قتال شديد وغلب على أرضها ثم إن أهل أبر قباذ غدروا ففتحها عنوة وكان المدائني يقول كان الناس يسمون ميسان ودستميسان والفرات وأبر قباذ ميسان وكان من سبي ميسان أبو الحسن البصري وأخوه سعيد بن يسار وكان اسم أبيهما قيروز فصارا لامرأة من الأنصار يقال لها الربيع بنت النضر عمة أنس بن مالك ويقال لامرأة من بني سلمة يقال لها جميلة امرأة أنس بن مالك وقال الحسن كان لي أبواي رجل من بني النجار تزوج امرأة من بني سلمة فساقهما إليها في صداقها فاعتقتهما فولاؤنا لها."
  en: "Al-Mughira ibn Shu'ba stormed Maysan after hard fighting and mastered its land; when Abar Qubadh's people broke faith he retook it by force — al-Mada'ini notes folk called Maysan, Dastumaysan, al-Furat and Abar Qubadh all 'Maysan'. Among Maysan's captives were Abu al-Hasan al-Basri and his brother Sa'id, sons of Yasar once named Qayruz; they fell to an Ansari woman — al-Rabi' bint al-Nadr, Anas's aunt, or Jamila of Salima, Anas's wife — who freed them, so 'our wala' is hers'."
  es: "Al-Mughira ibn Shu'ba asaltó Maysan tras duros combates y dominó su territorio; cuando el pueblo de Abar Qubadh rompió la lealtad, lo reconquistó por la fuerza. Al-Mada'ini señala que la gente llamaba a Maysan, Dastumaysan, al-Furat y Abar Qubadh todos \"Maysan\". Entre los cautivos de Maysan se encontraban Abu al-Hasan al-Basri y su hermano Sa'id, hijos de Yasar, otrora llamado Qayruz; cayeron en manos de una mujer ansar —al-Rabi' bint al-Nadr, tía de Anas, o Jamila de Salima, esposa de Anas— quien los liberó, por lo que \"nuestro wala\" es suyo."
  fr: "Après de rudes combats, Al-Mughira ibn Shu'ba prit d'assaut Maysan et s'empara de ses terres. Lorsque les hommes d'Abar Qubadh trahirent leur allégeance, il la reprit par la force. Al-Mada'ini note que les noms de Maysan, Dastumaysan, al-Furat et Abar Qubadh étaient tous désignés par le terme « Maysan ». Parmi les captifs de Maysan figuraient Abu al-Hasan al-Basri et son frère Sa'id, fils de Yasar, autrefois nommé Qayruz. Ils tombèrent aux mains d'une femme ansarienne – al-Rabi' bint al-Nadr, la tante d'Anas, ou Jamila de Salima, l'épouse d'Anas – qui les libéra. Ainsi, « notre wala » est la sienne."
  ur: "المغیرہ بن شعبہ نے سخت لڑائی کے بعد میسان پر حملہ کیا اور اس کی سرزمین پر قبضہ کر لیا۔ جب ابر قباد کے لوگوں نے عقیدہ توڑا تو اس نے اسے زبردستی واپس لے لیا - المدائنی نوٹ کرتا ہے کہ لوگ میسان، دستومیسن، الفرات اور ابر قباد سب کو 'میسان' کہتے ہیں۔ میسان کے قیدیوں میں ابو الحسن البصری اور اس کا بھائی سعید، یاسر کے بیٹے، جو کبھی قیروز کہلاتا تھا، شامل تھے۔ وہ ایک انصاری عورت کے پاس گرے - الربیع بنت الندر، انس کی خالہ، یا انس کی بیوی سلیمہ کی جمیلہ - جس نے انھیں آزاد کر دیا، اس لیے 'ہمارا والا' اس کا ہے۔"
