id: event/ahmad-ibn-abbad-al-akili-leaves-saada-and-writes-to-al-hadi-286
class: event
kind: other
label:
  ar: خروج أحمد بن عباد الأكيلي من صعدة وكتبه إلى الهادي ثم تحصنه فيها، 286هـ
  en: Ahmad ibn Abbad al-Akili leaves Sa'da, writes to al-Hadi and then fortifies himself there, 286 AH
  ur: احمد بن عباد اکیلی کا صعدہ سے نکلنا، ہادی کو خطوط لکھنا اور پھر وہاں مورچہ بند ہونا، 286ھ
summary:
  ar: يلقى محمد بن عبيد الله الهادي في صعدة مع بني سعد والربيعة والأكيليين إلا رئيسهم أحمد بن عباد الذي خرج وقت دخول الهادي، ويقول الراوي إنه كان قد تعاقد مع ابن حميد وابن بسطام وابن الضحاك على إثارة الفتنة، فكتب إلى الهادي يعتذر ويسأله إعفاءه من نجران لأن بني الحارث أخواله، ثم جمع أتباعه وتحصن في صعدة لما رأى عزم الهادي.
  en: Muhammad ibn Ubaydallah meets al-Hadi at Sa'da with Banu Sa'd, al-Rabi'a and the Akilis, all but their chief Ahmad ibn Abbad, who left as al-Hadi came in; the narrator says he had pledged with Ibn Humayd, Ibn Bustam and Ibn al-Dahhak to stir trouble, so he wrote excusing himself and asking to be spared the march to Najran as Banu al-Harith were his maternal uncles, then gathered his followers and fortified himself in the town when he saw al-Hadi's resolve.
  ur: محمد بن عبید اللہ صعدہ میں ہادی سے بنو سعد، ربیعہ اور اکیلیوں کے ساتھ ملتے ہیں سوائے ان کے سردار احمد بن عباد کے جو ہادی کے داخل ہوتے وقت نکل گیا؛ راوی کہتا ہے کہ اس نے ابن حمید، ابن بسطام اور ابن ضحاک سے فتنہ اٹھانے کا عہد کر رکھا تھا، اس نے معذرت لکھی اور نجران جانے سے رعایت مانگی کہ بنو حارث اس کے ننھیال ہیں، پھر ہادی کا عزم دیکھ کر اپنے لوگوں کو جمع کیا اور صعدہ میں مورچہ بند ہو گیا۔
