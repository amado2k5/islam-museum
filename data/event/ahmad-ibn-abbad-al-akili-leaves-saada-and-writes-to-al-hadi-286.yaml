id: event/ahmad-ibn-abbad-al-akili-leaves-saada-and-writes-to-al-hadi-286
class: event
kind: other
label:
  ar: خروج أحمد بن عباد الأكيلي من صعدة وكتبه إلى الهادي ثم تحصنه فيها، 286هـ
  en: Ahmad ibn Abbad al-Akili leaves Sa'da, writes to al-Hadi and then fortifies himself there, 286 AH
  fr: "Ahmad ibn Abbad al-Akili quitte Sa'da, écrit à al-Hadi puis s’y fortifie, 286 de l’hégire"
  ur: احمد بن عباد اکیلی کا صعدہ سے نکلنا، ہادی کو خطوط لکھنا اور پھر وہاں مورچہ بند ہونا، 286ھ
  es: "Ahmad ibn Abbad al-Akili abandona Sa'da, escribe a al-Hadi y luego se refuerza allí, 286 AH."
  tr: "Ahmed ibn Abbad el-Akili, Sa'de'den ayrılıp el-Hadi'ye mektup yazdıktan sonra orada kale kurdu, Hicri 286."
  id: "Ahmad ibn Abbad al-Akili meninggalkan Sa'dah dan menulis surat kepada al-Hadi, kemudian membentengi dirinya di sana, 286 H."
summary:
  ar: يلقى محمد بن عبيد الله الهادي في صعدة مع بني سعد والربيعة والأكيليين إلا رئيسهم أحمد بن عباد الذي خرج وقت دخول الهادي، ويقول الراوي إنه كان قد تعاقد مع ابن حميد وابن بسطام وابن الضحاك على إثارة الفتنة، فكتب إلى الهادي يعتذر ويسأله إعفاءه من نجران لأن بني الحارث أخواله، ثم جمع أتباعه وتحصن في صعدة لما رأى عزم الهادي.
  en: Muhammad ibn Ubaydallah meets al-Hadi at Sa'da with Banu Sa'd, al-Rabi'a and the Akilis, all but their chief Ahmad ibn Abbad, who left as al-Hadi came in; the narrator says he had pledged with Ibn Humayd, Ibn Bustam and Ibn al-Dahhak to stir trouble, so he wrote excusing himself and asking to be spared the march to Najran as Banu al-Harith were his maternal uncles, then gathered his followers and fortified himself in the town when he saw al-Hadi's resolve.
  fr: "Muhammad ibn Ubaydallah rencontre al-Hadi à Sa'da avec les Banu Sa'd, al-Rabi'a et les Akilis, sauf leur chef Ahmad ibn Abbad, parti à l’arrivée d’al-Hadi. Selon le narrateur, il s’était engagé avec Ibn Humayd, Ibn Bustam et Ibn al-Dahhak à susciter des troubles ; il écrivit donc pour s’excuser et demander à être dispensé de la marche sur Najran, les Banu al-Harith étant ses oncles maternels, puis rassembla ses partisans et se fortifia dans la ville en voyant la résolution d’al-Hadi."
  ur: محمد بن عبید اللہ صعدہ میں ہادی سے بنو سعد، ربیعہ اور اکیلیوں کے ساتھ ملتے ہیں سوائے ان کے سردار احمد بن عباد کے جو ہادی کے داخل ہوتے وقت نکل گیا؛ راوی کہتا ہے کہ اس نے ابن حمید، ابن بسطام اور ابن ضحاک سے فتنہ اٹھانے کا عہد کر رکھا تھا، اس نے معذرت لکھی اور نجران جانے سے رعایت مانگی کہ بنو حارث اس کے ننھیال ہیں، پھر ہادی کا عزم دیکھ کر اپنے لوگوں کو جمع کیا اور صعدہ میں مورچہ بند ہو گیا۔
  es: "Muhammad ibn Ubaydallah se encuentra con al-Hadi en Sa'da junto con Banu Sa'd, al-Rabi'a y los Akilis, todos excepto su jefe Ahmad ibn Abbad, quien se marchó cuando llegó al-Hadi; el narrador dice que se había comprometido con Ibn Humayd, Ibn Bustam e Ibn al-Dahhak a provocar disturbios, por lo que escribió excusándose y pidiendo que se le perdonara la marcha a Najran ya que Banu al-Harith eran sus tíos maternos, luego reunió a sus seguidores y se fortificó en la ciudad cuando vio la determinación de al-Hadi."
  tr: "Muhammed bin Ubeyd Allah el-Hadi, Saada'da Beni Saad, el-Rabiya ve el-Akili kabileleriyle bir araya geldi; ancak liderleri Ahmed bin Abbad, el-Hadi içeri girince ayrıldı. Rivayet eden kişi, İbn Hamid, İbn Bastam ve İbn el-Dahhak ile fitne çıkarmak için anlaşma yaptığını, bu yüzden el-Hadi'ye özür dileyen ve Beni el-Harith kabilesinin dayıları olduğu için kendisini Necran'dan kurtarmasını isteyen bir mektup yazdığını söylüyor. Daha sonra, el-Hadi'nin kararlılığını görünce, takipçilerini toplayıp Saada'da kendini tahkim etti."
  id: "Muhammad bin Ubaid Allah al-Hadi bertemu di Saada dengan Bani Saad, al-Rabia, dan al-Akili, kecuali pemimpin mereka Ahmad bin Abbad, yang pergi ketika al-Hadi masuk. Perawi mengatakan bahwa ia telah bersekutu dengan Ibn Hamid, Ibn Bastam, dan Ibn al-Dahhak untuk menghasut pemberontakan, sehingga ia menulis surat kepada al-Hadi untuk meminta maaf dan memohon agar ia dibebaskan dari Najran karena Bani al-Harith adalah paman dari pihak ibunya. Kemudian ia mengumpulkan para pengikutnya dan membentengi dirinya di Saada ketika ia melihat tekad al-Hadi."
