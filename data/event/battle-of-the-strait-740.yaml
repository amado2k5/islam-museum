label: { ar: "واقعة الزقاق البحرية وملك أسطول المسلمين", en: "Naval battle of the Strait and the taking of the Muslim fleet", fr: "La bataille navale du Détroit et la prise de la flotte musulmane", es: "Batalla naval del estrecho y captura de la flota musulmana.", ur: "آبنائے کی بحری جنگ اور مسلم بحری بیڑے کو لے جانا", tr: "Sokak Muharebesi ve Müslüman Filosu Kralı", id: "Pertempuran di Gang dan Raja Armada Muslim" }
summary:
  ar: "استعد السلطان أبو الحسن المريني للجهاد فأخرج وزراءه إلى السواحل لتجهيز الأساطيل واستنفر أهل المغرب وارتحل إلى سبتة، فأخرج الطاغية أسطوله إلى الزقاق ليمنعه من الإجازة؛ وعقد الموحدون أسطولهم لزيد بن فرحون قائد أسطول بجاية فأوفى سبتة في ستة عشر مركباً من طرابلس وقابس وجربة وتونس وبونة وبجاية، وتوافت أساطيل المغربين بمرسى سبتة تناهز المائة فعقد عليها لمحمد بن علي العزفي صاحب سبتة يوم فتحها، وأمره بمناجزة أسطول النصارى، فقربوا الأساطيل بعضها إلى بعض وقرنوها للمصاع فهبت ريح النصر وأظفر الله المسلمين بعدوهم فاستلحموهم قهراً بالسيوف وطعناً بالرماح وألقوا أشلاءهم في اليم وقتلوا قائدهم الملند واستاقوا أساطيلهم مجنوبة إلى مرسى سبتة، وعظم الفتح وجلس السلطان للتهنئة {cite:tarikh-ibn-khaldun-ibar p. 1964-1965}."
  en: "Sultan Abu al-Hasan al-Marini prepared for jihad, sent his viziers to the coasts to fit out the fleets, summoned the Maghreb and marched to Ceuta; the Taghiya sent his fleet into the Strait to bar the crossing. The Almohads (Ifriqiya's heirs) contracted their fleet to Zayd ibn Farhun, who brought sixteen ships from Tripoli, Gabes, Djerba, Tunis, Bona and Bijaya, and the two-Maghreb fleets at Ceuta's anchorage neared a hundred sail under Muhammad ibn Ali al-Azafi — the fleets closed, grappled for boarding, the wind of victory rose, the Muslims cut them down, killed their admiral 'al-Maland' and towed the prizes into Ceuta, where the sultan sat for congratulations {cite:tarikh-ibn-khaldun-ibar p. 1964-1965}."
  fr: "Le sultan Abu al-Hasan al-Marini se prépara au jihad, envoya ses vizirs sur les côtes pour équiper les flottes, convoqua le Maghreb et marcha sur Ceuta ; le Taghiya envoya sa flotte dans le Détroit pour barrer la traversée. Les Almohades (héritiers de l'Ifriqiya) confièrent leur flotte à Zayd ibn Farhun, qui amena seize navires de Tripoli, Gabès, Djerba, Tunis, Bône et Bijaya, et les flottes des deux Maghreb au mouillage de Ceuta approchèrent la centaine de voiles sous Muhammad ibn Ali al-Azafi ; les flottes se rapprochèrent, s'agrippèrent pour l'abordage, le vent de la victoire se leva, les musulmans les taillèrent en pièces, tuèrent leur amiral « al-Maland » et remorquèrent les prises jusqu'à Ceuta, où le sultan reçut les félicitations {cite:tarikh-ibn-khaldun-ibar p. 1964-1965}."
  es: "El sultán Abu al-Hasan al-Marini se preparó para la yihad, envió a sus visires a las costas para equipar las flotas, convocó al Magreb y marchó hacia Ceuta; Taghiya envió su flota al estrecho para impedir el paso. Los almohades (herederos de Ifriqiya) contrataron su flota con Zayd ibn Farhun, quien trajo dieciséis barcos de Trípoli, Gabes, Djerba, Túnez, Bona y Bijaya, y las dos flotas del Magreb ancladas en Ceuta alcanzaron casi un centenar de velas bajo el mando de Muhammad ibn Ali al-Azafi. Las flotas se acercaron, lucharon por el abordaje, el viento de la victoria se alzó, los musulmanes las aniquilaron, mataron a su almirante 'al-Maland' y remolcaron las presas hasta Ceuta, donde el sultán se sentó para recibir las felicitaciones {cite:tarikh-ibn-khaldun-ibar p. 1964-1965}."
  ur: "سلطان ابو الحسن المرینی نے جہاد کے لیے تیاری کی، اپنے وزیروں کو ساحلوں پر بھیج کر بیڑے کو فٹ کیا، مغرب کو بلایا اور سیوٹا کی طرف کوچ کیا۔ طغیہ نے اپنا بحری بیڑا آبنائے میں بھیجا تاکہ کراسنگ کو روکا جا سکے۔ المحدث ⁦(افریقیہ کے وارثوں)⁩ نے اپنا بیڑہ زید بن فرحون کو دیا، جو طرابلس، گیبس، جربا، تیونس، بونا اور بیجیا سے سولہ بحری جہاز لائے اور سیوٹا کے لنگر خانے میں دو مغرب والے بحری بیڑے ایک سو بحری جہاز کے قریب پہنچ گئے۔ فتح کی ہوا چل پڑی، مسلمانوں نے انہیں کاٹ ڈالا، ان کے ایڈمرل 'الملند' کو قتل کر دیا اور انعامات سیوٹا لے گئے، جہاں سلطان مبارکباد دینے کے لیے بیٹھا تھا۔ 1964-1965}۔"
  tr: "Sultan Ebu el-Hasan el-Marini cihat için hazırlık yaptı ve bakanlarını filoları donatmak üzere kıyılara gönderdi. Fas halkını seferber etti ve Ceuta'ya doğru yola çıktı. Zalim hükümdar, onun ayrılmasını engellemek için filosunu boğazlara gönderdi. El-Muhadlar, filolarını Bejaia filosunun komutanı Zeyd ibn Farhun'a emanet ettiler; Zeyd ibn Farhun, Trablus, Gabes, Cerba, Tunus, Bon ve Bejaia'dan on altı gemiyle Ceuta'ya geldi. Yaklaşık yüz gemiden oluşan iki Mağrip filosu Ceuta limanında bir araya geldi. Fetih gününde Ceuta'nın yöneticisi olan Muhammed ibn Ali el-Azfi'ye bu filolar emanet edildi ve Hristiyan filosuyla savaşması emredildi. Filoları birbirine yaklaştırdılar ve savaş için birleştirdiler. Zafer rüzgarları esti ve Allah Müslümanlara düşmanları üzerinde zafer bahşetti. Kılıç ve mızraklarla şiddetli bir şekilde savaştılar ve kalıntılarını denize attılar. Komutanları el-Muland'ı öldürdüler ve filolarını Ceuta limanına sürdüler. Zafer büyüktü ve Sultan tebrikleri kabul etmek için oturdu. (1964-1965)"
  id: "Sultan Abu al-Hasan al-Marini bersiap untuk jihad, mengirim para menterinya ke pesisir untuk mempersenjatai armada. Ia memobilisasi rakyat Maroko dan berangkat menuju Ceuta. Sang tiran mengirim armadanya ke selat untuk mencegahnya pergi. Kaum Almohad mempercayakan armada mereka kepada Zayd ibn Farhun, komandan armada Bejaia, yang tiba di Ceuta dengan enam belas kapal dari Tripoli, Gabes, Djerba, Tunis, Bône, dan Bejaia. Armada kedua Maghreb, yang berjumlah hampir seratus, berkumpul di pelabuhan Ceuta. Muhammad ibn Ali al-Azfi, penguasa Ceuta pada hari penaklukannya, dipercayakan untuk memimpin armada tersebut dan diperintahkan untuk menyerang armada Kristen. Mereka mendekatkan armada dan bergabung untuk berperang. Angin kemenangan berhembus, dan Allah menganugerahkan kemenangan kepada kaum Muslim atas musuh mereka. Mereka bertempur dengan sengit menggunakan pedang dan tombak, melemparkan sisa-sisa tubuh musuh ke laut. Mereka membunuh komandan mereka, al-Muland, dan mengusir armada mereka ke pelabuhan Ceuta. Kemenangan itu besar, dan Sultan duduk untuk menerima ucapan selamat. (1964-1965)."
