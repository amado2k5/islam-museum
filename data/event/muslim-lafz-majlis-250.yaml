id: event/muslim-lafz-majlis-250
class: event
kind: other
label:
  ar: "مسلم بن الحجاج يقوم من مجلس الذهلي في مسألة اللفظ، نحو ٢٥٠هـ"
  en: "Muslim ibn al-Hajjaj walks out of al-Dhuhli's circle over the lafz question, c. 250/864"
  ur: "مسلم بن حجاج کا مسئلۂ لفظ پر ذہلی کی مجلس سے اٹھنا، تقریباً 250ھ/864ء"
summary:
  ar: "وقع بين محمد بن يحيى الذهلي والبخاري ما وقع في مسألة اللفظ، فنادى الذهلي في مجلسه ومنع الناس من الأخذ عنه حتى هجر البخاري نيسابور، وكان الناس يتقاطعون عن مسلم فلم يتغيّر عن مذهبه {cite:wafayat-ayan v p. 195}؛ وحضر مسلم مجلس الذهلي فقال: من قال لفظي بالقرآن مخلوق فلا يحضر مجلسنا، فأخذ مسلم الرداء والعمامة وقام على رؤوس الناس وخرج من مجلسه، فتولدت من ذلك الوحشة بينهما {cite:tazkirat-al-huffaz j.2 p. 527-528} {cite:wafayat-ayan v p. 195}."
  en: "When the breach over the lafz question opened between Muhammad ibn Yahya al-Dhuhli and al-Bukhari, al-Dhuhli announced it in his circle and barred people from taking from al-Bukhari until he left Nishapur; the people shunned Muslim for not changing his position {cite:wafayat-ayan v p. 195}. Muslim attended al-Dhuhli's assembly where he declared that whoever said 'my utterance of the Qur'an is created' should not attend — so Muslim took up his cloak and turban, rose over the heads of the people and left, and from that the estrangement between them grew {cite:tazkirat-al-huffaz j.2 p. 527-528} {cite:wafayat-ayan v p. 195}."
  ur: "جب محمد بن یحییٰ ذہلی اور بخاری کے درمیان مسئلۂ لفظ پر تنازع کھلا تو ذہلی نے اپنی مجلس میں اعلان کیا اور لوگوں کو بخاری سے اخذ کرنے سے روکا یہاں تک کہ بخاری نے نیشاپور چھوڑ دیا؛ لوگ مسلم سے بھی روگردانی کرتے رہے کیونکہ وہ اپنے مسلک سے نہ بدلا {cite:wafayat-ayan v p. 195}۔ مسلم ذہلی کی مجلس میں حاضر ہوا تو اس نے کہا: جو کہے کہ میرا قرآن پڑھنا مخلوق ہے وہ ہماری مجلس میں نہ آئے — چنانچہ مسلم نے چادر اور عمامہ اٹھایا، لوگوں کے سروں کے اوپر سے اٹھا اور مجلس چھوڑ دی، اور اسی سے ان کے درمیان بے تکلفی جنم لے گئی {cite:tazkirat-al-huffaz j.2 p. 527-528} {cite:wafayat-ayan v p. 195}۔"
