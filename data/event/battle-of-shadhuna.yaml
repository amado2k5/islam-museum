id: event/battle-of-shadhuna
class: event
kind: battle
label: { ar: "معركة شذونة", en: "Battle of Shadhuna", fr: "La bataille de Shadhuna", es: "Batalla de Shadhuna" }
summary:
  ar: "في أواخر رمضان سنة 92هـ التقى طارق بن زياد بجيش الملك روذريق قرب شذونة، وحقق المسلمون نصراً حاسماً؛ ويرى المؤرخون أن هذه المعركة قررت مصير الأندلس لصالح المسلمين، إذ دُحر الجيش القوطي وانفتح الطريق أمام الفتح {cite:umayyad-birth-to-fall-2006 p. 45}."
  en: "In late Ramadan 92 AH Tariq ibn Ziyad met the army of King Roderic near Shadhuna, and the Muslims won a decisive victory. Historians consider that this battle decided the fate of al-Andalus in favour of the Muslims, since the Gothic army was routed and the way to the conquest was opened {cite:umayyad-birth-to-fall-2006 p. 45}."
  fr: "À la fin de Ramadan 92 H, Tariq ibn Ziyad rencontra l'armée du roi Rodéric près de Shadhuna, et les musulmans remportèrent une victoire décisive. Les historiens estiment que cette bataille décida du sort d'al-Andalus en faveur des musulmans, puisque l'armée gothique fut mise en déroute et la voie de la conquête ouverte {cite:umayyad-birth-to-fall-2006 p. 45}."
  es: "A finales del Ramadán del año 92 de la Hégira, Tariq ibn Ziyad se enfrentó al ejército del rey Rodrigo cerca de Shadhuna, y los musulmanes obtuvieron una victoria decisiva. Los historiadores consideran que esta batalla decidió el destino de al-Ándalus a favor de los musulmanes, ya que el ejército godo fue derrotado y se abrió el camino a la conquista {cite:umayyad-birth-to-fall-2006 p. 45}."
