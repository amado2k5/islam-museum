id: event/bayakbak-murder-256
class: event
kind: death
label:
  ar: "قتل باكبك وإقطاع مصر ليرجوخ، ٢٥٦هـ/٨٧٠م"
  en: "Bayakbak's murder; Egypt's apanage passes to Yarjukh, 256/870"
  ur: "بائکبک کا قتل اور مصر کا اقطاع یرجوخ کو ملنا، 256ھ/870ء"
summary:
  ar: "في سنة ست وخمسين ومائتين قُتل باكبك صاحب إقطاع مصر {cite:encyclopaedia-of-islam-2 vol. 10 p. 666} — عند المسعودي وقع بيد المهتدي فضرب عنقه، وقيل قُتل في حرب جسر سامراء {cite:muruj-al-dhahab p. 559-560}. فأُعطيت مصر إقطاعاً ليرجوخ الذي زوّج إحدى بناته من ابن طولون، فأقرّ أحمد في نيابته وضمّ إليه الإسكندرية وبرقة ونواحي الثغور التي لم تكن داخلة في ولايته، بعد أربع سنين من الصراع مع ابن المدبّر صاحب الخراج انتهت بإزاحته {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  en: "In 256/870 Bayakbak, holder of Egypt's apanage, was killed {cite:encyclopaedia-of-islam-2 vol. 10 p. 666} — al-Mas'udi says he fell into al-Muhtadi's hands and was beheaded, or was killed in the battle of the Samarra bridge {cite:muruj-al-dhahab p. 559-560}. Egypt was then granted as an apanage to Yarjukh, who had married one of his daughters to Ibn Tulun; he confirmed Ahmad as vice-governor and added Alexandria, Barqa and the frontier districts, hitherto outside his government — after a four-year struggle with the intendant of finance Ibn al-Mudabbir that ended in the latter's removal {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  ur: "256ھ/870ء میں مصر کے اقطاع دار بائکبک قتل ہوا {cite:encyclopaedia-of-islam-2 vol. 10 p. 666} — مسعودی کے مطابق وہ مہتدی کے ہاتھ لگا اور سر کاٹا گیا، یا سامرا کے پل کی لڑائی میں مارا گیا {cite:muruj-al-dhahab p. 559-560}۔ پھر مصر یرجوخ کو اقطاع میں ملا، جس نے اپنی ایک بیٹی ابن طولون سے بیاہی تھی؛ اس نے احمد کو نائب بقرر رکھا اور اس کے حکومت میں اسکندریہ، برقہ اور سرحدی اضلاع بھی شامل کیں — چار برس کی جدوجہد کے بعد جس میں مالیات کے سربراہ ابن مدبّر کی برطرفی ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}۔"
