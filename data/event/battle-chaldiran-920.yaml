label: { ar: "موقعة جالديران ودخول تبريز", en: "The battle of Chaldiran and the entry into Tabriz", fr: "La bataille de Tchaldiran et l'entrée à Tabriz", es: "La batalla de Chaldiran y la entrada en Tabriz", ur: "چلدیران کی جنگ اور تبریز میں داخلہ", tr: "Çaldıran Muharebesi ve Tebriz'e Giriş", id: "Pertempuran Chaldiran dan Masuknya ke Tabriz" }
summary:
  ar: "أدرك السلطان سليم الأول أن خطة الشاه إسماعيل الصفوي تتلخص في المهادنة والتباطؤ لتأجيل اللقاء حتى يحين فصل الشتاء فيهلك العثمانيون برداً وجوعاً، فأسرع في تحريك الصراع وأرسل إليه خرقة ومسبحة وكشكولاً وعصاً مرمزة فوق الدراويش يذكره بأصله وبأهل الأسرة الصفوية، وردّ الشاه بطلب المهادنة فلم يقبل سليم وأهان رسوله وأمر بقتله. وسار سليم نحو صحراء جالديران فوصلها في أغسطس سنة ١٥١٤م واحتل المواقع الهامة واعتلى الأماكن الهضبية مما مكنه من إيقاع هزيمة ساحقة بالجيش الصفوي على أرضه، واضطر إسماعيل إلى الفرار في الوقت الذي كان سليم يستعد فيه للدخول إلى تبريز عاصمة الصفويين، فدخلها وحصر أموال الشاه ورجال القزلباش واتخذها مركزاً لعملياته الحربية، وعاد بعد أن استولى على كردستان وديار بكر ومرعش وإيلبسن، فصارت الأناضول مأمونة من الاعتداء من الشرق وصارت الطرق إلى أذربيجان والقوقاز مفتوحة للعثمانيين {cite:dawlat-uthmaniyya-salabi p. 181}."
  en: "Chaldiran, August 1514 — Selim forced the issue before winter, sent the shah a dervish's cloak, beads, bowl and staff to mock his Sufi lineage, killed his envoy, then crushed the Safavid army and entered Tabriz; Kurdistan and Diyarbakir became Ottoman {cite:dawlat-uthmaniyya-salabi p. 181}."
  fr: "Tchaldiran, août 1514 : Selim força l'engagement avant l'hiver, envoya au shah un manteau de derviche, un chapelet, un bol et un bâton pour railler sa lignée soufie, tua son envoyé, puis écrasa l'armée safavide et entra à Tabriz ; le Kurdistan et le Diyarbakir devinrent ottomans {cite:dawlat-uthmaniyya-salabi p. 181}."
  es: "Chaldiran, agosto de 1514 — Selim forzó la situación antes del invierno, envió al shah una capa de derviche, cuentas, cuenco y bastón para burlarse de su linaje sufí, mató a su enviado, luego aplastó al ejército safávida y entró en Tabriz; Kurdistán y Diyarbakir pasaron a ser otomanos {cite:dawlat-uthmaniyya-salabi p. 181}."
  ur: "چلدیران، اگست 1514 - سیلم نے سردیوں سے پہلے اس مسئلے کو مجبور کیا، شاہ کو ایک درویش کی چادر، مالا، پیالہ اور عملہ بھیج کر اس کے صوفی نسب کا مذاق اڑایا، اس کے ایلچی کو قتل کر دیا، پھر صفوی فوج کو کچل کر تبریز میں داخل ہوا۔ کردستان اور دیار باقر عثمانی بن گئے۔ 181}۔"
  tr: "Sultan Selim I, Şah İsmail Safavi'nin planının, Osmanlıların soğuk ve açlıktan ölmesi için kış gelene kadar toplantıyı ertelemek ve yatıştırmak olduğunu anladı. Bu yüzden çatışmayı körüklemek için acele etti ve ona kökenini ve Safavi ailesini hatırlatmak için dervişlerin üzerine bir bez, bir tesbih, bir defter ve sembolik bir asa gönderdi. Şah ateşkes istedi, ancak Selim bunu kabul etmedi, elçisine hakaret etti ve öldürülmesini emretti. Selim, Çaldıran çölüne doğru ilerledi ve Ağustos 1514'te oraya ulaştı. Önemli yerleri işgal etti ve tepelik bölgelere çıktı; bu da ona topraklarında Safavi ordusuna ezici bir yenilgi yaşatmasını sağladı. İsmail, Selim Safavilerin başkenti Tebriz'e girmeye hazırlanırken kaçmak zorunda kaldı. Şehre girdi, Şah'ın parasını ve Kızılbaş adamlarını ele geçirdi ve burayı askeri operasyonlarının merkezi haline getirdi. Kürdistan, Diyarbakır, Maraş ve Elbesin'i ele geçirdikten sonra geri döndü. Böylece Anadolu doğudan gelebilecek saldırılardan korunmuş oldu ve Azerbaycan ile Kafkasya'ya giden yollar Osmanlılar için açıldı. {cite:dawlat-uthmaniyya-salabi s. 181}"
  id: "Sultan Selim I menyadari bahwa rencana Shah Ismail Safavi adalah untuk menenangkan dan menunda pertemuan hingga musim dingin tiba dan pasukan Ottoman akan binasa karena kedinginan dan kelaparan, sehingga ia bergegas untuk memicu konflik dan mengirimkan kain lusuh, tasbih, buku catatan, dan tongkat simbolis di atas para darwis untuk mengingatkannya akan asal-usulnya dan keluarga Safawi. Shah menanggapi dengan meminta gencatan senjata, tetapi Selim tidak menerimanya dan menghina utusannya serta memerintahkan agar ia dibunuh. Selim bergerak menuju gurun Chaldira dan tiba di sana pada Agustus 1514 M. Ia menduduki situs-situs penting dan mendaki daerah-daerah perbukitan, yang memungkinkannya untuk memberikan kekalahan telak kepada pasukan Safawi di tanahnya. Ismail terpaksa melarikan diri pada saat yang sama ketika Selim bersiap memasuki Tabriz, ibu kota Safawi. Ia memasuki kota itu, merebut uang Shah dan pasukan Qizilbash, dan menjadikannya pusat operasi militernya. Ia kembali setelah menguasai Kurdistan, Diyarbakir, Marash, dan Elbesin. Dengan demikian, Anatolia menjadi aman dari serangan dari timur, dan jalan menuju Azerbaijan dan Kaukasus terbuka bagi Ottoman. {cite:dawlat-uthmaniyya-salabi p. 181}."
