label: { ar: "نكث شروط غرناطة وثورة البشرات", en: "The breach of the Granada terms and the revolt of the Alpujarras", es: "El incumplimiento de los términos de Granada y la revuelta de las Alpujarras", fr: "La violation des conditions de Grenade et la révolte des Alpujarras", ur: "غرناطہ کی شرائط کی خلاف ورزی اور الپوجراس کی بغاوت", tr: "Granada Anlaşması'nın şartlarının ihlali ve Alpujarras İsyanı", id: "Pelanggaran terhadap ketentuan Perjanjian Granada dan Pemberontakan Alpujarras" }
summary:
  ar: "نكث النصارى العهد الذي أُخذت به غرناطة ونقضوا الشروط عروة عروة إلى أن آل الحال لحملهم المسلمين على التنصر سنة أربع وتسعمائة، بعد أمور أعظمها وأقواها عليهم أن القسيسين كتبوا على جميع من كان أسلم من النصارى أن يرجعوا قهراً للكفر ففعلوا، ثم تعدوا إلى أمر آخر وهو أن يقولوا للرجل المسلم إن جدك كان نصرانياً فأسلم فترجع نصرانياً، ولما فحش هذا الأمر قام أهل البيازين على الحكام وقتلوهم فكان ذلك سبب التنصر لأن الحكم خرج من السلطان أن من قام على الحاكم فليس إلا الموت إلا أن يتنصر فينجو، وبالجملة تنصروا عن آخرهم بادية وحاضرة وامتنع قوم فاعتزلوا الناس فلم ينفعهم، وامتنعت قرى وأماكن منها بلفيق وأندرش فجمع لهم العدو الجموع واستأصلهم قتلاً وسبياً إلا ما كان من جبل بلفقة فإن الله أعانهم على عدوهم وقتلوا منهم مقتلة عظيمة مات فيها صاحب قرطبة وأُخرجوا على الأمان إلى فاس بعيالهم وما خف من مالهم، ثم كان من أظهر التنصر يعبد الله في خفية ويصلي فشدد عليهم النصارى في البحث حتى أحرقوا منهم كثيراً بسبب ذلك ومنعوهم من حمل السكين الصغيرة فضلاً عن غيرها من الحديد {cite:nafh-tib-maqqari p. 527-528}."
  en: "The treaty of Granada broken clause by clause: in 904 the Muslims were forced to convert — first those once Christian were ordered back 'to unbelief by compulsion', then any Muslim was told his grandfather had been Christian; the Albaicin rose and killed the governors, making death-or-conversion the decree. Whole villages refused — Balfig, Andarax and the mountain of Ballanca whose men killed 'the lord of Cordoba' and were let out on aman to Fez — while the outwardly converted prayed in secret and were burned for it {cite:nafh-tib-maqqari p. 527-528}."
  es: "El tratado de Granada se violó cláusula por cláusula: en 904, los musulmanes fueron obligados a convertirse; primero, a los que habían sido cristianos se les ordenó volver a la incredulidad por la fuerza; luego, a cualquier musulmán se le dijo que su abuelo había sido cristiano. El Albaicín se sublevó y mató a los gobernadores, imponiendo como decreto la pena de muerte o la conversión. Pueblos enteros se negaron: Balfig, Andarax y la montaña de Ballanca, cuyos hombres mataron al \"señor de Córdoba\" y fueron liberados en libertad a Fez; mientras que los que se habían convertido públicamente rezaban en secreto y eran quemados por ello {cite:nafh-tib-maqqari p. 527-528}."
  fr: "Le traité de Grenade fut violé article par article: en 904, les musulmans furent contraints à la conversion. D’abord, ceux qui avaient été chrétiens furent forcés de retourner à l’incroyance, puis on affirma à tout musulman que son grand-père avait été chrétien. Les Albaicin se soulevèrent et tuèrent les gouverneurs, instaurant la conversion ou la mort comme seul mode de scrutin. Des villages entiers refusèrent – Balfig, Andarax et la montagne de Ballanca, dont les hommes tuèrent le seigneur de Cordoue et furent relâchés sous caution pour Fès – tandis que ceux qui s’étaient convertis en apparence priaient en secret et étaient brûlés vifs pour cela (voir: Nafh-Tib-Maqqari, p. 527-528)."
  ur: "گریناڈا کا معاہدہ شق کے لحاظ سے ٹوٹا: 904 میں مسلمانوں کو مذہب تبدیل کرنے پر مجبور کیا گیا - پہلے ان لوگوں کو 'مجبوری سے کفر' کرنے کا حکم دیا گیا، پھر کسی مسلمان کو بتایا گیا کہ اس کے دادا عیسائی تھے؛ البیسن نے اٹھ کر گورنروں کو مار ڈالا، موت یا تبدیلی کو حکم نامہ بنایا۔ تمام دیہاتوں نے انکار کر دیا — بالفگ، اندراکس اور بالانکا کا پہاڑ جن کے آدمیوں نے 'قرطبہ کے مالک' کو قتل کر دیا تھا اور انہیں امن پر فز کے لیے چھوڑ دیا گیا تھا — جب کہ ظاہری طور پر تبدیل ہونے والوں نے پوشیدہ طور پر دعا کی تھی اور اس کے لیے جلا دیا گیا تھا۔ 527-528}۔"
  tr: "Hristiyanlar, Granada'nın ele geçirilmesini sağlayan antlaşmayı bozdular ve 904 Hicri (1504 Miladi) yılında Müslümanları Hristiyanlığa zorlayana kadar antlaşmanın şartlarını birer birer ihlal ettiler. Bu durum, çeşitli faktörlerden kaynaklanıyordu; bunların en önemlisi ve güçlüsü, din adamlarının İslam'a geçen tüm Hristiyanların zorla tekrar inkâra dönmeleri gerektiğine dair bir kararname çıkarmalarıydı ve onlar da öyle yaptılar. Daha sonra, Müslüman erkeklere dedelerinin Hristiyan olduğunu ve İslam'a geçtiklerini söyleyerek onları tekrar Hristiyanlığa dönmeye zorladılar. Bu durum yaygınlaştığında, Albaicín halkı yöneticilere karşı ayaklandı ve onları öldürdü. Bu da din değiştirmelere yol açtı, çünkü sultan, yöneticiye isyan eden herkesin, Hristiyanlığa geçmedikleri takdirde ölümle karşı karşıya kalacağına dair bir kararname çıkardı. Kısacası, hem çölde hem de şehirde tüm Hristiyanlar din değiştirdi. Bazıları reddetti ve toplumdan çekildi, ancak bu etkisiz kaldı. Balfiq ve Andarsh dahil olmak üzere köyler ve bölgeler de direndi. Düşman onlara karşı güç topladı ve Balfıka Dağları'ndakiler hariç, onları öldürerek ve köleleştirerek yok etti; Balfıka Dağları'ndakiler ise düşmanlarına karşı Tanrı'nın yardımıyla hayatta kaldılar. Büyük bir katliama uğradılar ve Kurtuba hükümdarı öldürüldü. Hayatta kalanlar daha sonra aileleri ve taşıyabildikleri her şeyle birlikte güvenlik garantisi altında Fez'e götürüldüler. Paraları da yanlarına alındı; daha sonra Hristiyanlığı açıkça ilan edenler gizlice Tanrı'ya ibadet edip dua ettiler, bu yüzden Hristiyanlar soruşturmalarını yoğunlaştırdılar ve bu nedenle birçoğunu yaktılar ve küçük bir bıçak bile taşımalarına izin vermediler, demir aletlerden bahsetmiyorum bile. {cite:nafh-tib-maqqari s. 527-528}"
  id: "Umat Kristen melanggar perjanjian yang digunakan untuk merebut Granada dan melanggar ketentuan-ketentuannya satu per satu hingga mereka memaksa umat Muslim untuk masuk Kristen pada tahun 904 H (1504 M). Hal ini disebabkan oleh beberapa faktor, yang paling signifikan dan kuat adalah para pendeta menetapkan bahwa semua orang Kristen yang telah masuk Islam harus dipaksa untuk kembali kepada kekafiran, yang kemudian mereka lakukan. Mereka kemudian melangkah lebih jauh, memberi tahu para pria Muslim bahwa kakek mereka adalah orang Kristen dan telah masuk Islam, sehingga memaksa mereka untuk kembali kepada agama Kristen. Ketika hal ini meluas, penduduk Albaicín bangkit melawan penguasa dan membunuh mereka. Hal ini menyebabkan perpindahan agama, karena sultan menetapkan bahwa siapa pun yang memberontak terhadap penguasa akan menghadapi hukuman mati kecuali mereka masuk Kristen untuk melarikan diri. Singkatnya, semua orang Kristen, baik di gurun maupun di kota, masuk Kristen. Beberapa menolak dan menarik diri dari masyarakat, tetapi ini terbukti tidak efektif. Desa-desa dan daerah-daerah, termasuk Balfiq dan Andarsh, juga melakukan perlawanan. Musuh mengumpulkan pasukan melawan mereka dan memusnahkan mereka melalui pembunuhan dan perbudakan, kecuali mereka yang berada di Pegunungan Balfiqah, di mana Tuhan menolong mereka melawan musuh mereka. Mereka mengalami pembantaian besar-besaran, di mana penguasa Cordoba terbunuh. Para penyintas kemudian dikawal ke Fez dengan jaminan keamanan, bersama keluarga mereka dan apa pun yang dapat mereka bawa. Uang mereka, kemudian mereka yang secara terbuka mengaku Kristen akan menyembah Tuhan secara diam-diam dan berdoa, sehingga orang-orang Kristen mengintensifkan penyelidikan mereka sampai mereka membakar banyak dari mereka karena hal itu dan mencegah mereka membawa bahkan pisau kecil, apalagi pisau besi lainnya {cite:nafh-tib-maqqari p. 527-528}."
