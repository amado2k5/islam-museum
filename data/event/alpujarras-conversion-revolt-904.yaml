label: { ar: "نكث شروط غرناطة وثورة البشرات" }
summary:
  ar: "نكث النصارى العهد الذي أُخذت به غرناطة ونقضوا الشروط عروة عروة إلى أن آل الحال لحملهم المسلمين على التنصر سنة أربع وتسعمائة، بعد أمور أعظمها وأقواها عليهم أن القسيسين كتبوا على جميع من كان أسلم من النصارى أن يرجعوا قهراً للكفر ففعلوا، ثم تعدوا إلى أمر آخر وهو أن يقولوا للرجل المسلم إن جدك كان نصرانياً فأسلم فترجع نصرانياً، ولما فحش هذا الأمر قام أهل البيازين على الحكام وقتلوهم فكان ذلك سبب التنصر لأن الحكم خرج من السلطان أن من قام على الحاكم فليس إلا الموت إلا أن يتنصر فينجو، وبالجملة تنصروا عن آخرهم بادية وحاضرة وامتنع قوم فاعتزلوا الناس فلم ينفعهم، وامتنعت قرى وأماكن منها بلفيق وأندرش فجمع لهم العدو الجموع واستأصلهم قتلاً وسبياً إلا ما كان من جبل بلفقة فإن الله أعانهم على عدوهم وقتلوا منهم مقتلة عظيمة مات فيها صاحب قرطبة وأُخرجوا على الأمان إلى فاس بعيالهم وما خف من مالهم، ثم كان من أظهر التنصر يعبد الله في خفية ويصلي فشدد عليهم النصارى في البحث حتى أحرقوا منهم كثيراً بسبب ذلك ومنعوهم من حمل السكين الصغيرة فضلاً عن غيرها من الحديد {cite:nafh-tib-maqqari p. 527-528}."
  en: "The treaty of Granada broken clause by clause: in 904 the Muslims were forced to convert — first those once Christian were ordered back 'to unbelief by compulsion', then any Muslim was told his grandfather had been Christian; the Albaicin rose and killed the governors, making death-or-conversion the decree. Whole villages refused — Balfig, Andarax and the mountain of Ballanca whose men killed 'the lord of Cordoba' and were let out on aman to Fez — while the outwardly converted prayed in secret and were burned for it {cite:nafh-tib-maqqari p. 527-528}."
