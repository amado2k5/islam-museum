id: event/al-hadi-at-rajla-the-division-of-a-wrongdoers-crop-and-the-felling-of-his-palms-286
class: event
kind: other
label:
  ar: 'الهادي في رجلاء: قسمة زرع مفسد وقطع نصيبه من النخل، جمادى الآخرة 286هـ'
  en: 'Al-Hadi at Rajla: the division of a wrongdoer''s crop and the felling of his share of palms, Jumada II 286 AH'
  ur: 'رجلاء میں ہادی: ایک مفسد کی کھیتی کی تقسیم اور اس کے حصے کے کھجوروں کا کاٹنا، جمادی الآخرہ 286ھ'
summary:
  ar: طلب الهادي رجلاً من المفسدين هرب من قريته رجلاء فلم يجبه فهدم منزله، ثم قسم زرع الذرة ونخلاً له ولأخيه وشركائه، وقلع ما صار له من الزرع وقطع نصيبه وهو نيف وعشرون نخلة، مستشهداً بما فعله النبي في نخل بني النضير وبالآية في سورة الحشر، ثم عاد فأصلح أموراً بين الناس.
  en: Al-Hadi sought a wrongdoer who had fled his village of Rajla and, getting no answer, pulled down his house; he had the maize crop and the palms held with his brother and partners divided, pulled up the crop that fell to the man and cut his share of palms, a little over twenty, citing the Prophet's cutting of the palms of Banu al-Nadir and the verse of Surat al-Hashr, then returned and settled matters among the people.
  ur: ہادی نے ایک مفسد کو تلاش کیا جو اپنی بستی رجلاء سے بھاگ گیا تھا اور جواب نہ دینے پر اس کا گھر گروا دیا؛ پھر اس کے بھائی اور شریکوں کے ساتھ مشترک مکئی کی کھیتی اور کھجوروں کو تقسیم کروایا، اس کے حصے کی فصل اکھڑوائی اور اس کے حصے کے بیس سے کچھ اوپر کھجور کٹوائے، اور نبی کے بنو نضیر کے کھجوروں کو کاٹنے اور سورۃ الحشر کی آیت کا حوالہ دیا، پھر لوٹ کر لوگوں کے کچھ معاملات سلجھائے۔
