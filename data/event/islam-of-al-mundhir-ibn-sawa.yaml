id: event/islam-of-al-mundhir-ibn-sawa
class: event
kind: other
label: { ar: "بعث العلاء بن الحضرمي إلى المنذر بن ساوى وإسلامه", en: "Al-Ala' ibn al-Hadrami's mission to al-Mundhir ibn Sawa and his conversion", es: "La misión de Al-Ala' ibn al-Hadrami a al-Mundhir ibn Sawa y su conversión", fr: "La mission d'Al-Ala' ibn al-Hadrami auprès d'al-Mundhir ibn Sawa et sa conversion", ur: "علاء ابن الحدرمی کا المنذر ابن ساوا کا مشن اور اس کی تبدیلی", tr: "Al-Ala' ibn al-Hadrami, al-Mundhir ibn Sawa'ya bir mesaj gönderdi ve o da İslamiyet'i kabul etti.", id: "Al-Ala’ ibn al-Hadrami mengirim pesan kepada al-Mundhir ibn Sawa, dan dia masuk Islam." }
summary:
  ar: "بعث النبي العلاء بن الحضرمي قبل فتح مكة إلى المنذر بن ساوى العبدي صاحب البحرين، فأسلم فحسن إسلامه، وبقي العلاء عنده أميراً للنبي على البحرين حتى مات المنذر بعد النبي قبل ردة أهل البحرين؛ تضعه المصادر المتأخرة ضمن مكاتبة الملوك بعد الحديبية."
  en: "Before the conquest of Mecca the Prophet sent al-Ala' ibn al-Hadrami to al-Mundhir ibn Sawa al-Abdi, lord of Bahrayn, who became a good Muslim; al-Ala' stayed as the Prophet's governor of Bahrayn until al-Mundhir died after the Prophet and before Bahrayn's apostasy. Later sources place it among the letters to the kings after al-Hudaybiyya."
  es: "Antes de la conquista de La Meca, el Profeta envió a al-Ala' ibn al-Hadrami a al-Mundhir ibn Sawa al-Abdi, señor de Baréin, quien se convirtió al Islam. Al-Ala' permaneció como gobernador de Baréin, bajo el mandato del Profeta, hasta la muerte de al-Mundhir, después del Profeta y antes de la apostasía de Baréin. Fuentes posteriores lo sitúan entre las cartas dirigidas a los reyes después de al-Hudaybiyya."
  fr: "Avant la conquête de La Mecque, le Prophète envoya al-Ala' ibn al-Hadrami auprès d'al-Mundhir ibn Sawa al-Abdi, seigneur de Bahrayn, qui s'était converti à l'islam. Al-Ala' demeura gouverneur de Bahrayn auprès du Prophète jusqu'à la mort d'al-Mundhir, survenue après le Prophète et avant l'apostasie de Bahrayn. Des sources postérieures situent cette lettre parmi celles adressées aux rois après al-Hudaybiyya."
  ur: "فتح مکہ سے پہلے نبی نے علاء بن حضرمی کو بحرین کے سردار المنذر بن سواع العبدی کے پاس بھیجا، جو ایک اچھا مسلمان ہو گیا۔ العلا بحرین کے پیغمبر کے گورنر کے طور پر رہے یہاں تک کہ المنذر پیغمبر کے بعد اور بحرین کے ارتداد سے پہلے فوت ہوگئے۔ بعد کے ذرائع نے اسے حدیبیہ کے بعد بادشاہوں کو لکھے گئے خطوط میں شامل کیا ہے۔"
  tr: "Peygamberimiz, Mekke'nin fethinden önce Al-Ala' bin Al-Hadrami'yi Bahreyn hükümdarı Al-Mundhir bin Sawa Al-Abdi'ye gönderdi. Al-Mundhir İslam'ı kabul etti ve bu kabulü olumlu oldu. Al-Ala', Bahreyn halkı dinden çıkmadan önce, Peygamberimizden sonra Al-Mundhir'in ölümüne kadar Bahreyn'de Peygamberimizin emiri olarak onunla birlikte kaldı. Daha sonraki kaynaklar onu, Hudeybiye'den sonraki kralların yazışmaları arasında saymaktadır."
  id: "Nabi Muhammad SAW mengutus Al-Ala’ bin Al-Hadrami sebelum penaklukan Mekah kepada Al-Mundhir bin Sawa Al-Abdi, penguasa Bahrain. Al-Mundhir memeluk Islam dan keislamannya berjalan baik. Al-Ala’ tetap bersamanya sebagai emir Nabi di Bahrain hingga Al-Mundhir wafat setelah Nabi, sebelum penduduk Bahrain murtad. Sumber-sumber selanjutnya memasukkannya dalam daftar korespondensi raja-raja setelah Al-Hudaybiyyah."
