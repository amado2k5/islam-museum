label: { ar: "بعث العلاء بن الحضرمي إلى المنذر بن ساوى وإسلامه", en: "Al-Ala' ibn al-Hadrami's mission to al-Mundhir ibn Sawa and his conversion" }
summary:
  ar: "بعث النبي العلاء بن الحضرمي قبل فتح مكة إلى المنذر بن ساوى العبدي صاحب البحرين، فأسلم فحسن إسلامه، وبقي العلاء عنده أميراً للنبي على البحرين حتى مات المنذر بعد النبي قبل ردة أهل البحرين؛ تضعه المصادر المتأخرة ضمن مكاتبة الملوك بعد الحديبية."
  en: "Before the conquest of Mecca the Prophet sent al-Ala' ibn al-Hadrami to al-Mundhir ibn Sawa al-Abdi, lord of Bahrayn, who became a good Muslim; al-Ala' stayed as the Prophet's governor of Bahrayn until al-Mundhir died after the Prophet and before Bahrayn's apostasy. Later sources place it among the letters to the kings after al-Hudaybiyya."
