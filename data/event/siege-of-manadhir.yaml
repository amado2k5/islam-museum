id: event/siege-of-manadhir
class: event
kind: conquest
label: { ar: "فتح مناذر", en: "Conquest of Manadhir" }
summary:
  ar: "سار أبو موسى إلى مناذر فحاصر أهلها فاشتد قتالهم وكان المهاجر بن زياد الحارثي أخو الربيع بن زياد في الجيش فأراد أن يشري نفسه وهو صائم فقال أبو موسى عزمت على كل صائم أن يفطر أو لا يخرج إلى القتال فشرب شربة ماء وقال قد أبررت عزمة أميري والله ما شربتها من عطش ثم راح في السلاح فقاتل حتى استشهد وأخذ أهل مناذر رأسه ونصبوه على قصرهم بين شرفتين واستخلف أبو موسى الربيع بن زياد على مناذر وسار إلى السوس ففتح الربيع مناذر عنوة فقتل المقاتلة وسبى الذرية وصارت مناذر الكبرى والصغرى في أيدي المسلمين وولاها أبو موسى عاصم بن قيس بن الصلت السلمي وكتب عمر في رواية أن مناذر كقرية من قرى السواد فردوا عليهم ما أصبتم."
  en: "Abu Musa besieged Manadhir against fierce fighting; al-Muhajir ibn Ziyad, al-Rabi' ibn Ziyad's brother, meant to sell his life fasting — Abu Musa had sworn every faster break his fast or not fight, so he drank 'not from thirst' and fell martyred, his head raised on the citadel between two merlons — the poem 'راح المهاجر في حل بإجمال' mourns him. Al-Rabi' ibn Ziyad, left in charge, took Manadhir by force — killing the fighters, capturing the children — so both Manadhirs passed to the Muslims under Asim ibn Qays al-Sulami; in another telling Umar ruled it 'a Sawad village — return what you took'."
