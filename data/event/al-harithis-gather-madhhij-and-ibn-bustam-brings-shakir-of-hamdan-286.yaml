id: event/al-harithis-gather-madhhij-and-ibn-bustam-brings-shakir-of-hamdan-286
class: event
kind: other
label:
  ar: استنفار بني الحارث لمذحج وجلب ابن بسطام قبيلة شاكر من همدان، 286هـ
  en: The Harithis call out Madhhij and Ibn Bustam brings Shakir of Hamdan, 286 AH
  ur: بنو حارث کا مذحج کو پکارنا اور ابن بسطام کا ہمدان کے قبیلے شاکر کو لانا، 286ھ
  es: "Los Harithis llaman a Madhhij e Ibn Bustam trae a Shakir de Hamdan, 286 AH."
  fr: "Les Harithis appellent Madhhij et Ibn Bustam amène Shakir de Hamdan, 286 AH"
  tr: "Beni el-Harith'in Madhhij'e karşı seferber edilmesi ve İbn Bustam'ın Şakir kabilesinin Hamdan'dan getirilmesi, Hicri 286"
  id: "Pengerahan Bani al-Harith melawan Madhhij dan kedatangan suku Shakir pimpinan Ibnu Bustam dari Hamdan, 286 H."
summary:
  ar: بعد عفو الهادي يستنفر بنو الحارث مذحجاً ويستمدون قادتهم، ويصل ابن بسطام إلى شاكر من همدان وكان بينهم حلف، فيضمنون له الخروج، ثم يلحق بأصحابه في مذحج ويخرج الجميع في جيوش كثيفة، ويفارقهم في الطريق ليستنهض شاكراً فينهض معه جمع عظيم ويتواعدون ليوم معلوم.
  en: After al-Hadi's pardon the Harithis call out Madhhij and ask their chiefs for horses and arms; Ibn Bustam reaches Shakir of Hamdan, with whom he had an alliance, and they undertake to go out with him; he joins his companions among Madhhij, they all march out in dense hosts, and he parts from them on the road to rouse Shakir, a great number of whom rise with him, and they set a known day.
  ur: عفو ہادی کے بعد بنو حارث مذحج کو پکارتے ہیں اور سرداروں سے گھوڑے اور ہتھیار مانگتے ہیں؛ ابن بسطام ہمدان کے قبیلے شاکر کے پاس پہنچتا ہے جس سے اس کا معاہدہ تھا اور وہ اس کے ساتھ نکلنے کا ذمہ لیتے ہیں؛ پھر وہ مذحج میں اپنے ساتھیوں سے ملتا ہے، سب بڑے لشکروں میں نکلتے ہیں، وہ راستے میں ان سے جدا ہو کر شاکر کو اٹھانے جاتا ہے اور ایک بڑی جماعت اس کے ساتھ اٹھتی ہے، اور وہ ایک معلوم دن کا وعدہ کرتے ہیں۔
  es: "Tras el perdón de al-Hadi, los Harithis convocan a los Madhhij y piden a sus jefes caballos y armas; Ibn Bustam llega hasta Shakir de Hamdan, con quien tenía una alianza, y se comprometen a salir con él; se une a sus compañeros entre los Madhhij, todos marchan en densas huestes, y él se separa de ellos en el camino para despertar a Shakir, un gran número de los cuales se levanta con él, y fijan una fecha determinada."
  fr: "Après le pardon d'al-Hadi, les Harithis appellent Madhhij et demandent à leurs chefs des chevaux et des armes; Ibn Bustam rejoint Shakir de Hamdan, avec qui il avait une alliance, et ils s'engagent à partir avec lui; il rejoint ses compagnons parmi Madhhij, ils marchent tous en armées denses, et il les quitte en route pour réveiller Shakir, dont un grand nombre se lève avec lui, et ils fixent une date connue."
  tr: "El-Hadi'nin affından sonra, Beni El-Harith, Mezhep'i harekete geçirdi ve liderlerinden yardım istedi. İbn Bustam, ittifak kurduğu Hamdan'dan Şakir'e ulaştı ve onlar da onun yola çıkacağına dair güvence verdiler. Ardından Mezhep'teki arkadaşlarına katıldı ve herkes büyük ordular halinde yola çıktı. Şakir'i uyandırmak için yolda onları bıraktı ve onunla birlikte büyük bir grup ayaklandı ve belirli bir gün için bir anlaşma yaptılar."
  id: "Setelah Al-Hadi mengampuni, Bani Al-Harith memobilisasi Madhhij dan meminta bantuan para pemimpin mereka. Ibnu Bustam menemui Shakir dari Hamdan, yang dengannya ia bersekutu, dan mereka menjamin keberangkatannya. Kemudian ia bergabung dengan para sahabatnya di Madhhij, dan semua orang berangkat dalam pasukan besar. Ia meninggalkan mereka di tengah jalan untuk membangkitkan Shakir, dan sekelompok besar orang bangkit bersamanya, dan mereka membuat perjanjian untuk hari yang telah ditentukan."
