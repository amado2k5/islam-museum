id: event/al-harithis-gather-madhhij-and-ibn-bustam-brings-shakir-of-hamdan-286
class: event
kind: other
label:
  ar: استنفار بني الحارث لمذحج وجلب ابن بسطام قبيلة شاكر من همدان، 286هـ
  en: The Harithis call out Madhhij and Ibn Bustam brings Shakir of Hamdan, 286 AH
  ur: بنو حارث کا مذحج کو پکارنا اور ابن بسطام کا ہمدان کے قبیلے شاکر کو لانا، 286ھ
summary:
  ar: بعد عفو الهادي يستنفر بنو الحارث مذحجاً ويستمدون قادتهم، ويصل ابن بسطام إلى شاكر من همدان وكان بينهم حلف، فيضمنون له الخروج، ثم يلحق بأصحابه في مذحج ويخرج الجميع في جيوش كثيفة، ويفارقهم في الطريق ليستنهض شاكراً فينهض معه جمع عظيم ويتواعدون ليوم معلوم.
  en: After al-Hadi's pardon the Harithis call out Madhhij and ask their chiefs for horses and arms; Ibn Bustam reaches Shakir of Hamdan, with whom he had an alliance, and they undertake to go out with him; he joins his companions among Madhhij, they all march out in dense hosts, and he parts from them on the road to rouse Shakir, a great number of whom rise with him, and they set a known day.
  ur: عفو ہادی کے بعد بنو حارث مذحج کو پکارتے ہیں اور سرداروں سے گھوڑے اور ہتھیار مانگتے ہیں؛ ابن بسطام ہمدان کے قبیلے شاکر کے پاس پہنچتا ہے جس سے اس کا معاہدہ تھا اور وہ اس کے ساتھ نکلنے کا ذمہ لیتے ہیں؛ پھر وہ مذحج میں اپنے ساتھیوں سے ملتا ہے، سب بڑے لشکروں میں نکلتے ہیں، وہ راستے میں ان سے جدا ہو کر شاکر کو اٹھانے جاتا ہے اور ایک بڑی جماعت اس کے ساتھ اٹھتی ہے، اور وہ ایک معلوم دن کا وعدہ کرتے ہیں۔
