id: event/ali-appoints-abbas-sons-as-governors
class: event
kind: other
label: { ar: "تولية علي أبناء العباس وابن أبي بكر الولايات", en: "Ali appoints the sons of al-Abbas and Muhammad ibn Abi Bakr as governors", es: "Ali nombra gobernadores a los hijos de al-Abbas y Muhammad ibn Abi Bakr.", fr: "Ali nomme les fils d'al-Abbas et de Muhammad ibn Abi Bakr gouverneurs.", ur: "علی نے عباس کے بیٹوں اور محمد ابن ابی بکر کو گورنر مقرر کیا", tr: "Ali, Abbas ve İbn Abi Bekir'in oğullarını vali olarak atadı.", id: "Ali menunjuk putra Abbas dan Ibnu Abi Bakr sebagai gubernur." }
summary:
  ar: "ولّى علي بن أبي طالب على الأمصار عدداً من أبناء عمّه العباس بن عبد المطلب: عبد الله على البصرة، وعبيد الله على اليمن والبحرين، وقثم على مكة والطائف، وتمام على المدينة، ومعهم محمد بن أبي بكر ربيبه على مصر. ويعرض الصلابي هذه التولية ضمن قائمة من واحد وأربعين والياً، ويرى أن عليّاً وعثمان قدّما الأقارب إذا ثبتت كفاءتهم، لا لمجرد القرابة {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}."
  en: "Ali gave the provinces to several sons of his cousin al-Abbas: Abdallah in Basra, Ubaydallah in Yemen and Bahrain, Qutham in Mecca and al-Ta'if, Tammam in Medina, and with them Muhammad ibn Abi Bakr, his step-son, in Egypt. The book sets this among a list of forty-one governors and holds that Ali and Uthman both appointed kin when their competence was clear, not for kinship alone {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}."
  es: "Ali cedió las provincias a varios hijos de su primo al-Abbas: Abdallah en Basora, Ubaydallah en Yemen y Baréin, Qutham en La Meca y al-Ta'if, Tammam en Medina, y con ellos Muhammad ibn Abi Bakr, su hijastro, en Egipto. El libro sitúa esto entre una lista de cuarenta y un gobernadores y sostiene que tanto Ali como Uthman nombraron a parientes cuando su competencia era evidente, no solo por parentesco {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}."
  fr: "Ali confia les provinces à plusieurs fils de son cousin al-Abbas: Abdallah à Bassora, Ubaydallah au Yémen et à Bahreïn, Qutham à La Mecque et à Taïf, Tammam à Médine, et avec eux son beau-fils Muhammad ibn Abi Bakr, en Égypte. L’ouvrage mentionne ces nominations parmi une liste de quarante et un gouverneurs et soutient qu’Ali et Uthman nommèrent tous deux des membres de leur famille lorsque leur compétence était avérée, et non par simple lien de parenté (Sallabi Ali, vol. 1, p. 357 et 358)."
  ur: "علی نے اپنے کزن العباس کے کئی بیٹوں کو صوبے دیے: بصرہ میں عبداللہ، یمن اور بحرین میں عبیداللہ، مکہ میں قطم اور الطائف، مدینہ میں تمم، اور ان کے ساتھ محمد بن ابی بکر، ان کے سوتیلے بیٹے، مصر میں۔ کتاب میں اسے اکتالیس گورنروں کی فہرست میں شامل کیا گیا ہے اور کہا گیا ہے کہ علی اور عثمان دونوں نے رشتہ داروں کو اس وقت مقرر کیا جب ان کی اہلیت واضح تھی، صرف رشتہ داری کے لیے نہیں۔ 357 {حوالہ: ص. 358}۔"
  tr: "Ali ibn Abi Talib, Abbas ibn Abd al-Muttalib'in oğulları olan kuzenlerinden birkaçını çeşitli eyaletlerin valisi olarak atadı: Abdullah Basra'nın, Ubeydullah Yemen ve Bahreyn'in, Kutum Mekke ve Taif'in ve Tamam Medine'nin başına getirildi. Onlarla birlikte üvey oğlu Muhammed ibn Abi Bekir de Mısır'ın başına getirildi. El-Sallabi bu atamayı kırk bir vali listesi içinde sunar ve Ali ile Osman'ın akrabalık bağlarına değil, kanıtlanmış yeteneklerine dayanarak akrabalarını kayırdıklarını savunur. {cite:sallabi-ali-vol1 s. 357}{cite:sallabi-ali-vol1 s. 358}"
  id: "Ali ibn Abi Talib menunjuk beberapa sepupunya, putra-putra Abbas ibn Abd al-Muttalib, sebagai gubernur berbagai provinsi: Abdullah di Basra, Ubaydullah di Yaman dan Bahrain, Qutham di Mekah dan Taif, dan Tamam di Madinah. Bersama mereka adalah putra tirinya, Muhammad ibn Abi Bakr, di Mesir. Al-Sallabi menyajikan penunjukan ini dalam daftar empat puluh satu gubernur, dan ia berpendapat bahwa Ali dan Utsman lebih menyukai kerabat berdasarkan kompetensi mereka yang telah terbukti, bukan hanya berdasarkan hubungan kekerabatan. {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}"
