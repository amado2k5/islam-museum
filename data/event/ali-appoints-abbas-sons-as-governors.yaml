issue: { ar: "هل ولّى علي أقاربه لقرابتهم أم لكفاءتهم؟", en: "Did Ali appoint kin for kinship or for competence?" }
perspectives:
  - tradition: sunni
    id: sunni-author
    summary:
      ar: "يرى الكتاب أن علياً ولّى أبناء عمه لكفاءتهم، كما ولّى عثمان أقاربه، وأن عمر سنّ التحرج من تقريب الأقربين وأن عثمان وعلياً سنّا لمن بعدهما تقريب الأقارب إذا كانوا أهل كفاءة {cite:sallabi-ali-vol1 p. 359}."
      en: "The book holds that Ali appointed his cousins for their competence, as Uthman had appointed his kin; that Umar set a caution about favouring relatives, and that Uthman and Ali set the precedent of favouring kin who are competent {cite:sallabi-ali-vol1 p. 359}."
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic-view
    summary:
      ar: "يستند الكتاب في تقدير الولاة إلى كتاب الولاية على البلدان للدكتور عبد العزيز لعمري (هامش ص 351)، ولم يُنقل في هذا الموضع حكم أكاديمي مخالف (needs_source) {cite:sallabi-ali-vol1 p. 351}."
      en: "The book takes its account of the provinces from Abd al-Aziz al-Umari's study of the governorships; no contrary academic verdict is quoted at this point (needs_source) {cite:sallabi-ali-vol1 p. 351}."
    sources: [source/sallabi-ali-vol1]
  - tradition: other
    id: critics-of-favouritism
    summary:
      ar: "يذكر الكتاب أن بعض الكتّاب المعاصرين اتهموا عليّاً وعثمان بتقديم الأقارب، وأن هذا الاتهام يتوسع فيه في دراسة الولايات {cite:sallabi-ali-vol1 p. 357}. ولا يسمّي الكتاب هؤلاء الكتّاب في الصفحة، فيُعرض قولهم كما ورد وينسب إلى مصدره في الكتاب."
      en: "The book notes that some modern writers accused Ali and Uthman of favouring relatives. It does not name them on the page, so their view is recorded as the book reports it {cite:sallabi-ali-vol1 p. 357}."
    sources: [source/sallabi-ali-vol1]
