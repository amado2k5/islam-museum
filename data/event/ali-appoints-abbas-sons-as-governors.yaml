id: event/ali-appoints-abbas-sons-as-governors
class: event
kind: other
label: { ar: "تولية علي أبناء العباس وابن أبي بكر الولايات", en: "Ali appoints the sons of al-Abbas and Muhammad ibn Abi Bakr as governors" }
summary:
  ar: "ولّى علي بن أبي طالب على الأمصار عدداً من أبناء عمّه العباس بن عبد المطلب: عبد الله على البصرة، وعبيد الله على اليمن والبحرين، وقثم على مكة والطائف، وتمام على المدينة، ومعهم محمد بن أبي بكر ربيبه على مصر. ويعرض الصلابي هذه التولية ضمن قائمة من واحد وأربعين والياً، ويرى أن عليّاً وعثمان قدّما الأقارب إذا ثبتت كفاءتهم، لا لمجرد القرابة {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}."
  en: "Ali gave the provinces to several sons of his cousin al-Abbas: Abdallah in Basra, Ubaydallah in Yemen and Bahrain, Qutham in Mecca and al-Ta'if, Tammam in Medina, and with them Muhammad ibn Abi Bakr, his step-son, in Egypt. The book sets this among a list of forty-one governors and holds that Ali and Uthman both appointed kin when their competence was clear, not for kinship alone {cite:sallabi-ali-vol1 p. 357}{cite:sallabi-ali-vol1 p. 358}."
date:
