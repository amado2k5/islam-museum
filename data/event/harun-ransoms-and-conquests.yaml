summary:
  ar: "في سنة تسع وثمانين ومئة فادى الروم حتى لم يبق بممالكهم في الأسر مسلم، وفي سنة تسعين فتح هرقلة وبث جيوشه بأرض الروم فافتتح شراحيل بن معن بن زائدة حصن الصقالبة وافتتح يزيد بن مخلد ملقونية وسار حميد بن معيوف إلى قبرس فهدم وحرق وسبى من أهلها ستة عشر ألفاً {cite:tarikh-khulafa-minhaj-1434 p. 463}."
  en: "In year 189 the Romans ransomed captives until no Muslim remained prisoner in their lands; in 190 Heraclea was conquered and al-Rashid spread his armies through Roman lands — Sharahil ibn Ma'n ibn Za'ida took the Saqaliba fortress, Yazid ibn Makhled took Malquniya, and Humayd ibn Ma'yuf sailed to Cyprus, demolishing and burning and carrying off sixteen thousand of its people {cite:tarikh-khulafa-minhaj-1434 p. 463}."
