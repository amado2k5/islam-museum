label: { ar: "الفداء العام وفتوحات سنة 190", en: "The General Ransom and the Conquests of 190 AH", es: "El rescate general y las conquistas del año 190 d. C.", fr: "La rançon générale et les conquêtes de 190 AH" }
summary:
  ar: "في سنة تسع وثمانين ومئة فادى الروم حتى لم يبق بممالكهم في الأسر مسلم، وفي سنة تسعين فتح هرقلة وبث جيوشه بأرض الروم فافتتح شراحيل بن معن بن زائدة حصن الصقالبة وافتتح يزيد بن مخلد ملقونية وسار حميد بن معيوف إلى قبرس فهدم وحرق وسبى من أهلها ستة عشر ألفاً {cite:tarikh-khulafa-minhaj-1434 p. 463}."
  en: "In year 189 the Romans ransomed captives until no Muslim remained prisoner in their lands; in 190 Heraclea was conquered and al-Rashid spread his armies through Roman lands — Sharahil ibn Ma'n ibn Za'ida took the Saqaliba fortress, Yazid ibn Makhled took Malquniya, and Humayd ibn Ma'yuf sailed to Cyprus, demolishing and burning and carrying off sixteen thousand of its people {cite:tarikh-khulafa-minhaj-1434 p. 463}."
  es: "En el año 189, los romanos rescataron a los cautivos hasta que ningún musulmán permaneció prisionero en sus tierras; en 190, Heraclea fue conquistada y al-Rashid extendió sus ejércitos por las tierras romanas: Sharahil ibn Ma'n ibn Za'ida tomó la fortaleza de Saqaliba, Yazid ibn Makhled tomó Malquniya, y Humayd ibn Ma'yuf navegó hacia Chipre, demoliendo, incendiando y llevándose a dieciséis mil de sus habitantes {cite:tarikh-khulafa-minhaj-1434 p. 463}."
  fr: "En l'an 189, les Romains rachetèrent les captifs jusqu'à ce qu'aucun musulman ne reste prisonnier sur leurs terres; en 190, Héraclée fut conquise et al-Rashid étendit ses armées à travers les terres romaines — Sharahil ibn Ma'n ibn Za'ida prit la forteresse de Saqaliba, Yazid ibn Makhled prit Malquniya et Humayd ibn Ma'yuf fit voile vers Chypre, démolissant, incendiant et emmenant seize mille de ses habitants {cite:tarikh-khulafa-minhaj-1434 p. 463}."
