id: event/al-nawawi-ashrafiyya-665
class: event
kind: other
label:
  ar: "النووي يتولى مشيخة دار الحديث الأشرفية بدمشق، ٦٦٥هـ/١٢٦٧م"
  en: "Al-Nawawi takes over the al-Ashrafiyya dar al-hadith in Damascus, 665/1267"
  ur: "نووی کا دمشق میں دار الحدیث اشرفیہ کی مشیخت سنبھالنا، 665ھ/1267ء"
  es: "Al-Nawawi se hace cargo de al-Ashrafiyya dar al-hadith en Damasco, 665/1267"
  fr: "Al-Nawawi reprend al-Ashrafiyya dar al-hadith à Damas, 665/1267"
  tr: "Al-Nawawi, MS 665 / MS 1267'de Şam'da Dar al-Hadis el-Eşrefiyye Şeyhi görevini üstlendi."
  id: "Al-Nawawi menjabat sebagai Syekh Dar al-Hadits al-Ashrafiyya di Damaskus, 665 H/1267 M."
summary:
  ar: "وُلي النووي مشيخة دار الحديث الأشرفية بدمشق سنة ٦٦٥هـ/١٢٦٧م خلفاً للشيخ شهاب الدين أبي شامة الذي توفي فيها، وكان لا يتناول من معلومها شيئاً بل يقتات بالقليل مما يبعثه إليه أبوه من نوى {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}."
  en: "In 665/1267 al-Nawawi was appointed head of the al-Ashrafiyya dar al-hadith in Damascus in succession to Shihab al-Din Abu Shama, who had just died. He took nothing from its stipend, living on the little his father sent him from Nawa {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}."
  ur: "665ھ/1267ء میں نووی کو دمشق کی دار الحدیث اشرفیہ کی مشیخت سونپی گئی، جو ابھی فوت ہوئے شہاب الدین ابو شامہ کے جانشین تھے۔ انہوں نے اس کے وظیفے سے کچھ نہیں لیا اور والد کی طرف سے نوى سے آنے والے قلیل سامان پر گزارہ کیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}۔"
  es: "En 665/1267, al-Nawawi fue nombrado jefe del dar al-hadith al-Ashrafiyya en Damasco, sucediendo a Shihab al-Din Abu Shama, quien acababa de fallecer. No recibió nada de su estipendio, viviendo de lo poco que su padre le enviaba desde Nawa {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}."
  fr: "En 665/1267, al-Nawawi fut nommé à la tête de l'al-Ashrafiyya dar al-hadith de Damas, succédant à Shihab al-Din Abu Shama, qui venait de décéder. Il ne percevait aucune rémunération de l'établissement, vivant du peu que son père lui envoyait de Nawa."
  tr: "El-Nawawi, Hicri 665/Miladi 1267 yılında Şam'daki Dar al-Hadith al-Ashrafiyya'nın şeyhi olarak atandı ve orada vefat eden Şeyh Şihab al-Din Abu Şama'nın yerini aldı. Gelirinden hiçbir şey almadı, bunun yerine babasının kendisine gönderdiği az miktardaki hurma ile geçindi. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}."
  id: "Al-Nawawi diangkat menjadi Syekh Dar al-Hadith al-Ashrafiyya di Damaskus pada tahun 665 H/1267 M, menggantikan Syekh Shihab al-Din Abu Shama, yang meninggal di sana. Ia tidak mengambil bagian dari penghasilannya, melainkan hidup dari sedikit kurma yang dikirimkan ayahnya. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356} {cite:al-bidaya-wal-nihaya p. 294}."
