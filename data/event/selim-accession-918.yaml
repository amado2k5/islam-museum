summary:
  ar: "ينقل الصلابي أن بايزيد الثاني ترك حكم الدولة لابنه سليم الأول في 18 صفر 918هـ الموافق 25 أبريل 1512م {cite:dawlat-uthmaniyya-salabi p. 174-175}. وعند ابن العماد: لما ساءت حالة بايزيد بالمرض نازعه ولده سليم السلطنة فسلّمها له ثم توفي قرب غوريه {cite:shadharat-dhahab p. 485}."
  en: "Al-Salabi dates Bayezid II's cession of the sultanate to his son Selim I at 18 Safar 918 / 25 April 1512 {cite:dawlat-uthmaniyya-salabi p. 174-175}; Ibn al-Imad adds that Selim contested the ailing father for the throne, that he yielded it, then died near Guria {cite:shadharat-dhahab p. 485}."
