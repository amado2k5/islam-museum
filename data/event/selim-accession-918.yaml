label:
  ar: "تولية سليم الأول السلطنة سنة 918هـ"
  en: "Selim I's accession, 918/1512"
  es: "Ascenso al trono de Selim I, 918/1512"
  fr: "L'accession au trône de Sélim Ier, 918/1512"
  ur: "سلیم اول کا الحاق، 918/1512"
  tr: "Selim I, Hicri 918 yılında sultanlığı devraldı."
  id: "Selim I naik tahta sebagai Sultan pada tahun 918 Hijriah."
summary:
  ar: "ينقل الصلابي أن بايزيد الثاني ترك حكم الدولة لابنه سليم الأول في 18 صفر 918هـ الموافق 25 أبريل 1512م {cite:dawlat-uthmaniyya-salabi p. 174-175}. وعند ابن العماد: لما ساءت حالة بايزيد بالمرض نازعه ولده سليم السلطنة فسلّمها له ثم توفي قرب غوريه {cite:shadharat-dhahab p. 485}."
  en: "Al-Salabi dates Bayezid II's cession of the sultanate to his son Selim I at 18 Safar 918 / 25 April 1512 {cite:dawlat-uthmaniyya-salabi p. 174-175}; Ibn al-Imad adds that Selim contested the ailing father for the throne, that he yielded it, then died near Guria {cite:shadharat-dhahab p. 485}."
  es: "Al-Salabi fecha la cesión del sultanato de Bayezid II a su hijo Selim I el 18 de Safar de 918 / 25 de abril de 1512 {cite:dawlat-uthmaniyya-salabi p. 174-175}; Ibn al-Imad añade que Selim disputó el trono a su padre enfermo, que este lo cedió y luego murió cerca de Guria {cite:shadharat-dhahab p. 485}."
  fr: "Al-Salabi date la cession du sultanat de Bayezid II à son fils Selim Ier au 18 Safar 918 / 25 avril 1512 {cite:dawlat-uthmaniyya-salabi p. 174-175}; Ibn al-Imad ajoute que Selim a contesté le trône à son père malade, qu'il l'a cédé, puis est mort près de Guria {cite:shadharat-dhahab p. 485}."
  ur: "السلبی نے بایزید ثانی کی سلطنت کی علیحدگی اپنے بیٹے سلیم اول کو 18 صفر 918 / 25 اپریل 1512 کو بتائی ہے۔ 174-175}; ابن عماد مزید کہتے ہیں کہ سلیم نے تخت کے لیے بیمار باپ سے مقابلہ کیا، کہ اس نے تخت حاصل کیا، پھر گوریہ کے قریب انتقال کر گیا۔ 485}۔"
  tr: "El-Salabî, Bayezid II'nin 18 Safer 918 Hicri (25 Nisan 1512 Miladi) tarihinde devlet yönetimini oğlu Selim I'e devrettiğini bildirmektedir (kaynak: Dawlat-uthmaniyya-salabi, s. 174-175). İbn el-İmad'a göre: Bayezid'in sağlığı hastalık nedeniyle kötüleşince, oğlu Selim sultanlık üzerindeki iddiasına itiraz etti, bunun üzerine Bayezid yönetimi ona devretti ve ardından Ghoriyeh yakınlarında öldü (kaynak: Shadharat-dhahab, s. 485)."
  id: "Al-Salabi melaporkan bahwa Bayezid II menyerahkan kekuasaan negara kepada putranya, Selim I, pada tanggal 18 Safar 918 H, yang bertepatan dengan 25 April 1512 M {cite:dawlat-uthmaniyya-salabi hlm. 174-175}. Menurut Ibn al-Imad: Ketika kesehatan Bayezid memburuk karena sakit, putranya Selim menantang klaimnya atas kesultanan, sehingga ia menyerahkannya kepada putranya dan kemudian meninggal di dekat Ghoriyeh {cite:shadharat-dhahab hlm. 485}."
