id: event/abduction-of-the-patrikios
class: event
kind: other
label: { ar: "حيلة معاوية في أسر البطريق", en: "Mu'awiya's abduction of the patrikios", fr: "L’enlèvement du patrikios par Mu'awiya", es: "El secuestro de los patrikios por parte de Mu'awiya", ur: "معاویہ کا محب وطن لوگوں کا اغوا", tr: "Muaviye'nin pengueni yakalamadaki hilesi", id: "Trik Muawiyah dalam menangkap penguin" }
summary:
  ar: "لطم بطريق رومي حر وجه أسير قرشي فصاح وا إسلامه أين أنت عنا يا معاوية، فأجمل معاوية الحيلة سنين مع رجل من صور مرطان بالرومية كثير الغزو في البحر بنى له مركباً لا يلحق سرعة، فتاجر إلى القسطنطينية حتى اشتهى البطريق بساطاً سوسنجرداً، ففرشه في صحن المركب وأخفى الرجال تحته بالمجاذيف، فلما أشرف على قصر البطريق على ضيعته بالخليج ونزل يعاين البساط ضرب الصوري بعقبه فاختطف المركب في وسط الخليج، فأتي به معاوية فاقتص منه القرشي على بساط معظم الروم، ثم أحسن إليه وخلع عليه وأعاده بهدايا فقال ملك الروم هذا أمكر الملوك وأدهى العرب ولو هم بأخذي لتمت له الحيلة، فلم يستضم أسير مسلم في أيامه {cite:muruj-al-dhahab p. 584-587}."
  en: "The famous ruse: a Tyrian seaman's years-long trade mission ends with the patrikios lured aboard a carpeted ship and raced to Syria so the slapped Qurashi could exact his justice on the Byzantine's own carpet {cite:muruj-al-dhahab p. 584-587}."
  fr: "La célèbre ruse : la mission commerciale de plusieurs années d’un marin de Tyr se termine lorsque le patrikios, attiré à bord d’un navire couvert d’un tapis, est emporté à toute vitesse vers la Syrie, afin que le Qurayshite giflé puisse obtenir réparation sur le propre tapis du Byzantin {cite:muruj-al-dhahab p. 584-587}."
  es: "La famosa estratagema: la misión comercial de un marinero tirio, que duró años, termina con el patricio atraído a bordo de un barco alfombrado y llevado a toda velocidad a Siria para que el Qurashi abofeteado pudiera hacer justicia sobre la propia alfombra bizantina {cite:muruj-al-dhahab p. 584-587}."
  ur: "مشہور ہجوم: ایک ٹیریئن بحری جہاز کا سالہا سال پر محیط تجارتی مشن اس وقت ختم ہوتا ہے جب ایک قالین والے جہاز پر سوار ہو کر شام کی طرف دوڑ لگاتے ہیں تاکہ تھپڑ مارنے والا قریشی بازنطینی کے اپنے قالین پر اپنا انصاف کر سکے۔ 584-587}۔"
  tr: "Özgür bir Roma patriği, Kureyşli bir tutsağın yüzüne tokat attı ve tutsak, \"Ey İslam'ım! Neredesin Muaviye?\" diye bağırdı. Bunun üzerine Muaviye, yıllar önce sık sık deniz baskınlarına katılan bir Surlu adamla bir plan kurdu. Ona eşsiz bir hıza sahip bir gemi inşa etti. Patriğin güzel bir halı istemesi üzerine Konstantinopolis'e ticaret yaptı. Halıyı geminin güvertesine serdi ve altına küreklerle adamlar sakladı. Patriğin körfezdeki malikanesindeki sarayına bakıp halıyı incelemek için aşağı indiğinde, Surlu adam topuğuyla vurdu ve gemi körfezin ortasında ele geçirildi. Muaviye'ye getirildi ve Kureyşli adam, en önemli Romalıların halısı üzerinde ondan intikam aldı. Sonra ona iyi davrandı, ona şeref elbisesi verdi ve hediyelerle geri gönderdi. Roma kralı, \"Bu, kralların en kurnaz ve Arapların en zekisidir. Eğer beni ele geçirmeyi amaçlamış olsaydı, planı başarılı olurdu.\" dedi. Dolayısıyla, onun döneminde hiçbir Müslüman esir zarar görmedi. {cite:muruj-al-dhahab s. 584-587}"
  id: "Seorang patriark Romawi yang bebas menampar wajah seorang tahanan Quraisy, yang berteriak, \"Oh, Islamku! Di mana engkau, Muawiyah?\" Maka Muawiyah merancang sebuah rencana bertahun-tahun yang lalu dengan seorang pria dari Tirus, yang sering menjadi perampok di laut. Ia membangunkan kapal yang tak tertandingi kecepatannya. Ia berdagang ke Konstantinopel sampai sang patriark menginginkan karpet yang bagus. Ia membentangkan karpet itu di dek kapal dan menyembunyikan orang-orang di bawahnya dengan dayung. Ketika ia melihat ke arah istana sang patriark di perkebunannya di teluk dan turun untuk memeriksa karpet, pria dari Tirus itu menendang dengan tumitnya, dan kapal itu direbut di tengah teluk. Ia dibawa ke Muawiyah, dan orang-orang Quraisy itu membalas dendam padanya dengan karpet milik orang Romawi yang paling penting. Kemudian ia memperlakukannya dengan baik, memberinya jubah kehormatan, dan mengirimnya kembali dengan hadiah. Raja Romawi berkata, \"Ini adalah raja yang paling licik dan orang Arab yang paling cerdik. Jika ia bermaksud menangkapku, rencananya pasti akan berhasil.\" Jadi, tidak ada tahanan Muslim yang disakiti selama masa hidupnya. {cite:muruj-al-dhahab p. 584-587}"
