label: { ar: "حيلة معاوية في أسر البطريق", en: "Mu'awiya's abduction of the patrikios" }
summary:
  ar: "لطم بطريق رومي حر وجه أسير قرشي فصاح وا إسلامه أين أنت عنا يا معاوية، فأجمل معاوية الحيلة سنين مع رجل من صور مرطان بالرومية كثير الغزو في البحر بنى له مركباً لا يلحق سرعة، فتاجر إلى القسطنطينية حتى اشتهى البطريق بساطاً سوسنجرداً، ففرشه في صحن المركب وأخفى الرجال تحته بالمجاذيف، فلما أشرف على قصر البطريق على ضيعته بالخليج ونزل يعاين البساط ضرب الصوري بعقبه فاختطف المركب في وسط الخليج، فأتي به معاوية فاقتص منه القرشي على بساط معظم الروم، ثم أحسن إليه وخلع عليه وأعاده بهدايا فقال ملك الروم هذا أمكر الملوك وأدهى العرب ولو هم بأخذي لتمت له الحيلة، فلم يستضم أسير مسلم في أيامه {cite:muruj-al-dhahab p. 584-587}."
  en: "The famous ruse: a Tyrian seaman's years-long trade mission ends with the patrikios lured aboard a carpeted ship and raced to Syria so the slapped Qurashi could exact his justice on the Byzantine's own carpet {cite:muruj-al-dhahab p. 584-587}."
