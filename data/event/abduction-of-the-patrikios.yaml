id: event/abduction-of-the-patrikios
class: event
kind: other
label: { ar: "حيلة معاوية في أسر البطريق", en: "Mu'awiya's abduction of the patrikios", fr: "L’enlèvement du patrikios par Mu'awiya", es: "El secuestro de los patrikios por parte de Mu'awiya", ur: "معاویہ کا محب وطن لوگوں کا اغوا" }
summary:
  ar: "لطم بطريق رومي حر وجه أسير قرشي فصاح وا إسلامه أين أنت عنا يا معاوية، فأجمل معاوية الحيلة سنين مع رجل من صور مرطان بالرومية كثير الغزو في البحر بنى له مركباً لا يلحق سرعة، فتاجر إلى القسطنطينية حتى اشتهى البطريق بساطاً سوسنجرداً، ففرشه في صحن المركب وأخفى الرجال تحته بالمجاذيف، فلما أشرف على قصر البطريق على ضيعته بالخليج ونزل يعاين البساط ضرب الصوري بعقبه فاختطف المركب في وسط الخليج، فأتي به معاوية فاقتص منه القرشي على بساط معظم الروم، ثم أحسن إليه وخلع عليه وأعاده بهدايا فقال ملك الروم هذا أمكر الملوك وأدهى العرب ولو هم بأخذي لتمت له الحيلة، فلم يستضم أسير مسلم في أيامه {cite:muruj-al-dhahab p. 584-587}."
  en: "The famous ruse: a Tyrian seaman's years-long trade mission ends with the patrikios lured aboard a carpeted ship and raced to Syria so the slapped Qurashi could exact his justice on the Byzantine's own carpet {cite:muruj-al-dhahab p. 584-587}."
  fr: "La célèbre ruse : la mission commerciale de plusieurs années d’un marin de Tyr se termine lorsque le patrikios, attiré à bord d’un navire couvert d’un tapis, est emporté à toute vitesse vers la Syrie, afin que le Qurayshite giflé puisse obtenir réparation sur le propre tapis du Byzantin {cite:muruj-al-dhahab p. 584-587}."
  es: "La famosa estratagema: la misión comercial de un marinero tirio, que duró años, termina con el patricio atraído a bordo de un barco alfombrado y llevado a toda velocidad a Siria para que el Qurashi abofeteado pudiera hacer justicia sobre la propia alfombra bizantina {cite:muruj-al-dhahab p. 584-587}."
  ur: "مشہور ہجوم: ایک ٹیریئن بحری جہاز کا سالہا سال پر محیط تجارتی مشن اس وقت ختم ہوتا ہے جب ایک قالین والے جہاز پر سوار ہو کر شام کی طرف دوڑ لگاتے ہیں تاکہ تھپڑ مارنے والا قریشی بازنطینی کے اپنے قالین پر اپنا انصاف کر سکے۔ 584-587}۔"
