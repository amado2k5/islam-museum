id: "event/al-hadi-protects-the-non-muslim-subjects-and-some-people-embrace-islam-through-his-gentleness-after-295"
class: event
kind: other
label:
  ar: "الهادي يتعهد أهل الذمة، فيُسلم الواحد والاثنان لما يرون من رفقه، بعد 295هـ، ص388"
  en: "Al-Hadi cares for the protected people, and one or two embrace Islam for his gentleness, after 295 AH, p. 388"
  ur: "ہادی ذمیوں کی خبر گیری کرتا ہے، اور اس کی نرمی دیکھ کر ایک دو لوگ اسلام قبول کرتے ہیں، 295ھ کے بعد، ص388"
  es: "Al-Hadi se preocupa por las personas protegidas, y una o dos abrazan el Islam por su gentileza, después del 295 AH, pág. 388."
  fr: "Al-Hadi prend soin des personnes protégées, et une ou deux se convertissent à l'islam pour sa douceur, après 295 AH, p. 388"
  tr: "El-Hadi, Kitap Ehli'ne biat etti ve 295 Hicri yılından sonra, onun iyiliğinden dolayı bir veya iki kişi İslam'ı kabul etti (s. 388)."
  id: "Al-Hadi berjanji setia kepada Ahli Kitab, dan satu atau dua dari mereka masuk Islam karena kebaikannya, setelah tahun 295 H, hlm. 388."
summary:
  ar: "كان الهادي يتفقد أهل الذمة، ويقول إن الحكم جار عليهم، ويتوعد من يؤذيهم، وكان الواحد والاثنان والمرأة والمرأتان يُسلمون لرفقه وعدله."
  en: "Al-Hadi checked on the protected people, said that the rule applies to them, and warned that anyone who harmed them would answer for it. One or two men and a woman or two embraced Islam because of his gentleness and justice."
  ur: "ہادی ذمیوں کی خبر گیری کرتا، کہتا کہ حکم ان پر بھی جاری ہے، اور جو ان کو تکلیف دے اس کو خبردار کرتا۔ اس کی نرمی اور عدل دیکھ کر ایک دو مرد اور ایک دو عورتیں اسلام لاتے تھے۔"
  es: "Al-Hadi se aseguró de que las personas protegidas estuvieran bien, les dijo que la norma también se aplicaba a ellas y les advirtió que cualquiera que les hiciera daño tendría que rendir cuentas. Uno o dos hombres y una o dos mujeres se convirtieron al islam debido a su bondad y justicia."
  fr: "Al-Hadi s'assura du bien-être des personnes protégées, leur confirma que la règle s'appliquait à elles et les avertit que quiconque leur ferait du mal en répondrait. Touchés par sa douceur et sa justice, un ou deux hommes et une ou deux femmes se convertirent à l'islam."
  tr: "El-Hadi, Ahd Ehli'ni kontrol eder, yönetimin onlara karşı adaletsiz olduğunu söyler ve onlara zarar verenleri tehdit ederdi. Onun iyiliği ve adaleti sayesinde bir iki kişi, bir iki kadın teslim olurdu."
  id: "Al-Hadi biasa memeriksa keadaan kaum Ahlul Baitullah, mengatakan bahwa pemerintahan itu tidak adil terhadap mereka, dan dia akan mengancam orang-orang yang menyakiti mereka. Satu atau dua orang, satu atau dua wanita, akan menyerah karena kebaikan dan keadilannya."
