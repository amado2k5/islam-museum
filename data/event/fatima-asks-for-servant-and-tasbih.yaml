label: { ar: "طلب فاطمة وعلي خادماً من السبي، وتعليمهما التسبيح", en: "Fatima and Ali ask for a servant and are taught the tasbih" }
summary:
  ar: "شكا علي وفاطمة ما يلقيانه من الطحن والعمل، وطلبا من النبي خادماً من السبي، فأبى أن يعطيهما، وقال إنه يبيع السبي وينفق أثمانه على أهل الصفة الذين لا يجد ما ينفق عليهم. ثم علّمهما التسبيح والتحميد والتكبير عند كل صلاة وعند النوم (ص 82-83). ويرى الصلابي في هذا ترتيب النبي للأولويات في الأزمة الاقتصادية."
  en: "Ali and Fatima complained of the work of grinding and asked the Prophet for a servant from the captives; he refused, saying he would sell the captives and spend the price on the people of the Suffa, and then taught them the glorifications to say after each prayer and on going to bed (pp. 82-83)."
