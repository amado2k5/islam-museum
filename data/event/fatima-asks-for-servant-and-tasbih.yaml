id: event/fatima-asks-for-servant-and-tasbih
class: event
kind: other
label: { ar: "طلب فاطمة وعلي خادماً من السبي، وتعليمهما التسبيح", en: "Fatima and Ali ask for a servant and are taught the tasbih", es: "Fátima y Alí piden un sirviente y les enseñan el tasbih.", fr: "Fatima et Ali demandent un serviteur et on leur enseigne le tasbih", ur: "فاطمہ اور علی ایک نوکر مانگتے ہیں اور انہیں تسبیح پڑھائی جاتی ہے۔" }
summary:
  ar: "شكا علي وفاطمة ما يلقيانه من الطحن والعمل، وطلبا من النبي خادماً من السبي، فأبى أن يعطيهما، وقال إنه يبيع السبي وينفق أثمانه على أهل الصفة الذين لا يجد ما ينفق عليهم. ثم علّمهما التسبيح والتحميد والتكبير عند كل صلاة وعند النوم ⁦(ص 82-83)⁩. ويرى الصلابي في هذا ترتيب النبي للأولويات في الأزمة الاقتصادية."
  en: "Ali and Fatima complained of the work of grinding and asked the Prophet for a servant from the captives; he refused, saying he would sell the captives and spend the price on the people of the Suffa, and then taught them the glorifications to say after each prayer and on going to bed (pp. 82-83)."
  es: "Ali y Fátima se quejaron del trabajo de moler y le pidieron al Profeta un sirviente de entre los cautivos; él se negó, diciendo que vendería a los cautivos y gastaría el precio en la gente de Suffa, y luego les enseñó las glorificaciones que debían decir después de cada oración y antes de acostarse (págs. 82-83)."
  fr: "Ali et Fatima se plaignirent du travail de mouture et demandèrent au Prophète un serviteur parmi les captifs; il refusa, disant qu'il vendrait les captifs et dépenserait le prix pour les habitants de la Suffa, puis leur enseigna les glorifications à dire après chaque prière et au coucher (pp. 82-83)."
  ur: "علی اور فاطمہ نے پیسنے کے کام کی شکایت کی اور رسول اللہ سے قیدیوں میں سے ایک خادم مانگا۔ اس نے یہ کہتے ہوئے انکار کر دیا کہ وہ اسیروں کو بیچ کر قیمت اہلِ صفہ پر خرچ کرے گا، اور پھر انہیں ہر نماز کے بعد اور سونے کے وقت تسبیح پڑھائی ⁦(صفحہ 82-83)⁩۔"
