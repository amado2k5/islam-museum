id: event/al-hadi-at-najran-restoring-wrongs-and-protecting-crops
class: event
kind: other
label:
  ar: ردّ المظالم في نجران ومنع العسكر من الزروع والثمار
  en: Wrongs restored at Najran and the army forbidden to touch crops and fruit
  ur: نجران میں مظالم کی واپسی اور لشکر کو کھیتوں اور پھلوں سے روکنا
  es: "Se repararon los daños causados en Najrán y se prohibió al ejército tocar los cultivos y las frutas."
  fr: "Les injustices ont été réparées à Najran et l'armée a interdiction de toucher aux récoltes et aux fruits."
  tr: "Najran'daki şikayetlerin giderilmesi ve ordunun mahsul ve meyve hasadının engellenmesi"
  id: "Menangani keluhan di Najran dan mencegah militer memanen tanaman dan buah-buahan."
summary:
  ar: بعد قراءة كتاب الهادي رد أهل نجران بعضهم على بعض ما غصبوه من نخل وأرض وعبيد وخيل في فتنتهم، ويروي رجل منهم أنه استرد نخلاً غُصب عشر سنين؛ وركب الهادي يدور قرى نجران وأمر العسكر ألا يدخلوا الزرع ولا يفسدوا ثمار الناس، وسأل ليلاً أصحابه فلما لم يعرض أحد لشيء حمد الله.
  en: After the letter was read the people of Najran gave one another back what they had seized in their feud, palms, land, slaves and horses; one man says his palm grove, seized ten years before, was returned; al-Hadi rode round the Najran villages and ordered the army not to enter crops or spoil people's fruit, and asked at night whether anyone had touched any, and on hearing no, praised God.
  ur: خط پڑھے جانے کے بعد اہل نجران نے آپس میں جو کچھ فتنے میں غصب کیا تھا، کھجوریں، زمین، غلام اور گھوڑے، ایک دوسرے کو لوٹا دیا؛ ایک شخص بتاتا ہے کہ دس سال پہلے غصب ہوا اس کا باغ لوٹا؛ ہادی نجران کی بستیوں میں گھومے اور لشکر کو حکم دیا کہ کھیتوں میں نہ جائیں اور لوگوں کے پھل نہ بگاڑیں، اور رات کو پوچھا کہ کسی نے کچھ چھیڑا؟ جواب نہیں ملا تو اللہ کا شکر کیا۔
  es: "Tras la lectura de la carta, los habitantes de Najrán se devolvieron mutuamente lo que se habían arrebatado en su disputa: palmeras, tierras, esclavos y caballos. Un hombre afirma que le devolvieron su palmeral, confiscado diez años antes. Al-Hadi recorrió las aldeas de Najrán y ordenó al ejército que no entrara en los cultivos ni estropeara la fruta de la gente, y por la noche preguntaba si alguien había tocado algo, y al oír que no, alababa a Dios."
  fr: "Après la lecture de la lettre, les habitants de Najran se rendirent mutuellement ce qu'ils avaient pris lors de leur querelle: palmiers, terres, esclaves et chevaux; un homme raconte que sa palmeraie, saisie dix ans auparavant, lui fut restituée; al-Hadi parcourut les villages de Najran et ordonna à l'armée de ne pas toucher aux récoltes ni d'abîmer les fruits des habitants, et demanda la nuit si quelqu'un y avait touché, et n'entendant que non, il loua Dieu."
  tr: "El-Hadi'nin kitabını okuduktan sonra, Necran halkı, çatışma sırasında ele geçirdikleri hurma ağaçlarını, toprakları, köleleri ve atları birbirlerine geri verdiler. Onlardan biri, on yıldır el konulmuş olan hurma ağaçlarını geri aldığını anlatır. El-Hadi, Necran köylerini dolaştı ve orduya ekinlere girmemelerini ve halkın meyvelerine zarar vermemelerini emretti. Geceleyin arkadaşlarına sordu ve kimse bir şey yapmayınca Allah'a şükretti."
  id: "Setelah membaca buku Al-Hadi, penduduk Najran saling mengembalikan apa yang telah mereka rampas berupa pohon kurma, tanah, budak, dan kuda selama perselisihan mereka. Salah seorang dari mereka menceritakan bahwa ia berhasil mendapatkan kembali pohon kurma yang telah dirampas selama sepuluh tahun. Al-Hadi berkeliling desa-desa di Najran dan memerintahkan pasukan untuk tidak memasuki ladang atau merusak buah-buahan milik penduduk. Ia bertanya kepada para sahabatnya di malam hari, dan ketika tidak ada seorang pun yang melakukan apa pun, ia memuji Tuhan."
