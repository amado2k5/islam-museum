id: event/al-hadi-at-najran-restoring-wrongs-and-protecting-crops
class: event
kind: other
label:
  ar: ردّ المظالم في نجران ومنع العسكر من الزروع والثمار
  en: Wrongs restored at Najran and the army forbidden to touch crops and fruit
  ur: نجران میں مظالم کی واپسی اور لشکر کو کھیتوں اور پھلوں سے روکنا
summary:
  ar: بعد قراءة كتاب الهادي رد أهل نجران بعضهم على بعض ما غصبوه من نخل وأرض وعبيد وخيل في فتنتهم، ويروي رجل منهم أنه استرد نخلاً غُصب عشر سنين؛ وركب الهادي يدور قرى نجران وأمر العسكر ألا يدخلوا الزرع ولا يفسدوا ثمار الناس، وسأل ليلاً أصحابه فلما لم يعرض أحد لشيء حمد الله.
  en: After the letter was read the people of Najran gave one another back what they had seized in their feud, palms, land, slaves and horses; one man says his palm grove, seized ten years before, was returned; al-Hadi rode round the Najran villages and ordered the army not to enter crops or spoil people's fruit, and asked at night whether anyone had touched any, and on hearing no, praised God.
  ur: خط پڑھے جانے کے بعد اہل نجران نے آپس میں جو کچھ فتنے میں غصب کیا تھا، کھجوریں، زمین، غلام اور گھوڑے، ایک دوسرے کو لوٹا دیا؛ ایک شخص بتاتا ہے کہ دس سال پہلے غصب ہوا اس کا باغ لوٹا؛ ہادی نجران کی بستیوں میں گھومے اور لشکر کو حکم دیا کہ کھیتوں میں نہ جائیں اور لوگوں کے پھل نہ بگاڑیں، اور رات کو پوچھا کہ کسی نے کچھ چھیڑا؟ جواب نہیں ملا تو اللہ کا شکر کیا۔
