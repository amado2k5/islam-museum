  ar: "في أيام المتقي سقطت القبة الخضراء بمدينة المنصور وكانت تاج بغداد ومأثرة بني العباس وهي من بناء المنصور ارتفاعها ثمانون ذراعاً وتحتها إيوان طوله عشرون ذراعاً في عشرين ذراعاً وعليها تمثال فارس بيده رمح فإذا استقبل بوجهه علم أن خارجياً يظهر من تلك الجهة فسقط رأس هذه القبة في ليلة ذات مطر ورعد {cite:tarikh-khulafa-minhaj-1434 p. 608}."
  en: "In al-Muttaqi's days the Green Dome of al-Mansur's city fell — Baghdad's crown and the Abbasids' monument, eighty cubits high over a twenty-by-twenty-cubit iwan, topped by a mounted lancer whose facing direction foretold a rebel's rise. Its head fell on a night of rain and thunder {cite:tarikh-khulafa-minhaj-1434 p. 608}."
