label: { ar: "سقوط القبة الخضراء", en: "The Fall of the Green Dome", es: "La caída de la Cúpula Verde", fr: "La chute du dôme vert" }
summary:
  ar: "في أيام المتقي سقطت القبة الخضراء بمدينة المنصور وكانت تاج بغداد ومأثرة بني العباس وهي من بناء المنصور ارتفاعها ثمانون ذراعاً وتحتها إيوان طوله عشرون ذراعاً في عشرين ذراعاً وعليها تمثال فارس بيده رمح فإذا استقبل بوجهه علم أن خارجياً يظهر من تلك الجهة فسقط رأس هذه القبة في ليلة ذات مطر ورعد {cite:tarikh-khulafa-minhaj-1434 p. 608}."
  en: "In al-Muttaqi's days the Green Dome of al-Mansur's city fell — Baghdad's crown and the Abbasids' monument, eighty cubits high over a twenty-by-twenty-cubit iwan, topped by a mounted lancer whose facing direction foretold a rebel's rise. Its head fell on a night of rain and thunder {cite:tarikh-khulafa-minhaj-1434 p. 608}."
  es: "En tiempos de al-Muttaqi, la Cúpula Verde de la ciudad de al-Mansur se derrumbó: la corona de Bagdad y el monumento de los abasíes, de ochenta codos de altura sobre un iwan de veinte por veinte codos, coronado por un lancero a caballo cuya dirección presagiaba el ascenso de un rebelde. Su cabeza cayó en una noche de lluvia y truenos {cite:tarikh-khulafa-minhaj-1434 p. 608}."
  fr: "Sous le règne d'al-Muttaqi, le Dôme Vert de la ville d'al-Mansur s'écroula — la couronne de Bagdad et le monument des Abbassides, haut de quatre-vingts coudées, dominant un iwan de vingt coudées sur vingt, surmonté d'un lancier monté dont la direction présageait le soulèvement d'une rébellion. Sa tête tomba une nuit de pluie et de tonnerre {cite:tarikh-khulafa-minhaj-1434 p. 608}."
