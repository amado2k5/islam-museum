id: event/delegation-of-dimam-ibn-thalaba
class: event
kind: gathering
label: { ar: "قدوم ضمام بن ثعلبة وافداً عن بني سعد بن بكر", en: "Dimam ibn Tha'laba comes as the envoy of Banu Sa'd ibn Bakr" }
summary:
  ar: "بعث بنو سعد بن بكر ضمام بن ثعلبة إلى النبي، فأناخ بعيره على باب المسجد ودخل فسأل: أيكم ابن عبد المطلب؟ ثم ناشده الله عن كل فريضة: أبعثك الله رسولاً؟ أأمرك أن نعبده وحده ونخلع الأنداد؟ الصلوات الخمس؟ الزكاة والصيام والحج؟ والنبي يجيب: اللهم نعم؛ فشهد الشهادتين ووعد ألا يزيد ولا ينقص، فقال النبي: إن صدق ذو العقيصتين دخل الجنة؛ ورجع فأسلم قومه في يوم واحد. إسناد ابن إسحاق إلى ابن عباس."
  en: "Banu Sa'd ibn Bakr sent Dimam ibn Tha'laba to the Prophet; he knelt his camel at the mosque door, walked in and asked which of them was Ibn Abd al-Muttalib, then adjured him by God on each duty in turn: did God send you? did He order us to worship Him alone and cast off the idols? the five prayers? zakat, fasting, hajj? and the Prophet answered each time, O God, yes. He testified, promised to add nothing and omit nothing, and the Prophet said: if the man with the two plaits is truthful he will enter Paradise; he went home and his people embraced Islam in a day. Ibn Ishaq's isnad reaches Ibn Abbas."
