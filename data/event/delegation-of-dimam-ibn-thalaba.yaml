label: { ar: "قدوم ضمام بن ثعلبة وافداً عن بني سعد بن بكر", en: "Dimam ibn Tha'laba comes as the envoy of Banu Sa'd ibn Bakr", es: "Dimam ibn Tha'laba llega como enviado de Banu Sa'd ibn Bakr", fr: "Dimam ibn Tha'laba vient en tant qu'envoyé de Banu Sa'd ibn Bakr", ur: "دیمام بن ثعلبہ بنو سعد بن بکر کے ایلچی کے طور پر آتے ہیں۔", tr: "Dammam ibn Sa'labah'ın Banu Sa'd ibn Bekr'den delege olarak gelişi", id: "Kedatangan Dhammam ibn Tha'labah sebagai utusan dari Bani Sa'd ibn Bakr" }
summary:
  ar: "بعث بنو سعد بن بكر ضمام بن ثعلبة إلى النبي، فأناخ بعيره على باب المسجد ودخل فسأل: أيكم ابن عبد المطلب؟ ثم ناشده الله عن كل فريضة: أبعثك الله رسولاً؟ أأمرك أن نعبده وحده ونخلع الأنداد؟ الصلوات الخمس؟ الزكاة والصيام والحج؟ والنبي يجيب: اللهم نعم؛ فشهد الشهادتين ووعد ألا يزيد ولا ينقص، فقال النبي: إن صدق ذو العقيصتين دخل الجنة؛ ورجع فأسلم قومه في يوم واحد. إسناد ابن إسحاق إلى ابن عباس."
  en: "Banu Sa'd ibn Bakr sent Dimam ibn Tha'laba to the Prophet; he knelt his camel at the mosque door, walked in and asked which of them was Ibn Abd al-Muttalib, then adjured him by God on each duty in turn: did God send you? did He order us to worship Him alone and cast off the idols? the five prayers? zakat, fasting, hajj? and the Prophet answered each time, O God, yes. He testified, promised to add nothing and omit nothing, and the Prophet said: if the man with the two plaits is truthful he will enter Paradise; he went home and his people embraced Islam in a day. Ibn Ishaq's isnad reaches Ibn Abbas."
  es: "Banu Sa'd ibn Bakr envió a Dimam ibn Tha'laba al Profeta; este se arrodilló con su camello en la puerta de la mezquita, entró y preguntó quién de ellos era Ibn Abd al-Muttalib, luego lo interpeló por Dios sobre cada deber por turno: ¿Te envió Dios? ¿Nos ordenó adorarlo solo a Él y desechar los ídolos? ¿Las cinco oraciones? ¿El zakat, el ayuno, el hajj? Y el Profeta respondió cada vez, Oh Dios, sí. Testificó, prometió no añadir ni omitir nada, y el Profeta dijo: Si el hombre de las dos trenzas es veraz, entrará en el Paraíso; regresó a casa y su gente abrazó el Islam en un día. El isnad de Ibn Ishaq llega a Ibn Abbas."
  fr: "Les Banu Sa'd ibn Bakr envoyèrent Dimam ibn Tha'laba auprès du Prophète. Celui-ci agenouillét son chameau devant la porte de la mosquée, entra et demanda lequel d'entre eux était Ibn Abd al-Muttalib, puis l'exhorta, au nom de Dieu, à accomplir chaque devoir: « Dieu t'a-t-il envoyé ? Nous a-t-Il ordonné de L'adorer Lui seul et de nous détourner des idoles ? Les cinq prières ? La zakat, le jeûne, le hajj ? » Le Prophète répondit à chaque fois: « Ô Dieu, oui. » Il témoigna, promit de ne rien ajouter ni rien omettre, et le Prophète dit: « Si l'homme aux deux tresses est véridique, il entrera au Paradis. » Il rentra chez lui et son peuple se convertit à l'islam le jour même. La lignée d'Ibn Ishaq remonte jusqu'à Ibn Abbas."
  ur: "بنو سعد بن بکر نے دمام بن ثعلبہ کو نبی کے پاس بھیجا۔ اس نے مسجد کے دروازے پر اونٹ کو گھٹنے ٹیک دیا، اندر داخل ہوا اور پوچھا کہ ابن عبدالمطلب ان میں سے کون ہے، پھر اسے خدا کی طرف سے ہر ایک فرض پر باری باری کہا: کیا خدا نے تمہیں بھیجا ہے؟ کیا اس نے ہمیں صرف اسی کی عبادت کرنے اور بتوں کو پھینکنے کا حکم دیا؟ پانچ نمازیں؟ زکوٰۃ، روزہ، حج؟ اور نبی نے ہر بار جواب دیا، اے خدا، ہاں۔ اس نے گواہی دی، کچھ نہ بڑھانے اور کچھ نہ چھوڑنے کا وعدہ کیا، اور نبی نے فرمایا: اگر دو تختوں والا آدمی سچا ہے تو وہ جنت میں جائے گا۔ وہ گھر چلا گیا اور اس کی قوم نے ایک دن میں اسلام قبول کر لیا۔ ابن اسحاق کی سند ابن عباس تک پہنچتی ہے۔"
  tr: "Beni Sa'd ibn Bekr kabilesi, Zemâm ibn Tha'labe'yi Peygamber'e gönderdi. Devesini mescidin kapısına bağladı ve içeri girerek, \"Abdül-Muttalib'in oğlu hanginizdir?\" diye sordu. Sonra Allah adına her türlü dini yükümlülük için yemin ettirdi: \"Allah seni elçi olarak mı gönderdi? Yalnızca kendisine ibadet etmeni ve bütün putlardan vazgeçmeni mi emretti? Beş vakit namazı, zekâtı, orucu ve haccı mı?\" Peygamber, \"Evet, Allah'a yemin ederim\" diye cevap verdi. Zemâm daha sonra iki şahitlik sözü okudu ve bunlara hiçbir şey eklemeyeceğine veya çıkarmayacağına söz verdi. Peygamber, \"İki örgülü olan doğru sözlü ise cennete girecektir\" dedi. Geri döndü ve kavmi bir günde İslam'ı kabul etti. (İbn İshak, İbn Abbas'tan rivayet etmiştir.)"
  id: "Suku Banu Sa'd ibn Bakr mengutus Dhamam ibn Tha'labah kepada Nabi. Ia mengikat untanya di pintu masjid dan masuk, lalu bertanya, \"Siapakah di antara kalian yang merupakan putra Abd al-Muttalib?\" Kemudian ia bersumpah demi Allah mengenai setiap kewajiban agama: \"Apakah Allah mengutusmu sebagai utusan? Apakah Dia memerintahkanmu untuk menyembah-Nya saja dan meninggalkan semua berhala? Shalat lima waktu? Zakat, puasa, dan haji?\" Nabi menjawab, \"Ya, demi Allah.\" Kemudian Dhamam membacakan dua syahadat dan berjanji untuk tidak menambah atau mengurangi keduanya. Nabi bersabda, \"Jika orang yang memiliki dua kepang rambut itu jujur, maka ia akan masuk surga.\" Ia kembali, dan kaumnya memeluk Islam dalam satu hari. (Diriwayatkan oleh Ibnu Ishaq dari Ibnu Abbas.)"
