summary:
  ar: "يوم الجمعة سادس صفر سنة 1226هـ استدعى محمد علي باشا أمراء المماليك المصريين وأتباعهم إلى القلعة لموكب إلباس ابنه طوسون خلعة السفر إلى الحجاز، فلما انحدر الموكب أُغلق باب العزب عليهم في المضيق وأُطلق عليهم الرصاص، ثم تتبعهم العسكر في البيوت؛ ويقول الجبرتي إنه قُتل في هذه الحادثة أكثر من ألف إنسان، وإنها «من أشنع الحوادث التي لم يتفق مثلها» {cite:ajaib-al-athar-moreh-2013-v4 p.176} {cite:ajaib-al-athar-moreh-2013-v4 p.177} {cite:ajaib-al-athar-moreh-2013-v4 p.181}."
  en: "On Friday 6 Safar 1226 AH Muhammad Ali Pasha summoned the Mamluk amirs of Egypt and their followers to the Citadel for the procession investing his son Tusun as commander of the expedition to the Hijaz; as the procession went down, the Azab gate was shut on them in the narrow passage and they were shot, and the troops then hunted them through the houses. Al-Jabarti says that more than a thousand people were killed and that it was 'among the most hideous events, the like of which never happened'."
