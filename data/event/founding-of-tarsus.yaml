label: { ar: "بناء طرسوس", en: "The Building of Tarsus", es: "La construcción de Tarso", fr: "Le bâtiment de Tarse", ur: "ٹارسس کی عمارت", tr: "Tarsus İnşaat", id: "Konstruksi Tarsus" }
summary:
  ar: "عند البلاذري عن الواقدي: غزا الحسن بن قحطبة الطائي بلاد الروم سنة 162 في أهل خراسان وأهل الموصل والشام وأمداد اليمن ومطوعة العراق والحجاز خارجاً مما يلي طرسوس، فأخبر المهدي بما في بنائها وتحصينها وشحنتها بالمقاتلة من عظيم الغناء عن الإسلام والكبت للعدو والوقم له، وكان الحسن قد أبلى في تلك الغزاة بلاءً حسناً ودوّخ أرض الروم حتى سموه الشيطان؛ ولما خرج من بلاد الروم نزل مرج طرسوس فركب إلى مدينتها وهي خراب فنظر إليها وأطاف بها من جميع جهاتها وحزر عدة من يسكنها فوجدهم مائة ألف، فلما قدم على المهدي وصف له أمرها وأخبره في الحدث أيضاً بخبر رغبه في بنائها فأمره ببناء طرسوس وأن يبدأ بمدينة الحدث فبُنيت وأوصى المهدي ببناء طرسوس؛ فلما كانت سنة 171 بلغ الرشيد أن الروم ائتمروا بينهم بالخروج إلى طرسوس لتحصينها وترتيب المقاتلة فيها فأغزى الصائفة سنة 171 هرثمة بن أعين وأمره بعمارتها وبنائها وتحصينها ففعل، وأجرى أمرها على يد فرج بن سليم الخادم بأمر الرشيد فوكّل فرج ببنائها وقدجه أبو سليم إلى مدينة السلام فأشخص الندبة الأولى من أهل خراسان وهم ثلاثة آلاف رجل فوردوا طرسوس ثم أشخص الندبة الثانية وهم ألفا رجل ألف من أهل المصيصة وألف من أهل أنطاكية على زيادة عشرة دنانير لكل رجل من أصل عطائه فعسكروا مع الندبة الأولى بالمدائن على باب الجهاد في مستهل المحرم سنة 172 إلى أن استتم بناء طرسوس وتحصينها وبناء مسجدها، ومسح فرج ما بين النهر إلى النهر فبلغ أربعة آلاف خطة كل خطة عشرون ذراعاً في مثلها وأقطع أهل طرسوس الخطط وسكنتها الندبتان في شهر ربيع الآخر سنة 172؛ وكان عبد الملك بن صالح استعمل عليها يزيد بن مخلد الفزاري فطرده من بها أهل خراسان واستوحشوا منه للهبيرية فاستخلف أبا الفوارس فأقره سنة 170 ونيف."
  en: "In al-Baladhuri from al-Waqidi: al-Hasan ibn Qahtaba al-Ta'i raided Byzantine lands in year 162 with the men of Khurasan, Mosul and Syria, Yemenite reinforcements and the volunteers of Iraq and the Hijaz, setting out by way of Tarsus, and reported to al-Mahdi the great benefit for Islam in building, fortifying and manning it and the check and vexation it would give the enemy — al-Hasan having fought so well on that raid and harried the Byzantine land that they named him the Shaytan; coming out of Byzantine territory he camped at Tarsus's meadow and rode to the ruined city, circling it on every side and reckoning its capacity at a hundred thousand; he described it to al-Mahdi and likewise told him of al-Hadath, rousing him to build it, so al-Mahdi ordered him to build Tarsus beginning with al-Hadath city, which was built, and charged him with Tarsus; in year 171 al-Rashid heard the Byzantines had conspired to go to Tarsus to fortify and man it, so he sent the summer raid of year 171 under Harthama ibn A'yan ordering him to settle, build and fortify it, putting the work in the hands of Faraj ibn Sulaym the eunuch at his command, and Abu Sulaym marched him to Madinat al-Salam whence he mustered the first levy of Khurasanis — three thousand men — who entered Tarsus, then a second levy of two thousand — a thousand of Masisa's people and a thousand of Antioch's, each man on a ten-dinar increase over his pay — who camped with the first levy at al-Mada'in at the Jihad gate at the opening of Muharram year 172 until Tarsus's building, fortification and mosque were complete; Faraj surveyed from river to river four thousand lots, each twenty cubits square, granted the Tarsusis their lots, and the two levies settled it in Rabi' II year 172; Abd al-Malik ibn Salih had appointed Yazid ibn Makhlad al-Fazari over it, whom the Khurasanis expelled in resentment for the Hubayriyya, and Abu al-Fawaris replaced him, confirmed in 170-and-odd."
  es: "En al-Baladhuri de al-Waqidi: al-Hasan ibn Qahtaba al-Ta'i asaltó tierras bizantinas en el año 162 con los hombres de Jorasán, Mosul y Siria, refuerzos yemenitas y los voluntarios de Irak y el Hiyaz, partiendo por Tarso, e informó a al-Mahdi del gran beneficio para el Islam en construir, fortificar y dotar de guarnición a la ciudad y el freno y la molestia que causaría al enemigo. Al-Hasan luchó tan bien en esa incursión y hostigó la tierra bizantina que lo llamaron el Shaytan; saliendo del territorio bizantino acampó en la pradera de Tarso y cabalgó hasta la ciudad en ruinas, rodeándola por todos lados y calculando su capacidad en cien mil hombres; Se lo describió a al-Mahdi y también le habló de al-Hadath, animándolo a construirla, así que al-Mahdi le ordenó construir Tarso comenzando por la ciudad de al-Hadath, que fue construida, y le encargó Tarso; En el año 171, al-Rashid se enteró de que los bizantinos habían conspirado para ir a Tarso a fortificarla y guarnecerla, así que envió la incursión de verano del año 171 bajo el mando de Harthama ibn A'yan, ordenándole que se estableciera, construyera y fortificara la ciudad, poniendo el trabajo en manos de Faraj ibn Sulaym, el eunuco a su mando, y Abu Sulaym lo condujo a Madinat al-Salam desde donde reunió el primer contingente de Jorasánidas —tres mil hombres— que entraron en Tarso, luego un segundo contingente de dos mil —mil de la gente de Masisa y mil de Antioquía, cada hombre con un aumento de diez dinares sobre su paga— que acamparon con el primer contingente en al-Mada'in, en la puerta de la Yihad, al comienzo de Muharram del año 172, hasta que se completó la construcción, fortificación y mezquita de Tarso; Faraj midió de río a río cuatro mil lotes, cada uno de veinte codos cuadrados, otorgó a los Tarsusis sus lotes, y los dos grupos lo establecieron en Rabi' II año 172; Abd al-Malik ibn Salih había nombrado a Yazid ibn Makhlad al-Fazari para que lo administrara, a quien los Khurasanis expulsaron en resentimiento por los Hubayriyya, y Abu al-Fawaris lo reemplazó, confirmado en el año 170 y pico."
  fr: "Dans al-Baladhuri d'après al-Waqidi: al-Hasan ibn Qahtaba al-Ta'i a mené un raid sur les terres byzantines en l'an 162 avec les hommes du Khorasan, de Mossoul et de Syrie, des renforts yéménites et les volontaires d'Irak et du Hedjaz, partant par Tarse, et a rapporté à al-Mahdi le grand avantage pour l'Islam de construire, de fortifier et de peupler la ville, ainsi que le frein et la vexation qu'elle causerait à l'ennemi. al-Hasan a si bien combattu lors de ce raid et a harcelé les terres byzantines qu'ils l'ont surnommé le Shaytan. Sortant du territoire byzantin, il a campé dans la prairie de Tarse et s'est rendu à la ville en ruines, l'encerclant de tous côtés et estimant sa capacité à cent mille hommes. il la décrivit à al-Mahdi et lui parla également d'al-Hadath, l'incitant à la construire, alors al-Mahdi lui ordonna de construire Tarse en commençant par la ville d'al-Hadath, qui fut construite, et lui confia Tarse; En l'an 171, al-Rashid apprit que les Byzantins avaient conspiré pour se rendre à Tarse afin de la fortifier et de la garnir. Il envoya donc le raid d'été de l'année 171 sous le commandement de Harthama ibn A'yan, lui ordonnant de s'y installer, de la construire et de la fortifier. Il confia les travaux à Faraj ibn Sulaym, l'eunuque sous ses ordres, et Abu Sulaym le conduisit à Madinat al-Salam d'où il rassembla la première levée de Khorasanis — trois mille hommes — qui entrèrent dans Tarse, puis une seconde levée de deux mille — mille hommes de Masisa et mille d'Antioche, chaque homme recevant une augmentation de dix dinars de sa solde — qui campèrent avec la première levée à al-Mada'in, à la porte du Jihad, au début du mois de Muharram de l'an 172, jusqu'à ce que la construction, la fortification et la mosquée de Tarse soient achevées. Faraj arpenta d'une rivière à l'autre quatre mille lots, chacun de vingt coudées carrées, accorda leurs lots aux Tarsousis, et les deux levées s'y installèrent en Rabi' II de l'an 172; Abd al-Malik ibn Salih avait nommé Yazid ibn Makhlad al-Fazari à sa tête, que les Khurasanis expulsèrent par ressentiment envers les Hubayriyya, et Abu al-Fawaris le remplaça, confirmé en 170 et quelques."
  ur: "واقدی سے البلادوری میں ہے: حسن بن قحطبہ الطائی نے سنہ 162 میں خراسان، موصل اور شام، یمنی کمک اور عراق اور حجاز کے رضاکاروں کے ساتھ بازنطینی سرزمین پر چھاپہ مارا، ترسس کے راستے سے روانہ ہوئے، اور اسلام کے لیے اس کی تعمیر اور اسلام کے لیے عظیم فائدے کی اطلاع دی۔ اور اس سے دشمن کو بہت زیادہ نقصان پہنچے گا - الحسن نے اس چھاپے پر اتنی اچھی طرح سے جنگ کی اور بازنطینی سرزمین پر حملہ کیا کہ انہوں نے اس کا نام شیطان رکھ دیا۔ بازنطینی علاقے سے نکل کر اس نے ترسوس کے گھاس کے میدان میں ڈیرے ڈالے اور تباہ شدہ شہر کی طرف سوار ہو کر اس کا ہر طرف سے چکر لگایا اور اس کی گنجائش ایک لاکھ بتائی۔ اس نے اسے المہدی سے بیان کیا اور اسی طرح اسے الحادث کے بارے میں بتایا، جس نے اسے اس کی تعمیر کے لیے اکسایا، تو المہدی نے اسے الترسس کی تعمیر کا حکم دیا جس کی ابتدا الحدث شہر سے کی گئی تھی، اور اسے ترسوس کا چارج دیا۔ سنہ 171 میں الرشید نے سنا کہ بازنطینیوں نے ترسس جا کر اسے مضبوط کرنے اور اسے چلانے کی سازش کی ہے، اس لیے اس نے 171 کے موسم گرما میں حرثمہ بن عیان کی قیادت میں اسے آباد کرنے، تعمیر کرنے اور مضبوط کرنے کا حکم دیا اور یہ کام فرج ابن سلیم خواجہ سرا کے ہاتھ میں دے دیا، جب اس نے اس کے حکم پر ابو الصالح اور مرسل کو حکم دیا۔ خراسانیوں کی پہلی لیوی کو جمع کیا - تین ہزار آدمی - جو ترسس میں داخل ہوئے، پھر دو ہزار کا دوسرا ٹیکس - ایک ہزار مسیسا کے لوگوں اور ایک ہزار انطاکیہ کے، ہر ایک شخص نے اپنی تنخواہ میں دس دینار اضافہ کیا - جنہوں نے پہلی لیوی کے ساتھ المدائن میں جہاد کے دروازے پر خیمہ لگایا، محرم کے آغاز پر 172 تک مسجد کی تعمیر مکمل ہوگئی اور ترس کی تعمیر مکمل ہوگئی۔ فراج نے دریا سے دریا تک چار ہزار لاٹوں کا سروے کیا، ہر ایک بیس ہاتھ مربع، ترسوسیوں کو ان کی قرعہ اندازی دی، اور دو لیویز نے اسے ربیع II سنہ 172 میں آباد کیا۔ عبد الملک بن صالح نے اس پر یزید بن مخلد الفزاری کو مقرر کیا تھا، جسے خراسانیوں نے حبیریہ کی ناراضگی میں نکال دیا تھا، اور ابو الفوارس نے اس کی جگہ لے لی، جس کی تصدیق 170 اور طاق میں ہے۔"
  tr: "El-Baladhuri, El-Vakidi'den rivayetle şöyle demiştir: El-Hasan ibn Kahtabî, 162 yılında Horasan, Musul ve Levant halkıyla, Yemen'den takviyelerle, Irak ve Hicaz'dan gönüllülerle, Tarsus yakınlarının dışında kalan bir bölgede Roma topraklarına saldırdı. El-Mehdi'ye, bu bölgenin inşasının, tahkimatının ve savaşçılarla seferber edilmesinin İslam'a büyük fayda sağlayacağını, düşmanı bastıracağını ve caydıracağını bildirdi. El-Hasan bu saldırıda başarılı oldu ve Roma topraklarını o kadar ele geçirdi ki, ona Şeytan dediler. Roma topraklarından ayrıldığında, Tarsus ovasına indi ve harabe halindeki şehrine gitti. Şehri inceledi, her tarafını dolaştı ve içinde yaşayan insan sayısını tahmin etti; yüz bin kişi olduğunu gördü. El-Mehdi'ye geldiğinde, ona durumu anlattı ve olayı da bildirdi, ayrıca şehri inşa etme arzusunu da dile getirdi. Bunun üzerine El-Mehdi ona Tarsus'u inşa etmesini ve önce El-Hadath şehrinden başlamasını emretti. Böylece şehir inşa edildi ve El-Mehdi Tarsus'un inşasını tavsiye etti. 171 yılı geldiğinde, El-Raşid, Romalıların Tarsus'a gidip şehri tahkim etmek ve orada savaşmak için kendi aralarında komplo kurduklarını öğrendi. Bunun üzerine 171 yılının yazında Harthama bin A'yan'ı gönderdi ve ona şehri geliştirmesini, inşa etmesini ve tahkim etmesini emretti. O da öyle yaptı ve El-Raşid'in emriyle hizmetkârı Faraj bin Salim aracılığıyla işlerini yürüttü. Böylece Faraj'a şehri inşa etme görevini verdi ve Ebu Salim onu Barış Şehrine gönderdi. Böylece Horasan halkından ilk birliği gönderdi; üç bin kişiydiler ve Tarsus'a vardılar. Sonra ikinci birliği gönderdi; bunlar iki bin kişiydi, bini Mesise halkından, bini de Antakya halkından olup, her birinin maaşına on dinar zam yapılması şartıyla gönderilmişlerdi. Böylece, 172 yılının Muharrem ayının başında, Tarsus'un inşası, surlarının yapımı ve camisinin inşası tamamlanana kadar, ilk birlikle birlikte Cihad Kapısı'ndaki Medine'de kamp kurdular. Faraj, nehir ile nehir arasındaki bölgeyi ölçtü ve her biri yirmi arşın olan dört bin parsele ulaştı. Tarsus halkına bu parselleri verdi ve iki birlik 172 yılının Rebiü'l-Ahir ayında oraya yerleşti. Abdülmalik bin Salih, Yezid bin Muhallad el-Fazari'yi vali olarak atamıştı, ancak Horasan halkı onu oradan kovdu ve Hubeyriyye yüzünden ondan korktu. Böylece Ebu el-Fevaris'i halefi olarak atadı ve onu 170 yılı civarında onayladı."
  id: "Al-Baladhuri, berdasarkan riwayat Al-Waqidi, berkata: Al-Hasan ibn Qahtaba Al-Ta’i menyerbu wilayah Romawi pada tahun 162 dengan penduduk Khorasan, penduduk Mosul dan Levant, bala bantuan dari Yaman, sukarelawan dari Irak dan Hijaz, di luar wilayah dekat Tarsus. Ia memberitahu Al-Mahdi tentang manfaat besar yang akan diperoleh Islam dari pembangunan, penguatan, dan mobilisasi pasukan dengan pejuang, yang akan menekan musuh dan mencegahnya. Al-Hasan telah berhasil dalam invasi tersebut dan menaklukkan wilayah Romawi hingga mereka menyebutnya Setan. Ketika ia meninggalkan wilayah Romawi, ia pergi ke padang rumput Tarsus dan menunggang kuda ke kotanya, yang telah hancur. Ia mengamati dan mengelilinginya dari segala sisi dan memperkirakan jumlah penduduknya dan mendapati mereka berjumlah seratus ribu. Ketika ia datang kepada Al-Mahdi, ia menjelaskan situasinya kepadanya dan memberitahukan kepadanya tentang peristiwa tersebut, serta kabar tentang keinginannya untuk membangunnya. Maka Al-Mahdi memerintahkannya untuk membangun Tarsus dan memulai dengan kota Al-Hadath, sehingga kota itu dibangun dan Al-Mahdi merekomendasikan pembangunan Tarsus. Ketika tahun 171 tiba, Al-Rashid mengetahui bahwa bangsa Romawi telah bersekongkol di antara mereka sendiri untuk pergi ke Tarsus untuk membentenginya dan mengatur pertempuran di sana. Maka ia mengirim Harthama bin A'yan pada musim panas tahun 171 dan memerintahkannya untuk mengembangkan, membangun, dan membentenginya. Maka ia melakukannya, dan ia menjalankan urusannya melalui Faraj bin Salim, seorang pelayan atas perintah Al-Rashid. Maka ia mempercayakan Faraj untuk membangunnya dan Abu Salim mengirimnya ke Kota Perdamaian. Maka ia mengirim kontingen pertama dari penduduk Khorasan, yang berjumlah tiga ribu orang, dan mereka tiba di Tarsus. Kemudian ia mengirimkan kontingen kedua, yang berjumlah dua ribu orang, seribu dari penduduk Al-Masisa dan seribu dari penduduk Antiokhia, dengan syarat kenaikan sepuluh dinar untuk setiap orang dari tunjangan dasarnya. Maka mereka berkemah bersama kontingen pertama di Al-Mada’in di gerbang Jihad pada awal Muharram tahun 172 hingga pembangunan Tarsus dan bentengnya serta pembangunan masjidnya selesai. Dan Faraj mensurvei daerah antara sungai dan sungai, dan luasnya mencapai empat ribu petak, masing-masing petak berukuran dua puluh hasta kali dua puluh hasta, dan ia memberikan petak-petak itu kepada penduduk Tarsus, dan kedua kontingen itu menetap di sana pada bulan Rabi’ al-Akhir tahun 172. Abdul Malik bin Saleh telah menunjuk Yazid bin Mukhallad al-Fazari sebagai gubernur di sana, tetapi penduduk Khorasan mengusirnya dan takut kepadanya karena Hubayriyya. Maka ia menunjuk Abu al-Fawaris sebagai penggantinya dan mengukuhkannya pada tahun 170 dan beberapa bulan."
