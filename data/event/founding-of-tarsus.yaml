label: { ar: "بناء طرسوس", en: "The Building of Tarsus" }
summary:
  ar: "عند البلاذري عن الواقدي: غزا الحسن بن قحطبة الطائي بلاد الروم سنة 162 في أهل خراسان وأهل الموصل والشام وأمداد اليمن ومطوعة العراق والحجاز خارجاً مما يلي طرسوس، فأخبر المهدي بما في بنائها وتحصينها وشحنتها بالمقاتلة من عظيم الغناء عن الإسلام والكبت للعدو والوقم له، وكان الحسن قد أبلى في تلك الغزاة بلاءً حسناً ودوّخ أرض الروم حتى سموه الشيطان؛ ولما خرج من بلاد الروم نزل مرج طرسوس فركب إلى مدينتها وهي خراب فنظر إليها وأطاف بها من جميع جهاتها وحزر عدة من يسكنها فوجدهم مائة ألف، فلما قدم على المهدي وصف له أمرها وأخبره في الحدث أيضاً بخبر رغبه في بنائها فأمره ببناء طرسوس وأن يبدأ بمدينة الحدث فبُنيت وأوصى المهدي ببناء طرسوس؛ فلما كانت سنة 171 بلغ الرشيد أن الروم ائتمروا بينهم بالخروج إلى طرسوس لتحصينها وترتيب المقاتلة فيها فأغزى الصائفة سنة 171 هرثمة بن أعين وأمره بعمارتها وبنائها وتحصينها ففعل، وأجرى أمرها على يد فرج بن سليم الخادم بأمر الرشيد فوكّل فرج ببنائها وقدجه أبو سليم إلى مدينة السلام فأشخص الندبة الأولى من أهل خراسان وهم ثلاثة آلاف رجل فوردوا طرسوس ثم أشخص الندبة الثانية وهم ألفا رجل ألف من أهل المصيصة وألف من أهل أنطاكية على زيادة عشرة دنانير لكل رجل من أصل عطائه فعسكروا مع الندبة الأولى بالمدائن على باب الجهاد في مستهل المحرم سنة 172 إلى أن استتم بناء طرسوس وتحصينها وبناء مسجدها، ومسح فرج ما بين النهر إلى النهر فبلغ أربعة آلاف خطة كل خطة عشرون ذراعاً في مثلها وأقطع أهل طرسوس الخطط وسكنتها الندبتان في شهر ربيع الآخر سنة 172؛ وكان عبد الملك بن صالح استعمل عليها يزيد بن مخلد الفزاري فطرده من بها أهل خراسان واستوحشوا منه للهبيرية فاستخلف أبا الفوارس فأقره سنة 170 ونيف."
  en: "In al-Baladhuri from al-Waqidi: al-Hasan ibn Qahtaba al-Ta'i raided Byzantine lands in year 162 with the men of Khurasan, Mosul and Syria, Yemenite reinforcements and the volunteers of Iraq and the Hijaz, setting out by way of Tarsus, and reported to al-Mahdi the great benefit for Islam in building, fortifying and manning it and the check and vexation it would give the enemy — al-Hasan having fought so well on that raid and harried the Byzantine land that they named him the Shaytan; coming out of Byzantine territory he camped at Tarsus's meadow and rode to the ruined city, circling it on every side and reckoning its capacity at a hundred thousand; he described it to al-Mahdi and likewise told him of al-Hadath, rousing him to build it, so al-Mahdi ordered him to build Tarsus beginning with al-Hadath city, which was built, and charged him with Tarsus; in year 171 al-Rashid heard the Byzantines had conspired to go to Tarsus to fortify and man it, so he sent the summer raid of year 171 under Harthama ibn A'yan ordering him to settle, build and fortify it, putting the work in the hands of Faraj ibn Sulaym the eunuch at his command, and Abu Sulaym marched him to Madinat al-Salam whence he mustered the first levy of Khurasanis — three thousand men — who entered Tarsus, then a second levy of two thousand — a thousand of Masisa's people and a thousand of Antioch's, each man on a ten-dinar increase over his pay — who camped with the first levy at al-Mada'in at the Jihad gate at the opening of Muharram year 172 until Tarsus's building, fortification and mosque were complete; Faraj surveyed from river to river four thousand lots, each twenty cubits square, granted the Tarsusis their lots, and the two levies settled it in Rabi' II year 172; Abd al-Malik ibn Salih had appointed Yazid ibn Makhlad al-Fazari over it, whom the Khurasanis expelled in resentment for the Hubayriyya, and Abu al-Fawaris replaced him, confirmed in 170-and-odd."
