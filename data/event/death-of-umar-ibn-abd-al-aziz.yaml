label: { ar: "وفاة عمر بن عبد العزيز", en: "Death of Umar ibn Abd al-Aziz", es: "Muerte de Umar ibn Abd al-Aziz", fr: "Mort d'Umar ibn Abd al-Aziz", ur: "عمر بن عبدالعزیز کی وفات" }
summary:
  ar: "توفي عمر بن عبد العزيز بدير سمعان من أعمال حمص لعشر بقين وقيل لخمس بقين من رجب سنة إحدى ومئة وله تسع وثلاثون سنة وستة أشهر، وكانت وفاته بالسم لما تبرم به بنو أمية إذ شدد عليهم وانتزع من أيديهم كثيراً مما غصبوه وكان قد أهمل التحرز، وقيل إنه سأل مجاهداً ما يقول الناس فيّ فقال يقولون مسحور فقال ما أنا بمسحور وإني لأعلم الساعة التي سقيت فيها ثم دعا غلامه فاعترف أنه أعطى ألف دينار على أن يسقيه فألقاها في بيت المال وأطلقه حيث لا يراه أحد {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
  en: "Umar ibn Abd al-Aziz died at Dayr Sim'an in the district of Homs in Rajab year 101, aged thirty-nine and a half, poisoned — the Umayyads having wearied of his strictness against them and his seizure of much they had usurped, while he had let slip all self-protection; asked what people said of him, he told Mujahid they thought him bewitched but he knew the very hour the poison was given, and when his servant confessed to having taken a thousand dinars to administer it, he threw the sum into the treasury and sent him where no one would see him {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
  es: "Umar ibn Abd al-Aziz murió en Dayr Sim'an, en el distrito de Homs, en Rajab del año 101, a la edad de treinta y nueve años y medio, envenenado. Los omeyas se habían cansado de su severidad contra ellos y de la confiscación de gran parte de lo que habían usurpado, mientras que él había descuidado toda autoprotección. Al preguntarle qué decía la gente de él, le dijo a Mujahid que pensaban que estaba embrujado, pero él sabía la hora exacta en que se le administró el veneno, y cuando su sirviente confesó haber recibido mil dinares para administrárselo, arrojó la suma al tesoro y lo envió donde nadie lo viera {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
  fr: "Umar ibn Abd al-Aziz mourut à Dayr Sim'an, dans le district de Homs, en Rajab de l'an 101, à l'âge de trente-neuf ans et demi, empoisonné. Les Omeyyades, lassés de sa rigueur à leur égard et de la confiscation de nombreux biens qu'ils leur avaient usurpés, alors qu'il avait abandonné toute protection, demandèrent à Mujahid ce que les gens disaient de lui. Il raconta qu'ils le croyaient ensorcelé, mais qu'il savait précisément à quelle heure le poison avait été administré. Lorsque son serviteur avoua avoir pris mille dinars pour l'administrer, il jeta la somme au trésor et l'envoya là où personne ne le verrait. {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
  ur: "عمر بن عبدالعزیز کی وفات 101 رجب سنہ 101 میں ضلع حمص میں دیر سمعان میں ہوئی، ان کی عمر ساڑھے 33 سال تھی، زہر کھا کر - اموی ان کے خلاف اس کی سختی سے تنگ آچکے تھے اور اس کے بہت کچھ پر قبضہ کر چکے تھے، جب کہ اس نے اپنی حفاظت کو ختم کر دیا تھا۔ پوچھا کہ لوگوں نے اس کے بارے میں کیا کہا، اس نے مجاہد کو بتایا کہ وہ اسے جادوگر سمجھتے ہیں لیکن وہ جانتا تھا کہ زہر کس وقت دیا گیا تھا، اور جب اس کے خادم نے ایک ہزار دینار لینے کا اقرار کیا تو اس نے یہ رقم خزانے میں ڈال دی اور اسے بھیج دیا جہاں کوئی اسے دیکھ نہیں سکتا۔ 397-398}۔"
