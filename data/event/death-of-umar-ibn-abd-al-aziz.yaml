label: { ar: "وفاة عمر بن عبد العزيز" }
summary:
  ar: "توفي عمر بن عبد العزيز بدير سمعان من أعمال حمص لعشر بقين وقيل لخمس بقين من رجب سنة إحدى ومئة وله تسع وثلاثون سنة وستة أشهر، وكانت وفاته بالسم لما تبرم به بنو أمية إذ شدد عليهم وانتزع من أيديهم كثيراً مما غصبوه وكان قد أهمل التحرز، وقيل إنه سأل مجاهداً ما يقول الناس فيّ فقال يقولون مسحور فقال ما أنا بمسحور وإني لأعلم الساعة التي سقيت فيها ثم دعا غلامه فاعترف أنه أعطى ألف دينار على أن يسقيه فألقاها في بيت المال وأطلقه حيث لا يراه أحد {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
  en: "Umar ibn Abd al-Aziz died at Dayr Sim'an in the district of Homs in Rajab year 101, aged thirty-nine and a half, poisoned — the Umayyads having wearied of his strictness against them and his seizure of much they had usurped, while he had let slip all self-protection; asked what people said of him, he told Mujahid they thought him bewitched but he knew the very hour the poison was given, and when his servant confessed to having taken a thousand dinars to administer it, he threw the sum into the treasury and sent him where no one would see him {cite:tarikh-khulafa-minhaj-1434 p. 397-398}."
