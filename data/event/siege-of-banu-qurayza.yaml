id: event/siege-of-banu-qurayza
class: event
kind: siege
label: { en: "The Siege and Judgment of Banu Qurayza", ar: "غزوة بني قريظة" }
summary:
  en: "In Dhu al-Qa'da 5 AH (March 627 CE), immediately after the confederates withdrew, the Prophet marched on Banu Qurayza for breaking their treaty during the siege of Medina; after twenty-five nights of siege they surrendered unconditionally and accepted the arbitration of Sa'd ibn Mu'adh, who decreed the execution of the combatants and captivity of women and children."
  ar: "في ذي القعدة سنة 5هـ (مارس 627م)، إثر انصراف الأحزاب نزل جبريل يأمر النبي بالسير إلى بني قريظة لغدرهم ونقضهم ميثاق المدينة في أحلك ساعات الحصار؛ فحاصرهم المسلمون خمساً وعشرين ليلة حتى نزلوا على حكم سعد بن معاذ، فقضى بقتل مقاتلتهم وسبي ذراريهم وقسمة أموالهم. وفي الصحيح أنهم نزلوا على حكم سعد بن معاذ فقال النبي «قوموا إلى سيدكم» فحكم بقتل مقاتليهم وسبي ذراريهم فقال له «حكمت بحكم الله» {cite:sahih-al-bukhari 3804}."
