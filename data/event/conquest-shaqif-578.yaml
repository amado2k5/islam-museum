summary:
  ar: "في صفر سنة ثمان وسبعين وخمسمائة فتح المسلمون بالشام الشقيف المعروف بحبس جلدك وهو من أعمال طبرية مطل على السواد؛ وسبب فتحه أن الفرنج لما بلغهم مسير صلاح الدين من مصر إلى الشام جمعوا له وحشدوا الفارس والراجل واجتمعوا بالكرك قرب الطريق لعلهم ينتهزون فرصة أو يعوقوا المسلمين عن المسير، فخلت بلادهم من ناحية الشام، فسمع عز الدين فرخشاه الخبر فجمع عساكر الشام وقصد بلاد الفرنج فأغار عليها ونهب دبورية وما يجاورها وأسر وقتل وسبى وفتح الشقيف — وكان على المسلمين منه أذى شديد — ففرحوا به فرحاً عظيماً وأرسل إلى صلاح الدين بالبشارة فلقيه في الطريق ففتّ ذلك في عضد الفرنج وانكسرت شوكتهم {cite:kamil-ibn-al-athir p. 110-111}."
  en: "Safar 578: while the Frankish host massed at Kerak watching Saladin's march from Egypt, Izz al-Din Farrukhshah gathered the Syrian regiments and swept through the emptied Frankish lands — plundering Daburiyya and its villages — and stormed the Shaqif 'Habs Jaldak', the fortress overlooking the Sawad above Tiberias that had long tormented the Muslims; its fall broke the Franks' edge {cite:kamil-ibn-al-athir p. 110-111}."
  es: "Safar 578: mientras el ejército franco se concentraba en Kerak observando la marcha de Saladino desde Egipto, Izz al-Din Farrukhshah reunió a los regimientos sirios y arrasó las tierras francas deshabitadas, saqueando Daburiyya y sus aldeas, y asaltó el Shaqif 'Habs Jaldak', la fortaleza que dominaba el Sawad sobre Tiberíades y que durante mucho tiempo había atormentado a los musulmanes; su caída quebró la línea de defensa de los francos {cite:kamil-ibn-al-athir p. 110-111}."
  fr: "Safar 578: tandis que l'armée franque se massait à Kerak en observant la marche de Saladin depuis l'Égypte, Izz al-Din Farrukhshah rassembla les régiments syriens et traversa les terres franques vidées — pillant Daburiyya et ses villages — et prit d'assaut le Shaqif 'Habs Jaldak', la forteresse surplombant le Sawad au-dessus de Tibériade qui avait longtemps tourmenté les musulmans; sa chute brisa l'avancée des Francs {cite:kamil-ibn-al-athir p. 110-111}."
  ur: "صفر 578: جب فرانکش میزبان مصر سے صلاح الدین کے مارچ کو دیکھ کر کیرک میں جمع ہوئے، عزالدین فرخشاہ نے شامی رجمنٹوں کو اکٹھا کیا اور خالی فرینک کی سرزمینوں میں گھس کر - دابوریہ اور اس کے دیہاتوں کو لوٹ لیا - اور شکیف پر دھاوا بول دیا، جس پر ساقف کے حبس جلاد کے لیے صلوٰۃ کے لوگ تھے۔ مسلمانوں کو طویل عرصے تک عذاب میں اس کے زوال نے فرینکس کے کنارے کو توڑ دیا {حوالہ: کامل ابن الاثیر صفحہ 110-111}۔"
  tr: "Hicri 578 yılının Safer ayında, Levant'taki Müslümanlar, Taberiye bölgesinin bir parçası olan ve Sawad Nehri'ne bakan Habas Celdak olarak da bilinen Şakif'i fethettiler. Fethin sebebi, Frankların Selahaddin'in Mısır'dan Levant'a doğru yürüyüşünü öğrenince, Müslümanların yürüyüşünü engellemek veya fırsat yakalamak umuduyla süvari ve piyadelerini toplayıp yol kenarındaki Karak'ta bir araya gelmeleriydi. Böylece toprakları Levant yönünden boşaltılmıştı. İzzüldin Farrukhşah haberi duyunca, Levant ordularını topladı ve Frank topraklarına doğru yola çıktı. Onlara baskın düzenledi, Daburiyya ve çevresini yağmaladı, esir aldı, öldürdü ve Müslümanlara büyük zarar vermiş olan Şakif'i fethetti; bu da Müslümanları çok sevindirdi. İyi haberi Selahaddin'e iletti, Selahaddin yolda onunla karşılaştı ve bu, Frankların azmini zayıflattı ve güçlerini kırdı. {alıntı: kamil-ibn-el-esir s. 110-111}"
  id: "Pada bulan Safar tahun 578 H, kaum Muslim di Levant menaklukkan Shaqif, yang dikenal sebagai Habas Jaldak, yang merupakan bagian dari distrik Tiberias dan menghadap ke Sungai Sawad. Alasan penaklukannya adalah ketika bangsa Frank mengetahui tentang perjalanan Saladin dari Mesir ke Levant, mereka mengumpulkan pasukan kavaleri dan infanteri mereka dan berkumpul di Karak dekat jalan, dengan harapan dapat merebut kesempatan atau menghalangi perjalanan kaum Muslim. Dengan demikian, wilayah mereka dikosongkan dari arah Levant. Ketika Izz al-Din Farrukhshah mendengar berita itu, ia mengumpulkan pasukan Levant dan menuju ke wilayah bangsa Frank. Ia menyerang mereka, menjarah Daburiyya dan sekitarnya, menangkap, membunuh, dan menawan orang, serta menaklukkan Shaqif—yang telah menyebabkan kerugian besar bagi kaum Muslim—sehingga mereka sangat gembira. Ia mengirimkan kabar baik itu kepada Saladin, yang bertemu dengannya di jalan, dan ini melemahkan tekad bangsa Frank dan menghancurkan kekuatan mereka. {mengutip: kamil-ibn-al-athir hal. 110-111}"
