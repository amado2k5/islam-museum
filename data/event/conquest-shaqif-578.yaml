label: { ar: "فتح الشقيف حبس جلدك", en: "The capture of Shaqif Habs Jaldak (Beaufort, 578 AH)" }
summary:
  ar: "في صفر سنة ثمان وسبعين وخمسمائة فتح المسلمون بالشام الشقيف المعروف بحبس جلدك وهو من أعمال طبرية مطل على السواد؛ وسبب فتحه أن الفرنج لما بلغهم مسير صلاح الدين من مصر إلى الشام جمعوا له وحشدوا الفارس والراجل واجتمعوا بالكرك قرب الطريق لعلهم ينتهزون فرصة أو يعوقوا المسلمين عن المسير، فخلت بلادهم من ناحية الشام، فسمع عز الدين فرخشاه الخبر فجمع عساكر الشام وقصد بلاد الفرنج فأغار عليها ونهب دبورية وما يجاورها وأسر وقتل وسبى وفتح الشقيف — وكان على المسلمين منه أذى شديد — ففرحوا به فرحاً عظيماً وأرسل إلى صلاح الدين بالبشارة فلقيه في الطريق ففتّ ذلك في عضد الفرنج وانكسرت شوكتهم {cite:kamil-ibn-al-athir p. 110-111}."
  en: "Safar 578: while the Frankish host massed at Kerak watching Saladin's march from Egypt, Izz al-Din Farrukhshah gathered the Syrian regiments and swept through the emptied Frankish lands — plundering Daburiyya and its villages — and stormed the Shaqif 'Habs Jaldak', the fortress overlooking the Sawad above Tiberias that had long tormented the Muslims; its fall broke the Franks' edge {cite:kamil-ibn-al-athir p. 110-111}."
