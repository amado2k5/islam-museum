id: event/ibn-musbih-congratulates-al-hadi-and-the-spoils-of-al-numays-287
class: event
kind: other
label:
  ar: "ابن مصبح يهنئ الهادي بعلاف ونهب النميص، رمضان 287هـ"
  en: "Ibn Musbih congratulates al-Hadi at Allaf and the spoils of al-Numays, Ramadan 287 AH"
  ur: "ابن مصبح کی علاف میں ہادی کو مبارک باد اور النمیص کا مال، رمضان 287ھ"
summary:
  ar: "يأتي محمد بن مصبح اليرسمي الهادي بعلاف فيحمد الله على نصره ويقول إن رأيه في الحرب بدا لهم خطلاً، ويذكر الراوي ما قيل عن لوم الأكيليين لأحمد بن عباد، ثم ينهب أصحاب الهادي أثاث النميص وسلاحه ويقطع الأعناب ويبقى الهادي بعلاف إلى العصر."
  en: "At Allaf Muhammad ibn Musbih al-Yarsami thanks God for al-Hadi's victory and says his plan had seemed mistaken to them; the narrator reports what was said of the Akilis' reproach to Ahmad ibn Abbad, then al-Hadi's men take furniture and arms from al-Numays and the vines are cut, and he stays at Allaf until the afternoon."
  ur: "علاف میں محمد بن مصبح یرسمی ہادی کی فتح پر اللہ کی حمد کرتے ہیں اور کہتے ہیں کہ ان کی تدبیر انہیں غلط لگی تھی؛ راوی اکیلیوں کی احمد بن عباد پر ملامت کا ذکر کرتا ہے، پھر ہادی کے ساتھی النمیص سے سامان اور اسلحہ لیتے ہیں، انگور کی بیلیں کاٹی جاتی ہیں اور ہادی عصر تک علاف میں ٹھہرتے ہیں۔"
