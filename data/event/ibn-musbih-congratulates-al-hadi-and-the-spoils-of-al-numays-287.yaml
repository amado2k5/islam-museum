id: event/ibn-musbih-congratulates-al-hadi-and-the-spoils-of-al-numays-287
class: event
kind: other
label:
  ar: "ابن مصبح يهنئ الهادي بعلاف ونهب النميص، رمضان 287هـ"
  en: "Ibn Musbih congratulates al-Hadi at Allaf and the spoils of al-Numays, Ramadan 287 AH"
  ur: "ابن مصبح کی علاف میں ہادی کو مبارک باد اور النمیص کا مال، رمضان 287ھ"
  es: "Ibn Musbih felicita a al-Hadi en Allaf y por el botín de al-Numays, Ramadán 287 AH."
  fr: "Ibn Musbih félicite al-Hadi à Allaf et pour le butin d'al-Numays, Ramadan 287 AH"
  tr: "İbn Musbah, Al-Hadi'yi Al-Numays'ın zaferi ve yağmalanmasından dolayı tebrik ediyor, Ramazan 287 H."
  id: "Ibnu Musbah mengucapkan selamat kepada Al-Hadi atas kemenangan dan penjarahan Al-Numays, Ramadhan 287 H."
summary:
  ar: "يأتي محمد بن مصبح اليرسمي الهادي بعلاف فيحمد الله على نصره ويقول إن رأيه في الحرب بدا لهم خطلاً، ويذكر الراوي ما قيل عن لوم الأكيليين لأحمد بن عباد، ثم ينهب أصحاب الهادي أثاث النميص وسلاحه ويقطع الأعناب ويبقى الهادي بعلاف إلى العصر."
  en: "At Allaf Muhammad ibn Musbih al-Yarsami thanks God for al-Hadi's victory and says his plan had seemed mistaken to them; the narrator reports what was said of the Akilis' reproach to Ahmad ibn Abbad, then al-Hadi's men take furniture and arms from al-Numays and the vines are cut, and he stays at Allaf until the afternoon."
  ur: "علاف میں محمد بن مصبح یرسمی ہادی کی فتح پر اللہ کی حمد کرتے ہیں اور کہتے ہیں کہ ان کی تدبیر انہیں غلط لگی تھی؛ راوی اکیلیوں کی احمد بن عباد پر ملامت کا ذکر کرتا ہے، پھر ہادی کے ساتھی النمیص سے سامان اور اسلحہ لیتے ہیں، انگور کی بیلیں کاٹی جاتی ہیں اور ہادی عصر تک علاف میں ٹھہرتے ہیں۔"
  es: "En Allaf, Muhammad ibn Musbih al-Yarsami da gracias a Dios por la victoria de al-Hadi y dice que su plan les había parecido erróneo; el narrador relata lo que se dijo sobre el reproche de los Akilis a Ahmad ibn Abbad, luego los hombres de al-Hadi toman muebles y armas de al-Numays y se cortan las vides, y él permanece en Allaf hasta la tarde."
  fr: "À Allaf, Muhammad ibn Musbih al-Yarsami remercie Dieu pour la victoire d'al-Hadi et dit que son plan leur avait semblé erroné; le narrateur rapporte ce qui a été dit du reproche des Akilis à Ahmad ibn Abbad, puis les hommes d'al-Hadi prennent des meubles et des armes à al-Numays et les vignes sont coupées, et il reste à Allaf jusqu'à l'après-midi."
  tr: "Muhammed bin Musbah el-Yarsami el-Hadi Ba'laf gelir ve zaferinden dolayı Allah'a şükreder ve savaş hakkındaki görüşünün onlara yanlış göründüğünü söyler. Anlatıcı, Akililerin Ahmed bin Abbad'ı suçlamasıyla ilgili söylenenleri aktarır. Ardından el-Hadi'nin arkadaşları el-Numais'in mobilyalarını ve silahlarını yağmalarlar, üzüm bağlarını keserler ve el-Hadi Ba'laf öğleden sonraya kadar orada kalır."
  id: "Muhammad bin Musbah al-Yarsami al-Hadi Ba’laf datang dan memuji Tuhan atas kemenangannya dan mengatakan bahwa pendapatnya tentang perang ternyata keliru bagi mereka. Perawi menyebutkan apa yang dikatakan tentang tuduhan kaum Akilis terhadap Ahmad bin Abbad. Kemudian para sahabat al-Hadi menjarah perabotan dan senjata al-Numais dan menebang tanaman anggur, dan al-Hadi Ba’laf tetap tinggal sampai siang hari."
