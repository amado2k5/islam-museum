class: event
kind: siege
label: { ar: "أخذ مسلم بن قريش حران وقتل قاضيها", en: "Muslim ibn Quraysh takes Harran and kills its qadi", es: "Muslim ibn Quraysh toma Harran y mata a su cadí.", fr: "Muslim ibn Quraysh prend Harran et tue son cadi", ur: "مسلم بن قریش نے حران کو پکڑ لیا اور اس کے قاضی کو قتل کر دیا۔" }
summary:
  ar: "في سنة ست وسبعين وأربعمائة عزم أهل حران وقاضيهم ابن جلبة الحنبلي على تسليم حران إلى جنق أمير التركمان لكونه سنياً وعصوا على مسلم بن قريش صاحب الموصل لكونه رافضياً ولكونه مشغولاً بمحاصرة دمشق مع المصريين، وكانوا يحاصرون بها تاج الدولة تتش، فأسرع مسلم إلى حران ورماها بالمجانيق وأخذها وذبح القاضي وولديه {cite:shadharat-dhahab p. 350}."
  en: "In 476 Harran's people and their Hanbali qadi Ibn Julba resolved to hand the city to Janaq the Turkman amir — a Sunni — defying Muslim b. Quraysh, lord of Mosul, whom they counted a Rafidi and who was busy besieging Damascus with the Egyptians against Taj al-Dawla Tutush; Muslim raced to Harran, flung mangonels at it, took it, and slaughtered the qadi and his two sons {cite:shadharat-dhahab p. 350}."
  es: "En 476, la gente de Harran y su cadí hanbalí Ibn Julba decidieron entregar la ciudad a Janaq, el emir turcomano —un sunita— desafiando a Muslim b. Quraysh, señor de Mosul, a quien consideraban un rafidí y que estaba ocupado sitiando Damasco con los egipcios contra Taj al-Dawla Tutush; Muslim corrió a Harran, la atacó con mangoneles, la tomó y masacró al cadí y a sus dos hijos {cite:shadharat-dhahab p. 350}."
  fr: "En 476, les habitants de Harran et leur cadi hanbalite Ibn Julba décidèrent de livrer la ville à Janaq, l'émir turkmène — un sunnite — défiant ainsi Muslim b. Quraysh, seigneur de Mossoul, qu'ils considéraient comme un Rafidi et qui était occupé à assiéger Damas avec les Égyptiens contre Taj al-Dawla Tutush; Muslim se précipita à Harran, lança des mangonneaux, la prit et massacra le cadi et ses deux fils {cite:shadharat-dhahab p. 350}."
  ur: "476 میں حران کے لوگوں اور ان کے حنبلی قاضی ابن جلبہ نے شہر کو ترکمان امیر جناق کے حوالے کرنے کا فیصلہ کیا - جو ایک سنی - مسلمانوں کی مخالفت کرتے ہوئے تھا۔ قریش، موصل کا آقا، جسے وہ رافدی شمار کرتے تھے اور جو تاج الدولہ توتش کے خلاف مصریوں کے ساتھ دمشق کا محاصرہ کرنے میں مصروف تھے۔ مسلمان حران کی طرف بھاگا، اس پر منگولین پھینکے، اسے لے لیا، اور قادی اور اس کے دو بیٹوں کو ذبح کر دیا۔ 350}۔"
