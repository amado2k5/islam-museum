label: { ar: "أخذ مسلم بن قريش حران وقتل قاضيها" }
summary:
  ar: "في سنة ست وسبعين وأربعمائة عزم أهل حران وقاضيهم ابن جلبة الحنبلي على تسليم حران إلى جنق أمير التركمان لكونه سنياً وعصوا على مسلم بن قريش صاحب الموصل لكونه رافضياً ولكونه مشغولاً بمحاصرة دمشق مع المصريين، وكانوا يحاصرون بها تاج الدولة تتش، فأسرع مسلم إلى حران ورماها بالمجانيق وأخذها وذبح القاضي وولديه {cite:shadharat-dhahab p. 350}."
  en: "In 476 Harran's people and their Hanbali qadi Ibn Julba resolved to hand the city to Janaq the Turkman amir — a Sunni — defying Muslim b. Quraysh, lord of Mosul, whom they counted a Rafidi and who was busy besieging Damascus with the Egyptians against Taj al-Dawla Tutush; Muslim raced to Harran, flung mangonels at it, took it, and slaughtered the qadi and his two sons {cite:shadharat-dhahab p. 350}."
