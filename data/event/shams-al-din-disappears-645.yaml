summary:
  ar: "سنة ٦٤٥هـ/١٢٤٧م اختفى [[person/shams-tabrizi|شمس الدين التبريزي]] في ليلة من ليالي قونية ولم يُرَ بعدها؛ وثبت في القرن العشرين أنه قُتل فعلاً، وليس ذلك ببعيد عن علم أبناء جلال الدين، الذين دفنوه على عجل قرب بئر لا تزال قائمة بقونية، فحوّلت هذه التجربة من الحب والشوق والفقد جلالَ الدين شاعراً {cite:britannica-rumi}."
  en: "One night in 645/1247 Shams al-Din of Tabriz disappeared for ever at Konya. Twentieth-century research established that he was indeed murdered — not without the knowledge of Rumi's sons, who hurriedly buried him close to a well still extant in Konya. This experience of love, longing and loss turned Jalal al-Din into a poet {cite:britannica-rumi}."
  ur: "645ھ/1247ء کی ایک رات شمس الدین تبریزی قونیہ میں ہمیشہ کے لیے غائب ہو گئے۔ بیسویں صدی کی تحقیق نے ثابت کیا کہ ان کا قتل ہوا — اور رومی کے بیٹوں کے علم کے بغیر نہیں — جنہوں نے انہیں قونیہ کے ایک اب بھی موجود کنویں کے قریب جلدی میں دفن کیا۔ محبت، شوق اور فقد کی اس تجربے نے جلال الدین کو شاعر بنا دیا۔"
