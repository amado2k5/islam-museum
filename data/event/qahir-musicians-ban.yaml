id: event/qahir-musicians-ban
class: event
kind: law-enacted
label: { ar: "تحريم القاهر القيان والخمر", en: "Al-Qahir's ban on singing-girls and wine", es: "La prohibición de Al-Qahir sobre las cantantes y el vino.", fr: "L'interdiction par Al-Qahir des chanteuses et du vin", ur: "القاہر کا گانے والی لڑکیوں اور شراب پر پابندی" }
summary:
  ar: "في سنة إحدى وعشرين أمر القاهر بتحريم القيان والخمر وقبض على المغنين ونفى المخانيث وكسر آلات اللهو وأمر ببيع المغنيات من الجواري على أنهن سواذج وكان مع ذلك لا يصحو من السكر ولا يفتر عن سماع الغناء {cite:tarikh-khulafa-minhaj-1434 p. 597-598}."
  en: "In 321 al-Qahir banned singing-girls and wine, arrested the singers, exiled the mukhannathun, smashed the instruments and ordered the singing slave-girls sold as ordinary maids — while he himself was never sober nor ever off the song {cite:tarikh-khulafa-minhaj-1434 p. 597-598}."
  es: "En 321, al-Qahir prohibió a las cantantes y el vino, arrestó a los cantantes, exilió a los mukhannathun, destruyó los instrumentos y ordenó que las esclavas cantantes fueran vendidas como sirvientas comunes, mientras que él mismo nunca estuvo sobrio ni dejó de cantar {cite:tarikh-khulafa-minhaj-1434 p. 597-598}."
  fr: "En 321, al-Qahir interdit les chanteuses et le vin, arrêta les chanteuses, exila les mukhannathun, brisa les instruments et ordonna que les esclaves chanteuses soient vendues comme des servantes ordinaires — alors que lui-même n'était jamais sobre ni ne cessait jamais de chanter {cite:tarikh-khulafa-minhaj-1434 p. 597-598}."
  ur: "321 میں القاہر نے گانے والی لڑکیوں اور شراب پر پابندی لگائی، گلوکاروں کو گرفتار کیا، مخنتھون کو جلاوطن کیا، سازوں کو توڑ دیا اور گانے والی لونڈیوں کو عام لونڈیوں کے طور پر فروخت کرنے کا حکم دیا - جب کہ وہ خود بھی کبھی پرہیزگار نہیں تھا اور نہ ہی کبھی گانا چھوڑتا تھا۔ 597-598}۔"
