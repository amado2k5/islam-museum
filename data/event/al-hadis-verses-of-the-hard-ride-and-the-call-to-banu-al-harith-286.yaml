label:
  ar: أبيات الهادي في الطراد ودعوته بني الحارث إلى اللقاء، ذو الحجة 286هـ
  en: Al-Hadi's verses on the hard riding and his call to Banu al-Harith to meet him, Dhu al-Hijja 286 AH
  ur: 'ہادی کے اشعار: سخت سواری کا ذکر اور بنو حارث کو مقابلے کی دعوت، ذوالحجہ 286ھ'
summary:
  ar: ينقل الكتاب للهادي قصيدتين، الأولى يسلو فيها بالطراد على الخيل ويرد على من يلومه في اللقاء ويصف نفسه في سلاحه على فرسه، والثانية يدعو فيها بني الحارث إلى اللقاء ويتوعدهم ويذكر المهلهل ويعلن اسمه.
  en: 'The book gives two poems of al-Hadi: the first finds comfort in the chase on horseback, answers one who blames him for fighting and pictures himself armed on his horse; the second calls Banu al-Harith to meet him and threatens them, recalls al-Muhalhil and names himself.'
  ur: 'کتاب ہادی کے دو قصیدے نقل کرتی ہے: پہلے میں وہ گھوڑوں پر تعاقب سے تسلی پاتے ہیں، لڑائی پر ملامت کرنے والے کو جواب دیتے ہیں اور اپنے آپ کو ہتھیار بند گھوڑے پر تصور کرتے ہیں؛ دوسرے میں وہ بنو حارث کو مقابلے کی دعوت دیتے، دھمکاتے، مہلہل کا ذکر کرتے اور اپنا نام بتاتے ہیں۔'
