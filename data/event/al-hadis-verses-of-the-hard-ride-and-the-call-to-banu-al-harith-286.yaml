class: event
kind: other
label:
  ar: أبيات الهادي في الطراد ودعوته بني الحارث إلى اللقاء، ذو الحجة 286هـ
  en: Al-Hadi's verses on the hard riding and his call to Banu al-Harith to meet him, Dhu al-Hijja 286 AH
  ur: 'ہادی کے اشعار: سخت سواری کا ذکر اور بنو حارث کو مقابلے کی دعوت، ذوالحجہ 286ھ'
  es: "Versículos de Al-Hadi sobre la dura cabalgata y su llamado a los Banu al-Harith para que se reúnan con él, Dhu al-Hijja 286 AH"
  fr: "Versets d'Al-Hadi sur le difficile voyage et son appel aux Banu al-Harith à le rejoindre, Dhu al-Hijja 286 AH"
  tr: "Hadi'nin savaş hakkındaki ayetleri ve Beni el-Harith'e yaptığı toplantı çağrısı, Zilhicce 286 Hicri."
  id: "Ayat-ayat Al-Hadi tentang pertempuran dan seruannya kepada Bani Harit untuk bersatu, Dzul Hijjah 286 H."
summary:
  ar: ينقل الكتاب للهادي قصيدتين، الأولى يسلو فيها بالطراد على الخيل ويرد على من يلومه في اللقاء ويصف نفسه في سلاحه على فرسه، والثانية يدعو فيها بني الحارث إلى اللقاء ويتوعدهم ويذكر المهلهل ويعلن اسمه.
  en: 'The book gives two poems of al-Hadi: the first finds comfort in the chase on horseback, answers one who blames him for fighting and pictures himself armed on his horse; the second calls Banu al-Harith to meet him and threatens them, recalls al-Muhalhil and names himself.'
  ur: 'کتاب ہادی کے دو قصیدے نقل کرتی ہے: پہلے میں وہ گھوڑوں پر تعاقب سے تسلی پاتے ہیں، لڑائی پر ملامت کرنے والے کو جواب دیتے ہیں اور اپنے آپ کو ہتھیار بند گھوڑے پر تصور کرتے ہیں؛ دوسرے میں وہ بنو حارث کو مقابلے کی دعوت دیتے، دھمکاتے، مہلہل کا ذکر کرتے اور اپنا نام بتاتے ہیں۔'
  es: "El libro incluye dos poemas de al-Hadi: el primero encuentra consuelo en la persecución a caballo, responde a quien lo culpa de luchar y se imagina armado sobre su caballo; el segundo convoca a Banu al-Harith a su encuentro y los amenaza, recuerda a al-Muhalhil y se nombra a sí mismo."
  fr: "Le livre présente deux poèmes d'al-Hadi: le premier trouve du réconfort dans la chasse à cheval, répond à celui qui le blâme de se battre et se représente armé sur son cheval; le second appelle les Banu al-Harith à sa rencontre et les menace, évoque al-Muhalhil et se nomme lui-même."
  tr: "Kitapta El-Hadi'nin iki şiirinden alıntılar yer alıyor. İlkinde, at üzerinde kovalamacayla kendini teselli ediyor ve karşılaşmadan dolayı kendisini suçlayanlara, atının üzerindeki silahıyla kendini tarif ederek cevap veriyor. İkincisinde ise Beni El-Harith'i buluşmaya çağırıyor, onları tehdit ediyor, El-Muhalhil'den bahsediyor ve adını duyuruyor."
  id: "Buku ini mengutip dua puisi karya Al-Hadi. Dalam puisi pertama, ia menghibur diri dengan pengejaran di atas kuda dan menanggapi mereka yang menyalahkannya atas pertemuan tersebut, menggambarkan dirinya dengan senjata di atas kudanya. Dalam puisi kedua, ia menyeru Bani Al-Harith untuk bertemu, mengancam mereka, menyebut Al-Muhalhil, dan mengumumkan namanya."
