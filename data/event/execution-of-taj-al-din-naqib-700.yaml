id: event/execution-of-taj-al-din-naqib-700
class: event
kind: death
label:
  ar: "مقتل تاج الدين نقيب الأشراف وولديه بغداد 700"
  en: "Killing of the naqib Taj al-Din and his two sons, Baghdad, 700 AH"
  ur: "نقیب تاج الدین اور ان کے دو بیٹوں کا قتل، بغداد 700ھ"
  fr: "Mise à mort du naqib Taj al-Din et de ses deux fils, Bagdad, 700 de l'Hégire"
  es: "Asesinato del naqib Taj al-Din y sus dos hijos, Bagdad, 700 de la Hégira"
summary:
  ar: "في ذي القعدة سنة 700 هـ قُتل تاج الدين أبو الفضل محمد، نقيب الأشراف، وولداه شمس الدين حسين وشرف الدين علي، على يد رجل من آل علي بعد أن رفض طاهر جلال الدين وآخر من آل علي أن يقتلاه، وذلك بحسب رواية مؤرخ من آل علي يرويها الخشاب {cite:jami-al-tawarikh-khashshab-1960 p. 59}. وقد انتقم عوام بغداد والحنابلة من الجثة بحسب الرواية نفسها {cite:jami-al-tawarikh-khashshab-1960 p. 59}. ويذكر الخشاب أن رشيد الدين قال للسلطان إن الموت كان برضا جميع أهل البيت في العراق، وأن السلطان لم يصدّق كل الرواية، وأن الخشاب يرى الرواية محل ريبة {cite:jami-al-tawarikh-khashshab-1960 p. 59}{cite:jami-al-tawarikh-khashshab-1960 p. 60}."
  en: "In Dhu al-Qa'da 700 AH the naqib Taj al-Din Abu al-Fadl Muhammad and his two sons, Shams al-Din Husayn and Sharaf al-Din Ali, were killed, according to the Alid chronicler's account reported by the introduction {cite:jami-al-tawarikh-khashshab-1960 p. 59}. The account says that two men refused the task before a third, of the same Alid family, carried it out on Rashid al-Din's order, and that Baghdad's crowd and the Hanbalis then mutilated the body {cite:jami-al-tawarikh-khashshab-1960 p. 59}. The account also says Rashid al-Din told the sultan the killing had the consent of all of the family in Iraq; the translator calls the whole account doubtful {cite:jami-al-tawarikh-khashshab-1960 p. 59}{cite:jami-al-tawarikh-khashshab-1960 p. 60}. The Sunni chronicles are not read here, so no Sunni account is given."
  es: "En dhu al-qa'da del año 700 de la Hégira fueron asesinados el naqib Taj al-Din Abu al-Fadl Muhammad y sus dos hijos, Shams al-Din Husayn y Sharaf al-Din Ali, según el relato de un cronista alida que recoge la introducción {cite:jami-al-tawarikh-khashshab-1960 p. 59}. Según ese relato, dos hombres se negaron antes de que un tercero, de la misma familia alida, lo ejecutara por orden de Rashid al-Din, y la muchedumbre de Bagdad y los hanbalíes mutilaron luego el cuerpo {cite:jami-al-tawarikh-khashshab-1960 p. 59}. El relato dice también que Rashid al-Din dijo al sultán que la muerte contó con el consentimiento de toda la familia en Irak; el traductor considera dudoso el conjunto {cite:jami-al-tawarikh-khashshab-1960 p. 59}{cite:jami-al-tawarikh-khashshab-1960 p. 60}. No se leen aquí las crónicas suníes, por lo que no se ofrece su versión."
  fr: "En dhu al-qa'da 700 de l'Hégire, le naqib Taj al-Din Abu al-Fadl Muhammad et ses deux fils, Shams al-Din Husayn et Sharaf al-Din Ali, furent tués, selon le récit d'un chroniqueur alide rapporté par l'introduction {cite:jami-al-tawarikh-khashshab-1960 p. 59}. Selon ce récit, deux hommes refusèrent avant qu'un troisième, de la même famille alide, n'exécute l'ordre de Rashid al-Din, et la foule de Bagdad et les Hanbalites mutilèrent ensuite le corps {cite:jami-al-tawarikh-khashshab-1960 p. 59}. Le récit dit aussi que Rashid al-Din assura au sultan que la mort avait l'accord de toute la famille en Irak ; le traducteur juge l'ensemble douteux {cite:jami-al-tawarikh-khashshab-1960 p. 59}{cite:jami-al-tawarikh-khashshab-1960 p. 60}. Les chroniques sunnites ne sont pas lues ici, aussi aucune version sunnite n'est-elle donnée."
  ur: "ذوالقعدہ 700ھ میں نقیب تاج الدین ابو الفضل محمد اور ان کے دو بیٹے شمس الدین حسین اور شرف الدین علی قتل کیے گئے، علوی مؤرخ کے بیان کے مطابق جو مقدمے میں نقل ہوا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 59}۔ بیان کے مطابق دو آدمیوں نے انکار کیا، پھر ایک تیسرے شخص نے، جو اسی علوی خاندان سے تھا، رشید الدین کے حکم پر یہ کام کیا، اور بغداد کے عوام اور حنابلہ نے لاش کے ساتھ بدسلوکی کی {cite:jami-al-tawarikh-khashshab-1960 p. 59}۔ بیان یہ بھی کہتا ہے کہ رشید الدین نے سلطان سے کہا کہ عراق میں پورے خاندان کی رضامندی سے یہ موت ہوئی؛ مترجم پورے بیان کو مشکوک سمجھتے ہیں {cite:jami-al-tawarikh-khashshab-1960 p. 59}{cite:jami-al-tawarikh-khashshab-1960 p. 60}۔ سنی تواریخ یہاں نہیں پڑھی گئیں، اس لیے ان کا بیان نہیں دیا گیا۔"
