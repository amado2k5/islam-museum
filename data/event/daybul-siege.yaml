label: { ar: "فتح الديبل وكسر منارة البد", en: "The Storming of Daybul", es: "El asalto a Daybul", fr: "La prise d'assaut de Daybul", ur: "دی سٹرمنگ آف دیبل" }
summary:
  ar: "قدم محمد بن القاسم الديبل يوم جمعة ووافته سفن حمل فيها الرجال والسلاح والأداة فخندق حين نزل الديبل وركزت الرماح على الخندق ونشرت الأعلام وأنزل الناس على راياتهم ونصب منجنيقاً تعرف بالعروس يمد فيها خمس مائة رجل وكان بالديبل بد عظيم عليه دقل طويل وعلى الدقل راية حمراء إذا هبت الريح أطافت بالمدينة وكانت تدور وكانت كتب الحجاج ترد على محمد وكتب محمد ترد عليه بصفة ما قبله واستطلاع رأيه في كل ثلاثة أيام فورد عليه كتاب ان نصب العروس وأقصر منها قائمة ولتكن مما يلي المشرق ثم ادع صاحبها فمره أن يقصد برميته للدقل الذي وصفت لي فرمى الدقل فكسر فاشتد طرة الكفر من ذلك ثم إن محمداً ناهضهم وقد خرجوا إليه فهزمهم حتى ردهم وأمر بالسلالم فوضعت وصعد عليها الرجال وكان أولهم صعوداً رجل من مراد من أهل الكوفة ففتحت عنوة ومكث محمد يقتل من فيها ثلاثة أيام وهرب عامل داهر عنها وقتل سادن بيت آلهتهم واختط محمد للمسلمين بها وبنى مسجداً وأنزلها أربعة آلاف وقال منصور بن حاتم النحوي إنه رأى الدقل مكسوراً وإن عنبسة بن إسحاق الضبي العامل على السند في خلافة المعتصم هدم أعلى تلك المنارة وجعل فيها سجناً وابتدأ في مرمة المدينة بما نقض من حجارتها فعزل قبل استتمام ذلك وولي بعده هرون بن أبي خالد المروروذي فقتل بها."
  en: "Muhammad reached Daybul on a Friday with the fleet behind him — trench, spears, banners, and the mangonel 'al-Arus' worked by five hundred men against the great budd whose tall mast bore a revolving red banner. Al-Hajjaj's letters, exchanged every three days, ordered the eastern arm shortened and the crew told to break the mast he described; broken, the kafirs' defiance sank, the sally was driven back, and ladders went up — a Muradi of Kufa first over — the city stormed, three days of killing, the temple's sadin slain, Dahir's agent fled; Muhammad marked out a Muslim quarter, built the mosque, and settled four thousand. Mansur ibn Hatim saw the broken mast, and al-Mu'tasim's governor Anbasa ibn Ishaq al-Dabbi razed the minaret's top for a prison before his removal; his successor Harun ibn Abi Khalid was killed there."
  es: "Muhammad llegó a Daybul un viernes con la flota detrás: trinchera, lanzas, estandartes y el mangonel 'al-Arus', manejado por quinientos hombres contra el gran budd cuyo alto mástil ondeaba un estandarte rojo giratorio. Las cartas de Al-Hajjaj, intercambiadas cada tres días, ordenaban acortar el brazo oriental y que la tripulación rompiera el mástil que describía; roto, el desafío de los kafires se desvaneció, la salida fue rechazada y se levantaron escaleras —un Muradi de Kufa fue el primero en cruzar— la ciudad fue asaltada, tres días de matanza, el sadin del templo fue asesinado, el agente de Dahir huyó; Muhammad delimitó un barrio musulmán, construyó la mezquita y asentó a cuatro mil personas. Mansur ibn Hatim vio el mástil roto, y el gobernador de al-Mu'tasim, Anbasa ibn Ishaq al-Dabbi, arrasó la parte superior del minarete para convertirla en prisión antes de su destitución; su sucesor, Harun ibn Abi Khalid, fue asesinado allí."
  fr: "Muhammad atteignit Daybul un vendredi, la flotte à sa suite: tranchées, lances, bannières et le mangonneau « al-Arus », manœuvré par cinq cents hommes, étaient déployés contre le grand boudd dont le haut mât arborait une bannière rouge tournante. Les lettres d'al-Hajjaj, échangées tous les trois jours, ordonnaient de raccourcir le bras oriental et de briser le mât décrit. Une fois brisé, la résistance des infidèles s'effondra, la sortie fut repoussée et des échelles furent dressées – un Muradi de Kufa franchit le premier l'obstacle – la ville fut prise d'assaut. Après trois jours de massacres, le sadin du temple fut tué et l'agent de Dahir s'enfuit. Muhammad délimita un quartier musulman, fit construire la mosquée et y installa quatre mille personnes. Mansur ibn Hatim aperçut le mât brisé, et le gouverneur d'al-Mu'tasim, Anbasa ibn Ishaq al-Dabbi, fit raser le sommet du minaret pour en faire une prison avant d'être destitué; son successeur, Harun ibn Abi Khalid, y fut tué."
  ur: "محمد جمعہ کے دن اپنے پیچھے بحری بیڑے کے ساتھ دیبل پہنچا - خندق، نیزے، جھنڈے، اور مینگونیل 'العروس' اس عظیم بڈ کے خلاف پانچ سو آدمیوں نے کام کیا جس کے لمبے مستول میں گھومتا ہوا سرخ جھنڈا تھا۔ ہر تین دن بعد الحجاج کے خطوط کا تبادلہ ہوتا تھا، مشرقی بازو کو چھوٹا کرنے کا حکم دیا جاتا تھا اور عملے سے کہا جاتا تھا کہ وہ مستول توڑے جو اس نے بیان کیا ہے۔ ٹوٹ گیا، کافروں کی نافرمانی ڈوب گئی، سلی کو پیچھے ہٹا دیا گیا، اور سیڑھیاں چڑھ گئیں — کوفہ کا ایک مرادی پہلے اوور — شہر پر دھاوا بولا، تین دن تک قتل و غارت گری، ہیکل کا سادین مارا گیا، داہر کا ایجنٹ فرار ہو گیا۔ محمد نے مسلمانوں کے ایک کوارٹر کو نشان زد کیا، مسجد تعمیر کی، اور چار ہزار کو آباد کیا۔ منصور بن حاتم نے ٹوٹا ہوا مست دیکھا، اور المعتصم کے گورنر عنباسہ ابن اسحاق الدبی نے اس کی برطرفی سے پہلے مینار کی چوٹی کو جیل کے لیے گرا دیا۔ اس کے جانشین ہارون بن ابی خالد کو وہیں قتل کر دیا گیا۔"
