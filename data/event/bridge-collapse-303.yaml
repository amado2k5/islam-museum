label: { ar: "انقطاع كرسي الجسر ببغداد", en: "Collapse of the bridge's seating at Baghdad", fr: "L'effondrement des gradins du pont de Bagdad", es: "Colapso de los asientos del puente en Bagdad" }
summary:
  ar: "في يوم الأربعاء لتسع خلون من رمضان سنة ثلاث وثلاثمائة انقطع كرسي الجسر ببغداد والناس عليه، فغرق خلق كثير؛ وفي ليلة الجمعة لثمان بقين من رمضان انقضّ كوكب عظيم بقي ضوؤه ساعة كالمِقباس {cite:muntazam-ibn-al-jawzi p. 418}."
  en: "On Wednesday 9 Ramadan 303 the pontoon seating on Baghdad's bridge gave way under the crowds and many drowned; on Friday 8 Ramadan a great star fell whose light lingered an hour like a lamp {cite:muntazam-ibn-al-jawzi p. 418}."
  fr: "Le mercredi 9 Ramadan 303, les gradins sur bateaux du pont de Bagdad cédèrent sous la foule et beaucoup se noyèrent ; le vendredi 8 Ramadan, une grande étoile tomba, dont la lumière persista une heure comme celle d'une lampe {cite:muntazam-ibn-al-jawzi p. 418}."
  es: "El miércoles 9 de Ramadán del año 303, los asientos flotantes del puente de Bagdad cedieron bajo la multitud y muchos se ahogaron; el viernes 8 de Ramadán cayó una gran estrella cuya luz perduró una hora como una lámpara {cite:muntazam-ibn-al-jawzi p. 418}."
