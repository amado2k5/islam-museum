label: { en: "The martyrdom of Farwa ibn Amr al-Judhami", ar: "استشهاد فروة بن عمرو الجذامي" }
summary:
  en: "Farwa ibn Amr al-Judhami, a Byzantine commander over the neighbouring Arabs at Ma'an, embraced Islam after Mu'ta and sent the Prophet a gift; the Byzantines imprisoned him, offered him apostasy or death, and crucified and beheaded him at the spring of Afra' in Palestine."
  ar: "أسلم فروة بن عمرو الجذامي وهو عامل للروم على معان بعد مؤتة وبعث إلى النبي بهدية، فأخذه الروم وخيّروه بين الردة والموت فاختار الموت، فصلبوه على ماء يقال له عفراء بفلسطين وضربوا عنقه."
