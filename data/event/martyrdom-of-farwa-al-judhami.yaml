id: event/martyrdom-of-farwa-al-judhami
class: event
kind: death
label: { en: "The martyrdom of Farwa ibn Amr al-Judhami", ar: "استشهاد فروة بن عمرو الجذامي", es: "El martirio de Farwa ibn Amr al-Judhami", fr: "Le martyre de Farwa ibn Amr al-Judhami", ur: "فروا بن عمرو الجدمی کی شہادت", tr: "Farwa bin Amr el-Judhami'nin şehadeti", id: "Kesyahidan Farwa bin Amr al-Judhami" }
summary:
  en: "Farwa ibn Amr al-Judhami, a Byzantine commander over the neighbouring Arabs at Ma'an, embraced Islam after Mu'ta and sent the Prophet a gift; the Byzantines imprisoned him, offered him apostasy or death, and crucified and beheaded him at the spring of Afra' in Palestine."
  ar: "أسلم فروة بن عمرو الجذامي وهو عامل للروم على معان بعد مؤتة وبعث إلى النبي بهدية، فأخذه الروم وخيّروه بين الردة والموت فاختار الموت، فصلبوه على ماء يقال له عفراء بفلسطين وضربوا عنقه."
  es: "Farwa ibn Amr al-Judhami, un comandante bizantino sobre los árabes vecinos en Ma'an, abrazó el Islam después de Mu'ta y envió un regalo al Profeta; los bizantinos lo encarcelaron, le ofrecieron apostasía o muerte, y lo crucificaron y decapitaron en el manantial de Afra' en Palestina."
  fr: "Farwa ibn Amr al-Judhami, commandant byzantin des Arabes voisins de Ma'an, embrassa l'islam après Mu'ta et envoya un cadeau au Prophète; les Byzantins l'emprisonnèrent, lui offrirent l'apostasie ou la mort, et le crucifièrent et le décapitèrent à la source d'Afra' en Palestine."
  ur: "فروا بن عمرو الجدمی، ایک بازنطینی کمانڈر جو معن میں پڑوسی عربوں پر تھا، نے موطا کے بعد اسلام قبول کیا اور پیغمبر کو تحفہ بھیجا؛ بازنطینیوں نے اسے قید کر دیا، اسے ارتداد یا موت کی پیشکش کی، اور فلسطین میں عفرا کے چشمے میں اس کا سر قلم کر دیا۔"
  tr: "Mu'te'den sonra Ma'an'da Romalıların ajanı olan Farwa bin Amr al-Judhami, İslamiyet'i kabul ederek Peygambere bir hediye gönderdi. Romalılar onu yakalayıp dinden dönmek ile ölüm arasında seçim yapma şansı verdiler ve o ölümü seçti. Bunun üzerine Filistin'deki Afra adlı bir su kaynağında çarmıha gerdiler ve başını kestiler."
  id: "Farwa bin Amr al-Judhami, yang merupakan agen Romawi di Ma'an setelah Mu'tah, masuk Islam dan mengirimkan hadiah kepada Nabi. Orang Romawi menangkapnya dan memberinya pilihan antara murtad dan mati, dan dia memilih mati. Maka mereka menyalibnya di tempat pemandian bernama Afra' di Palestina dan memenggal kepalanya."
