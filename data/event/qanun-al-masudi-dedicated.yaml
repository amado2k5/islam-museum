  ar: "أهدى البيروني «القانون المسعودي» — موسوعته الفلكية الجامعة — إلى مسعود بن محمود الغزنوي، وجمع فيه علم الهيئة من المجسطي والزيجات مع إضافاته الأصلية {cite:britannica-al-biruni}."
  en: "Al-Bīrūnī dedicated the Masʿūdic Canon — his encyclopaedic astronomical work gathering and updating Ptolemy's Almagest and Handy Tables with original contributions — to Masʿūd, son of Maḥmūd of Ghazna {cite:britannica-al-biruni}."
  ur: "بیرونی نے اپنی فلکیاتی موسوع قانون مسعودی — جس میں بطلیموس کے المجسطی اور زیچوں کو جدید بنایا اور اصل اضافے کیے — محمود غزنوی کے بیٹے مسعود کے نام کی {cite:britannica-al-biruni}."
