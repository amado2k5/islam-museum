id: event/al-hadi-reflects-on-death-the-reckoning-and-the-stranger-in-the-world-292
class: event
kind: other
label:
  ar: "أبيات للهادي في الموت والبعث والحساب وغربة الإنسان في الدنيا وتمني القيام بنصر الله، تبدأ في ص315 وتنتهي في ص316"
  en: "Verses of al-Hadi on death, resurrection, the reckoning and man's strangeness in the world, and the wish to stand in God's cause, beginning on p. 315 and ending on p. 316"
  ur: "ہادی کے اشعار: موت، قیامت، حساب اور دنیا میں انسان کی اجنبیت اور اللہ کی نصرت میں کھڑے ہونے کی تمنا، جو ص315 پر شروع ہو کر ص316 پر ختم ہوتے ہیں"
  es: "Versículos de al-Hadi sobre la muerte, la resurrección, el juicio final y la extrañeza del hombre en el mundo, y el deseo de defender la causa de Dios, desde la página 315 hasta la página 316."
  fr: "Versets d'al-Hadi sur la mort, la résurrection, le jugement dernier et l'étrangeté de l'homme dans le monde, et le désir de se ranger du côté de Dieu, commençant à la page 315 et se terminant à la page 316"
  tr: "Al-Hadi'nin ölüm, diriliş, yargı, insanın bu dünyadaki yabancılaşması ve Allah'ın zaferiyle yükselme arzusu üzerine olan ayetleri, 315. sayfada başlayıp 316. sayfada sona ermektedir."
  id: "Ayat-ayat Al-Hadi tentang kematian, kebangkitan, penghakiman, keterasingan manusia di dunia ini, dan keinginan untuk bangkit dalam kemenangan Tuhan, dimulai pada halaman 315 dan berakhir pada halaman 316."
summary:
  ar: "قصيدة من الطويل بعنوان «وله أيضاً» تبدأ في أسفل ص315: يرى الهادي أنه ميت ومبعوث ومحاسب وموقوف على كل زلة وهالك إن لم يغفر الله، وأنه غريب مسافر في الدنيا يؤوب، فيخاطب نفسه أن تعرض عن دار الفناء، ويسأل متى يراه خليله قائماً بنصر إله الحق وفي كفه سيف قاضب؛ والبيت يتصل بما بعده في ص316."
  en: "A poem in the tawil metre under the heading \"and also of his\", begun at the foot of p. 315: al-Hadi sees that he will die, be raised and reckoned, be stood over every slip and perish unless God forgives, that he is a stranger and traveller in the world who returns, so he bids his soul turn from the house of passing and asks when his friend will see him standing in aid of the God of truth with a cutting sword in his hand; the line runs on into p. 316."
  ur: "طویل بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت جو ص315 کے آخر میں شروع ہوتی ہے: ہادی دیکھتا ہے کہ وہ مرے گا، اٹھایا جائے گا، حساب دے گا، ہر لغزش پر کھڑا کیا جائے گا اور اگر اللہ نے نہ بخشا تو ہلاک ہو گا، وہ دنیا میں اجنبی مسافر ہے جو لوٹتا ہے، اس لیے اپنے نفس سے کہتا ہے کہ فنا کے گھر سے منہ موڑ، اور پوچھتا ہے کہ اس کا دوست اسے کب اللہ کی نصرت میں کھڑا دیکھے گا جبکہ اس کے ہاتھ میں کاٹنے والی تلوار ہو؛ شعر ص316 تک جاری رہتا ہے۔"
  es: "Un poema en metro tawil bajo el título \"y también suyo\", que comienza al pie de la página 315: al-Hadi ve que morirá, resucitará y será juzgado, será examinado sobre cada error y perecerá a menos que Dios lo perdone, que es un extraño y viajero en el mundo que regresa, por lo que le pide a su alma que se aparte de la casa del tránsito y pregunta cuándo su amigo lo verá de pie en ayuda del Dios de la verdad con una espada cortante en la mano; el verso continúa hasta la página 316."
  fr: "Un poème en mètre tawil sous le titre « et aussi de lui », commençant au bas de la p. 315: al-Hadi voit qu'il mourra, sera ressuscité et jugé, sera tenu pour responsable de chaque faux pas et périra à moins que Dieu ne pardonne, qu'il est un étranger et un voyageur dans le monde qui revient, alors il ordonne à son âme de se détourner de la maison du passage et demande quand son ami le verra debout au secours du Dieu de vérité avec une épée tranchante à la main; le vers se poursuit à la p. 316."
  tr: "315. sayfanın alt kısmında, uzun vezinle yazılmış “Ve onun için de” başlıklı bir şiir başlıyor: Al-Hadi, öldüğünü, dirildiğini, hesaba çekildiğini ve her hatası için tutuklandığını, Allah onu affetmezse helak olacağını ve dünyada dolaşan ve geri dönen bir yabancı olduğunu görüyor; bu yüzden yok oluş yurdundan uzaklaşmaya karar veriyor ve arkadaşının onu Hakikat Tanrısının zaferiyle ve elinde keskin bir kılıçla ayakta dururken ne zaman göreceğini soruyor; ve bu dize, 316. sayfada onu takip eden kısımla bağlantılı."
  id: "Sebuah puisi berirama panjang berjudul “Dan untuknya juga” dimulai di bagian bawah halaman 315: Al-Hadi melihat bahwa ia telah mati, dibangkitkan, dimintai pertanggungjawaban, dan ditahan atas setiap kesalahan, dan bahwa ia akan binasa jika Tuhan tidak mengampuninya, dan bahwa ia adalah orang asing yang berkelana di dunia yang kembali, sehingga ia meminta dirinya untuk berpaling dari tempat kehancuran, dan bertanya kapan temannya akan melihatnya berdiri dengan kemenangan Tuhan Yang Maha Benar dan dengan pedang tajam di tangannya; dan ayat tersebut terhubung dengan apa yang mengikutinya di halaman 316."
