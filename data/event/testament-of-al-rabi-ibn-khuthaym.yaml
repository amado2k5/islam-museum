label: { ar: "وصية الربيع بن خثيم وآخر أيامه بالكوفة", en: "Testament and last days of al-Rabi' ibn Khuthaym", ur: "ربیع بن خثیم کی وصیت اور کوفہ میں آخری ایام", es: "Testamento y últimos días de al-Rabi' ibn Khuthaym", fr: "Testament et derniers jours d'al-Rabi' ibn Khuthaym", tr: "Rabi' ibn Khuthaym'ın vasiyeti ve Kûfe'deki son günleri", id: "Wasiat Rabi' ibn Khuthaym dan hari-hari terakhirnya di Kufa" }
summary:
  ar: "يروي ابن سعد وأبو نعيم أن الربيع بن خثيم أوصى عند موته فقال إنه يقرّ على نفسه ويُشهد الله أنه رضي بالله رباً وبمحمد نبياً وبالإسلام ديناً، ورضي لنفسه ولمن أطاعه أن يعبد الله في العابدين ويحمده في الحامدين وينصح لجماعة المسلمين {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. وكان قد أصابه الفالج فكان يُقاد إلى الصلاة ويقول إنه يسمع «حي على الفلاح» {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}، وأوصى ألا يُشعَر به أحد {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. ومات بالكوفة في ولاية عبيد الله بن زياد عليها {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  en: "Ibn Sa'd and Abu Nu'aym report that at death al-Rabi' ibn Khuthaym made a will acknowledging against himself, with God as witness, that he was content with God as Lord, Muhammad as Prophet and Islam as religion, and content for himself and whoever obeyed him to worship God among the worshippers, praise Him among the praisers and give sincere counsel to the community of Muslims {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Struck by palsy, he was led to prayer, saying that he heard the call to success {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}, and he asked that no one be notified of his death {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. He died at Kufa during the governorship of Ubaydallah ibn Ziyad {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  ur: "ابن سعد اور ابو نعیم روایت کرتے ہیں کہ ربیع بن خثیم نے موت کے وقت وصیت کی کہ وہ اپنے اوپر اقرار کرتے اور اللہ کو گواہ بناتے ہیں کہ وہ اللہ کو رب، محمد کو نبی اور اسلام کو دین مان کر راضی ہیں، اور اپنے لیے اور اپنی بات ماننے والوں کے لیے اس پر راضی ہیں کہ عبادت گزاروں میں اللہ کی عبادت کریں، حمد کرنے والوں میں اس کی حمد کریں اور مسلمانوں کی جماعت کے خیرخواہ رہیں {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}۔ انھیں فالج ہوا تو انھیں سہارے سے نماز کو لے جایا جاتا اور وہ کہتے کہ میں «حی علی الفلاح» سنتا ہوں {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}، اور انھوں نے کہا کہ کسی کو ان کی خبر نہ دی جائے {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}۔ ان کی وفات کوفہ میں عبید اللہ بن زیاد کی ولایت کے زمانے میں ہوئی {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}۔"
  es: "Ibn Sa'd y Abu Nu'aym informan que al morir al-Rabi' ibn Khuthaym hizo un testamento reconociendo contra sí mismo, con Dios como testigo, que estaba contento con Dios como Señor, Muhammad como Profeta y el Islam como religión, y contento para sí mismo y para quien le obedeciera adorar a Dios entre los adoradores, alabarlo entre los alabadores y dar consejos sinceros a la comunidad de musulmanes {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Afectado por la parálisis, fue llevado a la oración, diciendo que escuchó el llamado al éxito {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}, y pidió que nadie fuera notificado de su muerte {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. Murió en Kufa durante el gobierno de Ubaydallah ibn Ziyad {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  fr: "Ibn Sa'd et Abu Nu'aym rapportent qu'à sa mort, al-Rabi' ibn Khuthaym rédigea un testament dans lequel il reconnaissait, devant Dieu comme témoin, qu'il se contentait de Dieu comme Seigneur, de Muhammad comme Prophète et de l'Islam comme religion, et qu'il se contentait, pour lui-même et pour ceux qui lui obéissaient, d'adorer Dieu parmi les adorateurs, de Le louer parmi les louangeurs et de prodiguer des conseils sincères à la communauté musulmane {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Frappé de paralysie, il fut conduit à la prière, affirmant avoir entendu l'appel au succès {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 112}. 309}, et il a demandé que personne ne soit informé de sa mort {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. Il est décédé à Kufa pendant le gouvernorat d'Ubaydallah ibn Ziyad {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  tr: "İbn Sa'd ve Ebu Nu'aym rivayet eder ki, Rabi' ibn Khuthaym ölüm döşeğinde bir vasiyetname yazmış ve Allah'ı Rabbi, Muhammed'i Peygamberi ve İslam'ı dini olarak kabul ettiğini, kendisi ve kendisine itaat edenler için Allah'a ibadet edenler arasında ibadet etmeyi, O'nu övenler arasında övmeyi ve Müslüman topluluğuna samimi nasihatlerde bulunmayı kabul ettiğini belirtmiştir. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Felç geçirmiş ve namaza götürülürken \"Başarıya ulaş\" sesini duyabildiğini söylemiştir. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309} Durumundan kimsenin haberdar olmaması gerektiğini vasiyet etti. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. Ubayd Allah ibn Ziyad'ın Kufa valiliği döneminde Kufa'da vefat etti. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  id: "Ibn Sa'd dan Abu Nu'aym meriwayatkan bahwa Rabi' ibn Khuthaym membuat wasiat di ranjang kematiannya, menyatakan bahwa ia bersumpah dan memohon kepada Allah sebagai saksi bahwa ia merasa puas dengan Allah sebagai Tuhannya, Muhammad sebagai Nabinya, dan Islam sebagai agamanya. Ia merasa puas untuk dirinya sendiri dan bagi orang-orang yang taat kepadanya untuk beribadah kepada Allah di antara para penyembah, memuji-Nya di antara para pemuji, dan memberikan nasihat yang tulus kepada umat Muslim. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Ia menderita stroke dan diajak shalat, dan mengatakan bahwa ia dapat mendengar \"Datanglah menuju kesuksesan\" {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}. Ia berpesan agar tidak seorang pun mengetahui kondisinya. {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. Beliau wafat di Kufa pada masa pemerintahan Ubayd Allah ibn Ziyad di sana {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
