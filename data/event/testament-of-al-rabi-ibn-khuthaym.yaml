id: event/testament-of-al-rabi-ibn-khuthaym
class: event
kind: declaration
tags: [wasaya-browser, wasaya-successors, wasaya-wasiyya, wasaya-ihtidar]
label: { ar: "وصية الربيع بن خثيم وآخر أيامه بالكوفة", en: "Testament and last days of al-Rabi' ibn Khuthaym", ur: "ربیع بن خثیم کی وصیت اور کوفہ میں آخری ایام" }
summary:
  ar: "يروي ابن سعد وأبو نعيم أن الربيع بن خثيم أوصى عند موته فقال إنه يقرّ على نفسه ويُشهد الله أنه رضي بالله رباً وبمحمد نبياً وبالإسلام ديناً، ورضي لنفسه ولمن أطاعه أن يعبد الله في العابدين ويحمده في الحامدين وينصح لجماعة المسلمين {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. وكان قد أصابه الفالج فكان يُقاد إلى الصلاة ويقول إنه يسمع «حي على الفلاح» {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}، وأوصى ألا يُشعَر به أحد {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. ومات بالكوفة في ولاية عبيد الله بن زياد عليها {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  en: "Ibn Sa'd and Abu Nu'aym report that at death al-Rabi' ibn Khuthaym made a will acknowledging against himself, with God as witness, that he was content with God as Lord, Muhammad as Prophet and Islam as religion, and content for himself and whoever obeyed him to worship God among the worshippers, praise Him among the praisers and give sincere counsel to the community of Muslims {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}. Struck by palsy, he was led to prayer, saying that he heard the call to success {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}, and he asked that no one be notified of his death {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}. He died at Kufa during the governorship of Ubaydallah ibn Ziyad {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}."
  ur: "ابن سعد اور ابو نعیم روایت کرتے ہیں کہ ربیع بن خثیم نے موت کے وقت وصیت کی کہ وہ اپنے اوپر اقرار کرتے اور اللہ کو گواہ بناتے ہیں کہ وہ اللہ کو رب، محمد کو نبی اور اسلام کو دین مان کر راضی ہیں، اور اپنے لیے اور اپنی بات ماننے والوں کے لیے اس پر راضی ہیں کہ عبادت گزاروں میں اللہ کی عبادت کریں، حمد کرنے والوں میں اس کی حمد کریں اور مسلمانوں کی جماعت کے خیرخواہ رہیں {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311} {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 112}۔ انھیں فالج ہوا تو انھیں سہارے سے نماز کو لے جایا جاتا اور وہ کہتے کہ میں «حی علی الفلاح» سنتا ہوں {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 309}، اور انھوں نے کہا کہ کسی کو ان کی خبر نہ دی جائے {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 311}۔ ان کی وفات کوفہ میں عبید اللہ بن زیاد کی ولایت کے زمانے میں ہوئی {cite:tabaqat-ibn-sad-khanji-2001 vol. 8 p. 312}۔"
