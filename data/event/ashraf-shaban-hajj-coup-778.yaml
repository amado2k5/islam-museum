id: event/ashraf-shaban-hajj-coup-778
class: event
kind: other
label: { ar: "انقلاب الأمراء على الأشرف شعبان في الحج", en: "The amirs' coup against al-Ashraf Sha'ban during the hajj", fr: "Le coup des émirs contre al-Ashraf Sha'ban pendant le hajj", es: "El golpe de estado de los emires contra al-Ashraf Sha'ban durante el Hajj.", ur: "حج کے دوران اشرف شعبان کے خلاف امیروں کی بغاوت", tr: "Hac sırasında prenslerin El-Eşref Şaban'a karşı düzenlediği darbe.", id: "Kudeta para pangeran terhadap Al-Ashraf Sha'ban selama ibadah haji." }
summary:
  ar: "وفي سنة ثمان وسبعين قتل الأشرف شعبان وتسلطن ابنه علي ولقب المنصور وذلك أن الأشرف سافر إلى الحج ومعه الخليفة والقضاة والأمراء فخامر عليه الأمراء وفر راجعاً إلى القاهرة ورجع الخليفة ومن رجع وأرادوا أن يسلطنوا الخليفة فامتنع فسلطنوا ابن الأشرف واختفى الأشرف إلى أن ظفروا به فخنقوه في ذي القعدة، وفيها خسف الشمس والقمر جميعاً {cite:tarikh-khulafa-minhaj-1434 p. 759}."
  en: "In 778 al-Ashraf Sha'ban left for the hajj with the caliph, qadis and amirs; the amirs turned on him, he fled back to Cairo, and when they offered the sultanate to the CALIPH he refused — so they raised al-Ashraf's son Ali al-Mansur and strangled the hidden Sha'ban when caught, in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 759}."
  fr: "En 778, al-Ashraf Sha'ban partit pour le hajj avec le calife, les cadis et les émirs ; les émirs se retournèrent contre lui, il s'enfuit au Caire, et quand ils offrirent le sultanat au CALIFE, celui-ci refusa ; ils élevèrent donc le fils d'al-Ashraf, Ali al-Mansur, et étranglèrent Sha'ban, qui se cachait, lorsqu'il fut pris, en Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 759}."
  es: "En 778, al-Ashraf Sha'ban partió para el Hajj con el califa, los cadíes y los emires; los emires se volvieron contra él, huyó de regreso a El Cairo, y cuando le ofrecieron el sultanato al califa, se negó; entonces criaron al hijo de al-Ashraf, Ali al-Mansur, y estrangularon al Sha'ban escondido cuando lo atraparon, en Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 759}."
  ur: "778ء میں اشرف شعبان خلیفہ، قادیان اور امیروں کے ساتھ حج کے لیے روانہ ہوئے۔ امیروں نے اس کی طرف رجوع کیا، وہ واپس قاہرہ کی طرف بھاگا، اور جب انہوں نے خلیفہ کو سلطنت کی پیشکش کی تو اس نے انکار کر دیا - چنانچہ انہوں نے اشرف کے بیٹے علی المنصور کو اٹھایا اور ذوالقعدہ میں چھپے ہوئے شعبان کا گلا گھونٹ دیا۔ 759}۔"
  tr: "Yetmiş sekizinci yılda El-Eşref Şaban öldürüldü ve oğlu Ali Sultan oldu ve El-Mansur unvanını aldı. Bunun sebebi, El-Eşref'in Halife, kadılar ve prenslerle birlikte Hacca gitmesi ve prenslerin ona karşı komplo kurmasıydı; bunun üzerine Kahire'ye geri kaçtı. Halife ve geri dönenler Halifeyi Sultan yapmak istediler, ancak Halife bunu reddetti. Bunun üzerine El-Eşref'in oğlunu Sultan yaptılar ve El-Eşref saklandı. Sonunda onu yakalayıp Zilhicce ayında boğarak öldürdüler ve o yıl hem güneş hem de ay tutuldu. {cite:tarikh-khulafa-minhaj-1434 s. 759}"
  id: "Pada tahun tujuh puluh delapan, Al-Ashraf Sha’ban terbunuh dan putranya Ali menjadi Sultan dan diberi gelar Al-Mansur. Hal ini karena Al-Ashraf pergi ke Haji bersama Khalifah, para hakim, dan para pangeran, dan para pangeran bersekongkol melawannya sehingga ia melarikan diri kembali ke Kairo. Khalifah dan mereka yang kembali kembali dan mereka ingin menjadikan Khalifah Sultan, tetapi ia menolak, sehingga mereka menjadikan putra Al-Ashraf sebagai Sultan dan Al-Ashraf bersembunyi sampai mereka menangkapnya dan mencekiknya pada bulan Dzul Qa’dah, dan pada tahun itu terjadi gerhana matahari dan bulan. {cite:tarikh-khulafa-minhaj-1434 p. 759}."
