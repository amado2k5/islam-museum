label: { ar: "انقلاب الأمراء على الأشرف شعبان في الحج" }
summary:
  ar: "وفي سنة ثمان وسبعين قتل الأشرف شعبان وتسلطن ابنه علي ولقب المنصور وذلك أن الأشرف سافر إلى الحج ومعه الخليفة والقضاة والأمراء فخامر عليه الأمراء وفر راجعاً إلى القاهرة ورجع الخليفة ومن رجع وأرادوا أن يسلطنوا الخليفة فامتنع فسلطنوا ابن الأشرف واختفى الأشرف إلى أن ظفروا به فخنقوه في ذي القعدة، وفيها خسف الشمس والقمر جميعاً {cite:tarikh-khulafa-minhaj-1434 p. 759}."
  en: "In 778 al-Ashraf Sha'ban left for the hajj with the caliph, qadis and amirs; the amirs turned on him, he fled back to Cairo, and when they offered the sultanate to the CALIPH he refused — so they raised al-Ashraf's son Ali al-Mansur and strangled the hidden Sha'ban when caught, in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 759}."
