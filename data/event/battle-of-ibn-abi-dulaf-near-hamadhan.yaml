label: { ar: "الوقعة بين مفلح وعبد العزيز بن أبي دلف خارج همذان", en: "Battle between Muflih and Abd al-Aziz ibn Abi Dulaf outside Hamadhan", fr: "La bataille entre Muflih et Abd al-Aziz ibn Abi Dulaf aux portes de Hamadhan", es: "Batalla entre Muflih y Abd al-Aziz ibn Abi Dulaf en las afueras de Hamadán." }
summary:
  ar: "في سنة ثلاث وخمسين ومائتين أوقع مفلح، وهو على مقدمة موسى بن بغا، بعبد العزيز بن أبي دلف، وكانت الوقعة خارج همذان، فهزمه وقتل وأسر {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  en: "In 253 AH Muflih, who was at the head of Musa ibn Bugha's vanguard, defeated Abd al-Aziz ibn Abi Dulaf in a battle outside Hamadhan; he routed him, and there were killings and captures {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  fr: "En 253 H, Muflih, qui était à la tête de l'avant-garde de Musa ibn Bugha, vainquit Abd al-Aziz ibn Abi Dulaf dans une bataille aux portes de Hamadhan ; il le mit en déroute, et il y eut des tués et des captifs {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  es: "En el año 253 AH, Muflih, que estaba al frente de la vanguardia de Musa ibn Bugha, derrotó a Abd al-Aziz ibn Abi Dulaf en una batalla a las afueras de Hamadhan; lo puso en fuga, y hubo asesinatos y capturas {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
