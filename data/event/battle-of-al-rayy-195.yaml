label: { ar: "وقعة الري بين طاهر وعلي بن عيسى", en: "the battle of al-Rayy", fr: "La bataille d'al-Rayy", es: "La batalla de al-Rayy", ur: "الرّی کی جنگ", tr: "Tahir ile Ali ibn İsa arasında gerçekleşen Rayy Muharebesi", id: "Pertempuran Rayy antara Tahir dan Ali bin Isa" }
summary:
  ar: "سير الأمين علي بن عيسى بن ماهان في جيش عظيم نحو خراسان وكان أول من أجاب إلى خلع المأمون، فعدل إلى رستاق من رساتيق الري، وأقبل طاهر بن الحسين في نحو أربعة آلاف فارس فكردس خيله وصمد في نحو القلب في سبعمائة، وضرب عباس بن الليث مولى المهدي ضربة بيديه جميعاً فأتت عليه وبذلك سمي طاهر ذا اليمينين، وذبح علياً رجل يعرف بطاهر بن الراجي وتنازعوا في خاتمه ورأسه، وكتب طاهر إلى ذي الرياستين الفضل بن سهل كتابي إليك ورأس علي بن عيسى بين يدي وخاتمه في إصبعي، فسر المأمون وسلم عليه بالخلافة {cite:muruj-al-dhahab p. 375-376}."
  en: "Tahir's four thousand broke 'Ali ibn 'Isa's army by Rayy — the two-handed blow that named him Dhu'l-Yaminayn, 'his head before me and his seal on my finger' {cite:muruj-al-dhahab p. 375-376}."
  fr: "Les quatre mille hommes de Tahir brisèrent l'armée d'Ali ibn Isa près de Rayy : le coup porté des deux mains qui lui valut le nom de Dhu'l-Yaminayn, « sa tête devant moi et son sceau à mon doigt » {cite:muruj-al-dhahab p. 375-376}."
  es: "Los cuatro mil hombres de Tahir quebraron el ejército de Ali ibn Isa con Rayy, el golpe a dos manos que lo nombró Dhu'l-Yaminayn, 'su cabeza delante de mí y su sello en mi dedo' {cite:muruj-al-dhahab p. 375-376}."
  ur: "طاہر کے چار ہزار نے علی بن عیسیٰ کی فوج کو رے کے ذریعے توڑ دیا - دو ہاتھ کی ضرب جس نے اس کا نام ذوال یامینین رکھا، 'اس کا سر میرے سامنے اور اس کی مہر میری انگلی پر'۔ 375-376}۔"
  tr: "Al-Amin Ali bin İsa bin Mahan, büyük bir orduyla Horasan'a doğru ilerledi ve Al-Ma'mun'un görevden alınmasına ilk karşılık veren kişi oldu. Rayy bölgesine yöneldi ve Tahir bin Al-Hussein yaklaşık dört bin süvariyle geldi. Atlarına bindi ve yaklaşık yedi yüz adamıyla ortada sağlam durdu. Al-Mahdi'nin azatlı kölesi Abbas bin Al-Layth'e iki eliyle birden vurdu ve onu öldürdü. Böylece Tahir'e Zü'l-Yaminayn (iki sağ eli olan) lakabı verildi. Tahir bin Al-Raji olarak bilinen bir adam Ali'yi öldürdü ve yüzüğü ile başı üzerinde tartışmaya girdiler. Tahir, Zü'l-Riyasatayn Al-Fadl bin Sahl'a şöyle yazdı: \"Sana yazdığım mektup ve Ali bin İsa'nın başı elimde, yüzüğü de parmağımda.\" Al-Ma'mun memnun oldu ve onu halifelikle karşıladı. {cite:muruj-al-dhahab s. 375-376}"
  id: "Al-Amin Ali bin Isa bin Mahan bergerak dengan pasukan besar menuju Khorasan dan merupakan orang pertama yang menanggapi penggulingan Al-Ma’mun. Ia menuju ke distrik Rayy, dan Tahir bin Al-Hussein datang dengan sekitar empat ribu penunggang kuda. Ia menaiki kudanya dan berdiri teguh di tengah dengan sekitar tujuh ratus orang. Ia memukul Abbas bin Al-Layth, orang yang dibebaskan oleh Al-Mahdi, dengan kedua tangannya, dan ia terbunuh. Demikianlah, Tahir disebut Dhu Al-Yaminayn (orang yang memiliki dua tangan kanan). Seorang pria yang dikenal sebagai Tahir bin Al-Raji membunuh Ali, dan mereka berselisih tentang cincin dan kepalanya. Tahir menulis kepada Dhu Al-Riyasatayn Al-Fadl bin Sahl: “Suratku kepadamu, dan kepala Ali bin Isa ada di tanganku dan cincinnya ada di jariku.” Al-Ma’mun senang dan menyambutnya dengan kekhalifahan. {cite:muruj-al-dhahab p. 375-376}"
