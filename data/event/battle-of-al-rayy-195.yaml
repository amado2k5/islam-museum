label: { ar: "وقعة الري بين طاهر وعلي بن عيسى", en: "the battle of al-Rayy" }
summary:
  ar: "سير الأمين علي بن عيسى بن ماهان في جيش عظيم نحو خراسان وكان أول من أجاب إلى خلع المأمون، فعدل إلى رستاق من رساتيق الري، وأقبل طاهر بن الحسين في نحو أربعة آلاف فارس فكردس خيله وصمد في نحو القلب في سبعمائة، وضرب عباس بن الليث مولى المهدي ضربة بيديه جميعاً فأتت عليه وبذلك سمي طاهر ذا اليمينين، وذبح علياً رجل يعرف بطاهر بن الراجي وتنازعوا في خاتمه ورأسه، وكتب طاهر إلى ذي الرياستين الفضل بن سهل كتابي إليك ورأس علي بن عيسى بين يدي وخاتمه في إصبعي، فسر المأمون وسلم عليه بالخلافة {cite:muruj-al-dhahab p. 375-376}."
  en: "Tahir's four thousand broke 'Ali ibn 'Isa's army by Rayy — the two-handed blow that named him Dhu'l-Yaminayn, 'his head before me and his seal on my finger' {cite:muruj-al-dhahab p. 375-376}."
