id: event/abu-al-qasim-ibn-al-hadi-is-taken-and-led-through-sanaa-290
class: event
kind: other
label:
  ar: "أسر أبي القاسم ابن الهادي وسوقه إلى صنعاء وطوافهم به في الأسواق، رجب 290هـ"
  en: "Abu al-Qasim, al-Hadi's son, is taken and led to Sana'a and paraded through its markets, Rajab 290 AH"
  fr: "Abu al-Qasim, fils d’al-Hadi, est capturé, conduit à Sanaa et exhibé dans ses marchés, rajab 290 de l’hégire"
  ur: "ہادی کے بیٹے ابو القاسم کی گرفتاری، صنعاء لے جانا اور بازاروں میں پھرانا، رجب 290ھ"
  es: "Abu al-Qasim, hijo de al-Hadi, es llevado a Sana'a y exhibido en sus mercados, Rajab 290 AH."
  tr: "Ebu el-Kâsım ibn el-Hadi yakalanarak Sana'a'ya götürüldü ve Hicri 290 yılının Receb ayında onunla birlikte çarşılarda dolaştırıldı."
  id: "Abu al-Qasim ibn al-Hadi ditangkap dan dibawa ke Sana'a, dan diarak melalui pasar-pasar bersamanya, Rajab 290 H."
summary:
  ar: "مضى أبو القاسم ابن الهادي في فرقة من الخيل فوقعوا في موضع وعر لا منزل له، وكان تحته مهر ضعيف فأصيب برجمة في رأسه فسقط مغشياً عليه، وحال ابن الضحاك الخيواني بين القوم وبين قتله، فأخذوه إلى ابن خلف، وبعد ليلة بـمدر سيقوا إلى صنعاء يوم الخميس على الإبل وطافوا بهم في الأسواق، وجذل أهلها بحسب الراوي."
  en: "Abu al-Qasim, al-Hadi's son, took another road with a troop of horse and they came to rough ground with no way down; his colt was weak, he was struck on the head with a stone and fell senseless, and Ibn al-Dahhak al-Khiwani stood between the men and his killing; he was taken to Ibn Khalaf, and after a night at Madar he and his companions were brought to Sana'a on Thursday on camels and paraded in the markets, and the people of Sana'a rejoiced greatly, according to the narrator."
  fr: "Abu al-Qasim, fils d’al-Hadi, prit une autre route avec une troupe de cavaliers et parvint à un terrain accidenté sans issue ; son poulain était faible, il fut frappé à la tête par une pierre et tomba sans connaissance. Ibn al-Dahhak al-Khiwani empêcha les hommes de le tuer ; il fut conduit à Ibn Khalaf et, après une nuit à Madar, lui et ses compagnons furent amenés à Sanaa le jeudi à dos de chameau et exhibés dans les marchés, à la grande joie des habitants, selon le narrateur."
  ur: "ہادی کے بیٹے ابو القاسم گھڑسواروں کی ایک ٹکڑی کے ساتھ دوسرے راستے پر گئے اور ایسی دشوار جگہ آ پہنچے جہاں اترنے کا راستہ نہ تھا؛ ان کا ٹٹو کمزور تھا، سر پر پتھر لگا تو وہ بے ہوش ہو کر گر پڑے، اور ابن الضحاک خیوانی مخالفوں اور ان کے قتل کے بیچ حائل ہوا؛ انہیں ابن خلف کے پاس لے گئے، اور مدر میں ایک رات کے بعد وہ اپنے ساتھیوں سمیت جمعرات کو اونٹوں پر صنعاء لائے گئے اور بازاروں میں پھرائے گئے، اور راوی کے مطابق صنعاء والے بہت خوش ہوئے۔"
  es: "Abu al-Qasim, hijo de al-Hadi, tomó otro camino con una tropa de caballos y llegaron a un terreno accidentado sin salida; su potro era débil, fue golpeado en la cabeza con una piedra y cayó inconsciente, e Ibn al-Dahhak al-Khiwani se interpuso entre los hombres y su muerte; fue llevado ante Ibn Khalaf, y después de pasar la noche en Madar, él y sus compañeros fueron llevados a Sana'a el jueves en camellos y desfilaron en los mercados, y la gente de Sana'a se regocijó enormemente, según el narrador."
  tr: "Ebu el-Kâsım İbn el-Hadi bir grup atla birlikte yola çıktı ve sığınaksız, engebeli bir yere geldiler. Altında zayıf bir tayı vardı ve başına bir taş isabet ederek bayıldı. İbn el-Dahhak el-Khiwani, halkın onu öldürmesini engelledi ve onu İbn Halef'in yanına götürdüler. Madar'da bir gece geçirdikten sonra, perşembe günü develerle Sana'a'ya götürüldüler ve çarşılarda dolaştırıldılar; rivayet edene göre, halk sevinçle karşıladı."
  id: "Abu al-Qasim Ibn al-Hadi pergi bersama sekelompok kuda dan mereka sampai di tempat yang terjal tanpa tempat berteduh. Ia membawa seekor anak keledai yang lemah, dan ia terkena batu di kepalanya dan jatuh pingsan. Ibn al-Dahhak al-Khiwani mencegah orang-orang membunuhnya, sehingga mereka membawanya ke Ibn Khalaf. Setelah bermalam di Madar, mereka diantar ke Sana'a pada hari Kamis dengan unta dan diarak mengelilingi pasar, dan penduduknya bersukacita, menurut perawi."
