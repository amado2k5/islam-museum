id: event/edessa-mandil-331
class: event
kind: treaty
label: { ar: "فدية منديل الرها", en: "The Edessa kerchief ransom", es: "El rescate del pañuelo de Edesa", fr: "La rançon du mouchoir d'Édesse", ur: "Edessa kerchief تاوان", tr: "Rahha'nın mendilinin kurtarılması", id: "Penebusan saputangan Al-Rahha" }
summary:
  ar: "في سنة إحدى وثلاثين وصلت الروم إلى أرزن وميافارقين ونصيبين فقتلوا وسبوا ثم طلبوا منديلاً في كنيسة الرها يزعمون أن المسيح مسح به وجهه فارتسمت صورته فيه على أنهم يطلقون جميع من سبوا فأرسل إليهم وأطلقوا الأسرى {cite:tarikh-khulafa-minhaj-1434 p. 609-610}. وعند ابن الجوزي وفي سنة 331هـ ورد كتاب من ملك الروم يلتمس منديلاً كان لعيسى مسح به وجهه فصارت صورة وجهه فيه وذلك المنديل في بيعة الرها وعنه أنه إن أنفذ إليه أطلق من أسارى المسلمين عدداً كثيراً فاستؤمر المتقي فأمر بإحضار الفقهاء والقضاة فقال بعض من حضر هذا المنديل منذ زمان طويل في هذه البيعة لم يلتمسه ملك من ملوك الروم وفي دفعه إليه غضاضة على الإسلام والمسلمون أحق بمنديل عيسى فقال علي بن عيسى خلاص المسلمين من الأسر أحق فأمر المتقي بتسليم المنديل وتخليص الأسرى {cite:muntazam-ibn-al-jawzi p. 623-624}"
  en: "In 331 the Byzantines reached Arzan, Mayyafariqin and Nisibis, killing and taking captives, then asked for a kerchief kept in an Edessa church — said to bear the image the Messiah imprinted when he wiped his face — in exchange for releasing all their captives; it was sent and the prisoners freed {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  es: "En 331, los bizantinos llegaron a Arzán, Mayyafariqin y Nisibis, matando y tomando prisioneros, y luego pidieron un pañuelo que se guardaba en una iglesia de Edesa —que se decía que llevaba la imagen que el Mesías imprimió cuando se secó el rostro— a cambio de liberar a todos sus cautivos; el pañuelo fue enviado y los prisioneros fueron liberados {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  fr: "En 331, les Byzantins atteignirent Arzan, Mayyafariqin et Nisibe, tuant et prenant des captifs, puis demandèrent un mouchoir conservé dans une église d'Édesse — censé porter l'image que le Messie avait imprimée lorsqu'il s'était essuyé le visage — en échange de la libération de tous leurs captifs; il fut envoyé et les prisonniers libérés {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  ur: "331 میں بازنطینی ارزان، مایافارقین اور نسیبس پہنچے، قتل کر کے اسیر لے گئے، پھر ایڈیسا کے ایک چرچ میں رکھے ہوئے رومال کے لیے کہا - اپنے تمام اسیروں کو رہا کرنے کے بدلے میں اس تصویر کو اٹھانے کے لیے جو مسیحا نے اپنا چہرہ صاف کیا تھا؛ بھیج دیا گیا اور قیدیوں کو آزاد کر دیا گیا 609-610}۔"
  tr: "31. yılda Romalılar Arzan, Mayyafariqin ve Nisibis'e ulaştılar ve öldürüp esir aldılar. Sonra Edessa kilisesinde bulunan bir mendili istediler; bu mendilin İsa'nın yüzünü sildiği ve üzerinde İsa'nın suretinin bulunduğu iddia ediliyordu. Bunun karşılığında esir aldıkları herkesi serbest bırakacaklarını söylediler. Bunun üzerine Roma kralı onlara bir mektup gönderdi ve esirleri serbest bıraktılar. {cite:tarikh-khulafa-minhaj-1434 s. 609-610}. İbn el-Cevzi'ye göre, Hicri 331 yılında Roma kralından, İsa'nın yüzünü sildiği ve üzerinde İsa'nın suretinin bulunduğu bir mendil isteyen bir mektup geldi. Bu mendil Edessa kilisesindeydi. Eğer kendisine gönderilirse, çok sayıda Müslüman esiri serbest bırakacağı bildirilmişti. El-Muttaki'ye danışıldı ve o da hukukçuları ve hakimleri çağırmalarını emretti. Orada bulunanlardan bazıları, “Bu mendil uzun zamandır bu kilisede bulunuyor ve hiçbir Roma kralı bunu istemedi. Ona vermek İslam'a hakaret olur ve Müslümanlar İsa'nın mendiline daha çok layıktır” dedi. Ali ibn İsa, “Müslümanların esaretten kurtuluşu daha çok layıktır” dedi. Bunun üzerine El-Muttaki mendilin teslim edilmesini ve tutsakların serbest bırakılmasını emretti. {cite:muntazam-ibn-al-jawzi s. 623-624}"
  id: "Pada tahun 31 Hijriah, bangsa Romawi mencapai Arzan, Mayyafariqin, dan Nisibis, lalu mereka membunuh dan menawan orang-orang. Kemudian mereka meminta saputangan di gereja Edessa, dengan alasan bahwa Kristus mengusap wajah-Nya dengan saputangan itu dan gambar-Nya tercetak di atasnya, dengan syarat mereka akan membebaskan semua tawanan mereka. Maka ia mengirimkan saputangan itu kepada mereka dan mereka membebaskan para tawanan. {cite:tarikh-khulafa-minhaj-1434 p. 609-610}. Menurut Ibn al-Jawzi, pada tahun 331 Hijriah, sebuah surat tiba dari raja Romawi yang meminta saputangan milik Yesus, yang digunakan-Nya untuk mengusap wajah-Nya, dan di atasnya tercetak wajah-Nya. Saputangan itu berada di gereja Edessa. Dilaporkan bahwa jika saputangan itu dikirimkan kepadanya, ia akan membebaskan sejumlah besar tawanan Muslim. Al-Muttaqi dimintai pendapat, dan ia memerintahkan agar para ahli hukum dan hakim dipanggil. Beberapa orang yang hadir berkata, “Saputangan ini telah berada di gereja ini sejak lama, dan tidak ada raja Romawi yang pernah memintanya. Memberikannya kepadanya akan menjadi penghinaan terhadap Islam, dan kaum Muslim lebih berhak atas saputangan Yesus.” Ali ibn Isa berkata, “Pembebasan kaum Muslim dari penawanan lebih layak.” Maka al-Muttaqi memerintahkan agar saputangan itu diserahkan dan para tahanan dibebaskan. {cite:muntazam-ibn-al-jawzi p. 623-624}"
