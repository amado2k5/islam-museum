id: event/edessa-mandil-331
class: event
kind: treaty
label: { ar: "فدية منديل الرها" }
summary:
  ar: "في سنة إحدى وثلاثين وصلت الروم إلى أرزن وميافارقين ونصيبين فقتلوا وسبوا ثم طلبوا منديلاً في كنيسة الرها يزعمون أن المسيح مسح به وجهه فارتسمت صورته فيه على أنهم يطلقون جميع من سبوا فأرسل إليهم وأطلقوا الأسرى {cite:tarikh-khulafa-minhaj-1434 p. 609-610}. وعند ابن الجوزي وفي سنة 331هـ ورد كتاب من ملك الروم يلتمس منديلاً كان لعيسى مسح به وجهه فصارت صورة وجهه فيه وذلك المنديل في بيعة الرها وعنه أنه إن أنفذ إليه أطلق من أسارى المسلمين عدداً كثيراً فاستؤمر المتقي فأمر بإحضار الفقهاء والقضاة فقال بعض من حضر هذا المنديل منذ زمان طويل في هذه البيعة لم يلتمسه ملك من ملوك الروم وفي دفعه إليه غضاضة على الإسلام والمسلمون أحق بمنديل عيسى فقال علي بن عيسى خلاص المسلمين من الأسر أحق فأمر المتقي بتسليم المنديل وتخليص الأسرى {cite:muntazam-ibn-al-jawzi p. 623-624}"
  en: "In 331 the Byzantines reached Arzan, Mayyafariqin and Nisibis, killing and taking captives, then asked for a kerchief kept in an Edessa church — said to bear the image the Messiah imprinted when he wiped his face — in exchange for releasing all their captives; it was sent and the prisoners freed {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
