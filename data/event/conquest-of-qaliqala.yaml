label: { ar: "فتح قاليقلا وبدء فتوح أرمينية", en: "The Taking of Qaliqala and the Opening of Armenia", es: "La toma de Qaliqala y la apertura de Armenia", fr: "La prise de Qaliqala et l'ouverture de l'Arménie", ur: "قلیقلہ کا قبضہ اور آرمینیا کا افتتاح", tr: "Qaliqala'nın fethi ve Ermenistan'ın fetihlerinin başlangıcı", id: "Penaklukan Qaliqala dan awal penaklukan Armenia" }
summary:
  ar: "عند البلاذري: لما استخلف عثمان بن عفان كتب إلى معاوية — وهو عامله على الشام والجزيرة وثغورهما — يأمره أن يوجّه حبيب بن مسلمة الفهري إلى أرمينية وكان حبيب ذا أثر جميل في فتوح الشام وغزو الروم قد علم ذلك منه عمر ثم عثمان ثم من بعده — ويقال بل كتب عثمان إلى حبيب يأمره بغزو أرمينية وذلك أثبت — فنهض إليها في ستة آلاف ويقال في ثمانية آلاف من أهل الشام والجزيرة فأتى قاليقلا فأناخ عليها وخرج إليه أهلها فقاتلهم ثم ألجأهم إلى المدينة فطلبوا الأمان على الجلاء والجزية فجلا كثير منهم فلحقوا ببلاد الروم، وأقام حبيب بها فيمن معه أشهراً ثم بلغه أن بطريق أرميناقس قد جمع للمسلمين جمعاً عظيماً وانضمت إليه أمداد أهل اللان وأفخاز وسمنْدر من الخزر فكتب إلى عثمان يسأله أن يشخّص إليه من أهل الشام والجزيرة قوماً ممن يرغب في الجهاد والغنيمة فبعث إليه معاوية ألفي رجل أسكنهم قاليقلا وأقطعهم بها القطائع وجعلهم مرابطة بها؛ وقد أقبلت الروم ومن معها فنزلوا على الفذات وقد أبطأ على حبيب المدد فبيّتهم المسلمون فاجتاحوهم وقتلوا عظيمهم وقالت أم عبد الله بنت يزيد الكلبية امرأة حبيب ليلتئذ له «أين موعدك؟» قال «سرادق الطاغية أو الجنة» فلما انتهى إلى السرادق وجدها عنده؛ وبسند الواقدي عن عبد الحميد بن جعفر عن أبيه حاصر حبيب بن مسلمة أهل دبيل فأقام عليها فلقيه الموريان الرومي فبيّته وقتله وغنم ما كان في عسكره ثم قدِم سلمان عليه — والثبت عندهم أنه لقيه بقاليقلا؛ وبعد قدومه على قاليقلا سار حبيب حتى نزل مريالا فأتاه بطريق خلاط بكتاب إياد بن غنم — وكان إياد قد أمّنه على نفسه وماله وبلاده وقاطعه على أتاوة — فأنفذه حبيب له."
  en: "In al-Baladhuri: when Uthman ibn Affan acceded he wrote to Mu'awiya — his governor over Syria, the Jazira and their frontier — ordering him to send Habib ibn Maslama al-Fihri to Armenia, Habib having a fine record in Syria's conquests and the Roman wars known to Umar then Uthman and after — or, it is said, and it is the sounder, Uthman wrote to Habib directly ordering the raid — so he marched with six thousand, or eight, of the Syrians and Jazirans to Qaliqala, camped on it, fought its sallying people and drove them into the city, whereupon they sought aman on evacuation and jizya, many departing for Roman lands; Habib stayed months with those with him until word came that the patrikios of the Armeniakoi had gathered a great host joined by auxiliaries of the Alan, the Abkhaz and Samandar of the Khazars, so he wrote Uthman asking him to send men of Syria and the Jazira desiring jihad and spoils, and Mu'awiya sent two thousand men whom he settled in Qaliqala with land-grants as its garrison; the Romans and their allies had come and camped on al-Fudhat — the reinforcements slow to Habib — so the Muslims struck them by night, overran them and killed their great man; Umm Abdallah bint Yazid al-Kalbiyya, Habib's wife, that night asked him 'where is your tryst?' — he answered 'the tyrant's pavilion or Paradise', and when he reached the pavilion he found her there; in al-Waqidi's chain — from Abd al-Hamid ibn Ja'far from his father — Habib besieged Dabil's people, sat on it, and the Roman Maurian met him, night-attacked and killed him and spoiled his camp, whereupon Salman came up — the sounder version with them being that he met him at Qaliqala; and after Qaliqala Habib marched to Mariyala where the patrikios of Khilat came to him bearing Iyad ibn Ghanm's writ — Iyad having given him aman on himself, his wealth and his lands for a tribute — and Habib conveyed it to him."
  es: "En al-Baladhuri: cuando Uthman ibn Affan accedió, escribió a Mu'awiya —su gobernador de Siria, Jazira y su frontera— ordenándole que enviara a Habib ibn Maslama al-Fihri a Armenia, ya que Habib tenía un buen historial en las conquistas de Siria y en las guerras romanas conocidas por Umar, luego por Uthman y después —o, se dice, y es la versión más sólida, que Uthman escribió directamente a Habib ordenándole la incursión— así que marchó con seis mil u ocho mil sirios y yazires a Qaliqala, acampó en ella, luchó contra sus habitantes que salían y los hizo retroceder a la ciudad, tras lo cual pidieron aman por la evacuación y jizya, muchos partiendo hacia tierras romanas; Habib permaneció meses con los que estaban con él hasta que llegó la noticia de que los patricios de los armenios habían reunido un gran ejército al que se unieron auxiliares de los alanos, los abjasios y los samandars de los jázaros, así que escribió a Uthman pidiéndole que enviara hombres de Siria y la Jazira deseosos de yihad y botín, y Mu'awiya envió dos mil hombres a quienes asentó en Qaliqala con concesiones de tierras como su guarnición; los romanos y sus aliados habían llegado y acampado en al-Fudhat —los refuerzos tardaron en llegar a Habib— así que los musulmanes los atacaron de noche, los invadieron y mataron a su gran hombre; Umm Abdallah bint Yazid al-Kalbiyya, la esposa de Habib, esa noche le preguntó '¿dónde está tu cita?' —él respondió 'el pabellón del tirano o el Paraíso', y cuando llegó al pabellón la encontró allí; En la cadena de transmisión de al-Waqidi —de Abd al-Hamid ibn Ja'far de su padre— Habib sitió al pueblo de Dabil, se asentó en él, y el romano Maurian lo encontró, atacó de noche y lo mató y saqueó su campamento, tras lo cual llegó Salman —la versión más fiable entre ellos es que lo encontró en Qaliqala; y después de Qaliqala Habib marchó a Mariyala donde el patricio de Khilat vino a él portando el edicto de Iyad ibn Ghanm —Iyad le había dado un aman sobre sí mismo, su riqueza y sus tierras como tributo— y Habib se lo transmitió."
  fr: "Dans al-Baladhuri: lorsque Uthman ibn Affan accéda au trône, il écrivit à Mu'awiya — son gouverneur de Syrie, de la Jazira et de leur frontière — lui ordonnant d'envoyer Habib ibn Maslama al-Fihri en Arménie, Habib ayant fait ses preuves dans les conquêtes de Syrie et les guerres romaines, connu d'Umar puis d'Uthman et après lui — ou, dit-on, et c'est l'hypothèse la plus plausible, Uthman écrivit directement à Habib pour lui ordonner le raid — il marcha donc avec six mille, ou huit, de Syriens et de Jazirans jusqu'à Qaliqala, y campa, combattit les habitants qui faisaient des sorties et les repoussa dans la ville, où ils réclamèrent l'aman sur l'évacuation et la jizya, beaucoup partant pour les terres romaines; Habib resta des mois avec ses compagnons jusqu'à ce que la nouvelle parvienne que les patrikios des Arméniens avaient rassemblé une grande armée, rejoints par des auxiliaires des Alains, des Abkhazes et des Samandars khazars. Il écrivit alors à Uthman pour lui demander d'envoyer des hommes de Syrie et de Jazira, désireux de faire le djihad et de s'emparer du butin. Mu'awiya envoya deux mille hommes qu'il installa à Qaliqala, en lui octroyant des terres pour en faire une garnison. Les Romains et leurs alliés étaient arrivés et avaient campé à al-Fudhat. Les renforts tardaient à arriver à Habib. Les musulmans les attaquèrent donc de nuit, les submergèrent et tuèrent leur chef. Cette nuit-là, Umm Abdallah bint Yazid al-Kalbiyya, l'épouse de Habib, lui demanda: « Où est ton rendez-vous ? » Il répondit: « Au pavillon du tyran ou au Paradis. » Et lorsqu'il atteignit le pavillon, il la trouva là. Dans la chaîne de transmission d'al-Waqidi — d'Abd al-Hamid ibn Ja'far, lui-même transmis par son père — Habib assiégea le peuple de Dabil, s'y installa, et le Romain Maurien le rencontra, l'attaqua de nuit, le tua et pilla son camp, après quoi Salman arriva — la version la plus crédible étant qu'il le rencontra à Qaliqala; et après Qaliqala, Habib marcha vers Mariyala où les patrikios du Califat vinrent à lui porteurs de l'acte d'Iyad ibn Ghanm — Iyad lui ayant donné un aman sur lui-même, ses richesses et ses terres en guise de tribut — et Habib le lui remit."
  ur: "البلادوری میں ہے: جب عثمان بن عفان نے تسلیم کیا تو اس نے معاویہ کو - اس کے شام، جزیرہ اور ان کی سرحدوں کے گورنر - کو لکھا کہ حبیب ابن مسلمہ الفہری کو آرمینیا بھیجنے کا حکم دیا، حبیب نے شام کی فتوحات اور رومی جنگوں کا عمدہ ریکارڈ عمر کو جانا - پھر عثمان نے لکھا، پھر عثمان نے کہا کہ یہ صحیح ہے اور عثمان نے کہا ہے حبیب کو براہ راست چھاپے کا حکم دیا - چنانچہ اس نے شامی اور جزیریوں کے چھ ہزار یا آٹھ کے ساتھ قلقلہ کی طرف کوچ کیا، اس پر پڑاؤ ڈالا، اس کے حلیف لوگوں سے لڑا اور انہیں شہر میں بھگا دیا، اس کے بعد انہوں نے انخلاء اور جزیہ پر امان کی تلاش کی، بہت سے رومی سرزمین کی طرف روانہ ہوئے۔ حبیب اپنے ساتھ والوں کے ساتھ مہینوں رہے یہاں تک کہ یہ خبر پہنچی کہ آرمینیاکوئی کے سرپرستوں نے ایک عظیم لشکر جمع کیا ہے جس کے ساتھ خزر کے ایلان، ابخاز اور سمندر کے معاونین بھی شامل ہیں، چنانچہ اس نے عثمان کو لکھا کہ وہ شام اور جزیرہ کے آدمیوں کو جہاد اور غنیمت کے خواہشمند بھیجے، اور معاویہ نے اس کے دو ہزار آدمیوں کو قلیقلہ کے ساتھ بھیجا۔ گیریژن رومیوں اور ان کے اتحادیوں نے آکر الفدات پر پڑاؤ ڈالا تھا - کمک حبیب کی طرف سست تھی - چنانچہ مسلمانوں نے رات کو ان پر حملہ کیا، ان پر قبضہ کر لیا اور ان کے عظیم آدمی کو قتل کر دیا۔ اس رات حبیب کی بیوی ام عبداللہ بنت یزید الکلبیہ نے ان سے پوچھا 'تمہارا خیمہ کہاں ہے؟' - اس نے جواب دیا 'ظالم کا برآمدہ یا جنت'، اور جب وہ برآمدے میں پہنچا تو اسے وہاں پایا۔ الواقدی کے سلسلہ میں - عبد الحمید بن جعفر سے اپنے والد سے - حبیب نے دبیل کے لوگوں کا محاصرہ کیا، اس پر بیٹھ گئے، اور رومی موریان نے اس سے ملاقات کی، رات کو حملہ کیا اور اسے قتل کر دیا اور اس کے کیمپ کو خراب کر دیا، اس کے بعد سلمان آئے - ان کے ساتھ سب سے اچھا ورژن یہ ہے کہ اس کی ملاقات قلیعلق میں ہوئی۔ اور قلقالہ کے بعد حبیب نے مریالہ کی طرف کوچ کیا جہاں خلعت کے لوگ عیاض بن غنم کی تحریر لے کر اس کے پاس آئے - عیاد نے اسے اپنے آپ پر، اپنے مال اور اپنی زمینوں پر امانت دی تھی - اور حبیب نے اسے پہنچا دیا۔"
  tr: "El-Baladhuri'ye göre: Osman ibn Affan halife olduğunda, Suriye, Cezire ve sınır bölgelerindeki valisi Muaviye'ye, Habib ibn Maslama el-Fihri'yi Ermenistan'a göndermesini emretti. Habib, Suriye'nin fetihlerinde ve Bizanslılara karşı yapılan seferlerde seçkin bir sicile sahipti; bu gerçek Ömer, sonra Osman ve daha sonra halefleri tarafından biliniyordu. Ayrıca Osman'ın doğrudan Habib'e Ermenistan'ı işgal etmesini emrettiği de söylenir ve bu daha güvenilir kabul edilir. Habib, Suriye ve Cezire'den altı bin, bazı kaynaklara göre sekiz bin adamla oraya yürüdü. Kalikala'ya ulaştı ve şehri kuşattı. Halkı onu karşılamak için dışarı çıktı ve onlarla savaştı, onları Medine'ye geri çekilmeye zorladı. Tahliye ve cizye (vergi) karşılığında güvenli geçiş istediler. Birçoğu Bizans topraklarına kaçtı. Habib ve adamları orada birkaç ay kaldı. Sonra, Ermenistan Patriği'nin Müslümanlara karşı büyük bir ordu topladığını, Alanlar, Afhazlar ve Hazarların Samandarlarından takviyeler aldığını öğrendi. Osman'a, cihat ve ganimet peşinde olan Suriye ve Cezire'den bir grup adam göndermesini isteyen bir mektup yazdı. Muaviye ona iki bin adam gönderdi ve onları Kalikala'ya yerleştirdi, onlara orada toprak verdi ve bir garnizona atadı. Bununla birlikte, Romalılar ve onlarla birlikte olanlar gelip el-Fadhat'ta kamp kurdular ve Habib'e takviyeler gecikti, bu yüzden Müslümanlar gece onlara saldırdı, onları alt etti ve liderlerini öldürdü. Habib'in karısı Ümmü Abdullah bint Yazid el-Kalbiyye o gece ona, \"Randevunuz nerede?\" diye sordu. O da, \"Zalimin çadırı veya Cennet\" dedi. Çadıra vardığında onu yanında buldu. Ve Abdülhamid bin Cafer'in babasından rivayet ettiği üzere, el-Vakidi'nin rivayet zincirine göre, Habib bin Müslim, Dabil halkını kuşattı ve orada kaldı. Sonra Romalı Murian onunla karşılaştı, geceleyin saldırdı, onu öldürdü ve kampındaki her şeyi aldı. Sonra Salman ona geldi - ve rivayetlere göre onunla Kalikala'da buluştu. Kalikala'ya vardıktan sonra Habib, Mariyala'da kamp kurana kadar yolculuk etti ve İyad bin Ganm'dan bir mektupla birlikte Hilalet yoluyla ona geldi - İyad, kendisi, parası ve ülkesi için ona güvence vermiş ve haraç konusunda onunla bir anlaşma yapmıştı - bu yüzden Habib mektubu ona gönderdi."
  id: "Menurut al-Baladhuri: Ketika Utsman bin Affan menjadi Khalifah, ia menulis surat kepada Mu'awiya—yang merupakan gubernurnya atas Suriah, Jazira, dan wilayah perbatasan mereka—memerintahkannya untuk mengirim Habib bin Maslama al-Fihri ke Armenia. Habib memiliki catatan prestasi yang gemilang dalam penaklukan Suriah dan kampanye melawan Bizantium, sebuah fakta yang diketahui oleh Umar, kemudian Utsman, dan kemudian para penerusnya. Dikatakan juga bahwa Utsman menulis surat langsung kepada Habib, memerintahkannya untuk menyerang Armenia, dan ini dianggap lebih dapat dipercaya. Habib berbaris ke sana dengan enam ribu, atau beberapa mengatakan delapan ribu, orang dari Suriah dan Jazira. Ia mencapai Qaliqala dan mengepungnya. Penduduknya keluar untuk menemuinya, dan ia melawan mereka, memaksa mereka mundur ke Madinah. Mereka meminta jalan aman dengan imbalan evakuasi dan jizya (upeti). Banyak dari mereka melarikan diri ke wilayah Bizantium. Habib dan pasukannya tinggal di sana selama beberapa bulan. Kemudian ia mengetahui bahwa Patriark Armenia telah mengumpulkan pasukan besar melawan kaum Muslim, yang ditambah dengan bala bantuan dari Alan, Afkhaz, dan Samandar Khazar. Ia menulis surat kepada Utsman meminta agar ia mengirim sekelompok orang dari Suriah dan Jazira yang bersemangat untuk berjihad dan mendapatkan rampasan perang. Mu'awiya mengirim dua ribu orang, yang kemudian ditempatkan di Qaliqala, memberi mereka tanah di sana dan menugaskan mereka ke garnisun. Bersama mereka, orang-orang Romawi dan orang-orang yang bersama mereka datang dan berkemah di al-Fadhat, dan bala bantuan untuk Habib tertunda, sehingga kaum Muslim menyerang mereka di malam hari dan mengalahkan mereka serta membunuh pemimpin mereka. Umm Abdullah bint Yazid al-Kalbiyya, istri Habib, berkata kepadanya malam itu, \"Di mana tempat tugasmu?\" Ia menjawab, \"Kemah sang tiran atau Surga.\" Ketika ia sampai di kemah, ia mendapati istrinya bersamanya. Dan dengan sanad al-Waqidi atas otoritas Abd al-Hamid bin Ja’far atas otoritas ayahnya, Habib bin Muslima mengepung penduduk Dabil dan tinggal di sana. Kemudian orang Romawi Murian menemuinya dan menyerangnya di malam hari, membunuhnya, dan mengambil apa yang ada di perkemahannya. Kemudian Salman datang kepadanya — dan telah dipastikan di antara mereka bahwa ia bertemu dengannya di Qaliqala. Setelah tiba di Qaliqala, Habib melakukan perjalanan hingga berkemah di Mariyala, dan ia datang kepadanya melalui Khilat dengan surat dari Iyad bin Ghanm — dan Iyad telah memberinya jaminan untuk dirinya sendiri, uangnya, dan negaranya serta membuat perjanjian dengannya untuk upeti — maka Habib mengirimkannya kepadanya."
