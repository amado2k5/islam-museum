id: event/men-of-banu-rabia-ask-safety-for-ibn-bustam-and-al-hadi-proclaims-it-286
class: event
kind: other
label:
  ar: طلب نفر من بني ربيعة الأمان لابن بسطام وإعلان الهادي الأمان بنجران، 286هـ
  en: Men of Banu Rabi'a ask safety for Ibn Bustam and al-Hadi has it proclaimed at Najran, 286 AH
  ur: بنو ربیعہ کے کچھ لوگوں کا ابن بسطام کے لیے امان مانگنا اور نجران میں ہادی کا امان کا اعلان، 286ھ
summary:
  ar: بحسب رواية علي بن محمد عن محمد بن سعيد، لما دخل الهادي قرية الهجر في الدخلة الأولى أتاه نفر من بني ربيعة يطلبون الأمان لابن بسطام فأجابهم، فوجدوه قد هرب إلى بلد شاكر، فأمر الهادي منادياً بالأمان لمن جاءه من بني الحارث إلا الأبرص وابنه المدانيين وأمر أبا محمد بالمبيت بميناس.
  en: In the report of Ali ibn Muhammad from Muhammad ibn Sa'id, when al-Hadi first entered the village of al-Hajar men of Banu Rabi'a came to ask safety for Ibn Bustam and he agreed; they found he had fled to the land of Shakir, so al-Hadi had a crier proclaim safety for any of Banu al-Harith who came, except al-Abras and his son, the two Madanis, and ordered Abu Muhammad to spend the night at Minas.
  ur: علی بن محمد کی محمد بن سعید سے روایت کے مطابق ہادی جب پہلی بار ہجر کی بستی میں داخل ہوئے تو بنو ربیعہ کے کچھ لوگ ابن بسطام کے لیے امان مانگنے آئے اور انہوں نے مان لیا؛ انہوں نے اسے شاکر کے علاقے میں بھاگا ہوا پایا، تو ہادی نے بنو حارث میں سے آنے والوں کے لیے امان کا اعلان کروایا سوائے ابرص اور اس کے بیٹے کے، جو دونوں مدانی ہیں، اور ابو محمد کو میناس میں رات گزارنے کا حکم دیا۔
