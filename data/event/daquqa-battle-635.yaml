label: { ar: "غارة دقوقاء سنة 635هـ", en: "The Tatar Raid on Daquqa in 635 AH", es: "La incursión tártara en Daquqa en el año 635 de la Hégira.", fr: "Le raid tatar sur Daquqa en 635 AH", ur: "635ھ میں دقعہ پر تاتاریوں کا حملہ", tr: "Hicri 635 yılında Daquqa baskını", id: "Penyerbuan Daquqa pada tahun 635 Hijriah" }
summary:
  ar: "في سنة خمس وثلاثين وست مئة وصلت التتار إلى دقوقاء تنهب وتفسد فالتقاهم الأمير بكلك الخليفتي في سبعة آلاف والتتار في عشرة آلاف فانهزم المسلمون بعد أن قتلوا خلقاً وكادوا ينتصرون وقتل بكلك وجماعة أمراء أعيان {cite:shadharat-dhahab p. 170}."
  en: "In 635 the Tatars reached Daquqa plundering; the caliph's amir Biklik met them with seven thousand against ten, and the Muslims — having killed many and near victory — were routed, Biklik and a group of great amirs falling {cite:shadharat-dhahab p. 170}."
  es: "En 635, los tártaros llegaron a Daquqa saqueando; el emir del califa, Biklik, los enfrentó con siete mil contra diez, y los musulmanes, tras haber matado a muchos y estar cerca de la victoria, fueron derrotados, cayendo Biklik y un grupo de grandes emires {cite:shadharat-dhahab p. 170}."
  fr: "En 635, les Tatars atteignirent Daquqa en pillant; l'émir du calife Biklik les rencontra avec sept mille contre dix, et les musulmans — ayant tué beaucoup et étant proches de la victoire — furent mis en déroute, Biklik et un groupe de grands émirs tombant {cite:shadharat-dhahab p. 170}."
  ur: "635 میں تاتاری ڈاکہ لوٹتے ہوئے پہنچ گئے۔ خلیفہ کے امیر بقلک نے دس کے مقابلے میں سات ہزار کے ساتھ ان سے ملاقات کی، اور مسلمانوں نے - بہت سے لوگوں کو قتل کر کے اور قریب قریب فتح حاصل کر کے - شکست کھا گئے، بکلیک اور بڑے امیروں کا ایک گروہ گر پڑا۔ 170}۔"
  tr: "Hicri 635 yılında Tatarlar Daquqa'ya ulaştılar, yağma ve yıkım yaptılar. Prens Baklak el-Halifeti yedi bin adamla, Tatarlar ise on bin adamla onları karşıladı. Müslümanlar birçok insanı öldürdükten ve zafere çok yaklaştıktan sonra yenildiler. Baklak ve bir grup önde gelen prens öldürüldü. {cite:shadharat-dhahab s. 170}"
  id: "Pada tahun 635 H, bangsa Tatar mencapai Daquqa, menjarah dan menghancurkan. Pangeran Baklak al-Khalifati menghadapi mereka dengan tujuh ribu orang, dan bangsa Tatar dengan sepuluh ribu orang. Kaum Muslim dikalahkan setelah mereka membunuh banyak orang dan hampir menang. Baklak dan sekelompok pangeran terkemuka terbunuh. {cite:shadharat-dhahab p. 170}"
