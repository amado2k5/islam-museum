id: event/majid-bin-said-accedes-in-zanzibar
class: event
kind: other
label:
  ar: "تولي ماجد بن سعيد سلطنة زنجبار"
  en: "Majid bin Said becomes Sultan of Zanzibar"
  ur: "ماجد بن سعید کا زنجبار کی سلطنت سنبھالنا"
  es: "Majid bin Said se convierte en sultán de Zanzíbar."
  fr: "Majid bin Said devient sultan de Zanzibar"
  tr: "Majid bin Said, Zanzibar Sultanlığı'nı devraldı."
  id: "Majid bin Said mengambil alih Kesultanan Zanzibar."
summary:
  ar: "صار ماجد بن سعيد سلطان الإمبراطورية العُمانية التي عاصمتها زنجبار عند وفاة والده في 19 أكتوبر 1856، وخلافته كانت متنازعا عليها من مسقط."
  en: "Majid bin Said became sultan of the Omani empire, based at its capital Zanzibar, on his father's death on 19 October 1856; his brother at Muscat contested the succession."
  ur: "ماجد بن سعید 19 اکتوبر 1856ء کو والد کی وفات پر زنجبار کو دارالحکومت بنانے والی عمانی سلطنت کے سلطان بنے، اور مسقط سے ان کے بھائی نے جانشینی پر اعتراض کیا۔"
  es: "Majid bin Said se convirtió en sultán del imperio omaní, con sede en su capital, Zanzíbar, tras la muerte de su padre el 19 de octubre de 1856; su hermano, residente en Mascate, impugnó la sucesión."
  fr: "Majid bin Said devint sultan de l'empire omanais, basé à Zanzibar, sa capitale, à la mort de son père le 19 octobre 1856; son frère à Mascate contesta la succession."
  tr: "Majid bin Said, babasının 19 Ekim 1856'da ölümünün ardından başkenti Zanzibar olan Umman İmparatorluğu'nun Sultanı oldu ve tahta geçişi Maskat'tan çekişmeli bir şekilde gerçekleşti."
  id: "Majid bin Said menjadi Sultan Kekaisaran Oman, yang ibu kotanya adalah Zanzibar, setelah kematian ayahnya pada tanggal 19 Oktober 1856, dan suksesi beliau diperebutkan dari Muscat."
