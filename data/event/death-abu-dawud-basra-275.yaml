  ar: "قال أبو عبيد الآجري: توفي في سادس عشر شوال سنة خمس وسبعين {cite:tarikh-islam-dhahabi p. 362}؛ وتعطي الموسوعة الإسلامية شوال 275هـ/فبراير 889م {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. وكان قد استقر بالبصرة وطناً، فأدركت عليه بها الوفاة."
  en: "Abu Ubayd al-Ajurri said: he died on the sixteenth of Shawwal in the year two hundred and seventy-five {cite:tarikh-islam-dhahabi p. 362}, which the Encyclopaedia of Islam renders as Shawwal 275/February 889 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. He had made Basra his home, and there death overtook him."
  ur: "ابو عبید آجری نے کہا: وہ 275ھ میں 16 شوال کو فوت ہوئے {cite:tarikh-islam-dhahabi p. 362}؛ دائرة المعارف الإسلامية اسے شوال 275ھ/فروری 889ء دیتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}۔ انہوں نے بصرہ کو اپنا وطن بنا رکھا تھا اور وہیں وفات آئی۔"
