id: event/death-abu-dawud-basra-275
class: event
kind: death
label:
  ar: "وفاة أبي داود السجستاني بالبصرة ١٦ شوال ٢٧٥هـ"
  en: "Death of Abu Dawud al-Sijistani at Basra, 16 Shawwal 275/Feb 889"
  ur: "ابو داؤد سجستانی کی بصرہ میں وفات، 16 شوال 275ھ/فروری 889ء"
  es: "Muerte de Abu Dawud al-Sijistani en Basora, 16 de Shawwal 275/febrero de 889"
  fr: "Mort d'Abou Dawud al-Sijistani à Bassorah, le 16 Shawwal 275/février 889"
  tr: "Ebu Davud es-Sicistani, H. 275 yılının Şevval ayının 16'sında Basra'da vefat etti."
  id: "Abu Dawud al-Sijistani wafat di Basra pada tanggal 16 Syawal 275 H."
summary:
  ar: "قال أبو عبيد الآجري: توفي في سادس عشر شوال سنة خمس وسبعين {cite:tarikh-islam-dhahabi p. 362}؛ وتعطي الموسوعة الإسلامية شوال 275هـ/فبراير 889م {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. وكان قد استقر بالبصرة وطناً، فأدركت عليه بها الوفاة."
  en: "Abu Ubayd al-Ajurri said: he died on the sixteenth of Shawwal in the year two hundred and seventy-five {cite:tarikh-islam-dhahabi p. 362}, which the Encyclopaedia of Islam renders as Shawwal 275/February 889 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. He had made Basra his home, and there death overtook him."
  ur: "ابو عبید آجری نے کہا: وہ 275ھ میں 16 شوال کو فوت ہوئے {cite:tarikh-islam-dhahabi p. 362}؛ دائرة المعارف الإسلامية اسے شوال 275ھ/فروری 889ء دیتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}۔ انہوں نے بصرہ کو اپنا وطن بنا رکھا تھا اور وہیں وفات آئی۔"
  es: "Abu Ubayd al-Ajurri dijo: murió el dieciséis de Shawwal del año doscientos setenta y cinco {cite:tarikh-islam-dhahabi p. 362}, que la Enciclopedia del Islam traduce como Shawwal 275/febrero de 889 {cite:encyclopaedia-of-islam-2 vol. 1 p. 133}. Había hecho de Basora su hogar, y allí le sorprendió la muerte."
  fr: "Abu Ubayd al-Ajurri a dit: il est décédé le seizième jour de Shawwal de l’an deux cent soixante-quinze {cite: tarikh-islam-dhahabi p. 362}, ce que l’Encyclopédie de l’Islam traduit par Shawwal 275/février 889 {cite: encyclopaedia-of-islam-2 vol. 1 p. 133}. Il avait établi sa demeure à Bassora, et c’est là que la mort l’a emporté."
  tr: "Ebu Ubeyd el-Ajurri şöyle demiştir: Yetmiş beşinci yılın Şevval ayının on altıncı gününde vefat etmiştir {kaynak:tarikh-islam-dhahabi s. 362}; İslam Ansiklopedisi ise Şevval 275 Hicri/Şubat 889 Miladi tarihini vermektedir {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 133}. Basra'yı mesken edinmişti ve orada vefat etti."
  id: "Abu Ubaid al-Ajurri berkata: Beliau wafat pada tanggal enam belas Syawal tahun tujuh puluh lima {cite:tarikh-islam-dhahabi hlm. 362}; dan Ensiklopedia Islam menyebutkan Syawal 275 H/Februari 889 M {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 133}. Beliau menetap di Basra sebagai rumahnya, dan kematian menjemputnya di sana."
