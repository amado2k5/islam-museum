label: { ar: "قميص عثمان المنصوب على منبر دمشق" }
summary:
  ar: "ذكر الخضري أن معاوية أرسل في الشهر الثالث بعد مقتل عثمان رجلاً من بني عبس بطومار مختوم عنوانه «من معاوية إلى علي»، فرفعه الرسول في المدينة في غرة ربيع الأول كما أُمر، فلما فضّه علي لم يجد فيه شيئاً؛ فسأل الرسول عما وراءه، فقال: تركت قوماً لا يرضون إلا بالقود، وتركت ستين ألف شيخ يبكي تحت قميص عثمان وهو منصوب لهم، قد ألبسوه منبر دمشق {cite:khudari-umayyad-state p.234}. ولا يذكر الكتاب سنة هذه الواقعة."
