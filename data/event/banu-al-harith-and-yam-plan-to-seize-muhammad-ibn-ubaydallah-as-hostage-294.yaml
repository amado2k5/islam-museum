id: event/banu-al-harith-and-yam-plan-to-seize-muhammad-ibn-ubaydallah-as-hostage-294
class: event
kind: other
label:
  ar: "بنو الحارث ويأم يخططون لأخذ محمد بن عبيد الله أسيراً، 294-295هـ، ص347-348"
  en: "Banu al-Harith and Ya'am plan to seize Muhammad ibn Ubaydallah as a hostage, 294 to 295 AH, pp. 347 to 348"
  ur: "بنو الحارث اور یأم کا محمد بن عبیداللہ کو یرغمال بنانے کا منصوبہ، 294 تا 295ھ، ص347 تا 348"
  fr: "Les Banu al-Harith et les Ya'am projettent de prendre Muhammad ibn Ubaydallah en otage, 294 à 295 H, p. 347 à 348"
  es: "Banu al-Harith y Ya'am planean tomar como rehén a Muhammad ibn Ubaydallah, 294 a 295 AH, págs. 347 a 348."
summary:
  ar: "رفعت بنو الحارث رؤوسها وكاتبت المسود تسأله المصير إلى بلدهم ومحاربة الهادي، ثم اجتمعت مع يأم على أخذ محمد بن عبيد الله أسيراً ليفادوا به علي بن الربيع."
  en: "Banu al-Harith raised their heads, wrote to al-Musawwid asking him to come to their land and fight al-Hadi, and then joined with Ya'am to seize Muhammad ibn Ubaydallah and hold him to ransom for Ali ibn al-Rabi'."
  ur: "بنو الحارث نے سر اٹھایا اور المسود کو لکھا کہ وہ ان کے علاقے آ کر ہادی سے لڑے، پھر یأم کے ساتھ مل کر محمد بن عبیداللہ کو قید کرنے کا منصوبہ بنایا تاکہ علی بن الربیع کے بدلے چھڑایا جا سکے۔"
  fr: "Les Banu al-Harith relevèrent la tête, écrivirent à al-Musawwid pour lui demander de venir sur leur terre combattre al-Hadi, puis s'unirent aux Ya'am pour s'emparer de Muhammad ibn Ubaydallah et l'échanger contre Ali ibn al-Rabi'."
  es: "Los Banu al-Harith alzaron la cabeza, escribieron a al-Musawwid pidiéndole que viniera a su tierra y luchara contra al-Hadi, y luego se unieron a Ya'am para capturar a Muhammad ibn Ubaydallah y pedir un rescate por él a cambio de Ali ibn al-Rabi'."
