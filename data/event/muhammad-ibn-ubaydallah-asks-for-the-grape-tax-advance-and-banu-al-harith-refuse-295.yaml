id: event/muhammad-ibn-ubaydallah-asks-for-the-grape-tax-advance-and-banu-al-harith-refuse-295
class: event
kind: other
label:
  ar: "محمد بن عبيد الله يطلب استلاف جباية العنب، وبنو الحارث يرفضون، سنة 295هـ، ص352"
  en: "Muhammad ibn Ubaydallah asks for an advance on the grape tax and Banu al-Harith refuse, 295 AH, p. 352"
  ur: "محمد بن عبیداللہ کا انگور کے محصول کی پیشگی وصولی مانگنا اور بنو الحارث کا انکار، 295ھ، ص352"
  es: "Muhammad ibn Ubaydallah solicita un anticipo del impuesto sobre la uva y los Banu al-Harith se niegan, 295 AH, pág. 352"
  fr: "Muhammad ibn Ubaydallah demande une avance sur la taxe sur le raisin et les Banu al-Harith refusent, 295 AH, p. 352"
  tr: "Muhammed ibn Ubeyd Allah üzüm vergisi gelirini ödünç almak ister, ancak Beni el-Harith bunu reddeder (Hicri 295, s. 352)."
  id: "Muhammad ibn Ubayd Allah meminta untuk meminjam pendapatan pajak anggur, tetapi Banu al-Harith menolak, tahun 295 H, hlm. 352"
summary:
  ar: "طلب محمد بن عبيد الله من الهادي أن يُستلف نصف جباية العنب لإنزال العسكر في نجران، فأمر الهادي بذلك من الرعية كلها، فرفضت بنو الحارث وقالت إن الهادي صالحها على ألا يأخذ منها شيئاً."
  en: "Muhammad ibn Ubaydallah asked al-Hadi how to pay the army quartered at Najran. Al-Hadi ordered that half the grape tax be taken early from all the people. Banu al-Harith refused and said that al-Hadi had made peace with them and would take nothing from them."
  ur: "محمد بن عبیداللہ نے ہادی سے پوچھا کہ نجران میں ٹھہرے لشکر کا خرچ کیسے پورا ہو۔ ہادی نے تمام لوگوں سے انگور کے محصول کا نصف پیشگی لینے کا حکم دیا۔ بنو الحارث نے انکار کیا اور کہا کہ ہادی نے ان سے صلح کی تھی کہ کچھ نہیں لیا جائے گا۔"
  es: "Muhammad ibn Ubaydallah preguntó a al-Hadi cómo pagar al ejército acuartelado en Najrán. Al-Hadi ordenó que se cobrara por adelantado la mitad del impuesto sobre la uva a toda la población. Los Banu al-Harith se negaron y dijeron que al-Hadi había hecho las paces con ellos y que no les exigiría nada."
  fr: "Muhammad ibn Ubaydallah demanda à al-Hadi comment payer l'armée cantonnée à Najran. Al-Hadi ordonna que la moitié de l'impôt sur le raisin soit prélevée plus tôt auprès de tous les habitants. Les Banu al-Harith refusèrent, arguant qu'al-Hadi avait fait la paix avec eux et ne leur prendrait rien."
  tr: "Muhammed ibn Ubeyd Allah, Necran'da ordu kurmak için üzüm vergisinin yarısını al-Hadi'den ödünç almasını istedi. Bunun üzerine al-Hadi, bu parayı tüm tebaasından istedi. Ancak Beni el-Harith bunu reddederek, al-Hadi'nin kendilerinden hiçbir şey almaması şartıyla onlarla barış yaptığını söyledi."
  id: "Muhammad ibn Ubayd Allah meminta al-Hadi untuk meminjam setengah dari pajak anggur untuk membentuk pasukan di Najran, lalu al-Hadi memerintahkan agar hal itu dilakukan kepada seluruh rakyat, tetapi Bani al-Harith menolak dan mengatakan bahwa al-Hadi telah berdamai dengan mereka dengan syarat bahwa ia tidak akan mengambil apa pun dari mereka."
