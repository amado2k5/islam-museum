label: { ar: "قتل توران شاه وسلطنة شجر الدر" }
summary:
  ar: "وفي سنة سبع وأربعين أخذت الفرنج دمياط والسلطان الملك الصالح مريض فمات ليلة نصف شعبان فأخفت جاريته أم خليل المسماة شجر الدر موته وأرسلت إلى ولده توران شاه الملك المعظم ليتملك فحضر ثم لم يلبث أن قتل في محرم سنة ثمان وأربعين وثب عليه غلمان أبيه فقتلوه وأمروا عليهم جارية أبيهم شجر الدر وحلف لها الأتراك ولنائبها عز الدين أيبك التركماني فشرعت شجر الدر في الخلع للأمراء والأعطيات ثم استقل عز الدين بالسلطنة في ربيع الآخر ولقب الملك المعز ثم تنصل منها وحلف العسكر للملك الأشرف وله ثمان سنين وبقي عز الدين أتابكه وخطب لهما وضربت السكة باسمهما، وفي سنة اثنتين وخمسين أبطل المعز اسم الملك الأشرف واستقل بالسلطنة {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  en: "In 647 the Franks took Damietta as al-Malik al-Salih lay dying; his slave-girl Umm Khalil — Shajar al-Durr — hid the death and fetched his son Turanshah, who was killed that Muharram by his father's ghilman. They raised Shajar al-Durr over them, the Turks swearing to her and her deputy Izz al-Din Aybak, who took the sultanate as al-Mu'izz in Rabi' II, then set up the eight-year-old al-Ashraf as atabeg-front till 652, when he dropped the name and ruled alone {cite:tarikh-khulafa-minhaj-1434 p. 709}."
