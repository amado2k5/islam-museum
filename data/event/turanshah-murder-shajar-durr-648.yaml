label: { ar: "قتل توران شاه وسلطنة شجر الدر", en: "The Murder of Turanshah and the Sultanate of Shajar al-Durr", es: "El asesinato de Turanshah y el sultanato de Shajar al-Durr", fr: "L'assassinat de Turanshah et le sultanat de Shajar al-Durr" }
summary:
  ar: "وفي سنة سبع وأربعين أخذت الفرنج دمياط والسلطان الملك الصالح مريض فمات ليلة نصف شعبان فأخفت جاريته أم خليل المسماة شجر الدر موته وأرسلت إلى ولده توران شاه الملك المعظم ليتملك فحضر ثم لم يلبث أن قتل في محرم سنة ثمان وأربعين وثب عليه غلمان أبيه فقتلوه وأمروا عليهم جارية أبيهم شجر الدر وحلف لها الأتراك ولنائبها عز الدين أيبك التركماني فشرعت شجر الدر في الخلع للأمراء والأعطيات ثم استقل عز الدين بالسلطنة في ربيع الآخر ولقب الملك المعز ثم تنصل منها وحلف العسكر للملك الأشرف وله ثمان سنين وبقي عز الدين أتابكه وخطب لهما وضربت السكة باسمهما، وفي سنة اثنتين وخمسين أبطل المعز اسم الملك الأشرف واستقل بالسلطنة {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  en: "In 647 the Franks took Damietta as al-Malik al-Salih lay dying; his slave-girl Umm Khalil — Shajar al-Durr — hid the death and fetched his son Turanshah, who was killed that Muharram by his father's ghilman. They raised Shajar al-Durr over them, the Turks swearing to her and her deputy Izz al-Din Aybak, who took the sultanate as al-Mu'izz in Rabi' II, then set up the eight-year-old al-Ashraf as atabeg-front till 652, when he dropped the name and ruled alone {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  es: "En 647, los francos tomaron Damietta mientras al-Malik al-Salih agonizaba; su esclava Umm Khalil — Shajar al-Durr — ocultó la muerte y fue a buscar a su hijo Turanshah, quien fue asesinado ese Muharram por el ghilman de su padre. Colocaron a Shajar al-Durr sobre ellos, y los turcos le juraron lealtad a ella y a su lugarteniente Izz al-Din Aybak, quien tomó el sultanato como al-Mu'izz en Rabi' II, y luego estableció al niño de ocho años al-Ashraf como atabeg-front hasta 652, cuando renunció al nombre y gobernó solo {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  fr: "En 647, les Francs s'emparèrent de Damiette alors qu'al-Malik al-Salih agonisait. Sa servante Umm Khalil, Shajar al-Durr, dissimula le décès et alla chercher son fils Turanshah, qui fut tué ce même mois de Muharram par le ghilman de son père. Les Francs placèrent Shajar al-Durr à leur tête, les Turcs lui prêtant serment, ainsi qu'à son lieutenant Izz al-Din Aybak, qui accéda au sultanat sous le nom d'al-Mu'izz en Rabi' II. Ils installèrent ensuite le jeune al-Ashraf, âgé de huit ans, comme atabeg jusqu'en 652, date à laquelle il abandonna ce titre et régna seul."
