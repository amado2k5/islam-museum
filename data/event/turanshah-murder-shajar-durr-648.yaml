label: { ar: "قتل توران شاه وسلطنة شجر الدر", en: "The Murder of Turanshah and the Sultanate of Shajar al-Durr", es: "El asesinato de Turanshah y el sultanato de Shajar al-Durr", fr: "L'assassinat de Turanshah et le sultanat de Shajar al-Durr", ur: "ترانشاہ کا قتل اور شجر الدر کی سلطنت", tr: "Turan Şah ve Sultan Şecer el-Durr öldürüldü", id: "Turan Shah dan Sultan Shajar al-Durr terbunuh" }
summary:
  ar: "وفي سنة سبع وأربعين أخذت الفرنج دمياط والسلطان الملك الصالح مريض فمات ليلة نصف شعبان فأخفت جاريته أم خليل المسماة شجر الدر موته وأرسلت إلى ولده توران شاه الملك المعظم ليتملك فحضر ثم لم يلبث أن قتل في محرم سنة ثمان وأربعين وثب عليه غلمان أبيه فقتلوه وأمروا عليهم جارية أبيهم شجر الدر وحلف لها الأتراك ولنائبها عز الدين أيبك التركماني فشرعت شجر الدر في الخلع للأمراء والأعطيات ثم استقل عز الدين بالسلطنة في ربيع الآخر ولقب الملك المعز ثم تنصل منها وحلف العسكر للملك الأشرف وله ثمان سنين وبقي عز الدين أتابكه وخطب لهما وضربت السكة باسمهما، وفي سنة اثنتين وخمسين أبطل المعز اسم الملك الأشرف واستقل بالسلطنة {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  en: "In 647 the Franks took Damietta as al-Malik al-Salih lay dying; his slave-girl Umm Khalil — Shajar al-Durr — hid the death and fetched his son Turanshah, who was killed that Muharram by his father's ghilman. They raised Shajar al-Durr over them, the Turks swearing to her and her deputy Izz al-Din Aybak, who took the sultanate as al-Mu'izz in Rabi' II, then set up the eight-year-old al-Ashraf as atabeg-front till 652, when he dropped the name and ruled alone {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  es: "En 647, los francos tomaron Damietta mientras al-Malik al-Salih agonizaba; su esclava Umm Khalil — Shajar al-Durr — ocultó la muerte y fue a buscar a su hijo Turanshah, quien fue asesinado ese Muharram por el ghilman de su padre. Colocaron a Shajar al-Durr sobre ellos, y los turcos le juraron lealtad a ella y a su lugarteniente Izz al-Din Aybak, quien tomó el sultanato como al-Mu'izz en Rabi' II, y luego estableció al niño de ocho años al-Ashraf como atabeg-front hasta 652, cuando renunció al nombre y gobernó solo {cite:tarikh-khulafa-minhaj-1434 p. 709}."
  fr: "En 647, les Francs s'emparèrent de Damiette alors qu'al-Malik al-Salih agonisait. Sa servante Umm Khalil, Shajar al-Durr, dissimula le décès et alla chercher son fils Turanshah, qui fut tué ce même mois de Muharram par le ghilman de son père. Les Francs placèrent Shajar al-Durr à leur tête, les Turcs lui prêtant serment, ainsi qu'à son lieutenant Izz al-Din Aybak, qui accéda au sultanat sous le nom d'al-Mu'izz en Rabi' II. Ils installèrent ensuite le jeune al-Ashraf, âgé de huit ans, comme atabeg jusqu'en 652, date à laquelle il abandonna ce titre et régna seul."
  ur: "647 میں فرینکوں نے دمیٹا کو المالک الصالح کی موت کے طور پر لیا۔ اس کی لونڈی ام خلیل - شجر الدر - نے موت کو چھپایا اور اپنے بیٹے تورانشاہ کو لایا، جو اس محرم کو اس کے باپ کے غلمان نے مارا تھا۔ انہوں نے شجر الدر کو اپنے اوپر اٹھایا، ترکوں نے اس سے اور اس کے نائب عزالدین ایبک کو حلف دیا، جس نے ربیع دوم میں سلطنت کو المعز کے طور پر سنبھالا، پھر آٹھ سالہ الاشرف کو 652 تک عتابی محاذ کے طور پر کھڑا کیا، جب اس نے نام چھوڑ دیا اور تنہا حکومت کی۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 709}۔"
  tr: "47 yılında Franklar Dimyat'ı ele geçirdiler ve Sultan el-Malik el-Salih hastalandı ve Şaban ayının ortasındaki bir gecede öldü. Cariyesi Ümmü Halil, Şecar el-Durr adıyla, ölümünü gizledi ve oğlu Turan Şah el-Malik el-Muazzam'a tahta geçmesi için haber gönderdi. O geldi, ancak kısa süre sonra 48 yılının Muharrem ayında öldürüldü. Babasının hizmetkarları ona saldırdı, öldürdü ve babalarının cariyesi Şecar el-Durr'u liderleri olarak atadılar. Türkler ona ve yardımcısı İzz el-Din Aybak el-Türkmani'ye biat ettiler. Şecar el-Durr, emirlere onur elbiseleri ve hediyeler vermeye başladı. Ardından İzz el-Din, Rabi' el-Akhir'de sultanlığı devraldı ve el-Malik el-Muazzam unvanını aldı. Bunun üzerine o bu bağlılıktan vazgeçti ve ordu, o sırada sekiz yaşında olan el-Malik el-Eşref'e biat etti. İzz el-Din onun atabegi olarak kaldı ve hutbeler onların adına okundu, paralar da onların adına basıldı. 52 yılında el-Mu'izz, el-Malik el-Eşref'in adını kaldırdı ve saltanatı bağımsız olarak üstlendi. {cite:tarikh-khulafa-minhaj-1434 s. 709}"
  id: "Pada tahun 47, bangsa Frank merebut Damietta, dan Sultan al-Malik al-Salih jatuh sakit dan meninggal pada malam pertengahan bulan Sya'ban. Selirnya, Umm Khalil, yang bernama Shajar al-Durr, menyembunyikan kematiannya dan mengirim pesan kepada putranya, Turan Shah al-Malik al-Mu'azzam, untuk naik tahta. Ia datang, tetapi segera terbunuh pada bulan Muharram tahun 48. Para pelayan ayahnya menyerangnya, membunuhnya, dan mengangkat selir ayahnya, Shajar al-Durr, sebagai pemimpin mereka. Bangsa Turki bersumpah setia kepadanya dan kepada wakilnya, Izz al-Din Aybak al-Turkmani. Shajar al-Durr mulai memberikan jubah kehormatan dan hadiah kepada para emir. Kemudian Izz al-Din naik tahta kesultanan pada bulan Rabi' al-Akhir dan diberi gelar al-Malik al-Mu'izz. Kemudian ia melepaskan jabatannya, dan pasukan bersumpah setia kepada al-Malik al-Ashraf, yang saat itu berusia delapan tahun. Izz al-Din tetap menjadi atabegnya, dan khutbah disampaikan atas nama mereka, dan koin dicetak atas nama mereka. Pada tahun 52, al-Mu’izz menghapus nama al-Malik al-Ashraf dan mengambil alih kesultanan secara independen. {cite:tarikh-khulafa-minhaj-1434 p. 709}"
