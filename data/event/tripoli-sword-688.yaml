id: event/tripoli-sword-688
class: event
kind: conquest
label: { ar: "أخذ قلاوون طرابلس بالسيف", en: "Qalawun Takes Tripoli by the Sword", es: "Qalawun toma Trípoli por la espada.", fr: "Qalawun prend Tripoli par l'épée", ur: "قلاون نے تلوار سے طرابلس پر قبضہ کیا۔", tr: "Kalavun Trablus'u kılıçla ele geçirdi.", id: "Qalawun merebut Tripoli dengan pedang." }
summary:
  ar: "وفي سنة ثمان وثمانين أخذ السلطان طرابلس بالسيف وكانت في أيدي الفرنج من سنة ثلاث وخمس مئة إلى الآن وكان أول فتحها في زمن معاوية وأنشأ التاج ابن الأثير كتاباً بالبشارة بذلك إلى صاحب اليمن، وذكر بعضهم أن معنى طرابلس باللسان الرومي ثلاثة حصون مجتمعة {cite:tarikh-khulafa-minhaj-1434 p. 729-730}. وفي طبعة أرناؤوط: نازلها في ربيع الأول ودام الحصار والقتال ورمي المجانيق الكبار وحفر النقوب ليلاً ونهاراً حتى افتتحها بالسيف في رابع ربيع الآخر، فخربها وتركها خاوية على عروشها ثم أنشأوا مدينة على ميل من شرقيها {cite:shadharat-dhahab p. 705}."
  en: "In 688 the sultan took Tripoli by the sword — Frankish-held since 503, first conquered in Mu'awiya's days. 'Tripolis' in the Roman tongue means three forts joined {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  es: "En 688, el sultán tomó Trípoli por la espada; territorio franco desde 503, conquistado por primera vez en tiempos de Mu'awiya. «Trípoli» en latín significa tres fortalezas unidas {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  fr: "En 688, le sultan s'empara de Tripoli par l'épée — ville franque depuis 503, conquise une première fois sous le règne de Mu'awiya. « Tripoli » en latin signifie « trois forteresses accolées » (voir: Tarikh-Khulafa-Minhaj-1434, p. 729-730)."
  ur: "688 میں سلطان نے تلوار کے ذریعے طرابلس پر قبضہ کر لیا - 503 سے فرینکش کے قبضے میں، پہلی بار معاویہ کے دنوں میں فتح ہوا۔ رومی زبان میں 'Tripolis' کا مطلب ہے تین قلعے جوڑ کر 729-730}۔"
  tr: "Hicri 588 yılında Sultan, Trablus'u kılıçla ele geçirdi. Şehir, Hicri 503 yılından o zamana kadar Frankların elindeydi. İlk fethi Muaviye döneminde gerçekleşti. El-Taj İbn el-Athir, Yemen hükümdarına bunu duyuran bir mektup yazdı. Bazıları, Trablus'un Yunanca'da \"birbirine bağlı üç kale\" anlamına geldiğini belirtmiştir {kaynak:tarikh-khulafa-minhaj-1434 s. 729-730}. Arnaut baskısında ise şöyle denmektedir: \"Rabi' el-Evvel ayında kuşattı ve kuşatma ve savaş, büyük mancınıkların bombardımanı ve tünellerin gece gündüz kazılmasıyla devam etti, ta ki dördüncü Rabi' el-Sani'de kılıçla ele geçirene kadar. Şehri yıktı ve harabeye çevirdi. Sonra doğusuna bir mil uzaklıkta bir şehir inşa ettiler {kaynak:şadharat-dhahab s. 705}.\""
  id: "Pada tahun 588 H, Sultan merebut Tripoli dengan pedang. Kota itu telah berada di tangan bangsa Frank sejak tahun 503 H hingga saat itu. Penaklukan pertamanya terjadi pada masa pemerintahan Mu'awiya. Al-Taj Ibn al-Athir menulis surat kepada penguasa Yaman yang mengumumkan hal ini. Beberapa orang menyebutkan bahwa arti Tripoli dalam bahasa Yunani adalah tiga benteng yang bergabung bersama {cite:tarikh-khulafa-minhaj-1434 hlm. 729-730}. Dalam edisi Arnaut: Ia mengepungnya pada bulan Rabi' al-Awwal, dan pengepungan serta pertempuran berlanjut, dengan pengeboman menggunakan ketapel besar dan penggalian terowongan siang dan malam, hingga ia menaklukkannya dengan pedang pada tanggal empat Rabi' al-Thani. Ia menghancurkannya dan meninggalkannya dalam reruntuhan. Kemudian mereka membangun sebuah kota satu mil di sebelah timurnya {cite:shadharat-dhahab hlm. 705}."
