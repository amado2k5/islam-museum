label: { ar: "أخذ قلاوون طرابلس بالسيف" }
summary:
  ar: "وفي سنة ثمان وثمانين أخذ السلطان طرابلس بالسيف وكانت في أيدي الفرنج من سنة ثلاث وخمس مئة إلى الآن وكان أول فتحها في زمن معاوية وأنشأ التاج ابن الأثير كتاباً بالبشارة بذلك إلى صاحب اليمن، وذكر بعضهم أن معنى طرابلس باللسان الرومي ثلاثة حصون مجتمعة {cite:tarikh-khulafa-minhaj-1434 p. 729-730}. وفي طبعة أرناؤوط: نازلها في ربيع الأول ودام الحصار والقتال ورمي المجانيق الكبار وحفر النقوب ليلاً ونهاراً حتى افتتحها بالسيف في رابع ربيع الآخر، فخربها وتركها خاوية على عروشها ثم أنشأوا مدينة على ميل من شرقيها {cite:shadharat-dhahab p. 705}."
  en: "In 688 the sultan took Tripoli by the sword — Frankish-held since 503, first conquered in Mu'awiya's days. 'Tripolis' in the Roman tongue means three forts joined {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
