label: { ar: "إجراء عيون مكة 835هـ", en: "The Channeling of Mecca's Springs, 835", es: "La canalización de los manantiales de La Meca, 835", fr: "La canalisation des sources de La Mecque, 835", ur: "مکہ کے چشموں کی چینلنگ، 835", tr: "Mekke'deki kaplıcaların faaliyete geçmesi, Hicri 835", id: "Pengoperasian mata air Mekah, 835 H" }
summary:
  ar: "في شذرات الذهب سنة خمس وثلاثين وثمان مئة أجريت عيون مكة حتى دخلتها وامتلأت برك باب المعلى ومرت على الصفا وسوق الليل وعم النفع بها {cite:shadharat-dhahab p. 222}."
  en: "835: Mecca's springs were channeled into the city, filling the Bab al-Mu'alla pools and running past al-Safa and the Night Market — 'and the benefit spread' {cite:shadharat-dhahab p. 222}."
  es: "835: Los manantiales de La Meca fueron canalizados hacia la ciudad, llenando las piscinas de Bab al-Mu'alla y pasando por al-Safa y el Mercado Nocturno, 'y el beneficio se extendió' {cita: shadharat-dhahab p. 222}."
  fr: "835: Les sources de La Mecque furent canalisées dans la ville, remplissant les bassins de Bab al-Mu'alla et passant devant al-Safa et le Marché de Nuit — « et le bienfait se répandit » {cite: shadharat-dhahab p. 222}."
  ur: "835: مکہ کے چشمے شہر میں بہہ گئے، باب المؤلّہ کے تالابوں کو بھرتے ہوئے اور الصفا اور رات کے بازار سے گزرتے ہوئے - 'اور فائدہ پھیل گیا'۔ 222}۔"
  tr: "Hicri 835 yılında Şadharat el-Dhahab'da, Mekke'nin pınarlarından sular akmaya başladı ve Mekke'ye girdi, Bab el-Mualla havuzları doldu, Safa ve gece çarşısının üzerinden geçti ve faydası geniş bir alana yayıldı. {cite:şadharat-dhahab s. 222}"
  id: "Dalam kitab Shadharat al-Dhahab, pada tahun 835 Hijriah, mata air Mekah dialirkan hingga masuk ke kota dan kolam-kolam Bab al-Mualla terisi, lalu airnya melewati al-Safa dan pasar malam, dan manfaatnya tersebar luas. {cite:shadharat-dhahab hlm. 222}."
