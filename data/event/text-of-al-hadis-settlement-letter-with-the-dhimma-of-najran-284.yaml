class: event
kind: other
label:
  ar: نص كتاب الهادي في صلحه مع أهل الذمة في نجران على التسع والجزية، جمادى الآخرة 284هـ
  en: 'The text of al-Hadi''s settlement letter with the dhimma of Najran: one-ninth and the jizya, Jumada II 284 AH'
  ur: 'نجران کے اہل ذمہ سے ہادی کے صلح نامے کا متن: نواں حصہ اور جزیہ، جمادی الآخرہ 284ھ'
  es: "El texto de la carta de acuerdo de al-Hadi con la dhimma de Najran: una novena y la jizya, Jumada II 284 AH"
  fr: "Le texte de la lettre de règlement d'al-Hadi avec la dhimma de Najran: un neuvième et la jizya, Jumada II 284 AH"
  tr: "Hadi'nin, Necran'daki Ahd Ehli ile zekât ve cizye konusunda yaptığı barış antlaşmasına dair kitabının metni, Cemâdeü'l-Ahirah 284 Hicri"
  id: "Teks kitab Al-Hadi tentang perjanjian damainya dengan Ahlul Baitullah di Najran mengenai zakat dan jizya, Jumada al-Akhirah 284 H."
summary:
  ar: 'كتاب الصلح الذي كتبه الهادي بخطه وقُرئ على أهل الذمة والمسلمين في نجران: بدأه بحمد الله وبيان فرض الزكاة وأصنافها، وعلّل الصلح بأن الذميين اشتروا أموالاً من المسلمين فبطلت أعشارها فجعل عليهم التسع فيما سُقي سيحاً ونصفه فيما سُقي بالدوالي، وأجاز لهم الشراء بذلك، وفرض جزية الرؤوس ثمانية وأربعين درهماً للموسرين وأربعة وعشرين للأوساط واثني عشر للمتعيشين، وأوجب حياطتهم على ولاة المسلمين.'
  en: 'The settlement letter al-Hadi wrote in his own hand and had read to the dhimma and the Muslims at Najran: it opens with praise of God and the obligation of zakat and its heads, explains the settlement by the dhimmis'' purchase of property from Muslims which lapsed its tithes, sets one-ninth on what is watered by flowing or rain water and half of it on what is watered by wheels, allows them to buy on those terms, fixes a head jizya of forty-eight dirhams for the wealthy, twenty-four for the middle and twelve for the working, and obliges Muslim governors to protect them.'
  ur: 'وہ صلح نامہ جو ہادی نے اپنے ہاتھ سے لکھا اور نجران میں ذمیوں اور مسلمانوں کو پڑھ کر سنایا گیا: اس کا آغاز اللہ کی حمد اور زکوٰۃ اور اس کے مصارف کے بیان سے ہے، ذمیوں کے مسلمانوں سے مال خریدنے سے عشر ختم ہونے کو صلح کی وجہ بتاتا ہے، بہتے یا بارش کے پانی سے سیراب پر نواں حصہ اور رہٹ سے سیراب پر اس کا نصف مقرر کرتا ہے، اسی پر خریدنے کی اجازت دیتا ہے، سر کا جزیہ مالداروں پر اڑتالیس درہم، درمیانوں پر چوبیس اور محنت کشوں پر بارہ مقرر کرتا ہے اور مسلمان حکام پر ان کی حفاظت لازم کرتا ہے۔'
  es: "La carta de conciliación que al-Hadi escribió de su puño y letra y que leyó a los dhimmas y a los musulmanes de Najran comienza con alabanzas a Dios y a la obligación del zakat y sus responsables, explica la conciliación mediante la compra por parte de los dhimmas de propiedades a los musulmanes que habían dejado de pagar sus diezmos, fija un noveno sobre lo que se riega con agua corriente o de lluvia y la mitad sobre lo que se riega con agua de riego, les permite comprar en esas condiciones, fija una jizya de cuarenta y ocho dirhams para los ricos, veinticuatro para la clase media y doce para los trabajadores, y obliga a los gobernadores musulmanes a protegerlos."
  fr: "La lettre de règlement écrite de sa propre main par al-Hadi et lue aux dhimmis et aux musulmans à Najran: elle commence par des louanges à Dieu et l'obligation de la zakat et ses composantes, explique le règlement par l'achat, par les dhimmis, de biens appartenant à des musulmans qui avaient manqué à leurs obligations de paiement de la dîme, fixe un neuvième sur les biens irrigués par l'eau courante ou de pluie et la moitié sur ceux irrigués par des roues, leur permet d'acheter à ces conditions, fixe une jizya de quarante-huit dirhams pour les riches, vingt-quatre pour la classe moyenne et douze pour les classes populaires, et oblige les gouverneurs musulmans à les protéger."
  tr: "Hadi'nin kendi el yazısıyla yazdığı ve Necran'da Ahit Ehli ve Müslümanlara okunan Uzlaşma Kitabı: Kitaba Allah'ı övgüyle anarak ve zekâtın yükümlülüğünü ve çeşitlerini açıklayarak başladı ve uzlaşmayı şöyle açıkladı: Ahit Ehli Müslümanlardan para satın almıştı, bu yüzden zekâtları geçersizdi, bu yüzden onlardan akarsu ile sulanan topraklardan dokuzda birini, su çarklarıyla sulanan topraklardan ise yarısını vermelerini istedi ve bununla alışveriş yapmalarına izin verdi. Zenginlerden kırk sekiz dirhem, orta sınıftan yirmi dört dirhem ve yoksullardan on iki dirhem kafa vergisi koydu ve Müslüman valileri onları korumakla yükümlü kıldı."
  id: "Kitab Rekonsiliasi, yang ditulis oleh Al-Hadi dengan tulisan tangannya sendiri dan dibacakan kepada Ahlul Baitullah dan kaum Muslimin di Najran: Beliau memulainya dengan memuji Allah dan menjelaskan kewajiban zakat dan jenis-jenisnya, dan beliau menjelaskan rekonsiliasi dengan mengatakan bahwa Ahlul Baitullah telah membeli uang dari kaum Muslimin, sehingga persepuluhan mereka menjadi tidak sah, maka beliau mewajibkan mereka membayar sepersembilan dari hasil irigasi sungai dan setengahnya dari hasil irigasi kincir air, dan beliau mengizinkan mereka untuk membeli dengan uang itu, dan beliau mengenakan pajak kepala sebesar empat puluh delapan dirham untuk orang kaya, dua puluh empat untuk kelas menengah, dan dua belas untuk mereka yang hidup dalam kemiskinan, dan beliau mewajibkan para gubernur Muslim untuk melindungi mereka."
