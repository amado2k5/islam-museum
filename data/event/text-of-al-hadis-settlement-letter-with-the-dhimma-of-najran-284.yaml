id: event/text-of-al-hadis-settlement-letter-with-the-dhimma-of-najran-284
class: event
kind: other
label:
  ar: نص كتاب الهادي في صلحه مع أهل الذمة في نجران على التسع والجزية، جمادى الآخرة 284هـ
  en: 'The text of al-Hadi''s settlement letter with the dhimma of Najran: one-ninth and the jizya, Jumada II 284 AH'
  ur: 'نجران کے اہل ذمہ سے ہادی کے صلح نامے کا متن: نواں حصہ اور جزیہ، جمادی الآخرہ 284ھ'
summary:
  ar: 'كتاب الصلح الذي كتبه الهادي بخطه وقُرئ على أهل الذمة والمسلمين في نجران: بدأه بحمد الله وبيان فرض الزكاة وأصنافها، وعلّل الصلح بأن الذميين اشتروا أموالاً من المسلمين فبطلت أعشارها فجعل عليهم التسع فيما سُقي سيحاً ونصفه فيما سُقي بالدوالي، وأجاز لهم الشراء بذلك، وفرض جزية الرؤوس ثمانية وأربعين درهماً للموسرين وأربعة وعشرين للأوساط واثني عشر للمتعيشين، وأوجب حياطتهم على ولاة المسلمين.'
  en: 'The settlement letter al-Hadi wrote in his own hand and had read to the dhimma and the Muslims at Najran: it opens with praise of God and the obligation of zakat and its heads, explains the settlement by the dhimmis'' purchase of property from Muslims which lapsed its tithes, sets one-ninth on what is watered by flowing or rain water and half of it on what is watered by wheels, allows them to buy on those terms, fixes a head jizya of forty-eight dirhams for the wealthy, twenty-four for the middle and twelve for the working, and obliges Muslim governors to protect them.'
  ur: 'وہ صلح نامہ جو ہادی نے اپنے ہاتھ سے لکھا اور نجران میں ذمیوں اور مسلمانوں کو پڑھ کر سنایا گیا: اس کا آغاز اللہ کی حمد اور زکوٰۃ اور اس کے مصارف کے بیان سے ہے، ذمیوں کے مسلمانوں سے مال خریدنے سے عشر ختم ہونے کو صلح کی وجہ بتاتا ہے، بہتے یا بارش کے پانی سے سیراب پر نواں حصہ اور رہٹ سے سیراب پر اس کا نصف مقرر کرتا ہے، اسی پر خریدنے کی اجازت دیتا ہے، سر کا جزیہ مالداروں پر اڑتالیس درہم، درمیانوں پر چوبیس اور محنت کشوں پر بارہ مقرر کرتا ہے اور مسلمان حکام پر ان کی حفاظت لازم کرتا ہے۔'
