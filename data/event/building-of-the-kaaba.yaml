label: { en: "The Raising of the Kaaba’s Foundations", ar: "رفع قواعد الكعبة", fr: "L'élévation des fondations de la Ka'ba", es: "La elevación de los cimientos de la Kaaba", ur: "خانہ کعبہ کی بنیادوں کو اٹھانا", tr: "Kabe'nin temellerinin yükseltilmesi", id: "Membangun fondasi Ka'bah" }
summary:
  en: "On the third recorded journey, Ibrahim finds Ismail sharpening arrows beneath a tree by Zamzam; together the aged father and the grown son raise the foundations of the House, and Ibrahim calls mankind to the pilgrimage as commanded."
  ar: "في الرحلة الثالثة المحفوظة لقي إبراهيم ابنه إسماعيل يبري نبلاً تحت دوحة قريباً من زمزم، فرفعا معاً قواعد البيت، وأذّن إبراهيم في الناس بالحج كما أُمر."
  fr: "Lors du troisième voyage rapporté, Ibrahim trouve Ismail en train de tailler des flèches sous un arbre près de Zamzam ; ensemble, le vieux père et le fils devenu homme élèvent les fondations de la Maison, et Ibrahim appelle les hommes au pèlerinage, comme il lui a été ordonné."
  es: "En el tercer viaje registrado, Ibrahim encuentra a Ismail afilando flechas bajo un árbol junto al río Zamzam; juntos, el anciano padre y el hijo ya adulto levantan los cimientos de la Casa, e Ibrahim llama a la humanidad a la peregrinación tal como se le había ordenado."
  ur: "تیسرے ریکارڈ شدہ سفر پر، ابراہیم نے اسماعیل کو زمزم کے درخت کے نیچے تیروں کو تیز کرتے ہوئے پایا۔ بوڑھے باپ اور بڑا بیٹا مل کر گھر کی بنیادیں اٹھاتے ہیں، اور ابراہیم نے حکم کے مطابق انسانوں کو حج کے لیے بلایا۔"
  tr: "Kaydedilen üçüncü yolculukta İbrahim, Zemzem yakınlarındaki bir ağacın altında ok bilemekte olan oğlu İsmail ile karşılaştı. Birlikte evin temellerini attılar ve İbrahim, kendisine emredildiği gibi insanları Hacca çağırdı."
  id: "Dalam perjalanan ketiga yang tercatat, Ibrahim bertemu dengan putranya, Ismael, yang sedang mengasah anak panah di bawah pohon dekat Zamzam. Bersama-sama mereka membangun fondasi Baitullah, dan Ibrahim menyeru umat Islam untuk menunaikan ibadah haji sebagaimana yang telah diperintahkan kepadanya."
