label:
  ar: "سفرة الطبري الثانية إلى طبرستان"
  en: "al-Tabari's second journey home to Tabaristan"
  ur: "طبری کا طبرستان کا دوسرا سفر"
summary:
  ar: "في نصف قرنه البغدادي لم يخرج الطبري إلا في سفرتين إلى بلده طبرستان، كانت الثانية منهما سنة ٢٨٩-٢٩٠هـ/٩٠٢-٩٠٣م، وكان قد استقر بناحية الشماسية من بغداد بحلول سنة ٢٩٠هـ {cite:encyclopaedia-of-islam-2 vol. 10 p. 21-22}."
  en: "During his half-century in Baghdad al-Tabari made only two journeys to his native Tabaristan, the second in 289-90/902-3; by 290/903 he was installed in the al-Shammasiyya quarter on the eastern side of the city, where he lived until his death {cite:encyclopaedia-of-islam-2 vol. 10 p. 21-22}."
  ur: "بغداد میں اپنی نصف صدی کے قیام میں طبری صرف دو مرتبہ اپنے وطن طبرستان گئے، جن میں سے دوسرا سفر 289-90ھ/902-903ء میں تھا؛ 290ھ/903ء تک وہ شہر کے مشرقی محلے الشماسیہ میں مقیم ہو گئے تھے جہاں وہ وفات تک رہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 21-22}."
