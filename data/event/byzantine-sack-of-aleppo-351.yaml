id: event/byzantine-sack-of-aleppo-351
class: event
kind: massacre
label: { ar: "ملك الروم مدينة حلب", en: "Byzantine capture of Aleppo", fr: "La prise d'Alep par les Byzantins", es: "Captura bizantina de Alepo", ur: "حلب پر بازنطینی قبضہ", tr: "Halep'in Roma kralı", id: "Raja Romawi dari Aleppo" }
summary:
  ar: "في سنة 351هـ استولى الروم على مدينة حلب دون قلعتها؛ سار الدمستق إليها ولم يشعر به المسلمون إذ كان قد خلف عسكره بقيصرية فكبس مدينة حلب ولم يعلم بها سيف الدولة حتى بلغها العدو فخرج إليه وقاتله قتالاً عظيماً فقُتل أكثر أصحابه ولم يبق من أولاد داود بن حمدان أحد قتلوا جميعهم وانتزم سيف الدولة في نفر يسير وظفر الدمستق بداره خارج حلب المعروفة بالدارين فوجد فيها ثلاثمائة بدرة من الدراهم وأخذ له ألفاً وأربعمائة بغل وما لا يحصى من السلاح فأجلى الجامع وخرب الدار وملك الحضر ونقب في السور ثلمة، ودخل الروم البلد بالسيف يقتلون من وجدوا ولا يرفعونه حتى تعبوا، وكان في حلب ألف وأربعمائة من الأسرى فتخلصوا وأخذوا السلاح وقتلوا الناس وسبي من البلد بضعة عشر ألف صبي وصبية وأُحرقت المساجد، وأقام الدمستق تسعة أيام ثم انصرف بعد قتل ابن أخت الملك قرب باب القلعة فقتل من معه من أسرى المسلمين وكانوا ألفاً ومائتي رجل وعاد إلى بلاده وأمر أهل حلب بالزراعة والعمارة ليعودوا إليها بزمة {cite:kamil-ibn-al-athir p. 400-401}."
  en: "In 351 the Domesticos stormed Aleppo while Sayf al-Dawla lay unprepared — the sortie destroyed, the Darayin palace plundered of three hundred purses of dirhams, a breach opened, the city put to the sword till the killers wearied; fifteen hundred Muslim prisoners freed themselves and fought back, fifteen thousand youths were taken captive, mosques burned. Nine days on, the emperor's nephew dead at the citadel gate, the Byzantines withdrew slaughtering their Muslim prisoners {cite:kamil-ibn-al-athir p. 400-401}."
  fr: "En 351, le Domestique prit Alep d'assaut alors que Sayf al-Dawla n'était pas préparé : la sortie fut anéantie, le palais de Darayin pillé de trois cents bourses de dirhams, une brèche ouverte, la ville passée au fil de l'épée jusqu'à ce que les tueurs se lassent ; mille cinq cents prisonniers musulmans se libérèrent et ripostèrent, quinze mille jeunes gens furent emmenés captifs, les mosquées incendiées. Neuf jours plus tard, le neveu de l'empereur étant mort à la porte de la citadelle, les Byzantins se retirèrent en massacrant leurs prisonniers musulmans {cite:kamil-ibn-al-athir p. 400-401}."
  es: "En 351, los Domesticos asaltaron Alepo mientras Sayf al-Dawla estaba desprevenida; la salida fue destruida, el palacio de Darayin fue saqueado, robándose trescientos dirhams, se abrió una brecha y la ciudad fue arrasada hasta que los asesinos se cansaron; mil quinientos prisioneros musulmanes se liberaron y contraatacaron, quince mil jóvenes fueron capturados y las mezquitas incendiadas. Nueve días después, el sobrino del emperador murió en la puerta de la ciudadela, los bizantinos se retiraron masacrando a sus prisioneros musulmanes {cita:kamil-ibn-al-athir págs. 400-401}."
  ur: "351 میں ملکی باشندوں نے حلب پر دھاوا بول دیا جب کہ سیف الدولہ بغیر تیاری کے لیٹے ہوئے تھے - جھڑپ تباہ ہو گئی، دارائن محل تین سو درہم کے پرس لوٹ لیا گیا، ایک شگاف کھل گیا، شہر تلوار سے چلا گیا یہاں تک کہ قاتل تھک گئے۔ پندرہ سو مسلمان قیدیوں نے خود کو آزاد کرایا اور جوابی جنگ کی، پندرہ ہزار نوجوان اسیر ہو گئے، مساجد جلا دی گئیں۔ نو دن بعد، شہنشاہ کا بھتیجا قلعہ کے دروازے پر مر گیا، بازنطینی اپنے مسلمان قیدیوں کو ذبح کرتے ہوئے واپس چلے گئے۔ 400-401}۔"
  tr: "Hicri 351 yılında Romalılar Halep şehrini ele geçirdiler, ancak kalesini değil. Bizanslı general, ordusunu Caesarea'da bıraktığı için Müslümanlar tarafından fark edilmeden Halep'e doğru ilerledi. Ardından Halep şehrini kuşattı ve Sayf el-Dawla, düşman şehre ulaşana kadar bundan habersizdi. Sayf el-Dawla daha sonra onu karşılamak için dışarı çıktı ve şiddetli bir savaş verdi. Arkadaşlarının çoğu öldürüldü ve Davud ibn Hamdan'ın oğullarından hiçbiri hayatta kalmadı; hepsi öldürüldü. Sayf el-Dawla küçük bir kuvvetle kaldı. Bizanslı general, Halep dışındaki el-Darayn olarak bilinen evini ele geçirdi ve burada üç yüz dirhemlik kese, bin dört yüz katır ve sayısız silah ele geçirdi. Camiyi boşalttı, evi yıktı, şehri kontrol altına aldı ve surda bir gedik açtı. Bizanslılar kılıçlarıyla şehre girdiler, buldukları herkesi öldürdüler ve tükenene kadar parmaklarını bile kıpırdatmadılar. Halep'te bin dört yüz esir vardı, ancak kaçtılar, silahları ele geçirdiler, halkı öldürdüler ve şehirden birkaç bin erkek ve kız çocuğunu esir aldılar. Camiler yakıldı. Bizans generali dokuz gün kaldı, sonra kale kapısının yakınında kralın yeğenini öldürdükten sonra geri çekildi. Yanındaki bin iki yüz Müslüman esiri öldürdü ve topraklarına döndü. Halep halkına toprakları ekip biçmelerini ve yeniden inşa etmelerini emretti ki, güçlü bir şekilde geri dönebilsinler. {kaynak: Kamil İbn el-Athir s. 400-401}"
  id: "Pada tahun 351 H, bangsa Romawi merebut kota Aleppo, tetapi tidak bentengnya; Jenderal Bizantium bergerak menuju Aleppo tanpa terdeteksi oleh kaum Muslim, karena ia telah meninggalkan pasukannya di Caesarea. Ia kemudian mengepung kota Aleppo, dan Sayf al-Dawla tidak menyadari hal ini sampai musuh tiba. Sayf al-Dawla kemudian keluar untuk menghadapinya dan bertempur sengit. Sebagian besar rekan-rekannya terbunuh, dan tidak satu pun dari putra-putra Dawud ibn Hamdan yang selamat; mereka semua terbunuh. Sayf al-Dawla tetap tinggal dengan pasukan kecil. Jenderal Bizantium merebut rumahnya di luar Aleppo, yang dikenal sebagai al-Darayn, di mana ia menemukan tiga ratus kantong dirham dan menyita empat belas ratus keledai dan senjata yang tak terhitung jumlahnya. Ia mengosongkan masjid, menghancurkan rumah itu, menguasai kota, dan membuat celah di tembok. Pasukan Bizantium memasuki kota dengan pedang mereka, membunuh siapa pun yang mereka temukan dan tidak mengangkat jari sampai mereka kelelahan. Terdapat empat belas ratus tawanan di Aleppo, tetapi mereka melarikan diri, merebut senjata, membunuh orang-orang, dan menawan beberapa ribu anak laki-laki dan perempuan dari kota itu. Masjid-masjid dibakar. Jenderal Bizantium tinggal selama sembilan hari, kemudian mundur setelah membunuh keponakan raja di dekat gerbang benteng. Dia membunuh dua belas ratus tawanan Muslim yang bersamanya dan kembali ke wilayahnya. Dia memerintahkan penduduk Aleppo untuk mengolah tanah dan membangun kembali agar mereka dapat kembali ke sana dengan kekuatan penuh. {cite:kamil-ibn-al-athir hlm. 400-401}."
