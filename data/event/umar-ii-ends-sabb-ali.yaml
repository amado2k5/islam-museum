label: { ar: "إبطال سب علي في الخطبة" }
summary:
  ar: "كانت بنو أمية يسبون علي بن أبي طالب في الخطبة، فلما ولي عمر بن عبد العزيز أبطل ذلك وكتب إلى نوابه بإبطاله وقرأ مكانه آية العدل والإحسان فاستمرت قراءتها في الخطبة منذ ذلك العهد {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  en: "The Umayyads had cursed Ali ibn Abi Talib in the sermon; when Umar ibn Abd al-Aziz took power he abolished it, wrote to his deputies ordering its abolition, and recited in its place the verse of justice and beneficence — its recitation in the sermon has continued ever since {cite:tarikh-khulafa-minhaj-1434 p. 394}."
