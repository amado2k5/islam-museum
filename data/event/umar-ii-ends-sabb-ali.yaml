label: { ar: "إبطال سب علي في الخطبة", en: "Abolition of Cursing Ali in the Sermon", es: "Abolición de las maldiciones contra Alí en el sermón.", fr: "Abolition de la malédiction d'Ali dans le sermon", ur: "خطبہ میں علی پر لعنت کرنے کا خاتمہ" }
summary:
  ar: "كانت بنو أمية يسبون علي بن أبي طالب في الخطبة، فلما ولي عمر بن عبد العزيز أبطل ذلك وكتب إلى نوابه بإبطاله وقرأ مكانه آية العدل والإحسان فاستمرت قراءتها في الخطبة منذ ذلك العهد {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  en: "The Umayyads had cursed Ali ibn Abi Talib in the sermon; when Umar ibn Abd al-Aziz took power he abolished it, wrote to his deputies ordering its abolition, and recited in its place the verse of justice and beneficence — its recitation in the sermon has continued ever since {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  es: "Los omeyas habían maldecido a Ali ibn Abi Talib en el sermón; cuando Umar ibn Abd al-Aziz tomó el poder, lo abolió, escribió a sus diputados ordenando su abolición y recitó en su lugar el versículo de justicia y beneficencia; su recitación en el sermón ha continuado desde entonces {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  fr: "Les Omeyyades avaient maudit Ali ibn Abi Talib dans le sermon; lorsqu'Umar ibn Abd al-Aziz prit le pouvoir, il l'abolit, écrivit à ses députés pour ordonner son abolition et récita à sa place le verset de la justice et de la bienfaisance — sa récitation dans le sermon s'est poursuivie depuis lors {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  ur: "امویوں نے خطبہ میں علی ابن ابی طالب پر لعنت کی تھی؛ جب عمر بن عبدالعزیز نے اقتدار سنبھالا تو اس نے اسے ختم کر دیا، اپنے نائبین کو اس کے خاتمے کا حکم دیتے ہوئے لکھا اور اس کی جگہ عدل و احسان کی آیت کی تلاوت کی- خطبہ میں اس کی تلاوت تب سے جاری ہے۔ 394}۔"
