kind: revolt
label: { ar: "جم سلطان يُبايَع في بورصة ثمانية عشر يوماً", en: "Jem Sultan hailed at Bursa for eighteen days", ur: "جم سلطان کی بورصہ میں اٹھارہ دن کی بیعت", es: "Jem Sultan fue aclamado en Bursa durante dieciocho días.", fr: "Jem Sultan a été salué à Bursa pendant dix-huit jours", tr: "Cem Sultan, Bursa'da on sekiz gün sürecek biat yemini etti.", id: "Cem Sultan mengucapkan sumpah setia di Bursa selama delapan belas hari." }
summary:
  ar: "في الحرب الأهلية بعد وفاة محمد الفاتح سنة ٨٨٦هـ/١٤٨١م وقف أهل بورصة مع الأمير جم الذي بقي فيها سلطاناً ثمانية عشر يوماً وضرب بها السكك باسمه وعقد على حكم الأناضول وبورصة عاصمة له {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}؛ ويذكر الصلابي أنه كان مقيماً ببورصة حين بلغه خبر وفاة أبيه فأخذ بيعة أهلها، واقترح على أخيه بايزيد قسمة الدولة فرفض، فسار بايزيد بجيش إلى بورصة وهاجمها وفرّ جم إلى سلطان المماليك قايتباي بمصر {cite:dawlat-uthmaniyya-salabi p. 163}."
  en: "In the civil war after Mehmed II's death in 886/1481 the people of Bursa sided with Prince Jem, who held the town as sultan for eighteen days, struck coins in his name and planned to rule at least Anatolia with Bursa as capital {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Al-Salabi has him resident at Bursa when his father died: he took the townspeople's allegiance, proposed dividing the empire, and when Bayezid refused and marched on Bursa, Jem fled to the Mamluk sultan Qaytbay in Egypt {cite:dawlat-uthmaniyya-salabi p. 163}."
  ur: "886ھ/1481ء میں فاتح کی وفات کے بعد خانہ جنگی میں بورصہ کے لوگ شہزادہ جم کے ساتھ تھے، جس نے اٹھارہ دن وہاں سلطان کے طور پر حکومت کی، اپنے نام کے سکے ڈھالے اور کم از کم اناطولیہ پر بورصہ کو دارالحکومت بنا کر حکومت کا ارادہ کیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}۔ صلابی کے مطابق وہ باپ کی وفات کی خبر پر بورصہ میں مقیم تھا، اہلِ شہر سے بیعت لی، بھائی بایزید کو سلطنت بانٹنے کی پیشکش کی، اور جب بایزید نے انکار کر کے بورصہ پر چڑھائی کی تو جم مصر میں سلطان قایتبای کے پاس بھاگ گیا {cite:dawlat-uthmaniyya-salabi p. 163}۔"
  es: "En la guerra civil que siguió a la muerte de Mehmed II en 886/1481, el pueblo de Bursa se puso del lado del príncipe Jem, quien gobernó la ciudad como sultán durante dieciocho días, acuñó monedas en su nombre y planeó gobernar al menos Anatolia con Bursa como capital {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Al-Salabi lo sitúa en Bursa cuando murió su padre: se ganó la lealtad de los habitantes de la ciudad, propuso dividir el imperio y, cuando Bayezid se negó y marchó sobre Bursa, Jem huyó al sultán mameluco Qaytbay en Egipto {cite:dawlat-uthmaniyya-salabi p. 163}."
  fr: "Lors de la guerre civile qui suivit la mort de Mehmed II en 886/1481, les habitants de Bursa se rangèrent du côté du prince Jem, qui occupa la ville en tant que sultan pendant dix-huit jours, fit frapper des pièces de monnaie à son nom et projeta de régner au moins sur l'Anatolie, avec Bursa pour capitale (encyclopédie de l'islam, vol. 2, p. 1398). Al-Salabi indique qu'il résidait à Bursa à la mort de son père: il obtint l'allégeance des habitants, proposa de diviser l'empire, et lorsque Bayezid refusa et marcha sur Bursa, Jem s'enfuit auprès du sultan mamelouk Qaytbay en Égypte (dawlat uthmaniyya salabi, p. 163)."
  tr: "Hicri 886/Miladi 1481 yılında Muhammed el-Fatih'in ölümünden sonra çıkan iç savaşta, Bursa halkı Prens Cem'in yanında yer aldı. Cem, on sekiz gün boyunca orada sultan olarak kaldı, kendi adına sikke bastırdı ve Bursa'yı başkenti yaparak Anadolu'nun yönetimini kurdu. {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 1398}. El-Salabi, Cem'in babasının ölüm haberini aldığında Bursa'da bulunduğunu, bu yüzden halkın biatını aldığını ve kardeşi Bayezid'e devletin bölünmesini önerdiğini, ancak Bayezid'in bunu reddettiğini belirtir. Bunun üzerine Bayezid bir orduyla Bursa'ya yürüdü ve şehre saldırdı. Cem ise Mısır'daki Memlük Sultanı Kaytbey'e sığındı. {kaynak:dawlat-uthmaniyya-salabi s. 163}"
  id: "Dalam perang saudara setelah kematian Muhammad al-Fatih pada tahun 886 H/1481 M, penduduk Bursa berpihak kepada Pangeran Cem, yang tetap menjadi Sultan di sana selama delapan belas hari dan mencetak koin atas namanya serta mendirikan pemerintahan Anatolia dengan Bursa sebagai ibu kotanya {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Al-Salabi menyebutkan bahwa ia tinggal di Bursa ketika menerima kabar kematian ayahnya, sehingga ia mengambil sumpah setia dari penduduknya dan menyarankan kepada saudaranya Bayezid untuk membagi negara, tetapi Bayezid menolak. Maka Bayezid berbaris dengan pasukan ke Bursa dan menyerangnya, dan Cem melarikan diri ke Sultan Mamluk Qaitbay di Mesir {cite:dawlat-uthmaniyya-salabi p. 163}."
