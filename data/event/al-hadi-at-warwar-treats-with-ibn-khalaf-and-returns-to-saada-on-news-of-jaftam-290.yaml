id: event/al-hadi-at-warwar-treats-with-ibn-khalaf-and-returns-to-saada-on-news-of-jaftam-290
class: event
kind: other
label:
  ar: "إقامة الهادي بورور وحديثه مع ابن خلف وعودته إلى صعدة لما بلغه خبر جفتم، 290هـ"
  en: "Al-Hadi at Warwar, the talks with Ibn Khalaf and his return to Sa'da on news of Jaftam, 290 AH"
  ur: "ہادی کا ورور میں قیام، ابن خلف سے بات چیت اور جفتم کی خبر پر صعدہ واپسی، 290ھ"
summary:
  ar: "انصرف الهادي إلى ورور وأقام بها، فاستنهض همدان فثقلت، وكتب إلى الجعفري يسأله معونة من المال فثقل عن ذلك، وكان الدعام يكاتب ابن خلف في الصلح، وجرى بين الهادي وابن خلف كلام على أن ينصرف الهادي من ورور فإذا وصل صعدة خلّى ابن خلف ابنه وأصحابه، فلم يجبه إلى ذلك، ثم وصله كتاب بأن قائداً لبني العباس اسمه جفتم وصل إلى مكة فخاف على أهله وصار إلى صعدة."
  en: "al-Hadi withdrew to Warwar and stayed there; he roused Hamdan, who were slow, and wrote to al-Ja'fari asking for money in aid, who held back; al-Da'am was writing to Ibn Khalaf about peace, and words passed between al-Hadi and Ibn Khalaf on the terms that al-Hadi would leave Warwar and, once he reached Sa'da, Ibn Khalaf would free his son and companions, which was not agreed; then a letter reached him that a commander of the Banu al-Abbas named Jaftam had reached Mecca, and he feared for his household and went to Sa'da."
  ur: "ہادی ورور کی طرف لوٹے اور وہیں ٹھہرے؛ انہوں نے ہمدان کو اٹھانا چاہا مگر وہ سست رہے، جعفری کو لکھا کہ مال کی کچھ مدد بھیجے تو اس نے تاخیر کی، اور دعام ابن خلف سے صلح کی خط و کتابت کرتے رہے؛ ہادی اور ابن خلف کے بیچ اس پر بات ہوئی کہ ہادی ورور سے لوٹ جائیں اور صعدہ پہنچتے ہی ابن خلف ان کے بیٹے اور ساتھیوں کو چھوڑ دے، مگر یہ نہ مانا گیا؛ پھر انہیں خط پہنچا کہ بنی عباس کا ایک سالار جفتم مکہ پہنچا ہے تو وہ اپنے گھر والوں کے لیے ڈرے اور صعدہ چلے گئے۔"
