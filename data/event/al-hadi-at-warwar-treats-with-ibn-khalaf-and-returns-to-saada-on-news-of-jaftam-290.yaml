id: event/al-hadi-at-warwar-treats-with-ibn-khalaf-and-returns-to-saada-on-news-of-jaftam-290
class: event
kind: other
label:
  ar: "إقامة الهادي بورور وحديثه مع ابن خلف وعودته إلى صعدة لما بلغه خبر جفتم، 290هـ"
  en: "Al-Hadi at Warwar, the talks with Ibn Khalaf and his return to Sa'da on news of Jaftam, 290 AH"
  ur: "ہادی کا ورور میں قیام، ابن خلف سے بات چیت اور جفتم کی خبر پر صعدہ واپسی، 290ھ"
  es: "Al-Hadi en Warwar, las conversaciones con Ibn Khalaf y su regreso a Sa'da tras las noticias de Jaftam, 290 AH."
  fr: "Al-Hadi à Warwar, les entretiens avec Ibn Khalaf et son retour à Sa'da suite à la nouvelle de Jaftam, 290 AH"
  tr: "El-Hadi Burur'un İbn Halef ile kalışı ve görüşmesi, ve Caftam haberini aldıktan sonra Sa'de'ye dönüşü, Hicri 290."
  id: "Kunjungan dan percakapan Al-Hadi Burur dengan Ibn Khalaf, dan kepulangannya ke Sa'dah ketika menerima kabar tentang Jaftam, 290 H."
summary:
  ar: "انصرف الهادي إلى ورور وأقام بها، فاستنهض همدان فثقلت، وكتب إلى الجعفري يسأله معونة من المال فثقل عن ذلك، وكان الدعام يكاتب ابن خلف في الصلح، وجرى بين الهادي وابن خلف كلام على أن ينصرف الهادي من ورور فإذا وصل صعدة خلّى ابن خلف ابنه وأصحابه، فلم يجبه إلى ذلك، ثم وصله كتاب بأن قائداً لبني العباس اسمه جفتم وصل إلى مكة فخاف على أهله وصار إلى صعدة."
  en: "al-Hadi withdrew to Warwar and stayed there; he roused Hamdan, who were slow, and wrote to al-Ja'fari asking for money in aid, who held back; al-Da'am was writing to Ibn Khalaf about peace, and words passed between al-Hadi and Ibn Khalaf on the terms that al-Hadi would leave Warwar and, once he reached Sa'da, Ibn Khalaf would free his son and companions, which was not agreed; then a letter reached him that a commander of the Banu al-Abbas named Jaftam had reached Mecca, and he feared for his household and went to Sa'da."
  ur: "ہادی ورور کی طرف لوٹے اور وہیں ٹھہرے؛ انہوں نے ہمدان کو اٹھانا چاہا مگر وہ سست رہے، جعفری کو لکھا کہ مال کی کچھ مدد بھیجے تو اس نے تاخیر کی، اور دعام ابن خلف سے صلح کی خط و کتابت کرتے رہے؛ ہادی اور ابن خلف کے بیچ اس پر بات ہوئی کہ ہادی ورور سے لوٹ جائیں اور صعدہ پہنچتے ہی ابن خلف ان کے بیٹے اور ساتھیوں کو چھوڑ دے، مگر یہ نہ مانا گیا؛ پھر انہیں خط پہنچا کہ بنی عباس کا ایک سالار جفتم مکہ پہنچا ہے تو وہ اپنے گھر والوں کے لیے ڈرے اور صعدہ چلے گئے۔"
  es: "Al-Hadi se retiró a Warwar y se quedó allí; despertó a Hamdan, que se mostraba lento, y escribió a Al-Ja'fari pidiéndole dinero en ayuda, quien se negó; Al-Da'am escribía a Ibn Khalaf sobre la paz, y hubo un intercambio de palabras entre Al-Hadi e Ibn Khalaf sobre los términos de que Al-Hadi abandonaría Warwar y, una vez que llegara a Sa'da, Ibn Khalaf liberaría a su hijo y a sus compañeros, lo cual no fue acordado; luego le llegó una carta informándole de que un comandante de los Banu al-Abbas llamado Jaftam había llegado a La Meca, y temiendo por su familia, se dirigió a Sa'da."
  fr: "Al-Hadi se retira à Warwar et y demeura. Il réveilla Hamdan, qui tarda à réagir, et écrivit à al-Ja'fari pour lui demander de l'argent en guise d'aide, mais celui-ci refusa. Al-Da'am écrivait à Ibn Khalaf au sujet de la paix, et des discussions eurent lieu entre al-Hadi et Ibn Khalaf concernant les conditions suivantes: al-Hadi quitterait Warwar et, une fois arrivé à Sa'da, Ibn Khalaf libérerait son fils et ses compagnons. Cet accord ne fut pas conclu. Puis, il reçut une lettre l'informant qu'un commandant des Banu al-Abbas nommé Jaftam était arrivé à La Mecque. Craignant pour sa famille, il se rendit à Sa'da."
  tr: "El-Hadi Warwar'a gitti ve orada kaldı. Hamdan'ı uyandırdı, ancak bu onun için zordu. El-Caferi'ye mali yardım istemek için yazdı, ancak o da onun için çok zor bir insandı. El-Da'am, İbn Halef ile barış sağlamak için yazışıyordu. El-Hadi ile İbn Halef arasında, El-Hadi'nin Warwar'dan ayrılması ve Sa'de'ye ulaştığında İbn Halef'in oğlunu ve arkadaşlarını serbest bırakması konusunda görüşmeler yapıldı. El-Hadi bunu kabul etmedi. Daha sonra, Abbasi liderlerinden Yaftam'ın Mekke'ye geldiğine dair bir mektup aldı, bu yüzden ailesi için endişelenerek Sa'de'ye gitti."
  id: "Al-Hadi pergi ke Warwar dan tinggal di sana. Dia membujuk Hamdan, tetapi itu sulit baginya. Dia menulis surat kepada Al-Ja’fari meminta bantuan keuangan, tetapi dia terlalu sulit untuk diajak bekerja sama. Al-Da’am berkorespondensi dengan Ibn Khalaf tentang perdamaian. Ada pembicaraan antara Al-Hadi dan Ibn Khalaf tentang Al-Hadi meninggalkan Warwar, dan ketika dia sampai di Sa’dah, Ibn Khalaf akan membebaskan putranya dan para sahabatnya. Dia tidak menyetujuinya. Kemudian sebuah surat sampai kepadanya bahwa seorang pemimpin Abbasiyah bernama Jaftam telah tiba di Mekah, sehingga dia khawatir akan keluarganya dan pergi ke Sa’dah."
