  id: "Banyak orang Frank pergi berlayar ke Levant, dan tidak adanya pasukan dalam perang saudara memudahkan mereka, kemudian perdamaian terjalin antara mereka dan kaum Muslim {cite:kamil-ibn-al-athir p. 291}."
