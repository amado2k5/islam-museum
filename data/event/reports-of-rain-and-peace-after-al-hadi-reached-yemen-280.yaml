id: event/reports-of-rain-and-peace-after-al-hadi-reached-yemen-280
class: event
kind: other
label:
  ar: روايات المطر والأمن بعد وصول الهادي إلى اليمن سنة 280هـ
  en: Reports of rain and calm after al-Hadi reached Yemen in 280 AH
  ur: 280ھ میں ہادی کے یمن پہنچنے کے بعد بارش اور امن کی روایات
summary:
  ar: يروي الكوفي عن محمد بن الحجاج وجماعة من أهل اليمن أنهم أجدبوا سنة 280هـ فلما وصل إليهم الهادي جاءهم الغيث وتتابعت الأمطار، وعن رجال من بني عقيل أنه ما مضى بموضع إلا مطر، وعن رجال من بيت ذؤد أنه دعا لهم في سفره الأول فلم يروا فتنة؛ وكل ذلك شهادات للرواة لا تقرها الموسوعة حقيقة.
  en: Al-Kufi relates, from Muhammad ibn al-Hajjaj and groups of Yemenis, that they suffered drought in 280 AH and when al-Hadi reached them rain came and followed one fall after another; from men of Banu Uqayl, that he passed nowhere without rain; and from men of Bayt Dhu'd, that he prayed for them on his first journey and they saw no strife after; all this is the narrators' testimony, which the museum does not affirm as fact.
  ur: کوفی محمد بن الحجاج اور یمنی جماعتوں سے روایت کرتے ہیں کہ 280ھ میں قحط پڑا اور ہادی کے پہنچتے ہی بارش آئی اور پے در پے برسی؛ بنو عقیل کے لوگوں سے کہ وہ جہاں سے گزرتے بارش ہوتی؛ اور بیت ذؤد کے لوگوں سے کہ انہوں نے پہلے سفر میں ان کے لیے دعا کی اور اس کے بعد انہوں نے فتنہ نہیں دیکھا؛ یہ سب راویوں کی گواہی ہے جسے عجائب گھر حقیقت کے طور پر بیان نہیں کرتا۔
