id: "event/muslim-ibn-abbad-al-akili-comes-to-saada-on-friday-nineteen-nights-into-ramadan-326-ah"
class: event
kind: other
label:
  ar: "يصل المسلم بن عباد الأكيلي إلى صعدة يوم الجمعة في رمضان سنة 326هـ، ص411-412"
  en: "Muslim ibn Abbad al-Akili arrives at Saada on a Friday in Ramadan 326 AH, pp. 411-412"
  ur: "رمضان 326ھ کے ایک جمعے کو مسلم بن عباد الاکیلی صعدہ پہنچتا ہے، ص411-412"
  es: "Muslim ibn Abbad al-Akili llega a Saada un viernes de Ramadán del año 326 AH, págs. 411-412."
summary:
  ar: "يصل المسلم بن عباد الأكيلي في بني نحر وبني كليب وبني جماعة يوم الجمعة لتسع عشرة ليلة خلت من رمضان سنة 326هـ، وقد كاتبه ابن الضحاك والحسن بن أحمد على نهب صعدة، فيقاتل أهل البلد."
  en: "Muslim ibn Abbad al-Akili arrives with Banu Nahr, Banu Kulayb and Banu Jama'a on Friday, nineteen nights into Ramadan 326 AH. Ibn al-Dahhak and al-Hasan ibn Ahmad had written to him to plunder Saada, and fighting follows in the town."
  ur: "مسلم بن عباد الاکیلی بنی نحر، بنی کلیب اور بنی جماعہ کے ساتھ رمضان 326ھ کی انیس راتیں گزرنے پر جمعے کو پہنچتا ہے۔ ابن الضحاک اور حسن بن احمد نے اسے صعدہ لوٹنے کے لیے خط لکھے تھے، اور شہر میں لڑائی شروع ہو جاتی ہے۔"
  es: "Muslim ibn Abbad al-Akili llega con Banu Nahr, Banu Kulayb y Banu Jama'a el viernes, diecinueve noches después del inicio del Ramadán del año 326 AH. Ibn al-Dahhak y al-Hasan ibn Ahmad le habían escrito para que saqueara Saada, y se desataron combates en la ciudad."
