label: { ar: "فتح القسطنطينية سنة 857هـ", en: "Conquest of Constantinople in 857 AH" }
summary:
  ar: "فتح السلطان محمد الفاتح بن مراد خان القسطنطينية الكبرى وساق بها السفن تجري براً وبحراً وهجم عليها بجنوده وأبطاله وأقدم عليها بخيوله ورجاله وحاصرها خمسين يوماً أشد الحصار وضيق على من فيها ودق باب النصر والتأييد وثبت على متن الصبر إلى أن أتاه الله بالفرج ففتح أصطنبول في اليوم الحادي والخمسين من أيام محاصرته وهو يوم الأربعاء العشرون من جمادى الآخرة سنة سبع وخمسين وثمان مئة وصلى في أكبر كنائس النصارى صلاة الجمعة وهي أياصوفيا قبة تسامي قبة السماء وتحاكي في الاستحكام قبب الأهرام {cite:shadharat-dhahab p. 344-345}. وعند الصلابي: اجتمع الأمراء والوزراء بالسلطان حين بلغت السفن الأربع التي أرسلها البابا إلى المدينة وقالوا له إنه دفع بهذا القدر من العساكر جرياً وراء كلام أحد المشايخ — يعنون آق شمس الدين — حتى هلكت الجنود ولم يعد هناك أمل في الفتح، فأرسل وزيره ولي الدين أحمد باشا إلى خيمة الشيخ فأجاب: لابد من أن يمنّ الله بالفتح، وكتب رسالته: إن العبد يدبّر والله يقدّر والحكم لله، فأحدث الخطاب راحة وطمأنينة وقرر مجلس الحرب الاستمرار {cite:dawlat-uthmaniyya-salabi p. 113-114}. وفي تفصيل الصلابي: وصلت الجيوش بقيادة الفاتح إلى مشارف المدينة الخميس 26 ربيع الأول 857هـ/6 أبريل 1453م في نحو مئتين وخمسين ألفاً {cite:dawlat-uthmaniyya-salabi p. 94}، وفتحت المدافع ثغرة بوادي ليكوس يوم 18 أبريل {cite:dawlat-uthmaniyya-salabi p. 96}، ولما عجزت السفن عن اقتحام سلسلة القرن الذهبي نُقل أكثر من سبعين سفينة براً من بشكطاش على ألواح مدهونة بالزيت والشحم ثلاثة أميال في ليلة واحدة {cite:dawlat-uthmaniyya-salabi p. 98-99}، ودخل الفاتح المدينة ظهر الثلاثاء 20 جمادى الأولى 857هـ/29 مايو 1453م على رواية الكتاب، وسجد لله شكراً {cite:dawlat-uthmaniyya-salabi p. 110}. وفي دائرة المعارف الإسلامية أن جنود محمد الثاني دخلوا المدينة من ثغرة الأسوار فجر 20 جمادى الأولى 857هـ/29 مايو 1453م وانتهى القتال نحو منتصف العصر، وأن السلطان أعلن آيا صوفيا جامعاً كبيراً وإسطنبول عاصمة له، وسبقتها حملات أموية على القسطنطينية ذكرتها المادة."
  en: "Mehmed Fatih took Constantinople the Great after the severest fifty-day siege — his ships running over land — opening Istanbul on Wednesday 20 Jumada II 857 and praying the Friday prayer in Hagia Sophia, the dome that 'rivals the sky's dome and emulates the pyramids in strength' {cite:shadharat-dhahab p. 344-345}. The Encyclopaedia of Islam adds that Mehmed II's troops entered through the breach in the walls at dawn on 20 Jumada I 857/29 May 1453 and the fighting ended towards mid-afternoon; the sultan then declared Hagia Sophia the Great Mosque and Istanbul his capital, after earlier Umayyad expeditions against the city."
  ur: "دائرۃ المعارف اسلامیہ کے مطابق محمد ثانی کی فوج 20 جمادی الاولیٰ 857ھ/29 مئی 1453ء کو فجر کے وقت فصیل کے شگاف سے شہر میں داخل ہوئی اور لڑائی عصر کے وسط کی طرف ختم ہوئی؛ پھر سلطان نے آیا صوفیہ کو جامع مسجد اور استنبول کو اپنا دارالحکومت قرار دیا، اور اس سے پہلے شہر پر اموی مہمات ہو چکی تھیں۔"
