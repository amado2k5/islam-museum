summary:
  ar: "فتح السلطان محمد الفاتح بن مراد خان القسطنطينية الكبرى وساق بها السفن تجري براً وبحراً وهجم عليها بجنوده وأبطاله وأقدم عليها بخيوله ورجاله وحاصرها خمسين يوماً أشد الحصار وضيق على من فيها ودق باب النصر والتأييد وثبت على متن الصبر إلى أن أتاه الله بالفرج ففتح أصطنبول في اليوم الحادي والخمسين من أيام محاصرته وهو يوم الأربعاء العشرون من جمادى الآخرة سنة سبع وخمسين وثمان مئة وصلى في أكبر كنائس النصارى صلاة الجمعة وهي أياصوفيا قبة تسامي قبة السماء وتحاكي في الاستحكام قبب الأهرام {cite:shadharat-dhahab p. 344-345}."
  en: "Mehmed Fatih took Constantinople the Great after the severest fifty-day siege — his ships running over land — opening Istanbul on Wednesday 20 Jumada II 857 and praying the Friday prayer in Hagia Sophia, the dome that 'rivals the sky's dome and emulates the pyramids in strength' {cite:shadharat-dhahab p. 344-345}."
