id: event/mushaqqar-massacre
class: event
kind: massacre
label: { ar: "قتل تميم بالمشقر", en: "The killing of Tamim at al-Mushaqqar", es: "El asesinato de Tamim en al-Mushaqqar", fr: "Le meurtre de Tamim à al-Mushaqqar", ur: "تمیم کا المشقر میں قتل", tr: "Tamim Meşkar'da öldürüldü", id: "Tamim terbunuh di Al-Mashqar" }
summary:
  ar: "مذبحة بني تميم بحصن المشقر؛ أرسل وهرز بأموال وطرف من اليمن إلى كسرى فلما كانت ببلاد تميم دعا صعصعة بن ناجية المجاشعي — جد الفرزدق — بني تميم إلى الوثوب عليها فأبوا ثم وثبوا عليها وأخذوها، وأصاب رجل من بني صليت يقال له النطف خرجاً فيه جوهر فقيل «أصاب فلان كنز النطف» مثلاً، وصار أصحاب العير إلى هوذة بن علي الحنفي فكساهم وحملهم وسار معهم إلى كسرى فأعجب به ودعا بعقد من در فعُقد على رأسه فسُمي ذا التاج، وقال لكسرى عن تميم لا بيننا إلا الموت، فأشاروا عليه أن يرسل إلى عامله بالبحرين أزاد فيروز بن جشيش الذي سمته العرب المكعبر لأنه كان يقطع الأيدي والأرجل فأمره بقتل بني تميم، فنادى مناديه ليحضر من كان بهجر من بني تميم إذ الملك أمر لهم بميرة وطعام، فحضروا أيام اللقاط فلما دخلوا المشقر قتل رجالهم واستبقى غلمانهم فجعلهم في السفن وعبر بهم إلى فارس، وقتل يومئذ قعنب الرياحي وكان فارس ربيعة، واستوهب هوذة من المكعبر مائة أسير فأطلقهم {cite:kamil-ibn-al-athir p. 349}."
  en: "The al-Mushaqqar massacre of Banu Tamim: after Tamim — urged on by Sa'sa'a ibn Najiya, al-Farazdaq's grandfather — plundered Khusraw's Yemeni tax convoy, Khusraw had his Bahrayn governor Azad Firuz 'al-Muka'bbir' (the hand-and-foot cutter) lure Tamim into the fort at Hajar with a promise of provisions; the men were killed, the boys shipped to Persia, and Hawdha ibn Ali — freshly crowned 'dhu al-taj' by Khusraw — begged a hundred captives and freed them {cite:kamil-ibn-al-athir p. 349}."
  es: "La masacre de Banu Tamim en al-Mushaqqar: después de que Tamim, instigado por Sa'sa'a ibn Najiya, abuelo de al-Farazdaq, saqueara el convoy de impuestos yemeníes de Khusraw, este último hizo que su gobernador de Bahrayn, Azad Firuz 'al-Muka'bbir' (el que cortaba manos y pies), atrajera a Tamim al fuerte de Hajar con la promesa de provisiones; los hombres fueron asesinados, los muchachos enviados a Persia, y Hawdha ibn Ali, recién coronado 'dhu al-taj' por Khusraw, suplicó por cien cautivos y los liberó {cite:kamil-ibn-al-athir p. 349}."
  fr: "Le massacre d'al-Mushaqqar des Banu Tamim: après que Tamim — poussé par Sa'sa'a ibn Najiya, le grand-père d'al-Farazdaq — ait pillé le convoi fiscal yéménite de Khusraw, Khusraw a chargé son gouverneur de Bahrayn, Azad Firuz 'al-Muka'bbir' (le coupeur de mains et de pieds), d'attirer Tamim dans le fort de Hajar avec une promesse de provisions; les hommes ont été tués, les garçons expédiés en Perse, et Hawdha ibn Ali — fraîchement couronné 'dhu al-taj' par Khusraw — a imploré une centaine de captifs et les a libérés {cite:kamil-ibn-al-athir p. 349}."
  ur: "بنو تمیم کا المشقق قتل عام: الفرزدق کے دادا صعصع بن ناجیہ کی طرف سے تمیم کے کہنے پر خسرو کے یمنی ٹیکس قافلے کو لوٹنے کے بعد، خسرو نے اپنے بحرین کے گورنر آزاد فیروز المکاثر کو کاٹ دیا تھا۔ قلعہ حجر میں رزق کے وعدے کے ساتھ۔ مردوں کو قتل کر دیا گیا، لڑکوں کو فارس بھیج دیا گیا، اور حوض ابن علی - جسے خسرو نے تازہ تاج پہنایا 'ذوالتاج' - نے سو اسیروں کی بھیک مانگی اور انہیں آزاد کر دیا۔ 349}۔"
  tr: "Beni Tamim kabilesinin Meşkar kalesinde katledilmesi; Vahriz, Yemen'den Hüsrüv'e para ve mal gönderdi. Tamim topraklarına ulaştıklarında, El-Farazdak'ın dedesi Sa'sa'ah ibn Neciye el-Mücaşi'i, Beni Tamim kabilesini onlara saldırmaya çağırdı. Onlar reddettiler, ancak daha sonra saldırdılar ve onları ele geçirdiler. Beni Salit kabilesinden el-Nutf adında bir adam, içinde mücevher bulunan bir kese buldu ve bu olay, \"Filanca el-Nutf'un hazinesini buldu\" şeklinde bir atasözü haline geldi. Kervan sahipleri, onları giydiren, onlara binek sağlayan ve onlarla birlikte Hüsrüv'e kadar yolculuk eden Havda ibn Ali el-Hanefi'ye gittiler. Hüsrüv ondan etkilendi ve başına inci bir kolye takılmasını emretti, bu yüzden ona \"taçlı olan\" denildi. Hüsrüv adına Hüsrüv'e, \"Aramızda ölümden başka hiçbir şey yok\" dedi. Ona, Bahreyn'deki valisi Azad Fayruz ibn Jashish'e, Arapların el ve ayak kesme alışkanlığı nedeniyle el-Muka'bar diye adlandırdığı kişiye haberci göndermesini tavsiye ettiler. Ona Beni Tamim'i öldürmesini emretti. Bunun üzerine, kralın onlar için erzak ve yiyecek sipariş etmesi üzerine, Hacer'de bulunan Beni Tamim'lileri getirmesi için habercisini çağırdı. Toplanma günlerinde geldiler. El-Muşakkar'a girdiklerinde, adamlarını öldürdü, oğlanlarını ise bağışladı ve onları gemilere bindirerek İran'a götürdü. O gün öldürüldü. Rabi'ah'lı bir şövalye olan Kanab el-Riyahi, El-Muka'bar'dan Hawdaha'dan yüz esir istedi ve o da onları serbest bıraktı. {Kaynak: Kamil ibn el-Athir s. 349}"
  id: "Pembantaian Bani Tamim di benteng Al-Mashqar; Wahriz mengirim uang dan barang dari Yaman ke Khosrow. Ketika mereka sampai di tanah Tamim, Sa'sa'ah ibn Najiyah al-Mujashi'i—kakek dari al-Farazdaq—menyeru Bani Tamim untuk menyerang mereka. Mereka menolak, tetapi kemudian menyerang dan menangkap mereka. Seorang pria dari Bani Salit, bernama al-Nutf, menemukan sebuah tas berisi permata, dan dikatakan, \"Si fulan menemukan harta karun al-Nutf,\" sebagai sebuah peribahasa. Para pemilik kafilah pergi ke Hawdha ibn Ali al-Hanafi, yang memberi mereka pakaian dan tunggangan dan bepergian bersama mereka ke Khosrow. Khosrow terkesan olehnya dan memerintahkan agar kalung mutiara diletakkan di kepalanya, sehingga ia disebut \"orang yang memakai mahkota.\" Ia berkata kepada Khosrow atas nama Tamim, \"Tidak ada yang memisahkan kita selain kematian.\" Mereka menasihatinya untuk mengirim utusan kepada gubernurnya di Bahrain, Azad Fayruz ibn Jashish, yang oleh orang Arab disebut al-Muka'bar karena ia biasa memotong tangan dan kaki. Ia memerintahkannya untuk membunuh Bani Tamim. Maka ia memanggil utusannya untuk membawa orang-orang Bani Tamim yang berada di Hajar, karena raja telah memerintahkan perbekalan dan makanan untuk mereka. Mereka datang selama hari-hari pengumpulan. Ketika mereka memasuki al-Mushaqqar, ia membunuh orang-orang laki-laki mereka dan menyelamatkan anak-anak laki-laki mereka, menempatkan mereka di kapal dan menyeberang ke Persia. Ia terbunuh pada hari itu. Qa’nab al-Riyahi adalah seorang ksatria Rabi’ah, dan ia meminta Hawdhah dari al-Muka’bar untuk seratus tawanan, maka ia membebaskan mereka. {cite:kamil-ibn-al-athir p. 349}."
