class: event
kind: other
label:
  ar: "الدارقطني يرحل إلى الشام ومصر ويصنف «المسند» لابن حزابة، نحو ٣٥٠هـ"
  en: "Al-Daraqutni journeys to al-Sham and Egypt and composes the Musnad for Ibn Hinzaba, about 350/961"
  ur: "دارقطنی شام و مصر کا سفر اور ابن حزابہ کے لیے «مسند» کی تصنیف، تقریباً 350ھ/961ء"
  es: "Al-Daraqutni viaja a al-Sham y Egipto y compone el Musnad para Ibn Hinzaba, alrededor del año 350/961."
  fr: "Al-Daraqutni se rend au Levant et en Égypte et compose le Musnad pour Ibn Hinzaba, vers 350/961."
  tr: "El-Daraqutni, Suriye ve Mısır'a seyahat ederek yaklaşık 350 Hicri yılında İbn Hazbe'nin \"Musnad\"ını derlemiştir."
  id: "Al-Daraqutni melakukan perjalanan ke Suriah dan Mesir dan menyusun \"Musnad\" Ibnu Hazaba, sekitar tahun 350 Hijriah."
summary:
  ar: "رحل الدارقطني في الكهولة إلى الشام ومصر، فسمع القاضي أبا الطاهر الذهلي وهذه الطبقة {cite:tarikh-islam-dhahabi p.101}؛ وكان الوزير جعفر بن الفرات ابن حزابة يملي الحديث بمصر، فخرج إليه الدارقطني وأقام عنده مدة وصنف له «المسند»، وحصل له من جهته مال كثير، وروى عنه في كتاب المديح أحاديث {cite:muntazam-ibn-al-jawzi j.7 p.216}."
  en: "In middle age al-Daraqutni journeyed to al-Sham and Egypt, hearing the qadi Abu al-Tahir al-Dhuhli and that generation {cite:tarikh-islam-dhahabi p.101}. The vizier Ja'far ibn al-Furat Ibn Hinzaba was dictating hadith in Egypt; al-Daraqutni went out to him, stayed with him a while and composed for him the Musnad, gained much wealth from his side, and transmitted reports from him in Kitab al-Madih {cite:muntazam-ibn-al-jawzi j.7 p.216}."
  ur: "دارقطنی نے متوسط عمر میں شام اور مصر کا سفر کیا اور قاضی ابو الطاہر ذہلی اور ان کے ہم عصروں سے سنا {cite:tarikh-islam-dhahabi p.101}؛ وزیر جعفر بن فرات ابن حزابہ مصر میں حدیث املا کر رہے تھے، دارقطنی ان کے پاس گئے، کچھ مدت ان کے مہمان رہے اور ان کے لیے «مسند» تصنیف کی، ان کی طرف سے وافر مال پایا اور کتاب المدیح میں ان سے احادیث روایت کیں {cite:muntazam-ibn-al-jawzi j.7 p.216}۔"
  es: "En la mediana edad, al-Daraqutni viajó a al-Sham y Egipto, donde escuchó al cadí Abu al-Tahir al-Dhuhli y a esa generación {cite:tarikh-islam-dhahabi p.101}. El visir Ja'far ibn al-Furat Ibn Hinzaba dictaba hadices en Egipto; al-Daraqutni fue a verlo, se quedó con él un tiempo y compuso para él el Musnad, obtuvo mucha riqueza de su parte y transmitió informes de él en el Kitab al-Madih {cite:muntazam-ibn-al-jawzi j.7 p.216}."
  fr: "Au Moyen Âge, al-Daraqutni se rendit au Levant et en Égypte, où il écouta le cadi Abu al-Tahir al-Dhuhli et son époque. Le vizir Ja'far ibn al-Furat Ibn Hinzaba dictait des hadiths en Égypte; al-Daraqutni alla à sa rencontre, séjourna quelque temps auprès de lui et composa pour lui le Musnad. Il tira de lui une grande richesse et transmit des hadiths de lui dans le Kitab al-Madih."
  tr: "El-Daraqutni orta yaşlarında Suriye ve Mısır'a seyahat etti ve orada Kadı Ebu el-Tahir el-Dhahli ve onun sınıfından hadisler dinledi (kaynak:tarikh-islam-dhahabi s.101). Vezir Cafer ibn el-Furat ibn Hazaba Mısır'da hadis dikte ediyordu, bu yüzden El-Daraqutni onun yanına gitti, bir süre onunla kaldı ve onun için \"el-Musnad\"ı derledi, ondan çok para aldı ve ondan hadisleri övgü kitabında rivayet etti (kaynak:muntazam-ibn-al-jawzi c.7 s.216)."
  id: "Al-Daraqutni melakukan perjalanan di usia paruh baya ke Suriah dan Mesir, dan ia mendengar dari Hakim Abu al-Tahir al-Dhahli dan golongan ini {cite:tarikh-islam-dhahabi p.101}. Menteri Ja'far ibn al-Furat ibn Hazaba sedang mendiktekan hadits di Mesir, sehingga al-Daraqutni pergi menemuinya dan tinggal bersamanya untuk sementara waktu dan menyusun \"al-Musnad\" untuknya, dan ia memperoleh banyak uang darinya, dan ia meriwayatkan hadits darinya dalam kitab pujian {cite:muntazam-ibn-al-jawzi j.7 p.216}."
