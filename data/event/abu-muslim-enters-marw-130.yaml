label: { ar: "دخول أبي مسلم مرو وانقضاض شيعته على مضر", en: "Abu Muslim Enters Marw and His Partisans Fall upon Mudar" }
summary:
  ar: "في سنة ثلاثين ومائة دخل أبو مسلم حائط مرو ونزل دار الإمارة يوم الخميس لتسع خلون من جمادى الأولى، وسببه أن سليمان بن كثير أنكر على علي بن الكرماني مصالحته نصر بن سيار، وقال له أما تأنف من مصالحة نصر وقد قتل بالأمس لك وأصحابك، فأدرك علي بن الكرماني الغيظ فرجع عن رأيه وانتقض صلح العرب، فبعث نصر بن سيار إلى أبي مسلم يلتمس أن يدخل مع مضر وبعثت ربيعة وقحطان بمثل ذلك، فأمر أبو مسلم أن يقدم عليه وفد الفريقين حتى يختار أحدها، وأمر الشيعة أن يختاروا ربيعة وقحطان إذ السلطان في مضر وهم عمال مروان وهم قتلة يحيى بن زيد، فلما قرئ كتاب أبو مسلم على السبعين المجتمعين قام مزيد بن شقيق السلمي فقال مضر قتلة آل البيت وأعوان بني أمية وشيعة مروان الجعدي ودماؤنا في أعناقهم وأموالنا في أيديهم ونصر بن سيار عامل مروان على خراسان يخطب له على منبره ويسميه أمير المؤمنين ونحن من ذلك إلى الله براء، فقال السبعون بقوله فنهض وحل مضرة عليهم الذلة والكآبة ورجع علي بن الكرماني وأصحابه مسرورين منصورين، وكان مقام أبي مسلم بآلين تسعة وعشرين يوماً ثم رحل إلى الماخوان فأقام بخنده ثلاثة أشهر ثم دخل حائط مرو {cite:tabari-khayyat-part2 p. 713-714}."
  en: "In 130 Abu Muslim entered the wall of Marw and took up residence in the governor's house on Thursday, 9 Jumada I. The cause was that Sulayman ibn Kathir objected to Ali ibn al-Kirmani's reconciliation with Nasr ibn Sayyar: 'Are you not ashamed to make peace with Nasr, when he killed your men and your companions only yesterday?' Ali ibn al-Kirmani was seized by anger, reversed his position, and the truce among the Arabs broke. Nasr ibn Sayyar sent to Abu Muslim asking him to join Mudar, and Rabi'a and Qahtan sent the same request. Abu Muslim ordered that envoys of both sides come before him to choose between them, and told the Shi'a to choose Rabi'a and Qahtan, since authority lay with Mudar, who were Marwan's agents and the killers of Yahya ibn Zayd. When his letter was read to the seventy assembled, Mazid ibn Shaqiq al-Sulami stood and said: 'Mudar are the killers of the Family of the Prophet and helpers of the Umayyads and partisans of Marwan al-Ja'di; our blood is on their necks and our wealth in their hands, and Nasr ibn Sayyar, Marwan's governor in Khurasan, has the khutba given for him from his pulpit and calls him amir al-mu'minin; we are innocent of that before God.' The seventy agreed with him; he rose, and humiliation and dejection came upon Mudar, while Ali ibn al-Kirmani and his companions returned glad and victorious. Abu Muslim had stayed at Alin for twenty-nine days, then moved on to al-Makhwan, stayed three months at Khunda, and then entered the wall of Marw {cite:tabari-khayyat-part2 p. 713-714}."
