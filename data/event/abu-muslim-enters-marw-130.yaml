label: { ar: "دخول أبي مسلم مرو وانقضاض شيعته على مضر", en: "Abu Muslim Enters Marw and His Partisans Fall upon Mudar", fr: "Abu Muslim entre à Marw et ses partisans fondent sur les Mudar", es: "Abu Muslim entra en Marw y sus partidarios atacan a Mudar.", ur: "ابو مسلم مرو میں داخل ہوا اور اس کے حامی مدثر پر گر پڑے", tr: "Ebu Müslim'in Merv'e girişi ve takipçilerinin Mudar'a saldırısı", id: "Masuknya Abu Muslim ke Merv dan serangan para pengikutnya terhadap Mudar" }
summary:
  ar: "في سنة ثلاثين ومائة دخل أبو مسلم حائط مرو ونزل دار الإمارة يوم الخميس لتسع خلون من جمادى الأولى، وسببه أن سليمان بن كثير أنكر على علي بن الكرماني مصالحته نصر بن سيار، وقال له أما تأنف من مصالحة نصر وقد قتل بالأمس لك وأصحابك، فأدرك علي بن الكرماني الغيظ فرجع عن رأيه وانتقض صلح العرب، فبعث نصر بن سيار إلى أبي مسلم يلتمس أن يدخل مع مضر وبعثت ربيعة وقحطان بمثل ذلك، فأمر أبو مسلم أن يقدم عليه وفد الفريقين حتى يختار أحدها، وأمر الشيعة أن يختاروا ربيعة وقحطان إذ السلطان في مضر وهم عمال مروان وهم قتلة يحيى بن زيد، فلما قرئ كتاب أبو مسلم على السبعين المجتمعين قام مزيد بن شقيق السلمي فقال مضر قتلة آل البيت وأعوان بني أمية وشيعة مروان الجعدي ودماؤنا في أعناقهم وأموالنا في أيديهم ونصر بن سيار عامل مروان على خراسان يخطب له على منبره ويسميه أمير المؤمنين ونحن من ذلك إلى الله براء، فقال السبعون بقوله فنهض وحل مضرة عليهم الذلة والكآبة ورجع علي بن الكرماني وأصحابه مسرورين منصورين، وكان مقام أبي مسلم بآلين تسعة وعشرين يوماً ثم رحل إلى الماخوان فأقام بخنده ثلاثة أشهر ثم دخل حائط مرو {cite:tabari-khayyat-part2 p. 713-714}."
  en: "In 130 Abu Muslim entered the wall of Marw and took up residence in the governor's house on Thursday, 9 Jumada I. The cause was that Sulayman ibn Kathir objected to Ali ibn al-Kirmani's reconciliation with Nasr ibn Sayyar: 'Are you not ashamed to make peace with Nasr, when he killed your men and your companions only yesterday?' Ali ibn al-Kirmani was seized by anger, reversed his position, and the truce among the Arabs broke. Nasr ibn Sayyar sent to Abu Muslim asking him to join Mudar, and Rabi'a and Qahtan sent the same request. Abu Muslim ordered that envoys of both sides come before him to choose between them, and told the Shi'a to choose Rabi'a and Qahtan, since authority lay with Mudar, who were Marwan's agents and the killers of Yahya ibn Zayd. When his letter was read to the seventy assembled, Mazid ibn Shaqiq al-Sulami stood and said: 'Mudar are the killers of the Family of the Prophet and helpers of the Umayyads and partisans of Marwan al-Ja'di; our blood is on their necks and our wealth in their hands, and Nasr ibn Sayyar, Marwan's governor in Khurasan, has the khutba given for him from his pulpit and calls him amir al-mu'minin; we are innocent of that before God.' The seventy agreed with him; he rose, and humiliation and dejection came upon Mudar, while Ali ibn al-Kirmani and his companions returned glad and victorious. Abu Muslim had stayed at Alin for twenty-nine days, then moved on to al-Makhwan, stayed three months at Khunda, and then entered the wall of Marw {cite:tabari-khayyat-part2 p. 713-714}."
  fr: "En 130, Abu Muslim entra dans la ville fortifiée de Marw et s’installa dans la demeure du gouverneur le jeudi 9 jumada I. Sulayman ibn Kathir avait contesté la réconciliation d’Ali ibn al-Kirmani avec Nasr ibn Sayyar : « N’as-tu pas honte de faire la paix avec Nasr, qui a tué tes hommes et tes compagnons hier encore ? » Saisi de colère, Ali changea de position et la trêve entre Arabes fut rompue. Nasr demanda à Abu Muslim de rejoindre les Mudar ; les Rabi'a et les Qahtan firent la même demande. Abu Muslim fit venir les envoyés des deux camps pour choisir et dit à la Shi'a de choisir les Rabi'a et les Qahtan, car le pouvoir était aux Mudar, agents de Marwan et meurtriers de Yahya ibn Zayd. Quand sa lettre fut lue aux soixante-dix hommes réunis, Mazid ibn Shaqiq al-Sulami se leva et dit : « Les Mudar sont les meurtriers de la famille du Prophète, les soutiens des Omeyyades et les partisans de Marwan al-Ja'di ; notre sang est sur leurs nuques et nos biens entre leurs mains. Nasr ibn Sayyar, gouverneur de Marwan au Khurasan, fait prononcer le sermon en son nom du haut de son minbar et l’appelle Commandeur des croyants ; nous nous en désolidarisons devant Dieu. » Les soixante-dix l’approuvèrent ; il se leva, les Mudar furent humiliés et abattus, tandis qu’Ali et ses compagnons revinrent heureux et victorieux. Abu Muslim avait séjourné vingt-neuf jours à Alin, puis trois mois à Khunda, à al-Makhwan, avant d’entrer dans Marw {cite:tabari-khayyat-part2 p. 713-714}."
  es: "En el año 130, Abu Muslim entró en la muralla de Marw y se instaló en la residencia del gobernador el jueves 9 de Jumada I. El motivo fue que Sulayman ibn Kathir se opuso a la reconciliación de Ali ibn al-Kirmani con Nasr ibn Sayyar: «¿No te avergüenza hacer las paces con Nasr, cuando él mató a tus hombres y compañeros ayer mismo?». Ali ibn al-Kirmani, enfurecido, cambió de opinión y la tregua entre los árabes se rompió. Nasr ibn Sayyar envió un mensajero a Abu Muslim pidiéndole que se uniera a Mudar, y Rabi'a y Qahtan enviaron la misma petición. Abu Muslim ordenó que los enviados de ambos bandos se presentaran ante él para elegir entre ellos, y les dijo a los chiítas que eligieran a Rabi'a y Qahtan, ya que la autoridad residía en Mudar, quienes eran agentes de Marwan y asesinos de Yahya ibn Zayd. Cuando se leyó su carta a los setenta allí reunidos, Mazid ibn Shaqiq al-Sulami se puso de pie y dijo: «Los Mudar son los asesinos de la Familia del Profeta, ayudantes de los Omeyas y partidarios de Marwan al-Ja'di; nuestra sangre está en sus cuellos y nuestra riqueza en sus manos, y Nasr ibn Sayyar, gobernador de Marwan en Jorasán, pronuncia el sermón en su nombre desde su púlpito y lo llama amir al-mu'minin; somos inocentes de eso ante Dios». Los setenta estuvieron de acuerdo con él; se levantó, y la humillación y el abatimiento se apoderaron de Mudar, mientras que Ali ibn al-Kirmani y sus compañeros regresaron alegres y victoriosos. Abu Muslim había permanecido en Alin durante veintinueve días, luego se trasladó a al-Makhwan, permaneció tres meses en Khunda y luego entró en la muralla de Marw {cite:tabari-khayyat-part2 p. 713-714}."
  ur: "130 میں ابو مسلم دیوار مرو میں داخل ہوا اور جمعرات 9 جمادی الثانی کو گورنر ہاؤس میں رہائش اختیار کی، وجہ یہ تھی کہ سلیمان بن کثیر نے علی بن الکرمانی کی نصر بن سیار کے ساتھ صلح پر اعتراض کیا: 'کیا تمہیں شرم نہیں آتی کہ تم نے اپنے آدمیوں کو صرف نصر کے ساتھ صلح کر کے قتل کیا تھا'؟ علی بن الکرمانی غصے میں گرفتار ہوا، اس نے اپنا موقف تبدیل کر دیا، اور عربوں کے درمیان جنگ بندی ٹوٹ گئی۔ نصر بن صیر نے ابو مسلم کو مدر میں شامل ہونے کے لیے کہا اور ربیعہ اور قحطان نے بھی یہی درخواست بھیجی۔ ابو مسلم نے حکم دیا کہ دونوں فریقوں کے ایلچی اس کے سامنے آئیں تاکہ ان میں سے انتخاب کریں، اور شیعوں سے کہا کہ ربیعہ اور قحطان کا انتخاب کریں، کیونکہ اختیار مدر کے پاس تھا، جو مروان کے ایجنٹ اور یحییٰ بن زید کے قاتل تھے۔ جب ان کا خط ستر کے مجمع کو پڑھ کر سنایا گیا تو مازد بن شقیق السلمی نے کھڑے ہو کر کہا: 'مدر رسول اللہ کے خاندان کے قاتل اور بنی امیہ کے مددگار اور مروان الجدی کے حامی ہیں۔ ہمارا خون ان کی گردنوں پر ہے اور ہمارا مال ان کے ہاتھوں میں ہے، اور خراسان میں مروان کے گورنر نصر بن سیار نے ان کے لیے اپنے منبر سے خطبہ دیا ہے اور اسے امیر المومنین کہا ہے۔ ہم خدا کے سامنے اس سے بے قصور ہیں۔' ستر نے اس سے اتفاق کیا۔ آپ اٹھے اور مدر پر ذلت و رسوائی آئی، جب کہ علی بن الکرمانی اور ان کے ساتھی خوشی خوشی واپس لوٹے۔ ابو مسلم انتیس دن تک علین میں رہے، پھر المخوان چلے گئے، تین مہینے خندہ میں رہے اور پھر دیوار مرو میں داخل ہوئے۔ 713-714}۔"
  tr: "Hicri 130 yılında, Ebu Müslim, Cemâdî Ula ayının dokuzuncu günü Perşembe günü Merv surlarına girdi ve valilik sarayına yerleşti. Bunun sebebi, Süleyman ibn Kathir'in, Ali ibn Kirmani'yi Nasr ibn Sayyar ile barış yaptığı için eleştirmesi ve ona, \"Dün seni ve arkadaşlarını öldüren Nasr ile barış yaptığın için utanmıyor musun?\" demesiydi. Ali ibn Kirmani öfkeye kapıldı ve fikrini değiştirerek Araplar arasındaki barış antlaşmasını bozdu. Bunun üzerine Nasr ibn Sayyar, Ebu Müslim'e Mudar kabilesiyle güçlerini birleştirmesi için bir mesaj gönderdi ve Rabi'ah ile Kahtan da benzer isteklerde bulundular. Ebu Müslim, her iki taraftan da heyetlerin huzuruna getirilmesini emretti ki, onlardan birini seçebilsin. Şiilere Rabi'ah ve Kahtan'ı seçmelerini emretti, çünkü yetki Mervan'ın ajanları ve Yahya ibn Zeyd'in katilleri olan Mudar kabilesindeydi. Ebu Müslim'in mektubu yetmiş kişiye okunduğunda, Mazid ibn Şakik el-Sulami ayağa kalkıp şöyle dedi: \"Mudarlar, Peygamber ailesinin katilleridir, Emevilerin destekçileridir ve Mervan el-Ca'di'nin takipçileridir. Kanımız onların boyunlarındadır, mallarımız onların elindedir. Nasr ibn Sayyar, Mervan'ın Horasan valisidir; minberinden kendi adına vaazlar verilir ve Müminlerin Emiri olarak anılır, biz de onların arasındayız.\" Allah'ı inkâr etti, bu yüzden yetmiş kişi onun söylediklerini tekrarladı, o da kalkıp onlara zarar verdi, onları aşağıladı ve kederlendirdi, Ali bin el-Karmani ve arkadaşları ise mutlu ve zafer kazanmış olarak geri döndüler. Ebu Müslim'in Alin'de kalışı yirmi dokuz gün sürdü, sonra Mekvan'a gitti ve üç ay Hundeh'de kaldı, sonra Merv surlarına girdi. 713-714}."
  id: "Pada tahun 130 H, Abu Muslim memasuki tembok Merv dan menetap di istana gubernur pada hari Kamis, tanggal sembilan Jumada al-Ula. Alasannya adalah karena Sulayman ibn Kathir mengkritik Ali ibn al-Kirmani karena berdamai dengan Nasr ibn Sayyar, dengan berkata kepadanya, \"Tidakkah engkau malu berdamai dengan Nasr, yang membunuhmu dan para sahabatmu kemarin?\" Ali ibn al-Kirmani diliputi amarah dan berubah pikiran, sehingga melanggar perjanjian damai antara bangsa Arab. Nasr ibn Sayyar kemudian mengirim pesan kepada Abu Muslim meminta agar ia bergabung dengan suku Mudar, dan Rabi'ah serta Qahtan mengirim permintaan serupa. Abu Muslim memerintahkan agar delegasi dari kedua belah pihak dibawa ke hadapannya agar ia dapat memilih salah satu dari mereka. Ia menginstruksikan kaum Syiah untuk memilih Rabi'ah dan Qahtan, karena otoritas berada di pihak Mudar, yang merupakan agen Marwan dan pembunuh Yahya ibn Zayd. Ketika surat Abu Muslim dibacakan kepada tujuh puluh orang yang berkumpul, Mazid ibn Shaqiq al-Sulami berdiri dan berkata, \"Kaum Mudar adalah pembunuh keluarga Nabi, pendukung Umayyah, dan pengikut Marwan al-Ja'di. Darah kita ada di leher mereka, dan harta kita ada di tangan mereka. Nasr ibn Sayyar adalah gubernur Khurasan milik Marwan; ia menyampaikan khutbah atas namanya dari mimbar dan disebut Amirul Mukminin, dan kita termasuk di antara mereka.\" Ia mengingkari Tuhan, sehingga tujuh puluh orang itu mengatakan apa yang dikatakannya, lalu ia bangkit dan mendatangkan malapetaka kepada mereka, penghinaan dan kesedihan, dan Ali bin Al-Karmani dan para sahabatnya kembali dengan gembira dan penuh kemenangan. Abu Muslim tinggal di Al-Makhwan selama dua puluh sembilan hari, kemudian ia pergi ke Al-Makhwan dan tinggal di Khundah selama tiga bulan, kemudian ia memasuki tembok Marwan. {cite:tabari-khayyat-part2 p. 713-714}."
