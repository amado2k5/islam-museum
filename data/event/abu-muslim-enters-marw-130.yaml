label: { ar: "دخول أبي مسلم مرو وانقضاض شيعته على مضر" }
summary:
  ar: "في سنة ثلاثين ومائة دخل أبو مسلم حائط مرو ونزل دار الإمارة يوم الخميس لتسع خلون من جمادى الأولى، وسببه أن سليمان بن كثير أنكر على علي بن الكرماني مصالحته نصر بن سيار، وقال له أما تأنف من مصالحة نصر وقد قتل بالأمس لك وأصحابك، فأدرك علي بن الكرماني الغيظ فرجع عن رأيه وانتقض صلح العرب، فبعث نصر بن سيار إلى أبي مسلم يلتمس أن يدخل مع مضر وبعثت ربيعة وقحطان بمثل ذلك، فأمر أبو مسلم أن يقدم عليه وفد الفريقين حتى يختار أحدها، وأمر الشيعة أن يختاروا ربيعة وقحطان إذ السلطان في مضر وهم عمال مروان وهم قتلة يحيى بن زيد، فلما قرئ كتاب أبو مسلم على السبعين المجتمعين قام مزيد بن شقيق السلمي فقال مضر قتلة آل البيت وأعوان بني أمية وشيعة مروان الجعدي ودماؤنا في أعناقهم وأموالنا في أيديهم ونصر بن سيار عامل مروان على خراسان يخطب له على منبره ويسميه أمير المؤمنين ونحن من ذلك إلى الله براء، فقال السبعون بقوله فنهض وحل مضرة عليهم الذلة والكآبة ورجع علي بن الكرماني وأصحابه مسرورين منصورين، وكان مقام أبي مسلم بآلين تسعة وعشرين يوماً ثم رحل إلى الماخوان فأقام بخنده ثلاثة أشهر ثم دخل حائط مرو {cite:tabari-khayyat-part2 p. 713-714}."
