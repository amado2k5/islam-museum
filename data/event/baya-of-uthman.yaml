label: { ar: "بيعة عثمان بن عفان", en: "Bay'a of Uthman ibn Affan", fr: "La bay'a d'Uthman ibn Affan", es: "Bay'a de Uthman ibn Affan", ur: "بیع عثمان بن عفان", tr: "Osman ibn Affan'a Bağlılık Yemini", id: "Ikrar Kesetiaan kepada Uthman bin Affan" }
summary:
  ar: "بويع عثمان بالخلافة بعد دفن عمر بثلاث ليال؛ وكان عمر قبل أن يموت أرسل إلى أبي طلحة الأنصاري فقال كن في خمسين من الأنصار مع أصحاب الشورى فإنهم سيجتمعون في بيت فقم على الباب بأصحابك ولا تترك أحداً يدخل عليهم ولا تتركهم يمضي اليوم الثالث حتى يؤمروا أحدهم {cite:tarikh-khulafa-minhaj-1434 p. 266}. واجتمع الناس تلك الأيام إلى عبد الرحمن بن عوف يشاورونه وكان قد عزل نفسه عن الترشح، فسأل عثمان خلوة إن لم أبايعك فمن تشير عليّ قال عليّ، وسأل علياً فقال عثمان، وسأل الزبير فقال علي أو عثمان، وسأل سعداً فقال عثمان، ثم استشار الأعيان فرأى هوى أكثرهم في عثمان؛ وكان قد بدأ بعلي فقال أبايعك على كتاب الله وسنة رسوله وسيرة أبي بكر وعمر فقال فيما استطعت، ثم عرضه على عثمان فقال نعم، فأخذ بيده وبايعه وبايعه المهاجرون والأنصار {cite:tarikh-khulafa-minhaj-1434 p. 266-267}. وقال ابن مسعود لما بويع عثمان: أمّرنا خير من بقي ولم نألُ {cite:tarikh-khulafa-minhaj-1434 p. 267}."
  en: "Uthman was given the bay'a three nights after Umar's burial. Before dying, Umar had sent Abu Talha al-Ansari to stand with fifty Ansar at the door of the house where the six-man shura met, letting none enter and giving them three days to name one of themselves. Abd al-Rahman ibn Awf, who had withdrawn his own candidacy, sounded each candidate in private — Uthman named Ali, Ali named Uthman, al-Zubayr named 'Ali or Uthman', Sa'd named Uthman — then consulted the notables and found most inclined to Uthman. He first offered Ali the bay'a on the Book, the Sunna and the conduct of Abu Bakr and Umar; Ali answered 'to the best of my ability', while Uthman answered 'yes'; so Abd al-Rahman took Uthman's hand and pledged, and the Muhajirun and Ansar pledged. Ibn Mas'ud said when Uthman was pledged: 'we have invested the best of those remaining, and we did not fall short' {cite:tarikh-khulafa-minhaj-1434 p. 266-267}."
  fr: "Uthman reçut la bay'a trois nuits après l'inhumation d'Umar. Avant de mourir, Umar avait envoyé Abu Talha al-Ansari se tenir avec cinquante Ansar à la porte de la maison où se réunissait la shura des six, ne laissant entrer personne et leur donnant trois jours pour désigner l'un d'entre eux. Abd al-Rahman ibn Awf, qui avait retiré sa propre candidature, sonda chaque candidat en privé : Uthman nomma Ali, Ali nomma Uthman, al-Zubayr nomma « Ali ou Uthman », Sa'd nomma Uthman ; puis il consulta les notables et trouva la plupart penchant pour Uthman. Il offrit d'abord à Ali la bay'a sur le Livre, la Sunna et la conduite d'Abu Bakr et d'Umar ; Ali répondit « dans la mesure de mes moyens », tandis qu'Uthman répondit « oui » ; Abd al-Rahman prit donc la main d'Uthman et lui prêta allégeance, et les Muhajirun et les Ansar prêtèrent allégeance. Ibn Mas'ud dit quand Uthman reçut l'allégeance : « nous avons investi le meilleur de ceux qui restent, et nous n'avons pas failli » {cite:tarikh-khulafa-minhaj-1434 p. 266-267}."
  es: "Uthman recibió el bay'a tres noches después del entierro de Umar. Antes de morir, Umar había enviado a Abu Talha al-Ansari a apostarse con cincuenta Ansar en la puerta de la casa donde se reunía la shura de seis hombres, impidiendo la entrada a nadie y dándoles tres días para nombrar a uno de ellos. Abd al-Rahman ibn Awf, quien había retirado su propia candidatura, consultó a cada candidato en privado: Uthman nombró a Ali, Ali nombró a Uthman, al-Zubayr nombró a 'Ali o Uthman', Sa'd nombró a Uthman. Luego consultó a los notables y encontró que la mayoría se inclinaba por Uthman. Primero ofreció el bay'a a Ali basándose en el Libro, la Sunna y la conducta de Abu Bakr y Umar; Ali respondió 'lo mejor que pueda', mientras que Uthman respondió 'sí'; entonces Abd al-Rahman tomó la mano de Uthman y juró lealtad, y los Muhajirun y los Ansar también juraron lealtad. Ibn Mas'ud dijo cuando Uthman fue comprometido: 'Hemos invertido lo mejor de los que quedan, y no nos hemos quedado cortos' {cite:tarikh-khulafa-minhaj-1434 p. 266-267}."
  ur: "عمر کی تدفین کے تین رات بعد عثمان کو بیعت کر دی گئی۔ مرنے سے پہلے، عمر نے ابو طلحہ الانصاری کو پچاس انصار کے ساتھ گھر کے دروازے پر کھڑا کرنے کے لیے بھیجا تھا جہاں چھ رکنی شوریٰ کا اجلاس ہوا، کسی کو اندر جانے کی اجازت نہ دی اور انہیں تین دن کا وقت دیا کہ وہ اپنے ایک کا نام لیں۔ عبدالرحمٰن بن عوف، جس نے اپنی امیدواری واپس لے لی تھی، ہر ایک امیدوار کو نجی طور پر آواز دی - عثمان نے علی کا نام دیا، علی کا نام عثمان، الزبیر نے 'علی یا عثمان'، سعد نامی عثمان - پھر معززین سے مشورہ کیا اور سب سے زیادہ عثمان کی طرف مائل پایا۔ اس نے سب سے پہلے علی کو کتاب، سنت اور ابوبکر و عمر کے طرز عمل پر بیعت کی۔ علی نے 'میری صلاحیت کے مطابق' جواب دیا، جب کہ عثمان نے 'ہاں' میں جواب دیا۔ چنانچہ عبدالرحمٰن نے عثمان کا ہاتھ پکڑ کر بیعت کی اور مہاجرین اور انصار نے بیعت کی۔ ابن مسعود نے کہا کہ جب عثمان سے عہد کیا گیا تھا: 'ہم نے جو باقی بچا ہے ان میں سے بہترین سرمایہ لگا دیا ہے اور ہم نے کوئی کمی نہیں کی'۔ 266-267}۔"
  tr: "Ömer'in cenazesinden üç gece sonra Osman'a halifelik yemini edildi. Ömer ölmeden önce Ebu Talha el-Ensari'ye şöyle bir haber göndermişti: \"Elli Ensar ve Şura meclisi üyesiyle birlikte ol, çünkü bir evde toplanacaklar. Arkadaşlarınla birlikte kapıda nöbet tut ve kimseyi içeri alma. Üçüncü gün geçmeden içlerinden birini halife tayin etsinler.\" {kaynak:tarikh-khulafa-minhaj-1434 s. 266}. O günlerde insanlar Abdülrahman ibn Avf'ın etrafında toplanıp onunla istişare ettiler. O, ırktan çekilmişti. Osman ona özel olarak sordu: \"Sana biat etmezsem kimi önerirsin?\" O, \"Ali\" diye cevap verdi. Ali'ye sordu, o da \"Osman\" dedi. Zübeyr'e sordu, o da \"Ali veya Osman\" dedi. Sa'd'a sordu, o da \"Osman\" dedi. Sonra ileri gelenlere danıştı ve çoğunun Osman'ı desteklediğini gördü. Ali'ye şöyle diyerek başladı: \"Allah'ın Kitabı'na, Resulünün Sünnetine ve Ebu Bekir ile Ömer'in örneklerine dayanarak sana biat ediyorum.\" Ali, \"Gücün yettiğince\" diye cevap verdi. Sonra bunu Osman'a sundu ve Osman \"Evet\" dedi. Böylece elini tuttu ve ona biat etti; Muhacirler ve Ensar da ona biat ettiler. {Kaynak:tarikh-khulafa-minhaj-1434 s. 266-267}. İbn Mesud, Osman'a biat edildiğinde şöyle dedi: \"Geri kalanların en iyilerini seçtik ve hiçbir şey eksik kalmadı.\" {Kaynak:tarikh-khulafa-minhaj-1434 s. 267}."
  id: "Utsman diikrarkan sumpah setia sebagai Khalifah tiga malam setelah pemakaman Umar. Sebelum wafat, Umar telah mengirim pesan kepada Abu Talha al-Ansari, mengatakan, \"Berkumpullah dengan lima puluh orang Ansar dan anggota dewan Syura, karena mereka akan berkumpul di sebuah rumah. Berjagalah di pintu bersama teman-temanmu dan jangan biarkan siapa pun masuk. Jangan biarkan hari ketiga berlalu sampai mereka menunjuk salah satu dari mereka sebagai Khalifah.\" {cite:tarikh-khulafa-minhaj-1434 p. 266}. Pada hari-hari itu, orang-orang berkumpul di sekitar Abd al-Rahman ibn Awf untuk berkonsultasi dengannya. Ia telah menarik diri dari kelompok tersebut. Utsman bertanya kepadanya secara pribadi, \"Jika aku tidak berbaiat kepadamu, siapa yang kau sarankan?\" Ia menjawab, \"Ali.\" Ia bertanya kepada Ali, yang berkata, \"Utsman.\" Ia bertanya kepada al-Zubayr, yang berkata, \"Ali atau Utsman.\" Ia bertanya kepada Sa'd, yang berkata, \"Utsman.\" Kemudian ia berkonsultasi dengan para tokoh terkemuka dan mendapati bahwa sebagian besar dari mereka mendukung Utsman. Ia memulai dengan Ali, berkata, \"Aku berjanji setia kepadamu berdasarkan Kitab Allah, Sunnah Rasul-Nya, dan contoh Abu Bakar dan Umar.\" Ali menjawab, \"Sebanyak yang mampu engkau lakukan.\" Kemudian ia menyampaikannya kepada Utsman, yang berkata, \"Ya.\" Maka ia memegang tangannya dan berjanji setia kepadanya, dan kaum Muhajirin dan Ansar pun berjanji setia kepadanya. {kutip:tarikh-khulafa-minhaj-1434 hlm. 266-267}. Ibnu Masoud berkata ketika Utsman diberi sumpah setia: Kami mengangkat orang-orang terbaik yang tersisa dan Kami tidak kekurangan orang-orang tersebut. {kutip:tarikh-khulafa-minhaj-1434 hlm. 267}."
