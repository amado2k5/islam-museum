id: "event/abu-jafar-head-is-crucified-in-the-village-and-men-of-najran-bury-his-body-near-al-hijr-295"
class: event
kind: other
label:
  ar: "صلب رأس أبي جعفر في القرية ودفن جثته قرب الهجر، 295هـ، ص379-380"
  en: "Abu Ja'far's head is crucified in the village and men of Najran bury his body near al-Hijr, 295 AH, pp. 379-380"
  fr: "La tête d’Abu Ja'far est exposée sur un poteau dans le village et des hommes de Najran enterrent son corps près d’al-Hijr, 295 de l’hégire, p. 379-380"
  ur: "ابو جعفر کے سر کو گاؤں میں سولی دی جاتی ہے اور نجران کے لوگ اس کا جسم الہجر کے قریب دفن کرتے ہیں، 295ھ، ص379-380"
  es: "La cabeza de Abu Ja'far es crucificada en la aldea y los hombres de Najran entierran su cuerpo cerca de al-Hijr, 295 AH, pp. 379-380"
summary:
  ar: "طاف بنو الحارث برأس أبي جعفر في قرى نجران ثم صلبوه على خشبة في القرية، وأخذت امرأة من بني عبد المدان الرأس فأخفته، وطلب أهل نجران الجثة من ابن حميد، فغسلوها وكفنوها ودفنوها بالقرب من قرية الهجر."
  en: "Banu al-Harith carried Abu Ja'far's head around the villages of Najran, then crucified it on a post in the village and stoned it. A woman of Banu Abd al-Madan named Furat took the head, and her sister took it from her and buried it where only she and her husband knew. Men of Najran asked Ibn Humayd for the body and were given it. They washed and shrouded it, prayed over it, and buried it near the village of al-Hijr, at a place called al-Balat."
  fr: "Les Banu al-Harith promenèrent la tête d’Abu Ja'far dans les villages de Najran, puis l’exposèrent sur un poteau dans le village et la lapidèrent. Une femme des Banu Abd al-Madan nommée Furat prit la tête ; sa sœur la lui prit et l’enterra dans un lieu connu d’elle seule et de son mari. Des hommes de Najran demandèrent le corps à Ibn Humayd, qui le leur remit. Ils le lavèrent, l’enveloppèrent d’un linceul, prièrent sur lui et l’enterrèrent près du village d’al-Hijr, au lieu appelé al-Balat."
  ur: "بنو حارث نے ابو جعفر کا سر نجران کی بستیوں میں پھرایا، پھر اسے گاؤں میں ایک لکڑی پر لٹکا دیا صلیب کے طریقے پر اور اس پر پتھر برسائے۔ بنو عبد المدان کی ایک خاتون فرات نے سر اٹھا لیا، پھر اس کی بہن نے اس سے لے کر اسے ایسی جگہ دفن کیا جو صرف اسے اور اس کے شوہر کو معلوم تھی۔ نجران کے لوگوں نے ابن حمید سے جسم مانگا اور انہیں دیا گیا؛ انہوں نے اسے غسل اور کفن دیا، نماز جنازہ پڑھی اور الہجر کے قریب البلاط نامی جگہ پر دفن کیا۔"
  es: "Los Banu al-Harith llevaron la cabeza de Abu Ja'far por las aldeas de Najrán, la crucificaron en un poste y la apedrearon. Una mujer de Banu Abd al-Madan llamada Furat tomó la cabeza, y su hermana se la quitó y la enterró en un lugar que solo ella y su esposo conocían. Los hombres de Najrán le pidieron el cuerpo a Ibn Humayd y se lo entregaron. Lo lavaron, lo amortajaron, rezaron sobre él y lo enterraron cerca de la aldea de al-Hijr, en un lugar llamado al-Balat."
