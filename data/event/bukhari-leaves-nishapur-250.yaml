id: event/bukhari-leaves-nishapur-250
class: event
kind: other
label:
  ar: "محنة البخاري بنيسابور ورحيله إلى بخارى، نحو ٢٥٠هـ"
  en: "Al-Bukhari's ordeal at Nishapur and his departure for Bukhara, c. 250/864"
  ur: "نیشاپور میں بخاری کا امتحان اور بخارا کی طرف رحلت، تقریباً 250ھ/864ء"
  fr: "L'épreuve d'al-Bukhari à Nishapur et son départ pour Boukhara, vers 250/864"
  es: "La terrible experiencia de Al-Bujari en Nishapur y su partida hacia Bujará, c. 250/864"
  tr: "Buhari'nin Nişapur'daki çilesi ve Hicri 250 civarında Buhara'ya gidişi."
  id: "Cobaan yang dialami Al-Bukhari di Nishapur dan keberangkatannya ke Bukhara, sekitar tahun 250 Hijriah."
summary:
  ar: "حسده محمد بن يحيى الذهلي لما اجتمع الناس على مجلسه، فنادى: ألاّ من يختلف إلى مجلسه فلا يأتينا، ووُقِع فيه بسبب قوله إن لفظه بالقرآن مخلوق — وإن كان يرى أن القرآن كلام الله غير مخلوق — فخرج من نيسابور إلى بخارى {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  en: "Muhammad ibn Yahya al-Dhuhli grew jealous of him as crowds gathered at his session, and proclaimed that whoever attended al-Bukhari's session should not attend his; al-Bukhari was attacked for saying that his own recitation of the Qur'an was created — though he held the Qur'an itself to be the uncreated word of God — and he left Nishapur for Bukhara {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  ur: "محمد بن یحیی ذہلی نے ان سے حسد کیا جب لوگ ان کے مجلس میں جمع ہوتے، اور ندا دی کہ جو ان کے مجلس میں جائے ہمارے پاس نہ آئے؛ ان پر اس بات پر حملہ ہوا کہ انہوں نے اپنی تلاوتِ قرآن کو مخلوق کہا — حالانکہ وہ قرآن کو اللہ کا غیر مخلوق کلام مانتے تھے — اور وہ نیشاپور سے بخارا چلے گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}۔"
  fr: "Muhammad ibn Yahya al-Dhuhli devint jaloux de lui à mesure que les foules se pressaient à sa séance, et proclama que quiconque assistait à la séance d'al-Bukhari ne devait pas assister à la sienne ; al-Bukhari fut attaqué pour avoir dit que sa propre récitation du Coran était créée (bien qu'il tînt le Coran lui-même pour la parole incréée de Dieu), et il quitta Nishapur pour Boukhara {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  es: "Muhammad ibn Yahya al-Dhuhli sintió celos de él a medida que se reunían multitudes en su sesión, y proclamó que quien asistiera a la sesión de al-Bukhari no debía asistir a la suya; al-Bukhari fue atacado por decir que su propia recitación del Corán era creada —aunque sostenía que el Corán mismo era la palabra increada de Dios— y dejó Nishapur para ir a Bukhara {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  tr: "Muhammed ibn Yahya el-Dhahli, onun meclisine insanların toplanmasından kıskançlık duyarak şöyle seslendi: \"Kim onun meclisine sık sık geliyorsa, bize gelmesin.\" Kur'an'ın yaratılmamış bir kelam olduğuna inanmasına rağmen, Kur'an'ı telaffuzunun uydurma olduğunu söylemesi nedeniyle saldırıya uğradı ve bu yüzden Nişapur'dan Buhara'ya gitti."
  id: "Muhammad ibn Yahya al-Dhahli merasa iri kepadanya ketika orang-orang berkumpul di pertemuannya, sehingga ia berseru: “Siapa pun yang sering menghadiri pertemuannya, janganlah ia datang kepada kami.” Ia diserang karena pernyataannya bahwa pelafalannya terhadap Al-Qur'an adalah ciptaan—padahal ia percaya bahwa Al-Qur'an adalah firman Tuhan yang tidak diciptakan—maka ia meninggalkan Nishapur menuju Bukhara."
