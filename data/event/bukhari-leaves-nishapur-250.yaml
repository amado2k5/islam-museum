label:
  ar: "محنة البخاري بنيسابور ورحيله إلى بخارى، نحو ٢٥٠هـ"
  en: "Al-Bukhari's ordeal at Nishapur and his departure for Bukhara, c. 250/864"
  ur: "نیشاپور میں بخاری کا امتحان اور بخارا کی طرف رحلت، تقریباً 250ھ/864ء"
summary:
  ar: "حسده محمد بن يحيى الذهلي لما اجتمع الناس على مجلسه، فنادى: ألاّ من يختلف إلى مجلسه فلا يأتينا، ووُقِع فيه بسبب قوله إن لفظه بالقرآن مخلوق — وإن كان يرى أن القرآن كلام الله غير مخلوق — فخرج من نيسابور إلى بخارى {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  en: "Muhammad ibn Yahya al-Dhuhli grew jealous of him as crowds gathered at his session, and proclaimed that whoever attended al-Bukhari's session should not attend his; al-Bukhari was attacked for saying that his own recitation of the Qur'an was created — though he held the Qur'an itself to be the uncreated word of God — and he left Nishapur for Bukhara {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}."
  ur: "محمد بن یحیی ذہلی نے ان سے حسد کیا جب لوگ ان کے مجلس میں جمع ہوتے، اور ندا دی کہ جو ان کے مجلس میں جائے ہمارے پاس نہ آئے؛ ان پر اس بات پر حملہ ہوا کہ انہوں نے اپنی تلاوتِ قرآن کو مخلوق کہا — حالانکہ وہ قرآن کو اللہ کا غیر مخلوق کلام مانتے تھے — اور وہ نیشاپور سے بخارا چلے گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} {cite:tabaqat-shafiiyya-subki j.2 p. 12-13}۔"
