id: event/abu-sufyan-medina-mission
class: event
kind: other
label: { en: "Abu Sufyan's mission to Medina", fr: "Mission d’Abu Sufyan à Médine", ar: "بعثة أبي سفيان إلى المدينة لتجديد العقد", es: "La misión de Abu Sufyan a Medina", ur: "ابو سفیان کا مدینہ کا مشن" }
summary:
  en: "Frightened by what had been done at al-Watir, Quraysh sent Abu Sufyan ibn Harb to Medina to stiffen the pact and extend its term. The Prophet gave him no answer; Abu Bakr and Umar declined to intercede; Ali advised him to grant protection himself, which he did and returned home empty-handed."
  fr: "Effrayés par ce qui avait été fait à al-Watir, les Quraysh envoyèrent Abu Sufyan ibn Harb à Médine pour renforcer le pacte et en prolonger la durée. Le Prophète ne lui répondit pas ; Abu Bakr et Omar refusèrent d’intercéder. Ali lui conseilla de proclamer lui-même une protection, ce qu’il fit, puis il rentra les mains vides."
  ar: "رَهِبت قريش ما صنعت فبعثت أبا سفيان بن حرب إلى المدينة يشد العقد ويزيد في المدة؛ فلم يرد عليه النبي شيئًا، وأبى أبو بكر وعمر أن يشفعا، وأشار عليه علي أن يجير بنفسه بين الناس ففعل ورجع إلى قريش خائبًا."
  es: "Asustados por lo ocurrido en al-Watir, los Quraysh enviaron a Abu Sufyan ibn Harb a Medina para reforzar el pacto y extender su vigencia. El Profeta no le respondió; Abu Bakr y Umar se negaron a interceder; Ali le aconsejó que brindara protección personalmente, lo cual hizo, y regresó a casa con las manos vacías."
  ur: "الطیر میں جو کچھ ہوا اس سے خوفزدہ ہو کر قریش نے ابو سفیان بن حرب کو اس معاہدے پر سختی کرنے اور اس کی مدت بڑھانے کے لیے مدینہ بھیجا۔ نبی نے اسے کوئی جواب نہیں دیا۔ ابوبکر اور عمر نے شفاعت سے انکار کر دیا۔ علی نے اسے خود تحفظ فراہم کرنے کا مشورہ دیا، جو اس نے کیا اور خالی ہاتھ گھر واپس آگئے۔"
