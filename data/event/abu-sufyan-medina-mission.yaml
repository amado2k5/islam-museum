label: { en: "Abu Sufyan's mission to Medina", ar: "بعثة أبي سفيان إلى المدينة لتجديد العقد" }
summary:
  en: "Frightened by what had been done at al-Watir, Quraysh sent Abu Sufyan ibn Harb to Medina to stiffen the pact and extend its term. The Prophet gave him no answer; Abu Bakr and Umar declined to intercede; Ali advised him to grant protection himself, which he did and returned home empty-handed."
  ar: "رَهِبت قريش ما صنعت فبعثت أبا سفيان بن حرب إلى المدينة يشد العقد ويزيد في المدة؛ فلم يرد عليه النبي شيئًا، وأبى أبو بكر وعمر أن يشفعا، وأشار عليه علي أن يجير بنفسه بين الناس ففعل ورجع إلى قريش خائبًا."
