id: event/bukhari-first-hearing-205
class: event
kind: other
label:
  ar: "أول سماع البخاري للحديث ببخارى، ٢٠٥هـ"
  en: "Al-Bukhari's first hearing of hadith at Bukhara, 205/820"
  ur: "بخاری کا پہلا سماعِ حدیث بخارا میں، 205ھ/820ء"
summary:
  ar: "أول سماع البخاري سنة ٢٠٥هـ وهو ابن نحو عشر سنين، ونشأ يتيماً فحفظ الحديث غيباً حتى كان أصحابه يصححون ما كتبوه مما أملاه عليهم حفظاً {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}؛ وأُعطي من الذكاء وقوة الحافظة ما نبّه به شيوخه وهو صغير {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  en: "Al-Bukhari's first hearing was in 205 when he was about ten years old; reared an orphan, he memorised hadith by heart until his companions would correct what they had written down from what he dictated to them from memory {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}; he was so gifted in intelligence and memory that as a boy he could already correct his teachers {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  ur: "بخاری کا پہلا سماع 205ھ میں تھا جب وہ تقریباً دس برس کے تھے؛ یتیم پرورش پائی، انہوں نے حدیث زبانی یاد کی یہاں تک کہ ان کے ساتھی اپنی تحریریں ان کے زبانی املا سے درست کرتے {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}؛ ذہانت اور قوتِ حافظہ اتنی تھی کہ بچپن میں ہی وہ اپنے اساتذہ کی اصلاح کرتے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}۔"
