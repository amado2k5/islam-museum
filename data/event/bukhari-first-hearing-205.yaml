id: event/bukhari-first-hearing-205
class: event
kind: other
label:
  ar: "أول سماع البخاري للحديث ببخارى، ٢٠٥هـ"
  en: "Al-Bukhari's first hearing of hadith at Bukhara, 205/820"
  ur: "بخاری کا پہلا سماعِ حدیث بخارا میں، 205ھ/820ء"
  fr: "La première audition de hadith d'al-Bukhari à Boukhara, 205/820"
  es: "Primera audiencia de hadices de Al-Bujari en Bujará, 205/820"
  tr: "Buhari hadisleri ilk kez Hicri 205 yılında Buhara'da işitti."
  id: "Al-Bukhari pertama kali mendengar hadits di Bukhara, tahun 205 Hijriah."
summary:
  ar: "أول سماع البخاري سنة ٢٠٥هـ وهو ابن نحو عشر سنين، ونشأ يتيماً فحفظ الحديث غيباً حتى كان أصحابه يصححون ما كتبوه مما أملاه عليهم حفظاً {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}؛ وأُعطي من الذكاء وقوة الحافظة ما نبّه به شيوخه وهو صغير {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  en: "Al-Bukhari's first hearing was in 205 when he was about ten years old; reared an orphan, he memorised hadith by heart until his companions would correct what they had written down from what he dictated to them from memory {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}; he was so gifted in intelligence and memory that as a boy he could already correct his teachers {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  ur: "بخاری کا پہلا سماع 205ھ میں تھا جب وہ تقریباً دس برس کے تھے؛ یتیم پرورش پائی، انہوں نے حدیث زبانی یاد کی یہاں تک کہ ان کے ساتھی اپنی تحریریں ان کے زبانی املا سے درست کرتے {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}؛ ذہانت اور قوتِ حافظہ اتنی تھی کہ بچپن میں ہی وہ اپنے اساتذہ کی اصلاح کرتے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}۔"
  fr: "La première audition d'al-Bukhari eut lieu en 205, alors qu'il avait environ dix ans ; élevé orphelin, il apprenait les hadiths par cœur, au point que ses compagnons corrigeaient ce qu'ils avaient noté d'après ce qu'il leur dictait de mémoire {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360} ; il était si doué d'intelligence et de mémoire qu'enfant, il pouvait déjà corriger ses maîtres {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  es: "La primera vez que Al-Bujari escuchó algo fue en el año 205, cuando tenía unos diez años; criado como huérfano, memorizó hadices de memoria hasta que sus compañeros corregían lo que habían escrito a partir de lo que él les dictaba de memoria {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}; estaba tan dotado de inteligencia y memoria que, siendo niño, ya podía corregir a sus maestros {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  tr: "Buhari, Hicri 205 yılında yaklaşık on yaşındayken bu hadisi ilk kez işitti ve yetim olarak büyüdüğü için, arkadaşları onun ezberden dikte ettiklerinden yola çıkarak yazdıklarını düzeltene kadar hadisi ezberledi. {Kaynak: Tabaqat-Shafiiyya-Subki, cilt 2, s. 3} {Kaynak: Encyclopaedia-of-islam-2, cilt 1, s. 1360}. Genç yaşta şeyhlerini uyaran bir zekâ ve güçlü bir hafızaya sahipti. {Kaynak: Encyclopaedia-of-islam-2, cilt 1, s. 1360}"
  id: "Al-Bukhari pertama kali mendengar hadits ini pada tahun 205 H ketika ia berusia sekitar sepuluh tahun, dan ia tumbuh sebagai yatim piatu, sehingga ia menghafal hadits tersebut hingga para sahabatnya mengoreksi apa yang mereka tulis berdasarkan apa yang ia diktekan kepada mereka dari hafalannya {cite:tabaqat-shafiiyya-subki j.2 p. 3} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}; dan ia dianugerahi kecerdasan dan daya ingat yang kuat yang membuat para syekhnya waspada ketika ia masih muda {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
