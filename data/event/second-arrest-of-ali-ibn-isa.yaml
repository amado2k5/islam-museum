label: { ar: "القبض على علي بن عيسى الوزير", en: "The second arrest of the vizier Ali ibn Isa", es: "El segundo arresto del visir Ali ibn Isa", fr: "La seconde arrestation du vizir Ali ibn Isa", ur: "وزیر علی ابن عیسیٰ کی دوسری گرفتاری۔", tr: "Ali bin İsa el-Vezir'in tutuklanması", id: "Penangkapan Ali bin Issa al-Wazir" }
summary:
  ar: "في سنة ست عشرة وثلاثمائة قُبض على الوزير علي بن عيسى ووُكّل به في دار الخليفة، وقلّد المقتدر الوزارة محمد بن علي بن مقلة، وكان قد أُحضر إلى الدار بعد مراسلات وضمانات {cite:tabari-tarikh-abu-al-fadl j.11 p.117}."
  en: "In 316 the vizier Ali ibn Isa was arrested and placed under guard in the caliph's palace, and al-Muqtadir entrusted the vizierate to Muhammad ibn Ali ibn Muqla; he had been brought to the palace after letters and guarantees were exchanged {cite:tabari-tarikh-abu-al-fadl j.11 p.117}."
  es: "En 316, el visir Ali ibn Isa fue arrestado y puesto bajo custodia en el palacio del califa, y al-Muqtadir confió el visirato a Muhammad ibn Ali ibn Muqla; este había sido llevado al palacio después de que se intercambiaran cartas y garantías {cite:tabari-tarikh-abu-al-fadl j.11 p.117}."
  fr: "En 316, le vizir Ali ibn Isa fut arrêté et placé sous garde dans le palais du calife, et al-Muqtadir confia le vizirat à Muhammad ibn Ali ibn Muqla; il avait été amené au palais après que des lettres et des garanties aient été échangées {cite:tabari-tarikh-abu-al-fadl j.11 p.117}."
  ur: "316 میں وزیر علی ابن عیسیٰ کو گرفتار کر کے خلیفہ کے محل میں پہرے میں رکھا گیا اور مقتدر نے وزیر کو محمد بن علی ابن مقلہ کے سپرد کر دیا۔ خطوط اور ضمانتوں کے تبادلے کے بعد اسے محل لایا گیا تھا۔"
  tr: "Hicri 316 yılında, vezir Ali bin İsa tutuklanarak halifenin evine yerleştirildi ve Muktadir, Muhammed bin Ali bin Mukla'yı vezir olarak atadı; kendisi de yazışmalar ve kefaletler sonrasında eve getirildi. {Kaynak: Tabari-tarikh-abu-al-fadl c.11 s.117}"
  id: "Pada tahun 316 H, menteri Ali bin Isa ditangkap dan ditempatkan di kediaman Khalifah, dan Al-Muqtadir menunjuk Muhammad bin Ali bin Muqla sebagai menteri, dan dia dibawa ke kediaman tersebut setelah melalui korespondensi dan jaminan. {cite:tabari-tarikh-abu-al-fadl j.11 p.117}."
