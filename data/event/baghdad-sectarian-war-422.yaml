summary:
  ar: "تجددت الفتنة بين السنة والرافضة ببغداد في ربيع الأول سنة 422هـ وكان سببها أن الخزرجي الصوفي الملقب بالمذكور قصد جامع المدينة لقراءة منشور من دار الخلافة وصاح العوام بين يديه بذكر أبي بكر وعمر وقالوا هذا يوم مغازي، فنافرهم أهل الكرخ ورموهم وثارت الفتنة ومنعت الصلاة ونُقبت دار المرتضى حتى نجّاه جيرانه من الأتراك، وأحرقت سمسرية ونهبت دور اليهود وخانقاهاتهم لأنه قيل عنهم إنهم أعانوا أهل الكرخ. ومن الغد اجتمع عامة أهل السنة وانضاف إليهم كثير من الأتراك وقصدوا الكرخ فأحرقوا وهدموا الأسواق فكتب الخليفة القادر إلى الملك والأصبهسلارية ينكر ذلك عليهم إنكاراً شديداً وأمر بإقامة الحد في الجناة، واحترق من هذه الفتنة سوق العروس وسوق الأنماط وسوق الصفارين وسوق الدقاقين ومواضع الحرير، وكُيس مسجد براثا الجامع ليلاً فأخذ ما فيه من حصر وسجادات وقلعت شبابيكه الحديد. ثم اقتتل أهل نهر طابق وأهل القلائين وأهل الكرخ وأهل باب البصرة وفي الجانب الشرقي أهل سوق السلاح وأهل سوق الثلاثاء وأهل باب الطاق والأساكفة وأهل سوق يحيى والرهاذرة وأهل الفرضة وأهل درب سليمان حتى قطع الجسر ليفرق بين الفريقين ودخل العيارون البلد وكثر الاستقفاء نهاراً والكيس ليلاً {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
