id: event/baghdad-sectarian-war-422
class: event
kind: civil-war
label: { ar: "فتنة سنة 422 بين السنة والرافضة ببغداد", en: "Sunni-Rafida Strife in Baghdad in 422", fr: "Troubles entre sunnites et Rafida à Bagdad en 422", es: "Conflicto entre suníes y Rafida en Bagdad en el año 422", ur: "422 میں بغداد میں سنی-رفیدہ جھگڑا", tr: "422 yılında Bağdat'ta Sünniler ve Şiiler arasında yaşanan çatışma.", id: "Konflik tahun 422 antara Sunni dan Syiah di Baghdad" }
summary:
  ar: "تجددت الفتنة بين السنة والرافضة ببغداد في ربيع الأول سنة 422هـ وكان سببها أن الخزرجي الصوفي الملقب بالمذكور قصد جامع المدينة لقراءة منشور من دار الخلافة وصاح العوام بين يديه بذكر أبي بكر وعمر وقالوا هذا يوم مغازي، فنافرهم أهل الكرخ ورموهم وثارت الفتنة ومنعت الصلاة ونُقبت دار المرتضى حتى نجّاه جيرانه من الأتراك، وأحرقت سمسرية ونهبت دور اليهود وخانقاهاتهم لأنه قيل عنهم إنهم أعانوا أهل الكرخ. ومن الغد اجتمع عامة أهل السنة وانضاف إليهم كثير من الأتراك وقصدوا الكرخ فأحرقوا وهدموا الأسواق فكتب الخليفة القادر إلى الملك والأصبهسلارية ينكر ذلك عليهم إنكاراً شديداً وأمر بإقامة الحد في الجناة، واحترق من هذه الفتنة سوق العروس وسوق الأنماط وسوق الصفارين وسوق الدقاقين ومواضع الحرير، وكُيس مسجد براثا الجامع ليلاً فأخذ ما فيه من حصر وسجادات وقلعت شبابيكه الحديد. ثم اقتتل أهل نهر طابق وأهل القلائين وأهل الكرخ وأهل باب البصرة وفي الجانب الشرقي أهل سوق السلاح وأهل سوق الثلاثاء وأهل باب الطاق والأساكفة وأهل سوق يحيى والرهاذرة وأهل الفرضة وأهل درب سليمان حتى قطع الجسر ليفرق بين الفريقين ودخل العيارون البلد وكثر الاستقفاء نهاراً والكيس ليلاً {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
  en: "In Rabi' I 422 the strife between the Sunnis and the Rafida in Baghdad broke out again. It began when al-Khazraji, a Sufi known as al-Madhkur, went to the city's main mosque to read a decree from the caliphal residence, and common people shouted the names of Abu Bakr and Umar before him, saying 'this is a day of raids.' The people of Karkh opposed them and pelted them, the fighting spread, prayer was halted, and the house of al-Murtada was breached until his Turkish neighbours rescued him. The Samsamiyya was burned, and the houses and khanqahs of the Jews were plundered, on the report that they had helped the people of Karkh. The next day the common Sunnis assembled, joined by many Turks, marched on Karkh and burned and demolished its markets. The caliph al-Qadir wrote to al-Malik and to the Isfahsalar condemning this in the strongest terms and ordering the legal penalty for the offenders. Burned in the strife were the Bride Market, the Carpet Market, the Coppersmiths' Market, the Cloth-Beaters' Market and the silk quarters; the Friday mosque of Baratha was raided at night, its mats and rugs taken and its iron windows torn out. Then the people of Nahr Tabaq, al-Qala'in, Karkh and Bab al-Basra fought one another, and on the eastern bank the people of the Arms Market, the Tuesday Market, Bab al-Taq and the cobblers, the market of Yahya, al-Rahadhira, al-Furda and Darb Sulayman. The bridge was cut to separate the two sides; 'ayyarun entered the city, and plunder by day and sacking by night increased {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
  fr: "En Rabi' I 422, les troubles entre les sunnites et les Rafida reprirent à Bagdad. Ils commencèrent lorsqu'al-Khazraji, un soufi connu sous le nom d'al-Madhkur, se rendit à la grande mosquée de la ville pour lire un décret venu de la résidence califale, et des gens du commun crièrent devant lui les noms d'Abu Bakr et d'Umar, disant « c'est un jour de razzias ». Les gens de Karkh s'opposèrent à eux et les lapidèrent, les combats s'étendirent, la prière fut interrompue, et la maison d'al-Murtada fut forcée jusqu'à ce que ses voisins turcs le secourent. La Samsamiyya fut incendiée, et les maisons et khanqahs des Juifs furent pillées, sur la nouvelle qu'ils avaient aidé les gens de Karkh. Le lendemain, le commun des sunnites se rassembla, rejoint par de nombreux Turcs, marcha sur Karkh, incendia et démolit ses marchés. Le calife al-Qadir écrivit à al-Malik et à l'Isfahsalar pour condamner cela dans les termes les plus sévères et ordonner la peine légale contre les coupables. Furent incendiés pendant les troubles le marché de la Mariée, le marché des Tapis, le marché des Chaudronniers, le marché des Fouleurs d'étoffes et les quartiers de la soie ; la mosquée du vendredi de Baratha fut attaquée de nuit, ses nattes et ses tapis emportés et ses fenêtres de fer arrachées. Puis les gens de Nahr Tabaq, d'al-Qala'in, de Karkh et de Bab al-Basra se battirent entre eux, et sur la rive est ceux du marché des Armes, du marché du Mardi, de Bab al-Taq et des cordonniers, du marché de Yahya, d'al-Rahadhira, d'al-Furda et de Darb Sulayman. Le pont fut coupé pour séparer les deux camps ; des 'ayyarun entrèrent dans la ville, et le pillage de jour et le saccage de nuit augmentèrent {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
  es: "En Rabi' I de 422, la lucha entre sunitas y rafidas en Bagdad se reanudó. Todo comenzó cuando al-Khazraji, un sufí conocido como al-Madhkur, acudió a la mezquita principal de la ciudad para leer un decreto de la residencia califal. Ante él, la gente común gritó los nombres de Abu Bakr y Umar, exclamando: «Hoy es día de incursiones». Los habitantes de Karkh se opusieron y los apedrearon; la lucha se extendió, se interrumpió la oración y la casa de al-Murtada fue asaltada hasta que sus vecinos turcos lo rescataron. La Samsamiyya fue incendiada y las casas y khanqahs de los judíos fueron saqueadas, bajo el rumor de que habían ayudado a la gente de Karkh. Al día siguiente, los sunitas, junto con muchos turcos, marcharon sobre Karkh e incendiaron y demolieron sus mercados. El califa al-Qadir escribió a al-Malik y al Isfahsalar condenando esto en los términos más enérgicos y ordenando el castigo legal para los culpables. En la contienda fueron incendiados el Mercado de Novias, el Mercado de Alfombras, el Mercado de Herreros, el Mercado de Batidores de Telas y los barrios de la seda; la mezquita del viernes de Baratha fue asaltada por la noche, sus esteras y alfombras fueron robadas y sus ventanas de hierro arrancadas. Luego, la gente de Nahr Tabaq, al-Qala'in, Karkh y Bab al-Basra lucharon entre sí, y en la orilla oriental la gente del Mercado de Armas, el Mercado del Martes, Bab al-Taq y los zapateros, el mercado de Yahya, al-Rahadhira, al-Furda y Darb Sulayman. El puente fue cortado para separar a los dos lados; 'ayyarun entró en la ciudad, y el saqueo de día y el pillaje de noche aumentaron {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
  ur: "ربیع الثانی 422 میں بغداد میں سنیوں اور رافضیوں کے درمیان دوبارہ لڑائی چھڑ گئی۔ یہ اس وقت شروع ہوا جب الخزرجی، المدکور کے نام سے مشہور ایک صوفی، خلیفہ کی رہائش گاہ سے ایک فرمان پڑھنے شہر کی مرکزی مسجد میں گیا، اور عام لوگوں نے اس کے سامنے ابوبکر اور عمر کا نام پکار کر کہا کہ یہ چھاپوں کا دن ہے۔ کرخ کے لوگوں نے ان کی مخالفت کی اور ان پر پتھراؤ کیا، لڑائی پھیل گئی، نماز روک دی گئی اور المرتضیٰ کے گھر کو توڑ دیا گیا یہاں تک کہ اس کے ترک پڑوسیوں نے اسے بچا لیا۔ صمصامیہ کو جلا دیا گیا، اور یہودیوں کے مکانات اور خانقاہوں کو لوٹ لیا گیا، اس اطلاع پر کہ انہوں نے کرخ کے لوگوں کی مدد کی تھی۔ اگلے دن عام سنی جمع ہوئے اور بہت سے ترکوں کے ساتھ مل کر کرخ پر مارچ کیا اور اس کے بازاروں کو جلایا اور گرایا۔ خلیفہ القادر نے المالک اور اصفہسالار کو خط لکھ کر اس کی سخت ترین الفاظ میں مذمت کی اور مجرموں کو قانونی سزا دینے کا حکم دیا۔ جھڑپوں میں برائیڈ مارکیٹ، کارپٹ مارکیٹ، کاپرسمتھز مارکیٹ، کلاتھ بیٹر مارکیٹ اور سلک کوارٹر جل گئے۔ براتہ کی جمعہ کی مسجد پر رات کے وقت چھاپہ مارا گیا، اس کی چٹائیاں اور قالین لے گئے اور اس کی لوہے کی کھڑکیاں پھاڑ دی گئیں۔ پھر نہر طبق، القلعین، کرخ اور باب البصرہ کے لوگ آپس میں لڑ پڑے، اور مشرقی کنارے پر اسلحہ منڈی، منگل بازار، باب الطاق اور موچی، یحییٰ، الراحد، الفردہ اور دارب سلیمان کے بازاروں کے لوگ آپس میں لڑ پڑے۔ پل کو دونوں اطراف کو الگ کرنے کے لیے کاٹا گیا تھا۔ عیارون شہر میں داخل ہوا اور دن کو لوٹ مار اور رات کو لوٹ مار میں اضافہ ہوا"
  tr: "Bağdat'taki Sünniler ve Şiiler arasındaki çekişme Hicri 422 Rebiü'l-Evvel ayında yeniden alevlendi. Bunun sebebi, el-Madhkur olarak bilinen bir Sufi olan el-Hazarci'nin, halifenin sarayından gelen bir bildiriyi okumak için şehrin camisine gitmesiydi. Halk, önünde Ebu Bekir ve Ömer'i anarak bağırdı ve \"Bugün savaş günüdür!\" diye haykırdı. Kerkh halkı onlara karşı çıktı, taş attı ve çatışma çıktı. Namaz kılınması engellendi ve el-Murtada'nın evi yağmalandı, ta ki Türk komşuları onu kurtarana kadar. Bir pazar yeri yakıldı ve Yahudilerin evleri ve Sufi tekkeleri yağmalandı, çünkü Kerkh halkına yardım ettikleri söyleniyordu. Ertesi gün, Sünniler, birçok Türk'ün de katılımıyla Kerkh'e giderek pazar yerlerini yakıp yıktılar. Halife el-Kadir, krala ve İsbahsalari'ye yazdığı mektupta, eylemlerini şiddetle kınadı ve faillerin İslam hukukuna göre cezalandırılmasını emretti. Bu çatışmada Gelin Pazarı, Terzi Pazarı, Bakırcılar Pazarı, Un Değirmenleri Pazarı ve ipek dükkanları yakıldı. Baratha Camii geceleyin yağmalandı, hasırları ve kilimleri çalındı ve demir pencereleri söküldü. Sonra Nahr Tabak halkı, Kalayin halkı, Kerh halkı, Bab el-Basra halkı ve doğu tarafında Çarşı el-Silah halkı, Çarşı el-Tulatha halkı, Bab el-Tak halkı, ayakkabıcılar, Çarşı Yahya halkı, Rahadhira halkı, el-Fardha halkı ve Darb Süleyman halkı, iki grubu ayıran köprü kesilinceye kadar savaştılar ve eşkıyalar şehre girdi, gündüz yankesicilik, gece ise cüzdan hırsızlığı arttı. {cite:muntazam-ibn-al-jawzi j.7 p.397-398}"
  id: "Konflik antara Sunni dan Syiah di Baghdad kembali berkobar pada bulan Rabi' al-Awwal 422 H. Penyebabnya adalah al-Khazraji, seorang Sufi yang dikenal sebagai al-Madhkur, pergi ke masjid kota untuk membacakan proklamasi dari istana Khalifah. Rakyat jelata berteriak di hadapannya, menyebut nama Abu Bakar dan Umar, dan menyatakan, \"Ini adalah hari peperangan!\" Penduduk al-Karkh menghadapi mereka, melempari batu, dan konflik pun meletus. Salat dihalangi, dan rumah al-Murtada dijarah hingga tetangga Turki-nya menyelamatkannya. Sebuah pasar dibakar, dan rumah-rumah serta pondok-pondok Sufi milik orang Yahudi dijarah karena dikatakan bahwa mereka telah membantu penduduk al-Karkh. Keesokan harinya, kaum Sunni berkumpul, bergabung dengan banyak orang Turki, dan pergi ke al-Karkh, membakar dan menghancurkan pasar-pasar. Khalifah al-Qadir menulis surat kepada raja dan Isbahsalari yang mengutuk keras tindakan mereka dan memerintahkan agar para pelaku dihukum sesuai dengan hukum Islam. Pasar Pengantin, Pasar Kain, Pasar Tukang Tembaga, Pasar Penggilingan Tepung, dan toko-toko sutra semuanya dibakar dalam perselisihan ini. Masjid Baratha dijarah pada malam hari, tikar dan karpetnya diambil, dan jendela-jendela besinya dilepas. Kemudian penduduk Nahr Tabak, penduduk Qala’in, penduduk Karkh, penduduk Bab al-Basra, dan di sisi timur penduduk Souq al-Silah, penduduk Souq al-Thulatha, penduduk Bab al-Taq, para tukang sepatu, penduduk Souq Yahya, Rahadhira, penduduk al-Fardha, dan penduduk Darb Sulayman bertempur hingga jembatan diputus untuk memisahkan kedua kelompok, dan para perampok memasuki kota, dan pencopetan meningkat pada siang hari dan pencurian dompet pada malam hari. {cite:muntazam-ibn-al-jawzi j.7 p.397-398}."
