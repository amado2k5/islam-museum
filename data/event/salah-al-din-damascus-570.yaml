id: event/salah-al-din-damascus-570
class: event
kind: conquest
label: { ar: "دخول صلاح الدين دمشق بلا قتال سنة 570", en: "Salah al-Din enters Damascus without fighting in 570", es: "Salah al-Din entra en Damasco sin luchar en el año 570.", fr: "Saladin entre à Damas sans combattre en 570.", ur: "صلاح الدین 570 میں بغیر لڑے دمشق میں داخل ہوا۔", tr: "Selahaddin Eyyubi 570 yılında herhangi bir çatışma yaşanmadan Şam'a girdi.", id: "Saladin memasuki Damaskus tanpa pertempuran pada tahun 570." }
summary:
  ar: "في سنة سبعين وخمسمائة قدم صلاح الدين فأخذ دمشق بلا ضربة ولا طعنة وسار الصالح إسماعيل بن نور الدين الشهيد في حاشيته إلى حلب، ثم سار صلاح الدين فحاصر حمص بالمجانيق ثم أخذ حماة في جمادى الآخرة ثم حاصر حلب وأساء المشورة في حق آل نور الدين ثم رد وتسلم حمص وعطف إلى بعلبك فتسلمها، ثم التقى عز الدين مسعود بن مودود صاحب الموصل فانهزم المواصلة على قرون حماة أسوأ هزيمة، واستناب أخاه سيف الإسلام بدمشق وكان بمصر أخوه العادل {cite:shadharat-dhahab p. 716-717}."
  en: "In 570 Salah al-Din took Damascus without a blow or a thrust — the young al-Salih Isma'il, Nur al-Din's heir, rode in his entourage to Aleppo — then besieged Homs with mangonels, took Hama in Jumada II, besieged Aleppo, doubled back to Homs and Baalbek, and routed Izz al-Din Mas'ud of Mosul's army at the Qurun of Hama in a crushing defeat; he left his brother Sayf al-Islam over Damascus while al-Adil held Egypt {cite:shadharat-dhahab p. 716-717}."
  es: "En 570, Salah al-Din tomó Damasco sin un solo golpe ni ataque; el joven al-Salih Isma'il, heredero de Nur al-Din, cabalgó con su séquito hasta Alepo. Luego sitió Homs con mangoneles, tomó Hama en Jumada II, sitió Alepo, regresó a Homs y Baalbek, y derrotó al ejército de Izz al-Din Mas'ud de Mosul en el Qurun de Hama en una aplastante derrota; dejó a su hermano Sayf al-Islam al frente de Damasco mientras al-Adil gobernaba Egipto {cite:shadharat-dhahab p. 716-717}."
  fr: "En 570, Salah al-Din prit Damas sans coup ni poussée — le jeune al-Salih Isma'il, héritier de Nur al-Din, se rendit à Alep avec son entourage — puis assiégea Homs avec des mangonneaux, prit Hama en Jumada II, assiégea Alep, retourna à Homs et Baalbek, et mit en déroute l'armée d'Izz al-Din Mas'ud de Mossoul au Qurun de Hama dans une défaite écrasante; il laissa son frère Sayf al-Islam à la tête de Damas tandis qu'al-Adil détenait l'Égypte {cite:shadharat-dhahab p. 716-717}."
  ur: "570 میں صلاح الدین نے دمشق کو بغیر کسی ضرب یا زور کے لے لیا - نوجوان الصالح اسماعیل، نورالدین کا وارث، اپنے وفد کے ساتھ حلب کی طرف روانہ ہوا - پھر مینگونیلز کے ساتھ حمص کا محاصرہ کیا، جمعہ دوم میں حما کو لے لیا، حلب کا محاصرہ کیا، اور مسقط کو واپس دوگنا کر دیا حما کے قرون میں موصل کی فوج کو عبرتناک شکست؛ اس نے اپنے بھائی سیف الاسلام کو دمشق پر چھوڑ دیا جب کہ عادل نے مصر پر قبضہ کر لیا 716-717}۔"
  tr: "Hicri 570 yılında Selahaddin, Şam'ı tek bir darbe veya bıçak darbesi olmadan ele geçirdi. Şehit Salih İsmail bin Nur el-Din, maiyetiyle birlikte Halep'e gitti. Ardından Selahaddin, mancınıklarla Humus'u kuşattı. Sonra Cemâde-i Ahiret'te Hama'yı aldı. Sonra Halep'i kuşattı ve Nur el-Din ailesi hakkında kötü tavsiyelerde bulundu. Sonra geri döndü, Humus'u ele geçirdi ve Baalbek'e yönelerek orayı da ele geçirdi. Sonra Musul hükümdarı İzz el-Din Mesud bin Mevdud ile görüştü ve Musul kuvvetleri Hama Boğazı'nda ağır bir yenilgiye uğradı. Şam'da vekili olarak kardeşi Seyf el-İslam'ı atadı, diğer kardeşi Adil ise Mısır'daydı. {kaynak: Şadharat-dhahab s. 716-717}"
  id: "Pada tahun 570 H, Saladin tiba dan merebut Damaskus tanpa perlawanan berarti. Al-Salih Ismail bin Nur al-Din, sang syahid, pergi bersama rombongannya ke Aleppo. Kemudian Saladin berbaris dan mengepung Homs dengan ketapel. Kemudian ia merebut Hama di Jumada al-Akhirah. Kemudian ia mengepung Aleppo dan memberikan nasihat buruk mengenai keluarga Nur al-Din. Kemudian ia kembali dan merebut Homs dan beralih ke Baalbek dan merebutnya. Kemudian ia bertemu Izz al-Din Masoud bin Mawdud, penguasa Mosul, dan pasukan Mosul dikalahkan di Tanduk Hama dalam kekalahan terburuk. Ia menunjuk saudaranya Saif al-Islam sebagai wakilnya di Damaskus, dan saudaranya al-Adil berada di Mesir. {cite:shadharat-dhahab hlm. 716-717}"
