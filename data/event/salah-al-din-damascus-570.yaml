label: { ar: "دخول صلاح الدين دمشق بلا قتال سنة 570" }
summary:
  ar: "في سنة سبعين وخمسمائة قدم صلاح الدين فأخذ دمشق بلا ضربة ولا طعنة وسار الصالح إسماعيل بن نور الدين الشهيد في حاشيته إلى حلب، ثم سار صلاح الدين فحاصر حمص بالمجانيق ثم أخذ حماة في جمادى الآخرة ثم حاصر حلب وأساء المشورة في حق آل نور الدين ثم رد وتسلم حمص وعطف إلى بعلبك فتسلمها، ثم التقى عز الدين مسعود بن مودود صاحب الموصل فانهزم المواصلة على قرون حماة أسوأ هزيمة، واستناب أخاه سيف الإسلام بدمشق وكان بمصر أخوه العادل {cite:shadharat-dhahab p. 716-717}."
  en: "In 570 Salah al-Din took Damascus without a blow or a thrust — the young al-Salih Isma'il, Nur al-Din's heir, rode in his entourage to Aleppo — then besieged Homs with mangonels, took Hama in Jumada II, besieged Aleppo, doubled back to Homs and Baalbek, and routed Izz al-Din Mas'ud of Mosul's army at the Qurun of Hama in a crushing defeat; he left his brother Sayf al-Islam over Damascus while al-Adil held Egypt {cite:shadharat-dhahab p. 716-717}."
