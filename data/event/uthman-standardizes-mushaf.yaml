summary:
  ar: "فزع حذيفة بن اليمان — وهو يغازي أهل الشام في فتح أرمينية وأذربيجان مع أهل العراق — من اختلاف القراء في القراءة فقال لعثمان «أدرك هذه الأمة قبل أن يختلفوا في الكتاب اختلاف اليهود والنصارى»، فأرسل عثمان إلى حفصة يستعير الصحف التي جمعها زيد بن ثابت في خلافة أبي بكر، وكلف أربعة — زيد بن ثابت وعبد الله بن الزبير وسعيد بن العاص وعبد الرحمن بن الحارث بن هشام — أن ينسخوها في المصاحف، وأمر القرشيين الثلاثة: إذا اختلفتم أنتم وزيد في شيء فاكتبوه بلسان قريش فإنما نزل بلسانهم، ثم أرسل إلى كل أفق بمصحف وأمر بما سواه من صحيفة أو مصحف أن يحرق {cite:sahih-al-bukhari 4987}. وفي خبر زيد الملحق أن آية من الأحزاب فقدت حين النسخ فوجدت عند خزيمة بن ثابت {cite:sahih-al-bukhari 4988}."
  en: "Hudhayfa ibn al-Yaman, alarmed at the readers' divergence during the Armenia-Azerbaijan campaign, pressed Uthman to save the community before it split over the Book; Uthman borrowed Hafsa's codex, commissioned Zayd ibn Thabit and three Qurashis to copy it into masahif — 'write it in the tongue of Quraysh' — sent a copy to every garrison city and ordered all other codices burned {cite:sahih-al-bukhari 4987}."
  es: "Hudhayfa ibn al-Yaman, alarmado por la divergencia de los lectores durante la campaña de Armenia-Azerbaiyán, presionó a Uthman para que salvara a la comunidad antes de que se dividiera por el Libro; Uthman tomó prestado el códice de Hafsa, encargó a Zayd ibn Thabit y a tres Quraysh que lo copiaran en masahif —'escríbelo en la lengua de los Quraysh'—, envió una copia a cada ciudad guarnición y ordenó que se quemaran todos los demás códices {cite:sahih-al-bukhari 4987}."
  fr: "Hudhayfa ibn al-Yaman, alarmé par la divergence des lecteurs pendant la campagne d'Arménie-Azerbaïdjan, pressa Uthman de sauver la communauté avant qu'elle ne se divise à propos du Livre; Uthman emprunta le codex de Hafsa, chargea Zayd ibn Thabit et trois Qurashis de le copier en masahif — « écrivez-le dans la langue des Quraysh » — envoya une copie à chaque ville de garnison et ordonna que tous les autres codex soient brûlés {cite:sahih-al-bukhari 4987}."
  ur: "حذیفہ ابن ال یمان، آرمینیا-آذربائیجان مہم کے دوران قارئین کے انحراف سے گھبرا گیا، عثمان پر دباؤ ڈالا کہ وہ کتاب پر تقسیم ہونے سے پہلے کمیونٹی کو بچائے۔ عثمان نے حفصہ کا ضابطہ مستعار لیا، زید بن ثابت اور تین قریش کو حکم دیا کہ وہ اسے مصحف میں نقل کریں - 'اسے قریش کی زبان میں لکھیں' - ایک ایک نقل ہر گیریژن شہر کو بھیجی اور حکم دیا کہ باقی تمام ضابطوں کو جلا دیا جائے {حوالہ: صحیح البخاری 4987}"
  tr: "Huzeyfe ibn el-Yaman, Irak halkıyla birlikte Ermenistan ve Azerbaycan'ın fethine önderlik ederken, Kur'an okuyucuları arasındaki tilavet farklılıklarından endişelendi. Osman'a, \"Yahudiler ve Hristiyanlar gibi Kitap konusunda ihtilafa düşmeden önce bu ümmeti kurtar\" dedi. Bunun üzerine Osman, Ebu Bekir halifeliği döneminde Zeyd ibn Sabit'in topladığı el yazmalarını ödünç almak için Hafsa'ya haber gönderdi. Ardından Zeyd ibn Sabit, Abdullah ibn el-Zübeyr, Sa'id ibn el-As ve Abd el-Rahman ibn el-Harith ibn Hişam olmak üzere dört kişiyi bu el yazmalarını kodekslere yazmaları için görevlendirdi. Üç Kureyşli adama şöyle talimat verdi: \"Eğer siz ve Zeyd herhangi bir konuda anlaşmazlığa düşerseniz, onu Kureyş lehçesinde yazın, çünkü o onların dilinde indirilmiştir.\" Daha sonra her bölgeye birer Kur'an nüshası gönderdi ve diğer tüm el yazmalarının veya kodekslerin yakılmasını emretti. [Sahih-i Buhari 4987] Zeyd'in ekteki anlatımında, Ahzab Suresi'nden bir ayetin kopyalama işlemi sırasında kaybolduğu, ancak daha sonra Huzeyme ibn Sabit'te bulunduğu belirtilmektedir. [Sahih-i Buhari 4988]"
  id: "Hudhayfah ibn al-Yaman, ketika memimpin penaklukan Armenia dan Azerbaijan bersama rakyat Irak, merasa prihatin dengan perbedaan dalam pembacaan Al-Quran di antara para pembacanya. Ia berkata kepada Utsman, \"Selamatkan bangsa ini sebelum mereka berselisih tentang Kitab Suci seperti halnya orang Yahudi dan Kristen berselisih.\" Maka Utsman mengirim utusan ke Hafsa untuk meminjam gulungan-gulungan yang telah dikumpulkan oleh Zaid ibn Thabit selama kekhalifahan Abu Bakr. Kemudian ia menugaskan empat orang—Zayd ibn Thabit, Abdullah ibn al-Zubayr, Sa'id ibn al-As, dan Abd al-Rahman ibn al-Harith ibn Hisham—untuk menyalinnya ke dalam kodeks. Ia menginstruksikan ketiga orang Quraisy itu: \"Jika kalian dan Zaid berselisih tentang sesuatu, tulislah dalam dialek Quraisy, karena Al-Quran diturunkan dalam bahasa mereka.\" Kemudian ia mengirimkan salinan Al-Quran ke setiap wilayah dan memerintahkan agar semua gulungan atau kodeks lainnya dibakar. [kutipan:sahih-al-bukhari 4987] Dalam catatan tambahan Zayd, disebutkan bahwa sebuah ayat dari Surah al-Ahzab hilang selama proses penyalinan tetapi kemudian ditemukan pada Khuzaymah ibn Thabit. [kutipan:sahih-al-bukhari 4988]"
