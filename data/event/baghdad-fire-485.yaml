label: { ar: "الحريق العظيم ببغداد سنة 485", en: "The Great Fire of Baghdad in 485", fr: "Le grand incendie de Bagdad en 485", es: "El Gran Incendio de Bagdad en 485", ur: "485 میں بغداد کی عظیم آگ", tr: "485 yılında Bağdat'ın Büyük Yangını", id: "Kebakaran Besar Baghdad pada tahun 485" }
summary:
  ar: "في جمادى الآخرة سنة خمس وثمانين وأربعمائة وقع ببغداد حريق عظيم احترق فيه من الناس عدد كثير، وكان ممن احترق فيه القارئ أبو عبد الله البانياسي مالك بن أحمد بن علي بن الفراء البغدادي وله سبع وثمانون سنة {cite:shadharat-dhahab p. 376}."
  en: "In Jumada II 485 a great fire struck Baghdad in which a great number perished — among them the qari' Abu Abd Allah al-Banyasi Malik b. Ahmad b. Ali b. al-Farra', aged eighty-seven {cite:shadharat-dhahab p. 376}."
  fr: "En Jumada II 485, un grand incendie frappa Bagdad, où périt un grand nombre de personnes, dont le récitateur Abu Abd Allah al-Banyasi Malik ibn Ahmad ibn Ali ibn al-Farra', âgé de quatre-vingt-sept ans {cite:shadharat-dhahab p. 376}."
  es: "En Jumada II de 485, un gran incendio azotó Bagdad en el que pereció un gran número de personas, entre ellas el qari' Abu Abd Allah al-Banyasi Malik b. Ahmad b. Ali b. al-Farra', de ochenta y siete años {citar: shadharat-dhahab p. 376}."
  ur: "جمادی الثانی 485 میں بغداد میں ایک زبردست آگ لگی جس میں ایک بڑی تعداد ہلاک ہو گئی - ان میں قاری ابو عبد اللہ البنیاسی مالک بن۔ احمد بی۔ علی بی الفارع، عمر ستاسی {حوالہ: شدھارت ذہاب ص۱۲۲۔ 376}۔"
  tr: "Hicri 485 yılının Cemâde-i Ahiret gününde Bağdat'ta büyük bir yangın çıktı ve çok sayıda insan yandı. Yananlar arasında seksen yedi yaşında olan Kur'an okuyucusu Ebu Abdullah el-Benyasi Malik bin Ahmed bin Ali bin el-Farra' el-Bağdadi de vardı. {kaynak: Şadharat-dhahab s. 376}"
  id: "Pada bulan Jumada al-Akhirah tahun 485 H, terjadi kebakaran besar di Baghdad yang menewaskan banyak orang. Di antara mereka yang terbakar adalah qari Abu Abdullah al-Baniasi Malik bin Ahmad bin Ali bin al-Farra’ al-Baghdadi, yang berusia delapan puluh tujuh tahun. {cite:shadharat-dhahab p. 376}"
