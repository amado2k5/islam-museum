id: event/al-subki-rihla-damascus-hajj-710
class: event
kind: other
label:
  ar: "رحلة السبكي إلى دمشق وأداؤه الحج، نحو ٧١٠هـ"
  en: "Al-Subki's journey to Damascus and the Pilgrimage, c. 710/1310"
  ur: "سبکی کا دمشق کا سفر اور حج، تقریباً 710ھ/1310ء"
  es: "El viaje de Al-Subki a Damasco y la peregrinación, c. 710/1310"
  fr: "Le voyage d'Al-Subki à Damas et le pèlerinage, vers 710/1310"
  tr: "El-Subki'nin Şam'a yolculuğu ve yaklaşık 710 Hicri yılında Hac ibadetini yerine getirmesi."
  id: "Perjalanan Al-Subki ke Damaskus dan pelaksanaan ibadah hajinya, sekitar tahun 710 Hijriah."
summary:
  ar: "بعد تحصيله بالقاهرة رحل السبكي إلى دمشق وأدّى فريضة الحج، ثم عاد إلى مصر فدرّس بالمدرسة المنصورية عند جامع ابن طولون {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}؛ ويذكر ابن كثير أنه رحل إلى الشام وقرأ بنفسه وكتب وخرّج {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}."
  en: "After his studies in Cairo, al-Subki travelled to Damascus and performed the Pilgrimage, then returned to Egypt to teach at the Mansuriyya madrasa beside the mosque of Ibn Tulun {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}; Ibn Kathir records that he journeyed to Syria, studied on his own, wrote and taught {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}."
  ur: "قاہرہ میں تعلیم کے بعد سبکی دمشق گئے اور حج ادا کیا، پھر مصر واپس آئے اور جامع ابن طولون کے پاس مدرسہ منصوریہ میں تدریس کی {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}؛ ابن کثیر کے مطابق وہ شام گئے، خود پڑھے، لکھا اور پڑھایا {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}۔"
  es: "Después de sus estudios en El Cairo, al-Subki viajó a Damasco y realizó la Peregrinación, luego regresó a Egipto para enseñar en la Madrasa Mansuriyya junto a la mezquita de Ibn Tulun {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}; Ibn Kathir registra que viajó a Siria, estudió por su cuenta, escribió y enseñó {cite: al-bidaya-wal-nihaya sa 756 p. 264}."
  fr: "Après ses études au Caire, al-Subki se rendit à Damas et effectua le pèlerinage, puis retourna en Égypte pour enseigner à la madrasa Mansuriyya, près de la mosquée d'Ibn Tulun {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}; Ibn Kathir rapporte qu'il voyagea en Syrie, étudia seul, écrivit et enseigna {cite: al-bidaya-wal-nihaya sa 756 p. 264}."
  tr: "Kahire'deki eğitiminden sonra El-Subki Şam'a giderek Hac ibadetini yerine getirdi, ardından Mısır'a döndü ve İbn Tulun Camii yakınlarındaki El-Mansuriye Okulu'nda ders verdi {kaynak:encyclopaedia-of-islam-2 cilt 9 s. 744-745}; İbn Kathir ise onun Levant'a seyahat ettiğini, kendi başına okuduğunu, yazdığını ve eserler ürettiğini belirtir {kaynak:al-bidaya-wal-nihaya sa 756 s. 264}."
  id: "Setelah studinya di Kairo, Al-Subki melakukan perjalanan ke Damaskus dan menunaikan ibadah haji, kemudian kembali ke Mesir dan mengajar di Sekolah Al-Mansuriyya dekat Masjid Ibn Tulun {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}; dan Ibn Kathir menyebutkan bahwa ia melakukan perjalanan ke Levant dan membaca sendiri, menulis dan menghasilkan karya {cite:al-bidaya-wal-nihaya sa 756 p. 264}."
