id: event/deathbed-and-estate-of-salah-al-din
class: event
kind: death
label:
  ar: احتضار صلاح الدين الأيوبي ودفنه وما ترك من مال
  en: Deathbed, burial and estate of Salah al-Din
  ur: صلاح الدین ایوبی کا آخری وقت، تدفین اور ترکہ
  es: "Lecho de muerte, entierro y patrimonio de Salah al-Din"
  fr: "Lit de mort, enterrement et succession de Saladin"
  tr: "Selahaddin'in ölümü ve cenazesi ile geride bıraktığı servet."
  id: "Kematian dan pemakaman Saladin, serta kekayaan yang ditinggalkannya."
summary:
  ar: "أصابت صلاح الدين حمى صفراوية ليلة السبت سادس عشر صفر سنة تسع وثمانين وخمسمئة بعد عودته من استقبال الحجاج، فبويع لابنه الأفضل في مرضه {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}. وتوفي فجر الأربعاء بعد أن قرئ عنده القرآن، وتبسم عند آية التوكل {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. وغسله الفقيه الدولعي وأحضر القاضي الفاضل الكفن من ماله، ودُفن في داره بالقلعة ثم نُقل إلى تربته قرب الجامع الأموي عاشوراء سنة اثنتين وتسعين {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. ولم يترك إلا ديناراً صورياً واحداً وستة وثلاثين درهماً ولا داراً ولا عقاراً {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  en: "A bilious fever struck Salah al-Din on the night of Saturday, 16 Safar 589, after he returned from greeting the pilgrims, and the commanders swore allegiance to his son al-Afdal during the illness {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}. He died at dawn on the Wednesday after the Qur'an had been read beside him, smiling at the verse of trust in God {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. The jurist al-Dawla'i washed him, al-Qadi al-Fadil supplied the shroud from his own wealth, and he was buried in his house in the citadel and moved to his tomb beside the Umayyad Mosque on Ashura 592 {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. He left one Tyrian dinar and thirty-six dirhams and no house or property {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  ur: "حاجیوں کے استقبال سے لوٹنے کے بعد ہفتے کی رات 16 صفر 589 ہجری کو صلاح الدین کو صفراوی بخار نے آ لیا، اور بیماری میں امیروں نے ان کے بیٹے افضل کی بیعت کی {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}۔ ان کے پاس قرآن پڑھا گیا اور وہ بدھ کی فجر میں توکل کی آیت پر مسکراتے ہوئے فوت ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}۔ فقیہ دولعی نے غسل دیا، قاضی فاضل نے کفن اپنے مال سے دیا، قلعے میں ان کے گھر میں دفن ہوئے اور عاشورا سن 592 کو جامع اموی کے پہلو میں ان کے مقبرے میں منتقل ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}۔ انھوں نے صرف ایک صوری دینار اور چھتیس درہم چھوڑے، نہ گھر نہ جائیداد {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}۔"
  es: "Una fiebre biliar azotó a Salah al-Din la noche del sábado 16 de Safar de 589, después de regresar de saludar a los peregrinos, y los comandantes juraron lealtad a su hijo al-Afdal durante la enfermedad {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}. Murió al amanecer del miércoles después de que se leyera el Corán a su lado, sonriendo ante el versículo de la confianza en Dios {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. El jurista al-Dawla'i lo lavó, al-Qadi al-Fadil proporcionó la mortaja con su propia riqueza, y fue enterrado en su casa en la ciudadela y trasladado a su tumba junto a la Mezquita Omeya en Ashura de 592 {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. Dejó un dinar tirio y treinta y seis dirhams y ninguna casa ni propiedad {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  fr: "Une fièvre bilieuse frappa Saladin dans la nuit du samedi 16 Safar 589, après son retour de la visite des pèlerins. Durant sa maladie, les commandants prêtèrent serment d'allégeance à son fils al-Afdal (source: al-bidaya-wal-nihaya, vol. 1, p. 7). Il mourut à l'aube du mercredi suivant, après la récitation du Coran à ses côtés. Il sourit au verset invitant à la confiance en Dieu (source: al-bidaya-wal-nihaya, vol. 1, p. 8). Le juriste al-Dawla'i le lava, le cadi al-Fadil fournit le linceul de sa propre fortune, et il fut inhumé dans sa maison de la citadelle, puis transféré dans son tombeau près de la mosquée des Omeyyades le jour d'Achoura 592 (source: al-bidaya-wal-nihaya, vol. 1, p. 8). Il laissa un dinar tyrien et trente-six dirhams, sans maison ni propriété {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  tr: "Selahaddin, hacıları kabul ettikten sonra, Hicri 589 yılının Safer ayının 16. Cumartesi gecesi sarılık hastalığına yakalandı. Hastalığı sırasında oğlu Afdal'a biat edildi. Çarşamba günü şafak vakti, huzurunda Kur'an okunduktan sonra vefat etti ve Allah'a tevekkül ayetinde gülümsedi. Hukukçu Davlaî cesedini yıkadı ve Kadı Fadil kefeni kendi imkanlarıyla temin etti. Kale içindeki evine defnedildi, ardından kalıntıları Hicri 592 yılının Aşura günü Emevi Camii yakınlarındaki türbesine nakledildi. Geride sadece bir sahte dinar ve otuz altı dirhem bıraktı, evi veya malı yoktu."
  id: "Saladin terserang penyakit kuning pada malam Sabtu, tanggal 16 Safar, 589 H, setelah kembali dari menerima para peziarah. Selama sakitnya, putranya, al-Afdal, menerima sumpah setia. Ia wafat pada subuh hari Rabu setelah Al-Quran dibacakan di hadapannya, dan ia tersenyum mendengar ayat tentang berserah diri kepada Allah. Ulama al-Dawla'i memandikan jenazahnya, dan al-Qadi al-Fadil menyediakan kain kafan dari dana pribadinya. Ia dimakamkan di rumahnya di Benteng, kemudian jenazahnya dipindahkan ke makamnya di dekat Masjid Umayyah pada hari Asyura, 592 H. Ia hanya meninggalkan satu dinar fiktif dan tiga puluh enam dirham, dan tidak meninggalkan rumah atau harta benda."
