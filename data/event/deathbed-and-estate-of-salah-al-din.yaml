id: event/deathbed-and-estate-of-salah-al-din
class: event
kind: death
label:
  ar: احتضار صلاح الدين الأيوبي ودفنه وما ترك من مال
  en: Deathbed, burial and estate of Salah al-Din
  ur: صلاح الدین ایوبی کا آخری وقت، تدفین اور ترکہ
summary:
  ar: "أصابت صلاح الدين حمى صفراوية ليلة السبت سادس عشر صفر سنة تسع وثمانين وخمسمئة بعد عودته من استقبال الحجاج، فبويع لابنه الأفضل في مرضه {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}. وتوفي فجر الأربعاء بعد أن قرئ عنده القرآن، وتبسم عند آية التوكل {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. وغسله الفقيه الدولعي وأحضر القاضي الفاضل الكفن من ماله، ودُفن في داره بالقلعة ثم نُقل إلى تربته قرب الجامع الأموي عاشوراء سنة اثنتين وتسعين {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. ولم يترك إلا ديناراً صورياً واحداً وستة وثلاثين درهماً ولا داراً ولا عقاراً {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  en: "A bilious fever struck Salah al-Din on the night of Saturday, 16 Safar 589, after he returned from greeting the pilgrims, and the commanders swore allegiance to his son al-Afdal during the illness {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}. He died at dawn on the Wednesday after the Qur'an had been read beside him, smiling at the verse of trust in God {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. The jurist al-Dawla'i washed him, al-Qadi al-Fadil supplied the shroud from his own wealth, and he was buried in his house in the citadel and moved to his tomb beside the Umayyad Mosque on Ashura 592 {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}. He left one Tyrian dinar and thirty-six dirhams and no house or property {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}."
  ur: "حاجیوں کے استقبال سے لوٹنے کے بعد ہفتے کی رات 16 صفر 589 ہجری کو صلاح الدین کو صفراوی بخار نے آ لیا، اور بیماری میں امیروں نے ان کے بیٹے افضل کی بیعت کی {cite:al-bidaya-wal-nihaya scan vol. 1 p. 7}۔ ان کے پاس قرآن پڑھا گیا اور وہ بدھ کی فجر میں توکل کی آیت پر مسکراتے ہوئے فوت ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}۔ فقیہ دولعی نے غسل دیا، قاضی فاضل نے کفن اپنے مال سے دیا، قلعے میں ان کے گھر میں دفن ہوئے اور عاشورا سن 592 کو جامع اموی کے پہلو میں ان کے مقبرے میں منتقل ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 8}۔ انھوں نے صرف ایک صوری دینار اور چھتیس درہم چھوڑے، نہ گھر نہ جائیداد {cite:al-bidaya-wal-nihaya scan vol. 1 p. 9}۔"
