label: { ar: "الفرنج يأخذون طرابلس المغرب سنة 541" }
summary:
  ar: "في سنة إحدى وأربعين وخمسمائة أخذت الفرنج طرابلس المغرب بالسيف ثم عمروها؛ وفي سنة ثلاث وأربعين استغل رجال صاحب صقلية شدة القحط بإفريقية فأقبلوا في مائتين وخمسين مركباً فهرب منهم صاحب المهدية فأخذوها بلا ضربة ولا طعنة وصار للفرنج من طرابلس المغرب إلى قريب تونس {cite:shadharat-dhahab p. 608, 615}."
  en: "In 541 the Franks took Tripoli of the Maghreb by the sword and then settled it; and in 543, exploiting the famine in Ifriqiya, the men of Sicily's ruler came with two hundred and fifty ships — the lord of al-Mahdiyya fled and they took it without a blow or a thrust, so the Franks held the coast from Tripoli to near Tunis {cite:shadharat-dhahab p. 608, 615}."
