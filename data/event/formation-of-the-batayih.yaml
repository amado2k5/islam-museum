label: { ar: "حدوث البطائح", en: "The Formation of the Bata'ih (Great Swamp)", es: "La formación del Bata'ih (Gran Pantano)", fr: "La formation du Bata'ih (Grand Marais)", ur: "بطعیہ ⁦(عظیم دلدل)⁩ کی تشکیل" }
summary:
  ar: "عند البلاذري: كانت الفرس تتحدث بزوال ملكها وتروي في آية ذلك زلازل وطوفاناً تحدث وكانت دجلة تصب إلى دجلة البصرة التي تدعى الموراء في أنهار متشعبة فلما كان زمان قباذ بن فيروز انبثق في أسافل كسكر بئق عظيم فأغفل حتى غلب ماؤه وغرق كثيراً من أرضين عامرة وكان قباذ واهناً قليل التفقد لأمره فلما ولي أنوشروان ابنه أمر بذلك الماء فردم بالمسنايات حتى عاد بعض تلك الأرضين إلى عمارة ثم لما كانت السنة التي بعث فيها النبي عبد الله بن حذافة السهمي إلى كسرى أبرويز وهي سنة 7 ويقال سنة 6 زاد الفرات ودجلة زيادة عظيمة لم ير مثلها قبلها ولا بعدها وانبثقت بثوق عظام فجهد أبرويز أن يسدها فغلبه الماء ومال إلى موضع البطائح فطفا على العمارات والزروع فغرق عدة طساسيج كانت هناك وركب كسرى بنفسه لسد تلك البثوق ونثر الأموال على الانطاع وقتل الفعلة بالكفاية وصلب على بعض البثوق فيما يقال أربعين جساراً في يوم فلم يقدر للماء على حيلة ثم دخلت العرب أرض العراق وشغلت الأعاجم بالحروب فكانت البثوق تنفجر فلا يلتفت إليها وأعجز الدهاقين عن سد عظمها فاتسعت البطيحة وعرضت."
  en: "In al-Baladhuri: the Persians used to foretell their kingdom's end, relating earthquakes and floods among its signs; the Tigris had flowed into Basra's Tigris called al-Mawra' in branching channels. Under Qubad ibn Fayruz a great breach opened in lower Kaskar and was neglected until its waters drowned many cultivated lands — Qubad being weak and little attentive — until his son Anushirwan had it dammed with embankments and some lands returned to cultivation. Then in the year the Prophet sent Abdallah ibn Hudhayfa al-Sahmi to Khosrow Aparviz — year 7, some say 6 — the Euphrates and Tigris rose in a flood unseen before or after; great breaches burst. Aparviz strained to dam them but the water defeated him, spread to the Bata'ih's site, covered buildings and crops and drowned several tasasij. Khosrow rode out himself to plug the breaches, scattered money over the execution-hides, worked the laborers to death and crucified — it is said — forty diggers on one breach in a day; yet he found no device against the water. Then the Arabs entered Iraq, the Persians were consumed by war, the breaches burst unattended and the dihqans proved too weak to dam the greatest — so the Batayih widened and grew."
  es: "En al-Baladhuri: los persas solían predecir el fin de su reino, mencionando terremotos e inundaciones entre sus señales; el Tigris había desembocado en el Tigris de Basora llamado al-Mawra' en canales ramificados. Bajo Qubad ibn Fayruz se abrió una gran brecha en el bajo Kaskar y fue descuidada hasta que sus aguas inundaron muchas tierras cultivadas —Qubad era débil y poco atento— hasta que su hijo Anushirwan la represó con terraplenes y algunas tierras volvieron a cultivarse. Luego, en el año en que el Profeta envió a Abdallah ibn Hudhayfa al-Sahmi a Khosrow Aparviz —año 7, algunos dicen 6— el Éufrates y el Tigris crecieron en una inundación nunca antes vista ni después; se abrieron grandes brechas. Aparviz se esforzó por represarlas, pero el agua lo venció, se extendió hasta el sitio de Bata'ih, cubrió edificios y cultivos e inundó varios tasaij. Khosrow salió personalmente a tapar las brechas, esparció dinero sobre las pieles de ejecución, explotó a los obreros hasta la muerte y crucificó —se dice— a cuarenta excavadores en una sola brecha en un solo día; sin embargo, no encontró ningún mecanismo para contener el agua. Luego, los árabes entraron en Irak, los persas se vieron envueltos en la guerra, las brechas se abrieron sin ser atendidas y los dihqans resultaron demasiado débiles para represar la más grande; así, el río Batayih se ensanchó y creció."
  fr: "Dans al-Baladhuri: les Perses avaient coutume de prédire la fin de leur royaume, évoquant notamment les tremblements de terre et les inondations. Le Tigre se déversait dans le Tigre de Bassora, appelé al-Mawra', par des bras ramifiés. Sous le règne de Qubad ibn Fayruz, une grande brèche s'ouvrit dans le bas Kaskar et fut négligée jusqu'à ce que ses eaux submergent de nombreuses terres cultivées – Qubad étant faible et peu attentif – jusqu'à ce que son fils Anushirwan la fasse endiguer et que certaines terres soient de nouveau cultivées. Puis, l'année où le Prophète envoya Abdallah ibn Hudhayfa al-Sahmi auprès de Khosrow Aparviz – l'an 7, certains disent l'an 6 –, l'Euphrate et le Tigre sortirent en crue, une crue sans précédent; de grandes brèches s'ouvrirent. Aparviz s'efforça de les endiguer, mais les eaux eurent raison de lui, atteignirent le site des Bata'ih, recouvrirent les bâtiments et les récoltes et engloutirent plusieurs tasasij. Khosrow se rendit lui-même sur place pour colmater les brèches, distribua de l'argent sur les peaux des condamnés, fit travailler les ouvriers jusqu'à l'épuisement et crucifia, dit-on, quarante terrassiers par jour pour une seule brèche; pourtant, il ne trouva aucun moyen d'endiguer les eaux. Puis les Arabes entrèrent en Irak, les Perses furent ravagés par la guerre, les brèches éclatèrent sans être réparées et les dihqans se révélèrent trop faibles pour endiguer les plus importantes – si bien que la Batayih s'élargit et prospéra."
  ur: "البلادوری میں ہے: فارسی اپنی سلطنت کے خاتمے کی پیشین گوئی کرتے تھے، زلزلوں اور سیلابوں کو اس کی نشانیوں میں بیان کرتے تھے۔ دجلہ بصرہ کے دجلہ میں بہتا تھا جسے الماورہ کہتے ہیں۔ قباد ابن فیروز کے تحت نچلے کسکر میں ایک بہت بڑا شگاف کھلا اور اس وقت تک نظر انداز کیا گیا جب تک کہ اس کے پانی نے بہت سی کاشت کی زمینوں کو غرق کر دیا - قباد کمزور اور کم توجہ ہونے کی وجہ سے - یہاں تک کہ اس کے بیٹے انوشیروان نے اسے پشتوں سے باندھ دیا اور کچھ زمینیں دوبارہ کاشت کی طرف لوٹ گئیں۔ پھر جس سال نبی نے عبداللہ بن حذیفہ السہمی کو خسرو اپرویز بھیجا - سال 7، بعض کا کہنا ہے کہ 6 - فرات اور دجلہ اس سے پہلے یا بعد میں غیب کے سیلاب میں گرے؛ بڑی خلاف ورزیاں پھٹ جاتی ہیں۔ اپارویز نے انہیں باندھنے کے لیے دباؤ ڈالا لیکن پانی نے اسے شکست دے دی، بطعیہ کی جگہ پر پھیل گیا، عمارتوں اور فصلوں کو ڈھانپ دیا اور کئی تسجیوں کو غرق کر دیا۔ خسرو نے توڑ پھوڑ کرنے کے لیے خود باہر نکلا، پھانسی کی کھالوں پر پیسہ بکھیر دیا، مزدوروں کو موت کے گھاٹ اتارا اور مصلوب کیا - کہا جاتا ہے - ایک دن میں چالیس کھودنے والے۔ پھر بھی اسے پانی کے خلاف کوئی آلہ نہیں ملا۔ اس کے بعد عرب عراق میں داخل ہوئے، فارسی جنگ میں بھسم ہو گئے، خلاف ورزیاں بغیر کسی توجہ کے پھٹ گئیں اور دہقان اس قدر کمزور ثابت ہوئے کہ وہ سب سے بڑے کو بند نہیں کر سکتے۔"
