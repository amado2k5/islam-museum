label: { en: "The li'an between Uwaymir al-Ajlani and his wife", ar: "اللعان بين عويمر العجلاني وامرأته" }
summary:
  en: "After the return from Tabuk in 9 AH, Uwaymir al-Ajlani accused his wife before the Prophet; the Prophet administered between them the mutual oath of condemnation (li'an) prescribed in Surat al-Nur, then separated them — an early application of the li'an ruling."
  ar: "وقع اللعان بين عويمر العجلاني وامرأته بعد قدوم النبي من تبوك سنة 9هـ؛ رمى امرأته فتلاعنا عند النبي بالأيمان التي شرّعها القرآن في سورة النور، ثم فرّق النبي بينهما؛ وكانت من أوائل وقائع تطبيق حكم اللعان."
