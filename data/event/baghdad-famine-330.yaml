summary:
  ar: "في سنة ثلاثين وثلاثمائة بلغ كُرّ الحنطة مائتين وعشرة دنانير وكُرّ الشعير مائة وعشرين ثم باع كرّ الحنطة بثلاثمائة وستة عشر دينارًا، وأكل الضعفاء الميتة ودام الغلاء وكثر الموت وشُغل الناس بالمرض والفقر وتقطعت السبل وتُرك التدافن للوتي واشتغل الناس عن الملاهي واللعب {cite:muntazam-ibn-al-jawzi p. 618}."
  en: "In 330 a kurr of wheat reached 210 then 316 dinars, barley 120; the weak ate carrion, death multiplied, roads emptied, burials were left to charity and the people turned from all amusement {cite:muntazam-ibn-al-jawzi p. 618}."
  fr: "En 330, un kurr de blé atteignit 210 puis 316 dinars, l'orge 120 ; les faibles mangèrent des charognes, les morts se multiplièrent, les routes se vidèrent, les enterrements furent laissés à la charité et les gens se détournèrent de tout divertissement {cite:muntazam-ibn-al-jawzi p. 618}."
  es: "En el año 330, un kurr de trigo alcanzó los 210, luego los 316 dinares, la cebada los 120; los débiles comían carroña, la muerte se multiplicaba, los caminos se vaciaban, los entierros se dejaban a la caridad y la gente se apartaba de toda diversión {cita:muntazam-ibn-al-jawzi p. 618}."
  ur: "330 میں گندم کا ایک کُر 210، پھر 316 دینار، جَو 120۔ کمزوروں نے مردار کھایا، موت بڑھ گئی، سڑکیں خالی ہوگئیں، تدفین صدقہ کے لیے چھوڑ دی گئی اور لوگ تمام تفریحات سے منہ موڑ گئے۔ 618}۔"
