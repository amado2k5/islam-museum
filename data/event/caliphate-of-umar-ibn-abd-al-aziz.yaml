label: { ar: "تولية عمر بن عبد العزيز الخلافة" }
summary:
  ar: "في سنة تسع وتسعين استُخلف عمر بن عبد العزيز بدابق، بعد أن كتب سليمان بن عبد الملك عهده إليه {cite:tabari-tarikh-abu-al-fadl j.6 p.550} {cite:tabari-tarikh-abu-al-fadl j.6 p.551}، وذكر الطبري وفاته في سنة إحدى ومائة ضمن أخبار تلك السنة {cite:tabari-tarikh-abu-al-fadl j.6 p.565}، وعند السيوطي استشار سليمان رجاء بن حيْوة فأشار عليه بعمر وبعده يزيد فكتب العهد مختوماً وأمر الناس بالبيعة لمن فيه ومن أبى فاضرب عنقه، وتغيرت وجوه بني عبد الملك حتى سمعوا وبعده يزيد فتراجعوا، وعُقر بعمر حين قرئ الكتاب باسمه فأدنى إلى المنبر وأُصعد وقال إني لست بقاض ولكني منفذ ولست بمبتدع ولكني متبع، وأبى مركب الخليفة وركب دابته {cite:tarikh-khulafa-minhaj-1434 p. 371-377}"
