label: { ar: "تولية عمر بن عبد العزيز الخلافة", en: "Appointment of Umar ibn Abd al-Aziz as caliph" }
summary:
  ar: "في سنة تسع وتسعين استُخلف عمر بن عبد العزيز بدابق، بعد أن كتب سليمان بن عبد الملك عهده إليه {cite:tabari-tarikh-abu-al-fadl j.6 p.550} {cite:tabari-tarikh-abu-al-fadl j.6 p.551}، وذكر الطبري وفاته في سنة إحدى ومائة ضمن أخبار تلك السنة {cite:tabari-tarikh-abu-al-fadl j.6 p.565}، وعند السيوطي استشار سليمان رجاء بن حيْوة فأشار عليه بعمر وبعده يزيد فكتب العهد مختوماً وأمر الناس بالبيعة لمن فيه ومن أبى فاضرب عنقه، وتغيرت وجوه بني عبد الملك حتى سمعوا وبعده يزيد فتراجعوا، وعُقر بعمر حين قرئ الكتاب باسمه فأدنى إلى المنبر وأُصعد وقال إني لست بقاض ولكني منفذ ولست بمبتدع ولكني متبع، وأبى مركب الخليفة وركب دابته {cite:tarikh-khulafa-minhaj-1434 p. 371-377}"
  en: "In 99 Umar ibn Abd al-Aziz was appointed at Dabiq, after Sulayman ibn Abd al-Malik had written his testament to him {cite:tabari-tarikh-abu-al-fadl j.6 p.550} {cite:tabari-tarikh-abu-al-fadl j.6 p.551}. Al-Tabari gives his death in 101, among that year's reports {cite:tabari-tarikh-abu-al-fadl j.6 p.565}. In al-Suyuti: Sulayman consulted Raja' ibn Haywa, who advised Umar and after him Yazid; he wrote the testament, sealed it, and ordered the people to pay allegiance to whoever was named in it, and whoever refused should have his neck struck. The faces of the Banu Abd al-Malik changed until they heard 'and after him Yazid', and then they drew back. Umar was stunned when the letter was read out in his name; he was brought close to the pulpit and raised up, and said: 'I am not a judge, but an executor; I am not an innovator, but a follower.' He declined the caliph's mount and rode his own beast {cite:tarikh-khulafa-minhaj-1434 p. 371-377}"
