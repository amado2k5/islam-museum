id: event/earthquake-istanbul-bayezid
class: event
kind: other
label:
  ar: "الزلزلة الكبرى بالقسطنطينية في عهد بايزيد الثاني"
  en: "The great Constantinople earthquake under Bayezid II"
  es: "El gran terremoto de Constantinopla durante el reinado de Bayezid II"
  fr: "Le grand tremblement de terre de Constantinople sous Bayezid II"
  ur: "بایزید ثانی کے دور میں قسطنطنیہ کا عظیم زلزلہ"
  tr: "II. Bayezid döneminde meydana gelen Büyük Konstantinopolis Depremi"
  id: "Gempa Besar Konstantinopel pada masa pemerintahan Bayezid II"
summary:
  ar: "ينقل الصلابي أن زلازل عظيمة وقعت بالقسطنطينية في زمن بايزيد الثاني فأخربت ألفاً وسبعين بيتاً ومئة وتسعة جوامع وجانباً عظيماً من القصور وأسوار المدينة، وعطلت مجاري المياه، وصعد البحر إلى البر حتى تدفقت أمواجه فوق الأسوار، ولبثت تتجدد يومياً مدة خمسة وأربعين يوماً، فكلف السلطان بعد سكونها خمسة عشر ألفاً من العمال بإصلاح ما تهدم {cite:dawlat-uthmaniyya-salabi p. 174}."
  en: "Al-Salabi records great earthquakes striking Constantinople in Bayezid II's time: 1,070 houses and 109 mosques ruined, a great part of the palaces and city walls, water channels choked, the sea rising over the walls in waves, the shocks recurring daily for forty-five days — after which the sultan set 15,000 workers to rebuild what had fallen {cite:dawlat-uthmaniyya-salabi p. 174}."
  es: "Al-Salabi registra los grandes terremotos que azotaron Constantinopla en tiempos de Bayezid II: 1.070 casas y 109 mezquitas quedaron en ruinas, gran parte de los palacios y murallas de la ciudad, los canales de agua se obstruyeron, el mar subió por encima de las murallas en olas, los temblores se repitieron diariamente durante cuarenta y cinco días, tras lo cual el sultán puso a 15.000 trabajadores a reconstruir lo que se había derrumbado {cite:dawlat-uthmaniyya-salabi p. 174}."
  fr: "Al-Salabi relate les grands tremblements de terre qui ont frappé Constantinople à l'époque de Bayezid II: 1 070 maisons et 109 mosquées détruites, une grande partie des palais et des remparts de la ville, les canaux d'eau obstrués, la mer montant par-dessus les murs en vagues, les secousses se répétant quotidiennement pendant quarante-cinq jours — après quoi le sultan a chargé 15 000 ouvriers de reconstruire ce qui était tombé {cite:dawlat-uthmaniyya-salabi p. 174}."
  ur: "السلابی نے بایزید ثانی کے زمانے میں قسطنطنیہ میں آنے والے زبردست زلزلوں کو ریکارڈ کیا: 1,070 مکانات اور 109 مساجد تباہ، محلات اور شہر کی دیواروں کا بڑا حصہ، پانی کے نالے دم توڑ گئے، سمندر موجوں میں دیواروں کے اوپر اٹھتا، جھٹکے روزانہ آتے رہتے ہیں - جس کے بعد پینتالیس سے 50 مزدوروں کو 150 سے 50 دن کا وقت لگا۔ جو گرا تھا دوبارہ تعمیر کرو {حوالہ:دولت عثمانیہ سلبی ص 174}۔"
  tr: "El-Salabi'nin rivayetine göre, II. Bayezid döneminde İstanbul'da büyük depremler meydana gelmiş, bin yetmiş ev, yüz dokuz cami, sarayların ve surların büyük bir kısmı yıkılmış, su yolları tahrip olmuş ve deniz kıyıya kadar yükselerek surların üzerinden taşmış ve kırk beş gün boyunca her gün kendini yenilemeye devam etmiştir. Depremler dindikten sonra Sultan, yıkılan yerleri onarmak için on beş bin işçi görevlendirmiştir. {cite:dawlat-uthmaniyya-salabi s. 174}"
  id: "Al-Salabi melaporkan bahwa gempa bumi besar terjadi di Konstantinopel pada masa pemerintahan Bayezid II, menghancurkan seribu tujuh puluh rumah, seratus sembilan masjid, sebagian besar istana dan tembok kota, mengganggu jalur air, dan air laut naik ke pantai hingga ombaknya meluap melewati tembok, dan terus berulang setiap hari selama empat puluh lima hari. Setelah surut, Sultan menugaskan lima belas ribu pekerja untuk memperbaiki apa yang telah hancur. {cite:dawlat-uthmaniyya-salabi p. 174}"
