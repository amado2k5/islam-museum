summary:
  ar: "سنة ١٠٩٧م عبر جيش الحملة الصليبية الأولى قونية (إيقونية) في طريقه عبر الأناضول، فلم يجد فيها تحصينات صالحة للانتفاع لكنه انتفع ببساتينها المجاورة؛ وكانت المدينة قبل ذلك قاعدة عسكرية بيزنطية تفاداها المهاجمون في قرون الغزو العربي {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  en: "In 1097 the army of the First Crusade passed through Konya (Iconium) on its march across Anatolia; it found no serviceable fortifications there but drew benefit from the gardens around the town. In the centuries of the Arab invasions the place had been a Byzantine military base that the raiders tended to circumvent {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  ur: "1097ء میں پہلی صلیبی مہم کی فوج اناطولیہ سے گزرتی ہوئی قونیہ (آئیکونیم) سے ہو کر گزری؛ اسے شہر میں کوئی قابلِ استعمال دفاعی قلعہ نہ ملا مگر اردگرد کے باغات سے فائدہ اٹھایا۔ عرب حملوں کی صدیوں میں یہ مقام ایک بازنطینی فوجی اڈا رہا تھا جسے حملہ آور عام طور پر نظرانداز کرتے تھے۔"
