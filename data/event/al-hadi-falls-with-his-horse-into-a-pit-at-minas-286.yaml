id: event/al-hadi-falls-with-his-horse-into-a-pit-at-minas-286
class: event
kind: other
label:
  ar: سقوط الهادي وفرسه في حفرة بميناس قبل وقعة سوحان، ذو الحجة 286هـ
  en: Al-Hadi falls with his horse into a pit at Minas before the fight at Sawhan, Dhu al-Hijja 286 AH
  ur: سوحان کی لڑائی سے پہلے میناس میں ہادی کا گھوڑے سمیت گڑھے میں گرنا، ذوالحجہ 286ھ
summary:
  ar: يروي الكتاب أن الهادي خرج إلى ميناس لقطع بعض نخل ابن بسطام، وعند الظهر أمر بالانصراف وهو على فرس ضعيف لا فرسه الذي يقاتل عليه، فخرج أهل ميناس وسبقوه إلى باب الحصن فسقط هو وفرسه في حفرة، فسلّ سيفه ووثب في وجوههم فلم يدنُ منه أحد.
  en: The book says al-Hadi went out to Minas to cut some of Ibn Bustam's palms and at noon ordered his men back, riding a weak horse and not the one he fought on; the people of Minas came out and got ahead of him to the gate of the fort, and he and his horse fell into a pit, whereupon he drew his sword, sprang up before them and none came near him.
  ur: کتاب کے مطابق ہادی ابن بسطام کے کچھ کھجور کے درخت کاٹنے میناس گئے اور ظہر کے وقت واپسی کا حکم دیا؛ وہ کمزور گھوڑے پر تھے، اس پر نہیں جس پر لڑتے تھے؛ میناس والے نکلے اور قلعے کے دروازے تک ان سے آگے ہو گئے، تب وہ گھوڑے سمیت گڑھے میں گر گئے، تلوار کھینچ کر ان کے سامنے اٹھ کھڑے ہوئے اور کوئی ان کے قریب نہ آیا۔
