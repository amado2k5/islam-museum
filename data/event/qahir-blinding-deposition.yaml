id: event/qahir-blinding-deposition
class: event
kind: mutiny
label: { ar: "خلع القاهر وسمل عينيه", en: "The deposition of al-Qahir and the blinding of his eyes", es: "La deposición de al-Qahir y la ceguera de sus ojos.", fr: "La destitution d'al-Qahir et l'aveuglement de ses yeux", ur: "القاہر کی معزولی اور اس کی آنکھوں کا اندھا ہونا", tr: "El-Kahir kafasını kesti ve gözlerini kör etti.", id: "Al-Qahir memenggal kepalanya dan membutakan dirinya sendiri." }
summary:
  ar: "في سنة اثنتين وعشرين تحرك الجند على القاهر لأن ابن مقلة في اختفائه كان يوحشهم منه ويقول لهم إنه بنى لكم المطامير ليحبسكم فاجتمعوا على الفتك به فدخلوا عليه بالسيوف فهرب فأدركوه وقبضوا عليه في سادس جمادى الآخرة وبايعوا محمد بن المقتدر ولقبوه الراضي بالله فأرسلوا إلى القاهر الوزير والقضاة فقال لي في أعناقكم بيعة ولست أبرئكم ولا أحلكم منها فقال الوزير يخلع ولا يفكر فيه فأشار سيما مقدم الحجرية إلى الراضي بسمله فكحله بمسمار محمي حتى سالت عيناه على خديه وكان قبل قد ذبح مؤنس وابن مقلة وطين على ابن المكتفي بين حيطين لاتفاقهم على خلعه {cite:tarikh-khulafa-minhaj-1434 p. 597-599}. وعند المسعودي خلع يوم الأربعاء لخمس خلون من جمادى الأولى سنة اثنتين وعشرين وثلثمائة وسملت عيناه فكانت خلافته سنة وستة أشهر وستة أيام، وغيبه الراضي فلما بويع إبراهيم المتقي أصيب معتقلاً في بعض المقاصير فاعتقل بدار ابن طاهر {cite:muruj-al-dhahab p. 667-668}، وعند ابن الأثير كان سبب خلعه أن ابن مقلة والحسن بن هارون استخفيا منه فكانا يراسلان قواد الساجية والحجرية ويحذرونهم ويعطى ابن مقلة منجمين ومعبّرين يحذرونه من القاهر ويعبّرون له على ما يريد، وأن القاهر شرع في عمل مطامير في الدار فقيل لسيماء ولقواد الساجية والحجرية إنما عملها لأجلكم فازدادوا نفوراً، فاجتمعوا عند سيماء يوم الأربعاء وتصالفوا على القبض عليه وقال لهم سيماء قوموا يا الناس حتى نمضي قبل العزم فإنه إن تأخر مر به واحترز وأهلكنا، وزحفوا إلى الدار فوجدوه نائماً شرب أكثر ليلته فدلّهم عليه خادم صغير فوجدوه وبيده السيف فاجتهدوا إن يقاتل بهما فألانوا له القول حتى سل السيف ثم أخذوه وحبسوه في مطمورة طريف السبكري بعد أن أخرجوه منها وسملوه، ودُلل وزيره الخصيبي وسلامة حاجبه {cite:kamil-ibn-al-athir p. 209-210}"
  en: "In 322 the soldiers moved on al-Qahir — Ibn Muqla in hiding had set them against him — seized him on 6 Jumada II and hailed Muhammad ibn al-Muqtadir as al-Radi. Al-Qahir refused to release them from their bay'a; Sima, commander of the Hujariyya, had him blinded with a red-hot nail, his eyes running down his cheeks. Earlier that year he had slaughtered Mu'nis and his confederates and walled Ibn al-Muktafi alive between two walls for plotting his own deposition {cite:tarikh-khulafa-minhaj-1434 p. 597-599}."
  es: "En 322, los soldados atacaron a al-Qahir —Ibn Muqla, escondido, los había instigado contra él—, lo capturaron el 6 de Jumada II y aclamaron a Muhammad ibn al-Muqtadir como al-Radi. Al-Qahir se negó a liberarlos de su bay'a; Sima, comandante de los Hujariyya, lo cegó con un clavo al rojo vivo, y sus ojos le corrían por las mejillas. A principios de ese año, había masacrado a Mu'nis y a sus confederados, y había emparedado vivo a Ibn al-Muktafi entre dos muros por conspirar contra él mismo {cite:tarikh-khulafa-minhaj-1434 p. 597-599}."
  fr: "En 322, les soldats marchèrent sur al-Qahir — Ibn Muqla, caché, les avait incités à se retourner contre lui —, le capturèrent le 6 Jumada II et proclamèrent Muhammad ibn al-Muqtadir al-Radi. Al-Qahir refusa de les libérer de leur allégeance; Sima, commandant des Hujariyya, le fit aveugler avec un clou rougi au feu, ses yeux coulant sur ses joues. Plus tôt dans l'année, il avait massacré Mu'nis et ses alliés et avait fait emmuré vivant Ibn al-Muktafi entre deux murs pour avoir comploté sa propre destitution (voir: Tarikh-Khulafa-Minhaj-1434, p. 597-599)."
  ur: "322 میں سپاہی القاہر کی طرف بڑھے - چھپے ہوئے ابن مقلہ نے انہیں اس کے خلاف کھڑا کیا تھا - اسے 6 جمادی الثانی کو پکڑ لیا اور محمد بن المقتدر کو الرادی کہا۔ القاہر نے ان کو ان کی بیع سے رہا کرنے سے انکار کر دیا۔ ہجریہ کے کمانڈر سیما نے اسے سرخ کیل سے اندھا کر دیا تھا، اس کی آنکھیں اس کے گالوں پر بہہ رہی تھیں۔ اس سال کے شروع میں اس نے معنیس اور اس کے اتحادیوں کو ذبح کر دیا تھا اور ابن المکتفی کو اپنی ہی معزولی کی سازش کرنے پر دو دیواروں کے درمیان زندہ کر دیا تھا۔ 597-599}۔"
  tr: "Yirmi ikinci yılda, askerler İbn Muqlah'ın saklandığı yerden onları korkutması ve onları hapsetmek için zindanlar inşa ettiğini söylemesi üzerine, el-Kahir'e karşı harekete geçtiler. Bunun üzerine onu öldürmek için toplandılar ve kılıçlarla üzerine saldırdılar, ancak o kaçtı. Onu yakaladılar ve Cemâdî el-Ahirah'ın altıncı gününde esir aldılar. Muhammed ibn el-Muktadir'e biat ettiler ve ona el-Radi bi-Allah unvanını verdiler. El-Kahir'e vezir ve kadıları gönderdiler ve o bana, \"Boynunuzda biat yemini var ve sizi bundan kurtarmayacağım, serbest bırakmayacağım\" dedi. Vezir, \"O görevden alınmalı ve dikkate bile alınmamalı\" dedi. El-Hacariye komutanı Sima, el-Radi'yi işaret ederek ona bir tokat attı; bunun üzerine el-Radi, gözlerini kızgın bir çiviyle dağladı ve gözlerinden yaşlar aktı. Daha önce Mu'nis ve İbn Muqlah'ı katletmiş ve kendisini tahttan indirme konusunda anlaştıkları için İbn el-Muktafi'yi iki duvar arasına çamurla kaplamıştı. {Kaynak:tarikh-khulafa-minhaj-1434 s. 597-599}. El-Mas'udi'ye göre, 322 yılında Cemâdî-Ula ayının beşinci Çarşamba günü tahttan indirildi ve gözleri oyuldu. Halifeliği bir yıl, altı ay ve altı gün sürdü ve El-Radi onu ortadan kaybettirdi. İbrahim el-Muttaki'ye biat yemini ettirildiğinde, bazı odalarda hapsedilmiş haldeyken yakalandı ve İbn Tahir'in evine hapsedildi. {667-668} İbn el-Athir'e göre, tahttan indirilmesinin sebebi İbn Muqlah ve Hasan ibn Harun'un ondan saklanmalarıydı. Sajiyye ve Haceryye tugaylarının komutanlarıyla yazışıyorlar ve onları uyarıyorlardı. İbn Muqlah'a, onu El-Kahir hakkında uyaran ve istediği gibi yorumlayan astrologlar ve tercümanlar verildi. El-Kahir sarayda zindanlar inşa etmeye başlamıştı ve Sima'ya ve Sajiyye ile Haceryye tugaylarının komutanlarına bunun onların yararına yapıldığı söylendi, bu da onların öfkesini artırdı. Çarşamba günü Sima'nın evinde toplandılar ve onu tutuklamak için komplo kurdular. Sima onlara, \"Kalkın ey insanlar, mesele çözülmeden önce buradan ayrılalım, çünkü eğer gecikirse, geçip önlem alacak ve bizi yok edecektir\" dedi. Saraya doğru ilerlediler ve onu gece boyunca içki içmiş halde uyurken buldular. Genç bir hizmetçi onları yanına götürdü ve onu elinde bir kılıçla buldular. Onu kılıçla savaşmaya ikna etmeye çalıştılar, bu yüzden kılıcını çekene kadar onunla nazikçe konuştular. Sonra onu yakalayıp Tarif el-Sabkari zindanına hapsettiler, oradan çıkarıp gözlerini kör ettiler. Veziri el-Hasibi ve kâhyası Seleme de götürüldü. {Kaynak: Kamil İbn el-Athir, s. 209-210}"
  id: "Pada tahun ke-22, para prajurit bergerak melawan al-Qahir karena Ibnu Muqlah, saat bersembunyi, membuat mereka takut kepadanya dan mengatakan bahwa ia telah membangun penjara bawah tanah untuk memenjarakan mereka. Maka mereka berkumpul untuk membunuhnya dan menyerangnya dengan pedang, tetapi ia melarikan diri. Mereka mengejarnya dan menangkapnya pada tanggal enam Jumada al-Akhirah dan berjanji setia kepada Muhammad ibn al-Muqtadir serta memberinya gelar al-Radi bi-Allah. Mereka mengirim wazir dan para hakim kepada al-Qahir, dan ia berkata kepadaku, “Kalian telah terikat sumpah setia di leher kalian, dan aku tidak akan membebaskan kalian darinya atau melepaskan kalian darinya.” Wazir berkata, “Ia harus dicopot dan bahkan tidak dipertimbangkan.” Sima, komandan al-Hajariya, menunjuk al-Radi dan menamparnya, sehingga ia membakar matanya dengan paku panas hingga air matanya mengalir ke pipinya. Sebelumnya, ia telah membantai Mu’nis dan Ibn Muqlah dan menutupi Ibn al-Muktafi dengan lumpur di antara dua dinding karena kesepakatan mereka untuk menggulingkannya. {cite:tarikh-khulafa-minhaj-1434 p. 597-599}. Menurut Al-Mas’udi, ia digulingkan pada hari Rabu, tanggal lima Jumada al-Ula tahun tiga ratus dua puluh dua, dan matanya dicungkil. Kekhalifahannya berlangsung selama satu tahun, enam bulan dan enam hari, dan Al-Radi membuatnya menghilang. Ketika Ibrahim Al-Muttaqi diikrarkan sumpah setia, ia ditangkap saat dipenjara di beberapa ruangan, sehingga ia dipenjara di rumah Ibn Tahir. 667-668} Menurut Ibn al-Athir, alasan penggulingannya adalah karena Ibn Muqlah dan al-Hasan ibn Harun telah bersembunyi darinya. Mereka berkorespondensi dengan para komandan brigade Sajiyyah dan Hajariyyah, memperingatkan mereka. Ibn Muqlah diberi ahli astrologi dan penerjemah yang memperingatkannya tentang al-Qahir dan menafsirkan segala sesuatunya sesuai keinginannya. Al-Qahir telah mulai membangun penjara bawah tanah di istana, dan dikatakan kepada Sima' dan para komandan brigade Sajiyyah dan Hajariyyah bahwa ia melakukannya untuk kepentingan mereka, yang meningkatkan kebencian mereka. Mereka berkumpul di rumah Sima pada hari Rabu dan bersekongkol untuk menangkapnya. Sima' berkata kepada mereka, \"Bangunlah, semuanya, agar kita dapat pergi sebelum masalah ini diselesaikan, karena jika ia menunda, ia akan lewat, mengambil tindakan pencegahan, dan menghancurkan kita.\" Mereka maju ke istana dan mendapati dia tertidur, setelah minum hampir sepanjang malam. Seorang pelayan muda menuntun mereka kepadanya, dan mereka mendapati dia dengan pedang di tangannya. Mereka mencoba membujuknya untuk bertarung dengan pedang itu, jadi mereka berbicara kepadanya dengan lembut sampai dia menghunus pedangnya. Kemudian mereka menangkapnya dan memenjarakannya di ruang bawah tanah Tarif al-Sabkari setelah mengeluarkannya dari sana dan membutakannya. Wazirnya, al-Khasibi, dan pengawalnya, Salamah, kemudian dibawa pergi. {cite:kamil-ibn-al-athir hlm. 209-210}"
