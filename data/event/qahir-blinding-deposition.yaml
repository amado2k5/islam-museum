id: event/qahir-blinding-deposition
class: event
kind: mutiny
label: { ar: "خلع القاهر وسمل عينيه" }
summary:
  ar: "في سنة اثنتين وعشرين تحرك الجند على القاهر لأن ابن مقلة في اختفائه كان يوحشهم منه ويقول لهم إنه بنى لكم المطامير ليحبسكم فاجتمعوا على الفتك به فدخلوا عليه بالسيوف فهرب فأدركوه وقبضوا عليه في سادس جمادى الآخرة وبايعوا محمد بن المقتدر ولقبوه الراضي بالله فأرسلوا إلى القاهر الوزير والقضاة فقال لي في أعناقكم بيعة ولست أبرئكم ولا أحلكم منها فقال الوزير يخلع ولا يفكر فيه فأشار سيما مقدم الحجرية إلى الراضي بسمله فكحله بمسمار محمي حتى سالت عيناه على خديه وكان قبل قد ذبح مؤنس وابن مقلة وطين على ابن المكتفي بين حيطين لاتفاقهم على خلعه {cite:tarikh-khulafa-minhaj-1434 p. 597-599}. وعند المسعودي خلع يوم الأربعاء لخمس خلون من جمادى الأولى سنة اثنتين وعشرين وثلثمائة وسملت عيناه فكانت خلافته سنة وستة أشهر وستة أيام، وغيبه الراضي فلما بويع إبراهيم المتقي أصيب معتقلاً في بعض المقاصير فاعتقل بدار ابن طاهر {cite:muruj-al-dhahab p. 667-668}، وعند ابن الأثير كان سبب خلعه أن ابن مقلة والحسن بن هارون استخفيا منه فكانا يراسلان قواد الساجية والحجرية ويحذرونهم ويعطى ابن مقلة منجمين ومعبّرين يحذرونه من القاهر ويعبّرون له على ما يريد، وأن القاهر شرع في عمل مطامير في الدار فقيل لسيماء ولقواد الساجية والحجرية إنما عملها لأجلكم فازدادوا نفوراً، فاجتمعوا عند سيماء يوم الأربعاء وتصالفوا على القبض عليه وقال لهم سيماء قوموا يا الناس حتى نمضي قبل العزم فإنه إن تأخر مر به واحترز وأهلكنا، وزحفوا إلى الدار فوجدوه نائماً شرب أكثر ليلته فدلّهم عليه خادم صغير فوجدوه وبيده السيف فاجتهدوا إن يقاتل بهما فألانوا له القول حتى سل السيف ثم أخذوه وحبسوه في مطمورة طريف السبكري بعد أن أخرجوه منها وسملوه، ودُلل وزيره الخصيبي وسلامة حاجبه {cite:kamil-ibn-al-athir p. 209-210}"
  en: "In 322 the soldiers moved on al-Qahir — Ibn Muqla in hiding had set them against him — seized him on 6 Jumada II and hailed Muhammad ibn al-Muqtadir as al-Radi. Al-Qahir refused to release them from their bay'a; Sima, commander of the Hujariyya, had him blinded with a red-hot nail, his eyes running down his cheeks. Earlier that year he had slaughtered Mu'nis and his confederates and walled Ibn al-Muktafi alive between two walls for plotting his own deposition {cite:tarikh-khulafa-minhaj-1434 p. 597-599}."
