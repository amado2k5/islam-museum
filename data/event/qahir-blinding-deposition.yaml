id: event/qahir-blinding-deposition
class: event
kind: mutiny
label: { ar: "خلع القاهر وسمل عينيه" }
summary:
  ar: "في سنة اثنتين وعشرين تحرك الجند على القاهر لأن ابن مقلة في اختفائه كان يوحشهم منه ويقول لهم إنه بنى لكم المطامير ليحبسكم فاجتمعوا على الفتك به فدخلوا عليه بالسيوف فهرب فأدركوه وقبضوا عليه في سادس جمادى الآخرة وبايعوا محمد بن المقتدر ولقبوه الراضي بالله فأرسلوا إلى القاهر الوزير والقضاة فقال لي في أعناقكم بيعة ولست أبرئكم ولا أحلكم منها فقال الوزير يخلع ولا يفكر فيه فأشار سيما مقدم الحجرية إلى الراضي بسمله فكحله بمسمار محمي حتى سالت عيناه على خديه وكان قبل قد ذبح مؤنس وابن مقلة وطين على ابن المكتفي بين حيطين لاتفاقهم على خلعه {cite:tarikh-khulafa-minhaj-1434 p. 597-599}."
  en: "In 322 the soldiers moved on al-Qahir — Ibn Muqla in hiding had set them against him — seized him on 6 Jumada II and hailed Muhammad ibn al-Muqtadir as al-Radi. Al-Qahir refused to release them from their bay'a; Sima, commander of the Hujariyya, had him blinded with a red-hot nail, his eyes running down his cheeks. Earlier that year he had slaughtered Mu'nis and his confederates and walled Ibn al-Muktafi alive between two walls for plotting his own deposition {cite:tarikh-khulafa-minhaj-1434 p. 597-599}."
