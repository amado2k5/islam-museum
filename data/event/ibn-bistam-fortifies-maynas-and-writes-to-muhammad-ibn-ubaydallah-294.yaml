id: event/ibn-bistam-fortifies-maynas-and-writes-to-muhammad-ibn-ubaydallah-294
class: event
kind: other
label:
  ar: "ابن بسطام يحصن ميناس ويكتب إلى محمد بن عبيد الله، سنة 294-295هـ، ص348"
  en: "Ibn Bistam fortifies Maynas and writes to Muhammad ibn Ubaydallah, 294 to 295 AH, p. 348"
  ur: "ابن بسطام کا میناس کو مضبوط کرنا اور محمد بن عبیداللہ کو خط لکھنا، 294 تا 295ھ، ص348"
  es: "Ibn Bistam fortalece a Maynas y escribe a Muhammad ibn Ubaydallah, 294 a 295 AH, pág. 348."
  fr: "Ibn Bistam fortifie Maynas et écrit à Muhammad ibn Ubaydallah, 294 à 295 AH, p. 348"
summary:
  ar: "حصّن ابن بسطام ميناس، وكتب إلى محمد بن عبيد الله أنه ليس مع بني الحارث ويأم، وأنه حصّن ميناس للهادي ليقاتل فيه بني الحارث إن حدثت."
  en: "Ibn Bistam fortified Maynas and wrote to Muhammad ibn Ubaydallah that he was not with Banu al-Harith and Ya'am, and that he had fortified Maynas for al-Hadi, so that al-Hadi could fight Banu al-Harith there if they rose."
  ur: "ابن بسطام نے میناس کو مضبوط کیا اور محمد بن عبیداللہ کو لکھا کہ وہ بنو الحارث اور یأم کے ساتھ نہیں، اور اس نے میناس ہادی کے لیے مضبوط کیا ہے تاکہ بغاوت کی صورت میں ہادی وہیں بنو الحارث سے لڑ سکے۔"
  es: "Ibn Bistam fortificó Maynas y escribió a Muhammad ibn Ubaydallah que no estaba con Banu al-Harith y Ya'am, y que había fortificado Maynas para al-Hadi, para que al-Hadi pudiera luchar allí contra Banu al-Harith si se sublevaban."
  fr: "Ibn Bistam fortifia Maynas et écrivit à Muhammad ibn Ubaydallah qu'il n'était pas avec Banu al-Harith et Ya'am, et qu'il avait fortifié Maynas pour al-Hadi, afin qu'al-Hadi puisse y combattre Banu al-Harith s'ils se soulevaient."
