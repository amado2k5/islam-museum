id: event/ibn-qayyim-joins-ibn-taymiyya-712
class: event
kind: other
label:
  ar: "ملازمة ابن قيم الجوزية لابن تيمية منذ عودته إلى دمشق، ٧١٢هـ/١٣١٢-١٣١٣م"
  en: "Ibn Qayyim attaches himself to Ibn Taymiyya on the latter's return to Damascus, 712/1312-13"
  ur: "ابن قیم کی ابن تیمیہ کی ملازمت، ان کی دمشق واپسی پر، 712ھ/1312-13ء"
summary:
  ar: "لازم ابن قيم الجوزية شيخَه ابن تيمية منذ عودته من مصر إلى دمشق سنة ٧١٢هـ إلى أن مات، حتى غلب عليه حبّه فكان لا يخرج عن شيء من أقواله بل ينتصر له في جميع ذلك، وهو الذي هذّب كتبه ونشر علمه {cite:durar-kamina-jil-1993 3/401}؛ ويذكر ف. دي لا غرانجا أنه كان منذ سنة ٧١٣هـ/١٣١٣م أشهر تلاميذ ابن تيمية وأنه استوعب أفكاره كلها وساعد في نشر آثاره {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  en: "Ibn Qayyim al-Jawziyya attached himself to his teacher Ibn Taymiyya from the latter's return to Damascus from Egypt in 712 until Ibn Taymiyya's death, so devoted to him that he never departed from any of his positions and defended them all; it was he who refined his master's books and spread his learning {cite:durar-kamina-jil-1993 3/401}. F. de la Granja gives 713/1313 as the start of a discipleship in which Ibn Qayyim absorbed all of Ibn Taymiyya's ideas and helped popularize his work {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  ur: "ابن قیم الجوزیہ 712ھ میں ابن تیمیہ کی مصر سے دمشق واپسی کے بعد سے ان کے مرگمند ہونے تک ان کے ملازم رہے، اس قدر ان سے محبت تھی کہ ان کے کسی قول سے نہ ہٹتے بلکہ سب کی حمایت کرتے؛ انہی نے استاد کی کتابوں کی تهذیب کی اور ان کے علم کو پھیلایا {cite:durar-kamina-jil-1993 3/401}۔ ایف. ڈی لا گرانجا کے مطابق 713ھ/1313ء سے وہ ابن تیمیہ کے مشہور ترین شاگرد تھے جنہوں نے ان کے تمام افکار کو اپنے اندر سمو لیا اور ان کے آثار کے پھیلاؤ میں مدد دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔"
