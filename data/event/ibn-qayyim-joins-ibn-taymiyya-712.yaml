id: event/ibn-qayyim-joins-ibn-taymiyya-712
class: event
kind: other
label:
  ar: "ملازمة ابن قيم الجوزية لابن تيمية منذ عودته إلى دمشق، ٧١٢هـ/١٣١٢-١٣١٣م"
  en: "Ibn Qayyim attaches himself to Ibn Taymiyya on the latter's return to Damascus, 712/1312-13"
  ur: "ابن قیم کی ابن تیمیہ کی ملازمت، ان کی دمشق واپسی پر، 712ھ/1312-13ء"
  es: "Ibn Qayyim se une a Ibn Taymiyya cuando este último regresa a Damasco, 712/1312-13."
  fr: "Ibn Qayyim s'attache à Ibn Taymiyya au retour de ce dernier à Damas, 712/1312-13"
  tr: "İbn Kayyım el-Cevziyye'nin Şam'a dönüşünden bu yana İbn Teymiyye ile yakın ilişkisi, H. 712/MS 1312-1313"
  id: "Kedekatan Ibnu Qayyim al-Jawziyya dengan Ibnu Taimiyah sejak kepulangannya ke Damaskus, 712 H/1312-1313 M."
summary:
  ar: "لازم ابن قيم الجوزية شيخَه ابن تيمية منذ عودته من مصر إلى دمشق سنة ٧١٢هـ إلى أن مات، حتى غلب عليه حبّه فكان لا يخرج عن شيء من أقواله بل ينتصر له في جميع ذلك، وهو الذي هذّب كتبه ونشر علمه {cite:durar-kamina-jil-1993 3/401}؛ ويذكر ف. دي لا غرانجا أنه كان منذ سنة ٧١٣هـ/١٣١٣م أشهر تلاميذ ابن تيمية وأنه استوعب أفكاره كلها وساعد في نشر آثاره {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  en: "Ibn Qayyim al-Jawziyya attached himself to his teacher Ibn Taymiyya from the latter's return to Damascus from Egypt in 712 until Ibn Taymiyya's death, so devoted to him that he never departed from any of his positions and defended them all; it was he who refined his master's books and spread his learning {cite:durar-kamina-jil-1993 3/401}. F. de la Granja gives 713/1313 as the start of a discipleship in which Ibn Qayyim absorbed all of Ibn Taymiyya's ideas and helped popularize his work {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  ur: "ابن قیم الجوزیہ 712ھ میں ابن تیمیہ کی مصر سے دمشق واپسی کے بعد سے ان کے مرگمند ہونے تک ان کے ملازم رہے، اس قدر ان سے محبت تھی کہ ان کے کسی قول سے نہ ہٹتے بلکہ سب کی حمایت کرتے؛ انہی نے استاد کی کتابوں کی تهذیب کی اور ان کے علم کو پھیلایا {cite:durar-kamina-jil-1993 3/401}۔ ایف. ڈی لا گرانجا کے مطابق 713ھ/1313ء سے وہ ابن تیمیہ کے مشہور ترین شاگرد تھے جنہوں نے ان کے تمام افکار کو اپنے اندر سمو لیا اور ان کے آثار کے پھیلاؤ میں مدد دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔"
  es: "Ibn Qayyim al-Jawziyya se adhirió a su maestro Ibn Taymiyya desde el regreso de este último a Damasco desde Egipto en 712 hasta la muerte de Ibn Taymiyya, siendo tan devoto a él que nunca se apartó de ninguna de sus posturas y las defendió todas; fue él quien perfeccionó los libros de su maestro y difundió su saber {cite:durar-kamina-jil-1993 3/401}. F. de la Granja sitúa el año 713/1313 como el inicio de un discipulado en el que Ibn Qayyim asimiló todas las ideas de Ibn Taymiyya y contribuyó a popularizar su obra {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  fr: "Ibn Qayyim al-Jawziyya se lia à son maître Ibn Taymiyya dès le retour de ce dernier d'Égypte à Damas en 712 et ce, jusqu'à la mort de ce dernier. Sa dévotion était telle qu'il ne renonça jamais à aucune de ses positions et les défendit toutes. C'est lui qui perfectionna les ouvrages de son maître et diffusa son savoir (voir Durar-Kamina-Jil-1993, vol. 3, p. 401). F. de la Granja situe le début de cette relation de disciple en 713/1313, année durant laquelle Ibn Qayyim assimila toutes les idées d'Ibn Taymiyya et contribua à populariser son œuvre (voir Encyclopaedia of Islam, vol. 3, p. 854)."
  tr: "İbn Kayyim el-Cevziyye, hocası İbn Teymiye'ye Hicri 712 yılında Mısır'dan Şam'a döndüğü zamandan ölümüne kadar eşlik etmiş, ona olan sevgisi o kadar yoğunlaşmış ki, hiçbir sözünden sapmamış, aksine onu her konuda savunmuştur. Kitaplarını geliştirmiş ve bilgisini yaymıştır. {cite:durar-kamina-jil-1993 3/401}. F. de la Granja, Hicri 713/1313 yılından itibaren İbn Teymiye'nin en ünlü öğrencisi olduğunu, tüm fikirlerini özümsediğini ve eserlerinin yayılmasına yardımcı olduğunu belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  id: "Ibn Qayyim al-Jawziyya menemani gurunya, Ibn Taymiyyah, sejak kepulangannya dari Mesir ke Damaskus pada tahun 712 H hingga wafatnya, hingga kecintaannya kepada gurunya begitu besar sehingga ia tidak menyimpang dari satu pun ucapan gurunya, melainkan membela gurunya dalam segala hal. Dialah yang menyempurnakan kitab-kitab gurunya dan menyebarkan ilmunya {cite:durar-kamina-jil-1993 3/401}. F. de la Granja menyebutkan bahwa sejak tahun 713 H/1313 M ia adalah murid Ibn Taymiyyah yang paling terkenal dan bahwa ia menyerap semua ide gurunya dan membantu menyebarkan karya-karyanya {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
