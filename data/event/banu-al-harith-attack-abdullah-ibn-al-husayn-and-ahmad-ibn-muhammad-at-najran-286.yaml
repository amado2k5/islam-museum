id: event/banu-al-harith-attack-abdullah-ibn-al-husayn-and-ahmad-ibn-muhammad-at-najran-286
class: event
kind: other
label:
  ar: هجوم بني الحارث ليلاً على عبد الله بن الحسين وأحمد بن محمد بنجران، رمضان 286هـ
  en: Banu al-Harith attack Abdullah ibn al-Husayn and Ahmad ibn Muhammad by night at Najran, Ramadan 286 AH
  ur: نجران میں بنو حارث کا عبداللہ بن حسین اور احمد بن محمد پر رات کا حملہ، رمضان 286ھ
  fr: "Les Banu al-Harith attaquent de nuit Abdullah ibn al-Husayn et Ahmad ibn Muhammad à Najran, Ramadan 286 H"
  es: "Banu al-Harith ataca a Abdullah ibn al-Husayn y Ahmad ibn Muhammad por la noche en Najran, Ramadán 286 AH"
  tr: "Bani Al-Harith'in gece Necran'da Abdullah bin El-Hüseyin ve Ahmed bin Muhammed'e saldırısı, Ramazan 286 H."
  id: "Penyerangan Bani Al-Harith pada malam hari terhadap Abdullah bin Al-Hussein dan Ahmed bin Muhammad di Najran, Ramadhan 286 H"
summary:
  ar: يروي علي بن محمد أن عبد الله بن الحسين قدم نجران من الحجاز فأصلح أمرها، فتشاور بنو الحارث في أخذه وأخذ أحمد بن محمد رهينتين بمن حبسهم الهادي بصعدة، وهجموا ليلة سبع عشرة مضت من رمضان 286هـ بعدما فتح لهم الدار ابن مصفى المداني، فقاتلهما ومن معهما الليل كله.
  en: Ali ibn Muhammad relates that Abdullah ibn al-Husayn came to Najran from the Hijaz and put it in order; Banu al-Harith then planned to seize him and Ahmad ibn Muhammad as hostages for those al-Hadi had jailed at Sa'da, and attacked on the night with seventeen days of Ramadan 286 gone, after Ibn Musaffa al-Madani opened the house to them; the two men and their companions fought them through the night.
  ur: علی بن محمد بیان کرتے ہیں کہ عبداللہ بن حسین حجاز سے نجران آئے اور اس کا انتظام ٹھیک کیا؛ بنو حارث نے انہیں اور احمد بن محمد کو ان قیدیوں کے بدلے یرغمال بنانے کا مشورہ کیا جنہیں ہادی نے صعدہ میں قید کیا تھا، اور رمضان 286ھ کے سترہ دن گزرنے کی رات حملہ کیا جب ابن مصفیٰ مدانی نے گھر کھول دیا؛ دونوں اور ان کے ساتھی رات بھر لڑے۔
  fr: "Ali ibn Muhammad rapporte qu'Abdullah ibn al-Husayn vint du Hijaz à Najran et y remit de l'ordre ; les Banu al-Harith projetèrent alors de s'emparer de lui et d'Ahmad ibn Muhammad comme otages contre ceux qu'al-Hadi avait emprisonnés à Sa'da, et attaquèrent la nuit où dix-sept jours de Ramadan 286 étaient passés, après qu'Ibn Musaffa al-Madani leur eut ouvert la maison ; les deux hommes et leurs compagnons les combattirent toute la nuit."
  es: "Ali ibn Muhammad relata que Abdullah ibn al-Husayn llegó a Najran desde el Hiyaz y lo puso en orden; entonces Banu al-Harith planeó tomarlo a él y a Ahmad ibn Muhammad como rehenes por aquellos que al-Hadi había encarcelado en Sa'da, y atacaron la noche en que habían transcurrido diecisiete días de Ramadán 286, después de que Ibn Musaffa al-Madani les abriera la casa; los dos hombres y sus compañeros lucharon contra ellos durante toda la noche."
  tr: "Ali bin Muhammed rivayet eder ki, Abdullah bin Hüseyin Hicaz'dan Necran'a geldi ve orada işleri yoluna koydu. Bunun üzerine Beni El-Harith, onu ve Ahmed bin Muhammed'i, El-Hadi'nin Sa'de'de hapsettiği kişilerle birlikte rehin almak konusunda istişarede bulundular. İbn Musaffa el-Medani'nin evlerini onlara açmasının ardından, Hicri 286 yılının Ramazan ayının on yedinci gecesi saldırdılar ve o ve yanındakiler bütün gece onlarla savaştılar."
  id: "Ali bin Muhammad meriwayatkan bahwa Abdullah bin Al-Hussein datang ke Najran dari Hijaz dan memperbaiki keadaan di sana. Kemudian Bani Al-Harith berunding untuk menangkapnya dan menjadikan Ahmad bin Muhammad sebagai sandera bersama orang-orang yang dipenjarakan Al-Hadi di Sa'dah. Mereka menyerang pada malam tanggal tujuh belas Ramadhan 286 H setelah Ibnu Musaffa Al-Madani membukakan rumah untuk mereka, dan dia beserta orang-orang yang bersamanya memerangi mereka sepanjang malam."
