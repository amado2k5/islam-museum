id: event/banu-al-harith-attack-abdullah-ibn-al-husayn-and-ahmad-ibn-muhammad-at-najran-286
class: event
kind: other
label:
  ar: هجوم بني الحارث ليلاً على عبد الله بن الحسين وأحمد بن محمد بنجران، رمضان 286هـ
  en: Banu al-Harith attack Abdullah ibn al-Husayn and Ahmad ibn Muhammad by night at Najran, Ramadan 286 AH
  ur: نجران میں بنو حارث کا عبداللہ بن حسین اور احمد بن محمد پر رات کا حملہ، رمضان 286ھ
summary:
  ar: يروي علي بن محمد أن عبد الله بن الحسين قدم نجران من الحجاز فأصلح أمرها، فتشاور بنو الحارث في أخذه وأخذ أحمد بن محمد رهينتين بمن حبسهم الهادي بصعدة، وهجموا ليلة سبع عشرة مضت من رمضان 286هـ بعدما فتح لهم الدار ابن مصفى المداني، فقاتلهما ومن معهما الليل كله.
  en: Ali ibn Muhammad relates that Abdullah ibn al-Husayn came to Najran from the Hijaz and put it in order; Banu al-Harith then planned to seize him and Ahmad ibn Muhammad as hostages for those al-Hadi had jailed at Sa'da, and attacked on the night with seventeen days of Ramadan 286 gone, after Ibn Musaffa al-Madani opened the house to them; the two men and their companions fought them through the night.
  ur: علی بن محمد بیان کرتے ہیں کہ عبداللہ بن حسین حجاز سے نجران آئے اور اس کا انتظام ٹھیک کیا؛ بنو حارث نے انہیں اور احمد بن محمد کو ان قیدیوں کے بدلے یرغمال بنانے کا مشورہ کیا جنہیں ہادی نے صعدہ میں قید کیا تھا، اور رمضان 286ھ کے سترہ دن گزرنے کی رات حملہ کیا جب ابن مصفیٰ مدانی نے گھر کھول دیا؛ دونوں اور ان کے ساتھی رات بھر لڑے۔
