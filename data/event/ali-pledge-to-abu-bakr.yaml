label: { en: "Ali's pledge of allegiance to Abu Bakr", ar: "مبايعة علي لأبي بكر" }
summary:
  en: "Sallabi holds that Ali and al-Zubayr pledged allegiance to Abu Bakr early, on the day of the Prophet's death, citing an authentic report of Abu Sa'id al-Khudri; he treats the reports of a long delay as unsound, and records a renewal of the pledge after Fatima's death in Ibn Kathir's view."
  ar: "يرى الصلابي أن علياً والزبير بايعا أبا بكر في أول الأمر يوم وفاة النبي، استناداً إلى خبر صحيح عن أبي سعيد الخدري، ويعد أخبار التأخير الطويل غير صحيحة، ويذكر تجديد البيعة بعد وفاة فاطمة على قول ابن كثير."
