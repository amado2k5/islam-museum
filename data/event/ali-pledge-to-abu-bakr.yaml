id: event/ali-pledge-to-abu-bakr
class: event
kind: other
label: { en: "Ali's pledge of allegiance to Abu Bakr", ar: "مبايعة علي لأبي بكر", es: "El juramento de lealtad de Ali a Abu Bakr", fr: "Le serment d'allégeance d'Ali à Abou Bakr", ur: "علی کی ابوبکر سے بیعت" }
summary:
  en: "Sallabi holds that Ali and al-Zubayr pledged allegiance to Abu Bakr early, on the day of the Prophet's death, citing an authentic report of Abu Sa'id al-Khudri; he treats the reports of a long delay as unsound, and records a renewal of the pledge after Fatima's death in Ibn Kathir's view."
  ar: "يرى الصلابي أن علياً والزبير بايعا أبا بكر في أول الأمر يوم وفاة النبي، استناداً إلى خبر صحيح عن أبي سعيد الخدري، ويعد أخبار التأخير الطويل غير صحيحة، ويذكر تجديد البيعة بعد وفاة فاطمة على قول ابن كثير."
  es: "Sallabi sostiene que Ali y al-Zubayr juraron lealtad a Abu Bakr temprano, el día de la muerte del Profeta, citando un informe auténtico de Abu Sa'id al-Khudri; considera que los informes de una larga demora no son fiables y registra una renovación del juramento después de la muerte de Fátima, según la opinión de Ibn Kathir."
  fr: "Sallabi soutient qu'Ali et al-Zubayr ont prêté allégeance à Abu Bakr dès le jour de la mort du Prophète, citant un rapport authentique d'Abu Sa'id al-Khudri; il considère les rapports faisant état d'un long délai comme non fondés et enregistre un renouvellement du serment après la mort de Fatima, selon l'opinion d'Ibn Kathir."
  ur: "سلبی کا خیال ہے کہ علی اور الزبیر نے ابو سعید الخدری کی ایک مستند رپورٹ کا حوالہ دیتے ہوئے، رسول اللہ کے وصال کے دن پہلے ہی ابوبکر سے بیعت کی تھی۔ وہ طویل تاخیر کی خبروں کو ناقص قرار دیتا ہے، اور ابن کثیر کے خیال میں فاطمہ کی وفات کے بعد تجدید عہد کو ریکارڈ کرتا ہے۔"
