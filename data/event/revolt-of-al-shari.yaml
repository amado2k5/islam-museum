summary:
  ar: "خرج أبو العمود الشاري بناحية اليمن والبوازيج والموصل أيام المنتصر فيمن انضاف إليه من المحكمة من ربيعة والأكراد فسرح إليه المنتصر جيشاً عليه سما التركي فأسره وحمله فعفا عنه وأخذ عليه العهد وخلى سبيله {cite:muruj-al-dhahab p. 520-521}."
  en: "The Haruri rising in Yemen and the Jazira — crushed by Sama, its leader pardoned {cite:muruj-al-dhahab p. 520-521}."
  es: "El levantamiento de Haruri en Yemen y el de Jazira, aplastado por Sama, cuyo líder fue indultado {cite:muruj-al-dhahab p. 520-521}."
  fr: "Le soulèvement des Haruri au Yémen et dans la Jazira — écrasé par Sama, son chef gracié {cite:muruj-al-dhahab p. 520-521}."
  ur: "یمن اور جزیرہ میں اٹھنے والا حروری - سما کے ذریعہ کچل دیا گیا، اس کے رہنما نے معاف کر دیا {حوالہ: مروج الذہب ص. 520-521}۔"
  tr: "Ebu el-Amud el-Şari, el-Muntasir döneminde, Rabi'ah sarayından ve Kürtlerden kendisine katılanlarla birlikte Yemen, el-Bawazij ve Musul bölgesine çıktı. El-Muntasir, ona Sama el-Turki komutasında bir ordu gönderdi; Ebu el-Amud el-Şari onu yakalayıp götürdü, sonra onu affetti, ondan bir rehin aldı ve serbest bıraktı. {kaynak: Muruj el-Dhahab s. 520-521}"
  id: "Abu al-Amud al-Shari pergi ke wilayah Yaman, al-Bawazij dan Mosul pada masa pemerintahan al-Muntasir, bersama orang-orang yang bergabung dengannya dari istana Rabi’ah dan Kurdi. Al-Muntasir mengirimkan pasukan kepadanya di bawah komando Sama al-Turki, dan ia menangkapnya serta membawanya, kemudian ia mengampuninya dan mengambil sumpah darinya lalu membebaskannya. {cite:muruj-al-dhahab hlm. 520-521}."
