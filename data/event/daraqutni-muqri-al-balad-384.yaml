id: event/daraqutni-muqri-al-balad-384
class: event
kind: other
label:
  ar: "الدارقطني يتصدر للإقراء ببغداد في آخر أيامه، نحو ٣٨٤هـ"
  en: "Al-Daraqutni takes the lead in iqra' at Baghdad in his last days, about 384/994"
  ur: "دارقطنی آخری ایام میں بغداد میں اقراء کے سردار بنتے ہیں، تقریباً 384ھ/994ء"
  es: "Al-Daraqutni toma la delantera en el iqra' en Bagdad en sus últimos días, alrededor del año 384/994."
  fr: "Al-Daraqutni prend la tête de l'iqra' à Bagdad durant ses derniers jours, vers 384/994."
  tr: "El-Daraqutni, Hicri 384 civarında, yaşamının son yıllarında Bağdat'ın önde gelen Kur'an okuyucusuydu."
  id: "Al-Daraqutni adalah pembaca Al-Quran terkemuka di Baghdad pada tahun-tahun terakhirnya, sekitar tahun 384 Hijriah."
summary:
  ar: "برع الدارقطني في القراءات وتصدر في آخر أيامه للإقراء {cite:tarikh-islam-dhahabi p.104}؛ وقال: كنت أنا والكتاني نسمع الحديث، فكانوا يقولون: يخرج الكتاني محدث البلد ويخرج الدارقطني مقرئ البلد، فخرجت أنا محدثاً والكتاني مقرئاً {cite:muntazam-ibn-al-jawzi j.7 p.184}؛ وقال القاضي أبو الطيب الطبري: الدارقطني أمير المؤمنين في الحديث، وقال الخطيب: كان فريد دهره وقريع عصره ونسيج وحده وإمام وقته، انتهى إليه علم الأثر والمعرفة بعلل الحديث وأسماء الرجال مع الصدق والثقة وصحة الاعتقاد {cite:tarikh-islam-dhahabi pp.102-103}."
  en: "Al-Daraqutni excelled in the qira'at and in his last days took the lead in the public reading of the Qur'an {cite:tarikh-islam-dhahabi p.104}. He said: al-Kattani and I used to hear hadith together, and people would say 'al-Kattani will come out the muhaddith of the town, al-Daraqutni its muqri' — and I came out the muhaddith and al-Kattani the muqri'' {cite:muntazam-ibn-al-jawzi j.7 p.184}. The qadi Abu al-Tayyib al-Tabari called him Commander of the Faithful in hadith, and al-Khatib said he was the singular one of his age and the imam of his time, to whom the science of transmitted reports, the defects of hadith and the names of its men came to an end, with truthfulness, reliability and sound belief {cite:tarikh-islam-dhahabi pp.102-103}."
  ur: "دارقطنی قراءات میں ممتاز ہوئے اور آخری ایام میں بغداد میں اقراء کی صدارت اختیار کی {cite:tarikh-islam-dhahabi p.104}؛ ان کا قول ہے: میں اور کتانی ساتھ حدیث سنتے تھے اور لوگ کہتے تھے کتانی شہر کا محدث اور دارقطنی شہر کا مقرئ نکلے گا، مگر میں محدث نکلا اور کتانی مقرئ {cite:muntazam-ibn-al-jawzi j.7 p.184}؛ قاضی ابو الطیب طبری نے انہیں حدیث میں امیرالمومنین کہا اور خطیب نے کہا کہ وہ اپنے دہر کے یکتا، اپنے عصر کے امام تھے، علم آثار، علل حدیث اور اسماء رجال ان ہی پر ختم ہوا، مع صداقت، امانت اور صحت عقیدہ {cite:tarikh-islam-dhahabi pp.102-103}۔"
  es: "Al-Daraqutni sobresalió en la qira'at y en sus últimos días tomó la delantera en la lectura pública del Corán {cite:tarikh-islam-dhahabi p.104}. Dijo: \"Al-Kattani y yo solíamos escuchar hadices juntos, y la gente decía: 'Al-Kattani saldrá como el muhaddith de la ciudad, Al-Daraqutni como su muqri', y yo salí como el muhaddith y Al-Kattani como el muqri\" {cite:muntazam-ibn-al-jawzi j.7 p.184}. El cadí Abu al-Tayyib al-Tabari lo llamó Comandante de los Creyentes en hadiz, y al-Khatib dijo que era el singular de su época y el imán de su tiempo, para quien la ciencia de los relatos transmitidos, los defectos del hadiz y los nombres de sus hombres llegaron a su fin, con veracidad, fiabilidad y creencia sólida {cite:tarikh-islam-dhahabi pp.102-103}."
  fr: "Al-Daraqutni excellait dans la qira'at et, à la fin de sa vie, il prit la tête de la lecture publique du Coran {cite:tarikh-islam-dhahabi p.104}. Il a dit: « Al-Kattani et moi avions l'habitude d'écouter des hadiths ensemble, et les gens disaient: \"Al-Kattani sera le muhaddith de la ville, al-Daraqutni son muqri\" — et je serais le muhaddith et al-Kattani le muqri » {cite:muntazam-ibn-al-jawzi j.7 p.184}. Le cadi Abu al-Tayyib al-Tabari l'a appelé Commandeur des Croyants dans le hadith, et al-Khatib a dit qu'il était le seul de son époque et l'imam de son temps, à qui la science des rapports transmis, les défauts du hadith et les noms de ses hommes s'achevaient, avec véracité, fiabilité et foi solide {cite:tarikh-islam-dhahabi pp.102-103}."
  tr: "El-Daraqutni hadis okumada üstün yetenek gösterdi ve ilerleyen yıllarında Kur'an'ın önde gelen okuyucularından biri oldu (kaynak:tarikh-islam-dhahabi, s. 104). Şöyle demiştir: “El-Kattani ile hadis dinlerdik ve şöyle derlerdi: ‘El-Kattani şehrin hadis alimi, El-Daraqutni ise şehrin Kur'an okuyucusu olarak ortaya çıkacak.’ Böylece ben hadis alimi, El-Kattani ise Kur'an okuyucusu olarak ortaya çıktı (kaynak:muntazam-ibn-al-jawzi, c.7, s. 184).” Kadı Ebu el-Tayyib el-Taberi şöyle demiştir: “El-Daraqutni hadis konusunda Müminlerin Emiri’dir.” El-Hatib şöyle dedi: “O, zamanında eşsizdi, döneminin emsali, türünün tek örneği bir şahsiyetti ve zamanının imamıydı. Hadis ilmi, hadislerin eksiklikleri ilmi ve insan isimleri bilgisi, doğruluk, güvenilirlik ve sağlam inançla birleşmişti.” {kaynak:tarikh-islam-dhahabi, s.102-103}"
  id: "Al-Daraqutni unggul dalam membaca dan di tahun-tahun terakhirnya menjadi seorang qari Al-Quran terkemuka {cite:tarikh-islam-dhahabi p.104}. Beliau berkata: “Al-Kattani dan saya biasa mendengarkan hadits, dan mereka berkata: ‘Al-Kattani akan muncul sebagai ulama hadits terkemuka di kota ini, dan Al-Daraqutni akan muncul sebagai qari terkemuka di kota ini.’ Maka saya muncul sebagai ulama hadits dan Al-Kattani sebagai qari Al-Quran {cite:muntazam-ibn-al-jawzi j.7 p.184}.” Hakim Abu Al-Tayyib Al-Tabari berkata: “Al-Daraqutni adalah Amirul Mukminin dalam bidang hadits.” Al-Khatib berkata: “Beliau unik di zamannya, tak tertandingi di eranya, seorang individu yang istimewa, dan imam di zamannya. Pengetahuan tentang hadits, pengetahuan tentang kekurangan hadits, dan nama-nama manusia, bersama dengan kejujuran, kepercayaan, dan keteguhan iman, semuanya diperoleh beliau.” {cite:tarikh-islam-dhahabi pp.102-103}."
