label: { ar: "نهاية الدولة الأغلبية وهرب زيادة الله" }
summary:
  ar: "في سنة 296هـ خرج آخر أمراء بني الأغلب زيادة الله بن عبد الله من إفريقية إلى مصر ثم الشام هارباً من دولة المهدي العبيدي، وتوقّف في الرقة طالباً الإذن بدخول بغداد فلم يؤذن له، وقيل بل سُمّ على يد بعض علمائه فسقط شعر لحيته، فعاد إلى مصر وقصد بيت المقدس فتوفى بالرملة ودُفن بها، ولم يبق بالمغرب من بني الأغلب أحد، وكانت مدة ملكهم مائة سنة واثنتي عشرة سنة، وكانوا يقولون إننا نخرج إلى مصر والشام ونربط خيلنا في زيتون فلسطين، فكان زيادة الله هو الخارج إلى فلسطين على هذه الحال لا على ما ظنوه {cite:kamil-ibn-al-athir p. 17-18}."
  en: "In 296 the last Aghlabid, Ziyadat Allah, fled Ifriqiya before the Ubaydid Mahdi; denied leave to enter Baghdad he lingered at al-Raqqa, then returned via Egypt, died at al-Ramla and was buried there — ending 112 years of Aghlabid rule {cite:kamil-ibn-al-athir p. 17-18}."
