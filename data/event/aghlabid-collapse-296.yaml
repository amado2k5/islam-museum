label: { ar: "نهاية الدولة الأغلبية وهرب زيادة الله", en: "The end of the Aghlabid state and the flight of Ziyadat Allah", fr: "Fin de l’État aghlabide et fuite de Ziyadat Allah", es: "El fin del estado aglabí y la huida de Ziyadat Allah", ur: "اغلب ریاست کا خاتمہ اور زیادت اللہ کی پرواز", tr: "Çoğunluk devletinin sonu ve Ziyada Allah'ın kaçışı", id: "Berakhirnya negara mayoritas dan lolosnya Ziyada Allah" }
summary:
  ar: "في سنة 296هـ خرج آخر أمراء بني الأغلب زيادة الله بن عبد الله من إفريقية إلى مصر ثم الشام هارباً من دولة المهدي العبيدي، وتوقّف في الرقة طالباً الإذن بدخول بغداد فلم يؤذن له، وقيل بل سُمّ على يد بعض علمائه فسقط شعر لحيته، فعاد إلى مصر وقصد بيت المقدس فتوفى بالرملة ودُفن بها، ولم يبق بالمغرب من بني الأغلب أحد، وكانت مدة ملكهم مائة سنة واثنتي عشرة سنة، وكانوا يقولون إننا نخرج إلى مصر والشام ونربط خيلنا في زيتون فلسطين، فكان زيادة الله هو الخارج إلى فلسطين على هذه الحال لا على ما ظنوه {cite:kamil-ibn-al-athir p. 17-18}."
  en: "In 296 the last Aghlabid, Ziyadat Allah, fled Ifriqiya before the Ubaydid Mahdi; denied leave to enter Baghdad he lingered at al-Raqqa, then returned via Egypt, died at al-Ramla and was buried there — ending 112 years of Aghlabid rule {cite:kamil-ibn-al-athir p. 17-18}."
  fr: "En 296, le dernier Aghlabide, Ziyadat Allah, fuit l’Ifriqiya devant le Mahdi ubaydide ; interdit d’entrée à Bagdad, il s’attarda à al-Raqqa, puis revint par l’Égypte, mourut à al-Ramla et y fut enterré, mettant fin à 112 ans de pouvoir aghlabide {cite:kamil-ibn-al-athir p. 17-18}."
  es: "En 296, el último aglabí, Ziyadat Allah, huyó de Ifriqiya ante el Mahdi Ubaydid; al negársele el permiso para entrar en Bagdad, permaneció en al-Raqqa, luego regresó vía Egipto, murió en al-Ramla y fue enterrado allí, poniendo fin a 112 años de gobierno aglabí {cite:kamil-ibn-al-athir p. 17-18}."
  ur: "296 میں آخری اضلاع، زیادت اللہ، عبید مہدی کے سامنے عفریقیہ سے فرار ہوا؛ بغداد میں داخل ہونے کی اجازت سے انکار کیا وہ الرقہ میں ٹھہرا رہا، پھر مصر کے راستے واپس آیا، الرملہ میں فوت ہوا اور وہیں دفن کیا گیا - 112 سال کے اضلاب کی حکومت کے خاتمے کے ساتھ۔ 17-18}۔"
  tr: "Hicri 296 yılında, Beni Ağlab'ın son prensi Ziyadet Allah ibn Abdullah, Mehdi Ubeydi devletinden kaçarak İfrikiye'den Mısır'a ve ardından Levant'a gitti. Rakka'da durarak Bağdat'a girmek için izin istedi, ancak izin verilmedi. Bazı alimleri tarafından zehirlendiği ve sakal kıllarının döküldüğü söylenir. Bunun üzerine Mısır'a geri döndü ve Kudüs'e yöneldi, ancak Ramla'da öldü ve oraya gömüldü. Beni Ağlab'dan Mağrip'te kimse kalmadı. Hükümranlıkları yüz on iki yıl sürdü. Mısır'a ve Levant'a gidip atlarımızı Filistin'in zeytinliklerine bağladığımızı söylerlerdi. İşte Ziyadet Allah, onların düşündüğü gibi değil, bu şekilde Filistin'e giden kişiydi. {Kaynak: Kamil ibn el-Athir s. 17-18}"
  id: "Pada tahun 296 H, pangeran terakhir Banu Aghlab, Ziyadat Allah ibn Abdullah, meninggalkan Ifriqiya menuju Mesir dan kemudian Levant, melarikan diri dari negara Al-Mahdi Al-Ubaidi. Ia berhenti di Al-Raqqa, meminta izin untuk memasuki Baghdad, tetapi izinnya tidak diberikan. Dikatakan bahwa ia diracuni oleh beberapa ulama, dan janggutnya rontok. Maka ia kembali ke Mesir dan menuju Yerusalem, tetapi ia meninggal di Ramla dan dimakamkan di sana. Tidak ada seorang pun dari Banu Aghlab yang tersisa di Maghreb. Masa pemerintahan mereka adalah seratus dua belas tahun. Mereka biasa mengatakan bahwa kami pergi ke Mesir dan Levant dan mengikat kuda kami di kebun zaitun Palestina. Jadi Ziyadat Allah adalah orang yang pergi ke Palestina dengan cara ini, bukan seperti yang mereka pikirkan. {cite:kamil-ibn-al-athir hlm. 17-18}."
