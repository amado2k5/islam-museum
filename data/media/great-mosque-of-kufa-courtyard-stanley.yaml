alt:
  ar: "صحن واسع من الرخام الأبيض تحيط به أروقة مكسوّة ببلاط أزرق وأصفر؛ إلى اليسار قبة ذهبية وإلى اليمين برج ساعة مكسوّ بالبلاط ذو رأس ذهبي، وفي الصحن أشخاص عدة بعباءات داكنة يمشون."
  en: "A wide white marble courtyard lined with arcades faced in blue and yellow tiles; a golden dome rises on the left and a tiled clock tower with a golden top on the right, and several figures in dark cloaks walk across the court."
  ur: "سفید سنگ مرمر کا ایک وسیع صحن جس کے گرد نیلی اور پیلی ٹائلوں سے ڈھکے برآمدے ہیں؛ بائیں جانب سنہری گنبد بلند ہے اور دائیں جانب ٹائلوں سے ڈھکا گھنٹہ گھر ہے جس کا سرا سنہری ہے، اور صحن میں گہری عباؤں والے کئی افراد چل رہے ہیں۔"
  fr: "Une vaste cour de marbre blanc bordée d'arcades revêtues de carreaux bleus et jaunes ; une coupole dorée s'élève à gauche et une tour de l'horloge carrelée à sommet doré à droite, et plusieurs personnes en manteaux sombres traversent la cour."
  es: "Un amplio patio de mármol blanco bordeado de arcadas revestidas de azulejos azules y amarillos; una cúpula dorada se alza a la izquierda y una torre del reloj de azulejos con remate dorado a la derecha, y varias figuras con capas oscuras cruzan el patio."
  tr: "Mavi ve sarı çinilerle kaplı revaklarla çevrili geniş beyaz mermer bir avlu; solda altın bir kubbe, sağda tepesi altın çini kaplı bir saat kulesi yükseliyor, avluda koyu pelerinli birkaç kişi yürüyor."
  id: "Halaman dalam marmer putih yang luas dikelilingi arkade berlapis ubin biru dan kuning; sebuah kubah emas menjulang di sebelah kiri dan menara jam berubin dengan puncak emas di sebelah kanan, dan beberapa orang berjubah gelap berjalan melintasi halaman."
