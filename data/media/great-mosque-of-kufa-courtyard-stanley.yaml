summary:
  ar: "تُظهر الصورة صحن مسجد الكوفة، وفوق أروقته قبة ذهبية وبرج ساعة مكسوّ بالبلاط. صورة التقطها David Stanley في 12 مايو 2016، من ويكيميديا كومنز، بترخيص CC BY 2.0."
  en: "The photograph shows the courtyard of the Great Mosque of Kufa, with a golden dome and a tiled clock tower above its arcades. Photograph by David Stanley, 12 May 2016, on Wikimedia Commons, licensed CC BY 2.0."
  ur: "تصویر میں مسجد کوفہ کا صحن دکھائی دیتا ہے، اس کے برآمدوں کے اوپر ایک سنہری گنبد اور ٹائلوں سے ڈھکا گھنٹہ گھر ہے۔ تصویر: David Stanley، 12 مئی 2016ء، وکیمیڈیا کامنز سے، لائسنس CC BY 2.0۔"
  fr: "La photographie montre la cour de la Grande Mosquée de Koufa, avec une coupole dorée et une tour de l'horloge carrelée au-dessus de ses arcades. Photographie : David Stanley, 12 mai 2016, sur Wikimedia Commons, sous licence CC BY 2.0."
  es: "La fotografía muestra el patio de la Gran Mezquita de Kufa, con una cúpula dorada y una torre del reloj revestida de azulejos sobre sus arcadas. Fotografía de David Stanley, 12 de mayo de 2016, en Wikimedia Commons, con licencia CC BY 2.0."
  tr: "Fotoğraf, Kûfe Camii'nin avlusunu, revaklarının üzerinde altın bir kubbe ve çini kaplı bir saat kulesiyle birlikte gösteriyor. Fotoğraf: David Stanley, 12 Mayıs 2016; Wikimedia Commons, CC BY 2.0 lisansı."
  id: "Foto ini menampilkan halaman dalam Masjid Kufah, dengan kubah emas dan menara jam berubin di atas arkadenya. Foto oleh David Stanley, 12 Mei 2016, di Wikimedia Commons, berlisensi CC BY 2.0."
