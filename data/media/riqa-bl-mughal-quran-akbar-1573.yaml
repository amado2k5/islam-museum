"summary":
  "ar": "صورة لصفحتين من المصحف المغولي، المكتبة البريطانية، المخطوطة الإضافية ١٨٤٩٧، الورقتان ١١٨ ظهر و١١٩ وجه، نسخه هبة الله الحسيني للإمبراطور أكبر في لاهور سنة ١٥٧٣-١٥٧٤م. وتقول صفحة الملف إن السطر الأول والأوسط والأخير بخط المحقق بالتناوب بين الأزرق والذهبي، وإن اللوحات بينها بسطور أقصر من النسخ الأسود، وإن الرقاع استُعمل خط عناوين كما في عناوين السور بالأسود على أرضية ذهبية؛ وفيها من الآية ١١٠ من سورة الكهف إلى الآية ٣١ من سورة مريم. تخدم مثالًا على الرقاع، الخط الصغير الذي تتصل فيه حروف لا تتصل في غيره، وقد استُعمل هنا خطَّ عناوين. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a double page of the Mughal Qur'an, British Library Additional MS 18497, ff. 118v-119r, copied by Hibatallah al-Husayni for Emperor Akbar at Lahore in 1573-74. The file page says the first, middle and last lines are in Muhaqqaq, in alternating blue and gold, the panels between them in shorter lines of black naskh, and Riqa' used as a display script, as in the chapter headings in black on a gold ground; it carries sura 18, verse 110, to sura 19, verse 31. It serves as an example of Riqa', a small hand whose letters join where other scripts leave gaps, here used as a display script for headings. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "مغل قرآن، برٹش لائبریری اضافی مخطوطہ ۱۸۴۹۷، ورق ۱۱۸ پشت و ۱۱۹ رخ، کے دو صفحوں کی تصویر، جسے ہبت اللہ حسینی نے شہنشاہ اکبر کے لیے لاہور میں ۱۵۷۳ تا ۱۵۷۴ء میں نقل کیا۔ فائل کا صفحہ کہتا ہے کہ پہلی، درمیانی اور آخری سطر محقق میں ہیں، باری باری نیلی اور سنہری، ان کے درمیان کے خانوں میں سیاہ نسخ کی چھوٹی سطریں ہیں، اور رقاع بطور عنوانی خط برتا گیا ہے، جیسے سنہری زمین پر سیاہ میں سورتوں کے عنوان؛ اس میں سورۂ کہف کی آیت ۱۱۰ سے سورۂ مریم کی آیت ۳۱ تک ہے۔ یہ رقاع کی مثال ہے، وہ چھوٹا خط جس میں وہ حروف بھی جڑ جاتے ہیں جو دوسرے خطوط میں الگ رہتے ہیں، اور یہاں عنوانات کے لیے استعمال ہوا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una doble página del Corán mogol, British Library Additional MS 18497, ff. 118v-119r, copiada por Hibatallah al-Husayni para el emperador Akbar en Lahore en 1573-74. La página del archivo indica que la primera, la del medio y la última línea están en Muhaqqaq, en azul y dorado alternados, los paneles entre ellas en líneas más cortas de naskh negro, y Riqa' se usa como escritura de exhibición, como en los títulos de los capítulos en negro sobre fondo dorado; contiene desde la sura 18, versículo 110, hasta la sura 19, versículo 31. Sirve como ejemplo de Riqa', una letra pequeña cuyas letras se unen donde otras escrituras dejan espacios, utilizada aquí como escritura de exhibición para los títulos. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'une double page du Coran moghol, manuscrit additionnel 18497 de la British Library, ff. 118v-119r, copié par Hibatallah al-Husayni pour l'empereur Akbar à Lahore en 1573-1574. La notice indique que les première, deuxième et dernière lignes sont en muhaqqaq, en alternance de bleu et d'or, les panneaux intermédiaires étant composés de lignes plus courtes en naskh noir, et que le riqa' est utilisé comme écriture d'ornement, notamment pour les titres des chapitres en noir sur fond or; la page comprend les versets 110 de la sourate 18 et 31 de la sourate 19. Elle constitue un exemple de riqa', une écriture minuscule dont les lettres se rejoignent là où d'autres écritures laissent des espaces, employée ici comme écriture d'ornement pour les titres. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Bir Babür Kur'an'ından iki sayfanın fotoğrafı, Britanya Kütüphanesi, Ek El Yazması 18497, 118. sayfanın arka yüzü ve 119. sayfasının ön yüzü, Hibatullah el-Hüseyni tarafından 1573-1574 yıllarında Lahor'da İmparator Akbar için kopyalanmıştır. Dosya sayfasında, ilk, orta ve son satırların mavi ve altın renkler arasında değişen Muhaqqaq yazısıyla yazıldığı, sayfaların siyah naskh'tan daha kısa satırlarda olduğu ve ruq'ahların, sure başlıklarında olduğu gibi, altın zemin üzerine siyah renkte bir başlık yazısı kullandığı belirtilmiştir; Kehf Suresi'nin 110. ayetinden Meryem Suresi'nin 31. ayetine kadar olan ayetleri içermektedir. Harflerin diğer yazılarda olmayan bir şekilde birleştirildiği küçük bir yazı türü olan ruq'ah'ın bir örneğidir ve burada bir başlık yazısı kullanılmıştır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto dua halaman dari Al-Qur'an Mughal, Perpustakaan Inggris, Manuskrip Tambahan 18497, folio 118 verso dan 119 recto, disalin oleh Hibatullah al-Husseini untuk Kaisar Akbar di Lahore pada tahun 1573-1574 M. Halaman arsip menyatakan bahwa baris pertama, tengah, dan terakhir menggunakan aksara Muhaqqaq yang berg alternating antara biru dan emas, bahwa folio-folio tersebut menggunakan baris yang lebih pendek daripada naskh hitam, dan bahwa ruq'ah menggunakan aksara judul, seperti pada judul surah, berwarna hitam dengan latar belakang emas; berisi ayat 110 Surah al-Kahf hingga ayat 31 Surah Maryam. Ini berfungsi sebagai contoh ruq'ah, aksara kecil di mana huruf-huruf digabungkan dengan cara yang tidak ada pada aksara lain, dan di sini telah digunakan aksara judul. Gambar tersebut ditandai di Wikimedia Commons sebagai domain publik."
