"summary":
  "ar": "صورة لخط بالشكسته نستعليق لعبد المجيد الطالقاني، إيران، ١٧٦٦م، مكتبة قصر غلستان رقم ١٥٢٤، كما تذكر صفحة الملف. تخدم مثالًا على الشكسته، الاختزال الفارسي «المكسور» الذي يصل الحروف بضربة واحدة ويُستعمل للرسائل والمراسيم. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of calligraphy in Shakastah Nasta'liq script by Abd al-Majid Taleqani, Iran, 1766, Library of the Golestan Palace no. 1524, as the file page states. It serves as an example of Shikasta, the 'broken' Persian shorthand hand that joins letters in one stroke and is used for letters and decrees. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "شکستہ نستعلیق میں عبد المجید طالقانی کی خطاطی کی تصویر، ایران، ۱۷۶۶ء، گلستان محل کا کتب خانہ نمبر ۱۵۲۴، جیسا فائل کا صفحہ بتاتا ہے۔ یہ شکستہ کی مثال ہے، «ٹوٹا ہوا» فارسی مختصر نویسی کا خط جو حروف کو ایک ہی ضرب میں جوڑتا ہے اور خطوط و فرامین میں برتا جاتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una caligrafía en escritura Shakastah Nasta'liq de Abd al-Majid Taleqani, Irán, 1766, Biblioteca del Palacio de Golestán n.º 1524, como indica la página del archivo. Sirve como ejemplo de Shikasta, la taquigrafía persa «quebrada» que une las letras en un solo trazo y se utiliza para cartas y decretos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une calligraphie en écriture Shakastah Nasta'liq par Abd al-Majid Taleqani, Iran, 1766, Bibliothèque du Palais de Golestan n° 1524, comme indiqué sur la page du fichier. Elle illustre le shikasta, une sténographie persane « brisée » qui lie les lettres en un seul trait et est utilisée pour les lettres et les décrets. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Dosya sayfasında belirtildiği gibi, İran'dan Abdülmecid el-Talikani tarafından 1766 yılında yazılmış Şikasteh Nasta'lik yazısının bir fotoğrafı, Golestan Sarayı Kütüphanesi No. 1524. Harfleri tek bir vuruşla birleştiren ve mektuplar ile kararnamelerde kullanılan Farsça \"kırık\" stenografi olan Şikasteh'in bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto aksara Shikasteh Nasta'liq karya Abd al-Majid al-Taliqani, Iran, 1766 M, Perpustakaan Istana Golestan No. 1524, seperti yang tercatat di halaman file. Foto ini berfungsi sebagai contoh Shikasteh, steno \"patah\" Persia yang menggabungkan huruf dengan satu goresan dan digunakan untuk surat dan dekrit. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
