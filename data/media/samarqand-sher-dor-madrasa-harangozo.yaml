summary:
  ar: "تُظهر الصورة واجهة مدرسة شير دار في سمرقند، ببوابتها العالية المكسوّة بالبلاط بين مئذنتين وقبتين مضلّعتين. صورة التقطها Adam Harangozó في 30 يوليو 2018، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the façade of the Sher-Dor Madrasa in Samarqand, with its tall tiled portal between two minarets and two ribbed domes. Photograph by Adam Harangozó, 30 July 2018, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں سمرقند میں مدرسہ شیر دار کا سامنے کا رخ دکھائی دیتا ہے، جس میں ٹائلوں سے ڈھکا بلند پورٹل دو میناروں اور دو دھاری دار گنبدوں کے بیچ ہے۔ تصویر: Adam Harangozó، 30 جولائی 2018ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la façade de la madrasa Sher-Dor à Samarcande, avec son haut portail carrelé entre deux minarets et deux coupoles nervurées. Photographie : Adam Harangozó, 30 juillet 2018, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la fachada de la madrasa Sher-Dor en Samarcanda, con su alto portal de azulejos entre dos minaretes y dos cúpulas acanaladas. Fotografía de Adam Harangozó, 30 de julio de 2018, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Semerkant'taki Şirdar Medresesi'nin cephesini, iki minare ve iki kaburgalı kubbe arasındaki yüksek çini kaplı portaliyle gösteriyor. Fotoğraf: Adam Harangozó, 30 Temmuz 2018; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan fasad Madrasah Sher-Dor di Samarkand, dengan portal tinggi berubinnya di antara dua menara dan dua kubah beralur. Foto oleh Adam Harangozó, 30 Juli 2018, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
