alt:
  ar: "مبنى ضخم مكسوّ ببلاط أزرق وبلون المغرة: في وسطه بوابة عالية بعقد مدبب، وعلى كل جانب قبة فيروزية مضلّعة ومئذنة مستديرة، وأمامه ساحة مبلّطة واسعة يمشي فيها بضعة أشخاص."
  en: "A monumental building covered in blue and ochre tilework: a tall pointed-arch portal in the centre, a ribbed turquoise dome and a round minaret on each side, and a wide paved square in front where a few people walk."
  ur: "نیلی اور گیرو رنگ کی ٹائلوں سے ڈھکی ایک عظیم الشان عمارت: وسط میں نوکیلی محراب والا بلند پورٹل، ہر جانب فیروزی دھاری دار گنبد اور گول مینار، اور سامنے ایک وسیع پختہ چوک جس میں چند لوگ چل رہے ہیں۔"
  fr: "Un édifice monumental couvert de carreaux bleus et ocre : un haut portail à arc brisé au centre, et de chaque côté une coupole turquoise nervurée et un minaret rond, avec une vaste place dallée devant où marchent quelques personnes."
  es: "Un edificio monumental cubierto de azulejos azules y ocres: un alto portal de arco apuntado en el centro, una cúpula turquesa acanalada y un minarete redondo a cada lado, y una amplia plaza pavimentada delante por donde caminan algunas personas."
  tr: "Mavi ve toprak sarısı çinilerle kaplı anıtsal bir yapı: ortada yüksek sivri kemerli bir portal, her iki yanda kaburgalı turkuaz bir kubbe ve yuvarlak bir minare, önünde birkaç kişinin yürüdüğü geniş taş döşeli bir meydan."
  id: "Bangunan monumental yang dilapisi keramik biru dan oker: portal tinggi berlengkung runcing di tengah, kubah pirus beralur dan menara bundar di tiap sisi, serta alun-alun luas berpaving di depannya tempat beberapa orang berjalan."
