  "ar": "الورقتان ١ ظهر و٢ وجه من الجزء الخامس عشر من مصحف في ثلاثين جزءًا نسخه ياقوت المستعصمي، بغداد، ١٢٨٢-١٢٨٣م"
  "en": "Folios 1b-2a of Part 15 of a 30-part Qur'an copied by Yaqut al-Musta'simi, Baghdad, 1282-1283"
  "ur": "یاقوت مستعصمی کے نقل کردہ تیس پاروں کے قرآن کے پندرھویں پارے کے ورق ۱ پشت و ۲ رخ، بغداد، ۱۲۸۲-۱۲۸۳ء"
"summary":
  "ar": "صورة للورقتين ١ ظهر و٢ وجه من الجزء الخامس عشر من مصحف في ثلاثين جزءًا تقول صفحة الملف، مستندةً إلى مجموعات خليلي، إن ياقوت المستعصمي نسخه في بغداد سنة ١٢٨٢-١٢٨٣م، ٦٨١هـ. ولا تسمّي صفحة الملف الخط. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of folios 1b-2a from Part 15 of a 30-part Qur'an that the file page, citing the Khalili Collections, says was copied by Yaqut al-Musta'simi in Baghdad in 1282-1283, AH 681. The file page does not name the script. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "تیس پاروں کے قرآن کے پندرھویں پارے کے ورق ۱ پشت و ۲ رخ کی تصویر جس کے بارے میں فائل کا صفحہ، خلیلی کلیکشنز کا حوالہ دے کر، کہتا ہے کہ اسے یاقوت مستعصمی نے بغداد میں ۱۲۸۲-۱۲۸۳ء، ۶۸۱ھ میں نقل کیا۔ فائل کا صفحہ خط کا نام نہیں لیتا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
