alt:
  ar: "ضريح من الرخام الأبيض ذو قبة بصلية كبيرة وأربع مآذن منفصلة، يُرى على امتداد قناة ماء طويلة تحفّ بها أشجار السرو وممرات حمراء، تحت سماء زرقاء فيها سحب؛ وفي الحديقة مجموعات صغيرة من الزوار."
  en: "A white marble mausoleum with a large bulbous dome and four free-standing minarets, seen along a long water channel lined with cypress trees and red paths, under a blue sky with clouds; small groups of visitors stand in the garden."
  ur: "سفید سنگ مرمر کا ایک مقبرہ جس پر بڑا پیازی گنبد اور چار الگ کھڑے مینار ہیں، سرو کے درختوں اور سرخ روشوں سے گھری ایک لمبی نہر کے ساتھ ساتھ دکھائی دیتا ہے، بادلوں بھرے نیلے آسمان تلے؛ باغ میں زائرین کے چھوٹے گروہ کھڑے ہیں۔"
  fr: "Un mausolée de marbre blanc à grande coupole bulbeuse et à quatre minarets indépendants, vu le long d'un long canal bordé de cyprès et d'allées rouges, sous un ciel bleu nuageux ; de petits groupes de visiteurs se tiennent dans le jardin."
  es: "Un mausoleo de mármol blanco con una gran cúpula bulbosa y cuatro minaretes exentos, visto a lo largo de un largo canal de agua flanqueado por cipreses y sendas rojas, bajo un cielo azul con nubes; pequeños grupos de visitantes están en el jardín."
  tr: "Büyük soğan biçimli bir kubbesi ve birbirinden ayrı duran dört minaresi olan beyaz mermer bir türbe, selvi ağaçları ve kırmızı yollarla çevrili uzun bir su kanalı boyunca görülüyor, bulutlu mavi bir gökyüzünün altında; bahçede küçük ziyaretçi grupları duruyor."
  id: "Mausoleum marmer putih dengan kubah besar berbentuk bawang dan empat menara yang berdiri terpisah, terlihat sepanjang saluran air panjang yang diapit pohon cemara dan jalan setapak merah, di bawah langit biru berawan; kelompok-kelompok kecil pengunjung berdiri di taman."
