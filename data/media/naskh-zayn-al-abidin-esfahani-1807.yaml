"summary":
  "ar": "صورة لورقة مصحف بخط النسخ نسخها زين العابدين الأصفهاني سنة ١٨٠٧م، مكتبة المجلس الإسلامي الإيراني رقم ٥٠٩٩، كما تذكر صفحة الملف. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio of the Qur'an in Naskh script copied by Zayn al-Abidin Isfahani in 1807, Library of the Islamic Parliament of Iran, no. 5099, as the file page states. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "نسخ خط میں مصحف کے ایک ورق کی تصویر، جسے زین العابدین اصفہانی نے ۱۸۰۷ء میں نقل کیا، ایرانی اسلامی مجلس کا کتب خانہ نمبر ۵۰۹۹، جیسا کہ فائل کا صفحہ بتاتا ہے۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán en escritura naskh, copiado por Zayn al-Abidin Isfahani en 1807, perteneciente a la Biblioteca del Parlamento Islámico de Irán, n.º 5099, según indica la ficha del archivo. Sirve como ejemplo de la escritura naskh, una caligrafía pequeña y uniforme que se convirtió en la habitual para copiar libros y pequeños ejemplares del Corán. En Wikimedia Commons, el archivo es de dominio público."
  "fr": "Photographie d'un folio du Coran en écriture naskh, copié par Zayn al-Abidin Isfahani en 1807, conservé à la Bibliothèque du Parlement islamique d'Iran (n° 5099), comme indiqué sur la page du fichier. Ce document illustre l'écriture naskh, une petite écriture cursive régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Sur Wikimedia Commons, le fichier est dans le domaine public."
