label:
  ar: "صورة: مئذنة على سور جامع عمرو بن العاص بالفسطاط سنة 2011"
  en: "Image: a minaret on the wall of the Mosque of Amr ibn al-As in Fustat, 2011"
  ur: "تصویر: فسطاط میں جامع عمرو بن العاص کی دیوار پر ایک مینار، 2011ء"
summary:
  ar: "صورة فوتوغرافية ملوّنة التُقطت في 10 ديسمبر 2011 لسور جامع عمرو بن العاص بنوافذه المقوّسة وشُرّافاته، تعلوه مئذنة من عصر متأخر بشرفة وخوذة مدبّبة؛ محفوظة في ويكيميديا كومنز بترخيص CC0 وتُضمَّن برابطها بلا نسخ. في هذا الجامع أقام مسلمة بن مخلد أول المنار سنة 53هـ، والمئذنة الظاهرة في الصورة ليست مئذنته بل بناء لاحق."
  en: "A colour photograph taken on 10 December 2011 of the wall of the Mosque of Amr ibn al-As, with its arched windows and crenellations and a later minaret with a balcony and a pointed cap rising above it. It is held on Wikimedia Commons under CC0 and embedded by its URL, not copied. Maslama ibn Mukhallad built the first minarets at this mosque in 53 AH; the minaret in the photograph is a later building, not his."
  ur: "10 دسمبر 2011ء کو لی گئی ایک رنگین تصویر جس میں جامع عمرو بن العاص کی دیوار، اس کی محراب دار کھڑکیاں اور کنگورے، اور اس کے اوپر بالکونی اور نوکیلی ٹوپی والا ایک بعد کے دور کا مینار نظر آتا ہے۔ یہ وکی میڈیا کامنز پر CC0 کے تحت محفوظ ہے اور نقل کیے بغیر اپنے ربط سے شامل کی گئی ہے۔ اسی مسجد میں مسلمہ بن مخلد نے 53ھ میں پہلے منار بنوائے؛ تصویر والا مینار ان کا نہیں بلکہ بعد کی تعمیر ہے۔"
