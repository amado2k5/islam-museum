summary:
  ar: "صورة فوتوغرافية ملوّنة التُقطت في 10 ديسمبر 2011 لسور جامع عمرو بن العاص بنوافذه المقوّسة وشُرّافاته، تعلوه مئذنة من عصر متأخر بشرفة وخوذة مدبّبة؛ محفوظة في ويكيميديا كومنز بترخيص CC0 وتُضمَّن برابطها بلا نسخ. في هذا الجامع أقام مسلمة بن مخلد أول المنار سنة 53هـ، والمئذنة الظاهرة في الصورة ليست مئذنته بل بناء لاحق."
  en: "A colour photograph taken on 10 December 2011 of the wall of the Mosque of Amr ibn al-As, with its arched windows and crenellations and a later minaret with a balcony and a pointed cap rising above it. It is held on Wikimedia Commons under CC0 and embedded by its URL, not copied. Maslama ibn Mukhallad built the first minarets at this mosque in 53 AH; the minaret in the photograph is a later building, not his."
  ur: "10 دسمبر 2011ء کو لی گئی ایک رنگین تصویر جس میں جامع عمرو بن العاص کی دیوار، اس کی محراب دار کھڑکیاں اور کنگورے، اور اس کے اوپر بالکونی اور نوکیلی ٹوپی والا ایک بعد کے دور کا مینار نظر آتا ہے۔ یہ وکی میڈیا کامنز پر CC0 کے تحت محفوظ ہے اور نقل کیے بغیر اپنے ربط سے شامل کی گئی ہے۔ اسی مسجد میں مسلمہ بن مخلد نے 53ھ میں پہلے منار بنوائے؛ تصویر والا مینار ان کا نہیں بلکہ بعد کی تعمیر ہے۔"
  es: "Fotografía en color tomada el 10 de diciembre de 2011 del muro de la Mezquita de Amr ibn al-As, con sus ventanas arqueadas y almenas, y un minarete posterior con balcón y remate puntiagudo. Se encuentra en Wikimedia Commons bajo licencia CC0 y se puede insertar mediante su URL, no copiar. Maslama ibn Mukhallad construyó los primeros minaretes de esta mezquita en el año 53 de la Hégira; el minarete de la fotografía es una construcción posterior, no suya."
  fr: "Photographie couleur prise le 10 décembre 2011 du mur de la mosquée d'Amr ibn al-As, avec ses fenêtres cintrées, ses créneaux et un minaret plus récent, surmonté d'un balcon et d'un dôme pointu. Cette image est disponible sur Wikimedia Commons sous licence CC0 et intégrée via son URL, sans être copiée. Maslama ibn Mukhallad fit construire les premiers minarets de cette mosquée en 53 AH; le minaret visible sur la photographie est une construction postérieure."
  tr: "10 Aralık 2011'de çekilmiş, Amr ibn al-As Camii'nin kemerli pencereleri ve mazgallarıyla süslü duvarını gösteren renkli bir fotoğraf; üzerinde daha sonra eklenmiş, balkonlu ve sivri kubbeli bir minare bulunmaktadır; fotoğraf, Wikimedia Commons'ta CC0 lisansı altında arşivlenmiş olup, bağlantısı kopyalanmadan eklenmiştir. Bu camide, Maslama ibn Mukhallad 53 Hicri yılında ilk minareyi inşa ettirmiştir ve fotoğrafta görünen minare onun minaresi değil, daha sonra eklenmiş bir minaredir."
  id: "Foto berwarna yang diambil pada 10 Desember 2011, memperlihatkan dinding Masjid Amr ibn al-As dengan jendela lengkung dan bentengnya, yang di atasnya terdapat menara tambahan dengan balkon dan kubah runcing; diarsipkan di Wikimedia Commons di bawah lisensi CC0 dan disertakan dengan tautannya tanpa menyalin. Di masjid ini, Maslama ibn Mukhallad mendirikan menara pertama pada tahun 53 Hijriah, dan menara yang terlihat dalam foto bukanlah menara miliknya tetapi tambahan yang dibangun kemudian."
