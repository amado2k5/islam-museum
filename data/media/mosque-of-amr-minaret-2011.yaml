alt:
  ar: "سور حجري فاتح لجامع عمرو بن العاص يُرى من أسفل، فيه نافذتان مقوّستان بإطار من الطوب وأعلاه شُرّافات مسنّنة، وترتفع خلفه مئذنة داكنة بشرفة خشبية وقمة مدبّبة تحت سماء زرقاء، وفي الأسفل عمود إنارة بكرة بيضاء"
  en: "A pale stone wall of the Mosque of Amr ibn al-As seen from below, with two arched windows framed in brick and stepped crenellations along the top. Behind it rises a dark minaret with a wooden balcony and a pointed top against a blue sky; a street lamp with a white globe stands at the bottom"
  ur: "نیچے سے دکھائی دیتی جامع عمرو بن العاص کی ہلکے رنگ کی پتھریلی دیوار، جس میں اینٹوں کے فریم والی دو محراب دار کھڑکیاں اور اوپر سیڑھی نما کنگورے ہیں۔ اس کے پیچھے نیلے آسمان کے سامنے لکڑی کی بالکونی اور نوکیلی چوٹی والا ایک گہرے رنگ کا مینار بلند ہے؛ نیچے سفید گولے والا ایک بجلی کا کھمبا کھڑا ہے"
