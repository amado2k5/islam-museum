  "en": "Ma'il Qur'an page, British Library Or. 2165, f. 76v"
  "ur": "مصحفِ مائل کا صفحہ، برٹش لائبریری، مشرقی ۲۱۶۵، ورق ۷۶ پشت"
"summary":
  "ar": "صورة صفحة من المصحف المائل، المكتبة البريطانية، مخطوطات شرقية ٢١٦٥، الورقة ٧٦ ظهر، تؤرخها صفحة الملف بالقرن الثامن وبالحجاز. وتقول إن النص مكتوب على الرق بخط مبكر يسمى المائل، أي المنحدر هنا إلى اليمين، وهو من الخطوط المبكرة التي تُعرف مجتمعةً بالحجازي؛ وتنبّه إلى خلوّه من علامات الإعجام التي تميّز بين الحروف المتشابهة، وإلى أن نهاية الآية تُعلَّم بست شرطات صغيرة في كومتين من ثلاث. تُعرض لأن اسم المائل ظلّ يُطلق زمنًا على خط مصحفي مبكر مائل الحروف، وهو اليوم من عائلة الحجازي. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page of the Ma'il Qur'an, British Library Oriental Manuscripts 2165, f. 76v, dated by the file page to the 8th century and to the Hijaz. The page says the text is penned on parchment in an early script called ma'il, 'sloping', in this case to the right, one of the early scripts collectively named Hijazi; it notes the lack of diacritical marks that distinguish similar letters and that verse ends are marked by six small dashes in two stacks of three. It is shown because the Ma'il name was long used for an early leaning hand of mushaf copies and is now filed under the Hijazi family. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "مصحفِ مائل، برٹش لائبریری مشرقی مخطوطہ ۲۱۶۵، ورق ۷۶ پشت کے ایک صفحے کی تصویر جسے فائل کا صفحہ آٹھویں صدی اور حجاز سے منسوب کرتا ہے۔ صفحہ کہتا ہے کہ متن رق پر مائل نامی ابتدائی خط میں لکھا ہے، یعنی یہاں دائیں طرف جھکا ہوا، جو حجازی نام سے مشترکہ طور پر معروف ابتدائی خطوں میں سے ہے؛ وہ اعجام کی ان علامات کی غیر موجودگی کی طرف توجہ دلاتا ہے جو ملتے جلتے حروف میں فرق کرتی ہیں، اور بتاتا ہے کہ آیت کا اختتام تین تین کے دو ڈھیروں میں چھ چھوٹی لکیروں سے ظاہر ہے۔ یہ اس لیے دکھائی گئی کہ مائل کا نام مدت تک مصاحف کے ایک ابتدائی مائل خط پر بولا جاتا رہا اور اب یہ حجازی خاندان میں شمار ہوتا ہے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
