summary:
  ar: "سلسلة تعليمية تبين منهج غرس الدين: عرض مبادئ الهيئة المشهورة، ثم مطابقتها بالرصد، ثم نقل النماذج المعدّلة من ابن الشاطر والعرضي؛ لا ترسم منحنيات ولا نماذج فلكية."
  en: "Teaching chain showing Gars al-Din's method: present the famous hay'a's principles, test them against observation, then cite revised models from Ibn al-Shatir and al-Urdi; it draws no curves and no planetary models."
  ur: "تدریسی سلسلہ جو غرس الدین کے طرز کو دکھاتا ہے: مشہور ہیئت کے اصول پیش کرنا، انہیں مشاہدے سے جانچنا، پھر ابن الشاطر اور عرضی کے ترمیم شدہ نمونے نقل کرنا؛ نہ وکر نہ سیاروی نمونے۔"
  es: "Cadena de enseñanza que muestra el método de Gars al-Din: presenta los principios de la famosa hay'a, los contrasta con la observación y luego cita modelos revisados de Ibn al-Shatir y al-Urdi; no dibuja curvas ni modelos planetarios."
  fr: "Chaîne d'enseignement montrant la méthode de Gars al-Din: présenter les principes célèbres de la hay'a, les confronter à l'observation, puis citer des modèles révisés d'Ibn al-Shatir et d'al-Urdi; elle ne trace ni courbes ni modèles planétaires."
