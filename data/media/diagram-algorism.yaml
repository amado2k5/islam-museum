alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه مربعان بإطار متقطع: الأرقام الهندية والنظام العشري المنزلي مع الصفر، و«سدهانتا» براهماغوبتا التي جاء بها وفد هندي إلى بغداد نحو 154 هـ. في الوسط مربع بإطار سميك: الحساب الهندي بالأرقام العشرية، الخوارزمي. العمود الأخير بعنوان: بُني عليه، وفيه خمسة مربعات: الترجمة اللاتينية في القرن الثاني عشر، وكتاب ألكسندر دي فيلا دي، وكتاب جون أوف هاليفاكس، واسم الأرقام اللاتيني Algorismus والكلمة الإسبانية guarismo، وكلمة algorithm."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds two dashed boxes: the Indian numerals and the decimal place-value system with zero; Brahmagupta's Siddhanta, brought to Baghdad by an Indian delegation around 154 AH. In the middle a box with a thick border: Algorism, al-Khwarizmi. The last column, headed Built on it, holds five boxes: the twelfth-century Latin translation; Alexander de Villa Dei's Carmen de Algorismo; John of Halifax's Algorismus vulgaris; the Latin name Algorismus for the numerals and the Spanish word guarismo; the word algorithm."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے دو خانے ہیں: ہندی ہندسے اور صفر کے ساتھ اعشاری مقامی نظام؛ برہما گپت کی «سدھانت»، جسے ایک ہندی وفد تقریباً 154ھ میں بغداد لایا۔ درمیان میں موٹے کنارے والا خانہ: الگورزم، خوارزمی۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں پانچ خانے ہیں: بارہویں صدی کا لاطینی ترجمہ؛ الیگزینڈر دی ویلا دئی کی Carmen de Algorismo؛ جان آف ہیلی فیکس کی Algorismus vulgaris؛ ہندسوں کا لاطینی نام Algorismus اور ہسپانوی لفظ guarismo؛ لفظ algorithm۔"
