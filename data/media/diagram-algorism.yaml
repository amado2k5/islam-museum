summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الحساب الهندي والخوارزمي، وعن جانب ما سبقه من الأرقام الهندية و«سدهانتا» براهماغوبتا، وعن الجانب الآخر ما جاء بعده من الترجمة اللاتينية وكتب الألغوريسموس والكلمات المشتقة من اسمه."
  en: "A simple schematic drawn by the site at build time from the record's data: algorism and al-Khwarizmi in the middle, what came before (the Indian numerals and Brahmagupta's Siddhanta) on one side, and what followed (the Latin translation, the algorism books and the words drawn from his name) on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں ہندی حساب اور خوارزمی، ایک طرف اس سے پہلے کی چیزیں (ہندی ہندسے اور برہما گپت کی «سدھانت»)، اور دوسری طرف بعد میں آنے والی چیزیں (لاطینی ترجمہ، الگورزم کی کتابیں اور ان کے نام سے بنے الفاظ)۔"
