alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه ثلاثة مربعات بإطار متقطع: أسطوانة بلال في المسجد النبوي، والأبراج في أركان سور معبد دمشق القديم، وأبراج المراقبة والإشارة والمنارات البحرية. في الوسط مربع بإطار سميك: المئذنة، مسلمة بن مخلد الأنصاري، 53هـ. العمود الأخير بعنوان: بُني عليه، وفيه أربعة مربعات: مآذن الجامع الأموي بدمشق، ومئذنة جامع القيروان، ومئذنة جامع ابن طولون، والمآذن العثمانية الكلاسيكية"
  en: "Three columns joined by two arrows. The first column, headed Built on, holds three dashed boxes: Bilal's ustuwana in the Prophet's Mosque; the corner towers of the old temple enclosure at Damascus; watch, signal and lighthouse towers. In the middle a box with a thick border: The minaret, Maslama ibn Mukhallad al-Ansari, 53 AH. The last column, headed Built on it, holds four boxes: the minarets of the Umayyad Mosque of Damascus; the minaret of the Great Mosque of Qayrawan; the minaret of the Mosque of Ibn Tulun; the classical Ottoman minarets"
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے تین خانے ہیں: مسجدِ نبوی میں بلال کا اسطوانہ؛ دمشق کے پرانے معبد کی چار دیواری کے کونوں کے برج؛ نگرانی، اشارے اور روشنی کے مینار۔ درمیان میں موٹے کنارے والا خانہ: مینار، مسلمہ بن مخلد انصاری، 53ھ۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چار خانے ہیں: دمشق کی جامع اموی کے مینار؛ قیروان کی جامع مسجد کا مینار؛ جامع ابن طولون کا مینار؛ کلاسیکی عثمانی مینار"
