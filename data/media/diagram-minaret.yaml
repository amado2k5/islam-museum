label:
  ar: "رسم: ما بُنيت عليه المئذنة وما بُني عليها"
  en: "Diagram: what the minaret was built on and what was built on it"
  ur: "خاکہ: مینار کس پر بنا اور اس پر کیا بنا"
  es: "Diagrama: sobre qué se construyó el minarete y qué se construyó sobre él."
  fr: "Schéma: sur quoi le minaret a été construit et ce qui a été construit dessus."
  tr: "Çizim: Minarenin üzerine neyin inşa edildiği ve onun üzerine nelerin inşa edildiği."
  id: "Gambar: Apa yang menjadi dasar pembangunan menara dan apa yang dibangun di atasnya"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط مئذنة مسلمة بن مخلد سنة 53هـ، وعن يمينها ما سبقها، وعن يسارها ما جاء بعدها من مآذن كما تذكرها المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: Maslama ibn Mukhallad's minaret of 53 AH in the middle, what came before it on one side and the later minarets the sources name on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں 53ھ کا مسلمہ بن مخلد کا مینار، ایک طرف وہ جو اس سے پہلے تھا اور دوسری طرف بعد کے وہ مینار جن کا ذکر مآخذ میں ہے۔"
  es: "Un esquema sencillo dibujado por el sitio en el momento de su construcción a partir de los datos del registro: el minarete de Maslama ibn Mukhallad del año 53 AH en el centro, lo que lo precedió a un lado y los minaretes posteriores cuyos nombres figuran en el otro."
  fr: "Un schéma simple dessiné par le site au moment de la construction à partir des données du registre: le minaret de Maslama ibn Mukhallad de 53 AH au milieu, ce qui l’a précédé d’un côté et les minarets ultérieurs nommés par les sources de l’autre."
  tr: "Yapım aşamasındaki kayıtlardan yola çıkarak site tarafından çizilmiş basit bir şema: Ortada Hicri 53 yılında Müslimah ibn Mukhallad'ın minaresi, sağında ondan önceki minareler, solunda ise kaynaklarda belirtilen ondan sonraki minareler yer almaktadır."
  id: "Diagram sederhana yang digambar oleh situs tersebut pada saat pembangunan berdasarkan data catatan: Di tengah adalah menara Muslimah ibn Mukhallad pada tahun 53 H, dan di sebelah kanannya adalah menara-menara yang ada sebelumnya, dan di sebelah kirinya adalah menara-menara yang ada setelahnya sebagaimana disebutkan oleh sumber-sumber."
