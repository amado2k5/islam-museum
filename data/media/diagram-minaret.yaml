summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط مئذنة مسلمة بن مخلد سنة 53هـ، وعن يمينها ما سبقها، وعن يسارها ما جاء بعدها من مآذن كما تذكرها المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: Maslama ibn Mukhallad's minaret of 53 AH in the middle, what came before it on one side and the later minarets the sources name on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں 53ھ کا مسلمہ بن مخلد کا مینار، ایک طرف وہ جو اس سے پہلے تھا اور دوسری طرف بعد کے وہ مینار جن کا ذکر مآخذ میں ہے۔"
