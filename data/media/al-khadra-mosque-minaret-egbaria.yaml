summary:
  ar: "تُظهر الصورة مئذنة جامع الخضراء الحجرية في نابلس ورأسها الأخضر. صورة التقطها معتز توفيق اغبارية في 31 يناير 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the stone minaret of al-Khadra Mosque in Nablus with its green top. Photograph by معتز توفيق اغبارية, 31 January 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں نابلس میں جامع خضراء کا پتھر کا مینار اس کے سبز سرے کے ساتھ دکھائی دیتا ہے۔ تصویر: معتز توفيق اغبارية، 31 جنوری 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre le minaret de pierre de la mosquée al-Khadra à Naplouse avec son sommet vert. Photographie : معتز توفيق اغبارية, 31 janvier 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el minarete de piedra de la mezquita de al-Khadra en Nablus con su remate verde. Fotografía de معتز توفيق اغبارية, 31 de enero de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Nablus'taki Hadra Camii'nin yeşil başlıklı taş minaresini gösteriyor. Fotoğraf: معتز توفيق اغبارية, 31 Ocak 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan menara batu Masjid Al-Khadra di Nablus dengan puncaknya yang hijau. Foto oleh معتز توفيق اغبارية, 31 Januari 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
