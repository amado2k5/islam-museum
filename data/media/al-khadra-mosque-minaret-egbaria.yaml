alt:
  ar: "مئذنة حجرية مربعة ذات شرفة خشبية ورأس أخضر بصلي الشكل يعلوه هلال، أمام سماء زرقاء صافية، وخلفها بيوت على سفح تل وتحتها خضرة."
  en: "A square stone minaret with a wooden balcony and a green onion-shaped top carrying a crescent, against a clear blue sky, with hillside houses behind and greenery below."
  ur: "ایک چوکور پتھر کا مینار جس میں لکڑی کی بالکونی اور پیاز کی شکل کا سبز سرا ہے جس پر ہلال ہے، صاف نیلے آسمان کے سامنے، پیچھے پہاڑی ڈھلوان پر مکانات اور نیچے ہریالی ہے۔"
  fr: "Un minaret carré de pierre avec un balcon de bois et un sommet vert en forme d'oignon surmonté d'un croissant, devant un ciel bleu dégagé, avec des maisons à flanc de colline derrière et de la verdure en dessous."
  es: "Un minarete cuadrado de piedra con un balcón de madera y un remate verde en forma de cebolla que lleva una media luna, contra un cielo azul despejado, con casas en la ladera detrás y vegetación debajo."
  tr: "Ahşap bir şerefesi ve üzerinde hilal bulunan soğan biçimli yeşil bir başlığı olan kare taş bir minare; açık mavi bir gökyüzüne karşı duruyor, arkasında yamaçtaki evler, altında yeşillik var."
  id: "Menara batu persegi dengan balkon kayu dan puncak hijau berbentuk bawang yang dimahkotai bulan sabit, berlatar langit biru cerah, dengan rumah-rumah di lereng bukit di belakangnya dan kehijauan di bawahnya."
