alt:
  ar: "بلدة من بيوت حجرية تصعد سفحًا شديد الانحدار نحو صخرة طويلة مسطحة القمة تعلوها أسوار حصن، يضيئها ضوء شمس منخفض تحت سماء زرقاء داكنة."
  en: "A town of stone houses climbs a steep hillside toward a long flat-topped rock crowned by fortress walls, lit by low sunlight under a deep blue sky."
  ur: "پتھر کے مکانات کا ایک شہر ایک عمودی پہاڑی ڈھلوان پر ایک لمبی ہموار چوٹی والی چٹان کی طرف چڑھ رہا ہے جس کے اوپر قلعے کی فصیلیں ہیں، نیچی دھوپ سے روشن، گہرے نیلے آسمان تلے۔"
  fr: "Une ville de maisons de pierre gravit un flanc de colline abrupt vers un long rocher à sommet plat couronné de murailles de forteresse, éclairée par une lumière basse sous un ciel bleu profond."
  es: "Una ciudad de casas de piedra trepa por una empinada ladera hacia una larga roca de cima plana coronada por murallas de fortaleza, iluminada por una luz baja bajo un cielo azul intenso."
  tr: "Taş evlerden oluşan bir şehir, tepesi düz uzun bir kayaya doğru dik bir yamaçta tırmanıyor; kayanın üzerinde hisar surları var, alçak güneş ışığıyla aydınlanıyor, koyu mavi bir gökyüzünün altında."
  id: "Kota rumah-rumah batu mendaki lereng bukit yang curam menuju batu panjang berpuncak datar yang dimahkotai tembok benteng, disinari cahaya matahari rendah di bawah langit biru tua."
