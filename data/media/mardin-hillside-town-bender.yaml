summary:
  ar: "تُظهر الصورة ماردين، وبيوتها الحجرية تغطي المنحدر أسفل صخرة القلعة. صورة التقطها Ben Bender، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows Mardin, its stone houses covering the slope below the citadel rock. Photograph by Ben Bender, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں ماردین دکھائی دیتا ہے، اس کے پتھر کے مکانات قلعے کی چٹان کے نیچے ڈھلوان کو ڈھانپے ہوئے ہیں۔ تصویر: Ben Bender، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre Mardin, ses maisons de pierre couvrant la pente sous le rocher de la citadelle. Photographie : Ben Bender, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra Mardin, con sus casas de piedra que cubren la pendiente bajo la roca de la ciudadela. Fotografía de Ben Bender, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, taş evlerinin kale kayasının altındaki yamacı kapladığı Mardin'i gösteriyor. Fotoğraf: Ben Bender; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Mardin, dengan rumah-rumah batunya yang menutupi lereng di bawah batu karang benteng. Foto oleh Ben Bender, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
