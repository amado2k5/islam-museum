depicts: [place/granada]
alt:
  ar: "منظر واسع لمدينة من بيوت بيضاء بسقوف من القرميد تغطي سفح تل وسهلًا، وفي المقدمة رؤوس أشجار خضراء كثيفة، وسماء زرقاء تتخللها سحب رقيقة."
  en: "A wide view over a city of white houses with tiled roofs covering a hillside and a plain, with dense green treetops in the foreground and a blue sky streaked with thin clouds."
  ur: "کھپریل کی چھتوں والے سفید مکانات کے ایک شہر کا وسیع منظر جو ایک پہاڑی ڈھلوان اور ایک میدان کو ڈھانپے ہوئے ہے، سامنے گھنے سبز درختوں کی چوٹیاں ہیں اور باریک بادلوں کی لکیروں والا نیلا آسمان ہے۔"
  fr: "Une vaste vue sur une ville de maisons blanches aux toits de tuiles qui couvrent un flanc de colline et une plaine, avec de denses cimes d'arbres verts au premier plan et un ciel bleu strié de minces nuages."
  es: "Una amplia vista sobre una ciudad de casas blancas con tejados de teja que cubren una ladera y una llanura, con densas copas de árboles verdes en primer plano y un cielo azul surcado de nubes finas."
  tr: "Bir yamacı ve bir ovayı kaplayan, kiremit çatılı beyaz evlerden oluşan bir şehrin geniş görünümü; ön planda yoğun yeşil ağaç tepeleri ve ince bulutların çizdiği mavi bir gökyüzü var."
  id: "Pemandangan luas sebuah kota dengan rumah-rumah putih beratap genteng yang menutupi lereng bukit dan dataran, dengan pucuk-pucuk pohon hijau yang lebat di latar depan dan langit biru yang dihiasi awan tipis."
