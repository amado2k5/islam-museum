summary:
  ar: "تُظهر الصورة مدينة غرناطة من قصر الحمراء، وبيوتها البيضاء تصعد التل المقابل. صورة التقطها Holger Uwe Schmitt في 20 أكتوبر 2024، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the city of Granada from the Alhambra, its white houses climbing the hill opposite. Photograph by Holger Uwe Schmitt, 20 October 2024, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں الحمرا سے غرناطہ شہر دکھائی دیتا ہے، اس کے سفید مکانات سامنے کی پہاڑی پر چڑھ رہے ہیں۔ تصویر: Holger Uwe Schmitt، 20 اکتوبر 2024ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la ville de Grenade depuis l'Alhambra, ses maisons blanches gravissant la colline d'en face. Photographie : Holger Uwe Schmitt, 20 octobre 2024, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la ciudad de Granada desde la Alhambra, con sus casas blancas que trepan por la colina de enfrente. Fotografía de Holger Uwe Schmitt, 20 de octubre de 2024, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Gırnata şehrini Elhamra'dan, karşıdaki tepeye tırmanan beyaz evleriyle birlikte gösteriyor. Fotoğraf: Holger Uwe Schmitt, 20 Ekim 2024; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan kota Granada dari Alhambra, dengan rumah-rumah putihnya yang mendaki bukit di seberang. Foto oleh Holger Uwe Schmitt, 20 Oktober 2024, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
