alt:
  ar: "مخطوطة مفتوحة على صفحتين من ورق بني فاتح، مكتوبتين بخط نسخ أسود متقارب السطور، وفي هامش الصفحة اليمنى تعليقات مائلة صغيرة. في أسفل كل صفحة رسم بالحبر الأحمر: مربع كبير مقسوم بخطوط إلى مربعات ومستطيلات أصغر، وعلى أركانها حروف عربية."
  en: "A manuscript open at two pages of light brown paper, written in close lines of black naskh script, with small slanting notes in the margin of the right-hand page. At the foot of each page is a drawing in red ink: a large square divided by lines into smaller squares and rectangles, with Arabic letters at their corners."
  ur: "ہلکے بھورے کاغذ کے دو صفحات پر کھلا ایک مخطوطہ، جن پر سیاہ نسخ خط میں قریب قریب سطریں لکھی ہیں، اور دائیں صفحے کے حاشیے میں چھوٹے ترچھے حواشی ہیں۔ ہر صفحے کے نیچے سرخ روشنائی سے ایک خاکہ ہے: ایک بڑا مربع جو لکیروں سے چھوٹے مربعوں اور مستطیلوں میں بٹا ہوا ہے، اور ان کے کونوں پر عربی حروف ہیں۔"
