label:
  ar: "صورة: صفحتان من مخطوطة كتاب الجبر والمقابلة للخوارزمي ⁦(بودليان، هنتنغتون 214)⁩"
  en: "Photo: two pages of al-Khwarizmi's al-Jabr wal-Muqabala (Bodleian, MS Huntington 214)"
  ur: "تصویر: خوارزمی کی «الجبر والمقابلہ» کے مخطوطے کے دو صفحات ⁦(بوڈلین، ہنٹنگٹن 214)⁩"
summary:
  ar: "صفحتان متقابلتان من مخطوطة مكتبة بودليان في أكسفورد (MS. Huntington 214)، وهي النسخة التي نُشرت عنها طبعة القاهرة سنة 1939، وقد نُسخت في القاهرة وفُرغ منها في المحرم سنة 743هـ {cite:khwarizmi-jabr-cairo-1939 p. 26}. تُظهر الصفحتان البرهان الهندسي على حل معادلتين من الدرجة الثانية بمربعات ومستطيلات مرسومة بالحبر الأحمر. الصورة من مكتبات بودليان، منشورة في ويكيميديا كومنز في الملك العام."
  en: "Two facing pages of the Bodleian Library manuscript in Oxford (MS. Huntington 214), the copy from which the 1939 Cairo edition was printed, copied in Cairo and finished in Muharram 743 AH {cite:khwarizmi-jabr-cairo-1939 p. 26}. The pages show the geometric proof for solving two quadratic equations, with squares and rectangles drawn in red ink. Photograph by the Bodleian Libraries, on Wikimedia Commons in the public domain."
  ur: "آکسفورڈ کی بوڈلین لائبریری کے مخطوطے (MS. Huntington 214) کے آمنے سامنے کے دو صفحات؛ یہی وہ نسخہ ہے جس سے 1939 کا قاہرہ ایڈیشن چھپا، جو قاہرہ میں نقل ہوا اور محرم 743ھ میں مکمل ہوا {cite:khwarizmi-jabr-cairo-1939 p. 26}۔ صفحات میں دو دو درجی مساواتوں کے حل کا ہندسی ثبوت ہے، سرخ روشنائی سے بنے مربعوں اور مستطیلوں کے ساتھ۔ تصویر بوڈلین لائبریریز کی ہے، وکی میڈیا کامنز پر پبلک ڈومین میں۔"
