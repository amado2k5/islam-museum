summary:
  ar: "تُظهر الصورة الجامع القديم في أدرنة بمئذنتيه تحت سماء كثيرة الغيوم. صورة التقطها Özgür Zeyhan في 25 أبريل 2010، من ويكيميديا كومنز، بترخيص CC0."
  en: "The photograph shows the Eski Mosque in Edirne with its two minarets under a sky full of clouds. Photograph by Özgür Zeyhan, 25 April 2010, on Wikimedia Commons, licensed CC0."
  ur: "تصویر میں ادرنہ کی جامع قدیم اپنے دو میناروں کے ساتھ بادلوں سے بھرے آسمان تلے دکھائی دیتی ہے۔ تصویر: Özgür Zeyhan، 25 اپریل 2010ء، وکیمیڈیا کامنز سے، لائسنس CC0۔"
  fr: "La photographie montre la mosquée Eski à Edirne avec ses deux minarets sous un ciel chargé de nuages. Photographie : Özgür Zeyhan, 25 avril 2010, sur Wikimedia Commons, sous licence CC0."
  es: "La fotografía muestra la mezquita Eski en Edirne con sus dos minaretes bajo un cielo lleno de nubes. Fotografía de Özgür Zeyhan, 25 de abril de 2010, en Wikimedia Commons, con licencia CC0."
  tr: "Fotoğraf, Edirne'deki Eski Cami'yi iki minaresiyle birlikte bulutlarla dolu bir gökyüzünün altında gösteriyor. Fotoğraf: Özgür Zeyhan, 25 Nisan 2010; Wikimedia Commons, CC0 lisansı."
  id: "Foto ini menampilkan Masjid Tua di Edirne dengan kedua menaranya di bawah langit yang penuh awan. Foto oleh Özgür Zeyhan, 25 April 2010, di Wikimedia Commons, berlisensi CC0."
