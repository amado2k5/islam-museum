alt:
  ar: "مسجد من الحجر والآجر له رواق بعقود واسعة وقباب منخفضة ومئذنتان غير متساويتين في الارتفاع، خلف أحواض زهور وأشجار، تحت غيوم كثيفة؛ والصورة شديدة التباين."
  en: "A stone and brick mosque with a porch of wide arches, low domes and two minarets of unequal height, behind flower beds and trees, under heavy clouds; the picture has strong, heightened contrast."
  ur: "پتھر اور اینٹ کی ایک مسجد جس میں کشادہ محرابوں والا برآمدہ، پست گنبد اور غیر برابر اونچائی کے دو مینار ہیں، پھولوں کی کیاریوں اور درختوں کے پیچھے، گھنے بادلوں تلے؛ تصویر کا تضاد بہت تیز ہے۔"
  fr: "Une mosquée de pierre et de brique avec un porche à larges arcs, de basses coupoles et deux minarets de hauteur inégale, derrière des parterres de fleurs et des arbres, sous d'épais nuages ; l'image présente un contraste fort et accentué."
  es: "Una mezquita de piedra y ladrillo con un pórtico de arcos anchos, cúpulas bajas y dos minaretes de altura desigual, detrás de macizos de flores y árboles, bajo nubes densas; la imagen tiene un contraste fuerte y acentuado."
  tr: "Geniş kemerli bir revağı, alçak kubbeleri ve yükseklikleri farklı iki minaresi olan taş ve tuğla bir cami; çiçek tarhlarının ve ağaçların arkasında, yoğun bulutların altında; fotoğrafın kontrastı çok yüksek."
  id: "Masjid batu dan bata dengan serambi berlengkung lebar, kubah-kubah rendah, dan dua menara yang tingginya tidak sama, di balik petak bunga dan pepohonan, di bawah awan tebal; kontras gambarnya sangat tajam."
