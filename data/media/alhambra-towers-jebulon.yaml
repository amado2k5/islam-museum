alt:
  ar: "أبراج مربعة من حجر مائل إلى الحمرة ذات شرفات، ومبنى قصر كبير بسقوف من القرميد، قائمة على تل مشجّر، يضيئها ضوء شمس دافئ منخفض، تحت سماء صافية."
  en: "Square reddish stone towers with battlements and a large palace block with tiled roofs stand on a wooded hill, lit by low warm sunlight, under a clear sky."
  ur: "کنگروں والے چوکور سرخی مائل پتھر کے برج اور کھپریل کی چھتوں والا محل کا ایک بڑا حصہ درختوں سے ڈھکی پہاڑی پر کھڑے ہیں، نیچی گرم دھوپ سے روشن، صاف آسمان تلے۔"
  fr: "Des tours carrées de pierre rougeâtre à créneaux et un grand corps de palais aux toits de tuiles se dressent sur une colline boisée, éclairés par une lumière chaude et basse, sous un ciel dégagé."
  es: "Torres cuadradas de piedra rojiza con almenas y un gran bloque de palacio con tejados de teja se alzan sobre una colina arbolada, iluminados por una luz cálida y baja, bajo un cielo despejado."
  tr: "Mazgallı kare, kırmızımsı taş kuleler ve kiremit çatılı büyük bir saray bloğu, ağaçlıklı bir tepenin üzerinde duruyor; alçak, sıcak güneş ışığıyla aydınlanmış, açık bir gökyüzünün altında."
  id: "Menara-menara persegi dari batu kemerahan dengan gigi benteng dan satu blok istana besar beratap genteng berdiri di atas bukit berhutan, disinari cahaya matahari hangat yang rendah, di bawah langit cerah."
