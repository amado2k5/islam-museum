  ar: "تُظهر الصورة جزءًا من قصر الحمراء في غرناطة: أبراج ومبانٍ مائلة إلى الحمرة على تلّها فوق الأشجار. صورة التقطها Jebulon في 4 أغسطس 2012، من ويكيميديا كومنز، بترخيص CC0."
  en: "The photograph shows part of the Alhambra in Granada: reddish towers and palace buildings on their hill above the trees. Photograph by Jebulon, 4 August 2012, on Wikimedia Commons, licensed CC0."
