  fr: "La photographie montre une partie de l'Alhambra à Grenade : des tours rougeâtres et des bâtiments du palais sur leur colline au-dessus des arbres. Photographie : Jebulon, 4 août 2012, sur Wikimedia Commons, sous licence CC0."
  es: "La fotografía muestra una parte de la Alhambra en Granada: torres rojizas y edificios del palacio en su colina sobre los árboles. Fotografía de Jebulon, 4 de agosto de 2012, en Wikimedia Commons, con licencia CC0."
  tr: "Fotoğraf, Gırnata'daki Elhamra'nın bir bölümünü gösteriyor: kırmızımsı kuleler ve saray yapıları, tepelerinde ağaçların üzerinde yükseliyor. Fotoğraf: Jebulon, 4 Ağustos 2012; Wikimedia Commons, CC0 lisansı."
  id: "Foto ini menampilkan sebagian Alhambra di Granada: menara-menara kemerahan dan bangunan istana di atas bukitnya, menjulang di atas pepohonan. Foto oleh Jebulon, 4 Agustus 2012, di Wikimedia Commons, berlisensi CC0."
