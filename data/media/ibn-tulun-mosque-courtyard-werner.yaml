  ar: "صحن مسجد واسع خالٍ تحت سماء زرقاء، تتوسطه فسقية حجرية مربعة تعلوها قبة، وتحيط به أروقة ذات عقود مدببة. هذه صورة المسجد وليست المستشفى."
  en: "A broad empty mosque courtyard under a blue sky, with a square domed stone fountain pavilion in the centre and pointed-arch arcades on the sides. This is the mosque, not the hospital."
