summary:
  ar: "صورة برتولد فيرنر لجامع ابن طولون بالقاهرة في 4 نوفمبر 2010، بترخيص CC BY 3.0. الصحن والقباب والأروقة للمسجد الباقي، وليست بقايا للمستشفى الذي يقول المقريزي إنه دثر."
  en: "Berthold Werner's photograph of the Mosque of Ibn Tulun in Cairo, 4 November 2010, CC BY 3.0. The courtyard, domes and arcades belong to the surviving mosque, not remnants of the hospital that al-Maqrizi says had disappeared."
  ur: "برتھولڈ ورنر کی 4 نومبر 2010ء کی مسجد ابن طولون، قاہرہ کی تصویر، CC BY 3.0۔ صحن، گنبد اور محرابی برآمدے باقی مسجد کے ہیں، اس شفاخانے کے آثار نہیں جسے مقریزی مٹ چکا بتاتے ہیں۔"
  es: "Fotografía de Berthold Werner de la Mezquita de Ibn Tulun en El Cairo, 4 de noviembre de 2010, CC BY 3.0. El patio, las cúpulas y las arcadas pertenecen a la mezquita que aún se conserva, no a los restos del hospital que, según al-Maqrizi, había desaparecido."
  fr: "Photographie de Berthold Werner de la mosquée d'Ibn Tulun au Caire, 4 novembre 2010, CC BY 3.0. La cour, les dômes et les arcades appartiennent à la mosquée survivante, et non aux vestiges de l'hôpital qu'al-Maqrizi dit avoir disparu."
  tr: "Berthold Werner'in 4 Kasım 2010'da Kahire'de çektiği İbn Tulun Camii fotoğrafı, CC BY 3.0 lisansı altında yayınlanmıştır. Avlu, kubbeler ve kemerli geçitler, El-Makrizi'nin ortadan kaybolduğunu söylediği hastanenin kalıntıları değil, caminin günümüze kalan kısmına aittir."
  id: "Foto Masjid Ibn Tulun di Kairo karya Berthold Werner pada 4 November 2010, berlisensi CC BY 3.0. Halaman, kubah, dan arkade adalah bagian dari masjid yang tersisa, bukan sisa-sisa rumah sakit yang menurut al-Maqrizi telah lenyap."
