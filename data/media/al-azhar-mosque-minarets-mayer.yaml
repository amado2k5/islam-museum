alt:
  ar: "مآذن حجرية عدة مختلفة الأشكال، إحداها برأسين، ترتفع بجانب قباب مضلّعة فوق سور ذي شرفات، وأمامها أشجار وأعمدة إنارة تحت سماء باهتة."
  en: "Several stone minarets of different shapes, one with a double top, rise beside ribbed domes above a crenellated wall; trees and street lamps stand in front under a pale sky."
  ur: "مختلف شکلوں کے کئی پتھر کے مینار، جن میں ایک دو سروں والا ہے، دھاری دار گنبدوں کے برابر کنگرے دار دیوار کے اوپر بلند ہیں؛ سامنے درخت اور بجلی کے کھمبے ہیں، ہلکے آسمان تلے۔"
  fr: "Plusieurs minarets de pierre de formes différentes, l'un à double sommet, s'élèvent à côté de coupoles nervurées au-dessus d'un mur crénelé ; des arbres et des lampadaires se dressent devant, sous un ciel pâle."
  es: "Varios minaretes de piedra de formas distintas, uno de ellos con una cima doble, se elevan junto a cúpulas acanaladas sobre un muro almenado; delante hay árboles y farolas, bajo un cielo pálido."
  tr: "Biri çift başlı, farklı biçimlerde birkaç taş minare, mazgallı bir duvarın üzerinde kaburgalı kubbelerin yanında yükseliyor; önde ağaçlar ve sokak lambaları duruyor, soluk bir gökyüzünün altında."
  id: "Beberapa menara batu dengan bentuk berbeda, salah satunya berpuncak ganda, menjulang di samping kubah beralur di atas dinding bergerigi; pepohonan dan lampu jalan berdiri di depannya, di bawah langit pucat."
