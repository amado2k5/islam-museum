label:
  ar: "صورة: افتتاح وقفية خاصكي خرّم سلطان، إسطنبول، 964هـ/1556–1557م (متحف الآثار التركية والإسلامية 2192)"
  en: "Photo: the opening of the endowment deed (waqfiyya) of Haseki Hürrem Sultan, Istanbul, 964/1556–57 (Turkish and Islamic Arts Museum 2192)"
  ur: "تصویر: خاصکی خرم سلطان کی وقفیہ (وقف نامہ) کا آغاز، استنبول، 964ھ/1556–57ء (ترک و اسلامی فنون کا عجائب گھر 2192)"
summary:
  ar: "صفحتان مذهّبتان من أول وقفية خاصكي خرّم سلطان، زوجة السلطان سليمان القانوني، كُتبت في إسطنبول سنة 964هـ (1556–1557م)، وهي محفوظة في متحف الآثار التركية والإسلامية بإسطنبول برقم 2192. والوقفية هي الصك الذي يسجل فيه الواقف ماله الموقوف وشروطه ووجوه صرف غلّته. وتذكر موسوعة TDV أن خرّم سلطان بنت في القدس سنة 1551 عمارة يأكل فيها الفقراء والأغنياء {cite:tdv-vakif §history}. ولا يقول المصدر المقروء أي أوقافها يسجل هذا الصك بعينه."
  en: "Two illuminated pages from the opening of the endowment deed of Haseki Hürrem Sultan, wife of Sultan Süleyman the Magnificent, written in Istanbul in 964 AH (1556–57) and kept in the Turkish and Islamic Arts Museum, Istanbul, inv. 2192. A waqfiyya is the deed in which a founder records the endowed property, its conditions and the purposes its yield serves. The TDV encyclopedia says Hürrem Sultan built a soup kitchen in Jerusalem in 1551 where the rich ate as well as the poor {cite:tdv-vakif §history}. The source read does not say which of her endowments this deed records."
  ur: "خاصکی خرم سلطان، سلطان سلیمان قانونی کی اہلیہ، کی وقفیہ کے آغاز کے دو مذہّب صفحات، جو استنبول میں 964ھ (1556–57ء) میں لکھی گئی اور استنبول کے ترک و اسلامی فنون کے عجائب گھر میں نمبر 2192 کے تحت محفوظ ہے۔ وقفیہ وہ دستاویز ہے جس میں واقف وقف شدہ مال، اس کی شرطیں اور اس کی آمدنی کے مصارف لکھتا ہے۔ ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ خرم سلطان نے 1551ء میں قدس میں ایک لنگر خانہ بنوایا جہاں غریبوں کے ساتھ امیر بھی کھانا کھاتے تھے {cite:tdv-vakif §history}۔ پڑھا گیا مأخذ یہ نہیں بتاتا کہ یہ دستاویز ان کے کس وقف کی ہے۔"
