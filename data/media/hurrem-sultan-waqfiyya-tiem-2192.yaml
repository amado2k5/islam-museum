alt:
  ar: "كتاب مفتوح على صفحتين بلون الرق. في الصفحة اليسرى إطار مذهّب فيه تسعة أسطر من الخط العربي الأسود على أرضية من السحب الذهبية. وفي الصفحة اليمنى ترويسة مزخرفة بالذهب والأزرق الداكن عليها زهور صغيرة وفوقها رؤوس أزهار رفيعة، وتحتها سبعة أسطر من الخط نفسه تبدأ بالحمد لله. وفي أسفل الصفحة اليمنى كلمة صغيرة بالحبر، وفي زاوية اليسرى العليا الرقم 2."
  en: "A book open at two parchment-coloured pages. The left page has a gilt-ruled frame holding nine lines of black Arabic script on a ground of gold cloud bands. The right page has a headpiece decorated in gold and deep blue with small flowers, topped by slender floral finials, and below it seven lines of the same script beginning with praise of God. A small catchword in ink sits at the foot of the right page, and the number 2 is pencilled in the top left corner."
  ur: "دو صفحوں پر کھلی ایک کتاب جن کا رنگ چرمی کاغذ جیسا ہے۔ بائیں صفحے پر سنہری لکیروں کا ایک فریم ہے جس میں سنہری بادل نما پٹیوں کے پس منظر پر سیاہ عربی خط کی نو سطریں ہیں۔ دائیں صفحے پر سونے اور گہرے نیلے رنگ سے سجا ایک سرنامہ ہے جس پر چھوٹے پھول ہیں اور اوپر پتلے پھول دار کلس ہیں، اور اس کے نیچے اسی خط کی سات سطریں ہیں جو اللہ کی حمد سے شروع ہوتی ہیں۔ دائیں صفحے کے نیچے روشنائی سے ایک چھوٹا لفظ ہے، اور بائیں صفحے کے اوپری کونے میں عدد 2 لکھا ہے۔"
