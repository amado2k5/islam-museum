label:
  ar: "صورة: صفحة من مخطوط «تنقيح المناظر» لكمال الدين الفارسي"
  en: "Image: a page of the manuscript of Kamal al-Din al-Farisi's Tanqih al-Manazir"
  ur: "تصویر: کمال الدین فارسی کی «تنقیح المناظر» کے مخطوطے کا ایک صفحہ"
summary:
  ar: "كتب كمال الدين الفارسي «تنقيح المناظر» بإشارة أستاذه قطب الدين الشيرازي، فأعاد فيه كتابة «كتاب المناظر» لابن الهيثم وشرحه وأكمله واعترض عليه، وطُبع في حيدر آباد سنة 1348هـ {cite:manazir-sabra-1983 pp. 44–46}. ويصف موقع ويكيميديا كومنز هذه الصفحة بأنها من نسخة المؤلف بخطه. وهي لا تصوّر البيت المظلم نفسه، بل الكتاب الذي حمل تجارب ابن الهيثم في الضوء إلى من بعده. منشورة على ويكيميديا كومنز برخصة CC BY-SA 3.0."
  en: "Kamal al-Din al-Farisi wrote the Tanqih al-Manazir at the suggestion of his teacher Qutb al-Din al-Shirazi, rewriting Ibn al-Haytham's Kitab al-Manazir with explanations, completions and objections; it was printed at Hyderabad in 1348 AH {cite:manazir-sabra-1983 pp. 44–46}. Wikimedia Commons describes this page as from the author's own autograph copy. It does not show the dark room itself but the book that carried Ibn al-Haytham's experiments on light to later readers. On Wikimedia Commons under CC BY-SA 3.0."
  ur: "کمال الدین فارسی نے «تنقیح المناظر» اپنے استاد قطب الدین شیرازی کے کہنے پر لکھی، جس میں انہوں نے ابن الہیثم کی «کتاب المناظر» کو وضاحتوں، تکملوں اور اعتراضات کے ساتھ دوبارہ لکھا؛ یہ 1348ھ میں حیدرآباد میں چھپی {cite:manazir-sabra-1983 pp. 44–46}۔ ویکی میڈیا کامنز اس صفحے کو مصنف کے اپنے ہاتھ کے لکھے نسخے کا بتاتا ہے۔ یہ خود تاریک کمرے کو نہیں دکھاتا بلکہ اس کتاب کو جس نے ابن الہیثم کے روشنی کے تجربات بعد کے قارئین تک پہنچائے۔ ویکی میڈیا کامنز پر CC BY-SA 3.0 کے تحت۔"
