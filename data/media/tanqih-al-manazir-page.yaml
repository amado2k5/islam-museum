alt:
  ar: "صفحة مخطوط طويلة بخط النسخ العربي بالحبر الأسود داخل إطار مسطّر بالذهبي والأحمر على ورق كريمي اللون. وفي وسطها شكل هندسي بالحبر البني المحمر: خط أفقي تلتقي عليه خطوط عند نقطة، وعلى أطرافه حروف، وهو شكل في انعطاف الضوء. وقرب أسفل الصفحة كلمة بالحبر الأحمر."
  en: "A tall manuscript page of Arabic naskh script in black ink inside a ruled gold-and-red frame on cream paper. In the middle is a geometric figure in red-brown ink: a horizontal line with other lines meeting at a point on it, labelled with letters, a diagram of the bending of light. Near the bottom of the page one word is written in red ink."
  ur: "کریمی رنگ کے کاغذ پر سنہری اور سرخ لکیروں والے حاشیے کے اندر سیاہ روشنائی میں عربی نسخ خط کا ایک لمبا مخطوطہ صفحہ۔ درمیان میں سرخی مائل بھوری روشنائی میں ایک ہندسی شکل ہے: ایک افقی لکیر جس پر دوسری لکیریں ایک نقطے پر ملتی ہیں، حروف کے نشانات کے ساتھ، جو روشنی کے مڑنے کی شکل ہے۔ صفحے کے نیچے کے قریب ایک لفظ سرخ روشنائی میں لکھا ہے۔"
