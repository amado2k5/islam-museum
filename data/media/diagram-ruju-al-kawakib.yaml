label:
  ar: "من فلك التدوير إلى شرح الرجوع"
  en: "From the epicycle to the explanation of retrogression"
  ur: "فلکِ تدویر سے رجوع کی وضاحت تک"
  es: "Del epiciclo a la explicación de la regresión"
summary:
  ar: "سلسلة تعليمية تبين أن الفرغاني يشرح رجوع الكواكب الخمسة بتركيب حركتها على فلك التدوير مع حركة مركزه على الفلك الحامل؛ لا تنسب ابتكار النموذج."
  en: "Teaching chain showing al-Farghani's explanation of the five planets' retrogression by composing their motion on the epicycle with the motion of its centre on the carrying circle; it does not claim the model's invention."
  ur: "تدریسی سلسلہ جو الفرغانی کی پانچ سیاروں کے رجوع کی وضاحت دکھاتا ہے — ان کی حرکت فلکِ تدویر پر اور اس کے مرکز کی حرکت حامل دائرے پر — ملانے سے؛ یہ ماڈل کی ایجاد کا دعویٰ نہیں کرتا۔"
  es: "Cadena didáctica que muestra la explicación de al-Farghani sobre la retrogradación de los cinco planetas mediante la composición de su movimiento en el epiciclo con el movimiento de su centro en el círculo portador; no se atribuye la invención del modelo."
