alt:
  ar: "الكوكب يجري على فلك التدوير إلى المغرب بينما يدور مركز الفلك إلى المشرق؛ إذا غلبت حركة الكوكب على حركة المركز بدا راجعاً في فلك البروج، وأعظم رجوعاً عند الحضيض."
  en: "The planet runs westward on its epicycle while the epicycle's centre travels eastward; when the planet's own motion outweighs the centre's, it appears to move backward along the zodiac, most strongly at perigee."
  ur: "سیارہ اپنے فلکِ تدویر پر مغرب کی طرف چلتا ہے جبکہ اس کا مرکز مشرق کی طرف سفر کرتا ہے؛ جب سیارے کی اپنی حرکت مرکز کی حرکت پر غالب آتی ہے تو وہ بروج میں پیچھے جاتا نظر آتا ہے، حضیض کے قریب سب سے زیادہ۔"
