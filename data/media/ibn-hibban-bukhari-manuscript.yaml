  ar: "نسخة كاملة معروفة من صحيح البخاري تعود إلى نحو سنة 1000م، محفوظة في مكتبة كادبوري ببرمنغهام، صدرت طبعتها المصورة على كومنز برخصة الملك العام؛ شاهد سياقي على تقليد كتب الحديث المصنفة لا نسخة من كتاب ابن حبان."
  en: "A known complete copy of Sahih al-Bukhari dated to about 1000 CE, held at Birmingham's Cadbury Research Library; its scanned edition is on Commons under CC0. A contextual witness to the classified-hadith-book tradition, not a copy of Ibn Hibban's work."
