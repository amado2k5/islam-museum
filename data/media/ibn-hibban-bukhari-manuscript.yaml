summary:
  ar: "نسخة كاملة معروفة من صحيح البخاري تعود إلى نحو سنة 1000م، محفوظة في مكتبة كادبوري ببرمنغهام، صدرت طبعتها المصورة على كومنز برخصة الملك العام؛ شاهد سياقي على تقليد كتب الحديث المصنفة لا نسخة من كتاب ابن حبان."
  en: "A known complete copy of Sahih al-Bukhari dated to about 1000 CE, held at Birmingham's Cadbury Research Library; its scanned edition is on Commons under CC0. A contextual witness to the classified-hadith-book tradition, not a copy of Ibn Hibban's work."
  ur: "صحیح بخاری کی ایک معلوم مکمل نقل جو تقریباً 1000ء کی ہے، برمنگھم کی کادبوری ریسرچ لائبریری میں محفوظ؛ اس کا مصور نسخہ کومنز پر CC0 ہے۔ درجہ بند حدیثی کتابوں کی روایت کا سیاقی گواہ، ابن حبان کی کتاب کی نقل نہیں۔"
  es: "Se conserva una copia completa conocida del Sahih al-Bukhari, datada alrededor del año 1000 d. C., en la Biblioteca de Investigación Cadbury de Birmingham; su edición digitalizada está disponible en Wikimedia Commons bajo licencia CC0. Se trata de un testimonio contextual de la tradición de los libros de hadices clasificados, no una copia de la obra de Ibn Hibban."
  fr: "Un exemplaire complet connu du Sahih al-Bukhari, daté d'environ l'an 1000, est conservé à la bibliothèque de recherche Cadbury de Birmingham; sa version numérisée est disponible sur Wikimedia Commons sous licence CC0. Il s'agit d'un témoignage contextuel de la tradition des recueils de hadiths classifiés, et non d'une copie de l'œuvre d'Ibn Hibban."
