"label":
  "ar": "خط ديواني على هيئة سفينة لمحمد عزت الكركوكي"
  "en": "Diwani calligraphy in the shape of a boat by Mehmet Izzet al-Karkuki"
  "ur": "کشتی کی شکل میں دیوانی خطاطی، محمد عزت کرکوکی"
  "es": "Caligrafía Diwani con forma de barco, obra de Mehmet Izzet al-Karkuki."
  "fr": "Calligraphie Diwani en forme de bateau par Mehmet Izzet al-Karkuki"
  "tr": "Muhammed İzzat el-Karkuki tarafından gemi şeklinde tasarlanmış Divan yazısı."
  "id": "Naskah Diwani berbentuk kapal karya Muhammad Izzat al-Karkuki"
"summary":
  "ar": "نسخة مصوّرة، تنسبها صفحة الملف إلى كتاب غابرييل ماندل عن الأبجدية العربية، لخط عربي بأسلوب الديواني يتشكل على هيئة سفينة، لمحمد عزت الكركوكي، ١٨٤١ إلى ١٩٠٤م. تخدم مثالًا على الديواني، الخط المتشابك المتراص لديوان السلطنة العثمانية، تصعد فيه الكلمات قليلًا نحو آخر السطر. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A reproduction, credited on the file page to Gabriele Mandel's book on the Arabic alphabet, of Arabic calligraphy in the Diwani style forming the shape of a boat, by Mehmet Izzet al-Karkuki, 1841 to 1904. It serves as an example of Divani, the dense, interlaced chancery hand of the Ottoman court, in which words rise slightly toward the line's end. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "گابریل مینڈل کی عربی ابجد کی کتاب سے، جیسا فائل کا صفحہ بتاتا ہے، کشتی کی شکل بناتی ہوئی دیوانی طرز کی عربی خطاطی کی نقل، محمد عزت کرکوکی، ۱۸۴۱ تا ۱۹۰۴ء۔ یہ دیوانی کی مثال ہے، عثمانی دیوان کا گھنا اور باہم گتھا ہوا خط جس میں الفاظ سطر کے آخر کی طرف ذرا اوپر اٹھتے ہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Reproducción, atribuida en la página del archivo al libro de Gabriele Mandel sobre el alfabeto árabe, de una caligrafía árabe en estilo Diwani que forma la figura de un barco, obra de Mehmet Izzet al-Karkuki, 1841-1904. Sirve como ejemplo de Diwani, la densa y entrelazada caligrafía cancilleresca de la corte otomana, en la que las palabras se elevan ligeramente hacia el final del verso. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Reproduction, attribuée à l'ouvrage de Gabriele Mandel sur l'alphabet arabe, d'une calligraphie arabe de style diwani, représentant une barque, par Mehmet Izzet al-Karkuki (1841-1904). Elle illustre le diwani, l'écriture de chancellerie dense et entrelacée de la cour ottomane, où les mots s'élèvent légèrement vers la fin du trait. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Dosya sayfasında Gabriel Mandel'in Arap alfabesi üzerine yazdığı kitaba atfedilen bir fotoğraf, Muhammed İzzat el-Karkuki (1841-1904) tarafından Divani tarzında yazılmış gemi biçimli bir Arap yazısını göstermektedir. Bu, Osmanlı Sultanlığı'nın yazı işleri dairesinde kullanılan, kelimelerin satır sonuna doğru hafifçe yükseldiği, iç içe geçmiş el yazısı olan Divani'nin bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Salinan fotografis, yang menurut halaman berkas tersebut berasal dari buku Gabriel Mandel tentang alfabet Arab, menggambarkan aksara Arab berbentuk kapal dalam gaya Diwani karya Muhammad Izzat al-Karkuki (1841-1904). Gambar ini berfungsi sebagai contoh Diwani, yaitu aksara kursif dan saling terkait dari kantor pemerintahan Kesultanan Utsmaniyah, di mana kata-kata sedikit menanjak ke arah akhir baris. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
