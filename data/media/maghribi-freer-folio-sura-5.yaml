  "ar": "ورقة منفصلة من مصحف بخط مغربي بنيّ، القرن الثالث عشر، معرض فرير"
  "en": "Detached Qur'an folio in brown Maghribi script, 13th century, Freer Gallery"
  "ur": "الگ شدہ مصحفی ورق، بھورا مغربی خط، تیرھویں صدی، فریر گیلری"
"summary":
  "ar": "صورة لورقة منفصلة من مصحف مفرّق، معرض فرير F1929.69، فيها الآيتان ١٢ و١٣ من سورة المائدة، تصفها صفحة الملف بأنها بخط مغربي بنيّ، جنوب إسبانيا أو شمال أفريقيا، القرن الثالث عشر. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a detached folio from a dispersed Qur'an, Freer Gallery of Art F1929.69, with sura 5, verses 12 to 13, which the file page describes as Arabic in brown Maghribi script, southern Spain or North Africa, 13th century. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک بکھرے ہوئے مصحف کے الگ شدہ ورق، فریر گیلری F1929.69، کی تصویر جس میں سورۂ مائدہ کی آیات ۱۲ اور ۱۳ ہیں، جسے فائل کا صفحہ بھورے مغربی خط میں، جنوبی ہسپانیہ یا شمالی افریقہ، تیرھویں صدی، بتاتا ہے۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
