"summary":
  "ar": "صورة لورقة من معرض فرير ومعرض آرثر ساكلر، تؤرخها صفحة الملف بنحو ١٥٤٠م وتنسبها إلى كمال الدين المتوفى سنة ٩٧٤هـ. وتقول الصفحة إنها مكتوبة بخط يُعرف بالتعليق، أي المعلّق، ويتميز بسيولة كبيرة تخفي قواعد صارمة، وكان محبّبًا خاصةً في نسخ الشعر الفارسي بعد القرن الخامس عشر في إيران والهند. تخدم مثالًا على التعليق، الخط الديواني «المعلّق» الذي استُعمل في المراسيم والوثائق لا في المصاحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio from the Freer Gallery of Art and Arthur M. Sackler Gallery, dated by the file page to about 1540 and credited to Kamal al-Din, who died in 974 AH. The file page says it is written in a script known as ta'liq, or 'hanging', notable for its great fluidity, which belies strict rules, and particularly favoured for copying Persian poetry after the fifteenth century in Iran and India. It serves as an example of Ta'liq, the 'hanging' chancery hand used for decrees and documents rather than for the Qur'an. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "فریر گیلری آف آرٹ اور آرتھر ایم سیکلر گیلری کے ایک ورق کی تصویر جسے فائل کا صفحہ تقریباً ۱۵۴۰ء کا بتاتا ہے اور کمال الدین، متوفی ۹۷۴ھ، سے منسوب کرتا ہے۔ صفحہ کہتا ہے کہ یہ تعلیق، یعنی «معلّق»، نامی خط میں لکھا ہے جو اپنی بے پناہ روانی کے لیے مشہور ہے جو سخت قواعد کو چھپاتی ہے، اور پندرھویں صدی کے بعد ایران اور ہندوستان میں فارسی شاعری کی نقل کے لیے خاص طور پر پسند کیا گیا۔ یہ تعلیق کی مثال ہے، وہ «معلّق» دفتری خط جو فرامین اور دستاویزات میں استعمال ہوا، مصاحف میں نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio de la Galería de Arte Freer y la Galería Arthur M. Sackler, fechado en la página del archivo alrededor de 1540 y atribuido a Kamal al-Din, quien falleció en el año 974 de la Hégira. La página del archivo indica que está escrito en una escritura conocida como ta'liq, o «colgante», que destaca por su gran fluidez, la cual contradice las reglas estrictas, y que fue particularmente utilizada para copiar poesía persa después del siglo XV en Irán e India. Sirve como ejemplo de ta'liq, la escritura cancilleresca «colgante» utilizada para decretos y documentos, no para el Corán. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un folio provenant de la Freer Gallery of Art et de l'Arthur M. Sackler Gallery, daté d'environ 1540 selon la fiche descriptive et attribué à Kamal al-Din, décédé en 974 AH. La fiche indique qu'il est écrit en ta'liq, ou « écriture suspendue », remarquable par sa grande fluidité, qui masque des règles strictes, et particulièrement prisé pour la copie de la poésie persane après le XVe siècle en Iran et en Inde. Ce document sert d'exemple de ta'liq, l'écriture de chancellerie « suspendue » utilisée pour les décrets et les documents officiels, et non pour le Coran. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Freer ve Arthur Sackler Galerisi'nden, yaklaşık 1540 yılına tarihlenen ve 974 Hicri yılında vefat eden Kemal al-Din'e atfedilen bir belgenin fotoğrafı. Belgede, \"Ta'lik\" olarak bilinen ve \"askıda\" anlamına gelen, akıcılığıyla katı kuralları gizleyen bir yazı türüyle yazıldığı belirtiliyor. Bu yazı türü, özellikle 15. yüzyıldan sonra İran ve Hindistan'da Fars şiirlerinin kopyalanmasında tercih edilmiştir. Bu belge, Ta'lik yazısının, özellikle de Kur'an'da değil, hükümler ve belgeler için kullanılan Divani yazısının bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto sebuah dokumen dari Galeri Freer dan Arthur Sackler, bertanggal sekitar 1540 M dan dikaitkan dengan Kamal al-Din, yang meninggal pada tahun 974 H. Dokumen tersebut menyatakan bahwa dokumen itu ditulis dalam aksara yang dikenal sebagai Ta'liq, yang berarti \"tergantung,\" yang dicirikan oleh fluiditasnya yang mengaburkan aturan-aturan ketat. Aksara ini sangat disukai untuk menyalin puisi Persia setelah abad ke-15 di Iran dan India. Foto ini berfungsi sebagai contoh Ta'liq, khususnya aksara Diwani yang digunakan untuk dekrit dan dokumen, tetapi bukan untuk Al-Qur'an. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
