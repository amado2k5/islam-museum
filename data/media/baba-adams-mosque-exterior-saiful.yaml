summary:
  ar: "تُظهر الصورة الواجهة الآجرية الحمراء لمسجد بابا آدم في رامبال في بنغلاديش، بفتحاتها الثلاث المعقودة. صورة التقطها Md Saiful Islam Khan في 26 ديسمبر 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the red brick front of the Mosque of Baba Adam at Rampal in Bangladesh, with its three arched openings. Photograph by Md Saiful Islam Khan, 26 December 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں بنگلہ دیش میں رامپال کی مسجد بابا آدم کا سرخ اینٹوں کا سامنے کا رخ دکھائی دیتا ہے، جس میں تین محرابی روزن ہیں۔ تصویر: Md Saiful Islam Khan، 26 دسمبر 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la façade de brique rouge de la mosquée de Baba Adam à Rampal, au Bangladesh, avec ses trois ouvertures en arc. Photographie : Md Saiful Islam Khan, 26 décembre 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la fachada de ladrillo rojo de la mezquita de Baba Adam en Rampal, en Bangladés, con sus tres vanos en arco. Fotografía de Md Saiful Islam Khan, 26 de diciembre de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Bangladeş'teki Rampal'da bulunan Baba Adam Camii'nin kırmızı tuğla cephesini, üç kemerli açıklığıyla gösteriyor. Fotoğraf: Md Saiful Islam Khan, 26 Aralık 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan bagian depan bata merah Masjid Baba Adam di Rampal, Bangladesh, dengan tiga bukaan berlengkung. Foto oleh Md Saiful Islam Khan, 26 Desember 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
