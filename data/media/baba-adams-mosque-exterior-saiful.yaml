depicts: [building/baba-adams-mosque]
alt:
  ar: "مسجد مستطيل منخفض من آجر أحمر قديم له أبراج صغيرة في الأركان وأشرطة بارزة وثلاث فتحات بعقود مدببة عليها مشبّكات خضراء، وعند الدرج الأوسط شخص منحنٍ، وخلفه أشجار."
  en: "A low rectangular mosque of weathered red brick with corner turrets, moulded bands and three pointed-arch openings fitted with green grilles; a person bends at the central steps, and trees rise behind."
  ur: "پرانی سرخ اینٹوں کی ایک پست مستطیل مسجد جس میں کونوں پر چھوٹے برج، ابھری ہوئی پٹیاں اور سبز جالیوں والے تین نوکیلی محراب والے روزن ہیں؛ درمیانی سیڑھیوں پر ایک شخص جھکا ہوا ہے، اور پیچھے درخت بلند ہیں۔"
  fr: "Une mosquée rectangulaire basse de brique rouge patinée, avec des tourelles d'angle, des bandeaux moulurés et trois ouvertures à arc brisé munies de grilles vertes ; une personne se penche près des marches centrales, et des arbres s'élèvent derrière."
  es: "Una mezquita rectangular baja de ladrillo rojo desgastado con torrecillas en las esquinas, bandas moldeadas y tres vanos de arco apuntado con rejas verdes; una persona se inclina junto a los escalones centrales, y detrás se alzan árboles."
  tr: "Köşelerinde küçük kuleler, pervazlı şeritler ve yeşil parmaklıklı üç sivri kemerli açıklığı olan, yıpranmış kırmızı tuğladan alçak dikdörtgen bir cami; orta basamaklarda bir kişi eğilmiş, arkada ağaçlar yükseliyor."
  id: "Masjid persegi panjang rendah dari bata merah lapuk dengan menara kecil di sudut-sudutnya, pita-pita bermolding, dan tiga bukaan berlengkung runcing yang dipasangi terali hijau; seseorang membungkuk di tangga tengah, dan pepohonan menjulang di belakangnya."
