summary:
  ar: "تُظهر الصورة بوابة آجرية أثرية يحفّ بها برجان مستديران في موقع مدينة واسط الأثرية. صورة التقطها Ahmed Mahdi Salih في 13 سبتمبر 2018، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows a ruined brick gateway flanked by two round towers at the archaeological site of Wasit. Photograph by Ahmed Mahdi Salih, 13 September 2018, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں واسط کے اثری شہر کے مقام پر اینٹوں کا ایک اثری دروازہ دکھائی دیتا ہے جس کے دونوں جانب دو گول برج ہیں۔ تصویر: Ahmed Mahdi Salih، 13 ستمبر 2018ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre une porte de brique en ruine flanquée de deux tours rondes sur le site archéologique de Wasit. Photographie : Ahmed Mahdi Salih, 13 septembre 2018, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra una puerta de ladrillo en ruinas flanqueada por dos torres redondas en el yacimiento arqueológico de Wasit. Fotografía de Ahmed Mahdi Salih, 13 de septiembre de 2018, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Vasıt antik kenti kazı alanında iki yuvarlak kulenin kuşattığı tuğladan tarihî bir kapıyı gösteriyor. Fotoğraf: Ahmed Mahdi Salih, 13 Eylül 2018; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan gerbang bata bersejarah yang diapit dua menara bundar di situs arkeologi kota Wasit. Foto oleh Ahmed Mahdi Salih, 13 September 2018, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
