depicts: [place/wasit]
alt:
  ar: "بوابة عالية متهدمة من الآجر المشوي بعقد مدبب بين برجين مستديرين تزينهما زخارف هندسية بالآجر، قائمة بين بقايا جدران منخفضة على أرض جافة تحت سماء زرقاء داكنة."
  en: "A tall ruined gateway of baked brick with a pointed arch set between two round towers decorated with geometric brick patterns, standing among low wall remains on dry ground under a deep blue sky."
  ur: "پختہ اینٹوں کا ایک بلند شکستہ دروازہ جس میں نوکیلی محراب دو گول برجوں کے بیچ ہے، جنہیں اینٹوں کے ہندسی نقوش سے سجایا گیا ہے، خشک زمین پر دیواروں کے پست باقیات کے بیچ، گہرے نیلے آسمان تلے۔"
  fr: "Une haute porte en ruine de brique cuite, avec un arc brisé entre deux tours rondes ornées de motifs géométriques en brique, se dresse parmi de bas vestiges de murs sur un sol sec, sous un ciel bleu profond."
  es: "Una alta puerta en ruinas de ladrillo cocido, con un arco apuntado entre dos torres redondas decoradas con motivos geométricos de ladrillo, se alza entre bajos restos de muros sobre suelo seco, bajo un cielo azul intenso."
  tr: "Pişmiş tuğladan, geometrik tuğla desenleriyle süslenmiş iki yuvarlak kule arasında sivri kemerli yüksek yıkık bir kapı, kuru zeminde alçak duvar kalıntılarının arasında duruyor, koyu mavi bir gökyüzünün altında."
  id: "Gerbang tinggi yang runtuh dari bata bakar dengan lengkung runcing di antara dua menara bundar yang dihiasi pola geometris dari bata, berdiri di antara sisa dinding rendah di tanah kering, di bawah langit biru tua."
