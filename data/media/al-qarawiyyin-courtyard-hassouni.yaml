summary:
  ar: "تُظهر الصورة صحن جامع القرويين في فاس من خلال عقد منقوش، وفيه جناح مسقوف بالقرميد الأخضر وخلفه المئذنة البيضاء. صورة التقطها Abdel Hassouni في 24 يونيو 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the courtyard of al-Qarawiyyin in Fez through a carved arch, with a pavilion roofed in green tiles and the white minaret behind. Photograph by Abdel Hassouni, 24 June 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں فاس میں جامع قرویین کا صحن ایک منقوش محراب کے آر پار دکھائی دیتا ہے، جس میں سبز کھپریل کی چھت والا ایک پویلین اور پیچھے سفید مینار ہے۔ تصویر: Abdel Hassouni، 24 جون 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la cour d'al-Qarawiyyin à Fès à travers un arc sculpté, avec un pavillon couvert de tuiles vertes et le minaret blanc derrière. Photographie : Abdel Hassouni, 24 juin 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el patio de al-Qarawiyyin en Fez a través de un arco tallado, con un pabellón cubierto de tejas verdes y el minarete blanco detrás. Fotografía de Abdel Hassouni, 24 de junio de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Fes'teki Karaviyyin'in avlusunu oyma bir kemerin arasından, yeşil kiremitle kaplı bir köşk ve arkadaki beyaz minareyle birlikte gösteriyor. Fotoğraf: Abdel Hassouni, 24 Haziran 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan halaman dalam Al-Qarawiyyin di Fes melalui lengkung berukir, dengan paviliun beratap genteng hijau dan menara putih di belakangnya. Foto oleh Abdel Hassouni, 24 Juni 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
