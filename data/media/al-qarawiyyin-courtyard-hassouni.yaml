depicts: [building/qarawiyyin]
alt:
  ar: "من خلال عقد منقوش قائم على أعمدة نحيلة: صحن مبلّط ببلاط مزخرف، وجناح صغير بسقف هرمي من القرميد الأخضر فوق نافورة، وأروقة بيضاء ومئذنة مربعة بيضاء تحت سماء غائمة."
  en: "Seen through a carved arch on slender columns: a courtyard paved with patterned tiles, a small pavilion with a green pyramidal tiled roof over a fountain, white arcades and a white square minaret under a cloudy sky."
  ur: "پتلے ستونوں پر ایک منقوش محراب کے آر پار دکھائی دیتا ہے: نقش دار ٹائلوں سے پختہ صحن، ایک فوارے کے اوپر سبز کھپریل کی اہرامی چھت والا چھوٹا پویلین، سفید برآمدے اور ایک سفید چوکور مینار، ابر آلود آسمان تلے۔"
  fr: "Vue à travers un arc sculpté sur de fines colonnes : une cour pavée de carreaux à motifs, un petit pavillon au toit pyramidal de tuiles vertes au-dessus d'une fontaine, des arcades blanches et un minaret carré blanc sous un ciel nuageux."
  es: "Visto a través de un arco tallado sobre columnas esbeltas: un patio pavimentado con azulejos con motivos, un pequeño pabellón con tejado piramidal de teja verde sobre una fuente, arcadas blancas y un minarete cuadrado blanco bajo un cielo nublado."
  tr: "İnce sütunlar üzerindeki oymalı bir kemerin arasından görülüyor: desenli çinilerle döşenmiş bir avlu, bir çeşmenin üzerinde yeşil kiremitli piramit çatılı küçük bir köşk, beyaz revaklar ve beyaz bir kare minare, bulutlu bir gökyüzünün altında."
  id: "Terlihat melalui lengkung berukir di atas tiang-tiang ramping: halaman berlantai ubin bermotif, paviliun kecil beratap genteng hijau berbentuk limas di atas air mancur, arkade putih, dan menara persegi putih di bawah langit berawan."
