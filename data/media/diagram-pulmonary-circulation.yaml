  tr: "Şema: Galen ve İbn el-Nafis'e göre kalbin iki tarafı arasındaki kan akış yolu"
  id: "Diagram: Jalur aliran darah antara kedua sisi jantung menurut Galen dan Ibn al-Nafis"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء: في الجانب الأول يعبر الدم الحاجز بين البطينين من مسامّ غير مرئية كما قال جالينوس، وفي الجانب الثاني يذهب من البطين الأيمن إلى الرئة ثم يعود إلى البطين الأيسر كما وصف ابن النفيس."
  en: "A simple schematic drawn by the site at build time. One side shows blood crossing the wall between the ventricles through invisible pores, as Galen taught; the other shows it going from the right ventricle to the lungs and back to the left ventricle, as Ibn al-Nafis described."
  ur: "سائٹ کی تعمیر کے وقت بننے والا ایک سادہ خاکہ۔ ایک طرف خون جالینوس کے قول کے مطابق نظر نہ آنے والے مساموں سے دونوں بطینوں کی درمیانی دیوار پار کرتا ہے، دوسری طرف ابن النفیس کے بیان کے مطابق دائیں بطین سے پھیپھڑوں میں جا کر بائیں بطین میں لوٹتا ہے۔"
  es: "Esquema sencillo dibujado por el sitio durante su construcción. Un lado muestra la sangre cruzando la pared entre los ventrículos a través de poros invisibles, como enseñó Galeno; el otro la muestra yendo del ventrículo derecho a los pulmones y de vuelta al ventrículo izquierdo, como describió Ibn al-Nafis."
  fr: "Un schéma simplifié dessiné par le chantier lors de sa construction. D'un côté, le sang traverse la paroi entre les ventricules par des pores invisibles, comme l'enseignait Galien; de l'autre, il passe du ventricule droit aux poumons puis retourne au ventricule gauche, comme le décrivait Ibn al-Nafis."
  tr: "Yapım sırasında site tarafından çizilen basit bir şema: Birinci tarafta, Galen'in dediği gibi, kan karıncıklar arasındaki septumu görünmez gözeneklerden geçer; ikinci tarafta ise İbn el-Nafis'in tarif ettiği gibi, sağ karıncıktan akciğere gider ve sonra sol karıncığa geri döner."
  id: "Diagram sederhana yang digambar di lokasi tersebut pada saat pembangunan: Pada sisi pertama, darah melintasi septum di antara ventrikel melalui pori-pori yang tak terlihat, seperti yang dikatakan Galen, dan pada sisi kedua, darah mengalir dari ventrikel kanan ke paru-paru dan kemudian kembali ke ventrikel kiri, seperti yang dijelaskan oleh Ibn al-Nafis."
