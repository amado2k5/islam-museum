summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء: في الجانب الأول يعبر الدم الحاجز بين البطينين من مسامّ غير مرئية كما قال جالينوس، وفي الجانب الثاني يذهب من البطين الأيمن إلى الرئة ثم يعود إلى البطين الأيسر كما وصف ابن النفيس."
  en: "A simple schematic drawn by the site at build time. One side shows blood crossing the wall between the ventricles through invisible pores, as Galen taught; the other shows it going from the right ventricle to the lungs and back to the left ventricle, as Ibn al-Nafis described."
  ur: "سائٹ کی تعمیر کے وقت بننے والا ایک سادہ خاکہ۔ ایک طرف خون جالینوس کے قول کے مطابق نظر نہ آنے والے مساموں سے دونوں بطینوں کی درمیانی دیوار پار کرتا ہے، دوسری طرف ابن النفیس کے بیان کے مطابق دائیں بطین سے پھیپھڑوں میں جا کر بائیں بطین میں لوٹتا ہے۔"
