label:
  ar: "رسم: طريق الدم بين جانبي القلب عند جالينوس وعند ابن النفيس"
  en: "Diagram: the blood's path between the two sides of the heart, after Galen and after Ibn al-Nafis"
  ur: "خاکہ: دل کے دونوں حصوں کے درمیان خون کا راستہ، جالینوس اور ابن النفیس کے مطابق"
  es: "Diagrama: el recorrido de la sangre entre los dos lados del corazón, según Galeno y según Ibn al-Nafis."
