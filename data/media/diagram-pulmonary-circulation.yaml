  ar: "رسمان متجاوران للقلب. في الأيمن: سهم يعبر الحاجز بين البطينين مباشرة، مكتوب عليه: جالينوس، مسامّ غير مرئية. في الأيسر: سهم يخرج من البطين الأيمن إلى الرئتين ويعود إلى البطين الأيسر، مكتوب عليه: ابن النفيس، عبر الرئة؛ والحاجز مصمت"
  en: "Two hearts side by side. Left: an arrow passes straight through the wall between the ventricles, labelled Galen, invisible pores. Right: an arrow leaves the right ventricle, goes to the lungs and returns to the left ventricle, labelled Ibn al-Nafis, through the lungs; the wall is solid"
