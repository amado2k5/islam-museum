alt:
  ar: "مسجد حجري كبير يُرى من أعلى: قبة مركزية واسعة وأربع مآذن نحيلة وصحن تحيط به قباب رمادية صغيرة، بين الأشجار، وخلفه مجرى مائي واسع ومدينة تحت سماء زرقاء."
  en: "A large stone mosque seen from above: a broad central dome, four slender minarets and a courtyard ringed by small grey domes, set among trees, with a wide waterway and a city under a blue sky behind."
  ur: "ایک بڑی پتھر کی مسجد اوپر سے دکھائی دیتی ہے: ایک وسیع مرکزی گنبد، چار پتلے مینار اور چھوٹے خاکستری گنبدوں سے گھرا صحن، درختوں کے بیچ، اور پیچھے ایک چوڑی آبی گزرگاہ اور نیلے آسمان تلے شہر۔"
  fr: "Une grande mosquée de pierre vue d'en haut : une large coupole centrale, quatre minarets élancés et une cour entourée de petites coupoles grises, au milieu des arbres, avec un large cours d'eau et une ville sous un ciel bleu à l'arrière."
  es: "Una gran mezquita de piedra vista desde arriba: una amplia cúpula central, cuatro minaretes esbeltos y un patio rodeado de pequeñas cúpulas grises, entre árboles, con un ancho curso de agua y una ciudad bajo un cielo azul al fondo."
  tr: "Yukarıdan görülen büyük bir taş cami: geniş bir ana kubbe, dört ince minare ve küçük gri kubbelerle çevrili bir avlu, ağaçların arasında; arkada geniş bir su yolu ve mavi gökyüzünün altında bir şehir."
  id: "Masjid batu besar yang terlihat dari atas: kubah tengah yang lebar, empat menara ramping, dan halaman dalam yang dikelilingi kubah-kubah kecil berwarna abu-abu, di antara pepohonan, dengan jalur air yang luas dan sebuah kota di bawah langit biru di belakangnya."
