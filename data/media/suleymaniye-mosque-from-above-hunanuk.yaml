summary:
  ar: "تُظهر الصورة جامع السليمانية في إسطنبول من أعلى، بمآذنه الأربع وصحنه المحاط بقباب صغيرة، وخلفه الماء والمدينة. صورة التقطها Hunanuk في 16 يوليو 2022، من ويكيميديا كومنز، بترخيص CC0."
  en: "The photograph shows the Süleymaniye Mosque in Istanbul from above, with its four minarets and its courtyard ringed by small domes, and the water and the city beyond. Photograph by Hunanuk, 16 July 2022, on Wikimedia Commons, licensed CC0."
  ur: "تصویر میں استنبول کی جامع سلیمانیہ اوپر سے دکھائی دیتی ہے، اس کے چاروں مینار اور چھوٹے گنبدوں سے گھرا صحن، اور پیچھے پانی اور شہر۔ تصویر: Hunanuk، 16 جولائی 2022ء، وکیمیڈیا کامنز سے، لائسنس CC0۔"
  fr: "La photographie montre la mosquée Süleymaniye à Istanbul vue d'en haut, avec ses quatre minarets et sa cour entourée de petites coupoles, et l'eau et la ville au loin. Photographie : Hunanuk, 16 juillet 2022, sur Wikimedia Commons, sous licence CC0."
  es: "La fotografía muestra la mezquita Süleymaniye en Estambul desde arriba, con sus cuatro minaretes y su patio rodeado de pequeñas cúpulas, y el agua y la ciudad al fondo. Fotografía de Hunanuk, 16 de julio de 2022, en Wikimedia Commons, con licencia CC0."
  tr: "Fotoğraf, İstanbul'daki Süleymaniye Camii'ni yukarıdan gösteriyor; dört minaresi ve küçük kubbelerle çevrili avlusu, arkasında da su ve şehir görünüyor. Fotoğraf: Hunanuk, 16 Temmuz 2022; Wikimedia Commons, CC0 lisansı."
  id: "Foto ini menampilkan Masjid Süleymaniye di Istanbul dari atas, dengan keempat menaranya dan halaman dalamnya yang dikelilingi kubah-kubah kecil, serta air dan kota di belakangnya. Foto oleh Hunanuk, 16 Juli 2022, di Wikimedia Commons, berlisensi CC0."
