"summary":
  "ar": "صورة لقطعة قرآنية من مكتبة الكونغرس تحوي السورة الأولى، الفاتحة، تذكر صفحة الملف أن خطها «نسخ» وتؤرخها بالقرن الرابع عشر أو الخامس عشر وتجعل مساحة الكتابة ١٥٫٤ في ١٥٫٥ سم. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress Qur'anic fragment containing the first chapter, al-Fatiha, which the file page lists as 'Script: naskh', dates to the 14th or 15th century and gives a written surface of 15.4 by 15.5 cm. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک قرآنی ٹکڑے کی تصویر جس میں پہلی سورت، الفاتحہ، ہے؛ فائل کا صفحہ اس کا خط «نسخ» لکھتا ہے، چودھویں یا پندرھویں صدی کا بتاتا ہے اور تحریری سطح ۱۵٫۴ ضرب ۱۵٫۵ سینٹی میٹر دیتا ہے۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Una fotografía de un fragmento coránico de la Biblioteca del Congreso que contiene el primer capítulo, al-Fatiha, catalogado en la página del archivo como «Escritura: naskh», data de los siglos XIV o XV y presenta una superficie escrita de 15,4 x 15,5 cm. Sirve como ejemplo de naskh, la letra cursiva pequeña y uniforme que se convirtió en la escritura habitual para copiar libros y pequeños mushafs. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Une photographie d'un fragment coranique de la Bibliothèque du Congrès contenant le premier chapitre, al-Fatiha, daté du XIVe ou XVe siècle et présentant une surface écrite de 15,4 x 15,5 cm, est disponible. Ce fragment, dont la fiche descriptive indique « écriture naskh », est un exemple d'écriture cursive petite et régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Sur Wikimedia Commons, le fichier est dans le domaine public."
