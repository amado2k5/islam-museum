"summary":
  "ar": "صورة لورقة تنسبها صفحة الملف إلى القرن الثامن وإلى المكتبة الوطنية الفرنسية، عربي ٣٣٤، الورقة ٣٢ وجه. وتصفها بأنها بخط حجازي، تفصل بين الآيات مجموعات من ثلاثة خطوط مائلة، وتدل دائرة تحيط بها خطوط على العشرات، ويُشار إلى الحركات بنقاط حمراء؛ وقد أُضيف لاحقًا في أسفلها عنوان السورة وعدد آياتها. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio that the file page assigns to the 8th century and to the Bibliothèque nationale de France, Arabe 334, f. 32r. The page describes it as written in Hijazi script; groups of three oblique lines separate the verses, a circle surrounded by lines marks groups of ten, and vocalisation is indicated by red dots. Later additions at the foot give the chapter title and verse count. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک ورق کی تصویر جسے فائل کا صفحہ آٹھویں صدی اور فرانسیسی قومی کتب خانے، عربی ۳۳۴، ورق ۳۲ رخ سے منسوب کرتا ہے۔ صفحہ اسے حجازی خط میں بتاتا ہے؛ آیتوں کے درمیان تین ترچھی لکیروں کے گروہ ہیں، لکیروں سے گھرا دائرہ دس کے گروہ کا نشان ہے، اور حرکات سرخ نقطوں سے ظاہر کی گئی ہیں؛ نیچے بعد میں سورت کا عنوان اور آیات کی تعداد بڑھائی گئی۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio que la página del archivo asigna al siglo VIII y a la Bibliothèque nationale de France, Arabe 334, f. 32r. La página lo describe como escrito en escritura hiyazí; grupos de tres líneas oblicuas separan los versos, un círculo rodeado de líneas marca grupos de diez, y la vocalización se indica con puntos rojos. Adiciones posteriores al pie indican el título del capítulo y el número de versos. Se muestra como un ejemplo temprano de la familia de escrituras hiyazí, cuyas letras se inclinan y cuyas marcas ortográficas son escasas, para que el lector pueda compararlo con las escrituras posteriores, más regulares. Es útil para comprender la historia de la puntuación y la vocalización: permite al lector ver, en una página real, cómo se añadieron marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'un folio daté du VIIIe siècle et conservé à la Bibliothèque nationale de France (Arabe 334, f. 32r). La fiche descriptive indique qu'il est écrit en écriture hijazi: les vers sont séparés par groupes de trois lignes obliques, des cercles cerclés de lignes marquent les groupes de dix, et la vocalisation est indiquée par des points rouges. Des ajouts ultérieurs en bas de page précisent le titre du chapitre et le nombre de vers. Ce folio est présenté comme un exemple ancien de la famille des écritures hijazi, caractérisées par des lettres inclinées et peu de signes orthographiques, permettant ainsi de le comparer aux écritures plus récentes et régulières. Il est utile pour comprendre l'évolution de la ponctuation et de la vocalisation: il permet d'observer, sur une seule page, comment les signes des voyelles brèves ont été ajoutés au squelette consonantique, d'abord sous forme de points colorés, puis de signes. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Resim, dosyada 8. yüzyıla ve Fransa Ulusal Kütüphanesi'ne ait olduğu belirtilen, Arapça 334, sayfa 32 numaralı bir belgeye aittir. Hicazi yazısıyla yazılmış olup, ayetler üç eğik çizgi grubuyla ayrılmış, onlukları gösteren çizgilerle çevrili bir daire ve kırmızı noktalarla belirtilen sesli harf işaretleri içermektedir. Surenin başlığı ve ayet sayısı daha sonra eklenmiştir. Eğik harfleri ve daha az diyakritik işaretiyle karakterize edilen Hicazi yazı ailesinin erken bir örneğini sunmaktadır; okuyucu bunu daha sonraki, daha düzenli yazılarla karşılaştırabilir. Diyakritik işaretlerin gelişimini açıklamakta faydalıdır: okuyucu, gerçek bir sayfada, sesli harf işaretlerinin harf yapısına nasıl eklendiğini, önce renkli noktalar ve sonra işaretler olarak görebilir. Resim, Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  "id": "Gambar tersebut adalah dokumen yang menurut arsip berasal dari abad ke-8 dan berada di Perpustakaan Nasional Prancis, Arab 334, folio 32. Dokumen ini digambarkan menggunakan aksara Hijazi, dengan ayat-ayat yang dipisahkan oleh kelompok tiga garis miring, lingkaran yang dikelilingi garis yang menunjukkan puluhan, dan tanda vokal yang ditunjukkan oleh titik merah. Judul surah dan jumlah ayatnya ditambahkan kemudian. Dokumen ini menyajikan contoh awal dari keluarga aksara Hijazi, yang dicirikan oleh huruf-hurufnya yang miring dan tanda diakritik yang lebih sedikit, yang kemudian dapat dibandingkan oleh pembaca dengan aksara yang lebih teratur di kemudian hari. Dokumen ini berguna untuk menjelaskan perkembangan tanda diakritik: pembaca dapat melihat, pada halaman sebenarnya, bagaimana tanda vokal ditambahkan ke struktur huruf, pertama sebagai titik berwarna dan kemudian sebagai tanda. Gambar ini berada dalam domain publik di Wikimedia Commons."
