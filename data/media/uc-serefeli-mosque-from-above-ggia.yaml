alt:
  ar: "مسجد ذو قبة مركزية كبيرة وقباب أصغر وأربع مآذن مختلفة الارتفاع والزخرفة، يُرى من أعلى بين سطوح من القرميد الأحمر، وتمتد الحقول والأشجار إلى الأفق."
  en: "A mosque with a large central dome, smaller domes and four minarets of different heights and patterns, seen from above among red-tiled roofs, with fields and trees stretching to the horizon."
  ur: "ایک مسجد جس پر بڑا مرکزی گنبد، چھوٹے گنبد اور مختلف اونچائی اور نقش کے چار مینار ہیں، اوپر سے سرخ کھپریل کی چھتوں کے بیچ دکھائی دیتی ہے، اور کھیت اور درخت افق تک پھیلے ہیں۔"
  fr: "Une mosquée avec une grande coupole centrale, des coupoles plus petites et quatre minarets de hauteurs et de motifs différents, vue d'en haut parmi des toits de tuiles rouges, avec des champs et des arbres qui s'étendent jusqu'à l'horizon."
  es: "Una mezquita con una gran cúpula central, cúpulas más pequeñas y cuatro minaretes de alturas y motivos diferentes, vista desde arriba entre tejados de teja roja, con campos y árboles que se extienden hasta el horizonte."
  tr: "Büyük bir ana kubbesi, daha küçük kubbeleri ve yükseklikleri ile süslemeleri farklı dört minaresi olan bir cami, kırmızı kiremitli çatıların arasında yukarıdan görülüyor; tarlalar ve ağaçlar ufka kadar uzanıyor."
  id: "Masjid dengan kubah tengah yang besar, kubah-kubah yang lebih kecil, dan empat menara yang berbeda tinggi dan polanya, terlihat dari atas di antara atap genteng merah, dengan ladang dan pepohonan yang membentang hingga cakrawala."
