summary:
  ar: "تُظهر الصورة جامع الشرفات الثلاث في أدرنة بمآذنه الأربع بين سطوح المدينة؛ وتذكر صفحة الملف أنها التُقطت من أعلى إحدى مآذن جامع السليمية. صورة التقطها Ggia في 4 يونيو 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the Üç Şerefeli Mosque in Edirne with its four minarets among the roofs of the city; its file page says it was taken from the top of a minaret of the Selimiye Mosque. Photograph by Ggia, 4 June 2012, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں ادرنہ کی جامع اوچ شرفلی شہر کی چھتوں کے بیچ اپنے چار میناروں کے ساتھ دکھائی دیتی ہے؛ اس کے فائل کے صفحے کے مطابق یہ جامع سلیمیہ کے ایک مینار کی چوٹی سے لی گئی ہے۔ تصویر: Ggia، 4 جون 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la mosquée Üç Şerefeli à Edirne avec ses quatre minarets parmi les toits de la ville ; la page de son fichier indique qu'elle a été prise du haut d'un minaret de la mosquée Selimiye. Photographie : Ggia, 4 juin 2012, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la mezquita Üç Şerefeli en Edirne con sus cuatro minaretes entre los tejados de la ciudad; la página de su archivo indica que fue tomada desde lo alto de un minarete de la mezquita Selimiye. Fotografía de Ggia, 4 de junio de 2012, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Edirne'deki Üç Şerefeli Cami'yi dört minaresiyle şehrin çatıları arasında gösteriyor; dosya sayfası fotoğrafın Selimiye Camii'nin minarelerinden birinin tepesinden çekildiğini belirtiyor. Fotoğraf: Ggia, 4 Haziran 2012; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Masjid Üç Şerefeli di Edirne dengan keempat menaranya di antara atap-atap kota; halaman berkasnya menyebutkan bahwa foto ini diambil dari puncak salah satu menara Masjid Selimiye. Foto oleh Ggia, 4 Juni 2012, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
