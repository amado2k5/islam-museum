  ar: "جامع الشرفات الثلاث في أدرنة من أعلى"
  en: "Üç Şerefeli Mosque, Edirne, from above"
  ur: "جامع اوچ شرفلی، ادرنہ، اوپر سے"
  fr: "Mosquée Üç Şerefeli, Edirne, vue d'en haut"
