"label":
  "ar": "قطعة بالكوفي، الأسلوب الجديد الأول: نقاط حمراء للحركات وخطوط مائلة لاحقة"
  "en": "Kufi New Style I fragment: red dots for vowels, later diagonal marks"
  "ur": "کوفی نیا طرز I کا ٹکڑا: حرکات کے لیے سرخ نقطے، بعد کی ترچھی علامتیں"
"summary":
  "ar": "صورة لقطعة من مكتبة الكونغرس فيها الآيات ١٦ إلى ١٩ من السورة الرابعة، النساء، بالكوفي ⁦(الأسلوب الجديد الأول)⁩. وتذكر صفحة الملف أن النص بضربات سوداء غليظة، وأن الحركات تُعلَّم بنقاط حمراء، وأن خطوطًا مائلة تمثّل علامات الإعجام أُضيفت لاحقًا، وأن الخط نموذجي لمصاحف القرنين الحادي عشر والثاني عشر. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress fragment with verses 16 to 19 of the 4th chapter, al-Nisa', in Kufi (New Style I). The file page says the text is in thick black strokes, that vowels are marked by red dots, that some diagonal lines representing diacritical marks were added later, and that the script is typical of 11th and 12th century Qur'ans. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک ٹکڑے کی تصویر جس میں چوتھی سورت، النساء، کی آیات ۱۶ تا ۱۹ کوفی ⁦(نیا طرز I)⁩ میں ہیں۔ فائل کا صفحہ کہتا ہے کہ متن موٹی سیاہ لکیروں میں ہے، حرکات سرخ نقطوں سے ظاہر ہیں، اعجام کی علامات کی نمائندہ کچھ ترچھی لکیریں بعد میں بڑھائی گئیں، اور خط گیارھویں اور بارھویں صدی کے مصاحف کا نمونہ ہے۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
