summary:
  ar: "صورة حديثة في مشغل ميراث قرب سمرقند: تقشير لحاء التوت. توضيح سياقي للحرفة، لا مصنع بغداد العباسي ولا وصفة أليافه."
  en: "Modern Meros workshop near Samarkand: mulberry-bark preparation. Contextual craft photograph, not the Abbasid Baghdad workshop or its fiber recipe."
  ur: "سمرقند کے قریب جدید میروس کارگاہ میں شہتوت کی چھال؛ ہنر کی سیاقی تصویر، عباسی بغداد کے کارخانے یا اس کے ریشوں کا ثبوت نہیں۔"
  es: "Taller moderno de Meros cerca de Samarcanda: preparación de corteza de morera. Fotografía de la artesanía en contexto, no del taller abasí de Bagdad ni de su receta de fibra."
  fr: "Atelier moderne de Meros près de Samarcande: préparation d’écorce de mûrier. Photographie d’artisanat contextuelle, et non de l’atelier abbasside de Bagdad ni de sa recette de fibres."
  tr: "Semerkant yakınlarındaki bir geleneksel atölyeden yeni bir fotoğraf: dut ağacı kabuğu soyuluyor. Bu, Abbasiler dönemindeki Bağdat fabrikasını veya lif üretim yöntemini değil, zanaatı bağlamlı bir şekilde gösteren bir fotoğraf."
  id: "Foto terbaru dari bengkel warisan budaya di dekat Samarkand: mengupas kulit pohon murbei. Ini adalah ilustrasi kontekstual dari kerajinan tersebut, bukan tentang pabrik Baghdad era Abbasiyah atau resep seratnya."
