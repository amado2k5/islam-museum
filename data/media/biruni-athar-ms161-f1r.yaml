alt:
  ar: "صفحة طولية من مخطوط عربي بخط النسخ، يتصدرها منمنم مصور بالذهب والألوان، وتحته أعمدة من النص العربي؛ صفحة عنوان المخطوط الإيلخاني لإدنبرة Or 161."
  en: "A portrait page of an Arabic manuscript in naskh script, headed by an illuminated miniature in gold and colour with columns of Arabic text below; the title page of the Ilkhanid Edinburgh copy Or 161."
  ur: "عربی مخطوط کا لمبا صفحہ نسخ خط میں، جس کے اوپر سنہری اور رنگین منی ایچر ہے اور نیچے عربی متن کے کالم ہیں؛ ایڈنبرا مخطوط Or 161 کا عنوانی صفحہ۔"
