label:
  ar: "صورة: صفحة عنوان مصورة من مخطوط «الآثار الباقية عن القرون الخالية» المحفوظ بإدنبرة"
  en: "Image: illuminated title page of the Edinburgh manuscript of al-Biruni's Athar al-Baqiya"
  ur: "تصویر: ایڈنبرا میں محفوظ البیرونی کی «الآثار الباقیہ» کے مخطوطے کا روشن عنوانی صفحہ"
  es: "Imagen: página del título iluminada del manuscrito de Edimburgo del Athar al-Baqiya de al-Biruni"
  fr: "Image: page de titre enluminée du manuscrit d'Édimbourg de l'Athar al-Baqiya d'al-Biruni"
  tr: "Görsel: Edinburgh'da muhafaza edilen \"Geçmiş Yüzyılların Kalan İzleri\" adlı el yazmasının fotoğraflanmış bir başlık sayfası."
  id: "Gambar: Foto halaman judul dari manuskrip \"Remaining Traces of Past Centuries\" yang disimpan di Edinburgh."
summary:
  ar: "إعادة تصوير أمينة لصفحة عنوان (f.1r) من المخطوط الإيلخاني MS Or 161 الذي يحفظ «الآثار الباقية عن القرون الخالية» في مكتبة جامعة إدنبرة، نُسخ سنة 707هـ ⁦(1307-1308م)⁩ على ما تفيد فهرس المكتبة. صفحة عنوان مصورة بالذهب والألوان فوق نص عربي بالنسخ، وهي شاهد على أن الكتاب قُرئ ونُسخ في عالم إيلخاني متعدد الشعوب والأديان قبل سبعة قرون من طباعته الحديثة. منشورة على ويكيميديا كومنز بعلامة الملك العام."
  en: "A faithful photographic reproduction of the title page (f.1r) of Edinburgh MS Or 161, the Ilkhanid manuscript of al-Biruni's Athar al-Baqiya held by the University of Edinburgh Library, copied in 707 AH (1307-08 CE) according to the library catalogue. An illuminated title page in gold and colour above Arabic naskh script, it witnesses that the book was copied and read in a multi-confessional Ilkhanid world seven centuries before its modern print editions. On Wikimedia Commons under the public-domain mark."
  ur: "ایڈنبرا یونیورسٹی لائبریری کے مخطوط MS Or 161 کے عنوانی صفحے (f.1r) کی دیانت دارانہ تصویری نقل؛ یہ البیرونی کی «الآثار الباقیہ عن القرون الخالیہ» کا نقشہ ہے جو لائبریری کے کیٹلاگ کے مطابق 707ھ ⁦(1307–1308ء)⁩ میں نقل ہوا۔ اس صفحے پر سنہری اور رنگین منی ایچر کے ساتھ نسخ خط کا عربی متن ہے۔ کامنز پر بادشاہی عام نشان سے نشان زد ہے۔"
  es: "Reproducción fotográfica fiel de la portada (f.1r) del manuscrito Or 161 de Edimburgo, manuscrito iljánida del Athar al-Baqiya de al-Biruni, conservado en la Biblioteca de la Universidad de Edimburgo. Fue copiado en el año 707 de la Hégira (1307-1308 d. C.), según el catálogo de la biblioteca. La portada, iluminada en oro y color sobre escritura árabe naskh, atestigua que el libro fue copiado y leído en un mundo iljánida multiconfesional siete siglos antes de sus ediciones impresas modernas. Disponible en Wikimedia Commons bajo la marca de dominio público."
  fr: "Reproduction photographique fidèle de la page de titre (f.1r) du manuscrit ilkhanide Or 161 d'Édimbourg, ouvrage de l'Athar al-Baqiya d'al-Biruni conservé à la bibliothèque de l'Université d'Édimbourg. Copie datant de 707 AH (1307-1308 ap. J.-C.) selon le catalogue de la bibliothèque, cette page de titre enluminée, ornée d'or et de couleurs et surmontant une inscription en caractères naskh arabes, témoigne de la diffusion de l'ouvrage dans le monde ilkhanide, marqué par la diversité des confessions, sept siècles avant ses éditions imprimées modernes. Disponible sur Wikimedia Commons sous licence du domaine public."
  tr: "Edinburgh Üniversitesi Kütüphanesi'nde bulunan ve \"Geçmiş Yüzyılların Kalıntıları\"nı muhafaza eden İlhanlı el yazması MS Or 161'in başlık sayfasının (f.1r) aslına sadık bir kopyası. Kütüphane kataloğuna göre, 707 Hicri yılında (1307-1308 Miladi) kopyalanmıştır. Arapça Naskh yazısıyla yazılmış metin üzerine altın ve renkli resimlerle süslenmiş başlık sayfası, kitabın modern basımından yedi yüzyıl önce çok etnikli ve çok dinli İlhanlı dünyasında okunduğunu ve kopyalandığını göstermektedir. Wikimedia Commons'ta Kamu Malı bayrağı altında yayınlanmıştır."
  id: "Reproduksi setia halaman judul (f.1r) dari manuskrip Ilkhanid MS Or 161, yang menyimpan \"Peninggalan Abad-Abad Lampau\" di Perpustakaan Universitas Edinburgh. Menurut katalog perpustakaan, manuskrip ini disalin pada tahun 707 H (1307-1308 M). Halaman judul, yang diilustrasikan dengan emas dan warna di atas teks Arab dalam aksara Naskh, membuktikan bahwa buku ini dibaca dan disalin di dunia Ilkhanid yang multietnis dan multiagama tujuh abad sebelum pencetakan modernnya. Diterbitkan di Wikimedia Commons di bawah bendera Domain Publik."
