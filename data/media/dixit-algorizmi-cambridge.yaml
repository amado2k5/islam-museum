alt:
  ar: "صفحة مخطوطة باهتة بالأبيض والأسود، مكتوبة بخط لاتيني قوطي متقارب في نحو ثلاثين سطراً. في أعلاها يسار الصفحة حرف D كبير مزخرف بأوراق ملتفة، تليه الكلمتان «DIXIT algorizmi»، وتحته حرفان أوليان مزخرفان أصغر يبدآن فقرتين أخريين. في الزاوية العليا اليمنى رقم الورقة 104، وعلى الصفحة بقع داكنة من الرطوبة."
  en: "A faded black-and-white manuscript page written in about thirty close lines of Gothic Latin script. At the top left is a large D decorated with curling leaves, followed by the words 'DIXIT algorizmi'; below it two smaller decorated initials open further paragraphs. The folio number 104 is in the top right corner, and dark damp stains mark the page."
  ur: "ایک دھندلا سیاہ و سفید مخطوطہ صفحہ، جو گوتھک لاطینی خط کی تقریباً تیس گھنی سطروں میں لکھا ہے۔ اوپر بائیں جانب بل کھاتی پتیوں سے سجا ایک بڑا D ہے، جس کے بعد الفاظ «DIXIT algorizmi» آتے ہیں؛ اس کے نیچے دو چھوٹے سجے ہوئے ابتدائی حروف مزید پیراگراف شروع کرتے ہیں۔ اوپر دائیں کونے میں ورق نمبر 104 ہے، اور صفحے پر نمی کے گہرے دھبے ہیں۔"
