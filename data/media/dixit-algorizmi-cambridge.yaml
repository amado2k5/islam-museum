label:
  ar: "صورة: الصفحة الأولى من الترجمة اللاتينية لكتاب الخوارزمي في الحساب الهندي «قال الخوارزمي» (كامبريدج، Ii.6.5)"
  en: "Photo: the opening page of the Latin translation of al-Khwarizmi's book on Indian reckoning, 'Dixit Algorizmi' (Cambridge, MS Ii.6.5)"
  ur: "تصویر: خوارزمی کی ہندی حساب والی کتاب کے لاطینی ترجمے کا پہلا صفحہ، «Dixit Algorizmi» (کیمبرج، Ii.6.5)"
summary:
  ar: "صفحة من المخطوطة اللاتينية في مكتبة جامعة كامبريدج (Ii.6.5) تبدأ بعبارة «Dixit Algorizmi»، أي «قال الخوارزمي»، مصوّرة من طبعة فوغل المصوّرة سنة 1963. وهي الترجمة اللاتينية من القرن الثاني عشر لكتاب الخوارزمي في الحساب الهندي، الذي ضاع أصله العربي، ونشرها بونكومپاني بعنوان «Algoritmi de numero indorum» سنة 1857 {cite:tdv-harizmi pp. 224–227}."
  en: "A page of the Latin manuscript in Cambridge University Library (Ii.6.5) that opens 'Dixit Algorizmi', 'al-Khwarizmi said', scanned from Vogel's 1963 facsimile. It is the twelfth-century Latin translation of al-Khwarizmi's book on Indian reckoning, whose Arabic original is lost, published by Boncompagni as 'Algoritmi de numero indorum' in 1857 {cite:tdv-harizmi pp. 224–227}."
  ur: "کیمبرج یونیورسٹی لائبریری کے لاطینی مخطوطے (Ii.6.5) کا ایک صفحہ جو «Dixit Algorizmi» یعنی «خوارزمی نے کہا» سے شروع ہوتا ہے، فوگل کے 1963 کے عکسی ایڈیشن سے اسکین شدہ۔ یہ خوارزمی کی ہندی حساب والی کتاب کا بارہویں صدی کا لاطینی ترجمہ ہے، جس کا عربی اصل گم ہے، اور جسے بونکومپانی نے 1857 میں «Algoritmi de numero indorum» کے نام سے شائع کیا {cite:tdv-harizmi pp. 224–227}۔"
