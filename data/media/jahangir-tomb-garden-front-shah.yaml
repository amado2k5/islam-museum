summary:
  ar: "تُظهر الصورة الواجهة الطويلة ذات العقود لمقبرة جهانكير قرب لاهور بمآذنها الأربع في الأركان، من الحديقة. صورة التقطها Tahsin Shah في 22 نوفمبر 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the long arcaded front of the Tomb of Jahangir near Lahore with its four corner minarets, seen from the garden. Photograph by Tahsin Shah, 22 November 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں لاہور کے قریب جہانگیر کے مقبرے کا لمبا محرابوں والا سامنے کا رخ اس کے چاروں کونوں کے میناروں کے ساتھ باغ سے دکھائی دیتا ہے۔ تصویر: Tahsin Shah، 22 نومبر 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la longue façade à arcades du tombeau de Jahangir près de Lahore, avec ses quatre minarets d'angle, vue depuis le jardin. Photographie : Tahsin Shah, 22 novembre 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la larga fachada con arcadas de la tumba de Jahangir cerca de Lahore, con sus cuatro minaretes en las esquinas, vista desde el jardín. Fotografía de Tahsin Shah, 22 de noviembre de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Lahor yakınındaki Cihangir Türbesi'nin kemerli uzun cephesini ve dört köşe minaresini bahçeden gösteriyor. Fotoğraf: Tahsin Shah, 22 Kasım 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan bagian depan berarkade yang panjang dari Makam Jahangir di dekat Lahore dengan keempat menara sudutnya, dilihat dari taman. Foto oleh Tahsin Shah, 22 November 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
