alt:
  ar: "مبنى منخفض طويل من حجر أحمر مطعّم بالأبيض فيه صف من العقود، وفي كل ركن من أركانه الأربعة مئذنة عالية، خلف حديقة فيها ممر مبلّط وشجيرات مشذّبة، تحت سماء زرقاء فيها سحب."
  en: "A low, long building of red stone with white inlay and a row of arches, with a tall minaret at each of its four corners, behind a garden with a paved path and clipped shrubs, under a blue sky with clouds."
  ur: "سرخ پتھر کی ایک پست لمبی عمارت جس میں سفید جڑاؤ اور محرابوں کی قطار ہے، اور اس کے چاروں کونوں میں سے ہر ایک پر بلند مینار ہے، ایک باغ کے پیچھے ہے جس میں پختہ روش اور تراشی ہوئی جھاڑیاں ہیں، بادلوں بھرے نیلے آسمان تلے۔"
  fr: "Un long bâtiment bas de pierre rouge à incrustations blanches, avec une rangée d'arcs et un haut minaret à chacun de ses quatre angles, derrière un jardin avec une allée dallée et des arbustes taillés, sous un ciel bleu nuageux."
  es: "Un edificio largo y bajo de piedra roja con incrustaciones blancas y una hilera de arcos, con un alto minarete en cada una de sus cuatro esquinas, detrás de un jardín con un sendero pavimentado y arbustos podados, bajo un cielo azul con nubes."
  tr: "Beyaz kakmalı kırmızı taştan alçak ve uzun bir yapı; bir sıra kemeri ve dört köşesinin her birinde yüksek bir minaresi var; taş döşeli bir patikası ve budanmış çalıları olan bir bahçenin arkasında, bulutlu mavi bir gökyüzünün altında."
  id: "Bangunan rendah dan panjang dari batu merah dengan inlay putih dan deretan lengkung, dengan menara tinggi di masing-masing dari keempat sudutnya, di belakang taman dengan jalan setapak berpaving dan semak yang dipangkas, di bawah langit biru berawan."
