summary:
  ar: "صورة صفحة مطبوعة من الجداول الألفونسية، وهي التقاليد اللاتينية التي بُنيت على جداول طليطلة المنسوبة إلى الزرقالي ومدرسته. تظهر الأرقام المحسوبة التي كانت تُستخدم في الحساب الفلكي في أوروبا، لا نسخة من جداول طليطلة العربية المفقودة نفسها. منشورة على ويكيميديا كومنز بعلامة الملك العام."
  en: "A photograph of a printed page of the Alfonsine Tables, the Latin tradition built on the Toledan Tables attributed to al-Zarqali and his school. It shows the computed figures used for astronomical calculation in Europe, not a copy of the lost Arabic Toledan original itself. On Wikimedia Commons under the public-domain mark."
  ur: "الفونسین جداول کے چھپے ہوئے صفحے کی تصویر؛ یہ لاطینی روایت ہے جو زرقالی اور ان کے مکتب سے منسوب جداولِ طلیطلہ پر مبنی ہے۔ اس میں وہ حساب شدہ اعداد دکھائے گئے ہیں جو یورپ میں فلکیاتی حساب کے لیے استعمال ہوتے تھے، خود کھوئے ہوئے عربی جداولِ طلیطلہ کی نقل نہیں۔ کامنز پر بادشاہی عام نشان سے نشان زد ہے۔"
  es: "Fotografía de una página impresa de las Tablas Alfonsinas, la tradición latina basada en las Tablas Toledanas atribuidas a al-Zarqali y su escuela. Muestra las cifras calculadas utilizadas para el cálculo astronómico en Europa, no una copia del original árabe Toledano perdido. Disponible en Wikimedia Commons bajo dominio público."
  fr: "Photographie d'une page imprimée des Tables alphonsines, la tradition latine fondée sur les Tables de Tolède attribuées à al-Zarqali et à son école. Elle présente les calculs utilisés en Europe pour les calculs astronomiques, et non une copie de l'original arabe de Tolède, aujourd'hui disparu. Disponible sur Wikimedia Commons sous licence du domaine public."
