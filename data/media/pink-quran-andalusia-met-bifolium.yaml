"summary":
  "ar": "صورة لورقتين يسندهما عنوان الملف إلى المصحف الوردي الأندلسي في متحف المتروبوليتان للفنون، وتؤرخهما صفحة الملف بنحو القرن الثالث عشر. وتصنّفه صفحة الملف مخطوطًا غير مصوّر فحسب؛ أما كون المصحف مكتوبًا بخط مغربي غليظ فمصدره سجلّ المتحف نفسه للمصحف الوردي لا صفحة الملف. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of a bifolium that the file title assigns to the Andalusian Pink Qur'an in the Metropolitan Museum of Art, dated by the file page to about the 13th century. The file page classes it only as a non-illustrated manuscript bifolio; that the codex is written in a bold Maghribi hand comes from the museum's own record of the Pink Qur'an, not from the file page. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "ایک دو ورقی کی تصویر جسے فائل کا عنوان میٹروپولیٹن میوزیم آف آرٹ کے اندلسی گلابی مصحف سے منسوب کرتا ہے اور فائل کا صفحہ تقریباً تیرھویں صدی کا بتاتا ہے۔ فائل کا صفحہ اسے صرف بغیر تصویر والا مخطوطی دو ورقی کہتا ہے؛ یہ کہ مصحف موٹے مغربی خط میں ہے، عجائب گھر کے اپنے اندراج سے ہے، فائل کے صفحے سے نہیں۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
  "es": "Fotografía de un bifolio que el título del archivo asigna al Corán Rosa Andaluz del Museo Metropolitano de Arte, fechado en la página del archivo aproximadamente en el siglo XIII. La página del archivo lo clasifica únicamente como un bifolio manuscrito sin ilustraciones; el hecho de que el códice esté escrito en una caligrafía magrebí audaz proviene del propio registro del museo sobre el Corán Rosa, no de la página del archivo. Sirve como ejemplo de la escritura magrebí a mano alzada del norte de África y al-Ándalus, que carece de proporciones fijas y se encuentra principalmente en manuscritos. Permite al lector observar el manuscrito original que respalda el registro del museo sobre este mushaf. En Wikimedia Commons, el archivo está dedicado al dominio público bajo la licencia CC0."
  "fr": "Photographie d'un bifolio que le titre du fichier attribue au Coran rose andalou du Metropolitan Museum of Art, daté du XIIIe siècle environ selon la fiche descriptive. Cette dernière le décrit simplement comme un bifolio manuscrit non illustré; l'information selon laquelle le codex est écrit en caractères maghrébins gras provient de la notice du musée concernant le Coran rose, et non de la fiche descriptive. Ce bifolio illustre l'écriture maghrébine manuscrite d'Afrique du Nord et d'al-Andalus, caractérisée par des proportions variables et que l'on retrouve principalement dans les manuscrits. Il permet au lecteur d'observer le manuscrit original qui sous-tend la notice du musée concernant ce mushaf. Sur Wikimedia Commons, le fichier est placé dans le domaine public sous licence CC0."
  "tr": "Dosya başlığında Metropolitan Sanat Müzesi'ndeki Endülüs Gül Kur'an'ına atfedilen ve dosya sayfasında yaklaşık 13. yüzyıla tarihlenen iki sayfanın fotoğrafı. Dosya sayfası onu sadece resimsiz bir el yazması olarak sınıflandırıyor; Kur'an'ın kalın Mağribi yazısıyla yazılmış olması, dosya sayfasında değil, müzenin Gül Kur'an'ına dair kendi kayıtlarına dayanmaktadır. Bu, Kuzey Afrika ve Endülüs'ün serbest Mağribi yazısının bir örneğidir; bu yazı tipi sabit oranlardan yoksundur ve el yazmalarında yaygındır. Okuyucuya, müzenin bu Kur'an'a dair kayıtlarının dayandığı el yazmasının kendisine bir bakış sunmaktadır. Wikimedia Commons'taki görsel, CC0 lisansı altında kamu malıdır."
  "id": "Sebuah foto dua halaman, yang menurut judul berkas dikaitkan dengan Al-Qur'an Mawar Andalusia di Museum Seni Metropolitan, dan yang menurut halaman berkas tersebut berasal dari sekitar abad ke-13. Halaman berkas tersebut hanya mengklasifikasikannya sebagai manuskrip tanpa ilustrasi; fakta bahwa Al-Qur'an ditulis dalam aksara Maghrebi tebal didasarkan pada catatan museum sendiri tentang Al-Qur'an Mawar, bukan halaman berkas. Ini berfungsi sebagai contoh aksara Maghrebi bebas dari Afrika Utara dan Andalusia, yang tidak memiliki proporsi tetap dan lazim ditemukan dalam manuskrip. Foto ini menawarkan kepada pembaca sekilas tentang manuskrip itu sendiri yang menjadi dasar catatan museum tentang Al-Qur'an ini. Gambar di Wikimedia Commons berada dalam domain publik di bawah lisensi CC0."
