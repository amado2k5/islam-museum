"summary":
  "ar": "صورة لأوائل صفحات المصحف، الورقتان ١ ظهر و٢ وجه، الذي تقول صفحة الملف إن الشيخ حمد الله نسخه بخط النسخ للسلطان بايزيد الثاني في إسطنبول سنة ١٥٠٣-١٥٠٤م؛ مقاسه ٣٢ في ٢٣ سم، وزخرفته لحسن بن عبد الله، طوب قابي A.5. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the first pages, ff. 1b-2a, of the Qur'an that the file page says was copied in naskh script by Shaykh Hamdullah for Sultan Bayezid II in Istanbul in 1503-1504; 32 by 23 cm, with illumination by Hasan ibn Abdallah, Topkapi A.5. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "اس قرآن کے ابتدائی صفحات، ورق ۱ پشت و ۲ رخ، کی تصویر جسے فائل کا صفحہ بتاتا ہے کہ شیخ حمد اللہ نے سلطان بایزید ثانی کے لیے استنبول میں ۱۵۰۳-۱۵۰۴ء میں نسخ خط میں نقل کیا؛ ۳۲ ضرب ۲۳ سینٹی میٹر، آرائش حسن بن عبد اللہ کی، توپ قاپی A.5۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de las primeras páginas, ff. 1b-2a, del Corán que, según la ficha del archivo, fue copiado en escritura naskh por el jeque Hamdullah para el sultán Bayezid II en Estambul entre 1503 y 1504; 32 x 23 cm, con iluminación de Hasan ibn Abdallah, Topkapi A.5. Sirve como ejemplo de naskh, la letra pequeña y cursiva que se convirtió en la escritura habitual para copiar libros y pequeños mushafs. Se incluye como obra de un maestro calígrafo, como indica la ficha del archivo, para que el lector pueda apreciar la tradición que rodea su nombre en la página; no se trata de un retrato. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie des premières pages (ff. 1b-2a) du Coran, copiées en écriture naskh par le cheikh Hamdullah pour le sultan Bayezid II à Istanbul entre 1503 et 1504 (selon la fiche descriptive). Dimensions: 32 x 23 cm. Enluminures: Hasan ibn Abdallah, Topkapi A.5. Ce document illustre l’écriture naskh, cette petite écriture cursive régulière devenue l’écriture courante pour la copie de livres et de petits mushafs. Il est présenté comme une œuvre d’un maître calligraphe, afin d’illustrer la tradition calligraphique entourant son nom; il ne s’agit pas d’un portrait. Sur Wikimedia Commons, le fichier est dans le domaine public."
