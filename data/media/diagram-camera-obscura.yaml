summary:
  ar: "مخطط بسيط يرسمه الموقع عند البناء من بيانات السجل: البيت المظلم عند ابن الهيثم في الوسط، وما سبقه ⁦(الضوء الداخل إلى البيوت من الثقوب، وعلم المناظر عند اليونان)⁩ في جانب، وما تلاه كما تذكره المصادر في الجانب الآخر."
  en: "A simple schematic drawn by the site at build time from the record's data: Ibn al-Haytham's dark room in the middle, what came before (light entering houses through holes, and Greek optics) on one side, and what followed, as the sources name it, on the other."
  ur: "ایک سادہ خاکہ جو سائٹ بناتے وقت ریکارڈ کے ڈیٹا سے کھینچتی ہے: درمیان میں ابن الہیثم کا تاریک کمرہ، ایک طرف وہ جو اس سے پہلے تھا ⁦(سوراخوں سے گھروں میں آنے والی روشنی، اور یونانی بصریات)⁩، اور دوسری طرف وہ جو اس کے بعد آیا، جیسا کہ مصادر بتاتے ہیں۔"
  es: "Un esquema sencillo dibujado por el sitio en el momento de su construcción a partir de los datos del registro: la habitación oscura de Ibn al-Haytham en el centro, lo que existía antes (la luz que entraba en las casas a través de agujeros y la óptica griega) a un lado, y lo que vino después, como lo denominan las fuentes, al otro."
  fr: "Un schéma simple dessiné par le site au moment de sa construction à partir des données du registre: la chambre noire d’Ibn al-Haytham au centre, ce qui précédait (la lumière entrant dans les maisons par des trous et l’optique grecque) d’un côté, et ce qui a suivi, comme le nomment les sources, de l’autre."
  tr: "Yapım aşamasında site tarafından kayıt verilerinden çizilen basit bir şema: Ortada İbn el-Haytham'ın karanlık evi, bir tarafta ondan önce gelenler (evlere deliklerden giren ışık ve Yunanlılar arasında optik bilimi), diğer tarafta ise kaynaklarda belirtildiği gibi ondan sonra gelenler."
  id: "Diagram sederhana yang digambar oleh pihak pengelola situs selama pembangunan berdasarkan data catatan: rumah gelap Ibn al-Haytham di tengah, apa yang mendahuluinya (cahaya yang masuk ke rumah melalui lubang, dan ilmu optik di kalangan orang Yunani) di satu sisi, dan apa yang mengikutinya seperti yang disebutkan oleh sumber-sumber di sisi lainnya."
