alt:
  ar: "ثلاثة أعمدة يصل بينها سهمان. العمود الأول وعنوانه «ما بُني عليه» فيه مربعان منقطا الحدود: الضوء الداخل إلى البيوت من الثقوب والخروق والأبواب؛ وعلم المناظر عند اليونان ونظريات الإبصار. وفي الوسط مربع غليظ الحدود: البيت المظلم عند ابن الهيثم، ابن الهيثم. والعمود الأخير وعنوانه «ما بُني فوقه» فيه أربعة مربعات: مقالة في صورة الكسوف؛ تنقيح المناظر للفارسي؛ الترجمة اللاتينية وطبعة رزنر سنة 1572؛ علم المناظر في أوروبا من فيتيلو إلى ديكارت."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds two dashed boxes: light entering houses through holes, cracks and doors; Greek optics and the theories of vision. In the middle a box with a thick border: Ibn al-Haytham's dark room, Ibn al-Haytham. The last column, headed Built on it, holds four boxes: the Treatise on the Form of the Eclipse; al-Farisi's Tanqih al-Manazir; the Latin translation and Risner's printing of 1572; optics in Europe from Witelo to Descartes."
  ur: "دو تیروں سے جڑے تین کالم۔ پہلے کالم میں، جس کا عنوان «اس کی بنیاد» ہے، نقطے دار حاشیے والے دو خانے ہیں: سوراخوں، دراڑوں اور دروازوں سے گھروں میں آنے والی روشنی؛ یونانی بصریات اور نظریاتِ بصارت۔ درمیان میں موٹے حاشیے والا خانہ: ابن الہیثم کا تاریک کمرہ، ابن الہیثم۔ آخری کالم میں، جس کا عنوان «اس پر بنایا گیا» ہے، چار خانے ہیں: گرہن کی صورت پر رسالہ؛ فارسی کی تنقیح المناظر؛ لاطینی ترجمہ اور 1572ء کی رزنر کی طباعت؛ یورپ میں بصریات، وٹیلو سے دیکارت تک۔"
