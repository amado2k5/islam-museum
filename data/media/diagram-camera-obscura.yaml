label:
  ar: "مخطط: ما بُني عليه البيت المظلم عند ابن الهيثم وما بُني فوقه"
  en: "Diagram: what Ibn al-Haytham's dark room was built on and what was built on it"
  ur: "خاکہ: ابن الہیثم کا تاریک کمرہ کس بنیاد پر قائم تھا اور اس پر کیا بنایا گیا"
  es: "Diagrama: sobre qué se construyó el cuarto oscuro de Ibn al-Haytham y qué se construyó sobre él."
  fr: "Schéma: sur quoi était construite la chambre noire d’Ibn al-Haytham et ce qui y était construit."
  tr: "Şema: İbn el-Haytham'ın Kara Evi'nin neyin üzerine inşa edildiği ve onun üzerine nelerin inşa edildiği."
