  en: "Diagram: what Ibn al-Haytham's dark room was built on and what was built on it"
  ur: "خاکہ: ابن الہیثم کا تاریک کمرہ کس بنیاد پر قائم تھا اور اس پر کیا بنایا گیا"
summary:
  ar: "مخطط بسيط يرسمه الموقع عند البناء من بيانات السجل: البيت المظلم عند ابن الهيثم في الوسط، وما سبقه ⁦(الضوء الداخل إلى البيوت من الثقوب، وعلم المناظر عند اليونان)⁩ في جانب، وما تلاه كما تذكره المصادر في الجانب الآخر."
  en: "A simple schematic drawn by the site at build time from the record's data: Ibn al-Haytham's dark room in the middle, what came before (light entering houses through holes, and Greek optics) on one side, and what followed, as the sources name it, on the other."
  ur: "ایک سادہ خاکہ جو سائٹ بناتے وقت ریکارڈ کے ڈیٹا سے کھینچتی ہے: درمیان میں ابن الہیثم کا تاریک کمرہ، ایک طرف وہ جو اس سے پہلے تھا ⁦(سوراخوں سے گھروں میں آنے والی روشنی، اور یونانی بصریات)⁩، اور دوسری طرف وہ جو اس کے بعد آیا، جیسا کہ مصادر بتاتے ہیں۔"
