"summary":
  "ar": "صورة لورقة من ألبوم بخط الثلث نسخها علاء الدين التبريزي سنة ١٥٨٠م، مكتبة قصر غلستان رقم ١٥٥٨، كما تذكر صفحة الملف. تخدم مثالًا على الثلث، الخط الكبير المنساب الذي استُعمل في المصاحف الكبيرة واللوحات وكتابات العمائر. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio of an album in Thuluth script copied by Ala al-Din Tabrizi in 1580, Library of the Golestan Palace no. 1558, as the file page states. It serves as an example of Thuluth, the large, flowing display hand used for big mushafs, panels and building inscriptions. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ثلث خط میں البم کے ایک ورق کی تصویر، جسے علاء الدین تبریزی نے ۱۵۸۰ء میں نقل کیا، گلستان محل کا کتب خانہ نمبر ۱۵۵۸، جیسا کہ فائل کا صفحہ بتاتا ہے۔ یہ ثلث کی مثال ہے، وہ بڑا رواں خط جو بڑے مصاحف، لوحوں اور عمارتی کتبوں میں استعمال ہوا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio de un álbum en escritura Thuluth, copiado por Ala al-Din Tabrizi en 1580, perteneciente a la Biblioteca del Palacio de Golestán (n.º 1558), según indica la página del archivo. Sirve como ejemplo de Thuluth, la caligrafía elegante y fluida utilizada para grandes mushafs, paneles e inscripciones en edificios. En Wikimedia Commons, el archivo es de dominio público."
  "fr": "Photographie d'un folio d'un album en écriture Thuluth, copié par Ala al-Din Tabrizi en 1580, conservé à la Bibliothèque du Palais de Golestan sous le numéro 1558, comme indiqué sur la page du fichier. Ce document illustre l'écriture Thuluth, une écriture cursive et fluide utilisée pour les grands mushafs, les panneaux et les inscriptions de bâtiments. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Dosya sayfasında belirtildiği gibi, Ala al-Din al-Tabrizi tarafından 1580 yılında kopyalanmış, Gulistan Sarayı Kütüphanesi No. 1558 numaralı, Thuluth yazısıyla yazılmış bir albüm sayfasının fotoğrafı. Bu fotoğraf, büyük Kur'an kitaplarında, resimlerde ve mimari yazıtlarda kullanılan büyük ve akıcı bir yazı türü olan Thuluth'un bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman dari sebuah album dengan aksara Thuluth, disalin oleh Ala al-Din al-Tabrizi pada tahun 1580 M, Perpustakaan Istana Gulistan No. 1558, seperti yang tercatat pada halaman arsip. Foto ini berfungsi sebagai contoh aksara Thuluth, yaitu aksara besar dan mengalir yang digunakan dalam Al-Qur'an berukuran besar, lukisan, dan prasasti arsitektur. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
