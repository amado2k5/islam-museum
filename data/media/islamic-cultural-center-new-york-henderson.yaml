alt:
  ar: "مبنى حديث من حجر وردي فاتح تعلوه قبة رمادية مخضرّة وبجانبه مئذنة مربعة عالية نحيلة، تحجب الأشجار الخضراء جزءًا منه، تحت سماء زرقاء بلا سحب."
  en: "A modern building of pale pink stone with a grey-green dome and a tall, slim square minaret, partly hidden by green trees, under a cloudless blue sky."
  ur: "ہلکے گلابی پتھر کی ایک جدید عمارت جس پر خاکستری مائل سبز گنبد ہے اور اس کے پہلو میں ایک بلند پتلا چوکور مینار ہے، جسے سبز درخت جزوی طور پر چھپائے ہوئے ہیں، بے ابر نیلے آسمان تلے۔"
  fr: "Un bâtiment moderne de pierre rose pâle avec une coupole gris-vert et un haut minaret carré élancé, en partie caché par des arbres verts, sous un ciel bleu sans nuages."
  es: "Un edificio moderno de piedra rosa pálido con una cúpula gris verdosa y un alto y esbelto minarete cuadrado, parcialmente oculto por árboles verdes, bajo un cielo azul sin nubes."
  tr: "Gri-yeşil bir kubbeli ve yüksek, ince kare bir minareli, açık pembe taştan modern bir yapı; kısmen yeşil ağaçların arkasında kalıyor, bulutsuz mavi bir gökyüzünün altında."
  id: "Bangunan modern dari batu merah muda pucat dengan kubah abu-abu kehijauan dan menara persegi yang tinggi dan ramping, sebagian tertutup pepohonan hijau, di bawah langit biru tanpa awan."
