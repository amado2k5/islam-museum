summary:
  ar: "تُظهر الصورة مسجد المركز الثقافي الإسلامي في نيويورك من شارع 96 الشرقي في مانهاتن، بقبته ومئذنته العالية. صورة التقطها Jim.henderson في 25 يونيو 2008، من ويكيميديا كومنز، وهي في الملك العام."
  en: "The photograph shows the mosque of the Islamic Cultural Center of New York from East 96th Street in Manhattan, with its dome and tall minaret. Photograph by Jim.henderson, 25 June 2008, on Wikimedia Commons, in the public domain."
  ur: "تصویر میں نیویارک کے اسلامی ثقافتی مرکز کی مسجد مین ہٹن میں مشرقی 96 ویں گلی سے دکھائی دیتی ہے، اس کے گنبد اور بلند مینار کے ساتھ۔ تصویر: Jim.henderson، 25 جون 2008ء، وکیمیڈیا کامنز سے، عوامی ملکیت میں۔"
  fr: "La photographie montre la mosquée du Centre culturel islamique de New York depuis la 96e Rue Est à Manhattan, avec sa coupole et son haut minaret. Photographie : Jim.henderson, 25 juin 2008, sur Wikimedia Commons, dans le domaine public."
  es: "La fotografía muestra la mezquita del Centro Cultural Islámico de Nueva York desde la calle 96 Este en Manhattan, con su cúpula y su alto minarete. Fotografía de Jim.henderson, 25 de junio de 2008, en Wikimedia Commons, en el dominio público."
  tr: "Fotoğraf, New York İslam Kültür Merkezi'nin camisini Manhattan'daki Doğu 96. Cadde'den, kubbesi ve yüksek minaresiyle gösteriyor. Fotoğraf: Jim.henderson, 25 Haziran 2008; Wikimedia Commons, kamu malı."
  id: "Foto ini menampilkan masjid Pusat Kebudayaan Islam New York dari Jalan 96 Timur di Manhattan, dengan kubah dan menaranya yang tinggi. Foto oleh Jim.henderson, 25 Juni 2008, di Wikimedia Commons, domain publik."
