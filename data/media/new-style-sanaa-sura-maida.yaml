"label":
  "ar": "صفحة من مصاحف صنعاء بالخط الكوفي المشرقي، سورة المائدة"
  "en": "Page from the Sana'a Qur'an find in eastern Kufic script, sura al-Ma'ida"
  "ur": "صنعاء کے مصاحف کی دریافت کا صفحہ، مشرقی کوفی خط، سورۂ مائدہ"
  "es": "Página del Sagrado Corán de Sana'a, escrita en escritura cúfica oriental, sura al-Ma'ida."
  "fr": "Page du Coran de Sanaa découverte en écriture coufique orientale, sourate al-Ma'ida"
  "tr": "Sana'a'da bulunan bir Kur'an-ı Kerim sayfasından, Doğu Kufi yazısıyla yazılmış, Maide Suresi."
  "id": "Sehalaman dari Al-Qur'an Sana'a, ditulis dengan aksara Kufi Timur, Surah Al-Ma'idah"
"summary":
  "ar": "صورة لصفحة من مخطوط قرآني بالخط الكوفي المشرقي وُجد في الجامع الكبير بصنعاء، تؤرخها صفحة الملف بالقرن الحادي عشر أو الثاني عشر الميلادي، أي الخامس أو السادس الهجري، عن صورة لليونسكو؛ وفيها جزء من سورة المائدة. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page of a Qur'an manuscript in eastern Kufic script found in the Great Mosque of Sana'a, which the file page dates to the 11th or 12th century, the 5th or 6th century AH, from a UNESCO photograph; it carries part of sura al-Ma'ida. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "صنعاء کی جامع مسجد میں ملنے والے ایک قرآنی مخطوطے کے صفحے کی تصویر، مشرقی کوفی خط میں، جسے فائل کا صفحہ گیارھویں یا بارھویں صدی، یعنی پانچویں یا چھٹی صدی ہجری، کا بتاتا ہے، یونیسکو کی ایک تصویر سے؛ اس میں سورۂ مائدہ کا حصہ ہے۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página de un manuscrito del Corán en escritura cúfica oriental hallado en la Gran Mezquita de Saná, que data de los siglos XI o XII (V o VI d. H.), procedente de una fotografía de la UNESCO. Contiene parte de la sura Al-Ma'ida. Sirve como ejemplo de la escritura de estilo nuevo, tradicionalmente llamada cúfica oriental, caracterizada por sus letras verticales y el marcado contraste entre trazos gruesos y finos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une page d'un manuscrit coranique en écriture coufique orientale, conservée dans la Grande Mosquée de Sanaa. Datant du XIe ou XIIe siècle (Ve ou VIe siècle de l'Hégire) d'après une photographie de l'UNESCO, ce manuscrit contient une partie de la sourate al-Ma'ida. Il illustre l'écriture coufique orientale, caractérisée par ses lettres droites et le contraste marqué entre les traits épais et fins. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Sana'a Ulu Camii'nde bulunan ve UNESCO görseline dayanarak 11. veya 12. yüzyıla (Hicri 5. veya 6. yüzyıla) tarihlenen, Doğu Kufi yazısıyla yazılmış bir Kur'an el yazmasının bir sayfasının fotoğrafı; Maide Suresi'nin bir bölümünü içermektedir. Dik, düz harfleri ve kalın ve ince çizgiler arasındaki keskin kontrastıyla geleneksel olarak Doğu Kufi olarak adlandırılan yeni yazı stilinin bir örneğini oluşturmaktadır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman dari manuskrip Al-Qur'an dalam aksara Kufi Timur, yang ditemukan di Masjid Agung Sana'a, diperkirakan berasal dari abad ke-11 atau ke-12 Masehi (abad ke-5 atau ke-6 Hijriah), berdasarkan gambar UNESCO; berisi sebagian dari Surah Al-Ma'idah. Foto ini berfungsi sebagai contoh aksara baru yang secara tradisional disebut Kufi Timur, dengan huruf-hurufnya yang tegak dan lurus serta kontras yang tajam antara goresan tebal dan tipis. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
