alt:
  ar: "مبنى حجري ذو قبة ذهبية كبيرة وقبة ذهبية أصغر فوق رواقه، قائم بجانب بركة ومصاطب، وخلفه قلعة ذات أبراج وعَلَم ترتفع على تل صخري تحت سماء غائمة."
  en: "A stone building with a large golden dome and a smaller golden dome over its porch stands beside a pool and terraces; behind it a castle with towers and a flag rises on a rocky hill under a cloudy sky."
  ur: "ایک پتھر کی عمارت جس پر بڑا سنہری گنبد ہے اور اس کے برآمدے پر ایک چھوٹا سنہری گنبد ہے، ایک تالاب اور چبوتروں کے پاس کھڑی ہے؛ اس کے پیچھے برجوں والا قلعہ اور ایک جھنڈا ایک چٹانی ٹیلے پر بلند ہے، ابر آلود آسمان تلے۔"
  fr: "Un bâtiment de pierre à grande coupole dorée et à plus petite coupole dorée au-dessus de son porche se dresse près d'un bassin et de terrasses ; derrière lui, un château à tours et à drapeau s'élève sur une colline rocheuse sous un ciel nuageux."
  es: "Un edificio de piedra con una gran cúpula dorada y una cúpula dorada más pequeña sobre su pórtico se alza junto a un estanque y terrazas; detrás, un castillo con torres y una bandera se levanta sobre una colina rocosa bajo un cielo nublado."
  tr: "Büyük altın bir kubbesi ve son cemaat yerinin üzerinde daha küçük bir altın kubbesi olan taş bir yapı, bir havuzun ve teraslarının yanında duruyor; arkasında kuleleri ve bayrağı olan bir kale, bulutlu bir gökyüzünün altında kayalık bir tepede yükseliyor."
  id: "Bangunan batu dengan kubah emas besar dan kubah emas yang lebih kecil di atas serambinya berdiri di samping kolam dan teras-teras; di belakangnya, sebuah kastel dengan menara-menara dan sebuah bendera menjulang di bukit berbatu di bawah langit berawan."
