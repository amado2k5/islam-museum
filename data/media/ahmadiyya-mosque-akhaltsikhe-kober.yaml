  en: "Ahmadiyya Mosque in the fortress of Akhaltsikhe"
  ur: "احمدیے مسجد، اخالتسیخی کے قلعے میں"
  fr: "Mosquée Ahmadiyya dans la forteresse d'Akhaltsikhe"
