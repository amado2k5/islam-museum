summary:
  ar: "تُظهر الصورة المسجد الأحمدي ذا القبة الذهبية داخل قلعة راباتي في أخالتسيخي، وخلفه الحصن على الصخرة. صورة التقطها Kober في 5 يوليو 2014، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the golden-domed Ahmadiyya Mosque inside the Rabati fortress of Akhaltsikhe, with the citadel on the rock behind it. Photograph by Kober, 5 July 2014, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں اخالتسیخی کے راباتی قلعے کے اندر سنہری گنبد والی احمدیے مسجد دکھائی دیتی ہے، اور اس کے پیچھے چٹان پر قلعہ ہے۔ تصویر: Kober، 5 جولائی 2014ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la mosquée Ahmadiyya à coupole dorée à l'intérieur de la forteresse de Rabati à Akhaltsikhe, avec la citadelle sur le rocher derrière elle. Photographie : Kober, 5 juillet 2014, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la mezquita Ahmadiyya de cúpula dorada dentro de la fortaleza de Rabati en Akhaltsikhe, con la ciudadela sobre la roca detrás. Fotografía de Kober, 5 de julio de 2014, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Ahıska'daki Rabati Kalesi'nin içinde yer alan altın kubbeli Ahmediye Camii'ni, arkasında kayalık üzerindeki hisarla birlikte gösteriyor. Fotoğraf: Kober, 5 Temmuz 2014; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Masjid Ahmediye berkubah emas di dalam benteng Rabati di Akhaltsikhe, dengan kubu di atas batu karang di belakangnya. Foto oleh Kober, 5 Juli 2014, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
