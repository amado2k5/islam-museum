  "en": "Closing page of a Mamluk Qur'an in Muhaqqaq script, Cairo, 1334"
  "ur": "مملوکی قرآن کا آخری صفحہ، محقق خط، قاہرہ، ۱۳۳۴ء"
"summary":
  "ar": "صورة للصفحة الخاتمة من مصحف مملوكي، دار الكتب المصرية، مصاحف راشد ٨١، وفيها سورة الفلق، تقول صفحة الملف إن أحمد بن كمال بن يحيى الأنصاري المتطبب نسخه وزخرفه في القاهرة سنة ١٣٣٤م بخط المحقق، ومقاسه ٥٠ في ٣٥ سم. تخدم مثالًا على المحقق، الخط الجليل الذي فُضّل في المصاحف الكبيرة، تتباعد حروفه وتمتد أفقياته. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the closing page of a Mamluk Qur'an, Dar al-Kutub, National Library of Egypt, Masahif Rasid 81, with sura 113, which the file page says was copied and illuminated by Ahmad ibn Kamal ibn Yahya al-Ansari al-Mutatabbib in Cairo in 1334, in Muhaqqaq script, 50 by 35 cm. It serves as an example of Muhaqqaq, the large, stately hand favoured for big mushafs, in which letters are spaced and strokes are long and level. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک مملوکی قرآن کے آخری صفحے کی تصویر، دار الکتب، مصر کا قومی کتب خانہ، مصاحف راشد ۸۱، جس میں سورۂ فلق ہے؛ فائل کا صفحہ کہتا ہے کہ اسے احمد بن کمال بن یحییٰ انصاری المتطبب نے ۱۳۳۴ء میں قاہرہ میں محقق خط میں نقل اور آراستہ کیا، ۵۰ ضرب ۳۵ سینٹی میٹر۔ یہ محقق کی مثال ہے، وہ باوقار بڑا خط جو بڑے مصاحف میں پسند کیا گیا، جس کے حروف کھلے اور لکیریں لمبی اور ہموار ہوتی ہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
