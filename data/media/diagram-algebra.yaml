label:
  ar: "رسم: ما بُني عليه علم الجبر عند الخوارزمي وما بُني عليه"
  en: "Diagram: what al-Khwarizmi's algebra was built on and what was built on it"
  ur: "خاکہ: خوارزمی کا الجبرا کس پر بنا اور اس پر کیا بنا"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط علم الجبر والمقابلة والخوارزمي، وعن جانب ما سبقه عند المصريين والبابليين واليونان والهنود، وعن الجانب الآخر ما جاء بعده كما تذكره المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: algebra and al-Khwarizmi in the middle, what came before among the Egyptians, Babylonians, Greeks and Indians on one side, and what followed, as the sources name it, on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں الجبر والمقابلہ اور خوارزمی، ایک طرف مصریوں، بابلیوں، یونانیوں اور ہندیوں کے ہاں اس سے پہلے کی چیزیں، اور دوسری طرف مآخذ کے مطابق اس کے بعد آنے والی چیزیں۔"
