alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه أربعة مربعات بإطار متقطع: معادلات الدرجة الأولى في بردية أحمس المصرية، وجداول المربعات والمكعبات البابلية، والحلول الهندسية والتحليلية عند اليونان، وقواعد الهنود في حل المعادلات. في الوسط مربع بإطار سميك: علم الجبر والمقابلة، الخوارزمي. العمود الأخير بعنوان: بُني عليه، وفيه ستة مربعات: شروح كتاب الخوارزمي، وكتاب أبي كامل، وجبر الكرجي والسموأل، وتصنيف عمر الخيام لمعادلات الدرجة الثالثة، وشروح أهل الأندلس، والترجمة اللاتينية وكلمة algebra."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds four dashed boxes: first-degree equations in the Egyptian Ahmes papyrus; Babylonian tables of squares and cubes; Greek geometric and analytic solutions; Indian rules for solving equations. In the middle a box with a thick border: Algebra, al-Khwarizmi. The last column, headed Built on it, holds six boxes: commentaries on al-Khwarizmi's book; Abu Kamil's book; al-Karaji's and al-Samaw'al's algebra; Umar al-Khayyam's classification of cubic equations; the Andalusian commentaries; the Latin translation and the word algebra."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے چار خانے ہیں: مصری احمس پیپرس میں یک درجی مساواتیں؛ بابلی مربعوں اور مکعبوں کے جدول؛ یونانیوں کے ہندسی اور تحلیلی حل؛ مساوات حل کرنے کے ہندی قاعدے۔ درمیان میں موٹے کنارے والا خانہ: الجبر والمقابلہ، خوارزمی۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چھ خانے ہیں: خوارزمی کی کتاب کی شرحیں؛ ابو کامل کی کتاب؛ کرجی اور سموأل کا الجبرا؛ عمر خیام کی سہ درجی مساواتوں کی درجہ بندی؛ اہلِ اندلس کی شرحیں؛ لاطینی ترجمہ اور لفظ الجبرا۔"
