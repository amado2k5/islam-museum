alt:
  ar: "مسجد من الحجر الرملي الأحمر بثلاث قباب بيضاء بصلية وبوابة وسطى عالية ذات عقد ومآذن في الأركان، يُرى عبر صحن أحمر مبلّط فسيح فيه بضعة أشخاص صغار تحت سماء باهتة."
  en: "A red sandstone mosque with three white bulbous domes, a tall central arched portal and corner minarets, seen across a vast paved red courtyard with a few small figures under a pale sky."
  ur: "سرخ ریتیلے پتھر کی ایک مسجد جس کے تین سفید پیازی گنبد، بلند محرابی مرکزی پورٹل اور کونوں پر مینار ہیں، ایک وسیع سرخ پختہ صحن کے پار دکھائی دیتی ہے جس میں چند چھوٹے افراد ہیں، ہلکے آسمان تلے۔"
  fr: "Une mosquée de grès rouge à trois coupoles blanches bulbeuses, avec un haut portail central en arc et des minarets d'angle, vue au-delà d'une immense cour dallée de rouge où se trouvent quelques petites silhouettes, sous un ciel pâle."
  es: "Una mezquita de arenisca roja con tres cúpulas blancas bulbosas, un alto portal central en arco y minaretes en las esquinas, vista al otro lado de un inmenso patio pavimentado de rojo con unas pocas figuras pequeñas, bajo un cielo pálido."
  tr: "Kırmızı kumtaşından, üç beyaz soğan kubbeli, yüksek kemerli bir ana portalı ve köşe minareleri olan bir cami; taş döşeli geniş kırmızı bir avlunun ötesinden görülüyor, avluda birkaç küçük insan var, soluk bir gökyüzünün altında."
  id: "Masjid batu pasir merah dengan tiga kubah putih berbentuk bawang, portal tengah berlengkung yang tinggi, dan menara di sudut-sudutnya, terlihat dari seberang halaman merah berpaving yang sangat luas dengan beberapa orang kecil, di bawah langit pucat."
