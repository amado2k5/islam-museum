summary:
  ar: "تُظهر الصورة بيت الصلاة في مسجد بادشاهي في لاهور بقبابه البيضاء الثلاث عبر الصحن الواسع. صورة التقطها Ali Imran في 1 يوليو 2005، من ويكيميديا كومنز، بترخيص CC BY-SA 2.5."
  en: "The photograph shows the prayer hall of the Badshahi Mosque in Lahore, with its three white domes, across the wide courtyard. Photograph by Ali Imran, 1 July 2005, on Wikimedia Commons, licensed CC BY-SA 2.5."
  ur: "تصویر میں لاہور میں بادشاہی مسجد کی نماز گاہ اس کے تین سفید گنبدوں کے ساتھ وسیع صحن کے پار دکھائی دیتی ہے۔ تصویر: Ali Imran، 1 جولائی 2005ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.5۔"
  fr: "La photographie montre la salle de prière de la mosquée Badshahi à Lahore, avec ses trois coupoles blanches, au-delà de la vaste cour. Photographie : Ali Imran, 1er juillet 2005, sur Wikimedia Commons, sous licence CC BY-SA 2.5."
  es: "La fotografía muestra la sala de oración de la mezquita Badshahi en Lahore, con sus tres cúpulas blancas, al otro lado del amplio patio. Fotografía de Ali Imran, 1 de julio de 2005, en Wikimedia Commons, con licencia CC BY-SA 2.5."
  tr: "Fotoğraf, Lahor'daki Badşahi Camii'nin namaz salonunu, üç beyaz kubbesiyle birlikte, geniş avlunun ötesinden gösteriyor. Fotoğraf: Ali Imran, 1 Temmuz 2005; Wikimedia Commons, CC BY-SA 2.5 lisansı."
  id: "Foto ini menampilkan ruang salat Masjid Badshahi di Lahore, dengan tiga kubah putihnya, dari seberang halaman yang luas. Foto oleh Ali Imran, 1 Juli 2005, di Wikimedia Commons, berlisensi CC BY-SA 2.5."
