"summary":
  "ar": "صورة رُفعت في ٢٢ آذار ٢٠٠٦ تصفها صفحة الملف بأنها قلم من الجانب والأسفل والأعلى. ولا تسجّل كومنز مؤلفًا مقروءًا آليًا وتفترض أن الرافع Baba66 هو المصوّر.  الصورة على ويكيميديا كومنز بترخيص CC BY 2.5، ويلزم نسبتها إلى Baba66 (assumed by Commons from the uploader)."
  "en": "A photograph, uploaded on 22 March 2006, whose file page describes it as a qalam seen from the side, bottom and top. Commons records no machine-readable author and assumes the uploader, Baba66, as the creator.  On Wikimedia Commons the file is licensed CC BY 2.5; attribution to Baba66 (assumed by Commons from the uploader) is required."
  "ur": "۲۲ مارچ ۲۰۰۶ کو چڑھائی گئی تصویر جسے فائل کا صفحہ ایک قلم، پہلو، نیچے اور اوپر سے دیکھا ہوا، بتاتا ہے۔ کامنز کوئی مشین کے لیے قابل مطالعہ مصنف درج نہیں کرتا اور اپ لوڈ کرنے والے Baba66 کو مصنف فرض کرتا ہے۔  کامنز پر یہ فائل CC BY 2.5 لائسنس کے تحت ہے؛ Baba66 (assumed by Commons from the uploader) کی طرف نسبت ضروری ہے۔"
  "es": "Fotografía subida el 22 de marzo de 2006, cuya página de archivo la describe como un qalam visto de lado, desde abajo y desde arriba. Wikimedia Commons no registra un autor legible por máquina y asume que el usuario que la subió, Baba66, es el creador. En Wikimedia Commons, el archivo tiene licencia CC BY 2.5; se requiere la atribución a Baba66 (atribuida por Commons al usuario que la subió)."
  "fr": "Photographie, mise en ligne le 22 mars 2006, dont la page de fichier la décrit comme un qalam vu de côté, de dessous et de dessus. Wikimedia Commons n'indique aucun auteur identifiable par machine et attribue la création à Baba66, l'utilisateur qui l'a mise en ligne. Sur Wikimedia Commons, le fichier est sous licence CC BY 2.5; la mention de Baba66 (attribuée par Wikimedia Commons à partir de l'utilisateur qui l'a mise en ligne) est obligatoire."
  "tr": "22 Mart 2006'da yüklenen ve profil sayfasında yandan, alttan ve üstten bir kalem olarak tanımlanan bir görsel. Commons, makine tarafından okunabilir bir yazar kaydı tutmaz ve yükleyici Baba66'nın fotoğrafçı olduğunu varsayar. Görsel, Wikimedia Commons'ta CC BY 2.5 lisansı altında yer almaktadır ve Baba66'ya (Commons tarafından yükleyiciden varsayılan kişi) atfedilmelidir."
  "id": "Sebuah gambar yang diunggah pada 22 Maret 2006, yang dideskripsikan di halaman profilnya sebagai pena dilihat dari samping, bawah, dan atas. Wikimedia Commons tidak mendaftarkan penulis yang dapat dibaca mesin dan menganggap pengunggahnya, Baba66, sebagai fotografer. Gambar tersebut ada di Wikimedia Commons di bawah lisensi CC BY 2.5 dan harus dikaitkan dengan Baba66 (yang diasumsikan oleh Wikimedia Commons dari pengunggah)."
