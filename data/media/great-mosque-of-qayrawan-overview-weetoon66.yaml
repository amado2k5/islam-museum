alt:
  ar: "مسجد كبير مسوّر من حجر بلون المغرة يُرى من فوق أحد أركانه: إلى اليسار مئذنة مربعة ضخمة من ثلاثة طوابق، وأسوار طويلة ذات دعائم ثقيلة، وصحن تحيط به الأروقة وقباب صغيرة مضلّعة، تحت سماء يغشاها الغبار؛ وفي الشارع أسفله مظلات."
  en: "A large walled mosque of ochre stone seen from above one corner: a massive square minaret in three tiers on the left, long walls with heavy buttresses, an arcaded courtyard and small ribbed domes, under a hazy sky; parasols stand in the street below."
  ur: "ایک بڑی فصیل بند مسجد، گیرو رنگ کے پتھر کی، ایک کونے کے اوپر سے دکھائی دیتی ہے: بائیں جانب تین منزلوں کا ایک ضخیم چوکور مینار، بھاری سہاروں والی لمبی دیواریں، محرابی برآمدوں والا صحن اور چھوٹے دھاری دار گنبد، غبار آلود آسمان تلے؛ نیچے گلی میں چھتریاں کھڑی ہیں۔"
  fr: "Une grande mosquée fortifiée de pierre ocre vue d'en haut depuis un angle : un massif minaret carré à trois étages à gauche, de longs murs à lourds contreforts, une cour à arcades et de petites coupoles nervurées, sous un ciel brumeux ; des parasols se dressent dans la rue en contrebas."
  es: "Una gran mezquita amurallada de piedra ocre vista desde lo alto de una esquina: un macizo minarete cuadrado de tres cuerpos a la izquierda, largos muros con pesados contrafuertes, un patio con arcadas y pequeñas cúpulas acanaladas, bajo un cielo brumoso; hay sombrillas en la calle de abajo."
  tr: "Toprak sarısı taştan, surlarla çevrili büyük bir cami bir köşenin üzerinden görülüyor: solda üç katlı iri bir kare minare, ağır payandalı uzun duvarlar, revaklı bir avlu ve küçük kaburgalı kubbeler, puslu bir gökyüzünün altında; aşağıdaki sokakta şemsiyeler duruyor."
  id: "Masjid besar bertembok dari batu berwarna oker terlihat dari atas salah satu sudutnya: menara persegi masif tiga tingkat di sebelah kiri, tembok panjang dengan penopang berat, halaman berarkade, dan kubah-kubah kecil beralur, di bawah langit berkabut; payung-payung berdiri di jalan di bawahnya."
