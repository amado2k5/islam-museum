summary:
  ar: "تُظهر الصورة جامع القيروان من خارج أسواره، بمئذنته ذات الطوابق الثلاثة وسوره المدعّم ودعائمه وقباب بيت الصلاة. صورة التقطها weetoon66 في 15 أبريل 2010، من ويكيميديا كومنز، بترخيص CC BY-SA 2.0."
  en: "The photograph shows the Great Mosque of Qayrawan from outside its walls, with the three-tiered minaret, the buttressed enclosure and the domes of the prayer hall. Photograph by weetoon66, 15 April 2010, on Wikimedia Commons, licensed CC BY-SA 2.0."
  ur: "تصویر میں جامع قیروان اس کی فصیل کے باہر سے دکھائی دیتی ہے، تین منزلوں والے مینار، سہاروں والی فصیل اور نماز گاہ کے گنبدوں کے ساتھ۔ تصویر: weetoon66، 15 اپریل 2010ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.0۔"
  fr: "La photographie montre la Grande Mosquée de Kairouan depuis l'extérieur de ses murs, avec le minaret à trois étages, l'enceinte contrebutée et les coupoles de la salle de prière. Photographie : weetoon66, 15 avril 2010, sur Wikimedia Commons, sous licence CC BY-SA 2.0."
  es: "La fotografía muestra la Gran Mezquita de Kairuán desde fuera de sus muros, con el minarete de tres cuerpos, el recinto con contrafuertes y las cúpulas de la sala de oración. Fotografía de weetoon66, 15 de abril de 2010, en Wikimedia Commons, con licencia CC BY-SA 2.0."
  tr: "Fotoğraf, Kayrevan Camii'ni surlarının dışından, üç katlı minaresi, payandalı çevre duvarı ve namaz salonunun kubbeleriyle birlikte gösteriyor. Fotoğraf: weetoon66, 15 Nisan 2010; Wikimedia Commons, CC BY-SA 2.0 lisansı."
  id: "Foto ini menampilkan Masjid Kairouan dari luar tembok-temboknya, dengan menara tiga tingkat, tembok berpenopang, dan kubah-kubah ruang salat. Foto oleh weetoon66, 15 April 2010, di Wikimedia Commons, berlisensi CC BY-SA 2.0."
