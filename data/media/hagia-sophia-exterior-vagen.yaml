summary:
  ar: "تُظهر الصورة آيا صوفيا في إسطنبول من الخارج، وقبتها الكبرى ومآذنها الأربع ترتفع فوق الأشجار. صورة التقطها Arild Vågen في 1 مارس 2013، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the exterior of Hagia Sophia in Istanbul, its great dome and four minarets rising above trees. Photograph by Arild Vågen, 1 March 2013, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں استنبول کی آیا صوفیہ باہر سے دکھائی دیتی ہے، اس کا عظیم گنبد اور چاروں مینار درختوں کے اوپر بلند ہیں۔ تصویر: Arild Vågen، 1 مارچ 2013ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre l'extérieur de Sainte-Sophie à Istanbul, sa grande coupole et ses quatre minarets s'élevant au-dessus des arbres. Photographie : Arild Vågen, 1er mars 2013, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra el exterior de Santa Sofía en Estambul, con su gran cúpula y sus cuatro minaretes que se elevan sobre los árboles. Fotografía de Arild Vågen, 1 de marzo de 2013, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, İstanbul'daki Ayasofya'nın dışını gösteriyor; büyük kubbesi ve dört minaresi ağaçların üzerinde yükseliyor. Fotoğraf: Arild Vågen, 1 Mart 2013; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Hagia Sophia di Istanbul dari luar, dengan kubah besarnya dan empat menaranya yang menjulang di atas pepohonan. Foto oleh Arild Vågen, 1 Maret 2013, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
