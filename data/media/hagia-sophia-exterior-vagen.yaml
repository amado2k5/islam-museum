alt:
  ar: "مبنى كبير بجدران مائلة إلى الحمرة تعلوه قبة مركزية واسعة وتحيط به أربع مآذن، وعند قاعدته قباب أصغر وأمامه أشجار عارية، تحت سماء زرقاء صافية."
  en: "A large building with reddish walls, a wide central dome and four minarets, with smaller domes at its foot and bare trees in front, under a clear blue sky."
  ur: "ایک بڑی عمارت جس کی دیواریں سرخی مائل ہیں، اوپر وسیع مرکزی گنبد ہے اور اس کے گرد چار مینار ہیں، اس کے دامن میں چھوٹے گنبد ہیں اور سامنے ننگے درخت ہیں، صاف نیلے آسمان تلے۔"
  fr: "Un grand édifice aux murs rougeâtres, avec une large coupole centrale et quatre minarets, de petites coupoles à sa base et des arbres dénudés devant, sous un ciel bleu dégagé."
  es: "Un gran edificio de muros rojizos, con una amplia cúpula central y cuatro minaretes, con cúpulas más pequeñas a su pie y árboles desnudos delante, bajo un cielo azul despejado."
  tr: "Duvarları kırmızımsı büyük bir yapı; üstünde geniş bir ana kubbe var, çevresinde dört minare yükseliyor, eteğinde daha küçük kubbeler ve önünde çıplak ağaçlar bulunuyor, açık mavi bir gökyüzünün altında."
  id: "Bangunan besar berdinding kemerahan dengan kubah tengah yang lebar dan empat menara di sekelilingnya, dengan kubah-kubah yang lebih kecil di kakinya dan pohon-pohon gundul di depannya, di bawah langit biru yang cerah."
