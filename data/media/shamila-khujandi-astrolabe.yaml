alt:
  ar: "أسطرلاب مسطح من عصر بني بويه موقّع بحامد بن الخضر الخجندي بتاريخ 374هـ ⁦(984–985م)⁩، محفوظ في متحف الفن الإسلامي بالدوحة؛ يعرض الصفائح والدبوس والمؤشر، وهو أسطرلاب الصانع لا الآلة الشاملة التي لا مثال باقياً لها."
  en: "Flat brass planispheric astrolabe of the Buyid period, signed by Hamid ibn al-Khidr al-Khujandi and dated 374 AH (984-985), held by the Museum of Islamic Art, Doha; it shows plates, pin and alidade — the maker's astrolabe, not the shamila, for which no example survives."
  ur: "بوئی دور کا چپٹا پیتل کا کروی اسطرلاب، جس پر حامد بن الخضر خجندی کے دستخط اور 374ھ ⁦(984–985ء)⁩ کی تاریخ ہے، دوحہ کے میوزیم آف اسلامک آرٹ میں محفوظ؛ اس میں تختیاں، مرکزی پن اور سوئی نما اشارے دکھائی دیتے ہیں — یہ صانع کا اسطرلاب ہے، شاملہ نہیں جس کا کوئی نمونہ باقی نہیں۔"
