summary:
  ar: "صورة كومنز لأسطرلاب من عصر بني بويه موقّع بحامد بن الخضر الخجندي سنة 374هـ ⁦(984–985م)⁩ ومحفوظ في متحف الفن الإسلامي بالدوحة؛ هو آلة أخرى للصانع نفسه، لا نموذجاً للشاملة التي لم يبق لها مثال."
  en: "Commons photograph of a Buyid-period astrolabe signed by Hamid ibn al-Khidr al-Khujandi in 374 AH (984-985) and held by Doha's Museum of Islamic Art; it is another instrument by the same maker, not a surviving shamila, of which no example remains."
  ur: "کومنز پر فرینچسکو بینی کی تصویر: بوئی دور کا اسطرلاب جس پر حامد بن الخضر خجندی کے دستخط ہیں اور جو 374ھ ⁦(984–985ء)⁩ کا ہے، دوحہ کے میوزیم آف اسلامک آرٹ میں محفوظ؛ یہ اسی صانع کا دوسرا آلہ ہے، شاملہ کا نمونہ نہیں جو باقی نہیں رہا۔"
  es: "Fotografía de Commons de un astrolabio del período Buyid firmado por Hamid ibn al-Khidr al-Khujandi en el año 374 AH (984-985) y que se conserva en el Museo de Arte Islámico de Doha; se trata de otro instrumento del mismo fabricante, no de una shamila que haya sobrevivido, de la cual no queda ningún ejemplar."
  fr: "Photographie Commons d'un astrolabe de la période Bouyide signé par Hamid ibn al-Khidr al-Khujandi en 374 AH (984-985) et conservé par le Musée d'art islamique de Doha; il s'agit d'un autre instrument du même fabricant, et non d'un shamila survivant, dont aucun exemplaire ne subsiste."
