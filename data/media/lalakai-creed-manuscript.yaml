summary:
  ar: "مخطوط عربي عنوانه «كتاب بخط عربي عن الإيمان ومصادره وأصوله» محفوظ في متحف أمستردام العالمي ⁦(رقم TMnr 674-808)⁩، زودته المؤسسة للصورة برخصة المشاركة بالمثل؛ شاهد سياقي على تقليد الكتب العقدية لا نسخة من كتاب الللكائي."
  en: "An Arabic manuscript catalogued as a book on faith and its sources and foundations, held by Amsterdam's World Museum (TMnr 674-808); the institution supplied the image under share-alike terms. A contextual witness to the creed-book tradition, not a copy of al-Lalaka'i's work."
  ur: "ایمان اور اس کے ماخذ و اصول پر ایک عربی مخطوطہ جو امسٹرڈیم کے عالمی عجائب گھر ⁦(نمبر TMnr 674-808)⁩ میں محفوظ ہے؛ ادارے نے تصویر شراکت کی شرائط پر فراہم کی۔ عقیدہ کی کتابوں کی روایت کا سیاقی گواہ، للاکائی کی کتاب کی نقل نہیں۔"
  es: "Manuscrito árabe catalogado como un libro sobre la fe, sus fuentes y fundamentos, perteneciente al Museo Mundial de Ámsterdam (TMnr 674-808); la institución proporcionó la imagen bajo condiciones de uso compartido. Se trata de un testimonio contextual de la tradición de los libros de doctrina, no una copia de la obra de al-Lalaka'i."
  fr: "Manuscrit arabe catalogué comme ouvrage sur la foi, ses sources et ses fondements, conservé au World Museum d'Amsterdam (TMnr 674-808); l'institution a fourni l'image sous licence de partage à l'identique. Témoignage contextuel de la tradition des livres de croyance, et non une copie de l'œuvre d'al-Lalaka'i."
  tr: "Vakfın görsel için sağladığı ve paylaşım lisansını da verdiği, Amsterdam Dünya Müzesi'nde (TMnr 674-808 numarasıyla) muhafaza edilen, \"İman, Kaynakları ve Kökenleri Üzerine Arapça Yazılı Bir Kitap\" başlıklı Arapça el yazması; doktrin kitapları geleneğine bağlamsal bir tanıklık niteliğindedir, El-Lalaka'i'nin kitabının bir kopyası değildir."
  id: "Sebuah manuskrip berbahasa Arab berjudul “Sebuah Kitab dalam Aksara Arab tentang Iman, Sumber dan Asal-usulnya,” yang disimpan di Museum Dunia Amsterdam (nomor TMnr 674-808), yang disediakan oleh Yayasan untuk gambar tersebut dengan lisensi untuk dibagikan juga; sebuah saksi kontekstual terhadap tradisi kitab-kitab doktrinal, bukan salinan dari kitab al-Lalaka’i."
