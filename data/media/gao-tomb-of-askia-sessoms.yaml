summary:
  ar: "تُظهر الصورة ضريح أسكيا في غاو، وهو برج ترابي تبرز منه أوتاد خشبية، خلف سور فنائه. صورة التقطها David Sessoms في 18 سبتمبر 2006، من ويكيميديا كومنز، بترخيص CC BY-SA 2.0."
  en: "The photograph shows the Tomb of Askia at Gao, an earthen tower studded with wooden stakes, behind its enclosure wall. Photograph by David Sessoms, 18 September 2006, on Wikimedia Commons, licensed CC BY-SA 2.0."
  ur: "تصویر میں غاو میں اسکیا کا مقبرہ دکھائی دیتا ہے، جو لکڑی کی میخوں سے بھرا مٹی کا برج ہے، اپنی چار دیواری کے پیچھے۔ تصویر: David Sessoms، 18 ستمبر 2006ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.0۔"
  fr: "La photographie montre le tombeau d'Askia à Gao, une tour de terre hérissée de pieux de bois, derrière son mur d'enceinte. Photographie : David Sessoms, 18 septembre 2006, sur Wikimedia Commons, sous licence CC BY-SA 2.0."
  es: "La fotografía muestra la tumba de Askia en Gao, una torre de tierra salpicada de estacas de madera, detrás de su muro de cerramiento. Fotografía de David Sessoms, 18 de septiembre de 2006, en Wikimedia Commons, con licencia CC BY-SA 2.0."
  tr: "Fotoğraf, Gao'daki Askia Türbesi'ni, ahşap kazıklarla dolu toprak bir kule olarak, çevre duvarının arkasında gösteriyor. Fotoğraf: David Sessoms, 18 Eylül 2006; Wikimedia Commons, CC BY-SA 2.0 lisansı."
  id: "Foto ini menampilkan Makam Askia di Gao, menara tanah yang dipenuhi pasak kayu, di balik tembok pagarnya. Foto oleh David Sessoms, 18 September 2006, di Wikimedia Commons, berlisensi CC BY-SA 2.0."
