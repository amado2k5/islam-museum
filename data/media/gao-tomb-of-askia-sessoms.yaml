depicts: [place/gao]
alt:
  ar: "برج ترابي مدرّج تبرز منه أوتاد خشبية يرتفع خلف سور ترابي طويل؛ وشجرة كبيرة مورقة تظلّل بضعة أشخاص ودواب على الأرض الرملية أمامه، تحت سماء باهتة."
  en: "A stepped earthen tower bristling with wooden stakes rises behind a long earthen wall; a large leafy tree shades a few people and animals on the sandy ground in front, under a pale sky."
  ur: "لکڑی کی میخوں سے بھرا ہوا زینہ دار مٹی کا برج ایک لمبی مٹی کی دیوار کے پیچھے بلند ہے؛ ایک بڑا پتوں بھرا درخت سامنے ریتیلی زمین پر چند لوگوں اور جانوروں پر سایہ کیے ہوئے ہے، ہلکے آسمان تلے۔"
  fr: "Une tour de terre à gradins hérissée de pieux de bois s'élève derrière un long mur de terre ; un grand arbre feuillu ombrage quelques personnes et animaux sur le sol sablonneux devant, sous un ciel pâle."
  es: "Una torre de tierra escalonada erizada de estacas de madera se alza detrás de un largo muro de tierra; un gran árbol frondoso da sombra a unas pocas personas y animales sobre el suelo arenoso de delante, bajo un cielo pálido."
  tr: "Ahşap kazıklarla dolu, basamaklı toprak bir kule uzun bir toprak duvarın arkasında yükseliyor; geniş yapraklı büyük bir ağaç, önündeki kumlu zeminde birkaç insana ve hayvana gölge veriyor, soluk bir gökyüzünün altında."
  id: "Menara tanah berundak yang dipenuhi pasak kayu menjulang di balik tembok tanah yang panjang; pohon besar berdaun lebat menaungi beberapa orang dan hewan di tanah berpasir di depannya, di bawah langit pucat."
