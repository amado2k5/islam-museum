  "es": "Fragmento coránico en escritura Rayhani, Biblioteca del Congreso"
  "fr": "Fragment coranique en écriture rayhani, Bibliothèque du Congrès"
  "tr": "Kongre Kütüphanesi'nde bulunan Rihani yazısıyla yazılmış bir Kur'an parçası."
  "id": "Sebuah fragmen Al-Qur'an dalam aksara Rihani, Perpustakaan Kongres."
"summary":
  "ar": "صورة لقطعة قرآنية من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن الثالث عشر في إيران على الأرجح، فيها البسملة والآيات ١ إلى ١٤ من سورة التكوير بخط الريحاني. تخدم مثالًا على الريحان، الصورة الأصغر من المحقق، وقد كُتبت به مصاحف كاملة كما استُعمل في العناوين والصفحات المزخرفة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress Qur'anic fragment that the file page dates to probably 13th century Iran, with the basmala and verses 1 to 14 of sura 81, al-Takwir, in Rayhani script. It serves as an example of Rayhan, the smaller sibling of Muhaqqaq, used for full mushafs as well as headings and decorated pages. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک قرآنی ٹکڑے کی تصویر جسے فائل کا صفحہ غالباً تیرھویں صدی کے ایران سے منسوب کرتا ہے، جس میں بسم اللہ اور سورۂ تکویر کی آیات ۱ تا ۱۴ ریحانی خط میں ہیں۔ یہ ریحان کی مثال ہے، جو محقق کی چھوٹی صورت ہے اور جس میں مکمل مصاحف بھی لکھے گئے اور عنوانات اور آراستہ صفحات بھی۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un fragmento coránico de la Biblioteca del Congreso, cuya página de archivo data probablemente del siglo XIII en Irán. Contiene la basmala y los versículos 1 al 14 de la sura 81, al-Takwir, en escritura Rayhani. Sirve como ejemplo de Rayhan, la variante menor de Muhaqqaq, utilizada para manuscritos completos, así como para encabezados y páginas decoradas. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un fragment coranique de la Bibliothèque du Congrès, datant probablement du XIIIe siècle en Iran, avec la basmala et les versets 1 à 14 de la sourate 81, al-Takwir, en écriture rayhani. Ce fragment illustre l'utilisation du rayhan, une variante plus petite du muhaqqaq, employée pour les manuscrits complets (mushafs), ainsi que pour les titres et les pages ornées. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Kongre Kütüphanesi'nden, dosya sayfasından muhtemelen 13. yüzyıl İran'ına tarihlenen, Besmele ve Tekvir Suresi'nin 1-14. ayetlerini Rayhani yazısıyla içeren bir Kur'an parçasının fotoğrafı. Bu, Rayhani yazısının bir örneğidir; daha küçük versiyonu yetkili kabul edilir ve Kur'an'ın tamamının yanı sıra başlıklar ve süsleme sayfaları için de kullanılmıştır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto fragmen Al-Qur'an dari Perpustakaan Kongres, yang berdasarkan halaman arsipnya kemungkinan berasal dari Iran abad ke-13, berisi Basmala dan ayat 1-14 Surah At-Takwir dalam aksara Rayhani. Foto ini berfungsi sebagai contoh aksara Rayhani, yang versi kecilnya dianggap otoritatif, dan digunakan untuk menulis seluruh Al-Qur'an, serta untuk judul dan halaman dekoratif. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
