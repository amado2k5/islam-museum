"summary":
  "ar": "صورة لفرمان صادر عن الحاكم الآق قوينلو يعقوب، بلاد فارس، مؤرخ في ١٩ جمادى الآخرة، مأخوذة من فهرس سوذبيز. وتقول صفحة الملف إن فيه ثمانية أسطر من خط التوقيع الجليل بالذهب مع ضبط بالأسود، تليها خمسة عشر سطرًا بخط التعليق الأسود وأثر ختم واحد، وفي ظهره تسعة آثار أختام، على ورق كريمي مصفر. تخدم مثالًا على التوقيع، قرين الثلث الأصغر الذي توصل فيه حروف لا توصل عادةً وصلًا منتظمًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of an edict of the Aq Qoyunlu ruler Ya'qub, Persia, dated 19 Jumada II, drawn from a Sotheby's catalogue. The file page says it has eight lines of monumental tawqi' script in gold with vocalisation in black, followed by fifteen lines of ta'liq in black and one seal impression, the reverse with nine seal impressions, on buff cream paper. It serves as an example of Tawqi', a smaller cousin of Thuluth in which letters that are ordinarily not joined are linked systematically. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "آق قوینلو حکمران یعقوب کے ایک فرمان کی تصویر، ایران، ۱۹ جمادی الثانی کی تاریخ، سودبیز کے فہرست سے لی گئی۔ فائل کا صفحہ کہتا ہے کہ اس میں سنہری عظیم توقیع کی آٹھ سطریں سیاہ اعراب کے ساتھ ہیں، پھر سیاہ تعلیق کی پندرہ سطریں اور ایک مہر کا نقش، پشت پر نو مہروں کے نقش، زردی مائل کریمی کاغذ پر۔ یہ توقیع کی مثال ہے، جو ثلث کی چھوٹی قرین ہے اور جس میں وہ حروف بھی باقاعدگی سے جوڑ دیے جاتے ہیں جو عام طور پر نہیں جڑتے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un edicto del gobernante Aq Qoyunlu Ya'qub, de Persia, fechado el 19 de Jumada II, extraída de un catálogo de Sotheby's. La página del archivo indica que tiene ocho líneas de escritura monumental tawqi' en oro con vocalización en negro, seguidas de quince líneas de ta'liq en negro y una impresión de sello; el reverso presenta nueve impresiones de sello, sobre papel color crema. Sirve como ejemplo de Tawqi', una variante menor del Thuluth en la que las letras que normalmente no se unen están enlazadas sistemáticamente. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un édit du souverain Aq Qoyunlu Ya'qub, en Perse, daté de l'an 19 Jumada II, extraite d'un catalogue Sotheby's. La fiche descriptive indique qu'il comporte huit lignes d'écriture monumentale tawqi' en lettres d'or avec vocalisation en noir, suivies de quinze lignes de ta'liq en noir et d'une empreinte de sceau. Le verso présente neuf empreintes de sceau, sur papier crème chamois. Cet édit est un exemple de tawqi', une variante plus petite du thuluth, où les lettres habituellement non liées sont enchaînées de manière systématique. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Sotheby's kataloğundan alınan, İran'ın Ak Koyunlu hükümdarı Yakub tarafından 19 Cemâdî Sanî tarihinde çıkarılan bir fermanın fotoğrafı. Dosya sayfasında, altın yaldızlı ve siyah diyakritik işaretli sekiz satırlık ünlü imzanın, ardından on beş satırlık siyah Naskh yazısının ve bir mühür baskısının yer aldığı belirtiliyor. Arka yüzünde ise krem rengi kağıt üzerine dokuz mühür baskısı bulunuyor. Harflerin genellikle birleştirilmediği bir şekilde birleştirildiği, küçük üçüncü şahıs stiline benzer bir imza örneği olarak hizmet ediyor. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto sebuah dekrit yang dikeluarkan oleh penguasa Aq Qoyunlu, Yaqub dari Persia, bertanggal 19 Jumada al-Thani, diambil dari katalog Sotheby's. Halaman arsip menyatakan bahwa dekrit tersebut berisi delapan baris tanda tangan yang terkenal dalam warna emas dengan diakritik hitam, diikuti oleh lima belas baris dalam aksara Naskh hitam dan satu cap stempel. Sisi baliknya memuat sembilan cap stempel, semuanya pada kertas berwarna krem. Ini berfungsi sebagai contoh tanda tangan, mirip dengan gaya orang ketiga minor di mana huruf-huruf digabungkan dengan cara yang biasanya tidak digabungkan. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
