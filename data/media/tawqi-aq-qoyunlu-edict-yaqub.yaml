  "en": "Edict of the Aq Qoyunlu ruler Ya'qub: monumental Tawqi' above Ta'liq"
  "ur": "آق قوینلو حکمران یعقوب کا فرمان: اوپر عظیم توقیع، نیچے تعلیق"
"summary":
  "ar": "صورة لفرمان صادر عن الحاكم الآق قوينلو يعقوب، بلاد فارس، مؤرخ في ١٩ جمادى الآخرة، مأخوذة من فهرس سوذبيز. وتقول صفحة الملف إن فيه ثمانية أسطر من خط التوقيع الجليل بالذهب مع ضبط بالأسود، تليها خمسة عشر سطرًا بخط التعليق الأسود وأثر ختم واحد، وفي ظهره تسعة آثار أختام، على ورق كريمي مصفر. تخدم مثالًا على التوقيع، قرين الثلث الأصغر الذي توصل فيه حروف لا توصل عادةً وصلًا منتظمًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of an edict of the Aq Qoyunlu ruler Ya'qub, Persia, dated 19 Jumada II, drawn from a Sotheby's catalogue. The file page says it has eight lines of monumental tawqi' script in gold with vocalisation in black, followed by fifteen lines of ta'liq in black and one seal impression, the reverse with nine seal impressions, on buff cream paper. It serves as an example of Tawqi', a smaller cousin of Thuluth in which letters that are ordinarily not joined are linked systematically. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "آق قوینلو حکمران یعقوب کے ایک فرمان کی تصویر، ایران، ۱۹ جمادی الثانی کی تاریخ، سودبیز کے فہرست سے لی گئی۔ فائل کا صفحہ کہتا ہے کہ اس میں سنہری عظیم توقیع کی آٹھ سطریں سیاہ اعراب کے ساتھ ہیں، پھر سیاہ تعلیق کی پندرہ سطریں اور ایک مہر کا نقش، پشت پر نو مہروں کے نقش، زردی مائل کریمی کاغذ پر۔ یہ توقیع کی مثال ہے، جو ثلث کی چھوٹی قرین ہے اور جس میں وہ حروف بھی باقاعدگی سے جوڑ دیے جاتے ہیں جو عام طور پر نہیں جڑتے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
