  "ar": "فرمان الإيلخان كيخاتو، حزيران ١٢٩٢م، بخط التعليق"
  "en": "Farman of the Ilkhan Gaykhatu, June 1292, Taliq script"
  "ur": "ایلخان گیخاتو کا فرمان، جون ۱۲۹۲ء، تعلیق خط"
"summary":
  "ar": "صورة لفرمان كيخاتو، حزيران ١٢٩٢م، مقاسه ١٠٥ في ٣٤ سم، تذكر صفحة الملف أنه بخط التعليق، مجموعة الفن والتاريخ LTS1995.2.9، عن كتاب في فن البلاطات الفارسية. تخدم مثالًا على التعليق، الخط الديواني «المعلّق» الذي استُعمل في المراسيم والوثائق لا في المصاحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the Gaykhatu Farman, June 1292, 105 by 34 cm, which the file page lists as in Taliq script, Art and History Collection LTS1995.2.9, from a book on the art of the Persian courts. It serves as an example of Ta'liq, the 'hanging' chancery hand used for decrees and documents rather than for the Qur'an. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "گیخاتو فرمان، جون ۱۲۹۲ء، ۱۰۵ ضرب ۳۴ سینٹی میٹر کی تصویر؛ فائل کا صفحہ اسے تعلیق خط میں بتاتا ہے، آرٹ اینڈ ہسٹری کلیکشن LTS1995.2.9، فارسی درباروں کے فن پر ایک کتاب سے۔ یہ تعلیق کی مثال ہے، وہ «معلّق» دفتری خط جو فرامین اور دستاویزات میں استعمال ہوا، مصاحف میں نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
