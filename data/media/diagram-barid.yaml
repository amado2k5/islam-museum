summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط بريد معاوية بن أبي سفيان، وعن يمينه ما سبقه، وعن يساره ما جاء بعده من أنظمة البريد كما تذكرها المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: Mu'awiya ibn Abi Sufyan's barid in the middle, what came before it on one side and the later post systems the sources name on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں معاویہ بن ابی سفیان کی برید، ایک طرف وہ جو اس سے پہلے تھا اور دوسری طرف بعد کے وہ ڈاک کے نظام جن کا ذکر مآخذ میں ہے۔"
