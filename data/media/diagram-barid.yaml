alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه ثلاثة مربعات بإطار متقطع: بريد الأكاسرة (الفرس الساسانيين)، وبريد القياصرة (الروم)، ورسل النبي إلى الملوك ودور البريد في عهد عمر. في الوسط مربع بإطار سميك: البريد، معاوية بن أبي سفيان. العمود الأخير بعنوان: بُني عليه، وفيه أربعة مربعات: إحكام عبد الملك بن مروان للبريد وصاحب البريد، وديوان البريد العباسي، وبريد المماليك الذي أحياه الظاهر بيبرس، ونظام المنزل العثماني والبريد الحديث"
  en: "Three columns joined by two arrows. The first column, headed Built on, holds three dashed boxes: the post of the Persian (Sasanian) kings; the Byzantine imperial post; the Prophet's envoys and the post houses of Umar's time. In the middle a box with a thick border: The barid, Mu'awiya ibn Abi Sufyan. The last column, headed Built on it, holds four boxes: Abd al-Malik ibn Marwan's perfected barid and its sahib al-barid; the Abbasid diwan al-barid; the Mamluk barid revived by al-Zahir Baybars; the Ottoman menzil system and the modern post"
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے تین خانے ہیں: فارس کے (ساسانی) بادشاہوں کی ڈاک؛ رومی قیصروں کی ڈاک؛ نبی کے سفیر اور عمر کے دور کے ڈاک خانے۔ درمیان میں موٹے کنارے والا خانہ: برید، معاویہ بن ابی سفیان۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چار خانے ہیں: عبد الملک بن مروان کا پختہ کیا ہوا برید اور صاحبِ برید؛ عباسی دیوانِ برید؛ الظاہر بیبرس کا دوبارہ زندہ کیا ہوا مملوک برید؛ عثمانی منزل کا نظام اور جدید ڈاک"
