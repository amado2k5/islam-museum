summary:
  ar: "صورة حديثة لناعورة نهر تاجة عند سفونت في طليطلة التقطها تامورلان؛ عضو حي في تقليد النواعير الأندلسية يُعرض سياقًا لا دليلًا على بيلتا المقري."
  en: "A modern photograph of the Tagus river noria at Safont in Toledo by Tamorlan; a living member of the Andalusi noria tradition shown as context, not evidence of al-Maqqari's baylatan."
  ur: "تامورلان کی جدید تصویر: طلیطلہ میں سفونٹ پر تاجہ دریا کا ناعورہ؛ اندلسی نوافل روایت کا زندہ فرد بطور سیاق، مقری کے بيلتان کا ثبوت نہیں۔"
  es: "Fotografía moderna de la noria del río Tajo en Safont, Toledo, tomada por Tamorlan; un miembro vivo de la tradición de la noria andalusí se muestra como contexto, no como evidencia del baylatan de al-Maqqari."
  fr: "Une photographie moderne de la noria du Tage à Safont à Tolède par Tamorlan; un membre vivant de la tradition andalouse de la noria est montré à titre de contexte, et non comme preuve du baylatan d'al-Maqqari."
