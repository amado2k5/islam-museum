summary:
  ar: "تُظهر الصورة واجهة المسجد الأقصى ذات العقود وقبته الرمادية في القدس عبر الساحة المبلّطة. صورة التقطها Andrew Shiva في 14 نوفمبر 2013، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the arcaded front and grey dome of the Aqsa Mosque in Jerusalem across the paved esplanade. Photograph by Andrew Shiva, 14 November 2013, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں یروشلم میں مسجد اقصیٰ کا محرابوں والا سامنے کا رخ اور اس کا خاکستری گنبد پختہ فرش والے وسیع میدان کے پار دکھائی دیتا ہے۔ تصویر: Andrew Shiva، 14 نومبر 2013ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la façade à arcades et la coupole grise de la mosquée al-Aqsa à Jérusalem au-delà de l'esplanade dallée. Photographie : Andrew Shiva, 14 novembre 2013, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la fachada con arcadas y la cúpula gris de la mezquita de al-Aqsa en Jerusalén al otro lado de la explanada pavimentada. Fotografía de Andrew Shiva, 14 de noviembre de 2013, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Kudüs'teki Mescid-i Aksa'nın kemerli cephesini ve gri kubbesini, taş döşeli meydanın ötesinden gösteriyor. Fotoğraf: Andrew Shiva, 14 Kasım 2013; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan bagian depan berarkade dan kubah abu-abu Masjid Al-Aqsa di Yerusalem dari seberang pelataran berpaving. Foto oleh Andrew Shiva, 14 November 2013, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
