alt:
  ar: "مبنى حجري طويل في واجهته صف من العقود المدببة وفي طرفه قبة رمادية داكنة، يقوم خلف ساحة مبلّطة واسعة فيها بضع كتل حجرية منخفضة، تحت سماء زرقاء داكنة."
  en: "A long stone building with a row of pointed arches along its front and a dark grey dome at one end stands beyond a wide paved esplanade with a few low stone blocks, under a deep blue sky."
  ur: "ایک لمبی پتھر کی عمارت جس کے سامنے نوکیلی محرابوں کی قطار ہے اور ایک سرے پر گہرا خاکستری گنبد ہے، پتھر کے چند پست ٹکڑوں والے وسیع پختہ میدان کے پار کھڑی ہے، گہرے نیلے آسمان تلے۔"
  fr: "Un long bâtiment de pierre, avec une rangée d'arcs brisés sur sa façade et une coupole gris foncé à une extrémité, se dresse au-delà d'une large esplanade dallée parsemée de quelques bas blocs de pierre, sous un ciel bleu profond."
  es: "Un largo edificio de piedra, con una hilera de arcos apuntados a lo largo de su frente y una cúpula gris oscuro en un extremo, se alza más allá de una amplia explanada pavimentada con unos pocos bloques de piedra bajos, bajo un cielo azul intenso."
  tr: "Önünde bir sıra sivri kemer bulunan ve bir ucunda koyu gri bir kubbe taşıyan uzun bir taş yapı, birkaç alçak taş bloğun durduğu geniş, taş döşeli bir meydanın ötesinde duruyor, koyu mavi bir gökyüzünün altında."
  id: "Bangunan batu panjang dengan deretan lengkung runcing di sepanjang depannya dan kubah abu-abu tua di salah satu ujungnya berdiri di seberang pelataran luas berpaving dengan beberapa balok batu rendah, di bawah langit biru tua."
