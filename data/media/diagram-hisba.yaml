alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه مربع واحد بإطار متقطع: الأغورانوموس اليوناني ووالي السوق البيزنطي ⁦(أصل مزعوم)⁩. في الوسط مربع بإطار سميك: الحسبة ووالي السوق، عمر بن الخطاب. العمود الأخير بعنوان: بُني عليه، وفيه ستة مربعات: صاحب السوق في العهد الأموي، والمحتسب العباسي في بغداد، وكتب الحسبة، والمحتسب في المغرب والأندلس ومصر والشام، والاحتساب العثماني، وموظف السوق في الممالك الصليبية والإسبانية والألموتاسين الإسباني."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds one dashed box: the Greek agoranomos and the Byzantine market prefect (a claimed origin). In the middle a box with a thick border: Hisba and the market inspector, Umar ibn al-Khattab. The last column, headed Built on it, holds six boxes: the Umayyad master of the market; the Abbasid muhtasib in Baghdad; the hisba manuals; the muhtasib in the Maghreb, al-Andalus, Egypt and Syria; the Ottoman ihtisab; the market officer of the Crusader and Spanish kingdoms and the Spanish almotacén."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والا ایک خانہ ہے: یونانی اگورانوموس اور بازنطینی بازار حاکم ⁦(ایک دعویٰ کردہ اصل)⁩۔ درمیان میں موٹے کنارے والا خانہ: حسبہ اور بازار کا محتسب، عمر بن الخطاب۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چھ خانے ہیں: اموی دور کا صاحب السوق؛ بغداد کا عباسی محتسب؛ حسبہ کی کتابیں؛ مغرب، اندلس، مصر اور شام میں محتسب؛ عثمانی احتساب؛ صلیبی اور ہسپانوی سلطنتوں کا بازار افسر اور ہسپانوی المتاسن۔"
