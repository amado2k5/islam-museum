label:
  ar: "رسم: ما قيل إن الحسبة بُنيت عليه وما بُني عليها"
  en: "Diagram: what the hisba is claimed to rest on and what was built on it"
  ur: "خاکہ: حسبہ کے بارے میں کیا دعویٰ ہے کہ وہ کس پر بنا اور اس پر کیا بنا"
  es: "Diagrama: sobre qué se afirma que descansa la hisba y qué se construyó sobre ella."
  fr: "Schéma: sur quoi la hisba est censée reposer et ce qui a été construit dessus."
  tr: "Çizim: Hisbah'ın temeli olduğu söylenen şey ve onun üzerine inşa edilenler."
  id: "Gambar: Apa yang dikatakan sebagai dasar hisbah dan apa yang dibangun di atasnya"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الحسبة وعمر بن الخطاب، وعن جانب الأصل اليوناني والبيزنطي المزعوم، وعن الجانب الآخر ما جاء بعدها من صاحب السوق الأموي والمحتسب العباسي وكتب الحسبة والمحتسب في المغرب ومصر والشام والاحتساب العثماني والكلمة الإسبانية almotacén."
  en: "A simple schematic drawn by the site at build time from the record's data: the hisba and Umar ibn al-Khattab in the middle, the claimed Greek and Byzantine origin on one side, and what followed on the other: the Umayyad master of the market, the Abbasid muhtasib, the hisba manuals, the muhtasib of the Maghreb, Egypt and Syria, the Ottoman ihtisab and the Spanish almotacén."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں حسبہ اور عمر بن الخطاب، ایک طرف دعویٰ کردہ یونانی اور بازنطینی اصل، اور دوسری طرف بعد میں آنے والی چیزیں: اموی صاحب السوق، عباسی محتسب، حسبہ کی کتابیں، مغرب، مصر اور شام کا محتسب، عثمانی احتساب اور ہسپانوی almotacén۔"
  es: "Un esquema sencillo dibujado por el sitio en el momento de su construcción a partir de los datos del registro: la hisba y Umar ibn al-Khattab en el centro, el supuesto origen griego y bizantino a un lado, y lo que siguió al otro: el maestro omeya del mercado, el muhtasib abasí, los manuales de la hisba, el muhtasib del Magreb, Egipto y Siria, el ihtisab otomano y el almotacén español."
  fr: "Un schéma simple dessiné par le site au moment de sa construction à partir des données des archives: la hisba et Umar ibn al-Khattab au centre, l’origine grecque et byzantine revendiquée d’un côté, et ce qui a suivi de l’autre: le maître omeyyade du marché, le muhtasib abbasside, les manuels de la hisba, le muhtasib du Maghreb, d’Égypte et de Syrie, l’ihtisab ottoman et l’almotacén espagnol."
  tr: "Yapım aşamasındaki kayıt verilerinden yola çıkarak site tarafından çizilen basit bir şema: ortada Hisbah ve Ömer İbn Al-Khattab, bir tarafta iddia edilen Yunan ve Bizans kökeni, diğer tarafta ise Emevi pazar sahibi ve Abbasi Muhtaçibi'nden sonra gelenler, Fas, Mısır ve Levant'taki Hisbah ve Muhtaçib kitapları, Osmanlı Hisbah'ı ve İspanyolca \"almotacén\" kelimesi yer almaktadır."
  id: "Diagram sederhana yang digambar oleh situs tersebut pada saat pembangunan berdasarkan data catatan: di tengah terdapat Hisbah dan Omar Ibn Al-Khattab, dan di satu sisi terdapat dugaan asal Yunani dan Bizantium, dan di sisi lain terdapat apa yang datang setelahnya dari pemilik pasar Umayyah dan Muhtasib Abbasiyah, serta buku-buku Hisbah dan Muhtasib di Maroko, Mesir, dan Levant, dan Hisbah Utsmaniyah serta kata Spanyol almotacén."
