label:
  ar: "رسم: ما قيل إن الحسبة بُنيت عليه وما بُني عليها"
  en: "Diagram: what the hisba is claimed to rest on and what was built on it"
  ur: "خاکہ: حسبہ کے بارے میں کیا دعویٰ ہے کہ وہ کس پر بنا اور اس پر کیا بنا"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الحسبة وعمر بن الخطاب، وعن جانب الأصل اليوناني والبيزنطي المزعوم، وعن الجانب الآخر ما جاء بعدها من صاحب السوق الأموي والمحتسب العباسي وكتب الحسبة والمحتسب في المغرب ومصر والشام والاحتساب العثماني والكلمة الإسبانية almotacén."
  en: "A simple schematic drawn by the site at build time from the record's data: the hisba and Umar ibn al-Khattab in the middle, the claimed Greek and Byzantine origin on one side, and what followed on the other: the Umayyad master of the market, the Abbasid muhtasib, the hisba manuals, the muhtasib of the Maghreb, Egypt and Syria, the Ottoman ihtisab and the Spanish almotacén."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں حسبہ اور عمر بن الخطاب، ایک طرف دعویٰ کردہ یونانی اور بازنطینی اصل، اور دوسری طرف بعد میں آنے والی چیزیں: اموی صاحب السوق، عباسی محتسب، حسبہ کی کتابیں، مغرب، مصر اور شام کا محتسب، عثمانی احتساب اور ہسپانوی almotacén۔"
