label:
  ar: "رسم: ما بُني عليه الوقف وما بُني عليه"
  en: "Diagram: what waqf rests on and what was built on it"
  ur: "خاکہ: وقف کس پر قائم ہے اور اس پر کیا بنا"
  es: "Diagrama: en qué se basa el waqf y qué se construyó sobre él."
  fr: "Schéma: sur quoi repose le waqf et ce qui a été construit dessus"
  tr: "Çizim: Vakfın temeli ve üzerine inşa edildiği unsurlar."
  id: "Menggambar: Apa yang menjadi dasar pemberian dana abadi tersebut dan apa yang dibangun di atasnya."
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الوقف وعمر بن الخطاب، وعن جانب الإنفاق والصدقة في القرآن والسنة، وعن الجانب الآخر ما جاء بعده من ديوان الأحباس وديوان البر وأقدم وقفية مصرية والمدارس الوقفية والعمارات والمستشفيات ووقف النقود العثماني ونظارة الأوقاف ووزاراتها الحديثة."
  en: "A simple schematic drawn by the site at build time from the record's data: waqf and Umar ibn al-Khattab in the middle, spending and charity in the Qur'an and Sunna on one side, and on the other what followed: the diwans of ahbas and birr, the oldest Egyptian deed, the waqf madrasa, the soup kitchens and hospitals, the Ottoman cash waqf and the ministries of awqaf."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں وقف اور عمر بن الخطاب، ایک طرف قرآن و سنت میں انفاق اور صدقہ، اور دوسری طرف بعد میں آنے والی چیزیں: دیوان الاحباس اور دیوان البر، مصر کی سب سے پرانی وقفیہ، وقفی مدرسہ، لنگر خانے اور ہسپتال، عثمانی نقدی وقف اور اوقاف کی وزارتیں۔"
  es: "Un esquema sencillo dibujado por el sitio en el momento de su construcción a partir de los datos del registro: el waqf y Umar ibn al-Khattab en el centro, el gasto y la caridad en el Corán y la Sunna a un lado, y al otro lo que siguió: los diwanes de ahbas y birr, la escritura egipcia más antigua, la madrasa waqf, los comedores sociales y hospitales, el waqf en efectivo otomano y los ministerios de awqaf."
  fr: "Un schéma simple dessiné par le site au moment de sa construction à partir des données des archives: le waqf et Umar ibn al-Khattab au centre, les dépenses et la charité dans le Coran et la Sunna d’un côté, et de l’autre ce qui a suivi: les diwans des ahbas et des birr, le plus ancien acte égyptien, la madrasa du waqf, les soupes populaires et les hôpitaux, le waqf ottoman en espèces et les ministères des awqaf."
  tr: "Yapım aşamasındaki kayıtlardan yola çıkarak site tarafından çizilen basit bir şema: ortada vakıf ve Ömer İbn Hattab, bir tarafta Kur'an ve Sünnette yer alan harcama ve sadaka, diğer tarafta ise ondan sonra gelen Vakıflar Divanı, Sadaka Divanı, en eski Mısır vakfı, vakıf okulları, binalar, hastaneler, Osmanlı sikke vakfı, Vakıflar Bakanlığı ve modern bakanlıkları yer almaktadır."
  id: "Diagram sederhana yang digambar oleh pihak pengelola situs pada saat pembangunan berdasarkan data catatan: di tengah, wakaf dan Umar Ibn Al-Khattab, dan di sisi lain, pengeluaran dan sedekah dalam Al-Qur'an dan Sunnah, dan di sisi lainnya, apa yang datang setelahnya dari Diwan Wakaf, Diwan Amal, wakaf tertua Mesir, sekolah-sekolah wakaf, bangunan, rumah sakit, wakaf koin Ottoman, Kementerian Wakaf dan kementerian-kementerian modernnya."
