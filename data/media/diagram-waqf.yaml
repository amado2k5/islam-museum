label:
  ar: "رسم: ما بُني عليه الوقف وما بُني عليه"
  en: "Diagram: what waqf rests on and what was built on it"
  ur: "خاکہ: وقف کس پر قائم ہے اور اس پر کیا بنا"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الوقف وعمر بن الخطاب، وعن جانب الإنفاق والصدقة في القرآن والسنة، وعن الجانب الآخر ما جاء بعده من ديوان الأحباس وديوان البر وأقدم وقفية مصرية والمدارس الوقفية والعمارات والمستشفيات ووقف النقود العثماني ونظارة الأوقاف ووزاراتها الحديثة."
  en: "A simple schematic drawn by the site at build time from the record's data: waqf and Umar ibn al-Khattab in the middle, spending and charity in the Qur'an and Sunna on one side, and on the other what followed: the diwans of ahbas and birr, the oldest Egyptian deed, the waqf madrasa, the soup kitchens and hospitals, the Ottoman cash waqf and the ministries of awqaf."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں وقف اور عمر بن الخطاب، ایک طرف قرآن و سنت میں انفاق اور صدقہ، اور دوسری طرف بعد میں آنے والی چیزیں: دیوان الاحباس اور دیوان البر، مصر کی سب سے پرانی وقفیہ، وقفی مدرسہ، لنگر خانے اور ہسپتال، عثمانی نقدی وقف اور اوقاف کی وزارتیں۔"
