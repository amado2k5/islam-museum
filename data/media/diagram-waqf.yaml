alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه مربع واحد: الإنفاق في سبيل الله والصدقة في القرآن والسنة. في الوسط مربع بإطار سميك: الوقف، عمر بن الخطاب. العمود الأخير بعنوان: بُني عليه، وفيه ستة مربعات: ديوان الأحباس الأموي وديوان البر العباسي، وأقدم وقفية لأرض زراعية في مصر سنة 307هـ، والمدارس الوقفية، والعمارات والمستشفيات والسبل، ووقف النقود العثماني وفتوى أبي السعود، ونظارة الأوقاف العثمانية ووزارات الأوقاف الحديثة."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds one box: spending in the way of God and charity in the Qur'an and the Sunna. In the middle a box with a thick border: Waqf, Umar ibn al-Khattab. The last column, headed Built on it, holds six boxes: the Umayyad diwan of ahbas and the Abbasid diwan of birr; the oldest known deed endowing farmland in Egypt, 307 AH; the waqf madrasa; waqf soup kitchens, hospitals, fountains and public works; the Ottoman cash waqf and Ebussuud's fatwa; the Ottoman Ministry of Imperial Waqfs and modern ministries of awqaf."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ایک خانہ ہے: قرآن و سنت میں اللہ کی راہ میں خرچ اور صدقہ۔ درمیان میں موٹے کنارے والا خانہ: وقف، عمر بن الخطاب۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چھ خانے ہیں: اموی دیوان الاحباس اور عباسی دیوان البر؛ مصر میں زرعی زمین کی سب سے پرانی وقفیہ، 307ھ؛ وقفی مدرسہ؛ وقفی لنگر خانے، ہسپتال، سبیلیں اور رفاہی کام؛ عثمانی نقدی وقف اور ابو السعود کا فتویٰ؛ عثمانی نظارتِ اوقاف اور جدید وزارتِ اوقاف۔"
