depicts: [place/balkh]
alt:
  ar: "بوابة عالية ذات عقد من آجر فاتح تتخلله بقع من البلاط الأزرق، وخلفها قبة فيروزية مضلّعة، وأمامها أشجار فتية وممر تحت سماء زرقاء صافية."
  en: "A tall arched portal of pale brick with patches of blue tilework stands before a ribbed turquoise dome, with young trees and a path in front under a clear blue sky."
  ur: "ہلکی اینٹوں کا ایک بلند محرابی پورٹل جس میں نیلی ٹائلوں کے ٹکڑے ہیں، ایک دھاری دار فیروزی گنبد کے سامنے کھڑا ہے، سامنے نوخیز درخت اور ایک راستہ ہے، صاف نیلے آسمان تلے۔"
  fr: "Un haut portail en arc de brique claire, parsemé de carreaux bleus, se dresse devant une coupole turquoise nervurée, avec de jeunes arbres et un chemin devant, sous un ciel bleu dégagé."
  es: "Un alto portal en arco de ladrillo claro, con restos de azulejos azules, se alza ante una cúpula turquesa acanalada, con árboles jóvenes y un sendero delante, bajo un cielo azul despejado."
  tr: "Açık renkli tuğladan, üzerinde mavi çini parçaları bulunan yüksek kemerli bir portal, kaburgalı turkuaz bir kubbenin önünde duruyor; önünde genç ağaçlar ve bir yol var, açık mavi bir gökyüzünün altında."
  id: "Portal tinggi berlengkung dari bata pucat dengan sisa-sisa ubin biru berdiri di depan kubah pirus beralur, dengan pohon-pohon muda dan jalan setapak di depannya, di bawah langit biru cerah."
