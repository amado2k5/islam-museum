summary:
  ar: "تُظهر الصورة المسجد الأخضر في بلخ من القرن الخامس عشر، كما تسميه صفحة الملف في ويكيميديا كومنز، ببوابته العالية وقبته المضلّعة. صورة التقطها bluuurgh في 10 يوليو 2001، من ويكيميديا كومنز، وهي في الملك العام."
  en: "The photograph shows the fifteenth-century Green Mosque of Balkh, as its Commons file page calls it, with its tall portal and ribbed dome. Photograph by bluuurgh, 10 July 2001, on Wikimedia Commons, in the public domain."
  ur: "تصویر میں بلخ کی پندرہویں صدی کی مسجد سبز دکھائی دیتی ہے، جیسا کہ وکیمیڈیا کامنز پر اس کے فائل کے صفحے میں اسے کہا گیا ہے، اس کے بلند پورٹل اور دھاری دار گنبد کے ساتھ۔ تصویر: bluuurgh، 10 جولائی 2001ء، وکیمیڈیا کامنز سے، عوامی ملکیت میں۔"
  fr: "La photographie montre la Mosquée verte de Balkh, du quinzième siècle, comme la nomme la page de son fichier sur Wikimedia Commons, avec son haut portail et sa coupole nervurée. Photographie : bluuurgh, 10 juillet 2001, sur Wikimedia Commons, dans le domaine public."
  es: "La fotografía muestra la Mezquita Verde de Balj, del siglo quince, como la llama la página de su archivo en Wikimedia Commons, con su alto portal y su cúpula acanalada. Fotografía de bluuurgh, 10 de julio de 2001, en Wikimedia Commons, en el dominio público."
  tr: "Fotoğraf, Belh'teki on beşinci yüzyıla ait Yeşil Cami'yi, Wikimedia Commons'taki dosya sayfasının adlandırdığı şekilde, yüksek portalı ve kaburgalı kubbesiyle gösteriyor. Fotoğraf: bluuurgh, 10 Temmuz 2001; Wikimedia Commons, kamu malı."
  id: "Foto ini menampilkan Masjid Hijau di Balkh dari abad kelima belas, sebagaimana disebut halaman berkasnya di Wikimedia Commons, dengan portalnya yang tinggi dan kubah beralurnya. Foto oleh bluuurgh, 10 Juli 2001, di Wikimedia Commons, domain publik."
