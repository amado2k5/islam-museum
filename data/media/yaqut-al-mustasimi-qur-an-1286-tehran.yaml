  "en": "Page of a Qur'an completed by Yaqut al-Musta'simi, Baghdad, 1286, in Rayhan script"
  "ur": "یاقوت مستعصمی کے مکمل کردہ قرآن کا صفحہ، بغداد، ۱۲۸۶ء، ریحان خط"
