  "fr": "Page d'un Coran complété par Yaqut al-Musta'simi, Bagdad, 1286, en écriture Rayhan"
"summary":
  "ar": "صورة لصفحة فيها الآيات ١ إلى ١٧ من سورة المؤمنون من مصحف تقول صفحة الملف إن ياقوت المستعصمي أتمّه في بغداد في جمادى الأولى ٦٨٥هـ، تموز ١٢٨٦م، مقاسه ٣٥ في ٢٥ سم، بخط الريحان، طهران، المتحف الإسلامي، مخطوط ٤٢٧٧. تخدم مثالًا على الريحان، الصورة الأصغر من المحقق، وقد كُتبت به مصاحف كاملة كما استُعمل في العناوين والصفحات المزخرفة. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page with sura 23, verses 1 to 17, of a Qur'an that the file page says was completed by Yaqut al-Musta'simi at Baghdad in Jumada I 685, July 1286, 35 by 25 cm, in Rayhan script, Tehran, Islamic Museum, ms. 4277. It serves as an example of Rayhan, the smaller sibling of Muhaqqaq, used for full mushafs as well as headings and decorated pages. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک قرآن کے صفحے کی تصویر جس میں سورۂ مؤمنون کی آیات ۱ تا ۱۷ ہیں؛ فائل کا صفحہ کہتا ہے کہ اسے یاقوت مستعصمی نے بغداد میں جمادی الاولیٰ ۶۸۵ھ، جولائی ۱۲۸۶ء میں مکمل کیا، ۳۵ ضرب ۲۵ سینٹی میٹر، ریحان خط میں، تہران، اسلامی عجائب گھر، مخطوطہ ۴۲۷۷۔ یہ ریحان کی مثال ہے، جو محقق کی چھوٹی صورت ہے اور جس میں مکمل مصاحف بھی لکھے گئے اور عنوانات اور آراستہ صفحات بھی۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página con la sura 23, versículos 1 a 17, de un Corán que, según la página del archivo, fue completado por Yaqut al-Musta'simi en Bagdad en Jumada I 685, julio de 1286, 35 x 25 cm, en escritura Rayhan, Teherán, Museo Islámico, ms. 4277. Sirve como ejemplo de Rayhan, la variante menor de Muhaqqaq, utilizada para mushafs completos, así como para encabezados y páginas decoradas. Se incluye como una obra escrita por un maestro calígrafo, como indica la página del archivo, para que el lector pueda apreciar la tradición que rodea su nombre en la página; no se trata de un retrato. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une page du Coran contenant la sourate 23, versets 1 à 17. Selon la fiche descriptive, ce manuscrit aurait été achevé par Yaqut al-Musta'simi à Bagdad en Jumada I 685 (juillet 1286), mesurant 35 x 25 cm et écrit en écriture Rayhan. Il est conservé au Musée islamique de Téhéran (ms. 4277). Cette photographie illustre l'utilisation de l'écriture Rayhan, variante de l'écriture Muhaqqaq, employée pour les manuscrits complets, les titres et les pages ornées. Elle est présentée comme une œuvre d'un maître calligraphe, afin d'illustrer la tradition calligraphique entourant son nom. Il ne s'agit pas d'un portrait. Sur Wikimedia Commons, le fichier est dans le domaine public."
