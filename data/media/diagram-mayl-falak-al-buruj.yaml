label:
  ar: "من قيمة بطلميوس إلى قياس المأمون"
  en: "From Ptolemy's value to al-Ma'mun's measurement"
  ur: "بطلمیوس کی قدر سے مامون کی پیمائش تک"
  es: "Desde el valor de Ptolomeo hasta la medición de al-Ma'mun"
  fr: "De la valeur de Ptolémée à la mesure d'al-Ma'mun"
summary:
  ar: "سلسلة تعليمية تبين أن الفرغاني يذكر ميل فلك البروج عند بطلميوس 23°51' وقياس المأمون الممتحن 23°35'؛ لا تدعي أن القياس اخترعه المأمون وحده."
  en: "Teaching chain showing al-Farghani's two values for the obliquity — Ptolemy's 23°51' and the verified measurement under al-Ma'mun's orders at 23°35'; it does not claim al-Ma'mun invented the measurement alone."
  ur: "تدریسی سلسلہ جو الفرغانی کی زاویہِ مائل کی دو قدریں دکھاتا ہے — بطلمیوس کا 23°51' اور مامون کے حکم پر ماہرین کی متفق شدہ تصدیقی پیمائش 23°35'؛ یہ دعویٰ نہیں کہ یہ پیمائش مامون نے تنہا ایجاد کی۔"
  es: "Cadena de enseñanza que muestra los dos valores de al-Farghani para la oblicuidad: los 23°51' de Ptolomeo y la medición verificada bajo las órdenes de al-Ma'mun en 23°35'; no afirma que al-Ma'mun haya inventado la medición por sí solo."
  fr: "Chaîne d'enseignement montrant les deux valeurs d'obliquité d'al-Farghani — 23°51' selon Ptolémée et la mesure vérifiée sous les ordres d'al-Ma'mun à 23°35'; elle ne prétend pas qu'al-Ma'mun ait inventé la mesure seul."
