  ar: "صورة القمر الكامل التي التقطتها مركبة غاليليو الفضائية في 7 كانون الأول 1992؛ تُعرض سياقاً بصرياً لسطح القمر الذي ناقشه ابن الهيثم، لا كصورة رصد قديمة ولا لدليل على نظرية «ضوء القمر»."
