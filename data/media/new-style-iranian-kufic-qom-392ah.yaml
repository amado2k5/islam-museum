  "ar": "ورقة مصحف بالكوفي الإيراني تُنسب تقليديًا إلى ابن البواب، ٣٩٢هـ"
  "en": "Qur'an folio in Iranian Kufic, traditionally attributed to Ibn al-Bawwab, 392 AH"
  "ur": "ایرانی کوفی میں مصحف کا ورق، روایتاً ابن البواب سے منسوب، ۳۹۲ھ"
"summary":
  "ar": "صورة لورقة مصحف تصفها صفحة الملف بأنها بالخط الكوفي الإيراني، ومنسوبة تقليديًا إلى ابن البواب ومؤرخة سنة ٣٩٢هـ، ١٠٠٢م، من مكتبة المرعشي النجفي بقم، رقم ٤٣٥٨. والنسبة هنا نسبة التقليد كما تقول صفحة الملف لا دعوى يقولها المتحف. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Qur'an folio that the file page describes as in the Iranian Kufic script, traditionally attributed to Ibn al-Bawwab and dated 392 AH, 1002 CE, from the Library of Mar'ashi Najafi in Qom, no. 4358. The attribution is the tradition's, as the file page says, not a claim made here. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک مصحفی ورق کی تصویر جسے فائل کا صفحہ ایرانی کوفی خط میں بتاتا ہے، جو روایتاً ابن البواب سے منسوب اور ۳۹۲ھ، ۱۰۰۲ء کی ہے، قم کے مرعشی نجفی کتب خانے، نمبر ۴۳۵۸ سے۔ یہ نسبت روایت کی ہے، جیسا کہ فائل کا صفحہ کہتا ہے، نہ کہ عجائب گھر کا دعویٰ۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
