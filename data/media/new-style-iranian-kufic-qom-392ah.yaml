"summary":
  "ar": "صورة لورقة مصحف تصفها صفحة الملف بأنها بالخط الكوفي الإيراني، ومنسوبة تقليديًا إلى ابن البواب ومؤرخة سنة ٣٩٢هـ، ١٠٠٢م، من مكتبة المرعشي النجفي بقم، رقم ٤٣٥٨. والنسبة هنا نسبة التقليد كما تقول صفحة الملف لا دعوى يقولها المتحف. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Qur'an folio that the file page describes as in the Iranian Kufic script, traditionally attributed to Ibn al-Bawwab and dated 392 AH, 1002 CE, from the Library of Mar'ashi Najafi in Qom, no. 4358. The attribution is the tradition's, as the file page says, not a claim made here. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک مصحفی ورق کی تصویر جسے فائل کا صفحہ ایرانی کوفی خط میں بتاتا ہے، جو روایتاً ابن البواب سے منسوب اور ۳۹۲ھ، ۱۰۰۲ء کی ہے، قم کے مرعشی نجفی کتب خانے، نمبر ۴۳۵۸ سے۔ یہ نسبت روایت کی ہے، جیسا کہ فائل کا صفحہ کہتا ہے، نہ کہ عجائب گھر کا دعویٰ۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán que, según la página del archivo, está escrito en escritura cúfica iraní, tradicionalmente atribuido a Ibn al-Bawwab y fechado en el año 392 de la Hégira (1002 d. C.), procedente de la Biblioteca de Mar'ashi Najafi en Qom, n.º 4358. La atribución es la tradicional, como indica la página del archivo, no una afirmación hecha aquí. Sirve como ejemplo de la escritura de estilo nuevo, tradicionalmente llamada cúfica oriental, con sus letras verticales y el marcado contraste entre trazos gruesos y finos. Se incluye como una obra escrita por un maestro calígrafo, como se indica en la página del archivo, para que el lector pueda apreciar cómo se ve la tradición en torno a su nombre en la página; no es un retrato. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un folio du Coran, décrit sur sa fiche comme étant en écriture coufique iranienne, traditionnellement attribué à Ibn al-Bawwab et daté de 392 AH (1002 ap. J.-C.), provenant de la bibliothèque de Mar'ashi Najafi à Qom (n° 4358). Cette attribution est traditionnelle, comme l'indique la fiche, et non une affirmation de notre part. Ce folio illustre l'écriture coufique orientale, caractérisée par ses lettres droites et le contraste marqué entre les traits épais et fins. Il est présenté comme une œuvre d'un maître calligraphe, afin que le lecteur puisse observer la tradition calligraphique entourant son nom; il ne s'agit pas d'un portrait. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Dosyada İran Kufi yazısıyla yazılmış, geleneksel olarak İbn el-Bawwab'a atfedilen ve Hicri 392 (Miladi 1002) tarihli, Kum'daki Mar'ashi Najafi Kütüphanesi'nden 4358 numaralı Kur'an el yazması sayfasının fotoğrafı. Dosyada belirtildiği gibi, buradaki atıf müzenin herhangi bir iddiasına değil, geleneğe dayanmaktadır. Dik, düz harfleri ve kalın ve ince çizgiler arasındaki keskin kontrastıyla geleneksel olarak Doğu Kufi olarak adlandırılan yeni yazının bir örneğidir. Dosyada belirtildiği gibi, okuyucuya ismine atfedilen geleneklerin kağıt üzerinde nasıl göründüğünü göstermek için önde gelen bir hattat tarafından yapılmış bir eser olarak listelenmiştir; bir portre değildir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman manuskrip Al-Qur'an, yang dijelaskan dalam berkas sebagai tulisan Kufi Iran, secara tradisional dikaitkan dengan Ibn al-Bawwab, dan bertanggal 392 H (1002 M), dari Perpustakaan Mar'ashi Najafi di Qom, No. 4358. Atribusi di sini didasarkan pada tradisi, seperti yang dinyatakan dalam berkas, bukan pada klaim apa pun dari museum. Ini berfungsi sebagai contoh tulisan baru yang secara tradisional disebut Kufi Timur, dengan huruf-hurufnya yang tegak dan lurus serta kontras yang tajam antara goresan tebal dan tipis. Gambar ini tercantum sebagai karya seorang kaligrafer terkemuka, seperti yang dinyatakan dalam berkas, untuk menunjukkan kepada pembaca bagaimana tradisi yang dikaitkan dengan namanya muncul di atas kertas; ini bukan potret. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
