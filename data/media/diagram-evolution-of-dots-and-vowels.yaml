  "ar": "رسم: تطور الكتابة العربية الأولى من غير نقط إلى نقط أبي الأسود الحمراء إلى علامات الفراهيدي"
  "en": "Diagram: evolution of early Arabic writing from no dots to Abu al-Aswad's red dots to al-Farahidi's signs"
  "ur": "خاکہ: ابتدائی عربی تحریر کا ارتقا، بے نقطہ سے ابو الاسود کے سرخ نقطوں اور فراہیدی کی علامتوں تک"
  "es": "Diagrama: evolución de la escritura árabe primitiva desde la ausencia de puntos hasta los puntos rojos de Abu al-Aswad y los signos de al-Farahidi."
