  "id": "Diagram: Evolusi tulisan Arab awal dari tanpa titik hingga titik merah Abu al-Aswad hingga tanda diakritik al-Farahidi"
"summary":
  "ar": "رسم متجهي لـ G Yassine Mrabet يبيّن، بالبسملة من مصاحف كوفية مثالًا، كيف تطورت الكتابة العربية الأولى من القرن التاسع إلى الحادي عشر. ويذكر وصف الملف أربع مراحل: خط مطلع القرن التاسع بلا نقط ولا علامات تشكيل؛ ثم في العصر العباسي نظام أبي الأسود بنقاط حمراء يدل كل ترتيب أو موضع منها على حركة قصيرة مختلفة؛ ثم نظام ثانٍ بنقاط سوداء للتمييز بين حروف مثل الفاء والقاف؛ ثم في القرن الحادي عشر نظام الفراهيدي، وهو المعروف اليوم، إذ صارت النقاط أشكالًا تشبه الحروف. وهذا تلخيص المساهِم للتاريخ كما تورده صفحة الملف.  الصورة على ويكيميديا كومنز بترخيص CC BY-SA 4.0، ويلزم نسبتها إلى G Yassine Mrabet."
  "en": "A vector diagram by G Yassine Mrabet showing, with the basmala from Kufic Qur'an manuscripts as its example, how early Arabic writing developed from the 9th to the 11th century. The file description lists four stages: an early 9th century script with no dots or diacritic marks; under the Abbasids, Abu al-Aswad's system of red dots, each arrangement or position indicating a different short vowel; later a second system of black dots to tell letters such as fa' and qaf apart; and in the 11th century al-Farahidi's system, the one used today, in which dots became shapes resembling the letters. This is the contributor's summary of the history, as the file page gives it.  On Wikimedia Commons the file is licensed CC BY-SA 4.0; attribution to G Yassine Mrabet is required."
  "ur": "G Yassine Mrabet کا ویکٹر خاکہ، جس میں کوفی مصاحف کی بسم اللہ بطور مثال لے کر دکھایا گیا ہے کہ نویں سے گیارھویں صدی تک ابتدائی عربی تحریر کیسے بڑھی۔ فائل کی وضاحت چار مراحل بتاتی ہے: نویں صدی کے آغاز کا خط جس میں نہ نقطے ہیں نہ اعراب؛ پھر عباسی دور میں ابو الاسود کا نظام، سرخ نقطے جن کی ہر ترتیب یا مقام ایک الگ مختصر حرکت ظاہر کرتا ہے؛ پھر دوسرا نظام سیاہ نقطوں کا، فا اور قاف جیسے حروف میں فرق کے لیے؛ اور گیارھویں صدی میں فراہیدی کا نظام، جو آج رائج ہے، جس میں نقطے حروف سے مشابہ شکلیں بن گئے۔ یہ فائل کے صفحے میں شامل کرنے والے کا تاریخ کا خلاصہ ہے۔  کامنز پر یہ فائل CC BY-SA 4.0 لائسنس کے تحت ہے؛ G Yassine Mrabet کی طرف نسبت ضروری ہے۔"
  "es": "Diagrama vectorial de G. Yassine Mrabet que muestra, con la basmala de manuscritos coránicos cúficos como ejemplo, cómo se desarrolló la escritura árabe primitiva desde el siglo IX hasta el XI. La descripción del archivo enumera cuatro etapas: una escritura de principios del siglo IX sin puntos ni signos diacríticos; bajo los abasíes, el sistema de puntos rojos de Abu al-Aswad, donde cada disposición o posición indica una vocal breve diferente; posteriormente, un segundo sistema de puntos negros para distinguir letras como fa' y qaf; y en el siglo XI, el sistema de al-Farahidi, el que se usa actualmente, en el que los puntos se convirtieron en formas que se asemejan a las letras. Este es el resumen de la historia realizado por el colaborador, tal como aparece en la página del archivo. En Wikimedia Commons, el archivo tiene licencia CC BY-SA 4.0; se requiere la atribución a G. Yassine Mrabet."
  "fr": "Un diagramme vectoriel de G. Yassine Mrabet illustre, à l'aide de la basmala des manuscrits coraniques coufiques, l'évolution de l'écriture arabe ancienne du IXe au XIe siècle. La description du fichier mentionne quatre étapes: une écriture du début du IXe siècle sans points ni signes diacritiques; sous les Abbassides, le système d'Abu al-Aswad, basé sur des points rouges, chaque disposition indiquant une voyelle brève différente; puis un second système de points noirs pour distinguer des lettres comme le fa' et le qaf; et enfin, au XIe siècle, le système d'al-Farahidi, toujours utilisé aujourd'hui, où les points prennent des formes ressemblant aux lettres. Ce résumé historique est celui proposé par le contributeur, tel qu'il apparaît sur la page du fichier. Sur Wikimedia Commons, le fichier est sous licence CC BY-SA 4.0; la mention de G. Yassine Mrabet est requise."
  "tr": "G. Yassine Mrabet tarafından hazırlanan ve Kufi Kur'an'daki Besmele'yi (\"Rahman ve Rahim olan Allah'ın adıyla\") örnek alan vektör illüstrasyonu, 9. yüzyıldan 11. yüzyıla kadar erken Arap yazısının evrimini göstermektedir. Dosya açıklamasında dört aşama listelenmiştir: 9. yüzyılın başlarında nokta veya diyakritik işaretler içermeyen bir yazı; ardından Abbasi döneminde, farklı kısa ünlü seslerini temsil eden kırmızı noktalarla Ebu el-Esved sistemi; daha sonra fa' ve kaf gibi harfleri ayırt etmek için siyah noktalarla ikinci bir sistem; ve son olarak, 11. yüzyılda, noktaların harflere benzeyen şekillere dönüştüğü ve bugün bildiğimiz el-Farahidi sistemi. Bu, dosya sayfasında sunulan tarihin katkıda bulunan tarafından yapılan özetidir. Görsel, Wikimedia Commons'ta CC BY-SA 4.0 lisansı altında bulunmaktadır ve G. Yassine Mrabet'e atıfta bulunulmalıdır."
  "id": "Ilustrasi vektor karya G Yassine Mrabet, menggunakan Basmala (frasa pembuka \"Dengan nama Allah, Yang Maha Pengasih, Yang Maha Penyayang\") dari Al-Qur'an Kufi sebagai contoh, menunjukkan evolusi aksara Arab awal dari abad ke-9 hingga ke-11. Deskripsi file mencantumkan empat tahapan: aksara awal abad ke-9 tanpa titik atau tanda diakritik; kemudian, selama era Abbasiyah, sistem Abu al-Aswad, dengan titik merah yang mewakili bunyi vokal pendek yang berbeda; kemudian sistem kedua dengan titik hitam untuk membedakan antara huruf-huruf seperti fa' dan qaf; dan akhirnya, pada abad ke-11, sistem al-Farahidi, yang kita kenal sekarang, di mana titik-titik tersebut menjadi bentuk yang menyerupai huruf. Ini adalah ringkasan sejarah dari kontributor seperti yang disajikan di halaman file. Gambar tersebut ada di Wikimedia Commons di bawah lisensi CC BY-SA 4.0 dan harus dikaitkan dengan G Yassine Mrabet."
