  "ar": "صفحة من سورة الشعراء في المصحف الوردي، الأندلس، القرن الثالث عشر"
  "en": "Page from Surat al-Shu'ara of the Pink Qur'an, al-Andalus, 13th century"
  "ur": "گلابی مصحف کا سورۂ شعراء کا صفحہ، اندلس، تیرھویں صدی"
"summary":
  "ar": "صورة، تنسبها صفحة الملف إلى قطعة معروضة في مزاد كريستيز، لصفحة من سورة الشعراء في المصحف الوردي، الأندلس، القرن الثالث عشر. ولا تسمّي صفحة الملف الخط؛ أما كون المصحف بخط مغربي غليظ فمصدره سجلّ المتحف نفسه. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph, credited on the file page to a Christie's auction lot, of a page from sura al-Shu'ara of the Pink Qur'an, al-Andalus, 13th century. The file page does not name the script; that the codex is in a bold Maghribi hand comes from the museum's own record. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "کرسٹیز کی نیلامی کے ایک لاٹ سے منسوب، فائل کے صفحے کے مطابق، گلابی مصحف کی سورۂ شعراء کے ایک صفحے کی تصویر، اندلس، تیرھویں صدی۔ فائل کا صفحہ خط کا نام نہیں لیتا؛ یہ کہ مصحف موٹے مغربی خط میں ہے، عجائب گھر کے اپنے اندراج سے ہے۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
