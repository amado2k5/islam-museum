"summary":
  "ar": "صورة للفاتحة بالخط السوداني، مكتبة تشستر بيتي ١٥٩٨، الورقة ١ ظهر، تؤرخها صفحة الملف بالقرن التاسع عشر وبشمال غرب أفريقيا. والسوداني قلم أفريقي غربي من أسرة المغربي؛ أما صفحة الملف فتسمّي الخط السوداني وحده. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of Al-Fatiha in the Sudani script, Chester Beatty Library Is 1598, f. 1b, which the file page dates to the 19th century and to north-west Africa. The Sudani hand is a West African descendant of the Maghribi family; the file page itself names only the Sudani script. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "الفاتحہ کی تصویر سوڈانی خط میں، چیسٹر بیٹی لائبریری 1598، ورق ۱ پشت، جسے فائل کا صفحہ انیسویں صدی اور شمال مغربی افریقہ سے منسوب کرتا ہے۔ سوڈانی دست مغربی خاندان کی مغربی افریقی شاخ ہے؛ فائل کا صفحہ خود صرف سوڈانی خط کا نام لیتا ہے۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de Al-Fatiha en escritura sudanesa, Biblioteca Chester Beatty, 1598, f. 1b, que la página del archivo fecha en el siglo XIX y en el noroeste de África. La escritura sudanesa es descendiente de la familia magrebí de África Occidental; la página del archivo solo menciona la escritura sudanesa. Sirve como ejemplo de la escritura magrebí de trazo libre del norte de África y al-Ándalus, que carece de proporciones fijas y se encuentra principalmente en manuscritos. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'Al-Fatiha en écriture soudanaise, Chester Beatty Library Is 1598, f. 1b. La fiche descriptive date ce document du XIXe siècle et le situe en Afrique du Nord-Ouest. L'écriture soudanaise est d'origine ouest-africaine et appartient à la famille maghrébine; la fiche descriptive mentionne uniquement l'écriture soudanaise. Ce document illustre l'écriture maghrébine manuscrite d'Afrique du Nord et d'al-Andalus, caractérisée par des proportions variables et que l'on retrouve principalement dans les manuscrits. Sur Wikimedia Commons, le fichier est dans le domaine public."
