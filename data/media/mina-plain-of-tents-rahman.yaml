summary:
  ar: "تُظهر الصورة سهل منى مغطى بصفوف من الخيام البيضاء، ملتقطة من سفح الجبل. صورة التقطها Mubeen Rahman في 17 ديسمبر 2007، من ويكيميديا كومنز، بترخيص CC BY 3.0."
  en: "The photograph shows the plain of Mina covered with rows of white tents, taken from the mountainside. Photograph by Mubeen Rahman, 17 December 2007, on Wikimedia Commons, licensed CC BY 3.0."
  ur: "تصویر میں منیٰ کا میدان سفید خیموں کی قطاروں سے ڈھکا ہوا دکھائی دیتا ہے، جو پہاڑ کے دامن سے لی گئی ہے۔ تصویر: Mubeen Rahman، 17 دسمبر 2007ء، وکیمیڈیا کامنز سے، لائسنس CC BY 3.0۔"
  fr: "La photographie montre la plaine de Mina couverte de rangées de tentes blanches, prise depuis le flanc de la montagne. Photographie : Mubeen Rahman, 17 décembre 2007, sur Wikimedia Commons, sous licence CC BY 3.0."
  es: "La fotografía muestra la llanura de Mina cubierta de filas de tiendas blancas, tomada desde la ladera de la montaña. Fotografía de Mubeen Rahman, 17 de diciembre de 2007, en Wikimedia Commons, con licencia CC BY 3.0."
  tr: "Fotoğraf, beyaz çadır sıralarıyla kaplı Mina ovasını, dağ yamacından çekilmiş olarak gösteriyor. Fotoğraf: Mubeen Rahman, 17 Aralık 2007; Wikimedia Commons, CC BY 3.0 lisansı."
  id: "Foto ini menampilkan dataran Mina yang tertutup deretan tenda putih, diambil dari lereng gunung. Foto oleh Mubeen Rahman, 17 Desember 2007, di Wikimedia Commons, berlisensi CC BY 3.0."
