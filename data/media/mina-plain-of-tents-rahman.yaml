alt:
  ar: "وادٍ واسع تملؤه من جانب إلى جانب صفوف منتظمة من الخيام البيضاء تتخللها الطرق، وخلفه جبال صخرية جرداء ترتفع في الضباب."
  en: "A broad valley filled from side to side with regular rows of white tents, crossed by roads, with bare rocky mountains rising in the haze behind."
  ur: "ایک وسیع وادی جو ایک سرے سے دوسرے سرے تک سفید خیموں کی منظم قطاروں سے بھری ہے، سڑکیں اسے کاٹتی ہیں، اور پیچھے دھند میں بنجر چٹانی پہاڑ بلند ہیں۔"
  fr: "Une large vallée remplie d'un bord à l'autre de rangées régulières de tentes blanches, traversée par des routes, avec des montagnes rocheuses nues qui s'élèvent dans la brume derrière."
  es: "Un amplio valle lleno de lado a lado de filas regulares de tiendas blancas, cruzado por carreteras, con montañas rocosas desnudas que se elevan en la bruma detrás."
  tr: "Bir yandan bir yana düzenli beyaz çadır sıralarıyla dolu, yollarla kesişen geniş bir vadi; arkada puslu havada çıplak kayalık dağlar yükseliyor."
  id: "Lembah luas yang terisi dari sisi ke sisi oleh deretan tenda putih yang teratur, dilintasi jalan-jalan, dengan pegunungan berbatu gundul yang menjulang dalam kabut di belakangnya."
