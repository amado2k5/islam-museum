alt:
  ar: "ضريح أبيض ذو قبة وأربع مآذن عالية في أركان مصطبته، يُرى على امتداد قناة ماء ضيقة بين ممرات وصفوف من أشجار السرو، تحت سماء رمادية مزرقّة."
  en: "A white domed mausoleum with four tall minarets at the corners of its platform, seen along a narrow water channel between paths and rows of cypress trees, under a grey-blue sky."
  ur: "ایک سفید گنبد والا مقبرہ جس کے چبوترے کے کونوں پر چار بلند مینار ہیں، روشوں اور سرو کے درختوں کی قطاروں کے بیچ ایک تنگ نہر کے ساتھ ساتھ دکھائی دیتا ہے، سرمئی نیلے آسمان تلے۔"
  fr: "Un mausolée blanc à coupole avec quatre hauts minarets aux angles de sa terrasse, vu le long d'un étroit canal d'eau entre des allées et des rangées de cyprès, sous un ciel gris-bleu."
  es: "Un mausoleo blanco con cúpula y cuatro altos minaretes en las esquinas de su plataforma, visto a lo largo de un estrecho canal de agua entre senderos y hileras de cipreses, bajo un cielo gris azulado."
  tr: "Beyaz kubbeli bir türbe; platformunun köşelerinde dört yüksek minare var; yollar ile selvi ağacı sıraları arasındaki dar bir su kanalı boyunca görülüyor, gri-mavi bir gökyüzünün altında."
  id: "Mausoleum putih berkubah dengan empat menara tinggi di sudut-sudut peronnya, terlihat sepanjang saluran air sempit di antara jalan setapak dan deretan pohon cemara, di bawah langit abu-abu kebiruan."
