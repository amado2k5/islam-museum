summary:
  ar: "تُظهر الصورة بيبي كا مقبرة في أورنك آباد عند نهاية قناة الماء الطويلة في حديقتها، بمآذنها الأربع. صورة التقطها Sailko في 4 نوفمبر 2019، من ويكيميديا كومنز، بترخيص CC BY 3.0."
  en: "The photograph shows the Bibi Ka Maqbara in Aurangabad at the end of the long water channel of its garden, with its four minarets. Photograph by Sailko, 4 November 2019, on Wikimedia Commons, licensed CC BY 3.0."
  ur: "تصویر میں اورنگ آباد میں بی بی کا مقبرہ اپنے باغ کی لمبی نہر کے آخر پر اپنے چار میناروں کے ساتھ دکھائی دیتا ہے۔ تصویر: Sailko، 4 نومبر 2019ء، وکیمیڈیا کامنز سے، لائسنس CC BY 3.0۔"
  fr: "La photographie montre le Bibi Ka Maqbara à Aurangabad au bout du long canal d'eau de son jardin, avec ses quatre minarets. Photographie : Sailko, 4 novembre 2019, sur Wikimedia Commons, sous licence CC BY 3.0."
  es: "La fotografía muestra el Bibi Ka Maqbara en Aurangabad al final del largo canal de agua de su jardín, con sus cuatro minaretes. Fotografía de Sailko, 4 de noviembre de 2019, en Wikimedia Commons, con licencia CC BY 3.0."
  tr: "Fotoğraf, Aurangabad'daki Bibi Ka Makbara'yı bahçesinin uzun su kanalının sonunda, dört minaresiyle gösteriyor. Fotoğraf: Sailko, 4 Kasım 2019; Wikimedia Commons, CC BY 3.0 lisansı."
  id: "Foto ini menampilkan Bibi Ka Maqbara di Aurangabad di ujung saluran air panjang tamannya, dengan keempat menaranya. Foto oleh Sailko, 4 November 2019, di Wikimedia Commons, berlisensi CC BY 3.0."
