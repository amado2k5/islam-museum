summary:
  ar: "تُظهر الصورة الجوية المئذنة الملوية في سامراء بجانب أسوار جامعها، وخلفها بيوت المدينة. صورة التقطها Jim Gordon في 10 ديسمبر 2007، من ويكيميديا كومنز، بترخيص CC BY 2.0."
  en: "The aerial photograph shows the spiral minaret of Samarra beside the walls of its mosque, with the houses of the town beyond. Photograph by Jim Gordon, 10 December 2007, on Wikimedia Commons, licensed CC BY 2.0."
  ur: "فضائی تصویر میں سامرا کا پیچ دار مینار اس کی مسجد کی دیواروں کے برابر دکھائی دیتا ہے، اور پیچھے شہر کے مکانات ہیں۔ تصویر: Jim Gordon، 10 دسمبر 2007ء، وکیمیڈیا کامنز سے، لائسنس CC BY 2.0۔"
  fr: "La photographie aérienne montre le minaret spiralé de Samarra à côté des murs de sa mosquée, avec les maisons de la ville au-delà. Photographie : Jim Gordon, 10 décembre 2007, sur Wikimedia Commons, sous licence CC BY 2.0."
  es: "La fotografía aérea muestra el minarete en espiral de Samarra junto a los muros de su mezquita, con las casas de la ciudad al fondo. Fotografía de Jim Gordon, 10 de diciembre de 2007, en Wikimedia Commons, con licencia CC BY 2.0."
  tr: "Hava fotoğrafı, Samarra'nın sarmal minaresini camisinin duvarlarının yanında, ötesinde kentin evleriyle birlikte gösteriyor. Fotoğraf: Jim Gordon, 10 Aralık 2007; Wikimedia Commons, CC BY 2.0 lisansı."
  id: "Foto udara ini menampilkan menara spiral Samarra di samping dinding masjidnya, dengan rumah-rumah kota di belakangnya. Foto oleh Jim Gordon, 10 Desember 2007, di Wikimedia Commons, berlisensi CC BY 2.0."
