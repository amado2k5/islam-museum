alt:
  ar: "منظر جوي لبرج مخروطي عالٍ من الآجر بلون الرمل يلتف حوله منحدر صاعد، قائم في ساحة رملية مكشوفة بجانب سور طويل ذي دعائم، وخلفه بيوت منخفضة مسطحة السقوف وأشجار."
  en: "Aerial view of a tall conical tower of sand-coloured brick with a ramp winding around it, standing in an open sandy enclosure beside a long buttressed wall, with low flat-roofed houses and trees behind."
  ur: "ریت کے رنگ کی اینٹوں کے ایک بلند مخروطی برج کا فضائی منظر جس کے گرد ایک ڈھلوان راستہ لپٹا ہوا ہے، ایک کھلے ریتیلے احاطے میں ایک لمبی سہاروں والی دیوار کے ساتھ کھڑا ہے، اور پیچھے پست ہموار چھتوں والے مکانات اور درخت ہیں۔"
  fr: "Vue aérienne d'une haute tour conique de brique couleur sable autour de laquelle s'enroule une rampe, dressée dans une enceinte sableuse ouverte à côté d'un long mur à contreforts, avec de basses maisons à toit plat et des arbres derrière."
  es: "Vista aérea de una alta torre cónica de ladrillo color arena con una rampa que se enrosca a su alrededor, en un recinto arenoso abierto junto a un largo muro con contrafuertes, con casas bajas de techo plano y árboles detrás."
  tr: "Çevresinde dolanan bir rampası olan, kum rengi tuğladan yüksek bir konik kulenin havadan görünümü; uzun payandalı bir duvarın yanında açık, kumlu bir avluda duruyor, arkasında alçak düz çatılı evler ve ağaçlar var."
  id: "Pemandangan udara menara kerucut tinggi dari bata berwarna pasir dengan jalan menanjak melilitnya, berdiri di pelataran berpasir terbuka di samping tembok panjang berpenopang, dengan rumah-rumah rendah beratap datar dan pepohonan di belakangnya."
