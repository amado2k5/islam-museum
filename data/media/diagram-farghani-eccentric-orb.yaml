alt:
  ar: "خمسة عناصر متسلسلة: نماذج الدوائر الخارجة السابقة، ثم بيان الفرغاني في الفصل السادس عشر عن فلك الشمس الخارج المركز ومراكز الكواكب، ثم ترجمة إيطالهي، ثم ترجمة جيراردوس كريمنوننسيس، ثم طبعة غوليوس 1669."
  en: "Five linked items: earlier off-centre orb models, then al-Farghani's chapter-sixteen account of the Sun's eccentric orb and the planets' centres, then Johannes Hispalensis's version, then Gerardus Cremonensis, then Golius's 1669 edition."
  ur: "پانچ سلسلہ وار آئٹمز: پہلے کے مرکز سے ہٹے دائروں کے نمونے، پھر باب سولہ میں سورج کے خارجِمرکزی دائرے اور سیاروں کے مراکز کا فرغانی بیان، پھر جوہانس ہسپالنسس کی نقل، پھر جیرارڈس کریمونینسس، پھر گولیوس کا 1669 ایڈیشن۔"
