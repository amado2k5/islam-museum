summary:
  ar: "سلسلة تعليمية تبين انتقال بنية الأفلاك الخارجة عن مركز الأرض إلى الملخص العربي للفرغاني ثم إلى ترجماته اللاتينية؛ لا تثبت أولية البنية ولا تسوية مراكز الكواكب."
  en: "A teaching chain showing the off-centre orb structure passing into al-Farghani's Arabic summary and its Latin translations; it proves neither the structure's priority nor the planets' centre alignments."
  ur: "تدریسی سلسلہ جو زمین کے مرکز سے ہٹی دائرہ ساخت کے فرغانی کے عربی خلاصے اور اس کے لاطینی تراجم میں پہنچنے کو دکھاتا ہے؛ نہ ساخت کی سبقت ثابت کرتا ہے نہ سیاروں کے مراکز کی سیدھ۔"
