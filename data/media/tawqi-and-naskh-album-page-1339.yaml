"summary":
  "ar": "صورة لصفحة من ألبوم في مكتبة جامعة إسطنبول تصفها صفحة الملف بأنها خط نسخ لمحمد قاسم وخط توقيع ليحيى الجمالي، ٧٤٦هـ، ١٣٣٩-١٣٤٠م، في شيراز. تخدم مثالًا على التوقيع، قرين الثلث الأصغر الذي توصل فيه حروف لا توصل عادةً وصلًا منتظمًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page from an album in the University of Istanbul Library which the file page describes as naskh calligraphy by Muhammad Qasem and tawqi' calligraphy by Yahya al-Jamali, 746 AH, 1339-40, in Shiraz. It serves as an example of Tawqi', a smaller cousin of Thuluth in which letters that are ordinarily not joined are linked systematically. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "استنبول یونیورسٹی لائبریری کے ایک البم کے صفحے کی تصویر جسے فائل کا صفحہ محمد قاسم کی نسخ خطاطی اور یحییٰ جمالی کی توقیع خطاطی بتاتا ہے، ۷۴۶ھ، ۱۳۳۹ تا ۱۳۴۰ء، شیراز۔ یہ توقیع کی مثال ہے، جو ثلث کی چھوٹی قرین ہے اور جس میں وہ حروف بھی باقاعدگی سے جوڑ دیے جاتے ہیں جو عام طور پر نہیں جڑتے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página de un álbum de la Biblioteca de la Universidad de Estambul, cuya ficha se describe como caligrafía naskh de Muhammad Qasem y caligrafía tawqi' de Yahya al-Jamali, 746 AH (1339-1340), en Shiraz. Sirve como ejemplo de tawqi', una variante menor del thuluth en la que las letras que normalmente no se unen se enlazan sistemáticamente. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une page d'un album de la bibliothèque de l'Université d'Istanbul. La fiche descriptive indique qu'il s'agit d'une calligraphie naskh de Muhammad Qasem et d'une calligraphie tawqi' de Yahya al-Jamali, datant de 746 AH (1339-1340), à Shiraz. Elle illustre le tawqi', un style calligraphique plus restreint, proche du thuluth, où les lettres habituellement non liées sont enchaînées de manière systématique. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "İstanbul Üniversitesi Kütüphanesi'ndeki bir albümden bir sayfanın fotoğrafı. Dosya sayfasında, Muhammed Kasım'a ait Naskh yazısı ve Yahya el-Cemali'ye ait imza yazısı olarak tanımlanıyor (Hicri 746, Miladi 1339-1340, Şiraz). Harflerin genellikle düzenli olmayan bir şekilde birleştirildiği, küçük Thuluth yazısına benzer bir imza örneği olarak gösteriliyor. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman dari sebuah album di Perpustakaan Universitas Istanbul, yang dijelaskan pada halaman arsip sebagai aksara Naskh karya Muhammad Qasim dan aksara tanda tangan karya Yahya al-Jamali, 746 H (1339-1340 M), di Shiraz. Foto ini berfungsi sebagai contoh tanda tangan, mirip dengan aksara Thuluth minor, di mana huruf-hurufnya disambung dengan cara yang biasanya tidak teratur. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
