depicts: [place/tus]
alt:
  ar: "نصب من الحجر الأبيض على هيئة كتلة عالية فوق قاعدة مدرّجة يقوم في نهاية حديقة فيها بركة طويلة وأحواض زهور منحنية وعشب؛ وشخص واحد يمشي على الممر، وأشجار عالية تحيط بالمشهد تحت سماء زرقاء."
  en: "A white stone monument shaped like a tall block on a stepped base stands at the end of a garden with a long pool, curved flower beds and lawns; one person walks on the path, and tall trees frame the scene under a blue sky."
  ur: "سفید پتھر کی ایک یادگار جو سیڑھی دار چبوترے پر ایک بلند بلاک کی شکل کی ہے، ایک ایسے باغ کے سرے پر کھڑی ہے جس میں لمبا تالاب، خمیدہ کیاریاں اور سبزہ زار ہیں؛ ایک شخص راستے پر چل رہا ہے، اور بلند درخت نیلے آسمان تلے منظر کو گھیرے ہوئے ہیں۔"
  fr: "Un monument de pierre blanche en forme de haut bloc sur un socle à gradins se dresse au fond d'un jardin avec un long bassin, des parterres de fleurs courbes et des pelouses ; une personne marche sur l'allée, et de grands arbres encadrent la scène sous un ciel bleu."
  es: "Un monumento de piedra blanca con forma de alto bloque sobre una base escalonada se alza al fondo de un jardín con un largo estanque, parterres de flores curvos y céspedes; una persona camina por el sendero, y altos árboles enmarcan la escena bajo un cielo azul."
  tr: "Basamaklı bir kaide üzerinde yüksek bir blok biçimindeki beyaz taş bir anıt, uzun bir havuzu, kıvrımlı çiçek tarhları ve çimenlikleri olan bir bahçenin sonunda duruyor; bir kişi patikada yürüyor, uzun ağaçlar sahneyi çerçeveliyor, mavi bir gökyüzünün altında."
  id: "Monumen batu putih berbentuk balok tinggi di atas alas berundak berdiri di ujung taman dengan kolam panjang, petak bunga melengkung, dan hamparan rumput; seseorang berjalan di jalan setapak, dan pepohonan tinggi membingkai pemandangan di bawah langit biru."
