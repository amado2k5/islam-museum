  en: "The photograph shows the mausoleum of Ferdowsi at Tus beyond the pool and flower beds of its garden. Photograph by Wojciech Kocot, 28 September 2017, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں طوس میں فردوسی کا مقبرہ اس کے باغ کے تالاب اور پھولوں کی کیاریوں کے پار دکھائی دیتا ہے۔ تصویر: Wojciech Kocot، 28 ستمبر 2017ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre le mausolée de Ferdowsi à Tus au-delà du bassin et des parterres de fleurs de son jardin. Photographie : Wojciech Kocot, 28 septembre 2017, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el mausoleo de Ferdowsi en Tus al otro lado del estanque y los parterres de flores de su jardín. Fotografía de Wojciech Kocot, 28 de septiembre de 2017, en Wikimedia Commons, con licencia CC BY-SA 4.0."
