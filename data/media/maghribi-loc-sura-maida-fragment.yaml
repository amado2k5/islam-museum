  "ur": "مغربی خط میں خطاطی کا ٹکڑا، سورۂ مائدہ، لائبریری آف کانگریس"
"summary":
  "ar": "صورة لقطعة خطية من مكتبة الكونغرس تؤرخها صفحة الملف بما بين نحو ١٢٥٠ ونحو ١٣٥٠م، نصها بالخط المغربي ويشمل الآيتين ٦٨ و٦٩ من سورة المائدة. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress calligraphic fragment, dated by the file page to between about 1250 and about 1350, with text in Maghribi script that includes verses 68 and 69 of sura al-Ma'ida. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک خطاطی ٹکڑے کی تصویر جسے فائل کا صفحہ تقریباً ۱۲۵۰ اور تقریباً ۱۳۵۰ء کے درمیان کا بتاتا ہے، اس کا متن مغربی خط میں ہے اور سورۂ مائدہ کی آیات ۶۸ اور ۶۹ پر مشتمل ہے۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
