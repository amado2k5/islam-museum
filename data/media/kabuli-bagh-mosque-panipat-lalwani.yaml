alt:
  ar: "مسجد ذو قبة كبيرة فاتحة اللون وقباب أصغر على الجانبين يقوم خلف سور منخفض من الآجر الأحمر، وأمامه نخيل وأشجار أخرى، تحت سماء زرقاء صافية."
  en: "A mosque with one large pale dome and smaller domes at the sides stands behind a low red brick wall, with palms and other trees in front, under a clear blue sky."
  ur: "ایک مسجد جس پر ایک بڑا ہلکے رنگ کا گنبد اور دونوں جانب چھوٹے گنبد ہیں، سرخ اینٹوں کی پست دیوار کے پیچھے کھڑی ہے، سامنے کھجور کے اور دوسرے درخت ہیں، صاف نیلے آسمان تلے۔"
  fr: "Une mosquée à grande coupole claire et à plus petites coupoles sur les côtés se dresse derrière un bas mur de brique rouge, avec des palmiers et d'autres arbres devant, sous un ciel bleu dégagé."
  es: "Una mezquita con una gran cúpula clara y cúpulas más pequeñas a los lados se alza detrás de un muro bajo de ladrillo rojo, con palmeras y otros árboles delante, bajo un cielo azul despejado."
  tr: "Büyük bir açık renkli kubbesi ve yanlarda daha küçük kubbeleri olan bir cami, alçak bir kırmızı tuğla duvarın arkasında duruyor; önünde palmiyeler ve başka ağaçlar var, açık mavi bir gökyüzünün altında."
  id: "Masjid dengan satu kubah besar berwarna pucat dan kubah-kubah yang lebih kecil di kedua sisinya berdiri di balik tembok bata merah yang rendah, dengan pohon palem dan pepohonan lain di depannya, di bawah langit biru cerah."
