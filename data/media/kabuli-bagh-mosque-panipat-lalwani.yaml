summary:
  ar: "تُظهر الصورة مسجد كابلي باغ في باني بت خلف سور فنائه، وقبته الكبيرة الفاتحة بين الأشجار. صورة التقطها Ramesh Lalwani في 18 ديسمبر 2009، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the Kabuli Bagh Mosque at Panipat behind its enclosure wall, with its large pale dome among trees. Photograph by Ramesh Lalwani, 18 December 2009, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں پانی پت کی مسجد کابلی باغ اپنی چار دیواری کے پیچھے دکھائی دیتی ہے، اس کا بڑا ہلکے رنگ کا گنبد درختوں کے بیچ ہے۔ تصویر: Ramesh Lalwani، 18 دسمبر 2009ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la mosquée Kabuli Bagh à Panipat derrière son mur d'enceinte, avec sa grande coupole claire parmi les arbres. Photographie : Ramesh Lalwani, 18 décembre 2009, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la mezquita Kabuli Bagh en Panipat detrás de su muro de cerramiento, con su gran cúpula clara entre los árboles. Fotografía de Ramesh Lalwani, 18 de diciembre de 2009, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Panipat'taki Kabuli Bağ Camii'ni avlu duvarının arkasında, ağaçların arasındaki büyük açık renkli kubbesiyle gösteriyor. Fotoğraf: Ramesh Lalwani, 18 Aralık 2009; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Masjid Kabuli Bagh di Panipat di balik tembok pagarnya, dengan kubah besarnya yang berwarna pucat di antara pepohonan. Foto oleh Ramesh Lalwani, 18 Desember 2009, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
