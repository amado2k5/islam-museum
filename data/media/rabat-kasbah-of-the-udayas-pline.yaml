summary:
  ar: "تُظهر الصورة قصبة الأوداية في الرباط فوق نهر أبي رقراق، وفي المقدمة أرصفة النهر. صورة التقطها Pline في نوفمبر 2009، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the Kasbah of the Udayas in Rabat above the Bou Regreg river, with the riverside quays in the foreground. Photograph by Pline, November 2009, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں رباط میں قصبہ اوداویہ ابو رقراق دریا کے اوپر دکھائی دیتا ہے، اور سامنے دریا کے کنارے کے گھاٹ ہیں۔ تصویر: Pline، نومبر 2009ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la casbah des Oudayas à Rabat au-dessus du fleuve Bou Regreg, avec les quais du fleuve au premier plan. Photographie : Pline, novembre 2009, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la Kasbah de los Udayas en Rabat sobre el río Bou Regreg, con los muelles del río en primer plano. Fotografía de Pline, noviembre de 2009, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Rabat'taki Udaya Kasbası'nı Ebu Rakrak Nehri'nin üzerinde, ön planda nehir kıyısı rıhtımlarıyla birlikte gösteriyor. Fotoğraf: Pline, Kasım 2009; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Kasbah Udayas di Rabat di atas sungai Bou Regreg, dengan dermaga tepi sungai di latar depan. Foto oleh Pline, November 2009, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
