depicts: [place/rabat]
alt:
  ar: "حي مسوّر من بيوت بيضاء فيه مئذنة مربعة يقوم على رأس بري فوق أسوار بلون المغرة بجانب نهر عريض؛ وفي المقدمة طريق على ضفة النهر فيه نخيل وأعمدة إنارة وبضع مركبات."
  en: "A walled quarter of white houses with a square minaret sits on a headland above ochre ramparts beside a broad river; in the foreground a riverside road with palms, lamp posts and a few vehicles."
  ur: "سفید مکانات کا ایک فصیل بند محلہ جس میں ایک چوکور مینار ہے، ایک چوڑے دریا کے کنارے گیرو رنگ کی فصیلوں کے اوپر ایک راس پر واقع ہے؛ سامنے دریا کے کنارے کی سڑک ہے جس پر کھجور کے درخت، بجلی کے کھمبے اور چند گاڑیاں ہیں۔"
  fr: "Un quartier fortifié de maisons blanches à minaret carré se dresse sur un promontoire au-dessus de remparts ocre au bord d'un large fleuve ; au premier plan, une route longeant le fleuve avec des palmiers, des lampadaires et quelques véhicules."
  es: "Un barrio amurallado de casas blancas con un minarete cuadrado se asienta en un promontorio sobre murallas ocre junto a un ancho río; en primer plano, una carretera ribereña con palmeras, farolas y algunos vehículos."
  tr: "Kare minareli beyaz evlerden oluşan surlarla çevrili bir mahalle, geniş bir nehrin yanında toprak sarısı surların üzerinde bir burunda yer alıyor; ön planda palmiyeleri, lamba direkleri ve birkaç aracı olan nehir kıyısı yolu var."
  id: "Permukiman bertembok berisi rumah-rumah putih dengan menara persegi terletak di tanjung di atas benteng berwarna oker di samping sungai yang lebar; di latar depan terdapat jalan tepi sungai dengan pohon palem, tiang lampu, dan beberapa kendaraan."
