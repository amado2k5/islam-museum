summary:
  ar: "صورة حديثة لسهول جبل سنجار في شمال العراق التقطها حسن عمر؛ مشهد طبيعي سياقي لا صورة للمسح العباسي ولا دليلاً على موضعه الدقيق."
  en: "A modern photograph of the Jebel Sinjar plains in northern Iraq by Hassan Omar; landscape context only — not a photograph of the Abbasid survey or proof of its exact site."
  ur: "شمالی عراق میں جبل سنجار کے میدانوں کی حسن عمر کی جدید تصویر؛ صرف منظر کا سیاق — عباسی پیمائش کی تصویر نہیں اور اس کے عین مقام کا ثبوت نہیں۔"
  es: "Fotografía moderna de las llanuras de Jebel Sinjar, en el norte de Irak, tomada por Hassan Omar; solo muestra el contexto del paisaje, no es una fotografía del estudio topográfico abasí ni una prueba de su ubicación exacta."
  fr: "Photographie moderne des plaines de Jebel Sinjar, dans le nord de l'Irak, par Hassan Omar; contexte paysager uniquement — il ne s'agit pas d'une photographie du relevé abbasside ni d'une preuve de son emplacement exact."
  tr: "Hasan Ömer tarafından çekilmiş, Irak'ın kuzeyindeki Sincar Dağı ovalarının yakın tarihli bir fotoğrafı; bağlamı yansıtan doğal bir sahne, Abbasi dönemine ait bir keşif gezisinin fotoğrafı veya kesin konumuna dair bir kanıt değil."
  id: "Foto terbaru dataran Gunung Sinjar di Irak utara yang diambil oleh Hassan Omar; sebuah pemandangan alam kontekstual, bukan foto survei Abbasiyah atau bukti lokasi tepatnya."
