summary:
  ar: "سلسلة تعليمية تبين خطوتي كل باب في كتاب الللكائي: ذكر المروي ووقت الخلاف ومن بدأه، ثم الحجة من القرآن والحديث وأقوال السلف؛ لا ترسم نصاً."
  en: "Teaching chain showing the two steps of each chapter in al-Lalaka'i's book: stating the transmitted report, the time and origin of the dispute, then argument from the Qur'an, hadith and sayings of the early generations; it draws no text."
  ur: "تدریسی سلسلہ جو للاکائی کی کتاب کے ہر باب کے دو مراحل دکھاتا ہے: مروی کا ذکر، اختلاف کا وقت اور آغاز، پھر قرآن، حدیث اور سابقین کے اقوال سے دلیل؛ نہ متن۔"
  es: "Cadena de enseñanza que muestra los dos pasos de cada capítulo del libro de al-Lalaka'i: se expone el relato transmitido, el momento y el origen de la disputa, y luego el argumento del Corán, los hadices y los dichos de las primeras generaciones; no incluye ningún texto."
  fr: "Chaîne d'enseignement montrant les deux étapes de chaque chapitre du livre d'al-Lalaka'i: énoncer le récit transmis, la date et l'origine du différend, puis l'argumentation tirée du Coran, des hadiths et des paroles des premières générations; elle ne cite aucun texte."
  tr: "Al-Lalaka'i'nin kitabındaki her bölümün iki aşamasını gösteren eğitici bir seri: rivayeti, ihtilafın zamanını ve kimin başlattığını belirtmek, ardından Kur'an, Hadis ve seleflerin sözlerinden deliller sunmak; metinden alıntı yapmamaktadır."
  id: "Seri edukatif yang menunjukkan dua langkah dari setiap bab dalam kitab Al-Lalaka’i: menyebutkan riwayat, waktu terjadinya perselisihan, dan siapa yang memulainya, kemudian bukti dari Al-Qur'an, Hadits, dan ucapan para pendahulu; seri ini tidak menggambar teks."
