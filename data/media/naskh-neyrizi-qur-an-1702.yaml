"summary":
  "ar": "صورة لورقة مصحف بخط النسخ نسخها أحمد النيريزي سنة ١٧٠٢م، مكتبة ملك الوطنية رقم ١٣٠، كما تذكر صفحة الملف. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio of the Qur'an in Naskh script copied by Ahmad Neyrizi in 1702, Malek National Library no. 130, as the file page states. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "نسخ خط میں مصحف کے ایک ورق کی تصویر، جسے احمد نیریزی نے ۱۷۰۲ء میں نقل کیا، ملک نیشنل لائبریری نمبر ۱۳۰، جیسا کہ فائل کا صفحہ بتاتا ہے۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán en escritura naskh, copiado por Ahmad Neyrizi en 1702, perteneciente a la Biblioteca Nacional de Malek (n.º 130), según indica la ficha del archivo. Sirve como ejemplo de la escritura naskh, una caligrafía pequeña y uniforme que se convirtió en la habitual para copiar libros y pequeños ejemplares del Corán. En Wikimedia Commons, el archivo es de dominio público."
  "fr": "Photographie d'un folio du Coran en écriture naskh, copié par Ahmad Neyrizi en 1702 (Bibliothèque nationale Malek, n° 130, comme indiqué sur la page du fichier). Cet exemplaire illustre l'écriture naskh, une petite écriture cursive régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Dosya sayfasında belirtildiği gibi, 1702 yılında Ahmed el-Nayrizi tarafından Naskh yazısıyla kopyalanmış bir Kur'an sayfasının fotoğrafı, Kraliyet Kütüphanesi Ulusal Kütüphanesi No. 130'da bulunmaktadır. Bu fotoğraf, kitapların ve küçük Kur'anların kopyalanmasında yaygınlaşan küçük, el yazısı olan Naskh'ın bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman Al-Qur'an dalam aksara Naskh, disalin oleh Ahmad al-Nayrizi pada tahun 1702 M, Perpustakaan Nasional King's Library No. 130, seperti yang tercatat pada halaman arsip. Foto ini berfungsi sebagai contoh aksara Naskh, yaitu aksara kursif kecil yang umum digunakan dalam menyalin buku dan Al-Qur'an berukuran kecil. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
