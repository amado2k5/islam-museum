summary:
  ar: "سلسلة تعليمية تبين النسئ الجاهلي وقرار إلغائه والربط بالعهد الهجري؛ لا تدعي صيغة حسابية واحدة منذ البداية."
  en: "A teaching chain showing pre-Islamic intercalation, its abolition and the Hijra-era anchor; it claims no single computation from the start."
  ur: "تدریسی سلسلہ جو جاهلیت کے نسئ، اس کے خاتمے اور عہدِ ہجرت کی ربط دکھاتا ہے؛ ابتدائی ایک ہی حسابی صيغة کا دعویٰ نہیں۔"
  es: "Una cadena de enseñanzas que muestra la intercalación preislámica, su abolición y el ancla de la era de la Hégira; no afirma que exista un único cálculo desde el principio."
  fr: "Une chaîne pédagogique montrant l'intercalation préislamique, son abolition et l'ancrage de l'ère de l'Hégire; elle ne prétend à aucun calcul unique dès le départ."
  tr: "İslam öncesi dönemdeki araya girme olayını ve bunun kaldırılması kararını açıklayan ve Hicri döneme bağlayan eğitici bir dizi; baştan beri tek bir matematiksel formül iddiasında bulunmuyor."
  id: "Sebuah seri edukasi yang menjelaskan tentang penambahan waktu pra-Islam dan keputusan untuk menghapuskannya serta mengaitkannya dengan era Hijriah; seri ini tidak mengklaim satu pun rumus matematika sejak awal."
