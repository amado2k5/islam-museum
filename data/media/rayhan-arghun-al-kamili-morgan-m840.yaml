"label":
  "ar": "صفحة من مصحف نسخه أرغون الكاملي بالريحان والنسخ، مكتبة مورغان"
  "en": "Page from the Qur'an copied by Arghun al-Kamili in Raihan and Naskh, Morgan Library"
  "ur": "ارغون کاملی کے نقل کردہ قرآن کا صفحہ، ریحان اور نسخ، مورگن لائبریری"
"summary":
  "ar": "صورة لصفحة من المصحف الذي نسخه عبد الله أرغون الكاملي، مكتبة مورغان ومتحفها M.840، الورقة ١ وجه، تصفها صفحة الملف بأنها بخط الريحان والنسخ، فيها سورة سبأ، ومقاسها ٣٣٨ في ٢٥٧ ملم، العراق، بغداد على الأرجح، الربع الأول من القرن الرابع عشر. تخدم مثالًا على الريحان، الصورة الأصغر من المحقق، وقد كُتبت به مصاحف كاملة كما استُعمل في العناوين والصفحات المزخرفة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page from the Qur'an copied by Abd Allah Arghun al-Kamili, Morgan Library and Museum Ms M.840, 1 recto, which the file page describes as in Raihan and naskh script, with sura 34, Saba, 338 by 257 mm, Iraq, probably Baghdad, first quarter of the 14th century. It serves as an example of Rayhan, the smaller sibling of Muhaqqaq, used for full mushafs as well as headings and decorated pages. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "عبد اللہ ارغون کاملی کے نقل کردہ قرآن کے ایک صفحے کی تصویر، مورگن لائبریری اینڈ میوزیم M.840، ورق ۱ رخ؛ فائل کا صفحہ اسے ریحان اور نسخ خط میں بتاتا ہے، جس میں سورۂ سبا ہے، ۳۳۸ ضرب ۲۵۷ ملی میٹر، عراق، غالباً بغداد، چودھویں صدی کی پہلی چوتھائی۔ یہ ریحان کی مثال ہے، جو محقق کی چھوٹی صورت ہے اور جس میں مکمل مصاحف بھی لکھے گئے اور عنوانات اور آراستہ صفحات بھی۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
