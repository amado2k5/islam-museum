"alt":
  "ar": "صفحة مخطوط بالخط الريحان: أسطر من الكتابة العربية اليدوية على ورقة واحدة؛ وفي الشرح المرافق ما تقوله صفحة الملف عن علاماتها."
  "en": "A manuscript page in Rayhan script: lines of handwritten Arabic script on a single leaf; see the caption for what the file page says about its marks."
