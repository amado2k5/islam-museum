  "tr": "Morgan Kütüphanesi'nde bulunan, Arghun al-Kamili tarafından Rayhan ve Naskh yazısıyla kopyalanmış bir Kur'an sayfası."
  "id": "Sebuah halaman dari Al-Qur'an yang disalin oleh Arghun al-Kamili dalam aksara Rayhan dan Naskh, Perpustakaan Morgan."
"summary":
  "ar": "صورة لصفحة من المصحف الذي نسخه عبد الله أرغون الكاملي، مكتبة مورغان ومتحفها M.840، الورقة ١ وجه، تصفها صفحة الملف بأنها بخط الريحان والنسخ، فيها سورة سبأ، ومقاسها ٣٣٨ في ٢٥٧ ملم، العراق، بغداد على الأرجح، الربع الأول من القرن الرابع عشر. تخدم مثالًا على الريحان، الصورة الأصغر من المحقق، وقد كُتبت به مصاحف كاملة كما استُعمل في العناوين والصفحات المزخرفة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page from the Qur'an copied by Abd Allah Arghun al-Kamili, Morgan Library and Museum Ms M.840, 1 recto, which the file page describes as in Raihan and naskh script, with sura 34, Saba, 338 by 257 mm, Iraq, probably Baghdad, first quarter of the 14th century. It serves as an example of Rayhan, the smaller sibling of Muhaqqaq, used for full mushafs as well as headings and decorated pages. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "عبد اللہ ارغون کاملی کے نقل کردہ قرآن کے ایک صفحے کی تصویر، مورگن لائبریری اینڈ میوزیم M.840، ورق ۱ رخ؛ فائل کا صفحہ اسے ریحان اور نسخ خط میں بتاتا ہے، جس میں سورۂ سبا ہے، ۳۳۸ ضرب ۲۵۷ ملی میٹر، عراق، غالباً بغداد، چودھویں صدی کی پہلی چوتھائی۔ یہ ریحان کی مثال ہے، جو محقق کی چھوٹی صورت ہے اور جس میں مکمل مصاحف بھی لکھے گئے اور عنوانات اور آراستہ صفحات بھی۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página del Corán copiada por Abd Allah Arghun al-Kamili, Morgan Library and Museum Ms M.840, 1 recto, que la ficha del archivo describe como escrita en escritura Raihan y naskh, con la sura 34, Saba, 338 x 257 mm, Irak, probablemente Bagdad, primer cuarto del siglo XIV. Sirve como ejemplo de Raihan, la variante menor de Muhaqqaq, utilizada para mushafs completos, así como para encabezados y páginas decoradas. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une page du Coran copiée par Abd Allah Arghun al-Kamili (Ms M.840, recto, Morgan Library and Museum). La fiche descriptive indique qu'elle est écrite en écriture raihan et naskh, avec la sourate 34, Saba, 338 x 257 mm, Irak, probablement Bagdad, premier quart du XIVe siècle. Elle illustre l'utilisation du raihan, une variante plus petite du muhaqqaq, employée pour les manuscrits complets, les titres et les pages ornées. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Abdullah Arghun al-Kamili tarafından kopyalanmış bir Kur'an sayfasının fotoğrafı, Morgan Kütüphanesi ve Müzesi M.840, folio 1 recto. Dosya sayfasında, Rayhani ve Naskh yazılarıyla yazılmış, Saba Suresi'ni içeren ve 338 x 257 mm ölçülerinde olduğu belirtiliyor. Muhtemelen Irak'ın Bağdat şehrinden olup, 14. yüzyılın ilk çeyreğine tarihlenmektedir. Bu, Kur'an'ın tamamını yazmak, başlıklar ve süsleme sayfaları için kullanılan, Muhaqqaq'ın daha küçük bir versiyonu olan Rayhani yazısının bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman Al-Qur'an yang disalin oleh Abdullah Arghun al-Kamili, Morgan Library and Museum M.840, folio 1 recto. Halaman arsip tersebut mendeskripsikannya sebagai tulisan Rayhani dan Naskh, berisi Surah Saba, dan berukuran 338 x 257 mm. Kemungkinan berasal dari Baghdad, Irak, dan bertanggal seperempat pertama abad ke-14. Ini berfungsi sebagai contoh tulisan Rayhani, versi yang lebih kecil dari Muhaqqaq, yang digunakan untuk menulis seluruh Al-Qur'an dan untuk judul serta halaman dekoratif. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
