summary:
  ar: "تُظهر الصورة المسجد العتيق في ستارا زاغورا من أحد أركانه، وعقود رواقه. صورة التقطها Ivanowitsch في 10 أغسطس 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the Old Mosque of Stara Zagora from one corner, with the arches of its porch. Photograph by Ivanowitsch, 10 August 2012, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں سٹارا زاگورا کی قدیم مسجد ایک کونے سے دکھائی دیتی ہے، اس کے برآمدے کی محرابوں کے ساتھ۔ تصویر: Ivanowitsch، 10 اگست 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la Vieille Mosquée de Stara Zagora depuis un angle, avec les arcs de son porche. Photographie : Ivanowitsch, 10 août 2012, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la Mezquita Vieja de Stara Zagora desde una esquina, con los arcos de su pórtico. Fotografía de Ivanowitsch, 10 de agosto de 2012, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Eski Zağra'daki Eski Cami'yi bir köşeden, revağının kemerleriyle birlikte gösteriyor. Fotoğraf: Ivanowitsch, 10 Ağustos 2012; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan Masjid Tua di Stara Zagora dari salah satu sudutnya, dengan lengkung-lengkung serambinya. Foto oleh Ivanowitsch, 10 Agustus 2012, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
