alt:
  ar: "مبنى مربع من مداميك متناوبة من الآجر والحجر له رواق بعقود مستديرة واسعة تغلقها مشبّكات حديدية، يُرى من أحد أركانه عبر عشب يابس، وخلفه مبنى أبيض حديث."
  en: "A square building of alternating bands of brick and stone with a porch of wide round arches closed by iron grilles, seen from a corner across dry grass, with a modern white building behind."
  ur: "ایک چوکور عمارت جس میں اینٹ اور پتھر کی باری باری پٹیاں ہیں اور کشادہ گول محرابوں والا برآمدہ لوہے کی جالیوں سے بند ہے، ایک کونے سے خشک گھاس کے پار دکھائی دیتی ہے، اور پیچھے ایک جدید سفید عمارت ہے۔"
  fr: "Un bâtiment carré à bandes alternées de brique et de pierre, avec un porche à larges arcs en plein cintre fermés par des grilles de fer, vu d'un angle au-delà d'une herbe sèche, avec un bâtiment blanc moderne derrière."
  es: "Un edificio cuadrado de bandas alternas de ladrillo y piedra, con un pórtico de anchos arcos de medio punto cerrados por rejas de hierro, visto desde una esquina a través de hierba seca, con un edificio blanco moderno detrás."
  tr: "Tuğla ve taş şeritlerin dönüşümlü sıralandığı kare bir yapı, demir parmaklıklarla kapatılmış geniş yuvarlak kemerli bir revağa sahip; bir köşeden kuru otların ötesinden görülüyor, arkasında modern beyaz bir bina var."
  id: "Bangunan persegi dengan lapisan bata dan batu yang berselang-seling dan serambi berlengkung bundar lebar yang ditutup terali besi, terlihat dari sudut melintasi rumput kering, dengan bangunan putih modern di belakangnya."
