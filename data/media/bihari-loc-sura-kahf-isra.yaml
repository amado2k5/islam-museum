"summary":
  "ar": "صورة لورقة من مكتبة الكونغرس تؤرخها صفحة الملف بما بين نحو ١٤٠٠ ونحو ١٥٢٥م، فيها الآيات ٢ إلى ٨ من سورة الكهف على اليمين والآيات ٦٧ إلى ٧٠ من سورة الإسراء على اليسار، وفي هوامشها شرح فارسي. وتقول صفحة الملف إنها بخط يُعرف بالبهاري، وهو صورة من النسخ شاعت في شمال الهند بعد فتح تيمور، يُعرف بتأكيده العناصر النازلة تحت السطر مغلّظة في وسطها محدّدة الأطراف كالسيوف. تخدم مثالًا على الخط البهاري الثقيل الطابع الذي كُتبت به مصاحف الهند بين القرنين الرابع عشر ومطلع السادس عشر، بأطراف حروف حادة كالسيوف ومسافات واسعة بين الكلمات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress folio, dated by the file page to between about 1400 and about 1525, with sura al-Kahf, verses 2 to 8, on the right and sura al-Isra', verses 67 to 70, on the left; the borders carry a Persian commentary. The file page says it is written in a script known as bihari, a variant of naskh typical of northern India after Timur's conquest, recognisable by its emphasis on the sublinear elements of the letters, thickened at their centres and chiselled like swords at their ends. It serves as an example of Bihari, the weighty hand of Indian mushafs of the fourteenth to early sixteenth centuries, with sharp, sword-like letter ends and wide word spacing. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک ورق کی تصویر جسے فائل کا صفحہ تقریباً ۱۴۰۰ اور تقریباً ۱۵۲۵ء کے درمیان کا بتاتا ہے، دائیں طرف سورۂ کہف کی آیات ۲ تا ۸ اور بائیں طرف سورۂ اسراء کی آیات ۶۷ تا ۷۰، اور حاشیوں میں فارسی تفسیر۔ صفحہ کہتا ہے کہ یہ بہاری نامی خط میں ہے، جو نسخ کی ایک صورت ہے اور تیمور کی فتح کے بعد شمالی ہندوستان میں رائج ہوئی، جس کی پہچان حروف کے سطر سے نیچے کے حصوں پر زور ہے، جو بیچ میں موٹے اور سروں پر تلوار کی طرح تراشے ہوئے ہیں۔ یہ بہاری خط کی مثال ہے، ہندوستانی مصاحف کا بھاری خط، جو چودھویں سے سولہویں صدی کے آغاز تک رائج رہا، جس میں حروف کے سرے تلوار کی طرح تیز اور الفاظ کے درمیان فاصلہ کھلا ہوتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio de la Biblioteca del Congreso, fechado en la página del archivo entre aproximadamente 1400 y 1525, con la sura al-Kahf, versículos 2 a 8, a la derecha y la sura al-Isra', versículos 67 a 70, a la izquierda; los márgenes llevan un comentario en persa. La página del archivo indica que está escrito en una escritura conocida como bihari, una variante del naskh típica del norte de la India después de la conquista de Tamerlán, reconocible por su énfasis en los elementos sublineales de las letras, engrosadas en sus centros y cinceladas como espadas en sus extremos. Sirve como ejemplo de bihari, la caligrafía pesada de los mushafs indios de los siglos XIV a principios del XVI, con extremos de letras afilados como espadas y un amplio espaciado entre palabras. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'un folio de la Bibliothèque du Congrès, daté d'après la fiche descriptive entre 1400 et 1525 environ, avec la sourate al-Kahf (versets 2 à 8) à droite et la sourate al-Isra' (versets 67 à 70) à gauche; les marges portent un commentaire persan. La fiche descriptive indique que le texte est écrit en bihari, une variante du naskh typique du nord de l'Inde après la conquête de Tamerlan, reconnaissable à l'accent mis sur les éléments sublinéaires des lettres, épaissis en leur centre et ciselés comme des épées à leurs extrémités. Ce folio illustre le bihari, l'écriture robuste des mushafs indiens du XIVe au début du XVIe siècle, avec des lettres aux extrémités pointues et un espacement important entre les mots. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Kongre Kütüphanesi'nden, yaklaşık 1400 ile 1525 yılları arasına tarihlenen bir belgenin fotoğrafı, sağda Kehf Suresi'nin 2-8. ayetlerini, solda ise İsra Suresi'nin 67-70. ayetlerini ve kenar boşluklarında Farsça bir tefsiri göstermektedir. Belge, Timur'un fethinden sonra Kuzey Hindistan'da yaygınlaşan Bihari yazı stiliyle yazıldığını belirtmektedir. Bu yazı stili, ortası kalın ve keskin, kılıç benzeri kenarlara sahip küçük harflere vurgu yapmasıyla karakterize edilir. Keskin, kılıç benzeri harf kenarları ve kelimeler arasındaki geniş boşluklarıyla, 14. ve 16. yüzyılların başları arasında Hindistan'daki Kur'anlarda kullanılan kalın, cesur Bihari yazısının bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto dokumen dari Perpustakaan Kongres, bertanggal sekitar tahun 1400 hingga 1525 M, menunjukkan ayat 2-8 Surah Al-Kahf di sebelah kanan dan ayat 67-70 Surah Al-Isra di sebelah kiri, dengan komentar Persia di margin. Dokumen tersebut menyatakan bahwa dokumen itu ditulis dalam aksara yang dikenal sebagai Bihari, gaya manuskrip yang menjadi tersebar luas di India utara setelah penaklukan oleh Timur. Aksara ini dicirikan oleh penekanannya pada huruf kecil, yang tebal di tengah dan memiliki tepi yang tajam seperti pedang. Ini berfungsi sebagai contoh aksara Bihari yang tebal dan berat yang digunakan dalam Al-Qur'an di India antara abad ke-14 dan awal abad ke-16, dengan tepi huruf yang tajam seperti pedang dan jarak yang lebar antar kata. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
