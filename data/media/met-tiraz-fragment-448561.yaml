summary:
  ar: "قطعة من نسيج الملحم ⁦(سدى من حرير ولحمة من قطن)⁩ عليها شريط طراز مطرّز بخط كوفي، يؤرّخها متحف المتروبوليتان للفن في نيويورك بنحو 892–902م، رقم القيد 31.19.2، هدية جورج د. برات سنة 1931. صورة المتحف في الملك العام."
  en: "A piece of mulham cloth (silk warp, cotton weft) with an embroidered tiraz band in Kufic script, dated by the Metropolitan Museum of Art, New York, to about 892–902, accession 31.19.2, gift of George D. Pratt, 1931. The museum's photograph is in the public domain."
  ur: "ملحم کپڑے ⁦(ریشمی تانا، سوتی بانا)⁩ کا ایک ٹکڑا جس پر کوفی خط میں کڑھائی والی طراز کی پٹی ہے؛ میٹروپولیٹن میوزیم آف آرٹ، نیویارک، اسے تقریباً 892–902ء کا بتاتا ہے، رجسٹر نمبر 31.19.2، جارج ڈی پریٹ کا 1931 کا عطیہ۔ میوزیم کی تصویر پبلک ڈومین میں ہے۔"
