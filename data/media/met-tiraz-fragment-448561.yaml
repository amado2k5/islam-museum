alt:
  ar: "قطعة قماش فاتح اللون، ممزقة الحواف ومبقعة بالبني، يعبرها في الثلث الأعلى شريط أفقي من الكتابة الكوفية بالأحمر، حروفه القائمة طويلة متقاربة كأسنان المشط، وتحتها سطر رفيع من الحروف المتصلة."
  en: "A pale piece of cloth, torn at the edges and stained brown, crossed in its upper third by a horizontal band of Kufic writing in red: tall, close-set upright letters like the teeth of a comb above a thin line of joined letters."
