depicts: [place/mostar]
alt:
  ar: "جسر حجري عالٍ بعقد واحد يعبر نهرًا أخضر بين برجين حجريين، وعلى الضفتين بيوت حجرية قديمة وأشجار، وخلفه جبل رمادي شديد الانحدار، تحت سماء زرقاء فيها سحب."
  en: "A single high stone arch bridge spans a green river between two stone towers, with old stone houses and trees on both banks and a steep grey mountain behind, under a blue sky with clouds."
  ur: "ایک واحد محراب والا بلند پتھر کا پل دو پتھر کے برجوں کے بیچ ایک سبز دریا کو عبور کرتا ہے، دونوں کناروں پر پرانے پتھر کے مکانات اور درخت ہیں اور پیچھے ایک عمودی سرمئی پہاڑ ہے، بادلوں بھرے نیلے آسمان تلے۔"
  fr: "Un haut pont de pierre à arche unique enjambe une rivière verte entre deux tours de pierre, avec de vieilles maisons de pierre et des arbres sur les deux rives et une montagne grise abrupte derrière, sous un ciel bleu nuageux."
  es: "Un alto puente de piedra de un solo arco salva un río verde entre dos torres de piedra, con viejas casas de piedra y árboles en ambas orillas y una empinada montaña gris detrás, bajo un cielo azul con nubes."
  tr: "Tek kemerli yüksek bir taş köprü, iki taş kule arasında yeşil bir nehri aşıyor; iki kıyıda eski taş evler ve ağaçlar, arkada dik gri bir dağ var, bulutlu mavi bir gökyüzünün altında."
  id: "Jembatan batu tinggi berlengkung tunggal membentang di atas sungai hijau di antara dua menara batu, dengan rumah-rumah batu tua dan pepohonan di kedua tepi serta gunung abu-abu yang curam di belakangnya, di bawah langit biru berawan."
