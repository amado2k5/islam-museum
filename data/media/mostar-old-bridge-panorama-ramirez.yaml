summary:
  ar: "تُظهر الصورة البلدة القديمة في موستار والجسر القديم على النهر، ملتقطة من مئذنة جامع كوسكي محمد باشا. صورة التقطها Ramirez في 10 يوليو 2007، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the old town of Mostar with the Old Bridge over the river, taken from the minaret of the Koski Mehmed Pasha Mosque. Photograph by Ramirez, 10 July 2007, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں موستار کا پرانا شہر اور دریا پر پرانا پل دکھائی دیتا ہے، جو جامع کوسکی محمد پاشا کے مینار سے لی گئی ہے۔ تصویر: Ramirez، 10 جولائی 2007ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la vieille ville de Mostar avec le Vieux Pont sur la rivière, prise depuis le minaret de la mosquée Koski Mehmed Pacha. Photographie : Ramirez, 10 juillet 2007, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la ciudad vieja de Mostar con el Puente Viejo sobre el río, tomada desde el minarete de la mezquita de Koski Mehmed Pachá. Fotografía de Ramirez, 10 de julio de 2007, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Mostar'ın eski şehrini ve nehrin üzerindeki Eski Köprü'yü, Koski Mehmed Paşa Camii'nin minaresinden çekilmiş olarak gösteriyor. Fotoğraf: Ramirez, 10 Temmuz 2007; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan kota tua Mostar dengan Jembatan Tua di atas sungai, diambil dari menara Masjid Koski Mehmed Pasha. Foto oleh Ramirez, 10 Juli 2007, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
