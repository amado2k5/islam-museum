alt:
  ar: "إلى اليسار خط متقطع للخندق مكتوب تحته: الخندق، أصيب سعد بن معاذ بسهم. سهم أحمر يمضي منه إلى اليمين مكتوب عليه: يُحمل الجريح إلى المسجد. إلى اليمين مستطيل مكتوب عليه: المسجد، وفي داخله مثلث خيمة مكتوب تحته: خيمة رفيدة، تداوي الجرحى وتقوم على خدمتهم. وفي الأعلى: قريب ليُعاد صباحاً ومساءً"
  en: "On the left, a dashed line for the trench, labelled The Trench, Sa'd ibn Mu'adh is struck by an arrow. A red arrow runs from it to the right, labelled the wounded man is moved to the mosque. On the right, a rectangle labelled The mosque, with a tent-shaped triangle inside labelled Rufayda's tent, she treats and tends the wounded. Across the top: close by, to be visited morning and evening"
