alt:
  ar: "مدينة في وادٍ بين تلال خضراء: في المقدمة سقوف من القرميد الأحمر ونهر عليه جسور، وعلى الضفة مبنى عام كبير فاتح اللون، وفي البعيد أبراج سكنية يغشاها الضباب."
  en: "A city in a valley between green hills: red-tiled roofs and a river with bridges in the foreground, a large pale public building on the bank, and high-rise blocks in the hazy distance."
  ur: "سبز پہاڑیوں کے بیچ ایک وادی میں ایک شہر: سامنے سرخ کھپریل کی چھتیں اور پلوں والا دریا، کنارے پر ایک بڑی ہلکے رنگ کی سرکاری عمارت، اور دھندلی دوری میں بلند رہائشی عمارتیں۔"
  fr: "Une ville dans une vallée entre des collines vertes : des toits de tuiles rouges et une rivière avec des ponts au premier plan, un grand bâtiment public clair sur la rive, et des immeubles de grande hauteur dans le lointain brumeux."
  es: "Una ciudad en un valle entre colinas verdes: tejados de teja roja y un río con puentes en primer plano, un gran edificio público claro en la orilla y bloques de gran altura en la lejanía brumosa."
  tr: "Yeşil tepeler arasındaki bir vadide bir şehir: ön planda kırmızı kiremitli çatılar ve köprülü bir nehir, kıyıda büyük açık renkli bir kamu binası, puslu uzaklıkta yüksek apartman blokları."
  id: "Sebuah kota di lembah di antara perbukitan hijau: atap genteng merah dan sungai dengan jembatan di latar depan, gedung umum besar berwarna pucat di tepi sungai, dan blok-blok bertingkat tinggi di kejauhan yang berkabut."
