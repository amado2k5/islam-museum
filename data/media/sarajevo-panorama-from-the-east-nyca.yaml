summary:
  ar: "تُظهر الصورة سراييفو من جهة الشرق، والنهر يجري في البلدة القديمة نحو المدينة الحديثة في واديها. صورة التقطها Julian Nyča في 2 أغسطس 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows Sarajevo from the east, the river running through the old town toward the modern city in its valley. Photograph by Julian Nyča, 2 August 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں سراجیوو مشرق کی جانب سے دکھائی دیتا ہے، دریا پرانے شہر سے گزر کر اپنی وادی میں جدید شہر کی طرف بہہ رہا ہے۔ تصویر: Julian Nyča، 2 اگست 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre Sarajevo vue de l'est, la rivière traversant la vieille ville vers la ville moderne dans sa vallée. Photographie : Julian Nyča, 2 août 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra Sarajevo desde el este, con el río que atraviesa la ciudad vieja hacia la ciudad moderna en su valle. Fotografía de Julian Nyča, 2 de agosto de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Saraybosna'yı doğudan, nehrin eski şehrin içinden vadisindeki modern şehre doğru aktığı halde gösteriyor. Fotoğraf: Julian Nyča, 2 Ağustos 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan Sarajevo dari timur, dengan sungai mengalir melalui kota tua menuju kota modern di lembahnya. Foto oleh Julian Nyča, 2 Agustus 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
