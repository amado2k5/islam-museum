label:
  ar: "من النسخ والتعليق إلى النستعليق"
  en: "From naskh and ta'liq to nasta'liq"
  ur: "نسخ و تعلیق سے نستعلیق تک"
  es: "De naskh y ta'liq a nasta'liq"
  fr: "Du naskh et du ta'liq au nasta'liq"
  tr: "Kopyalama ve yorumlamadan Nasta'liq'e"
  id: "Dari penyalinan dan komentar hingga Nasta'liq"
summary:
  ar: "سلسلة تعليمية تبين اندماج النسخ والتعليق في خط جديد في شيراز وتبريز أواخر القرن الثامن الهجري؛ لا تنسب اختراعاً مفرداً."
  en: "Teaching chain showing the merging of naskh and ta'liq into a new script in Shiraz and Tabriz in the late fourteenth century; it does not claim a single inventor."
  ur: "تدریسی سلسلہ جو چودہویں صدی کے آخر میں شیراز و تبریز میں نسخ اور تعلیق کے امتزاج کو نئے خط میں دکھاتا ہے؛ یہ کسی ایک ایجاد کنندہ کا دعویٰ نہیں کرتا۔"
  es: "Cadena de enseñanza que muestra la fusión de naskh y ta'liq en una nueva escritura en Shiraz y Tabriz a finales del siglo XIV; no atribuye un único inventor."
  fr: "Chaîne d'enseignement montrant la fusion du naskh et du ta'liq en une nouvelle écriture à Shiraz et Tabriz à la fin du XIVe siècle; elle ne revendique pas un seul inventeur."
  tr: "Hicri 8. yüzyılın sonlarında Şiraz ve Tebriz'de kopyalama ve yorumlamanın yeni bir yazı sistemine entegrasyonunu gösteren eğitici bir seridir; tek bir icadı bile öne sürmez."
  id: "Seri pendidikan yang mendemonstrasikan integrasi penyalinan dan komentar ke dalam aksara baru di Shiraz dan Tabriz pada akhir abad kedelapan Hijriah; seri ini tidak mengaitkan penemuan tunggal apa pun."
