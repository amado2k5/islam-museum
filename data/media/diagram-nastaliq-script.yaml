alt:
  ar: "النسخ الواضح للكتب، فالتعليق الكتبي السريع، فالنستعليق الرشيق الذي جمع سماتهما في شيراز وتبريز؛ مع الإشارة إلى أن النسبة إلى مير علي التبريزي متنازع عليها."
  en: "Clear bookish naskh, then swift chancellery ta'liq, then the flowing nasta'liq that combined their traits in Shiraz and Tabriz; with a note that the attribution to Mir Ali Tabrizi is contested."
  ur: "واضح کتابی نسخ، پھر تیز دفتری تعلیق، پھر رسیلا نستعلیق جس نے شیراز و تبریز میں دونوں کی خوبیاں جمع کیں؛ نوٹ کہ میر علی تبریزی سے نسبت متنازعہ ہے۔"
