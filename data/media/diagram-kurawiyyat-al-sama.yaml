alt:
  ar: "الإجماع القديم على كروية السماء، ثم شرح الفرغاني أن الكواكب تطلع فترتفع وتتوسط السماء ثم تهبط، وأن أقربها إلى القطب يدور في دوائر متوازية أصغر."
  en: "The ancient consensus on the heavens' sphericity, then al-Farghani's account that the stars rise, climb, culminate and set, and that the stars nearer the pole circle it in smaller parallel paths."
  ur: "آسمان کی گولائی پر قدیم اتفاق، پھر الفرغانی کا بیان کہ ستارے طلوع ہوتے ہیں، چڑھتے ہیں، وسط آسمان پر پہنچتے ہیں اور غروب ہوتے ہیں، اور قطب کے قریب کے ستارے اس کے گرد چھوٹے متوازی دائروں میں گھومتے ہیں۔"
