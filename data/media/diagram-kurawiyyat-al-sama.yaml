kind: illustration
label:
  ar: "من إجماع القدماء إلى شرح الفرغاني"
  en: "From ancient consensus to al-Farghani's exposition"
  ur: "قدیم اتفاق سے الفرغانی کی تشریح تک"
  es: "Del consenso antiguo a la exposición de al-Farghani"
  fr: "Du consensus antique à l'exposé d'al-Farghani"
  tr: "Eski çağların ortak görüşünden El-Fergani'nin tefsirine"
  id: "Dari konsensus para ulama terdahulu hingga komentar Al-Farghani"
summary:
  ar: "سلسلة تعليمية تبين أن كروية السماء كانت مسلمة بين القدماء ثم صاغها الفرغاني في فصله الثاني بدليل طلوع الكواكب وهبوطها ودوائر القطبي؛ لا تدعي اكتشافه."
  en: "Teaching chain showing that the heavens' sphericity was a settled doctrine among the ancients, then set out by al-Farghani in his second chapter with the rising-and-setting and polar-circle proofs; it claims no discovery."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ آسمان کی گولائی قدیم عالمین میں متفق علیہ تھی پھر الفرغانی نے اپنے دوسرے باب میں طلوع و غروب اور قطبی دائروں کے استدلال کے ساتھ بیان کی؛ یہ کسی دریافت کا دعویٰ نہیں کرتا۔"
  es: "Cadena de enseñanzas que demuestra que la esfericidad de los cielos era una doctrina establecida entre los antiguos, y que al-Farghani expuso en su segundo capítulo con las pruebas de la salida y la puesta del sol y del círculo polar; no afirma ningún descubrimiento."
  fr: "Chaîne d'enseignement démontrant que la sphéricité des cieux était une doctrine établie parmi les anciens, puis exposée par al-Farghani dans son deuxième chapitre avec les preuves du lever et du coucher du soleil et du cercle polaire; elle ne revendique aucune découverte."
  tr: "Bu eğitim serisi, gökyüzünün küresel olduğu fikrinin eski çağlarda kabul gördüğünü ve daha sonra El-Fargani'nin bunu ikinci bölümünde gezegenlerin doğuşu ve batışı ile kutup dairelerinin kanıtlarıyla formüle ettiğini göstermektedir; ancak bu fikri kendisinin keşfettiğini iddia etmemektedir."
  id: "Seri edukatif ini menunjukkan bahwa bentuk bulat langit telah diterima di kalangan masyarakat kuno, dan kemudian Al-Farghani merumuskannya dalam bab keduanya dengan bukti terbit dan terbenamnya planet-planet serta lingkaran kutub; seri ini tidak mengklaim telah menemukan bentuk bulat langit."
