summary:
  ar: "تُظهر الصورة داخل الجامع العمري في دورا: بيت صلاة معقود السقف فيه المحراب وسجاد أخضر. صورة التقطها M sh شراونة محمد سنة 2020، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the inside of the Omari Mosque in Dura: a vaulted prayer hall with its mihrab and green carpets. Photograph by M sh شراونة محمد, 2020, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں دورا کی جامع عمری کا اندرونی حصہ دکھائی دیتا ہے: محرابی چھت والی نماز گاہ جس میں محراب اور سبز قالین ہیں۔ تصویر: M sh شراونة محمد، 2020ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre l'intérieur de la mosquée Omari à Dura : une salle de prière voûtée avec son mihrab et des tapis verts. Photographie : M sh شراونة محمد, 2020, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el interior de la mezquita Omari en Dura: una sala de oración abovedada con su mihrab y alfombras verdes. Fotografía de M sh شراونة محمد, 2020, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Dura'daki Ömeri Camii'nin içini gösteriyor: mihrabı ve yeşil halılarıyla tonozlu bir namaz salonu. Fotoğraf: M sh شراونة محمد, 2020; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan bagian dalam Masjid Al-Omari di Dura: ruang salat berlangit-langit lengkung dengan mihrab dan karpet hijau. Foto oleh M sh شراونة محمد, 2020, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
