alt:
  ar: "داخل مسجد صغير ذي سقوف معقودة بيضاء وجدران سفلية مكسوّة بالحجر، وفي الجدار البعيد محراب معقود، ومروحة سقف وثريا، وسجاد أخضر مزخرف بصفوف من أشكال المحاريب."
  en: "Interior of a small mosque with white vaulted ceilings, stone-faced lower walls, an arched niche in the far wall, a ceiling fan and a chandelier, and green carpets patterned in rows of prayer arches."
  ur: "ایک چھوٹی مسجد کا اندرونی منظر جس میں سفید محرابی چھتیں، پتھر سے ڈھکی نچلی دیواریں، پچھلی دیوار میں محرابی طاق، چھت کا پنکھا اور جھاڑ فانوس ہیں، اور سبز قالین جن پر محراب نما نقوش کی قطاریں ہیں۔"
  fr: "Intérieur d'une petite mosquée aux plafonds voûtés blancs, aux murs inférieurs revêtus de pierre, avec une niche en arc dans le mur du fond, un ventilateur de plafond et un lustre, et des tapis verts ornés de rangées d'arcs de prière."
  es: "Interior de una pequeña mezquita con techos abovedados blancos, muros inferiores revestidos de piedra, un nicho en arco en el muro del fondo, un ventilador de techo y una lámpara de araña, y alfombras verdes con filas de arcos de oración."
  tr: "Beyaz tonozlu tavanları, taş kaplı alt duvarları, karşı duvarında kemerli bir nişi, bir tavan vantilatörü ve bir avizesi olan küçük bir caminin iç mekânı; yeşil halılar mihrap biçimlerinden oluşan sıralarla desenlenmiş."
  id: "Bagian dalam masjid kecil dengan langit-langit lengkung putih, dinding bawah berlapis batu, relung berlengkung di dinding paling ujung, kipas langit-langit dan lampu gantung, serta karpet hijau yang bermotif deretan bentuk mihrab."
