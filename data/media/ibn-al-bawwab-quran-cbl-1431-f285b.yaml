"summary":
  "ar": "صورة للورقة ٢٨٥ ظهر من مصحف ابن البواب، مكتبة تشستر بيتي ١٤٣١، بغداد، ١٠٠٠-١٠٠١م، ٣٩١هـ، كما تذكر صفحة الملف. ولا تصف الصفحة الخط. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of folio 285b from the Ibn al-Bawwab Qur'an, Chester Beatty Library Is 1431, Baghdad, 1000-01, AH 391, as the file page states. The file page does not describe the script. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ابن البواب کے قرآن کے ورق ۲۸۵ پشت کی تصویر، چیسٹر بیٹی لائبریری 1431، بغداد، ۱۰۰۰ تا ۱۰۰۱ء، ۳۹۱ھ، جیسا فائل کا صفحہ بتاتا ہے۔ صفحہ خط کی وضاحت نہیں کرتا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía del folio 285b del Corán de Ibn al-Bawwab, Biblioteca Chester Beatty, Is 1431, Bagdad, 1000-01, AH 391, según indica la página del archivo. La página del archivo no describe la escritura. Se incluye como una obra escrita por un maestro calígrafo, como se indica en la página del archivo, para que el lector pueda apreciar la tradición que rodea su nombre en la página; no se trata de un retrato. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie du folio 285b du Coran d'Ibn al-Bawwab, conservé à la bibliothèque Chester Beatty (Is 1431, Bagdad, 1000-01, 391 AH), comme indiqué sur la fiche descriptive. Cette dernière ne décrit pas l'écriture. Le document est présenté comme une œuvre d'un maître calligraphe, afin d'illustrer la tradition calligraphique entourant son nom; il ne s'agit pas d'un portrait. Sur Wikimedia Commons, le fichier est dans le domaine public."
