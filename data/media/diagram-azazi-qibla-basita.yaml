label: { ar: "من البسيطة إلى البسيطة ذات بيت الإبرة عند العزازي", en: "From the plain basita to al-Azazi's needle-housed variant", ur: "سادہ بسیتہ سے العزازی کی سوئی گھر والی صورت تک", es: "Desde la basita simple hasta la variante con alojamiento para agujas de al-Azazi", fr: "De la simple basita à la variante à aiguille d'al-Azazi", tr: "Basitten basite, Al-Azzazi'deki iğne evi", id: "Dari yang sederhana hingga yang sangat sederhana, toko jahit di Al-Azzazi" }
summary:
  ar: "سلسلة تعليمية تبين البسيطة الأفقية المعروفة ثم إضافة العزازي بيت الإبرة ⁦(البوصلة)⁩ لقراءة محاريب البلدان؛ لا ترسم الآلة ولا تعيد بناء خطوطها."
  en: "Teaching chain from the known horizontal basita to al-Azazi's added needle housing (compass) for reading the qibla of towns; it draws no instrument and rebuilds no dial lines."
  ur: "تدریسی سلسلہ جو معلوم افقی بسیتہ سے العزازی کے سوئی گھر ⁦(قطب نما)⁩ کے اضافے تک جاتا ہے تاکہ شہروں کی قبلہ سمت پڑھی جا سکے؛ نہ آلہ بناتا ہے نہ گھڑی کی لکیریں دوبارہ بناتا ہے۔"
  es: "Cadena de enseñanza desde la conocida basita horizontal hasta la carcasa de aguja (brújula) añadida por al-Azazi para leer la qibla de las ciudades; no dibuja ningún instrumento ni reconstruye ninguna línea de reloj."
  fr: "Chaîne d'enseignement de la basita horizontale connue au boîtier d'aiguille (boussole) ajouté par al-Azazi pour lire la qibla des villes; elle ne dessine aucun instrument et ne reconstruit aucune ligne de cadran."
  tr: "Bilinen yatay basit mihrap modelini gösteren, ardından ülkelerin mihraplarını okumak için pusula (iğne evi) eklenmiş eğitici bir seri; makine çizgilerini çizmez veya yeniden oluşturmaz."
  id: "Seri edukatif yang menunjukkan bentuk horizontal sederhana yang sudah dikenal, kemudian menambahkan rumah jarum (kompas) untuk membaca mihrab berbagai negara; mesin ini tidak menggambar atau membangun kembali garis-garisnya."
