alt:
  ar: "مئذنة بيضاء عالية ذات شرفتين ورأس ذهبي ترتفع فوق جدار مسجد وبوابته بلون القشدة، وخلفها سفح صخري بني وسماء زرقاء صافية."
  en: "A tall white minaret with two balconies and a golden finial rises above the cream-coloured wall and gate of a mosque, with a rocky brown hillside behind and a clear blue sky."
  ur: "ایک بلند سفید مینار جس کی دو بالکونیاں اور سنہری سرا ہے، ایک مسجد کی کریمی رنگ کی دیوار اور دروازے کے اوپر بلند ہے، پیچھے چٹانی بھورا پہاڑی دامن اور صاف نیلا آسمان ہے۔"
  fr: "Un haut minaret blanc à deux balcons et à fleuron doré s'élève au-dessus du mur et de la porte couleur crème d'une mosquée, avec un flanc de colline rocheux et brun derrière et un ciel bleu dégagé."
  es: "Un alto minarete blanco con dos balcones y un remate dorado se eleva sobre el muro y la puerta color crema de una mezquita, con una ladera rocosa y parda detrás y un cielo azul despejado."
  tr: "İki şerefeli ve altın alemli yüksek beyaz bir minare, bir caminin krem renkli duvarının ve kapısının üzerinde yükseliyor; arkada kayalık kahverengi bir yamaç ve açık mavi bir gökyüzü var."
  id: "Menara putih tinggi dengan dua balkon dan puncak emas menjulang di atas dinding dan gerbang masjid berwarna krem, dengan lereng berbatu cokelat di belakangnya dan langit biru cerah."
