summary:
  ar: "تُظهر الصورة إحدى مآذن مسجد الخيف البيضاء في منى، وخلفها التلال الجرداء. صورة التقطها الشيخ هيثم الدخين في 31 مايو 2025، من ويكيميديا كومنز، بترخيص CC BY 4.0."
  en: "The photograph shows one of the white minarets of the Mosque of al-Khayf at Mina, with the bare hills behind. Photograph by الشيخ هيثم الدخين, 31 May 2025, on Wikimedia Commons, licensed CC BY 4.0."
  ur: "تصویر میں منیٰ میں مسجد خیف کے سفید میناروں میں سے ایک دکھائی دیتا ہے، اور پیچھے بنجر پہاڑیاں ہیں۔ تصویر: الشيخ هيثم الدخين، 31 مئی 2025ء، وکیمیڈیا کامنز سے، لائسنس CC BY 4.0۔"
  fr: "La photographie montre l'un des minarets blancs de la mosquée al-Khayf à Mina, avec les collines nues derrière. Photographie : الشيخ هيثم الدخين, 31 mai 2025, sur Wikimedia Commons, sous licence CC BY 4.0."
  es: "La fotografía muestra uno de los minaretes blancos de la mezquita de al-Khayf en Mina, con las colinas desnudas detrás. Fotografía de الشيخ هيثم الدخين, 31 de mayo de 2025, en Wikimedia Commons, con licencia CC BY 4.0."
  tr: "Fotoğraf, Mina'daki Hayf Mescidi'nin beyaz minarelerinden birini, arkasındaki çıplak tepelerle birlikte gösteriyor. Fotoğraf: الشيخ هيثم الدخين, 31 Mayıs 2025; Wikimedia Commons, CC BY 4.0 lisansı."
  id: "Foto ini menampilkan salah satu menara putih Masjid Al-Khayf di Mina, dengan perbukitan gundul di belakangnya. Foto oleh الشيخ هيثم الدخين, 31 Mei 2025, di Wikimedia Commons, berlisensi CC BY 4.0."
