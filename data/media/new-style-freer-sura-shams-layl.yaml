  "ar": "ورقة مصحف منفصلة بالكوفي المشرقي الأسود ⁦(الأسلوب الجديد)⁩، إيران، القرن الحادي عشر"
  "en": "Detached Qur'an folio in black eastern Kufic (new style), Iran, 11th century"
  "ur": "الگ شدہ مصحفی ورق، سیاہ مشرقی کوفی ⁦(نیا طرز)⁩، ایران، گیارھویں صدی"
"summary":
  "ar": "صورة لورقة منفصلة من مصحف مفرّق، معرض فرير F1929.70، تصفها صفحة الملف بأنها بخط «كوفي مشرقي ⁦(الأسلوب الجديد)⁩» أسود، إيران، العصر العباسي، القرن الحادي عشر، وفي وجهها خاتمة سورة الشمس وفي ظهرها أول سورة الليل. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a detached folio from a dispersed Qur'an, Freer Gallery of Art F1929.70, which the file page describes as Arabic in black 'eastern kufic (New Style)' script, Iran, Abbasid period, 11th century, with the end of sura al-Shams on the recto and the start of sura al-Layl on the verso. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک بکھرے ہوئے مصحف کے الگ شدہ ورق، فریر گیلری F1929.70، کی تصویر جسے فائل کا صفحہ سیاہ «مشرقی کوفی ⁦(نیا طرز)⁩» خط میں، ایران، عباسی دور، گیارھویں صدی، بتاتا ہے؛ رخ پر سورۂ شمس کا اختتام اور پشت پر سورۂ لیل کا آغاز ہے۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
