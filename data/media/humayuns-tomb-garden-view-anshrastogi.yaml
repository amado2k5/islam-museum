summary:
  ar: "تُظهر الصورة ضريح همايون في دلهي عبر عشب حديقته، وقبته البيضاء فوق أروقة من الحجر الرملي الأحمر. صورة التقطها Anshrastogi1 في 23 فبراير 2024، من ويكيميديا كومنز، بترخيص CC0."
  en: "The photograph shows Humayun's Tomb in Delhi across the lawn of its garden, the white dome above red sandstone arcades. Photograph by Anshrastogi1, 23 February 2024, on Wikimedia Commons, licensed CC0."
  ur: "تصویر میں دہلی میں ہمایوں کا مقبرہ اس کے باغ کے سبزہ زار کے پار دکھائی دیتا ہے، سفید گنبد سرخ ریتیلے پتھر کی محرابی قطاروں کے اوپر ہے۔ تصویر: Anshrastogi1، 23 فروری 2024ء، وکیمیڈیا کامنز سے، لائسنس CC0۔"
  fr: "La photographie montre le tombeau d'Humayun à Delhi au-delà de la pelouse de son jardin, la coupole blanche au-dessus d'arcades de grès rouge. Photographie : Anshrastogi1, 23 février 2024, sur Wikimedia Commons, sous licence CC0."
  es: "La fotografía muestra la tumba de Humayún en Delhi al otro lado del césped de su jardín, con la cúpula blanca sobre arcadas de arenisca roja. Fotografía de Anshrastogi1, 23 de febrero de 2024, en Wikimedia Commons, con licencia CC0."
  tr: "Fotoğraf, Delhi'deki Hümayun Türbesi'ni bahçesinin çimenliği boyunca gösteriyor; beyaz kubbe kırmızı kumtaşından revakların üzerinde yükseliyor. Fotoğraf: Anshrastogi1, 23 Şubat 2024; Wikimedia Commons, CC0 lisansı."
  id: "Foto ini menampilkan Makam Humayun di Delhi dari seberang hamparan rumput tamannya, dengan kubah putih di atas arkade batu pasir merah. Foto oleh Anshrastogi1, 23 Februari 2024, di Wikimedia Commons, berlisensi CC0."
