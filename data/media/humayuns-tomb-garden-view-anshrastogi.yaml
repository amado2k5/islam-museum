depicts: [building/humayun-tomb]
alt:
  ar: "ضريح من الحجر الرملي الأحمر تعلوه قبة من الرخام الأبيض، قائم على مصطبة واسعة ذات عقود، يُرى عبر عشب أخضر تتخلله قناة ماء حجرية، مع نخيل وأشجار تحت سماء زرقاء."
  en: "A red sandstone mausoleum with a white marble dome stands on a wide arcaded platform, seen across a green lawn with a stone water channel, palms and trees under a blue sky."
  ur: "سرخ ریتیلے پتھر کا ایک مقبرہ جس پر سفید سنگ مرمر کا گنبد ہے، محرابوں والے وسیع چبوترے پر کھڑا ہے، اسے سبز سبزہ زار کے پار دیکھا جا رہا ہے جس میں پتھر کی نہر، کھجور کے درخت اور دوسرے درخت ہیں، نیلے آسمان تلے۔"
  fr: "Un mausolée de grès rouge à coupole de marbre blanc se dresse sur une large terrasse à arcades, vu au-delà d'une pelouse verte avec un canal de pierre, des palmiers et des arbres, sous un ciel bleu."
  es: "Un mausoleo de arenisca roja con cúpula de mármol blanco se alza sobre una amplia plataforma con arcadas, visto al otro lado de un césped verde con un canal de piedra, palmeras y árboles, bajo un cielo azul."
  tr: "Kırmızı kumtaşından, beyaz mermer kubbeli bir türbe, kemerli geniş bir platformun üzerinde duruyor; yeşil bir çimenliğin, taş bir su kanalının, palmiyelerin ve ağaçların ötesinden, mavi bir gökyüzünün altında görülüyor."
  id: "Mausoleum batu pasir merah dengan kubah marmer putih berdiri di atas peron lebar berarkade, terlihat dari seberang hamparan rumput hijau dengan saluran air batu, pohon palem, dan pepohonan, di bawah langit biru."
