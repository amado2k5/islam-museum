"label":
  "ar": "خط بأسلوب الديواني الجلي لملا علي، إسطنبول، ١٨٢٦م"
  "en": "Calligraphy in Gali Diwani style by Mulla Ali, Istanbul, 1826"
  "ur": "جلی دیوانی طرز کی خطاطی، ملا علی، استنبول، ۱۸۲۶ء"
"summary":
  "ar": "نسخة مصوّرة، تنسبها صفحة الملف إلى كتاب غابرييل ماندل عن الأبجدية العربية، لخط عربي بأسلوب الديواني الجلي لملا علي، إسطنبول، ١٨٢٦م. تخدم مثالًا على الديواني، الخط المتشابك المتراص لديوان السلطنة العثمانية، تصعد فيه الكلمات قليلًا نحو آخر السطر. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A reproduction, credited on the file page to Gabriele Mandel's book on the Arabic alphabet, of Arabic calligraphy in the Gali Diwani style by Mulla Ali, Istanbul, 1826. It serves as an example of Divani, the dense, interlaced chancery hand of the Ottoman court, in which words rise slightly toward the line's end. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "گابریل مینڈل کی عربی ابجد کی کتاب سے، جیسا فائل کا صفحہ بتاتا ہے، ملا علی کی جلی دیوانی طرز کی عربی خطاطی کی نقل، استنبول، ۱۸۲۶ء۔ یہ دیوانی کی مثال ہے، عثمانی دیوان کا گھنا اور باہم گتھا ہوا خط جس میں الفاظ سطر کے آخر کی طرف ذرا اوپر اٹھتے ہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
