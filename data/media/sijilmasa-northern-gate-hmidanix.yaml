summary:
  ar: "تُظهر الصورة بقايا الباب الشمالي في موقع سجلماسة الأثري، وخلفها النخيل. صورة التقطها Hmidanix في 21 يناير 2021، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the remains of the northern gate at the archaeological site of Sijilmasa, with palms behind. Photograph by Hmidanix, 21 January 2021, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں سجلماسہ کے اثری مقام پر شمالی دروازے کے باقیات دکھائی دیتے ہیں، اور پیچھے کھجور کے درخت ہیں۔ تصویر: Hmidanix، 21 جنوری 2021ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre les vestiges de la porte nord sur le site archéologique de Sijilmasa, avec des palmiers derrière. Photographie : Hmidanix, 21 janvier 2021, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra los restos de la puerta norte en el yacimiento arqueológico de Sijilmasa, con palmeras detrás. Fotografía de Hmidanix, 21 de enero de 2021, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Sicilmasa arkeolojik alanındaki kuzey kapının kalıntılarını, arkasındaki palmiyelerle birlikte gösteriyor. Fotoğraf: Hmidanix, 21 Ocak 2021; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan sisa gerbang utara di situs arkeologi Sijilmasa, dengan pohon palem di belakangnya. Foto oleh Hmidanix, 21 Januari 2021, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
