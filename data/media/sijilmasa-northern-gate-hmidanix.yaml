alt:
  ar: "بوابة ترابية ذات عقود عدة وكتلة أعلى فيها فتحات صغيرة، قائمة بجانب طريق على أرض جرداء، وإلى اليمين نخيل وسماء زرقاء بلا سحب."
  en: "An earthen gateway with several arches and a taller block pierced by small openings stands beside a road on bare ground, with palm trees to the right and a cloudless blue sky."
  ur: "کئی محرابوں والا مٹی کا دروازہ اور چھوٹے سوراخوں والا ایک بلند تر ٹکڑا ایک سڑک کے پاس بنجر زمین پر کھڑے ہیں، دائیں جانب کھجور کے درخت اور بے ابر نیلا آسمان ہے۔"
  fr: "Une porte de terre à plusieurs arcs et un bloc plus haut percé de petites ouvertures se dresse près d'une route sur un sol nu, avec des palmiers à droite et un ciel bleu sans nuages."
  es: "Una puerta de tierra con varios arcos y un bloque más alto perforado por pequeñas aberturas se alza junto a una carretera sobre suelo desnudo, con palmeras a la derecha y un cielo azul sin nubes."
  tr: "Birkaç kemerli toprak bir kapı ve küçük açıklıklarla delinmiş daha yüksek bir blok, çıplak zeminde bir yolun yanında duruyor; sağda palmiye ağaçları ve bulutsuz mavi bir gökyüzü var."
  id: "Gerbang tanah dengan beberapa lengkung dan balok yang lebih tinggi yang dilubangi bukaan-bukaan kecil berdiri di samping jalan di tanah gundul, dengan pohon palem di sebelah kanan dan langit biru tanpa awan."
