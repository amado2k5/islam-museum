"summary":
  "ar": "صورة لإبريق في متحف المتروبوليتان للفنون يقول عنوان الملف إنه منقوش على عنقه بكلمة «العز» بالكوفي المورَّق؛ وتؤرخه صفحة الملف بالنصف الأول من القرن الثالث عشر وتصنّفه خزفًا. أُدرجت لأن الكوفي المورَّق الذي تنبت من أطراف حروفه الأوراق والسيقان يظهر أفضل ما يظهر على التحف والعمائر لا على صفحات المصاحف؛ فالقطعة تُري الأسلوب ولا تحمل نص مصحف. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of an ewer in the Metropolitan Museum of Art whose file title says it is inscribed with the word 'al-'izz', 'Glory', in floriated Kufic on its neck; the file page dates it to the first half of the 13th century and classes it as ceramics. It is included because floriated Kufic, whose letter-ends sprout leaves and scrolls, is best seen on objects and monuments rather than in mushaf pages; the object shows the style, not a Qur'an text. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "میٹروپولیٹن میوزیم آف آرٹ کے ایک جگ کی تصویر جس کے فائل کے عنوان کے مطابق اس کی گردن پر مورّق کوفی میں لفظ «العز»، یعنی شان، کندہ ہے؛ فائل کا صفحہ اسے تیرھویں صدی کے پہلے نصف کا بتاتا ہے اور چینی مٹی کی اشیا میں رکھتا ہے۔ اسے اس لیے شامل کیا گیا کہ مورّق کوفی، جس کے حروف کے سروں سے پتے اور بیلیں نکلتی ہیں، مصحف کے صفحات کی بجائے برتنوں اور عمارتوں پر زیادہ نمایاں ہے؛ یہ شے اسلوب دکھاتی ہے، قرآنی متن نہیں۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
  "es": "Fotografía de una jarra del Museo Metropolitano de Arte cuyo título indica que lleva inscrita la palabra «al-'izz», «Gloria», en escritura cúfica florida en su cuello; la página del archivo la data de la primera mitad del siglo XIII y la clasifica como cerámica. Se incluye porque la escritura cúfica florida, cuyos remates de letras presentan hojas y volutas, se aprecia mejor en objetos y monumentos que en las páginas del Corán; el objeto muestra este estilo, no un texto coránico. En Wikimedia Commons, el archivo está dedicado al dominio público bajo la licencia CC0."
  "fr": "Photographie d'une aiguière conservée au Metropolitan Museum of Art. La fiche descriptive indique que le mot « al-'izz », signifiant « Gloire », est inscrit sur le col en écriture coufique ornementée. La fiche la date de la première moitié du XIIIe siècle et la classe comme céramique. Elle est incluse car l'écriture coufique ornementée, dont les extrémités des lettres sont ornées de feuilles et de volutes, est plus visible sur les objets et les monuments que dans les pages du mushaf; l'objet présenté ici illustre ce style, et non un texte coranique. Sur Wikimedia Commons, le fichier est placé dans le domaine public sous licence CC0."
