summary:
  ar: "سلسلة تعليمية تبين مقارنة ابن الهيثم: مرآة تعكس شعاعاً واحداً من الشمس في اتجاه واحد، مقابل سطح قمري تبث كل نقطة فيه أشعة الضوء في كل الاتجاهات؛ لا ترسم الكواكب ولا تستعيد رسمة المخطوط."
  en: "Teaching chain showing Ibn al-Haytham's contrast: a mirror reflecting a single solar ray in one direction, versus a lunar surface where every point broadcasts light rays in all directions; it draws no planets and reconstructs no manuscript figure."
  ur: "تدریسی سلسلہ جو ابن الہیثم کا موازنہ دکھاتا ہے: آئینہ جو سورج کی ایک شعاع کو ایک ہی سمت میں منعکس کرتا ہے، بمقابلہ چاند کی وہ سطح جس کے ہر نقطے سے روشنی کی شعاعیں تمام سمتوں میں نکلتی ہیں؛ نہ سیارے بناتا ہے نہ مخطوطہ کی تصویر دوبارہ بناتا ہے۔"
  es: "Cadena de enseñanza que muestra el contraste de Ibn al-Haytham: un espejo que refleja un solo rayo solar en una dirección, frente a una superficie lunar donde cada punto emite rayos de luz en todas direcciones; no dibuja planetas ni reconstruye ninguna figura del manuscrito."
  fr: "Chaîne d'enseignement illustrant le contraste d'Ibn al-Haytham: un miroir reflétant un seul rayon solaire dans une direction, contre une surface lunaire où chaque point diffuse des rayons lumineux dans toutes les directions; elle ne dessine aucune planète et ne reconstitue aucune figure de manuscrit."
