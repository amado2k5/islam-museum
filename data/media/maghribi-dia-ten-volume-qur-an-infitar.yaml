"summary":
  "ar": "صورة لورقة من مصحف في عشرة مجلدات، معهد ديترويت للفنون 2007.120.1A، فيها الآيات ١ إلى ٥ من سورة الانفطار، تصفها صفحة الملف بأنها بالخط المغربي، حبر وألوان وذهب وربما فضة على ورق ملوّن، من بلنسية نحو سنة ١٢٢٠م، وقد وُقفت سنة ١٢٤٨م على مكتبة جامع علي بن يوسف بن تاشفين في مراكش. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of a folio from a ten-volume Qur'an, Detroit Institute of Arts 2007.120.1A, with sura 82, verses 1 to 5, which the file page describes as in Maghrebi script, ink, colours, gold and possibly silver on tinted paper, from Valencia about 1220, and endowed in 1248 to the library of the mosque of Ali b. Yusuf b. Tashufin in Marrakech. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "دس جلدوں کے ایک قرآن کے ورق، ڈیٹرائٹ انسٹی ٹیوٹ آف آرٹس 2007.120.1A، کی تصویر جس میں سورۂ انفطار کی آیات ۱ تا ۵ ہیں؛ فائل کا صفحہ اسے مغربی خط میں، سیاہی، رنگ، سونا اور شاید چاندی رنگین کاغذ پر، بلنسیہ سے تقریباً ۱۲۲۰ء، بیان کرتا ہے اور بتاتا ہے کہ ۱۲۴۸ء میں مراکش کی علی بن یوسف بن تاشفین مسجد کے کتب خانے پر وقف کیا گیا۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
  "es": "Fotografía de un folio de un Corán de diez volúmenes, Detroit Institute of Arts 2007.120.1A, con la sura 82, versículos 1 a 5, que la página del archivo describe como escrito en escritura magrebí, tinta, colores, oro y posiblemente plata sobre papel tintado, procedente de Valencia alrededor de 1220, y donado en 1248 a la biblioteca de la mezquita de Ali b. Yusuf b. Tashufin en Marrakech. Sirve como ejemplo de la escritura magrebí a mano alzada del norte de África y al-Ándalus, que carece de proporciones fijas y se encuentra principalmente en manuscritos. En Wikimedia Commons, el archivo está dedicado al dominio público bajo la licencia CC0."
  "fr": "Photographie d'un folio d'un Coran en dix volumes (Detroit Institute of Arts 2007.120.1A), contenant la sourate 82, versets 1 à 5. La fiche descriptive indique qu'il s'agit d'un folio en écriture maghrébine, à l'encre, aux couleurs, rehaussé d'or et peut-être d'argent sur papier teinté. Ce folio, provenant de Valence vers 1220, fut légué en 1248 à la bibliothèque de la mosquée d'Ali ben Yusuf ben Tashufin à Marrakech. Il illustre l'écriture maghrébine manuscrite d'Afrique du Nord et d'al-Andalus, caractérisée par des proportions variables et que l'on retrouve principalement dans les manuscrits. Sur Wikimedia Commons, le fichier est placé dans le domaine public sous licence CC0."
  "tr": "Detroit Sanat Enstitüsü 2007.120.1A numaralı on ciltlik Kur'an'dan bir sayfanın fotoğrafı; Al-Infitar Suresi'nin 1-5. ayetlerini içermektedir. Dosya açıklamasında, Mağribi alfabesiyle, mürekkep, renkler, altın ve muhtemelen gümüş kullanılarak renkli kağıt üzerine yazıldığı ve yaklaşık 1220 yılında Valensiya'dan geldiği belirtilmektedir. 1248 yılında Marakeş'teki Ali ibn Yusuf ibn Tashfin Camii kütüphanesine bağışlanmıştır. Kuzey Afrika ve Endülüs'ün serbest Mağribi alfabesinin bir örneğidir; bu alfabe sabit oranlardan yoksundur ve çoğunlukla el yazmalarında bulunur. Görsel Wikimedia Commons'ta yer almaktadır ve CC0 lisansı altında kamu malıdır."
  "id": "Foto halaman dari Al-Qur'an sepuluh jilid, Detroit Institute of Art 2007.120.1A, berisi ayat 1-5 Surah Al-Infitar. Deskripsi file menyatakan bahwa halaman tersebut ditulis dalam aksara Maghrib, dengan tinta, warna, emas, dan mungkin perak di atas kertas berwarna, berasal dari Valencia sekitar tahun 1220 M. Al-Qur'an ini dihibahkan pada tahun 1248 M ke perpustakaan Masjid Ali ibn Yusuf ibn Tashfin di Marrakesh. Al-Qur'an ini berfungsi sebagai contoh aksara Maghrib bebas di Afrika Utara dan Andalusia, yang tidak memiliki proporsi tetap dan sebagian besar ditemukan dalam manuskrip. Gambar ini ada di Wikimedia Commons dan berada dalam domain publik di bawah lisensi CC0."
