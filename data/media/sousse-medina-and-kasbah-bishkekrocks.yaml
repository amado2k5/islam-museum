summary:
  ar: "تُظهر الصورة سطوح المدينة العتيقة في سوسة وفي الأفق القصبة وبرجها، ملتقطة من برج الرباط. صورة التقطها BishkekRocks في أكتوبر 2004، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the roofs of the medina of Sousse with the Kasbah and its tower on the skyline, taken from the tower of the Ribat. Photograph by BishkekRocks, October 2004, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں سوسہ کے قدیم مدینے کی چھتیں دکھائی دیتی ہیں اور افق پر قصبہ اور اس کا برج ہے، جو رباط کے برج سے لی گئی ہے۔ تصویر: BishkekRocks، اکتوبر 2004ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre les toits de la médina de Sousse avec la casbah et sa tour à l'horizon, prise depuis la tour du ribat. Photographie : BishkekRocks, octobre 2004, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra los tejados de la medina de Susa con la Kasbah y su torre en el horizonte, tomada desde la torre del Ribat. Fotografía de BishkekRocks, octubre de 2004, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Sus'taki eski medinenin çatılarını, ufukta Kasbah ve kulesiyle birlikte, Ribat'ın kulesinden çekilmiş olarak gösteriyor. Fotoğraf: BishkekRocks, Ekim 2004; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan atap-atap medina Sousse dengan Kasbah dan menaranya di cakrawala, diambil dari menara Ribat. Foto oleh BishkekRocks, Oktober 2004, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
