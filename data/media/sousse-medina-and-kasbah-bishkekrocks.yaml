depicts: [place/sousse]
alt:
  ar: "سطوح بيضاء منبسطة وقباب صغيرة لبلدة قديمة تملأ المقدمة؛ وعلى المرتفع خلفها حصن بلون الرمل ذو أسوار بشرفات وبرج مربع عالٍ، تحت سماء باهتة."
  en: "White flat roofs and small domes of an old town fill the foreground; on the rise behind them stands a sand-coloured fortress with crenellated walls and a tall square tower, under a pale sky."
  ur: "ایک پرانے شہر کی سفید ہموار چھتیں اور چھوٹے گنبد سامنے کے حصے کو بھرے ہوئے ہیں؛ ان کے پیچھے بلندی پر ریت کے رنگ کا قلعہ ہے جس کی کنگروں والی دیواریں اور ایک بلند چوکور برج ہے، ہلکے آسمان تلے۔"
  fr: "Des toits blancs plats et de petites coupoles d'une vieille ville remplissent le premier plan ; sur la hauteur derrière eux se dresse une forteresse couleur sable aux murs crénelés et à haute tour carrée, sous un ciel pâle."
  es: "Techos blancos planos y pequeñas cúpulas de una ciudad antigua llenan el primer plano; sobre la elevación detrás se alza una fortaleza color arena con muros almenados y una alta torre cuadrada, bajo un cielo pálido."
  tr: "Eski bir şehrin beyaz düz çatıları ve küçük kubbeleri ön planı dolduruyor; arkalarındaki yükseltide mazgallı duvarları ve yüksek kare bir kulesi olan kum rengi bir hisar duruyor, soluk bir gökyüzünün altında."
  id: "Atap datar putih dan kubah-kubah kecil sebuah kota tua memenuhi latar depan; di atas tanjakan di belakangnya berdiri benteng berwarna pasir dengan tembok bergerigi dan menara persegi yang tinggi, di bawah langit pucat."
