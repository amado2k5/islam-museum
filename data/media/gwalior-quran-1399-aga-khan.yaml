"summary":
  "ar": "صورة لصفحتين، الورقتان ١٨٩ وجه و١٩٠ ظهر، من مصحف غواليور الذي نسخه محمود شعبان في غواليور سنة ١٣٩٩م، متحف الآغا خان AKM281، كما تذكر صفحة الملف. ولا تسمّي الصفحة الخط. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a double page, ff. 189r-190v, of the Gwalior Qur'an copied by Mahmud Sha'ban at Gwalior in 1399, Aga Khan Museum AKM281, as the file page states. The file page does not name the script. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "گوالیار قرآن کے دو صفحوں، ورق ۱۸۹ رخ و ۱۹۰ پشت، کی تصویر جسے محمود شعبان نے ۱۳۹۹ء میں گوالیار میں نقل کیا، آغا خان میوزیم AKM281، جیسا فائل کا صفحہ بتاتا ہے۔ صفحہ خط کا نام نہیں لیتا۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
