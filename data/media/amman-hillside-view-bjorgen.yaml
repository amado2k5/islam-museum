summary:
  ar: "تُظهر الصورة منظرًا لعمّان، وبيوتها الحجرية الفاتحة تغطي التلال، وفي الأفق سارية عَلَم عالية جدًا. صورة التقطها David Bjorgen في 27 ديسمبر 2005، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows a view over Amman, its pale stone houses covering the hills, with a very tall flagpole on the skyline. Photograph by David Bjorgen, 27 December 2005, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں عمان کا ایک منظر دکھائی دیتا ہے، اس کے ہلکے رنگ کے پتھر کے مکانات پہاڑیوں کو ڈھانپے ہوئے ہیں، اور افق پر ایک بہت بلند جھنڈے کا ڈنڈا ہے۔ تصویر: David Bjorgen، 27 دسمبر 2005ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre une vue sur Amman, ses maisons de pierre claire couvrant les collines, avec un très haut mât de drapeau à l'horizon. Photographie : David Bjorgen, 27 décembre 2005, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra una vista de Amán, con sus casas de piedra clara que cubren las colinas, y un mástil de bandera muy alto en el horizonte. Fotografía de David Bjorgen, 27 de diciembre de 2005, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, açık renkli taş evlerin tepeleri kapladığı Amman'ın bir görünümünü, ufukta çok yüksek bir bayrak direğiyle birlikte gösteriyor. Fotoğraf: David Bjorgen, 27 Aralık 2005; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan pemandangan Amman, dengan rumah-rumah batu pucatnya yang menutupi perbukitan, dan tiang bendera yang sangat tinggi di cakrawala. Foto oleh David Bjorgen, 27 Desember 2005, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
