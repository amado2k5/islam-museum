depicts: [place/amman]
alt:
  ar: "تلال تغطيها بكثافة مبانٍ مكعبة فاتحة اللون، وفي المقدمة طريق رئيسي منحنٍ، وفي الأفق عَلَم يرفرف على سارية عالية جدًا، تحت سماء زرقاء فيها خطوط من السحب البيضاء."
  en: "Hills densely covered with pale cube-shaped buildings, a curving main road in the foreground, and a flag flying from a very tall pole on the horizon, under a blue sky with streaks of white cloud."
  ur: "پہاڑیاں جو ہلکے رنگ کی مکعب نما عمارتوں سے گھنی ڈھکی ہوئی ہیں، سامنے ایک خمدار مرکزی سڑک، اور افق پر ایک بہت بلند ڈنڈے پر لہراتا جھنڈا، سفید بادلوں کی لکیروں والے نیلے آسمان تلے۔"
  fr: "Des collines densément couvertes de bâtiments cubiques clairs, une route principale sinueuse au premier plan, et un drapeau qui flotte au sommet d'un très haut mât à l'horizon, sous un ciel bleu strié de nuages blancs."
  es: "Colinas densamente cubiertas de edificios cúbicos claros, una carretera principal curva en primer plano y una bandera que ondea en un mástil muy alto en el horizonte, bajo un cielo azul con vetas de nubes blancas."
  tr: "Açık renkli küp biçimli yapılarla yoğun biçimde kaplı tepeler, ön planda kıvrımlı bir ana yol ve ufukta çok yüksek bir direkte dalgalanan bir bayrak, beyaz bulut çizgileri olan mavi bir gökyüzünün altında."
  id: "Perbukitan yang tertutup padat oleh bangunan-bangunan berbentuk kubus berwarna pucat, jalan utama yang melengkung di latar depan, dan bendera yang berkibar di tiang yang sangat tinggi di cakrawala, di bawah langit biru dengan guratan awan putih."
