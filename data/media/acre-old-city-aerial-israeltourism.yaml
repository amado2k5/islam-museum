summary:
  ar: "تُظهر الصورة الجوية مدينة عكا القديمة المسوّرة على شبه جزيرتها، والبحر يحيط بها من ثلاث جهات والميناء خلفها. صورة التقطها israeltourism في 25 يوليو 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 2.0."
  en: "The aerial photograph shows the walled old city of Acre on its peninsula, with the sea on three sides and the harbour behind. Photograph by israeltourism, 25 July 2012, on Wikimedia Commons, licensed CC BY-SA 2.0."
  ur: "فضائی تصویر میں عکا کا فصیل بند پرانا شہر اپنی جزیرہ نما پر دکھائی دیتا ہے، سمندر تین جانب سے اسے گھیرے ہوئے ہے اور بندرگاہ اس کے پیچھے ہے۔ تصویر: israeltourism، 25 جولائی 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.0۔"
  fr: "La photographie aérienne montre la vieille ville fortifiée d'Acre sur sa péninsule, avec la mer sur trois côtés et le port derrière. Photographie : israeltourism, 25 juillet 2012, sur Wikimedia Commons, sous licence CC BY-SA 2.0."
  es: "La fotografía aérea muestra la ciudad vieja amurallada de Acre en su península, con el mar en tres lados y el puerto detrás. Fotografía de israeltourism, 25 de julio de 2012, en Wikimedia Commons, con licencia CC BY-SA 2.0."
  tr: "Hava fotoğrafı, yarımadası üzerindeki surlarla çevrili Akka eski şehrini, üç yanını saran deniz ve arkadaki limanla birlikte gösteriyor. Fotoğraf: israeltourism, 25 Temmuz 2012; Wikimedia Commons, CC BY-SA 2.0 lisansı."
  id: "Foto udara ini menampilkan kota tua Acre yang bertembok di atas semenanjungnya, dengan laut di tiga sisi dan pelabuhan di belakangnya. Foto oleh israeltourism, 25 Juli 2012, di Wikimedia Commons, berlisensi CC BY-SA 2.0."
