depicts: [place/akka]
alt:
  ar: "منظر جوي لبلدة قديمة متراصّة من بيوت حجرية فاتحة تحيط بها أسوار بحرية على شبه جزيرة صغيرة، وأمامها ماء ضحل أخضر فوق الصخور، وفي الجهة البعيدة ميناء فيه قوارب، والمدينة الحديثة تمتد إلى الداخل."
  en: "Aerial view of a compact old town of pale stone houses ringed by sea walls on a small peninsula, with shallow green water over rocks in front, a harbour with boats on the far side and the modern city stretching inland."
  ur: "ہلکے رنگ کے پتھر کے مکانات پر مشتمل ایک گنجان پرانے شہر کا فضائی منظر جسے ایک چھوٹی جزیرہ نما پر سمندری فصیلوں نے گھیرا ہوا ہے، سامنے چٹانوں پر اتھلا سبز پانی ہے، دوسری جانب کشتیوں والی بندرگاہ ہے اور جدید شہر اندرون کی طرف پھیلا ہے۔"
  fr: "Vue aérienne d'une vieille ville compacte de maisons de pierre claire ceinte de remparts maritimes sur une petite péninsule, avec une eau verte peu profonde sur des rochers devant, un port avec des bateaux de l'autre côté et la ville moderne qui s'étend vers l'intérieur des terres."
  es: "Vista aérea de una ciudad vieja compacta de casas de piedra clara rodeada de murallas marítimas en una pequeña península, con agua verde poco profunda sobre rocas delante, un puerto con barcos en el lado opuesto y la ciudad moderna que se extiende tierra adentro."
  tr: "Küçük bir yarımada üzerinde deniz surlarıyla çevrili, açık renkli taş evlerden oluşan sıkışık bir eski şehrin havadan görünümü; önünde kayaların üzerinde sığ yeşil su, uzak tarafta teknelerin bulunduğu bir liman ve iç kısımlara doğru uzanan modern şehir var."
  id: "Pemandangan udara kota tua padat dari rumah-rumah batu pucat yang dikelilingi tembok laut di semenanjung kecil, dengan air hijau dangkal di atas bebatuan di depannya, pelabuhan dengan perahu di sisi seberang, dan kota modern yang membentang ke arah daratan."
