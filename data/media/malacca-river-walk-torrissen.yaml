summary:
  ar: "تُظهر الصورة النهر يجري بين مباني البلدة القديمة في ملقا. صورة التقطها Bjørn Christian Tørrissen في 5 يناير 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
