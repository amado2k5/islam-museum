alt:
  ar: "نهر هادئ يشبه القناة تنعكس فيه سماء زرقاء داكنة وصف من البيوت التجارية البيضاء ذات المصاريع والشرفات على ضفته اليمنى؛ وعلى الضفة اليسرى أشجار ومبنى أحمر."
  en: "A calm river like a canal reflects a deep blue sky and a row of white shophouses with shutters and balconies along its right bank; trees and a red building stand on the left bank."
  ur: "نہر جیسا ایک پرسکون دریا گہرے نیلے آسمان کو اور اپنے دائیں کنارے کے ساتھ کواڑوں اور بالکونیوں والی سفید دکان نما مکانات کی قطار کو منعکس کر رہا ہے؛ بائیں کنارے پر درخت اور ایک سرخ عمارت ہے۔"
  fr: "Une rivière calme semblable à un canal reflète un ciel bleu profond et une rangée de maisons-boutiques blanches à volets et balcons le long de sa rive droite ; des arbres et un bâtiment rouge se trouvent sur la rive gauche."
  es: "Un río tranquilo, parecido a un canal, refleja un cielo azul intenso y una hilera de casas-tienda blancas con postigos y balcones a lo largo de su orilla derecha; árboles y un edificio rojo se alzan en la orilla izquierda."
  tr: "Kanala benzeyen sakin bir nehir, koyu mavi bir gökyüzünü ve sağ kıyısı boyunca panjurlu ve balkonlu beyaz dükkânlı evlerin sırasını yansıtıyor; sol kıyıda ağaçlar ve kırmızı bir bina duruyor."
  id: "Sungai tenang menyerupai kanal memantulkan langit biru tua dan deretan rumah toko putih berdaun jendela dan balkon di sepanjang tepi kanannya; pepohonan dan bangunan merah berdiri di tepi kirinya."
