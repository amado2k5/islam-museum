alt:
  ar: "شارع ضيق في دمشق القديمة تحت سماء زرقاء، تمتد فوقه أسلاك كهرباء، وعلى جانبيه مبانٍ بشرفات حديدية ولافتات محلات وسيارة داكنة متوقفة. في آخر الشارع واجهة حجرية فاتحة اللون، في وسطها حنية عالية مزينة بالمقرنصات البيضاء فوق باب خشبي كبير، تعلوها قبة حمراء مدببة مكسوة بالمقرنصات. أمام الباب بعض المارة"
  en: "A narrow street in old Damascus under a blue sky, with power lines strung across it, balconied buildings, shop signs and a dark parked car on either side. At the end of the street stands a pale stone facade with a tall recess filled with white muqarnas carving above a large wooden door, and above it a pointed red dome covered in muqarnas. A few people stand by the door"
  ur: "پرانے دمشق کی ایک تنگ گلی، نیلے آسمان تلے، جس کے اوپر بجلی کے تار پھیلے ہیں اور دونوں طرف بالکونیوں والی عمارتیں، دکانوں کے بورڈ اور ایک گہرے رنگ کی کھڑی گاڑی ہے۔ گلی کے سرے پر ہلکے رنگ کے پتھر کا اگلا حصہ ہے جس میں ایک بڑے لکڑی کے دروازے کے اوپر سفید مقرنص کاری سے بھری اونچی محراب ہے، اور اس کے اوپر مقرنص سے ڈھکا ایک نوکیلا سرخ گنبد ہے۔ دروازے کے پاس چند لوگ کھڑے ہیں"
