label:
  ar: "صورة: مدخل بيمارستان نور الدين في دمشق"
  en: "Photograph: the entrance of the Nur al-Din bimaristan in Damascus"
  ur: "تصویر: دمشق میں نور الدین کے بیمارستان کا دروازہ"
summary:
  ar: "صورة التقطها مصوّر على فليكر سنة 2004 لواجهة البيمارستان الذي بناه نور الدين محمود بن زنكي في دمشق سنة 1154م، وتعدّه موسوعة TDV أقدم بيمارستان سلجوقي باقٍ على هيئته الأولى. منشورة بترخيص CC BY 2.0 وتُضمَّن برابطها بلا نسخ. وهي لا تصوّر بيمارستان الوليد بن عبد الملك الذي لم يبق منه شيء، بل بيمارستاناً في المدينة نفسها بعده بأكثر من أربعة قرون."
  en: "A 2004 photograph by a Flickr photographer of the front of the bimaristan that Nur al-Din Mahmud ibn Zangi built in Damascus in 1154, which the TDV encyclopedia calls the oldest Seljuk-era hospital still standing in its original form. It is published under CC BY 2.0 and embedded by its URL, not copied. It does not show al-Walid ibn Abd al-Malik's hospital, of which nothing survives, but a hospital in the same city built more than four centuries later."
  ur: "فلکر کے ایک فوٹوگرافر کی 2004ء کی تصویر، جس میں اس بیمارستان کا اگلا حصہ ہے جو نور الدین محمود بن زنگی نے 1154ء میں دمشق میں بنوایا، اور جسے ٹی ڈی وی انسائیکلوپیڈیا اپنی اصل شکل میں باقی رہنے والا سب سے پرانا سلجوقی دور کا شفاخانہ کہتا ہے۔ یہ CC BY 2.0 کے تحت شائع ہے اور نقل کیے بغیر اپنے ربط سے شامل ہے۔ اس میں ولید بن عبد الملک کا شفاخانہ نہیں، جس کا کچھ باقی نہیں رہا، بلکہ اسی شہر کا ایک شفاخانہ ہے جو چار صدیوں سے زیادہ بعد بنا۔"
