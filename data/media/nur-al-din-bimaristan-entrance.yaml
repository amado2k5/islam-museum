summary:
  ar: "صورة التقطها مصوّر على فليكر سنة 2004 لواجهة البيمارستان الذي بناه نور الدين محمود بن زنكي في دمشق سنة 1154م، وتعدّه موسوعة TDV أقدم بيمارستان سلجوقي باقٍ على هيئته الأولى. منشورة بترخيص CC BY 2.0 وتُضمَّن برابطها بلا نسخ. وهي لا تصوّر بيمارستان الوليد بن عبد الملك الذي لم يبق منه شيء، بل بيمارستاناً في المدينة نفسها بعده بأكثر من أربعة قرون."
  en: "A 2004 photograph by a Flickr photographer of the front of the bimaristan that Nur al-Din Mahmud ibn Zangi built in Damascus in 1154, which the TDV encyclopedia calls the oldest Seljuk-era hospital still standing in its original form. It is published under CC BY 2.0 and embedded by its URL, not copied. It does not show al-Walid ibn Abd al-Malik's hospital, of which nothing survives, but a hospital in the same city built more than four centuries later."
  ur: "فلکر کے ایک فوٹوگرافر کی 2004ء کی تصویر، جس میں اس بیمارستان کا اگلا حصہ ہے جو نور الدین محمود بن زنگی نے 1154ء میں دمشق میں بنوایا، اور جسے ٹی ڈی وی انسائیکلوپیڈیا اپنی اصل شکل میں باقی رہنے والا سب سے پرانا سلجوقی دور کا شفاخانہ کہتا ہے۔ یہ CC BY 2.0 کے تحت شائع ہے اور نقل کیے بغیر اپنے ربط سے شامل ہے۔ اس میں ولید بن عبد الملک کا شفاخانہ نہیں، جس کا کچھ باقی نہیں رہا، بلکہ اسی شہر کا ایک شفاخانہ ہے جو چار صدیوں سے زیادہ بعد بنا۔"
  es: "Fotografía de 2004 tomada por un usuario de Flickr de la fachada del bimaristán que Nur al-Din Mahmud ibn Zangi construyó en Damasco en 1154, que la enciclopedia TDV considera el hospital más antiguo de la época selyúcida que aún se conserva en su forma original. Se publica bajo licencia CC BY 2.0 y se inserta mediante su URL, no se copia. No muestra el hospital de al-Walid ibn Abd al-Malik, del que no queda rastro, sino un hospital en la misma ciudad construido más de cuatro siglos después."
  fr: "Cette photographie de 2004, prise par un photographe Flickr, montre la façade du bimaristan construit à Damas en 1154 par Nur al-Din Mahmud ibn Zangi. L'encyclopédie TDV le qualifie de plus ancien hôpital de l'époque seldjoukide encore debout dans sa forme originale. Publiée sous licence CC BY 2.0, elle est intégrée via son URL et non copiée. Elle ne représente pas l'hôpital d'al-Walid ibn Abd al-Malik, dont il ne reste aucune trace, mais un hôpital de la même ville, construit plus de quatre siècles plus tard."
  tr: "2004 yılında Flickr'da bir fotoğrafçı tarafından çekilen bir fotoğraf, Nur ad-Din Mahmud ibn Zangi tarafından 1154 yılında Şam'da inşa edilen hastanenin cephesini göstermektedir. TDV Ansiklopedisi, bu hastaneyi orijinal haliyle günümüze ulaşan en eski Selçuklu hastanesi olarak kabul etmektedir. CC BY 2.0 lisansı altında yayınlanan fotoğraf, bağlantısıyla birlikte kopyalanmadan eklenmiştir. Fotoğraf, hiçbir kalıntısı kalmamış olan el-Walid ibn Abd al-Malik'in hastanesini değil, aynı şehirde dört yüzyıldan fazla bir süre sonra inşa edilmiş bir hastaneyi göstermektedir."
  id: "Sebuah foto yang diambil oleh seorang fotografer di Flickr pada tahun 2004 menunjukkan fasad rumah sakit yang dibangun oleh Nur ad-Din Mahmud ibn Zangi di Damaskus pada tahun 1154 M. Ensiklopedia TDV menganggapnya sebagai rumah sakit Seljuk tertua yang masih ada dalam bentuk aslinya. Diterbitkan di bawah lisensi CC BY 2.0, foto tersebut disertakan dengan tautannya tanpa disalin. Foto tersebut tidak menggambarkan rumah sakit al-Walid ibn Abd al-Malik, yang tidak ada lagi yang tersisa, melainkan sebuah rumah sakit di kota yang sama lebih dari empat abad kemudian."
