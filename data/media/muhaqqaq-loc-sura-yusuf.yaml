"summary":
  "ar": "صورة لورقة من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن الثالث عشر أو الرابع عشر، فيها الآيتان ٧٥ و٧٦ من السورة الثانية عشرة، يوسف. وتقول الصفحة إن النص بخط المحقق مضبوط بالكامل، حروفه بالذهب محاطة بحبر أسود، وتظهر علامة آية واحدة هي قرص ذهبي مزخرف بالأحمر والأزرق في الجزء الأعلى. تخدم مثالًا على المحقق، الخط الجليل الذي فُضّل في المصاحف الكبيرة، تتباعد حروفه وتمتد أفقياته. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress folio, dated by the file page to the 13th or 14th century, with verses 75 and 76 of the 12th chapter, Yusuf. The file page says the text is written in muhaqqaq script and is fully vocalised, the letters in gold outlined in black ink, with a single verse marker, a gold disk decorated in red and blue, in the upper part. It serves as an example of Muhaqqaq, the large, stately hand favoured for big mushafs, in which letters are spaced and strokes are long and level. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک ورق کی تصویر جسے فائل کا صفحہ تیرھویں یا چودھویں صدی سے منسوب کرتا ہے، جس میں بارھویں سورت، یوسف، کی آیات ۷۵ اور ۷۶ ہیں۔ صفحہ کہتا ہے کہ متن محقق خط میں ہے اور مکمل اعراب کے ساتھ، حروف سنہری ہیں جن کے گرد سیاہ سیاہی کی حد ہے، اور اوپر کے حصے میں ایک ہی آیت نشان، سرخ اور نیلے سے آراستہ سنہری قرص، نظر آتا ہے۔ یہ محقق کی مثال ہے، وہ باوقار بڑا خط جو بڑے مصاحف میں پسند کیا گیا، جس کے حروف کھلے اور لکیریں لمبی اور ہموار ہوتی ہیں۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio de la Biblioteca del Congreso, fechado en el siglo XIII o XIV según la ficha, con los versículos 75 y 76 del capítulo 12, Yusuf. La ficha indica que el texto está escrito en escritura muhaqqaq y vocalizado completamente, con las letras doradas delineadas en tinta negra y un único marcador de versículo, un disco dorado decorado en rojo y azul, en la parte superior. Sirve como ejemplo de Muhaqqaq, la caligrafía grande y majestuosa preferida para los grandes mushafs, en la que las letras están espaciadas y los trazos son largos y rectos. Resulta útil para comprender la historia de la puntuación y la vocalización: permite al lector observar, en una página real, cómo se añadieron las marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un folio de la Bibliothèque du Congrès, daté du XIIIe ou XIVe siècle d'après sa fiche descriptive, contenant les versets 75 et 76 du chapitre 12, Yusuf. La fiche indique que le texte est écrit en écriture muhaqqaq et entièrement vocalisé, les lettres dorées soulignées d'encre noire, avec un unique signe de verset, un disque d'or orné de rouge et de bleu, dans la partie supérieure. Cet folio illustre l'écriture muhaqqaq, cette écriture imposante et majestueuse privilégiée pour les grands mushafs, caractérisée par des lettres espacées et des traits longs et réguliers. Il est utile pour comprendre l'évolution de la voyelle et de la pointillisme: il permet au lecteur de voir, sur une seule page, comment les signes des voyelles brèves ont été ajoutés au squelette consonantique, d'abord sous forme de points colorés, puis de signes distinctifs. Sur Wikimedia Commons, le fichier est dans le domaine public."
