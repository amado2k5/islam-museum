label: { ar: "من أقلام الثقال إلى قلم الرياسي", en: "From the heavy pens to the Riyasi pen", ur: "بھاری اقلام سے ریاسی قلم تک", es: "Desde los bolígrafos pesados hasta el bolígrafo Riyasi", fr: "Des stylos lourds au stylo Riyasi", tr: "Kalın kalemlerden cumhurbaşkanının kalemine", id: "Dari pena berat hingga pena presiden." }
summary:
  ar: "سلسلة تعليمية تبين ترتيب ابن النديم لأقلام الثقال في ديوان المأمون ثم إضافة الفضل بن سهل قلم الرياسي وأفراعه؛ لا ترسم الحروف ولا تستعيد شكله."
  en: "Teaching chain showing Ibn al-Nadim's ranking of the heavy chancery pens under al-Ma'mun, then al-Fadl ibn Sahl's added Riyasi pen and its branches; it draws no letters and reconstructs no script form."
  ur: "تدریسی سلسلہ جو ابن ندیم کی مامون کے دور کی بھاری دیوانی اقلام کی ترتیب اور پھر فضل بن سهل کے ریاسی قلم اور اس کی شاخوں کو دکھاتا ہے؛ نہ حروف بناتا ہے نہ خط کی شکل دوبارہ بناتا ہے۔"
  es: "Cadena de enseñanza que muestra la clasificación de Ibn al-Nadim de las plumas de cancillería pesadas bajo al-Ma'mun, luego al-Fadl ibn Sahl agregó la pluma Riyasi y sus ramas; no dibuja letras ni reconstruye ninguna forma de escritura."
  fr: "Chaîne d'enseignement montrant le classement par Ibn al-Nadim des plumes lourdes de chancellerie sous al-Ma'mun, puis la plume Riyasi ajoutée par al-Fadl ibn Sahl et ses branches; elle ne dessine aucune lettre et ne reconstitue aucune forme d'écriture."
  tr: "İbn el-Nadim'in el-Ma'mun'un sarayındaki ağır kalemlerin dizilişini, ardından el-Fadl ibn Sahl'ın el-Riyasi kaleminin ve dallarının eklenmesini gösteren eğitici bir seri; harfleri çizmez veya şeklini geri kazandırmaz."
  id: "Sebuah seri edukatif yang menunjukkan susunan pena-pena berat karya Ibn al-Nadim di istana al-Ma'mun, kemudian penambahan pena al-Riyasi karya al-Fadl ibn Sahl dan cabang-cabangnya; seri ini tidak menggambar huruf-hurufnya maupun mengembalikan bentuknya."
