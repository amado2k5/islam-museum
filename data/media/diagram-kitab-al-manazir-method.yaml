  ar: "ثلاثة عناوين متصلة: أقسام المناظر الثلاثة، جمع ابن الهيثم للملاحظة بالبرهان، ثم التنقيح الفارسي والترجمة اللاتينية؛ رسم عام لا إعادة بناء للتجربة."
  en: "Three linked captions: the Optics' three parts, Ibn al-Haytham's joining of observation to proof, then al-Farisi's revision and the Latin translation; a generic drawing, not a reconstruction of the experiment."
  ur: "تین جڑے ہوئے عنوان: المناظر کے تین حصے، ابن ہیثم کا مشاہدے کو برہان سے جوڑنا، پھر فارسی کی تلخیص اور لاطینی ترجمہ؛ عمومی خاکہ، تجربے کی تعمیرِ نو نہیں۔"
