summary:
  ar: "سلسلة تعليمية تبين أقسام «كتاب المناظر» الثلاثة — الإشراق على الاستقامة والانعكاس والانعطاف — وكيف جمع ابن الهيثم فيها الملاحظة المضبوطة بالبرهان الرياضي، ثم تلقيها الفارسي والترجمة اللاتينية؛ لا تمثل تجربة مرسومة ولا صفحة مخطوط."
  en: "A teaching chain showing the three parts of the Kitab al-Manazir — rectilinear propagation, reflection and refraction — and how Ibn al-Haytham joined controlled observation to mathematical proof, then al-Farisi's revision and the Latin translation; it depicts no staged experiment and no manuscript page."
  ur: "تدریسی سلسلہ: «کتاب المناظر» کے تین حصے — استقامت پر اشراق، انعکاس اور انکسار — اور ابن ہیثم کا قابو شدہ مشاہدے کو ریاضیاتی برہان سے جوڑنا، پھر فارسی کی تلخیص اور لاطینی ترجمہ؛ نہ کوئی پیش کردہ تجربہ نہ مخطوطہ کا صفحہ۔"
  es: "Una cadena didáctica que muestra las tres partes del Kitab al-Manazir —propagación rectilínea, reflexión y refracción— y cómo Ibn al-Haytham combinó la observación controlada con la demostración matemática, seguida de la revisión de al-Farisi y la traducción al latín; no representa ningún experimento escenificado ni ninguna página del manuscrito."
