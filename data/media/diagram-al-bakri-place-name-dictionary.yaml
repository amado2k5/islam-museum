summary:
  ar: "سلسلة تعليمية تبين كيف جمع البكري الأسماء الجغرافية من الحديث والأخبار والتواريخ والأشعار في معجم واحد مرتب على حروف المغاربة؛ لا تسمّي مخترعاً واحداً."
  en: "Teaching chain showing how al-Bakri gathered geographical names from hadith, reports, histories and poetry into one dictionary ordered on the Maghribi letters; it names no single inventor."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ البکری نے جغرافیائی نام حدیث، اخبار، تاریخوں اور شاعری سے جمع کر کے ایک لغت میں مغربی حروف پر ترتیب دیے؛ یہ کسی ایک ایجاد کنندہ کا نام نہیں لیتا۔"
  es: "Cadena de enseñanza que muestra cómo al-Bakri recopiló nombres geográficos de hadices, informes, historias y poesía en un diccionario ordenado según las letras magrebíes; no menciona a ningún inventor en particular."
  fr: "Chaîne d'enseignement montrant comment al-Bakri a rassemblé des noms géographiques tirés de hadiths, de récits, d'histoires et de poésie dans un dictionnaire unique, classé selon l'alphabet maghrébin; elle ne cite aucun inventeur unique."
