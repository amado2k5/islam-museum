"summary":
  "ar": "صورة لقطعة خطية من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن العاشر، فيها العنوان المزخرف والآيات ١ إلى ٦ من السورة التاسعة والستين، الحاقة، بالكوفي ⁦(الأسلوب الجديد الثالث)⁩. وتقول الصفحة إن النقاط الحمراء تدل على الحركات، وإن علامات الحركات وعلامات النطق أُضيفت لاحقًا بالحبر الأسود، وإن نقطة واحدة تحت الراء تميّزها من الزاي. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress calligraphic fragment, dated by the file page to the 10th century, with the illuminated title and verses 1 to 6 of the 69th chapter, al-Haqqa, in Kufi (New Style III). The page says red dots indicate vocalisation, while vowel signs and pronunciation marks were added in black ink at a later date, and that one dot below the letter ra distinguishes it from zayn. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک خطاطی ٹکڑے کی تصویر جسے فائل کا صفحہ دسویں صدی سے منسوب کرتا ہے، جس میں انہترویں سورت، الحاقہ، کا آراستہ عنوان اور آیات ۱ تا ۶ کوفی ⁦(نیا طرز III)⁩ میں ہیں۔ صفحہ کہتا ہے کہ سرخ نقطے حرکات کی نشاندہی کرتے ہیں، جبکہ حرکات کی علامتیں اور تلفظ کے نشان بعد میں سیاہ سیاہی میں بڑھائے گئے، اور را کے نیچے ایک نقطہ اسے زا سے ممتاز کرتا ہے۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un fragmento caligráfico de la Biblioteca del Congreso, fechado en el siglo X según la página del archivo, con el título iluminado y los versículos 1 a 6 del capítulo 69, al-Haqqa, en cúfico (Estilo Nuevo III). La página indica que los puntos rojos señalan la vocalización, mientras que los signos vocálicos y las marcas de pronunciación se añadieron posteriormente con tinta negra, y que un punto debajo de la letra ra la distingue de zayn. Sirve como ejemplo de la escritura de estilo nuevo, tradicionalmente llamada cúfica oriental, con sus letras verticales y el marcado contraste entre trazos gruesos y finos. Resulta útil para comprender la historia de la puntuación y la vocalización: permite al lector observar, en una página real, cómo se añadieron las marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un fragment calligraphique de la Bibliothèque du Congrès, daté du Xᵉ siècle d'après la page de documentation, présentant le titre enluminé et les versets 1 à 6 du chapitre 69, al-Haqqa, en coufique (style III). La page précise que les points rouges indiquent la vocalisation, tandis que les signes vocaliques et les marques de prononciation ont été ajoutés ultérieurement à l'encre noire. Un point sous la lettre « ra » la distingue de « zayn ». Ce fragment illustre le style III, traditionnellement appelé coufique oriental, avec ses lettres droites et le contraste marqué entre les traits épais et fins. Il est utile pour comprendre l'évolution de la pointification et de la vocalisation: il permet de voir, sur une seule page, comment les marques des voyelles brèves ont été ajoutées au squelette consonantique, d'abord sous forme de points colorés, puis de signes. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Kongre Kütüphanesi'ndeki, dosya sayfasından 10. yüzyıla tarihlenen bir el yazması parçasının fotoğrafı, Kufi yazısıyla (üçüncü yeni üslup) yazılmış, süslü başlığı ve 69. bölüm olan El-Hakka'nın 1-6. ayetlerini göstermektedir. Sayfada, kırmızı noktaların sesli harf işaretlerini gösterdiği, diyakritik işaretlerin ve telaffuz işaretlerinin daha sonra siyah mürekkeple eklendiği ve ra' harfinin altındaki tek bir noktanın onu zay harfinden ayırdığı belirtilmiştir. Dik, düz harfleri ve kalın ve ince vuruşlar arasındaki keskin kontrastıyla geleneksel olarak Doğu Kufi olarak adlandırılan yeni yazının bir örneğidir. Diyakritik işaretlerin ve sesli harf noktalarının gelişimini açıklamakta faydalıdır: okuyucu, sesli harf işaretlerinin harf yapısına nasıl eklendiğini, önce renkli noktalar ve daha sonra diyakritik işaretler olarak, gerçek bir sayfada görebilir. Görsel, Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  "id": "Foto fragmen manuskrip dari Perpustakaan Kongres, yang bertanggal abad ke-10 berdasarkan halaman arsipnya, menunjukkan judul dan ayat 1-6 dari bab ke-69, Al-Haqqah, dalam aksara Kufi (gaya baru ketiga). Halaman tersebut menyatakan bahwa titik-titik merah menunjukkan tanda vokal, bahwa tanda diakritik dan tanda pengucapan ditambahkan kemudian dengan tinta hitam, dan bahwa satu titik di bawah huruf ra' membedakannya dari zay. Ini berfungsi sebagai contoh aksara baru yang secara tradisional disebut Kufi Timur, dengan huruf-hurufnya yang tegak dan lurus serta kontras yang tajam antara goresan tebal dan tipis. Ini berguna dalam menjelaskan perkembangan tanda diakritik dan titik vokal: pembaca dapat melihat, pada halaman sebenarnya, bagaimana tanda vokal ditambahkan ke struktur huruf, pertama sebagai titik berwarna dan kemudian sebagai tanda diakritik. Gambar tersebut berada dalam domain publik di Wikimedia Commons."
