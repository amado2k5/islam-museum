"label":
  "ar": "المصحف الباريسي البطرسبرغي، الورقة الأولى وجه"
  "en": "Codex Parisino-petropolitanus, first leaf recto"
  "ur": "پیرس و سینٹ پیٹرزبرگ مصحف، پہلے ورق کا رخ"
"summary":
  "ar": "نسخة مرسومة باليد، كما تسميها صفحة الملف، للصفحة الأولى، وجه الورقة الأولى، من المصحف الباريسي البطرسبرغي المفهرس أيضًا برقم عربي ٣٢٨ والمحفوظ في المكتبة الوطنية الفرنسية. وتقدّر صفحة الملف تاريخه بنحو مطلع القرن الثامن وتذكر أن النص يبدأ من أواخر الآية ٢٧٥ من سورة البقرة. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A hand copy, as the file page labels it, of the first page, the recto of the first leaf, of the Codex Parisino-petropolitanus, also catalogued as BnF Arabe 328 and held at the Bibliothèque nationale de France. The file page estimates the date at about the early 8th century and says the text begins at the end of sura 2, verse 275. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "فائل کا صفحہ اسے ہاتھ سے بنائی نقل کہتا ہے: پیرس و سینٹ پیٹرزبرگ مصحف، جو عربی ۳۲۸ کے نام سے بھی فہرست ہے اور فرانسیسی قومی کتب خانے میں محفوظ ہے، کے پہلے ورق کے رخ کا پہلا صفحہ۔ صفحہ اس کی تاریخ آٹھویں صدی کے آغاز کے لگ بھگ بتاتا ہے اور کہتا ہے کہ متن سورۂ بقرہ کی آیت ۲۷۵ کے آخر سے شروع ہوتا ہے۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
