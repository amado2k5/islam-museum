"summary":
  "ar": "نسخة مرسومة باليد، كما تسميها صفحة الملف، للصفحة الأولى، وجه الورقة الأولى، من المصحف الباريسي البطرسبرغي المفهرس أيضًا برقم عربي ٣٢٨ والمحفوظ في المكتبة الوطنية الفرنسية. وتقدّر صفحة الملف تاريخه بنحو مطلع القرن الثامن وتذكر أن النص يبدأ من أواخر الآية ٢٧٥ من سورة البقرة. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A hand copy, as the file page labels it, of the first page, the recto of the first leaf, of the Codex Parisino-petropolitanus, also catalogued as BnF Arabe 328 and held at the Bibliothèque nationale de France. The file page estimates the date at about the early 8th century and says the text begins at the end of sura 2, verse 275. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "فائل کا صفحہ اسے ہاتھ سے بنائی نقل کہتا ہے: پیرس و سینٹ پیٹرزبرگ مصحف، جو عربی ۳۲۸ کے نام سے بھی فہرست ہے اور فرانسیسی قومی کتب خانے میں محفوظ ہے، کے پہلے ورق کے رخ کا پہلا صفحہ۔ صفحہ اس کی تاریخ آٹھویں صدی کے آغاز کے لگ بھگ بتاتا ہے اور کہتا ہے کہ متن سورۂ بقرہ کی آیت ۲۷۵ کے آخر سے شروع ہوتا ہے۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Una copia manuscrita, como indica la página del archivo, de la primera página, el anverso de la primera hoja, del Códice Parisino-petropolitano, también catalogado como BnF Arabe 328 y conservado en la Biblioteca Nacional de Francia. La página del archivo estima su fecha en torno a principios del siglo VIII e indica que el texto comienza al final de la sura 2, versículo 275. Se muestra como un ejemplo temprano de la familia de escrituras hiyazí, cuyas letras se inclinan y cuyas marcas ortográficas son escasas, lo que permite al lector compararla con las escrituras posteriores, más regulares. Ofrece al lector una visión del manuscrito original que respalda el registro de este mushaf en el museo. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Copie manuscrite, comme l'indique la fiche descriptive, de la première page (recto du premier feuillet) du Codex Parisino-petropolitanus, également catalogué sous la cote BnF Arabe 328 et conservé à la Bibliothèque nationale de France. La fiche descriptive situe la date de la copie au début du VIIIe siècle environ et précise que le texte commence à la fin de la sourate 2, verset 275. Elle est présentée comme un exemple ancien de l'écriture hijazi, caractérisée par des lettres inclinées et peu de signes orthographiques, permettant ainsi de la comparer aux écritures plus tardives et plus régulières. Elle offre au lecteur un aperçu du manuscrit original qui a servi de base à la notice du musée concernant ce mushaf. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Bu, dosya sayfasında belirtildiği gibi, Paris Petrus ve Pavlus Kur'an'ının ilk sayfasının, ilk yaprağının ön yüzünün elle çizilmiş bir kopyasıdır; bu Kur'an, Arapça 328 numarasıyla kataloglanmış ve Fransa Ulusal Kütüphanesi'nde bulunmaktadır. Dosya sayfası, eseri sekizinci yüzyılın başlarına tarihlendirmekte ve metnin Bakara Suresi'nin 275. ayetinin sonundan başladığını belirtmektedir. Eğik harfleri ve daha az diyakritik işaretiyle karakterize edilen Hicazi yazı ailesinin erken bir örneğini sunmaktadır; okuyucu bunu daha sonraki, daha düzenli yazılarla karşılaştırabilir. Okuyucuya, müzenin bu Kur'an'a ilişkin kayıtlarının dayandığı el yazmasının kendisine bir bakış sunmaktadır. Wikimedia Commons'taki görsel kamu malıdır."
  "id": "Ini adalah salinan gambar tangan, seperti yang disebut halaman arsip, dari halaman pertama, bagian depan lembar pertama, Al-Qur'an Peter dan Paul Paris, yang juga dikatalogkan dengan nomor Arab 328 dan disimpan di Perpustakaan Nasional Prancis. Halaman arsip tersebut memperkirakan tanggalnya sekitar awal abad kedelapan dan menyatakan bahwa teks dimulai pada akhir ayat 275 Surah Al-Baqarah. Ini menyajikan contoh awal dari keluarga aksara Hijazi, yang dicirikan oleh huruf-hurufnya yang miring dan tanda diakritik yang lebih sedikit, yang kemudian dapat dibandingkan oleh pembaca dengan aksara yang lebih teratur di kemudian hari. Ini memberi pembaca sekilas gambaran tentang manuskrip itu sendiri yang menjadi dasar catatan museum untuk Al-Qur'an ini. Gambar di Wikimedia Commons berada dalam domain publik."
