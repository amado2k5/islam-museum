summary:
  ar: "صورة حديثة لمدينة طليطلة مشرفة على الضفة اليمنى لنهر تاجة؛ سياق لموضع الحوضين المرويَّين عند باب الدباغين، لا صورة للجهاز نفسه الذي لم يبقَ له أثر موثق."
  en: "A modern photograph of Toledo overlooking the right bank of the Tagus; setting context for the reported Bab al-Dabbaghin basins, not an image of the device, which has no verified depiction."
  ur: "تاجة کے دائیں کنارے پر واقع طلیطلہ کی جدید تصویر؛ باب الدباغین کے منقول حوضوں کے مقام کا سیاق، خود آلہ کی تصویر نہیں جس کا کوئی موثق نقش نہیں۔"
  es: "Fotografía moderna de Toledo con vistas a la margen derecha del Tajo; que contextualiza las supuestas cuencas de Bab al-Dabbaghin, no una imagen del dispositivo en sí, del cual no existe ninguna representación verificada."
  fr: "Une photographie moderne de Tolède surplombant la rive droite du Tage; servant de contexte aux bassins de Bab al-Dabbaghin mentionnés, et non une image du dispositif, dont aucune représentation n'a été vérifiée."
  tr: "Tagus Nehri'nin sağ kıyısına bakan Toledo şehrinin yakın tarihli bir fotoğrafı; Bab al-Dabbaghin'deki iki sulama havzasının konumunu gösteren bir bağlam, cihazın kendisinin fotoğrafı değil, zira cihazdan geriye belgelenmiş hiçbir iz kalmamıştır."
  id: "Foto terbaru kota Toledo yang menghadap ke tepi kanan Sungai Tagus; konteks lokasi dua cekungan irigasi di Bab al-Dabbaghin, bukan foto perangkat itu sendiri, yang tidak ada jejak terdokumentasi yang tersisa."
