  en: "Toledo above the Tagus valley — contextual photograph"
  ur: "طلیطلہ، تاجة وادی کے اوپر — سیاقی تصویر"
  es: "Toledo sobre el valle del Tajo — fotografía contextual"
  fr: "Tolède au-dessus de la vallée du Tage — photographie contextuelle"
  tr: "Toledo ve yukarısındaki Tagus Nehri vadisi — bağlamsal görüntü"
