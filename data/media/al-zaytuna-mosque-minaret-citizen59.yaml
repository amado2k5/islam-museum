alt:
  ar: "مئذنة مربعة عالية ذات حشوات من زخارف حجرية متشابكة ترتفع عند ركن صحن مبلّط تحيط به أروقة بعقود مستديرة على أعمدة، تحت سماء زرقاء صافية."
  en: "A tall square minaret with panels of interlaced stonework rises at the corner of a paved courtyard lined with arcades of round arches on columns, under a clear blue sky."
  ur: "ایک بلند چوکور مینار جس پر باہم گندھے ہوئے پتھر کے نقوش کے خانے ہیں، ایک پختہ صحن کے کونے پر بلند ہے جس کے گرد ستونوں پر گول محرابوں والے برآمدے ہیں، صاف نیلے آسمان تلے۔"
  fr: "Un haut minaret carré à panneaux de pierre entrelacée s'élève à l'angle d'une cour dallée bordée d'arcades à arcs en plein cintre sur colonnes, sous un ciel bleu dégagé."
  es: "Un alto minarete cuadrado con paneles de labor de piedra entrelazada se eleva en la esquina de un patio pavimentado rodeado de arcadas de arcos de medio punto sobre columnas, bajo un cielo azul despejado."
  tr: "Birbirine geçmeli taş işçiliği panolarına sahip yüksek bir kare minare, sütunlar üzerinde yuvarlak kemerli revaklarla çevrili taş döşeli bir avlunun köşesinde yükseliyor, açık mavi bir gökyüzünün altında."
  id: "Menara persegi tinggi dengan panel batu bermotif saling-jalin menjulang di sudut halaman berpaving yang dikelilingi arkade lengkung bundar di atas tiang, di bawah langit biru cerah."
