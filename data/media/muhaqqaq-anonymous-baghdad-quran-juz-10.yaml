"summary":
  "ar": "صورة لمطلع الجزء العاشر من المصحف البغدادي المجهول، سورة الأنفال، الآية ٤١، متحف العصر الإسلامي رقم ٣٥٤٨، تؤرخها صفحة الملف بنحو ١٣٠٥ إلى ١٣٠٧م وتنسبها إلى محمد بن أيبك بن عبد الله وأحمد السهروردي. ولا تسمّي صفحة الملف الخط؛ ويربط سجلّ المفهوم في المتحف هذا المصحف بالمحقق. تخدم مثالًا على المحقق، الخط الجليل الذي فُضّل في المصاحف الكبيرة، تتباعد حروفه وتمتد أفقياته. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the beginning of juz' 10 of the Anonymous Baghdad Qur'an, sura al-Anfal, verse 41, Museum of the Islamic Era no. 3548, dated by the file page to about 1305 to 1307 and credited to Muhammad ibn Aybak ibn Abdallah and Ahmad al-Suhrawardi. The file page does not name the script; the museum's own concept record links this Qur'an to Muhaqqaq. It serves as an example of Muhaqqaq, the large, stately hand favoured for big mushafs, in which letters are spaced and strokes are long and level. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "گمنام بغدادی قرآن کے دسویں پارے کے آغاز کی تصویر، سورۂ انفال، آیت ۴۱، عجائب گھر دورِ اسلامی نمبر ۳۵۴۸؛ فائل کا صفحہ اسے تقریباً ۱۳۰۵ تا ۱۳۰۷ء کا بتاتا ہے اور محمد بن ایبک بن عبد اللہ اور احمد سہروردی سے منسوب کرتا ہے۔ فائل کا صفحہ خط کا نام نہیں لیتا؛ عجائب گھر کا اپنا تصوراتی اندراج اس قرآن کو محقق سے جوڑتا ہے۔ یہ محقق کی مثال ہے، وہ باوقار بڑا خط جو بڑے مصاحف میں پسند کیا گیا، جس کے حروف کھلے اور لکیریں لمبی اور ہموار ہوتی ہیں۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía del inicio del juz' 10 del Corán Anónimo de Bagdad, sura al-Anfal, versículo 41, Museo de la Era Islámica n.º 3548, fechada en la ficha entre 1305 y 1307 aproximadamente y atribuida a Muhammad ibn Aybak ibn Abdallah y Ahmad al-Suhrawardi. La ficha no especifica el tipo de escritura; el propio registro conceptual del museo vincula este Corán con la escritura Muhaqqaq. Sirve como ejemplo de Muhaqqaq, la caligrafía grande y majestuosa preferida para los grandes mushafs, en la que las letras están espaciadas y los trazos son largos y rectos. Permite al lector apreciar el manuscrito original que respalda el registro del museo de este mushaf. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie du début du juz' 10 du Coran anonyme de Bagdad, sourate al-Anfal, verset 41, conservé au Musée de l'époque islamique sous le numéro 3548. Daté d'environ 1305-1307 selon la fiche descriptive, il est attribué à Muhammad ibn Aybak ibn Abdallah et Ahmad al-Suhrawardi. La fiche descriptive ne mentionne pas l'écriture; la notice du musée rattache ce Coran à l'écriture muhaqqaq. Ce document illustre l'écriture muhaqqaq, une écriture imposante et majestueuse prisée pour les grands mushafs, caractérisée par des lettres espacées et des traits longs et réguliers. Il permet d'observer le manuscrit original ayant servi de base à la notice du musée. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Bağdat'ta bulunan ve bilinmeyen Kur'an'ın onuncu bölümünün, Enfal Suresi'nin 41. ayetinin açılış ayetlerinin fotoğrafı, İslam Çağı Müzesi No. 3548. Dosya sayfasında yaklaşık 1305-1307 yılları arasına tarihlenmekte ve Muhammed ibn Aybak ibn Abdullah ve Ahmed el-Suhrawardi'ye atfedilmektedir. Dosya sayfasında yazı türü belirtilmemiştir; ancak müzenin kavramsal kaydı bu Kur'an'ı Muhakkak yazısıyla ilişkilendirmektedir. Geniş aralıklı harfleri ve uzun yatay çizgileriyle karakterize edilen, büyük Kur'anlarda tercih edilen zarif bir yazı türü olan Muhakkak'ın bir örneği olarak hizmet vermektedir. Okuyucuya, müzenin bu Kur'an'a ilişkin kayıtlarının dayandığı el yazmasının kendisine bir bakış sunmaktadır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto ayat pembuka bagian kesepuluh dari Al-Qur'an Baghdad yang tidak dikenal, Surah Al-Anfal, ayat 41, Museum Era Islam No. 3548. Halaman arsip tersebut memperkirakan tanggalnya sekitar 1305-1307 M dan mengaitkannya dengan Muhammad ibn Aybak ibn Abdullah dan Ahmad al-Suhrawardi. Halaman arsip tersebut tidak menyebutkan jenis aksaranya; namun, catatan konsep museum menghubungkan Al-Qur'an ini dengan aksara Muhaqqaq. Foto ini berfungsi sebagai contoh Muhaqqaq, aksara elegan yang disukai dalam Al-Qur'an berukuran besar, yang dicirikan oleh huruf-hurufnya yang berjarak lebar dan garis horizontal yang memanjang. Foto ini memberikan pembaca sekilas gambaran tentang manuskrip itu sendiri yang menjadi dasar catatan museum untuk Al-Qur'an ini. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
