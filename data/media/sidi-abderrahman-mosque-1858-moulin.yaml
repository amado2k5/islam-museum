  ar: "صورة قديمة بلون بني داكن لمبنى أبيض ذي قبة منخفضة ومئذنة مربعة تزينها صفوف من العقود الصغيرة، قائم على منحدر وخلفه تلال داكنة."
  en: "A sepia photograph of a white building with a low dome and a square minaret decorated with rows of small arches, standing on a slope with dark hills behind."
  ur: "ایک پرانی گہرے بھورے رنگ کی تصویر جس میں ایک سفید عمارت ہے جس پر پست گنبد اور چھوٹی محرابوں کی قطاروں سے مزین چوکور مینار ہے، ایک ڈھلوان پر کھڑی ہے اور پیچھے گہری پہاڑیاں ہیں۔"
  fr: "Une photographie sépia d'un bâtiment blanc à coupole basse et à minaret carré orné de rangées de petits arcs, sur une pente, avec des collines sombres derrière."
  es: "Una fotografía en sepia de un edificio blanco con una cúpula baja y un minarete cuadrado decorado con filas de pequeños arcos, sobre una pendiente, con colinas oscuras detrás."
  tr: "Alçak kubbeli ve küçük kemer sıralarıyla süslü kare minareli beyaz bir yapının eski, koyu kahverengi tonlu bir fotoğrafı; bir yamaçta duruyor, arkasında koyu tepeler var."
  id: "Foto lama berwarna cokelat tua yang memperlihatkan bangunan putih dengan kubah rendah dan menara persegi yang dihiasi deretan lengkung kecil, berdiri di lereng dengan perbukitan gelap di belakangnya."
