summary:
  ar: "تُظهر الصورة العائدة إلى القرن التاسع عشر مسجد سيدي عبد الرحمن في الجزائر، بقبته ومئذنته ذات الطوابق من العقود الصغيرة، وخلفه التلال. صورة التقطها Félix-Jacques Moulin نحو سنة 1858، من ويكيميديا كومنز، وهي في الملك العام."
  en: "The nineteenth-century photograph shows the mosque of Sidi Abderrahman in Algiers, its dome and its minaret with tiers of small arches, against the hills. Photograph by Félix-Jacques Moulin, about 1858, on Wikimedia Commons, in the public domain."
  ur: "انیسویں صدی کی یہ تصویر الجزائر میں سیدی عبدالرحمن کی مسجد دکھاتی ہے، اس کا گنبد اور چھوٹی محرابوں کی منزلوں والا مینار، پس منظر میں پہاڑیاں۔ تصویر: Félix-Jacques Moulin، تقریباً 1858ء، وکیمیڈیا کامنز سے، عوامی ملکیت میں۔"
  fr: "La photographie du dix-neuvième siècle montre la mosquée de Sidi Abderrahman à Alger, sa coupole et son minaret à étages de petits arcs, devant les collines. Photographie : Félix-Jacques Moulin, vers 1858, sur Wikimedia Commons, dans le domaine public."
  es: "La fotografía del siglo diecinueve muestra la mezquita de Sidi Abderrahman en Argel, con su cúpula y su minarete de pisos de pequeños arcos, contra las colinas. Fotografía de Félix-Jacques Moulin, hacia 1858, en Wikimedia Commons, en el dominio público."
  tr: "On dokuzuncu yüzyıla ait fotoğraf, Cezayir'deki Sidi Abderrahman Camii'ni gösteriyor; kubbesi ve küçük kemerlerden oluşan katlara sahip minaresi, arkasında tepeler var. Fotoğraf: Félix-Jacques Moulin, yaklaşık 1858; Wikimedia Commons, kamu malı."
  id: "Foto abad kesembilan belas ini menampilkan masjid Sidi Abderrahman di Aljir, dengan kubahnya dan menaranya yang bertingkat lengkung-lengkung kecil, berlatar perbukitan. Foto oleh Félix-Jacques Moulin, sekitar 1858, di Wikimedia Commons, domain publik."
