"summary":
  "ar": "صورة التقطها دادروت في ٦ تشرين الأول ٢٠١٥ لمعروض في متحف الآغا خان بتورنتو، يصفه عنوان الملف بأنه ورقة ألبوم، مرقّع، بالنستعليق بتوقيع عماد الحسني، مير عماد الملك القزويني الحسني، قزوين، إيران، نحو ١٦٠٠م، حبر وألوان مائية وذهب على ورق؛ ويذكر المصوّر أن العمل قديم بما يكفي ليكون في الملك العام. تخدم مثالًا على النستعليق، الخط الفارسي المعلّق الذي نشأ من مزج النسخ والتعليق وصار خط الشعر الفارسي. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph, taken on 6 October 2015 by Daderot, of an exhibit in the Aga Khan Museum, Toronto, which the file title describes as an album leaf, muraqqa', of nasta'liq signed Imad al-Hassani, Mir Imad al-Mulk Qazvini Hassani, Qazvin, Iran, about 1600, ink, watercolour and gold on paper; the photographer states the work is old enough to be in the public domain. It serves as an example of Nasta'liq, the hanging Persian hand that grew from the blend of Naskh and Ta'liq and became the script of Persian poetry. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "آغا خان میوزیم، ٹورنٹو کی ایک نمائشی شے کی تصویر، جو ڈاڈروٹ نے ۶ اکتوبر ۲۰۱۵ کو لی؛ فائل کا عنوان اسے نستعلیق کا البمی ورق، مرقع، بتاتا ہے جس پر عماد حسنی، میر عماد الملک قزوینی حسنی، کے دستخط ہیں، قزوین، ایران، تقریباً ۱۶۰۰ء، کاغذ پر سیاہی، آبی رنگ اور سونا؛ فوٹوگرافر کہتا ہے کہ کام اتنا پرانا ہے کہ پبلک ڈومین میں ہے۔ یہ نستعلیق کی مثال ہے، وہ معلّق فارسی خط جو نسخ اور تعلیق کے امتزاج سے بنا اور فارسی شاعری کا خط بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía tomada el 6 de octubre de 2015 por Daderot de una pieza expuesta en el Museo Aga Khan de Toronto. El título del archivo la describe como una hoja de álbum (muraqqa') de escritura nastaliq firmada por Imad al-Hassani, Mir Imad al-Mulk Qazvini Hassani, Qazvin, Irán, alrededor de 1600. La obra está realizada en tinta, acuarela y oro sobre papel. El fotógrafo afirma que la obra es lo suficientemente antigua como para ser de dominio público. Sirve como ejemplo de nastaliq, la escritura persa colgante que surgió de la fusión de naskh y taliq y se convirtió en la escritura de la poesía persa. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Cette photographie, prise le 6 octobre 2015 par Daderot, représente une pièce exposée au Musée Aga Khan de Toronto. Le titre du fichier indique qu'il s'agit d'une feuille d'album (muraqqa') en nasta'liq, signée Imad al-Hassani, Mir Imad al-Mulk Qazvini Hassani, Qazvin, Iran, vers 1600, à l'encre, à l'aquarelle et à l'or sur papier. Le photographe précise que l'œuvre est suffisamment ancienne pour appartenir au domaine public. Elle illustre le nasta'liq, cette écriture persane suspendue, issue de la fusion du naskh et du ta'liq, et devenue l'écriture de la poésie persane. Sur Wikimedia Commons, le fichier porte la mention « domaine public »."
  "tr": "Dadrut tarafından 6 Ekim 2015'te Toronto'daki Aga Khan Müzesi'nde sergilenen bir eserden çekilen fotoğraf; dosya başlığında \"Nasta'lik yazısıyla yazılmış, yamalı bir albüm sayfası, İmad el-Hasani, Mir İmad el-Mulk el-Kazvini el-Hasani imzalı, Kazvin, İran, yaklaşık 1600 CE, mürekkep, suluboya ve altın yaldızlı kağıt üzerine\" olarak tanımlanıyor; fotoğrafçı, eserin kamu malı olabilecek kadar eski olduğunu belirtiyor. Bu eser, Naskh ve Ta'lik yazılarının birleşmesinden ortaya çıkan ve Fars şiirinin yazısı haline gelen Farsça yazı türü Nasta'lik'in bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Sebuah foto yang diambil oleh Dadrut pada 6 Oktober 2015, dari sebuah pameran di Museum Aga Khan di Toronto, yang dijelaskan dalam judul file sebagai lembaran album, ditambal, dalam aksara Nasta'liq, ditandatangani oleh Imad al-Hasani, Mir Imad al-Mulk al-Qazwini al-Hasani, Qazvin, Iran, sekitar tahun 1600 M, tinta, cat air, dan emas di atas kertas; fotografer menyatakan bahwa karya tersebut cukup tua untuk berada di domain publik. Foto ini berfungsi sebagai contoh Nasta'liq, aksara Persia yang muncul dari kombinasi Naskh dan Ta'liq dan menjadi aksara puisi Persia. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
