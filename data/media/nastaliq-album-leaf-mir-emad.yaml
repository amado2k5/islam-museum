"label":
  "ar": "ورقة ألبوم بالنستعليق بتوقيع عماد الحسني، قزوين، نحو ١٦٠٠م، متحف الآغا خان"
  "en": "Album leaf of Nasta'liq signed Imad al-Hassani, Qazvin, about 1600, Aga Khan Museum"
  "ur": "نستعلیق کا البمی ورق، دستخط عماد حسنی، قزوین، تقریباً ۱۶۰۰ء، آغا خان میوزیم"
"summary":
  "ar": "صورة التقطها دادروت في ٦ تشرين الأول ٢٠١٥ لمعروض في متحف الآغا خان بتورنتو، يصفه عنوان الملف بأنه ورقة ألبوم، مرقّع، بالنستعليق بتوقيع عماد الحسني، مير عماد الملك القزويني الحسني، قزوين، إيران، نحو ١٦٠٠م، حبر وألوان مائية وذهب على ورق؛ ويذكر المصوّر أن العمل قديم بما يكفي ليكون في الملك العام. تخدم مثالًا على النستعليق، الخط الفارسي المعلّق الذي نشأ من مزج النسخ والتعليق وصار خط الشعر الفارسي. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph, taken on 6 October 2015 by Daderot, of an exhibit in the Aga Khan Museum, Toronto, which the file title describes as an album leaf, muraqqa', of nasta'liq signed Imad al-Hassani, Mir Imad al-Mulk Qazvini Hassani, Qazvin, Iran, about 1600, ink, watercolour and gold on paper; the photographer states the work is old enough to be in the public domain. It serves as an example of Nasta'liq, the hanging Persian hand that grew from the blend of Naskh and Ta'liq and became the script of Persian poetry. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "آغا خان میوزیم، ٹورنٹو کی ایک نمائشی شے کی تصویر، جو ڈاڈروٹ نے ۶ اکتوبر ۲۰۱۵ کو لی؛ فائل کا عنوان اسے نستعلیق کا البمی ورق، مرقع، بتاتا ہے جس پر عماد حسنی، میر عماد الملک قزوینی حسنی، کے دستخط ہیں، قزوین، ایران، تقریباً ۱۶۰۰ء، کاغذ پر سیاہی، آبی رنگ اور سونا؛ فوٹوگرافر کہتا ہے کہ کام اتنا پرانا ہے کہ پبلک ڈومین میں ہے۔ یہ نستعلیق کی مثال ہے، وہ معلّق فارسی خط جو نسخ اور تعلیق کے امتزاج سے بنا اور فارسی شاعری کا خط بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
