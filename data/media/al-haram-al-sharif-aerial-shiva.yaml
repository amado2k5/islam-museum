summary:
  ar: "تُظهر الصورة الجوية ساحة الحرم القدسي الشريف المسوّرة في القدس من جهة الجنوب، وفي وسطها قبة الصخرة الذهبية وعند طرفها الجنوبي المسجد الأقصى. صورة التقطها Andrew Shiva في 15 نوفمبر 2013، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The aerial photograph shows the walled esplanade of al-Haram al-Sharif in Jerusalem from the south, with the golden Dome of the Rock at its centre and the Aqsa Mosque at its southern edge. Photograph by Andrew Shiva, 15 November 2013, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "فضائی تصویر میں یروشلم میں حرم شریف کا فصیل بند میدان جنوب کی جانب سے دکھائی دیتا ہے، جس کے وسط میں سنہری قبۃ الصخرہ اور جنوبی سرے پر مسجد اقصیٰ ہے۔ تصویر: Andrew Shiva، 15 نومبر 2013ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie aérienne montre l'esplanade fortifiée d'al-Haram al-Sharif à Jérusalem, vue du sud, avec le Dôme du Rocher doré en son centre et la mosquée al-Aqsa à son extrémité sud. Photographie : Andrew Shiva, 15 novembre 2013, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía aérea muestra la explanada amurallada de al-Haram al-Sharif en Jerusalén vista desde el sur, con la Cúpula de la Roca dorada en su centro y la mezquita de al-Aqsa en su borde sur. Fotografía de Andrew Shiva, 15 de noviembre de 2013, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Hava fotoğrafı, Kudüs'teki Harem-i Şerif'in surlarla çevrili meydanını güneyden gösteriyor; ortasında altın Kubbetü's-Sahra, güney kenarında Mescid-i Aksa var. Fotoğraf: Andrew Shiva, 15 Kasım 2013; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto udara ini menampilkan pelataran Al-Haram al-Sharif di Yerusalem yang dikelilingi tembok, dilihat dari selatan, dengan Kubah Batu berwarna emas di tengahnya dan Masjid Al-Aqsa di tepi selatannya. Foto oleh Andrew Shiva, 15 November 2013, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
