alt:
  ar: "منظر جوي لساحة مستطيلة واسعة مسوّرة داخل مدينة قديمة مكتظة: في وسطها مبنى ذو قبة ذهبية على مصطبة مرتفعة، وعند طرفها القريب مبنى طويل ذو قبة رمادية، وبينهما أشجار."
  en: "Aerial view of a large walled rectangular esplanade inside a dense old city: a building with a golden dome stands on a raised platform at the centre, a long grey-domed building lies at the near edge, and trees fill the space between."
  ur: "ایک گنجان پرانے شہر کے اندر فصیل سے گھرے ایک وسیع مستطیل میدان کا فضائی منظر: وسط میں بلند چبوترے پر سنہری گنبد والی عمارت کھڑی ہے، قریبی سرے پر خاکستری گنبد والی ایک لمبی عمارت ہے، اور ان کے درمیان درخت پھیلے ہیں۔"
  fr: "Vue aérienne d'une grande esplanade rectangulaire entourée de murs au cœur d'une vieille ville dense : un édifice à coupole dorée se dresse sur une plate-forme surélevée au centre, un long bâtiment à coupole grise se trouve au bord le plus proche, et des arbres remplissent l'espace entre les deux."
  es: "Vista aérea de una gran explanada rectangular amurallada dentro de una ciudad antigua y densa: un edificio con cúpula dorada se alza sobre una plataforma elevada en el centro, un largo edificio con cúpula gris se encuentra en el borde más cercano, y los árboles llenan el espacio entre ambos."
  tr: "Yoğun bir eski şehrin içinde, surlarla çevrili geniş bir dikdörtgen meydanın havadan görünümü: ortada yükseltilmiş bir platformun üzerinde altın kubbeli bir yapı duruyor, yakın kenarda gri kubbeli uzun bir yapı yer alıyor, ikisinin arasındaki boşluğu ağaçlar dolduruyor."
  id: "Pemandangan udara pelataran persegi panjang luas yang bertembok di dalam kota tua yang padat: sebuah bangunan berkubah emas berdiri di atas peron yang ditinggikan di tengah, sebuah bangunan panjang berkubah abu-abu berada di tepi terdekat, dan pepohonan mengisi ruang di antaranya."
