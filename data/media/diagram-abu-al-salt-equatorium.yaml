summary:
  ar: "سلسلة تعليمية تبين أسطرلابات الأندلس المعروفة ثم صفيحة أبي الصلت الواحدة التي تقوّم بها حركات الكواكب السبعة؛ لا ترسم الآلة ولا تدعي وجود قطع باقية."
  en: "Teaching chain from known Andalusian astrolabe practice to Abu al-Salt's single plate on which the motions of the seven planets are computed; it draws no instrument and claims no surviving piece."
  ur: "تدریسی سلسلہ جو معلوم اندلسی اسطرلابی مشق سے ابو الصلت کی ایک صفیحہ تک جاتا ہے جس پر سات سیاروں کی حرکات گنی جاتی ہیں؛ نہ کوئی آلہ بناتا ہے نہ کسی باقی ٹکڑے کا دعویٰ کرتا ہے۔"
  es: "Cadena de enseñanza desde la práctica conocida del astrolabio andalusí hasta la placa única de Abu al-Salt en la que se calculan los movimientos de los siete planetas; no dibuja ningún instrumento y afirma que no se conserva ninguna pieza."
  fr: "Chaîne d'enseignement allant de la pratique connue de l'astrolabe andalou à la plaque unique d'Abu al-Salt sur laquelle sont calculés les mouvements des sept planètes; elle ne mentionne aucun instrument et ne revendique aucune pièce ayant survécu."
