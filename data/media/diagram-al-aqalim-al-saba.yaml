alt:
  ar: "سلسلة من ثلاث حلقات: كتاب الجوامع للفرغاني الذي قسّم المعمورة إلى سبعة أقاليم، ثم مروج الذهب للمسعودي الذي عرض القائمة مع الأبراج والكواكب، ثم خريطة الإدريسي العالمية التي نظّمت العالم المعروف في أقاليمه."
  en: "A three-link chain: al-Farghani's Jawami' dividing the inhabited world into seven climates, al-Mas'udi's Muruj al-Dhahab giving the list with signs and planets, then al-Idrisi's world map organising the known world into its climates."
  ur: "تین کڑیوں کا سلسلہ: الفرغانی کی الجوامع جس نے آباد دنیا کو سات اقلیمی خطوں میں تقسیم کیا، المسعودی کا «مروج الذهب» جس نے فہرست بروج اور سیاروں کے ساتھ دی، پھر ادریسی کا عالمی نقشہ جس نے معلوم دنیا کو ان کے اقلیمی خطوں میں منظم کیا۔"
