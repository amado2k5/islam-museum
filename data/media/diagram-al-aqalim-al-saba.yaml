label:
  ar: "من الجوامع إلى مروج الذهب إلى خرائط الإدريسي"
  en: "From the Jawami' to Muruj al-Dhahab to al-Idrisi's maps"
  ur: "الجوامع سے مروج الذهب اور پھر ادریسی کے نقشوں تک"
  es: "De los Jawami' a Muruj al-Dhahab y a los mapas de al-Idrisi"
summary:
  ar: "سلسلة تعليمية تبين كيف دوّن الفرغاني تقسيم الأقاليم السبعة في فصول الجوامع، وعرضه المسعودي في مروج الذهب، ثم صار قالباً لتنظيم خرائط الإدريسي؛ لا تسمّي مخترعاً واحداً."
  en: "Teaching chain showing how al-Farghani recorded the seven-climates division in the Jawami' chapters, al-Mas'udi expounded it in Muruj al-Dhahab, and it became the template for al-Idrisi's maps; it names no single inventor."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ الفرغانی نے الجوامع کے ابواب میں سات اقلیمی خطوں کی تقسیم لکھی، المسعودی نے «مروج الذهب» میں پیش کی، اور وہ ادریسی کے نقشوں کا سانچہ بنی؛ یہ کسی ایک ایجاد کنندہ کا نام نہیں لیتا۔"
  es: "Cadena de enseñanza que muestra cómo al-Farghani registró la división de los siete climas en los capítulos de Jawami', al-Mas'udi la desarrolló en Muruj al-Dhahab, y se convirtió en el modelo para los mapas de al-Idrisi; no menciona a ningún inventor en particular."
