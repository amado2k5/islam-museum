depicts: [place/tlemcen]
alt:
  ar: "مدينة تمتد في سهل واسع تُرى من مرتفع مشجّر: في المقدمة بيوت بسقوف حمراء وبيضاء بين أشجار السرو وغيرها، وفي البعيد تلال تغيب في الضباب."
  en: "A city spreads across a wide plain seen from a wooded height: houses with red and white roofs among cypress and other trees in the foreground, and distant hills fading into haze."
  ur: "ایک شہر ایک وسیع میدان میں پھیلا ہوا ہے جو ایک درختوں والی بلندی سے دکھائی دیتا ہے: سامنے سرو اور دوسرے درختوں کے بیچ سرخ اور سفید چھتوں والے مکانات ہیں، اور دور کی پہاڑیاں دھند میں گم ہو رہی ہیں۔"
  fr: "Une ville s'étend sur une vaste plaine vue d'une hauteur boisée : des maisons aux toits rouges et blancs parmi des cyprès et d'autres arbres au premier plan, et des collines lointaines qui s'estompent dans la brume."
  es: "Una ciudad se extiende por una amplia llanura vista desde una altura arbolada: casas de tejados rojos y blancos entre cipreses y otros árboles en primer plano, y colinas lejanas que se desvanecen en la bruma."
  tr: "Ağaçlı bir yükseltiden görülen geniş bir ovaya yayılmış bir şehir: ön planda selvilerin ve başka ağaçların arasında kırmızı ve beyaz çatılı evler, uzakta ise sise karışan tepeler."
  id: "Sebuah kota terbentang di dataran luas terlihat dari ketinggian berhutan: rumah-rumah beratap merah dan putih di antara pohon cemara dan pepohonan lain di latar depan, dan perbukitan jauh yang memudar dalam kabut."
