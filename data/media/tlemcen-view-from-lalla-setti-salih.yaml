summary:
  ar: "تُظهر الصورة منظرًا عامًا لتلمسان من مرتفعات لالة ستي المطلّة على المدينة. صورة التقطها Riad Salih في 15 مايو 2025، من ويكيميديا كومنز، بترخيص CC BY 4.0."
  en: "The photograph shows a general view of Tlemcen from the heights of Lalla Setti above the city. Photograph by Riad Salih, 15 May 2025, on Wikimedia Commons, licensed CC BY 4.0."
  ur: "تصویر میں تلمسان کا عمومی منظر لالہ ستی کی ان بلندیوں سے دکھائی دیتا ہے جو شہر پر مشرف ہیں۔ تصویر: Riad Salih، 15 مئی 2025ء، وکیمیڈیا کامنز سے، لائسنس CC BY 4.0۔"
  fr: "La photographie montre une vue générale de Tlemcen depuis les hauteurs de Lalla Setti qui dominent la ville. Photographie : Riad Salih, 15 mai 2025, sur Wikimedia Commons, sous licence CC BY 4.0."
  es: "La fotografía muestra una vista general de Tremecén desde las alturas de Lalla Setti que dominan la ciudad. Fotografía de Riad Salih, 15 de mayo de 2025, en Wikimedia Commons, con licencia CC BY 4.0."
  tr: "Fotoğraf, Tilimsan'ın genel görünümünü, şehre hâkim Lalla Setti yüksekliklerinden gösteriyor. Fotoğraf: Riad Salih, 15 Mayıs 2025; Wikimedia Commons, CC BY 4.0 lisansı."
  id: "Foto ini menampilkan pemandangan umum Tlemcen dari ketinggian Lalla Setti yang menaungi kota. Foto oleh Riad Salih, 15 Mei 2025, di Wikimedia Commons, berlisensi CC BY 4.0."
