  ar: "خمسة عناصر متسلسلة: معالجات المنظر السابقة، ثم فصول الفرغاني عن قوس الانحراف من دايرة الارتفاع وأرقامه القصوى للقمر، ثم ترجمة إيطالهي، ثم ترجمة جيراردوس كريمنوننسيس، ثم طبعة غوليوس 1669."
