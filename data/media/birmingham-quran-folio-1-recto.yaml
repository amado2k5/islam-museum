"summary":
  "ar": "صورة الورقة الأولى وجهًا من مخطوط برمنغهام للقرآن، وهو رقّ تذكر صفحة الملف أن تأريخه بالكربون المشع يقع بين ٥٦٨ و٦٤٥م بثقة خمسة وتسعين بالمئة. ولا تضيف صفحة الملف وصفًا آخر للورقة. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of folio 1 recto of the Birmingham Qur'an manuscript, a parchment that the file page says was carbon-dated to 568 to 645 CE at 95 percent confidence. The file page gives no further description of the page. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "برمنگھم قرآنی مخطوطے کے ورق ۱ رخ کی تصویر؛ فائل کا صفحہ بتاتا ہے کہ اس چرمی کاغذ کی کاربن تاریخ ۵۶۸ تا ۶۴۵ء، پچانوے فیصد اعتماد کے ساتھ، متعین ہوئی۔ صفحہ اس ورق کی مزید تفصیل نہیں دیتا۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía del folio 1 recto del manuscrito del Corán de Birmingham, un pergamino que, según la página del archivo, fue datado por carbono entre los años 568 y 645 d. C. con un 95 % de confianza. La página del archivo no ofrece más descripción de la página. Se muestra como un ejemplo temprano de la familia de escrituras hiyazíes, cuyas letras están inclinadas y cuyas marcas ortográficas son escasas, lo que permite al lector compararlo con las escrituras posteriores, más regulares. Ofrece al lector una visión del manuscrito original que respalda el registro de este mushaf en el museo. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie du recto du folio 1 du manuscrit du Coran de Birmingham, un parchemin dont la fiche descriptive indique une datation au carbone 14 entre 568 et 645 apr. J.-C. avec un niveau de confiance de 95 %. La fiche descriptive ne fournit aucune autre description de la page. Elle est présentée comme un exemple ancien de l'écriture du Hedjaz, caractérisée par des lettres inclinées et peu de signes orthographiques, permettant ainsi de la comparer aux écritures plus tardives et régulières. Elle offre un aperçu du manuscrit original figurant dans la notice du musée relative à ce mushaf. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "İlk görsel, Birmingham Kur'an el yazmasının ön sayfasından bir kesittir; dosya sayfasına göre, radyokarbon tarihlemesi %95 güvenle 568 ile 645 yılları arasına tarihlenmektedir. Dosya sayfasında sayfa hakkında daha fazla bilgi verilmemektedir. Eğik harfleri ve daha az diyakritik işaretiyle karakterize edilen Hicazi yazı ailesinin erken bir örneğini sunmakta ve daha sonraki, daha düzenli yazılarla tezat oluşturmaktadır. Okuyucuya, müzenin bu Kur'an'a ilişkin kayıtlarının dayandığı el yazmasının kendisine bir bakış sunmaktadır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Gambar pertama adalah halaman depan dari manuskrip Al-Qur'an Birmingham, sebuah perkamen yang penanggalan radiokarbonnya, menurut halaman arsip, menempatkannya antara tahun 568 dan 645 Masehi dengan tingkat kepercayaan 95%. Halaman arsip tidak memberikan deskripsi lebih lanjut tentang halaman tersebut. Gambar ini menyajikan contoh awal dari keluarga aksara Hijazi, yang dicirikan oleh huruf-hurufnya yang miring dan tanda diakritik yang lebih sedikit, yang membedakannya dengan aksara yang lebih teratur di kemudian hari. Gambar ini menawarkan pembaca sekilas tentang manuskrip itu sendiri yang menjadi dasar catatan museum tentang Al-Qur'an ini. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
