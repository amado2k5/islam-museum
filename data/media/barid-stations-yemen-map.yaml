summary:
  ar: "خريطة حديثة رسمها أحد المساهمين في ويكيميديا كومنز سنة 2014 لمحطات البريد (السكك) في اليمن نحو القرن التاسع الميلادي كما وصفها ابن خرداذبه في «المسالك والممالك»: طريق من صنعاء إلى مأرب وعندل في حضرموت، وطريقان من صنعاء جنوباً عبر ذمار إلى الجند وإلى عدن، تفصل بين المحطات نقاط سوداء. محفوظة بترخيص CC BY-SA 4.0 وتُضمَّن برابطها بلا نسخ. وهي تصوّر شبكة البريد في العصر العباسي، لا تنظيم معاوية الأول."
  en: "A modern map drawn by a Wikimedia Commons contributor in 2014 of the barid stations of Yemen in about the ninth century, as Ibn Khurradadhbih describes them in Kitab al-Masalik wa-l-Mamalik: a road from Sana'a east to Ma'rib and 'Andal in Hadramawt, and two roads south from Sana'a through Dhamar to al-Janad and to Aden, with black dots for the stations between. It is held under CC BY-SA 4.0 and embedded by its URL, not copied. It shows the Abbasid-era network, not Mu'awiya's first organisation."
  ur: "وکی میڈیا کامنز کے ایک معاون کا 2014ء میں بنایا ہوا جدید نقشہ، جس میں تقریباً نویں صدی عیسوی میں یمن میں برید کی چوکیاں دکھائی گئی ہیں، جیسا کہ ابن خرداذبہ نے «المسالک والممالک» میں بیان کیا: صنعاء سے مشرق میں مأرب اور حضرموت میں عندل تک ایک راستہ، اور صنعاء سے جنوب میں ذمار ہوتے ہوئے الجند اور عدن تک دو راستے، اور بیچ کی چوکیاں سیاہ نقطوں سے۔ یہ CC BY-SA 4.0 کے تحت ہے اور نقل کیے بغیر اپنے ربط سے شامل ہے۔ یہ عباسی دور کا جال دکھاتا ہے، معاویہ کی پہلی تنظیم نہیں۔"
