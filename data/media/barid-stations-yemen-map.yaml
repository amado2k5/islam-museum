alt:
  ar: "خريطة تضاريس لجنوب غرب جزيرة العرب ملوّنة بالأخضر والبني، عليها خطوط حمراء تصل بين مدن معلَّمة بدوائر: من صنعاء شرقاً إلى مأرب ثم عندل في حضرموت، ومن صنعاء جنوباً إلى ذمار ثم إلى الجند وإلى عدن على البحر، وعلى كل خط نقاط سوداء صغيرة للمحطات، وسهم في الأعلى نحو الشمال مكتوب عليه: إلى غمرة 49 مرحلة، ومقياس رسم بالأميال والكيلومترات"
  en: "A relief map of south-west Arabia in greens and browns with red lines joining towns marked by circles: from Sana'a east to Ma'rib and on to 'Andal in Hadramawt, and from Sana'a south to Dhamar and then to al-Janad and to Aden on the sea. Each line carries small black dots for the stations. An arrow at the top points north, labelled To Ghamrah, 49 stages, and a scale bar gives miles and kilometres"
  ur: "جنوب مغربی عرب کا ابھار والا نقشہ، سبز اور بھورے رنگوں میں، جس پر سرخ لکیریں دائروں سے نشان زدہ شہروں کو جوڑتی ہیں: صنعاء سے مشرق میں مأرب اور آگے حضرموت میں عندل تک، اور صنعاء سے جنوب میں ذمار اور پھر الجند اور سمندر کنارے عدن تک۔ ہر لکیر پر چوکیوں کے لیے چھوٹے سیاہ نقطے ہیں۔ اوپر شمال کی طرف ایک تیر ہے جس پر لکھا ہے: غمرہ تک 49 منزلیں، اور میلوں اور کلومیٹروں کا پیمانہ دیا گیا ہے"
