alt:
  ar: "واجهة مسجد من الحجر الرملي الأحمر والحجر الفاتح بخمسة عقود مدببة وقبة واحدة، خلف جدران منخفضة متهدمة من الآجر وعشب أخضر، تحت سماء زرقاء فيها سحب."
  en: "A mosque front of red sandstone and pale stone with five pointed arches and a single dome, behind low ruined brick walls and green lawn, under a blue sky with clouds."
  ur: "سرخ ریتیلے پتھر اور ہلکے پتھر کی ایک مسجد کا سامنے کا رخ، جس میں پانچ نوکیلی محرابیں اور ایک گنبد ہے، پست شکستہ اینٹوں کی دیواروں اور سبز گھاس کے پیچھے، بادلوں بھرے نیلے آسمان تلے۔"
  fr: "Une façade de mosquée en grès rouge et en pierre claire, avec cinq arcs brisés et une seule coupole, derrière de bas murs de brique en ruine et une pelouse verte, sous un ciel bleu nuageux."
  es: "Una fachada de mezquita de arenisca roja y piedra clara, con cinco arcos apuntados y una sola cúpula, detrás de bajos muros de ladrillo en ruinas y un césped verde, bajo un cielo azul con nubes."
  tr: "Kırmızı kumtaşı ve açık renkli taştan, beş sivri kemerli ve tek kubbeli bir cami cephesi, alçak yıkık tuğla duvarların ve yeşil çimenliğin arkasında, bulutlu mavi bir gökyüzünün altında."
  id: "Bagian depan masjid dari batu pasir merah dan batu pucat dengan lima lengkung runcing dan satu kubah, di balik dinding bata rendah yang runtuh dan hamparan rumput hijau, di bawah langit biru berawan."
