summary:
  ar: "تُظهر الصورة واجهة مسجد قلعة كهنه ذات العقود الخمسة داخل القلعة القديمة في دلهي. صورة التقطها Russ Bowling في 3 أغسطس 2008، من ويكيميديا كومنز، بترخيص CC BY 2.0."
  en: "The photograph shows the five-arched façade of the Qila-i-Kuhna Mosque inside the Purana Qila, the Old Fort of Delhi. Photograph by Russ Bowling, 3 August 2008, on Wikimedia Commons, licensed CC BY 2.0."
  ur: "تصویر میں دہلی کے پرانے قلعے کے اندر مسجد قلعہ کہنہ کا پانچ محرابوں والا سامنے کا رخ دکھائی دیتا ہے۔ تصویر: Russ Bowling، 3 اگست 2008ء، وکیمیڈیا کامنز سے، لائسنس CC BY 2.0۔"
  fr: "La photographie montre la façade à cinq arcs de la mosquée Qila-i-Kuhna à l'intérieur du Purana Qila, le Vieux Fort de Delhi. Photographie : Russ Bowling, 3 août 2008, sur Wikimedia Commons, sous licence CC BY 2.0."
  es: "La fotografía muestra la fachada de cinco arcos de la mezquita Qila-i-Kuhna dentro del Purana Qila, el Fuerte Viejo de Delhi. Fotografía de Russ Bowling, 3 de agosto de 2008, en Wikimedia Commons, con licencia CC BY 2.0."
  tr: "Fotoğraf, Delhi'nin Eski Kalesi Purana Kila'nın içindeki Kila-i Kühne Camii'nin beş kemerli cephesini gösteriyor. Fotoğraf: Russ Bowling, 3 Ağustos 2008; Wikimedia Commons, CC BY 2.0 lisansı."
  id: "Foto ini menampilkan fasad berlengkung lima Masjid Qila-i-Kuhna di dalam Purana Qila, Benteng Lama Delhi. Foto oleh Russ Bowling, 3 Agustus 2008, di Wikimedia Commons, berlisensi CC BY 2.0."
