summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الطراز وعبد الملك بن مروان، وعن جانب ما سبقه عند الفرس والروم، وعن الجانب الآخر ما جاء بعده كما تذكره المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: the tiraz and Abd al-Malik ibn Marwan in the middle, what came before it among the Persians and Byzantines on one side and what followed, as the sources name it, on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں طراز اور عبد الملک بن مروان، ایک طرف فارس اور روم کے ہاں اس سے پہلے کی چیزیں اور دوسری طرف مآخذ کے مطابق اس کے بعد آنے والی چیزیں۔"
