alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه ثلاثة مربعات بإطار متقطع: طراز ملوك الفرس بصور الملوك، والطراز اليوناني على نسيج مصر، والصليب وذكر المسيح في رؤوس الطوامير. في الوسط مربع بإطار سميك: الطراز، عبد الملك بن مروان. العمود الأخير بعنوان: بُني عليه، وفيه أربعة مربعات: دنانير عبد الملك المكتوبة سنة 75هـ، ودار الطراز وديوان الطراز عند العباسيين، وطراز الأمويين في الأندلس والفاطميين في مصر، وطراز ملوك النورمان في صقلية."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds three dashed boxes: the Persian kings' tiraz with images of kings; the Greek-inscribed tiraz on Egyptian cloth; the cross and the mention of Christ at the head of papyrus rolls. In the middle a box with a thick border: Tiraz, Abd al-Malik ibn Marwan. The last column, headed Built on it, holds four boxes: Abd al-Malik's inscribed dinars of 75 AH; the Abbasid tiraz houses and diwan al-tiraz; the tiraz of the Umayyads of al-Andalus and of the Fatimids; the Arabic tiraz of the Norman kings of Sicily."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے تین خانے ہیں: فارس کے بادشاہوں کا تصویروں والا طراز؛ مصر کے کپڑوں پر یونانی طراز؛ طوماروں کے سرے پر صلیب اور مسیح کا ذکر۔ درمیان میں موٹے کنارے والا خانہ: طراز، عبد الملک بن مروان۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چار خانے ہیں: عبد الملک کے 75ھ کے لکھے ہوئے دینار؛ عباسیوں کے دار الطراز اور دیوان الطراز؛ اندلس کے امویوں اور مصر کے فاطمیوں کا طراز؛ صقلیہ کے نارمن بادشاہوں کا عربی طراز۔"
