label:
  ar: "رسم: ما بُني عليه الطراز الإسلامي وما بُني عليه"
  en: "Diagram: what the Islamic tiraz was built on and what was built on it"
  ur: "خاکہ: اسلامی طراز کس پر بنا اور اس پر کیا بنا"
  es: "Diagrama: sobre qué se construyó el tiraz islámico y qué se construyó sobre él."
  fr: "Schéma: sur quoi le tiraz islamique était construit et ce qui y était construit."
  tr: "Çizim: İslam üslubunun temelleri ve yapısı ne üzerine kurulmuştur?"
  id: "Menggambar: Apa yang menjadi dasar gaya Islam dan apa yang menjadi landasannya"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط الطراز وعبد الملك بن مروان، وعن جانب ما سبقه عند الفرس والروم، وعن الجانب الآخر ما جاء بعده كما تذكره المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: the tiraz and Abd al-Malik ibn Marwan in the middle, what came before it among the Persians and Byzantines on one side and what followed, as the sources name it, on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں طراز اور عبد الملک بن مروان، ایک طرف فارس اور روم کے ہاں اس سے پہلے کی چیزیں اور دوسری طرف مآخذ کے مطابق اس کے بعد آنے والی چیزیں۔"
  es: "Un esquema sencillo dibujado por el sitio en el momento de su construcción a partir de los datos del registro: el tiraz y Abd al-Malik ibn Marwan en el centro, lo que le precedió entre los persas y bizantinos a un lado y lo que le siguió, como lo denominan las fuentes, al otro."
  fr: "Un schéma simple dessiné par le site au moment de sa construction à partir des données des archives: le tiraz et Abd al-Malik ibn Marwan au milieu, ce qui l’a précédé chez les Perses et les Byzantins d’un côté et ce qui a suivi, comme le nomment les sources, de l’autre."
  tr: "Yapım aşamasındaki kayıtlardan yola çıkarak site tarafından çizilmiş basit bir şema: ortada Abdülmalik ibn Mervan'ın üslubu, bir tarafta Persler ve Romalılar arasında ondan önce gelenler, diğer tarafta ise kaynaklarda belirtildiği gibi ondan sonra gelenler yer almaktadır."
  id: "Diagram sederhana yang digambar oleh situs tersebut pada saat pembangunan berdasarkan data catatan: di tengah, gaya dan Abd al-Malik ibn Marwan, di satu sisi, apa yang mendahuluinya di kalangan Persia dan Romawi, dan di sisi lain, apa yang datang setelahnya, sebagaimana disebutkan oleh sumber-sumber."
