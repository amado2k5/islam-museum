  "en": "Page of Shikasta Nasta'liq calligraphy with floral margins, Iran, 1767, Art Institute of Chicago"
  "ur": "گل دار حاشیوں کے ساتھ شکستہ نستعلیق کا صفحہ، ایران، ۱۷۶۷ء، آرٹ انسٹی ٹیوٹ شکاگو"
"summary":
  "ar": "صورة لصفحة بخط الشكسته نستعليق بهوامش زهرية، معهد شيكاغو للفنون 2014.1012، نسخها عبد المجيد الطالقاني، إيران، ١٧٦٧م؛ حبر وذهب وألوان مائية على ورق، ٣٠٫٤٨ في ٢٠٫٣٢ سم، كما تذكر صفحة الملف. تخدم مثالًا على الشكسته، الاختزال الفارسي «المكسور» الذي يصل الحروف بضربة واحدة ويُستعمل للرسائل والمراسيم. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of a page of Shikasta Nasta'liq calligraphy with floral margins, Art Institute of Chicago 2014.1012, copied by Abdul Majid Talaqani, Iran, 1767; ink, gold and watercolour on paper, 30.48 by 20.32 cm, as the file page states. It serves as an example of Shikasta, the 'broken' Persian shorthand hand that joins letters in one stroke and is used for letters and decrees. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "گل دار حاشیوں کے ساتھ شکستہ نستعلیق خطاطی کے ایک صفحے کی تصویر، آرٹ انسٹی ٹیوٹ آف شکاگو 2014.1012، جسے عبد المجید طالقانی نے نقل کیا، ایران، ۱۷۶۷ء؛ کاغذ پر سیاہی، سونا اور آبی رنگ، ۳۰٫۴۸ ضرب ۲۰٫۳۲ سینٹی میٹر، جیسا فائل کا صفحہ بتاتا ہے۔ یہ شکستہ کی مثال ہے، «ٹوٹا ہوا» فارسی مختصر نویسی کا خط جو حروف کو ایک ہی ضرب میں جوڑتا ہے اور خطوط و فرامین میں برتا جاتا ہے۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
