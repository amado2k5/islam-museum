summary:
  ar: "تُظهر الصورة قلعة أورفا، وهي الرها القديمة، على صخرتها، وعلى قمتها عمودان عاليان. صورة التقطها Bernard Gagnon في 24 مايو 2014، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the castle of Urfa, the old al-Ruha or Edessa, on its rock, with two tall columns standing on the summit. Photograph by Bernard Gagnon, 24 May 2014, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں اورفہ کا قلعہ اس کی چٹان پر دکھائی دیتا ہے، یہ قدیم الرہا یا ایڈیسا ہے، اور چوٹی پر دو بلند ستون کھڑے ہیں۔ تصویر: Bernard Gagnon، 24 مئی 2014ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre le château d'Urfa, l'ancienne al-Ruha ou Édesse, sur son rocher, avec deux hautes colonnes qui se dressent au sommet. Photographie : Bernard Gagnon, 24 mai 2014, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra el castillo de Urfa, la antigua al-Ruha o Edesa, sobre su roca, con dos altas columnas en la cima. Fotografía de Bernard Gagnon, 24 de mayo de 2014, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, eski Er-Ruha ya da Edessa olan Urfa'nın kalesini, kayası üzerinde, zirvede duran iki yüksek sütunla birlikte gösteriyor. Fotoğraf: Bernard Gagnon, 24 Mayıs 2014; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan benteng Urfa, Ar-Ruha atau Edessa yang lama, di atas batunya, dengan dua tiang tinggi berdiri di puncaknya. Foto oleh Bernard Gagnon, 24 Mei 2014, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
