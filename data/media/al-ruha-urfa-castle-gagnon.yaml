alt:
  ar: "سور حصن ذو أبراج مربعة يمتد على قمة منحدر صخري؛ وإلى اليمين يرتفع فوقه عمودان حجريان عاليان، وإلى اليسار عَلَم أحمر فيه هلال ونجمة أبيضان، تحت سماء زرقاء صافية."
  en: "A fortress wall with square towers runs along the top of a rocky slope; two tall stone columns rise above it on the right and a red flag with a white crescent and star flies on the left, under a clear blue sky."
  ur: "چوکور برجوں والی ایک قلعے کی فصیل ایک چٹانی ڈھلوان کی چوٹی کے ساتھ چلتی ہے؛ دائیں جانب اس کے اوپر دو بلند پتھر کے ستون اٹھے ہیں اور بائیں جانب سفید ہلال اور ستارے والا سرخ جھنڈا لہرا رہا ہے، صاف نیلے آسمان تلے۔"
  fr: "Un mur de forteresse à tours carrées longe le haut d'une pente rocheuse ; deux hautes colonnes de pierre s'élèvent au-dessus à droite et un drapeau rouge au croissant et à l'étoile blancs flotte à gauche, sous un ciel bleu dégagé."
  es: "Una muralla de fortaleza con torres cuadradas recorre lo alto de una pendiente rocosa; dos altas columnas de piedra se elevan sobre ella a la derecha y una bandera roja con una media luna y una estrella blancas ondea a la izquierda, bajo un cielo azul despejado."
  tr: "Kare kuleli bir kale duvarı kayalık bir yamacın tepesi boyunca uzanıyor; sağda üzerinde iki yüksek taş sütun yükseliyor, solda ise beyaz hilalli ve yıldızlı kırmızı bir bayrak dalgalanıyor, açık mavi bir gökyüzünün altında."
  id: "Tembok benteng dengan menara-menara persegi membentang di puncak lereng berbatu; dua tiang batu tinggi menjulang di atasnya di sebelah kanan dan bendera merah dengan bulan sabit dan bintang putih berkibar di sebelah kiri, di bawah langit biru cerah."
