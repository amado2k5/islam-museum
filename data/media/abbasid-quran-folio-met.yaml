summary:
  ar: "ورقة مصحف بخط النسخ المكسور المستطيل من العصر العباسي ⁦(950–1000م)⁩ في المتحف المتروبوليتان للفنون؛ تُعرض كسياق لتقليد الخطوط الديوانية العباسية، لا كنموذج للقلم الرياسي الذي لم يبقَ له شواهد."
  en: "A Qur'an folio in rectangular broken cursive script from the Abbasid period (950–1000 CE) at the Metropolitan Museum of Art; shown as context for the Abbasid chancery-script tradition — not a specimen of the Riyasi pen, which has no surviving witnesses."
  ur: "میٹروپولیٹن میوزیم آف آرٹ میں عباسی دور ⁦(950–1000ء)⁩ کی قرآنی ورق مستطیل ٹوٹے نسخ میں؛ عباسی دیوانی خط کی روایت کے سیاق کے طور پر دکھائی گئی — ریاسی قلم کا نمونہ نہیں، جس کا کوئی باقیہ گواہ نہیں۔"
  es: "Un folio del Corán escrito en letra cursiva rectangular quebrada del período abasí (950-1000 d. C.) en el Museo Metropolitano de Arte; se muestra como contexto para la tradición de la escritura cancilleresca abasí, no como un ejemplar de la pluma Riyasi, de la que no se conservan testigos."
  fr: "Un folio du Coran en écriture cursive rectangulaire brisée de la période abbasside (950-1000 apr. J.-C.) au Metropolitan Museum of Art; présenté dans le contexte de la tradition d'écriture de chancellerie abbasside — et non un spécimen de la plume de Riyasi, dont il ne subsiste aucun témoin."
  tr: "Metropolitan Sanat Müzesi'nde bulunan, Abbasi dönemine (950-1000 MS) ait, kırık dikdörtgen Naskh yazısıyla yazılmış bir Kur'an sayfası; bu sayfa, Abbasi Divani yazı geleneğinin bir bağlamı olarak sergilenmektedir, Riyasi yazısının bir modeli olarak değil; zira Riyasi yazısına dair hiçbir kanıt kalmamıştır."
  id: "Sebuah halaman Al-Qur'an dengan aksara Naskh persegi panjang yang rusak dari era Abbasiyah (950–1000 M) di Museum Seni Metropolitan; halaman ini dipajang sebagai konteks untuk tradisi aksara Diwani Abbasiyah, bukan sebagai model aksara Riyasi, yang tidak ada bukti yang tersisa."
