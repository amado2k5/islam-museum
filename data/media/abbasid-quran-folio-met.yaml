alt:
  ar: "ورقة مصحف عباسية من القرن العاشر الميلادي بخط نسخي مكسور مستطيل، حبري ومذهّب على ورق؛ مشهد خطي من عصر لاحق من زمن الفضل بن سهل، سياق لا نموذج."
  en: "A tenth-century Abbasid Qur'an folio in rectangular broken cursive script, inked and gilded on paper; a calligraphic scene from a later period than al-Fadl ibn Sahl's, shown as context not as a specimen."
  ur: "دسویں صدی کی عباسی قرآنی ورق مستطیل ٹوٹے نسخ میں، کاغذ پر سیاہی اور سنہری رنگ؛ فضل بن سهل کے زمانے سے بعد کا خطی منظر، نمونے کے طور پر نہیں سیاق کے طور پر۔"
