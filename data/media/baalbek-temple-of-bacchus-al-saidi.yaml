depicts: [place/baalbek]
alt:
  ar: "معبد حجري قديم كبير على مصطبة عالية، وعلى جانبه صف من الأعمدة العالية تحمل تاجًا حجريًا ثقيلًا، يضيئه ضوء شمس دافئ تحت سماء زرقاء صافية؛ وأمامه كتل حجرية ساقطة."
  en: "A large ancient stone temple on a high platform, with a row of tall columns carrying a heavy entablature along its side, lit by warm sunlight under a clear blue sky; fallen blocks lie in front."
  ur: "ایک اونچے چبوترے پر ایک بڑا قدیم پتھر کا معبد، جس کے پہلو میں بلند ستونوں کی قطار ایک بھاری پتھریلا تاج اٹھائے ہوئے ہے، صاف نیلے آسمان تلے گرم دھوپ سے روشن؛ سامنے گرے ہوئے پتھر کے ٹکڑے پڑے ہیں۔"
  fr: "Un grand temple de pierre antique sur une haute plate-forme, avec une rangée de hautes colonnes portant un lourd entablement le long de son côté, éclairé par une lumière chaude sous un ciel bleu dégagé ; des blocs tombés gisent devant."
  es: "Un gran templo antiguo de piedra sobre una alta plataforma, con una fila de altas columnas que sostienen un pesado entablamento a lo largo de su costado, iluminado por una cálida luz del sol bajo un cielo azul despejado; delante yacen bloques caídos."
  tr: "Yüksek bir platform üzerinde büyük, eski bir taş tapınak; yan tarafında ağır bir taş başlık taşıyan yüksek sütunlardan oluşan bir sıra var, açık mavi bir gökyüzünün altında sıcak güneş ışığıyla aydınlanıyor; önünde düşmüş taş bloklar yatıyor."
  id: "Kuil batu kuno yang besar di atas peron tinggi, dengan deretan tiang tinggi yang menopang entablatur batu yang berat di sepanjang sisinya, disinari cahaya matahari hangat di bawah langit biru cerah; balok-balok batu yang roboh tergeletak di depannya."
