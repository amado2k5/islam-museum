summary:
  ar: "تُظهر الصورة معبد باخوس الروماني في بعلبك، وصف أعمدته العالية على أحد جانبيه. صورة التقطها Saadedine Al Saidi في 21 أغسطس 2015، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the Roman Temple of Bacchus at Baalbek, with its tall colonnade along one side. Photograph by Saadedine Al Saidi, 21 August 2015, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں بعلبک میں رومی معبد باخوس دکھائی دیتا ہے، اس کے ایک پہلو پر بلند ستونوں کی قطار ہے۔ تصویر: Saadedine Al Saidi، 21 اگست 2015ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre le temple romain de Bacchus à Baalbek, avec sa haute colonnade sur l'un de ses côtés. Photographie : Saadedine Al Saidi, 21 août 2015, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el templo romano de Baco en Baalbek, con su alta columnata a lo largo de uno de sus lados. Fotografía de Saadedine Al Saidi, 21 de agosto de 2015, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Baalbek'teki Roma dönemi Bakkhus Tapınağı'nı, bir yanındaki yüksek sütun dizisiyle gösteriyor. Fotoğraf: Saadedine Al Saidi, 21 Ağustos 2015; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan Kuil Bacchus Romawi di Baalbek, dengan barisan tiang tingginya di salah satu sisinya. Foto oleh Saadedine Al Saidi, 21 Agustus 2015, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
