"summary":
  "ar": "صورة من مكتبة تشستر بيتي للسور ٩١ إلى ٩٤ من مصحف ابن البواب، تؤرخها صفحة الملف بسنة ١٠٠٠-١٠٠١م، ٣٩١هـ. وتقول الصفحة إن كثيرين يعدّون الخط صورة من النسخ والريحان لا نسخًا خالصًا، وإن يُظن هذا المصحف أقدم مثال باقٍ بخط متصل ومثالًا مبكرًا لمصحف نُسخ بقطع رأسي على الورق. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph from the Chester Beatty Library of chapters 91 to 94 of the Qur'an of Ibn al-Bawwab, dated by the file page to 1000-1001, AH 391. The file page says many consider the script a naskh-rayhan variant rather than pure naskh, and that this Qur'an is thought to be the earliest existing example in a cursive script, and an early example copied in a vertical format on paper. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "چیسٹر بیٹی لائبریری سے ابن البواب کے قرآن کی سورتوں ۹۱ تا ۹۴ کی تصویر جسے فائل کا صفحہ ۱۰۰۰-۱۰۰۱ء، ۳۹۱ھ کا بتاتا ہے۔ صفحہ کہتا ہے کہ بہت سے لوگ اس خط کو خالص نسخ کی بجائے نسخ ریحان کی ایک صورت سمجھتے ہیں، اور یہ قرآن رواں خط میں موجود قدیم ترین مثال، اور کاغذ پر عمودی ساخت میں نقل ہونے کی ایک ابتدائی مثال سمجھا جاتا ہے۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de la Biblioteca Chester Beatty de los capítulos 91 al 94 del Corán de Ibn al-Bawwab, fechado en la ficha del archivo entre 1000 y 1001 d. H. 391. La ficha indica que muchos consideran la escritura una variante naskh-rayhan, más que naskh pura, y que se cree que este Corán es el ejemplo más antiguo existente en escritura cursiva, así como un ejemplo temprano copiado en formato vertical sobre papel. Sirve como ejemplo de naskh, la letra cursiva pequeña y uniforme que se convirtió en la escritura habitual para copiar libros y pequeños mushafs. Se incluye como una obra escrita por un maestro calígrafo, como se indica en la ficha, para que el lector pueda apreciar la tradición que rodea su nombre en la página; no se trata de un retrato. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie des chapitres 91 à 94 du Coran d'Ibn al-Bawwab, provenant de la bibliothèque Chester Beatty. Datée de 1000-1001 AH 391 selon la notice descriptive, cette photographie indique que l'écriture est considérée comme une variante naskh-rayhan plutôt que comme du naskh pur. Ce Coran serait le plus ancien exemple connu d'écriture cursive et l'un des premiers exemplaires copiés verticalement sur papier. Il illustre le naskh, cette petite écriture cursive régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Attribuée à un maître calligraphe, cette photographie permet au lecteur d'observer la tradition calligraphique entourant son nom. Il ne s'agit pas d'un portrait. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Chester Beatty Kütüphanesi'nden, dosya sayfasında 1000-1001 MS (391 Hicri) tarihli İbn el-Bawwab Kur'an'ının 91-94. surelerinin fotoğrafı. Sayfada, birçok kişinin yazıyı saf Naskh yerine Naskh ve Rayhan'ın bir varyasyonu olarak kabul ettiği belirtiliyor; ancak bu Kur'an'ın, el yazısının günümüze ulaşan en eski örneği ve kağıda dikey olarak kopyalanmış bir Kur'an'ın erken bir örneği olduğu düşünülüyor. Kitapların ve küçük Kur'anların kopyalanmasında norm haline gelen küçük, düzenli el yazısı olan Naskh'ın bir örneği olarak hizmet ediyor. Dosya sayfasında belirtildiği gibi, okuyucuya ismine atfedilen geleneğin kağıt üzerinde nasıl göründüğünü göstermek için, tanınmış bir hattat tarafından yapılmış bir eser olarak listelenmiştir; bir portre değildir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Sebuah foto dari Perpustakaan Chester Beatty yang menampilkan surah 91-94 dari Al-Qur'an Ibn al-Bawwab, bertanggal 1000-1001 M (391 H) berdasarkan halaman arsipnya. Halaman tersebut menyatakan bahwa banyak yang menganggap tulisan tersebut sebagai variasi Naskh dan Rayhan, bukan Naskh murni, meskipun Al-Qur'an ini dianggap sebagai contoh tulisan kursif tertua yang masih ada dan contoh awal Al-Qur'an yang disalin secara vertikal di atas kertas. Foto ini berfungsi sebagai contoh Naskh, tulisan kursif kecil dan teratur yang menjadi norma untuk menyalin buku dan Al-Qur'an berukuran kecil. Foto ini tercantum sebagai karya seorang kaligrafer terkemuka, seperti yang dicatat pada halaman arsip, untuk menunjukkan kepada pembaca bagaimana tradisi yang dikaitkan dengan namanya muncul di atas kertas; ini bukan potret. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
