"summary":
  "ar": "صورة لورقة مصحف عباسية تؤرخها صفحة الملف، مستندةً إلى معرض فرير في مؤسسة سمثسونيان رقم F1929.71، بالقرن التاسع أو العاشر وتسمّيها ببساطة «خط كوفي»؛ وتصنّفها كومنز ضمن «مصحف عباسي» و«الأسلوب الكوفي». تخدم مثالًا واضحًا على الخط الكوفي الزاوي المتباعد الذي كُتبت به المصاحف الأولى، للمقارنة بالخطوط المتصلة اللاحقة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of an Abbasid Qur'an folio that the file page, citing the Smithsonian's Freer Gallery of Art, F1929.71, dates to the 9th or 10th century and labels simply 'Kufic script'; Commons files it under 'Abbasid Qur'an' and 'Kufic style'. It serves as a clear example of the angular, widely spaced Kufic hand used for early mushaf copies, for comparison with the later cursive scripts. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "عباسی مصحف کے ایک ورق کی تصویر جسے فائل کا صفحہ، سمتھسونین کی فریر گیلری F1929.71 کا حوالہ دے کر، نویں یا دسویں صدی سے منسوب کرتا ہے اور محض «کوفی خط» کہتا ہے؛ کامنز اسے «عباسی قرآن» اور «کوفی طرز» کے زمروں میں رکھتا ہے۔ یہ زاویہ دار اور کھلے فاصلوں والے کوفی خط کی واضح مثال ہے جس میں ابتدائی مصاحف لکھے گئے، تاکہ بعد کے رواں خطوط سے موازنہ ہو سکے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán abasí que, según la página del archivo (citando la Galería de Arte Freer del Smithsonian, F1929.71), data de los siglos IX o X y se etiqueta simplemente como «escritura cúfica». Wikimedia Commons la archiva bajo las categorías «Corán abasí» y «estilo cúfico». Sirve como un claro ejemplo de la escritura cúfica angular y de líneas amplias utilizada en las primeras copias del mushaf, para compararla con las escrituras cursivas posteriores. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Cette photographie d'un folio abbasside du Coran, daté du IXe ou Xe siècle selon la fiche descriptive (F1929.71, provenant de la Freer Gallery of Art du Smithsonian), est simplement intitulée « écriture coufique ». Sur Wikimedia Commons, elle est classée sous les rubriques « Coran abbasside » et « style coufique ». Elle illustre parfaitement l'écriture coufique angulaire et espacée utilisée pour les premières copies de mushaf, et permet de la comparer aux écritures cursives plus tardives. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Smithsonian Enstitüsü'ndeki Freer Galerisi'nde bulunan ve F1929.71 numaralı dosya sayfasına göre dokuzuncu veya onuncu yüzyıla tarihlenen ve sadece \"Kufi yazı\" olarak etiketlenen bir Abbasi Kur'an sayfasının görüntüsü; Commons bunu \"Abbasi Kur'an\" ve \"Kufi üslup\" olarak sınıflandırıyor. Bu görüntü, daha sonraki el yazısıyla karşılaştırıldığında, erken dönem Kur'an'ların yazıldığı köşeli, aralıklı Kufi yazının açık bir örneğini oluşturuyor. Görüntü, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Gambar halaman Al-Qur'an Abbasiyah, yang berdasarkan halaman arsip di Freer Gallery di Smithsonian Institution, nomor F1929.71, berasal dari abad kesembilan atau kesepuluh dan hanya diberi label \"tulisan Kufi\"; Wikimedia Commons mengkategorikannya sebagai \"Al-Qur'an Abbasiyah\" dan \"gaya Kufi.\" Gambar ini berfungsi sebagai contoh jelas dari tulisan Kufi bersudut dan berjarak yang digunakan dalam penulisan Al-Qur'an awal, untuk perbandingan dengan tulisan kursif yang lebih baru. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
