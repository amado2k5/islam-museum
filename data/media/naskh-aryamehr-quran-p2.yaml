"summary":
  "ar": "صورة لصفحة من المصحف الآريامهري، الذي تقول صفحة الملف إنه المصحف البهلوي أو النيريزي، نُشر سنة ١٣٤٤ش عن مخطوط أصلي مؤرخ ١١١٧هـ بخط أحمد النيريزي، مأخوذة من نسخة في أرشيف الإنترنت. ولا تسمّي الصفحة الخط؛ والنيريزي معروف في سجلّات المتحف أستاذًا للنسخ. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page of the Aryamehr Qur'an, which the file page says is the Pahlavi or Neyrizi Qur'an, published in 1344 SH from an original manuscript dated 1117 AH by Ahmad Neyrizi, drawn from a copy on the Internet Archive. The page does not name the script; Neyrizi is known in the museum's graph as a master of Naskh. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "قرآن آریامہری کے ایک صفحے کی تصویر؛ فائل کا صفحہ کہتا ہے کہ یہ پہلوی یا نیریزی قرآن ہے جو ۱۳۴۴ شمسی میں احمد نیریزی کے ۱۱۱۷ھ کے اصل مخطوطے سے شائع ہوا، انٹرنیٹ آرکائیو کی ایک نقل سے۔ صفحہ خط کا نام نہیں لیتا؛ عجائب گھر کے اندراجات میں نیریزی نسخ کے استاد کے طور پر معروف ہے۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página del Corán de Aryamehr, que según la ficha del archivo es el Corán Pahlavi o Neyrizi, publicado en 1344 SH a partir de un manuscrito original fechado en 1117 AH por Ahmad Neyrizi, extraído de una copia del Archivo de Internet. La página no especifica el tipo de escritura; Neyrizi es conocido en el archivo del museo como un maestro del Naskh. Sirve como ejemplo del Naskh, la letra pequeña, incluso cursiva, que se convirtió en la escritura habitual para copiar libros y pequeños mushafs. Permite al lector ver el manuscrito original que respalda el registro del museo de este mushaf. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'une page du Coran d'Aryamehr, présenté comme le Coran pahlavi ou Neyrizi, publié en 1344 SH à partir d'un manuscrit original daté de 1117 AH par Ahmad Neyrizi, d'après une copie conservée sur Internet Archive. La page ne mentionne pas l'écriture; Neyrizi est connu dans le catalogue du musée comme un maître du naskh. Cette photographie illustre le naskh, cette petite écriture cursive régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Elle permet au lecteur d'observer le manuscrit original à l'origine de la notice du musée. Sur Wikimedia Commons, le fichier est dans le domaine public."
