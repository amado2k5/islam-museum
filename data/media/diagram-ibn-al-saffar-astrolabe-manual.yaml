summary:
  ar: "سلسلة تعليمية تبين مسار رسالة ابن الصفار: تأليفها في الأندلس ثم ترجمتها إلى اللاتينية والعبرية والإسبانية القديمة واستعمالها في بلاط ألفونسو العاشر؛ لا ترسم صفحات ولا ترجمات حرفية."
  en: "Teaching chain showing the path of Ibn al-Saffar's treatise: composed in al-Andalus, then translated into Latin, Hebrew and Old Spanish and used at Alfonso X's court; it draws no pages and no literal translations."
  ur: "تدریسی سلسلہ جو ابن الصفار کے رسالے کا راستہ دکھاتا ہے: اندلس میں تالیف، پھر لاطینی، عبرانی اور پرانی ہسپانوی میں ترجمہ اور الفانسو دہم کے دربار میں استعمال؛ نہ صفحات نہ لفظی تراجم۔"
  es: "Cadena de enseñanza que muestra el recorrido del tratado de Ibn al-Saffar: compuesto en al-Ándalus, luego traducido al latín, hebreo y español antiguo y utilizado en la corte de Alfonso X; no incluye páginas ni traducciones literales."
  fr: "Chaîne d'enseignement montrant le parcours du traité d'Ibn al-Saffar: composé en al-Andalus, puis traduit en latin, en hébreu et en vieil espagnol et utilisé à la cour d'Alphonse X; il ne comporte ni pages ni traductions littérales."
  tr: "İbn el-Saffar'ın mesajının izini süren eğitici bir seri: Endülüs'te yazılması, Latince, İbranice ve Eski İspanyolcaya çevrilmesi ve Alfonso X'in sarayında kullanılması; sayfalarca çizim yapmaz veya birebir çeviri sunmaz."
  id: "Seri edukatif yang menunjukkan perjalanan pesan Ibn al-Saffar: penyusunannya di Andalusia, terjemahannya ke dalam bahasa Latin, Ibrani, dan Spanyol Kuno, serta penggunaannya di istana Alfonso X; seri ini tidak menampilkan halaman atau terjemahan harfiah."
