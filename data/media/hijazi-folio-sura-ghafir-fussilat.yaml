"summary":
  "ar": "صورة لورقة مصحف على الرق تؤرخها صفحة الملف، المأخوذة من قطعة معروضة في مزاد كريستيز، بالنصف الثاني من القرن السابع أو مطلع الثامن. وتذكر ثماني عشرة سطرًا في الوجه بخط حجازي بنيّ داكن، وعنوان سورة بالأحمر، وعلامات ضبط حمراء، وعلامات فواصل الآيات على هيئة دوائر منقّطة، مع مواضع تالفة؛ ومقاس الورقة نحو ٣١٫٨ في ٢٥٫٤ سم. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a vellum Qur'an folio that the file page, drawn from a Christie's auction lot, dates to the second half of the 7th or early 8th century. It records 18 lines a side in sepia Hijazi script, a sura heading in red, red vocalisation markers and dotted-roundel verse markers, with areas of loss; the folio measures 31.8 by 25.4 cm. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "رق پر لکھے مصحف کے ایک ورق کی تصویر جسے فائل کا صفحہ، جو کرسٹیز کی نیلامی کے ایک لاٹ سے لیا گیا ہے، ساتویں صدی کے دوسرے نصف یا آٹھویں کے آغاز سے منسوب کرتا ہے۔ اس میں ہر طرف اٹھارہ سطریں سیپیا رنگ کے حجازی خط میں، سورت کا عنوان سرخ میں، سرخ اعراب کے نشانات اور نقطہ دار گول آیت نشان بیان ہوئے ہیں، کچھ حصے ضائع ہیں؛ ورق کی پیمائش ۳۱٫۸ ضرب ۲۵٫۴ سینٹی میٹر ہے۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán en pergamino, cuya página de archivo, procedente de un lote de la subasta de Christie's, data de la segunda mitad del siglo VII o principios del VIII. Contiene 18 líneas por lado en escritura hiyazí en sepia, un encabezado de sura en rojo, marcadores de vocalización rojos y marcadores de versos en círculos punteados, con zonas de pérdida; el folio mide 31,8 x 25,4 cm. Se muestra como un ejemplo temprano de la familia de escrituras hiyazí, cuyas letras se inclinan y cuyas marcas ortográficas son escasas, lo que permite al lector compararlo con las escrituras posteriores, más regulares. Resulta útil para comprender la historia de la puntuación y la vocalización: permite al lector observar, en una página real, cómo se añadieron las marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un folio de Coran sur vélin, datant de la seconde moitié du VIIe siècle ou du début du VIIIe siècle, provenant d'une vente aux enchères de Christie's. Ce folio, composé de 18 lignes par face en écriture hijazi sépia, présente l'en-tête d'une sourate en rouge, des marques de vocalisation rouges et des marques de verset en forme de rondelle pointillée, avec des zones manquantes. Ses dimensions sont de 31,8 x 25,4 cm. Il est présenté comme un exemple ancien de l'écriture hijazi, caractérisée par des lettres inclinées et peu de signes orthographiques, permettant ainsi de le comparer aux écritures plus récentes et régulières. Ce document est précieux pour comprendre l'évolution de la ponctuation et de la vocalisation: il illustre, sur une seule page, comment les signes des voyelles brèves ont été ajoutés au squelette consonantique, d'abord sous forme de points colorés, puis de signes distinctifs. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Christie's müzayedesinde satışa sunulan bir parçanın dosya sayfasından yola çıkarak 7. yüzyılın ikinci yarısına veya 8. yüzyılın başlarına tarihlenen, parşömen üzerine yazılmış bir Kur'an el yazması sayfasının fotoğrafı. Ön yüzünde koyu kahverengi Hicazi yazısıyla yazılmış on sekiz satır, kırmızı renkte bir sure başlığı, kırmızı diyakritik işaretler ve ayet aralarını belirten noktalı daireler ile birlikte bazı hasarlı alanlar görülmektedir. Sayfa yaklaşık 31,8 x 25,4 cm ölçülerindedir. Eğik harfleri ve daha az diyakritik işaretiyle karakterize edilen Hicazi yazı ailesinin erken bir örneğini sunar ve daha sonraki, daha düzenli yazılarla tezat oluşturur. Diyakritik işaretlerin ve sesli harf noktalarının gelişimini anlamada faydalıdır: okuyucu, gerçek bir sayfada, bu işaretlerin harf yapısına nasıl eklendiğini, önce renkli noktalar ve daha sonra diyakritik işaretler olarak görebilir. Görsel, Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  "id": "Foto halaman manuskrip Al-Qur'an di atas perkamen, yang berdasarkan halaman arsip dari sebuah barang yang ditawarkan di lelang Christie's, berasal dari paruh kedua abad ke-7 atau awal abad ke-8. Halaman tersebut menunjukkan delapan belas baris di bagian depan dengan aksara Hijazi berwarna cokelat tua, judul surah berwarna merah, tanda diakritik merah, dan lingkaran bertitik yang menandai pemisah ayat, beserta beberapa area yang rusak. Halaman tersebut berukuran sekitar 31,8 x 25,4 cm. Ini merupakan contoh awal dari keluarga aksara Hijazi, yang dicirikan oleh huruf-hurufnya yang miring dan tanda diakritik yang lebih sedikit, yang membedakannya dengan aksara yang lebih teratur di kemudian hari. Foto ini berguna untuk memahami perkembangan tanda diakritik dan tanda vokal: pembaca dapat melihat, pada halaman sebenarnya, bagaimana tanda-tanda ini ditambahkan ke struktur huruf, pertama sebagai titik berwarna dan kemudian sebagai tanda diakritik. Gambar ini berada dalam domain publik di Wikimedia Commons."
