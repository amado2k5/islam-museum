"summary":
  "ar": "صورة لمخطوط قرآني تقول صفحة الملف إنه مكتوب بالخط الكوفي المشرقي وتؤرخه بما بين القرن الخامس الهجري والقرن الحادي عشر الميلادي. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Qur'anic manuscript that the file page says is written in the Kufi Mashriqi, or eastern Kufic, script, and dates to between the 5th century of the Hijra and the 11th century CE. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایک قرآنی مخطوطے کی تصویر جسے فائل کا صفحہ مشرقی کوفی خط میں لکھا بتاتا ہے اور پانچویں صدی ہجری اور گیارھویں صدی عیسوی کے درمیان کا قرار دیتا ہے۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un manuscrito coránico que, según la página del archivo, está escrito en escritura cúfica mashriqi, o cúfica oriental, y data de entre el siglo V de la Hégira y el siglo XI d. C. Sirve como ejemplo de la escritura de estilo nuevo, tradicionalmente llamada cúfica oriental, con sus letras verticales y el marcado contraste entre trazos gruesos y finos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un manuscrit coranique écrit en écriture coufique orientale (ou koufi mashriqi), datant du Ve siècle de l'Hégire au XIe siècle de notre ère. Ce manuscrit illustre cette nouvelle écriture, caractérisée par ses lettres droites et le contraste marqué entre les traits épais et fins. Sur Wikimedia Commons, le fichier est dans le domaine public."
