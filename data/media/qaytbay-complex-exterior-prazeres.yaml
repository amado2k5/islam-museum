alt:
  ar: "مبنى حجري ذو مداميك مخططة يُرى من أسفل: قبة منقوشة إلى اليسار ومئذنة عالية مزخرفة إلى اليمين وشرفة علوية بسقف خشبي، وأمامه سيارات واقفة عند سياج حديدي."
  en: "A stone building with striped masonry seen from below: a carved dome on the left, a tall ornate minaret on the right and an upper loggia with a wooden roof; cars are parked by an iron fence in front."
  ur: "دھاری دار چنائی والی ایک پتھر کی عمارت نیچے سے دکھائی دیتی ہے: بائیں جانب منقوش گنبد، دائیں جانب بلند آراستہ مینار اور لکڑی کی چھت والی بالائی بالکونی؛ سامنے لوہے کی باڑ کے پاس گاڑیاں کھڑی ہیں۔"
  fr: "Un bâtiment de pierre à appareil rayé vu d'en bas : une coupole sculptée à gauche, un haut minaret orné à droite et une loggia supérieure à toit de bois ; des voitures sont garées près d'une clôture de fer devant."
  es: "Un edificio de piedra con mampostería a rayas visto desde abajo: una cúpula tallada a la izquierda, un alto minarete ornamentado a la derecha y una logia superior con techo de madera; hay coches aparcados junto a una valla de hierro delante."
  tr: "Çizgili taş işçiliğine sahip bir taş yapı aşağıdan görülüyor: solda oymalı bir kubbe, sağda yüksek ve süslü bir minare ve ahşap çatılı bir üst galeri; önünde demir bir çitin yanında arabalar park etmiş."
  id: "Bangunan batu dengan susunan batu bergaris terlihat dari bawah: kubah berukir di sebelah kiri, menara tinggi yang berhias di sebelah kanan, dan beranda atas beratap kayu; mobil-mobil diparkir di dekat pagar besi di depannya."
