summary:
  ar: "تُظهر الصورة مجموعة السلطان قايتباي الجنائزية في المقبرة الشمالية بالقاهرة من الشارع، بقبتها الحجرية المنقوشة ومئذنتها. صورة التقطها Robert Prazeres في 11 أكتوبر 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the funerary complex of Sultan Qaytbay in Cairo's Northern Cemetery from the street, with its carved stone dome and its minaret. Photograph by Robert Prazeres, 11 October 2012, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں قاہرہ کے شمالی قبرستان میں سلطان قایتبائی کا تدفینی مجموعہ گلی سے دکھائی دیتا ہے، اس کے منقوش پتھر کے گنبد اور مینار کے ساتھ۔ تصویر: Robert Prazeres، 11 اکتوبر 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre le complexe funéraire du sultan Qaytbay dans le cimetière du Nord du Caire, vu de la rue, avec sa coupole de pierre sculptée et son minaret. Photographie : Robert Prazeres, 11 octobre 2012, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra el complejo funerario del sultán Qaytbay en el Cementerio del Norte de El Cairo desde la calle, con su cúpula de piedra tallada y su minarete. Fotografía de Robert Prazeres, 11 de octubre de 2012, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Kahire'nin Kuzey Mezarlığı'ndaki Sultan Kayıtbay'ın türbe külliyesini sokaktan, oyma taş kubbesi ve minaresiyle gösteriyor. Fotoğraf: Robert Prazeres, 11 Ekim 2012; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan kompleks pemakaman Sultan Qaytbay di Pemakaman Utara Kairo dari jalan, dengan kubah batu berukirnya dan menaranya. Foto oleh Robert Prazeres, 11 Oktober 2012, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
