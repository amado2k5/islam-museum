alt:
  ar: "منظر جوي لتل بيضاوي كبير ذي جوانب ترابية شديدة الانحدار، وسطحه المنبسط مغطى كله ببيوت متلاصقة، تحيط به شوارع مدينة حديثة ومبانيها."
  en: "Aerial view of a large oval mound with steep earthen sides, its flat top completely covered with tightly packed houses, surrounded by the streets and buildings of a modern city."
  ur: "ایک بڑے بیضوی ٹیلے کا فضائی منظر جس کے پہلو مٹی کے عمودی ہیں، اس کی ہموار چوٹی مکمل طور پر باہم جڑے مکانات سے ڈھکی ہوئی ہے، اور اس کے گرد ایک جدید شہر کی گلیاں اور عمارتیں ہیں۔"
  fr: "Vue aérienne d'un grand tertre ovale aux flancs de terre abrupts, dont le sommet plat est entièrement couvert de maisons serrées, entouré des rues et des bâtiments d'une ville moderne."
  es: "Vista aérea de un gran montículo ovalado de laderas de tierra empinadas, con la cima plana completamente cubierta de casas muy apretadas, rodeado por las calles y los edificios de una ciudad moderna."
  tr: "Toprak yanları dik büyük oval bir höyüğün havadan görünümü; düz tepesi sıkış sıkış evlerle tamamen kaplı, çevresini modern bir şehrin sokakları ve binaları sarıyor."
  id: "Pemandangan udara gundukan oval besar dengan sisi-sisi tanah yang curam, puncaknya yang datar tertutup sepenuhnya oleh rumah-rumah yang berdesakan, dikelilingi jalan dan bangunan kota modern."
