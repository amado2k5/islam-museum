summary:
  ar: "تُظهر الصورة الجوية قلعة أربيل، وهي تل مستدير مكتظ بالبيوت، في وسط المدينة. صورة التقطها Jim Gordon في 16 سبتمبر 2007، من ويكيميديا كومنز، بترخيص CC BY 2.0."
  en: "The aerial photograph shows the citadel of Erbil, a round mound packed with houses, in the middle of the city. Photograph by Jim Gordon, 16 September 2007, on Wikimedia Commons, licensed CC BY 2.0."
  ur: "فضائی تصویر میں اربیل کا قلعہ شہر کے وسط میں دکھائی دیتا ہے، جو مکانات سے بھرا ہوا گول ٹیلا ہے۔ تصویر: Jim Gordon، 16 ستمبر 2007ء، وکیمیڈیا کامنز سے، لائسنس CC BY 2.0۔"
  fr: "La photographie aérienne montre la citadelle d'Erbil, un tertre rond chargé de maisons, au milieu de la ville. Photographie : Jim Gordon, 16 septembre 2007, sur Wikimedia Commons, sous licence CC BY 2.0."
  es: "La fotografía aérea muestra la ciudadela de Erbil, un montículo redondo repleto de casas, en medio de la ciudad. Fotografía de Jim Gordon, 16 de septiembre de 2007, en Wikimedia Commons, con licencia CC BY 2.0."
  tr: "Hava fotoğrafı, şehrin ortasında evlerle dolu yuvarlak bir tepe olan Erbil Kalesi'ni gösteriyor. Fotoğraf: Jim Gordon, 16 Eylül 2007; Wikimedia Commons, CC BY 2.0 lisansı."
  id: "Foto udara ini menampilkan benteng Erbil, gundukan bundar yang penuh sesak dengan rumah-rumah, di tengah kota. Foto oleh Jim Gordon, 16 September 2007, di Wikimedia Commons, berlisensi CC BY 2.0."
