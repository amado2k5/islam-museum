alt:
  ar: "بيوت بيضاء مسطحة السقوف ومبنى أبيض طويل ذو أروقة تقع أسفل صخور بنية جرداء تعلوها قلعة حجرية بأبراج مستديرة، وخلفها البحر الأزرق الداكن وسماء صافية."
  en: "White flat-roofed houses and a long white building with arcades lie below bare brown rocks crowned by a stone fort with round towers, with the dark blue sea and a clear sky behind."
  ur: "سفید ہموار چھتوں والے مکانات اور محرابی برآمدوں والی ایک لمبی سفید عمارت بنجر بھوری چٹانوں کے نیچے ہیں جن کے اوپر گول برجوں والا پتھر کا قلعہ ہے، اور پیچھے گہرا نیلا سمندر اور صاف آسمان ہے۔"
  fr: "Des maisons blanches à toit plat et un long bâtiment blanc à arcades s'étendent sous des rochers bruns nus couronnés d'un fort de pierre à tours rondes, avec la mer bleu sombre et un ciel dégagé derrière."
  es: "Casas blancas de techo plano y un largo edificio blanco con arcadas se extienden bajo rocas pardas desnudas coronadas por un fuerte de piedra con torres redondas, con el mar azul oscuro y un cielo despejado detrás."
  tr: "Beyaz düz çatılı evler ve revaklı uzun beyaz bir bina, yuvarlak kuleli taş bir kalenin tepesinde durduğu çıplak kahverengi kayaların altında uzanıyor; arkada koyu mavi deniz ve açık bir gökyüzü var."
  id: "Rumah-rumah putih beratap datar dan bangunan putih panjang berarkade terletak di bawah batu-batu cokelat gundul yang dimahkotai benteng batu bermenara bundar, dengan laut biru tua dan langit cerah di belakangnya."
