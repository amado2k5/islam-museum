summary:
  ar: "تُظهر الصورة مدينة مسقط القديمة، وبيوتها البيضاء أسفل قلعة على الصخور عند حافة البحر. صورة التقطها Leon Petrosyan سنة 2020، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the old city of Muscat, its white houses below a fort on the rocks at the edge of the sea. Photograph by Leon Petrosyan, 2020, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں مسقط کا پرانا شہر دکھائی دیتا ہے، اس کے سفید مکانات سمندر کے کنارے چٹانوں پر واقع ایک قلعے کے نیچے ہیں۔ تصویر: Leon Petrosyan، 2020ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre la vieille ville de Mascate, ses maisons blanches au pied d'un fort perché sur les rochers au bord de la mer. Photographie : Leon Petrosyan, 2020, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra la ciudad vieja de Mascate, con sus casas blancas bajo un fuerte sobre las rocas al borde del mar. Fotografía de Leon Petrosyan, 2020, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Maskat'ın eski şehrini, beyaz evleriyle denizin kıyısındaki kayalıklar üzerindeki bir kalenin altında gösteriyor. Fotoğraf: Leon Petrosyan, 2020; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan kota tua Muskat, dengan rumah-rumah putihnya di bawah sebuah benteng di atas bebatuan di tepi laut. Foto oleh Leon Petrosyan, 2020, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
