alt:
  ar: "سلسلة من أربع عقد: كتب الميقات والهيئة التي قرأها الجبرتي، ومجموعته من الأسطرلابات والأرباع وآلات الارتفاع، وحرفيو بيته، ثم «الآلة المربعة لمعرفة الجهات والسمت»؛ لا تفاصيل هندسية للآلة نفسها."
  en: "A four-node chain: the timekeeping and astronomy texts al-Jabarti read, his collection of astrolabes, quadrants and altitude instruments, the craftsmen of his house, then 'the square instrument for finding directions and azimuth'; no geometric details of the instrument itself."
  ur: "چار نوڈز کا سلسلہ: الجبرتی کی پڑھی میقات اور فلکیات کی کتابیں، ان کا اسطرلاب، چہار اور بلندی کے آلات کا مجموعہ، ان کے گھر کے کاریگر، پھر «سمتیں اور سمتِ افق جاننے کے لیے مربع آلہ»؛ آلہ کی کوئی ہندسی تفصیل نہیں۔"
