summary:
  ar: "سلسلة تعليمية تبين بيئة الجبرتي الفلكية-الحرفية والآلات التي جمعها، ثم سطر الترجمة الذي يسمّي «الآلة المربعة»؛ لا تعيد بناء الآلة ولا تثبت انتشارها."
  en: "Teaching chain showing al-Jabarti's astronomical-craft milieu and the instruments he collected, then the obituary line naming 'the square instrument'; it does not reconstruct the instrument or prove its spread."
  ur: "تدریسی سلسلہ جو الجبرتی کے فلکیاتی اور دستکاری کے ماحول اور ان کے جمع کردہ آلات دکھاتا ہے، پھر «مربع آلہ» کو نام دینے والی ترجمے کی سطر؛ یہ آلہ کی تکمیل نہیں کرتا نہ اس کے پھیلاؤ کو ثابت کرتا ہے۔"
