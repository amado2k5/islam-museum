summary:
  ar: "تُظهر الصورة مدينة عدن القديمة، التي تصفها صفحة الملف بأنها واقعة في فوهة بركان خامد، وفيها مسجد أبيض بمئذنتين أمام الجدار الصخري الداكن. صورة التقطها Jialiang Gao في سبتمبر 1999، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the old town of Aden, which its file page describes as lying in the crater of an extinct volcano, with a white mosque and its two minarets before the dark rock wall. Photograph by Jialiang Gao, September 1999, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں عدن کا پرانا شہر دکھائی دیتا ہے، جسے اس کے فائل کا صفحہ ایک بجھے ہوئے آتش فشاں کے دہانے میں واقع بتاتا ہے، اور تاریک چٹانی دیوار کے سامنے دو میناروں والی ایک سفید مسجد ہے۔ تصویر: Jialiang Gao، ستمبر 1999ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre la vieille ville d'Aden, que la page de son fichier décrit comme située dans le cratère d'un volcan éteint, avec une mosquée blanche et ses deux minarets devant la paroi rocheuse sombre. Photographie : Jialiang Gao, septembre 1999, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra la ciudad vieja de Adén, que la página de su archivo describe como situada en el cráter de un volcán extinto, con una mezquita blanca y sus dos minaretes ante la pared de roca oscura. Fotografía de Jialiang Gao, septiembre de 1999, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, dosya sayfasının sönmüş bir yanardağın kraterinde yer aldığını belirttiği Aden'in eski şehrini, koyu kaya duvarının önünde iki minareli beyaz bir camiyle birlikte gösteriyor. Fotoğraf: Jialiang Gao, Eylül 1999; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan kota tua Aden, yang oleh halaman berkasnya digambarkan terletak di kawah gunung berapi yang sudah padam, dengan masjid putih dan kedua menaranya di depan dinding batu yang gelap. Foto oleh Jialiang Gao, September 1999, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
