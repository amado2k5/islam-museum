alt:
  ar: "مسجد أبيض بمئذنتين بيضاوين نحيلتين يقوم بين بيوت متلاصقة عند سفح جرف صخري داكن أجرد شديد الانحدار."
  en: "A white mosque with two slender white minarets stands among closely built houses at the foot of a steep, dark, bare rock face."
  ur: "دو پتلے سفید میناروں والی ایک سفید مسجد قریب قریب بنے مکانات کے بیچ ایک عمودی، تاریک، بنجر چٹانی دیوار کے دامن میں کھڑی ہے۔"
  fr: "Une mosquée blanche à deux minarets blancs élancés se dresse parmi des maisons serrées au pied d'une paroi rocheuse abrupte, sombre et nue."
  es: "Una mezquita blanca con dos esbeltos minaretes blancos se alza entre casas muy juntas al pie de una pared rocosa abrupta, oscura y desnuda."
  tr: "İki ince beyaz minareli beyaz bir cami, dik, koyu ve çıplak bir kaya yüzeyinin eteğinde sıkışık yapılı evlerin arasında duruyor."
  id: "Masjid putih dengan dua menara putih yang ramping berdiri di antara rumah-rumah yang dibangun rapat di kaki tebing batu yang curam, gelap, dan gundul."
