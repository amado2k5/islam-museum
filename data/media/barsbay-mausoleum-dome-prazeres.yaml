alt:
  ar: "ضريح حجري تعلوه قبة عالية منقوشة بزخرفة هندسية متشابكة، وإلى يمينه مئذنة نحيلة وأمامه شجرة، تحت سماء مضيئة فيها سحب رقيقة."
  en: "A stone mausoleum with a tall dome carved in an interlaced geometric pattern, a slim minaret to the right and a tree in front, under a bright sky with thin clouds."
  ur: "ایک پتھر کا مقبرہ جس پر بلند گنبد ہے جس پر باہم گندھا ہوا ہندسی نقش کندہ ہے، دائیں جانب پتلا مینار اور سامنے ایک درخت ہے، روشن آسمان تلے جس میں باریک بادل ہیں۔"
  fr: "Un mausolée de pierre à haute coupole sculptée d'un motif géométrique entrelacé, avec un mince minaret à droite et un arbre devant, sous un ciel lumineux traversé de minces nuages."
  es: "Un mausoleo de piedra con una alta cúpula tallada con un motivo geométrico entrelazado, un esbelto minarete a la derecha y un árbol delante, bajo un cielo luminoso con nubes finas."
  tr: "Birbirine geçmeli geometrik bir desenle oyulmuş yüksek kubbeli bir taş türbe; sağda ince bir minare, önünde bir ağaç var, ince bulutlu parlak bir gökyüzünün altında."
  id: "Mausoleum batu dengan kubah tinggi yang diukir pola geometris saling-jalin, sebuah menara ramping di sebelah kanan dan sebatang pohon di depannya, di bawah langit cerah dengan awan tipis."
