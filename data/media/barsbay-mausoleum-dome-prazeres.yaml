summary:
  ar: "تُظهر الصورة ضريح السلطان برسباي في المقبرة الشمالية بالقاهرة من جهة الشمال، وقبته الحجرية المنقوشة بزخرفة متشابكة بجانب مئذنة. صورة التقطها Robert Prazeres في 16 أكتوبر 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the mausoleum of Sultan Barsbay in Cairo's Northern Cemetery from the north, its stone dome carved with an interlaced pattern beside a minaret. Photograph by Robert Prazeres, 16 October 2012, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں قاہرہ کے شمالی قبرستان میں سلطان برسبائی کا مقبرہ شمال کی جانب سے دکھائی دیتا ہے، اس کا پتھر کا گنبد جس پر باہم گندھا ہوا نقش کندہ ہے ایک مینار کے برابر ہے۔ تصویر: Robert Prazeres، 16 اکتوبر 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre le mausolée du sultan Barsbay dans le cimetière du Nord du Caire, vu du nord, sa coupole de pierre sculptée d'un motif entrelacé à côté d'un minaret. Photographie : Robert Prazeres, 16 octobre 2012, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el mausoleo del sultán Barsbay en el Cementerio del Norte de El Cairo desde el norte, con su cúpula de piedra tallada con un motivo entrelazado junto a un minarete. Fotografía de Robert Prazeres, 16 de octubre de 2012, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Kahire'nin Kuzey Mezarlığı'ndaki Sultan Barsbay Türbesi'ni kuzeyden gösteriyor; birbirine geçmeli bir desenle oyulmuş taş kubbesi bir minarenin yanında duruyor. Fotoğraf: Robert Prazeres, 16 Ekim 2012; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan mausoleum Sultan Barsbay di Pemakaman Utara Kairo dilihat dari utara, dengan kubah batunya yang diukir pola saling-jalin di samping sebuah menara. Foto oleh Robert Prazeres, 16 Oktober 2012, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
