label:
  ar: "مسجد ومدرسة السلطان حسن بالقاهرة بجوار مسجد الرفاعي"
  en: "Mosque-Madrasa of Sultan Hasan, Cairo, beside the Rifa'i Mosque"
  ur: "مسجد و مدرسہ سلطان حسن، قاہرہ، مسجد رفاعی کے برابر"
  fr: "Mosquée-madrasa du sultan Hasan, Le Caire, à côté de la mosquée al-Rifa'i"
  es: "Mezquita-madrasa del sultán Hasan, El Cairo, junto a la mezquita al-Rifa'i"
