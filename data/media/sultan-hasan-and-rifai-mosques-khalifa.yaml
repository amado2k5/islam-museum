summary:
  ar: "تُظهر الصورة مسجدين كبيرين متجاورين في القاهرة، تسميهما صفحة الملف في ويكيميديا كومنز مسجد السلطان حسن ومسجد الرفاعي. صورة التقطها Batoul Khalifa في 12 أبريل 2017، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows two monumental mosques standing side by side in Cairo; its Commons file page names them as the mosque of Sultan Hasan and the Rifa'i Mosque. Photograph by Batoul Khalifa, 12 April 2017, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں قاہرہ کی دو عظیم الشان مسجدیں ساتھ ساتھ دکھائی دیتی ہیں؛ وکیمیڈیا کامنز پر اس کے فائل کے صفحے میں انہیں مسجد سلطان حسن اور مسجد رفاعی کا نام دیا گیا ہے۔ تصویر: Batoul Khalifa، 12 اپریل 2017ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre deux mosquées monumentales côte à côte au Caire ; la page du fichier sur Wikimedia Commons les nomme mosquée du sultan Hasan et mosquée al-Rifa'i. Photographie : Batoul Khalifa, 12 avril 2017, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra dos mezquitas monumentales una al lado de la otra en El Cairo; la página del archivo en Wikimedia Commons las nombra como la mezquita del sultán Hasan y la mezquita al-Rifa'i. Fotografía de Batoul Khalifa, 12 de abril de 2017, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Kahire'de yan yana duran iki anıtsal camiyi gösteriyor; Wikimedia Commons'taki dosya sayfası bunları Sultan Hasan Camii ve Rifai Camii olarak adlandırıyor. Fotoğraf: Batoul Khalifa, 12 Nisan 2017; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan dua masjid monumental yang berdiri berdampingan di Kairo; halaman berkasnya di Wikimedia Commons menyebutnya masjid Sultan Hasan dan Masjid Rifa'i. Foto oleh Batoul Khalifa, 12 April 2017, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
