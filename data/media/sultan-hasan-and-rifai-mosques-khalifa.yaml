alt:
  ar: "مسجدان حجريان كبيران متجاوران، لكل منهما قبة كبيرة ومآذن عالية، وأمامهما مبانٍ أصغر ذات قباب، وخلفهما أفق مدينة حديثة يغشاه الضباب."
  en: "Two monumental stone mosques stand side by side, each with a large dome and tall minarets, with smaller domed buildings in front and a hazy modern city skyline behind."
  ur: "دو عظیم الشان پتھر کی مسجدیں ساتھ ساتھ کھڑی ہیں، ہر ایک پر بڑا گنبد اور بلند مینار ہیں، سامنے گنبد والی چھوٹی عمارتیں ہیں اور پیچھے دھند میں لپٹا جدید شہر کا افق ہے۔"
  fr: "Deux mosquées monumentales de pierre se dressent côte à côte, chacune avec une grande coupole et de hauts minarets, avec des bâtiments plus petits à coupole devant et, derrière, l'horizon brumeux d'une ville moderne."
  es: "Dos mezquitas monumentales de piedra se alzan una junto a la otra, cada una con una gran cúpula y altos minaretes, con edificios más pequeños con cúpula delante y, detrás, el horizonte brumoso de una ciudad moderna."
  tr: "İki anıtsal taş cami yan yana duruyor; her birinin büyük bir kubbesi ve yüksek minareleri var, önlerinde daha küçük kubbeli yapılar, arkalarında ise puslu modern bir şehir silueti bulunuyor."
  id: "Dua masjid batu monumental berdiri berdampingan, masing-masing dengan kubah besar dan menara tinggi, dengan bangunan berkubah yang lebih kecil di depannya dan cakrawala kota modern yang berkabut di belakangnya."
