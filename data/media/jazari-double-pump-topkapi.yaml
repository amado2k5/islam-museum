summary:
  ar: "إعادة إنتاج لرسم مخطوط قديم، منشور في الشكل 6 من مقالة الحساني، يظهر الدولاب والتروس والمكبسين وقنوات الماء؛ ليس النموذج الرقمي الحديث في الشكل التالي."
  en: "Reproduction of medieval manuscript art published as figure 6 of al-Hassani's survey, showing wheel, gearing, paired pistons and water channels; not the modern digital model in the next figure."
  ur: "الحسنی کے جائزے کے شکل 6 میں قدیم مخطوطے کی نقل؛ پہیہ، گیئر، دو پسٹن اور پانی کی راہیں۔ اگلی شکل کا جدید ڈیجیٹل ماڈل نہیں۔"
  es: "Reproducción de un manuscrito medieval publicado como figura 6 del estudio de al-Hassani, que muestra la rueda, el engranaje, los pistones emparejados y los canales de agua; no se trata del modelo digital moderno de la siguiente figura."
  fr: "Reproduction d'un dessin de manuscrit médiéval publié comme figure 6 de l'étude d'al-Hassani, montrant une roue, un engrenage, des pistons jumelés et des canaux d'eau; et non le modèle numérique moderne de la figure suivante."
  tr: "El-Hassani'nin makalesinin 6. Şeklinde yayınlanan, tekerleği, dişlileri, pistonları ve su kanallarını gösteren eski bir el yazması çiziminin reprodüksiyonu; aşağıdaki şekildeki modern dijital model değil."
  id: "Reproduksi gambar manuskrip lama, yang diterbitkan pada Gambar 6 artikel Al-Hassani, menunjukkan roda, roda gigi, piston, dan saluran air; bukan model digital modern pada gambar berikut."
