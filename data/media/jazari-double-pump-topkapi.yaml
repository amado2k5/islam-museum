alt:
  ar: "رسم مخطوط بألوان بنية وحمراء وزرقاء: دولاب ذو ألواح يساراً، وترس رأسي يتعشق مع ترس أفقي، وقضيب مائل يصل حركة الترس بمكبسين متقابلين، وأنبوب مقوس يصعد بالماء. حروف عربية عند الأجزاء."
  en: "Brown, red and blue manuscript drawing: a paddle wheel at left, a vertical gear engaging a horizontal gear, an inclined rod linking the gear's motion to opposed pistons, and an arched rising water pipe; Arabic letters mark components."
  ur: "بھورے، سرخ اور نیلے رنگ کا مخطوطی نقشہ: بائیں تختوں والا پہیہ، افقی گیئر سے جڑا عمودی گیئر، ترچھا ڈنڈا حرکت کو مقابل پسٹنوں تک لاتا، اور پانی اوپر لے جانے والی خم دار نالی؛ اجزا پر عربی حروف۔"
