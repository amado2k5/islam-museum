  "ar": "صفحتان من مصحف بالخط البهاري مع شرح فارسي، المكتبة الوطنية الفرنسية عربي ٧٢٦٠"
  "en": "Double page from a Qur'an in Bihari script with Persian commentary, BnF Arabe 7260"
  "ur": "بہاری خط میں قرآن کے دو صفحے فارسی تفسیر کے ساتھ، فرانسیسی قومی کتب خانہ عربی ۷۲۶۰"
"summary":
  "ar": "صورة لصفحتين، ص ٣٧٠-٣٧١، من مصحف بالخط البهاري مع شرح فارسي بالنسخي في الهوامش، مقاسه ٤٥ في ٣٥ سم، الهند، القرن السادس عشر، المكتبة الوطنية الفرنسية، المخطوطات الشرقية، عربي ٧٢٦٠، كما تذكر صفحة الملف. تخدم مثالًا على الخط البهاري الثقيل الطابع الذي كُتبت به مصاحف الهند بين القرنين الرابع عشر ومطلع السادس عشر، بأطراف حروف حادة كالسيوف ومسافات واسعة بين الكلمات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a double page, pp. 370-371, of a Qur'an in bihari script with Persian commentary in naskhi in the margins, 45 by 35 cm, India, 16th century, Bibliothèque nationale de France, Manuscrits orientaux, arabe 7260, as the file page states. It serves as an example of Bihari, the weighty hand of Indian mushafs of the fourteenth to early sixteenth centuries, with sharp, sword-like letter ends and wide word spacing. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "بہاری خط میں قرآن کے دو صفحوں، ص ۳۷۰-۳۷۱، کی تصویر جس کے حاشیوں میں نسخی میں فارسی تفسیر ہے، ۴۵ ضرب ۳۵ سینٹی میٹر، ہندوستان، سولھویں صدی، فرانسیسی قومی کتب خانہ، مشرقی مخطوطات، عربی ۷۲۶۰، جیسا فائل کا صفحہ بتاتا ہے۔ یہ بہاری خط کی مثال ہے، ہندوستانی مصاحف کا بھاری خط، جو چودھویں سے سولہویں صدی کے آغاز تک رائج رہا، جس میں حروف کے سرے تلوار کی طرح تیز اور الفاظ کے درمیان فاصلہ کھلا ہوتا ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
