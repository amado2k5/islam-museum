summary:
  ar: "سلسلة تعليمية تبين الإسقاط السٹیریوگرافک المعتاد حول قطب ثم إسقاط المزي المختلط حول القطبين؛ لا ترسم شبكة ولا تعيد بناء الأسطرلاب."
  en: "Teaching chain from the usual stereographic projection about one pole to al-Mizzi's mixed projection about both poles; it draws no rete and rebuilds no astrolabe."
  ur: "تدریسی سلسلہ جو ایک قطب کے گرد معیاری سٹیریوگرافک نقشے سے دونوں قطبوں کے گرد المزی کے ملے ہوئے سٹیریوگرافک پروجیکشن تک جاتا ہے؛ نہ جالی بناتا ہے نہ اسطرلاب دوبارہ بناتا ہے۔"
  es: "Enseña una cadena desde la proyección estereográfica habitual alrededor de un polo hasta la proyección mixta de al-Mizzi alrededor de ambos polos; no dibuja ninguna red ni reconstruye ningún astrolabio."
  fr: "Chaîne d'enseignement allant de la projection stéréographique habituelle autour d'un pôle à la projection mixte d'al-Mizzi autour des deux pôles; elle ne dessine aucun rete et ne reconstruit aucun astrolabe."
  tr: "Bu eğitici seri, önce bir kutup etrafında yapılan olağan stereografik projeksiyonu, ardından her iki kutup etrafında yapılan karma projeksiyonu göstermektedir; ızgara çizmeyin ve usturlabı yeniden oluşturmayın."
  id: "Seri edukatif yang menunjukkan proyeksi stereografik biasa di sekitar satu kutub dan kemudian proyeksi campuran di sekitar kedua kutub; tidak menggambar kisi-kisi dan tidak merekonstruksi astrolabe."
