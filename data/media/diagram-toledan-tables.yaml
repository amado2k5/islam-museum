summary:
  ar: "سلسلة تعليمية تبين رصد الزرقالي في طليطلة، جداول طليطلة المنسوبة إليه وإلى مدرسته، ثم الجداول الألفونسية اللاتينية التي بنت عليها؛ لا تثبت نسبة كل عالم ولا أسبقية للجداول."
  en: "A teaching chain showing al-Zarqali's observation at Toledo, the Toledan Tables attributed to him and his school, then the Latin Alfonsine Tables built on them; it proves neither each scholar's share nor priority for tables."
  ur: "تدریسی سلسلہ: زرقالی کا طلیطلہ میں رصد، ان اور ان کے مکتب سے منسوب جداولِ طلیطلہ، پھر ان پر مبنی لاطینی الفونسین جداول؛ نہ ہر عالم کا حصہ ثابت کرتا ہے نہ جداول کی سبقت۔"
  es: "Una cadena de enseñanza que muestra la observación de al-Zarqali en Toledo, las Tablas de Toledo que se le atribuyen a él y a su escuela, y luego las Tablas Alfonsinas Latinas construidas sobre ellas; no prueba ni la participación de cada erudito ni la prioridad de las tablas."
  fr: "Une chaîne d'enseignement montrant l'observation d'al-Zarqali à Tolède, les Tables de Tolède qui lui sont attribuées ainsi qu'à son école, puis les Tables latines alphonsines construites sur celles-ci; elle ne prouve ni la part de chaque érudit ni la priorité des tables."
