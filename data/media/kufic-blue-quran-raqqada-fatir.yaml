"label":
  "ar": "ورقة من المصحف الأزرق، متحف رقادة الوطني للفن الإسلامي"
  "en": "Blue Qur'an folio, Raqqada National Museum of Islamic Art"
  "ur": "نیلے مصحف کا ورق، رقادہ قومی عجائب گھر برائے اسلامی فن"
"summary":
  "ar": "صورة لورقة من المصحف الأزرق بالخط الكوفي، مقاسها ٣١ في ٤١ سم، في متحف رقادة الوطني للفن الإسلامي، رقم Rutbi 196، تؤرخها صفحة الملف بالقرن العاشر. وتذكر الصفحة أنها تحمل الآيات الأولى من سورة فاطر. تخدم مثالًا واضحًا على الخط الكوفي الزاوي المتباعد الذي كُتبت به المصاحف الأولى، للمقارنة بالخطوط المتصلة اللاحقة. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a folio from the Blue Qur'an in Kufic script, 31 by 41 cm, in the Raqqada National Museum of Islamic Art, Rutbi 196, dated by the file page to the 10th century. The file page says it carries the opening verses of the chapter Fatir. It serves as a clear example of the angular, widely spaced Kufic hand used for early mushaf copies, for comparison with the later cursive scripts. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "نیلے مصحف کے ایک ورق کی تصویر، کوفی خط میں، ۳۱ ضرب ۴۱ سینٹی میٹر، رقادہ کے قومی عجائب گھر برائے اسلامی فن، Rutbi 196؛ فائل کا صفحہ اسے دسویں صدی سے منسوب کرتا ہے اور کہتا ہے کہ اس میں سورۂ فاطر کی ابتدائی آیات ہیں۔ یہ زاویہ دار اور کھلے فاصلوں والے کوفی خط کی واضح مثال ہے جس میں ابتدائی مصاحف لکھے گئے، تاکہ بعد کے رواں خطوط سے موازنہ ہو سکے۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
