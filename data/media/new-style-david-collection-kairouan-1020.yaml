"summary":
  "ar": "صورة التقطها ريتشارد مورتل في ٢٩ حزيران ٢٠١٧ لنسخة من المصحف على الرق في مجموعة ديفيد بكوبنهاغن، يقول عنوان الملف إنها مكتوبة بالكوفي المشرقي، القيروان، تونس، سنة ١٠٢٠م. ولا تضيف صفحة الملف وصفًا آخر. تخدم مثالًا على الخط الجديد المسمّى تقليديًا الكوفي المشرقي، بحروفه القائمة المستقيمة والتباين الحاد بين الغليظ والرقيق. الصورة على ويكيميديا كومنز بترخيص CC BY 2.0، ويلزم نسبتها إلى Richard Mortel."
  "en": "A photograph, taken on 29 June 2017 by Richard Mortel, of a parchment copy of the Qur'an in the David Collection, Copenhagen, whose file title says it is written in Eastern Kufic, Kairouan, Tunisia, 1020. The file page gives no further description. It serves as an example of the new-style script, traditionally called eastern Kufic, with its upright letters and sharp contrast between thick and thin strokes. On Wikimedia Commons the file is licensed CC BY 2.0; attribution to Richard Mortel is required."
  "ur": "ڈیوڈ کلیکشن، کوپن ہیگن کے رق پر لکھے قرآن کی نقل کی تصویر، جو ریچرڈ مورٹل نے ۲۹ جون ۲۰۱۷ کو لی؛ فائل کے عنوان کے مطابق یہ مشرقی کوفی میں، قیروان، تیونس، ۱۰۲۰ء میں لکھی گئی۔ فائل کا صفحہ مزید تفصیل نہیں دیتا۔ یہ نئے طرز کے خط کی مثال ہے جسے روایتی طور پر مشرقی کوفی کہا جاتا ہے، جس میں سیدھے کھڑے حروف اور موٹی اور باریک لکیروں کا تیز فرق ہے۔ کامنز پر یہ فائل CC BY 2.0 لائسنس کے تحت ہے؛ Richard Mortel کی طرف نسبت ضروری ہے۔"
  "es": "Fotografía tomada el 29 de junio de 2017 por Richard Mortel de una copia en pergamino del Corán perteneciente a la Colección David de Copenhague. El título del archivo indica que está escrita en escritura cúfica oriental y data de Kairouan, Túnez, en el año 1020. La página del archivo no ofrece más detalles. La imagen sirve como ejemplo de la escritura de estilo nuevo, tradicionalmente denominada cúfica oriental, caracterizada por sus letras verticales y el marcado contraste entre trazos gruesos y finos. En Wikimedia Commons, el archivo está bajo la licencia CC BY 2.0; se requiere la atribución a Richard Mortel."
  "fr": "Photographie prise le 29 juin 2017 par Richard Mortel, d'un exemplaire du Coran sur parchemin conservé à la Collection David de Copenhague. Le titre de la fiche indique qu'il est écrit en coufique oriental, à Kairouan (Tunisie), en 1020. La page de la fiche ne fournit aucune autre description. Cet exemplaire illustre le style d'écriture coufique oriental, caractérisé par ses lettres droites et le contraste marqué entre les traits épais et fins. Sur Wikimedia Commons, le fichier est sous licence CC BY 2.0; la mention de Richard Mortel est requise."
  "tr": "Richard Mortel tarafından 29 Haziran 2017'de çekilen, Kopenhag'daki David Koleksiyonu'nda bulunan parşömen üzerine yazılmış bir Kur'an el yazmasının fotoğrafı. Dosya başlığında, el yazmasının Doğu Kufi yazısıyla, Kayrevan, Tunus, 1020 yılında yazıldığı belirtiliyor. Dosya sayfasında daha fazla açıklama bulunmuyor. Dik, düz harfleri ve kalın ve ince çizgiler arasındaki keskin kontrastıyla geleneksel olarak Doğu Kufi olarak adlandırılan yeni yazı stilinin bir örneği olarak hizmet ediyor. Görsel, Wikimedia Commons'ta CC BY 2.0 lisansı altında yer almaktadır ve Richard Mortel'e atıfta bulunulmasını gerektirmektedir."
  "id": "Foto yang diambil oleh Richard Mortel pada 29 Juni 2017, menampilkan manuskrip Al-Qur'an di atas perkamen dalam Koleksi David di Kopenhagen. Judul berkas menyatakan bahwa manuskrip tersebut ditulis dalam aksara Kufi Timur, Kairouan, Tunisia, 1020 M. Halaman berkas tidak memberikan deskripsi lebih lanjut. Foto ini berfungsi sebagai contoh aksara baru yang secara tradisional disebut Kufi Timur, dengan huruf-hurufnya yang tegak dan lurus serta kontras yang tajam antara goresan tebal dan tipis. Gambar tersebut berada di Wikimedia Commons di bawah lisensi CC BY 2.0 dan memerlukan atribusi kepada Richard Mortel."
