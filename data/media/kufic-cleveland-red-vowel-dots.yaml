  "en": "Kufic Qur'an folio, Cleveland Museum of Art: red vowel dots, gold verse markers"
  "ur": "کوفی مصحف کا ورق، کلیولینڈ میوزیم آف آرٹ: سرخ حرکات کے نقطے، سنہری آیت نشان"
"summary":
  "ar": "صورة لورقة مصحف من متحف كليفلاند للفنون، رقم 1933.493.b، تؤرخها صفحة الملف بنحو سنة ٨٠٠م. ويقول نص المتحف إنها مكتوبة بأقدم أساليب الخط العربي المسمى الكوفي والمستعمل في أقدم النسخ الباقية، وإن الصفحة العريضة تلائم الخط ذا الأفقيات الممتدة، وإن الحركات تُبيَّن بنقاط حمراء، وإن مثلثات من نقاط ذهبية تعلّم نهاية كل آية. تخدم مثالًا واضحًا على الخط الكوفي الزاوي المتباعد الذي كُتبت به المصاحف الأولى، للمقارنة بالخطوط المتصلة اللاحقة. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of a Qur'an folio of the Cleveland Museum of Art, 1933.493.b, dated by the file page to about 800 CE. The museum's text says it is written in the oldest style of Arabic calligraphy, called Kufic, used in the earliest surviving copies; that the wide page suits elongated, horizontal strokes; that vowels are indicated by red dots; and that triangles of gold dots mark the end of each verse. It serves as a clear example of the angular, widely spaced Kufic hand used for early mushaf copies, for comparison with the later cursive scripts. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "کلیولینڈ میوزیم آف آرٹ کے ایک مصحفی ورق، 1933.493.b، کی تصویر جسے فائل کا صفحہ تقریباً ۸۰۰ء سے منسوب کرتا ہے۔ عجائب گھر کی عبارت کہتی ہے کہ یہ عربی خطاطی کے قدیم ترین اسلوب، کوفی، میں لکھا ہے جو بچ رہنے والی ابتدائی نقلوں میں برتا گیا؛ چوڑا صفحہ لمبی افقی لکیروں کے خط کے مناسب ہے؛ حرکات سرخ نقطوں سے ظاہر کی گئی ہیں؛ اور سنہری نقطوں کے مثلث ہر آیت کے اختتام کی علامت ہیں۔ یہ زاویہ دار اور کھلے فاصلوں والے کوفی خط کی واضح مثال ہے جس میں ابتدائی مصاحف لکھے گئے، تاکہ بعد کے رواں خطوط سے موازنہ ہو سکے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
