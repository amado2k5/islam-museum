summary:
  ar: "سلسلة تعليمية تبين انتقال فصل الظهور والاختفاء بشعاع الشمس إلى الملخص العربي للفرغاني ثم إلى ترجماته اللاتينية؛ لا تثبت صحة كل بُعد elongation ولا تاريخ الرصد."
  en: "A teaching chain showing the chapter on rising, setting and concealment in the sun's rays passing into al-Farghani's Arabic summary and its Latin translations; it proves neither the correctness of every elongation figure nor an observing date."
