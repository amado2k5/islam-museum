summary:
  ar: "تُظهر الصورة المنشآت المائية التاريخية في شوشتر، وهي تستر في المصادر العربية، والماء ينحدر من قنوات في الصخر إلى بركة فيروزية. صورة التقطها Iman Yari في 7 أبريل 2014، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the historical hydraulic system of Shushtar, the Tustar of the Arabic sources, with water falling from channels in the rock into a turquoise pool. Photograph by Iman Yari, 7 April 2014, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں شوشتر کی تاریخی آبی تنصیبات دکھائی دیتی ہیں، جو عربی مصادر میں تستر ہے، اور پانی چٹان کی نہروں سے فیروزی تالاب میں گر رہا ہے۔ تصویر: Iman Yari، 7 اپریل 2014ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre le système hydraulique historique de Shushtar, le Tustar des sources arabes, avec de l'eau tombant de canaux creusés dans la roche dans un bassin turquoise. Photographie : Iman Yari, 7 avril 2014, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el sistema hidráulico histórico de Shushtar, el Tustar de las fuentes árabes, con agua que cae desde canales de la roca a una poza turquesa. Fotografía de Iman Yari, 7 de abril de 2014, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Arapça kaynaklardaki Tüster olan Şuşter'in tarihî su yapılarını, kayadaki kanallardan turkuaz bir havuza dökülen suyla birlikte gösteriyor. Fotoğraf: Iman Yari, 7 Nisan 2014; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan sistem hidrolik bersejarah Shushtar, yaitu Tustar dalam sumber-sumber berbahasa Arab, dengan air yang jatuh dari saluran di batu ke kolam berwarna pirus. Foto oleh Iman Yari, 7 April 2014, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
