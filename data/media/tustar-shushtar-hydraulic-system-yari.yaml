depicts: [place/tustar]
alt:
  ar: "منظر واسع الزاوية لحوض صخري تنصبّ فيه شلالات صغيرة عدة من فتحات في جروف من الحجر الرملي إلى بركة فيروزية، وحوله مصاطب حجرية ومبانٍ قديمة للطواحين، تحت سماء مرقّطة بسحب صغيرة."
  en: "A wide-angle view into a rocky basin where several small waterfalls pour from openings in sandstone cliffs into a turquoise pool, with stone platforms and old mill buildings around it, under a sky dappled with small clouds."
  ur: "ایک چٹانی حوض کا وسیع زاویے والا منظر جس میں ریتیلے پتھر کی چٹانوں کے سوراخوں سے کئی چھوٹی آبشاریں فیروزی تالاب میں گر رہی ہیں، اس کے گرد پتھر کے چبوترے اور پن چکیوں کی پرانی عمارتیں ہیں، چھوٹے بادلوں سے نقطہ دار آسمان تلے۔"
  fr: "Une vue grand-angle sur une cuvette rocheuse où plusieurs petites cascades se déversent d'ouvertures dans des falaises de grès dans un bassin turquoise, avec des plates-formes de pierre et d'anciens bâtiments de moulins tout autour, sous un ciel moucheté de petits nuages."
  es: "Una vista gran angular de una cuenca rocosa donde varias pequeñas cascadas vierten desde aberturas en acantilados de arenisca a una poza turquesa, con plataformas de piedra y antiguos edificios de molinos alrededor, bajo un cielo moteado de pequeñas nubes."
  tr: "Kumtaşı kayalıklardaki açıklıklardan birkaç küçük şelalenin turkuaz bir havuza aktığı kayalık bir havzanın geniş açılı görünümü; çevresinde taş platformlar ve eski değirmen yapıları var, küçük bulutlarla benekli bir gökyüzünün altında."
  id: "Pemandangan sudut lebar ke dalam cekungan berbatu tempat beberapa air terjun kecil mengalir dari celah tebing batu pasir ke kolam pirus, dengan peron batu dan bangunan kincir tua di sekelilingnya, di bawah langit yang berbintik awan kecil."
