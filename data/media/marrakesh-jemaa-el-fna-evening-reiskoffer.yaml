depicts: [place/marrakesh]
alt:
  ar: "ساحة مكشوفة كبيرة مليئة بأشخاص صغار وأكشاك ومظلات في ضوء المساء الدافئ، تحدّها مبانٍ منخفضة مائلة إلى الحمرة، وفي الأفق مئذنتان مربعتان وجبال بعيدة."
  en: "A large open square full of small figures, market stalls and parasols in warm evening light, bordered by low reddish buildings, with two square minarets and distant mountains on the horizon."
  ur: "ایک بڑا کھلا میدان جو چھوٹے چھوٹے افراد، بازار کی دکانوں اور چھتریوں سے بھرا ہے، شام کی گرم روشنی میں، اطراف میں سرخی مائل پست عمارتیں ہیں، اور افق پر دو چوکور مینار اور دور کے پہاڑ ہیں۔"
  fr: "Une grande place ouverte pleine de petites silhouettes, d'étals de marché et de parasols dans la lumière chaude du soir, bordée de bâtiments bas rougeâtres, avec deux minarets carrés et des montagnes lointaines à l'horizon."
  es: "Una gran plaza abierta llena de pequeñas figuras, puestos de mercado y sombrillas bajo la cálida luz de la tarde, bordeada de edificios bajos rojizos, con dos minaretes cuadrados y montañas lejanas en el horizonte."
  tr: "Küçük insan figürleri, pazar tezgâhları ve şemsiyelerle dolu geniş açık bir meydan, akşamın sıcak ışığında; çevresinde alçak kırmızımsı yapılar, ufukta iki kare minare ve uzak dağlar var."
  id: "Alun-alun terbuka yang luas penuh dengan orang-orang kecil, kios pasar, dan payung dalam cahaya sore yang hangat, dikelilingi bangunan rendah kemerahan, dengan dua menara persegi dan pegunungan jauh di cakrawala."
