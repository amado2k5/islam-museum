summary:
  ar: "تُظهر الصورة ساحة جامع الفنا في مراكش في المساء، مزدحمة بالناس والأكشاك، وفي الأفق مآذن. صورة التقطها Donar Reiskoffer في 8 ديسمبر 2005، من ويكيميديا كومنز، بترخيص CC BY 3.0."
  en: "The photograph shows the Jemaa el-Fna square in Marrakesh in the evening, crowded with people and stalls, with minarets on the skyline. Photograph by Donar Reiskoffer, 8 December 2005, on Wikimedia Commons, licensed CC BY 3.0."
  ur: "تصویر میں مراکش کا میدان جامع الفنا شام کے وقت لوگوں اور دکانوں سے بھرا ہوا دکھائی دیتا ہے، اور افق پر مینار ہیں۔ تصویر: Donar Reiskoffer، 8 دسمبر 2005ء، وکیمیڈیا کامنز سے، لائسنس CC BY 3.0۔"
  fr: "La photographie montre la place Jemaa el-Fna à Marrakech le soir, pleine de monde et d'étals, avec des minarets à l'horizon. Photographie : Donar Reiskoffer, 8 décembre 2005, sur Wikimedia Commons, sous licence CC BY 3.0."
  es: "La fotografía muestra la plaza Jemaa el-Fna en Marrakech por la tarde, llena de gente y de puestos, con minaretes en el horizonte. Fotografía de Donar Reiskoffer, 8 de diciembre de 2005, en Wikimedia Commons, con licencia CC BY 3.0."
  tr: "Fotoğraf, Marakeş'teki Cemaa el-Fna Meydanı'nı akşam vakti, insanlar ve tezgâhlarla dolu halde, ufukta minarelerle birlikte gösteriyor. Fotoğraf: Donar Reiskoffer, 8 Aralık 2005; Wikimedia Commons, CC BY 3.0 lisansı."
  id: "Foto ini menampilkan alun-alun Jemaa el-Fna di Marrakesh pada waktu sore, ramai dengan orang dan kios, dengan menara-menara di cakrawala. Foto oleh Donar Reiskoffer, 8 Desember 2005, di Wikimedia Commons, berlisensi CC BY 3.0."
