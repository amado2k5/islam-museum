"label":
  "ar": "مصحف بخط مغربي بضبط أحمر، متحف القصبة، طنجة"
  "en": "Maghribi Qur'an with red vocalisation, Kasbah Museum, Tangier"
  "ur": "مغربی خط کا قرآن، سرخ اعراب، قصبہ عجائب گھر، طنجہ"
  "es": "Corán magrebí con vocalización roja, Museo Kasbah, Tánger"
  "fr": "Coran maghrébin à vocalisation rouge, Musée de la Kasbah, Tanger"
"summary":
  "ar": "صورة التقطت في ٢٦ شباط ٢٠٢٣ لمصحف في متحف القصبة بطنجة بالمغرب، تصفه صفحة الملف بأنه مخطوط على الرق بخط مغربي بلون المغرة البنية، وضبطه بالحبر الأحمر، من القرن الرابع عشر. تخدم مثالًا على الخط المغربي الحر في شمال أفريقيا والأندلس، وهو بلا نسب ثابتة ويغلب وجوده في المخطوطات. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph, taken on 26 February 2023, of a Qur'an in the Kasbah Museum of Tangier, Morocco, which the file page describes as a parchment manuscript stylised in Maghribi calligraphy in brown ochre, with vocalisation in red ink, 14th century. It serves as an example of the free-hand Maghribi script of North Africa and al-Andalus, which has no fixed proportions and is mostly found in manuscripts. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "طنجہ، مراکش کے قصبہ عجائب گھر کے ایک قرآن کی تصویر، ۲۶ فروری ۲۰۲۳ کی؛ فائل کا صفحہ اسے رق پر مخطوطہ بتاتا ہے جو بھورے گیرو رنگ میں مغربی خطاطی میں ہے اور اعراب سرخ سیاہی میں ہیں، چودھویں صدی۔ یہ شمالی افریقہ اور اندلس کے آزاد دست مغربی خط کی مثال ہے، جس کے تناسب مقرر نہیں اور جو زیادہ تر مخطوطات میں ملتا ہے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
  "es": "Fotografía tomada el 26 de febrero de 2023 de un Corán en el Museo de la Kasbah de Tánger, Marruecos. La página del archivo lo describe como un manuscrito en pergamino estilizado en caligrafía magrebí con ocre marrón y vocalizaciones en tinta roja, del siglo XIV. Sirve como ejemplo de la escritura magrebí a mano alzada del norte de África y al-Ándalus, que carece de proporciones fijas y se encuentra principalmente en manuscritos. Resulta útil para comprender la historia de la puntuación y la vocalización: permite al lector observar, en una página real, cómo se añadieron las marcas de vocales cortas al esqueleto consonántico mediante puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo está dedicado al dominio público bajo la licencia CC0."
  "fr": "Photographie prise le 26 février 2023 d'un Coran conservé au musée de la Kasbah à Tanger, au Maroc. La fiche descriptive indique qu'il s'agit d'un manuscrit sur parchemin, calligraphié en maghrébine à l'ocre brun, avec vocalisation à l'encre rouge, datant du XIVe siècle. Cet exemplaire illustre l'écriture maghrébine manuscrite d'Afrique du Nord et d'al-Andalus, caractérisée par des proportions variables et principalement présente dans les manuscrits. Il est utile pour comprendre l'évolution de la ponctuation et de la vocalisation: il permet d'observer, sur une seule page, comment les signes des voyelles brèves ont été ajoutés au squelette consonantique, d'abord sous forme de points colorés, puis sous forme de signes. Sur Wikimedia Commons, le fichier est placé dans le domaine public sous licence CC0."
