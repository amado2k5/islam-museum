  ar: "ثلاث خطوات: الوصية مجهولة «شيء»؛ تتبع ما يصير في أيدي الطرفين؛ ثم الجبر والمقابلة فيخرج الرقم. لا أرقام من المسألة الأصلية."
  en: "Three steps: the bequest as an unknown 'thing'; tracing what reaches each party's hands; then al-jabr and al-muqabala giving the number. No figures from the original problem."
