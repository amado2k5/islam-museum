label: { ar: "من الوصية المجهولة إلى جواب محلول", en: "From the unknown bequest to a solved answer", ur: "نامعلوم وصیت سے حل شدہ جواب تک", es: "Desde el legado desconocido hasta una respuesta resuelta", fr: "Du legs inconnu à la réponse résolue" }
summary:
  ar: "سلسلة تعليمية تبين كيف يجعل الخوارزمي الوصية «شيئاً» مجهولاً، يتتبع ما يصير في أيدي الزوجين والورثة، ثم يجبر ويقابل؛ لا ترسم المعادلة ولا تستبدل خطواته الأصلية."
  en: "Teaching chain showing how al-Khwarizmi makes the bequest an unknown 'thing', traces what reaches the spouses' and heirs' hands, then applies al-jabr and al-muqabala; it draws no equation and replaces none of his steps."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ خوارزمی وصیت کو مجہول «شیء» کیسے بناتے ہیں، دونوں فریقوں اور ورثاء کے ہاتھوں میں پہنچنے والا مال کیسے ٹریس کرتے ہیں، پھر جبر و مقابلہ کرتے ہیں؛ نہ مساوات بناتا ہے نہ ان کے مراحل بدلتا ہے۔"
  es: "Cadena de enseñanza que muestra cómo al-Juarismi convierte el legado en una \"cosa\" desconocida, rastrea lo que llega a manos de los cónyuges y herederos, y luego aplica al-jabr y al-muqabala; no traza ninguna ecuación ni reemplaza ninguno de sus pasos."
  fr: "Chaîne d'enseignement montrant comment al-Khwarizmi fait du legs une « chose » inconnue, retrace ce qui parvient aux mains des époux et des héritiers, puis applique al-jabr et al-muqabala; elle ne trace aucune équation et ne remplace aucune de ses étapes."
