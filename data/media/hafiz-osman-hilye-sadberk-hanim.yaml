  "en": "Hilye panel by Hafiz Osman, Sadberk Hanim Museum, about 1670"
  "ur": "حافظ عثمان کی حلیہ لوح، صادبرک ہانم میوزیم، تقریباً ۱۶۷۰ء"
"summary":
  "ar": "صورة لوحة حلية بخط الحافظ عثمان، متحف صادبرك هانم، نحو ١٦٧٠م، تصفها صفحة الملف بأنها وصف للنبي بخط النسخ، والبسملة بالريحاني، وآية من سورة الأنبياء قرب الأسفل بالثلث الجلي، ومقاسها ٥١ في ٤١ سم، وزخرفة المساحات الخالية من أوائل القرن العشرين. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a hilye panel by Hafiz Osman, Sadberk Hanim Museum, about 1670, which the file page describes as a description of the Prophet in naskh, with the basmala in rayhani and a verse from sura al-Anbiya near the bottom in jali thuluth, 51 by 41 cm, the decoration in the empty areas dating from the early twentieth century. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "حافظ عثمان کی ایک حلیہ لوح کی تصویر، صادبرک ہانم میوزیم، تقریباً ۱۶۷۰ء؛ فائل کا صفحہ اسے نسخ میں نبی کا حلیہ بتاتا ہے، بسم اللہ ریحانی میں اور سورۂ انبیاء کی ایک آیت نیچے کے قریب جلی ثلث میں، ۵۱ ضرب ۴۱ سینٹی میٹر، خالی جگہوں کی آرائش بیسویں صدی کے آغاز کی۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
