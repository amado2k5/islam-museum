summary:
  ar: "تُظهر الصورة أفق الإسكندرية عبر الميناء من قلعة قايتباي، وفي المقدمة فناء القلعة. صورة التقطها ASaber91 في 1 يوليو 2017، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the skyline of Alexandria across the harbour, seen from the Citadel of Qaitbay, with the citadel's courtyard in the foreground. Photograph by ASaber91, 1 July 2017, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں اسکندریہ کا افق بندرگاہ کے پار دکھائی دیتا ہے، جو قلعہ قایتبائی سے لیا گیا ہے، اور سامنے قلعے کا صحن ہے۔ تصویر: ASaber91، 1 جولائی 2017ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre l'horizon d'Alexandrie de l'autre côté du port, vu de la citadelle de Qaitbay, avec la cour de la citadelle au premier plan. Photographie : ASaber91, 1er juillet 2017, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra el horizonte de Alejandría al otro lado del puerto, visto desde la Ciudadela de Qaitbay, con el patio de la ciudadela en primer plano. Fotografía de ASaber91, 1 de julio de 2017, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, İskenderiye'nin silüetini limanın ötesinden, Kayıtbay Kalesi'nden görüldüğü gibi, ön planda kalenin avlusuyla birlikte gösteriyor. Fotoğraf: ASaber91, 1 Temmuz 2017; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan cakrawala Aleksandria di seberang pelabuhan, dilihat dari Benteng Qaitbay, dengan halaman dalam benteng di latar depan. Foto oleh ASaber91, 1 Juli 2017, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
