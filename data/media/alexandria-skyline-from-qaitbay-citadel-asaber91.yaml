depicts: [place/alexandria]
alt:
  ar: "في المقدمة فناء حجري له جدار ذو عقود وفيه نخيل وعشب وزوار يمشون؛ وخلف الجدار ميناء أزرق فيه قوارب صغيرة، وصف طويل من المباني العالية على الشاطئ تحت سماء صافية."
  en: "A stone courtyard with an arcaded wall, palms, lawns and visitors walking lies in the foreground; beyond the wall a blue harbour with small boats, and a long line of tall buildings along the shore under a clear sky."
  ur: "سامنے محرابوں والی دیوار، کھجور کے درخت، سبزہ زار اور چلتے ہوئے زائرین کے ساتھ ایک پتھر کا صحن ہے؛ دیوار کے پار چھوٹی کشتیوں والی نیلی بندرگاہ ہے، اور ساحل کے ساتھ بلند عمارتوں کی لمبی قطار ہے، صاف آسمان تلے۔"
  fr: "Une cour de pierre avec un mur à arcades, des palmiers, des pelouses et des visiteurs qui marchent se trouve au premier plan ; au-delà du mur, un port bleu avec de petits bateaux et une longue ligne de hauts immeubles le long du rivage sous un ciel dégagé."
  es: "En primer plano hay un patio de piedra con un muro de arcadas, palmeras, céspedes y visitantes que caminan; más allá del muro, un puerto azul con pequeñas embarcaciones y una larga línea de edificios altos a lo largo de la orilla bajo un cielo despejado."
  tr: "Ön planda revaklı bir duvarı, palmiyeleri, çimenlikleri ve yürüyen ziyaretçileri olan taş bir avlu yer alıyor; duvarın ötesinde küçük teknelerin bulunduğu mavi bir liman ve kıyı boyunca uzanan uzun bir yüksek bina sırası var, açık bir gökyüzünün altında."
  id: "Halaman batu dengan dinding berarkade, pohon palem, hamparan rumput, dan pengunjung yang berjalan berada di latar depan; di balik dinding terdapat pelabuhan biru dengan perahu-perahu kecil, dan deretan panjang gedung tinggi di sepanjang pantai di bawah langit cerah."
