summary:
  ar: "تُظهر الصورة الإيوان المذهّب عند المدخل والمئذنتين الذهبيتين في العتبة العلوية في النجف. صورة التقطها Arlo K. Abrahamson في 8 أبريل 2003، من ويكيميديا كومنز، وهي في الملك العام."
  en: "The photograph shows the gilded entrance iwan and the two golden minarets of the Imam Ali shrine in Najaf. Photograph by Arlo K. Abrahamson, 8 April 2003, on Wikimedia Commons, in the public domain."
  ur: "تصویر میں نجف میں حرم امام علی کا سونے سے مزین داخلی ایوان اور دو سنہری مینار دکھائی دیتے ہیں۔ تصویر: Arlo K. Abrahamson، 8 اپریل 2003ء، وکیمیڈیا کامنز سے، عوامی ملکیت میں۔"
  fr: "La photographie montre l'iwan d'entrée doré et les deux minarets dorés du sanctuaire de l'imam Ali à Nadjaf. Photographie : Arlo K. Abrahamson, 8 avril 2003, sur Wikimedia Commons, dans le domaine public."
  es: "La fotografía muestra el iwán de entrada dorado y los dos minaretes dorados del santuario del imam Ali en Náyaf. Fotografía de Arlo K. Abrahamson, 8 de abril de 2003, en Wikimedia Commons, en el dominio público."
  tr: "Fotoğraf, Necef'teki İmam Ali Türbesi'nin yaldızlı giriş eyvanını ve iki altın minaresini gösteriyor. Fotoğraf: Arlo K. Abrahamson, 8 Nisan 2003; Wikimedia Commons, kamu malı."
  id: "Foto ini menampilkan iwan pintu masuk yang bersepuh emas dan dua menara emas Makam Imam Ali di Najaf. Foto oleh Arlo K. Abrahamson, 8 April 2003, di Wikimedia Commons, domain publik."
