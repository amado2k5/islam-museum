alt:
  ar: "بوابة عالية ذات عقد مكسوّة بالذهب بين مئذنتين ذهبيتين، وعلى جانبيها جدران مكسوّة بالبلاط، وبين المئذنتين حبل من المصابيح، وأمامها بضعة أشخاص صغار يمشون، تحت سماء باهتة."
  en: "A tall arched portal covered in gold between two golden minarets, with tiled walls on either side, a string of lights between the minarets and a few small figures walking in front, under a pale sky."
  ur: "سونے سے ڈھکا ایک بلند محرابی پورٹل دو سنہری میناروں کے بیچ ہے، دونوں طرف ٹائل لگی دیواریں ہیں، میناروں کے بیچ روشنیوں کی لڑی ہے اور سامنے چند چھوٹے افراد چل رہے ہیں، ہلکے آسمان تلے۔"
  fr: "Un haut portail en arc recouvert d'or entre deux minarets dorés, avec des murs carrelés de chaque côté, une guirlande de lumières entre les minarets et quelques petites silhouettes qui marchent devant, sous un ciel pâle."
  es: "Un alto portal en arco cubierto de oro entre dos minaretes dorados, con muros de azulejos a cada lado, una cadena de luces entre los minaretes y unas pocas figuras pequeñas que caminan delante, bajo un cielo pálido."
  tr: "Altınla kaplı yüksek kemerli bir portal iki altın minarenin arasında duruyor; iki yanında çini kaplı duvarlar, minareler arasında bir ışık dizisi ve önde yürüyen birkaç küçük insan var, soluk bir gökyüzünün altında."
  id: "Portal tinggi berlengkung yang dilapisi emas di antara dua menara emas, dengan dinding berubin di kedua sisinya, untaian lampu di antara kedua menara, dan beberapa orang kecil berjalan di depannya, di bawah langit pucat."
