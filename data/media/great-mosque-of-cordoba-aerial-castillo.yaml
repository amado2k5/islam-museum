summary:
  ar: "تُظهر الصورة الجوية جامع قرطبة بين بيوت المدينة القديمة: صفوف سقوفه الطويلة وصحنه المزروع بالأشجار وبرجه. صورة التقطها Toni Castillo Quero في 21 مارس 2010، من ويكيميديا كومنز، بترخيص CC BY-SA 2.0."
  en: "The aerial photograph shows the Great Mosque of Córdoba among the houses of the old city: its rows of long roofs, its tree-planted courtyard and its tower. Photograph by Toni Castillo Quero, 21 March 2010, on Wikimedia Commons, licensed CC BY-SA 2.0."
  ur: "فضائی تصویر میں قرطبہ کی جامع پرانے شہر کے مکانات کے بیچ دکھائی دیتی ہے: اس کی لمبی چھتوں کی قطاریں، درختوں سے بھرا صحن اور اس کا برج۔ تصویر: Toni Castillo Quero، 21 مارچ 2010ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.0۔"
  fr: "La photographie aérienne montre la Grande Mosquée de Cordoue parmi les maisons de la vieille ville : ses rangées de longs toits, sa cour plantée d'arbres et sa tour. Photographie : Toni Castillo Quero, 21 mars 2010, sur Wikimedia Commons, sous licence CC BY-SA 2.0."
  es: "La fotografía aérea muestra la Gran Mezquita de Córdoba entre las casas de la ciudad antigua: sus filas de largos tejados, su patio plantado de árboles y su torre. Fotografía de Toni Castillo Quero, 21 de marzo de 2010, en Wikimedia Commons, con licencia CC BY-SA 2.0."
  tr: "Hava fotoğrafı, Kurtuba Camii'ni eski şehrin evlerinin arasında gösteriyor: uzun çatı sıraları, ağaç dikilmiş avlusu ve kulesi. Fotoğraf: Toni Castillo Quero, 21 Mart 2010; Wikimedia Commons, CC BY-SA 2.0 lisansı."
  id: "Foto udara ini menampilkan Masjid Kordoba di antara rumah-rumah kota tua: deretan atapnya yang panjang, halaman dalamnya yang ditanami pepohonan, dan menaranya. Foto oleh Toni Castillo Quero, 21 Maret 2010, di Wikimedia Commons, berlisensi CC BY-SA 2.0."
