alt:
  ar: "منظر جوي لمبنى مستطيل كبير جدًا له سقوف كثيرة متوازية من القرميد، وفي أحد طرفيه صحن مليء بالأشجار بجانب برج عالٍ، ومن وسطه يرتفع بناء أعلى يشبه الكنيسة، وتحيط به بيوت بيضاء متلاصقة."
  en: "Aerial view of a very large rectangular building with many parallel tiled roofs, a courtyard full of trees at one end beside a tall tower, and a taller church-like structure rising from its middle, surrounded by dense white houses."
  ur: "ایک بہت بڑی مستطیل عمارت کا فضائی منظر جس کی بہت سی متوازی کھپریل کی چھتیں ہیں، ایک سرے پر درختوں سے بھرا صحن ایک بلند برج کے ساتھ ہے، اور اس کے وسط سے گرجا نما ایک بلند تر عمارت اٹھتی ہے، اور اس کے گرد باہم جڑے سفید مکانات ہیں۔"
  fr: "Vue aérienne d'un très grand bâtiment rectangulaire aux nombreux toits de tuiles parallèles, avec une cour pleine d'arbres à une extrémité près d'une haute tour, et une structure plus haute, semblable à une église, qui s'élève en son milieu, entourée de maisons blanches serrées."
  es: "Vista aérea de un edificio rectangular muy grande con muchos tejados paralelos de teja, un patio lleno de árboles en un extremo junto a una alta torre, y una estructura más alta, parecida a una iglesia, que se eleva en su centro, rodeado de casas blancas muy juntas."
  tr: "Birçok paralel kiremitli çatısı olan çok büyük bir dikdörtgen yapının havadan görünümü; bir ucunda yüksek bir kulenin yanında ağaçlarla dolu bir avlu, ortasından yükselen daha yüksek kilise benzeri bir yapı var, çevresi sıkışık beyaz evlerle çevrili."
  id: "Pemandangan udara bangunan persegi panjang yang sangat besar dengan banyak atap genteng sejajar, halaman penuh pepohonan di salah satu ujungnya di samping menara tinggi, dan struktur yang lebih tinggi menyerupai gereja menjulang dari tengahnya, dikelilingi rumah-rumah putih yang rapat."
