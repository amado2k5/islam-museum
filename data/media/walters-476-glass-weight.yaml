alt:
  ar: "قرص زجاجي سميك أخضر مائل إلى الزرقة، مصوّر من أعلى على خلفية رمادية. في وسطه دائرة غائرة مختومة بنحو ستة أسطر من الكتابة العربية الكوفية البارزة، وحولها حافة مستديرة ناعمة فيها فقاعات هواء صغيرة وخدوش وبقعة متآكلة على يمينها."
  en: "A thick blue-green glass disc photographed from above against a grey background. In its centre is a sunken circle stamped with about six lines of raised Kufic Arabic script, surrounded by a smooth rounded rim with small air bubbles, scratches and a weathered patch on the right."
  ur: "سرمئی پس منظر پر اوپر سے کھینچی گئی نیلگوں سبز شیشے کی ایک موٹی ٹکیہ۔ اس کے بیچ میں ایک دبا ہوا دائرہ ہے جس پر ابھری ہوئی کوفی عربی تحریر کی تقریباً چھ سطریں مہر کی گئی ہیں، اور اس کے گرد ایک ہموار گول کنارہ ہے جس میں ہوا کے چھوٹے بلبلے، خراشیں اور دائیں جانب ایک گھسا ہوا حصہ ہے۔"
