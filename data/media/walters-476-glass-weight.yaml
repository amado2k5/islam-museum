label:
  ar: "صورة: صنجة رطل زجاجية أموية مختومة باسم الوليد بن عبد الرحمن، دمشق، 743م ⁦(متحف والترز 476)⁩"
  en: "Photo: an Umayyad glass pound weight stamped with the name of al-Walid ibn Abd al-Rahman, Damascus, 743 (Walters Art Museum 476)"
  ur: "تصویر: ولید بن عبد الرحمن کے نام کی مہر والا اموی شیشے کا رطل کا باٹ، دمشق، 743ء ⁦(والٹرز آرٹ میوزیم 476)⁩"
summary:
  ar: "صنجة زجاجية خضراء لوزن رطل، من بلاد الشام سنة 743م، عليها ختم يذكر الوليد بن عبد الرحمن، متولي بيت المال في دمشق، في عهد الخليفة يزيد الثالث. وهي مثال على الموازين الرسمية المختومة التي كانت تُختبر في الأسواق؛ ويذكر ابن الأخوة أن المحتسب يختم الأرطال الحديد بختمه ويغطي الصنج الحجرية بالجلد ويختمها {cite:maalim-qurba-edition-1976 p. 147}. ولا يقول مصدر إن هذه الصنجة بعينها صدرت عن محتسب."
  en: "A green glass pound weight from Syria, 743, stamped with an inscription naming al-Walid ibn Abd al-Rahman, head of the treasury at Damascus, under the caliph Yazid III. It is an example of the official stamped weights tested in the markets; Ibn al-Ukhuwwa says the muhtasib stamps iron ratls with his seal and has stone weights covered in leather and sealed {cite:maalim-qurba-edition-1976 p. 147}. No source says this weight itself was issued by a muhtasib."
  ur: "شام سے 743ء کا سبز شیشے کا رطل کا باٹ، جس پر ایک مہر ولید بن عبد الرحمن کا نام لیتی ہے، جو خلیفہ یزید ثالث کے دور میں دمشق کے بیت المال کے نگران تھے۔ یہ ان سرکاری مہر شدہ باٹوں کی ایک مثال ہے جو بازاروں میں جانچے جاتے تھے؛ ابن الاخوہ لکھتے ہیں کہ محتسب لوہے کے رطلوں پر اپنی مہر لگاتا اور پتھر کے باٹوں پر چمڑا چڑھا کر مہر لگواتا تھا {cite:maalim-qurba-edition-1976 p. 147}۔ کوئی مأخذ یہ نہیں کہتا کہ یہ باٹ خود کسی محتسب نے جاری کیا۔"
