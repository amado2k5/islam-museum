summary:
  ar: "صنجة زجاجية خضراء لوزن رطل، من بلاد الشام سنة 743م، عليها ختم يذكر الوليد بن عبد الرحمن، متولي بيت المال في دمشق، في عهد الخليفة يزيد الثالث. وهي مثال على الموازين الرسمية المختومة التي كانت تُختبر في الأسواق؛ ويذكر ابن الأخوة أن المحتسب يختم الأرطال الحديد بختمه ويغطي الصنج الحجرية بالجلد ويختمها {cite:maalim-qurba-edition-1976 p. 147}. ولا يقول مصدر إن هذه الصنجة بعينها صدرت عن محتسب."
  en: "A green glass pound weight from Syria, 743, stamped with an inscription naming al-Walid ibn Abd al-Rahman, head of the treasury at Damascus, under the caliph Yazid III. It is an example of the official stamped weights tested in the markets; Ibn al-Ukhuwwa says the muhtasib stamps iron ratls with his seal and has stone weights covered in leather and sealed {cite:maalim-qurba-edition-1976 p. 147}. No source says this weight itself was issued by a muhtasib."
  ur: "شام سے 743ء کا سبز شیشے کا رطل کا باٹ، جس پر ایک مہر ولید بن عبد الرحمن کا نام لیتی ہے، جو خلیفہ یزید ثالث کے دور میں دمشق کے بیت المال کے نگران تھے۔ یہ ان سرکاری مہر شدہ باٹوں کی ایک مثال ہے جو بازاروں میں جانچے جاتے تھے؛ ابن الاخوہ لکھتے ہیں کہ محتسب لوہے کے رطلوں پر اپنی مہر لگاتا اور پتھر کے باٹوں پر چمڑا چڑھا کر مہر لگواتا تھا {cite:maalim-qurba-edition-1976 p. 147}۔ کوئی مأخذ یہ نہیں کہتا کہ یہ باٹ خود کسی محتسب نے جاری کیا۔"
  es: "Una pesa de vidrio verde de una libra procedente de Siria, del año 743, estampada con una inscripción que nombra a al-Walid ibn Abd al-Rahman, jefe del tesoro de Damasco, bajo el califa Yazid III. Es un ejemplo de las pesas oficiales estampadas que se probaban en los mercados; Ibn al-Ukhuwwa afirma que el muhtasib estampaba ratls de hierro con su sello y que tenía pesas de piedra cubiertas de cuero y selladas {cite:maalim-qurba-edition-1976 p. 147}. Ninguna fuente indica que esta pesa en particular fuera emitida por un muhtasib."
  fr: "Un poids d'une livre en verre vert de Syrie, daté de 743, portant une inscription mentionnant al-Walid ibn Abd al-Rahman, trésorier de Damas sous le calife Yazid III. Il s'agit d'un exemple des poids officiels estampillés que l'on retrouve sur les marchés. Ibn al-Ukhuwwa rapporte que le muhtasib appose son sceau sur les poids en fer et que les poids en pierre sont recouverts de cuir et scellés (voir: Maalim Qurba, édition de 1976, p. 147). Aucune source n'indique que ce poids ait été émis par un muhtasib."
  tr: "743 yılında Levant'tan gelen, üzerinde Halife Yazid III döneminde Şam hazinedarı olan el-Valid ibn Abd el-Rahman'ın adının yazılı olduğu bir mühür bulunan yeşil camdan yapılmış bir poundluk ağırlık. Bu, pazarlarda test edilen resmi, mühürlü ağırlıklara bir örnektir. İbn el-Ukhuwwah, pazar müfettişinin demir poundları kendi mührüyle mühürlediğini ve taş ağırlıkları deriyle kaplayıp mühürlediğini belirtir {cite:maalim-qurba-edition-1976 s. 147}. Hiçbir kaynak bu ağırlığın bir pazar müfettişi tarafından verildiğini belirtmemektedir."
  id: "Sebuah timbangan kaca hijau untuk satu pon, dari Levant tahun 743 M, yang memiliki segel yang menyebutkan al-Walid ibn Abd al-Rahman, bendahara Damaskus pada masa pemerintahan Khalifah Yazid III. Ini adalah contoh timbangan resmi yang disegel dan diuji di pasar. Ibn al-Ukhuwwah menyebutkan bahwa inspektur pasar akan menyegel pon besi dengan segelnya dan menutupi timbangan batu dengan kulit lalu menyegelnya {cite:maalim-qurba-edition-1976 p. 147}. Tidak ada sumber yang menunjukkan bahwa timbangan khusus ini dikeluarkan oleh seorang inspektur pasar."
