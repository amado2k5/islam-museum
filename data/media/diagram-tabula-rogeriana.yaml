label:
  ar: "رسم: ما بُنيت عليه خريطة الإدريسي للعالم وما بُني عليها"
  en: "Diagram: what al-Idrisi's world map was built on and what was built on it"
  ur: "خاکہ: ادریسی کا عالمی نقشہ کس پر بنا اور اس پر کیا بنا"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط خريطة الإدريسي والكتاب الروجري، وعن جانب ما سبقها من جغرافيا بطلميوس والأقاليم السبعة وكتب الجغرافيين المسلمين وأخبار الرحالة، وعن الجانب الآخر ما جاء بعدها كما تذكره المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: al-Idrisi's map and the Book of Roger in the middle, what came before (Ptolemy's Geography, the seven climes, the Muslim geographers' books and travellers' reports) on one side, and what followed, as the sources name it, on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں ادریسی کا نقشہ اور کتابِ روجر، ایک طرف اس سے پہلے کی چیزیں ⁦(بطلیموس کا جغرافیہ، سات اقلیمیں، مسلمان جغرافیہ دانوں کی کتابیں اور مسافروں کی خبریں)⁩، اور دوسری طرف مآخذ کے مطابق اس کے بعد آنے والی چیزیں۔"
