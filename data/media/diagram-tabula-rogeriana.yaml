label:
  ar: "رسم: ما بُنيت عليه خريطة الإدريسي للعالم وما بُني عليها"
  en: "Diagram: what al-Idrisi's world map was built on and what was built on it"
  ur: "خاکہ: ادریسی کا عالمی نقشہ کس پر بنا اور اس پر کیا بنا"
  es: "Diagrama: sobre qué se construyó el mapamundi de al-Idrisi y qué se construyó sobre él."
  fr: "Diagramme: sur quoi la carte du monde d’al-Idrisi était fondée et sur quoi elle était construite."
  tr: "Şema: El-İdrisi'nin dünya haritasının dayandığı ve üzerine inşa edilenler."
  id: "Diagram: Apa yang menjadi dasar peta dunia Al-Idrisi dan apa yang dibangun di atasnya"
summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط خريطة الإدريسي والكتاب الروجري، وعن جانب ما سبقها من جغرافيا بطلميوس والأقاليم السبعة وكتب الجغرافيين المسلمين وأخبار الرحالة، وعن الجانب الآخر ما جاء بعدها كما تذكره المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: al-Idrisi's map and the Book of Roger in the middle, what came before (Ptolemy's Geography, the seven climes, the Muslim geographers' books and travellers' reports) on one side, and what followed, as the sources name it, on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں ادریسی کا نقشہ اور کتابِ روجر، ایک طرف اس سے پہلے کی چیزیں ⁦(بطلیموس کا جغرافیہ، سات اقلیمیں، مسلمان جغرافیہ دانوں کی کتابیں اور مسافروں کی خبریں)⁩، اور دوسری طرف مآخذ کے مطابق اس کے بعد آنے والی چیزیں۔"
  es: "Un esquema sencillo elaborado por el sitio web en el momento de su construcción a partir de los datos del registro: el mapa de al-Idrisi y el Libro de Roger en el centro, lo que vino antes (la Geografía de Ptolomeo, los siete climas, los libros de geógrafos musulmanes e informes de viajeros) a un lado, y lo que siguió, como lo denominan las fuentes, al otro."
  fr: "Un schéma simple dessiné par le site au moment de sa construction à partir des données des archives: la carte d’al-Idrisi et le Livre de Roger au milieu, ce qui a précédé (la Géographie de Ptolémée, les sept climats, les livres des géographes musulmans et les récits de voyageurs) d’un côté, et ce qui a suivi, comme le nomment les sources, de l’autre."
  tr: "Yapım aşamasındaki kayıt verilerinden yola çıkarak site tarafından çizilmiş basit bir şema: ortada El-İdrisi'nin haritası ve El-Rujari'nin kitabı, bir tarafta Batlamyus'un coğrafyası, yedi bölge ve Müslüman coğrafyacıların kitapları ile seyyahların haberlerinden oluşan önceki dönem, diğer tarafta ise kaynakların belirttiği gibi sonraki dönem yer almaktadır."
  id: "Diagram sederhana yang digambar oleh situs tersebut pada saat pembangunan berdasarkan data catatan: di tengah terdapat peta Al-Idrisi dan kitab Al-Rujari, dan di satu sisi adalah apa yang mendahuluinya dari geografi Ptolemy dan tujuh wilayah serta kitab-kitab ahli geografi Muslim dan berita para pelancong, dan di sisi lain adalah apa yang datang setelahnya sebagaimana disebutkan oleh sumber-sumber tersebut."
