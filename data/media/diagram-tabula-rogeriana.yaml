alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه أربعة مربعات بإطار متقطع: جغرافيا بطلميوس وخرائطه، وقسمة الربع المسكون سبعة أقاليم، وكتب المسالك والممالك عند الجغرافيين المسلمين، وأخبار الرحالة والمسافرين. في الوسط مربع بإطار سميك: خريطة الإدريسي للعالم والكتاب الروجري، الإدريسي. العمود الأخير بعنوان: بُني عليه، وفيه أربعة مربعات: أنس المهج وروض الفرج، ومختصرات نزهة المشتاق ونقول أبي الفداء، وطبعة روما سنة 1592 وترجمتها اللاتينية، والطبعة الكاملة وإعادة ميلر رسم الخرائط."
  en: "Three columns joined by two arrows. The first column, headed Built on, holds four dashed boxes: Ptolemy's Geography and its maps; the division of the inhabited quarter into seven climes; the Muslim geographers' books of routes and realms; the reports of travellers. In the middle a box with a thick border: Al-Idrisi's world map and the Book of Roger, al-Idrisi. The last column, headed Built on it, holds four boxes: Uns al-muhaj wa rawd al-faraj; the abridgements and Abu al-Fida's quotations; the Rome printing of 1592 and its Latin translation; the complete edition and Konrad Miller's redrawing of the maps."
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے چار خانے ہیں: بطلیموس کا جغرافیہ اور اس کے نقشے؛ آباد چوتھائی کی سات اقلیموں میں تقسیم؛ مسلمان جغرافیہ دانوں کی مسالک و ممالک کی کتابیں؛ مسافروں کی خبریں۔ درمیان میں موٹے کنارے والا خانہ: ادریسی کا عالمی نقشہ اور کتابِ روجر، ادریسی۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چار خانے ہیں: انس المہج و روض الفرج؛ اختصارات اور ابو الفداء کی نقول؛ روم کی 1592ء کی طباعت اور اس کا لاطینی ترجمہ؛ مکمل ایڈیشن اور کونراڈ ملر کا نقشوں کو دوبارہ بنانا۔"
