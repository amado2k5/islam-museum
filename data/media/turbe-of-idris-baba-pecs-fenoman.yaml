alt:
  ar: "مبنى حجري صغير مثمّن الشكل تعلوه قبة منخفضة مكسوّة بالقرميد الأحمر وله نوافذ مستديرة ومستطيلة، يقوم خلف سياج بين أشجار صنوبر عالية."
  en: "A small octagonal stone building with a low dome covered in red tiles and round and rectangular windows, standing behind a fence among tall pine trees."
  ur: "ایک چھوٹی آٹھ پہلو پتھر کی عمارت جس پر سرخ کھپریل سے ڈھکا پست گنبد ہے اور گول اور مستطیل کھڑکیاں ہیں، بلند صنوبر کے درختوں کے بیچ ایک باڑ کے پیچھے کھڑی ہے۔"
  fr: "Un petit bâtiment de pierre octogonal à coupole basse couverte de tuiles rouges, avec des fenêtres rondes et rectangulaires, se dresse derrière une clôture parmi de grands pins."
  es: "Un pequeño edificio octogonal de piedra con una cúpula baja cubierta de tejas rojas y ventanas redondas y rectangulares, que se alza tras una valla entre altos pinos."
  tr: "Alçak kubbesi kırmızı kiremitle kaplı, yuvarlak ve dikdörtgen pencereleri olan küçük sekizgen bir taş yapı, uzun çam ağaçlarının arasında bir çitin arkasında duruyor."
  id: "Bangunan batu kecil berbentuk segi delapan dengan kubah rendah yang dilapisi genteng merah serta jendela bundar dan persegi panjang, berdiri di balik pagar di antara pohon pinus yang tinggi."
