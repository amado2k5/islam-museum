"summary":
  "ar": "صورة لصفحة من مصحف، متحف أشموليان EA1993.394، تقول صفحة الملف إنها بخط المحقق، وفيها الآية ٢٣ من سورة النساء، من تركيا العثمانية، القرن الخامس عشر. تخدم مثالًا على المحقق، الخط الجليل الذي فُضّل في المصاحف الكبيرة، تتباعد حروفه وتمتد أفقياته. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a page from a Qur'an, Ashmolean Museum EA1993.394, which the file page says is in Muhaqqaq script, with sura 4, verse 23, from Ottoman Turkey, 15th century. It serves as an example of Muhaqqaq, the large, stately hand favoured for big mushafs, in which letters are spaced and strokes are long and level. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ایشمولین میوزیم EA1993.394 کے ایک قرآنی صفحے کی تصویر جسے فائل کا صفحہ محقق خط میں بتاتا ہے، جس میں سورۂ نساء کی آیت ۲۳ ہے، عثمانی ترکی، پندرھویں صدی۔ یہ محقق کی مثال ہے، وہ باوقار بڑا خط جو بڑے مصاحف میں پسند کیا گیا، جس کے حروف کھلے اور لکیریں لمبی اور ہموار ہوتی ہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página del Corán, Museo Ashmolean EA1993.394, que según la ficha del archivo está escrita en escritura Muhaqqaq, con la sura 4, versículo 23, procedente de la Turquía otomana del siglo XV. Sirve como ejemplo de Muhaqqaq, la caligrafía grande y elegante preferida para los grandes ejemplares del Corán, en la que las letras están espaciadas y los trazos son largos y rectos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une page du Coran (Ashmolean Museum EA1993.394), écrite en écriture muhaqqaq, sourate 4, verset 23, provenant de Turquie ottomane (XVe siècle). Cet exemplaire illustre l'écriture muhaqqaq, une écriture large et élégante privilégiée pour les grands ouvrages coraniques, caractérisée par des lettres espacées et des traits longs et réguliers. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Ashmolean Müzesi EA1993.394 numaralı arşivde yer alan bir Kur'an sayfasının fotoğrafı. Dosya sayfasında, sayfanın Muhaqqaq yazısıyla yazıldığı ve Nisa Suresi'nin 23. ayetini içerdiği belirtiliyor. Osmanlı Türkiye'sinden, 15. yüzyıla ait. Geniş aralıklı harfleri ve uzun yatay çizgileriyle karakterize edilen, büyük Kur'an'lar için tercih edilen zarif bir yazı stili olan Muhaqqaq'ın bir örneği olarak hizmet ediyor. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman Al-Qur'an, Museum Ashmolean EA1993.394. Halaman arsip menyatakan bahwa halaman tersebut menggunakan aksara Muhaqqaq dan berisi ayat 23 Surah An-Nisa, dari Turki Utsmaniyah, abad ke-15. Foto ini berfungsi sebagai contoh Muhaqqaq, aksara elegan yang disukai untuk Al-Qur'an berukuran besar, yang dicirikan oleh huruf-hurufnya yang berjarak lebar dan garis horizontal yang memanjang. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
