  fr: "Diagramme des relations généré lors de la conception à partir du dossier d'invention: le modèle initial et les médecins, la commission d'Harun et les hôpitaux ultérieurs. Il ne s'agit pas d'une reconstitution du plan de l'hôpital disparu."
  tr: "Patent verilerinden yola çıkarak inşaat sırasında oluşturulan ilişkileri gösteren bir şema; önceki modeli ve doktorları, Raşid Hastanesi'nin hizmete girişini ve sonraki hastaneleri göstermektedir. Kayıp hastane planının yeniden oluşturulmuş hali değildir."
  id: "Diagram hubungan yang dihasilkan pada saat pembangunan dari data paten; diagram ini menunjukkan model dan dokter sebelumnya, pengoperasian Rumah Sakit Rashid, dan rumah sakit-rumah sakit selanjutnya. Ini bukan rekonstruksi dari rencana rumah sakit yang hilang."
