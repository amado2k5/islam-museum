"summary":
  "ar": "صورة لورقة ألبوم من مرقّع للحافظ عثمان، إسطنبول، ١٦٩٣-١٦٩٤م، ١١٠٥هـ، متحف الفن الإسلامي ببرلين I.1985.11.1، كما تذكر صفحة الملف. ولا تسمّي الصفحة الخط. أُدرجت بوصفها عملًا بخط خطاط كبير كما تذكر صفحة الملف، ليرى القارئ كيف تبدو التقاليد المنسوبة إلى اسمه على الورق؛ وليست صورة شخصية. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of an album leaf from a muraqqa' by Hafiz Osman, Istanbul, 1693-94, AH 1105, Museum für Islamische Kunst I.1985.11.1, as the file page states. The file page does not name the script. It is included as a work in the hand of a master calligrapher, as the file page states, so that the reader can see what the tradition around his name looks like on the page; it is not a portrait. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "حافظ عثمان کے مرقع سے ایک البمی ورق کی تصویر، استنبول، ۱۶۹۳ تا ۱۶۹۴ء، ۱۱۰۵ھ، میوزیم فیور اسلامی کنسٹ I.1985.11.1، جیسا فائل کا صفحہ بتاتا ہے۔ صفحہ خط کا نام نہیں لیتا۔ اسے ایک بڑے خطاط کے خط میں لکھے کام کے طور پر شامل کیا گیا ہے، جیسا کہ فائل کا صفحہ بتاتا ہے، تاکہ قاری دیکھ سکے کہ اس کے نام سے منسوب روایت صفحے پر کیسی لگتی ہے؛ یہ کوئی شخصی تصویر نہیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
