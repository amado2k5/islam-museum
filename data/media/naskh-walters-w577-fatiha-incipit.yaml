"summary":
  "ar": "صورة للجانب الأيمن من صفحتين مفتتحتين مذهّبتين من مخطوط والترز W.577، كتبه محمد بن مصطفى إزميري في تركيا العثمانية سنة ١٢٨٢هـ، ١٨٦٥-١٨٦٦م. وتقول صفحة الملف إن آيات السورة الأولى بخط النسخ المضبوط بالحبر الأسود مع علامات قراءة حمراء، وإن عنوان السورة وعدد آياتها في عناوين بخط الرقاع بالحبر الأبيض. تخدم مثالًا على النسخ، الخط المتصل الصغير المنتظم الذي صار المعتاد في نسخ الكتب والمصاحف الصغيرة. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the right side of an illuminated double-page incipit of Walters manuscript W.577, copied in Ottoman Turkey in 1282 AH, 1865-66, by Muhammad ibn Mustafa Izmiri. The file page says that the verses of the first chapter are in vocalised Naskh script in black ink with reading marks in red, and that the chapter title and number of verses are in headings in Riqa' script in white ink. It serves as an example of Naskh, the small, even cursive hand that became the usual script for copying books and small mushafs. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "والٹرز مخطوطہ W.577 کے آراستہ دو صفحی افتتاحیے کے دائیں رخ کی تصویر، جسے محمد بن مصطفیٰ ازمیری نے عثمانی ترکی میں ۱۲۸۲ھ، ۱۸۶۵ تا ۱۸۶۶ء میں لکھا۔ فائل کا صفحہ کہتا ہے کہ پہلی سورت کی آیات اعراب والے نسخ خط میں سیاہ سیاہی میں، سرخ قراءت کے نشانات کے ساتھ، ہیں اور سورت کا عنوان اور آیات کی تعداد سفید سیاہی میں رقاع خط کے عنوانات میں ہیں۔ یہ نسخ کی مثال ہے، وہ چھوٹا ہموار رواں خط جو کتابوں اور چھوٹے مصاحف کی کتابت کا معمول بن گیا۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía del lado derecho de un incipit iluminado a doble página del manuscrito Walters W.577, copiado en la Turquía otomana en 1282 AH, 1865-66, por Muhammad ibn Mustafa Izmiri. La página del archivo indica que los versículos del primer capítulo están escritos en escritura Naskh vocalizada con tinta negra y marcas de lectura en rojo, y que el título del capítulo y el número de versículos aparecen en encabezados escritos en escritura Riqa' con tinta blanca. Sirve como ejemplo de Naskh, la letra cursiva pequeña y uniforme que se convirtió en la escritura habitual para copiar libros y pequeños mushafs. Es útil para comprender la historia de la puntuación y la vocalización: permite al lector ver, en una página real, cómo se añadieron marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie du côté droit d'un incipit enluminé sur double page du manuscrit Walters W.577, copié en Turquie ottomane en 1282 AH (1865-1866) par Muhammad ibn Mustafa Izmiri. La fiche descriptive indique que les versets du premier chapitre sont en écriture naskh vocalisée, à l'encre noire avec des signes de lecture rouges, et que le titre du chapitre et le nombre de versets figurent en caractères riqa' à l'encre blanche. Ce document illustre l'écriture naskh, cette petite écriture cursive régulière devenue l'écriture courante pour la copie de livres et de petits mushafs. Il est utile pour comprendre l'évolution de la ponctuation et de la vocalisation: il permet de voir, sur une seule page, comment les signes des voyelles brèves ont été ajoutés au squelette consonantique, d'abord sous forme de points colorés, puis de signes. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Osmanlı Türkiye'sinde 1282 Hicri (1865-1866 Miladi) yılında Muhammed ibn Mustafa İzmir tarafından yazılan Walters el yazması W.577'nin aydınlatılmış iki açılış sayfasının sağ tarafının fotoğrafı. Dosyanın sayfasında, birinci surenin ayetlerinin siyah mürekkeple ve kırmızı okuma işaretleriyle açık Naskh yazısıyla, surenin başlığının ve ayet sayısının ise beyaz mürekkeple Ruq'ah yazısıyla yazıldığı belirtiliyor. Bu, kitapların ve küçük Kur'anların kopyalanmasında yaygınlaşan küçük, düzenli, el yazısı olan Naskh'ın bir örneğidir. Diyakritik işaretlerin ve sesli harf noktalarının gelişimini açıklamakta faydalıdır: okuyucu, bu işaretlerin harf yapısına nasıl eklendiğini, önce renkli noktalar olarak ve daha sonra diyakritik işaretler olarak gerçek bir sayfada görebilir. Görsel, Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  "id": "Foto sisi kanan dari dua halaman pembuka berhias dari manuskrip Walters W.577, yang ditulis oleh Muhammad ibn Mustafa Izmir di Turki Utsmaniyah pada tahun 1282 H (1865-1866 M). Halaman berkas tersebut menyatakan bahwa ayat-ayat surah pertama ditulis dalam aksara Naskh yang jelas dengan tinta hitam dan tanda baca merah, sedangkan judul surah dan jumlah ayatnya ditulis dalam aksara Ruq'ah dengan tinta putih. Ini berfungsi sebagai contoh Naskh, aksara kursif kecil dan teratur yang menjadi umum dalam menyalin buku dan Al-Qur'an kecil. Ini berguna dalam menjelaskan perkembangan tanda diakritik dan tanda vokal: pembaca dapat melihat pada halaman sebenarnya bagaimana tanda-tanda ini ditambahkan ke struktur huruf, pertama sebagai titik berwarna dan kemudian sebagai tanda diakritik. Gambar ini berada dalam domain publik di Wikimedia Commons."
