summary:
  ar: "ورقة بخط فروخ بن عبد اللطيف مؤرخة 715هـ/1315م، حبر وألوان معتمة وذهب على ورق، من سورية أو العراق على الترجيح. رسم لآلة في كتاب الجزري، لا تصوير فوتوغرافي لآلة أصلية باقية."
  en: "Farrukh ibn Abd al-Latif's folio dated 715/1315, ink, opaque watercolour and gold on paper, probably Syria or Iraq. An illustration of a device in al-Jazari's book, not a photograph of a surviving original machine."
  ur: "فروخ بن عبد اللطیف کا 715ھ/1315ء کا ورق، کاغذ پر روشنائی، رنگ اور سونا، غالباً شام یا عراق۔ جزری کی کتاب کے آلے کی تصویر، باقی اصل مشین کی فوٹو نہیں۔"
  es: "Folio de Farrukh ibn Abd al-Latif, fechado en 715/1315, tinta, acuarela opaca y oro sobre papel, probablemente de Siria o Irak. Ilustración de un dispositivo del libro de al-Jazari, no fotografía de una máquina original conservada."
  fr: "In-folio de Farrukh ibn Abd al-Latif, daté de 715/1315, encre, gouache et or sur papier, probablement de Syrie ou d'Irak. Illustration d'un dispositif tiré de l'ouvrage d'al-Jazari, et non une photographie d'une machine originale ayant subsisté."
  tr: "Farrukh ibn Abd al-Latif'in el yazısıyla yazılmış, Hicri 715/Miladi 1315 tarihli, mürekkep, opak renkler ve altınla kağıt üzerine yazılmış, muhtemelen Suriye veya Irak'tan bir belge. Bu belge, El-Cezari'nin kitabındaki bir makineyi tasvir ediyor, günümüze ulaşmış orijinal bir makinenin fotoğrafı değil."
  id: "Sebuah dokumen dengan tulisan tangan Farrukh ibn Abd al-Latif, bertanggal 715 H/1315 M, ditulis dengan tinta, warna buram, dan emas di atas kertas, kemungkinan berasal dari Suriah atau Irak. Dokumen ini menggambarkan sebuah mesin dalam buku al-Jazari, bukan foto dari mesin asli yang masih ada."
