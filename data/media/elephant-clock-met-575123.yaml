alt:
  ar: "فيل مرسوم يحمل بناء مزخرفاً تعلوه قبة وطائر، وفيه أشخاص وآليات على هيئة تنانين طويلة ملتفة، مع حروف عربية تشير إلى أجزاء الرسم. الورقة نسخة مؤرخة 1315م."
  en: "A painted elephant carries a decorated structure topped by a dome and bird, with figures and long coiled dragon-shaped mechanisms; Arabic letters mark parts of the drawing. A manuscript copy dated 1315."
  ur: "ہاتھی پر مزین عمارت، اوپر گنبد اور پرندہ، انسانی شکلیں اور لپٹے لمبے اژدہوں جیسی مشینیں؛ اجزا پر عربی حروف۔ 1315ء کی مخطوطی نقل۔"
