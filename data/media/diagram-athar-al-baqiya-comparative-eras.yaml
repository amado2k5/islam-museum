summary:
  ar: "سلسلة تعليمية تبين مصادر التقويم المتعددة التي جمعها البيروني في «الآثار الباقية» — الفرس والسغد وخوارزم والروم واليهود والنصارى والمجوس والصابئة والعرب — ثم حساب استخراج تاريخ من تاريخ ومنازل القمر؛ لا تمثل صفحة من الكتاب."
  en: "A teaching chain showing the multiple calendrical traditions al-Biruni gathered in the Athar al-Baqiya — Persians, Sogdians, Khwarazmians, Byzantines, Jews, Christians, Magians, Sabians and Arabs — then era conversion and the lunar mansions; it is not a page of the book."
  ur: "تدریسی سلسلہ: «الآثار الباقیہ» میں بیرونی کی جمع کردہ متعدد قمری روایات — فارس، سغد، خوارزم، روم، یہود، نصاریٰ، مجوس، صابئہ اور عرب — پھر تاریخ کی ایک دوسرے میں تبدیلی اور قمری منازل؛ کتاب کا صفحہ نہیں۔"
  es: "Una cadena de enseñanzas que muestra las múltiples tradiciones calendáricas que al-Biruni reunió en el Athar al-Baqiya —persas, sogdianos, jorezmitas, bizantinos, judíos, cristianos, magos, sabeos y árabes— luego la conversión de era y las mansiones lunares; no es una página del libro."
  fr: "Une chaîne d'enseignements montrant les multiples traditions calendaires rassemblées par al-Biruni dans l'Athar al-Baqiya — Perses, Sogdiens, Khwarezmiens, Byzantins, Juifs, Chrétiens, Mages, Sabéens et Arabes — puis la conversion des ères et les demeures lunaires; ce n'est pas une page du livre."
  tr: "El-Biruni'nin \"Kalan İzler\" adlı eserinde topladığı çok sayıda takvim kaynağını (Persler, Soğdlar, Harezmliler, Romalılar, Yahudiler, Hristiyanlar, Mecusiler, Sabiiler ve Araplar) gösteren ve ardından tarihten ve ay takvimindeki evlerden tarih çıkarma işlemini hesaplayan eğitici bir seri; kitabın bir sayfasını temsil etmemektedir."
  id: "Seri edukatif yang menunjukkan berbagai sumber kalender yang dikumpulkan oleh Al-Biruni dalam \"Jejak yang Tersisa\" — Persia, Sogdia, Khwarazmia, Romawi, Yahudi, Kristen, Magi, Sabia, dan Arab — dan kemudian menghitung penentuan tanggal dari tanggal dan rasi bintang bulan; bukan merupakan halaman dari buku tersebut."
