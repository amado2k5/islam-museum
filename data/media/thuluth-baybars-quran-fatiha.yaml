"summary":
  "ar": "صورة لصفحتين، الورقتان ٢ ظهر و٣ وجه، من مصحف السلطان بيبرس، المكتبة البريطانية، المخطوطة الإضافية ٢٢٤٠٦. وتقول صفحة الملف إن محمد بن الواحد نسخه، وأن فريقًا برئاسة أبي بكر صندل زخرفه، وإنه مكتوب بخط الثلث، وإن ركن الدين بيبرس الجاشنكير، بيبرس الثاني لاحقًا، أمر بصنعه، القاهرة، ١٣٠٤ إلى ١٣٠٦م. تخدم مثالًا على الثلث، الخط الكبير المنساب الذي استُعمل في المصاحف الكبيرة واللوحات وكتابات العمائر. تتيح للقارئ نظرة على المخطوط نفسه الذي تقوم عليه سجلّات المتحف لهذا المصحف. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a double page, ff. 2v-3r, of the Sultan Baybars Qur'an, British Library Additional MS 22406. The file page says it was copied by Muhammad ibn al-Wahid, illuminated by a team headed by Abu Bakr Sandal, written in Thuluth script, commissioned by Rukn al-Din Baybars al-Jashnagir, the future Baybars II, Cairo, 1304 to 1306. It serves as an example of Thuluth, the large, flowing display hand used for big mushafs, panels and building inscriptions. It gives the reader a look at the actual manuscript behind the museum's record of this mushaf. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "سلطان بیبرس کے قرآن، برٹش لائبریری اضافی مخطوطہ ۲۲۴۰۶، کے دو صفحوں، ورق ۲ پشت و ۳ رخ، کی تصویر۔ فائل کا صفحہ کہتا ہے کہ اسے محمد بن الواحد نے نقل کیا، ابوبکر سندل کی سربراہی میں ایک ٹیم نے آراستہ کیا، یہ ثلث خط میں ہے، اور رکن الدین بیبرس جاشنگیر، بعد کے بیبرس ثانی، نے بنوایا، قاہرہ، ۱۳۰۴ تا ۱۳۰۶ء۔ یہ ثلث کی مثال ہے، وہ بڑا رواں خط جو بڑے مصاحف، لوحوں اور عمارتی کتبوں میں استعمال ہوا۔ یہ قاری کو وہ اصل مخطوطہ دکھاتی ہے جس پر عجائب گھر میں اس مصحف کا اندراج قائم ہے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una doble página, ff. 2v-3r, del Corán del Sultán Baybars, British Library Additional MS 22406. La ficha del archivo indica que fue copiada por Muhammad ibn al-Wahid, iluminada por un equipo dirigido por Abu Bakr Sandal, escrita en escritura Thuluth, por encargo de Rukn al-Din Baybars al-Jashnagir, el futuro Baybars II, en El Cairo, entre 1304 y 1306. Sirve como ejemplo de Thuluth, la caligrafía grande y fluida utilizada para grandes mushafs, paneles e inscripciones en edificios. Permite al lector observar el manuscrito original que respalda el registro del museo de este mushaf. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'une double page (ff. 2v-3r) du Coran du sultan Baybars (British Library Additional MS 22406). La notice indique que la copie a été réalisée par Muhammad ibn al-Wahid, enluminée par une équipe dirigée par Abu Bakr Sandal, écrite en écriture thuluth, et commandée par Rukn al-Din Baybars al-Jashnagir (futur Baybars II), au Caire, entre 1304 et 1306. Ce document illustre l'écriture thuluth, une écriture cursive et fluide utilisée pour les grands mushafs, les panneaux et les inscriptions de bâtiments. Il permet d'observer le manuscrit original conservé dans la notice du musée. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Sultan Baybars Kur'an'ından, Britanya Kütüphanesi, Ek El Yazması 22406'dan iki sayfanın (folio 2 verso ve folio 3 recto) fotoğrafı. Dosya sayfasında, Muhammed ibn al-Wahid tarafından kopyalandığı, Ebu Bekir Sandal başkanlığındaki bir ekip tarafından süslendiği, Thuluth yazısıyla yazıldığı ve Rukn ad-Din Baybars al-Jashankir (sonradan Baybars II) tarafından sipariş edildiği belirtiliyor, Kahire, 1304–1306 CE. Büyük Kur'anlarda, resimlerde ve mimari yazıtlarda kullanılan büyük, akıcı bir yazı olan Thuluth'un bir örneğidir. Okuyucuya, müzenin bu Kur'an'a ilişkin kayıtlarının dayandığı el yazmasının kendisine bir bakış sunmaktadır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto dua halaman, folio 2 verso dan folio 3 recto, dari Al-Qur'an Sultan Baybars, British Library, Manuskrip Tambahan 22406. Halaman arsip menyatakan bahwa manuskrip ini disalin oleh Muhammad ibn al-Wahid, dihias oleh tim yang dipimpin oleh Abu Bakr Sandal, ditulis dalam aksara Thuluth, dan dipesan oleh Rukn ad-Din Baybars al-Jashankir, yang kemudian menjadi Baybars II, Kairo, 1304–1306 M. Foto ini berfungsi sebagai contoh aksara Thuluth, aksara besar dan mengalir yang digunakan dalam Al-Qur'an berukuran besar, lukisan, dan prasasti arsitektur. Foto ini memberikan pembaca sekilas gambaran tentang manuskrip itu sendiri yang menjadi dasar catatan museum untuk Al-Qur'an ini. Gambar ini ditandai sebagai domain publik di Wikimedia Commons."
