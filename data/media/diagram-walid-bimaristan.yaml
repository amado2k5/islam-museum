alt:
  ar: "ثلاثة أعمدة بينها سهمان. العمود الأول بعنوان: بُني على، وفيه ثلاثة مربعات بإطار متقطع: خيمة رفيدة لمداواة الجرحى، وبيمارستان جنديسابور، ودار المرضى المنسوبة إلى بقراط. في الوسط مربع بإطار سميك: بيمارستان الوليد بن عبد الملك، الوليد بن عبد الملك، 88هـ. العمود الأخير بعنوان: بُني عليه، وفيه أربعة مربعات: بيمارستان هارون الرشيد في بغداد، ومارستان أحمد بن طولون في الفسطاط، وبيمارستان نور الدين في دمشق، والبيمارستان المنصوري في القاهرة"
  en: "Three columns joined by two arrows. The first column, headed Built on, holds three dashed boxes: Rufayda's tent for the wounded; the hospital of Jundishapur; the house for the sick ascribed to Hippocrates. In the middle a box with a thick border: Al-Walid ibn Abd al-Malik's bimaristan, al-Walid ibn Abd al-Malik, 88 AH. The last column, headed Built on it, holds four boxes: Harun al-Rashid's bimaristan in Baghdad; Ahmad ibn Tulun's maristan at Fustat; the Nur al-Din bimaristan in Damascus; the Mansuri bimaristan of Qalawun in Cairo"
  ur: "تین کالم جنہیں دو تیر جوڑتے ہیں۔ پہلا کالم، جس کا عنوان ہے: جس پر بنا، اس میں ٹوٹی لکیر والے تین خانے ہیں: زخمیوں کے علاج کے لیے رفیدہ کا خیمہ؛ جندی شاپور کا شفاخانہ؛ بقراط سے منسوب بیماروں کا گھر۔ درمیان میں موٹے کنارے والا خانہ: ولید بن عبد الملک کا بیمارستان، ولید بن عبد الملک، 88ھ۔ آخری کالم، جس کا عنوان ہے: جو اس پر بنا، اس میں چار خانے ہیں: بغداد میں ہارون الرشید کا بیمارستان؛ فسطاط میں احمد بن طولون کا مارستان؛ دمشق میں نور الدین کا بیمارستان؛ قاہرہ میں قلاوون کا منصوری بیمارستان"
