summary:
  ar: "رسم تخطيطي بسيط يرسمه الموقع وقت البناء من بيانات السجل: في الوسط بيمارستان الوليد بن عبد الملك سنة 88هـ، وعن يمينه ما سبقه، وعن يساره البيمارستانات التي جاءت بعده كما تذكرها المصادر."
  en: "A simple schematic drawn by the site at build time from the record's data: al-Walid ibn Abd al-Malik's bimaristan of 88 AH in the middle, what came before it on one side and the later hospitals the sources name on the other."
  ur: "سائٹ کی تعمیر کے وقت ریکارڈ کے ڈیٹا سے بننے والا ایک سادہ خاکہ: درمیان میں 88ھ کا ولید بن عبد الملک کا بیمارستان، ایک طرف وہ جو اس سے پہلے تھا اور دوسری طرف بعد کے وہ شفاخانے جن کا ذکر مآخذ میں ہے۔"
