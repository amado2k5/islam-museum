"summary":
  "ar": "صورة لصفحة نص من مخطوط والترز W.567، تؤرخها صفحة الملف بسنة ١٢٣٠هـ، ١٨١٤-١٨١٥م مع علامة استفهام. وتقول الصفحة إن فيها عنوانًا مزخرفًا للسورة الرابعة بخط الرقاع بالحبر الأحمر على أرضية ذهبية، وإن النص بخط النسخ المضبوط بالحبر الأسود مع علامات قراءة حمراء، وإن أقراصًا مزخرفة ذات نقاط ملوّنة تفصل بين الآيات. تخدم مثالًا على الرقاع، الخط الصغير الذي تتصل فيه حروف لا تتصل في غيره، وقد استُعمل هنا خطَّ عناوين. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a text page of Walters manuscript W.567, dated by the file page to 1230 AH, 1814-15 with a query. The file page says it has an illuminated heading for chapter 4 in Riqa' script in red ink on a gold ground, that the text is in vocalised Naskh script in black ink with reading marks in red, and that illuminated discs with coloured dots separate the verses. It serves as an example of Riqa', a small hand whose letters join where other scripts leave gaps, here used as a display script for headings. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "والٹرز مخطوطہ W.567 کے ایک متنی صفحے کی تصویر جسے فائل کا صفحہ ۱۲۳۰ھ، ۱۸۱۴ تا ۱۸۱۵ء کا، سوالیہ نشان کے ساتھ، بتاتا ہے۔ صفحہ کہتا ہے کہ اس میں چوتھی سورت کا آراستہ عنوان سنہری زمین پر سرخ سیاہی میں رقاع خط میں ہے، متن سیاہ سیاہی میں اعراب والے نسخ میں سرخ قراءت کے نشانات کے ساتھ ہے، اور رنگین نقطوں والی آراستہ قرصیں آیات کو الگ کرتی ہیں۔ یہ رقاع کی مثال ہے، وہ چھوٹا خط جس میں وہ حروف بھی جڑ جاتے ہیں جو دوسرے خطوط میں الگ رہتے ہیں، اور یہاں عنوانات کے لیے استعمال ہوا ہے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una página del manuscrito W.567 de Walters, fechada en la página del archivo en 1230 AH, 1814-15 con una consulta. La página del archivo indica que tiene un encabezado iluminado para el capítulo 4 en escritura Riqa' en tinta roja sobre fondo dorado, que el texto está en escritura Naskh vocalizada en tinta negra con marcas de lectura en rojo, y que discos iluminados con puntos de color separan los versos. Sirve como ejemplo de Riqa', una escritura pequeña cuyas letras se unen donde otras escrituras dejan espacios, utilizada aquí como escritura de exhibición para encabezados. Es útil para la historia de la puntuación y la vocalización: permite al lector ver, en una página real, cómo se añadieron marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'une page du manuscrit Walters W.567, datée de 1230 AH (1814-1815) par sa fiche descriptive, accompagnée d'une question. Cette fiche indique la présence d'un titre enluminé pour le chapitre 4, en écriture Riqa' à l'encre rouge sur fond or. Le texte est en écriture Naskh vocalisée à l'encre noire, avec des marques de lecture rouges, et des disques enluminés à points colorés séparent les versets. Ce document illustre l'utilisation de l'écriture Riqa', une petite écriture dont les lettres se rejoignent là où d'autres écritures laissent des espaces, ici employée comme écriture d'affichage pour les titres. Il est utile pour comprendre l'évolution de la ponctuation et de la vocalisation: il permet au lecteur de voir, sur une seule page, comment les marques des voyelles brèves ont été ajoutées au squelette consonantique sous forme de points colorés, puis de signes. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Walters'ın W.567 numaralı el yazmasından, dosya sayfasından 1230 Hicri (1814-1815 Miladi) tarihli, soru işaretiyle işaretlenmiş bir metin sayfasının fotoğrafı. Sayfada, dördüncü sure için süslü bir başlığın, altın zemin üzerine kırmızı mürekkeple Ruq'ah yazısıyla yazıldığı ve metnin Naskh yazısıyla, siyah mürekkeple ve kırmızı okuma işaretleriyle yazıldığı belirtiliyor. Ayrıca, ayetleri ayıran renkli noktalarla süslü diskler de olduğu kaydediliyor. Bu, harflerin diğer yazılarda bulunmayan bir şekilde birleştirildiği küçük bir yazı türü olan Ruq'ah'ın bir örneğidir ve burada bir başlık yazısı kullanılmıştır. Diyakritik işaretlerin ve sesli harf noktalarının gelişimini açıklamakta faydalıdır: okuyucu, bu işaretlerin harflerin yapısına nasıl eklendiğini, önce renkli noktalar ve sonra işaretler olarak, gerçek bir sayfada görebilir. Görsel, Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  "id": "Foto halaman teks dari manuskrip Walters W.567, bertanggal 1230 H (1814-1815 M) berdasarkan halaman arsip, ditandai dengan tanda tanya. Halaman tersebut menyatakan bahwa halaman itu berisi judul yang berhias untuk surah keempat dalam aksara Ruq'ah dengan tinta merah di atas latar belakang emas, dan bahwa teksnya dalam aksara Naskh dengan tinta hitam dan tanda baca merah. Disebutkan juga bahwa cakram dekoratif dengan titik-titik berwarna memisahkan ayat-ayatnya. Ini berfungsi sebagai contoh Ruq'ah, aksara kecil di mana huruf-huruf disambung dengan cara yang tidak ditemukan dalam aksara lain, dan bahwa aksara judul digunakan di sini. Ini berguna dalam menjelaskan perkembangan tanda diakritik dan tanda vokal: pembaca dapat melihat pada halaman sebenarnya bagaimana tanda-tanda ini ditambahkan ke struktur huruf, pertama sebagai titik-titik berwarna dan kemudian sebagai tanda. Gambar ini berada dalam domain publik di Wikimedia Commons."
