"label":
  "ar": "ورقة مصحف مبكرة بالخط الحجازي على الرق"
  "en": "Early Qur'an leaf in Hijazi script on vellum"
  "ur": "رق پر حجازی خط میں ابتدائی مصحف کا ورق"
  "es": "Hoja antigua del Corán en escritura hiyazí sobre pergamino"
  "fr": "Feuille ancienne du Coran en écriture hijazi sur vélin"
  "tr": "Hicazi yazısıyla parşömen üzerine yazılmış eski bir Kur'an el yazması."
  "id": "Manuskrip Al-Qur'an kuno yang ditulis dalam aksara Hijazi di atas perkamen."
"summary":
  "ar": "صورة لورقة مصحف على الرق تؤرخها صفحة الملف، المأخوذة من قطعة معروضة في مزاد سوذبيز، بالنصف الثاني من القرن السابع. وتذكر ثلاثًا وعشرين سطرًا في الصفحة بخط حجازي بحبر بنيّ، ومقاس الورقة نحو ٣٣٫٦ في ٢٣٫٨ سم. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a vellum Qur'an leaf that the file page, drawn from a Sotheby's auction lot, dates to the second half of the 7th century. It records 23 lines to the page, written in Hijazi script in brown ink, and a leaf size of 33.6 by 23.8 cm. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "رق پر لکھے مصحف کے ایک ورق کی تصویر جسے فائل کا صفحہ، جو سودبیز کی نیلامی کے ایک لاٹ سے لیا گیا ہے، ساتویں صدی کے دوسرے نصف سے منسوب کرتا ہے۔ اس میں ہر صفحے پر تیئیس سطریں بھورے رنگ کی سیاہی میں حجازی خط میں اور ورق کی پیمائش ۳۳٫۶ ضرب ۲۳٫۸ سینٹی میٹر بیان ہے۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de una hoja de pergamino del Corán, procedente de un lote de una subasta de Sotheby's, datada en la segunda mitad del siglo VII. Contiene 23 líneas escritas en escritura hiyazí con tinta marrón y mide 33,6 x 23,8 cm. Se presenta como un ejemplo temprano de la familia de escrituras hiyazí, caracterizada por letras inclinadas y pocos signos de puntuación, lo que permite compararla con escrituras posteriores más regulares. En Wikimedia Commons, el archivo es de dominio público."
  "fr": "Photographie d'une feuille de Coran en vélin, issue d'un lot de la vente aux enchères Sotheby's et datant de la seconde moitié du VIIe siècle. La page comporte 23 lignes écrites en écriture hijazi à l'encre brune et mesure 33,6 x 23,8 cm. Elle est présentée comme un exemple ancien de l'écriture hijazi, caractérisée par des lettres inclinées et peu de signes orthographiques, permettant ainsi de la comparer aux écritures plus récentes et régulières. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Sotheby's müzayedesinde satışa sunulan bir parçadan alınan, parşömen üzerine yazılmış bir Kur'an sayfasının fotoğrafı, 7. yüzyılın ikinci yarısına tarihlenmektedir. Sayfa başına 23 satır, Hicazi yazısıyla kahverengi mürekkeple yazılmış olup, sayfanın boyutları yaklaşık 33,6 x 23,8 cm'dir. Eğik harfleri ve daha az diyakritik işaretiyle karakterize edilen Hicazi yazı ailesinin erken bir örneğini sunmaktadır; bu durum, daha sonraki, daha düzenli yazılarla tezat oluşturmaktadır. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto halaman Al-Qur'an di atas perkamen, yang berasal dari fragmen yang ditawarkan di lelang Sotheby's, bertanggal paruh kedua abad ke-7. Foto tersebut menunjukkan 23 baris per halaman dalam aksara Hijazi dengan tinta cokelat, dan halaman tersebut berukuran sekitar 33,6 x 23,8 cm. Foto ini menampilkan contoh awal dari keluarga aksara Hijazi, yang dicirikan oleh huruf-hurufnya yang miring dan tanda diakritik yang lebih sedikit, berbeda dengan aksara yang lebih teratur di kemudian hari. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
