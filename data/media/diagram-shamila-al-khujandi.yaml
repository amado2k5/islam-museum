alt:
  ar: "رسالة الخجندي في صناعة الآلة الشاملة، ثم آلتها المخصصة لعرض واحد، ثم تعليق هبة الله بن الحسين الأسترلابي الذي جعلها تخدم جميع العروض؛ مخطوطات تحكي، لا نموذج فيزيائي."
  en: "Al-Khujandi's treatise on constructing the comprehensive instrument, then his single-latitude instrument, then Hibatallah ibn al-Husayn al-Asturlabi's commentary making it serve all latitudes; manuscripts tell, no physical model."
  ur: "خجندی کا جامع آلہ بنانے کا رسالہ، پھر اس کا ایک عرض البلد والا آلہ، پھر ہبت اللہ بن الحسین الاسترلابی کا حاشیہ جو اسے تمام عرض البلدوں کے لیے چلاتا ہے؛ مخطوطات بتاتی ہیں، کوئی مادی نمونہ نہیں۔"
