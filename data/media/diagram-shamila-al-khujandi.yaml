summary:
  ar: "سلسلة تعليمية تبين رسالة الخجندي، وآلته المقيدة بعرض واحد، وتعليق هبة الله الذي وسّعها؛ لا تمثل إعادة بناء موثقة ولا تدّعي الأولوية المطلقة."
  en: "Teaching chain showing al-Khujandi's treatise, his single-latitude instrument, and Hibatallah's widening commentary; not a verified reconstruction and no relative is implied."
  ur: "تدریسی سلسلہ: خجندی کا رسالہ، اس کا ایک عرض البلد والا آلہ، اور ہبت اللہ کا وسیع کرنے والا حاشیہ؛ کوئی مستند دوبارہ تعمیر نہیں اور کوئی مطلق نسبت نہیں۔"
  es: "Cadena de enseñanza que muestra el tratado de al-Khujandi, su instrumento de latitud única y el comentario cada vez más amplio de Hibatallah; no es una reconstrucción verificada y no implica ningún parentesco."
  fr: "Chaîne d'enseignement montrant le traité d'al-Khujandi, son instrument à latitude unique et le commentaire élargi d'Hibatallah; il ne s'agit pas d'une reconstruction vérifiée et aucun lien de parenté n'est sous-entendu."
  tr: "Bu eğitim serisi, el-Hucandi'nin mesajını, tek bir ekranla sınırlı olan aracını ve onu genişleten Hibatullah'ın yorumunu göstermektedir; belgelenmiş bir yeniden yapılandırmayı temsil etmemekte ve mutlak bir öncelik iddiasında bulunmamaktadır."
  id: "Seri edukatif ini mengilustrasikan pesan al-Khujandi, instrumennya yang terbatas pada satu tampilan, dan komentar Hibatullah yang memperluasnya; ini bukan merupakan rekonstruksi yang terdokumentasi dan tidak mengklaim prioritas mutlak."
