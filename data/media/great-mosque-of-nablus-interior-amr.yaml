summary:
  ar: "تُظهر الصورة داخل الجامع الصلاحي الكبير في نابلس: صفوف من الأعمدة تحت عقود مدببة فوق أرض مفروشة بالسجاد. صورة التقطها عمرو بن كلثوم في 29 أغسطس 2012، من ويكيميديا كومنز، بترخيص CC BY-SA 3.0."
  en: "The photograph shows the inside of the Great Mosque of Nablus: rows of columns under pointed arches above a carpeted floor. Photograph by عمرو بن كلثوم, 29 August 2012, on Wikimedia Commons, licensed CC BY-SA 3.0."
  ur: "تصویر میں نابلس کی جامع صلاحی کبیر کا اندرونی حصہ دکھائی دیتا ہے: قالین بچھے فرش کے اوپر نوکیلی محرابوں تلے ستونوں کی قطاریں۔ تصویر: عمرو بن كلثوم، 29 اگست 2012ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 3.0۔"
  fr: "La photographie montre l'intérieur de la Grande Mosquée de Naplouse : des rangées de colonnes sous des arcs brisés au-dessus d'un sol recouvert de tapis. Photographie : عمرو بن كلثوم, 29 août 2012, sur Wikimedia Commons, sous licence CC BY-SA 3.0."
  es: "La fotografía muestra el interior de la Gran Mezquita de Nablus: filas de columnas bajo arcos apuntados sobre un suelo cubierto de alfombras. Fotografía de عمرو بن كلثوم, 29 de agosto de 2012, en Wikimedia Commons, con licencia CC BY-SA 3.0."
  tr: "Fotoğraf, Nablus'taki Selahi Büyük Camii'nin içini gösteriyor: halı serili bir zeminin üzerinde sivri kemerlerin altında sıralanan sütunlar. Fotoğraf: عمرو بن كلثوم, 29 Ağustos 2012; Wikimedia Commons, CC BY-SA 3.0 lisansı."
  id: "Foto ini menampilkan bagian dalam Masjid Agung Salahi di Nablus: deretan tiang di bawah lengkung runcing di atas lantai berkarpet. Foto oleh عمرو بن كلثوم, 29 Agustus 2012, di Wikimedia Commons, berlisensi CC BY-SA 3.0."
