alt:
  ar: "داخل مسجد فيه صفان من الأعمدة الحجرية الغليظة تحمل عقودًا مدببة وأقبية بيضاء، وعلى الأرض سجاد أخضر مزخرف، ومصابيح معلّقة، وبضعة أشخاص جالسين على الجانبين."
  en: "Interior of a mosque with two rows of thick stone columns carrying pointed arches and white vaults, patterned green carpets on the floor, hanging lamps, and a few people sitting at the sides."
  ur: "ایک مسجد کا اندرونی منظر جس میں موٹے پتھر کے ستونوں کی دو قطاریں نوکیلی محرابوں اور سفید محرابی چھتوں کو اٹھائے ہوئے ہیں، فرش پر نقش دار سبز قالین ہیں، لٹکتے ہوئے چراغ ہیں، اور کناروں پر چند لوگ بیٹھے ہیں۔"
  fr: "Intérieur d'une mosquée avec deux rangées d'épaisses colonnes de pierre portant des arcs brisés et des voûtes blanches, des tapis verts à motifs sur le sol, des lampes suspendues et quelques personnes assises sur les côtés."
  es: "Interior de una mezquita con dos filas de gruesas columnas de piedra que sostienen arcos apuntados y bóvedas blancas, alfombras verdes con motivos en el suelo, lámparas colgantes y unas pocas personas sentadas a los lados."
  tr: "İçinde sivri kemerleri ve beyaz tonozları taşıyan iki sıra kalın taş sütun bulunan bir caminin iç mekânı; zeminde desenli yeşil halılar, sarkan lambalar ve yanlarda oturan birkaç kişi var."
  id: "Bagian dalam sebuah masjid dengan dua deret tiang batu tebal yang menopang lengkung runcing dan langit-langit lengkung putih, karpet hijau bermotif di lantai, lampu-lampu gantung, dan beberapa orang duduk di sisi-sisinya."
