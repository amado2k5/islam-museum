label:
  ar: "الجامع الصلاحي الكبير في نابلس: بيت الصلاة"
  en: "Great Mosque of Nablus: the prayer hall"
  ur: "نابلس کی جامع صلاحی کبیر: نماز گاہ"
  fr: "Grande Mosquée de Naplouse : la salle de prière"
  es: "Gran Mezquita de Nablus: la sala de oración"
