"label":
  "ar": "ورقتان من مصحف بخط الريحاني، بغداد، نحو ١٣٣٥م"
  "en": "Bifolium from a Qur'an in Rayhani script, Baghdad, about 1335"
  "ur": "ریحانی خط میں قرآن کا دو ورقی، بغداد، تقریباً ۱۳۳۵ء"
"summary":
  "ar": "صورة لورقتين من مصحف بخط الريحاني، تقول صفحة الملف، مستندةً إلى معرض متحف هيوستن للفنون الجميلة، إنه منسوب إلى أرغون بن عبد الله الكاملي وزخرفته منسوبة إلى محمد بن سيف الدين النقاش؛ حبر وصبغ معتم وذهب على ورق، بغداد على الأرجح، نحو ١٣٣٥م، مجموعة خاصة. تخدم مثالًا على الريحان، الصورة الأصغر من المحقق، وقد كُتبت به مصاحف كاملة كما استُعمل في العناوين والصفحات المزخرفة. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a bifolium from a Qur'an in Rayhani script, which the file page, citing a Museum of Fine Arts, Houston exhibition, says is attributed to Arghun ibn Abd Allah al-Kamili, with illumination attributed to Muhammad ibn Sayf al-Din al-Naqqash; ink, opaque pigment and gold on paper, probably Baghdad, about 1335, private collection. It serves as an example of Rayhan, the smaller sibling of Muhaqqaq, used for full mushafs as well as headings and decorated pages. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "ریحانی خط میں قرآن کے ایک دو ورقی کی تصویر جسے فائل کا صفحہ، ہیوسٹن میوزیم آف فائن آرٹس کی ایک نمائش کا حوالہ دے کر، ارغون بن عبد اللہ کاملی سے منسوب بتاتا ہے اور آرائش محمد بن سیف الدین نقاش سے منسوب؛ کاغذ پر سیاہی، مبہم رنگ اور سونا، غالباً بغداد، تقریباً ۱۳۳۵ء، نجی ذخیرہ۔ یہ ریحان کی مثال ہے، جو محقق کی چھوٹی صورت ہے اور جس میں مکمل مصاحف بھی لکھے گئے اور عنوانات اور آراستہ صفحات بھی۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
