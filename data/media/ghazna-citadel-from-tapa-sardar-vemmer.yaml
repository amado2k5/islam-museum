summary:
  ar: "تُظهر الصورة قلعة غزنة على تلّها، من تبه سردار عبر السهل، وخلفها الجبال. صورة التقطها S.K. Vemmer في 26 أكتوبر 2011، من ويكيميديا كومنز، وهي في الملك العام."
  en: "The photograph shows the citadel of Ghazna on its hill, seen from Tapa Sardar across the plain, with mountains behind. Photograph by S.K. Vemmer, 26 October 2011, on Wikimedia Commons, in the public domain."
  ur: "تصویر میں غزنی کا قلعہ اپنی پہاڑی پر دکھائی دیتا ہے، جو تپہ سردار سے میدان کے پار دیکھا گیا ہے، اور پیچھے پہاڑ ہیں۔ تصویر: S.K. Vemmer، 26 اکتوبر 2011ء، وکیمیڈیا کامنز سے، عوامی ملکیت میں۔"
  fr: "La photographie montre la citadelle de Ghazna sur sa colline, vue de Tapa Sardar au-delà de la plaine, avec des montagnes derrière. Photographie : S.K. Vemmer, 26 octobre 2011, sur Wikimedia Commons, dans le domaine public."
  es: "La fotografía muestra la ciudadela de Ghazna sobre su colina, vista desde Tapa Sardar al otro lado de la llanura, con montañas detrás. Fotografía de S.K. Vemmer, 26 de octubre de 2011, en Wikimedia Commons, en el dominio público."
  tr: "Fotoğraf, Gazne Kalesi'ni tepesinde, Tapa Sardar'dan ovanın ötesinden, arkasındaki dağlarla birlikte gösteriyor. Fotoğraf: S.K. Vemmer, 26 Ekim 2011; Wikimedia Commons, kamu malı."
  id: "Foto ini menampilkan benteng Ghazna di atas bukitnya, dilihat dari Tapa Sardar melintasi dataran, dengan pegunungan di belakangnya. Foto oleh S.K. Vemmer, 26 Oktober 2011, di Wikimedia Commons, domain publik."
