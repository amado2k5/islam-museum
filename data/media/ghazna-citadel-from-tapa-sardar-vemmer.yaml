depicts: [place/ghazna]
alt:
  ar: "حصن مسوّر على تل منخفض في وسط المشهد، فوق حزام من أشجار الخريف وسهل مغبرّ فيه أبنية طينية متفرقة؛ وسلسلة من الجبال الجرداء تملأ الأفق تحت سماء يغشاها الغبار."
  en: "A walled fortress on a low hill in the middle distance, above a belt of autumn trees and a dusty plain with scattered mud-brick compounds; a range of bare mountains fills the horizon under a hazy sky."
  ur: "ایک فصیل بند قلعہ ایک پست پہاڑی پر منظر کے درمیان میں ہے، خزاں کے درختوں کی پٹی اور کچی اینٹوں کے بکھرے ہوئے احاطوں والے گرد آلود میدان کے اوپر؛ بنجر پہاڑوں کا سلسلہ غبار آلود آسمان تلے افق کو بھر رہا ہے۔"
  fr: "Une forteresse fortifiée sur une colline basse au plan intermédiaire, au-dessus d'une ceinture d'arbres d'automne et d'une plaine poussiéreuse parsemée d'enclos de briques crues ; une chaîne de montagnes nues remplit l'horizon sous un ciel brumeux."
  es: "Una fortaleza amurallada sobre una colina baja en el plano medio, sobre un cinturón de árboles otoñales y una llanura polvorienta con recintos dispersos de adobe; una cadena de montañas desnudas llena el horizonte bajo un cielo brumoso."
  tr: "Alçak bir tepenin üzerinde, orta mesafede surlarla çevrili bir hisar; altında sonbahar ağaçlarından bir kuşak ve dağınık kerpiç avlulu tozlu bir ova var; çıplak dağlardan oluşan bir sıra, puslu bir gökyüzünün altında ufku dolduruyor."
  id: "Sebuah benteng bertembok di atas bukit rendah di tengah pemandangan, di atas sabuk pohon musim gugur dan dataran berdebu dengan kompleks bata lumpur yang tersebar; barisan pegunungan gundul memenuhi cakrawala di bawah langit berkabut."
