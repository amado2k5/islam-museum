alt:
  ar: "بناء مستطيل ضخم مسوّر من كتل حجرية كبيرة فاتحة اللون تعلوه شرفات ومئذنتان مربعتان، فوق درجات حجرية عريضة وأشجار، تحت سماء زرقاء داكنة."
  en: "A massive rectangular enclosure of large pale stone blocks with crenellations and two square minarets, above broad stone steps and trees, under a deep blue sky."
  ur: "بڑے ہلکے رنگ کے پتھر کے ٹکڑوں سے بنی ایک عظیم الجثہ مستطیل فصیل جس پر کنگرے اور دو چوکور مینار ہیں، چوڑی پتھریلی سیڑھیوں اور درختوں کے اوپر، گہرے نیلے آسمان تلے۔"
  fr: "Une massive enceinte rectangulaire de grands blocs de pierre clairs, avec des créneaux et deux minarets carrés, au-dessus de larges marches de pierre et d'arbres, sous un ciel bleu profond."
  es: "Un macizo recinto rectangular de grandes bloques de piedra clara con almenas y dos minaretes cuadrados, sobre anchas escaleras de piedra y árboles, bajo un cielo azul intenso."
  tr: "Büyük açık renkli taş bloklardan yapılmış, mazgallı ve iki kare minareli devasa dikdörtgen bir yapı, geniş taş basamakların ve ağaçların üzerinde yükseliyor, koyu mavi bir gökyüzünün altında."
  id: "Bangunan persegi panjang yang masif dari balok-balok batu besar berwarna pucat dengan gerigi dinding dan dua menara persegi, di atas tangga batu yang lebar dan pepohonan, di bawah langit biru tua."
