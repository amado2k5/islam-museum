  ar: "تُظهر الصورة السور الحجري العالي للحرم الإبراهيمي في الخليل من جهة الجنوب، بمئذنتيه. صورة التقطها Djampa في 10 سبتمبر 2009، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows the high stone enclosure of the Ibrahimi Sanctuary in Hebron from the south, with its two minarets. Photograph by Djampa, 10 September 2009, on Wikimedia Commons, licensed CC BY-SA 4.0."
