  es: "La fotografía muestra el alto recinto de piedra del Santuario Ibrahimí en Hebrón desde el sur, con sus dos minaretes. Fotografía de Djampa, 10 de septiembre de 2009, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, El-Halil'deki İbrahimi Harem'in yüksek taş surunu güneyden iki minaresiyle birlikte gösteriyor. Fotoğraf: Djampa, 10 Eylül 2009; Wikimedia Commons, CC BY-SA 4.0 lisansı."
