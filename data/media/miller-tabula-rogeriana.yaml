alt:
  ar: "خريطة عريضة مستطيلة، اليابسة فيها صفراء والبحار زرقاء داكنة، والجنوب في أعلاها. تمتد في أعلاها كتلة يابسة كبيرة تكثر فيها الأنهار والجبال، وفي وسطها وإلى اليمين بحار زرقاء واسعة فيها جزر كثيرة، ويحيط البحر بالأطراف. شبكة من خطوط رفيعة تقسم الخريطة إلى مستطيلات، وفي أعلاها أرقام رومانية من الأول إلى العاشر، وعلى جانبها أرقام الأقاليم."
  en: "A wide rectangular map with yellow land and dark blue seas, south at the top. A large landmass full of rivers and mountain ranges fills the upper part; across the middle and to the right lie broad blue seas dotted with islands, and the ocean runs round the edges. A grid of thin lines divides the map into rectangles, with Roman numerals one to ten along the top and the clime numbers down the side."
  ur: "ایک چوڑا مستطیل نقشہ جس میں خشکی پیلی اور سمندر گہرے نیلے ہیں، اور جنوب اوپر ہے۔ اوپر کے حصے میں دریاؤں اور پہاڑی سلسلوں سے بھرا ایک بڑا خشک خطہ ہے؛ درمیان اور دائیں طرف جزیروں سے بھرے وسیع نیلے سمندر ہیں، اور کناروں پر سمندر گھیرا ڈالے ہوئے ہے۔ باریک لکیروں کا ایک جال نقشے کو مستطیلوں میں بانٹتا ہے، اوپر ایک سے دس تک رومی اعداد ہیں اور پہلو میں اقلیموں کے نمبر۔"
