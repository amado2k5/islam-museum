label:
  ar: "صورة: خرائط الإدريسي السبعون مجموعة في لوحة واحدة (إعادة رسم كونراد ميلر)"
  en: "Image: al-Idrisi's seventy sectional maps joined into one sheet (Konrad Miller's redrawing)"
  ur: "تصویر: ادریسی کے ستر حصوں والے نقشے ایک ہی ورق میں جوڑے ہوئے (کونراڈ ملر کی دوبارہ تیاری)"
summary:
  ar: "قسم الإدريسي كل إقليم من الأقاليم السبعة عشرة أجزاء، ورسم لكل جزء خريطة، فبلغت سبعين خريطة {cite:nuzhat-al-mushtaq-2002 p. 13}. وقد نشر كونراد ميلر هذه الخرائط في كتابه «Mappae Arabicae» (شتوتغارت 1926–1931) ثم طُبعت من جديد باسم «خريطة العالم للعربي الإدريسي من سنة 1154» (شتوتغارت 1981) {cite:tdv-idrisi-serif pp. 493–495}. وهذه الصورة نسخة ميلر مجموعة في لوحة واحدة، والأسماء فيها مكتوبة بالحروف اللاتينية، والجنوب في أعلاها كما في الأصل. منشورة في ويكيميديا كومنز في الملك العام."
  en: "Al-Idrisi divided each of the seven climes into ten sections and drew a map for each, seventy maps in all {cite:nuzhat-al-mushtaq-2002 p. 13}. Konrad Miller published these maps in his Mappae Arabicae (Stuttgart 1926–1931), and they were reprinted as 'Weltkarte des Arabers Idrisi vom Jahre 1154' (Stuttgart 1981) {cite:tdv-idrisi-serif pp. 493–495}. This image is Miller's copy joined into one sheet, with the names written in Latin letters and south at the top, as in the original. On Wikimedia Commons in the public domain."
  ur: "ادریسی نے سات اقلیموں میں سے ہر ایک کو دس حصوں میں بانٹا اور ہر حصے کا ایک نقشہ بنایا، کل ستر نقشے {cite:nuzhat-al-mushtaq-2002 p. 13}۔ کونراڈ ملر نے یہ نقشے اپنی کتاب «Mappae Arabicae» (شٹٹ گارٹ 1926–1931) میں شائع کیے، اور بعد میں یہ «1154ء کا عرب ادریسی کا عالمی نقشہ» کے نام سے دوبارہ چھپے (شٹٹ گارٹ 1981) {cite:tdv-idrisi-serif pp. 493–495}۔ یہ تصویر ملر کی نقل ہے جو ایک ورق میں جوڑی گئی ہے، جس میں نام لاطینی حروف میں لکھے ہیں اور اصل کی طرح جنوب اوپر ہے۔ وکی میڈیا کامنز پر پبلک ڈومین میں۔"
