label:
  ar: "صورة: خرائط الإدريسي السبعون مجموعة في لوحة واحدة ⁦(إعادة رسم كونراد ميلر)⁩"
  en: "Image: al-Idrisi's seventy sectional maps joined into one sheet (Konrad Miller's redrawing)"
  ur: "تصویر: ادریسی کے ستر حصوں والے نقشے ایک ہی ورق میں جوڑے ہوئے ⁦(کونراڈ ملر کی دوبارہ تیاری)⁩"
  es: "Imagen: Setenta mapas seccionales de al-Idrisi unidos en una sola hoja (redibujo de Konrad Miller)."
  fr: "Image: Les soixante-dix cartes sectorielles d'al-Idrisi assemblées en une seule feuille (redessin de Konrad Miller)"
  tr: "Resim: El-İdrisi'nin yetmiş haritasının tek bir panelde derlenmiş hali (Conrad Miller tarafından yeniden çizilmiş)"
  id: "Gambar: Tujuh puluh peta karya Al-Idrisi dikompilasi menjadi satu panel (digambar ulang oleh Conrad Miller)"
summary:
  ar: "قسم الإدريسي كل إقليم من الأقاليم السبعة عشرة أجزاء، ورسم لكل جزء خريطة، فبلغت سبعين خريطة {cite:nuzhat-al-mushtaq-2002 p. 13}. وقد نشر كونراد ميلر هذه الخرائط في كتابه «Mappae Arabicae» ⁦(شتوتغارت 1926–1931)⁩ ثم طُبعت من جديد باسم «خريطة العالم للعربي الإدريسي من سنة 1154» ⁦(شتوتغارت 1981)⁩ {cite:tdv-idrisi-serif pp. 493–495}. وهذه الصورة نسخة ميلر مجموعة في لوحة واحدة، والأسماء فيها مكتوبة بالحروف اللاتينية، والجنوب في أعلاها كما في الأصل. منشورة في ويكيميديا كومنز في الملك العام."
  en: "Al-Idrisi divided each of the seven climes into ten sections and drew a map for each, seventy maps in all {cite:nuzhat-al-mushtaq-2002 p. 13}. Konrad Miller published these maps in his Mappae Arabicae (Stuttgart 1926–1931), and they were reprinted as 'Weltkarte des Arabers Idrisi vom Jahre 1154' (Stuttgart 1981) {cite:tdv-idrisi-serif pp. 493–495}. This image is Miller's copy joined into one sheet, with the names written in Latin letters and south at the top, as in the original. On Wikimedia Commons in the public domain."
  ur: "ادریسی نے سات اقلیموں میں سے ہر ایک کو دس حصوں میں بانٹا اور ہر حصے کا ایک نقشہ بنایا، کل ستر نقشے {cite:nuzhat-al-mushtaq-2002 p. 13}۔ کونراڈ ملر نے یہ نقشے اپنی کتاب «Mappae Arabicae» ⁦(شٹٹ گارٹ 1926–1931)⁩ میں شائع کیے، اور بعد میں یہ «1154ء کا عرب ادریسی کا عالمی نقشہ» کے نام سے دوبارہ چھپے ⁦(شٹٹ گارٹ 1981)⁩ {cite:tdv-idrisi-serif pp. 493–495}۔ یہ تصویر ملر کی نقل ہے جو ایک ورق میں جوڑی گئی ہے، جس میں نام لاطینی حروف میں لکھے ہیں اور اصل کی طرح جنوب اوپر ہے۔ وکی میڈیا کامنز پر پبلک ڈومین میں۔"
  es: "Al-Idrisi dividió cada uno de los siete climas en diez secciones y dibujó un mapa para cada una, setenta mapas en total {cite:nuzhat-al-mushtaq-2002 p. 13}. Konrad Miller publicó estos mapas en su Mappae Arabicae (Stuttgart 1926–1931), y fueron reimpresos como 'Weltkarte des Arabers Idrisi vom Jahre 1154' (Stuttgart 1981) {cite:tdv-idrisi-serif pp. 493–495}. Esta imagen es la copia de Miller unida en una sola hoja, con los nombres escritos en letras latinas y el sur en la parte superior, como en el original. En Wikimedia Commons en dominio público."
  fr: "Al-Idrisi divisa chacun des sept climats en dix sections et dressa une carte pour chacune, soit soixante-dix cartes au total {cite:nuzhat-al-mushtaq-2002 p. 13}. Konrad Miller publia ces cartes dans ses Mappae Arabicae (Stuttgart 1926–1931), et elles furent réimprimées sous le titre « Weltkarte des Arabers Idrisi vom Jahre 1154 » (Stuttgart 1981) {cite:tdv-idrisi-serif pp. 493–495}. Cette image est la copie de Miller, assemblée en une seule feuille, avec les noms écrits en caractères latins et le sud en haut, comme dans l'original. Disponible sur Wikimedia Commons dans le domaine public."
  tr: "El-İdrisi, on yedi bölgenin her birini parçalara ayırmış ve her parça için bir harita çizmiş, toplamda yetmiş harita elde etmiştir {cite:nuzhat-al-mushtaq-2002 s. 13}. Bu haritalar, Conrad Miller tarafından \"Mappae Arabicae\" (Stuttgart 1926–1931) adlı kitabında yayınlanmış ve daha sonra \"1154 Yılından Arap El-İdrisi'nin Dünya Haritası\" (Stuttgart 1981) olarak yeniden basılmıştır {cite:tdv-idrisi-serif s. 493–495}. Bu görsel, Miller'ın tek bir panelde derlediği, isimlerin Latin alfabesiyle yazıldığı ve güneyin orijinalinde olduğu gibi üstte yer aldığı versiyonunu göstermektedir. Wikimedia Commons'ta kamu malı olarak yayınlanmıştır."
  id: "Al-Idrisi membagi masing-masing dari tujuh belas wilayah menjadi beberapa bagian dan menggambar peta untuk setiap bagian, sehingga totalnya ada tujuh puluh peta {cite:nuzhat-al-mushtaq-2002 hlm. 13}. Peta-peta ini diterbitkan oleh Conrad Miller dalam bukunya \"Mappae Arabicae\" (Stuttgart 1926–1931) dan kemudian dicetak ulang sebagai \"Peta Dunia Arab al-Idrisi dari tahun 1154\" (Stuttgart 1981) {cite:tdv-idrisi-serif hlm. 493–495}. Gambar ini menunjukkan versi Miller yang disusun dalam satu panel, dengan nama-nama yang ditulis dalam aksara Latin dan arah selatan di bagian atas, seperti pada aslinya. Diterbitkan di Wikimedia Commons dalam domain publik."
