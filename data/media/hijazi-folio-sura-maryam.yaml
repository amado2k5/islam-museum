"summary":
  "ar": "صورة لورقة مصحف على الرق تؤرخها صفحة الملف، المأخوذة من قطعة معروضة في مزاد كريستيز، بالنصف الثاني من القرن السابع. وتذكر ثماني عشرة سطرًا في الوجه بخط حجازي بنيّ داكن، وعلامات ضبط، وعلامات فواصل الآيات على هيئة دوائر منقّطة، وعلامة سورة هندسية متشابكة جزئية في ظهر الورقة، ومواضع تالفة؛ وأكبر مقاس للورقة نحو ٣٤٫٥ في ٣١ سم. تُعرض مثالًا مبكرًا على عائلة الخط الحجازي التي تميل حروفها وتقلّ فيها علامات الضبط، ليقابلها القارئ بالخطوط الأحدث والأكثر انتظامًا. تنفع في قصة النقط والضبط: إذ يرى القارئ في صفحة حقيقية كيف أُضيفت علامات الحركات إلى هيكل الحروف نقطًا ملوّنة ثم علامات. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a vellum Qur'an folio that the file page, drawn from a Christie's auction lot, dates to the second half of the 7th century. It records 18 lines a side in sepia Hijazi script, vocalisation markers and dotted-roundel verse markers, a partial geometric interlaced sura marker on the verso, and areas of loss; the folio is up to 34.5 by 31 cm. It is shown as an early example of the Hijazi family of scripts, whose letters lean and whose spelling marks are few, so that the reader can set it beside the later, more regular hands. It is useful for the story of dotting and vowelling: it lets the reader see, on one real page, how short-vowel marks were added to the consonant skeleton as coloured dots and later as signs. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "رق پر لکھے مصحف کے ایک ورق کی تصویر جسے فائل کا صفحہ، جو کرسٹیز کی نیلامی کے ایک لاٹ سے لیا گیا ہے، ساتویں صدی کے دوسرے نصف سے منسوب کرتا ہے۔ اس میں ہر طرف اٹھارہ سطریں سیپیا رنگ کے حجازی خط میں، اعراب کے نشانات اور نقطہ دار گول آیت نشان، پشت پر جزوی گتھا ہوا ہندسی سورت نشان اور ضائع حصے بیان ہوئے ہیں؛ ورق زیادہ سے زیادہ ۳۴٫۵ ضرب ۳۱ سینٹی میٹر ہے۔ یہ حجازی خط کے خاندان کی ابتدائی مثال کے طور پر دکھایا گیا ہے، جس کے حروف مائل اور ضبط کی علامات کم ہوتی ہیں، تاکہ قاری اسے بعد کے زیادہ باقاعدہ خطوط کے ساتھ رکھ کر دیکھ سکے۔ یہ نقطوں اور اعراب کی کہانی کے لیے مفید ہے: قاری ایک حقیقی صفحے پر دیکھ سکتا ہے کہ حروف کے ڈھانچے پر مختصر حرکات کی علامات پہلے رنگین نقطوں اور پھر نشانوں کی صورت میں کیسے بڑھائی گئیں۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio del Corán en pergamino, cuya página de archivo, procedente de un lote de la subasta de Christie's, data de la segunda mitad del siglo VII. Contiene 18 líneas por lado en escritura hiyazí en sepia, marcadores de vocalización y marcadores de verso en círculos punteados, un marcador de sura parcialmente entrelazado geométrico en el verso y zonas con pérdida de texto; el folio mide hasta 34,5 x 31 cm. Se muestra como un ejemplo temprano de la familia de escrituras hiyazí, cuyas letras se inclinan y cuyas marcas ortográficas son escasas, lo que permite al lector compararlo con las escrituras posteriores, más regulares. Resulta útil para comprender la historia de la puntuación y la vocalización: permite al lector observar, en una página real, cómo se añadieron las marcas de vocales cortas al esqueleto consonántico como puntos de color y, posteriormente, como signos. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un folio de Coran sur vélin, datant de la seconde moitié du VIIe siècle, provenant d'un lot de la vente aux enchères de Christie's. Ce folio présente 18 lignes par face en écriture hijazi sépia, des marques de vocalisation et des marques de verset en forme de rondelle pointillée, une marque de sourate partielle à motifs géométriques entrelacés au verso, ainsi que des zones manquantes. Ses dimensions sont de 34,5 x 31 cm. Il est présenté comme un exemple ancien de l'écriture hijazi, caractérisée par des lettres inclinées et peu de signes orthographiques, permettant ainsi de le comparer aux écritures plus tardives et plus régulières. Ce document est précieux pour comprendre l'évolution de la pointification et de la vocalisation: il illustre, sur une seule page, comment les marques des voyelles brèves ont été ajoutées au squelette consonantique sous forme de points colorés, puis de signes. Sur Wikimedia Commons, le fichier est dans le domaine public."
