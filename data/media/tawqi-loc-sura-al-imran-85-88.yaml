"summary":
  "ar": "صورة لورقة من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن الرابع عشر، فيها الآيات ٨٥ إلى ٨٨ من السورة الثالثة، آل عمران. وتقول الصفحة إن النص العربي بخط التوقيع وإن الترجمات الفارسية بنسخ فارسي، وإن التوقيع يشبه الثلث لكنه أصغر، مع وصل منتظم بين حروف لا توصل عادةً. تخدم مثالًا على التوقيع، قرين الثلث الأصغر الذي توصل فيه حروف لا توصل عادةً وصلًا منتظمًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress folio dated by the file page to the 14th century, with verses 85 to 88 of the 3rd chapter, Al Imran. The file page says the Arabic text is in tawqi' while the Persian translations are in a Persian naskh, and that tawqi' is similar to thuluth but smaller, with systematic assimilations between letters ordinarily not joined. It serves as an example of Tawqi', a smaller cousin of Thuluth in which letters that are ordinarily not joined are linked systematically. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک ورق کی تصویر جسے فائل کا صفحہ چودھویں صدی سے منسوب کرتا ہے، جس میں تیسری سورت، آل عمران، کی آیات ۸۵ تا ۸۸ ہیں۔ صفحہ کہتا ہے کہ عربی متن توقیع میں ہے اور فارسی ترجمے فارسی نسخ میں، اور توقیع ثلث سے ملتی جلتی مگر چھوٹی ہے، جس میں عام طور پر نہ جڑنے والے حروف باقاعدگی سے جوڑ دیے جاتے ہیں۔ یہ توقیع کی مثال ہے، جو ثلث کی چھوٹی قرین ہے اور جس میں وہ حروف بھی باقاعدگی سے جوڑ دیے جاتے ہیں جو عام طور پر نہیں جڑتے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un folio de la Biblioteca del Congreso, fechado en el siglo XIV según la página del archivo, con los versículos 85 a 88 del capítulo 3, Al Imran. La página del archivo indica que el texto árabe está en tawqi', mientras que las traducciones al persa están en naskh persa, y que el tawqi' es similar al thuluth pero más pequeño, con asimilaciones sistemáticas entre letras que normalmente no se unen. Sirve como ejemplo de tawqi', una variante más pequeña del thuluth en la que las letras que normalmente no se unen se enlazan sistemáticamente. En Wikimedia Commons, el archivo tiene la marca de dominio público."
  "fr": "Photographie d'un folio de la Bibliothèque du Congrès, daté du XIVe siècle d'après la fiche descriptive, contenant les versets 85 à 88 du chapitre 3, Al Imran. La fiche précise que le texte arabe est en tawqi', tandis que les traductions persanes sont en naskh. Le tawqi' est un système d'écriture apparenté au thuluth, mais plus petit, caractérisé par des liaisons systématiques entre des lettres habituellement non liées. Ce document illustre le tawqi', une variante plus petite du thuluth où les lettres normalement non liées sont associées de manière systématique. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Kongre Kütüphanesi'nden, 14. yüzyıla tarihlenen ve üçüncü sure olan Al İmran'ın 85-88. ayetlerini içeren bir belgenin fotoğrafı. Belgede, Arapça metnin imza yazısıyla, Farsça çevirilerin ise Farsça yazıyla yazıldığı ve imzanın Thuluth yazısına benzediği ancak daha küçük olduğu, normalde birleşmeyen harflerin düzenli bir şekilde birleştirildiği belirtiliyor. Bu, normalde birleşmeyen harflerin düzenli bir şekilde birleştirildiği, daha küçük Thuluth yazısına benzer bir imza örneği olarak hizmet ediyor. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Foto dokumen dari Perpustakaan Kongres, bertanggal abad ke-14, berisi ayat 85-88 dari surah ketiga, Al Imran. Dokumen tersebut menyatakan bahwa teks Arabnya menggunakan aksara tanda tangan, terjemahan Persia menggunakan aksara Persia, dan tanda tangannya menyerupai aksara Thuluth tetapi lebih kecil, dengan penggabungan huruf yang teratur yang biasanya tidak digabungkan. Ini berfungsi sebagai contoh tanda tangan, mirip dengan aksara Thuluth yang lebih kecil, di mana huruf-huruf yang biasanya tidak digabungkan digabungkan secara teratur. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
