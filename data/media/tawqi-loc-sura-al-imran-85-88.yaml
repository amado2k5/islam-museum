"label":
  "ar": "آيات قرآنية بخط التوقيع مع ترجمة فارسية، مكتبة الكونغرس"
  "en": "Qur'anic verses in Tawqi' script with Persian translation, Library of Congress"
  "ur": "توقیع خط میں قرآنی آیات فارسی ترجمے کے ساتھ، لائبریری آف کانگریس"
"summary":
  "ar": "صورة لورقة من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن الرابع عشر، فيها الآيات ٨٥ إلى ٨٨ من السورة الثالثة، آل عمران. وتقول الصفحة إن النص العربي بخط التوقيع وإن الترجمات الفارسية بنسخ فارسي، وإن التوقيع يشبه الثلث لكنه أصغر، مع وصل منتظم بين حروف لا توصل عادةً. تخدم مثالًا على التوقيع، قرين الثلث الأصغر الذي توصل فيه حروف لا توصل عادةً وصلًا منتظمًا. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress folio dated by the file page to the 14th century, with verses 85 to 88 of the 3rd chapter, Al Imran. The file page says the Arabic text is in tawqi' while the Persian translations are in a Persian naskh, and that tawqi' is similar to thuluth but smaller, with systematic assimilations between letters ordinarily not joined. It serves as an example of Tawqi', a smaller cousin of Thuluth in which letters that are ordinarily not joined are linked systematically. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کے ایک ورق کی تصویر جسے فائل کا صفحہ چودھویں صدی سے منسوب کرتا ہے، جس میں تیسری سورت، آل عمران، کی آیات ۸۵ تا ۸۸ ہیں۔ صفحہ کہتا ہے کہ عربی متن توقیع میں ہے اور فارسی ترجمے فارسی نسخ میں، اور توقیع ثلث سے ملتی جلتی مگر چھوٹی ہے، جس میں عام طور پر نہ جڑنے والے حروف باقاعدگی سے جوڑ دیے جاتے ہیں۔ یہ توقیع کی مثال ہے، جو ثلث کی چھوٹی قرین ہے اور جس میں وہ حروف بھی باقاعدگی سے جوڑ دیے جاتے ہیں جو عام طور پر نہیں جڑتے۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
