"label":
  "ar": "الصفحتان الافتتاحيتان من مصحف بالنستعليق، شاه محمود النيشابوري، ١٥٣٨م، طوب قابي H.S. 25"
  "en": "Opening double page of a Qur'an in Nasta'liq, Shah Mahmud Nishapuri, 1538, Topkapi H.S. 25"
  "ur": "نستعلیق میں قرآن کے افتتاحی دو صفحے، شاہ محمود نیشاپوری، ۱۵۳۸ء، توپ قاپی H.S. 25"
"summary":
  "ar": "صورة للصفحتين الافتتاحيتين، الورقتان ١ ظهر و٢ وجه، من مصحف بخط النستعليق تقول صفحة الملف إن شاه محمود النيشابوري أتمّه في ١٤ محرم ٩٤٥هـ، ١٢ حزيران ١٥٣٨م، مكتبة قصر طوب قابي H.S. 25. تخدم مثالًا على النستعليق، الخط الفارسي المعلّق الذي نشأ من مزج النسخ والتعليق وصار خط الشعر الفارسي. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of the opening double page, ff. 1b-2a, of a Qur'an in nasta'liq script that the file page says Shah Mahmud Nishapuri finished on 14 Muharram 945, 12 June 1538, Topkapi Palace Library H.S. 25. It serves as an example of Nasta'liq, the hanging Persian hand that grew from the blend of Naskh and Ta'liq and became the script of Persian poetry. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "نستعلیق خط میں قرآن کے افتتاحی دو صفحوں، ورق ۱ پشت و ۲ رخ، کی تصویر جسے فائل کا صفحہ بتاتا ہے کہ شاہ محمود نیشاپوری نے ۱۴ محرم ۹۴۵ھ، ۱۲ جون ۱۵۳۸ء کو مکمل کیا، توپ قاپی محل کتب خانہ H.S. 25۔ یہ نستعلیق کی مثال ہے، وہ معلّق فارسی خط جو نسخ اور تعلیق کے امتزاج سے بنا اور فارسی شاعری کا خط بن گیا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
