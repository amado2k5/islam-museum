"summary":
  "ar": "صورة لوحة خطية من مكتبة الكونغرس تؤرخها صفحة الملف بالقرن السادس عشر، فيها سطر واحد من نص عربي بخط الثلث الأسود؛ وتذكر الصفحة أن الخط ثلث وأن مساحة الكتابة ١٢٫٦ في ٤٫٧ سم، وتنسبها إلى علاء الدين التبريزي. تخدم مثالًا على الثلث، الخط الكبير المنساب الذي استُعمل في المصاحف الكبيرة واللوحات وكتابات العمائر. تحمل الصورة على ويكيميديا كومنز علامة الملك العام."
  "en": "A photograph of a Library of Congress calligraphic panel, dated by the file page to the 16th century, with a single line of Arabic text executed in black thuluth script; the file page lists the script as thuluth and the written surface as 12.6 by 4.7 cm, and attributes it to Alaeddin Tabrizi. It serves as an example of Thuluth, the large, flowing display hand used for big mushafs, panels and building inscriptions. On Wikimedia Commons the file carries a public-domain mark."
  "ur": "لائبریری آف کانگریس کی ایک خطاطی لوح کی تصویر جسے فائل کا صفحہ سولھویں صدی سے منسوب کرتا ہے؛ اس میں عربی متن کی ایک سطر سیاہ ثلث میں ہے؛ صفحہ خط ثلث اور تحریری سطح ۱۲٫۶ ضرب ۴٫۷ سینٹی میٹر لکھتا ہے اور اسے علاء الدین تبریزی سے منسوب کرتا ہے۔ یہ ثلث کی مثال ہے، وہ بڑا رواں خط جو بڑے مصاحف، لوحوں اور عمارتی کتبوں میں استعمال ہوا۔ کامنز پر اس فائل پر پبلک ڈومین کا نشان لگا ہے۔"
  "es": "Fotografía de un panel caligráfico de la Biblioteca del Congreso, fechado en el siglo XVI según la ficha del archivo, con una sola línea de texto árabe escrita en escritura thuluth negra. La ficha del archivo indica que la escritura es thuluth y que la superficie escrita mide 12,6 x 4,7 cm, atribuyéndola a Alaeddin Tabrizi. Sirve como ejemplo de thuluth, la caligrafía grande y fluida utilizada para grandes mushafs, paneles e inscripciones en edificios. En Wikimedia Commons, el archivo lleva la marca de dominio público."
  "fr": "Photographie d'un panneau calligraphique de la Bibliothèque du Congrès, daté du XVIe siècle selon sa fiche descriptive, présentant une unique ligne de texte arabe en écriture thuluth noire. La fiche descriptive indique qu'il s'agit bien d'une écriture thuluth et que la surface écrite mesure 12,6 x 4,7 cm. L'œuvre est attribuée à Alaeddin Tabrizi. Ce panneau illustre l'écriture thuluth, une écriture cursive et fluide utilisée pour les grands mushafs, panneaux et inscriptions de bâtiments. Sur Wikimedia Commons, le fichier est dans le domaine public."
  "tr": "Kongre Kütüphanesi'ndeki, dosya sayfasından 16. yüzyıla tarihlenen bir hat levhasının fotoğrafı, siyah Thuluth yazısıyla yazılmış tek satırlık Arapça metni göstermektedir. Sayfada yazının Thuluth olduğu, metnin 12,6 x 4,7 cm boyutlarında olduğu ve Ala al-Din al-Tabrizi'ye atfedildiği belirtilmiştir. Bu, büyük Kur'anlarda, levhalarda ve mimari yazıtlarda kullanılan büyük, akıcı bir yazı türü olan Thuluth'un bir örneğidir. Görsel, Wikimedia Commons'ta kamu malı olarak işaretlenmiştir."
  "id": "Sebuah foto plakat kaligrafi dari Perpustakaan Kongres, yang bertanggal abad ke-16 berdasarkan halaman arsipnya, menunjukkan satu baris teks Arab dalam aksara Thuluth hitam. Halaman tersebut menyatakan bahwa aksara tersebut adalah Thuluth, teks berukuran 12,6 x 4,7 cm, dan dikaitkan dengan Ala al-Din al-Tabrizi. Ini berfungsi sebagai contoh Thuluth, aksara besar dan mengalir yang digunakan dalam Al-Qur'an besar, tablet, dan prasasti arsitektur. Gambar tersebut ditandai sebagai domain publik di Wikimedia Commons."
