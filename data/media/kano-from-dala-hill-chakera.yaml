summary:
  ar: "تُظهر الصورة مدينة كانو من تل دالا، وبيوتها المنخفضة تمتد إلى الأفق. صورة التقطها Shiraz Chakera في 13 سبتمبر 2005، من ويكيميديا كومنز، بترخيص CC BY-SA 2.0."
  en: "The photograph shows the city of Kano from Dala Hill, its low houses stretching to the horizon. Photograph by Shiraz Chakera, 13 September 2005, on Wikimedia Commons, licensed CC BY-SA 2.0."
  ur: "تصویر میں شہر کانو تل دالا سے دکھائی دیتا ہے، اس کے پست مکانات افق تک پھیلے ہوئے ہیں۔ تصویر: Shiraz Chakera، 13 ستمبر 2005ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 2.0۔"
  fr: "La photographie montre la ville de Kano depuis la colline de Dala, ses maisons basses s'étendant jusqu'à l'horizon. Photographie : Shiraz Chakera, 13 septembre 2005, sur Wikimedia Commons, sous licence CC BY-SA 2.0."
  es: "La fotografía muestra la ciudad de Kano desde la colina de Dala, con sus casas bajas que se extienden hasta el horizonte. Fotografía de Shiraz Chakera, 13 de septiembre de 2005, en Wikimedia Commons, con licencia CC BY-SA 2.0."
  tr: "Fotoğraf, Kano şehrini Dala Tepesi'nden, ufka kadar uzanan alçak evleriyle gösteriyor. Fotoğraf: Shiraz Chakera, 13 Eylül 2005; Wikimedia Commons, CC BY-SA 2.0 lisansı."
  id: "Foto ini menampilkan kota Kano dari Bukit Dala, dengan rumah-rumah rendahnya yang membentang hingga cakrawala. Foto oleh Shiraz Chakera, 13 September 2005, di Wikimedia Commons, berlisensi CC BY-SA 2.0."
