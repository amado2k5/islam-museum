alt:
  ar: "مدينة منبسطة شاسعة من بيوت منخفضة بجدران طينية وسقوف معدنية تمتد إلى أفق يغشاه الضباب، تُرى من قمة تل صخري في مقدمته حجر أحمر وعشب."
  en: "A vast flat city of low houses with earthen walls and metal roofs reaches to a hazy horizon, seen from a rocky hilltop with red stone and grass in the foreground."
  ur: "مٹی کی دیواروں اور دھات کی چھتوں والے پست مکانات کا ایک وسیع ہموار شہر دھندلے افق تک پھیلا ہوا ہے، جو ایک چٹانی ٹیلے کی چوٹی سے دکھائی دیتا ہے جس کے سامنے سرخ پتھر اور گھاس ہے۔"
  fr: "Une vaste ville plate de maisons basses aux murs de terre et aux toits de tôle s'étend jusqu'à un horizon brumeux, vue du sommet d'une colline rocheuse avec de la pierre rouge et de l'herbe au premier plan."
  es: "Una vasta ciudad plana de casas bajas con muros de tierra y techos metálicos se extiende hasta un horizonte brumoso, vista desde la cima rocosa de una colina con piedra roja y hierba en primer plano."
  tr: "Toprak duvarlı ve metal çatılı alçak evlerden oluşan geniş, düz bir şehir puslu bir ufka kadar uzanıyor; ön planında kırmızı taş ve ot bulunan kayalık bir tepenin zirvesinden görülüyor."
  id: "Kota datar luas dari rumah-rumah rendah berdinding tanah dan beratap logam membentang hingga cakrawala yang berkabut, terlihat dari puncak bukit berbatu dengan batu merah dan rumput di latar depan."
