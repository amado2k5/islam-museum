depicts: [place/busra]
alt:
  ar: "ممر مبلّط يمتد بجانب أسوار من كتل البازلت الداكنة نحو برج مربع بجانبه قبة بيضاء صغيرة؛ وإلى اليسار شجرة كبيرة تتدلى فوق السور، وإلى اليمين أعمدة إنارة على طول حاجز."
  en: "A paved walkway runs beside walls of dark basalt blocks toward a square tower with a small white dome beside it; a large tree hangs over the wall on the left, and street lamps stand along a railing on the right."
  ur: "ایک پختہ راستہ گہرے بازالٹ کے ٹکڑوں کی دیواروں کے ساتھ ایک چوکور برج کی طرف جاتا ہے جس کے پہلو میں ایک چھوٹا سفید گنبد ہے؛ بائیں جانب ایک بڑا درخت دیوار پر جھکا ہوا ہے، اور دائیں جانب ایک جنگلے کے ساتھ ساتھ بجلی کے کھمبے کھڑے ہیں۔"
  fr: "Un chemin dallé longe des murs de blocs de basalte sombre vers une tour carrée à côté de laquelle se trouve une petite coupole blanche ; un grand arbre surplombe le mur à gauche, et des lampadaires s'alignent le long d'un garde-corps à droite."
  es: "Un paseo pavimentado discurre junto a muros de bloques de basalto oscuro hacia una torre cuadrada con una pequeña cúpula blanca a su lado; un gran árbol cuelga sobre el muro a la izquierda, y farolas se alinean a lo largo de una barandilla a la derecha."
  tr: "Taş döşeli bir yürüyüş yolu, koyu bazalt bloklardan duvarların yanından, yanında küçük beyaz bir kubbe bulunan kare bir kuleye doğru uzanıyor; solda büyük bir ağaç duvarın üzerine sarkıyor, sağda ise bir korkuluk boyunca sokak lambaları duruyor."
  id: "Jalan setapak berpaving membentang di samping tembok dari balok basal gelap menuju menara persegi dengan kubah putih kecil di sampingnya; pohon besar menjuntai di atas tembok di sebelah kiri, dan lampu jalan berderet di sepanjang pagar di sebelah kanan."
