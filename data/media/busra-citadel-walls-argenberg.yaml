summary:
  ar: "تُظهر الصورة أسوار قلعة بصرى وأحد أبراجها من حجر البازلت الأسود، وهي القلعة القائمة حول المسرح الروماني. صورة التقطها Vyacheslav Argenberg في 30 أغسطس 2008، من ويكيميديا كومنز، بترخيص CC BY 4.0."
  en: "The photograph shows the black basalt walls and a tower of the citadel of Busra, which stands around the Roman theatre. Photograph by Vyacheslav Argenberg, 30 August 2008, on Wikimedia Commons, licensed CC BY 4.0."
  ur: "تصویر میں بصریٰ کے قلعے کی کالے بازالٹ پتھر کی فصیلیں اور ایک برج دکھائی دیتے ہیں، یہ قلعہ رومی تھیٹر کے گرد قائم ہے۔ تصویر: Vyacheslav Argenberg، 30 اگست 2008ء، وکیمیڈیا کامنز سے، لائسنس CC BY 4.0۔"
  fr: "La photographie montre les murailles de basalte noir et une tour de la citadelle de Bosra, qui s'élève autour du théâtre romain. Photographie : Vyacheslav Argenberg, 30 août 2008, sur Wikimedia Commons, sous licence CC BY 4.0."
  es: "La fotografía muestra las murallas de basalto negro y una torre de la ciudadela de Bosra, que se alza alrededor del teatro romano. Fotografía de Vyacheslav Argenberg, 30 de agosto de 2008, en Wikimedia Commons, con licencia CC BY 4.0."
  tr: "Fotoğraf, Busra Kalesi'nin siyah bazalt surlarını ve bir kulesini gösteriyor; kale Roma tiyatrosunun çevresinde yer alıyor. Fotoğraf: Vyacheslav Argenberg, 30 Ağustos 2008; Wikimedia Commons, CC BY 4.0 lisansı."
  id: "Foto ini menampilkan tembok-tembok basal hitam dan sebuah menara benteng Busra, yang berdiri mengelilingi teater Romawi. Foto oleh Vyacheslav Argenberg, 30 Agustus 2008, di Wikimedia Commons, berlisensi CC BY 4.0."
