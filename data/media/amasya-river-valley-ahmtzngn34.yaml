depicts: [place/amasya]
alt:
  ar: "بلدة من بيوت بسقوف حمراء تملأ واديًا ضيقًا تُرى من مرتفع صخري؛ يخترقها نهر أخضر منحنٍ عليه جسور، وترتفع على الجانبين جبال شديدة الانحدار."
  en: "A town of red-roofed houses fills a narrow valley seen from a rocky height; a green river crossed by bridges curves through it, and steep mountains rise on both sides."
  ur: "سرخ چھتوں والے مکانات کا ایک قصبہ ایک تنگ وادی کو بھرے ہوئے ہے جو ایک چٹانی بلندی سے دکھائی دیتی ہے؛ پلوں سے گزرتا ایک سبز دریا اس میں سے خم کھاتا ہے، اور دونوں جانب عمودی پہاڑ بلند ہیں۔"
  fr: "Une ville de maisons aux toits rouges remplit une vallée étroite vue d'une hauteur rocheuse ; une rivière verte traversée de ponts la parcourt en courbe, et de hautes montagnes abruptes s'élèvent des deux côtés."
  es: "Una ciudad de casas de tejados rojos llena un valle estrecho visto desde una altura rocosa; un río verde cruzado por puentes lo recorre en curva, y empinadas montañas se alzan a ambos lados."
  tr: "Kırmızı çatılı evlerden oluşan bir kasaba, kayalık bir yükseklikten görülen dar bir vadiyi dolduruyor; üzerinde köprüler bulunan yeşil bir nehir içinden kıvrılarak geçiyor ve iki yanda dik dağlar yükseliyor."
  id: "Sebuah kota rumah beratap merah memenuhi lembah sempit yang terlihat dari ketinggian berbatu; sungai hijau yang dilintasi jembatan melengkung membelahnya, dan pegunungan curam menjulang di kedua sisi."
