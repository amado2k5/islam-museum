summary:
  ar: "تُظهر الصورة أماسيا من أعلى، والنهر يتلوّى بين بيوتها ذات السقوف الحمراء في وادٍ تحيط به الجبال. صورة التقطها Ahmtzngn34 في 20 أغسطس 2019، من ويكيميديا كومنز، بترخيص CC BY-SA 4.0."
  en: "The photograph shows Amasya from above, the river winding between its red-roofed houses in a valley shut in by mountains. Photograph by Ahmtzngn34, 20 August 2019, on Wikimedia Commons, licensed CC BY-SA 4.0."
  ur: "تصویر میں اماسیا اوپر سے دکھائی دیتا ہے، دریا اپنے سرخ چھتوں والے مکانات کے بیچ ایک پہاڑوں سے گھری وادی میں بل کھا رہا ہے۔ تصویر: Ahmtzngn34، 20 اگست 2019ء، وکیمیڈیا کامنز سے، لائسنس CC BY-SA 4.0۔"
  fr: "La photographie montre Amasya vue d'en haut, la rivière serpentant entre ses maisons aux toits rouges dans une vallée enserrée par les montagnes. Photographie : Ahmtzngn34, 20 août 2019, sur Wikimedia Commons, sous licence CC BY-SA 4.0."
  es: "La fotografía muestra Amasya desde arriba, con el río que serpentea entre sus casas de tejados rojos en un valle encerrado por montañas. Fotografía de Ahmtzngn34, 20 de agosto de 2019, en Wikimedia Commons, con licencia CC BY-SA 4.0."
  tr: "Fotoğraf, Amasya'yı yukarıdan, nehrin dağlarla çevrili bir vadide kırmızı çatılı evlerinin arasında kıvrıldığı halde gösteriyor. Fotoğraf: Ahmtzngn34, 20 Ağustos 2019; Wikimedia Commons, CC BY-SA 4.0 lisansı."
  id: "Foto ini menampilkan Amasya dari atas, dengan sungai yang berkelok di antara rumah-rumah beratap merahnya di lembah yang dikepung pegunungan. Foto oleh Ahmtzngn34, 20 Agustus 2019, di Wikimedia Commons, berlisensi CC BY-SA 4.0."
