summary:
  ar: "سلسلة تعليمية تبين كيف يضرب نبض المضخة الجزيء ليبدأ التفاعل، ثم يفحصه نبض الكاشفة بعد فاصل زمني متغير؛ لا تمثل تجربة تاريخية واحدة."
  en: "A teaching chain showing how the pump pulse strikes the molecule to start the reaction, then the probe pulse examines it after a variable delay; it does not depict one historical experiment."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ پمپ پلس سالمہ کو ردعمل شروع کرنے کے لیے مارتا ہے، پھر پروب پلس متغیر وقفے کے بعد اسے جانچتا ہے؛ یہ کسی ایک تاریخی تجربے کی تصویر نہیں۔"
  es: "Se trata de una secuencia didáctica que muestra cómo el pulso de bombeo impacta la molécula para iniciar la reacción, y luego el pulso de sondeo la examina tras un retardo variable; no representa ningún experimento histórico en particular."
  fr: "Une chaîne pédagogique montrant comment l'impulsion de la pompe frappe la molécule pour déclencher la réaction, puis comment l'impulsion de la sonde l'examine après un délai variable; elle ne décrit pas une expérience historique."
