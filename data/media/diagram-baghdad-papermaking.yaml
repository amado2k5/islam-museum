summary:
  ar: "سلسلة انتقال عامة يرسمها الموقع عند البناء؛ لا تعين طريق أسرى أو مخطط مصنع أو نسباً مباشراً لكل صناعة لاحقة."
  en: "Generic build-time transmission chain, not a prisoner itinerary, factory plan or direct genealogy of every later industry."
  ur: "تعمیر کے وقت بننے والا عمومی انتقالی سلسلہ؛ قیدیوں کا راستہ، کارخانے کا نقشہ یا ہر بعد کی صنعت کا براہ راست نسب نہیں۔"
  es: "Cadena de transmisión genérica en tiempo de construcción, no un itinerario de prisioneros, un plan de fábrica ni una genealogía directa de cada industria posterior."
  fr: "Chaîne de transmission générique pour la construction, et non un itinéraire de prisonnier, un plan d'usine ou une généalogie directe de chaque industrie ultérieure."
  tr: "İnşaat sırasında şantiye tarafından genel bir geçiş zinciri oluşturulur; bu zincirde hapishane güzergahı, fabrika düzeni veya her bir sonraki endüstri için doğrudan oranlar belirtilmez."
  id: "Rantai transisi umum disusun oleh pihak pengelola lokasi selama konstruksi; rantai ini tidak menentukan rute penjara, tata letak pabrik, atau proporsi langsung untuk setiap industri berikutnya."
