"label":
  "ar": "صحن فيروزي محفور بكلمة «العز» بالكوفي المورَّق، متحف المتروبوليتان"
  "en": "Turquoise dish carved with 'al-izz' in floriated Kufic, Metropolitan Museum"
  "ur": "فیروزی طشتری پر مورّق کوفی میں کندہ «العز»، میٹروپولیٹن میوزیم"
  "es": "Plato turquesa tallado con la inscripción 'al-izz' en escritura cúfica florida, Museo Metropolitano."
  "fr": "Plat en turquoise sculpté de motifs floraux en écriture coufique, orné du mot « al-izz », Metropolitan Museum"
"summary":
  "ar": "صورة لصحن فيروزي في متحف المتروبوليتان للفنون يقول عنوان الملف إن عليه كتابة عربية محفورة بالكوفي المورَّق تقرأ «العز»؛ وتؤرخه صفحة الملف بالقرن الحادي عشر وتصنّفه خزفًا. أُدرجت لأن الكوفي المورَّق الذي تنبت من أطراف حروفه الأوراق والسيقان يظهر أفضل ما يظهر على التحف والعمائر لا على صفحات المصاحف؛ فالقطعة تُري الأسلوب ولا تحمل نص مصحف. الصورة على ويكيميديا كومنز مُهداة إلى الملك العام بترخيص CC0."
  "en": "A photograph of a turquoise dish in the Metropolitan Museum of Art whose file title says it has a carved Arabic inscription in floriated Kufic reading 'al-'izz', 'Glory'; the file page dates it to the 11th century and classes it as ceramics. It is included because floriated Kufic, whose letter-ends sprout leaves and scrolls, is best seen on objects and monuments rather than in mushaf pages; the object shows the style, not a Qur'an text. On Wikimedia Commons the file is dedicated to the public domain under CC0."
  "ur": "میٹروپولیٹن میوزیم آف آرٹ کی ایک فیروزی طشتری کی تصویر جس کے فائل کے عنوان کے مطابق اس پر مورّق کوفی میں عربی کتبہ «العز» کندہ ہے؛ فائل کا صفحہ اسے گیارھویں صدی کی بتاتا ہے اور چینی مٹی کی اشیا میں رکھتا ہے۔ اسے اس لیے شامل کیا گیا کہ مورّق کوفی، جس کے حروف کے سروں سے پتے اور بیلیں نکلتی ہیں، مصحف کے صفحات کی بجائے برتنوں اور عمارتوں پر زیادہ نمایاں ہے؛ یہ شے اسلوب دکھاتی ہے، قرآنی متن نہیں۔ کامنز پر یہ فائل CC0 کے تحت پبلک ڈومین کے لیے وقف ہے۔"
  "es": "Fotografía de un plato turquesa del Museo Metropolitano de Arte. El título del archivo indica que tiene una inscripción árabe tallada en escritura cúfica florida que dice «al-'izz», «Gloria». La página del archivo la data del siglo XI y la clasifica como cerámica. Se incluye porque la escritura cúfica florida, cuyos remates de letras presentan hojas y volutas, se aprecia mejor en objetos y monumentos que en las páginas del Corán. El objeto muestra este estilo, no un texto del Corán. En Wikimedia Commons, el archivo está dedicado al dominio público bajo la licencia CC0."
  "fr": "Photographie d'un plat turquoise conservé au Metropolitan Museum of Art. La fiche descriptive indique qu'il porte une inscription arabe gravée en écriture coufique ornementée, se lisant « al-'izz », signifiant « Gloire ». La fiche le date du XIe siècle et le classe comme céramique. Il est inclus car l'écriture coufique ornementée, dont les extrémités des lettres sont ornées de feuilles et de volutes, est plus visible sur les objets et les monuments que dans les pages du mushaf; l'objet présenté ici illustre ce style, et non un texte coranique. Sur Wikimedia Commons, le fichier est placé dans le domaine public sous licence CC0."
