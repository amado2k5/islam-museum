summary:
  ar: "سلسلة تعليمية تبين كيف جمع ابن المجدي علم الميقات المتعلم على المارديني في رسالة واحدة تربط حساب أوائل الشهور برؤية الهلال، من الأزهر إلى قرّاء مصر في القرن التاسع عشر؛ لا تدعي اختراع التقويم."
  en: "A teaching chain showing how Ibn al-Majdi gathered the miqat science learned under al-Mardini into one treatise linking month-beginning calculation to crescent sighting, from al-Azhar to Egyptian readers of the nineteenth century; it claims no invention of the calendar."
  ur: "تدریسی سلسلہ جو دکھاتا ہے کہ ابن المجدی نے الماردینی سے سیکھا میقات کا علم کیسے ایک رسالے میں جمع کیا جو ماہ کے آغاز کے حساب کو رؤیتِ ہلال سے جوڑتا ہے، ازہر سے انیسویں صدی کے مصری قارئین تک؛ کیلنڈر کی ایجاد کا دعویٰ نہیں۔"
