summary:
  ar: "مجلد من الرق اشترته أغنس لويس في السويس سنة 1895، كتابته العليا مواعظ عربية مسيحية من أواخر القرن التاسع، وتحتها نصوص سريانية ويونانية وأوراق من مصاحف كوفية ممحوّة {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  en: "Vellum volume bought by Agnes Lewis at Suez in 1895, whose upper script is Christian Arabic homilies of the late ninth century, written over Syriac and Greek texts and erased leaves from Kufic Qur'ans {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  fr: "Volume de vélin acheté par Agnes Lewis à Suez en 1895, dont l’écriture supérieure contient des homélies chrétiennes arabes de la fin du IXe siècle, écrites sur des textes syriaques et grecs et sur des feuillets effacés de Corans coufiques {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  ur: "چرمی اوراق کی ایک جلد جو ایگنس لیوس نے 1895ء میں سوئز سے خریدی، جس کی بالائی تحریر نویں صدی کے آخر کے مسیحی عربی مواعظ ہیں، سریانی اور یونانی متون اور کوفی مصاحف کے مٹائے گئے اوراق کے اوپر {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}۔"
  es: "Volumen de pergamino comprado por Agnes Lewis en Suez en 1895, cuya escritura superior son homilías cristianas árabes de finales del siglo IX, escritas sobre textos siríacos y griegos y hojas borradas de Coranes cúficos {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  tr: "Agnes Lewis'in 1895'te Süveyş'te satın aldığı bir parşömen cilt; üst kısmında dokuzuncu yüzyılın sonlarına ait Hristiyan Arapça vaazları, alt kısmında ise Süryanice ve Yunanca metinler ile Kufi Kur'an'dan silinmiş sayfalar bulunmaktadır. {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 s. 6}"
  id: "Sebuah jilid perkamen yang dibeli oleh Agnes Lewis di Suez pada tahun 1895, teks bagian atasnya berupa khotbah-khotbah berbahasa Arab Kristen dari akhir abad kesembilan, dan di bawahnya terdapat teks-teks berbahasa Suryani dan Yunani serta halaman-halaman yang terhapus dari Al-Qur'an Kufi {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
