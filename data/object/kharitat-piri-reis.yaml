summary:
  ar: "خريطة عالم مرسومة على جلد غزال سنة 1513م للبحار العثماني بيري ريس؛ الجزء الباقي منها محفوظ في طوب قابي وهي من أشهر الخرائط العثمانية."
  en: "A world map drawn on gazelle skin in 1513 by the Ottoman admiral Piri Reis; the surviving fragment is kept at Topkapı and is the most famous Ottoman map."
  fr: "Une carte du monde dessinée sur peau de gazelle en 1513 par l’amiral ottoman Piri Reis ; le fragment conservé se trouve à Topkapı et constitue la carte ottomane la plus célèbre."
  es: "Un mapamundi dibujado en piel de gacela en 1513 por el almirante otomano Piri Reis; el fragmento que se conserva se guarda en Topkapi y es el mapa otomano más famoso."
  ur: "1513 میں عثمانی ایڈمرل پیری ریس کے ذریعے غزال کی جلد پر تیار کردہ دنیا کا نقشہ؛ زندہ بچ جانے والا ٹکڑا Topkapı میں رکھا گیا ہے اور یہ سب سے مشہور عثمانی نقشہ ہے۔"
  tr: "Osmanlı denizci Piri Reis tarafından 1513 yılında ceylan derisine çizilmiş bir dünya haritası; haritanın kalan kısmı Topkapı Sarayı'nda muhafaza edilmektedir ve en ünlü Osmanlı haritalarından biridir."
  id: "Peta dunia yang digambar di atas kulit kijang pada tahun 1513 M oleh navigator Ottoman, Piri Reis; bagian yang tersisa disimpan di Istana Topkapi dan merupakan salah satu peta Ottoman yang paling terkenal."
