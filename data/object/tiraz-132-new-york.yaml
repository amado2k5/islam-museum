label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — نيويورك"
  en: "Tiraz silk fragment, 132 AH — New York"
  fr: "Fragment de soie tiraz, 132 H — New York"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — نیویارک"
  es: "Fragmento de seda de Tiraz, 132 AH — Nueva York"
  tr: "İpekten yapılmış bir desen parçası (132 AH) — New York"
  id: "Sebuah pola sutra (132 AH) — New York"
summary:
  ar: "قطعة من نسيج طراز حريري ذو أرضية حمراء وزخارف حمراء وخضراء وصفراء وبيضاء، كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها في مصر، وهي الجزء الثالث (C) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في متحف بروكلين بنيويورك برقم الجرد ٤١.١٢٦٥ {cite:tei-epigraphie 9321}."
  en: "A fragment of tiraz silk with a red ground and red, green, yellow and white motifs, bearing an Arabic maker's inscription dated 132 AH (749–750 CE); found in Egypt, it is part C of four fragments that once formed a single textile, held by the Brooklyn Museum, New York (accession 41.1265) {cite:tei-epigraphie 9321}."
  fr: "Un fragment de soie tiraz à fond rouge et motifs rouges, verts, jaunes et blancs portant une inscription de fabricant en arabe datée de 132 H (749–750 ap. J.-C.) ; découvert en Égypte, il constitue la partie C de quatre fragments ayant autrefois formé un seul textile, conservée au Brooklyn Museum, à New York (numéro d’inventaire 41.1265) {cite:tei-epigraphie 9321}."
  ur: "سرخ پس منظر والے طراز ریشم کا ٹکڑا جس پر سرخ، سبز، پیلے اور سفید نقش ہیں اور عربی دستاویزی تحریر 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتی ہے؛ مصر میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ C ہے، اور نیویارک کے بروکلن میوزیم میں محفوظ ہے ⁦(نمائندہ نمبر 41.1265)⁩ {cite:tei-epigraphie 9321}۔"
  es: "Un fragmento de seda tiraz con fondo rojo y motivos rojos, verdes, amarillos y blancos, con una inscripción árabe del fabricante fechada en 132 AH (749-750 d. C.); encontrado en Egipto, es la parte C de cuatro fragmentos que alguna vez formaron un solo textil, conservado en el Museo de Brooklyn, Nueva York (acceso 41.1265) {cite:tei-epigraphie 9321}."
  tr: "Kırmızı zemin üzerine kırmızı, yeşil, sarı ve beyaz süslemeler bulunan, üzerinde Arapça bir üretim metni yazılı olan, 132 Hicri (749-750 Miladi) tarihli ipek benzeri bir kumaş parçası; Mısır'da bulunmuştur ve bir zamanlar tek bir kumaş olan dört parçanın üçüncü parçasıdır (C) ve New York'taki Brooklyn Müzesi'nde 41.1265 envanter numarası altında muhafaza edilmektedir {cite:tei-epigraphie 9321}."
  id: "Sepotong kain bergaya sutra dengan latar belakang merah dan dekorasi merah, hijau, kuning, dan putih, yang di atasnya tertulis teks pembuatan dalam bahasa Arab, bertanggal 132 H (749–750 M); ditemukan di Mesir, dan merupakan bagian ketiga (C) dari empat potong yang dulunya merupakan satu kain utuh, dan disimpan di Museum Brooklyn di New York dengan nomor inventaris 41.1265 {cite:tei-epigraphie 9321}."
