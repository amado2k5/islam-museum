label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — نيويورك"
  en: "Tiraz silk fragment, 132 AH — New York"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — نیویارک"
summary:
  ar: "قطعة من نسيج طراز حريري ذو أرضية حمراء وزخارف حمراء وخضراء وصفراء وبيضاء، كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها في مصر، وهي الجزء الثالث (C) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في متحف بروكلين بنيويورك برقم الجرد ٤١.١٢٦٥ {cite:tei-epigraphie 9321}."
  en: "A fragment of tiraz silk with a red ground and red, green, yellow and white motifs, bearing an Arabic maker's inscription dated 132 AH (749–750 CE); found in Egypt, it is part C of four fragments that once formed a single textile, held by the Brooklyn Museum, New York (accession 41.1265) {cite:tei-epigraphie 9321}."
  ur: "سرخ پس منظر والے طراز ریشم کا ٹکڑا جس پر سرخ، سبز، پیلے اور سفید نقش ہیں اور عربی دستاویزی تحریر 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتی ہے؛ مصر میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ C ہے، اور نیویارک کے بروکلن میوزیم میں محفوظ ہے ⁦(نمائندہ نمبر 41.1265)⁩ {cite:tei-epigraphie 9321}۔"
