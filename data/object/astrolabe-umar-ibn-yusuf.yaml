summary:
  ar: أسطرلاب نحاسي بتاريخ 690هـ/1291م صنعه عمر بن يوسف بن عمر بن علي بن رسول، سلطان اليمن الرسولي، وصنع
    بنفسه، اليمن؛ أقدم أسطرلاب باقٍ بصنع ملك معروف. المحفوظة في متحف المتروبوليتان للفن.
  en: Astrolabe of ‘Umar ibn Yusuf ibn ‘Umar ibn ‘Ali ibn Rasul al-Muzaffari; Metropolitan Museum of Art,
    accession 91.1.535a–h.
  fr: "Astrolabe de ‘Umar ibn Yusuf ibn ‘Umar ibn ‘Ali ibn Rasul al-Muzaffari ; Metropolitan Museum of Art, numéro d’inventaire 91.1.535a–h."
  es: "Astrolabio de 'Umar ibn Yusuf ibn 'Umar ibn 'Ali ibn Rasul al-Muzaffari; Museo Metropolitano de Arte, número de acceso 91.1.535a–h."
  ur: "عمر بن یوسف بن عمر بن علی ابن رسول المظفری کا فلکیات۔ میٹروپولیٹن میوزیم آف آرٹ، الحاق 91.1.535a–h۔"
  tr: "Yemen'in Resulullah Sultanı Ömer ibn Yusuf ibn Ömer ibn Ali ibn Rasul tarafından 690 Hicri/1291 Miladi yılında yapılmış ve bizzat kendisi tarafından üretilmiş pirinç bir usturlap. Bilinen bir hükümdar tarafından yapılmış ve günümüze kadar ulaşan en eski usturlaptır. Metropolitan Sanat Müzesi'nde sergilenmektedir."
  id: "Sebuah astrolabe kuningan bertanggal 690 H/1291 M, dibuat oleh Umar ibn Yusuf ibn Umar ibn Ali ibn Rasul, Sultan Rasulid Yaman, dan dikerjakan sendiri oleh beliau. Ini adalah astrolabe tertua yang masih ada yang dibuat oleh seorang raja yang dikenal. Astrolabe ini disimpan di Metropolitan Museum of Art."
