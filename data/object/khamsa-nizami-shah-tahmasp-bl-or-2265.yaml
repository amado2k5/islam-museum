summary:
  ar: "مخطوطة خمسة نظامي صنعت لشاه طهماسب في تبريز بين 1539 و1543م، تزين حواشيها رسوم بالذهب بلونين لحيوانات حقيقية وأسطورية، وفيها توريق «دوار» تأثر به المزخرفون العثمانيون {cite:titley-persian-miniature-painting-1983 p. 217} {cite:titley-persian-miniature-painting-1983 p. 225} {cite:titley-persian-miniature-painting-1983 p. 237}."
  en: "A Khamsa of Nizami made for Shah Tahmasp at Tabriz in 1539–43, its margins painted in two tones of gold with real and mythical animals, and a 'whirling' arabesque that may have inspired Ottoman illuminators {cite:titley-persian-miniature-painting-1983 p. 217} {cite:titley-persian-miniature-painting-1983 p. 225} {cite:titley-persian-miniature-painting-1983 p. 237}."
  ur: "تبریز میں 1539–43ء میں شاہ طہماسپ کے لیے بنی خمسۂ نظامی، جس کے حاشیوں پر دو رنگ کے سونے سے حقیقی اور افسانوی جانوروں کی تصاویر ہیں، اور ایک «گھومتا» ترنج جس سے عثمانی مذہّب متاثر ہوئے {cite:titley-persian-miniature-painting-1983 p. 225}."
