summary:
  ar: "نسخة من بستان سعدي في 229 ورقة و43 صورة، كتبها شهسوار الكاتب بالنستعليق لناصر الدين الخلجي سلطان مالوا، وصورها وذهّبها حاجي محمود في مندو، وفيها أصداء بعيدة لأسلوب بهزاد {cite:welch-india-art-and-culture-1985 p. 134}."
  en: "A Bustan of Sa'di of 229 folios and 43 miniatures, written in nasta'liq by Shahsuvar al-Katib for Nasir al-Din Khalji of Malwa and painted and illuminated by Haji Mahmud at Mandu, with distant echoes of Bihzad {cite:welch-india-art-and-culture-1985 p. 134}."
  fr: "Un Bustan de Sa’di de 229 feuillets et 43 miniatures, écrit en nasta’liq par Shahsuvar al-Katib pour Nasir al-Din Khalji du Malwa, peint et enluminé par Haji Mahmud à Mandu, avec de lointains échos de Bihzad {cite:welch-india-art-and-culture-1985 p. 134}."
  ur: "سعدی کی بوستان کا 229 اوراق اور 43 تصاویر کا نسخہ، جسے شہسوار الکاتب نے مالوہ کے ناصر الدین خلجی کے لیے نستعلیق میں لکھا اور حاجی محمود نے مانڈو میں مصور و مذہب کیا؛ اس میں بہزاد کی دور کی بازگشت ہے {cite:welch-india-art-and-culture-1985 p. 134}۔"
  es: "Un Bustan de Sa'di de 229 folios y 43 miniaturas, escrito en nasta'liq por Shahsuvar al-Katib para Nasir al-Din Khalji de Malwa y pintado e iluminado por Haji Mahmud en Mandu, con ecos lejanos de Bihzad {cite:welch-india-art-and-culture-1985 p. 134}."
  tr: "Saadi'nin 229 yapraklı ve 43 resimli Bustan'ının bir kopyası; Nasta'liq'te kâtip Şahswar tarafından Malwa Sultanı Nasiruddin Khilji için yazılmış, Mandu'da Hacı Mahmud tarafından resimlendirilmiş ve yaldızlanmıştır ve Behzad'ın üslubunun uzaktan yankılarını taşımaktadır {cite:welch-india-art-and-culture-1985 s. 134}."
  id: "Salinan Bustan karya Saadi dalam 229 lembar dan 43 ilustrasi, ditulis oleh Shahswar sang juru tulis di Nasta’liq untuk Nasiruddin Khilji, Sultan Malwa, dan diilustrasikan serta disepuh oleh Haji Mahmud di Mandu, dan memiliki gema samar dari gaya Behzad {cite:welch-india-art-and-culture-1985 p. 134}."
