summary:
  ar: "نسخة من بستان سعدي في 229 ورقة و43 صورة، كتبها شهسوار الكاتب بالنستعليق لناصر الدين الخلجي سلطان مالوا، وصورها وذهّبها حاجي محمود في مندو، وفيها أصداء بعيدة لأسلوب بهزاد {cite:welch-india-art-and-culture-1985 p. 134}."
  en: "A Bustan of Sa'di of 229 folios and 43 miniatures, written in nasta'liq by Shahsuvar al-Katib for Nasir al-Din Khalji of Malwa and painted and illuminated by Haji Mahmud at Mandu, with distant echoes of Bihzad {cite:welch-india-art-and-culture-1985 p. 134}."
  ur: "سعدی کی بوستان کا 229 اوراق اور 43 تصاویر کا نسخہ، جسے شہسوار الکاتب نے مالوہ کے ناصر الدین خلجی کے لیے نستعلیق میں لکھا اور حاجی محمود نے مانڈو میں مصور و مذہب کیا؛ اس میں بہزاد کی دور کی بازگشت ہے {cite:welch-india-art-and-culture-1985 p. 134}۔"
