summary:
  ar: "نسخة مصورة من قصة «چندايَن» التي نظمها الملا داود بالأودهية سنة 1377–1378، اقتنى متحف أمير ويلز في بومباي ثماني وستين من صورها من بهوبال سنة 1957، ويؤرخها ولش بنحو 1535–1540 {cite:welch-india-art-and-culture-1985 p. 136} {cite:welch-india-art-and-culture-1985 p. 137}."
  en: "An illustrated copy of the Chandayana romance composed in Avadhi by Mulla Da'ud in 1377-78, sixty-eight of whose miniatures the Prince of Wales Museum, Bombay, acquired from Bhopal in 1957, dated by Welch to about 1535-40 {cite:welch-india-art-and-culture-1985 p. 136} {cite:welch-india-art-and-culture-1985 p. 137}."
  ur: "ملا داؤد کی 1377–78ء میں اودھی میں لکھی داستان «چنداین» کا مصور نسخہ، جس کی اڑسٹھ تصویریں پرنس آف ویلز میوزیم بمبئی نے 1957ء میں بھوپال سے حاصل کیں؛ ویلچ اسے تقریباً 1535–40ء کا بتاتے ہیں {cite:welch-india-art-and-culture-1985 p. 136}۔"
