label: { ar: "قدح النبي", en: "the Prophet's mended cup", fr: "La coupe réparée du Prophète" }
summary:
  ar: "قدح النبي الذي انكسر فاتخذ مكان الشَّعب سلسلة من فضة؛ قال عاصم: رأيت القدح وشربت فيه — أي أنه بقي محفوظاً متداولاً بعد وفاة النبي {cite:sahih-al-bukhari 3109}."
  en: "The Prophet's drinking cup; when it broke, a silver chain was set in place of the splint (sha'b) that bound it, and it survived him as a kept relic — 'Asim says: I saw the cup and drank from it {cite:sahih-al-bukhari 3109}."
  fr: "La coupe à boire du Prophète ; lorsqu’elle se brisa, une chaîne d’argent fut placée à la place de l’attelle (sha’b) qui la maintenait, et elle lui survécut comme relique conservée — ‘Asim dit : j’ai vu la coupe et j’y ai bu {cite:sahih-al-bukhari 3109}."
