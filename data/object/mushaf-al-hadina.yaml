label: { ar: "مصحف الحاضنة ⁦(القيروان، نحو 410هـ)⁩", en: "Mushaf al-Hadina (\"Nurse's Qur'an\"), Qayrawan, ca. 1019–21", ur: "مصحفِ حاضنہ ⁦(قیروان، تقریباً 410ھ)⁩" }
summary:
  ar: "مصحف ضخم في ستين جزءًا على الرق، بصورة مغربية من الخط الجديد، شكله وذهّبه وجلّده علي بن أحمد الوراق بإشراف درّة الكاتبة، أوقفته فاطمة حاضنة أمير زيري على جامع القيروان سنة 410هـ {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 35}."
  en: "A monumental sixty-part Qur'an on parchment in a western variant of the new-style script, vocalised, illuminated and bound by Ali ibn Ahmad al-Warraq under the supervision of Durra al-Katiba, and endowed by Fatima, nursemaid of a Zirid prince, to the Great Mosque of Qayrawan in 410 AH {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 35}."
  ur: "چرمی ورق پر ساٹھ اجزا کا عظیم مصحف، نئے طرز کی مغربی صورت میں، جسے علی بن احمد الوراق نے درّہ الکاتبہ کی نگرانی میں اعراب، تذہیب اور جلد دی؛ ایک زیری شہزادے کی دایہ فاطمہ نے اسے 410ھ میں جامع قیروان پر وقف کیا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 35}۔"
