  tr: "Hattat Abbas Şakur Cüde tarafından 1997 ile 2000 yılları arasında Saddam Hüseyin'in emriyle kanla yazılan bir Kur'an, diktatörlük dönemine tanıklık etmeye devam ediyor ve bu dönemle nasıl başa çıkılacağı konusunda tartışmalara yol açıyor."
  id: "Al-Quran yang ditulis dengan darah oleh kaligrafer Abbas Shakour Joudah, atas perintah Saddam Hussein antara tahun 1997 dan 2000 M, tetap menjadi saksi era kediktatoran dan sumber kontroversi mengenai cara menanganinya."
