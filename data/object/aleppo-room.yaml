summary:
  ar: "غرفة استقبال خشبية مدهونة من بيت تجار حلب أوائل القرن السابع عشر؛ أقدم غرفة تقليدية محفوظة من سوريا، في متحف برلين للفن الإسلامي."
  en: "A painted wooden reception room from an Aleppo merchant's house, early 17th century; the oldest preserved Syrian room, in the Museum of Islamic Art, Berlin."
  fr: "Une salle de réception en bois peint provenant d’une maison de marchand à Alep, du début du XVIIe siècle ; la plus ancienne salle syrienne conservée, au musée d’Art islamique de Berlin."
  es: "Una sala de recepción de madera pintada procedente de la casa de un comerciante de Alepo, de principios del siglo XVII; la habitación siria más antigua que se conserva, en el Museo de Arte Islámico de Berlín."
  ur: "17ویں صدی کے اوائل میں حلب کے ایک تاجر کے گھر سے پینٹ شدہ لکڑی کا استقبالیہ کمرہ؛ میوزیم آف اسلامک آرٹ، برلن میں سب سے قدیم محفوظ شامی کمرہ۔"
  tr: "17. yüzyıl başlarında Halep'te bir tüccarın evinden kalma, boyalı ahşap bir kabul odası; Berlin İslam Sanatı Müzesi'nde bulunan, Suriye'den günümüze kadar korunmuş en eski geleneksel oda."
  id: "Ruang tamu kayu yang dicat dari rumah pedagang Aleppo awal abad ke-17; ruangan tradisional tertua yang masih terpelihara dari Suriah, di Museum Seni Islam Berlin."
