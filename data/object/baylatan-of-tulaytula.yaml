label: { ar: "بيلتا طليطلة" }
summary:
  ar: "من غرائب الأندلس بيلتان بطليطلة صنعهما عبد الرحمن — وهو أبو القاسم عبد الرحمن الزرقال في نسخة الرباط — لما سمع بخبر الطلسم الذي بمدينة أرين من أرض الهند أنه يدور بإصبعه من طلوع الفجر إلى غروب الشمس، فصنعهما في بيت مجوف في جوف النهر الأعظم بباب الدباغين، تمتلئان وتنحسران مع زيادة القمر ونقصانه نصف سبع في اليوم والليلة حتى يمتلئا ليلة خمس عشرة وينقصا بنقصان القمر حتى لا يبقى فيهما شيء ليلة تسعة وعشرين، ومن حلب لهما الماء ابتلعتاه، ومن أفرغهما امتلأتا من حينهما؛ ولم تزالا حتى ملك النصارى طليطلة فأمر الفنش أن تقلع إحداهما ليعلم من أين يأتي الماء فقلعت سنة 528هـ فبطلت حركتهما، وقيل إن سبب فسادهما المنجم اليهودي حتين بن ربوة الذي جلب حمام الأندلس إلى طليطلة في يوم واحد سنة 527هـ ووعد أن يجعلهما تمتلئان نهاراً وينحسران ليلاً فلما قلع إحداهما لم يقدر على ردها {cite:nafh-tib-maqqari p. 242-244}."
  en: "Toledo's twin marvels — two basins al-Zarqallu built in a vaulted chamber in the Great River at Bab al-Dabbaghin after hearing of the spinning talisman of India; they filled and ebbed with the waxing and waning moon by half a seventh each day, full on the fifteenth and dry by the twenty-ninth, and swelled back instantly if emptied. They worked until the Christians took Toledo and Alfonso had one lifted in 528 to learn its mechanism, killing both; another report blames the Jewish astrologer Hatim b. Rabuwa {cite:nafh-tib-maqqari p. 242-244}."
