label: { ar: "بيلتا طليطلة", en: "Baylatan of Toledo", fr: "Les deux bassins de Tolède", es: "Baylatán de Toledo", ur: "Toledo کے Baylatan", tr: "Belta Toledo", id: "Belta Toledo" }
summary:
  ar: "من غرائب الأندلس بيلتان بطليطلة صنعهما عبد الرحمن — وهو أبو القاسم عبد الرحمن الزرقال في نسخة الرباط — لما سمع بخبر الطلسم الذي بمدينة أرين من أرض الهند أنه يدور بإصبعه من طلوع الفجر إلى غروب الشمس، فصنعهما في بيت مجوف في جوف النهر الأعظم بباب الدباغين، تمتلئان وتنحسران مع زيادة القمر ونقصانه نصف سبع في اليوم والليلة حتى يمتلئا ليلة خمس عشرة وينقصا بنقصان القمر حتى لا يبقى فيهما شيء ليلة تسعة وعشرين، ومن حلب لهما الماء ابتلعتاه، ومن أفرغهما امتلأتا من حينهما؛ ولم تزالا حتى ملك النصارى طليطلة فأمر الفنش أن تقلع إحداهما ليعلم من أين يأتي الماء فقلعت سنة 528هـ فبطلت حركتهما، وقيل إن سبب فسادهما المنجم اليهودي حتين بن ربوة الذي جلب حمام الأندلس إلى طليطلة في يوم واحد سنة 527هـ ووعد أن يجعلهما تمتلئان نهاراً وينحسران ليلاً فلما قلع إحداهما لم يقدر على ردها {cite:nafh-tib-maqqari p. 242-244}."
  en: "Toledo's twin marvels — two basins al-Zarqallu built in a vaulted chamber in the Great River at Bab al-Dabbaghin after hearing of the spinning talisman of India; they filled and ebbed with the waxing and waning moon by half a seventh each day, full on the fifteenth and dry by the twenty-ninth, and swelled back instantly if emptied. They worked until the Christians took Toledo and Alfonso had one lifted in 528 to learn its mechanism, killing both; another report blames the Jewish astrologer Hatim b. Rabuwa {cite:nafh-tib-maqqari p. 242-244}."
  fr: "Les deux merveilles de Tolède — deux bassins qu’al-Zarqallu construisit dans une chambre voûtée du Grand Fleuve, à Bab al-Dabbaghin, après avoir entendu parler du talisman tournant de l’Inde ; ils se remplissaient et se vidaient avec la lune croissante et décroissante à raison d’un demi-septième par jour, pleins le quinze et secs le vingt-neuf, et se remplissaient aussitôt si on les vidait. Ils fonctionnèrent jusqu’à la prise de Tolède par les chrétiens et à l’enlèvement de l’un d’eux sur ordre d’Alphonse en 528 pour en comprendre le mécanisme, ce qui arrêta les deux ; un autre récit en attribue la responsabilité à l’astrologue juif Hatim b. Rabuwa {cite:nafh-tib-maqqari p. 242-244}."
  es: "Las dos maravillas de Toledo —dos pilas que al-Zarqallu construyó en una cámara abovedada en el Gran Río, en Bab al-Dabbaghin, tras oír hablar del talismán giratorio de la India— se llenaban y vaciaban con la luna creciente y menguante en media séptima parte cada día, llenas el día quince y secas el veintinueve, y volvían a llenarse instantáneamente si se vaciaban. Funcionaron hasta que los cristianos tomaron Toledo y Alfonso hizo levantar una en 528 para descubrir su mecanismo, lo que provocó la muerte de ambos; otro relato atribuye la muerte al astrólogo judío Hatim b. Rabuwa {cite:nafh-tib-maqqari p. 242-244}."
  ur: "ٹولیڈو کے جڑواں عجائبات - ہندوستان کے گھومتے ہوئے طلسم کی آواز سننے کے بعد باب الدباغین میں دریائے عظیم میں ایک وولٹڈ چیمبر میں بنائے گئے دو بیسن الزرقلو؛ وہ ہر روز نصف ساتویں تک موم اور ڈھلتے چاند سے بھر جاتے تھے، پندرہویں کو بھر جاتے تھے اور انتیسویں کو خشک ہوتے تھے، اور اگر خالی ہو جاتے تھے تو فوراً پھول جاتے تھے۔ انہوں نے اس وقت تک کام کیا جب تک کہ عیسائیوں نے ٹولیڈو کو نہیں لیا اور الفونسو نے اس کا طریقہ کار سیکھنے کے لیے 528 میں ایک کو اٹھایا، دونوں کو ہلاک کر دیا۔ ایک اور رپورٹ میں یہودی نجومی حاتم بی کو مورد الزام ٹھہرایا گیا ہے۔ ربوہ {حوالہ: نفح تبع مقری ص۔ 242-244}۔"
  tr: "Endülüs'ün tuhaflıkları arasında, Hindistan topraklarındaki Aryan şehrinde, parmağıyla gün doğumundan gün batımına kadar dönen bir tılsım hakkında bilgi edinen Abdülrahman (Rabat versiyonunda Ebu el-Kâsım Abdülrahman el-Zarkal) tarafından Toledo'da yaptırılan iki kemer de bulunmaktadır. Bu kemerleri, Bab el-Dabbaghin'deki büyük nehrin ortasındaki oyuk bir evde yaptırmıştır. Ayın evrelerinin yükselmesi ve alçalmasıyla dolup küçülürler, gündüz ve gece yarımşar tane dolarlar, on beşinci gecede tamamen dolarlar ve ayın alçalmasıyla tekrar azalırlar, yirmi dokuzuncu gecede ise içlerinde hiçbir şey kalmaz. Kim içine su sağarsa, onu yutarlar; kim boşaltırsa, hemen tekrar dolarlar. Bu kemerler, Toledo'nun Hristiyan kralı Fransızlara birinin nereden geldiğini öğrenmek için kaldırılmasını emredene kadar yerinde kalmıştır. 528 Hicri yılında kaldırılmış ve hareketleri durmuştur. Söylendiğine göre, bu hamamların bozulmasının sebebi, Hicri 527 yılında Endülüs hamamlarını bir günde Toledo'ya getiren ve gündüz dolup gece sularının çekileceğine söz veren Yahudi astrolog Hatin bin Rabwa'ydı. Hamamlardan birini kaldırdığında ise onu eski haline getiremedi. {kaynak:nafh-tib-maqqari s. 242-244}"
  id: "Di antara keanehan Andalusia terdapat dua sabuk di Toledo, yang dibuat oleh Abd al-Rahman — yang dalam versi Rabat disebut Abu al-Qasim Abd al-Rahman al-Zarqal — ketika ia mendengar tentang jimat di kota Arya di tanah India yang dapat berputar dengan jarinya dari matahari terbit hingga matahari terbenam. Maka ia membuatnya di sebuah rumah berongga di tengah sungai besar di Bab al-Dabbaghin. Sabuk-sabuk itu terisi dan menyusut seiring dengan bertambahnya dan berkurangnya bulan, setengah dari sepertujuh siang dan malam, hingga penuh pada malam kelima belas dan berkurang seiring dengan berkurangnya bulan hingga tidak ada yang tersisa di dalamnya pada malam kedua puluh sembilan. Siapa pun yang menuangkan air ke dalamnya, air itu akan terserap, dan siapa pun yang mengosongkannya, sabuk itu akan segera terisi kembali. Sabuk-sabuk itu tetap ada hingga raja Kristen Toledo, yang memerintahkan orang Prancis untuk mengambil salah satunya untuk mencari tahu dari mana air itu berasal. Sabuk itu diambil pada tahun 528 Hijriah, dan pergerakannya pun berhenti. Dikatakan bahwa penyebab kerusakan pemandian tersebut adalah karena ahli astrologi Yahudi, Hatin bin Rabwa, yang membawa pemandian Andalusia ke Toledo dalam satu hari pada tahun 527 Hijriah dan berjanji untuk membuatnya terisi air pada siang hari dan surut pada malam hari. Ketika ia memindahkan salah satu pemandian, ia tidak mampu mengembalikannya. {cite:nafh-tib-maqqari hlm. 242-244}."
