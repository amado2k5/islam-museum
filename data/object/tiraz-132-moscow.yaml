label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — موسكو"
  en: "Tiraz silk fragment, 132 AH — Moscow"
  fr: "Fragment de soie tiraz, 132 H — Moscou"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — ماسکو"
  es: "Fragmento de seda de Tiraz, 132 AH - Moscú"
  tr: "İpekten yapılmış bir desen parçası (132 AH) — Moskova"
  id: "Sepotong pola sutra (132 AH) — Moskow"
summary:
  ar: "قطعة من نسيج طراز في صورة قماش ⁦(٠٫٦٢ × ٠٫٢٣٥ م)⁩، كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها في مصر، وهي الجزء الأول (A) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة اليوم في متحف الثقافات الشرقية بموسكو، وكانت ضمن مجموعة في. س. غولينيشيف {cite:tei-epigraphie 11980}."
  en: "A fragment of tiraz silk woven as a textile (0.62 × 0.235 m), bearing an Arabic maker's inscription dated 132 AH (749–750 CE); found in Egypt, it is part A of four fragments that once formed a single textile, now held by the Museum of Oriental Cultures, Moscow, formerly in the Goleniščev collection {cite:tei-epigraphie 11980}."
  fr: "Un fragment d’étoffe de soie tiraz (0,62 × 0,235 m) portant une inscription de fabricant en arabe datée de 132 H (749–750 ap. J.-C.) ; découvert en Égypte, il constitue la partie A de quatre fragments ayant autrefois formé un seul textile, aujourd’hui conservée au musée des Cultures orientales de Moscou, auparavant dans la collection Goleniščev {cite:tei-epigraphie 11980}."
  ur: "طراز ریشم کا ٹکڑا ⁦(0.62 × 0.235 میٹر)⁩ جس پر عربی دستاویزی تحریر 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتی ہے؛ مصر میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ A ہے، آج ماسکو کے میوزیم آف اورینٹل کلچرز میں محفوظ ہے، پہلے وی۔ ایس۔ گولینیشیف کے مجموعے میں تھا {cite:tei-epigraphie 11980}۔"
  es: "Un fragmento de seda tiraz tejida como un textil (0,62 × 0,235 m), con una inscripción árabe del fabricante fechada en 132 AH (749–750 d. C.); encontrado en Egipto, es la parte A de cuatro fragmentos que alguna vez formaron un solo textil, ahora conservado en el Museo de Culturas Orientales de Moscú, anteriormente en la colección Goleniščev {cite:tei-epigraphie 11980}."
  tr: "Üzerinde Arapça üretim metni yazılı, 132 Hicri (749-750 Miladi) tarihli, kumaş şeklinde desenli bir kumaş parçası (0,62 × 0,235 m); Mısır'da bulunmuştur ve bir zamanlar tek bir kumaş olan dört parçanın ilk parçasıdır (A) ve şu anda Moskova'daki Doğu Kültürleri Müzesi'nde muhafaza edilmektedir ve V. S. Golenishchev'in koleksiyonunun bir parçasıydı {cite:tei-epigraphie 11980}."
  id: "Sepotong kain bermotif berbentuk kain (0,62 × 0,235 m), yang di atasnya tertulis teks pembuatan dalam bahasa Arab, bertanggal 132 H (749–750 M); ditemukan di Mesir, dan merupakan bagian pertama (A) dari empat potong yang dulunya merupakan satu kain, dan sekarang disimpan di Museum Kebudayaan Oriental di Moskow, dan merupakan bagian dari koleksi V. S. Golenishchev {cite:tei-epigraphie 11980}."
