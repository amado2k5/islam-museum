label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — موسكو"
  en: "Tiraz silk fragment, 132 AH — Moscow"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — ماسکو"
summary:
  ar: "قطعة من نسيج طراز في صورة قماش ⁦(٠٫٦٢ × ٠٫٢٣٥ م)⁩، كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها في مصر، وهي الجزء الأول (A) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة اليوم في متحف الثقافات الشرقية بموسكو، وكانت ضمن مجموعة في. س. غولينيشيف {cite:tei-epigraphie 11980}."
  en: "A fragment of tiraz silk woven as a textile (0.62 × 0.235 m), bearing an Arabic maker's inscription dated 132 AH (749–750 CE); found in Egypt, it is part A of four fragments that once formed a single textile, now held by the Museum of Oriental Cultures, Moscow, formerly in the Goleniščev collection {cite:tei-epigraphie 11980}."
  ur: "طراز ریشم کا ٹکڑا ⁦(0.62 × 0.235 میٹر)⁩ جس پر عربی دستاویزی تحریر 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتی ہے؛ مصر میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ A ہے، آج ماسکو کے میوزیم آف اورینٹل کلچرز میں محفوظ ہے، پہلے وی۔ ایس۔ گولینیشیف کے مجموعے میں تھا {cite:tei-epigraphie 11980}۔"
