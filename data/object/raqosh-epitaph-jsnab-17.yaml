summary:
  ar: "كتابة جنائزية بالآرامية النبطية والعربية القديمة بالخط النبطي العربي، على واجهة مقبرة في الحِجر ⁦(مدائن صالح)⁩، مؤرخة بحزيران أو تموز 267م، ذكر فيها كعبو بن حرتت أنه بنى القبر لأمه رقوش {cite:diconab-inscription-196} {cite:wikipedia-jsnab-17-en}."
  en: "A funerary text in Nabataean Aramaic and Old Arabic in the Nabataeo-Arabic script on a tomb facade at al-Hijr (Mada'in Salih), dated June or July 267 CE, in which Ka'bu son of Hrtt says he built the tomb for his mother Raqosh {cite:diconab-inscription-196} {cite:wikipedia-jsnab-17-en}."
  ur: "نبطی آرامی اور قدیم عربی میں نبطی-عربی رسم الخط میں تدفینی تحریر، الحجر ⁦(مدائنِ صالح)⁩ میں ایک مقبرے کے سامنے کے حصے پر، جون یا جولائی 267 عیسوی کی، جس میں کعبو بن حرتت کہتا ہے کہ اس نے اپنی ماں رقوش کے لیے مقبرہ بنایا {cite:diconab-inscription-196} {cite:wikipedia-jsnab-17-en}۔"
  fr: "Texte funéraire en araméen nabatéen et vieil arabe, en écriture nabatéo-arabe, sur la façade d'un tombeau à al-Hijr (Mada'in Salih), daté de juin ou juillet 267, où Ka'bu fils de Hrtt dit avoir construit le tombeau pour sa mère Raqosh {cite:diconab-inscription-196} {cite:wikipedia-jsnab-17-en}."
  es: "Texto funerario en arameo nabateo y árabe antiguo, en escritura nabateo-árabe, en la fachada de una tumba en al-Hijr (Mada'in Salih), fechado en junio o julio de 267, en el que Ka'bu hijo de Hrtt dice haber construido la tumba para su madre Raqosh {cite:diconab-inscription-196} {cite:wikipedia-jsnab-17-en}."
