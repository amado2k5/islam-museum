id: object/burda-of-kab-ibn-zuhayr
tags: [wasaya-browser, wasaya-legacy, wasaya-athar]
class: object
kind: relic
label:
  ar: "بردة كعب بن زهير"
  en: "The mantle (burda) given to Ka'b ibn Zuhayr"
  fr: "Le manteau (burda) donné à Ka’b ibn Zuhayr"
  ur: "کعب بن زہیر کو عطا ہونے والی چادر ⁦(بُردہ)⁩"
summary:
  ar: "تذكر كتب الصحابة أن النبي كسا كعب بن زهير بردة له لما أسلم وأنشده قصيدته {cite:isaba scan vol. 2 p. 1276} {cite:usd-al-ghaba scan vol. 1 p. 1037}. ويروي ابن الأثير أن معاوية طلب شراءها فأبى كعب أن يؤثر بثوب رسول الله أحداً، فلما مات اشتراها معاوية من أولاده بعشرين ألف درهم، وهي البردة التي عند الخلفاء {cite:kamil-ibn-al-athir scan vol. 1 p. 145}، وفي الإصابة أن الخلفاء يلبسونها في الأعياد {cite:isaba scan vol. 2 p. 1276}. ويقول ابن كثير إن ذلك مشهور جداً لكنه لم يره في الكتب المشهورة بإسناد يرتضيه {cite:al-bidaya-wal-nihaya scan vol. 6 p. 843}، ويذكر أن بردة الخلفاء العباسيين هي بردة أهل أيلة التي اشتراها السفاح بثلاثمائة دينار {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}."
  en: "The books on the Companions say the Prophet clothed Ka'b ibn Zuhayr in a mantle of his when he became Muslim and recited his ode {cite:isaba scan vol. 2 p. 1276} {cite:usd-al-ghaba scan vol. 1 p. 1037}. Ibn al-Athir reports that Mu'awiya asked to buy it and Ka'b refused to prefer anyone over the Messenger's garment, but after Ka'b died Mu'awiya bought it from his sons for twenty thousand dirhams, and it is the burda the caliphs have {cite:kamil-ibn-al-athir scan vol. 1 p. 145}; the Isaba adds that the caliphs wore it at the festivals {cite:isaba scan vol. 2 p. 1276}. Ibn Kathir says this is very well known but he did not see it in the famous books with a chain he accepts {cite:al-bidaya-wal-nihaya scan vol. 6 p. 843}, and he gives the caliphs' mantle as that of the people of Ayla, which al-Saffah bought for three hundred dinars {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}."
  fr: "Les livres sur les Compagnons indiquent que le Prophète revêtit Ka’b ibn Zuhayr de l’un de ses manteaux lorsqu’il devint musulman et récita son ode {cite:isaba scan vol. 2 p. 1276} {cite:usd-al-ghaba scan vol. 1 p. 1037}. Ibn al-Athir rapporte que Mu’awiya demanda à l’acheter et que Ka’b refusa de préférer quiconque au vêtement du Messager, mais qu’après la mort de Ka’b, Mu’awiya l’acheta à ses fils pour vingt mille dirhams, et qu’il s’agit de la burda que possèdent les califes {cite:kamil-ibn-al-athir scan vol. 1 p. 145} ; l’Isaba ajoute que les califes la portaient lors des fêtes {cite:isaba scan vol. 2 p. 1276}. Ibn Kathir dit que cela est très connu, mais qu’il ne l’a pas trouvé dans les ouvrages célèbres avec une chaîne de transmission qu’il accepte {cite:al-bidaya-wal-nihaya scan vol. 6 p. 843}, et présente le manteau des califes comme celui des habitants d’Ayla, qu’al-Saffah acheta pour trois cents dinars {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}."
  ur: "صحابہ کی کتابیں بتاتی ہیں کہ جب کعب بن زہیر اسلام لائے اور اپنا قصیدہ سنایا تو نبی نے انہیں اپنی ایک چادر ⁦(بُردہ)⁩ اوڑھائی {cite:isaba scan vol. 2 p. 1276} {cite:usd-al-ghaba scan vol. 1 p. 1037}۔ ابن اثیر روایت کرتے ہیں کہ معاویہ نے اسے خریدنا چاہا تو کعب نے رسول اللہ کے کپڑے پر کسی کو ترجیح دینے سے انکار کیا، مگر کعب کے مرنے کے بعد معاویہ نے اسے ان کی اولاد سے بیس ہزار درہم میں خرید لیا، اور یہی وہ بُردہ ہے جو خلفاء کے پاس ہے {cite:kamil-ibn-al-athir scan vol. 1 p. 145}؛ الاصابہ میں اضافہ ہے کہ خلفاء اسے عیدوں میں پہنتے تھے {cite:isaba scan vol. 2 p. 1276}۔ ابن کثیر کہتے ہیں کہ یہ بات بہت مشہور ہے لیکن انہیں یہ مشہور کتابوں میں کسی پسندیدہ سند سے نہیں ملی {cite:al-bidaya-wal-nihaya scan vol. 6 p. 843}، اور وہ عباسی خلفاء کے بُردے کو اہلِ ایلہ والا بُردہ بتاتے ہیں جسے سفاح نے تین سو دینار میں خریدا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}۔"
