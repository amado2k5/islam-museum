label: { ar: "المصحف العثماني بقرطبة" }
summary:
  ar: "المصحف العثماني الذي كان بقرطبة وهو أحد المصاحف الأربعة التي بعث بها عثمان إلى الأمصار؛ أُخرج من قرطبة ليلة السبت حادي عشر شوال سنة اثنتين وخمسين وخمسمائة في أيام عبد المؤمن بن علي وبأمره، وظل الموحدون يحملونه في أسفارهم متبركين به حتى حمله المعتضد السعيد بن المأمون حين توجه إلى تلمسان آخر سنة 645 فقتل قربها ونهب المصحف فقيل إنه صار إلى خزانة ملوك تلمسان، حتى افتتحها أبو الحسن المريني أواخر رمضان سنة 737 فظفر به ثم أصيب في وقعة طريف سنة 741 وحصل في بلاد برتقال فأُعملت الحيلة في استخلاصه حتى وصل إلى فاس سنة 745 على يد تاجر من تجار أزمور؛ ونقل ابن مرزوق أن السلطان أبا الحسن لا يسافر إلا ومعه، وذكر ابن عبد الملك أن ما قيل إن فيه دم عثمان بعيد وإن يكن أحدها فلعله الشامي، وعاين التجيبي الشامي بمقصورة جامع بني أمية سنة 657 والمكي بقبة التراب، ونص ظهر المدني على أن الجمع إنما كان بجماعة من الصحابة منهم زيد بن ثابت وعبد الله بن الزبير وسعيد بن العاص {cite:nafh-tib-maqqari p. 641-643}."
  en: "The Uthmanic codex of Cordoba, held to be one of the four Uthman sent to the garrison cities; Abd al-Mu'min b. Ali carried it out of Cordoba on 11 Shawwal 552, the Almohads bore it on campaign for blessing until the amir Sa'id's defeat near Tlemcen in 645 scattered it to the Zayyanid treasury, whence Abu l-Hasan al-Marini took it in Ramadan 737, lost it at Tarifa in 741 into Portugal, and redeemed it through an Azemmour merchant to Fes by 745; Ibn Abd al-Malik doubted the blood-of-Uthman claim, and al-Tujibi had seen the Damascene copy in the Umayyad mosque's maqsura in 657 and the Meccan under Qubbat al-Turab {cite:nafh-tib-maqqari p. 641-643}."
