label:
  ar: "طاووس غسل اليدين — ورقة من كتاب الجزري"
  en: "Peacock hand-washing device — folio from al-Jazari's book"
  fr: "Dispositif de lavage des mains en forme de paon — feuillet du livre d’al-Jazari"
  ur: "ہاتھ دھونے کا طاؤس — جزری کی کتاب کا ورق"
  es: "Dispositivo para lavarse las manos con forma de pavo real — folio del libro de al-Jazari"
summary:
  ar: "ورقة سورية مؤرخة 1315م، وجهها يصور طاووساً لغسل اليدين وظهرها يشرح تسلسل الماء والعوامة والصابون والمنديل، من كتاب الجزري لا كتاب الدرياق. يحفظها كليفلاند برقم 1945.383؛ بناء الآلة فعلاً غير مؤكد {cite:cleveland-jazari-peacock recto and verso catalogues}."
  en: "A Syrian folio dated 1315: the recto illustrates the peacock washer and the verso explains water, float, soap and towel sequence, from al-Jazari's book, not the Book of Theriac. Cleveland 1945.383; actual construction of the machine is uncertain {cite:cleveland-jazari-peacock recto and verso catalogues}."
  fr: "Un feuillet syrien daté de 1315 : le recto représente le paon lave-mains et le verso explique la séquence de l’eau, du flotteur, du savon et de la serviette, tiré du livre d’al-Jazari, et non du Livre de la thériaque. Cleveland 1945.383 ; la construction effective de la machine est incertaine {cite:cleveland-jazari-peacock recto and verso catalogues}."
  ur: "1315ء کا شامی ورق؛ سامنے طاؤس، پشت پر پانی، تیراک، صابن اور تولیے کی ترتیب۔ جزری کی کتاب سے ہے، کتاب التریاق سے نہیں۔ کلیولینڈ 1945.383؛ اصل مشین کی تعمیر غیر یقینی {cite:cleveland-jazari-peacock recto and verso catalogues}۔"
  es: "Un folio sirio fechado en 1315: el anverso ilustra la lavadora pavo real y el reverso explica la secuencia de agua, flotador, jabón y toalla, del libro de al-Jazari, no del Libro de Theriac. Cleveland 1945.383; la construcción real de la máquina es incierta {cite:cleveland-jazari-peacock recto and verso catalogues}."
