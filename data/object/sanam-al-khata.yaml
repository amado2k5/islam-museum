summary:
  ar: "صنم في نهاية الشرق الشمالي قريب من السند، كان يُحج إليه — عدّه ابن فضل الله العمري في الآثار المشهورة الباقية {cite:umari-masalik-1924 p. 229}."
  en: "The idol at the far north-east near Sind to which pilgrimage was made, counted by al-Umari among the surviving famous monuments {cite:umari-masalik-1924 p. 229}."
  fr: "L’idole de l’extrême nord-est, près du Sind, vers laquelle on se rendait en pèlerinage, comptée par al-Umari parmi les célèbres monuments conservés {cite:umari-masalik-1924 p. 229}."
  es: "El ídolo en el extremo noreste cerca de Sind, al que se realizaban peregrinaciones, fue contado por al-Umari entre los monumentos famosos que aún se conservan {cite:umari-masalik-1924 p. 229}."
  ur: "سندھ کے قریب شمال مشرق میں واقع وہ بت جس کی زیارت کی گئی تھی، جسے عمری نے زندہ بچ جانے والی مشہور یادگاروں میں شمار کیا تھا۔ 229}۔"
