label: { ar: "قطعة الشطرنج العاجية من عمل يوسف البهليلي", en: "Ivory chessman signed by Yusuf al-Bahlili", fr: "Pièce d’échecs en ivoire signée Yusuf al-Bahlili", ur: "یوسف البہلیلی کا ہاتھی دانت کا شطرنج کا مہرہ", es: "Pieza de ajedrez de marfil firmada por Yusuf al-Bahlili.", tr: "Fildişi satranç taşı, Youssef Al-Bahlili'nin bir eseridir.", id: "Buah catur dari gading ini adalah karya Youssef Al-Bahlili." }
summary:
  ar: "قطعة شطرنج من العاج تمثل ملكاً على هودج فيل وسط معركة، عليها بالكوفي «من عمل يوسف البهليلي»، يرجح ملكيان شيرواني صنعها في شمال غرب الهند في كنف الغزنويين أواخر القرن الحادي عشر أو أوائل الثاني عشر؛ في خزانة الأوسمة بالمكتبة الوطنية في باريس {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  en: "An ivory chess piece showing a king on an elephant's howdah in battle, inscribed in Kufic 'from the work of Yusuf al-Bahlili', which Melikian-Chirvani places in northwestern India under the Ghaznavids in the late eleventh or early twelfth century; in the Cabinet des Médailles of the Bibliothèque nationale, Paris {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  fr: "Une pièce d’échecs en ivoire représentant un roi sur le howdah d’un éléphant au combat, portant en coufique « de l’œuvre de Yusuf al-Bahlili », que Melikian-Chirvani situe dans le nord-ouest de l’Inde sous les Ghaznévides à la fin du XIe ou au début du XIIe siècle ; au Cabinet des médailles de la Bibliothèque nationale, à Paris {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  ur: "ہاتھی دانت کا شطرنج کا مہرہ جس میں جنگ کے دوران ہاتھی کے ہودے پر ایک بادشاہ ہے، اس پر کوفی میں «من عمل یوسف البہلیلی» لکھا ہے؛ ملیکیان شیروانی اسے گیارھویں صدی کے آخر یا بارھویں کے اوائل میں غزنوی عمل داری کے شمال مغربی ہندوستان کا بتاتے ہیں؛ پیرس کی قومی لائبریری کے کابینے دے میدای میں {cite:welch-india-art-and-culture-1985 p. 126}۔"
  es: "Una pieza de ajedrez de marfil que muestra a un rey sobre la howdah de un elefante en batalla, con una inscripción en cúfico que dice \"de la obra de Yusuf al-Bahlili\", que Melikian-Chirvani sitúa en el noroeste de la India bajo los gaznávidas a finales del siglo XI o principios del XII; en el Gabinete de Medallas de la Biblioteca Nacional de París {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  tr: "Fildişi bir satranç taşı, savaşın ortasında bir fil sırtında oturan bir kralı tasvir ediyor ve üzerinde Kufi yazısıyla \"Yusuf el-Bahlili tarafından\" yazıyor; muhtemelen 11. yüzyılın sonlarında veya 12. yüzyılın başlarında Gazneviler döneminde kuzeybatı Hindistan'da bir Şervani kralı tarafından yapılmıştır; Paris'teki Ulusal Kütüphane'nin dekorasyon dolabında bulunmaktadır. {cite:welch-india-art-and-culture-1985 s. 126} {cite:welch-india-art-and-culture-1985 s. 127}"
  id: "Sebuah bidak catur gading yang menggambarkan seorang raja di atas tandu gajah di tengah pertempuran, bertuliskan aksara Kufi \"oleh Yusuf al-Bahlili,\" kemungkinan dibuat oleh seorang raja Sherwani di India barat laut di bawah kekuasaan Ghaznavid pada akhir abad ke-11 atau awal abad ke-12; berada di lemari dekorasi Perpustakaan Nasional di Paris {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
