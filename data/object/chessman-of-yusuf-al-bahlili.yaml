id: object/chessman-of-yusuf-al-bahlili
class: object
kind: other
label: { ar: "قطعة الشطرنج العاجية من عمل يوسف البهليلي", en: "Ivory chessman signed by Yusuf al-Bahlili", ur: "یوسف البہلیلی کا ہاتھی دانت کا شطرنج کا مہرہ" }
summary:
  ar: "قطعة شطرنج من العاج تمثل ملكاً على هودج فيل وسط معركة، عليها بالكوفي «من عمل يوسف البهليلي»، يرجح ملكيان شيرواني صنعها في شمال غرب الهند في كنف الغزنويين أواخر القرن الحادي عشر أو أوائل الثاني عشر؛ في خزانة الأوسمة بالمكتبة الوطنية في باريس {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  en: "An ivory chess piece showing a king on an elephant's howdah in battle, inscribed in Kufic 'from the work of Yusuf al-Bahlili', which Melikian-Chirvani places in northwestern India under the Ghaznavids in the late eleventh or early twelfth century; in the Cabinet des Médailles of the Bibliothèque nationale, Paris {cite:welch-india-art-and-culture-1985 p. 126} {cite:welch-india-art-and-culture-1985 p. 127}."
  ur: "ہاتھی دانت کا شطرنج کا مہرہ جس میں جنگ کے دوران ہاتھی کے ہودے پر ایک بادشاہ ہے، اس پر کوفی میں «من عمل یوسف البہلیلی» لکھا ہے؛ ملیکیان شیروانی اسے گیارھویں صدی کے آخر یا بارھویں کے اوائل میں غزنوی عمل داری کے شمال مغربی ہندوستان کا بتاتے ہیں؛ پیرس کی قومی لائبریری کے کابینے دے میدای میں {cite:welch-india-art-and-culture-1985 p. 126}۔"
