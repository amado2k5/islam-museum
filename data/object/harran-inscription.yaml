label:
  ar: "نقش حران في اللجاة"
  en: "The Harran inscription in the Lajah"
  ur: "لجاۃ میں حران کا کتبہ"
  fr: "L'inscription de Harran dans le Lajah"
  es: "La inscripción de Harran en el Lajah"
  tr: "Al-Lajat'taki Harran yazıtı"
  id: "Prasasti Harran di Al-Lajat"
summary:
  ar: "كتابة تأسيس مسيحية باليونانية والعربية القديمة في مزار شهيد بحران من محافظة السويداء، مؤرخة بسنة 567 أو 568م، تذكر أن الفيلارك شرحبيل بن ظالم بنى مزاراً للقديس يوحنا {cite:wikipedia-harran-inscription-en}."
  en: "A Christian dedicatory inscription in Greek and Old Arabic at a martyr shrine at Harran in as-Suwayda Governorate, dated 567 or 568 CE, recording that the phylarch Sharahil son of Zalim built a martyrium of Saint John {cite:wikipedia-harran-inscription-en}."
  ur: "محافظۃ السویدا کے حران میں ایک شہیدی مزار پر یونانی اور قدیم عربی میں مسیحی تاسیسی کتبہ، 567 یا 568 عیسوی کا، جو درج کرتا ہے کہ فیلارک شرحبیل بن ظالم نے سینٹ جان کا مزار بنایا {cite:wikipedia-harran-inscription-en}۔"
  fr: "Inscription de dédicace chrétienne en grec et en vieil arabe dans un sanctuaire martyrial de Harran, dans le gouvernorat de Soueïda, datée de 567 ou 568, consignant que le phylarque Sharahil fils de Zalim a construit un martyrium de saint Jean {cite:wikipedia-harran-inscription-en}."
  es: "Inscripción dedicatoria cristiana en griego y árabe antiguo en un santuario martirial de Harran, en la gobernación de Suwayda, fechada en 567 o 568, que registra que el filarca Sharahil hijo de Zalim construyó un martirio de San Juan {cite:wikipedia-harran-inscription-en}."
  tr: "Suveyda Valiliği'ndeki Harran şehit türbesinde bulunan ve Hristiyanlığı eski Yunanca ve Arapça olarak kuran, 567 veya 568 yılına tarihlenen yazıtta, Filarmoni Şarhabil bin Zalim'in Aziz Yuhanna için bir türbe inşa ettirdiğinden bahsedilir. {cite:wikipedia-harran-inscription-en}"
  id: "Prasasti yang menetapkan agama Kristen dalam bahasa Yunani kuno dan Arab di makam martir Harran di Kegubernuran Suwaida, bertanggal 567 atau 568 M, menyebutkan bahwa Philarch Sharhabil bin Zalim membangun sebuah makam untuk Santo Yohanes {cite:wikipedia-harran-inscription-en}."
