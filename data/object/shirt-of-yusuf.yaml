tags: [wasaya-browser, wasaya-legacy, wasaya-athar, wasaya-mirath, wasaya-wasiyya]
label:
  ar: "قميص يوسف الذي أُرسل إلى أبيه، وما رُوي من أنه قميص إبراهيم"
  en: "The shirt of Yusuf sent to his father, and the report that it was Ibrahim's shirt"
  fr: "La chemise de Yusuf envoyée à son père et le récit selon lequel elle était celle d’Ibrahim"
  ur: "یوسف کا وہ قمیص جو والد کو بھیجا گیا، اور یہ روایت کہ وہ ابراہیم کا قمیص تھا"
summary:
  ar: "تذكر آيات سورة يوسف أن يوسف أرسل قميصه ليُلقى على وجه أبيه فيرتد بصيراً، ويقول ابن كثير إنه القميص الذي يلي جسده وإن هذا من أكبر المعجزات {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 326} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 327}. وينقل القرطبي عن مجاهد أنه قميص إبراهيم من حرير الجنة الذي ألبسه الله إياه في النار، ورثه إسحاق ثم يعقوب، وجعله يعقوب في قصبة من فضة في عنق يوسف {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3670} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. وفي قول آخر أنه القميص المقدود من دبر، ويرجح القرطبي الأول {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. وتذكر رواية عن وهب بن منبه أن جبريل أخرج القميص وألبسه يوسف في الجب {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3555}."
  en: "The verses of Surat Yusuf say that Yusuf sent his shirt to be thrown over his father's face so that he would regain his sight; Ibn Kathir says it was the shirt next to his body and among the greatest miracles {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 326} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 327}. Al-Qurtubi quotes Mujahid that it was Ibrahim's shirt of Paradise silk which God put on him in the fire, inherited by Ishaq and then Yaqub, who put it in a silver tube round Yusuf's neck {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3670} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. Another view is that it was the shirt torn from behind, and al-Qurtubi prefers the first {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. A report linked to Wahb ibn Munabbih says Jibril took out the shirt and put it on Yusuf in the pit {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3555}."
  fr: "Les versets de la sourate Yusuf racontent que Yusuf envoya sa chemise pour qu’elle soit jetée sur le visage de son père afin qu’il retrouve la vue ; Ibn Kathir dit qu’il s’agissait de la chemise portée à même son corps et de l’un des plus grands miracles {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 326} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 327}. Al-Qurtubi rapporte d’après Mujahid qu’elle était la chemise de soie du Paradis dont Dieu avait revêtu Ibrahim dans le feu, transmise à Ishaq puis à Yaqub, qui la plaça dans un tube d’argent autour du cou de Yusuf {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3670} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. Un autre avis y voit la chemise déchirée par-derrière, mais al-Qurtubi préfère le premier {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}. Un récit lié à Wahb ibn Munabbih dit que Jibril sortit la chemise et en revêtit Yusuf dans la fosse {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3555}."
  ur: "سورۂ یوسف کی آیات بتاتی ہیں کہ یوسف نے اپنا قمیص بھیجا کہ والد کے چہرے پر ڈالا جائے تو ان کی بینائی لوٹ آئے؛ ابن کثیر کہتے ہیں کہ وہ جسم سے لگا ہوا قمیص تھا اور یہ سب سے بڑے معجزوں میں سے ہے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 326} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 327}۔ قرطبی مجاہد سے نقل کرتے ہیں کہ وہ ابراہیم کا جنت کے ریشم کا قمیص تھا جو اللہ نے آگ میں پہنایا، اسحاق اور پھر یعقوب کو ورثے میں ملا، اور یعقوب نے اسے چاندی کی نلکی میں رکھ کر یوسف کی گردن میں ڈالا {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3670} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}۔ ایک اور قول ہے کہ وہ پیچھے سے پھٹا قمیص تھا، اور قرطبی پہلے کو ترجیح دیتے ہیں {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3671}۔ وہب بن منبہ سے جڑی ایک روایت ہے کہ جبریل نے کنویں میں وہ قمیص نکال کر یوسف کو پہنایا {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 3555}۔"
