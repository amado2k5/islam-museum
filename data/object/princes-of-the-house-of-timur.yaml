label: { ar: "«أمراء البيت التيموري»، لوحة على القماش في المتحف البريطاني", en: "Princes of the House of Timur, painting on cotton, British Museum", fr: "Princes de la maison de Timur, peinture sur coton, British Museum", ur: "«خاندانِ تیمور کے شہزادے»، کپڑے پر تصویر، برٹش میوزیم", es: "Príncipes de la Casa de Timur, pintura sobre algodón, Museo Británico" }
summary:
  ar: "لوحة كبيرة بالألوان المعتمة على القطن ⁦(108.5 × 108 سم)⁩ من أقدم مراحل التصوير المغولي نحو 1545–1550، تنسب على الأرجح إلى عبد الصمد، أضيفت إليها في عهد جهانكير نحو 1607 صور أكبر وجهانكير والأمير خرم؛ في المتحف البريطاني {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
  en: "A large opaque watercolour on cotton (108.5 x 108 cm) from the earliest phase of Mughal painting, ca. 1545-50, probably by Abd al-Samad, to which portraits of Akbar, Jahangir and Prince Khurram were added around 1607; in the British Museum {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
  fr: "Une grande aquarelle opaque sur coton (108,5 × 108 cm) des débuts de la peinture moghole, vers 1545–1550, probablement d’Abd al-Samad, à laquelle furent ajoutés des portraits d’Akbar, de Jahangir et du prince Khurram vers 1607 ; au British Museum {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
  ur: "سوتی کپڑے پر غیر شفاف آبی رنگوں کی بڑی تصویر ⁦(108.5 × 108 سم)⁩، مغل مصوری کے ابتدائی دور، تقریباً 1545–50، کی، غالباً عبدالصمد کی؛ اس میں تقریباً 1607ء میں اکبر، جہانگیر اور شہزادہ خرم کی شبیہیں شامل کی گئیں؛ برٹش میوزیم میں {cite:welch-india-art-and-culture-1985 p. 144}۔"
  es: "Una gran acuarela opaca sobre algodón (108,5 x 108 cm) de la fase más temprana de la pintura mogol, ca. 1545-50, probablemente de Abd al-Samad, a la que se añadieron retratos de Akbar, Jahangir y el príncipe Khurram alrededor de 1607; en el Museo Británico {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
