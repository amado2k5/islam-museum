summary:
  ar: "لوحة كبيرة بالألوان المعتمة على القطن (108.5 × 108 سم) من أقدم مراحل التصوير المغولي نحو 1545–1550، تنسب على الأرجح إلى عبد الصمد، أضيفت إليها في عهد جهانكير نحو 1607 صور أكبر وجهانكير والأمير خرم؛ في المتحف البريطاني {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
  en: "A large opaque watercolour on cotton (108.5 x 108 cm) from the earliest phase of Mughal painting, ca. 1545-50, probably by Abd al-Samad, to which portraits of Akbar, Jahangir and Prince Khurram were added around 1607; in the British Museum {cite:welch-india-art-and-culture-1985 p. 120} {cite:welch-india-art-and-culture-1985 p. 143} {cite:welch-india-art-and-culture-1985 p. 144}."
  ur: "سوتی کپڑے پر غیر شفاف آبی رنگوں کی بڑی تصویر (108.5 × 108 سم)، مغل مصوری کے ابتدائی دور، تقریباً 1545–50، کی، غالباً عبدالصمد کی؛ اس میں تقریباً 1607ء میں اکبر، جہانگیر اور شہزادہ خرم کی شبیہیں شامل کی گئیں؛ برٹش میوزیم میں {cite:welch-india-art-and-culture-1985 p. 144}۔"
