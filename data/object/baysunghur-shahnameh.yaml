  tr: "Timurlu prens Baysunghur'un emriyle 1430 yılında Herat'ta basılan, Ferdowsi'nin Şahname'sinin lüks bir nüshası; en büyük resimli Farsça el yazmalarından biri."
  id: "Salinan mewah Shahnameh karya Ferdowsi, disalin di Herat pada tahun 1430 atas perintah pangeran Timurid Baysunghur; salah satu manuskrip Persia bergambar terbesar."
