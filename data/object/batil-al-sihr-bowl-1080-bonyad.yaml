  ar: "طاس صغيرة من النحاس الأصفر منقوشة بالثلث والنستعليق، عليها صور البروج الاثني عشر والرقم 1080، صنعت في السنة الثانية من حكم الشاه سليمان الصفوي، محفوظة في خزانة التاريخ بمؤسسة متاحف بنياد {cite:joudaki-azizi-batil-al-sihr-bowl p. 3} {cite:joudaki-azizi-batil-al-sihr-bowl p. 22} {cite:joudaki-azizi-batil-al-sihr-bowl p. 25}."
