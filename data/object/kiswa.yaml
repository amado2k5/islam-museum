label:
  ar: كسوة الكعبة
  en: The Kiswa
summary:
  ar: "كسوة الكعبة ستار أسود في الغالب مطرز بالذهب، وتذكر دائرة المعارف الإسلامية أن مصر دأبت على توريدها منذ العهد المملوكي إلا في فترات التوتر السياسي. وكان المحمل المصري يسير مع ركب الحج لكنه لم يحمل الكسوة، وانقطع إرساله سنة 1926 وأُلغيت مواكبه سنة 1952. وتتناول الصفحة أيضاً ما نقله العمري عن كسوة الكعبة في عصره."
  en: "The kiswa is the largely black, gold-embroidered covering of the Kaaba. The Encyclopaedia of Islam says Egypt traditionally supplied it from Mamluk times, except in periods of political tension. The Egyptian mahmal travelled with the pilgrim caravan but did not carry the kiswa, and its sending stopped in 1926 and its processions in 1952. The page also gathers al-Umari's report on the covering in his day."
  ur: "کسوہ کعبہ کا عموماً سیاہ اور سونے کی کڑھائی والا غلاف ہے۔ اسلامی انسائیکلوپیڈیا کے مطابق مصر مملوک دور سے اسے فراہم کرتا رہا، سوائے سیاسی کشیدگی کے ادوار کے۔ مصری محمل حج قافلے کے ساتھ چلتا تھا مگر کسوہ نہیں اٹھاتا تھا، اور اس کا بھیجا جانا 1926 میں اور جلوس 1952 میں بند ہوئے۔ صفحہ میں عمری کا بیان کردہ اپنے زمانے کے غلافِ کعبہ کا حال بھی شامل ہے۔"
