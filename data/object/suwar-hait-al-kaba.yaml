id: object/suwar-hait-al-kaba
class: object
kind: other
label: { ar: "صور حيطان الكعبة", en: "The Ka'ba's wall-paintings" }
summary:
  ar: "كانت في حيطان الكعبة لما بنتها قريش قبل النبوة صور كثيرة بأنواع الأصباغ عجيبة منها صورة إبراهيم الخليل في يده الأزلام ويقابلها صورة إسماعيل ابنه على فرس يجيز بالناس مفيضاً وصورة يقال لها الفاروق قائم على وفد من الناس يقسم فيهم، وبعد هذه صور كثيرة من أولادهم إلى قصي بن كلاب في نحو ستين صورة مع كل واحد منها اسم صاحبها وكيفية عبادته وما اشتهر من فعله، ولما استتمت قريش البناء أعادت الصور وأتقنت شكلها وأحكامها {cite:muruj-al-dhahab p. 570-571}."
  en: "The murals inside Quraysh's rebuilt Ka'ba — Abraham holding the divining-arrows, Ishmael on horseback facing him, the 'Divider' allotting to a deputation, and some sixty ancestral portraits captioned with each man's cult and deeds — redone and perfected when the building was finished {cite:muruj-al-dhahab p. 570-571}."
wings: [objects]
sources: [source/muruj-al-dhahab]
