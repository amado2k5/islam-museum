id: object/suwar-hait-al-kaba
class: object
kind: other
label: { ar: "صور حيطان الكعبة", en: "The Ka'ba's wall-paintings", fr: "Les peintures murales de la Kaaba", es: "Las pinturas murales de la Kaaba", ur: "خانہ کعبہ کی دیواری پینٹنگز" }
summary:
  ar: "كانت في حيطان الكعبة لما بنتها قريش قبل النبوة صور كثيرة بأنواع الأصباغ عجيبة منها صورة إبراهيم الخليل في يده الأزلام ويقابلها صورة إسماعيل ابنه على فرس يجيز بالناس مفيضاً وصورة يقال لها الفاروق قائم على وفد من الناس يقسم فيهم، وبعد هذه صور كثيرة من أولادهم إلى قصي بن كلاب في نحو ستين صورة مع كل واحد منها اسم صاحبها وكيفية عبادته وما اشتهر من فعله، ولما استتمت قريش البناء أعادت الصور وأتقنت شكلها وأحكامها {cite:muruj-al-dhahab p. 570-571}."
  en: "The murals inside Quraysh's rebuilt Ka'ba — Abraham holding the divining-arrows, Ishmael on horseback facing him, the 'Divider' allotting to a deputation, and some sixty ancestral portraits captioned with each man's cult and deeds — redone and perfected when the building was finished {cite:muruj-al-dhahab p. 570-571}."
  fr: "Les peintures à l’intérieur de la Kaaba reconstruite par Quraysh — Ibrahim tenant les flèches divinatoires, Ismail à cheval face à lui, le « Répartiteur » distribuant des parts à un groupe, et quelque soixante portraits d’ancêtres accompagnés de leur culte et de leurs actes — refaites et perfectionnées à l’achèvement du bâtiment {cite:muruj-al-dhahab p. 570-571}."
  es: "Los murales del interior de la Kaaba reconstruida de los Quraysh —Abraham sosteniendo las flechas adivinatorias, Ismael a caballo frente a él, el 'Divisor' asignando a una delegación y unos sesenta retratos ancestrales con el culto y las hazañas de cada hombre— fueron rehechos y perfeccionados cuando se terminó el edificio {cite:muruj-al-dhahab p. 570-571}."
  ur: "قریش کے دوبارہ تعمیر شدہ کعبہ کے اندر کی دیواریں - ابراھیم نے آسمانی تیر پکڑے ہوئے، اسمٰعیل گھوڑے کی پیٹھ پر اس کے سامنے، 'تقسیم کرنے والا' ایک وفد کو مختص کیا گیا، اور تقریباً ساٹھ آبائی پورٹریٹ جس میں ہر ایک کے فرقے اور اعمال کے ساتھ عنوان دیا گیا تھا - دوبارہ تعمیر کیا گیا اور مکمل کیا گیا جب عمارت مکمل ہوگئی۔ 570-571}۔"
