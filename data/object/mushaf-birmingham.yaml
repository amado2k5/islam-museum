  ur: "برمنگھم یونیورسٹی میں حجازی رسم الخط کے پارچمنٹ فولیو؛ ریڈیو کاربن تاریخ 568-645 عیسوی، قدیم ترین قرآن کے پتوں میں سے۔"
  tr: "Birmingham Üniversitesi'nde bulunan ve Hicazi yazısıyla yazılmış Kur'an parşömenleri; radyokarbon tarihleme yöntemiyle 568 ile 645 yılları arasına tarihlendirilmiş olup, bilinen en eski Kur'an parşömenleri arasındadır."
  id: "Gulungan Al-Qur'an yang ditulis dalam aksara Hijazi di Universitas Birmingham; penanggalan radiokarbon menunjukkan usianya antara 568 dan 645 M, dan termasuk di antara gulungan Al-Qur'an tertua yang diketahui."
