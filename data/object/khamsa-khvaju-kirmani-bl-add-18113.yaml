label: { ar: "مخطوطة قصائد خواجو كرماني ⁦(بغداد 1396، المكتبة البريطانية Add. 18113)⁩", en: "Poems of Khvaju Kirmani (Baghdad, 1396), British Library Add. 18113", ur: "خواجو کرمانی کے اشعار کا مخطوطہ (بغداد 1396، برٹش لائبریری Add. 18113)" }
summary:
  ar: "مخطوطة من قصائد خواجو كرماني أنجزت ببغداد سنة 1396م في مجمع السلطان أحمد الجلائري، كتبها بالنستعليق مير علي التبريزي، وتصاويرها الكاملة الصفحة منسوبة إلى جنيد البغدادي، وتعدها نورا تيتلي ذروة مدرسة الجلائريين {cite:titley-persian-miniature-painting-1983 p. 26} {cite:titley-persian-miniature-painting-1983 p. 27}."
  en: "A manuscript of the poems of Khvaju Kirmani completed at Baghdad in 1396 in the academy of Sultan Ahmad Jalayir, written in nasta'liq by Mir Ali Tabrizi, its full-page paintings attributed to Junayd of Baghdad; Norah Titley sees it as the peak of the Jalayirid school {cite:titley-persian-miniature-painting-1983 p. 26} {cite:titley-persian-miniature-painting-1983 p. 27}."
  ur: "بغداد میں 1396ء میں سلطان احمد جلائری کی اکادمی میں مکمل خواجو کرمانی کے اشعار کا مخطوطہ، میر علی تبریزی کے نستعلیق میں، جس کی پورے صفحے کی تصاویر جنید بغدادی سے منسوب ہیں؛ نورا ٹٹلی اسے جلائری مکتب کا عروج سمجھتی ہیں {cite:titley-persian-miniature-painting-1983 p. 26}."
