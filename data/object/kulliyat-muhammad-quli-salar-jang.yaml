label: { ar: "كليات محمد قلي قطب شاه ⁦(متحف سالار جنگ)⁩", en: "Kulliyat of Muhammad Quli Qutb Shah (Salar Jang Museum)", fr: "Kulliyat de Muhammad Quli Qutb Shah (musée Salar Jang)", ur: "کلیاتِ محمد قلی قطب شاہ ⁦(سالار جنگ میوزیم)⁩", es: "Kulliyat de Muhammad Quli Qutb Shah (Museo Salar Jang)" }
summary:
  ar: "نسخة مذهبة مصورة من الشعر الأردي لمحمد قلي قطب شاه، گولكنده نحو 1590–1600م، يرجح زبروفسكي أنها نسخة السلطان نفسه، فيها ثماني صور، ست منها لـ«مصور حيدرآباد» واثنتان لمصور من بخارى {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
  en: "An illuminated and illustrated copy of Muhammad Quli Qutb Shah's Urdu poetry, Golconda, about 1590–1600, which Zebrowski thinks the sultan's own copy, with eight paintings, six by the \"Hyderabad painter\" and two by a Bukhara artist {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
  fr: "Un exemplaire enluminé et illustré de la poésie ourdoue de Muhammad Quli Qutb Shah, Golconde, vers 1590–1600, que Zebrowski considère comme l’exemplaire personnel du sultan, avec huit peintures, six du « peintre d’Hyderabad » et deux d’un artiste de Boukhara {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
  ur: "محمد قلی قطب شاہ کی اردو شاعری کا مذہّب و مصور نسخہ، گولکنڈہ تقریباً 1590–1600ء، جسے زیبروسکی سلطان کا اپنا نسخہ سمجھتے ہیں؛ اس میں آٹھ تصاویر ہیں، چھ «حیدرآباد مصور» کی اور دو بخارا کے ایک فنکار کی {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}۔"
  es: "Una copia iluminada e ilustrada de la poesía urdu de Muhammad Quli Qutb Shah, Golconda, alrededor de 1590-1600, que Zebrowski cree que es la copia del propio sultán, con ocho pinturas, seis del \"pintor de Hyderabad\" y dos de un artista de Bukhara {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
