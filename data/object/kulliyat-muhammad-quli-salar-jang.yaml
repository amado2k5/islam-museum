label: { ar: "كليات محمد قلي قطب شاه ⁦(متحف سالار جنگ)⁩", en: "Kulliyat of Muhammad Quli Qutb Shah (Salar Jang Museum)", ur: "کلیاتِ محمد قلی قطب شاہ (سالار جنگ میوزیم)" }
summary:
  ar: "نسخة مذهبة مصورة من الشعر الأردي لمحمد قلي قطب شاه، گولكنده نحو 1590–1600م، يرجح زبروفسكي أنها نسخة السلطان نفسه، فيها ثماني صور، ست منها لـ«مصور حيدرآباد» واثنتان لمصور من بخارى {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
  en: "An illuminated and illustrated copy of Muhammad Quli Qutb Shah's Urdu poetry, Golconda, about 1590–1600, which Zebrowski thinks the sultan's own copy, with eight paintings, six by the \"Hyderabad painter\" and two by a Bukhara artist {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}."
  ur: "محمد قلی قطب شاہ کی اردو شاعری کا مذہّب و مصور نسخہ، گولکنڈہ تقریباً 1590–1600ء، جسے زیبروسکی سلطان کا اپنا نسخہ سمجھتے ہیں؛ اس میں آٹھ تصاویر ہیں، چھ «حیدرآباد مصور» کی اور دو بخارا کے ایک فنکار کی {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 156} {cite:zebrowski-deccani-painting-1983 p. 157}۔"
