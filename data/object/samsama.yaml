label: { ar: "الصمصامة سيف عمرو بن معد يكرب", en: "al-Samsama, 'Amr's sword", fr: "Al-Samsama, l’épée d’Amr", es: "al-Samsama, la espada de Amr", ur: "الصمسہ، عمرو کی تلوار", tr: "Al-Samsamah, Amr ibn Ma'dikarib'in kılıcı", id: "Al-Samsamah, pedang Amr bin Ma'dikarib" }
summary:
  ar: "سيف عمرو بن معد يكرب الزبيدي المشهور، وهبه المهدي لموسى الهادي فدعا به بعد ما ولى الخلافة ووضعه بين يديه وملء مكتل دنانير وأذن للشعراء أن يقولوا فيه، فبدأهم ابن يامين البصري بحاز صمصامة الزبيدي عمرو، فوهبه له وفرق المكتل على الشعراء ثم اشتراه منه الهادي بخمسين ألفاً {cite:muruj-al-dhahab p. 323-324}."
  en: "'Amr ibn Ma'di Yakrib's famed blade — al-Hadi's poetic prize, granted to Ibn Yamin then bought back for fifty thousand {cite:muruj-al-dhahab p. 323-324}."
  fr: "La célèbre lame d’Amr ibn Ma’di Yakrib — prix poétique d’al-Hadi, accordée à Ibn Yamin puis rachetée pour cinquante mille {cite:muruj-al-dhahab p. 323-324}."
  es: "La famosa espada de 'Amr ibn Ma'di Yakrib — el premio poético de al-Hadi, otorgado a Ibn Yamin y luego recuperado por cincuenta mil {cite:muruj-al-dhahab p. 323-324}."
  ur: "عمرو بن معدی یکرب کا مشہور بلیڈ - الہادی کا شاعرانہ انعام، جو ابن یامین کو دیا گیا تھا، پھر پچاس ہزار میں خریدا گیا 323-324}۔"
  tr: "Amr ibn Ma'dikarib el-Zubaidi'nin meşhur kılıcı, el-Mehdi tarafından Musa el-Hadi'ye verilmiştir. Musa el-Hadi halifeliği devraldıktan sonra kılıcı çağırmış ve önüne, dinar dolu bir sepetle birlikte koymuş ve şairlerin onun hakkında şiirler yazmasına izin vermiştir. İbn Yamin el-Basri, el-Zubaidi Amr'ın kılıcını anlatmaya başlayınca, el-Mehdi kılıcı ona vermiş ve sepeti şairler arasında dağıtmıştır. Daha sonra el-Hadi, kılıcı ondan elli bin dinara satın almıştır. {kaynak: Muruj-al-Dhahab s. 323-324}"
  id: "Pedang terkenal milik Amr ibn Ma’dikarib al-Zubaidi, yang diberikan al-Mahdi kepada Musa al-Hadi. Beliau memanggilnya setelah naik tahta dan meletakkannya di hadapan Musa, bersama dengan sekeranjang penuh dinar, dan mengizinkan para penyair untuk menggubah puisi tentangnya. Ibn Yamin al-Basri memulai dengan membacakan puisi tentang pedang al-Zubaidi Amr, lalu memberikannya kepada al-Mahdi dan membagikan keranjang itu kepada para penyair. Kemudian al-Hadi membelinya darinya seharga lima puluh ribu dinar. {cite:muruj-al-dhahab p. 323-324}"
