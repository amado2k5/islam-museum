label: { ar: "الصمصامة سيف عمرو بن معد يكرب", en: "al-Samsama, 'Amr's sword" }
summary:
  ar: "سيف عمرو بن معد يكرب الزبيدي المشهور، وهبه المهدي لموسى الهادي فدعا به بعد ما ولى الخلافة ووضعه بين يديه وملء مكتل دنانير وأذن للشعراء أن يقولوا فيه، فبدأهم ابن يامين البصري بحاز صمصامة الزبيدي عمرو، فوهبه له وفرق المكتل على الشعراء ثم اشتراه منه الهادي بخمسين ألفاً {cite:muruj-al-dhahab p. 323-324}."
  en: "'Amr ibn Ma'di Yakrib's famed blade — al-Hadi's poetic prize, granted to Ibn Yamin then bought back for fifty thousand {cite:muruj-al-dhahab p. 323-324}."
