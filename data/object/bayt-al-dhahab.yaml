label: { ar: "بيت الذهب الهندي", en: "Bayt Al Dhahab", fr: "Bayt al-Dhahab", es: "Bayt Al Dhahab", ur: "بیت الذہب", tr: "Hint Altın Evi", id: "Rumah Emas India" }
summary:
  ar: "بيت الذهب بيت في براري الهند من أرض مكران وقندهار لا يصل إليه إلا العباد والزهاد من الهند، حكى أبو دلف الينبوعي أنه مبني بالذهب طوله سبعة أذرع وعرضه مثل ذلك وارتفاعه اثنا عشر ذراعا مرصع بأنواع الجواهر وفيه من البددة المعمولة من الياقوت الأحمر والحجارة الثمينة والدر الفاخر الذي الدرة منه مثل بيضة الطائر وأكبر، وزعم أنه لا يصيبه مطر ولا سيل بل ينعرجان عنه يمنة ويسرة، وقيل إنه معلق بين السماء والأرض بلا دعامة ولا علاقة {cite:fihrist-ibn-al-nadim p. 486-487}."
  en: "The Golden House — the remote Indian temple Abu Dulaf described, built of gold and rubies, which rain reportedly avoids {cite:fihrist-ibn-al-nadim}"
  fr: "La Maison d’or — le temple isolé de l’Inde décrit par Abu Dulaf, construit d’or et de rubis, que la pluie éviterait {cite:fihrist-ibn-al-nadim}"
  es: "La Casa Dorada: el remoto templo indio que describió Abu Dulaf, construido de oro y rubíes, que, según se dice, evita la lluvia {cite:fihrist-ibn-al-nadim}"
  ur: "گولڈن ہاؤس - ایک دور دراز ہندوستانی مندر ابو دلف نے بیان کیا ہے، جو سونے اور یاقوت سے بنا ہوا ہے، جس سے بارش مبینہ طور پر گریز کرتی ہے"
  tr: "Altın Ev, Hindistan'ın Makran ve Kandahar topraklarında, sadece Hindistan'dan gelen ibadet edenlerin ve münzevilerin ulaşabildiği bir evdir. Ebu Dulaf el-Yanbu'i'nin rivayetine göre, ev altından yapılmış, yedi arşın uzunluğunda, aynı genişlikte ve on iki arşın yüksekliğinde olup çeşitli mücevherlerle süslenmiştir. İçinde kırmızı yakutlardan, değerli taşlardan ve her biri kuş yumurtası büyüklüğünde veya daha büyük ince incilerden yapılmış bir yatak bulunmaktadır. Yağmur ve sellerden etkilenmediği, aksine bunların sağa ve sola doğru ev dışına savrulduğu söylenmiştir. Evin, gök ile yer arasında hiçbir destek veya bağlantı olmadan asılı durduğu rivayet edilmiştir. {cite:fihrist-ibn-al-nadim s. 486-487}"
  id: "Rumah Emas adalah sebuah rumah di pedalaman India, di tanah Makran dan Kandahar, yang hanya dapat dicapai oleh para penyembah dan pertapa dari India. Abu Dulaf al-Yanbu’i meriwayatkan bahwa rumah itu dibangun dari emas, panjangnya tujuh hasta, lebarnya sama, dan tingginya dua belas hasta, bertabur berbagai macam permata. Di dalamnya terdapat tempat tidur yang terbuat dari rubi merah, batu mulia, dan mutiara halus, setiap mutiara berukuran sebesar telur burung atau lebih besar. Ia mengklaim bahwa rumah itu tidak terpengaruh oleh hujan atau banjir, melainkan air hujan dan banjir tersebut akan berbelok menjauhinya ke kanan dan kiri. Dikatakan bahwa rumah itu tergantung di antara langit dan bumi tanpa penyangga atau penghubung. {cite:fihrist-ibn-al-nadim p. 486-487}"
