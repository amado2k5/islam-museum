label: { ar: "بيت الذهب الهندي", en: "Bayt Al Dhahab" }
summary:
  ar: "بيت الذهب بيت في براري الهند من أرض مكران وقندهار لا يصل إليه إلا العباد والزهاد من الهند، حكى أبو دلف الينبوعي أنه مبني بالذهب طوله سبعة أذرع وعرضه مثل ذلك وارتفاعه اثنا عشر ذراعا مرصع بأنواع الجواهر وفيه من البددة المعمولة من الياقوت الأحمر والحجارة الثمينة والدر الفاخر الذي الدرة منه مثل بيضة الطائر وأكبر، وزعم أنه لا يصيبه مطر ولا سيل بل ينعرجان عنه يمنة ويسرة، وقيل إنه معلق بين السماء والأرض بلا دعامة ولا علاقة {cite:fihrist-ibn-al-nadim p. 486-487}."
  en: "The Golden House — the remote Indian temple Abu Dulaf described, built of gold and rubies, which rain reportedly avoids {cite:fihrist-ibn-al-nadim}"
