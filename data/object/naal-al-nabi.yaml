label: { ar: "نعلا النبي عند أنس", en: "the Prophet's sandals kept by Anas", fr: "Les sandales du Prophète conservées par Anas", es: "Las sandalias del Profeta conservadas por Anas", ur: "نبی کے جوتے جو حضرت انس نے رکھے تھے۔", tr: "Enes'e göre Peygamberin sandaletleri", id: "Sandal Nabi menurut Anas" }
summary:
  ar: "زوج نعال جرداوان — أي خلقان قد انسلخ شعرهما — لهما قبالان ⁦(سيور بين الإصبعين)⁩؛ أخرجهما أنس بن مالك لمريديه في عصره وحدّث ثابت البناني بعده أنهما نعلا النبي، فكانا من الأمتعة التي تبرّك الصحابة والتابعون بحفظها بعد وفاته {cite:sahih-al-bukhari 3107}."
  en: "A pair of worn hairless sandals (jardawan) with two toe-thongs; Anas ibn Malik produced them for pupils in his old age, and Thabit al-Bunani reported after him that they were the Prophet's sandals — among the belongings the Companions and Followers kept for blessing after his death {cite:sahih-al-bukhari 3107}."
  fr: "Une paire de sandales usées et sans poils (jardawan) à deux lanières passant entre les orteils ; Anas ibn Malik les présenta à ses élèves dans sa vieillesse, et Thabit al-Bunani rapporta d’après lui qu’il s’agissait des sandales du Prophète — parmi les effets que les Compagnons et les Successeurs conservèrent pour leur bénédiction après sa mort {cite:sahih-al-bukhari 3107}."
  es: "Un par de sandalias desgastadas sin pelo (jardawan) con dos tiras para los dedos; Anas ibn Malik las fabricó para los alumnos en su vejez, y Thabit al-Bunani informó después de él que eran las sandalias del Profeta, entre las pertenencias que los Compañeros y Seguidores guardaron para bendecir después de su muerte {cite:sahih-al-bukhari 3107}."
  ur: "پہنی ہوئی بالوں والی سینڈل کا ایک جوڑا ⁦(جرداوان)⁩ جس کی دو انگلیوں کی چوتیں ہیں۔ انس بن مالک نے ان کو اپنے بڑھاپے میں شاگردوں کے لیے تیار کیا تھا، اور ثابت البنانی نے ان کے بعد روایت کیا ہے کہ یہ رسول اللہ کے جوتے تھے - ان سامانوں میں سے جو صحابہ و تابعین نے آپ کی وفات کے بعد برکت کے لیے رکھے تھے۔"
  tr: "Eskimiş, tüyleri dökülmüş, iki kayışı (parmak aralarına takılan kayışlar) olan bir çift sandalet; Enes bin Malik bunları kendi zamanında takipçilerine göstermiş, Sabit el-Banani de ondan sonra bunların Peygamber'in sandaletleri olduğunu rivayet etmiştir. Dolayısıyla bunlar, Sahabelerin ve takipçilerinin vefatından sonra saklama şansına sahip oldukları eşyalar arasındaydı. {Sahih-i Buhari 3107}"
  id: "Sepasang sandal usang — yaitu, sandal tua yang bulunya telah rontok — dengan dua tali (tali di antara jari-jari kaki); Anas bin Malik membawanya kepada para pengikutnya pada masanya, dan Thabit al-Banani meriwayatkan setelahnya bahwa itu adalah sandal Nabi, sehingga termasuk di antara harta benda yang diberkati para Sahabat dan Pengikut untuk disimpan setelah wafatnya beliau {kutip:sahih-al-bukhari 3107}."
