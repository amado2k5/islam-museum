label: { ar: "نعلا النبي عند أنس", en: "the Prophet's sandals kept by Anas" }
summary:
  ar: "زوج نعال جرداوان — أي خلقان قد انسلخ شعرهما — لهما قبالان (سيور بين الإصبعين)؛ أخرجهما أنس بن مالك لمريديه في عصره وحدّث ثابت البناني بعده أنهما نعلا النبي، فكانا من الأمتعة التي تبرّك الصحابة والتابعون بحفظها بعد وفاته {cite:sahih-al-bukhari 3107}."
  en: "A pair of worn hairless sandals (jardawan) with two toe-thongs; Anas ibn Malik produced them for pupils in his old age, and Thabit al-Bunani reported after him that they were the Prophet's sandals — among the belongings the Companions and Followers kept for blessing after his death {cite:sahih-al-bukhari 3107}."
