label: { ar: "سيف النبي", en: "the Prophet's sword", fr: "L’épée du Prophète", es: "La espada del Profeta" }
summary:
  ar: "سيف كان معروفاً بأنه سيف رسول الله؛ فلما قدم علي بن الحسين المدينة من عند يزيد بن معاوية بعد مقتل الحسين، عرض عليه المسور بن مخرمة أن يعطيه إياه قائلاً «أخاف أن يغلبك القوم عليه» وحلف لئن أُعطيه لا يُخلَص إليهم أبداً حتى تُبلَغ نفسه {cite:sahih-al-bukhari 3110}. ويذكر البخاري سيفه في باب «ما ذُكر من درع النبي وعصاه وسيفه وقدحه وخاتمه» في أمتعته التي تبرّك بها أصحابه بعد وفاته."
  en: "A sword known as the Messenger of God's sword; when 'Ali ibn al-Husayn reached Medina from Yazid ibn Mu'awiya's court after Husayn's killing, al-Miswar ibn Makhrama offered to take custody of it — 'I fear the people will overpower you for it', swearing it would never leave him until his last breath {cite:sahih-al-bukhari 3110}. Bukhari lists the sword among 'what was narrated of the Prophet's coat of mail, staff, sword, cup and ring', the belongings his Companions kept for blessing after his death."
  fr: "Une épée connue comme l’épée du Messager de Dieu ; lorsqu’Ali ibn al-Husayn arriva à Médine depuis la cour de Yazid ibn Mu’awiya après la mort violente d’Husayn, al-Miswar ibn Makhrama proposa d’en prendre la garde — « Je crains que les gens ne te la prennent de force » — jurant qu’elle ne le quitterait pas avant son dernier souffle {cite:sahih-al-bukhari 3110}. Al-Bukhari cite l’épée parmi « ce qui est rapporté de la cotte de mailles, du bâton, de l’épée, de la coupe et de la bague du Prophète », effets que ses Compagnons conservèrent pour leur bénédiction après sa mort."
  es: "Una espada conocida como la espada del Mensajero de Dios; cuando Ali ibn al-Husayn llegó a Medina desde la corte de Yazid ibn Mu'awiya después del asesinato de Husayn, al-Miswar ibn Makhrama se ofreció a custodiarla: «Temo que la gente te domine por ella», jurando que nunca lo abandonaría hasta su último aliento {cita:sahih-al-bukhari 3110}. Bujari enumera la espada entre «lo que se narró de la cota de malla, el bastón, la espada, la copa y el anillo del Profeta», las pertenencias que sus Compañeros guardaron para bendecir después de su muerte."
