summary:
  ar: "مجموعة صغيرة الحجم صنعت لإسكندر سلطان بشيراز نحو 1410–1411م، في حواشيها رسوم صغيرة وزخارف هندسية وتوريقية، وفيها أقدم مثال معروف لتوريق «الواق واق» {cite:titley-persian-miniature-painting-1983 p. 224} {cite:titley-persian-miniature-painting-1983 p. 233}."
  en: "A small-format miscellany made for Iskandar Sultan at Shiraz around 1410–11, its borders filled with small drawings and geometric and arabesque designs, including the earliest known waqwaq arabesque {cite:titley-persian-miniature-painting-1983 p. 224} {cite:titley-persian-miniature-painting-1983 p. 233}."
  ur: "شیراز میں تقریباً 1410–11ء میں اسکندر سلطان کے لیے بنا چھوٹے حجم کا مجموعہ، جس کے حاشیوں میں ننھی تصاویر اور ہندسی و ترنجی نقوش ہیں، بشمول «واق واق» ترنج کی قدیم ترین معلوم مثال {cite:titley-persian-miniature-painting-1983 p. 224}."
