label:
  ar: "جهانكير يقدّم السجود للشيخ"
  en: "Jahangir Preferring a Sufi Shaikh to Kings"
  fr: "Jahangir préférant un cheikh soufi aux rois"
  es: "Jahangir prefería a un jeque sufí antes que a un rey."
  ur: "جہانگیر نے بادشاہوں پر صوفی شیخ کو ترجیح دی۔"
