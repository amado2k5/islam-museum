summary:
  ar: "منمنمة مغولية بريشة بجتر نحو 1615–1618: جهانكير على الساعة الرملية يقدّم كتاباً لشيخ صوفي بينما ينتظر الملوك؛ أشهر لوحات البلاط المغولي."
  en: "A Mughal miniature by Bichitr, c. 1615–1618: Jahangir on the hourglass throne hands a book to a Sufi shaykh while kings wait; the most famous Mughal court painting."
  fr: "Une miniature moghole de Bichitr, vers 1615–1618 : Jahangir, sur le trône en forme de sablier, tend un livre à un cheikh soufi tandis que des rois attendent ; la plus célèbre peinture de la cour moghole."
  es: "Miniatura mogol de Bichitr, c. 1615-1618: Jahangir, sentado en un trono con forma de reloj de arena, entrega un libro a un jeque sufí mientras los reyes esperan; la pintura más famosa de la corte mogol."
  ur: "ایک مغل منی ایچر از بیچتر، ج۔ 1615-1618: جہانگیر گھنٹہ گھر کے تخت پر ایک صوفی شیخ کو کتاب دے رہا ہے جب بادشاہ انتظار کر رہے ہیں۔ مغل دربار کی سب سے مشہور پینٹنگ۔"
  tr: "Begter tarafından yaklaşık 1615-1618 yılları arasında yapılmış bir Babür minyatürü: Krallar beklerken, kum saati üzerinde oturan Cihangir'in bir Sufi şeyhine kitap sunması; en ünlü Babür saray resmi."
  id: "Miniatur Mughal karya Begter sekitar tahun 1615–1618: Jahangir di atas jam pasir mempersembahkan sebuah buku kepada seorang syekh Sufi sementara para raja menunggu; lukisan istana Mughal yang paling terkenal."
