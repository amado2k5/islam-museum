label: { ar: "عصا عبد الله بن أنيس", en: "The staff of Abdullah ibn Unays" }
summary:
  ar: "عصا أعطاها النبي عبد الله بن أنيس بعد قتله خالد بن سفيان الهذلي وقال: آية بيني وبينك يوم القيامة، إن أقل الناس المتخصرون يومئذ؛ فقرنها بسيفه حتى مات ثم ضُمّت في كفنه ودُفنا جميعاً."
  en: "A staff the Prophet gave Abdullah ibn Unays after he killed Khalid ibn Sufyan al-Hudhali, saying it would be a sign between them on the Day of Resurrection, when those leaning on staffs would be the fewest; he kept it tied to his sword until he died, and it was wrapped in his shroud and buried with him."
