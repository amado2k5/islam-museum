label: { ar: "عصا عبد الله بن أنيس", en: "The staff of Abdullah ibn Unays", fr: "Le bâton d’Abdullah ibn Unays", es: "El personal de Abdullah ibn Unays", ur: "عبداللہ بن انیس کا عملہ" }
summary:
  ar: "عصا أعطاها النبي عبد الله بن أنيس بعد قتله خالد بن سفيان الهذلي وقال: آية بيني وبينك يوم القيامة، إن أقل الناس المتخصرون يومئذ؛ فقرنها بسيفه حتى مات ثم ضُمّت في كفنه ودُفنا جميعاً."
  en: "A staff the Prophet gave Abdullah ibn Unays after he killed Khalid ibn Sufyan al-Hudhali, saying it would be a sign between them on the Day of Resurrection, when those leaning on staffs would be the fewest; he kept it tied to his sword until he died, and it was wrapped in his shroud and buried with him."
  fr: "Un bâton que le Prophète donna à Abdullah ibn Unays après qu’il eut tué Khalid ibn Sufyan al-Hudhali, disant qu’il serait un signe entre eux au Jour de la Résurrection, où ceux qui s’appuieraient sur des bâtons seraient les moins nombreux ; il le garda attaché à son épée jusqu’à sa mort, puis il fut enveloppé dans son linceul et enterré avec lui."
  es: "El Profeta le dio un bastón a Abdullah ibn Unays después de que este matara a Khalid ibn Sufyan al-Hudhali, diciéndole que sería una señal entre ellos el Día de la Resurrección, cuando los que se apoyaran en bastones serían los menos; lo mantuvo atado a su espada hasta su muerte, y fue envuelto en su mortaja y enterrado con él."
  ur: "نبی نے عبداللہ بن انیس کو خالد بن سفیان ہذلی کو قتل کرنے کے بعد عصا دیا اور فرمایا کہ یہ ان کے درمیان قیامت کے دن ایک نشانی ہوگی جب لاٹھیوں پر ٹیک لگانے والے سب سے کم ہوں گے۔ اس نے اسے اپنی تلوار سے باندھ کر رکھا یہاں تک کہ وہ مر گیا، اور اسے اس کے کفن میں لپیٹ کر اس کے ساتھ دفن کیا گیا۔"
