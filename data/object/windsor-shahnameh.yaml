  es: "Boceto para el Shahnameh de Windsor, la copia ilustrada de la epopeya de Firdawsi producida para el comandante safávida Qarjaghai Khan y conservada en la Colección Real; sus fuentes aún no han sido verificadas en la página."
  ur: "ونڈسر شاہنامے کے لیے ڈرافٹ کارڈ، فردوسی کے مہاکاوی کی تصویری کاپی جو صفوی کمانڈر قرجگھائی خان کے لیے تیار کی گئی تھی اور شاہی مجموعہ میں رکھی گئی تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
