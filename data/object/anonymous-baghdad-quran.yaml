summary:
  ar: "مصحف كبير في ثلاثين جزءًا أنجز ببغداد سنة 707هـ/1307–1308م في العهد الإيلخاني، كتبه أحمد بن السهروردي تلميذ ياقوت وذهّبه محمد بن أيبك بن عبد الله، وربما أمر به السلطان أو أحد وزرائه {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
  en: "A large thirty-part Qur'an made at Baghdad in 707 AH/1307–8 CE under the Ilkhanids, written by Ahmad ibn al-Suhrawardi, pupil of Yaqut, and illuminated by Muhammad ibn Aybak ibn Abdallah; possibly commissioned by the ruler or one of his viziers {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
  ur: "بغداد میں ایلخانی دور میں 707ھ/1307–08ء میں بنا تیس پاروں کا بڑا مصحف، جسے یاقوت کے شاگرد احمد بن سہروردی نے لکھا اور محمد بن ایبک بن عبد اللہ نے مذہّب کیا؛ شاید حکمران یا اس کے کسی وزیر نے بنوایا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}۔"
