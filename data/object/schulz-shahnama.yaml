label: { ar: "شاهنامه شولتس ⁦(الهند، النصف الأول من القرن الرابع عشر)⁩", en: "The Schulz Shahnama (India, first half of the 14th century)", fr: "Le Shahnama Schulz (Inde, première moitié du XIVe siècle)", ur: "شولتس شاہنامہ ⁦(ہندوستان، چودھویں صدی کا نصفِ اول)⁩", es: "El Shahnama de Schulz (India, primera mitad del siglo XIV)" }
summary:
  ar: "مخطوط مفرق صغير القطع من الشاهنامه سمي باسم العالم الألماني شولتس، يعده ولش من أحسن صور عهد السلطنة رسماً وأقواها ولعله أقدمها، ويرجح أنه رُسم في دلهي أو مالوا في النصف الأول من القرن الرابع عشر {cite:welch-india-art-and-culture-1985 p. 128} {cite:welch-india-art-and-culture-1985 p. 129}."
  en: "A dispersed small-format Shahnama named after the German scholar Schulz, whose pictures Welch counts the best drawn, among the most vigorous and probably the earliest surviving from the Sultanate period, likely painted at Delhi or in Malwa in the first half of the fourteenth century {cite:welch-india-art-and-culture-1985 p. 128} {cite:welch-india-art-and-culture-1985 p. 129}."
  fr: "Un Shahnama de petit format dispersé, nommé d’après le savant allemand Schulz, dont Welch considère les images comme les mieux dessinées, parmi les plus vigoureuses et probablement les plus anciennes conservées de l’époque du sultanat, vraisemblablement peintes à Delhi ou au Malwa dans la première moitié du XIVe siècle {cite:welch-india-art-and-culture-1985 p. 128} {cite:welch-india-art-and-culture-1985 p. 129}."
  ur: "شاہنامہ کا ایک بکھرا ہوا چھوٹے حجم کا مخطوطہ جو جرمن عالم شولتس کے نام سے موسوم ہے؛ ویلچ اس کی تصویروں کو عہدِ سلطنت کی سب سے عمدہ کھینچی ہوئی، پرزور اور غالباً قدیم ترین باقی تصویریں کہتے ہیں، جو شاید چودھویں صدی کے نصفِ اول میں دہلی یا مالوہ میں بنیں {cite:welch-india-art-and-culture-1985 p. 129}۔"
  es: "Un Shahnama disperso de pequeño formato que lleva el nombre del erudito alemán Schulz, cuyas pinturas Welch considera las mejor dibujadas, entre las más vigorosas y probablemente las más antiguas que se conservan del período del Sultanato, probablemente pintadas en Delhi o en Malwa en la primera mitad del siglo XIV {cite:welch-india-art-and-culture-1985 p. 128} {cite:welch-india-art-and-culture-1985 p. 129}."
