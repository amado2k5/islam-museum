label: { ar: "كساء النبي الملبَّد", en: "the Prophet's patched cloak", fr: "Le manteau rapiécé du Prophète", es: "la capa remendada del Profeta", ur: "نبی کی چادر", tr: "Peygamberin keçeden cübbesi", id: "Jubah sang Nabi yang terbuat dari kain felt" }
summary:
  ar: "كساء ملبَّد — مرقَّع — أخرجته عائشة لأبي بردة وقالت «في هذا نُزِع روح النبي»، وأخرجت معه إزاراً غليظاً مما يُصنع باليمن؛ فكانا من أمتعة النبي التي تبرّك بها أصحابه ومن بعدهم {cite:sahih-al-bukhari 3108}."
  en: "A patched, felted cloak (kisa' mulabbad) which 'A'isha produced for Abu Burda saying 'in this the Prophet's spirit was drawn out', and with it a thick izar of Yemeni make — among the belongings kept for blessing after his death {cite:sahih-al-bukhari 3108}."
  fr: "Un manteau rapiécé et feutré (kisa’ mulabbad) qu’Aïcha présenta à Abu Burda en disant que l’âme du Prophète avait été retirée alors qu’il le portait, avec un épais pagne de fabrication yéménite — parmi les effets conservés pour en recevoir la bénédiction après sa mort {cite:sahih-al-bukhari 3108}."
  es: "Una capa de fieltro remendada (kisa' mulabbad) que 'A'isha le mostró a Abu Burda diciendo 'en ella se extrajo el espíritu del Profeta', y con ella un grueso izar de fabricación yemení, entre las pertenencias guardadas para ser bendecidas después de su muerte {cite:sahih-al-bukhari 3108}."
  ur: "ایک پیوند دار چادر ⁦(کسہ مولابد)⁩ جسے عائشہ نے ابو بردہ کے لیے یہ کہتے ہوئے تیار کیا کہ 'اس میں نبی کی روح نکالی گئی تھی' اور اس کے ساتھ یمنی بنا ہوا ایک موٹا ازار تھا جو ان کی وفات کے بعد برکت کے لیے رکھے گئے سامان میں سے تھا۔"
  tr: "Ayşe, Ebu Burda'ya getirdiği ve \"Peygamberin ruhu bu giysinin içinde alındı\" dediği, yamalı, keçeden yapılmış bir giysiyi gösterdi. Ayrıca Yemen'de yapılmış kalın bir peştamal da getirdi. Bunlar, Peygamberin, sahabelerinin ve onlardan sonra gelenlerin bereket aldığı eşyaları arasındaydı. {Sahih-i Buhari 3108}"
  id: "Sebuah pakaian dari kain felt—yang ditambal—yang dibawa Aisyah untuk Abu Burda dan berkata, “Dengan ini jiwa Nabi dibawa pergi.” Ia juga membawa serta kain penutup pinggang tebal buatan Yaman. Ini adalah beberapa barang milik Nabi yang diberkahi oleh para sahabat dan generasi setelahnya. {cite:sahih-al-bukhari 3108}"
