label: { ar: "كساء النبي الملبَّد", en: "the Prophet's patched cloak" }
summary:
  ar: "كساء ملبَّد — مرقَّع — أخرجته عائشة لأبي بردة وقالت «في هذا نُزِع روح النبي»، وأخرجت معه إزاراً غليظاً مما يُصنع باليمن؛ فكانا من أمتعة النبي التي تبرّك بها أصحابه ومن بعدهم {cite:sahih-al-bukhari 3108}."
  en: "A patched, felted cloak (kisa' mulabbad) which 'A'isha produced for Abu Burda saying 'in this the Prophet's spirit was drawn out', and with it a thick izar of Yemeni make — among the belongings kept for blessing after his death {cite:sahih-al-bukhari 3108}."
