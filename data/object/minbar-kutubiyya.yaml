  tr: "Endülüs'ün Kurtuba kentindeki atölyelerden çıkan, günümüze kadar ulaşan en güzel İslami minber olan Marakeş el-Muradi kakmalı ahşap minber (1137)."
  id: "Mimbar kayu bertatahkan Marrakesh al-Muradi (1137) — mimbar Islam terindah yang masih ada, dari bengkel Cordoba di Andalusia."
