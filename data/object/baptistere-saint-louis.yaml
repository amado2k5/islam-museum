inscriptions:
  - lang: ar
    translation:
      en: "The basin is signed in several places in thuluth and naskh script: 'work of the master Muhammad ibn al-Zayn' on the outer rim (read by Reinaud in 1828), and 'work of Ibn al-Zayn' on the cups and throne back (read by Gaston Wiet in 1932). Other short inscriptions name an inkwell and give a vessel's voice: 'I am a container for carrying food' (read by de Longperier in 1866)."
      ur: "کٹورا کئی جگہ ثلث اور نسخ خط میں دستخط شدہ ہے: بیرونی کنارے پر 'استاد محمد ابن الزین کا کام' ، رینو نے ۱۸۲۸ میں پڑھا، اور پیالوں اور تخت کی پشت پر 'ابن الزین کا کام' ، گاستون ویٹ نے ۱۹۳۲ میں پڑھا۔ دوسرے مختصر کتبوں میں دوات کا نام ہے اور ایک برتن کی زبانی یہ جملہ: 'میں کھانا اٹھانے کے لیے ہوں' ، لونگپیریے نے ۱۸۶۶ میں پڑھا۔"
