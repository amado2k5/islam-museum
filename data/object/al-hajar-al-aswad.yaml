  ur: "خانہ کعبہ کے مشرقی کونے میں نصب حجر اسود؛ حجاج اسے طواف کھولنے کے لیے چھوتے ہیں، قرمطیوں نے چوری کیا اور 339 ہجری میں واپس آئے۔"
