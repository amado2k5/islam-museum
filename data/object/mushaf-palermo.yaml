  ur: "مغرب کے ابتدائی رسم الخط میں دسویں صدی کا ایک مصحف جس کے فولیو عجائب گھروں میں بکھرے ہوئے ہیں۔ قرآنی متن کا اسلامی سسلی کا گواہ۔"
  tr: "MS 10. yüzyıla ait, erken Mağribi yazısıyla yazılmış ve sayfaları müzeler arasında dağılmış bir Kur'an; Kur'an metni üzerinde İslam Sicilyasının etkisine dair kanıtlardan biri."
  id: "Sebuah Al-Qur'an abad ke-10 Masehi dalam aksara Maghreb awal, yang halamannya tersebar di berbagai museum; salah satu bukti keberadaan Sisilia Islam pada teks Al-Qur'an."
