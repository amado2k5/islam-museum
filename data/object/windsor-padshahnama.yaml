id: object/windsor-padshahnama
class: object
kind: manuscript
label: { ar: "مخطوطة پادشاهنامه في وندسور", en: "The Windsor Padshah-nama", fr: "Le Padshah-nama de Windsor", ur: "ونڈسر کا پادشاہنامہ", es: "El Padshah-nama de Windsor", tr: "Windsor'daki Padshahnameh el yazması", id: "Manuskrip Padshahnameh di Windsor" }
summary:
  ar: "النسخة الإمبراطورية المصورة من «پادشاهنامه» عبد الحميد اللاهوري، في المكتبة الملكية بقلعة وندسور، تم نسخها في آخر عهد شاه جهان ⁦(1657–1658م)⁩، وبعض صورها أقدم من نسخ النص، ومنها صور لپياگ وبالچند {cite:beach-grand-mogul-1978 p. 76}."
  en: "The imperial illustrated copy of Abd al-Hamid Lahori's Padshah-nama in the Royal Library, Windsor Castle, written out at the end of Shah Jahan's reign (1657–58), some of its paintings older than the text, among them pages by Payag and Balchand {cite:beach-grand-mogul-1978 p. 76}."
  fr: "L’exemplaire impérial illustré du Padshah-nama d’Abd al-Hamid Lahori à la Bibliothèque royale du château de Windsor, copié à la fin du règne de Shah Jahan (1657–1658), dont certaines peintures sont antérieures au texte, parmi lesquelles des pages de Payag et de Balchand {cite:beach-grand-mogul-1978 p. 76}."
  ur: "عبد الحمید لاہوری کے پادشاہنامہ کا شاہی مصور نسخہ، ونڈسر کیسل کی شاہی لائبریری میں، جس کی کتابت شاہ جہان کے دور کے آخر ⁦(1657–58ء)⁩ میں مکمل ہوئی؛ اس کی بعض تصاویر متن سے پرانی ہیں، جن میں پیاگ اور بال چند کی تصاویر ہیں {cite:beach-grand-mogul-1978 p. 76}۔"
  es: "La copia imperial ilustrada del Padshah-nama de Abd al-Hamid Lahori en la Biblioteca Real del Castillo de Windsor, escrita al final del reinado de Shah Jahan (1657-58), algunas de sus pinturas son más antiguas que el texto, entre ellas páginas de Payag y Balchand {cite:beach-grand-mogul-1978 p. 76}."
  tr: "Windsor Kalesi'ndeki Kraliyet Kütüphanesi'nde bulunan Abdülhamid Lahori'nin Padşahname'sinin resimli imparatorluk nüshası, Şah Cihan'ın saltanatının sonlarında (1657-1658 MS) kopyalanmıştır ve Piyag ve Balchand'ın resimleri de dahil olmak üzere bazı resimleri metin kopyalarından daha eskidir {cite:beach-grand-mogul-1978 s. 76}."
  id: "Salinan kekaisaran bergambar Padshahnameh karya Abdul Hamid Lahori, yang berada di Perpustakaan Kerajaan di Kastil Windsor, disalin pada akhir pemerintahan Shah Jahan (1657–1658 M), dan beberapa gambarnya lebih tua daripada salinan teksnya, termasuk gambar Piyag dan Balchand {cite:beach-grand-mogul-1978 p. 76}."
