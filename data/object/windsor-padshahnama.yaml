summary:
  ar: "النسخة الإمبراطورية المصورة من «پادشاهنامه» عبد الحميد اللاهوري، في المكتبة الملكية بقلعة وندسور، تم نسخها في آخر عهد شاه جهان ⁦(1657–1658م)⁩، وبعض صورها أقدم من نسخ النص، ومنها صور لپياگ وبالچند {cite:beach-grand-mogul-1978 p. 76}."
  en: "The imperial illustrated copy of Abd al-Hamid Lahori's Padshah-nama in the Royal Library, Windsor Castle, written out at the end of Shah Jahan's reign (1657–58), some of its paintings older than the text, among them pages by Payag and Balchand {cite:beach-grand-mogul-1978 p. 76}."
  ur: "عبد الحمید لاہوری کے پادشاہنامہ کا شاہی مصور نسخہ، ونڈسر کیسل کی شاہی لائبریری میں، جس کی کتابت شاہ جہان کے دور کے آخر ⁦(1657–58ء)⁩ میں مکمل ہوئی؛ اس کی بعض تصاویر متن سے پرانی ہیں، جن میں پیاگ اور بال چند کی تصاویر ہیں {cite:beach-grand-mogul-1978 p. 76}۔"
