  tr: "Pisa Katedrali'nin tepesinde yüzyıllarca duran, 11. yüzyıldan kalma büyük İslami bronz heykel; en büyük İslami bronz hayvan heykeli."
  id: "Patung perunggu Islam abad ke-11 yang megah yang berdiri di atas Katedral Pisa selama berabad-abad — patung hewan perunggu Islam terbesar."
