label: { ar: "مرقع گلشن ⁦(ألبوم گلشن)⁩", en: "Muraqqa'-e-Gulshan (Gulshan Album)", fr: "Muraqqa’-e-Gulshan (Album Gulshan)", ur: "مرقعِ گلشن ⁦(گلشن البم)⁩", es: "Muraqqa'-e-Gulshan (Álbum de Gulshan)", tr: "Murkaa Gülşen (Gülşen Albümü)", id: "Murqaa Gulshan (Album Gulshan)" }
summary:
  ar: "أحد مجلدين كبيرين باقيين من ألبومات جهانگير، محفوظ في المكتبة الإمبراطورية بقصر گلستان في طهران، وصفحاته المؤرخة القليلة بين 1599 و1609م، وفي حواشيه صور دولت لزملائه المصورين {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  en: "One of two large surviving volumes of Jahangir's albums, in the Imperial Library of the Gulistan Palace, Tehran; its few dated pages fall between 1599 and 1609, and its margins hold Daulat's portraits of fellow painters {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  fr: "L’un des deux grands volumes conservés des albums de Jahangir, à la Bibliothèque impériale du palais du Gulistan, à Téhéran ; ses quelques pages datées se situent entre 1599 et 1609, et ses marges contiennent les portraits de peintres confrères réalisés par Daulat {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  ur: "جہانگیر کے البموں کی دو باقی بڑی جلدوں میں سے ایک، تہران کے گلستان محل کی شاہی لائبریری میں؛ اس کے چند مؤرخ صفحات 1599 اور 1609ء کے درمیان ہیں، اور حاشیوں میں دولت کی بنائی ساتھی مصوروں کی شبیہیں ہیں {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}۔"
  es: "Uno de los dos grandes volúmenes que se conservan de los álbumes de Jahangir, en la Biblioteca Imperial del Palacio de Gulistan, Teherán; sus pocas páginas fechadas corresponden al período comprendido entre 1599 y 1609, y sus márgenes contienen retratos de Daulat de otros pintores {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  tr: "Jahangir'in albümlerinin günümüze ulaşan iki büyük cildinden biri, Tahran'daki Golestan Sarayı İmparatorluk Kütüphanesi'nde saklanmaktadır; bu ciltte 1599 ile 1609 yılları arasına tarihlenmiş birkaç sayfa bulunmakta ve kenar boşluklarında Davlat'ın diğer fotoğrafçı arkadaşlarının fotoğrafları yer almaktadır. {cite:beach-grand-mogul-1978 s. 40} {cite:beach-grand-mogul-1978 s. 43}."
  id: "Salah satu dari dua volume besar album Jahangir yang masih tersisa, disimpan di Perpustakaan Kekaisaran Istana Golestan di Teheran, dengan beberapa halaman bertanggal antara tahun 1599 dan 1609 M, dan di marginnya terdapat foto-foto karya Davlat tentang rekan-rekan fotografernya {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
