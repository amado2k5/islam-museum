summary:
  ar: "أحد مجلدين كبيرين باقيين من ألبومات جهانگير، محفوظ في المكتبة الإمبراطورية بقصر گلستان في طهران، وصفحاته المؤرخة القليلة بين 1599 و1609م، وفي حواشيه صور دولت لزملائه المصورين {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  en: "One of two large surviving volumes of Jahangir's albums, in the Imperial Library of the Gulistan Palace, Tehran; its few dated pages fall between 1599 and 1609, and its margins hold Daulat's portraits of fellow painters {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}."
  ur: "جہانگیر کے البموں کی دو باقی بڑی جلدوں میں سے ایک، تہران کے گلستان محل کی شاہی لائبریری میں؛ اس کے چند مؤرخ صفحات 1599 اور 1609ء کے درمیان ہیں، اور حاشیوں میں دولت کی بنائی ساتھی مصوروں کی شبیہیں ہیں {cite:beach-grand-mogul-1978 p. 40} {cite:beach-grand-mogul-1978 p. 43}۔"
