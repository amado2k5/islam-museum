summary:
  ar: "كتابة تأسيس مسيحية بالعربية القديمة واليونانية والسريانية على عتبة بازلتية لمزار القديس سرجيوس في زبد شمال سورية، مؤرخة بسنة 512م أو 24 أيلول 511م، وتحفظ في متحف الفن والتاريخ في بروكسل {cite:oxford-cult-of-saints-e01817-zabad} {cite:wikipedia-zabad-inscription-en}."
  en: "A Christian dedicatory inscription in Old Arabic, Greek and Syriac on a basalt lintel of the shrine of Saint Sergios at Zabad in northern Syria, dated 512 CE or 24 September 511 CE and held in the Art and History Museum in Brussels {cite:oxford-cult-of-saints-e01817-zabad} {cite:wikipedia-zabad-inscription-en}."
  ur: "شمالی شام میں زبد کے سینٹ سرجیوس کے مزار کی بازالٹ چوکھٹ پر قدیم عربی، یونانی اور سریانی میں مسیحی تاسیسی کتبہ، 512 عیسوی یا 24 ستمبر 511 عیسوی کا، جو برسلز کے میوزیم آف آرٹ اینڈ ہسٹری میں محفوظ ہے {cite:oxford-cult-of-saints-e01817-zabad} {cite:wikipedia-zabad-inscription-en}۔"
  fr: "Inscription de dédicace chrétienne en vieil arabe, grec et syriaque sur un linteau de basalte du sanctuaire de saint Serge à Zabad, dans le nord de la Syrie, datée de 512 ou du 24 septembre 511 et conservée au Musée d'Art et d'Histoire de Bruxelles {cite:oxford-cult-of-saints-e01817-zabad} {cite:wikipedia-zabad-inscription-en}."
  es: "Inscripción dedicatoria cristiana en árabe antiguo, griego y siríaco sobre un dintel de basalto del santuario de San Sergio en Zabad, en el norte de Siria, fechada en 512 o el 24 de septiembre de 511 y conservada en el Museo de Arte e Historia de Bruselas {cite:oxford-cult-of-saints-e01817-zabad} {cite:wikipedia-zabad-inscription-en}."
  tr: "Hristiyanlığı ilan eden, eski Arapça, Yunanca ve Süryanice yazılmış yazıt, Suriye'nin kuzeyindeki Zabad'da bulunan Aziz Sergius türbesinin bazalt bir lentosunda yer almaktadır ve 512 MS veya 24 Eylül 511 MS tarihli olup Brüksel'deki Sanat ve Tarih Müzesi'nde muhafaza edilmektedir."
  id: "Prasasti yang menetapkan agama Kristen, yang ditulis dalam bahasa Arab kuno, Yunani, dan Suriah, terdapat pada ambang pintu basal makam Santo Sergius di Zabad, Suriah utara, bertanggal 512 M atau 24 September 511 M, dan disimpan di Museum Seni dan Sejarah di Brussels."
