label:
  ar: "نقش النمارة، قبر امرئ القيس بن عمرو"
  en: "The Namara inscription, epitaph of Imru' al-Qays ibn 'Amr"
  ur: "کتبۂ نمارہ، امرؤ القیس بن عمرو کا مرثیہ"
  fr: "L'inscription de Namara, épitaphe d'Imru' al-Qays ibn 'Amr"
  es: "La inscripción de Namara, epitafio de Imru' al-Qays ibn 'Amr"
