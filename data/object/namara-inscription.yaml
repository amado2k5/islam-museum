summary:
  ar: "كتابة جنائزية من خمسة أسطر بالعربية القديمة بالخط النبطي على عتبة بازلتية، مؤرخة في 7 كانون الأول 328م، لامرئ القيس بن عمرو «ملك العرب»، وُجدت في النمارة سنة 1901 وتحفظ في اللوفر برقم AO 4083 {cite:louvre-collections-namara-ao-4083} {cite:wikipedia-namara-inscription-en}."
  en: "A five-line funerary text in Old Arabic in the Nabataean script on a basalt lintel, dated 7 December 328 CE, for Imru' al-Qays ibn 'Amr, \"king of the Arabs\"; found at al-Namara in 1901 and held in the Louvre as AO 4083 {cite:louvre-collections-namara-ao-4083} {cite:wikipedia-namara-inscription-en}."
  ur: "بازالٹ کی چوکھٹ پر نبطی رسم الخط میں قدیم عربی کی پانچ سطروں کی تدفینی تحریر، 7 دسمبر 328 عیسوی کی، امرؤ القیس بن عمرو «عربوں کے بادشاہ» کے لیے؛ 1901 میں النمارہ سے ملی اور لوور میں AO 4083 کے نمبر سے محفوظ ہے {cite:louvre-collections-namara-ao-4083} {cite:wikipedia-namara-inscription-en}۔"
  fr: "Texte funéraire de cinq lignes en vieil arabe en écriture nabatéenne sur un linteau de basalte, daté du 7 décembre 328, pour Imru' al-Qays ibn 'Amr, « roi des Arabes » ; trouvé à al-Namara en 1901 et conservé au Louvre sous le numéro AO 4083 {cite:louvre-collections-namara-ao-4083} {cite:wikipedia-namara-inscription-en}."
  es: "Texto funerario de cinco líneas en árabe antiguo con escritura nabatea sobre un dintel de basalto, fechado el 7 de diciembre de 328, para Imru' al-Qays ibn 'Amr, «rey de los árabes»; hallado en al-Namara en 1901 y conservado en el Louvre con el número AO 4083 {cite:louvre-collections-namara-ao-4083} {cite:wikipedia-namara-inscription-en}."
  tr: "1901 yılında Namara'da bulunan ve Louvre Müzesi'nde AO 4083 numarasıyla muhafaza edilen, bazalt bir lento üzerine Nabataean yazısıyla eski Arapça yazılmış beş satırlık bir mezar yazıtı, 7 Aralık 328 tarihli olup \"Arapların Kralı\" İmru' el-Kays ibn Amr'a aittir."
  id: "Sebuah prasasti pemakaman lima baris dalam bahasa Arab kuno dengan aksara Nabatea pada ambang pintu basal, bertanggal 7 Desember 328 M, untuk Imru' al-Qays ibn Amr, \"Raja Arab,\" ditemukan di Namara pada tahun 1901 dan disimpan di Louvre dengan nomor AO 4083."
