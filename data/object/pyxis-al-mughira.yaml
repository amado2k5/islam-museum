      en: "A Kufic dedication on the lower rim of the lid: blessing from God, favour, joy and happiness to al-Mughira, son of the commander of the faithful, with a prayer for him, 'among what was made in the year 357' (967-968 CE). Read by Ernst Kuhnel in 1971."
      ur: "ڈھکن کے نچلے کنارے پر کوفی خط میں انتساب: اللہ کی طرف سے برکت، نعمت، خوشی اور مسرت المغیرہ کے لیے، جو امیر المومنین کا بیٹا تھا، اس کے لیے دعا کے ساتھ، 'جو سن ۳۵۷ میں بنایا گیا' ، ۹۶۷ء۔۹۶۸ء۔ اسے ارنسٹ کونل نے ۱۹۷۱ میں پڑھا۔"
