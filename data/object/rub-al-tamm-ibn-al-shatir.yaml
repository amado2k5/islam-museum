label: { ar: "الربع التام" }
summary:
  ar: "الآلة التي وضعها ابن الشاطر الميقاتي بدمشق لما وجد الآلات الفلكية لا تفي بجميع الأعمال الفلكية في كل عرض ويداخلها الخلل في غالب الأعمال، فوضع الربع التام يخرج به جميع الأعمال في جميع الآفاق بسهولة مقصد ووضوح برهان {cite:kashf-zunun-furqan p. 570-571}."
  en: "Ibn al-Shatir's 'complete quadrant' — the instrument he devised so that all horary operations might be worked at every latitude with easy aim and clear proof, the flaw he found in the astrolabe, shakkaziyya and zarqala {cite:kashf-zunun-furqan p. 570-571}."
