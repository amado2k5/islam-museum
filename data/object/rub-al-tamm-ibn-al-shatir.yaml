id: object/rub-al-tamm-ibn-al-shatir
class: object
kind: instrument
label: { ar: "الربع التام", en: "Complete Quadrant of Ibn al-Shatir", fr: "Quadrant complet d’Ibn al-Shatir", es: "Cuadrante completo de Ibn al-Shatir" }
summary:
  ar: "الآلة التي وضعها ابن الشاطر الميقاتي بدمشق لما وجد الآلات الفلكية لا تفي بجميع الأعمال الفلكية في كل عرض ويداخلها الخلل في غالب الأعمال، فوضع الربع التام يخرج به جميع الأعمال في جميع الآفاق بسهولة مقصد ووضوح برهان {cite:kashf-zunun-furqan p. 570-571}."
  en: "Ibn al-Shatir's 'complete quadrant' — the instrument he devised so that all horary operations might be worked at every latitude with easy aim and clear proof, the flaw he found in the astrolabe, shakkaziyya and zarqala {cite:kashf-zunun-furqan p. 570-571}."
  fr: "Le « quadrant complet » d’Ibn al-Shatir — l’instrument qu’il conçut pour que toutes les opérations horaires puissent être effectuées à toute latitude, avec facilité dans la visée et clarté de la démonstration, remédiant au défaut qu’il avait relevé dans l’astrolabe, la shakkaziyya et la zarqala {cite:kashf-zunun-furqan p. 570-571}."
  es: "El \"cuadrante completo\" de Ibn al-Shatir —el instrumento que ideó para que todas las operaciones horarias pudieran realizarse en cualquier latitud con fácil puntería y prueba clara—, el defecto que encontró en el astrolabio, la shakkaziyya y la zarqala {cite:kashf-zunun-furqan p. 570-571}."
