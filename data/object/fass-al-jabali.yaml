label: { ar: "فص الياقوت الجبلي", en: "The Jabali ruby", fr: "Le rubis Jabali", es: "El rubí de Jabali", ur: "جبالی روبی", tr: "Dağ yakutu mücevheri", id: "Batu permata rubi gunung" }
summary:
  ar: "فص ياقوت أحمر من خزانة الخلافة يعرف بالجبلي، أخرجه المستعين سنة ثمان وأربعين ومائتين، وكان الرشيد اشتراه بأربعين ألف دينار ونقش عليه اسمه أحمد، وذكر أنه تداولته ملوك الأكاسرة وأنه لم ينقشه ملك إلا مات قتيلاً فكان الملك إذا مات حك تاليه النقش، وكان يضيء بالليل كضياء المصباح ويرى فيه تماثيل تلوح، ظهر في أيام المقتدر ثم خفي أثره {cite:muruj-al-dhahab p. 548-549}."
  en: "The lamp-bright ruby seal of the Sasanian kings — bought by al-Rashid for forty thousand dinars, engraved only by kings who died slain, last seen under al-Muqtadir {cite:muruj-al-dhahab p. 548-549}."
  fr: "Le rubis-sceau des rois sassanides, brillant comme une lampe — acheté par al-Rashid pour quarante mille dinars, gravé seulement par des rois qui périrent de mort violente, vu pour la dernière fois sous al-Muqtadir {cite:muruj-al-dhahab p. 548-549}."
  es: "El brillante sello de rubí de los reyes sasánidas, comprado por al-Rashid por cuarenta mil dinares, grabado únicamente por reyes que murieron asesinados, visto por última vez bajo al-Muqtadir {cite:muruj-al-dhahab p. 548-549}."
  ur: "ساسانی بادشاہوں کی چراغ کی روشن یاقوت مہر - جسے الرشید نے چالیس ہزار دینار میں خریدا تھا، جس پر صرف ان بادشاہوں نے کندہ کیا تھا جو ہلاک ہوئے تھے، آخری مرتبہ المقتدیر کے تحت دیکھا گیا تھا۔ 548-549}۔"
  tr: "Hicri 248 yılında el-Musta'in tarafından Halifeliğin hazinesinden el-Cabali olarak bilinen kırmızı bir yakut çıkarılmıştır. El-Raşid onu 40.000 dinara satın almış ve üzerine Ahmed adını kazıtmıştır. Sasani kralları arasında nesilden nesile aktarıldığı ve şehit olmadan hiçbir kralın üzerine yakut kazıtılmadığı söylenmektedir. Bu nedenle kral öldüğünde, halefi üzerindeki yazıyı silerdi. Geceleyin bir lambanın ışığı gibi parlar ve içinde resimler görülebilirdi. El-Muktadir döneminde ortaya çıkmış, sonra izi kaybolmuştur. {kaynak: Muruj-al-Dhahab s. 548-549}"
  id: "Sebuah batu rubi merah dari perbendaharaan Kekhalifahan, yang dikenal sebagai al-Jabali, dikeluarkan oleh al-Musta'in pada tahun 248 H. Al-Rashid membelinya seharga 40.000 dinar dan mengukir namanya Ahmad di atasnya. Disebutkan bahwa batu itu diwariskan di antara raja-raja Sasaniyah dan tidak ada raja yang mengukirnya kecuali jika ia meninggal sebagai syahid. Jadi ketika raja meninggal, penggantinya akan menghapus ukiran tersebut. Batu itu biasa bersinar di malam hari seperti cahaya lampu, dan gambar-gambar dapat terlihat bersinar di dalamnya. Batu itu muncul pada masa al-Muqtadir, kemudian jejaknya menghilang. {cite:muruj-al-dhahab hlm. 548-549}"
