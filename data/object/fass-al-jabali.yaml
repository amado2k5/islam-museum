id: object/fass-al-jabali
class: object
kind: other
label: { ar: "فص الياقوت الجبلي", en: "The Jabali ruby" }
summary:
  ar: "فص ياقوت أحمر من خزانة الخلافة يعرف بالجبلي، أخرجه المستعين سنة ثمان وأربعين ومائتين، وكان الرشيد اشتراه بأربعين ألف دينار ونقش عليه اسمه أحمد، وذكر أنه تداولته ملوك الأكاسرة وأنه لم ينقشه ملك إلا مات قتيلاً فكان الملك إذا مات حك تاليه النقش، وكان يضيء بالليل كضياء المصباح ويرى فيه تماثيل تلوح، ظهر في أيام المقتدر ثم خفي أثره {cite:muruj-al-dhahab p. 548-549}."
  en: "The lamp-bright ruby seal of the Sasanian kings — bought by al-Rashid for forty thousand dinars, engraved only by kings who died slain, last seen under al-Muqtadir {cite:muruj-al-dhahab p. 548-549}."
