label: { ar: "البلقاء فرس سعد", en: "al-Balqa', Sa'd's mare", fr: "Al-Balqa’, la jument de Sa’d", es: "al-Balqa', la yegua de Sa'd" }
summary:
  ar: "فرس سعد بن أبي وقاص التي أعارته سلمى بنت حفصة لأبي محجن الثقفي ليلة القادسية فركبها في حملاته الثلاث وردّها إلى مربطها وعاد إلى قيده، وتنوزع أركبها بسرج أم عرياً {cite:muruj-al-dhahab p. 610-611}."
  en: "Sa'd's mare — lent to the chained Abu Mahjan for his three night charges at Qadisiyya, then returned to her stall with her rider back in irons {cite:muruj-al-dhahab p. 610-611}."
  fr: "La jument de Sa’d — prêtée à Abu Mahjan enchaîné pour ses trois charges nocturnes à Qadisiyya, puis ramenée à son écurie tandis que son cavalier retournait dans ses fers {cite:muruj-al-dhahab p. 610-611}."
  es: "La yegua de Sa'd, prestada al encadenado Abu Mahjan para sus tres noches de estancia en Qadisiyya, luego devuelta a su establo con su jinete de nuevo encadenado {cite:muruj-al-dhahab p. 610-611}."
