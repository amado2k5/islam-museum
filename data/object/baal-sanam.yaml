id: object/baal-sanam
class: object
kind: other
label: { ar: "بعل صنم بعلبك", en: "Ba'al, the idol of Baalbek" }
summary:
  ar: "الصنم الذي ذكره الله في قوله تعالى أتدعون بعلاً وتذرون أحسن الخالقين، وهو بمدينة بعلبك من أعمال دمشق من كورة سنير، وقد كانت اليونانية اختارت لهذا الهيكل قطعة من الأرض بين جبل لبنان وجبل سنير فاتخذته موضعاً للأصنام، وهما بيتان عظيمان أحدهما أقدم من الآخر فيهما من النقوش العجيبة المحفورة في الحجر ما لا يتأتى حفر مثله في الخشب {cite:muruj-al-dhahab p. 554}."
  en: "The idol named in the verse 'Do you call on Baal and forsake the best of creators?' — housed at Baalbek where the Greeks had chosen the ground between Lebanon and Sanir for idols; two mighty temples whose stone carvings could not be matched in wood {cite:muruj-al-dhahab p. 554}."
wings: [objects]
sources: [source/muruj-al-dhahab]
