label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — لندن"
  en: "Tiraz silk fragment, 132 AH — London"
  fr: "Fragment de soie tiraz, 132 H — Londres"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — لندن"
  es: "Fragmento de seda de Tiraz, 132 AH - Londres"
  tr: "İpekten yapılmış bir desen parçası (132 AH) — Londra"
