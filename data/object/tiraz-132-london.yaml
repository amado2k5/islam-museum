summary:
  ar: "قطعة من نسيج طراز حريري أصفر كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها أصلًا في مقبرة بالأخميم بمصر، وهي الجزء الثاني (B) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في متحف فيكتوريا وألبرت بلندن برقمَي الجرد ١٣١٤–١٨٨٨ وT.13-1960 {cite:tei-epigraphie 47}."
  en: "A fragment of yellow tiraz silk bearing an Arabic maker's inscription, dated 132 AH (749–750 CE); originally found in a cemetery at Akhmim, Egypt, it is part B of four fragments that once formed a single textile, held by the Victoria and Albert Museum, London (accessions 1314-1888 and T.13-1960) {cite:tei-epigraphie 47}."
  fr: "Un fragment de soie tiraz jaune portant une inscription de fabricant en arabe, daté de 132 H (749–750 ap. J.-C.) ; découvert à l’origine dans un cimetière d’Akhmim, en Égypte, il constitue la partie B de quatre fragments ayant autrefois formé un seul textile, conservée au Victoria and Albert Museum, à Londres (numéros d’inventaire 1314-1888 et T.13-1960) {cite:tei-epigraphie 47}."
  ur: "پیلے رنگ کے طراز ریشم کا ٹکڑا جس پر عربی میں دستاویزی تحریر کندہ ہے، 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتا ہے؛ اصلًا مصر کے اخمیم کے قبرستان میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ B ہے، اور لندن کے وکٹوریا اینڈ البرٹ میوزیم میں محفوظ ہے ⁦(نمائندہ نمبر 1314-1888 اور T.13-1960)⁩ {cite:tei-epigraphie 47}۔"
  es: "Un fragmento de seda tiraz amarilla con una inscripción árabe del fabricante, fechada en 132 AH (749-750 d. C.); hallado originalmente en un cementerio en Akhmim, Egipto, es la parte B de cuatro fragmentos que alguna vez formaron un solo textil, conservado por el Museo Victoria y Alberto, Londres (accesos 1314-1888 y T.13-1960) {cite:tei-epigraphie 47}."
  tr: "Arapça bir üretim yazıtı bulunan, 132 Hicri (749-750 Miladi) tarihli, sarı ipek benzeri bir kumaş parçası; aslen Mısır'ın Akhmim kentindeki bir mezarda bulunmuştur. Bir zamanlar tek bir kumaş olan dört parçanın ikinci parçasıdır (B) ve Londra'daki Victoria ve Albert Müzesi'nde 1314-1888 ve T.13-1960 envanter numaraları altında muhafaza edilmektedir {cite:tei-epigraphie 47}."
  id: "Sepotong kain kuning bergaya sutra dengan prasasti pembuatan berbahasa Arab, bertanggal 132 AH (749–750 M); awalnya ditemukan di sebuah makam di Akhmim, Mesir. Ini adalah bagian kedua (B) dari empat potong yang dulunya merupakan satu kain utuh, dan disimpan di Museum Victoria dan Albert di London dengan nomor inventaris 1314–1888 dan T.13-1960 {cite:tei-epigraphie 47}."
