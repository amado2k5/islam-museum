label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — لندن"
  en: "Tiraz silk fragment, 132 AH — London"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — لندن"
summary:
  ar: "قطعة من نسيج طراز حريري أصفر كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها أصلًا في مقبرة بالأخميم بمصر، وهي الجزء الثاني (B) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في متحف فيكتوريا وألبرت بلندن برقمَي الجرد ١٣١٤–١٨٨٨ وT.13-1960 {cite:tei-epigraphie 47}."
  en: "A fragment of yellow tiraz silk bearing an Arabic maker's inscription, dated 132 AH (749–750 CE); originally found in a cemetery at Akhmim, Egypt, it is part B of four fragments that once formed a single textile, held by the Victoria and Albert Museum, London (accessions 1314-1888 and T.13-1960) {cite:tei-epigraphie 47}."
  ur: "پیلے رنگ کے طراز ریشم کا ٹکڑا جس پر عربی میں دستاویزی تحریر کندہ ہے، 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتا ہے؛ اصلًا مصر کے اخمیم کے قبرستان میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ B ہے، اور لندن کے وکٹوریا اینڈ البرٹ میوزیم میں محفوظ ہے ⁦(نمائندہ نمبر 1314-1888 اور T.13-1960)⁩ {cite:tei-epigraphie 47}۔"
