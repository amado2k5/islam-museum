  fr: "L'inscription du Dôme du Rocher de 72 H"
  es: "La inscripción de la Cúpula de la Roca del año 72 AH"
  tr: "Kubbetü'l-Sahrâ'nın yapımı Hicri 72 yılında başlamıştır."
