summary:
  ar: "شريط فسيفسائي طوله نحو 240 متراً بالخط الكوفي المبكر داخل قبة الصخرة في القدس، مؤرخ بسنة 72هـ ⁦(691-692م)⁩، فيه مقاطع قرآنية من أقدم ما بقي وصيغ تقوى وكتابة تأسيس استُبدل فيها اسم عبد الملك بن مروان باسم المأمون {cite:britannica-dome-of-the-rock} {cite:wikipedia-dome-of-the-rock-en} {cite:smarthistory-dome-of-the-rock}."
  en: "A mosaic band about 240 metres long in early Kufic inside the Dome of the Rock in Jerusalem, dated 72 AH (691-692 CE), with some of the earliest surviving Qur'anic passages, pious formulas and a dedicatory text in which the name of Abd al-Malik ibn Marwan was replaced by al-Ma'mun's {cite:britannica-dome-of-the-rock} {cite:wikipedia-dome-of-the-rock-en} {cite:smarthistory-dome-of-the-rock}."
  ur: "یروشلم میں قبۃ الصخرہ کے اندر ابتدائی کوفی میں تقریباً 240 میٹر لمبی موزائیک پٹی، 72ھ ⁦(691-692 عیسوی)⁩ کی، جس میں قرآنی عبارتوں کے قدیم ترین مقامات، دینی کلمات اور ایک تاسیسی عبارت ہے جس میں عبد الملک بن مروان کا نام مامون کے نام سے بدلا گیا {cite:britannica-dome-of-the-rock} {cite:wikipedia-dome-of-the-rock-en} {cite:smarthistory-dome-of-the-rock}۔"
  fr: "Bande de mosaïque d'environ 240 mètres en coufique ancien à l'intérieur du Dôme du Rocher à Jérusalem, datée de 72 H (691-692), avec quelques-uns des plus anciens passages coraniques conservés, des formules pieuses et un texte de fondation où le nom d'Abd al-Malik ibn Marwan fut remplacé par celui d'al-Ma'mun {cite:britannica-dome-of-the-rock} {cite:wikipedia-dome-of-the-rock-en} {cite:smarthistory-dome-of-the-rock}."
  es: "Banda de mosaico de unos 240 metros en cúfico antiguo en el interior de la Cúpula de la Roca, en Jerusalén, fechada en 72 AH (691-692), con algunos de los pasajes coránicos más antiguos conservados, fórmulas piadosas y un texto de fundación en el que el nombre de Abd al-Malik ibn Marwan fue sustituido por el de al-Ma'mun {cite:britannica-dome-of-the-rock} {cite:wikipedia-dome-of-the-rock-en} {cite:smarthistory-dome-of-the-rock}."
  tr: "Kudüs'teki Kubbetü'l-Sahrâ'nın içinde yer alan ve 72 Hicri (691-692 Miladi) tarihli, yaklaşık 240 metre uzunluğundaki mozaik şerit, en eski örneklerden Kur'an pasajları, dindarlık formülleri ve Abdülmalik ibn Mervan'ın adının el-Ma'mun ile değiştirildiği bir kuruluş yazıtı içermektedir."
  id: "Sebuah mozaik sepanjang sekitar 240 meter dengan aksara Kufi awal di dalam Kubah Batu di Yerusalem, bertanggal 72 H (691-692 M), berisi kutipan Al-Qur'an dari contoh tertua yang masih ada, rumusan kesalehan, dan prasasti pendirian di mana nama Abd al-Malik ibn Marwan digantikan dengan nama al-Ma'mun."
