label:
  ar: المصحف الأزرق
  en: The Blue Qur'an
  fr: "Le Coran bleu"
  es: "El Corán Azul"
  ur: "بلیو قرآن"
  tr: "Mavi Kuran"
  id: "Al-Quran Biru"
summary:
  ar: مخطوط قرآني كوفي بالذهب على رق أزرق من القرن التاسع-العاشر — أجمل مصحف أندلسي-مغربي معروف؛ مقطع في متاحف عدة.
  en: A 9th–10th-century Kufic Qur'an in gold on indigo-blue vellum — the most beautiful known Andalusi-Maghrebi mushaf, dispersed
    across museums.
  fr: "Un Coran coufique des IXe–Xe siècles, à l’or sur vélin bleu indigo — le plus beau mushaf andalou-maghrébin connu, dispersé entre plusieurs musées."
  es: "Un Corán cúfico de los siglos IX-X, impreso en oro sobre pergamino azul índigo, el mushaf andalusí-magrebí más bello que se conoce, disperso en diversos museos."
  ur: "انڈگو بلیو ویلم پر سونے میں 9ویں-10ویں صدی کا کوفک قرآن - سب سے خوبصورت مشہور اندلس-مغربی مصحف، جو عجائب گھروں میں منتشر ہے۔"
  tr: "9.-10. yüzyıllara ait, mavi parşömen üzerine altın yaldızla yazılmış Kufi Kur'an el yazması; bilinen en güzel Endülüs-Mağribi Kur'an'ı; parçaları çeşitli müzelerde bulunmaktadır."
  id: "Manuskrip Al-Qur'an Kufi abad ke-9-10 yang ditulis dengan emas di atas perkamen biru — Al-Qur'an Andalusia-Maghrebi terindah yang diketahui; fragmennya tersimpan di beberapa museum."
