label: { ar: "صنم ملتان", en: "Sanam Multan", fr: "Sanam Multan", es: "Sanam Multan", ur: "صنم ملتان", tr: "Multan putu", id: "Patung Multan" }
summary:
  ar: "صنم بيت ملتان ويقال إن هذا البيت أحد البيوت السبعة، وبه صنم من حديد طوله سبعة أذرع في وسط القبة تمسكه حجارة المغناطيس من جميع جهاته بقوى متفقة، وقيل إنه مال إلى ناحية لآفة دخلت عليه، والبيت في لحف جبل وهو قبة ارتفاعها مائة وثمانون ذراعا تحجه الهند من أقاصي بلادهم برا وبحرا والطريق إليه من بلخ مستقيم، وقيل إنه ما خلا قط ساعة واحدة ممن يحجه خلق من الناس، وعلى قلة الجبل وفي سفحه بيوت للعباد والزهاد ومواضع للذبائح والقرابين {cite:fihrist-ibn-al-nadim p. 485}."
  en: "The idol of Multan — iron figure held by magnets inside a 180-cubit dome, one of the seven houses {cite:fihrist-ibn-al-nadim}"
  fr: "L’idole de Multan — une figure de fer maintenue par des aimants dans une coupole de 180 coudées, l’une des sept maisons {cite:fihrist-ibn-al-nadim}"
  es: "El ídolo de Multan: figura de hierro sostenida por imanes dentro de una cúpula de 180 codos, una de las siete casas {cite:fihrist-ibn-al-nadim}"
  ur: "ملتان کا بت - 180 کیوبٹ کے گنبد کے اندر مقناطیسوں کے ذریعے رکھی ہوئی لوہے کی شخصیت، سات گھروں میں سے ایک"
  tr: "Multan Evi'nin putu. Bu evin yedi evden biri olduğu ve kubbesinin ortasında, her taraftan mıknatıs taşlarıyla birleşik kuvvetlerle tutulan, yedi arşın uzunluğunda demir bir put bulunduğu söylenir. Bir felaket nedeniyle bir yana doğru eğildiği rivayet edilir. Ev bir dağın yamacındadır ve yüz seksen arşın yüksekliğinde bir kubbedir. Hindistan, karadan ve denizden en uzak köşelerinden buraya hac ziyareti yapar ve Belh'ten buraya giden yol düzdür. Buraya hac ziyareti yapan insanlardan tek bir saat bile boş kalmadığı söylenir. Dağın zirvesinde ve eteğinde ibadet edenler ve münzeviler için evler, kurban ve adak yerleri bulunmaktadır. {cite:fihrist-ibn-al-nadim s. 485}"
  id: "Patung di Rumah Multan. Konon rumah ini adalah salah satu dari tujuh rumah, dan di dalamnya terdapat patung besi sepanjang tujuh hasta di tengah kubah, yang ditahan oleh batu magnet dari semua sisi dengan kekuatan gabungan. Konon, patung itu miring ke satu sisi karena bencana yang menimpanya. Rumah itu berada di lereng gunung, dan kubahnya setinggi seratus delapan puluh hasta. Orang India berziarah ke sana dari ujung terjauh wilayah mereka melalui darat dan laut, dan jalan menuju ke sana dari Balkh lurus. Konon, tempat itu tidak pernah kosong selama satu jam pun dari orang-orang yang berziarah ke sana. Di puncak gunung dan di kaki gunung terdapat rumah-rumah untuk para penyembah dan pertapa serta tempat-tempat untuk pengorbanan dan persembahan. {cite:fihrist-ibn-al-nadim p. 485}."
