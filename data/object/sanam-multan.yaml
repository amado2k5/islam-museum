label: { ar: "صنم ملتان", en: "Sanam Multan" }
summary:
  ar: "صنم بيت ملتان ويقال إن هذا البيت أحد البيوت السبعة، وبه صنم من حديد طوله سبعة أذرع في وسط القبة تمسكه حجارة المغناطيس من جميع جهاته بقوى متفقة، وقيل إنه مال إلى ناحية لآفة دخلت عليه، والبيت في لحف جبل وهو قبة ارتفاعها مائة وثمانون ذراعا تحجه الهند من أقاصي بلادهم برا وبحرا والطريق إليه من بلخ مستقيم، وقيل إنه ما خلا قط ساعة واحدة ممن يحجه خلق من الناس، وعلى قلة الجبل وفي سفحه بيوت للعباد والزهاد ومواضع للذبائح والقرابين {cite:fihrist-ibn-al-nadim p. 485}."
  en: "The idol of Multan — iron figure held by magnets inside a 180-cubit dome, one of the seven houses {cite:fihrist-ibn-al-nadim}"
wings: [objects]
sources: [source/fihrist-ibn-al-nadim]
