summary:
  ar: "الحجر الذي تحمل أثر قدمي إبراهيم في المسجد الحرام؛ ورد في سورة البقرة «واتخذوا من مقام إبراهيم مصلى»."
  en: "The stone bearing the footprints attributed to Abraham in the Great Mosque of Mecca; the Qur'an says 'take the Station of Abraham as a place of prayer'."
  fr: "La pierre portant les empreintes attribuées à Abraham dans la Grande Mosquée de La Mecque ; le Coran évoque l’usage de la station d’Abraham comme lieu de prière."
  es: "La piedra con las huellas atribuidas a Abraham en la Gran Mezquita de La Meca; el Corán dice: \"Tomad el lugar de Abraham como lugar de oración\"."
  ur: "مکہ کی عظیم مسجد میں ابراہیم سے منسوب قدموں کے نشانات والا پتھر؛ قرآن کہتا ہے کہ مقام ابراہیم کو نماز کی جگہ سمجھو۔"
  tr: "Mescid-i Kerim'de İbrahim'in ayak izinin bulunduğu taş, Bakara Suresi'nde şöyle geçmektedir: \"Ey iman edenler, İbrahim'in makamından kendinize bir namaz yeri edinin.\""
  id: "Batu yang memuat jejak kaki Ibrahim di Masjidil Haram disebutkan dalam Surah Al-Baqarah: “Dan ambillah, [wahai orang-orang yang beriman], dari tempat tinggal Ibrahim sebuah tempat untuk shalat.”"
