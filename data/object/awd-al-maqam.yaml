id: object/awd-al-maqam
class: object
kind: relic
label: { ar: "عود المقام", en: "the staff of the Prophet's prayer station" }
summary:
  ar: "عود من طرفاء الغابة كان مغروساً في جدار القبلة بمسجد النبي؛ كان يمسكه بكفه يعتمد عليه حين يقوم إلى الصلاة ثم يلتفت يميناً وشمالاً ويقول: «عدّلوا صفوفكم»، وقيل وضع له لما أسنّ فألصق به عود آخر؛ فُقد في زمن عمر فوجد عند رجل من الأنصار بقباء كان قد دفنه فأكلته الأرضة، فأصلحه عمر ورده إلى المحراب {cite:samhudi-wafa-al-wafa p. 392-394}."
  en: "A rod of tarfa' (tamarisk) wood set in the qibla wall of the Prophet's mosque; he would hold it in his palm and lean on it when rising to pray, then turn right and left saying 'straighten and even your rows' — some say it was made for him when he grew old, with a second rod joined to it; it went missing in 'Umar's time and was found buried at Quba eaten by woodworm, so 'Umar repaired it and returned it to the mihrab {cite:samhudi-wafa-al-wafa p. 392-394}."
