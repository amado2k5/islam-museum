summary:
  ar: أشهر سجادة إسلامية في التاريخ (1539–40) — إحدى أقدم السجاد المؤرخة وأكملها؛ نموذج مذهب صفوي للوسوم في لوس أنجلوس وأختها
    التوأم في V&A.
  en: The most famous Islamic carpet in history (1539–40) — among the oldest dated carpets and the Safavid benchmark, at LACMA
    (its twin at the V&A).
  fr: "Le tapis islamique le plus célèbre de l’histoire (1539–1540) — parmi les plus anciens tapis datés et la référence safavide, au LACMA (son jumeau est au V&A)."
  es: "La alfombra islámica más famosa de la historia (1539-1540), una de las alfombras más antiguas datadas y un referente de la época safávida, se encuentra en el LACMA (su gemela en el V&A)."
  ur: "تاریخ کا سب سے مشہور اسلامی قالین (1539-40) - قدیم ترین تاریخ کے قالینوں اور صفوی بینچ مارک میں، LACMA ⁦(V&A میں اس کا جڑواں)⁩۔"
  tr: "Tarihin en ünlü İslami halısı (1539–40) — en eski ve en eksiksiz tarihli halılardan biri; Los Angeles gamalı haçının Safevi dönemine ait bir örneği ve V&A'daki ikiz kardeşi."
  id: "Karpet Islami paling terkenal dalam sejarah (1539–40) — salah satu karpet tertua dan terlengkap yang dapat ditentukan tanggalnya; model Safavid dari swastika Los Angeles dan kembarannya di V&A."
