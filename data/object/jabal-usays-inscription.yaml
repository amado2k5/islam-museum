summary:
  ar: "كتابة من أربعة أسطر بالعربية القديمة على حجر منحوت قرب قمة جبل أسيس جنوب شرقي دمشق، مؤرخة بسنة 528 أو 529م أو 532 أو 533م بقراءة بديلة، يذكر فيها رقيم بن معرِّف الأوسي أن «الحارث الملك» أرسله حارساً للحدود {cite:wikipedia-jebel-usays-inscription-en}."
  en: "A four-line text in Old Arabic on a cut stone near the summit of Jabal Usays south-east of Damascus, dated 528 or 529 CE, or 532 or 533 CE on an alternative reading, in which Ruqaym son of Ma'arrif the Awsite says \"al-Harith the king\" sent him as a frontier guard {cite:wikipedia-jebel-usays-inscription-en}."
  ur: "دمشق کے جنوب مشرق میں جبل اُسیس کی چوٹی کے قریب تراشے ہوئے پتھر پر قدیم عربی کی چار سطریں، جو 528 یا 529 عیسوی کی ہیں، یا متبادل قراءت پر 532 یا 533 کی، جن میں رقیم بن معرّف اوسی کہتا ہے کہ «الحارث بادشاہ» نے اسے سرحدی پہرے دار بنا کر بھیجا {cite:wikipedia-jebel-usays-inscription-en}۔"
  fr: "Texte de quatre lignes en vieil arabe sur une pierre taillée près du sommet du Jabal Usays, au sud-est de Damas, daté de 528 ou 529, ou de 532 ou 533 selon une lecture alternative, où Ruqaym fils de Ma'arrif, des Aws, dit qu'« al-Harith le roi » l'a envoyé comme garde-frontière {cite:wikipedia-jebel-usays-inscription-en}."
  es: "Texto de cuatro líneas en árabe antiguo sobre una piedra labrada cerca de la cima del Jabal Usays, al sureste de Damasco, fechado en 528 o 529, o en 532 o 533 según una lectura alternativa, en el que Ruqaym hijo de Ma'arrif, de los Aws, dice que «al-Harith el rey» lo envió como guardián de la frontera {cite:wikipedia-jebel-usays-inscription-en}."
