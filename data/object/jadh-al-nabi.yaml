id: object/jadh-al-nabi
class: object
kind: relic
label: { ar: "الجذع الحنّان", en: "the yearning palm-trunk" }
summary:
  ar: "جذع النخلة الذي كان النبي يخطب إليه قبل اتخاذ المنبر فحنّ إليه حين فارقه؛ اشتهر عند المتأخرين أن خشبة كانت ثابتة بالرصاص في أسطوانة المصلى الشريف بإزاء الروضة من بقاياه، وذكر ابن جبير في رحلته أن الناس كانوا يقبّلون قطعة ظاهرة منه في عمود ويتبركون بمسحها، ونازع السمهودي في ذلك ورجّح أنها من عود المقام لا من الجذع، وأن عز الدين بن جماعة أمر بإزالتها عام خمس وخمسين وثمانمائة {cite:samhudi-wafa-al-wafa p. 393-394}."
  en: "The palm-trunk the Prophet leaned on while preaching before the minbar was made, which yearned when he left it. Later generations popularly held that a lead-fastened wooden piece in the pillar facing the Rawda was a remnant of it — Ibn Jubayr saw people kissing and blessing themselves by a visible piece set in a column — but al-Samhudi disputes this, judging it likelier a remnant of the staff of the prayer station, and records that 'Izz al-Din ibn Jama'a ordered its removal in 855 AH {cite:samhudi-wafa-al-wafa p. 393-394}."
