label: { ar: "الجذع الحنّان", en: "the yearning palm-trunk", fr: "Le tronc de palmier nostalgique", es: "el tronco de palmera anhelante" }
summary:
  ar: "جذع النخلة الذي كان النبي يخطب إليه قبل اتخاذ المنبر فحنّ إليه حين فارقه؛ اشتهر عند المتأخرين أن خشبة كانت ثابتة بالرصاص في أسطوانة المصلى الشريف بإزاء الروضة من بقاياه، وذكر ابن جبير في رحلته أن الناس كانوا يقبّلون قطعة ظاهرة منه في عمود ويتبركون بمسحها، ونازع السمهودي في ذلك ورجّح أنها من عود المقام لا من الجذع، وأن عز الدين بن جماعة أمر بإزالتها عام خمس وخمسين وثمانمائة {cite:samhudi-wafa-al-wafa p. 393-394}."
  en: "The palm-trunk the Prophet leaned on while preaching before the minbar was made, which yearned when he left it. Later generations popularly held that a lead-fastened wooden piece in the pillar facing the Rawda was a remnant of it — Ibn Jubayr saw people kissing and blessing themselves by a visible piece set in a column — but al-Samhudi disputes this, judging it likelier a remnant of the staff of the prayer station, and records that 'Izz al-Din ibn Jama'a ordered its removal in 855 AH {cite:samhudi-wafa-al-wafa p. 393-394}."
  fr: "Le tronc de palmier contre lequel le Prophète s’appuyait en prêchant avant la fabrication du minbar, qui manifesta sa nostalgie lorsqu’il le quitta. Les générations ultérieures crurent communément qu’un morceau de bois fixé au plomb dans le pilier face à la Rawda en était un vestige — Ibn Jubayr vit des gens embrasser et toucher, pour en recevoir la bénédiction, une pièce visible enchâssée dans une colonne — mais al-Samhudi le conteste, jugeant plus probable qu’il s’agisse d’un vestige du bâton de la station de prière, et rapporte que ‘Izz al-Din ibn Jama’a ordonna son retrait en 855 H {cite:samhudi-wafa-al-wafa p. 393-394}."
  es: "El tronco de palma en el que el Profeta se apoyaba mientras predicaba frente al minbar fue construido y lo echó de menos cuando lo dejó. Generaciones posteriores popularmente sostuvieron que una pieza de madera sujeta con plomo en el pilar frente a la Rawda era un vestigio de ella —Ibn Jubayr vio a personas besándose y bendiciéndose con una pieza visible colocada en una columna—, pero al-Samhudi lo refuta, considerándolo más probable como un vestigio del bastón de la estación de oración, y registra que 'Izz al-Din ibn Jama'a ordenó su remoción en 855 AH {cite:samhudi-wafa-al-wafa p. 393-394}."
