label: { ar: "المصحف الوردي الأندلسي (القرن السابع الهجري)", en: "The Andalusian \"Pink Qur'an\" (13th century)", ur: "اندلسی «گلابی مصحف» (تیرہویں صدی)" }
summary:
  ar: "مصحف أندلسي من أوائل القرن الثالث عشر سمي بلون ورقه الوردي، مكتوب بخط مغربي عريض على ورق يظن أنه من شاطبة، وأرقام آيه بحروف الجمل، ويرجح أنه صنع لراعٍ ملكي أو نبيل في غرناطة أو بلنسية {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  en: "An Andalusian Qur'an of the early thirteenth century named for the pinkish hue of its paper, written in bold maghribi on paper thought to come from Jativa, with verse numbers in abjad letters; probably made for a royal or noble patron in Granada or Valencia {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  ur: "تیرہویں صدی کے آغاز کا ایک اندلسی مصحف جو اپنے کاغذ کی گلابی رنگت سے موسوم ہے، موٹے مغربی خط میں اس کاغذ پر جو غالباً شاطبہ کا ہے، آیات کے نمبر ابجد میں؛ غالباً غرناطہ یا بلنسیہ کے کسی شاہی یا امیر سرپرست کے لیے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}۔"
