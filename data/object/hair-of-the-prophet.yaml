id: object/hair-of-the-prophet
tags: [wasaya-browser, wasaya-legacy, wasaya-athar, wasaya-mirath]
class: object
kind: relic
label:
  ar: "شعر النبي"
  en: "The Prophet's hair"
  ur: "نبی کے بال"
summary:
  ar: "حلق النبي رأسه بمنى في حجة الوداع، فيروي أنس أن أبا طلحة كان أول من أخذ شعره، وفي رواية مسلم أن النبي أعطاه شعر شقه الأيمن ثم شقه الأيسر وقال اقسمه بين الناس {cite:subul-huda-salihi scan vol. 4 p. 4682} {cite:zad-al-maad scan vol. 1 p. 269}. وبقي من هذا الشعر عند أم سلمة شعرات حمر مخضوبة بالحناء والكتم {cite:al-bidaya-wal-nihaya scan vol. 3 p. 411} {cite:subul-huda-salihi scan vol. 4 p. 4670}، وفي قلنسوة خالد بن الوليد ناصيته، فما لقي جمعاً إلا فضّه {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2805} {cite:subul-huda-salihi scan vol. 4 p. 5480}. وأوصى أنس أن تُوضع شعرة منه تحت لسانه، وأوصى معاوية أن تُسحق قلامة أظفار النبي ويُجعل منها في عينيه وفمه {cite:isaba scan vol. 1 p. 277} {cite:usd-al-ghaba scan vol. 1 p. 1147}."
  en: "The Prophet shaved his head at Mina on the Farewell Pilgrimage; Anas reports that Abu Talha was the first to take his hair, and in Muslim's version the right side of his hair and then the left went to Abu Talha, with the words to share it among the people {cite:subul-huda-salihi scan vol. 4 p. 4682} {cite:zad-al-maad scan vol. 1 p. 269}. Umm Salama kept red strands dyed with henna and katam {cite:al-bidaya-wal-nihaya scan vol. 3 p. 411} {cite:subul-huda-salihi scan vol. 4 p. 4670}; Khalid ibn al-Walid kept his forelock in his cap and met no host that he did not break {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2805} {cite:subul-huda-salihi scan vol. 4 p. 5480}. Anas asked that a hair be put under his tongue, and Mu'awiya asked that the Prophet's nail parings be ground and put in his eyes and mouth {cite:isaba scan vol. 1 p. 277} {cite:usd-al-ghaba scan vol. 1 p. 1147}."
  ur: "نبی نے حجۃ الوداع میں منیٰ میں سر منڈوایا؛ انس بتاتے ہیں کہ ابو طلحہ پہلے شخص تھے جنہوں نے آپ کے بال لیے، اور مسلم کی روایت میں داہنی اور پھر بائیں جانب کے بال ابو طلحہ کو ملے اور آپ نے فرمایا کہ لوگوں میں بانٹ دو {cite:subul-huda-salihi scan vol. 4 p. 4682} {cite:zad-al-maad scan vol. 1 p. 269}۔ ام سلمہ کے پاس مہندی اور کتم سے رنگے ہوئے سرخ بال تھے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 411} {cite:subul-huda-salihi scan vol. 4 p. 4670}؛ خالد بن ولید نے آپ کی پیشانی کے بال اپنی ٹوپی میں رکھے اور کسی لشکر سے نہ ملے مگر اسے توڑ دیا {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2805} {cite:subul-huda-salihi scan vol. 4 p. 5480}۔ انس نے وصیت کی کہ ایک بال ان کی زبان کے نیچے رکھا جائے، اور معاویہ نے کہ نبی کے ناخنوں کی تراش پیس کر ان کی آنکھوں اور منہ میں رکھی جائے {cite:isaba scan vol. 1 p. 277} {cite:usd-al-ghaba scan vol. 1 p. 1147}۔"
