label: { ar: "«همايون وإخوته في منظر طبيعي»، ألبوم برلين ⁦(ورقة 15)⁩", en: "Humayun and His Brothers in a Landscape, Berlin Album (folio 15r)", fr: "Humayun et ses frères dans un paysage, Album de Berlin (feuillet 15r)", ur: "«ہمایوں اور ان کے بھائی ایک منظر میں»، برلن البم ⁦(ورق 15 الف)⁩", es: "Humayun y sus hermanos en un paisaje, Álbum de Berlín (folio 15r)", tr: "“Humayun ve kardeşleri bir manzarada,” Berlin Albümü (sayfa 15)", id: "“Humayun dan saudara-saudaranya di sebuah lanskap,” Album Berlin (halaman 15)" }
summary:
  ar: "صورة من نحو 1550 تنسب إلى دوست محمد، تصور همايون على عرش حجري يستقبل إخوته، والأمير أكبر بين ثلاثة صبية يلعبون؛ في مكتبة الدولة البروسية ببرلين {cite:welch-india-art-and-culture-1985 p. 144} {cite:welch-india-art-and-culture-1985 p. 146}."
  en: "A miniature of about 1550 attributed to Dust Muhammad, showing Humayun on a rustic stone throne receiving his brothers, with the young Akbar among three boys at play; in the Staatsbibliothek Preussischer Kulturbesitz, Berlin {cite:welch-india-art-and-culture-1985 p. 144} {cite:welch-india-art-and-culture-1985 p. 146}."
  fr: "Une miniature des environs de 1550 attribuée à Dust Muhammad, représentant Humayun sur un trône rustique en pierre recevant ses frères, avec le jeune Akbar parmi trois garçons qui jouent ; à la Staatsbibliothek Preussischer Kulturbesitz, Berlin {cite:welch-india-art-and-culture-1985 p. 144} {cite:welch-india-art-and-culture-1985 p. 146}."
  ur: "تقریباً 1550ء کی تصویر جو دوست محمد سے منسوب ہے: ہمایوں پتھر کے دیہاتی تخت پر اپنے بھائیوں کا استقبال کر رہے ہیں اور کم سن اکبر تین کھیلتے بچوں میں ہیں؛ برلن کی اسٹاٹس بیبلیوتھیک میں {cite:welch-india-art-and-culture-1985 p. 144}۔"
  es: "Una miniatura de alrededor de 1550 atribuida a Dust Muhammad, que muestra a Humayun en un trono de piedra rústica recibiendo a sus hermanos, con el joven Akbar entre tres niños jugando; en la Staatsbibliothek Preussischer Kulturbesitz, Berlín {cite:welch-india-art-and-culture-1985 p. 144} {cite:welch-india-art-and-culture-1985 p. 146}."
  tr: "Yaklaşık 1550 yılına ait, Dost Muhammed'e atfedilen bir resim; Humayun'un taş bir tahtta kardeşlerini karşılarken ve Prens Akbar'ın üç çocukla birlikte oyun oynarken tasvir edildiği bir sahneyi gösteriyor; Berlin'deki Prusya Devlet Kütüphanesi'nde bulunmaktadır. {cite:welch-india-art-and-culture-1985 s. 144} {cite:welch-india-art-and-culture-1985 s. 146}."
  id: "Sebuah lukisan dari sekitar tahun 1550 yang dikaitkan dengan Dost Muhammad, menggambarkan Humayun di atas singgasana batu menerima saudara-saudaranya, dan Pangeran Akbar di antara tiga anak laki-laki yang sedang bermain; di Perpustakaan Negara Prusia di Berlin {cite:welch-india-art-and-culture-1985 p. 144} {cite:welch-india-art-and-culture-1985 p. 146}."
