label:
  ar: "تابوت بني إسرائيل وما فيه من بقية آل موسى وآل هارون"
  en: "The Ark (tabut) of the Israelites and the remnant of the house of Musa and the house of Harun"
  fr: "L’Arche (tabut) des Israélites et les vestiges de la maison de Musa et de la maison de Harun"
  ur: "بنی اسرائیل کا تابوت اور آلِ موسیٰ و آلِ ہارون کی بقیہ باقیات"
summary:
  ar: "تذكر آية البقرة أن التابوت فيه سكينة من ربهم وبقية مما ترك آل موسى وآل هارون وتحمله الملائكة {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585}. وفي السكينة أقوال: طست من ذهب تُغسل فيه قلوب الأنبياء، أو ريح خجوج، أو ما يشبه الهرة، أو روح تتكلم {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1173}. وفي البقية أقوال: عصا موسى وعصا هارون ورضاض الألواح، ويزيد بعضهم ثيابهما وعمامة هارون والمن والتوراة، وعن الضحاك أنها الجهاد {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1174}. وتذكر الكتب أن العمالقة أخذوه ثم رُدّ إلى بني إسرائيل على عجلة تسوقها الملائكة، أو أن الملائكة حملته {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585} {cite:tafsir-ibn-kathir scan vol. 1 p. 889}."
  en: "The verse of al-Baqara says the Ark held a sakina from their Lord and a remnant of what the house of Musa and the house of Harun left, and that angels carried it {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585}. For the sakina the commentators say a gold basin in which the hearts of the prophets were washed, a violent wind, something like a cat, or a speaking spirit {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1173}. For the remnant they say the staffs of Musa and Harun and the fragments of the tablets, some adding their clothes, Harun's turban, manna and the Torah, and al-Dahhak that it is jihad {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1174}. The books report that the Amalekites took it and it was returned to the Israelites on a cart driven by angels, or that angels carried it {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585} {cite:tafsir-ibn-kathir scan vol. 1 p. 889}."
  fr: "Le verset d’al-Baqara décrit l’Arche comme contenant une sakina de leur Seigneur et des vestiges de ce qu’avaient laissé la maison de Musa et la maison de Harun, portée par des anges {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585}. Pour la sakina, les commentateurs évoquent un bassin d’or où les cœurs des prophètes étaient lavés, un vent violent, quelque chose ressemblant à un chat ou un esprit parlant {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1173}. Pour les vestiges, ils évoquent les bâtons de Musa et de Harun et les fragments des Tables, certains y ajoutant leurs vêtements, le turban de Harun, la manne et la Torah ; al-Dahhak y voit le djihad {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1174}. Les livres rapportent que les Amalécites s’en emparèrent et qu’elle fut rendue aux Israélites sur un chariot conduit par des anges, ou portée par des anges {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585} {cite:tafsir-ibn-kathir scan vol. 1 p. 889}."
  ur: "سورۂ بقرہ کی آیت بتاتی ہے کہ تابوت میں ان کے رب کی طرف سے سکینہ اور آلِ موسیٰ و آلِ ہارون کا بقیہ تھا اور اسے فرشتے اٹھاتے تھے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585}۔ سکینہ کے بارے میں اقوال ہیں: سونے کا طشت جس میں انبیا کے دل دھوئے جاتے تھے، تیز ہوا، بلی جیسی کوئی چیز، یا بولنے والی روح {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1173}۔ بقیہ کے بارے میں: موسیٰ و ہارون کی لاٹھیاں اور تختیوں کے ٹکڑے، بعض مزید ان کے کپڑے، ہارون کا عمامہ، مَن اور تورات کا اضافہ کرتے ہیں، اور ضحاک کہتے ہیں کہ وہ جہاد ہے {cite:tafsir-ibn-kathir scan vol. 1 p. 888} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 1174}۔ کتابیں بتاتی ہیں کہ عمالقہ نے اسے لے لیا اور وہ فرشتوں کی ہانکی ہوئی گاڑی پر بنی اسرائیل کو لوٹایا گیا، یا فرشتوں نے اسے اٹھایا {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 585} {cite:tafsir-ibn-kathir scan vol. 1 p. 889}۔"
