label:
  ar: "قطعة طراز حريرية ⁦(١٣٢هـ)⁩ — مانشستر"
  en: "Tiraz silk fragment, 132 AH — Manchester"
  ur: "طراز ریشم کا ٹکڑا، 132ھ — مانچسٹر"
summary:
  ar: "قطعة من نسيج طراز في صورة قماش، كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها في مصر، وهي الجزء الرابع (D) من أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في معرض ويتوورث للفن بمانشستر برقم الجرد T.8496 {cite:tei-epigraphie 11979}."
  en: "A fragment of tiraz silk woven as a textile, bearing an Arabic maker's inscription dated 132 AH (749–750 CE); found in Egypt, it is part D of four fragments that once formed a single textile, held by the Whitworth Art Gallery, Manchester (accession T.8496) {cite:tei-epigraphie 11979}."
  ur: "طراز ریشم کا ٹکڑا جس پر عربی دستاویزی تحریر 132ھ ⁦(749–750ء)⁩ کی تاریخ رکھتی ہے؛ مصر میں ملا، وہ ایک ہی کپڑے کے چار ٹکڑوں میں سے حصہ D ہے، اور مانچسٹر کے وٹھسورتھ آرٹ گیلری میں محفوظ ہے ⁦(نمائندہ نمبر T.8496)⁩ {cite:tei-epigraphie 11979}۔"
