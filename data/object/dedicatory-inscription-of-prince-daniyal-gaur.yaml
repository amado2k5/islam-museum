summary:
  ar: "لوح من الشست عليه نقش تأسيس مسجد جامع بناه الأمير دانيال ابن السلطان علاء الدين حسين شاه في غور في العاشر من ذي الحجة 905هـ، بصيغة بنغالية من خط الطغراء تعرف بـ«القوس والسهم»؛ في متحف المتروبوليتان {cite:welch-india-art-and-culture-1985 p. 129} {cite:welch-india-art-and-culture-1985 p. 130}."
  en: "A schist slab bearing the foundation text of a congregational mosque built by Prince Daniyal, son of Sultan Ala al-Din Husain Shah, at Gaur on 10 Dhu al-Hijja AH 905, in the Bengali 'bow and arrow' variant of tughra script; in the Metropolitan Museum {cite:welch-india-art-and-culture-1985 p. 129} {cite:welch-india-art-and-culture-1985 p. 130}."
  ur: "شِسٹ پتھر کی تختی جس پر سلطان علاء الدین حسین شاہ کے بیٹے شہزادہ دانیال کی گوڑ میں 10 ذی الحجہ 905ھ کو بنائی گئی جامع مسجد کا کتبہ ہے، طغرا کی بنگالی صورت «تیر و کمان» میں؛ میٹروپولیٹن میوزیم میں {cite:welch-india-art-and-culture-1985 p. 130}۔"
