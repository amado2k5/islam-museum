label: { ar: "الكتاب النبوي لتميم الداري", en: "the Prophetic document of Tamim al-Dari" }
summary:
  ar: "قطعة أدم عليها نص إقطاع تميم الداري وإخوته حبرونَ والمرطوم وبيت عينون وبيت إبراهيم، مكتوبة بخط كوفي؛ عاينها ابن فضل الله العمري بعينه سنة 745هـ حين أحضرها ناصر الدين محمد بن الخليلي التميمي الداري، وهي محفوظة في خرقة سوداء من ملحم قطن وحرير من كمّ المستضيء أمير المؤمنين يضمها صندوق من آبنوس ملفوف بحرير، ونقل عنها نسخة بخط المستضيء نفسه — وفيها أن علي بن أبي طالب كتبها وشهد أبو بكر وعمر وعثمان؛ وشهدها الصفدي في تذكرته، وذكر القلقشندي أنها بقيت بأيدي التميميين خدام حرم الخليل إلى نحو 821هـ يحتجون بها على من ينازعهم {cite:umari-masalik-1924 p. 173-175}."
  en: "The scrap of leather bearing the Prophet's grant of Hebron, al-Martum, Bayt Aynun and Bayt Ibrahim to Tamim al-Dari and his brothers, in bold Kufic; al-Umari saw it with his own eyes in 745 when Nasir al-Din al-Khalili al-Tamimi produced it — kept in a black silk-and-cotton sleeve from the caliph al-Mustadi's own cuff inside an ebony box wrapped in silk, and Umari copied it from al-Mustadi's authenticated transcript noting Ali ibn Abi Talib wrote it with Abu Bakr, Umar and Uthman as witnesses; al-Safadi quotes Abu Bakr al-Arabi who saw it, and al-Qalqashandi records it still in the Tamimis' hands toward 821, produced before the sultan whenever their right was contested {cite:umari-masalik-1924 p. 173-175}."
