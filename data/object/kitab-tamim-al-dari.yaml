label: { ar: "الكتاب النبوي لتميم الداري", en: "the Prophetic document of Tamim al-Dari", fr: "Le document prophétique de Tamim al-Dari", es: "El documento profético de Tamim al-Dari", ur: "تمیم الداری کی پیغمبرانہ دستاویز", tr: "Tamim al-Dari'nin Peygamberlik Kitabı", id: "Kitab Kenabian Tamim al-Dari" }
summary:
  ar: "قطعة أدم عليها نص إقطاع تميم الداري وإخوته حبرونَ والمرطوم وبيت عينون وبيت إبراهيم، مكتوبة بخط كوفي؛ عاينها ابن فضل الله العمري بعينه سنة 745هـ حين أحضرها ناصر الدين محمد بن الخليلي التميمي الداري، وهي محفوظة في خرقة سوداء من ملحم قطن وحرير من كمّ المستضيء أمير المؤمنين يضمها صندوق من آبنوس ملفوف بحرير، ونقل عنها نسخة بخط المستضيء نفسه — وفيها أن علي بن أبي طالب كتبها وشهد أبو بكر وعمر وعثمان؛ وشهدها الصفدي في تذكرته، وذكر القلقشندي أنها بقيت بأيدي التميميين خدام حرم الخليل إلى نحو 821هـ يحتجون بها على من ينازعهم {cite:umari-masalik-1924 p. 173-175}."
  en: "The scrap of leather bearing the Prophet's grant of Hebron, al-Martum, Bayt Aynun and Bayt Ibrahim to Tamim al-Dari and his brothers, in bold Kufic; al-Umari saw it with his own eyes in 745 when Nasir al-Din al-Khalili al-Tamimi produced it — kept in a black silk-and-cotton sleeve from the caliph al-Mustadi's own cuff inside an ebony box wrapped in silk, and Umari copied it from al-Mustadi's authenticated transcript noting Ali ibn Abi Talib wrote it with Abu Bakr, Umar and Uthman as witnesses; al-Safadi quotes Abu Bakr al-Arabi who saw it, and al-Qalqashandi records it still in the Tamimis' hands toward 821, produced before the sultan whenever their right was contested {cite:umari-masalik-1924 p. 173-175}."
  fr: "Le morceau de cuir portant la concession par le Prophète d’Hébron, d’al-Martum, de Bayt Aynun et de Bayt Ibrahim à Tamim al-Dari et à ses frères, en grandes lettres coufiques ; al-Umari le vit de ses propres yeux en 745 lorsque Nasir al-Din al-Khalili al-Tamimi le lui présenta — conservé dans une manche noire de soie et de coton provenant du propre vêtement du calife al-Mustadi’, dans un coffret d’ébène enveloppé de soie ; al-Umari le copia d’après la transcription authentifiée d’al-Mustadi’, indiquant qu’Ali ibn Abi Talib l’avait écrit et qu’Abu Bakr, Umar et Uthman en étaient témoins ; al-Safadi cite Abu Bakr al-Arabi, qui le vit, et al-Qalqashandi rapporte qu’il était encore entre les mains des Tamimi vers 821, présenté au sultan chaque fois que leur droit était contesté {cite:umari-masalik-1924 p. 173-175}."
  es: "El trozo de cuero que lleva la concesión del Profeta de Hebrón, al-Martum, Bayt Aynun y Bayt Ibrahim a Tamim al-Dari y sus hermanos, en cúfico en negrita; al-Umari lo vio con sus propios ojos en 745 cuando Nasir al-Din al-Khalili al-Tamimi lo presentó, guardado en una funda de seda y algodón negro del propio puño del califa al-Mustadi dentro de una caja de ébano envuelta en seda, y Umari lo copió de la transcripción autenticada de al-Mustadi que señala que Ali ibn Abi Talib lo escribió con Abu Bakr, Umar y Uthman como testigos; al-Safadi cita a Abu Bakr al-Arabi que lo vio, y al-Qalqashandi registra que todavía estaba en manos de los Tamimi hacia 821, presentado ante el sultán cada vez que se disputaba su derecho {cite:umari-masalik-1924 p. 173-175}."
  ur: "تمیم الداری اور ان کے بھائیوں کو حبرون، المرتوم، بیت عینون اور بیت ابراہیم کی عطا کردہ چمڑے کا ٹکڑا، جلی کوفی میں؛ العمری نے اسے 745 میں اپنی آنکھوں سے دیکھا جب ناصر الدین الخلیلی التمیمی نے اسے تیار کیا - جسے خلیفہ المستدی کے اپنے کف سے ایک سیاہ ریشم اور سوتی آستین میں ریشم میں لپٹے آبنوس کے خانے کے اندر رکھا گیا تھا، اور عمری نے اسے المسطنین المستدین سے نقل کیا تھا۔ طالب نے اسے ابوبکر، عمر اور عثمان کے ساتھ بطور گواہ لکھا۔ الصفادی نے ابوبکر العربی کا حوالہ دیا ہے جس نے اسے دیکھا تھا، اور القلقاشندی نے اسے 821 تک تمیمیوں کے ہاتھ میں درج کیا ہے، جب بھی ان کے حق کا مقابلہ کیا گیا تو سلطان کے سامنے پیش کیا گیا۔ 173-175}۔"
  tr: "Üzerinde Hebron, El-Martum, Beyt Ayun ve Beyt İbrahim'in bağışına dair metnin Kufi yazısıyla yazıldığı bir deri parçası; İbn Fadlallah el-Umari bunu Hicri 745 yılında Nasır el-Din Muhammed İbn el-Halili el-Tamimi el-Dari getirdiğinde kendi gözleriyle görmüştür ve Müminlerin Emiri el-Mustadiye'nin kolundan alınmış, pamuk ve ipekten yapılmış siyah bir kumaşa sarılı olarak, ipekle sarılmış abanoz bir kutuda muhafaza edilmektedir ve el-Mustadiye'nin kendi el yazısıyla bir kopyası yapılmıştır - ve bu kopyada Ali İbn Abi Talib'in yazdığı, Ebu Bekir, Ömer ve Osman'ın şahitlik ettiği belirtilmiştir; El-Safadi bunu kendi muhtırasında şahitlik etmiş, El-Kalkaşandi ise bunun Hicri 821 yılına kadar Hebron mabedinin hizmetkarları olan Tamimilerin elinde kaldığını ve bunu kendileriyle ihtilafa düşenlere karşı delil olarak kullandıklarını belirtmiştir. {Kaynak: Umari-Masalik-1924 s. 173-175}"
  id: "Selembar kulit dengan teks hibah Hebron, Al-Martoum, Beit Ainun, dan Beit Ibrahim yang ditulis dalam aksara Kufi; Ibnu Fadlallah Al-Umari melihatnya dengan mata kepala sendiri pada tahun 745 H ketika Nasir Al-Din Muhammad Ibnu Al-Khalili Al-Tamimi Al-Dari membawanya, dan disimpan dalam kain hitam dari katun dan sutra dari lengan Al-Mustadi’, Amirul Mukminin, yang tersimpan dalam kotak ebony yang dibungkus sutra, dan salinannya dibuat dengan tulisan tangan Al-Mustadi’ sendiri — dan di dalamnya disebutkan bahwa Ali Ibnu Abi Talib yang menulisnya dan Abu Bakar, Umar, dan Utsman menjadi saksinya; dan Al-Safadi menjadi saksi atas hal itu dalam catatannya, dan Al-Qalqashandi menyebutkan bahwa kitab itu tetap berada di tangan kaum Tami, para pelayan tempat suci Hebron, hingga sekitar tahun 821 H, dan mereka menggunakannya sebagai bukti melawan orang-orang yang membantah mereka {cite:umari-masalik-1924 p. 173-175}."
