label: { ar: "مهاكال", en: "Mahakala" }
summary:
  ar: "مهاكال صنم للهند له أربع أيد ولونه أسمانجوني كثير شعر الرأس سبطه كاشر الأسنان كاشف البطن على ظهره جلد فيل يقطر منه الدم قد عقد بجلد يدي الفيل بين يديه وبإحدى يديه ثعبان عظيم فاغر فاه وبالأخرى عصا وبالثالثة رأس إنسان والرابعة مرفوعة وفي أذنيه حيتان كالقرطين وعلى جسده ثعبانان عظيمان التفا عليه وعلى رأسه إكليل من عظام القجف، ويزعمون أنه عفريت من الشياطين يستحق العبادة لعظيم قدره واستحقاقه الخصال المحمودة والمذمومة من العطية والمنع والإحسان والإساءة وأنه المفزع {cite:fihrist-ibn-al-nadim p. 488}."
  en: "Mahakala — the four-armed blue idol of the Indians as described in Yahya al-Barmaki's commissioned book {cite:fihrist-ibn-al-nadim}"
