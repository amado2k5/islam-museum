summary:
  ar: "مهاكال صنم للهند له أربع أيد ولونه أسمانجوني كثير شعر الرأس سبطه كاشر الأسنان كاشف البطن على ظهره جلد فيل يقطر منه الدم قد عقد بجلد يدي الفيل بين يديه وبإحدى يديه ثعبان عظيم فاغر فاه وبالأخرى عصا وبالثالثة رأس إنسان والرابعة مرفوعة وفي أذنيه حيتان كالقرطين وعلى جسده ثعبانان عظيمان التفا عليه وعلى رأسه إكليل من عظام القجف، ويزعمون أنه عفريت من الشياطين يستحق العبادة لعظيم قدره واستحقاقه الخصال المحمودة والمذمومة من العطية والمنع والإحسان والإساءة وأنه المفزع {cite:fihrist-ibn-al-nadim p. 488}."
  en: "Mahakala — the four-armed blue idol of the Indians as described in Yahya al-Barmaki's commissioned book {cite:fihrist-ibn-al-nadim}"
  fr: "Mahakala — l’idole indienne bleue à quatre bras décrite dans l’ouvrage commandé par Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  es: "Mahakala — el ídolo azul de cuatro brazos de los indios, tal como se describe en el libro encargado a Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  ur: "مہاکالا - ہندوستانیوں کا چار بازو والا نیلا بت جیسا کہ یحییٰ البرمکی کی کتاب میں بیان کیا گیا ہے۔"
  tr: "Mahakal, Hindistan'ın bir putudur. Dört eli vardır ve açık kahverengi renktedir. Başı çok kıllı ve düzdür. Dişleri çıplaktır ve karnı açıktır. Sırtında kan damlayan bir fil derisi vardır. Filin ellerinin derisini ellerinin arasına bağlamıştır. Bir elinde ağzı açık büyük bir yılan, diğerinde bir asa, üçüncüsünde bir insan başı ve dördüncüsü yukarı kaldırılmıştır. Kulaklarında küpe gibi iki yılan, vücudunda ise etrafına dolanmış iki büyük yılan vardır. Başında kafatası kemiklerinden bir taç bulunur. Onun, büyük gücü ve hem övülecek hem de kınanacak özelliklere sahip olması, verme ve esirgeme, iyilik ve kötülük gibi nitelikleri nedeniyle tapınmaya layık bir iblis olduğu ve ondan korkulması gerektiği iddia edilir. {cite:fihrist-ibn-al-nadim s. 488}"
  id: "Mahakal adalah sebuah arca di India. Ia memiliki empat tangan dan berwarna cokelat muda. Kepalanya sangat berbulu dan lurus. Giginya terlihat dan perutnya terbuka. Di punggungnya terdapat kulit gajah yang meneteskan darah. Ia mengikat kulit tangan gajah di antara kedua tangannya. Di salah satu tangannya terdapat ular besar dengan mulut terbuka, di tangan lainnya sebuah tongkat, di tangan ketiga sebuah kepala manusia, dan tangan keempat terangkat. Di telinganya terdapat dua ular seperti anting-anting, dan di tubuhnya terdapat dua ular besar yang melilitnya. Di kepalanya terdapat mahkota tulang tengkorak. Mereka mengklaim bahwa ia adalah iblis yang pantas disembah karena kekuatannya yang besar dan sifat-sifatnya yang terpuji dan tercela, yaitu memberi dan menahan, kebaikan dan kejahatan, dan bahwa dialah yang harus ditakuti. {cite:fihrist-ibn-al-nadim p. 488}."
