  ur: "بیاد اور ریاض کی محبت کی کہانی کا 13 ویں صدی کا اندلسی نسخہ الاندلس سے واحد زندہ بچ جانے والی تصویری عربی متن۔"
  tr: "Bayad ve Riyad arasındaki aşk hikayesini anlatan, 13. yüzyıla ait eşsiz bir Endülüs resimli el yazması; Endülüs'ten günümüze ulaşan tek resimli Arapça metin."
  id: "Manuskrip bergambar unik dari Andalusia abad ke-13 yang menceritakan kisah cinta antara Bayad dan Riyad; satu-satunya teks Arab bergambar yang masih ada dari Andalusia."
