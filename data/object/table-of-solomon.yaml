id: object/table-of-solomon
class: object
kind: relic
label: { ar: "مائدة سليمان", en: "Table of Solomon" }
summary:
  ar: "ذكر بعض المؤرخين أن الغرائب التي أصيبت في مغائم الأندلس أيام فتحها كمائدة سليمان التي ألفاها طارق بن زياد بكنيسة طليطلة وقليلة الدر التي ألفاها موسى بن نصير بكنيسة ماردة إنما كانت مما صار لصاحب الأندلس من غنيمة بيت المقدس إذ حضر فتحها مع بختنصر وكان اسم ذلك الملك بريان وفي سهمه وقع ذلك {cite:nafh-tib-maqqari p. 171}. وقيل إنها من زبرجدة خضراء حافاتها وأرجلها منها وكان لها ثلاثمائة وخمس وستون رجلاً وكانت توضع في كنيسة طليطلة، وزعم بعض العجم أنها لم تكن لسليمان وإنما كانت من الآلات التي تصنعها الكنائس من مواريث أهل الحسنة في دينهم للمباهاة في الأعياد فتأنق ملوك القوط في تحسينها حتى برزت على جميع ما اتخذ {cite:nafh-tib-maqqari p. 325-326}."
  en: "The jewelled 'table of Solomon' Tariq b. Ziyad found in Toledo's church — the historians trace it and Musa's pearl casket from Merida back to the spoils of Jerusalem carried off at Nebuchadnezzar's sack by the king of al-Andalus, Buryan {cite:nafh-tib-maqqari p. 171}."
