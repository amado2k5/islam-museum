label: { ar: "مائدة سليمان", en: "Table of Solomon", fr: "Table de Salomon", es: "Tabla de Salomón", ur: "میزان سلیمان", tr: "Süleyman'ın Sofrası", id: "Meja Salomo" }
summary:
  ar: "ذكر بعض المؤرخين أن الغرائب التي أصيبت في مغائم الأندلس أيام فتحها كمائدة سليمان التي ألفاها طارق بن زياد بكنيسة طليطلة وقليلة الدر التي ألفاها موسى بن نصير بكنيسة ماردة إنما كانت مما صار لصاحب الأندلس من غنيمة بيت المقدس إذ حضر فتحها مع بختنصر وكان اسم ذلك الملك بريان وفي سهمه وقع ذلك {cite:nafh-tib-maqqari p. 171}. وقيل إنها من زبرجدة خضراء حافاتها وأرجلها منها وكان لها ثلاثمائة وخمس وستون رجلاً وكانت توضع في كنيسة طليطلة، وزعم بعض العجم أنها لم تكن لسليمان وإنما كانت من الآلات التي تصنعها الكنائس من مواريث أهل الحسنة في دينهم للمباهاة في الأعياد فتأنق ملوك القوط في تحسينها حتى برزت على جميع ما اتخذ {cite:nafh-tib-maqqari p. 325-326}."
  en: "The jewelled 'table of Solomon' Tariq b. Ziyad found in Toledo's church — the historians trace it and Musa's pearl casket from Merida back to the spoils of Jerusalem carried off at Nebuchadnezzar's sack by the king of al-Andalus, Buryan {cite:nafh-tib-maqqari p. 171}."
  fr: "La « table de Salomon » sertie de pierres précieuses que Tariq ibn Ziyad trouva dans l’église de Tolède — les historiens la font remonter, avec le coffret de perles de Musa trouvé à Mérida, au butin de Jérusalem emporté lors du sac de Nabuchodonosor par le roi d’al-Andalus, Buryan {cite:nafh-tib-maqqari p. 171}."
  es: "La 'mesa de Salomón' enjoyada que Tariq b. Ziyad encontró en la iglesia de Toledo, los historiadores la relacionan, junto con el cofre de perlas de Musa, con el botín de Jerusalén que el rey de al-Ándalus, Buryan, se llevó durante el saqueo de Nabucodonosor {cite:nafh-tib-maqqari p. 171}."
  ur: "زیورات سے مزین 'ٹیبل آف سلیمان' طارق بی۔ زیاد ٹولیڈو کے گرجا گھر میں پایا جاتا ہے - مورخین اس کا سراغ لگاتے ہیں اور موسیٰ کا موتی کا تابوت میریڈا سے یروشلم کے لوٹے ہوئے مال کو اندلس کے بادشاہ، بوریان نے نبوکدنضر کی بوری پر لے جایا تھا۔ 171}۔"
  tr: "Bazı tarihçiler, Tarık ibn Ziyad'ın Toledo kilisesinde bulduğu Süleyman'ın Masası ve Musa ibn Nusayr'ın Mérida kilisesinde bulduğu Küçük İnci gibi, Endülüs'ün fethi sırasında gökyüzünde bulunan garip eserlerin, Kudüs'ün fethinde Nebukadnezar ile birlikte bulunan Endülüs hükümdarına düşen savaş ganimetleri arasında olduğunu belirtmişlerdir. Bu kralın adı Brienne idi ve bu eser onun ganimet payına düşmüştü {kaynak:nafh-tib-maqqari s. 171}. Yeşil zümrütten yapıldığı, kenarları ve ayaklarının aynı malzemeden olduğu ve üç yüz altmış beş ayağı olduğu söylenmiştir. Toledo kilisesine yerleştirilmiştir. Bazı Arap olmayanlar, bunun Süleyman'a ait olmadığını, aksine kiliselerin bayramlarda sergilemek üzere dinlerinde iyiliğe önem veren insanların miraslarından yaptığı süslerden biri olduğunu iddia ettiler. Vizigot kralları, onu o zamana kadar yapılmış olan her şeyi geride bırakacak şekilde süslemeye büyük özen gösterdiler. {cite:nafh-tib-maqqari pp. 325-326}"
  id: "Beberapa sejarawan menyebutkan bahwa artefak aneh yang ditemukan di langit Andalusia selama penaklukannya, seperti Meja Salomo, yang ditemukan Tariq ibn Ziyad di gereja Toledo, dan Mutiara Kecil, yang ditemukan Musa ibn Nusayr di gereja Mérida, termasuk di antara rampasan perang yang jatuh ke tangan penguasa Andalusia dari penaklukan Yerusalem, karena ia hadir dalam penaklukan tersebut bersama Nebukadnezar. Nama raja itu adalah Brienne, dan mutiara itu termasuk dalam bagian rampasan perangnya {cite:nafh-tib-maqqari hlm. 171}. Konon, mutiara itu terbuat dari zamrud hijau, dengan tepi dan kakinya terbuat dari bahan yang sama, dan memiliki tiga ratus enam puluh lima kaki. Mutiara itu ditempatkan di gereja Toledo. Beberapa orang non-Arab mengklaim bahwa itu bukan milik Sulaiman, melainkan salah satu ornamen yang dibuat gereja dari warisan orang-orang baik dalam agama mereka, untuk dipajang selama festival. Raja-raja Visigoth sangat berhati-hati dalam memperindahnya hingga melampaui semua yang pernah dibuat {cite:nafh-tib-maqqari pp. 325-326}."
