label: { ar: "مائدة سليمان" }
summary:
  ar: "ذكر بعض المؤرخين أن الغرائب التي أصيبت في مغائم الأندلس أيام فتحها كمائدة سليمان التي ألفاها طارق بن زياد بكنيسة طليطلة وقليلة الدر التي ألفاها موسى بن نصير بكنيسة ماردة إنما كانت مما صار لصاحب الأندلس من غنيمة بيت المقدس إذ حضر فتحها مع بختنصر وكان اسم ذلك الملك بريان وفي سهمه وقع ذلك {cite:nafh-tib-maqqari p. 171}."
  en: "The jewelled 'table of Solomon' Tariq b. Ziyad found in Toledo's church — the historians trace it and Musa's pearl casket from Merida back to the spoils of Jerusalem carried off at Nebuchadnezzar's sack by the king of al-Andalus, Buryan {cite:nafh-tib-maqqari p. 171}."
