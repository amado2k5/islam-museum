label: { ar: "مصباح قبة الصخرة المؤرخ 956هـ", en: "Dome of the Rock mosque lamp dated 956 AH", fr: "Lampe de mosquée du Dôme du Rocher datée de 956 H", ur: "قبۃ الصخرہ کا 956ھ کا چراغ", es: "Lámpara de la Cúpula de la Roca, fechada en el año 956 AH.", tr: "Kubbetü'l-Sahrâ'nın lambası, Hicri 956 yılına tarihlenmektedir.", id: "Lampu Kubah Batu, bertanggal 956 AH" }
summary:
  ar: "مصباح مسجد عثماني من الخزف، مرسوم بالأزرق والفيروزي، من «مسجد عمر» ⁦(قبة الصخرة)⁩ في القدس، مؤرخ جمادى الأولى سنة 956هـ وموقّع «الفقير الحقير مصطفى»، محفوظ في المتحف البريطاني {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  en: "Ottoman ceramic mosque lamp painted in blue and turquoise, from the 'Mosque of Omar' (the Dome of the Rock) in Jerusalem, dated Jumada I 956 AH and signed 'the poor, the humble Mustafa', in the British Museum {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  fr: "Lampe de mosquée ottomane en céramique peinte en bleu et turquoise, provenant de la « mosquée d’Omar » (le Dôme du Rocher) à Jérusalem, datée de joumada I 956 H et signée « le pauvre, l’humble Mustafa », au British Museum {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  ur: "عثمانی چینی کا مسجد کا چراغ، نیلے اور فیروزی سے مزین، یروشلم کی «مسجدِ عمر» ⁦(قبۃ الصخرہ)⁩ سے، جمادی الاولیٰ 956ھ کی تاریخ اور «فقیر حقیر مصطفیٰ» کے دستخط کے ساتھ، برٹش میوزیم میں {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}۔"
  es: "Lámpara de mezquita de cerámica otomana pintada en azul y turquesa, de la 'Mezquita de Omar' (la Cúpula de la Roca) en Jerusalén, fechada en Jumada I 956 AH y firmada 'el pobre, el humilde Mustafa', en el Museo Británico {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  tr: "Kudüs'teki Ömer Camii'nden (Kubbetü'l-Sahrâ) kalma, mavi ve turkuaz renklere boyanmış, seramikten yapılmış bir Osmanlı cami lambası. Hicri 956 Cemâde-i Ula tarihli ve \"Yoksul ve mütevazı Mustafa\" imzalı bu lamba, Britanya Müzesi'nde muhafaza edilmektedir. {cite:hobson-guide-islamic-pottery-near-east-1932 s. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 s. 151}"
  id: "Sebuah lampu masjid Ottoman yang terbuat dari keramik, dicat biru dan pirus, dari “Masjid Umar” (Kubah Batu) di Yerusalem, bertanggal Jumada al-Ula 956 H dan ditandatangani “Mustafa yang miskin dan rendah hati”, disimpan di British Museum {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
