summary:
  ar: "مصباح مسجد عثماني من الخزف، مرسوم بالأزرق والفيروزي، من «مسجد عمر» ⁦(قبة الصخرة)⁩ في القدس، مؤرخ جمادى الأولى سنة 956هـ وموقّع «الفقير الحقير مصطفى»، محفوظ في المتحف البريطاني {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  en: "Ottoman ceramic mosque lamp painted in blue and turquoise, from the 'Mosque of Omar' (the Dome of the Rock) in Jerusalem, dated Jumada I 956 AH and signed 'the poor, the humble Mustafa', in the British Museum {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}."
  ur: "عثمانی چینی کا مسجد کا چراغ، نیلے اور فیروزی سے مزین، یروشلم کی «مسجدِ عمر» ⁦(قبۃ الصخرہ)⁩ سے، جمادی الاولیٰ 956ھ کی تاریخ اور «فقیر حقیر مصطفیٰ» کے دستخط کے ساتھ، برٹش میوزیم میں {cite:hobson-guide-islamic-pottery-near-east-1932 p. 150} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 151}۔"
