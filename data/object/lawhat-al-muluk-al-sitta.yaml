summary:
  ar: "جدارية في قصر عمرة الأموي بالأردن تصور ستة ملوك بينهم ملكو كسرى وقيصر ونجاشي؛ من أقدم الصور الجدارية الإسلامية الباقية."
  en: "A fresco in the Umayyad palace of Qusayr Amra in Jordan showing six kings, including Kisra, Caesar and the Negus; among the oldest surviving Islamic wall paintings."
  fr: "Une fresque du palais omeyyade de Qusayr Amra, en Jordanie, représentant six rois, dont Kisra, César et le Négus ; parmi les plus anciennes peintures murales islamiques conservées."
  es: "Un fresco en el palacio omeya de Qusayr Amra en Jordania que muestra a seis reyes, entre ellos Kisra, César y el Negus; una de las pinturas murales islámicas más antiguas que se conservan."
  ur: "اردن میں قصیر امرا کے اموی محل میں ایک فریسکو جس میں چھ بادشاہوں کو دکھایا گیا ہے، جن میں کسریٰ، قیصر اور نجاشی شامل ہیں۔ قدیم ترین اسلامی دیواری پینٹنگز میں سے۔"
  tr: "Ürdün'deki Amra'da bulunan Emevi sarayındaki bir duvar resminde, Hüsrev, Sezar ve Negus kralları da dahil olmak üzere altı kral tasvir edilmiştir; bu, günümüze kadar ulaşan en eski İslami duvar resimlerinden biridir."
  id: "Sebuah mural di istana Umayyah di Amra, Yordania, menggambarkan enam raja, termasuk raja Khosrow, Caesar, dan Negus; ini adalah salah satu mural Islam tertua yang masih ada."
