label: { ar: "كنز أم حجرة الفضي", en: "Umm Hajara silver hoard", fr: "Trésor d’argent d’Umm Hajara", ur: "ام حجرہ کا چاندی کا خزانہ", es: "Tesoro de plata de Umm Hajara", tr: "Gümüş hazine veya oda", id: "Harta karun perak atau ruangan" }
summary:
  ar: "كنز من 409 دراهم فضية ساسانية وعربية ساسانية وأموية وعباسية، وُجد قرب قرية أم حجرة شمالي الحسكة وسُلّم إلى المديرية العامة للآثار والمتاحف بسوريا في 11 أيار 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
  en: "A hoard of 409 Sasanian, Arab-Sasanian, Umayyad and Abbasid silver dirhams found near the village of Umm Hajara north of al-Hasaka and handed to Syria's Directorate-General of Antiquities and Museums on 11 May 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
  fr: "Un trésor de 409 dirhams d’argent sassanides, arabo-sassanides, omeyyades et abbassides, découvert près du village d’Umm Hajara au nord d’al-Hasaka et remis à la Direction générale des antiquités et des musées de Syrie le 11 mai 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
  ur: "409 ساسانی، عرب ساسانی، اموی اور عباسی چاندی کے درہموں کا خزانہ جو الحسکہ کے شمال میں ام حجرہ گاؤں کے قریب ملا اور 11 مئی 1970ء کو شام کے محکمۂ آثار و عجائب گھر کے حوالے کیا گیا {cite:ush-kanz-umm-hajara-1972 p. 5}۔"
  es: "Un tesoro de 409 dirhams de plata sasánidas, árabe-sasánidas, omeyas y abasíes encontrado cerca de la aldea de Umm Hajara, al norte de al-Hasaka, y entregado a la Dirección General de Antigüedades y Museos de Siria el 11 de mayo de 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
  tr: "Haseke'nin kuzeyindeki Umm Hajara köyü yakınlarında 409 adet Sasani, Emevi ve Abbasi gümüş dirhemi bulundu ve 11 Mayıs 1970'te Suriye Eski Eserler ve Müzeler Genel Müdürlüğü'ne teslim edildi. {cite:ush-kanz-umm-hajara-1972 s. 5}"
  id: "Timbunan 409 dirham perak Sasaniyah, Umayyah, dan Abbasiyah ditemukan di dekat desa Umm Hajara, sebelah utara Hasakah, dan diserahkan kepada Direktorat Jenderal Purbakala dan Museum di Suriah pada tanggal 11 Mei 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
