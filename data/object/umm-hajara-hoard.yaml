  en: "A hoard of 409 Sasanian, Arab-Sasanian, Umayyad and Abbasid silver dirhams found near the village of Umm Hajara north of al-Hasaka and handed to Syria's Directorate-General of Antiquities and Museums on 11 May 1970 {cite:ush-kanz-umm-hajara-1972 p. 5}."
  ur: "409 ساسانی، عرب ساسانی، اموی اور عباسی چاندی کے درہموں کا خزانہ جو الحسکہ کے شمال میں ام حجرہ گاؤں کے قریب ملا اور 11 مئی 1970ء کو شام کے محکمۂ آثار و عجائب گھر کے حوالے کیا گیا {cite:ush-kanz-umm-hajara-1972 p. 5}۔"
