id: object/khatam-al-nabi
class: object
kind: relic
label: { ar: "خاتم النبي", en: "the Prophet's signet ring" }
summary:
  ar: "خاتم فضة نقشه «محمد رسول الله» في ثلاثة أسطر: محمدٌ سطر ورسولٌ سطر والله سطر؛ اتخذه النبي لما أريد أن يكاتب رهطاً من الأعاجم فقيل له إنهم لا يقبلون كتاباً إلا مختوماً {cite:sahih-al-bukhari 5872}، وكان فصه منه يلي باطن كفه {cite:sahih-al-bukhari 5870}. ويروي ابن عمر أنه اتخذ أولاً خاتماً من ذهب فلما اتخذ الناس مثله نبذه وقال «لا ألبسه أبداً» ثم اتخذ الفضة، ولبسه بعده أبو بكر ثم عمر ثم عثمان حتى وقع من عثمان في بئر أريس {cite:sahih-al-bukhari 5866}. وختم به أبو بكر كتاباً إلى البحرين حين استُخلف {cite:sahih-al-bukhari 3106}."
  en: "A silver signet ring inscribed 'Muhammad, Messenger of God' in three lines — Muhammad a line, rasul a line, and Allah a line — adopted when the Prophet was told the foreign kings would not accept an unsealed letter {cite:sahih-al-bukhari 5872}, its bezel of the same silver and turned toward the palm {cite:sahih-al-bukhari 5870}. Ibn 'Umar reports a gold ring first, cast off when people copied it — 'I will never wear it' — then the silver one; Abu Bakr wore it after him, then 'Umar, then 'Uthman, from whose hand it fell into the well of Aris {cite:sahih-al-bukhari 5866}. Abu Bakr sealed with it the letter he sent to Bahrain on taking office {cite:sahih-al-bukhari 3106}."
