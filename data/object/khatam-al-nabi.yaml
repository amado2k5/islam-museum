label: { ar: "خاتم النبي", en: "the Prophet's signet ring", fr: "La bague-sceau du Prophète", es: "el anillo de sello del Profeta", ur: "نبی کی انگوٹھی" }
summary:
  ar: "خاتم فضة نقشه «محمد رسول الله» في ثلاثة أسطر: محمدٌ سطر ورسولٌ سطر والله سطر؛ اتخذه النبي لما أريد أن يكاتب رهطاً من الأعاجم فقيل له إنهم لا يقبلون كتاباً إلا مختوماً {cite:sahih-al-bukhari 5872}، وكان فصه منه يلي باطن كفه {cite:sahih-al-bukhari 5870}. ويروي ابن عمر أنه اتخذ أولاً خاتماً من ذهب فلما اتخذ الناس مثله نبذه وقال «لا ألبسه أبداً» ثم اتخذ الفضة، ولبسه بعده أبو بكر ثم عمر ثم عثمان حتى وقع من عثمان في بئر أريس {cite:sahih-al-bukhari 5866}. وختم به أبو بكر كتاباً إلى البحرين حين استُخلف {cite:sahih-al-bukhari 3106}."
  en: "A silver signet ring inscribed 'Muhammad, Messenger of God' in three lines — Muhammad a line, rasul a line, and Allah a line — adopted when the Prophet was told the foreign kings would not accept an unsealed letter {cite:sahih-al-bukhari 5872}, its bezel of the same silver and turned toward the palm {cite:sahih-al-bukhari 5870}. Ibn 'Umar reports a gold ring first, cast off when people copied it — 'I will never wear it' — then the silver one; Abu Bakr wore it after him, then 'Umar, then 'Uthman, from whose hand it fell into the well of Aris {cite:sahih-al-bukhari 5866}. Abu Bakr sealed with it the letter he sent to Bahrain on taking office {cite:sahih-al-bukhari 3106}."
  fr: "Une bague-sceau en argent portant « Muhammad, Messager de Dieu » en trois lignes — Muhammad sur une ligne, rasul sur une ligne et Allah sur une ligne — adoptée lorsque le Prophète apprit que les rois étrangers n’accepteraient pas de lettre non scellée {cite:sahih-al-bukhari 5872}, au chaton du même argent et tourné vers la paume {cite:sahih-al-bukhari 5870}. Ibn ‘Umar rapporte qu’il eut d’abord une bague en or, qu’il jeta quand les gens l’imitèrent — « Je ne la porterai jamais » — puis celle en argent ; Abu Bakr la porta après lui, puis ‘Umar, puis ‘Uthman, de la main duquel elle tomba dans le puits d’Aris {cite:sahih-al-bukhari 5866}. Abu Bakr en scella la lettre qu’il envoya à Bahreïn à son entrée en fonction {cite:sahih-al-bukhari 3106}."
  es: "Un anillo de sello de plata con la inscripción \"Muhammad, Mensajero de Dios\" en tres líneas —una línea para Muhammad, otra para rasul y otra para Allah— fue adoptado cuando se le informó al Profeta que los reyes extranjeros no aceptarían una carta sin sellar {cite:sahih-al-bukhari 5872}, con su bisel de la misma plata y orientado hacia la palma de la mano {cite:sahih-al-bukhari 5870}. Ibn 'Umar relata que primero se usó un anillo de oro, que fue desechado cuando la gente lo copió —\"Nunca lo usaré\"—, luego el de plata; Abu Bakr lo usó después de él, luego 'Umar, luego 'Uthman, de cuya mano cayó al pozo de Aris {cite:sahih-al-bukhari 5866}. Abu Bakr selló con él la carta que envió a Bahrein al asumir el cargo {cite:sahih-al-bukhari 3106}."
  ur: "چاندی کی ایک انگوٹھی میں تین سطروں میں محمد، رسول اللہ کا لکھا ہوا تھا - محمد ایک سطر، رسول ایک سطر، اور اللہ ایک سطر - اس وقت اختیار کی گئی جب نبی کو بتایا گیا کہ غیر مہر شدہ خط کو قبول نہیں کریں گے {حوالہ: صحیح البخاری 5872}، اس کی بیزل اسی چاندی کی تھی اور اس کی طرف رخ کیا۔ 5870}۔ ابن عمر بتاتے ہیں کہ پہلے سونے کی انگوٹھی تھی، جب لوگوں نے اسے نقل کیا تو اسے پھینک دیا - 'میں اسے کبھی نہیں پہنوں گا' - پھر چاندی کی انگوٹھی؛ اسے ابوبکر نے اپنے بعد پہنا، پھر عمر نے، پھر عثمان نے، جن کے ہاتھ سے یہ عریس کے کنویں میں گرا ⁦(صحیح بخاری 5866)⁩ ابوبکر نے اس پر وہ خط مہر لگا دیا جو انہوں نے عہدہ سنبھالنے پر بحرین کو بھیجا تھا۔"
