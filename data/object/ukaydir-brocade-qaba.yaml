label: { ar: "قباء أكيدر الديباج", en: "Ukaydir's brocade coat (qaba')", fr: "Le manteau de brocart d’Ukaydir (qaba’)", es: "Abrigo de brocado de Ukaydir (qaba')", ur: "Ukaydir کا بروکیڈ کوٹ ⁦(قبہ)⁩", tr: "Akider brokar pelerin", id: "Jubah brokat Akider" }
summary:
  ar: "قباء من ديباج مخوّص بالذهب كان على أكيدر، استلبه خالد بن الوليد وبعث به إلى النبي، فجعل المسلمون يلمسونه ويتعجبون منه."
  en: A qaba gown of gold-laced brocade worn by Ukaydir; Khalid ibn al-Walid took it and sent it to the Prophet, and the Muslims kept touching it in wonder.
  fr: "Une robe qaba’ de brocart entrelacé d’or portée par Ukaydir ; Khalid ibn al-Walid la prit et l’envoya au Prophète, et les musulmans ne cessaient de la toucher avec émerveillement."
  es: "A posee una túnica de brocado con encaje de oro que perteneció a Ukaydir; Khalid ibn al-Walid la tomó y se la envió al Profeta, y los musulmanes no dejaban de tocarla con asombro."
  ur: "A کے پاس سونے کے لیس بروکیڈ کا گاؤن ہے جسے Ukaydir پہنا ہوا ہے۔ خالد بن ولید نے اسے لے کر رسول اللہ کے پاس بھیج دیا اور مسلمان حیرت سے اسے چھوتے رہے۔"
  tr: "Ukaydir'e ait altın işlemeli bir brokar elbise Halid ibn al-Walid tarafından ele geçirildi ve Peygamber'e gönderildi; bunun üzerine Müslümanlar elbiseye dokunmaya ve hayran kalmaya başladılar."
  id: "Sebuah jubah brokat bersulam emas milik Ukaydir disita oleh Khalid ibn al-Walid dan dikirim kepada Nabi, sehingga kaum Muslimin mulai menyentuhnya dan mengaguminya."
