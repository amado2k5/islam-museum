summary:
  ar: "خطاط نستعليق من بلاط الآق قويونلو في تبريز، اتخذ لقب «أنيسي» لقربه من السلطان يعقوب، وأتمّ كتابة نسخة «خمسة» نظامي التي تنقلت بين ثلاثة أمراء {cite:blair-islamic-calligraphy-2006 p. 324}."
  en: "Nasta'liq calligrapher at the Aqqoyunlu court in Tabriz who took the pen name Anisi ('friend') for his closeness to Sultan Ya'qub, and finished copying the peripatetic Khamsa of Nizami {cite:blair-islamic-calligraphy-2006 p. 324}."
  ur: "تبریز میں آق قویونلو دربار کے نستعلیق خطاط، جنہوں نے سلطان یعقوب سے قربت کی بنا پر «انیسی» تخلص اختیار کیا اور نظامی کے اس «خمسہ» کی کتابت مکمل کی جو کئی شہزادوں کے ہاتھوں سے گزرا {cite:blair-islamic-calligraphy-2006 p. 324}۔"
