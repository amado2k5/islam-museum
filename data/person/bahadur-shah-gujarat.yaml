summary:
  ar: "بطاقة أولية لبهادر شاه، سلطان كجرات الذي وسّع مملكته ونازع همايون ثم قُتل سنة ١٥٣٧م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Bahadur Shah, the sultan of Gujarat who expanded his sultanate and clashed with Humayun before his death in 1537; the dynastic handbook entry is not yet checked on the page."
