  ur: "گجرات کے سلطان بہادر شاہ کے لیے ڈرافٹ کارڈ جس نے اپنی سلطنت کو وسعت دی اور 1537 میں اپنی موت سے قبل ہمایوں سے جھڑپ کی۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Krallığını genişleten, Humayun ile savaşan ve 1537 yılında öldürülen Gujarat Sultanı Bahadur Şah'ın ilk kartı; İslam Devletleri sözlüklerinde bahsedilir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Bahadur Shah, Sultan Gujarat yang memperluas kerajaannya, melawan Humayun, dan tewas pada tahun 1537 M; kartu ini disebutkan dalam kamus Negara-negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
