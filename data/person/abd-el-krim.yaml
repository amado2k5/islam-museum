summary:
  ar: "قائد سياسي وعسكري مغربي (1882–1963)؛ قاضٍ بمليلية ثم قائد ثورة الريف، هزم الإسبان في أنوال سنة 1921 ورأس جمهورية الريف (1921–1926)، واستسلم للفرنسيين سنة 1926 فنُفي إلى جزيرة ريونيون، ثم استقر بالقاهرة منذ 1947 حيث رأس لجنة تحرير المغرب العربي ودعم حركات التحرر حتى وفاته ودُفن بمقبرة الشهداء."
  en: "Moroccan political and military leader (1882–1963). A judge in Melilla who became leader of the Rif revolt, he defeated the Spanish at Annual in 1921 and headed the Republic of the Rif (1921–1926); he surrendered to the French in 1926 and was exiled to Réunion, then settled in Cairo from 1947, where he headed the Arab Maghreb Liberation Committee and supported liberation movements until his death; he was buried in the Martyrs' Cemetery."
  ur: "مراکشی سیاسی و عسکری رہنما (1882–1963)؛ ملیلیہ میں قاضی رہے، پھر ریف بغاوت کے قائد بنے، 1921 میں انوال میں ہسپانویوں کو شکست دی اور جمہوریۂ ریف (1921–1926) کے صدر رہے؛ 1926 میں فرانسیسیوں کے سامنے ہتھیار ڈالے تو جزیرۂ ری یونین جلاوطن ہوئے، پھر 1947 سے قاہرہ میں مقیم رہے جہاں عرب مغرب آزادی کمیٹی کے سربراہ بنے اور وفات تک آزادی کی تحریکوں کی حمایت کرتے رہے؛ قاہرہ کے شہداء قبرستان میں دفن ہوئے۔"
