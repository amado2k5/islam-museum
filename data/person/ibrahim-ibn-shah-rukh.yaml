  ur: "امیرزادہ ابراہیم بی۔ شاہ رخ تیموری، شیراز کا آقا جس نے بصرہ کو بھی تھام رکھا تھا - 'بہت عمدہ ہاتھ والا ثقافتی آدمی'؛ رمضان المبارک وفات 839۔ 229}۔"
