  id: "Amirzadeh Ibrahim ibn Shahrukh, penguasa Shiraz; ia pernah memerintah Basra dan merupakan orang yang berbudi luhur dengan tulisan tangan yang sangat baik. Ia meninggal pada bulan Ramadan tahun 839 H {cite:shadharat-dhahab hlm. 229}."
