  ar: "أميرزاده إبراهيم بن شاه رخ صاحب شيراز؛ كان قد ملك البصرة وكان فاضلاً حسن الخط جداً، توفي في رمضان سنة تسع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 229}."
