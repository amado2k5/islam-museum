summary:
  ar: "السلطان مراد الثالث ⁦(٩٨٢–١٠٠٣هـ/١٥٧٤–١٥٩٥م)⁩؛ اهتم بفنون العلم والأدب والشعر وأتقن التركية والعربية والفارسية ومال إلى التصوف. من أول أعماله أمرٌ بمنع شرب الخمور فثار الإنكشاريون واضطروه لرفع الأمر — علامة مبكرة على ضعف الدولة. في عهده صارت بولونيا تحت الحماية العثمانية سنة ٩٨٣هـ، وقُطعت مفازات القوقاز وفُتحت تفليس والكرج سنة ٩٨٥هـ ودخل العثمانيون تبريز سنة ٩٩٣هـ، وصالح الشاه عباس على التنازل عن تلك البلاد وعلى ألا يُسبَّ الخلفاء الراشدون في مملكته. واقترح مراد على السعديين في رجب ٩٨٨هـ/سبتمبر ١٥٨٠م — في رسالتين — عقد تحالف عسكري ضد الإسبان بثلاثمائة غراب سلطاني وجيش عثماني تُستفتح به بلاد الأندلس، ثم لما استعد المنصور للمواجهة وقارب اتفاقاً مع إسبانيا قبل مراد الأمر الواقع وأمر قلج علي بالتخلي عن المغرب {cite:dawlat-uthmaniyya-salabi p. 270-271}. وفي عهده قُتل الصدر الأعظم صوقللي محمد باشا بدسائس الحاشية ففتح موته باباً للشر في تنصيب الصدور وعزلهم. وتوفي في ١٦ كانون الثاني ١٥٩٥م عن نحو تسعة وأربعين عاماً ودُفن في فناء آيا صوفيا {cite:dawlat-uthmaniyya-salabi p. 292-294}."
  en: "Murad III (r. 982–1003/1574–1595) — trilingual poet-sultan; saw Poland placed under Ottoman protection, Tiflis and Tabriz taken from the Safavids, and in two Rajab 988/September 1580 letters offered the Sa'dids 300 sultanic galleys and an army to recover al-Andalus — then, facing al-Mansur's readiness and his near-agreement with Spain, ordered Uluj Ali to stand down {cite:dawlat-uthmaniyya-salabi p. 270-271}. Sokollu's assassination in his reign opened the era of palace-made grand viziers. Buried in Hagia Sophia's courtyard {cite:dawlat-uthmaniyya-salabi p. 292-294}."
  es: "Murad III (r. 982–1003/1574–1595) — poeta-sultán trilingüe; vio cómo Polonia quedaba bajo protección otomana, Tiflis y Tabriz eran arrebatadas a los safávidas, y en dos cartas de Rajab 988/septiembre de 1580 ofreció a los sadíes 300 galeras sultánicas y un ejército para recuperar al-Ándalus; luego, ante la disposición de al-Mansur y su casi acuerdo con España, ordenó a Uluj Ali que se retirara {cite:dawlat-uthmaniyya-salabi p. 270-271}. El asesinato de Sokollu durante su reinado inauguró la era de los grandes visires nombrados por el palacio. Enterrado en el patio de Santa Sofía {cite:dawlat-uthmaniyya-salabi p. 292-294}."
  fr: "Murad III (r. 982-1003/1574-1595) — poète-sultan trilingue; il plaça la Pologne sous protection ottomane, prit Tiflis et Tabriz aux Safavides, et, dans deux lettres datées de Rajab 988/septembre 1580, offrit aux Sa'didyme 300 galères sultaniques et une armée pour reconquérir al-Andalus. Puis, face à la détermination d'al-Mansur et à son quasi-accord avec l'Espagne, il ordonna à Uluj Ali de se retirer (voir Dawlat-Uthmaniyya-Salabi, p. 270-271). L'assassinat de Sokollu durant son règne marqua le début de l'ère des grands vizirs nommés au palais. Il est inhumé dans la cour de Sainte-Sophie (voir Dawlat-Uthmaniyya-Salabi, p. 292-294)."
  ur: "مراد III (r. 982-1003/1574-1595) - سہ لسانی شاعر-سلطان؛ پولینڈ کو عثمانی تحفظ میں رکھا ہوا، طفلس اور تبریز کو صفویوں سے چھین لیا، اور دو رجب 988/ستمبر 1580 کے خطوط میں سعدیوں کو اندلس کی بازیابی کے لیے 300 سلطانی گیلیاں اور ایک فوج کی پیشکش کی گئی - پھر، المنصور کی رضامندی کے ساتھ، اس کی رضامندی کے ساتھ، اس کی رضامندی کا سامنا کرنا پڑا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 270-271}۔ اس کے دور حکومت میں سوکولو کے قتل نے محل سے بنے عظیم الشان وزیروں کے دور کا آغاز کیا۔ حاجیہ صوفیہ کے صحن میں مدفون 292-294}۔"
  tr: "Sultan III. Murad (982–1003 Hicri / 1574–1595) bilim, edebiyat ve şiir sanatlarıyla ilgileniyor, Türkçe, Arapça ve Farsça ustalaşıyor ve Sufizme eğilimliydi. İlk eylemlerinden biri alkol tüketimini yasaklamak oldu; bu da Yeniçerilerin ayaklanıp onu emri kaldırmaya zorlamasına yol açtı — devletin zayıflığının erken bir işaretiydi. Onun saltanatı sırasında Polonya 983 Hicri'de Osmanlı koruması altına girdi, Kafkasya kuşatıldı, Tiflis ve Karaj 985 Hicri'de fethedildi, Osmanlılar 993 Hicri'de Tebriz'e girdi ve Şah Abbas bu toprakları devretmeyi ve krallığındaki Raşidun halifelerine hakaret etmemeyi kabul etti. Murad, Rajab 988 Hicri / Eylül 1580 M.S.'de Saadianlara iki mektupla—üç yüz sultan kargası ve Osmanlı ordusuyla İspanyollara karşı askeri bir ittifak kurmayı önerdi. Sonra, el-Mansur çatışmaya hazırlanırken, İspanya ile bir anlaşmaya vardı; ancak Murad olmuş olayı kabul edip Kilij Ali'ye Fas'ı terk etmesini emretti {cite:dawlat-uthmaniyya-salabi s. 270-271}. Saltanatı sırasında, Sadrazam Socilli Muhammed Paşa saray entrikaları sonucu öldürüldü ve ölümü, reislerin tahta çıkışı ve tahttan indirilmesinde kötülüğün kapısını açtı. 16 Ocak 1595'te, yaklaşık kırk dokuz yaşında öldü ve Ayasofya avlusuna defnedildi {cite:dawlat-uthmaniyya-salabi s. 292-294}."
  id: "Sultan Murad III (982–1003 H / 1574–1595 M) tertarik pada seni sains, sastra, dan puisi, menguasai bahasa Turki, Arab, dan Persia, serta condong ke arah Sufisme. Salah satu tindakan pertamanya adalah melarang konsumsi alkohol, yang membuat para Janissari bangkit dan memaksanya mencabut perintah tersebut—tanda awal kelemahan negara. Selama pemerintahannya, Polandia berada di bawah perlindungan Ottoman pada tahun 983 H, Kaukasus terputus, Tbilisi dan Karaj ditaklukkan pada tahun 985 H, Ottoman memasuki Tabriz pada tahun 993 H, dan Shah Abbas setuju untuk menyerahkan wilayah tersebut serta tidak menghina khalifah Rashidun di kerajaannya. Murad mengusulkan kepada bangsa Saadi, pada Rajab 988 AH / September 1580 M—dalam dua surat—untuk membentuk aliansi militer melawan Spanyol dengan tiga ratus gagak kesultanan dan tentara Ottoman untuk menaklukkan Andalusia. Kemudian, ketika al-Mansur bersiap untuk konfrontasi, ia mencapai kesepakatan dengan Spanyol sebelum Murad menerima fakta yang telah terjadi dan memerintahkan Kilij Ali untuk meninggalkan Maroko {cite:dawlat-uthmaniyya-salabi hlm. 270-271}. Selama masa pemerintahannya, Grand Vizier Socilli Muhammad Pasha tewas akibat intrik istana, dan kematiannya membuka pintu bagi kejahatan dalam pelantikan dan penggulingan para kepala suku. Ia meninggal pada 16 Januari 1595 M, pada usia sekitar empat puluh sembilan tahun dan dimakamkan di halaman Hagia Sophia {cite:dawlat-uthmaniyya-salabi hlm. 292-294}."
