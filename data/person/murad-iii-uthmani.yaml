summary:
  ar: "السلطان مراد الثالث (٩٨٢–١٠٠٣هـ/١٥٧٤–١٥٩٥م)؛ اهتم بفنون العلم والأدب والشعر وأتقن التركية والعربية والفارسية ومال إلى التصوف. من أول أعماله أمرٌ بمنع شرب الخمور فثار الإنكشاريون واضطروه لرفع الأمر — علامة مبكرة على ضعف الدولة. في عهده صارت بولونيا تحت الحماية العثمانية سنة ٩٨٣هـ، وقُطعت مفازات القوقاز وفُتحت تفليس والكرج سنة ٩٨٥هـ ودخل العثمانيون تبريز سنة ٩٩٣هـ، وصالح الشاه عباس على التنازل عن تلك البلاد وعلى ألا يُسبَّ الخلفاء الراشدون في مملكته. واقترح مراد على السعديين في رجب ٩٨٨هـ/سبتمبر ١٥٨٠م — في رسالتين — عقد تحالف عسكري ضد الإسبان بثلاثمائة غراب سلطاني وجيش عثماني تُستفتح به بلاد الأندلس، ثم لما استعد المنصور للمواجهة وقارب اتفاقاً مع إسبانيا قبل مراد الأمر الواقع وأمر قلج علي بالتخلي عن المغرب {cite:dawlat-uthmaniyya-salabi p. 270-271}. وفي عهده قُتل الصدر الأعظم صوقللي محمد باشا بدسائس الحاشية ففتح موته باباً للشر في تنصيب الصدور وعزلهم. وتوفي في ١٦ كانون الثاني ١٥٩٥م عن نحو تسعة وأربعين عاماً ودُفن في فناء آيا صوفيا {cite:dawlat-uthmaniyya-salabi p. 292-294}."
  en: "Murad III (r. 982–1003/1574–1595) — trilingual poet-sultan; saw Poland placed under Ottoman protection, Tiflis and Tabriz taken from the Safavids, and in two Rajab 988/September 1580 letters offered the Sa'dids 300 sultanic galleys and an army to recover al-Andalus — then, facing al-Mansur's readiness and his near-agreement with Spain, ordered Uluj Ali to stand down {cite:dawlat-uthmaniyya-salabi p. 270-271}. Sokollu's assassination in his reign opened the era of palace-made grand viziers. Buried in Hagia Sophia's courtyard {cite:dawlat-uthmaniyya-salabi p. 292-294}."
