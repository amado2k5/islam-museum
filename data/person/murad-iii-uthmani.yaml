summary:
  ar: "السلطان مراد الثالث (٩٨٢–١٠٠٣هـ/١٥٧٤–١٥٩٥م)؛ اهتم بفنون العلم والأدب والشعر وأتقن التركية والعربية والفارسية ومال إلى التصوف. من أول أعماله أمرٌ بمنع شرب الخمور فثار الإنكشاريون واضطروه لرفع الأمر — علامة مبكرة على ضعف الدولة. في عهده صارت بولونيا تحت الحماية العثمانية سنة ٩٨٣هـ، وقُطعت مفازات القوقاز وفُتحت تفليس والكرج سنة ٩٨٥هـ ودخل العثمانيون تبريز سنة ٩٩٣هـ، وصالح الشاه عباس على التنازل عن تلك البلاد وعلى ألا يُسبَّ الخلفاء الراشدون في مملكته. واقترح مراد على السعديين في رجب ٩٨٨هـ عقد تحالف عسكري ضد الإسبان بثلاثمائة غراب سلطاني وجيش عثماني تُستفتح به بلاد الأندلس. وفي عهده قُتل الصدر الأعظم صوقللي محمد باشا بدسائس الحاشية ففتح موته باباً للشر في تنصيب الصدور وعزلهم. وتوفي في ١٦ كانون الثاني ١٥٩٥م عن نحو تسعة وأربعين عاماً ودُفن في فناء آيا صوفيا {cite:dawlat-uthmaniyya-salabi p. 292-294}."
  en: "Murad III (r. 982–1003/1574–1595) — trilingual poet-sultan; saw Poland placed under Ottoman protection, Tiflis and Tabriz taken from the Safavids, and offered the Sa'dids 300 galleys to recover al-Andalus. Sokollu's assassination in his reign opened the era of palace-made grand viziers. Buried in Hagia Sophia's courtyard {cite:dawlat-uthmaniyya-salabi p. 292-294}."
