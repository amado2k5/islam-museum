  tr: "Şamlı şair, Al-Mustakfi masasında sedir ağacını Tanrı'ya anlattı; bir aşçının, çift kardan daha dayanıklı bir gökyüzünde güzel dolunay gibi yerine getirdiği, heveslerin ve çağrıların sanatından dokunduğu bir sedir {cite:muruj-al-dhahab, s. 714-715}."
  id: "Penyair Damaskus itu, ia membacakan di meja Al-Mustakfi yang menggambarkan pohon cedar kepada Tuhan, sebuah cedar yang dipenuhi oleh juru masak seperti bulan purnama yang indah di langit yang lebih tahan banting daripada salju ganda, terjalin dari kerajinan kehendak dan panggilan {cite:muruj-al-dhahab, hlm. 714-715}."
