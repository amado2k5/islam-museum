summary:
  ar: "الدمشقي الشاعر، أنشد في مائدة المستكفي في وصف الأرزية للّه در أرزة وافى بها طاه كحسن البدر وسط سماء أبقى من الثلج المضاعف نسجه من صنعة الأهواء والأنداء {cite:muruj-al-dhahab p. 714-715}."
