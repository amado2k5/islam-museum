id: person/abu-al-atahiyya
education:
  did_you_know:
    ar: "أبو العطاهية إسماعيل بن القاسم بائع جرار، من أسهل الناس لفظاً وأقدرهم على وزن الكلام؛ كثر تشبيبه بعتبة جارية الخيزران حتى جلده المهدي."
    en: "Abu al-Atahiyya, Isma'il ibn al-Qasim the jar-seller, was of the easiest speech and surest metre among poets; his love-verses to Utba, al-Khayzuran's maid, ran on until al-Mahdi had him flogged."
    ur: "ابو العطاھیہ، اسماعیل بن قاسم مٹکے بیچنے والا، شاعروں میں سب سے آسان کلام اور پکی وزن والا تھا؛ خیزران کی لونڈی عتبہ کے عشق کے اشعار اتنے بڑھے کہ مہدی نے انہیں کوڑے ماروائے۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "أبو العتاهية", en: "Abu'l-'Atahiyya" }
summary:
  ar: "إسماعيل بن القاسم بائع جرار، من أسهل الناس لفظاً وأقدرهم على وزن الكلام، كثر تشبيبه بعتبة جارية الخيزران حتى شكت إلى مولاتها فجلده المهدي نحواً من حد فقال لها بخ بخ يا عتب من أجلكم قد قتل المهدي فيكم قتيلاً، فأمر له بخمسين ألف درهم ففرقها على من بالباب وقال ما كنت لآكل ثمن من أحببت فحلف عليه في خمسين أخرى ألا يفرقها، وأهدى إليه في يوم نوروز برنية صينية فيها نفسي بشيء من الدنيا معلقة فهمّ بدفع عتبة إليه فأبت {cite:muruj-al-dhahab p. 305-307}. وهو عند أحمد أمين زعيم الشعر الديني والسابق إليه من الموالي {cite:duha-islam p. 339}، ومن شعراء العراق المحدَثين الذين لا يدانيهم في عصرهم شامي ولا مصري، وكان الناس يتنازعون أيهما أشعر هو أم أبو نواس دون تفضيل قاطع {cite:duha-islam p. 460-461}."
  en: "Isma'il ibn al-Qasim the jar-seller — flogged for his 'Utba verses, enriched for them, denied her hand ('a jar-seller who earns by verse?') {cite:muruj-al-dhahab p. 305-307}."
