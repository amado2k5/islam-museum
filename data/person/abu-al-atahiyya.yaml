label: { ar: "أبو العتاهية", en: "Abu'l-'Atahiyya" }
summary:
  ar: "إسماعيل بن القاسم بائع جرار، من أسهل الناس لفظاً وأقدرهم على وزن الكلام، كثر تشبيبه بعتبة جارية الخيزران حتى شكت إلى مولاتها فجلده المهدي نحواً من حد فقال لها بخ بخ يا عتب من أجلكم قد قتل المهدي فيكم قتيلاً، فأمر له بخمسين ألف درهم ففرقها على من بالباب وقال ما كنت لآكل ثمن من أحببت فحلف عليه في خمسين أخرى ألا يفرقها، وأهدى إليه في يوم نوروز برنية صينية فيها نفسي بشيء من الدنيا معلقة فهمّ بدفع عتبة إليه فأبت {cite:muruj-al-dhahab p. 305-307}."
  en: "Isma'il ibn al-Qasim the jar-seller — flogged for his 'Utba verses, enriched for them, denied her hand ('a jar-seller who earns by verse?') {cite:muruj-al-dhahab p. 305-307}."
