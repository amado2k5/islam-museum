summary:
  ar: "والد النبي؛ أحسن أولاد عبد المطلب وأعفّهم وأحبّهم إليه، والذبيح الذي خرجت عليه القداح ففُدي بمائة من الإبل، تزوج آمنة بنت وهب ومات بالمدينة وله خمس وعشرون سنة، قبل مولد ابنه عند أكثر المؤرخين وبعده بشهرين في قول."
  en: "The Prophet's father; the handsomest, most chaste and best-loved of Abd al-Muttalib's sons, the 'sacrifice' on whom the lots fell and who was ransomed with a hundred camels; he married Amina bint Wahb and died at Medina aged twenty-five, before his son's birth according to most historians or two months after it by one report."
