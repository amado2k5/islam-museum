summary:
  ar: "ريموند الثالث، الذي يسميه ابن الأثير ريمند بن ريمند الصنجيلي، قمص طرابلس وصاحب طبرية بزواجه من صاحبتها. تولى أمر الملك الصغير بعد موت الملك المجذوم ثم اختلف مع الملك الجديد فراسل صلاح الدين، لكن الفرنج ردوه إليهم، وكان في جيشهم يوم حطين سنة 583هـ/1187م ونجا من المعركة إلى صور ثم طرابلس حيث مات بعد أيام قليلة بحسب ابن الأثير. وتذكر دائرة المعارف الإسلامية أنه حذر من التقدم لنجدة طبرية، وأن نور الدين استفاد من أسره سنة 561هـ/1165م {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  en: "Raymond III, whom Ibn al-Athir calls Raymond son of Raymond of Saint-Gilles, was count of Tripoli and lord of Tiberias through his marriage to its heiress. He managed affairs for the boy king after the leper king's death, then quarrelled with the new king and wrote to Saladin, but the Franks brought him back into their ranks. He was in their army at Hattin in 583/1187, escaped to Tyre and then Tripoli, and died a few days later according to Ibn al-Athir. The Encyclopaedia of Islam records that he warned against advancing to relieve Tiberias, and that Nur al-Din took advantage of his capture in 561/1165 {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  ur: "ریموند سوم، جنہیں ابن الاثیر ریمند بن ریمند الصنجیلی کہتے ہیں، طرابلس کے کاؤنٹ تھے اور طبریہ کی وارثہ سے نکاح کی وجہ سے اس کے حاکم بھی۔ کوڑھی بادشاہ کی موت کے بعد انہوں نے کم سن بادشاہ کے امور سنبھالے، پھر نئے بادشاہ سے اختلاف ہوا اور صلاح الدین کو خط لکھا، مگر فرنگیوں نے انہیں اپنی صفوں میں واپس لے لیا۔ 583ھ/1187ء میں حطین میں وہ ان کی فوج میں تھے، میدان سے بچ کر صور اور پھر طرابلس پہنچے اور ابن الاثیر کے بقول چند دن بعد فوت ہو گئے۔ دائرۃ المعارف الاسلامیہ بتاتا ہے کہ انہوں نے طبریہ کی مدد کو بڑھنے سے خبردار کیا تھا، اور نور الدین نے 561ھ/1165ء میں ان کی گرفتاری سے فائدہ اٹھایا {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
