summary:
  ar: "ريموند الثالث، الذي يسميه ابن الأثير ريمند بن ريمند الصنجيلي، قمص طرابلس وصاحب طبرية بزواجه من صاحبتها. تولى أمر الملك الصغير بعد موت الملك المجذوم ثم اختلف مع الملك الجديد فراسل صلاح الدين، لكن الفرنج ردوه إليهم، وكان في جيشهم يوم حطين سنة 583هـ/1187م ونجا من المعركة إلى صور ثم طرابلس حيث مات بعد أيام قليلة بحسب ابن الأثير. وتذكر دائرة المعارف الإسلامية أنه حذر من التقدم لنجدة طبرية، وأن نور الدين استفاد من أسره سنة 561هـ/1165م {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  en: "Raymond III, whom Ibn al-Athir calls Raymond son of Raymond of Saint-Gilles, was count of Tripoli and lord of Tiberias through his marriage to its heiress. He managed affairs for the boy king after the leper king's death, then quarrelled with the new king and wrote to Saladin, but the Franks brought him back into their ranks. He was in their army at Hattin in 583/1187, escaped to Tyre and then Tripoli, and died a few days later according to Ibn al-Athir. The Encyclopaedia of Islam records that he warned against advancing to relieve Tiberias, and that Nur al-Din took advantage of his capture in 561/1165 {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  ur: "ریموند سوم، جنہیں ابن الاثیر ریمند بن ریمند الصنجیلی کہتے ہیں، طرابلس کے کاؤنٹ تھے اور طبریہ کی وارثہ سے نکاح کی وجہ سے اس کے حاکم بھی۔ کوڑھی بادشاہ کی موت کے بعد انہوں نے کم سن بادشاہ کے امور سنبھالے، پھر نئے بادشاہ سے اختلاف ہوا اور صلاح الدین کو خط لکھا، مگر فرنگیوں نے انہیں اپنی صفوں میں واپس لے لیا۔ 583ھ/1187ء میں حطین میں وہ ان کی فوج میں تھے، میدان سے بچ کر صور اور پھر طرابلس پہنچے اور ابن الاثیر کے بقول چند دن بعد فوت ہو گئے۔ دائرۃ المعارف الاسلامیہ بتاتا ہے کہ انہوں نے طبریہ کی مدد کو بڑھنے سے خبردار کیا تھا، اور نور الدین نے 561ھ/1165ء میں ان کی گرفتاری سے فائدہ اٹھایا {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  es: "Raymond III, a quien Ibn al-Athir llama Raymond hijo de Raymond de Saint-Gilles, fue conde de Trípoli y señor de Tiberíades por su matrimonio con su heredera. Administró los asuntos del joven rey después de la muerte del rey leproso, luego se peleó con el nuevo rey y escribió a Saladino, pero los francos lo reintegraron a sus filas. Estuvo en su ejército en Hattin en 583/1187, escapó a Tiro y luego a Trípoli, y murió pocos días después según Ibn al-Athir. La Enciclopedia del Islam registra que advirtió contra el avance para socorrer a Tiberíades, y que Nur al-Din aprovechó su captura en 561/1165 {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 10 p. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  fr: "Raymond III, qu'Ibn al-Athir nomme Raymond fils de Raymond de Saint-Gilles, était comte de Tripoli et seigneur de Tibériade par son mariage avec son héritière. Il géra les affaires du jeune roi après la mort du roi lépreux, puis se brouilla avec le nouveau roi et écrivit à Saladin, mais les Francs le ramenèrent dans leurs rangs. Il était dans leur armée à Hattin en 583/1187, s'échappa à Tyr puis à Tripoli, et mourut quelques jours plus tard selon Ibn al-Athir. L'Encyclopédie de l'Islam rapporte qu'il mit en garde contre toute avancée pour secourir Tibériade, et que Nur al-Din profita de sa capture en 561/1165. 29} {cite:encyclopaedia-of-islam-2 vol. 8 p. 142}."
  tr: "İbn el-Athir'in Raymond ibn Raymond al-Sanjili olarak adlandırdığı III. Raymond, Trablus'un rahibi ve metresiyle evlenerek Tiberya'nın hükümdarıydı. Kral Al-Mazdum'un ölümünden sonra küçük kralın yönetimini üstlendi, yeni kralla anlaşmazlığa düştü ve Salah al-Din'i gönderdi, ancak Franklar onu geri verdi. 583 Hicri / 1187 yılında Hattin'de ordusundaydı ve Sur ile ardından Trablus savaşından sağ çıktı; İbn al-Athir'e göre birkaç gün sonra orada öldü. İslam Ansiklopedisi, Tiberias'ın kurtarılmasına karşı uyarıda bulunduğunu ve Nur al-Din'in 561 Hic/1165 M.S.'de yakalanmasından fayda sağladığını belirtir {cite:kamil-ibn-al-athir s. 141} {cite:kamil-ibn-al-athir s. 148} {cite:encyclopaedia-of-Islam-2 cilt 10, s. 29} {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 142}."
  id: "Raymond III, yang oleh Ibn al-Athir disebut Raymond ibn Raymond al-Sanjili, adalah imam Tripoli dan penguasa Tiberias dengan menikahi selirnya. Ia mengambil alih pemerintahan raja kecil setelah kematian Raja Al-Mazdum, kemudian tidak setuju dengan raja baru dan mengirim Salah al-Din, tetapi orang Franka mengembalikannya kepada mereka. Ia berada dalam pasukan mereka di Hattin pada tahun 583 H / 1187 M dan selamat dari pertempuran ke Tyre dan kemudian Tripoli, di mana ia meninggal beberapa hari kemudian menurut Ibn al-Athir. Ensiklopedia Islam menyebutkan bahwa ia memperingatkan agar tidak maju menyelamatkan Tiberias, dan bahwa Nur al-Din mendapat manfaat dari penangkapannya pada tahun 561 H/1165 M {cite:kamil-ibn-al-athir hlm. 141} {cite:kamil-ibn-al-athir hlm. 148} {cite:encyclopaedia-of-Islam-2 vol. 10, hlm. 29} {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 142}."
