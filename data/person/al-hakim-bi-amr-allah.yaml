id: person/al-hakim-bi-amr-allah
class: person
label: { ar: "الحاكم بأمر الله منصور بن العزيز", en: "al-Hakim bi-Amr Allah Mansur ibn al-Aziz", fr: "Al-Hakim bi-Amr Allah Mansur ibn al-Aziz" , ur: "الحاکم بامر اللہ منصور بن العزیز", es: "al-Hakim bi-Amr Allah Mansur ibn al-Aziz"}
summary:
  ar: "سادس ملوك الدولة العبيدية، منصور بن العزيز بالله، قام بالأمر بعد أبيه ولقب بالحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 636}، وفي أيام القادر قتل جماعة من الأعيان وأمر بكتب سب الصحابة على أبواب المساجد والشوارع وأمر بقتل الكلاب وبطل الفقاع والملوخيا ونهى عن السمك الذي لا قشر له وأمر الناس أن يقوموا ويسجدوا إذا ذكر اسمه وهدم بيعة القيامة وجميع كنائس مصر ثم أذن في إعادتها ونهى عن بيع الرطب والعنب وأباد كثيراً من الكروم ومنع النساء من الخروج ليلاً ونهاراً إلى أن مات وقتل بحلوان قرية بمصر سنة إحدى عشرة وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 636-639}. وفي سنة ست وتسعين خطب له بمكة والمدينة على الرسم في ذلك وأمر الناس في الحرمين بالقيام عند ذكره {cite:muntazam-ibn-al-jawzi j.7 p.231}، وفيها خرج عليه أبو ركوة الأموي ببرقة فنقش السكة باسمه ولعنه على المنبر فبعث عليه الفضل بن عبد الله حتى تسلمه من بلاد النوبة فشهره ثم قتله {cite:muntazam-ibn-al-jawzi j.7 p.234-235}. وفي شوال سنة ٤١١ بسط عبيد مصر في الفسطاط بأمره فأحرق ثلثها ونُهب نصفها، ثم قُتل ليلًا على جبل المقطم على يد عبدين مغربيين في رواية أهل مصر بدبّر بين أخته ست الملك وابن دوّاس، فحُمل إليها فدفنته في مجلسها وسترت أمره ثلاثة أيام وقيل له سبع وثلاثون سنة وخلافته خمس وعشرون سنة {cite:muntazam-ibn-al-jawzi j.7 p.301-305} ويذكر المقريزي أن الحاكم فقد ليلتين بقيتا من شوال سنة 411هـ، وأن رجلاً من بني الحسين أقر بقتله سنة 415هـ، ويرجّح المقريزي هذه الرواية {cite:khitat-maqrizi-1998 p.2041} {cite:khitat-maqrizi-1998 p.2042}."
  en: "Mansur ibn al-Aziz, sixth Ubaydid caliph, titled al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 636}. Al-Maqrizi says he disappeared in Shawwal 411 AH, and prefers the account of a man who confessed to killing him in 415 AH {cite:khitat-maqrizi-1998 p.2041}."
  fr: "Mansur ibn al-Aziz, sixième calife « ubaydide » selon al-Suyuti, portant le titre d’al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 636}. Al-Maqrizi dit qu’il disparut en shawwal 411 H et privilégie le récit d’un homme qui, en 415 H, avoua l’avoir tué {cite:khitat-maqrizi-1998 p.2041}."
  ur: "منصور بن العزیز، چھٹے عبیدی خلیفہ، جن کا لقب الحاکم بامر اللہ تھا؛ مقریزی 411ھ میں ان کے غائب ہونے کا ذکر کرتے ہیں۔ {cite:khitat-maqrizi-1998}"
  es: "Mansur ibn al-Aziz, sexto califa ubaydid, titulado al-Hakim bi-Amr Allah {cita:tarikh-khulafa-minhaj-1434 p. 636}. Al-Maqrizi dice que desapareció en Shawwal en el año 411 AH y prefiere el relato de un hombre que confesó haberlo matado en el año 415 AH {cita:khitat-maqrizi-1998 p.2041}."
  tr: "Ubaydid hanedanının altıncı kralı Mansur ibn al-Aziz Billah, babasının yerine geçti ve al-Hakim bi-Amr Allah unvanını aldı {alıntı:Tarih-Khulafa-minhaj-1434 s. 636}. El-Kadir'in zamanında, bir grup önemli kişiyi öldürdü, sahabelere hakaretlerin cami kapılarına ve sokaklarına yazılmasını emretti, köpeklerin öldürülmesini, pe'a ve molokhia yasağını, derisiz balıkların yasaklanmasını emretti, ismi anıldığında insanların ayağa kalkıp secde edilmesini emretti, Diriliş Antlaşması'nı ve Mısır'daki tüm kiliseleri yıktı, ardından onların geri dönmesine izin verdi, hurma ve üzüm satışını yasakladı, birçok bağı yok etti ve kadınların gece gündüz dışarı çıkmasını yasakladı; ta ki ölene kadar ve 434 yılında Mısır'daki Helwan köyünde öldürülene kadar {cite:History-Khulafa-minhaj-1434, s. 636-639}. Doksan altıncı yılda, Mekke ve Medine'de yazı üzerine vaazlar verdi ve İki Kutsal Camii'deki insanlara anılması üzerine ayağa kalkmalarını emretti {atıf:Muntazam-ibn-al-jawzi J.7 s.231}. O dönemde, Cyrenaice'deki Ebu Rakwah al-Umayyad ona saldırdı, adına madeni paralar yazdı, kürsüye lanetledi ve al-Fadl ibn Abdullah'ı onu ünlü Nubia'dan alıp sonra öldürmesi için gönderdi {cite:Muntazam-ibn-al-jawzi J.7 s.234-235}. Shawwal 411 H.E.'de, Mısır köleleri onun emriyle Fustat'a saldırmış, üçte birini yakmış ve yarısını yağmalamıştır. Mısır halkının anlatımlarına göre, kız kardeşi Sett al-Malik ile İbn Davas arasındaki anlaşmazlıkta gece Mokattam Dağı'nda iki Faslı köle tarafından öldürülmüştür. Oraya götürülmüş, onun sarayına gömülmüş ve işleri üç gün boyunca gizlenmiştir. Otuz yedi yaşındaydı ve halifeliği yirmi beş yaşındaydı {atıf:Muntazam-ibn-al-Jawzi J.7 s.301-305} Al-Maqrizi, al-Hakim'in 411 Hicri'de Şavval'da kaldığı iki geceyi kaybettiğini ve Banu al-Huseyn'den bir adamın onu öldürdüğünü itiraf ettiğini belirtir 415 Hicri yılında El-Maqrizi şu anlatımı tercih eder {cite:Khitat-maqrizi-1998 s.2041} {cite:Khitat-Maqrizi-1998 s.2042}."
  id: "Raja keenam dinasti Ubaydid, Mansur ibn al-Aziz Billah, menggantikan ayahnya dan diberi gelar al-Hakim bi-Amr Allah {cite:History-Khulafa-minhaj-1434 hlm. 636}. Pada masa al-Qadir, ia membunuh sekelompok tokoh terkenal, memerintahkan penghinaan terhadap para Sahabat ditulis di pintu dan jalan masjid, memerintahkan pembunuhan anjing, larangan pe'a dan molokhia, melarang ikan tanpa kulit, memerintahkan orang berdiri dan sujud saat namanya disebut, menghancurkan Perjanjian Kebangkitan dan semua gereja di Mesir, kemudian mengizinkan mereka kembali, melarang penjualan kurma dan anggur, menghancurkan banyak kebun anggur, dan melarang wanita keluar siang dan malam sampai ia meninggal dan dibunuh di Helwan, sebuah desa di Mesir, pada tahun 434 {cite:History-Khulafa-minhaj-1434, hlm. 636-639}. Pada tahun sembilan puluh enam, ia menyampaikan khotbah di Mekah dan Madinah tentang naskah dan memerintahkan orang-orang di Dua Masjid Suci untuk berdiri di tempat penyebutannya {cite:Muntazam-ibn-al-jawzi J.7 hlm.231}. Pada masa itu, Abu Rakwah al-Umayyah di Cyrenaica menyerangnya, menuliskan koin atas namanya, mengutuknya di mimbar, dan mengirim al-Fadl ibn Abdullah untuk membawanya dari Nubia, yang terkenal, lalu membunuhnya {cite:Muntazam-ibn-al-jawzi J.7 hlm.234-235}. Pada Shawwal tahun 411 H, para budak Mesir menyerbu Fustat atas perintahnya, membakar sepertiga dari Fustat dan menjarah setengahnya. Ia kemudian dibunuh pada malam hari di Gunung Mokattam oleh dua budak Maroko menurut catatan rakyat Mesir, dalam perselisihan antara saudara perempuannya Sett al-Malik dan Ibn Dawas. Ia dibawa ke sana, dimakamkan di istananya, dan urusannya disembunyikan selama tiga hari. Dikatakan ia berusia tiga puluh tujuh tahun dan masa kejayaannya dua puluh lima tahun {cite:muntazam-ibn-al-jawzi J.7 hlm.301-305} Al-Maqrizi menyebutkan bahwa al-Hakim kehilangan dua malam di Shawwal pada tahun 411 H, dan seorang pria dari Banu al-Husayn mengaku telah membunuhnya Pada tahun 415 H, Al-Maqrizi mendukung narasi ini {cite:Khitat-maqrizi-1998 hlm.2041} {cite:Khitat-Maqrizi-1998 hlm.2042}."
