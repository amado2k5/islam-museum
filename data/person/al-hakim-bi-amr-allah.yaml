summary:
  ar: "سادس ملوك الدولة العبيدية، منصور بن العزيز بالله، قام بالأمر بعد أبيه ولقب بالحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 636}، وفي أيام القادر قتل جماعة من الأعيان وأمر بكتب سب الصحابة على أبواب المساجد والشوارع وأمر بقتل الكلاب وبطل الفقاع والملوخيا ونهى عن السمك الذي لا قشر له وأمر الناس أن يقوموا ويسجدوا إذا ذكر اسمه وهدم بيعة القيامة وجميع كنائس مصر ثم أذن في إعادتها ونهى عن بيع الرطب والعنب وأباد كثيراً من الكروم ومنع النساء من الخروج ليلاً ونهاراً إلى أن مات وقتل بحلوان قرية بمصر سنة إحدى عشرة وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 636-639}."
  en: "Mansur ibn al-Aziz, sixth Ubaydid caliph, titled al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 636}."
