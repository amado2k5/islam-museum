class: person
label: { ar: "الحاكم بأمر الله منصور بن العزيز", en: "al-Hakim bi-Amr Allah Mansur ibn al-Aziz" }
summary:
  ar: "سادس ملوك الدولة العبيدية، منصور بن العزيز بالله، قام بالأمر بعد أبيه ولقب بالحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 636}، وفي أيام القادر قتل جماعة من الأعيان وأمر بكتب سب الصحابة على أبواب المساجد والشوارع وأمر بقتل الكلاب وبطل الفقاع والملوخيا ونهى عن السمك الذي لا قشر له وأمر الناس أن يقوموا ويسجدوا إذا ذكر اسمه وهدم بيعة القيامة وجميع كنائس مصر ثم أذن في إعادتها ونهى عن بيع الرطب والعنب وأباد كثيراً من الكروم ومنع النساء من الخروج ليلاً ونهاراً إلى أن مات وقتل بحلوان قرية بمصر سنة إحدى عشرة وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 636-639}. وفي سنة ست وتسعين خطب له بمكة والمدينة على الرسم في ذلك وأمر الناس في الحرمين بالقيام عند ذكره {cite:muntazam-ibn-al-jawzi j.7 p.231}، وفيها خرج عليه أبو ركوة الأموي ببرقة فنقش السكة باسمه ولعنه على المنبر فبعث عليه الفضل بن عبد الله حتى تسلمه من بلاد النوبة فشهره ثم قتله {cite:muntazam-ibn-al-jawzi j.7 p.234-235}. وفي شوال سنة ٤١١ بسط عبيد مصر في الفسطاط بأمره فأحرق ثلثها ونُهب نصفها، ثم قُتل ليلًا على جبل المقطم على يد عبدين مغربيين في رواية أهل مصر بدبّر بين أخته ست الملك وابن دوّاس، فحُمل إليها فدفنته في مجلسها وسترت أمره ثلاثة أيام وقيل له سبع وثلاثون سنة وخلافته خمس وعشرون سنة {cite:muntazam-ibn-al-jawzi j.7 p.301-305} ويذكر المقريزي أن الحاكم فقد ليلتين بقيتا من شوال سنة 411هـ، وأن رجلاً من بني الحسين أقر بقتله سنة 415هـ، ويرجّح المقريزي هذه الرواية {cite:khitat-maqrizi-1998 p.2041} {cite:khitat-maqrizi-1998 p.2042}."
  en: "Mansur ibn al-Aziz, sixth Ubaydid caliph, titled al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 636}. Al-Maqrizi says he disappeared in Shawwal 411 AH, and prefers the account of a man who confessed to killing him in 415 AH {cite:khitat-maqrizi-1998 p.2041}."
