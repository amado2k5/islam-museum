id: person/al-hakim-bi-amr-allah
class: person
label: { ar: "الحاكم بأمر الله منصور بن العزيز" }
summary:
  ar: "سادس ملوك الدولة العبيدية، منصور بن العزيز بالله، قام بالأمر بعد أبيه ولقب بالحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 636}، وفي أيام القادر قتل جماعة من الأعيان وأمر بكتب سب الصحابة على أبواب المساجد والشوارع وأمر بقتل الكلاب وبطل الفقاع والملوخيا ونهى عن السمك الذي لا قشر له وأمر الناس أن يقوموا ويسجدوا إذا ذكر اسمه وهدم بيعة القيامة وجميع كنائس مصر ثم أذن في إعادتها ونهى عن بيع الرطب والعنب وأباد كثيراً من الكروم ومنع النساء من الخروج ليلاً ونهاراً إلى أن مات وقتل بحلوان قرية بمصر سنة إحدى عشرة وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 636-639}. وفي سنة ست وتسعين خطب له بمكة والمدينة على الرسم في ذلك وأمر الناس في الحرمين بالقيام عند ذكره {cite:muntazam-ibn-al-jawzi j.7 p.231}، وفيها خرج عليه أبو ركوة الأموي ببرقة فنقش السكة باسمه ولعنه على المنبر فبعث عليه الفضل بن عبد الله حتى تسلمه من بلاد النوبة فشهره ثم قتله {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  en: "Mansur ibn al-Aziz, sixth Ubaydid caliph, titled al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 636}."
