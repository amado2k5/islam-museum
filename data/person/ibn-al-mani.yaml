summary:
  ar: "ناصح الإسلام أبو الفتح نصر بن فتيان النهرواني البغدادي الحنبلي، فقيه العراق وشيخ الحنابلة على الإطلاق؛ تفقه على أبي بكر الدينوري وروى عن ابن الزاغوني وطبقته، وكان ورعاً زاهداً متعبداً على منهاج السلف، لم يتزوج ولم يتسرَّ ولم يركب بغلة ولا فرساً ولم يملك ملكاً ولم يلبس الثياب الفاخرة، وأكثر طعامه شربُ ماء الباقلاء في قدح؛ قال فيه ابن رجب: صرف همته طول عمره إلى الفقه أصولاً وفروعاً مذهباً وخلافاً ومناظرة، وقصدته الرحال من البلاد، وفقهاء الحنابلة في سائر البلاد يرجعون إليه — الشيخ موفق الدين تلميذه وابن تيمية تلميذ تلميذه أبي بكر بن الحلاوي؛ مرض الإسهال فمات يوم السبت رابع شهر رمضان ودفن يوم الأحد وازدحم الناس حتى خيف من الفتنة فنُفذت الأجناد والأتراك بالسلاح، عن اثنتين وثمانين سنة، ولم يخلف مثله {cite:shadharat-dhahab p. 757-758}."
  en: "Nasih al-Islam Abu al-Fath Nasr b. Futyan al-Nahrawani, faqih of Iraq and shaykh of the Hanbalis without qualification; trained under Abu Bakr al-Dinawari, ascetic on the Salaf's way — he never married, kept no concubine, rode no mule or horse, owned nothing, wore no fine cloth, and lived mostly on bean-water from a cup. Ibn Rajab: he spent his whole life's resolve on fiqh — roots, branches, madhhab, khilaf, disputation; pilgrims' mounts were pointed at him from every land, and Hanbalis everywhere trace their fiqh to him — Muwaffaq al-Din his student, Ibn Taymiyya his student's student. Dysentery took him on Saturday the fourth of Ramadan; the funeral crowd was feared a riot, troops came out armed; eighty-two years old, he left no equal {cite:shadharat-dhahab p. 757-758}."
