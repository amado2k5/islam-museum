names:
  - { value: "ناصح الإسلام أبو الفتح نصر بن فتيان بن مطر النهرواني البغدادي الحنبلي", kind: full }
summary:
  ar: "ناصح الإسلام أبو الفتح نصر بن فتيان النهرواني البغدادي الحنبلي، فقيه العراق وشيخ الحنابلة على الإطلاق؛ تفقه على أبي بكر الدينوري وروى عن ابن الزاغوني وطبقته، وكان ورعاً زاهداً متعبداً على منهاج السلف، لم يتزوج ولم يتسرَّ ولم يركب بغلة ولا فرساً ولم يملك ملكاً ولم يلبس الثياب الفاخرة، وأكثر طعامه شربُ ماء الباقلاء في قدح؛ قال فيه ابن رجب: صرف همته طول عمره إلى الفقه أصولاً وفروعاً مذهباً وخلافاً ومناظرة، وقصدته الرحال من البلاد، وفقهاء الحنابلة في سائر البلاد يرجعون إليه — الشيخ موفق الدين تلميذه وابن تيمية تلميذ تلميذه أبي بكر بن الحلاوي؛ مرض الإسهال فمات يوم السبت رابع شهر رمضان ودفن يوم الأحد وازدحم الناس حتى خيف من الفتنة فنُفذت الأجناد والأتراك بالسلاح، عن اثنتين وثمانين سنة، ولم يخلف مثله {cite:shadharat-dhahab p. 757-758}."
  en: "Nasih al-Islam Abu al-Fath Nasr b. Futyan al-Nahrawani, faqih of Iraq and shaykh of the Hanbalis without qualification; trained under Abu Bakr al-Dinawari, ascetic on the Salaf's way — he never married, kept no concubine, rode no mule or horse, owned nothing, wore no fine cloth, and lived mostly on bean-water from a cup. Ibn Rajab: he spent his whole life's resolve on fiqh — roots, branches, madhhab, khilaf, disputation; pilgrims' mounts were pointed at him from every land, and Hanbalis everywhere trace their fiqh to him — Muwaffaq al-Din his student, Ibn Taymiyya his student's student. Dysentery took him on Saturday the fourth of Ramadan; the funeral crowd was feared a riot, troops came out armed; eighty-two years old, he left no equal {cite:shadharat-dhahab p. 757-758}."
  es: "Nasih al-Islam Abu al-Fath Nasr b. Futyan al-Nahrawani, faqih de Irak y shaykh de los hanbalíes sin cualificación; se formó con Abu Bakr al-Dinawari, asceta en el camino de los salaf: nunca se casó, no tuvo concubina, no montó mula ni caballo, no poseyó nada, no vistió ropa fina y vivió principalmente de agua de habas en una taza. Ibn Rajab: dedicó toda su vida a la fiqh: raíces, ramas, madhhab, khilaf, disputas; los caballos de los peregrinos apuntaban hacia él desde todas partes, y los hanbalíes de todas partes le atribuyen su fiqh: Muwaffaq al-Din su alumno, Ibn Taymiyya el alumno de su alumno. La disentería lo llevó el sábado cuatro de Ramadán; se temió que la multitud del funeral se amotinara, las tropas salieron armadas; a los ochenta y dos años, no dejó igual {cite:shadharat-dhahab p. 757-758}."
  fr: "Nasih al-Islam Abu al-Fath Nasr b. Futyan al-Nahrawani, faqih d'Irak et cheikh des Hanbalites sans qualification; formé par Abu Bakr al-Dinawari, ascète sur la voie des Salaf — il ne s'est jamais marié, n'a eu aucune concubine, n'a jamais monté de mule ni de cheval, ne possédait rien, ne portait pas de vêtements fins et vivait principalement d'eau de soja dans une tasse. Ibn Rajab: il a consacré toute sa vie à la jurisprudence islamique (fiqh) — racines, branches, madhhab, khilaf, dispute; les montures des pèlerins se dirigeaient vers lui de tous les pays, et les Hanbalites du monde entier font remonter leur jurisprudence à lui — Muwaffaq al-Din son élève, Ibn Taymiyya l'élève de son élève. La dysenterie l'a emporté le samedi 4 Ramadan; on craignait une émeute lors des funérailles, des troupes armées sont sorties; à 82 ans, il n'a laissé aucun égal {cite:shadharat-dhahab p. 757-758}."
  ur: "ناصح الاسلام ابو الفتح نصر ب۔ فطیان النہروانی، عراق کے فقیہ اور اہل حنبلی کے شیخ؛ ابوبکر الدنوری کے تحت تربیت یافتہ، سلف کے طریقے پر سنت - اس نے کبھی شادی نہیں کی، کوئی لونڈی نہیں رکھی، کوئی خچر یا گھوڑے پر سوار نہیں ہوا، کسی چیز کی ملکیت نہیں تھی، کوئی عمدہ کپڑا نہیں پہنا تھا، اور زیادہ تر پیالے کے پانی پر رہتے تھے۔ ابن رجب: اس نے اپنی پوری زندگی فقہ یعنی جڑوں، شاخوں، مذھب، خلافت، جھگڑے پر صرف کی۔ ہر جگہ سے حجاج کی سواریاں اس کی طرف اشارہ کرتی تھیں، اور حنبلی ہر جگہ ان کی فقہ کا سراغ لگاتے ہیں - موفق الدین ان کے شاگرد، ابن تیمیہ ان کے شاگرد کے شاگرد۔ چوتھے رمضان کو پیچش نے اسے اپنی لپیٹ میں لے لیا۔ جنازے کے ہجوم میں ہنگامے کا خدشہ تھا، فوج مسلح ہو کر باہر نکل آئی۔ بیاسی سال کی عمر میں، اس نے کوئی برابر نہیں چھوڑا 757-758}۔"
