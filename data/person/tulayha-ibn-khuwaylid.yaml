summary:
  en: "War-chief of Banu Asad who claimed prophecy at the Prophet's death, was broken by Khalid at Buzakha, fled to Syria — then returned, became a Muslim, and fought in the conquests he had once stood against."
  ar: "سيد حرب من بني أسد ادّعى النبوة عند وفاة النبي، فكسره خالد ببزاخة وفرّ إلى الشام — ثم عاد مسلمًا فقاتل في الفتوح التي كان قد وقف ضدها. وعند المسعودي قتل يوم أغواث من القادسية مع فرسان بني أسد خمسمائة رجل ممن باشر قتال الفيلة حتى أوقفوها واشتد الجلاد على بني أسد في هذا اليوم من سائر الناس {cite:muruj-al-dhahab p. 609}"
  es: "El jefe militar de Banu Asad, que afirmaba haber profetizado la muerte del Profeta, fue derrotado por Khalid en Buzakha, huyó a Siria, luego regresó, se convirtió al Islam y luchó en las conquistas contra las que una vez se había opuesto."
  fr: "Le chef de guerre des Banu Asad, qui prétendait avoir reçu une prophétie à la mort du Prophète, fut vaincu par Khalid à Buzakha, s'enfuit en Syrie, puis revint, se convertit à l'islam et participa aux conquêtes auxquelles il s'était autrefois opposé."
  ur: "بنو اسد کے جنگی سردار جس نے رسول اللہ کی وفات پر نبوت کا دعویٰ کیا تھا، خالد کے ہاتھوں بزخہ میں ٹوٹا، شام کی طرف بھاگا - پھر واپس آیا، مسلمان ہوا، اور ان فتوحات میں لڑا جن کے خلاف وہ کبھی کھڑا تھا۔"
  tr: "Banu Esad'dan bir savaş ustası, Peygamber'in ölümünden sonra peygamberlik iddiasında bulundu, ancak Halid onu kılıçla yendi ve Levant'a kaçtı—sonra Müslüman oldu ve karşı çıktığı fetihlerde savaştı. El-Mes'udi'ye göre, el-Kadisiyah'dan Agwath gününde, fillerle savaşan Banu Asad'ın süvarileriyle birlikte beş yüz adam öldü. Bu gün, Banu Esad'a karşı yapılan zorba, diğer halktan daha sert oldu {atıf:muruj-al-dhahab, s. 609}"
  id: "Seorang ahli perang dari Banu Asad mengklaim sebagai nabi setelah kematian Nabi, tetapi Khalid mengalahkannya dengan pedang dan melarikan diri ke Levant—lalu kembali menjadi Muslim dan bertempur dalam penaklukan yang pernah ia lawan. Menurut al-Mas'udi, pada hari Agwath dari al-Qadisiyyah, lima ratus orang tewas bersama kavaleri Banu Asad, yang telah melawan gajah-gajah hingga mereka berhasil menghentikan mereka. Pada hari ini, tiran terhadap Banu Asad menjadi lebih keras daripada rakyat lain {cite:muruj-al-dhahab, hlm. 609}"
