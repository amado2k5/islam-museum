summary:
  ar: "المفتي العام الثالث للمملكة العربية السعودية ⁦(14 مايو 1999 – 23 سبتمبر 2025)⁩ ورئيس هيئة كبار العلماء واللجنة الدائمة للبحوث العلمية والإفتاء؛ وُلد في مكة سنة 1943 من أسرة آل الشيخ، وفقد بصره في العشرين من عمره، وتخرّج في جامعة الإمام محمد بن سعود الإسلامية، وتولى الإفتاء خلفًا لابن باز وخلفه صالح الفوزان، وتوفي في الرياض سنة 2025."
  en: "The third Grand Mufti of Saudi Arabia ⁦(14 May 1999 – 23 September 2025)⁩ and head of the Council of Senior Religious Scholars and the Permanent Committee for Islamic Research and Issuing Fatwas. Born in Mecca in 1943 into the Al al-Sheikh family, he lost his sight at twenty, graduated from Imam Muhammad ibn Saud Islamic University, succeeded Ibn Baz in the muftiate and was himself succeeded by Saleh al-Fawzan; he died in Riyadh in 2025."
  fr: "Troisième grand mufti d'Arabie saoudite ⁦(14 mai 1999 – 23 septembre 2025)⁩ et président du Conseil des grands oulémas et du Comité permanent pour la recherche islamique et la délivrance des fatwas. Né à La Mecque en 1943 dans la famille Al al-Cheikh, il perdit la vue à vingt ans, sortit diplômé de l'université islamique Imam Muhammad ibn Saoud, succéda à Ibn Baz au moufitat et eut lui-même pour successeur Saleh al-Fawzan ; il mourut à Riyad en 2025."
  ur: "سعودی عرب کے تیسرے مفتیِ اعظم ⁦(14 مئی 1999 – 23 ستمبر 2025)⁩ اور کونسل آف سینئر اسکالرز و دائمی کمیٹی برائے تحقیق و افتا کے سربراہ۔ 1943 میں مکہ میں آل شیخ خاندان میں پیدا ہوئے، بیس برس کی عمر میں بینائی سے محروم ہوئے، جامعہ امام محمد بن سعود الاسلامیہ سے فارغ التحصیل ہوئے، ابن باز کے جانشین مفتی بنے اور ان کے بعد صالح الفوزان آئے؛ 2025 میں ریاض میں انتقال ہوا۔"
  es: "El tercer Gran Muftí de Arabia Saudita (14 de mayo de 1999 - 23 de septiembre de 2025) y jefe del Consejo de Altos Eruditos Religiosos y del Comité Permanente de Investigación Islámica y Emisión de Fatwas. Nacido en La Meca en 1943 en el seno de la familia Al al-Sheikh, perdió la vista a los veinte años, se graduó en la Universidad Islámica Imam Muhammad ibn Saud, sucedió a Ibn Baz en el muftiato y fue sucedido a su vez por Saleh al-Fawzan; falleció en Riad en 2025."
