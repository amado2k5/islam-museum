summary:
  ar: "مقاتل مواي تاي تايلاندي وُلد باسم تيناكورن سريساوات في فتهالونغ سنة 1997. عُرف بلقب «الرجل الحديدي»، وحمل بطولة ون للمواي تاي لوزن الذبابة أطول فترة في تاريخها بخمسة دفاعات ناجحة، وحقق 274 انتصاراً، وهو من أعلى مقاتلي المواي تاي أجراً في العالم."
  en: "Thai Muay Thai fighter, born Tinnakorn Srisawat in Phatthalung in 1997. Known as The Iron Man, he held the ONE Flyweight Muay Thai World Championship for its longest reign, with five successful defences, compiled 274 wins, and is one of the highest-paid Muay Thai fighters in the world."
  ur: "تھائی موئے تھائی فائٹر، 1997 میں فتھالونگ میں تیناکورن سریساوات کے نام سے پیدا ہوئے۔ «آئرن مین» کے لقب سے معروف، انہوں نے ون فلائی ویٹ موئے تھائی ورلڈ چیمپئن شپ اس کی طویل ترین حکمرانی کے ساتھ پانچ کامیاب دفاع کیے، 274 فتوحات حاصل کیں، اور دنیا کے سب سے زیادہ معاوضہ پانے والے موئے تھائی فائٹروں میں شمار ہوتے ہیں۔"
  es: "Luchador tailandés de Muay Thai, nacido Tinnakorn Srisawat en Phatthalung en 1997. Conocido como \"El Hombre de Hierro\", ostentó el título mundial de peso mosca de Muay Thai de ONE Championship durante el reinado más largo, con cinco defensas exitosas, acumuló 274 victorias y es uno de los luchadores de Muay Thai mejor pagados del mundo."
  fr: "Combattant de Muay Thai thaïlandais, né Tinnakorn Srisawat à Phatthalung en 1997. Surnommé « L'Homme de fer », il a détenu le titre de champion du monde ONE de Muay Thai poids mouche pendant la plus longue période, avec cinq défenses réussies, a accumulé 274 victoires et est l'un des combattants de Muay Thai les mieux payés au monde."
  tr: "1997'de Phthalong'da Tinakorn Sreisawat adıyla doğan bir Taylandlı Muay Thai dövüşçüsü. 'Demir Adam' lakabını aldı ve tarihindeki en uzun süre ONE Muay Thai sinek siklet şampiyonluğunu beş başarılı savunmayla elinde tuttu, 274 galibiyet elde etti ve dünyanın en yüksek ücretli Muay Thai dövüşçülerinden biridir."
  id: "Seorang petarung Muay Thai yang lahir dengan nama Tinakorn Sreisawat di Phthalong pada tahun 1997. Ia dijuluki 'Iron Man' dan memegang gelar juara kelas terbang Muay Thai ONE selama periode terpanjang dalam sejarahnya dengan lima pertahanan sukses, meraih 274 kemenangan, dan termasuk petinju Muay Thai dengan bayaran tertinggi di dunia."
