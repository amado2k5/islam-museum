summary:
  ar: "مقاتل مواي تاي تايلاندي وُلد باسم تيناكورن سريساوات في فتهالونغ سنة 1997. عُرف بلقب «الرجل الحديدي»، وحمل بطولة ون للمواي تاي لوزن الذبابة أطول فترة في تاريخها بخمسة دفاعات ناجحة، وحقق 274 انتصاراً، وهو من أعلى مقاتلي المواي تاي أجراً في العالم."
  en: "Thai Muay Thai fighter, born Tinnakorn Srisawat in Phatthalung in 1997. Known as The Iron Man, he held the ONE Flyweight Muay Thai World Championship for its longest reign, with five successful defences, compiled 274 wins, and is one of the highest-paid Muay Thai fighters in the world."
  ur: "تھائی موئے تھائی فائٹر، 1997 میں فتھالونگ میں تیناکورن سریساوات کے نام سے پیدا ہوئے۔ «آئرن مین» کے لقب سے معروف، انہوں نے ون فلائی ویٹ موئے تھائی ورلڈ چیمپئن شپ اس کی طویل ترین حکمرانی کے ساتھ پانچ کامیاب دفاع کیے، 274 فتوحات حاصل کیں، اور دنیا کے سب سے زیادہ معاوضہ پانے والے موئے تھائی فائٹروں میں شمار ہوتے ہیں۔"
