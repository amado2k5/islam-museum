summary:
  ar: "شهاب الدين ابن عربشاه الدمشقي الحنفي الإمام العالم العلامة المتقن الأديب الفقيه اللغوي النحوي المؤرخ؛ كان إمام عصره في المنظوم والمنثور، تردد إلى القاهرة غير مرة وكان بينه وبين ابن تغري بردي صحبة أكيدة ومودة وأسمعه كثيراً من مصنفاته نظماً ونثراً بل غالب ما نظمه ونثره وألفه، وكان له قدرة على نظم العلوم وسبكها في قالب المديح والغزل، وأجازه بجميع ما يجوز له من رواية ومناقل منها مرآة الأدب في علمي المعاني والبيان، قال ابن تغري بردي صحبني في بعض قدومه إلى القاهرة وكتب لي إجازته بخطه، وتوفي سنة أربع وخمسين وثمانمائة {cite:shadharat-dhahab p. 280-281}."
  en: "Ibn 'Arabshah — the Damascene Hanafi historian of Timur ('Aja'ib al-Maqdur), 'imam of his age in verse and prose'; repeatedly in Cairo where Ibn Taghribirdi studied his own works under him and received his ijaza for the whole corpus including Mir'at al-Adab on rhetoric; died 854 {cite:shadharat-dhahab p. 280-281}."
  es: "Ibn 'Arabshah — el historiador hanafí damasceno de Timur ('Aja'ib al-Maqdur), 'imán de su época en verso y prosa'; estuvo repetidamente en El Cairo, donde Ibn Taghribirdi estudió sus propias obras con él y recibió su ijaza para todo el corpus, incluyendo Mir'at al-Adab sobre retórica; murió en 854 {cite:shadharat-dhahab p. 280-281}."
  fr: "Ibn 'Arabshah — l'historien hanafite damascène de Timour ('Aja'ib al-Maqdur), 'imam de son époque en vers et en prose'; séjourna à plusieurs reprises au Caire où Ibn Taghribirdi étudia ses propres œuvres sous sa direction et reçut son ijaza pour l'ensemble du corpus, y compris Mir'at al-Adab sur la rhétorique; mourut en 854 {cite:shadharat-dhahab p. 280-281}."
  ur: "ابن عربشاہ - تیمور کا دمشقی حنفی مؤرخ ⁦('عجائب المقدور)⁩، 'آیت اور نثر میں اپنے زمانے کا امام'؛ قاہرہ میں بارہا جہاں ابن طغری بردی نے اپنے زیر سایہ اپنے کاموں کا مطالعہ کیا اور بیان بازی پر میرات الادب سمیت پورے ادارے کے لیے ان کا اعجاز حاصل کیا۔ متوفی 854 {حوالہ: شدارت ذہاب صفحہ 280-281}۔"
  tr: "Şihabeddin İbn Arabşah el-Dimashqi el-Hanafi, alim, bilgili bir âlim, titiz bir bilgin, edebiyat bilgini, hukukçu, dilbilimci, dilbilgici ve tarihçi; hem şiir hem de düzyazı alanında döneminin önde gelen figürüydü. Kahire'yi sık sık ziyaret etti ve İbn Teghri Bardi ile yakın dostluk ve sevgi sürdürdü. Hem şiir hem de şiir olarak birçok eserini dinledi düzyazı ve bestelerinin çoğunu, düzyazı ve bestelerini yazdı. Bilimleri besteleme ve bunları övgü ve sevgi şiirlerine dökme yeteneğine sahipti; kendisine izin verilen tüm anlatımlarda ve aktarımlarda, 'anlam bilimlerinde ve retorik bilimlerinde edebiyatın aynası' da dahil olmak üzere izin verdi. İbn Taghri Bardi, Kahire'ye yaptığı bazı ziyaretlerde bana eşlik ettiğini ve yetkisini el yazısıyla yazdığını söyledi. 854 Hicri yılında vefat etti {alıntı:) Shadharat-Dhahab, s. 280-281}."
  id: "Shihab al-Din Ibn Arabshah al-Dimashqi al-Hanafi, seorang cendekiawan, sarjana tertulis, sarjana yang teliti, sarjana sastra, ahli hukum, ahli bahasa, ahli tata bahasa, dan sejarawan; ia adalah tokoh terkemuka pada zamannya dalam puisi dan prosa. Ia sering mengunjungi Kairo beberapa kali, dan ia menjaga persahabatan serta kasih sayang yang erat dengan Ibn Taghri Bardi. Ia mendengarkan banyak karyanya, baik dalam puisi maupun prosa, serta sebagian besar komposisinya, prosa, dan komposisinya. Ia memiliki kemampuan untuk menyusun ilmu pengetahuan dan menuangkannya ke dalam puisi pujian dan cinta, memberinya izin dalam semua narasi dan transmisi yang diizinkan kepadanya, termasuk 'Cermin Sastra dalam ilmu makna dan retorika.' Ibn Taghri Bardi mengatakan ia menemani saya dalam beberapa kunjungannya ke Kairo dan menulis otorisasinya dengan tulisan tangannya. Ia meninggal pada tahun 854 H {cite::\" Shadharat-Dhahab, hlm. 280-281}."
