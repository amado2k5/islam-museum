summary:
  ar: "شهاب الدين ابن عربشاه الدمشقي الحنفي الإمام العالم العلامة المتقن الأديب الفقيه اللغوي النحوي المؤرخ؛ كان إمام عصره في المنظوم والمنثور، تردد إلى القاهرة غير مرة وكان بينه وبين ابن تغري بردي صحبة أكيدة ومودة وأسمعه كثيراً من مصنفاته نظماً ونثراً بل غالب ما نظمه ونثره وألفه، وكان له قدرة على نظم العلوم وسبكها في قالب المديح والغزل، وأجازه بجميع ما يجوز له من رواية ومناقل منها مرآة الأدب في علمي المعاني والبيان، قال ابن تغري بردي صحبني في بعض قدومه إلى القاهرة وكتب لي إجازته بخطه، وتوفي سنة أربع وخمسين وثمانمائة {cite:shadharat-dhahab p. 280-281}."
  en: "Ibn 'Arabshah — the Damascene Hanafi historian of Timur ('Aja'ib al-Maqdur), 'imam of his age in verse and prose'; repeatedly in Cairo where Ibn Taghribirdi studied his own works under him and received his ijaza for the whole corpus including Mir'at al-Adab on rhetoric; died 854 {cite:shadharat-dhahab p. 280-281}."
