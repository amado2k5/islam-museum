summary:
  ar: "عالم أزهري مصري (1737–1812) تولى مشيخة الأزهر سنة 1208 هـ وبقي فيها حتى وفاته، وكان شيخ علماء الشافعية ومفتيهم في عصره وشيخاً للطريقة الخلوتية. ترأس ديوان القاهرة في زمن الحملة الفرنسية، وكان أحد القادة الذين بايعوا محمد علي والياً سنة 1805."
  en: "Egyptian Azhari scholar (1737–1812) who became Grand Imam of al-Azhar in 1208 AH and held the post until his death. He was the leading Shafi'i scholar and mufti of his era in Egypt and a shaykh of the Khalwatiyya Sufi order. He chaired Cairo's governing diwan under the French occupation and was one of the leaders who acclaimed Muhammad Ali as ruler in 1805."
  ur: "مصری ازہری عالم (1737–1812) جو 1208ھ میں جامعہ ازہر کے شیخ بنے اور وفات تک اس منصب پر رہے۔ وہ اپنے دور میں مصر کے سب سے بڑے شافعی عالم اور مفتی تھے اور سلسلۂ خلوتیہ کے شیخ بھی تھے۔ فرانسیسی قبضے کے دوران انہوں نے قاہرہ کے دیوان کی صدارت کی اور 1805 میں محمد علی کو حکمران تسلیم کرنے والے رہنماؤں میں شامل تھے۔"
