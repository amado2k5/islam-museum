summary:
  ar: "كاتب ومخرج سنغالي، وُلد في زيغنشور سنة 1923، وعمل صيادًا وميكانيكيًا وعمّال أرصفة ونقابيًا في مرسيليا، ثم صار من أبرز روائيي إفريقيا الفرنكوفونية وأبا السينما الإفريقية بأفلام مثل «الفتاة السوداء» (1966) و«ماندابي» (1968) و«مولادي» (2004)، وتوفي في داكار سنة 2007."
  en: "Senegalese writer and film director, born at Ziguinchor in 1923. He worked as a fisherman, a mechanic, a Marseille docker and a trade unionist before becoming a leading francophone African novelist and the founding figure of African cinema, with films such as Black Girl (1966), Mandabi (1968) and Moolaadé (2004); he died at Dakar in 2007."
  ur: "سینیگالی مصنف اور فلم ہدایت کار، جو 1923 میں زیگینچور میں پیدا ہوئے؛ مچھیرے، میکینک، مارسیلز میں بندرگاہ مزدور اور ٹریڈ یونین کارکن رہے، پھر افریقہ کے ممتاز ناول نگار اور افریقی سینما کے بانی بنے، جن کی معروف فلموں میں «سیاہ لڑکی» (1966) اور «مولادے» (2004) شامل ہیں؛ 2007 میں ڈاکار میں وفات پائی۔"
