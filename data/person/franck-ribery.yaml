summary:
  ar: "لاعب كرة قدم فرنسي معتزل، وُلد في بولوني سور مير بفرنسا سنة 1983. جناح أمضى اثني عشر موسمًا مع بايرن ميونخ وفاز بدوري أبطال أوروبا 2013 وجائزة أفضل لاعب في أوروبا في العام نفسه، ثم اختتم مسيرته مع فيورنتينا وساليرنيتانا، وخاض 81 مباراة مع منتخب فرنسا. اعتنق الإسلام واتخذ اسم بلال يوسف محمد."
  en: "French retired footballer, born in Boulogne-sur-Mer, France in 1983. A winger who spent twelve seasons at Bayern Munich, winning the 2013 Champions League and the UEFA Best Player in Europe Award that year, before closing his career at Fiorentina and Salernitana; he won 81 caps for France. A convert to Islam, he adopted the name Bilal Yusuf Mohammed."
  ur: "فرانسیسی ریٹائرڈ فٹبالر، 1983 میں فرانس کے بولون سور میر میں پیدا ہوئے۔ ونگر جنہوں نے بائرن میونخ کے ساتھ بارہ سیزن گزارے، 2013 کی چیمپئنز لیگ اور اسی سال یورپ کے بہترین کھلاڑی کا اعزاز جیتا، پھر فیورنٹینا اور سالرنیتانا کے ساتھ کیریئر ختم کیا؛ فرانس کے لیے 81 میچ کھیلے۔ اسلام قبول کیا اور بلال یوسف محمد نام اختیار کیا۔"
