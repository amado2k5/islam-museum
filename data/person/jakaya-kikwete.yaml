summary:
  ar: "سياسي تنزاني (ولد 1950) كان رابع رئيس لتنزانيا من 21 ديسمبر 2005 إلى 5 نوفمبر 2015. قبل رئاسته شغل وزارة المالية ثم وزارة الخارجية لعقد كامل (1995–2005) في حكومة سلفه بنيامين مكابا، ورأس الاتحاد الإفريقي في 2008–2009، وبعد رئاسته عُيّن الممثل السامي للاتحاد الإفريقي في ليبيا سنة 2016. تنص المقالة الإنجليزية على أنه مسلم، ولا تسمي أي مصدر له مدرسة دينية."
  en: "Tanzanian politician (born 1950) who was the fourth president of Tanzania from 21 December 2005 to 5 November 2015. Before his presidency he served as minister of finance and then as foreign minister for a full decade (1995–2005) under his predecessor Benjamin Mkapa; he chaired the African Union in 2008–2009, and after his presidency was appointed the African Union's High Representative for Libya in 2016. The English article states that he is a Muslim; no source names a religious school for him."
  ur: "تنزانیہ کے سیاست دان (پیدائش 1950ء) جو 21 دسمبر 2005ء سے 5 نومبر 2015ء تک تنزانیہ کے چوتھے صدر رہے۔ صدارت سے پہلے وہ وزیرِ خزانہ اور پھر پورے ایک عشرے (1995ء–2005ء) تک وزیرِ خارجہ رہے اپنے پیش رو بنیامین مکاپا کی حکومت میں؛ 2008ء–2009ء میں افریقی یونین کے سربراہ رہے، اور صدارت کے بعد 2016ء میں لیبیا کے لیے افریقی یونین کے اعلیٰ نمائندے مقرر ہوئے۔ انگریزی مضمون بیان کرتا ہے کہ وہ مسلمان ہیں؛ کوئی مصدر ان کے لیے مذہبی مکتب فکر بیان نہیں کرتا۔"
