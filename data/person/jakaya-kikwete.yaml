summary:
  ar: "سياسي تنزاني ⁦(ولد 1950)⁩ كان رابع رئيس لتنزانيا من 21 ديسمبر 2005 إلى 5 نوفمبر 2015. قبل رئاسته شغل وزارة المالية ثم وزارة الخارجية لعقد كامل (1995–2005) في حكومة سلفه بنيامين مكابا، ورأس الاتحاد الإفريقي في 2008–2009، وبعد رئاسته عُيّن الممثل السامي للاتحاد الإفريقي في ليبيا سنة 2016. تنص المقالة الإنجليزية على أنه مسلم، ولا تسمي أي مصدر له مدرسة دينية."
  en: "Tanzanian politician (born 1950) who was the fourth president of Tanzania from 21 December 2005 to 5 November 2015. Before his presidency he served as minister of finance and then as foreign minister for a full decade (1995–2005) under his predecessor Benjamin Mkapa; he chaired the African Union in 2008–2009, and after his presidency was appointed the African Union's High Representative for Libya in 2016. The English article states that he is a Muslim; no source names a religious school for him."
  ur: "تنزانیہ کے سیاست دان ⁦(پیدائش 1950ء)⁩ جو 21 دسمبر 2005ء سے 5 نومبر 2015ء تک تنزانیہ کے چوتھے صدر رہے۔ صدارت سے پہلے وہ وزیرِ خزانہ اور پھر پورے ایک عشرے ⁦(1995ء–2005ء)⁩ تک وزیرِ خارجہ رہے اپنے پیش رو بنیامین مکاپا کی حکومت میں؛ 2008ء–2009ء میں افریقی یونین کے سربراہ رہے، اور صدارت کے بعد 2016ء میں لیبیا کے لیے افریقی یونین کے اعلیٰ نمائندے مقرر ہوئے۔ انگریزی مضمون بیان کرتا ہے کہ وہ مسلمان ہیں؛ کوئی مصدر ان کے لیے مذہبی مکتب فکر بیان نہیں کرتا۔"
  es: "Político tanzano (nacido en 1950) que fue el cuarto presidente de Tanzania desde el 21 de diciembre de 2005 hasta el 5 de noviembre de 2015. Antes de su presidencia, se desempeñó como ministro de finanzas y luego como ministro de asuntos exteriores durante una década completa (1995-2005) bajo el mandato de su predecesor Benjamin Mkapa; presidió la Unión Africana en 2008-2009, y después de su presidencia fue nombrado Alto Representante de la Unión Africana para Libia en 2016. El artículo en inglés afirma que es musulmán; ninguna fuente menciona a qué escuela religiosa asiste."
  fr: "Homme politique tanzanien (né en 1950), il fut le quatrième président de la Tanzanie du 21 décembre 2005 au 5 novembre 2015. Avant sa présidence, il fut ministre des Finances, puis ministre des Affaires étrangères pendant dix ans (1995-2005) sous la présidence de Benjamin Mkapa. Il présida l'Union africaine de 2008 à 2009 et, après son mandat présidentiel, fut nommé haut représentant de l'Union africaine pour la Libye en 2016. L'article en anglais indique qu'il est musulman, mais aucune source ne précise son appartenance religieuse."
  tr: "Tanzanyalı siyasetçi (d. 1950), 21 Aralık 2005'ten 5 Kasım 2015'e kadar Tanzanya'nın dördüncü cumhurbaşkanıydı. Başkanlığından önce, selefi Benjamin Mkapa'nın hükümetinde tam on yıl (1995–2005) Maliye Bakanı ve ardından Dışişleri Bakanı olarak görev yaptı, 2008-2009 yılları arasında Afrika Birliği başkanlığını yaptı ve başkanlığından sonra 2016'da Afrika Birliği'nin Libya'daki Yüksek Temsilcisi olarak atandı. İngilizce makalede Müslüman olduğu belirtilmekte ve dini okulunun herhangi bir kaynağı belirtilmez."
  id: "Politikus Tanzania (lahir 1950) adalah presiden keempat Tanzania dari 21 Desember 2005 hingga 5 November 2015. Sebelum menjabat sebagai presiden, ia menjabat sebagai Menteri Keuangan dan kemudian Menteri Luar Negeri selama satu dekade penuh (1995–2005) dalam pemerintahan pendahulunya Benjamin Mkapa, memimpin Uni Afrika dari 2008 hingga 2009, dan setelah masa kepresidenannya, diangkat sebagai Perwakilan Tinggi Uni Afrika di Libya pada 2016. Artikel berbahasa Inggris menyatakan bahwa ia beragama Muslim dan tidak menyebutkan sumber aliran agamanya."
