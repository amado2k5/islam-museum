summary:
  ar: "قاضٍ ومعلم ومؤلف بريطاني، وُلد في ليستر ونشأ في هراري بزيمبابوي التي يعدّها وطنه، حيث أكمل تعليمه وأسّس عملًا في تقنية المعلومات قبل سن العشرين وحفظ القرآن في الثامنة عشرة. درس في جامعة الإمام محمد بن سعود بالرياض حتى الدكتوراه في الفقه المقارن والقضاء، وهو محاضر أقدم في جامعة المعرفة الدولية وشغل مناصب تعليمية في «مرسي ميشن وورلد» والكوثر، ويقدّم محاضراته عبر قناته ومنصات الدعوة العالمية."
  en: "A British judge, educator and author, born in Leicester and brought up in Harare, Zimbabwe, which he considers home; there he completed his schooling, founded an IT business before the age of twenty and memorised the Qur'an at eighteen. He studied at Imam Muhammad bin Saud Islamic University in Riyadh through to a PhD in comparative fiqh and judiciary, is a senior lecturer at Knowledge International University, has held education posts with Mercy Mission World and AlKauthar, and teaches through his own channel and global dawah platforms."
  ur: "برطانوی قاضی، معلم اور مصنف؛ لیسٹر میں پیدا ہوئے اور ہرارے، زمبابوے میں پرورش پائی جسے وہ اپنا وطن سمجھتے ہیں، وہاں تعلیم مکمل کی، بیس سال کی عمر سے پہلے آئی ٹی کا کاروبار قائم کیا اور اٹھارہ سال کی عمر میں قرآن حفظ کیا۔ انہوں نے ریاض کی امام محمد بن سعود اسلامی یونیورسٹی سے فقہِ مقارن اور قضا میں پی ایچ ڈی تک تعلیم حاصل کی، نالج انٹرنیشنل یونیورسٹی میں سینئر لیکچرر ہیں اور اپنے چینل اور عالمی دعوتی پلیٹ فارمز سے درس دیتے ہیں۔"
