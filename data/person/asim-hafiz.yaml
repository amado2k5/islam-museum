summary:
  ar: عاصم حافظ عالم ومستشار ديني بريطاني، أول إمام ومرشد مسلم للقوات المسلحة البريطانية ⁦(منذ 2005)⁩، والمستشار الديني الإسلامي لرئيس أركان الدفاع، ومُنح وسام الإمبراطورية البريطانية ⁦(OBE)⁩ سنة 2014.
  en: Asim Hafiz is a British scholar who in 2005 became the first imam and Muslim chaplain to the UK armed forces, later serving as Islamic Religious Adviser to the Chief of the Defence Staff; he was appointed
    OBE in 2014.
  ur: عاصم حافظ برطانوی عالم ہیں جو 2005 میں برطانوی مسلح افواج کے پہلے امام اور مسلم چیپلن بنے اور بعد میں سربراہِ دفاع کے اسلامی مذہبی مشیر رہے؛ 2014 میں انھیں OBE کا اعزاز ملا۔
  es: "Asim Hafiz es un erudito británico que en 2005 se convirtió en el primer imán y capellán musulmán de las fuerzas armadas del Reino Unido, y posteriormente ejerció como asesor religioso islámico del jefe del Estado Mayor de la Defensa; fue condecorado con la Orden del Imperio Británico (OBE) en 2014."
