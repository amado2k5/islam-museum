id: person/abu-al-khattab-muhammad-ibn-abi-zaynab
class: person
label:
  ar: "أبو الخطاب محمد بن أبي زينب مقلاص الأسدي"
  en: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi"
  ur: "ابو الخطاب محمد بن ابی زینب مقلاص الاسدی"
  fr: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi"
  es: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi"
summary:
  ar: "أبو الخطاب محمد بن أبي زينب مقلاص الأسدي، زعيم فرقة غالية من الشيعة ⁦(الخطابية)⁩، كان من دعاة الإمام جعفر الصادق ثم تبرأ منه، وقُتل مع أتباعه في الكوفة بأمر عيسى بن موسى، وتختلف الروايات في تاريخ مقتله، وتقول الموسوعة إنه قُتل نحو سنة 145هـ/762م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  en: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi, a Muslim heresiarch of Kufa, one of the chief missionaries of Ja'far al-Sadiq whom the Imam repudiated for false doctrines, and who was executed with his followers under 'Isa b. Musa; the article places his death about 145/762. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  ur: "ابو الخطاب محمد بن ابی زینب مقلاص الاسدی، کوفہ کے ایک غالی شیعہ بانی ⁦(خطابیہ)⁩، جو امام جعفر صادق کے بڑے داعیوں میں تھے، پھر غلط عقائد پھیلانے پر امام نے ان سے براءت کی، اور عیسیٰ بن موسیٰ کے حکم سے اپنے پیروکاروں سمیت قتل ہوئے؛ موسوعہ ان کی وفات تقریباً 145ھ/762ء بتاتی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  fr: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi, chef de secte musulman de Koufa, l'un des principaux missionnaires de Ja'far al-Sadiq, que l'Imam désavoua pour ses doctrines fausses, et qui fut exécuté avec ses partisans sous 'Isa b. Musa ; l'article situe sa mort vers 145/762. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  es: "Abu al-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi, hereje musulmán de Kufa, uno de los principales misioneros de Ja'far al-Sadiq, a quien el Imam repudió por doctrinas falsas, y que fue ejecutado junto con sus seguidores bajo el reinado de Isa b. Moses; el artículo sitúa su muerte alrededor del año 145/762. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  tr: "Aşırı Şii bir mezhebin (Hattabîyye) lideri olan Ebu el-Hattab Muhammed ibn Ebi Zeyneb Miklas el-Esadi, başlangıçta İmam Cafer el-Sadık'ın destekçisiydi, ancak daha sonra onu reddetti. İsa ibn Musa'nın emriyle Kufa'da takipçileriyle birlikte öldürüldü. Ölüm tarihi konusunda farklı rivayetler bulunmakla birlikte, ansiklopedi onun yaklaşık 145 Hicri/762 Miladi yılında öldürüldüğünü belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  id: "Abu al-Khattab Muhammad ibn Abi Zaynab Miqlas al-Asadi, pemimpin sekte Syiah ekstremis (Khattabiyyah), awalnya adalah pendukung Imam Ja'far al-Sadiq tetapi kemudian meninggalkannya. Ia dibunuh bersama para pengikutnya di Kufa atas perintah Isa ibn Musa. Catatan berbeda mengenai tanggal kematiannya, tetapi ensiklopedia menyatakan bahwa ia dibunuh sekitar tahun 145 H/762 M. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
