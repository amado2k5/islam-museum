label:
  ar: "أبو الخطاب محمد بن أبي زينب مقلاص الأسدي"
  en: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi"
  ur: "ابو الخطاب محمد بن ابی زینب مقلاص الاسدی"
summary:
  ar: "أبو الخطاب محمد بن أبي زينب مقلاص الأسدي، زعيم فرقة غالية من الشيعة (الخطابية)، كان من دعاة الإمام جعفر الصادق ثم تبرأ منه، وقُتل مع أتباعه في الكوفة بأمر عيسى بن موسى، وتختلف الروايات في تاريخ مقتله، وتقول الموسوعة إنه قُتل نحو سنة 145هـ/762م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  en: "Abu l-Khattab Muhammad b. Abi Zaynab Miqlas al-Asadi, a Muslim heresiarch of Kufa, one of the chief missionaries of Ja'far al-Sadiq whom the Imam repudiated for false doctrines, and who was executed with his followers under 'Isa b. Musa; the article places his death about 145/762. {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
  ur: "ابو الخطاب محمد بن ابی زینب مقلاص الاسدی، کوفہ کے ایک غالی شیعہ بانی (خطابیہ)، جو امام جعفر صادق کے بڑے داعیوں میں تھے، پھر غلط عقائد پھیلانے پر امام نے ان سے براءت کی، اور عیسیٰ بن موسیٰ کے حکم سے اپنے پیروکاروں سمیت قتل ہوئے؛ موسوعہ ان کی وفات تقریباً 145ھ/762ء بتاتی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 152}"
