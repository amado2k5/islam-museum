names:
  - { value: "أبو الحسن علي بن المبارك بن علي البغدادي الحنبلي الأسكاف ابن الفاؤوس", kind: full }
summary:
  ar: "ابن الفاؤوس أبو الحسن علي بن المبارك البغدادي الحنبلي الأسكاف الزاهد؛ كان يقص يوم الجمعة وللناس فيه عقيدة لصلاحه وتقشفه وإخلاصه، روى عن القاضي أبي يعلى وغيره وسمع منه أبو المؤيد الأنصاري؛ وكان يأتي ساقي الماء في مجلس إملائه فيتناول منه ليوهم الحاضرين أنه مفطر وهو صائم غالباً؛ توفي ليلة السبت تاسع عشر شوال سنة إحدى وعشرين وخمسمائة وصلى عليه من الغد بجامع القصر وكان يوماً مشهوداً ودفن قريباً من قبر الإمام أحمد وأُغلقت في ذلك اليوم أسواق بغداد وكان أمل بغداد يصيحون في جنازته هذا يوم سني حنبلي {cite:shadharat-dhahab p. 544}."
  en: "Ibn al-Fa'us Abu al-Hasan Ali ibn al-Mubarak, the Hanbali ascetic of the shoemakers; he preached on Fridays and people held him in awe for his piety and austerity — he transmitted from qadi Abu Ya'la and Abu al-Mu'ayyad al-Ansari heard him; at his dictation circle he would sip from the water-seller's skin to let attendees think him not fasting, though he mostly was; d. the night of Saturday 19 Shawwal 521, prayed over next day at Jami' al-Qasr on a day of witness, buried near Imam Ahmad's grave while Baghdad's markets closed and the crowd cried 'a Sunni Hanbali day' {cite:shadharat-dhahab p. 544}."
  es: "Ibn al-Fa'us Abu al-Hasan Ali ibn al-Mubarak, el asceta hanbalí de los zapateros; predicaba los viernes y la gente lo veneraba por su piedad y austeridad; transmitía desde el cadí Abu Ya'la y Abu al-Mu'ayyad al-Ansari lo escuchaba; en su círculo de dictado bebía del odre del vendedor de agua para que los asistentes pensaran que no ayunaba, aunque casi siempre lo hacía; murió la noche del sábado 19 de Shawwal de 521, se rezó por él al día siguiente en Jami' al-Qasr en un día de testimonio, fue enterrado cerca de la tumba del Imam Ahmad mientras los mercados de Bagdad cerraban y la multitud gritaba 'un día suní hanbalí' {cita: shadharat-dhahab p. 544}."
  fr: "Ibn al-Fa'us Abu al-Hasan Ali ibn al-Mubarak, ascète hanbalite des cordonniers, prêchait le vendredi et était respecté pour sa piété et son austérité. Il transmettait les enseignements du cadi Abu Ya'la et Abu al-Mu'ayyad al-Ansari l'écoutait. Lors de ses séances de dictée, il buvait de l'eau dans une outre du vendeur pour faire croire aux participants qu'il ne jeûnait pas, bien qu'il le fît la plupart du temps. Il mourut dans la nuit du samedi 19 Shawwal 521. Le lendemain, une prière fut récitée au Jami' al-Qasr, jour de commémoration. Il fut enterré près de la tombe de l'imam Ahmad, tandis que les marchés de Bagdad fermaient et que la foule criait: « Un jour sunnite hanbalite ! » (cit.: shadharat-dhahab, p. 544)."
  ur: "ابن الفوس ابو الحسن علی ابن المبارک، جوتا بنانے والوں کا حنبلی سنیاسی؛ وہ جمعہ کے دن تبلیغ کرتے تھے اور لوگ ان کی تقویٰ اور کفایت شعاری کے باعث ان سے خوفزدہ رہتے تھے - وہ قادی ابو یعلی سے نقل کرتے تھے اور ابو المعید الانصاری نے اسے سنا تھا۔ اپنے ڈکٹیشن کے دائرے میں وہ پانی بیچنے والے کی کھال سے گھونٹ لیتے تاکہ حاضرین یہ سوچیں کہ وہ روزہ نہیں رکھتا، حالانکہ وہ زیادہ تر تھا۔ d سنیچر 19 شوال 521 کی رات، اگلے دن جامع القصر میں شہادت کے دن نماز ادا کی، امام احمد کی قبر کے قریب دفن کیا گیا جب کہ بغداد کے بازار بند تھے اور ہجوم نے \"سنی حنبلی دن\" کا نعرہ لگایا۔ 544}۔"
  tr: "İbn el-Favus Ebu el-Hasan Ali ibn el-Mübarek el-Bağdadi el-Hanbali, münzevi ayakkabacı; Cuma günlerini doğruluğuna, sadeliğine ve samimiyetine inanan insanlarla keserdi. Kadi Ebu Ya'la ve diğerlerinden rivayet ederdi, Ebu el-Mueyyad el-Ensari ondan duydu. Dikte toplantısına su taşıyıcıları getirir ve oradan içerdi, böylece oradakiler oruçunu bozduğuna ve oruç tuttuğuna inanmalarını sağlardı Çoğu zaman ing yapardı. Beş yüz yirmi birinci yılın on dokuzuncu Şhavval'ı Cumartesi gecesi vefat etti. Onun için cenaze namazı ertesi gün Saray Camii'nde başladı. Bu önemli bir gündü ve İmam Ahmed'in mezarının yakınında defnedildi. O gün Bağdat pazarları kapalıydı ve Bağdat halkı cenazesinde \"Bugün bir Sünni Hanbali günü.\" diye bağırdı. {alıntı:Shadharat-Dhahab, s. 544}."
  id: "Ibn al-Fawus Abu al-Hasan Ali ibn al-Mubarak al-Baghdadi al-Hanbali, tukang sepatu pertapa itu; ia biasa memisahkan hari Jumat dengan orang-orang yang percaya pada kebenaran, kesederhanaan, dan ketulusannya. Ia menceritakan dari Qadi Abu Ya'la dan lainnya, dan Abu al-Mu'ayyad al-Ansari mendengar kabarnya. Ia membawa pembawa air ke pertemuan diktat dan minum dari sana agar yang hadir percaya bahwa ia sedang berbuka puasa dan berpuasa hampir sepanjang waktu. Ia meninggal pada malam Sabtu, tanggal sembilan belas Syawal, tahun lima ratus dua puluh satu. Doa pemakaman untuknya dimulai keesokan harinya di Masjid Istana. Hari itu adalah hari yang penting, dan ia dimakamkan di dekat makam Imam Ahmad. Pada hari itu, pasar Baghdad ditutup, dan masyarakat Baghdad bersorak di pemakamannya, \"Ini adalah hari Hanbali Sunni.\" {cite:shadharat-dhahab, hlm. 544}."
