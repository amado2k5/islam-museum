id: person/ibn-jinni
class: person
label: { ar: "أبو الفتح عثمان بن جني الموصلي النحوي" }
summary:
  ar: "عثمان بن جني الموصلي النحوي اللغوي، سكن بغداد ودرس بها العلم حتى مات. له كتب مصنفة في علم النحو منها اللمع والتعاقب في العربية وشرح القوافي والمذكر والمؤنث وسر الصنعة والخصائص وغير ذلك، وكان يقول الشعر ويجيد نظمه، وأبوه جني كان عبداً رومياً مملوكاً لسليمان بن فهد بن أحمد الأزدي الموصلي. توفي ببغداد يوم الجمعة لليلتين بقيتا من صفر سنة اثنتين وتسعين ودفن بالخيزرانية {cite:muntazam-ibn-al-jawzi j.7 p.219-221}."
  tr: "Osman ibn Cinnî el-Mevsili, Bağdat'ta yaşamış ve ölümüne kadar orada eğitim görmüş bir dilbilimci ve dilbilimciydi. 'El-Luma' ve 'Takwab fi el-Arabi', 'Şerh el-Kavafi', 'Erkek ve dişil', 'Sirr el-San'a'ah', 'El-Khasa'is' ve diğerleri gibi dilbilgisi alanında eserler yazdı. Babası, Süleyman ibn Fahd ibn Ahmed el-Ezdi el-Mevsili'ye ait bir Roma kölesiydi. Cuma günü, Sefer'den iki gece önce, 1992 Hicri'de Bağdat'ta vefat etti ve Hayzaraniyya'da defnedildi {cite:Muntazam-ibn-al-jawzi J.7 s.219-221}."
  id: "Uthman ibn Jinni al-Mawsili adalah seorang ahli tata bahasa dan ahli bahasa, yang tinggal di Baghdad dan belajar di sana hingga wafat. Ia menulis karya-karya tata bahasa, termasuk 'Al-Luma' dan 'Taqwab fi al-Arabi', 'Sharh al-Qawafi', 'Maskulin dan feminin', 'Sirr al-San'a'ah', 'Al-Khasa'is', dan lainnya. Ayahnya adalah budak Romawi milik Sulayman ibn Fahd ibn Ahmad al-Azdi al-Mawsili. Ia meninggal di Baghdad pada hari Jumat, dua malam sebelum Safar, 1992 H, dan dimakamkan di Khayzaraniyya {cite:Muntazam-ibn-al-jawzi J.7 hlm.219-221}."
