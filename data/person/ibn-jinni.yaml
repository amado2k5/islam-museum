label: { ar: "أبو الفتح عثمان بن جني الموصلي النحوي" }
summary:
  ar: "عثمان بن جني الموصلي النحوي اللغوي، سكن بغداد ودرس بها العلم حتى مات. له كتب مصنفة في علم النحو منها اللمع والتعاقب في العربية وشرح القوافي والمذكر والمؤنث وسر الصنعة والخصائص وغير ذلك، وكان يقول الشعر ويجيد نظمه، وأبوه جني كان عبداً رومياً مملوكاً لسليمان بن فهد بن أحمد الأزدي الموصلي. توفي ببغداد يوم الجمعة لليلتين بقيتا من صفر سنة اثنتين وتسعين ودفن بالخيزرانية {cite:muntazam-ibn-al-jawzi j.7 p.219-221}."
