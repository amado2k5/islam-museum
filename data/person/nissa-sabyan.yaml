summary:
  ar: "مغنية إندونيسية، وُلدت باسم خير النساء في 23 مايو 1999، وهي مغنية فرقة صبيان غامبوس التي اشتهرت بأدائها أغاني الصلوات على النبي وإعادة غناء الأغاني الإسلامية على يوتيوب. بلغت قناتها الخاصة على يوتيوب 1,180,000 مشترك و340,284,268 مشاهدة و979 مقطعًا بحسب vidIQ كما في 13 نوفمبر 2026."
  en: "Indonesian singer, born Khoirunnisa on 23 May 1999, and the vocalist of Sabyan Gambus, the Jakarta gambus group known for its shalawat singing and Islamic song covers on YouTube. Her own YouTube channel counted 1,180,000 subscribers, 340,284,268 views and 979 videos as read by vidIQ on 13 November 2026."
  ur: "انڈونیشیائی گلوکارہ، جو 23 مئی 1999ء کو خیر النساء کے نام سے پیدا ہوئیں، اور صبیان گیمبس کی گلوکارہ ہیں؛ یہ جکارتہ کا گیمبس گروپ یوٹیوب پر صلوات اور اسلامی گیتوں کی وجہ سے معروف ہوا۔ ان کے اپنے یوٹیوب چینل کے سبسکرائبر 13 نومبر 2026ء کی vidIQ قرأت کے مطابق 1,180,000، ویوز 340,284,268 اور ویڈیوز 979 تھیں۔"
  es: "Cantante indonesia, nacida Khoirunnisa el 23 de mayo de 1999, y vocalista de Sabyan Gambus, el grupo de música gambus de Yakarta conocido por sus interpretaciones de shalawat y versiones de canciones islámicas en YouTube. Su propio canal de YouTube contaba con 1.180.000 suscriptores, 340.284.268 visualizaciones y 979 vídeos, según datos de vidIQ del 13 de noviembre de 2026."
  fr: "Chanteuse indonésienne, née Khoirunnisa le 23 mai 1999, elle est la chanteuse du groupe Sabyan Gambus, un groupe de gambus de Jakarta connu pour ses chants shalawat et ses reprises de chansons islamiques sur YouTube. Sa chaîne YouTube comptait 1 180 000 abonnés, 340 284 268 vues et 979 vidéos, selon les données de vidIQ au 13 novembre 2026."
