summary:
  ar: "الإمام عبد الحليم بن عبد السلام، ابن سيف الدين خطيب حران وأب شيخ الإسلام تقي الدين؛ قرأ المذهب حتى أتقنه على والده ودرس وأفتى وصنف وصار شيخ البلد بعد أبيه وخطيبه وحاكمه، وله يد طولى في الفرائض والحساب والهيئة، ثم هاجر بأهله وأقاربه إلى دمشق سنة سبع وستين فباشر مشيخة دار الحديث السكرية بالقصاعين وكان له كرسي بالجامع يتكلم عليه أيام الجمع من حفظه، ولما توفي خلفه فيهما ولده أبو العباس. قال البرزالي كان من أعيان الحنابلة، وقال الذهبي وإنما اختفى من نور القمر وضوء الشمس يشير إلى أبيه وابنه {cite:shadharat-dhahab p. 564, 645}."
  en: "Son of Sayf al-Din, father of Taqi al-Din — shaykh, khatib and hakim of his town after his father, then the family's 667 migration to Damascus; he held the Dar al-Hadith Sukriyya chair at Qassa'in and the Friday chair at the Jami', succeeded in both by his son Abu al-Abbas; Dhahabi: 'he was eclipsed only as moonlight by the sun — of his father and his son' {cite:shadharat-dhahab p. 564, 645}."
