summary:
  ar: "قائدة مقاومة قبائلية جزائرية (نحو 1830–1863)؛ من ورجة ببلاد القبائل، قادت مع الشريف بوبغلة مقاومة الغزو الفرنسي في جرجرة، وأُسرت في 11 يوليو 1857 فسُجنت في زاوية العيساوية ببني سليمان حتى وفاتها."
  en: "Algerian Kabyle resistance leader (c. 1830–1863). From Ouerdja in Kabylie, she led, alongside Cherif Boubaghla, the resistance to the French conquest in the Djurdjura; captured on 11 July 1857, she was imprisoned in the El-Aissaouia zawiya at Beni Slimane until her death."
  ur: "جزائری قبائلی مزاحمتی رہنما (تقریباً 1830–1863)؛ ورجہ، قبائلیہ کی رہنے والی، انہوں نے شریف بوبغلة کے ساتھ جرجرة میں فرانسیسی قبضے کی مزاحمت کی قیادت کی؛ 11 جولائی 1857 کو گرفتار ہوئیں اور بنی سلیمان کی زاویہ عیساویہ میں وفات تک قید رہیں۔"
