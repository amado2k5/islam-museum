  note: "The Arabic article gives September 1863, at Beni Slimane, where she had been held in the El-Aissaouia zawiya after her capture on 11 July 1857. The English article gives the year 1863 and names Tablat — the town some 15 km from Beni Slimane, per the Arabic article — as her place of death in its infobox. Neither Beni Slimane nor Tablat has a place entity, so no died_in edge is written. She was first buried near Beni Slimane; her remains were transferred in 1995 to the El Alia Cemetery in Algiers (Arabic article)."
