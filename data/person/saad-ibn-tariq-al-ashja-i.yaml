summary:
  ar: "سعد بن طارق بن أشيم، أبو مالك الأشجعي الكوفي، محدث روى عن أبيه وأنس بن مالك وعبد الله بن أبي أوفى وغيرهم، وروى عنه حفص بن غياث وسفيان الثوري وشعبة، وقال أحمد وابن معين والعجلي إنه ثقة، وذكره ابن حبان في الثقات. (؟ - نحو ١٤٠ه، كما قال الصريفيني). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
  en: "Sa'd ibn Tariq ibn Ashyam, Abu Malik al-Ashja'i of Kufa, a hadith narrator. He narrated from his father, Anas ibn Malik and Abd Allah ibn Abi Awfa; Hafs ibn Ghiyath, Sufyan al-Thawri and Shu'ba narrated from him. Ahmad, Ibn Ma'in and al-Ajali called him reliable; Ibn Hibban lists him among the reliable. The book cites al-Sarifini for a death near 140 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
