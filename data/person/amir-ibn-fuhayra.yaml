summary:
  en: "Abu Bakr's freedman who grazed a gift flock over the cave of Thawr each evening to feed the fugitives and erase Abdullah's tracks, then travelled with them to Medina and wrote Suraqa's letter of safe-conduct."
  ar: "مولى أبي بكر؛ كان يرعى عليهما منحة غنم فيبيتان في رسلها، ويتبع بغنمه أثر عبد الله بن أبي بكر ليعفي عليه؛ ثم ارتحل مع النبي وأبي بكر إلى المدينة، وكتب كتاب الأمان لسراقة بن مالك."
  ur: "ابو بکر کے آزاد کردہ غلام تھے۔ ہجرت کے دوران غار ثور کے قریب بکریاں لاتے اور بعد میں مہاجرین کے ساتھ مدینہ کی طرف روانہ ہوئے۔ {cite:mubarakpuri-raheeq}"
  es: "El liberto de Abu Bakr, que cada tarde llevaba a pastar un rebaño de ovejas regaladas a la cueva de Thawr para alimentar a los fugitivos y borrar las huellas de Abdullah, viajó después con ellos a Medina y escribió la carta de salvoconducto de Suraqa."
  fr: "L'affranchi d'Abu Bakr qui faisait paître un troupeau de moutons en guise de don chaque soir au-dessus de la grotte de Thawr pour nourrir les fugitifs et effacer les traces d'Abdullah, voyagea ensuite avec eux jusqu'à Médine et écrivit la lettre de sauf-conduit de Suraqa."
  tr: "Ebu Bekir'in özgür adamı; onlar için koyun otlatırdı, elçilerinde iki gece kalırdı ve Abdullah ibn Ebu Bekir'in koyunlarıyla izinden giderek affederdi; sonra Peygamber ve Ebu Bekir ile birlikte Medine'ye gitti ve Suraqa ibn Malik'in Emniyet Kitabı'nı yazdı."
  id: "Mantan dari Abu Bakr; ia biasa menggembalakan domba untuk mereka sebagai pemberian dan menghabiskan dua malam di rumah utusan mereka, serta mengikuti jejak Abdullah ibn Abi Bakr dengan domba-dombanya untuk mengampuni beliau; kemudian ia melakukan perjalanan bersama Nabi dan Abu Bakr ke Madinah dan menulis Kitab Keselamatan oleh Suraqa ibn Malik."
