id: person/al-wathiq-umar-cairo
class: person
label: { ar: "الواثق بالله عمر بن إبراهيم", en: "al-Wathiq bi-Llah Umar ibn Ibrahim", fr: "al-Wathiq bi-Llah Umar ibn Ibrahim", es: "al-Wathiq bi-Llah Umar ibn Ibrahim", ur: "الوثیق باللہ عمر بن ابراہیم" }
summary:
  ar: "خليفة القاهرة [٧٨٥–٧٨٨هـ]، عمر بن إبراهيم بن المستمسك بن الحاكم، بويع بالخلافة بعد خلع المتوكل في رجب سنة خمس وثمانين فاستمر إلى أن مات يوم الأربعاء تاسع عشري شوال سنة ثمان وثمانين {cite:tarikh-khulafa-minhaj-1434 p. 761,763}."
  en: "Cairo caliph [785–788] under Barquq's deposition of al-Mutawakkil; died Wednesday 19 Shawwal 788 {cite:tarikh-khulafa-minhaj-1434 p. 761,763}."
  fr: "Le Caire calife [785-788] sous la déposition de Barquq d'al-Mutawakkil ; décédé mercredi 19 Shawwal 788 {cite:tarikh-khulafa-minhaj-1434 p. 761,763}."
  es: "Califa de El Cairo [785–788] bajo la deposición de al-Mutawakkil por parte de Barquq; murió el miércoles 19 Shawwal 788 {cita:tarikh-khulafa-minhaj-1434 p. 761.763}."
  ur: "قاہرہ کا خلیفہ [785-788] برقوق کے تحت المتوکل کی معزولی؛ وفات بروز بدھ 19 شوال 788۔ 761,763}۔"
  tr: "Kahire Halifesi [785–788 H.], Ömer ibn İbrahim ibn el-Mustamsak ibn el-Hakim, el-Mutavekkil'in 85 yılın Recep'inde tahttan indirilmesinden sonra halifeliğe bağlılık yemini etmişti ve bu bağlılığı kaçırdıktan sonra, seksen sekiz yılın Şevval ayının on dokuzuncusu Çarşamba günü vefat etti {atıf: Tarikh-khulafa-minhaj-1434, s. 761,763}."
  id: "Khalifah Kairo [785–788 H], Umar ibn Ibrahim ibn al-Mustamsak ibn al-Hakim, bersumpah setia kepada kekhalifahan setelah al-Mutawakkil digulingkan di Rajab tahun delapan puluh lima, dan ia tetap demikian hingga wafat pada hari Rabu, tanggal 19 Shawwal, tahun delapan puluh delapan {cite:Tarikh-khulafa-minhaj-1434, hlm. 761,763}."
