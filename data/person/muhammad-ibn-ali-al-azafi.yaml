id: person/muhammad-ibn-ali-al-azafi
class: person
label:
  ar: محمد بن علي العزفي
  en: Muhammad ibn Ali al-Azafi
  es: "Muhammad ibn Ali al-Azafi"
  fr: "Muhammad ibn Ali al-Azafi"
summary:
  ar: "محمد بن علي العزفي، كان صاحب سبتة يوم فتحها السلطان أبو الحسن المريني؛ عقد له السلطان على أساطيل المغربين المتجمعة بمرسى سبتة تناهز المائة مركب وأمره بمناجزة أسطول النصارى بالزقاق، فقرنوها للمصاع فهبت ريح النصر فاستلحم عدوه قهراً وقتل قائدهم الملند واستاق أساطيلهم مجنوبة إلى المرسى، وعظم بذلك فتحه."
  en: "Muhammad ibn Ali al-Azafi, master of Ceuta when Sultan Abu al-Hasan took it; the sultan gave him command of the hundred-sail combined fleets of the two Maghrebs at Ceuta's anchorage and sent him to close with the Christian fleet in the Strait — the ships grappled, the wind of victory rose, he cut down the enemy, killed their admiral al-Maland and towed the prizes home, a victory of great fame."
  es: "Muhammad ibn Ali al-Azafi era el señor de Ceuta cuando el sultán Abu al-Hasan la conquistó; el sultán le confió el mando de las flotas combinadas de cien barcos de los dos Magrebs fondeados en Ceuta y lo envió a enfrentarse a la flota cristiana en el estrecho. Los barcos se enzarzaron en una batalla, el viento de la victoria sopló, él abatió al enemigo, mató a su almirante al-Maland y remolcó las presas hasta su puerto, una victoria de gran renombre."
  fr: "Muhammad ibn Ali al-Azafi, maître de Ceuta lorsque le sultan Abu al-Hasan s'en empara; le sultan lui confia le commandement des flottes combinées de cent navires des deux Maghrebs au mouillage de Ceuta et l'envoya affronter la flotte chrétienne dans le détroit — les navires s'accrochèrent, le vent de la victoire se leva, il terrassa l'ennemi, tua leur amiral al-Maland et ramena les prises à la maison, une victoire d'une grande renommée."
