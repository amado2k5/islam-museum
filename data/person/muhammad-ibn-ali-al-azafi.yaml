label:
  ar: محمد بن علي العزفي
  en: Muhammad ibn Ali al-Azafi
summary:
  ar: "محمد بن علي العزفي، كان صاحب سبتة يوم فتحها السلطان أبو الحسن المريني؛ عقد له السلطان على أساطيل المغربين المتجمعة بمرسى سبتة تناهز المائة مركب وأمره بمناجزة أسطول النصارى بالزقاق، فقرنوها للمصاع فهبت ريح النصر فاستلحم عدوه قهراً وقتل قائدهم الملند واستاق أساطيلهم مجنوبة إلى المرسى، وعظم بذلك فتحه."
  en: "Muhammad ibn Ali al-Azafi, master of Ceuta when Sultan Abu al-Hasan took it; the sultan gave him command of the hundred-sail combined fleets of the two Maghrebs at Ceuta's anchorage and sent him to close with the Christian fleet in the Strait — the ships grappled, the wind of victory rose, he cut down the enemy, killed their admiral al-Maland and towed the prizes home, a victory of great fame."
