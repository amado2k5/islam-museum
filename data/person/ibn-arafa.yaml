summary:
  ar: "محمد بن محمد ابن عرفة الورغمي، أبو عبد الله، إمام تونس وعالمها وخطيبها في عصره، ولد وتوفي بتونس، صاحب «المختصر الكبير» في فقه المالكية، 716 إلى 803 هـ."
  en: "Muhammad ibn Muhammad Ibn Arafa al-Warghami, Abu Abdallah, imam, scholar and preacher of Tunis in his time, born and died there, author of 'al-Mukhtasar al-Kabir' on Maliki jurisprudence, 716 to 803 AH."
  es: "Muhammad ibn Muhammad Ibn Arafa al-Warghami, Abu Abdallah, imán, erudito y predicador de Túnez en su época, nacido y muerto allí, autor de 'al-Mukhtasar al-Kabir' sobre la jurisprudencia malikí, 716 a 803 AH."
  fr: "Muhammad ibn Muhammad Ibn Arafa al-Warghami, Abu Abdallah, imam, érudit et prédicateur de Tunis à son époque, né et mort là-bas, auteur de 'al-Mukhtasar al-Kabir' sur la jurisprudence malikite, 716 à 803 AH."
  ur: "محمد بن محمد ابن عرفہ ورغامی، ابو عبد اللہ، امام، عالم اور اپنے زمانے میں تیونس کے مبلغ، وہیں پیدا ہوئے اور وفات پائی، مالکی فقہ پر 'المختصر الکبیر' کے مصنف، 716 تا 803 ہجری۔"
