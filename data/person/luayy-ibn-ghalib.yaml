summary:
  ar: "أبو كعب وعامر وسماح وعوف؛ من كعب بن لؤي قريش البطاح ومن إخوته قريش الظواهر، ومن عامر بن لؤي بنو عامر بن لؤي الذين منهم سهيل بن عمرو {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
  en: "Father of Ka'b, Amir, Sama and Awf; from Ka'b descend Quraysh of the hollows and from his brothers Quraysh of the outskirts, including Banu Amir ibn Lu'ayy — the clan of Suhayl ibn Amr {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
  es: "Padre de Ka'b, Amir, Sama y Awf; de Ka'b descienden los Quraysh de los valles y de sus hermanos los Quraysh de las afueras, incluyendo a Banu Amir ibn Lu'ayy — el clan de Suhayl ibn Amr {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
  fr: "Père de Ka'b, Amir, Sama et Awf; de Ka'b descendent les Quraysh des creux et de ses frères les Quraysh des périphéries, y compris Banu Amir ibn Lu'ayy — le clan de Suhayl ibn Amr {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
  ur: "کعب، عامر، سماع اور عوف کے والد؛ کعب کی طرف سے قریش کے قریش اور اس کے بھائی قریش کی طرف سے جن میں بنو عامر بن لوئی بھی شامل ہیں - سہیل بن عمرو کا قبیلہ {حوالہ: ابن ہشام سیرہ 1/1-4} {حوالہ: مبارک پوری-رحیق صفحہ 48} {تحریر}۔"
  tr: "Ebu Ka'b, Emir, Samah ve Awf; Ka'b bin Lu'ay Kureyş el-Batah ve kardeşleri Kureyş el-Zevahir'den, ayrıca Emir ibn Lu'ay'ın oğulları Emir bin Lu'ay'dan Suhail ibn Amr {atı:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq s.48} {cite:Tarikh-al-tabari} bulunmaktadır."
  id: "Abu Ka'b, Amir, Samah, dan Awf; dari Ka'b ibn Lu'ay Quraysh al-Bathah dan dari saudara-saudaranya Quraysh al-Zawahir, serta dari Amir ibn Lu'ay putra-putra Amir ibn Lu'ay, di antaranya adalah Suhail ibn Amr {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq hlm.48} {cite:Tarikh-al-tabari}."
