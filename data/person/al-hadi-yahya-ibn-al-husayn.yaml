id: person/al-hadi-yahya-ibn-al-husayn
class: person
label: { ar: "الهادي يحيى بن الحسين بن القاسم" }
summary:
  ar: "قائم الدعوة الزيدية باليمن، الهادي يحيى بن الحسين بن القاسم بن طباطبا، قام باليمن ودعي له بإمرة المؤمنين ومات في ذي الحجة سنة ثمان ومئتين، وقام بعده ابنه المرتضى محمد ثم الناصر أحمد ثم المنتجب الحسين ثم المختار القاسم فالهادي محمد فالرشيد العباس ثم انقرضت دولتهم، وقام بالكوفة من بني طباطبا في هذا العصر أبو عبد الله محمد بن إبراهيم طباطبا في جمادى الأولى سنة تسع وتسعين ومئة {cite:tarikh-khulafa-minhaj-1434 p. 794}. وأشار على أسعد بن يعفر صاحب مخاليف اليمن ألا يتعرض لبناء غمدان إذ بناؤه على يدي غلام يخرج من أرض سبأ ومأرب يؤثر في هذا العالم تأثيراً عظيماً {cite:muruj-al-dhahab p. 540}"
  en: "Founder of Yemen's Zaydi imamate — hailed 'amir al-mu'minin', dying Dhu'l-Hijja 298; the Rassid line ran through al-Murtada, al-Nasir, al-Muntajab, al-Mukhtar, al-Hadi Muhammad and al-Rashid till their state ended {cite:tarikh-khulafa-minhaj-1434 p. 794}."
