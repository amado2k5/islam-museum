summary:
  ar: "القاضي أبو الفرج المعافى بن زكريا النهرواني؛ كان فقيهاً أديباً شاعراً عالماً بكل فن ولى القضاء ببغداد، وروى عن أبي القاسم البغوي وأبي بكر بن داود ويحيى بن صاعد وغيرهم، وروى عنه القاضي أبو الطيب الطبري الشافعي؛ وكان يقال إذا حضر القاضي أبو الفرج فقد حضرت العلوم كلها، وقيل: لو أوصى رجل بثلث ماله لأعلم الناس لوجب أن يُدفع إلى أبي الفرج المعافى وكان ثقة مأموناً في روايته؛ وله كتاب الجليس الأنيس وتصانيف أخر، وذكره الشيخ أبو إسحاق الشيرازي في طبقات الفقهاء وأثنى عليه {cite:wafayat-ayan}."
  en: "Qadi Abu al-Faraj al-Mu'afa b. Zakariya al-Nahrawani — jurist, adib and poet of Baghdad; 'when the qadi Abu al-Faraj attended, all the sciences were present'; author of al-Jalis al-Anis {cite:wafayat-ayan}."
  fr: "Qadi Abu al-Faraj al-Mu'afa b. Zakariya al-Nahrawani – juriste, adib et poète de Bagdad ; « lorsque le qadi Abu al-Faraj assistait, toutes les sciences étaient présentes » ; auteur d'al-Jalis al-Anis {cite:wafayat-ayan}."
  es: "Qadi Abu al-Faraj al-Mu'afa b. Zakariya al-Nahrawani, jurista, adib y poeta de Bagdad; \"Cuando asistió el cadí Abu al-Faraj, todas las ciencias estaban presentes\"; autor de al-Jalis al-Anis {cita:wafayat-ayan}."
  ur: "قادی ابو الفراج المضافۃ ب۔ زکریا النہروانی - فقیہ، ادیب اور بغداد کے شاعر؛ جب قاضی ابو الفراج حاضر ہوئے تو تمام علوم موجود تھے۔ الجلیس الانیس کے مصنف۔"
  tr: "Hakim Ebu el-Faraj el-Muafa ibn Zekeriye el-Nehravani; kendisi bir hukukçu, edebi figür, şair ve her alanda bir âlimdi. Bağdat'ta yargıç olarak görev yaptı. Ebu el-Kasım el-Bağhavi, Ebu Bekir bin Davud, Yahya ibn Sa'id ve diğerlerinden rivayet etti. Hakim Ebu el-Teyib el-Taberi el-Şafii ondan rivayet etti. Şöyle denirdi ki, Hakim Ebu El-Faraj oradaydı, tüm bilimler de hazır olacaktı. Ayrıca, bir adam servetinin üçte birini en bilgili kişilere bırakırsa, bunu Ebu el-Faraj el-Mu'afi'ye ödemesi zorunlu olurdu ve o da rivayetlerinde güvenilir ve itibarlıydı. Ayrıca 'Sahabenin Sahabesi' adlı kitabı ve diğer eserleri yazdı; bu eserler Şeyh Ebu İshaq el-Şirazi tarafından Tabaqat al-Fuqaha'da bahsedilmiş ve onu övmüştür {alıntı:] Wafayat-ayan}."
  id: "Hakim Abu al-Faraj al-Mu'afa ibn Zakariya al-Nahrawani; ia adalah seorang ahli hukum, tokoh sastra, penyair, dan ulama dari berbagai bidang. Ia menjabat sebagai hakim di Baghdad. Ia menceritakan dari Abu al-Qasim al-Baghawi, Abu Bakr ibn Dawud, Yahya ibn Sa'id, dan lainnya. Hakim Abu al-Tayyib al-Tabari al-Shafi'i menceritakan darinya. Dikatakan bahwa jika Hakim Abu al-Drafi'i Faraj hadir, semua ilmu pengetahuan akan hadir. Dikatakan juga bahwa jika seseorang mewariskan sepertiga kekayaannya kepada orang-orang paling berpengetahuan, maka wajib membayarkannya kepada Abu al-Faraj al-Mu'afi dan ia dapat dipercaya serta dapat diandalkan dalam riwayatnya. Ia juga menulis buku 'The Companion of the Companion' dan karya-karya lainnya, yang disebutkan oleh Sheikh Abu Ishaq al-Shirazi dalam Tabaqat al-Fuqaha' dan memujinya {cite:Wafayat-Ayan}."
