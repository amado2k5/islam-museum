summary:
  ar: "القاضي أبو الفرج المعافى بن زكريا النهرواني؛ كان فقيهاً أديباً شاعراً عالماً بكل فن ولى القضاء ببغداد، وروى عن أبي القاسم البغوي وأبي بكر بن داود ويحيى بن صاعد وغيرهم، وروى عنه القاضي أبو الطيب الطبري الشافعي؛ وكان يقال إذا حضر القاضي أبو الفرج فقد حضرت العلوم كلها، وقيل: لو أوصى رجل بثلث ماله لأعلم الناس لوجب أن يُدفع إلى أبي الفرج المعافى وكان ثقة مأموناً في روايته؛ وله كتاب الجليس الأنيس وتصانيف أخر، وذكره الشيخ أبو إسحاق الشيرازي في طبقات الفقهاء وأثنى عليه {cite:wafayat-ayan}."
  en: "Qadi Abu al-Faraj al-Mu'afa b. Zakariya al-Nahrawani — jurist, adib and poet of Baghdad; 'when the qadi Abu al-Faraj attended, all the sciences were present'; author of al-Jalis al-Anis {cite:wafayat-ayan}."
