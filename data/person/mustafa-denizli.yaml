summary:
  ar: "مدرب كرة قدم تركي ومهاجم سابق، وُلد في إزمير سنة 1949. قضى سبعة عشر موسمًا مع نادي مدينته آلتاي، وأصبح كمدرب الوحيد في التاريخ الذي فاز بالدوري التركي الممتاز مع أندية إسطنبول الثلاثة الكبرى — غلطة سراي وفنربخشة وبشكتاش — وقاد غلطة سراي إلى نصف نهائي كأس أوروبا 1988–89، وتركيا إلى ربع نهائي يورو 2000، ودرّب أيضًا في ألمانيا وإيران وأذربيجان."
  en: "Turkish football manager and former forward, born in İzmir in 1949. He spent seventeen seasons as a player with his hometown club Altay, and as a manager became the only coach in history to win the Süper Lig with all three Istanbul giants — Galatasaray, Fenerbahçe and Beşiktaş — took Galatasaray to the 1988–89 European Cup semi-finals and Turkey to the Euro 2000 quarter-finals, and also coached in Germany, Iran and Azerbaijan."
  ur: "ترک فٹبال مینیجر اور سابق فارورڈ، 1949 میں ازمیر میں پیدا ہوئے۔ کھلاڑی کے طور پر اپنے آبائی شہر کے کلب آلتائے میں سترہ سیزن گزارے، اور مینیجر کے طور پر تاریخ کے واحد کوچ بنے جنہوں نے استنبول کے تینوں بڑے کلبوں — گالاتاسرائے، فینرباخچہ اور بیشکتاش — کے ساتھ سپر لیگ جیتی؛ گالاتاسرائے کو 1988–89 یورپی کپ کے سیمی فائنل اور ترکی کو یورو 2000 کے کوارٹر فائنل تک پہنچایا، اور جرمنی، ایران اور آذربائیجان میں بھی کوچنگ کی۔"
