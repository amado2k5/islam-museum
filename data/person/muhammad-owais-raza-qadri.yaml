summary:
  ar: "منشد نعت باكستاني من كراتشي، بدأ الإنشاد في الثامنة من عمره وصدر أول ألبوماته سنة 1983، واشتهر بأدائه لكلام أحمد رضا خان البريلوي وجاب بلدانا كثيرة، وسمّته حكومة باكستان أفضل منشد نعت سنة 2007. بلغت قناته الرسمية على يوتيوب نحو 1.34 مليون مشترك في نوفمبر 2026."
  en: "Pakistani naat reciter (naat khawan) from Karachi who began reciting at the age of eight and released his first album in 1983. He is known above all for his renditions of the poetry of Ahmad Raza Khan Barelvi, has performed in many countries, and was named Best Naat Khawan by the Government of Pakistan in 2007. His official YouTube channel counted some 1.34 million subscribers in November 2026."
  ur: "کراچی سے تعلق رکھنے والے پاکستانی نعت خواں، جنہوں نے آٹھ سال کی عمر میں نعت خوانی شروع کی اور 1983 میں ان کا پہلا البم آیا۔ وہ بالخصوص احمد رضا خان بریلوی کے کلام کی ادائیگی کے لیے مشہور ہیں، کئی ملکوں میں محافل پڑھ چکے ہیں، اور حکومتِ پاکستان نے 2007 میں انہیں بہترین نعت خواں قرار دیا۔ نومبر 2026 میں ان کے سرکاری یوٹیوب چینل کے تقریباً 1.34 ملین سبسکرائبر تھے۔"
