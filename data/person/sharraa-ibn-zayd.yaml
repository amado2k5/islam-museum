summary:
  ar: "بلغ الوليد بن يزيد عنه ورود حسن عشرة فبعث في إحضاره فسأله عن الشراب فقال في الماء يشاركني فيه البغل والحمار وفي نبيذ الزبيب خمار وأذى وفي نبيذ التمر ضراط كله وفي الخمر شقيقة روحي وأليفة نفسي، وفي السماع يبعث مع التأني على ذكر الأشجان ويجدد اللهو على مواقع الأحزان، فاتخذه الوليد نديماً {cite:muruj-al-dhahab p. 201-202}."
  en: "The wit summoned by al-Walid — 'water is my mule's and donkey's share; wine is my soul's twin' — whose praise of music made him the caliph's boon-companion {cite:muruj-al-dhahab p. 201-202}."
