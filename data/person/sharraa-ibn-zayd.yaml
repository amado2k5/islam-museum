class: person
label: { ar: "شراعة بن زيد", en: "Sharra'a ibn Zayd", es: "Sharra'a ibn Zayd", fr: "Sharra'a ibn Zayd", ur: "شرع بن زید" }
summary:
  ar: "بلغ الوليد بن يزيد عنه ورود حسن عشرة فبعث في إحضاره فسأله عن الشراب فقال في الماء يشاركني فيه البغل والحمار وفي نبيذ الزبيب خمار وأذى وفي نبيذ التمر ضراط كله وفي الخمر شقيقة روحي وأليفة نفسي، وفي السماع يبعث مع التأني على ذكر الأشجان ويجدد اللهو على مواقع الأحزان، فاتخذه الوليد نديماً {cite:muruj-al-dhahab p. 201-202}."
  en: "The wit summoned by al-Walid — 'water is my mule's and donkey's share; wine is my soul's twin' — whose praise of music made him the caliph's boon-companion {cite:muruj-al-dhahab p. 201-202}."
  es: "El ingenio convocado por al-Walid —'el agua es la parte de mi mula y mi burro; el vino es el gemelo de mi alma'— cuya alabanza de la música lo convirtió en el compañero predilecto del califa {cite:muruj-al-dhahab p. 201-202}."
  fr: "L'esprit invoqué par al-Walid — « l'eau est la part de ma mule et de mon âne; le vin est le jumeau de mon âme » — dont l'éloge de la musique a fait de lui le compagnon bienfaiteur du calife {cite:muruj-al-dhahab p. 201-202}."
  ur: "الولید کی طرف سے طلب کردہ عقل - 'پانی میرے خچر اور گدھے کا حصہ ہے۔ شراب میری روح کی جڑواں ہے' - جس کی موسیقی کی تعریف نے اسے خلیفہ کا ساتھی بنا دیا {حوالہ: مروج الذہب صفحہ 201-202}۔"
  tr: "El-Velid bin Yezid onun iyi ve on güzel gülünü duydu, bu yüzden onu getirmek için gönderdi ve içeceğini sordu. Dedi ki: Suda benimle katır ve eşek paylaşır, kuru üzüm şarabında şarap ve zarar vardır, hurma şarabında tüm osuruklar vardır ve şarapta ruhumun kız kardeşi ve ruhumun yoldaşı vardır. Dinlerken, kederleri dile getirmek ve keder yerlerinde eğlenceyi yenilemek için kasıtlı bir gönderme yapar. El-Velid onu yoldaş olarak kabul etti {atıf:muruj-al-dhahab s. 201-202}."
  id: "Al-Walid ibn Yazid mendengar tentang dia tentang kebaikan dan sepuluh mawar yang baik, maka dia mengirim pesan untuk membawanya dan menanyakan tentang minuman. Dia berkata: Dalam air, dia berbagi keledai dan keledai denganku, dalam anggur kismis ada anggur dan bahaya, dalam anggur kurma, semua kentut, dan dalam anggur, saudari jiwaku dan teman jiwaku. Dalam mendengarkan dia mengirim dengan penuh pertimbangan untuk menyebutkan kesedihan dan memperbarui hiburan di tempat-tempat kesedihan. Al-Walid mengambilnya sebagai teman {cite:muruj-al-dhahab hlm. 201-202}."
