  en: "Egyptian Qur'an reciter (born 1984) from Mit Ghamr in Dakahlia, son of the reciter al-Shahat Muhammad Anwar, under whom he memorised the Qur'an; he won first place at an international competition in Egypt, recited on a Qur'an radio in London and publishes his own recordings."
