summary:
  ar: "أبو المعالي محمد بن أبي سعد الحسن بن محمد بن علي بن حمدون الكاتب، الملقب كافي الكفاة بهاء الدين البغدادي؛ من بيت مشهور بالرياسة والفضل؛ كان عارض العسكر المقتفي ثم صار صاحب ديوان الزمام المستنجدي؛ صنف كتاب التذكرة وهو من أحسن المجاميع يشتمل على التاريخ والأدب والنوادر والأشعار لم يجمع أحد من المتأخرين مثله وهو مشهور كثير الوجود؛ وقف الإمام المستنجد على حكايات فيها فاعتقد التعرض بالقدح في الدولة فأُخذ من دست منصبه وحُبس ورُمِّس في أوائل سنة اثنتين وستين ومات في الحبس {cite:wafayat-ayan}."
  en: "Bahaa al-Din Ibn Hamdun (495–562) — Abbasid katib, head of the Mustanjidi chancery; author of the celebrated Tadhkira miscellany; imprisoned by al-Mustanjid over anecdotes read as attacks on the dynasty, and died in custody {cite:wafayat-ayan}."
  es: "Bahaa al-Din Ibn Hamdun (495–562) — Katib abasí, jefe de la cancillería mustanjidi; autor de la célebre miscelánea Tadhkira; encarcelado por al-Mustanjid por anécdotas interpretadas como ataques a la dinastía, y murió bajo custodia {cite:wafayat-ayan}."
  fr: "Bahaa al-Din Ibn Hamdun (495–562) — katib abbasside, chef de la chancellerie mustanjidi; auteur du célèbre recueil Tadhkira; emprisonné par al-Mustanjid à cause d'anecdotes interprétées comme des attaques contre la dynastie, et mort en détention {cite:wafayat-ayan}."
  ur: "بہاء الدین ابن حمدون (495-562) - عباسی کاتب، مستنجیدی مجلس کے سربراہ؛ مشہور تذکیرہ متفرق کے مصنف؛ المستنجید نے خاندان پر حملوں کے طور پر پڑھے جانے والے قصے کہانیوں پر قید کیا، اور حراست میں انتقال کر گئے۔"
  tr: "Ebu el-Ma'ali Muhammed bin Ebi Sa'd el-Hasan ibn Muhammed bin Ali ibn Hamdun el-Katib, lakaplı Kafi el-Kifah Baha'eddin el-Bağdadi; liderlik ve erdemle tanınan bir aileden; el-Askar el-Muktafi'nin rakibiydi ve daha sonra Diwan al-Zamam al-Mustanjidi'nin yazarı oldu; tarih, edebiyat, anekdotlar ve şiirleri kapsayan en iyi koleksiyonlardan biri olan el-Tadhkira kitabını yazdı. Daha sonraki hiçbir alim onun gibi bir şey derlemedi ve geniş çapta tanındı. İmam el-Mustanjid, bu hikayelerle ilgili hikayelere rastladı ve bunun devlete karşı bir iftira olacağına inandı, bu yüzden görevinden ayrıldı ve 1962 başlarında hapsedildi, hapiste öldü {kaynak:wafayat-ayan}."
  id: "Abu al-Ma'ali Muhammad ibn Abi Sa'd al-Hasan ibn Muhammad ibn Ali ibn Hamdun al-Katib, dijuluki Kafi al-Kifah Baha' al-Din al-Baghdadi; berasal dari keluarga yang terkenal akan kepemimpinan dan kebajikan; ia adalah rival al-Askar al-Muqtafi dan kemudian menjadi penulis Diwan al-Zamam al-Mustanjidi; menulis buku al-Tadhkira, yang merupakan salah satu kumpulan terbaik yang mencakup sejarah, sastra, anekdot, dan puisi. Tidak ada ulama berikutnya yang menyusun sesuatu seperti dia, dan ia dikenal luas. Imam al-Mustanjid menemukan cerita tentang mereka dan percaya itu akan menjadi fitnah terhadap negara, sehingga ia mengambil jabatannya dan dipenjara serta dipenjara pada awal 1962, dan meninggal di penjara {cite:wafayat-ayan}."
