summary:
  ar: "أبو المعالي محمد بن أبي سعد الحسن بن محمد بن علي بن حمدون الكاتب، الملقب كافي الكفاة بهاء الدين البغدادي؛ من بيت مشهور بالرياسة والفضل؛ كان عارض العسكر المقتفي ثم صار صاحب ديوان الزمام المستنجدي؛ صنف كتاب التذكرة وهو من أحسن المجاميع يشتمل على التاريخ والأدب والنوادر والأشعار لم يجمع أحد من المتأخرين مثله وهو مشهور كثير الوجود؛ وقف الإمام المستنجد على حكايات فيها فاعتقد التعرض بالقدح في الدولة فأُخذ من دست منصبه وحُبس ورُمِّس في أوائل سنة اثنتين وستين ومات في الحبس {cite:wafayat-ayan}."
  en: "Bahaa al-Din Ibn Hamdun (495–562) — Abbasid katib, head of the Mustanjidi chancery; author of the celebrated Tadhkira miscellany; imprisoned by al-Mustanjid over anecdotes read as attacks on the dynasty, and died in custody {cite:wafayat-ayan}."
