summary:
  ar: "عالم نيجيري تيجاني (1927–2025)، من أبرز مشايخ الطريقة التيجانية في نيجيريا. حفظ القرآن على يد والده المقدّم التيجاني، وتلقى الطريقة، ودرّس التفسير عقودًا في باوتشي، وكان نائب رئيس لجنة الفتوى بالمجلس الأعلى للشؤون الإسلامية في نيجيريا."
  en: "Nigerian Tijani scholar (1927-2025), among the most prominent shaykhs of the Tijaniyya in Nigeria. He memorised the Qur'an under his father, a Tijani muqaddam, received the tariqa, taught tafsir for decades at Bauchi, and served as deputy chair of the Fatwa Committee of Nigeria's Supreme Council for Islamic Affairs."
  ur: "نائجیریا کے تیجانی عالم (1927ء–2025ء)، نائجیریا میں تیجانیہ کے نمایاں ترین مشائخ میں سے ایک۔ انہوں نے اپنے والد کے پاس، جو تیجانی مقدم تھے، قرآن حفظ کیا، طریقہ حاصل کیا، باؤچی میں دہائیوں تک تفسیر پڑھائی، اور نائجیریا کی سپریم کونسل برائے اسلامی امور کی فتویٰ کمیٹی کے نائب صدر رہے۔"
