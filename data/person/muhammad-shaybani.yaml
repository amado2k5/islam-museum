summary:
  ar: "خان أوزبكي (نحو 1451 – 2 ديسمبر 1510) وحّد القبائل الأوزبكية، وانتزع سمرقند وبخارى من التيموريين، وأسّس الأسرة الشيبانيّة في بخارى. وهو حفيد أبو الخير خان، وقد قُتل وهو يحارب الشاه إسماعيل الأول عند مرو."
  en: "Uzbek khan (c. 1451 – 2 December 1510) who united the Uzbek tribes, took Samarkand and Bukhara from the Timurids and founded the Shaybanid dynasty of Bukhara. A grandson of Abu'l-Khayr Khan, he was killed fighting Shah Ismail I at Merv."
  ur: "ازبک خان (تقریباً 1451ء – 2 دسمبر 1510ء) جنھوں نے ازبک قبائل کو متحد کیا، تیموریوں سے سمرقند و بخارا چھینے اور بخارا کے شیبانی خاندان کی بنیاد رکھی۔ وہ ابو الخیر خان کے پوتے تھے اور مرو کے قریب شاہ اسماعیل اول سے لڑتے ہوئے مارے گئے۔"
