label: { ar: "المستنجد بالله يوسف بن المقتفي" }
summary:
  ar: "خليفة عباسي [٥٥٥–٥٦٦هـ]، رفع المكس بالعراق وكان شديداً على المفسدين سجن رجلاً كان يسعى بالناس فحضر رجل وبذل فيه عشرة آلاف دينار فقال أنا أعطيك عشرة آلاف دينار ودلني على آخر مثله لأحبسه وأكف شره، وقال ابن النجار كان موصوفاً بالفهم الثاقب والرأي الصائب والذكاء الغالب والفضل الباهر له نظم بديع ونثر بليغ ومعرفة بعمل آلات الفلك والإسطرلاب، وفي أول خلافته مات الفائز صاحب مصر وقام العاضد آخر خلفاء بني عبيد، ومات في ثمان ربيع الآخر سنة ست وستين {cite:tarikh-khulafa-minhaj-1434 p. 678-679}."
  en: "Abbasid caliph [555–566]; he lifted Iraq's tolls and was hard on mischief-makers — to the man offering ten thousand dinars for a prisoner he answered 'take them, and show me another like him to jail'. Ibn al-Najjar praises his piercing mind and his craft of astrolabes and spheres. In his first year al-Adid, last of the Ubaydids, rose in Egypt; he died 8 Rabi' II 566 {cite:tarikh-khulafa-minhaj-1434 p. 678-679}."
