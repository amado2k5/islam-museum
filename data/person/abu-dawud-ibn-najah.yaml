summary:
  ar: "أبو داود سليمان بن نجاح الأندلسي مولى المؤيد بالله الأموي — مقرئ الأندلس وصاحب أبي عمرو الداني، وهو أنبل أصحابه وأعلمهم وأكثرهم تصانيفاً؛ توفي في رمضان سنة ست وتسعين وأربعمائة عن ثلاث وثمانين سنة {cite:shadharat-dhahab p. 403-404}."
  en: "Abu Dawud Sulayman b. Najah al-Andalusi, mawla of the Umayyad al-Mu'ayyad — muqri' of al-Andalus and companion of Abu Amr al-Dani, his noblest, most learned and most prolific pupil; died Ramadan 496 aged eighty-three {cite:shadharat-dhahab p. 403-404}."
  fr: "Abu Dawud Sulayman b. Najah al-Andalusi, mawla de l'Omeyyade al-Mu'ayyad — maître de lecture coranique d'al-Andalus et compagnon d'Abu Amr al-Dani, son élève le plus noble, le plus savant et le plus prolifique ; mort en Ramadan 496 à quatre-vingt-trois ans {cite:shadharat-dhahab p. 403-404}."
  es: "Abu Dawud Sulayman b. Najah al-Andalusi, mawla de los Omeyas al-Mu'ayyad — muqri' de al-Andalus y compañero de Abu Amr al-Dani, su discípulo más noble, más erudito y más prolífico; murió en Ramadán de 496 a la edad de ochenta y tres años {cite:shadharat-dhahab p. 403-404}."
  ur: "ابوداؤد سلیمان ب. نجح الاندلسی، امیہ المعید کے مولا - اندلس کے مقری اور ابو عمرو الدانی کے ساتھی، ان کے سب سے عظیم، سب سے زیادہ عالم اور سب سے زیادہ قابل شاگرد؛ رمضان المبارک کی وفات 496 سال کی عمر میں ہوئی۔ 403-404}۔"
  tr: "Ebu Davud Süleyman ibn Najah el-Endülüs, el-Muayyad Billah el-Umawi'nin azatlı kölesiydi; Endülüs'ün Kur'an okuyucusu ve Ebu Amr el-Dani'nin arkadaşıydı. Sahabelerinin en soylusu, en bilgilisi ve en çok eseri olan kişiydi. Hicri 496 yılının Ramazan ayında seksen üç yaşında vefat etti. {Kaynak: Şadharat-Dhaba s. 403-404}"
  id: "Abu Dawud Sulayman ibn Najah al-Andalusi, budak yang dibebaskan oleh al-Mu'ayyad Billah al-Umawi — pembaca Al-Qur'an di Andalusia dan sahabat Abu Amr al-Dani, dan beliau adalah sahabat yang paling mulia, paling berilmu, dan paling banyak menulis; beliau wafat pada bulan Ramadan tahun 496 H pada usia delapan puluh tiga tahun. {cite:shadharat-dhahab hlm. 403-404}."
