  ar: "إبراهيم بن أبي الوفاء الحنفي؛ ترجمه والده بقوله: ابني المجتهد العابد الزاهد الواعظ إبراهيم، وقرأ على علماء عصره مفتياً وصلى الناس إماماً إلى ثلاثمائة وخمسين ختمة، وتصدى للتدريس وكان مشتغلاً بالصوفية والوعظ؛ توفي سنة خمس وعشرين وتسعمائة {cite:shadharat-dhahab p. 546}."
