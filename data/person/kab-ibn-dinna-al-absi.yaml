summary:
  ar: من الفاتحين الذين اختطوا بالفسطاط، ويقال كعب بن يسار بن ضنة، كان حَكَماً في الجاهلية، وكتب عمر إلى عمرو بن العاص أن يوليه القضاء فأبى {cite:futuh-misr-amir-1999 p. 156}.
  en: One of the conquerors who laid out plots in al-Fustat, also called Ka'b ibn Yasar ibn Dinna; he had been an arbiter in the Jahiliyya, and when Umar wrote to Amr ibn al-As to make him judge, he refused {cite:futuh-misr-amir-1999 p. 156}.
  ur: فسطاط میں خطہ لینے والے فاتحین میں سے ایک، جنہیں کعب بن یسار بن ضنہ بھی کہا جاتا ہے؛ وہ جاہلیت میں ثالث تھے، اور جب عمر نے عمرو بن العاص کو انہیں قاضی بنانے کو لکھا تو انہوں نے انکار کر دیا {cite:futuh-misr-amir-1999 p. 156}۔
