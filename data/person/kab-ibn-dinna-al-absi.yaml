label:
  ar: كعب بن ضنة العبسي
  en: Ka'b ibn Dinna al-Absi
  ur: کعب بن ضنہ عبسی
  es: "Ka'b ibn Dinna al-Absi"
  fr: "Ka'b ibn Dinna al-Absi"
gender: male
roles:
