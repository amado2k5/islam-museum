summary:
  ar: من الفاتحين الذين اختطوا بالفسطاط، ويقال كعب بن يسار بن ضنة، كان حَكَماً في الجاهلية، وكتب عمر إلى عمرو بن العاص أن يوليه القضاء فأبى {cite:futuh-misr-amir-1999 p. 156}.
  en: One of the conquerors who laid out plots in al-Fustat, also called Ka'b ibn Yasar ibn Dinna; he had been an arbiter in the Jahiliyya, and when Umar wrote to Amr ibn al-As to make him judge, he refused {cite:futuh-misr-amir-1999 p. 156}.
  ur: فسطاط میں خطہ لینے والے فاتحین میں سے ایک، جنہیں کعب بن یسار بن ضنہ بھی کہا جاتا ہے؛ وہ جاہلیت میں ثالث تھے، اور جب عمر نے عمرو بن العاص کو انہیں قاضی بنانے کو لکھا تو انہوں نے انکار کر دیا {cite:futuh-misr-amir-1999 p. 156}۔
  es: "Uno de los conquistadores que trazaron conspiraciones en al-Fustat, también llamado Ka'b ibn Yasar ibn Dinna; había sido árbitro en la época preislámica (Jahiliyya), y cuando Umar le escribió a Amr ibn al-As para que lo nombrara juez, se negó {cite:futuh-misr-amir-1999 p. 156}."
  fr: "L'un des conquérants qui ont ourdi des complots à al-Fustat, également appelé Ka'b ibn Yasar ibn Dinna; il avait été arbitre dans la Jahiliyya, et lorsque Umar écrivit à Amr ibn al-As pour le nommer juge, il refusa {cite:futuh-misr-amir-1999 p. 156}."
  tr: "Fustat'ta yakalanan fatihler arasında, aynı zamanda Ka'b ibn Yasar ibn Dana olarak da bilinen, İslam öncesi dönemde bir yargıç vardı. Ömer Amr ibn al-As'a onu yargıç olarak atamak için yazdı, ancak Amr reddetti {atıf:futuh-misr-amir-1999, s. 156}."
  id: "Di antara penakluk yang ditangkap di Fustat, juga disebut Ka'b ibn Yasar ibn Danna, adalah seorang hakim pada era pra-Islam. Umar menulis surat kepada Amr ibn al-As untuk mengangkatnya sebagai hakim, tetapi ia menolak {cite:futuh-misr-amir-1999, hlm. 156}."
