summary:
  ar: "فخر الدين بن محمد بن علي الطريحي الرماحي النجفي، من علماء الإمامية، صاحب «مجمع البحرين ومطلع النيرين» في تفسير غريب القرآن والحديث، توفي في الرماحية ونقل إلى النجف، 979 إلى 1085 هـ."
  en: "Fakhr al-Din al-Turayhi al-Rammahi al-Najafi, a scholar of the Imamis, author of Majma' al-Bahrayn on the rare words of the Qur'an and hadith; he died at al-Rammahiyya and was carried to Najaf, 979 to 1085 AH."
