summary:
  ar: "\u0645\u0646\u0634\u062f \u0648\u0645\u0637\u0631\u0628 \u0648\u0645\u0644\u062d\u0646 \u062d\u0644\u0628\u064a (1918\u20132006)\u060c \u062a\u0639\u0644\u0651\u0645 \u0627\u0644\u0645\u0642\u0627\u0645\u0627\u062a \u0648\u0627\u0644\u0645\u0648\u0634\u062d\u0627\u062a \u0648\u0627\u0644\u0642\u062f\u0648\u062f \u0639\u0644\u0649 \u0639\u0645\u0631 \u0627\u0644\u0628\u0637\u0634\u060c \u0648\u0643\u0627\u0646 \u0645\u0624\u0630\u0646\u064b\u0627 \u0641\u064a \u0627\u0644\u062c\u0627\u0645\u0639 \u0627\u0644\u0623\u0645\u0648\u064a \u0628\u062d\u0644\u0628\u060c \u0648\u063a\u0646\u0651\u0649 \u0641\u064a \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0633\u0648\u0631\u064a\u0629 \u0645\u0646\u0630 1949\u060c \u0648\u0623\u0633\u0633 \u0645\u0639 \u062d\u0633\u0646 \u0627\u0644\u062d\u0641\u0627\u0631 \u0641\u0631\u0642\u0629 \u0644\u0644\u0625\u0646\u0634\u0627\u062f \u0627\u0644\u062f\u064a\u0646\u064a \u0641\u064a 1954\u060c \u0648\u0646\u0634\u0631 \u0623\u0633\u0644\u0648\u0628 \u062d\u0644\u0628 \u0641\u064a \u0627\u0644\u0639\u0627\u0644\u0645 \u0628\u0623\u0633\u0637\u0648\u0627\u0646\u0627\u062a \u00ab\u0645\u0624\u0630\u0646\u0648 \u062d\u0644\u0628\u00bb (1980) \u0648\u0645\u0627 \u0628\u0639\u062f\u0647\u0627."
  en: "Aleppine munshid, singer and composer (1918\u20132006) who learned the maqams, muwashshahat and qudud from Omar al-Batsh, served as a muezzin of the Great Mosque of Aleppo, sang on Syrian radio from 1949, founded a religious-song ensemble with Hassan Haffar in 1954, and carried the Aleppine style abroad through records from 'Muezzins d'Alep' (1980) on."
  ur: "\u062d\u0644\u0628 \u06a9\u06d2 \u0645\u0646\u0634\u062f\u060c \u06af\u0644\u0648\u06a9\u0627\u0631 \u0627\u0648\u0631 \u0645\u0648\u0633\u06cc\u0642\u0627\u0631 (1918\u0621\u20132006\u0621)\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0639\u0645\u0631 \u0627\u0644\u0628\u0637\u0634 \u0633\u06d2 \u0645\u0642\u0627\u0645\u0627\u062a\u060c \u0645\u0648\u0634\u062d\u0627\u062a \u0627\u0648\u0631 \u0642\u062f\u0648\u062f \u0633\u06cc\u06a9\u06be\u06d2\u060c \u062d\u0644\u0628 \u06a9\u06cc \u062c\u0627\u0645\u0639 \u0627\u0645\u0648\u06cc \u06a9\u06d2 \u0645\u0624\u0630\u0646 \u0631\u06c1\u06d2\u060c 1949\u0621 \u0633\u06d2 \u0634\u0627\u0645\u06cc \u0631\u06cc\u0688\u06cc\u0648 \u067e\u0631 \u06af\u0627\u06cc\u0627\u060c 1954\u0621 \u0645\u06cc\u06ba \u062d\u0633\u0646 \u0627\u0644\u062d\u0641\u0627\u0631 \u06a9\u06d2 \u0633\u0627\u062a\u06be \u062f\u06cc\u0646\u06cc \u0627\u0646\u0634\u0627\u062f \u06a9\u0627 \u0637\u0627\u0626\u0641\u06c1 \u0628\u0646\u0627\u06cc\u0627\u060c \u0627\u0648\u0631 \u00ab\u0645\u0624\u0630\u0646\u06cc\u0646\u0650 \u062d\u0644\u0628\u00bb (1980\u0621) \u0633\u06d2 \u0634\u0631\u0648\u0639 \u06c1\u0648\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u0627\u0644\u0628\u0645\u0648\u06ba \u06a9\u06d2 \u0630\u0631\u06cc\u0639\u06d2 \u062d\u0644\u0628\u06cc \u0627\u0633\u0644\u0648\u0628 \u06a9\u0648 \u062f\u0646\u06cc\u0627 \u062a\u06a9 \u067e\u06c1\u0646\u0686\u0627\u06cc\u0627\u06d4"
