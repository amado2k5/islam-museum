summary:
  ar: "منشد ومطرب وملحن حلبي (1918–2006)، تعلّم المقامات والموشحات والقدود على عمر البطش، وكان مؤذنًا في الجامع الأموي بحلب، وغنّى في الإذاعة السورية منذ 1949، وأسس مع حسن الحفار فرقة للإنشاد الديني في 1954، ونشر أسلوب حلب في العالم بأسطوانات «مؤذنو حلب» (1980) وما بعدها."
  en: "Aleppine munshid, singer and composer (1918–2006) who learned the maqams, muwashshahat and qudud from Omar al-Batsh, served as a muezzin of the Great Mosque of Aleppo, sang on Syrian radio from 1949, founded a religious-song ensemble with Hassan Haffar in 1954, and carried the Aleppine style abroad through records from 'Muezzins d'Alep' (1980) on."
  ur: "حلب کے منشد، گلوکار اور موسیقار ⁦(1918ء–2006ء)⁩، جنھوں نے عمر البطش سے مقامات، موشحات اور قدود سیکھے، حلب کی جامع اموی کے مؤذن رہے، 1949ء سے شامی ریڈیو پر گایا، 1954ء میں حسن الحفار کے ساتھ دینی انشاد کا طائفہ بنایا، اور «مؤذنینِ حلب» ⁦(1980ء)⁩ سے شروع ہونے والے البموں کے ذریعے حلبی اسلوب کو دنیا تک پہنچایا۔"
