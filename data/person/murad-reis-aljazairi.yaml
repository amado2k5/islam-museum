summary:
  ar: "رايس جزائري في عهد حسن فنزيانو؛ توغل في المحيط الأطلسي نحو سنة ٩٩٤هـ/١٥٨٦م فأغار على جزر الكناري وغنم منها غنائم كثيرة، ومن بين الأسرى زوجة حاكم تلك الجزر {cite:dawlat-uthmaniyya-salabi p. 272}."
  en: "An Algerian reis of Hasan Veneziano's era; around 994/1586 he pushed into the Atlantic, raided the Canary Islands and took rich plunder — the islands' governor's wife among the captives {cite:dawlat-uthmaniyya-salabi p. 272}."
  es: "Un reis argelino de la época de Hasan Veneziano; alrededor del año 994/1586 se adentró en el Atlántico, saqueó las Islas Canarias y se llevó un rico botín; la esposa del gobernador de las islas se encontraba entre los cautivos {cite:dawlat-uthmaniyya-salabi p. 272}."
  fr: "Un reis algérien de l'époque d'Hasan Veneziano; vers 994/1586, il s'est introduit dans l'Atlantique, a pillé les îles Canaries et a pris un riche butin — la femme du gouverneur des îles parmi les captifs {cite:dawlat-uthmaniyya-salabi p. 272}."
  ur: "حسن وینزیانو کے دور کا ایک الجزائری رئیس؛ 994/1586 کے آس پاس اس نے بحر اوقیانوس میں دھکیل دیا، کینری جزائر پر چھاپہ مارا اور بھرپور لوٹ مار لی - اسیروں میں جزیروں کی گورنر کی بیوی بھی شامل تھی۔ 272}۔"
  tr: "Rais, Hassan Venziano'nun saltanatı sırasında Cezayirliydi; yaklaşık 994 Hicri / 1586 yılında Atlantik Okyanusu'na ilerledi, Kanarya Adaları'na baskın düzenledi ve oradan birçok ganimet aldı. Esirler arasında, bu adaların hükümdarının eşi de vardı {cite:dawlat-uthmaniyya-salabi, s. 272}."
  id: "Rais adalah orang Aljazair pada masa pemerintahan Hassan Venziano; ia maju ke Samudra Atlantik sekitar tahun 994 H / 1586 M, menyerang Kepulauan Canary, dan merebut banyak rampasan dari mereka. Di antara tawanan adalah istri penguasa pulau-pulau tersebut {cite:dawlat-uthmaniyya-salabi, hlm. 272}."
