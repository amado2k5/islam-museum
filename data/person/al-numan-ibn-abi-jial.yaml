  ar: "من الضبيب من جذام ممن أسلم على كتاب رفاعة؛ نفر مع قومه إلى الهنيد بن عوص لاستنقاذ متاع دحية الكلبي فرماه قرة بن أشقر الضليعي بسهم أصاب ركبته. وأبو جعال قائل الشعر بعد ردّ النبي ما أُخذ من جذام."
