summary:
  ar: "بطاقة أولية لأبي سعيد أبي الخير الميهني، شيخ التصوف الخراساني الذي تُروى عنه أسرار التوحيد، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Abu Sa'id Abu'l-Khayr al-Mayhani, the Khurasani Sufi master of the Asrar al-Tawhid, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  fr: "Fiche provisoire d'Abu Sa'id Abu'l-Khayr al-Mayhani, le maître soufi khurasanien des Asrar al-Tawhid, nommé d'après une description de référence ouverte (Wikidata) ; sa notice d'al-A'lam n'a pas encore été vérifiée sur la page, aussi aucune date n'est donnée."
  es: "Ficha de borrador para Abu Sa'id Abu'l-Khayr al-Mayhani, el maestro sufí de Jorasán del Asrar al-Tawhid, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  ur: "اسرار التوحید کے خراسانی صوفی استاد ابو سعید ابو الخیر المہانی کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ اس کے العالم کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
