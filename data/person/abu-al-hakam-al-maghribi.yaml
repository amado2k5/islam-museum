id: person/abu-al-hakam-al-maghribi
class: person
label: { ar: "الحكيم أبو الحكم المغربي", en: "The sage Abu al-Hakam al-Maghribi", fr: "Le sage Abu al-Hakam al-Maghribi", es: "The sage Abu al-Hakam al-Maghribi", ur: "بابا الحکم المغربی" }
summary:
  ar: "طبيب أندلسي رحال؛ حج سنة 516هـ و518هـ ودخل دمشق وقرأ بصعيد مصر وبالإسكندرية ثم مضى إلى العراق وأقام ببغداد يعلم الصبيان وخدم السلطان محمود بن ملك شاه سنة 521هـ وأنشأ له في معسكره مارستاناً يُنقل على أربعين جملاً فكان طبيبه ثم عاد إلى دمشق ومات بها سنة 549هـ ودفن بباب الفراديس، وكان ذا معرفة بالأدب والطب والهندسة وله ديوان سماه نهج الوضاعة لأولي الحلاعة ذكر فيه شعراء دمشق كطالب الصوري ونصر الهيتي فيه نزهات أدبية ومفاكهات غريبة {cite:nafh-tib-maqqari p. 640}."
  en: "The travelling Andalusi physician Abu'l-Hakam al-Maghribi who served Sultan Mahmud b. Malikshah and built him a camp hospital carried on forty camels; he died at Damascus in 549 leaving a satirical diwan of Damascene poets {cite:nafh-tib-maqqari p. 640}."
  fr: "Le médecin andalou voyageur Abu'l-Hakam al-Maghribi, qui servit le sultan Mahmud b. Malikshah et lui bâtit un hôpital de campagne porté par quarante chameaux ; il mourut à Damas en 549, laissant un diwan satirique sur les poètes de Damas {cite:nafh-tib-maqqari p. 640}."
  es: "El médico andalusí itinerante Abu'l-Hakam al-Maghribi, que sirvió al sultán Mahmud b. Malikshah y le construyó un hospital de campaña, era transportado en cuarenta camellos; murió en Damasco en 549, dejando un diwan satírico de poetas damascenos {cite:nafh-tib-maqqari p. 640}."
  ur: "اندلس کا سفر کرنے والا طبیب ابو الحکم المغربی جس نے سلطان محمود ابن عباس کی خدمت کی تھی۔ ملک شاہ نے اس کے لیے ایک کیمپ ہسپتال بنایا جس پر چالیس اونٹ سوار تھے۔ اس نے دمشق میں 549 میں دمشق کے شاعروں کا ایک طنزیہ دیوان چھوڑ کر وفات پائی۔ 640}۔"
