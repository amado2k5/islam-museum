label: { ar: "الحكيم أبو الحكم المغربي" }
summary:
  ar: "طبيب أندلسي رحال؛ حج سنة 516هـ و518هـ ودخل دمشق وقرأ بصعيد مصر وبالإسكندرية ثم مضى إلى العراق وأقام ببغداد يعلم الصبيان وخدم السلطان محمود بن ملك شاه سنة 521هـ وأنشأ له في معسكره مارستاناً يُنقل على أربعين جملاً فكان طبيبه ثم عاد إلى دمشق ومات بها سنة 549هـ ودفن بباب الفراديس، وكان ذا معرفة بالأدب والطب والهندسة وله ديوان سماه نهج الوضاعة لأولي الحلاعة ذكر فيه شعراء دمشق كطالب الصوري ونصر الهيتي فيه نزهات أدبية ومفاكهات غريبة {cite:nafh-tib-maqqari p. 640}."
  en: "The travelling Andalusi physician Abu'l-Hakam al-Maghribi who served Sultan Mahmud b. Malikshah and built him a camp hospital carried on forty camels; he died at Damascus in 549 leaving a satirical diwan of Damascene poets {cite:nafh-tib-maqqari p. 640}."
