  note: "The English article gives his death at Banda Aceh on 7 August 1530 from the testimony of his gravestone, and the Indonesian article's infobox agrees; the later chronicles variously gave 1511, 1522 and 1530. The epigraphy is itself contested: the Indonesian article discusses an attributed gravestone dated 21 Muharram 930 AH (c. 30 November 1523) alongside the tradition that he died on 12 Dhu al-Hijja 936 AH, so no single Hijri year is paired with the Gregorian date. He was buried in the Kandang XII palace cemetery at Banda Aceh; no place entity exists for Banda Aceh, so the place is recorded here only. No birth block is recorded: the birth year of 1480 sometimes listed for him is supported by no source read — the English article classes his year of birth as unknown and the Indonesian article states that no contemporary source gives his birth date."
