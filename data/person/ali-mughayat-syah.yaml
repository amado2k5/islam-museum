summary:
  ar: "مؤسس سلطنة آتشيه في شمال سومطرة وأول سلاطينها (حكم نحو 1514–1530). أنهى تبعية آتشيه لبيدي، وهزم إنزالًا برتغاليًا عام 1521، وفتح دايا (1520) وبيدي (1521) وباساي (1524)، فأنشأ الدولة الأتشيهية التي بسطت نفوذها على شمال مضيق ملقا."
  en: "Founder and first sultan of the Aceh Sultanate in northern Sumatra (r. c. 1514–1530). From his capital at Banda Aceh he ended Aceh's dependence on Pidie, defeated a Portuguese landing in 1521, and conquered Daya (1520), Pidie (1521) and Pasai (1524), creating the Acehnese state that dominated the northern Straits of Melaka for three centuries."
  ur: "شمالی سماٹرا میں سلطنت آچے کے بانی اور پہلے سلطان (دورِ حکومت تقریباً 1514ء–1530ء)۔ انھوں نے آچے کی پیدی کی تابع داری ختم کی، 1521ء میں پرتگالی حملہ پسپا کیا اور دایا (1520ء)، پیدی (1521ء) اور پاسائی (1524ء) فتح کر کے وہ آچے ریاست قائم کی جو تین صدیوں تک آبنائے ملاکا کے شمالی حصے پر غالب رہی۔"

