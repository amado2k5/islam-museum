summary:
  ar: "أبو بكر محمد بن عبد الملك بن زهر الإيادي، من نوابغ الطب والأدب في الأندلس؛ ولد بإشبيلية وخدم دولتي الملثمين والموحدين، ولم يكن في زمنه أعلم منه بصناعة الطب وقد أخذها عن أبيه وعُرف بالحفيد ابن زهر، له «الترياق» في الطب وشعر رقيق وموشحات أجاد نظمها في عصره، توفي بمراكش {cite:al-aalam p. 937}."
  en: "Abu Bakr Muhammad ibn Abd al-Malik ibn Zuhr of Seville, among the foremost physicians and men of letters in al-Andalus; he served the Almoravid and Almohad states and had no equal in medicine in his day, having learnt it from his father — hence 'Ibn Zuhr the grandson'; he died at Marrakesh {cite:al-aalam p. 937}."
