summary:
  ar: "أشعب الطامع، واسمه شعيب بن جبير؛ مولى اختلف في ولائه على أقوال: لعثمان أو لعبد الله بن الزبير أو لسعيد بن العاص أو لفاطمة بنت الحسين؛ كان خال الأصمعي؛ عمّر دهراً طويلاً وأدرك زمن عثمان وقرأ القرآن وتنسك؛ روى عن عبد الله بن جعفر والقاسم بن محمد وسالم بن عبد الله وعكرمة؛ وله أخبار طريفة في طمعه ونوادره بالمدينة، وكان يغني وله أصوات حكيت عنه {cite:wafayat-ayan}."
  en: "Ash'ab al-Tami' (Shu'ayb b. Jubayr, b. 9 AH) — the Medinan figure proverbial for his appetite; a mawla who lived long, knew Qur'an and worship, transmitted from Abdallah b. Ja'far and others, sang, and became the hero of countless anecdotes {cite:wafayat-ayan}."
  es: "Ash'ab al-Tami' (Shu'ayb b. Jubayr, n. 9 AH) — la figura medinense proverbial por su apetito; un mawla que vivió mucho tiempo, conocía el Corán y la adoración, transmitió de Abdallah b. Ja'far y otros, cantó y se convirtió en el héroe de innumerables anécdotas {cite:wafayat-ayan}."
  fr: "Ash'ab al-Tami' (Shu'ayb b. Jubayr, né en 9 AH) — le personnage médinois proverbial pour son appétit; un mawla qui vécut longtemps, connaissait le Coran et le culte, transmis par Abdallah b. Ja'far et d'autres, chantait et devint le héros d'innombrables anecdotes {cite:wafayat-ayan}."
  ur: "اشعاب التمی' ⁦(شعیب بن جبیر، پیدائش 9 ہجری)⁩ - اپنی بھوک کے لیے کہاوت والی مدینہ شخصیت؛ ایک ایسا مولا جو طویل عرصے تک زندہ رہا، قرآن اور عبادت کا علم رکھتا تھا، عبد اللہ بن سے منتقل ہوا۔ جعفر اور دیگر نے گایا اور لاتعداد کہانیوں کے ہیرو بن گئے۔"
  tr: "Ash'ab al-Tami', adı Şu'ayb bin Jubeyr'di; Osman'a sadakati Osman Abdullah ibn al-Zubayr, Sa'id ibn al-As veya Fatimah bint al-Husayn'ın görüşlerine göre değişen bir özgür adamdı; el-Esma'i'nin anne tarafından amcasıydı; uzun süre yaşadı, Osman zamanında yaşadı, Kur'an okudu ve asketizmi benimsedi; Abdullah ibn Ja'far, al-Kasim ibn Muhammed, Salim ibn Abdullah ve İkrimah'tan rivayet etti; Medine'deki açgözlülüğü ve anekdotları hakkında eğlenceli anekdotları vardı. Şarkılar söylerdi ve hakkında sesler anlatılırdı {cite:wafayat-ayan}."
  id: "Ash'ab al-Tami', yang bernama Shu'ayb ibn Jubayr; seorang mantan yang kesetiaannya kepada Uthman berbeda menurut pendapat Uthman, Abdullah ibn al-Zubayr, Sa'id ibn al-As, atau Fatimah bint al-Husayn; ia adalah paman dari pihak ibu al-Asma'i; ia hidup lama, hidup pada masa Uthman, membaca Al-Qur'an, dan mengajar pertapa yang diucapkan; ia menceritakan dari Abdullah ibn Ja'far, al-Qasim ibn Muhammad, Salim ibn Abdullah, dan Ikrimah; ia memiliki anekdot lucu tentang keserakahan dan anekdot di Madinah. Ia biasa bernyanyi dan didengar suara-suara tentangnya {cite:wafayat-ayan}."
