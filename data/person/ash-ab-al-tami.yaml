summary:
  ar: "أشعب الطامع، واسمه شعيب بن جبير؛ مولى اختلف في ولائه على أقوال: لعثمان أو لعبد الله بن الزبير أو لسعيد بن العاص أو لفاطمة بنت الحسين؛ كان خال الأصمعي؛ عمّر دهراً طويلاً وأدرك زمن عثمان وقرأ القرآن وتنسك؛ روى عن عبد الله بن جعفر والقاسم بن محمد وسالم بن عبد الله وعكرمة؛ وله أخبار طريفة في طمعه ونوادره بالمدينة، وكان يغني وله أصوات حكيت عنه {cite:wafayat-ayan}."
  en: "Ash'ab al-Tami' (Shu'ayb b. Jubayr, b. 9 AH) — the Medinan figure proverbial for his appetite; a mawla who lived long, knew Qur'an and worship, transmitted from Abdallah b. Ja'far and others, sang, and became the hero of countless anecdotes {cite:wafayat-ayan}."
