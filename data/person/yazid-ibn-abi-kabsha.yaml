label: { ar: "يزيد بن أبي كبشة السكسكي", en: "Yazid ibn Abi Kabsha al-Saksaki", es: "Yazid ibn Abi Kabsha al-Saksaki", fr: "Yazid ibn Abi Kabsha al-Saksaki", ur: "یزید ابن ابی کبشہ السکسکی" }
summary:
  ar: "يزيد بن أبي كبشة السكسكي؛ ولاه سليمان بن عبد الملك السند فحمل محمد بن القاسم مقيداً ومات بعد قدومه أرض السند بثمانية عشرة يوماً. ولّاه صالح بن عبد الرحمن السند، فقبض على محمد بن القاسم وأرسله إلى واسط. {cite:salabi-umayyad-state-2020 p.106}"
  en: "Yazid ibn Abi Kabsha al-Saksaki; Sulayman's Sind governor who had Muhammad ibn al-Qasim carried bound — dead eighteen days after reaching the land."
  es: "Yazid ibn Abi Kabsha al-Saksaki; gobernador de Sind durante el reinado de Sulayman, quien hizo traer a Muhammad ibn al-Qasim atado; murió dieciocho días después de llegar a la tierra."
  fr: "Yazid ibn Abi Kabsha al-Saksaki; gouverneur du Sind de Sulayman qui fit transporter Muhammad ibn al-Qasim ligoté — mort dix-huit jours après son arrivée au pays."
  ur: "یزید بن ابی کبشہ السکسکی؛ سلیمان کا سندھ کا گورنر جس نے محمد بن القاسم کو پابند سلاسل کیا تھا - زمین پر پہنچنے کے اٹھارہ دن بعد مر گیا۔"
  tr: "Yezid bin Abi Kabşa el-Saksaki; Süleyman bin Abdülmelik onu Sind valisi olarak atadı, böylece Muhammed bin el-Kasım zincirler içinde taşındı ve Sindh topraklarına vardıktan on sekiz gün sonra öldü. Salih ibn Abdülrahman onu Sind valisi olarak atadı, Muhammed bin el-Kasım'ı yakaladı ve Wasit'e gönderdi. {kaynak:Selabi-Umayyad-devlet-2020 s.106}"
  id: "Yazid ibn Abi Kabsha al-Saksaki; Sulayman ibn Abd al-Malik mengangkatnya sebagai gubernur Sindh, sehingga Muhammad ibn al-Qasim dibawa dalam rantai dan meninggal delapan belas hari setelah tiba di tanah Sindh. Salih ibn Abd al-Rahman mengangkatnya sebagai gubernur Sindh, menangkap Muhammad ibn al-Qasim, dan mengirimnya ke Wasit. {cite:Salabi-Umayyad-State-2020 hlm.106}"
