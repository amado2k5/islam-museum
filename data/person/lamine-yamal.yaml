summary:
  ar: لاعب كرة قدم إسباني وُلد سنة 2007 في إسبليوغيس دو يوبريغات لأب مغربي وأم من غينيا الاستوائية؛ نجم برشلونة ومنتخب إسبانيا، فاز بيورو 2024 أصغرَ هداف في تاريخ البطولة، ويُعدّ أكبر موهبة شابة في كرة
    العالم.
  en: Spanish footballer born in Esplugues de Llobregat in 2007 to a Moroccan father and Equatorial Guinean mother; the Barcelona and Spain winger won Euro 2024 as the tournament's youngest-ever scorer
    and is rated world football's biggest young talent.
  ur: ہسپانوی فٹبالر جو 2007 میں ایسپلوگس میں مراکشی باپ اور استوائی گنی ماں کے ہاں پیدا ہوا؛ بارسلونا اور اسپین کا ونگر، یورو 2024 جیتا ٹورنامنٹ کے کم عمر ترین اسکورر کی حیثیت سے، اور دنیا کی فٹبال کی
    سب سے بڑی نوجوان قابلیت سمجھی جاتی ہے۔
  es: "Futbolista español nacido en Esplugues de Llobregat en 2007, hijo de padre marroquí y madre ecuatoguineana; el extremo del Barcelona y de la selección española ganó la Eurocopa 2024 como el goleador más joven de la historia del torneo y está considerado como el mayor talento joven del fútbol mundial."
  fr: "Footballeur espagnol né à Esplugues de Llobregat en 2007 d'un père marocain et d'une mère équato-guinéenne; l'ailier du FC Barcelone et de l'Espagne a remporté l'Euro 2024 en tant que plus jeune buteur de l'histoire du tournoi et est considéré comme le plus grand jeune talent du football mondial."
  tr: "2007 yılında Espéliogies do Llobregat'ta Faslı bir baba ve Ekvator Ginesi kökenli bir annenin çocuğu olarak doğan İspanyol futbolcu; Barselona ve İspanya milli takımının yıldızıydı; Euro 2024'ü turnuvanın tarihindeki en genç golcü olarak kazandı ve dünya futbolunun en büyük genç yeteneği olarak kabul ediliyor."
  id: "Seorang pemain sepak bola Spanyol yang lahir pada tahun 2007 di Espéliogies do Llobregat dari ayah Maroko dan ibu dari Guinea Khatulistiwa; bintang untuk Barcelona dan tim nasional Spanyol, ia memenangkan Euro 2024 sebagai pencetak gol termuda dalam sejarah turnamen tersebut dan dianggap sebagai talenta muda terbesar di dunia sepak bola."
