gender: male
summary:
  ar: "مفسّر وعالم دين مصري، اشتهر بخواطره التلفزيونية في تفسير القرآن الكريم التي وصلت بلغة مبسطة إلى ملايين المشاهدين، وتولى وزارة الأوقاف وشؤون الأزهر بين سنتي 1976 و1978، ولقّبه بعضهم بإمام الدعاة."
  en: "Egyptian Qur'an commentator and religious scholar, famed for his televised reflections (khawatir) on the Qur'an, which reached millions of viewers in simple language; he served as Minister of Endowments and al-Azhar Affairs from 1976 to 1978, and some called him the Imam of the Preachers."
  ur: "مصری مفسرِ قرآن اور عالمِ دین، جو قرآن کریم کی سادہ زبان میں ٹیلی ویژن تفسیر (خواطر) سے لاکھوں ناظرین تک پہنچے؛ 1976 سے 1978 تک وزیرِ اوقاف و امورِ ازہر رہے، اور بعض نے انہیں «امام الدعاة» کا لقب دیا۔"
