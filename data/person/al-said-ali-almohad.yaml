summary:
  ar: "أبو سلمة علي بن إدريس الموحدي، الملقب بالمعتضد ويعرف بالسعيد؛ وُلي الخلافة بعد أخيه لأبيه الرشيد عبد الواحد الذي مات غريقاً، وكان ملك المغرب الأقصى وبعض الأندلس، ثم خرج إلى ناحية تلمسان وحاصر قلعة هناك، وولي بعده المرتضى عمر بن أبي إبراهيم {cite:wafayat-ayan}."
  en: "Abu Salama Ali ibn Idris al-Muwahhidi, titled al-Mu'tadid and known as al-Sa'id. He was given the caliphate after his half-brother al-Rashid Abd al-Wahid, who died by drowning, and he ruled the Far Maghrib and part of al-Andalus. He then went out to the region of Tlemcen and besieged a fortress there, and after him al-Murtada Umar ibn Abi Ibrahim succeeded {cite:wafayat-ayan}."
