summary:
  ar: "أبو سلمة علي بن إدريس الموحدي، الملقب بالمعتضد ويعرف بالسعيد؛ وُلي الخلافة بعد أخيه لأبيه الرشيد عبد الواحد الذي مات غريقاً، وكان ملك المغرب الأقصى وبعض الأندلس، ثم خرج إلى ناحية تلمسان وحاصر قلعة هناك، وولي بعده المرتضى عمر بن أبي إبراهيم {cite:wafayat-ayan}."
  en: "Abu Salama Ali ibn Idris al-Muwahhidi, titled al-Mu'tadid and known as al-Sa'id. He was given the caliphate after his half-brother al-Rashid Abd al-Wahid, who died by drowning, and he ruled the Far Maghrib and part of al-Andalus. He then went out to the region of Tlemcen and besieged a fortress there, and after him al-Murtada Umar ibn Abi Ibrahim succeeded {cite:wafayat-ayan}."
  fr: "Abu Salama Ali ibn Idris al-Muwahhidi, intitulé al-Mutadid et connu sous le nom d'al-Sa'id. Il a reçu le califat après son demi-frère al-Rashid Abd al-Wahid, qui est mort par noyade, et il a gouverné le Far Maghrib et une partie d'al-Andalus. Il sortit ensuite dans la région de Tlemcen et y assiégea une forteresse, et après lui al-Murtada Omar ibn Abi Ibrahim succéda {cite:wafayat-ayan}."
  es: "Abu Salama Ali ibn Idris al-Muwahhidi, con el título de al-Mu'tadid y conocido como al-Sa'id, recibió el califato tras la muerte por ahogamiento de su hermanastro al-Rashid Abd al-Wahid. Gobernó el Magreb lejano y parte de al-Ándalus. Posteriormente, se dirigió a la región de Tlemcen y sitió una fortaleza. Tras él, le sucedió al-Murtada Umar ibn Abi Ibrahim."
  ur: "ابو سلمہ علی ابن ادریس المواحدی، المتعدید اور السعید کے نام سے جانا جاتا ہے۔ اسے اس کے سوتیلے بھائی الرشید عبد الواحد کے بعد خلافت دی گئی، جو ڈوب کر مر گیا، اور اس نے مغرب اور اندلس کے کچھ حصے پر حکومت کی۔ اس کے بعد وہ تلمسن کے علاقے میں گیا اور وہاں ایک قلعے کا محاصرہ کر لیا اور اس کے بعد مرتضیٰ عمر بن ابی ابراہیم جانشین ہوا۔"
  tr: "Ebu Salama Ali ibn İdris el-Müvehdidi, lakaplı el-Mu'tadid ve el-Said olarak bilinir, kardeşi el-Raşid Abdülvahid'in yerine geçti; o da boğularak öldü. Uzak Mağrip'in ve Endülüs'ün bir kısmının kralıydı, ardından Tlemcen bölgesine taşındı ve orada bir kaleyi kuşattı; yerine el-Murtada Ömer bin Ebi İbrahim geçti {kaynak:wafayat-ayan}."
  id: "Abu Salama Ali ibn Idris al-Muwahdi, yang dijuluki al-Mu'tadid dan dikenal sebagai al-Sa'id, menggantikan saudaranya al-Rashid Abd al-Wahid, yang meninggal karena tenggelam. Ia adalah raja Maghreb jauh dan bagian dari al-Andalusia, lalu pindah ke wilayah Tlemcen dan mengepung benteng di sana, dan digantikan oleh al-Murtada Umar ibn Abi Ibrahim {cite:wafayat-ayan}."
