id: person/mansur-al-daylami
class: person
label: { ar: "منصور الديلمي" }
summary:
  ar: "أمير الحاج سنة 317هـ؛ سار بالحجاج من بغداد إلى مكة فوافاهم أبو طاهر القرمطي بمكة يوم التروية فنهب هو وأصحابه أموال الحجاج وقتلوهم حتى في المسجد الحرام وفي البيت نفسه وقلع الحجر الأسود {cite:kamil-ibn-al-athir p. 154}."
  en: "Commander of the pilgrim caravan of 317; the pilgrims under him met Abu Tahir at Mecca on the day of Tarwiya, who plundered and killed them even inside the sanctuary {cite:kamil-ibn-al-athir p. 154}."
  es: "Comandante de la caravana de peregrinos de 317; los peregrinos bajo su mando se encontraron con Abu Tahir en La Meca el día de Tarwiya, quien los saqueó y mató incluso dentro del santuario {cite:kamil-ibn-al-athir p. 154}."
  fr: "Commandant de la caravane de pèlerins de 317; les pèlerins sous son commandement rencontrèrent Abu Tahir à La Mecque le jour de Tarwiya, qui les pilla et les tua même à l'intérieur du sanctuaire {cite:kamil-ibn-al-athir p. 154}."
  ur: "317 کے قافلے کے کمانڈر؛ اس کے ماتحت حجاج ابو طاہر سے مکہ میں ترویہ کے دن ملے، جنہوں نے انہیں حرم کے اندر بھی لوٹا اور قتل کر دیا۔ 154}۔"
  tr: "317 Hicri yılında Hacıların Komutanı; hacıları Bağdat'tan Mekke'ye götürdü; burada Ebu Tahir el-Qarmati onları Tarviye Günü'nde Mekke'de karşıladı. O ve yoldaşları, hacıların mal-mülklerini yağmaladı, onları Mescid'de ve evin içinde bile öldürdü, Kara Taş'ı kopardı {atı:kamil-ibn-al-athir s. 154}."
  id: "Komandan para peziarah pada tahun 317 H; ia memimpin para peziarah dari Baghdad ke Mekah, di mana Abu Tahir al-Qarmati bertemu mereka di Mekah pada Hari Tarwiyah. Ia dan teman-temannya menjarah harta para peziarah dan membunuh mereka bahkan di Masjid Suci dan di dalam Rumah itu sendiri, serta merobek Batu Hitam {cite:kamil-ibn-al-athir hlm. 154}."
