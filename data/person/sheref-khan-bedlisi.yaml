summary:
  ar: "بطاقة أولية لشرف خان شمس الدين البدليسي، أمير بتليس ومؤرخ الكرد صاحب «شرفنامه»، توفي نحو سنة ١٦٠٣م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sheref Khan Shams al-Din al-Bedlisi, emir of Bitlis and historian of the Kurds, author of the Sharafnama, d. about 1603; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Sheref Khan Shams al-Din al-Bedlisi, emir de Bitlis e historiador de los kurdos, autor del Sharafnama, fallecido alrededor de 1603; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour Sheref Khan Shams al-Din al-Bedlisi, émir de Bitlis et historien des Kurdes, auteur du Sharafnama, mort vers 1603; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "شیرف خان شمس الدین البدلسی کے لیے ڈرافٹ کارڈ، بٹلس کے امیر اور کردوں کے مورخ، شرف نامہ کے مصنف، ڈی۔ تقریباً 1603; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Bitlis Emiri ve 'Şerafnama' ile tanınan Kürt tarihçisi Şeraf Han Şemseddin el-Badlisi'nin ön kartı; kendisi yaklaşık 1603 yılında ölmüştür; önemli kişilerin sözlükleriyle anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sharaf Khan Shams al-Din al-Badlisi, Emir Bitlis dan sejarawan Kurdi yang dikenal dengan 'Sharafnama'-nya, yang meninggal sekitar tahun 1603 M; ia dikenang oleh kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
