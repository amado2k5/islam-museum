summary:
  ar: "العجلوني نزيل حلب المعروف بابن خطيب سرمين؛ ولي خطابة سرمين وقرأ المترجم بحلب على الباريني وتصدّر على الكرسي بحلب وحج وجاور بمكة مراراً، وكتب عن أبي عبد الله بن جابر الأعمى المغربي قصيدته البديعة وحدّث بها عنه وسمعها منه ابن حجر في مجاورته سنة إحدى وثمانمائة، وتوفي بمكة في سادس عشر صفر {cite:shadharat-dhahab p. 18}."
  tr: "El-Ajluni, Halep'te ikamet eden biriydi ve İbn Hatib Sarmin olarak bilinirdi; Sarmin'in hatibiydi, Halep'te Al-Barini yanında biyografi eğitimi aldı, Halep'te tahta çıktı, Hac yaptı ve defalarca Mekke'de yaşadı. Ebu Abdullah bin Cabir el-Mağribi hakkında yazdığı zarif şiirini yazdı ve ondan anlattı. İbn Hajar, bunu 801 Hicri yılında mahallesinde ondan duydu. Sefer'in on altısı Mekke'de öldü {atıf:shadharat-dhahab, s. 18}."
  id: "Al-Ajluni adalah penduduk Aleppo, dikenal sebagai Ibn Khatib Sarmeen; ia adalah orator Sarmin, mempelajari biografi di Aleppo di bawah bimbingan Al-Barini, memegang tahta di Aleppo, melakukan Haji, dan berulang kali tinggal di Mekah. Ia menulis puisi indahnya tentang Abu Abdullah ibn Jabir al-Maghribi dan menceritakannya darinya. Ibn Hajar mendengarnya darinya di lingkungan sekitarnya pada tahun 801 H. Ia meninggal di Mekah pada tanggal keenam belas Safar {cite:shadharat-dhahab, hlm. 18}."
