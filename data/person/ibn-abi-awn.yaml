id: person/ibn-abi-awn
class: person
label: { ar: "إبراهيم بن محمد بن أبي عون" }
summary:
  ar: "من أتباع الشلمغاني؛ أُخذ معه فلما أُمر بصفعه مدّ يده إلى لحيته ورأسه فارتعدت يده فقبّل لحية الشلمغاني ورأسه، فصُلب معه في ذي القعدة سنة 322هـ وأُحرقا بالنار {cite:kamil-ibn-al-athir p. 218-219}."
  en: "A follower of al-Shalmaghani; ordered to slap him he kissed his beard and head instead, and was crucified and burned with him in Dhu'l-Qa'da 322 {cite:kamil-ibn-al-athir p. 218-219}."
  es: "Un seguidor de al-Shalmaghani; se le ordenó abofetearlo, pero en su lugar besó su barba y su cabeza, y fue crucificado y quemado con él en Dhu'l-Qa'da 322 {cite:kamil-ibn-al-athir p. 218-219}."
  fr: "Un disciple d'al-Shalmaghani; ayant reçu l'ordre de le gifler, il embrassa sa barbe et sa tête à la place, et fut crucifié et brûlé avec lui en Dhu'l-Qa'da 322 {cite:kamil-ibn-al-athir p. 218-219}."
  ur: "الشلمغانی کا پیروکار؛ اسے تھپڑ مارنے کا حکم دیا اس کے بجائے اس کی داڑھی اور سر کو چوما اور ذوالقعدہ 322 میں اس کے ساتھ سولی پر چڑھا دیا گیا اور جلا دیا گیا۔ 218-219}۔"
  tr: "O, el-Şalmaghani'nin takipçisiydi; onu yanında götürdü. Ona vurulmasını emrettiğinde sakalına ve başına uzandı, eli titredi. 322 Hicri Zhu-Qi'dah'ta onunla birlikte çarmıha gerilen el-Şalmaghani'nin sakalını ve başını öptü ve ateşle yaktı {atıft: kamil-ibn-al-athir s. 218-219}."
  id: "Dia adalah pengikut al-Shalmaghani; dia membawanya bersama. Ketika dia memerintahkan untuk dipukul, dia meraih janggut dan kepalanya, dan tangannya gemetar. Dia mencium janggut dan kepala al-Shalmaghani, disalibkan bersamanya dalam Dhu al-Qi'dah 322 H, dan membakarnya dengan api {cite:kamil-ibn-al-athir hlm. 218-219}."
