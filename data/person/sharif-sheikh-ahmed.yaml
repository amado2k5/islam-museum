summary:
  ar: "سياسي صومالي ⁦(ولد 1964)⁩ من جوار مهداي، درس القانون والشريعة الإسلامية في السودان وليبيا ودرّس في مقديشو، ترأس اتحاد المحاكم الإسلامية (2004–2007) ثم تحالف إعادة تحرير الصومال، وصار الرئيس السابع للصومال (2009–2012)، وفي عهده طُردت حركة الشباب من مقديشو سنة 2011؛ ثم أسس حزب هميلو قرن وظل فاعلا في المعارضة."
  en: "Somali politician (born 1964) from near Mahaday, who studied law and Islamic Shariah in Sudan and Libya and taught in Mogadishu, chaired the Islamic Courts Union (2004–2007) and then the Alliance for the Re-liberation of Somalia, and became the seventh president of Somalia (2009–2012), in whose term al-Shabaab was driven from Mogadishu in 2011; he later founded the Himilo Qaran party and remained an opposition figure."
  ur: "صومالی سیاست دان ⁦(پیدائش 1964ء)⁩ جن کا تعلق مہادائی کے نواح سے ہے؛ سوڈان اور لیبیا میں قانون اور اسلامی شریعت کی تعلیم حاصل کی اور مقديشو میں تدریس کی؛ اسلامی عدالتی اتحاد ⁦(2004ء–2007ء)⁩ اور پھر صومالیہ کی آزادیِ نو کے اتحاد کے سربراہ رہے، اور صومالیہ کے ساتویں صدر بنے ⁦(2009ء–2012ء)⁩، جن کے دور میں 2011ء میں الشباب کو مقديشو سے نکالا گیا؛ بعد میں انھوں نے ہمیلو قرن پارٹی کی بنیاد رکھی۔"
  es: "Político somalí (nacido en 1964) de las cercanías de Mahaday, que estudió derecho y la sharia islámica en Sudán y Libia y enseñó en Mogadiscio, presidió la Unión de Tribunales Islámicos (2004-2007) y luego la Alianza para la Liberación de Somalia, y se convirtió en el séptimo presidente de Somalia (2009-2012), durante cuyo mandato Al-Shabaab fue expulsado de Mogadiscio en 2011; más tarde fundó el partido Himilo Qaran y siguió siendo una figura de la oposición."
  fr: "Homme politique somalien (né en 1964) originaire des environs de Mahaday, qui a étudié le droit et la charia islamique au Soudan et en Libye et a enseigné à Mogadiscio, a présidé l'Union des tribunaux islamiques (2004-2007) puis l'Alliance pour la relibération de la Somalie, et est devenu le septième président de la Somalie (2009-2012), sous le mandat duquel al-Shabaab a été chassé de Mogadiscio en 2011; il a ensuite fondé le parti Himilo Qaran et est resté une figure de l'opposition."
  tr: "Mehdi mahallesinden Somalili bir politikacı (1964 doğumlu), Sudan ve Libya'da hukuk ve İslami Şeriat okudu ve Mogadişu'da eğitim aldı. İslami Mahkemeler Birliği'nin (2004–2007), ardından Somali Yeniden Kurtuluş İttifakı'nın başkanlığını yaptı ve Somali'nin yedinci cumhurbaşkanı oldu (2009–2012). Görev süresi boyunca El-Şebab, 2011'de Mogadişu'dan ihraç edildi; daha sonra Hamilo Qarn Partisi'ni kurdu ve muhalefette aktif kaldı."
  id: "Seorang politikus Somalia (lahir 1964) dari lingkungan Mehdi, ia belajar hukum dan Syariah Islam di Sudan dan Libya serta belajar di Mogadishu. Ia memimpin Serikat Pengadilan Islam (2004–2007), kemudian Aliansi Pembebasan Kembali Somalia, dan menjadi presiden ketujuh Somalia (2009–2012). Selama masa jabatannya, Al-Shabaab dikeluarkan dari Mogadishu pada 2011; kemudian ia mendirikan Partai Hamilo Qarn dan tetap aktif di oposisi."
