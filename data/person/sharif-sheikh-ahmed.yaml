summary:
  ar: "سياسي صومالي (ولد 1964) من جوار مهداي، درس القانون والشريعة الإسلامية في السودان وليبيا ودرّس في مقديشو، ترأس اتحاد المحاكم الإسلامية (2004–2007) ثم تحالف إعادة تحرير الصومال، وصار الرئيس السابع للصومال (2009–2012)، وفي عهده طُردت حركة الشباب من مقديشو سنة 2011؛ ثم أسس حزب هميلو قرن وظل فاعلا في المعارضة."
  en: "Somali politician (born 1964) from near Mahaday, who studied law and Islamic Shariah in Sudan and Libya and taught in Mogadishu, chaired the Islamic Courts Union (2004–2007) and then the Alliance for the Re-liberation of Somalia, and became the seventh president of Somalia (2009–2012), in whose term al-Shabaab was driven from Mogadishu in 2011; he later founded the Himilo Qaran party and remained an opposition figure."
  ur: "صومالی سیاست دان (پیدائش 1964ء) جن کا تعلق مہادائی کے نواح سے ہے؛ سوڈان اور لیبیا میں قانون اور اسلامی شریعت کی تعلیم حاصل کی اور مقديشو میں تدریس کی؛ اسلامی عدالتی اتحاد (2004ء–2007ء) اور پھر صومالیہ کی آزادیِ نو کے اتحاد کے سربراہ رہے، اور صومالیہ کے ساتویں صدر بنے (2009ء–2012ء)، جن کے دور میں 2011ء میں الشباب کو مقديشو سے نکالا گیا؛ بعد میں انھوں نے ہمیلو قرن پارٹی کی بنیاد رکھی۔"
