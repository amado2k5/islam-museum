summary:
  ar: "عالم تونسي تولى مشيخة الأزهر، وكتب في الفقه والأصول والتاريخ والأدب. تصفه مقدمة مجمع البحوث الإسلامية بأنه تلقى تعليمه في جامع الزيتونة، وعمل قاضيًا ومدرسًا وكاتبًا، وأنشأ مجلة «السعادة العظمى» ينشر فيها محاسن الإسلام ويكشف أساليب الاستعمار {cite:al-hurriyya-fi-al-islam-azhar p. 14}{cite:al-hurriyya-fi-al-islam-azhar p. 18}. ويذكر غلاف الكتاب تاريخ وفاته بسنة 1377هـ ⁦(1958م)⁩، وهذا التاريخ يحتاج مصدرًا ثانيًا قبل الاعتماد عليه."
  en: "A Tunisian scholar who became Shaykh of al-Azhar and wrote on jurisprudence, legal theory, history and literature. The Academy's introduction describes his Zaytuna training, his work as judge, teacher and writer, and his journal al-Sa'ada al-Uzma against colonial influence (pp. 14, 18). The cover gives his death as 1377 AH (1958 CE); this needs a second source before use."
  es: "Un erudito tunecino que llegó a ser jeque de al-Azhar y escribió sobre jurisprudencia, teoría jurídica, historia y literatura. La introducción de la Academia describe su formación en Zaytuna, su labor como juez, profesor y escritor, y su revista al-Sa'ada al-Uzma contra la influencia colonial (págs. 14, 18). La portada indica que falleció en 1377 AH (1958 d. C.); esta información requiere una segunda fuente antes de su uso."
  fr: "Érudit tunisien devenu cheikh d'al-Azhar, il écrivit sur la jurisprudence, la théorie juridique, l'histoire et la littérature. L'introduction de l'Académie décrit sa formation à Zaytuna, son travail de juge, d'enseignant et d'écrivain, ainsi que sa revue al-Sa'ada al-Uzma, qui s'opposait à l'influence coloniale (p. 14, 18). La couverture indique sa mort en 1377 AH (1958 ap. J.-C.); cette information nécessite une vérification auprès d'une autre source."
  ur: "تیونس کے ایک عالم جو الازہر کے شیخ بنے اور فقہ، قانونی نظریہ، تاریخ اور ادب پر لکھا۔ اکیڈمی کا تعارف ان کی زیتونہ کی تربیت، جج، استاد اور مصنف کے طور پر ان کے کام اور نوآبادیاتی اثرات کے خلاف ان کے جریدے السعدہ العظمیٰ ⁦(صفحہ 14، 18)⁩ کو بیان کرتا ہے۔ سرورق ان کی وفات 1377ھ ⁦(1958ء)⁩ بتاتا ہے۔ اس کو استعمال کرنے سے پہلے دوسرا ذریعہ درکار ہے۔"
  tr: "El-Ezher'in Büyük Şeyhi olarak görev yapmış Tunuslu bir âlim olan Scully, fıkıh, prensipler, tarih ve edebiyat üzerine yazdı. İslami Araştırma Akademisi'nin girişinde, eğitimini Zeytuna Üniversitesi'nde aldığı, yargıç, öğretmen ve yazar olarak çalıştığı ve İslam'ın erdemlerini yayımladığı ve sömürge yöntemlerini ortaya çıkardığı \"Al-Sa'adah al-Azma\" dergisini kurduğu belirtilir {cite:al-hurriyya-fi-al-Islam-azhar s. 14} {cite:al-hurriyya-fi-al-Islam-azhar s. 18}. Kitabın kapağında ölüm tarihi 1377 Hicri (1958 AD) olarak belirtilir ve bu tarihe başvurulmadan önce ikinci bir kaynak gereklidir."
  id: "Seorang ulama Tunisia yang pernah menjabat sebagai Grand Sheikh Al-Azhar, ia menulis tentang firisprudensi, prinsip, sejarah, dan sastra. Pengantar ke Akademi Riset Islam menggambarkan ia telah menerima pendidikan di Universitas Zaytuna, bekerja sebagai hakim, guru, dan penulis, serta mendirikan majalah \"Al-Sa'adah al-Azma,\" di mana ia menerbitkan kebajikan Islam dan mengungkap metode kolonial {cite:al-hurriyya-fi-al-Islam-azhar hlm. 14} {cite:al-hurriyya-fi-al-Islam-azhar hlm. 18}. Sampul buku tersebut menyebutkan tanggal kematiannya sebagai 1377 AH (1958 M), dan tanggal ini memerlukan sumber kedua sebelum mengandalkannya."
