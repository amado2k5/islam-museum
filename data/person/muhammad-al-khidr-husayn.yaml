summary:
  ar: "عالم تونسي تولى مشيخة الأزهر، وكتب في الفقه والأصول والتاريخ والأدب. تصفه مقدمة مجمع البحوث الإسلامية بأنه تلقى تعليمه في جامع الزيتونة، وعمل قاضيًا ومدرسًا وكاتبًا، وأنشأ مجلة «السعادة العظمى» ينشر فيها محاسن الإسلام ويكشف أساليب الاستعمار {cite:al-hurriyya-fi-al-islam-azhar p. 14}{cite:al-hurriyya-fi-al-islam-azhar p. 18}. ويذكر غلاف الكتاب تاريخ وفاته بسنة 1377هـ (1958م)، وهذا التاريخ يحتاج مصدرًا ثانيًا قبل الاعتماد عليه."
  en: "A Tunisian scholar who became Shaykh of al-Azhar and wrote on jurisprudence, legal theory, history and literature. The Academy's introduction describes his Zaytuna training, his work as judge, teacher and writer, and his journal al-Sa'ada al-Uzma against colonial influence (pp. 14, 18). The cover gives his death as 1377 AH (1958 CE); this needs a second source before use."
