id: person/thawaba-ibn-salama-al-judhami
class: person
label: { ar: "ثوابة بن سلامة الجذامي" }
gender: male
summary:
  ar: "أمير الأندلس بعهد عبد الرحمن بن حبيب صاحب إفريقية منسلخ رجب سنة تسع وعشرين ومائة؛ فضبط الأندلس وقام بأمره الصميل بن حاتم واجتمع عليه الفريقان وهلك لسنة من ولايته {cite:nafh-tib-maqqari p. 274}."
  en: "Governor of al-Andalus by Abd al-Rahman b. Habib's writ in Rajab 129; al-Sumayl ran his affairs and the two factions united under him, and he died within a year {cite:nafh-tib-maqqari p. 274}."
  es: "Gobernador de al-Andalus por decreto de Abd al-Rahman b. Habib en Rajab 129; al-Sumayl administró sus asuntos y las dos facciones se unieron bajo su mando, y murió dentro de un año {cite:nafh-tib-maqqari p. 274}."
  fr: "Gouverneur d'al-Andalus par l'ordre d'Abd al-Rahman b. Habib en Rajab 129; al-Sumayl géra ses affaires et les deux factions s'unirent sous lui, et il mourut dans l'année {cite:nafh-tib-maqqari p. 274}."
  ur: "الاندلس کے گورنر عبدالرحمٰن بی۔ رجب 129 میں حبیب کی تحریر؛ سمیل نے اپنے معاملات چلائے اور دونوں گروہ اس کے ماتحت متحد ہو گئے اور ایک سال کے اندر اس کا انتقال ہو گیا۔ 274}۔"
  tr: "129 Hicri yılında, Rajab'dan İfrikiye hükümdarı Abdülrahman bin Habib döneminde Endülüs Emiri idi; Endülüs'ü kontrol etti ve el-Samil ibn Hatim onun rütbesini aldı. Her iki taraf da ona karşı birleşti ve o, hükümdarlığının bir yılı boyunca öldü {atıf:nafh-tib-maqqari, s. 274}."
  id: "Ia adalah Emir al-Andalus selama masa pemerintahan Abd al-Rahman ibn Habib, penguasa Ifriqiya dari Rajab pada tahun 129 H; ia menguasai al-Andalus, dan al-Samil ibn Hatim menerima perintah tersebut. Kedua pihak berkumpul melawannya, dan ia meninggal selama setahun masa pemerintahannya {cite:nafh-tib-maqqari, hlm. 274}."
