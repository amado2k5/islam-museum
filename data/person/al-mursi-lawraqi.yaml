summary:
  ar: "شيخ القراء بالشام؛ قرأ القراءات على ثلاثة من أصحاب ابن هذيل ثم على أبي الجود ثم على الكندي، وسمع ببغداد من ابن الأخضر؛ وكان عارفاً بالكلام والأصول والعربية، أقرأ واشتغل مدة وصنف التصانيف ودرس بالعزيزية نيابة وولي مشيخة الإقراء والنحو بالعادلية، وتوفي في سابع رجب وقد شرح الشاطبية {cite:shadharat-dhahab p. 532}."
  en: "Shaykh of the qurra' in Syria — of Lorca in Andalusia; read the qira'at on three pupils of Ibn Hudhayl, then Abu al-Jud and al-Kindi, heard Ibn al-Akhdar in Baghdad; versed in kalam, usul and Arabic; taught by deputy at the Aziziyya, held the Adiliyya recitation-and-grammar chair; d. 7 Rajab 661 having authored a Shatibiyya sharh {cite:shadharat-dhahab p. 532}."
