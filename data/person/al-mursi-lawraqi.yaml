summary:
  ar: "شيخ القراء بالشام؛ قرأ القراءات على ثلاثة من أصحاب ابن هذيل ثم على أبي الجود ثم على الكندي، وسمع ببغداد من ابن الأخضر؛ وكان عارفاً بالكلام والأصول والعربية، أقرأ واشتغل مدة وصنف التصانيف ودرس بالعزيزية نيابة وولي مشيخة الإقراء والنحو بالعادلية، وتوفي في سابع رجب وقد شرح الشاطبية {cite:shadharat-dhahab p. 532}."
  en: "Shaykh of the qurra' in Syria — of Lorca in Andalusia; read the qira'at on three pupils of Ibn Hudhayl, then Abu al-Jud and al-Kindi, heard Ibn al-Akhdar in Baghdad; versed in kalam, usul and Arabic; taught by deputy at the Aziziyya, held the Adiliyya recitation-and-grammar chair; d. 7 Rajab 661 having authored a Shatibiyya sharh {cite:shadharat-dhahab p. 532}."
  fr: "Cheikh de la Qurra en Syrie – de Lorca en Andalousie  ; lire la qira’at sur trois élèves d’Ibn Hudhayl, puis Abu al-Jud et al-Kindi, entendu Ibn al-Akhdar à Bagdad  ; Verset en kalam, usul et arabe ; enseigné par le député à l'Aziziya, a tenu la Adiliya récitation-et-grammaire chaise ; décédé en 7 Rajab 661 ayant écrit un Shatibiyya sharh {cite:shadharat-dhahab p. 532}."
  es: "Jeque de los Qurra' en Siria - de Lorca en Andalucía; leyó el qira'at sobre tres alumnos de Ibn Hudhayl, luego Abu al-Jud y al-Kindi, escuchó a Ibn al-Akhdar en Bagdad; versado en Kalam, usul y árabe; enseñó como diputado en Aziziyya, ocupó la cátedra de recitación y gramática de Adiliyya; d. 7 Rajab 661 siendo autor de un Shatibiyya sharh {cita: shadharat-dhahab p. 532}."
  ur: "شام میں قرہ کے شیخ - اندلس میں لورکا کے؛ ابن ہذیل کے تین شاگردوں پر قرات پڑھیں، پھر ابو الجود اور الکندی نے بغداد میں ابن الاخدر کو سنا۔ کلام، اصول اور عربی پر عبور؛ درس عزیزیہ میں نائب کی طرف سے، عدیلیہ تلاوت اور گرامر کی کرسی پر فائز؛ d 7 رجب 661 نے شاطبیہ شرح تصنیف فرمائی۔ 532}۔"
  tr: "Levant'taki şivitçilerin şeyhi; okumaları İbn Hudhayl'in üç arkadaşından, sonra Ebu el-Cudh'dan, sonra el-Kindi'den çalıştı. Bağdat'ta İbn el-Akhdar'dan dinledi; teoloji, prensipler ve Arapça bilgisine sahipti. Bir süre okudu ve çalıştı, eserler yazdı, El-Aziziye'de vekil olarak ders verdi ve El-Adliyye'de okuma ve dilbilgisi şeyhi olarak atandı. Recep'in yedinde vefat etti. Şetibiyye'yi açıkladı {kaynak:şadharat-dhahab, s. 532}."
  id: "Sheikh para pembaca di Levant; ia mempelajari bacaan di bawah tiga sahabat Ibn Hudhayl, kemudian di bawah Abu al-Judh, dan kemudian di bawah al-Kindi. Ia mendengar di Baghdad dari Ibn al-Akhdar; ia menguasai teologi, prinsip, dan bahasa Arab. Ia membaca dan bekerja untuk beberapa waktu, menulis karya, mengajar di Al-Aziziyah sebagai wakil, dan diangkat sebagai sheikh pembacaan dan tata bahasa di Al-Adliyya. Ia meninggal pada tanggal tujuh Rajab. Ia menjelaskan al-Shatibiyyah {cite:shadharat-dhahab, hlm. 532}."
