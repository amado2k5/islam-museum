summary:
  ar: "علي بن الحسين بن موسى بن بابويه، أبو الحسن القمي، شيخ الإماميين بقم في عصره بحسب الزركلي، مولده ووفاته بقم سنة 329 هـ، له كتب في التوحيد والإمامة والتفسير ورسالة في الشرائع."
  en: "Ali ibn al-Husayn ibn Musa ibn Babawayh, Abu al-Hasan al-Qummi, called by al-Zirikli the shaykh of the Imamis (Twelver Shia) in Qum in his time; born and died in Qum in 329 AH (941); author of books on divine unity, the imamate and exegesis and a treatise on the laws."
  es: "Ali ibn al-Husayn ibn Musa ibn Babawayh, Abu al-Hasan al-Qummi, llamado por al-Zirikli el shaykh de los imamíes (chiíes duodecimanos) en Qom en su tiempo; nació y murió en Qom en el año 329 AH (941); autor de libros sobre la unidad divina, el imamato y la exégesis, y un tratado sobre las leyes."
  fr: "Ali ibn al-Husayn ibn Musa ibn Babawayh, Abu al-Hasan al-Qummi, appelé par al-Zirikli le cheikh des Imamis (Chiites duodécimains) à Qum à son époque; né et mort à Qum en 329 AH (941); auteur de livres sur l'unité divine, l'imamat et l'exégèse et d'un traité sur les lois."
  ur: "علی بن الحسین بن موسیٰ ابن بابویہ، ابو الحسن القمی، جسے الزرکلی نے اپنے زمانے میں قم میں امامیوں ⁦(بارہ شیعہ)⁩ کا شیخ کہا ہے۔ 329ھ (941) میں قم میں پیدا ہوئے اور وفات پائی۔ الہی اتحاد، امامت و تفسیر اور قوانین پر ایک مقالہ کے مصنف۔"
  tr: "Ali ibn al-Hüseyin bin Musa ibn Babavey, Ebu el-Hasan el-Kummi, kendi zamanında Kum'daki İmamların şeyhi, el-Zerkali'ye göre 329 Hicri yılında Kum'da doğmuş ve ölmüştür. Tek tanrılık, İmamatlık, tefsir ve Şeriat üzerine bir risale yazmıştır."
  id: "Ali ibn al-Husayn ibn Musa ibn Babawayh, Abu al-Hasan al-Qummi, syekh para Imami di Qom pada masanya menurut al-Zarkali, lahir dan wafat di Qom pada tahun 329 H. Ia menulis buku-buku tentang monoteisme, Imamat, tafsir, dan risalah tentang Syariah."
