summary:
  ar: "سيد كلب، أبى أن يبايع لابن الزبير على منبر طبرية من بلاد الأردن وأرادها لخالد بن يزيد بن معاوية، وخطب لابن الزبير على سائر منابر الإسلام إلا منبره {cite:muruj-al-dhahab p. 79}."
  en: "Kalb's chief — alone of Islam's minbars Tiberias refused Ibn al-Zubayr's name, holding out for Khalid ibn Yazid {cite:muruj-al-dhahab p. 79}."
  es: "El jefe de Kalb —el único de los minbares del Islam— Tiberíades rechazó el nombre de Ibn al-Zubayr, insistiendo en Khalid ibn Yazid {cite:muruj-al-dhahab p. 79}."
  fr: "Le chef de Kalb — le seul des minbars de l'Islam, Tibériade, a refusé le nom d'Ibn al-Zubayr, préférant Khalid ibn Yazid {cite:muruj-al-dhahab p. 79}."
  ur: "کلب کے سردار - اسلام کے منبروں میں سے اکیلے تبریاس نے ابن الزبیر کا نام لینے سے انکار کر دیا، اور خالد بن یزید کی حمایت کی۔ 79}۔"
  tr: "Seyyid Kalb, Ürdün'deki Tiberya kürsüsünde İbn el-Zubeyr'e bağlılık yemini etmeyi reddetti; bunu Halid bin Yezid ibn Muaviye için niyetledi ve İbn el-Zubeyr için kendi kürsüsü hariç tüm İslami kürsülerde vaazlar verdi {atıf:muruj-al-dhahab, s. 79}."
  id: "Sayyid Kalb menolak bersumpah setia kepada Ibn al-Zubayr di mimbar Tiberias di Yordania, dengan tujuan itu untuk Khalid ibn Yazid ibn Muawiyah, dan menyampaikan khotbah untuk Ibn al-Zubayr di semua mimbar Islam kecuali miliknya sendiri {cite:muruj-al-dhahab, hlm. 79}."
