summary:
  ar: "وزير الموفق، كان يزعم أنه من بني شيبان وطالب بخراج سنة مبهمة فثقل على الرعية، فلما احتضر الموفق انتهبت العامة داره ودور الجلة والكتاب وفتحت السجون، وبعد موت الموفق قيده المعتضد وعذبه بأنواع العذاب وجعل في عنقه غل فيه رمانة حديد مائة وعشرون رطلاً وألبسه جبة صوف مصيرة في ودك الأكارع وعلق معه رأس ميت حتى مات في جمادى الأولى سنة ثمان وسبعين ومائتين فدفن بغله وقيوده {cite:muruj-al-dhahab p. 594-595}."
  en: "Al-Muwaffaq's vizier, tortured to death under al-Mu'tadid in a 120-ratl iron shackle with a dead man's head hung on him {cite:muruj-al-dhahab p. 594-595}."
  es: "El visir de Al-Muwaffaq, torturado hasta la muerte bajo el mandato de al-Mu'tadid en un grillete de hierro de 120 ratl con la cabeza de un hombre muerto colgada de él {cite:muruj-al-dhahab p. 594-595}."
  fr: "Le vizir d'Al-Muwaffaq, torturé à mort sous al-Mu'tadid dans une chaîne de fer de 120 ratl avec une tête de mort suspendue à lui {cite:muruj-al-dhahab p. 594-595}."
  ur: "الموفق کے وزیر کو المتدید کے ماتحت 120 رتل لوہے کی بیڑی میں تشدد کرکے موت کے گھاٹ اتار دیا گیا جس میں ایک مردہ آدمی کا سر لٹکا دیا گیا تھا۔ 594-595}۔"
  tr: "El-Muvaffaq'ın bakanı kendini Banu Şeyban'dan olduğunu iddia etti ve belirsiz bir yıl için vergi talep etti; bu da tebaaları yükledi. El-Muvaffaq öldüğünde, halk onun evini, Kur'an evlerini ve kitapları yağmaladı, hapishaneler açıldı. El-Muvaffaq'ın ölümünden sonra el-Muvaffaq onu bağladı, çeşitli işkencelerle işkence etti, boynuna yüz yirmi pound ağırlığında demir nar içeren bir kelepçe taktı, Wadak al-Akari'de Masirah'ın yün cübbesini giydirdi ve ölü bir adamın başını astı, 278 Hicri yılında Cuma el-Avval'de ölene kadar, ardından katır ve zincirleriyle gömüldü {atıf:Muruj-al-Dhahab, s. 594-595}."
  id: "Menteri al-Muwaffaq mengaku berasal dari Banu Shayban dan menuntut pajak untuk tahun yang ambigu, yang membebani rakyat. Ketika al-Muwaffaq meninggal, rakyat biasa menjarah rumahnya, rumah-rumah Al-Qur'an, buku-buku, dan penjara-penjara dibuka. Setelah kematian al-Muwaffaq, al-Mu'tadid mengikatnya, menyiksanya dengan berbagai penyiksaan, mengenakan borgol di lehernya berisi delima besi seberat seratus dua puluh pon, memakaikan jubah wol Masirah di Wadak al-Akari', dan menggantung kepala seorang mayat hingga ia meninggal di Jumada al-Awwal pada tahun 278 H, lalu dikubur bersama keledai dan rantainya {cite:muruj-al-dhahab, hlm. 594-595}."
