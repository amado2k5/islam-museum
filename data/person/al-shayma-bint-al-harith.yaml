summary:
  en: "A woman of Banu Sa'd ibn Bakr of Hawazin and foster-sister of the Prophet through nursing; taken among the Hunayn captives, she made herself known to him, he recognized her by a mark and honored her, spread his cloak for her to sit upon, then manumitted her and returned her to her people."
  ar: "امرأة من بني سعد بن بكر من هوازن، أخت النبي من الرضاعة؛ وقعت في سبي حنين فعرّفت النبي بنفسها، فعرفها بعلامة وأكرمها وبسط لها رداءه وأجلسها عليه، ثم منّ عليها وردّها إلى قومها."
