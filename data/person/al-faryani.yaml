summary:
  ar: "شمس الدين محمد بن أحمد الفرياني المغربي نسبة إلى فريانة قرية قرب القيروان؛ قدم القاهرة وأكثر التردد إلى المقريزي وواظب الجولان في قرى الريف الأدنى يعمل المواعيد ويذكر الناس وكان يستحضر كثيراً من التواريخ والأخبار الماضية ويدعي معرفة الحديث النبوي ورجاله، وتحول عن مذهب مالك وأدغى أنه يقلد الشافعي وولي قضاء نابلس إلى أن ظهر منه ما ظهر، ثم توجه سنة ثمان وأربعين وثمانمائة إلى جبال حميدة بالأرض المقدسة وادعى أنه المهدي وقيل ادعى أنه القحطاني وراج أمره هناك {cite:shadharat-dhahab p. 261-262}."
  en: "Al-Faryani of Faryana near Qayrawan — a Moroccan preacher who haunted Cairo, frequented al-Maqrizi, claimed hadith learning, moved from Maliki to Shafi'i allegiance and held the judgeship of Nablus before withdrawing in 848 to the Humayda stronghold where he claimed to be the Mahdi {cite:shadharat-dhahab p. 261-262}."
