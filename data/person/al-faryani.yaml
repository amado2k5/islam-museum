summary:
  ar: "شمس الدين محمد بن أحمد الفرياني المغربي نسبة إلى فريانة قرية قرب القيروان؛ قدم القاهرة وأكثر التردد إلى المقريزي وواظب الجولان في قرى الريف الأدنى يعمل المواعيد ويذكر الناس وكان يستحضر كثيراً من التواريخ والأخبار الماضية ويدعي معرفة الحديث النبوي ورجاله، وتحول عن مذهب مالك وأدغى أنه يقلد الشافعي وولي قضاء نابلس إلى أن ظهر منه ما ظهر، ثم توجه سنة ثمان وأربعين وثمانمائة إلى جبال حميدة بالأرض المقدسة وادعى أنه المهدي وقيل ادعى أنه القحطاني وراج أمره هناك {cite:shadharat-dhahab p. 261-262}."
  en: "Al-Faryani of Faryana near Qayrawan — a Moroccan preacher who haunted Cairo, frequented al-Maqrizi, claimed hadith learning, moved from Maliki to Shafi'i allegiance and held the judgeship of Nablus before withdrawing in 848 to the Humayda stronghold where he claimed to be the Mahdi {cite:shadharat-dhahab p. 261-262}."
  fr: "Al-Faryani de Faryana près de Kairouan — prédicateur marocain qui fréquentait Le Caire et al-Maqrizi, revendiquait le savoir du hadith, passa de l’école malikite à l’école chaféite et exerça la judicature de Naplouse avant de se retirer en 848 H dans le bastion de Humayda, où il prétendit être le Mahdi {cite:shadharat-dhahab p. 261-262}."
  es: "Al-Faryani de Faryana cerca de Qayrawan — un predicador marroquí que rondaba El Cairo, frecuentaba al-Maqrizi, afirmaba conocer hadices, pasó de la lealtad a Maliki a Shafi'i y ocupó el cargo de juez en Nablus antes de retirarse en 848 al bastión de Humayda, donde afirmaba ser el Mahdi {cite:shadharat-dhahab p. 261-262}."
  ur: "قیراوان کے قریب فاریانہ کا الفریانی - ایک مراکشی مبلغ جس نے قاہرہ کا چکر لگایا، اکثر المقریزی، حدیث سیکھنے کا دعویٰ کیا، مالکی سے شافعی کی بیعت میں چلا گیا اور 848 میں حمیدہ کے قلعے سے دستبردار ہونے سے پہلے نابلس کی حاکمیت پر فائز ہوا جہاں اس نے مہدیدہ ہونے کا دعویٰ کیا۔ 261-262}۔"
  tr: "Şemseddin Muhammed ibn Ahmed el-Faryani el-Mağribi, adını Kayrevan yakınlarındaki Faryana köyünden almıştır; Kahire'ye gelmiş ve sık sık el-Makrizi'yi ziyaret etmiş, Golan Tepeleri'nin aşağı kesimlerindeki köylerde randevular ayarlayarak ve insanlara hatırlatmalar yaparak vakit geçirmiştir. Birçok geçmiş tarihi ve haberi hatırlatır, Peygamber hadislerini ve hadis âlimlerini bildiğini iddia ederdi. Maliki mezhebinden uzaklaşarak Şafiî mezhebini takip ettiğini iddia etti. Görünüşü ortaya çıkana kadar Nablus kadısı olarak atandı. Daha sonra Hicri 848 yılında Kutsal Topraklar'daki Hamida dağlarına giderek Mehdi olduğunu iddia etti. Kendisinin el-Kahtani olduğunu iddia ettiği ve bu olayının orada yaygınlaştığı söylenir. {Kaynak: Şadharat-Dhaba, s. 261-262}"
  id: "Shams al-Din Muhammad ibn Ahmad al-Faryani al-Maghribi, yang namanya diambil dari Faryana, sebuah desa dekat Kairouan; ia datang ke Kairo dan sering mengunjungi al-Maqrizi serta sering mengunjungi Dataran Tinggi Golan di desa-desa dataran rendah, membuat janji temu dan mengingatkan orang-orang. Ia sering mengingat banyak sejarah dan berita masa lalu dan mengaku mengetahui hadits Nabi dan tokoh-tokohnya. Ia berpaling dari mazhab Maliki dan mengaku mengikuti al-Shafi'i. Ia diangkat menjadi hakim Nablus hingga apa yang tampak darinya menjadi jelas. Kemudian pada tahun 848 H, ia pergi ke pegunungan Hamida di Tanah Suci dan mengaku sebagai Mahdi. Dikatakan bahwa ia mengaku sebagai al-Qahtani, dan kisahnya menjadi populer di sana {kutip:shadharat-dhahab hlm. 261-262}."
