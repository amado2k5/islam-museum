summary:
  ar: "يوسف بن حسن بن أحمد بن حسن ابن عبد الهادي الصالحي، جمال الدين ابن المبرد، علامة متفنن من فقهاء الحنابلة من أهل الصالحية بدمشق، ٨٤٠ إلى ٩٠٩هـ الموافقة ١٤٣٦ إلى ١٥٠٣م، وللزركلي قائمة طويلة من كتبه في الفقه والحديث والتراجم والسيرة والأصول وغيرها."
  en: "Yusuf ibn Hasan ibn Ahmad ibn Hasan Ibn Abd al-Hadi al-Salihi, Jamal al-Din Ibn al-Mibrad, a versatile scholar and Hanbali jurist of al-Salihiyya in Damascus, 840 to 909 AH, 1436 to 1503 CE; al-Zirikli lists a long series of his books on jurisprudence, hadith, biography, the Sira, legal theory and other subjects."
