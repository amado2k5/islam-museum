summary:
  ar: "يوسف بن حسن بن أحمد بن حسن ابن عبد الهادي الصالحي، جمال الدين ابن المبرد، علامة متفنن من فقهاء الحنابلة من أهل الصالحية بدمشق، ٨٤٠ إلى ٩٠٩هـ الموافقة ١٤٣٦ إلى ١٥٠٣م، وللزركلي قائمة طويلة من كتبه في الفقه والحديث والتراجم والسيرة والأصول وغيرها."
  en: "Yusuf ibn Hasan ibn Ahmad ibn Hasan Ibn Abd al-Hadi al-Salihi, Jamal al-Din Ibn al-Mibrad, a versatile scholar and Hanbali jurist of al-Salihiyya in Damascus, 840 to 909 AH, 1436 to 1503 CE; al-Zirikli lists a long series of his books on jurisprudence, hadith, biography, the Sira, legal theory and other subjects."
  es: "Yusuf ibn Hasan ibn Ahmad ibn Hasan Ibn Abd al-Hadi al-Salihi, Jamal al-Din Ibn al-Mibrad, un erudito versátil y jurista hanbalí de al-Salihiyya en Damasco, 840 a 909 AH, 1436 a 1503 CE; al-Zirikli enumera una larga serie de sus libros sobre jurisprudencia, hadices, biografía, la Sira, teoría jurídica y otros temas."
  fr: "Yusuf ibn Hasan ibn Ahmad ibn Hasan Ibn Abd al-Hadi al-Salihi, Jamal al-Din Ibn al-Mibrad, un érudit polyvalent et juriste hanbalite d'al-Salihiyya à Damas, 840 à 909 AH, 1436 à 1503 CE; al-Zirikli répertorie une longue série de ses livres sur la jurisprudence, le hadith, la biographie, la Sira, la théorie juridique et d'autres sujets."
  ur: "یوسف بن حسن بن احمد بن حسن ابن عبد الہادی الصالحی، جمال الدین ابن المبراد، دمشق میں الصالحیہ کے ایک ہمہ گیر عالم اور حنبلی فقیہ، 840 تا 909 ہجری، 1436 تا 1503 عیسوی؛ الزرکلی نے فقہ، حدیث، سیرت، سیرت، قانونی نظریہ اور دیگر موضوعات پر اپنی کتابوں کا ایک طویل سلسلہ درج کیا ہے۔"
