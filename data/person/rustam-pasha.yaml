  ar: "بطاقة أولية لرستم باشا، الصدر الأعظم وصهر سليمان القانوني وباني جامعه بإزمير، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Rüstem Pasha, grand vizier and son-in-law of Suleiman the Magnificent and patron of his Iznik-tiled mosque, named from an open reference description (Wikidata); his entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Rüstem Pasha, gran visir y yerno de Solimán el Magnífico y mecenas de su mezquita con azulejos de Iznik, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Rüstem Pacha, grand vizir et gendre de Soliman le Magnifique, mécène de sa mosquée aux carreaux d'Iznik, nommé d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est indiquée."
  ur: "رستم پاشا کے لیے ڈرافٹ کارڈ، عظیم وزیر اور سلیمان کے داماد اور اس کی ایزنک ٹائل والی مسجد کے سرپرست، ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے نامزد کیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
