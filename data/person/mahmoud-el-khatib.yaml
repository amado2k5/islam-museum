summary:
  ar: "لاعب كرة قدم مصري معتزل وإداري، وُلد في قرية قرقيرة بمركز السنبلاوين في محافظة الدقهلية سنة 1954 ويُلقب بـ«بيبو». مهاجم قضى مسيرته اللعبية كلها مع النادي الأهلي (1972–1988) فسجل 109 أهداف في الدوري، ونال جائزة أفضل لاعب أفريقي سنة 1983، وفاز مع منتخب مصر بكأس الأمم الأفريقية 1986. وهو رئيس النادي الأهلي منذ 1 ديسمبر 2017."
  en: "Egyptian retired professional footballer and football administrator, born in Qarqirah, El Senbellawein, Dakahlia in 1954 and nicknamed 'Bibo'. A forward who spent his entire playing career at Al Ahly (1972–1988), scoring 109 league goals, he was named African Footballer of the Year in 1983 and won the 1986 Africa Cup of Nations with Egypt. He has served as president of Al Ahly since 1 December 2017."
  ur: "مصری ریٹائرڈ پیشہ ور فٹبالر اور فٹبال منتظم، 1954 میں دقہلیہ کے علاقے السنبلاوين کے گاؤں قرقیرہ میں پیدا ہوئے اور «بيبو» کے لقب سے مشہور ہیں۔ فارورڈ جنہوں نے اپنا پورا کھیل کیریئر ال اہلی میں گزارا (1972–1988) اور لیگ میں 109 گول کیے؛ 1983 میں افریقہ کے سال کے بہترین فٹبالر قرار پائے اور مصر کے ساتھ 1986 کا افریقہ کپ آف نیشنز جیتا۔ وہ یکم دسمبر 2017 سے ال اہلی کے صدر ہیں۔"
