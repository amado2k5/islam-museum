summary:
  ar: "قاضي القضاة كمال الدين أبو الفضل الجعفري النابلسي الحنبلي المعروف بابن قاضي نابلس؛ ولد سنة نيف وثلاثين وثمانمائة ودأب وحصل وسافر البلاد وأخذ عن المشايخ وأذن له الشيخ علاء الدين المرداوي بالإفتاء وأذن له أيضاً الشيخ تقي الدين بن قندس وبرع في المذهب وأفتى وناظر وباشر القضاء بنابلس نيابة عن والده ثم باشره بالديار المصرية عوضاً عن العز الكناني ثم باشره ببيت المقدس عوضاً عن الشمس العليمي ثم أضيف إليه قضاء الرملة ونابلس ثم عزل وأعيد مراراً وكان له معرفة ودربة بالأحكام ثم قطن في دمشق ثلاث سنين ثم توجه إلى ثغر دمياط وباشر نيابة الحكم ثم سافر منه فورد خبر موته إلى القاهرة بإسكندوية سنة تسع وثمانين وثمانمائة {cite:shadharat-dhahab p. 348-349}."
  en: "Kamal al-Din 'ibn qadi Nablus' (b. ~835) — third-generation Ja'fari chief qadi: Nablus deputy for his father, then Egypt (succeeding al-'Izz al-Kinani), then Jerusalem (succeeding al-'Ulaymi), plus Ramla; deposed and restored repeatedly, ended as deputy at Damietta — news of his death reached Cairo from Alexandria in 889 {cite:shadharat-dhahab p. 348-349}."
  es: "Kamal al-Din 'ibn qadi de Nablus' (n. ~835) — cadí jefe Ja'fari de tercera generación: diputado de Nablus por su padre, luego de Egipto (sucediendo a al-'Izz al-Kinani), luego de Jerusalén (sucediendo a al-'Ulaymi), además de Ramla; depuesto y restaurado repetidamente, terminó como diputado en Damietta — la noticia de su muerte llegó a El Cairo desde Alejandría en 889 {cite:shadharat-dhahab p. 348-349}."
  fr: "Kamal al-Din 'ibn qadi de Naplouse' (né vers 835) — cadi en chef Ja'fari de troisième génération: député de Naplouse pour son père, puis d'Égypte (succédant à al-'Izz al-Kinani), puis de Jérusalem (succédant à al-'Ulaymi), plus Ramla; déposé et rétabli à plusieurs reprises, il finit comme député à Damiette — la nouvelle de sa mort parvint au Caire depuis Alexandrie en 889 {cite: shadharat-dhahab p. 348-349}."
  ur: "کمال الدین 'ابن قدی نابلس' (b. ~ 835) - تیسری نسل کے جعفری سردار قاضی: نابلس اپنے والد کے لیے نائب، پھر مصر ⁦(جانشین العز کنانی)⁩، پھر یروشلم ⁦(جامع العلمی)⁩، علاوہ رملہ؛ معزول کیا گیا اور بار بار بحال کیا گیا، دمیٹا میں نائب کے طور پر ختم ہوا - اس کی موت کی خبر 889 میں اسکندریہ سے قاہرہ پہنچی۔ 348-349}۔"
  tr: "Baş Yargıç Kamal al-Din Ebu el-Fadl el-Ca'fari el-Nablus olarak bilinen Hanbali, İbn Kaddi Nablus olarak bilinir, 830 Hicri yılında doğmuş, gayretli ve gayretliydi, topraklara seyahat etti, şeyhlerin yanında eğitim aldı ve Şeyh Ala'ddin el-Mardavi ona fetva vermesine izin verdi. Şeyh Taqi al-Din ibn Qandis de ona izin verdi. Düşünce okulunda üstün başarı gösterdi, fetva verdi, yargıçlık yaptı ve uygulama yaptı babası adına Nablus'ta yargıç olarak görev yaptı. Daha sonra Al-Izz al-Kinani yerine Mısır'da, ardından Al-Shams Al-Alimi yerine Kudüs'te göreve başladı. Ramla ve Nablus yargılarına katıldı, görevden alındı ve defalarca yeniden görevine getirildi, ardından üç yıl Şam'da yerleşti, ardından Damietta limanlarına giderek vali yardımcısı olarak görev yapmaya başladı. Buradan, ölüm haberi 889 Hicri yılında İskenderiye'deki Kahire'ye bildirildi. {alıntı:) Shadharat-Dhahab, s. 348-349}."
  id: "Ketua Hakim Kamal al-Din Abu al-Fadl al-Ja'fari al-Nabulsi al-Hanbali, yang dikenal sebagai Ibn Qadi Nablus, lahir pada tahun 830 H, rajin dan rajin, melakukan perjalanan ke tanah itu, belajar di bawah para sheikh, dan Sheikh Ala' al-Din al-Mardawi mengizinkannya mengeluarkan fatwa. Sheikh Taqi al-Din ibn Qandis juga mengizinkannya. Ia unggul dalam aliran pemikiran, mengeluarkan fatwa, menjabat sebagai hakim, dan berpraktik sebagai hakim di Nablus atas nama ayahnya. Ia kemudian memulai di Mesir menggantikan Al-Izz al-Kinani, kemudian di Yerusalem menggantikan Al-Shams Al-Alimi. Ia ditambahkan ke pengadilan Ramla dan Nablus, diberhentikan dan berulang kali diangkat kembali, kemudian menetap di Damaskus selama tiga tahun, kemudian pergi ke pelabuhan Damietta dan mulai bertindak sebagai wakil gubernur. Dari sana, kabar kematiannya dilaporkan ke Kairo, Alexandria pada tahun 889 H. {cite:Shadharat-Dhahab, hlm. 348-349}."
