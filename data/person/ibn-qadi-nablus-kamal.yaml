gender: male
summary:
  ar: "قاضي القضاة كمال الدين أبو الفضل الجعفري النابلسي الحنبلي المعروف بابن قاضي نابلس؛ ولد سنة نيف وثلاثين وثمانمائة ودأب وحصل وسافر البلاد وأخذ عن المشايخ وأذن له الشيخ علاء الدين المرداوي بالإفتاء وأذن له أيضاً الشيخ تقي الدين بن قندس وبرع في المذهب وأفتى وناظر وباشر القضاء بنابلس نيابة عن والده ثم باشره بالديار المصرية عوضاً عن العز الكناني ثم باشره ببيت المقدس عوضاً عن الشمس العليمي ثم أضيف إليه قضاء الرملة ونابلس ثم عزل وأعيد مراراً وكان له معرفة ودربة بالأحكام ثم قطن في دمشق ثلاث سنين ثم توجه إلى ثغر دمياط وباشر نيابة الحكم ثم سافر منه فورد خبر موته إلى القاهرة بإسكندوية سنة تسع وثمانين وثمانمائة {cite:shadharat-dhahab p. 348-349}."
  en: "Kamal al-Din 'ibn qadi Nablus' (b. ~835) — third-generation Ja'fari chief qadi: Nablus deputy for his father, then Egypt (succeeding al-'Izz al-Kinani), then Jerusalem (succeeding al-'Ulaymi), plus Ramla; deposed and restored repeatedly, ended as deputy at Damietta — news of his death reached Cairo from Alexandria in 889 {cite:shadharat-dhahab p. 348-349}."
