summary:
  ar: "حسن البنا، معلم مصري وُلد سنة 1906 وأسس سنة 1928 في الإسماعيلية جمعية الإخوان المسلمين، وكان مرشدها العام. نشأ في بيت والده الساعاتي المشتغل بعلوم الحديث، وتعلم في دمنهور ودار العلوم بالقاهرة، وعمل مدرساً في الإسماعيلية حتى 1933 ثم في القاهرة. اتسع نشاط حركته منذ 1936 ودخلت السياسة، وحُلّت جمعيته في كانون الأول 1948، واغتيل في 12 شباط 1949 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1101} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1102}."
  en: "Hasan al-Banna, an Egyptian teacher born in 1906, founded the Society of the Muslim Brothers in Isma'iliyya in 1928 and led it as General Guide. Raised in the house of his father, a watch-maker who studied the traditional sciences, he studied at Damanhur and at the Dar al-'Ulum in Cairo, and taught in Isma'iliyya until 1933 and then in Cairo. His movement grew and entered politics from 1936, its organisation was ordered dissolved in December 1948, and he was assassinated on 12 February 1949 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1101} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1102}."
  ur: "حسن البنا مصری معلم تھے جو 1906ء میں پیدا ہوئے، 1928ء میں اسماعیلیہ میں جمعیت اخوان المسلمین کی بنیاد رکھی اور اس کے مرشد عام رہے۔ ان کی پرورش گھڑی ساز مگر روایتی علوم کے طالب والد کے گھر میں ہوئی، انہوں نے دمنہور اور قاہرہ کے دار العلوم میں تعلیم پائی، اور 1933ء تک اسماعیلیہ میں اور پھر قاہرہ میں پڑھایا۔ ان کی تحریک 1936ء سے وسیع ہوئی اور سیاست میں داخل ہوئی، دسمبر 1948ء میں ان کی تنظیم کو ختم کرنے کا حکم ہوا، اور وہ 12 فروری 1949ء کو قتل ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1101} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1102}۔"
