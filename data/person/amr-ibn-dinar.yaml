summary:
  ar: "من أعلام التابعين، وشيخ الحرم المكي في عصره، ومن رواة الحديث الكبار. ويذكر الكتاب أن عمرو بن دينار قال إنه ما رأى مثل طاوس، في سياق ذكر علماء البصرة ومكة في عهد عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.282}"
  en: "One of the senior Successors, and the shaykh of the Meccan sanctuary in his time; among the great transmitters of hadith."
  es: "Uno de los Sucesores de mayor rango y el jeque del santuario de La Meca en su época; uno de los grandes transmisores de hadices."
  fr: "L'un des plus anciens Successeurs, et le cheikh du sanctuaire mecquois de son temps; parmi les grands transmetteurs de hadiths."
  ur: "بزرگ جانشینوں میں سے ایک، اور اپنے زمانے میں مکی حرم کے شیخ؛ حدیث کی عظیم ترسیل کرنے والوں میں۔"
  tr: "Kendi döneminde Mekke Camii şeyhi olan önde gelen Tabi'inlerden biri ve büyük hadis anlatıcılarından biriydi. Kitapta, Amr bin Dinar'ın Ömer bin Abdülaziz döneminde Basra ve Mekke alimlerinden bahsederken Tavus gibi birini hiç görmediğini belirtir. {Kaynak:Selabi-Emevî-devlet-2020 s.282}"
  id: "Ia adalah salah satu Tabi'in terkemuka, sheikh Masjid Mekah pada masanya, dan salah satu narator hadis yang agung. Buku tersebut menyebutkan bahwa Amr ibn Dinar mengatakan ia tidak pernah melihat siapa pun seperti Tawu, dalam konteks menyebut para ulama Basra dan Mekah pada masa Umar ibn Abd al-Aziz. {sitasi: Salabi-Umayyad-State-2020 hlm.282}"
