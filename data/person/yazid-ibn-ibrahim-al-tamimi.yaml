summary:
  ar: "يزيد بن إبراهيم التميمي البصري، مولى بني تميم، روى له الجماعة، وحدّث عن ابن سيرين والحسن البصري وعطاء بن أبي رباح وطائفة، وروى عنه ابن المبارك ووكيع وابن مهدي ويزيد بن هارون وخلق سواهم. توفي سنة 162 هـ على ما يذكره العنوان، وأما مولده فالعبارة في الأصل مضطربة فلم يُثبت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  en: "Yazid ibn Ibrahim al-Tamimi al-Basri, a client of the Banu Tamim. The major hadith collectors related from him. He transmitted from Ibn Sirin, al-Hasan al-Basri, Ata ibn Abi Rabah and others, and Ibn al-Mubarak, Waki, Ibn Mahdi, Yazid ibn Harun and many others transmitted from him. The header gives 162 AH as his death year; the birth dates in the printed line are garbled and are not given here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  es: "Yazid ibn Ibrahim al-Tamimi al-Basri, cliente de los Banu Tamim. Los principales recopiladores de hadices transmitieron de él. Transmitió de Ibn Sirin, al-Hasan al-Basri, Ata ibn Abi Rabah y otros, y Ibn al-Mubarak, Waki, Ibn Mahdi, Yazid ibn Harun y muchos otros transmitieron de él. El encabezado indica el año 162 AH como su año de fallecimiento; las fechas de nacimiento en la línea impresa están ilegibles y no se incluyen aquí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  fr: "Yazid ibn Ibrahim al-Tamimi al-Basri, disciple des Banu Tamim, a transmis les hadiths des plus grands collecteurs. Il les a rapportés d'Ibn Sirin, al-Hasan al-Basri, Ata ibn Abi Rabah et d'autres, et Ibn al-Mubarak, Waki, Ibn Mahdi, Yazid ibn Harun et bien d'autres encore les ont transmis de lui. L'en-tête indique 162 AH comme année de son décès; les dates de naissance figurant sur la ligne imprimée sont illisibles et ne sont pas reproduites ici. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
