summary:
  ar: "يزيد بن إبراهيم التميمي البصري، مولى بني تميم، روى له الجماعة، وحدّث عن ابن سيرين والحسن البصري وعطاء بن أبي رباح وطائفة، وروى عنه ابن المبارك ووكيع وابن مهدي ويزيد بن هارون وخلق سواهم. توفي سنة 162 هـ على ما يذكره العنوان، وأما مولده فالعبارة في الأصل مضطربة فلم يُثبت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  en: "Yazid ibn Ibrahim al-Tamimi al-Basri, a client of the Banu Tamim. The major hadith collectors related from him. He transmitted from Ibn Sirin, al-Hasan al-Basri, Ata ibn Abi Rabah and others, and Ibn al-Mubarak, Waki, Ibn Mahdi, Yazid ibn Harun and many others transmitted from him. The header gives 162 AH as his death year; the birth dates in the printed line are garbled and are not given here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
