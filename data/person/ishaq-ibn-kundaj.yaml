summary:
  ar: "أمير الموفق، كتب إليه سنة تسع وستين أن يرد المعتمد فركب من نصيبين فلقيه بين الموصل والحديثة فرده إلى سامراء وأنزله في دار أحمد بن الخصيب ومنعه من دار الخلافة ووكل به خمس مئة، فبعث إليه الموفق بخلع وأموال وأقطعه ضياع القواد الذين كانوا مع المعتمد ولقبه ذا السيفين {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  en: "Al-Muwaffaq's commander; in 269 he rode from Nisibis, caught al-Mu'tamid between Mosul and Haditha, returned him to Samarra and confined him to Ibn al-Khasib's house under five hundred guards — rewarded with khil'as, the commanders' estates, and the title Dhu'l-Sayfayn {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
