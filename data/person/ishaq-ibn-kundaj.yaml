id: person/ishaq-ibn-kundaj
class: person
label: { ar: "إسحاق بن كنداج" }
summary:
  ar: "أمير الموفق، كتب إليه سنة تسع وستين أن يرد المعتمد فركب من نصيبين فلقيه بين الموصل والحديثة فرده إلى سامراء وأنزله في دار أحمد بن الخصيب ومنعه من دار الخلافة ووكل به خمس مئة، فبعث إليه الموفق بخلع وأموال وأقطعه ضياع القواد الذين كانوا مع المعتمد ولقبه ذا السيفين {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  en: "Al-Muwaffaq's commander; in 269 he rode from Nisibis, caught al-Mu'tamid between Mosul and Haditha, returned him to Samarra and confined him to Ibn al-Khasib's house under five hundred guards — rewarded with khil'as, the commanders' estates, and the title Dhu'l-Sayfayn {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  es: "Comandante de Al-Muwaffaq; en 269 cabalgó desde Nisibis, capturó a al-Mu'tamid entre Mosul y Haditha, lo devolvió a Samarra y lo confinó en la casa de Ibn al-Khasib bajo quinientos guardias, siendo recompensado con khil'as, las propiedades de los comandantes y el título de Dhu'l-Sayfayn {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  fr: "Commandant d'Al-Muwaffaq; en 269, il partit de Nisibis, captura al-Mu'tamid entre Mossoul et Haditha, le ramena à Samarra et le confina dans la maison d'Ibn al-Khasib sous cinq cents gardes — récompensé par des khil'as, les domaines des commandants et le titre de Dhu'l-Sayfayn {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  ur: "الموفق کا کمانڈر؛ 269 میں اس نے نسیبس سے سوار ہوکر المتمد کو موصل اور حدیدہ کے درمیان پکڑا، اسے سامرا واپس لایا اور اسے ابن الخصیب کے گھر میں پانچ سو محافظوں کے تحت قید کر دیا - اسے خلع، کمانڈروں کی جاگیروں اور ذوالصفین الخصائق کے لقب سے نوازا گیا۔ 566-567}۔"
  tr: "Emir el-Muvaffaq 1969'da ona mektup yazarak el-Mu'tamid'den onu geri göndermesini istedi. İki sandalyeden atla geldi, Musul ile Haditha arasında buluştu, Samarra'ya geri götürdü ve onu Ahmed bin el-Khasib'in evine yerleştirerek halifelikten kaçındı ve beş yüz rupi emanet etti. Al-Muwaffaq ona bir miktar para gönderdi ve el-Mu'tamid ile birlikte olan komutanların kaybını verdi; bu komutanlar Dhu al-Sword lakaplı {cite:History-Khulafa-minhaj-1434, s. 566-567}."
  id: "Emir al-Muwaffaq menulis kepadanya pada tahun 1969 meminta al-Mu'tamid untuk mengembalikannya. Ia menunggang dari dua kursi, menemuinya di antara Mosul dan Haditha, mengembalikannya ke Samarra, dan menempatkannya di rumah Ahmad ibn al-Khasib, mencegahnya menjadi khilafah dan mempercayakan lima ratus rupiah kepadanya. Al-Muwaffaq mengirimkan sejumlah uang kepadanya dan memberikan kerugian dari para komandan yang bersama al-Mu'tamid, yang dijuluki Dhu al-Sword {cite:History-Khulafa-minhaj-1434, hlm. 566-567}."
