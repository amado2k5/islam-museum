id: person/ali-ibn-sahl-al-tabari
class: person
label: { ar: "علي بن سهل الطبري", en: "Ali Ibn Sahl Al Tabari", es: "Ali Ibn Sahl Al Tabari", fr: "Ali Ibn Sahl Al Tabari", ur: "علی ابن سہل الطبری" }
summary:
  ar: "أبو الحسن علي بن سهل الطبري وكان يكتب للهزيار بن قارن فلما أسلم على يد المقتصم قربه وظهر بالحضرة فضله وأدخله المتوكل في جملة ندمائه وكان بموضع من الأدب، وله كتاب فردوس الحكمة جعله أنواعا سبعة والأنواع تحتوي على ثلاثين مقالة والمقالات تحتوي على ثلاثمائة وستين بابا وكتاب تحفة الملوك وكتاب كناش الحضرة وكتاب منافع الأطعمة والأشربة والمقاقير {cite:fihrist-ibn-al-nadim p. 412}."
  en: "Ali ibn Sahl al-Tabari — author of Firdaws al-Hikma, Islamised at al-Mu'tasim's hand {cite:fihrist-ibn-al-nadim}"
  es: "Ali ibn Sahl al-Tabari - autor de Firdaws al-Hikma, islamizado por mano de al-Mu'tasim {cita:fihrist-ibn-al-nadim}"
  fr: "Ali ibn Sahl al-Tabari - auteur de Firdaws al-Hikma, islamisé par al-Mu'tasim {cite: fihrist-ibn-al-nadim}"
  ur: "علی ابن سہل الطبری - فردوس الحکمہ کے مصنف، المعتصم کے ہاتھ سے اسلام بنایا گیا۔"
  tr: "Ebu el-Hasan Ali bin Sahl el-Taberi, el-Haziyar bin Qaran'a mektuplar yazardı. El-Muktasim'in elinden İslam'ı kabul ettiğinde ona yakındı ve erdemi huzurunda ortaya çıktı. El-Mutevakkil onu arkadaşları arasına dahil etti. Edebi bir konumdaydı. 'Firdavs al-Hikmah' adlı kitabı yedi türe ayırarak otuz madde içeriyordu ve üç yüz altmış bölümden oluşan makaleler ile üç yüz altmış bölümden oluşan makaleler, 'Tuhfat al-Muluk' kitabı, 'Hadra Defili' kitabı ve 'Yiyeceklerin, İçeceklerin ve İçeceklerin Faydaları' kitabı {atıf:Fihrist-ibn-al-nadim s. 412}"
  id: "Abu al-Hasan Ali ibn Sahl al-Tabari biasa menulis kepada al-Haziyar ibn Qaran. Ketika ia memeluk Islam di tangan al-Muqtasim, ia dekat dengannya dan kebajikan dirinya tampak di hadapan. Al-Mutawakkil memasukkannya di antara para sahabatnya. Ia berada dalam posisi sastra. Ia menulis buku 'Firdaws al-Hikmah,' yang ia bagi menjadi tujuh jenis, berisi tiga puluh artikel, dan artikel yang berisi tiga ratus enam puluh bab, buku 'Tuhfat al-Muluk,' buku 'The Register of the Hadra,' dan buku 'Benefits of Food, Drinks, and Drinks' {cite:fihrist-ibn-al-nadim hlm. 412}."
