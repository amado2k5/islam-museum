summary:
  ar: "أبو الحسن علي بن سهل الطبري وكان يكتب للهزيار بن قارن فلما أسلم على يد المقتصم قربه وظهر بالحضرة فضله وأدخله المتوكل في جملة ندمائه وكان بموضع من الأدب، وله كتاب فردوس الحكمة جعله أنواعا سبعة والأنواع تحتوي على ثلاثين مقالة والمقالات تحتوي على ثلاثمائة وستين بابا وكتاب تحفة الملوك وكتاب كناش الحضرة وكتاب منافع الأطعمة والأشربة والمقاقير {cite:fihrist-ibn-al-nadim p. 412}."
  en: "Ali ibn Sahl al-Tabari — author of Firdaws al-Hikma, Islamised at al-Mu'tasim's hand {cite:fihrist-ibn-al-nadim}"
