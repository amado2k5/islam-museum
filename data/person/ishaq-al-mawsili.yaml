class: person
label: { ar: "إسحاق الموصلي", en: "Ishaq al-Mawsili", es: "Ishaq al-Mawsili", fr: "Ishaq al-Mawsili", ur: "اسحاق الموسیلی" }
summary:
  ar: "إسحاق بن إبراهيم الموصلي المغني، روى أنه كان يغني الرشيد ليلة حتى نام فدخل شاب صبيح الوجه عليه مقطعات خز فأخذ العود فجسه وأصلحه وغنى ألا عللاني قبل أن نتفرقا غناء لم يسمع أجود منه وقال يا عاض بظر أمه إذا غنيت فغن هكذا ثم خرج فقال الحاجب ما دخل هنا أحد، فقال الرشيد لقد صادفت شيطاناً {cite:muruj-al-dhahab p. 347-348}. وأغراه المأمون بكلثوم العتابي فعارضه في كل باب يذكره فلما سأله عن اسمه قال اسمي كل بصل فقال العتابي ما كل بصل من الأسماء فقال وما كلثوم والبصل أطيب من الثوم {cite:muruj-al-dhahab p. 409}، وعند المسعودي له شعر في صفة السنبوسج أنشد في مائدة المستكفي يا سائلي عن أطيب الطعام سألت عنه أبصر الأنام اعمد إلى اللحم اللطيف الأحمر فدقه بالشحم غير مكثر {cite:muruj-al-dhahab p. 713}، وأخذ عنه عمرو بن بانة {cite:fihrist-ibn-al-nadim p. 448}"
  en: "The great singer whose night-session visitor — a spirit who fixed the lute and sang 'give me drink' — al-Rashid called a devil {cite:muruj-al-dhahab p. 347-348}."
  es: "El gran cantante cuyo visitante nocturno —un espíritu que arregló el laúd y cantó \"dame de beber\"— al-Rashid llamó demonio {cite:muruj-al-dhahab p. 347-348}."
  fr: "Le grand chanteur dont le visiteur de session nocturne — un esprit qui a réparé le luth et chanté « donne-moi à boire » — al-Rashid a appelé un diable {cite:muruj-al-dhahab p. 347-348}."
  ur: "وہ عظیم گلوکار جس کے رات کے سیشن میں آنے والے مہمان — ایک روح جس نے چراغ ٹھیک کیا اور 'مجھے پلاؤ' گایا — الرشید نے شیطان کہا۔ 347-348}۔"
  tr: "İshaq ibn İbrahim el-Mevsili el-Mughni, bir gece el-Reşid şarkısını söyleyip uyuyana kadar şarkı söylediğini anlatmıştır. Açık yüzlü genç bir adam saç tutamlarıyla içeri girdi, udayı aldı, oynattı ve ayrılmadan önce 'Ala alani' şarkısını söyledi, kendisinden daha iyi olmayan bir şarkı söyledi. Dedi ki, 'Ey şarkı söylerken annesinin klitorisini ısıran.' Böyle söyledi, sonra çıktı. Gözcü dedi ki, 'Buraya kimse girmedi.' El-Reşid, 'Bir şeytanla karşılaştım.' {atıf:Muruj-al-Dhahab s. 347-348}. Al-Ma'mun onu Kulthum al-Atabi ile ayarttı ve her bölümde ona karşı çıktı. Adını sorduğunda, 'Benim adım her soğandır.' dedi. Al-Atabi, 'Her soğanın tüm isimleri nedir?' diye cevap verdi. 'Kultum ve soğan sarımsaktan daha iyidir.' dedi. (atıf:muruj-al-dhahab, s. 409}. Al-Mas'udi'nin sanbusajın tanımıyla ilgili bir şiiri vardır, Mustakafi sofrasında okumuştur: 'Ey soran kişim, en iyi yemek hakkında.' Ben de sordum: 'İnsanların en görünür olanı ince kırmızı ete dönüp onu yağla öğütür.' 'Amr bin Bannah' da ondan aldı."
  id: "Ishaq ibn Ibrahim al-Mawsili al-Mughni menceritakan bahwa suatu malam ia menyanyikan al-Rashid sampai tertidur. Seorang pemuda berwajah cerah masuk mengenakan rambut yang diikat, mengambil lute, mengutak-atiknya, dan menyanyikan 'Ala alani' sebelum kami berpisah, menyanyikan yang tidak lebih baik darinya. Ia berkata, 'Wahai orang yang menggigit klitoris ibunya saat kau bernyanyi.' Ia bernyanyi seperti itu, lalu keluar. Penjaga mata berkata, 'Tidak ada yang masuk ke sini.' Al-Rashid berkata, 'Aku telah bertemu dengan iblis.' {cite:muruj-al-dhahab hlm. 347-348}. Al-Ma'mun menggoda dia dengan Kulthum al-Atabi dan menentangnya di setiap bab yang menyebutnya. Ketika dia bertanya tentang namanya, dia berkata, 'Namaku adalah setiap bawang.' Al-Atabi menjawab, 'Apa nama setiap bawang?' Dia berkata, 'Dan Kulthum dan bawang lebih baik daripada bawang putih.' {cite:muruj-al-dhahab, hlm. 409}. Al-Mas'udi memiliki sebuah puisi tentang deskripsi sanbusaj, yang dibacakan di meja Mustakafi: 'Wahai penanyaku, tentang makanan terbaik.' Saya bertanya tentangnya: 'Orang yang paling terlihat dari mereka, beralihlah ke daging merah halus dan giling dengan lemak tanpa berlebihan.' 'Amr ibn Bannah' juga mengambilnya darinya."
