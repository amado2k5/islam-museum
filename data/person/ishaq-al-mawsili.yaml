label: { ar: "إسحاق الموصلي", en: "Ishaq al-Mawsili" }
summary:
  ar: "إسحاق بن إبراهيم الموصلي المغني، روى أنه كان يغني الرشيد ليلة حتى نام فدخل شاب صبيح الوجه عليه مقطعات خز فأخذ العود فجسه وأصلحه وغنى ألا عللاني قبل أن نتفرقا غناء لم يسمع أجود منه وقال يا عاض بظر أمه إذا غنيت فغن هكذا ثم خرج فقال الحاجب ما دخل هنا أحد، فقال الرشيد لقد صادفت شيطاناً {cite:muruj-al-dhahab p. 347-348}.، وأغراه المأمون بكلثوم العتابي فعارضه في كل باب يذكره فلما سأله عن اسمه قال اسمي كل بصل فقال العتابي ما كل بصل من الأسماء فقال وما كلثوم والبصل أطيب من الثوم {cite:muruj-al-dhahab p. 409}، وعند المسعودي له شعر في صفة السنبوسج أنشد في مائدة المستكفي يا سائلي عن أطيب الطعام سألت عنه أبصر الأنام اعمد إلى اللحم اللطيف الأحمر فدقه بالشحم غير مكثر {cite:muruj-al-dhahab p. 713}، وأخذ عنه عمرو بن بانة {cite:fihrist-ibn-al-nadim p. 448}"
  en: "The great singer whose night-session visitor — a spirit who fixed the lute and sang 'give me drink' — al-Rashid called a devil {cite:muruj-al-dhahab p. 347-348}."
