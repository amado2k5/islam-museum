summary:
  ar: "مفتٍ وباحث هندي مقيم في مومباي، درس في جامعة الأزهر بالقاهرة، وأسس جامعة رياض الجنة ووقف الأمين التعليمي الخيري ودار الأمان، وارتبط اسمه بمؤسسة الأمين. اعتُقل سنة 2024 في قضايا خطب في غوجارات، ثم ألغت المحكمة العليا الهندية احتجازه الوقائي وأمرت بالإفراج عنه. بلغت قناته الرسمية على يوتيوب نحو 812 ألف مشترك في نوفمبر 2026."
  en: "Indian mufti and research scholar based in Mumbai who studied at Al-Azhar University in Cairo and founded Jamia Riazul Jannah, the Al-Aman Education and Welfare Trust and Darul Aman; he is also associated with the Al-Amaan Foundation. He was arrested in 2024 in Gujarat speech cases, and the Supreme Court of India later quashed his preventive detention and directed his release. His official YouTube channel counted some 812,000 subscribers in November 2026."
  ur: "ممبئی میں مقیم ہندوستانی مفتی اور محقق، جنہوں نے قاہرہ کی جامعہ ازہر میں تعلیم حاصل کی اور جامعہ ریاض الجنہ، الأمين ایجوکیشن اینڈ ویلفیئر ٹرسٹ اور دار الأمان قائم کیے۔ 2024 میں گجرات کی تقریر کے مقدمات میں گرفتار ہوئے، بعد ازاں سپریم کورٹ نے ان کی احتیاطی نظربندی کالعدم قرار دے کر رہائی کا حکم دیا۔ نومبر 2026 میں ان کے سرکاری یوٹیوب چینل کے تقریباً 812 ہزار سبسکرائبر تھے۔"
