summary:
  ar: "مهندس وسياسي ودبلوماسي أذربيجاني (1878–1921)، من أحفاد مؤسس خانية قره باغ، وزير داخلية جمهورية أذربيجان الديمقراطية (1918) ونائب وزير تجارتها وصناعتها، عمل مهندسًا في صناعة النفط ثم ممثلًا سوفيتيًا في برلين والقسطنطينية، حيث اغتاله مسلح أرمني سنة 1921 ضمن «عملية نمسيس»."
  en: "Azerbaijani engineer, politician and diplomat (1878–1921), a descendant of the founder of the Karabakh Khanate; Minister of Internal Affairs of the Azerbaijan Democratic Republic (1918) and deputy minister of trade and industry. He worked as an oil engineer, then represented the Soviet government in Berlin and Constantinople, where an Armenian gunman assassinated him in 1921 in Operation Nemesis."
  ur: "آذربائیجانی انجینئر، سیاست دان اور سفارت کار (1878–1921)، خاناتِ قاراباغ کے بانی کی نسل سے؛ آذربائیجان جمہوری جمہوریہ کے وزیرِ داخلہ (1918) اور تجارت و صنعت کے نائب وزیر۔ انہوں نے تیل کی صنعت میں انجینئر کے طور پر کام کیا، پھر برلن اور قسطنطنیہ میں سوویت حکومت کی نمائندگی کی، جہاں 1921 میں «آپریشن نیمیسس» کے تحت ایک آرمینیائی حملہ آور نے انہیں قتل کر دیا۔"
