gender: male
roles: [emir]
summary:
  ar: "عيّنه عمر بن عبد العزيز والياً على الأندلس مكان الحر بن عبد الرحمن الثقفي، وذكر الكتاب أن ذلك كان بين سنتي 100هـ و102هـ، بعد أن عزل عمر الحر وهو مشغول بقمع المقاومة في الشمال الغربي {cite:salabi-umayyad-state-2020 p.84}. ويذكر الكتاب أن عمر ولاه الأندلس وعهد إليه بإخلائها من جند الإسلام خشية تغلب العدو عليهم، فلم يقبل السمح ذلك وكتب إلى الخليفة أن الناس قد كثروا بها وانتشروا في أقطارها، فأمره عمر أن يضرب عن ذلك. {cite:salabi-umayyad-state-2020 p.332-333} ويذكر الكتاب أنه قدم الأندلس سنة 100هـ، ففعل ما أمره به عمر من تمييز أرضها وأخذ الخمس مما فُتح عنوة، ثم استشهد غازياً بأرض الفرنجة. {cite:salabi-umayyad-state-2020 p.388} ويذكر الكتاب أنه بدأ حملته على بلاد الغال من برشلونة في بداية عهد يزيد بن عبد الملك، فبلغ أربونة وسبتمانيا، ثم قصد طولوشة فحاصرها، فجاء أودو دوق أكيتانية لإنقاذها، فدارت معركة عنيفة استشهد فيها السمح سنة 101هـ، فتولى عبد الرحمن الغافقي قيادة الجيش وانسحب به. {cite:salabi-umayyad-state-2020 p.289-300}"
  tr: "Ömer bin Abdülaziz, onu el-Hurr bin Abdurrahman el-Teqafi'nin yerine Endülüs valisi olarak atadı. Kitapta bunun 100 Hicri ile 102 Hicri yılları arasında, Ömer el-Hurr'un kuzeybatıda direnişi bastırmakla meşgulken görevden alınmasının ardından gerçekleştiği belirtilir {alıntı: Selabi-Emevyad-Devleti-2020 s.84}. Kitapta, Ömer onu Endülüs valisi olarak atadığı ve düşmanın yenilmesinden korktuğu için İslami askerleri temizlemesini ona emanet ettiği belirtilir. Buna izin vermedi ve halifeye halkın bölgelerine yayıldığını yazdı, bu yüzden Ömer ona oradan saldırı yapmasını emretti. {cite:Selabi-Umayyad-Devlet-2020 s.332-333} Kitapta, Ömer'in 100 Hicri'de Endülüs'e geldiği, Ömer'in emrini yerine getirerek topraklarını ayırttığı, fethedilen toprakların beşte birini zorla aldığı ve ardından Frank topraklarında fatih olarak şehit edildiği belirtilir. {cite:salabi-umayyad-state-2020 s.388} Kitapta, Yazid ibn Abd al-Malik'in saltanatının başında Barselona'dan Galya'ya karşı seferine başladığı, Arbona ve Septimania'ya ulaştığı, ardından Toulouse'a giderek kuşattığı belirtilir. Aquitaine Dükü Odo, orduyu kurtarmaya geldi ve Al-Samh'ın 101 Hicri'de şehit olduğu şiddetli bir savaşa liderlik etti. Abd al-Rahman al-Ghafiqi ordunun komutasını aldı ve onunla birlikte geri çekildi. {cite:salabi-umayyad-state-2020 s.289-300}"
  id: "Umar ibn Abd al-Aziz mengangkatnya sebagai gubernur al-Andalus, menggantikan al-Hurr ibn Abd al-Rahman al-Thaqafi. Buku tersebut menyebutkan bahwa hal ini terjadi antara tahun 100 H dan 102 H, setelah Umar al-Hurr diberhentikan saat ia sibuk menekan perlawanan di barat laut {cite:Salabi-Umayyad-State-2020 hlm.84}. Buku tersebut menyebutkan bahwa Umar mengangkatnya sebagai gubernur al-Andalus dan mempercayakan dia untuk membersihkan wilayah itu dari tentara Islam karena takut musuh akan mengalahkan. Dia menolak hal ini dan menulis kepada khalifah bahwa rakyat telah bertambah dan menyebar ke seluruh wilayahnya, sehingga Umar memerintahkannya untuk menyerang dari sana. {cite:salabi-umayyad-state-2020 hlm.332-333} Buku tersebut menyebutkan bahwa dia tiba di al-Andalus pada tahun 100 H, melakukan apa yang diperintahkan Umar untuk membedakan wilayahnya, dengan paksa mengambil seperlima dari wilayah yang ditaklukkan, dan kemudian menjadi martir sebagai penakluk di wilayah Franka. {cite:salabi-umayyad-state-2020 hlm.388} Buku tersebut menyebutkan bahwa ia memulai kampanyenya melawan Galia dari Barcelona pada awal pemerintahan Yazid ibn Abd al-Malik, mencapai Arbona dan Septimania, lalu menuju Toulouse dan mengepungnya. Odo, Adipati Aquitaine, datang untuk menyelamatkannya, memimpin pertempuran sengit di mana Al-Samh menjadi martir pada tahun 101 H. Abd al-Rahman al-Ghafiqi mengambil alih komando pasukan dan mundur bersamanya. {cite:salabi-umayyad-state-2020 hlm.289-300}"
