gender: male
roles: [emir]
summary:
  ar: "عيّنه عمر بن عبد العزيز والياً على الأندلس مكان الحر بن عبد الرحمن الثقفي، وذكر الكتاب أن ذلك كان بين سنتي 100هـ و102هـ، بعد أن عزل عمر الحر وهو مشغول بقمع المقاومة في الشمال الغربي {cite:salabi-umayyad-state-2020 p.84}. ويذكر الكتاب أن عمر ولاه الأندلس وعهد إليه بإخلائها من جند الإسلام خشية تغلب العدو عليهم، فلم يقبل السمح ذلك وكتب إلى الخليفة أن الناس قد كثروا بها وانتشروا في أقطارها، فأمره عمر أن يضرب عن ذلك. {cite:salabi-umayyad-state-2020 p.332-333} ويذكر الكتاب أنه قدم الأندلس سنة 100هـ، ففعل ما أمره به عمر من تمييز أرضها وأخذ الخمس مما فُتح عنوة، ثم استشهد غازياً بأرض الفرنجة. {cite:salabi-umayyad-state-2020 p.388} ويذكر الكتاب أنه بدأ حملته على بلاد الغال من برشلونة في بداية عهد يزيد بن عبد الملك، فبلغ أربونة وسبتمانيا، ثم قصد طولوشة فحاصرها، فجاء أودو دوق أكيتانية لإنقاذها، فدارت معركة عنيفة استشهد فيها السمح سنة 101هـ، فتولى عبد الرحمن الغافقي قيادة الجيش وانسحب به. {cite:salabi-umayyad-state-2020 p.289-300}"
