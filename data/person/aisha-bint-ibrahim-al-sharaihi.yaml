summary:
  ar: "محدثة دمشقية (نحو 760–842هـ) تعرف بابنة الشرائحي، سمعت الكثير بدمشق والقاهرة وبعلبك، وحدّثت فقرأ عليها ابن ناصر الدين وغيره منتقى الذهبي والمسلسل بالأولية وأجزاء من الأحاديث المختارة وجامع الترمذي؛ دفنت بمقبرة باب توما."
  en: "A Damascene hadith transmitter (c. 760–842 AH) known as Ibnat al-Shara'ihi, who heard widely in Damascus, Cairo and Baalbek and taught Ibn Nasir al-Din and others such texts as al-Dhahabi's selection, the 'chain of firsts' hadith, parts of al-Mukhtara and of al-Tirmidhi's Jami'; she was buried at the Bab Tuma cemetery."
  ur: "دمشق کی ایک محدثہ (تقریباً 760–842ھ) جو ابنۃ الشرائحی کہلاتیں؛ انہوں نے دمشق، قاہرہ اور بعلبک میں بہت سنا اور ابن ناصر الدین وغیرہ کو ذہبی کا منتقیٰ، مسلسل بالاولیہ، المختارہ کے اجزا اور جامع ترمذی کا حصہ پڑھایا؛ باب توما کے قبرستان میں دفن ہوئیں۔"
