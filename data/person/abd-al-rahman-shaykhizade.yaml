  en: "Abd al-Rahman Shaykhizade"
  fr: "Abd al-Rahman Shaykhizade"
  es: "Abd al-Rahman Shaykhizade"
  ur: "عبدالرحمن شیخ زادے"
roles: [scholar, jurist]
gender: male
summary:
  ar: "عبد الرحمن بن محمد بن سليمان المعروف بشيخي زاده ويقال له الداماد، فقيه حنفي من أهل كليبولي من قضاة الجيش، توفي سنة 1078 هـ، صاحب «مجمع الأنهر في شرح ملتقى الأبحر»."
  en: "Abd al-Rahman ibn Muhammad ibn Sulayman, known as Shaykhizade and also called al-Damad, a Hanafi jurist from Gallipoli (Kelibolu), one of the army judges, who died in 1078 AH; author of 'Majma' al-Anhur fi Sharh Multaqa al-Abhur'."
  fr: "Abd al-Rahman ibn Muhammad ibn Sulayman, connu sous le nom de Shaykhizade et appelé aussi al-Damad, juriste hanafite de Gallipoli (Gelibolu), l'un des cadis de l'armée, mort en 1078 H ; auteur du « Majma' al-Anhur fi Sharh Multaqa al-Abhur »."
  es: "Abd al-Rahman ibn Muhammad ibn Sulayman, conocido como Shaykhizade y también llamado al-Damad, un jurista hanafi de Gallipoli (Kelibolu), uno de los jueces del ejército, que murió en 1078 AH; autor de 'Majma' al-Anhur fi Sharh Multaqa al-Abhur'."
  ur: "عبدالرحمٰن بن محمد بن سلیمان، شیخ زادے کے نام سے جانا جاتا ہے اور الدماد بھی کہلاتا ہے، گیلیپولی ⁦(کیلیبولو)⁩ سے تعلق رکھنے والے حنفی فقیہ، فوجی ججوں میں سے ایک، جن کا انتقال 1078 ہجری میں ہوا؛ مجمع الانہور فی شرح ملتقۃ الابور کے مصنف۔"
  tr: "Abdülrahman ibn Muhammed ibn Süleyman, Şeyhi Zadeh ve el-Damad olarak da bilinen, Kaleboli halkından bir Hanefi hukukçusu ve ordu kadılarından biriydi. Hicri 1078 yılında vefat etti. “Majma’ al-Anhar fi Sharh Multaqa al-Abhur” adlı eserin yazarıdır."
  id: "Abd al-Rahman ibn Muhammad ibn Sulayman, yang dikenal sebagai Shaykhi Zadeh dan disebut al-Damad, adalah seorang ahli hukum Hanafi dari kaum Kaleboli, salah satu hakim militer. Beliau wafat pada tahun 1078 H. Beliau adalah penulis kitab “Majma’ al-Anhar fi Sharh Multaqa al-Abhur”."
