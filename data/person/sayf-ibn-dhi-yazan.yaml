summary:
  en: "The Himyarite noble who led Yemen’s liberation from Abyssinian rule with Persian help in 575 CE and was made king; his assassination by his own Abyssinian bodyguard ended the royal house of Dhu Yazan and opened direct Persian rule."
  ar: "النبيل الحميري الذي قاد تحرير اليمن من الأحباش باستنجاد الفرس سنة 575م واتُّخذ ملكاً؛ اغتاله من استبقاه من الحبشة في ركابه، فانقطع بموته الملك عن بيت ذي يزن وصار اليمن ولاية فارسية."
  es: "El noble himyarita que lideró la liberación de Yemen del dominio abisinio con ayuda persa en el año 575 d.C. y fue proclamado rey; su asesinato a manos de su propio guardaespaldas abisinio puso fin a la casa real de Dhu Yazan y abrió el paso al dominio persa directo."
  fr: "Le noble himyarite qui mena la libération du Yémen du joug abyssin avec l'aide des Perses en 575 après J.-C. et fut nommé roi; son assassinat par son propre garde du corps abyssin mit fin à la maison royale de Dhu Yazan et ouvrit la voie à un pouvoir perse direct."
