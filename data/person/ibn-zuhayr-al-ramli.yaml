summary:
  ar: "شمس الدين أحمد ابن زهير الرملي ثم الدمشقي الشافعي، ولد بالرملة في ربيع الأول سنة أربع وخمسين وثمانمائة وتحول إلى دمشق وحفظ المنهاج وألفية النحو والحديث والشاطبيتين والدرة في القراءات الثلاث وسمع على الجمال عبد الله بن جماعة خطيب الأقصى المسلسل بالأولية، وناب في الحكم بدمشق فحسنت سيرته وولي مشيخة الإقراء بجامع بني أمية وبدار الحديث الأشرفية وبتربة الأشرفية وتربة أم الصالح بعد البقاعي، وانتهت إليه مشيخة الإقراء بدمشق؛ توفي يوم السبت عاشر ذي الحجة ودُفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 520}."
  en: "Damascus's last shaykh al-iqra' — b. Ramla Rabi' I 854, memorized the Minhaj, the Alfiyya, both Shatibiyyas and the Durra, heard the last primordial-linked Aqsa khatib Ibn Jama'a, and ended with the iqra' mashyakha of the Umayyad mosque and both Ashrafiyya institutions; d. Saturday 10 Dhu'l-Hijja [923], buried at Bab al-Saghir {cite:shadharat-dhahab p. 520}."
  es: "El último shaykh al-iqra' de Damasco — b. Ramla Rabi' I 854, memorizó el Minhaj, el Alfiyya, tanto Shatibiyyas como Durra, escuchó el último Aqsa khatib Ibn Jama'a vinculado primordialmente y terminó con el iqra' mashyakha de la mezquita omeya y ambas instituciones Ashrafiyya; d. Sábado 10 Dhu'l-Hijja [923], enterrado en Bab al-Saghir {cita:shadharat-dhahab p. 520}."
  fr: "Le dernier shaykh al-iqra de Damas — b. Ramla Rabi' I 854, a mémorisé le Minhaj, l'Alfiyya, les Shatibiyyas et le Durra, a entendu le dernier Aqsa khatib Ibn Jama'a lié au primordial, et a terminé avec l'iqra' mashyakha de la mosquée des Omeyyades et des deux institutions d'Achrafiyya; d. Samedi 10 Dhu'l-Hijja [923], inhumé à Bab al-Saghir {cite:shadharat-dhahab p. 520}."
  ur: "دمشق کے آخری شیخ الاقرا - بی۔ رملہ ربیع اول 854، منہاج، الفیہ، دونوں شاطبیہ اور دُرّہ کو حفظ کیا، اقصیٰ سے منسلک آخری خطیب ابن جماعہ کو سنا، اور اموی مسجد اور اشرفیہ کے دونوں اداروں کے اقراء مشائخ پر ختم ہوا۔ d ہفتہ 10 ذی الحجہ [923]، باب الصغیر میں مدفون 520}۔"
  tr: "Şemseddin Ahmed bin Zuhayr al-Ramli, o zamanlar el-Dimashqi el-Şafii, 854 Hicri yılında Rabi'al-Awwal'da Ramla'da doğdu. Şam'a taşındı ve üç okumada Minhaj, Alfiyyah al-Nahj, al-Hadis, al-Şatibiyyat ve el-Durra'yı ezberledi. Ayrıca el-Aksa el-Aksa'nın vaizi el-Cemal Abdullah ibn Cemaah'ın şiirlerini de inceledi -Musalriya, el-Evliyye. Şam'da ilavetin şefi olarak atandı ve bu da itibarını artırdı. Emevi Camii, Eşrefiyye Hadis Evi, Eşrefiyye toprağı ve Beqai bölgesinden sonra ümme'l-Salih topraklarında navap şefi olarak atandı. Ayrıca Şam'daki kılamenin liderliğini de üstlendi. Cumartesi günü, Zuli Hicce'nin onuncusunda vefat etti ve Bab al-Saghir mezarlığına defnedildi {alıntı:Shadharat-Dhahab, s. 520}."
  id: "Shams al-Din Ahmad ibn Zuhayr al-Ramli, yang saat itu al-Dimashqi al-Shafi'i, lahir di Ramla di Rabi' al-Awwal pada tahun 854 H. Ia pindah ke Damaskus dan menghafal Minhaj, Alfiyyah al-Nahj, al-Hadith, al-Shatibiyyat, dan al-Durra dalam tiga bacaan tersebut. Ia juga mempelajari puisi al-Jamal Abdullah ibn Jama'ah, pengkhotbah al-Aqsa -Musalriya, al-Awliyya. Ia diangkat sebagai kepala pembacaan di Damaskus, yang meningkatkan reputasinya. Ia diangkat sebagai kepala pembacaan di Masjid Umayyah, Rumah Hadis Ashrafiyyah, tanah Ashrafiyyah, dan tanah um al-Salih setelah wilayah Beqa'i. Ia juga memimpin pembacaan di Damaskus. Ia meninggal pada hari Sabtu, tanggal sepuluh Dhu al-Hijjah, dan dimakamkan di pemakaman Bab al-Saghir {cite:Shadharat-Dhahab, hlm. 520}."
