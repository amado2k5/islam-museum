summary:
  ar: "شمس الدين أحمد ابن زهير الرملي ثم الدمشقي الشافعي، ولد بالرملة في ربيع الأول سنة أربع وخمسين وثمانمائة وتحول إلى دمشق وحفظ المنهاج وألفية النحو والحديث والشاطبيتين والدرة في القراءات الثلاث وسمع على الجمال عبد الله بن جماعة خطيب الأقصى المسلسل بالأولية، وناب في الحكم بدمشق فحسنت سيرته وولي مشيخة الإقراء بجامع بني أمية وبدار الحديث الأشرفية وبتربة الأشرفية وتربة أم الصالح بعد البقاعي، وانتهت إليه مشيخة الإقراء بدمشق؛ توفي يوم السبت عاشر ذي الحجة ودُفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 520}."
  en: "Damascus's last shaykh al-iqra' — b. Ramla Rabi' I 854, memorized the Minhaj, the Alfiyya, both Shatibiyyas and the Durra, heard the last primordial-linked Aqsa khatib Ibn Jama'a, and ended with the iqra' mashyakha of the Umayyad mosque and both Ashrafiyya institutions; d. Saturday 10 Dhu'l-Hijja [923], buried at Bab al-Saghir {cite:shadharat-dhahab p. 520}."
