summary:
  ar: "مدرب كرة قدم مصري ومهاجم سابق، وُلد في القاهرة سنة 1983 ويُعرف عالميًا باسم «ميدو». بدأ مع الزمالك، وفاز بجائزة الحذاء الأبنوسي مع غينت البلجيكي، ثم تنقل بين أندية أوروبية عديدة منها أياكس ومرسيليا وروما وتوتنهام هوتسبير وميدلزبره، وخاض مع منتخب مصر 51 مباراة دولية سجل فيها 19 هدفًا وفاز معه بكأس الأمم الأفريقية 2006. اعتزل سنة 2013 واتجه إلى التدريب فتولى الزمالك والإسماعيلي ووادي دجلة والوحدة السعودي ومصر المقاصة، إلى جانب عمله التلفزيوني."
  en: "Egyptian football manager and former striker, born in Cairo in 1983 and known universally as Mido. A Zamalek youth product, he won the Belgian Ebony Shoe with Gent, then played for Ajax, Marseille, Roma, Tottenham Hotspur and Middlesbrough among many clubs in a much-travelled career; he won 51 caps and scored 19 goals for Egypt, winning the 2006 Africa Cup of Nations. After retiring at Barnsley in 2013 he became a coach, managing Zamalek, Ismaily, Wadi Degla, Saudi club Al Wehda and Misr Lel Makkasa, alongside television work."
  ur: "مصری فٹبال مینیجر اور سابق اسٹرائیکر، 1983 میں قاہرہ میں پیدا ہوئے اور عالمی طور پر «میڈو» کے نام سے جانے جاتے ہیں۔ زمالک کی یوتھ ٹیم سے نکلے، جینٹ کے ساتھ بیلجیئم کا ایبونی شو ایوارڈ جیتا، پھر ایاکس، مارسی، روما، ٹوٹنہم ہاٹسپر اور مڈلز برا سمیت کئی کلبوں میں کھیلے؛ مصر کے لیے 51 میچوں میں 19 گول کیے اور 2006 کا افریقہ کپ آف نیشنز جیتا۔ 2013 میں بارنزلے سے ریٹائر ہونے کے بعد کوچ بنے اور زمالک، اسماعیلی، وادی دجلہ، سعودی کلب الوحدہ اور مصر المقاصہ کی تربیت کی، ساتھ ہی ٹیلی ویژن پر بھی کام کیا۔"
