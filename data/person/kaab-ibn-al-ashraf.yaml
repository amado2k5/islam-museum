  en: "Ka'b ibn al-Ashraf"
  ur: "کعب بن اشرف"
summary:
  ar: "كعب بن الأشرف في السيرة شاعر يهودي من بني النضير أباه أشرف من طيء وأمه من النضير: كان يهجو النبي ويحرض عليه في مكة بعد بدر حتى أذن النبي في قتله فقتله محمد بن مسلمة وإخوته في بيته ليلاً كما في البخاري والسيرة {cite:ibn-hisham-sira} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  en: "Ka'b ibn al-Ashraf in the Sira is a Jewish poet — his father al-Ashraf of Tayy and his mother of Banu al-Nadir: he lampooned the Prophet and stirred Makka against him after Badr, until the Prophet permitted his death and Muhammad ibn Maslama and his companions killed him in his house at night, as al-Bukhari and the Sira record {cite:ibn-hisham-sira} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  ur: "کعب بن اشرف سیرت میں ایک یہودی شاعر ہے — اس کے والد اشرف طیء سے اور ماں بنو نضیر سے تھی: بدر کے بعد وہ نبی کے خلاف ہجو لکھتا اور مکہ کو بھڑکاتا تھا، یہاں تک کہ نبی نے اس کی سزا کی اجازت دی اور محمد بن مسلمہ نے رات کو اس کے گھر میں قتل کیا جیسا کہ بخاری اور سیرت میں ہے۔"
