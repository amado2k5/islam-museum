kids:
  ar: "صرغتمش كان أميراً قوياً في مصر، وبنى مدرسة في القاهرة، ثم سجنه السلطان حسن."
  en: "Sarghitmish was a powerful emir in Egypt who built a school in Cairo before the sultan locked him up."
