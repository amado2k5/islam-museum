summary:
  ar: "الأمير سيف الدين صرغتمش الناصري مملوك الناصر محمد بن قلاوون الذي صار من كبار مدبري الدولة بعد وفاة السلطان، وشارك شيخو وطاز في حكم مصر، وكان من صانعي عودة الناصر حسن سنة 755هـ. انفرد بالتدبير بعد موت شيخو سنة 758هـ، ثم قبض عليه حسن في رمضان سنة 759هـ وسجنه بالإسكندرية حيث مات. هو صاحب المدرسة الصرغتمشية بالقاهرة وكان يميل إلى الحنفية ويقرّب العلماء {cite:durar-kamina-jil-1993 2/206-207} {cite:nujum-zahira 10/328}."
  en: "Amir Sayf al-Din Sarghitmish al-Nasiri was a mamluk of al-Nasir Muhammad ibn Qalawun who became one of the chief managers of the state after the sultan's death. He shared power with Shaykhu and Taz and helped bring al-Nasir Hasan back in 755. He ruled alone after Shaykhu's death in 758, was arrested by Hasan in Ramadan 759 and died in prison in Alexandria. He founded the Sarghitmishiyya madrasa in Cairo, favoured the Hanafi school and kept company with scholars {cite:durar-kamina-jil-1993 2/206-207} {cite:nujum-zahira 10/328}."
  ur: "امیر سیف الدین صرغتمش الناصری الناصر محمد بن قلاوون کے مملوک تھے جو سلطان کی وفات کے بعد ریاست کے بڑے مدبروں میں شامل ہوئے۔ انہوں نے شیخو اور طاز کے ساتھ اقتدار بانٹا اور 755ھ میں الناصر حسن کی واپسی میں حصہ لیا۔ 758ھ میں شیخو کی وفات کے بعد وہ تنہا مدبر رہے، رمضان 759ھ میں حسن نے انہیں گرفتار کر کے اسکندریہ کے قید خانے میں ڈال دیا جہاں وہ فوت ہوئے۔ قاہرہ کا مدرسہ صرغتمشیہ انہی کا ہے، وہ حنفی مذہب کی طرف مائل تھے اور علماء کی صحبت رکھتے تھے {cite:durar-kamina-jil-1993 2/206-207} {cite:nujum-zahira 10/328}."
