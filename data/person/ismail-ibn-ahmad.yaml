id: person/ismail-ibn-ahmad
class: person
label: { ar: "إسماعيل بن أحمد الساماني" }
summary:
  ar: "أسر عمرو بن الليث في سنة سبع وثمانين ومائتين، وذكر الطبري أن المعتضد مدحه في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي صار إليه الأمر بعد وفاة أخيه نصر بن أحمد سنة تسع وثمانين ومائتين، وأهدى له المعتضد مع عبد الله بن الفتح وأشناس مائة بدنة ديباج منسوجة بالذهب مرصعة بالجوهر ومنطقة ذهب وثلثمائة ألف دينار ليفرقها في أصحابه ويبعثهم إلى سجستان لحرب طاهر بن محمد بن عمرو بن الليث، وأمر ابن الفتح أن يحمل من خراج بلاد الجبل عشرة آلاف ألف درهم {cite:muruj-al-dhahab p. 628-632}، وعند ابن الجوزي وفي سنة 280هـ غزا بلاد الترك وقتل خلقاً كثيراً وافتتح مدينة ملكهم وأسر الملك وخاتون ونحو عشرة آلاف وأصاب كل فارس من المسلمين ألف درهم {cite:muntazam-ibn-al-jawzi p. 146}"
  tr: "287 Hicri yılında Amr ibn al-Layth tarafından yakalandı ve el-Taberi, el-Mu'tadid'in onu övdüğünü belirtmiştir {cite:tabari-tarikh-abu-al-fadl j.10 s.76} {cite:tabari-tarikh-abu-al-fadl j.10 s.77}. El-Mes'udi, kardeşi Nasr bin Ahmed'in 289 Hicri yılında ölümünden sonra işi devraldı. El-Mu'tadid ona, Abdullah ibn al-Fath ve Ashnas'a birlikte altın ve mücevherle dokunmuş yüz brokar giysi, bir altın bölge ve üç yüz bin dinar hediye etti; bunları yoldaşlarına dağıtıp Sijistan'a göndererek Tahir ibn Muhammed bin Amr ibn al-Layth'a karşı savaşmak üzere gönderdi. İbn al-Fath, dağlık toprakların vergilerinden on bin dirhem toplamasını emretti {alıntı: Muruj-al-Dhahab s. 628-632}. İbn al-Jawzi'ye göre, 280 Hicri yılında Türklerin topraklarına saldırmış, birçok kişiyi öldürmüş, şehirlerini fethetmiş, kralı ve Hatun'u ve yaklaşık on bin kişiyi ele geçirmiş ve her Müslüman şövalyeye bin dirhem verilmiştir {atıf:Muntazam-ibn-al-Jawzi s. 146}"
  id: "Ia ditangkap oleh Amr ibn al-Layth pada tahun 287 H, dan al-Tabari menyebutkan bahwa al-Mu'tadid memujinya karena hal itu {cite:tabari-tarikh-abu-al-fadl j.10 hlm.76} {cite:tabari-tarikh-abu-al-fadl j.10 hlm.77}. Al-Mas'udi mengambil alih urusan ini setelah kematian saudaranya Nasr ibn Ahmad pada tahun 289 H. Al-Mu'tadid memberinya, bersama Abdullah ibn al-Fath dan Ashnas, seratus pakaian brokat yang ditenun dengan emas dan permata, zona emas, dan tiga ratus ribu dinar untuk dibagikan kepada para sahabatnya dan dikirim ke Sijistan untuk melawan Tahir ibn Muhammad ibn Amr ibn al-Layth. Ibn al-Fath memerintahkan agar ia mengumpulkan sepuluh ribu dirham dari pajak tanah pegunungan {cite:muruj-al-dhahab hlm. 628-632}. Menurut Ibn al-Jawzi, pada tahun 280 H, ia menyerbu tanah Turki, membunuh banyak orang, menaklukkan kota mereka, menangkap raja dan Khatun, dan sekitar sepuluh ribu, dan setiap ksatria Muslim dianugerahi seribu dirham {cite:muntazam-ibn-al-jawzi hlm. 146}"
