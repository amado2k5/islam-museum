label: { ar: "إسماعيل بن أحمد الساماني" }
summary:
  ar: "أسر عمرو بن الليث في سنة سبع وثمانين ومائتين، وذكر الطبري أن المعتضد مدحه في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي صار إليه الأمر بعد وفاة أخيه نصر بن أحمد سنة تسع وثمانين ومائتين، وأهدى له المعتضد مع عبد الله بن الفتح وأشناس مائة بدنة ديباج منسوجة بالذهب مرصعة بالجوهر ومنطقة ذهب وثلثمائة ألف دينار ليفرقها في أصحابه ويبعثهم إلى سجستان لحرب طاهر بن محمد بن عمرو بن الليث، وأمر ابن الفتح أن يحمل من خراج بلاد الجبل عشرة آلاف ألف درهم {cite:muruj-al-dhahab p. 628-632}، وعند ابن الجوزي وفي سنة 280هـ غزا بلاد الترك وقتل خلقاً كثيراً وافتتح مدينة ملكهم وأسر الملك وخاتون ونحو عشرة آلاف وأصاب كل فارس من المسلمين ألف درهم {cite:muntazam-ibn-al-jawzi p. 146}"
