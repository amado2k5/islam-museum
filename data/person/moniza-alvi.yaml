summary:
  ar: "مونيزا ألفي (وُلدت سنة 1954) شاعرة باكستانية بريطانية، وُلدت في لاهور لأب باكستاني وأم بريطانية، وانتقلت رضيعة إلى هاتفيلد في إنجلترا. عملت مدرّسة في المدارس الثانوية سنوات، ونالت جائزة «بوتري بزنس» سنة 1991 عن قصيدتها «هدايا من خالاتي في باكستان»، ورُشحت مجموعتها «البلد على كتفي» (1993) لجائزة ت. س. إليوت، كما رُشحت «أوروبا» (2008) و«في زمن التقسيم» (2013)، ونالت جائزة تشولموندلي (2002) وانتُخبت زميلة في الجمعية الملكية للأدب (2023)."
  en: "Moniza Alvi (born 1954) is a Pakistani-British poet, born in Lahore to a Pakistani father and a British mother and brought to Hatfield, England, as an infant. She worked for years as a high-school teacher, won the Poetry Business Prize in 1991 for 'Presents from My Aunts in Pakistan', and saw The Country at My Shoulder (1993), Europa (2008) and At the Time of Partition (2013) all shortlisted for the T. S. Eliot Prize; she received a Cholmondeley Award in 2002 and was elected a Fellow of the Royal Society of Literature in 2023."
  ur: "منیزا علوی (پیدائش 1954) پاکستانی برطانوی شاعرہ ہیں، جو لاہور میں پاکستانی والد اور برطانوی والدہ کے ہاں پیدا ہوئیں اور شیر خوارگی میں ہی انگلستان کے ہیٹفیلڈ منتقل ہو گئیں۔ کئی سال ہائی اسکول میں پڑھایا؛ 1991 میں نظم «Presents from My Aunts in Pakistan» پر پوئٹری بزنس انعام جیتا؛ ان کے مجموعے «The Country at My Shoulder» (1993)، «Europa» (2008) اور «At the Time of Partition» (2013) ٹی۔ ایس۔ ایلیٹ انعام کے لیے شارٹ لسٹ ہوئے؛ 2002 میں چولمنڈلی ایوارڈ ملا اور 2023 میں رائل سوسائٹی آف لٹریچر کی فیلو منتخب ہوئیں۔"

