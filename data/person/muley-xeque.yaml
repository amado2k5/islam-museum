summary:
  ar: "بطاقة أولية لمولاي الشيخ، أمير السعديين ومنفي إلى إسبانيا في القرن السابع عشر، توفي سنة ١٦٢١م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Mulay al-Shaykh, the seventeenth-century Sa'di prince exiled to Spain, d. 1621; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Mulay al-Shaykh, príncipe sadi del siglo XVII exiliado en España, fallecido en 1621; la entrada en el libro de registro dinástico aún no se ha comprobado en la página."
  fr: "Fiche de recrutement de Mulay al-Shaykh, prince sadi du XVIIe siècle exilé en Espagne, mort en 1621; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "سترھویں صدی کے سعدی شہزادے مولائے الشیخ کے لیے کارڈ کا مسودہ اسپین میں جلاوطن، ڈی۔ 1621; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Saadidlerin Prensi ve on yedinci yüzyılda İspanya'ya sürgün edilen Moulay Cheikh'in ön kartı 1621 yılında ölmüştür; İslam ülkelerinin sözlüklerinde bahsedilir ve sayfadaki çevirisi henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan Moulay Cheikh, Pangeran Saadids dan pengasingan ke Spanyol pada abad ketujuh belas, meninggal pada tahun 1621 M; ia disebutkan dalam kamus negara-negara Islam, dan terjemahannya di halaman tersebut belum pernah ditinjau."
