summary:
  ar: ناشطة نسوية ومصلحة قانونية ماليزية وُلدت سنة 1954. شاركت في تأسيس منظمة «أخوات في الإسلام» ⁦(Sisters in Islam)⁩ ومنظمة «مساواة» ⁦(Musawah)⁩ العالمية للمساواة في الأسرة، وتُعَدّ من مؤسّسي الحركة النسوية
    الإسلامية المعاصرة.
  en: Malaysian feminist and legal reformer, born 1954. Co-founder of Sisters in Islam and of the global Musawah movement for equality in the family; a founder of the contemporary Islamic feminist movement.
  ur: ملائیشیائی نسوانی اور قانونی مصلح، 1954 میں پیدا ہوئیں۔ سسٹرز ان اسلام اور خاندانی مساوات کی عالمی تحریک مساوا کی شریک بانی؛ عصری اسلامی نسوانی تحریک کی بانیوں میں۔
  es: "Feminista y reformadora jurídica malasia, nacida en 1954. Cofundadora de Sisters in Islam y del movimiento global Musawah por la igualdad en la familia; fundadora del movimiento feminista islámico contemporáneo."
  fr: "Féministe et réformatrice juridique malaisienne, née en 1954. Cofondatrice de Sisters in Islam et du mouvement mondial Musawah pour l'égalité dans la famille; une fondatrice du mouvement féministe islamique contemporain."
  tr: "1954 doğumlu Malezyalı feminist aktivist ve hukukçu aktivisttir. 'İslam'da Kardeşler' ve aile eşitliği için küresel 'Musawah' örgütünün kurulmasında yer aldı ve çağdaş İslami feminist hareketin kurucularından biri olarak kabul edilmektedir."
  id: "Aktivis feminis dan aktivis hukum Malaysia yang lahir pada tahun 1954. Ia berpartisipasi dalam pendirian organisasi 'Sisters in Islam' dan organisasi global 'Musawah' untuk kesetaraan keluarga, dan dianggap sebagai salah satu pendiri gerakan feminis Islam kontemporer."
