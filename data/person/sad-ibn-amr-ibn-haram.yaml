id: person/sad-ibn-amr-ibn-haram
class: person
label: { ar: "سعد بن عمرو بن حرام الأنصاري", en: "Sa'd ibn Amr ibn Haram al-Ansari", es: "Sa'd ibn Amr ibn Haram al-Ansari", fr: "Sa'd ibn Amr ibn Haram al-Ansari", ur: "سعد بن عمرو بن حرام الانصاری۔" }
summary:
  ar: "سعد بن عمرو بن حرام الأنصاري؛ عند البلاذري: بعثه عمار بن ياسر — وهو عامل عمر على الكوفة — على جيش يستغزي ما فوق الأنبار فأتاه أهل حصون الفرات حتى هيت فطلبوا الأمان فأمنهم واستثنى على أهل هيت نصف كنيستهم؛ وقيل إن مذلاج بن عمرو السلمي كان من قبله وهو الذي تولى فتحها وبنى الحديثة."
  en: "Sa'd ibn Amr ibn Haram al-Ansari; in al-Baladhuri: Ammar ibn Yasir — then Umar's governor of Kufa — sent him at the head of an army raiding above al-Anbar, and the people of the Euphrates forts as far as Hit came to him seeking aman, which he granted, reserving half of Hit's church; others say Midlaj ibn Amr al-Sulami acted under him and it was he who took it and built al-Haditha."
  es: "Sa'd ibn Amr ibn Haram al-Ansari; en al-Baladhuri: Ammar ibn Yasir —entonces gobernador de Kufa por Umar— lo envió al frente de un ejército que asaltaba al norte de al-Anbar, y la gente de las fortalezas del Éufrates hasta Hit acudió a él pidiendo aman, que él concedió, reservando la mitad de la iglesia de Hit; otros dicen que Midlaj ibn Amr al-Sulami actuaba bajo su mando y fue él quien la tomó y construyó al-Haditha."
  fr: "Sa'd ibn Amr ibn Haram al-Ansari; selon al-Baladhuri: Ammar ibn Yasir — alors gouverneur de Kufa sous Umar — l'envoya à la tête d'une armée pillant au-dessus d'al-Anbar, et les habitants des forteresses de l'Euphrate jusqu'à Hit vinrent à lui demander l'aman, qu'il leur accorda, en réservant la moitié de l'église de Hit; d'autres disent que Midlaj ibn Amr al-Sulami agissait sous ses ordres et que c'est lui qui s'en empara et construisit al-Haditha."
  ur: "سعد بن عمرو بن حرام الانصاری؛ البلادوری میں ہے: عمار بن یاسر نے - اس وقت عمر کے کوفہ کے گورنر - نے اسے الانبار کے اوپر چھاپہ مار فوج کے سربراہ کے پاس بھیجا، اور فرات کے قلعے کے لوگ جہاں تک ہٹ تک اس کے پاس امان کی تلاش میں آئے، جو اس نے عطا کی اور ہٹ کے چرچ کا آدھا حصہ محفوظ کر لیا۔ دوسرے کہتے ہیں کہ مدلج بن عمرو السلمی نے ان کے ماتحت کام کیا اور اسی نے اسے لیا اور الحدیثہ تعمیر کیا۔"
  tr: "Sa'd ibn Amr ibn Haram al-Ansari; el-Baladhuri'ye göre: Ammar bin Yasir—Küfe'deki Ömer valisi—onu bir orduyla Anbar'ın üstündeki bölgeye baskın yapmak üzere gönderdi. Fırat kalelerinin halkı, güvenlik aramak için Hit'e kadar ona geldi ve o da onları güvence altına aldı. Kilisenin yarısı Hit halkından muaf tutuldu; Medlec bin Amr el-Sulami'nin onun selefi olduğu ve şehri fetheden ve hadisleri inşa eden kişi olduğu söylenir."
  id: "Sa'd ibn Amr ibn Haram al-Ansari; menurut al-Baladhuri: Ammar ibn Yasir—yang merupakan gubernur Umar atas Kufa—mengirimnya dengan pasukan untuk menyerang wilayah di atas Anbar. Orang-orang benteng-benteng Efrat datang kepadanya hingga Hit, mencari perlindungan, dan ia mengamankannya. Setengah dari gereja dibebaskan dari masyarakat Hit; dikatakan bahwa Madhlaj ibn Amr al-Sulami adalah pendahulunya, dan dialah yang menaklukkannya serta membangun haditha."
