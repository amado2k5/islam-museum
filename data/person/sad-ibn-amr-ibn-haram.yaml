label: { ar: "سعد بن عمرو بن حرام الأنصاري", en: "Sa'd ibn Amr ibn Haram al-Ansari" }
summary:
  ar: "سعد بن عمرو بن حرام الأنصاري؛ عند البلاذري: بعثه عمار بن ياسر — وهو عامل عمر على الكوفة — على جيش يستغزي ما فوق الأنبار فأتاه أهل حصون الفرات حتى هيت فطلبوا الأمان فأمنهم واستثنى على أهل هيت نصف كنيستهم؛ وقيل إن مذلاج بن عمرو السلمي كان من قبله وهو الذي تولى فتحها وبنى الحديثة."
  en: "Sa'd ibn Amr ibn Haram al-Ansari; in al-Baladhuri: Ammar ibn Yasir — then Umar's governor of Kufa — sent him at the head of an army raiding above al-Anbar, and the people of the Euphrates forts as far as Hit came to him seeking aman, which he granted, reserving half of Hit's church; others say Midlaj ibn Amr al-Sulami acted under him and it was he who took it and built al-Haditha."
