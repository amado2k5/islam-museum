label: { ar: "وكيع بن أبي سود التميمي", en: "Wak'i ibn Abi Sud al-Tamimi" }
summary:
  ar: "وكيع بن أبي سود التميمي؛ كتب إلى عدي بن أرطاة حين استشار أهل البصرة في حفر نهر: إنك إن لم تحفر لنا نهراً فلا البصرة لنا بدار. وكان على بني تميم بخراسان فمزله عنهم قتيبة فلما قتل بني الأهثم قال قتلني الله إن أقتله وفاتته الصلوات فقيل له إنك لم تصل فقال وكيف أصلي لرب قتل منا عامتهم صبياناً ولم يغضب لهم"
  en: "Wak'i ibn Abi Sud al-Tamimi; when Adi ibn Arta'a consulted the Basrans on a canal he wrote 'if you dig us no canal, Basra is no home for us'. Deposed from Tamims Khurasan command for a Dabbi, he swore to kill Qutayba after the Banu Ahthams killing and, missing prayers, answered: how should I pray to a Lord who killed our best as boys and was not angered?"
