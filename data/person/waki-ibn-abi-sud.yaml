id: person/waki-ibn-abi-sud
class: person
label: { ar: "وكيع بن أبي سود التميمي", en: "Wak'i ibn Abi Sud al-Tamimi", es: "Wak'i ibn Abi Sud al-Tamimi", fr: "Wak'i ibn Abi Sud al-Tamimi", ur: "وکیع ابن ابی سعود التمیمی۔" }
summary:
  ar: "وكيع بن أبي سود التميمي؛ كتب إلى عدي بن أرطاة حين استشار أهل البصرة في حفر نهر: إنك إن لم تحفر لنا نهراً فلا البصرة لنا بدار. وكان على بني تميم بخراسان فمزله عنهم قتيبة فلما قتل بني الأهثم قال قتلني الله إن أقتله وفاتته الصلوات فقيل له إنك لم تصل فقال وكيف أصلي لرب قتل منا عامتهم صبياناً ولم يغضب لهم"
  en: "Wak'i ibn Abi Sud al-Tamimi; when Adi ibn Arta'a consulted the Basrans on a canal he wrote 'if you dig us no canal, Basra is no home for us'. Deposed from Tamims Khurasan command for a Dabbi, he swore to kill Qutayba after the Banu Ahthams killing and, missing prayers, answered: how should I pray to a Lord who killed our best as boys and was not angered?"
  es: "Wak'i ibn Abi Sud al-Tamimi; cuando Adi ibn Arta'a consultó a los basranos sobre un canal, escribió: «Si no cavan ningún canal para nosotros, Basora no será nuestro hogar». Depuesto del mando de Tamims Khurasan para un Dabbi, juró matar a Qutayba después de la matanza de los Banu Ahtham y, sin poder rezar, respondió: ¿Cómo puedo rezarle a un Señor que mató a los mejores de nosotros cuando eran niños y no se enojó?"
  fr: "Wak'i ibn Abi Sud al-Tamimi; lorsqu'Adi ibn Arta'a consulta les Basrans au sujet d'un canal, il écrivit: « Si vous ne nous creusez pas de canal, Basra ne sera plus notre foyer. » Démis de son commandement du Khorasan par Tamim pour devenir Dabbi, il jura de tuer Qutayba après le massacre des Banu Ahthams et, ayant manqué ses prières, répondit: « Comment prier un Seigneur qui a tué nos meilleurs enfants sans se mettre en colère ? »"
  ur: "وکعی ابن ابی سعود التمیمی؛ جب عدی بن ارطاعہ نے بصریوں سے ایک نہر پر مشورہ کیا تو اس نے لکھا کہ اگر تم نہر کھودیں گے تو بصرہ ہمارا گھر نہیں ہے۔ تمیم خراسان کے حکم سے ایک دبی کے لیے معزول ہو کر، اس نے بنو احتشام کے قتل کے بعد قتیبہ کو قتل کرنے کی قسم کھائی اور، نماز غائب، جواب دیا: میں اس رب سے کیسے دعا کروں جس نے ہمارے بہترین لڑکوں کو مار ڈالا اور ناراض نہیں ہوا؟"
  tr: "Waki' ibn Abi Sud al-Tamimi, Basra halkına nehir kazma konusunda danıştığında 'Adi ibn Arta'ah'a şöyle yazdı: Eğer bizim için nehir kazmazsanız, Basra bizim evimiz olmaz. O, Horasan'da Banu Tamim üzerindeydi ve Qutaybah onu oradan aldı. Banu al-Ahtham öldürüldüğünde, 'Ben onu öldürürsem Allah beni öldürsün,' dedi ve namazları kaçırdı. 'Sen namaz kılmadın.' denildi. O da dedi ki, 'Ben Rabbime nasıl dua edebilirim? Aramızda bazı çocuklarını öldürdü ve onlara kızmadı.'"
  id: "Waki' ibn Abi Sud al-Tamimi menulis kepada 'Adi ibn Arta'ah ketika ia berkonsultasi dengan rakyat Basra tentang menggali sungai: Jika kalian tidak menggali sungai untuk kami, maka Basra tidak akan menjadi rumah kami. Ia berada di atas Banu Tamim di Khurasan, dan Qutaybah mengusirnya dari mereka. Ketika Banu al-Ahtham dibunuh, ia berkata, 'Semoga Tuhan membunuhku jika aku membunuhnya,' dan ia melewatkan doa. Ia diberitahu, 'Kau tidak berdoa.' Ia berkata, 'Bagaimana aku bisa berdoa kepada Tuhanku? Ia membunuh di antara kami beberapa anak mereka, dan ia tidak marah pada mereka.'"
