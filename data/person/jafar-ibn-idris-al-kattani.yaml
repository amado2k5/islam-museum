summary:
  ar: "جعفر بن إدريس الحسني الكتاني، أبو المواهب، فقيه المالكية في عصره، متصوف عالم بالتراجم كثير التصانيف، مولده ووفاته بفاس، من كتبه الشرب المحتضر في رجال القرن الثالث عشر وأعلام الأئمة الأعلام، وسنتا ميلاده ووفاته عند الزركلي 1246 و1323 هـ."
  en: "Ja'far ibn Idris al-Hasani al-Kattani, Abu al-Mawahib, the leading Maliki jurist of his time, a Sufi learned in biographies and a prolific author; born and died in Fez; his books include al-Sharab al-Muhtadar on the men of the thirteenth century AH and A'lam al-A'imma al-A'lam; al-Zirikli gives his years as 1246 to 1323 AH."
  es: "Ja'far ibn Idris al-Hasani al-Kattani, Abu al-Mawahib, el jurista malikí más destacado de su época, un sufí versado en biografías y un autor prolífico; nació y murió en Fez; entre sus libros se incluyen al-Sharab al-Muhtadar sobre los hombres del siglo XIII de la Hégira y A'lam al-A'imma al-A'lam; al-Zirikli sitúa sus años entre 1246 y 1323 de la Hégira."
