summary:
  ar: "عم نصر بن أحمد الساماني؛ في أول محرم سنة اثنتين وثلاثمائة ورد كتاب نصر بن أحمد صاحب خراسان أنه واقع عمه إسحاق بن إسماعيل فأخذه أسيرًا، فخُلع على رسوله وحُملت إليه الخلع لولاية خراسان {cite:muntazam-ibn-al-jawzi p. 415}."
  en: "Nasr ibn Ahmad's uncle; on the first of Muharram 302 Nasr's letter arrived reporting he had met his uncle in battle and taken him captive — the robe of honor went to his envoy and Khurasan's patent to Nasr {cite:muntazam-ibn-al-jawzi p. 415}."
  es: "El tío de Nasr ibn Ahmad; el primero de Muharram del año 302 llegó la carta de Nasr informando que se había encontrado con su tío en batalla y lo había tomado cautivo; la túnica de honor fue para su enviado y la patente de Jorasán para Nasr {cite:muntazam-ibn-al-jawzi p. 415}."
  fr: "L'oncle de Nasr ibn Ahmad; le premier Muharram 302, la lettre de Nasr arriva rapportant qu'il avait rencontré son oncle au combat et l'avait fait prisonnier — la robe d'honneur alla à son envoyé et le brevet du Khorasan à Nasr {cite:muntazam-ibn-al-jawzi p. 415}."
  ur: "نصر بن احمد کے چچا؛ یکم محرم 302 کو نصر کا خط پہنچا جس میں بتایا گیا کہ وہ جنگ میں اپنے چچا سے ملا تھا اور اسے اسیر بنا کر لے گیا تھا - اعزاز کا لباس اس کے ایلچی کے پاس گیا اور خراسان کا پیٹنٹ نصر کے پاس گیا {حوالہ دیں:منتظم ابن الجوزی ص۔ 415}۔"
  tr: "Nasr ibn Ahmed al-Samani'nin amcası; 302 H. yılının ilk Muharrem gününde, Horasan hükümdarı Nasr ibn Ahmed'in mektubunda, amcası İshaq bin İsmail'in esir alındığını, bu yüzden esir alındığını ve Horasan valiliği için tahttan indirildiğinin belirtildiği belirtilmiştir {cite:muntazam-ibn-al-jawzi, s. 415}."
  id: "Paman Nasr ibn Ahmad al-Samani; pada tanggal pertama Muharram tahun 302 H, surat Nasr ibn Ahmad, penguasa Khurasan, menyatakan bahwa pamannya Ishaq ibn Ismail telah ditawan, sehingga ia ditawan, dan penempatan dilaksanakan kepadanya untuk jabatan gubernur Khorasan {cite:muntazam-ibn-al-jawzi, hlm. 415}."
