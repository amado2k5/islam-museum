id: person/badr-ibn-hasanwayh
class: person
label: { ar: "بدر بن حسنويه" }
summary:
  ar: "أبو النجم بدر بن حسنويه الكردي؛ اصطنعه عضد الدولة من بين إخوته بعد موت أبيه سنة 369هـ وقواه بالرجال فضبط تلك النواحي وكف عادية من بها من الأكراد واستقام أمره وكان عاقلاً {cite:kamil-ibn-al-athir p. 518}. وعند ابن الجوزي لقبه القادر بناصر الدولة، وكانت ولايته على الجبل وهمذان والدينور وبروجرد ونهاوند وأسداباذ، واستحدث في أعماله ثلاثة آلاف مسجد وخان للغرباء، وعمر القناطر والمصانع والآبار، وكان ينفذ كل سنة في الصدقات على أهل الحرمين وخفر الطريق ومصالحها مائة ألف دينار، ويصرف في كل سنة ثلاثة آلاف دينار للأساكفة بين همذان وبغداد ليقيموا للمنقطعين من الحاج الأحذية، ويتصدق كل جمعة بعشرة آلاف درهم على الأرامل والضعفاء، وحمل بعد مقتله سنة خمس وأربعمائة إلى مشهد علي بن أبي طالب بالنجف فدُفن به {cite:muntazam-ibn-al-jawzi j.7 p.275-276}."
  en: "Abu'l-Najm Badr ibn Hasanwayh; the son Adud al-Dawla singled out and strengthened among the brothers in 369 till he ruled the Kurdish marches soundly {cite:kamil-ibn-al-athir p. 518}."
died:
