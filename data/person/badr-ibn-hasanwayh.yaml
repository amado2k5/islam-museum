id: person/badr-ibn-hasanwayh
class: person
label: { ar: "بدر بن حسنويه" }
summary:
  ar: "أبو النجم بدر بن حسنويه الكردي؛ اصطنعه عضد الدولة من بين إخوته بعد موت أبيه سنة 369هـ وقواه بالرجال فضبط تلك النواحي وكف عادية من بها من الأكراد واستقام أمره وكان عاقلاً {cite:kamil-ibn-al-athir p. 518}. وعند ابن الجوزي لقبه القادر بناصر الدولة، وكانت ولايته على الجبل وهمذان والدينور وبروجرد ونهاوند وأسداباذ، واستحدث في أعماله ثلاثة آلاف مسجد وخان للغرباء، وعمر القناطر والمصانع والآبار، وكان ينفذ كل سنة في الصدقات على أهل الحرمين وخفر الطريق ومصالحها مائة ألف دينار، ويصرف في كل سنة ثلاثة آلاف دينار للأساكفة بين همذان وبغداد ليقيموا للمنقطعين من الحاج الأحذية، ويتصدق كل جمعة بعشرة آلاف درهم على الأرامل والضعفاء، وحمل بعد مقتله سنة خمس وأربعمائة إلى مشهد علي بن أبي طالب بالنجف فدُفن به {cite:muntazam-ibn-al-jawzi j.7 p.275-276}."
  en: "Abu'l-Najm Badr ibn Hasanwayh; the son Adud al-Dawla singled out and strengthened among the brothers in 369 till he ruled the Kurdish marches soundly {cite:kamil-ibn-al-athir p. 518}."
  es: "Abu'l-Najm Badr ibn Hasanwayh; el hijo Adud al-Dawla fue distinguido y fortalecido entre los hermanos en 369 hasta que gobernó sólidamente las marcas kurdas {cite:kamil-ibn-al-athir p. 518}."
  fr: "Abu'l-Najm Badr ibn Hasanwayh; le fils Adud al-Dawla se distingua et se renforça parmi les frères en 369 jusqu'à ce qu'il règne solidement sur les marches kurdes {cite:kamil-ibn-al-athir p. 518}."
  ur: "ابوالنجم بدر بن حسنویہ؛ بیٹا عدود الدولہ نے 369 میں بھائیوں کے درمیان اکٹھا کیا اور مضبوط کیا یہاں تک کہ اس نے کرد مارچوں پر اچھی طرح حکومت کی۔ 518}۔"
  tr: "Ebu el-Necm Badr bin Hasaneve el-Kürdi; babasının 369 Hicri yılında ölümünden sonra kardeşleri arasında Edud el-Devle yaratıldı ve erkekler tarafından güçlendirildi, böylece o bölgeleri kontrol etti, ortak Kürt bölgelerini kontrol etti ve düzenini sürdürdü. Bilgeydi {kaynak:kamil-ibn-al-athir s. 518}. İbn al-Jawzi ona el-Kadir-Devle unvanını verdi. Dağ üzerindeki valiliği, Hamadhan, Dinur, Borucerd, Nahavand ve Asadabadh üzerindeki görevi onun eseriydi. Yabancılar için üç bin cami ve han kurdu, köprüler, fabrikalar ve kuyular inşa etti, her yıl İki Kutsal Cami halkına, yol bekçilerine ve çıkarlarına yüz bin dinar bağışladı. Hamicanlar arasında mahsur kalanlar için ayakkabı sağlamak amacıyla Hamadhan ile Bağdat arasındaki dükkan sahiplerine yılda üç bin dinar harcadı. Her Cuma dul ve zayıflara on bin dirhem bağışladı. Ölümünden sonra, dört yüz elli hicri yılında, Necef'teki Ali bin Ebi Talib'in türbesine götürüldü ve burada defnedildi {Müntazam-ibn-al-jawzi J.7, s.275-276}."
  id: "Abu al-Najm Badr ibn Hasanawayh al-Kurdi; Adud al-Dawla diangkat di antara saudara-saudaranya setelah kematian ayahnya pada tahun 369 H, dan ia diperkuat oleh pria, sehingga ia menguasai wilayah tersebut, menguasai wilayah Kurdi umum, dan mempertahankan tatanannya. Ia bijaksana {cite:kamil-ibn-al-athir hlm. 518}. Ibn al-Jawzi memberinya gelar al-Qadir al-Dawla. Kepemimpinannya atas gunung, Hamadhan, Dinur, Borujerd, Nahavand, dan Asadabadh adalah karyanya. Ia mendirikan tiga ribu masjid dan khan untuk orang asing, membangun jembatan, pabrik, dan sumur, serta setiap tahun memberikan seratus ribu dinar sebagai amal kepada umat Dua Masjid Suci, penjaga jalan, dan kepentingan mereka. Ia menghabiskan tiga ribu dinar setiap tahun untuk para pedagang antara Hamadhan dan Baghdad guna menyediakan sepatu bagi mereka yang terdampar di antara para peziarah. Setiap Jumat, ia memberikan sepuluh ribu dirham sebagai amal kepada para janda dan orang lemah. Setelah kematiannya, pada tahun empat ratus lima puluh H, ia dibawa ke makam Ali ibn Abi Talib di Najaf, di mana ia dimakamkan {cite:Muntazam-ibn-al-jawzi J.7, hlm.275-276}."
