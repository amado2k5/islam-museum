summary:
  ar: "مصطفى كمال أتاتورك، الضابط العثماني ثم قائد المقاومة التركية؛ لما احتل اليونانيون أزمير سنة ١٣٣٨هـ بتمكين بريطاني وتوغلوا في الأناضول استثار روح الجهاد في الأتراك ورد اليونانيين على أعقابهم فلُقب بالغازي وقرنه أحمد شوقي بخالد بن الوليد وشبه انتصاره ببدر. ثم قاد التحول العلماني: دعا الجمعية التأسيسية في ٣ آذار ١٩٢٤م فأجيز قرار إلغاء الخلافة دون مناقشة ونُفي الخليفة في اليوم التالي، وألغيت وزارة الأوقاف سنة ١٣٤٣هـ/١٩٢٤م وحل العام الميلادي الجريغوري محل الهجري عام ١٩٢٦م. ويذهب الصلابي إلى أن بريطانيا اصطنعت بطولته عبر المخابرات الإنجليزية لتسهيل ضرب الخلافة، وهو تأويل المؤلف {cite:dawlat-uthmaniyya-salabi p. 468-473}."
  en: "Mustafa Kemal Atatürk — Ottoman officer turned leader of the Turkish resistance who drove the Greeks from Anatolia and was hailed as Ghazi, then abolished the caliphate on 3 March 1924 and led Turkey's secular turn {cite:dawlat-uthmaniyya-salabi p. 468-473}."
