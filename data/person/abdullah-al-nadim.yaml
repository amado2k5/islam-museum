summary:
  ar: "كاتب وخطيب وشاعر مصري، وُلد في الإسكندرية سنة 1845، وكان أبرز خطباء الثورة العرابية وأشهر كتّابها؛ أصدر صحيفتي «التنكيت والتبكيت» و«الطائف» ومجلة «الأستاذ»، ونُفي إلى يافا ثم إلى الآستانة، وتوفي في إسطنبول سنة 1896."
  en: "Egyptian writer, orator and poet, born in Alexandria in 1845. He was the leading orator of the Urabi revolt and one of its best-known writers; he published the newspapers al-Tankit wa-l-Tabkit and al-Ta'if and the magazine al-Ustadh, was exiled to Jaffa and then to Istanbul, and died at Istanbul in 1896."
  ur: "مصری ادیب، خطیب اور شاعر، جو 1845 میں اسکندریہ میں پیدا ہوئے۔ وہ عرابی بغاوت کے نمایاں ترین خطیب اور اس کے معروف مصنفین میں سے تھے؛ انہوں نے «التنكيت والتبكيت» اور «الطائف» اخبارات اور «الأستاذ» رسالہ جاری کیا، یافا اور پھر استنبول جلاوطن ہوئے اور 1896 میں استنبول ہی میں وفات پائی۔"
