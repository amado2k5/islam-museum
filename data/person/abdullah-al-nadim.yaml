summary:
  ar: "كاتب وخطيب وشاعر مصري، وُلد في الإسكندرية سنة 1845، وكان أبرز خطباء الثورة العرابية وأشهر كتّابها؛ أصدر صحيفتي «التنكيت والتبكيت» و«الطائف» ومجلة «الأستاذ»، ونُفي إلى يافا ثم إلى الآستانة، وتوفي في إسطنبول سنة 1896."
  en: "Egyptian writer, orator and poet, born in Alexandria in 1845. He was the leading orator of the Urabi revolt and one of its best-known writers; he published the newspapers al-Tankit wa-l-Tabkit and al-Ta'if and the magazine al-Ustadh, was exiled to Jaffa and then to Istanbul, and died at Istanbul in 1896."
  fr: "Écrivain, orateur et poète égyptien, né à Alexandrie en 1845. Il fut le principal orateur de la révolte d'Urabi et l'un de ses écrivains les plus connus ; il publia les journaux al-Tankit wa-l-Tabkit et al-Ta'if et la revue al-Ustadh, fut exilé à Jaffa puis à Istanbul, et mourut à Istanbul en 1896."
  ur: "مصری ادیب، خطیب اور شاعر، جو 1845 میں اسکندریہ میں پیدا ہوئے۔ وہ عرابی بغاوت کے نمایاں ترین خطیب اور اس کے معروف مصنفین میں سے تھے؛ انہوں نے «التنكيت والتبكيت» اور «الطائف» اخبارات اور «الأستاذ» رسالہ جاری کیا، یافا اور پھر استنبول جلاوطن ہوئے اور 1896 میں استنبول ہی میں وفات پائی۔"
  es: "Escritor, orador y poeta egipcio, nacido en Alejandría en 1845. Fue el principal orador de la revuelta de Urabi y uno de sus escritores más conocidos; publicó los periódicos al-Tankit wa-l-Tabkit y al-Ta'if y la revista al-Ustadh, fue exiliado a Jaffa y luego a Estambul, y murió en Estambul en 1896."
  tr: "1845'te İskenderiye'de doğan Mısırlı yazar, hatip ve şair, Urabi Devrimi'nin en önde gelen hatip ve yazarlarından biriydi; \"Al-Tankit wal-Tabkit\" ve \"Al-Ta'if\" gazetelerini ve \"Al-Ustadh\" dergisini yayımladı. Önce Yafa'ya, sonra İstanbul'a sürgün edildi ve 1896'da İstanbul'da öldü."
  id: "Seorang penulis, orator, dan penyair Mesir, lahir di Alexandria pada tahun 1845, ia adalah salah satu orator dan penulis paling terkemuka dari Revolusi Urabi; ia menerbitkan surat kabar \"Al-Tankit wal-Tabkit\" dan \"Al-Ta'if\" serta majalah \"Al-Ustadh.\" Ia diasingkan ke Jaffa dan kemudian ke Istanbul, dan meninggal di Istanbul pada tahun 1896."
