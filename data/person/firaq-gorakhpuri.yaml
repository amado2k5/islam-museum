summary:
  ar: "شاعر وناقد أردي هندي (1896–1982)، اسمه الأصلي رگھوپتی سہائے من غوراخبور. درّس الأدب الإنجليزي في جامعة الله آباد، وكان أول أديب أردي ينال جائزة جنانبيث (1969) عن ديوانه «گل نغمہ»."
  en: "Indian Urdu poet and critic (1896–1982), whose birth name was Raghupati Sahay, of Gorakhpur. He taught English literature at Allahabad University and was the first Urdu writer to receive the Jnanpith Award (1969), for his collection Gul-e-Naghma."
  ur: "ہندوستانی اردو شاعر اور نقاد (1896ء–1982ء)، جن کا اصل نام رگھوپتی سہائے تھا اور جن کا تعلق گورکھپور سے تھا۔ وہ الہ آباد یونیورسٹی میں انگریزی ادب کے استاد رہے اور اپنے مجموعے «گل نغمہ» پر گیان پیٹھ انعام (1969ء) پانے والے پہلے اردو ادیب تھے۔"
