label: { ar: "عبد الله بن طاهر", en: "Abdallah ibn Tahir" }
summary:
  ar: "ولّاه المأمون الرقة لحرب نصر بن شبث في سنة ست ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.581}، وتولى فتح الإسكندرية في سنة عشر ومائتين، وقيل في سنة إحدى عشرة {cite:tabari-tarikh-abu-al-fadl j.8 p.613}. وعند البلاذري كان عامل المعتصم على خراسان والري وقومس وجرجان فكتب إليه بمحاربة مازيار بن قارن الخارج فجه عمه الحسن بن الحسين في رجال خراسان فافتتحت طبرستان فتولاها ثم ابنه طاهر بن عبد الله من بعده."
  en: "Al-Ma'mun gave him al-Raqqa against Nasr ibn Shabath in 206 AH and he took Alexandria in 210 or 211; in al-Baladhuri he was al-Mu'tasim's governor of Khurasan, Rayy, Qumis and Jurjan, ordered against Mazyar ibn Qarin — he sent his uncle al-Hasan ibn al-Husayn, and conquered Tabaristan passed to him then his son Tahir."
