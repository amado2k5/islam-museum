id: person/abd-allah-ibn-tahir
class: person
label: { ar: "عبد الله بن طاهر", en: "Abdallah ibn Tahir", fr: "Abdallah ibn Tahir", es: "Abdallah ibn Tahir", ur: "عبداللہ ابن طاہر" }
summary:
  ar: "ولّاه المأمون الرقة لحرب نصر بن شبث في سنة ست ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.581}، وتولى فتح الإسكندرية في سنة عشر ومائتين، وقيل في سنة إحدى عشرة {cite:tabari-tarikh-abu-al-fadl j.8 p.613}. وعند البلاذري كان عامل المعتصم على خراسان والري وقومس وجرجان فكتب إليه بمحاربة مازيار بن قارن الخارج فجه عمه الحسن بن الحسين في رجال خراسان فافتتحت طبرستان فتولاها ثم ابنه طاهر بن عبد الله من بعده."
  en: "Al-Ma'mun gave him al-Raqqa against Nasr ibn Shabath in 206 AH and he took Alexandria in 210 or 211; in al-Baladhuri he was al-Mu'tasim's governor of Khurasan, Rayy, Qumis and Jurjan, ordered against Mazyar ibn Qarin — he sent his uncle al-Hasan ibn al-Husayn, and conquered Tabaristan passed to him then his son Tahir."
  fr: "Al-Ma'mun lui confia al-Raqqa contre Nasr ibn Shabath en 206 H et il prit Alexandrie en 210 ou 211 ; chez al-Baladhuri, il était le gouverneur d'al-Mu'tasim pour le Khorassan, Rayy, le Qumis et le Jurjan, chargé de marcher contre Mazyar ibn Qarin — il envoya son oncle al-Hasan ibn al-Husayn, et le Tabaristan conquis passa à lui puis à son fils Tahir."
  es: "Al-Ma'mun le dio al-Raqqa contra Nasr ibn Shabath en el 206 AH y tomó Alejandría en el 210 o 211; en al-Baladhuri fue gobernador de al-Mu'tasim de Jorasán, Rayy, Qumis y Jurjan, ordenó contra Mazyar ibn Qarin — envió a su tío al-Hasan ibn al-Husayn, y conquistó Tabaristán, que luego pasó a su hijo Tahir."
  ur: "المامون نے اسے 206 ہجری میں نصر بن شبث کے خلاف الرقہ دیا اور 210 یا 211 میں اسکندریہ پر قبضہ کر لیا۔ البلادوری میں وہ المعتصم کا خراسان، رے، قمیس اور جرجان کا گورنر تھا، اس نے مزیار بن قرین کے خلاف حکم دیا - اس نے اپنے چچا الحسن بن الحسین کو بھیجا، اور تبرستان فتح کیا، پھر اس کے بیٹے طاہر کو اس کے پاس پہنچا۔"
