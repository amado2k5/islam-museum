label: { ar: "زينب بنت سليمان بن علي", en: "Zaynab bint Sulayman", es: "Zaynab bint Sulayman", fr: "Zaynab bint Sulayman", ur: "زینب بنت سلیمان" }
summary:
  ar: "أعلم نساء بني هاشم مرتبة في مجلس الخيزران وقد تقدم المهدي إليها أن تقتبس من آدابها فإنها عجوز أدركت أوائلهم، وبها أوقعت مزنة امرأة مروان حين انتهرتها في جثة إبراهيم الإمام بحران {cite:muruj-al-dhahab p. 303-305}. وعند المسعودي كانت أقعد ولد العباس نسباً وأكبرهم سناً، اجتمع إليها الهاشميون فكلّمت المأمون في تغييره الخضرة فقالت إنك على برّ أهلك من ولد علي أقدر منك على برهم لنا من غير أن تزيل سنة من آبائك، فقال لها ما كلمني أحد بكلام أوقع من كلامك ثم رجع إلى لبس السواد {cite:muruj-al-dhahab p. 686}"
  en: "The senior Hashimi matriarch whose rank topped al-Khayzuran's majlis — 'an old woman of ours who saw our beginnings' {cite:muruj-al-dhahab p. 303-305}."
  es: "La matriarca Hashimi de mayor rango, cuyo cargo encabezaba el majlis de al-Khayzuran, era \"una anciana nuestra que vio nuestros comienzos\" {cite:muruj-al-dhahab p. 303-305}."
  fr: "La matriarche Hashimi la plus âgée dont le rang surpassait celui du majlis d'al-Khayzuran — « une vieille femme des nôtres qui a vu nos débuts » {cite:muruj-al-dhahab p. 303-305}."
  ur: "بزرگ ہاشمی بزرگ جن کا درجہ الخیزوران کی مجلس میں سرفہرست تھا - 'ہماری ایک بوڑھی عورت جس نے ہمارے آغاز کو دیکھا' {حوالہ: مروج الذہب صفحہ۔ 303-305}۔"
  tr: "Banu Haşim'in en bilgili kadınları bambu toplantısında sıralanmıştı. Mehdi, en erken tanışmış yaşlı bir kadın olduğu için görgü kurallarından ödünç almak için ona yaklaştı. İbrahim el-İmam Bahran'ın bedeninde Mervan'ın eşiydi {atıf:muruj-al-dhahab, s. 303-305}. El-Mes'udi'ye göre, o, el-Abbas'ın en yaşlı ve en yaşlı soyundan gelendi. Haşimiler onunla toplandı ve el-Memun'a yeşil saçını değiştirmesi hakkında konuştu. Dedi ki, 'Ailene karşı Ali'nin soyundan bize daha adilsin, atalarının sünnetini terk etmeden.' Dedi ki, 'Bana seninkinden daha samimi sözler kimse konuşmadı.' Sonra siyah giymeye geri döndü {cite:muruj-al-dhahab s. 686}"
  id: "Wanita Banu Hashim yang paling berpengetahuan dinilai dalam kumpulan bambu. Mahdi mendekatinya untuk meminjam tata kramanya, karena dia adalah wanita tua yang telah bertemu dengan yang paling awal. Dia adalah istri Marwan ketika dia menyerangnya dalam tubuh Ibrahim al-Imam Bahran {cite:muruj-al-dhahab, hlm. 303-305}. Menurut al-Mas'udi, dia adalah yang tertua dan tertua dari keturunan al-Abbas. Para Hashemite berkumpul bersamanya, dan dia berbicara kepada al-Ma'mun tentang mengubah rambut hijaunya. Dia berkata, 'Kamu lebih benar bagi keluargamu daripada keturunan Ali kepada kami, tanpa meninggalkan Sunnah leluhurmu.' Dia berkata kepadanya, 'Tidak ada yang berbicara kepadaku dengan kata-kata yang lebih intim daripada milikmu.' Kemudian dia kembali mengenakan pakaian hitam {cite:muruj-al-dhahab hlm. 686}"
