label: { ar: "زينب بنت سليمان بن علي", en: "Zaynab bint Sulayman" }
summary:
  ar: "أعلم نساء بني هاشم مرتبة في مجلس الخيزران وقد تقدم المهدي إليها أن تقتبس من آدابها فإنها عجوز أدركت أوائلهم، وبها أوقعت مزنة امرأة مروان حين انتهرتها في جثة إبراهيم الإمام بحران {cite:muruj-al-dhahab p. 303-305}. وعند المسعودي كانت أقعد ولد العباس نسباً وأكبرهم سناً، اجتمع إليها الهاشميون فكلّمت المأمون في تغييره الخضرة فقالت إنك على برّ أهلك من ولد علي أقدر منك على برهم لنا من غير أن تزيل سنة من آبائك، فقال لها ما كلمني أحد بكلام أوقع من كلامك ثم رجع إلى لبس السواد {cite:muruj-al-dhahab p. 686}"
  en: "The senior Hashimi matriarch whose rank topped al-Khayzuran's majlis — 'an old woman of ours who saw our beginnings' {cite:muruj-al-dhahab p. 303-305}."
