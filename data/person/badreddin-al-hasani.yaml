summary:
  ar: "علَّامة ومحدِّث سوري من أصول مغربية (1850–1935)؛ وُلد وتوفي في دمشق، ولُقّب بالمحدِّث الأكبر وشيخ شيوخ الشام. حفظ كتب الحديث الكبرى ودرّس في الجامع الأموي ودار الحديث الأشرفية، وألّف أكثر من أربعين كتابًا قبل الثلاثين، وابنه تاج الدين الحسني رئيس سورية في عهد الانتداب الفرنسي."
  en: "Syrian scholar and hadith master of Moroccan origin (1850–1935), born and deceased at Damascus, known as al-Muhaddith al-Akbar, 'the greatest hadith scholar', and as shaykh of the shaykhs of Syria. He memorised the major hadith collections, taught at the Umayyad Mosque and the Ashrafiyya Dar al-Hadith, and wrote more than forty works before the age of thirty; his son Taj al-Din al-Hasani became president of Syria under the French Mandate."
  ur: "مغربی الاصل سوری عالم اور محدث (1850–1935)؛ دمشق میں پیدا ہوئے اور وہیں انتقال ہوا، المحدث الاکبر اور شیخ شیوخ الشام کے لقب سے مشہور ہوئے۔ انہوں نے کتب حدیث کی بڑی کتابیں حفظ کیں، جامع اموی اور دار الحدیث الاشرفیہ میں درس دیا، اور تیس برس کی عمر سے پہلے چالیس سے زائد کتابیں لکھیں؛ ان کے بیٹے تاج الدین الحسنی فرانسیسی انتداب کے دور میں سوریہ کے صدر بنے۔"
