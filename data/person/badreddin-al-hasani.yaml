    note: "Two independent Arabic texts name his school for him personally. The Arabic article's lead calls him 'Shafi'i in school, Ash'ari in creed', and its section on his school, citing al-Zirikli's al-A'lam, records the well-known story in which he says in his own words 'I am a Shafi'i' and declines to shorten his prayers on a journey because, in his imam's school, shortening is for a journey of obedience. The Odabasham biography independently states: 'his school — he was Shafi'i in school, like his father.' One modern academic article (Takao, on the Kuftaru genealogy) calls him instead a scholar 'of the Maliki School'; that description conflicts with the Arabic biographical tradition and is not followed, but it is preserved here. His Ash'ari creed, named in the Arabic lead, has no enum value of its own and is recorded in this note only."
    sources: [source/wikipedia-badreddin-al-hasani-ar, source/odabasham-badreddin-al-hasani, source/doshisha-kuftaru-genealogy]
  - value: sufi
    basis: documented
    note: "Two independent sources attest a personal Sufi-order affiliation, but name different orders. The Arabic article's lead calls him 'a Sufi of the Shadhili path'. Takao's article on the Damascene Sufi networks independently calls him 'a member of the Qadiri Sufi order'. The affiliation itself is attested twice over; which order he belonged to is contested between the two sources, and both readings are preserved here."
