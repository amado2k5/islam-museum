summary:
  ar: "قوّال ومغنٍّ باكستاني ⁦(وُلد 1974)⁩ من أسرة فتح علي خان، ابن أخي نصرت فتح علي خان وتلميذه منذ السابعة وخليفته على الفرقة، من أشهر مغني باكستان وأعلاهم أجرًا، غنّى في السينما الهندية منذ 2003، وكان أول باكستاني يغني في حفل جائزة نوبل للسلام (2014)، وتجاوزت أغنيته «ضروري تھا» مليار مشاهدة."
  en: "Pakistani qawwal and singer (born 1974) of the Fateh Ali Khan family, nephew and pupil from the age of seven of Nusrat Fateh Ali Khan and his successor at the head of the party; one of Pakistan's most popular and highest-paid singers, a Hindi film playback singer since 2003, the first Pakistani to sing at a Nobel Peace Prize concert (2014), and the voice of 'Zaroori Tha', which passed a billion views."
  ur: "فتح علی خان خاندان کے پاکستانی قوال اور گلوکار ⁦(پیدائش 1974ء)⁩، نصرت فتح علی خان کے بھتیجے، سات برس کی عمر سے ان کے شاگرد اور پارٹی میں ان کے جانشین؛ پاکستان کے مقبول ترین اور سب سے زیادہ معاوضہ پانے والے گلوکاروں میں سے، 2003ء سے ہندی فلموں کے پلے بیک سنگر، نوبل امن انعام کی تقریب ⁦(2014ء)⁩ میں گانے والے پہلے پاکستانی، اور «ضروری تھا» کی آواز جس نے ایک ارب ویوز عبور کیے۔"
