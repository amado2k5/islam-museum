summary:
  ar: "\u0642\u0648\u0651\u0627\u0644 \u0648\u0645\u063a\u0646\u064d\u0651 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u2066(\u0648\u064f\u0644\u062f 1974)\u2069 \u0645\u0646 \u0623\u0633\u0631\u0629 \u0641\u062a\u062d \u0639\u0644\u064a \u062e\u0627\u0646\u060c \u0627\u0628\u0646 \u0623\u062e\u064a \u0646\u0635\u0631\u062a \u0641\u062a\u062d \u0639\u0644\u064a \u062e\u0627\u0646 \u0648\u062a\u0644\u0645\u064a\u0630\u0647 \u0645\u0646\u0630 \u0627\u0644\u0633\u0627\u0628\u0639\u0629 \u0648\u062e\u0644\u064a\u0641\u062a\u0647 \u0639\u0644\u0649 \u0627\u0644\u0641\u0631\u0642\u0629\u060c \u0645\u0646 \u0623\u0634\u0647\u0631 \u0645\u063a\u0646\u064a \u0628\u0627\u0643\u0633\u062a\u0627\u0646 \u0648\u0623\u0639\u0644\u0627\u0647\u0645 \u0623\u062c\u0631\u064b\u0627\u060c \u063a\u0646\u0651\u0649 \u0641\u064a \u0627\u0644\u0633\u064a\u0646\u0645\u0627 \u0627\u0644\u0647\u0646\u062f\u064a\u0629 \u0645\u0646\u0630 2003\u060c \u0648\u0643\u0627\u0646 \u0623\u0648\u0644 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u064a\u063a\u0646\u064a \u0641\u064a \u062d\u0641\u0644 \u062c\u0627\u0626\u0632\u0629 \u0646\u0648\u0628\u0644 \u0644\u0644\u0633\u0644\u0627\u0645 (2014)\u060c \u0648\u062a\u062c\u0627\u0648\u0632\u062a \u0623\u063a\u0646\u064a\u062a\u0647 \u00ab\u0636\u0631\u0648\u0631\u064a \u062a\u06be\u0627\u00bb \u0645\u0644\u064a\u0627\u0631 \u0645\u0634\u0627\u0647\u062f\u0629."
  en: "Pakistani qawwal and singer (born 1974) of the Fateh Ali Khan family, nephew and pupil from the age of seven of Nusrat Fateh Ali Khan and his successor at the head of the party; one of Pakistan's most popular and highest-paid singers, a Hindi film playback singer since 2003, the first Pakistani to sing at a Nobel Peace Prize concert (2014), and the voice of 'Zaroori Tha', which passed a billion views."
  ur: "\u0641\u062a\u062d \u0639\u0644\u06cc \u062e\u0627\u0646 \u062e\u0627\u0646\u062f\u0627\u0646 \u06a9\u06d2 \u067e\u0627\u06a9\u0633\u062a\u0627\u0646\u06cc \u0642\u0648\u0627\u0644 \u0627\u0648\u0631 \u06af\u0644\u0648\u06a9\u0627\u0631 \u2066(\u067e\u06cc\u062f\u0627\u0626\u0634 1974\u0621)\u2069\u060c \u0646\u0635\u0631\u062a \u0641\u062a\u062d \u0639\u0644\u06cc \u062e\u0627\u0646 \u06a9\u06d2 \u0628\u06be\u062a\u06cc\u062c\u06d2\u060c \u0633\u0627\u062a \u0628\u0631\u0633 \u06a9\u06cc \u0639\u0645\u0631 \u0633\u06d2 \u0627\u0646 \u06a9\u06d2 \u0634\u0627\u06af\u0631\u062f \u0627\u0648\u0631 \u067e\u0627\u0631\u0679\u06cc \u0645\u06cc\u06ba \u0627\u0646 \u06a9\u06d2 \u062c\u0627\u0646\u0634\u06cc\u0646\u061b \u067e\u0627\u06a9\u0633\u062a\u0627\u0646 \u06a9\u06d2 \u0645\u0642\u0628\u0648\u0644 \u062a\u0631\u06cc\u0646 \u0627\u0648\u0631 \u0633\u0628 \u0633\u06d2 \u0632\u06cc\u0627\u062f\u06c1 \u0645\u0639\u0627\u0648\u0636\u06c1 \u067e\u0627\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u06af\u0644\u0648\u06a9\u0627\u0631\u0648\u06ba \u0645\u06cc\u06ba \u0633\u06d2\u060c 2003\u0621 \u0633\u06d2 \u06c1\u0646\u062f\u06cc \u0641\u0644\u0645\u0648\u06ba \u06a9\u06d2 \u067e\u0644\u06d2 \u0628\u06cc\u06a9 \u0633\u0646\u06af\u0631\u060c \u0646\u0648\u0628\u0644 \u0627\u0645\u0646 \u0627\u0646\u0639\u0627\u0645 \u06a9\u06cc \u062a\u0642\u0631\u06cc\u0628 \u2066(2014\u0621)\u2069 \u0645\u06cc\u06ba \u06af\u0627\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u067e\u06c1\u0644\u06d2 \u067e\u0627\u06a9\u0633\u062a\u0627\u0646\u06cc\u060c \u0627\u0648\u0631 \u00ab\u0636\u0631\u0648\u0631\u06cc \u062a\u06be\u0627\u00bb \u06a9\u06cc \u0622\u0648\u0627\u0632 \u062c\u0633 \u0646\u06d2 \u0627\u06cc\u06a9 \u0627\u0631\u0628 \u0648\u06cc\u0648\u0632 \u0639\u0628\u0648\u0631 \u06a9\u06cc\u06d2\u06d4"
