label: { ar: "أبو الهذيل العلاف", en: "Abu Al Hudhayl Al Allaf" }
summary:
  ar: "أبو الهذيل العلاف محمد بن الهذيل، قال أخذت هذا الذي أنا عليه من العدل والتوحيد عن عثمان الطويل وكان معلم أبي الهذيل، وأخبره عثمان أنه أخذه عن واصل بن عطاء وواصل عن أبي هاشم بن محمد بن الحنفية وعبد الله عن أبيه ومحمد عن أبيه علي، وهو في طبقة المصنفين المشتهرة بالاعتزال بعد واصل عند البلخي {cite:fihrist-ibn-al-nadim p. 557-558,618}."
  en: "First systematic Mu'tazili — head of al-Balkhi's list of famous authors {cite:fihrist-ibn-al-nadim}"
