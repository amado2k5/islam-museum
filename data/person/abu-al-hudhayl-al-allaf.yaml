label: { ar: "أبو الهذيل العلاف", en: "Abu Al Hudhayl Al Allaf", fr: "Abu al-Hudhayl al-Allaf", es: "Abu Al Hudhayl Al Allaf", ur: "ابو الحذیل اللاف" }
summary:
  ar: "أبو الهذيل العلاف محمد بن الهذيل، قال أخذت هذا الذي أنا عليه من العدل والتوحيد عن عثمان الطويل وكان معلم أبي الهذيل، وأخبره عثمان أنه أخذه عن واصل بن عطاء وواصل عن أبي هاشم بن محمد بن الحنفية وعبد الله عن أبيه ومحمد عن أبيه علي، وهو في طبقة المصنفين المشتهرة بالاعتزال بعد واصل عند البلخي {cite:fihrist-ibn-al-nadim p. 557-558,618}. وكان ثمامة يقوم لأبي الهذيل ويأخذ بركابه حتى ينزل ويقول أستاذي منذ ثلاثين سنة، وقال أبو الهذيل لصالح صاحب كتاب الشكوك حين أظهر عليه الحزن على ابنه المتوفى فشك أنت في موت ابنك واعمل على أنه لم يمت وإن كان قد مات وشك أيضا في أنه قد قرأ كتاب الشكوك وإن كان لم يقرأه {cite:fihrist-ibn-al-nadim p. 526-527}، وعند أحمد أمين هو من أقوى شخصيات مدرسة البصرة ورئيس الاعتزال في عصره وإليه يرجع الفضل في تطعيم مبادئ الاعتزال بمبادئ الفلسفة؛ مولى عبد القيس ولذلك يقال له العبدي، عمر نحو مائة سنة ولد سنة ١٣٥هـ ومات سنة ٢٣٥هـ في أول خلافة المتوكل، وكان المأمون يعقد المجالس للمناظرة في الأديان والمقالات وكان أستاذه فيها أبو الهذيل كما قال الدينوري، وقال المبرد ما رأيت أفصح من أبي الهذيل والجاحظ وكان أبو الهذيل أحسن مناظرة، وناظر صالح بن عبد القدوس فأفحمه، وامتلأت حياته بالمناظرة مع الزنادقة والشكاك والمجوس والثنوية ورووا أنه أسلم على يده أكثر من ثلاثة آلاف رجل {cite:duha-islam p. 761-762}، وقال في مجلس يحيى البرمكي إن العشق يختم على النواظر ويطبع على الأفئدة وهو جرعة من نقيع الموت وبقية من حياض الثكل غير أنه من أريحية تكون في الطبع {cite:muruj-al-dhahab p. 358}."
  en: "First systematic Mu'tazili — head of al-Balkhi's list of famous authors {cite:fihrist-ibn-al-nadim}; per Ahmad Amin the Basra school's strongest figure, head of i'tizal in his age, al-Ma'mun's debate-master, who grafted Greek philosophy onto Mu'tazili principles and converted over three thousand in disputation {cite:duha-islam p. 761-762}."
  fr: "Premier mu'tazilite systématique — en tête de la liste d'al-Balkhi des auteurs célèbres {cite:fihrist-ibn-al-nadim} ; selon Ahmad Amin, la figure la plus forte de l'école de Bassora, chef du i'tizal en son temps, maître des débats d'al-Ma'mun, qui greffa la philosophie grecque sur les principes mu'tazilites et convertit plus de trois mille personnes par la dispute {cite:duha-islam p. 761-762}."
  es: "Primer mu'tazilí sistemático: encabeza la lista de autores famosos de al-Balkhi {cite:fihrist-ibn-al-nadim}; según Ahmad Amin, la figura más fuerte de la escuela de Basora, jefe de i'tizal en su época, maestro de debates de al-Ma'mun, quien injertó la filosofía griega en los principios mu'tazilíes y convirtió a más de tres mil en disputas {cite:duha-islam p. 761-762}."
  ur: "پہلا منظم معتزلی - مشہور مصنفین کی فہرست البالخی کے سربراہ {حوالہ: فہرست ابن الندیم} فی احمد امین بصرہ مکتب کی سب سے مضبوط شخصیت، اپنی عمر میں اعتزال کے سربراہ، المامون کے مناظرے کے استاد، جنہوں نے یونانی فلسفہ کو معتزلی اصولوں میں پیوند کیا اور تین ہزار سے زائد کو اختلاف میں تبدیل کیا۔ 761-762}۔"
  tr: "Ebu el-Hüdâyl el-Allaf, Muhammed ibn el-Hüdâyl şöyle dedi: “Bu adalet ve tevhid öğretisini, Ebu el-Hüdâyl’ın hocası olan Osman el-Tevvil’den aldım. Osman ona, bunu Vesil ibn Ata’dan, Vesil de Ebu Haşim ibn Muhammed ibn el-Hanefiyye’den, Abdullah babasından ve Muhammed de babası Ali’den aldığını bildirmişti. El-Belkhi’ye göre, Vesil’den sonra Mu’tezile eğilimleriyle bilinen yazarlar arasındadır.” {kaynak:fihrist-ibn-al-nadim s. 557-558, 618}. Thumama, Ebu el-Hüdâyl’ın yanında durur ve o inene kadar üzengisini tutar, “Otuz yıldır benim hocamdır” derdi. Ebu el-Hüdîl, “Şüpheler” kitabının yazarı Salih'e, oğlunun vefatı üzerine duyduğu üzüntüyü dile getirirken şöyle demiştir: “Oğlunun ölümünden şüphe et ve ölmüş olsa bile ölmemiş gibi davran. Ayrıca, “Şüpheler” kitabını okuduğundan da şüphe et, okumamış olsa bile.” {kaynak: Firist ibn el-Nadim, s. 526-527}. Ahmed Amin'e göre, o, Basra okulunun en güçlü isimlerinden biri ve zamanında Mu'tezile'nin başıydı ve Mu'tezile'nin ilkelerini felsefe ilkeleriyle zenginleştirme lütfu ona atfedilir. Abdülkays'ın bir müvekkiliydi ve bu nedenle Abdül-Abdi olarak anılır. Yaklaşık yüz yıl yaşamış, Hicri 135 yılında doğmuş ve Hicri 235 yılında Mutevkil halifeliğinin başlangıcında vefat etmiştir. Abdül-Ma'mun, dinler ve doktrinler üzerine tartışmalar için meclisler düzenlerdi ve bu meclislerdeki hocası Ebu el-Hüdeyl idi. Dinavari'nin dediğine göre, Mübarrad da \"Ebu el-Hüdeyl ve el-Cehiz'den daha güzel konuşan birini görmedim\" demiştir. Ebu el-Hüdeyl en iyi tartışmacıydı ve Salih ibn Abdül-Kuddus ile tartışmış ve onu susturmuştur. Hayatı, sapkınlar, şüpheciler, Mecusiler ve düalistlerle tartışmalarla doluydu ve rivayete göre onun eliyle üç binden fazla erkek İslam'a geçmiştir. {Kaynak: Duha-İslam, s. 761-762} ve Yahya el-Barmaki meclisinde şöyle dedi: Aşk, gözleri mühürler ve kalplere iz bırakır; ölümün bir dozu ve keder havuzlarının bir kalıntısıdır, ancak doğada bulunan bir tesellidendir. {alıntı: Muruj-al-Dhahab s. 358}"
  id: "Abu al-Hudhayl al-Allaf, Muhammad ibn al-Hudhayl, berkata: “Aku menerima doktrin keadilan dan monoteisme ini dari Uthman al-Tawil, yang merupakan guru Abu al-Hudhayl. Uthman memberitahunya bahwa ia menerimanya dari Wasil ibn Ata, dan Wasil dari Abu Hashim ibn Muhammad ibn al-Hanafiyya, dan Abdullah dari ayahnya, dan Muhammad dari ayahnya Ali. Dia termasuk di antara penulis yang dikenal karena kecenderungan Mu'tazilah setelah Wasil, menurut al-Balkhi.” {cite:fihrist-ibn-al-nadim hlm. 557-558, 618}. Thumama akan berdiri untuk Abu al-Hudhayl dan memegang sanggurdinya sampai ia turun dari kuda, sambil berkata, “Dia telah menjadi guruku selama tiga puluh tahun.” Abu al-Hudhayl berkata kepada Salih, penulis buku “Keraguan,” ketika ia berduka atas kematian putranya: “Ragukan kematian putramu dan bertindaklah seolah-olah ia tidak meninggal, meskipun ia memang meninggal. Juga, ragukan bahwa ia membaca buku “Keraguan,” meskipun ia tidak membacanya.” {kutipan:fihrist-ibn-al-nadim hlm. 526-527}, dan menurut Ahmad Amin, ia adalah salah satu tokoh terkuat dari mazhab Basra dan kepala Mu'tazila pada masanya, dan kepadanya dikaitkan penghargaan atas pengayaan prinsip-prinsip Mu'tazila dengan prinsip-prinsip filsafat; Seorang klien Abd al-Qays, dan karena itu ia disebut al-Abdi, ia hidup selama kurang lebih seratus tahun, lahir pada tahun 135 H dan meninggal pada tahun 235 H pada awal kekhalifahan al-Mutawakkil, dan al-Ma'mun biasa mengadakan dewan untuk berdebat tentang agama dan doktrin, dan gurunya dalam hal itu adalah Abu al-Hudhayl, sebagaimana dikatakan oleh al-Dinawari, dan al-Mubarrad berkata, “Aku belum pernah melihat siapa pun yang lebih fasih daripada Abu al-Hudhayl dan al-Jahiz,” dan Abu al-Hudhayl adalah pendebat terbaik, dan ia berdebat dengan Salih ibn Abd al-Quddus dan membungkamnya, dan hidupnya dipenuhi dengan debat dengan kaum sesat, skeptis, Majusi dan dualis, dan diriwayatkan bahwa lebih dari tiga ribu orang masuk Islam di tangannya {cite:duha-islam p. 761-762}, dan beliau berkata dalam dewan Yahya al-Barmaki bahwa cinta menutup mata dan membekas di hati, dan itu adalah dosis dari infus kematian dan sisa dari kolam kesedihan, kecuali bahwa itu berasal dari kenyamanan yang ada dalam fitrah {kutip:muruj-al-dhahab hlm. 358}."
