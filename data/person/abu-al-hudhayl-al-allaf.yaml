label: { ar: "أبو الهذيل العلاف", en: "Abu Al Hudhayl Al Allaf" }
summary:
  ar: "أبو الهذيل العلاف محمد بن الهذيل، قال أخذت هذا الذي أنا عليه من العدل والتوحيد عن عثمان الطويل وكان معلم أبي الهذيل، وأخبره عثمان أنه أخذه عن واصل بن عطاء وواصل عن أبي هاشم بن محمد بن الحنفية وعبد الله عن أبيه ومحمد عن أبيه علي، وهو في طبقة المصنفين المشتهرة بالاعتزال بعد واصل عند البلخي {cite:fihrist-ibn-al-nadim p. 557-558,618}. وكان ثمامة يقوم لأبي الهذيل ويأخذ بركابه حتى ينزل ويقول أستاذي منذ ثلاثين سنة، وقال أبو الهذيل لصالح صاحب كتاب الشكوك حين أظهر عليه الحزن على ابنه المتوفى فشك أنت في موت ابنك واعمل على أنه لم يمت وإن كان قد مات وشك أيضا في أنه قد قرأ كتاب الشكوك وإن كان لم يقرأه {cite:fihrist-ibn-al-nadim p. 526-527}، وعند أحمد أمين هو من أقوى شخصيات مدرسة البصرة ورئيس الاعتزال في عصره وإليه يرجع الفضل في تطعيم مبادئ الاعتزال بمبادئ الفلسفة؛ مولى عبد القيس ولذلك يقال له العبدي، عمر نحو مائة سنة ولد سنة ١٣٥هـ ومات سنة ٢٣٥هـ في أول خلافة المتوكل، وكان المأمون يعقد المجالس للمناظرة في الأديان والمقالات وكان أستاذه فيها أبو الهذيل كما قال الدينوري، وقال المبرد ما رأيت أفصح من أبي الهذيل والجاحظ وكان أبو الهذيل أحسن مناظرة، وناظر صالح بن عبد القدوس فأفحمه، وامتلأت حياته بالمناظرة مع الزنادقة والشكاك والمجوس والثنوية ورووا أنه أسلم على يده أكثر من ثلاثة آلاف رجل {cite:duha-islam p. 761-762}، وقال في مجلس يحيى البرمكي إن العشق يختم على النواظر ويطبع على الأفئدة وهو جرعة من نقيع الموت وبقية من حياض الثكل غير أنه من أريحية تكون في الطبع {cite:muruj-al-dhahab p. 358}."
  en: "First systematic Mu'tazili — head of al-Balkhi's list of famous authors {cite:fihrist-ibn-al-nadim}; per Ahmad Amin the Basra school's strongest figure, head of i'tizal in his age, al-Ma'mun's debate-master, who grafted Greek philosophy onto Mu'tazili principles and converted over three thousand in disputation {cite:duha-islam p. 761-762}."
