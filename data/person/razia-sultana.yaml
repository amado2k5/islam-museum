summary:
  ar: "رضية سلطانة (1205 – أكتوبر 1240)، ابنة السلطان شمس الدين إلتتمش، المرأة الوحيدة التي حكمت دهلي سلطانةً بنفسها. أثبتت كفاءتها حين نابت عن أبيها في دهلي أثناء حملته على گواليور سنة 1231 فعيّنها وليّة لعهده، لكن النبلاء نصبوا أخاها ركن الدين فيروز بعد وفاة أبيها سنة 1236؛ فأطاحت به بمساندة أهل دهلي وحكمت باسم جلالة الدنيا والدين، تضرب السكة باسمها وتصدّت لهجوم القرامطة على جامع دهلي سنة 1237. خلعها انقلاب سنة 1240، فقُتلت قرب كيثال بعد هزيمتها وهي تحاول استرداد عرشها مع زوجها ألتونيا."
  en: "Razia Sultana (1205 - October 1240), daughter of Sultan Shams ud-Din Iltutmish, was the only woman to rule Delhi as sultan in her own right. Having proved herself governing Delhi in her father's absence on the Gwalior campaign of 1231, she was designated his heir, but on his death in 1236 the nobles installed her brother Ruknuddin Firuz; the people of Delhi helped her depose him, and she reigned as Jalalat al-Duniya wal-Din, striking coins in her own name and beating back the Qarmatian attack on Delhi's Jama Masjid in 1237. A coup deposed her in 1240, and she was killed near Kaithal after her defeat while trying to recover her throne alongside her husband Altunia."
  ur: "رضیہ سلطانہ (1205ء – اکتوبر 1240ء)، سلطان شمس الدین التتمش کی بیٹی، دہلی پر اپنے حق سے بطور سلطان حکومت کرنے والی واحد خاتون تھیں۔ 1231ء میں والد کی گوالیار مہم کے دوران دہلی کی نائب رہ کر انھوں نے اپنی اہلیت ثابت کی تو والد نے انھیں ولی عہد نامزد کیا، لیکن 1236ء میں والد کی وفات پر امیروں نے ان کے بھائی رکن الدین فیروز کو بٹھا دیا؛ دہلی کے عوام کی مدد سے انھوں نے اسے معزول کیا اور جلالۃ الدنیا والدین کے نام سے حکومت کی، اپنے نام کا سکہ جاری کیا اور 1237ء میں دہلی کی جامع مسجد پر قرامطہ کے حملے کو پسپا کیا۔ 1240ء میں ایک سازش نے انھیں معزول کیا، اور شوہر التونیہ کے ساتھ تخت واپس لینے کی کوشش میں شکست کے بعد وہ کیتھل کے قریب ماری گئیں۔"

