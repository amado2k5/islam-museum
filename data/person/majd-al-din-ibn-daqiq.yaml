summary:
  ar: "العلامة المالكي، شيخ أهل الصعيد ونزيل قوص؛ كان جامعاً لفنون العلم موصوفاً بالصلاح والتأله معظماً في النفوس؛ روى عن أبي المفضل وغيره وتوفي في المحرم عن ثمانين سنة {cite:shadharat-dhahab p. 565}."
  en: "Shaykh of the Sa'id, resident of Qus — 'a joiner of the disciplines, described by godliness, magnified in souls'; d. Muharram 667 at eighty {cite:shadharat-dhahab p. 565}."
  es: "Shaykh del Sa'id, residente de Qus — 'un unificador de las disciplinas, descrito por su piedad, magnificado en las almas'; murió en Muharram 667 a los ochenta años {cite:shadharat-dhahab p. 565}."
  fr: "Cheikh du Sa'id, résident de Qus — « un rassembleur des disciplines, décrit par la piété, magnifié dans les âmes »; d. Muharram 667 à quatre-vingts ans {cite: shadharat-dhahab p. 565}."
  ur: "شیخ آف سعید، قس کے رہنے والے - 'شعبوں میں شامل کرنے والا، خدا پرستی کے ذریعہ بیان کیا گیا، روحوں میں بڑا'؛ d محرم 667 بوقت اسّی 565}۔"
  tr: "Maliki âlim, Yukarı Mısır halkının şeyhi ve Kus'un sakini; bilgi sanatlarının toplayıcısıydı, doğru ve dindar olarak tanımlanır, ruhlarında çok saygı görürdü; Ebu el-Mufaddal ve diğerlerinden rivayet eder, Muharrem'de seksen yaşında ölmüştür {atıf:shadharat-dhahab, s. 565}."
  id: "Sarjana Maliki, sheikh rakyat Mesir Hulu dan penduduk Qus; ia adalah pengumpul ilmu pengetahuan, digambarkan sebagai orang yang benar dan taat, serta sangat dihormati dalam jiwa; ia menceritakan dari Abu al-Mufaddal dan lainnya, dan meninggal di Muharram pada usia delapan puluh tahun {cite:shadharat-dhahab, hlm. 565}."
