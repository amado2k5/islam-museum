summary:
  ar: "ألوغ بك بن معين الدين شاه رخ صاحب هراة ابن تيمور لنك وقيل اسمه تيمور على اسم جده وقيل محمد فريد دهره ووحيد عصره في العلوم العقلية والهيئة والهندسة حاوى زمانه حنفي المذهب ولد في حدود سنة تسعين وسبع مئة ونشأ في أيام جده وتزوج في أيامه أيضاً وعمل له جده العرس المشهور ولما مات جده تيمور وآل الأمر إلى أبيه شاه رخ ولاه سمرقند وأعمالها فحكمها نيفاً وثلاثين سنة وعمل بها رصداً عظيماً انتهى بناؤه في سنة وفاته وقد جمع لهذا الرصد علماء هذا الفن من سائر الأقطار وأغدق عليهم الأموال وأجزل لهم الرواتب الكثيرة حتى رحل إليه علماء الهيئة والهندسة من البلاد البعيدة وهرع إليه كل صاحب فضيلة وهو مع هذا يتلفت إلى من يسمع به من العلماء في الأقطار ويرسل يطلب من سمع به هذا مع علمه الغزير واطلاعه الكبير وباعه الواسع في هذه العلوم مع مشاركة جيدة إلى الغاية في فقه الحنفية والأصلين والمعاني والبيان والعربية والتاريخ وأيام الناس قيل إنه سأل بعض حواشيه ما تقول الناس عني فألح عليه فقال يقولون إنك ما تحفظ القرآن فدخل من وقته وحفظه في أقل من ستة أشهر حفظاً متقناً واستمر بسمرقند إلى أن خرج عن طاعته ولده عبد اللطيف وسببه أنه لما ملك أبوه هراة طمع عبد اللطيف أن يوليه هراة فلم يفعل وولاه بلخ فكاتبوا ولده في الخروج عن طاعته فخرج عن الطاعة وبلغ أباه الخبر فتجرد لقتاله والتقى معه وفي ظنه أن ولده لا يثبت لقتاله فلما التقى الفريقان هرب جماعة من أمراء ألوغ بك إلى ابنه فانكسر ألوغ بك وهرب على وجهه وملك ولده سمرقند ثم قبض عبد اللطيف على أخيه عبد العزيز وقتله صبراً في حضرة والده ألوغ بك {cite:shadharat-dhahab p. 275-277}."
  en: "Ulugh Beg, son of Shah Rukh and grandson of Timur, sovereign of Samarqand for over thirty years — unique in his age in the rational sciences, astronomy and geometry, yet fully versed in Hanafi fiqh, usul, Arabic, history and the days of men. He built the great Samarqand observatory, drawing astronomers from every quarter on lavish stipends; told that the people said he had not memorised the Qur'an, he memorised it in under six months. His son Abd al-Latif rebelled, broke him, took Samarqand, then slew his brother Abd al-Aziz in cold blood before his father's eyes {cite:shadharat-dhahab p. 275-277}."
