summary:
  ar: "ألوغ بك بن معين الدين شاه رخ صاحب هراة ابن تيمور لنك وقيل اسمه تيمور على اسم جده وقيل محمد فريد دهره ووحيد عصره في العلوم العقلية والهيئة والهندسة حاوى زمانه حنفي المذهب ولد في حدود سنة تسعين وسبع مئة ونشأ في أيام جده وتزوج في أيامه أيضاً وعمل له جده العرس المشهور ولما مات جده تيمور وآل الأمر إلى أبيه شاه رخ ولاه سمرقند وأعمالها فحكمها نيفاً وثلاثين سنة وعمل بها رصداً عظيماً انتهى بناؤه في سنة وفاته وقد جمع لهذا الرصد علماء هذا الفن من سائر الأقطار وأغدق عليهم الأموال وأجزل لهم الرواتب الكثيرة حتى رحل إليه علماء الهيئة والهندسة من البلاد البعيدة وهرع إليه كل صاحب فضيلة وهو مع هذا يتلفت إلى من يسمع به من العلماء في الأقطار ويرسل يطلب من سمع به هذا مع علمه الغزير واطلاعه الكبير وباعه الواسع في هذه العلوم مع مشاركة جيدة إلى الغاية في فقه الحنفية والأصلين والمعاني والبيان والعربية والتاريخ وأيام الناس قيل إنه سأل بعض حواشيه ما تقول الناس عني فألح عليه فقال يقولون إنك ما تحفظ القرآن فدخل من وقته وحفظه في أقل من ستة أشهر حفظاً متقناً واستمر بسمرقند إلى أن خرج عن طاعته ولده عبد اللطيف وسببه أنه لما ملك أبوه هراة طمع عبد اللطيف أن يوليه هراة فلم يفعل وولاه بلخ فكاتبوا ولده في الخروج عن طاعته فخرج عن الطاعة وبلغ أباه الخبر فتجرد لقتاله والتقى معه وفي ظنه أن ولده لا يثبت لقتاله فلما التقى الفريقان هرب جماعة من أمراء ألوغ بك إلى ابنه فانكسر ألوغ بك وهرب على وجهه وملك ولده سمرقند ثم قبض عبد اللطيف على أخيه عبد العزيز وقتله صبراً في حضرة والده ألوغ بك {cite:shadharat-dhahab p. 275-277}."
  en: "Ulugh Beg, son of Shah Rukh and grandson of Timur, sovereign of Samarqand for over thirty years — unique in his age in the rational sciences, astronomy and geometry, yet fully versed in Hanafi fiqh, usul, Arabic, history and the days of men. He built the great Samarqand observatory, drawing astronomers from every quarter on lavish stipends; told that the people said he had not memorised the Qur'an, he memorised it in under six months. His son Abd al-Latif rebelled, broke him, took Samarqand, then slew his brother Abd al-Aziz in cold blood before his father's eyes {cite:shadharat-dhahab p. 275-277}."
  es: "Ulugh Beg, hijo de Shah Rukh y nieto de Timur, soberano de Samarcanda durante más de treinta años, único en su época por sus conocimientos en ciencias racionales, astronomía y geometría, y a la vez versado en fiqh hanafí, usul, árabe, historia y la época de los hombres. Construyó el gran observatorio de Samarcanda, atrayendo a astrónomos de todas partes con generosos estipendios; se decía que la gente afirmaba que no había memorizado el Corán, pero lo memorizó en menos de seis meses. Su hijo Abd al-Latif se rebeló, lo derrocó, tomó Samarcanda y luego asesinó a sangre fría a su hermano Abd al-Aziz ante los ojos de su padre {cita: shadharat-dhahab págs. 275-277}."
  fr: "Ulugh Beg, fils de Shah Rukh et petit-fils de Timour, souverain de Samarcande pendant plus de trente ans, était un homme exceptionnel à son époque, maîtrisant les sciences rationnelles, l'astronomie et la géométrie, tout en étant versé dans le fiqh hanafite, les usul, l'arabe, l'histoire et la chronologie des hommes. Il fit construire le grand observatoire de Samarcande, attirant des astronomes de tous horizons grâce à de généreux salaires. On disait qu'il n'avait pas mémorisé le Coran, mais il le mémorisa en moins de six mois. Son fils, Abd al-Latif, se rebella, le brisa, s'empara de Samarcande, puis fit assassiner de sang-froid son frère, Abd al-Aziz, sous les yeux de son père (cf. Hadharat-Dhahab, p. 275-277)."
  ur: "الغ بیگ، شاہ رخ کا بیٹا اور تیمور کا پوتا، تیس سال سے زیادہ عرصے سے سمرقند کا بادشاہ تھا - عقلی علوم، فلکیات اور جیومیٹری میں اپنی عمر کے لحاظ سے منفرد، پھر بھی حنفی فقہ، اصول، عربی، تاریخ اور مردوں کے دنوں میں مکمل عبور رکھتا ہے۔ اس نے عظیم سمرقند رصد گاہ بنائی، ہر سہ ماہی سے ماہر فلکیات کو شاہانہ وظیفے پر کھینچ لایا۔ انہوں نے بتایا کہ لوگوں نے کہا کہ اس نے قرآن حفظ نہیں کیا، چھ ماہ سے کم عرصے میں حفظ کر لیا۔ اس کے بیٹے عبداللطیف نے بغاوت کی، اسے توڑ دیا، سمرقند پر قبضہ کر لیا، پھر اپنے بھائی عبد العزیز کو اس کے والد کی آنکھوں کے سامنے سرد خون میں قتل کر دیا۔ 275-277}۔"
  tr: "Herat'ın sahibi Ulugh Bey bin Mu'in al-Din Şah Rukh, Timur Lang'ın oğlu ve adının büyükbabasının adını taşıyan Timur olduğu söylenir; döneminin Muhammed Farid'i ve döneminin tek rasyonel bilim, astronomi ve geometri alanındaki üyesi olarak anılır. Kendi döneminin Hanefi okulunu kapsıyordu. Yaklaşık 790 Hicri yılında doğdu, büyükbabasının zamanında büyüdü ve onun döneminde evlendi. Dedesi onun için ünlü bir düğün düzenledi. Dedesi Timur öldüğünde, konu babası Şah Rukh'a geçti; o da onu Semerkand'a ve işlerine atadı, otuz yıldan fazla bir süre yönetti ve büyük bir gözlemle çalıştı. Son Ölüm yılında inşa etti ve bu amaçla tüm bölgelerden bu alanın bilginlerini topladı, onlara para verdi ve cömertçe yüksek maaşlar verdi, ta ki uzak diyarlardan fizik ve mühendislik bilimcileri ona gelene kadar. Her seçkin kişi ona koştu ve buna rağmen, topraklardaki alimler arasında onu duyanlara dikkat eder ve onu duyanları sormak için gönderirdi; geniş bilgisi, geniş bilgisi ve Hanefi fıkhihi, iki ilke, anlamı, retoriği ve Arapçası'na çok iyi katılımına rağmen Tarih ve halkın günleri. Bazı kenarlarına insanların kendisi hakkında ne söylediğini sorduğu söylenir, bu yüzden ona ısrar etti ve \"Kur'an'ı ezberlemediğini söylüyorlar.\" dedi. Zamanına girdi ve altı aydan kısa sürede ezberledi, oğlu Abdul Latif ona karşı isyan edene kadar Semerkand'da devam etti. Sebebi, babası Herat kralı olduğunda Abdul Latif ona Herat vermeyi umuyordu, ama vermedi. Onu Balkh'a atadı, bu yüzden oğluna itaatsizlik için yazdılar ve o itaatten koptu. Babası haberi duyunca onunla savaşmaya gitti ve görüştü, ve onun görüşüne göre... oğlunun onunla savaşmaya dayanamayacağını belirtti. İki taraf karşılaştığında, bir grup Ulugh Beg prensi oğluna kaçtı, ancak Ulugh Beg yenildi ve kendi oğlu Semerkand'la birlikte kaçtı. Abdul Latif, kardeşi Abdul Aziz'i yakalayıp babası Ulugh Beg'in huzurunda sabırla öldürdü {cite:shadharat-dhahab s. 275-277}."
  id: "Ulugh Bey ibn Mu'in al-Din Shah Rukh, pemilik Herat, putra Timur Lang, dan konon namanya Timur diambil dari kakeknya, dan dikatakan Muhammad Farid pada zamannya dan satu-satunya dari zamannya dalam ilmu rasional, astronomi, dan geometri. Ia mencakup aliran Hanafi pada zamannya. Ia lahir sekitar tahun 790 H, tumbuh besar pada masa kakeknya, dan juga menikah pada masa kakeknya. Kakeknya mengadakan pernikahan terkenal untuknya. Ketika kakeknya Timur meninggal, urusan ini diserahkan kepada ayahnya Shah Rukh, yang mengangkatnya ke Samarkand dan urusannya, memerintahnya selama lebih dari tiga puluh tahun dan bekerja dengan pengamatan yang mendalam. Tamat Ia membangunnya pada tahun kematiannya, dan untuk tujuan ini ia mengumpulkan para cendekiawan di bidang ini dari berbagai wilayah, membelanjakan uang kepada mereka dan dengan murah hati membayar mereka dengan gaji besar, hingga para ilmuwan fisika dan teknik dari negeri jauh datang kepadanya. Setiap orang terhormat bergegas menghampirinya, dan meskipun demikian, ia tetap memperhatikan mereka yang mendengar tentangnya di antara para sarjana di negeri itu dan mengirim surat untuk menanyakan tentang mereka yang mendengarnya, meskipun pengetahuannya luas, luas, dan pengetahuan luas dalam ilmu tersebut, serta partisipasi yang sangat baik dalam hukum Hanafi, dua prinsip, makna, retorika, dan bahasa Arab Sejarah dan hari-hari rakyat. Dikatakan bahwa ia bertanya kepada beberapa orang di pinggirannya apa yang dikatakan orang tentang dirinya, sehingga ia bersikeras, berkata, \"Mereka bilang kau belum menghafal Al-Qur'an.\" Ia memasuki zamannya dan menghafalnya dalam waktu kurang dari enam bulan dengan hafalan, terus berlanjut di Samarkand hingga putranya Abdul Latif memberontak melawannya. Alasannya adalah ketika ayahnya menjadi raja Herat, Abdul Latif berharap memberinya Herat, tetapi ia tidak melakukannya. Ia mengangkatnya ke Balkh, sehingga mereka menulis surat kepada putranya untuk membangkang, dan ia memutuskan ketaatan. Ketika ayahnya mendengar kabar itu, ia pergi melawannya dan bertemu dengannya, dan menurut pendapatnya... bahwa putranya tidak sanggup melawannya. Ketika kedua pihak bertemu, sekelompok pangeran Ulugh Beg melarikan diri ke putranya, tetapi Ulugh Beg dikalahkan dan melarikan diri bersama putranya sendiri, Samarkand. Abdul Latif menangkap saudaranya Abdul Aziz dan membunuhnya dengan sabar di hadapan ayahnya Ulugh Beg {cite:shadharat-dhahab hlm. 275-277}."
