summary:
  ar: "محمد الباجي قائد السبسي (1926–2019)، محام وسياسي تونسي امتدت مسيرته من عهد بورقيبة إلى ما بعد ثورة 2011؛ كان وزيرا للخارجية ورئيسا لمجلس النواب، ثم رئيسا للوزراء سنة 2011، فأسس حزب نداء تونس وفاز بانتخابات 2014 فصار رئيسا لتونس، وتوفي في المنصب في 25 يوليو 2019."
  en: "Mohamed Beji Caid Essebsi (1926–2019) was a Tunisian lawyer and politician whose career ran from Bourguiba's era to after the 2011 revolution: he was foreign minister and speaker of parliament, then prime minister in 2011, founded the Nidaa Tounes party and won the 2014 election to become president of Tunisia, dying in office on 25 July 2019."
  ur: "محمد باجی قائد السبسی (1926ء–2019ء) تیونس کے وکیل اور سیاست دان تھے جن کا کیریئر بورقیبہ کے عہد سے 2011ء کے انقلاب کے بعد تک پھیلا ہوا تھا؛ وہ وزیر خارجہ اور پارلیمنٹ کے اسپیکر رہے، پھر 2011ء میں وزیر اعظم بنے، نداء تونس پارٹی کی بنیاد رکھی اور 2014ء کا انتخاب جیت کر تیونس کے صدر بنے۔ وہ 25 جولائی 2019ء کو عہدے پر رہتے ہوئے وفات پا گئے۔"
