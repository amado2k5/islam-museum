summary:
  ar: "زاغانوس باشا — وفي نص الصلابي «زوغنوش باشا» — قائد في جيش محمد الفاتح، ينقل الكتاب أنه من أصل ألباني كان نصرانياً فأسلم {cite:dawlat-uthmaniyya-salabi p. 105}. في مجلس الشورى عشية الاقتحام العام للقسطنطينية، لما دعا الوزير خليل باشا إلى الانسحاب، صاح زوغنوش بلكنته الأرناؤوطية: «حاشا وكلا أيها السلطان، أنا لا أقبل أبداً ما قاله خليل باشا، فما أتينا هنا إلا لنموت لا لنرجع»، وقال إن جيش الإسكندر الذي قهر نصف آسيا لم يكن أكبر من جيشهم، فأيده القائد طرخان والشيخان آق شمس الدين والكوراني، وظهرت البشرى على وجه الفاتح {cite:dawlat-uthmaniyya-salabi p. 105-106}."
  en: "Zaganos Pasha — spelled 'Zughnush' in al-Salabi's text — a commander in Mehmed II's army whom the book describes as an Albanian-born convert {cite:dawlat-uthmaniyya-salabi p. 105}. At the war council before the final assault, when the vizier Khalil Pasha urged withdrawal, he cried out in his Albanian-accented Turkish: 'God forbid, O Sultan — we came here to die, not to return,' and argued Alexander's army was no larger than theirs; Tarkhan, Aq Shams al-Din and al-Kurani backed him, and joy showed on the Conqueror's face {cite:dawlat-uthmaniyya-salabi p. 105-106}."
  es: "Zaganos Pasha —escrito 'Zughnush' en el texto de al-Salabi— un comandante del ejército de Mehmed II a quien el libro describe como un converso nacido en Albania {cite:dawlat-uthmaniyya-salabi p. 105}. En el consejo de guerra previo al asalto final, cuando el visir Khalil Pasha instó a la retirada, gritó en su turco con acento albanés: '¡Dios no lo quiera, oh sultán! Vinimos aquí para morir, no para regresar', y argumentó que el ejército de Alejandro no era más grande que el suyo; Tarkhan, Aq Shams al-Din y al-Kurani lo apoyaron, y la alegría se reflejó en el rostro del Conquistador {cite:dawlat-uthmaniyya-salabi p. 105-106}."
  fr: "Zaganos Pacha — orthographié « Zughnush » dans le texte d'al-Salabi —, commandant de l'armée de Mehmed II, est décrit dans l'ouvrage comme un Albanais converti (voir: Dawlat-Uthmaniyya-Salabi, p. 105). Lors du conseil de guerre précédant l'assaut final, alors que le vizir Khalil Pacha exhortait à la retraite, il s'écria dans son turc à l'accent albanais: « À Dieu ne plaise, ô Sultan ! Nous sommes venus ici pour mourir, non pour revenir ! » et fit valoir que l'armée d'Alexandre n'était pas plus nombreuse que la leur. Tarkhan, Aq Shams al-Din et al-Kurani le soutinrent, et la joie illumina le visage du Conquérant (voir: Dawlat-Uthmaniyya-Salabi, p. 105-106)."
  ur: "زگانوس پاشا - السلابی کے متن میں 'زغنوش' کا ہجے - محمد دوم کی فوج میں ایک کمانڈر جسے کتاب البانیہ میں پیدا ہونے والے مذہب بدلنے والے کے طور پر بیان کرتی ہے۔ 105}۔ آخری حملے سے پہلے جنگی کونسل میں، جب وزیر خلیل پاشا نے دستبرداری پر زور دیا، تو اس نے اپنے البانوی لہجے میں ترکی میں پکارا: 'خدا نہ کرے، اے سلطان - ہم یہاں مرنے کے لیے آئے ہیں، واپس جانے کے لیے نہیں،' اور دلیل دی کہ سکندر کی فوج ان سے بڑی نہیں تھی۔ ترکھان، آق شمس الدین اور الکرانی نے اس کی حمایت کی، اور فاتح کے چہرے پر خوشی نمودار ہوئی۔ 105-106}۔"
  tr: "Zaganos Paşa — ve Selebi metni \"Zughnoush Pasha\" — Mehmed Fatih'in ordusunun komutanı olan Zaganos Paşa, kitapta Arnavut kökenli olduğu ve İslam'a geçtiği belirtilir {cite:dawlat-uthmaniyya-salabi s. 105}. Konstantinopolis'in genel baskını arifesindeki Şura Konseyi'nde, Bakan Halil Paşa geri çekilme çağrısı yaptığında, Zughnush Arnautik aksanıyla bağırdı: \"Senden uzak değil Sultan, Halil Paşa'nın söylediklerini asla kabul etmem. Buraya sadece ölmek için geldik, geri dönmek için değil.\" Kendisi, Asya'nın yarısını fetheden İskender'in ordusunun ordularından büyük olmadığını, komutan Tarkhan ve iki şeyh Ak Şemseddin ile El-Kurani tarafından desteklendiğini ve fatihin yüzünde müjürün belirdiğini söyledi {cite:dawlat-uthmaniyya-salabi s. 105-106}."
  id: "Zaganos Pasha — dan dalam teks Salabi \"Zughnoush Pasha\" — seorang komandan tentara Mehmed Sang Penakluk, buku tersebut melaporkan bahwa ia berasal dari Albania dan memeluk Islam {cite:dawlat-uthmaniyya-salabi hlm. 105}. Dalam Dewan Syura pada malam sebelum penyerbuan umum Konstantinopel, ketika Menteri Khalil Pasha meminta penarikan, Zughnush berteriak dengan aksen Arnautiknya: \"Jauh dari Anda, Sultan, saya tidak pernah menerima apa yang dikatakan Khalil Pasha. Kami datang ke sini hanya untuk mati, bukan untuk kembali.\" Ia mengatakan bahwa pasukan Alexander, yang menaklukkan setengah Asia, tidak lebih besar dari pasukan mereka, didukung oleh komandan Tarkhan dan dua sheikh Aq Shamseddin dan Al-Kurani, dan kabar baik muncul di wajah sang penakluk {cite:dawlat-uthmaniyya-salabi hlm. 105-106}."
