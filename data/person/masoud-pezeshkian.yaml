summary:
  ar: "مسعود بزشكيان (وُلد 29 أيلول 1954) سياسي وطبيب إيراني، جرّاح قلب ووزير صحة سابق ونائب عن تبريز، رئيس إيران منذ 28 تموز 2024. تولّى الرئاسة بعد فترة قام فيها محمد مخبر بأعمال الرئيس بالوكالة إثر وفاة إبراهيم رئيسي في أيار 2024."
  en: "Masoud Pezeshkian (born 29 September 1954) is an Iranian politician and physician — a cardiac surgeon, former minister of health and long-serving deputy for Tabriz — who has been president of Iran since 28 July 2024. He took office after a period in which Mohammad Mokhber served as acting president following the death of Ebrahim Raisi in May 2024."
