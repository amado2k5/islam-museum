  en: Abu Zakariya al-Hafsi
summary:
  ar: أبو زكريا يحيى بن أبي محمد بن الشيخ أبي حفص الهنتاتي، مؤسس الدولة الحفصية بإفريقية؛ أمير موحدي مخلص حتى خلع المأمون دعوة المهدي، فخلع طاعته بإفريقية سنة 627هـ واستبد بها، وجدّد دولة آل حفص التي ملكت تونس نحو ثلاثة قرون.
  en: Abu Zakariya Yahya ibn Abi Muhammad, grandson of the shaykh Abu Hafs al-Hintati, founder of the Hafsid state in Ifriqiya; a loyal Almohad amir until al-Ma'mun abjured the Mahdi's creed, whereupon he threw off his allegiance in 627 AH and seized Ifriqiya, founding the Hafsid house that ruled Tunis some three centuries.
