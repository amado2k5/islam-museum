summary:
  ar: "واعظ جمعة كردي سوراني من السليمانية في كردستان العراق، جعلت دراسة محكّمة نُشرت سنة 2025 في مجلة التربية للعلوم الإنسانية ⁦(جامعة صلاح الدين – أربيل)⁩ إحدى خطبه للجمعة ومدتها 33 دقيقة موضوعًا لتحليل استراتيجيات الإقناع فيها، والخطبة مأخوذة من يوتيوب. بدأت قناته الرسمية على يوتيوب في 18 أكتوبر 2013، وبلغت 398,000 مشترك و109,650,837 مشاهدة و11,458 مقطعًا بحسب vidIQ كما في 8 نوفمبر 2026، وبلغ حسابه على إنستغرام 785,800 متابع في إدراج فيدسبوت المحدث في 5 نوفمبر 2026."
  en: "Sorani Kurdish Friday preacher of Sulaymaniyah in Iraqi Kurdistan. A peer-reviewed study published in 2025 in the Journal of Education for Humanities (Salahaddin University–Erbil) analyses one of his 33-minute Friday sermons — taken from a YouTube video — for its persuasion strategies, and calls him 'a well-known Kurdish preacher'. His official YouTube channel, started on 18 October 2013, counted 398,000 subscribers, 109,650,837 views and 11,458 videos as read by vidIQ on 8 November 2026, and his Instagram account counted 785,800 followers in Feedspot's listing updated on 5 November 2026."
  ur: "عراقی کردستان کے شہر سلیمانیہ کے سورانی کرد خطیبِ جمعہ۔ جرنل آف ایجوکیشن فار ہیومینٹیز ⁦(صلاح الدین یونیورسٹی – اربیل)⁩ میں 2025ء میں شائع ایک محقق مطالعے نے ان کے 33 منٹ کے ایک خطبۂ جمعہ — جو یوٹیوب ویڈیو سے لیا گیا — کی اقناعی حکمتِ عملیوں کا تجزیہ کیا اور انھیں «ایک معروف کرد واعظ» کہا۔ ان کا سرکاری یوٹیوب چینل 18 اکتوبر 2013ء کو شروع ہوا اور 8 نومبر 2026ء کی vidIQ قرأت کے مطابق اس کے سبسکرائبر 398,000، ویوز 109,650,837 اور ویڈیوز 11,458 تھے، جب کہ ان کے انسٹاگرام اکاؤنٹ کے فالوور 5 نومبر 2026ء کو تازہ شدہ فیڈ اسپاٹ فہرست میں 785,800 تھے۔"
  es: "Sorani, predicador kurdo de los viernes en Sulaymaniyah, Kurdistán iraquí. Un estudio revisado por pares, publicado en 2025 en la Revista de Educación para las Humanidades (Universidad de Salahaddin, Erbil), analiza uno de sus sermones de los viernes de 33 minutos (extraído de un vídeo de YouTube) para analizar sus estrategias de persuasión y lo describe como un \"reconocido predicador kurdo\". Su canal oficial de YouTube, creado el 18 de octubre de 2013, contaba con 398 000 suscriptores, 109 650 837 visualizaciones y 11 458 vídeos, según datos de vidIQ del 8 de noviembre de 2026. Su cuenta de Instagram tenía 785 800 seguidores, según la lista de Feedspot actualizada el 5 de noviembre de 2026."
  fr: "Sorani, prédicateur kurde du vendredi à Souleimaniye, au Kurdistan irakien, fait l'objet d'une étude évaluée par des pairs et publiée en 2025 dans le Journal of Education for Humanities (Université Salahaddin d'Erbil). Cette étude analyse l'un de ses sermons du vendredi de 33 minutes, extrait d'une vidéo YouTube, afin d'en étudier les stratégies de persuasion et le qualifie de « prédicateur kurde renommé ». Sa chaîne YouTube officielle, créée le 18 octobre 2013, comptait 398 000 abonnés, 109 650 837 vues et 11 458 vidéos, selon les données de vidIQ du 8 novembre 2026. Son compte Instagram, quant à lui, affichait 785 800 abonnés d'après le classement de Feedspot mis à jour le 5 novembre 2026."
  tr: "Irak Kürdistanı'nın Süleymaniye kentinden Juma vaizi Kurdi Sorani, 2025 yılında Cuma vaazlarından biri olan Journal of Education for Humanities'te (Salahaddin Üniversitesi – Erbil) yayımlanan hakemli bir çalışmayı yayımladı; vaaz ikna stratejilerinin analiz konusu oldu ve vaaz YouTube'dan alındı. Resmi YouTube kanalı 18 Ekim 2013'te açıldı ve vidIQ'ya göre 8 Kasım 2026 itibarıyla 398.000 abone, 109.650.837 izlenme ve 11.458 klip ulaştı. Instagram hesabı, 5 Kasım 2026'daki güncellenmiş Fedspot gönderisinde 785.800 takipçiye sahipti."
  id: "Pengkhotbah Juma, Kurdi Sorani dari Sulaymaniyah di Kurdistan Irak, melakukan studi peer-review yang diterbitkan pada tahun 2025 di Journal of Education for Humanities (Universitas Salahaddin – Erbil) salah satu khotbah Jumatnya, yang berdurasi 33 menit, dengan topik analisis strategi persuasi, dan khotbah tersebut diambil dari YouTube. Saluran YouTube resminya diluncurkan pada 18 Oktober 2013, mencapai 398.000 pelanggan, 109.650.837 penayangan, dan 11.458 klip menurut vidIQ per 8 November 2026. Akun Instagram-nya memiliki 785.800 pengikut dalam posting Fedspot yang diperbarui pada 5 November 2026."
