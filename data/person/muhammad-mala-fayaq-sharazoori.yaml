summary:
  ar: "واعظ جمعة كردي سوراني من السليمانية في كردستان العراق، جعلت دراسة محكّمة نُشرت سنة 2025 في مجلة التربية للعلوم الإنسانية ⁦(جامعة صلاح الدين – أربيل)⁩ إحدى خطبه للجمعة ومدتها 33 دقيقة موضوعًا لتحليل استراتيجيات الإقناع فيها، والخطبة مأخوذة من يوتيوب. بدأت قناته الرسمية على يوتيوب في 18 أكتوبر 2013، وبلغت 398,000 مشترك و109,650,837 مشاهدة و11,458 مقطعًا بحسب vidIQ كما في 8 نوفمبر 2026، وبلغ حسابه على إنستغرام 785,800 متابع في إدراج فيدسبوت المحدث في 5 نوفمبر 2026."
  en: "Sorani Kurdish Friday preacher of Sulaymaniyah in Iraqi Kurdistan. A peer-reviewed study published in 2025 in the Journal of Education for Humanities (Salahaddin University–Erbil) analyses one of his 33-minute Friday sermons — taken from a YouTube video — for its persuasion strategies, and calls him 'a well-known Kurdish preacher'. His official YouTube channel, started on 18 October 2013, counted 398,000 subscribers, 109,650,837 views and 11,458 videos as read by vidIQ on 8 November 2026, and his Instagram account counted 785,800 followers in Feedspot's listing updated on 5 November 2026."
  ur: "عراقی کردستان کے شہر سلیمانیہ کے سورانی کرد خطیبِ جمعہ۔ جرنل آف ایجوکیشن فار ہیومینٹیز ⁦(صلاح الدین یونیورسٹی – اربیل)⁩ میں 2025ء میں شائع ایک محقق مطالعے نے ان کے 33 منٹ کے ایک خطبۂ جمعہ — جو یوٹیوب ویڈیو سے لیا گیا — کی اقناعی حکمتِ عملیوں کا تجزیہ کیا اور انھیں «ایک معروف کرد واعظ» کہا۔ ان کا سرکاری یوٹیوب چینل 18 اکتوبر 2013ء کو شروع ہوا اور 8 نومبر 2026ء کی vidIQ قرأت کے مطابق اس کے سبسکرائبر 398,000، ویوز 109,650,837 اور ویڈیوز 11,458 تھے، جب کہ ان کے انسٹاگرام اکاؤنٹ کے فالوور 5 نومبر 2026ء کو تازہ شدہ فیڈ اسپاٹ فہرست میں 785,800 تھے۔"
