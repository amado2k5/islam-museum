summary:
  ar: "قائد ثار بالثغر الشامي فأسرع المعتضد السير من بغداد ساتراً أخباره حتى عبر الفرات وجرد القواد في طلبه فقاتلهم وصيف بدرب الجب حتى خذله أصحابه فأسر سنة ثمان وثمانين ومائتين، وأدخل مدينة السلام على جمل فالج عليه دراعة ديباج وبرنس، وأراد المعتضد استحياءه لشهامته ثم قال ليس في طبع هذا الخادم أن يرأسه أحد بل أن يرؤس في نفسه، ولما سئل عن شهوته قال باقة من الريحان أشمها وكتب من سير الملوك الغابرة أنظر فيها فتعجب المعتضد وقال هو يهون على نفسه الموت، وتوفي أول يوم من سنة تسع وثمانين فصلب على الجسر بدناً بلا رأس ملفوفاً مطلياً بالصبر والأطلية فأقام مصلوباً لا يبلى إلى سنة ثلثمائة، حتى حطته العامة تماجناً وشيعته نحو مائة ألف يرقصون ويصيحون الأستاذ الأستاذ ثم طرحوه في دجلة {cite:muruj-al-dhahab p. 627-629}."
  en: "The rebel chamberlain of the Syrian march — hunted down at Darb al-Jubb, he asked only for basil and the histories of kings before dying; his treated body hung on the bridge until 300 AH when the mob fished it down crying 'the Teacher' {cite:muruj-al-dhahab p. 627-629}."
  es: "El chambelán rebelde de la marcha siria, perseguido en Darb al-Jubb, solo pidió albahaca y las historias de los reyes antes de morir; su cuerpo, tratado, permaneció colgado del puente hasta el año 300 AH, cuando la multitud lo descolgó gritando \"el Maestro\" {cite:muruj-al-dhahab p. 627-629}."
  fr: "Le chambellan rebelle de la marche syrienne — traqué à Darb al-Jubb, il ne demanda que du basilic et les histoires des rois avant de mourir; son corps soigné resta suspendu au pont jusqu'en 300 AH, date à laquelle la foule le repêcha en criant « le Maître » {cite:muruj-al-dhahab p. 627-629}."
  ur: "شامی مارچ کے باغی چیمبرلین — دارب الجب میں شکار کیا گیا، اس نے مرنے سے پہلے صرف تلسی اور بادشاہوں کی تاریخیں مانگیں۔ اس کی زیر علاج لاش 300 ہجری تک پل پر لٹکی رہی جب ہجوم نے 'استاد' کے نعرے لگاتے ہوئے اسے نیچے پھینک دیا۔ 627-629}۔"
  tr: "Suriye sınırında isyan eden bir komutan olan Al-Mu'tadid Bağdat'tan aceleyle ayrıldı, haberini örtbas etti, sonra Fırat'ı geçip komutanları onu aramaya topladı. Onlarla ve bir yaz askeriyle tepenin yolunda savaştı, ta ki yoldaşları onu terk edene kadar; bu yüzden 288 H. yılında yakalandı ve brokarlarla kaplı bir deve ile bir gelinle Barış Şehri'ne girdi. Al-Mu'tadid şövalyeliği nedeniyle ona utanç göstermek istedi ama şöyle dedi: 'Bu hizmetçinin doğasında kimse tarafından yönetilmek değil, kendi başına yönlendirilmek vardır.' Arzusu sorulduğunda, fesleğen buketi kokusu aldığını ve eski kralların biyografilerinden bahsettiğini söyledi Al-Mu'tadid şaşırdı ve ölümü kendine kolaylaştırdığını söyledi. Seksen dokuzuncu yılın ilk gününde, başsız bir bedeni sedir ve alçıya sarılmış halde köprüde çarmıha gerildi ve 300 yılına kadar çarmıha gerildi; o yıl Tamajna'nın halkı ve yaklaşık yüz bin kişi onu durdurup dans ederek 'Ustad al-Ustad' diye bağırarak durdurdu, ardından onu Dicle'ye attılar {cite:muruj-al-dhahab, s. 627-629}."
  id: "Seorang komandan yang memberontak di perbatasan Suriah, maka Al-Mu'tadid segera meninggalkan Baghdad, meliput beritanya sampai ia menyeberangi Sungai Efrat dan mengumpulkan para komandan untuk mencarinya. Ia melawan mereka dan seorang prajurit musim panas di jalan bukit sampai rekan-rekannya meninggalkannya, sehingga ia ditangkap pada tahun 288 H, dan masuk ke Kota Damai dengan unta yang dipenuhi brokat dan seorang pengantin. Al-Mu'tadid ingin mempermalukan dirinya karena kesatriaannya, tetapi ia berkata, 'Bukan sifat pelayan ini dipimpin oleh siapa pun, melainkan dipimpin oleh dirinya sendiri.' Ketika ditanya tentang keinginannya, ia mengatakan ia bisa mencium aroma setangkai basil dan menulis tentang biografi raja-raja kuno untuk dilihat Al-Mu'tadid terkejut dan berkata bahwa ia mempermudah kematian bagi dirinya sendiri. Ia meninggal pada hari pertama tahun delapan puluh sembilan, disalibkan di jembatan dengan tubuh tanpa kepala yang dibalut kayu cedar dan plester, dan berdiri disalibkan hingga tahun 300, ketika rakyat biasa Tamajna dan sekitar seratus ribu orang menghentikannya, menari dan berteriak 'Ustad al-Ustadh,' lalu mereka melemparkannya ke Sungai Tigris {cite:muruj-al-dhahab, hlm. 627-629}."
