label: { ar: "وصيف الخادم", en: "Wasif al-Khadim" }
summary:
  ar: "قائد ثار بالثغر الشامي فأسرع المعتضد السير من بغداد ساتراً أخباره حتى عبر الفرات وجرد القواد في طلبه فقاتلهم وصيف بدرب الجب حتى خذله أصحابه فأسر سنة ثمان وثمانين ومائتين، وأدخل مدينة السلام على جمل فالج عليه دراعة ديباج وبرنس، وأراد المعتضد استحياءه لشهامته ثم قال ليس في طبع هذا الخادم أن يرأسه أحد بل أن يرؤس في نفسه، ولما سئل عن شهوته قال باقة من الريحان أشمها وكتب من سير الملوك الغابرة أنظر فيها فتعجب المعتضد وقال هو يهون على نفسه الموت، وتوفي أول يوم من سنة تسع وثمانين فصلب على الجسر بدناً بلا رأس ملفوفاً مطلياً بالصبر والأطلية فأقام مصلوباً لا يبلى إلى سنة ثلثمائة، حتى حطته العامة تماجناً وشيعته نحو مائة ألف يرقصون ويصيحون الأستاذ الأستاذ ثم طرحوه في دجلة {cite:muruj-al-dhahab p. 627-629}."
  en: "The rebel chamberlain of the Syrian march — hunted down at Darb al-Jubb, he asked only for basil and the histories of kings before dying; his treated body hung on the bridge until 300 AH when the mob fished it down crying 'the Teacher' {cite:muruj-al-dhahab p. 627-629}."
