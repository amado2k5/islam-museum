summary:
  ar: "عالم وأديب سندي (1853-1929) من حيدر آباد بالسند، خدم في القضاء البريطاني ثلاثين عامًا حتى تقاعد سنة 1910، ولقّبته الحكومة البريطانية «شمس العلماء». كتب وترجم نحو 457 كتابًا في ثماني لغات وفي 43 علمًا، منها أول رواية سندية «زينت»، وترجمة «چچ نامہ» من الفارسية إلى الإنجليزية، ودراسات مؤسِّسة عن الشاه عبد اللطيف البهتائي وشعره، وسيرته الذاتية «سائو پن كارو پنو»."
  en: "Sindhi scholar and man of letters (1853–1929) of Hyderabad, Sindh, who served thirty years in the British judicial service before retiring in 1910, and was titled Shams-ul-Ulama ('Sun of the Scholars') by the British government of India. He wrote and translated some 457 books in eight languages across 43 disciplines, among them Zeenat, the first Sindhi novel, a translation of the Chach Nama from Persian into English, foundational studies of Shah Abdul Latif Bhittai and his poetry, and his autobiography Sao Pan Karo Pano."
  ur: "سندھی عالم و ادیب (1853-1929)، حیدرآباد سندھ سے؛ برطانوی عدالتی ملازمت میں تیس برس گزار کر 1910 میں ریٹائر ہوئے اور برطانوی حکومت نے انہیں «شمس العلما» کا خطاب دیا۔ انہوں نے آٹھ زبانوں اور 43 علوم میں تقریباً 457 کتابیں لکھیں اور ترجمہ کیں، جن میں پہلا سندھی ناول «زینت»، چچ نامے کا فارسی سے انگریزی ترجمہ، شاہ عبد اللطیف بھٹائی پر بنیادی مطالعات اور خودنوشت «سائو پن یا کارو پنو» شامل ہیں۔"
