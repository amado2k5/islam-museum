id: person/al-shaabi
class: person
label: { ar: "الشعبي", en: "al-Sha'bi" }
summary:
  ar: "عامر بن شراحيل الشعبي فقيه الكوفة؛ دخل الري مع قتيبة بن مسلم فسأله ما أحب الشراب إليك فقال أهونه وجوداً وأعزه فقداً.، ونادمه عبد الملك بن مروان فلم يجد غيره لمنادمته، وعلمه عبد الملك مهب الرياح: الشمال من مطلع بنات نعش إلى مطلع الشمس، والصبا من مطلع الشمس إلى مطلع سهيل، والجنوب من مطلع سهيل إلى مغرب الشمس، والدبور من مغرب الشمس إلى مطلع بنات نعش {cite:muruj-al-dhahab p. 87}، وقال عمر بن هبيرة مع ابن سيرين قولاً فيه تقية حين سألهم سنة ثلاث ومائة، ولما أضعف جائزة الحسن قال سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}"
  en: "Amir ibn Sharahil al-Sha'bi, Kufa's jurist; entered Rayy with Qutayba ibn Muslim, who asked him what drink he loved most — 'the easiest found and the dearest lost', he said."
