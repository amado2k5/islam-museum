gender: male
summary:
  ar: "علم الدين البلقيني الشافعي المصري القاضي الناسخ شيخ الإسلام حامل لواء الشافعية في عصره؛ ولد سنة خمس عشرة وثمانمائة وتفقه بعلماء عصره كالزين العراقي والعلاء الطبري والشيخ ابن عم مؤلف شذرات الذهب الشيخ عبد الرحيم وغيرهم وحفظ في المذهب كثيراً وتخصص بالفتوى في بلده من صغره ولم يكن ابن العشرين، وولي قضاء دمشق والديار المصرية وإن رفض الكثير من أشيائها وبقى في القضاء ستة وعشرين سنة وبضعة أشهر، وكان يحفظ القرآن وأصلاً من منطق ويصفه الناس بالبراعة وإن كان مدته بها قليلاً، توفي في يوم الأربعاء خامس ليلة بقيت من رجب سنة ثمان وستين وثمانمائة {cite:shadharat-dhahab p. 308}."
  en: "'Ilm al-Din al-Bulqini (b. 815) — 'shaykh al-Islam, bearer of the Shafi'i banner of his age'; grandson of Siraj al-Din, qadi of Damascus and Egypt over twenty-six years though he refused much of its pomp; al-Iraqi and al-Tabari among his teachers; died Wed 5-nights-remaining of Rajab 868 {cite:shadharat-dhahab p. 308}."
