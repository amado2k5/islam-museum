gender: male
summary:
  ar: "علم الدين البلقيني الشافعي المصري القاضي الناسخ شيخ الإسلام حامل لواء الشافعية في عصره؛ ولد سنة خمس عشرة وثمانمائة وتفقه بعلماء عصره كالزين العراقي والعلاء الطبري والشيخ ابن عم مؤلف شذرات الذهب الشيخ عبد الرحيم وغيرهم وحفظ في المذهب كثيراً وتخصص بالفتوى في بلده من صغره ولم يكن ابن العشرين، وولي قضاء دمشق والديار المصرية وإن رفض الكثير من أشيائها وبقى في القضاء ستة وعشرين سنة وبضعة أشهر، وكان يحفظ القرآن وأصلاً من منطق ويصفه الناس بالبراعة وإن كان مدته بها قليلاً، توفي في يوم الأربعاء خامس ليلة بقيت من رجب سنة ثمان وستين وثمانمائة {cite:shadharat-dhahab p. 308}."
  en: "'Ilm al-Din al-Bulqini (b. 815) — 'shaykh al-Islam, bearer of the Shafi'i banner of his age'; grandson of Siraj al-Din, qadi of Damascus and Egypt over twenty-six years though he refused much of its pomp; al-Iraqi and al-Tabari among his teachers; died Wed 5-nights-remaining of Rajab 868 {cite:shadharat-dhahab p. 308}."
  es: "'Ilm al-Din al-Bulqini (n. 815) — 'shaykh al-Islam, portador del estandarte shafi'í de su época'; nieto de Siraj al-Din, cadí de Damasco y Egipto durante veintiséis años, aunque rechazó gran parte de su pompa; al-Iraqi y al-Tabari estuvieron entre sus maestros; murió el miércoles de la quinta noche restante de Rajab 868 {cita: shadharat-dhahab p. 308}."
  fr: "'Ilm al-Din al-Bulqini (né en 815) — 'cheikh al-Islam, porteur de l'étendard shafi'i de son époque'; petit-fils de Siraj al-Din, cadi de Damas et d'Égypte pendant plus de vingt-six ans, bien qu'il ait refusé une grande partie de son faste; al-Iraqi et al-Tabari parmi ses maîtres; décédé le mercredi 5e jour restant de Rajab 868 {cite: shadharat-dhahab p. 308}."
  ur: "علم الدین البلقینی ⁦(وفات 815)⁩ - 'شیخ الاسلام، اپنے دور کے شافعی جھنڈے کے علمبردار'؛ سراج الدین کا پوتا، دمشق اور مصر کا قادی، چھبیس سال سے زیادہ عرصہ گزرا حالانکہ اس نے اس کی بہت زیادہ شان سے انکار کیا تھا۔ اس کے اساتذہ میں العراقی اور الطبری؛ وفات بروز بدھ 5 راتیں باقی رہ گئی رجب 868۔ 308}۔"
  tr: "Ilm al-Din el-Balqini, Şafii el-Masri, yargıç, yazıcı, Şeyh al-İslam, zamanının Şafii okulunun bayrak taşıyıcısı; 1500 Hicri yılında doğmuş, zamanının alimlerinden al-Zeyn el-Iraki, el-Alaa el-Tabari, Şeyh İbn İbn el-Zahab gibi alimlerin yanında fıkıh eğitimi aldı; Şeyh Abdul Rahim ve diğerleri. Düşünce okulunu ezberledi ve yirmi yaşından önce küçük yaşlardan itibaren kasabasında fetva yayımlamada uzmanlaştı. Şam ve Mısır'da yargıç olarak görev yaptı, ancak çoğunu reddetti. Yirmi altı yıl birkaç ay yargıda kaldı. Kur'an'ı ve mantıklı bir ilkeyi ezberledi, insanlar onu yetenekli olarak tanımladı, görev süresi kısa olsa da. 868 Hicri'nin Recep ayının beşinci gecesi Çarşamba günü vefat etti. Shadharat-Dhahab, s. 308}."
  id: "Ilm al-Din al-Balqini, Shafi'i al-Masri, hakim, juru tulis, Sheikh al-Islam, pembawa panji mazhab Shafi'i pada zamannya; lahir pada tahun 1500 H, mempelajari hukum di bawah bimbingan ulama zamannya seperti al-Zain al-Iraqi, al-Alaa al-Tabari, Sheikh Ibn Ibn al-Ibn al-Ibn al-Dhahab, penulis Shadharat al-Dhahab, Sheikh Abdul Rahim, dan lainnya. Ia menghafal aliran pemikiran secara luas dan mengkhususkan diri dalam mengeluarkan fatwa di kotanya sejak usia muda sebelum usia dua puluh tahun. Ia menjabat sebagai hakim Damaskus dan Mesir, meskipun menolak banyak di antaranya. Ia tetap berada di lembaga peradilan selama dua puluh enam tahun beberapa bulan. Ia menghafal Al-Qur'an dan prinsip logika, dan orang-orang menggambarkannya sebagai terampil, meskipun masa jabatannya singkat. Ia meninggal pada hari Rabu, malam kelima Rajab, 868 H. {cite::Shadharat-Dhahab, hlm. 308}."
