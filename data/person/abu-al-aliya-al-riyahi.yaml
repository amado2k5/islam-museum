summary:
  ar: "أبو العالية الرياحي، رفيع بن مهران البصري التابعي؛ يفرد له أحمد بن حنبل في كتاب الزهد باباً فيه قوله إنه يأتي على الناس زمان تخرب فيه صدورهم من القرآن، وقوله إن الصائم في عبادة ما لم يغتب {cite:zuhd-ahmad-dkim-1983 p. 371}."
  en: "Abu al-Aliya al-Riyahi, Rufay' ibn Mihran, the Basran Successor; Ahmad ibn Hanbal gives him a chapter of Kitab al-Zuhd, with his saying that a time will come when people's breasts are emptied of the Qur'an, and that one who fasts is in worship as long as he does not backbite {cite:zuhd-ahmad-dkim-1983 p. 371}."
  ur: "ابو العالیہ ریاحی، رفیع بن مہران بصری تابعی؛ احمد بن حنبل کتاب الزہد میں ان کے لیے ایک باب لاتے ہیں جس میں ان کا یہ قول ہے کہ لوگوں پر ایسا زمانہ آئے گا جب ان کے سینے قرآن سے ویران ہو جائیں گے، اور یہ کہ روزہ دار جب تک غیبت نہ کرے عبادت میں ہے {cite:zuhd-ahmad-dkim-1983 p. 371}۔"
