roles: [muhaddith]
gender: male
summary:
  ar: "أبو العالية الرياحي، رفيع بن مهران البصري التابعي؛ يفرد له أحمد بن حنبل في كتاب الزهد باباً فيه قوله إنه يأتي على الناس زمان تخرب فيه صدورهم من القرآن، وقوله إن الصائم في عبادة ما لم يغتب {cite:zuhd-ahmad-dkim-1983 p. 371}."
  en: "Abu al-Aliya al-Riyahi, Rufay' ibn Mihran, the Basran Successor; Ahmad ibn Hanbal gives him a chapter of Kitab al-Zuhd, with his saying that a time will come when people's breasts are emptied of the Qur'an, and that one who fasts is in worship as long as he does not backbite {cite:zuhd-ahmad-dkim-1983 p. 371}."
  ur: "ابو العالیہ ریاحی، رفیع بن مہران بصری تابعی؛ احمد بن حنبل کتاب الزہد میں ان کے لیے ایک باب لاتے ہیں جس میں ان کا یہ قول ہے کہ لوگوں پر ایسا زمانہ آئے گا جب ان کے سینے قرآن سے ویران ہو جائیں گے، اور یہ کہ روزہ دار جب تک غیبت نہ کرے عبادت میں ہے {cite:zuhd-ahmad-dkim-1983 p. 371}۔"
  fr: "Abu al-Aliya al-Riyahi, Rufay' ibn Mihran, le Successeur de Bassora ; Ahmad ibn Hanbal lui consacre un chapitre du Kitab al-Zuhd, avec sa parole selon laquelle viendra un temps où les poitrines des gens seront vidées du Coran, et que celui qui jeûne est en adoration tant qu'il ne médit pas {cite:zuhd-ahmad-dkim-1983 p. 371}."
  es: "Abu al-Aliya al-Riyahi, Rufay' ibn Mihran, el Sucesor de Basran; Ahmad ibn Hanbal le dedica un capítulo del Kitab al-Zuhd, con su dicho de que llegará un tiempo en que los pechos de la gente se vaciarán del Corán, y que quien ayuna está en adoración mientras no difame {cite:zuhd-ahmad-dkim-1983 p. 371}."
  tr: "Ebu el-Aliye el-Riyahi, Rafi' bin Mihran el-Basri el-Tabi'i; Ahmed bin Hanbel, zühd kitabında ona bir bölüm ayırmış ve orada insanların kalplerinin Kur'an'dan uzaklaşacağı bir zamanın geleceğini, oruç tutanın gıybet etmediği sürece ibadet halinde olduğunu söylemiştir. {Kaynak:zuhd-ahmad-dkim-1983 s. 371}."
  id: "Abu Al-Aliyah Al-Riyahi, Rafi’ bin Mihran Al-Basri Al-Tabi’i; Ahmad bin Hanbal mendedikasikan sebuah bab untuknya dalam kitab tentang keistimewaan, di mana beliau mengatakan bahwa akan datang suatu masa ketika hati manusia akan rusak karena Al-Qur'an, dan beliau mengatakan bahwa orang yang berpuasa tetap beribadah selama ia tidak bergunjing {cite:zuhd-ahmad-dkim-1983 p. 371}."
