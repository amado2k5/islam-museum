label: { ar: "نصير الدين الطوسي" }
summary:
  ar: "نصير الدين محمد بن محمد بن الحسن الطوسي (ت 672هـ/1274م) عالم غزير التأليف في الفلك والرياضيات والفلسفة والكلام والأخلاق، وُلد في طوس وخدم البلاطات الإسماعيلية في قهستان وألموت ثم حاشية هولاكو، وأشرف على مرصد مراغة. تنسب إليه دائرة المعارف الإسلامية نظرية فلكية مبتكرة في حركة الكواكب تعرف بزوج الطوسي، وكتاب تجريد الاعتقاد الذي صار مرجعًا في الكلام الإمامي. وهو مؤلف أخلاق ناصري الفارسي بقهستان لأميرها ناصر الدين عبد الرحيم المحتشم {cite:kashf-zunun-furqan p. 268}."
  en: "Nasir al-Din Muhammad ibn Muhammad ibn al-Hasan al-Tusi (d. AH 672/1274 CE) was a prolific scholar of astronomy, mathematics, philosophy, theology and ethics, born at Tus, who served the Isma'ili courts of Quhistan and Alamut and then the entourage of Hulagu, and directed the Maragha observatory. The Encyclopaedia of Islam credits him with an original planetary model, the Tusi couple, and with the Tajrid al-i'tiqad, an authoritative Twelver Shi'i theological text. He composed his Persian Akhlaq-i Nasiri in Quhistan for its amir {cite:kashf-zunun-furqan p. 268}."
  ur: "نصیر الدین محمد بن محمد بن الحسن الطوسی، متوفی 672ھ/1274ء، فلکیات، ریاضی، فلسفہ، کلام اور اخلاق کے کثیر التصنیف عالم تھے، طوس میں پیدا ہوئے، قہستان اور الموت کے اسماعیلی درباروں اور پھر ہلاکو کی مجلس میں رہے، اور مراغہ کی رصدگاہ کے ناظم بنے۔ دائرۃ المعارف الاسلامیہ ان سے سیاروں کی حرکت کا اصیل ماڈل، جو طوسی جوڑا کہلاتا ہے، اور اثنا عشری شیعہ کلام کی مستند کتاب تجرید الاعتقاد منسوب کرتی ہے۔ انہوں نے اپنی فارسی کتاب اخلاقِ ناصری قہستان کے امیر کے لیے لکھی {cite:kashf-zunun-furqan p. 268}۔"
