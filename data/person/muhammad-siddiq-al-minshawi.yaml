summary:
  ar: "قارئ قرآن مصري (1920–1969) وُلد في المنشاة بمحافظة سوهاج في أسرة من القرّاء، وقُبل قارئا في الإذاعة المصرية سنة 1953، وسجّل المصحف المرتل كاملا برواية حفص عن عاصم، واشتهر بصوته الخاشع ذي المسحة الحزينة حتى لُقّب بـ«الصوت الباكي»."
  en: "Egyptian Qur'an reciter (1920–1969), born at al-Munsha'ah in Sohag into a family of reciters. Accepted as an Egyptian Radio reciter in 1953, he recorded the complete murattal Qur'an in the Hafs recitation and was famed for his sorrow-tinged voice, which earned him the epithet 'the Weeping Voice'."
  ur: "مصری قاری قرآن (1920ء–1969ء)، سوہاگ کے علاقے المنشاۃ میں قراء کے خاندان میں پیدا ہوئے۔ 1953ء میں مصری ریڈیو کے قاری مقرر ہوئے، روایت حفص میں مکمل مصحف مرتل ریکارڈ کیا، اور اپنی پرخلوص غم آلود آواز کی وجہ سے «الصوت الباکی» (رونے والی آواز) کے لقب سے مشہور ہوئے۔"
