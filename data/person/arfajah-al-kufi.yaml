summary:
  ar: "عرفجة الكوفي، مشهور في القانتين، معروف في العابدين، كان يحيي الليل صلاة؛ ذكرت أمه في منامها أن رجالًا وقفوا عليها يسألونها لماذا أذنت له بزيارتهم تلك الليلة."
  en: "Arfajah al-Kufi, known among the devout and the worshippers, who kept vigil in prayer through the night; his mother related a dream in which men stood over her asking why she had let him visit them that night."
  ur: "عرفجہ کوفی قانتین میں مشہور اور عابدوں میں معروف تھے، جو رات بھر نماز میں جاگتے۔ ان کی والدہ نے خواب میں دیکھا کہ کچھ لوگ ان کے پاس کھڑے ہو کر پوچھ رہے ہیں کہ تم نے اسے اس رات ہمارے پاس آنے کی اجازت کیوں دی۔"
  es: "Arfajah al-Kufi, conocido entre los devotos y los fieles, permanecía en vigilia orando durante toda la noche; su madre relató un sueño en el que unos hombres se paraban frente a ella preguntándole por qué le había permitido visitarlos esa noche."
  fr: "Arfajah al-Kufi, connu parmi les dévots et les adorateurs, qui veillait en prière toute la nuit; sa mère raconta un rêve dans lequel des hommes se tenaient au-dessus d'elle et lui demandaient pourquoi elle l'avait laissé leur rendre visite cette nuit-là."
  tr: "İki dindar ibadet edeniyle ünlü Arfajah el-Kufi geceyi namaz kılarak geçirirdi; annesi rüyasında, erkeklerin yanında durup neden o gece onları ziyaret etmesine izin verdiğini sorduklarını hatırladı."
  id: "Arfajah al-Kufi, yang terkenal dengan dua pemuja yang taat, biasa menghabiskan malam berdoa; ibunya mengenang dalam mimpinya bahwa pria-pria berdiri di sampingnya menanyakan mengapa dia mengizinkannya mengunjungi mereka malam itu."
