label: { ar: "مرة مولى أبي بكر", en: "Murra, Abu Bakr's Mawla" }
summary:
  ar: "مرة مولى عبد الرحمن بن أبي بكر الصديق؛ كان سرياً فسأل عائشة أن تكتب له إلى زياد وتبدأ به في عنوان كتابها فكتبت له بالوصاية به وعنونته إلى زياد بن أبي سفيان فلما رأى زياد أنها قد نسبته إلى أبي سفيان سرّ بذلك وأكرم مرة وعرض كتابها على الناس ليقرأوا عنوانه ثم أقطعه مائة جريب على نهر الأبلة وأمره فحفر لها نهراً فنسب إليه وكان عثمان بن مرة من سراة أهل البصرة وخرجت القطيعة من أيدي ولده فصارت لآل الصفاق بن حجر بن يجير العقوي من الأزد."
  en: "Murra, mawla of Abd al-Rahman ibn Abi Bakr — a freedman of standing; he asked Aisha to write Ziyad and open her address with 'Ziyad ibn Abi Sufyan' — she did, and Ziyad, delighted at the kinship-title, honoured Murra, displayed the letter's superscription to the people, granted him a hundred jarib on the Ubulla canal and bade him dig its canal, which bears his name. His son Uthman was among Basra's notables; the qati'a left his descendants for the Al al-Saffaq ibn Hujr ibn Yujayr al-Iqawi of Azd."
