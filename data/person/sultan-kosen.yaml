summary:
  ar: "مزارع تركي من محافظة ماردين، وُلد سنة 1982، يحمل الرقم القياسي في موسوعة غينيس لأطول رجل حي في العالم بطول 251 سم، وله أكبر يدين مقاستين لشخص حي. نموّه الاستثنائي سببه ورم في الغدة النخامية، وقد أوقف العلاج نموّه سنة 2012."
  en: "Turkish farmer from Mardin Province, born in 1982, who holds the Guinness World Record as the tallest living man at 251 cm, with the largest hands measured on a living person. His exceptional growth was caused by a pituitary tumour, and treatment halted his growth in 2012."
