summary:
  ar: "مزارع تركي من محافظة ماردين، وُلد سنة 1982، يحمل الرقم القياسي في موسوعة غينيس لأطول رجل حي في العالم بطول 251 سم، وله أكبر يدين مقاستين لشخص حي. نموّه الاستثنائي سببه ورم في الغدة النخامية، وقد أوقف العلاج نموّه سنة 2012."
  en: "Turkish farmer from Mardin Province, born in 1982, who holds the Guinness World Record as the tallest living man at 251 cm, with the largest hands measured on a living person. His exceptional growth was caused by a pituitary tumour, and treatment halted his growth in 2012."
  ur: "مردین صوبے کے ترک کسان، جو 1982 میں پیدا ہوئے اور 251 سینٹی میٹر قد کے ساتھ دنیا کے سب سے لمبے زندہ انسان کا گنیز عالمی ریکارڈ رکھتے ہیں۔ ان کا غیر معمولی قد پیٹیوٹری رسولی کی وجہ سے تھا، اور 2012 میں علاج سے ان کا بڑھنا رک گیا۔"
  es: "Un agricultor turco de la provincia de Mardin, nacido en 1982, ostenta el récord Guinness como el hombre vivo más alto del mundo con 251 cm, y posee las manos más grandes medidas en una persona viva. Su crecimiento excepcional se debió a un tumor hipofisario, y el tratamiento detuvo su expansión en 2012."
  fr: "Ce fermier turc de la province de Mardin, né en 1982, détient le record du monde Guinness de l'homme vivant le plus grand (251 cm) et possède les plus grandes mains jamais mesurées chez une personne vivante. Sa croissance exceptionnelle était due à une tumeur hypophysaire, et un traitement a permis de stopper sa croissance en 2012."
  tr: "1982 doğumlu Mardin vilayetinden Türk çiftçi, 251 cm uzunluğuyla dünyanın en uzun yaşayan erkeği olarak Guinness Dünya Rekoru sahibidir ve yaşayan bir insan büyüklüğünde en büyük iki eline sahiptir. Olağanüstü büyümesi, hipofiz bezindeki bir tümör nedeniyle oluştu ve tedavi 2012'de büyümesini durdurdu."
  id: "Seorang petani Turki dari provinsi Mardin, lahir pada tahun 1982, memegang Rekor Dunia Guinness untuk pria terlama di dunia dengan panjang 251 cm, dan memiliki dua tangan terbesar sebesar orang yang masih hidup. Pertumbuhan luar biasanya disebabkan oleh tumor di kelenjar pituitari, dan pengobatan menghentikan pertumbuhannya pada tahun 2012."
