summary:
  ar: أخت الضحاك بن قيس، من المهاجرات الأول وذات جمال وعقل؛ طلقها أبو بكر بن حفص المخزومي فتزوجت أسامة بن زيد بإشارة النبي، وروت قصة الجساسة، وفي بيتها اجتمع أهل الشورى بعد مقتل عمر.
  en: A sister of al-Dahhak ibn Qays and one of the first emigrants, known for beauty and intelligence; divorced by Abu Bakr ibn Hafs al-Makhzumi, she married Usama ibn Zayd on the Prophet's advice, narrated the story of the Jassasa, and the
    council of the Shura met in her house after Umar's killing.
