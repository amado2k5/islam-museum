summary:
  ar: "مؤسس السلالة الباركزائية وأمير أفغانستان (1826-1839 ثم 1843-1863). وحّد كابل وقندهار وهراة في دولة واحدة، وخُلع ونُفي إلى الهند في الحرب الإنجليزية الأفغانية الأولى ثم استعاد عرشه سنة 1843 وحكم حتى وفاته في هراة سنة 1863."
  en: "Founder of the Barakzai dynasty and Emir of Afghanistan (1826–1839, then 1843–1863). He united Kabul, Kandahar and Herat into a single state, was deposed and exiled to India in the First Anglo-Afghan War, recovered his throne in 1843, and ruled until his death at Herat in 1863."
  ur: "بارکزئی خاندان کے بانی اور افغانستان کے امیر (1826ء–1839ء، پھر 1843ء–1863ء)۔ انہوں نے کابل، قندھار اور ہرات کو ایک ریاست میں متحد کیا، پہلی اینگلو افغان جنگ میں معزول ہو کر ہندوستان جلاوطن ہوئے، 1843ء میں تخت واپس پایا اور 1863ء میں ہرات میں وفات تک حکمران رہے۔"
