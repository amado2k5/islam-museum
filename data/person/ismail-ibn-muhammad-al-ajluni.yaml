summary:
  ar: "إسماعيل بن محمد بن عبد الهادي بن عبد الغني، أبو الفداء، الشافعي، الشهير بالعجلوني أو الجراحي نسبة إلى أبي عبيدة بن الجراح، ولد بعجلون ونشأ بدمشق وتوفي بها، عالم بارع صالح مفيد محدث مبجل، له يد في العلوم لا سيما الحديث والعربية، درس بالجامع الأموي، ومن مشايخه أبو المواهب مفتي الحنابلة بدمشق. من تصانيفه «كشف الخفاء ومزيل الإلباس» و«الأجوبة المحققة على الأسئلة المفرقة». عاش بين 1078 و1162هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  en: "Ismail ibn Muhammad ibn Abd al-Hadi ibn Abd al-Ghani, Abu al-Fida, a Shafi'i known as al-Ajluni or al-Jarrahi after Abu Ubayda ibn al-Jarrah. Born in Ajlun, raised and died in Damascus, a brilliant, good and useful scholar of hadith and Arabic, who taught in the Umayyad Mosque. His works include 'Kashf al-khafa'' on the sayings widely spread as hadith, and 'al-Ajwiba al-muhaqqaqa'. He lived from 1078 to 1162 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  es: "Ismail ibn Muhammad ibn Abd al-Hadi ibn Abd al-Ghani, Abu al-Fida, un shafi'í conocido como al-Ajluni o al-Jarrahi en honor a Abu Ubayda ibn al-Jarrah. Nacido en Ajlun, criado y fallecido en Damasco, fue un erudito brillante, competente y útil en hadices y árabe, que impartió clases en la Mezquita de los Omeyas. Entre sus obras destacan «Kashf al-khafa», sobre dichos ampliamente difundidos como hadices, y «al-Ajwiba al-muhaqqaqa». Vivió entre 1078 y 1162 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  fr: "Ismail ibn Muhammad ibn Abd al-Hadi ibn Abd al-Ghani, dit Abu al-Fida, était un shafi'ite connu sous le nom d'al-Ajluni ou al-Jarrahi, en référence à Abu Ubayda ibn al-Jarrah. Né à Ajlun, il grandit et mourut à Damas. Érudit brillant et reconnu pour son expertise en hadiths et en langue arabe, il enseigna à la mosquée des Omeyyades. Parmi ses œuvres figurent « Kashf al-khafa », un ouvrage sur les hadiths les plus répandus, et « al-Ajwiba al-muhaqqaqa ». Il vécut de 1078 à 1162 de l'Hégire."
