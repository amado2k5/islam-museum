summary:
  ar: "إسماعيل بن محمد بن عبد الهادي بن عبد الغني، أبو الفداء، الشافعي، الشهير بالعجلوني أو الجراحي نسبة إلى أبي عبيدة بن الجراح، ولد بعجلون ونشأ بدمشق وتوفي بها، عالم بارع صالح مفيد محدث مبجل، له يد في العلوم لا سيما الحديث والعربية، درس بالجامع الأموي، ومن مشايخه أبو المواهب مفتي الحنابلة بدمشق. من تصانيفه «كشف الخفاء ومزيل الإلباس» و«الأجوبة المحققة على الأسئلة المفرقة». عاش بين 1078 و1162هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  en: "Ismail ibn Muhammad ibn Abd al-Hadi ibn Abd al-Ghani, Abu al-Fida, a Shafi'i known as al-Ajluni or al-Jarrahi after Abu Ubayda ibn al-Jarrah. Born in Ajlun, raised and died in Damascus, a brilliant, good and useful scholar of hadith and Arabic, who taught in the Umayyad Mosque. His works include 'Kashf al-khafa'' on the sayings widely spread as hadith, and 'al-Ajwiba al-muhaqqaqa'. He lived from 1078 to 1162 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
