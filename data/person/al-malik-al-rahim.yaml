id: person/al-malik-al-rahim
class: person
label:
  ar: الملك الرحيم أبو نصر خسرو فيروز
  en: al-Malik al-Rahim Abu Nasr Khusraw Firuz
  es: "al-Malik al-Rahim Abu Nasr Khusraw Firuz"
  fr: "al-Malik al-Rahim Abu Nasr Khusraw Firuz"
  ur: "الملک الرحیم ابو نصر خسرو فیروز"
summary:
  ar: "الملك الرحيم بن أبي كاليجار بن سلطان الدولة بن بهاء الدولة بن عضد الدولة، آخر ملوك بني بويه بالعراق؛ لما مات أبوه أبو كاليجار زحف إلى البصرة طامعاً فيها فكان الظفر له، واقتتل مع إخوته على الملك فاستولى على البصرة والأهواز، واتصل حربه بالبساسيري ودبيس بن مزيد حتى دخول طغرلبك بغداد سنة 447هـ فانقرضت دولة بني بويه. وعند ابن الجوزي أن أباه توفي ليلة الخميس في رمضان ٤٤٠ فانتهب الغلمان الخزائن والسلاح، فولي مكانه وسُمّي الملك الرحيم وركب إلى دار الخلافة فقبّل الأرض وأُلبس السبع الكاملة والعمامة السوداء الرصافية والطوق والسيفين ووُضع على رأسه التاج المرصع وقُرئ عليه كتاب التقليد، وكان يومًا مشهودًا {cite:muntazam-ibn-al-jawzi j.8 p.478-479}."
  en: "Al-Malik al-Rahim ibn Abi Kalijar ibn Sultan al-Dawla ibn Baha' al-Dawla ibn Adud al-Dawla, last Buyid king of Iraq; on his father's death he marched on Basra and prevailed, fought his brothers over kingship, seized Basra and al-Ahwaz, and stayed at war with al-Basasiri and Dubays ibn Mazyad until Tughril Beg's entry into Baghdad in 447 AH extinguished the Buyid state."
  es: "Al-Malik al-Rahim ibn Abi Kalijar ibn Sultan al-Dawla ibn Baha' al-Dawla ibn Adud al-Dawla, último rey buyí de Irak; tras la muerte de su padre marchó sobre Basora y prevaleció, luchó contra sus hermanos por el trono, se apoderó de Basora y al-Ahwaz, y permaneció en guerra con al-Basasiri y Dubays ibn Mazyad hasta que la entrada de Tughril Beg en Bagdad en el año 447 de la Hégira extinguió el estado buyí."
  fr: "Al-Malik al-Rahim ibn Abi Kalijar ibn Sultan al-Dawla ibn Baha' al-Dawla ibn Adud al-Dawla, dernier roi bouyide d'Irak; à la mort de son père, il marcha sur Bassora et l'emporta, se battit contre ses frères pour le trône, s'empara de Bassora et d'al-Ahwaz, et resta en guerre contre al-Basasiri et Dubays ibn Mazyad jusqu'à ce que l'entrée de Tughril Beg à Bagdad en 447 AH mette fin à l'État bouyide."
  ur: "المالک الرحیم ابن ابی کلیجار ابن سلطان الدولہ ابن بہاء الدولہ ابن عود الدولہ، عراق کا آخری بوید بادشاہ؛ اپنے والد کی وفات پر اس نے بصرہ پر چڑھائی کی اور غالب آیا، بادشاہت پر اپنے بھائیوں سے لڑا، بصرہ اور الاہواز پر قبضہ کیا اور البصیری اور دوبیس ابن مازیاد کے ساتھ جنگ میں رہا یہاں تک کہ 447 ہجری میں طغرل بیگ کے بغداد میں داخل ہونے سے خریدی ریاست کا خاتمہ ہوگیا۔"
  tr: "El-Melik el-Rahim bin Ebi Kalicar ibn Sultan el-Devle ibn Baha' el-Davla ibn 'Adud el-Devla, Irak'taki son Büüdü kralıydı. Babası Ebu Kalicar öldüğünde, Basra'ya yürüdü ve bu onun zaferi oldu. Kardeşleriyle birlikte kral için savaştı, Basra ve Ahvaz'ı ele geçirdi ve el-Basasiri ile Dabeys ibn Mazid ile savaşını sürdürdü; ta ki Tughril Beg 447 Hicri yılında Bağdat'a girene kadar; bu da Beyî devletinin yok olmasına yol açtı. İbn al-Jawzi'ye göre, babası 440 Ramazan ayının Perşembe gecesi öldü ve çocuklar hazineyi ve silahları yağmaladı. Yerine geçti ve En Merhametli Kral olarak adlandırıldı. Halifeliğe yükseldi, toprağı öptü, tam yedi tam sarığı, siyah Risafiyye sarığını, yakasını ve iki kılıç taktı, süslü tacı başına taktı ve ona Taklit Kitabı'nı okudu. Unutulmaz bir gündü {cite:muntazam-ibn-al-jawzi j.8 s.478-479}."
  id: "Al-Malik al-Rahim ibn Abi Kalijar ibn Sultan al-Dawla ibn Baha' al-Dawla ibn 'Adud al-Dawla, raja Buyid terakhir di Irak. Ketika ayahnya Abu Kalijar meninggal, ia berbaris ke Basra dengan harapan akan hal itu, yang menjadi kemenangannya. Ia bertempur bersama saudara-saudaranya untuk raja, merebut Basra dan Ahvaz, dan melanjutkan perang dengan al-Basasiri dan Dabays ibn Mazid hingga Tughril Beg memasuki Baghdad pada tahun 447 H, yang menyebabkan kepunahan negara Buyid. Menurut Ibn al-Jawzi, ayahnya meninggal pada malam Kamis di bulan Ramadan 440, dan anak-anak itu menjarah harta dan senjata. Ia digantikan dan dinobatkan sebagai Raja yang Maha Penyayang. Ia naik ke kekhalifahan, mencium bumi, mengenakan tujuh sorban penuh, sorban hitam Risafiyyah, kerah, dan dua pedang, meletakkan mahkota berhias di kepalanya, dan membacakan Kitab Tiruan kepadanya. Hari itu adalah hari yang tak terlupakan {cite:muntazam-ibn-al-jawzi j.8 hlm.478-479}."
