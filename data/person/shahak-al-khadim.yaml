class: person
label: { ar: "شاهك الخادم", en: "Shahak the Khadim", es: "Shahak the Khadim", fr: "Shahak the Khadim", ur: "شہک دی خادم" }
summary:
  ar: "خادم كان عديلاً للمستعين في حمله من واسط، حدث أن المستعين قال له عند القاطول انظر من رئيس القوم فإن كان سعيد الحاجب فقد هلكت، وحمل جوهر الخلافة والبرد والقضيب والسيف إلى المعتز مع عبيد الله بن عبد الله بن طاهر {cite:muruj-al-dhahab p. 545-546}."
  en: "The khadim who identified Sa'id al-Hajib for the doomed al-Musta'in and carried the Prophet's mantle to al-Mu'tazz {cite:muruj-al-dhahab p. 545-546}."
  es: "El khadim que identificó a Sa'id al-Hajib para el condenado al-Musta'in y llevó el manto del Profeta a al-Mu'tazz {cite:muruj-al-dhahab p. 545-546}."
  fr: "Les khadim qui ont identifié Sa'id al-Hajib comme étant le malheureux al-Musta'in et ont porté le manteau du Prophète à al-Mu'tazz {cite:muruj-al-dhahab p. 545-546}."
  ur: "وہ خادم جس نے سعید الحاجب کو برباد المستعین کے لیے پہچانا اور پیغمبر کی چادر کو معتز تک پہنچایا۔ 545-546}۔"
  tr: "Wasit'ten götürürken El-Muasin'in destekçisi olan bir hizmetkar. El-Musta'in ona El-Kattal'de şöyle dedi: 'Halkın liderinden bak, eğer Saeed kaş ise, o zaman sen yok oldun.' Halifeliğin özünü, soğuğu, asa ve kılıcı Ubeyd Allah ibn Abdullah ibn Tahir ile birlikte Mu'tazz'a taşıdı {atı:muruj-al-dhahab s. 545-546}."
  id: "Seorang hamba yang merupakan hamba yang menjadi pendukung Al-Mu'asin dengan membawanya dari Wasit. Kebetulan Al-Musta'in berkata kepadanya di Al-Qatil, 'Lihatlah dari pemimpin rakyat, jika Saeed adalah alis, maka kamu telah hancur.' Dia membawa esensi kekhalifahan, dingin, tongkat, dan pedang kepada Al-Mu'tazz bersama Ubayd Allah ibn Abdullah ibn Tahir {cite:muruj-al-dhahab hlm. 545-546}."
