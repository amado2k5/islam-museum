summary:
  ar: "أبو بكر محمد بن الوليد بن محمد بن خلف الفهري الأندلسي الطرطوشي الفقيه المالكي الزاهد المعروف بابن أبي رندقة؛ صحب أبا الوليد الباجي بسرقسطة وأخذ عنه الخلاف وقرأ الأدب على أبي محمد ابن حزم بإشبيلية، ورحل إلى المشرق سنة ست وسبعين وأربعمائة فحج ودخل بغداد والبصرة وتفقه على أبي بكر الشاشي المستظهري وأبي أحمد الجرجاني وسكن الشام فدرّس بها؛ كان إماماً عالماً عاملاً زاهداً ورعاً متقشفاً، ووعظ الأفضل شاهنشاه وزير المستعلي حتى بكى؛ من تصانيفه «سراج الملوك» و«بر الوالدين» و«الفتن» و«سراج الهدى» {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn al-Walid ibn Muhammad ibn Khalaf al-Fihri al-Andalusi al-Tartushi, the Maliki jurist and ascetic known as Ibn Abi Randaqa. He accompanied Abu al-Walid al-Baji at Saragossa and studied disagreement under him, and read literature with Abu Muhammad Ibn Hazm at Seville. In 476 he set out for the East, performed the hajj and entered Baghdad and Basra, studied law under Abu Bakr al-Shashi al-Mustazhiri and Abu Ahmad al-Jurjani, and settled in Syria, where he taught. He was an imam, a scholar who acted on his knowledge, an ascetic, pious and austere; he admonished al-Afdal Shahanshah, vizier of al-Musta'li, until he wept. His works include Siraj al-muluk, Birr al-walidayn, al-Fitan and Siraj al-huda {cite:wafayat-ayan}."
