summary:
  ar: "أبو بكر محمد بن الوليد بن محمد بن خلف الفهري الأندلسي الطرطوشي الفقيه المالكي الزاهد المعروف بابن أبي رندقة؛ صحب أبا الوليد الباجي بسرقسطة وأخذ عنه الخلاف وقرأ الأدب على أبي محمد ابن حزم بإشبيلية، ورحل إلى المشرق سنة ست وسبعين وأربعمائة فحج ودخل بغداد والبصرة وتفقه على أبي بكر الشاشي المستظهري وأبي أحمد الجرجاني وسكن الشام فدرّس بها؛ كان إماماً عالماً عاملاً زاهداً ورعاً متقشفاً، ووعظ الأفضل شاهنشاه وزير المستعلي حتى بكى؛ من تصانيفه «سراج الملوك» و«بر الوالدين» و«الفتن» و«سراج الهدى» {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn al-Walid ibn Muhammad ibn Khalaf al-Fihri al-Andalusi al-Tartushi, the Maliki jurist and ascetic known as Ibn Abi Randaqa. He accompanied Abu al-Walid al-Baji at Saragossa and studied disagreement under him, and read literature with Abu Muhammad Ibn Hazm at Seville. In 476 he set out for the East, performed the hajj and entered Baghdad and Basra, studied law under Abu Bakr al-Shashi al-Mustazhiri and Abu Ahmad al-Jurjani, and settled in Syria, where he taught. He was an imam, a scholar who acted on his knowledge, an ascetic, pious and austere; he admonished al-Afdal Shahanshah, vizier of al-Musta'li, until he wept. His works include Siraj al-muluk, Birr al-walidayn, al-Fitan and Siraj al-huda {cite:wafayat-ayan}."
  fr: "Abou Bakr Muhammad ibn al-Walid ibn Muhammad ibn Khalaf al-Fihri al-Andalusi al-Tartushi, le juriste et ascète malikite connu sous le nom d'Ibn Abi Randaqa. Il accompagna Abu al-Walid al-Baji à Saragosse et étudia le désaccord avec lui, et lut la littérature avec Abu Muhammad Ibn Hazm à Séville. En 476, il partit pour l’Est, exécuta le hajj et entra à Bagdad et à Bassorah, étudia le droit sous Abou Bakr al-Shashi al-Mustajiri et Abou Ahmad al-Jurjani, et s’installa en Syrie, où il enseigna. Il était un imam, un savant qui a agi sur sa connaissance, un ascète, pieux et austère ; il admonesta al-Afdal Shahanshah, vizir d'al-Musta'li, jusqu'à ce qu'il pleure. Ses œuvres comprennent Siraj al-muluk, Birr al-walidayn, al-Fitan et Siraj al-huda {cite:wafayat-ayan}."
  es: "Abu Bakr Muhammad ibn al-Walid ibn Muhammad ibn Khalaf al-Fihri al-Andalusi al-Tartushi, el jurista y asceta malikí conocido como Ibn Abi Randaqa. Acompañó a Abu al-Walid al-Baji en Zaragoza y estudió con él la discrepancia, y leyó literatura con Abu Muhammad Ibn Hazm en Sevilla. En 476 partió hacia Oriente, realizó el Hajj y entró en Bagdad y Basora, estudió derecho con Abu Bakr al-Shashi al-Mustazhiri y Abu Ahmad al-Jurjani, y se estableció en Siria, donde enseñó. Fue imán, un erudito que actuaba conforme a su conocimiento, un asceta, piadoso y austero; amonestó a al-Afdal Shahanshah, visir de al-Musta'li, hasta hacerlo llorar. Sus obras incluyen Siraj al-muluk, Birr al-walidayn, al-Fitan y Siraj al-huda {cita:wafayat-ayan}."
  ur: "ابوبکر محمد بن الولید بن محمد بن خلف الفہری الاندلسی الطرطوشی، مالکی فقیہ اور بزرگ ابن ابی رندقہ کے نام سے جانا جاتا ہے۔ وہ ابو الولید الباجی کے ساتھ ساراگوسا میں گئے اور ان کے تحت اختلاف کا مطالعہ کیا، اور ابو محمد ابن حزم کے ساتھ سیویل میں ادب پڑھا۔ 476 میں وہ مشرق کی طرف روانہ ہوئے، حج کیا اور بغداد اور بصرہ میں داخل ہوئے، ابوبکر الشاشی المستظیری اور ابو احمد الجرجانی سے قانون کی تعلیم حاصل کی، اور شام میں سکونت اختیار کی، جہاں وہ درس دیتے تھے۔ وہ ایک امام، ایک عالم تھا جس نے اپنے علم پر عمل کیا، ایک متقی، متقی اور سادگی؛ اس نے المستعلی کے وزیر الفضل شہنشاہ کو نصیحت کی، یہاں تک کہ وہ رو پڑا۔ ان کی تصانیف میں سراج الملوک، بیر الوالدین، الفتن اور سراج الہدی شامل ہیں۔"
  tr: "Maliki hukukçusu ve münzevi İbn Abi Randaqah olarak bilinen Ebu Bekir Muhammed bin el-Velid bin Muhammed bin Halef el-Welid bin Muhammed bin Halef el-Endülüs el-Tertuşi, Maliki hukukçusu ve münzevi olarak bilinen İbn Abi Randaqah, Ebu el-Velid el-Beci'ye Zaragoza'da eşlik etti, ondan anlaşmazlıklar öğrendi ve Sevilla'da Ebu Muhammed bin Hazm'ın yanında edebiyat eğitimi aldı. 476 Hicri yılında doğuya seyahat etti, Hac yaptı, Bağdat ve Basra'ya girdi, Ebu Bekir el-Şaşi el-Mustaziri ve Ebu Ahmed el-Cumhurcani'nin yanında hukuk eğitimi aldı ve el-Şam'da ders verdiği yerde ders verdi. Eserleri arasında 'Siraj al-Muluk', 'Siraj'al-Muluk' ve Ebu Ahmad el-Cerrahi ile birlikte ders verdi. Kendisi bilgili bir imam, dindar bir münzeviydi ve el-Musta'li'nin bakanı el-Afdal Şahanşah'a ağlayana kadar vaaz verdi. Eserleri arasında 'Siraj al-Muluk', Ebu Müstül' ve Ebu Mühsül' yer alır, 'Birr al-Walid', 'Al-Fitras' ve 'Siraj al-Huda' {cite:wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn al-Walid ibn Muhammad ibn Khalaf al-Fihri al-Andalusi al-Tartushi, seorang ahli hukum Maliki, seorang pertapa yang dikenal sebagai Ibn Abi Randaqah, menemani Abu al-Walid al-Baji di Zaragoza, belajar perselisihan darinya, dan belajar sastra di bawah bimbingan Abu Muhammad ibn Hazm di Sevilla. Ia melakukan perjalanan ke Timur pada tahun 476 H, melaksanakan Haji, masuk ke Baghdad dan Basra, belajar hukum di bawah bimbingan Abu Bakr al-Shashi al-Mustadhhiri dan Abu Ahmad al-Jurjani, dan menetap di al-Sham, tempat ia mengajar. Ia adalah seorang imam yang terpelajar, seorang pertapa yang saleh, dan berkhotbah kepada al-Afdal Shahanshah, menteri al-Musta'li, hingga ia menangis. Di antara karya-karyanya adalah 'Siraj al-Muluk,' 'Birr al-Walid,' 'Al-Fitras,' dan 'Siraj al-Huda' {cite:Wafayat-Ayan}."
