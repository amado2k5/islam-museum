faith:
  - { value: unknown, basis: unknown, note: "No school is recorded, because each reading rests on a single attestation of a kind this lane does not accept alone. For Sufism, the English article's text states 'Allam is a Sufi', citing an Egypt Independent report of 25 February 2013 — one personal text attestation, with only category filings behind it. For the Maliki madhhab, the Arabic infobox gives Maliki fiqh referenced to a Mubtada news headline ('the new mufti is Maliki by madhhab') — a referenced infobox alone; Al-Ahram's description of him (12 February 2013) as a professor of Maliki fiqh attests his teaching specialisation, not his personal madhhab. His Grand Mufti office (2013–2024) and his Al-Azhar posts are offices and never attest, and Wikidata gives only generic Islam (Q432). Both readings, Sufi and Maliki, are preserved here pending a second independent attestation of either.", sources: [source/wikipedia-shawki-allam-en, source/wikipedia-shawki-allam-ar, source/wikidata-shawki-allam] }
