summary:
  ar: "فقيه مصري ⁦(ولد 12 أغسطس 1961 في محافظة البحيرة)⁩، أستاذ الفقه بجامعة الأزهر، تولى منصب مفتي مصر من 2013 حتى 11 أغسطس 2024 خلفًا لعلي جمعة وخلفه نظير عياد؛ ومنذ 2025 عميد المعهد العالي للدراسات الإسلامية وعضو مجلس الشيوخ المصري."
  en: "Egyptian jurist (born 12 August 1961 in Beheira Governorate), professor of jurisprudence at Al-Azhar University, who served as Grand Mufti of Egypt from 2013 until 11 August 2024, succeeding Ali Gomaa and succeeded by Nazir Ayyad; since 2025 he has been dean of the Higher Institute of Islamic Studies and a member of the Egyptian Senate."
  es: "Jurista egipcio (nacido el 12 de agosto de 1961 en la gobernación de Beheira), profesor de jurisprudencia en la Universidad de Al-Azhar, que se desempeñó como Gran Muftí de Egipto desde 2013 hasta el 11 de agosto de 2024, sucediendo a Ali Gomaa y siendo sucedido por Nazir Ayyad; desde 2025 es decano del Instituto Superior de Estudios Islámicos y miembro del Senado egipcio."
  fr: "Juriste égyptien (né le 12 août 1961 dans le gouvernorat de Beheira), professeur de jurisprudence à l'université Al-Azhar, il a été grand mufti d'Égypte de 2013 au 11 août 2024, succédant à Ali Gomaa, puis à Nazir Ayyad; depuis 2025, il est doyen de l'Institut supérieur d'études islamiques et membre du Sénat égyptien."
  ur: "مصری فقیہ ⁦(پیدائش 12 اگست 1961 کو بحیرہ گورنریٹ میں)⁩، الازہر یونیورسٹی میں فقہ کے پروفیسر، جنہوں نے 2013 سے 11 اگست 2024 تک مصر کے مفتی اعظم کے طور پر خدمات انجام دیں، علی گوما کے بعد اور نذیر ایاد کے بعد منتخب ہوئے۔ 2025 سے وہ ہائر انسٹی ٹیوٹ آف اسلامک اسٹڈیز کے ڈین اور مصری سینیٹ کے رکن ہیں۔"
