id: person/al-ala-ibn-wahb
class: person
label: { ar: "العلاء بن وهب", en: "al-Ala ibn Wahb", fr: "Al-Ala ibn Wahb", es: "al-Ala ibn Wahb", ur: "علاء ابن وہب" }
summary:
  ar: "العلاء بن وهب بن عبد بن وهبان أحد بني عامر بن لؤي؛ عند البلاذري ولاه سعد بن أبي وقاص لعثمان ماه وهمذان فغدر أهل همذان ونقضوا فقاتلهم حتى نزلوا على حكمه فصالحهم على خراج الأرض وجزية الرؤوس ومائة ألف درهم للمسلمين وأن لا يعرض لهم في مال ولا حرمة ولا ولد."
  en: "al-Ala ibn Wahb ibn Abd ibn Wahban of Banu Amir ibn Lu'ayy; in al-Baladhuri, Sa'd's appointee for Uthman over Mah and Hamadhan — when Hamadhan's people broke faith he fought them into submission and treated on land kharaj, head jizya, 100,000 dirhams for the Muslims, and immunity of wealth, honor and children."
  fr: "Al-Ala ibn Wahb ibn Abd ibn Wahban des Banu Amir ibn Lu’ayy ; chez al-Baladhuri, nommé par Sa’d pour Uthman à la tête de Mah et de Hamadhan. Lorsque les habitants de Hamadhan rompirent leur engagement, il les combattit jusqu’à leur soumission et conclut un accord sur le kharaj foncier, la jizya par personne, 100 000 dirhams pour les musulmans et la protection des biens, de l’honneur et des enfants."
  es: "al-Ala ibn Wahb ibn Abd ibn Wahban de Banu Amir ibn Lu'ayy; en al-Baladhuri, el designado por Sa'd para Uthman sobre Mah y Hamadhan: cuando la gente de Hamadhan rompió la fe, los sometió luchando y les otorgó sobre la tierra kharaj, jizya de cabeza, 100.000 dirhams para los musulmanes e inmunidad de riqueza, honor e hijos."
  ur: "علاء بن وہب بن عبد بن وہبن بنو عامر بن لوعی۔ البلادوری میں، سعد کا عثمان کے لیے مہ اور حماد پر مقرر تھا - جب ہمادان کے لوگوں نے ایمان توڑا تو اس نے ان کے خلاف جنگ کی اور زمین پر خراج، سر جزیہ، مسلمانوں کے لیے 100,000 درہم، اور مال، عزت اور اولاد سے استثنیٰ دیا۔"
  tr: "El-Baladhuri'ye göre, Beni Amir ibn Lu'ay kabilesinden El-Ala' ibn Vahb ibn Abd ibn Vahban, Sa'd ibn Abi Waqqas tarafından Osman için Mah ve Hamadan valisi olarak atanmıştır. Hamadan halkı ona ihanet etmiş ve ahitlerini bozmuşlardır; bu yüzden onlarla savaşmış ve sonunda onun yönetimine boyun eğmişlerdir. Onlarla, toprak vergisi, kafa vergisi ve Müslümanlar için yüz bin dirhem ödemeleri ve para, şeref veya çocuk bakımından onlara zarar gelmemesi şartıyla barışmıştır."
  id: "Al-Ala’ ibn Wahb ibn Abd ibn Wahban, salah satu dari Banu Amir ibn Lu’ay, menurut Al-Baladhuri, Sa’d ibn Abi Waqqas mengangkatnya sebagai gubernur Mah dan Hamadan untuk Utsman. Penduduk Hamadan mengkhianatinya dan melanggar perjanjian mereka, sehingga ia memerangi mereka sampai mereka tunduk pada kekuasaannya. Ia berdamai dengan mereka dengan syarat membayar pajak tanah, pajak kepala, dan seratus ribu dirham untuk kaum Muslimin, dan bahwa tidak akan ada bahaya yang menimpa mereka dalam hal uang, kehormatan, atau anak-anak."
