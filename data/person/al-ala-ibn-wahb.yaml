summary:
  ar: "العلاء بن وهب بن عبد بن وهبان أحد بني عامر بن لؤي؛ عند البلاذري ولاه سعد بن أبي وقاص لعثمان ماه وهمذان فغدر أهل همذان ونقضوا فقاتلهم حتى نزلوا على حكمه فصالحهم على خراج الأرض وجزية الرؤوس ومائة ألف درهم للمسلمين وأن لا يعرض لهم في مال ولا حرمة ولا ولد."
  en: "al-Ala ibn Wahb ibn Abd ibn Wahban of Banu Amir ibn Lu'ayy; in al-Baladhuri, Sa'd's appointee for Uthman over Mah and Hamadhan — when Hamadhan's people broke faith he fought them into submission and treated on land kharaj, head jizya, 100,000 dirhams for the Muslims, and immunity of wealth, honor and children."
