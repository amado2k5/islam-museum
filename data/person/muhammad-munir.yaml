summary:
  ar: "محمد منير (1895–1979) قاضٍ باكستاني، ثاني رؤساء قضاة باكستان (1954–1960)، صاحب الحكم في قضية تميز الدين الذي أرسى مبدأ الضرورة، ومؤلف كتاب «من جناح إلى ضياء»."
  en: "Muhammad Munir (1895–1979) was a Pakistani judge, the second Chief Justice of Pakistan (1954–1960), whose judgment in the Tamizuddin Khan case founded the doctrine of necessity; he later wrote From Jinnah to Zia."
  ur: "محمد منیر (1895ء–1979ء) پاکستانی منصف تھے، پاکستان کے دوسرے منصف اعظم (1954ء–1960ء) رہے، تمیز الدین خان مقدمے میں ان کے فیصلے نے نظریۂ ضرورت کی بنیاد رکھی؛ بعد میں انہوں نے «جناح سے ضیا تک» لکھی۔"
