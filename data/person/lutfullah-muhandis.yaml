summary:
  ar: "عالم رياضيات ومؤرخ ومهندس من عصر مغول الهند في القرن السابع عشر، الابن الثاني للأستاذ أحمد لاهوري؛ جمع في «ديوان المهندس» أشعارًا تؤرخ لأعمال أبيه المعمارية — وفيها النسبة الصريحة الوحيدة لأبيه إلى تاج محل — وله رسالة عملية في الأشكال الهندسية، وأنجز مشاريع في ماندو وبيشاور وتكليفات لدارا شيكوه."
  en: "Seventeenth-century Mughal mathematician, historian and engineer, second son of Ustad Ahmad Lahori. His Diwan-i Muhandis preserves the poems on his father's architectural works — among them the only explicit attribution of the Taj Mahal to Ahmad — and he wrote a practical treatise on geometrical shapes and completed projects at Mandu and Peshawar and commissions for Dara Shikoh."
  ur: "سترھویں صدی کے مغل دور کے ریاضی دان، مؤرخ اور انجینئر، جو استاد احمد لاہوری کے دوسرے بیٹے تھے۔ ان کے «دیوانِ مہندس» میں ان کے والد کے تعمیراتی کارناموں پر اشعار محفوظ ہیں — انہی میں تاج محل کی احمد لاہوری سے واحد صریح نسبت ملتی ہے — اور انھوں نے ہندسی اشکال پر ایک عملی رسالہ لکھا اور مانڈو و پشاور میں منصوبے اور دارا شکوہ کے لیے کام مکمل کیے۔"
