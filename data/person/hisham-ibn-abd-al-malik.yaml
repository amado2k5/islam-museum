id: person/hisham-ibn-abd-al-malik
class: person
label: { ar: "هشام بن عبد الملك" , ur: "ہشام بن عبد الملک", en: "Hisham ibn Abd al-Malik", es: "Hisham ibn Abd al-Malik", fr: "Hisham ibn Abd al-Malik"}
summary:
  ar: "خليفة أموي توفي في سنة خمس وعشرين ومائة، وذكر الطبري علته التي مات بها {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. وعند المسعودي بويع يوم توفي يزيد لخمس بقين من شعبان سنة خمس ومائة وتوفي بالرصافة يوم الأربعاء لست خلون من ربيع الآخر سنة خمس وعشرين ومائة وهو ابن ثلاث وخمسين سنة فكانت ولايته تسع عشرة سنة وسبعة أشهر وإحدى عشرة ليلة، وكان أحول خشناً فظاً غليظاً يجمع الأموال ويعمر الأرض ويستجيد الخيل فاجتمع له في الحلبة أربعة آلاف فرس لم يعرف مثلها لأحد في جاهلية ولا إسلام، وفي أيامه عمل الخز فمنع الناس ما في أيديهم فقل الإفضال وانقطع الرفد ولم ير زمان أصعب من زمانه {cite:muruj-al-dhahab p. 193} ويذكر الكتاب أن هشاماً امتنع عن بيعة عمر بن عبد العزيز حين قرئ العهد، وقال إنه لا يبايعه أبداً، فقال له رجاء إنه يضرب عنقه إن لم يبايع، ثم قام فبايع وهو يُرى كاره. {cite:salabi-umayyad-state-2020 p.186-187} ويذكر الكتاب أن هشاماً جاء إلى عمر بعد الخلافة رسولاً لقومه يطلب استئناف العمل بالرأي فيما تحت يده وترك من سبقه على ما ولّوه، فأجابه عمر بأنه سيلتزم بالأقدم من كتاب الله. {cite:salabi-umayyad-state-2020 p.199} ويذكر الكتاب أنه بويع في دمشق في أول رمضان سنة 105هـ على الأرجح، بعد وفاة يزيد بن عبد الملك في شعبان، وأنه ولد سنة 72هـ على الراجح، وأن ديوانه كان من أصح الدواوين في نظر عبد الله بن علي بن العباس، وأنه كان شديد المراقبة للعمال والدواوين. ويصف الكتاب شخصيته بالبخل وجمع المال، ويرى أن ذلك لشدة محاسبته على المال العام. ويعرض الكتاب وصف ولاته ووزرائه في الأقاليم، ويذكر أن الولايات كانت هادئة في عهده إلا حركات الخوارج والعراق وثورة زيد بن علي بالكوفة. {cite:salabi-umayyad-state-2020 p.447-489} ويذكر الكتاب أن سياسته المالية كانت امتداداً لسياسة ملوك بني أمية وخلافاً لنهج عمر، وأنه شجع عودة الملكيات الزراعية الكبيرة، وأن ملكية خالد القسري بلغ دخلها من غلاتها ثلاثة عشر مليون دينار. ويذكر أنه أوصى والي الموصل بحفر نهر في وسط المدينة، وأن الدولة أقامت الجسور والسدود، وأن هشاماً اتخذ الرصافة مصيفاً. ويذكر الكتاب أن ثورات البربر في إفريقية اندلعت في عهده، بعد أن ظلم عمال بني أمية البربر، فاستغل دعاة الخوارج ذلك، وأن الخوارج استولوا على القيروان مرتين في نحو ثلاثين سنة. {cite:salabi-umayyad-state-2020 p.488-518}"
  ur: "اموی خلیفہ جو یزید بن عبد الملک کے بعد تخت نشین ہوا اور رصافہ میں وفات پائی؛ طبری اور مسعودی اس کے عہد اور وفات کا ذکر کرتے ہیں۔ {cite:umayyad-birth-to-fall-2006}"
  en: "Umayyad caliph who succeeded Yazid ibn Abd al-Malik and died at al-Rusafa; al-Tabari and al-Mas'udi record his reign and death. {cite:umayyad-birth-to-fall-2006}"
  es: "Califa omeya que sucedió a Yazid ibn Abd al-Malik y murió en al-Rusafa; al-Tabari y al-Mas'udi registran su reinado y su muerte. {cite:umayyad-birth-to-fall-2006}"
  fr: "Calife omeyyade qui succéda à Yazid ibn Abd al-Malik et mourut à al-Rusafa; al-Tabari et al-Mas'udi relatent son règne et sa mort. {cite:umayyad-birth-to-fall-2006}"
  tr: "Yüz yirmi beşinci yılda ölen bir Emevi halifesi ve el-Taberi, öldüğü hastalığı belirtmiştir {atıf:tabari-tarikh-abu-al-fadl j.7 s.200}. el-Mes'udi'ye göre, Yezid, Yazid'in öldüğü gün, Şa'ban'dan beş ay önce, 105. yılda bağlılık yemini etmiş ve Çarşamba günü Rusafa'da, Rabi'al-Thani'den altı ay önce, 125 Hicri yılında, elli üç yaşında ölmüştür. Saltanatı on dokuz yıl, yedi ay ve on bir gece sürmüştür. Inatçı, sert ve sert biriydi; servet biriktirir, toprak eker ve at yetiştirirdi. Arenada dört bin at toplandı; İslam öncesi dönemde ya da İslam'da kimsenin bilmediği türden. Kendi döneminde utanç uyguladı, insanların sahip olduklarından mahrum bıraktı, bu yüzden iyilikler azaldı, destek sona erdi ve kendi zamanından daha zor bir zaman olmadı {cite::] Muruj-al-Dhahab, s. 193} Kitapta, Hisham'ın yemin okunduğunda Ömer bin Abdülaziz'e bağlılık yemini etmeyi reddettiğini, ona asla bağlılık yemini etmeyeceğini belirtir. Bağlılık yemini etmezse başının kesileceğini umduğunu belirtir. Sonra ayağa kalkıp bağlılık yemini etti ve hoşlanmadığını görünce bağlılık yemini etti. {cite:salabi-umayyad-state-2020 s.186-187} Kitap, Hisam'ın halifelikten sonra Ömer'e halkına elçi olarak geldiğini, kontrolündeki konularda görüşünü yeniden dile getirmesini istediğini ve seleflerini olduğu gibi bıraktığını belirtir. Ömer ise Tanrı'nın Kitabı'ndan daha eski bir şeye bağlı kalacağını belirtir. {alıntı:Selabi-Emevi-devlet-2020 s.199} Kitap, muhtemelen 105 Hicri Ramazan başında, Şaban'da Yazid bin Abdülmelik'in ölümünden sonra Şam'da bağlılık yemini ettiğini ve kamu hazinesinin en doğru bilgisine göre 72 Hicri yılında doğduğunu belirtir. Abdullah ibn Ali ibn el-Abbas'ın gözünde en güvenilir diwanlardan biri olarak kabul edilir ve işçiler ile diwanlara karşı çok dikkatli olduğu belirtilir. Kitap, kişiliğini cimri ve servet biriktiren biri olarak tanımlar ve bunun kamu fonlarına karşı sıkı sorumluluğundan kaynaklandığını kabul eder. Kitap, onun valilerini ve bakanlarını anlatır; saltanatı sırasında Hariciler, Irak ve Kufe'deki Zeyd bin Ali isyanı dışında eyaletlerin sakin olduğunu belirtir. {alıntı:Salabi-Umayyad-State-2020 s.447-489} Kitapta, mali politikasının Emevi krallarının politikalarının bir uzantısı olduğu ve Umar'ın yaklaşımının aksine olduğu, büyük tarım arazilerinin geri verilmesini teşvik ettiği ve Halid el-Kasri'nin mülkünün ürünlerinden on üç milyon dinar kazandığı belirtilir. Kitapta, Musul valisine şehir merkezinde bir nehir kazılmasını, devletin köprüler ve barajlar inşa edilmesini ve Hisham'ın Rusafa'yı yazlık bir tatil beldesi haline getirdiğini belirtir. Kitapta, İfrikiye'deki Berberi isyanlarının, Emevi işçilerinin Berberileri ezmesi sonrası onun saltanatı sırasında patlak verdiği, Harici vaizlerin bunu sömürdüğü ve Haricilerin yaklaşık otuz yıl içinde iki kez Kairuvan'ı ele geçirdiği belirtilir. {cite:Salabi-Umayyad-State-2020 s.488-518}"
  id: "Seorang khalifah Umayyah yang meninggal pada tahun seratus dua puluh lima, dan al-Tabari menyebutkan penyakit yang menyebabkan kematiannya {cite:tabari-tarikh-abu-al-fadl j.7 hlm.200}. Menurut al-Mas'udi, Yazid diikrarkan setia pada hari Yazid wafat, lima bulan sebelum Sha'ban, tahun 105, dan meninggal di Rusafa pada hari Rabu, enam bulan sebelum Rabi' al-Thani pada tahun 125 H, pada usia lima puluh tiga tahun. Pemerintahannya berlangsung selama sembilan belas tahun, tujuh bulan, dan sebelas malam. Ia keras kepala, kasar, dan kasar, mengumpulkan kekayaan, mengolah tanah, dan memelihara kuda. Empat ribu kuda berkumpul di arena, yang tidak dikenal siapa pun pada era pra-Islam atau Islam. Selama hari-harinya, ia berlatih rasa malu, mencegah orang mendapatkan apa yang mereka miliki, sehingga kebaikan berkurang, dukungan berhenti, dan tidak ada waktu yang lebih sulit daripada dirinya sendiri {cite:Muruj-al-Dhahab, hlm. 193} Buku tersebut menyebutkan bahwa Hisham menolak bersumpah setia kepada Umar ibn Abd al-Aziz saat sumpah itu dibacakan, mengatakan bahwa ia tidak akan pernah bersumpah setia kepadanya. Ia berharap akan dipenggal jika tidak bersumpah setia. Kemudian ia berdiri dan bersumpah setia saat melihat ketidaksukaannya. {cite:salabi-umayyad-state-2020 hlm.186-187} Buku tersebut menyebutkan bahwa Hisham datang kepada Umar setelah kekhalifahan sebagai utusan kepada rakyatnya, meminta agar pendapatnya kembali dalam urusan di bawah kendalinya dan meninggalkan para pendahulunya seperti sebelumnya. Umar menjawab bahwa ia akan berpegang pada sesuatu yang lebih tua daripada Kitab Allah. {cite:salabi-umayyad-state-2020 hlm.199} Buku tersebut menyebutkan bahwa ia kemungkinan besar telah bersumpah setia di Damaskus pada awal Ramadan tahun 105 H, setelah kematian Yazid ibn Abd al-Malik di Sha'ban, dan bahwa ia lahir pada tahun 72 H menurut kas negara yang paling benar. Ia dianggap sebagai salah satu diwan paling dapat diandalkan oleh Abdullah ibn Ali ibn al-Abbas, dan sangat berhati-hati terhadap para pekerja dan para diwan. Buku tersebut menggambarkan kepribadiannya sebagai pelit dan mengumpulkan kekayaan, dan menganggap hal ini karena tanggung jawabnya yang ketat terhadap dana publik. Buku ini menggambarkan para gubernur dan menterinya di provinsi-provinsi, menyebutkan bahwa provinsi-provinsi tersebut tetap tenang selama masa pemerintahannya kecuali pergerakan Kharijit, Irak, dan pemberontakan Zayd ibn Ali di Kufa. {cite:salabi-umayyad-state-2020 hlm.447-489} Buku tersebut menyebutkan bahwa kebijakan keuangannya merupakan perpanjangan dari kebijakan raja Umayyah dan bertentangan dengan pendekatan Umar, serta mendorong pengembalian perkebunan pertanian besar, dan bahwa perkebunan Khalid al-Qasri menghasilkan tiga belas juta dinar dari hasil panennya. Buku tersebut menyebutkan bahwa ia merekomendasikan kepada gubernur Mosul untuk menggali sungai di pusat kota, bahwa negara membangun jembatan dan bendungan, dan bahwa Hisham menjadikan Rusafa sebagai tempat resor musim panas. Buku tersebut menyebutkan bahwa pemberontakan Berber di Ifriqiya pecah selama pemerintahannya setelah para pekerja Umayyah menindas orang Berber, yang dieksploitasi oleh para pengkhotbah Kharij, dan bahwa Kharijite merebut Kairouan dua kali dalam waktu sekitar tiga puluh tahun. {cite:salabi-umayyad-state-2020 hlm.488-518}"
