summary:
  ar: "خليفة أموي توفي في سنة خمس وعشرين ومائة، وذكر الطبري علته التي مات بها {cite:tabari-tarikh-abu-al-fadl j.7 p.200}.، وعند المسعودي بويع يوم توفي يزيد لخمس بقين من شعبان سنة خمس ومائة وتوفي بالرصافة يوم الأربعاء لست خلون من ربيع الآخر سنة خمس وعشرين ومائة وهو ابن ثلاث وخمسين سنة فكانت ولايته تسع عشرة سنة وسبعة أشهر وإحدى عشرة ليلة، وكان أحول خشناً فظاً غليظاً يجمع الأموال ويعمر الأرض ويستجيد الخيل فاجتمع له في الحلبة أربعة آلاف فرس لم يعرف مثلها لأحد في جاهلية ولا إسلام، وفي أيامه عمل الخز فمنع الناس ما في أيديهم فقل الإفضال وانقطع الرفد ولم ير زمان أصعب من زمانه {cite:muruj-al-dhahab p. 193}"
