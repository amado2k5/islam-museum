label: { ar: "هشام بن عبد الملك" }
summary:
  ar: "خليفة أموي توفي في سنة خمس وعشرين ومائة، وذكر الطبري علته التي مات بها {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. وعند المسعودي بويع يوم توفي يزيد لخمس بقين من شعبان سنة خمس ومائة وتوفي بالرصافة يوم الأربعاء لست خلون من ربيع الآخر سنة خمس وعشرين ومائة وهو ابن ثلاث وخمسين سنة فكانت ولايته تسع عشرة سنة وسبعة أشهر وإحدى عشرة ليلة، وكان أحول خشناً فظاً غليظاً يجمع الأموال ويعمر الأرض ويستجيد الخيل فاجتمع له في الحلبة أربعة آلاف فرس لم يعرف مثلها لأحد في جاهلية ولا إسلام، وفي أيامه عمل الخز فمنع الناس ما في أيديهم فقل الإفضال وانقطع الرفد ولم ير زمان أصعب من زمانه {cite:muruj-al-dhahab p. 193} ويذكر الكتاب أن هشاماً امتنع عن بيعة عمر بن عبد العزيز حين قرئ العهد، وقال إنه لا يبايعه أبداً، فقال له رجاء إنه يضرب عنقه إن لم يبايع، ثم قام فبايع وهو يُرى كاره. {cite:salabi-umayyad-state-2020 p.186-187} ويذكر الكتاب أن هشاماً جاء إلى عمر بعد الخلافة رسولاً لقومه يطلب استئناف العمل بالرأي فيما تحت يده وترك من سبقه على ما ولّوه، فأجابه عمر بأنه سيلتزم بالأقدم من كتاب الله. {cite:salabi-umayyad-state-2020 p.199} ويذكر الكتاب أنه بويع في دمشق في أول رمضان سنة 105هـ على الأرجح، بعد وفاة يزيد بن عبد الملك في شعبان، وأنه ولد سنة 72هـ على الراجح، وأن ديوانه كان من أصح الدواوين في نظر عبد الله بن علي بن العباس، وأنه كان شديد المراقبة للعمال والدواوين. ويصف الكتاب شخصيته بالبخل وجمع المال، ويرى أن ذلك لشدة محاسبته على المال العام. ويعرض الكتاب وصف ولاته ووزرائه في الأقاليم، ويذكر أن الولايات كانت هادئة في عهده إلا حركات الخوارج والعراق وثورة زيد بن علي بالكوفة. {cite:salabi-umayyad-state-2020 p.447-489} ويذكر الكتاب أن سياسته المالية كانت امتداداً لسياسة ملوك بني أمية وخلافاً لنهج عمر، وأنه شجع عودة الملكيات الزراعية الكبيرة، وأن ملكية خالد القسري بلغ دخلها من غلاتها ثلاثة عشر مليون دينار. ويذكر أنه أوصى والي الموصل بحفر نهر في وسط المدينة، وأن الدولة أقامت الجسور والسدود، وأن هشاماً اتخذ الرصافة مصيفاً. ويذكر الكتاب أن ثورات البربر في إفريقية اندلعت في عهده، بعد أن ظلم عمال بني أمية البربر، فاستغل دعاة الخوارج ذلك، وأن الخوارج استولوا على القيروان مرتين في نحو ثلاثين سنة. {cite:salabi-umayyad-state-2020 p.488-518}"
