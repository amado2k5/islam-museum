summary:
  ar: "تودور فلاديميريسكو قائد الانتفاضة التي اندلعت في الأفلاق سنة 1821م وأنهت عهد الأمراء الفنار. وتذكر دائرة المعارف الإسلامية أنه تحرك أول الأمر بالاتفاق مع الجمعية اليونانية السرية ثم انقلب على اليونانيين الذين رآهم أدوات الهيمنة العثمانية {cite:encyclopaedia-of-islam-2 vol. 2 p. 718}."
  en: "Tudor Vladimirescu led the revolt in Wallachia in 1821 that ended the rule of the Phanariot princes. The Encyclopaedia of Islam says he first acted in agreement with the Greek secret society, the Hetairia, and later turned against the Greeks, whom he saw as instruments of Ottoman domination {cite:encyclopaedia-of-islam-2 vol. 2 p. 718}."
  ur: "تودور ولادیمیریسکو 1821ء میں افلاق کی بغاوت کے قائد تھے جس نے فنار کے شہزادوں کا دور ختم کیا۔ دائرۃ المعارف الاسلامیہ کے مطابق وہ پہلے یونانی خفیہ انجمن ہیٹیریا کے اتفاق سے چلے اور پھر یونانیوں کے خلاف ہو گئے جنہیں وہ عثمانی تسلط کے آلے سمجھتے تھے {cite:encyclopaedia-of-islam-2 vol. 2 p. 718}۔"
