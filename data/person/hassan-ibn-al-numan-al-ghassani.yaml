class: person
label: { ar: "حسان بن النعمان الغساني", en: "Hassan ibn al-Nu'man al-Ghassani", es: "Hassan ibn al-Nu'man al-Ghassani", fr: "Hassan ibn al-Nu'man al-Ghassani", ur: "حسن بن النعمان الغسانی" }
summary:
  ar: "حسان بن النعمان الغساني؛ ولّى إفريقية فغزا ملكة البربر الكاهنة فهزمته فأتى قصوراً في حيز برقة فنزلها فسمّيت قصور حسان ثم غزاها ثانية فقتلها وسبى سبياً من البربر وبعث به إلى عبد العزيز بن مروان. اختطّ مدينة تونس سنة 82هـ قاعدةً عسكريةً بحريةً بأمر من عبد الملك بن مروان. {cite:salabi-umayyad-state-2020 p.20} ويذكر الكتاب أنه ولي إفريقية بعد أن أطلق له عبد الملك يد في أموال مصر، وبدأ الغزو سنة 74هـ، وأنه سار على سياسة أبي المهاجر في تأليف البربر وإشراكهم في الجيش، وأنشأ ديوان الجند ونظّم ديوان الخراج وبنى دار صناعة السفن في تونس، وأنه عُزل سنة 85هـ بعد خلاف مع أخيه والي مصر عبد العزيز بن مروان، وأقسم ألا يتولى لبني أمية أبداً. {cite:salabi-umayyad-state-2020 p.58-63}"
  en: "Hassan ibn al-Nu'man al-Ghassani; appointed over Ifriqiya, he raided the Berbers' queen al-Kahina who routed him — he lodged the glass-roofed castles in Barqa's bounds named Qusur Hassan for him — then raided her again, killed her, and sent a captivity of Berbers to Abd al-Aziz ibn Marwan."
  es: "Hassan ibn al-Nu'man al-Ghassani, nombrado gobernador de Ifriqiya, asaltó a la reina bereber al-Kahina, quien lo derrotó. En su honor, ubicó los castillos con techo de cristal en los límites de Barqa, llamados Qusur Hassan. Luego, la asaltó de nuevo, la mató y envió un grupo de bereberes cautivos a Abd al-Aziz ibn Marwan."
  fr: "Hassan ibn al-Nu'man al-Ghassani; nommé à la tête d'Ifriqiya, il a attaqué la reine berbère al-Kahina qui l'a mis en déroute — il a logé pour lui les châteaux au toit de verre dans les limites de Barqa nommés Qusur Hassan — puis l'a attaquée à nouveau, l'a tuée et a envoyé un groupe de Berbères captifs à Abd al-Aziz ibn Marwan."
  ur: "حسن بن النعمان الغسانی؛ عفریقیہ پر مقرر کیا گیا، اس نے بربر کی ملکہ الکہینہ پر چھاپہ مارا جس نے اسے شکست دی تھی - اس نے برقع کی حدود میں اس کے لیے قصر حسن نامی شیشے کے قلعے رکھے تھے - پھر اس پر دوبارہ چھاپہ مارا، اسے قتل کیا، اور بربروں کی ایک قید عبد العزیز ابن مروان کے پاس بھیج دی۔"
  tr: "Hasan ibn al-Nu'man al-Ghassani; İfrikiye valisi olarak atandı ve Berberi kraliçesi Kahina'ya saldırdı, ancak Kahina onu mağlup etti. Daha sonra Cyrenaica bölgesindeki saraylara geldi ve orada yerleşti; burası Hassan'ın sarayları olarak adlandırıldı, sonra tekrar baskın düzenledi, öldürdü, bir Berberi esir aldı ve Abd al-Aziz ibn Marwan'a gönderdi. 82 Hicri yılında, Abd al-Malik ibn Marwan'ın emriyle Tunus şehri bir deniz askeri üssü olarak kuruldu. {cite:salabi-umayyad-state-2020 s.20} Kitapta, Abd al-Malik Mısır'ın servetini ona verdikten sonra İfrikiye'yi yönettiği ve işgalin 74 Hicri yılında başladığı belirtilir. Ebu el-Muhacir'in Berberileri birleştirme ve orduya dahil etme politikasını izledi, askeri büro kurdu, vergi gelirlerini organize etti ve Tunus'ta tersane evi inşa etti. 85 Hicri'de, kardeşi Mısır valisi Abd al-Aziz ibn Marwan ile yaşadığı anlaşmazlık sonrası görevden alındı ve Emevileri asla yönetmeyeceğine yemin etti. {cite:Salabi-umayyad-state-2020 s.58-63}"
  id: "Hassan ibn al-Nu'man al-Ghassani; ia diangkat menjadi gubernur Ifriqiya dan menyerang ratu Berber Kahina, yang mengalahkannya. Ia kemudian datang ke istana-istana di wilayah Cyrenaica dan menetap di sana, yang disebut istana Hassan, kemudian ia menyerbu lagi, membunuhnya, menangkap seorang tawanan Berber, dan mengirimkannya kepada Abd al-Aziz ibn Marwan. Pada tahun 82 H, kota Tunis didirikan sebagai pangkalan militer angkatan laut atas perintah Abd al-Malik ibn Marwan. {cite:salabi-umayyad-state-2020 hlm.20} Buku tersebut menyebutkan bahwa ia memerintah Ifriqiya setelah Abd al-Malik memberinya kendali atas kekayaan Mesir, dan invasi dimulai pada tahun 74 H. Ia mengikuti kebijakan Abu al-Muhajir untuk menyatukan Berber dan melibatkan mereka dalam tentara, mendirikan biro militer, mengatur pendapatan pajak, dan membangun rumah galangan kapal di Tunisia. Ia diberhentikan pada tahun 85 H setelah perselisihan dengan saudaranya, gubernur Mesir, Abd al-Aziz ibn Marwan, dan bersumpah tidak akan pernah memerintah Umayyah. {cite:salabi-umayyad-state-2020 hlm.58-63}"
