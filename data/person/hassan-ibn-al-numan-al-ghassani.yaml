id: person/hassan-ibn-al-numan-al-ghassani
class: person
label: { ar: "حسان بن النعمان الغساني", en: "Hassan ibn al-Nu'man al-Ghassani" }
summary:
  ar: "حسان بن النعمان الغساني؛ ولّى إفريقية فغزا ملكة البربر الكاهنة فهزمته فأتى قصوراً في حيز برقة فنزلها فسمّيت قصور حسان ثم غزاها ثانية فقتلها وسبى سبياً من البربر وبعث به إلى عبد العزيز بن مروان. اختطّ مدينة تونس سنة 82هـ قاعدةً عسكريةً بحريةً بأمر من عبد الملك بن مروان. {cite:salabi-umayyad-state-2020 p.20} ويذكر الكتاب أنه ولي إفريقية بعد أن أطلق له عبد الملك يد في أموال مصر، وبدأ الغزو سنة 74هـ، وأنه سار على سياسة أبي المهاجر في تأليف البربر وإشراكهم في الجيش، وأنشأ ديوان الجند ونظّم ديوان الخراج وبنى دار صناعة السفن في تونس، وأنه عُزل سنة 85هـ بعد خلاف مع أخيه والي مصر عبد العزيز بن مروان، وأقسم ألا يتولى لبني أمية أبداً. {cite:salabi-umayyad-state-2020 p.58-63}"
  en: "Hassan ibn al-Nu'man al-Ghassani; appointed over Ifriqiya, he raided the Berbers' queen al-Kahina who routed him — he lodged the glass-roofed castles in Barqa's bounds named Qusur Hassan for him — then raided her again, killed her, and sent a captivity of Berbers to Abd al-Aziz ibn Marwan."
