summary:
  ar: "حسان بن النعمان الغساني؛ ولّى إفريقية فغزا ملكة البربر الكاهنة فهزمته فأتى قصوراً في حيز برقة فنزلها فسمّيت قصور حسان ثم غزاها ثانية فقتلها وسبى سبياً من البربر وبعث به إلى عبد العزيز بن مروان."
  en: "Hassan ibn al-Nu'man al-Ghassani; appointed over Ifriqiya, he raided the Berbers' queen al-Kahina who routed him — he lodged the glass-roofed castles in Barqa's bounds named Qusur Hassan for him — then raided her again, killed her, and sent a captivity of Berbers to Abd al-Aziz ibn Marwan."
