summary:
  ar: "الشافعي السرائي؛ قدم القاهرة وولي مشيخة الرباط بالبرزية واعتنى بالحديث ولازم زين الدين العراقي وحصل النسخ الحسنة واعتنى بضبطها وتحسينها وكان يحفظ الحاوي ويدرس غالبه مع الخير والدين، وكان يحسن عمل صنائع عديدة؛ ومن لطائف قوله أن أول خروج تمرلنك في سنة «عذاب» يشير إلى ظهوره سنة ثلاث وسبعين وسبعمائة {cite:shadharat-dhahab p. 21}."
  tr: "El-Şafii el-Sara'i; Kahire'ye geldi ve Barzya'da Rabat şeyhliği olarak atandı, hadise kendini adadı, Zeydin el-Iraki'yi yakından takip etti, iyi el yazmaları elde etti, onları düzeltmeye ve geliştirmeye özen gösterdi, el-Hawi'yi ezberledi ve zamanının çoğunu iyilik ve dinle birlikte çalışarak geçirdi. Birçok zanaatta üstün başarı gösterdi; ifadesinin inceliklerinden biri, Timur'un 'Ezhab' yılında ilk kez ortaya çıkışının onun 773 Hicri yılında ortaya çıkışına işaret etmesidir {atıf:şadharat-dhahab, s. 21}."
  id: "Al-Shafi'i al-Sara'i; ia datang ke Kairo dan diangkat menjadi sheikh Rabat di Barzia, mendedikasikan dirinya pada hadis, mengikuti Zain al-Din al-Iraqi, memperoleh manuskrip yang baik, berusaha memperbaiki dan memperbaikinya, menghafal al-Hawi, dan menghabiskan sebagian besar waktunya belajar bersama kebaikan dan agama. Ia unggul dalam banyak keahlian; di antara kehalusan pernyataannya adalah bahwa kemunculan pertama Tamerlank pada tahun 'Azhab' merujuk pada kemunculannya pada tahun 773 H {cite:shadharat-dhahab, hlm. 21}."
