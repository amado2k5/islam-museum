label: { ar: "أبو خازم ابن القاضي أبي يعلى", en: "Abu Khazim ibn al-Qadi Abu Ya'la", fr: "Abu Khazim ibn al-Qadi Abu Ya'la", es: "Abu Khazim ibn al-Qadi Abu Ya'la", ur: "ابو خزیم ابن القدی ابو یعلی" }
names:
  - { value: "محمد بن محمد بن الحسين بن محمد بن أحمد بن خلف بن الفراء الحنبلي أبو خازم", kind: full }
summary:
  ar: "الفقيه الحنبلي الزاهد أبو خازم محمد بن محمد بن القاضي الإمام أبي يعلى وأخو القاضي أبي الحسين؛ ولد في صفر سنة سبع وخمسين وأربعمائة — قبل موت والده بسنة فأجاز له — وسمع الحديث من ابن المسلمة وابن المأمون وغيرهما، وقرأ الفقه على القاضي يعقوب ولازمه وعلق عنه وبرع في معرفة المذهب والخلاف والأصول، وصنف تصانيف مفيدة له كتاب التبصرة في الخلاف وكتاب رؤوس المسائل وشرح مختصر الخرقي، وكان من الفقهاء الزاهدين والأخيار الصالحين؛ توفي يوم الاثنين تاسع عشر صفر سنة سبع وعشرين وخمسمائة ودفن بداره بباب الأزج ونقل سنة أربع وثلاثين إلى مقبرة الإمام أحمد فدفن عند أبيه {cite:shadharat-dhahab p. 562}."
  en: "The ascetic Hanbali jurist Abu Khazim Muhammad ibn Muhammad — son of the qadi-imam Abu Ya'la and brother of qadi Abu al-Husayn; b. Safar 457, a year before his father's death, receiving his ijaza; he heard Ibn al-Muslima and Ibn al-Ma'mun, read fiqh under qadi Ya'qub and excelled in madhhab, khilaf and usul, authoring al-Tabsira on khilaf, Ru'us al-masa'il and a commentary on the Mukhtasar al-Khiraqi; d. Monday 19 Safar 527, buried at his Bab al-Azaj house, translated in 534 to Imam Ahmad's cemetery beside his father {cite:shadharat-dhahab p. 562}."
  fr: "Le juriste hanbalite ascète Abu Khazim Muhammad ibn Muhammad — fils du cadi et imam Abu Ya'la et frère du cadi Abu al-Husayn ; né en safar 457, un an avant la mort de son père, dont il reçut l'ijaza ; il entendit Ibn al-Muslima et Ibn al-Ma'mun, étudia le fiqh auprès du cadi Ya'qub et excella dans le madhhab, le khilaf et les usul, composant al-Tabsira sur le khilaf, Ru'us al-masa'il et un commentaire du Mukhtasar al-Khiraqi ; mort le lundi 19 safar 527, enterré dans sa maison de Bab al-Azaj, transféré en 534 au cimetière de l'imam Ahmad auprès de son père {cite:shadharat-dhahab p. 562}."
  es: "El jurista asceta hanbalí Abu Khazim Muhammad ibn Muhammad, hijo del cadí-imán Abu Ya'la y hermano del cadí Abu al-Husayn; b. Safar 457, un año antes de la muerte de su padre, recibiendo su ijaza; escuchó a Ibn al-Muslima e Ibn al-Ma'mun, leyó fiqh bajo el cadí Ya'qub y se destacó en madhab, khilaf y usul, siendo autor de al-Tabsira sobre khilaf, Ru'us al-masa'il y un comentario sobre el Mukhtasar al-Khiraqi; d. Lunes 19 Safar 527, enterrado en su casa de Bab al-Azaj, trasladado en 534 al cementerio del Imam Ahmad junto a su padre {cita: shadharat-dhahab p. 562}."
  ur: "بزرگ حنبلی فقیہ ابو خزیم محمد بن محمد - قاضی امام ابو یعل کے بیٹے اور قاضی ابو الحسین کے بھائی؛ ب صفر 457، اپنے والد کی وفات سے ایک سال پہلے، ان کا اعجاز حاصل کرنا؛ اس نے ابن المسلمہ اور ابن الممون کو سنا، قاضی یعقوب کے ماتحت فقہ پڑھا اور مذھب، خلافت اور اصول میں مہارت حاصل کی، خلافت پر التبسیرہ، روؤس المسائل اور مختار الخیراقی کی تفسیر تصنیف کی۔ d پیر 19 صفر 527، اپنے باب الازج کے گھر میں دفن ہوئے، جس کا ترجمہ 534 میں ان کے والد کے پاس امام احمد کے قبرستان میں کیا گیا۔ 562}۔"
  tr: "Hanbeli fıkıhçısı Ebu Hazim Muhammed ibn Muhammed ibn el-Kadi el-İmam Ebu Ya'la ve Kadı Ebu el-Hüseyin'in kardeşi; Hicri 457 yılının Safer ayında, babasının ölümünden bir yıl önce doğdu ve babası ona öğretme izni verdi. İbn el-Müslime, İbn el-Ma'mun ve diğerlerinden hadis öğrendi, Kadı Yakub'dan fıkıh eğitimi aldı, onunla birlikte kaldı, eserlerine tefsir etti ve mezhep, görüş ayrılıkları ve fıkıh esasları konusunda üstün bilgi sahibi oldu. El-Tabsira fi el-Hilaf, Ru'us el-Masa'il ve Mukhtasar el-Kharqi tefsiri gibi faydalı eserler kaleme aldı. O, zümreli fıkıhçılardan ve salih insanlardan biriydi. Hicri 527 yılının Safer ayının on dokuzuncu Pazartesi günü vefat etti ve Bab el-Azaj'daki evine defnedildi. Hicri 534 yılında ise İmam Ahmed'in türbesine taşınarak babasının yanına gömüldü. {Kaynak: Şadharat-Dhaba, s. 562}"
  id: "Abu Khazim Muhammad ibn Muhammad ibn al-Qadi al-Imam Abi Ya'la, seorang ahli hukum Hanbali yang hidup sederhana, dan saudara dari al-Qadi Abi al-Husayn, lahir pada bulan Safar tahun 457 H — setahun sebelum ayahnya meninggal, sehingga ia diizinkan untuk mengajar — dan ia mendengar hadits dari Ibnu al-Muslimah, Ibnu al-Ma'mun dan lainnya, dan ia mempelajari fiqih dengan al-Qadi Ya'qub dan tinggal bersamanya serta mengomentari karyanya dan unggul dalam pengetahuan tentang mazhab pemikiran, perbedaan pendapat dan prinsip-prinsip fiqih, dan ia menulis karya-karya yang bermanfaat, termasuk kitab al-Tabsira fi al-Khilaf, kitab Ru'us al-Masa'il dan tafsir atas Mukhtasar al-Kharqi, dan ia adalah salah satu ahli hukum yang hidup sederhana dan orang-orang saleh; Beliau wafat pada hari Senin, tanggal sembilan belas Safar, tahun 527 Hijriah dan dimakamkan di rumahnya di Bab al-Azaj, kemudian dipindahkan pada tahun 534 Hijriah ke pemakaman Imam Ahmad dan dimakamkan di samping ayahnya {cite:shadharat-dhahab p. 562}."
