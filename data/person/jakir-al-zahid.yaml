names:
  - { value: "جاكير الزاهد القدوة واسمه محمد بن دشم الكردي الحنبلي", kind: full }
summary:
  ar: "جاكير الزاهد القدوة أحد شيوخ العراق واسمه محمد بن دشم الكردي الحنبلي؛ له أصحاب وأتباع وأحوال وكرامات، ولم يتزوج، وله زاوية وضريح ببراذان وهي على بريد من سامراء، وقعد بعده أخوه الشيخ أحمد في المشيخة؛ قال ابن الأهدل لما شاع ذكره بعث إليه تاج العارفين أبو الوفاء طاقيته من الشيخ علي الهيتي ولم يكلفه الحضور، فقال الشيخ علي الهيتي سألت الله أن يكون جاكير من مريدي فوهبه لي وكان يفتخر به، وكان ربما عرف ما في بطون البهائم المنذورة له ومن يذبحها ومن يأكلها؛ سكن صحراء من صحارى العراق على يوم من سامراء ومات بها فبُني إلى جانبه قرية للتبرك به؛ توفي سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 785-786}."
  en: "Jakir the ascetic exemplar, one of Iraq's shaykhs — Muhammad b. Dashm the Kurdish Hanbali; he had disciples, followers, states and marvels, never married, and kept a zawiya and shrine at Barathan a post-stage from Samarra; his brother Ahmad succeeded him in the shaykhdom. When his fame spread, Taj al-Arifin Abu al-Wafa sent him Shaykh Ali al-Hiti's cap without obliging him to come — al-Hiti said 'I asked God that Jakir be my murid and He granted him to me', and boasted of him. He would know what lay in the bellies of beasts vowed to him, who slaughtered and who ate them. He lived in an Iraqi desert a day from Samarra, died there, and a village was built beside him for blessing; he died in 590 {cite:shadharat-dhahab p. 785-786}."
