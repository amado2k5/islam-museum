summary:
  ar: "جاكير الزاهد القدوة أحد شيوخ العراق واسمه محمد بن دشم الكردي الحنبلي؛ له أصحاب وأتباع وأحوال وكرامات، ولم يتزوج، وله زاوية وضريح ببراذان وهي على بريد من سامراء، وقعد بعده أخوه الشيخ أحمد في المشيخة؛ قال ابن الأهدل لما شاع ذكره بعث إليه تاج العارفين أبو الوفاء طاقيته من الشيخ علي الهيتي ولم يكلفه الحضور، فقال الشيخ علي الهيتي سألت الله أن يكون جاكير من مريدي فوهبه لي وكان يفتخر به، وكان ربما عرف ما في بطون البهائم المنذورة له ومن يذبحها ومن يأكلها؛ سكن صحراء من صحارى العراق على يوم من سامراء ومات بها فبُني إلى جانبه قرية للتبرك به؛ توفي سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 785-786}."
  en: "Jakir the ascetic exemplar, one of Iraq's shaykhs — Muhammad b. Dashm the Kurdish Hanbali; he had disciples, followers, states and marvels, never married, and kept a zawiya and shrine at Barathan a post-stage from Samarra; his brother Ahmad succeeded him in the shaykhdom. When his fame spread, Taj al-Arifin Abu al-Wafa sent him Shaykh Ali al-Hiti's cap without obliging him to come — al-Hiti said 'I asked God that Jakir be my murid and He granted him to me', and boasted of him. He would know what lay in the bellies of beasts vowed to him, who slaughtered and who ate them. He lived in an Iraqi desert a day from Samarra, died there, and a village was built beside him for blessing; he died in 590 {cite:shadharat-dhahab p. 785-786}."
  es: "Jakir, el asceta ejemplar, uno de los shaykhs de Irak — Muhammad b. Dashm, el hanbalí kurdo; tuvo discípulos, seguidores, estados y prodigios, nunca se casó y mantuvo una zawiya y un santuario en Barathan, a una etapa posterior de Samarra; su hermano Ahmad le sucedió en el shaykhdom. Cuando su fama se extendió, Taj al-Arifin Abu al-Wafa le envió el gorro del jeque Ali al-Hiti sin obligarlo a ir — al-Hiti dijo: «Le pedí a Dios que Jakir fuera mi murid y me lo concedió» y se jactó de él. Sabía lo que había en los vientres de las bestias que le habían sido consagradas, quién las sacrificaba y quién las comía. Vivió en un desierto iraquí a un día de Samarra, murió allí, y se construyó una aldea junto a él para bendecirla; murió en 590 {cite:shadharat-dhahab p. 785-786}."
  fr: "Jakir, modèle d'ascétisme, fut l'un des cheikhs d'Irak – Muhammad b. Dashm, hindou kurde. Il eut des disciples, des fidèles, et accomplit de grandes choses. Célibataire, il possédait une zawiya et un sanctuaire à Barathan, à proximité de Samarra. Son frère Ahmad lui succéda. Lorsque sa renommée se répandit, Taj al-Arifin Abu al-Wafa lui envoya la coiffe du cheikh Ali al-Hiti sans l'obliger à venir. Al-Hiti déclara: « J'ai demandé à Dieu que Jakir soit mon disciple et Il me l'a accordé », et il se vanta de lui. Il savait ce que contenaient les bêtes qui lui étaient vouées, qui les avait abattues et qui les avait mangées. Il vécut dans un désert irakien, à une journée de Samarra, où il mourut. Un village fut construit près de lui en son honneur. Il mourut en 590 av. J.-C. (cf. Hadharat-Dhahab, p. 785-786)."
  ur: "جاکر ایک مثالی سنت، عراق کے شیخوں میں سے ایک - محمد بن۔ دشم کرد حنبلی؛ اس کے شاگرد، پیروکار، ریاستیں اور عجائبات تھے، انہوں نے کبھی شادی نہیں کی، اور سامرا سے بعد کے مرحلے باراتھن میں زاویہ اور مزار رکھا۔ ان کے بھائی احمد نے ان کے بعد شیخ کی جگہ لی۔ جب ان کی شہرت پھیلی تو تاج العارفین ابو الوفاء نے انہیں شیخ علی الحطی کی ٹوپی بھیجی جس پر انہیں آنے کا پابند نہیں کیا گیا- الحطی نے کہا کہ میں نے خدا سے عرض کیا کہ جاکر میرا مرید ہو اور اس نے مجھے عطا کیا، اور اس پر فخر کیا۔ اسے معلوم ہو گا کہ درندوں کے پیٹوں میں کیا ہے جو اس نے منت مانی، کس نے ذبح کیا اور کون کھا گیا۔ وہ سامرا سے ایک دن عراق کے ایک صحرا میں رہتا تھا، وہیں فوت ہوا، اور اس کے پاس برکت کے لیے ایک گاؤں بنایا گیا۔ ان کی وفات 590ء میں ہوئی۔ 785-786}۔"
