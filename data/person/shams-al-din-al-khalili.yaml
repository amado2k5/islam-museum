summary:
  ar: بطاقة أولية لشمس الدين أبي عبد الله الخليلي، فلكي دمشق في القرن الرابع عشر وموقتها
    الذي وضع جداول القبلة والتوقيت الشهيرة، توفي سنة ١٣٨٠م؛ تذكره كتب التراجم ولم
    تُراجع ترجمته على الصفحة بعد.
  en: Draft card for Shams al-Din Abu Abd Allah al-Khalili, the fourteenth-century
    Damascus astronomer and muwaqqit who produced the famous qibla and prayer-time
    tables, d. 1380; the biographical entry is not yet checked on the page.
  es: "Ficha de borrador para Shams al-Din Abu Abd Allah al-Khalili, el astrónomo y muwaqqit de Damasco del siglo XIV que elaboró las famosas tablas de la qibla y los horarios de oración, fallecido en 1380; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Shams al-Din Abu Abd Allah al-Khalili, l'astronome et muwaqqit damasque du XIVe siècle qui a produit les célèbres tables de la qibla et des heures de prière, mort en 1380; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "شمس الدین ابو عبد اللہ الخلیلی کے لیے ڈرافٹ کارڈ، چودھویں صدی کے دمشق کے ماہر فلکیات اور موقیت جنہوں نے مشہور قبلہ اور نماز کے وقت کی میزیں تیار کیں، ڈی۔ 1380; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Şam'ın 14. yüzyıl zamanlayıcısı ve ünlü kıble ile zaman çizelgelerini kuran Şemseddin Ebu Abdullah el-Halili'nin ön kartı. 1380 yılında öldü; biyografik kitaplarda adı geçti ve biyografisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan Shams al-Din Abu Abdullah al-Khalili, abad ke-14 dan waktu Damaskus yang mendirikan Qibla dan jadwal waktu yang terkenal. Ia meninggal pada tahun 1380 M; buku biografi menyebutkannya, dan biografinya belum ditinjau di halaman tersebut."
