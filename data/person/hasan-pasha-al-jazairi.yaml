  ar: "حسن باشا بن خير الدين بربروسة، بيلربك الجزائر ثم القائد العام للأسطول العثماني؛ حصّن الجزائر وحسم أمر تلمسان بهزيمة السعديين سنة 959هـ، وساس سياسة مستقلة حتى على فرنسا، فاعتقله الإنكشاريون سنة 969هـ، ثم عُيّن قائداً عاماً للأسطول سنة 975هـ."
  en: "Hasan Pasha son of Khayr al-Din Barbarossa, beylerbey of Algiers then commander-in-chief of the Ottoman fleet; he fortified Algiers, settled Tlemcen by defeating the Sa'dis in 959, pursued an independent policy even toward France until the Janissaries arrested him in 969, and was made fleet commander in 975."
