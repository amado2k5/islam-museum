summary:
  ar: "أبو عبد الله محمد بن علي النصري، آخر ملوك الأندلس ⁦(توفي 940 هـ / 1533 م)⁩: ولد في غرناطة، وأسره الإسبان سنة 888 هـ ثم أطلقوه فنازع عمه الزغل ودخل غرناطة سنة 892 هـ، وسلّم الحمراء بعد حرب وحصار، وخرج إلى فاس سنة 897 هـ. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 290–291}"
  en: "Abu Abdallah Muhammad ibn Ali al-Nasri, the last king of al-Andalus (died 940 AH / 1533), called Boabdil by the Spaniards: born in Granada, captured by the Spaniards in 888 AH and released, he contested the throne with his uncle al-Zaghal and entered Granada in 892 AH; after war and siege he gave up the Alhambra and left for Fez in 897 AH. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 290–291}"
  es: "Abu Abdallah Muhammad ibn Ali al-Nasri, el último rey de al-Ándalus (fallecido en 940 AH / 1533), llamado Boabdil por los españoles: nacido en Granada, capturado por los españoles en 888 AH y liberado, disputó el trono con su tío al-Zaghal y entró en Granada en 892 AH; tras la guerra y el asedio, renunció a la Alhambra y partió hacia Fez en 897 AH. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 290–291}"
