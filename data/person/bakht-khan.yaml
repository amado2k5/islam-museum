summary:
  ar: "قائد عسكري هندي (1797–1859)، صوبدار في مدفعية الخيالة البنغالية بجيش شركة الهند الشرقية بخبرة أربعين سنة. في تمرد 1857 سار بلواء بريلي إلى دلهي، فصار القائد الفعلي لقوات الثورة المدافعة عن المدينة في ظل الإمبراطور المغولي بهادر شاه ظفر، وبعد سقوط دلهي التحق بصفوف الثوار في أوده، وتوفي جريحًا في سهول التراي بنيبال سنة 1859."
  en: "Indian military commander (1797–1859), a subedar in the Bengal Horse Artillery of the East India Company's army with forty years' service. In the rebellion of 1857 he marched with the Bareilly brigade to Delhi and became the effective commander of the rebel forces defending the city under the Mughal emperor Bahadur Shah Zafar; after Delhi fell he joined the rebels in Awadh, and died of his wounds in the Terai plains of Nepal in 1859."
  ur: "ہندوستانی عسکری قائد (1797ء–1859ء)، ایسٹ انڈیا کمپنی کی فوج میں بنگال ہارس آرٹلری کے صوبہ دار، چالیس سال کی خدمت کے ساتھ۔ 1857ء کی جنگ میں بریلی بریگیڈ کے ساتھ دہلی پہنچے اور مغل شہنشاہ بہادر شاہ ظفر کے تحت شہر کا دفاع کرنے والی باغی فوج کے اصل سپہ سالار بنے؛ دہلی کے سقوط کے بعد اودھ کے باغیوں سے جا ملے اور 1859ء میں نیپال کے ترائی میدانوں میں زخموں سے وفات پائی۔"
