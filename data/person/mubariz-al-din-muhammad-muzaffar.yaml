label:
  ar: مبارز الدين محمد بن المظفر
  en: Mubariz al-Din Muhammad ibn al-Muzaffar
summary:
  ar: "مبارز الدين محمد بن المظفر اليزدي، مؤسس ملك بني المظفر الحقيقي؛ تغلب على كرمان ونواحيها ثم طمع في فارس، فلما قتل ابن أخيه أبو إسحاق أمير شيخ شريفاً من أعيان شيراز نادى بالنكير عليه وسار في جموعه إليها فمال إليه أهل البلد لنفرتهم عن أمير شيخ فأمكنوه منها وملك كرسيها، وهرب أبو إسحاق إلى أصفهان فاتبعه وملكها وبث الطلب حتى قبض عليه فقتله قصاصاً بالشريف، وكان له من الولد أربعة: شاه ولي ومحمود وشجاع وأحمد ملكوا بعده ثم استلحم تمر عقبهم."
  en: "Mubariz al-Din Muhammad ibn al-Muzaffar al-Yazdi, the true founder of Muzaffarid kingship; he took Kirman and its country, then coveting Fars raised the outcry against his nephew Abu Ishaq Amir Shaykh for killing a Shirazi sharif — the city, resentful of Amir Shaykh, opened to him, he took its throne, chased Abu Ishaq to Isfahan, seized it, hunted him down and killed him as qisas for the sharif; his four sons — Shah Wali, Mahmud, Shuja' and Ahmad — ruled after him until Timur exterminated the line."
