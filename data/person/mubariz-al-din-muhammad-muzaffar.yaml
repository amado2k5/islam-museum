id: person/mubariz-al-din-muhammad-muzaffar
class: person
label:
  ar: مبارز الدين محمد بن المظفر
  en: Mubariz al-Din Muhammad ibn al-Muzaffar
  es: "Mubariz al-Din Muhammad ibn al-Muzaffar"
  fr: "Mubariz al-Din Muhammad ibn al-Muzaffar"
summary:
  ar: "مبارز الدين محمد بن المظفر اليزدي، مؤسس ملك بني المظفر الحقيقي؛ تغلب على كرمان ونواحيها ثم طمع في فارس، فلما قتل ابن أخيه أبو إسحاق أمير شيخ شريفاً من أعيان شيراز نادى بالنكير عليه وسار في جموعه إليها فمال إليه أهل البلد لنفرتهم عن أمير شيخ فأمكنوه منها وملك كرسيها، وهرب أبو إسحاق إلى أصفهان فاتبعه وملكها وبث الطلب حتى قبض عليه فقتله قصاصاً بالشريف، وكان له من الولد أربعة: شاه ولي ومحمود وشجاع وأحمد ملكوا بعده ثم استلحم تمر عقبهم."
  en: "Mubariz al-Din Muhammad ibn al-Muzaffar al-Yazdi, the true founder of Muzaffarid kingship; he took Kirman and its country, then coveting Fars raised the outcry against his nephew Abu Ishaq Amir Shaykh for killing a Shirazi sharif — the city, resentful of Amir Shaykh, opened to him, he took its throne, chased Abu Ishaq to Isfahan, seized it, hunted him down and killed him as qisas for the sharif; his four sons — Shah Wali, Mahmud, Shuja' and Ahmad — ruled after him until Timur exterminated the line."
  es: "Mubariz al-Din Muhammad ibn al-Muzaffar al-Yazdi, el verdadero fundador de la monarquía muzaffarí; tomó Kirman y su territorio, luego, codiciando Fars, alzó la voz contra su sobrino Abu Ishaq Amir Shaykh por matar a un sharif shirazí; la ciudad, resentida con Amir Shaykh, se le abrió, tomó su trono, persiguió a Abu Ishaq hasta Isfahán, la tomó, lo persiguió y lo mató como castigo por el sharif; sus cuatro hijos —Shah Wali, Mahmud, Shuja' y Ahmad— gobernaron después de él hasta que Timur exterminó la línea."
  fr: "Mubariz al-Din Muhammad ibn al-Muzaffar al-Yazdi, le véritable fondateur de la royauté muzaffaride, s'empara de Kirman et de son territoire, puis, convoitant le Fars, il porta plainte contre son neveu Abu Ishaq Amir Shaykh pour avoir tué un chérif de Shirazi. La ville, rancunière envers Amir Shaykh, lui ouvrit ses portes, il prit le trône, poursuivit Abu Ishaq jusqu'à Ispahan, s'en empara, le traqua et le tua en guise de qisas pour le chérif. Ses quatre fils, Shah Wali, Mahmud, Shuja' et Ahmad, régnèrent après lui jusqu'à ce que Timour anéantisse la lignée."
