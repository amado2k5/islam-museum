summary:
  ar: ناشطة جنوب أفريقية ضد الفصل العنصري ومدافعة عن حقوق المرأة وسياسية، وُلدت في فيرينجنغ سنة 1930. من قيادات اتحاد نساء جنوب أفريقيا، قضت خمس عشرة سنة تحت الإقامة الجبرية، وانتُخبت للجمعية الوطنية في أول انتخابات ديمقراطية سنة 1994، وكانت صديقة قديمة لنيلسون مانديلا وحليفة له.
  en: South African anti-apartheid activist, women's rights campaigner and politician, born in Vereeniging in 1930. A leader of the Federation of South African Women, she spent fifteen years under house arrest, was elected to the National Assembly in the first democratic election of 1994, and was a longtime friend and ally of Nelson Mandela.
  ur: جنوبی افریقی نسل پرستی مخالف کارکن، خواتین کے حقوق کی علمبردار اور سیاست دان، جو 1930 میں ویرینِگنگ میں پیدا ہوئیں۔ فیڈریشن آف ساؤتھ افریقن ویمن کی رہنما، پندرہ برس نظربندی میں رہیں، 1994 کے پہلے جمہوری انتخابات میں قومی اسمبلی کی رکن منتخب ہوئیں، اور نیلسن منڈیلا کی دیرینہ دوست اور حلیف تھیں۔
