  es: "Abu Ali al-Fariqi - cadí shafi'i de Wasit; estudió con Abu Ishaq al-Shirazi e Ibn al-Sabbagh en Bagdad, escuchó hadices de al-Khatib al-Baghdadi, fue autor de al-Fawa'id sobre el Muhadhdhab {citar:wafayat-ayan}."
  ur: "ابو علی الفارقی - وسط کے شافعی قاضی؛ بغداد میں ابو اسحاق الشیرازی اور ابن الصباغ سے تعلیم حاصل کی، الخطیب البغدادی سے حدیث سنی، محدث پر الفوائد کی تصنیف کی۔"
