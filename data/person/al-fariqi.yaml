  ar: "أبو علي الحسن بن إبراهيم الفارقي، الشافعي الأزدي؛ اشتغل أولاً على أبي محمد المجد الكازروني ثم انتقل إلى بغداد فاشتغل على الشيخ أبي إسحاق الشيرازي صاحب المهذب وعلى أبي نصر بن الصباغ صاحب الشامل، وتولى قضاء واسط وكان زاهداً متورعاً، وسمع الحديث من الخطيب أبي بكر، وله كتاب الفوائد على المهذب {cite:wafayat-ayan}."
