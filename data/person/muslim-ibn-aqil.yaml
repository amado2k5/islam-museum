summary:
  ar: "ابن عم الحسين بن علي، وجّهه الحسين إلى الكوفة استجابة لرسل أهلها سنة ستين {cite:tabari-tarikh-abu-al-fadl j.5 p.347}. نزل دار هانئ بن عروة المرادي حين خرج من دار المختار {cite:tabari-tarikh-abu-al-fadl j.5 p.362}. وعند المسعودي خرج من مكة في النصف من رمضان فقدم الكوفة لخمس خلون من شوال فنزل على عوسجة مستتراً فبايعه اثنا عشر ألفاً وقيل ثمانية عشر، ولما أمر منادياً يا منصور اجتمع إليه ثمانية عشر ألفاً فسار إلى ابن زياد فحصره في القصر ثم لم يمس ومعه غير مائة فتفرقوا حتى لم يبق معه أحد، فنزل على مولاة للأشعث بن قيس فآوته وفرقت له فأعلم ابنها محمد بن الأشعث بمكانه {cite:muruj-al-dhahab p. 53-57}"
