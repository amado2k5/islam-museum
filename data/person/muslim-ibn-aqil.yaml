class: person
label: { ar: "مسلم بن عقيل بن أبي طالب" }
summary:
  ar: "ابن عم الحسين بن علي، وجّهه الحسين إلى الكوفة استجابة لرسل أهلها سنة ستين {cite:tabari-tarikh-abu-al-fadl j.5 p.347}. نزل دار هانئ بن عروة المرادي حين خرج من دار المختار {cite:tabari-tarikh-abu-al-fadl j.5 p.362}. وعند المسعودي خرج من مكة في النصف من رمضان فقدم الكوفة لخمس خلون من شوال فنزل على عوسجة مستتراً فبايعه اثنا عشر ألفاً وقيل ثمانية عشر، ولما أمر منادياً يا منصور اجتمع إليه ثمانية عشر ألفاً فسار إلى ابن زياد فحصره في القصر ثم لم يمس ومعه غير مائة فتفرقوا حتى لم يبق معه أحد، فنزل على مولاة للأشعث بن قيس فآوته وفرقت له فأعلم ابنها محمد بن الأشعث بمكانه {cite:muruj-al-dhahab p. 53-57}"
  tr: "O, altmış yılda Hüseyin'in halkının elçilerine yanıt olarak Kufe'ye gönderdiği el-Hüseyin bin Ali'nin kuzeniydi {cite:tabari-tarikh-abu-al-fadl j.5 s.347}. Hani ibn Urwah al-Muradi'nin evinden ayrılırken onun evinde kaldı {cite:tabari-tarikh-abu-al-fadl j.5 s.362}. El-Mesud ile birlikte, Ramazan ortasında Mekke'den ayrıldı ve Şevval'den beş gün önce Kufe'ye vardı, Awsace'de gizlice kamp kurdu ve ona on iki bin, bazıları on sekiz diyor ki, bağlılık yemini etti. Bir çağıran Mansur adında çağırmasını emrettiğinde, on sekiz bin kişi onun için toplandı, bu yüzden sarayda onu kuşatan İbn Ziyad'a gitti, sonra sadece yüz kişi dokundu. Onlarla kimse kalmayana kadar dağıldılar. El-Eşat bin Kays'ın bir müşterisinde kaldı, ona sığındı ve onun için dağıldı. Oğlu Muhammed bin Eş'at'a nerede olduğunu bildirdi {atıf:Muruj-al-Dhahab, s. 53-57}"
  id: "Ia adalah sepupu al-Husayn ibn Ali, yang dikirim Husayn ke Kufa sebagai tanggapan kepada utusan rakyatnya pada tahun enam puluh {cite:tabari-tarikh-abu-al-fadl j.5 hlm.347}. Ia tinggal di rumah Hani ibn Urwah al-Muradi ketika ia meninggalkan rumah al-Mukhtar {cite:tabari-tarikh-abu-al-fadl j.5 hlm.362}. Bersama al-Mas'ud, ia meninggalkan Mekah di tengah Ramadan dan tiba di Kufa lima hari sebelum Shawwal, berkemah di Awsajah dalam persembunyian, bersumpah setia kepadanya dua belas ribu, atau ada yang mengatakan delapan belas. Ketika ia memerintahkan seorang pemanggil untuk memanggilnya, Mansur, delapan belas ribu berkumpul untuknya, lalu ia pergi ke Ibn Ziyad, yang mengepungnya di istana, lalu tidak menyentuhnya kecuali seratus orang. Mereka bercerai-berai hingga tidak ada lagi yang tersisa bersamanya. Ia tinggal di tempat pelanggan al-Ash'ath ibn Qays, membawanya berlindung, dan menyebar untuknya. Ia memberitahu putranya Muhammad ibn al-Ash'ath tentang keberadaannya {cite:muruj-al-dhahab, hlm. 53-57}"
