summary:
  ar: "الزاهد عبد الغني بن شجاع أبو بكر البغدادي الحنبلي المعروف بابن نقطة؛ قال السخاوي هو مشهور بالتقلل والإيثار والزهد، وكان له ببغداد زاوية يأوي إليها الفقراء ولم يكن في عصره من يقاومه في التجريد، كان يفتح عليه قبل غروب الشمس بألف دينار فيفرقها والفقراء صيام فلا يدخر لهم منها شيئاً ويقول «نحن لا نعمل بأجرة»؛ وزوجه أم الخليفة الناصر جارية من خواصها وجهزتها بعشرة آلاف دينار فما حال الحول وعنده سوى هاون، فجاء فقير فقال لي ثلاثة أيام ما أكلت شيئاً فأخرج إليه الهاون وقال لا تشنع على الله، أكلك بهذا ثلاثين يوماً؛ توفي في رابع جمادى الآخرة ببغداد {cite:shadharat-dhahab p. 758}."
  en: "The ascetic Abd al-Ghani b. Shuja', Abu Bakr the Baghdadi Hanbali known as Ibn Nuqta; al-Sakhawi calls him famed for wantlessness and self-denial — he kept a zawiya in Baghdad sheltering the poor, and none in his age matched his stripping-away: a thousand dinars would open to him before sunset and he would scatter it to fasting poor men keeping nothing, saying 'we do not work for wages'. The caliph al-Nasir's mother married him to one of her maids with ten thousand dinars, and before the year turned he had nothing left but a mortar — which he gave to a beggar who had not eaten in three days, saying 'it will feed you thirty days'; he died 4 Jumada II in Baghdad {cite:shadharat-dhahab p. 758}."
  fr: "L'ascète Abd al-Ghani b. Shuja', Abu Bakr, hanbalite de Bagdad connu sous le nom d'Ibn Nuqta ; al-Sakhawi le dit célèbre pour son détachement et son renoncement — il tenait à Bagdad une zawiya abritant les pauvres, et nul en son temps ne l'égalait dans le dépouillement : mille dinars lui venaient avant le coucher du soleil et il les distribuait aux pauvres qui jeûnaient sans rien garder, disant « nous ne travaillons pas pour un salaire ». La mère du calife al-Nasir lui donna en mariage l'une de ses servantes avec dix mille dinars, et avant la fin de l'année il ne lui restait qu'un mortier — qu'il donna à un mendiant qui n'avait pas mangé depuis trois jours, disant « il te nourrira trente jours » ; il mourut le 4 jumada II à Bagdad {cite:shadharat-dhahab p. 758}."
  es: "El asceta Abd al-Ghani b. Shuja', Abu Bakr el hanbalí bagdadí conocido como Ibn Nuqta; al-Sakhawi lo llama famoso por su desapego y abnegación: mantenía una zawiya en Bagdad que albergaba a los pobres, y nadie en su época igualaba su generosidad: mil dinares se abrían ante él antes del atardecer y los repartía entre hombres pobres en ayunas que no conservaban nada, diciendo: \"No trabajamos por salario\". La madre del califa al-Nasir lo casó con una de sus criadas con diez mil dinares, y antes de que terminara el año no le quedaba nada más que un mortero, que le dio a un mendigo que no había comido en tres días, diciéndole: \"Te alimentará durante treinta días\"; murió el 4 de Jumada II en Bagdad {cite:shadharat-dhahab p. 758}."
  ur: "سنیاسی عبد الغنی بی۔ شجاع، ابو بکر بغدادی حنبلی جسے ابن نکتہ کے نام سے جانا جاتا ہے۔ ال سخاوی اسے بے بسی اور خود غرضی کے لیے مشہور کہتا ہے - اس نے بغداد میں غریبوں کو پناہ دینے کے لیے ایک زاویہ رکھا تھا، اور اس کی عمر میں کوئی بھی اس کے چھیننے سے میل نہیں کھاتا تھا: سورج غروب ہونے سے پہلے اس کے لیے ایک ہزار دینار کھل جاتے تھے اور وہ اسے روزہ دار غریبوں پر بکھیر دیتے تھے، یہ کہتے ہوئے کہ 'ہم اجرت پر کام نہیں کرتے'۔ خلیفہ الناصر کی والدہ نے اس کی شادی اپنی ایک لونڈی سے دس ہزار دینار دے کر کر دی، اور سال شروع ہونے سے پہلے اس کے پاس ایک مارٹر کے سوا کچھ نہیں بچا تھا - جو اس نے ایک ایسے بھکاری کو دے دیا جس نے تین دن میں کچھ نہیں کھایا تھا، یہ کہتے ہوئے کہ 'یہ تمہیں تیس دن کھلائے گا'؛ ان کی وفات 4 جمادی الثانی بغداد میں ہوئی۔ 758}۔"
