label: { ar: "عبد الغني ابن نقطة" }
names:
  - { value: "عبد الغني بن شجاع أبو بكر البغدادي الحنبلي المعروف بابن نقطة", kind: full }
summary:
  ar: "الزاهد عبد الغني بن شجاع أبو بكر البغدادي الحنبلي المعروف بابن نقطة؛ قال السخاوي هو مشهور بالتقلل والإيثار والزهد، وكان له ببغداد زاوية يأوي إليها الفقراء ولم يكن في عصره من يقاومه في التجريد، كان يفتح عليه قبل غروب الشمس بألف دينار فيفرقها والفقراء صيام فلا يدخر لهم منها شيئاً ويقول «نحن لا نعمل بأجرة»؛ وزوجه أم الخليفة الناصر جارية من خواصها وجهزتها بعشرة آلاف دينار فما حال الحول وعنده سوى هاون، فجاء فقير فقال لي ثلاثة أيام ما أكلت شيئاً فأخرج إليه الهاون وقال لا تشنع على الله، أكلك بهذا ثلاثين يوماً؛ توفي في رابع جمادى الآخرة ببغداد {cite:shadharat-dhahab p. 758}."
  en: "The ascetic Abd al-Ghani b. Shuja', Abu Bakr the Baghdadi Hanbali known as Ibn Nuqta; al-Sakhawi calls him famed for wantlessness and self-denial — he kept a zawiya in Baghdad sheltering the poor, and none in his age matched his stripping-away: a thousand dinars would open to him before sunset and he would scatter it to fasting poor men keeping nothing, saying 'we do not work for wages'. The caliph al-Nasir's mother married him to one of her maids with ten thousand dinars, and before the year turned he had nothing left but a mortar — which he gave to a beggar who had not eaten in three days, saying 'it will feed you thirty days'; he died 4 Jumada II in Baghdad {cite:shadharat-dhahab p. 758}."
