summary:
  ar: "معلمة شرعية تقيم في ميسيساغا بكندا. درست في دمشق مدة سنتين العقيدة والفقه والتجويد والتفسير واللغة العربية، وحصلت على الماجستير في اللغة العربية من جامعة تكساس في أوستن، ثم درست الفقه والعربية في عمّان بالأردن، وتجيب عن الأسئلة الشرعية في موقع سيكرز غايدنس."
  en: "Islamic teacher based in Mississauga, Canada. She lived in Damascus, Syria for two years studying aqidah, fiqh, tajweed, tafsir and Arabic, completed a Master's in Arabic at the University of Texas at Austin, then studied fiqh and Arabic in Amman, Jordan. She answers religious questions for SeekersGuidance."
  ur: "کینیڈا کے شہر مسی ساگا میں مقیم اسلامی معلمہ۔ انہوں نے دمشق میں دو سال عقیدہ، فقہ، تجوید، تفسیر اور عربی کی تعلیم حاصل کی، یونیورسٹی آف ٹیکساس ایٹ آسٹن سے عربی میں ماسٹرز کیا، پھر عمان (اردن) میں فقہ اور عربی پڑھی، اور سیکرز گائیڈنس پر شرعی سوالات کے جوابات دیتی ہیں۔"
