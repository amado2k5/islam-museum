summary:
  ar: "أمير أسبانيا ابن الإمبراطور شارل الخامس؛ إليه رفع الكونت دي الكوديت حاكم وهران تقرير وفده إلى فاس بشأن الحملة الأسبانية المغربية المقترحة ضد العثمانيين سنة ٩٦٣هـ/١٥٥٥م {cite:dawlat-uthmaniyya-salabi p. 242}. وبعد أن عجز الأمير دون أنطونيو عن مقاومة قواته ضمّت أسبانيا البرتغال سنة ٩٨٨هـ/١٥٨٠م ودخل فيليب العاصمة لشبونة في ٢٧ جمادى الآخرة ٩٨٩هـ/٣١ يوليو ١٥٨١م؛ وقارب اتفاقاً عسكرياً مع أحمد المنصور لمواجهة التدخل العثماني مقابل التنازل عن العرائش وامتيازات أخرى {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  en: "Prince of Spain, son of Emperor Charles V; to him the Count of Alcaudete, governor of Oran, forwarded his embassy's report from Fez on the proposed Spanish-Moroccan campaign against the Ottomans, in 963/1555 {cite:dawlat-uthmaniyya-salabi p. 242}. After Prince Don António failed to resist his forces, Spain annexed Portugal in 988/1580 and Philip entered the capital Lisbon on 27 Jumada II 989/31 July 1581; he also neared a military agreement with Ahmad al-Mansur against Ottoman intervention, in exchange for Larache and other concessions {cite:dawlat-uthmaniyya-salabi p. 270-271}."
