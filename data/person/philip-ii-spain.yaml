summary:
  ar: "أمير أسبانيا ابن الإمبراطور شارل الخامس؛ إليه رفع الكونت دي الكوديت حاكم وهران تقرير وفده إلى فاس بشأن الحملة الأسبانية المغربية المقترحة ضد العثمانيين سنة ٩٦٣هـ/١٥٥٥م {cite:dawlat-uthmaniyya-salabi p. 242}. وبعد أن عجز الأمير دون أنطونيو عن مقاومة قواته ضمّت أسبانيا البرتغال سنة ٩٨٨هـ/١٥٨٠م ودخل فيليب العاصمة لشبونة في ٢٧ جمادى الآخرة ٩٨٩هـ/٣١ يوليو ١٥٨١م؛ وقارب اتفاقاً عسكرياً مع أحمد المنصور لمواجهة التدخل العثماني مقابل التنازل عن العرائش وامتيازات أخرى {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  en: "Prince of Spain, son of Emperor Charles V; to him the Count of Alcaudete, governor of Oran, forwarded his embassy's report from Fez on the proposed Spanish-Moroccan campaign against the Ottomans, in 963/1555 {cite:dawlat-uthmaniyya-salabi p. 242}. After Prince Don António failed to resist his forces, Spain annexed Portugal in 988/1580 and Philip entered the capital Lisbon on 27 Jumada II 989/31 July 1581; he also neared a military agreement with Ahmad al-Mansur against Ottoman intervention, in exchange for Larache and other concessions {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  es: "Príncipe de España, hijo del emperador Carlos V; a él, el conde de Alcaudete, gobernador de Orán, le remitió el informe de su embajada desde Fez sobre la propuesta campaña hispano-marroquí contra los otomanos, en 963/1555 {cite:dawlat-uthmaniyya-salabi p. 242}. Después de que el príncipe Don Antonio no lograra resistir a sus fuerzas, España anexó Portugal en 988/1580 y Felipe entró en la capital, Lisboa, el 27 de Jumada II de 989/31 de julio de 1581; también estuvo cerca de un acuerdo militar con Ahmad al-Mansur contra la intervención otomana, a cambio de Larache y otras concesiones {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  fr: "Le prince d'Espagne, fils de l'empereur Charles Quint, reçut du comte d'Alcaudete, gouverneur d'Oran, le rapport de son ambassade de Fès concernant la campagne hispano-marocaine envisagée contre les Ottomans, en 963/1555 (voir Dawlat-Uthmaniyya-Salabi, p. 242). Après la défaite du prince Don António face à ses troupes, l'Espagne annexa le Portugal en 988/1580 et Philippe entra dans la capitale, Lisbonne, le 27 Jumada II 989/31 juillet 1581. Il était également sur le point de conclure un accord militaire avec Ahmad al-Mansur contre une intervention ottomane, en échange de Larache et d'autres concessions (voir Dawlat-Uthmaniyya-Salabi, p. 270-271)."
  ur: "سپین کا شہزادہ، شہنشاہ چارلس پنجم کا بیٹا؛ اوران کے گورنر، کاؤنٹ آف الکاؤڈیٹ نے، 963/1555 میں عثمانیوں کے خلاف ہسپانوی-مراکش کی مجوزہ مہم کے بارے میں فیز سے اپنے سفارت خانے کی رپورٹ بھیجی۔ 242}۔ شہزادہ ڈان انتونیو اپنی افواج کے خلاف مزاحمت کرنے میں ناکام ہونے کے بعد، اسپین نے 988/1580 میں پرتگال پر قبضہ کر لیا اور فلپ 27 جمادی الثانی 989/31 جولائی 1581 کو دارالحکومت لزبن میں داخل ہوا۔ اس نے لاراشے اور دیگر مراعات کے بدلے میں عثمانی مداخلت کے خلاف احمد المنصور کے ساتھ ایک فوجی معاہدہ بھی کیا تھا۔ 270-271}۔"
  tr: "İspanya Prensi, İmparator V. Charles'ın oğlu; Oran Valisi Kontu de Coudet, 963 Hicri/1555 M.S. Osmanlılara karşı önerilen İspanyol-Fas seferi hakkında Fes'e gönderdiği heyetin raporunu sundu {atıf:dawlat-uthmaniyya-salabi, s. 242}. Prens Don Antonio kuvvetlerine direnemeyince, İspanya 988 Hicri/1580 M.S.'de Portekiz'i ilhak etti ve Philip, 27 Jumada al-Akhira 989 Hicri / 31 Temmuz 1581'de başkent Lizbon'a girdi; Ahmed el-Mansur ile Osmanlı müdahalesine karşı koymak için askeri bir anlaşma müzakere etti ve karşılığında Larache ve diğer ayrıcalıklardan vazgeçti {cite:dawlat-uthmaniyya-salabi s. 270-271}."
  id: "Pangeran Spanyol, putra Kaisar Charles V; kepada siapa Count de Coudet, Gubernur Oran, menyerahkan laporan delegasinya ke Fez mengenai kampanye Spanyol-Maroko yang diusulkan melawan Ottoman pada 963 H/1555 M {cite:dawlat-uthmaniyya-salabi, hlm. 242}. Setelah Pangeran Don Antonio gagal melawan pasukannya, Spanyol menganeksasi Portugal pada 988 H/1580 M, dan Philip memasuki ibu kota Lisbon pada 27 Jumada al-Akhira 989 AH / 31 Juli 1581 M; ia merundingkan kesepakatan militer dengan Ahmed al-Mansur untuk menghadapi intervensi Ottoman sebagai imbalan menyerahkan Larache dan hak istimewa lainnya {cite:dawlat-uthmaniyya-salabi hlm. 270-271}."
