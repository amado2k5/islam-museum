summary:
  ar: "ناشطة نسوية ووطنية تونسية (1913–1993)، ابنة شيخ الإسلام محمد الصالح بن مراد، أسست سنة 1936 الاتحاد النسائي الإسلامي التونسي، أول منظمة نسائية تونسية، وترأسته حتى حلّه سنة 1956. تربّت في بيت علم على أيدي مشايخ الزيتونة، وكتبت في مجلة والدها «شمس الإسلام» وفي الصحافة التونسية داعية إلى تعليم الفتاة التونسية ومشاركة المرأة في الحركة الوطنية، ثم أُقصيت عن العمل النسائي الرسمي بعد الاستقلال."
  en: "Tunisian feminist and nationalist activist (1913–1993), daughter of the shaykh al-Islam Mohamed Salah Ben Mrad. In 1936 she founded the Muslim Union of Tunisian Women (UMFT), the first Tunisian women's organisation, and chaired it until its dissolution in 1956. Raised in a scholarly household and taught by Zaytuna shaykhs, she wrote in her father's journal Shams al-Islam and in the Tunisian press for the education of Tunisian girls and for women's part in the national movement, before being pushed aside from official women's work after independence."
  ur: "تونسی حقوقِ نسواں کی علمبردار اور قوم پرست کارکن (1913–1993)، شیخ الاسلام محمد الصالح بن مراد کی بیٹی۔ انہوں نے 1936ء میں الاتحاد النسائي الإسلامي التونسي قائم کی، جو تونس کی پہلی خواتین تنظیم تھی، اور 1956ء میں اس کے حل ہونے تک اس کی صدر رہیں۔ علمی گھرانے میں زیتونہ کے مشائخ سے تعلیم پائیں، اپنے والد کے رسالے «شمس الاسلام» اور تونسی صحافت میں لڑکیوں کی تعلیم اور قومی تحریک میں خواتین کی شرکت کے لیے لکھا، اور آزادی کے بعد سرکاری خواتین کے کام سے الگ کر دی گئیں۔"
  es: "Feminista y activista nacionalista tunecina (1913-1993), hija del jeque al-Islam Mohamed Salah Ben Mrad. En 1936 fundó la Unión Musulmana de Mujeres Tunecinas (UMFT), la primera organización femenina tunecina, y la presidió hasta su disolución en 1956. Criada en un hogar intelectual y educada por jeques de Zaytuna, escribió en la revista de su padre, Shams al-Islam, y en la prensa tunecina a favor de la educación de las niñas tunecinas y del papel de la mujer en el movimiento nacional, antes de ser apartada del trabajo oficial femenino tras la independencia."
  fr: "Militante féministe et nationaliste tunisienne (1913-1993), fille du cheikh al-Islam Mohamed Salah Ben Mrad. En 1936, elle fonda l'Union musulmane des femmes tunisiennes (UMFT), première organisation féminine du pays, qu'elle présida jusqu'à sa dissolution en 1956. Élevée dans une famille de lettrés et instruite par des cheikhs zaytuna, elle écrivit dans la revue de son père, Shams al-Islam, et dans la presse tunisienne pour défendre l'éducation des jeunes filles tunisiennes et le rôle des femmes dans le mouvement national, avant d'être marginalisée dans le travail officiel des femmes après l'indépendance."
  tr: "Tunuslu feminist ve ulusal aktivist (1913–1993), Şeyh al-İslam Muhammed Salih Ben Murad'ın kızı olan Thur, 1936'da Tunuslu İslami Kadınlar Birliği'ni kurdu; bu, Tunus'un ilk kadın örgütü idi ve 1956'da dağılınca başkanlığını yaptı. Zaytouna şeyhlerinin yanında bir bilgi evinde büyüdü, babasının 'Shams al-Islam' dergisi için ve Tunus basınında yazdı; Tunuslu kızların eğitimi ve kadınların ulusal harekete katılımı için savunuculuk yaptı, ancak bağımsızlıktan sonra resmi kadın çalışmalarından dışlandı."
  id: "Seorang feminis dan aktivis nasional Tunisia (1913–1993), putri Sheikh al-Islam Muhammad Saleh Ben Murad, ia mendirikan Persatuan Perempuan Islam Tunisia pada tahun 1936, organisasi perempuan Tunisia pertama, dan memimpin organisasi tersebut hingga pembubarannya pada tahun 1956. Ia dibesarkan di rumah pengetahuan di bawah para sheikh Zaytouna, menulis untuk majalah ayahnya 'Shams al-Islam' dan di pers Tunisia, memperjuangkan pendidikan bagi gadis-gadis Tunisia dan partisipasi perempuan dalam gerakan nasional, namun kemudian dikeluarkan dari pekerjaan resmi perempuan setelah kemerdekaan."
