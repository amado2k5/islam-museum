summary:
  ar: "ناشطة نسوية ووطنية تونسية (1913–1993)، ابنة شيخ الإسلام محمد الصالح بن مراد، أسست سنة 1936 الاتحاد النسائي الإسلامي التونسي، أول منظمة نسائية تونسية، وترأسته حتى حلّه سنة 1956. تربّت في بيت علم على أيدي مشايخ الزيتونة، وكتبت في مجلة والدها «شمس الإسلام» وفي الصحافة التونسية داعية إلى تعليم الفتاة التونسية ومشاركة المرأة في الحركة الوطنية، ثم أُقصيت عن العمل النسائي الرسمي بعد الاستقلال."
  en: "Tunisian feminist and nationalist activist (1913–1993), daughter of the shaykh al-Islam Mohamed Salah Ben Mrad. In 1936 she founded the Muslim Union of Tunisian Women (UMFT), the first Tunisian women's organisation, and chaired it until its dissolution in 1956. Raised in a scholarly household and taught by Zaytuna shaykhs, she wrote in her father's journal Shams al-Islam and in the Tunisian press for the education of Tunisian girls and for women's part in the national movement, before being pushed aside from official women's work after independence."
  ur: "تونسی حقوقِ نسواں کی علمبردار اور قوم پرست کارکن (1913–1993)، شیخ الاسلام محمد الصالح بن مراد کی بیٹی۔ انہوں نے 1936ء میں الاتحاد النسائي الإسلامي التونسي قائم کی، جو تونس کی پہلی خواتین تنظیم تھی، اور 1956ء میں اس کے حل ہونے تک اس کی صدر رہیں۔ علمی گھرانے میں زیتونہ کے مشائخ سے تعلیم پائیں، اپنے والد کے رسالے «شمس الاسلام» اور تونسی صحافت میں لڑکیوں کی تعلیم اور قومی تحریک میں خواتین کی شرکت کے لیے لکھا، اور آزادی کے بعد سرکاری خواتین کے کام سے الگ کر دی گئیں۔"
