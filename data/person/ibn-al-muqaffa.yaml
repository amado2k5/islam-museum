id: person/ibn-al-muqaffa
class: person
label: { ar: "ابن المقفع", en: "Ibn al-Muqaffa'", es: "Ibn al-Muqaffa'", fr: "Ibn al-Muqaffa'", ur: "ابن المقفہ" }
summary:
  ar: "عبد الله بن المقفع؛ كاتب الدواوين المشهور الذي روى عنه البلاذري نظام الزمام والخاتم عند الفرس وسيرة الدواوين. ونقل عنه ابن النديم أن لغات الفارسية خمس: الفهلوية والدرية والفارسية والخوزية والسريانية {cite:fihrist-ibn-al-nadim p. 31-32}، واسمه بالفارسية روزبه وهو عبد الله بن المقفع ويكنى قبل إسلامه أبا عمرو فلما أسلم كني بأبي محمد والمقفع ابن المبارك وإنما تقفع لأن الحجاج بن يوسف ضربه بالبصرة في مال احتجنه من مال السلطان ضربا مبرحا فتقفعت يده، وأصله من حوز مدينة من كور فارس وكان يكتب أولا لداود بن عمر بن هبيرة ثم كتب لعيسى بن علي على كرمان وكان في نهاية الفصاحة والبلاغة كاتبا شاعرا {cite:fihrist-ibn-al-nadim p. 172}"
  en: "Abdallah ibn al-Muqaffa'; the famed chancery secretary, Baladhuri's source for the Persian zamam, seals and diwan usages."
  es: "Abdallah ibn al-Muqaffa', el famoso secretario de la cancillería, fue la fuente de Baladhuri para el zamam persa, los sellos y los usos del diwan."
  fr: "Abdallah ibn al-Muqaffa'; le célèbre secrétaire de chancellerie, source de Baladhuri pour les usages persans du zamam, des sceaux et du diwan."
  ur: "عبداللہ ابن المقفہ؛ مشہور چانسری سیکرٹری، بالادھوری کا فارسی زمام، مہر اور دیوان کے استعمال کا ماخذ۔"
  tr: "Abdullah ibn al-Muqaffa'; El-Baladhuri'nin Farslar arasındaki dizginler ve mühür sistemini ve diwanların biyografisini anlattığı ünlü diwan yazarıdır. İbn el-Nadim ondan Farsça dillerin beş olduğunu bildirmiştir: Pehlevi, Durriyya, Farsça, Huziyyah ve Süryanice {atıfta:] Fihrist-ibn-al-Nadim s. 31-32}. Farsça'da adı Ruzbah'tır, Abdullah ibn al-Muqaffa'dır ve İslam'a geçmeden önce Ebu Amr olarak bilinirdi. İslam'ı kabul ettiğinde ona Ebu Muhammed lakabı verildi ve Mubarek 'Takfa' olarak anılmıştır, çünkü el-Haccac bin Yusuf Basra'da sultanın parasından para almak için onu sert şekilde dövmüş ve bu yüzden eli vurulmuştur. Kökeni Pers'in Hawz şehrindendir. İlk olarak Davud ibn Ömer bin Hubayre'ye, sonra Kirman'da İsa ibn Ali'ye yazmış, hitabet ve hitabetinin sonunda şair olmuştur {atıf:Fihrist-ibn-al-Nadim s. 172}"
  id: "Abdullah ibn al-Muqaffa; penulis diwan terkenal dari siapa al-Baladhuri menceritakan sistem tali kekang dan segel di antara orang Persia serta biografi para diwan. Ibn al-Nadim melaporkan darinya bahwa bahasa Persia berjumlah lima: Pahlavi, Durriyya, Persia, Khuziyyah, dan Siria {cite:Fihrist-ibn-al-Nadim hlm. 31-32}. Namanya dalam bahasa Persia adalah Ruzbah, dan ia adalah Abdullah ibn al-Muqaffa, dan sebelum memeluk Islam ia dikenal sebagai Abu Amr. Ketika ia memeluk Islam, ia dijuluki Abu Muhammad, dan Mubarak disebut 'Taqfa', karena al-Hajjaj ibn Yusuf memukulnya dengan keras di Basra untuk mendapatkan uang yang ia butuhkan dari uang sultan, yang menyebabkan tangannya dipukul. Asal-usulnya berasal dari kota Hawz di Persia. Awalnya ia menulis kepada Dawud ibn Umar ibn Hubayrah, kemudian kepada Isa ibn Ali di Kerman, dan pada akhir kefasihan dan retorika, ia menjadi penyair {cite:fihrist-ibn-al-nadim hlm. 172}"
