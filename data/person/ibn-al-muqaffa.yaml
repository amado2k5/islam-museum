id: person/ibn-al-muqaffa
class: person
label: { ar: "ابن المقفع", en: "Ibn al-Muqaffa'" }
summary:
  ar: "عبد الله بن المقفع؛ كاتب الدواوين المشهور الذي روى عنه البلاذري نظام الزمام والخاتم عند الفرس وسيرة الدواوين.، ونقل عنه ابن النديم أن لغات الفارسية خمس: الفهلوية والدرية والفارسية والخوزية والسريانية {cite:fihrist-ibn-al-nadim p. 31-32}، واسمه بالفارسية روزبه وهو عبد الله بن المقفع ويكنى قبل إسلامه أبا عمرو فلما أسلم كني بأبي محمد والمقفع ابن المبارك وإنما تقفع لأن الحجاج بن يوسف ضربه بالبصرة في مال احتجنه من مال السلطان ضربا مبرحا فتقفعت يده، وأصله من حوز مدينة من كور فارس وكان يكتب أولا لداود بن عمر بن هبيرة ثم كتب لعيسى بن علي على كرمان وكان في نهاية الفصاحة والبلاغة كاتبا شاعرا {cite:fihrist-ibn-al-nadim p. 172}"
  en: "Abdallah ibn al-Muqaffa'; the famed chancery secretary, Baladhuri's source for the Persian zamam, seals and diwan usages."
