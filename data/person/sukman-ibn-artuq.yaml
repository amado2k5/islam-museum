id: person/sukman-ibn-artuq
class: person
label:
  ar: سقمان بن أرتق
  en: Sukman ibn Artuq
  es: "Sukman ibn Artuq"
  fr: "Sukman ibn Artuq"
summary:
  ar: "سقمان بن أرتق بن أكسك؛ ملك مع أخيه أبي الغازي الرها وسروج بعد أبيهما سنة 483هـ، ولما ملك الإفرنج أنطاكية سنة 491هـ اجتمعت الأمراء لحصارها فكان له المقام المحمود، وخرج من بيت المقدس بالأمان لما ملكه الأفضل صاحب مصر، ودارت بينه وبين كربوقا صاحب الموصل فتن وحروب أسر في بعضها ابنه ياقوتي، واجتمع مع جكرمش على جهاد الإفرنج سنة 497هـ فهزموا الإفرنج وأسروا القمص بردويل صاحب الرها، ثم استولى على ماردين بعد مقتل ياقوتي فاستقر ملكه بها مع حصن كيفا ونصيبين."
  en: "Sukman ibn Artuq ibn Aksak; he and his brother Abu al-Ghazi held al-Ruha and Saruj after their father's death in 483 AH, and when the Franks took Antioch in 491 he won renown in the amirs' counter-siege — he left Jerusalem under safe-conduct when al-Afdal of Egypt took it, fought a running war with Kerbogha of Mosul in which his son Yaquti was captured, joined Jikirmish in the 497 jihad that routed the Franks and captured Count Baldwin of al-Ruha, and after Yaquti's killing took Mardin itself, fixing his rule over it with Hisn Kayfa and Nisibis."
  es: "Sukman ibn Artuq ibn Aksak; él y su hermano Abu al-Ghazi gobernaron al-Ruha y Saruj tras la muerte de su padre en el año 483 de la Hégira, y cuando los francos tomaron Antioquía en el año 491, ganó renombre en el contraataque de los emires. Abandonó Jerusalén bajo salvoconducto cuando al-Afdal de Egipto la tomó, libró una guerra de guerrillas con Kerbogha de Mosul en la que su hijo Yaquti fue capturado, se unió a Jikirmish en la yihad del año 497 que derrotó a los francos y capturó al conde Balduino de al-Ruha, y tras la muerte de Yaquti tomó Mardin, estableciendo su gobierno sobre ella con Hisn Kayfa y Nisibis."
  fr: "Sukman ibn Artuq ibn Aksak; lui et son frère Abu al-Ghazi contrôlaient al-Ruha et Saruj après la mort de leur père en 483 AH, et lorsque les Francs prirent Antioche en 491, il gagna en renommée lors du contre-siège des émirs — il quitta Jérusalem sous sauf-conduit lorsque al-Afdal d'Égypte la prit, mena une guerre continue contre Kerbogha de Mossoul au cours de laquelle son fils Yaquti fut capturé, rejoignit Jikirmish dans le jihad de 497 qui mit en déroute les Francs et captura le comte Baudouin d'al-Ruha, et après la mort de Yaquti, prit Mardin, y fixant son pouvoir avec Hisn Kayfa et Nisibis."
