summary:
  ar: "داعية إندونيسي شاب من بليتار بجاوة الشرقية، وُلد في 27 سبتمبر 1994، وهو مشرف معهد مامباول هيكام الثاني ومؤسس مجلس تعليم سبيل التوبة سنة 2018، الذي نما من سبعة أعضاء إلى 66,000. يخاطب الشباب والفئات المهمشة بلغة جاوية غير رسمية يغلب عليها المزاح، وبلغت قناته على يوتيوب 1,720,000 مشترك و231,969,719 مشاهدة و1,404 مقاطع بحسب vidIQ كما في 15 نوفمبر 2026."
  en: "Young Indonesian preacher from Blitar, East Java, born on 27 September 1994; he is a caretaker of the Mamba'ul Hikam II pesantren and the founder, in 2018, of the Sabilu Taubah study assembly, which grew from seven members to 66,000. He addresses young people and marginalised groups in an informal, humour-led Javanese register; his YouTube channel counted 1,720,000 subscribers, 231,969,719 views and 1,404 videos as read by vidIQ on 15 November 2026."
  ur: "مشرقی جاوا کے بلیٹار سے تعلق رکھنے والے نوجوان انڈونیشی مبلغ، جو 27 ستمبر 1994ء کو پیدا ہوئے؛ وہ مامباؤل حکام دوم مدرسے کے نگران ہیں اور 2018ء میں قائم کردہ مجلسِ تعلیم سبیل التوبہ کے بانی ہیں، جو سات اراکین سے بڑھ کر 66,000 تک پہنچی۔ وہ نوجوانوں اور پسماندہ طبقات سے غیر رسمی، مزاح سے بھرپور جاوی زبان میں خطاب کرتے ہیں؛ 15 نومبر 2026ء کی vidIQ قرأت کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 1,720,000، ویوز 231,969,719 اور ویڈیوز 1,404 تھیں۔"
  es: "Joven predicador indonesio de Blitar, Java Oriental, nacido el 27 de septiembre de 1994; es el encargado del pesantren Mamba'ul Hikam II y el fundador, en 2018, de la asamblea de estudio Sabilu Taubah, que pasó de siete miembros a 66.000. Se dirige a jóvenes y grupos marginados en un registro javanés informal y con toques de humor; su canal de YouTube contaba con 1.720.000 suscriptores, 231.969.719 visualizaciones y 1.404 vídeos, según datos de vidIQ del 15 de noviembre de 2026."
  fr: "Jeune prédicateur indonésien originaire de Blitar, dans l'est de Java, né le 27 septembre 1994, il est responsable du pesantren Mamba'ul Hikam II et fondateur, en 2018, de l'assemblée d'études Sabilu Taubah, qui est passée de sept à 66 000 membres. Il s'adresse aux jeunes et aux groupes marginalisés dans un style javanais informel et empreint d'humour; sa chaîne YouTube comptait 1 720 000 abonnés, 231 969 719 vues et 1 404 vidéos, selon les données de vidIQ du 15 novembre 2026."
  tr: "Doğu Cava'nın Belitar kentinden genç bir Endonezyalı vaiz olan Sabil, 27 Eylül 1994 doğumlu Mambawol Hickam II Enstitüsü'nün denetçisi ve 2018'de yedi üyeden 66.000'e ulaşan Sabil Taba Eğitim Konseyi'nin kurucusudur. Gençlere ve marjinalleşmiş gruplara çoğunlukla mizahi gayri resmi bir Cava diliyle hitap ediyor ve vidIQ'ya göre 15 Kasım 2026 itibarıyla YouTube kanalında 1.720.000 abone, 231.969.719 izlenme ve 1.404 klip vardı."
  id: "Seorang pengkhotbah muda Indonesia dari Belitar, Jawa Timur, lahir pada 27 September 1994, ia adalah pengawas Institut Mambawol Hickam II dan pendiri Dewan Pendidikan Sabil Taba pada tahun 2018, yang berkembang dari tujuh anggota menjadi 66.000. Ia berbicara kepada pemuda dan kelompok terpinggirkan dalam bahasa Jawa informal yang sebagian besar humoris, dan saluran YouTube-nya memiliki 1.720.000 pelanggan, 231.969.719 penayangan, dan 1.404 klip menurut vidIQ per 15 November 2026."
