label: { ar: "يوحنا الإشبيلي", en: "John of Seville", ur: "یوحنا اشبیلی" }
names:
  - { kind: latinized, lang: la, value: "Johannes Hispalensis" }
  - { kind: alternate, lang: la, value: "Ioannes Hispalensis" }
summary:
  ar: "يوحنا الإشبيلي مترجم لاتيني من القرن الثاني عشر للميلاد، نقل إلى اللاتينية أعمالاً عربية في التنجيم والفلك والحساب، منها مدخل أبي معشر الكبير سنة 1130م وجوامع الفرغاني في الفلك، وكتاب القبيصي في أحكام النجوم سنة 1144م، وكتاب المواليد لأبي علي الخياط سنة 1153م، وصورة لاتينية من كتاب الحساب المنسوب إلى الخوارزمي. وتذكر دائرة المعارف الإسلامية هذه التواريخ في مقالات متفرقة ولا تذكر ميلاده ولا وفاته ولا ترجمة لحياته {cite:encyclopaedia-of-islam-2 vol. 1 p. 158} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1111}."
  en: "John of Seville was a twelfth-century Latin translator of Arabic works on astrology, astronomy and arithmetic. The Encyclopaedia of Islam, in scattered articles, credits him with Latin versions of Abu Ma'shar's Great Introduction in 1130, al-Farghani's astronomical compendium, al-Qabisi's introduction to astrology in 1144, Abu Ali al-Khayyat's book on nativities in 1153, and a Latin arithmetic in the al-Khwarizmi tradition. It gives no birth or death dates and no biography {cite:encyclopaedia-of-islam-2 vol. 1 p. 158} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1111}."
  ur: "یوحنا اشبیلی بارہویں صدی عیسوی کے لاطینی مترجم تھے جنہوں نے نجوم، فلکیات اور حساب پر عربی کتابوں کو لاطینی میں منتقل کیا۔ دائرۃ المعارف الاسلامیہ اپنے مختلف مقالات میں ان سے ابو معشر کے المدخل الکبیر کا 1130ء کا ترجمہ، فرغانی کی فلکیاتی کتاب، قبیصی کا مدخل علمِ نجوم 1144ء میں، ابو علی خیاط کی کتابِ مواليد 1153ء میں، اور خوارزمی کی روایت کے حساب کا لاطینی متن منسوب کرتا ہے۔ اس میں ان کی ولادت یا وفات کی کوئی تاریخ یا سوانح نہیں {cite:encyclopaedia-of-islam-2 vol. 1 p. 158} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1111}."
