kids:
  ar: "يوحنا الإشبيلي ترجم كتباً عربية عن النجوم والحساب إلى اللاتينية ليقرأها طلاب أوروبا."
  en: "John of Seville translated Arabic books about the stars and about numbers into Latin so that students in Europe could read them."
  ur: "یوحنا اشبیلی نے ستاروں اور اعداد کی عربی کتابیں لاطینی میں ترجمہ کیں تاکہ یورپ کے طلبہ انہیں پڑھ سکیں۔"
