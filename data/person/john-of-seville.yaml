relations:
  - { type: related_to, target: person/abu-mashar, note: "Translated Abu Ma'shar's Great Introduction in 1130 and other astrological works.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/al-farghani, note: "One of two Latin translators of al-Farghani's astronomical compendium; the other was Gerard of Cremona.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/al-khwarizmi, note: "Made known a Latin arithmetic in al-Khwarizmi's tradition and spread his sexagesimal fraction rules.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/abu-ali-al-khayyat, note: "Translated al-Khayyat's Kitab al-Mawalid in 1153.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/mashaallah, note: "Rendered Masha'allah's letter on eclipses into Latin.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/umar-ibn-al-farrukhan, note: "Translated a Kitab al-Mawalid summary composed by Umar ibn al-Farrukhan.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/abu-al-qasim-ibn-al-saffar, note: "Translated a treatise on the astrolabe by Ibn al-Saffar; his Latin version appears under the name of Maslama al-Majriti.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/plato-of-tivoli, note: "Translated some of the same Arabic works as Plato of Tivoli.", sources: [source/encyclopaedia-of-islam-2] }
  - { type: related_to, target: person/gerard-of-cremona, note: "Two Latin translators of al-Farghani.", sources: [source/encyclopaedia-of-islam-2] }
