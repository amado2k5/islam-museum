roles: [scholar]
gender: male
summary:
  ar: "إبراهيم بن محمد بن أبي يحيى سمعان الأسلمي، أبو إسحاق، عالم بالحديث من أهل المدينة وأحد شيوخ الشافعي، له موطأ أضعاف موطأ مالك، طعن فيه رجال الحديث، وتوفي سنة 184 هـ الموافقة 800 م بحسب الزركلي."
  en: "Ibrahim ibn Muhammad ibn Abi Yahya Sam'an al-Aslami, Abu Ishaq, a hadith scholar of Medina and one of al-Shafi'i's teachers, author of a Muwatta' many times the size of Malik's, criticised by the men of hadith; died 184 AH (800) according to al-Zirikli."
  es: "Ibrahim ibn Muhammad ibn Abi Yahya Sam'an al-Aslami, Abu Ishaq, un erudito de hadices de Medina y uno de los maestros de al-Shafi'i, autor de un Muwatta' muchas veces más extenso que el de Malik, criticado por los hombres de hadices; murió en el año 184 AH (800) según al-Zirikli."
  fr: "Ibrahim ibn Muhammad ibn Abi Yahya Sam'an al-Aslami, Abu Ishaq, un érudit du hadith de Médine et l'un des enseignants d'al-Shafi'i, auteur d'un Muwatta' plusieurs fois plus grand que celui de Malik, critiqué par les hommes du hadith; mort en 184 AH (800) selon al-Zirikli."
  ur: "ابراہیم بن محمد بن ابی یحییٰ سمعان الاسلمی، ابو اسحاق، مدینہ کے ایک عالم حدیث اور شافعی کے اساتذہ میں سے ایک، موطا کے مصنف، مالک کے سائز سے کئی گنا زیادہ، اہل حدیث کی طرف سے تنقید؛ الزرکلی کے مطابق 184ھ (800) میں وفات پائی۔"
  tr: "İbrahim ibn Muhammed bin Abi Yahya Sam'an el-Aslami, Medine'den bir hadis âlimi ve Şafi öğretmenlerinden biri olan Ebu İshaq, Malik'inkinden çok kat daha büyük bir muvattına sahipti. Hadis âlimleri tarafından eleştirildi ve el-Zerkali'ye göre 184 Hicri'de, yani 800 yılına denk gelen yılda öldü."
  id: "Ibrahim ibn Muhammad ibn Abi Yahya Sam'an al-Aslami, Abu Ishaq, seorang ulama hadis dari Madinah dan salah satu guru Syafi'i, memiliki Muwatta yang jauh lebih besar dari Malik. Ia dikritik oleh para ulama hadis, dan meninggal pada tahun 184 H, sesuai dengan tahun 800 M, menurut al-Zarkali."
