summary:
  ar: "عازف طبلة هندي (1951–2024)، الابن الأكبر لعلا ركها، وُلد في بومباي واستقر منذ أواخر الستينيات في منطقة خليج سان فرانسيسكو؛ من أبرز وجوه الموسيقى العالمية عبر فرقة «شاكتي» وتعاونه مع موسيقى الجاز والتقاليد الكلاسيكية، ونال بادما فيبوشان (2023) وثلاث جوائز غرامي سنة 2024."
  en: "Indian tabla maestro (1951–2024), eldest son of Alla Rakha, born in Bombay and based from the late 1960s in the San Francisco Bay Area; a central figure of world music through Shakti and his collaborations across jazz and classical traditions, he received the Padma Vibhushan (2023) and won three Grammy Awards in 2024."
  ur: "بھارتی طبلہ نواز (1951ء–2024ء)، علا رکھا کے بڑے بیٹے، بمبئی میں پیدا ہوئے اور ساٹھ کی دہائی کے آخر سے سان فرانسسکو بے ایریا میں مقیم رہے؛ «شکتی» اور جاز و کلاسیکی روایات کے ساتھ اشتراک کے ذریعے عالمی موسیقی کی نمایاں شخصیت، پدم وبھوشن (2023) اور 2024ء میں تین گرامی ایوارڈز کے حامل۔"
