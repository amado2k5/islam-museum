summary:
  ar: "أبو محمد عبد الله بن عبد الرحمن الدارمي السمرقندي ⁦(181–255هـ)⁩، الحافظ صاحب «المسند» المعروف بسنن الدارمي؛ رحل إلى خراسان والعراق والشام ومصر والحجاز، وروى عنه مسلم وأبو داود والترمذي وغيرهم، وقرنه أحمد ومحمد بن بشار وأبو حاتم بكبار حفاظ خراسان، وكان يجتهد ولا يقلد كما يقول الذهبي، وولي قضاء سمرقند فقضى قضية واحدة ثم استعفى {cite:musnad-darimi-tasil-2015 p. 20} {cite:musnad-darimi-tasil-2015 p. 23-34}. وفي تاريخ الخلفاء أنه مات في أيام المعتز {cite:tarikh-khulafa-minhaj-1434 p. 559}."
  en: "Abu Muhammad 'Abd Allah b. 'Abd al-Rahman al-Darimi of Samarqand (181–255 AH), the hadith master who compiled the Musnad known as Sunan al-Darimi; he travelled to Khurasan, Iraq, Syria, Egypt and the Hijaz, Muslim, Abu Dawud, al-Tirmidhi and others transmitted from him, Ahmad, Muhammad b. Bashshar and Abu Hatim ranked him among the great memorisers of Khurasan, al-Dhahabi says he reasoned for himself and did not follow a school, and he was made judge of Samarqand, judged one case and asked to be released {cite:musnad-darimi-tasil-2015 p. 20} {cite:musnad-darimi-tasil-2015 p. 23-34}. Tarikh al-Khulafa' places his death in the reign of al-Mu'tazz {cite:tarikh-khulafa-minhaj-1434 p. 559}."
  ur: "سمرقند کے ابو محمد عبد اللہ بن عبد الرحمٰن دارمی ⁦(181–255ھ)⁩، وہ حافظ جنہوں نے «المسند» مرتب کی جو سنن الدارمی کے نام سے معروف ہے؛ انہوں نے خراسان، عراق، شام، مصر اور حجاز کا سفر کیا، ان سے مسلم، ابو داود، ترمذی وغیرہ نے روایت کی، احمد، محمد بن بشار اور ابو حاتم نے انہیں خراسان کے بڑے حفاظ میں شمار کیا، ذہبی کے بقول وہ اجتہاد کرتے اور تقلید نہیں کرتے تھے، اور سمرقند کے قاضی بنائے گئے تو ایک مقدمہ فیصل کر کے مستعفی ہو گئے {cite:musnad-darimi-tasil-2015 p. 20} {cite:musnad-darimi-tasil-2015 p. 23-34}۔ تاریخ الخلفاء کے مطابق وہ معتز کے زمانے میں فوت ہوئے {cite:tarikh-khulafa-minhaj-1434 p. 559}۔"
born: { hijri: "0181", edtf: "0797~", calendar: julian, precision: year, status: tradition, derived: true, note: "«ولدت في سنة مات ابن المبارك سنة إحدى وثمانين ومائة» — إسحاق بن إبراهيم الوراق عنه (مقدمة طبعة دار التأصيل ص 23)؛ التحويل مشتق.", sources: [source/musnad-darimi-tasil-2015] }
died: { hijri: "0255-12", edtf: "0869-11~", calendar: julian, precision: month, status: debated, derived: true, note: "أحمد بن سيار: توفي سنة خمس وخمسين يوم التروية بعد العصر ودفن يوم عرفة يوم جمعة وهو ابن خمس وسبعين، وصوّبه الخطيب؛ وقال يحيى بن بدر: صليت عليه يوم عرفة سنة أربع وخمسين ومائتين (مقدمة طبعة دار التأصيل ص 36)؛ التحويل مشتق تقريبي.", sources: [source/musnad-darimi-tasil-2015] }
