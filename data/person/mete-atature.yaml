summary:
  ar: "فيزيائي تركي يعمل في البصريات الكمومية التجريبية بجامعة كامبريدج، وُلد في قيصري سنة 1975. يقود مجموعة مواد وأنظمة البصريات الكمومية في مختبر كافنديش، وهو شريك مؤسس لشركة «نو كوانتم»، ويتولى إدارة مختبر كافنديش منذ أكتوبر 2023، وله حضور واسع في التواصل العلمي في تركيا."
  en: "Turkish physicist working in experimental quantum optics at the University of Cambridge, born in Kayseri in 1975. He leads the Quantum Optical Materials and Systems group at the Cavendish Laboratory, co-founded the spin-out Nu Quantum, has headed the Cavendish Laboratory since October 2023, and is a prominent science communicator in Turkey."
  ur: "ترک طبیعیات دان جو جامعہ کیمبرج میں تجرباتی کوانٹم آپٹکس پر کام کرتے ہیں، 1975 میں قیصری میں پیدا ہوئے۔ وہ کیونڈش لیبارٹری میں کوانٹم آپٹیکل مٹیریلز اینڈ سسٹمز گروپ کے سربراہ، «نو کوانٹم» کمپنی کے شریک بانی، اور اکتوبر 2023 سے کیونڈش لیبارٹری کے سربراہ ہیں۔"
