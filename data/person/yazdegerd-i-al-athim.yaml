label: { ar: "يزدجرد الأثيم" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك يزدجرد الأثيم» {cite:tabari-tarikh-abu-al-fadl j.2 p.63}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Perslerinin bir kralı, el-Tabari tarafından \"Yazdegerd'in Kötü Kralı'nın Anılması\" başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl j.2 s.63}. Bu yerde, saltanatının yaşı ve haberleri hakkında söylenenler anlatılır."
  id: "Seorang raja Persia Sasanian, disebut oleh al-Tabari dengan judul \"Penyebutan Raja Jahat Yazdegerd\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.63}. Di tempat ini, apa yang dikatakan tentang usia dan berita pemerintahannya diceritakan."
