id: person/abd-al-wahid-ii-almohad
class: person
label: { ar: "عبد الواحد الثاني المأمون الموحدي", en: "Abd al-Wahid II al-Ma'mun, Almohad", fr: "Abd al-Wahid II al-Ma'mun, almohade", es: "Abd al-Wahid II al-Ma'mun, Almohad", ur: "عبد الواحد ثانی المامون، الموحد" }
summary:
  ar: "عبد الواحد بن يوسف بن عبد المؤمن بن علي سلطان المغرب أبو محمد؛ ولي الأمر في العام الماضي فلم يُدر أمراء البربر تخلموه وخنقوه في شعبان سنة إحدى وعشرين وستمائة وكانت ولايته تسعة أشهر؛ وفي أيامه استولى على مملكة الأندلس ابن أخيه عبد الله بن يعقوب الملقب بالعادل والتقى الأفرنج فهزموا جيشه ثم طال مراكش بأسوأ حال فقبضوا عليه، وتملك الأندلس بعده أخوه إدريس مديدة فخرج عليه محمد بن هود الجذامي ودعا إلى آل العباس فمال الناس إليه فهرب إدريس بعسكره إلى مراكش فالتقاه صاحبها يؤمئذ يحيى بن محمد بن يوسف فهزم يحيى {cite:shadharat-dhahab p. 96}."
  en: "Abd al-Wahid II b. Yusuf b. Abd al-Mu'min — the Almohad caliph deserted by his Berber amirs and strangled in Sha'ban 621 after a nine-month reign; in his days the Maghribi al-Adil's Andalus venture collapsed and Ibn Hud al-Judhami rose calling to the Abbasids {cite:shadharat-dhahab p. 96}."
  fr: "Abd al-Wahid II b. Yusuf b. Abd al-Mu'min — le calife almohade abandonné par ses émirs berbères et étranglé en sha'ban 621 après un règne de neuf mois ; en son temps, l'entreprise andalouse du maghrébin al-Adil s'effondra et Ibn Hud al-Judhami se souleva en appelant aux Abbassides {cite:shadharat-dhahab p. 96}."
  es: "Abd al-Wahid II b. Yusuf b. Abd al-Mu'min, el califa almohade abandonado por sus emires bereberes y estrangulado en Sha'ban 621 después de un reinado de nueve meses; en sus días, la empresa andalusí del magrebí al-Adil se derrumbó e Ibn Hud al-Judhami se levantó llamando a los abasíes {citar: shadharat-dhahab p. 96}."
  ur: "عبد الواحد ثانی بی۔ یوسف بی۔ عبد المومن - الموحد خلیفہ کو اس کے بربر امیروں نے چھوڑ دیا اور 9 ماہ کی حکومت کے بعد شعبان 621 میں گلا گھونٹ دیا؛ ان کے زمانے میں مغرب العدل کا اندلس کا منصوبہ ختم ہو گیا اور ابن ہد الجثمی عباسیوں کو بلانے کے لیے اٹھ کھڑا ہوا۔ 96}۔"
  tr: "Fas Sultanı Abdülvahid ibn Yusuf ibn Abdülmümin ibn Ali, Ebu Muhammed; geçen yıl yönetimi devraldı, ancak Berberi prensleri onun Hicri 621 yılının Şaban ayında kandırılıp boğularak öldürüldüğünü bilmiyorlardı. Saltanatı dokuz ay sürdü. Saltanatı sırasında yeğeni Abdullah ibn Yakub, lakabı el-Adil, Endülüs krallığını ele geçirdi. Franklarla karşılaştı ve ordusunu yenilgiye uğrattılar. Ardından Marakeş en kötü duruma düştü ve onu ele geçirdiler. Ondan sonra kardeşi İdris uzun süre Endülüs'ü yönetti. Sonra Muhammed ibn Hud el-Cudami ona karşı isyan etti ve Abbasilere biat çağrısında bulundu ve halk ona yöneldi. Böylece İdris ordusuyla Marakeş'e kaçtı ve o zamanki hükümdarı Yahya ibn Muhammed ibn Yusuf onunla karşılaştı ve Yahya'yı yenilgiye uğrattı. {kaynak:şadharat-dhahab s. 96}"
  id: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu’min ibn Ali, Sultan Maroko, Abu Muhammad; ia mengambil alih kekuasaan tahun lalu, tetapi para pangeran Berber tidak mengetahui bahwa ia telah ditipu dan dicekik pada bulan Sya'ban tahun 621 H. Masa pemerintahannya berlangsung selama sembilan bulan. Selama masa pemerintahannya, keponakannya, Abdullah ibn Ya’qub, yang dijuluki al-Adil, merebut kerajaan Andalusia. Ia bertemu dengan bangsa Frank, yang mengalahkan pasukannya. Kemudian Marrakesh jatuh ke dalam keadaan terburuk, dan mereka menangkapnya. Setelahnya, saudaranya Idris memerintah Andalusia untuk waktu yang lama. Kemudian Muhammad ibn Hud al-Judhami memberontak terhadapnya dan menyerukan kesetiaan kepada Abbasiyah, dan rakyat cenderung mendukungnya. Maka Idris melarikan diri bersama pasukannya ke Marrakesh, dan penguasanya saat itu, Yahya ibn Muhammad ibn Yusuf, bertemu dengannya dan mengalahkan Yahya. {cite:shadharat-dhahab p. 96}"
