summary:
  ar: من أبناء أقيال حضرموت؛ وفد على النبي فاستقطعه أرضاً فأقطعه إياها وبعث معه معاوية ليسلّمها له، وقال له فيما يروي أبو نعيم «هذا وائل سيد الأقيال»؛ نزل الكوفة وروى عنه ابناه علقمة وعبد الجبار، ومات في خلافة معاوية.
  en: From the sons of the kings of Hadramawt; he came to the Prophet as a delegate, asked for a grant of land and received it, and the Prophet sent Mu'awiya with him to hand it over; according to Abu Nu'aym the Prophet called him 'chief of the
    provincial kings'; he settled in Kufa, his sons Alqama and Abd al-Jabbar narrated from him, and he died in Mu'awiya's caliphate.
