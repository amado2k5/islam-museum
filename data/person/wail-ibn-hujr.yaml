summary:
  ar: من أبناء أقيال حضرموت؛ وفد على النبي فاستقطعه أرضاً فأقطعه إياها وبعث معه معاوية ليسلّمها له، وقال له فيما يروي أبو نعيم «هذا وائل سيد الأقيال»؛ نزل الكوفة وروى عنه ابناه علقمة وعبد الجبار، ومات في خلافة معاوية.
  en: From the sons of the kings of Hadramawt; he came to the Prophet as a delegate, asked for a grant of land and received it, and the Prophet sent Mu'awiya with him to hand it over; according to Abu Nu'aym the Prophet called him 'chief of the
    provincial kings'; he settled in Kufa, his sons Alqama and Abd al-Jabbar narrated from him, and he died in Mu'awiya's caliphate.
  ur: "حضرموت کے بادشاہوں کی اولاد سے؛ وفد کے طور پر نبی کے پاس آیا، زمین کا عطیہ مانگا اور پایا اور نبی نے اسے ایک ذمہ داری پر مقرر کیا۔"
  es: "De entre los hijos de los reyes de Hadramawt, se presentó ante el Profeta como delegado, solicitó una concesión de tierras y la recibió. El Profeta envió a Mu'awiya con él para entregársela. Según Abu Nu'aym, el Profeta lo llamó \"jefe de los reyes provinciales\". Se estableció en Kufa, sus hijos Alqama y Abd al-Jabbar narraron historias de él, y murió durante el califato de Mu'awiya."
  fr: "Descendant des rois du Hadramaout, il vint auprès du Prophète en tant que délégué, demanda une concession de terre qu'il obtint, et le Prophète envoya Mu'awiya avec lui pour la remettre; selon Abu Nu'aym, le Prophète l'appela « chef des rois provinciaux »; il s'établit à Kufa, ses fils Alqama et Abd al-Jabbar rapportèrent des faits de lui, et il mourut sous le califat de Mu'awiya."
  tr: "O, Hadramaut'un Akyal oğullarından geliyordu; Peygamber'e geldi, o da bir toprak parçası aldı ve ona tahsis etti. Muaviye onunla birlikte onu teslim etmek için gönderdi ve Ebu Nu'eym ona şöyle dedi: \"Bu, kabilelerin efendisi Vaildir.\" Kufa'ya yerleşti, oğulları Alqama ve Abd al-Jabbar ondan rivayet etti ve Muaviye'nin halifeliği sırasında öldü."
  id: "Ia berasal dari putra-putra Aqyal Hadramaut; ia datang kepada Nabi, yang mengambil sebidang tanah dan membagikannya kepadanya. Muawiyah mengirim pesan bersamanya untuk menyerahkannya, dan Abu Nu'aym menceritakan kepadanya, \"Ini Wa'il, penguasa suku-suku.\" Ia menetap di Kufa, dan putra-putranya Alqama dan Abd al-Jabbar menceritakan darinya, dan ia meninggal pada masa kekhalifahan Muawiya."
