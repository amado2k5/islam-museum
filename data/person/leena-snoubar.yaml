  ar: "منشئة محتوى أمريكية في الأزياء المحتشمة ونمط الحياة، مقيمة في تكساس، صاحبة مدونة وقناة «مع الحب لينا» (With Love, Leena) منذ 2016؛ من أصل فلسطيني من جهة الأب وأمريكي من جهة الأم، واشتهرت بدروس الحجاب اليومية ومدونات الحياة الأسرية، وهي متزوجة من عمر سنوبر وأم لطفلين."
  en: "American modest-fashion and lifestyle creator based in Texas, behind the With Love, Leena blog and YouTube channel since 2016. Of Palestinian descent on her father's side and American on her mother's, she became known for her everyday hijab tutorials and family-life vlogs. She is married to Omar Snoubar and is a mother of two."
