label: { ar: "سيف الإسلام طغتكين", en: "Sayf al-Islam Tughrakin" }
summary:
  ar: "سيف الإسلام طغتكين أخو صلاح الدين؛ سيّره صلاح الدين سنة ثمان وسبعين وخمسمائة إلى بلاد اليمن وقُلّده أمرها لاختلالها وتقوّي حطان بن منقذ على عز الدين عثمان الزنجبيلي متولي عدن، فوصل إلى زبيد فخافه حطان وتحصن في بعض القلاع فلم يزل يؤمنه ويهدي إليه ويتلطفه حتى نزل إليه فأحسن صحبته، فلما أخذ حطان منه الإذن بالرحيل وأخرج أثقاله وأمواله ودوابه وأهله قبض عليه سيف الإسلام واسترجع جميع ماله لم يسلم منه قليل ولا كثير — وكان فيه الذهب العين في سبعين غلافاً زردية مملوءة ذهباً — ثم سجنه في بعض القلاع وكان آخر العهد به وقيل إنه قتله {cite:kamil-ibn-al-athir p. 111-112}."
  en: "Saladin's brother, sent in 578 to take Yemen for the Ayyubids — his patient softening of the warlord Khattan ibn Munqidh, the false safe-conduct, the arrest as Khattan's caravan left and the stripping of seventy mail-bags of solid gold before his citadel imprisonment became a byword for courtly betrayal {cite:kamil-ibn-al-athir p. 111-112}."
