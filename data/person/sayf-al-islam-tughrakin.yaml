id: person/sayf-al-islam-tughrakin
class: person
label: { ar: "سيف الإسلام طغتكين", en: "Sayf al-Islam Tughrakin", es: "Sayf al-Islam Tughrakin", fr: "Sayf al-Islam Tughrakin", ur: "سیف الاسلام طغرکین" }
summary:
  ar: "سيف الإسلام طغتكين أخو صلاح الدين؛ سيّره صلاح الدين سنة ثمان وسبعين وخمسمائة إلى بلاد اليمن وقُلّده أمرها لاختلالها وتقوّي حطان بن منقذ على عز الدين عثمان الزنجبيلي متولي عدن، فوصل إلى زبيد فخافه حطان وتحصن في بعض القلاع فلم يزل يؤمنه ويهدي إليه ويتلطفه حتى نزل إليه فأحسن صحبته، فلما أخذ حطان منه الإذن بالرحيل وأخرج أثقاله وأمواله ودوابه وأهله قبض عليه سيف الإسلام واسترجع جميع ماله لم يسلم منه قليل ولا كثير — وكان فيه الذهب العين في سبعين غلافاً زردية مملوءة ذهباً — ثم سجنه في بعض القلاع وكان آخر العهد به وقيل إنه قتله {cite:kamil-ibn-al-athir p. 111-112}."
  en: "Saladin's brother, sent in 578 to take Yemen for the Ayyubids — his patient softening of the warlord Khattan ibn Munqidh, the false safe-conduct, the arrest as Khattan's caravan left and the stripping of seventy mail-bags of solid gold before his citadel imprisonment became a byword for courtly betrayal {cite:kamil-ibn-al-athir p. 111-112}."
  es: "El hermano de Saladino, enviado en 578 para tomar Yemen para los ayubíes, su paciente intento de ablandar al caudillo Khattan ibn Munqidh, el falso salvoconducto, el arresto cuando la caravana de Khattan partía y el despojo de setenta sacos de correo de oro macizo antes de su encarcelamiento en la ciudadela se convirtieron en sinónimo de traición cortesana {cite:kamil-ibn-al-athir p. 111-112}."
  fr: "Le frère de Saladin, envoyé en 578 pour prendre le Yémen pour les Ayyoubides — son adoucissement patient du chef de guerre Khattan ibn Munqidh, le faux sauf-conduit, l'arrestation au moment où la caravane de Khattan partait et le vol de soixante-dix sacs postaux d'or massif avant son emprisonnement dans la citadelle sont devenus un synonyme de trahison courtoise {cite:kamil-ibn-al-athir p. 111-112}."
  ur: "صلاح الدین کے بھائی کو 578 میں ایوبیوں کے لیے یمن لے جانے کے لیے بھیجا گیا - جنگی سردار ختن ابن منقذ کے ساتھ اس کی صبر آزما نرمی، غلط حفاظتی سلوک، ختن کے قافلے کے روانہ ہوتے ہی گرفتاری اور اس کے قلعے کی قید سے پہلے ٹھوس سونے کے ستر میل تھیلوں کو چھین لینا عدالتی طور پر ایک لفظی لفظ بن گیا۔ 111-112}۔"
  tr: "Seyf el-İslam Tuğtekin, Salahdin'in kardeşi, 578 Hicri yılında onu Yemen'e gönderdi; burada düzensizlik ve Hattan ibn Munqidh'in Aden valisi İzzeddin Osman el-Zencebili üzerindeki gücü nedeniyle Yemen'e komuta etti. Zabid'e ulaştı, ancak Hattan ondan korktu ve bazı kalelerde kendini tahkim etti, sürekli korudu, rehberlik etti ve onunla kur yaptı, ta ki yanında kalıp iyi davranana kadar. Hattan ayrılmak için izin aldığında, yüklerini, servetini, hayvanlarını ve ailesini çıkardığında, Seyf el-İslam onu yakaladı ve tüm servetini, ne çok ne de çoğunu—altınla dolu yetmiş sarı kutuda altın dahil—geri aldı ve onu bazı kalelere hapsetti; bu da saltanatının sonuydu. Söylenene göre, onu öldürdü {atı:kamil-ibn-atir, s. 111-112}."
  id: "Saif al-Islam Tughtekin, saudara Salah al-Din, mengirimnya ke Yaman pada tahun 578 H, di mana ia ditunjuk memimpin karena kekacauan dan kekuatan Hattan ibn Munqidh atas Izz al-Din Uthman al-Zanjabili, gubernur Aden. Ia sampai di Zabid, tetapi Hattan takut padanya dan memperkuat diri di beberapa benteng, terus melindunginya, membimbing, dan mendekatinya sampai ia tinggal bersamanya dan memperlakukannya dengan baik. Ketika Hattan mendapat izin untuk pergi dan membawa beban, kekayaan, ternak, dan keluarganya, Saif al-Islam menangkapnya dan mengambil kembali semua hartanya, tidak banyak atau banyak—termasuk emas dalam tujuh puluh kotak kuning berisi emas—lalu memenjarakannya di beberapa benteng, yang merupakan yang terakhir selama masa pemerintahannya. Dikatakan ia membunuhnya {cite:kamil-ibn-al-athir hlm. 111-112}."
