summary:
  ar: "آخر أباطرة المغول في الهند (1775–1862) وشاعر أردي، تربّع على العرش سنة 1837 وكانت سلطته لا تتجاوز مدينة دلهي المسوّرة. في ثورة 1857 أعلنه الثوار إمبراطورًا على الهند، وبعد إخماد الثورة نفاه البريطانيون إلى رانغون حيث توفي. كان صوفيًّا له مريدون، وخلّف ديوان شعر بالأردية جُمع في «كليات ظفر»."
  en: "The twentieth and last Mughal emperor of India (1775–1862) and an Urdu poet. He succeeded in 1837 with authority confined to the walled city of Delhi; in the rebellion of 1857 the rebels proclaimed him Emperor of India, and after its defeat the British exiled him to Rangoon, where he died. He was a practising Sufi who accepted disciples, and his Urdu ghazals were collected as the Kulliyyat-i-Zafar."
  ur: "ہندوستان کے بیسویں اور آخری مغل شہنشاہ (1775ء–1862ء) اور اردو کے شاعر۔ وہ 1837ء میں تخت نشین ہوئے مگر ان کی حکومت صرف پرانی دہلی تک محدود تھی؛ 1857ء کی جنگ میں باغیوں نے انھیں ہندوستان کا شہنشاہ قرار دیا، اور شکست کے بعد انگریزوں نے انھیں رنگون جلاوطن کر دیا جہاں ان کا انتقال ہوا۔ وہ ایک صوفی تھے جن کے مرید تھے، اور ان کا اردو کلام «کلیاتِ ظفر» میں جمع ہوا۔"
