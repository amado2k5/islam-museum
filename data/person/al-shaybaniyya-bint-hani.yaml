summary:
  ar: "زوجة عبيد الله بن عمر بن الخطاب، امتنعت أن تشد عليه سلاحه يوم خروجه بصفين وقالت لم يتوجه إلى قومي صنديد في جاهلية ولا إسلام وفي رأسه صعر إلا أبادوه، فشجها بقوس ثم قتل كما حذرت، ولما أمر علي بدفع جيفته إليها ألقت إليهم بمطرف خز فأدرجوه فيه ودفعوه إليها فمضت به {cite:muruj-al-dhahab p. 676-677}."
  en: "'Ubayd Allah ibn 'Umar's wife — alone of his women she refused to arm him at Siffin, warning that every proud champion who faced her tribe fell; wounded by his bow, she outlived her prophecy and carried his wrapped body home {cite:muruj-al-dhahab p. 676-677}."
