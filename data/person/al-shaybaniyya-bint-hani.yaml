summary:
  ar: "زوجة عبيد الله بن عمر بن الخطاب، امتنعت أن تشد عليه سلاحه يوم خروجه بصفين وقالت لم يتوجه إلى قومي صنديد في جاهلية ولا إسلام وفي رأسه صعر إلا أبادوه، فشجها بقوس ثم قتل كما حذرت، ولما أمر علي بدفع جيفته إليها ألقت إليهم بمطرف خز فأدرجوه فيه ودفعوه إليها فمضت به {cite:muruj-al-dhahab p. 676-677}."
  en: "'Ubayd Allah ibn 'Umar's wife — alone of his women she refused to arm him at Siffin, warning that every proud champion who faced her tribe fell; wounded by his bow, she outlived her prophecy and carried his wrapped body home {cite:muruj-al-dhahab p. 676-677}."
  fr: "‘Ubayd Allah ibn ‘Umar femme – seule de ses femmes, elle a refusé de l’armer à Siffin, avertissant que chaque champion fier qui a fait face à sa tribu est tombé ; blessé par son arc, elle a survécu à sa prophétie et a porté son corps enveloppé à la maison {cite:muruj-al-dhahab p. 676-677}."
  es: "La esposa de 'Ubayd Allah ibn 'Umar, la única de sus mujeres que se negó a armarlo en Siffin, advirtiendo que todo campeón orgulloso que se enfrentara a su tribu caería; herida por su arco, sobrevivió a su profecía y llevó su cuerpo envuelto a casa {cite:muruj-al-dhahab p. 676-677}."
  ur: "عبید اللہ ابن عمر کی بیوی - ان کی عورتوں میں سے اکیلے اس نے صفین میں اسے مسلح کرنے سے انکار کر دیا، خبردار کیا کہ اس کے قبیلے کا مقابلہ کرنے والا ہر قابل فخر فاتح گر گیا۔ اس کی کمان سے زخمی ہو کر، وہ اپنی پیشین گوئی سے آگے نکل گئی اور اس کی لپٹی ہوئی لاش گھر لے گئی۔ 676-677}۔"
