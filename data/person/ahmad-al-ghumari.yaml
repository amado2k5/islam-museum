summary:
  ar: "محدث وفقيه مغربي ⁦(1902–1960)⁩، أكبر إخوة الغماري الثلاثة، اشتهر بقوة الحفظ وسعة الرواية حتى لُقّب بموسوعة عصره. من مؤلفاته «المداوي لعلل الكنز المدفون» و«المعجم الأصغر»، وناقش في رسائله مصنفات السيوطي وغيرها."
  en: "Moroccan hadith master and jurist (1902–1960), the eldest of the three Ghumari brothers, famed for prodigious memory and breadth of transmission until styled 'the encyclopedia of his age'. His works include Al-Mudawi and Al-Mu'jam al-Asghar, and treatises scrutinising al-Suyuti's compilations."
  ur: "مغربی محدث اور فقیہ ⁦(1902–1960)⁩ جو تین غماری بھائیوں میں سب سے بڑے تھے اور غیر معمولی حافظے اور وسعتِ روایت کے باعث اپنے دور کا دائرۃ المعارف کہلائے۔ ان کی تصانیف میں «المداوي» اور «المعجم الاصغر» اور سیوطی کی تصانیف کے محاسبے کے رسائل شامل ہیں۔"
