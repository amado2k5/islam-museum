summary:
  ar: "أبو المنذر هشام بن عروة بن الزبير بن العوام القرشي الأسدي؛ كان هشام أحد ثقات المدينة المشهورين المسندين المعدودين من أكابر العلماء وجلة الحفاظ، ومن قصته أن المنصور قال له يوماً يا أبا المنذر تذكر يوم دخلت عليّ وما بينهما من النداء؛ ودُفن بمقبرة البقيع وتنازع أهل المدينة في قبره بين الجانب الشرقي والغربي {cite:wafayat-ayan}. وفي تاريخ بغداد (ترجمة 7383): ولد عام مقتل الحسين سنة إحدى وستين، ورأى ابن عمر وجابر بن عبد الله وأنس بن مالك وسهل بن سعد، وسمع عمه عبد الله بن الزبير وأباه عروة ووهب بن كيسان ومحمد بن المنكدر وكريباً مولى ابن عباس والزهري، وروى عنه يحيى بن سعيد الأنصاري وأيوب السختياني ومالك بن أنس وعبيد الله بن عمر وابن جريج وسفيان الثوري والليث بن سعد وسفيان بن عيينة ويحيى بن سعيد القطان ووكيع بن الجراح؛ وقدم على المنصور بغداد فأدركه أجله بها، وفيه قصة السويق حين ذكّره المنصور بدخوله عليه صبياً مع إخوته الخلفاء، وسؤاله قضاء دين مائة ألف فأمر له بعشرة آلاف {cite:tarikh-baghdad-khatib j.11 p.37-39}."
  en: "Abu al-Mundhir Hisham b. Urwa b. al-Zubayr b. al-Awwam — one of Medina's authoritative hadith transmitters, of the company of al-Zuhri and Hammad; Ibn Khallikan records Caliph al-Mansur's exchange with him and the Medinans' dispute over which grave at al-Baqi' was his {cite:wafayat-ayan}. Tarikh Baghdad (#7383): born the year al-Husayn was killed (61), he saw Ibn 'Umar, Jabir, Anas and Sahl b. Sa'd, heard his uncle Ibn al-Zubayr, his father Urwa, Wahb b. Kaysan, Muhammad b. al-Munkadir and al-Zuhri; Malik, al-Thawri, Ibn 'Uyayna, al-Qattan, Waki', Layth b. Sa'd and Ibn Jurayj transmitted from him; he came to al-Mansur at Baghdad and died there — and the suwayq anecdote: al-Mansur recalled drinking thin gruel at his door as a boy, and when Hisham pleaded a hundred-thousand debt the caliph granted ten thousand 'while your heart is at ease' {cite:tarikh-baghdad-khatib j.11 p.37-39}."
