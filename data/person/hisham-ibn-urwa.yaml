summary:
  ar: "أبو المنذر هشام بن عروة بن الزبير بن العوام القرشي الأسدي؛ كان هشام أحد ثقات المدينة المشهورين المسندين المعدودين من أكابر العلماء وجلة الحفاظ، ومن قصته أن المنصور قال له يوماً يا أبا المنذر تذكر يوم دخلت عليّ وما بينهما من النداء؛ ودُفن بمقبرة البقيع وتنازع أهل المدينة في قبره بين الجانب الشرقي والغربي {cite:wafayat-ayan}. وفي تاريخ بغداد ⁦(ترجمة 7383)⁩: ولد عام مقتل الحسين سنة إحدى وستين، ورأى ابن عمر وجابر بن عبد الله وأنس بن مالك وسهل بن سعد، وسمع عمه عبد الله بن الزبير وأباه عروة ووهب بن كيسان ومحمد بن المنكدر وكريباً مولى ابن عباس والزهري، وروى عنه يحيى بن سعيد الأنصاري وأيوب السختياني ومالك بن أنس وعبيد الله بن عمر وابن جريج وسفيان الثوري والليث بن سعد وسفيان بن عيينة ويحيى بن سعيد القطان ووكيع بن الجراح؛ وقدم على المنصور بغداد فأدركه أجله بها، وفيه قصة السويق حين ذكّره المنصور بدخوله عليه صبياً مع إخوته الخلفاء، وسؤاله قضاء دين مائة ألف فأمر له بعشرة آلاف {cite:tarikh-baghdad-khatib j.11 p.37-39}."
  en: "Abu al-Mundhir Hisham b. Urwa b. al-Zubayr b. al-Awwam — one of Medina's authoritative hadith transmitters, of the company of al-Zuhri and Hammad; Ibn Khallikan records Caliph al-Mansur's exchange with him and the Medinans' dispute over which grave at al-Baqi' was his {cite:wafayat-ayan}. Tarikh Baghdad (#7383): born the year al-Husayn was killed (61), he saw Ibn 'Umar, Jabir, Anas and Sahl b. Sa'd, heard his uncle Ibn al-Zubayr, his father Urwa, Wahb b. Kaysan, Muhammad b. al-Munkadir and al-Zuhri; Malik, al-Thawri, Ibn 'Uyayna, al-Qattan, Waki', Layth b. Sa'd and Ibn Jurayj transmitted from him; he came to al-Mansur at Baghdad and died there — and the suwayq anecdote: al-Mansur recalled drinking thin gruel at his door as a boy, and when Hisham pleaded a hundred-thousand debt the caliph granted ten thousand 'while your heart is at ease' {cite:tarikh-baghdad-khatib j.11 p.37-39}."
  es: "Abu al-Mundhir Hisham b. Urwa b. al-Zubayr b. al-Awwam — uno de los transmisores autorizados de hadices de Medina, del grupo de al-Zuhri y Hammad; Ibn Khallikan registra el intercambio del califa al-Mansur con él y la disputa de los medinanos sobre qué tumba en al-Baqi' era su {citar:wafayat-ayan}. Tarikh Bagdad (#7383): nacido el año en que mataron a al-Husayn (61), vio a Ibn 'Umar, Jabir, Anas y Sahl b. Sa'd, escuchó a su tío Ibn al-Zubayr, a su padre Urwa, a Wahb b. Kaysan, Mahoma b. al-Munkadir y al-Zuhri; Malik, al-Thawri, Ibn 'Uyayna, al-Qattan, Waki', Layth b. Sa'd e Ibn Jurayj transmitieron de él; Llegó a Bagdad para ver a al-Mansur y murió allí; y la anécdota de suwayq: al-Mansur recordaba haber bebido gachas aguadas en su puerta cuando era niño, y cuando Hisham alegó una deuda de cien mil, el califa le concedió diez mil \"mientras tu corazón esté tranquilo\" {cite:tarikh-baghdad-khatib j.11 p.37-39}."
  fr: "Abou al-Moundhir Hisham b. Urwa b. al-Zubayr b. al-Awwam — l'un des émetteurs de hadiths faisant autorité à Médine, de la compagnie d'al-Zuhri et Hammad; Ibn Khallikan rapporte l'échange du calife al-Mansur avec lui et le différend des Médinois sur la tombe d'al-Baqi' qui était sa {cite: wafayat-ayan}. Tarikh Bagdad (#7383): né l'année de la mort d'al-Husayn (61), il a vu Ibn 'Umar, Jabir, Anas et Sahl b. Sa'd, entendit son oncle Ibn al-Zubayr, son père Urwa, Wahb b. Kaysan, Muhammad b. al-Munkadir et al-Zuhri; Malik, al-Thawri, Ibn 'Uyayna, al-Qattan, Waki', Layth b. Sa'd et Ibn Jurayj ont transmis de lui; Il vint à al-Mansur à Bagdad et y mourut — et l'anecdote du suwayq: al-Mansur se souvenait avoir bu une bouillie légère à sa porte lorsqu'il était enfant, et lorsque Hisham plaida une dette de cent mille, le calife lui en accorda dix mille « tandis que ton cœur est en paix » {cite: tarikh-baghdad-khatib j.11 p.37-39}."
  ur: "ابو المنذر ہشام ب. عروہ بی۔ الزبیر بی العوام - مدینہ کے مستند حدیث کی ترسیل کرنے والوں میں سے ایک، الزہری اور حماد کی کمپنی سے؛ ابن خلیقان نے خلیفہ المنصور کا ان کے ساتھ تبادلہ اور مدینہ والوں کا یہ تنازعہ درج کیا ہے کہ البقیع میں کون سی قبر ان کی تھی۔ تاریخ بغداد (#7383): اس سال پیدا ہوا جس سال الحسین قتل ہوا (61)، اس نے ابن عمر، جابر، انس اور سہل بن کو دیکھا۔ سعد نے اپنے چچا ابن الزبیر، اپنے والد عروہ، وہب بن۔ کیسن، محمد بی۔ المنکدر اور الزہری؛ مالک، الثوری، ابن عیینہ، القطان، وکیع، لیث بی. سعد اور ابن جریج نے اس سے روایت کی ہے۔ وہ بغداد میں المنصور کے پاس آیا اور وہیں فوت ہوا - اور صوائق کا قصہ: المنصور نے لڑکپن میں اپنے دروازے پر پتلی شراب پیتے ہوئے یاد کیا، اور جب ہشام نے ایک لاکھ قرض کی درخواست کی تو خلیفہ نے دس ہزار 'جب کہ آپ کے دل کو سکون ہے' ⁦(حوالہ: تاریخ بغداد)⁩ 3-1-3۔"
