summary:
  ar: "أبو المنذر هشام بن عروة بن الزبير بن العوام القرشي الأسدي؛ كان هشام أحد ثقات المدينة المشهورين المسندين المعدودين من أكابر العلماء وجلة الحفاظ، ومن قصته أن المنصور قال له يوماً يا أبا المنذر تذكر يوم دخلت عليّ وما بينهما من النداء؛ ودُفن بمقبرة البقيع وتنازع أهل المدينة في قبره بين الجانب الشرقي والغربي {cite:wafayat-ayan}."
  en: "Abu al-Mundhir Hisham b. Urwa b. al-Zubayr b. al-Awwam — one of Medina's authoritative hadith transmitters, of the company of al-Zuhri and Hammad; Ibn Khallikan records Caliph al-Mansur's exchange with him and the Medinans' dispute over which grave at al-Baqi' was his {cite:wafayat-ayan}."
