class: person
label: { ar: "بالچند ⁦(مصور مغولي)⁩", en: "Balchand (Mughal painter)", ur: "بال چند ⁦(مغل مصور)⁩", es: "Balchand (Mughal painter)", fr: "Balchand (Mughal painter)" }
summary:
  ar: "مصور مغولي أخو پياگ، عمل من تسعينيات القرن السادس عشر إلى عهد شاه جهان، وكان له في البلاط عمل غير التصوير، ورسم نفسه في صفحتين من «پادشاهنامه» وندسور {cite:beach-grand-mogul-1978 p. 94} {cite:beach-grand-mogul-1978 p. 97}."
  en: "Mughal painter, brother of Payag, active from the 1590s into Shah Jahan's reign, who also held other duties at court and painted himself in two pages of the Windsor Padshah-nama {cite:beach-grand-mogul-1978 p. 94} {cite:beach-grand-mogul-1978 p. 97}."
  ur: "مغل مصور، پیاگ کے بھائی، 1590ء کی دہائی سے شاہ جہان کے دور تک فعال، جن کے دربار میں مصوری کے علاوہ بھی فرائض تھے، اور جنہوں نے ونڈسر پادشاہنامہ کے دو صفحات میں خود کو بنایا {cite:beach-grand-mogul-1978 p. 94} {cite:beach-grand-mogul-1978 p. 97}۔"
  es: "Pintor mogol, hermano de Payag, activo desde la década de 1590 hasta el reinado de Shah Jahan, que también desempeñó otras funciones en la corte y se pintó a sí mismo en dos páginas del Padshah-nama de Windsor {cite:beach-grand-mogul-1978 p. 94} {cite:beach-grand-mogul-1978 p. 97}."
  fr: "Peintre moghol, frère de Payag, actif des années 1590 jusqu'au règne de Shah Jahan, qui occupait également d'autres fonctions à la cour et s'est peint lui-même sur deux pages du Windsor Padshah-nama {cite:beach-grand-mogul-1978 p. 94} {cite:beach-grand-mogul-1978 p. 97}."
  tr: "Babür ressam, Piag'ın kardeşi, 1690'lardan Şah Cihan dönemine kadar çalıştı ve sarayda resim dışında da eserleri vardı; kendisi Windsor Badshanahma'nın iki sayfasında çizdi {cite:beach-grand-mogul-1978 s. 94} {cite:beach-grand-mogul-1978 s. 97}."
  id: "Pelukis Mughal, saudara Piag, bekerja dari tahun 1690-an hingga masa pemerintahan Shah Jahan, dan memiliki karya di istana selain melukis, menggambar dirinya sendiri pada dua halaman Windsor Badshanahma {cite:beach-grand-mogul-1978 hlm. 94} {cite:beach-grand-mogul-1978 hlm. 97}."
