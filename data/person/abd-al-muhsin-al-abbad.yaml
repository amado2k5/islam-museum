  ar: "محدث سعودي كبير، وُلد سنة 1934، النائب السابق لرئيس الجامعة الإسلامية بالمدينة المنورة. درّس الكتب الستة في المسجد النبوي لعقود، ومن كتبه «فتح القوي المتين» في العقيدة و«شرح سنن أبي داود» و«رفقًا أهل السنة بأهل السنة»."
  en: "Senior Saudi hadith scholar, born in 1934, former vice president of the Islamic University of Madinah. He taught the Six Books in the Prophet’s Mosque for decades, authoring Fath al-Qawi al-Matin on creed, a commentary on Sunan Abi Dawud and Rifqan Ahl al-Sunna bi Ahl al-Sunna."
  ur: "سعودی ممتاز محدث، 1934 میں پیدا ہوئے اور جامعہ اسلامیہ مدینہ کے سابق نائب صدر۔ انہوں نے مسجدِ نبوی میں عشروں کتبِ ستہ پڑھائی؛ کتب میں عقیدے پر «فتح القوي المتین»، «شرح سنن أبي داود» اور «رفقًا أهل السنۃ بأهل السنۃ» شامل ہیں۔"
