  ar: "أبو عبد الله الحناط الشيرازي، فقيه فارس {cite:tabaqat-fuqaha-abbas-1981 p. 61}. لم يذكر الشيرازي تاريخ وفاته ولا من أخذ عنه. حاشية الكتاب تذكر أن الاسم في ط «الخياط»، والمضبوط بالمهملة في النسخة ع {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu Abd Allah al-Hannat al-Shirazi, a jurist of Fars {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi gives neither his date of death nor his teachers. The editor's note in the book says the edition prints the name as 'al-Khayyat', while manuscript (ع) has the undotted letter, that is, al-Hannat {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
