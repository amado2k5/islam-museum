summary:
  ar: "أبو عبد الله الحناط الشيرازي، فقيه فارس {cite:tabaqat-fuqaha-abbas-1981 p. 61}. لم يذكر الشيرازي تاريخ وفاته ولا من أخذ عنه. حاشية الكتاب تذكر أن الاسم في ط «الخياط»، والمضبوط بالمهملة في النسخة ع {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu Abd Allah al-Hannat al-Shirazi, a jurist of Fars {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi gives neither his date of death nor his teachers. The editor's note in the book says the edition prints the name as 'al-Khayyat', while manuscript ⁦(ع)⁩ has the undotted letter, that is, al-Hannat {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  fr: "Abu Abd Allah al-Hannat al-Shirazi, juriste du Fars {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi ne donne ni sa date de mort ni ses maîtres. La note de l'éditeur dans le livre dit que l'édition imprime le nom « al-Khayyat », tandis que le manuscrit ⁦(ع)⁩ porte la lettre sans points, c'est-à-dire al-Hannat {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  es: "Abu Abd Allah al-Hannat al-Shirazi, jurista de Fars {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi no proporciona ni su fecha de fallecimiento ni sus maestros. La nota del editor en el libro indica que la edición imprime el nombre como 'al-Khayyat', mientras que el manuscrito ⁦(ع)⁩ tiene la letra sin punto, es decir, al-Hannat {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  ur: "ابو عبد اللہ الحنات الشیرازی، فارس کے ایک فقیہ۔ 61}۔ الشیرازی نے نہ تو اپنی تاریخ وفات بتائی ہے اور نہ ہی اس کے اساتذہ۔ کتاب میں ایڈیٹر کے نوٹ میں کہا گیا ہے کہ ایڈیشن کا نام 'الخیاط' کے نام سے چھاپا گیا ہے، جبکہ مخطوطہ ⁦(ع)⁩ میں بغیر نشان والا حرف ہے، یعنی الحنّت {حوالہ:طبقات-فقہا-عباس-1981 ص۔ 61}۔"
  tr: "İranlı bir hukukçu olan Ebu Abdullah el-Hannat el-Şirazi (kaynak: tabaqat-fuqaha-abbas-1981 s. 61). El-Şirazi ölüm tarihinden veya kimlerin kendisinden eğitim aldığından bahsetmemiştir. Kitabın dipnotunda, basılı baskıdaki ismin \"el-Hayyat\" olduğu, el yazmasında ise noktalama işareti olmayan harfle yazıldığı belirtilmiştir (kaynak: tabaqat-fuqaha-abbas-1981 s. 61)."
  id: "Abu Abdullah al-Hannat al-Shirazi, seorang ahli hukum Persia (kutipan: tabaqat-fuqaha-abbas-1981 hlm. 61). Al-Shirazi tidak menyebutkan tanggal kematiannya, maupun siapa yang belajar di bawah bimbingannya. Catatan kaki buku tersebut menyatakan bahwa nama dalam edisi cetak adalah \"al-Khayyat,\" sedangkan ejaan dengan huruf tanpa titik terdapat dalam manuskrip (kutipan: tabaqat-fuqaha-abbas-1981 hlm. 61)."
