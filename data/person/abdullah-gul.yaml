  ar: "اقتصادي وسياسي تركي، الرئيس الحادي عشر لجمهورية تركيا من 2007 إلى 2014، ورئيس وزرائها من 2002 إلى 2003، ووزير خارجيتها ونائب رئيس وزرائها من 2003 إلى 2007. من مؤسسي حزب العدالة والتنمية سنة 2001، وعمل قبل ذلك خبيرا اقتصاديا في البنك الإسلامي للتنمية بجدة."
  en: "Turkish economist and politician, the eleventh president of Turkey from 2007 to 2014, previously prime minister from 2002 to 2003 and foreign minister and deputy prime minister from 2003 to 2007. A co-founder of the Justice and Development Party (AKP) in 2001, he had earlier worked as an economist at the Islamic Development Bank in Jeddah."
