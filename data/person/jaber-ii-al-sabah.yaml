summary:
  ar: "جابر بن مبارك الصباح، المعروف بجابر الثاني (وُلد سنة 1860 – توفي في الكويت في 5 فبراير 1917)، حاكم الكويت الثامن، وأكبر أبناء مبارك الكبير من زوجته شيخة دعيج الصباح. كان الساعد الأيمن لأبيه: شاركه في قتل عميه محمد وجراح سنة 1896، وكان نائبه في الكويت أثناء حملة الصريف، وقاد جيش الكويت في معركتي جو لبن سنة 1904 وهدية سنة 1910. تولى الحكم بعد وفاة أبيه في 28 نوفمبر 1915، فألغى ضريبة الثلث على العقارات التي أثقل بها أبوه كاهل الناس وأعاد البيوت المصادرة ووزّع الأموال، فأحبّه الشعب؛ وخالف أباه في الحرب العالمية الأولى فمال إلى العثمانيين وسهّل قوافل الإمداد إليهم، فاحتجّ البريطانيون واجتمع به بيرسي كوكس في نوفمبر 1916 دون حسم. توفي بحمّى لم تمهله طويلًا وخلفه أخوه سالم، وهو جدّ فرع آل جابر في الأسرة، وابنه أحمد صار حاكم الكويت العاشر."
  en: "Jaber bin Mubarak Al-Sabah, known as Jaber II (born in 1860 – died at Kuwait on 5 February 1917), was the eighth ruler of Kuwait and the eldest son of Mubarak the Great by his wife Sheikha Duaij Al-Sabah. He was his father's right hand: he took part with him in the killing of his uncles Muhammad and Jarrah in 1896, deputised for him in Kuwait during the Sarif campaign, and commanded Kuwait's army at Ju Lubn in 1904 and Hadiya in 1910. Succeeding his father on 28 November 1915, he abolished the one-third property tax with which his father had burdened the people, returned confiscated houses and distributed money, and was loved for it; in the First World War he broke with his father's policy, leaned toward the Ottomans and facilitated supply caravans to them, drawing British protests and an inconclusive meeting with Percy Cox in November 1916. He died of a fever after a short reign and was succeeded by his brother Salim; he is the ancestor of the Al-Jaber branch of the family, and his son Ahmad became Kuwait's tenth ruler."
  ur: "جابر بن مبارک الصباح، جابر ثانی (ولادت: 1860ء – وفات: کویت، 5 فروری 1917ء)، کویت کے آٹھویں حکمران اور مبارک الکبیر کے سب سے بڑے بیٹے تھے۔ وہ والد کے دستِ راست تھے، 28 نومبر 1915ء کو حکمران بنے، جائیداد پر ثلث ٹیکس ختم کر کے عوام میں مقبول ہوئے، اور مختصر عہد کے بعد انتقال کر گئے؛ ان کے بعد ان کے بھائی سالم حکمران بنے۔"
