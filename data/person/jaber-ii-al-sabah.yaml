  source: "English Wikipedia 'Jaber II Al-Sabah' (revision 1299122555), Arabic Wikipedia 'جابر المبارك الصباح' (revision 76470948) and Urdu Wikipedia 'جابر مبارک الصباح' (revision 5770087), read on 25 October 2026, with Wikidata item Q26919. This Jaber is Jaber II, Mubarak's eldest son — not Jaber I (r. 1813–1859, his great-grandfather's generation) and not the later emir Jaber III (r. 1977–2006), his great-nephew of the same branch. The sources' disagreements are stated in the notes and prose rather than merged: the Arabic article's 'January 1917' death against its own 5 February dating, its 13 Rabi' al-Thani against tabular 12 Rabi' al-Thani, Wikidata's unsupported second birth year 1873, and the Urdu stub's misdated accession (28 February 1915 for 28 November 1915). No place edges are written, because the museum has no place entity for Kuwait City; his brother and successor Salim and his son Ahmad, the tenth ruler, have no museum person records in this run, so no sibling or parent-of edges are written."
