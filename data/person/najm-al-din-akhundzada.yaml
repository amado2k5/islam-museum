    basis: documented
    note: "Two independent texts attest a personal Sufi affiliation, not merely an office or a title. Edwards, from the oral histories of his disciples' descendants, recounts that he became the Akhund of Swat's disciple, performed the zikr — 'the spiritual exercises of the Sufi order' — was sent by the Akhund to settle at Hadda 'to propagate Islam and tariqat [the Sufi path]', and himself stood at the head of a line of disciples and deputies (the Hazrat of Butkhak, the Haji of Turangzai, the Ustad of Hadda and others). The Tribal Analysis Center report, drawing on Sana Haroon's Frontier of Faith, independently states that he received permission from the Akhund of Swat to teach all four prominent Sufi schools from Hadda — a personal teaching authorisation. No single named order is attested for him personally: his teacher was himself authorised in the Naqshbandi, Qadiri, Chishti and Suhrawardi orders, and the sources do not tie Najmuddin to one of them, so the generic value sufi is recorded and no order value is asserted."
    sources: [source/edwards-heroes-of-the-age-1996, source/tribal-analysis-center-mad-mullahs]
