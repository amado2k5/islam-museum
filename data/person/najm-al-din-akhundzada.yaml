summary:
  ar: "پير صوفي أفغاني من هده في ننغرهار (ت 1902)، تلميذ آخوند سوات عبد الغفور وخليفته، عُرف بملا هده وصاحب هده. أرسله شيخه إلى هده لنشر الإسلام والطريقة فبنى فيها مسجدا وخانقاه، وامتدت شبكة خلفائه وتلاميذه عبر قبائل الحدود فكان المنظّم الديني الأبرز لثورة 1897 ضد البريطانيين، وظل معارضا لسياسات الأمير عبد الرحمن الذي حاول استمالته فرفض."
  en: "Afghan Sufi pir of Hadda in Nangarhar (died 1902), disciple and deputy of the Akhund of Swat, 'Abd al-Ghafur, known as the Mulla of Hadda and Hadda Sahib. Sent by his teacher to Hadda to propagate Islam and the Sufi path, he built a mosque and hospice there, and his network of deputies and disciples across the frontier tribes made him the central religious organiser of the 1897 uprising against the British; he also resisted the attempts of Amir 'Abd al-Rahman to co-opt him."
  ur: "ننگرہار کے علاقے ہدہ کے افغان صوفی پیر (وفات 1902ء)، آخوندِ سوات عبدالغفور کے شاگرد اور خلیفہ، جو ملا ہدہ اور صاحبِ ہدہ کے نام سے مشہور ہوئے۔ ان کے استاد نے انہیں ہدہ بھیجا تاکہ اسلام اور طریقت کی تبلیغ کریں؛ وہاں انہوں نے مسجد اور خانقاہ بنائی، اور سرحدی قبائل میں ان کے خلفاء و مریدین کے جال نے انہیں 1897ء کی انگریز مخالف بغاوت کا مرکزی دینی منتظم بنا دیا۔"
