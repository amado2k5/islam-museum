summary:
  ar: "أبو القاسم علي بن إسحاق بن خلف البغدادي المعروف بالزاهي؛ الشاعر المشهور؛ كان وصّافاً محسناً كثير الملح؛ ذكره الخطيب في «تاريخ بغداد» فقال إنه حسن الشعر في التشبيبات وغيرها وكان قسطلياً دكانه في قطيعة الربيع؛ ومدح سيف الدولة والوزير المهلبي وغيرهما من رؤساء وقته؛ ذكره ابن عبد البر في «طبقات الشعراء» {cite:wafayat-ayan}."
  en: "Al-Zahi, Abu al-Qasim Ali b. Ishaq (318–362) — Baghdad's celebrated descriptive poet, a cloth-merchant of Qati'at al-Rabi' who praised Sayf al-Dawla and the vizier al-Muhallabi {cite:wafayat-ayan}."
