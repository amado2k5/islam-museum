summary:
  ar: "أبو القاسم علي بن إسحاق بن خلف البغدادي المعروف بالزاهي؛ الشاعر المشهور؛ كان وصّافاً محسناً كثير الملح؛ ذكره الخطيب في «تاريخ بغداد» فقال إنه حسن الشعر في التشبيبات وغيرها وكان قسطلياً دكانه في قطيعة الربيع؛ ومدح سيف الدولة والوزير المهلبي وغيرهما من رؤساء وقته؛ ذكره ابن عبد البر في «طبقات الشعراء» {cite:wafayat-ayan}."
  en: "Al-Zahi, Abu al-Qasim Ali b. Ishaq (318–362) — Baghdad's celebrated descriptive poet, a cloth-merchant of Qati'at al-Rabi' who praised Sayf al-Dawla and the vizier al-Muhallabi {cite:wafayat-ayan}."
  fr: "Al-Zahi, Abu al-Qasim Ali b. Ishaq (318–362) – Le célèbre poète descriptif de Bagdad, un marchand de tissus de Qati'at al-Rabi qui a loué Sayf al-Dawla et le vizir al-Muhallabi {cite:wafayat-ayan}."
  es: "Al-Zahi, Abu al-Qasim Ali b. Ishaq (318–362) — Célebre poeta descriptivo de Bagdad, comerciante de telas de Qati'at al-Rabi' que alabó a Sayf al-Dawla y al visir al-Muhallabi {cite:wafayat-ayan}."
  ur: "الزحی، ابو القاسم علی بن اسحاق (318-362) - بغداد کا مشہور وضاحتی شاعر، قطیعت الربیع کا کپڑا تاجر جس نے سیف الدولہ اور وزیر المحلبی کی تعریف کی۔"
  tr: "Ebu el-Kasım Ali bin İshaq ibn Halaf el-Bağdadi, ünlü şair el-Zahi olarak bilinir, tanımlayıcı, etkileyici ve tanınmış bir şairdi; el-Hatib onu 'Tarih Bağdat'ta bahsederek, el-Taşbibat ve diğerlerinde şiirde yetenekli olduğunu söylemiştir. Bahar tatilinde dükkânının bir Kastliyası; Sayf al-Dawla'yı, el-Muhallabi bakanı ve dönemin diğer liderlerini övmüştür; İbn Abdülbarr bunu 'Tebaqat al-Shu'ara' {alıntı:wafayat-ayan} adlı eserinde belirtmiştir."
  id: "Abu al-Qasim Ali ibn Ishaq ibn Khalaf al-Baghdadi, yang dikenal sebagai al-Zahi, penyair terkenal, adalah penyair yang deskriptif, fasih, dan terkenal; al-Khatib menyebutnya dalam 'Tarikh Baghdad,' mengatakan bahwa ia mahir dalam puisi di al-Tashbibat dan lainnya. Ia adalah Qastliya di tokonya selama libur musim semi; ia memuji Sayf al-Dawla, menteri al-Muhallabi, dan pemimpin lain pada zamannya; Ibn Abd al-Barr menyebutkannya dalam 'Tabaqat al-Shu'ara' {cite:wafayat-ayan}."
