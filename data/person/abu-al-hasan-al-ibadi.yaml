summary:
  ar: "علي بن أبي عاصم محمد بن أحمد بن محمد بن عبد الله بن عباد العبادي الهروي، أبو الحسن، فقيه شافعي كان من كبار الخراسانيين، وهو ولد الإمام أبي عاصم العبادي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} من تصانيفه كتاب «الرقم» في الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} أوردته الموسوعة بتاريخي ولادة 415هـ ووفاة 495هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242}"
  en: "Ali ibn Abi Asim Muhammad ibn Ahmad ibn Muhammad ibn Abd Allah ibn Abbad al-Ibadi al-Harawi, Abu al-Hasan, a Shafi'i jurist counted among the leading scholars of Khurasan, and the son of Imam Abi Asim al-Ibadi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} His works include Kitab al-Raqm on fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} The encyclopedia dates him 415–495 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242}"
  ur: "علی بن ابی عاصم محمد بن احمد بن محمد بن عبد اللہ بن عباد العبادی ہروی، ابو الحسن، شافعی فقیہ جو خراسان کے بڑے علماء میں شمار ہوتے تھے، اور امام ابی عاصم العبادی کے فرزند تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} ان کی تصانیف میں فقہ پر کتاب «الرقم» شامل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242} موسوعہ نے ان کی ولادت 415ھ اور وفات 495ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16242}"
