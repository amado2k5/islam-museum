summary:
  ar: "الشيخ إبراهيم الزيات المصري المجذوب أبو السناء الزيات المعروف بالزيات؛ شيخ مجذوب ولد بالقاهرة نحواً من سنة ثمانين وسبعمائة ونشأ بها فأقام ببولاق مدة ينابذ لخطاب نسائها وزائرات مقابرها وربما عدا عليهن بالفسوق وما لا يجمل به تكلماً ويتكرر منه ذلك ولا أحد يعترضه بل يتمسحن به من أصحاب التبرك وينتفعون به في جهات قضاء حوائجهم وربما أوقع له في أمور غيبية واطلع عليه جماعة من جلسائه شيئاً من ذلك واتفق له ولم ينته عن تسكبث كثيراً، وكان مجذوباً يتكلم في غيبة فيغيب عما نطق به لا يوافق أهل النظر وربما جاوزوا الغاية فيه، توفي سنة اثنتين وستين وثمانمائة {cite:shadharat-dhahab p. 299-300}."
  en: "Ibrahim al-Zayyat (b. Cairo ~780) — the majdhub of Bulaq who chastised its womenfolk and cemetery-visitors yet was sought by the baraka-seekers; 'he spoke in the unseen and passed beyond what men of reason allow'; died 862 {cite:shadharat-dhahab p. 299-300}."
