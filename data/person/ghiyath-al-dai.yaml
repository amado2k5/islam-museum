label: { ar: "غياث الداعي", en: "Ghiyath Al Dai", es: "Ghiyath Al Dai", fr: "Ghiyath Al Dai", ur: "غیاث الدائی" }
summary:
  ar: "غياث، من حكاية ابن النديم أن أول من قدم من بني القداح إلى الري وأذربيجان وطبرستان رجل حلاج القطن ثم مات فخلفه ابنه ثم مات الابن فخلفه رجل يعرف بغياث ثم مات فخلفه ابنه ورجل يعرف بالمحروم ثم مات فخلفه أبو حاتم الورسناني وكان ثنويا ثم صار دهريا ثم تزندق وحصل على الشك {cite:fihrist-ibn-al-nadim p. 266-267}."
  en: "Ghiyath — third in the Rayy da'wa chain after the cotton-carder and his son {cite:fihrist-ibn-al-nadim}"
  es: "Ghiyath — tercero en la cadena Rayy da'wa después del cardador de algodón y su hijo {cite:fihrist-ibn-al-nadim}"
  fr: "Ghiyath — troisième dans la chaîne de Rayy da'wa après le cardeur de coton et son fils {cite:fihrist-ibn-al-nadim}"
  ur: "غیاث - کاٹن کارڈر اور اس کے بیٹے کے بعد رے دعوۃ سلسلہ میں تیسرا"
  tr: "İbn el-Nadim hikayesinden Ghiyath'a göre, Banu el-Kadde'den Azerbaycan'ın Reyi ve Tabaristan'a ilk gelenin Hallaj al-Qutn adında bir adamdı, sonra öldü, yerine oğlu geçti, sonra oğlu öldü ve ondan sonra Al-Muharram olarak bilinen bir adam öldü. Yerine dualist olan Abu Hatim al-Warsani geçti; o önce sapkın, sonra sapkın oldu ve şüpheli hale geldi {cite:fihrist-ibn-al-nadim s. 266-267}."
  id: "Ghiyath, dari kisah Ibn al-Nadim, menyatakan bahwa yang pertama datang dari Banu al-Qaddah ke Rayy, Azerbaijan, dan Tabaristan adalah seorang pria bernama Hallaj al-Qutn, lalu meninggal, digantikan oleh putranya, kemudian putranya meninggal, dan seorang pria yang dikenal sebagai Al-Muharram meninggal setelahnya. Ia digantikan oleh Abu Hatim al-Warsani, yang merupakan seorang dualis, kemudian menjadi sesat, kemudian menjadi sesat, dan menjadi meragukan {cite:fihrist-ibn-al-nadim hlm. 266-267}."
