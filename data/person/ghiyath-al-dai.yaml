label: { ar: "غياث الداعي", en: "Ghiyath Al Dai" }
summary:
  ar: "غياث، من حكاية ابن النديم أن أول من قدم من بني القداح إلى الري وأذربيجان وطبرستان رجل حلاج القطن ثم مات فخلفه ابنه ثم مات الابن فخلفه رجل يعرف بغياث ثم مات فخلفه ابنه ورجل يعرف بالمحروم ثم مات فخلفه أبو حاتم الورسناني وكان ثنويا ثم صار دهريا ثم تزندق وحصل على الشك {cite:fihrist-ibn-al-nadim p. 266-267}."
  en: "Ghiyath — third in the Rayy da'wa chain after the cotton-carder and his son {cite:fihrist-ibn-al-nadim}"
