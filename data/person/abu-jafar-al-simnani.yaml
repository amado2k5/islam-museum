summary:
  ar: "محمد بن أحمد بن محمد، أبو جعفر السمناني، القاضي، ولد سنة 361 هـ وسكن بغداد وحدث عن السكري والدارقطني، وكان يعتقد في الأصول مذهب الأشعري على ما يذكر ابن الجوزي، وتوفي في ربيع الأول سنة 444 هـ بالموصل وهو قاضيها بعد أن كف بصره."
  en: "Muhammad ibn Ahmad ibn Muhammad, Abu Ja'far al-Simnani, the qadi; born 361 AH, settled in Baghdad, transmitted from al-Sukkari and al-Daraqutni and, says Ibn al-Jawzi, held the Ash'ari position in the fundamentals; died in Rabi' I 444 AH in Mosul, where he was qadi, after losing his sight."
  fr: "Muhammad ibn Ahmad ibn Muhammad, Abu Ja'far al-Simnani, le cadi ; né en 361 H, établi à Bagdad, il transmit d'al-Sukkari et d'al-Daraqutni et, selon Ibn al-Jawzi, tenait la position ash'arite dans les fondements ; mort en rabi' I 444 H à Mossoul, où il était cadi, après avoir perdu la vue."
