summary:
  ar: "منشد إندونيسي للصلوات والقصائد الدينية، بدأ الغناء طفلا في السادسة من عمره سنة 2018، واشتهر بأغاني صلوات مثل «إنّ الحبيب المصطفى» و«شيخنا» التي أصدرتها شركة RPM ونشرتها قناته على يوتيوب، ويُقدَّم في أوساطه بوصفه حفيدا لحبيب شيخ بن عبد القادر عسقاف."
  en: "Indonesian singer of shalawat and religious songs who began performing as a six-year-old in 2018 and became known for shalawat songs such as 'Innal Habibal Musthofa' and 'Syaikhona', released by the RPM label and published on his YouTube channel; in his milieu he is presented as a grandson of Habib Syech bin Abdul Qodir Assegaf."
  ur: "انڈونیشیائی نعت خواں اور دینی گیتوں کے گلوکار، جنہوں نے 2018 میں چھ برس کی عمر میں گانا شروع کیا اور «إنّ الحبيب المصطفى» اور «شيخنا» جیسی نعتوں سے شہرت پائی، جو RPM لیبل نے جاری کیں اور ان کے یوٹیوب چینل پر شائع ہوئیں؛ اپنے حلقے میں وہ حبیب شیخ بن عبدالقادر عسقاف کے پوتے کے طور پر پیش کیے جاتے ہیں۔"
