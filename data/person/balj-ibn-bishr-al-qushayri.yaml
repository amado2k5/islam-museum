id: person/balj-ibn-bishr-al-qushayri
class: person
label: { ar: "بلج بن بشر القشيري" }
gender: male
summary:
  ar: "قائد جند الشام الذي دخل الأندلس سنة أربع وعشرين ومائة ناجياً من وقعة كلثوم بن عياض مع البربر بملوية، فثار على الأمير عبد الملك بن قطن الفهري وقتله وهو ابن سبعين واستوثق له أمر الأندلس، وانهاز الفهريون إلى جانب فامتنعوا عليه وكاشفوه {cite:nafh-tib-maqqari p. 273}."
  en: "Commander of the Syrian jund who crossed into al-Andalus in 124 after surviving Kulthum b. Iyad's defeat by the Berbers at the Malwiya; he killed the governor Abd al-Malik b. Qatan and held the land against the Fihrid revolt {cite:nafh-tib-maqqari p. 273}."
  es: "Comandante del jund sirio que cruzó a al-Ándalus en 124 después de sobrevivir a la derrota de Kulthum b. Iyad a manos de los bereberes en Malwiya; mató al gobernador Abd al-Malik b. Qatan y mantuvo el territorio contra la revuelta de Fihrid {cite:nafh-tib-maqqari p. 273}."
  fr: "Commandant du jund syrien qui traversa en al-Andalus en 124 après avoir survécu à la défaite de Kulthum b. Iyad face aux Berbères à la Malwiya; il tua le gouverneur Abd al-Malik b. Qatan et tint le pays contre la révolte de Fihrid {cite:nafh-tib-maqqari p. 273}."
  ur: "شامی جند کا کمانڈر جو 124 میں کلثوم سے بچنے کے بعد اندلس میں داخل ہوا۔ مالویہ میں بربروں کے ہاتھوں ایاد کی شکست؛ اس نے گورنر عبد الملک کو قتل کر دیا۔ قطان اور فہرد کی بغاوت کے خلاف سرزمین پر قبضہ کر لیا 273}۔"
  tr: "124 Hicri yılında Kultum ibn İyad'ın Berberilerle savaşından kurtulanlarla birlikte el-Endülüs'e giren Suriye ordusunun komutanı, Prens Abd al-Malik ibn Qatn al-Fihri'ye karşı isyan etti ve yetmiş yaşında onu öldürdü; el-Endülüs işleri ona onaylandı. Fihriler taraf tuttu, direndi ve onu ifşa etti {atıf:nafh-tib-maqqari, s. 273}."
  id: "Komandan tentara Suriah yang memasuki al-Andalus pada tahun 124 AH bersama para penyintas dari pertempuran Kulthum ibn Iyad melawan Berber di Malwiya, memberontak melawan Pangeran Abd al-Malik ibn Qatn al-Fihri dan membunuhnya pada usia tujuh puluh tahun, dan urusan al-Andalusia dikonfirmasi kepadanya. Fihri berpihak, melawan, dan membongkarnya {cite:nafh-tib-maqqari, hlm. 273}."
