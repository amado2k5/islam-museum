summary:
  ar: "إمام وعالم كوسوفي ⁦(المولود 1966 في سيبوفس، أوبيليتش)⁩، درس في المدينة المنورة ونال فيها الدكتوراه في الفقه سنة 2001، وعمل أستاذا في كلية الدراسات الإسلامية في بريشتينا وإماما لجامعها الإمبراطوري؛ اتُّهم سنة 2017 بتهم منها التحريض على الإرهاب وبُرّئ منها جميعا سنة 2018. بلغ عدد متابعي صفحته على فيسبوك 409 آلاف في أكتوبر 2024 بحسب دراسة «كونتكست»."
  en: "Kosovar imam and scholar (born 20 June 1966 in Sibofc, Obiliq), trained in Medina (doctorate in Islamic jurisprudence, 2001), formerly a professor at the Faculty of Islamic Studies in Pristina and imam of Pristina's Imperial Mosque; indicted in 2017 on charges including incitement to terrorism, he was acquitted on all charges in 2018. His Facebook page counted 409,000 followers in October 2024 (Context study)."
  ur: "شفقت کراسنیقی ⁦(پیدائش 1966ء، سیبوفٹس، اوبیلیچ)⁩ کوسوو کے امام اور عالم ہیں؛ مدینہ منورہ سے 2001ء میں فقہ میں ڈاکٹریٹ کی، پرشٹینا کی کلیہ مطالعاتِ اسلامیہ میں استاد اور وہاں کی شاہی مسجد کے امام رہے؛ 2017ء میں دہشت گردی پر اکسانے سمیت الزامات عائد ہوئے اور 2018ء میں وہ تمام الزامات سے بری ہو گئے۔ اکتوبر 2024ء میں ان کے فیس بک صفحے کے فالوورز 409 ہزار تھے ⁦(کانٹیکسٹ مطالعہ)⁩۔"
