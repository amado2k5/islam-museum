summary:
  ar: "ملاكم أمريكي سابق ومدرب ملاكمة، وُلد باسم إدوارد غريغوري في بروكلين سنة 1952. فاز ببطولة نيويورك غولدن غلوفز مرتين باسم ميلاده، ثم أحرز لقب رابطة الملاكمة العالمية لوزن خفيف الثقيل سنة 1980، وفقد اللقب أمام مايكل سبينكس سنة 1981، واعتزل سنة 1988، فعمل مدرباً لأبطال عالميين وأسس نقابة للملاكمين المحترفين سنة 2003."
  en: "American former boxer and boxing trainer, born Edward Gregory in Brooklyn in 1952. He won two New York Golden Gloves titles under his birth name, took the WBA light heavyweight title in 1980, lost it to Michael Spinks in 1981, retired in 1988, and went on to train world champions and to found a union for professional boxers in 2003."
  ur: "امریکی سابق باکسر اور باکسنگ ٹرینر، 1952 میں بروکلن میں ایڈورڈ گریگری کے نام سے پیدا ہوئے۔ انہوں نے اپنے پیدائشی نام سے دو بار نیویارک گولڈن گلووز جیتا، 1980 میں ڈبلیو بی اے لائٹ ہیوی ویٹ ٹائٹل حاصل کیا، 1981 میں مائیکل سپنکس سے ٹائٹل کھویا، 1988 میں ریٹائر ہوئے، اور بعد میں عالمی چیمپئنز کے ٹرینر اور 2003 میں پیشہ ور باکسرز کی یونین کے بانی بنے۔"
  es: "Exboxeador y entrenador de boxeo estadounidense, nacido como Edward Gregory en Brooklyn en 1952. Ganó dos títulos de los Guantes de Oro de Nueva York con su nombre de nacimiento, se hizo con el título de peso semipesado de la AMB en 1980, lo perdió ante Michael Spinks en 1981, se retiró en 1988 y posteriormente entrenó a campeones mundiales y fundó un sindicato para boxeadores profesionales en 2003."
  fr: "Ancien boxeur et entraîneur de boxe américain, né Edward Gregory à Brooklyn en 1952. Il a remporté deux titres des Golden Gloves de New York sous son nom de naissance, a pris le titre WBA des poids mi-lourds en 1980, l'a perdu face à Michael Spinks en 1981, a pris sa retraite en 1988, puis a entraîné des champions du monde et fondé un syndicat de boxeurs professionnels en 2003."
  tr: "Eski bir Amerikalı boksör ve boks antrenörü, 1952'de Brooklyn'de Edward Gregory olarak doğdu. Doğum adıyla iki kez New York Golden Gloves kazandı, ardından 1980'de Dünya Boks Birliği hafif ağır sıklet unvanını kazandı, 1981'de Michael Spinks'e kaybetti, 1988'de emekli oldu, dünya şampiyonları için antrenörlük yaptı ve 2003'te profesyonel bir boksörler birliği kurdu."
  id: "Mantan petinju dan pelatih tinju Amerika, lahir dengan nama Edward Gregory di Brooklyn pada tahun 1952. Ia memenangkan New York Golden Gloves dua kali dengan nama lahirnya, lalu memenangkan gelar World Boxing Association kelas berat ringan pada tahun 1980, kehilangan gelar tersebut dari Michael Spinks pada tahun 1981, pensiun pada tahun 1988, bekerja sebagai pelatih untuk juara dunia, dan mendirikan sindikat petinju profesional pada tahun 2003."
