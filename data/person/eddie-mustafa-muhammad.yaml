summary:
  ar: "ملاكم أمريكي سابق ومدرب ملاكمة، وُلد باسم إدوارد غريغوري في بروكلين سنة 1952. فاز ببطولة نيويورك غولدن غلوفز مرتين باسم ميلاده، ثم أحرز لقب رابطة الملاكمة العالمية لوزن خفيف الثقيل سنة 1980، وفقد اللقب أمام مايكل سبينكس سنة 1981، واعتزل سنة 1988، فعمل مدرباً لأبطال عالميين وأسس نقابة للملاكمين المحترفين سنة 2003."
  en: "American former boxer and boxing trainer, born Edward Gregory in Brooklyn in 1952. He won two New York Golden Gloves titles under his birth name, took the WBA light heavyweight title in 1980, lost it to Michael Spinks in 1981, retired in 1988, and went on to train world champions and to found a union for professional boxers in 2003."
  ur: "امریکی سابق باکسر اور باکسنگ ٹرینر، 1952 میں بروکلن میں ایڈورڈ گریگری کے نام سے پیدا ہوئے۔ انہوں نے اپنے پیدائشی نام سے دو بار نیویارک گولڈن گلووز جیتا، 1980 میں ڈبلیو بی اے لائٹ ہیوی ویٹ ٹائٹل حاصل کیا، 1981 میں مائیکل سپنکس سے ٹائٹل کھویا، 1988 میں ریٹائر ہوئے، اور بعد میں عالمی چیمپئنز کے ٹرینر اور 2003 میں پیشہ ور باکسرز کی یونین کے بانی بنے۔"
