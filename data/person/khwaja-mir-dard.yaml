summary:
  ar: "خواجة مير درد (1720 أو 1721 – 1785)، شاعر أردي وصوفي من دلهي، وأحد أركان الشعر الكلاسيكي الأردي مع مير وسودا، يُلقَّب بإمام الشعر الصوفي الأردي. هو ابن الشاعر الفارسي محمد ناصر عندليب. كتب بالأردية والفارسية، ومن آثاره في التصوف «علم الكتاب»، وغلب على غزله الوجد والحنين، ومنه بيته المشهور في وداع الدنيا. توفي في دلهي."
  en: "Khwaja Mir Dard (1720 or 1721 – 1785) was an Urdu poet and Sufi of Delhi, one of the pillars of classical Urdu poetry alongside Mir and Sauda, and is called the imam of Sufi poetry in Urdu. He was a son of the Persian poet Muhammad Nasir Andalib. He wrote in Urdu and Persian; his Ilm-ul-Kitab is a treatise on the Sufi path, and his ghazals are marked by longing, among them his famous couplet of farewell to the world. He died at Delhi."
  ur: "خواجہ میر درد (1720ء یا 1721ء – 1785ء) دہلی کے اردو شاعر اور صوفی تھے، میر اور سودا کے ساتھ کلاسیکی اردو شاعری کے ستونوں میں سے ایک، اور اردو میں صوفیانہ شاعری کے امام کہلاتے ہیں۔ وہ فارسی شاعر محمد ناصر عندلیب کے فرزند تھے۔ انھوں نے اردو و فارسی میں لکھا؛ ان کی ”علم الکتاب“ تصوف کی کتاب ہے، اور ان کی غزلوں میں اشتیاق نمایاں ہے، جن میں دنیا سے رخصتی کا مشہور شعر بھی ہے۔ ان کا انتقال دہلی میں ہوا۔"

