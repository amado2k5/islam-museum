summary:
  ar: "الحافظ الجوّال محدث الشام ومفيده؛ سمع بالحجاز ومصر والشام والعراق وأصبهان وخراسان والجزيرة فأكثر وجمع فأوعى، وأول طلبه سنة اثنتين وخمسمائة، وأقدم شيوخه عين الشمس الثقفية ومنصور الفراوي؛ أقام بمسجد فلوس بدمشق زماناً طويلاً وتوجه إلى حلب فأدركه أجله بحماة، وهو والد الشيخ علم الدين البرزالي {cite:shadharat-dhahab p. 190}."
  en: "al-Zaki al-Barzali (d. Ramadan 636, Hama) — 'muhaddith al-Sham wa-mufiduhu', the Sevillan who began his rihla in 512 and heard from Isfahan to the Jazira; father of Alam al-Din al-Barzali {cite:shadharat-dhahab p. 190}."
  fr: "al-Zaki al-Barzali (d ramadan 636, Hama) - 'muhaddith al-Sham wa-mufiduhu', le sévillan qui a commencé sa rihla en 512 et a entendu d'Ispahan à la Jazira ; père d'Alam al-Din al-Barzali {cite:shadharat-dhahab p. 190}."
  es: "al-Zaki al-Barzali (m. Ramadán 636, Hama) - 'muhaddith al-Sham wa-mufiduhu', el sevillano que comenzó su rihla en 512 y escuchó desde Isfahán hasta la Jazira; padre de Alam al-Din al-Barzali {cita: shadharat-dhahab p. 190}."
  ur: "الزکی البرزالی ⁦(متوفی رمضان 636، حما)⁩ - 'محدث الشام و مفضد'، وہ سیولین جس نے 512 میں اپنا رحلہ شروع کیا اور اصفہان سے جزیرہ تک سنا؛ والد عالم الدین البرزالی 190}۔"
  tr: "Şem'in gezici hadis âlimi ve Mufidiyah; Hicaz, Mısır, Şam, Irak, İsfahan, Horasan, Cezire ve daha fazlasından dinledi, toplandı ve daha fazla bilinç kazandı. İlk öğrencisi 502 Hicri yılındaydı. En erken öğretmenleri Eyn el-Şems el-Tekafiye ve Mansur el-Feraviydi. Uzun süre Şam'daki Falus Camii'nde yaşadı ve Halep'e giderek orada kaderini Hama'da buldu. Şeyh Alemdin el-Barzali'nin babasıydı {cite:shadharat-dhahab, s. 190}."
  id: "Ulama hadis keliling dan Mufidiyah al-Sham; ia mendengar dari Hijaz, Mesir, Levant, Irak, Isfahan, Khorasan, dan Jazira dan lainnya, dan ia berkumpul serta menjadi lebih sadar. Murid pertamanya adalah pada tahun 502 H. Guru pertamanya adalah Ain al-Shams al-Thaqafiyyah dan Mansur al-Farawi. Ia tinggal lama di Masjid Falus di Damaskus dan menuju Aleppo, di mana ia menemui takdirnya di Hama. Ia adalah ayah dari Sheikh Alam al-Din al-Barzali {cite:shadharat-dhahab, hlm. 190}."
