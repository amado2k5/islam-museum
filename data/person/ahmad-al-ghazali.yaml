summary:
  ar: "أخو أبي حامد الغزالي صاحب الإحياء، اختصر كتابه وسماه لباب الإحياء، وتوفي سنة عشرين وخمس مئة {cite:kashf-zunun-furqan p. 198}. وعظ مرة عند السلطان محمود فأعطي ألف دينار وكان فقيهاً غلب عليه الوعظ وميل إلى الانقطاع والعزلة درس بالنظامية ببغداد لما تركها أخوه زهداً فيها واختصر الإحياء في مجلد سماه لباب الإحياء وله الذخيرة في علم البصيرة، توفي بقزوين سنة عشرين وخمس مئة {cite:shadharat-dhahab p. 540-541}."
  en: "Abu Hamid al-Ghazali's brother, who abridged the Ihya' as Lubab al-ihya'; he died in 520 {cite:kashf-zunun-furqan p. 198}."
  fr: "Frère d'Abu Hamid al-Ghazali, qui abrégea l'Ihya' sous le titre Lubab al-ihya' ; mort en 520 H {cite:kashf-zunun-furqan p. 198}."
  es: "el hermano de Abu Hamid al-Ghazali, quien resumió el Ihya' como Lubab al-ihya'; murió en 520 {citar:kashf-zunun-furqan p. 198}."
  ur: "ابو حامد الغزالی کے بھائی، جنہوں نے احیا کو لباب الاحیا کہا؛ ان کی وفات 520ھ میں ہوئی۔ 198}۔"
  tr: "İhya’ adlı eserin yazarı Ebu Hamid el-Gazali’nin kardeşi, kitabını kısaltarak Lubab el-İhya’ adını vermiş ve Hicri 520 yılında vefat etmiştir. {kaynak:kashf-zunun-furqan s. 198}. Bir keresinde Sultan Mahmud’un huzurunda vaaz vermiş ve bin dinar hediye almıştır. Vaaz vermeye meyilli, inzivaya ve yalnızlığa meyilli bir hukukçu idi. Kardeşi zühd nedeniyle ayrıldıktan sonra Bağdat’taki Nizamiyye Medresesi’nde ders vermiştir. İhya’yı Lubab el-İhya’ adını verdiği bir ciltte özetlemiş ve ilim konusunda bir hazineye sahiptir. Hicri 520 yılında Kazvin’de vefat etmiştir. {kaynak:shadharat-dhahab s. 540-541}."
  id: "Saudara laki-laki Abu Hamid al-Ghazali, penulis kitab Ihya’, meringkas kitabnya dan menamakannya Lubab al-Ihya’, dan meninggal pada tahun 520 H {cite:kashf-zunun-furqan hlm. 198}. Ia pernah berdakwah di hadapan Sultan Mahmud dan diberi seribu dinar. Ia adalah seorang ahli hukum yang didominasi oleh dakwah dan cenderung menyendiri dan mengasingkan diri. Ia mengajar di Madrasah Nizamiyya di Baghdad setelah saudaranya meninggalkannya karena asketisme. Ia meringkas Ihya’ dalam sebuah jilid yang ia namai Lubab al-Ihya’, dan ia memiliki khazanah ilmu wawasan. Ia meninggal di Qazvin pada tahun 520 H {cite:shadharat-dhahab hlm. 540-541}."
