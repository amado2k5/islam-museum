roles: [scholar, qadi]
gender: male
summary:
  ar: "محمد بن عمر بن محمد بن عمر بن أبي بكر، أبو بكر، جلال الدين، المعروف في الأعلام بابن النصيبي، قاض من فقهاء الشافعية من أهل حلب، ولد بها سنة 851 هـ ونشأ بالقاهرة وناب في القضاء بالقاهرة ودمشق وحلب، له الإبهاج في فقه الشافعية، توفي سنة 916 هـ، ويفهرس الزركلي اسمه أيضا في ابن هبة الله الشافعي."
  en: "Muhammad ibn Umar ibn Muhammad ibn Umar ibn Abi Bakr, Abu Bakr, Jalal al-Din, entered in al-A'lam as Ibn al-Nusaybi, a judge and Shafi'i jurist of Aleppo, born there in 851 AH, raised in Cairo, deputy judge in Cairo, Damascus and Aleppo; author of al-Ibhaj on Shafi'i law; died 916 AH (1510); al-Zirikli's index also lists him under Ibn Hibatullah the Shafi'i."
  es: "Muhammad ibn Umar ibn Muhammad ibn Umar ibn Abi Bakr, Abu Bakr, Jalal al-Din, registrado en al-A'lam como Ibn al-Nusaybi, juez y jurista shafi'í de Alepo, nacido allí en 851 AH, criado en El Cairo, juez adjunto en El Cairo, Damasco y Alepo; autor de al-Ibhaj sobre la ley shafi'í; murió en 916 AH (1510); el índice de al-Zirikli también lo incluye bajo Ibn Hibatullah el shafi'í."
