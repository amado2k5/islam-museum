id: person/al-qadir-billah
class: person
label: { ar: "القادر بالله أحمد بن إسحاق بن المقتدر", en: "al-Qadir bi-llah Ahmad ibn Ishaq ibn al-Muqtadir" }
summary:
  ar: "خليفة عباسي [٣٨١–٤٢٢هـ]، أبو العباس أحمد بن إسحاق بن المقتدر، ولد سنة ست وثلاثين وأمه أمة اسمها تمنى وقيل دمنة، بويع بعد خلع الطائع وكان غائباً فقدم في عاشر رمضان وجلس من الغد جلوساً عاماً وهنيء وأنشد بين يديه الشريف الرضي، وقال الخطيب كان من الديانة والسيادة وإدامة التهجد وكثرة الصدقات تفقه على أبي بشر الهروي الشافعي وصنف كتاباً في الأصول ذكر فيه فضائل الصحابة وإكفار المعتزلة والقائلين بخلق القرآن وكان يقرأ كل جمعة في حلقة أصحاب الحديث بجامع المهدي، وفي شوال من سنة ولايته عقد مجلساً عظيماً وحلف هو وبهاء الدولة كل منهما لصاحبه بالوفاء وقلده ما وراء بابه مما تقام فيه الدعوة {cite:tarikh-khulafa-minhaj-1434 p. 634}، وتوفي ليلة الاثنين الحادي عشر من ذي الحجة سنة اثنتين وعشرين وأربع مئة عن سبع وثمانين سنة ومدة خلافته إحدى وأربعون سنة وثلاثة أشهر {cite:tarikh-khulafa-minhaj-1434 p. 639}. وعند ابن الجوزي مات ليلة الاثنين حادي عشر ذي الحجة ٤٢٢ عن ست وثمانين سنة وعشرة أشهر وإحدى وعشرين يومًا، وخلافته إحدى وأربعون سنة وثلاثة أشهر لم يبلغها خليفة قبله، وصلى على جنازته ابنه القائم، ونُقل نعشه إلى تربة الرصافة سنة ٤٢٣ {cite:muntazam-ibn-al-jawzi j.8 p.399-402} {cite:muntazam-ibn-al-jawzi j.8 p.410}. وعند ابن الأثير أنه لما بلغته أبيات الشريف الرضي في إثبات نسب المهدي المصري أحضر القاضي أبا بكر بن الباقلاني فأرسله إلى الشريف أبي أحمد الموسوي والد الرضي يطلب الاعتذار عنها {cite:kamil-ibn-al-athir p. 19}. وفي سنة إحدى وتسعين جلس القادر للحاج الخراسانية وأعلمهم أنه جعل ابنه أبا الفضل ولي عهده ولقبه الغالب بالله وكان له يومئذ ثماني سنين وأربعة أشهر وأيام {cite:muntazam-ibn-al-jawzi j.7 p.215}، وفي سنة تسعين كتب إلى والي جيلان عهداً بالصلاة والخطابة والقضاء والحكم يوصيه فيه بتقوى الله ومراعاة مواقيت الصلاة والإحسان في الموعظة وتفقد الأيتام وتعهد الوقوف {cite:muntazam-ibn-al-jawzi j.7 p.208-209}. وفي سنة اثنتين وأربعمائة أُنشئ في ديوان خلافته المحضر الشهير في الطعن في نسب الفاطميين وأمضاه كبار الأشراف والقضاة والفقهاء، وفي سنة ثمان وأربعمائة استتاب فقهاء المعتزلة الحنفية وقطع مناظراتهم وألزم السلطان محموداً بإمضائه في خراسان، وفي سنة تسع وأربعمائة أُعلن في موكبه الاعتقاد القادري {cite:muntazam-ibn-al-jawzi j.7 p.255,288,289}."
  en: "Abbasid caliph [381–422], Abu'l-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, born 336; hailed after al-Ta'i's deposition, arriving 10 Ramadan. Al-Khatib: famed for piety and night-prayer, he studied fiqh under Abu Bishr al-Harawi and wrote an usul book — Companions' virtues and takfir of the Mu'tazila — read every Friday at al-Mahdi's mosque; in Shawwal he and Baha' al-Dawla swore mutual fidelity, the caliph granting him all beyond his gate {cite:tarikh-khulafa-minhaj-1434 p. 634}."
