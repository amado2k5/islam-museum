class: person
label: { ar: "القادر بالله أحمد بن إسحاق بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٨١–٤٢٢هـ]، أبو العباس أحمد بن إسحاق بن المقتدر، ولد سنة ست وثلاثين وأمه أمة اسمها تمنى وقيل دمنة، بويع بعد خلع الطائع وكان غائباً فقدم في عاشر رمضان وجلس من الغد جلوساً عاماً وهنيء وأنشد بين يديه الشريف الرضي، وقال الخطيب كان من الديانة والسيادة وإدامة التهجد وكثرة الصدقات تفقه على أبي بشر الهروي الشافعي وصنف كتاباً في الأصول ذكر فيه فضائل الصحابة وإكفار المعتزلة والقائلين بخلق القرآن وكان يقرأ كل جمعة في حلقة أصحاب الحديث بجامع المهدي، وفي شوال من سنة ولايته عقد مجلساً عظيماً وحلف هو وبهاء الدولة كل منهما لصاحبه بالوفاء وقلده ما وراء بابه مما تقام فيه الدعوة {cite:tarikh-khulafa-minhaj-1434 p. 634}، وتوفي ليلة الاثنين الحادي عشر من ذي الحجة سنة اثنتين وعشرين وأربع مئة عن سبع وثمانين سنة ومدة خلافته إحدى وأربعون سنة وثلاثة أشهر {cite:tarikh-khulafa-minhaj-1434 p. 639}."
  en: "Abbasid caliph [381–422], Abu'l-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, born 336; hailed after al-Ta'i's deposition, arriving 10 Ramadan. Al-Khatib: famed for piety and night-prayer, he studied fiqh under Abu Bishr al-Harawi and wrote an usul book — Companions' virtues and takfir of the Mu'tazila — read every Friday at al-Mahdi's mosque; in Shawwal he and Baha' al-Dawla swore mutual fidelity, the caliph granting him all beyond his gate {cite:tarikh-khulafa-minhaj-1434 p. 634}."
