id: person/al-qadir-billah
class: person
label: { ar: "القادر بالله أحمد بن إسحاق بن المقتدر", en: "al-Qadir bi-llah Ahmad ibn Ishaq ibn al-Muqtadir", fr: "al-Qadir bi-llah Ahmad ibn Ishaq ibn al-Muqtadir" , ur: "القادر باللہ احمد بن اسحاق", es: "al-Qadir bi-llah Ahmad ibn Ishaq ibn al-Muqtadir"}
summary:
  ar: "خليفة عباسي [٣٨١–٤٢٢هـ]، أبو العباس أحمد بن إسحاق بن المقتدر، ولد سنة ست وثلاثين وأمه أمة اسمها تمنى وقيل دمنة، بويع بعد خلع الطائع وكان غائباً فقدم في عاشر رمضان وجلس من الغد جلوساً عاماً وهنيء وأنشد بين يديه الشريف الرضي، وقال الخطيب كان من الديانة والسيادة وإدامة التهجد وكثرة الصدقات تفقه على أبي بشر الهروي الشافعي وصنف كتاباً في الأصول ذكر فيه فضائل الصحابة وإكفار المعتزلة والقائلين بخلق القرآن وكان يقرأ كل جمعة في حلقة أصحاب الحديث بجامع المهدي، وفي شوال من سنة ولايته عقد مجلساً عظيماً وحلف هو وبهاء الدولة كل منهما لصاحبه بالوفاء وقلده ما وراء بابه مما تقام فيه الدعوة {cite:tarikh-khulafa-minhaj-1434 p. 634}، وتوفي ليلة الاثنين الحادي عشر من ذي الحجة سنة اثنتين وعشرين وأربع مئة عن سبع وثمانين سنة ومدة خلافته إحدى وأربعون سنة وثلاثة أشهر {cite:tarikh-khulafa-minhaj-1434 p. 639}. وعند ابن الجوزي مات ليلة الاثنين حادي عشر ذي الحجة ٤٢٢ عن ست وثمانين سنة وعشرة أشهر وإحدى وعشرين يومًا، وخلافته إحدى وأربعون سنة وثلاثة أشهر لم يبلغها خليفة قبله، وصلى على جنازته ابنه القائم، ونُقل نعشه إلى تربة الرصافة سنة ٤٢٣ {cite:muntazam-ibn-al-jawzi j.8 p.399-402} {cite:muntazam-ibn-al-jawzi j.8 p.410}. وعند ابن الأثير أنه لما بلغته أبيات الشريف الرضي في إثبات نسب المهدي المصري أحضر القاضي أبا بكر بن الباقلاني فأرسله إلى الشريف أبي أحمد الموسوي والد الرضي يطلب الاعتذار عنها {cite:kamil-ibn-al-athir p. 19}. وفي سنة إحدى وتسعين جلس القادر للحاج الخراسانية وأعلمهم أنه جعل ابنه أبا الفضل ولي عهده ولقبه الغالب بالله وكان له يومئذ ثماني سنين وأربعة أشهر وأيام {cite:muntazam-ibn-al-jawzi j.7 p.215}، وفي سنة تسعين كتب إلى والي جيلان عهداً بالصلاة والخطابة والقضاء والحكم يوصيه فيه بتقوى الله ومراعاة مواقيت الصلاة والإحسان في الموعظة وتفقد الأيتام وتعهد الوقوف {cite:muntazam-ibn-al-jawzi j.7 p.208-209}. وفي سنة اثنتين وأربعمائة أُنشئ في ديوان خلافته المحضر الشهير في الطعن في نسب الفاطميين وأمضاه كبار الأشراف والقضاة والفقهاء، وفي سنة ثمان وأربعمائة استتاب فقهاء المعتزلة الحنفية وقطع مناظراتهم وألزم السلطان محموداً بإمضائه في خراسان، وفي سنة تسع وأربعمائة أُعلن في موكبه الاعتقاد القادري {cite:muntazam-ibn-al-jawzi j.7 p.255,288,289}."
  en: "Abbasid caliph [381–422], Abu'l-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, born 336; hailed after al-Ta'i's deposition, arriving 10 Ramadan. Al-Khatib: famed for piety and night-prayer, he studied fiqh under Abu Bishr al-Harawi and wrote an usul book — Companions' virtues and takfir of the Mu'tazila — read every Friday at al-Mahdi's mosque; in Shawwal he and Baha' al-Dawla swore mutual fidelity, the caliph granting him all beyond his gate {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  fr: "Le calife abbasside [381-422], Abu'l-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, né en 336  ; salué après la déposition d'al-Ta'i, arrivant le 10 Ramadan. Al-Khatib  : célèbre pour sa piété et sa prière nocturne, il a étudié le fiqh sous Abou Bishr al-Harawi et a écrit un livre usul – les vertus des compagnons et le takfir du Mu’tazila – lu tous les vendredis à la mosquée al-Mahdi  ; à Shawwal, lui et Baha' al-Dawla juraient fidélité mutuelle, le calife lui accordant tout au-delà de sa porte {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  ur: "عباسی خلیفہ، جن کا عہد 381–422ھ تھا۔ سیوطی کے بیان میں وہ ابو بشر ہروی کے شاگرد تھے اور انہوں نے اصول پر ایک کتاب لکھی جو جامع مہدی میں پڑھی جاتی تھی۔ {cite:tarikh-khulafa-minhaj-1434 p. 634}"
  es: "Califa abasí [381–422], Abu'l-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, nacido en 336; aclamado después de la deposición de al-Ta'i, llegó el 10 de Ramadán. Al-Khatib: famoso por su piedad y oración nocturna, estudió fiqh con Abu Bishr al-Harawi y escribió un libro de usul — Virtudes de los Compañeros y takfir de los Mu'tazila — que se leía todos los viernes en la mezquita de al-Mahdi; en Shawwal él y Baha' al-Dawla juraron fidelidad mutua, y el califa le concedió todo más allá de su puerta {cite:tarikh-khulafa-minhaj-1434 p. 634}."
  tr: "Bir Abbasi halifesi [381–422 H.C), Ebu el-Abbas Ahmed bin İshaq ibn al-Muqtadir, 36 Hicri yılında doğdu. Annesi Tamna adında bir kadındı, bazılarına göre Demnah. El-Taya'nın tahttan indirilmesinden sonra bağlılık yemini etti ve yoktu, bu yüzden Ramazan'ın onuncusunda geldi, genel bir toplantıda oturdu ve önünde soylu Radi'yi okuyarak onu tebrik etti. Vaiz, onun dindar, lider, gece namazlarını kılan ve bol sadakat veren biri olduğunu söyledi. Ebu Bişr el-Haravi el-Şafii'den fıkıh eğitimi aldı ve sahabelerin erdemlerini, Mu'tazilcilerin, Kur'an'ı yarattığını iddia edenlerin inançsızlıklarını anlattığı bir kitap yazdı ve hepsini okuduğunu söyledi Cuma günü El-Mehdi Camii'nde Hadis Sahabeleri çemberinde. Saltanat yılının Şevval'inde, kendisi ve Baha'd-Devla ile birlikte sahabelerine bağlılık yemini ettiler ve çağrıyla ilgili kapısının ötesindeki her şeyi ona emanet ettiler {cite:History-Khulafa-minhaj-1434 s. 634}. Zula-Hicce ayının on birinci Pazartesi gecesi, seksen yedi yaşında, kırk bir yıl üç ay süren bir süre içinde vefat etti {atıf:Tarikh-Khulafa-minhaj-1434, s. 639}. İbn al-Jawzi'ye göre, Dhu al-Hicjah 422'nin on birinci Pazartesi gecesi, seksen altı yıl, on ay yirmi bir gün yaşında öldü ve halifeliği kırk bir yıl üç ay sürdü; kendisinden önceki hiçbir halife bu döneme ulaşmamıştı. Oğlu el-Kaim onun için cenaze namazını yaptı ve tabutu 423 yılında Rusafa toprağına nakledildi {alıntı:Muntazam-ibn-al-jawzi J.8 s.402} {atıf:Muntazam-ibn-al-Jawzi J.8 s.410}. İbn al-Athir'e göre, el-Şerif el-Radi'nin Mısır Mehdi'sinin soyunu onaylayan ayetlerini duyduğunda, yargıç Ebu Bekir bin el-Bakillani'yi çağırdı ve onu el-Radi'nin babası olan el-Şerif Ebu Ahmed el-Musivi'ye gönderdi ve onun için özür dilemesini istedi {atıf:kamil-ibn-al-athir s. 19}. Doksan birinci yılda, El-Kadir Horasaniye hacıyla oturdu ve oğlu Ebu el-Fadl'ı veliaht prens olarak atadığını ve ona Al-Ghalib Billah unvanını verdiğini bildirdi. O zamanlar sekiz yıl, dört ay ve gündü {atıf:Muntazam-ibn-al-Jawzi j.7 s.215}. Doksan yılında, Jilan valisine dua, vaaz, yargı ve yönetim yemini yazdı; ona Allah'tan korkmasını, namaz vakitlerine uymasını, iyi öğütler yapmasını, yetimleri kontrol etmesini ve ayakta durmasını öğütledi {cite:Muntazam-ibn-al-Jawzi j.7 s.208-209}. Dört yüz yirmi iki yılında, halifelik mahkemesinde Fatımilerin soyunu sorgulayan ünlü kayıt, önde gelen soylular, yargıçlar ve hukukçular tarafından imzalanmıştır. Dört yüz sekizinci yılda, Hanefi Mu'tazili hukukçularının görüşünü aradı, tartışmalarını durdurdu ve Sultan Mahmud'u Horasan'da imzalamaya zorladı. Dört yüz dokuzuncu yılda, alayında Kadiri inancını {atıf:Muntazam-ibn-al-jawzi J.7 s.255,288,289} ilan etti."
  id: "Seorang khalifah Abbasiyah [381–422 H], Abu al-Abbas Ahmad ibn Ishaq ibn al-Muqtadir, lahir pada tahun 36 H. Ibunya adalah seorang wanita bernama Tamna, atau beberapa orang mengatakan Demnah. Ia bersumpah setia setelah penggulingan al-Taya' dan tidak hadir, sehingga ia tiba pada tanggal sepuluh Ramadan dan duduk dalam pertemuan umum serta mengucapkan selamat kepadanya, membacakan Radi yang mulia di hadapannya. Pengkhotbah mengatakan ia beragama, memimpin, memelihara salat malam, dan memberikan banyak amal. Ia belajar hukum di bawah bimbingan Abu Bishr al-Harawi al-Shafi'i, dan menulis sebuah buku tentang prinsip-prinsip yang menyebutkan kebajikan para sahabat, ketidakpercayaan Mu'tazil, mereka yang mengklaim menciptakan Al-Qur'an, dan ia biasa membaca semuanya Jumat di lingkaran Para Sahabat Hadis di Masjid Al-Mahdi. Pada Shwal tahun pemerintahannya, ia mengadakan dewan besar di mana ia dan Baha' al-Dawla bersumpah setia kepada sahabat mereka dan mempercayakan segala sesuatu di luar pintunya terkait panggilan {cite:History-Khulafa-minhaj-1434 hlm. 634}. Ia meninggal pada malam Senin, tanggal sebelas Dhu al-Hijjah, tahun empat ratus dua puluh dua pada usia delapan puluh tujuh tahun, dengan masa jabatan empat puluh satu tahun tiga bulan {cite:Tarikh-Khulafa-minhaj-1434, hlm. 639}. Menurut Ibn al-Jawzi, ia meninggal pada malam Senin, tanggal sebelas Dhu al-Hijjah 422, pada usia delapan puluh enam tahun, sepuluh bulan, dan dua puluh satu hari, dan kekhalifahannya berlangsung selama empat puluh satu tahun tiga bulan, yang belum pernah dicapai oleh khalifah sebelumnya. Putranya al-Qa'im memimpin doa pemakaman untuknya, dan peti matinya dipindahkan ke tanah Rusafa pada tahun 423 {cite:Muntazam-ibn-al-jawzi J.8 hlm.402} {cite:Muntazam-ibn-al-Jawzi J.8 hlm.410}. Menurut Ibn al-Athir, ketika ia mendengar ayat-ayat al-Sharif al-Radi yang menegaskan garis keturunan Mahdi Mesir, ia memanggil hakim Abu Bakr ibn al-Baqillani dan mengirimnya kepada al-Sharif Abu Ahmad al-Mousawi, ayah al-Radi, meminta permintaan maaf atas kepribadiannya {cite:kamil-ibn-al-athir hlm. 19}. Pada tahun sembilan puluh satu, Al-Qadir duduk bersama peziarah Khorasaniyah dan memberitahu mereka bahwa ia telah mengangkat putranya Abu al-Fadl sebagai putra mahkota dan memberinya gelar Al-Ghalib Billah. Pada saat itu, ia berusia delapan tahun, empat bulan, dan hari {cite:muntazam-ibn-al-jawzi j.7 hlm.215}. Pada tahun sembilan puluh, ia menulis kepada gubernur Jilan sebuah janji doa, khotbah, pengadilan, dan pemerintahan, menasihatinya untuk takut kepada Tuhan, mematuhi waktu shalat, berbuat baik dalam meningat, menjaga anak yatim, dan berkomitmen untuk berdiri {cite:muntazam-ibn-al-jawzi j.7 hlm.208-209}. Pada tahun empat ratus dua puluh dua, catatan terkenal dicatat di pengadilan kekhalifahannya yang menantang garis keturunan Fatimiyah, ditandatangani oleh bangsawan, hakim, dan ahli hukum terkemuka. Pada tahun empat ratus delapan, ia mencari nada para ahli hukum Mu'tazilite Hanafi, menghentikan perdebatan mereka, dan memaksa Sultan Mahmoud menandatanganinya di Khorasan. Pada tahun empat ratus sembilan, ia menyatakan kredo Qadiri {cite:Muntazam-ibn-al-jawzi J.7 hlm.255,288,289} dalam prosesinya."
