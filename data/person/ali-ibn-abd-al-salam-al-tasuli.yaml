summary:
  ar: 'علي بن عبد السلام، أبو الحسن، التسولي المالكي، فقيه، توفي سنة 1258ه بحسب ما
    ذكر المدخل. من تصانيفه: البهجة في شرح التحفة في فروع الفقه المالكي، وحاشية على
    الزقاقية، وشرح الشامل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7514} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7515} '
  en: 'Ali ibn Abd al-Salam, Abu al-Hasan al-Tasuli, a Maliki jurist; the entry gives
    his death as 1258 AH. His works include al-Bahja, a commentary on the Tuhfa in
    Maliki furu'', a gloss on al-Zaqaqiya, and a commentary on al-Shamil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7514} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7515} '
  ur: 'علی بن عبد السلام ابوالحسن تسولی مالکی فقیہ؛ مدخل کے مطابق وفات 1258 ہجری ہے۔
    تصانیف میں «البہجۃ فی شرح التحفۃ» فروع مالکی پر، «الزقاقیہ» پر حاشیہ، اور «شرح
    الشامل» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7514} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
