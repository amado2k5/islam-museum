summary:
  ar: "جارية المتوكل، كانت شاعرة عالمة بصنوف العلم عوادة، فلما قتل ضمت إلى بغا الكبير فأمر بها للمنادمة فاعتذرت فأقسم عليها فغنت ارتجالاً أي عيش يلذ لي لا أرى فيه جعفرا ملك قد رأيته في نجيع معفرا فبكى بغا حتى غشي عليه وأمر بتخييرها {cite:tarikh-khulafa-minhaj-1434 p. 544}."
  en: "Al-Mutawakkil's concubine — poet, scholar of all sciences, lute-player; after his murder she passed to Bugha the Elder, who forced her to sing — she improvised 'what life delights me without Ja'far, a king I saw strewn in his blood?' until Bugha wept himself faint and gave her the choice {cite:tarikh-khulafa-minhaj-1434 p. 544}."
