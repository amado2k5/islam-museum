id: person/mahbuba
class: person
label: { ar: "محبوبة وصيفة المتوكل" }
summary:
  ar: "جارية المتوكل، كانت شاعرة عالمة بصنوف العلم عوادة، فلما قتل ضمت إلى بغا الكبير فأمر بها للمنادمة فاعتذرت فأقسم عليها فغنت ارتجالاً أي عيش يلذ لي لا أرى فيه جعفرا ملك قد رأيته في نجيع معفرا فبكى بغا حتى غشي عليه وأمر بتخييرها {cite:tarikh-khulafa-minhaj-1434 p. 544} وعند السيوطي نشأت بالطائف وتعلمت الأدب وروت الأشعار وأغري بها المتوكل ثم غضب عليها ومنع جواري القصر من كلامها فرآها في منامه كأنه صالحها فوجدها تضرب بالعود وتنشد هل شفيع لنا إلى ملك قد زارني في الكرى فصالحني فصالحها وردها إلى مرتبتها {cite:tarikh-khulafa-minhaj-1434 p. 548-549}.، وعند المسعودي صاغت لحناً وغنته وكاتبة في الخد بالمسك جعفراً، وغنت لما غاضبها أدور في القصر لا أرى أحداً أشكو إليه حتى سمعها فصالحها {cite:muruj-al-dhahab p. 510-511}"
  en: "Al-Mutawakkil's concubine — poet, scholar of all sciences, lute-player; after his murder she passed to Bugha the Elder, who forced her to sing — she improvised 'what life delights me without Ja'far, a king I saw strewn in his blood?' until Bugha wept himself faint and gave her the choice {cite:tarikh-khulafa-minhaj-1434 p. 544}."
