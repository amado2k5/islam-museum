summary:
  ar: "مقاتل فنون قتالية مختلطة روسي محترف (وُلد سنة 1991 في محج قلعة بداغستان، من عرقية اللاك). بطل العالم في سامبو القتال سنة 2016، تدرّب على يد عبد المناف نورمحمدوف، وحمل بطولة يو إف سي للوزن الخفيف من أكتوبر 2022 بأربع دفاعات ناجحة، وهو رقم قياسي في فئته، ثم فاز ببطولة يو إف سي للوزن الوسط في نوفمبر 2025 ودافع عنها سنة 2026، ويحمل أطول سلسلة انتصارات في تاريخ يو إف سي (17 فوزا متتاليا)."
  en: "Russian professional mixed martial artist (born 1991 in Makhachkala, Dagestan, an ethnic Lak). The 2016 world combat sambo champion, trained under Abdulmanap Nurmagomedov, he held the UFC lightweight championship from October 2022 with a division-record four successful defences, then won the UFC welterweight championship in November 2025 and defended it in 2026; he holds the longest winning streak in UFC history, at 17."
  ur: "روسی پیشہ ور مخلوط مارشل آرٹسٹ (پیدائش 1991، ماخاچکالا، داغستان، لک قومیت سے تعلق)۔ 2016 کے عالمی کمبیٹ سامبو چیمپئن، عبدالماناپ نورماگومیدوف کے شاگرد، انہوں نے اکتوبر 2022 سے یو ایف سی لائٹ ویٹ چیمپئن شپ رکھی جس کا اپنی کیٹیگری میں ریکارڈ چار بار کامیاب دفاع کیا، پھر نومبر 2025 میں یو ایف سی ویلٹر ویٹ چیمپئن شپ جیتی اور 2026 میں اس کا دفاع کیا؛ یو ایف سی کی تاریخ کی طویل ترین جیت کی لڑی (17) انہی کے نام ہے۔"
