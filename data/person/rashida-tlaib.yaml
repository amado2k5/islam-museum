summary:
  ar: "محامية وسياسية أمريكية من الحزب الديمقراطي، وُلدت في ديترويت سنة 1976 أكبرَ أبناء أبوين فلسطينيين مهاجرين من الطبقة العاملة، وكانت سنة 2008 أول مسلمة تُنتخب لمجلس نواب ميشيغان، ثم انتُخبت سنة 2018 لمجلس النواب الأمريكي، فكانت أول فلسطينية أمريكية في الكونغرس ومع إلهان عمر أول مسلمتين فيه، وهي عضوة في «الفريق» التقدمي وناقدة حادة لإسرائيل وللمساعدات الأمريكية لها، وقد وبّخها مجلس النواب رسميًا في نوفمبر 2023 بسبب تصريحاتها بعد هجوم 7 أكتوبر."
  en: "American lawyer and Democratic politician, born in Detroit in 1976, the eldest of fourteen children of working-class Palestinian immigrants. In 2008 she became the first Muslim woman elected to the Michigan House; in 2018 she was elected to the U.S. House, becoming the first Palestinian-American woman in Congress and, with Ilhan Omar, one of its first two Muslim women. A member of the progressive 'Squad', she is a sharp critic of Israel and of U.S. aid to it, and was censured by the House in November 2023 over her statements after the October 7 attacks."
  ur: "امریکی وکیل اور ڈیموکریٹ سیاست دان، جو 1976 میں ڈیٹرائٹ میں محنت کش فلسطینی مہاجر والدین کے چودہ بچوں میں سب سے بڑی اولاد کے طور پر پیدا ہوئیں۔ 2008 میں وہ مشی گن کے ایوان کے لیے منتخب ہونے والی پہلی مسلم خاتون بنیں، اور 2018 میں امریکی ایوان نمائندگان میں پہلی فلسطینی نژاد امریکی خاتون اور الحان عمر کے ساتھ کانگریس کی پہلی دو مسلم خواتین میں شامل ہوئیں۔"
