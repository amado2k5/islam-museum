summary:
  ar: "محامية وسياسية أمريكية من الحزب الديمقراطي، وُلدت في ديترويت سنة 1976 أكبرَ أبناء أبوين فلسطينيين مهاجرين من الطبقة العاملة، وكانت سنة 2008 أول مسلمة تُنتخب لمجلس نواب ميشيغان، ثم انتُخبت سنة 2018 لمجلس النواب الأمريكي، فكانت أول فلسطينية أمريكية في الكونغرس ومع إلهان عمر أول مسلمتين فيه، وهي عضوة في «الفريق» التقدمي وناقدة حادة لإسرائيل وللمساعدات الأمريكية لها، وقد وبّخها مجلس النواب رسميًا في نوفمبر 2023 بسبب تصريحاتها بعد هجوم 7 أكتوبر."
  en: "American lawyer and Democratic politician, born in Detroit in 1976, the eldest of fourteen children of working-class Palestinian immigrants. In 2008 she became the first Muslim woman elected to the Michigan House; in 2018 she was elected to the U.S. House, becoming the first Palestinian-American woman in Congress and, with Ilhan Omar, one of its first two Muslim women. A member of the progressive 'Squad', she is a sharp critic of Israel and of U.S. aid to it, and was censured by the House in November 2023 over her statements after the October 7 attacks."
  ur: "امریکی وکیل اور ڈیموکریٹ سیاست دان، جو 1976 میں ڈیٹرائٹ میں محنت کش فلسطینی مہاجر والدین کے چودہ بچوں میں سب سے بڑی اولاد کے طور پر پیدا ہوئیں۔ 2008 میں وہ مشی گن کے ایوان کے لیے منتخب ہونے والی پہلی مسلم خاتون بنیں، اور 2018 میں امریکی ایوان نمائندگان میں پہلی فلسطینی نژاد امریکی خاتون اور الحان عمر کے ساتھ کانگریس کی پہلی دو مسلم خواتین میں شامل ہوئیں۔"
  es: "Abogada estadounidense y política demócrata, nacida en Detroit en 1976, la mayor de catorce hijos de inmigrantes palestinos de clase trabajadora. En 2008 se convirtió en la primera mujer musulmana elegida para la Cámara de Representantes de Michigan; en 2018 fue elegida para la Cámara de Representantes de Estados Unidos, convirtiéndose en la primera mujer palestino-estadounidense en el Congreso y, junto con Ilhan Omar, una de las dos primeras mujeres musulmanas en ocupar dicho cargo. Miembro del grupo progresista conocido como \"The Squad\", es una acérrima crítica de Israel y de la ayuda estadounidense a este país, y fue censurada por la Cámara de Representantes en noviembre de 2023 por sus declaraciones tras los atentados del 7 de octubre."
  fr: "Avocate et femme politique démocrate américaine, née à Détroit en 1976, elle est l'aînée d'une famille de quatorze enfants d'immigrants palestiniens issus de la classe ouvrière. En 2008, elle est devenue la première femme musulmane élue à la Chambre des représentants du Michigan; en 2018, elle a été élue à la Chambre des représentants des États-Unis, devenant ainsi la première femme palestino-américaine au Congrès et, avec Ilhan Omar, l'une des deux premières femmes musulmanes à y siéger. Membre du groupe progressiste « The Squad », elle critique vivement Israël et l'aide américaine à ce pays, et a été censurée par la Chambre en novembre 2023 pour ses déclarations après les attentats du 7 octobre."
  tr: "Demokrat Parti'den Amerikalı bir avukat ve politikacı olan Amerikalı, 1976'da Detroit'te doğan işçi sınıfı Filistinli göçmen ebeveynlerin en büyüğünün çocuğu olarak doğmuştur; 2008'de Michigan Temsilciler Meclisi'ne seçilen ilk Müslüman kadın, ardından 2018'de ABD Temsilciler Meclisi'ne seçilmiştir. Kongre'deki ilk Filistinli Amerikalı ve Ilhan Omar ile birlikte Kongre'deki ilk Müslüman kadın olmuştur. İlerici Hareket'in bir üyesi ve İsrail ile ABD yardımlarının keskin bir eleştirmenidir. 7 Ekim saldırılarından sonra yaptığı açıklamalar nedeniyle Kasım 2023'te Temsilciler Meclisi tarafından resmen uyarılmıştır."
  id: "Seorang pengacara dan politisi Amerika dari Partai Demokrat, lahir di Detroit pada tahun 1976 dari anak tertua dari orang tua imigran Palestina kelas pekerja, dia adalah wanita Muslim pertama yang terpilih ke Dewan Perwakilan Michigan pada 2008, kemudian terpilih pada 2018 ke Dewan Perwakilan AS. Dia menjadi warga Palestina Amerika pertama di Kongres dan, bersama Ilhan Omar, wanita Muslim pertama di sana. Dia adalah anggota Gerakan Progresif dan kritikus tajam terhadap Israel dan bantuan AS. Dia secara resmi ditegur oleh Dewan Perwakilan Rakyat pada November 2023 atas pernyataannya setelah serangan 7 Oktober."
