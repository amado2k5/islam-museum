label: { ar: "أبو ركوة الوليد الأموي", en: "Abu Rakwa al-Walid al-Umawi", fr: "Abu Rakwa al-Walid al-Umawi", es: "Abu Rakwa al-Walid al-Umawi", ur: "ابو رقعۃ الولید العموی" }
summary:
  ar: "الوليد المعروف بأبي ركوة، رجل أموي من ولد هشام بن عبد الملك، كني بأبي ركوة لركوة كانت معه في أسفاره على مذهب الصوفية، لقي الشيوخ وكتب الحديث بمصر وانتقل إلى مكة ثم اليمن ثم عاد إلى الشام، وكان يدعو إلى القائم من ولد هشام بن عبد الملك ويأخذ البيعة ممن يجد عنده انقياداً، فنزل الحلة معلماً واجتمع عنده صبيان العرب ثم أعلمهم أنه الإمام الذي يدعو إليه ولقب نفسه الثائر بأمر الله المنتصر من أعداء الله، ودخل برقة فنقش السكة باسمه وخطب ولعن الحاكم، فبعث الحاكم عليه الفضل بن عبد الله فهزمه وسلمته بلاد النوبة بعد أن أوصلوه إليها لعهد زعمه، فحمل إلى مصر فأركبه الحاكم جملاً وشهره ثم قتله {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  en: "Al-Walid, known as Abu Rakwa, a Umayyad of the descendants of Hisham ibn Abd al-Malik. He was given the kunya Abu Rakwa because of a water-flask he carried on his travels, in the manner of the Sufis. He met shaykhs and wrote down hadith in Egypt, then moved to Mecca, then to Yemen, and then returned to Syria. He called for a qa'im from the descendants of Hisham ibn Abd al-Malik and took the pledge from those he found compliant. He settled in al-Hilla as a schoolmaster, and the boys of the Arabs gathered round him; then he told them that he was the imam to whom he had been calling. He styled himself al-Thair bi-amr Allah al-Muntasir min a'da' Allah. He entered Barqa, struck coins in his name, preached, and cursed al-Hakim. Al-Hakim sent al-Fadl ibn Abd Allah against him, and he defeated him; the lands of Nubia then handed him over, after they had brought him there under a covenant he claimed to have. He was taken to Egypt, where al-Hakim had him mounted on a camel and paraded, and then killed him {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  fr: "Al-Walid, connu sous le nom d'Abu Rakwa, Omeyyade descendant de Hisham ibn Abd al-Malik. Il reçut la kunya d'Abu Rakwa à cause d'une gourde qu'il portait dans ses voyages, à la manière des soufis. Il rencontra des shaykhs et écrivit le hadith en Égypte, puis passa à La Mecque, puis au Yémen, puis revint en Syrie. Il appela à un qa'im de la descendance de Hisham ibn Abd al-Malik et prit l'engagement de ceux qu'il trouva dociles. Il s'établit à al-Hilla comme maître d'école, et les garçons des Arabes se rassemblèrent autour de lui ; puis il leur dit qu'il était l'imam auquel il appelait. Il se donna le titre d'al-Thair bi-amr Allah al-Muntasir min a'da' Allah. Il entra à Barqa, frappa monnaie à son nom, prêcha et maudit al-Hakim. Al-Hakim envoya contre lui al-Fadl ibn Abd Allah, qui le vainquit ; les pays de Nubie le livrèrent alors, après l'y avoir conduit sous un pacte qu'il prétendait avoir. Il fut emmené en Égypte, où al-Hakim le fit monter sur un chameau et promener, puis le fit tuer {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  es: "Al-Walid, conocido como Abu Rakwa, era un omeya descendiente de Hisham ibn Abd al-Malik. Recibió el título de kunya Abu Rakwa por una cantimplora que llevaba consigo en sus viajes, al estilo sufí. Se reunió con jeques y transcribió hadices en Egipto, luego se trasladó a La Meca, después a Yemen y finalmente regresó a Siria. Convocó a un qa'im entre los descendientes de Hisham ibn Abd al-Malik y tomó juramento de aquellos que consideró dispuestos. Se estableció en al-Hilla como maestro de escuela, y los jóvenes árabes se reunieron a su alrededor; entonces les dijo que él era el imán al que habían estado llamando. Se autodenominó al-Thair bi-amr Allah al-Muntasir min a'da' Allah. Entró en Barqa, acuñó monedas con su nombre, predicó y maldijo a al-Hakim. Al-Hakim envió a al-Fadl ibn Abd Allah contra él, y este lo derrotó; entonces las tierras de Nubia lo entregaron, después de haberlo llevado allí bajo un pacto que él afirmaba tener. Fue llevado a Egipto, donde al-Hakim lo hizo montar en un camello y exhibirlo, y luego lo mató {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 234-235}."
  ur: "الولید، ابو رکوا کے نام سے مشہور، ہشام بن عبد الملک کی اولاد میں سے ایک اموی۔ اسے صوفیاء کے طریقے سے اپنے سفر میں پانی کے فلاسک کی وجہ سے کنیہ ابو رکوا دیا گیا تھا۔ اس نے مصر میں شیخوں سے ملاقات کی اور حدیثیں لکھیں، پھر مکہ چلے گئے، پھر یمن گئے اور پھر شام چلے گئے۔ اس نے ہشام بن عبد الملک کی اولاد میں سے ایک قائم کو بلوایا اور ان سے بیعت لی جو اس کے مطابق تھے۔ وہ ایک اسکول کے استاد کی حیثیت سے الحلّہ میں آباد ہوا، اور عرب کے لڑکے اس کے گرد جمع ہو گئے۔ پھر اس نے ان سے کہا کہ یہ وہی امام ہے جس کی طرف وہ بلا رہا تھا۔ اس نے اپنے آپ کو الثیر بِی عمرو اللہ المنتصر من عدا اللہ کہا۔ وہ برقع میں داخل ہوا، اس کے نام کے سکے مارے، تبلیغ کی اور الحاکم پر لعنت بھیجی۔ الحکیم نے فضل بن عبد اللہ کو اس کے خلاف بھیجا اور اس نے اسے شکست دی۔ نوبیا کی زمینوں نے اسے اس کے حوالے کر دیا، جب وہ اسے ایک عہد کے تحت وہاں لائے تھے جس کا اس نے دعویٰ کیا تھا۔ اسے مصر لے جایا گیا، جہاں الحکیم نے اسے اونٹ پر بٹھا کر پریڈ کروائی، اور پھر اسے قتل کر دیا۔"
  tr: "Ebu Rakva olarak bilinen El-Valid, Hişam ibn Abdülmalik'in soyundan gelen bir Emeviydi. Yolculuklarında yanında taşıdığı su tulumu nedeniyle Ebu Rakva lakabını almıştı. Sufi yolunu izledi, şeyhlerle görüştü, Mısır'da hadisler yazdı ve Mekke'ye, ardından Yemen'e gitti, sonra Levant'a döndü. Hişam ibn Abdülmalik'in soyundan gelenlerden beklenen İmamı çağırdı ve itaatkâr bulduğu kişilerden biat aldı. Hilla'ya öğretmen olarak yerleşti ve Arap erkek çocukları etrafında toplandı. Daha sonra onlara çağırdığı İmam olduğunu bildirdi ve kendisini Allah'ın emriyle isyancı, Allah'ın düşmanlarından galip gelen olarak ilan etti. Barka'ya girdi, kendi adına para bastırdı, vaaz verdi ve hükümdarı lanetledi. Hükümdar ona karşı El-Fadl ibn Abdülallah'ı gönderdi, o da onu yendi ve Nubya toprakları, iddia ettiği bir antlaşma için oraya getirildikten sonra ona teslim oldu. O, Mısır'a götürüldü ve hükümdar onu bir deveye bindirip teşhir etti, sonra da öldürdü. {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  id: "Al-Walid, yang dikenal sebagai Abu Rakwa, adalah seorang pria Umayyah dari keturunan Hisham ibn Abd al-Malik. Ia dijuluki Abu Rakwa karena kantung air yang dibawanya dalam perjalanannya. Ia mengikuti jalan Sufi, bertemu dengan para syekh, menulis hadits di Mesir, dan pindah ke Mekah, kemudian Yaman, lalu kembali ke Levant. Ia menyerukan kedatangan Imam yang dinantikan dari keturunan Hisham ibn Abd al-Malik dan mengambil baiat dari orang-orang yang ia temukan taat. Ia menetap di Hilla sebagai seorang guru, dan anak-anak laki-laki Arab berkumpul di sekelilingnya. Kemudian ia memberi tahu mereka bahwa dialah Imam yang ia serukan dan menyebut dirinya pemberontak atas perintah Allah, pemenang dari musuh-musuh Allah. Ia memasuki Barqa dan mencetak koin atas namanya, berdakwah, dan mengutuk penguasa. Penguasa mengirim Al-Fadl ibn Abd Allah untuk melawannya, yang mengalahkannya, dan tanah Nubia menyerah kepadanya setelah mereka membawanya ke sana untuk perjanjian yang ia klaim. Dia dibawa ke Mesir, dan penguasa menempatkannya di atas unta, mengaraknya, lalu membunuhnya. {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
