id: person/abu-rakwa
class: person
label: { ar: "أبو ركوة الوليد الأموي", en: "Abu Rakwa al-Walid al-Umawi" }
summary:
  ar: "الوليد المعروف بأبي ركوة، رجل أموي من ولد هشام بن عبد الملك، كني بأبي ركوة لركوة كانت معه في أسفاره على مذهب الصوفية، لقي الشيوخ وكتب الحديث بمصر وانتقل إلى مكة ثم اليمن ثم عاد إلى الشام، وكان يدعو إلى القائم من ولد هشام بن عبد الملك ويأخذ البيعة ممن يجد عنده انقياداً، فنزل الحلة معلماً واجتمع عنده صبيان العرب ثم أعلمهم أنه الإمام الذي يدعو إليه ولقب نفسه الثائر بأمر الله المنتصر من أعداء الله، ودخل برقة فنقش السكة باسمه وخطب ولعن الحاكم، فبعث الحاكم عليه الفضل بن عبد الله فهزمه وسلمته بلاد النوبة بعد أن أوصلوه إليها لعهد زعمه، فحمل إلى مصر فأركبه الحاكم جملاً وشهره ثم قتله {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  en: "Al-Walid, known as Abu Rakwa, a Umayyad of the descendants of Hisham ibn Abd al-Malik. He was given the kunya Abu Rakwa because of a water-flask he carried on his travels, in the manner of the Sufis. He met shaykhs and wrote down hadith in Egypt, then moved to Mecca, then to Yemen, and then returned to Syria. He called for a qa'im from the descendants of Hisham ibn Abd al-Malik and took the pledge from those he found compliant. He settled in al-Hilla as a schoolmaster, and the boys of the Arabs gathered round him; then he told them that he was the imam to whom he had been calling. He styled himself al-Thair bi-amr Allah al-Muntasir min a'da' Allah. He entered Barqa, struck coins in his name, preached, and cursed al-Hakim. Al-Hakim sent al-Fadl ibn Abd Allah against him, and he defeated him; the lands of Nubia then handed him over, after they had brought him there under a covenant he claimed to have. He was taken to Egypt, where al-Hakim had him mounted on a camel and paraded, and then killed him {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
