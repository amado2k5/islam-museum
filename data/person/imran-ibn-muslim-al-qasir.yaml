summary:
  ar: "عمران بن مسلم، أبو بكر المنقري البصري القصير، رأى أنسا، وروى عن أبي رجاء العطاردي والحسن وأنس بن سيرين وعطاء بن أبي رباح. وعنه مهدي بن ميمون والثوري وحاتم بن إسماعيل. قال القطان: كان مستقيم الحديث، وذكره ابن حبان في الثقات، وقال ابن معين: ليس بشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  en: "Imran ibn Muslim, Abu Bakr al-Minqari al-Basri al-Qasir, who saw Anas and narrated from Abu Raja al-Utaridi, al-Hasan, Anas ibn Sirin and Ata ibn Abi Rabah. Mahdi ibn Maymun, al-Thawri and Hatim ibn Isma'il narrated from him. Al-Qattan called his narrations sound, Ibn Hibban counted him among the trustworthy, and Ibn Ma'in said he was worth nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
sources: [source/fiqh-mawsua-kuwaitiyya-noor-v3]
