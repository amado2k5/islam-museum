summary:
  ar: "ابن المنصور بن أبي عامر، وشنجول أي شانجة الصغير وكان سانشو اسم خاله؛ قام بالأمر بعد أخيه المظفر وتلقب الناصر لدين الله وقيل المأمون، وجرى على سنن أبيه وأخيه في الحجر على الخليفة هشام والاستبداد عليه، ثم ثاب له رأي في الاستئثار بما بقي من رسوم الخلافة فطلب من هشام المؤيد أن يوليه عهده فأجابه وأحضر الملأ وكتب له عهده في شهر ربيع الأول سنة ثمان وتسعين وثلاثمائة من إنشاء أبي حفص بن بورد، فكان ذلك مثار الفتنة التي أسلمت الجيوش له فأخذ وأسر وقتل {cite:nafh-tib-maqqari p. 460-461}."
  en: "Al-Mansur's son 'Sanjul' — little Sancho, for his Christian grandfather — who forced the captive caliph Hisham to name him heir in a formal deed of Rabi I 398, the provocation that sparked the Berber fitna and ended with the armies surrendering him to death {cite:nafh-tib-maqqari p. 460-461}."
