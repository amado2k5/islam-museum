summary:
  ar: "فقيه حنفي من أهل بخارى وقاضي سمرقند، انتهت إليه رئاسة الحنفية في عصره، وتنسب إلى بزدة في ما وراء النهر."
  en: "Hanafi jurist of Bukhara and judge of Samarqand, to whom the leadership of the Hanafi school passed in his time; died 493 AH (1100 CE)."
  fr: "Juriste hanafite de Boukhara et juge de Samarcande, auquel revint la direction de l’école hanafite en son temps ; mort en 493 H (1100 ap. J.-C.)."
  es: "Jurista hanafí de Bujará y juez de Samarcanda, a quien recayó el liderazgo de la escuela hanafí en su época; murió en el año 493 de la Hégira (1100 d. C.)."
  ur: "بخارا کے حنفی فقیہ اور سمرقند کے قاضی، جن کے پاس اپنے زمانے میں حنفی مکتب کی قیادت گزری۔ وفات 493ھ ⁦(1100ء)⁩۔"
  tr: "Buharalı bir Hanefi hukukçu ve Semerkantlı bir kadı olan bu kişi, Hanefi mezhebinin liderliğinin onun zamanında sona ermesine neden olmuş ve bu liderlik Transoksanya'daki Buzda'ya atfedilmiştir."
  id: "Seorang ahli hukum Hanafi dari Bukhara dan hakim di Samarkand, kepemimpinan mazhab Hanafi berakhir bersamanya pada masanya, dan kepemimpinan tersebut dikaitkan dengan Buzda di Transoxiana."
