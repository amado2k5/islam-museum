gender: male
summary:
  ar: "أبو المواهب ابن زغدان التونسي ثم القاهري المالكي الصوفي؛ قال المناوي صوفي حبر كلامه مسموع وحديث قدره مرفوع إمام الورعين كنز العارفين علم الزاهدين، ولد سنة عشرين وثمانمائة بتونس فحفظ القرآن وأخذ العربية عن الرملي والفقه عن البرزالي والمنطق عن الموصلي والأصلين عن إبراهيم الأخضري ثم قدم مصر فأخذ الحديث عن ابن حجر والتصوف عن يحيى بن أبي وفاء وصار آية في فهم كلام الصوفية وكان له اقتدار تام على التعبير وبلاغة وكان جميل الصورة والملبس والتعطر وأغلب أوقاته مستغرق في أن الله ومع الله وكان له خلوة بسطح جامع الأزهر مكان المنارة التي عملها الغوري وكان يغلب عليه سكر الحال فيتمايل في صحن الجامع فيتكلم الناس فيه بحسب ما في أوعيتهم حسناً وقبيحاً، وله مزاتب الكمال في التصوف وشرح الحكم لم يتم ولا نظير له في شروحها ومواهب المعارف وكتاب قوائد حكم الإشراق إلى صوفية جميع الآفاق قال الشعراوي لم يؤلف في الطريق مثله، وكان داعية إلى ابن عربي شديداً في المناضلة عنه والانتصار له وله مؤلف في حل سماع العود، توفي بالقاهرة ودفن بمقبرة الشاذلية مع أصحاب الشيخ أبي الحسن الشاذلي سنة اثنتين وثمانين وثمانمائة {cite:shadharat-dhahab p. 335-336}."
  en: "Ibn Zaghdan (b. Tunis 820) — the Maliki Sufi 'treasure of the gnostics': took hadith from Ibn Hajar, tasawwuf from Ibn Abi Wafa'; author of Mazarib al-Kamal, the unmatched sharh al-Hikam and Qawa'id Hukm al-Ishraq; al-Sha'rani: 'nothing like it written on the Path'; a defender of Ibn 'Arabi with a risala on the lawfulness of the lute; his khalwa sat atop the Azhar where al-Ghuri's minaret stood; died 882, buried in the Shadhili cemetery {cite:shadharat-dhahab p. 335-336}."
