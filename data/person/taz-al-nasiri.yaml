label: { ar: "الأمير طاز الناصري", en: "Taz al-Nasiri, Mamluk emir", ur: "امیر طاز الناصری، مملوکی امیر" }
names:
  - { kind: full, value: "Sayf al-Din Taz ibn Abd Allah al-Nasiri" }
  - { kind: alternate, value: "Tāz" }
summary:
  ar: "الأمير سيف الدين طاز الناصري مملوك الناصر محمد بن قلاوون، كان من الستة المدبرين في دولة المظفر حاجي ثم من التسعة أصحاب المشورة عند تولي الناصر حسن، وأمسك في موسم الحج سنة 751هـ صاحب اليمن المجاهد وبيبغا روس. شارك شيخو وصرغتمش في الحكم ثم نُفي نائباً على حلب، وقبض عليه حسن سنة 758هـ وكُحلت عيناه، فأفرج عنه يلبغا العمري وأقام بالقدس حتى مات سنة 763هـ {cite:durar-kamina-jil-1993 2/214} {cite:nujum-zahira 11/15}."
  en: "Amir Sayf al-Din Taz al-Nasiri was a mamluk of al-Nasir Muhammad ibn Qalawun, one of the six who ran the state under al-Muzaffar Hajji and one of nine counsellors when al-Nasir Hasan came to the throne. On the pilgrimage of 751 he seized the Rasulid ruler of Yemen, al-Mujahid, and Baybugha Urus. He shared power with Shaykhu and Sarghitmish, was sent away as governor of Aleppo, was arrested and blinded in 758, was freed by Yalbugha al-Umari, and lived in Jerusalem until he died in 763 {cite:durar-kamina-jil-1993 2/214} {cite:nujum-zahira 11/15}."
  ur: "امیر سیف الدین طاز الناصری الناصر محمد بن قلاوون کے مملوک تھے، المظفر حاجی کے دور میں ریاست چلانے والے چھ امیروں میں سے ایک اور الناصر حسن کی تخت نشینی کے وقت نو مشیروں میں شامل تھے۔ 751ھ کے حج میں انہوں نے یمن کے رسولی حکمران المجاہد اور بیبغا روس کو پکڑا۔ انہوں نے شیخو اور صرغتمش کے ساتھ اقتدار بانٹا، پھر حلب کے نائب بنا کر بھیجے گئے، 758ھ میں گرفتار ہوئے اور ان کی آنکھیں پھوڑ دی گئیں، یلبغا العمری نے انہیں رہا کیا اور وہ 763ھ میں وفات تک قدس میں رہے {cite:durar-kamina-jil-1993 2/214} {cite:nujum-zahira 11/15}."
