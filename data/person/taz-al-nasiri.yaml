kids:
  ar: "طاز كان أميراً شجاعاً في مصر، أسر ملك اليمن في الحج، ثم عاش آخر أيامه في القدس."
  en: "Taz was a brave emir in Egypt who captured the king of Yemen at the pilgrimage and spent his last years in Jerusalem."
  ur: "طاز مصر کا بہادر امیر تھا جس نے حج کے موقع پر یمن کے بادشاہ کو پکڑا اور آخری برس قدس میں گزارے۔"
