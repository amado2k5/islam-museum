id: person/utba-jariyat-al-khayzuran
class: person
label: { ar: "عتبة جارية الخيزران", en: "'Utba, al-Khayzuran's maid", es: "'Utba, al-Khayzuran's maid", fr: "'Utba, al-Khayzuran's maid", ur: "عتبہ، الخیزوران کی لونڈی" }
summary:
  ar: "جارية الخيزران التي كثر تشبيب أبي العتاهية بها حتى شكت إلى مولاتها فجلده المهدي، فلما رأته مجلوداً فاض دمعها، ولما همّ المهدي بدفعها إليه قالت مع حرمتي وحقي وخدمتي تدفعني إلى بائع جرار يكتسب بالشعر، وقالت له أما لو كنت عاشقاً لعتبة لشغلت عن العين والورق {cite:muruj-al-dhahab p. 305-306}."
  en: "Al-Khayzuran's singing-girl whose refusal — 'a jar-seller who lives by verse?' — spurned Abu'l-'Atahiyya before the caliph {cite:muruj-al-dhahab p. 305-306}."
  es: "La cantante de Al-Khayzuran, cuyo rechazo —«¿un vendedor de jarrones que vive de versos?»— despreció a Abu'l-'Atahiyya ante el califa {cite:muruj-al-dhahab p. 305-306}."
  fr: "La jeune fille chanteuse d'Al-Khayzuran dont le refus — « un vendeur de jarres qui vit de vers ? » — a repoussé Abu'l-'Atahiyya devant le calife {cite: muruj-al-dhahab p. 305-306}."
  ur: "الخیزوران کی گانے والی لڑکی جس کا انکار - 'ایک برتن بیچنے والی جو آیت کے مطابق زندگی گزارتی ہے؟' - خلیفہ کے سامنے ابوالعطیہ کو مسترد کر دیا 305-306}۔"
  tr: "Abu al-Atahiya'nın sık sık aşağılandığı bambu köle kız, hanımına şikayet etti, bu yüzden al-Mehdi onu kırbaçladı. Onu kırbaçlanırken gördüğünde gözyaşları taştı. Al-Mahdi onu ona teslim etmek üzereyken, 'Kutsallığım, hakkım ve hizmetimle beni şiirle geçimini sağlayan bir traktör satıcısına iteceksin.' dedi. Ona dedi ki, 'Eşik aşığı olsaydım, gözden ve kağıttan dikkatim dağılırdı.' {atı:muruj-al-dhahab, s. 305-306}."
  id: "Gadis budak bambu, yang sering dihina Abu al-Atahiya hingga mengeluh kepada nyonyanya, lalu al-Mahdi memukulnya. Ketika dia melihat dia dicambuk, air matanya mengalir deras. Ketika al-Mahdi hendak menyerahkannya kepadanya, dia berkata, 'Dengan kesucian, hakku, dan pengabdianku, kamu akan mendorongku ke penjual traktor yang mencari nafkah dari puisi.' Dia berkata kepadanya, 'Jika aku pecinta ambang batas, aku akan teralihkan dari mata dan kertas.' {cite:muruj-al-dhahab, hlm. 305-306}."
