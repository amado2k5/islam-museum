summary:
  ar: "عبد الوهاب بن عبد الرحمن بن عبد الولي بن عبد السلام، بهاء الدين الإخميمي المراغي، فقيه مصري شافعي أصولي، تعلم بالقاهرة واستوطن دمشق وتوفي فيها في الطاعون سنة 764 هـ، اشتهر بكتابه في علم الكلام «المنقذ من الزلل في العلم والعمل»."
  en: "Abd al-Wahhab ibn Abd al-Rahman ibn Abd al-Wali ibn Abd al-Salam, Baha' al-Din al-Ikhmimi al-Maraghi, an Egyptian Shafi'i jurist and usuli who studied in Cairo, settled in Damascus and died there in the plague in 764 AH (1363); known for his theology book al-Munqidh min al-Zalal fi al-Ilm wa-l-Amal."
