label: { ar: "أبو أحمد الحسين بن موسى الموسوي", en: "Abu Ahmad al-Musawi", fr: "Abu Ahmad al-Musawi", es: "Abu Ahmad al-Musawi", ur: "ابو احمد الموسوی" }
summary:
  ar: "نقيب الطالبيين ببغداد ووالد الشريف الرضي؛ حكى ابن الأثير أن القادر بالله لما بلغته أبيات ولده في إثبات نسب المهدي المصري أحضر القاضي أبا بكر بن الباقلاني فأرسله إليه فحلف أنه ما علم بالشعر وأحضر ولده فأنكر، ولما أمره أن يكتب اعتذاراً إلى الخليفة ذكر فيه أن نسب المهدي مدخول أبى الولد وقال أخاف من الديلم وأخاف من المصري من الدعاء في البلاد، فرد عليه أبوه أتخاف ممن هو بعيد عنك ولا تستخي ممن هو قريب {cite:kamil-ibn-al-athir p. 19-20}. وفي سنة أربع وتسعين قلده بهاء الدولة قضاء القضاة والحج والمظالم ونقابة الطالبيين بشيراز وكتب له عهداً على جميع ذلك ولقبه بالطاهر الأوحد ذي المناقب فلم ينظر في قضاء القضاة لامتناع القادر بالله من الإذن له {cite:muntazam-ibn-al-jawzi j.7 p.227}."
  en: "Naqib of the Talibids in Baghdad and father of al-Sharif al-Radi; when al-Qadir sent Ibn al-Baqillani to make him disavow his son's verses on the Fatimid nasab, the son refused, saying he feared the near more than the distant {cite:kamil-ibn-al-athir p. 19-20}."
  fr: "Naqib des Talibides à Bagdad et père d'al-Sharif al-Radi ; lorsqu'al-Qadir envoya Ibn al-Baqillani lui faire désavouer les vers de son fils sur la généalogie fatimide, le fils refusa, disant qu'il craignait le proche plus que le lointain {cite:kamil-ibn-al-athir p. 19-20}."
  es: "Naqib de los talíbidas en Bagdad y padre de al-Sharif al-Radi; cuando al-Qadir envió a Ibn al-Baqillani para que desautorizara los versos de su hijo sobre el nasab fatimí, el hijo se negó, diciendo que temía más lo cercano que lo lejano {cite:kamil-ibn-al-athir p. 19-20}."
  ur: "بغداد میں طالبات کے نقیب اور الشریف الرادی کے والد؛ جب القادر نے ابن البقلانی کو فاطمی نصاب پر اپنے بیٹے کی آیات سے انکار کرنے کے لیے بھیجا تو بیٹے نے یہ کہتے ہوئے انکار کر دیا کہ وہ دور سے زیادہ قریب سے ڈرتا ہے۔ 19-20}۔"
  tr: "Bağdat'taki Alidlerin başı ve Şerif el-Radi'nin babası İbn el-Athir, el-Kadir Billa'nın oğlunun Mısırlı Mehdi'nin soyunu ispatlayan şiirlerini öğrenince, kadı Ebu Bekir ibn el-Bakilani'yi çağırıp kendisine gönderdiğini anlatır. Kadı şiirden hiçbir şey bilmediğine yemin etti. Sonra oğlunu çağırdı, o da bunu reddetti. Halifeye Mehdi'nin soyunun şüpheli olduğunu belirten bir özür yazmasını emrettiğinde, oğlu \"Deylamlılardan ve Mısırlılardan ve onların topraklar üzerindeki hak iddialarından korkuyorum\" diyerek reddetti. Babası ise \"Sen uzaktaki birinden korkuyor da yakındaki birinden korkmuyor musun?\" diye karşılık verdi. {kaynak: Kamil İbn el-Athir, s. 19-20}. Hicri 94 yılında Baha' el-Devla onu Baş Yargıç, Hac ve Şikayetler Sorumlusu ve Şiraz'daki Alidler başkanı olarak atadı ve tüm bunlar için ona bir fetva yazdı ve ona \"el-Tahir el-Evhad Zhi el-Menakib\" (Temiz, Eşsiz, Faziletli) unvanını verdi. Baş Yargıçlık görevini düşünmedi çünkü el-Kadir Billa ona yetki vermeyi reddetti. {cite:muntazam-ibn-al-jawzi cilt 7 s. 227}."
  id: "Kepala klan Alid di Baghdad dan ayah dari Sharif al-Radi; Ibn al-Athir meriwayatkan bahwa ketika al-Qadir Billah mengetahui syair-syair putranya yang membuktikan silsilah Mahdi Mesir, ia memanggil hakim Abu Bakr ibn al-Baqilani dan mengirim putranya kepadanya. Hakim itu bersumpah bahwa ia tidak mengetahui apa pun tentang syair tersebut. Kemudian ia memanggil putranya, yang menyangkalnya. Ketika ia memerintahkan putranya untuk menulis pembelaan kepada Khalifah, di mana ia menyebutkan bahwa silsilah Mahdi diragukan, putranya menolak, dengan mengatakan, \"Aku takut pada kaum Daylam dan aku takut pada orang Mesir dan klaim mereka atas tanah-tanah ini.\" Ayahnya menjawab, \"Apakah kamu takut pada seseorang yang jauh darimu dan tidak takut pada seseorang yang dekat?\" {kutipan:kamil-ibn-al-athir hlm. 19-20}. Pada tahun 94 H, Baha' al-Dawla mengangkatnya sebagai Ketua Mahkamah Agung, Pejabat Haji dan Pengaduan, serta kepala Alid di Shiraz, dan menuliskan dekrit untuk semua itu, serta memberinya gelar \"al-Tahir al-Awhad Dhi al-Manaqib\" (Yang Suci, Yang Unik, Yang Memiliki Kebajikan). Beliau tidak mempertimbangkan posisi Ketua Mahkamah Agung karena al-Qadir Billah menolak untuk memberinya wewenang. {cite:muntazam-ibn-al-jawzi vol. 7 p. 227}."
