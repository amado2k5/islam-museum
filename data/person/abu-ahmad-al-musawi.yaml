label: { ar: "أبو أحمد الحسين بن موسى الموسوي" }
summary:
  ar: "نقيب الطالبيين ببغداد ووالد الشريف الرضي؛ حكى ابن الأثير أن القادر بالله لما بلغته أبيات ولده في إثبات نسب المهدي المصري أحضر القاضي أبا بكر بن الباقلاني فأرسله إليه فحلف أنه ما علم بالشعر وأحضر ولده فأنكر، ولما أمره أن يكتب اعتذاراً إلى الخليفة ذكر فيه أن نسب المهدي مدخول أبى الولد وقال أخاف من الديلم وأخاف من المصري من الدعاء في البلاد، فرد عليه أبوه أتخاف ممن هو بعيد عنك ولا تستخي ممن هو قريب {cite:kamil-ibn-al-athir p. 19-20}."
  en: "Naqib of the Talibids in Baghdad and father of al-Sharif al-Radi; when al-Qadir sent Ibn al-Baqillani to make him disavow his son's verses on the Fatimid nasab, the son refused, saying he feared the near more than the distant {cite:kamil-ibn-al-athir p. 19-20}."
