summary:
  ar: عمة محمد بن أحمد بن عيسى بن الشيخ صاحب آمد، كاتبت شعبة بن شهاب اليشكري رسول المعتضد إليه سنة ست وثمانين ومائتين كتاباً أجزلت فيه الموعظة وألحقت به أبياتاً منها اقبل نصيحة أم قلبها عليك خوفاً وإشفاقاً، فلما عرضها على المعتضد أعجبه شعرها وعقلها وقال إني لأرجو أن أشفعها في كثير من القوم، وقال ابن أخيها لرسولها ما بآراء النساء تساس الدول ولا بعقولهن يساس الملك، فلما فتحت آمد ونزل على الأمان أسفرت عن وجهها وأنشأت وريب الزمان وصرفه {cite:muruj-al-dhahab p. 604-606}.
  en: The aunt of Amad's defender whose counsel-letter and verses so pleased al-Mu'tadid he hoped her intercession would avail — her nephew answered 'states are not ruled by women's counsel' {cite:muruj-al-dhahab p. 604-606}.
  es: "La tía del defensor de Amad, cuya carta de consejo y versos tanto complacieron a al-Mu'tadid, quien esperaba que su intercesión fuera efectiva, fue respondida por su sobrino: \"Los estados no se gobiernan con el consejo de mujeres\" {cite:muruj-al-dhahab p. 604-606}."
  fr: "La tante du défenseur d'Amad dont la lettre de conseil et les versets avaient tellement plu à al-Mu'tadid qu'il espérait que son intercession serait utile — son neveu répondit: « Les États ne sont pas gouvernés par les conseils des femmes » {cite: muruj-al-dhahab p. 604-606}."
  ur: "عماد کے محافظ کی خالہ جس کے وکالت نامہ اور آیات المتعدید کو بہت خوش ہوئیں اسے امید تھی کہ اس کی شفاعت کام آئے گی - اس کے بھتیجے نے جواب دیا کہ 'ریاستوں پر خواتین کے مشورے سے حکومت نہیں ہوتی'۔ 604-606}۔"
  tr: "Muhammed ibn Ahmed ibn İsa ibn Şeyh Sahib Amad'ın teyzesi, 286 Hicri yılında el-Mu'tadid'in elçisi Şube ibn Şihab el-Yashkuri, ona kapsamlı öğütler ve korku ve merhametten kalbinin annesinin öğütlerini kabul ettiği dizeler içeren mektuplar yazdı. Onu al-Mu'tadid'e sunduğunda, şiirini ve zekasını takdir etti ve dedi ki, 'Umarım onun için birçok insanda aracılık edebilirim.' Yeğeni elçisine şöyle dedi: 'Kadınların görüşleri nedir ki, hüküm ne de kendi akllarıyla yönetir.' Amid açılıp güvenliğe indiğinde, yüzünü gösterdi ve zamanın ve dikkatinin dağılmasının şüphesini yarattı {cite:muruj-al-dhahab s. 604-606}."
  id: "Bibi Muhammad ibn Ahmad ibn Isa ibn Sheikh Sahib Amad, Shu'bah ibn Shihab al-Yashkuri, utusan al-Mu'tadid kepadanya pada tahun 286 H, menulis surat yang memberikan peringatan panjang lebar dan menyertakan ayat-ayat yang menerima nasihat ibu hatinya kepadamu karena takut dan belas kasih. Ketika dia memperkenalkannya kepada al-Mu'tadid, dia mengagumi puisi dan intelektualnya dan berkata, 'Aku berharap dapat bersyaat untuknya di banyak orang.' Keponakannya berkata kepada utusannya: 'Apa yang terjadi dengan pendapat wanita yang menguasai negara, dan raja tidak memerintah dengan pikiran mereka.' Ketika Amid membuka dan dia turun ke tempat aman, dia memperlihatkan wajahnya dan menciptakan keraguan tentang waktu dan pengalihannya {cite:muruj-al-dhahab hlm. 604-606}."
