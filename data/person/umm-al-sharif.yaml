summary:
  ar: "عمة محمد بن أحمد بن عيسى بن الشيخ صاحب آمد، كاتبت شعبة بن شهاب اليشكري رسول المعتضد إليه سنة ست وثمانين ومائتين كتاباً أجزلت فيه الموعظة وألحقت به أبياتاً منها اقبل نصيحة أم قلبها عليك خوفاً وإشفاقاً، فلما عرضها على المعتضد أعجبه شعرها وعقلها وقال إني لأرجو أن أشفعها في كثير من القوم، وقال ابن أخيها لرسولها ما بآراء النساء تساس الدول ولا بعقولهن يساس الملك، فلما فتحت آمد ونزل على الأمان أسفرت عن وجهها وأنشأت وريب الزمان وصرفه {cite:muruj-al-dhahab p. 604-606}."
  en: "The aunt of Amad's defender whose counsel-letter and verses so pleased al-Mu'tadid he hoped her intercession would avail — her nephew answered 'states are not ruled by women's counsel' {cite:muruj-al-dhahab p. 604-606}."
