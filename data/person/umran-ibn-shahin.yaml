id: person/umran-ibn-shahin
class: person
label: { ar: "عمران بن شاهين" }
summary:
  ar: "صاحب البطائح؛ كان من أهل الجامدة فجبى جبايات فهرب إلى البطيحة خوفاً من السلطان وأقام بين القصب والأجام مقتصراً على ما يصيده من السمك وطيور الماء قوتاً ثم صار يقطع الطريق على من يسلك البطيحة واجتمع إليه جماعة من الصيادين واللصوص واتخذ معاقل على التلول وغلب على تلك النواحي، فسير إليه معز الدولة وزيره أبا جعفر الصيمري فحاربه مراراً وأسر أهله وعياله واستتر عمران فلما مات عماد الدولة وسار الصيمري إلى شيراز ظهر من استتاره وعاد إلى أمره وقوى أسره {cite:kamil-ibn-al-athir p. 365-366}.، وعند ابن الأثير توفي سنة 369هـ بعد أن طلبه الملوك والخلفاء وبذلوا الجهد في أخذه وأعملوا الحيل أربعين سنة فلم يقدرهم الله عليه ومات حتف أنفه وولى مكانه ابنه الحسن {cite:kamil-ibn-al-athir p. 514}"
  en: "Lord of the Batayih marshes; a village tax-farmer of al-Jamida who fled to the reeds, lived on fish and waterfowl, then drew runaways and bandits, fortified the mounds and defied Mu'izz al-Dawla's armies for years {cite:kamil-ibn-al-athir p. 365-366}."
