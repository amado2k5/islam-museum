class: person
label: { en: "Umran ibn Shahin", ar: "عمران بن شاهين", es: "Umran ibn Shahin", fr: "Umran ibn Shahin", ur: "عمران بن شاہین" }
summary:
  ar: "صاحب البطائح؛ كان من أهل الجامدة فجبى جبايات فهرب إلى البطيحة خوفاً من السلطان وأقام بين القصب والأجام مقتصراً على ما يصيده من السمك وطيور الماء قوتاً ثم صار يقطع الطريق على من يسلك البطيحة واجتمع إليه جماعة من الصيادين واللصوص واتخذ معاقل على التلول وغلب على تلك النواحي، فسير إليه معز الدولة وزيره أبا جعفر الصيمري فحاربه مراراً وأسر أهله وعياله واستتر عمران فلما مات عماد الدولة وسار الصيمري إلى شيراز ظهر من استتاره وعاد إلى أمره وقوى أسره {cite:kamil-ibn-al-athir p. 365-366}. وعند ابن الأثير توفي سنة 369هـ بعد أن طلبه الملوك والخلفاء وبذلوا الجهد في أخذه وأعملوا الحيل أربعين سنة فلم يقدرهم الله عليه ومات حتف أنفه وولى مكانه ابنه الحسن {cite:kamil-ibn-al-athir p. 514}"
  en: "Lord of the Batayih marshes; a village tax-farmer of al-Jamida who fled to the reeds, lived on fish and waterfowl, then drew runaways and bandits, fortified the mounds and defied Mu'izz al-Dawla's armies for years {cite:kamil-ibn-al-athir p. 365-366}."
  es: "Señor de los pantanos de Batayih; un recaudador de impuestos de la aldea de al-Jamida que huyó a los juncos, vivió de pescado y aves acuáticas, luego atrajo a fugitivos y bandidos, fortificó los montículos y desafió a los ejércitos de Mu'izz al-Dawla durante años {cite:kamil-ibn-al-athir p. 365-366}."
  fr: "Seigneur des marais de Batayih; un fermier d'impôts du village d'al-Jamida qui s'enfuit dans les roseaux, vécut de poissons et d'oiseaux aquatiques, puis attira les fugitifs et les bandits, fortifia les monticules et défia les armées de Mu'izz al-Dawla pendant des années {cite:kamil-ibn-al-athir p. 365-366}."
  ur: "بطیح دلدل کا رب؛ الجمیدہ کا ایک دیہاتی کاشتکار جو سرکنڈوں کی طرف بھاگا، مچھلیوں اور آبی پرندوں پر رہتا تھا، پھر بھاگنے والوں اور ڈاکوؤں کو اپنی طرف کھینچتا تھا، ٹیلوں کو مضبوط کرتا تھا اور معز الدولہ کی فوجوں کو برسوں تک ٹالتا رہتا تھا۔ 365-366}۔"
  tr: "Al-Bata'ih'in sahibi Al-Jamida'dandı, vergi topladı, Sultan'dan korktuğu için Al-Batiha'ya kaçtı ve balık ve su kuşları avına dayanarak sazlıklar ile kamlar arasında yerleşti. Daha sonra Al-Batiha'ya gidenlerin yolunu kapatmaya başladı. Bir grup avcı ve hırsız etrafında toplandı ve tepelerde kaleler kurarak bölgeleri domine etti. Mu'izz al-Dawla, bakanı Ebu Ca'far al-Saymari, ona gidip defalarca savaştı, ailesini ve ailesini esir aldı, İmran ise saklandı. Imad al-Dawla öldüğünde ve al-Saymari Şiraz'a yürüdüğünde, onu saklayanlar ortaya çıktı, komutasına döndü ve esaretini güçlendirdi {cite:kamil-ibn-al-athir s. 365-366}. 369 Hicri yılında, krallar ve halifeler onu aradıktan sonra, onu yakalamak için büyük çaba ve hileler yaptıktan sonra ve Allah buna izin vermedi. Ani bir şekilde öldü ve yerine oğlu el-Hasan geçti {atıf:kamil-ibn-al-athir s. 514}"
  id: "Pemilik Al-Bata'ih berasal dari Al-Jamida, mengumpulkan pajak, melarikan diri ke Al-Batiha karena takut pada Sultan, dan menetap di antara alang-alang dan cam, mengandalkan hasil tangkapan ikan dan burung air untuk makanan. Kemudian ia mulai memblokir jalan bagi mereka yang datang ke Al-Batiha. Sekelompok pemburu dan pencuri berkumpul di sekelilingnya dan mendirikan benteng di perbukitan, menguasai wilayah tersebut. Mu'izz al-Dawla, menterinya Abu Ja'far al-Saymari, mendekatinya, bertempur berulang kali, menangkap keluarga dan keluarganya, dan Imran bersembunyi. Ketika Imad al-Dawla meninggal dan al-Saymari berbaris ke Shiraz, mereka yang menyembunyikannya muncul, kembali ke komandonya, dan memperkuat penahanannya {cite:kamil-ibn-al-athir hlm. 365-366}. Ia meninggal pada tahun 369 H setelah raja dan khalifah mencarinya, berusaha keras dan melakukan tipu muslihat untuk menangkapnya, dan Tuhan tidak mengizinkan mereka melakukannya. Ia meninggal secara tiba-tiba, dan putranya al-Hasan menggantikannya {cite:kamil-ibn-al-athir hlm. 514}"
