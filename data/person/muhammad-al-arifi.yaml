summary:
  ar: داعية وأكاديمي سعودي، وُلد سنة 1970 في القويعية ونشأ في الدمام. دكتوراه في العقيدة والمذاهب المعاصرة من جامعة الإمام محمد بن سعود، وخطيب جامع البواردي بالرياض منذ 2006؛ من أكثر الدعاة متابعةً على
    وسائل التواصل، ومنعته سويسرا وبريطانيا من دخول أراضيهما بقرارات رسمية، وجُمّد حسابه على تويتر سنة 2018.
  en: Saudi preacher and academic, born in 1970 in al-Quway'iyya and raised in Dammam. He holds a doctorate in creed and contemporary sects from Imam Muhammad ibn Saud Islamic University and has been preacher
    of al-Bawardi mosque in Riyadh since 2006; one of the most followed preachers on social media, he was barred from Switzerland and Britain by official decisions, and his Twitter account was suspended
    in 2018.
  ur: سعودی مبلغ اور ماہرِ تعلیم، 1970 میں القویعیہ میں پیدا ہوئے اور دمام میں پروان چڑھے۔ جامعہ امام محمد بن سعود سے عقیدہ اور عصری فرقوں میں ڈاکٹریٹ حاصل کی اور 2006 سے ریاض کے جامع البواردي کے خطیب ہیں؛
    سوشل میڈیا پر سب سے زیادہ پیروکار رکھنے والی مبلغین میں شمار ہوتے ہیں۔ سویٹزرلینڈ اور برطانیہ نے انہیں سرکاری فیصلوں سے داخلے سے روکا اور 2018 میں ان کا ٹوئٹر اکاؤنٹ معطل ہوا۔
  es: "Predicador y académico saudí, nacido en 1970 en al-Quway'iyya y criado en Dammam. Es doctor en teología y sectas contemporáneas por la Universidad Islámica Imam Muhammad ibn Saud y ha sido predicador de la mezquita al-Bawardi en Riad desde 2006. Siendo uno de los predicadores más seguidos en las redes sociales, se le prohibió la entrada a Suiza y Gran Bretaña por decisiones oficiales, y su cuenta de Twitter fue suspendida en 2018."
  fr: "Prédicateur et universitaire saoudien, né en 1970 à al-Quway'iyya et ayant grandi à Dammam, il est titulaire d'un doctorat en théologie et sectes contemporaines de l'Université islamique Imam Muhammad ibn Saud. Prédicateur de la mosquée al-Bawardi à Riyad depuis 2006, il est l'un des prédicateurs les plus suivis sur les réseaux sociaux. Interdit de séjour en Suisse et au Royaume-Uni par décision officielle, son compte Twitter a été suspendu en 2018."
  tr: "1970 yılında Al-Quwaiiyah'da doğmuş ve Dammam'da büyümüş, Suudi vaizi ve akademisyen. İmam Muhammed bin Suud Üniversitesi'nden İnanç ve Çağdaş Mezhepler alanında doktora derecesine sahiptir ve 2006'dan beri Riyad'daki El-Bavardi Camii'nin vaizidir; sosyal medyada en çok takip edilen vaizlerden biridir. İsviçre ve Britanya resmi olarak onun topraklarına girişini yasakladı ve Twitter hesabı 2018'de donduruldu."
  id: "Seorang penceramah dan akademisi Saudi, lahir pada tahun 1970 di Al-Quwaiiyah dan dibesarkan di Dammam. Ia meraih gelar PhD dalam Kredo dan Sekte Kontemporer dari Universitas Imam Muhammad bin Saud, dan telah menjadi pengkhotbah Masjid Al-Bawardi di Riyadh sejak 2006; salah satu pengkhotbah yang paling banyak diikuti di media sosial. Swiss dan Inggris secara resmi melarangnya memasuki wilayah mereka, dan akun Twitter-nya dibekukan pada tahun 2018."
