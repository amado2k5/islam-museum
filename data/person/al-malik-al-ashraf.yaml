summary:
  ar: "أيوبي صاحب دمشق، أمر ببناء دار الحديث الأشرفية سنة ثمان وعشرين وست مئة ففرغت في سنة ثلاثين {cite:tarikh-khulafa-minhaj-1434 p. 704}؛ وفي الشذرات: لما فتح دمشق اشترى دار قايماز النجمى وجعلها دار حديث وترك بها نعل النبي الذي أتاه به النظام بن أبي الحديد وكان قد وضعه على عينيه وبكى، وبنى مسجد أبي الدرداء بقلعة دمشق وجامع العقيبة المعروف بجامع التوبة — وكان خاناً للفجور والخمور — ومسجد القصب وجامع جراح وجامع بيت الأنبار وجامع حرستا، وكان حسن الظن بالفقراء وأباح لأهل دمشق الفرجة ببستانه بالنيرب؛ ومن عدله قصة بنت شاه أرمن صاحب خلاط حين شكت إليه حاجبه الذي أخذ ضيعتها فكتب بإطلاقها وردها إليها؛ توفي يوم الخميس رابع المحرم سنة خمس وثلاثين {cite:shadharat-dhahab p. 175-176}."
  en: "The Ayyubid lord of Damascus who ordered the Ashrafiyya dar al-hadith in 628, finished in 630 {cite:tarikh-khulafa-minhaj-1434 p. 704}."
  ur: "دمشق کے ایوبی حکمران؛ انہوں نے 628ھ میں اشرفیہ دار الحدیث کی تعمیر کا حکم دیا، جو 630ھ میں مکمل ہوا۔ {cite:tarikh-khulafa-minhaj-1434 p. 704}"
  es: "El señor ayubí de Damasco que ordenó el Ashrafiyya dar al-hadith en 628, lo terminó en 630 {cite:tarikh-khulafa-minhaj-1434 p. 704}."
  fr: "Le seigneur ayyoubide de Damas qui a commandé l'Ashrafiyya dar al-hadith en 628, l'a terminé en 630 {cite:tarikh-khulafa-minhaj-1434 p. 704}."
  tr: "Şam hükümdarı Eyyubi, 286 Hicri yılında Eşrefiye Hadis Evi'nin inşasını emretti; bu eser 30 yılında tamamlandı {atıf: Tarih-Hurfa-Minhaj-1434, s. 704}; ve El-Şedret'te: Şam fethedildiğinde, Keymaz el-Necmi'nin evini satın alıp onu hadis evi haline getirdi; geride Peygamber'in sandalını bıraktı; bu sandal, gözlerinin üzerine takıp ağlamıştı. Ayrıca Şam kalesinde Ebu el-Derde Camii'ni, Tevbe Camii olarak bilinen Ebu Edrece Camii'ni, sefahat ve alkol kaynağı olan Tevbe Camii'ni, ayrıca El-Kasab Camii, Cerre Camii, Beyt el-Enbar Camii ve Harasta Camii'ni inşa etti. Fakirler hakkında iyi görüşlere sahipti ve Şam halkının Nayrab'daki bahçelerinin tadını çıkarmasına izin verdi; örnekleri arasında, bir karıştırıcı sahibi Şah Arman'ın kızının görgü tanığı ona mülkünü aldığını şikayet ettiği ve onun serbest bırakılması ve geri verilmesi için yazdığı hikaye var; otuz beşinci yılda, Muharrem ayının dördüncü Perşembe günü vefat etti {atıf:shadharat-dhahab, s. 175-176}."
  id: "Ayyubi, penguasa Damaskus, memerintahkan pembangunan Rumah Hadis Ashrafiyyah pada tahun 286 H, yang selesai pada tahun 30 {cite:History-Khulafa-Minhaj-1434, hlm. 704}; dan dalam Al-Shadhrat: Ketika Damaskus ditaklukkan, ia membeli rumah Qaymaz al-Najmi dan menjadikannya rumah hadis, meninggalkan sandal Nabi yang diberikan kepadanya oleh al-Nizam ibn Abi al-Hadid, yang memakainya di matanya dan menangis. Ia juga membangun Masjid Abu al-Darda di benteng Damaskus, Masjid Al-Uqaybah yang dikenal sebagai Masjid At-Tawbah—yang menjadi sumber kebejatan dan alkohol—serta Masjid Al-Qasab, Masjid Jarrah, Masjid Bayt al-Anbar, dan Masjid Harasta. Ia memiliki pandangan baik terhadap orang miskin dan mengizinkan rakyat Damaskus menikmati kebun mereka di Nayrab; salah satu contohnya adalah kisah putri Shah Arman, pemilik tempat mengaduk, ketika saksi matanya mengeluh bahwa ia telah mengambil tanah miliknya, sehingga ia menulis surat untuk membebaskannya dan mengembalikannya; ia meninggal pada hari Kamis, tanggal empat Muharram, tahun tiga puluh lima {cite:shadharat-dhahab, hlm. 175-176}."
