summary:
  ar: "أيوبي صاحب دمشق، أمر ببناء دار الحديث الأشرفية سنة ثمان وعشرين وست مئة ففرغت في سنة ثلاثين {cite:tarikh-khulafa-minhaj-1434 p. 704}؛ وفي الشذرات: لما فتح دمشق اشترى دار قايماز النجمى وجعلها دار حديث وترك بها نعل النبي الذي أتاه به النظام بن أبي الحديد وكان قد وضعه على عينيه وبكى، وبنى مسجد أبي الدرداء بقلعة دمشق وجامع العقيبة المعروف بجامع التوبة — وكان خاناً للفجور والخمور — ومسجد القصب وجامع جراح وجامع بيت الأنبار وجامع حرستا، وكان حسن الظن بالفقراء وأباح لأهل دمشق الفرجة ببستانه بالنيرب؛ ومن عدله قصة بنت شاه أرمن صاحب خلاط حين شكت إليه حاجبه الذي أخذ ضيعتها فكتب بإطلاقها وردها إليها؛ توفي يوم الخميس رابع المحرم سنة خمس وثلاثين {cite:shadharat-dhahab p. 175-176}."
  en: "The Ayyubid lord of Damascus who ordered the Ashrafiyya dar al-hadith in 628, finished in 630 {cite:tarikh-khulafa-minhaj-1434 p. 704}."
