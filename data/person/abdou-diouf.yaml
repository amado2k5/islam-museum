summary:
  ar: "سياسي سنغالي (وُلد 1935) من لوگا، رئيس وزراء السنغال (1970–1981) ثم رئيسها الثاني (1981–2000) خلفا لليوبولد سيدار سنغور، تنازل عن السلطة بعد خسارته انتخابات 2000 أمام عبد الله واد؛ ثم الأمين العام للمنظمة الدولية للفرنكوفونية (2003–2014)."
  en: "Senegalese politician (born 1935) from Louga; prime minister of Senegal (1970–1981) and then its second president (1981–2000), succeeding Léopold Sédar Senghor and conceding power after losing the 2000 election to Abdoulaye Wade; afterwards secretary-general of the Organisation internationale de la Francophonie (2003–2014)."
  ur: "سینیگال کے سیاست دان (پیدائش 1935ء) جن کا تعلق لوگا سے ہے؛ سینیگال کے وزیر اعظم (1970ء–1981ء) اور پھر اس کے دوسرے صدر (1981ء–2000ء) رہے جنھوں نے لیوپولڈ سیدار سینگور کی جانشینی کی اور 2000ء کے انتخابات میں عبداللہ واد سے شکست کے بعد اقتدار منتقل کیا؛ بعد ازاں فرانکوفونی کی بین الاقوامی تنظیم کے سیکرٹری جنرل (2003ء–2014ء) رہے۔"
