summary:
  ar: "بالطة أوغلي، قائد الأسطول العثماني في حصار القسطنطينية سنة 857هـ/1453م؛ ينقل الصلابي أن الفاتح أرسل إليه حين حاولت سفن أوروبية بلوغ الخليج: «إما أن تستولي على هذه السفن وإما أن تغرقها، وإذا لم توفق في ذلك فلا ترجع إلينا حياً»، فلم يستطع منعها رغم الجهود، فعزله السلطان واتهمه بالجبن، فكشف عن عينه المصابة وقال: «إني استقبل الموت بجنان ثابت، ولكن يؤلمني أن أموت وأنا متهم بمثل هذه التهمة»، فأدرك الفاتح أن الرجل قد أعذر فاكتفى بعزله وجعل مكانه حمزة باشا {cite:dawlat-uthmaniyya-salabi p. 97}."
  en: "Baltaoglu, the Ottoman fleet commander at the siege of Constantinople in 857/1453; al-Salabi records Mehmed's message to him when European ships tried to reach the gulf — 'take those ships or sink them, and if you fail do not return to me alive' — and, when the ships got through, his dismissal on a charge of cowardice. The admiral uncovered his wounded eye: 'I face death steadfastly, but it grieves me to die under this accusation.' The sultan accepted his excuse, dismissed him, and appointed Hamza Pasha in his place {cite:dawlat-uthmaniyya-salabi p. 97}."
  es: "Baltaoglu, comandante de la flota otomana durante el asedio de Constantinopla en 857/1453, según relata al-Salabi, recibió un mensaje de Mehmed cuando los barcos europeos intentaron llegar al golfo: «Captura esos barcos o húndelos, y si fracasas, no regreses con vida». Cuando los barcos lograron cruzar, fue destituido bajo la acusación de cobardía. El almirante descubrió su ojo herido: «Afronto la muerte con firmeza, pero me duele morir bajo esta acusación». El sultán aceptó su excusa, lo destituyó y nombró a Hamza Pasha en su lugar {cite:dawlat-uthmaniyya-salabi p. 97}."
  fr: "Baltaoglu, commandant de la flotte ottomane lors du siège de Constantinople en 857/1453, reçut, selon al-Salabi, le message de Mehmed II lorsque des navires européens tentèrent de franchir le golfe: « Capturez ces navires ou coulez-les, et si vous échouez, ne revenez pas vivant. » Une fois le passage franchi, l'amiral fut destitué pour lâcheté. Il découvrit son œil blessé et déclara: « J'affronte la mort avec courage, mais mourir sous cette accusation me désole. » Le sultan accepta ses excuses, le destitua et nomma Hamza Pacha à sa place (voir: Dawlat-Uthmaniyya-Salabi, p. 97)."
  ur: "857/1453 میں قسطنطنیہ کے محاصرے میں عثمانی بحری بیڑے کا کمانڈر بلتا اوگلو؛ الصلبی نے اسے محمد کا پیغام ریکارڈ کیا جب یورپی بحری جہازوں نے خلیج تک پہنچنے کی کوشش کی - 'ان جہازوں کو لے لو یا انہیں ڈبو دو، اور اگر تم ناکام ہو گئے تو مجھے زندہ واپس نہ کرو' - اور جب جہاز گزرے تو بزدلی کے الزام میں اس کی برطرفی۔ ایڈمرل نے اپنی زخمی آنکھ سے پردہ اٹھایا: 'میں ثابت قدمی سے موت کا سامنا کر رہا ہوں، لیکن اس الزام کے تحت مرنا مجھے غمزدہ کرتا ہے۔' سلطان نے اس کا عذر قبول کر لیا، اسے برطرف کر دیا اور حمزہ پاشا کو اس کی جگہ پر مقرر کر دیا۔ 97}۔"
