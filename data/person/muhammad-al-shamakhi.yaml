summary:
  ar: "كمال الدين الشماخي ثم الباكوي؛ أخذ عن السيد يحيى بن السيد بهاء الدين الشرواني الشماخي، ودخل القاهرة بعد فتنة إسماعيل شاه فلم يُظهر مشيخة ولا سلوكاً ولا تقرّب من أرباب الدنيا بل جلس في حانوت قرب خان الخليلي يشتغل فيه صناعة الأقمعة والكوافي على أسلوب العجم بحسن صناعة وجميل دربة وإتقان صنع، وكان حافظاً لعبارات كثير من المشايخ وآدابهم وأخلاقهم؛ توفي ليلة الاثنين ثالث ربيع الأول عن مائة وثلاث عشرة سنة {cite:shadharat-dhahab p. 561}."
  en: "A Shirvani initiatic chain in a craftsman's shop — after Shah Isma'il's fitna he came to Cairo showing no shaykhdom, sat in a stall by Khan al-Khalili fashioning Persian-style caps and coifs 'with beautiful workmanship', while carrying a store of shaykhs' sayings and manners 'missing from many of the turbaned'; died Monday night 3 Rabi' I, aged one hundred and thirteen {cite:shadharat-dhahab p. 561}."
  es: "Una cadena iniciática de Shirvani en el taller de un artesano: después de la fitna del Shah Isma'il, llegó a El Cairo sin mostrar ningún tipo de shaykhdom, se sentó en un puesto junto a Khan al-Khalili confeccionando gorros y cofias de estilo persa \"con una hermosa mano de obra\", mientras llevaba consigo un arsenal de dichos y modales de shaykhs \"que faltan en muchos de los que llevan turbante\"; murió la noche del lunes 3 de Rabi' I, a la edad de ciento trece años {cita: shadharat-dhahab p. 561}."
  fr: "Une chaîne initiatique Shirvani dans une boutique d'artisan — après la fitna du Shah Isma'il, il est venu au Caire sans montrer de cheikhdom, s'est assis dans un étal près du Khan al-Khalili façonnant des bonnets et des coiffes de style persan « avec un beau travail », tout en portant un stock de paroles et de manières de cheikhs « absentes chez beaucoup de ceux qui portent le turban »; est décédé lundi soir 3 Rabi' I, à l'âge de cent treize ans {cite:shadharat-dhahab p. 561}."
  ur: "ایک کاریگر کی دکان میں ایک شیروانی کا سلسلہ شروع ہوا - شاہ اسماعیل کے فتنے کے بعد وہ قاہرہ آیا جس میں وہ شیخ نہیں تھے، خان الخلیلی کے ایک اسٹال پر بیٹھ کر فارسی طرز کی ٹوپیوں اور کوفوں کو 'خوبصورت کاریگری کے ساتھ' بنا رہے تھے، اور شیخوں کے اقوال اور اسلوب کا ایک ذخیرہ اٹھائے ہوئے تھے۔ پیر کی رات 3 ربیع اول، ایک سو تیرہ کی عمر میں وفات پائی۔ 561}۔"
