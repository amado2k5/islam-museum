summary:
  ar: "كمال الدين الشماخي ثم الباكوي؛ أخذ عن السيد يحيى بن السيد بهاء الدين الشرواني الشماخي، ودخل القاهرة بعد فتنة إسماعيل شاه فلم يُظهر مشيخة ولا سلوكاً ولا تقرّب من أرباب الدنيا بل جلس في حانوت قرب خان الخليلي يشتغل فيه صناعة الأقمعة والكوافي على أسلوب العجم بحسن صناعة وجميل دربة وإتقان صنع، وكان حافظاً لعبارات كثير من المشايخ وآدابهم وأخلاقهم؛ توفي ليلة الاثنين ثالث ربيع الأول عن مائة وثلاث عشرة سنة {cite:shadharat-dhahab p. 561}."
  en: "A Shirvani initiatic chain in a craftsman's shop — after Shah Isma'il's fitna he came to Cairo showing no shaykhdom, sat in a stall by Khan al-Khalili fashioning Persian-style caps and coifs 'with beautiful workmanship', while carrying a store of shaykhs' sayings and manners 'missing from many of the turbaned'; died Monday night 3 Rabi' I, aged one hundred and thirteen {cite:shadharat-dhahab p. 561}."
