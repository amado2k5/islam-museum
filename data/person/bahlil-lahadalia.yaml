summary:
  ar: "بهليل لحاداليا (وُلد في 7 آب 1976 في باندا بجزر الملوك الوسطى بإندونيسيا) رجل أعمال وسياسي إندونيسي صعد من عمله سائقَ حافلة صغيرة إلى رئاسة نقابة رجال الأعمال الشباب الإندونيسيين (2015–2019)، ثم قيادة هيئة تنسيق الاستثمار (2019–2024) ووزارة الاستثمار الأولى (2021–2024)؛ أصبح وزير الطاقة والموارد المعدنية في آب 2024 ورئيسًا عامًا لحزب غولكار في الشهر نفسه، وعُيّن في تشرين الأول 2026 وزيرًا منسقًا إضافيًا لشؤون التصنيع التكميلي والتحول الطاقي."
  en: "Bahlil Lahadalia (born 7 August 1976 in Banda, Central Maluku, Indonesia) is an Indonesian businessman and politician who rose from working as a public minibus driver to chair the Indonesian Young Entrepreneurs Association (HIPMI, 2015-2019), head the Investment Coordinating Board (2019-2024) and serve as Indonesia's first Minister of Investment (2021-2024); he became Minister of Energy and Mineral Resources in August 2024 and general chairman of the Golkar Party the same month, and in October 2026 was additionally made Coordinating Minister for Downstreaming and Energy Transition."
  ur: "بہلیل لاہادالیا (پیدائش 7 اگست 1976، باندا، وسط مالوکو، انڈونیشیا) انڈونیشی کاروباری و سیاست دان ہیں جو منی بس ڈرائیور کے کام سے اٹھ کر انڈونیشی نوجوان کاروباری ایسوسی ایشن (HIPMI، 2015–2019) کے سربراہ، سرمایہ کاری رابطہ بورڈ کے سربراہ (2019–2024) اور انڈونیشیا کے پہلے وزیر سرمایہ کاری (2021–2024) بنے؛ اگست 2024 میں وہ وزیر توانائی و معدنی وسائل اور اسی مہینے گولکار پارٹی کے چیئرمین جنرل ہوئے، اور اکتوبر 2026 میں انھیں ڈاؤن اسٹریمنگ و توانائی منتقلی کا کوآرڈینیٹنگ وزیر بھی بنایا گیا۔"
