summary:
  ar: "بهليل لحاداليا ⁦(وُلد في 7 آب 1976 في باندا بجزر الملوك الوسطى بإندونيسيا)⁩ رجل أعمال وسياسي إندونيسي صعد من عمله سائقَ حافلة صغيرة إلى رئاسة نقابة رجال الأعمال الشباب الإندونيسيين (2015–2019)، ثم قيادة هيئة تنسيق الاستثمار (2019–2024) ووزارة الاستثمار الأولى (2021–2024)؛ أصبح وزير الطاقة والموارد المعدنية في آب 2024 ورئيسًا عامًا لحزب غولكار في الشهر نفسه، وعُيّن في تشرين الأول 2026 وزيرًا منسقًا إضافيًا لشؤون التصنيع التكميلي والتحول الطاقي."
  en: "Bahlil Lahadalia (born 7 August 1976 in Banda, Central Maluku, Indonesia) is an Indonesian businessman and politician who rose from working as a public minibus driver to chair the Indonesian Young Entrepreneurs Association (HIPMI, 2015-2019), head the Investment Coordinating Board (2019-2024) and serve as Indonesia's first Minister of Investment (2021-2024); he became Minister of Energy and Mineral Resources in August 2024 and general chairman of the Golkar Party the same month, and in October 2026 was additionally made Coordinating Minister for Downstreaming and Energy Transition."
  ur: "بہلیل لاہادالیا ⁦(پیدائش 7 اگست 1976، باندا، وسط مالوکو، انڈونیشیا)⁩ انڈونیشی کاروباری و سیاست دان ہیں جو منی بس ڈرائیور کے کام سے اٹھ کر انڈونیشی نوجوان کاروباری ایسوسی ایشن ⁦(HIPMI، 2015–2019)⁩ کے سربراہ، سرمایہ کاری رابطہ بورڈ کے سربراہ (2019–2024) اور انڈونیشیا کے پہلے وزیر سرمایہ کاری (2021–2024) بنے؛ اگست 2024 میں وہ وزیر توانائی و معدنی وسائل اور اسی مہینے گولکار پارٹی کے چیئرمین جنرل ہوئے، اور اکتوبر 2026 میں انھیں ڈاؤن اسٹریمنگ و توانائی منتقلی کا کوآرڈینیٹنگ وزیر بھی بنایا گیا۔"
  es: "Bahlil Lahadalia (nacido el 7 de agosto de 1976 en Banda, Maluku Central, Indonesia) es un empresario y político indonesio que pasó de trabajar como conductor de minibús público a presidir la Asociación de Jóvenes Emprendedores de Indonesia (HIPMI, 2015-2019), dirigir la Junta Coordinadora de Inversiones (2019-2024) y ser el primer Ministro de Inversiones de Indonesia (2021-2024); se convirtió en Ministro de Energía y Recursos Minerales en agosto de 2024 y presidente general del Partido Golkar ese mismo mes, y en octubre de 2026 fue nombrado además Ministro Coordinador para la Transición Energética y la Refinación de Petróleo."
  fr: "Bahlil Lahadalia (né le 7 août 1976 à Banda, dans la région des Moluques centrales, en Indonésie) est un homme d'affaires et homme politique indonésien qui, après avoir été chauffeur de minibus, a présidé l'Association indonésienne des jeunes entrepreneurs (HIPMI, 2015-2019), dirigé le Conseil de coordination des investissements (2019-2024) et été le premier ministre indonésien de l'Investissement (2021-2024). Il est devenu ministre de l'Énergie et des Ressources minérales en août 2024 et président général du parti Golkar le même mois, et en octobre 2026, il a également été nommé ministre coordinateur de l'aval et de la transition énergétique."
  tr: "Bahlil Hadalia (7 Ağustos 1976, Banda, Orta Adalar, Endonezya doğumlu), minibüs şoförü olarak görevinden yükselen Endonezyalı iş insanı ve siyasetçidir; 2015–2019 yılları arasında Endonezya Genç İş Adamları Birliği'nin başına, ardından Yatırım Koordinasyon Otoritesi'ne (2019–2024) ve İlk Yatırım Bakanlığı'na (2021–2024) liderlik etmiştir; Ağustos 2024'te Enerji ve Maden Kaynakları Bakanı ve aynı ay Golkar Partisi Genel Başkanı olmuştur. Ekim 2026'da Tamamlayıcı Üretim ve Enerji Dönüşümü için Ek Koordinasyon Bakanı olarak atanmıştır."
  id: "Bahlil Hadalia (lahir 7 Agustus 1976, di Banda, Kepulauan Tengah, Indonesia) adalah seorang pengusaha dan politisi Indonesia yang naik dari perannya sebagai sopir minibus menjadi memimpin Serikat Pengusaha Muda Indonesia (2015–2019), kemudian memimpin Otoritas Koordinasi Investasi (2019–2024) dan Kementerian Investasi Pertama (2021–2024); ia menjadi Menteri Energi dan Sumber Daya Mineral pada Agustus 2024 dan Ketua Jenderal Partai Golkar pada bulan yang sama. Pada Oktober 2026, ia diangkat sebagai Menteri Koordinator Tambahan untuk Manufaktur Pelengkap dan Transisi Energi."
