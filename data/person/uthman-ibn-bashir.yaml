summary:
  ar: "عثمان بن بشير بن المحتفز؛ ظفر به عبد الله بن خازم بعد مقتل ابنه محمد بهراة فقتله صبراً ولما قتل ابن خازم بعثوا بيده اليمنى إلى ولد عثمان."
  en: "Uthman ibn Bashir ibn al-Muhtafiz; taken by Ibn Khazim after his son Muhammad's killing at Herat and slain in cold blood — Ibn Khazim's severed right hand was later sent to his sons."
  es: "Uthman ibn Bashir ibn al-Muhtafiz; capturado por Ibn Khazim tras el asesinato de su hijo Muhammad en Herat y asesinado a sangre fría. La mano derecha cercenada de Ibn Khazim fue enviada posteriormente a sus hijos."
  fr: "Uthman ibn Bashir ibn al-Muhtafiz; capturé par Ibn Khazim après le meurtre de son fils Muhammad à Hérat et tué de sang-froid — la main droite coupée d'Ibn Khazim fut plus tard envoyée à ses fils."
  ur: "عثمان بن بشیر ابن المحطفٰی؛ ابن خزیم نے اپنے بیٹے محمد کے ہرات میں قتل اور سرد خون کے بعد قتل کر دیا - ابن خزیم کا کٹا ہوا دایاں ہاتھ بعد میں اس کے بیٹوں کو بھیج دیا گیا۔"
