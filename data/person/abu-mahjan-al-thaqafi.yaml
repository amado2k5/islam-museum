label: { ar: "أبو محجن الثقفي", en: "Abu Mahjan al-Thaqafi" }
summary:
  ar: "الأسير الشاعر الشهير: كان محبوساً عند سعد في أسفل حصن العذيب لشعره في القهوة وهي قوله إذا مت فادفني إلى جنب كرمة تروي عظامي بعد موتي عروقها، فلما اشتدت وقعة القادسية وسمع انتماء الناس ووقع الحديد استأذن سعداً فردّه، فقال لسلمى بنت حفصة زوجته هل لك في خير تخلين عني وتعيريني البلقاء والله علي إن سلمني الله أن أرجع إليك حتى أضع رجلي في القيد، فأطلقته فركب فرس سعد البلقاء وتنوزع أركبها بسرج أم عرياً فكبّر وحمل على ميمنة القوم فأوقفهم ثم ميسرتهم ثم قلبهم لا يبرز له فارس إلا هتكه، والناس يقولون إن كان الخضر يشهد الحرب فهذا هو الخضر ولولا أن الملائكة لا تباشر الحروب لقلنا إنه ملك، وسعد يشرف من أعلى القصر يقول لولا محبس أبي محجن لقلت هذا أبو محجن وهذه البلقاء، فلما انتصف الليل عاد إلى محبسه وردّ رجله في القيد وقال شعره وليلة قادس لم يشعروا بي، ثم أخبرت سلمى سعداً فأطلقه وقال اذهب فما أنا مؤاخذك بشيء تقوله حتى تفعله فقال لا جرم والله لا أجبت لساني إلى صفة قبيح أبداً {cite:muruj-al-dhahab p. 610-612}."
  en: "The chained poet-knight: jailed under Sa'd for his wine verses, he begged Salma bt Hafsa for the loan of al-Balqa' on an oath to return his foot to the fetter — then rode three charges that held the wings and centre at Qadisiyya while the host wondered if this was Khidr or an angel; back in chains by midnight, freed when Sa'd heard it all — 'I shall never give my tongue to an ugly report again' {cite:muruj-al-dhahab p. 610-612}."
