summary:
  en: "A Companion of Banu Aslam dispatched by the Prophet as an undercover scout to Hawazin's camp at Awtas before Hunayn; he stayed among them, overheard Malik ibn Awf's orders, and brought vital intelligence back to Medina's army."
  fr: "Compagnon des Banu Aslam envoyé par le Prophète comme éclaireur infiltré dans le camp des Hawazin à Awtas avant Hunayn ; il resta parmi eux, entendit les ordres de Malik ibn Awf et rapporta des renseignements décisifs à l'armée de Médine."
  ar: "صحابي من بني أسلم بعثه النبي عيناً متخفياً إلى عسكر هوازن بأوطاس قبل حنين؛ فأقام فيهم حتى سمع مقالة مالك بن عوف وخطته الحربية، ثم رجع إلى النبي فأخبره."
  ur: "بنو اسلم کے صحابی؛ نبی نے انہیں حنین سے پہلے اوطاس میں ہوازن کے لشکر میں چھپ کر جاسوس بنایا؛ وہ ان کے درمیان رہے اور مالک بن عوف کی بات اور منصوبہ سن کر واپس آئے۔"
  es: "Un compañero de Banu Aslam fue enviado por el Profeta como explorador encubierto al campamento de Hawazin en Awtas, antes de Hunayn; permaneció entre ellos, escuchó las órdenes de Malik ibn Awf y llevó información vital al ejército de Medina."
  tr: "Aslam kabilesinden bir sahabe, Peygamberimiz tarafından Huneyn'den önce Avtes'te Hawazin'in ordusuna casus olarak kılık değiştirerek gönderilmişti. Malik bin Awf'ın sözlerini ve savaş planını duyuncaya kadar aralarında kaldı, sonra Peygamberimize dönerek durumu bildirdi."
  id: "Seorang sahabat dari suku Aslam, yang diutus Nabi sebagai mata-mata yang menyamar ke pasukan Hawazin di Awtas sebelum Hunayn. Dia tinggal di antara mereka sampai dia mendengar ucapan Malik bin Awf dan rencana perangnya, kemudian dia kembali kepada Nabi dan memberitahukannya."
