summary:
  ar: "زين الدين القادري الصالحي شيخ الطريقة وعلم الحقيقة العالم الناسك؛ ولد سنة اثنتين وثمانين وسبعمائة وتفقه بجماعة منهم برهان الدين وأكمل الدين ابنا شرف الدين بن مفلح صاحب الفروع وتخرج بجماعة منهم والده ونشأ على طريقة حسنة ملازماً للذكر وقراءة القرآن والأوراد التي رتبها والده وكان محبباً إلى الناس يتردد إليه النواب والقضاة والفقهاء من كل مذهب، اشتغل في فنون كثيرة وكتب بخطه الحسن كثيراً وألف كتباً عديدة منها الكنز الأكبر في الأمر بالمعروف والنهي عن المنكر وهو أجلها وكتاب نزهة النفوس والأفكار في خواص النبات والحيوان والأحجار وكتاب الدر المنتقى المرفوع في أوراد اليوم والليلة والأسبوع والمولد الشريف، وكان بشوشاً ينتحب بقضاء الحوائج مسموع الكلمة في الدولة الأشرفية والظاهرية وتكلم على مدرسة الشيخ أبي عمر والبيمارستان القيمري محصلاً له به النفع من عمارة جهاتهما، وتوفي ليلة الجمعة سلخ ربيع الآخر سنة ست وخمسين وثمانمائة ودفن بالتربة التي أنشأها قبلي زاويته المشرفة على الطريق يمين الداخل، وأخبر ابن العماد أخوه في الله الشيخ أحمد بن علي بن أبي سالم أنه سلم عليه فرد عليه التحية من قبره {cite:shadharat-dhahab p. 288-289}."
  en: "Zayn al-Din al-Qadiri (b. 782) — 'shaykh of the path and sign of the Truth,' the Salihiyya ascetic whose father composed the litanies he lived by; author of al-Kanz al-Akbar on commanding right, Nuzhat al-Nufus on the virtues of plants/animals/stones, and the mawlid awrad; beloved of qadis and deputies of every madhhab; died Friday night end-Rabi' II 856, buried in the turba he built before his zawiya — a fellow Sufi swore he answered the salam from his grave {cite:shadharat-dhahab p. 288-289}."
  es: "Zayn al-Din al-Qadiri (n. 782) — 'shaykh del camino y signo de la Verdad', el asceta Salihiyya cuyo padre compuso las letanías por las que se regía; autor de al-Kanz al-Akbar sobre el derecho de mando, Nuzhat al-Nufus sobre las virtudes de las plantas, los animales y las piedras, y el mawlid awrad; amado por los cadíes y los delegados de todas las madhhab; murió la noche del viernes de finales de Rabi' II de 856, enterrado en el turba que construyó frente a su zawiya — un compañero sufí juró que respondió al salam desde su tumba {cite: shadharat-dhahab p. 288-289}."
  fr: "Zayn al-Din al-Qadiri (né en 782) — « cheikh du chemin et signe de la Vérité », ascète Salihiyya dont le père composa les litanies selon lesquelles il vivait; auteur d'al-Kanz al-Akbar sur le droit de commander, de Nuzhat al-Nufus sur les vertus des plantes/animaux/pierres et du mawlid awrad; aimé des qadis et des députés de chaque madhhab; décédé dans la nuit du vendredi 1er Rabi' II 856, enterré dans la turba qu'il avait construite devant sa zawiya — un autre soufi a juré qu'il avait répondu au salam depuis sa tombe {cite: shadharat-dhahab p. 288-289}."
  ur: "زین الدین القادری ⁦(پیدائش 782)⁩ - 'سچ کے راستے اور نشانی کے شیخ'، صالحیہ سنی جس کے والد نے وہ لطائف لکھے جن کے ساتھ وہ رہتے تھے؛ حکم حق پر الکنز الاکبر کے مصنف، پودوں/جانوروں/پتھروں کی فضیلت پر نزہت النفس، اور میلاد اوراد؛ قادیانیوں کا محبوب اور ہر مذہب کے نائبین؛ جمعہ کی رات آخر ربیع الثانی 856 میں وفات پائی، اپنے زاویہ سے پہلے بنائے گئے تربہ میں دفن ہوئے - ایک ساتھی صوفی نے قسم کھائی کہ اس نے اپنی قبر سے سلام کا جواب دیا۔ 288-289}۔"
  tr: "Zeynin el-Din el-Kadiri el-Salihi, Sufi tarikatının şeyhi, hakikat ilminin, münzevi, alim, 782 Hicri yılında doğdu. Fıkıh eğitimini Burhan al-Din gibi bir gruptan aldı. Bu din, el-Furu'nun yazarı Şeraf ad-Din bin Müflih'in oğulları tarafından tamamlandı. Babası da dahil olmak üzere babasının bir grubuyla birlikte mezun oldu. İyi bir şekilde yetiştirildi, zikre bağlı kaldı ve Kur'an'ı Kur'an'ı ve babasının düzenlediği ilahileri okuyordu. İnsanlar tarafından sevildi, her mezhepten milletvekilleri, yargıçlar ve hukukçular tarafından sıkça ziyaret edildi. Birçok alanda çalıştı, güzel el yazısıyla birçok eser yazdı ve 'Erdem ve Yasaklama Emrindeki En Büyük Hazine' dahil olmak üzere çok sayıda kitap yazdı. Kötülük hakkında, ki bu onun belirlenmiş zamanıdır, 'Nuzhat al-Nufus wa al-Afkar fi Khawas al-Nabat wa al-Hawyan wa al-Ahjar' kitabı ve 'Al-Durr al-Muntaqa al-Marfu' kitabı gündüz, gece, hafta ilahilerinde ve soylu Mawlid'de yer alır. Neşeliydi, ihtiyaçlarını karşıladı ve Ashrafiyye ile Zahiri devletlerinde duyulan bir sesti. Şeyh Ebu Ömer okulu ve Qaymari Hastanesi'nin bölgelerinin inşasından faydalandığını anlattı. 856 Hicri yılında, Cuma gecesi Rabi'l-Thani'de öldü ve girişin sağındaki yolu gören zawiyası tarafından önünde oluşturulan toprağa gömüldü. İbn el-İmad kardeşine haber verdi Allah'ta, Şeyh Ahmed ibn Ali ibn Abi Salim onu selamladı ve mezarından selamını geri verdi {atıf:shadharat-dhahab s. 288-289}."
  id: "Zain al-Din al-Qadiri al-Salihi, sheikh tarekat Sufi, ilmu kebenaran, pertapa dan ulama, lahir pada tahun 782 H. Ia mempelajari hukum di bawah kelompok yang termasuk Burhan al-Din. Agama ini diselesaikan oleh putra-putra Sharaf al-Din ibn Muflih, penulis al-Furu'. Ia lulus bersama kelompok ayahnya, termasuk ayahnya. Ia dibesarkan dengan baik, mematuhi dzikir dan membacakan Al-Qur'an serta himne yang disusun oleh ayahnya. Ia dicintai oleh masyarakat, sering dikunjungi oleh deputi, hakim, dan ahli hukum dari berbagai aliran. Ia bekerja di berbagai bidang, menulis banyak karya dengan tulisan tangannya yang indah, dan menulis banyak buku, termasuk 'Harta Terbesar dalam Perintah Kebajikan dan Larangan.' Tentang kejahatan, yang merupakan waktu yang telah ditentukan, dan buku 'Nuzhat al-Nufus wa al-Afkar fi Khawas al-Nabat wa al-Hawyan wa al-Ahjar' serta buku 'Al-Durr al-Muntaqa al-Marfu' dalam himne siang, malam, minggu, dan Mawlid yang mulia. Ia ceria, berduka memenuhi kebutuhan, dan menjadi suara yang terdengar di negara bagian Ashrafiyyah dan Zahiri. Ia berbicara tentang sekolah Sheikh Abu Umar dan Rumah Sakit Qaymari, yang mendapat manfaat dari pembangunan wilayah mereka. Ia meninggal pada malam Jumat di Rabi' al-Thani tahun 856 H dan dimakamkan di tanah yang didirikan di hadapannya oleh zawiya yang menghadap jalan di sebelah kanan pintu masuk. Ibn al-Imad memberitahu saudaranya Dalam Allah, Sheikh Ahmad ibn Ali ibn Abi Salim menyambutnya dan mengembalikan salam itu dari makamnya {cite:shadharat-dhahab hlm. 288-289}."
