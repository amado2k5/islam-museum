summary:
  ar: "زين الدين القادري الصالحي شيخ الطريقة وعلم الحقيقة العالم الناسك؛ ولد سنة اثنتين وثمانين وسبعمائة وتفقه بجماعة منهم برهان الدين وأكمل الدين ابنا شرف الدين بن مفلح صاحب الفروع وتخرج بجماعة منهم والده ونشأ على طريقة حسنة ملازماً للذكر وقراءة القرآن والأوراد التي رتبها والده وكان محبباً إلى الناس يتردد إليه النواب والقضاة والفقهاء من كل مذهب، اشتغل في فنون كثيرة وكتب بخطه الحسن كثيراً وألف كتباً عديدة منها الكنز الأكبر في الأمر بالمعروف والنهي عن المنكر وهو أجلها وكتاب نزهة النفوس والأفكار في خواص النبات والحيوان والأحجار وكتاب الدر المنتقى المرفوع في أوراد اليوم والليلة والأسبوع والمولد الشريف، وكان بشوشاً ينتحب بقضاء الحوائج مسموع الكلمة في الدولة الأشرفية والظاهرية وتكلم على مدرسة الشيخ أبي عمر والبيمارستان القيمري محصلاً له به النفع من عمارة جهاتهما، وتوفي ليلة الجمعة سلخ ربيع الآخر سنة ست وخمسين وثمانمائة ودفن بالتربة التي أنشأها قبلي زاويته المشرفة على الطريق يمين الداخل، وأخبر ابن العماد أخوه في الله الشيخ أحمد بن علي بن أبي سالم أنه سلم عليه فرد عليه التحية من قبره {cite:shadharat-dhahab p. 288-289}."
  en: "Zayn al-Din al-Qadiri (b. 782) — 'shaykh of the path and sign of the Truth,' the Salihiyya ascetic whose father composed the litanies he lived by; author of al-Kanz al-Akbar on commanding right, Nuzhat al-Nufus on the virtues of plants/animals/stones, and the mawlid awrad; beloved of qadis and deputies of every madhhab; died Friday night end-Rabi' II 856, buried in the turba he built before his zawiya — a fellow Sufi swore he answered the salam from his grave {cite:shadharat-dhahab p. 288-289}."
