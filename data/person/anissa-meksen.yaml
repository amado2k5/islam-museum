summary:
  ar: "كيك بوكسر فرنسية جزائرية وُلدت في نانسي سنة 1988. فازت ببطولة غلوري للسيدات في وزن فوق البانتام مرتين، وبألقاب عالمية في المواي تاي والسافات، وبلقب فرنسا في الملاكمة الاحترافية، وحققت 104 انتصارات، وتُعد من أعظم مقاتلات جيلها."
  en: "French-Algerian kickboxer born in Nancy in 1988. She won the Glory Women's Super Bantamweight Championship twice, world titles in Muay Thai and savate, and the French professional boxing title, compiling 104 wins; she is regarded as one of the greatest female kickboxers of her generation."
  ur: "فرانسیسی الجزائری کک باکسر، 1988 میں نانسی میں پیدا ہوئیں۔ انہوں نے دو بار گلوری ویمنز سپر بینٹم ویٹ چیمپئن شپ، موئے تھائی اور ساوات میں عالمی اعزازات، اور فرانسیسی پیشہ ورانہ باکسنگ اعزاز جیتا، 104 فتوحات حاصل کیں، اور اپنی نسل کی عظیم ترین خاتون کک باکسروں میں شمار ہوتی ہیں۔"
