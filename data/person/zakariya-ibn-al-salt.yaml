summary:
  ar: "زكريا بن الصلت، له الورع الوثيق والقلب الرفيق، مشهود بالتعبد والاجتهاد والتوجد والانفراد. قال: ما شافع أشفع للرجل المذنب من خدمة لرب العالمين، وقال: من نظر إلى مبتدع بعينه فقد أعان النظر على الهدم، فليغمض الناس أعينهم عن نظر المبتدعين. ورويت عنه حديث عن أبي هريرة في الذب عن الضعفاء عند كل بدعة."
  en: "Zakariya ibn al-Salt, of firm scrupulousness and a gentle heart, known for devotion, striving, longing and solitude. He said: nothing intercedes better for a sinner than service to the Lord of the worlds; and whoever looks at an innovator with favour helps the demolition of the faith, so one should close one's eyes against the gaze of innovators. He transmitted a report from Abu Hurayra about defending the weak at every innovation that harms Islam."
  ur: "زکریا بن الصلت، مضبوط پرہیزگاری اور نرم دل والے، عبادت، محنت، شوق اور تنہائی میں مشہور۔ انہوں نے کہا: گنہگار آدمی کی سفارش کرنے والی کوئی چیز رب العالمین کی خدمت سے بڑھ کر نہیں، اور جو کسی بدعتی کو آنکھ سے دیکھتا ہے وہ اس کی بربادی میں مدد کرتا ہے، اس لیے بدعتیوں کی نگاہ سے آنکھیں بند رکھو۔ انہوں نے ابو ہریرہ سے ایک روایت بیان کی کہ ہر بدعت کے وقت جو اسلام کو نقصان پہنچائے، اللہ کسی ایسے شخص کو کھڑا کرتا ہے جو کمزوروں کا دفاع کرے۔"
