roles: [mystic, transmitter]
summary:
  ar: "زكريا بن الصلت، له الورع الوثيق والقلب الرفيق، مشهود بالتعبد والاجتهاد والتوجد والانفراد. قال: ما شافع أشفع للرجل المذنب من خدمة لرب العالمين، وقال: من نظر إلى مبتدع بعينه فقد أعان النظر على الهدم، فليغمض الناس أعينهم عن نظر المبتدعين. ورويت عنه حديث عن أبي هريرة في الذب عن الضعفاء عند كل بدعة."
  en: "Zakariya ibn al-Salt, of firm scrupulousness and a gentle heart, known for devotion, striving, longing and solitude. He said: nothing intercedes better for a sinner than service to the Lord of the worlds; and whoever looks at an innovator with favour helps the demolition of the faith, so one should close one's eyes against the gaze of innovators. He transmitted a report from Abu Hurayra about defending the weak at every innovation that harms Islam."
  ur: "زکریا بن الصلت، مضبوط پرہیزگاری اور نرم دل والے، عبادت، محنت، شوق اور تنہائی میں مشہور۔ انہوں نے کہا: گنہگار آدمی کی سفارش کرنے والی کوئی چیز رب العالمین کی خدمت سے بڑھ کر نہیں، اور جو کسی بدعتی کو آنکھ سے دیکھتا ہے وہ اس کی بربادی میں مدد کرتا ہے، اس لیے بدعتیوں کی نگاہ سے آنکھیں بند رکھو۔ انہوں نے ابو ہریرہ سے ایک روایت بیان کی کہ ہر بدعت کے وقت جو اسلام کو نقصان پہنچائے، اللہ کسی ایسے شخص کو کھڑا کرتا ہے جو کمزوروں کا دفاع کرے۔"
  es: "Zakariya ibn al-Salt, de firme escrupulosidad y corazón bondadoso, conocido por su devoción, esfuerzo, anhelo y soledad, dijo: «Nada intercede mejor por un pecador que el servicio al Señor de los mundos; y quien mira con benevolencia a un innovador contribuye a la destrucción de la fe, por lo que uno debe hacer la vista gorda ante la mirada de los innovadores». Transmitió un relato de Abu Hurayra sobre la defensa de los débiles ante cualquier innovación que perjudique al Islam."
  fr: "Zakariya ibn al-Salt, homme d'une rigueur inflexible et d'une grande bonté, connu pour sa dévotion, son ardeur au travail, son désir ardent de Dieu et sa solitude, a dit: « Rien n'intercède mieux pour le pécheur que le service du Seigneur des mondes; et quiconque regarde un innovateur avec bienveillance contribue à la destruction de la foi, aussi faut-il détourner le regard des innovateurs. » Il a transmis un hadith d'Abu Hurayra concernant la défense des faibles face à toute innovation nuisible à l'islam."
  tr: "Yakın dindarlığı ve nazik kalbiyle tanınan, bağlılığı, gayretliliği, varlığı ve yalnızlığıyla tanınan Zekeriye ibn al-Salt. Şöyle dedi: Dünyaların Rabbine hizmet eden günahkar bir adam için aracılıktan daha fazla aracı yoktur. Dedi ki: Bir yenilikçiye kendi gözleriyle bakan onu yok etmeye yardım etmiştir. O yüzden insanlar yenilikçilerin gözünden gözlerini kapatsınlar. Ebu Hureyre'den her yenilikte zayıfları savunan bir hadis rivayet edilmiştir."
  id: "Zakariya ibn al-Salt, dikenal karena kesalehan yang dekat dan hati yang lembut, terkenal karena pengabdian, ketekunan, keberadaan, dan kesendirian. Ia berkata: Tidak ada perantara lebih dari seorang perantara bagi orang berdosa dalam melayani Tuhan alam semestinya. Ia berkata: Siapa pun yang melihat seorang inovator dengan matanya sendiri telah membantu menghancurkannya. Jadi biarlah orang menutup mata dari mata para inovator. Sebuah hadits diceritakan dari Abu Huraira yang membela yang lemah dalam setiap inovasi."
