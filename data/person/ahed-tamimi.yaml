  ar: ناشطة فلسطينية وُلدت سنة 2001 في قرية النبي صالح بالضفة الغربية. اشتهرت فتاةً بمقاطع مواجهتها للجنود الإسرائيليين، وقضت ثمانية أشهر سجينة سنة 2018، وصارت رمزًا عالميًا للمقاومة الشعبية الفلسطينية.
  en: Palestinian activist, born 2001 in the village of Nabi Saleh in the West Bank. Known as a teenager for filmed confrontations with Israeli soldiers; she spent eight months in prison in 2018 and became
