summary:
  ar: ناشطة فلسطينية وُلدت سنة 2001 في قرية النبي صالح بالضفة الغربية. اشتهرت فتاةً بمقاطع مواجهتها للجنود الإسرائيليين، وقضت ثمانية أشهر سجينة سنة 2018، وصارت رمزًا عالميًا للمقاومة الشعبية الفلسطينية.
  en: Palestinian activist, born 2001 in the village of Nabi Saleh in the West Bank. Known as a teenager for filmed confrontations with Israeli soldiers; she spent eight months in prison in 2018 and became
    a global symbol of Palestinian popular resistance.
  fr: "Militante palestinienne née en 2001 au village de Nabi Saleh en Cisjordanie. Connue adolescente par des confrontations filmées avec des soldats israéliens, elle passa huit mois en prison en 2018 et devint un symbole mondial de la résistance populaire palestinienne."
  ur: فلسطینی کارکن، 2001 میں مغربی کنارے کے گاؤں نبی صالح میں پیدا ہوئیں۔ نوعمری میں اسرائیلی فوجیوں سے فلمائی گئی جھڑپوں کے سبب مشہور؛ 2018 میں آٹھ ماہ قید کاٹی اور فلسطینی عوامی مزاحمت کی عالمی علامت
    بنیں۔
  es: "Activista palestina, nacida en 2001 en la aldea de Nabi Saleh, en Cisjordania. Conocida desde su adolescencia por sus enfrentamientos filmados con soldados israelíes, pasó ocho meses en prisión en 2018 y se convirtió en un símbolo mundial de la resistencia popular palestina."
  tr: "2001 yılında Batı Şeria'daki Nabi Saleh köyünde doğan Filistinli bir aktivist. İsrail askerleriyle yaşadığı çatışmaları gösteren videolarıyla genç yaşta ünlendi, 2018'de sekiz ay hapis yattı ve Filistin halk direnişinin küresel bir sembolü haline geldi."
  id: "Seorang aktivis Palestina kelahiran tahun 2001 di desa Nabi Saleh di Tepi Barat. Ia menjadi terkenal sejak kecil karena video-video konfrontasinya dengan tentara Israel, menghabiskan delapan bulan di penjara pada tahun 2018, dan menjadi simbol global perlawanan rakyat Palestina."
