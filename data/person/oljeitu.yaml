summary:
  ar: "أولجايتو غياث الدين محمد خدابنده، ثامن الإلخانات المغول في فارس، حكم من 704 إلى 716هـ، الموافق 1304-1316م. وُلد سنة 680هـ/1282م وكان أخاً لغازان وابناً لأرغون. اتسم عهده بالسلم نسبياً، وبقي رشيد الدين وزيراً فيه، وتنقل في دينه بين النصرانية والبوذية والإسلام السني ثم التشيع، وبنى السلطانية التي ما زال ضريحه قائماً فيها {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  en: "Oljeitu, Ghiyath al-Din Muhammad Khar-Banda (later Khuda-Banda), was the eighth Mongol Ilkhan of Persia, reigning 704-16/1304-16. Born in 680/1282, he was a son of Arghun and a brother of Ghazan. His reign was unusually peaceful, Rashid al-Din remained wazir, his own religious path ran from Christian baptism through Buddhism and Sunni Islam to Shi'ism, and he completed the new seasonal capital Sultaniyya, where his mausoleum still stands {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  ur: "اولجایتو، غیاث الدین محمد خربندہ، جو بعد میں خدابندہ کہلائے، ایران کے آٹھویں منگول ایل خان تھے اور 704 سے 716ھ یعنی 1304 سے 1316ء تک حکمران رہے۔ وہ 680ھ/1282ء میں پیدا ہوئے، ارغون کے بیٹے اور غازان کے بھائی تھے۔ ان کا دور نسبتاً پرامن رہا، رشید الدین وزیر رہے، اور ان کا اپنا مذہبی سفر عیسائی بپتسمہ سے بدھ مت، سنی اسلام اور پھر تشیع تک پہنچا؛ انہوں نے سلطانیہ شہر مکمل کرایا جہاں ان کا مقبرہ آج بھی کھڑا ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
