summary:
  ar: "أولجايتو غياث الدين محمد خدابنده، ثامن الإلخانات المغول في فارس، حكم من 704 إلى 716هـ، الموافق 1304-1316م. وُلد سنة 680هـ/1282م وكان أخاً لغازان وابناً لأرغون. اتسم عهده بالسلم نسبياً، وبقي رشيد الدين وزيراً فيه، وتنقل في دينه بين النصرانية والبوذية والإسلام السني ثم التشيع، وبنى السلطانية التي ما زال ضريحه قائماً فيها {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  en: "Oljeitu, Ghiyath al-Din Muhammad Khar-Banda (later Khuda-Banda), was the eighth Mongol Ilkhan of Persia, reigning 704-16/1304-16. Born in 680/1282, he was a son of Arghun and a brother of Ghazan. His reign was unusually peaceful, Rashid al-Din remained wazir, his own religious path ran from Christian baptism through Buddhism and Sunni Islam to Shi'ism, and he completed the new seasonal capital Sultaniyya, where his mausoleum still stands {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  ur: "اولجایتو، غیاث الدین محمد خربندہ، جو بعد میں خدابندہ کہلائے، ایران کے آٹھویں منگول ایل خان تھے اور 704 سے 716ھ یعنی 1304 سے 1316ء تک حکمران رہے۔ وہ 680ھ/1282ء میں پیدا ہوئے، ارغون کے بیٹے اور غازان کے بھائی تھے۔ ان کا دور نسبتاً پرامن رہا، رشید الدین وزیر رہے، اور ان کا اپنا مذہبی سفر عیسائی بپتسمہ سے بدھ مت، سنی اسلام اور پھر تشیع تک پہنچا؛ انہوں نے سلطانیہ شہر مکمل کرایا جہاں ان کا مقبرہ آج بھی کھڑا ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  es: "Oljeitu, Ghiyath al-Din Muhammad Khar-Banda (más tarde Khuda-Banda), fue el octavo Ilkan mongol de Persia, reinando entre 704 y 16/1304 y 16. Nacido en 680/1282, era hijo de Arghun y hermano de Ghazan. Su reinado fue inusualmente pacífico, Rashid al-Din permaneció como visir, su propio camino religioso abarcó desde el bautismo cristiano, pasando por el budismo y el islam sunita, hasta el chiismo, y completó la nueva capital estacional Sultaniyya, donde aún se encuentra su mausoleo {cite:encyclopaedia-of-islam-2 vol. 8 p. 179} {cite:encyclopaedia-of-islam-2 vol. 8 p. 181}."
  fr: "Oljeitu, Ghiyath al-Din Muhammad Khar-Banda (plus tard Khuda-Banda), fut le huitième ilkhan mongol de Perse, régnant de 704 à 1316 (ou de 1304 à 1316). Né en 680 (ou 1282), il était le fils d'Arghun et le frère de Ghazan. Son règne fut exceptionnellement paisible; Rashid al-Din demeura vizir. Son parcours religieux le mena du baptême chrétien au bouddhisme, puis à l'islam sunnite et enfin au chiisme. Il acheva la construction de Sultaniyya, nouvelle capitale saisonnière, où son mausolée se dresse encore aujourd'hui."
  tr: "Uljeitu Ghiyath al-Din Muhammed Khudabandeh, İran'ın sekizinci Moğol İlhanlığı, 704-716 Hicri yılları arasında hüküm sürdü; bu da 1304-1316 yıllarına karşılık gelir. 680 Hicri / 1282 yılında doğdu, Gazan'ın kardeşi ve Argun'un oğluydu. Saltanatı nispeten barışçıl geçti ve Raşiddin veziri olarak kaldı; Hristiyanlık, Budizm, Sünni İslam ve ardından Şiilik arasında gidip geldi; sultaniye'yi inşa etti; türbesi hâlâ ayakta durmaktadır. {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 179} {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 181}."
  id: "Uljeitu Ghiyath al-Din Muhammad Khudabandeh, Ilkhanat Mongol kedelapan di Persia, memerintah dari tahun 704 hingga 716 H, yang bertepatan dengan tahun 1304-1316 M. Ia lahir pada tahun 680 H / 1282 M dan merupakan saudara Ghazan serta putra Argun. Pemerintahannya relatif damai, dan Rashid al-Din tetap menjadi wazirnya, bergantian antara Kristen, Buddha, Islam Sunni, dan kemudian Syiah, dan ia membangun kesultanan di tempat makamnya masih berdiri. {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 179} {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 181}."
