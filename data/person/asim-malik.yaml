summary:
  ar: "محمد عاصم مالك جنرال باكستاني من رتبة ثلاث نجوم، مدير عام جهاز الاستخبارات منذ 30 أيلول 2024، ومنذ نيسان 2025 مستشار الأمن القومي أيضًا — أول رئيس للجهاز يجمع المنصبين أثناء الخدمة. أول حامل دكتوراه يترأس الجهاز، نال سيف الشرف في الأكاديمية العسكرية الباكستانية وكان قبلها المساعد العام للجيش. لا يُعرف عام مولده علنًا."
  en: "Muhammad Asim Malik is a Pakistani three-star general who has been Director-General of the Inter-Services Intelligence since 30 September 2024 and, since April 2025, also National Security Adviser - the first serving ISI chief to hold both posts. The first PhD holder to head the ISI, he won the Sword of Honour at the Pakistan Military Academy and previously served as the army's adjutant general. His birth year is not public."
  ur: "محمد عاصم ملک پاکستانی تھری اسٹار جنرل ہیں جو 30 ستمبر 2024 سے ڈائریکٹر جنرل آئی ایس آئی اور اپریل 2025 سے قومی سلامتی کے مشیر بھی ہیں۔ وہ آئی ایس آئی کی سربراہی کرنے والے پہلے پی ایچ ڈی یافتہ ہیں، پاکستان ملٹری اکیڈمی میں اعزازی شمشیر حاصل کی اور اس سے قبل ایڈجوٹنٹ جنرل رہے۔ ان کا سال پیدائش عوامی طور پر معلوم نہیں۔"
