label: { ar: "المهاجر بن زياد الحارثي", en: "al-Muhajir ibn Ziyad al-Harithi", fr: "al-Muhajir ibn Ziyad al-Harithi", es: "al-Muhajir ibn Ziyad al-Harithi" }
summary:
  ar: "المهاجر بن زياد الحارثي أخو الربيع بن زياد بن الديان؛ استشهد بمناذر وقد أراد أن يشري نفسه وهو صائم فأمره أبو موسى أن يفطر أو لا يخرج فشرب شربة ماء وقال والله ما شربتها من عطش ثم قاتل حتى قتل ونصب أهل مناذر رأسه على قصرهم بين شرفتين وله قالت العرب راح المهاجر في حل بإجمال."
  en: "Al-Muhajir ibn Ziyad al-Harithi, al-Rabi' ibn Ziyad's brother; martyred at Manadhir — he would sell his life fasting, drank at Abu Musa's order 'not from thirst', fought and fell, his head set between two merlons — the elegy 'راح المهاجر في حل بإجمال' is his."
  fr: "Al-Muhajir ibn Ziyad al-Harithi, frère d'al-Rabi' ibn Ziyaad ; martyrisé à Manadhir – il vendait sa vie à jeun, buvait à l'ordre d'Abou Moussa 'pas de soif', se battait et tombait, la tête entre deux merlons – l'élégie 'راح المهاجر في حل بإجمال' lui appartient."
  es: "Al-Muhajir ibn Ziyad al-Harithi, hermano de al-Rabi' ibn Ziyad; martirizado en Manadhir —vendía su vida ayunando, bebía por orden de Abu Musa 'no por sed', luchó y cayó, con la cabeza entre dos almenas— la elegía 'راح المهاجر في حل بإجمال' es suya."
