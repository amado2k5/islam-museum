summary:
  ar: "المهاجر بن زياد الحارثي أخو الربيع بن زياد بن الديان؛ استشهد بمناذر وقد أراد أن يشري نفسه وهو صائم فأمره أبو موسى أن يفطر أو لا يخرج فشرب شربة ماء وقال والله ما شربتها من عطش ثم قاتل حتى قتل ونصب أهل مناذر رأسه على قصرهم بين شرفتين وله قالت العرب راح المهاجر في حل بإجمال."
  en: "Al-Muhajir ibn Ziyad al-Harithi, al-Rabi' ibn Ziyad's brother; martyred at Manadhir — he would sell his life fasting, drank at Abu Musa's order 'not from thirst', fought and fell, his head set between two merlons — the elegy 'راح المهاجر في حل بإجمال' is his."
