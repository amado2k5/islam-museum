summary:
  ar: "رجل من أهل الحديث المعروف بسجادة، امتنع في محنة خلق القرآن فقيد ثم أجاب، وعابه المأمون في كتابه بأن في شغله وإعداد النوى لسجادته ما أذهله عن التوحيد {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  en: "A hadith man known as Sajjada; he refused in the creation-of-the-Quran mihna and was shackled before relenting — al-Ma'mun's letter mocked that his date-stone work for his sajjada had distracted him from tawhid {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  es: "Un hombre de hadices conocido como Sajjada; se negó en la creación del Corán mihna y fue encadenado antes de ceder; la carta de al-Ma'mun se burlaba de que su trabajo con piedras de dátil para su sajjada lo había distraído del tawhid {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  fr: "Un homme de hadith connu sous le nom de Sajjada; il a refusé dans la mihna de la création du Coran et a été enchaîné avant de céder — la lettre d'al-Ma'mun se moquait du fait que son travail de pierre dattier pour son sajjada l'avait distrait du tawhid {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
