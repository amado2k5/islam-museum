label: { ar: "إبراهيم بن الأغلب" }
summary:
  ar: "عند البلاذري: من وجوه جند مصر وثب واثنا عشر رجلاً فأخذوا من بيت المال مقدار أرزاقهم فقط وهربوا إلى الزاب فاعتقد على جند تلك الناحية الرياسة ولاطف هرثمة بن أعين فولّاه ناحيته ثم أشار هرثمة على الرشيد باستصلاحه فصفح عنه وولّاه بلاد المغرب اصطناعاً فقام به وضبطه — مؤسس ولاية الأغالبة بإفريقية."
  en: "In al-Baladhuri: of Egypt's army notables; he rose with twelve men who took only their rations' measure from the treasury and fled to al-Zab, claimed that district's leadership, courted Harthama ibn A'yan who gave it to him, then counselled al-Rashid to reconcile him — al-Rashid pardoned him and gave him the Maghreb as a benefaction, so he stood over it and held it firm: the founder of Aghlabid rule in Ifriqiya."
