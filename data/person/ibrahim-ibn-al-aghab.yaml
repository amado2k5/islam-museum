id: person/ibrahim-ibn-al-aghab
class: person
label: { ar: "إبراهيم بن الأغلب" }
summary:
  ar: "عند البلاذري: من وجوه جند مصر وثب واثنا عشر رجلاً فأخذوا من بيت المال مقدار أرزاقهم فقط وهربوا إلى الزاب فاعتقد على جند تلك الناحية الرياسة ولاطف هرثمة بن أعين فولّاه ناحيته ثم أشار هرثمة على الرشيد باستصلاحه فصفح عنه وولّاه بلاد المغرب اصطناعاً فقام به وضبطه — مؤسس ولاية الأغالبة بإفريقية."
  en: "In al-Baladhuri: of Egypt's army notables; he rose with twelve men who took only their rations' measure from the treasury and fled to al-Zab, claimed that district's leadership, courted Harthama ibn A'yan who gave it to him, then counselled al-Rashid to reconcile him — al-Rashid pardoned him and gave him the Maghreb as a benefaction, so he stood over it and held it firm: the founder of Aghlabid rule in Ifriqiya."
  es: "En al-Baladhuri: de los notables del ejército egipcio; se levantó con doce hombres que solo tomaron sus raciones del tesoro y huyeron a al-Zab, reclamaron el liderazgo de ese distrito, cortejaron a Harthama ibn A'yan, quien se lo cedió, y luego aconsejaron a al-Rashid que lo reconciliara; al-Rashid lo perdonó y le dio el Magreb como una bendición, por lo que se mantuvo firme sobre él: el fundador del gobierno aglabí en Ifriqiya."
  fr: "Dans al-Baladhuri: parmi les notables de l'armée égyptienne, il se souleva avec douze hommes qui ne prirent que leur ration dans le trésor et s'enfuirent à al-Zab, revendiquèrent le commandement de ce district, courtisèrent Harthama ibn A'yan qui le lui céda, puis conseillèrent à al-Rashid de se réconcilier avec lui — al-Rashid le gracia et lui offrit le Maghreb en faveur, de sorte qu'il s'y installa et le conserva fermement: le fondateur du pouvoir aghlabide en Ifriqiya."
  ur: "البلادھوری میں: مصر کی فوج کے قابل ذکر؛ وہ بارہ آدمیوں کے ساتھ اٹھا جنہوں نے خزانے سے صرف اپنا راشن لیا اور الزاب کی طرف بھاگ گئے، دعویٰ کیا کہ ضلع کی قیادت نے حارثمہ بن عیان سے رجوع کیا جس نے اسے دیا، پھر الرشید کو اس سے صلح کرنے کا مشورہ دیا - الرشید نے اسے معاف کر دیا اور مغرب کو دیا، اور اس پر ثابت قدم رہا۔ افریقیہ میں اضلاب کی حکمرانی"
  tr: "El-Baladhuri'ye göre: Mısır'ın önde gelen askerleri arasında, geçimlerinin sadece bir kısmını kamu hazinesinden alan on iki adam vardı ve Zab'a kaçtılar. O önde gelen bölgenin askerlerine inanıyordu ve Harthama ibn A'yan'a iyi davrandı; A'yan onu lider olarak atadı. Bunun üzerine Harthama, el-Reşid'e onu rehabilite etmesini tavsiye etti, bu yüzden onu affedip yapay olarak Mağrip'e atadı, böylece onu atadı ve yakaladı—Efriqiye'deki Aglabid vilayetinin kurucusuydu."
  id: "Menurut al-Baladhuri: Di antara prajurit terkemuka Mesir terdapat dua belas pria, yang hanya mengambil sebagian mata pencaharian mereka dari kas negara dan melarikan diri ke Zab. Ia percaya pada tentara di wilayah utama itu, dan ia baik kepada Harthama ibn A'yan, yang mengangkatnya sebagai pemimpinnya. Kemudian Harthama menyarankan al-Rashid untuk merehabilitasinya, sehingga ia mengampuni dan mengangkatnya secara artifisial di Maghreb, sehingga ia menunjuk dan menangkapnya—pendiri provinsi Aghlabid di Ifriqiya."
