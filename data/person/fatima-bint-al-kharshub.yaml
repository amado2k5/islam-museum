summary:
  ar: "امرأة من بني أنمار في الجاهلية، أم الربيع بن زياد؛ قالت لابنها ما صار مثلاً: 'حسبك من شر سماعه'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
  en: "A woman of Banu Anmar in pre-Islamic times, mother of al-Rabi' ibn Ziyad; her words to her son became a proverb: 'hearing of evil is enough for you'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
  ur: "جاہلیت میں بنو انمار کی ایک عورت، ربیع بن زیاد کی والدہ؛ اپنے بیٹے سے کہی گئی بات مثل بن گئی: 'برائی کا سننا ہی تمہارے لیے کافی ہے'۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
