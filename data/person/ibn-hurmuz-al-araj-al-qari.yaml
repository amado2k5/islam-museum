label: { ar: "ابن هرمز الأعرج القارئ", en: "Ibn Hurmuz al-A'raj al-Qari", es: "Ibn Hurmuz al-A'raj al-Qari", fr: "Ibn Hurmuz al-A'raj al-Qari", ur: "ابن ہرمز العراج القاری" }
summary:
  ar: "ابن هرمز الأعرج القارئ؛ كان يقول خير سواحلكم رباطاً الإسكندرية فخرج إليها من المدينة مرابطاً فمات بها سنة سبع عشرة ومائة."
  en: "Ibn Hurmuz al-A'raj al-Qari; he used to say 'the best of your coasts for ribat is Alexandria', and went out to it from Medina as a murabit, dying there in year 117."
  es: "Ibn Hurmuz al-A'raj al-Qari solía decir: \"La mejor de vuestras costas para obtener beneficios es Alejandría\", y partió hacia allí desde Medina como murabit, muriendo allí en el año 117."
  fr: "Ibn Hurmuz al-A'raj al-Qari; il disait: « La meilleure de vos côtes pour le ribat est Alexandrie », et il s'y rendit depuis Médine en tant que murabit, y mourant en l'an 117."
  ur: "ابن ہرمز العراج القاری؛ وہ کہتے تھے کہ رباط کے لیے تمہارے ساحلوں میں سب سے بہتر اسکندریہ ہے، اور مدینہ سے مربی کی حیثیت سے اس کی طرف نکلے اور وہیں سن 117 میں وفات پائی۔"
  tr: "Topal okuyan İbn Hürmoz; kıyılarınızın en iyi kıyısının İskenderiye ribatı olduğunu söylerdi, bu yüzden Medine'yi orada bıraktı ve 170 Hicri yılında orada öldü."
  id: "Ibn Hormoz si pembaca yang lemah; dia dulu berkata pantai terbaik di pantaimu adalah Alexandria ribat, jadi dia meninggalkan Madinah yang ditempatkan di sana dan meninggal di sana pada tahun 170 H."
