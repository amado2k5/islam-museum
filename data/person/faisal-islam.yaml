  ar: "صحفي بريطاني، وُلد في مانشستر سنة 1977 لأبوين بنغاليين من غرب البنغال. عمل مراسلًا في «ذا أوبزرفر» ثم محررًا للاقتصاد في أخبار القناة الرابعة ومحررًا سياسيًا لسكاي نيوز، وهو منذ 2019 محرر الاقتصاد في بي بي سي نيوز ويقدّم أحيانًا برنامج «نيوزنايت»."
