summary:
  ar: "زعيم ديني وسياسي سوداني (1873-1968)، رأس الطريقة الختمية الصوفية وأسرة المراغنة في السودان ومصر وإريتريا. تحالف مع الحكومة الأنجلو-مصرية ضد الدولة المهدية، وقاد معسكر «وحدة وادي النيل» المؤيد للاتحاد مع مصر، وأسس الحزب الديمقراطي الشعبي سنة 1956 بعد انشقاقه عن الحزب الوطني الاتحادي، وبقي زعيما للطريقة حتى وفاته بالخرطوم بحري."
  en: "Sudanese religious and political leader (1873–1968), head of the Khatmiyya Sufi order and of the Maraghna family in Sudan, Egypt and Eritrea. He allied with the Anglo-Egyptian government against the Mahdist state, led the 'Unity of the Nile Valley' camp favouring union with Egypt, founded the People's Democratic Party in 1956 after splitting from the National Unionist Party, and remained head of the order until his death at Khartoum Bahri."
  ur: "سوڈانی دینی و سیاسی رہنما (1873-1968)، سلسلۂ ختمیہ صوفیہ اور مراغنہ خاندان کے سربراہ۔ انہوں نے مہدیہ ریاست کے خلاف اینگلو۔مصری حکومت کا ساتھ دیا، مصر سے اتحاد کے حامی ’’وحدتِ وادیِ نیل‘‘ کے دھڑے کی قیادت کی، 1956 میں نیشنل یونینسٹ پارٹی سے الگ ہو کر پیپلز ڈیموکریٹک پارٹی بنائی، اور خرطوم بحری میں اپنی وفات تک سلسلے کے سربراہ رہے۔"
