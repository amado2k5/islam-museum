summary:
  ar: "عالم ومناظر وكاتب وصحفي هندي ثم باكستاني (1868-1948) من أمرتسر في البنجاب، ومن أبرز قادة حركة أهل الحديث في الهند. درس في مظاهر علوم ودار العلوم ديوبند، وأسّس مطبعة أهل الحديث وصحيفته الأسبوعية «أهل الحديث» سنة 1903 فصدرت نحو 44 سنة، وتولى الأمانة العامة لجمعية أهل الحديث لعموم الهند (1906-1947)، واشتهر بمناظراته وكتبه في الرد على القاديانية والآريا سماج، ومنها «تفسير الثنائي» و«تاريخ مرزا». هاجر بعد تقسيم الهند سنة 1947 إلى باكستان وتوفي في سرغودها."
  en: "Indian, later Pakistani, scholar, debater, writer and journalist (1868–1948) of Amritsar in Punjab, and a leading figure of the Ahl-e-Hadith movement in India. He studied at Mazahir Uloom and Darul Uloom Deoband, founded the Ahl-e-Hadith Press and its weekly journal Ahl-e-Hadith in 1903, which ran for about 44 years, served as general secretary of the All India Jamiat-i-Ahl-i-Hadith (1906–1947), and was known for his debates and books against the Ahmadiyya and the Arya Samaj, among them the Tafsir-e-Sanai and Tareekh-e-Mirza. After the Partition of India in 1947 he migrated to Pakistan and died at Sargodha."
  ur: "ہندوستانی، بعد ازاں پاکستانی عالم، مناظر، مصنف اور صحافی (1868ء–1948ء) جن کا تعلق پنجاب کے امرتسر سے تھا اور جو ہندوستان میں تحریک اہل حدیث کے سرکردہ رہنما تھے۔ انہوں نے مظاہر علوم اور دارالعلوم دیوبند میں تعلیم حاصل کی، 1903ء میں اہل حدیث پریس اور ہفت روزہ «اہل حدیث» جاری کیا جو تقریباً 44 سال جاری رہا، آل انڈیا جمعیت اہل حدیث کے جنرل سیکرٹری رہے (1906ء–1947ء)، اور قادیانیت اور آریہ سماج کے رد میں اپنی مناظروں اور کتابوں، جن میں «تفسیر ثنائی» اور «تاریخ مرزا» شامل ہیں، کے لیے مشہور ہوئے۔ تقسیم ہند کے بعد پاکستان ہجرت کی اور سرگودھا میں وفات پائی۔"
