label:
  ar: "أحمد بن كليب الشاعر"
  en: "Ahmad ibn Kulayb the poet"
summary:
  ar: "شاعر بغدادي هام بأسلم بن أحمد حتى فشت أشعاره فيه على الألسنة وتُوُشِّد بها في المحافل، حتى لعهد ابن الجوزي بعرس تُزمّر فيه أبياته «وأسلمني في هوى أسلم هذا الرشا». فانقطع أسلم عن مجالس الطلب ولزم بيته، وصار ابن كليب لا يشغل هالًا بالمرور على باب داره نهاره كله، حتى إذا اختلط الظلام خرج أسلم مستروحًا. فتحيّل ابن كليب في بعض الليالي فلبس جبة صوف من جباب أهل البادية واعتمر بمثل عمامتهم وأخذ بإحدى يديه دجاجة وبالأخرى قفصًا فيه بيض، وتقدم إلى أسلم فقبّل يده وقال «يا مولاي من يقبض هذا؟» وزعم أنه أجيره في ضيعة سماها — وكان يعرف أسماء ضياعه والعاملين فيها — فلما كلّمه عن حال الضيعة أنكر الكلام فتأمله فعرفه، وقال له: «والله لا أفارق بعد هذه الليلة قعر منزلي ولا أجلس بعدها على بابي ليلًا ولا نهارًا». فقيل لابن كليب قد خسرت دجاجك وبيضك، فقال: «أنال كل ليلة قبلة يده وأخسر أضعاف ذلك». ثم نهكته العلة وأضجعه المرض حتى إن شيخًا سأله عن دوائه فقال «نظرة من أسلم»، فاستأذن الشيخ أسلمًا وألحّ عليه حتى وعد بالعيادة، ومضى معه راجلًا يومئذ ووقف في وسط الزقاق محمرًا خجلًا حتى تمّت الزيارة {cite:muntazam-ibn-al-jawzi j.8 p.425-427}."
  en: "A Baghdadi poet whose passion for Aslam ibn Ahmad spread so far that the muezzin's musicians played his 'wa-aslamuni fi hawa Aslam' at weddings, driving Aslam to quit all gatherings and sit at home. Ibn Kulayb came by night disguised as an estate-worker — wool jubba, a hen in one hand, a basket of eggs in the other — kissed Aslam's hand and was recognized; 'you lost your chickens and eggs', friends teased — 'a kiss of his hand every night and I'd lose more'. When longing drove him to a sickbed, his only cure proved 'a look from Aslam', whom a shaykh persuaded to the sick-visit {cite:muntazam-ibn-al-jawzi j.8 p.425-427}."
