label:
  ar: "أحمد بن كليب الشاعر"
  en: "Ahmad ibn Kulayb the poet"
  es: "Ahmad ibn Kulayb the poet"
  fr: "Ahmad ibn Kulayb the poet"
  ur: "احمد بن کلیب شاعر"
summary:
  ar: "شاعر بغدادي هام بأسلم بن أحمد حتى فشت أشعاره فيه على الألسنة وتُوُشِّد بها في المحافل، حتى لعهد ابن الجوزي بعرس تُزمّر فيه أبياته «وأسلمني في هوى أسلم هذا الرشا». فانقطع أسلم عن مجالس الطلب ولزم بيته، وصار ابن كليب لا يشغل هالًا بالمرور على باب داره نهاره كله، حتى إذا اختلط الظلام خرج أسلم مستروحًا. فتحيّل ابن كليب في بعض الليالي فلبس جبة صوف من جباب أهل البادية واعتمر بمثل عمامتهم وأخذ بإحدى يديه دجاجة وبالأخرى قفصًا فيه بيض، وتقدم إلى أسلم فقبّل يده وقال «يا مولاي من يقبض هذا؟» وزعم أنه أجيره في ضيعة سماها — وكان يعرف أسماء ضياعه والعاملين فيها — فلما كلّمه عن حال الضيعة أنكر الكلام فتأمله فعرفه، وقال له: «والله لا أفارق بعد هذه الليلة قعر منزلي ولا أجلس بعدها على بابي ليلًا ولا نهارًا». فقيل لابن كليب قد خسرت دجاجك وبيضك، فقال: «أنال كل ليلة قبلة يده وأخسر أضعاف ذلك». ثم نهكته العلة وأضجعه المرض حتى إن شيخًا سأله عن دوائه فقال «نظرة من أسلم»، فاستأذن الشيخ أسلمًا وألحّ عليه حتى وعد بالعيادة، ومضى معه راجلًا يومئذ ووقف في وسط الزقاق محمرًا خجلًا حتى تمّت الزيارة {cite:muntazam-ibn-al-jawzi j.8 p.425-427}."
  en: "A Baghdadi poet whose passion for Aslam ibn Ahmad spread so far that the muezzin's musicians played his 'wa-aslamuni fi hawa Aslam' at weddings, driving Aslam to quit all gatherings and sit at home. Ibn Kulayb came by night disguised as an estate-worker — wool jubba, a hen in one hand, a basket of eggs in the other — kissed Aslam's hand and was recognized; 'you lost your chickens and eggs', friends teased — 'a kiss of his hand every night and I'd lose more'. When longing drove him to a sickbed, his only cure proved 'a look from Aslam', whom a shaykh persuaded to the sick-visit {cite:muntazam-ibn-al-jawzi j.8 p.425-427}."
  es: "Un poeta de Bagdad cuya pasión por Aslam ibn Ahmad se extendió tanto que los músicos del muecín tocaban su «wa-aslamuni fi hawa Aslam» en las bodas, lo que llevó a Aslam a abandonar todas las reuniones y quedarse en casa. Ibn Kulayb llegó de noche disfrazado de trabajador de una finca —con una túnica de lana, una gallina en una mano y una cesta de huevos en la otra—, besó la mano de Aslam y fue reconocido; «perdiste tus gallinas y tus huevos», bromeaban sus amigos, «un beso suyo cada noche y perdería más». Cuando la añoranza lo llevó a la cama, su único remedio fue «una mirada de Aslam», a quien un jeque persuadió para que lo visitara enfermo {cite:muntazam-ibn-al-jawzi j.8 p.425-427}."
  fr: "Un poète bagdadien, dont la passion pour Aslam ibn Ahmad était si répandue que les musiciens du muezzin jouaient son poème « wa-aslamuni fi hawa Aslam » lors des mariages, poussa Aslam à se retirer de toute assemblée et à rester chez lui. Ibn Kulayb venait de nuit, déguisé en ouvrier agricole – une djellaba de laine, une poule dans une main, un panier d'œufs dans l'autre –, baisait la main d'Aslam et fut reconnu; « tu as perdu tes poules et tes œufs », plaisantaient ses amis – « un baiser de sa main chaque soir et j'en perdrais davantage ». Lorsque le désir le cloua au lit, son seul remède fut « un regard d'Aslam », qu'un cheikh persuada de lui rendre visite."
  ur: "ایک بغدادی شاعر جس کا اسلم ابن احمد کا جذبہ اس حد تک پھیل گیا کہ موذن کے موسیقاروں نے شادیوں میں اس کا 'و اسلمونی فی ہوا اسلم' بجایا، اسلم کو تمام محفلیں چھوڑ کر گھر بیٹھنے پر مجبور کیا۔ ابن کلیب رات کو ایک اسٹیٹ ورکر کے بھیس میں آیا - ایک ہاتھ میں اون جبہ، ایک مرغی، دوسرے میں انڈوں کی ٹوکری - اسلم کے ہاتھ کو چوما اور پہچانا گیا۔ 'تم نے اپنی مرغیاں اور انڈے کھو دیے'، دوستوں نے چھیڑا - 'ہر رات اس کے ہاتھ کا بوسہ اور میں مزید کھوؤں گا'۔ جب تمنا اسے بستر پر لے گئی تو اس کا واحد علاج 'اسلم سے ایک نظر' ثابت ہوا، جسے ایک شیخ نے بیمار کی عیادت کے لیے آمادہ کیا۔"
  tr: "Bağdatlı bir şair, Aslam ibn Ahmed'e o kadar hayran kalmıştı ki, onun hakkında yazdığı şiirler toplantılarda yaygın olarak okunup söylenmeye başlandı. Hatta İbn el-Cevzi, \"Ve Aslam beni bu sallanan aşkına teslim etti\" dizelerinin çalındığı bir düğünü hatırlamıştır. Bunun üzerine Aslam, ilim çevrelerinden çekilip evde kaldı. Bu sırada İbn Kulayb, günlerini Aslam'ın kapısının önünden geçerek, ancak gece çöktüğünde, dinlenmek için dışarı çıkarak geçiriyordu. Bir gece İbn Kulayb bir plan kurdu. Bedevilerin giydiği gibi yün bir elbise giydi, kendine benzer bir sarık taktı ve bir elinde bir tavuk, diğer elinde bir kafes yumurta taşıdı. Aslam'a yaklaştı, elini öptü ve \"Efendim, bunu kim kabul eder?\" diye sordu. Aslam'ın adını verdiği bir çiftlikte çalışanı olduğunu iddia etti; çünkü çiftliklerinin ve çalışanlarının isimlerini biliyordu. Aslam çiftliğin durumu hakkında bilgi istediğinde, İbn Kulayb onun sözlerini sorguladı. Daha yakından incelediğinde Aslam'ı tanıdı ve şöyle dedi: \"Allah'a yemin ederim ki, bu geceden sonra evimin derinliklerinden çıkmayacağım, ne gece ne de gündüz kapımın önünde oturmayacağım.\" İbn Kulayb'a, \"Tavuklarını ve yumurtalarını kaybettin\" denildi. O da, \"Her gece elinden bir öpücük alıyorum ve bunun kat kat fazlasını kaybediyorum\" diye cevap verdi. Sonra hastalık onu zayıflattı ve yatağa mahkum etti, ta ki yaşlı bir adam ona şifasını sorana kadar. O da, \"Aslam'ın bir bakışı\" diye cevap verdi. Bunun üzerine yaşlı adam Aslam'dan izin istedi ve onu ziyaret edeceğine söz verene kadar ısrar etti. O gün onunla birlikte yürüyerek gitti ve ziyaret tamamlanana kadar utançtan kızararak sokağın ortasında durdu. {cite:muntazam-ibn-al-jawzi j.8 p.425-427}"
  id: "Seorang penyair Baghdadi begitu terpikat dengan Aslam ibn Ahmad sehingga puisi-puisinya tentang beliau banyak dibacakan dan dinyanyikan di berbagai pertemuan. Bahkan Ibn al-Jawzi mengenang sebuah pernikahan di mana syair-syairnya, \"Dan Aslam menyerahkanku pada cintanya, yang bergoyang-goyang ini,\" diputar. Aslam kemudian menarik diri dari pertemuan-pertemuan ilmiah dan tinggal di rumah. Sementara itu, Ibn Kulayb menghabiskan hari-harinya melewati pintu rumah Aslam, hanya keluar saat senja, mencari ketenangan. Suatu malam, Ibn Kulayb merancang sebuah rencana. Ia mengenakan jubah wol seperti yang dikenakan oleh orang Badui, membungkus dirinya dengan sorban serupa, dan membawa seekor ayam betina di satu tangan dan sangkar telur di tangan lainnya. Ia mendekati Aslam, mencium tangannya, dan bertanya, \"Tuanku, siapa yang menerima ini?\" Ia mengaku sebagai karyawan Aslam di sebuah pertanian yang ia sebutkan—karena ia mengetahui nama-nama pertanian dan para pekerjanya. Ketika Aslam menanyakan kondisi pertanian tersebut, Ibn Kulayb mempertanyakan kata-katanya. Setelah diperiksa lebih teliti, ia mengenali Aslam dan menyatakan, \"Demi Allah, setelah malam ini, aku tidak akan meninggalkan kedalaman rumahku, dan aku tidak akan pernah duduk di depan pintuku lagi, baik siang maupun malam.\" Dikatakan kepada Ibnu Kulayb, \"Kau telah kehilangan ayam dan telurmu.\" Ia menjawab, \"Aku menerima ciuman dari tangannya setiap malam, dan aku kehilangan berkali-kali lipat dari itu.\" Kemudian penyakit melemahkannya dan membuatnya terbaring di tempat tidur, sampai seorang lelaki tua bertanya kepadanya tentang kesembuhannya. Ia menjawab, \"Sebuah tatapan dari Aslam.\" Maka lelaki tua itu meminta izin kepada Aslam dan terus mendesak sampai Aslam berjanji untuk mengunjunginya. Ia pergi bersamanya berjalan kaki hari itu dan berdiri di tengah gang, tersipu malu, sampai kunjungan selesai. {cite:muntazam-ibn-al-jawzi j.8 p.425-427}"
