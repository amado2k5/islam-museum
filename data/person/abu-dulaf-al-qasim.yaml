id: person/abu-dulaf-al-qasim
class: person
label: { ar: "أبو دلف القاسم بن عيسى", en: "Abu Dulaf al-Qasim ibn Isa", fr: "Abu Dulaf al-Qasim ibn Isa", es: "Abu Dulaf al-Qasim ibn Isa", ur: "ابودلف القاسم ابن عیسیٰ" }
summary:
  ar: "أبو دلف القاسم بن عيسى العجلي أمير الكرج وقائد المعتصم؛ غزا الديلم في خلافة المأمون وكان والياً في خلافة المعتصم أيام ولاية الأفشين الجبال ففتح حصون الديلم إقلسم وبومج والإبلام وأنداق. ودخل على المأمون فامتحنه بأبياته في صفة الحرب لسل السيوف وشق الصفوف فقال هذه لذتي مع أعدائك وقوتي مع أوليائك، وسأله عن غزله أيها الراقد المؤرق عيني فقال سهوة بعد سهرة غلبت {cite:muruj-al-dhahab p. 400-401}، ومات سنة ست وعشرين ومائتين وكان سيد أهله ورئيس عشيرته من عجل وربيعة شاعراً مجيداً شجاعاً بطلاً مغنياً مصيباً، وذكر أنه طعن فارساً فنفذت الطعنة إلى فارس خلفه فقتلهما {cite:muruj-al-dhahab p. 451-452}"
  en: "Abu Dulaf al-Qasim ibn Isa al-Ijli, lord of al-Karaj and al-Mu'tasim's commander; he raided Daylam under al-Ma'mun and governed in al-Mu'tasim's reign during al-Afshin's Jibal command, taking the Daylam forts of Iqlism, Bumaj, al-Iblam and Andaq."
  fr: "Abu Dulaf al-Qasim ibn Isa al-Ijli, seigneur d'al-Karaj et chef militaire d'al-Mu'tasim ; il fit campagne au Daylam sous al-Ma'mun et fut gouverneur sous le règne d'al-Mu'tasim pendant le commandement d'al-Afshin sur le Jibal, prenant les forts daylamites d'Iqlism, Bumaj, al-Iblam et Andaq."
  es: "Abu Dulaf al-Qasim ibn Isa al-Ijli, señor de al-Karaj y comandante de al-Mu'tasim; atacó Daylam bajo al-Ma'mun y gobernó durante el reinado de al-Mu'tasim durante el mando Jibal de al-Afshin, tomando los fuertes Daylam de Iqlism, Bumaj, al-Iblam y Andaq."
  ur: "ابو دلف القاسم ابن عیسیٰ الاجلی، الکراج کا رب اور المعتصم کا کمانڈر؛ اس نے المامون کے ماتحت دیلام پر چھاپہ مارا اور المعتصم کے دور میں الافشین کے جبل کی کمان میں حکومت کی اور اقلیت، بومج، البلام اور عندق کے دیلم قلعوں کو لے لیا۔"
  tr: "Karaj Emiri ve Mu'tasim komutanı Ebu Dulaf el-Kasım ibn İsa el-Ajli, Ma'mun halifeliği döneminde Delamîlere karşı bir sefer düzenledi. Mu'tasim döneminde, özellikle Afşin valiliği sırasında vali olarak görev yaptı ve Delamîlerin İklasam, Bumaj, İblam ve Andak kalelerini fethetti. Ma'mun'un huzuruna çıktığında, Ma'mun onu savaş, kılıç çekme ve safların dağılmasıyla ilgili şiirleriyle sınadı. \"Bu, düşmanlarınız karşısında zevkim, müttefikleriniz karşısında ise gücümdür\" diye cevap verdi. Ma'mun daha sonra ona \"Ey uykusuz, gözlerimi uyanık tutan\" aşk şiirini sordu, o da \"Bir anlık unutkanlık beni sardı\" diye cevap verdi. Hicri 226 yılında vefat etti. O, halkının lideri ve kabilesinin reisiydi; 'Ajl ve Rabi'ah kabilesindendi, yetenekli bir şair, cesur, kahraman ve güzel konuşan bir şarkıcıydı. Rivayete göre bir atlıyı bıçaklamış ve yara arkasındaki diğer atlıya da saplanarak ikisini de öldürmüştür."
  id: "Abu Dulaf al-Qasim ibn Isa al-Ajli, Emir Karaj dan komandan al-Mu'tasim, memimpin kampanye melawan Daylamiyah selama kekhalifahan al-Ma'mun. Ia menjabat sebagai gubernur selama pemerintahan al-Mu'tasim, khususnya selama masa pemerintahan al-Afshin, dan menaklukkan benteng-benteng Daylamiyah di Iqlasam, Bumaj, al-Iblam, dan Andaq. Ia menghadap al-Ma'mun, yang mengujinya dengan syair-syairnya yang menggambarkan perang, penghunusan pedang, dan perpecahan barisan. Ia menjawab, \"Inilah kesenanganku bersama musuh-musuhmu dan kekuatanku bersama sekutu-sekutumu.\" Al-Ma'mun kemudian bertanya kepadanya tentang syair cintanya, \"Wahai orang yang tak pernah tidur, yang menjaga mataku tetap terjaga,\" yang dijawabnya, \"Kelupaan sesaat setelah berjaga-jaga telah menghampiriku.\" Ia wafat pada tahun 226 H. Dia adalah pemimpin kaumnya dan kepala sukunya, 'Ajl dan Rabi'ah, seorang penyair ulung, pemberani, heroik, dan penyanyi yang fasih. Dikatakan bahwa dia menikam seorang penunggang kuda, dan luka itu menembus ke penunggang kuda lain di belakangnya, membunuh mereka berdua."
