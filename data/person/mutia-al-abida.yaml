summary:
  ar: "عابدة من البصرة أقامت في الجبّان أربعاً وخمسين سنة؛ يروي ابن الجوزي في «صفة الصفوة» أنها بكت أربعين عاماً وقالت: لا أزال أبكي حتى أعلم على أي الحالين أنا عند الله."
  en: "A devout woman of Basra who lived fifty-four years among the tombs of the city's cemetery; Ibn al-Jawzi's Sifat al-Safwa says she wept for forty years and said, 'I shall not stop weeping until I know which of the two states I am in before God.'"
  ur: "بصرہ کی ایک عابدہ جو چوّن سال قبرستان ⁦(جبّان)⁩ میں رہیں؛ ابن الجوزی کی «صفۃ الصفوہ» کہتی ہے کہ وہ چالیس سال روئیں اور کہا: «میں روتی رہوں گی یہاں تک کہ جان لوں کہ اللہ کے ہاں دونوں حالتوں میں سے کس پر ہوں»۔"
