summary:
  ar: "شاعر وروائي ومحرر إيراني أمريكي، وُلد في طهران سنة 1989. من أعماله مجموعتا الشعر «مناداة الذئب ذئبًا» و«جرس الحاج» والرواية الأكثر مبيعًا «شهيد!» (2024)، ويدير برنامج الكتابة الإبداعية في جامعة آيوا ويحرر قسم الشعر في مجلة «ذا نيشن»."
  en: "Iranian-American poet, novelist and editor, born in Tehran in 1989. He is the author of the poetry collections Calling a Wolf a Wolf and Pilgrim Bell and of the bestselling novel Martyr! (2024); he directs the undergraduate creative writing programme at the University of Iowa and is poetry editor of The Nation."
  ur: "ایرانی نژاد امریکی شاعر، ناول نگار اور مدیر، 1989 میں تہران میں پیدا ہوئے۔ ان کے شعری مجموعے «کالنگ اے وولف اے وولف» اور «پلگرم بیل» اور سب سے زیادہ فروخت ہونے والا ناول «مارٹر!» (2024) معروف ہیں؛ وہ یونیورسٹی آف آئیووا میں انڈرگریجویٹ تخلیقی تحریر کے پروگرام کے ڈائریکٹر اور «دی نیشن» کے شاعری مدیر ہیں۔"
  es: "Poeta, novelista y editor iraní-estadounidense, nacido en Teherán en 1989. Es autor de los poemarios Calling a Wolf a Wolf y Pilgrim Bell, y de la exitosa novela Martyr! (2024); dirige el programa de escritura creativa para estudiantes de pregrado en la Universidad de Iowa y es editor de poesía de The Nation."
  fr: "Poète, romancier et éditeur irano-américain, né à Téhéran en 1989. Il est l'auteur des recueils de poésie Calling a Wolf a Wolf et Pilgrim Bell et du roman à succès Martyr! (2024); il dirige le programme d'écriture créative de premier cycle à l'Université de l'Iowa et est rédacteur en chef de la section poésie de The Nation."
  tr: "1989 yılında Tahran'da doğmuş İran-Amerikalı şair, romancı ve editör. Eserleri arasında \"Kurt Kurta Çağrılıyor\" ve \"Hacı Çanı\" adlı şiir koleksiyonları ile çok satan roman \"Martyr!\" yer almaktadır. (2024). Iowa Üniversitesi'nde yaratıcı yazarlık programını yönetmekte ve The Nation dergisinin şiir bölümünü düzenlemektedir."
  id: "Seorang penyair, novelis, dan editor Iran-Amerika, lahir di Teheran pada tahun 1989. Karyanya meliputi kumpulan puisi \"The Wolf Calling to a Wolf\" dan \"The Pilgrim's Bell,\" serta novel terlaris \"Martyr!\" (2024). Ia mengelola program penulisan kreatif di University of Iowa dan mengedit bagian puisi untuk majalah The Nation."
