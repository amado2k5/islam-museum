summary:
  ar: "شاعر وروائي ومحرر إيراني أمريكي، وُلد في طهران سنة 1989. من أعماله مجموعتا الشعر «مناداة الذئب ذئبًا» و«جرس الحاج» والرواية الأكثر مبيعًا «شهيد!» (2024)، ويدير برنامج الكتابة الإبداعية في جامعة آيوا ويحرر قسم الشعر في مجلة «ذا نيشن»."
  en: "Iranian-American poet, novelist and editor, born in Tehran in 1989. He is the author of the poetry collections Calling a Wolf a Wolf and Pilgrim Bell and of the bestselling novel Martyr! (2024); he directs the undergraduate creative writing programme at the University of Iowa and is poetry editor of The Nation."
  ur: "ایرانی نژاد امریکی شاعر، ناول نگار اور مدیر، 1989 میں تہران میں پیدا ہوئے۔ ان کے شعری مجموعے «کالنگ اے وولف اے وولف» اور «پلگرم بیل» اور سب سے زیادہ فروخت ہونے والا ناول «مارٹر!» (2024) معروف ہیں؛ وہ یونیورسٹی آف آئیووا میں انڈرگریجویٹ تخلیقی تحریر کے پروگرام کے ڈائریکٹر اور «دی نیشن» کے شاعری مدیر ہیں۔"
