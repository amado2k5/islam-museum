summary:
  ar: "تغلبي؛ كان على جمع لبني تغلب بالمضيح والمصيد مرتدين حين أتاهم خالد بن الوليد في طريقه من العراق إلى الشام فقاتلوه فهزمهم وسبى وغنم وبعث بالسبي إلى أبي بكر وكانت منهم أم حبيب الصهباء."
  en: "A Taghlibi; he led a gathering of Banu Taghlib in apostasy at al-Mudayyih and al-Musayyid when Khalid ibn al-Walid came upon them on his way from Iraq to Syria — they fought him and he defeated them, taking captives and spoil which he sent to Abu Bakr, among them Umm Habib al-Sahba'."
  es: "Un taghlibi; dirigió una reunión de Banu Taghlib en apostasía en al-Mudayyih y al-Musayyid cuando Khalid ibn al-Walid los encontró en su camino de Irak a Siria; lucharon contra él y los derrotó, tomando cautivos y botín que envió a Abu Bakr, entre ellos Umm Habib al-Sahba'."
  fr: "Un Taghlibi; il dirigeait un rassemblement de Banu Taghlib en apostasie à al-Mudayyih et al-Musayyid lorsque Khalid ibn al-Walid les rencontra sur son chemin d'Irak vers la Syrie — ils le combattirent et il les vainquit, prenant des captifs et du butin qu'il envoya à Abu Bakr, parmi lesquels Umm Habib al-Sahba'."
  ur: "تغلبی؛ اس نے بنو تغلب کے ایک اجتماع کی امامت ارتداد میں المدیہ اور المسید میں کی جب خالد بن ولید عراق سے شام جاتے ہوئے ان پر آئے - انہوں نے ان سے جنگ کی اور اس نے ان کو شکست دی اور اسیر اور مال غنیمت لے لیا جو اس نے ابوبکر کے پاس بھیجا تھا، ان میں ام حبیب الصحابہ بھی تھیں۔"
  tr: "Taghlib; Halid bin el-Velid, Irak'tan Levant'a giderken onlara geldiğinde bir grup Banu Taghlib'i kurban ve avcılıkla yönetti; dinden dönmüşlerdi. Onunla savaştılar, onları yendiler, ganimetleri ele geçirdiler ve Habib al-Sahba'nın annesi de dahil olmak üzere Ebu Bekir'e esirler gönderdiler."
  id: "Taghlib; ia memimpin sekelompok Banu Taghlib dengan korban dan perburuan, murtad ketika Khalid ibn al-Walid datang kepada mereka dalam perjalanan dari Irak ke Levant. Mereka melawannya, mengalahkan mereka, merebut rampasan, dan mengirim tawanan ke Abu Bakr, di antaranya ibu Habib al-Sahba."
