summary:
  ar: "مانويل الثاني إمبراطور بيزنطة في عهدي محمد الأول ومراد الثاني. يذكر الصلابي أنه كان خلف الدسائس والمؤامرات ضد الدولة العثمانية، فدعم الأمير مصطفى عم مراد الثاني بالمساعدات حتى حاصر غاليبولي، واحتضن شقيقاً لمراد وجعله على رأس قوة استولت على نيقية في الأناضول، فقضى عليه مراد وقتله {cite:dawlat-uthmaniyya-salabi p. 79}. ويذكر الكتاب أنه استنجد بأوروبا دون جدوى حين طالبه بايزيد الأول بتسليم القسطنطينية {cite:dawlat-uthmaniyya-salabi p. 68}."
  en: "Manuel II Palaiologos, Byzantine emperor through the reigns of Mehmed I and Murad II — in al-Sallabi's account the hand behind the intrigues against the Ottoman throne: funding Prince Mustafa's rising to the siege of Gallipoli, then harbouring another brother of Murad who seized Nicomedia before Murad destroyed him {cite:dawlat-uthmaniyya-salabi p. 79}. The book also has him fruitlessly appealing to Europe when Bayezid I demanded Constantinople's surrender {cite:dawlat-uthmaniyya-salabi p. 68}."
