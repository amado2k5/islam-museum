id: person/mukhtar-ibn-mahmud-al-zahidi
class: person
gender: male
label:
  ar: مختار بن محمود الزاهدي (نجم الدين)
  en: Mukhtar ibn Mahmud al-Zahidi (Najm al-Din, Hanafi jurist)
summary:
  ar: فقيه حنفي وأصولي وفرضي من عزمين من قرى خوارزم؛ تفقه على علاء الدين سديد بن محمد الخياطي ومحمد بن عبد الكريم التركستاني وناصر الدين المطرزي. من تصانيفه الحاوي في الفتاوى، والمجتبى شرح فيه مختصر القدوري، وزاد الأئمة، وقنية المنية، والجامع في الحيض، وكتاب الفرائض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7839}
  en: A Hanafi jurist, usuli and expert in inheritance, of Azmin, a town of Khwarazm; studied under Ala al-Din Sadid ibn Muhammad al-Khayyati, Muhammad ibn Abd al-Karim al-Turkistani and Nasir al-Din al-Mutarrizi. Works include al-Hawi fi al-Fatawa, al-Mujtaba (a commentary on al-Quduri) and Qunyat al-Munya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7839}
  ur: حنفی فقیہ، اصولی اور علم الفرائض کے ماہر؛ خوارزم کے عزمین سے؛ علاء الدین سدید بن محمد الخیاطی وغیرہ سے پڑھا؛ تصانیف میں الحاوی فی الفتاوی، المجتبی (قدوری کی شرح)، قنیۃ المنیہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7838}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7839}
