summary:
  ar: "عبد الله بن نافع بن الحارث بن كلدة الثقفي؛ أبى وإخوته بيع دار أبيهم الملاصقة لجامع البصرة فهدم عبيد الله بن زياد منها ما سوي به تربيع المسجد وهو بقصره الأبيض الذي على البطيحة ثم أرضاه بأن أعطاه بكل ذراع خمسة أذرع وفتح له في الحائط خوخة إلى المسجد."
  en: "Abdallah ibn Nafi' ibn al-Harith al-Thaqafi; he and his brothers refused the sale of their father's house beside the mosque, so Ubaydallah ibn Ziyad demolished what the mosque's squaring needed while he was at his white castle on the Batiha, then appeased him five cubits for each plus a khawkha-window into the mosque."
