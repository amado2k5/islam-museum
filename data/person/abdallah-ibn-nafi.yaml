class: person
label: { ar: "عبد الله بن نافع", en: "Abdallah ibn Nafi'", fr: "Abdallah ibn Nafi'", es: "Abdallah ibn Nafi'", ur: "عبداللہ بن نافع" }
summary:
  ar: "عبد الله بن نافع بن الحارث بن كلدة الثقفي؛ أبى وإخوته بيع دار أبيهم الملاصقة لجامع البصرة فهدم عبيد الله بن زياد منها ما سوي به تربيع المسجد وهو بقصره الأبيض الذي على البطيحة ثم أرضاه بأن أعطاه بكل ذراع خمسة أذرع وفتح له في الحائط خوخة إلى المسجد."
  en: "Abdallah ibn Nafi' ibn al-Harith al-Thaqafi; he and his brothers refused the sale of their father's house beside the mosque, so Ubaydallah ibn Ziyad demolished what the mosque's squaring needed while he was at his white castle on the Batiha, then appeased him five cubits for each plus a khawkha-window into the mosque."
  fr: "Abdallah ibn Nafi' ibn al-Harith al-Thaqafi ; lui et ses frères refusèrent de vendre la maison de leur père contiguë à la mosquée ; Ubaydallah ibn Ziyad en démolit ce qu'exigeait la mise au carré de la mosquée pendant qu'il était dans son château blanc sur la Batiha, puis les apaisa avec cinq coudées pour chacune et une petite fenêtre ouvrant sur la mosquée."
  es: "Abdallah ibn Nafi' ibn al-Harith al-Thaqafi; él y sus hermanos se negaron a vender la casa de su padre junto a la mezquita, por lo que Ubaydallah ibn Ziyad demolió lo que necesitaba la plaza de la mezquita mientras estaba en su castillo blanco en Batiha, y luego le ofreció cinco codos por cada uno más una ventana khawkha en la mezquita."
  ur: "عبداللہ بن نافع ابن الحارث ثقفی؛ اس نے اور اس کے بھائیوں نے مسجد کے ساتھ والے اپنے والد کے گھر کو فروخت کرنے سے انکار کر دیا، چنانچہ عبیداللہ ابن زیاد نے مسجد کے مربع کو جس چیز کی ضرورت تھی اس کو منہدم کر دیا جب وہ بطیحہ پر اپنے سفید قلعے میں تھے، پھر اسے مسجد میں ہر ایک کے بدلے پانچ ہاتھ اور ایک کھڑکی کے ساتھ مسواک کر دی۔"
