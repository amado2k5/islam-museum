class: person
label: { ar: "الفادوسفان", en: "al-Fadhusfan", fr: "Al-Fadhusfan", es: "al-Fadhusfan", ur: "الفدھوسفان" }
summary:
  ar: "مرزبان أصبهان الشيخ المسن؛ عند البلاذري عاصره ابن بديل فكاتب أهل المدينة فخذلوه فخرج بثلاثين رماة هارباً يريد كرمان ليلحق يزدجرد فاتبعه ابن بديل فبارزه فوقعت ضربته على قربوس سرجه فكسرته فعرض عليه الصلح عن أهل بلده فقبل وأسلم المدينة وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم."
  en: "Isbahan's aged marzban; in al-Baladhuri, betrayed by his besieged cityfolk, he fled with thirty archers toward Kirman — Ibn Budayl pursued, dueled him, struck his saddle-bow, and honored him with terms for his townspeople, to whom he said 'I saw you slackening for days — you earned what I did to you.'"
  fr: "Vieux marzban d’Ispahan ; chez al-Baladhuri, trahi par les habitants assiégés de sa ville, il fuit avec trente archers vers Kirman — Ibn Budayl le poursuivit, l’affronta en duel, frappa l’arçon de sa selle et l’honora d’un accord pour ses concitoyens, auxquels il dit : « Je vous voyais faiblir depuis des jours — vous avez mérité ce que je vous ai fait. »"
  es: "El anciano marzban de Isbahan, en al-Baladhuri, traicionado por los habitantes de su ciudad sitiada, huyó con treinta arqueros hacia Kirman. Ibn Budayl lo persiguió, se batió en duelo con él, golpeó su arco de silla de montar y lo honró con condiciones para sus conciudadanos, a quienes les dijo: «Os vi holgazanear durante días; os merecíais lo que os hice»."
  ur: "اسبہان کی عمر مرزبان؛ البلادھوری میں، اس کے محصور شہر والوں کے ساتھ دھوکہ ہوا، وہ تیس تیر اندازوں کے ساتھ کرمان کی طرف بھاگا - ابن بدیل نے اس کا تعاقب کیا، اس کا مقابلہ کیا، اس کی کمان پر ضرب لگائی، اور اسے اپنے شہر والوں کے لیے شرائط سے نوازا، جن سے اس نے کہا کہ 'میں نے تمہیں سستی کرتے ہوئے دیکھا ہے' - میں نے تم کو دنوں کے لیے کیا کمایا۔"
  tr: "İsfahanlı Marzban, yaşlı şeyh; El-Baladhuri'ye göre İbn Badil onun çağdaşıydı, bu yüzden şehir halkına mektup yazdı, ancak onlar onu terk ettiler. Bunun üzerine otuz okçuyla birlikte Yazdegerd'e yetişmek için Kerman'a doğru kaçtı. İbn Badil onu takip etti ve onunla savaştı; darbesi eyerinin topuzuna isabet ederek onu kırdı. Bunun üzerine şehrin halkı adına ona barış teklif etti ve o da kabul edip şehri teslim etti. İbn Badil, \"Ey İsfahan halkı, sizi günlerce hain olarak gördüm, bu yüzden size yaptıklarımı hak ettiniz\" dedi."
  id: "Marzban Isfahan, seorang syekh tua; menurut Al-Baladhuri, Ibn Badil adalah sezamannya, jadi dia menulis surat kepada penduduk kota, tetapi mereka meninggalkannya. Maka dia pergi dengan tiga puluh pemanah, melarikan diri menuju Kerman untuk mengejar Yazdegerd. Ibn Badil mengikutinya dan melawannya, dan pukulannya mengenai gagang pelana kudanya, mematahkannya. Maka dia menawarkan perdamaian atas nama penduduk kotanya, dan dia menerimanya dan menyerahkan kota itu. Dia berkata, “Wahai penduduk Isfahan, aku telah melihat kalian berhari-hari, khianat, maka kalian pantas menerima apa yang kulakukan kepada kalian.”"
