label: { ar: "الفادوسفان", en: "al-Fadhusfan", fr: "Al-Fadhusfan", es: "al-Fadhusfan" }
summary:
  ar: "مرزبان أصبهان الشيخ المسن؛ عند البلاذري عاصره ابن بديل فكاتب أهل المدينة فخذلوه فخرج بثلاثين رماة هارباً يريد كرمان ليلحق يزدجرد فاتبعه ابن بديل فبارزه فوقعت ضربته على قربوس سرجه فكسرته فعرض عليه الصلح عن أهل بلده فقبل وأسلم المدينة وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم."
  en: "Isbahan's aged marzban; in al-Baladhuri, betrayed by his besieged cityfolk, he fled with thirty archers toward Kirman — Ibn Budayl pursued, dueled him, struck his saddle-bow, and honored him with terms for his townspeople, to whom he said 'I saw you slackening for days — you earned what I did to you.'"
  fr: "Vieux marzban d’Ispahan ; chez al-Baladhuri, trahi par les habitants assiégés de sa ville, il fuit avec trente archers vers Kirman — Ibn Budayl le poursuivit, l’affronta en duel, frappa l’arçon de sa selle et l’honora d’un accord pour ses concitoyens, auxquels il dit : « Je vous voyais faiblir depuis des jours — vous avez mérité ce que je vous ai fait. »"
  es: "El anciano marzban de Isbahan, en al-Baladhuri, traicionado por los habitantes de su ciudad sitiada, huyó con treinta arqueros hacia Kirman. Ibn Budayl lo persiguió, se batió en duelo con él, golpeó su arco de silla de montar y lo honró con condiciones para sus conciudadanos, a quienes les dijo: «Os vi holgazanear durante días; os merecíais lo que os hice»."
