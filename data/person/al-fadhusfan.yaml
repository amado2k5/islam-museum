summary:
  ar: "مرزبان أصبهان الشيخ المسن؛ عند البلاذري عاصره ابن بديل فكاتب أهل المدينة فخذلوه فخرج بثلاثين رماة هارباً يريد كرمان ليلحق يزدجرد فاتبعه ابن بديل فبارزه فوقعت ضربته على قربوس سرجه فكسرته فعرض عليه الصلح عن أهل بلده فقبل وأسلم المدينة وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم."
  en: "Isbahan's aged marzban; in al-Baladhuri, betrayed by his besieged cityfolk, he fled with thirty archers toward Kirman — Ibn Budayl pursued, dueled him, struck his saddle-bow, and honored him with terms for his townspeople, to whom he said 'I saw you slackening for days — you earned what I did to you.'"
