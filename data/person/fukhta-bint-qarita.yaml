  ar: "امرأة كوفية خرجت من خوخة لها لما كبر أهل المسجد لصلح الحسن فقالت سرك الله يا أمير المؤمنين ما هذا الذي بلغك فأخبرها بخبر الصلح وأنها فئة من الفئتين اللتين سيصلح الله بينهما بابنه {cite:muruj-al-dhahab p. 720}. وهي أم خالد بن يزيد بن معاوية التي تزوجها مروان بن الحكم ليذل بها ابنها، فروى المسعودي أنها هي التي وضعت على وجهه الوسادة حتى مات وقيل سقته لبناً مسموماً {cite:muruj-al-dhahab p. 84}"
