class: person
label: { ar: "فاختة بنت قرطة", en: "Fukhta bint Qarita", es: "Fukhta bint Qarita", fr: "Fukhta bint Qarita", ur: "فختہ بنت قریتہ" }
summary:
  ar: "امرأة كوفية خرجت من خوخة لها لما كبر أهل المسجد لصلح الحسن فقالت سرك الله يا أمير المؤمنين ما هذا الذي بلغك فأخبرها بخبر الصلح وأنها فئة من الفئتين اللتين سيصلح الله بينهما بابنه {cite:muruj-al-dhahab p. 720}. وهي أم خالد بن يزيد بن معاوية التي تزوجها مروان بن الحكم ليذل بها ابنها، فروى المسعودي أنها هي التي وضعت على وجهه الوسادة حتى مات وقيل سقته لبناً مسموماً {cite:muruj-al-dhahab p. 84}"
  en: "The Kufan woman who darted out of her door at the takbir for al-Hasan's peace — 'bless you, commander, what news has reached you?' — and heard the prophecy of the two great factions reconciled {cite:muruj-al-dhahab p. 720}."
  es: "La mujer kufana que salió corriendo de su puerta al oír el takbir por la paz de al-Hasan —«¡Dios te bendiga, comandante!, ¿qué noticias te han llegado?»— y escuchó la profecía de la reconciliación de las dos grandes facciones {cite:muruj-al-dhahab p. 720}."
  fr: "La femme de Kufan qui s'est précipitée hors de sa porte au takbir pour la paix d'al-Hasan — « que Dieu vous bénisse, commandant, quelles nouvelles vous sont parvenues ? » — et a entendu la prophétie des deux grandes factions réconciliées {cite:muruj-al-dhahab p. 720}."
  ur: "کوفان کی وہ عورت جو الحسن کی سلامتی کے لیے تکبیر پر اپنے دروازے سے باہر نکلی - 'آپ کو سلام ہو کمانڈر، آپ کو کیا خبر پہنچی ہے؟' - اور دو عظیم دھڑوں کی صلح کی پیشین گوئی سنی۔ 720}۔"
  tr: "Cami yaşlıları Hasan'ın uzlaşmasına vardığında bir Kufa kadın hokasından çıktı ve şöyle dedi: \"Allah seni korusun, ey İnananların Komutanı. Sana ulaşan nedir? Ona barış haberini bildir ve Allah'ın oğlu aracılığıyla uzlaştıracağı iki gruptan biri olduğunu söyle.\" {atıf:Muruj-al-Dhahab s. 720}. O, oğlunu küçük düşürmek için Marwan ibn al-Hakam'la evlendiği Halid bin Yezid ibn Mu'awiya'nın annesidir. Al-Mas'udi, yastığı onun yüzüne koyduğunu, ölene kadar ona zehirli süt verdiğini anlatmıştır {cite:muruj-al-dhahab s. 84}"
  id: "Seorang wanita Kufa keluar dari khakhanya ketika para tetua masjid mencapai rekonsiliasi Hasan dan berkata, \"Semoga Allah melindungimu, wahai Panglima Orang Beriman. Apa yang telah sampai padamu? Beritahukan kepadanya kabar perdamaian, dan bahwa dia adalah salah satu dari dua kelompok yang akan didamaikan Tuhan melalui putra-Nya.\" {cite:muruj-al-dhahab hlm. 720}. Dia adalah ibu dari Khalid ibn Yazid ibn Mu'awiya, yang dinikahi Marwan ibn al-Hakam untuk mempermalukan putranya. Al-Mas'udi menceritakan bahwa dialah yang meletakkan bantal di wajahnya sampai kematiannya, dan dikatakan dia memberinya susu beracun {cite:muruj-al-dhahab hlm. 84}"
