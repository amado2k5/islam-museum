summary:
  ar: "من خزاعة، لقي النبي بحمراء الأسد بعد أحد، وقال إنه عزّ عليهم ما أصابه، وقيل إنه أسلم وقيل بقي على شركه وكان ناصحاً للنبي لحلف خزاعة وبني هاشم ⁦(الرحيق ص285)⁩."
  tr: "Huza'ah'dan Peygamber, Uhud'dan sonra Hamra al-Asad ile görüştü ve başına gelenlerden dolayı üzgün olduğunu söyledi. İslam'ı benimsediği söylenirken, diğerleri ise Huza'ah ile Banu Haşim'in ittifakı sırasında peygamberin müşavirliğini sürdürdüğünü ve Peygamber'in danışmanı olduğunu belirtmiştir (Al-Raheeq, s. 285)."
  id: "Dari Khuza'ah, Nabi bertemu dengan Hamra al-Asad setelah Uhud, dan ia berkata bahwa ia sangat sedih atas apa yang menimpanya. Dikatakan bahwa ia memeluk Islam, dan yang lain mengatakan ia tetap berpegang pada politeisme dan menjadi penasihat Nabi selama aliansi Khuza'ah dan Banu Hashim (Al-Raheeq, hlm. 285)."
