summary:
  ar: "حافظ العصر ومحدث الشام ومصر، صاحب «تهذيب الكمال في أسماء الرجال» و«تحفة الأشراف بمعرفة الأطراف»؛ وُلد بظاهر حلب سنة ٦٥٤هـ ونشأ بالمزة قرب دمشق، وطلب الحديث من سنة ٦٧٥هـ ورحل فيه إلى الحرمين ومصر والإسكندرية وحلب، وصحب ابن تيمية وأُوذي وحُبس بسببه سنة ٧٠٥هـ، وولي مشيخة دار الحديث الأشرفية من سنة ٧١٨هـ إلى وفاته سنة ٧٤٢هـ، وتخرج به الذهبي والسبكي وصهره ابن كثير."
  en: "The hafiz of his age and the muhaddith of al-Sham and Egypt, author of Tahdhib al-Kamal fi Asma al-Rijal and Tuhfat al-Ashraf bi-Ma'rifat al-Atraf; born outside Aleppo in 654/1256 and raised at al-Mizza near Damascus, he sought hadith from 675/1276, travelled to the two Sanctuaries, Egypt, Alexandria and Aleppo, kept company with Ibn Taymiyya and was jailed on his account in 705/1305, held the shaykhhood of the Dar al-Hadith al-Ashrafiyya from 718/1319 until his death in 742/1341, and trained al-Dhahabi, al-Subki and his son-in-law Ibn Kathir."
  ur: "اپنے عصر کے حافظ اور شام و مصر کے محدث، «تہذیب الکمال فی اسماء الرجال» اور «تحفۃ الاشراف بمعرفۃ الاطراف» کے مصنف؛ 654ھ/1256ء میں حلب کے باہر پیدا ہوئے اور دمشق کے قریب المزہ میں پلے، 675ھ/1276ء سے حدیث کی طلب کی اور حرمین، مصر، اسکندریہ اور حلب کے سفر کیے، ابن تیمیہ کی صحبت رکھی اور ان کے سبب 705ھ/1305ء میں قید ہوئے، 718ھ/1319ء سے وفات 742ھ/1341ء تک دار الحدیث اشرفیہ کے شیخ رہے، اور ان سے ذہبی، سبکی اور ان کے داماد ابن کثیر نے تربیت پائی۔"
