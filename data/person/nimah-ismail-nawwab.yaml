summary:
  ar: "شاعرة وكاتبة ومصوّرة سعودية وُلدت في ماليزيا لأسرة من علماء مكة؛ والدها إسماعيل نواب أستاذ اللسانيات سابقًا في جامعة إدنبرة. عملت في شركة أرامكو، وتكتب بالإنجليزية عن المرأة والشباب والمجتمع السعودي؛ وهي أول شاعرة سعودية تُنشر أعمالها في الولايات المتحدة وأول شاعرة سعودية توقّع أعمالها باسمها. من كتبها «The Unfurling» (2004) و«Canvas of the Soul» (2012)."
  en: "Saudi poet, writer and photographer, born in Malaysia into a line of Meccan scholars; her father, Ismail I. Nawwab, was formerly a professor of linguistics at the University of Edinburgh. She worked for Saudi Aramco and writes in English on women, youth and Saudi society. She is described as the first Saudi woman poet to be published in the United States and the first Saudi poet to sign her work publicly. Her books are The Unfurling (2004) and Canvas of the Soul: Mystic Poems from the Heartland of Arabia (2012)."
  ur: "سعودی شاعرہ، مصنفہ اور فوٹوگرافر، ملائیشیا میں پیدا ہوئیں اور مکہ کے علما کے خاندان سے تعلق رکھتی ہیں؛ ان کے والد اسماعیل نواب ایڈنبرا یونیورسٹی میں لسانیات کے پروفیسر تھے۔ وہ آرامکو میں کام کر چکی ہیں اور انگریزی میں خواتین، نوجوانوں اور سعودی معاشرے پر لکھتی ہیں۔ ان کی کتابوں میں «The Unfurling» (2004) اور «Canvas of the Soul» (2012) شامل ہیں۔"
