summary:
  ar: "أبو القاسم خلف بن القاسم بن سهل الأزدي القرطبي، المعروف بابن الدباغ ⁦(325–393هـ)⁩، محدّث الأندلس في وقته؛ رحل إلى المشرق سنة 345هـ فتردد هناك نحو خمس عشرة سنة وسمع بمصر والشام ومكة، وكتب عن نحو ثلاث مئة رجل، وأكثر عنه ابن عبد البر ولم يكن يقدّم عليه من شيوخه أحداً، كما ينقل الحميدي {cite:tamhid-furqan-2017-v1 p. 12}."
  en: "Abu al-Qasim Khalaf b. al-Qasim b. Sahl al-Azdi of Cordoba, known as Ibn al-Dabbagh (325–393 AH), the hadith scholar of al-Andalus in his time; he travelled East in 345 AH, spent some fifteen years there hearing in Egypt, Syria and Mecca, and wrote from about three hundred men; Ibn 'Abd al-Barr transmitted from him abundantly and, as al-Humaydi reports, ranked none of his teachers above him {cite:tamhid-furqan-2017-v1 p. 12}."
  ur: "ابو القاسم خلف بن القاسم بن سہل ازدی قرطبی، ابن الدباغ کے نام سے معروف ⁦(325–393ھ)⁩، اپنے وقت میں اندلس کے محدث؛ وہ 345ھ میں مشرق گئے، تقریباً پندرہ سال وہاں رہ کر مصر، شام اور مکہ میں سماع کیا، اور تقریباً تین سو افراد سے لکھا؛ ابن عبد البر نے ان سے بکثرت روایت کی اور حمیدی کے بقول اپنے کسی شیخ کو ان پر مقدم نہیں کرتے تھے {cite:tamhid-furqan-2017-v1 p. 12}۔"
