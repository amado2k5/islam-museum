summary:
  ar: "هشام بن حكيم بن حزام بن خويلد بن أسد بن عبد العزى، أبو عمر، القرشي الأسدي، صحابي ابن صحابي. أسلم يوم فتح مكة، وروى عن النبي، وروى عنه جبير بن نفير وعروة بن الزبير وقتادة السلمي، وكان من فضلاء الصحابة وخيارهم. ومن أخباره أنه أنكر على عياض بن غنم بحمص أخذ الجزية من أناس من النبط، فاحتج بقول النبي إن الله يعذب الذين يعذبون الناس في الدنيا. ونقل أبو نعيم أنه استشهد بأجنادين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  en: "Hisham ibn Hakim ibn Hizam ibn Khuwaylid ibn Asad ibn Abd al-Uzza, Abu Umar, of Quraysh and the Banu Asad, a Companion and the son of a Companion. He embraced Islam on the day Makkah was conquered, narrated from the Prophet, and was narrated from by Jubayr ibn Nufayr, Urwa ibn al-Zubayr and Qatada al-Sulami. He was counted among the best and most distinguished Companions. When Iyad ibn Ghanm, governor of Homs, made people of the Nabat pay the jizya, Hisham objected, citing the Prophet's saying that God punishes those who torment people in this world. Abu Nu'aym is reported to have said that he was martyred at Ajnadayn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  ur: "ہشام بن حکیم بن ہزام بن خویلد بن اسد بن عبد العزیٰ، ابو عمر، قریش اور بنو اسد سے؛ صحابی اور صحابی کا بیٹا۔"
  es: "Hisham ibn Hakim ibn Hizam ibn Khuwaylid ibn Asad ibn Abd al-Uzza, Abu Umar, de Quraysh y Banu Asad, Compañero del Profeta e hijo de otro Compañero. Abrazó el Islam el día de la conquista de La Meca, según narró el Profeta, y de este relato narraron Jubayr ibn Nufayr, Urwa ibn al-Zubayr y Qatada al-Sulami. Fue considerado uno de los Compañeros más destacados. Cuando Iyad ibn Ghanm, gobernador de Homs, impuso el pago de la yizia a la gente del Nabat, Hisham se opuso, citando las palabras del Profeta de que Dios castiga a quienes atormentan a la gente en este mundo. Se dice que Abu Nu'aym afirmó que Hisham fue martirizado en Ajnadayn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  fr: "Hisham ibn Hakim ibn Hizam ibn Khuwaylid ibn Asad ibn Abd al-Uzza, Abu Umar, de Quraysh et des Banu Asad, Compagnon et fils de Compagnon, embrassa l'islam le jour de la conquête de La Mecque. Cet événement fut rapporté du Prophète, et rapporté par Jubayr ibn Nufayr, Urwa ibn al-Zubayr et Qatada al-Sulami. Il comptait parmi les Compagnons les plus éminents. Lorsque Iyad ibn Ghanm, gouverneur de Homs, imposa la jizya aux habitants de Nabat, Hisham s'y opposa, citant un hadith du Prophète selon lequel Dieu punit ceux qui persécutent les gens en ce monde. Abu Nu'aym aurait déclaré qu'il fut martyrisé à Ajnadayn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
