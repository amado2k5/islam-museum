summary:
  ar: "هشام بن حكيم بن حزام بن خويلد بن أسد بن عبد العزى، أبو عمر، القرشي الأسدي، صحابي ابن صحابي. أسلم يوم فتح مكة، وروى عن النبي، وروى عنه جبير بن نفير وعروة بن الزبير وقتادة السلمي، وكان من فضلاء الصحابة وخيارهم. ومن أخباره أنه أنكر على عياض بن غنم بحمص أخذ الجزية من أناس من النبط، فاحتج بقول النبي إن الله يعذب الذين يعذبون الناس في الدنيا. ونقل أبو نعيم أنه استشهد بأجنادين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  en: "Hisham ibn Hakim ibn Hizam ibn Khuwaylid ibn Asad ibn Abd al-Uzza, Abu Umar, of Quraysh and the Banu Asad, a Companion and the son of a Companion. He embraced Islam on the day Makkah was conquered, narrated from the Prophet, and was narrated from by Jubayr ibn Nufayr, Urwa ibn al-Zubayr and Qatada al-Sulami. He was counted among the best and most distinguished Companions. When Iyad ibn Ghanm, governor of Homs, made people of the Nabat pay the jizya, Hisham objected, citing the Prophet's saying that God punishes those who torment people in this world. Abu Nu'aym is reported to have said that he was martyred at Ajnadayn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
