summary:
  ar: "عالم سياسة ومستعرب فرنسي، وُلد سنة 1955 في باريس، متخصّص في الشرق الأوسط المعاصر والمسلمين في الغرب. بدأ دراسة العربية بعد رحلة إلى المشرق سنة 1974، وأنجز في مصر العمل الميداني لأطروحته عن الحركات الإسلامية التي صدرت بالإنجليزية بعنوان «النبي والفرعون» (1985)، وهو من أوائل الدراسات لأي لغة في التشدد الإسلامي المعاصر. من كتبه «انتقام الله» (1991) و«الجهاد: مسار الإسلام السياسي» و«بعيدًا عن الفوضى» (2020). وهو مدرج في هذا المتحف بصفته مساهمًا بارزًا في دراسة الإسلام الحديث، لا بصفته مسلمًا."
  en: "French political scientist and Arabist, born in 1955 in Paris, specialising in the contemporary Middle East and in Muslims in the West. He began studying Arabic after a journey to the Levant in 1974 and did the fieldwork in Egypt for his thesis on Islamist movements, published in English as The Prophet and Pharaoh (1985), among the first studies in any language of contemporary Islamist militancy. His books include The Revenge of God (1991), Jihad: The Trail of Political Islam, and Away from Chaos (2020). He is included in this museum as a leading contributor to the study of modern Islam, not as a Muslim."
  ur: "فرانسیسی ماہرِ سیاسیات و مستعرب، 1955 میں پیرس میں پیدا ہوئے، جو معاصر مشرقِ وسطیٰ اور مغرب میں مسلمانوں کے ماہر ہیں۔ انھوں نے 1974 میں مشرق کے سفر کے بعد عربی سیکھنا شروع کی اور مصر میں اسلامی تحریکوں پر اپنے مقالے کا میدانی کام کیا، جو انگریزی میں «پیغمبر اور فرعون» (1985) کے عنوان سے شائع ہوا۔ ان کی کتابوں میں «خدا کا انتقام» (1991)، «جہاد: سیاسی اسلام کا راستہ» اور «انتشار سے دور» (2020) شامل ہیں۔ وہ اس میوزیم میں جدید اسلام کے مطالعے کے نمایاں معاون کے طور پر شامل ہیں — مسلمان کے طور پر نہیں۔"
