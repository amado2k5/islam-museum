  ar: "طبيب وسياسي نيجيري وُلد في لندن سنة 1962، ابن السناتور أولوسولا ساراكي. حكم ولاية كوارا (2003–2011)، ثم دخل مجلس الشيوخ عن كوارا الوسطى وترأسه (2015–2019)، وخاض انتخابات حزبه التمهيدية للرئاسة سنة 2019."
