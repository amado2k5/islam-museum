summary:
  ar: "أبو غانم صالح بن غانم السدلان (1359–1439هـ/1941–2017م) عالم سعودي وأستاذ الفقه المقارن بكلية الشريعة في جامعة الإمام محمد بن سعود الإسلامية، تخرج على يد والده ومحمد بن إبراهيم آل الشيخ وابن باز، وله مصنفات في النية وصلاة الجماعة والتحذير من الغلو في التكفير."
  en: "Abu Ghanim Salih ibn Ghanim Al-Sadlan (1359–1439 AH / 1941–2017 CE) was a Saudi scholar and professor of comparative fiqh at the College of Sharia of Imam Muhammad ibn Saud Islamic University, formed by his father, Muhammad ibn Ibrahim Al al-Shaykh and Ibn Baz, and author of works on intention, congregational prayer and warnings against excess in takfir."
  ur: "ابو غانم صالح بن غانم السدلان (1359–1439ھ/1941–2017ء) سعودی عالم اور جامعہ امام محمد بن سعود اسلامیہ کے کلیہ الشریعہ میں فقہِ مقارن کے استاد تھے؛ اپنے والد، محمد بن ابراہیم آل الشیخ اور ابن باز کے شاگرد رہے اور نیت، نمازِ جماعت اور تکفیر میں غلو کی تنبیہ پر ان کی تصانیف ہیں۔"
