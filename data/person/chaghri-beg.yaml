id: person/chaghri-beg
class: person
label: { ar: "جغري بك بن سلجوق" }
summary:
  ar: "أخو طغرل بك صاحب خراسان، عقد الصلح بينه وبين السلطان إبراهيم بن مسعود بن محمود بن سبكتكين صاحب غزنة سنة إحدى وخمسين بعد حروب كثيرة ثم مات في السنة وأقيم مكانه ابنه ألب أرسلان {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  en: "Tughrul Beg's brother, lord of Khurasan; after many wars he made peace with Ghazna's Ibrahim ibn Mas'ud in 451, died that year and was succeeded by his son Alp Arslan {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  es: "Hermano de Tughrul Beg, señor de Jorasán; después de muchas guerras hizo la paz con Ibrahim ibn Mas'ud de Ghazna en 451, murió ese año y fue sucedido por su hijo Alp Arslan {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  fr: "Le frère de Tughrul Beg, seigneur du Khorasan; après de nombreuses guerres, il fit la paix avec Ibrahim ibn Mas'ud de Ghazna en 451, mourut cette année-là et fut remplacé par son fils Alp Arslan {cite:tarikh-khulafa-minhaj-1434 p. 644}."
