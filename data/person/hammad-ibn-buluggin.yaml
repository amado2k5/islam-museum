label:
  ar: حماد بن بلكين الحمادي
  en: Hammad ibn Buluggin
summary:
  ar: "حماد بن بلكين بن زيري الصنهاجي، مؤسس دولة آل حماد؛ عقد له أخوه المنصور بلكيز على أشير والمسيلة فاستقل بها سنة 398هـ أيام ابن أخيه باديس، ودفعه لحرب زناتة بالمغرب الأوسط من مغراوة وبني يفرن فعظم عناؤه فيها وأثخن فيهم وكان مظفراً عليهم، واختط مدينة القلعة ونقل إليها جراوة من المغرب وأنزلهم بها وتم بناؤها على رأس المائة الرابعة، وشيد مساجدها وفنادقها حتى استبحرت في العمارة ورحل إليها طلاب العلوم وأرباب الصنائع من الثغور والقاصية."
  en: "Hammad ibn Buluggin ibn Ziri al-Sanhaji, founder of the Hammadid state; his brother al-Mansur Buluggin invested him with Ashir and Msila and he broke away in 398 AH in his nephew Badis's day, was sent against the Zanata of the Middle Maghreb and worsted them sorely — he founded the fortress-city of the Qal'a, settled Jarawa from the west in it, finished it about the turn of the fifth century, and adorned it with mosques and inns until it drew knowledge-seekers and craftsmen from the frontiers."
