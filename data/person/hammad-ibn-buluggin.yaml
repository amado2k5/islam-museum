id: person/hammad-ibn-buluggin
class: person
label:
  ar: حماد بن بلكين الحمادي
  en: Hammad ibn Buluggin
  es: "Hammad ibn Buluggin"
  fr: "Hammad ibn Buluggin"
  ur: "حماد بن بلوگن"
summary:
  ar: "حماد بن بلكين بن زيري الصنهاجي، مؤسس دولة آل حماد؛ عقد له أخوه المنصور بلكيز على أشير والمسيلة فاستقل بها سنة 398هـ أيام ابن أخيه باديس، ودفعه لحرب زناتة بالمغرب الأوسط من مغراوة وبني يفرن فعظم عناؤه فيها وأثخن فيهم وكان مظفراً عليهم، واختط مدينة القلعة ونقل إليها جراوة من المغرب وأنزلهم بها وتم بناؤها على رأس المائة الرابعة، وشيد مساجدها وفنادقها حتى استبحرت في العمارة ورحل إليها طلاب العلوم وأرباب الصنائع من الثغور والقاصية."
  en: "Hammad ibn Buluggin ibn Ziri al-Sanhaji, founder of the Hammadid state; his brother al-Mansur Buluggin invested him with Ashir and Msila and he broke away in 398 AH in his nephew Badis's day, was sent against the Zanata of the Middle Maghreb and worsted them sorely — he founded the fortress-city of the Qal'a, settled Jarawa from the west in it, finished it about the turn of the fifth century, and adorned it with mosques and inns until it drew knowledge-seekers and craftsmen from the frontiers."
  es: "Hammad ibn Buluggin ibn Ziri al-Sanhaji, fundador del estado hammadí; su hermano al-Mansur Buluggin le otorgó los poderes de Ashir y Msila, y se separó en el año 398 de la Hégira, en tiempos de su sobrino Badis. Fue enviado contra los Zanata del Magreb Medio y los derrotó severamente. Fundó la ciudad fortaleza de Qal'a, asentó en ella a los Jarawa procedentes del oeste, la terminó a principios del siglo V y la adornó con mezquitas y posadas hasta que atrajo a buscadores de conocimiento y artesanos de las fronteras."
  fr: "Hammad ibn Buluggin ibn Ziri al-Sanhaji, fondateur de l'État hammadide; son frère al-Mansur Buluggin l'investit d'Ashir et de Msila et il fit sécession en 398 AH, du temps de son neveu Badis, fut envoyé contre les Zanata du Maghreb moyen et les vainquit sévèrement — il fonda la ville fortifiée de Qal'a, y installa les Jarawa venus de l'ouest, l'acheva vers le tournant du Ve siècle et l'orna de mosquées et d'auberges jusqu'à ce qu'elle attire des chercheurs de savoir et des artisans des frontières."
  ur: "حماد بن بلوگین ابن زری السنہجی، حمادی ریاست کے بانی؛ اس کے بھائی المنصور بلوگین نے اسے آشیر اور مسیلہ کے ساتھ سرمایہ کاری کیا اور اس نے 398 ہجری میں اپنے بھتیجے بدیس کے دن علیحدگی اختیار کی، مشرق مغرب کی زناتا کے خلاف بھیجا گیا اور ان کو بری طرح خراب کیا - اس نے قلعہ کے شہر کی بنیاد رکھی، اس میں مغرب کی طرف سے جاروہ کو آباد کیا، اس میں مسجد کی تعمیر مکمل کی، اور اس کے بارے میں پانچویں صدی عیسوی میں مسجد تعمیر کی۔ یہاں تک کہ اس نے علم کے متلاشیوں اور کاریگروں کو سرحدوں سے کھینچ لیا۔"
