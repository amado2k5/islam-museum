summary:
  ar: "أبو بكر شعبة بن عياش بن سالم الخياط الأسدي الكوفي، أحد راويي قراءة عاصم بن أبي النجود مع حفص، ولد سنة 95هـ وتوفي في جمادى الأولى سنة 193هـ، ويصفه ابن الجزري بأنه إمام عالم حجة من كبار أئمة السنة {cite:nashr-dahman-damascus-1345-v1 p. 166}."
  en: "Abu Bakr Shu'ba ibn 'Ayyash al-Asadi of Kufa, one of the two transmitters of Asim's reading beside Hafs; born 95 AH, died in Jumada I of 193 AH, and described by Ibn al-Jazari as an imam, a scholar and a authority among the great leaders of the Sunna {cite:nashr-dahman-damascus-1345-v1 p. 166}."
  ur: "ابو بکر شعبہ بن عیاش اسدی کوفی، عاصم بن ابی النجود کی قراءت کے دو راویوں میں سے ایک ⁦(دوسرے حفص ہیں)⁩؛ 95ھ میں پیدا ہوئے اور جمادی الاولیٰ 193ھ میں وفات پائی؛ ابن الجزری انہیں امام، عالم، حجت اور سنت کے بڑے ائمہ میں شمار کرتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 166}."
  es: "Abu Bakr Shu'ba ibn 'Ayyash al-Asadi de Kufa, uno de los dos transmisores de la lectura de Asim junto con Hafs; nació en el año 95 de la Hégira, murió en Jumada I del año 193 de la Hégira, y fue descrito por Ibn al-Jazari como un imán, un erudito y una autoridad entre los grandes líderes de la Sunna {cite:nashr-dahman-damascus-1345-v1 p. 166}."
  fr: "Abu Bakr Shu'ba ibn 'Ayyash al-Asadi de Kufa, l'un des deux transmetteurs de la lecture d'Asim aux côtés de Hafs; né en 95 AH, mort en Jumada I de 193 AH, et décrit par Ibn al-Jazari comme un imam, un érudit et une autorité parmi les grands chefs de la Sunna {cite:nashr-dahman-damascus-1345-v1 p. 166}."
  tr: "Ebu Bekir Şu'bah ibn Ayyyş ibn Salim el-Xeyyat-el-Esedi el-Kufi, Asim ibn Ebi el-Necud'un Hafs ile birlikte okumasının rivayetçilerinden biri olarak, 95 Hicri yılında doğmuş ve 193 Hicri yılında Cumeda'l-Avval'de vefat etmiştir. İbn el-Cezeri onu bir imam, alim ve kanıt, Sünnet'in büyük imamlarından biri olarak tanımlar {cite:nashr-dahman-damascus-1345-v1, s. 166}."
  id: "Abu Bakr Shu'bah ibn Ayyash ibn Salim al-Khayyat al-Asadi al-Kufi, salah satu narator pembacaan Asim ibn Abi al-Najud dengan Hafs, lahir pada tahun 95 H dan meninggal pada Jumada al-Awwal 193 H. Ibn al-Jazari menggambarkannya sebagai seorang imam, cendekiawan, dan bukti, salah satu Imam besar Sunnah {cite:nashr-dahman-damascus-1345-v1, hlm. 166}."
