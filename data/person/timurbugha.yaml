summary:
  ar: "الملك الظاهر أبو سعيد تمر بغا الرومي الظاهري الجقمقي؛ تسلطن بعد خلع بلباي وهو الخامس عشر من ملوك الجراكسة بمصر وكان له فضل وصلاح وتودد للناس وحذق ببعض الصنائع بحيث صار يعمل القسي الفائقة بيده ويعمل السهام عملاً فائقاً ويرمي بها أحسن رمي مع الفروسية التامة ومع ذلك ما صفا له دهره يوماً ورماه عن لبد قوسه أبعد مرمى وما زال به الأمر إلى أن خلعوه ونفوه إلى الإسكندرية وكانت سلطنته شهرين إلا يوماً واحداً، توفي بالإسكندرية في ذي الحجة سنة تسع وسبعين وثمانمائة وقد جاوز الستين {cite:shadharat-dhahab p. 315, 326}."
  en: "Timurbugha — the fifteenth Circassian king: a bowyer-sultan who 'made the finest bows with his own hands and shot them best,' deposed after two months minus a day and exiled to Alexandria where he died Dhu'l-Hijja 879 past sixty {cite:shadharat-dhahab p. 315, 326}."
  es: "Timurbugha — el decimoquinto rey circasiano: un sultán arquero que \"fabricaba los mejores arcos con sus propias manos y disparaba con ellos como mejor\", fue depuesto después de dos meses menos un día y exiliado a Alejandría, donde murió en Dhu'l-Hijja 879, pasados los sesenta años {cite:shadharat-dhahab p. 315, 326}."
  fr: "Timurbugha — le quinzième roi circassien: un sultan archer qui « fabriquait de ses propres mains les plus beaux arcs et tirait le mieux avec », déposé après deux mois moins un jour et exilé à Alexandrie où il mourut Dhu'l-Hijja 879 après soixante ans {cite: shadharat-dhahab p. 315, 326}."
  ur: "تیموربوگھا - پندرھواں سرکیسیائی بادشاہ: ایک بولر-سلطان جس نے 'اپنے ہاتھوں سے بہترین کمانیں بنائیں اور انہیں بہترین گولی مار دی'، دو ماہ کے منفی دن کے بعد معزول کر دیا گیا اور اسکندریہ جلاوطن کر دیا گیا جہاں اس کی وفات ذی الحجہ 879 کو ساٹھ کے قریب ہوئی۔ 315، 326}۔"
