summary:
  ar: "الملك الظاهر أبو سعيد تمر بغا الرومي الظاهري الجقمقي؛ تسلطن بعد خلع بلباي وهو الخامس عشر من ملوك الجراكسة بمصر وكان له فضل وصلاح وتودد للناس وحذق ببعض الصنائع بحيث صار يعمل القسي الفائقة بيده ويعمل السهام عملاً فائقاً ويرمي بها أحسن رمي مع الفروسية التامة ومع ذلك ما صفا له دهره يوماً ورماه عن لبد قوسه أبعد مرمى وما زال به الأمر إلى أن خلعوه ونفوه إلى الإسكندرية وكانت سلطنته شهرين إلا يوماً واحداً، توفي بالإسكندرية في ذي الحجة سنة تسع وسبعين وثمانمائة وقد جاوز الستين {cite:shadharat-dhahab p. 315, 326}."
  en: "Timurbugha — the fifteenth Circassian king: a bowyer-sultan who 'made the finest bows with his own hands and shot them best,' deposed after two months minus a day and exiled to Alexandria where he died Dhu'l-Hijja 879 past sixty {cite:shadharat-dhahab p. 315, 326}."
