summary:
  ar: "روائي وقاص ومترجم مصري (1935–2022)، اسمه الكامل محمد بهاء الدين عبد الله طاهر. وُلد في الجيزة وأصوله من الأقصر، وعمل مخرجًا ومذيعًا في إذاعة البرنامج الثاني قبل منعه من الكتابة سنة 1975، فغادر مصر وعمل مترجمًا لدى الأمم المتحدة في سويسرا. من رواياته «خالتي صفية والدير» و«الحب في المنفى» و«واحة الغروب» التي فازت بالجائزة العالمية للرواية العربية في دورتها الأولى سنة 2008."
  en: "Egyptian novelist, short-story writer and translator (1935–2022), full name Muhammad Baha al-Din Abdullah Taher. Born in Giza to a family from Luxor, he worked as a radio drama director and broadcaster before being banned from writing in 1975, after which he left Egypt and worked as a United Nations translator in Switzerland. His novels include Aunt Safiyya and the Monastery, Love in Exile and Sunset Oasis, which won the inaugural International Prize for Arabic Fiction in 2008."
  ur: "مصری ناول نگار، افسانہ نگار اور مترجم (1935–2022)، پورا نام محمد بہاء الدین عبد اللہ طاہر۔ الجیزہ میں پیدا ہوئے، خاندانی اصل الاقصر سے تھی؛ 1975 میں تحریر پر پابندی کے بعد مصر چھوڑا اور سوئٹزرلینڈ میں اقوام متحدہ کے مترجم رہے۔ ان کے ناولوں میں «خالتي صفية والدير»، «الحب في المنفى» اور «واحة الغروب» شامل ہیں، جس نے 2008 میں عربی فکشن کا پہلا عالمی انعام جیتا۔"
