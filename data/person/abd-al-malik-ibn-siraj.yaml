label: { ar: "عبد الملك بن سراج أبو مروان الأموي", en: "Abd al-Malik ibn Siraj Abu Marwan al-Umawi", fr: "Abd al-Malik ibn Siraj Abu Marwan al-Umawi", es: "Abd al-Malik ibn Siraj Abu Marwan al-Umawi", ur: "عبد الملک ابن سراج ابو مروان العماوی" }
summary:
  ar: "عبد الملك بن سراج أبو مروان الأموي مولاهم القرطبي — لغوي الأندلس بلا مدافعة؛ روى عن يونس بن مغيث ومكي بن أبي طالب وطائفة وكان أحد أوعية العلم؛ توفي في ذي الحجة سنة تسع وثمانين وأربعمائة عن تسعين سنة {cite:shadharat-dhahab p. 392-393}."
  en: "Abd al-Malik b. Siraj, Abu Marwan al-Umawi mawla of theirs, the Cordoban — the uncontested philologist of al-Andalus; transmitted from Yunus b. Mughith and Makki b. Abi Talib and was one of the vessels of knowledge; died Dhu al-Hijja 489 aged ninety {cite:shadharat-dhahab p. 392-393}."
  fr: "Abd al-Malik b. Siraj, Abu Marwan al-Umawi, leur mawla, le Cordouan — le philologue incontesté d'al-Andalus ; il transmit de Yunus b. Mughith et de Makki b. Abi Talib et fut l'un des réceptacles du savoir ; mort en dhu al-hijja 489 à quatre-vingt-dix ans {cite:shadharat-dhahab p. 392-393}."
  es: "Abd al-Malik b. Siraj, Abu Marwan al-Umawi mawla suyo, el cordobés, el filólogo indiscutible de al-Andalus; transmitido desde Yunus b. Mughith y Makki b. Abi Talib y fue uno de los vasos del conocimiento; murió Dhu al-Hijja 489 a la edad de noventa años {cita: shadharat-dhahab p. 392-393}."
  ur: "عبد الملک بی۔ سراج، ابو مروان العموی ان کے مولا، قرطبہ - الاندلس کے بلا مقابلہ ماہر فلکیات؛ یونس ب سے منقول مغیث اور مکی بی۔ ابی طالب اور علم کے برتنوں میں سے تھے۔ وصال ذی الحجہ 489 عمر نوے 392-393}۔"
