summary:
  ar: "العباس المعروف بالمجنون، مضنون في الشوق، مخزون عن الخلق، كان لمحبوبه ساهرًا، وعن بني جنسه سائرًا. روى ابن المبارك أنه لقيه على جبل لبنان، وأن أبا سليمان الداراني وصفه بأنه يأكل في الشهر أكلتين من ثمار الشجر أو نبات الأرض، ويتعبد منذ ستين سنة."
  en: "al-Abbas, known as al-Majnun, pained with longing and withdrawn from people, watchful for his Beloved and set apart from his own kind; Ibn al-Mubarak relates meeting him on Mount Lebanon, and Abu Sulayman al-Darani described him as eating two meals a month of tree fruit or plants and as worshipping for sixty years."
  ur: "عباس جو مجنون کے نام سے مشہور تھے، شوق میں گھلے ہوئے اور مخلوق سے پوشیدہ، اپنے محبوب کے لیے جاگنے والے اور اپنے ہم جنسوں سے الگ۔ ابن مبارک نے جبل لبنان پر ان سے ملاقات نقل کی، اور ابو سلیمان دارانی نے ان کا حال بیان کیا کہ وہ مہینے میں دو وقت درختوں کے پھل یا زمین کی گھاس کھاتے ہیں اور ساٹھ سال سے عبادت کر رہے ہیں۔"
