  ar: "أستاذ دار الملك الظاهر؛ جعله الملك السعيد نائبه فلم ترض خاصة السعيد بذلك ووثبوا على الفارقاني واعتقلوه، فلم يقدر السعيد على مخالفتهم، فقيل إنهم خنقوه في جمادى الأولى. وكان وسيماً جسيماً شجاعاً نبيلاً له خبرة ورأي وفيه ديانة وإيثار وعليه مهابة ووقار، ومات في عشر الخمسين {cite:shadharat-dhahab p. 622}."
  en: "Baybars's ustadh-dar — made na'ib by al-Sa'id, then seized and reportedly strangled in Jumada I by the sultan's own khassa whom al-Sa'id could not oppose; 'handsome, brave, generous, pious, awe-bearing' {cite:shadharat-dhahab p. 622}."
