summary:
  ar: "أستاذ دار الملك الظاهر؛ جعله الملك السعيد نائبه فلم ترض خاصة السعيد بذلك ووثبوا على الفارقاني واعتقلوه، فلم يقدر السعيد على مخالفتهم، فقيل إنهم خنقوه في جمادى الأولى. وكان وسيماً جسيماً شجاعاً نبيلاً له خبرة ورأي وفيه ديانة وإيثار وعليه مهابة ووقار، ومات في عشر الخمسين {cite:shadharat-dhahab p. 622}."
  en: "Baybars's ustadh-dar — made na'ib by al-Sa'id, then seized and reportedly strangled in Jumada I by the sultan's own khassa whom al-Sa'id could not oppose; 'handsome, brave, generous, pious, awe-bearing' {cite:shadharat-dhahab p. 622}."
  fr: "Ustadh-dar de Baybars — nommé na’ib par al-Sa’id, puis saisi et, selon le récit, étranglé en jumada I par les propres proches du sultan, auxquels al-Sa’id ne pouvait s’opposer ; « beau, courageux, généreux, pieux, imposant le respect » {cite:shadharat-dhahab p. 622}."
  es: "El ustadh-dar de Baybars — nombrado na'ib por al-Sa'id, luego capturado y, según se cuenta, estrangulado en Jumada I por el propio khassa del sultán, a quien al-Sa'id no pudo oponerse; 'guapo, valiente, generoso, piadoso, imponente' {cita: shadharat-dhahab p. 622}."
  ur: "Baybars کے استاذ دار — کو السعید نے نائب بنایا، پھر جمادیا اول میں سلطان کے اپنے خاص نے پکڑ لیا اور مبینہ طور پر گلا گھونٹ دیا جس کی السعید مخالفت نہیں کر سکتا تھا۔ 'خوبصورت، بہادر، سخی، پرہیزگار، خوف پیدا کرنے والا' 622}۔"
