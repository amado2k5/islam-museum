names:
  - { value: "الفارقاني شمس الدين آق سنقر الظاهري أستاذ دار الملك الظاهر", kind: full }
died: { edtf: "1279-10~", hijri: "0678-05", calendar: julian, precision: month, status: debated, derived: true, note: "قيل إن خاصة الملك السعيد خنقوه في جمادى الأولى سنة سبع وسبعين — أو في 678 كما وضعه ابن العماد في أموات 678 {cite:shadharat-dhahab p. 622}." }
summary:
  ar: "أستاذ دار الملك الظاهر؛ جعله الملك السعيد نائبه فلم ترض خاصة السعيد بذلك ووثبوا على الفارقاني واعتقلوه، فلم يقدر السعيد على مخالفتهم، فقيل إنهم خنقوه في جمادى الأولى. وكان وسيماً جسيماً شجاعاً نبيلاً له خبرة ورأي وفيه ديانة وإيثار وعليه مهابة ووقار، ومات في عشر الخمسين {cite:shadharat-dhahab p. 622}."
  en: "Baybars's ustadh-dar — made na'ib by al-Sa'id, then seized and reportedly strangled in Jumada I by the sultan's own khassa whom al-Sa'id could not oppose; 'handsome, brave, generous, pious, awe-bearing' {cite:shadharat-dhahab p. 622}."
  fr: "Ustadh-dar de Baybars — nommé na’ib par al-Sa’id, puis saisi et, selon le récit, étranglé en jumada I par les propres proches du sultan, auxquels al-Sa’id ne pouvait s’opposer ; « beau, courageux, généreux, pieux, imposant le respect » {cite:shadharat-dhahab p. 622}."
  es: "El ustadh-dar de Baybars — nombrado na'ib por al-Sa'id, luego capturado y, según se cuenta, estrangulado en Jumada I por el propio khassa del sultán, a quien al-Sa'id no pudo oponerse; 'guapo, valiente, generoso, piadoso, imponente' {cita: shadharat-dhahab p. 622}."
  ur: "Baybars کے استاذ دار — کو السعید نے نائب بنایا، پھر جمادیا اول میں سلطان کے اپنے خاص نے پکڑ لیا اور مبینہ طور پر گلا گھونٹ دیا جس کی السعید مخالفت نہیں کر سکتا تھا۔ 'خوبصورت، بہادر، سخی، پرہیزگار، خوف پیدا کرنے والا' 622}۔"
  tr: "Kraliyet sarayının baş rahibi el-Malik el-Zahir, el-Malik el-Sa'id tarafından vekili olarak atanmıştı. Ancak el-Sa'id'in yakın çevresi bundan hoşnut değildi ve el-Farqani'ye saldırarak onu tutuklattılar. El-Sa'id onlara karşı koyamadı ve rivayete göre Cemâde el-Ula'da boğularak öldürüldü. Yakışıklı, yapılı, cesur ve asil bir kişiydi; tecrübeye, sağlam muhakeme yeteneğine, dindarlığa, özveriye ve vakar ve saygınlık havasına sahipti. Ellili yaşlarında vefat etti. {kaynak: Şadharat-dhahab s. 622}"
  id: "Kepala istana kerajaan, al-Malik al-Zahir, diangkat oleh al-Malik al-Sa'id sebagai wakilnya. Namun, lingkaran dalam al-Sa'id tidak senang dengan hal ini dan menyerang al-Farqani, lalu menangkapnya. Al-Sa'id tidak mampu melawan mereka, dan konon mereka mencekiknya di Jumada al-Ula. Ia tampan, bertubuh tegap, pemberani, dan mulia, memiliki pengalaman, penilaian yang baik, kesalehan, tanpa pamrih, dan aura martabat serta rasa hormat. Ia meninggal pada usia lima puluhan. {cite:shadharat-dhahab p. 622}"
