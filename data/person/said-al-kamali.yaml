  ar: "فقيه ومحدث وداعية وأستاذ جامعي مغربي، وُلد في الرباط سنة 1972، يدرّس بجامعة محمد الخامس ويشرف على كرسي الإمام مالك بمسجد السنة بالرباط حيث يشرح الموطأ أسبوعيا، واشتهر بدروسه في الفقه المالكي والحديث المسجلة والمبثوثة."
  en: "Moroccan jurist, hadith scholar, preacher and university professor, born in Rabat in 1972. He teaches at Mohammed V University and supervises the Imam Malik chair at the al-Sunna Mosque in Rabat, where he explains the Muwatta weekly; he is known for his recorded and broadcast lessons in Maliki jurisprudence and hadith."
