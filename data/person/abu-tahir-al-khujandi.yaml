summary:
  ar: "الإمام العلامة الخجندي الحنفي؛ حدّث بجزء عن عز الدين بن جماعة وأشغل الناس بالمدينة أربعين سنة وانتفع به لدينه وعلمه وتوفي وقد جاوز الثمانين {cite:shadharat-dhahab p. 24}."
  en: "The imam and allama al-Khujandi al-Hanafi; he transmitted a part (juz') on the authority of Izz al-Din ibn Jama'a, kept the people of Medina occupied with learning for forty years, and people benefited from him for his religion and his knowledge; he died having passed eighty {cite:shadharat-dhahab p. 24}."
  fr: "L'imam et érudit al-Khujandi al-Hanafi transmit un fascicule (juz') d'après Izz al-Din ibn Jama'a et occupa les habitants de Médine à l'étude pendant quarante ans ; les gens bénéficièrent de sa religion et de son savoir. Il mourut à plus de quatre-vingts ans {cite:shadharat-dhahab p. 24}."
  es: "El imán y allama al-Khujandi al-Hanafi; transmitió una parte (juz') con la autoridad de Izz al-Din ibn Jama'a, mantuvo a la gente de Medina ocupada con el aprendizaje durante cuarenta años, y la gente se benefició de él por su religión y su conocimiento; murió habiendo pasado ochenta años {cite:shadharat-dhahab p. 24}."
  ur: "امام و علامہ الخجندی الحنفی؛ اس نے عزالدین ابن جماعہ کی طرف سے ایک حصہ ⁦(جوز)⁩ منتقل کیا، چالیس سال تک مدینہ کے لوگوں کو علم میں مشغول رکھا، اور لوگ ان کے دین اور علم کے لیے اس سے مستفید ہوتے رہے۔ اس کا انتقال اسّی سال کا ہو کر ہوا تھا 24}۔"
