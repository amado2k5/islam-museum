summary:
  ar: "عبد الحكيم بن شمس الدين الهندي السيالكوتي البنجابي، فاضل من أهل سيالكوت التابعة للاهور، اتصل بالسلطان شاهجان فأنعم عليه بضياع تكفيه مؤونة السعي للعيش، وتوفي سنة ١٠٦٧هـ الموافقة ١٦٥٦م، وله حواش على البيضاوي والعقائد النسفية والمنطق والبلاغة."
  en: "Abd al-Hakim ibn Shams al-Din al-Hindi al-Sialkoti al-Banjabi, a man of learning from Sialkot, which belongs to Lahore; he attached himself to Sultan Shah Jahan, who gave him estates that freed him from working for a living; he died in 1067 AH, 1656 CE, and wrote glosses on al-Baydawi, the Nasafi creed commentary, logic and rhetoric."
  fr: "Abd al-Hakim ibn Shams al-Din al-Hindi al-Sialkoti al-Banjabi, savant de Sialkot, ville relevant de Lahore ; il s'attacha au sultan Shah Jahan, qui lui donna des domaines le dispensant de travailler pour vivre ; il mourut en 1067 H, 1656 ap. J.-C., et écrivit des gloses sur al-Baydawi, le commentaire du credo de Nasafi, la logique et la rhétorique."
  es: "Abd al-Hakim ibn Shams al-Din al-Hindi al-Sialkoti al-Banjabi, un hombre de letras de Sialkot, que pertenece a Lahore; se unió al sultán Shah Jahan, quien le dio propiedades que lo liberaron de trabajar para ganarse la vida; murió en 1067 AH, 1656 CE, y escribió glosas sobre al-Baydawi, el credo nasafi, lógica y retórica."
