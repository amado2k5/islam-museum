summary:
  ar: "عبد الحكيم بن شمس الدين الهندي السيالكوتي البنجابي، فاضل من أهل سيالكوت التابعة للاهور، اتصل بالسلطان شاهجان فأنعم عليه بضياع تكفيه مؤونة السعي للعيش، وتوفي سنة ١٠٦٧هـ الموافقة ١٦٥٦م، وله حواش على البيضاوي والعقائد النسفية والمنطق والبلاغة."
  en: "Abd al-Hakim ibn Shams al-Din al-Hindi al-Sialkoti al-Banjabi, a man of learning from Sialkot, which belongs to Lahore; he attached himself to Sultan Shah Jahan, who gave him estates that freed him from working for a living; he died in 1067 AH, 1656 CE, and wrote glosses on al-Baydawi, the Nasafi creed commentary, logic and rhetoric."
