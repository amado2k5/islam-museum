summary:
  ar: "الفقيه الشافعي البعلبكي؛ قدم دمشق وتفقه على زين الدين عبد الرحيم بن غانم وسمع من الحافظ القاسم الدمياطي، وكان مناظراً يكثر الكلام ويستدل بغير ما به التدليل في الرامز من الأعيان، واتهم بحسب المصدر بمعاص وشهادات زور أثبتها عليه السلطان؛ قال السبكي: ما مر بي في الشافعية مثله {cite:shadharat-dhahab p. 777}."
  en: "Shafi'i jurist of Ba'labakk; he came to Damascus and studied jurisprudence under Zayn al-Din Abd al-Rahim ibn Ghanim, and heard from the hafiz al-Qasim al-Dimyati. A disputant who talked at length and argued with other than the proper evidence, as in al-Ramiz among the notables. According to the source he was accused of sins and false testimonies that the sultan had established against him; al-Subki said: 'I have not come across the like of him among the Shafi'is' {cite:shadharat-dhahab p. 777}."
