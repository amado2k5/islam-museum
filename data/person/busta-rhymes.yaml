summary:
  ar: "مغنّي راب ومنتج أمريكي، اسمه الأصلي تريفور جورج سميث الابن، وُلد في بروكلين بنيويورك في 20 مايو 1972 لأبوين جامايكيين. بدأ مع فرقة «ليدرز أوف ذا نيو سكول»، ثم حقّق نجاحه المنفرد بألبوم «ذا كامينغ» (1996)، وأصدر أحد عشر ألبومًا منفردًا، ورُشّح لاثنتي عشرة جائزة غرامي دون فوز، ونال سنة 2025 جائزة «روك ذا بيلز» التكريمية الأولى من جوائز إم تي في للفيديو."
  en: "American rapper, producer and actor, born Trevor George Smith Jr. at Brooklyn, New York City, on 20 May 1972 to Jamaican parents. He began with Leaders of the New School, broke through solo with The Coming (1996), has released eleven solo albums, and is one of the most-nominated artists never to win a Grammy, with twelve nominations; in 2025 he received the inaugural Rock the Bells Visionary Award at the MTV Video Music Awards."
  ur: "امریکی ریپر، پروڈیوسر و اداکار، اصل نام ٹریور جارج سمتھ جونیئر، جو 20 مئی 1972 کو بروکلین، نیویارک میں جمیکی والدین کے ہاں پیدا ہوئے۔ انہوں نے «لیڈرز آف دی نیو اسکول» سے آغاز کیا، البم «دی کمنگ» (1996) سے سولو شہرت پائی، گیارہ سولو البم جاری کیے، اور بارہ گریمی نامزدگیوں کے باوجود ایوارڈ نہ جیتنے والے نمایاں فنکاروں میں شامل ہیں؛ 2025 میں انہیں ایم ٹی وی ویڈیو میوزک ایوارڈز کا پہلا «راک دی بیلز ویژنری ایوارڈ» ملا۔"
