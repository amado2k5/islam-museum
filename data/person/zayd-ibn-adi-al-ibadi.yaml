summary:
  ar: "صاحب الوشاية التي دبّرها عند كسرى على النعمان بن المنذر ملك الحيرة، فغضب كسرى على النعمان وطلبه فحبسه حتى مات؛ وكان ذلك أول سلسلة الأحداث التي انتهت بيوم ذي قار، في رواية الرحيق المختوم."
  en: "The courtier whose intrigue at Khosrow's court turned the king against al-Nu'man ibn al-Mundhir of al-Hira, who was summoned and imprisoned until his death, the first link in the chain that ended at Dhu Qar, in al-Raheeq al-Makhtum's account."
  es: "El cortesano cuyas intrigas en la corte de Khosrow hicieron que el rey se volviera contra al-Nu'man ibn al-Mundhir de al-Hira, quien fue convocado y encarcelado hasta su muerte, el primer eslabón de la cadena que terminó en Dhu Qar, según el relato de al-Raheeq al-Makhtum."
  fr: "Le courtisan dont l'intrigue à la cour de Khosrow a retourné le roi contre al-Nu'man ibn al-Mundhir d'al-Hira, qui fut convoqué et emprisonné jusqu'à sa mort, le premier maillon de la chaîne qui s'est terminée à Dhu Qar, selon le récit d'al-Raheeq al-Makhtum."
  ur: "وہ درباری جس کی خسرو کے دربار میں سازش نے بادشاہ کو حیرہ کے النعمان بن المنذر کے خلاف کر دیا، جسے طلب کیا گیا اور اس کی موت تک قید رکھا گیا، اس سلسلے کی پہلی کڑی جو ذو قار پر ختم ہوئی، الرحیق المختم کے کھاتے میں درج ہے۔"
