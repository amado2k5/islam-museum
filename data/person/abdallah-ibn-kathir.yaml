id: person/abdallah-ibn-kathir
class: person
label: { ar: "عبد الله بن كثير", en: "Ibn Kathir al-Makki" }
summary:
  ar: "عبد الله بن كثير يكنى أبا سعيداً ويقال أبو بكر، من قراء مكة في الطبقة الثانية، مولى عمرو بن علقمة الكناني يقال له الداراني لأنه كان عطاراً والعطار يقال له بالحجاز الداراني بل الداري اللخمي لأن بني الداري هاني بن لخم وكان منهم تميم الداري، وقيل إنه من أبناء فارس الذين بعثهم كسرى في الشون إلى اليمن حتى طردوا الحبشة، مات سنة عشرين ومائة بمكة وبها دفن وإليه صارت الرئاسة {cite:fihrist-ibn-al-nadim p. 73}."
  en: "Meccan reader (d. 120 AH) — the perfumer-mawla to whom the qira'a leadership passed {cite:fihrist-ibn-al-nadim p. 73}."
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
