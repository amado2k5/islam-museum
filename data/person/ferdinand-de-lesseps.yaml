summary:
  ar: "فرديناند دي لسبس، دبلوماسي فرنسي عاش بين سنتي 1805 و1894، وهو صاحب امتياز قناة السويس. درس في أربعينيات القرن التاسع عشر إمكان شق قناة بين المتوسط والأحمر، وعرض مشروعه على سعيد باشا والي مصر، فنال الامتياز ثم أُسست شركة القناة في باريس سنة 1858 بدعم نابليون الثالث. واختار موقع بورسعيد مع فريق من المهندسين، ونُصب له تمثال عند مدخل القناة أُزيل في حرب 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  en: "Ferdinand de Lesseps, a French diplomat who lived from 1805 to 1894, was the grantee of the Suez Canal concession. In the early 1840s he studied the possibility of a canal between the Mediterranean and the Red Sea and put his proposal to Sa'id Pasha, the wali of Egypt; he obtained the concession, and the Suez Canal Company was founded in Paris in 1858 with Napoleon III's support. He chose the site of Port Said with a party of engineers, and a statue of him stood at the canal entrance until it was destroyed in the war of 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  ur: "فرڈیننڈ دی لیسپس، فرانسیسی سفارت کار جو 1805ء سے 1894ء تک زندہ رہے، نہرِ سویز کے امتیازی اجازت نامے کے حامل تھے۔ انہوں نے 1840ء کی دہائی کے اوائل میں بحیرۂ روم اور بحیرۂ احمر کے درمیان نہر کے امکان کا مطالعہ کیا اور مصر کے والی سعید پاشا کو اپنی تجویز پیش کی؛ انہیں امتیاز ملا اور 1858ء میں نپولین سوم کی حمایت سے پیرس میں نہر کی کمپنی قائم ہوئی۔ انہوں نے انجینئروں کی ایک ٹولی کے ساتھ بورسعید کی جگہ چنی، اور ان کا مجسمہ نہر کے دہانے پر کھڑا رہا یہاں تک کہ 1956ء کی جنگ میں تباہ ہو گیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}۔"
