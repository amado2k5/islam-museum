summary:
  ar: "صقر بن خالد القاسمي (لا تاريخ ولادة له في أي مصدر – توفي سنة 1914)، حاكم إمارة الشارقة من أسرة آل قاسمي من 1883 إلى وفاته، وحاكم رأس الخيمة من 1900. استولى على الحكم انقلابًا أثناء غياب عمه الحاكم سالم بن سلطان، ثم صافاه بتسوية معاش سنة 1884، وواجه محاولات انفصال حميرية وشعم، ونجا من مؤامرات عمه المتكررة، وضمّ رأس الخيمة سنة 1900 وحكمها بالولاة، حتى إذا أحكم عمه سالم قبضته عليها سنة 1910 بقي صقر حاكمًا اسميًا لها حتى وفاته، وخلفه في الشارقة خالد بن أحمد، ومن أبنائه سلطان الثاني ومحمد اللذين حكما الشارقة في القرن العشرين."
  en: "Saqr bin Khalid Al Qasimi (no birth date is given by any source read – died in 1914) was ruler of Sharjah of the Al Qasimi family from 1883 until his death, and ruler of Ras Al Khaimah from 1900. Left in charge of Sharjah, he seized power in a coup during the absence of his uncle, the ruler Salim bin Sultan, then settled with him under the pension agreement of 1884; he faced the secession attempts of Hamriyah and Sha'am, survived his uncle's repeated plots, annexed Ras Al Khaimah in 1900 and governed it through deputies, and remained its nominal ruler until his death even after his uncle Salim consolidated real power there in 1910. He was succeeded in Sharjah by Khalid bin Ahmad; his sons Sultan II and Muhammad later ruled Sharjah in the twentieth century."
  ur: "صقر بن خالد القاسمی (تاریخِ ولادت کسی ماخذ میں نہیں – وفات: 1914ء)، 1883ء سے وفات تک شارجہ اور 1900ء سے راس الخیمہ کے حکمران تھے۔ انہوں نے چچا سلیم بن سلطان کی غیر موجودگی میں حکومت سنبھالی، 1884ء میں پنشن کا معاہدہ کیا، حمیریہ و شعم کی علاحدگی کی کوششیں ناکام بنائیں، 1900ء میں راس الخیمہ ضم کیا اور نائبین کے ذریعے حکومت کی؛ 1910ء کے بعد وہاں اصل اقتدار چچا سلیم کے پاس چلا گیا مگر صقر وفات تک برائے نام حکمران رہے۔"
