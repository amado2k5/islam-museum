  id: "Kartu pendahuluan Muhammad Asaad Al-Yasari, kaligrafer Ottoman Istanbul pada abad kedelapan belas dan pendiri sekolah kaligrafi, yang meninggal pada tahun 1798 M; ia dikenang oleh kamus tokoh-tokoh terkenal dan terjemahannya belum pernah diulas di halaman tersebut."
