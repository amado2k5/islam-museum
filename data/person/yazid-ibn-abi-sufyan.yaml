summary:
  ar: "أمير جند دمشق؛ لما أراد أبو بكر غزو الشام بعد فراغه من الردة عزل خالد بن سعيد بن العاص عن لوائه بإشارة عمر ودفعه إليه، فسار به ومعاوية أخوه يحمله بين يديه وسلك طريق تبوك؛ وعند الواقدي ولّاه أبو بكر دمشق من أقاليم الشام الثلاثة، وعند أبي يخنف قال أبو بكر للأمراء «إن اجتمعتم على قتال فأميركم أبو عبيدة وإلا فيزيد»."
  en: "Commander of the army of Dimashq; when Abu Bakr resolved on the conquest of Syria after finishing the Ridda he deposed Khalid ibn Sa'id ibn al-As from his banner on Umar's counsel and gave it to Yazid, who marched with his brother Mu'awiya bearing it before him, taking the Tabuk road; per al-Waqidi Abu Bakr assigned him Dimashq of Syria's three districts, and per Abu Yakhnaf he told the commanders 'if you join in battle your commander is Abu Ubayda, otherwise Yazid'."
  ur: "شام کی طرف بھیجے گئے لشکروں کے قائد، جنہیں ابو بکر نے دمشق کی مہم سونپی؛ ان کے بھائی معاویہ بھی ان کے ساتھ تھے۔ {cite:futuh-buldan-maarif-1407}"
