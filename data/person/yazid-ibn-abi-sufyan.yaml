summary:
  ar: "أمير جند دمشق؛ لما أراد أبو بكر غزو الشام بعد فراغه من الردة عزل خالد بن سعيد بن العاص عن لوائه بإشارة عمر ودفعه إليه، فسار به ومعاوية أخوه يحمله بين يديه وسلك طريق تبوك؛ وعند الواقدي ولّاه أبو بكر دمشق من أقاليم الشام الثلاثة، وعند أبي يخنف قال أبو بكر للأمراء «إن اجتمعتم على قتال فأميركم أبو عبيدة وإلا فيزيد»."
  en: "Commander of the army of Dimashq; when Abu Bakr resolved on the conquest of Syria after finishing the Ridda he deposed Khalid ibn Sa'id ibn al-As from his banner on Umar's counsel and gave it to Yazid, who marched with his brother Mu'awiya bearing it before him, taking the Tabuk road; per al-Waqidi Abu Bakr assigned him Dimashq of Syria's three districts, and per Abu Yakhnaf he told the commanders 'if you join in battle your commander is Abu Ubayda, otherwise Yazid'."
  ur: "شام کی طرف بھیجے گئے لشکروں کے قائد، جنہیں ابو بکر نے دمشق کی مہم سونپی؛ ان کے بھائی معاویہ بھی ان کے ساتھ تھے۔ {cite:futuh-buldan-maarif-1407}"
  es: "Comandante del ejército de Dimashq; cuando Abu Bakr decidió conquistar Siria tras finalizar la Ridda, depuso a Khalid ibn Sa'id ibn al-As de su estandarte por consejo de Umar y se lo dio a Yazid, quien marchó con su hermano Mu'awiya llevándolo delante de él, tomando el camino de Tabuk; según al-Waqidi, Abu Bakr le asignó el Dimashq de los tres distritos de Siria, y según Abu Yakhnaf les dijo a los comandantes: \"Si entráis en batalla, vuestro comandante es Abu Ubayda; de lo contrario, Yazid\"."
  fr: "Commandant de l'armée de Dimashq; lorsqu'Abu Bakr décida de conquérir la Syrie après avoir achevé la Ridda, il déposa Khalid ibn Sa'id ibn al-As de son étendard sur le conseil d'Umar et le donna à Yazid, qui marcha avec son frère Mu'awiya le portant devant lui, empruntant la route de Tabuk; selon al-Waqidi, Abu Bakr lui confia le commandement de Dimashq, qui s'étendait sur les trois districts de Syrie, et selon Abu Yakhnaf, il dit aux commandants: « Si vous participez à la bataille, votre commandant est Abu Ubayda, sinon Yazid »."
  tr: "Şam ordusunun komutanı; Ebu Bekir dinden dönmesini tamamladıktan sonra Suriye'yi işgal etmeyi planladığında, Umar'ın işaretiyle Halid bin Said ibn al-As'ı sancağından indirdi ve ona doğru itti. Onunla birlikte kardeşi Muaviye ile birlikte yürüdü ve Tabuk yolunu seçti. El-Vaqidi'ye göre, Ebu Bekir onu Levant'ın üç vilayetinden biri olarak atamış ve Ebu Yakhnaf ile birlikte prenslere şöyle demiştir: \"Eğer savaşmak için toplanırsanız, komutanınız Ebu Ubeyde'dir; aksi takdirde yükselir.\""
  id: "Komandan tentara Damaskus; ketika Abu Bakr berniat menyerang Suriah setelah selesai murtad, ia memberhentikan Khalid ibn Sa'id ibn al-As dari panjinya atas sinyal Umar dan mendorongnya ke arahnya. Ia ikut serta bersama saudaranya Muawiya di depannya dan mengambil jalan menuju Tabuk. Menurut al-Waqidi, Abu Bakr mengangkatnya sebagai salah satu dari tiga provinsi di Levant, dan bersama Abu Yakhnaf, Abu Bakr berkata kepada para pangeran: \"Jika kalian berkumpul untuk bertempur, komandan kalian adalah Abu Ubaidah; jika tidak, ia akan bertambah.\""
