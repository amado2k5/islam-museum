summary:
  ar: "مؤرخ الإباضية في المغرب، من ورجلان ⁦(ورقلة)⁩، وصاحب كتاب السيرة وأخبار الأئمة، وهو أقدم وثيقة من داخل الطائفة عن تاريخ الإباضية في المغرب، ولم تُنشر كاملة بعد."
  en: "Historian of the Ibadis of the Maghrib, a native of Wardilan (Ouargla) and author of the Sira wa-akhbar al-a'imma, the oldest document by a member of the sect on Maghribi Ibadi history; it has not yet been published in full {cite:encyclopaedia-of-islam-2 vol. 1 p. 186}."
  fr: "Historien des ibadites du Maghreb, originaire de Wardilan (Ouargla), auteur de la Sira wa-akhbar al-a'imma, plus ancien document sur l'histoire ibadite maghrébine écrit par un membre de la communauté ; l'œuvre n'a pas encore été publiée intégralement {cite:encyclopaedia-of-islam-2 vol. 1 p. 186}."
  es: "Historiador de los ibadíes del Magreb, natural de Wardilan (Ouargla) y autor de la Sira wa-akhbar al-a'imma, el documento más antiguo de un miembro de la secta sobre la historia magrebí ibadí; aún no se ha publicado en su totalidad {citar:encyclopaedia-of-islam-2 vol. 1 pág. 186}."
