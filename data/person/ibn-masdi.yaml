  en: "The Granadan hafiz — Ibn Nasir al-Din: 'a wide-travelled hafiz-allama of discernment; Shi'ism was bruited of him'; he settled at Mecca and was treacherously killed there in Shawwal 663 {cite:shadharat-dhahab p. 543}."
