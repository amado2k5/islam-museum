summary:
  ar: "مؤلف موسيقي وكاتب باكستاني (1902–1953) لحّن موسيقى النشيد الوطني الباكستاني سنة 1949. وُلد في كراتشي ودرس أنظمة الموسيقى الشرقية والغربية في الهند ولندن، وجاب بلدان الشرق والغرب باحثاً في تاريخ الموسيقى ونظريتها، وكتب مقالات في الموسيقى والثقافة، وتوفي قبل اعتماد النشيد رسمياً سنة 1954."
  en: "Pakistani composer and writer (1902–1953) who composed the music of Pakistan's national anthem in 1949. Born in Karachi, he studied Eastern and Western musical systems in India and London, travelled widely in the East and the West researching the history and theory of music, and wrote on music and culture; he died before the anthem was officially adopted in 1954."
  ur: "پاکستانی موسیقار اور مصنف (1902ء–1953ء) جنھوں نے 1949ء میں پاکستان کے قومی ترانے کی موسیقی ترتیب دی۔ وہ کراچی میں پیدا ہوئے، ہندوستان اور لندن میں مشرقی و مغربی موسیقی کے نظاموں کا مطالعہ کیا، موسیقی کی تاریخ و نظریے کی تحقیق میں مشرق و مغرب کا سفر کیا اور موسیقی و ثقافت پر لکھا؛ وہ ترانے کی سرکاری منظوری (1954ء) سے پہلے وفات پا گئے۔"
