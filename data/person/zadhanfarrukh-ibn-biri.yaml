id: person/zadhanfarrukh-ibn-biri
class: person
label: { ar: "زادان فروخ بن بيري", en: "Zadhanfarrukh ibn Biri", es: "Zadhanfarrukh ibn Biri", fr: "Zadhanfarrukh ibn Biri", ur: "غضنفرخ ابن بری" }
summary:
  ar: "كاتب الحجاج؛ عند البلاذري استكتبه الحجاج لما ولي العراق وكان معه صالح بن عبد الرحمن يخط بين يديه بالعربية والفارسية فوصله بالحجاج ثم قال له إنك قريب إلى الأمير وأراه قد استخفني ولا آمن أن يقدمني عليك."
  en: "al-Hajjaj's scribe; in al-Baladhuri employed when he took Iraq, Salih ibn Abd al-Rahman writing Arabic and Persian before him — he presented Salih to al-Hajjaj, then confided fear of being displaced by him."
  es: "El escriba de al-Hajjaj; en al-Baladhuri, empleado cuando tomó Irak, Salih ibn Abd al-Rahman escribía árabe y persa para él; le presentó a Salih a al-Hajjaj y luego le confió su temor a ser desplazado por él."
  fr: "Le scribe d'al-Hajjaj; à al-Baladhuri employé lorsqu'il prit l'Irak, Salih ibn Abd al-Rahman écrivant en arabe et en persan devant lui — il présenta Salih à al-Hajjaj, puis confia sa crainte d'être déplacé par lui."
  ur: "الحجاج کا کاتب؛ البلادوری میں ملازمت کرتے ہوئے جب وہ عراق لے گئے تو صالح بن عبدالرحمٰن اس کے سامنے عربی اور فارسی لکھ رہے تھے - اس نے صالح کو الحجاج کے سامنے پیش کیا، پھر اس کے بے گھر ہونے کے خوف سے رازداری ظاہر کی۔"
  tr: "El-Hacac'ın kâtibi; El-Baladhuri ile birlikte, Irak valisi olduğunda ona yazdı. Yanında Salih ibn Abdülrahman vardı, Arapça ve Farsça yazıyordu. Onu El-Hacac ile ilişkilendirdi, sonra prense yakın olduğunu ve beni küçümsediğini söyledi, beni sizin huzurunuza çıkaracağına güvenmedim."
  id: "Juru tulis Al-Hajjaj; bersama Al-Baladhuri, Al-Hajjaj menulis kepadanya ketika ia menjadi gubernur Irak. Ia ditemani oleh Salih ibn Abd al-Rahman yang menulis dalam bahasa Arab dan Persia. Ia menghubungkan Al-Hajjaj dengan Al-Hajjaj, lalu mengatakan bahwa ia dekat dengan pangeran dan telah meremehkan saya, dan saya tidak percaya ia akan membawa saya ke hadapan Anda."
