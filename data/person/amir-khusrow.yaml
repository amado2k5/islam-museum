summary:
  ar: "أمير خسرو ⁦(1253 – أكتوبر 1325)⁩، شاعر سلطنة دهلي وموسيقيها وعالمها، وأشهر شعراء الفارسية في الهند. وُلد في بتيالي ونشأ في دهلي فخدم بلاط ثمانية من سلاطينها، وكتب بالفارسية والهندوية ونُسبت إليه اختراعات موسيقية وشعرية راسخة في ثقافة جنوب آسيا، حتى لُقّب بـ«طوطي هند». وفي سنة 1310 صار تلميذًا ومريدًا للولي الصوفي الجشتي نظام الدين أولياء، فكتب فيه المدائح والمراثي، وتوفي في دهلي بعده بأشهر سنة 1325."
  en: "Amir Khusrow (1253 - October 1325) was a poet, musician and scholar of the Delhi Sultanate and the most celebrated Persian-language poet of India. Born at Patiyali and raised in Delhi, he served the courts of eight of its sultans, wrote in Persian and Hindavi, and was credited with musical and poetic innovations that remain rooted in South Asian culture, earning him the epithet 'Parrot of India' (Tuti-i Hind). In 1310 he became a disciple (murid) of the Chishti Sufi saint Nizamuddin Auliya, in whose praise and memory he wrote, and he died in Delhi a few months after his master in 1325."
  ur: "امیر خسرو ⁦(1253ء – اکتوبر 1325ء)⁩ سلطنت دہلی کے شاعر، موسیقار اور عالم تھے اور ہندوستان کے سب سے مشہور فارسی شاعر شمار ہوتے ہیں۔ پٹیالی میں پیدا ہوئے اور دہلی میں پروان چڑھے؛ انھوں نے اس کے آٹھ سلاطین کے دربار دیکھے، فارسی اور ہندوی میں لکھا، اور موسیقی و شاعری کی ایسی اختراعات ان سے منسوب ہیں جو جنوبی ایشیا کی ثقافت میں رچ بس گئیں، یہاں تک کہ انھیں «طوطی ہند» کہا گیا۔ 1310ء میں وہ چشتی صوفی بزرگ نظام الدین اولیا کے مرید ہوئے اور 1325ء میں دہلی میں وفات پائی۔"
  es: "Amir Khusrow (1253 - octubre de 1325) fue poeta, músico y erudito del Sultanato de Delhi, y el poeta en lengua persa más célebre de la India. Nacido en Patiyali y criado en Delhi, sirvió en las cortes de ocho de sus sultanes, escribió en persa e hindavi, y se le atribuyen innovaciones musicales y poéticas que perduran en la cultura del sur de Asia, lo que le valió el sobrenombre de «Loro de la India» (Tuti-i Hind). En 1310 se convirtió en discípulo (murid) del santo sufí Chishti Nizamuddin Auliya, en cuya alabanza y memoria escribió, y falleció en Delhi pocos meses después que su maestro en 1325."
  fr: "Amir Khusrow (1253 - octobre 1325) était un poète, musicien et érudit du sultanat de Delhi, et le plus célèbre poète de langue persane d'Inde. Né à Patiyali et élevé à Delhi, il servit à la cour de huit sultans, écrivit en persan et en hindavi, et on lui attribue des innovations musicales et poétiques qui demeurent profondément ancrées dans la culture sud-asiatique, ce qui lui valut le surnom de « Perroquet de l'Inde » (Tuti-i Hind). En 1310, il devint disciple (murid) du saint soufi chishti Nizamuddin Auliya, à la gloire duquel il écrivit des poèmes, et mourut à Delhi quelques mois après son maître en 1325."
  tr: "Amir Khusraw (1253 – Ekim 1325), Delhi Sultanlığı'nın şairi, müzisyeni ve bilgini, Hindistan'ın en ünlü Fars şairlerinden biriydi. Betiali'de doğdu ve Delhi'de büyüdü; sekiz sultanının saraylarında hizmet etti. Farsça ve Hintçe yazdı ve Güney Asya kültüründe derin köklü müzikal ve şiirsel buluşlarla tanındı; öyle ki 'Hindistan'ın Papağanı' lakabını aldı. 1310'da Jashti Sufi azizi Nizamuddin Awliya'nın öğrencisi ve öğrencisi oldu, ona övgüler ve ağıtlar yazdı. Aylar sonra 1325'te Delhi'de öldü."
  id: "Amir Khusraw (1253 – Oktober 1325) adalah seorang penyair, musisi, dan cendekiawan dari Kesultanan Delhi, serta salah satu penyair Persia paling terkenal di India. Ia lahir di Betiali dan tumbuh besar di Delhi, melayani istana delapan sultannya. Ia menulis dalam bahasa Persia dan Hindi, dan dikenal sebagai penemuan musik dan puisi yang sangat berakar dalam budaya Asia Selatan, sampai-sampai ia dijuluki 'Burung Kakak Tua India.' Pada tahun 1310, ia menjadi murid dan murid wali Sufi Jashti, Nizamuddin Awliya, menulis pujian dan elegi dalam dirinya. Ia meninggal di Delhi beberapa bulan kemudian pada tahun 1325."

