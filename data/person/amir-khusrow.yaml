summary:
  ar: "أمير خسرو ⁦(1253 – أكتوبر 1325)⁩، شاعر سلطنة دهلي وموسيقيها وعالمها، وأشهر شعراء الفارسية في الهند. وُلد في بتيالي ونشأ في دهلي فخدم بلاط ثمانية من سلاطينها، وكتب بالفارسية والهندوية ونُسبت إليه اختراعات موسيقية وشعرية راسخة في ثقافة جنوب آسيا، حتى لُقّب بـ«طوطي هند». وفي سنة 1310 صار تلميذًا ومريدًا للولي الصوفي الجشتي نظام الدين أولياء، فكتب فيه المدائح والمراثي، وتوفي في دهلي بعده بأشهر سنة 1325."
  en: "Amir Khusrow (1253 - October 1325) was a poet, musician and scholar of the Delhi Sultanate and the most celebrated Persian-language poet of India. Born at Patiyali and raised in Delhi, he served the courts of eight of its sultans, wrote in Persian and Hindavi, and was credited with musical and poetic innovations that remain rooted in South Asian culture, earning him the epithet 'Parrot of India' (Tuti-i Hind). In 1310 he became a disciple (murid) of the Chishti Sufi saint Nizamuddin Auliya, in whose praise and memory he wrote, and he died in Delhi a few months after his master in 1325."
  ur: "امیر خسرو ⁦(1253ء – اکتوبر 1325ء)⁩ سلطنت دہلی کے شاعر، موسیقار اور عالم تھے اور ہندوستان کے سب سے مشہور فارسی شاعر شمار ہوتے ہیں۔ پٹیالی میں پیدا ہوئے اور دہلی میں پروان چڑھے؛ انھوں نے اس کے آٹھ سلاطین کے دربار دیکھے، فارسی اور ہندوی میں لکھا، اور موسیقی و شاعری کی ایسی اختراعات ان سے منسوب ہیں جو جنوبی ایشیا کی ثقافت میں رچ بس گئیں، یہاں تک کہ انھیں «طوطی ہند» کہا گیا۔ 1310ء میں وہ چشتی صوفی بزرگ نظام الدین اولیا کے مرید ہوئے اور 1325ء میں دہلی میں وفات پائی۔"

