summary:
  ar: "سيد عاصم منير أحمد شاه ⁦(وُلد سنة 1968 في راولبندي)⁩ مشير باكستاني يشغل رئاسة أركان الجيش منذ تشرين الثاني 2022، ومنذ كانون الأول 2025 أول رئيس لقوات الدفاع في بلاده. أول رئيس أركان ترأس الاستخبارات العسكرية وجهاز الاستخبارات معًا (2018–2019)، حفظ القرآن أثناء خدمته في السعودية — وهو أول رئيس أركان باكستاني يحفظه — ورُقّي إلى مشير في أيار 2025 بعد النزاع مع الهند."
  en: "Syed Asim Munir Ahmed Shah (born 1968 in Rawalpindi) is a Pakistani field marshal who has been Chief of the Army Staff since November 2022 and, since December 2025, Pakistan's first Chief of Defence Forces. The first army chief to have headed both Military Intelligence and the ISI (2018–2019), he memorised the Quran while posted in Saudi Arabia - the first Pakistani army chief to do so - and was promoted field marshal in May 2025 after the India–Pakistan conflict."
  ur: "سید عاصم منیر احمد شاہ (پیدائش 1968، راولپنڈی) پاکستانی فیلڈ مارشل ہیں جو نومبر 2022 سے سربراہ پاک فوج اور دسمبر 2025 سے پاکستان کے پہلے چیف آف ڈیفنس فورسز ہیں۔ وہ ایم آئی اور آئی ایس آئی دونوں کی سربراہی کرنے والے پہلے آرمی چیف ہیں؛ انھوں نے سعودی عرب میں تعیناتی کے دوران قرآن حفظ کیا اور مئی 2025 میں فیلڈ مارشل بنے۔"
