  ar: "محمد بن علي بن محمد حامد بن محمد صابر الفاروقي التهانوي، من أهل الهند، حنفي المذهب، كان لغويا مشاركا في بعض العلوم. من تصانيفه «كشاف اصطلاحات الفنون» و«سبق الغايات في نسق الآيات». كان حيا سنة 1158هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
