summary:
  ar: "محمد بن علي بن محمد حامد بن محمد صابر الفاروقي التهانوي، من أهل الهند، حنفي المذهب، كان لغويا مشاركا في بعض العلوم. من تصانيفه «كشاف اصطلاحات الفنون» و«سبق الغايات في نسق الآيات». كان حيا سنة 1158هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  en: "Muhammad ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Faruqi al-Tahanawi, from India, a Hanafi, a lexicographer who took part in several sciences. His works include 'Kashshaf istilahat al-funun' and 'Sabq al-ghayat fi nasq al-ayat'. He was alive in 1158 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  es: "Muhammad ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Faruqi al-Tahanawi, de la India, hanafi, lexicógrafo que participó en varias ciencias. Entre sus obras se incluyen 'Kashshaf istilahat al-funun' y 'Sabq al-ghayat fi nasq al-ayat'. Estaba vivo en 1158 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  fr: "Muhammad ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Faruqi al-Tahanawi, originaire d'Inde, Hanafi, lexicographe qui a participé à plusieurs sciences. Ses œuvres incluent « Kashshaf istilahat al-funun » et « Sabq al-ghayat fi nasq al-ayat ». Il était vivant en 1158 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  ur: "محمد بن علی بن محمد حامد بن محمد صابر الفاروقی الطحناوی، ہندوستان سے، ایک حنفی، ایک لغت نگار جس نے متعدد علوم میں اپنا حصہ ڈالا۔ ان کی تصانیف میں 'کشف استلاحت الفنون' اور 'سبق الغیات فی ناصق الآیات' شامل ہیں۔ وہ 1158ھ میں زندہ تھے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2056}"
  tr: "Muhammed ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Faruqi al-Tahanawi, Hindistan'dan, düşünce okulundan Hanefi, bazı bilim alanlarında yer alan bir dilbilimciydi. Eserleri arasında 'Kaşşaf İstilaat el-Funoon' ve 'Sabiq al-Ghayayat fi Nasq al-Ayat' bulunmaktadır. 1158 Hicri yılında hayattaydı. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.2056}"
  id: "Muhammad ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Faruqi al-Tahanawi, dari India, Hanafi dari aliran pemikiran, adalah seorang ahli bahasa yang terlibat dalam beberapa ilmu pengetahuan. Di antara karyanya adalah 'Kashshaf Istilaat al-Funoon' dan 'Sabiq al-Ghayayat fi Nasq al-Ayat.' Ia masih hidup pada tahun 1158 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2056}"
