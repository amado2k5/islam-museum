summary:
  ar: "مقاتل فنون قتالية مختلطة أمريكي معتزل (وُلد سنة 1986 في ماديسونفيل بكنتاكي ونشأ في ولاية واشنطن). أول بطل لوزن الذبابة في يو إف سي، دافع عن لقبه 11 مرة متتالية وهو رقم قياسي في المنظمة، ثم فاز ببطولة «ون» لوزن الذبابة سنة 2022 وحسم ثلاثيته سنة 2023، واعتزل سنة 2024 فكان أول المنضمين إلى قاعة مشاهير «ون». يُعد على نطاق واسع من أعظم المقاتلين في تاريخ الرياضة."
  en: "Retired American mixed martial artist (born 1986 in Madisonville, Kentucky, raised in Washington State). The inaugural UFC flyweight champion, he defended the title a UFC-record 11 consecutive times, then won the ONE Championship flyweight title in 2022 and its trilogy in 2023, retiring in 2024 as ONE's first hall-of-fame inductee. He is widely regarded as one of the greatest fighters in the sport's history."
  ur: "ریٹائرڈ امریکی مخلوط مارشل آرٹسٹ (پیدائش 1986، میڈیسن ویل، کینٹکی؛ پرورش ریاست واشنگٹن)۔ یو ایف سی کے افتتاحی فلائی ویٹ چیمپئن، جنہوں نے یو ایف سی ریکارڈ 11 بار لگاتار خطاب کا دفاع کیا، پھر 2022 میں ون چیمپئن شپ کا فلائی ویٹ خطاب جیتا اور 2024 میں ون کے پہلے ہال آف فیم رکن کے طور پر ریٹائر ہوئے۔ انہیں کھیل کی تاریخ کے عظیم ترین فائٹرز میں شمار کیا جاتا ہے۔"
