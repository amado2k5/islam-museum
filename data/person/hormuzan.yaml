id: person/hormuzan
class: person
label: { ar: "الهرمزان" }
summary:
  ar: "قائد فارسي على الأهواز، وقعت بينه وبين المسلمين وقائع، ثم طلب الصلح، وكاتب عتبة بن غزوان في ذلك {cite:tabari-tarikh-abu-al-fadl j.4 p.74}. وذكر فهرس الجزء أن عبيد الله بن عمر قتل الهرمزان في سنة أربع وعشرين {cite:tabari-tarikh-abu-al-fadl j.4 p.580}. وعند البلاذري عن معقل بن يسار أن عمر شاوره فسأله أنبدأ بأصبهان أو بأذربيجان فقال الهرمزان أصبهان الرأس وأذربيجان الجناحان فإن قطعت الرأس سقط الجناحان والرأس."
gender: male
