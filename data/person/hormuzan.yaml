id: person/hormuzan
class: person
label: { ar: "الهرمزان" }
summary:
  ar: "قائد فارسي على الأهواز، وقعت بينه وبين المسلمين وقائع، ثم طلب الصلح، وكاتب عتبة بن غزوان في ذلك {cite:tabari-tarikh-abu-al-fadl j.4 p.74}. وذكر فهرس الجزء أن عبيد الله بن عمر قتل الهرمزان في سنة أربع وعشرين {cite:tabari-tarikh-abu-al-fadl j.4 p.580}. وعند البلاذري عن معقل بن يسار أن عمر شاوره فسأله أنبدأ بأصبهان أو بأذربيجان فقال الهرمزان أصبهان الرأس وأذربيجان الجناحان فإن قطعت الرأس سقط الجناحان والرأس."
  tr: "Ahvaz'daki bir İran komutanı, aralarında Müslümanlarla yaşanan olaylar sonrasında barış aradı. Utbah ibn Ghazwan bunu {cite:tabari-tarikh-abu-al-fadl j.4 s.74} yazmıştır. Cildin dizininde, Ubayd Allah ibn Umar'ın yirmi dördüncü yılda el-Hurmuzan'ı öldürdüğü belirtilmiştir {cite:tabari-tarikh-abu-al-fadl j.4 s.580}. Ma'qil ibn Yasar'dan al-Baladhuri'ye göre, Ömer ona danışmış ve İsfahan ile mi yoksa Azerbaycan mı başlaması gerektiğini sordu. Al-Hormozan şöyle dedi: 'İsfahan baştır, Azerbaycan iki kanattır; başı kesersen kanatlar ve baş düşer.'"
  id: "Seorang komandan Persia atas Ahvaz, di antara siapa peristiwa terjadi dengan Muslim, kemudian ia mencari perdamaian. Utbah ibn Ghazwan menulis tentang hal ini {cite:tabari-tarikh-abu-al-fadl j.4 hlm.74}. Indeks volume tersebut menyebutkan bahwa Ubayd Allah ibn Umar membunuh al-Hurmuzan pada tahun dua puluh empat {cite:tabari-tarikh-abu-al-fadl j.4 hlm.580}. Menurut al-Baladhuri dari Ma'qil ibn Yasar, Umar berkonsultasi kepadanya dan bertanya apakah harus mulai dari Isfahan atau Azerbaijan. Al-Hormozan berkata: 'Isfahan adalah kepala, dan Azerbaijan adalah dua sayap; jika kepalanya dipotong, sayap dan kepala jatuh.'"
