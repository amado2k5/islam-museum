summary:
  ar: "محدّث وداعية مصري، وُلد في قرية منية سمنود بمحافظة الدقهلية سنة 1954، تخرج مهندسا ميكانيكيا سنة 1977 ثم رحل إلى اليمن فطلب علم الحديث على الشيخ مقبل بن هادي الوادعي في دماج، وعاد إلى قريته فأسس فيها مسجدا ومدرسة شرعية ومكتبة، وله مؤلفات كثيرة في الحديث والتفسير والفقه."
  en: "Egyptian hadith scholar and preacher, born in the village of Minya Samannud, Dakahlia, in 1954. He graduated as a mechanical engineer in 1977, then travelled to Yemen to study hadith under Sheikh Muqbil ibn Hadi al-Wadi'i in Dammaj. Back in his village he founded a mosque, a sharia school and a library, and has written many books on hadith, exegesis and jurisprudence."
  ur: "مصری محدث اور مبلغ، جو 1954 میں محافظہ الدقہلیہ کے گاؤں منیہ سمنود میں پیدا ہوئے۔ وہ 1977 میں مکینیکل انجینئر بنے، پھر یمن گئے اور دماج میں شیخ مقبل بن ہادی الوادعی سے علمِ حدیث پڑھا۔ واپس آ کر انہوں نے اپنے گاؤں میں مسجد، شرعی مدرسہ اور لائبریری قائم کی، اور حدیث، تفسیر اور فقہ پر بہت سی کتابیں لکھیں۔"
