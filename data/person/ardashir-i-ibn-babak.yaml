id: person/ardashir-i-ibn-babak
class: person
label: { ar: "أردشير بن بابك" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك أردشير بن بابك» {cite:tabari-tarikh-abu-al-fadl j.2 p.37}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وعند المسعودي ذكر في أخبار النرد أنه أول من لعب بها وأرى تقلب الدنيا بأهلها وجعل بيوتها اثني عشر على عدد الشهور وكلابها ثلاثين بعدد أيامها والفصين مثال للقدر وتلعبه بأهل هذا العالم {cite:muruj-al-dhahab p. 681}"
  tr: "Sasani Perslerinin bir kralı, el-Tabari'nin 'Ardaşir Kralı ibn Babak' başlığıyla bahsedilmiştir {atıf:tabari-tarikh-abu-al-fadl j.2 s.37}. Bu yerde, saltanat yılları ve hikayeleri hakkında söylenenler anlatılır. al-Mas'udi'ye göre, zarlarla ilk oynayan ve dünyanın halkıyla yaşanan kargaşaya tanık olan ilk kişi olduğunu, evlerini ay sayısına göre on iki, köpeklerini gün sayısına göre otuz ve iki lobu kader örneği olarak bu dünyanın insanlarıyla oynadığını belirtmiştir {cite:muruj-al-dhahab, s. 681}"
  id: "Seorang raja Persia Sasanian, yang disebutkan oleh al-Tabari dengan judul 'Sebutan Raja Ardashir ibn Babak' {cite:tabari-tarikh-abu-al-fadl j.2 hlm.37}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan. Menurut al-Mas'udi, ia menyebutkan dalam catatan dadu bahwa ia adalah yang pertama bermain dengan dadu dan menyaksikan gejolak dunia bersama rakyatnya, menjadikan rumahnya dua belas menurut jumlah bulan, anjingnya tiga puluh menurut jumlah hari, dan dua lobus sebagai contoh takdir, bermain dengan orang-orang dunia ini {cite:muruj-al-dhahab, hlm. 681}"
