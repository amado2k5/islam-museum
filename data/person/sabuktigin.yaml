summary:
  ar: "الأمير سبكتكين أبو منصور ناصر الدولة؛ أبو السلطان محمود بن سبكتكين؛ ورد مدينة بخارى في أيام نوح بن منصور الساماني في صحبة أبي إسحاق ابن ألبتكين وهو حاجبه فعرفه أركان تلك الدولة بالشهامة والصرامة وتوسموا فيه الارتفاع إلى المكان؛ ولما خرج أبو إسحاق إلى غزنة والياً عليها وسادها مات أبوه فانصرف الأمير سبكتكين بانصرافه على جملته في زعامة رجاله ومراعاة ما وراء بابه فلم يلبث أبو إسحاق بعد مفارقتها أن قضى نحبه ولم يبق من ذوي قرابته من يصلح لمكانته واحتاج الناس إلى من يتولى أمورهم فاجتمعت كلمتهم على تأمير الأمير سبكتكين فبايعوه؛ فلما تمكن شرع في الغزاة والإغارة على أطراف الهند فافتتح قلاعاً كثيرة منها وجرت بينه وبين الهنود حروب يقصر الشرح عن وصفها واتسعت رقعة ولايته؛ ووصل إلى مدينة بلخ من طوس فمرض بها واشتاق إلى غزنة فخرج إليها في تلك الحال فمات في الطريق ورثاه شعراء عصره منهم كاتبه أبو الفتح البستي {cite:wafayat-ayan}."
  en: "Amir Sabuktigin (d. 387) — founder of the Ghaznavid house; rose as Alptigin's chamberlain under the Samanids, was elected amir of Ghazna, and opened the raids into India; died on the road from Balkh and was mourned by his katib Abu al-Fath al-Busti {cite:wafayat-ayan}."
