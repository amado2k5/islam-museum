summary:
  ar: "الأمير سبكتكين أبو منصور ناصر الدولة؛ أبو السلطان محمود بن سبكتكين؛ ورد مدينة بخارى في أيام نوح بن منصور الساماني في صحبة أبي إسحاق ابن ألبتكين وهو حاجبه فعرفه أركان تلك الدولة بالشهامة والصرامة وتوسموا فيه الارتفاع إلى المكان؛ ولما خرج أبو إسحاق إلى غزنة والياً عليها وسادها مات أبوه فانصرف الأمير سبكتكين بانصرافه على جملته في زعامة رجاله ومراعاة ما وراء بابه فلم يلبث أبو إسحاق بعد مفارقتها أن قضى نحبه ولم يبق من ذوي قرابته من يصلح لمكانته واحتاج الناس إلى من يتولى أمورهم فاجتمعت كلمتهم على تأمير الأمير سبكتكين فبايعوه؛ فلما تمكن شرع في الغزاة والإغارة على أطراف الهند فافتتح قلاعاً كثيرة منها وجرت بينه وبين الهنود حروب يقصر الشرح عن وصفها واتسعت رقعة ولايته؛ ووصل إلى مدينة بلخ من طوس فمرض بها واشتاق إلى غزنة فخرج إليها في تلك الحال فمات في الطريق ورثاه شعراء عصره منهم كاتبه أبو الفتح البستي {cite:wafayat-ayan}."
  en: "Amir Sabuktigin (d. 387) — founder of the Ghaznavid house; rose as Alptigin's chamberlain under the Samanids, was elected amir of Ghazna, and opened the raids into India; died on the road from Balkh and was mourned by his katib Abu al-Fath al-Busti {cite:wafayat-ayan}."
  es: "Amir Sabuktigin (m. 387) — fundador de la casa de Ghaznávida; ascendió como chambelán de Alptigin bajo los Samánidas, fue elegido emir de Ghazna y abrió las incursiones en la India; murió en el camino desde Balkh y fue llorado por su katib Abu al-Fath al-Busti {cite:wafayat-ayan}."
  fr: "Amir Sabuktigin (mort en 387) — fondateur de la maison ghaznévide; s'éleva comme chambellan d'Alptigin sous les Samanides, fut élu émir de Ghazni et lança les raids en Inde; mourut sur la route de Balkh et fut pleuré par son katib Abu al-Fath al-Busti {cite:wafayat-ayan}."
  ur: "امیر سبوکتگین ⁦(متوفی 387)⁩ - غزنوید گھر کا بانی؛ سامانیوں کے ماتحت الپٹگین کے چیمبرلین کے طور پر اٹھا، غزنہ کا امیر منتخب ہوا، اور ہندوستان میں چھاپہ مار کارروائیاں شروع کیں۔ بلخ سے سڑک پر انتقال کر گئے اور ان کے کاتب ابو الفتح البستی نے سوگ منایا۔"
  tr: "Prens Sebektkin Ebu Mansur Nasir el-Devla; Ebu Sultan Mahmud ibn Sebaktekin; Nuh ibn Mansur el-Samani döneminde, koruyucusu Ebu İshaq ibn Alptekin ile birlikte Buhara'ya döndü. O devletin temel taşları onu şövalyeliği ve katı davranışıyla takdir etti ve bu yere yükseltilmesiyle ayırt etti. Ebu İshaq Gazna'ya vali ve hükümdar olarak gittiğinde babası öldü, bu yüzden Emir Sebektin ayrıldı, adamlarının tüm liderliğine ve kapısının ötesinde olanları düşünmeye kendini adadı. Ayrıldıktan kısa süre sonra Ebu İshaq vefat etti ve kimse kalmadı Akrabaları onun konumuna uygun birini arıyordu ve insanlar işlerini yönetecek birine ihtiyaç duyuyordu. Onların sözü Emir Sefatakin tarafından kabul edildi ve ona bağlılık yemini ettiler. Başarılı olunca, Hindistan'ın dış mahallelerinde baskınlar başlattı, orada birçok kale fethetti ve kendisiyle Hintliler arasındaki anlatılamayacak kadar kısa savaşlar yaşandı. Yönetimi genişledi. Tus'tan Balkh şehrine ulaştı, orada hastalandı ve Gazni'yi özledi, bu yüzden oradan ayrıldı ve yolda öldü. Zamanının şairleri onun için yas tuttu, yazarı Ebu el-Feth el-Busti {kaynak:wafayat-ayan}."
  id: "Pangeran Sebektkin Abu Mansur Nasir al-Dawla; Abu Sultan Mahmoud ibn Sebaktekin; ia kembali ke kota Bukhara pada masa Nuh ibn Mansur al-Samani bersama Abu Ishaq ibn Alptekin, yang menjadi walinya. Para pilar negara itu mengakui kesatria dan ketegasannya, dan mereka membedakannya dengan pengangkatannya ke tempat tersebut. Ketika Abu Ishaq pergi ke Ghazna sebagai gubernur dan penguasanya, ayahnya meninggal, maka Emir Sebektin pergi, mendedikasikan dirinya sepenuhnya untuk memimpin pasukannya dan mempertimbangkan apa yang ada di luar pintunya sendiri. Tak lama setelah berpisah, Abu Ishaq meninggal dunia, dan tidak ada yang tersisa Kerabatnya mencari seseorang yang cocok untuk posisinya, dan orang-orang membutuhkan seseorang untuk mengelola urusan mereka. Janji mereka disepakati oleh Amir Sepatakin, sehingga mereka bersumpah setia kepadanya. Ketika ia berhasil, ia mulai melakukan serangan dan serangan di pinggiran India, menaklukkan banyak benteng di sana, dan perang antara dirinya dan orang India yang tidak dapat dijelaskan terlalu singkat untuk dijelaskan. Kekuasaannya berkembang. Ia mencapai kota Balkh dari Tus, jatuh sakit di sana, dan merindukan Ghazni, sehingga ia pergi dari sana dan meninggal di perjalanan. Para penyair pada zamannya meratapi kehadirannya, termasuk penulisnya Abu al-Fath al-Busti {cite:wafayat-ayan}."
