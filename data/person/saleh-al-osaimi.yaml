summary:
  ar: "عالم حديث ومُسنِد سعودي، وُلد في الرياض سنة 1391هـ/1971م. تخرج في جامعة الإمام محمد بن سعود الإسلامية ونال الماجستير في علوم الحديث من جامعة أم القرى والدكتوراه من المعهد العالي للقضاء، وتتلمذ على ابن باز وابن عثيمين وابن عقيل وغيرهم، وحصل على الإجازة في القراءات العشر. عُيّن عضوا في هيئة كبار العلماء (1438–1442هـ)، واشتهر ببرامجه التعليمية المنهجية مثل «مهمات العلم» في المسجد النبوي و«أصول العلم»، وبكتابه «تعظيم العلم»."
  en: "Saudi hadith scholar and musnid (master of transmission chains), born in Riyadh in 1391 AH / 1971. He graduated from Imam Muhammad ibn Saud Islamic University, took a master's in hadith sciences at Umm al-Qura University and a doctorate at the Higher Institute of Judiciary, studied under Ibn Baz, Ibn Uthaymin, Ibn Aqeel and others, and holds an ijaza in the ten readings. He served as a member of the Council of Senior Scholars (1438–1442 AH) and is known for his structured teaching programmes such as Muhimmat al-'Ilm at the Prophet's Mosque and Usul al-'Ilm, and for his book Ta'zim al-'Ilm (The Glorification of Knowledge)."
  ur: "سعودی عالمِ حدیث اور مُسنِد، جو 1391ھ/1971 میں ریاض میں پیدا ہوئے۔ انہوں نے جامعہ امام محمد بن سعود الاسلامیہ سے تعلیم پائی، جامعہ ام القری سے علومِ حدیث میں ماسٹرز اور المعہد العالی للقضاء سے ڈاکٹریٹ کیا، ابن باز، ابن عثیمین اور ابن عقیل سمیت دیگر علماء سے استفادہ کیا، اور قراءاتِ عشرہ میں اجازہ حاصل کیا۔ وہ 1438–1442ھ میں ہیئۃ کبار العلماء کے رکن رہے اور «مہمات العلم» و «اصول العلم» جیسے منہجی تعلیمی پروگراموں اور اپنی کتاب «تعظیم العلم» کے لیے مشہور ہیں۔"
