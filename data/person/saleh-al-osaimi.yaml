summary:
  ar: "عالم حديث ومُسنِد سعودي، وُلد في الرياض سنة 1391هـ/1971م. تخرج في جامعة الإمام محمد بن سعود الإسلامية ونال الماجستير في علوم الحديث من جامعة أم القرى والدكتوراه من المعهد العالي للقضاء، وتتلمذ على ابن باز وابن عثيمين وابن عقيل وغيرهم، وحصل على الإجازة في القراءات العشر. عُيّن عضوا في هيئة كبار العلماء ⁦(1438–1442هـ)⁩، واشتهر ببرامجه التعليمية المنهجية مثل «مهمات العلم» في المسجد النبوي و«أصول العلم»، وبكتابه «تعظيم العلم»."
  en: "Saudi hadith scholar and musnid (master of transmission chains), born in Riyadh in 1391 AH / 1971. He graduated from Imam Muhammad ibn Saud Islamic University, took a master's in hadith sciences at Umm al-Qura University and a doctorate at the Higher Institute of Judiciary, studied under Ibn Baz, Ibn Uthaymin, Ibn Aqeel and others, and holds an ijaza in the ten readings. He served as a member of the Council of Senior Scholars (1438–1442 AH) and is known for his structured teaching programmes such as Muhimmat al-'Ilm at the Prophet's Mosque and Usul al-'Ilm, and for his book Ta'zim al-'Ilm (The Glorification of Knowledge)."
  ur: "سعودی عالمِ حدیث اور مُسنِد، جو 1391ھ/1971 میں ریاض میں پیدا ہوئے۔ انہوں نے جامعہ امام محمد بن سعود الاسلامیہ سے تعلیم پائی، جامعہ ام القری سے علومِ حدیث میں ماسٹرز اور المعہد العالی للقضاء سے ڈاکٹریٹ کیا، ابن باز، ابن عثیمین اور ابن عقیل سمیت دیگر علماء سے استفادہ کیا، اور قراءاتِ عشرہ میں اجازہ حاصل کیا۔ وہ 1438–1442ھ میں ہیئۃ کبار العلماء کے رکن رہے اور «مہمات العلم» و «اصول العلم» جیسے منہجی تعلیمی پروگراموں اور اپنی کتاب «تعظیم العلم» کے لیے مشہور ہیں۔"
  es: "Erudito saudí en hadices y musnid (maestro de la transmisión de cadenas de transmisión), nacido en Riad en 1391 AH / 1971. Se graduó en la Universidad Islámica Imam Muhammad ibn Saud, obtuvo una maestría en ciencias del hadiz en la Universidad Umm al-Qura y un doctorado en el Instituto Superior de Justicia. Estudió con Ibn Baz, Ibn Uthaymin, Ibn Aqeel y otros, y posee una ijaza en las diez lecturas. Fue miembro del Consejo de Altos Eruditos (1438–1442 AH) y es conocido por sus programas de enseñanza estructurados, como Muhimmat al-'Ilm en la Mezquita del Profeta y Usul al-'Ilm, y por su libro Ta'zim al-'Ilm (La glorificación del conocimiento)."
  fr: "Érudit saoudien du hadith et musnid (maître des chaînes de transmission), né à Riyad en 1391 AH / 1971. Diplômé de l'Université islamique Imam Muhammad ibn Saud, il obtint une maîtrise en sciences du hadith à l'Université Umm al-Qura et un doctorat à l'Institut supérieur de la magistrature. Il étudia auprès d'Ibn Baz, Ibn Uthaymin, Ibn Aqeel et d'autres maîtres, et est titulaire d'une ijaza pour les dix lectures. Il fut membre du Conseil des grands savants (1438-1442 AH) et est reconnu pour ses programmes d'enseignement structurés, tels que Muhimmat al-'Ilm à la Mosquée du Prophète et Usul al-'Ilm, ainsi que pour son ouvrage Ta'zim al-'Ilm (La Glorification du savoir)."
  tr: "Suudi hadis âlimi ve Musnad, 1391 Hicri / 1971 yılında Riyad'da doğmuştur. İmam Muhammed bin Suud İslam Üniversitesi'nden mezun oldu, Um Al-Kura Üniversitesi'nden hadis bilimleri alanında yüksek lisans ve Yüksek Yargı Enstitüsü'nden doktora derecesi aldı. İbn Baz, İbn Uthaymin, İbn Akil ve diğerlerinin yanında eğitim aldı ve on okuma lisansı aldı. Kıdemli Alimler Konseyi üyesi olarak atandı (1438–1442 Hicri) ve Peygamber Camii'ndeki 'Muhammat al-Ilm' ve 'Usul al-Ilm' gibi metodolojik eğitim programları ile 'Ta'zim al-Ilm' adlı kitabıyla ün kazandı."
  id: "Seorang ulama hadis Saudi dan Musnad, lahir di Riyadh pada tahun 1391 H / 1971 M. Ia lulus dari Universitas Islam Imam Muhammad bin Saud, meraih gelar magister dalam ilmu hadis dari Universitas um Al-Qura, dan gelar doktor dari Institut Tinggi Kehakiman. Ia belajar di bawah bimbingan Ibn Baz, Ibn Uthaymeen, Ibn Aqil, dan lainnya, serta memperoleh lisensi dalam sepuluh bacaan. Ia diangkat menjadi anggota Dewan Ulama Senior (1438–1442 H), dan menjadi terkenal karena program pendidikan metodologisnya seperti 'Muhammat al-Ilm' di Masjid Nabi dan 'Usul al-Ilm,' serta bukunya 'Ta'zim al-Ilm.'"
