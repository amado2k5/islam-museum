summary:
  ar: "مخرج وكاتب ومنتج تلفزيوني وسينمائي باكستاني وشاعر غنائي وموسيقي (وُلد سنة 1951) من كراتشي؛ يعمل في التلفزيون منذ 1976، كتب «دل دل باكستان» (1987) وأخرج «أنكاهي» (1982) و«ألفا برافو تشارلي» (1998)، ونال فيلماه «خدا کے لیے» (2007) و«بول» (2011) إشادة دولية؛ حصل على فخر الأداء (2002) ووسام ستارة الامتياز (2008)."
  en: "Pakistani television and film director, writer, producer, lyricist and musician, born in 1951 at Karachi. In television since 1976, he wrote the song 'Dil Dil Pakistan' (1987) and directed the series Ankahi (1982), Fifty Fifty and Alpha Bravo Charlie (1998); his films Khuda Kay Liye (2007) and Bol (2011) won international acclaim. He received the Pride of Performance (2002) and the Sitara-e-Imtiaz (2008)."
  ur: "پاکستانی ٹیلی ویژن و فلم ہدایت کار، مصنف، پروڈیوسر، نغمہ نگار اور موسیقار (پیدائش 1951) جو کراچی سے تعلق رکھتے ہیں؛ 1976 سے ٹیلی ویژن سے وابستہ، «دل دل پاکستان» (1987) لکھا اور «ان کہی» (1982) اور «الفا براوو چارلی» (1998) کی ہدایت کاری کی؛ ان کی فلموں «خدا کے لیے» (2007) اور «بول» (2011) کو بین الاقوامی پزیرائی ملی؛ تمغہ حسنِ کارکردگی (2002) اور ستارہ امتیاز (2008) سے نوازے گئے۔"
