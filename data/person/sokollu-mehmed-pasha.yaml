summary:
  ar: "الصدر الأعظم صوقللي محمد باشا؛ الوزير الفذ والمجاهد الكبير والسياسي القدير الذي أسند إليه السلطان سليم الثاني منصب القيادة العامة، فأعاد للدولة هيبتها وزرع الرهبة في قلوب أعدائها وعقد صلحاً مع النمسا عام ٩٧٥هـ/١٥٦٧م. وأعدّ حملة كبرى سنة ٩٧٦–٩٧٧هـ للاستيلاء على استراخان ووصل نهري الفولغا والدون بقناة صالحة لمرور السفن، وشُقّ ثلث القناة قبل أن يوقفها الشتاء. وفي عهد مراد الثالث قُتل نتيجة دسائس حاشية السلطان المتأثرة بدسائس الأجانب الذين لا يروق لهم وجود وزير بهذه القدرة، فكان موته ضربة شديدة وفتح باباً للشر في تنصيب الصدور العظام وعزلهم مما أضعف قوة السلطنة {cite:dawlat-uthmaniyya-salabi p. 277-293}."
  en: "Sokollu Mehmed Pasha (d. ~1579) — the grand vizier who effectively reigned under Selim II: the 1567 Austrian peace, Cyprus, the Astrakhan campaign and the Don–Volga canal; his assassination by palace intrigue under Murad III 'opened the door to evil' in the making and unmaking of viziers {cite:dawlat-uthmaniyya-salabi p. 277-293}."
