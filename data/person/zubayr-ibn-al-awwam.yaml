summary:
  en: "Companion of the Prophet and his cousin through his mother Safiyya; the Encyclopaedia of Islam calls him one of the most eminent Companions, counted by Sunni tradition among the ten promised Paradise and a member of the shura Umar appointed. He was one of the two horsemen at Badr, fought at Uhud, the Trench, Khaybar, Yarmuk and in Egypt, and was killed after the Battle of the Camel near Basra in 36 AH. Sunni, Shi'i and academic accounts of his part in that battle differ and are reported side by side."
  ar: "من السابقين إلى الإسلام وابن عمة النبي، وتعدّه دائرة المعارف الإسلامية من أبرز الصحابة؛ يعدّه التقليد السني من العشرة المبشرين وكان من أعضاء الشورى التي عيّنها عمر. كان أحد فارسَي جيش المسلمين يوم بدر، وشارك في أحد والخندق وخيبر واليرموك وفتح مصر، وقُتل بعد موقعة الجمل قرب البصرة سنة 36هـ. وتختلف الروايات السنية والشيعية والأكاديمية في دوره في تلك المعركة، وتُعرض جنبًا إلى جنب."
  ur: "نبی کے پھوپھی زاد بھائی اور ابتدائی مسلمانوں میں سے؛ اسلامی دائرۃ المعارف انہیں ممتاز ترین صحابہ میں شمار کرتا ہے، سنی روایت انہیں عشرہ مبشرہ میں گنتی ہے اور وہ عمر کی مقرر کردہ شوریٰ کے رکن تھے۔ وہ بدر میں لشکر کے دو گھڑ سواروں میں سے ایک تھے، احد، خندق، خیبر، یرموک اور مصر کی مہم میں شریک ہوئے، اور 36ھ میں جنگِ جمل کے بعد بصرہ کے قریب مارے گئے۔ اس جنگ میں ان کے کردار پر سنی، شیعی اور علمی بیانات مختلف ہیں اور پہلو بہ پہلو بیان کیے گئے ہیں۔"
