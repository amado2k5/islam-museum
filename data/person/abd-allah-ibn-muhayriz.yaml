summary:
  ar: "عبد الله بن محيريز الجمحي القرشي، تابعي نزل الشام، نشأ يتيماً في حجر أبي محذورة مؤذن مكة الذي جهّزه إلى الشام، وسمع أبا محذورة وأبا سعيد الخدري، وروى عنه الزهري ومكحول. يجمع له أحمد في «الزهد» أخباراً في كراهة الشهرة والمدح والحرير ونصح عبد الملك بن مروان وإيثار علف الدواب في الغزو، ومات في ولاية الوليد بن عبد الملك {cite:tarikh-kabir-hyderabad-3-1 p. 193-194} {cite:zuhd-ahmad-dkim-1983 p. 468-470}."
  en: "Abd Allah ibn Muhayriz al-Jumahi al-Qurashi, a Successor who settled in Syria, grew up an orphan in the care of Abu Mahdhura, the muezzin of Mecca, who fitted him out for Syria; he heard Abu Mahdhura and Abu Sa'id al-Khudri, and al-Zuhri and Makhul narrated from him. Ahmad's al-Zuhd gathers reports of his dislike of fame, praise and silk, his counsel to Abd al-Malik ibn Marwan and his preference for spending on the mounts' fodder on campaign; he died in the reign of al-Walid ibn Abd al-Malik {cite:tarikh-kabir-hyderabad-3-1 p. 193-194} {cite:zuhd-ahmad-dkim-1983 p. 468-470}."
  ur: "عبد اللہ بن محیریز جمحی قرشی، شام میں آباد ہونے والے تابعی، جو یتیمی میں مکہ کے مؤذن ابو محذورہ کی سرپرستی میں پلے جنہوں نے انہیں شام کے لیے تیار کر کے بھیجا؛ انہوں نے ابو محذورہ اور ابو سعید خدری سے سماع کیا اور زہری اور مکحول نے ان سے روایت کی۔ احمد کی «الزہد» شہرت، مدح اور ریشم سے ان کی ناپسندیدگی، عبد الملک بن مروان کو ان کی نصیحت اور جہاد میں سواریوں کے چارے پر خرچ کو ترجیح دینے کے اخبار جمع کرتی ہے؛ وہ ولید بن عبد الملک کے دور میں فوت ہوئے {cite:tarikh-kabir-hyderabad-3-1 p. 193-194} {cite:zuhd-ahmad-dkim-1983 p. 468-470}۔"
