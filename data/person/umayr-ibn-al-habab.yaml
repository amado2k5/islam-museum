summary:
  ar: "عمير بن الحباب السلمي؛ عند البلاذري: غزا حصن كمخ مع صفوان بن المعطل في سنة 59 فعلا سوره ولم يزل يجالد عليه وحده حتى كشف الروم وصعد المسلمون ففُتح له وبذلك كان يفخر ويفاخر له."
  en: "Umayr ibn al-Habab al-Sulami; in al-Baladhuri: he raided the fortress of Kamkh with Safwan ibn al-Mu'attal in year 59, climbed its wall and fought on alone until the Romans gave way and the Muslims ascended — it was opened for him, and by that he would boast and be boasted for."
  es: "Umayr ibn al-Habab al-Sulami; en al-Baladhuri: asaltó la fortaleza de Kamkh con Safwan ibn al-Mu'attal en el año 59, escaló su muralla y luchó solo hasta que los romanos cedieron y los musulmanes ascendieron; se le abrió paso, y por ello se jactaría y sería jactado."
  fr: "Umayr ibn al-Habab al-Sulami; dans al-Baladhuri: il a attaqué la forteresse de Kamkh avec Safwan ibn al-Mu'attal en l'an 59, a escaladé son mur et a combattu seul jusqu'à ce que les Romains cèdent et que les musulmans montent — elle lui a été ouverte, et par cela il se vanterait et serait vanté."
