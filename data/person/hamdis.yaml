summary:
  ar: "أحمد بن محمد الأشعري، أبو جعفر، المعروف بحمديس القطان، يقال إنه من ذرية أبي موسى الأشعري، فقيه مالكي من أصحاب سحنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} وصفه النص بأنه كان علماً في الفضل ومثلاً في الخير مع صلابة شديدة في مذاهب أهل السنة، وكان ورعاً كاملاً ثقة مأموناً مجانباً لأهل الأهواء والسلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} رحل فلقي بالمدينة أبا مصعب وغيره، وبمصر أصحاب ابن القاسم وابن وهب وأشهب، وأخذ عنه جماعة منهم ابن اللباد والأبياني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} أوردته الموسوعة بتاريخي ولادة 230هـ ووفاة 289هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  en: "Ahmad ibn Muhammad al-Ash'ari, Abu Ja'far, known as Hamdis al-Qattan — said to be of the progeny of Abu Musa al-Ash'ari — a Maliki jurist among the companions of Suhnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} The text describes him as a sea of merit and a model of goodness, firm in the doctrines of the people of the Sunna, thoroughly pious, trustworthy and keeping his distance from the people of whims and from rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} He travelled and met Abu Mus'ab and others in Medina, and the companions of Ibn al-Qasim, Ibn Wahb and Ashhab in Egypt; a group transmitted from him, among them Ibn al-Labbad and al-Abyani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} The encyclopedia dates him 230–289 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  ur: "احمد بن محمد الاشعری، ابو جعفر، المعروف بحمدیس القطان — کہا جاتا ہے کہ وہ ابو موسی الاشعری کی اولاد میں سے تھے — مالکی فقیہ اور صحنون کے اصحاب میں سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} متن کے مطابق وہ فضیلت کا بحر اور خیر کا نمونہ تھے، اہل سنت کے مذاہب پر مضبوط، مکمل وارع، ثقہ اور امانتدار، اور اہل اہواء اور حکمرانوں سے دور رہتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} انھوں نے سفر کیا اور مدینہ میں ابو مصعب وغیرہ سے ملے، مصر میں ابن القاسم، ابن وہب اور اشہب کے اصحاب سے، اور ان سے ایک جماعت نے استفادہ کیا جن میں ابن اللباد اور الابیانی شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} موسوعہ نے ان کی ولادت 230ھ اور وفات 289ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  es: "Ahmad ibn Muhammad al-Ash'ari, Abu Ja'far, conocido como Hamdis al-Qattan —se dice que era descendiente de Abu Musa al-Ash'ari— un jurista malikí entre los compañeros de Suhnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} El texto lo describe como un mar de mérito y un modelo de bondad, firme en las doctrinas de la gente de la Sunna, completamente piadoso, digno de confianza y que se mantenía alejado de la gente caprichosa y de los gobernantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} Viajó y conoció a Abu Mus'ab y otros en Medina, y a los compañeros de Ibn al-Qasim, Ibn Wahb y Ashhab en Egipto; un grupo que transmitió de él, entre ellos Ibn al-Labbad y al-Abyani. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} La enciclopedia lo fecha entre 230 y 289 d. H. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  fr: "Ahmad ibn Muhammad al-Ash'ari, dit Abu Ja'far, également connu sous le nom de Hamdis al-Qattan, était un descendant d'Abu Musa al-Ash'ari, juriste malikite parmi les compagnons de Suhnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} Le texte le décrit comme un modèle de mérite et de vertu, ferme dans les doctrines des sunnites, profondément pieux, digne de confiance et se tenant à l'écart des caprices et des gouvernants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} Il voyagea et rencontra Abu Mus'ab et d'autres à Médine, ainsi que les compagnons d'Ibn al-Qasim, d'Ibn Wahb et d'Ashhab en Égypte; un groupe, parmi lesquels Ibn al-Labbad et al-Abyani, avait été formé par lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} L'encyclopédie le date de 230 à 289 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  tr: "Ahmed ibn Muhammed el-Eş'ari, Ebu Ca'far, Hamdis el-Qattan olarak bilinir, Sahnun takipçilerinden Maliki hukukçusu Ebu Musa el-Eş'ari'nin soyundan geldiği söylenir. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.16246} Metin, onu erdem konusunda bilgili ve iyilikte örnek olan, Ehl-sünnet okullarında büyük bir kararlılık gösteren biri olarak tanımlar. Tamamen dindar, güvenilir, güvenilir ve arzu ve yöneticilerden uzaktı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16246} Medine'de Ebu Mus'ab ve diğerleriyle seyahat etti, Mısır'da İbn el-Kasım, İbn Vahb ve Ashhab'ın yoldaşları ile birlikte İbn al-Labbad ve al-Abyani gibi onun öğrencisi bir grupla tanıştı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16246} Ansiklopedi doğum tarihlerini 230 Hicri ve ölümünü 289 Hicri olarak listelemiştir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.16246}"
  id: "Ahmad ibn Muhammad al-Ash'ari, Abu Ja'far, dikenal sebagai Hamdis al-Qattan, dikatakan sebagai keturunan Abu Musa al-Ash'ari, seorang ahli hukum Maliki dari pengikut Sahnoun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16246} Teks tersebut menggambarkannya sebagai orang yang berpengetahuan dalam kebajikan dan teladan kebaikan, dengan keteguhan besar dalam aliran Ahl al-Sunnah. Ia sepenuhnya saleh, dapat dipercaya, dapat dipercaya, dan bebas dari hasrat dan penguasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16246} Ia melakukan perjalanan dan bertemu Abu Mus'ab serta lainnya di Madinah, dan di Mesir para sahabat Ibn al-Qasim, Ibn Wahb, dan Ashhab, serta kelompok yang belajar di bawah bimbingannya, termasuk Ibn al-Labbad dan al-Abyani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16246} Ensiklopedia mencantumkan tanggal lahirnya sebagai 230 AH dan kematiannya pada 289 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16246}"
