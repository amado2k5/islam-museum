summary:
  ar: "أحمد بن محمد الأشعري، أبو جعفر، المعروف بحمديس القطان، يقال إنه من ذرية أبي موسى الأشعري، فقيه مالكي من أصحاب سحنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} وصفه النص بأنه كان علماً في الفضل ومثلاً في الخير مع صلابة شديدة في مذاهب أهل السنة، وكان ورعاً كاملاً ثقة مأموناً مجانباً لأهل الأهواء والسلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} رحل فلقي بالمدينة أبا مصعب وغيره، وبمصر أصحاب ابن القاسم وابن وهب وأشهب، وأخذ عنه جماعة منهم ابن اللباد والأبياني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} أوردته الموسوعة بتاريخي ولادة 230هـ ووفاة 289هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  en: "Ahmad ibn Muhammad al-Ash'ari, Abu Ja'far, known as Hamdis al-Qattan — said to be of the progeny of Abu Musa al-Ash'ari — a Maliki jurist among the companions of Suhnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} The text describes him as a sea of merit and a model of goodness, firm in the doctrines of the people of the Sunna, thoroughly pious, trustworthy and keeping his distance from the people of whims and from rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} He travelled and met Abu Mus'ab and others in Medina, and the companions of Ibn al-Qasim, Ibn Wahb and Ashhab in Egypt; a group transmitted from him, among them Ibn al-Labbad and al-Abyani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} The encyclopedia dates him 230–289 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
  ur: "احمد بن محمد الاشعری، ابو جعفر، المعروف بحمدیس القطان — کہا جاتا ہے کہ وہ ابو موسی الاشعری کی اولاد میں سے تھے — مالکی فقیہ اور صحنون کے اصحاب میں سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} متن کے مطابق وہ فضیلت کا بحر اور خیر کا نمونہ تھے، اہل سنت کے مذاہب پر مضبوط، مکمل وارع، ثقہ اور امانتدار، اور اہل اہواء اور حکمرانوں سے دور رہتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} انھوں نے سفر کیا اور مدینہ میں ابو مصعب وغیرہ سے ملے، مصر میں ابن القاسم، ابن وہب اور اشہب کے اصحاب سے، اور ان سے ایک جماعت نے استفادہ کیا جن میں ابن اللباد اور الابیانی شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246} موسوعہ نے ان کی ولادت 230ھ اور وفات 289ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16246}"
