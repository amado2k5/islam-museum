  ar: "بريم ناث بازاز سياسي وصحفي ومؤرخ كشميري من البانديت، شارك الشيخ عبد الله في تأسيس صحيفة همدرد، ثم انفصل عن المؤتمر الوطني، وكتب تاريخاً مرجعياً لنضال كشمير من أجل الحرية."
