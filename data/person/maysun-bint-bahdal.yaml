id: person/maysun-bint-bahdal
class: person
gender: female
label: { ar: "ميسون بنت بجدل الكلبية" }
summary:
  ar: "زوج معاوية بن أبي سفيان وأم ابنه يزيد، من بني كلب. وصفها الكتاب بأنها كانت حازمة عظيمة الشأن جمالاً ورياسة وعقلاً ودينا، وذكر أن معاوية دخل عليها ومعه خادم خصي فاستترت منه وقالت: ما هذا الرجل معك؟ {cite:bakr-umayyad-state-1134715 p. 177-178}. وروى الكتاب، عن ابن جرير، أنها ولدت لمعاوية بنتاً أخرى ماتت صغيرة {cite:bakr-umayyad-state-1134715 p. 178}. وتعرض الكتاب لحكاية منسوبة إليها عن نائلة بنت عمارة الكلبية، وهي حكاية يرويها الأخباريون ولا يقررها الكتاب {cite:bakr-umayyad-state-1134715 p. 177}."
  tr: "Muaviye bin Ebi Sufyan'ın eşi ve Banu Kalb'den oğlu Yezid'in annesiydi. Kitapta Muaviye'nin güzellik, liderlik, zekâ ve din açısından sağlam ve büyük bir figüre sahip olduğu anlatılır. Muawiya'nın bir hadım hizmetkârla içeri girdiği, ondan saklandığı ve şöyle dediği belirtilir: Bu adam seninle ne? {cite:bakr-umayyad-state-1134715 s. 177-178}. Kitap, İbn Jarir'den, Muawiya'ya genç yaşta ölen başka bir kız doğurduğunu anlatır {cite:bakr-umayyad-state-1134715 s. 178}. Kitap, ona atfedilen Na'ila bint 'Amara al-Kalbiyyah hakkında bir hikaye sunar; bu hikaye haber alimleri tarafından anlatılır ancak {cite:bakr-umayyad-state-1134715 s. 177}"
  id: "Dia adalah suami Muawiyah ibn Abi Sufyan dan ibu dari putranya Yazid, dari Banu Kalb. Buku itu menggambarkannya sebagai sosok yang teguh dan berwibawa besar dalam kecantikan, kepemimpinan, intelektual, dan agama. Disebutkan bahwa Muawiya masuk bersama seorang pelayan kasim, bersembunyi darinya, dan berkata: Apa pria ini bersamamu? {cite:bakr-umayyad-state-1134715 hlm. 177-178}. Buku ini menceritakan, dari Ibn Jarir, bahwa dia melahirkan seorang putri lagi yang meninggal Muawiya muda {cite:bakr-umayyad-state-1134715 hlm. 178}. Buku ini menyajikan kisah yang dikaitkan dengannya tentang Na'ila bint 'Amara al-Kalbiyyah, sebuah kisah yang diceritakan oleh para ulama berita tetapi tidak dikonfirmasi oleh buku {cite:bakr-umayyad-state-1134715 hlm. 177}."
