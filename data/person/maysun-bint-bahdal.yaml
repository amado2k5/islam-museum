label: { ar: "ميسون بنت بجدل الكلبية" }
summary:
  ar: "زوج معاوية بن أبي سفيان وأم ابنه يزيد، من بني كلب. وصفها الكتاب بأنها كانت حازمة عظيمة الشأن جمالاً ورياسة وعقلاً ودينا، وذكر أن معاوية دخل عليها ومعه خادم خصي فاستترت منه وقالت: ما هذا الرجل معك؟ {cite:bakr-umayyad-state-1134715 p. 177-178}. وروى الكتاب، عن ابن جرير، أنها ولدت لمعاوية بنتاً أخرى ماتت صغيرة {cite:bakr-umayyad-state-1134715 p. 178}. وتعرض الكتاب لحكاية منسوبة إليها عن نائلة بنت عمارة الكلبية، وهي حكاية يرويها الأخباريون ولا يقررها الكتاب {cite:bakr-umayyad-state-1134715 p. 177}."
