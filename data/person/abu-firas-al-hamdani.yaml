label: { ar: "أبو فراس الحمداني", en: "Abu Firas al-Hamdani", fr: "Abu Firas al-Hamdani", es: "Abu Firas al-Hamdani", ur: "ابو فراس الحمدانی" }
summary:
  ar: "الحرث بن أبي العلاء سعيد بن حمدان بن حمدون، الشاعر؛ قتل في ربيع الآخر سنة 361هـ وكان مقيماً بحمص فجاء بينه وبين ابن أخته أبي المعالي بن سيف الدولة وحشة فطلبه فلجأ إلى صدد قرية في طرف البادية عند حمص فجمع أبو المعالي الأعراب من بني كلاب وسيرهم في طلبه مع قرغويه فأدركه بصدد وكبسه فاستأمن أصحابه واختلط هو بمن استأمن منهم فقال قرغويه لغلام له اقتله فقتله وأخذ رأسه وتُركت جثته مرمية حتى دفنها أعراب بعد ذلك {cite:kamil-ibn-al-athir p. 433}."
  en: "Al-Harith ibn Sa'id ibn Hamdan the poet-prince; killed in Rabi II 361 at Sadda on the desert fringe of Hims — abandoned by his sworn companions, he was cut down by a ghulam of Qarghuya on the order of his own nephew Abu'l-Ma'ali ibn Sayf al-Dawla {cite:kamil-ibn-al-athir p. 433}."
  fr: "Al-Harith ibn Sa'id ibn Hamdan, le prince-poète ; tué en Rabi II 361 à Sadad, aux confins du désert de Homs — abandonné par ses compagnons jurés, il fut abattu par un ghulam de Qarghuya sur l'ordre de son propre neveu Abu'l-Ma'ali ibn Sayf al-Dawla {cite:kamil-ibn-al-athir p. 433}."
  es: "Al-Harith ibn Sa'id ibn Hamdan, el príncipe poeta; asesinado en Rabi II 361 en Sadda, en el límite desértico de Hims — abandonado por sus compañeros jurados, fue asesinado por un ghulam de Qarghuya por orden de su propio sobrino Abu'l-Ma'ali ibn Sayf al-Dawla {cite:kamil-ibn-al-athir p. 433}."
  ur: "الحارث ابن سعید ابن حمدان شاعر شہزادہ؛ ربیع دوم 361 میں صحرائے ہمس کے کنارے پر صدا کے مقام پر مارا گیا - اس کے حلف اٹھانے والے ساتھیوں کے ذریعہ چھوڑ دیا گیا، اسے قرغویہ کے ایک غلام نے اپنے بھتیجے ابو المعالی ابن سیف الدولہ کے حکم پر کاٹ دیا۔ 433}۔"
  tr: "Şair el-Harith ibn Abi el-Ala’ Saeed ibn Hamdan ibn Hamdun; Hicri 361 yılında Rebiü’l-Ahir ayında öldürüldü. Humus’ta ikamet ederken, kendisini arayan yeğeni Ebu el-Ma’ali ibn Sayf el-Dawla ile arasında bir anlaşmazlık çıktı. Humus yakınlarındaki çölün kenarında bulunan Sadad köyüne sığındı. Ebu el-Ma’ali, Beni Kilab’tan bedevileri topladı ve onları Karghawayh ile birlikte onun peşine gönderdi. Sadad’da ona yetişti ve saldırdı. Arkadaşları güvenli bir yere sığındılar ve o da ondan kaçanların arasına karıştı. Karghawayh, hizmetçisine onu öldürmesini emretti, o da onu öldürdü ve başını aldı. Cesedi, bedeviler onu gömdükten sonra orada bırakıldı. {Kaynak: Kamil ibn el-Athir, s. 433}"
  id: "Al-Harith ibn Abi Al-Ala’ Saeed ibn Hamdan ibn Hamdun, sang penyair; ia terbunuh pada bulan Rabi’ al-Akhir tahun 361 H. Ia tinggal di Homs ketika terjadi perselisihan antara dirinya dan keponakannya, Abu Al-Ma’ali ibn Sayf Al-Dawla, yang mencarinya. Ia berlindung di Sadad, sebuah desa di tepi gurun dekat Homs. Abu Al-Ma’ali mengumpulkan orang-orang Badui dari Banu Kilab dan mengirim mereka untuk mengejarnya bersama Qarghawayh. Ia berhasil mengejarnya di Sadad dan menyerangnya. Para sahabatnya mencari perlindungan, dan ia berbaur dengan mereka yang telah mencari perlindungan darinya. Qarghawayh menyuruh pelayannya untuk membunuhnya, maka pelayan itu membunuhnya dan memenggal kepalanya. Mayatnya dibiarkan tergeletak di sana sampai kemudian dikuburkan oleh orang-orang Badui. {cite:kamil-ibn-al-athir p. 433}."
