label: { ar: "أبو فراس الحمداني" }
summary:
  ar: "الحرث بن أبي العلاء سعيد بن حمدان بن حمدون، الشاعر؛ قتل في ربيع الآخر سنة 361هـ وكان مقيماً بحمص فجاء بينه وبين ابن أخته أبي المعالي بن سيف الدولة وحشة فطلبه فلجأ إلى صدد قرية في طرف البادية عند حمص فجمع أبو المعالي الأعراب من بني كلاب وسيرهم في طلبه مع قرغويه فأدركه بصدد وكبسه فاستأمن أصحابه واختلط هو بمن استأمن منهم فقال قرغويه لغلام له اقتله فقتله وأخذ رأسه وتُركت جثته مرمية حتى دفنها أعراب بعد ذلك {cite:kamil-ibn-al-athir p. 433}."
  en: "Al-Harith ibn Sa'id ibn Hamdan the poet-prince; killed in Rabi II 361 at Sadda on the desert fringe of Hims — abandoned by his sworn companions, he was cut down by a ghulam of Qarghuya on the order of his own nephew Abu'l-Ma'ali ibn Sayf al-Dawla {cite:kamil-ibn-al-athir p. 433}."
