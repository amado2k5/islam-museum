summary:
  ar: رياضي وفيزيائي في البلاط البويهي ببغداد ⁦(نحو 940–1000)⁩؛ صاحب رسالة «في الآلة
    المحرقة» ⁦(نحو 984)⁩ التي وضعت النسبة الثابتة لانكسار الضوء وطبقتها على عدسات
    كاسرة بلا أخطاء، وهو أول مسلم معروف درس بصريات بطليموس دراسة جادة {cite:wikipedia-ibn-sahl-en}.
  en: Mathematician and physicist of the Buyid court of Baghdad (c. 940-1000); author
    of the treatise On the Burning Instrument (c. 984), which laid down the constant
    ratio of light's refraction and applied it to aberration-free lenses, and the
    first Muslim scholar known to have studied Ptolemy's Optics seriously {cite:wikipedia-ibn-sahl-en}.
  ur: بوئی دربارِ بغداد کے ریاضی دان و طبیعات دان ⁦(تقریباً 940–1000)⁩؛ رسالہ «فی
    الآلۃ المحرقۃ» ⁦(تقریباً 984ء)⁩ کے مصنف جس نے روشنی کے انعطاف کی ثابت نسبت رکھی
    اور بے خطا عدسوں پر لاگو کی، اور پہلا مسلمان ماہر جس نے بطلمیوس کی بصریات کا سنجیدہ
    مطالعہ کیا {cite:wikipedia-ibn-sahl-en}.
  es: "Matemático y físico de la corte Buyí de Bagdad (c. 940-1000); autor del tratado Sobre el instrumento de combustión (c. 984), que estableció la relación constante de la refracción de la luz y la aplicó a lentes libres de aberraciones, y el primer erudito musulmán conocido que estudió seriamente la Óptica de Ptolomeo {cite:wikipedia-ibn-sahl-en}."
  fr: "Mathématicien et physicien de la cour bouyide de Bagdad (vers 940-1000); auteur du traité Sur l'instrument brûlant (vers 984), qui établit le rapport constant de la réfraction de la lumière et l'applique aux lentilles sans aberration, et le premier érudit musulman connu pour avoir étudié sérieusement l'optique de Ptolémée {cite:wikipedia-ibn-sahl-en}."
