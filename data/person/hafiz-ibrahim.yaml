summary:
  ar: "شاعر مصري (1872–1932)، لُقّب بـ«شاعر النيل» و«شاعر الشعب» لأن شعره عبّر عن هموم المصريين البسطاء: حقوق المرأة والفقر والتعليم ومقاومة الاحتلال البريطاني. من أعلام إحياء الشعر العربي الكلاسيكي، رأس القسم الأدبي بدار الكتب المصرية منذ 1911، وترجم «البؤساء» لفيكتور هوغو إلى العربية."
  en: "Egyptian poet (1872–1932), dubbed 'Poet of the Nile' and 'Poet of the People' because his poetry voiced the concerns of ordinary Egyptians: women's rights, poverty, education and resistance to the British occupation. A leading figure of the neoclassical revival of Arabic poetry, he headed the literary section of Egypt's national library from 1911 and translated Victor Hugo's Les Misérables into Arabic."
  ur: "مصری شاعر (1872–1932)، جنہیں «شاعر النیل» اور «شاعر الشعب» کہا گیا کیونکہ ان کی شاعری عام مصریوں کے مسائل — خواتین کے حقوق، غربت، تعلیم اور برطانوی قبضے کی مخالفت — کی آواز بنی۔ عربی شاعری کے کلاسیکی احیا کے نمایاں نام، 1911 سے مصر کے قومی کتب خانے کے ادبی شعبے کے سربراہ رہے اور وکٹر ہیوگو کے ناول «بد نصیب» کا عربی ترجمہ کیا۔"
