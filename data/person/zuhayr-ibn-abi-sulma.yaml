summary:
  ar: شاعر جاهلي مزني تنسب إليه إحدى المعلقات السبع، وفيها «أمن أم أوفى دمنة لم تكلم»؛ يقدّمها شرح الزوزني بقوله «قال زهير بن أبي سلمى المزني» {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}.
  en: A pre-Islamic poet of Muzayna to whom one of the seven Mu'allaqat is ascribed, the one opening "Is it for Umm Awfa, a camp that does not speak"; al-Zawzani's commentary introduces it with "Zuhayr ibn Abi Sulma al-Muzani said" {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}.
  es: "Un poeta preislámico de Muzayna a quien se le atribuye uno de los siete Mu'allaqat, el que comienza con \"Es para Umm Awfa, un campamento que no habla\"; el comentario de al-Zawzani lo introduce con \"Zuhayr ibn Abi Sulma al-Muzani dijo\" {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
  fr: "Un poète préislamique de Muzayna à qui l'une des sept Mu'allaqat est attribuée, celle qui ouvre « Est-ce pour Umm Awfa, un camp qui ne parle pas »; le commentaire d'al-Zawzani l'introduit par « Zuhayr ibn Abi Sulma al-Muzani a dit » {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
  ur: "مزائنہ کا ایک قبل از اسلام شاعر جس کی طرف سات معلقات میں سے ایک کو منسوب کیا جاتا ہے، جس کا آغاز ہوتا ہے \"کیا یہ ام اوفہ کے لیے ہے، ایسا کیمپ جو بولتا ہی نہیں\"؛ الزوزانی کی تفسیر میں اس کا تعارف \"زہیر بن ابی سلمہ المزانی نے کہا\" سے کیا ہے۔"
  tr: "İslam öncesi bir şair olan Mazni, yedi Mu'allakat'tan birine atfedilir; bu şair 'Amin veya konuşmayan en sadık Damna' içerir; bu şair El-Zevzani'nin şöyle şerfiyle sunulur: 'Zuhair ibn Abi Sulma El-Muzani buyurdu' {{cite:sharh-muallaqat-sab-zawzani-1921 s.76}}."
  id: "Seorang penyair pra-Islam bernama Mazni dikaitkan dengan salah satu dari tujuh Mu'allaqat, yang mencakup 'Amin atau Damna paling setia yang tidak berbicara'; hal ini disajikan oleh komentar Al-Zawzani: 'Zuhair ibn Abi Sulma Al-Muzani berkata' {{cite:sharh-muallaqat-sab-zawzani-1921 hlm.76}}."
