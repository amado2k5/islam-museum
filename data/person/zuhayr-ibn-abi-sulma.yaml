  ar: "شاعر جاهلي مزني تنسب إليه إحدى المعلقات السبع، وفيها «أمن أم أوفى دمنة لم تكلم»؛ يقدّمها شرح الزوزني بقوله «قال زهير بن أبي سلمى المزني» {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
  en: "A pre-Islamic poet of Muzayna to whom one of the seven Mu'allaqat is ascribed, the one opening \"Is it for Umm Awfa, a camp that does not speak\"; al-Zawzani's commentary introduces it with \"Zuhayr ibn Abi Sulma al-Muzani said\" {{cite:sharh-muallaqat-sab-zawzani-1921 p.76}}."
