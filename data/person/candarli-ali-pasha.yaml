summary:
  ar: "صدر أعظم عثماني (توفي 1406)، أكبر أبناء جاندرلي قرة خليل حير الدين باشا أول صدور الدولة العثمانية. تدرَّب في المدرسة وانتسب إلى العلمية فصار قاضياً ثم قاضي عسكر، وخلف أباه في الصدارة سنة 1387 فخدم مراد الأول ثم بايزيد الأول، وقاد حملة بلغاريا سنة 1388 وحضر كوسوفو ونيقوبولس، وبعد أسر بايزيد في أنقرة سنة 1402 حفظ لسليمان جلبي عرشه في الروملي ومهَّد لصلح غاليبولي سنة 1403. توفي في أنقرة سنة 1406 ودُفن بجوار أبيه في إزنيك."
  en: "Ottoman grand vizier (died 1406), the eldest son of Çandarlı Kara Halil Hayreddin Pasha, the first grand vizier of the Ottoman state. Medrese-trained and of the ilmiye class, he rose from kadı to kazasker and succeeded his father in 1387, serving Murad I and then Bayezid I for the whole of his reign; he led the Bulgarian campaign of 1388 and fought at Kosovo and Nicopolis. After Bayezid's capture at Ankara in 1402 he preserved Süleyman Çelebi's throne in Rumelia and brokered the Treaty of Gallipoli in 1403. He died at Ankara in 1406 and was buried beside his father at Iznik."
  ur: "عثمانی صدر اعظم (وفات 1406ء)، پہلے عثمانی صدر اعظم چاندارلی قرہ خلیل حیر الدین پاشا کے بڑے صاحبزادے۔ مدرسے کی تعلیم پانے والے علمیہ طبقے سے تھے؛ قاضی سے قاضی عسکر بنے اور 1387ء میں والد کے جانشین ہوئے۔ مراد اول اور پھر پورے عہد میں بایزید اول کی خدمت کی؛ 1388ء میں بلغاریہ کی مہم کی قیادت کی اور کوسووہ و نیکوپولس میں شریک رہے۔ 1402ء میں انقرہ میں بایزید کی گرفتاری کے بعد انھوں نے رومیلیا میں سلیمان چلبی کا تخت محفوظ رکھا اور 1403ء میں گلیبولی کا معاہدہ طے کرایا۔ 1406ء میں انقرہ میں وفات پائی اور ازنک میں والد کے پہلو میں دفن ہوئے۔"

