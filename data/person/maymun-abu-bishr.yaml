summary:
  ar: "مولى علي بن عبد الله؛ عند البلاذري أقطعه المنصور قطيعة عند بستان القس ناحية باب الشام وطاقات بشر تنسب إلى بشر بن ميمون هذا."
  en: "mawla of Ali ibn Abdallah; in al-Baladhuri granted a qati'a near Bustan al-Qass by Bab al-Sham — the Taqat Bishr are named for his son Bishr."
  es: "mawla de Ali ibn Abdallah; en al-Baladhuri, Bab al-Sham le concedió una qati'a cerca de Bustan al-Qass; los Taqat Bishr llevan el nombre de su hijo Bishr."
  fr: "mawla d'Ali ibn Abdallah; à al-Baladhuri, Bab al-Sham a accordé une qati'a près de Bustan al-Qass - les Taqat Bishr portent le nom de son fils Bishr."
  ur: "علی ابن عبداللہ کا مولا؛ البلادھوری میں باب الشام کی طرف سے بوستان القاس کے قریب ایک قتیہ عطا کیا گیا - تقطع بشر ان کے بیٹے بشر کے نام پر رکھا گیا ہے۔"
  tr: "Ali ibn Abdullah'ın özgür adamı; el-Baladhuri'ye göre, el-Mansur onu Bab al-Sham yakınlarındaki Bustan al-Qas'ta kesmiş ve Bishr'in güçleri bu Bishr ibn Maymun'a atfedilmiştir."
  id: "Bekas hamba Ali ibn Abdullah; menurut al-Baladhuri, al-Mansur memutuskan jalan itu di Bustan al-Qas dekat Bab al-Sham, dan kekuasaan Bishr dikaitkan dengan Bishr ibn Maymun ini."
