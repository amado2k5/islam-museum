summary:
  ar: "حاكم (أسكيا) إمبراطورية صنغاي (حكم 1549–1582)، ابن أسكيا محمد الأول. كان عهده الطويل ذروة سلام الإمبراطورية وازدهارها: غزا الموسي وبورغو ومالي بنجاح، وأعاد تنظيم الجيش، ورمّم مساجد تمبكتو، وأنشأ مكتبات عامة، واشتهر بتدينه ومعرفته بالفقه الإسلامي وحفظه للقرآن. مات في تونديبي سنة 1582 ودُفن في جاو."
  en: "Askia (ruler) of the Songhai Empire (r. 1549-1582), a son of Askia Muhammad I. His long reign was the empire's peak of peace and prosperity: he campaigned successfully against the Mossi, Borgu and Mali, reorganised the army, refurbished Timbuktu's mosques, founded public libraries, and was famed for his devotion to Islam, his knowledge of Islamic law and his memorisation of the Qur'an. He died at Tondibi in 1582 and was buried at Gao."
  ur: "سلطنت سونگھائی کے آسکیا (دورِ حکومت 1549ء–1582ء)، آسکیا محمد اول کے بیٹے۔ ان کا طویل عہد سلطنت کے امن و خوشحالی کی انتہا تھا: موسی، بورگو اور مالی کے خلاف کامیاب مہمات چلائیں، فوج کی تنظیم نو کی، تمبکٹو کی مساجد کی مرمت کرائی، عوامی کتب خانے قائم کیے، اور اسلام سے لگاؤ، فقہ کی معرفت اور حفظِ قرآن کے لیے مشہور ہوئے۔ 1582ء میں توندیبی میں وفات پائی اور گاؤ میں دفن ہوئے۔"

