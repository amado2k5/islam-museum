id: person/yahya-ibn-ibrahim-al-guddali
class: person
label: { ar: "يحيى بن إبراهيم الكدالي" }
summary:
  ar: "رئيس كدالة من لمتونة؛ خرج حاجاً في رؤساء من قومه في سني أربعين وأربعمائة فلقوا في منصرفهم بالقيروان شيخ المذهب المالكي أبا عمران الفاسي فسأله يحيى أن يصحبهم من تلاميذه من يرجعون إليه في نوازلهم {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  en: "Yahya ibn Ibrahim al-Guddali, chief of Guddala; returning from the hajj he met Abu Imran al-Fasi at Kairouan and asked for a scholar to accompany them {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  es: "Yahya ibn Ibrahim al-Guddali, jefe de Guddala; Al regresar del hajj, se encontró con Abu Imran al-Fasi en Kairouan y pidió que un erudito los acompañara {citar:tarikh-ibn-khaldun-ibar p. 1645}."
  fr: "Yahya ibn Ibrahim al-Guddali, chef de Guddala; de retour du hajj, il rencontra Abu Imran al-Fasi à Kairouan et demanda qu'un érudit les accompagne {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  ur: "یحییٰ بن ابراہیم الگڈالی، گڈالہ کے سربراہ؛ حج سے واپسی پر کیروان میں ابو عمران الفاسی سے ملاقات کی اور ان کے ساتھ ایک عالم کو طلب کیا۔ 1645}۔"
  tr: "Lamtuna'dan Kadala reisi; dört yüz kırk yaşında halkının liderleriyle hac yolculuğuna çıktı. Kairuan'da ayrılırken Maliki okulunun şeyhi Ebu İmran el-Fasi ile karşılaştılar. Yahya, davalarında başvuracakları öğrencileri arasında kendisine eşlik etmesini istedi {atıf:Tarikh-ibn-Khaldun-ibar s. 1645}."
  id: "Kepala Kadala dari Lamtuna; ia memulai ziarah bersama para pemimpin dari kaumnya pada usia empat ratus empat puluh tahun. Mereka bertemu di Kairouan dengan sheikh dari aliran Maliki, Abu Imran al-Fasi. Yahya memintanya untuk menemaninya di antara murid-muridnya yang akan mereka rujuk dalam kasus mereka {cite:Tarikh-ibn-Khaldun-ibar hlm. 1645}."
