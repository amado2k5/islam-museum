  ar: "محمد بن عبد الهادي التتوي، أبو الحسن، نور الدين السندي، فقيه حنفي عالم بالحديث والتفسير والعربية، أصله من السند وتوطن المدينة، له حواش على الكتب الستة وعلى مسند أحمد والبيضاوي، توفي سنة 1138 هـ."
  en: "Muhammad ibn Abd al-Hadi al-Tattawi, Abu al-Hasan, Nur al-Din al-Sindi, a Hanafi jurist learned in hadith, exegesis and Arabic, from al-Sind and settled in Medina; author of glosses on the Sunan and Sahih collections, the Musnad of Ahmad and al-Baydawi; died 1138 AH (1726)."
