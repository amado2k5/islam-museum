  ur: "محمد بن عبد الہادی السندی"
roles: [faqih, scholar]
gender: male
summary:
  ar: "محمد بن عبد الهادي التتوي، أبو الحسن، نور الدين السندي، فقيه حنفي عالم بالحديث والتفسير والعربية، أصله من السند وتوطن المدينة، له حواش على الكتب الستة وعلى مسند أحمد والبيضاوي، توفي سنة 1138 هـ."
  en: "Muhammad ibn Abd al-Hadi al-Tattawi, Abu al-Hasan, Nur al-Din al-Sindi, a Hanafi jurist learned in hadith, exegesis and Arabic, from al-Sind and settled in Medina; author of glosses on the Sunan and Sahih collections, the Musnad of Ahmad and al-Baydawi; died 1138 AH (1726)."
  es: "Muhammad ibn Abd al-Hadi al-Tattawi, Abu al-Hasan, Nur al-Din al-Sindi, jurista hanafí versado en hadices, exégesis y árabe, originario de al-Sind y establecido en Medina; autor de glosas sobre las colecciones Sunan y Sahih, el Musnad de Ahmad y al-Baydawi; murió en 1138 AH (1726)."
  fr: "Muhammad ibn Abd al-Hadi al-Tattawi, Abu al-Hasan, Nur al-Din al-Sindi, juriste hanafite versé dans le hadith, l'exégèse et l'arabe, originaire d'al-Sind et installé à Médine; auteur de gloses sur les recueils Sunan et Sahih, le Musnad d'Ahmad et d'al-Baydawi; mort en 1138 AH (1726)."
  ur: "محمد بن عبد الہادی الططاوی، ابو الحسن، نورالدین السندی، ایک حنفی فقیہ تھے جنہوں نے حدیث، تفسیر اور عربی کی تعلیم حاصل کی، السند سے اور مدینہ میں آباد ہوئے۔ سنن اور صحیح کے مجموعوں پر تالیفات کے مصنف، مسند احمد اور البیضاوی؛ وفات 1138ھ (1726)۔"
