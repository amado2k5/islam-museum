summary:
  ar: "نصرت عبد الله هارون (1886–1966)، واسمها الحقيقي نصرت خانم، ناشطة اجتماعية وسياسية سندية وُلدت في إيران واستقرت في كراتشي، حيث تزوجت عبد الله هارون سنة 1914. أسست مدرسة في بيتها وجمعية «أنجمن خواتين» لتعليم نساء السند ورفاههن، ودعمت حركة الخلافة، وانتُخبت سنة 1943 رئيسة لرابطة نساء مسلمي عموم الهند، وكانت نائبة رئيس جمعية نساء عموم باكستان."
  en: "Nusrat Abdullah Haroon (1886–1966), real name Nusrat Khanum, a Sindhi social and political activist born in Iran who settled in Karachi, where in 1914 she married Abdullah Haroon. She started a school at her home and founded the Anjuman-i-Khawateen for the education and welfare of the women of Sindh, supported the Khilafat Movement, was elected president of the All India Women Muslim League in 1943, and was vice-president of the All Pakistan Women's Association."
  ur: "نصرت عبداللہ ہارون (1886ء–1966ء)، اصل نام نصرت خانم، ایران میں پیدا ہونے والی سندھی سماجی و سیاسی کارکن جو کراچی میں آباد ہوئیں، جہاں 1914ء میں ان کی شادی عبد اللہ ہارون سے ہوئی۔ انھوں نے اپنے گھر میں مدرسہ قائم کیا اور سندھ کی خواتین کی تعلیم و فلاح کے لیے «انجمن خواتین» بنائی، تحریک خلافت کی حمایت کی، 1943ء میں آل انڈیا ویمن مسلم لیگ کی صدر منتخب ہوئیں، اور آل پاکستان ویمنز ایسوسی ایشن کی نائب صدر رہیں۔"
