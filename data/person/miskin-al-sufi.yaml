summary:
  ar: "مسكين بن عبيد الصوفي، صحب أصحاب إبراهيم بن أدهم فسلك مسلكه في التوحيد والزهد، ونقل عن المتوكل بن الحسين العابد قول إبراهيم بن أدهم إن الزهد ثلاثة أصناف: زهد فرض في الحرام، وزهد فضل في الحلال، وزهد سلامة في الشبهات."
  en: "Miskin ibn Ubayd al-Sufi, a companion of the followers of Ibrahim ibn Adham, who took his path in tawhid and asceticism; he relates from al-Mutawakkil ibn al-Husayn al-Abid Ibrahim ibn Adham's division of asceticism into obligatory (avoiding the forbidden), supererogatory (avoiding the permissible in excess) and cautious (avoiding doubtful matters)."
  ur: "مسکین بن عبید صوفی ابراہیم بن ادہم کے شاگردوں کے ساتھی تھے اور توحید و زہد میں ان کا راستہ اختیار کیا۔ انہوں نے متوکل بن حسین عابد سے ابراہیم بن ادہم کا قول نقل کیا کہ زہد کی تین قسمیں ہیں: فرض، یعنی حرام سے بچنا؛ فضل، یعنی حلال میں بھی حد سے بچنا؛ اور سلامت، یعنی شبہات سے بچنا۔"
