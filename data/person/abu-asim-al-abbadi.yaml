summary:
  ar: "أبو عاصم محمد بن أحمد بن محمد العبادي، فقيه شافعي من هراة، وُلد سنة 375هـ، وتولّى القضاء في هراة، وتوفي فيها سنة 458هـ. من مؤلفاته «طبقات الشافعية» و«أدب القضاء». {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  en: "Abu 'Asim Muhammad ibn Ahmad al-'Abbadi, known as al-Qadi al-Harawi, a Shafi'i jurist. Born in Herat in 375/985, he studied there and in Nishapur, travelled widely, served as qadi of Herat and died there in 458/1066. His Tabaqat al-Shafi'iyya survives in manuscripts. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  ur: "ابو عاصم محمد بن احمد العبادی، ہرات کے شافعی فقیہ، جو 375/985 میں پیدا ہوئے، ہرات کے قاضی رہے اور 458/1066 میں وہیں وفات پائی۔ ان کی «طبقات الشافعیہ» مخطوطات میں باقی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
