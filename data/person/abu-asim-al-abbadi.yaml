id: person/abu-asim-al-abbadi
class: person
label: { ar: "أبو عاصم العبادي", en: "Abu 'Asim al-'Abbadi", ur: "ابو عاصم العبادی", fr: "Abu 'Asim al-'Abbadi", es: "Abu 'Asim al-'Abbadi" }
summary:
  ar: "أبو عاصم محمد بن أحمد بن محمد العبادي، فقيه شافعي من هراة، وُلد سنة 375هـ، وتولّى القضاء في هراة، وتوفي فيها سنة 458هـ. من مؤلفاته «طبقات الشافعية» و«أدب القضاء». {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  en: "Abu 'Asim Muhammad ibn Ahmad al-'Abbadi, known as al-Qadi al-Harawi, a Shafi'i jurist. Born in Herat in 375/985, he studied there and in Nishapur, travelled widely, served as qadi of Herat and died there in 458/1066. His Tabaqat al-Shafi'iyya survives in manuscripts. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  ur: "ابو عاصم محمد بن احمد العبادی، ہرات کے شافعی فقیہ، جو 375/985 میں پیدا ہوئے، ہرات کے قاضی رہے اور 458/1066 میں وہیں وفات پائی۔ ان کی «طبقات الشافعیہ» مخطوطات میں باقی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  fr: "Abu 'Asim Muhammad ibn Ahmad al-'Abbadi, connu sous le nom d'al-Qadi al-Harawi, juriste shafi'ite. Né à Hérat en 375/985, il y étudia ainsi qu'à Nichapour, voyagea beaucoup, fut cadi de Hérat et y mourut en 458/1066. Ses Tabaqat al-Shafi'iyya sont conservées en manuscrits. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  es: "Abu 'Asim Muhammad ibn Ahmad al-'Abbadi, conocido como al-Qadi al-Harawi, fue un jurista shafi'í. Nació en Herat en el año 375/985, estudió allí y en Nishapur, viajó extensamente, fue cadí de Herat y falleció allí en el año 458/1066. Su obra Tabaqat al-Shafi'iyya se conserva en manuscritos. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  tr: "Heratlı Şafiî fıkıhçı Ebu Asım Muhammed ibn Ahmed ibn Muhammed el-Abadi, Hicri 375 yılında doğmuştur. Herat'ta kadı olarak görev yapmış ve Hicri 458 yılında orada vefat etmiştir. Eserleri arasında \"Tabaqat al-Shafi'iyya\" (Şafî Alimlerin Sınıfları) ve \"Adab al-Qada'\" (Hukuk Adabı) bulunmaktadır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  id: "Abu Asim Muhammad ibn Ahmad ibn Muhammad al-Abadi, seorang ahli hukum mazhab Syafi'i dari Herat, lahir pada tahun 375 H. Beliau menjabat sebagai hakim di Herat dan meninggal di sana pada tahun 458 H. Di antara karya-karyanya adalah \"Tabaqat al-Shafi'iyya\" (Klasifikasi Ulama Syafi'i) dan \"Adab al-Qada'\" (Tata Krama Peradilan). {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
