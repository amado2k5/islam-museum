    note: >-
      FLAGGED for a founder ruling. The unbelief reading rests on his own
      published words. In the concluding essay of his Hindustan Times series
      (June 2017) he wrote: 'my attempts to be what was called a true muslim
      ended when I was about twenty. I abandoned religion then and have
      never felt the need for it' — and commentators have accordingly
      described him as a self-declared atheist who still lays claim to a
      Muslim identity. The counter-reading stands in the same essay: 'Even
      though I am no longer a practising Muslim, and in fact had never been
      overly aware of a Muslim identity' — a lapsed member's phrasing rather
      than a former member's; the English biography records that he
      identifies as a non-practising Muslim, he writes and speaks publicly
      as a Muslim cultural voice, and Wikidata gives Islam. He has not, in
      the sources read, written 'I am an atheist' in so many words, so
      against this lane's atheist-or-sceptic bar the settlement is held at
      unknown pending the ruling. His orthodox Muslim upbringing at
      Barabanki is background and was not counted. Settled atheist-or-
      sceptic/self-identified by the founder's ruling of 1 November 2026
      (rulings packet #3, 2e: his own words meet the bar).
