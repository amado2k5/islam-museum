summary:
  ar: "ممثل ومخرج هندي (وُلد سنة 1950) من بارابانكي، من أعلام السينما الموازية منذ «نيشانت» (1975)، حاز ثلاث جوائز فيلم وطنية وكأس فولبي لأفضل ممثل في البندقية عن «بار» (1984)، وشارك في تأسيس فرقة «موتلي» المسرحية، ونال بادما شري (1984) وبادما بوشان (2003)."
  en: "Indian actor and director (born 1950) from Barabanki, a central figure of parallel cinema since Nishant (1975); he won three National Film Awards and the Volpi Cup for Best Actor at Venice for Paar (1984), co-founded the Motley theatre company, and received the Padma Shri (1984) and Padma Bhushan (2003)."
  ur: "بھارتی اداکار و ہدایت کار (پیدائش 1950) جن کا تعلق بارہ بنکی سے ہے؛ «نشانٹ» (1975) سے متوازی سنیما کے مرکزی فنکار رہے، تین قومی فلم ایوارڈز اور «پار» (1984) پر وینس کا وولپی کپ جیتا، موٹلی تھیٹر کمپنی کے شریک بانی ہیں اور پدم شری (1984) و پدم بھوشن (2003) سے نوازے گئے۔"
