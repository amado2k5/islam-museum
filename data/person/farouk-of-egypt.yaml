summary:
  ar: "ملك مصر والسودان من 1936 إلى 1952، عاشر حكام مصر من أسرة محمد علي وقبل الأخير من ملوكها. اعتلى العرش في السادسة عشرة، وتآكلت شعبيته مع فساد الحكومات وهزيمة 1948، فأطاح به الضباط الأحرار سنة 1952، وتنازل لابنه الرضيع ومات في منفاه بروما سنة 1965."
  en: "King of Egypt and the Sudan from 1936 to 1952, the tenth ruler of Egypt from the Muhammad Ali dynasty and its penultimate king. He came to the throne at sixteen; his standing eroded with government corruption and the 1948 defeat, and the Free Officers overthrew him in 1952. He abdicated in favour of his infant son and died in exile in Rome in 1965."
  ur: "1936ء سے 1952ء تک مصر و سوڈان کے بادشاہ، خاندانِ محمد علی کے دسویں حکمران اور اس کے آخری سے پہلے بادشاہ۔ سولہ برس کی عمر میں تخت نشین ہوئے؛ حکومتی بدعنوانی اور 1948ء کی شکست سے ان کی ساکھ گھٹی، اور 1952ء میں فری آفیسرز نے انہیں ہٹا دیا۔ وہ اپنے نوزائیدہ بیٹے کے حق میں دست بردار ہوئے اور 1965ء میں روم میں جلا وطنی کے دوران وفات پائی۔"
