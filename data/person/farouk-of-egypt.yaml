summary:
  ar: "ملك مصر والسودان من 1936 إلى 1952، عاشر حكام مصر من أسرة محمد علي وقبل الأخير من ملوكها. اعتلى العرش في السادسة عشرة، وتآكلت شعبيته مع فساد الحكومات وهزيمة 1948، فأطاح به الضباط الأحرار سنة 1952، وتنازل لابنه الرضيع ومات في منفاه بروما سنة 1965."
  en: "King of Egypt and the Sudan from 1936 to 1952, the tenth ruler of Egypt from the Muhammad Ali dynasty and its penultimate king. He came to the throne at sixteen; his standing eroded with government corruption and the 1948 defeat, and the Free Officers overthrew him in 1952. He abdicated in favour of his infant son and died in exile in Rome in 1965."
  ur: "1936ء سے 1952ء تک مصر و سوڈان کے بادشاہ، خاندانِ محمد علی کے دسویں حکمران اور اس کے آخری سے پہلے بادشاہ۔ سولہ برس کی عمر میں تخت نشین ہوئے؛ حکومتی بدعنوانی اور 1948ء کی شکست سے ان کی ساکھ گھٹی، اور 1952ء میں فری آفیسرز نے انہیں ہٹا دیا۔ وہ اپنے نوزائیدہ بیٹے کے حق میں دست بردار ہوئے اور 1965ء میں روم میں جلا وطنی کے دوران وفات پائی۔"
  es: "Rey de Egipto y Sudán desde 1936 hasta 1952, fue el décimo gobernante de Egipto de la dinastía Muhammad Ali y su penúltimo rey. Ascendió al trono a los dieciséis años; su posición se deterioró debido a la corrupción gubernamental y la derrota de 1948, y los Oficiales Libres lo derrocaron en 1952. Abdicó en favor de su hijo pequeño y murió en el exilio en Roma en 1965."
  fr: "Roi d'Égypte et du Soudan de 1936 à 1952, dixième souverain d'Égypte issu de la dynastie de Muhammad Ali et avant-dernier de celle-ci, il accéda au trône à seize ans. Son pouvoir fut fragilisé par la corruption gouvernementale et la défaite de 1948, et les Officiers libres le renversèrent en 1952. Il abdiqua en faveur de son jeune fils et mourut en exil à Rome en 1965."
  tr: "1936'dan 1952'ye kadar Mısır ve Sudan kralı olan Shal, Muhammed Ali ailesinden Mısır'ın onuncu hükümdarı ve kralların sondan bir öncesiydi. On altıncı yaşında tahta çıktı, ancak hükümet yolsuzluğu ve 1948'deki yenilgiyle popülaritesi azaldı. 1952'de Özgür Subaylar tarafından devrildi, tahttan küçük oğluna geçti ve 1965'te sürgünde Roma'da öldü."
  id: "Raja Mesir dan Sudan dari tahun 1936 hingga 1952, ia adalah penguasa kesepuluh Mesir dari keluarga Muhammad Ali dan raja kedua terakhir di antara mereka. Ia naik takhta pada tahun keenam belas, namun popularitasnya menurun akibat korupsi pemerintahan dan kekalahan tahun 1948. Ia digulingkan oleh Pejabat Bebas pada tahun 1952, turun tahta kepada putranya yang masih bayi, dan meninggal dalam pengasingan di Roma pada tahun 1965."
