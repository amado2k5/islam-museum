summary:
  ar: "ربّاع تركي وُلد في بلغاريا سنة 1973 باسم خليل علييف. فرّ إلى تركيا سنة 1989، ثم صار أحد أربعة ربّاعين في التاريخ نالوا ثلاث ميداليات ذهبية أولمبية متتالية (1996 و2000 و2004)، وبطل عالم خمس مرات وحامل أكثر من عشرين رقمًا قياسيًا عالميًا."
  en: "Turkish weightlifter born in Bulgaria in 1973 as Halil Aliev. He fled to Turkey in 1989 and became one of only four weightlifters in history to win three consecutive Olympic gold medals (1996, 2000, 2004), a five-time world champion who set more than 20 world records."
  ur: "ترک ویٹ لفٹر جو 1973 میں بلغاریہ میں خلیل علییف کے نام سے پیدا ہوئے۔ وہ 1989 میں ترکی فرار ہوئے اور تاریخ کے صرف چار ویٹ لفٹروں میں شامل ہوئے جنہوں نے مسلسل تین اولمپک طلائی تمغے جیتے (1996، 2000، 2004)؛ وہ پانچ بار عالمی چیمپئن رہے اور بیس سے زائد عالمی ریکارڈ قائم کیے۔"
