summary:
  ar: "ربّاع تركي وُلد في بلغاريا سنة 1973 باسم خليل علييف. فرّ إلى تركيا سنة 1989، ثم صار أحد أربعة ربّاعين في التاريخ نالوا ثلاث ميداليات ذهبية أولمبية متتالية ⁦(1996 و2000 و2004)⁩، وبطل عالم خمس مرات وحامل أكثر من عشرين رقمًا قياسيًا عالميًا."
  en: "Turkish weightlifter born in Bulgaria in 1973 as Halil Aliev. He fled to Turkey in 1989 and became one of only four weightlifters in history to win three consecutive Olympic gold medals (1996, 2000, 2004), a five-time world champion who set more than 20 world records."
  ur: "ترک ویٹ لفٹر جو 1973 میں بلغاریہ میں خلیل علییف کے نام سے پیدا ہوئے۔ وہ 1989 میں ترکی فرار ہوئے اور تاریخ کے صرف چار ویٹ لفٹروں میں شامل ہوئے جنہوں نے مسلسل تین اولمپک طلائی تمغے جیتے ⁦(1996، 2000، 2004)⁩؛ وہ پانچ بار عالمی چیمپئن رہے اور بیس سے زائد عالمی ریکارڈ قائم کیے۔"
  es: "Halil Aliev, levantador de pesas turco nacido en Bulgaria en 1973. Huyó a Turquía en 1989 y se convirtió en uno de los cuatro únicos levantadores de pesas de la historia en ganar tres medallas de oro olímpicas consecutivas (1996, 2000, 2004), cinco veces campeón del mundo y poseedor de más de 20 récords mundiales."
  fr: "Haltérophile turc né en Bulgarie en 1973 sous le nom de Halil Aliev, il s'est enfui en Turquie en 1989 et est devenu l'un des quatre seuls haltérophiles de l'histoire à remporter trois médailles d'or olympiques consécutives (1996, 2000, 2004), quintuple champion du monde et détenteur de plus de 20 records du monde."
  tr: "1973'te Bulgaristan'da Khalil Aliyev adıyla doğmuş Türk halterci. 1989'da Türkiye'ye kaçtı, ardından tarihte üç ardışık Olimpiyat altın madalyası (1996, 2000 ve 2004) kazanan sadece dört halterden biri oldu, beş kez dünya şampiyonu oldu ve yirmiden fazla dünya rekoru sahibiydi."
  id: "Seorang atlet angkat besi Turki yang lahir di Bulgaria pada tahun 1973 dengan nama Khalil Aliyev. Ia melarikan diri ke Turki pada tahun 1989, lalu menjadi salah satu dari hanya empat atlet angkat besi dalam sejarah yang memenangkan tiga medali emas Olimpiade berturut-turut (1996, 2000, dan 2004), juara dunia lima kali, dan pemegang lebih dari dua puluh rekor dunia."
