summary:
  ar: "عبد الرزاق سالم قرنح ⁦(وُلد في 20 كانون الأول 1948 في زنجبار)⁩ روائي وأكاديمي تنزاني من أصل يمني، حاز جائزة نوبل في الأدب سنة 2021؛ لجأ إلى بريطانيا في ستينيات القرن العشرين، وكتب روايات منها «الجنة» (1994) و«على ضفاف البحر» (2001)، ودرّس الأدب الإنجليزي وما بعد الاستعمار في جامعة كينت، ومنذ 2024 أستاذ في جامعة نيويورك أبو ظبي."
  en: "Abdulrazak Salim Gurnah (born 20 December 1948 in Zanzibar) is a Tanzanian novelist and academic of Yemeni origin who won the Nobel Prize in Literature in 2021; he came to Britain as a refugee in the 1960s, wrote novels including Paradise (1994) and By the Sea (2001), taught English and postcolonial literatures at the University of Kent, and since 2024 has been a professor at New York University Abu Dhabi."
  ur: "عبد الرزاق سالم گرناہ ⁦(پیدائش 20 دسمبر 1948، زنجبار)⁩ یمنی نژاد تنزانی ناول نگار و ماہرِ تعلیم ہیں جنھیں 2021 میں ادب کا نوبل انعام ملا؛ وہ 1960 کی دہائی میں پناہ گزین کے طور پر برطانیہ آئے، «پیراڈائز» (1994) و «بائی دی سی» (2001) جیسے ناول لکھے، کینٹ یونیورسٹی میں انگریزی و مابعد نوآبادیاتی ادب پڑھایا، اور 2024 سے نیویارک یونیورسٹی ابوظہبی میں پروفیسر ہیں۔"
