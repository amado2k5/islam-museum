class: person
label: { ar: "عبيد الله بن عبد الله الطاهري", en: "Ubaydallah Ibn Abdallah Al Tahiri" }
summary:
  ar: "عبيد الله بن عبد الله بن طاهر وكان شاعرا مترسلا أميرا ولى الشرطة في خلافة محمد بن عبد الله بن طاهر ببغداد وكان سيدا وإليه انتهت رياسة أهله وهو آخر من مات منهم رئيسا، وله كتاب الإشارة في أخبار الشعر وكتاب رسالته في السياسة الملوكية وكتاب مراسلاته لعبد الله بن المعتز وكتاب البراعة والفصاحة {cite:fihrist-ibn-al-nadim p. 170}."
  en: "Ubaydallah ibn Abdallah — the last Tahirid chief, poet and letter-writer {cite:fihrist-ibn-al-nadim}"
