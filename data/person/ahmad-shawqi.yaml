summary:
  ar: "شاعر مصري ⁦(1868–1932)⁩ لُقّب بأمير الشعراء، من أعظم شعراء العربية في العصر الحديث. جمع شعره في «الشوقيات»، وابتدع المسرح الشعري العربي بمسرحيات مثل «مصرع كليوباترا» و«مجنون ليلى» و«علي بك الكبير» و«قمبيز»، وعُرف بمدائحه ووطنياته ورثائه للأندلس."
  en: "Egyptian poet (1868–1932), titled 'Prince of Poets' (Amir al-Shu'ara'), among the greatest Arabic poets of the modern age. His verse is collected in Al-Shawqiyyat; he founded Arabic verse drama with plays such as The Fall of Cleopatra, Majnun Laila, Ali Bey al-Kabir and Cambyses, and is known for panegyrics, patriotic poems and his laments for al-Andalus."
  ur: "مصری شاعر ⁦(1868–1932)⁩ جن کا لقب «امیر الشعراء» ہے اور جو جدید دور کے عظیم ترین عرب شعراء میں شمار ہوتے ہیں۔ ان کی شاعری «الشوقیات» میں جمع ہے؛ انہوں نے «مصرع کلیوپاترا»، «مجنون لیلیٰ»، «علی بک الکبیر» اور «قمبیز» جیسے ڈراموں سے عربی نظمی ڈرامے کی بنیاد رکھی اور مدح، وطنیات اور اندلس کے مرثیوں کے لیے معروف ہیں۔"
