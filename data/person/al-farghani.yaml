inventions:
  - { invention: invention/farghani-eccentric-orb, role: transmitter, note: "Chapter-sixteen account of the Sun's eccentric orb and the planets' centres on a unified scale inside the Jawami'; inherited structure presented, not invented.", sources: [source/farghani-elements-astronomy, source/tdv-fergani-kaya, source/iranica-fargani-ahmad] }
  - { invention: invention/farghani-epicycle-radii, role: transmitter, note: "Unified-scale table of epicycle radii for the Moon and planets in chapter sixteen; parameters carried from earlier astronomy.", sources: [source/farghani-elements-astronomy, source/tdv-fergani-kaya, source/iranica-fargani-ahmad] }
  - { invention: invention/farghani-heliacal-visibility, role: transmitter, note: "Chapters on the planets' risings, settings and concealment in the sun's rays with approximate elongation distances.", sources: [source/farghani-elements-astronomy, source/tdv-fergani-kaya, source/iranica-fargani-ahmad] }
  - { invention: invention/farghani-lunar-five-motions, role: transmitter, note: "Five-circular-motion composition of the Moon's apparent motion along the zodiac, documented at the cited OCR pages.", sources: [source/farghani-elements-astronomy, source/tdv-fergani-kaya, source/iranica-fargani-ahmad] }
  - { invention: invention/farghani-parallax-arc, role: transmitter, note: "Computational account of the surface-versus-centre viewing difference with the Moon's maxima, inside the treatise's judgement chapters.", sources: [source/farghani-elements-astronomy, source/tdv-fergani-kaya, source/iranica-fargani-ahmad] }
  - { invention: invention/ruju-al-kawakib, role: describer, note: "Dedicated chapter explaining retrograde motion of the five wandering stars through the epicycle-and-deferent composition, with per-planet limits; exposition of a Ptolemaic model inside the curriculum, not invention.", sources: [source/farghani-elements-astronomy, source/commons-ptolemy-epicycles, source/tdv-ilm-i-felek] }
  - { invention: invention/kurawiyyat-al-sama, role: describer, note: "Chapter-two account of the spherical heavens with its observational proofs and the parallel/intersecting circles; systematised a received ancient doctrine rather than discovering it.", sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek] }
  - { invention: invention/mayl-falak-al-buruj, role: describer, note: "Records Ptolemy's 23°51' and the al-Ma'mun-era verified measurement of 23°35' in two places of the treatise; transmitter of the measurement tradition, not the measurer.", sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek] }
  - { invention: invention/manazil-al-qamar, role: describer, note: "Lists the twenty-eight lunar mansions with their star groups and risings/settings in his twentieth chapter; transmitted and fixed the received scheme that descends from the Indian system via the anwā'.", sources: [source/farghani-elements-astronomy, source/kunitzsch-lunar-mansions-2008] }
