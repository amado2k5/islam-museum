summary:
  ar: "طبيبة أفغانية ومدافعة عن حقوق الإنسان، وُلدت في 3 فبراير 1957 في جاغوري بولاية غزني، وحصلت على شهادة الطب من جامعة كابل سنة 1982. فرّت إلى باكستان سنة 1984 بعد اعتقال زوجها واختفائه، وأسّست في كويتا منظمة الشهداء وعيادتها سنة 1989 لخدمة اللاجئات الأفغانيات. صارت أول وزيرة لشؤون المرأة في أفغانستان بعد طالبان (2001–2003)، ورأست اللجنة الأفغانية المستقلة لحقوق الإنسان (2002–2019)، وعملت مقررة خاصة للأمم المتحدة لحقوق الإنسان في السودان (2005–2009)، ونالت جائزة رايت لايفليهود سنة 2012."
  en: "Afghan physician and human rights advocate, born on 3 February 1957 in Jaghori, Ghazni province, who took her medical degree at Kabul University in 1982. After her husband was arrested and disappeared she fled to Pakistan in 1984, and in Quetta founded the Shuhada Organization and Clinic in 1989 for Afghan refugee women and girls. She became Afghanistan's first post-Taliban Minister of Women's Affairs (2001–2003), chaired the Afghan Independent Human Rights Commission (2002–2019), served as UN Special Rapporteur on human rights in Sudan (2005–2009), and received the Right Livelihood Award in 2012."
  ur: "افغان طبیبہ اور انسانی حقوق کی وکیل، 3 فروری 1957ء کو غزنی صوبے کے جاغوری میں پیدا ہوئیں اور 1982ء میں کابل یونیورسٹی سے طب کی ڈگری حاصل کی۔ شوہر کی گرفتاری اور گمشدگی کے بعد وہ 1984ء میں پاکستان فرار ہوئیں اور کوئٹہ میں افغان پناہ گزین خواتین کے لیے شہدا آرگنائزیشن اور کلینک قائم کیا (1989ء)۔ وہ طالبان کے بعد افغانستان کی پہلی وزیرِ امورِ خواتین بنیں (2001ء–2003ء)، افغان آزاد انسانی حقوق کمیشن کی سربراہ رہیں (2002ء–2019ء)، سوڈان کے لیے اقوام متحدہ کی خصوصی نمائندہ رہیں (2005ء–2009ء)، اور 2012ء میں رائٹ لائیولی ہڈ ایوارڈ حاصل کیا۔"
