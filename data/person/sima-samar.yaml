summary:
  ar: "طبيبة أفغانية ومدافعة عن حقوق الإنسان، وُلدت في 3 فبراير 1957 في جاغوري بولاية غزني، وحصلت على شهادة الطب من جامعة كابل سنة 1982. فرّت إلى باكستان سنة 1984 بعد اعتقال زوجها واختفائه، وأسّست في كويتا منظمة الشهداء وعيادتها سنة 1989 لخدمة اللاجئات الأفغانيات. صارت أول وزيرة لشؤون المرأة في أفغانستان بعد طالبان (2001–2003)، ورأست اللجنة الأفغانية المستقلة لحقوق الإنسان (2002–2019)، وعملت مقررة خاصة للأمم المتحدة لحقوق الإنسان في السودان (2005–2009)، ونالت جائزة رايت لايفليهود سنة 2012."
  en: "Afghan physician and human rights advocate, born on 3 February 1957 in Jaghori, Ghazni province, who took her medical degree at Kabul University in 1982. After her husband was arrested and disappeared she fled to Pakistan in 1984, and in Quetta founded the Shuhada Organization and Clinic in 1989 for Afghan refugee women and girls. She became Afghanistan's first post-Taliban Minister of Women's Affairs (2001–2003), chaired the Afghan Independent Human Rights Commission (2002–2019), served as UN Special Rapporteur on human rights in Sudan (2005–2009), and received the Right Livelihood Award in 2012."
  ur: "افغان طبیبہ اور انسانی حقوق کی وکیل، 3 فروری 1957ء کو غزنی صوبے کے جاغوری میں پیدا ہوئیں اور 1982ء میں کابل یونیورسٹی سے طب کی ڈگری حاصل کی۔ شوہر کی گرفتاری اور گمشدگی کے بعد وہ 1984ء میں پاکستان فرار ہوئیں اور کوئٹہ میں افغان پناہ گزین خواتین کے لیے شہدا آرگنائزیشن اور کلینک قائم کیا ⁦(1989ء)⁩۔ وہ طالبان کے بعد افغانستان کی پہلی وزیرِ امورِ خواتین بنیں ⁦(2001ء–2003ء)⁩، افغان آزاد انسانی حقوق کمیشن کی سربراہ رہیں ⁦(2002ء–2019ء)⁩، سوڈان کے لیے اقوام متحدہ کی خصوصی نمائندہ رہیں ⁦(2005ء–2009ء)⁩، اور 2012ء میں رائٹ لائیولی ہڈ ایوارڈ حاصل کیا۔"
  es: "Médica afgana y defensora de los derechos humanos, nacida el 3 de febrero de 1957 en Jaghori, provincia de Ghazni, se licenció en Medicina en la Universidad de Kabul en 1982. Tras la detención y desaparición de su marido, huyó a Pakistán en 1984 y fundó en Quetta la Organización y Clínica Shuhada en 1989 para mujeres y niñas refugiadas afganas. Fue la primera ministra de Asuntos de la Mujer de Afganistán tras la caída de los talibanes (2001-2003), presidió la Comisión Independiente de Derechos Humanos de Afganistán (2002-2019), fue relatora especial de la ONU sobre derechos humanos en Sudán (2005-2009) y recibió el premio Right Livelihood en 2012."
  fr: "Médecin et militante des droits humains afghane, née le 3 février 1957 à Jaghori, dans la province de Ghazni, elle obtint son diplôme de médecine à l'université de Kaboul en 1982. Après l'arrestation et la disparition de son mari, elle s'enfuit au Pakistan en 1984 et fonda à Quetta, en 1989, l'organisation et clinique Shuhada pour les femmes et les filles réfugiées afghanes. Elle devint la première ministre afghane des Affaires féminines après la chute des talibans (2001-2003), présida la Commission indépendante afghane des droits de l'homme (2002-2019), fut rapporteuse spéciale des Nations Unies sur les droits de l'homme au Soudan (2005-2009) et reçut le prix Right Livelihood en 2012."
  tr: "Afgan doktor ve insan hakları savunucusu olan Kâgher, 3 Şubat 1957'de Gazni eyaletinin Jaghori kentinde doğmuş, 1982 yılında Kabil Üniversitesi'nden tıp diploması almıştır. Kocası tutuklanıp kaybolunca 1984'te Pakistan'a kaçmış ve 1989'da Afgan mülteci kadınlara hizmet etmek için Quetta'da Şehitler Örgütü ve kliniğini kurmuştur. Taliban'dan sonra Afganistan'daki ilk kadın Kadın İşleri Bakanı olmuştur (2001–2003), Afgan Bağımsız İnsan Hakları Komisyonu'na başkanlık (2002–2019), Sudan'da BM İnsan Hakları Özel Raportörü (2005–2009) görev yapmış ve 2012'de Right Lives Ödülü'nü almıştır."
  id: "Seorang dokter dan pembela hak asasi manusia Afghanistan, lahir pada 3 Februari 1957 di Jaghori, provinsi Ghazni, ia meraih gelar kedokteran dari Universitas Kabul pada tahun 1982. Ia melarikan diri ke Pakistan pada tahun 1984 setelah suaminya ditangkap dan menghilang, dan mendirikan Organisasi Para Martir serta kliniknya di Quetta pada tahun 1989 untuk melayani perempuan pengungsi Afghanistan. Ia menjadi Menteri Urusan Perempuan perempuan pertama di Afghanistan setelah Taliban (2001–2003), memimpin Komisi Hak Asasi Manusia Independen Afghanistan (2002–2019), menjabat sebagai Pelapor Khusus PBB untuk Hak Asasi Manusia di Sudan (2005–2009), dan menerima Right Lives Award pada tahun 2012."
