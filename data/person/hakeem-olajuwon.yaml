summary:
  ar: "لاعب كرة سلة أمريكي من أصل نيجيري، وُلد في لاغوس سنة 1963، لعب 18 موسما في الدوري الأمريكي للمحترفين معظمها مع هيوستن روكتس، وقاده إلى بطولتين متتاليتين في 1994 و1995، ونال جائزة أفضل لاعب في الدوري سنة 1994، وهو صاحب الرقم القياسي التاريخي في صدّ الكرات (3830)، وأُدرج في قاعة مشاهير كرة السلة سنة 2008."
  en: "Nigerian-American former basketball player, born in Lagos in 1963, who played 18 NBA seasons, mostly with the Houston Rockets, leading them to back-to-back championships in 1994 and 1995. He won the 1994 NBA MVP award, retired as the league's all-time leader in blocked shots (3,830), and was inducted into the Basketball Hall of Fame in 2008."
  ur: "نائجیرین نژاد امریکی سابق باسکٹ بال کھلاڑی، جو 1963 میں لاگوس میں پیدا ہوئے، جنہوں نے NBA میں 18 سیزن کھیلے جن میں زیادہ تر ہیوسٹن راکٹس کے ساتھ گزارے، ٹیم کو 1994 اور 1995 میں لگاتار دو چیمپئن شپ دلائیں، 1994 میں NBA MVP رہے، بلاک شاٹس (3,830) کا آل ٹائم ریکارڈ رکھتے ہیں، اور 2008 میں باسکٹ بال ہال آف فیم میں شامل ہوئے۔"
