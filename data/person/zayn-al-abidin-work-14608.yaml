summary:
  ar: "زين العابدين التبريزي، رسام ومذهّب وخطاط فارسي في العصر الصفوي، عمل في قزوين وتتلمذ على سلطان محمد، وتحفظ أعماله في مكتبة تشستر بيتي ومتحف المتروبوليتان؛ يُؤرَّخ نشاطه بين نحو 1570 و1602م، ولا يُعرف له تاريخ ميلاد أو وفاة {cite:wikidata}."
  en: "Zayn al-Abidin Tabrizi was a Safavid-era Persian illustrator, illuminator and calligrapher who worked at Qazvin and is recorded as a pupil of Sultan Muhammad; works attributed to him are held by the Chester Beatty Library and the Metropolitan Museum of Art. His working period is given as c. 1570 to 1602, and no birth or death date is known {cite:wikidata}. He is not Ali ibn al-Husayn Zayn al-Abidin, the fourth Imam (see person/ali-zayn-al-abidin)."
