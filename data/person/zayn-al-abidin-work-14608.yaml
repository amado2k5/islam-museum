summary:
  ar: "زين العابدين التبريزي، رسام ومذهّب وخطاط فارسي في العصر الصفوي، عمل في قزوين وتتلمذ على سلطان محمد، وتحفظ أعماله في مكتبة تشستر بيتي ومتحف المتروبوليتان؛ يُؤرَّخ نشاطه بين نحو 1570 و1602م، ولا يُعرف له تاريخ ميلاد أو وفاة {cite:wikidata}."
  en: "Zayn al-Abidin Tabrizi was a Safavid-era Persian illustrator, illuminator and calligrapher who worked at Qazvin and is recorded as a pupil of Sultan Muhammad; works attributed to him are held by the Chester Beatty Library and the Metropolitan Museum of Art. His working period is given as c. 1570 to 1602, and no birth or death date is known {cite:wikidata}. He is not Ali ibn al-Husayn Zayn al-Abidin, the fourth Imam (see person/ali-zayn-al-abidin)."
  es: "Zayn al-Abidin Tabrizi fue un ilustrador, iluminador y calígrafo persa de la época safávida que trabajó en Qazvin y figura como discípulo del sultán Muhammad; obras que se le atribuyen se conservan en la Biblioteca Chester Beatty y en el Museo Metropolitano de Arte. Su periodo de actividad se sitúa entre 1570 y 1602 aproximadamente, y se desconoce su fecha de nacimiento y fallecimiento {cite:wikidata}. No se trata de Ali ibn al-Husayn Zayn al-Abidin, el cuarto imán (véase person/ali-zayn-al-abidin)."
  fr: "Zayn al-Abidin Tabrizi était un illustrateur, enlumineur et calligraphe persan de l'époque safavide, ayant travaillé à Qazvin et étant mentionné comme élève du sultan Muhammad. Des œuvres qui lui sont attribuées sont conservées à la Chester Beatty Library et au Metropolitan Museum of Art. Sa période d'activité est située entre 1570 et 1602 environ, et aucune date de naissance ni de décès n'est connue (voir wikidata). Il ne s'agit pas d'Ali ibn al-Husayn Zayn al-Abidin, le quatrième imam (voir personne/ali-zayn-al-abidin)."
  ur: "زین العابدین تبریزی صفوی دور کے فارسی مصور، روشن خیال اور خطاط تھے جنہوں نے قزوین میں کام کیا اور سلطان محمد کے شاگرد کے طور پر ریکارڈ کیا جاتا ہے۔ ان سے منسوب کام چیسٹر بیٹی لائبریری اور میٹروپولیٹن میوزیم آف آرٹ کے پاس ہیں۔ اس کے کام کی مدت c کے طور پر دی گئی ہے۔ 1570 تا 1602، اور کوئی تاریخ پیدائش یا موت معلوم نہیں ہے {cite:wikidata}۔ وہ علی بن الحسین زین العابدین نہیں ہیں، چوتھے امام ⁦(دیکھیں شخص/علی زین العابدین)⁩۔"
  tr: "Zain al-Abidin al-Tabrizi, Safevi döneminin Fars ressamı, mezhepçisi ve hattatıdır; Kazvin'de çalışmış ve Sultan Muhammed'in yanında eğitim görmüştür. Eserleri Chester Beatty Kütüphanesi ve Metropolitan Müzesi'nde korunmaktadır; faaliyetleri yaklaşık 1570 ile 1602 yılları arasında tarihlendirilmekte olup, doğum veya ölüm tarihleri bilinmemektedir {cite:wikidata}."
  id: "Zain al-Abidin al-Tabrizi adalah seorang pelukis, sektarian, dan kaligrafer Persia pada era Safawi, yang bekerja di Qazvin dan belajar di bawah bimbingan Sultan Muhammad. Karyanya disimpan di Perpustakaan Chester Beatty dan Museum Metropolitan; aktivitasnya diperkirakan antara sekitar tahun 1570 dan 1602 M, dan tanggal lahir atau kematiannya tidak diketahui {cite:wikidata}."
