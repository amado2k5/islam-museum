  en: "Al-Muhalhil (Adi) ibn Rabi'a of Taghlib, called Abu Layla and Zir Salim — Kulayb's brother and father of Amr ibn Kulthum's mother; after Jasas killed Kulayb he prosecuted the blood-feud against Bakr for forty years, the proverbial model of patient vengeance {cite:kamil-ibn-al-athir p. 392}."
