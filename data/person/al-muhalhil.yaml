summary:
  ar: "المهلهل بن ربيعة التغلبي، أخو كليب بن ربيعة وأبو ليلى أم عمرو بن كلثوم؛ لما قتل جساس بن مرة أخاه كليباً ثار يطلب بثأره فدار بينه وبين بكر أيام البسوس أربعين سنة، وهو مثل العرب في طول الحرب وصبر الثأر {cite:kamil-ibn-al-athir p. 392}."
  en: "Al-Muhalhil (Adi) ibn Rabi'a of Taghlib, called Abu Layla and Zir Salim — Kulayb's brother and father of Amr ibn Kulthum's mother; after Jasas killed Kulayb he prosecuted the blood-feud against Bakr for forty years, the proverbial model of patient vengeance {cite:kamil-ibn-al-athir p. 392}."
  fr: "Al-Muhalhil (Adi) ibn Rabi'a de Taghlib, appelé Abu Layla et Zir Salim – frère de Kulayb et père de la mère d'Amr ibn Kulthum ; après Jassas tué Kulayb, il a poursuivi la vendetta contre Bakr pendant quarante ans, le modèle proverbial de vengeance patiente {cite:kamil-ibn-al-athir p. 392}."
  es: "Al-Muhalhil (Adi) ibn Rabi'a de Taghlib, llamado Abu Layla y Zir Salim — hermano de Kulayb y padre de la madre de Amr ibn Kulthum; después de que Jasas matara a Kulayb, continuó la venganza de sangre contra Bakr durante cuarenta años, el modelo proverbial de venganza paciente {cite:kamil-ibn-al-athir p. 392}."
  ur: "المحلل ⁦(عدی)⁩ ابن ربیعہ جو تغلب کا ہے، جسے ابو لیلیٰ اور زر سلیم کہا جاتا ہے — کلیب کے بھائی اور عمرو بن کلثوم کی والدہ کے والد؛ جصاس نے کلیب کو قتل کرنے کے بعد چالیس سال تک بکر کے خلاف خونریزی کا مقدمہ چلایا، صبر کے انتقام کا ایک مثالی نمونہ۔ 392}۔"
  tr: "Kulayb ibn Rabi'ah ve Amr ibn Kulthum'un annesi Abu Leyla'nın kardeşi El-Muhallal ibn Rabi'ah el-Taghlibi; Jassas ibn Murrah kardeşi Kulayb'ı öldürdüğünde, Kulayb intikam peşinde isyan etti ve el-Basus döneminde kırk yıl boyunca Bakr ile yaşadı. Uzun savaşta Araplar gibi intikam sabrına sahiptir {atıf:kamil-ibn-al-athir s. 392}."
  id: "Al-Muhallal ibn Rabi'ah al-Taghlibi, saudara Kulayb ibn Rabi'ah dan Abu Layla, ibu dari Amr ibn Kulthum; ketika Jassas ibn Murrah membunuh saudaranya Kulayb, Kulayb memberontak mencari balas dendam, sehingga ia tinggal bersama Bakr selama masa al-Basus selama empat puluh tahun. Ia seperti orang Arab dalam perang panjang dan kesabaran untuk balas dendam {cite:kamil-ibn-al-athir hlm. 392}."
