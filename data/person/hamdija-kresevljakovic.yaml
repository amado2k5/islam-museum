summary:
  ar: "مؤرخ بوسني من سراييفو، يُعدّ من أبرز مؤرخي البوسنة والهرسك: معلّم وأستاذ طويل العهد في مدرسة غازي خسرو بك، كتب أكثر من 300 عمل في تاريخ البوسنة، ولا سيما التاريخ الاقتصادي والثقافي لسراييفو العثمانية، ومن كتبه «الحرف والصناعات في سراييفو القديمة»."
  en: "Bosnian historian from Sarajevo, regarded as one of the most significant historians of Bosnia and Herzegovina: a teacher and long-serving professor at the Gazi Husrev-beg Madrasa who wrote over 300 works on Bosnian history, above all the economic and cultural history of Ottoman Sarajevo, among them Esnafi i obrti u starom Sarajevu (Guilds and Crafts in Old Sarajevo)."
  ur: "سرائیوو سے تعلق رکھنے والے بوسنیائی مؤرخ، جنھیں بوسنیا و ہرزیگووینا کے اہم ترین مؤرخین میں شمار کیا جاتا ہے: معلم اور غازی خسرو بیگ مدرسے کے دیرینہ استاد، جنھوں نے بوسنیائی تاریخ پر 300 سے زائد تصانیف لکھیں، خصوصاً عثمانی سرائیوو کی معاشی و ثقافتی تاریخ، جن میں «قدیم سرائیوو کے اصناف و حرفتیں» شامل ہے۔"
