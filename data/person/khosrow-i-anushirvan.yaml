  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك كسرى أنو شروان» {cite:tabari-tarikh-abu-al-fadl j.2 p.98}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وقيل إنه صادف بيت النار ببلاد الشيز والران وفيه أصنام فأخرجها، وقيل نقل ناره إلى الموضع المعروف بالبركة {cite:muruj-al-dhahab p. 549}"
