  ar: "عالم كردي من تركيا العثمانية، وُلد سنة 1877 وتوفي سنة 1960، ألّف «رسائل النور»، وهي تفسير للقرآن يزيد على ستة آلاف صفحة، وقضى أكثر من عشرين عامًا بين السجن والنفي في تركيا الجمهورية."
