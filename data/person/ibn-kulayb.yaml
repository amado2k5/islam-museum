id: person/ibn-kulayb
class: person
label: { ar: "ابن كليب" }
names:
  - { value: "مسند العراق أبو الفرج عبد المنعم بن عبد الوهاب بن سعد الحراني ثم البغدادي الحنبلي التاجر", kind: full }
summary:
  ar: "ابن كليب مسند العراق أبو الفرج عبد المنعم بن عبد الوهاب بن سعد الحراني ثم البغدادي الحنبلي التاجر؛ ولد في صفر سنة خمسمائة وسمع من ابن بيان وابن نبهان وابن زيدان الحلواني وطائفة؛ مات في ربيع الأول سنة ست وتسعين وخمسمائة ممتعاً بحواسه {cite:shadharat-dhahab p. 807}."
  en: "Ibn Kulayb, musnid of Iraq — Abu al-Faraj Abd al-Mun'im b. Abd al-Wahhab b. Sa'd al-Harrani then Baghdadi, Hanbali and merchant; b. Safar 500, heard from Ibn Bayan, Ibn Nabhan, Ibn Zaydan al-Halwani and others; he died in Rabi' I 596 in full possession of his faculties {cite:shadharat-dhahab p. 807}."
  es: "Ibn Kulayb, musnid de Irak - Abu al-Faraj Abd al-Mun'im b. Abd al-Wahhab b. Sa'd al-Harrani luego Baghdadi, Hanbali y comerciante; b. Safar 500, escuchado de Ibn Bayan, Ibn Nabhan, Ibn Zaydan al-Halwani y otros; murió en Rabi' I 596 en plena posesión de sus facultades {citar: shadharat-dhahab p. 807}."
  fr: "Ibn Kulayb, musulman d'Irak — Abu al-Faraj Abd al-Mun'im b. Abd al-Wahhab b. Sa'd al-Harrani puis Baghdadi, Hanbali et marchand; b. Safar 500, entendu d'Ibn Bayan, Ibn Nabhan, Ibn Zaydan al-Halwani et d'autres; il mourut à Rabi' I 596 en pleine possession de ses facultés {cite: shadharat-dhahab p. 807}."
  ur: "ابن کلیب، عراق کا مسنید - ابو الفراج عبد المنعیم بن۔ عبد الوہاب بی۔ سعد حرانی پھر بغدادی، حنبلی اور سوداگر؛ ب صفر 500، ابن بیان، ابن نبھان، ابن زیدان الحلوانی اور دیگر سے سنا؛ ان کا انتقال ربیع الثانی 596ء میں ہوا جہاں وہ اپنی پوری قوت کے مالک تھے۔ 807}۔"
  tr: "Irak Musnadı, Ebu el-Farac Abdül-Mun'im ibn Abdül-Vahhab bin Sâud el-Harrani, o zamanlar tüccar el-Bağdadi el-Hanbali; beş yüz Hicri yılında Sefer'de doğdu ve İbn Bayan, İbn Nabhan, İbn Zeydan el-Halvani ve bir gruptan duydu; beş yüz doksan altıncı Ahri yılında, Rabi'l-Avvel'de, aklını yitirerek vefat etti {atıf:şadharat-dhahab, s. 807}."
  id: "Ibn Kulayb, Musnad Irak, Abu al-Faraj Abd al-Mun'im ibn Abd al-Wahhab ibn Sa'd al-Harrani, kemudian al-Baghdadi al-Hanbali sang pedagang; lahir di Safar pada tahun lima ratus H dan mendengar dari Ibn Bayan, Ibn Nabhan, Ibn Zaydan al-Halwani, dan kelompoknya; ia meninggal di Rabi' al-Awwal pada tahun lima ratus sembilan puluh enam H, masih waras {cite:shadharat-dhahab, hlm. 807}."
