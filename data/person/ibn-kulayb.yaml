summary:
  ar: "ابن كليب مسند العراق أبو الفرج عبد المنعم بن عبد الوهاب بن سعد الحراني ثم البغدادي الحنبلي التاجر؛ ولد في صفر سنة خمسمائة وسمع من ابن بيان وابن نبهان وابن زيدان الحلواني وطائفة؛ مات في ربيع الأول سنة ست وتسعين وخمسمائة ممتعاً بحواسه {cite:shadharat-dhahab p. 807}."
  en: "Ibn Kulayb, musnid of Iraq — Abu al-Faraj Abd al-Mun'im b. Abd al-Wahhab b. Sa'd al-Harrani then Baghdadi, Hanbali and merchant; b. Safar 500, heard from Ibn Bayan, Ibn Nabhan, Ibn Zaydan al-Halwani and others; he died in Rabi' I 596 in full possession of his faculties {cite:shadharat-dhahab p. 807}."
