id: person/ali-ibn-baliq
class: person
label: { ar: "علي بن بليق" }
summary:
  ar: "من أصحاب مؤنس المظفر؛ لقيه المقتدر يوم قُتل وهو مولٍّ فترجّل وقبّل الأرض وقال له إلى أين تذهب ارجع فلعن الله من أشار عليك بالحضور، وقيل إن بعضهم أمره بقتله {cite:kamil-ibn-al-athir p. 180}. وعند ابن الأثير قبض عليه القاهر مع أبيه ومؤنس أول شعبان سنة 321هـ بالحيلة المذكورة، ثم ذُبح وحُمل رأسه في طشت إلى أبيه فلما رآه بكى وأخذه يقبّله {cite:kamil-ibn-al-athir p. 190-195}"
  en: "An officer of Mu'nis; meeting the fleeing caliph he dismounted, kissed the ground and begged him to turn back — but the Maghariba and Berbers overtook and killed him {cite:kamil-ibn-al-athir p. 180}."
  es: "Un oficial de Mu'nis; al encontrarse con el califa que huía, desmontó, besó el suelo y le rogó que regresara, pero los maghariba y los bereberes lo alcanzaron y lo mataron {cite:kamil-ibn-al-athir p. 180}."
  fr: "Un officier de Mu'nis; rencontrant le calife en fuite, il descendit de cheval, embrassa le sol et le supplia de rebrousser chemin — mais les Maghariba et les Berbères le rattrapèrent et le tuèrent {cite:kamil-ibn-al-athir p. 180}."
  ur: "مؤنث کا ایک افسر؛ بھاگنے والے خلیفہ سے مل کر وہ نیچے اترا، زمین کو بوسہ دیا اور اس سے پیچھے ہٹنے کی التجا کی - لیکن مغریبہ اور بربروں نے اسے پکڑ لیا اور اسے قتل کر دیا۔ 180}۔"
  tr: "Mu'nas al-Muzaffar'ın yoldaşlarından biri; el-Muqtadir, onun öldürüldüğü gün, o görevdeyken onunla karşılaştı. Atından indi, yere öptü ve ona, 'Nereye gidiyorsun? Geri dön.' dedi. Gelene lanet olsun. Bazıları onun öldürülmesini emretti. {atıf:Kamil-ibn-al-Athir s. 180}. İbn al-Athir'de, el-Qahir, 321 Hicri yılının ilk Şa'ban'ında onu babası ve Mu'nasla birlikte yakaladı, sonra katledip başını bir leğende babasına taşıdı. Onu görünce ağladı ve onu kabul ettirdi {atıf:kamil-ibn-al-athir s. 190-195}"
  id: "Salah satu sahabat Mu'nas al-Muzaffar; al-Muqtadir menemuinya pada hari ia dibunuh saat ia memimpin. Ia turun dari kuda, mencium tanah, dan berkata kepadanya, 'Ke mana engkau pergi? Kembalilah.' Semoga Allah mengutuk siapa pun yang memberi isyarat agar kau datang. Dikatakan bahwa beberapa memerintahkan agar ia dibunuh. {cite:kamil-ibn-al-athir hlm. 180}. Di Ibn al-Athir, al-Qahir menangkapnya bersama ayahnya dan Mu'nas pada tanggal 1 Sha'ban tahun 321 H menggunakan trik tersebut, lalu membantunya dan membawa kepalanya di baskom kepada ayahnya. Ketika ia melihatnya, ia menangis dan membawanya untuk menerima {cite:kamil-ibn-al-athir hlm. 190-195}"
