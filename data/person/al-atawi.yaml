id: person/al-atawi
class: person
label: { ar: "العطوي", en: "Al Atawi", fr: "Al-Atawi", es: "Al Atawi", ur: "العتاوی" }
summary:
  ar: "محمد بن عطية وقيل محمد بن عبد الرحمن بن أبي عطية وولاؤه لبني ليث بن بكر بن عبد مناة بن كنانة من حذاق المتكلمين ويكنى أبا عبد الرحمن على مذهب الحسين النجار ويخالفه في الإدراك وهو مع ذلك شاعر مطبوع من أهل البصرة نزع إلى مدينة السلام ثم منها إلى سر من رأى، وله كتاب خلق الأفعال وكتاب الإدراك {cite:fihrist-ibn-al-nadim p. 256}."
  en: "Al-Atawi — Najjar's school poet-theologian {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Atawi — poète et théologien de l’école de Najjar {cite:fihrist-ibn-al-nadim}"
  es: "Al-Atawi - poeta y teólogo de la escuela de Najjar {cita:fihrist-ibn-al-nadim}"
  ur: "العطاوی - نجار کے مکتب کے شاعر - ماہر الہیات {حوالہ: فہرست ابن الندیم}"
  tr: "Muhammed ibn Atiyye veya Muhammed ibn Abdülrahman ibn Abi Atiyye, Beni Leyth ibn Bekr ibn Abd Manat ibn Kinana'ya bağlı olan, yetenekli hatiplerden biridir. Hüseyin el-Necar'ın düşünce okulunu takip eden, ancak algı konusunda ondan farklı düşünen Ebu Abdülrahman olarak bilinir. Ayrıca Basra'dan doğuştan yetenekli bir şairdir; önce Barış Şehri'ne, sonra oradan da Samarra'ya taşınmıştır. Amellerin yaratılması üzerine bir kitabı ve algı üzerine bir kitabı vardır. {cite:fihrist-ibn-al-nadim s. 256}"
  id: "Muhammad ibn Atiyya, atau Muhammad ibn Abd al-Rahman ibn Abi Atiyya, yang kesetiaannya kepada Banu Layth ibn Bakr ibn Abd Manat ibn Kinana, adalah salah satu orator yang terampil. Ia dikenal sebagai Abu Abd al-Rahman, mengikuti mazhab pemikiran al-Husayn al-Najjar, tetapi berbeda dengannya dalam persepsi. Ia juga seorang penyair berbakat alami dari Basra, yang pindah ke Kota Perdamaian dan kemudian dari sana ke Samarra. Ia memiliki sebuah buku tentang penciptaan tindakan dan sebuah buku tentang persepsi. {cite:fihrist-ibn-al-nadim p. 256}."
