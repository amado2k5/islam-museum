summary:
  ar: "محمد بن عطية وقيل محمد بن عبد الرحمن بن أبي عطية وولاؤه لبني ليث بن بكر بن عبد مناة بن كنانة من حذاق المتكلمين ويكنى أبا عبد الرحمن على مذهب الحسين النجار ويخالفه في الإدراك وهو مع ذلك شاعر مطبوع من أهل البصرة نزع إلى مدينة السلام ثم منها إلى سر من رأى، وله كتاب خلق الأفعال وكتاب الإدراك {cite:fihrist-ibn-al-nadim p. 256}."
  en: "Al-Atawi — Najjar's school poet-theologian {cite:fihrist-ibn-al-nadim}"
