  ar: "السلطان السابع عشر لباموم في غرب الكاميرون (حكم 1886/1887–1933)، مبتكر أبجدية باموم ولغة الشوموم، بنى قصر فومبان وأسّس مدارس لتعليم الكتابة التي ابتكرها."
  en: "The seventeenth Sultan of Bamum in western Cameroon (reigned 1886/87–1933), inventor of the Bamum script and the Shümom language; built the Foumban palace and founded schools teaching his script."
