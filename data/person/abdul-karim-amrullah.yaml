summary:
  ar: "عالم ومصلح من مينانغكابو (1879–1945)، عُرف بحاجي رسول: درس بمكة على الشيخ أحمد الخطيب المنكباوي، ثم قاد من سوفاي باتانغ وبادانغ بانجانغ تجديدًا تعليميًا عبر مدارس طوالب جمعت العلوم الدينية والعامة، وقاوم الأعراف وفرقة الأمومة وضرائب المستعمر، ومات في جاكرتا، وهو والد حمكا."
  en: "Minangkabau scholar and reformer (1879–1945), known as Haji Rasul: he studied at Mecca under Sheikh Ahmad Khatib al-Minangkabawi, then led an educational renewal from Sungai Batang and Padang Panjang through the Thawalib schools, which combined religious and general subjects; he opposed adat practices, matrilineal kinship rules and colonial taxes, died at Jakarta, and was the father of Hamka."
  ur: "مینانگکاباؤ عالم اور مصلح (1879ء–1945ء)، جو حاجی رسول کے نام سے مشہور ہوئے: مکہ میں شیخ احمد خطیب المنانگکباوی سے تعلیم حاصل کی، پھر سنگائی باتانگ اور پاڈانگ پانجانگ سے طوالب مدارس کے ذریعے تعلیمی تجدید کی قیادت کی جن میں دینی اور عام علوم جمع تھے؛ انہوں نے رواجی رسوم، مادری نسبی نظام اور استعماری ٹیکسوں کی مخالفت کی، جکارتہ میں وفات پائی اور حمکا کے والد تھے۔"
