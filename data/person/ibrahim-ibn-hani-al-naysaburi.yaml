summary:
  ar: "أبو إسحاق إبراهيم بن هانئ النيسابوري، رحل في طلب العلم إلى بغداد ومصر ومكة واستوطن بغداد وحدّث عن قبيصة وخلق كثير، وكان ثقة صالحًا، واختفى عنده أحمد بن حنبل في زمن المحنة فكان يقول «أنا لا أطيق ما يطيق أبوك من العبادة» لابنه إسحاق، وقال أيضًا «إن كان ببغداد رجل من الأبدال فأبو إسحاق النيسابوري». وعند موته قال لابنه وهو عطشان: ائتِ بماء، فلما قال غابت الشمس قال «إذًا فردّه» ثم قال «لمثل هذا فليعمل العاملون» وخرجت روحه. توفي في ربيع الآخر سنة خمس وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 50-51}."
  en: "Abu Ishaq Ibrahim ibn Hani' of Nishapur — the traditionist in whose house Ahmad ibn Hanbal hid during the Mihna, of whom Ahmad said 'if Baghdad holds one of the abdal, it is Abu Ishaq'; dying, he asked for water, and when his son said the sun had set he said 'then put it back' and quoted 'for such let the workers work' {cite:muntazam-ibn-al-jawzi p. 50-51}."
