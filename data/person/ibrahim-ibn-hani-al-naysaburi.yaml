id: person/ibrahim-ibn-hani-al-naysaburi
class: person
label: { ar: "أبو إسحاق إبراهيم بن هانئ النيسابوري", en: "Ibrahim ibn Hani' al-Naysaburi", es: "Ibrahim ibn Hani' al-Naysaburi", fr: "Ibrahim ibn Hani' al-Naysaburi", ur: "ابراہیم بن ہانی النیسابوری" }
summary:
  ar: "أبو إسحاق إبراهيم بن هانئ النيسابوري، رحل في طلب العلم إلى بغداد ومصر ومكة واستوطن بغداد وحدّث عن قبيصة وخلق كثير، وكان ثقة صالحًا، واختفى عنده أحمد بن حنبل في زمن المحنة فكان يقول «أنا لا أطيق ما يطيق أبوك من العبادة» لابنه إسحاق، وقال أيضًا «إن كان ببغداد رجل من الأبدال فأبو إسحاق النيسابوري». وعند موته قال لابنه وهو عطشان: ائتِ بماء، فلما قال غابت الشمس قال «إذًا فردّه» ثم قال «لمثل هذا فليعمل العاملون» وخرجت روحه. توفي في ربيع الآخر سنة خمس وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 50-51}."
  en: "Abu Ishaq Ibrahim ibn Hani' of Nishapur — the traditionist in whose house Ahmad ibn Hanbal hid during the Mihna, of whom Ahmad said 'if Baghdad holds one of the abdal, it is Abu Ishaq'; dying, he asked for water, and when his son said the sun had set he said 'then put it back' and quoted 'for such let the workers work' {cite:muntazam-ibn-al-jawzi p. 50-51}."
  es: "Abu Ishaq Ibrahim ibn Hani' de Nishapur — el tradicionalista en cuya casa se escondió Ahmad ibn Hanbal durante la Mihna, de quien Ahmad dijo 'si Bagdad tiene uno de los abdal, es Abu Ishaq'; al morir, pidió agua, y cuando su hijo dijo que el sol se había puesto, dijo 'entonces vuélvelo a poner' y citó 'para tales cosas, que trabajen los obreros' {cite:muntazam-ibn-al-jawzi p. 50-51}."
  fr: "Abu Ishaq Ibrahim ibn Hani' de Nishapur — le traditionniste chez qui Ahmad ibn Hanbal se cacha pendant la Mihna, dont Ahmad dit: « Si Bagdad détient l'un des abdal, c'est Abu Ishaq »; mourant, il demanda de l'eau, et lorsque son fils lui dit que le soleil s'était couché, il dit: « Alors remettez-la » et cita: « Pour de tels travailleurs, que les ouvriers travaillent » {cite: muntazam-ibn-al-jawzi p. 50-51}."
  ur: "نیشاپور کے ابو اسحاق ابراہیم بن ہانی - وہ روایت کرنے والے جن کے گھر میں احمد بن حنبل مہنہ کے دوران چھپے ہوئے تھے، جن کے بارے میں احمد نے کہا کہ 'اگر بغداد کے پاس ابدال میں سے ایک ہے تو وہ ابو اسحاق ہے'؛ مرنے کے بعد اس نے پانی مانگا اور جب اس کے بیٹے نے کہا کہ سورج غروب ہو گیا ہے تو اس نے کہا 'پھر اسے واپس رکھ دو' اور نقل کیا کہ 'ایسے مزدوروں کو کام کرنے دیں'۔ 50-51}۔"
  tr: "Ebu İshaq İbrahim ibn Hani el-Nisebari, bilgi peşinde Bağdat, Mısır ve Mekke'ye seyahat etti, Bağdat'ta yerleşti ve Kubeysa ile birçok insan hakkında rivayet etti. Güvenilir ve doğru biriydi. Ahmed ibn Hanbal, sıkıntı zamanında oğlu İshaq'a \"Babanın ibadete dayanabildiğini kaldıramam\" diyerek ondan kayboldu. Ayrıca şöyle dedi: \"Bağdat'ta Abdal'dan biri varsa, o Ebu İshaq el-Nisaburi'dir.\" Ölümünden sonra susamış oğluna şöyle dedi: \"Su getir.\" Güneş batarsa, 'Eğer geri dönerse,' dedi, sonra 'İşçiler böyle yapsın,' dedi ve ruhu gitti. 265 yılında Rabi'al-Akhir'de öldü {atıf:Muntazam-ibn-al-Jawzi, s. 50-51}."
  id: "Abu Ishaq Ibrahim ibn Hani al-Nisaburi melakukan perjalanan mencari ilmu pengetahuan ke Baghdad, Mesir, dan Mekah, menetap di Baghdad, dan bercerita tentang Qubaysa dan banyak orang. Ia dapat dipercaya dan benar. Ahmad ibn Hanbal menghilang darinya pada masa penderitaan, berkata, \"Aku tidak tahan apa yang ayahmu sanggup terima dalam penyembahan\" kepada putranya Ishaq. Ia juga berkata, \"Jika ada orang dari Abdal di Baghdad, itu adalah Abu Ishaq al-Nisaburi.\" Setelah kematiannya, ia berkata kepada putranya yang haus: Bawakan air. Ketika ia berkata, 'Matahari telah terbenam,' ia berkata, 'Jika ia kembali,' lalu berkata, 'Biarlah para pekerja melakukan hal seperti itu,' dan jiwanya pun pergi. Ia meninggal di Rabi' al-Akhir pada tahun 265 {cite:muntazam-ibn-al-jawzi, hlm. 50-51}."
