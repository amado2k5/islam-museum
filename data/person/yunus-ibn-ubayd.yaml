summary:
  ar: "أبو عبد الله يونس بن عبيد، مولى عبد القيس، أصله من الكوفة، ذكره الشيرازي في فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 48}. مات سنة تسع وثلاثين ومائة، وقيل سنة أربعين {cite:tabaqat-fuqaha-abbas-1981 p. 48}."
  tr: "Abd al-Kais'in özgür bırakılmış adamı Ebu Abdullah Yunus bin Ubeyd, aslen Kufe'den, el-Şirazi tarafından Basra hukukçularında bahsedilmiştir {cite:tabaqat-fuqaha-abbas-1981 s. 48}. Yüz otuz dokuzuncu yılda öldü ve kırk yaşında olduğu söylenir {cite:tabaqat-fuqaha-abbas-1981 s. 48}."
  id: "Abu Abdullah Yunus ibn Ubayd, mantan Abd al-Qais, berasal dari Kufa, disebutkan oleh al-Shirazi dalam para ahli hukum Basra {cite:tabaqat-fuqaha-abbas-1981 hlm. 48}. Ia meninggal pada tahun seratus tiga puluh sembilan, dan dikatakan pada tahun empat puluh {cite:tabaqat-fuqaha-abbas-1981 hlm. 48}."
