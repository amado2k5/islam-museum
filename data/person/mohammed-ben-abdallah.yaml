    note: >-
      The sultan's own reported saying names his school — "I am
      Maliki in madhhab, Wahhabi in creed" — transmitted by the
      French historian Charles-André Julien and carried in that form
      by the Arabic article and by Muhammad ibn Sa'd
      al-Shuway'ir's monograph Tashih khata' tarikhi hawl
      al-Wahhabiyya, both of them quoting Julien. That is a single
      historiographical origin, one source family under the founder
      rulings, so the Maliki naming is recorded here in full but
      settlement is withheld until a second independent attestation
      is read. The rest of his record is stated in full — influenced
      by the Salafi call that reached him through Meccan pilgrims,
      he fought religious innovations and the multiplication of the
      Sufi orders and called to ijtihad and the Sunna, and in
      Julien's account his religious zeal led him to authorise the
      destruction of books that permitted the Ash'ari school and
      the demolition of some zawiyas; as a young prince at Marrakesh
      he had also taken the Nasiri tariqa from Shaykh Abu al-Abbas
      al-Sharadi, as the Arabic article records. The English
      article's infobox files him as Sunni Islam, and Wikidata
      carries no religion value at all.
    sources: [source/wikipedia-mohammed-ben-abdallah-ar, source/wikipedia-mohammed-ben-abdallah-en, source/wikidata-mohammed-ben-abdallah]

