summary:
  ar: "سيدي محمد بن عبد الله الخطيب، المشهور بمحمد الثالث (ق. 1710 – 9 أبريل 1790)، سلطان المغرب من الأسرة العلوية بين 1757 و1790. كان عاملًا على مراكش في عهد أبيه عبد الله بن إسماعيل، فأعاد للدولة وحدتها بعد عقود من الاضطراب على العرش، وعمّر المدن التي خرّبها زلزال 1755 فأسس الصويرة وجدّد الدار البيضاء والرباط، وانتصر على الفرنسيين في العرائش سنة 1765 وأخرج البرتغاليين من مازاغان سنة 1769، وكان سنة 1777 أول حاكم يعترف باستقلال الولايات المتحدة الأمريكية، وختم ذلك بمعاهدة السلام والصداقة المغربية الأمريكية سنة 1786. وصفه عبد الله العروي بأنه «مهندس المغرب الحديث»."
  en: "Sidi Muhammad bin Abdallah al-Khatib, commonly known as Muhammad III (c. 1710 – 9 April 1790), was the Alawite sultan of Morocco from 1757 to 1790. Governor of Marrakesh under his father Abdallah bin Ismail, he restored the sultanate after decades of succession strife, rebuilt the cities shattered by the 1755 earthquake — founding Essaouira and rebuilding Casablanca and Rabat — defeated the French at Larache in 1765, expelled the Portuguese from Mazagan in 1769, and in 1777 became the first ruler to recognise the independence of the United States, sealing the Moroccan–American Treaty of Peace and Friendship in 1786. Abdallah Laroui described him as 'the architect of modern Morocco'."
  ur: "سیدی محمد بن عبد اللہ الخطیب، مشہور نام محمد سوم (ق۔ 1710ء – 9 اپریل 1790ء)، 1757ء سے 1790ء تک المغرب کے علوی سلطان رہے۔ والد عبد اللہ بن اسماعیل کے عہد میں مراکش کے گورنر تھے؛ تخت کی دہائیوں کی کشمکش کے بعد سلطنت کو دوبارہ متحد کیا، 1755ء کے زلزلے سے تباہ شدہ شہر آباد کیے — الصویرہ کی بنیاد رکھی اور دار البیضاء و رباط کی تعمیرِ نو کی — 1765ء میں العرائش میں فرانسیسیوں کو شکست دی، 1769ء میں پرتگالیوں کو مازاغان سے نکالا، اور 1777ء میں امریکہ کی آزادی کو تسلیم کرنے والے پہلے حکمران بنے، جس پر 1786ء میں مراکش–امریکہ معاہدۂ امن و دوستی مہر ثبت ہوئی۔ عبد اللہ العروی نے انہیں «جدید المغرب کا معمار» کہا۔"

