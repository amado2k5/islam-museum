summary:
  ar: "أبو الحسن علي بن أبي سعيد عبد الرحمن بن أحمد بن يونس بن عبد الأعلى الصدفي المنجم المصري؛ صاحب «الزيج الحاكمي» المعروف بزيج ابن يونس وهو زيج كبير رآه ابن خلكان في أربع مجلدات أسقط القول والعمل فيه وما أقصر في تحريره ولم يرَ في الأزياج على كثرتها أطول منه، وقد أمره بعمله وابتدأه له العزيز صاحب مصر؛ وكان مختصاً بعلم النجوم متصرفاً في سائر العلوم بارعاً في الشعر؛ ويُحكى في غفلته أن الحاكم قال: دخل إليّ يوماً ومداسه بيده فقبّل الأرض وجلس وترك المداس إلى جانبه {cite:wafayat-ayan}."
  en: "Ali b. Yunus al-Sadafi (d. 399) — Egypt's great astronomer; al-Aziz commissioned his Hakimi Zij, which Ibn Khallikan saw in four volumes as the longest zij he knew; the famous anecdote of him carrying his shoe into al-Hakim's presence {cite:wafayat-ayan}."
