summary:
  ar: "محمد فؤاد باشا ⁦(وُلد في إسطنبول سنة 1814 – توفي في نيس بفرنسا في فبراير 1869)⁩، رجل دولة عثماني من أبناء الأعيان العلماء، ابن الشاعر العالم كجّه جي زاده عزت ملا، صدر أعظم مرتين ⁦(1861–1863 و1863–1866)⁩ ووزير خارجية نحو عشر سنوات عند التركية، وقائد مهمة الباب العالي في سوريا أثناء فتنة جبل لبنان سنة 1860، وأحد ثلاثة رجال كبار قادوا التنظيمات مع رشيد باشا وعالي باشا واشتهر بحدّة ذهنه ونوادره."
  en: "Mehmed Fuad Pasha (born in Istanbul in 1814 – died at Nice in France in February 1869) was an Ottoman statesman from a prominent ulema family, son of the poet-scholar Keçecizade İzzet Molla, twice Grand Vizier (1861–1863 and 1863–1866) and Foreign Minister for nearly ten years by the Turkish article's count; he led the Porte's mission to Syria during the 1860 Mount Lebanon civil war, stood with Reşid Pasha and Âli Pasha as one of the three great men of the Tanzimat, and was famed for his wit."
  ur: "محمد فؤاد پاشا ⁦(پیدائش: استنبول، 1814ء – وفات: نیس، فرانس، فروری 1869ء)⁩، نامور علما خاندان کے عثمانی سیاست دان، شاعر و عالم عزت ملا کے بیٹے، دو بار صدرِ اعظم ⁦(1861–1863ء و 1863–1866ء)⁩ رہے اور 1860ء میں شام کی مہم کی قیادت کی۔"
  es: "Mehmed Fuad Pasha (nacido en Estambul en 1814 y fallecido en Niza, Francia, en febrero de 1869) fue un estadista otomano perteneciente a una destacada familia de ulemas, hijo del poeta y erudito Keçecizade İzzet Molla. Fue dos veces Gran Visir (1861-1863 y 1863-1866) y Ministro de Asuntos Exteriores durante casi diez años, según el artículo turco. Dirigió la misión de la Sublime Puerta a Siria durante la guerra civil del Monte Líbano de 1860, fue uno de los tres grandes hombres del Tanzimat, junto con Reşid Pasha y Âli Pasha, y fue famoso por su ingenio."
  fr: "Mehmed Fuad Pacha (né à Istanbul en 1814 – mort à Nice en France en février 1869) était un homme d'État ottoman issu d'une famille d'oulémas éminente, fils du poète et érudit Keçecizade İzzet Molla, deux fois grand vizir (1861-1863 et 1863-1866) et ministre des Affaires étrangères pendant près de dix ans selon l'article turc; il a dirigé la mission de la Porte en Syrie pendant la guerre civile du Mont-Liban de 1860, figurait avec Reşid Pacha et Âli Pacha parmi les trois grands hommes du Tanzimat, et était réputé pour son esprit."
  tr: "Muhammed Fuad Paşa (1814'te İstanbul'da doğdu – Şubat 1869'da Fransa'nın Nice kentinde öldü), seçkin ve alimlerin oğullarından Osmanlı devlet adamı, şair ve âlim Kaja Cezzadeh İzzetmolla'nın oğlu, iki kez (1861–1863 ve 1863–1866) Sadrazam olmuş, yaklaşık on yıl Türkiye'de dışişleri bakanı olmuş, 1860'taki Lübnan Dağı ayaklanması sırasında Suriye'deki Yüce Kapı misyonunun komutanı ve Raşid Paşa ile Ali Paşa ile birlikte örgütlere liderlik eden üç önde gelen adamdan biriydi. Keskin zekası ve nadir yetenekleriyle tanınıyordu."
  id: "Muhammad Fuad Pasha (lahir di Istanbul pada tahun 1814 – meninggal di Nice, Prancis, pada Februari 1869) adalah seorang negarawan Ottoman dari anak-anak tokoh dan cendekiawan, putra penyair dan cendekiawan Kaja Cezzadeh Izzetmolla, Grand Vizier dua kali (1861–1863 dan 1863–1866), menteri luar negeri selama sekitar sepuluh tahun di Turki, komandan misi Sublime Porte di Suriah selama pemberontakan Gunung Lebanon tahun 1860, dan salah satu dari tiga tokoh terkemuka yang memimpin organisasi bersama Rashid Pasha dan Ali Pasha. Ia dikenal karena kecerdasan dan keterampilan langka."
