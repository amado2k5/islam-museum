summary:
  ar: "محمد فؤاد باشا (وُلد في إسطنبول سنة 1814 – توفي في نيس بفرنسا في فبراير 1869)، رجل دولة عثماني من أبناء الأعيان العلماء، ابن الشاعر العالم كجّه جي زاده عزت ملا، صدر أعظم مرتين (1861–1863 و1863–1866) ووزير خارجية نحو عشر سنوات عند التركية، وقائد مهمة الباب العالي في سوريا أثناء فتنة جبل لبنان سنة 1860، وأحد ثلاثة رجال كبار قادوا التنظيمات مع رشيد باشا وعالي باشا واشتهر بحدّة ذهنه ونوادره."
  en: "Mehmed Fuad Pasha (born in Istanbul in 1814 – died at Nice in France in February 1869) was an Ottoman statesman from a prominent ulema family, son of the poet-scholar Keçecizade İzzet Molla, twice Grand Vizier (1861–1863 and 1863–1866) and Foreign Minister for nearly ten years by the Turkish article's count; he led the Porte's mission to Syria during the 1860 Mount Lebanon civil war, stood with Reşid Pasha and Âli Pasha as one of the three great men of the Tanzimat, and was famed for his wit."
  ur: "محمد فؤاد پاشا (پیدائش: استنبول، 1814ء – وفات: نیس، فرانس، فروری 1869ء)، نامور علما خاندان کے عثمانی سیاست دان، شاعر و عالم عزت ملا کے بیٹے، دو بار صدرِ اعظم (1861–1863ء و 1863–1866ء) رہے اور 1860ء میں شام کی مہم کی قیادت کی۔"
