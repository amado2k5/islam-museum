  ar: "أبو محمد الحسن بن أحمد بن يعقوب الهمداني اليمني المتوفى سنة ٣٣٤هـ؛ صاحب الإكليل في أنساب حمير وأيام ملوكها وهو كتاب كبير عظيم الفائدة يتم في عشر مجلدات {cite:kashf-zunun-furqan p. 556}."
  en: "Abu Muhammad al-Hasan ibn Ahmad al-Hamdani, d. AH 334 — the Yemeni polymath author of the ten-volume Iklil on Himyar's genealogies and kings {cite:kashf-zunun-furqan p. 556}."
