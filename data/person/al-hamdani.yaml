  es: "Abu Muhammad al-Hasan ibn Ahmad al-Hamdani, m. 334 AH: el erudito yemení autor de Iklil, en diez volúmenes, sobre las genealogías y los reyes de Himyar {citar:kashf-zunun-furqan p. 556}."
  ur: "ابو محمد الحسن بن احمد الحمدانی، د. 334ھ - ہمیار کے نسب اور بادشاہوں پر دس جلدوں پر مشتمل اکلیل کے یمنی پولی میتھ مصنف۔ 556}۔"
  tr: "334 Hile yılında vefat eden Ebu Muhammed el-Hasan ibn Ahmed ibn Ahmad el-Hamdani el-Yamani; El-İklil fi Enseb el-Himyar wa Ayyam Mulukhiha adlı kitabın yazarıdır. On ciltte derlenmiş büyük ve son derece faydalı bir kitaptır {kaynak: kaşf-zunun-furqan, s. 556}."
  id: "Abu Muhammad al-Hasan ibn Ahmad ibn Ya'qub al-Hamdani al-Yamani, yang meninggal pada tahun 334 H; penulis Al-Iklil fi Ansab al-Himyar wa Ayyam Mulukhiha. Ini adalah buku besar yang sangat bermanfaat yang disusun dalam sepuluh jilid {cite:kashf-zunun-furqan, hlm. 556}."
