id: person/nur-al-din-mahmud-ibn-zangi
class: person
label: { ar: "نور الدين محمود بن زنكي" }
summary:
  ar: "صاحب حلب ثم الشام، فك عن دمشق حصار الفرنج سنة ثلاث وأربعين وأخوه غازي صاحب الموصل فهزم الفرنج واستمر في قتالهم وأخذ ما استولوا عليه، وكان لا يفتر من الجهاد وملك دمشق في صفر سنة تسع وأربعين وملك عدة قلاع وحصون بالسيف وبالأمان من بلاد الروم وعظمت ممالكه وبعد صيته فبعث إليه المقتفي تقليداً وولاه مصر ولقبه بالملك العادل {cite:tarikh-khulafa-minhaj-1434 p. 673-675}، ومات سنة تسع وستين وكان صاحب دمشق وابنه الملك الصالح إسماعيل وهو صبي فتحركت الفرنج بالسواحل فصولحوا بمال وهودنوا {cite:tarikh-khulafa-minhaj-1434 p. 684}. وكان أجل ملوك زمانه وأعدلهم وأدينهم وأكثرهم جهاداً، هزم الفرنج غير مرة وافتتح من بلادهم ما يزيد على خمسين حصناً ومن بلاد الروم حصوناً عدة، وأسقط المكوس وبنى المدارس وسور دمشق والمكاتب للأيتام والربط والبيمارستان ودار العدل يجلس فيها أربعة أيام في الأسبوع، وحكى أن رجلاً وقف بازاءه وهو يلعب بالصولجان في ميدان دمشق يدعي عليه حكومة فرمى الصولجان من يده ومضى إلى مجلس القاضي فلما لم يثبت للرجل حق قال فاشهدوا أني قد وهبت الملك له وقد كنت أعلم أنه لا حق له عندي وإنما حضرت لئلا يقال عني إني تطلبت إلى مجلس الشرع فأبيت، قال ابن الأثير طالعت تواريخ الملوك قبل الإسلام وإلى يومنا فلم أر بعد الخلفاء الراشدين وعمر بن عبد العزيز ملكاً أحسن سيرة منه ولا أكثر تحرياً للعدل والإنصاف، وكان لا يتصرف في شيء يخصه إلا من ملك اشتراه من سهمه من غنائم الكفار ولم يلبس حريراً قط ولا ذهباً ولا فضة {cite:shadharat-dhahab p. 708-709}."
  en: "Lord of Aleppo then Syria; he relieved Damascus from the Frankish siege in 543 with his brother Ghazi and kept retaking what they held — never slackening in jihad. He took Damascus in Safar 549, and al-Muqtafi deeded him Egypt as 'al-Malik al-Adil {cite:tarikh-khulafa-minhaj-1434 p. 673-675}."
