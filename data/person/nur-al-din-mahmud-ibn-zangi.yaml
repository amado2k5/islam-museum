id: person/nur-al-din-mahmud-ibn-zangi
class: person
label: { ar: "نور الدين محمود بن زنكي", ur: "نور الدین محمود زنگی", en: "Nur al-Din Mahmud ibn Zangi" }
summary:
  ar: "نور الدين محمود ابن زنكي وخليفته في الشام بعد مقتله سنة 541هـ/1146م، وصاحب حلب ثم دمشق التي ضمها سنة 549هـ/1154م. جمع الشام في اتحاد واحد وواصل الجهاد ضد الفرنج، وأرسل شيركوه ثم صلاح الدين إلى مصر، وفي سنة 566هـ/1171م دخل الموصل. توفي في دمشق يوم 11 شوال 569هـ/15 مايو 1174م."
  en: "Nur al-Din Mahmud, second son and successor in Syria of the Zangid ruler murdered in 541/1146, held Aleppo and then took Damascus in 549/1154. He drew Syria into one federation, fought the Franks, sent Shirkuh and then Salah al-Din to Egypt, and entered Mosul in 566/1171. He died in Damascus on 11 Shawwal 569/15 May 1174."
  ur: "نور الدین محمود زنگی حکمران کے دوسرے بیٹے تھے جو 541ھ/1146ء میں قتل ہوا، وہ شام میں اس کے جانشین بنے، حلب سنبھالا اور 549ھ/1154ء میں دمشق لیا۔ انہوں نے شام کو ایک اتحاد میں جمع کیا، فرنگیوں سے جنگ کی، شیرکوہ اور پھر صلاح الدین کو مصر بھیجا، اور 566ھ/1171ء میں موصل میں داخل ہوئے۔ ان کی وفات دمشق میں 11 شوال 569ھ/15 مئی 1174ء کو ہوئی۔"
