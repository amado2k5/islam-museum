summary:
  ar: "نور الدين محمود ابن زنكي وخليفته في الشام بعد مقتله سنة 541هـ/1146م، وصاحب حلب ثم دمشق التي ضمها سنة 549هـ/1154م. جمع الشام في اتحاد واحد وواصل الجهاد ضد الفرنج، وأرسل شيركوه ثم صلاح الدين إلى مصر، وفي سنة 566هـ/1171م دخل الموصل. توفي في دمشق يوم 11 شوال 569هـ/15 مايو 1174م."
  en: "Nur al-Din Mahmud, second son and successor in Syria of the Zangid ruler murdered in 541/1146, held Aleppo and then took Damascus in 549/1154. He drew Syria into one federation, fought the Franks, sent Shirkuh and then Salah al-Din to Egypt, and entered Mosul in 566/1171. He died in Damascus on 11 Shawwal 569/15 May 1174."
  ur: "نور الدین محمود زنگی حکمران کے دوسرے بیٹے تھے جو 541ھ/1146ء میں قتل ہوا، وہ شام میں اس کے جانشین بنے، حلب سنبھالا اور 549ھ/1154ء میں دمشق لیا۔ انہوں نے شام کو ایک اتحاد میں جمع کیا، فرنگیوں سے جنگ کی، شیرکوہ اور پھر صلاح الدین کو مصر بھیجا، اور 566ھ/1171ء میں موصل میں داخل ہوئے۔ ان کی وفات دمشق میں 11 شوال 569ھ/15 مئی 1174ء کو ہوئی۔"
  es: "Nur al-Din Mahmud, segundo hijo y sucesor en Siria del gobernante Zangí asesinado en 541/1146, gobernó Alepo y luego tomó Damasco en 549/1154. Unificó Siria en una sola federación, combatió a los francos, envió a Shirkuh y luego a Saladino a Egipto, y entró en Mosul en 566/1171. Murió en Damasco el 11 de Shawwal de 569/15 de mayo de 1174."
  fr: "Nur al-Din Mahmud, second fils et successeur en Syrie du souverain zanguent assassiné en 541/1146, contrôla Alep puis prit Damas en 549/1154. Il unifia la Syrie en une seule fédération, combattit les Francs, envoya Shirkuh puis Saladin en Égypte et entra à Mossoul en 566/1171. Il mourut à Damas le 11 Shawwal 569/15 mai 1174."
  tr: "Nureddin Mahmud bin Zengi ve onun halefi 541 Hicri / 1146 M.S.'de vefat ettikten sonra Şam'da ve ardından Halep'in hükümdarı olarak 549 Hicri / 1154 yılında Şam'ı ilhak etti. Levant'ı tek bir birlikte birleştirdi ve Franklara karşı cihadı sürdürdü, önce Şirkuh ve ardından Salah-Din'i Mısır'a gönderdi. 566 Hicri / 1171 yılında Musul'a girdi. 11 Şevval 569 Hicri / 15 Mayıs 1174'te Şam'da öldü."
  id: "Nur al-Din Mahmud ibn Zengi dan penerusnya di Levant setelah kematiannya pada 541 H / 1146 M, serta penguasa Aleppo dan kemudian Damaskus, yang kemudian dia aneksasi pada 549 H / 1154 M. Dia menyatukan Levant menjadi satu persatuan dan melanjutkan jihad melawan Franka, mengirim Shirkuh dan kemudian Salah al-Din ke Mesir. Pada 566 H / 1171 M, dia memasuki Mosul. Dia meninggal di Damaskus pada 11 Shawwal 569 H / 15 Mei 1174 M."
