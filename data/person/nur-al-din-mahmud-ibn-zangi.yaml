label: { ar: "نور الدين محمود بن زنكي" }
summary:
  ar: "صاحب حلب ثم الشام، فك عن دمشق حصار الفرنج سنة ثلاث وأربعين وأخوه غازي صاحب الموصل فهزم الفرنج واستمر في قتالهم وأخذ ما استولوا عليه، وكان لا يفتر من الجهاد وملك دمشق في صفر سنة تسع وأربعين وملك عدة قلاع وحصون بالسيف وبالأمان من بلاد الروم وعظمت ممالكه وبعد صيته فبعث إليه المقتفي تقليداً وولاه مصر ولقبه بالملك العادل {cite:tarikh-khulafa-minhaj-1434 p. 673-675}، ومات سنة تسع وستين وكان صاحب دمشق وابنه الملك الصالح إسماعيل وهو صبي فتحركت الفرنج بالسواحل فصولحوا بمال وهودنوا {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  en: "Lord of Aleppo then Syria; he relieved Damascus from the Frankish siege in 543 with his brother Ghazi and kept retaking what they held — never slackening in jihad. He took Damascus in Safar 549, and al-Muqtafi deeded him Egypt as 'al-Malik al-Adil {cite:tarikh-khulafa-minhaj-1434 p. 673-675}."
