summary:
  ar: "مؤثرة في الأزياء المحتشمة تنشر عبر حسابها «niaamroun» إطلالات بالحجاب والعباية بأسلوب بسيط أحادي الألوان. نشأت في لندن وأقامت في الرياض، وعرّفت بها مجلة هاربرز بازار العربية سنة 2020 بأنها مؤثرة أزياء محتشمة مقيمة في الرياض ولندنية سابقة."
  en: "Modest-fashion influencer who posts hijab and abaya styling in a minimalist, monotone aesthetic under the handle niaamroun. Raised in London and based in Riyadh, she was profiled by Harper's Bazaar Arabia in 2020 as a Riyadh-based modest fashion influencer and former Londoner."
  ur: "مودسٹ فیشن انفلوئنسر جو «niaamroun» کے نام سے حجاب و عبایا کی سادہ، یک رنگ اسٹائلنگ پیش کرتی ہیں۔ لندن میں پلی بڑھیں اور ریاض میں مقیم ہیں؛ ہارپرز بازار عربیہ نے 2020 میں انہیں ریاض نشین مودسٹ فیشن انفلوئنسر اور سابق لندنر کے طور پر متعارف کرایا۔"
  es: "Influencer de moda modesta que publica estilismos con hijab y abaya en una estética minimalista y monocromática bajo el nombre de usuario niaamroun. Criada en Londres y residente en Riad, fue destacada por Harper's Bazaar Arabia en 2020 como influencer de moda modesta radicada en Riad y ex londinense."
  fr: "Influenceuse mode pudique, elle publie des photos de hijabs et d'abayas dans un style minimaliste et monochrome sous le pseudonyme de niaamroun. Ayant grandi à Londres et vivant désormais à Riyad, elle a fait l'objet d'un portrait dans Harper's Bazaar Arabia en 2020, qui la présentait comme une influenceuse mode pudique basée à Riyad et ancienne Londonienne."
  tr: "'niaamroun' hesabında başörtüsü ve abaya takarak sade ve tek renkli bir tarzda görünümler paylaşan mütevazı bir moda fenomenidir. Londra'da büyüdü ve Riyad'da yaşadı. 2020 yılında, Harper's Bazaar Arabic dergisi tarafından Riyad'da yaşayan mütevazı bir moda fenomeni ve eski bir Londralı olarak tanıtıldı."
  id: "Seorang influencer fashion modest yang memposting di akunnya 'niaamroun' mengenakan hijab dan abaya dengan gaya sederhana dan monokrom. Dia tumbuh besar di London dan tinggal di Riyadh. Pada tahun 2020, dia diperkenalkan oleh majalah Harper's Bazaar Arabic sebagai influencer fashion modest yang tinggal di Riyadh dan mantan warga London."
