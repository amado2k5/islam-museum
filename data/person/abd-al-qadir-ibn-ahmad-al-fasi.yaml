id: person/abd-al-qadir-ibn-ahmad-al-fasi
class: person
gender: male
label:
  ar: عبد القادر بن أحمد الفاسي
  en: Abd al-Qadir ibn Ahmad al-Fasi (d. 1219 AH, Maliki scholar)
summary:
  ar: فقيه ونحوي ولغوي ومحدث وأديب من فاس؛ أخذ عن أبي العباس الهلالي وأبي العباس الدلائي وعبد الرحمن المنجرة وغيرهم، وأخذ عنه السلطان أبو الربيع سليمان؛ وصفه صاحب شجرة النور الزكية بالضبط والإتقان؛ من تصانيفه شرح العشرة الثانية من الأربعين النووية ونسب إليه الأرجوزة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
  en: A jurist, grammarian, lexicographer, traditionist and man of letters of Fez; he studied with Abu al-Abbas al-Hilali, Abu al-Abbas al-Dala'i and Abd al-Rahman al-Manjara; Sultan Abu al-Rabi' Sulayman studied with him; he is praised for precision. Works include a commentary on the second ten of al-Nawawi's Forty Hadiths. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
  ur: فاس کے فقیہ، نحوی، لغوی، محدث اور ادیب؛ ابو العباس الہلالی، ابو العباس الدلائی اور عبد الرحمن المنجرۃ سے پڑھا؛ سلطان ابو الربیع سلیمان نے ان سے پڑھا؛ تصانیف میں نووی کی چالیس حدیثوں کی دوسری دہائی کی شرح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
