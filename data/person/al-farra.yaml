label: { ar: "الفراء", en: "Al Farra", fr: "Al-Farra", es: "Al Farra", ur: "الفرا" }
summary:
  ar: "أبو زكريا يحيى بن زياد الفراء الكوفي إمام نحويي الكوفة، قال أبو العباس ثعلب لم يعمل أحد قبله مثله ولا أحسب أن أحدا يزيد عليه، وكان السبب في إملائه الحدود أن جماعة من أصحاب الكسائي صاروا إليه يسألونه الإملاء فلما كان المجلس الثالث قعدوا خشية أن يعلم الصبيان النحو فغضب وقال والله لأملن النحو ما اجتمع اثنان فأملى ذلك سبع عشرة سنة ولم ير في يده كتاب إلا مرة واحدة، وكان يجلس للناس في مسجده إلى جانب منزله وكان يتفلسف في تصانيفه حتى يسلك في ألفاظه كلام الفلاسفة، وكان يجمع طوال دهره فإذا كان آخر السنة خرج إلى الكوفة فأقام بها أربعين يوما يفرق في أهله ما جمعه ويريهم، وتوفي بطريق مكة سنة سبع ومائتين، ومن كتبه معاني القرآن في أربعة أجزاء أملاه في مجالسه من غير نسخة سنة اثنتين وثلاث وأربع ومائتين، وكتاب البهي ألفه لعبد الله بن طاهر، وكتاب اللغات وكتاب الفاخر {cite:fihrist-ibn-al-nadim p. 198-200}."
  en: "Kufan grammarian (d. 207 on the Mecca road) who dictated grammar for seventeen years without a copy {cite:fihrist-ibn-al-nadim}"
  fr: "Grammairien de Koufa (mort en 207 H sur la route de La Mecque) qui dicta la grammaire pendant dix-sept ans sans exemplaire {cite:fihrist-ibn-al-nadim}"
  es: "Gramático de Kufa (fallecido en el año 207 en el camino a La Meca) que dictó gramática durante diecisiete años sin una copia {cite:fihrist-ibn-al-nadim}"
  ur: "کوفان گرامر ⁦(متوفی 207 مکہ روڈ پر)⁩ جس نے سترہ سال تک بغیر کسی نقل کے گرائمر کا حکم دیا۔"
  tr: "Kufa'nın önde gelen dilbilgisi uzmanı Ebu Zekeriya Yahya ibn Ziyad el-Farra' el-Kufi, Ebu el-Abbas Tha'lab tarafından kendisinden önce kimsenin yetişmediği ve kimsenin onu geçemeyeceğine inanılan biri olarak tanımlanmıştır. Dilbilgisi kurallarını dikte etmesinin sebebi, Kisa'i'nin bir grup öğrencisinin ona gelip dikte etmesini istemesiydi. Üçüncü derse gelindiğinde, çocuklara dilbilgisi öğreteceğinden korkarak oturdular. Öfkelenerek, \"Allah'a yemin ederim ki, iki kişi bir araya geldiği sürece dilbilgisi dikte edeceğim\" dedi. On yedi yıl boyunca dikte etti ve bir kez dışında elinde kitapla hiç görülmedi. Evinin yanındaki camisinde insanlara ders verirdi ve yazılarında filozofların dilini bile kullanarak felsefe yapardı. Hayatı boyunca kitap topladı ve yıl sonunda Kufa'ya gider, kırk gün orada kalır, topladığı kitapları ailesine dağıtır ve onlara gösterirdi. Hicri 207 yılında Mekke yolunda vefat etti. Kitapları arasında, Hicri 202, 203 ve 204 yıllarında tek başına, yazılı olarak hazırladığı dört ciltlik “Kur'an'ın Anlamları”; Abdullah ibn Tahir için yazdığı “Bahiy Kitabı”; “Diller Kitabı” ve “Fakhir Kitabı” bulunmaktadır. (198-200)"
  id: "Abu Zakariya Yahya ibn Ziyad al-Farra’ al-Kufi, ahli tata bahasa terkemuka di Kufa, digambarkan oleh Abu al-Abbas Tha’lab sebagai orang yang belum pernah menghasilkan siapa pun seperti dirinya sebelumnya, dan ia percaya tidak ada seorang pun yang dapat melampauinya. Alasan ia mendiktekan aturan tata bahasa adalah karena sekelompok murid al-Kisa’i datang kepadanya meminta untuk didiktekan. Ketika sesi ketiga tiba, mereka duduk, khawatir ia akan mengajar tata bahasa kepada anak-anak. Ia menjadi marah dan berkata, “Demi Allah, aku akan mendiktekan tata bahasa selama ada dua orang yang berkumpul.” Ia mendiktekan selama tujuh belas tahun, dan ia tidak pernah terlihat memegang buku di tangannya kecuali sekali. Ia biasa duduk untuk orang-orang di masjid di sebelah rumahnya, dan ia akan berfilsafat dalam tulisannya, bahkan menggunakan bahasa para filsuf. Ia akan mengumpulkan buku sepanjang hidupnya, dan di akhir tahun, ia akan pergi ke Kufa dan tinggal di sana selama empat puluh hari, membagikan apa yang telah dikumpulkannya kepada keluarganya dan menunjukkannya kepada mereka. Beliau wafat dalam perjalanan ke Mekah pada tahun 207 Hijriah. Di antara buku-bukunya adalah “Makna Al-Qur'an” dalam empat bagian, yang beliau diktekan dalam sesi-sesinya tanpa salinan pada tahun 202, 203, dan 204 Hijriah; “Kitab Al-Bahiy,” yang beliau tulis untuk Abdullah ibn Tahir; “Kitab Bahasa-Bahasa”; dan “Kitab Al-Fakhir.” 198-200}."
