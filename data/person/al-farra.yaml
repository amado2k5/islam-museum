label: { ar: "الفراء", en: "Al Farra" }
summary:
  ar: "أبو زكريا يحيى بن زياد الفراء الكوفي إمام نحويي الكوفة، قال أبو العباس ثعلب لم يعمل أحد قبله مثله ولا أحسب أن أحدا يزيد عليه، وكان السبب في إملائه الحدود أن جماعة من أصحاب الكسائي صاروا إليه يسألونه الإملاء فلما كان المجلس الثالث قعدوا خشية أن يعلم الصبيان النحو فغضب وقال والله لأملن النحو ما اجتمع اثنان فأملى ذلك سبع عشرة سنة ولم ير في يده كتاب إلا مرة واحدة، وكان يجلس للناس في مسجده إلى جانب منزله وكان يتفلسف في تصانيفه حتى يسلك في ألفاظه كلام الفلاسفة، وكان يجمع طوال دهره فإذا كان آخر السنة خرج إلى الكوفة فأقام بها أربعين يوما يفرق في أهله ما جمعه ويريهم، وتوفي بطريق مكة سنة سبع ومائتين، ومن كتبه معاني القرآن في أربعة أجزاء أملاه في مجالسه من غير نسخة سنة اثنتين وثلاث وأربع ومائتين، وكتاب البهي ألفه لعبد الله بن طاهر، وكتاب اللغات وكتاب الفاخر {cite:fihrist-ibn-al-nadim p. 198-200}."
  en: "Kufan grammarian (d. 207 on the Mecca road) who dictated grammar for seventeen years without a copy {cite:fihrist-ibn-al-nadim}"
