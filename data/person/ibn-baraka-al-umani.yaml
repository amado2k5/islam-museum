summary:
  ar: "أبو محمد بن بركة العماني، المعروف بابن بركة، من بلدة بهلة بعُمان، فقيه إباضي وأحد أعيان الحياة السياسية في عمان، ألّف في أصول الفقه وتاريخ عمان، ومن كتبه الديامي والموازنة وسيرة أهل عُمان. {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
  en: "Abu Muhammad b. Baraka al-Umani, commonly called Ibn Baraka, an Ibadi author from the township of Bahla in Oman, who played a considerable part in the political life of Oman and wrote on the principles of law and on the history of Oman. {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
  ur: "ابو محمد بن برکہ العمانی، جو ابن برکہ کے نام سے مشہور ہیں، عمان کے قصبے بہلہ کے اباضی مصنف، جنہوں نے عمان کی سیاسی زندگی میں نمایاں کردار ادا کیا اور اصول فقہ اور عمان کی تاریخ پر لکھا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
