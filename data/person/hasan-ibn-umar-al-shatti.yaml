summary:
  ar: "حسن بن عمر بن معروف الشطي الحنبلي، فقيه فرضي بغدادي الأصل دمشقي المولد والوفاة، ولد سنة 1205 هـ الموافقة 1790 م وتوفي سنة 1274 هـ الموافقة 1858 م."
  en: "Hasan ibn Umar ibn Ma'ruf al-Shatti, a Hanbali jurist and specialist in the law of inheritance, of Baghdadi origin and born and died in Damascus, 1205 to 1274 AH (1790 to 1858 CE)."
  es: "Hasan ibn Umar ibn Ma'ruf al-Shatti, jurista hanbalí y especialista en derecho sucesorio, de origen bagdadí, nacido y fallecido en Damasco entre 1205 y 1274 AH (1790 y 1858 d. C.)."
  fr: "Hasan ibn Umar ibn Ma'ruf al-Shatti, juriste hanbalite et spécialiste du droit successoral, d'origine bagdadienne, né et mort à Damas, de 1205 à 1274 AH (1790 à 1858 CE)."
  ur: "حسن بن عمر بن معرف الشطی، ایک حنبلی فقیہ اور وراثت کے قانون کے ماہر، بغدادی نژاد اور دمشق میں پیدا ہوئے اور وفات پائی، 1205 تا 1274 ہجری ⁦(1790 تا 1858 عیسوی)⁩۔"
  tr: "Hasan ibn Ömer ibn Ma'ruf al-Shatti al-Hanbali, Bağdadî kökenli bir hukukçuydu; Şam'da doğup öldü. 1205 Hicri'nde, yani 1790 yılında doğdu ve 1274 Hicri'de, yani 1858 yılında öldü."
  id: "Hasan ibn Umar ibn Ma'ruf al-Shatti al-Hanbali adalah seorang ahli hukum keturunan Baghdadi, lahir dan meninggal di Damaskus. Ia lahir pada tahun 1205 H, yang bertepatan dengan tahun 1790 M, dan meninggal pada tahun 1274 H, yang bertepatan dengan tahun 1858 M."
