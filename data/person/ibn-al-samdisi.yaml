  ur: "قاہرہ کا نائب قادی جس کے گھر نے طلباء کو پناہ دی تھی۔ d پیر 16 جمادی الثانی 922۔ 472}۔"
  tr: "Şemseddin İbn el-Samdisi el-Masri el-Şafii; Kahire'de geçici yargıçtı, yargıda yardımcı olarak çalıştı ve görev yaptı, evi öğrenciler için bir barınaktı. Dokuz yüz yirmi iki yılında, Cumade'l-Evval'in on altısı Pazartesi günü vefat etti {cite:shadharat-dhahab, s. 472}."
  id: "Shams al-Din Ibn al-Samdisi al-Masri al-Shafi'i; ia adalah hakim sementara di Kairo, bekerja dan menjabat sebagai wakil di bidang peradilan, dan rumahnya menjadi tempat penampungan bagi para pelajar. Ia meninggal pada hari Senin, tanggal enam belas Jumada al-Awwal, tahun sembilan ratus dua puluh dua {cite:shadharat-dhahab, hlm. 472}."
