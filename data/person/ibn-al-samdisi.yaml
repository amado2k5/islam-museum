summary:
  ar: "شمس الدين ابن السمديسي المصري الشافعي؛ كان قاضياً بالنيابة في القاهرة، واشتغل وناب في القضاء وكان بيته مأوى للطلاب؛ توفي يوم الاثنين سادس عشر جمادى الأولى سنة اثنتين وعشرين وتسعمائة {cite:shadharat-dhahab p. 472}."
