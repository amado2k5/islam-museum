summary:
  ar: "أبو إسحاق إبراهيم الهروي، يعرف بستنبة، صحب إبراهيم بن أدهم وكان من أقران أبي يزيد البسطامي، مذكور بالتوكل والتجريد، وتوفي بقزوين بحسب «حلية الأولياء»."
  en: "Abu Ishaq Ibrahim al-Harawi, known as Sitanba, a companion of Ibrahim ibn Adham and a peer of Abu Yazid al-Bistami, noted for trust in God and detachment; he died in Qazvin according to Hilyat al-Awliya."
  ur: "ابو اسحاق ابراہیم ہروی، جو ستنبہ کے نام سے معروف ہیں، ابراہیم بن ادہم کے ساتھی اور ابو یزید بسطامی کے ہم عصر تھے۔ وہ توکل اور تجرید میں مشہور تھے، اور «حلیۃ الاولیاء» کے مطابق قزوین میں فوت ہوئے۔"
  es: "Abu Ishaq Ibrahim al-Harawi, conocido como Sitanba, compañero de Ibrahim ibn Adham y colega de Abu Yazid al-Bistami, se destacó por su fe en Dios y su desapego; murió en Qazvin según Hilyat al-Awliya."
  fr: "Abu Ishaq Ibrahim al-Harawi, connu sous le nom de Sitanba, compagnon d'Ibrahim ibn Adham et pair d'Abu Yazid al-Bistami, réputé pour sa confiance en Dieu et son détachement; il mourut à Qazvin selon Hilyat al-Awliya."
