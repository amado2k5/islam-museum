summary:
  ar: "ضابط وسياسي موريتاني (وُلد 1941) من أطار، شغل رئاسة وزراء موريتانيا (1981–1984، ومجدّدا بالتزامن مع الرئاسة 1984–1992) ثم رئاسة البلاد من 12 ديسمبر 1984 حتى أطاح به انقلاب عسكري في 3 أغسطس 2005 أثناء وجوده خارج البلاد؛ عُرف بخطّه القومي العربي وصلاته الوثيقة بعراق صدام حسين، واستقرّ منفيا في قطر حيث درّس لاحقا في أكاديمية عسكرية."
  en: "Mauritanian military officer and politician (born 1941) from Atar who served as Prime Minister of Mauritania (1981–1984 and, concurrently with the presidency, 1984–1992) and as President of Mauritania from 12 December 1984 until a military coup ousted him on 3 August 2005 while he was abroad; noted for an Arab nationalist line and close ties with Saddam Hussein's Iraq, he settled in exile in Qatar, where he later taught at a military academy."
  ur: "موریتانی فوجی افسر و سیاست دان (پیدائش 1941ء)، اطار سے؛ ملک کے وزیرِ اعظم (1981ء–1984ء، اور صدارت کے ساتھ ساتھ 1984ء–1992ء) اور 12 دسمبر 1984ء تا 3 اگست 2005ء موریتانیہ کے صدر رہے، حتیٰ کہ ان کی غیر حاضری میں فوجی بغاوت نے انھیں ہٹا دیا؛ عرب قوم پرست خط اور صدام حسین کے عراق سے قریبی تعلقات کے لیے معروف؛ قطر میں جلاوطن رہے، جہاں بعد میں ایک فوجی اکادمی میں پڑھایا۔"
