id: person/ibn-al-samani-abd-al-rahim
class: person
label: { ar: "ابن السمعاني" , ur: "عبد الرحیم السمعانی", en: "Abd al-Rahim al-Sam'ani", es: "Abd al-Rahim al-Sam'ani", fr: "Abd al-Rahim al-Sam'ani"}
summary:
  ar: "أبو المظفر فخر الدين عبد الرحيم بن الحافظ أبي سعيد عبد الكريم بن الحافظ أبي بكر محمد بن الإمام أبي المظفر منصور بن محمد الميمي المروزي الشافعي؛ الفقيه المحدث مسند خراسان؛ ولد سنة سبع وثلاثين وخمسمائة وروى كتباً كباراً منها البخاري ومسند أبي عوانة وسنن أبي داود وجامع الترمذي وتاريخ الفسوي ومسند الهيثم بن كليب؛ سمع من وجيه الشحامي وأبي الأسعد القشيري وخلق، ورحَّله أبوه إلى مرو ونيسابور وهراة وبخارا وسمرقند ثم خرج له أبوه معجماً في ثمانية عشر جزءاً؛ وكان مفتياً عارفاً بالمذهب وروى الكثير ورحل الناس إليه وسمع منه الحافظ أبو بكر الحازمي وحدث عنه ابن الصلاح والضياء المقدسي والزكي البرزالي والمحب بن النجار وخرج لنفسه أربعين حديثاً وانتهت إليه رياسة الشافعية ببلده وخُتم به البيت السمعاني؛ عُدم في دخول التتار في آخر العام فيما ذكر ابن العماد {cite:shadharat-dhahab p. 75-76}."
  ur: "مرو کے شافعی فقیہ اور محدث، عبد الکریم السمعانی کے بیٹے؛ اپنے والد کے ساتھ علمی سفر کیے اور خراسان میں روایتِ حدیث سے وابستہ رہے۔ {cite:shadharat-dhahab}"
  en: "A Shafi'i jurist and hadith scholar of Marw, son of Abd al-Karim al-Sam'ani; he travelled with his father and became a transmitter in Khurasan. {cite:shadharat-dhahab}"
  es: "Jurista shafi'í y erudito de hadices de Marw, hijo de Abd al-Karim al-Sam'ani; viajó con su padre y se convirtió en transmisor en Jorasán. {cite:shadharat-dhahab}"
  fr: "Juriste chaféite et spécialiste du hadith de Marw, fils d'Abd al-Karim al-Sam'ani, il voyagea avec son père et devint transmetteur au Khorasan. {cite:shadharat-dhahab}"
  tr: "Ebu el-Muzaffer Fakhr al-Din Abdülrahim bin Hafiz Ebu Seyid Abdülkerim ibn el-Hafiz Ebu Bekir Muhammed bin İmam Ebu el-Muzaffar Mansur bin Muhammed el-Mimi el-Marwazi el-Şafi'i; fahhih ve hadis âlimi Musnad Horasan; 537 Hicri yılında doğmuş ve el-Buhari, Musnad Ebu Awanah, Sunan Ebu Davud, Cami'li-Tirmidi, Tarih el-Fasavi ve Musnad el-Heytham ibn Kulayb gibi önemli kitapları anlatmıştır; önemli isimler el-Shahemi ve Ebu el-Esed el-Kuşayri gibi isimlerden dinlemiştir. Babası Merv, Nişapur, Herat, Buhara, Buhara ve Semerkand'a seyahat etti, ardından babası onun peşine düştü On sekiz ciltlik bir sözlük; okulda bilgili bir müftiydi ve ona birçok rivayet anlattı. İnsanlar ona geldi ve hadis âlimi Ebu Bekir el-Hazmi ondan haber aldı. İbn el-Selah, el-Diya el-Makdisi, el-Zaki el-Barzali ve el-Muhibb ibn el-Necer ondan rivayet etti. Kendisi için kırk hadis yazdı ve kasabasındaki Şafi'lerin başı oldu, Sam'ani evini mühürledi; yıl sonunda Tatarların girişi olmadı, İbn el-İmad'ın da belirttiği gibi {cite:shadharat-dhahab, s. 75-76}."
  id: "Abu al-Muzaffar Fakhr al-Din Abd al-Rahim ibn al-Hafiz Abu Sa'id Abd al-Karim ibn al-Hafiz Abu Bakr Muhammad ibn Imam Abu al-Muzaffar Mansur ibn Muhammad al-Mimi al-Marwazi al-Shafi'i; ahli hukum dan ulama hadis Musnad Khurasan; lahir pada tahun 537 H dan menceritakan buku-buku besar termasuk al-Bukhari, Musnad Abu Awanah, Sunan Abu Dawood, Jami' al-Tirmidhi, Tarikh al-Fasawi, dan Musnad al-Haytham ibn Kulayb; ia mendengar dari tokoh-tokoh terkenal al-Shahami dan Abu al-As'ad al-Qushayri, serta lainnya. Ayahnya melakukan perjalanan ke Marw, Nishapur, Herat, Bukhara, dan Samarkand, lalu ayahnya berangkat kepadanya Kamus dalam delapan belas jilid; ia adalah seorang mufti yang berpengetahuan dalam aliran dan menceritakan banyak riwayat kepadanya. Orang-orang datang kepadanya, dan ulama hadis Abu Bakr al-Hazmi mendengar kabar darinya. Ibn al-Salah, al-Diya al-Maqdisi, al-Zaki al-Barzali, dan al-Muhibb ibn al-Najjar menceritakan darinya. Ia membuat empat puluh hadis untuk dirinya sendiri, dan menjadi kepala para Shafi'i di kotanya, serta menyegel rumah Sam'ani dengan hadis itu; tidak ada catatan Tatar pada akhir tahun, seperti yang disebutkan oleh Ibn al-Imad {cite:shadharat-dhahab, hlm. 75-76}."
