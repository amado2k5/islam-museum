id: person/ibn-al-samani-abd-al-rahim
class: person
label: { ar: "ابن السمعاني" }
summary:
  ar: "أبو المظفر فخر الدين عبد الرحيم بن الحافظ أبي سعيد عبد الكريم بن الحافظ أبي بكر محمد بن الإمام أبي المظفر منصور بن محمد الميمي المروزي الشافعي؛ الفقيه المحدث مسند خراسان؛ ولد سنة سبع وثلاثين وخمسمائة وروى كتباً كباراً منها البخاري ومسند أبي عوانة وسنن أبي داود وجامع الترمذي وتاريخ الفسوي ومسند الهيثم بن كليب؛ سمع من وجيه الشحامي وأبي الأسعد القشيري وخلق، ورحَّله أبوه إلى مرو ونيسابور وهراة وبخارا وسمرقند ثم خرج له أبوه معجماً في ثمانية عشر جزءاً؛ وكان مفتياً عارفاً بالمذهب وروى الكثير ورحل الناس إليه وسمع منه الحافظ أبو بكر الحازمي وحدث عنه ابن الصلاح والضياء المقدسي والزكي البرزالي والمحب بن النجار وخرج لنفسه أربعين حديثاً وانتهت إليه رياسة الشافعية ببلده وخُتم به البيت السمعاني؛ عُدم في دخول التتار في آخر العام فيما ذكر ابن العماد {cite:shadharat-dhahab p. 75-76}."
