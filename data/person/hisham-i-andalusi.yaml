id: person/hisham-i-andalusi
class: person
label: { ar: "هشام الأول بن عبد الرحمن الداخل" }
summary:
  ar: "ثاني أمراء بني أمية بقرطبة ⁦(سنة ١٧٢–١٨٠هـ)⁩؛ كان إذا حضر مجلساً امتلأ أدباً وتاريخاً وذكراً لأمور الحرب، ولما ولي أشخص المنجم الضبي من الجزيرة الخضراء فقال له إن مدته ثمانية أعوام أو نحوها فقال: لو أن هذه المدة كانت في سجدة لله تعالى لقلت طاعة له، وزهد في الدنيا والتزم أفعال البر {cite:nafh-tib-maqqari pp. 372–373}. ومن محاسنه إكمال بناء جامع قرطبة الذي شرع فيه أبوه، وتجديد قنطرة قرطبة التي يضرب بها المثل — فلما قيل له إن الناس يقولون ما بناها إلا ليمضي عليها إلى صيده آلى على نفسه أن لا يسلك عليها فلم يمر عليها بعد — وإخراج المصدق لأخذ الزكاة على الكتاب والسنة؛ وكان من أهل الخير والصلاح كثير الغزو والجهاد، توفي سنة ١٨٠هـ وعمره أربعون سنة {cite:nafh-tib-maqqari p. 374}."
  en: "Second Umayyad emir of Córdoba (AH 172–180): when the astrologer al-Dabbi foretold an eight-year reign he answered 'were those years one prostration to God I would call it obedience' and turned to piety; he finished his father's Great Mosque, rebuilt Córdoba's proverbial bridge — then swore never to cross it when told the people said it was for his hunting — and set zakāt collection on the Book and the Sunna {cite:nafh-tib-maqqari pp. 372–374}."
  es: "Segundo emir omeya de Córdoba (AH 172–180): cuando el astrólogo al-Dabbi predijo un reinado de ocho años, respondió: «Si esos años fueran una postración a Dios, la llamaría obediencia» y se volcó a la piedad; terminó la Gran Mezquita de su padre, reconstruyó el proverbial puente de Córdoba —y juró no volver a cruzarlo cuando le dijeron que la gente afirmaba que era para su caza— y estableció la recaudación del zakat en el Libro y la Sunna {cite:nafh-tib-maqqari pp. 372–374}."
  fr: "Le deuxième émir omeyyade de Cordoue (172-180 AH): lorsque l'astrologue al-Dabbi lui prédit un règne de huit ans, il répondit: « Si ces années étaient une seule prosternation à Dieu, j'appellerais cela de l'obéissance », et se tourna vers la piété; il acheva la Grande Mosquée de son père, reconstruisit le pont proverbial de Cordoue — puis jura de ne jamais le traverser lorsqu'on lui dit que les gens disaient qu'il servait à sa chasse — et fixa la collecte de la zakāt sur le Livre et la Sunna {cite: nafh-tib-maqqari pp. 372-374}."
  ur: "قرطبہ کا دوسرا اموی امیر ⁦(ہجری 172-180)⁩: جب نجومی الدبی نے آٹھ سالہ دور حکومت کی پیشین گوئی کی تو اس نے جواب دیا کہ 'اگر وہ سال خدا کے لیے ایک سجدہ ہوں تو میں اسے اطاعت کہوں گا' اور تقویٰ کی طرف متوجہ ہوا۔ اس نے اپنے والد کی عظیم مسجد کو ختم کیا، قرطبہ کے ضرب المثل پل کو دوبارہ تعمیر کیا - پھر جب لوگوں کو بتایا کہ یہ اس کے شکار کے لیے ہے تو اسے کبھی عبور نہ کرنے کی قسم کھائی - اور کتاب و سنت پر زکوٰۃ جمع کی {حوالہ: نفح تبع مقری صفحہ 372-374}۔"
  tr: "Kordoba'daki ikinci Emevi prensi (172–180 H) her toplantıya katıldığında edebiyat, tarih ve savaş konularından bahsederek dolup taşırdı. Göreve başladığında, Algeciras'tan madenci Al-Dhubi'yi atadı ve görev süresinin yaklaşık sekiz yıl olduğunu söyledi. O da şöyle yanıt verdi: Eğer bu dönem Allah'a secde olsaydı, O'na daha az itaat ederdim. Bu dünyada münzevi oldu ve doğru işlere kendini adadı {cite:nafh-tib-maqqari s. 372–373}. Başarıları arasında, babasının başlattığı Kordoba Camii'nin inşaatını tamamlamak ve örnek olan Kordoba köprüsünü yenilemek vardı — insanlar köprüyü sadece avlanmak için inşa ettiğini söylediğinde, üzerinde yürümemeye karar verdi ve henüz yanından geçmedi — ayrıca Kitap ve Sünnet'e göre zekat toplamak için el-Müsadaq verdi. İyi ve doğru insanlardan biriydi, sık sık savaşlara ve cihhatta katıldı, 180 Hicri'de kırk yaşında öldü {atıf:nafh-tib-maqqari, s. 374}."
  id: "Pangeran Umayyah kedua di Cordoba (172–180 H); setiap kali menghadiri pertemuan, ia dipenuhi dengan sastra, sejarah, dan pembahasan tentang urusan perang. Saat menjabat, ia mengangkat penambang Al-Dhubi dari Algeciras dan memberitahunya masa jabatannya sekitar delapan tahun. Ia menjawab: Jika masa ini adalah sujud kepada Tuhan Yang Maha Kuasa, saya akan kurang taat kepada-Nya. Ia menjadi pertapa di dunia ini dan berkomitmen pada perbuatan benar {cite:nafh-tib-maqqari hlm. 372–373}. Di antara jasa-jasanya adalah menyelesaikan pembangunan Masjid Cordoba, yang dimulai oleh ayahnya, dan merenovasi jembatan Cordoba, yang merupakan model — ketika diberitahu bahwa orang-orang mengatakan dia membangunnya hanya untuk berburu, dia memutuskan untuk tidak berjalan di atasnya dan belum melewatinya — dan dia memberikan al-Musadaq untuk mengumpulkan zakat sesuai Kitab dan Sunnah. Dia termasuk di antara orang-orang baik dan benar, sering terlibat dalam pertempuran dan jihad, meninggal pada tahun 180 H pada usia empat puluh {cite:nafh-tib-maqqari, hlm. 374}."
