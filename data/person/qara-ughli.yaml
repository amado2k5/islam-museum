summary:
  ar: "المولى قرا أوغلي الحنفي أحد موالي الروم؛ قال صاحب الشقائق: كان من عتقاء السيد إبراهيم الأماسي فقرأ على مولاه المذكور ثم درس ببعض نواحي أماسية ثم بمدرسة أماسية ثم بأبي أيوب الأنصاري ثم بإحدى الثمانية ثم أُعطي قضاء دمشق ودخلها سنة أربعين وهو شيخ كبير، وكان الغالب عليه محبة الصوفية والفقراء ونادى بدمشق أن لا تخرج امرأة ولا طفلة إلى الأسواق، وكان محباً للعلماء وقوراً صاحب شيبة حسنة صحيح العقيدة محمود الطريقة أديباً لبيباً؛ وقال ابن طولون بعد أن وصفه بالعلامة: وكان منور الشيبة محباً للصالحين غير أن فوق يده أيدياً فكان ذلك يمنعه من سماع كلمته ونفوذ أمره؛ وتوفي وهو قاضٍ بدمشق يوم الثلاثاء حادي عشر ذي الحجة ودُفن بباب الصغير عند سيدي بلال {cite:shadharat-dhahab p. 660-661}."
  en: "The freedman of Ibrahim al-Amasi who became qadi of Damascus in 940 — a lover of Sufis and scholars who proclaimed that no woman or girl go out to the markets; 'of handsome grey hair, sound doctrine, literate and wise' — though 'hands above his hand' curbed his word's reach; died Tuesday 11 Dhu'l-Hijja [941] in office, Bab al-Saghir beside Sidi Bilal {cite:shadharat-dhahab p. 660-661}."
