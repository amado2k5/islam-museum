summary:
  ar: "المولى قرا أوغلي الحنفي أحد موالي الروم؛ قال صاحب الشقائق: كان من عتقاء السيد إبراهيم الأماسي فقرأ على مولاه المذكور ثم درس ببعض نواحي أماسية ثم بمدرسة أماسية ثم بأبي أيوب الأنصاري ثم بإحدى الثمانية ثم أُعطي قضاء دمشق ودخلها سنة أربعين وهو شيخ كبير، وكان الغالب عليه محبة الصوفية والفقراء ونادى بدمشق أن لا تخرج امرأة ولا طفلة إلى الأسواق، وكان محباً للعلماء وقوراً صاحب شيبة حسنة صحيح العقيدة محمود الطريقة أديباً لبيباً؛ وقال ابن طولون بعد أن وصفه بالعلامة: وكان منور الشيبة محباً للصالحين غير أن فوق يده أيدياً فكان ذلك يمنعه من سماع كلمته ونفوذ أمره؛ وتوفي وهو قاضٍ بدمشق يوم الثلاثاء حادي عشر ذي الحجة ودُفن بباب الصغير عند سيدي بلال {cite:shadharat-dhahab p. 660-661}."
  en: "The freedman of Ibrahim al-Amasi who became qadi of Damascus in 940 — a lover of Sufis and scholars who proclaimed that no woman or girl go out to the markets; 'of handsome grey hair, sound doctrine, literate and wise' — though 'hands above his hand' curbed his word's reach; died Tuesday 11 Dhu'l-Hijja [941] in office, Bab al-Saghir beside Sidi Bilal {cite:shadharat-dhahab p. 660-661}."
  es: "El liberto de Ibrahim al-Amasi que se convirtió en cadí de Damasco en 940 —amante de los sufíes y los eruditos que proclamó que ninguna mujer ni niña saliera a los mercados; \"de hermoso cabello gris, sana doctrina, letrado y sabio\"— aunque \"manos sobre su mano\" limitaron el alcance de su palabra; murió el martes 11 de Dhu'l-Hijja [941] en el cargo, Bab al-Saghir junto a Sidi Bilal {cita: shadharat-dhahab pág. 660-661}."
  fr: "L'affranchi d'Ibrahim al-Amasi, devenu cadi de Damas en 940 — un amoureux des soufis et des érudits qui proclamait qu'aucune femme ni fille ne devait sortir sur les marchés; « aux beaux cheveux gris, à la doctrine saine, lettré et sage » — bien que « les mains au-dessus de sa main » aient limité la portée de sa parole; est décédé le mardi 11 Dhu'l-Hijja [941] en fonction, Bab al-Saghir à côté de Sidi Bilal {cite: shadharat-dhahab p. 660-661}."
  ur: "ابراہیم العماسی کا آزاد کرنے والا جو 940 میں دمشق کا قاضی بنا - صوفیاء اور علماء کا عاشق جس نے اعلان کیا کہ کوئی عورت یا لڑکی بازاروں میں نہیں نکلنی چاہیے۔ 'خوبصورت سرمئی بالوں کا، صحیح نظریہ، پڑھا لکھا اور عقلمند' - اگرچہ 'ہاتھ کے اوپر ہاتھ' نے اس کے لفظ کی پہنچ کو روک دیا۔ منگل 11 ذی الحجہ [941] کو باب الصغیر میں سیدی بلال کے پاس انتقال ہوا۔ 660-661}۔"
  tr: "Mawla Qaraoghli al-Hanafi, Romalıların özgür bırakılanlarından biriydi; Al-Shaqaiq'in yazarı şöyle demiştir: Seyyid İbrahim El-Amasi'nin özgür bırakılmış adamlarından biriydi, bu yüzden bahsettiği ustasının yanında çalıştı, sonra Amasiya'nın bazı bölgelerinde, sonra Amasiya okulunda, sonra Abu Eyyub Al-Ansari'de, sonra sekizden birinde eğitim gördü. Sonra Şam'ın yargıcı olarak atandı ve 40 Hicri yılında büyük bir şeyh olarak girdi. Çoğunlukla Sufiler ve yoksullar tarafından sevildi ve Şam'da ne kadınların ne de kızların pazara çıkmaması gerektiğini söyledi. Alimleri severdi, onurluydu, iyi yaşlıydı, inançlıydı ve tarikatın saygın bir figürü, edebiyatçı ve soylu bir adamdı; ve şöyle dedi: İbn Tulun, onu bir alim olarak tanımladıktan sonra: Parlak yaşlıydı ve doğruları severdi, ancak elleri elinin üzerinde olduğu için sözünü duymasını ve emrini yerine getirmesini engelliyordu; Zulhicce ayının on birinci Salı günü Şam'da yargıç olarak görev yaparken öldü ve Sidi Bilal yakınlarındaki Bab al-Saghir'de defnedildi {atıf: shadharat-dhahab, s. 660-661}."
  id: "Mawla Qaraoghli al-Hanafi adalah salah satu mantan Romawi; penulis Al-Shaqaiq berkata: Dia adalah salah satu orang yang dibebaskan dari Sayyid Ibrahim Al-Amasi, jadi dia belajar di bawah gurunya yang disebutkan tadi, kemudian belajar di beberapa daerah Amasiya, kemudian di sekolah Amasiya, kemudian di Abu Ayyub Al-Ansari, kemudian di salah satu dari delapan sekolah. Kemudian dia diangkat sebagai hakim Damaskus dan masuk ke sana pada tahun 40 H, seorang sheikh besar. Dia terutama dicintai oleh para Sufi dan orang miskin, dan dia menyerukan kepada Damaskus agar wanita maupun gadis tidak pergi ke pasar. Dia mencintai para cendekiawan, bermartabat, memiliki usia tua yang baik, beriman, dan merupakan sosok yang dihormati dalam ordo, seorang sastra, dan pria yang mulia; dan dia berkata Ibn Tulun, setelah menggambarkannya sebagai seorang cendekiawan: Ia adalah tetua yang bersinar dan mengasihi orang benar, tetapi tangannya di atas tangannya, yang membuatnya tidak dapat mendengar kata-katanya dan menegakkan perintahnya; ia meninggal saat bertugas sebagai hakim di Damaskus pada hari Selasa, tanggal sebelas Dhu al-Hijjah, dan dimakamkan di Bab al-Saghir dekat Sidi Bilal {cite:shadharat-dhahab, hlm. 660-661}."
