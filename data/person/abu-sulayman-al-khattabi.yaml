summary:
  ar: "حمد بن محمد بن إبراهيم بن الخطاب البستي، أبو سليمان الخطابي ⁦(319–388هـ)⁩، من ولد زيد بن الخطاب، محدث فقيه أديب لغوي شاعر من بست في بلاد كابل؛ أخذ اللغة والأدب عن أبي عمر الزاهد وإسماعيل الصفار وأبي جعفر الرزاز، والفقه عن القفال الشاشي، وروى عنه الحاكم النيسابوري، وصنّف «معالم السنن» على سنن أبي داود و«أعلام السنن» على البخاري و«غريب الحديث» وغيرها {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13-14}."
  en: "Hamd ibn Muhammad ibn Ibrahim ibn al-Khattab of Bust, Abu Sulayman al-Khattabi (319–388 AH), a descendant of Zayd ibn al-Khattab, was a hadith scholar, jurist, man of letters, philologist and poet from Bust in the land of Kabul; he learned language and letters from Abu 'Umar al-Zahid, Isma'il al-Saffar and Abu Ja'far al-Razzaz and law from al-Qaffal al-Shashi, al-Hakim al-Nisaburi transmitted from him, and he wrote Ma'alim al-Sunan on Abu Dawud's Sunan, A'lam al-Sunan on al-Bukhari, Gharib al-Hadith and other works {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13-14}."
  ur: "حمد بن محمد بن ابراہیم بن الخطاب بستی، ابو سلیمان خطابی (319–388ھ)، زید بن الخطاب کی اولاد سے، کابل کے علاقے بست کے محدث، فقیہ، ادیب، لغوی اور شاعر؛ انہوں نے لغت و ادب ابو عمر الزاہد، اسماعیل الصفار اور ابو جعفر الرزاز سے اور فقہ قفال شاشی سے حاصل کی، حاکم نیشاپوری نے ان سے روایت کی، اور انہوں نے سنن ابی داؤد پر «معالم السنن»، بخاری پر «اعلام السنن»، «غریب الحدیث» وغیرہ تصنیف کیں {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 13-14}۔"
