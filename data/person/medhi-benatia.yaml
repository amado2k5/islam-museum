  ar: "مدافع مغربي معتزل (وُلد سنة 1987 في كوركورون بفرنسا لأب مغربي وأم جزائرية)، لعب لأندية أودينيزي وروما وبايرن ميونخ ويوفنتوس، وقاد منتخب المغرب في كأس العالم 2018، ثم عمل مديراً رياضياً لنادي مرسيليا."
