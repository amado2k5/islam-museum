summary:
  ar: "أحد أبناء الخليفة هشام بن عبد الملك الذين تولّوا قيادة الغزوات؛ يذكر الكتاب أن للغزوات في عهد هشام نصيباً كبيراً من أبنائه، وأن لمعاوية بن هشام القدر الأكبر من ذلك {cite:salabi-umayyad-state-2020 p.470}. وكان الزهري قد تولى تربية أبناء هشام وتعليمهم منذ الصغر {cite:salabi-umayyad-state-2020 p.470}."
  tr: "Halife Hisham ibn Abd al-Malik'in oğullarından biri olan ve seferleri yöneten Edülmelik; kitap, Hisham'ın saltanatı sırasında yapılan seferlerin önemli bir payının oğullarının da olduğunu ve Muaviye bin Hisham'ın bu seferde en büyük paya sahip olduğunu belirtir {cite:salabi-umayyad-state-2020 s.470}. Al-Zuhri, Hisham'ın oğullarını küçük yaşlardan itibaren yetiştirip yetiştirmekten sorumluydu {cite:selabi-umayyad-state-2020 s.470}."
  id: "Salah satu putra Khalifah Hisham ibn Abd al-Malik yang memimpin kampanye; buku tersebut menyebutkan bahwa kampanye selama masa pemerintahan Hisham memiliki bagian signifikan dari putra-putranya, dan Muawiya ibn Hisham memiliki bagian terbesar dari itu {cite:salabi-umayyad-state-2020 hlm.470}. Al-Zuhri bertanggung jawab membesarkan dan mendidik putra-putra Hisham sejak kecil {cite:salabi-umayyad-state-2020 hlm.470}."
