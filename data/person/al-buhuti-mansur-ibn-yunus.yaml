summary:
  ar: "فقيه حنبلي، كان شيخ الحنابلة بمصر في عصره، نُسب إلى بُهوت في غربية مصر، وصنّف الكثير في الفقه الحنبلي وجمع إلى ذلك التفسير والأصول والفرائض."
  en: "Hanbali jurist, shaykh of the Hanbalis in Egypt in his time, named after Buhut in the Gharbiyya province; wrote extensively on Hanbali law and also on exegesis, legal theory and inheritance; born 1000 AH (1591 CE), died 1051 AH (1641 CE)."
  fr: "Juriste hanbalite, cheikh des hanbalites d’Égypte en son temps, dont la nisba vient de Buhut dans la province de Gharbiyya ; auteur de nombreux écrits en droit hanbalite, ainsi qu’en exégèse, théorie juridique et successions ; né en 1000 H (1591 ap. J.-C.), mort en 1051 H (1641 ap. J.-C.)."
  es: "Jurista hanbalí, jeque de los hanbalíes en Egipto en su época, recibió su nombre de Buhut en la provincia de Gharbiyya; escribió extensamente sobre derecho hanbalí y también sobre exégesis, teoría jurídica y herencia; nació en el año 1000 de la Hégira (1591 d. C.) y murió en el año 1051 de la Hégira (1641 d. C.)."
  ur: "حنبلی فقیہ، اپنے زمانے میں مصر میں حنبلیوں کے شیخ، صوبہ غربیہ میں بوہت کے نام سے منسوب؛ حنبلی قانون اور تفسیر، قانونی نظریہ اور وراثت پر بھی وسیع پیمانے پر لکھا۔ پیدائش 1000ھ ⁦(1591ء)⁩، وفات 1051ھ ⁦(1641ء)⁩۔"
