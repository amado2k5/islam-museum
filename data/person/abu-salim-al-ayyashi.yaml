summary:
  ar: "أبو سالم عبد الله بن محمد العياشي، عالم صوفي من أيت عياش في أطلس المغرب، وصاحب رحلة «ماء الموائد»، توفي بالطاعون في 10 ذي القعدة 1090هـ ⁦(1679م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 844}."
  en: "Abu Salim 'Abd Allah al-'Ayyashi, Sufi scholar of the Ayt 'Ayyash in the Moroccan Atlas and author of the Rihla Ma' al-Mawa'id; he died in the plague on 10 Dhu l-Qa'da 1090 AH (1679) {cite:encyclopaedia-of-islam-2 vol. 1 p. 844}."
  fr: "Abu Salim 'Abd Allah al-'Ayyashi, savant soufi des Ayt 'Ayyash de l'Atlas marocain et auteur de la Rihla Ma' al-Mawa'id ; il mourut de la peste le 10 dhou al-qi'da 1090 H (1679) {cite:encyclopaedia-of-islam-2 vol. 1 p. 844}."
  es: "Abu Salim 'Abd Allah al-'Ayyashi, erudito sufí del Ayt 'Ayyash en el Atlas Marroquí y autor del Rihla Ma' al-Mawa'id; murió de peste el 10 de Dhu l-Qa'da de 1090 AH (1679) {cite:encyclopaedia-of-islam-2 vol. 1 p. 844}."
  ur: "ابو سلیم عبد اللہ العیاشی، مراکش کے اطلس میں آیت عیاش کے صوفی عالم اور رحلہ مع الموائد کے مصنف؛ آپ کی وفات طاعون میں 10 ذی القعدہ 1090ھ (1679) کو ہوئی۔ 1 ص۔ 844}۔"
