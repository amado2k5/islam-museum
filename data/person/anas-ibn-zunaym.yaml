summary:
  ar: "أنس بن زنيم؛ ركب مع أبي الأسود الدؤلي وفيل مولى زياد وهو على برذون هملاج فألغز أبا الأسود فقال على الثلثين من حمام فيل لعمر أبيك ما حمام كسرى."
  en: "Anas ibn Zunaym; riding with Abu al-Aswad and Fil — he posed the bathhouse riddle 'two-thirds of Fil's bath: by your father, Kisra's bath is naught'."
  es: "Anas ibn Zunaym, que viajaba con Abu al-Aswad y Fil, planteó la adivinanza de los baños públicos: \"Dos tercios del baño de Fil: ¡Por tu padre, el baño de Kisra no vale nada!\"."
  fr: "Anas ibn Zunaym; chevauchant avec Abu al-Aswad et Fil — il posa l'énigme du bain: « les deux tiers du bain de Fil: par ton père, le bain de Kisra ne vaut rien »."
  ur: "انس بن زنیم؛ ابو الاسود اور فل کے ساتھ سواری کرتے ہوئے - اس نے غسل خانہ کی پہیلی 'فل کے غسل کا دو تہائی حصہ: تمہارے والد کی قسم، کسریٰ کا غسل کچھ نہیں ہے'۔"
  tr: "Anas ibn Zanim, Ebu el-Esvad el-Du'ali ve Ziyad'ın özgür adamı Fil ile birlikte Bardun Hamlaj'a binerken Ebu el-Esvad'ı şaşırttı ve dedi ki: Babanızın Ömeri için fil banyosunun yaklaşık üçte ikisi, Hosrov'un banyosu nedir?"
  id: "Anas ibn Zanim menunggang bersama Abu al-Aswad al-Du'ali dan Gajah, mantan Ziyad, saat ia menunggang Bardun Hamlaj dan membingungkan Abu al-Aswad sambil berkata: Sekitar dua pertiga dari pemandian gajah untuk Umar milik ayahmu, apa itu mandi Khosrow?"
