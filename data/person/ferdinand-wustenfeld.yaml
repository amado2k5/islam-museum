  ar: "ناشر «معجم ما استعجم» للبكري عن أربع مخطوطات أوروبية، طُبع جزؤه الأول في غوتنغن وباريس سنة 1876م، وكتب له مقدمة ألمانية يروي فيها كيف نسخ مخطوطة ليدن بنفسه، وأتم نسخ جزئها الثاني في «الأيام المضطربة من سنة 1848» {cite:mujam-ma-istaajam-bakri p.5} {cite:mujam-ma-istaajam-bakri p.9}."
