summary:
  ar: "ناشر «معجم ما استعجم» للبكري عن أربع مخطوطات أوروبية، طُبع جزؤه الأول في غوتنغن وباريس سنة 1876م، وكتب له مقدمة ألمانية يروي فيها كيف نسخ مخطوطة ليدن بنفسه، وأتم نسخ جزئها الثاني في «الأيام المضطربة من سنة 1848» {cite:mujam-ma-istaajam-bakri p.5} {cite:mujam-ma-istaajam-bakri p.9}."
  en: "Editor of al-Bakri's Mu'jam ma sta'jam from four European manuscripts, whose first volume appeared in Göttingen and Paris in 1876, with a German preface telling how he copied the Leiden manuscript himself, finishing its second part «in the troubled days of the year 1848»."
  es: "Editor del Mu'jam ma sta'jam de al-Bakri, basado en cuatro manuscritos europeos, cuyo primer volumen apareció en Göttingen y París en 1876, con un prefacio en alemán que cuenta cómo copió él mismo el manuscrito de Leiden, terminando su segunda parte «en los turbulentos días del año 1848»."
  fr: "Éditeur du Mu'jam ma sta'jam d'al-Bakri à partir de quatre manuscrits européens, dont le premier volume est paru à Göttingen et à Paris en 1876, avec une préface en allemand expliquant comment il a copié lui-même le manuscrit de Leiden, achevant sa deuxième partie « dans les jours troublés de l'année 1848 »."
  ur: "چار یورپی مخطوطات میں سے البکری کے معجم ما استجام کے مدیر، جس کی پہلی جلد 1876 میں گوٹنگن اور پیرس میں شائع ہوئی، ایک جرمن دیباچہ کے ساتھ یہ بتایا گیا کہ کس طرح اس نے خود لیڈن مخطوطہ کو نقل کیا، اس کا دوسرا حصہ «سال 1848 کے مشکل دنوں میں» ختم کیا۔"
