label: { ar: "حافظ إبراهيم بن نور الله (خطاط لكهنؤ)", en: "Hafiz Ibrahim ibn Nurullah (calligrapher of Lucknow)", ur: "حافظ ابراہیم بن نور اللہ (لکھنؤ کے خطاط)" }
summary:
  ar: "خطاط نستعليق من لكهنؤ، ابن حافظ نور الله وتلميذه، أتم «گلستان» أبيه حتى عسر التمييز بين الخطين، وأدخل الدوائر البيضاوية في النستعليق {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
  en: "Nasta'liq calligrapher of Lucknow, son and pupil of Hafiz Nurullah, who completed his father's Gulistan so closely that critics could hardly tell the hands apart, and introduced elliptical bowls into nasta'liq {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
  ur: "لکھنؤ کے نستعلیق خطاط، حافظ نور اللہ کے بیٹے اور شاگرد، جنہوں نے اپنے والد کی «گلستان» ایسی مکمل کی کہ دونوں خطوں میں تمیز مشکل ہو گئی، اور نستعلیق میں بیضوی دوائر رائج کیے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}۔"
