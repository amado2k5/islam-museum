label: { ar: "حافظ إبراهيم بن نور الله ⁦(خطاط لكهنؤ)⁩", en: "Hafiz Ibrahim ibn Nurullah (calligrapher of Lucknow)", ur: "حافظ ابراہیم بن نور اللہ ⁦(لکھنؤ کے خطاط)⁩", es: "Hafiz Ibrahim ibn Nurullah (calligrapher of Lucknow)", fr: "Hafiz Ibrahim ibn Nurullah (calligrapher of Lucknow)" }
summary:
  ar: "خطاط نستعليق من لكهنؤ، ابن حافظ نور الله وتلميذه، أتم «گلستان» أبيه حتى عسر التمييز بين الخطين، وأدخل الدوائر البيضاوية في النستعليق {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
  en: "Nasta'liq calligrapher of Lucknow, son and pupil of Hafiz Nurullah, who completed his father's Gulistan so closely that critics could hardly tell the hands apart, and introduced elliptical bowls into nasta'liq {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
  ur: "لکھنؤ کے نستعلیق خطاط، حافظ نور اللہ کے بیٹے اور شاگرد، جنہوں نے اپنے والد کی «گلستان» ایسی مکمل کی کہ دونوں خطوں میں تمیز مشکل ہو گئی، اور نستعلیق میں بیضوی دوائر رائج کیے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}۔"
  es: "Calígrafo Nasta'liq de Lucknow, hijo y alumno de Hafiz Nurullah, que completó el Gulistan de su padre con tanta precisión que los críticos apenas podían distinguir las letras, e introdujo cuencos elípticos en el nasta'liq {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
  fr: "Calligraphe Nasta'liq de Lucknow, fils et élève de Hafiz Nurullah, qui a achevé le Gulistan de son père de manière si proche que les critiques pouvaient à peine distinguer les mains, et a introduit des bols elliptiques dans le nasta'liq {cite:salim-tarikh-khatt-o-khattatin-2001 p. 265}."
