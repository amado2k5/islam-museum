summary:
  ar: "كاتب وشاعر ومؤرخ وسياسي لبناني (1869–1946)، أمير من آل أرسلان، لُقّب «أمير البيان» لغزارة كتابته؛ من دعاة الجامعة الإسلامية والوحدة العربية، قضى سنوات المنفى في جنيف ممثلاً غير رسمي لسورية وفلسطين لدى عصبة الأمم، ومن أشهر كتبه «لماذا تأخر المسلمون وتقدم غيرهم؟»."
  en: "Lebanese writer, poet, historian and politician (1869–1946), an emir of the Arslan family nicknamed Amir al-Bayan (Prince of Eloquence) for his prolific pen; an advocate of Islamic unity and Arab unity who spent his exile years in Geneva as the unofficial representative of Syria and Palestine to the League of Nations. His best-known book asks why the Muslims declined while others advanced."
  ur: "لبنانی مصنف، شاعر، مؤرخ اور سیاست دان (1869–1946)، آل ارسلان کے امیر، اپنی پُراثر تحریروں کی وجہ سے «امیر البیان» کہلائے؛ اسلامی وحدت اور عرب وحدت کے داعی، جنہوں نے جلاوطنی کے برس جنیوا میں شام و فلسطین کے غیر سرکاری نمائندے کی حیثیت سے گزارے۔ ان کی مشہور ترین کتاب «لماذا تأخر المسلمون وتقدم غيرهم؟» ہے۔"
