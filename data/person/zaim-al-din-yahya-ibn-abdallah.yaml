  en: "Za'im al-Din Abu al-Fadl Yahya b. Abdallah Ibn Ja'far (511–570) — Abbasid finance official; supervised the treasury from 542 to 567, then deputized as vizier after Ibn al-Muzaffar's dismissal; praised for his conduct among the learned {cite:wafayat-ayan}."
