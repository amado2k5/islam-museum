id: person/ibn-shubruma
class: person
label: { ar: "ابن شبرمة", en: "Ibn Shubruma", es: "Ibn Shubruma", fr: "Ibn Shubruma", ur: "ابن شبرومہ" }
summary:
  ar: "عبد الله بن شبرمة قاضي الكوفة؛ قال لو وليت البصرة لقبضت أموالهم لأن عمر لم يقطع بها أحداً إلا أبا بكرة ونافع بن الحارث ولم يقطع عثمان إلا عمران بن حصين وابن عامر أقطعه داره وحمران مولاه وقد أقطع زياد عمران قطيعة فيما يقال."
  en: "Abdallah ibn Shubruma, Kufa's qadi; 'were I governor of Basra I would seize their wealth — Umar granted there only Abu Bakra and Nafi' ibn al-Harith, Uthman only Imran ibn al-Husayn plus Ibn Amir's house and Humran his mawla, and Ziyad is said to have given Imran a qati'a too'."
  es: "Abdallah ibn Shubruma, cadí de Kufa, dijo: «Si yo fuera gobernador de Basora, me apoderaría de sus riquezas. Umar solo concedió allí a Abu Bakra y Nafi' ibn al-Harith, Uthman solo a Imran ibn al-Husayn, además de la casa de Ibn Amir y a Humran su mawla, y se dice que Ziyad también le dio a Imran una qati'a»."
  fr: "Abdallah ibn Shubruma, cadi de Kufa; « si j'étais gouverneur de Bassora, je saisirais leurs richesses — Umar n'y a accordé qu'Abu Bakra et Nafi' ibn al-Harith, Uthman seulement Imran ibn al-Husayn plus la maison d'Ibn Amir et Humran son mawla, et Ziyad aurait également donné une qati'a à Imran »."
  ur: "عبداللہ ابن شبرومہ، کوفہ کے قاضی؛ اگر میں بصرہ کا گورنر ہوتا تو ان کا مال ضبط کر لیتا - عمر نے وہاں صرف ابوبکرہ اور نافع ابن الحارث کو، عثمان نے صرف عمران بن الحسین کے علاوہ ابن عامر کا گھر اور حمران کو اس کا مولا دیا، اور زیاد کے بارے میں کہا جاتا ہے کہ عمران کو بھی قتیہ دیا تھا۔"
