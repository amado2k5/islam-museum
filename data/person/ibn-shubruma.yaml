summary:
  ar: "عبد الله بن شبرمة قاضي الكوفة؛ قال لو وليت البصرة لقبضت أموالهم لأن عمر لم يقطع بها أحداً إلا أبا بكرة ونافع بن الحارث ولم يقطع عثمان إلا عمران بن حصين وابن عامر أقطعه داره وحمران مولاه وقد أقطع زياد عمران قطيعة فيما يقال."
  en: "Abdallah ibn Shubruma, Kufa's qadi; 'were I governor of Basra I would seize their wealth — Umar granted there only Abu Bakra and Nafi' ibn al-Harith, Uthman only Imran ibn al-Husayn plus Ibn Amir's house and Humran his mawla, and Ziyad is said to have given Imran a qati'a too'."
