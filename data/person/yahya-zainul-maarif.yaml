summary:
  ar: "داعية وعالم إندونيسي وُلد في بليتار بجاوة الشرقية سنة 1973، نشأ في مدارس باعلويّة: معهد دار اللغة والدعوة في بانغيل ثم تسع سنوات من دراسة الفقه في حضرموت باليمن ⁦(جامعة الأحقاف)⁩، وأسس سنة 2006 مؤسسة البهجة التعليمية الدعوية في تشيربون بغرب جاوة، ويدير قناة البهجة الفضائية وإذاعة محلية، وألّف سلسلة «فقه عملي» وعدة كتب أجوبة فقهية."
  en: "Indonesian preacher and scholar born in Blitar, East Java, in 1973. He was formed in Ba'alawi-run schools — the Darullughah Wadda'wah pesantren at Bangil, then nine years of fiqh study in Hadramaut, Yemen (Al-Ahgaff University) — founded the Al-Bahjah educational and dawah foundation in Cirebon, West Java, in 2006, runs Al-Bahjah TV and a local radio station, and has written a practical-fiqh series and several books of fatwa-style answers."
  ur: "انڈونیشی مبلغ و عالم، جو 1973ء میں مشرقی جاوا کے بلیٹار میں پیدا ہوئے۔ بانگیل کے دار اللغۃ و الدعوہ مدرسے اور حضرموت (یمن) میں نو سال فقہ کی تعلیم پائی، 2006ء میں چیربون میں البہجہ فاؤنڈیشن قائم کی، البہجہ ٹی وی اور مقامی ریڈیو چلاتے ہیں، اور «سلسلہ فقہِ عملی» سمیت متعدد کتب کے مصنف ہیں۔"
