label:
  ar: أبو العتاهية بن بشر
  en: Abu al-Atahiya ibn Bishr
  ur: ابو العتاہیہ بن بشر
summary:
  ar: صاحب أمر صنعاء الذي كاتب الهادي وأمده بالعساكر والأموال ثم استدعاه إلى صنعاء وسلّم إليه ما في يده وبايع له، ثم سأله حبس آل يعفر وآل طريف.
  en: The man who held the affairs of Sana'a, who corresponded with al-Hadi and supplied troops and money, then invited him to Sana'a, handed over what he held and swore allegiance, and later asked him to imprison Al Ya'fur and Al Tarif.
  ur: صنعاء کے معاملات کا نگران جس نے ہادی سے خط و کتابت کی، لشکر اور مال سے مدد کی، پھر انہیں صنعاء بلایا، جو کچھ اس کے ہاتھ میں تھا ان کے سپرد کیا اور بیعت کی، اور بعد میں آل یعفر و آل طریف کو قید کرنے کا کہا۔
