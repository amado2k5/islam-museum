summary:
  ar: "السلطان مراد الخامس؛ ولد في ٢٥ رجب ١٢٥٦هـ/١٨٤٠م وارتقى منصب الخلافة في ٧ جمادى الأولى ١٢٩٣هـ بعد خلع عمه عبد العزيز، ومدة ولايته ثلاثة وتسعون يوماً فقط. كان على جانب كبير من الذكاء والثقافة التركية والغربية، أبدى اهتماماً بالأدب والعلوم والشئون الأوروبية وزار أوروبا، وانخرط في سلك الماسونية وكان ميالاً إلى الدستور والليبرالية. أصيب باضطراب عصبي بعد أن أصابته الدهشة والفزع عند إيقاظه بعد منتصف الليل ليلة خلع عبد العزيز ومقتل حسن الجركسي، فأعلن شيخ الإسلام عزله بفتوى عام ١٨٧٦م نصها: إذا جنّ إمام المسلمين جنوناً مطبقاً ففات المقصود من الإمامة فهل يصح حل الإمامة من عهدته؟ الجواب: يصح والله أعلم. وبعد عزله تعافى من مرضه وأمضى باقي حياته في قصر جراغان حتى توفي عن نحو أربع وستين سنة {cite:dawlat-uthmaniyya-salabi p. 395}."
  en: "Murad V (r. 1293/1876) — sultan for ninety-three days: cultured, Francophile and constitutionalist, he broke down under the shock of his uncle's midnight deposition and was himself deposed by a shaykh al-Islam fatwa on incurable madness — the text of which the source quotes — then recovered and lived out his days in Çırağan palace {cite:dawlat-uthmaniyya-salabi p. 395}."
