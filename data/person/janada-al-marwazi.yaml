died: { edtf: "1009", hijri: "0399", calendar: julian, precision: month, status: tradition, derived: true, note: "قتله الحاكم صاحب مصر هو وأبو الحسن المقريء الأنطاكي في يوم واحد في ذي القعدة سنة تسع وتسعين وثلاثمائة؛ حكاه الأمير المختار المسبحي في تاريخه {cite:wafayat-ayan}." }
summary:
  ar: "أبو أسامة جنادة بن محمد اللغوي الأزدي المروي؛ كان مكثراً من تحفظ اللغة ونقلها عارفاً بوحشيها ومستعملها ولم يكن في زمنه مثله في فنه؛ كانت بينه وبين الحافظ عبد الغني بن سعيد المصري وأبي الحسن علي بن سلوان المقريء النحوي الأنطاكي مؤانسة ويجتمعون في دار العلم وتجري بينهم مذاكرات ومفاوضات في الآداب {cite:wafayat-ayan}."
  en: "Janada b. Muhammad al-Marwazi (d. 399) — philologist without peer in his generation; member of the Dar al-Ilm circle executed by al-Hakim on one day with the qari' Ali b. Sulwan; their fellow al-Hafiz Abd al-Ghani fled {cite:wafayat-ayan}."
  es: "Janada b. Muhammad al-Marwazi (m. 399) — filólogo sin igual en su generación; miembro del círculo Dar al-Ilm ejecutado por al-Hakim en un día junto con el qari' Ali b. Sulwan; su compañero al-Hafiz Abd al-Ghani huyó {cite:wafayat-ayan}."
  fr: "Janada b. Muhammad al-Marwazi (d. 399) — philologue sans égal dans sa génération; membre du cercle Dar al-Ilm exécuté par al-Hakim le même jour avec le qari' Ali b. Sulwan; leur collègue al-Hafiz Abd al-Ghani s'enfuit {cite:wafayat-ayan}."
  ur: "جنڈا بی۔ محمد المروازی ⁦(متوفی 399)⁩ — ماہرِ فلسفہ بغیر کسی ہم مرتبہ کے اپنی نسل میں؛ دار العلم حلقہ کے رکن کو الحکیم نے ایک دن قاری علی بن کے ساتھ پھانسی دی تھی۔ سلوان؛ ان کا ساتھی حافظ عبد الغنی فرار ہو گیا۔"
  tr: "Ebu Usama Cunadah ibn Muhammed el-Lughavi el-Ezdi el-Maravi bir anlatıcıydı; dili ezberleme ve aktarmada üretkendi, vahşiliği ve kullanımı konusunda bilgiliydi ve kendi zamanında sanatında eşi yoktu. Ezberci Abd al-Ghani ibn Sa'id al-Masri ve Antakyalı dilbilgisi uzmanı Ebu al-Hasan Ali ibn Silwan ile yakın bir bağ kurdu. Bilgi alanında bir araya gelir, edebiyatta tartışmalar ve müzakereler yapılırdı {atıf:wafayat-ayan}."
  id: "Abu Usama Junadah ibn Muhammad al-Lughawi al-Azdi al-Marawi adalah seorang narator; ia sangat produktif dalam menghafal dan menyampaikan bahasa, menguasai keganasan dan penggunaannya, dan pada zamannya, tidak ada yang tertandingi dalam seninya. Ia memiliki ikatan erat dengan pengapal Abd al-Ghani ibn Sa'id al-Masri dan Abu al-Hasan Ali ibn Silwan, ahli tata bahasa dari Antiokhia. Mereka berkumpul di ranah pengetahuan, dan diskusi serta negosiasi dalam sastra akan berlangsung {cite:wafayat-ayan}."
