  ur: "محمد ابن علی الزملقانی"
roles: [scholar, qadi]
gender: male
summary:
  ar: "محمد بن علي بن عبد الواحد الأنصاري، كمال الدين، المعروف بابن الزملكاني، فقيه شافعي انتهت إليه رياسة الشافعية في عصره، ولد ونشأ بدمشق وولي قضاء حلب سنتين، وتوفي في بلبيس سنة 727 هـ ودفن بالقاهرة."
  en: "Muhammad ibn Ali ibn Abd al-Wahid al-Ansari, Kamal al-Din, known as Ibn al-Zamlakani, a Shafi'i jurist to whom the leadership of the Shafi'is passed in his time; born and educated in Damascus, judge of Aleppo for two years, he died at Bilbays in 727 AH and was buried in Cairo."
  es: "Muhammad ibn Ali ibn Abd al-Wahid al-Ansari, Kamal al-Din, conocido como Ibn al-Zamlakani, fue un jurista shafi'í a quien recayó el liderazgo de los shafi'ís en su época; nació y se educó en Damasco, fue juez de Alepo durante dos años, murió en Bilbays en el año 727 de la Hégira y fue enterrado en El Cairo."
  fr: "Muhammad ibn Ali ibn Abd al-Wahid al-Ansari, Kamal al-Din, connu sous le nom d'Ibn al-Zamlakani, juriste chaféite à qui la direction des chaféites est passée à son époque; né et éduqué à Damas, juge d'Alep pendant deux ans, il est mort à Bilbays en 727 AH et a été enterré au Caire."
  ur: "محمد بن علی ابن عبد الواحد الانصاری، کمال الدین، ابن الزملقانی کے نام سے جانا جاتا ہے، ایک شافعی فقیہ جن کے پاس اپنے زمانے میں شافعیوں کی قیادت گزری ہے۔ دمشق میں پیدا ہوئے اور حلب کے جج دو سال تک تعلیم حاصل کی، اس کا انتقال 727 ہجری میں بلبیس میں ہوا اور قاہرہ میں دفن ہوئے۔"
  tr: "Muhammed ibn Ali bin Abd al-Wahid al-Ansari, Kamal al-Din, İbn al-Zamalkani olarak bilinir, kendi döneminde Şafii okulunun liderliğini üstlenmiş bir Şafii hukukçusuydu. Şam'da doğup büyüdü, iki yıl boyunca Halep'te yargıç olarak görev yaptı, 727 Hicri'de Balbeis'te öldü ve Kahire'de defnedildi."
  id: "Muhammad ibn Ali ibn Abd al-Wahid al-Ansari, Kamal al-Din, yang dikenal sebagai Ibn al-Zamalkani, adalah seorang ahli hukum Shafi'i yang memimpin mazhab Shafi'i pada masanya. Ia lahir dan besar di Damaskus, menjabat sebagai hakim Aleppo selama dua tahun, meninggal di Balbeis pada tahun 727 H, dan dimakamkan di Kairo."
