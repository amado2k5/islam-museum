  ar: "محمد بن علي بن عبد الواحد الأنصاري، كمال الدين، المعروف بابن الزملكاني، فقيه شافعي انتهت إليه رياسة الشافعية في عصره، ولد ونشأ بدمشق وولي قضاء حلب سنتين، وتوفي في بلبيس سنة 727 هـ ودفن بالقاهرة."
  en: "Muhammad ibn Ali ibn Abd al-Wahid al-Ansari, Kamal al-Din, known as Ibn al-Zamlakani, a Shafi'i jurist to whom the leadership of the Shafi'is passed in his time; born and educated in Damascus, judge of Aleppo for two years, he died at Bilbays in 727 AH and was buried in Cairo."
