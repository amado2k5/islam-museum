  en: "Ibn Salam — Muhammad b. al-Hasan of Damascus, a precise and wakeful muhaddith who, despite his youth, had already written much and memorized al-Hakim's hadith sciences; he died in Safar 630 at twenty-one, leaving his father bereft {cite:shadharat-dhahab p. 140}."
