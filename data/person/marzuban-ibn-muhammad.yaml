id: person/marzuban-ibn-muhammad
class: person
label: { ar: "المرزبان بن محمد السلاري" }
summary:
  ar: "أمير أذربيجان من بني سلار؛ لما نزل الروس بردعة سنة 332هـ جمع الناس واستنفرهم فبلغت مدة من معه ثلاثين ألفاً وكان يغادي الروس القتال ويراوحهم فلا يعود إلا مغلولاً، ثم أعمل الحيلة فكمن لهم كميناً وتطارد لهم حتى جازوه ففعل بهم قتلاً كثيراً منهم أميرهم وحاصر الباقين في حصن شهرستان حتى أتاه خبر مسير أبي عبد الله بن سعيد بن حمدان إلى أذربيجان وموت توزون فتركهم {cite:kamil-ibn-al-athir p. 308-310}."
  en: "The Sallarid amir of Azerbaijan; after the Rus sack of Barda'a in 332 he mustered thirty thousand, ground them down with feints and ambush, killed their prince and besieged the rest in the Shahrastan fort until Hamdanid moves on Azerbaijan recalled him {cite:kamil-ibn-al-athir p. 308-310}."
  es: "El emir sallarí de Azerbaiyán; después del saqueo de Barda'a por los Rus en 332 reunió a treinta mil hombres, los debilitó con fintas y emboscadas, mató a su príncipe y sitió al resto en el fuerte de Shahrastan hasta que los Hamdaníes avanzaron. Azerbaiyán lo llamó de vuelta {cite:kamil-ibn-al-athir p. 308-310}."
  fr: "L'émir sallaride d'Azerbaïdjan; après le sac de Barda'a par les Rus en 332, il rassembla trente mille hommes, les écrasa avec des feintes et des embuscades, tua leur prince et assiégea le reste dans le fort de Shahrastan jusqu'à ce que les Hamdanides se déplacent vers l'Azerbaïdjan le rappellent {cite:kamil-ibn-al-athir p. 308-310}."
  ur: "آذربائیجان کے سلاریڈ امیر؛ 332 میں بردعہ کے روس کی بوری کے بعد اس نے تیس ہزار اکٹھے کیے، انہیں گھات لگا کر گرا دیا، ان کے شہزادے کو قتل کر دیا اور باقیوں کو شہرستان کے قلعے کا محاصرہ کر لیا یہاں تک کہ ہمدانی نے آذربائیجان پر چڑھائی کر کے اسے واپس بلا لیا۔ 308-310}۔"
