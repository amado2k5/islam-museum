summary:
  ar: "أمير أذربيجان من بني سلار؛ لما نزل الروس بردعة سنة 332هـ جمع الناس واستنفرهم فبلغت مدة من معه ثلاثين ألفاً وكان يغادي الروس القتال ويراوحهم فلا يعود إلا مغلولاً، ثم أعمل الحيلة فكمن لهم كميناً وتطارد لهم حتى جازوه ففعل بهم قتلاً كثيراً منهم أميرهم وحاصر الباقين في حصن شهرستان حتى أتاه خبر مسير أبي عبد الله بن سعيد بن حمدان إلى أذربيجان وموت توزون فتركهم {cite:kamil-ibn-al-athir p. 308-310}."
  en: "The Sallarid amir of Azerbaijan; after the Rus sack of Barda'a in 332 he mustered thirty thousand, ground them down with feints and ambush, killed their prince and besieged the rest in the Shahrastan fort until Hamdanid moves on Azerbaijan recalled him {cite:kamil-ibn-al-athir p. 308-310}."
