summary:
  ar: "مصطفى شوكاي (1890–1941)، سياسي كازاخي ترأّس حكومة تركستان المستقلة (حكومة خوكند) في 1917–1918، وعاش منفيًا من 1921 في إسطنبول وباريس وبرلين مناصرًا لقضية تركستان، ورفض عرض النازيين قيادة الفيلق التركستاني سنة 1941، ومات في برلين في ديسمبر من العام نفسه."
  en: "Mustafa Shokay (1890–1941) was a Kazakh politician who headed the Turkestan Autonomy (the Kokand government) in 1917–1918, lived in exile from 1921 in Istanbul, Paris and Berlin pleading the Turkestan cause, refused the Nazi offer to lead the Turkestan Legion in 1941, and died in Berlin that December."
  ur: "مصطفیٰ شوكاي (1890–1941) قازق سیاست دان تھے جنہوں نے 1917–1918 میں ترکستان خودمختاری (خوکند حکومت) کی سربراہی کی، 1921 سے استنبول، پیرس اور برلن میں جلاوطنی کی زندگی گزاری اور ترکستان کے مقدمے کی وکالت کی، 1941 میں نازیوں کی ترکستان لیجن کی قیادت کی پیشکش ٹھکرا دی اور اسی دسمبر میں برلن میں وفات پائی۔"
