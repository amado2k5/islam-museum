summary:
  ar: "نواب سر فتح علي خان قزلباش (1862–1923) جاگیردار من لاهور في البنجاب، خلف عمه سنة 1898 على رأس عشيرة قزلباش، وجلس في المجلس التشريعي للبنجاب ومجلس الهند، وطرح فكرة كلية الشيعة في لكناو وكان من مؤسسيها، ونال وسام قائد فارس للإمبراطورية الهندية سنة 1921، ودُفن في كربلاء."
  en: "Nawab Sir Fateh Ali Khan Qizilbash (1862–1923) was a Lahore landlord of the Punjab who succeeded his uncle in 1898 as head of the Qizilbash clan, sat on the Punjab Legislative Council and the Council of India, promulgated the idea of Shia College, Lucknow and was among its founders, was made KCIE in 1921, and was buried in Karbala."
  ur: "نواب سر فتح علی خاں قزلباش (1862ء–1923ء) پنجاب کے لاہوری جاگیردار تھے، 1898ء میں اپنے چچا کے بعد قزلباش قبیلے کے سربراہ بنے، پنجاب لیجسلیٹو کونسل اور کونسل آف انڈیا کے رکن رہے، لکھنؤ کے شیعہ کالج کے بانیان میں شامل تھے، 1921ء میں کے سی آئی ای بنائے گئے اور کربلا میں دفن ہوئے۔"
