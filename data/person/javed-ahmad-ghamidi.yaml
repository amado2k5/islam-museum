summary:
  ar: "باحث وفيلسوف باكستاني، وُلد سنة 1951 في إقليم البنجاب، وتتلمذ على أمين أحسن إصلاحي، وأسس معهد المورد للبحوث والتعليم في لاهور سنة 1983، وغادر باكستان سنة 2010 إثر تهديدات، ويقيم في الولايات المتحدة حيث يرأس أكاديميا مركز غامدي للتعليم الإسلامي في دالاس، وله مؤلفات أبرزها «ميزان» و«البيان»."
  en: "Pakistani scholar and philosopher, born in Punjab in 1951. A student of Amin Ahsan Islahi, he founded the Al-Mawrid institute of Islamic research and education in Lahore in 1983, left Pakistan in 2010 after threats, and now lives in the United States, where he heads the Ghamidi Center of Islamic Learning in Dallas academically. His best-known works are Mizan and Al-Bayan."
  ur: "پاکستانی عالم اور فلسفی، جو 1951 میں پنجاب میں پیدا ہوئے۔ وہ امین احسن اصلاحی کے شاگرد ہیں، انہوں نے 1983 میں لاہور میں المورد انسٹی ٹیوٹ قائم کیا، دھمکیوں کے بعد 2010 میں پاکستان چھوڑا، اور اب امریکا میں مقیم ہیں جہاں وہ ڈیلاس میں غامدی سنٹر آف اسلامک لرننگ کی علمی سربراہی کرتے ہیں۔ ان کی مشہور تصانیف «میزان» اور «البیان» ہیں۔"
