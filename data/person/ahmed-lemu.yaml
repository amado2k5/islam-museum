summary:
  ar: "عالم وتربوي وقاضٍ نيجيري، وُلد في قرية ليمو قرب بيدا بولاية نيجر سنة 1929 وتوفي في 24 ديسمبر 2020. تعلّم في ليمو وكانو ثم في كلية الدراسات الشرقية والأفريقية بجامعة لندن، ودرّس العربية والدراسات الإسلامية وترقّى في التفتيش التربوي، ثم صار أول قاضٍ شرعي بمحكمة الاستئناف في صكتو وكبيرَ قضاة محكمة الاستئناف الشرعية بولاية نيجر. أسس مع زوجته عائشة ليمو صندوقَ التعليم الإسلامي سنة 1969، ونال جائزة الملك فيصل العالمية لخدمة الإسلام سنة 2014."
  en: "Nigerian Muslim scholar, educationist and judge, born in the village of Lemu near Bida in Niger State in 1929 and died on 24 December 2020. He was educated at Lemu and Kano and then at SOAS, University of London; he taught Arabic and Islamic studies and rose through the education inspectorate, then became the first Sharia judge of the Sokoto Court of Appeal and Grand Khadi of the Niger State Sharia Court of Appeal. With his wife Aisha Lemu he founded the Islamic Educational Trust in 1969, and he received the King Faisal International Prize for service to Islam in 2014."
  ur: "نائیجیریا کے مسلمان عالم، ماہرِ تعلیم اور جج، 1929ء میں ریاست نائجر کے قصبہ بیدا کے قریب گاؤں لیمو میں پیدا ہوئے اور 24 دسمبر 2020ء کو وفات پائی۔ انھوں نے لیمو اور کانو، پھر لندن یونیورسٹی کے اسکول آف اورینٹل اینڈ افریقن اسٹڈیز میں تعلیم حاصل کی؛ عربی اور اسلامی مطالعات کی تدریس کی اور محکمۂ تعلیم میں ترقی کرتے ہوئے، پھر سکوٹو اپیل کورٹ کے پہلے شرعی جج اور ریاست نائجر کی شرعی اپیل کورٹ کے گرینڈ قاضی بنے۔ انھوں نے اپنی اہلیہ عائشہ لیمو کے ساتھ 1969ء میں اسلامک ایجوکیشن ٹرسٹ کی بنیاد رکھی، اور 2014ء میں انھیں خدمتِ اسلام پر شاہ فیصل عالمی انعام ملا۔"
  es: "Erudito musulmán nigeriano, pedagogo y juez, nacido en la aldea de Lemu, cerca de Bida, en el estado de Níger, en 1929 y fallecido el 24 de diciembre de 2020. Estudió en Lemu y Kano, y posteriormente en la SOAS (Escuela de Estudios Islámicos y Africanos) de la Universidad de Londres. Impartió clases de árabe y estudios islámicos, ascendiendo en la jerarquía de la inspección educativa, hasta convertirse en el primer juez de la Sharia del Tribunal de Apelación de Sokoto y Gran Cadí del Tribunal de Apelación de la Sharia del estado de Níger. Junto con su esposa, Aisha Lemu, fundó el Islamic Educational Trust en 1969 y recibió el Premio Internacional Rey Faisal por su contribución al Islam en 2014."
  fr: "Érudit musulman nigérian, pédagogue et juge, né en 1929 dans le village de Lemu, près de Bida, dans l'État du Niger, et décédé le 24 décembre 2020. Il fit ses études à Lemu et à Kano, puis à la SOAS (Society of Arts and Studies), Université de Londres. Il enseigna l'arabe et les études islamiques et gravit les échelons de l'inspection académique, avant de devenir le premier juge de la charia de la Cour d'appel de Sokoto et le grand cadi de la Cour d'appel de la charia de l'État du Niger. Avec son épouse Aisha Lemu, il fonda l'Islamic Educational Trust en 1969 et reçut le prix international du roi Faisal pour services rendus à l'islam en 2014."
  tr: "Nijeryalı bir akademisyen, eğitimci ve yargıç olan Faysal Lemu, 1929 yılında Nijer Eyaleti'ndeki Bida yakınlarındaki Lemu köyünde doğdu ve 24 Aralık 2020'de vefat etti. Lemu ve Kano'da, daha sonra Londra Üniversitesi'ndeki Doğu ve Afrika Çalışmaları Okulu'nda (SOAS) eğitim gördü. Arapça ve İslami ilimler dersleri verdi, eğitim denetiminde yükseldi ve Sokoto Temyiz Mahkemesi'nin ilk Şeriat hakimi, daha sonra da Nijer Eyaleti Şeriat Temyiz Mahkemesi Başyargıcı oldu. Eşi Ayşe Lemu ile birlikte 1969 yılında İslami Eğitim Fonu'nu kurdu ve 2014 yılında İslam'a Hizmetlerinden dolayı Kral Faysal Uluslararası Ödülü'ne layık görüldü."
  id: "Seorang cendekiawan, pendidik, dan hakim Nigeria, ia lahir di desa Lemu dekat Bida di Negara Bagian Niger pada tahun 1929 dan meninggal pada 24 Desember 2020. Ia belajar di Lemu dan Kano, kemudian di School of Oriental and African Studies (SOAS) di Universitas London. Ia mengajar bahasa Arab dan studi Islam, meniti karier di bidang inspeksi pendidikan, dan menjadi hakim Syariah pertama di Pengadilan Banding Sokoto dan kemudian menjadi Ketua Hakim Pengadilan Banding Syariah di Negara Bagian Niger. Ia dan istrinya, Aisha Lemu, mendirikan Dana Pendidikan Islam pada tahun 1969, dan ia dianugerahi Penghargaan Internasional Raja Faisal untuk Pengabdian kepada Islam pada tahun 2014."
