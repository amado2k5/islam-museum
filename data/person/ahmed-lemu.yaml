summary:
  ar: "عالم وتربوي وقاضٍ نيجيري، وُلد في قرية ليمو قرب بيدا بولاية نيجر سنة 1929 وتوفي في 24 ديسمبر 2020. تعلّم في ليمو وكانو ثم في كلية الدراسات الشرقية والأفريقية بجامعة لندن، ودرّس العربية والدراسات الإسلامية وترقّى في التفتيش التربوي، ثم صار أول قاضٍ شرعي بمحكمة الاستئناف في صكتو وكبيرَ قضاة محكمة الاستئناف الشرعية بولاية نيجر. أسس مع زوجته عائشة ليمو صندوقَ التعليم الإسلامي سنة 1969، ونال جائزة الملك فيصل العالمية لخدمة الإسلام سنة 2014."
  en: "Nigerian Muslim scholar, educationist and judge, born in the village of Lemu near Bida in Niger State in 1929 and died on 24 December 2020. He was educated at Lemu and Kano and then at SOAS, University of London; he taught Arabic and Islamic studies and rose through the education inspectorate, then became the first Sharia judge of the Sokoto Court of Appeal and Grand Khadi of the Niger State Sharia Court of Appeal. With his wife Aisha Lemu he founded the Islamic Educational Trust in 1969, and he received the King Faisal International Prize for service to Islam in 2014."
  ur: "نائیجیریا کے مسلمان عالم، ماہرِ تعلیم اور جج، 1929ء میں ریاست نائجر کے قصبہ بیدا کے قریب گاؤں لیمو میں پیدا ہوئے اور 24 دسمبر 2020ء کو وفات پائی۔ انھوں نے لیمو اور کانو، پھر لندن یونیورسٹی کے اسکول آف اورینٹل اینڈ افریقن اسٹڈیز میں تعلیم حاصل کی؛ عربی اور اسلامی مطالعات کی تدریس کی اور محکمۂ تعلیم میں ترقی کرتے ہوئے، پھر سکوٹو اپیل کورٹ کے پہلے شرعی جج اور ریاست نائجر کی شرعی اپیل کورٹ کے گرینڈ قاضی بنے۔ انھوں نے اپنی اہلیہ عائشہ لیمو کے ساتھ 1969ء میں اسلامک ایجوکیشن ٹرسٹ کی بنیاد رکھی، اور 2014ء میں انھیں خدمتِ اسلام پر شاہ فیصل عالمی انعام ملا۔"
