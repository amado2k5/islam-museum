summary:
  ar: "رينوكا جاغتياني (وُلدت سنة 1954 على الأرجح)، سيدة أعمال هندية ترأس مجموعة لاندمارك التجارية ومقرها دبي. التحقت بالمجموعة التي أسسها زوجها الراحل موكيش جاغتياني «ميكي» سنة 1993 وأسست سلسلتها سبلاش للملابس، وتولت رئاسة المجموعة بعد وفاته في أيار 2023. أدرجتها فوربس سنة 2024 لأول مرة في قائمة مليارديراتها بثروة قدّرتها بنحو 4.8 مليار دولار."
  en: "Renuka Jagtiani (born probably in 1954) is an Indian businesswoman and chairwoman of the Dubai-based Landmark Group. She joined the group founded by her late husband Mukesh 'Micky' Jagtiani in 1993 and founded its Splash clothing chain, and took over as chairwoman after his death in May 2023. Forbes listed her among its billionaires for the first time in 2024, with a net worth put at US$4.8 billion."
  ur: "رینوکا جگتیانی (پیدائش غالباً 1954) بھارتی کاروباری خاتون اور دبئی میں قائم لانڈ مارک گروپ کی چیئر وومن ہیں۔ وہ 1993 میں اپنے مرحوم شوہر مکیش 'مکی' جگتیانی کے قائم کردہ گروپ میں شامل ہوئیں اور اس کی ملبوسات کی سلسلہ وار دکانوں اسپلش کی بنیاد رکھی، اور مئی 2023 میں ان کے انتقال کے بعد چیئر وومن بنیں۔ فوربز نے انہیں 2024 میں پہلی بار ارب پتیوں کی فہرست میں شامل کیا اور ان کی دولت کا تخمینہ 4.8 ارب ڈالر لگایا۔"

