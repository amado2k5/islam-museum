id: person/bahaa-al-din-qaraqush
class: person
label: { ar: "بهاء الدين قراقوش" }
summary:
  ar: "أمير صلاح الدين، جعله على بناء السور الأعظم المحيط بمصر والقاهرة سنة اثنتين وسبعين وقال ابن الأثير دوره تسعة وعشرون ألف ذراع وثلاث مئة ذراع بالهاشمي {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  en: "Salah al-Din's amir, set over the building of Cairo's great wall in 572 — 29,300 Hashimi cubits round {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  es: "Emir de Salah al-Din, situado sobre la construcción de la gran muralla de El Cairo en 572: 29.300 codos Hashimi alrededor {cita:tarikh-khulafa-minhaj-1434 p. 684}."
  fr: "L'émir de Salah al-Din, installé sur la construction de la grande muraille du Caire en 572 — 29 300 coudées Hashimi autour {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  ur: "صلاح الدین کا امیر، 572 میں قاہرہ کی عظیم دیوار کی عمارت پر قائم کیا گیا - 29,300 ہاشمی ہاتھ گول 684}۔"
  tr: "Emir Salah al-Din, yetmiş iki yılında Mısır ve Kahire'yi çevreleyen Büyük Sedd'i inşa etmekle görevlendirdi. İbn al-Athir, görevinin yirmi dokuz bin arşin ve Haşimi'de üç yüz arşın olduğunu söyledi {cite:Tarikh-khulafa-minhaj-1434, s. 684}."
  id: "Amir Salah al-Din menugaskannya untuk membangun Tembok Besar yang mengelilingi Mesir dan Kairo pada tahun tujuh puluh dua. Ibn al-Athir mengatakan perannya adalah dua puluh sembilan ribu hasta, dan tiga ratus hasta dalam Hashemite {cite:Tarikh-khulafa-minhaj-1434, hlm. 684}."
