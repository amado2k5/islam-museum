id: person/al-muizz-ibn-badis
education:
  did_you_know:
    ar: "المعز بن باديس صاحب المغرب الزيري؛ قطع الخطبة للعبيدي سنة ٤٤٣هـ وخطب لبني العباس، وكان عند ابن خلدون منحرفاً عن مذاهب الرافضة."
    en: "Al-Mu'izz ibn Badis, the Zirid lord of the Maghreb, cut the khutba for the Ubaydi in 443 AH and preached it for the Abbasids instead — per Ibn Khaldun he had broken with Rafidi doctrine."
    ur: "معز بن بادیس، مغرب کا زیری حکمران، نے 443ھ میں عبیدی کا خطبہ بند کیا اور عباسیوں کے نام خطبہ دیا — ابن خلدون کے مطابق وہ رافضی مذہب سے منحرف ہو چکا تھا۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/tarikh-ibn-khaldun-ibar]
class: person
label: { ar: "المعز بن باديس صاحب المغرب", en: "al-Mu'izz ibn Badis, lord of the Maghrib" }
summary:
  ar: "صاحب المغرب الزيري، قطع الخطبة للعبيدي بالمغرب وخطب لبني العباس سنة ثلاث وأربعين وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 644}. وعند ابن خلدون وكان منحرفاً عن مذاهب الرافضة منتحلاً للسنة فأعلن بمذهبه لأول ولايته ولعن الرافضة وكبا به فرسه فنادى مستغيثاً باسم أبي بكر وعمر فثارت العامة بالشيعة فقتلوهم وامتعض لذلك خلفاء الشيعة بالقاهرة وخاطبه وزيرهم أبو القاسم الجرجاني محذراً وهو يراجعه بالتعريض بخلفائهم والقدح فيهم حتى انقطع الدعاء لهم سنة 440هـ على عهد المستنصر وأحرق بنوده ومحا اسمه من الخطبة، وفي أيامه قدمت العرب الهلالية على إفريقية فأفسدت السابلة والقرى إلى أن خربت إفريقية ولم يبق له إلا ما ضمه السور، وهلك فجأة في قصره سنة 454هـ {cite:tarikh-ibn-khaldun-ibar p. 1634}. ويذكر ابن الجوزي تحت سنة ٤٤٣ أن وقعة كانت بين المغاربة وأهل مصر قُتل فيها من المغاربة ثلاثون ألفًا، ووردت كتب من صاحب المغرب بما فتح منها وبإقامة الدعوة للقائم بأمر الله {cite:muntazam-ibn-al-jawzi j.8 p.493}"
  en: "The Zirid lord of the Maghreb; in 443 he cut the Ubaydid khutba and preached for the Abbasids {cite:tarikh-khulafa-minhaj-1434 p. 644}."
gender: male
