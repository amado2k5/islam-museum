id: person/al-muizz-ibn-badis
class: person
label: { ar: "المعز بن باديس صاحب المغرب" }
summary:
  ar: "صاحب المغرب الزيري، قطع الخطبة للعبيدي بالمغرب وخطب لبني العباس سنة ثلاث وأربعين وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 644}. وعند ابن خلدون وكان منحرفاً عن مذاهب الرافضة منتحلاً للسنة فأعلن بمذهبه لأول ولايته ولعن الرافضة وكبا به فرسه فنادى مستغيثاً باسم أبي بكر وعمر فثارت العامة بالشيعة فقتلوهم وامتعض لذلك خلفاء الشيعة بالقاهرة وخاطبه وزيرهم أبو القاسم الجرجاني محذراً وهو يراجعه بالتعريض بخلفائهم والقدح فيهم حتى انقطع الدعاء لهم سنة 440هـ على عهد المستنصر وأحرق بنوده ومحا اسمه من الخطبة، وفي أيامه قدمت العرب الهلالية على إفريقية فأفسدت السابلة والقرى إلى أن خربت إفريقية ولم يبق له إلا ما ضمه السور، وهلك فجأة في قصره سنة 454هـ {cite:tarikh-ibn-khaldun-ibar p. 1634}"
  en: "The Zirid lord of the Maghreb; in 443 he cut the Ubaydid khutba and preached for the Abbasids {cite:tarikh-khulafa-minhaj-1434 p. 644}."
gender: male
