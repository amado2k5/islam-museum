summary:
  ar: "صاحب المغرب الزيري، قطع الخطبة للعبيدي بالمغرب وخطب لبني العباس سنة ثلاث وأربعين وأربع مئة {cite:tarikh-khulafa-minhaj-1434 p. 644}. وعند ابن خلدون وكان منحرفاً عن مذاهب الرافضة منتحلاً للسنة فأعلن بمذهبه لأول ولايته ولعن الرافضة وكبا به فرسه فنادى مستغيثاً باسم أبي بكر وعمر فثارت العامة بالشيعة فقتلوهم وامتعض لذلك خلفاء الشيعة بالقاهرة وخاطبه وزيرهم أبو القاسم الجرجاني محذراً وهو يراجعه بالتعريض بخلفائهم والقدح فيهم حتى انقطع الدعاء لهم سنة 440هـ على عهد المستنصر وأحرق بنوده ومحا اسمه من الخطبة، وفي أيامه قدمت العرب الهلالية على إفريقية فأفسدت السابلة والقرى إلى أن خربت إفريقية ولم يبق له إلا ما ضمه السور، وهلك فجأة في قصره سنة 454هـ {cite:tarikh-ibn-khaldun-ibar p. 1634}. ويذكر ابن الجوزي تحت سنة ٤٤٣ أن وقعة كانت بين المغاربة وأهل مصر قُتل فيها من المغاربة ثلاثون ألفًا، ووردت كتب من صاحب المغرب بما فتح منها وبإقامة الدعوة للقائم بأمر الله {cite:muntazam-ibn-al-jawzi j.8 p.493}"
  en: "The Zirid lord of the Maghreb; in 443 he cut the Ubaydid khutba and preached for the Abbasids {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  fr: "Le seigneur Ziride du Maghreb  ; en 443 il coupe la khutba Ubaydid et prêche pour les Abbassides {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  es: "El señor zirí del Magreb; en 443 cortó la jutba ubidí y predicó para los abasíes {cite:tarikh-khulafa-minhaj-1434 p. 644}."
  ur: "مغرب کا زرد رب؛ 443 میں اس نے عبیدیت کا خطبہ کاٹا اور عباسیوں کے لیے تبلیغ کی۔ 644}۔"
  tr: "Mağrip el-Ziri'nin yazarı, Fas'ta el-Ubaydi için yaptığı vaazı bölerek dört yüz kırk üç yılında Abbasilere hitap etti {atıf:Tarikh-khulafa-minhaj-1434 s. 644}. Rafide'nin mezhebinden sapıp Sünnet'i taklit eden İbn Haldun'a göre, saltanatının başında doktrinini ilan etmiş, Rafidah'ı lanetlemiş ve atını da onunla birlikte fırlatmıştır. Ebu Bekir ve Ömer adına yardım çağrısı yapmış, bu da Şiiler arasında bir isyana yol açmış ve onları öldürmüştür. Kahire'deki Şii halifeler kin beslemeye başlamıştır. Bakanları Ebu el-Kasim el-Jurcani ona seslenmiştir, halifelerini eleştirip küçümsediği sırada onu uyardı; ta ki 440 Hicri yılında, el-Mustansir'in saltanatı sırasında onlar için yapılan dualar sona erene kadar, ayetleri yakıldı ve adı vaazdan silindi. Onun döneminde Hilali Araplar İfrikiye'ye ilerledi, yolları ve köyleri tahrip etti, sonunda Ifriqiye yıkıldı ve geriye sadece surların inşa ettiği kaldı. 454 Hicri'de sarayında aniden hayatını kaybetti {alıntı:] Tarikh-ibn-khaldun-ibar, s. 1634}. İbn el-Cavazi, 443 Hicri yılında Faslılar ile Mısır halkı arasında otuz bin Faslının öldüğü bir savaş olduğunu belirtir. Mağrip hükümdarından fethetlerini ve Qa'im bi-Amr Allah'a çağrının kurulduğunu onaylayan mektuplar alınmıştır {atıf:muntazam-ibn-al-jawzi j.8 s.493}"
  id: "Penulis Maghreb al-Ziri menghentikan khotbah untuk al-Ubaydi di Maroko dan berbicara kepada Abbasiyah pada tahun empat ratus empat puluh tiga {cite:Tarikh-khulafa-minhaj-1434 hlm. 644}. Menurut Ibn Khaldun, yang telah menyimpang dari aliran Rafidah dan menyamar sebagai Sunnah, ia menyatakan doktrinnya di awal pemerintahannya, mengutuk Rafidah, dan melemparkan kudanya bersamaan dengan itu. Ia memanggil bantuan atas nama Abu Bakr dan Umar, yang menyebabkan pemberontakan di antara Syiah yang membunuh mereka. Khalifah Syiah di Kairo menjadi dendam. Menteri mereka Abu al-Qasim al-Jurjani berbicara kepadanya, memperingatkan saat ia mengkritik dan merendahkan khalifah mereka, hingga doa untuk mereka berhenti pada tahun 440 H selama masa pemerintahan al-Mustansir, dan ayat-ayatnya dibakar serta namanya dihapus dari khotbah. Pada masanya, Arab Hilali maju ke Ifriqiya, merusak jalan dan desa hingga Ifriqiya dihancurkan, hanya menyisakan apa yang telah dibangun tembok. Ia tiba-tiba meninggal di istananya pada tahun 454 H {cite::Tarikh-ibn-khaldun-ibar hlm. 1634}. Ibn al-Jawzi menyebutkan pada tahun 443 H bahwa terjadi pertempuran antara orang Maroko dan rakyat Mesir di mana tiga puluh ribu orang Maroko tewas. Surat-surat diterima dari penguasa Maghreb yang mengonfirmasi penaklukannya dan penetapan panggilan kepada Qa'im bi-Amr Allah {cite:muntazam-ibn-al-jawzi j.8 hlm.493}"
