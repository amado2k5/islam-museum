summary:
  ar: "رانيا العبد الله (وُلدت 31 أغسطس 1970) ملكة الأردن وعقيلة الملك عبد الله الثاني منذ 1999. وُلدت في الكويت باسم رانيا الياسين لأبوين أردنيين من أصل فلسطيني، ودرست إدارة الأعمال في الجامعة الأمريكية بالقاهرة وعملت في سيتي بنك ثم في أبل بعمّان قبل زواجها سنة 1993. أسّست مؤسسة نهر الأردن سنة 1995 قبل اعتلاء زوجها العرش، وعُرفت بعملها في التعليم وحماية الأطفال وتمكين المرأة، وبألّفت ثلاثة كتب للأطفال، وباستخدامها المبكر لوسائل التواصل للحديث عن صورة العرب والمسلمين في العالم."
  en: "Rania Al-Abdullah (born 31 August 1970) is Queen of Jordan as the wife of King Abdullah II since 1999. Born in Kuwait as Rania Al-Yassin to Jordanian parents of Palestinian origin, she studied business administration at the American University in Cairo and worked for Citibank and then Apple in Amman before her marriage in 1993. She founded the Jordan River Foundation in 1995, before her husband's accession, and is known for her work in education, child protection and women's empowerment, for her three children's books, and for her early use of social media to address stereotypes of Arabs and Muslims."
  ur: "رانیا العبد اللہ (پیدائش 31 اگست 1970ء) 1999ء سے اردن کی ملکہ اور بادشاہ عبد اللہ دوم کی اہلیہ ہیں۔ کویت میں رانیا الیاسین کے نام سے فلسطینی نژاد اردنی والدین کے ہاں پیدا ہوئیں، قاہرہ کی امریکن یونیورسٹی سے بزنس ایڈمنسٹریشن پڑھی اور 1993ء میں شادی سے قبل سٹی بینک اور اَیپل میں کام کیا۔ 1995ء میں جورڈن رِور فاؤنڈیشن قائم کی اور تعلیم، بچوں کے تحفظ اور خواتین کو بااختیار بنانے کے کام اور بچوں کی تین کتابوں کے لیے معروف ہیں۔"
