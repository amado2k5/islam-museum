summary:
  ar: "من الضبيب من جذام، أخو حسان بن ملة؛ ركب معه وأبي زيد بن عمرو إلى جيش زيد بن حارثة على فرس ملة رغال، وخشوا لسانه فتواصوا ألا يتكلم إلا حسان، فلما ساقهم فارس من الجيش قال كلمة الجاهلية للضرب فكفّه حسان؛ وركب في الليلة نفسها إلى رفاعة بن زيد."
  en: "Of the Dubayb of Judham, brother of Hassan ibn Milla; he rode with him and Abu Zayd ibn Amr to Zayd ibn Haritha's army on Milla's horse Righal, and because they feared his tongue they agreed that only Hassan should speak; when a horseman drove them he uttered the old signal to strike and Hassan restrained him; he rode the same night to Rifa'a ibn Zayd."
