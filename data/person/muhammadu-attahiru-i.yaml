label:
  ar: "محمد الطاهر الأول"
  en: "Muhammadu Attahiru I"
  ur: "محمد الطاهر اول"
summary:
  ar: "السلطان الثاني عشر لخلافة صكتو في غرب أفريقيا، حكم من أكتوبر 1902 إلى مارس 1903، وكان آخر سلاطين صكتو المستقلين قبل فرض السيطرة البريطانية. رفض الخضوع، وغادر صكتو فيما سمّاه هجرة استعدادا لظهور المهدي، وقُتل في معركة مبورمي في يوليو 1903."
  en: "The twelfth Sultan of the Sokoto Caliphate in West Africa, reigning from October 1902 to March 1903, and the last independent Sultan of Sokoto before the British takeover. He refused submission, left Sokoto on what he called a hijra to prepare for the coming of the Mahdi, and was killed at the battle of Mbormi in July 1903."
  ur: "مغربی افریقہ کی خلافت سوکوتو کے بارہویں سلطان، جن کا دورِ حکومت اکتوبر 1902 سے مارچ 1903 تک رہا، اور انگریزوں کے قبضے سے پہلے سوکوتو کے آخری آزاد سلطان۔ انہوں نے اطاعت سے انکار کیا، مہدی کے ظہور کی تیاری کے لیے جسے انہوں نے ہجرت کہا اس پر سوکوتو چھوڑا، اور جولائی 1903 میں مبورمی کی لڑائی میں مارے گئے۔"
