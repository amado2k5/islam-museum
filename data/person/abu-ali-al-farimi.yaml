summary:
  ar: "أبو علي الفارمي الزاهد واسمه الحسن بن مسلم الحنبلي الفارسي، من قرية بنهر عيسى يقال لها الفارسية؛ كان أحد الأبدال وزاهد العراق، سمع وتفقه بأبي ذر العركي، وكان متبتلاً أقام أربعين سنة لا يكلم أحداً من الناس، صائم الدهر قائم الليل يقرأ كل يوم وليلة ختمة، وكانت السباع تأوي إلى زاويته والخليفة وأرباب الدولة يمشون إلى زيارته؛ حكى أن فقيراً احتلم بزاويته في ليلة باردة فنزل إلى النهر ليغتسل فجاء السبع فنام على جبته، وكاد الفقير يموت من البرد والخوف، فخرج الشيخ الحسن وجاء إلى السبع فضربه بكفه وقال يا مبارك لم تتعرض لضيفنا فقام السبع مذعوراً؛ توفي بالفارسية في المحرم سنة أربع وتسعين وقد بلغ التسعين {cite:shadharat-dhahab p. 796}."
  en: "Abu Ali al-Farimi the ascetic — al-Hasan b. Muslim the Hanbali of al-Farisiyya, a village on the Isa river; one of the Abdal and the ascetic of Iraq, trained under Abu Dharr al-Araki, a celibate who kept forty years without speaking to any person, ever-fasting, standing the night, finishing the Qur'an daily; lions came to rest at his zawiya while the caliph and men of state walked out to visit him. He told of a poor man who had a wet dream at the zawiya one cold night and went down to the river to wash — a lion came and slept upon his gown, and the man near died of cold and fear, till the shaykh came out, tapped the lion's paw and said 'Blessed one, do not trouble our guest' — and the lion rose and fled. He died at al-Farisiyya in Muharram 594, aged ninety {cite:shadharat-dhahab p. 796}."
