summary:
  ar: "أبو علي الفارمي الزاهد واسمه الحسن بن مسلم الحنبلي الفارسي، من قرية بنهر عيسى يقال لها الفارسية؛ كان أحد الأبدال وزاهد العراق، سمع وتفقه بأبي ذر العركي، وكان متبتلاً أقام أربعين سنة لا يكلم أحداً من الناس، صائم الدهر قائم الليل يقرأ كل يوم وليلة ختمة، وكانت السباع تأوي إلى زاويته والخليفة وأرباب الدولة يمشون إلى زيارته؛ حكى أن فقيراً احتلم بزاويته في ليلة باردة فنزل إلى النهر ليغتسل فجاء السبع فنام على جبته، وكاد الفقير يموت من البرد والخوف، فخرج الشيخ الحسن وجاء إلى السبع فضربه بكفه وقال يا مبارك لم تتعرض لضيفنا فقام السبع مذعوراً؛ توفي بالفارسية في المحرم سنة أربع وتسعين وقد بلغ التسعين {cite:shadharat-dhahab p. 796}."
  en: "Abu Ali al-Farimi the ascetic — al-Hasan b. Muslim the Hanbali of al-Farisiyya, a village on the Isa river; one of the Abdal and the ascetic of Iraq, trained under Abu Dharr al-Araki, a celibate who kept forty years without speaking to any person, ever-fasting, standing the night, finishing the Qur'an daily; lions came to rest at his zawiya while the caliph and men of state walked out to visit him. He told of a poor man who had a wet dream at the zawiya one cold night and went down to the river to wash — a lion came and slept upon his gown, and the man near died of cold and fear, till the shaykh came out, tapped the lion's paw and said 'Blessed one, do not trouble our guest' — and the lion rose and fled. He died at al-Farisiyya in Muharram 594, aged ninety {cite:shadharat-dhahab p. 796}."
  fr: "Abu Ali al-Farimi l'ascète — al-Hasan b. Muslim, hanbalite d'al-Farisiyya, village sur le canal d'Isa ; l'un des Abdal et l'ascète de l'Iraq, formé auprès d'Abu Dharr al-Araki, célibataire qui resta quarante ans sans parler à personne, jeûnant toujours, veillant la nuit, achevant le Coran chaque jour ; les lions venaient se reposer à sa zawiya, tandis que le calife et les hommes de l'État venaient à pied lui rendre visite. On raconte qu'un pauvre eut une pollution nocturne à la zawiya par une nuit froide et descendit au fleuve se laver — un lion vint dormir sur sa robe, et l'homme faillit mourir de froid et de peur, jusqu'à ce que le shaykh sorte, tapote la patte du lion et dise « Béni, ne dérange pas notre hôte » — et le lion se leva et s'enfuit. Il mourut à al-Farisiyya en Muharram 594, à quatre-vingt-dix ans {cite:shadharat-dhahab p. 796}."
  es: "Abu Ali al-Farimi el asceta — al-Hasan b. Muslim el Hanbali de al-Farisiyya, una aldea en el río Isa; uno de los Abdal y el asceta de Irak, entrenado por Abu Dharr al-Araki, un célibe que permaneció cuarenta años sin hablar con nadie, ayunando siempre, permaneciendo de pie durante la noche, terminando el Corán diariamente; los leones venían a descansar a su zawiya mientras el califa y los hombres de estado salían a visitarlo. Contó la historia de un hombre pobre que tuvo un sueño húmedo en la zawiya una noche fría y bajó al río a lavarse; un león vino y durmió sobre su túnica, y el hombre estuvo a punto de morir de frío y miedo, hasta que el shaykh salió, tocó la pata del león y dijo: \"Bendito seas, no molestes a nuestro huésped\" — y el león se levantó y huyó. Murió en al-Farisiyya en Muharram 594, a la edad de noventa años {cite:shadharat-dhahab p. 796}."
  ur: "ابو علی الفریمی سنیاسی - الحسن بن۔ الفارسیہ کے مسلم حنبلی، دریائے عیسیٰ پر ایک گاؤں؛ عراق کے ابدال اور سنیاسیوں میں سے ایک، ابو ذر العراکی کے تحت تربیت یافتہ، ایک برہمی جو چالیس سال تک کسی سے بات کیے بغیر، ہمیشہ روزہ رکھتا، رات کو کھڑا رہتا، روزانہ قرآن ختم کرتا۔ شیر اس کے زاویہ پر آرام کرنے کے لیے آئے جبکہ خلیفہ اور ریاست کے لوگ اس کی عیادت کے لیے نکلے۔ اس نے ایک غریب آدمی کے بارے میں بتایا جس نے ایک سردی کی رات زاویہ کے پاس ایک گیلا خواب دیکھا اور نہانے کے لیے دریا میں گیا - ایک شیر آیا اور اس کے گاؤن پر سو گیا اور قریب کا آدمی سردی اور خوف سے مر گیا، یہاں تک کہ شیخ باہر آیا، شیر کے پنجے کو تھپتھپا کر کہنے لگا: اے میرے مہمان کو تکلیف نہ دینا - اور شیر اٹھ کر بھاگ گیا۔ ان کا وصال الفارسیہ میں محرم 594 میں ہوا، عمر نوے ⁦(حوالہ: شدارت ذہاب ص)⁩۔ 796}۔"
  tr: "İsa Nehri kıyısındaki Farsiyye köyünden olan, asıl adı Hasan ibn Müslim el-Hanbeli el-Farsi olan münzevi Ebu Ali el-Farmi; Irak'ın Abdal ve münzevilerinden biriydi. Ebu Zerr el-Arki'den fıkıh eğitimi aldı ve kırk yıl boyunca kimseyle konuşmadan, sürekli oruç tutarak, geceleri namaz kılarak, her gün ve her gece Kur'an'ı baştan sona okuyarak inzivaya çekildi. Vahşi hayvanlar onun köşesine sığınır, halife ve devlet ileri gelenleri onu ziyarete gelirlerdi. Rivayet edilir ki, soğuk bir gecede fakir bir adam onun köşesinde rüyasında ıslak bir şey gördü, yıkanmak için nehre indi ve bir aslan gelip elbisesinin üzerine yattı, fakir adam soğuktan ve korkudan neredeyse öldü. Sonra Şeyh Hasan çıktı, aslanın yanına gitti, avucuyla vurdu ve şöyle dedi: \"Ey mübarek, misafirimize neden zarar verdin?\" Aslan korku içinde ayağa kalktı. Doksan yaşına ulaşmışken, 94. yılın Muharrem ayında Farsiye'de öldü. {kaynak:şadharat-dhahab s. 796}"
  id: "Abu Ali al-Farmi, seorang pertapa, yang bernama al-Hasan ibn Muslim al-Hanbali al-Farsi, berasal dari sebuah desa di tepi Sungai Isa bernama al-Farsiyya; beliau adalah salah satu dari Abdal dan pertapa Irak. Beliau belajar dan mempelajari fiqih bersama Abu Dharr al-Arki, dan beliau adalah seorang pertapa yang menghabiskan empat puluh tahun tanpa berbicara dengan siapa pun, berpuasa terus-menerus, shalat malam, dan membaca Al-Quran secara lengkap setiap siang dan malam. Binatang buas biasa berlindung di sudutnya, dan Khalifah serta para pejabat negara akan berjalan kaki untuk mengunjunginya. Diriwayatkan bahwa seorang pria miskin mengalami mimpi basah di sudutnya pada malam yang dingin, sehingga ia pergi ke sungai untuk mandi, dan seekor singa datang dan tidur di jubahnya, dan pria miskin itu hampir mati karena kedinginan dan ketakutan. Kemudian Syekh al-Hasan keluar dan menghampiri singa itu dan memukulnya dengan telapak tangannya dan berkata, “Wahai yang diberkahi, mengapa engkau mencelakai tamu kami?” Maka singa itu bangkit ketakutan. Ia mati di al-Farsiyya pada bulan Muharram tahun sembilan puluh empat, setelah mencapai usia sembilan puluh tahun. {cite:shadharat-dhahab p. 796}"
