summary:
  ar: "كوميدي بريطاني وُلد في بلاكبيرن سنة 1983 باسم محمد تهذيب إلياس لأسرة باكستانية بنجابية. عمل موظفًا حكوميًا قبل الكوميديا، واشتهر بعرضه «محادثات تيز» وبرنامجه الساخر «عرض تيز أوكلوك» على القناة الرابعة، وبشخصية «إيت» في مسلسل «رجل مثل مبين»، وبكتابه «المذكرات السرية لمسلم بريطاني في الثالثة عشرة وثلاثة أرباع» (2021)."
  en: "British stand-up comedian, born in Blackburn in 1983 as Mohammed Tehzeeb Ilyas to a Pakistani Punjabi family. A civil servant before comedy, he is known for his show TEZ Talks, the Channel 4 satire programme The Tez O'Clock Show, his role as Eight in Man Like Mobeen, and his book The Secret Diary of a British Muslim aged 13¾ (2021)."
  ur: "برطانوی اسٹینڈ اپ کامیڈین، جو 1983 میں بلاکبرن میں محمد تہذیب الیاس کے نام سے ایک پاکستانی پنجابی خاندان میں پیدا ہوئے۔ کامیڈی سے پہلے سرکاری ملازم رہے؛ اپنے شو «ٹیز ٹاکس»، چینل 4 کے طنزیہ پروگرام «دی ٹیز او کلاک شو»، «مین لائک مبین» میں «ایٹ» کے کردار، اور اپنی کتاب «دی سیکرٹ ڈائری آف اے برٹش مسلم ایجڈ 13¾» (2021) کے لیے جانے جاتے ہیں۔"

