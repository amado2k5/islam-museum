label: { ar: "آزر ميدخت بنت كسرى أبرويز" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك آزر ميدخت بنت كسرى أبرويز» {cite:tabari-tarikh-abu-al-fadl j.2 p.232}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Pers kralları arasında bir kral, el-Tabari'nin \"Azar Kralı, Midokht bint Khosrow Abruiz'in Anılması\" başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl J.2 s.232}. Burada saltanat yılları ve haberleri hakkında söylenenler anlatılır."
  id: "Seorang raja di antara raja-raja Persia Sasanian, disebut oleh al-Tabari dengan judul \"Penyebutan Raja Azar, Midokht bint Khosrow Abruiz\" {cite:tabari-tarikh-abu-al-fadl J.2 hlm.232}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kabarnya diceritakan."
