summary:
  ar: "حسن باشا الجزائري الملقب «الغازي» و«بلابيق» ⁦(عريض الشارب)⁩؛ غلام لتاجر قليبولي، دخل الإنكشارية سنة ١١٥٢هـ/١٧٣٩م ثم رحل إلى الجزائر فأبلى بلاءً مشهوراً في أسر سفينة غربية وصار بك تلمسان؛ عُزل سنة ١٢٠٢هـ/١٧٨٨م فولي محافظة روسجق، واشتهر بعدها قائداً بحرياً وصدراً أعظم جدد الأسطول بعد هزيمة جشمة {cite:sicill-i-osmani vol. 2, 'Hasan Paşa (Gazi) (Palabıyık)'}."
  en: "Hasan Pasha, 'Gazi' and 'Palabıyık' (of the wide moustache); slave of a Gelibolu merchant, janissary in 1152/1739–40, then sailed for Algiers where his lone capture of a Western ship made his name and he became bey of Tlemcen; dismissed in 1202/1788 and made muhafız of Rusçuk, afterwards the famous admiral and grand vizier who rebuilt the fleet after Çeşme {cite:sicill-i-osmani vol. 2, 'Hasan Paşa (Gazi) (Palabıyık)'}."
  es: "Hasan Pasha, 'Gazi' y 'Palabıyık' (del bigote ancho); esclavo de un comerciante de Gelibolu, jenízaro en 1152/1739–40, luego navegó hacia Argel donde su única captura de un barco occidental le dio fama y se convirtió en bey de Tlemcen; destituido en 1202/1788 y nombrado muhafız de Rusçuk, posteriormente el famoso almirante y gran visir que reconstruyó la flota después de Çeşme {cite:sicill-i-osmani vol. 2, 'Hasan Paşa (Gazi) (Palabıyık)'}."
  fr: "Hasan Pacha, dit « Gazi » et « Palabıyık » (à la large moustache); esclave d'un marchand de Gelibolu, janissaire en 1152/1739-1740, il fit ensuite voile pour Alger où la capture d'un navire occidental lui valut sa renommée et il devint bey de Tlemcen; destitué en 1202/1788, il fut nommé muhafız de Rusçuk, puis devint le célèbre amiral et grand vizir qui reconstruisit la flotte après Çeşme {cite: Sicill-i-Osmani vol. 2, « Hasan Paşa (Gazi) (Palabıyık) »}."
