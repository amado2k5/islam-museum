summary:
  ar: "حسن باشا الجزائري الملقب «الغازي» و«بلابيق» (عريض الشارب)؛ غلام لتاجر قليبولي، دخل الإنكشارية سنة ١١٥٢هـ/١٧٣٩م ثم رحل إلى الجزائر فأبلى بلاءً مشهوراً في أسر سفينة غربية وصار بك تلمسان؛ عُزل سنة ١٢٠٢هـ/١٧٨٨م فولي محافظة روسجق، واشتهر بعدها قائداً بحرياً وصدراً أعظم جدد الأسطول بعد هزيمة جشمة {cite:sicill-i-osmani vol. 2, 'Hasan Paşa (Gazi) (Palabıyık)'}."
  en: "Hasan Pasha, 'Gazi' and 'Palabıyık' (of the wide moustache); slave of a Gelibolu merchant, janissary in 1152/1739–40, then sailed for Algiers where his lone capture of a Western ship made his name and he became bey of Tlemcen; dismissed in 1202/1788 and made muhafız of Rusçuk, afterwards the famous admiral and grand vizier who rebuilt the fleet after Çeşme {cite:sicill-i-osmani vol. 2, 'Hasan Paşa (Gazi) (Palabıyık)'}."
