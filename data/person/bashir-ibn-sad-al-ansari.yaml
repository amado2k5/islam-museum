label: { ar: "بشير بن سعد الأنصاري" }
summary:
  ar: "عند البلاذري: بعثه خالد بن الوليد إلى بانقيا فلقيته خيل الأعاجم عليها فرخبنذاذ فهزمهم وقتل فرخبنذاذ وانصرف وبه جراحة انتقضت به وهو بعين التمر فمات منها — ويقال إن خالداً لقي فرخبنذاذ بنفسه وبشير معه — وكان قد شهد لخريم بن أوس بابنة بقيلة مع محمد بن مسلمة."
  en: "In al-Baladhuri: Khalid ibn al-Walid sent him to Baniqya; Persian cavalry under Farrukhbandadh met him — he routed them and killed Farrukhbandadh, returning wounded, the wound relapsing at Ayn al-Tamr where he died — though it is said Khalid himself met Farrukhbandadh with Bashir beside him; he had also testified for Khuraym ibn Aws on Buqayla's daughter with Muhammad ibn Maslama."
