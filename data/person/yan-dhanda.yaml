summary:
  ar: "لاعب وسط مهاجم إنجليزي من أصل بنجابي، وُلد في برمنغهام سنة 1998، تدرّب في أكاديميتي وست بروميتش ألبيون وليفربول، ولعب لسوونزي سيتي وروس كاونتي وهارت أوف ميدلوثيان مع إعارة إلى دندي، وكان دولياً إنجليزياً في منتخبات الشباب وعبّر عن رغبته في تمثيل الهند."
  en: "English attacking midfielder of Punjabi descent, born in Birmingham in 1998. He came through the West Bromwich Albion and Liverpool academies and played for Swansea City, Ross County and Heart of Midlothian, with a loan at Dundee. A former England youth international, he has said he wants to represent India."
  ur: "پنجابی نژاد انگریز حملہ آور مڈفیلڈر، 1998 میں برمنگہم میں پیدا ہوئے۔ ویسٹ برومویچ البیون اور لیورپول کی اکیڈمیوں سے ابھر کر سوانزی سٹی، راس کاؤنٹی اور ہارٹ آف مڈلوتھیان کے لیے کھیلے اور ڈنڈی میں ادھار رہے۔ انگلستان کے سابق یوتھ انٹرنیشنل کے طور پر انہوں نے بھارت کی نمائندگی کی خواہش ظاہر کی ہے۔"
