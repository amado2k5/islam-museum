summary:
  ar: "لاعب وسط مهاجم إنجليزي من أصل بنجابي، وُلد في برمنغهام سنة 1998، تدرّب في أكاديميتي وست بروميتش ألبيون وليفربول، ولعب لسوونزي سيتي وروس كاونتي وهارت أوف ميدلوثيان مع إعارة إلى دندي، وكان دولياً إنجليزياً في منتخبات الشباب وعبّر عن رغبته في تمثيل الهند."
  en: "English attacking midfielder of Punjabi descent, born in Birmingham in 1998. He came through the West Bromwich Albion and Liverpool academies and played for Swansea City, Ross County and Heart of Midlothian, with a loan at Dundee. A former England youth international, he has said he wants to represent India."
  ur: "پنجابی نژاد انگریز حملہ آور مڈفیلڈر، 1998 میں برمنگہم میں پیدا ہوئے۔ ویسٹ برومویچ البیون اور لیورپول کی اکیڈمیوں سے ابھر کر سوانزی سٹی، راس کاؤنٹی اور ہارٹ آف مڈلوتھیان کے لیے کھیلے اور ڈنڈی میں ادھار رہے۔ انگلستان کے سابق یوتھ انٹرنیشنل کے طور پر انہوں نے بھارت کی نمائندگی کی خواہش ظاہر کی ہے۔"
  es: "Centrocampista ofensivo inglés de ascendencia punjabí, nacido en Birmingham en 1998. Se formó en las canteras del West Bromwich Albion y del Liverpool, y jugó en el Swansea City, el Ross County y el Heart of Midlothian, con una cesión al Dundee. Exinternacional juvenil con Inglaterra, ha manifestado su deseo de representar a la India."
  fr: "Milieu offensif anglais d'origine punjabie, né à Birmingham en 1998. Formé à West Bromwich Albion et à Liverpool, il a également évolué à Swansea City, Ross County et Heart of Midlothian, avec un prêt à Dundee. Ancien international anglais chez les jeunes, il a déclaré vouloir représenter l'Inde."
  tr: "1998'de Birmingham doğumlu, Pencap kökenli İngiliz hücum orta saha oyuncusu, West Bromwich Albion ve Liverpool akademilerinde antrenman yaptı, Swansea City, Ross County ve Heart of Midlothian takımlarında Dundee'ye kiralık olarak oynadı. İngiliz genç takımlarda oynadı ve Hindistan'ı temsil etme arzusunu dile getirdi."
  id: "Gelandang serang asal Inggris asal Punjabi, lahir di Birmingham pada tahun 1998, ia berlatih di West Bromwich Albion dan Liverpool academies, bermain untuk Swansea City, Ross County, dan Heart of Midlothian dengan status pinjaman ke Dundee. Ia adalah pemain internasional Inggris di tim muda dan menyatakan keinginannya untuk mewakili India."
