summary:
  ar: "الحجاج بن يوسف الثقفي، من ثقيف أهل الطائف، والٍ أموي لعبد الملك بن مروان، وتصفه دائرة المعارف الإسلامية بأنه أشهر ولاة الأمويين وأقدرهم. حاصر مكة وقُتل فيها ابن الزبير سنة 73هـ، ثم ولي العراق سنة 75هـ، وأخمد ثورة ابن الأشعث، وبنى واسط. وتُنسب إليه إجراءات في النقود والخراج والزراعة، وتُنقل عنه عند المؤرخين القدماء أخبار قاسية تُروى على أنها أخبارهم، ويرى كاتب المقالة أن ما نُسب إليه من فظائع من اختلاق أعدائه. توفي في واسط سنة 95هـ."
  en: "Al-Hajjaj ibn Yusuf al-Thaqafi, of the Thaqif of al-Ta'if, was an Umayyad governor for Abd al-Malik ibn Marwan, called by the Encyclopaedia of Islam the most famous and most able of the Umayyad governors. He besieged Mecca, where Ibn al-Zubayr was killed in 73 AH, took over Iraq in 75 AH, put down the revolt of Ibn al-Ash'ath and built Wasit. Measures on coinage, tax records and agriculture are credited to him, and harsh reports about him in the early historians are given as the sources' own, while the article's author holds the atrocities attributed to him to be inventions of his enemies. He died at Wasit in 95 AH."
  fr: "Al-Hajjaj ibn Yusuf al-Thaqafi, des Thaqif d’al-Ta’if, fut gouverneur omeyyade pour Abd al-Malik ibn Marwan ; l’Encyclopédie de l’Islam le qualifie de plus célèbre et plus capable des gouverneurs omeyyades. Il assiégea La Mecque, où Ibn al-Zubayr fut tué en 73 H, prit en charge l’Irak en 75 H, réprima la révolte d’Ibn al-Ash’ath et bâtit Wasit. Des mesures concernant la monnaie, les registres fiscaux et l’agriculture lui sont attribuées ; les récits sévères des premiers historiens sont présentés comme ceux des sources, tandis que l’auteur de l’article tient les atrocités qui lui sont imputées pour des inventions de ses ennemis. Il mourut à Wasit en 95 H."
  ur: "الحجاج بن یوسف الثقفی، طائف کے ثقیف سے، عبدالملک بن مروان کے اموی والی تھے، جنہیں انسائیکلوپیڈیا آف اسلام امویوں کا سب سے مشہور اور قابل ترین والی کہتا ہے۔ انہوں نے مکہ کا محاصرہ کیا جس میں 73ھ میں ابن الزبیر مارے گئے، 75ھ میں عراق سنبھالا، ابن الاشعث کی بغاوت دبائی اور واسط بسایا۔ سکوں، محصولات اور زراعت کے اقدامات ان سے منسوب ہیں، اور قدیم مؤرخین کی سخت روایات ان ماخذوں کی اپنی روایات کے طور پر نقل ہیں، جبکہ مضمون کا مصنف ان سے منسوب مظالم کو دشمنوں کی من گھڑت سمجھتا ہے۔ ان کی وفات 95ھ میں واسط میں ہوئی۔"
  es: "Al-Hajjaj ibn Yusuf al-Thaqafi, del Thaqif de al-Ta'if, fue gobernador omeya de Abd al-Malik ibn Marwan, considerado por la Enciclopedia del Islam como el más famoso y capaz de los gobernadores omeyas. Sitió La Meca, donde Ibn al-Zubayr fue asesinado en el año 73 de la Hégira, conquistó Irak en el año 75 de la Hégira, sofocó la revuelta de Ibn al-Ash'ath y fundó Wasit. Se le atribuyen medidas sobre acuñación de moneda, registros fiscales y agricultura, y los duros relatos sobre él que aparecen en los primeros historiadores se presentan como propias fuentes, mientras que el autor del artículo sostiene que las atrocidades que se le atribuyen son invenciones de sus enemigos. Murió en Wasit en el año 95 de la Hégira."
  tr: "Taif'in Sakif kabilesinden olan Haccac ibn Yusuf el-Sakkafi, Abdülmalik ibn Mervan'ın yönetimindeki bir Emevi valisiydi. İslam Ansiklopedisi onu Emevi valilerinin en ünlü ve yeteneklisi olarak tanımlar. Hicri 73 yılında İbn el-Zübeyr'in öldürüldüğü Mekke'yi kuşattı. Daha sonra Hicri 75 yılında Irak'ı yönetti, İbn el-Eş'at'ın isyanını bastırdı ve Vasit'i kurdu. Para birimi, vergiler ve tarımla ilgili önlemlerin uygulanmasında etkili olduğu söylenir. Antik tarihçiler onun hakkında, kendi sözleriymiş gibi sunulan sert hikayeler anlatırlar. Bu makalenin yazarı, bu vahşetlerin düşmanları tarafından uydurulduğuna inanmaktadır. Hicri 95 yılında Vasit'te öldü."
  id: "Al-Hajjaj ibn Yusuf al-Thaqafi, dari suku Thaqif di Ta'if, adalah seorang gubernur Umayyah di bawah Abd al-Malik ibn Marwan. Ensiklopedia Islam menggambarkannya sebagai gubernur Umayyah yang paling terkenal dan cakap. Ia mengepung Mekah, tempat Ibn al-Zubayr terbunuh pada tahun 73 H. Kemudian ia memerintah Irak pada tahun 75 H, menumpas pemberontakan Ibn al-Ash'ath dan mendirikan Wasit. Ia dipuji karena menerapkan langkah-langkah terkait mata uang, pajak, dan pertanian. Sejarawan kuno menceritakan kisah-kisah keras tentangnya, yang disajikan sebagai kisahnya sendiri. Penulis artikel ini percaya bahwa kekejaman ini direkayasa oleh musuh-musuhnya. Ia meninggal di Wasit pada tahun 95 H."
