id: person/al-hajjaj-ibn-yusuf
class: person
label: { ar: "الحجاج بن يوسف الثقفي", en: "al-Hajjaj ibn Yusuf al-Thaqafi" }
summary:
  ar: "الحجاج بن يوسف الثقفي، من ثقيف أهل الطائف، والٍ أموي لعبد الملك بن مروان، وتصفه دائرة المعارف الإسلامية بأنه أشهر ولاة الأمويين وأقدرهم. حاصر مكة وقُتل فيها ابن الزبير سنة 73هـ، ثم ولي العراق سنة 75هـ، وأخمد ثورة ابن الأشعث، وبنى واسط. وتُنسب إليه إجراءات في النقود والخراج والزراعة، وتُنقل عنه عند المؤرخين القدماء أخبار قاسية تُروى على أنها أخبارهم، ويرى كاتب المقالة أن ما نُسب إليه من فظائع من اختلاق أعدائه. توفي في واسط سنة 95هـ."
  en: "Al-Hajjaj ibn Yusuf al-Thaqafi, of the Thaqif of al-Ta'if, was an Umayyad governor for Abd al-Malik ibn Marwan, called by the Encyclopaedia of Islam the most famous and most able of the Umayyad governors. He besieged Mecca, where Ibn al-Zubayr was killed in 73 AH, took over Iraq in 75 AH, put down the revolt of Ibn al-Ash'ath and built Wasit. Measures on coinage, tax records and agriculture are credited to him, and harsh reports about him in the early historians are given as the sources' own, while the article's author holds the atrocities attributed to him to be inventions of his enemies. He died at Wasit in 95 AH."
  ur: "الحجاج بن یوسف الثقفی، طائف کے ثقیف سے، عبدالملک بن مروان کے اموی والی تھے، جنہیں انسائیکلوپیڈیا آف اسلام امویوں کا سب سے مشہور اور قابل ترین والی کہتا ہے۔ انہوں نے مکہ کا محاصرہ کیا جس میں 73ھ میں ابن الزبیر مارے گئے، 75ھ میں عراق سنبھالا، ابن الاشعث کی بغاوت دبائی اور واسط بسایا۔ سکوں، محصولات اور زراعت کے اقدامات ان سے منسوب ہیں، اور قدیم مؤرخین کی سخت روایات ان ماخذوں کی اپنی روایات کے طور پر نقل ہیں، جبکہ مضمون کا مصنف ان سے منسوب مظالم کو دشمنوں کی من گھڑت سمجھتا ہے۔ ان کی وفات 95ھ میں واسط میں ہوئی۔"
