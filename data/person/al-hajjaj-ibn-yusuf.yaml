class: person
label: { ar: "الحجاج بن يوسف الثقفي", en: "al-Hajjaj ibn Yusuf al-Thaqafi" }
summary:
  ar: "عامل عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وكان قائد الجيش في وقعة دير الجماجم مع ابن الأشعث، وانهزم ابن الأشعث بها {cite:tabari-tarikh-abu-al-fadl j.6 p.346} {cite:tabari-tarikh-abu-al-fadl j.6 p.357}. وذكر الطبري أنه ردّ على أحد الأسرى، حين قال إن الفتنة أصابت البر والفاجر، بأنها أصابت الفجار وسلم منها الأبرار {cite:tabari-tarikh-abu-al-fadl j.6 p.374}. ولما كتب إليه عبد الملك أن صف لي الفتنة كتب إن الفتنة تشب بالنجوى وتحصد بالشكوى وتنتج بالخطب {cite:muruj-al-dhahab p. 111}، وفي خطبته المشهورة مقدمه العراق حسر اللثام عن وجهه فقال إني والله لأرى أبصاراً طامحة وأعناقاً متطاولة ورؤوساً قد أينعت وحان قطافها وإني أنا صاحبها كأني أنظر إلى الدماء ترقرق بين العمائم واللحى، وإن أمير المؤمنين نثر كنانته فوجدني أمرها طعماً وأحدها سناناً وأقواها قداحاً، وقال يا أهل العراق يا أهل الشقاق والنفاق ومساوئ الأخلاق لألحونكم لحو العود ولأعصبنكم عصب السلمة ولأضربنكم ضرب غرائب الإبل ولأقرعنكم قرع المروة، ولما بلغ كتاب أمير المؤمنين السلام فلم يردوا عليه قال هذا أدب ابن سمية {cite:muruj-al-dhahab p. 119-121}. وقتل عمير بن ضابىء ليصح بعث المهلب إلى الأزارقة فأمر لهم بجسرين على الفرات لخروجهم {cite:muruj-al-dhahab p. 122}. وكتب إلى عبد الملك في خبر ابن الأشعث واغوثاه يا الله فأمده بالجيوش وكتب يالبيك يالبيك {cite:muruj-al-dhahab p. 123}. ولما جاءه رأس ابن الأشعث علا منبر الكوفة فقال إن الشيطان استبطنكم فحشا ما هناك شقاقاً واختلافاً ونفاقاً ثم أربع فيه فعشش وباض فيه ففرخ واتخذتموه دليلاً تتابعونه {cite:muruj-al-dhahab p. 123-124}، وقتل ابن القرية سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له، ولم يظهر لندمائه بشاشة كيوم دخلت عليه ليلى الأخيلية {cite:muruj-al-dhahab p. 130-131} ولما أراد الحج خطب فقال يا أهل العراق إني قد استعملت عليكم محمداً وبه الرغبة عنكم وقد أوصيته فيكم بخلاف وصية رسول الله بالأنصار فإنه أوصى أن يقبل من محسنهم ويتجاوز عن مسيئهم وقد أوصيته ألا يقبل من محسنكم ولا يتجاوز عن مسيئكم {cite:muruj-al-dhahab p. 136}. وحبس الغضبان بن القبعثري ثلاث سنين ثم لما احتاج إلى صفات الجواري في كتاب عبد الملك أحضره وسأله ثم أطلقه بعد خبر القبة الخضراء بواسط {cite:muruj-al-dhahab p. 139-141}، ومات سنة خمس وتسعين بواسط وهو ابن أربع وخمسين سنة وكان تأمره عشرين سنة، وأحصى من قتله صبراً سوى من قتل في حروبه فوجد مائة وعشرين ألفاً، ومات وفي حبسه خمسون ألف رجل وثلاثون ألف امرأة منهن ستة عشر ألفاً مجردة ولم يكن للحبس ستر من شمس ولا مطر، وركب يوماً يريد الجمعة فسمع ضجة المحبوسين فقال اخسئوا فيها ولا تكلمون فيقال إنه مات في تلك الجمعة {cite:muruj-al-dhahab p. 157}، ومن حكاياته عند المسعودي مع أهل الشام أنه اجتبى قوماً من أهل العراق وجد عندهم من الكفاية ما لم يجد عند مختصيه من الشاميين فتكلم الشاميون فأوغل بهم في الصحراء حتى لاح قطار إبل فأرسل شامياً يعرفها فجاء يقول إبل لا يدري محملة أم لا، وكان أتبعه عراقياً بمثل ذلك فجاء يعددها ثلاثين تحمل زيتاً صدرت من موضع كذا قاصدة موضع كذا لربها فلان، فالتفت إلى أهل الشام يقول آلام على عمرو ولومات أو ناي لقل الذي يغني غناءك يا عمرو، وقيل في المعنى شر الرسولين من يحتاج مرسله منه إلى العود والأمران سيان {cite:muruj-al-dhahab p. 705-706} ويذكر الكتاب أن عبد الملك أوصى الوليد في مرضه بإكرام الحجاج لأنه مهّد له البلاد وقهر الأعداء وشتّت الخوارج، وأن الحجاج بنى واسط قاعدة عسكرية تتوسط الأهواز والبصرة والكوفة. {cite:salabi-umayyad-state-2020 p.116-128} ويذكر الكتاب أن الوليد ولى الحج سنة 92هـ للحجاج، فكتب عمر بن عبد العزيز يستعفي الوليد أن يمر عليه الحجاج بالمدينة، فأعفاه الوليد وأمره بالتنحي عن المدينة. {cite:salabi-umayyad-state-2020 p.176}"
  en: "Abd al-Malik's governor {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. He was army commander at the battle of Dayr al-Jamajim, the battle with Ibn al-Ash'ath, in which Ibn al-Ash'ath was routed {cite:tabari-tarikh-abu-al-fadl j.6 p.346} {cite:tabari-tarikh-abu-al-fadl j.6 p.357}. Al-Tabari reports that when a captive said the strife had struck both the righteous and the wicked, he answered that it had struck the wicked and spared the righteous {cite:tabari-tarikh-abu-al-fadl j.6 p.374}. When Abd al-Malik wrote asking him to describe the strife, he replied that strife is kindled by secret talk, reaped by complaint and produced by sermons {cite:muruj-al-dhahab p. 111}. In his famous address on taking over Iraq he unveiled his face and said: 'By God, I see glancing eyes, stretched necks and heads ripe for picking, and I am the one who will pick them; it is as though I see blood welling between turbans and beards. The Commander of the Faithful has emptied his quiver, and found me its most bitter in taste, its sharpest in point and its strongest shaft.' He said: 'O people of Iraq, people of discord, hypocrisy and bad character! I will strip you as a stick is stripped, bind you as the salama is bound, beat you as stray camels are beaten, and strike you as the flint is struck.' When the Commander of the Faithful's letter of greeting reached them and they did not answer, he said: 'This is the discipline of the son of Sumayya' {cite:muruj-al-dhahab p. 119-121}. Umayr ibn Dabi' was killed so that al-Muhallab's dispatch against the Azariqa would stand, and he ordered two bridges over the Euphrates for their going out {cite:muruj-al-dhahab p. 122}. He wrote to Abd al-Malik about Ibn al-Ash'ath, 'Help, O God!', and was sent armies; the reply came, 'At your service, at your service!' {cite:muruj-al-dhahab p. 123}. When Ibn al-Ash'ath's head was brought to him, he mounted the pulpit of Kufa and said: 'Satan has lodged among you and filled the place with schism, discord and hypocrisy; he settled, nested and laid eggs, which hatched, and you have taken him as a guide to follow' {cite:muruj-al-dhahab p. 123-124}. Ibn al-Qarya was killed in 82 for going out with Ibn al-Ash'ath and drafting letters for him, and he never showed his boon companions the gladness of the day Layla al-Akhyaliyya came in to him {cite:muruj-al-dhahab p. 130-131}. When he went to perform the pilgrimage he preached: 'O people of Iraq, I have set Muhammad over you, and my wish is to turn away from you; I have charged him concerning you the opposite of the charge concerning the Ansar, for he was charged to accept their good-doers and overlook their wrongdoers, whereas I have charged him not to accept your good-doers nor overlook your wrongdoers' {cite:muruj-al-dhahab p. 136}. He imprisoned al-Ghadban ibn al-Qab'thari for three years; then, when Abd al-Malik's letter asked for descriptions of slave-girls, he summoned him, questioned him and released him after the affair of the Green Dome at Wasit {cite:muruj-al-dhahab p. 139-141}. He died in 95 at Wasit aged fifty-four, after a governorship of twenty years. The number of those he executed in cold blood, apart from those who fell in his wars, was counted at one hundred and twenty thousand; at his death fifty thousand men and thirty thousand women were in his prisons, sixteen thousand of them stripped, and the prison had no shelter from sun or rain. Once, riding out to Friday prayer, he heard the clamour of the prisoners and told them to keep silent and not speak; it is said that he died that same Friday {cite:muruj-al-dhahab p. 157}. Al-Mas'udi relates an anecdote of his dealings with the people of Syria: he favoured men of Iraq whom he found more capable than his Syrian intimates, and the Syrians spoke against them. He pushed on with them into the desert until a line of camels came into view; he sent a Syrian to identify them, who came back saying, 'Camels; I cannot tell whether they are loaded.' He had sent an Iraqi on the same errand after him, who came back counting thirty of them carrying oil, leaving such-and-such a place for such-and-such a place, belonging to a man named so-and-so. He turned to the Syrians and said: 'Do I grieve for Amr? Even if he died or went away, few would sing your song as he does, O Amr.' It was also said, in the same sense, that the worst of two envoys is the one whose sender must send him back again, and that the two are alike {cite:muruj-al-dhahab p. 705-706}. The cited book reports that Abd al-Malik charged al-Walid on his deathbed to honour al-Hajjaj, because he had pacified the lands for him, subdued his enemies and scattered the Kharijites, and that al-Hajjaj built Wasit as a military base midway between al-Ahwaz, Basra and Kufa {cite:salabi-umayyad-state-2020 p.116-128}. The same book reports that al-Walid put al-Hajjaj in charge of the pilgrimage in 92 AH; Umar ibn Abd al-Aziz wrote asking al-Walid to spare him Hajjaj's passage through Medina, and al-Walid granted this and ordered him to withdraw from Medina {cite:salabi-umayyad-state-2020 p.176}."
