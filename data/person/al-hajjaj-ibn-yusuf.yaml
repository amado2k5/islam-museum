  ar: "عامل عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وكان قائد الجيش في وقعة دير الجماجم مع ابن الأشعث، وانهزم ابن الأشعث بها {cite:tabari-tarikh-abu-al-fadl j.6 p.346} {cite:tabari-tarikh-abu-al-fadl j.6 p.357}. وذكر الطبري أنه ردّ على أحد الأسرى، حين قال إن الفتنة أصابت البر والفاجر، بأنها أصابت الفجار وسلم منها الأبرار {cite:tabari-tarikh-abu-al-fadl j.6 p.374}.، ولما كتب إليه عبد الملك أن صف لي الفتنة كتب إن الفتنة تشب بالنجوى وتحصد بالشكوى وتنتج بالخطب {cite:muruj-al-dhahab p. 111}"
