class: person
label: { ar: "الحجاج بن يوسف الثقفي" }
summary:
  ar: "عامل عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وكان قائد الجيش في وقعة دير الجماجم مع ابن الأشعث، وانهزم ابن الأشعث بها {cite:tabari-tarikh-abu-al-fadl j.6 p.346} {cite:tabari-tarikh-abu-al-fadl j.6 p.357}. وذكر الطبري أنه ردّ على أحد الأسرى، حين قال إن الفتنة أصابت البر والفاجر، بأنها أصابت الفجار وسلم منها الأبرار {cite:tabari-tarikh-abu-al-fadl j.6 p.374}. ولما كتب إليه عبد الملك أن صف لي الفتنة كتب إن الفتنة تشب بالنجوى وتحصد بالشكوى وتنتج بالخطب {cite:muruj-al-dhahab p. 111}، وفي خطبته المشهورة مقدمه العراق حسر اللثام عن وجهه فقال إني والله لأرى أبصاراً طامحة وأعناقاً متطاولة ورؤوساً قد أينعت وحان قطافها وإني أنا صاحبها كأني أنظر إلى الدماء ترقرق بين العمائم واللحى، وإن أمير المؤمنين نثر كنانته فوجدني أمرها طعماً وأحدها سناناً وأقواها قداحاً، وقال يا أهل العراق يا أهل الشقاق والنفاق ومساوئ الأخلاق لألحونكم لحو العود ولأعصبنكم عصب السلمة ولأضربنكم ضرب غرائب الإبل ولأقرعنكم قرع المروة، ولما بلغ كتاب أمير المؤمنين السلام فلم يردوا عليه قال هذا أدب ابن سمية {cite:muruj-al-dhahab p. 119-121}. وقتل عمير بن ضابىء ليصح بعث المهلب إلى الأزارقة فأمر لهم بجسرين على الفرات لخروجهم {cite:muruj-al-dhahab p. 122}. وكتب إلى عبد الملك في خبر ابن الأشعث واغوثاه يا الله فأمده بالجيوش وكتب يالبيك يالبيك {cite:muruj-al-dhahab p. 123}. ولما جاءه رأس ابن الأشعث علا منبر الكوفة فقال إن الشيطان استبطنكم فحشا ما هناك شقاقاً واختلافاً ونفاقاً ثم أربع فيه فعشش وباض فيه ففرخ واتخذتموه دليلاً تتابعونه {cite:muruj-al-dhahab p. 123-124}، وقتل ابن القرية سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له، ولم يظهر لندمائه بشاشة كيوم دخلت عليه ليلى الأخيلية {cite:muruj-al-dhahab p. 130-131} ولما أراد الحج خطب فقال يا أهل العراق إني قد استعملت عليكم محمداً وبه الرغبة عنكم وقد أوصيته فيكم بخلاف وصية رسول الله بالأنصار فإنه أوصى أن يقبل من محسنهم ويتجاوز عن مسيئهم وقد أوصيته ألا يقبل من محسنكم ولا يتجاوز عن مسيئكم {cite:muruj-al-dhahab p. 136}. وحبس الغضبان بن القبعثري ثلاث سنين ثم لما احتاج إلى صفات الجواري في كتاب عبد الملك أحضره وسأله ثم أطلقه بعد خبر القبة الخضراء بواسط {cite:muruj-al-dhahab p. 139-141}، ومات سنة خمس وتسعين بواسط وهو ابن أربع وخمسين سنة وكان تأمره عشرين سنة، وأحصى من قتله صبراً سوى من قتل في حروبه فوجد مائة وعشرين ألفاً، ومات وفي حبسه خمسون ألف رجل وثلاثون ألف امرأة منهن ستة عشر ألفاً مجردة ولم يكن للحبس ستر من شمس ولا مطر، وركب يوماً يريد الجمعة فسمع ضجة المحبوسين فقال اخسئوا فيها ولا تكلمون فيقال إنه مات في تلك الجمعة {cite:muruj-al-dhahab p. 157}، ومن حكاياته عند المسعودي مع أهل الشام أنه اجتبى قوماً من أهل العراق وجد عندهم من الكفاية ما لم يجد عند مختصيه من الشاميين فتكلم الشاميون فأوغل بهم في الصحراء حتى لاح قطار إبل فأرسل شامياً يعرفها فجاء يقول إبل لا يدري محملة أم لا، وكان أتبعه عراقياً بمثل ذلك فجاء يعددها ثلاثين تحمل زيتاً صدرت من موضع كذا قاصدة موضع كذا لربها فلان، فالتفت إلى أهل الشام يقول آلام على عمرو ولومات أو ناي لقل الذي يغني غناءك يا عمرو، وقيل في المعنى شر الرسولين من يحتاج مرسله منه إلى العود والأمران سيان {cite:muruj-al-dhahab p. 705-706} ويذكر الكتاب أن عبد الملك أوصى الوليد في مرضه بإكرام الحجاج لأنه مهّد له البلاد وقهر الأعداء وشتّت الخوارج، وأن الحجاج بنى واسط قاعدة عسكرية تتوسط الأهواز والبصرة والكوفة. {cite:salabi-umayyad-state-2020 p.116-128} ويذكر الكتاب أن الوليد ولى الحج سنة 92هـ للحجاج، فكتب عمر بن عبد العزيز يستعفي الوليد أن يمر عليه الحجاج بالمدينة، فأعفاه الوليد وأمره بالتنحي عن المدينة. {cite:salabi-umayyad-state-2020 p.176}"
