label: { ar: "الحجاج بن يوسف الثقفي" }
summary:
  ar: "عامل عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وكان قائد الجيش في وقعة دير الجماجم مع ابن الأشعث، وانهزم ابن الأشعث بها {cite:tabari-tarikh-abu-al-fadl j.6 p.346} {cite:tabari-tarikh-abu-al-fadl j.6 p.357}. وذكر الطبري أنه ردّ على أحد الأسرى، حين قال إن الفتنة أصابت البر والفاجر، بأنها أصابت الفجار وسلم منها الأبرار {cite:tabari-tarikh-abu-al-fadl j.6 p.374}.، ولما كتب إليه عبد الملك أن صف لي الفتنة كتب إن الفتنة تشب بالنجوى وتحصد بالشكوى وتنتج بالخطب {cite:muruj-al-dhahab p. 111}، وفي خطبته المشهورة مقدمه العراق حسر اللثام عن وجهه فقال إني والله لأرى أبصاراً طامحة وأعناقاً متطاولة ورؤوساً قد أينعت وحان قطافها وإني أنا صاحبها كأني أنظر إلى الدماء ترقرق بين العمائم واللحى، وإن أمير المؤمنين نثر كنانته فوجدني أمرها طعماً وأحدها سناناً وأقواها قداحاً، وقال يا أهل العراق يا أهل الشقاق والنفاق ومساوئ الأخلاق لألحونكم لحو العود ولأعصبنكم عصب السلمة ولأضربنكم ضرب غرائب الإبل ولأقرعنكم قرع المروة، ولما بلغ كتاب أمير المؤمنين السلام فلم يردوا عليه قال هذا أدب ابن سمية {cite:muruj-al-dhahab p. 119-121}. وقتل عمير بن ضابىء ليصح بعث المهلب إلى الأزارقة فأمر لهم بجسرين على الفرات لخروجهم {cite:muruj-al-dhahab p. 122}. وكتب إلى عبد الملك في خبر ابن الأشعث واغوثاه يا الله فأمده بالجيوش وكتب يالبيك يالبيك {cite:muruj-al-dhahab p. 123}. ولما جاءه رأس ابن الأشعث علا منبر الكوفة فقال إن الشيطان استبطنكم فحشا ما هناك شقاقاً واختلافاً ونفاقاً ثم أربع فيه فعشش وباض فيه ففرخ واتخذتموه دليلاً تتابعونه {cite:muruj-al-dhahab p. 123-124}، وقتل ابن القرية سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له، ولم يظهر لندمائه بشاشة كيوم دخلت عليه ليلى الأخيلية {cite:muruj-al-dhahab p. 130-131}"
