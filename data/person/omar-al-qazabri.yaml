summary:
  ar: "\u0642\u0627\u0631\u0626 \u0648\u0625\u0645\u0627\u0645 \u0645\u063a\u0631\u0628\u064a (\u0648\u064f\u0644\u062f 1974)\u060c \u062e\u062a\u0645 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a \u0627\u0644\u062d\u0627\u062f\u064a\u0629 \u0639\u0634\u0631\u0629 \u0639\u0644\u0649 \u0623\u0628\u064a\u0647 \u0623\u062d\u062f \u0639\u0644\u0645\u0627\u0621 \u0645\u0631\u0627\u0643\u0634\u060c \u0648\u0623\u0645\u0651 \u0641\u064a \u062c\u062f\u0629 \u0648\u0645\u0643\u0629 \u062e\u0645\u0633 \u0633\u0646\u0648\u0627\u062a\u060c \u0648\u0642\u0631\u0623 \u0627\u0644\u0639\u0634\u0631 \u0641\u064a \u0627\u0644\u0642\u0627\u0647\u0631\u0629 \u0639\u0644\u0649 \u0623\u062d\u0645\u062f \u0639\u064a\u0633\u0649 \u0627\u0644\u0645\u0639\u0635\u0631\u0627\u0648\u064a\u060c \u0648\u0647\u0648 \u0625\u0645\u0627\u0645 \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u0646 \u0627\u0644\u062b\u0627\u0646\u064a \u0628\u0627\u0644\u062f\u0627\u0631 \u0627\u0644\u0628\u064a\u0636\u0627\u0621 \u0645\u0646\u0630 \u0631\u0645\u0636\u0627\u0646 2005."
  en: "Moroccan reciter and imam (born 1974) who completed the Qur'an at eleven under his father, a scholar of Marrakesh, led prayers in Jeddah and Mecca for five years, read the ten readings in Cairo with Ahmad Isa al-Ma'sarawi, and has been imam of the Hassan II Mosque in Casablanca since Ramadan 2005."
  ur: "\u0645\u0631\u0627\u06a9\u0634\u06cc \u0642\u0627\u0631\u06cc \u0627\u0648\u0631 \u0627\u0645\u0627\u0645 (\u067e\u06cc\u062f\u0627\u0626\u0634 1974\u0621)\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u06af\u06cc\u0627\u0631\u06c1 \u0628\u0631\u0633 \u06a9\u06cc \u0639\u0645\u0631 \u0645\u06cc\u06ba \u0627\u067e\u0646\u06d2 \u0648\u0627\u0644\u062f\u060c \u062c\u0648 \u0645\u0631\u0627\u06a9\u0634 (\u0634\u06c1\u0631) \u06a9\u06d2 \u0627\u06cc\u06a9 \u0639\u0627\u0644\u0645 \u062a\u06be\u06d2\u060c \u0633\u06d2 \u0642\u0631\u0622\u0646 \u0645\u06a9\u0645\u0644 \u06a9\u06cc\u0627\u060c \u067e\u0627\u0646\u0686 \u0628\u0631\u0633 \u062c\u062f\u06c1 \u0627\u0648\u0631 \u0645\u06a9\u06c1 \u0645\u06cc\u06ba \u0627\u0645\u0627\u0645\u062a \u06a9\u06cc\u060c \u0642\u0627\u06c1\u0631\u06c1 \u0645\u06cc\u06ba \u0627\u062d\u0645\u062f \u0639\u06cc\u0633\u06cc\u0670 \u0627\u0644\u0645\u0639\u0635\u0631\u0627\u0648\u06cc \u0633\u06d2 \u0642\u0631\u0627\u0621\u0627\u062a\u0650 \u0639\u0634\u0631\u06c1 \u067e\u0691\u06be\u06cc\u06ba\u060c \u0627\u0648\u0631 \u0631\u0645\u0636\u0627\u0646 2005\u0621 \u0633\u06d2 \u062f\u0627\u0631 \u0627\u0644\u0628\u06cc\u0636\u0627\u0621 \u06a9\u06cc \u0645\u0633\u062c\u062f \u062d\u0633\u0646 \u062b\u0627\u0646\u06cc \u06a9\u06d2 \u0627\u0645\u0627\u0645 \u06c1\u06cc\u06ba\u06d4"
