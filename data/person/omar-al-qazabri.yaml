summary:
  ar: "قارئ وإمام مغربي ⁦(وُلد 1974)⁩، ختم القرآن في الحادية عشرة على أبيه أحد علماء مراكش، وأمّ في جدة ومكة خمس سنوات، وقرأ العشر في القاهرة على أحمد عيسى المعصراوي، وهو إمام مسجد الحسن الثاني بالدار البيضاء منذ رمضان 2005."
  en: "Moroccan reciter and imam (born 1974) who completed the Qur'an at eleven under his father, a scholar of Marrakesh, led prayers in Jeddah and Mecca for five years, read the ten readings in Cairo with Ahmad Isa al-Ma'sarawi, and has been imam of the Hassan II Mosque in Casablanca since Ramadan 2005."
  ur: "مراکشی قاری اور امام ⁦(پیدائش 1974ء)⁩، جنھوں نے گیارہ برس کی عمر میں اپنے والد، جو مراکش ⁦(شہر)⁩ کے ایک عالم تھے، سے قرآن مکمل کیا، پانچ برس جدہ اور مکہ میں امامت کی، قاہرہ میں احمد عیسیٰ المعصراوی سے قراءاتِ عشرہ پڑھیں، اور رمضان 2005ء سے دار البیضاء کی مسجد حسن ثانی کے امام ہیں۔"
