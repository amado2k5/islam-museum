summary:
  ar: "أمير أفغانستان لأشهر من سنة 1879 (21 فبراير - 12 أكتوبر)، ابن الأمير شير علي خان وحفيد دوست محمد خان. عُيّن واليا على هراة صغيرا، وتمرد على أبيه وسُجن، ثم خلفه في الإمارة أثناء الحرب الإنجليزية الأفغانية الثانية ووقّع معاهدة غاندماك التي منحت بريطانيا السيطرة على العلاقات الخارجية الأفغانية، وتنازل بعد قتل المبعوث البريطاني كافانياري، ونُفي إلى الهند وبقي فيها حتى وفاته سنة 1923."
  en: "Emir of Afghanistan for a few months of 1879 (21 February – 12 October), a son of Emir Sher Ali Khan and a grandson of Dost Mohammad Khan. Appointed governor of Herat as a young man, he rebelled against his father and was imprisoned; he succeeded him during the Second Anglo-Afghan War and signed the Treaty of Gandamak, which gave Britain control of Afghan foreign relations; after the killing of the British envoy Cavagnari he abdicated, was exiled to India, and remained there until his death in 1923."
  ur: "افغانستان کے امیر 1879ء کے چند مہینوں کے لیے (21 فروری – 12 اکتوبر)، امیر شیر علی خان کے بیٹے اور دوست محمد خان کے پوتے۔ کم عمری میں ہرات کے گورنر مقرر ہوئے، والد کے خلاف بغاوت کی اور قید ہوئے؛ دوسری اینگلو افغان جنگ کے دوران والد کے جانشین بنے اور گندمک کا معاہدہ کیا جس سے افغانستان کے خارجہ تعلقات کا اختیار برطانیہ کو مل گیا؛ برطانوی ایلچی کاواگنری کے قتل کے بعد دستبردار ہوئے، ہندوستان جلاوطن کیے گئے اور 1923ء میں وفات تک وہیں رہے۔"
