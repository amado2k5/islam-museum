id: person/maqil-ibn-yasar
class: person
label: { ar: "معقل بن يسار", en: "Ma'qil ibn Yasar", es: "Ma'qil ibn Yasar", fr: "Ma'qil ibn Yasar", ur: "معقل بن یسار" }
summary:
  ar: "عند البلاذري عنه أن عمر شاور الهرمزان في البدء بأصبهان أو أذربيجان وشهد يوم نهاوند فأتى النعمان بن مقرن وبه رمق فغسل وجهه فبشره بالفتح فقال الحمد لله اكتبوا إلى عمر."
  en: "In al-Baladhuri, who related Umar's consultation of al-Hurmuzan and who witnessed Nihawand — he found al-Nu'man ibn Muqarrin breathing his last, washed his face, and gave him the glad tidings of victory, to which al-Nu'man said 'praise God; write to Umar.'"
  es: "En al-Baladhuri, quien relató la consulta de Umar con al-Hurmuzan y quien presenció Nihawand, encontró a al-Nu'man ibn Muqarrin agonizando, le lavó el rostro y le dio la buena noticia de la victoria, a lo que al-Nu'man respondió: \"Alabado sea Dios; escribe a Umar\"."
  fr: "Dans al-Baladhuri, qui a relaté la consultation d'al-Hurmuzan par Umar et qui a été témoin de Nihawand, il a trouvé al-Nu'man ibn Muqarrin rendant son dernier souffle, lui a lavé le visage et lui a annoncé la bonne nouvelle de la victoire, à laquelle al-Nu'man a répondu: « Louange à Dieu; écrivez à Umar. »"
  ur: "البلادوری میں، جس نے عمر کے الحرموزن کے بارے میں مشورہ کیا اور جس نے نہاوند کو دیکھا - اس نے نعمان بن مقرن کو آخری سانس لیتے ہوئے پایا، اس نے اپنا چہرہ دھویا، اور اسے فتح کی بشارت دی، جس پر النعمان نے کہا 'الحمد للہ؛ عمر کو لکھو۔"
