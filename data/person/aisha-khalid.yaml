summary:
  ar: "معلّمة قرآن تقدّم عبر قناتها «الإسلام مع عائشة» (Islam with Aisha) ترجمة القرآن كلمةً كلمة وتفسيره باللغة الأردية في دروس مباشرة موجهة إلى النساء، وتصف نفسها بأنها سيدة أعمال ومعلّمة للقرآن منذ سنوات ولها طالبات في أنحاء العالم."
  en: "Qur'an teacher who presents word-by-word Urdu translation and tafseer of the Qur'an in live classes for women on her channel Islam with Aisha; she describes herself as a businesswoman and a teacher of the Qur'an for many years, with students around the world."
  fr: "Enseignante du Coran qui propose une traduction mot à mot et un tafsir du Coran en ourdou dans des cours en direct pour femmes sur sa chaîne Islam with Aisha ; elle se décrit comme une femme d’affaires enseignant le Coran depuis de nombreuses années, avec des élèves dans le monde entier."
  ur: "معلمۂ قرآن، جو اپنے چینل «اسلام ود عائشہ» پر خواتین کے لیے براہِ راست کلاسوں میں قرآن کا لفظ بہ لفظ اردو ترجمہ اور تفسیر پیش کرتی ہیں؛ وہ خود کو کاروباری خاتون اور برسوں سے قرآن کی معلمہ بتاتی ہیں جن کی طالبات دنیا بھر میں ہیں۔"
  es: "Es una maestra del Corán que ofrece traducciones al urdu palabra por palabra y tafsir (exégesis) del Corán en clases en vivo para mujeres en su canal Islam with Aisha; se describe a sí misma como una empresaria y maestra del Corán desde hace muchos años, con estudiantes de todo el mundo."
  tr: "\"Aişe ile İslam\" adlı kanalında kadınlara yönelik canlı derslerde Kur'an'ın kelime kelime tercümesini ve yorumunu Urduca olarak sunan bir Kur'an öğretmeni, kendisini yıllardır dünyanın dört bir yanından öğrencileri olan bir iş kadını ve Kur'an öğretmeni olarak tanımlıyor."
  id: "Seorang guru Al-Quran yang, melalui saluran YouTube-nya “Islam with Aisha,” menyediakan terjemahan dan interpretasi Al-Quran kata demi kata dalam bahasa Urdu dalam pelajaran langsung yang ditujukan untuk wanita, menggambarkan dirinya sebagai seorang pengusaha dan guru Al-Quran selama bertahun-tahun dengan murid-murid di seluruh dunia."
