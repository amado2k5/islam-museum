summary:
  ar: "معماري مصري ⁦(1900–1989)⁩ رائد العمارة الطينية والتقنية الملائمة في القرن العشرين. صمّم قرية القرنة الجديدة لإسكان الفلاحين بمواد محلية وبناء تقليدي، وألّف كتاب «عمارة الفقراء» الذي صار مرجعًا عالميًا في العمارة المستدامة، ونال جائزة الأغا خان للعمارة سنة 1980."
  en: "Egyptian architect (1900–1989), pioneer of mud-brick architecture and appropriate technology in the twentieth century. He designed New Gourna village to house farmers with local materials and traditional building, authored Architecture for the Poor — a world reference in sustainable architecture — and won the Aga Khan Award for Architecture in 1980."
  ur: "مصری معمار ⁦(1900–1989)⁩ جو بیسویں صدی میں کچی اینٹ کے فنِ تعمیر اور مناسب ٹیکنالوجی کے بانی ہیں۔ انہوں نے کاشتکاروں کے لیے مقامی مواد اور روایتی تعمیر سے نیو گورنہ گاؤں ڈیزائن کیا، «عمارتِ فقراء» لکھی جو پائیدار فنِ تعمیر کا عالمی مرجع بنی اور 1980 میں آغا خان ایوارڈ برائے فنِ تعمیر جیتا۔"
