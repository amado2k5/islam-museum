summary:
  ar: "معماري مصري ⁦(1900–1989)⁩ رائد العمارة الطينية والتقنية الملائمة في القرن العشرين. صمّم قرية القرنة الجديدة لإسكان الفلاحين بمواد محلية وبناء تقليدي، وألّف كتاب «عمارة الفقراء» الذي صار مرجعًا عالميًا في العمارة المستدامة، ونال جائزة الأغا خان للعمارة سنة 1980."
  en: "Egyptian architect (1900–1989), pioneer of mud-brick architecture and appropriate technology in the twentieth century. He designed New Gourna village to house farmers with local materials and traditional building, authored Architecture for the Poor — a world reference in sustainable architecture — and won the Aga Khan Award for Architecture in 1980."
  ur: "مصری معمار ⁦(1900–1989)⁩ جو بیسویں صدی میں کچی اینٹ کے فنِ تعمیر اور مناسب ٹیکنالوجی کے بانی ہیں۔ انہوں نے کاشتکاروں کے لیے مقامی مواد اور روایتی تعمیر سے نیو گورنہ گاؤں ڈیزائن کیا، «عمارتِ فقراء» لکھی جو پائیدار فنِ تعمیر کا عالمی مرجع بنی اور 1980 میں آغا خان ایوارڈ برائے فنِ تعمیر جیتا۔"
  es: "Arquitecto egipcio (1900-1989), pionero de la arquitectura de adobe y de la tecnología apropiada en el siglo XX. Diseñó la aldea de Nueva Gourna para albergar a los agricultores con materiales locales y técnicas de construcción tradicionales, fue autor de Arquitectura para los pobres —una obra de referencia mundial en arquitectura sostenible— y ganó el Premio Aga Khan de Arquitectura en 1980."
  fr: "Architecte égyptien (1900-1989), pionnier de l'architecture en briques de terre crue et des technologies appropriées au XXe siècle. Il a conçu le village de New Gourna pour loger les agriculteurs avec des matériaux locaux et des techniques de construction traditionnelles, est l'auteur de Architecture pour les pauvres — une référence mondiale en matière d'architecture durable — et a remporté le prix Aga Khan d'architecture en 1980."
  tr: "Mısırlı bir mimar (1900–1989), yirminci yüzyılda kil ve uygun teknoloji mimarlığının öncüsü. Yeni Kurna köyünü çiftçilere yerel malzemeler ve geleneksel yapılar kullanarak barındıracak şekilde tasarladı, sürdürülebilir mimaride küresel bir referans haline gelen 'Fakirlerin Mimarisi' adlı kitabı yazdı ve 1980'de Aga Khan Mimarlık Ödülü'nü kazandı."
  id: "Seorang arsitek Mesir (1900–1989), pelopor arsitektur tanah liat dan teknologi yang sesuai pada abad kedua puluh. Ia merancang desa New Qurna untuk menampung para petani menggunakan bahan lokal dan konstruksi tradisional, menulis buku 'Arsitektur Orang Miskin,' yang menjadi referensi global dalam arsitektur berkelanjutan, dan memenangkan Penghargaan Aga Khan untuk Arsitektur pada tahun 1980."
