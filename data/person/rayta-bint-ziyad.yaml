  fr: "Rayta bint Ziyad ibn Abi Sufyan; elle prit congé pour construire un bain public à Bassora lors de la vague d'autorisations après la rupture du rendement de Muslim ibn Abi Bakra."
  ur: "رائتہ بنت زیاد ابن ابی سفیان؛ مسلم ابن ابی بکرہ کی پیداوار ٹوٹنے کے بعد اس نے اجازت کی لہر میں بصرہ کا غسل خانہ بنانے کی رخصت لی۔"
  tr: "Rayta bint Ziyad ibn Abi Sufyan; Basra'da bir hamam inşa etmek için izin istedi ve hamam hasadı sonrası Müslüman ibn Ebi Bakra tarafından izinler arasından kendisine izin verildi."
  id: "Rayta bint Ziyad ibn Abi Sufyan; ia meminta izin untuk membangun pemandian di Basra, dan ia mendapat izin di antara izin setelah panen pemandian pemandian oleh Muslim ibn Abi Bakrah."
