summary:
  ar: "ريطة بنت زياد بن أبي سفيان؛ استأذنت في بناء حمام بالبصرة فأذن لها في جملة الإذن بعد فشو غلة حمام مسلم بن أبي بكرة."
  en: "Rayta bint Ziyad ibn Abi Sufyan; she took leave to build a Basra bathhouse in the permission-wave after Muslim ibn Abi Bakra's yield broke."
