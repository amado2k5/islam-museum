summary:
  ar: "سبق قراخان ملك الترك بكاشغر؛ أول من أسلم من ملوك الترك بتركستان وتسمى عبد الملك، وكانت له تركستان وقاعدتها كاشغر وساغون وخيمو وما يتصل بها إلى أوان المفازة المتصلة بالصين، وكان يطيع بني سامان هو وعقبه يستنفرونهم في حروبهم."
  en: "Sabuq Qara Khan, king of the Turks at Kashghar; the first of Turkestan's Turkic kings to accept Islam, taking the name Abd al-Malik — his realm Kashghar, Saqun and Khimo reaching the desert fringes toward China, he and his heirs answering the Samanids' levies in their wars."
  es: "Sabuq Qara Khan, rey de los turcos en Kashgar; el primero de los reyes turcos de Turkestán en aceptar el Islam, adoptando el nombre de Abd al-Malik. Su reino, que abarcaba Kashgar, Saqun y Khimo, se extendía hasta los confines del desierto hacia China, y él y sus herederos respondían a las levas de los Samánidas en sus guerras."
  fr: "Sabuq Qara Khan, roi des Turcs de Kashghar; le premier des rois turcs du Turkestan à se convertir à l'islam, prenant le nom d'Abd al-Malik — son royaume de Kashghar, Saqun et Khimo s'étendant jusqu'aux confins du désert vers la Chine, lui et ses héritiers répondant aux levées des Samanides lors de leurs guerres."
