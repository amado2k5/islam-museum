summary:
  ar: "سبق قراخان ملك الترك بكاشغر؛ أول من أسلم من ملوك الترك بتركستان وتسمى عبد الملك، وكانت له تركستان وقاعدتها كاشغر وساغون وخيمو وما يتصل بها إلى أوان المفازة المتصلة بالصين، وكان يطيع بني سامان هو وعقبه يستنفرونهم في حروبهم."
  en: "Sabuq Qara Khan, king of the Turks at Kashghar; the first of Turkestan's Turkic kings to accept Islam, taking the name Abd al-Malik — his realm Kashghar, Saqun and Khimo reaching the desert fringes toward China, he and his heirs answering the Samanids' levies in their wars."
