provenance:
  layer: own-research
  source: "Her author page on quran-uni.com, the site of the Al-Jami' Channel for Quranic Sciences (read 26 October 2026), giving her full name, Asma bint Rashid Al-Ruwaished, and her book 'Hakatha Ashu ma'a al-Qur'an' (Dar al-Hadara, 2011); a Saudi consultation-directory page (jsatcs.com, February 2021) reproducing the listing of the Asiyah Centre for Educational and Family Consultations in Riyadh, which names her as the centre's supervisor and describes subscription to her women's mobile service; a thread on the Multaqa Ahl al-Tafsir forum reproducing the Asiyah Foundation's own announcements of its 1432 AH (2011) 'Lak Istajabna' campaign, in which she contributed to an episode of the Nasamat programme on Al-Majd channel and delivered a campaign lecture, and the foundation published her book of the campaign's name and distributed it free in Riyadh; a directory of Islamic mobile services (alkersh.com) whose 'Women's Mobile' entry names her as supervisor of the service and of the Asiyah Foundation; an excerpts page of her book 'Al-Tawakkul ala Allah' on kalemtayeb.com; an online book-library page for her book 'Madha an al-Yawm al-Akhir'; and a YouTube video titled 'Marafi al-Sakina — Dr Asma Al-Ruwaished', whose hosting channel could not be identified from the page as fetched. She is the subject of the female-list entry 'Asma Al-Ruwaished' (أسماء الرويشد), §3 row 175 of the handoff. No personal YouTube channel of hers could be verified — her video presence runs through television appearances and uploads by others — so the record rests on the press-and-profile ladder, as with other channel-less names on the list (the Farida Zomorod precedent, batch 34; the Neveen Mokhtar and Wafaa Abdel Salam records, batch 37). No Wikipedia article and no Wikidata item cover her. No trusted source gives a birth date, so no born block is recorded."
