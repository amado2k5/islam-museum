label:
  ar: «أسماء الرويشد»
  en: "Asma Al-Ruwaished"
  ur: «اسماء الرويشد»
summary:
  ar: «داعية وكاتبة سعودية ومستشارة أسرية وتربوية، المشرفة على مؤسسة آسية للاستشارات والتدريب وعلى مركزها للاستشارات التربوية والأسرية في الرياض، عُرفت بخدمة «جوال المرأة» للرسائل الموجهة إلى النساء، وبمحاضرات وحملات دعوية نسائية — منها حملة «لك استجبنا» سنة 1432هـ — وبكتب في التزكية والأسرة منها «هكذا عاشوا مع القرآن» و«التوكل على الله».»
  en: "A Saudi preacher, writer and family and educational counsellor, supervisor of the Asiyah Foundation for Consultations and Training and of its centre for educational and family consultations in Riyadh. She is known for the 'Women's Mobile' message service addressed to women, for lectures and dawah campaigns for women — among them the 'Lak Istajabna' campaign of 1432 AH (2011) — and for books on spiritual refinement and the family, among them 'Thus They Lived with the Qur'an' and 'Trust in God'."
  ur: «سعودی مبلغہ، مصنفہ اور خاندانی و تعلیمی مشیر؛ مؤسسہ آسیہ برائے مشاورت و تربیت اور ریاض میں اس کے مرکز برائے تعلیمی و خاندانی مشاورت کی نگران ہیں۔ وہ خواتین سے مخاطب «جوال المرأة» پیغام رسانی خدمت، خواتین کے لیے محاضرات اور دعوتی مہمات — جن میں 1432ھ کی مہم «لك استجبنا» شامل ہے — اور تزکیہ و خاندان پر کتابوں، جن میں «هكذا عاشوا مع القرآن» اور «التوكل على الله» شامل ہیں، کی وجہ سے معروف ہیں۔»
