summary:
  ar: "خرج بناحية اليمن والبوازيج والموصل أيام المنتصر فحكم واشتد أمره فيمن انضاف إليه من المحكمة من ربيعة والأكراد، فسرح إليه جيش عليه سما التركي فأسره وحمله فجاد عليه المنتصر بالعفو وأخذ عليه العهد وخلى سبيله، وقال وزيره إن لذة العفو أعذب من لذة التشفي وأقبح أفعال المقتدر الانتقام {cite:muruj-al-dhahab p. 520-521}."
  en: "The Haruri rebel of Yemen and the Bawazij — captured by Sama's army, pardoned and released by al-Muntasir {cite:muruj-al-dhahab p. 520-521}."
  fr: "Le rebelle Haruri du Yémen et les Bawazij – capturés par l’armée de Sama, graciés et libérés par al-Muntasir {cite:muruj-al-dhahab p. 520-521}."
  es: "El rebelde Haruri de Yemen y los Bawazij — capturados por el ejército de Sama, perdonados y liberados por al-Muntasir {cite:muruj-al-dhahab p. 520-521}."
  ur: "یمن کے حروری باغی اور بوازیج - ساما کی فوج کے ہاتھوں پکڑے گئے، المنتصر نے معاف کر دیا اور رہا کر دیا۔ 520-521}۔"
  tr: "Al-Muntasir döneminde Yemen, Al-Buwazaij ve Musul bölgelerine gitti ve Rabi'ah ile Kürtlerden saraydan katılanlar arasında etkisi sertleşti. Bir ordu Sama, Sama Türk'e karşı yürüdü, onu yakaladı ve ele geçirdi. Al-Muntassir ona af verdi, bir rehin verdi ve serbest bıraktı. Bakanı, affetmenin zevkinin yatıştırmanın zevkinden daha tatlı olduğunu ve yetenekli olanın en çirkin eylemlerinin Able-Takeker'in eylemleri olduğunu söyledi. {cite:muruj-al-dhahab, s. 520-521}."
  id: "Ia pergi ke wilayah Yaman, Al-Buwazaij, dan Mosul selama masa pemerintahan Al-Muntasir, di mana ia memerintah, dan pengaruhnya menjadi kuat di antara mereka yang bergabung dengannya dari istana Rabi'ah dan orang Kurdi. Sebuah pasukan berbaris melawannya melawan Sama, Sama, orang Turki, menangkapnya, dan membawanya. Al-Muntassir memberinya pengampunan, mengambil janji, dan membebaskannya. Menterinya berkata bahwa kesenangan pengampunan lebih manis daripada kesenangan menenangkan diri, dan perbuatan terburuk orang yang mampu adalah tindakan Sang Yang Mampu Mengambil Kata. {kutip:muruj-al-dhahab, hlm. 520-521}."
