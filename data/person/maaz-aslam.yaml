summary:
  ar: "شاب باكستاني بادر — مع الإندونيسي عرفيان أصافت — إلى مشروع قناة «تعليم القرآن مجانًا» (FreeQuranEducation) على يوتيوب، وهي قناة رسوم متحركة من إنتاج استوديو دار الأرقم الإندونيسي تعلّم الأطفال قراءة القرآن بمقاطع مصوَّرة مجانية بلا إعلانات، تُموَّل بالتمويل الجماعي وترجم متطوعون من اثنتي عشرة دولة موادّها؛ بلغ عدد مشتركي القناة نحو مليونين في أكتوبر 2026."
  en: "A Pakistani youth who initiated — with the Indonesian Erfian Asafat — the FreeQuranEducation YouTube channel, an animated channel produced by Indonesia's Darul Arqam Studio that teaches children to read the Quran through free, advertisement-free illustrated videos, funded by crowdfunding and translated by volunteers from twelve countries; the channel had about two million subscribers in October 2026."
  ur: "پاکستانی نوجوان جنہوں نے انڈونیشیا کے عرفیان اصافت کے ساتھ مل کر یوٹیوب چینل «فری قرآن ایجوکیشن» (FreeQuranEducation) کا آغاز کیا؛ یہ انڈونیشیا کے دار ارقم اسٹوڈیو کی تیار کردہ متحرک ویڈیوز کی قناة ہے جو بچوں کو مفت، اشتہار سے پاک مصور ویڈیوز کے ذریعے قرآن پڑھنا سکھاتی ہے، اس کی مالی معاونت اجتماعی چندے سے ہوتی ہے اور بارہ ممالک کے رضاکاروں نے اس کے مواد کا ترجمہ کیا؛ اکتوبر 2026 میں چینل کے سبسکرائبرز تقریباً دو ملین تھے۔"
