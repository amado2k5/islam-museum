summary:
  ar: "شاب باكستاني بادر — مع الإندونيسي عرفيان أصافت — إلى مشروع قناة «تعليم القرآن مجانًا» (FreeQuranEducation) على يوتيوب، وهي قناة رسوم متحركة من إنتاج استوديو دار الأرقم الإندونيسي تعلّم الأطفال قراءة القرآن بمقاطع مصوَّرة مجانية بلا إعلانات، تُموَّل بالتمويل الجماعي وترجم متطوعون من اثنتي عشرة دولة موادّها؛ بلغ عدد مشتركي القناة نحو مليونين في أكتوبر 2026."
  en: "A Pakistani youth who initiated — with the Indonesian Erfian Asafat — the FreeQuranEducation YouTube channel, an animated channel produced by Indonesia's Darul Arqam Studio that teaches children to read the Quran through free, advertisement-free illustrated videos, funded by crowdfunding and translated by volunteers from twelve countries; the channel had about two million subscribers in October 2026."
  ur: "پاکستانی نوجوان جنہوں نے انڈونیشیا کے عرفیان اصافت کے ساتھ مل کر یوٹیوب چینل «فری قرآن ایجوکیشن» (FreeQuranEducation) کا آغاز کیا؛ یہ انڈونیشیا کے دار ارقم اسٹوڈیو کی تیار کردہ متحرک ویڈیوز کی قناة ہے جو بچوں کو مفت، اشتہار سے پاک مصور ویڈیوز کے ذریعے قرآن پڑھنا سکھاتی ہے، اس کی مالی معاونت اجتماعی چندے سے ہوتی ہے اور بارہ ممالک کے رضاکاروں نے اس کے مواد کا ترجمہ کیا؛ اکتوبر 2026 میں چینل کے سبسکرائبرز تقریباً دو ملین تھے۔"
  es: "Un joven pakistaní, junto con el indonesio Erfian Asafat, creó el canal de YouTube FreeQuranEducation, un canal de animación producido por el estudio indonesio Darul Arqam que enseña a los niños a leer el Corán mediante vídeos ilustrados gratuitos y sin publicidad, financiado mediante micromecenazgo y traducido por voluntarios de doce países; el canal contaba con unos dos millones de suscriptores en octubre de 2026."
  fr: "Un jeune Pakistanais a lancé, avec l'Indonésien Erfian Asafat, la chaîne YouTube FreeQuranEducation, une chaîne d'animation produite par le studio indonésien Darul Arqam qui enseigne aux enfants à lire le Coran grâce à des vidéos illustrées gratuites et sans publicité, financées par le financement participatif et traduites par des bénévoles de douze pays; la chaîne comptait environ deux millions d'abonnés en octobre 2026."
  tr: "Genç bir Pakistanlı adam, Endonezyalı Arfian Asafat ile birlikte YouTube'da \"Free QuranEducation\" kanalının projesini başlattı; bu kanal, Endonezya'nın Dar Al-Arqam stüdyosu tarafından üretilen ve çocuklara reklamsız ücretsiz video klipler aracılığıyla Kur'an okumayı öğreten, kitlesel fonlama ile finanse edilen ve on iki ülkeden gönüllüler tarafından çevrilen animasyon kanalı; kanalın abone sayısı Ekim 2026'ya kadar yaklaşık iki milyona ulaştı."
  id: "Seorang pemuda Pakistan memulai — bersama Arfian Asafat asal Indonesia — proyek saluran \"Free QuranEducation\" di YouTube, sebuah saluran animasi yang diproduksi oleh studio Dar Al-Arqam Indonesia yang mengajarkan anak-anak membaca Al-Quran melalui video gratis tanpa iklan, didanai oleh crowdfunding dan diterjemahkan oleh relawan dari dua belas negara; jumlah pelanggan saluran tersebut mencapai sekitar dua juta pada Oktober 2026."
