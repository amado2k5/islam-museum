summary:
  ar: "سياسي وفيلسوف وكاتب بوسني، وُلد سنة 1925، أسّس حزب العمل الديمقراطي وقاد البوسنة والهرسك رئيسًا خلال حرب البوسنة (1990–1996) ووقّع اتفاق دايتون، وألّف كتاب «الإسلام بين الشرق والغرب» و«الإعلان الإسلامي»، وتوفي في سراييفو سنة 2003."
  en: "Bosnian politician, philosopher and author, born in 1925. He founded the Party of Democratic Action, led Bosnia and Herzegovina as president through the Bosnian War (1990-1996) and signed the Dayton Agreement. His books include Islam Between East and West and the Islamic Declaration. He died at Sarajevo in 2003."
  ur: "بوسنیائی سیاست دان، فلسفی اور مصنف، جو 1925 میں پیدا ہوئے۔ انہوں نے پارٹی آف ڈیموکریٹک ایکشن قائم کی، بوسنیائی جنگ کے دوران (1990–1996) بوسنیا و ہرزیگووینا کے صدر کی حیثیت سے ملک کی قیادت کی اور ڈیٹن معاہدے پر دستخط کیے۔ ان کی کتابوں میں «اسلام مشرق و مغرب کے درمیان» اور «اعلانِ اسلامی» شامل ہیں۔ 2003 میں سرائیوو میں وفات پائی۔"
