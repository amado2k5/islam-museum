summary:
  ar: "سياسي إندونيسي من قادة الاستقلال، وُلد في بادانغ بانجانغ بغرب سومطرة سنة 1909. اشتراكي درس في أمستردام ولايدن، ونظّم المقاومة ضد الاحتلال الياباني، فصار أول رئيس وزراء للجمهورية (1945–1947)، وأسّس الحزب الاشتراكي الإندونيسي، وسُجن دون محاكمة في عهد سوكارنو، وتوفي في منفاه بزيورخ سنة 1966."
  en: "Indonesian statesman and independence leader, born at Padang Panjang, West Sumatra, in 1909. A socialist educated at Amsterdam and Leiden, he organised resistance to the Japanese occupation, became the republic's first prime minister (1945–1947), founded the Indonesian Socialist Party, was imprisoned without trial under Sukarno, and died in exile at Zürich in 1966."
  ur: "انڈونیشی سیاست دان اور رہنما ئے آزادی، جو 1909ء میں مغربی سماٹرا کے پادانگ پانجانگ میں پیدا ہوئے۔ ایمسٹرڈیم اور لائیڈن سے تعلیم یافتہ سوشلسٹ؛ جاپانی قبضے کے خلاف مزاحمت منظم کی، جمہوریہ کے پہلے وزیرِ اعظم (1945ء–1947ء) بنے، انڈونیشی سوشلسٹ پارٹی قائم کی، سوکارنو کے دور میں بغیر مقدمے قید رہے، اور 1966ء میں زیورخ میں جلاوطنی کی حالت میں وفات پائی۔"
