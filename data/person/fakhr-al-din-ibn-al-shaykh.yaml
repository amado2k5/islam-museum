summary:
  ar: "ابن شيخ الشيوخ صدر الدين الجويني، نائب السلطنة؛ كان رئيساً محتشماً سيداً معظماً ذا عقل ورأي ودهاء وشجاعة وكرم؛ سجنه السلطان سنة أربعين وقاسى شدائد وبقي في الحسن ثلاث سنين ثم أخرجه وأنعم عليه وقدمه على الجيش؛ قاد فتح عسقلان وطبرية سنة أربع وأربعين، وكان بدمياط يوم نازلها الفرنج سنة سبع وأربعين، وطُعن يوم المنصورة فجاءته ضربتان في وجهه فسقط {cite:shadharat-dhahab p. 246-247}."
  en: "Son of shaykh al-shuyukh Sadr al-Din al-Juwayni — commander of the Ascalon conquest of 644, present at Damietta when the Franks landed, and killed at Mansura in Dhu al-Qa'da 647 by two blows to the face, after three years in al-Salih's prison had ended in command of the army {cite:shadharat-dhahab p. 246-247}."
  ur: "ایوبی دور کا سپہ سالار جو عسقلان اور منصورہ کی مہمات سے وابستہ تھا؛ منصورہ کی لڑائی میں مارا گیا۔ {cite:shadharat-dhahab}"
  es: "Hijo del jeque al-shuyukh Sadr al-Din al-Juwayni — comandante de la conquista de Ascalón de 644, presente en Damietta cuando desembarcaron los francos, y muerto en Mansura en Dhu al-Qa'da 647 por dos golpes en la cara, después de tres años en la prisión de al-Salih había terminado al mando del ejército {cite:shadharat-dhahab p. 246-247}."
  fr: "Fils du cheikh al-shuyukh Sadr al-Din al-Juwayni — commandant de la conquête d'Ascalon en 644, présent à Damiette lors du débarquement des Francs, et tué à Mansoura en Dhu al-Qa'da 647 par deux coups au visage, après trois ans passés dans la prison d'al-Salih, il avait pris le commandement de l'armée {cite:shadharat-dhahab p. 246-247}."
