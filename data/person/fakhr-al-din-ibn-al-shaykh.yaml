summary:
  ar: "ابن شيخ الشيوخ صدر الدين الجويني، نائب السلطنة؛ كان رئيساً محتشماً سيداً معظماً ذا عقل ورأي ودهاء وشجاعة وكرم؛ سجنه السلطان سنة أربعين وقاسى شدائد وبقي في الحسن ثلاث سنين ثم أخرجه وأنعم عليه وقدمه على الجيش؛ قاد فتح عسقلان وطبرية سنة أربع وأربعين، وكان بدمياط يوم نازلها الفرنج سنة سبع وأربعين، وطُعن يوم المنصورة فجاءته ضربتان في وجهه فسقط {cite:shadharat-dhahab p. 246-247}."
  en: "Son of shaykh al-shuyukh Sadr al-Din al-Juwayni — commander of the Ascalon conquest of 644, present at Damietta when the Franks landed, and killed at Mansura in Dhu al-Qa'da 647 by two blows to the face, after three years in al-Salih's prison had ended in command of the army {cite:shadharat-dhahab p. 246-247}."
