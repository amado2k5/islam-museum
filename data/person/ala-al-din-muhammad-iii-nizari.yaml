summary:
  ar: "بطاقة أولية لعلاء الدين محمد بن الحسن، إمام النزاريين وحاكم ألموت من سنة ١٢٢١م إلى ١٢٥٥م الذي في عهده بلغت الدعوة النزارية أوجها الأدبي وكانت آخر أعوام دولة ألموت؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ala al-Din Muhammad ibn Hasan, the Nizari imam and lord of Alamut from 1221 to 1255 whose reign saw the call's literary flowering in the state's last decades; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ala al-Din Muhammad ibn Hasan, el imán nizarí y señor de Alamut desde 1221 hasta 1255, cuyo reinado vio el florecimiento literario de la corriente en las últimas décadas del estado; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Ala al-Din Muhammad ibn Hasan, l'imam nizari et seigneur d'Alamut de 1221 à 1255, dont le règne a vu l'épanouissement littéraire de l'appel dans les dernières décennies de l'État; l'entrée du manuel dynastique n'est pas encore cochée sur la page."
  ur: "1221 سے 1255 تک الموت کے نزاری امام اور آقا علاء الدین محمد بن حسن کے لیے ڈرافٹ کارڈ جن کے دور حکومت نے ریاست کی آخری دہائیوں میں کال کے ادبی پھول کو دیکھا؛ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
