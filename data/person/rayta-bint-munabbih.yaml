summary:
  ar: "صحابية سهمية، والدة عبد الله بن عمرو بن العاص؛ أسلمت وبايعت، وذكر ابن سعد أن إسلامها كان يوم الفتح."
  en: "A Sahmiyya Companion, mother of Abd Allah ibn Amr ibn al-As; she embraced Islam and gave the pledge, and Ibn Sa'd reports her conversion on the day of the conquest of Mecca."
  ur: "سہمیہ صحابیہ، عبد اللہ بن عمرو بن العاص کی والدہ؛ مسلمان ہوئیں اور بیعت کی اور ابن سعد نے ان کے اسلام کی خبر دی۔"
  es: "Una compañera de la escuela Sahmiyya, madre de Abd Allah ibn Amr ibn al-As; abrazó el Islam e hizo el juramento, e Ibn Sa'd relata que su conversión tuvo lugar el día de la conquista de La Meca."
  fr: "Compagne de la Saxe, mère d'Abd Allah ibn Amr ibn al-As, elle embrassa l'islam et prêta serment d'allégeance; Ibn Sa'd rapporte sa conversion le jour de la conquête de La Mecque."
  tr: "Sahmiyye'nin kadın bir sahabesi, Abdullah ibn Amr ibn al-As'ın annesi; İslam'ı benimsedi ve bağlılık yemini etti. İbn Sa'd, onun dönüşümünün fetih günü olduğunu belirtti."
  id: "Seorang teman perempuan Sahmiyyah, ibu dari Abdullah ibn Amr ibn al-As; ia memeluk Islam dan bersumpah setia. Ibn Sa'd menyebutkan bahwa pertobatannya terjadi pada hari penaklukan."
