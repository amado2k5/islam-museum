id: person/rabi-ibn-al-ruwayya
class: person
label:
  ar: "الربيع بن الروية"
  en: "Rabi' ibn al-Ruwayya"
  ur: "ربیع بن الرویہ"
  es: "Rabi' ibn al-Ruwayya"
  fr: "Rabi' ibn al-Ruwayya"
summary:
  ar: "أخو أبي العشيرة بن الروية، أمره الهادي مع أخيه عبد الله بن الحسين بالنزول بصبل سنة 289هـ، ثم أمره بالمسير إلى أخيه أبي العشيرة بعسكره وبفرسان من الجعفري."
  en: "Brother of Abu al-Ushayra ibn al-Ruwayya, whom al-Hadi sent with Abdullah ibn al-Husayn to camp at Sabal in 289 AH and then ordered to go to his brother with his army and some Ja'fari horse."
  ur: "ابو العشیرہ بن الرویہ کے بھائی، جنہیں ہادی نے 289ھ میں عبداللہ بن الحسین کے ساتھ صبل میں پڑاؤ کے لیے بھیجا اور پھر حکم دیا کہ اپنے لشکر اور کچھ جعفری سواروں کے ساتھ اپنے بھائی کے پاس جائیں۔"
  es: "Hermano de Abu al-Ushayra ibn al-Ruwayya, a quien al-Hadi envió con Abdullah ibn al-Husayn a acampar en Sabal en el año 289 de la Hégira y luego ordenó que fuera a ver a su hermano con su ejército y algunos caballos Ja'fari."
  fr: "Frère d'Abu al-Ushayra ibn al-Ruwayya, qu'al-Hadi envoya avec Abdullah ibn al-Husayn camper à Sabal en 289 AH, puis lui ordonna d'aller auprès de son frère avec son armée et quelques chevaux Ja'fari."
  tr: "Ebu el-Aşira bin el-Ruvey'in kardeşi el-Hadi, kardeşi Abdullah bin el-Hüseyin ile birlikte, ona 289 Hicri yılında Sabl'da kamp kurmasını emretti, ardından ordusu ve süvarileriyle kardeşi Ebu el-Aşira'ya yürümesini emretti."
  id: "Saudara Abu al-Ashira ibn al-Ruwayh, al-Hadi, bersama saudaranya Abdullah ibn al-Husayn, memerintahkannya berkemah di Sabl pada tahun 289 H, lalu memerintahkannya untuk berbaris ke saudaranya Abu al-Ashira dengan pasukan dan kavaleri dari al-Ja'fari."
