summary:
  ar: "أخو أبي العشيرة بن الروية، أمره الهادي مع أخيه عبد الله بن الحسين بالنزول بصبل سنة 289هـ، ثم أمره بالمسير إلى أخيه أبي العشيرة بعسكره وبفرسان من الجعفري."
  en: "Brother of Abu al-Ushayra ibn al-Ruwayya, whom al-Hadi sent with Abdullah ibn al-Husayn to camp at Sabal in 289 AH and then ordered to go to his brother with his army and some Ja'fari horse."
  ur: "ابو العشیرہ بن الرویہ کے بھائی، جنہیں ہادی نے 289ھ میں عبداللہ بن الحسین کے ساتھ صبل میں پڑاؤ کے لیے بھیجا اور پھر حکم دیا کہ اپنے لشکر اور کچھ جعفری سواروں کے ساتھ اپنے بھائی کے پاس جائیں۔"
