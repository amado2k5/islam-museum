  ar: "الملك الظاهر هزبر الدين عبد الله وقيل يحيى بن إسماعيل الرسولي ملك اليمن؛ ملك في رجب سنة ثلاثين وثمانمائة وضعفت مملكته وخربت ممالك اليمن في أيامه لقلة محصوله بها من استيلاء العربان على أعمالها ولم يزل على ذلك إلى أن توفي يوم الخميس سلخ رجب سنة اثنتين وأربعين وثمانمائة وملك بعده ابنه الملك الأشرف إسماعيل وله نحو العشرين سنة فساءت سيرته {cite:shadharat-dhahab p. 243}."
  en: "Al-Zahir Yahya (or 'Abd Allah), Rasulid king of Yemen from Rajab 830; his reign saw the kingdom's ruin as tribal Arabs seized its revenues; died Thursday end-Rajab 842, succeeded by his twenty-year-old son al-Ashraf Isma'il whose conduct 'went bad' {cite:shadharat-dhahab p. 243}."
