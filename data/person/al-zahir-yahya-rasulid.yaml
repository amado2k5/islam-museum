summary:
  ar: "الملك الظاهر هزبر الدين عبد الله وقيل يحيى بن إسماعيل الرسولي ملك اليمن؛ ملك في رجب سنة ثلاثين وثمانمائة وضعفت مملكته وخربت ممالك اليمن في أيامه لقلة محصوله بها من استيلاء العربان على أعمالها ولم يزل على ذلك إلى أن توفي يوم الخميس سلخ رجب سنة اثنتين وأربعين وثمانمائة وملك بعده ابنه الملك الأشرف إسماعيل وله نحو العشرين سنة فساءت سيرته {cite:shadharat-dhahab p. 243}."
  en: "Al-Zahir Yahya (or 'Abd Allah), Rasulid king of Yemen from Rajab 830; his reign saw the kingdom's ruin as tribal Arabs seized its revenues; died Thursday end-Rajab 842, succeeded by his twenty-year-old son al-Ashraf Isma'il whose conduct 'went bad' {cite:shadharat-dhahab p. 243}."
  fr: "Al-Zahir Yahya (ou 'Abd Allah), roi rasoulide du Yémen à partir de Rajab 830 ; son règne a vu la ruine du royaume que les Arabes tribaux ont saisi ses revenus ; est mort jeudi fin Rajab 842, remplacé par son fils de vingt ans al-Ashraf Isma'il dont la conduite « allait mal » {cite:shadharat-dhahab p. 243}."
  es: "Al-Zahir Yahya (o 'Abd Allah), rey rasulí de Yemen desde Rajab 830; su reinado vio la ruina del reino cuando los árabes tribales se apoderaron de sus ingresos; murió el jueves de finales de Rajab 842, sucedido por su hijo de veinte años al-Ashraf Isma'il cuya conducta 'se desvió' {cita: shadharat-dhahab p. 243}."
  ur: "الظاہر یحییٰ ⁦(یا عبداللہ)⁩، رجب 830 سے یمن کا رسول بادشاہ؛ اس کے دور حکومت نے سلطنت کی بربادی کو دیکھا کیونکہ قبائلی عربوں نے اس کی آمدنی پر قبضہ کر لیا تھا۔ جمعرات کے آخر میں رجب 842 میں وفات پائی، ان کے بعد ان کے بیس سالہ بیٹے اشرف اسماعیل نے انتقال کیا جس کا طرز عمل 'خراب تھا'۔ 243}۔"
