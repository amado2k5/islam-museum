summary:
  ar: "نبي بعثه الله إلى بني حضورا وهو غير شعيب بن نويل صاحب مدين وبينهما مئون من السنين كما قال المسعودي، فلما اشتد كفرهم وجد في دعائهم وتوعدهم قتلوه من بعد ظهور معجزات كانت له، فلم يضع الله دمه وانتقم له على يد بختنصر {cite:muruj-al-dhahab p. 464}."
  en: "The prophet sent to Banu Hudura — distinct from Shu'ayb of Madyan by centuries; they killed him after his signs appeared, and Bukhtanassar avenged him at Barkhya's word {cite:muruj-al-dhahab p. 464}."
  es: "El profeta envió a Banu Hudura —distinto de Shu'ayb de Madyan por siglos—; lo mataron después de que aparecieron sus señales, y Bukhtanassar lo vengó por palabra de Barkhya {cite:muruj-al-dhahab p. 464}."
  fr: "Le prophète envoyé aux Banu Hudura — distincts des Shu'ayb de Madyan par des siècles; ils le tuèrent après l'apparition de ses signes, et Bukhtanassar le vengea sur la parole de Barkhya {cite:muruj-al-dhahab p. 464}."
  ur: "بنو ہدرہ کی طرف نبی بھیجا جو صدیوں کے لحاظ سے مدین کے شعیب سے ممتاز تھا۔ انہوں نے اس کے آثار ظاہر ہونے کے بعد اسے قتل کر دیا، اور بختنصر نے برخیہ کے لفظ پر اس کا بدلہ لیا 464}۔"
