summary:
  ar: "ركسفورد نيوكومب، مؤرخ عمارة أمريكي، عاش من 1886 إلى 1968 بحسب ويكي داتا، وكان أستاذ تاريخ العمارة في جامعة إلينوي. ألّف سنة 1929 كراسة «البلاطات الزخرفية في شمال أفريقيا» عن عمارة المغرب الكبير وخزفه المعماري {cite:newcomb-decorative-tiles-north-africa-1929}."
  en: "Rexford Newcomb, an American architectural historian (1886-1968 per Wikidata) and professor of architectural history at the University of Illinois. In 1929 he wrote the monograph The Decorative Tiles of North Africa on Maghrebi architecture and architectural ceramics {cite:newcomb-decorative-tiles-north-africa-1929}."
  ur: "ریکسفورڈ نیوکومب، امریکی ماہر تاریخ تعمیرات، ویکی ڈیٹا کے مطابق 1886ء سے 1968ء تک، اور یونیورسٹی آف الینوائے میں تاریخ تعمیرات کے پروفیسر۔ 1929ء میں انہوں نے مغرب کی تعمیرات اور تعمیراتی چینی کے کام پر رسالہ شمالی افریقہ کی آرائشی ٹائلیں لکھا {cite:newcomb-decorative-tiles-north-africa-1929}."
