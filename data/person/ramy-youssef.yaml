summary:
  ar: "كوميدي وممثل وكاتب أمريكي من أصل مصري، وُلد في كوينز بنيويورك سنة 1991؛ صانع مسلسل «رامي» (2019–2022) وبطله، الذي يتناول حياة شاب مسلم أمريكي من الجيل الأول بين الإيمان والعائلة والهوية، ونال عنه جائزة غولدن غلوب وجائزة بيبودي، وشارك في صناعة مسلسل «مو» على نتفليكس."
  en: "American stand-up comedian, actor and writer of Egyptian origin, born in Queens, New York, in 1991. He created and starred in the Hulu series Ramy (2019–2022), about a first-generation Muslim-American negotiating faith, family and identity, winning a Golden Globe and a Peabody Award for it, and co-created the Netflix series Mo."
