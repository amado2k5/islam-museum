summary:
  ar: مغنٍّ وعازف كازاخي وُلد سنة 1994 في أكتوبه؛ اشتهر عالميًا بمداه الصوتي الواسع وبمشاركته في برنامج «المغني» الصيني سنة 2017، ويؤدي بأكثر من عشر لغات على مسارح العالم.
  en: Kazakh singer and multi-instrumentalist born in Aktobe in 1994; famed for a vocal range spanning several octaves and for his 2017 run on China's Singer competition, he performs in more than a dozen
    languages on world stages.
  ur: قازاق گلوکار اور کئی سازوں کا نواز جو 1994 میں اقتوبے میں پیدا ہوا؛ کئی اکٹیو کی آواز کی وسعت اور 2017 میں چینی مقابلہ Singer میں شرکت سے مشہور، وہ درجن سے زائد زبانوں میں عالمی اسٹیجوں پر پرفارم
    کرتا ہے۔
  es: "Cantante y multiinstrumentista kazajo nacido en Aktobe en 1994; famoso por su rango vocal que abarca varias octavas y por su participación en el concurso chino Singer de 2017, actúa en más de una docena de idiomas en escenarios de todo el mundo."
  fr: "Chanteur et multi-instrumentiste kazakh né à Aktobe en 1994; célèbre pour son étendue vocale de plusieurs octaves et pour sa participation à l'émission chinoise Singer en 2017, il se produit sur les scènes du monde entier dans plus d'une douzaine de langues."
  tr: "1994 Ekim ayında doğan Kazak şarkıcı ve müzisyen olan Sher, geniş vokal yelpazesi ve 2017'de Çin programı \"The Singer\"a katılımıyla uluslararası üne kavuştu; dünya çapında ondan fazla dilde sahnelerde performans sergiledi."
  id: "Seorang penyanyi dan musisi Kazakhstan, lahir pada tahun 1994 pada bulan Oktober, ia menjadi terkenal secara internasional karena jangkauan vokalnya yang luas dan partisipasinya dalam program Tiongkok \"The Singer\" pada tahun 2017, tampil dalam lebih dari sepuluh bahasa di panggung di seluruh dunia."
