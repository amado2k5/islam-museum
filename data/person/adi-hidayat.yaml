summary:
  ar: "داعية ومربٍّ إندونيسي وُلد في بانديغلانغ ببنتن سنة 1984، تعلّم في معهد دار الأرقم المحمدي في غاروت ثم في كلية الدعوة الإسلامية بطرابلس في ليبيا، وأسس سنة 2013 معهد كوانتم أخيار للدراسات الإسلامية، ويشغل منصب نائب رئيس مجلس التبليغ في قيادة المحمدية المركزية (2022–2027)، واشتهر بدروسه المنهجية في التفسير والحديث عبر قناته على يوتيوب."
  en: "Indonesian preacher and educator born in Pandeglang, Banten, in 1984. He studied at the Darul Arqam Muhammadiyah pesantren in Garut and at the International Islamic Call College in Tripoli, Libya, founded the Quantum Akhyar Institute in 2013, and serves as a vice-chairman of the preaching assembly of Muhammadiyah's central board (2022–2027). He is known for systematic lessons in Qur'an commentary and hadith on his YouTube channel."
  ur: "انڈونیشی مبلغ و معلم، جو 1984ء میں بنتن کے شہر پاندیگلانگ میں پیدا ہوئے۔ گاروت کے دار الارقم محمدیہ مدرسے اور طرابلس ⁦(لیبیا)⁩ کے بین الاقوامی اسلامی دعوہ کالج میں تعلیم پائی، 2013ء میں کوانٹم اخیار انسٹی ٹیوٹ قائم کیا، اور محمدیہ کی مرکزی قیادت کے مجلسِ تبلیغ کے نائب صدر ہیں ⁦(2022ء–2027ء)⁩۔ اپنے یوٹیوب چینل پر تفسیر و حدیث کے باقاعدہ دروس سے شہرت پائی۔"
