summary:
  ar: "داعية ومربٍّ إندونيسي وُلد في بانديغلانغ ببنتن سنة 1984، تعلّم في معهد دار الأرقم المحمدي في غاروت ثم في كلية الدعوة الإسلامية بطرابلس في ليبيا، وأسس سنة 2013 معهد كوانتم أخيار للدراسات الإسلامية، ويشغل منصب نائب رئيس مجلس التبليغ في قيادة المحمدية المركزية (2022–2027)، واشتهر بدروسه المنهجية في التفسير والحديث عبر قناته على يوتيوب."
  en: "Indonesian preacher and educator born in Pandeglang, Banten, in 1984. He studied at the Darul Arqam Muhammadiyah pesantren in Garut and at the International Islamic Call College in Tripoli, Libya, founded the Quantum Akhyar Institute in 2013, and serves as a vice-chairman of the preaching assembly of Muhammadiyah's central board (2022–2027). He is known for systematic lessons in Qur'an commentary and hadith on his YouTube channel."
  fr: "Prédicateur et éducateur indonésien né à Pandeglang, Banten, en 1984. Formé au pesantren Darul Arqam Muhammadiyah de Garut et à l'International Islamic Call College de Tripoli en Libye, il fonda le Quantum Akhyar Institute en 2013 et est vice-président de l'assemblée de prédication du bureau central de Muhammadiyah (2022–2027). Connu pour ses leçons systématiques de commentaire coranique et de hadith sur sa chaîne YouTube."
  ur: "انڈونیشی مبلغ و معلم، جو 1984ء میں بنتن کے شہر پاندیگلانگ میں پیدا ہوئے۔ گاروت کے دار الارقم محمدیہ مدرسے اور طرابلس ⁦(لیبیا)⁩ کے بین الاقوامی اسلامی دعوہ کالج میں تعلیم پائی، 2013ء میں کوانٹم اخیار انسٹی ٹیوٹ قائم کیا، اور محمدیہ کی مرکزی قیادت کے مجلسِ تبلیغ کے نائب صدر ہیں ⁦(2022ء–2027ء)⁩۔ اپنے یوٹیوب چینل پر تفسیر و حدیث کے باقاعدہ دروس سے شہرت پائی۔"
  es: "Predicador y educador indonesio nacido en Pandeglang, Banten, en 1984. Estudió en el pesantren Darul Arqam Muhammadiyah en Garut y en el International Islamic Call College en Trípoli, Libia. Fundó el Instituto Quantum Akhyar en 2013 y se desempeñó como vicepresidente de la asamblea de predicación de la junta central de Muhammadiyah (2022-2027). Es conocido por sus lecciones sistemáticas sobre comentarios del Corán y hadices en su canal de YouTube."
  tr: "1984 yılında Endonezya'nın Banten şehrine bağlı Pandeglang'da doğan, vaiz ve eğitimci Quantum Akhyar, Garut'taki Darul Arqam Al-Muhammadi Enstitüsü'nde ve ardından Libya'nın Trablus kentindeki İslam Davet Koleji'nde eğitim gördü. 2013 yılında Quantum Akhyar İslam Araştırmaları Enstitüsü'nü kurdu. Muhammediye Merkez Komutanlığı'nda Tebliğ Konseyi Başkan Yardımcılığı görevini (2022-2027) yürüten Quantum Akhyar, YouTube kanalında verdiği sistematik tefsir ve hadis dersleriyle tanınmaktadır."
  id: "Seorang pendakwah dan pendidik Indonesia, lahir di Pandeglang, Banten pada tahun 1984, ia menempuh pendidikan di Institut Darul Arqam Al-Muhammadi di Garut dan kemudian di Sekolah Tinggi Dakwah Islam di Tripoli, Libya. Pada tahun 2013, ia mendirikan Institut Studi Islam Quantum Akhyar. Ia menjabat sebagai Wakil Presiden Dewan Tabligh di Komando Pusat Muhammadiyah (2022–2027), dan terkenal dengan pelajaran tafsir dan hadits yang sistematis melalui saluran YouTube-nya."
