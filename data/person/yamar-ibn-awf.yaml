summary:
  en: "The Bakr ibn Abd Manaf arbiter who judged between Qusayy and Khuzaʾa that Qusayy was worthier of the Kaaba and Mecca, laying the blood Qusayy had spilled beneath his feet, i.e. waived, while awarding blood-money for Khuzaʾa’s dead; from that ruling he was called al-Shaddakh."
  ar: "الحكم من بني بكر بن عبد مناف الذي قضى أن قصياً أولى بالكعبة وأمر مكة من خزاعة، وجعل كل دم أصابه قصي موضوعاً مشدّخاً تحت قدميه وما أصابت خزاعة وبنو بكر فيه الدية؛ فسُمي يومئذ الشدّاخ."
