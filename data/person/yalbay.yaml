summary:
  ar: "الملك الظاهر بلباي المؤيدي؛ تسلطن في يوم وفاة خشقدم السبت عاشر ربيع الأول سنة اثنتين وسبعين وثمانمائة وهو الرابع عشر من ملوك الجراكسة وأولادهم وكان ضعيفاً عن تدبير الملك وتنفيذ الأمور فخلعه الأمراء من السلطنة في يوم السبت لسبع مضين من جمادى الأولى فكانت مدة سلطنته شهرين إلا أربعة أيام {cite:shadharat-dhahab p. 315}."
  en: "Yalbay al-Mu'ayyadi — the fourteenth Circassian king, enthroned the day Khushqadam died (Sat 10 Rabi' I 872) and deposed by the amirs after two months minus four days, 'too weak to run the kingship' {cite:shadharat-dhahab p. 315}."
  es: "Yalbay al-Mu'ayyadi — el decimocuarto rey circasiano, entronizado el día en que murió Khushqadam (Sábado 10 de Rabi' I de 872) y depuesto por los emires después de dos meses menos cuatro días, 'demasiado débil para gobernar' {cita: shadharat-dhahab pág. 315}."
  fr: "Yalbay al-Mu'ayyadi — le quatorzième roi circassien, intronisé le jour de la mort de Khushqadam (Sat 10 Rabi' I 872) et déposé par les émirs après deux mois moins quatre jours, « trop faible pour gouverner » {cite: shadharat-dhahab p. 315}."
  ur: "یالبی المعیادی - چودھویں سرکیسیائی بادشاہ، جس دن خوشقدم کی وفات ہوئی ⁦(بدھ 10 ربیع الاول 872)⁩ پر تخت نشین ہوا اور دو ماہ منفی چار دن کے بعد امیروں کے ذریعے معزول کر دیا گیا، 'بادشاہی چلانے کے لیے بہت کمزور' {حوالہ: شددرۃ ذہب صفحہ 315}۔"
  tr: "Kral Zahir Balbay al-Mu'ayyadi; Haşkadem'in ölüm günü, Rabi'al-Awwal'ın onuncu günü 872 Hicri Yılı'nda iktidara geldi. Çerkeslerin ve oğullarının on dördüncü kralıydı. Krallığı yönetmede ve işleri yürütmede zayıftı, bu yüzden prensler onu Cumada al-Awwal'ın yedinci Cumartesi günü sultanlıktan indirdiler, böylece hükümdarlığı iki aydan dört güne kadar sürdü {atıf:shadharat-dhahab, s. 315}."
  id: "Raja Zahir Balbay al-Mu'ayyadi; ia naik tahta pada hari kematian Khashqadam, Sabtu, tanggal sepuluh Rabi' al-Awwal tahun 872 H. Ia adalah raja keempat belas dari bangsa Circassia dan putra-putra mereka. Ia lemah dalam mengelola kerajaan dan menjalankan urusan, sehingga para pangeran mencopotnya dari kesultanan pada hari Sabtu, tanggal tujuh Jumada al-Awwal, sehingga pemerintahannya berlangsung antara dua bulan hingga empat hari {cite:shadharat-dhahab, hlm. 315}."
