  note: "Murdered in Muharram 1335 (November 1916) while wandering in the border villages near Qasr-e Shirin: after the 1915 Mohajarat he had joined the Committee for National Defence, skirmished with Russian forces, and retreated through Kermanshah to Kirkuk and Mosul; the Kurdish bandit Mohammad-Amin Talebani offered him overnight shelter and killed him and all his party the same night. The Persian article adds that his remains were brought back to Tabriz in 1354 Solar Hijri (1975/76) and buried in the family plot beside his daughter. The Hijri date is the sources' own."
