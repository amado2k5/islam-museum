  note: "Born at Tabriz, son of Haj Reza, a bricklayer. The Encyclopaedia Iranica gives 'born in Tabriz in the 1870s' and the English article 'c. 1870'; against them the Persian article's lead dates him from 1240 Solar Hijri (1861/62) and Wikidata carries 1861 and 1862. The record follows the scholarly tradition (about 1870) and discloses the Persian readings in full. The Hijri year 1287 is the derived conversion of 1870."
