    note: "Recorded under the SHIA-MAPPING RULE, with the mapping stated. Two independent traditions place Bagher Khan personally in the Mutasharri'a, the shari'a-minded of the two Twelver currents of Tabriz's lutis — the Mutasharri'a and the Sheikhiyya. (1) The Persian tradition: the Persian Wikipedia text states it of him personally — 'Bagher Khan, unlike Sattar Khan who was a Sheikhi, was of the Mutasharre'a, and sided with and respected the anti-constitutionalist ulama who were of the Mutasharre'a.' (2) The scholarly tradition: Abbas Amanat's Encyclopaedia Iranica entry says 'being himself from an orthodox (motasharreʿ) background but with an inclination to the pro-Constitution Shaikhi leader Seqat al-Eslam' — an inclination toward a Shaikhi leader, not a Shaikhi affiliation of his own. MAPPING: membership of the Mutasharri'a is attested by both traditions; the Mutasharri'a are a Twelver current (their Tabriz rivals the Sheikhiyya are the other, as the companion record of Sattar Khan sets out), so the value is recorded shia-twelver. Wikidata's single structured value (Shia Islam) is consistent and is not counted as a further attestation. No source names a legal school (madhhab) for him."
