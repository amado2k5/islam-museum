summary:
  ar: "قائد دستوري من تبريز (نحو 1870–1916)، بنّاء صار كبير لوطيي حي خيابان، ونال بصفته نائب ستارخان في دفاع تبريز 1908-09 لقب «سالار ملي» التشريفي؛ وبعد نفيه الفعلي إلى طهران عقب سنة 1910 انضم إلى لجنة الدفاع الوطني سنة 1915 وقُتل قرب قصر شيرين في نوفمبر 1916."
  en: "Constitutional-revolution commander of Tabriz (c. 1870–1916), a bricklayer who became chief luti of the Khiaban quarter and, as Sattar Khan's deputy in the defence of Tabriz in 1908-09, received the honorary title Salar-e Melli, 'National Chieftain'. Exiled in effect to Tehran after 1910, he joined the Committee for National Defence in 1915 and was murdered near Qasr-e Shirin in November 1916."
  ur: "تبریز کے آئینی انقلابی کمانڈر (تقریباً 1870–1916)؛ ایک معمار جو خیابان محلے کے لوطیوں کے سردار بنے اور 1908-09 میں تبریز کے دفاع میں ستار خان کے نائب کی حیثیت سے «سالارِ ملی» کا اعزازی خطاب پایا؛ 1910 کے بعد عملاً تہران میں جلا وطن رہے، 1915 میں قومی دفاع کمیٹی میں شامل ہوئے اور نومبر 1916 میں قصرِ شیرین کے قریب قتل ہوئے۔"
