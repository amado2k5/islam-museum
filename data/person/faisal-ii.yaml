summary:
  ar: "فيصل الثاني (2 مايو 1935 – 14 يوليو 1958)، آخر ملوك العراق من الأسرة الهاشمية. اعتلى العرش طفلًا في الثالثة بعد مقتل أبيه الملك غازي سنة 1939، وحكم تحت وصاية خاله الأمير عبد الإله حتى بلوغه سنة 1953، ثم قُتل مع أفراد من أسرته في قصر الرحاب ببغداد في ثورة 14 يوليو 1958 التي أنهت الملكية وأعلنت الجمهورية."
  en: "Faisal II (2 May 1935 – 14 July 1958) was the last king of Iraq of the Hashemite dynasty. He acceded at the age of three after his father King Ghazi was killed in 1939, reigned under the regency of his uncle Prince Abd al-Ilah until his majority in 1953, and was killed with members of his family at the Rihab Palace in Baghdad in the revolution of 14 July 1958, which abolished the monarchy and proclaimed the republic."
  ur: "فیصل دوم (2 مئی 1935ء – 14 جولائی 1958ء) ہاشمی خاندان کے عراق کے آخری بادشاہ تھے۔ وہ 1939ء میں اپنے والد بادشاہ غازی کے قتل کے بعد تین برس کی عمر میں تخت نشین ہوئے، 1953ء میں بالغ ہونے تک اپنے ماموں شہزادہ عبد الالٰہ کی سرپرستی میں رہے، اور 14 جولائی 1958ء کے انقلاب میں بغداد کے قصرِ رحاب میں اپنے خاندان کے افراد سمیت قتل ہوئے؛ اس انقلاب نے بادشاہت ختم کر کے جمہوریہ کا اعلان کیا۔"
