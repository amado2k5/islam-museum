summary:
  ar: قابلة ودبلوماسية صوماليلاندية وُلدت سنة 1937 في هرجيسا. مؤسِّسة مستشفى إدنا عدان للولادة، أول مبعوثة أممية من الصومال، ووزيرة خارجية صوماليلاند سابقة، ومن أشرس المناضلات ضد ختان الإناث.
  en: Somaliland nurse-midwife and diplomat, born 1937 in Hargeisa. Founder of the Edna Adan Maternity Hospital, the first Somali woman to serve as a UN envoy, former Foreign Minister of Somaliland, and
    a leading campaigner against female genital cutting.
  ur: صومالی لینڈ کی نرس-قابلة اور سفارت کار، 1937 میں ہرگیسہ میں پیدا ہوئیں۔ ایڈنا عدن میٹرنٹی ہسپتال کی بانی، اقوام متحدہ کی ایلچی بننے والی پہلی صومالی خاتون، صومالی لینڈ کی سابق وزیر خارجہ اور ختنہ
    کے خلاف مہم کی ممتاز قائد۔
  es: "Enfermera obstetra y diplomática de Somalilandia, nacida en 1937 en Hargeisa. Fundadora del Hospital de Maternidad Edna Adan, la primera mujer somalí en ser enviada de la ONU, exministra de Asuntos Exteriores de Somalilandia y destacada activista contra la mutilación genital femenina."
