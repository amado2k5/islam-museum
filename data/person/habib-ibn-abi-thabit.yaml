summary:
  ar: "أبو يحيى حبيب بن أبي ثابت من فقهاء التابعين؛ مات سنة سبع عشرة ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 44}. وقال أبو بكر بن عياش: ثلاثة ليس لهم رابع: حبيب بن أبي ثابت، والحكم بن عتيبة، وحماد بن أبي سليمان."
  tr: "Ebu Yahya Habib bin Ebi Tebit, Tabi'in'in hukukçularından biriydi; 171 Hicri yılında vefat etti {alıntı:tabaqat-fuqaha-abbas-1981, s. 44}. Ebu Bekir bin Ayyiş şöyle dedi: Üçünün dördüncüsü yoktur: Habib ibn Ebi Tebit, El-Hakam ibn Utaybe ve Hammad ibn Ebi Süleyman."
  id: "Abu Yahya Habib ibn Abi Thabit adalah salah satu ahli hukum Tabi'in; ia meninggal pada tahun 171 H {cite:tabaqat-fuqaha-abbas-1981, hlm. 44}. Abu Bakr ibn Ayyash berkata: Tiga tidak memiliki keempat: Habib ibn Abi Thabit, Al-Hakam ibn Utaybah, dan Hammad ibn Abi Sulayman."
