id: person/sad-al-khadim
class: person
label: { ar: "سعد الخادم" }
summary:
  ar: "عند البلاذري في رواية المقريزي: ولّاه المتوكل البجة وطريق ما بينها ومكة فولّى محمد القمي ذلك فعاد إليها ومعه علي بابا."
  en: "In al-Baladhuri via al-Maqrizi's version: al-Mutawakkil gave him the Buja and the road between it and Mecca; he gave Muhammad al-Qummi that, who returned there with Ali Baba."
  es: "En al-Baladhuri vía la versión de al-Maqrizi: al-Mutawakkil le dio la Buja y el camino entre ella y La Meca; Se lo dio a Muhammad al-Qummi, quien regresó allí con Ali Baba."
  fr: "Dans al-Baladhuri via la version d'al-Maqrizi: al-Mutawakkil lui a donné la Buja et la route entre elle et la Mecque; il l'a donné à Muhammad al-Qummi, qui y est revenu avec Ali Baba."
  ur: "البلادوری میں المقریزی کے نسخے کے ذریعے: المتوکل نے اسے بوجہ اور اس اور مکہ کے درمیان کا راستہ دیا۔ اس نے اسے محمد القمی کو دیا، جو علی بابا کے ساتھ وہاں واپس آیا۔"
  tr: "Al-Maqrizi'nin anlatımında Al-Baladhuri'ye göre: Al-Mutawakkil onu El-Bijah'a ve Mekke ile arasındaki güzergaha atadı, bu yüzden Muhammed el-Qummi onu oraya atadı, böylece Ali Baba ile birlikte oraya döndü."
  id: "Menurut Al-Baladhuri dalam riwayat Al-Maqrizi: Al-Mutawakkil menunjuknya ke Al-Bijah dan jalur antara kota itu dan Mekah, maka Muhammad al-Qummi menugaskannya ke sana, sehingga ia kembali ke sana bersama Ali Baba."
