summary:
  ar: "كاوس ملك أشروسنة؛ صالحه الفضل بن سهل على مال يؤديه أن لا يغزو المسلمون بلده فنقض حين قدم المأمون مدينة السلام وقتل ابنه حيدر قهرمانه الأثير فلما جيش عليه أحمد بن أبي خالد بالطريق المختصرة استسلم وورد مدينة السلام فأظهر الإسلام فملكه المأمون بلاده ثم ابنه حيدر."
  en: "Kawus, king of Ushrusana; he bought peace through al-Fadl ibn Sahl, broke it, lost his qahrman to son Haydar's blow, and yielded when Ahmad ibn Abi Khalid came by the short road — showing Islam at Baghdad he was reinstated, then Haydar after him."
  es: "Kawus, rey de Ushrusana, compró la paz a través de al-Fadl ibn Sahl, la rompió, perdió su qahrman por el golpe de su hijo Haydar y cedió cuando Ahmad ibn Abi Khalid llegó por el camino corto; al mostrar el Islam en Bagdad, fue reinstaurado, y luego Haydar después de él."
  fr: "Kawus, roi d'Ushrusana; il acheta la paix par l'intermédiaire d'al-Fadl ibn Sahl, la rompit, perdit son qahrman à cause du coup de son fils Haydar, et céda lorsqu'Ahmad ibn Abi Khalid arriva par la voie courte — montrant l'Islam à Bagdad, il fut rétabli dans ses fonctions, puis Haydar après lui."
