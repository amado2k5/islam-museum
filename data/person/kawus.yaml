class: person
label: { ar: "كاوس ملك أشروسنة", en: "Kawus, King of Ushrusana", es: "Kawus, King of Ushrusana", fr: "Kawus, King of Ushrusana", ur: "کاوس، عشروسانہ کا بادشاہ" }
summary:
  ar: "كاوس ملك أشروسنة؛ صالحه الفضل بن سهل على مال يؤديه أن لا يغزو المسلمون بلده فنقض حين قدم المأمون مدينة السلام وقتل ابنه حيدر قهرمانه الأثير فلما جيش عليه أحمد بن أبي خالد بالطريق المختصرة استسلم وورد مدينة السلام فأظهر الإسلام فملكه المأمون بلاده ثم ابنه حيدر."
  en: "Kawus, king of Ushrusana; he bought peace through al-Fadl ibn Sahl, broke it, lost his qahrman to son Haydar's blow, and yielded when Ahmad ibn Abi Khalid came by the short road — showing Islam at Baghdad he was reinstated, then Haydar after him."
  es: "Kawus, rey de Ushrusana, compró la paz a través de al-Fadl ibn Sahl, la rompió, perdió su qahrman por el golpe de su hijo Haydar y cedió cuando Ahmad ibn Abi Khalid llegó por el camino corto; al mostrar el Islam en Bagdad, fue reinstaurado, y luego Haydar después de él."
  fr: "Kawus, roi d'Ushrusana; il acheta la paix par l'intermédiaire d'al-Fadl ibn Sahl, la rompit, perdit son qahrman à cause du coup de son fils Haydar, et céda lorsqu'Ahmad ibn Abi Khalid arriva par la voie courte — montrant l'Islam à Bagdad, il fut rétabli dans ses fonctions, puis Haydar après lui."
  ur: "کاوس، عشروسن کا بادشاہ؛ اس نے الفضل بن سہل کے ذریعے امن خریدا، اسے توڑ دیا، اپنے بیٹے حیدر کی ضرب سے قاہرمان سے ہاتھ دھو بیٹھا، اور جب احمد بن ابی خالد مختصر راستے سے آیا تو اس نے بغداد میں اسلام کو دکھایا، پھر حیدر اس کے بعد بحال ہوا۔"
  tr: "Aşrusna kralı Kawus; el-Fadl ibn Sahl, Müslümanların topraklarını işgal etmesini önlemek için onu para ile uzlaştırdı. Topraklarını kıran el-Memun barış şehrine gelip soylu kahramanı oğlu Haydar'ı öldürdüğünde parayı bozdu. Ahmed bin Ebi Halid kestirme yoldan ona saldırdığında, teslim oldu ve barış şehrine döndü, burada İslam'ı ilan etti. El-Memun onun topraklarını yönetti, ardından oğlu Haydar'ı yönetti."
  id: "Kawus, raja Ashrusna; al-Fadl ibn Sahl mendamaikannya dengan uang untuk mencegah Muslim menyerbu tanahnya. Ia memecahkannya ketika al-Ma'mun tiba di kota damai dan membunuh putranya Haidar, pahlawan mulianya. Ketika Ahmad ibn Abi Khalid menyerangnya melalui jalan pintas, ia menyerah dan kembali ke kota damai, di mana ia menyatakan Islam. Al-Ma'mun memerintah tanahnya dan kemudian putranya Haidar."
