summary:
  ar: "كاوس ملك أشروسنة؛ صالحه الفضل بن سهل على مال يؤديه أن لا يغزو المسلمون بلده فنقض حين قدم المأمون مدينة السلام وقتل ابنه حيدر قهرمانه الأثير فلما جيش عليه أحمد بن أبي خالد بالطريق المختصرة استسلم وورد مدينة السلام فأظهر الإسلام فملكه المأمون بلاده ثم ابنه حيدر."
  en: "Kawus, king of Ushrusana; he bought peace through al-Fadl ibn Sahl, broke it, lost his qahrman to son Haydar's blow, and yielded when Ahmad ibn Abi Khalid came by the short road — showing Islam at Baghdad he was reinstated, then Haydar after him."
