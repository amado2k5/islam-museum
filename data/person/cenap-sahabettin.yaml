summary:
  ar: "جناب شهاب الدين ⁦(وُلد في مناستر/بتولا في 21 مارس 1870 – توفي في إسطنبول في 12 فبراير 1934)⁩، شاعر وكاتب وطبيب عثماني ثم تركي، من أبرز أعلام أدب «ثروة الفنون»، اشتهر بقصيدته «ألحان الشتاء» وبكتب الرحلات منها «في طريق الحج» و«آفاق العراق» و«رسائل سورية» و«رسائل أوروبا»."
  en: "Cenap Şahabettin (born at Bitola on 21 March 1870 – died at Istanbul on 12 February 1934) was an Ottoman-Turkish poet, writer and physician, a leading representative of the Servet-i Fünun literature, known for the poem Elhan-ı Şita and for the travel books Hac Yolunda (1909), Afak-ı Irak (1917), Suriye Mektupları (1917) and Avrupa Mektupları (1919)."
  ur: "جناب شہاب الدین ⁦(پیدائش: بتولا/مناسطر، 21 مارچ 1870ء – وفات: استنبول، 12 فروری 1934ء)⁩، عثمانی و ترک شاعر، مصنف اور طبیب؛ «ثروتِ فنون» ادب کے نمایاں ترجمان، «الحانِ شتا» کے شاعر اور «حج یولوندا» و «آفاقِ عراق» جیسے سفرناموں کے مصنف۔"
  es: "Cenap Şahabettin (nacido en Bitola el 21 de marzo de 1870 - fallecido en Estambul el 12 de febrero de 1934) fue un poeta, escritor y médico turco-otomano, un destacado representante de la literatura Servet-i Fünun, conocido por el poema Elhan-ı Şita y por los libros de viajes Hac Yolunda (1909), Afak-ı Irak (1917), Suriye Mektupları (1917) y Avrupa Mektupları (1919)."
  fr: "Cenap Sahabettin (né à Bitola le 21 mars 1870 - décédé à Istanbul le 12 février 1934) était un poète, écrivain et médecin ottoman-turc, l'un des principaux représentants de la littérature Servet-i Fünun, connu pour le poème Elhan-ı Şita et pour les livres de voyage Hac Yolunda (1909), Afak-ı Irak (1917), Suriye Mektupları. (1917) et Avrupa Mektupları (1919)."
  tr: "Cenab Şihabeddin (21 Mart 1870'te Monaster/Batula'da doğdu – 12 Şubat 1934'te İstanbul'da öldü) Osmanlı şairi, yazarı, ardından Türk şairi, yazarı ve hekimiydi. 'Sanat Zenginliği' edebiyatının en önde gelen figürlerinden biriydi. 'Kışın Melodisi' adlı şiiri ve 'Hac Yolu'nda', 'Irak Ufukları', 'Suriye Mektupları' ve 'Avrupa Mektupları' gibi seyahat kitaplarıyla ünlüydü."
  id: "Jenab Shihab al-Din (lahir di Biara/Batula pada 21 Maret 1870 – meninggal di Istanbul pada 12 Februari 1934) adalah seorang penyair, penulis, dan kemudian penyair, penulis, dan dokter Turki Ottoman. Ia adalah salah satu tokoh paling menonjol dalam sastra 'Kekayaan Seni.' Ia terkenal dengan puisinya 'Melodies of Winter' dan buku-buku perjalanan seperti 'On the Pilgrimage Road,' 'Horizons of Iraq,' 'Syrian Letters,' dan 'Letters of Europe.'"
