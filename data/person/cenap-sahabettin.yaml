summary:
  ar: "جناب شهاب الدين (وُلد في مناستر/بتولا في 21 مارس 1870 – توفي في إسطنبول في 12 فبراير 1934)، شاعر وكاتب وطبيب عثماني ثم تركي، من أبرز أعلام أدب «ثروة الفنون»، اشتهر بقصيدته «ألحان الشتاء» وبكتب الرحلات منها «في طريق الحج» و«آفاق العراق» و«رسائل سورية» و«رسائل أوروبا»."
  en: "Cenap Şahabettin (born at Bitola on 21 March 1870 – died at Istanbul on 12 February 1934) was an Ottoman-Turkish poet, writer and physician, a leading representative of the Servet-i Fünun literature, known for the poem Elhan-ı Şita and for the travel books Hac Yolunda (1909), Afak-ı Irak (1917), Suriye Mektupları (1917) and Avrupa Mektupları (1919)."
  ur: "جناب شہاب الدین (پیدائش: بتولا/مناسطر، 21 مارچ 1870ء – وفات: استنبول، 12 فروری 1934ء)، عثمانی و ترک شاعر، مصنف اور طبیب؛ «ثروتِ فنون» ادب کے نمایاں ترجمان، «الحانِ شتا» کے شاعر اور «حج یولوندا» و «آفاقِ عراق» جیسے سفرناموں کے مصنف۔"
