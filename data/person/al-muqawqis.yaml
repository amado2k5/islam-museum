id: person/al-muqawqis
class: person
label: { ar: "الموقس", en: "The Muqawqis" }
summary:
  ar: "الموقس صاحب مصر؛ صالح عمرو بن العاص على أن يسير من الروم من أراد ويُقرّ من أراد الإقامة على أمر سمّاه وأن يُفرض على القبط ديناران فبلغ ذلك ملك الروم فتسخّطه وبعث الجيوش فأغلقوا باب الإسكندرية فخرج إليه الموقس سائلاً ثلاثاً: أن لا يبذل للروم مثل ما بذل له فإنهم قد استغشّوه، وأن لا ينقض بالقبط فإن النقض لم يأت من قبلهم، وإن مات فأن يُدفن في كنيسة بالإسكندرية ذكرها — فأجابه عمرو."
  en: "The Muqawqis, lord of Egypt; he compounded with Amr ibn al-As — the Romans free to depart or stay on stated terms, two dinars laid on the Copts — which Rome's king rejected in wrath, sending hosts who shut Alexandria's gate; the Muqawqis came out to Amr asking three things: offer the Romans nothing like what was offered him, for they had deceived him; never break with the Copts, since the breach came not from them; and on his death, burial in a named church of Alexandria — and Amr granted them."
