summary:
  ar: "المقريء القيرواني، مؤلف «تلخيص العبارات في القراءات»؛ قرأ على جماعة منهم أبو العباس أحمد بن نفيس؛ توفي في رجب سنة أربع عشرة وخمسمائة بالإسكندرية وهو في عشر الثمانين {cite:shadharat-dhahab p. 521}."
  en: "The Qayrawani muqri' Ibn Bulayma, author of Talkhis al-Ibarat fi'l-qira'at; d. Rajab 514 at Alexandria in his eighties {cite:shadharat-dhahab p. 521}."
  es: "el Qayrawani Muqri' Ibn Bulayma, autor de Talkhis al-Ibarat y al-Qira'at; d. Rajab 514 en Alejandría cuando tenía ochenta años {citar: shadharat-dhahab p. 521}."
  fr: "Le Qayrawani Muqri' Ibn Bulayma, auteur de Talkhis al-Ibarat et al-Qira'at; d. Rajab 514 à Alexandrie dans ses quatre-vingts ans {citer: shadharat-dhahab p. 521}."
  ur: "قاروانی مقری ابن بلیمہ، مصنف تالخیس الابرات فی القرات؛ d رجب 514 اسکندریہ میں اس کی دہائی میں 521}۔"
  tr: "\"Okumalarda Sözlerin Özeti\" adlı kitabın yazarı El-Muqriri El-Qayrawani; Ebu el-Abbas Ahmed ibn Nafis gibi bir gruptan eğitim aldı; Ceza beş yüz on dört H., İskenderiye'de Rajab'da seksen yaşında vefat etti {atıf:shadharat-dhahab, s. 521}."
  id: "Al-Muqriri Al-Qayrawani, penulis \"Ringkasan Frasa dalam Bacaan\"; ia belajar di bawah kelompok yang termasuk Abu al-Abbas Ahmad ibn Nafis; ia meninggal di Rajab pada tahun lima ratus empat belas AH di Alexandria, pada usia delapan puluh {cite:shadharat-dhahab, hlm. 521}."
