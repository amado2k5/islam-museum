summary:
  ar: "نصر بن منصور الحراني المعروف بابن العطار؛ كان تاجراً كبيراً كثير المال قارئاً للقرآن يكسو العراة ويفك الأسرى ويسمع الحديث ويزور العمالحين؛ قال العكبري رأيت النبي في المنام فقلت امسح بيدك على عيني فإنها تؤلمني فقال امض إلى أبي نصر بن العطار فقلت في نفسي أدع رسول الله وأروح إلى رجل من أبناء الدنيا فعاودته الثانية فقال أما سمعت الحديث إن الصدقة لتقع في يد الله قبل أن تقع في يد السائل ومنا نصر قد صافحت يده يد الحق فانتبهت ومضيت إليه فمسح على عيني وقرأ المعوذات فذهب الألم، وكان نصر بعد ذلك لا يعشى إلا وفي كمه الخبز إلى أن مات؛ ترجمته في أخبار سنة ثلاث وخمسين وخمسمائة {cite:shadharat-dhahab p. 648}."
  en: "Nasr ibn Mansur of Harran, known as Ibn al-Attar; a great merchant of much wealth, a Qur'an-reciter who clothed the naked, ransomed captives, heard hadith and visited the righteous — the Akbari dreamt the Prophet sent him to Ibn al-Attar for his ailing eye ('have you not heard that alms falls into God's hand before the beggar's — Nasr's hand has shaken the hand of the Truth'), and he wiped the eye reciting the Mu'awwidhat and the pain left; thereafter Nasr never took his evening meal without bread in his sleeve till he died; his notice falls in year 553 {cite:shadharat-dhahab p. 648}."
