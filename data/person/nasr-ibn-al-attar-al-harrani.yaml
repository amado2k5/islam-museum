names:
  - { value: "نصر بن منصور الحراني المعروف بابن العطار", kind: full }
summary:
  ar: "نصر بن منصور الحراني المعروف بابن العطار؛ كان تاجراً كبيراً كثير المال قارئاً للقرآن يكسو العراة ويفك الأسرى ويسمع الحديث ويزور العمالحين؛ قال العكبري رأيت النبي في المنام فقلت امسح بيدك على عيني فإنها تؤلمني فقال امض إلى أبي نصر بن العطار فقلت في نفسي أدع رسول الله وأروح إلى رجل من أبناء الدنيا فعاودته الثانية فقال أما سمعت الحديث إن الصدقة لتقع في يد الله قبل أن تقع في يد السائل ومنا نصر قد صافحت يده يد الحق فانتبهت ومضيت إليه فمسح على عيني وقرأ المعوذات فذهب الألم، وكان نصر بعد ذلك لا يعشى إلا وفي كمه الخبز إلى أن مات؛ ترجمته في أخبار سنة ثلاث وخمسين وخمسمائة {cite:shadharat-dhahab p. 648}."
  en: "Nasr ibn Mansur of Harran, known as Ibn al-Attar; a great merchant of much wealth, a Qur'an-reciter who clothed the naked, ransomed captives, heard hadith and visited the righteous — the Akbari dreamt the Prophet sent him to Ibn al-Attar for his ailing eye ('have you not heard that alms falls into God's hand before the beggar's — Nasr's hand has shaken the hand of the Truth'), and he wiped the eye reciting the Mu'awwidhat and the pain left; thereafter Nasr never took his evening meal without bread in his sleeve till he died; his notice falls in year 553 {cite:shadharat-dhahab p. 648}."
  es: "Nasr ibn Mansur de Harran, conocido como Ibn al-Attar; un gran comerciante de gran riqueza, recitador del Corán que vestía a los desnudos, rescataba cautivos, escuchaba hadices y visitaba a los justos. El Akbari soñó que el Profeta lo enviaba a Ibn al-Attar por su ojo enfermo («¿No has oído que la limosna cae en la mano de Dios antes que en la del mendigo? La mano de Nasr ha estrechado la mano de la Verdad»), y le limpió el ojo recitando el Mu'awwidhat y el dolor desapareció; a partir de entonces, Nasr nunca tomó su comida nocturna sin pan en la manga hasta que murió; su mención se encuentra en el año 553 {cite:shadharat-dhahab p. 648}."
  fr: "Nasr ibn Mansur de Harran, connu sous le nom d'Ibn al-Attar, était un grand marchand très riche, un récitateur du Coran qui habillait les démunis, rachetait les captifs, écoutait les hadiths et visitait les pieux. L'Akbari rêva que le Prophète l'envoyait auprès d'Ibn al-Attar pour soigner son œil malade (« N'as-tu pas entendu dire que l'aumône tombe entre les mains de Dieu avant celles du mendiant ? La main de Nasr a touché la main de la Vérité »). Il essuya son œil en récitant le Mu'awwidhat et la douleur disparut. Dès lors, Nasr ne prit plus jamais son repas du soir sans pain dans sa manche jusqu'à sa mort. Sa notice est datée de l'an 553 (cf. shadharat-dhahab, p. 648)."
  ur: "حران کے نصر بن منصور، ابن العطار کے نام سے مشہور؛ بہت زیادہ دولت کا سوداگر، قرآن کا قاری جس نے ننگے کپڑے پہنائے، قیدیوں کو فدیہ دیا، حدیثیں سنی اور صالحین کی عیادت کی - اکبری نے خواب میں دیکھا کہ نبی نے اسے ابن العطار کے پاس اس کی آنکھ کی خرابی کے لیے بھیجا ہے ⁦('کیا تم نے نہیں سنا کہ فقیر کے ہاتھ سے پہلے صدقہ اللہ کے ہاتھ میں جاتا ہے')⁩، اس نے ہاتھ ملایا، اور اس نے ناسخ کیا۔ معوذات پڑھتے ہوئے آنکھ اور درد رہ جاتا ہے۔ اس کے بعد نصر نے کبھی شام کا کھانا اپنی آستین میں روٹی کے بغیر نہیں لیا یہاں تک کہ وہ مر گیا۔ اس کا نوٹس 553 میں آتا ہے۔ 648}۔"
  tr: "Nasr bin Mansur al-Harrani, İbn al-Attar olarak bilinir, Kur'an okuyan, çıplak giydiren, esirleri serbest bırakan, hadisleri dinleyen ve işçi yetkililerini ziyaret eden zengin bir tüccardı. El-Ekbari şöyle dedi: Peygamber'i rüyamda gördüm ve dedim ki, 'Gözlerimi elinle sil, çünkü bana zarar veriyorlar.' Dedi ki, 'Ebu Nasr ibn al-Attar'a git.' Kendi kendime düşündüm, 'Elçi'yi bırak Allah ve dünyadan bir adama git.' Tekrar ettim. O dedi ki, 'Sadakatın dilencinin eline ulaşmadan önce Allah'ın eline geçtiğini hadisi duymadın mı? Buradan Nasr hakikatın eliyle tokalaştı, ben de fark ettim ve yanına gittim. Gözlerimi sildi ve Mu'avvidhat'ı okudu, acı kayboldu. Bundan sonra Nasr ölene kadar sadece ekmek kaldı; biyografisi Akhbar 553 {alıntı::] Shadharat-Dhahab, s. 648}."
  id: "Nasr ibn Mansur al-Harrani, yang dikenal sebagai Ibn al-Attar, adalah seorang pedagang kaya yang membaca Al-Qur'an, mengenakan pakaian telanjang, membebaskan tawanan, mendengarkan hadis, dan mengunjungi para pekerja. Al-Akbari berkata: Aku melihat Nabi dalam mimpi dan berkata, 'Lap mataku dengan tanganmu, karena itu menyakitiku.' Dia berkata, 'Pergilah kepada Abu Nasr ibn al-Attar.' Aku berpikir dalam hati, 'Tinggalkan Rasulullah dan pergilah kepada orang dari dunia.' Aku mengulanginya lagi. Dia berkata, 'Apakah kamu tidak pernah mendengar hadis bahwa amal jatuh ke tangan Allah sebelum sampai ke tangan pengemis? Dari sini, Nasr berjabat tangan dengan tangan kebenaran, jadi aku menyadari dan mendekatinya. Dia mengusap mataku dan membaca Mu'awwidhat, dan rasa sakit itu hilang. Setelah itu, Nasr hanya menyimpan roti sampai dia meninggal; biografinya dalam Akhbar 553 {cite:Shadharat-Dhahab, hlm. 648}."
