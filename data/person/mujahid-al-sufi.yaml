summary:
  ar: "مجاهد الصوفي، من المستأنسين بذكر الله المستوحشين من غيره، وروى عنه أبو تراب الزاهد قوله في اتخاذ الله صاحبًا، وترك الناس جانبًا، وأن من كان القرآن محدثه والملائكة جلساءه والله أنيسه فلا تخف عليه الضيعة."
  en: "Mujahid al-Sufi, who found intimacy in God's remembrance and estrangement from all else; Abu Turab al-Zahid relates his saying: take God as your companion, leave people aside, and whoever has the Qur'an as his speaker, the angels as his companions, and God as his intimate will not be harmed by loss."
  ur: "مجاہد صوفی اللہ کے ذکر سے انس اور اس کے سوا سے وحشت رکھتے تھے۔ ابو تراب زاہد نے ان کا قول نقل کیا: اللہ کو ساتھی بناؤ، لوگوں کو کنارے رکھو، اور جس کا محدث قرآن ہو، جس کے ساتھی فرشتے ہوں اور جس کا انیس اللہ ہو، اسے کھو جانے کا خوف نہیں ہوتا۔"
  es: "Mujahid al-Sufi, quien encontró intimidad en el recuerdo de Dios y se apartó de todo lo demás; Abu Turab al-Zahid relata su dicho: toma a Dios como tu compañero, deja a la gente a un lado, y quien tenga el Corán como su orador, a los ángeles como sus compañeros y a Dios como su íntimo no sufrirá daño por la pérdida."
  fr: "Mujahid al-Sufi, qui trouvait l'intimité dans le souvenir de Dieu et l'éloignement de tout le reste; Abu Turab al-Zahid rapporte sa parole: prenez Dieu pour compagnon, laissez les gens de côté, et quiconque a le Coran pour orateur, les anges pour compagnons et Dieu pour intime ne sera pas affecté par la perte."
  tr: "Mücahit el-Sufi, Allah'ı anmayı arayanlardan ve O'ndan kopanlardan biridir. Ebu Turab el-Zahid, Allah'ı arkadaş edinip insanları kenara bırakmakla ilgili sözünü ona aktardı; Kur'an'ın neyse, onun rivayetçisi ve melekler onun sahabeleridir, Allah onun sahabesidir, mülk onun için korkmaz."
  id: "Mujahid al-Sufi adalah salah satu yang mencari peringatan akan Allah dan mereka yang terlepas dari-Nya. Abu Turab al-Zahid menceritakan dari dia perkataannya tentang mengambil Tuhan sebagai sahabat dan meninggalkan orang-orang, dan bahwa siapa pun yang menjadi narator Al-Qur'an dan malaikat-malaikat adalah sahabatnya, dan Allah adalah sahabat-Nya, maka keluarga tidak akan takut padanya."
