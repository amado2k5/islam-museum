summary:
  ar: "مجاهد الصوفي، من المستأنسين بذكر الله المستوحشين من غيره، وروى عنه أبو تراب الزاهد قوله في اتخاذ الله صاحبًا، وترك الناس جانبًا، وأن من كان القرآن محدثه والملائكة جلساءه والله أنيسه فلا تخف عليه الضيعة."
  en: "Mujahid al-Sufi, who found intimacy in God's remembrance and estrangement from all else; Abu Turab al-Zahid relates his saying: take God as your companion, leave people aside, and whoever has the Qur'an as his speaker, the angels as his companions, and God as his intimate will not be harmed by loss."
  ur: "مجاہد صوفی اللہ کے ذکر سے انس اور اس کے سوا سے وحشت رکھتے تھے۔ ابو تراب زاہد نے ان کا قول نقل کیا: اللہ کو ساتھی بناؤ، لوگوں کو کنارے رکھو، اور جس کا محدث قرآن ہو، جس کے ساتھی فرشتے ہوں اور جس کا انیس اللہ ہو، اسے کھو جانے کا خوف نہیں ہوتا۔"
