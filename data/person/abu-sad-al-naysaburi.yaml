summary:
  ar: "محمد بن يحيى العلامة أبو سعد النيسابوري محيي الدين شيخ الشافعية وصاحب الغزالي؛ انتهت إليه رياسة المذهب بخراسان وقصده الفقهاء من البلاد وصنف التصانيف منها المحيط في شرح الوسيط؛ توفي في رمضان شهيداً على يد الغز عن اثنتين وسبعين سنة ورثاه جماعة منهم علي البيهقي {cite:shadharat-dhahab p. 631}."
  en: "Muhammad ibn Yahya, the allama Abu Sa'd of Nishapur, Muhyi al-Din — shaykh of the Shafi'is and al-Ghazali's companion; the madhhab's headship in Khurasan ended with him, jurists sought him from every land, and his works include the Muhit commentary on the Wasit; he died a martyr at the hands of the Ghuzz in Ramadan aged seventy-two, elegised by many including Ali al-Bayhaqi {cite:shadharat-dhahab p. 631}."
