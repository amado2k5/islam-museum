summary:
  ar: "محمد بن يحيى العلامة أبو سعد النيسابوري محيي الدين شيخ الشافعية وصاحب الغزالي؛ انتهت إليه رياسة المذهب بخراسان وقصده الفقهاء من البلاد وصنف التصانيف منها المحيط في شرح الوسيط؛ توفي في رمضان شهيداً على يد الغز عن اثنتين وسبعين سنة ورثاه جماعة منهم علي البيهقي {cite:shadharat-dhahab p. 631}."
  en: "Muhammad ibn Yahya, the allama Abu Sa'd of Nishapur, Muhyi al-Din — shaykh of the Shafi'is and al-Ghazali's companion; the madhhab's headship in Khurasan ended with him, jurists sought him from every land, and his works include the Muhit commentary on the Wasit; he died a martyr at the hands of the Ghuzz in Ramadan aged seventy-two, elegised by many including Ali al-Bayhaqi {cite:shadharat-dhahab p. 631}."
  fr: "Muhammad ibn Yahya, l'allama Abu Sa'd de Nishapur, Muhyi al-Din — shaykh des shafi'ites et compagnon d'al-Ghazali ; la direction de l'école au Khurasan aboutit à lui, des juristes de tous pays le recherchèrent, et ses ouvrages comprennent le Muhit, commentaire du Wasit ; il mourut martyr aux mains des Ghuzz en ramadan à soixante-douze ans, pleuré par beaucoup, dont Ali al-Bayhaqi {cite:shadharat-dhahab p. 631}."
  es: "Muhammad ibn Yahya, el allama Abu Sa'd de Nishapur, Muhyi al-Din, shaykh de los shafi'is y compañero de al-Ghazali; la dirección de la madhhab en Jorasán terminó con él, juristas de todas partes lo buscaban, y entre sus obras se incluye el comentario Muhit sobre el Wasit; murió mártir a manos del Ghuzz en Ramadán a la edad de setenta y dos años, y fue elogiado por muchos, incluido Ali al-Bayhaqi {cite:shadharat-dhahab p. 631}."
  ur: "محمد بن یحییٰ، علامہ ابو سعد نیشاپور، محی الدین - شافعیوں کے شیخ اور الغزالی کے ساتھی؛ خراسان میں مذھب کی سربراہی اس کے ساتھ ختم ہوئی، فقہا نے اسے ہر سرزمین سے تلاش کیا، اور ان کی تصانیف میں محیط تفسیر وصیت شامل ہیں۔ وہ 72 سال کی عمر میں رمضان المبارک میں غزوات کے ہاتھوں شہید ہوئے، جن میں علی البیحقی سمیت بہت سے لوگوں نے اس کی تعظیم کی تھی۔ 631}۔"
