  fr: "Fiche provisoire de Hamid al-Din al-Kirmani, le da'i ismaélien et philosophe du XIe siècle, auteur de Rahat al-Aql, mort en 1021; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "گیارہویں صدی کے اسماعیلی داعی اور راحت العقل کے فلسفی مصنف حامد الدین الکرمانی کے لیے ڈرافٹ کارڈ۔ 1021; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "On birinci yüzyılın İsmaili çağrıcısı ve filozofu ve 'Rahat al-Aql'in yazarı Hamid al-Din al-Kurmani'nin ön kartı; kendisi önemli kişilerin sözlüklerinde anılmakta olup, biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Hamid al-Din al-Kurmani, penelepon dan filsuf Ismaili abad kesebelas serta penulis 'Rahat al-Aql', yang meninggal pada tahun 1021 M; ia dikenang oleh kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
