summary:
  ar: "من ملوك حمير في الجاهلية؛ قُتل بعد أن أدبه قومه، وقال فيه: ربما أكل الكلب مؤدبه؛ فصار المثل في ما لا ينبغي أن يُعامل به أهل السلطان. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  en: "A pre-Islamic king of Himyar's line, killed by his own people; the proverb 'the dog sometimes eats its trainer' is attributed to his death. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  ur: "جاہلیت کے حمیر کے ایک بادشاہ؛ ان کی قوم کے ہاتھوں قتل ہوئے، اور ان کے قتل سے 'کتا کبھی اپنے تربیت دینے والے کو کھا جاتا ہے' کا مثل منسوب ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  es: "Un rey preislámico de la estirpe de Himyar, asesinado por su propio pueblo; el proverbio «a veces el perro se come a su amo» se atribuye a su muerte. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  fr: "Roi préislamique de la lignée d'Himyar, tué par son propre peuple; le proverbe « le chien mange parfois son maître » est lié à sa mort. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  tr: "İslam öncesi dönemde Himyar krallarından biriydi; halkı onu disipline ettikten sonra öldürüldü ve şöyle dedi: Belki köpek onun şeklini yedi; böylece hükümdarlara neyle muamele görmemesi gerektiğine dair bir atasözü oldu. {alıntı:nihayat-al-arab-nuwayri-cilt-s. 22}"
  id: "Ia adalah salah satu raja Himyar pada era pra-Islam; ia dibunuh setelah rakyatnya mendisiplinkannya, dan ia berkata: Mungkin anjing itu makan caranya; dengan demikian, ia menjadi peribahasa tentang apa yang tidak boleh diperlakukan kepada penguasa. {cite:nihayat-al-arab-nuwayri-vol3-scan hlm. 22}"
