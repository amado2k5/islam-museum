summary:
  ar: "من ملوك حمير في الجاهلية؛ قُتل بعد أن أدبه قومه، وقال فيه: ربما أكل الكلب مؤدبه؛ فصار المثل في ما لا ينبغي أن يُعامل به أهل السلطان. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  en: "A pre-Islamic king of Himyar's line, killed by his own people; the proverb 'the dog sometimes eats its trainer' is attributed to his death. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
  ur: "جاہلیت کے حمیر کے ایک بادشاہ؛ ان کی قوم کے ہاتھوں قتل ہوئے، اور ان کے قتل سے 'کتا کبھی اپنے تربیت دینے والے کو کھا جاتا ہے' کا مثل منسوب ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22}"
