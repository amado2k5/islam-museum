label: { ar: "أحمد بن إسرائيل", en: "Ahmad ibn Isra'il", fr: "Ahmad ibn Isra'il", es: "Ahmad ibn Isra'il", ur: "احمد بن اسرائیل" }
summary:
  ar: "وزير المعتز، استوزره المعتز سنة اثنتين وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.349}، وذكر الطبري أن صالح بن وصيف أخذه، ثم قُتل في رمضان سنة خمس وخمسين ومائتين مع أبي نوح {cite:tabari-tarikh-abu-al-fadl j.9 p.387} {cite:tabari-tarikh-abu-al-fadl j.9 p.396}."
  en: "Vizier of al-Mu'tazz, who appointed him in 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.349}. Al-Tabari reports that Salih ibn Wasif seized him, and he was then killed in Ramadan 255 together with Abu Nuh {cite:tabari-tarikh-abu-al-fadl j.9 p.387} {cite:tabari-tarikh-abu-al-fadl j.9 p.396}."
  fr: "Vizir d'al-Mu'tazz, qui le nomma en 252 H {cite:tabari-tarikh-abu-al-fadl j.9 p.349}. Al-Tabari rapporte que Salih ibn Wasif l'arrêta ; il fut ensuite tué en ramadan 255 H avec Abu Nuh {cite:tabari-tarikh-abu-al-fadl j.9 p.387} {cite:tabari-tarikh-abu-al-fadl j.9 p.396}."
  es: "Visir de al-Mu'tazz, quien lo nombró en 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.349}. Al-Tabari informa que Salih ibn Wasif lo apresó y luego fue asesinado en Ramadán de 255 junto con Abu Nuh {cite:tabari-tarikh-abu-al-fadl j.9 p.387} {cite:tabari-tarikh-abu-al-fadl j.9 p.396}."
  ur: "المعتز کا وزیر، جس نے اسے 252 میں مقرر کیا {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص349}۔ الطبری نے بیان کیا ہے کہ صالح بن واصف نے اسے پکڑ لیا اور پھر وہ ابو نوح کے ساتھ رمضان المبارک 255 میں قتل کر دیا گیا۔"
  tr: "Mu'tezz'in veziri olan Mu'tezz, onu 252 yılında atadı {kaynak:tabari-tarikh-abu-al-fadl c.9 s.349} ve Taberi, Salih bin Wasif'in onu yanına aldığını, daha sonra 255 yılının Ramazan ayında Ebu Nuh ile birlikte öldürüldüğünü belirtti {kaynak:tabari-tarikh-abu-al-fadl c.9 s.387} {kaynak:tabari-tarikh-abu-al-fadl c.9 s.396}."
  id: "Menteri Al-Mu’tazz, Al-Mu’tazz mengangkatnya pada tahun 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.349}, dan Al-Tabari menyebutkan bahwa Salih bin Wasif membawanya, kemudian dia terbunuh pada bulan Ramadan tahun 255 bersama Abu Nuh {cite:tabari-tarikh-abu-al-fadl j.9 p.387} {cite:tabari-tarikh-abu-al-fadl j.9 p.396}."
