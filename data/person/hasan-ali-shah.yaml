summary:
  ar: "أول من حمل لقب آغا خان من أئمة النزارية الإسماعيلية. بعد مقتل أبيه خليل الله سنة 1817 نال حظوة فتح علي شاه الذي زوّجه إحدى بناته، ثم ثار في كرمان سنة 1838، وفرّ إلى السند سنة 1840 حيث خدم في حملتها مع الجنرال نابيير، واستقر في بومباي من 1848، وتوفي سنة 1881 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "The first holder of the title Agha Khan among the Nizari Ismaili Imams. After his father Khalil Allah was murdered in 1817 he won the favour of Fath 'Ali Shah, who gave him a daughter in marriage. He revolted in Kirman in 1838, fled in 1840 to Sind, where he served Sir Charles Napier in the Sind campaign, and from 1848 lived in Bombay. He died in 1881 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  es: "Fue el primer imán ismaelita nizarí en ostentar el título de Agha Khan. Tras el asesinato de su padre, Khalil Allah, en 1817, se ganó el favor de Fath 'Ali Shah, quien le concedió una hija en matrimonio. Se sublevó en Kirman en 1838, huyó a Sind en 1840, donde sirvió a Sir Charles Napier en la campaña de Sind, y desde 1848 residió en Bombay. Falleció en 1881 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  fr: "Le premier à porter le titre d'Agha Khan parmi les imams ismaéliens nizarites. Après l'assassinat de son père, Khalil Allah, en 1817, il gagna la faveur de Fath 'Ali Shah, qui lui donna une fille en mariage. Il se révolta à Kirman en 1838, s'enfuit en 1840 au Sind, où il servit Sir Charles Napier lors de la campagne du Sind, et vécut à Bombay à partir de 1848. Il mourut en 1881."
  ur: "نزاری اسماعیلی اماموں میں سب سے پہلے آغا خان لقب کے حامل تھے۔ 1817 میں اپنے والد خلیل اللہ کے قتل کے بعد اس نے فتح علی شاہ کا حق جیت لیا، جس نے اس کی شادی میں ایک بیٹی کی تھی۔ اس نے 1838 میں کرمان میں بغاوت کی، 1840 میں سندھ بھاگ گیا، جہاں اس نے سندھ مہم میں سر چارلس نیپیئر کی خدمت کی، اور 1848 سے بمبئی میں مقیم رہے۔ ان کا انتقال 1881ء میں ہوا۔ 1 ص۔ 268}۔"
  tr: "Nizari İsmaili İmamları tarafından Aga Han unvanını taşıyan ilk kişi oydu. 1817'de babası Halilullah'ın suikasta uğramasının ardından, Fath Ali Şah'ın desteğini kazandı ve Şah onu kızlarından biriyle evlendirdi. 1838'de Kirman'da isyan etti ve 1840'ta Sindh'e kaçtı; burada General Napier ile birlikte Sindh'in seferinde görev yaptı. 1848'den itibaren Bombay'a yerleşti ve 1881'de öldü {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 268}."
  id: "Ia adalah yang pertama menyandang gelar Aga Khan dari Imam Nizari Ismaili. Setelah pembunuhan ayahnya Khalilullah pada tahun 1817, ia mendapatkan dukungan dari Fath Ali Shah, yang kemudian menikahkannya dengan salah satu putrinya. Ia kemudian memberontak di Kerman pada tahun 1838 dan melarikan diri ke Sindh pada tahun 1840, di mana ia bertugas dalam kampanye bersama Jenderal Napier. Ia menetap di Bombay sejak tahun 1848 dan meninggal pada tahun 1881 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 268}."
