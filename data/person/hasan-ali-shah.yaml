summary:
  ar: "أول من حمل لقب آغا خان من أئمة النزارية الإسماعيلية. بعد مقتل أبيه خليل الله سنة 1817 نال حظوة فتح علي شاه الذي زوّجه إحدى بناته، ثم ثار في كرمان سنة 1838، وفرّ إلى السند سنة 1840 حيث خدم في حملتها مع الجنرال نابيير، واستقر في بومباي من 1848، وتوفي سنة 1881 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "The first holder of the title Agha Khan among the Nizari Ismaili Imams. After his father Khalil Allah was murdered in 1817 he won the favour of Fath 'Ali Shah, who gave him a daughter in marriage. He revolted in Kirman in 1838, fled in 1840 to Sind, where he served Sir Charles Napier in the Sind campaign, and from 1848 lived in Bombay. He died in 1881 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
