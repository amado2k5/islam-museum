summary:
  ar: "شيخ الزاوية البلقايدية الهبرية بوهران وأحد أعلام الصوفية المالكية في الجزائر ⁦(28 أكتوبر 1937 – 26 فبراير 2025)⁩؛ وُلد في تلمسان وتلقّى العلم عن والده الشيخ محمد بلقايد وعمّه عبد القادر بن حاج، وكانت زاويته بسيدي معروف مركزًا للذكر وتفسير القرآن والإرشاد، وأرسى «الدروس المحمدية» الرمضانية التي جمعت علماء من الجزائر وخارجها لعقدين، وتوفي عن 88 عامًا وخلفه ابنه محمد نور الدين بلقايد."
  en: "Shaykh of the Belkaidia El-Hebria ⁦(Hibriyya)⁩ zawiya in Oran and a leading Maliki Sufi figure of Algeria ⁦(28 October 1937 – 26 February 2025)⁩. Born in Tlemcen and trained by his father Shaykh Mohamed Belkaid and his uncle Abdelkader Benhadj, his zawiya at Sidi Maârouf was a centre of dhikr, Qur'anic exegesis and moral guidance; he established the 'Dourous Mohammadia' Ramadan lectures gathering scholars from Algeria and abroad for two decades. He died aged 88 and was succeeded by his son Mohamed Noureddine Belkaid."
  fr: "Cheikh de la zaouïa Belkaïdia El-Hebria ⁦(Hibriyya)⁩ d'Oran et grande figure soufie malikite d'Algérie ⁦(28 octobre 1937 – 26 février 2025)⁩. Né à Tlemcen et formé par son père le cheikh Mohamed Belkaïd et son oncle Abdelkader Benhadj, il fit de sa zaouïa de Sidi Maârouf un centre de dhikr, d'exégèse coranique et d'orientation morale ; il institua les conférences de ramadan « Dourous Mohammadia », qui réunirent pendant deux décennies des savants d'Algérie et de l'étranger. Il mourut à 88 ans et eut pour successeur son fils Mohamed Noureddine Belkaïd."
  ur: "وہران ⁦(الباسک)⁩ کی زاویہ بلقایدیہ ہبریہ کے شیخ اور الجزائر کے مالکی صوفیائے کرام میں سے ایک ⁦(28 اکتوبر 1937 – 26 فروری 2025)⁩۔ تلمسان میں پیدا ہوئے، والد شیخ محمد بلقاید اور چچا عبدالقادر بن حاج سے علم پایا؛ ان کی زاویہ سیدی معروف ذکر، تفسیرِ قرآن اور اخلاقی رہنمائی کا مرکز رہی اور انہوں نے بیس برس تک «دروس محمدیہ» نامی رمضانی دروس کا اہتمام کیا۔ 88 برس کی عمر میں انتقال ہوا اور فرزند محمد نورالدین بلقاید جانشین ہوئے۔"
  es: "Shaykh de la zawiya Belkaidia El-Hebria (Hibriyya) en Orán y una figura sufí malikí destacada de Argelia (28 de octubre de 1937 - 26 de febrero de 2025). Nacido en Tlemcen y formado por su padre, el Shaykh Mohamed Belkaid, y su tío, Abdelkader Benhadj, su zawiya en Sidi Maârouf fue un centro de dhikr, exégesis coránica y guía moral. Durante dos décadas, fundó las conferencias de Ramadán «Dourous Mohammadia», que reunieron a eruditos de Argelia y del extranjero. Falleció a los 88 años y fue sucedido por su hijo, Mohamed Noureddine Belkaid."
  tr: "Oran'daki Balqaidiya el-Habriyye Zaviyesi Şeyhi ve Cezayir'deki Maliki Sufizminin önde gelen isimlerinden biri (28 Ekim 1937 – 26 Şubat 2025); Tlemcen'de doğdu ve ilim bilgisini babası Şeyh Muhammed Balqaid ve amcası Abdülkadir bin Hajj'dan aldı. Sidi Maarouf'taki zaviyesi, zikir, Kur'an tefsiri ve rehberlik merkeziydi. Ramazan ayında, yirmi yıl boyunca Cezayir ve yurt dışından alimleri bir araya getiren \"Muhammedîyye Dersleri\"ni kurdu. 88 yaşında vefat etti ve yerine oğlu Muhammed Nur Eddin Balqaid geçti."
  id: "Syekh dari Zawiya Balqaidiya al-Habriyya di Oran dan salah satu tokoh terkemuka Sufisme Maliki di Aljazair (28 Oktober 1937 – 26 Februari 2025); beliau lahir di Tlemcen dan menerima ilmu dari ayahnya, Syekh Muhammad Balqaid, dan pamannya, Abdul Qadir bin Hajj. Zawiya beliau di Sidi Maarouf merupakan pusat zikir, penafsiran Al-Qur'an, dan bimbingan. Beliau mendirikan \"Pelajaran Muhammadiyya\" selama Ramadan, yang mempertemukan para ulama dari Aljazair dan luar negeri selama dua dekade. Beliau wafat pada usia 88 tahun dan digantikan oleh putranya, Muhammad Nour Eddine Balqaid."
