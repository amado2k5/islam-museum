summary:
  ar: "محررة وناشرة وناشطة قرِمية تاتارية في حقوق المرأة، وُلدت في باغچه سراي سنة 1886 وتوفيت في إسطنبول سنة 1975. هي ابنة إسماعيل غسبرينسكي، وقد رأسَت تحرير مجلة «عالم نسوان» (عالم النساء) أول مجلة نسائية تركية في روسيا، وكانت عضوة في هيئة رئاسة الكورولتاي القِرمي ونائبة لدورتين في جمهورية القرم الشعبية سنة 1917، وحملت أرشيفًا وثائقيًا كبيرًا للحركة المسلمة في روسيا إلى منفاها في تركيا."
  en: "Crimean Tatar editor, publisher and women's-rights leader, born at Bakhchysarai in 1886 and died at Istanbul in 1975. The daughter of Ismail Gasprinsky, she was editor-in-chief and publisher of Alem-i Nisvan (Women's World), the first Turkic women's magazine in Russia, sat on the Presidency Council of the Crimean Kurultai and served two terms as a deputy of the Crimean People's Republic in 1917, and carried a large documentary archive of the Muslim movement in Russia into her Turkish exile."
  ur: "قریمی تاتار مدیرہ، ناشر اور خواتین کے حقوق کی رہنما، جو 1886 میں باغچہ سرائے میں پیدا ہوئیں اور 1975 میں استنبول میں وفات پائیں۔ اسماعیل گاسپرنسکی کی صاحبزادی تھیں؛ روس کے پہلے ترک خواتین کے رسالے «عالمِ نسوان» کی مدیرہ و ناشر رہیں، 1917 میں قریمی قورولتائی کی صدارتی مجلس کی رکن اور دو مدتوں تک نائب رہیں، اور روس کی مسلم تحریک کا بڑا دستاویزی ذخیرہ اپنے ساتھ ترکی جلاوطنی میں لے گئیں۔"
