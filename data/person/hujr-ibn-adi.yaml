label: { ar: "حجر بن عدي الكندي" }
summary:
  ar: "قُتل في سنة إحدى وخمسين مع أصحابه {cite:tabari-tarikh-abu-al-fadl j.5 p.253}. وعند المسعودي سمع ابن ملجم يمر بالأشعث وهو في المسجد يقول فضحك الصبح فقال حجر قتلته يا أعور قتلك الله، فكان ما سمع {cite:muruj-al-dhahab p. 702}"
  tr: "Elli birinci yılda, yoldaşlarıyla birlikte öldürüldü {atıf:tabari-tarikh-abu-al-fadl j.5 s.253}. El-Mes'udi'ye göre, İbn Mulcam, el-Eşat'ın camiden geçerken şöyle dediğini duymuştur: 'Sabah güldü ve dedi ki, 'Hacer, onu öldürdüm, ey tek gözlü, Allah seni korusun.' Duyduğu şey şuydu: {cite:muruj-al-dhahab s. 702}"
  id: "Ia dibunuh pada tahun lima puluh satu bersama para sahabatnya {cite:tabari-tarikh-abu-al-fadl j.5 hlm.253}. Menurut al-Mas'udi, Ibn Muljam mendengar Al-Ash'ath lewat di masjid berkata, 'Ia tertawa di pagi hari dan berkata, 'Hajar, aku membunuhnya, wahai yang bermata satu, semoga Allah membunuhmu.' Jadi yang ia dengar adalah {cite:muruj-al-dhahab hlm. 702}"
