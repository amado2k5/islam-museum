names:
  - { value: "أبو البركات عبد الوهاب بن المبارك بن أحمد الأنماطي الحافظ الحنبلي", kind: full }
summary:
  ar: "الحافظ الحنبلي أبو البركات عبد الوهاب بن المبارك الأنماطي مفيد بغداد؛ ولد في رجب سنة اثنتين وستين وأربعمائة وسمع الكثير وكتب بخطه الكثير وسمع العالي والنازل حتى قرأ على ابن الطيوري جميع ما عنده؛ قال ابن ناصر كان بقية الشيوخ ثقة ولم يتزوج قط، وقال أبو موسى المديني هو حافظ عصره بغداد، وذكره تلميذه ابن الجوزي في كتبه وأثنى عليه وقال كنت أقرأ عليه الحديث وهو يبكي فاستفدت ببكائه أكثر من استفادتي بروايته، ولم يغتب أحداً ولا يُغتاب عنده أحد وكان سهلاً في إعارة الأجزاء؛ توفي يوم الخميس حادي عشر المحرم سنة ثمان وثلاثين وخمسمائة ودفن بالشونيزية مقبرة أبي القاسم الجنيد غربي بغداد {cite:shadharat-dhahab p. 596-597}."
  en: "The Hanbali hafiz Abu al-Barakat Abd al-Wahhab ibn al-Mubarak al-Anmati, mufid of Baghdad; b. Rajab 462, he heard and wrote copiously till he read back to Ibn al-Tuyuri all that man had; Ibn Nasir calls him 'the remnant of the shaykhs' — he never married — and Abu Musa al-Madini 'the hafiz of Baghdad in his age'; his student Ibn al-Jawzi said 'I read hadith to him while he wept, and profited more from his weeping than from his transmission'; he never slandered nor suffered it in his hearing; d. Thursday 11 Muharram 538, buried at the Shuniziyya cemetery of Abu al-Qasim al-Junayd, western Baghdad {cite:shadharat-dhahab p. 596-597}."
