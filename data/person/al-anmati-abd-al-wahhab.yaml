summary:
  ar: "الحافظ الحنبلي أبو البركات عبد الوهاب بن المبارك الأنماطي مفيد بغداد؛ ولد في رجب سنة اثنتين وستين وأربعمائة وسمع الكثير وكتب بخطه الكثير وسمع العالي والنازل حتى قرأ على ابن الطيوري جميع ما عنده؛ قال ابن ناصر كان بقية الشيوخ ثقة ولم يتزوج قط، وقال أبو موسى المديني هو حافظ عصره بغداد، وذكره تلميذه ابن الجوزي في كتبه وأثنى عليه وقال كنت أقرأ عليه الحديث وهو يبكي فاستفدت ببكائه أكثر من استفادتي بروايته، ولم يغتب أحداً ولا يُغتاب عنده أحد وكان سهلاً في إعارة الأجزاء؛ توفي يوم الخميس حادي عشر المحرم سنة ثمان وثلاثين وخمسمائة ودفن بالشونيزية مقبرة أبي القاسم الجنيد غربي بغداد {cite:shadharat-dhahab p. 596-597}."
  en: "The Hanbali hafiz Abu al-Barakat Abd al-Wahhab ibn al-Mubarak al-Anmati, mufid of Baghdad; b. Rajab 462, he heard and wrote copiously till he read back to Ibn al-Tuyuri all that man had; Ibn Nasir calls him 'the remnant of the shaykhs' — he never married — and Abu Musa al-Madini 'the hafiz of Baghdad in his age'; his student Ibn al-Jawzi said 'I read hadith to him while he wept, and profited more from his weeping than from his transmission'; he never slandered nor suffered it in his hearing; d. Thursday 11 Muharram 538, buried at the Shuniziyya cemetery of Abu al-Qasim al-Junayd, western Baghdad {cite:shadharat-dhahab p. 596-597}."
  fr: "Le hafiz hanbalite Abu al-Barakat Abd al-Wahhab ibn al-Mubarak al-Anmati, mufid de Bagdad ; né en rajab 462 H, il écouta et écrivit abondamment jusqu’à avoir relu à Ibn al-Tuyuri tout ce que celui-ci possédait. Ibn Nasir l’appelle « le dernier des cheikhs » — il ne se maria jamais — et Abu Musa al-Madini « le hafiz de Bagdad de son époque ». Son élève Ibn al-Jawzi dit : « Je lui lisais le hadith tandis qu’il pleurait, et je tirais plus de profit de ses pleurs que de sa transmission. » Il ne médisait jamais et ne tolérait pas la médisance en sa présence ; mort le jeudi 11 muharram 538 H, enterré au cimetière Shuniziyya d’Abu al-Qasim al-Junayd, à l’ouest de Bagdad {cite:shadharat-dhahab p. 596-597}."
  es: "El hafiz hanbalí Abu al-Barakat Abd al-Wahhab ibn al-Mubarak al-Anmati, mufid de Bagdad; n. Rajab 462, escuchó y escribió profusamente hasta que le leyó a Ibn al-Tuyuri todo lo que aquel hombre sabía; Ibn Nasir lo llama 'el remanente de los shaykhs' —nunca se casó— y Abu Musa al-Madini 'el hafiz de Bagdad en su época'; su discípulo Ibn al-Jawzi dijo 'le leí hadices mientras lloraba, y aprendí más de su llanto que de su transmisión'; nunca calumnió ni lo toleró en su presencia; murió el jueves 11 de Muharram de 538, enterrado en el cementerio shuniziyya de Abu al-Qasim al-Junayd, al oeste de Bagdad {cite:shadharat-dhahab p. 596-597}."
  ur: "حنبلی حافظ ابو البرکات عبد الوہاب ابن المبارک الانمتی، مفتی بغداد؛ ب رجب 462، اس نے کافی سنا اور لکھا یہاں تک کہ اس نے ابن التیوری کو وہ سب کچھ پڑھ کر سنایا جو آدمی کے پاس تھا۔ ابن نصیر اسے 'شیخوں کا باقی ماندہ' کہتے ہیں - انھوں نے کبھی شادی نہیں کی - اور ابو موسیٰ المدینی 'اپنی عمر میں بغداد کا حافظ'۔ ان کے شاگرد ابن الجوزی نے کہا کہ میں نے ان سے حدیث پڑھی جب وہ روتے تھے اور ان کے رونے سے ان کی نشریات سے زیادہ فائدہ اٹھایا۔ اس نے کبھی غیبت نہیں کی اور نہ ہی اسے اپنی سماعت میں مبتلا کیا؛ d 11 محرم 538 بروز جمعرات، ابو القاسم الجنید، مغربی بغداد کے شنیضیہ قبرستان میں دفن ہوئے۔ 596-597}۔"
  tr: "Bağdat'ın hayırseveri Hanbeli âlimi Ebu el-Barakat Abdül-Vahhab ibn el-Mubarak el-Anmati, Hicri 462 yılının Receb ayında doğdu. Çok şey dinledi ve kendi el yazısıyla çok şey yazdı. İbn el-Tayyuri'nin kendisine aktardığı her şeyi okuyana kadar hem yüksek hem de düşük rivayet zincirlerini dinledi. İbn Nasır, onun güvenilir son şeyhlerden biri olduğunu ve hiç evlenmediğini söyledi. Ebu Musa el-Medini, onun Bağdat'ta zamanının en iyi ezbercisi olduğunu söyledi. Öğrencisi İbn el-Cevzi, kitaplarında ondan bahsetti ve onu övdü: \"Ona ağlarken hadis okurdum ve onun ağlamasından, rivayetinden daha çok fayda gördüm.\" Kimseyi gıybet etmedi, yanında da kimse gıybet edilmedi. Hadislerden parçalar ödünç vermekte cömertti. Hicri 538 yılının Muharrem ayının on birinci Perşembe günü vefat etti ve Bağdat'ın batısında bulunan Ebu el-Kâsım el-Cüneyd'in mezarlığı olan Şuniziyye'ye defnedildi. {cite:shadharat-dhahab s. 596-597}"
  id: "Ulama Hanbali Abu al-Barakat Abd al-Wahhab ibn al-Mubarak al-Anmati, dermawan Baghdad, lahir pada bulan Rajab tahun 462 H. Beliau banyak mendengar dan banyak menulis dengan tulisan tangannya sendiri. Beliau mendengar sanad yang tinggi dan rendah hingga membaca semua hadits yang disampaikan Ibn al-Tayyuri. Ibn Nasir mengatakan bahwa beliau adalah syekh terakhir yang dapat dipercaya dan beliau tidak pernah menikah. Abu Musa al-Madini mengatakan bahwa beliau adalah penghafal hadits terkemuka di zamannya di Baghdad. Muridnya, Ibn al-Jawzi, menyebutkan beliau dalam buku-bukunya dan memujinya, dengan mengatakan, “Saya biasa membacakan hadits kepadanya ketika beliau menangis, dan saya lebih banyak mendapat manfaat dari tangisannya daripada dari riwayatnya.” Beliau tidak pernah menggunjing siapa pun, dan tidak ada seorang pun yang digunjing di hadapannya. Beliau mudah dipinjamkan sebagian hadits. Beliau wafat pada hari Kamis, tanggal sebelas Muharram, tahun 538 Hijriah, dan dimakamkan di al-Shuniziyya, pemakaman Abu al-Qasim al-Junayd, sebelah barat Baghdad. {cite:shadharat-dhahab hlm. 596-597}"
