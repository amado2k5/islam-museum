summary:
  ar: "شهاب الدين ابن الهايم الملقب بالقائم؛ كان شاعر زمانه ولد سنة تسع وتسعين وسبعمائة واشتغل وفهم شيئاً من العلم وبرع في الشعر وفنونه وتفرد في آخر عمره وله ديوان كبير جميع شعره في غاية الحسن، توفي في جمادى الآخرة سنة سبع وثمانين وثمانمائة {cite:shadharat-dhahab p. 346}."
  en: "Ibn al-Hayyim 'al-Qa'im' (b. 799) — 'the poet of his age': a large diwan 'all in the utmost beauty', singular in his last years; died Jumada II 887 {cite:shadharat-dhahab p. 346}."
  es: "Ibn al-Hayyim 'al-Qa'im' (n. 799) — 'el poeta de su época': un gran diwan 'de la más alta belleza', singular en sus últimos años; murió en Jumada II 887 {cita:shadharat-dhahab p. 346}."
  fr: "Ibn al-Hayyim 'al-Qa'im' (né en 799) — 'le poète de son temps': un grand diwan 'tout dans la plus grande beauté', singulier dans ses dernières années; mort en Jumada II 887 {cite: shadharat-dhahab p. 346}."
  ur: "ابن الہیثم 'القائم' ⁦(وفات 799)⁩ - 'اپنے زمانے کا شاعر': ایک بڑا دیوان 'انتہائی خوبصورتی میں'، اپنے آخری سالوں میں واحد؛ متوفی جمادی الثانی 887۔ 346}۔"
  tr: "Şihabeddin İbn el-Hayyim, lakaplı adı El-Kaim, zamanının şairiydi. 799 Hicri yılında doğdu, bilgiye odaklandı, biraz bilgi edindi, şiir ve sanatlarında üstün oldu ve ilerleyen yıllarında eşsiz oldu. Şiirleri son derece güzellik taşıyan geniş bir koleksiyonu vardı. 887 Hicri yılında Cumedül-Ahira'da öldü {kaynak: şadharat-dhahab, s. 346}."
  id: "Shihab al-Din Ibn al-Hayyim, yang dijuluki Al-Qa'im, adalah seorang penyair pada zamannya. Ia lahir pada tahun 799 H, berfokus pada pengetahuan, menguasai beberapa pengetahuan, unggul dalam puisi dan seninya, dan menjadi unik di tahun-tahun terakhirnya. Ia memiliki koleksi besar, yang seluruh puisinya sangat indah. Ia meninggal di Jumada al-Akhirah pada tahun 887 H {cite:shadharat-dhahab, hlm. 346}."
