summary:
  ar: "روائي وكاتب مذكرات بريطاني ليبي، وُلد في نيويورك سنة 1970 لأب ليبي كان دبلوماسيًا. عادت الأسرة إلى طرابلس ثم فرّت إلى القاهرة سنة 1979، واختُطف والده هناك سنة 1990 ولم يُعثر عليه؛ وفازت مذكراته عن البحث عنه «العودة» (2016) بجائزة بوليتزر. من رواياته «في بلد الرجال» و«أصدقائي»."
  en: "British-Libyan novelist and memoirist, born in New York City in 1970, the son of a Libyan diplomat. The family returned to Tripoli, fled to Cairo in 1979, and his father was abducted there in 1990 and never found; his memoir of the search, The Return (2016), won the Pulitzer Prize. His novels include In the Country of Men and My Friends."
  ur: "برطانوی لیبیائی ناول نگار اور یادداشت نگار، 1970 میں نیویارک میں ایک لیبیائی سفارت کار کے ہاں پیدا ہوئے۔ خاندان طرابلس واپس گیا، 1979 میں قاہرہ فرار ہوا، اور 1990 میں وہاں ان کے والد کو اغوا کیا گیا جو کبھی نہ ملے؛ ان کی تلاش پر مبنی یادداشت «دی ریٹرن» (2016) نے پلیٹزر پرائز جیتا۔ ان کے ناولوں میں «ان دی کنٹری آف مین» اور «مائی فرینڈز» شامل ہیں۔"
