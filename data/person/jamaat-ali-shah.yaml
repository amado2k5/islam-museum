summary:
  ar: "عالم ومتصوف باكستاني (1834–1951) من علي بور سيدان في سيالكوت، من الطريقة النقشبندية. ترأس مؤتمر عموم الهند السني وأُعلن أمير الملة سنة 1935، وقاد حركة مسجد شهيد غنج في لاهور، وكان من قادة حركة باكستان المقربين من محمد علي جناح، وأسس جمعيات ومدارس ومئات المساجد."
  en: "Pakistani scholar and Sufi (1834–1951) of Alipur Sayyidan in Sialkot, of the Naqshbandi order. He presided over the All India Sunni Conference and was declared Ameer-e-Millat in 1935, led Lahore's Shaheed Ganj Mosque movement, was a leader of the Pakistan Movement close to Muhammad Ali Jinnah, and founded societies, madrasas and hundreds of mosques."
  ur: "پاکستانی عالم اور صوفی بزرگ (1834ء–1951ء) جن کا تعلق علی پور سیداں، ضلع سیالکوٹ سے تھا اور جو سلسلہ نقشبندیہ سے وابستہ تھے۔ آل انڈیا سنی کانفرنس کے صدر رہے اور 1935ء میں امیر ملت قرار پائے، لاہور کی مسجد شہید گنج تحریک کی قیادت کی، تحریکِ پاکستان کے قائدین میں سے تھے اور محمد علی جناح کے قریب رہے، اور انھوں نے انجمنیں، مدارس اور سیکڑوں مساجد قائم کیں۔"
