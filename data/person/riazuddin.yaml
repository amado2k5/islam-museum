summary:
  ar: "فيزيائي نظري باكستاني، وُلد في لوديانا سنة 1930 وتوفي في إسلام آباد سنة 2013. تلميذ عبد السلام، نال الدكتوراه من كامبريدج سنة 1959، وشارك في علاقة كي إس آر إف في فيزياء الجسيمات. أدار مجموعة الفيزياء النظرية في هيئة الطاقة الذرية الباكستانية (1974–1984) ويُعدّ من رواد برنامجي الأسلحة النووية والردع الباكستانيين الأوائل. وهو الشقيق التوأم للفيزيائي فياض الدين."
  en: "Pakistani theoretical physicist, born in Ludhiana in 1930 and died in Islamabad in 2013. A pupil of Abdus Salam, he took his Cambridge PhD in 1959 and co-authored the KSRF relation in particle physics. He directed the Theoretical Physics Group of the Pakistan Atomic Energy Commission (1974–1984) and is counted among the early pioneers of Pakistan's nuclear weapons and deterrence programmes. He was the twin brother of the physicist Fayyazuddin."
  ur: "پاکستانی نظریاتی طبیعیات دان، جو 1930ء میں لدھیانہ میں پیدا ہوئے اور 2013ء میں اسلام آباد میں وفات پائی۔ عبد السلام کے شاگرد، انھوں نے 1959ء میں کیمبرج سے پی ایچ ڈی کی اور ذرّاتی طبیعیات میں کے ایس آر ایف نسبت کے شریک مصنف رہے۔ وہ پاکستان جوہری توانائی کمیشن کے تھیوریٹیکل فزکس گروپ کے ڈائریکٹر (1974ء–1984ء) رہے اور پاکستان کے جوہری ہتھیار و بازدار پروگراموں کے اولین بانیوں میں شمار ہوتے ہیں۔ وہ طبیعیات دان فیاض الدین کے جڑواں بھائی تھے۔"
