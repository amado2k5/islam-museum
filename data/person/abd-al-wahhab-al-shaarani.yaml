summary:
  ar: "عبد الوهاب بن أحمد بن علي الحنفي نسبة إلى محمد ابن الحنفية، الشعراني، أبو محمد، من علماء المتصوفين، ولد في قلقشندة بمصر ونشأ بساقية أبي شعرة وتوفي في القاهرة؛ من 898هـ الموافقة 1493م إلى 973هـ الموافقة 1565م؛ صاحب لواقح الأنوار في طبقات الأخيار والميزان الكبرى واليواقيت والجواهر."
  en: "Abd al-Wahhab ibn Ahmad ibn Ali al-Hanafi, by descent from Muhammad ibn al-Hanafiyya, al-Sha'rani, Abu Muhammad, one of the scholars of the Sufis, born at Qalqashanda in Egypt, raised at Saqiyat Abi Sha'ra and died in Cairo; 898 AH, 1493 CE, to 973 AH, 1565 CE; author of Lawaqih al-anwar fi tabaqat al-akhyar, al-Mizan al-kubra and al-Yawaqit wa-l-jawahir."
