summary:
  ar: "عبد الوهاب بن أحمد بن علي الحنفي نسبة إلى محمد ابن الحنفية، الشعراني، أبو محمد، من علماء المتصوفين، ولد في قلقشندة بمصر ونشأ بساقية أبي شعرة وتوفي في القاهرة؛ من 898هـ الموافقة 1493م إلى 973هـ الموافقة 1565م؛ صاحب لواقح الأنوار في طبقات الأخيار والميزان الكبرى واليواقيت والجواهر."
  en: "Abd al-Wahhab ibn Ahmad ibn Ali al-Hanafi, by descent from Muhammad ibn al-Hanafiyya, al-Sha'rani, Abu Muhammad, one of the scholars of the Sufis, born at Qalqashanda in Egypt, raised at Saqiyat Abi Sha'ra and died in Cairo; 898 AH, 1493 CE, to 973 AH, 1565 CE; author of Lawaqih al-anwar fi tabaqat al-akhyar, al-Mizan al-kubra and al-Yawaqit wa-l-jawahir."
  fr: "Abd al-Wahhab ibn Ahmad ibn Ali al-Hanafi, par sa descendance de Muhammad ibn al-Hanafiyya, al-Sha'rani, Abu Muhammad, l'un des savants soufis, né à Qalqashanda en Égypte, élevé à Saqiyat Abi Sha'ra et mort au Caire ; 898 H, 1493 ap. J.-C., à 973 H, 1565 ap. J.-C. ; auteur des Lawaqih al-anwar fi tabaqat al-akhyar, d'al-Mizan al-kubra et d'al-Yawaqit wa-l-jawahir."
  es: "Abd al-Wahhab ibn Ahmad ibn Ali al-Hanafi, por descendencia de Muhammad ibn al-Hanafiyya, al-Sha'rani, Abu Muhammad, uno de los eruditos de los sufíes, nacido en Qalqashanda en Egipto, criado en Saqiyat Abi Sha'ra y muerto en El Cairo; 898 d. H., 1493 d. C., a 973 d. H., 1565 d. C.; autor de Lawaqih al-anwar fi tabaqat al-akhyar, al-Mizan al-kubra y al-Yawaqit wa-l-jawahir."
  ur: "عبد الوہاب بن احمد بن علی الحنفی، محمد بن الحنفیہ، الشرانی، ابو محمد، صوفیاء کے علماء میں سے ایک، مصر کے قلقشندہ میں پیدا ہوئے، سقیات ابی شعرا میں پرورش پائی اور قاہرہ میں وفات پائی۔ 898 ہجری، 1493 عیسوی، 973 ہجری، 1565 عیسوی؛ لاقیح الانوار فی طبقات الاخیار، المیزان الکبریٰ اور الیواقیت والجواہر کے مصنف۔"
  tr: "Adını Muhammed İbn el-Hanefiyye, el-Şa'rani, Sufi alimlerinden Ebu Muhammed'den alan Abdulvehhab bin Ahmed bin Ali el-Hanefi, Mısır'ın Kalkaşende'sinde doğmuş, Sakiyat Ebu Şa'ra'da büyümüş ve Kahire'de vefat etmiştir; MS 1493'e karşılık gelen H. 898'den MS 1565'e karşılık gelen H. 973'e kadar; Levakih al-Enwar fi Tabaqat al-Akhyar, al-Mizan al-Kubra, al-Yawaqit wa al-Cevahir kitaplarının yazarı."
  id: "Abdul Wahhab bin Ahmed bin Ali al-Hanafi, dinamai Muhammad Ibn al-Hanafiyya, al-Sha'rani, Abu Muhammad, salah satu ulama sufi, lahir di Qalqashanda di Mesir dan dibesarkan di Saqiyat Abi Sha'ra dan meninggal di Kairo; dari tahun 898 H bertepatan dengan tahun 1493 M hingga tahun 973 H bertepatan dengan tahun 1565 M; penulis Lawaqih al-Anwar fi Tabaqat al-Akhyar, al-Mizan al-Kubra, al-Yawaqit wa al-Jawahir."
