summary:
  ar: "كبير (ازدهر في القرن الخامس عشر؛ التواريخ التقليدية 1398–1518 متنازع عليها)، شاعر صوفي بهاكتي من فاراناسي، نشأ — في الرواية المشهورة — في بيت نسّاج مسلم (جولاهة) ونُسبت تلمذته إلى رامانندا. هاجم في أبياته الممارسات الخالية من المعنى عند الهندوس والمسلمين معًا وأعلن استقلاله عن الديانتين، فتنازعته التقاليد بعد موته: يحفظ الغورو غرانث صاحب أكبر إسهام لغير سيخي فيه من أبياته، ويحفظ البيجاك تراث الطائفة الكبيرية، وتصفه أقدم سير فارسية بأنه بايراغي فايشنافي، بينما يرى بعض الباحثين أنه ترك الإسلام. لذلك يُسجَّل دينه هنا غير معروف، مع حفظ القراءات كلها."
  en: "Kabir (fl. 15th century; the traditional dates 1398–1518 are contested), a Bhakti mystic poet of Varanasi who was raised, in the received account, in the household of a Muslim weaver (julaha) and is counted a disciple of Ramananda. His verses attacked what he saw as the meaningless practices of Hindus and Muslims alike and declared his independence of both religions, and the traditions claimed him after his death: the Guru Granth Sahib preserves the largest non-Sikh contribution in it from his verses, the Bijak carries the Kabir-panth tradition, the earliest Persian biography calls him a Vaishnava Bairagi, and some scholars hold that he left Islam. His faith is therefore recorded here as unknown, with all readings preserved."
  ur: "کبیر (پندرہویں صدی؛ روایتی تواریخ 1398ء–1518ء متنازع ہیں)، بنارس کے بھکتی صوفی شاعر تھے، جو معروف روایت کے مطابق ایک مسلمان جولاہے کے گھر پلے اور رامانند کے شاگرد شمار ہوتے ہیں۔ انھوں نے اپنے کلام میں ہندوؤں اور مسلمانوں دونوں کی بے معنی رسوم پر تنقید کی اور دونوں مذاہب سے اپنی آزادی کا اعلان کیا، اور ان کی وفات کے بعد روایات نے انھیں اپنا اپنا قرار دیا: گرو گرنتھ صاحب میں کسی غیر سکھ کی سب سے بڑی شرکت انھی کے اشعار کی ہے، بیجک کبیر پنتھ کی روایت کو محفوظ رکھتا ہے، قدیم ترین فارسی سیرت انھیں ویشنَو بیراگی کہتی ہے، اور بعض محققین کے نزدیک وہ اسلام چھوڑ چکے تھے۔ اس لیے ان کا مذہب یہاں نامعلوم درج ہے، اور تمام قراءات محفوظ ہیں۔"

