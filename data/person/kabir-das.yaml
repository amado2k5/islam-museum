  status: debated
  note: "Born at Varanasi (Banaras) by every tradition; the place has no entity in the graph, so the birthplace is prose-only. The year is genuinely contested: the tradition followed by the queue gives 1398 (Samvat 1455, the full moon of Jyeshtha, at the Lahartara lake), while a large scholarly party favours 1440, and the English article sets out the two scholarly datings of his life as 1398–1448 and 1440–1518; Wikidata carries both 1398 and 1440 as birth values. The traditional 1398 is built with the 1440 variant preserved. Each candidate year spans two Hijri years (1398 spans 800-801 AH; 1440 spans 843-844 AH), so no Hijri year is recorded."
  sources: [source/wikipedia-kabir-en, source/wikipedia-kabir-ur, source/wikidata-kabir]

died:
  edtf: "1518"
  calendar: gregorian
  precision: year
  status: debated
  note: "Died at Maghar, by the tradition that has him choose Maghar — a place Hindus held inauspicious for dying — over Kashi precisely to deny that the place of death decides salvation; Wikidata gives Maghar as his place of death and 1518 as the year. The year is debated with the birth: the scholarly party that dates his birth to 1398 favours a death in 1448, while 1518 pairs with the 1440 birth in the other standard dating. The traditional 1518 is built with the 1448 variant preserved. A bare year 1518 spans 923-924 AH, so no Hijri year is recorded."
  sources: [source/wikipedia-kabir-en, source/wikipedia-kabir-ur, source/wikidata-kabir]

faith:
  - value: unknown
    basis: unknown
    note: >-
      His religious identity is contested across three traditions and the scholarly sources
      do not converge on one tradition for the man himself, so under the doubt rule the
      settlement is unknown with all readings preserved. The Hindu reading: the earliest
      biographical text, the Persian Dabestan-e Mazaheb, calls him a Bairagi, a Vaishnava
      yogi, and a disciple of Ramananda, the founder of the Ramanandi Sampradaya, and the
      Bhakti tradition claims him on that basis. The Muslim reading: by the received account
      he was found as an infant and raised by the Muslim weavers Niru and Nima in Varanasi,
      he is claimed by the Muslims he inspired, his verses draw on Islamic vocabulary, and
      Ronald McGregor's formulation that 'Kabir left Islam' presupposes an Islam that was
      his to leave. The Sikh reverence: verses attributed to him form the largest non-Sikh
      contribution to the Guru Granth Sahib, without making him a Sikh. Against every claim
      stands his own attested stance as the sources present it: he criticised the practices
      of Hindus and Muslims alike, declared his independence of both religions, and was
      threatened by both in his lifetime — Linda Hess warns that presenting him as a
      synthesizer of Hinduism and Islam is a false picture. Wikidata's religion value of
      Hinduism is structured data recording one of the claiming traditions and settles
      nothing. The Kabir panth, founded centuries after his death, recognises him as its
      founder; that is a tradition's claim on him, not an attestation of his own affiliation.
    sources: [source/wikipedia-kabir-en, source/wikipedia-kabir-ur, source/wikidata-kabir]

