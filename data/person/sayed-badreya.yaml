  es: "Actor y cineasta egipcio-estadounidense, nacido en 1957 en Port Said; ha aparecido en películas de Hollywood como Iron Man, El dictador e Independence Day, y trabaja para cambiar la representación de los árabes y musulmanes en el cine estadounidense."
  fr: "Acteur et réalisateur égypto-américain, né en 1957 à Port-Saïd; il a joué dans des films hollywoodiens tels que Iron Man, Le Dictateur et Independence Day, et s'efforce de changer la représentation des Arabes et des musulmans dans le cinéma américain."
  tr: "1957 yılında Port Said'de doğan Mısır-Amerikalı bir aktör ve film yapımcısı; Iron Man, The Dictator ve Independence Day gibi Hollywood filmlerinde rol aldı ve Amerikan sinemasında Araplar ve Müslümanların imajını değiştirmek için çalışıyor."
  id: "Seorang aktor dan pembuat film Mesir-Amerika, lahir pada tahun 1957 di Port Said; ia tampil dalam film-film Hollywood seperti Iron Man, The Dictator, dan Independence Day, serta berupaya mengubah citra Arab dan Muslim dalam sinema Amerika."
