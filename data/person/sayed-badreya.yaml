  ar: "ممثل وصانع أفلام مصري أمريكي، وُلد سنة 1957 في بورسعيد؛ ظهر في أفلام هوليوودية منها ⁦(Iron Man)⁩ و⁦(The Dictator)⁩ و⁦(Independence Day)⁩، ويعمل على تغيير صورة العرب والمسلمين في السينما الأمريكية."
  en: "Egyptian-American actor and filmmaker, born in 1957 in Port Said; appeared in Hollywood films including Iron Man, The Dictator and Independence Day, and works to change the portrayal of Arabs and Muslims in American cinema."
