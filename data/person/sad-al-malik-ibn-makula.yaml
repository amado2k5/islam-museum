id: person/sad-al-malik-ibn-makula
class: person
label: { ar: "سعد الملك أبو نصر ابن ماكولا صاحب الإكمال" }
summary:
  ar: "ابن ماكولا الحافظ الكبير الإمام أبو نصر علي بن هبة الله بن علي بن جعفر بن علي بن محمد بن دلف بن الأمير الجواد أبي دلف القاسم بن عيسى العجلي — الأمير سعد الملك؛ له كتاب الإكمال في رفع الالتباس والضبط والتقييد في المؤتلف والمختلف ومشتبه النسب وهو في غاية الإحسان عليه اعتماد المحدثين؛ ولد في عكبرا في خامس شعبان سنة إحدى وعشرين وأربعمائة وقتله غلمانه الأتراك بجرجان وقيل بخوزستان وقيل بالأهواز وأخذوا ماله وهربوا؛ ترجمته في أموات سنة سبع وثمانين وأربعمائة وقد اختلف الذهبي في وفاته على أقوال {cite:shadharat-dhahab p. 382-383}."
  en: "Sa'd al-Malik Abu Nasr Ibn Makula, the great hafiz of the Abu Dulaf al-Ijli line — author of al-Ikmal on resolving confused and resembling rijal names, on which the muhaddithun rely; born at Ukbara 5 Sha'ban 421 and killed by his own Turkish ghulams at Jurjan (or Khuzistan/Ahwaz) who took his money and fled — al-Dhahabi notes his death date is disputed {cite:shadharat-dhahab p. 382-383}."
