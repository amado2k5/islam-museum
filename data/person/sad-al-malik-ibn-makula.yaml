id: person/sad-al-malik-ibn-makula
class: person
label: { ar: "سعد الملك أبو نصر ابن ماكولا صاحب الإكمال" }
summary:
  ar: "ابن ماكولا الحافظ الكبير الإمام أبو نصر علي بن هبة الله بن علي بن جعفر بن علي بن محمد بن دلف بن الأمير الجواد أبي دلف القاسم بن عيسى العجلي — الأمير سعد الملك؛ له كتاب الإكمال في رفع الالتباس والضبط والتقييد في المؤتلف والمختلف ومشتبه النسب وهو في غاية الإحسان عليه اعتماد المحدثين؛ ولد في عكبرا في خامس شعبان سنة إحدى وعشرين وأربعمائة وقتله غلمانه الأتراك بجرجان وقيل بخوزستان وقيل بالأهواز وأخذوا ماله وهربوا؛ ترجمته في أموات سنة سبع وثمانين وأربعمائة وقد اختلف الذهبي في وفاته على أقوال {cite:shadharat-dhahab p. 382-383}."
  en: "Sa'd al-Malik Abu Nasr Ibn Makula, the great hafiz of the Abu Dulaf al-Ijli line — author of al-Ikmal on resolving confused and resembling rijal names, on which the muhaddithun rely; born at Ukbara 5 Sha'ban 421 and killed by his own Turkish ghulams at Jurjan (or Khuzistan/Ahwaz) who took his money and fled — al-Dhahabi notes his death date is disputed {cite:shadharat-dhahab p. 382-383}."
  es: "Sa'd al-Malik Abu Nasr Ibn Makula, el gran hafiz de la línea Abu Dulaf al-Ijli, autor de al-Ikmal sobre la resolución de nombres de rijal confusos y similares, en el que se basan los muhaddithun; nació en Ukbara 5 Sha'ban 421 y fue asesinado por sus propios ghulams turcos en Jurjan (o Khuzistán/Ahwaz), quienes se llevaron su dinero y huyeron. Al-Dhahabi señala que su fecha de muerte es disputada {cite:shadharat-dhahab p. 382-383}."
  fr: "Sa'd al-Malik Abu Nasr Ibn Makula, le grand hafiz de la lignée d'Abu Dulaf al-Ijli — auteur d'al-Ikmal sur la résolution des noms rijal confus et ressemblants, sur lesquels s'appuient les muhaddithun; né à Ukbara le 5 Sha'ban 421 et tué par ses propres ghulams turcs à Jurjan (ou Khuzistan/Ahwaz) qui ont pris son argent et se sont enfuis — al-Dhahabi note que sa date de mort est contestée {cite:shadharat-dhahab p. 382-383}."
  ur: "سعد الملک ابو نصر ابن ماکولہ، ابو دلف الاجلی سطر کے عظیم حافظ - الجھے ہوئے اور مشابہہ رجال ناموں کو حل کرنے پر الاکمال کے مصنف، جن پر محدثین بھروسہ کرتے ہیں۔ عقرب 5 شعبان 421 کو پیدا ہوئے اور جرجان ⁦(یا خوزستان/اہواز)⁩ میں اپنے ہی ترک غلاموں کے ہاتھوں قتل ہوئے جو اس کا پیسہ لے کر فرار ہو گئے — الذہبی نوٹ کرتے ہیں کہ ان کی تاریخ وفات متنازعہ ہے۔ 382-383}۔"
  tr: "Büyük ezberci İbn Makula, İmam Ebu Nasr Ali ibn Hibatullah ibn Ali ibn Ja'far ibn Ali ibn Muhammed ibn Dulaf, prens el-Cevad Ebu Dulf el-Kasim ibn İsa el-Acli'nin oğlu — Prens Saad al-Malik; 'El-İkkal fi Rafi' el-Tilabaş ve el-Taqyid fi Mu'ta'ta' adlı kitabı yazmıştır lif, el-Muhtalaf ve Şaştab-el-Nasab'dır ve son derece iyilikseverdir ve hadis âlimlerine dayanır. 421 Hicri yılında, Şaban ayının beşinci gününde Ekbara'da doğdu ve Türk hizmetkarları onu Jurcan'da, bazıları Huzistan'da, bazıları ise Ahwaz'da öldürdü, servetini alıp kaçtılar; biyografisi '487 yılında öldü' bölümündedir. El-Dhahab şu ifadelerde farklı görüşler sergilemektedir {alıntı: Shadharat-Dhahab, s. 382-383}."
  id: "Ibn Makula, penghafal besar, Imam Abu Nasr Ali ibn Hibatullah ibn Ali ibn Ja'far ibn Ali ibn Muhammad ibn Dulaf, putra pangeran al-Jawad Abu Dulf al-Qasim ibn Isa al-Ajli — Pangeran Saad al-Malik; ia menulis buku 'Al-Ikkal fi Rafi' al-Tilabash wa al-Taqyid fi al-Mu'talif, al-Mukhtalaf, dan Shashtab al-Nasab, dan ia sangat baik hati, mengandalkan para ulama hadits. Ia lahir di Akbara pada tanggal lima Sha'ban tahun 421 H, dan pelayan Turkinya membunuhnya di Jurjan, beberapa mengatakan di Khuzestan, dan lainnya di Ahwaz, dan mereka mengambil hartanya dan melarikan diri; biografinya ada dalam 'Meninggal pada tahun 487.' Al-Dhahab berbeda pendapat mengenai pernyataan tersebut {cite:Shadharat-Dhahab, hlm. 382-383}."
