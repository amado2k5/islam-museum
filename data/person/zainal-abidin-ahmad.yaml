summary:
  ar: "كاتب ولغوي ماليزي (1895–1973) عُرف باسم القلم «زعبا»، حدّث نحو الملايوية وإملاءها بسلسلة «بليتا بهاسا» ونظام زعبا الإملائي، ودرّس في مدارس وكليات تدريب المعلمين في ملايا وسنغافورة ولندن، وترجم أعمالًا لشكسبير، وخدم مدة قصيرة أول أمين عام لمنظمة أمنو سنة 1946."
  en: "Malaysian writer and linguist (1895–1973), known by his pen name Za'ba, who modernised Malay grammar and spelling through the Pelita Bahasa series and the Za'aba spelling system, taught at schools and teacher-training colleges in Malaya, Singapore and London, translated Shakespeare, and served briefly as the first secretary-general of UMNO."
  ur: "مالیزیائی مصنف اور ماہر لسانیات (1895ء–1973ء) جو اپنے قلمی نام «زعبا» سے مشہور ہوئے، انہوں نے «پلیتا بہاسا» سلسلے اور زعبا املا نظام کے ذریعے ملائی گرامر اور املا کو جدید بنایا، ملایا، سنگاپور اور لندن میں پڑھایا، شیکسپیئر کا ترجمہ کیا اور مختصر عرصہ امنو کے پہلے سیکرٹری جنرل رہے۔"
