summary:
  ar: "إمام وباحث أمريكي. اعتنق الإسلام سنة 2010 وهو طالب في كلية فاسار، ثم درس في الجامعة الإسلامية بالمدينة المنورة (2015-2020) وتخرّج في كلية الشريعة فيها. وهو مدير أبحاث الإسلام والمجتمع في معهد يقين، وإمام وباحث مقيم في مسجد يوتيكا بنيويورك، ومدرّس في مدرسة ليغاسي الدولية الإلكترونية."
  en: "American imam and scholar. He accepted Islam in 2010 while a student at Vassar College, then studied at the Islamic University of Madinah (2015-2020), graduating from its Faculty of Shariah. He is Research Director of Islam and Society at the Yaqeen Institute, resident scholar and imam of Utica Masjid in New York, and an instructor at Legacy International Online High School."
  ur: "امریکی امام و محقق۔ انہوں نے 2010 میں واسار کالج کے طالب علم ہوتے ہوئے اسلام قبول کیا، پھر جامعہ اسلامیہ مدینہ منورہ میں تعلیم حاصل کی (2015-2020) اور کلیہ شریعہ سے فارغ ہوئے۔ وہ یقین انسٹی ٹیوٹ میں اسلام و معاشرہ کے شعبے کے ڈائریکٹر تحقیق، نیویارک کی مسجد یوٹیکا کے امام و مقیم عالم، اور لیگیسی انٹرنیشنل آن لائن ہائی اسکول میں مدرس ہیں۔"
