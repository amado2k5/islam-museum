summary:
  ar: "شاعر عربي من تميم، أقام أكثر عمره في البصرة، ونظم الرجز وحده، وكان لغته غنية متكلفة، ومن أشهر ممدوحيه يزيد بن معاوية وسليمان بن عبد الملك والحجاج بن يوسف، وأبوه رؤبة شاعر أيضًا."
  en: "An Arab poet of the Tamim who lived mainly in Basra, and used the rajaz metre exclusively. His poetry is marked by a rich vocabulary and laborious construction; his panegyrics addressed Yazid b. Mu'awiya, Sulayman b. 'Abd al-Malik and al-Hajjaj b. Yusuf, among others {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  fr: "Poète arabe des Tamim qui vécut surtout à Bassora et employa exclusivement le mètre rajaz. Sa poésie se distingue par un vocabulaire riche et une construction laborieuse ; ses panégyriques s'adressaient notamment à Yazid b. Mu'awiya, Sulayman b. 'Abd al-Malik et al-Hajjaj b. Yusuf {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  es: "Poeta árabe del movimiento Tamim, residente principalmente en Basora, que empleó exclusivamente el metro rajaz. Su poesía se caracteriza por un vocabulario rico y una construcción elaborada; sus panegíricos estuvieron dirigidos a Yazid ibn Mu'awiya, Sulayman ibn Abd al-Malik y al-Hajjaj ibn Yusuf, entre otros {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  ur: "تمیم کا ایک عرب شاعر جو بنیادی طور پر بصرہ میں رہتا تھا، اور رجز میٹر کو خصوصی طور پر استعمال کرتا تھا۔ ان کی شاعری ایک بھرپور الفاظ اور محنتی تعمیر سے نشان زد ہے۔ اس کی ہمت نے یزید بن کو مخاطب کیا۔ معاویہ، سلیمان بن عبد الملک اور الحجاج ب۔ یوسف، دوسروں کے درمیان {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 226}۔"
  tr: "Tamimli bir Arap şair olan bu kişi, hayatının büyük bölümünü Basra'da geçirmiş ve yalnızca Racaz şiirleri yazmıştır. Dili zengin ve ayrıntılıydı. En ünlü hamileri arasında Yazid ibn Muaviye, Süleyman ibn Abdülmalik ve Haccac ibn Yusuf bulunmaktaydı. Babası Ru'bah da bir şairdi."
  id: "Seorang penyair Arab dari Tamim, ia menghabiskan sebagian besar hidupnya di Basra, dan hanya menggubah puisi Rajaz. Bahasa yang digunakannya kaya dan bertele-tele. Di antara pelindungnya yang paling terkenal adalah Yazid ibn Muawiyah, Sulayman ibn Abd al-Malik, dan al-Hajjaj ibn Yusuf. Ayahnya, Ru’bah, juga seorang penyair."
