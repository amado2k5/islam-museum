summary:
  ar: "شاعر عربي من تميم، أقام أكثر عمره في البصرة، ونظم الرجز وحده، وكان لغته غنية متكلفة، ومن أشهر ممدوحيه يزيد بن معاوية وسليمان بن عبد الملك والحجاج بن يوسف، وأبوه رؤبة شاعر أيضًا."
  en: "An Arab poet of the Tamim who lived mainly in Basra, and used the rajaz metre exclusively. His poetry is marked by a rich vocabulary and laborious construction; his panegyrics addressed Yazid b. Mu'awiya, Sulayman b. 'Abd al-Malik and al-Hajjaj b. Yusuf, among others {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
