summary:
  ar: "أبو بكر محمد بن يحيى الصولي الشطرنجي المؤرخ صاحب كتاب الأوراق في أخبار العباسيين توفي سنة ٣٣٥هـ في خلافة المطيع.، وصنف كتاباً جمع فيه أخبار أبي تمام وشعره وتصرفه في أنواع علومه {cite:muruj-al-dhahab p. 463}، وعند المسعودي قال كان لي وعد على المعتضد فما ظفرت به حتى عملت قصيدة ذكرت فيها بدراً أولها أيها الهاجر مزحاً لا مجد فضحك المعتضد وأمر بما وعده به {cite:muruj-al-dhahab p. 636-637}"
  en: "Abu Bakr Muhammad ibn Yahya al-Suli, the chess-player historian of the Awraq on the Abbasids, d. 335h under al-Muti'."
