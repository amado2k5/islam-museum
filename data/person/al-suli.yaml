id: person/al-suli
class: person
label: { ar: "الصولي", en: "al-Suli", fr: "al-Suli", es: "al-Suli", ur: "السولی" }
summary:
  ar: "أبو بكر محمد بن يحيى الصولي الشطرنجي المؤرخ صاحب كتاب الأوراق في أخبار العباسيين توفي سنة ٣٣٥هـ في خلافة المطيع. وصنف كتاباً جمع فيه أخبار أبي تمام وشعره وتصرفه في أنواع علومه {cite:muruj-al-dhahab p. 463}، وعند المسعودي قال كان لي وعد على المعتضد فما ظفرت به حتى عملت قصيدة ذكرت فيها بدراً أولها أيها الهاجر مزحاً لا مجد فضحك المعتضد وأمر بما وعده به {cite:muruj-al-dhahab p. 636-637}، وعند المسعودي لعب مع الماوردي اللاعب بحضرة المكتفي فحمل الخليفة حسن رأيه في صاحبه وتقدم الحرمة على نصرته حتى أدهش الصولي، فلما اتصل اللعب غلبه غلباً لا يكاد يرد عليه شيئاً فقال له المكتفي صار ماء وردك بولاً {cite:muruj-al-dhahab p. 677}"
  en: "Abu Bakr Muhammad ibn Yahya al-Suli, the chess-player historian of the Awraq on the Abbasids, d. 335h under al-Muti'."
  fr: "Abu Bakr Muhammad ibn Yahya al-Suli, l'historien joueur d'échecs de l'Awraq sur les Abbassides, est mort en 335h sous al-Muti."
  es: "Abu Bakr Muhammad ibn Yahya al-Suli, el historiador ajedrecista del Awraq de los abasíes, d. 335h bajo al-Muti'"
  ur: "ابوبکر محمد بن یحییٰ السلی، شطرنج کے کھلاڑی، عباسیوں پر عوراق کے مورخ، ڈی۔ 335ھ تحت الموطی"
  tr: "Tarihçi ve 'Al-Waraq fi Akhbar al-Abbasiyyin' kitabının yazarı Ebu Bekir Muhammed bin Yahya el-Süli el-Şatranci, 335 Hicri yılında el-Muti'nin halifeliği sırasında vefat etti. Abu Tammam'ın haberlerini, şiirlerini ve çeşitli bilimlerini topladığı bir kitap yazdı {cite:] Mu'tadid şöyle dedi: Mu'tadid'e söz verdim, ancak eski günleri anlattığım bir şiir yazana kadar başaramadım; şiirin başında şöyle oldu: 'Ey Hajar, şaka yapmak, şan değil.' Al-Mu'tadid güldü ve verdiği sözü emretti {atı:Muruj-al-dhahab s. 636-637}. El-Mes'udi'ye göre, el-Mütaffi'nin huzurunda çalan el-Mawardi ile oynadı, bu yüzden halife yoldaşına iyi baktı ve kadın onun desteğinden üstün tuttu, bu da el-Suli'yi şaşırttı. Oyun devam ettiğinde, o kadar etkilendi ki ona neredeyse cevap veremedi. El-Mutafi ona dedi ki, 'Suyun suya dönüştü, idrarın idrardır.' {atıf:Muruj-al-Dhahab s. 677}"
  id: "Abu Bakr Muhammad ibn Yahya al-Suli al-Shatranji, sejarawan dan penulis buku 'Al-Waraq fi Akhbar al-Abbasiyyin', wafat pada tahun 335 H selama masa kekhalifahan al-Muti'. Ia menulis sebuah buku yang mengumpulkan berita, puisi, dan berbagai ilmu pengetahuan Abu Tammam {cite:Muruj-al-Dhahab hlm. 463}. Menurut al-Mas'udi ia berkata: Aku telah berjanji kepada al-Mu'tadid, tetapi aku tidak berhasil sampai aku menulis sebuah puisi yang menyebutkan zaman kuno, yang awalnya adalah: 'Wahai Hajar, dalam lelucon, bukan kemuliaan.' Al-Mu'tadid tertawa dan memerintahkan apa yang telah dijanjikannya {cite:Muruj-al-dhahab hlm. 636-637}. Menurut al-Mas'udi, ia bermain dengan al-Mawardi, yang bermain di hadapan al-Muktaffi, sehingga khalifah mengambil pandangan baik terhadap sahabatnya dan wanita itu lebih diutamakan daripada dukungannya, membuat al-Suli terkejut. Ketika permainan berlanjut, ia begitu tertekan hingga hampir tidak bisa menjawab. Al-Muktafi berkata kepadanya, 'Airmu telah menjadi air, dan urinmu adalah urine.' {cite:muruj-al-dhahab hlm. 677}"
