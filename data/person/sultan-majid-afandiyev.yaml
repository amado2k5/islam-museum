summary:
  ar: "طبيب وثوري ورجل دولة أذربيجاني (1887–1938)، من أوائل الماركسيين الأذربيجانيين ومن مؤسسي الحزب الشيوعي الأذربيجاني، ومن منظّمي حزب «همّت» الاشتراكي الديمقراطي المسلم، تولى رئاسة اللجنة التنفيذية المركزية لجمهورية أذربيجان السوفيتية (1931–1937)، وأُعدم في التطهير الكبير ثم رُدّ اعتباره بعد وفاته."
  en: "Azerbaijani physician, revolutionary and statesman (1887–1938), among the first Azerbaijani Marxists and a founder of the Communist Party of Azerbaijan, and an organiser of the Muslim social-democratic Hummet party. He chaired the Central Executive Committee of the Azerbaijan SSR (1931–1937), was executed in the Great Terror, and was rehabilitated posthumously."
  ur: "آذربائیجانی طبیب، انقلابی اور سیاست دان (1887–1938)، آذربائیجان کے اولین مارکسیوں اور آذربائیجان کی کمیونسٹ پارٹی کے بانیوں میں سے ایک، اور مسلم سوشل ڈیموکریٹک جماعت «ہمّت» کے منتظمین میں شامل۔ وہ آذربائیجان سوویت جمہوریہ کی مرکزی ایگزیکٹو کمیٹی کے صدر رہے (1931–1937)، عظیم دہشت گردی میں مارے گئے اور بعد از مرگ بحالِ عزت ہوئے۔"
  es: "Médico, revolucionario y estadista azerbaiyano (1887-1938), uno de los primeros marxistas azerbaiyanos y fundador del Partido Comunista de Azerbaiyán, además de organizador del partido socialdemócrata musulmán Hummet. Presidió el Comité Ejecutivo Central de la RSS de Azerbaiyán (1931-1937), fue ejecutado durante el Gran Terror y rehabilitado póstumamente."
  fr: "Médecin, révolutionnaire et homme d'État azerbaïdjanais (1887-1938), il fut l'un des premiers marxistes azerbaïdjanais, fondateur du Parti communiste d'Azerbaïdjan et organisateur du parti social-démocrate musulman Hummet. Il présida le Comité exécutif central de la RSS d'Azerbaïdjan (1931-1937), fut exécuté pendant la Grande Terreur et réhabilité à titre posthume."
  tr: "Azerbaycanlı doktor, devrimci ve devlet adamı (1887–1938), en erken Azerbaycan Marksistlerinden biri, Azerbaycan Komünist Partisi'nin kurucularından biri ve Müslüman Sosyal Demokrat Parti 'Himmat'ın kurucularından biri, Azerbaycan Sovyet Cumhuriyeti Merkez Yürütme Komitesi'ne başkanlık etti (1931–1937), Büyük Temizlik sırasında idam edildi ve daha sonra ölümünden sonra rehabilite edildi."
  id: "Seorang dokter, revolusioner, dan negarawan Azerbaijan (1887–1938), salah satu Marxis Azerbaijan paling awal, salah satu pendiri Partai Komunis Azerbaijan, dan salah satu pengorganisir Partai Sosial Demokrat Muslim 'Himmat', ia memimpin Komite Eksekutif Pusat Republik Soviet Azerbaijan (1931–1937), dieksekusi selama Pembersihan Besar, dan kemudian direhabilitasi secara anumerta."
