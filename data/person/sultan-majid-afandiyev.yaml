summary:
  ar: "طبيب وثوري ورجل دولة أذربيجاني (1887–1938)، من أوائل الماركسيين الأذربيجانيين ومن مؤسسي الحزب الشيوعي الأذربيجاني، ومن منظّمي حزب «همّت» الاشتراكي الديمقراطي المسلم، تولى رئاسة اللجنة التنفيذية المركزية لجمهورية أذربيجان السوفيتية (1931–1937)، وأُعدم في التطهير الكبير ثم رُدّ اعتباره بعد وفاته."
  en: "Azerbaijani physician, revolutionary and statesman (1887–1938), among the first Azerbaijani Marxists and a founder of the Communist Party of Azerbaijan, and an organiser of the Muslim social-democratic Hummet party. He chaired the Central Executive Committee of the Azerbaijan SSR (1931–1937), was executed in the Great Terror, and was rehabilitated posthumously."
  ur: "آذربائیجانی طبیب، انقلابی اور سیاست دان (1887–1938)، آذربائیجان کے اولین مارکسیوں اور آذربائیجان کی کمیونسٹ پارٹی کے بانیوں میں سے ایک، اور مسلم سوشل ڈیموکریٹک جماعت «ہمّت» کے منتظمین میں شامل۔ وہ آذربائیجان سوویت جمہوریہ کی مرکزی ایگزیکٹو کمیٹی کے صدر رہے (1931–1937)، عظیم دہشت گردی میں مارے گئے اور بعد از مرگ بحالِ عزت ہوئے۔"
