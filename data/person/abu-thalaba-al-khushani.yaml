summary:
  ar: صحابي مشهور بكنيته، نسبته إلى بني خشين من قضاعة، واختُلف في اسمه اختلافاً كثيراً (جرهم وجرثوم وغيرهما)؛ قدم على النبي وهو يتجهز إلى خيبر فأسلم وشهدها، وسأل عن الأكل في آنية أهل الكتاب والصيد، وسكن الشام.
  en: A well-known Companion known by his kunya, of Banu Khushayn of Quda'a; his name is disputed in many forms (Jurhum, Jurthum and others); he came to the Prophet as he was preparing for Khaybar, embraced Islam and took part, asked about eating
    from the vessels of the People of the Book and about hunting, and settled in Syria.
