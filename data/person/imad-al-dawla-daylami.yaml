roles: [ruler]
gender: male
summary:
  ar: "علي بن بويه بن فناخسرو الديلمي، أبو الحسن، عماد الدولة، أول من ملك من بني بويه، كانت له بلاد فارس وعاصمته شيراز، ومات بشيراز عقيما، من سنة 281 إلى 338 هـ الموافقة 894 إلى 949 م."
  en: "Ali ibn Buya ibn Fanakhusraw al-Daylami, Abu al-Hasan, Imad al-Dawla, the first of the Buyids to rule; he held Fars with Shiraz as his capital, reigned sixteen years and died in Shiraz without children, 281 to 338 AH (894 to 949 CE)."
  es: "Ali ibn Buya ibn Fanakhusraw al-Daylami, Abu al-Hasan, Imad al-Dawla, el primero de los Buyíes en gobernar; gobernó Fars con Shiraz como su capital, reinó dieciséis años y murió en Shiraz sin hijos, 281 a 338 AH (894 a 949 d. C.)."
  fr: "Ali ibn Buya ibn Fanakhusraw al-Daylami, Abu al-Hasan, Imad al-Dawla, le premier des Bouyides à régner; il détenait le Fars avec Shiraz comme capitale, régna seize ans et mourut à Shiraz sans enfants, de 281 à 338 AH (894 à 949 CE)."
  ur: "علی ابن بویا ابن فنخسرو الدیلمی، ابو الحسن، عماد الدولہ، حکمرانی کرنے والے خریداروں میں سے پہلے؛ اس نے فارس کو شیراز کا دار الحکومت بنایا، سولہ سال حکومت کی اور بغیر اولاد کے شیراز میں وفات پائی، 281 تا 338 ہجری ⁦(894 تا 949 عیسوی)⁩۔"
