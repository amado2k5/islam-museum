summary:
  ar: "محمد بن النعمان بن عبد السلام، صحب وكيعًا وسفيان بن عيينة وأبا بكر بن عياش، وله الورع الثخين والعقل الرصين. كان دأبه المجاهدة حتى ضعف وخيف على عقله، ثم رجع إلى الميسور وترك خشونة المطعم والملبس. ومن قوله: درهم تدفعه في مظلمة أحب إليّ من مائة ألف تتصدق بها."
  en: "Muhammad ibn al-Nu'man ibn Abd al-Salam, who kept company with Waki', Sufyan ibn Uyayna and Abu Bakr ibn Ayyash, with firm scrupulousness and a steady mind; he was constant in striving until he weakened and his mind was feared for; then he returned to what was easy and gave up rough food and clothing. He said: a dirham you spend to remove a wrong is dearer to me than a hundred thousand you give in charity."
  ur: "محمد بن نعمان بن عبد السلام، جنہوں نے وکیع، سفیان بن عیینہ اور ابو بکر بن عیاش کی صحبت کی؛ ان میں سخت پرہیزگاری اور مضبوط عقل تھی۔ ان کا معمول مسلسل مجاہدہ تھا، یہاں تک کہ کمزور ہو گئے اور ان کی عقل کا اندیشہ ہوا؛ پھر آسان راستے کی طرف لوٹے اور کھردرا کھانا اور لباس چھوڑ دیا۔ انہوں نے کہا: وہ ایک درہم جو کسی ظلم کو دور کرنے میں خرچ ہو مجھے ایک لاکھ صدقے سے زیادہ عزیز ہے۔"
