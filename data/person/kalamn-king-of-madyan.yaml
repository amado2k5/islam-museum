summary:
  ar: "ملك مدين في زمان شعيب عند المسعودي، وأحدهم من ملوك بني المحض بن جندل الذين سميت أحرف الجمل بأسمائهم، وفي ملكه كان عذاب يوم الظلة، ورثته ابنته حارثة وكانت بالحجاز {cite:muruj-al-dhahab p. 459}."
  en: "King of Madyan in Shu'ayb's day — one of the six kings whose names al-Mas'udi gives the abjad letters; the Day of the Shadow fell in his reign and his daughter Haritha mourned him from the Hijaz {cite:muruj-al-dhahab p. 459}."
  es: "Rey de Madyan en tiempos de Shu'ayb, uno de los seis reyes cuyos nombres al-Mas'udi da las letras abjad; el Día de la Sombra cayó durante su reinado y su hija Haritha lo lloró desde el Hiyaz {cite:muruj-al-dhahab p. 459}."
  fr: "Roi de Madyan à l'époque de Shu'ayb — l'un des six rois dont al-Mas'udi donne les lettres abjad; le Jour de l'Ombre est tombé sous son règne et sa fille Haritha l'a pleuré depuis le Hedjaz {cite:muruj-al-dhahab p. 459}."
  ur: "شعیب کے زمانے میں مدین کا بادشاہ - ان چھ بادشاہوں میں سے ایک جن کے نام المسعودی ابجد کے حروف دیتے ہیں۔ اس کے دور حکومت میں سایہ کا دن پڑا اور اس کی بیٹی حارثہ نے حجاز سے اس کا ماتم کیا۔ 459}۔"
  tr: "Şuayb döneminde El-Mes'udi yönetiminde Midyan'ı yönetti ve Banu el-Mahd bin Jandal'ın krallarından biriydi; bu hükümün harfleri onun adını aldı. Saltanatı sırasında Gölge Günü cezası çekildi. Kızı Haris ise Hicaz'daydı {atıf:muruj-al-dhahab, s. 459}."
  id: "Ia memerintah Midian pada masa Shu'ayb di bawah Al-Mas'udi dan merupakan salah satu raja Banu al-Mahd ibn Jandal, yang namanya diambil dari huruf-huruf hukuman tersebut. Selama pemerintahannya, hukuman Hari Bayangan dijalani. Putrinya Harith, yang berada di Hijaz {cite:muruj-al-dhahab, hlm. 459}."
