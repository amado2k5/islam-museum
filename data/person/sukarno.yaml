summary:
  ar: "سياسي إندونيسي وُلد باسم كوسنو سوسروديهاردجو سنة 1901 في سورابايا لأب جاوي مسلم وأم هندوسية بالية. أسس الحزب الوطني الإندونيسي، وقاد كفاح الاستقلال عن هولندا، وأعلن استقلال إندونيسيا سنة 1945 وصار أول رئيس لها حتى أُبعد عن السلطة سنة 1967، وبقي قيد الإقامة الجبرية حتى وفاته في جاكرتا سنة 1970."
  en: "Indonesian statesman, born as Kusno Sosrodihardjo in 1901 at Surabaya to a Muslim Javanese father and a Hindu Balinese mother. He founded the Indonesian National Party, led the independence struggle against the Netherlands, proclaimed Indonesian independence in 1945 and served as the country's first president until his removal from power in 1967; he remained under house arrest until his death at Jakarta in 1970."
  ur: "انڈونیشی سیاست دان، جو 1901ء میں سورابایا میں کوسنو سوسرودیہارجو کے نام سے ایک جاوی مسلمان باپ اور ہندو بالی ماں کے ہاں پیدا ہوئے۔ انڈونیشین نیشنل پارٹی قائم کی، ہالینڈ کے خلاف جدوجہدِ آزادی کی قیادت کی، 1945ء میں انڈونیشیا کی آزادی کا اعلان کیا اور ملک کے پہلے صدر بنے حتیٰ کہ 1967ء میں اقتدار سے ہٹا دیے گئے؛ جکارتہ میں 1970ء میں وفات تک نظر بند رہے۔"
