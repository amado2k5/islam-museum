roles: [mystic]
summary:
  ar: "عابدة من العرب باليمن يذكرها ابن الجوزي في «صفة الصفوة» أول عابدات اليمن وينص على أنها «ليست بالصحابية» التي تحمل الاسم نفسه؛ صامت أربعين عاماً حتى لصق جلدها بعظمها، وبكت حتى ذهب بصرها، وقامت حتى أقعدت، وكان طاووس ووهب بن منبه يعظمان قدرها؛ ويلاحظ المحقق أن مصادر الرجال تذكر خنساء بنت خدام صحابية معروفة."
  en: "A devout Arab woman of Yemen whom Ibn al-Jawzi places first among the devout women of Yemen in Sifat al-Safwa, stating that she 'is not the Companion' of the same name; she fasted for forty years until her skin clung to her bones, wept until she lost her sight, and stood in prayer until she could no longer stand; Tawus and Wahb ibn Munabbih held her in high esteem. The editor notes that the biographical dictionaries know Khansa' bint Khidam as a well-known Companion."
  es: "Una devota mujer árabe de Yemen, a quien Ibn al-Jawzi sitúa en primer lugar entre las mujeres devotas de Yemen en Sifat al-Safwa, afirmando que «no es la Compañera» del mismo nombre; ayunó durante cuarenta años hasta que su piel se le pegó a los huesos, lloró hasta perder la vista y permaneció en oración hasta que ya no pudo mantenerse en pie; Tawus y Wahb ibn Munabbih la tenían en alta estima. El editor señala que los diccionarios biográficos conocen a Khansa' bint Khidam como una Compañera muy conocida."
  fr: "Khansa' bint Khidam, une femme arabe yéménite et pieuse, est mentionnée par Ibn al-Jawzi comme la plus pieuse des femmes du Yémen dans son ouvrage Sifat al-Safwa. Il précise qu'elle n'est pas la Compagne du même nom. Elle jeûna quarante ans durant, jusqu'à ce que sa peau colle à ses os, pleura jusqu'à perdre la vue et pria jusqu'à l'épuisement. Tawus et Wahb ibn Munabbih la tenaient en haute estime. L'éditeur note que les dictionnaires biographiques la reconnaissent comme une Compagne célèbre."
  ur: "یمن کی ایک متقی عرب عورت جسے ابن الجوزی نے صفات الصفوی میں یمن کی متقی خواتین میں سب سے پہلے نمبر پر رکھا ہے، یہ بیان کرتے ہوئے کہ وہ اسی نام کی 'صحابی نہیں' ہیں۔ اس نے چالیس سال تک روزے رکھے یہاں تک کہ اس کی جلد ہڈیوں سے چمٹ گئی، روتی رہی یہاں تک کہ وہ بینائی سے محروم ہو گئی، اور نماز میں کھڑی رہی یہاں تک کہ وہ کھڑی نہ ہو سکی۔ طاؤس اور وہب بن منبیح نے ان کی بہت عزت کی۔ مدیر نے نوٹ کیا کہ سوانحی لغات خنساء بنت خدام کو ایک معروف صحابی کے طور پر جانتے ہیں۔"
  tr: "Yemen'deki Araplar arasında bir ibadet eden İbn al-Jawzi, \"Sifat al-Safwa\"da onu bahseder; Yemen'in ilk kadın ibadet edeni olarak, onun \"aynı adı taşıyan kadın yoldaş olmadığını\" belirtir; kırk yıl boyunca oruç tutar, derisi kemiğine yapışana kadar ağladı, görme kaybı yaşana kadar ağladı ve oturana kadar ayakta durdu. Tavus ve Vahb ibn Munabbih onun statüsünü onurlandırdı; doğrulayıcı, kaynakların tanınmış bir kadın yoldaş olan Khansa bint Khaddam'dan bahsettiğini belirtiyor."
  id: "Seorang penyembah di antara orang Arab di Yaman, Ibn al-Jawzi menyebutnya dalam \"Sifat al-Safwa,\" pemuja wanita pertama di Yaman, menyatakan bahwa dia \"bukan teman wanita\" yang memiliki nama yang sama; dia berpuasa selama empat puluh tahun sampai kulitnya menempel pada tulang, menangis hingga kehilangan penglihatan, dan berdiri sampai duduk. Tawus dan Wahb ibn Munabbih menghormati statusnya; verifiator mencatat bahwa sumber-sumber menyebut Khansa bint Khaddam, seorang teman wanita yang terkenal."
