summary:
  ar: "عابدة من العرب باليمن يذكرها ابن الجوزي في «صفة الصفوة» أول عابدات اليمن وينص على أنها «ليست بالصحابية» التي تحمل الاسم نفسه؛ صامت أربعين عاماً حتى لصق جلدها بعظمها، وبكت حتى ذهب بصرها، وقامت حتى أقعدت، وكان طاووس ووهب بن منبه يعظمان قدرها؛ ويلاحظ المحقق أن مصادر الرجال تذكر خنساء بنت خدام صحابية معروفة."
  en: "A devout Arab woman of Yemen whom Ibn al-Jawzi places first among the devout women of Yemen in Sifat al-Safwa, stating that she 'is not the Companion' of the same name; she fasted for forty years until her skin clung to her bones, wept until she lost her sight, and stood in prayer until she could no longer stand; Tawus and Wahb ibn Munabbih held her in high esteem. The editor notes that the biographical dictionaries know Khansa' bint Khidam as a well-known Companion."
