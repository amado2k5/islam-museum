label: { ar: "صمصام الدولة بن عضد الدولة" }
summary:
  ar: "ابن عضد الدولة، وليه الطائع مكان أبيه سنة اثنتين وسبعين ولقبه شمس الملة وخلع عليه سبع خلع وتوجه وعقد له اللواءين، وهم سنة خمس وسبعين أن يجعل المكس على الثياب الحرير والقطن فاجتمع الناس في جامع المنصور وعزموا على المنع من صلاة الجمعة وكاد البلد يفتتن فأعفاهم، وقصده أخوه شرف الدولة سنة ست وسبعين فانتصر عليه وكحله {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
  en: "Adud al-Dawla's son, invested by al-Ta'i' in 372 as Shams al-Milla with seven robes and the two standards; his silk-and-cotton tax nearly lit Baghdad in 375 till remitted, and in 376 his brother Sharaf al-Dawla beat and blinded him {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
