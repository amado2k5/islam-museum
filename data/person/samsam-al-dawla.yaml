id: person/samsam-al-dawla
class: person
label: { ar: "صمصام الدولة بن عضد الدولة" }
summary:
  ar: "ابن عضد الدولة، وليه الطائع مكان أبيه سنة اثنتين وسبعين ولقبه شمس الملة وخلع عليه سبع خلع وتوجه وعقد له اللواءين، وهم سنة خمس وسبعين أن يجعل المكس على الثياب الحرير والقطن فاجتمع الناس في جامع المنصور وعزموا على المنع من صلاة الجمعة وكاد البلد يفتتن فأعفاهم، وقصده أخوه شرف الدولة سنة ست وسبعين فانتصر عليه وكحله {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
  en: "Adud al-Dawla's son, invested by al-Ta'i' in 372 as Shams al-Milla with seven robes and the two standards; his silk-and-cotton tax nearly lit Baghdad in 375 till remitted, and in 376 his brother Sharaf al-Dawla beat and blinded him {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
  es: "Hijo de Adud al-Dawla, investido por al-Ta'i' en 372 como Shams al-Milla con siete túnicas y dos estandartes; su impuesto sobre la seda y el algodón casi incendió Bagdad en 375 hasta que fue condonado, y en 376 su hermano Sharaf al-Dawla lo golpeó y lo cegó {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
  fr: "Le fils d'Adud al-Dawla, investi par al-Ta'i' en 372 comme Shams al-Milla avec sept robes et les deux étendards; sa taxe sur la soie et le coton a presque embrasé Bagdad en 375 jusqu'à ce qu'elle soit remise, et en 376 son frère Sharaf al-Dawla l'a battu et aveuglé {cite:tarikh-khulafa-minhaj-1434 p. 630-631}."
  ur: "عدود الدولہ کا بیٹا، جسے الطائی نے 372 میں شمس الملا کے طور پر سات لباسوں اور دو معیاروں کے ساتھ سرمایہ کاری کی تھی۔ اس کے ریشم اور سوتی ٹیکس نے 375 میں بغداد کو تقریباً روشن کر دیا اور 376 میں اس کے بھائی شرف الدولہ نے اسے مارا پیٹا اور اندھا کر دیا۔ 630-631}۔"
  tr: "İbn 'Adud al-Dawla, yetmiş iki hicri'de babasının halefi olarak atanmış ve ona 'Şems al-Millah' unvanını vermiştir; yedi kez bir birlik olarak atanmıştır. 75 yılında, ipek ve pamuklu giysilerin üzerine peçe örtmek zorundaydı. Halk El-Mensur Camii'nde toplandı ve Cuma namazı yapılmasını engellemeye karar verdi, kasaba uyumsuzlaşmaya hazırlanıyordu, bu yüzden onları affetti. Kardeşi Şeraf el-Devle 1976'da yanına geldi, onu yendi ve ona bir sürgü yaptı {kaynak:Tarikh-khulafa-minhaj-1434, s. 630-631}."
  id: "Ibn 'Adud al-Dawla, yang diangkat sebagai penerus ayahnya pada tahun tujuh puluh dua AH dan memberinya gelar 'Shams al-Millah,' dan ia diangkat tujuh kali sebagai detasemen. Pada tahun 75, ia harus memasang kerudung pada pakaian sutra dan katun. Orang-orang berkumpul di Masjid Al-Mansur dan memutuskan untuk mencegah salat Jumat, dan kota itu hampir menjadi tidak harmonis, sehingga ia mengampuni mereka. Saudaranya Sharaf al-Dawla datang kepadanya pada tahun 1976, dan ia mengalahkannya serta menjadikannya kohl {cite:Tarikh-khulafa-minhaj-1434, hlm. 630-631}."
