id: person/abu-al-tayyib-tahir-ibn-abdallah
class: person
label: { ar: "القاضي أبو الطيب طاهر بن عبد الله الشافعي", en: "Qadi Abu'l-Tayyib Tahir ibn 'Abd Allah", fr: "Le cadi Abu'l-Tayyib Tahir ibn 'Abd Allah", es: "Qadi Abu'l-Tayyib Tahir ibn 'Abd Allah", ur: "قادی ابوالطیب طاہر ابن عبد اللہ" }
summary:
  ar: "القاضي الشافعي الذي عارض قصيدة عمران بن حطان في مدح ابن ملجم بقوله يا ضربة من شقي ما أراد بها إلا ليهدم للإسلام أركاناً، وألحق به آخر أبيات المعارضة في الثناء على علي {cite:muruj-al-dhahab p. 704-705}."
  en: "The Shafi'i qadi who answered Ibn Hittan's praise of Ibn Muljim verse-for-verse — 'a wretched man's strike, meant to demolish Islam's pillars' {cite:muruj-al-dhahab p. 704-705}."
  fr: "Le cadi shafi'ite qui répondit vers pour vers à l'éloge d'Ibn Muljim par Ibn Hittan — « le coup d'un misérable, qui voulait abattre les piliers de l'islam » {cite:muruj-al-dhahab p. 704-705}."
  es: "El cadí shafi'í que respondió verso por verso a los elogios de Ibn Hittan a Ibn Muljim: «el ataque de un hombre miserable, destinado a demoler los pilares del Islam» {cita:muruj-al-dhahab págs. 704-705}."
  ur: "وہ شافعی قادی جس نے ابن ملجم کی ابن حطان کی تعریف کا جواب دیا آیت کے بدلے - 'ایک بدبخت آدمی کی ہڑتال کا مطلب اسلام کے ستونوں کو گرانا تھا'۔ 704-705}۔"
  tr: "İmran bin Hattan'ın İbn Mulcem'i öven şiirine karşı çıkan Şafiî kadı, \"İslam'ın temellerini yıkmaktan başka bir niyeti olmayan bir alçağın darbesi!\" demiş ve şiire Ali'yi öven son dizeleri eklemiştir. {kaynak: Muruj-al-dhahab s. 704-705}"
  id: "Hakim mazhab Syafi'i yang menentang puisi Imran bin Hattan yang memuji Ibn Muljam, mengatakan, “Wahai pukulan dari orang jahat yang tidak bermaksud lain selain menghancurkan pilar-pilar Islam,” dan ia menambahkan bait-bait terakhir penentangan yang memuji Ali {kutip:muruj-al-dhahab hlm. 704-705}."
