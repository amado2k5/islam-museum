summary:
  ar: "المهاجر بن قنفذ بن عمير القرشي التيمي، صحابي، قيل إن اسمه عمرو، ولقب بالمهاجر لأنه قدم على رسول الله فقال إن هذا المهاجر حقاً، وقيل أسلم يوم فتح مكة وسكن البصرة ومات بها. روى عن النبي، وروى عنه أبو ساسان حصين بن المنذر، روى له أبو داود والنسائي وابن ماجه. ⁦(؟-؟)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
  en: "al-Muhajir ibn Qunfudh ibn Umayr, a Qurashi of the Taym clan and a Companion. Some say his name was Amr; the title al-Muhajir is said to come from the Prophet's remark when he came to him. Some say he embraced Islam on the day of the conquest of Mecca, settled in Basra and died there. He narrated from the Prophet; Abu Sasan Hussayn ibn al-Mundhir narrated from him. Abu Dawud, al-Nasa'i and Ibn Majah record him. Dates not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
  fr: "Al-Muhajir ibn Qunfudh ibn Umayr, un Qurashi du clan Taym et un compagnon. Certains disent que son nom était Amr ; le titre al-Muhajir est dit venir de la remarque du Prophète quand il est venu à lui. Certains disent qu’il a embrassé l’islam le jour de la conquête de La Mecque, s’est installé à Bassorah et y est mort. Il a raconté du Prophète ; Abu Sasan Hussayn ibn al-Mundhir a raconté de lui. Abu Dawud, al-Nasa'i et Ibn Majah l'enregistrent. Dates non données. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
  es: "Al-Muhajir ibn Qunfudh ibn Umayr, un Qurashi del clan Taym y Compañero del Profeta. Algunos dicen que su nombre era Amr; se dice que el título de Al-Muhajir proviene de un comentario del Profeta cuando este lo visitó. Algunos afirman que se convirtió al Islam el día de la conquista de La Meca, se estableció en Basora y murió allí. Narró del Profeta; Abu Sasan Hussayn ibn al-Mundhir narró de él. Abu Dawud, al-Nasa'i e Ibn Majah lo mencionan. No se especifican las fechas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
  ur: "المہاجر بن قنفض ابن عمیر، قبیلہ تیم کا قریشی اور ایک صحابی۔ بعض کہتے ہیں کہ اس کا نام عمرو تھا۔ المہاجر کا لقب نبی کے اس ارشاد سے آیا جب آپ ان کے پاس آئے۔ بعض کہتے ہیں کہ اس نے فتح مکہ کے دن اسلام قبول کیا، بصرہ میں سکونت اختیار کی اور وہیں وفات پائی۔ انہوں نے نبی سے روایت کی؛ ابوسعان حسین بن المنذر نے ان سے روایت کی ہے۔ ابوداؤد، نسائی اور ابن ماجہ نے اسے نقل کیا ہے۔ تاریخیں نہیں دی گئیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص13368}"
