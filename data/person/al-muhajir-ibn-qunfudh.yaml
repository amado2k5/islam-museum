summary:
  ar: "المهاجر بن قنفذ بن عمير القرشي التيمي، صحابي، قيل إن اسمه عمرو، ولقب بالمهاجر لأنه قدم على رسول الله فقال إن هذا المهاجر حقاً، وقيل أسلم يوم فتح مكة وسكن البصرة ومات بها. روى عن النبي، وروى عنه أبو ساسان حصين بن المنذر، روى له أبو داود والنسائي وابن ماجه. (؟-؟). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
  en: "al-Muhajir ibn Qunfudh ibn Umayr, a Qurashi of the Taym clan and a Companion. Some say his name was Amr; the title al-Muhajir is said to come from the Prophet's remark when he came to him. Some say he embraced Islam on the day of the conquest of Mecca, settled in Basra and died there. He narrated from the Prophet; Abu Sasan Hussayn ibn al-Mundhir narrated from him. Abu Dawud, al-Nasa'i and Ibn Majah record him. Dates not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13368}"
