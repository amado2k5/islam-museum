summary:
  ar: "أبو علي محمد بن الحسن بن المظفر الكاتب اللغوي البغدادي المعروف بالحاتمي؛ أحد الأعلام العاهان المطلعين المكثرين؛ أخذ الأدب عن أبي عمر الزاهد غلام ثعلب وروى عنه أخباراً وأملاها في مجالس الأدب وأخذ عنه جماعة منهم القاضي أبو القاسم التنوخي؛ له «الرسالة الحاتمية» التي شرح فيها ما جرى بينه وبين أبي الطيب المتنبي من إظهار سرقاته وإبانة عيوب شعره وقد دلت على غزارة مادته وتوفر اطلاعه {cite:wafayat-ayan}."
  en: "Abu Ali al-Hatimi (d. 388) — the Baghdadi philologist-katib, pupil of Abu Umar al-Zahid; author of the famous al-Risala al-Hatimiyya, the detailed exposé of al-Mutanabbi's plagiarisms {cite:wafayat-ayan}."
  es: "Abu Ali al-Hatimi (m. 388), el filólogo-katib bagdadí, alumno de Abu Umar al-Zahid; autor del famoso al-Risala al-Hatimiyya, la exposición detallada de los plagios de al-Mutanabbi {citar:wafayat-ayan}."
  fr: "Abu Ali al-Hatimi (mort en 388) — le philologue-katib baghdadi, élève d'Abu Umar al-Zahid; auteur du célèbre al-Risala al-Hatimiyya, l'exposé détaillé des plagiats d'al-Mutanabbi {cite:wafayat-ayan}."
  ur: "ابو علی الحاتمی ⁦(متوفی 388)⁩ - بغدادی ماہر فلسفہ کاتب، ابو عمر الزاہد کے شاگرد؛ مشہور الرسالہ الحاتمیہ کے مصنف، المتنبی کے سرقہ کا تفصیلی انکشاف۔"
  tr: "Bağdatlı dilbilimci El-Hatimi olarak bilinen Ebu Ali Muhammed bin el-Muzaffar, önde gelen ve bilgili alimlerden biri, Telab'ın kölesi Ebu Ömer el-Zahid'den edebiyat öğrendi, ondan raporlar anlattı ve edebi toplantılarda dikte etti. Hakim Ebu el-Kasım el-Tanukhi de dahil olmak üzere bir grup âlim onun yanında eğitim aldı. 'El-Risalah el-Hatimiyya' adlı eserini yazdı; burada kendisi ile Ebu el-Teyyib el-Mutanabbi arasında olanları açıkladı; hırsızlıklarının ortaya çıkarılmasını ve şiirlerindeki kusurların tespit edilmesini anlattı; bu da materyalinin zenginliğini ve geniş bilgisini gösterdi."
  id: "Abu Ali Muhammad ibn al-Hasan ibn al-Muzaffar, ahli linguistik Baghdadi yang dikenal sebagai al-Hatimi, salah satu ulama terkemuka dan berpengalaman, mempelajari sastra dari Abu Umar al-Zahid, seorang budak Tha'lab, menceritakan laporan dan mendiktekannya dalam pertemuan sastra. Sekelompok ulama belajar di bawah bimbingannya, termasuk Hakim Abu al-Qasim al-Tanukhi. Ia menulis 'Al-Risalah al-Hatimiyya,' di mana ia menjelaskan apa yang terjadi antara dirinya dan Abu al-Tayyib al-Mutanabbi, termasuk pengungkapan pencuriannya dan identifikasi kekurangan dalam puisinya, yang menunjukkan kekayaan materi dan pengetahuan luasnya."
