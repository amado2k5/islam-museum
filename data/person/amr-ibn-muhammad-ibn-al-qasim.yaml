  ar: "عمرو بن محمد بن القاسم؛ كان مع الحكم بن عوانة يفوض إليه ويقلده جسيم أموره فأغزاه من المحفوظة فلما ظفر أمره بنى دون البحيرة مدينة وسماها المنصورة وهي التي ينزلها العمال اليوم."
  en: "Amr ibn Muhammad ibn al-Qasim; al-Hakam ibn Awana's trusted deputy — raiding from al-Mahfuza he built al-Mansura below the lake, the governors' seat."
  es: "Amr ibn Muhammad ibn al-Qasim, lugarteniente de confianza de al-Hakam ibn Awana, realizó incursiones desde al-Mahfuza y construyó al-Mansura, situada debajo del lago, sede del gobernador."
  fr: "Amr ibn Muhammad ibn al-Qasim; adjoint de confiance d'al-Hakam ibn Awana — menant des raids depuis al-Mahfuza, il construisit al-Mansura en contrebas du lac, le siège des gouverneurs."
  ur: "عمرو بن محمد بن القاسم؛ الحکم ابن عوانہ کے قابل اعتماد نائب - المحفوظہ سے چھاپہ مار کر اس نے المنصورہ کو جھیل کے نیچے بنایا، گورنر کی نشست۔"
