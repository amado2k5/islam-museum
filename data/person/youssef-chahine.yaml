summary:
  ar: "مخرج مصري، وُلد في الإسكندرية سنة 1926 وتوفي في القاهرة سنة 2008؛ عمل في السينما المصرية من 1950 حتى وفاته، وأخرج «باب الحديد» (1958) و«الأرض» (1969) ورباعية الإسكندرية الذاتية، واكتشف عمر الشريف، ونال جائزة كان للذكرى الخمسين عن مجمل أعماله سنة 1997."
  en: "Egyptian film director, born in Alexandria in 1926 and died in Cairo in 2008. Active in Egyptian cinema from 1950 until his death, he directed Cairo Station (1958), The Land (1969) and his autobiographical Alexandria quartet, launched the career of Omar Sharif, and received the Cannes 50th Anniversary Award for lifetime achievement in 1997."
  ur: "مصری فلم ہدایت کار، 1926 میں اسکندریہ میں پیدا ہوئے اور 2008 میں قاہرہ میں وفات پائی؛ 1950 سے وفات تک مصری سینما میں سرگرم رہے، «باب الحدید» (1958)، «الارض» (1969) اور اپنی سوانحی اسکندریہ چہار فلم بنائی، عمر شریف کو متعارف کرایا، اور 1997 میں کان کا پچاسویں سالگرہ کا لائف ٹائم اچیومنٹ ایوارڈ حاصل کیا۔"
  es: "Director de cine egipcio, nacido en Alejandría en 1926 y fallecido en El Cairo en 2008. Activo en el cine egipcio desde 1950 hasta su muerte, dirigió Estación de El Cairo (1958), La Tierra (1969) y su cuarteto autobiográfico Alejandría, impulsó la carrera de Omar Sharif y recibió el Premio del 50 Aniversario de Cannes a la trayectoria profesional en 1997."
  fr: "Réalisateur égyptien, né à Alexandrie en 1926 et décédé au Caire en 2008. Actif dans le cinéma égyptien de 1950 jusqu'à sa mort, il a réalisé Gare du Caire (1958), La Terre (1969) et son quatuor autobiographique Alexandrie, a lancé la carrière d'Omar Sharif et a reçu le Prix du 50e anniversaire de Cannes pour l'ensemble de son œuvre en 1997."
  tr: "1926'da İskenderiye'de doğan ve 2008'de Kahire'de vefat eden Mısırlı yönetmen; 1950'den ölümüne kadar Mısır sinemasında çalıştı, \"Demir Kapı\" (1958), \"Toprak\" (1969) ve İskenderiye Dörtlüsü'nü yönetti, Omar Sharif'i keşfetti ve 1997'de eserlerinin 50. yıldönümü için Cannes Ödülü'nü kazandı."
  id: "Seorang sutradara Mesir, lahir di Alexandria pada tahun 1926 dan meninggal di Kairo pada tahun 2008; ia bekerja di dunia perfilman Mesir dari tahun 1950 hingga wafatnya, menyutradarai \"Iron Gate\" (1958), \"The Land\" (1969), dan Alexandria Quartet, menemukan Omar Sharif, dan memenangkan Penghargaan Cannes untuk peringatan 50 tahun karyanya pada tahun 1997."
