summary:
  ar: "مخرج مصري، وُلد في الإسكندرية سنة 1926 وتوفي في القاهرة سنة 2008؛ عمل في السينما المصرية من 1950 حتى وفاته، وأخرج «باب الحديد» (1958) و«الأرض» (1969) ورباعية الإسكندرية الذاتية، واكتشف عمر الشريف، ونال جائزة كان للذكرى الخمسين عن مجمل أعماله سنة 1997."
  en: "Egyptian film director, born in Alexandria in 1926 and died in Cairo in 2008. Active in Egyptian cinema from 1950 until his death, he directed Cairo Station (1958), The Land (1969) and his autobiographical Alexandria quartet, launched the career of Omar Sharif, and received the Cannes 50th Anniversary Award for lifetime achievement in 1997."
  ur: "مصری فلم ہدایت کار، 1926 میں اسکندریہ میں پیدا ہوئے اور 2008 میں قاہرہ میں وفات پائی؛ 1950 سے وفات تک مصری سینما میں سرگرم رہے، «باب الحدید» (1958)، «الارض» (1969) اور اپنی سوانحی اسکندریہ چہار فلم بنائی، عمر شریف کو متعارف کرایا، اور 1997 میں کان کا پچاسویں سالگرہ کا لائف ٹائم اچیومنٹ ایوارڈ حاصل کیا۔"
