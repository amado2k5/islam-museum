summary:
  ar: "نسيم شاه، المعروفة بناز شاه (وُلدت في 13 تشرين الثاني 1973 في برادفورد)، سياسية عمالية بريطانية، عضوة البرلمان عن دائرة برادفورد الغربية منذ 2015. نشأت في ظروف صعبة، وأُرسلت طفلة إلى باكستان حيث زُوّجت زواجًا مرتبًا، وعملت قبل البرلمان في مجال الصحة النفسية المجتمعية، وخاضت حملة للإفراج عن والدتها. شغلت مناصب في حكومة الظل بين 2018 و2023، آخرها وزيرة ظل للحد من الجريمة."
  en: "Naseem Shah, known as Naz Shah (born 13 November 1973 in Bradford), is a British Labour politician who has been MP for Bradford West since 2015. Raised in difficult circumstances, she was sent to Pakistan as a child and entered an arranged marriage there, worked in community mental health before Parliament, and campaigned for her mother's release from prison. She held Opposition frontbench posts from 2018 to 2023, most recently as Shadow Minister for Crime Reduction."
  ur: "نسیم شاہ، جو ناز شاہ کے نام سے معروف ہیں (پیدائش 13 نومبر 1973، بریڈفورڈ)، برطانوی لیبر سیاست دان ہیں، جو 2015 سے بریڈفورڈ ویسٹ کی رکنِ پارلیمان ہیں۔ مشکل حالات میں پرورش پائی، بچپن میں پاکستان بھیجی گئیں جہاں ان کی طے شدہ شادی ہوئی، پارلیمان سے پہلے کمیونٹی ذہنی صحت کے شعبے میں کام کیا، اور اپنی والدہ کی رہائی کے لیے مہم چلائی۔ وہ 2018 سے 2023 تک اپوزیشن فرنٹ بینچ کے عہدوں پر رہیں، آخر میں شیڈو وزیر برائے انسدادِ جرائم رہیں۔"

