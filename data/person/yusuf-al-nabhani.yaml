summary:
  ar: "قاضٍ وفقيه وشاعر فلسطيني من إجزم بقضاء حيفا، من أبرز المدافعين عن الخلافة العثمانية والتصوف في عصره؛ درس في الأزهر وتولّى رئاسة محكمة الحقوق في بيروت نحو عشرين عامًا، وألّف عشرات الكتب في الحديث والمدائح النبوية وكرامات الأولياء، وأخذ طرقًا صوفية عدة عن شيوخها."
  en: "Palestinian judge, jurist and poet from Ijzim in the Haifa district, a leading defender of the Ottoman Caliphate and of Sufism in his age. Trained at al-Azhar, he presided over Beirut's Court of Rights for some twenty years and wrote dozens of works on hadith, Prophetic panegyric and the miracles of the saints; he was initiated into several Sufi orders."
  ur: "حیفہ ضلع کے گاؤں اجزم سے تعلق رکھنے والے فلسطینی قاضی، فقیہ اور شاعر؛ اپنے دور میں خلافتِ عثمانیہ اور تصوف کے نمایاں مدافع۔ الازہر سے تعلیم پائی، بیروت کی عدالتِ حقوق کی صدارت تقریباً بیس سال کی، اور حدیث، مدائح اور کراماتِ اولیا پر درجنوں کتابیں لکھیں؛ کئی صوفی سلسلوں میں بیعت ہوئے۔"
