    note: "Two independent biographical sources attest initiations into named orders for the man himself. The Arabic biography, following Zaki Mujahid's al-A'lam al-Sharqiyya, lists his taking the Idrisiyya from Ismail al-Nawwab, the Shadhiliyya from Muhammad ibn Mas'ud al-Fasi and Ali Nur al-Din al-Yashruti, the Naqshbandiyya from Imdad Allah al-Faruqi and Ghiyath al-Din al-Irbili, the Qadiriyya from Hasan ibn Abi Halawa al-Ghazzi, the Rifa'iyya from Abd al-Qadir al-Dajani and the Khalwatiyya from Hasan Ridwan al-Sa'idi; the Azhar Memory biography independently records the same six initiations in its own wording, and Mamduh's entry adds his own summary: he 'was Azharite, a Sufi, and adhered to the Shafi'i school of thought'."
