summary:
  ar: "محمد صالح المنجد (وُلد 1961م) عالم وداعية سوري من أصل فلسطيني مقيم في السعودية، مؤسس موقع «الإسلام سؤال وجواب» (1996م) والمشرف العام عليه، ومؤسس شركة مجموعة زاد ومشرفها، ومن مشاريعها أكاديمية زاد وقناة زاد الفضائية، وهو إمام وخطيب جامع عمر بن عبد العزيز بالخبر."
  en: "Muhammad Salih Al-Munajjid (born 1961) is a Syrian-born Islamic scholar and preacher of Palestinian family, resident in Saudi Arabia: founder of the IslamQA website (1996) and its general supervisor, and founder of the ZAD Group, whose projects include the ZAD Academy and the ZAD satellite channel; he is imam and khatib of the Umar ibn Abd al-Aziz Mosque in al-Khobar."
  ur: "محمد صالح المنجد (پیدائش 1961ء) شام میں پیدا ہونے والے فلسطینی نژاد عالم و داعی ہیں جو سعودی عرب میں مقیم ہیں: ویب سائٹ «اسلام سوال و جواب» (1996ء) کے بانی اور نگرانِ عام، اور زاد گروپ کے بانی، جس کے منصوبوں میں زاد اکیڈمی بھی شامل ہے۔"
