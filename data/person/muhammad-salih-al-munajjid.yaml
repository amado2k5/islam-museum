summary:
  ar: "محمد صالح المنجد ⁦(وُلد 1961م)⁩ عالم وداعية سوري من أصل فلسطيني مقيم في السعودية، مؤسس موقع «الإسلام سؤال وجواب» ⁦(1996م)⁩ والمشرف العام عليه، ومؤسس شركة مجموعة زاد ومشرفها، ومن مشاريعها أكاديمية زاد وقناة زاد الفضائية، وهو إمام وخطيب جامع عمر بن عبد العزيز بالخبر."
  en: "Muhammad Salih Al-Munajjid (born 1961) is a Syrian-born Islamic scholar and preacher of Palestinian family, resident in Saudi Arabia: founder of the IslamQA website (1996) and its general supervisor, and founder of the ZAD Group, whose projects include the ZAD Academy and the ZAD satellite channel; he is imam and khatib of the Umar ibn Abd al-Aziz Mosque in al-Khobar."
  ur: "محمد صالح المنجد ⁦(پیدائش 1961ء)⁩ شام میں پیدا ہونے والے فلسطینی نژاد عالم و داعی ہیں جو سعودی عرب میں مقیم ہیں: ویب سائٹ «اسلام سوال و جواب» ⁦(1996ء)⁩ کے بانی اور نگرانِ عام، اور زاد گروپ کے بانی، جس کے منصوبوں میں زاد اکیڈمی بھی شامل ہے۔"
  es: "Muhammad Salih Al-Munajjid (nacido en 1961) es un erudito y predicador islámico de origen sirio, de familia palestina, residente en Arabia Saudita: fundador del sitio web IslamQA (1996) y su supervisor general, y fundador del Grupo ZAD, cuyos proyectos incluyen la Academia ZAD y el canal satelital ZAD; es imán y predicador de la mezquita Umar ibn Abd al-Aziz en al-Khobar."
  fr: "Muhammad Salih Al-Munajjid (né en 1961) est un érudit et prédicateur islamique d'origine syrienne et d'une famille palestinienne, résidant en Arabie saoudite: fondateur du site web IslamQA (1996) et son superviseur général, et fondateur du groupe ZAD, dont les projets comprennent l'Académie ZAD et la chaîne satellite ZAD; il est imam et khatib de la mosquée Umar ibn Abd al-Aziz à al-Khobar."
  tr: "Mohammed Saleh Al-Munjid (d. 1961), Suudi Arabistan'da yaşayan, Filistin kökenli Suriyeli bir alim ve vaiizdir, \"Islam Question and Answer\" web sitesinin (1996) kurucusu ve genel denetçisidir. Ayrıca Zad Group Company'nin kurucusu ve süpervizörüdür. Projeleri arasında Zad Akademisi ve Zad Uydu Kanalı bulunmaktadır. Hobar'daki Ömer bin Abdülaziz Camii'nin imamı ve vaizidir."
  id: "Mohammed Saleh Al-Munjid (lahir 1961) adalah seorang cendekiawan dan pengkhotbah Suriah keturunan Palestina yang tinggal di Arab Saudi, pendiri dan pengawas umum situs web \"Islam Question and Answer\" (1996). Ia juga merupakan pendiri dan supervisor Zad Group Company. Di antara proyeknya adalah Zad Academy dan Zad Satellite Channel. Ia adalah imam dan pengkhotbah Masjid Omar bin Abdulaziz di Khobar."
