summary:
  ar: "سليمان حسني باشا (1838 – 8 أغسطس 1892)، مشير عثماني من إسطنبول، كان القائد العام للعمليات العثمانية في البلقان في صدر حرب 1877–1878 ولقّبه الجمهور بـ«بطل ممر شيبكا»، ثم حوكم ونُفي إلى بغداد فمات فيها. وهو أيضًا معلّم وكاتب من أوائل التركيين العلميين، صاحب «تاريخ عالم» و«إلمحال كبير»."
  en: "Süleyman Hüsnü Pasha (1838 – 8 August 1892) was an Ottoman field marshal from Istanbul who was chief commander of Ottoman operations in the Balkans in the opening of the Russo-Turkish War of 1877–78 and was popularly hailed as the Hero of Shipka Pass; he was later tried and exiled to Baghdad, where he died. He was also a teacher and writer, among the first scholarly Turkists, and author of Tarih-i Âlem and İlmihal-i Kebir."
  ur: "سلیمان حسنی پاشا (1838ء – 8 اگست 1892ء)، استنبول سے تعلق رکھنے والے عثمانی مشیر؛ 1877–1878ء کی جنگ کے آغاز میں بلقان میں عثمانی عملیات کے سپہ سالارِ اعلیٰ رہے اور «شپکا درے کے ہیرو» کہلائے، بعد میں مقدمہ چلا اور بغداد جلاوطن ہوئے جہاں وفات پائی۔ وہ معلم اور مصنف بھی تھے اور «تاریخِ عالم» و «علمحالِ کبیر» کے مصنف ہیں۔"
