label: { ar: "عبد العزيز بن موسى بن نصير", en: "Abd al-Aziz ibn Musa ibn Nusayr", fr: "Abd al-Aziz ibn Musa ibn Nusayr", es: "Abd al-Aziz ibn Musa ibn Nusayr", ur: "عبد العزیز بن موسیٰ بن نصیر" }
gender: male
summary:
  ar: "ابن موسى بن نصير؛ تولى الأندلس بعد قفول أبيه عنها باستخلافه إياه وسريره إشبيلية، فضبط سلطانها وضم نشرها وسد ثغورها وافتتح في ولايته مدائن كثيرة مما بقي على أبيه، وكان من خير الولاة إلا أن مدته لم تطل، فوثب به الجند وقتلوه عقب سنة خمس وتسعين في خلافة سليمان الموقع بأبيه لأشياء نقموها عليه منها زعموا تزوجه زوجة لذريق المكناة أم عاصم، وجيء برأسه إلى سليمان بين يدي أبيه {cite:nafh-tib-maqqari p. 317, 335}. ذكر الكتاب أن أهل إشبيلية ثاروا على المسلمين أثناء حصار موسى لماردة، فوجّه إليها ابنه عبد العزيز فأعاد فتحها ثم فتح لبلة ووابة. {cite:salabi-umayyad-state-2020 p.76} وكان أولى ولاة الأندلس بعد أبيه، ضبط الأمور وسدّ الثغور، ثم قتله بعض جنده غيلة في مستهل رجب سنة 97هـ. {cite:salabi-umayyad-state-2020 p.83}"
  en: "Mus a ibn Nusayr's son, left as his deputy in al-Andalus with his seat at Seville; he secured the frontiers, founded many cities and was the best of its governors, until the army killed him after 95 on Sulayman's orders — one charge being his marriage to Roderic's widow Umm Asim — and his head was laid before his father {cite:nafh-tib-maqqari p. 317, 335}."
  fr: "Fils de Musa ibn Nusayr, laissé comme son lieutenant en al-Andalus avec Séville pour siège ; il sécurisa les frontières, fonda de nombreuses villes et fut le meilleur de ses gouverneurs, jusqu'à ce que l'armée le tue après 95 sur l'ordre de Sulayman — l'un des griefs étant son mariage avec la veuve de Rodrigue, Umm Asim —, et sa tête fut déposée devant son père {cite:nafh-tib-maqqari p. 317, 335}."
  es: "Hijo de Mus a ibn Nusayr, fue dejado como su lugarteniente en al-Ándalus con sede en Sevilla; aseguró las fronteras, fundó muchas ciudades y fue el mejor de sus gobernadores, hasta que el ejército lo mató después del año 95 por orden de Sulayman —uno de los cargos fue su matrimonio con la viuda de Rodrigo, Umm Asim— y su cabeza fue colocada ante su padre {cite:nafh-tib-maqqari p. 317, 335}."
  ur: "موسی ابن نصیر کا بیٹا، اندلس میں اپنے نائب کے طور پر سیویل میں اپنی نشست کے ساتھ چھوڑا؛ اس نے سرحدیں محفوظ کیں، بہت سے شہروں کی بنیاد رکھی اور اس کے بہترین گورنر تھے، یہاں تک کہ سلیمان کے حکم پر فوج نے اسے 95 کے بعد قتل کر دیا - ایک الزام روڈرک کی بیوہ ام عاصم سے اس کی شادی کا تھا - اور اس کا سر اس کے والد کے سامنے رکھا گیا تھا۔ 317، 335}۔"
  tr: "İbn Musa ibn Nusayr, babasının vefatından sonra halefi olarak atanarak Endülüs valiliğini üstlendi ve Sevilla'da tahtını kurdu. Gücünü pekiştirdi, nüfusunu birleştirdi, sınırlarını güvence altına aldı ve babasının geride bıraktığı şehirler de dahil olmak üzere birçok şehri fethetti. En iyi valiler arasındaydı, ancak saltanatı kısa sürdü. Askerler ona karşı ayaklandı ve onu Hicri 95 yılında, daha önce babasına büyük saygı duyan Süleyman'ın halifeliği döneminde öldürdüler. Askerler, aralarında Roderic'in karısı olan Ümmü Asım adlı bir kadınla evlendiği iddiası da bulunan çeşitli nedenlerle ona kin besliyorlardı. Başı babasının huzurunda Süleyman'a getirildi. {kaynak:nafh-tib-maqqari s. 317, 335}. Kitap, Musa'nın Merida kuşatması sırasında Sevilla halkının Müslümanlara karşı ayaklandığından bahseder. Daha sonra oğlu Abdülaziz'i görevlendirdi ve o da bölgeyi geri aldı; ardından Lebla ve Ubaida'yı fethetti. {cite:salabi-umayyad-state-2020 s.76} Babasından sonra Endülüs'ün ilk valisiydi. Bölgeye düzen getirdi ve sınırları güvence altına aldı; ancak Hicri 97 yılının Receb ayının başında bazı askerleri tarafından suikaste uğradı. {cite:salabi-umayyad-state-2020 s.83}"
  id: "Ibn Musa ibn Nusayr mengambil alih jabatan gubernur Andalusia setelah kepergian ayahnya, setelah diangkat sebagai penggantinya dan mendirikan takhtanya di Sevilla. Ia mengkonsolidasikan kekuasaannya, menyatukan penduduknya, mengamankan perbatasannya, dan menaklukkan banyak kota selama pemerintahannya, termasuk kota-kota yang ditinggalkan ayahnya. Ia termasuk gubernur terbaik, tetapi pemerintahannya berumur pendek. Tentara memberontak melawannya dan membunuhnya pada tahun 95 Hijriah, selama kekhalifahan Sulaiman, yang sebelumnya sangat menghormati ayahnya. Mereka membencinya karena beberapa alasan, termasuk dugaan pernikahannya dengan seorang wanita bernama Umm Asim, yang pernah menjadi istri Roderic. Kepalanya dibawa ke hadapan Sulaiman di depan ayahnya. {cite:nafh-tib-maqqari hlm. 317, 335}. Kitab tersebut menyebutkan bahwa penduduk Sevilla memberontak terhadap kaum Muslim selama pengepungan Mérida oleh Musa. Kemudian ia mengutus putranya, Abd al-Aziz, yang merebut kembali wilayah tersebut, diikuti dengan penaklukan Lebla dan Ubaida. {cite:salabi-umayyad-state-2020 p.76} Ia adalah gubernur pertama Andalusia setelah ayahnya. Ia membawa ketertiban ke wilayah tersebut dan mengamankan perbatasan, kemudian beberapa tentaranya membunuhnya pada awal bulan Rajab tahun 97 Hijriah. {cite:salabi-umayyad-state-2020 p.83}"
