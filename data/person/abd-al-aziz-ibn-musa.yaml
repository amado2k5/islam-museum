label: { ar: "عبد العزيز بن موسى بن نصير", en: "Abd al-Aziz ibn Musa ibn Nusayr" }
gender: male
summary:
  ar: "ابن موسى بن نصير؛ تولى الأندلس بعد قفول أبيه عنها باستخلافه إياه وسريره إشبيلية، فضبط سلطانها وضم نشرها وسد ثغورها وافتتح في ولايته مدائن كثيرة مما بقي على أبيه، وكان من خير الولاة إلا أن مدته لم تطل، فوثب به الجند وقتلوه عقب سنة خمس وتسعين في خلافة سليمان الموقع بأبيه لأشياء نقموها عليه منها زعموا تزوجه زوجة لذريق المكناة أم عاصم، وجيء برأسه إلى سليمان بين يدي أبيه {cite:nafh-tib-maqqari p. 317, 335}. ذكر الكتاب أن أهل إشبيلية ثاروا على المسلمين أثناء حصار موسى لماردة، فوجّه إليها ابنه عبد العزيز فأعاد فتحها ثم فتح لبلة ووابة. {cite:salabi-umayyad-state-2020 p.76} وكان أولى ولاة الأندلس بعد أبيه، ضبط الأمور وسدّ الثغور، ثم قتله بعض جنده غيلة في مستهل رجب سنة 97هـ. {cite:salabi-umayyad-state-2020 p.83}"
  en: "Mus a ibn Nusayr's son, left as his deputy in al-Andalus with his seat at Seville; he secured the frontiers, founded many cities and was the best of its governors, until the army killed him after 95 on Sulayman's orders — one charge being his marriage to Roderic's widow Umm Asim — and his head was laid before his father {cite:nafh-tib-maqqari p. 317, 335}."
