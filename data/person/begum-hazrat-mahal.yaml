summary:
  ar: "ملكة ووصية هندية ⁦(نحو 1820–1879)⁩، الزوجة الثانية لنواب أوده واجد علي شاه وأم برجس قادر. بعد ضم البريطانيين لأوده سنة 1856 ونفي زوجها، قادت في تمرد 1857 المقاومة في لكناو بوصفها وصية على ابنها القاصر الذي أعلنته حاكمًا لأوده، حتى استعاد البريطانيون المدينة، فلجأت إلى نيبال وتوفيت في كاتماندو في 7 أبريل 1879."
  en: "Indian queen and regent (c. 1820–1879), second wife of Wajid Ali Shah, Nawab of Awadh, and mother of Birjis Qadr. After the British annexed Awadh in 1856 and exiled her husband, she led the resistance at Lucknow in the rebellion of 1857 as regent for her minor son, whom she had proclaimed ruler of Awadh, until the British retook the city; she took asylum in Nepal and died at Kathmandu on 7 April 1879."
  ur: "ہندوستانی ملکہ و نائب السلطنت ⁦(تقریباً 1820ء–1879ء)⁩، نوابِ اودھ واجد علی شاہ کی دوسری بیوی اور برجیس قدر کی والدہ۔ 1856ء میں اودھ کے انگریزی قبضے اور شوہر کی جلاوطنی کے بعد 1857ء کی جنگ میں لکھنؤ کی مزاحمت کی قیادت کی، اپنے نابالغ بیٹے کی نائب کی حیثیت سے، جسے انھوں نے اودھ کا حکمران قرار دیا تھا؛ شہر کے دوبارہ قبضے کے بعد نیپال میں پناہ لی اور 7 اپریل 1879ء کو کھٹمنڈو میں وفات پائی۔"
  es: "Reina y regente de la India (c. 1820–1879), segunda esposa de Wajid Ali Shah, Nawab de Awadh, y madre de Birjis Qadr. Tras la anexión británica de Awadh en 1856 y el exilio de su marido, lideró la resistencia en Lucknow durante la rebelión de 1857 como regente de su hijo menor, a quien había proclamado gobernante de Awadh, hasta que los británicos retomaron la ciudad. Se refugió en Nepal y falleció en Katmandú el 7 de abril de 1879."
  fr: "Reine et régente indienne (vers 1820-1879), seconde épouse de Wajid Ali Shah, nawab d'Awadh, et mère de Birjis Qadr. Après l'annexion d'Awadh par les Britanniques en 1856 et l'exil de son époux, elle mena la résistance à Lucknow lors de la rébellion de 1857 en tant que régente pour son fils mineur, qu'elle avait proclamé souverain d'Awadh, jusqu'à la reprise de la ville par les Britanniques; elle se réfugia au Népal et mourut à Katmandou le 7 avril 1879."
  tr: "Hindistan kraliçesi ve naibi (yaklaşık 1820–1879), Oudh Nawab'ı Wajid Ali Shah'ın ikinci eşi ve Burjis Qadir'in annesiydi. İngilizler 1856'da Oudh'u ilhak ettikten ve kocasını sürgüne gönderdikten sonra, 1857 isyanında Lucknow'daki direnişi yönetti ve küçük oğlunu Ouda valisi ilan etti; Ouda'yı Ouda'nın valisi ilan etti, ta ki İngilizler şehri geri alana kadar. Nepal'e kaçtı ve 7 Nisan 1879'da Katmandu'da öldü."
  id: "Ratu dan wali India (sekitar 1820–1879), istri kedua Nawab Oudh, Wajid Ali Shah, dan ibu Burjis Qadir. Setelah Inggris menganeksasi Oudh pada tahun 1856 dan mengasingkan suaminya, dia memimpin perlawanan di Lucknow dalam pemberontakan 1857 sebagai wali putranya yang masih di bawah umur, yang dia nyatakan sebagai gubernur Ouda, hingga Inggris merebut kembali kota itu. Dia melarikan diri ke Nepal dan meninggal di Kathmandu pada 7 April 1879."
