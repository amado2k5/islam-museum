summary:
  ar: "ملكة ووصية هندية (نحو 1820–1879)، الزوجة الثانية لنواب أوده واجد علي شاه وأم برجس قادر. بعد ضم البريطانيين لأوده سنة 1856 ونفي زوجها، قادت في تمرد 1857 المقاومة في لكناو بوصفها وصية على ابنها القاصر الذي أعلنته حاكمًا لأوده، حتى استعاد البريطانيون المدينة، فلجأت إلى نيبال وتوفيت في كاتماندو في 7 أبريل 1879."
  en: "Indian queen and regent (c. 1820–1879), second wife of Wajid Ali Shah, Nawab of Awadh, and mother of Birjis Qadr. After the British annexed Awadh in 1856 and exiled her husband, she led the resistance at Lucknow in the rebellion of 1857 as regent for her minor son, whom she had proclaimed ruler of Awadh, until the British retook the city; she took asylum in Nepal and died at Kathmandu on 7 April 1879."
  ur: "ہندوستانی ملکہ و نائب السلطنت (تقریباً 1820ء–1879ء)، نوابِ اودھ واجد علی شاہ کی دوسری بیوی اور برجیس قدر کی والدہ۔ 1856ء میں اودھ کے انگریزی قبضے اور شوہر کی جلاوطنی کے بعد 1857ء کی جنگ میں لکھنؤ کی مزاحمت کی قیادت کی، اپنے نابالغ بیٹے کی نائب کی حیثیت سے، جسے انھوں نے اودھ کا حکمران قرار دیا تھا؛ شہر کے دوبارہ قبضے کے بعد نیپال میں پناہ لی اور 7 اپریل 1879ء کو کھٹمنڈو میں وفات پائی۔"
