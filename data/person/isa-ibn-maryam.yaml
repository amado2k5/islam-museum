label: { ar: "عيسى بن مريم", en: "Isa ibn Maryam (Jesus)" }
gender: male
summary:
  ar: "نبي بني إسرائيل وابن مريم. عند البخاري أنه أحد الثلاثة الذين تكلموا في المهد {cite:sahih-al-bukhari 3436}، وأنه ومريم لم يطعنهما الشيطان حين الولادة دون سائر بني آدم {cite:sahih-al-bukhari 3431}، وقال النبي «أنا أولى الناس بعيسى بن مريم في الدنيا والآخرة، والأنبياء إخوة لعلات أمهاتهم شتى ودينهم واحد» {cite:sahih-al-bukhari 3443}، ورآه في الإسراء ربعة مربوع الخلق إلى الحمرة {cite:sahih-al-bukhari 3207}."
  en: "Prophet of Banu Israel, son of Maryam: one of the three who spoke in the cradle {cite:sahih-al-bukhari 3436}, untouched by Satan's prick at birth {cite:sahih-al-bukhari 3431}, and the Prophet declared himself the nearest of people to him {cite:sahih-al-bukhari 3443}."
