label: { ar: "عيسى بن مريم", en: "Isa ibn Maryam (Jesus)" }
gender: male
summary:
  ar: "اسم عيسى القرآني ليسوع ابن مريم، نبي ورسول عند المسلمين، يذكره القرآن في خمس عشرة سورة وهو أساس علم المسيح في الإسلام. تذكر دائرة المعارف الإسلامية ميلاده المعجز من مريم، وكلامه في المهد، ومعجزاته بإذن الله، ونزول الإنجيل عليه، ونفي الصلب مع رفعه إلى الله، وعودته في آخر الزمان في الرواية الإسلامية. وهو أيضًا أحد الثلاثة الذين تكلموا في المهد عند البخاري، وقال النبي «أنا أولى الناس بعيسى بن مريم في الدنيا والآخرة» {cite:sahih-al-bukhari 3436} {cite:sahih-al-bukhari 3443}."
  en: "Isa is the Qur'anic name for Jesus, son of Mary, a prophet and messenger in Muslim belief, whom the Qur'an mentions in fifteen suras and who is the basis of Muslim Christology. The Encyclopaedia of Islam covers his miraculous birth to Maryam, speaking in the cradle, his miracles by God's leave, the Gospel revealed to him, the Qur'anic denial of the crucifixion with his being raised to God, and his return at the end of time in Muslim tradition. In al-Bukhari he is one of the three who spoke in the cradle, and the Prophet declared himself the nearest of people to him {cite:sahih-al-bukhari 3436} {cite:sahih-al-bukhari 3443}."
  ur: "عیسیٰ قرآنی نام ہے یسوع ابن مریم کا، جو مسلمانوں کے ہاں نبی اور رسول ہیں اور قرآن انہیں پندرہ سورتوں میں ذکر کرتا ہے؛ یہی اسلامی مسیحیات کی بنیاد ہے۔ انسائیکلوپیڈیا آف اسلام ان کی مریم سے معجزانہ ولادت، گہوارے میں کلام، اللہ کے اذن سے معجزات، ان پر انجیل کے نزول، صلیب کی نفی کے ساتھ ان کے اللہ کی طرف اٹھائے جانے، اور اسلامی روایت میں آخر زمانے میں ان کی واپسی کا ذکر کرتی ہے۔ بخاری میں وہ ان تین میں سے ہیں جو گہوارے میں بولے، اور نبی نے فرمایا کہ میں ان کا سب سے قریب ہوں {cite:sahih-al-bukhari 3436} {cite:sahih-al-bukhari 3443}۔"
