id: person/ahmad-ibn-attash
class: person
label: { ar: "أحمد بن عبد الملك بن عطاش", en: "Ahmad ibn Abd al-Malik ibn Attash", fr: "Ahmad ibn Abd al-Malik ibn Attash", es: "Ahmad ibn Abd al-Malik ibn Attash", ur: "احمد بن عبد الملک بن عطاش" }
summary:
  ar: "صاحب قلعة الباطنية بأصبهان؛ تملكها اثنتي عشرة سنة، وهي من بناء ملكشاه على رأس جبل، فغزا السلطان محمد بن ملكشاه الباطنية سنة خمسمائة وأخذ القلعة وقتله {cite:shadharat-dhahab p. 410}."
  en: "Master of the Batiniyya's fortress at Isfahan for twelve years — a castle Malikshah built atop a mountain — until Sultan Muhammad b. Malikshah stormed it and killed him in 500 {cite:shadharat-dhahab p. 410}."
  fr: "Maître de la forteresse de la Batiniyya à Ispahan durant douze ans, château construit par Malikshah au sommet d'une montagne, jusqu'à sa prise par le sultan Muhammad b. Malikshah, qui le tua en 500 H {cite:shadharat-dhahab p. 410}."
  es: "Maestro de la fortaleza de los Batiniyya en Isfahán durante doce años —un castillo que Malikshah construyó en la cima de una montaña— hasta que el sultán Muhammad b. Malikshah la asaltó y lo mató en el año 500 {cite:shadharat-dhahab p. 410}."
  ur: "اصفہان میں بطینیہ کے قلعے کا مالک بارہ سال تک - ایک قلعہ ملک شاہ نے پہاڑ کے اوپر بنایا - یہاں تک کہ سلطان محمد بن۔ ملک شاہ نے 500 میں اس پر حملہ کر کے اسے قتل کر دیا۔ 410}۔"
  tr: "İsfahan'daki Batiniyya kalesinin sahibi; on iki yıl boyunca kaleye sahipti. Kale, Malikşah tarafından bir dağ tepesine inşa edilmişti. Sultan Muhammed bin Malikşah, 500 yılında Batiniyya'ya saldırdı, kaleyi ele geçirdi ve onu öldürdü. {kaynak: Shadharat-dhahab s. 410}"
  id: "Pemilik benteng Batiniyya di Isfahan; ia memilikinya selama dua belas tahun. Benteng itu dibangun oleh Malikshah di puncak gunung. Sultan Muhammad bin Malikshah menyerang Batiniyya pada tahun 500 dan merebut benteng tersebut serta membunuhnya. {cite:shadharat-dhahab p. 410}."
