id: person/asad-allah-isfahani
class: person
label:
  ar: "أسد الله الأصفهاني"
  en: "Asad Allah Isfahani"
summary:
  ar: "صانع سيوف فارسي مشهور من أصفهان في عهد الشاه عباس الأول؛ يُروى أنه صنع سيفًا قطع به خوذة أرسلها السلطان العثماني إلى الشاه، فأعفاه الشاه وصناع السيوف من الضريبة {cite:encyclopaedia-of-islam-2 vol. 1 p. 734}."
  en: "Celebrated Persian sword-maker (shamshirsaz) of Isfahan in the time of Shah Abbas I. It is said that the Ottoman sultan sent a helmet to Shah Abbas and offered money to whoever could cut it in two with a sword; Asad made a sword that did it, and Shah Abbas remitted the tax of the sword-makers {cite:encyclopaedia-of-islam-2 vol. 1 p. 734}."
