summary:
  ar: "بطاقة أولية لحمد الله المستوفي القزويني، الجغرافي المؤرخ صاحب نزهة القلوب وتاريخ گزيده، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Hamdallah Mustawfi Qazwini, the geographer-historian of Nuzhat al-Qulub and Tarikh-i Guzida, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Hamdallah Mustawfi Qazwini, geógrafo e historiador de Nuzhat al-Qulub y Tarikh-i Guzida, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche provisoire de Hamdallah Mustawfi Qazwini, géographe-historien de Nuzhat al-Qulub et Tarikh-i Guzida, nommé d'après une description de référence ouverte (Wikidata); son entrée al-A'lam n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "نزہت القلوب اور تاریخ گوزیدہ کے جغرافیہ دان، حمداللہ مستوفی قزوینی کے لیے ڈرافٹ کارڈ، جس کا نام کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Nuzhat al-Qulub wa Tarikh Ezida'nın coğrafyacı ve tarihçisi Hamdallah Al-Mustawfi Al-Qazwini'nin ön kartı, açık referans açıklamasında (Wikidata) bahsedilmiştir. Biyografisi henüz Önemli Sözlük'te incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan oleh Hamdallah Al-Mustawfi Al-Qazwini, ahli geografi dan sejarawan penulis Nuzhat al-Qulub wa Tarikh Ezida, disebutkan dalam deskripsi referensi terbuka (Wikidata). Biografinya belum ditinjau dalam Kamus Terkenal di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
