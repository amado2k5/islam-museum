summary:
  ar: "مؤرخ ومحاضر مسلم بريطاني مقيم في لندن، متخصص في تاريخ الحضارة الإسلامية وعلم المسكوكات الإسلامية. حاصل على البكالوريوس بمرتبة الشرف في التاريخ من كلية بيركبيك بجامعة لندن والماجستير من كلية الدراسات الشرقية والأفريقية (SOAS)، وحاصل على إجازات في الحديث. عمل باحثًا أول ومحاضرًا في أكاديمية iERA، وهو خطيب في عدد من مساجد غرب لندن، ويدير قناته الخاصة على يوتيوب التي تنشر محاضراته التاريخية ومناظراته."
  en: "A British Muslim historian and lecturer based in London, specialising in the history of Islamic civilisation and Islamic numismatics. He holds a BA with honours in history from Birkbeck College, University of London, and a master's degree from SOAS, and holds ijazas in hadith. He served as a senior researcher and lecturer with iERA, is a khateeb in a number of West London mosques, and runs his own YouTube channel of history lectures and debates."
  ur: "لندن میں مقیم برطانوی مسلمان مؤرخ و محاضر، جو اسلامی تہذیب کی تاریخ اور اسلامی مسکوکات کے ماہر ہیں۔ انہوں نے برکبیک کالج، یونیورسٹی آف لندن سے تاریخ میں آنرز کی ڈگری اور SOAS سے ماسٹرز کیا، اور حدیث میں اجازے حاصل کیے۔ وہ iERA میں سینئر محقق و لیکچرر رہے، مغربی لندن کی کئی مساجد میں خطیب ہیں، اور اپنا یوٹیوب چینل چلاتے ہیں جس پر ان کے تاریخی لیکچرز اور مناظرے شائع ہوتے ہیں۔"
