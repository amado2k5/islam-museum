summary:
  ar: "ملكة المغول (1823–1886)، زوجة الإمبراطور بهادر شاه ظفر المقرّبة والحاكمة الفعلية باسمه من 1840 إلى 1857. سعت إلى تنصيب ابنها مرزا جوان بخت وليًّا للعهد، وفي ثورة 1857 أبعدته عن الثوار حفاظًا على عرشه، ثم نُفيت مع زوجها إلى رانغون بعد سقوط دلهي، وتوفيت هناك سنة 1886."
  en: "Mughal empress consort (1823–1886), the favoured wife of the emperor Bahadur Shah Zafar and de facto regent of the empire from 1840 to 1857. She worked to have her son Mirza Jawan Bakht named heir, kept him away from the rebels in 1857 to protect his claim, and was exiled with her husband to Rangoon after Delhi fell, dying there in 1886."
  ur: "مغل ملکہ (1823ء–1886ء)، شہنشاہ بہادر شاہ ظفر کی چہیتی زوجہ اور 1840ء سے 1857ء تک عملاً سلطنت کی حکمران۔ انھوں نے اپنے بیٹے مرزا جواں بخت کو ولی عہد بنانے کی کوشش کی، 1857ء میں اس کے دعوے کی حفاظت کے لیے اسے باغیوں سے دور رکھا، اور دہلی کے سقوط کے بعد شوہر کے ساتھ رنگون جلاوطن ہوئیں جہاں 1886ء میں ان کا انتقال ہوا۔"
