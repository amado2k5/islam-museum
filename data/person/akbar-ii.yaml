summary:
  ar: "أكبر الثاني (22 أبريل 1760 – 28 سبتمبر 1837)، إمبراطور المغول التاسع عشر، ابن شاه عالم الثاني، حكم من 1806 إلى 1837. كانت سلطته الفعلية محدودة بنفوذ شركة الهند الشرقية، وقد أرسل رام موهان روي سفيراً إلى إنجلترا لمناشدة قضيته، وخلفه ابنه بهادر شاه الثاني آخر أباطرة المغول."
  en: "Akbar II (22 April 1760 – 28 September 1837) was the nineteenth Mughal emperor, a son of Shah Alam II, reigning from 1806 to 1837. His effective power was confined by the East India Company; he sent Ram Mohan Roy as his envoy to England to plead his case, and was succeeded by his son Bahadur Shah II, the last Mughal emperor."
  ur: "اکبر ثانی (22 اپریل 1760ء – 28 ستمبر 1837ء) انیسویں مغل بادشاہ، شاہ عالم ثانی کے فرزند، 1806ء سے 1837ء تک تخت نشین رہے۔ آپ کی اصل طاقت ایسٹ انڈیا کمپنی کے بڑھتے ہوئے اقتدار کے سامنے محدود تھی؛ آپ نے رام موہن رائے کو اپنا ایلچی بنا کر انگلستان بھیجا، اور آپ کے بعد آپ کے فرزند بہادر شاہ ثانی آخری مغل بادشاہ بنے۔"

