summary:
  ar: "هشام بن عامر بن أمية بن زيد بن الحسحاس بن مالك الأنصاري، صحابي، يقال كان اسمه شهابا فغيره رسول الله فسماه هشاما، روى عن النبي، وعنه ابنه سعد وحميد بن هلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8523}"
  en: "Hisham ibn Amir ibn Umayya ibn Zayd ibn al-Hasahas ibn Malik al-Ansari, a Companion. It is said that his name was Shihab, and the Prophet changed it to Hisham. He narrated from the Prophet, and his son Sa'd and Humayd ibn Hilal narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8523}"
