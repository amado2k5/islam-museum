summary:
  ar: "أبو الغارات طلائع بن رزيك الملقب الملك الصالح؛ وزير مصر؛ كان والياً لمنفية بني خصيب من أعمال صعيد مصر؛ فلما قُتل الظافر إسماعيل صاحب مصر سار أهل القصر إلى الصالح واستنجدوا به على عباس وولده نصر فتوجه إلى القاهرة فهرب عباس وولده وأتباعهم وتولى الوزارة في أيام الفائز واستقل بالأمور في التاسع عشر من شهر ربيع الأول سنة تسع وأربعين وخمسمائة؛ وكان فاضلاً سمحاً في العطاء حسن الجلوس مع الناس وقال الشعر ووقف ابن خلكان على ديوانه في جزأين؛ ومن العجائب أنه ولي الوزارة في التاسع عشر وقتل في التاسع عشر {cite:wafayat-ayan}."
  en: "Talai' b. Ruzzik, al-Malik al-Salih (b. 495, killed 556) — Fatimid vizier; governor of Menfiat Bani Khusayb who took Cairo after al-Zafir's murder and ruled under al-Fa'iz; a poet with a two-part diwan {cite:wafayat-ayan}."
