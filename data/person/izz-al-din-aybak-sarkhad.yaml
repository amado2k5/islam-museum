summary:
  ar: "عز الدين أيبك؛ صاحب صرخد؛ توفي في أوائل جمادى الأولى سنة ست وأربعين وستمائة في موضع اعتقاله بالقاهرة ودفن خارج باب النصر في تربة شمس الدولة وحضر ابن خلكان الصلاة عليه ودفنه ثم نُقل إلى تربته في مدرسته التي أنشأها ظاهر دمشق على الشرف الأعلى مطلة على الميدان الأخضر الكبير {cite:wafayat-ayan}."
  en: "Izz al-Din Aybak of Sarkhad (d. 646) — Ayyubid amir; died in custody at Cairo; Ibn Khallikan attended his funeral prayer before the body was transferred to his madrasa outside Damascus overlooking the Green Maydan {cite:wafayat-ayan}."
