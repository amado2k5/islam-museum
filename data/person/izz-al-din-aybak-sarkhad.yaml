summary:
  ar: "عز الدين أيبك؛ صاحب صرخد؛ توفي في أوائل جمادى الأولى سنة ست وأربعين وستمائة في موضع اعتقاله بالقاهرة ودفن خارج باب النصر في تربة شمس الدولة وحضر ابن خلكان الصلاة عليه ودفنه ثم نُقل إلى تربته في مدرسته التي أنشأها ظاهر دمشق على الشرف الأعلى مطلة على الميدان الأخضر الكبير {cite:wafayat-ayan}."
  en: "Izz al-Din Aybak of Sarkhad (d. 646) — Ayyubid amir; died in custody at Cairo; Ibn Khallikan attended his funeral prayer before the body was transferred to his madrasa outside Damascus overlooking the Green Maydan {cite:wafayat-ayan}."
  es: "Izz al-Din Aybak de Sarkhad (m. 646) — emir ayubí; murió bajo custodia en El Cairo; Ibn Khallikan asistió a su oración fúnebre antes de que el cuerpo fuera trasladado a su madrasa en las afueras de Damasco con vistas al Maydan Verde {cite:wafayat-ayan}."
  fr: "Izz al-Din Aybak de Sarkhad (d. 646) — Émir ayyoubide; mort en détention au Caire; Ibn Khallikan a assisté à sa prière funéraire avant que le corps ne soit transféré à sa madrasa à l'extérieur de Damas surplombant le Maïdan vert {cite:wafayat-ayan}."
  ur: "عزالدین ایبک آف سرخاد ⁦(وفات 646)⁩ - ایوبی امیر؛ قاہرہ میں زیر حراست انتقال کر گئے ابن خلقان نے اس کی نماز جنازہ میں شرکت کی اس سے پہلے کہ میت کو دمشق کے باہر اس کے مدرسے میں منتقل کیا جائے جہاں سبز میدان کے نظارے ہوتے ہیں۔"
