  ar: "الملك العزيز يوسف بن الأشرف برسباي؛ بويع بالسلطنة بعد وفاة أبيه سنة أربعين وثمانمائة وخلع بعد ثلاثة أشهر تقريباً وبقي مسجوناً بالإسكندرية، وفي شهر المحرم سنة ثمان وستين وثمانمائة توفي هناك وعمره نحو أربعين سنة، وتوفي أخوه الشهاب أحمد بن برسباي في تلك السنة نفسها وعمره نحو سبع وعشرين سنة ولم يقبض الوالدان ليلة واحدة {cite:shadharat-dhahab p. 305}."
  en: "Al-Aziz Yusuf ibn Barsbay — boy-sultan proclaimed on his father's death in 840, deposed after ~three months and kept prisoner at Alexandria; died there Muharram 868 aged ~40; his brother Shihab Ahmad followed within the same year, aged ~27 {cite:shadharat-dhahab p. 305}."
