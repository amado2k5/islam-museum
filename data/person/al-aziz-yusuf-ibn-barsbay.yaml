summary:
  ar: "الملك العزيز يوسف بن الأشرف برسباي؛ بويع بالسلطنة بعد وفاة أبيه سنة أربعين وثمانمائة وخلع بعد ثلاثة أشهر تقريباً وبقي مسجوناً بالإسكندرية، وفي شهر المحرم سنة ثمان وستين وثمانمائة توفي هناك وعمره نحو أربعين سنة، وتوفي أخوه الشهاب أحمد بن برسباي في تلك السنة نفسها وعمره نحو سبع وعشرين سنة ولم يقبض الوالدان ليلة واحدة {cite:shadharat-dhahab p. 305}."
  en: "Al-Aziz Yusuf ibn Barsbay — boy-sultan proclaimed on his father's death in 840, deposed after ~three months and kept prisoner at Alexandria; died there Muharram 868 aged ~40; his brother Shihab Ahmad followed within the same year, aged ~27 {cite:shadharat-dhahab p. 305}."
  fr: "Al-Aziz Yusuf ibn Barsbay — enfant-sultan proclamé à la mort de son père en 840 H, déposé après environ trois mois et gardé prisonnier à Alexandrie ; il y mourut en muharram 868 H vers quarante ans ; son frère Shihab Ahmad le suivit dans la même année, vers vingt-sept ans {cite:shadharat-dhahab p. 305}."
  es: "Al-Aziz Yusuf ibn Barsbay — sultán niño proclamado tras la muerte de su padre en 840, depuesto después de unos tres meses y mantenido prisionero en Alejandría; murió allí en Muharram de 868 a la edad de unos 40 años; su hermano Shihab Ahmad le siguió en el mismo año, a la edad de unos 27 años {cita: shadharat-dhahab p. 305}."
  ur: "العزیز یوسف ابن بارسبے - لڑکا سلطان نے 840 میں اپنے والد کی موت کا اعلان کیا، تین ماہ کے بعد معزول کیا گیا اور اسکندریہ میں قید رکھا گیا۔ وہیں 40 سال کی عمر میں محرم 868 میں وفات پائی۔ اس کے بھائی شہاب احمد نے اسی سال 27 سال کی عمر میں پیروی کی۔ 305}۔"
