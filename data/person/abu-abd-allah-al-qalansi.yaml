summary:
  ar: "أبو عبد الله القلانسي، كان بالمهد وافيًا، وكان الحق له في المعاطب ناجيًا. روى عبد الواحد بن بكر أنه ركب البحر فعصفت به الريح فنذر أن لا يأكل لحم الفيل، وأن الناجين أكلوا لحم فيل وُلد ثم جاءت أمه تطلب ولدها."
  en: "Abu Abd Allah al-Qalansi, who was faithful to his cradle of promise and found the truth as his deliverance in perils; Abd al-Wahid ibn Bakr relates that a storm struck the ship he was on, and he vowed not to eat elephant meat; the rescued company ate the flesh of a newborn elephant that had been slaughtered, and its mother came seeking the calf, and carried him away, as the report tells it."
  ur: "ابو عبد اللہ قلانسی اپنے عہد پر قائم رہنے والے تھے، اور خطرات میں انہیں حق نے نجات دی۔ عبد الواحد بن بکر نقل کرتے ہیں کہ وہ سفر میں سمندر کی کشتی پر تھے کہ تیز ہوا چلی، تو انہوں نے نذر مانی کہ وہ ہاتھی کا گوشت نہ کھائیں گے؛ ساتھیوں نے ایک نوزائیدہ ہاتھی ذبح کر کے کھایا، اور اس کی ماں بچے کو ڈھونڈتی ہوئی آئی اور روایت کے مطابق انہیں اپنے ساتھ لے گئی۔"
