summary:
  ar: ابن عم الهادي، استخلفه على صنعاء حين صار إلى شبام سنة 288هـ، ثم أخرجه من صنعاء جمع من أهلها بعد أن كسروا الحبس.
  en: A cousin of al-Hadi, whom he left as deputy at Sana'a when he went to Shibam in 288 AH, and whom a crowd from Sana'a drove out of the city after breaking the prison.
  ur: ہادی کے چچا زاد، جنہیں انہوں نے 288ھ میں شبام جاتے وقت صنعاء پر نائب بنایا، اور جنہیں صنعاء کے ایک جمگھٹے نے قید خانہ توڑ کر شہر سے نکال دیا۔
