id: person/ali-ibn-sulayman-ibn-al-qasim
class: person
label:
  ar: علي بن سليمان بن القاسم بن إبراهيم
  en: Ali ibn Sulayman ibn al-Qasim ibn Ibrahim
  ur: علی بن سلیمان بن قاسم بن ابراہیم
  es: "Ali ibn Sulayman ibn al-Qasim ibn Ibrahim"
  fr: "Ali ibn Sulayman ibn al-Qasim ibn Ibrahim"
summary:
  ar: ابن عم الهادي، استخلفه على صنعاء حين صار إلى شبام سنة 288هـ، ثم أخرجه من صنعاء جمع من أهلها بعد أن كسروا الحبس.
  en: A cousin of al-Hadi, whom he left as deputy at Sana'a when he went to Shibam in 288 AH, and whom a crowd from Sana'a drove out of the city after breaking the prison.
  ur: ہادی کے چچا زاد، جنہیں انہوں نے 288ھ میں شبام جاتے وقت صنعاء پر نائب بنایا، اور جنہیں صنعاء کے ایک جمگھٹے نے قید خانہ توڑ کر شہر سے نکال دیا۔
  es: "Un primo de al-Hadi, a quien dejó como lugarteniente en Sana'a cuando se marchó a Shibam en el año 288 de la Hégira, y a quien una multitud de Sana'a expulsó de la ciudad tras fugarse de la prisión."
  fr: "Un cousin d'al-Hadi, qu'il laissa comme adjoint à Sana'a lorsqu'il partit pour Shibam en 288 AH, et qu'une foule de Sana'a chassa de la ville après avoir pris d'assaut la prison."
  tr: "El-Hadi'nin kuzeni, 288 Hicri yılında Şibab'a ulaştığında onu Sana'a vali yardımcısı olarak atadı, ardından bir grup halkı hapiseden kurtulduktan sonra onu Sana'a'dan kovdu."
  id: "Sepupu Al-Hadi mengangkatnya sebagai wakil gubernur Sana'a ketika ia tiba di Shibam pada tahun 288 H, lalu mengusirnya dari Sana'a setelah sekelompok penduduknya membebaskan diri dari penjara."
