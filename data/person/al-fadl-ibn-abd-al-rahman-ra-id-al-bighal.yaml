id: person/al-fadl-ibn-abd-al-rahman-ra-id-al-bighal
class: person
label: { ar: "الفضل بن عبد الرحمن رائض البغال", en: "al-Fadl ibn Abd al-Rahman, Ra'id al-Bighal", fr: "Al-Fadl ibn Abd al-Rahman, Ra’id al-Bighal", es: "al-Fadl ibn Abd al-Rahman, Ra'id al-Bighal", ur: "الفضل بن عبدالرحمٰن، رعد البیضال" }
summary:
  ar: "الفضل بن عبد الرحمن بن العباس بن ربيعة بن الحارث بن عبد المطلب؛ كان يلقب رائض البغال لجودة ركوبه لها وتابعه الناس بعد هرب ابن الأشعث إلى سجستان فهرب من الحجاج وإليه ترد قطيعة نهر نافذ التي كان أقطعها عثمان العباس بن ربيعة مع مائة ألف درهم."
  en: "Al-Fadl ibn Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib — nicknamed Ra'id al-Bighal, mule-breaker, for his riding; folk followed him after Ibn al-Ash'ath's flight to Sijistan, and he fled al-Hajjaj. To his house reverted the Nahr Nafidh qati'a Uthman had granted al-Abbas ibn Rabi'a with a hundred thousand dirhams."
  fr: "Al-Fadl ibn Abd al-Rahman ibn al-Abbas ibn Rabi’a ibn al-Harith ibn Abd al-Muttalib — surnommé Ra’id al-Bighal, dresseur de mules, pour sa monte ; les gens le suivirent après la fuite d’Ibn al-Ash’ath au Sijistan, et il fuit al-Hajjaj. À sa maison revint la concession du Nahr Nafidh qu’Uthman avait octroyée à al-Abbas ibn Rabi’a avec cent mille dirhams."
  es: "Al-Fadl ibn Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib, apodado Ra'id al-Bighal, domador de mulas, por su habilidad para montar a caballo; la gente lo siguió tras la huida de Ibn al-Ash'ath a Sijistan, y él huyó de al-Hajjaj. A su casa le fue devuelto el Nahr Nafidh qati'a que Uthman le había concedido a al-Abbas ibn Rabi'a con cien mil dirhams."
  ur: "الفضل بن عبدالرحمٰن ابن العباس ابن ربیعہ ابن الحارث ابن عبدالمطلب — عرفی نام رعید البیغل، خچر توڑنے والا، اپنی سواری کے لیے؛ ابن اشعث کی سجستان کی طرف پرواز کے بعد لوگوں نے اس کا پیچھا کیا اور وہ الحجاج سے بھاگ گیا۔ نہر نافع قتیعہ عثمان نے عباس بن ربیعہ کو ایک لاکھ درہم عطیہ کیے تھے۔"
  tr: "El-Fadl ibn Abdülrahman ibn el-Abbas ibn Rabi'ah ibn el-Harith ibn Abdülmuttalib; katır sürmedeki ustalığı nedeniyle katır binicisi lakabıyla anılıyordu ve İbn el-Eş'at'ın Sijistan'a kaçmasından sonra insanlar onu takip etti. Böylece Haccac'tan kaçtı ve Osman'ın el-Abbas ibn Rabi'ah'a verdiği Nahr Nafidh mülkü, yüz bin dirhemle birlikte ona iade edildi."
  id: "Al-Fadl ibn Abd al-Rahman ibn al-Abbas ibn Rabi’ah ibn al-Harith ibn Abd al-Muttalib; ia dijuluki penunggang keledai karena keahliannya dalam menunggangi keledai, dan orang-orang mengikutinya setelah Ibn al-Ash’ath melarikan diri ke Sijistan, sehingga ia melarikan diri dari al-Hajjaj, dan kepadanya dikembalikan tanah milik Nahr Nafidh yang telah diberikan Uthman kepada al-Abbas ibn Rabi’ah beserta seratus ribu dirham."
