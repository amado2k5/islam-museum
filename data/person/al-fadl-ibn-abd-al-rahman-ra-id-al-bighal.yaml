summary:
  ar: "الفضل بن عبد الرحمن بن العباس بن ربيعة بن الحارث بن عبد المطلب؛ كان يلقب رائض البغال لجودة ركوبه لها وتابعه الناس بعد هرب ابن الأشعث إلى سجستان فهرب من الحجاج وإليه ترد قطيعة نهر نافذ التي كان أقطعها عثمان العباس بن ربيعة مع مائة ألف درهم."
  en: "Al-Fadl ibn Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib — nicknamed Ra'id al-Bighal, mule-breaker, for his riding; folk followed him after Ibn al-Ash'ath's flight to Sijistan, and he fled al-Hajjaj. To his house reverted the Nahr Nafidh qati'a Uthman had granted al-Abbas ibn Rabi'a with a hundred thousand dirhams."
