label: { ar: "المتوكل على الله" }
summary:
  ar: "خليفة عباسي، قُتل في سنة سبع وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.226}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي كان معروفاً بالنصب، وكان منهمكاً في اللذات والشراب وله أربعة آلاف سرية وطىء الجميع، وكان جواداً ممدحاً يقال ما أعطى خليفة شاعراً ما أعطى، وسلم عليه بالخلافة ثمانية كل واحد منهم أبوه خليفة منصور بن المهدي والعباس بن الهادي وأبو أحمد بن الرشيد وعبد الله بن الأمين وموسى بن المأمون وأحمد بن المعتصم ومحمد بن الواثق وابنه المنتصر {cite:tarikh-khulafa-minhaj-1434 p. 539-543}، وعند السيوطي كان أول من تمذهب من الخلفاء وكان متمذهباً بمذهب الشافعي، وقال للفتح بن خاقان لما وصف له أطيب عيش منه رجل له دار واسعة وزوجة صالحة ومعيشة حاضرة لا يعرفنا فنؤذيه ولا يحتاج إلينا فنزدريه، وقال ليزيد المهلبي الخلفاء كانت تتصعب على الرعية لتطيعها وأنا ألين لهم ليحبوني ويطيعوني {cite:tarikh-khulafa-minhaj-1434 p. 545-547}.، وعند المسعودي كانت أيام أبي الوزير في الوزارة يسيرة فاتخذ محمد بن الفضل الجرجرائي ثم عبيد الله بن يحيى سنة ثلاث وثلاثين ومائتين إلى أن قتل، وسعى بعلي بن محمد العلوي إليه فهجم عليه ليلاً فوجده على مدرعة شعر يترنم بآيات الوعد والوعيد فأعظمه وأجلسه وأعفاه من كأسه {cite:muruj-al-dhahab p. 476, 480}، وعند المسعودي أخذ لأولاده الثلاثة العهد في كتب وشروط فجعل ولي عهده المنتصر ثم المعتز ثم إبراهيم المؤيد وأخذت البيعة على الناس بذلك وفرق الأموال {cite:muruj-al-dhahab p. 519-520}"
