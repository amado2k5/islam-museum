id: person/al-mutawakkil
class: person
label: { ar: "المتوكل على الله", en: "al-Mutawakkil ala Allah", fr: "al-Mutawakkil ala Allah" , ur: "المتوکل علی اللہ", es: "al-Mutawakkil ala Allah"}
summary:
  ar: "خليفة عباسي، قُتل في سنة سبع وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.226}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي كان معروفاً بالنصب، وكان منهمكاً في اللذات والشراب وله أربعة آلاف سرية وطىء الجميع، وكان جواداً ممدحاً يقال ما أعطى خليفة شاعراً ما أعطى، وسلم عليه بالخلافة ثمانية كل واحد منهم أبوه خليفة منصور بن المهدي والعباس بن الهادي وأبو أحمد بن الرشيد وعبد الله بن الأمين وموسى بن المأمون وأحمد بن المعتصم ومحمد بن الواثق وابنه المنتصر {cite:tarikh-khulafa-minhaj-1434 p. 539-543}، وعند السيوطي كان أول من تمذهب من الخلفاء وكان متمذهباً بمذهب الشافعي، وقال للفتح بن خاقان لما وصف له أطيب عيش منه رجل له دار واسعة وزوجة صالحة ومعيشة حاضرة لا يعرفنا فنؤذيه ولا يحتاج إلينا فنزدريه، وقال ليزيد المهلبي الخلفاء كانت تتصعب على الرعية لتطيعها وأنا ألين لهم ليحبوني ويطيعوني {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. وعند المسعودي كانت أيام أبي الوزير في الوزارة يسيرة فاتخذ محمد بن الفضل الجرجرائي ثم عبيد الله بن يحيى سنة ثلاث وثلاثين ومائتين إلى أن قتل، وسعى بعلي بن محمد العلوي إليه فهجم عليه ليلاً فوجده على مدرعة شعر يترنم بآيات الوعد والوعيد فأعظمه وأجلسه وأعفاه من كأسه {cite:muruj-al-dhahab p. 476, 480}، وعند المسعودي أخذ لأولاده الثلاثة العهد في كتب وشروط فجعل ولي عهده المنتصر ثم المعتز ثم إبراهيم المؤيد وأخذت البيعة على الناس بذلك وفرق الأموال {cite:muruj-al-dhahab p. 519-520}"
  en: "Abbasid caliph, killed in 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.226}; al-Tabari mentions some of his affairs and conduct {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. According to al-Suyuti he was known for enmity to Ali (nasb), immersed in pleasures and wine, had four thousand concubines and had relations with all of them. He was generous and much praised; it was said that no caliph gave a poet what he gave. Eight men, each the son of a caliph, greeted him as caliph: Mansur ibn al-Mahdi, al-Abbas ibn al-Hadi, Abu Ahmad ibn al-Rashid, Abd Allah ibn al-Amin, Musa ibn al-Ma'mun, Ahmad ibn al-Mu'tasim, Muhammad ibn al-Wathiq, and his son al-Muntasir {cite:tarikh-khulafa-minhaj-1434 p. 539-543}. According to al-Suyuti he was the first caliph to adopt a madhhab, following that of al-Shafi'i. He said to al-Fath ibn Khaqan, when the latter described to him the finest life, a man with a spacious house, a righteous wife and a settled livelihood, who does not know us so that we might harm him, nor needs us so that we might despise him. He said to Yazid al-Muhallabi, 'The caliphs used to be harsh with the subjects so that they would obey; I am gentle with them so that they love and obey me' {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. According to al-Mas'udi, the days of Abu al-Wazir in the vizierate were few; he employed Muhammad ibn al-Fadl al-Jarjara'i, then 'Ubayd Allah ibn Yahya in 233, until the latter was killed. When someone informed on 'Ali ibn Muhammad al-'Alawi to him, he raided him at night, found him wearing a wool shirt and chanting verses of promise and threat, honoured him, seated him, and excused him from his cup {cite:muruj-al-dhahab p. 476, 480}. According to al-Mas'udi he took oaths of succession for his three sons, set down in documents and conditions: he made his heir al-Muntasir, then al-Mu'tazz, then Ibrahim al-Mu'ayyad. The oath was taken from the people accordingly, and he distributed money {cite:muruj-al-dhahab p. 519-520}."
  fr: "Le calife abbasside tué en 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.226}; al-Tabari mentionne certaines de ses affaires et de sa conduite {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. Selon al-Suyuti, il était connu pour son inimitié envers Ali (nasb), immergé dans les plaisirs et le vin, avait quatre mille concubines et avait des relations avec toutes. Il était généreux et très loué ; on disait qu'aucun calife ne donnait à un poète ce qu'il donnait. Huit hommes, chacun le fils d'un calife, l'ont salué comme calife : Mansur ibn al-Mahdi, al-Abbas ibn al-Hadi, Abu Ahmad ibn al-Rashid, Abd Allah ibn al-Amin, Musa ibn al-Ma'mun, Ahmad ibn al-Mu'tasim, Muhammad ibn al-Wathiq, et son fils al-Muntasir {cite:tarikh-khulafa-minhaj-1434 p. 539-543}. Selon al-Suyuti, il fut le premier calife à adopter un madhhab, suivant celui d'al-Shafi'i. Il dit à al-Fath ibn Khaqan, quand ce dernier lui décrivit la plus belle vie, un homme avec une maison spacieuse, une femme juste et un gagne-pain établi, qui ne nous connaît pas pour que nous puissions lui faire du mal, ni a besoin de nous pour que nous puissions le mépriser. Il dit à Yazid al-Muhallabi  : « Les califes étaient durs avec les sujets afin qu’ils obéissent  ; je suis doux avec eux afin qu’ils m’aiment et m’obéissent.  » {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. Selon al-Mas'udi, les jours d'Abou al-Wazir dans le vizir étaient peu nombreux ; il employait Muhammad ibn al-Fadl al-Jarjara'i, puis 'Ubayd Allah ibn Yahya en 233, jusqu'à ce que ce dernier soit tué. Quand quelqu'un lui a informé sur 'Ali ibn Muhammad al-'Alawi, il l'a attaqué la nuit, l'a trouvé portant une chemise de laine et chantant des versets de promesse et de menace, l'a honoré, l'a assis, et l'a excusé de sa tasse {cite:muruj-al-dhahab p. 476, 480}. Selon al-Mas'udi, il a prêté serment de succession pour ses trois fils, inscrits dans des documents et des conditions : il a fait son héritier al-Muntasir, puis al-Mu'tazz, puis Ibrahim al-Mu'ayyad. Le serment fut pris au peuple en conséquence, et il distribua de l'argent {cite:muruj-al-dhahab p. 519-520}."
  ur: "عباسی خلیفہ، جن کا قتل 247ھ میں ہوا؛ طبری اور دوسرے مؤرخین نے ان کی حکومت کے اقدامات اور دربار کے احوال بیان کیے ہیں۔ {cite:tabari-tarikh-abu-al-fadl}"
  es: "Califa abasí, asesinado en 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.226}; al-Tabari menciona algunos de sus asuntos y conducta {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. Según al-Suyuti, era conocido por su enemistad con Ali (nasb), se entregaba a los placeres y al vino, tenía cuatro mil concubinas y mantenía relaciones con todas ellas. Era generoso y muy elogiado; se decía que ningún califa le había dado a un poeta lo que él le dio. Ocho hombres, cada uno hijo de un califa, lo saludaron como califa: Mansur ibn al-Mahdi, al-Abbas ibn al-Hadi, Abu Ahmad ibn al-Rashid, Abd Allah ibn al-Amin, Musa ibn al-Ma'mun, Ahmad ibn al-Mu'tasim, Muhammad ibn al-Wathiq y su hijo al-Muntasir {cite:tarikh-khulafa-minhaj-1434 p. 539-543}. Según al-Suyuti, fue el primer califa en adoptar una madhhab, siguiendo la de al-Shafi'i. Le dijo a al-Fath ibn Khaqan, cuando este le describió la vida más hermosa, un hombre con una casa espaciosa, una esposa virtuosa y un sustento estable, que no nos conoce para que podamos dañarlo, ni nos necesita para que podamos despreciarlo. Le dijo a Yazid al-Muhallabi: «Los califas solían ser duros con los súbditos para que obedecieran; yo soy amable con ellos para que me amen y me obedezcan» {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. Según al-Mas'udi, los días de Abu al-Wazir en el visir fueron pocos; empleó a Muhammad ibn al-Fadl al-Jarjara'i, luego a 'Ubayd Allah ibn Yahya en 233, hasta que este último fue asesinado. Cuando alguien le informó sobre 'Ali ibn Muhammad al-'Alawi, lo asaltó por la noche, lo encontró vistiendo una camisa de lana y recitando versículos de promesa y amenaza, lo honró, lo sentó y lo eximió de su copa {cite:muruj-al-dhahab p. 476, 480}. Según al-Mas'udi, tomó juramentos de sucesión para sus tres hijos, plasmados en documentos y condiciones: nombró heredero a al-Muntasir, luego a al-Mu'tazz y finalmente a Ibrahim al-Mu'ayyad. El juramento fue tomado por el pueblo en consecuencia, y él distribuyó dinero {cita:muruj-al-dhahab págs. 519-520}."
  tr: "247 Hicri yılında öldürülen bir Abbasi halifesi {atıf:tabari-tarikh-abu-al-fadl j.9 s.226}. El-Tabari, bazı işlerinden ve biyografisinden bahsetmiştir {atıf:tabari-tarikh-abu-al-fadl j.9 s.230}. el-Suyuti'ye göre, servetiyle tanınır, zevk ve içkiye dalmış, dört bin devesi vardı ve hepsiyle yola çıkmıştır. Cömert ve övgüye değerdi; bir halifenin bir şaire verdiğini vermediği söylenir. Sekiz kişi onu halifelikle karşıladı; her biri babası Halife Mansur ibn al-Mehdi, el-Abbas ibn al-Hadi, Ebu Ahmed bin Rashid, Abdullah ibn al-Amin ve Musa ibn al-Ma'mun idi. Ahmed ibn al-Mu'tasim, Muhammed ibn al-Wathiq ve oğlu el-Muntasir {cite:History-Khulafa-minhaj-1434, s. 539-543} ve el-Suyuti'ye göre, Halifeler arasında Şafii mezhebini benimseyen ilk kişi olmuştur. Al-Fath bin Khaqan'a, kendisinden daha iyi bir hayata sahip olduğu söylendiğinde, geniş bir eve sahip, doğru bir eşi ve mevcut geçimi olan bir adam, bizi tanımayan, ona zarar vermemiz ve bize ihtiyaç duymadığımız için onu küçümsememiz gerektiğini söyledi. Yezide dedi ki: Halifeler için tebaaların onlara itaat etmesi zordu, ben onlara nazik davranırdım ki beni sevip itaat etsinler {cite:History-Khulafa-minhaj-1434, s. 545-547} dedi. El-Mes'udi için Ebu el-Vezir'in vaizlik dönemi kısaydı, bu yüzden 233 Hicri yılında Muhammed bin Fadl el-Cercer'i, ardından Ubeyd Allah ibn Yahya olarak atadı, ta ki öldürülene kadar. Ali bin Muhammed el-Alavi ona koştu, gece saldırdı ve onu zırhlı bir araçta vaat ve uyarı ayetleri okurken buldu. Onu onurlandırdı, oturttu ve kadehinden kurtardı {atıf:Muruj-al-Dhahab s. 476, 480}. El-Mes'udi ile birlikte, üç oğlu için kitap ve şartlarda rehin verdi, onu önce veliaht prens, sonra al-Mu'tazz, sonra İbrahim el-Muayyad yaptı. Yemin halktan alındı ve servet dağıtıldı {cite:Muruj-al-dhahab, s. 519-520}"
  id: "Seorang khalifah Abbasiyah yang dibunuh pada tahun 247 H {cite:tabari-tarikh-abu-al-fadl j.9 hlm.226}. Al-Tabari menyebutkan beberapa urusan dan biografinya {cite:tabari-tarikh-abu-al-fadl j.9 hlm.230}. Menurut al-Suyuti, ia dikenal karena kekayaannya dan tenggelam dalam kesenangan serta minuman, memiliki empat ribu unta dan berangkat bersama semua. Ia murah hati dan terpuji; konon seorang khalifah tidak memberikan apa yang diberikan kepada penyair. Delapan orang menyambutnya dengan kekhalifahan, masing-masing adalah ayahnya Khalifah Mansur ibn al-Mahdi, al-Abbas ibn al-Hadi, Abu Ahmad ibn al-Rashid, Abdullah ibn al-Amin, dan Musa ibn al-Ma'mun Ahmad ibn al-Mu'tasim, Muhammad ibn al-Wathiq, dan putranya al-Muntasir {cite:History-Khulafa-minhaj-1434, hlm. 539-543}, dan menurut al-Suyuti, ia adalah khalifah pertama yang mengadopsi aliran pemikiran Syafi'i. Ia berkata kepada Al-Fath ibn Khaqan, ketika digambarkan memiliki kehidupan yang lebih baik darinya, seorang pria dengan rumah luas, istri yang benar, dan mata pencaharian saat ini, yang tidak mengenal kami, sehingga kami akan menyakitinya dan tidak membutuhkan kami sehingga kami akan membencinya. Ia berkata kepada Yazid: Khalifah sulit ditaati oleh rakyatnya, dan saya akan bersikap lembut kepada mereka agar mereka mencintai saya dan menaati saya {cite:History-Khulafa-minhaj-1434, hlm. 545-547}. Bagi al-Mas'udi, masa Abu al-Wazir dalam jabatan itu singkat, sehingga ia mengangkat Muhammad ibn al-Fadl al-Jarjar'i, kemudian Ubayd Allah ibn Yahya pada tahun 233 H, hingga ia tewas. Ali ibn Muhammad al-Alawi bergegas kepadanya, menyerangnya pada malam hari, dan menemukannya di atas kendaraan lapis baja, sambil melantunkan ayat-ayat janji dan peringatan. Ia menghormatinya, mendudukkannya, dan menyelamatkannya dari cawan {cite:muruj-al-dhahab hlm. 476, 480}. Bersama al-Mas'udi, ia mengambil janji untuk ketiga putranya dalam buku dan syarat, menjadikannya putra mahkota, kemudian al-Mu'tazz, lalu Ibrahim al-Mu'ayyad. Janji itu diambil dari rakyat sesuai kebutuhan, dan kekayaan didistribusikan {cite:Muruj-al-dhahab, hlm. 519-520}"
