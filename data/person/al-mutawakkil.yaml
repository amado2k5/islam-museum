id: person/al-mutawakkil
class: person
label: { ar: "المتوكل على الله", en: "al-Mutawakkil ala Allah" }
summary:
  ar: "خليفة عباسي، قُتل في سنة سبع وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.226}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي كان معروفاً بالنصب، وكان منهمكاً في اللذات والشراب وله أربعة آلاف سرية وطىء الجميع، وكان جواداً ممدحاً يقال ما أعطى خليفة شاعراً ما أعطى، وسلم عليه بالخلافة ثمانية كل واحد منهم أبوه خليفة منصور بن المهدي والعباس بن الهادي وأبو أحمد بن الرشيد وعبد الله بن الأمين وموسى بن المأمون وأحمد بن المعتصم ومحمد بن الواثق وابنه المنتصر {cite:tarikh-khulafa-minhaj-1434 p. 539-543}، وعند السيوطي كان أول من تمذهب من الخلفاء وكان متمذهباً بمذهب الشافعي، وقال للفتح بن خاقان لما وصف له أطيب عيش منه رجل له دار واسعة وزوجة صالحة ومعيشة حاضرة لا يعرفنا فنؤذيه ولا يحتاج إلينا فنزدريه، وقال ليزيد المهلبي الخلفاء كانت تتصعب على الرعية لتطيعها وأنا ألين لهم ليحبوني ويطيعوني {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. وعند المسعودي كانت أيام أبي الوزير في الوزارة يسيرة فاتخذ محمد بن الفضل الجرجرائي ثم عبيد الله بن يحيى سنة ثلاث وثلاثين ومائتين إلى أن قتل، وسعى بعلي بن محمد العلوي إليه فهجم عليه ليلاً فوجده على مدرعة شعر يترنم بآيات الوعد والوعيد فأعظمه وأجلسه وأعفاه من كأسه {cite:muruj-al-dhahab p. 476, 480}، وعند المسعودي أخذ لأولاده الثلاثة العهد في كتب وشروط فجعل ولي عهده المنتصر ثم المعتز ثم إبراهيم المؤيد وأخذت البيعة على الناس بذلك وفرق الأموال {cite:muruj-al-dhahab p. 519-520}"
  en: "Abbasid caliph, killed in 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.226}; al-Tabari mentions some of his affairs and conduct {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. According to al-Suyuti he was known for enmity to Ali (nasb), immersed in pleasures and wine, had four thousand concubines and had relations with all of them. He was generous and much praised; it was said that no caliph gave a poet what he gave. Eight men, each the son of a caliph, greeted him as caliph: Mansur ibn al-Mahdi, al-Abbas ibn al-Hadi, Abu Ahmad ibn al-Rashid, Abd Allah ibn al-Amin, Musa ibn al-Ma'mun, Ahmad ibn al-Mu'tasim, Muhammad ibn al-Wathiq, and his son al-Muntasir {cite:tarikh-khulafa-minhaj-1434 p. 539-543}. According to al-Suyuti he was the first caliph to adopt a madhhab, following that of al-Shafi'i. He said to al-Fath ibn Khaqan, when the latter described to him the finest life, a man with a spacious house, a righteous wife and a settled livelihood, who does not know us so that we might harm him, nor needs us so that we might despise him. He said to Yazid al-Muhallabi, 'The caliphs used to be harsh with the subjects so that they would obey; I am gentle with them so that they love and obey me' {cite:tarikh-khulafa-minhaj-1434 p. 545-547}. According to al-Mas'udi, the days of Abu al-Wazir in the vizierate were few; he employed Muhammad ibn al-Fadl al-Jarjara'i, then 'Ubayd Allah ibn Yahya in 233, until the latter was killed. When someone informed on 'Ali ibn Muhammad al-'Alawi to him, he raided him at night, found him wearing a wool shirt and chanting verses of promise and threat, honoured him, seated him, and excused him from his cup {cite:muruj-al-dhahab p. 476, 480}. According to al-Mas'udi he took oaths of succession for his three sons, set down in documents and conditions: he made his heir al-Muntasir, then al-Mu'tazz, then Ibrahim al-Mu'ayyad. The oath was taken from the people accordingly, and he distributed money {cite:muruj-al-dhahab p. 519-520}."
