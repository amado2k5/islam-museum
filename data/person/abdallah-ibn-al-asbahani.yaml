summary:
  ar: "عبد الله بن الأصبهاني؛ نسبت إليه دار ابن الأصبهاني بالبصرة وكان له أربعمائة ملوك لقي المختار مع مصعب وهو على ميمنته."
  en: "Abdallah ibn al-Asbahani; Basra's Dar Ibn al-Asbahani bears his name — he commanded four hundred men when he met al-Mukhtar under Mus'ab, on the right wing."
  fr: "Abdallah ibn al-Asbahani ; la Dar Ibn al-Asbahani de Bassora porte son nom — il commandait quatre cents hommes lorsqu'il affronta al-Mukhtar sous Mus'ab, à l'aile droite."
  es: "Abdallah ibn al-Asbahani; el Dar Ibn al-Asbahani de Basora lleva su nombre; él comandaba cuatrocientos hombres cuando se encontró con al-Mukhtar bajo el mando de Mus'ab, en el ala derecha."
  ur: "عبداللہ ابن الاسبہانی؛ بصرہ کا دار ابن الاسبہانی اس کا نام رکھتا ہے - جب اس نے دائیں بازو پر مصعب کے نیچے المختار سے ملاقات کی تو اس نے چار سو آدمیوں کا حکم دیا۔"
