summary:
  ar: "أبو عبد الرحمن مقبل بن هادي الوادعي، محدّث معاصر، صاحب «التتبع لما في المستدرك من أوهام» الذي طُبع في ذيل مستدرك الحاكم بدار الحرمين؛ بدأ تقييد فوائده عليه وهو بمعهد الحرم المكي قبل نحو عشرين سنة من كتابة مقدمته المؤرخة 4 ربيع الأول 1414هـ، وله «الصحيح المسند مما ليس في الصحيحين» وحاشية على «الإلزامات» للدارقطني {cite:mustadrak-haramayn-1997-v1 p. 5-6, 14, 21, 38}."
  en: "Abu 'Abd al-Rahman Muqbil ibn Hadi al-Wadi'i, a modern hadith scholar, author of al-Tatabbu' li-ma fi al-Mustadrak min awham, printed beneath al-Hakim's Mustadrak in the Dar al-Haramayn edition; he began recording his notes on it while at the Institute of the Meccan Haram about twenty years before writing its introduction, dated 4 Rabi' I 1414 AH, and he also compiled al-Sahih al-Musnad mimma laysa fi al-Sahihayn and annotated al-Daraqutni's al-Ilzamat {cite:mustadrak-haramayn-1997-v1 p. 5-6, 14, 21, 38}."
  ur: "ابو عبد الرحمن مقبل بن ہادی وادعی، معاصر محدث، «التتبع لما فی المستدرک من اوہام» کے مصنف جو دار الحرمین کے ایڈیشن میں حاکم کی المستدرک کے نیچے چھپی؛ انہوں نے اس پر اپنے فوائد معہد الحرم المکی میں اپنے مقدمے ⁦(مؤرخہ 4 ربیع الاول 1414ھ)⁩ سے تقریباً بیس برس پہلے لکھنا شروع کیے، اور «الصحیح المسند مما لیس فی الصحیحین» بھی مرتب کی اور دارقطنی کی «الالزامات» پر حاشیہ لکھا {cite:mustadrak-haramayn-1997-v1 p. 5-6, 14, 21, 38}۔"
