summary:
  ar: "رجل دولة باكستاني (1895–1951) من كرنال، أول رئيس وزراء لباكستان (1947–1951) واليد اليمنى لمحمد علي جناح في حركة باكستان. درس في عليكرة وأكسفورد، وكان الأمين العام الفخري للرابطة الإسلامية، واغتيل وهو يخاطب تجمعاً في راولبندي في 16 تشرين الأول 1951 ودُفن في مزار قائد في كراتشي."
  en: "Pakistani statesman (1895–1951) of Karnal, the first prime minister of Pakistan (1947–1951) and Muhammad Ali Jinnah's right hand in the Pakistan movement. Educated at Aligarh and Oxford and honorary general secretary of the Muslim League, he was assassinated while addressing a gathering at Rawalpindi on 16 October 1951 and buried at Mazar-e-Quaid in Karachi."
  ur: "پاکستانی مدبر (1895ء–1951ء) جن کا تعلق کرنال سے تھا، پاکستان کے پہلے وزیر اعظم (1947ء–1951ء) اور تحریک پاکستان میں محمد علی جناح کے دستِ راست۔ علی گڑھ اور آکسفورڈ سے تعلیم پائی اور مسلم لیگ کے اعزازی جنرل سیکریٹری رہے؛ 16 اکتوبر 1951ء کو راولپنڈی میں ایک جلسے سے خطاب کے دوران شہید کر دیے گئے اور کراچی میں مزارِ قائد میں دفن ہوئے۔"
