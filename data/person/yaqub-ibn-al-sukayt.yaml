id: person/yaqub-ibn-al-sukayt
class: person
label: { ar: "يعقوب بن السكيت" }
summary:
  ar: "إمام العربية، ندبه المتوكل إلى تعليم أولاده فسأله سنة أربع وأربعين من أحب إليك المعتز والمؤيد أم الحسن والحسين فقال قنبر مولى علي خير منهما فأمر الأتراك فداسوا بطنه حتى مات، وقيل أمر بسل لسانه فمات وأرسل إلى ابنه بديته {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  en: "The imam of Arabic, tutor to al-Mutawakkil's sons; asked in 244 'who is dearer — al-Mu'tazz and al-Mu'ayyad or al-Hasan and al-Husayn?' he answered 'Qanbar, Ali's mawla, is better than both' — the Turks trampled his belly till he died; or his tongue was torn out and the blood-money sent to his son {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  es: "El imán de árabe, tutor de los hijos de al-Mutawakkil, preguntó en 244: \"¿Quién es más querido: al-Mu'tazz y al-Mu'ayyad o al-Hasan y al-Husayn?\". Él respondió: \"Qanbar, el mawla de Ali, es mejor que ambos\". Los turcos pisotearon su vientre hasta que murió; o le arrancaron la lengua y enviaron el dinero de la sangre a su hijo {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  fr: "L'imam d'arabe, précepteur des fils d'al-Mutawakkil, demanda en 244: « Qui est le plus cher: al-Mu'tazz et al-Mu'ayyad ou al-Hasan et al-Husayn ? » Il répondit: « Qanbar, le mawla d'Ali, est meilleur que les deux. » — Les Turcs lui piétinèrent le ventre jusqu'à ce qu'il meure; ou bien on lui arracha la langue et on envoya le prix du sang à son fils {cite: tarikh-khulafa-minhaj-1434 p. 541}."
