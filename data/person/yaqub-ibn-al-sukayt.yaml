summary:
  ar: "إمام العربية، ندبه المتوكل إلى تعليم أولاده فسأله سنة أربع وأربعين من أحب إليك المعتز والمؤيد أم الحسن والحسين فقال قنبر مولى علي خير منهما فأمر الأتراك فداسوا بطنه حتى مات، وقيل أمر بسل لسانه فمات وأرسل إلى ابنه بديته {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  en: "The imam of Arabic, tutor to al-Mutawakkil's sons; asked in 244 'who is dearer — al-Mu'tazz and al-Mu'ayyad or al-Hasan and al-Husayn?' he answered 'Qanbar, Ali's mawla, is better than both' — the Turks trampled his belly till he died; or his tongue was torn out and the blood-money sent to his son {cite:tarikh-khulafa-minhaj-1434 p. 541}."
