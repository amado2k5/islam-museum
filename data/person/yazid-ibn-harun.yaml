summary:
  ar: "أبو خالد يزيد بن هارون بن زاذي السلمي مولاهم، واسطي وقيل بخاري الأصل؛ سمع يحيى بن سعيد الأنصاري وسليمان التيمي وعاصم الأحول وحميداً الطويل وداود بن أبي هند وعبد الله بن عون والحسين المعلم وحجاج بن أبي زينب وعوام بن حوشب وحجاج بن أرطاة وأبا غسان محمد بن مطرف وشعبة ومحمد بن عمرو الليثي والحمادين وخلقاً سواهم، وروى عنه أحمد بن حنبل وعلي بن المديني وأبو خيثمة وأبو بكر بن أبي شيبة وخلف بن سالم وأحمد بن منيع ومحمد بن عبد الرحيم صاعقة ويعقوب الدورقي والحسن بن الصباح البزار والحسن بن عرفة والحارث بن أبي أسامة وآخرون؛ قدم بغداد فحدث بها ثم عاد إلى واسط فمات بها، وولد سنة ثمان عشرة ومائة {cite:tarikh-baghdad-khatib j.11 p.338}."
  en: "Abu Khalid al-Sulami of Wasit, b. 118, a pillar of the Wasiti hadith school; he taught at Baghdad then returned home — his students include Ahmad ibn Hanbal, Ibn al-Madini and Abu Khaythama {cite:tarikh-baghdad-khatib j.11 p.338}."
  es: "Abu Khalid al-Sulami de Wasit, n. 118, un pilar de la escuela de hadices Wasiti; enseñó en Bagdad y luego regresó a casa; entre sus alumnos se encuentran Ahmad ibn Hanbal, Ibn al-Madini y Abu Khaythama {cita:tarikh-baghdad-khatib j.11 p.338}."
  fr: "Abu Khalid al-Sulami de Wasit, b. 118, un pilier de l'école des hadiths Wasiti; il a enseigné à Bagdad puis est rentré chez lui – parmi ses étudiants figurent Ahmad ibn Hanbal, Ibn al-Madini et Abu Khaythama {cite:tarikh-baghdad-khatib j.11 p.338}."
  ur: "واسط کے ابو خالد السلمی، بی۔ 118، وسطی حدیث مکتب کا ایک ستون؛ اس نے بغداد میں پڑھایا پھر گھر واپس آئے - ان کے شاگردوں میں احمد بن حنبل، ابن المدینی اور ابو خیثمہ شامل ہیں۔"
  tr: "Ebu Halid Yezid ibn Harun bin Zadhi el-Sulami onların özgür bırakılmışıydı ve Wasti de Buhari kökenli olduğu söylenir; Yahya ibn Sa'id al-Ansari, Sulayman al-Taymi, Asim al-Ahwal, Humayda al-Tawil, Dawud ibn Ebi Hind, Abdullah ibn 'Awn, al-Husayn al-Mu'allim, Hecac ibn Ebi Zeyneb, Awwam ibn Hawshab, Hajjaj ibn Artah, Ebu Ghassan Muhammed ibn Mutarrif, Shu'be, Muhammad ibn Amr al-Laythi, al-Hammedin ve diğerlerini dinledi. Ahmed ibn Hanbal, Ali ibn al-Madini, Ebu Kheyhamah, Ebu Bekir bin Ebi Şeybah ve Halef bin Salim ondan rivayet etti. Ahmed ibn Mani', Muhammed ibn Abd al-Rahim Sa'iqah, Yaqub al-Dawraqi, al-Hasan ibn al-Sabbah al-Bazzar, al-Hasan ibn 'Arafa, al-Harith ibn Abi Usama ve diğerleri; Bağdat'a geldi ve orada konuştu, sonra Wasit'e döndü ve orada öldü. Yüz on sekiz yılında doğdu {cite:Tarikh-baghdad-khatib J.11 s.338}."
  id: "Abu Khalid Yazid ibn Harun ibn Zadhi al-Sulami adalah mantan mereka, dan Wasti, dan dikatakan berasal dari Bukhari; ia mendengar Yahya ibn Sa'id al-Ansari, Sulayman al-Taymi, Asim al-Ahwal, Humayda al-Tawil, Dawud ibn Abi Hind, Abdullah ibn 'Awn, al-Husayn al-Mu'allim, Hajjaj ibn Abi Zaynab, Awwam ibn Hawshab, Hajjaj ibn Artah, Abu Ghassan Muhammad ibn Mutarrif, Shu'bah, Muhammad ibn Amr al-Laythi, al-Hammadin, dan lainnya. Ahmad ibn Hanbal, Ali ibn al-Madini, Abu Khaythamah, Abu Bakr ibn Abi Shaybah, dan Khalaf ibn Salim menceritakan darinya. Ahmad ibn Mani', Muhammad ibn Abd al-Rahim Sa'iqah, Yaqub al-Dawraqi, al-Hasan ibn al-Sabbah al-Bazzar, al-Hasan ibn 'Arafa, al-Harith ibn Abi Usama, dan lainnya; ia datang ke Baghdad dan berbicara di sana, lalu kembali ke Wasit dan meninggal di sana. Ia lahir pada tahun seratus delapan belas {cite:Tarikh-baghdad-khatib J.11 hlm.338}."
