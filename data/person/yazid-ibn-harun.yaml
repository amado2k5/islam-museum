summary:
  ar: "أبو خالد يزيد بن هارون بن زاذي السلمي مولاهم، واسطي وقيل بخاري الأصل؛ سمع يحيى بن سعيد الأنصاري وسليمان التيمي وعاصم الأحول وحميداً الطويل وداود بن أبي هند وعبد الله بن عون والحسين المعلم وحجاج بن أبي زينب وعوام بن حوشب وحجاج بن أرطاة وأبا غسان محمد بن مطرف وشعبة ومحمد بن عمرو الليثي والحمادين وخلقاً سواهم، وروى عنه أحمد بن حنبل وعلي بن المديني وأبو خيثمة وأبو بكر بن أبي شيبة وخلف بن سالم وأحمد بن منيع ومحمد بن عبد الرحيم صاعقة ويعقوب الدورقي والحسن بن الصباح البزار والحسن بن عرفة والحارث بن أبي أسامة وآخرون؛ قدم بغداد فحدث بها ثم عاد إلى واسط فمات بها، وولد سنة ثمان عشرة ومائة {cite:tarikh-baghdad-khatib j.11 p.338}."
  en: "Abu Khalid al-Sulami of Wasit, b. 118, a pillar of the Wasiti hadith school; he taught at Baghdad then returned home — his students include Ahmad ibn Hanbal, Ibn al-Madini and Abu Khaythama {cite:tarikh-baghdad-khatib j.11 p.338}."
