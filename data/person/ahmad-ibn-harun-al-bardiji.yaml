roles: [scholar]
gender: male
summary:
  ar: "أحمد بن هارون بن روح، أبو بكر البرديجي، من ثقات رجال الحديث، أصله من برديج بأقصى أذربيجان، سكن بغداد وتوفي بها، له الأسماء المفردة. يذكر الزركلي وفاته سنة 301 هـ."
  en: "Ahmad ibn Harun ibn Ruh, Abu Bakr al-Bardiji, counted among the trustworthy hadith men, from Bardij in far Azerbaijan, who settled and died in Baghdad; author of al-Asma' al-Mufrada. Al-Zirikli prints his death as 301 AH (914)."
  fr: "Ahmad ibn Harun ibn Ruh, Abu Bakr al-Bardiji, compté parmi les hommes dignes de confiance du hadith, originaire de Bardij aux confins de l'Azerbaïdjan, installé et mort à Bagdad ; auteur d'al-Asma' al-Mufrada. Al-Zirikli situe sa mort en 301 H (914 ap. J.-C.)."
  es: "Ahmad ibn Harun ibn Ruh, Abu Bakr al-Bardiji, considerado uno de los narradores de hadices más fiables, era originario de Bardij, en el lejano Azerbaiyán, y se estableció y falleció en Bagdad; fue autor de al-Asma' al-Mufrada. Al-Zirikli registra su muerte en el año 301 de la Hégira (914 d. C.)."
  ur: "احمد بن ہارون بن روح، ابوبکر البردیجی، ثقہ احادیث میں شمار ہوتے ہیں، جو دور آذربائیجان کے علاقے بردیج سے ہیں، جو بغداد میں آباد ہوئے اور فوت ہوئے؛ اسماء المفردہ کے مصنف۔ الزرکلی نے ان کی وفات کو 301ھ (914) لکھا ہے۔"
  tr: "Ahmed ibn Harun ibn Ruh, diğer adıyla Ebu Bekr el-Bardici, güvenilir bir hadis âlimiydi. Aslen Azerbaycan'ın uzak bir bölgesindeki Bardij'den olup, Bağdat'ta yaşamış ve vefat etmiştir. El-Esma' el-Mufrade adıyla bilinir. El-Zarkali, onun 301 Hicri yılında vefat ettiğini belirtir."
  id: "Ahmad ibn Harun ibn Ruh, Abu Bakr al-Bardiji, adalah seorang ulama hadits terpercaya. Berasal dari Bardij di pelosok Azerbaijan, beliau hidup dan meninggal di Baghdad. Beliau dikenal dengan nama al-Asma' al-Mufradah. Al-Zarkali menyebutkan kematiannya pada tahun 301 Hijriah."
