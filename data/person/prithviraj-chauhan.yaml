id: person/prithviraj-chauhan
class: person
label: { ar: "ملك الهند صاحب أجمير ⁦(برتفي راج)⁩", en: "Prithviraj, king of Hind", es: "Prithviraj, king of Hind", fr: "Prithviraj, king of Hind", ur: "پرتھوی راج، ہند کا بادشاہ" }
summary:
  ar: "ملك الهند صاحب أجمير — المُعرَّف في المصادر الحديثة ببرتفي راج التشوهاني — الذي هزم شهاب الدين الغوري سنة ثلاث وثمانين وخمسمائة؛ فلما عاد شهاب الدين سنة ثمان وثمانين سار في أثره أربع منازل حتى أحاط به المسلمون ليلاً وهو لا يعلم، فلما طلع الفجر حملوا عليه من كل جانب فوقف على فيله حتى أُسر، فسأله شهاب الدين: لو استأسرتني ماذا كنت تفعل بي؟ فقال: قد استعملت لك قيداً من ذهب أقيدك به، فقال شهاب الدين: بل نحن لا نجعل لك من القدر ما نقيدك؛ فأُخذت أجمير وأقطعت لقطب الدين أيبك وقُتل ملك الهند {cite:kamil-ibn-al-athir p. 221-222}."
  en: "The king of Hind at Ajmer — identified in modern histories as Prithviraj Chauhan — who had routed Shihab al-Din in 583 and fell into his trap in 588: taken standing on his elephant at dawn, he answered the famous question ('had you taken me?') with 'I had a golden fetter for you', heard 'we give you no rank worth a fetter', and was killed as Ajmer passed to Aybak {cite:kamil-ibn-al-athir p. 221-222}."
  es: "El rey de Hind en Ajmer —identificado en las historias modernas como Prithviraj Chauhan— que había derrotado a Shihab al-Din en 583 y cayó en su trampa en 588: capturado de pie sobre su elefante al amanecer, respondió a la famosa pregunta ('¿me habéis capturado?') con 'Tenía un grillete de oro para vosotros', escuchó 'no os damos ningún rango que valga un grillete', y fue asesinado cuando Ajmer pasó a manos de Aybak {cite:kamil-ibn-al-athir p. 221-222}."
  fr: "Le roi de Hind à Ajmer — identifié dans les histoires modernes comme Prithviraj Chauhan — qui avait mis en déroute Shihab al-Din en 583 et était tombé dans son piège en 588: pris debout sur son éléphant à l'aube, il répondit à la fameuse question (« m'avez-vous pris ? ») par « J'avais une chaîne d'or pour vous », entendit « nous ne vous donnons aucun rang qui vaille une chaîne », et fut tué alors qu'Ajmer passait à Aybak {cite: kamil-ibn-al-athir p. 221-222}."
  ur: "اجمیر میں ہند کے بادشاہ کی شناخت جدید تاریخوں میں پرتھوی راج چوہان کے نام سے کی گئی ہے - جس نے 583 میں شہاب الدین کو شکست دی تھی اور 588 میں اس کے جال میں پھنس گیا تھا: صبح کے وقت اپنے ہاتھی پر کھڑے ہو کر اس نے مشہور سوال ⁦('کیا تم مجھے لے گئے تھے؟')⁩ کے ساتھ 'میرے پاس تمہارے لیے سونے کی بیڑی تھی' کے ساتھ جواب دیا، 'تمہارے لیے موت کی کوئی قیمت نہیں ہے'، سنا ہے کہ 'مرنے کے قابل نہیں'۔ ایبک کی طرف {حوالہ: کامل ابن الاثیر ص۔ 221-222}۔"
  tr: "Hindistan kralı, Ajmer'in sahibi—modern kaynaklarda Parvati Raj al-Tahwani olarak bilinir—583 Hicri yılında Şihabeddin el-Ghuri'yi yendi. Şihabeddin 1588'de döndüğünde, dört aşama boyunca onu takip etti, ta ki Müslümanlar gece haberi olmadan onu kuşatana kadar. Şafakta her yönden saldırdılar ve filinin üzerinde durdu, ta ki yakalanana kadar. Şihabeddin ona sordu: Beni yakalasaydın, benimle ne yapardın? Dedi ki: Seni bağlamak için altın bir zincir kullandım. Şihabeddin dedi ki: Aksine, seni kaderden ben bağladığım kadar bağlamayacağız. Böylece Ajmer'i aldım ve Kutbeddin Aybak'ı kestim, Hindistan kralı öldürüldü. {cite:Kamil-ibn-al-Athir s. 221-222}."
  id: "Raja India, pemilik Ajmer—yang dikenal dalam sumber modern sebagai Parvati Raj al-Tahwani—mengalahkan Shihab al-Din al-Ghuri pada tahun 583 H. Ketika Shihab al-Din kembali pada tahun 1588, ia mengikutinya empat tahap hingga Muslim mengepungnya pada malam hari tanpa sepengetahuannya. Ketika fajar menyingsing, mereka menyerangnya dari segala arah, dan ia berdiri di atas gajahnya sampai tertangkap. Shihab al-Din bertanya kepadanya: Jika kau menangkapku, apa yang akan kau lakukan padaku? Ia berkata: Aku telah menggunakan rantai emas untukmu untuk mengikatmu. Shihab al-Din berkata: Sebaliknya, kami tidak akan mengikatmu dari takdir sebanyak aku bisa mengikatmu. Jadi aku mengambil Ajmer dan memotong Qutb al-Din Aybak, dan raja India terbunuh. {cite:kamil-ibn-al-athir hlm. 221-222}."
