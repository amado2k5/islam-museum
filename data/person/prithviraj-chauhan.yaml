label: { ar: "ملك الهند صاحب أجمير (برتفي راج)", en: "Prithviraj, king of Hind" }
summary:
  ar: "ملك الهند صاحب أجمير — المُعرَّف في المصادر الحديثة ببرتفي راج التشوهاني — الذي هزم شهاب الدين الغوري سنة ثلاث وثمانين وخمسمائة؛ فلما عاد شهاب الدين سنة ثمان وثمانين سار في أثره أربع منازل حتى أحاط به المسلمون ليلاً وهو لا يعلم، فلما طلع الفجر حملوا عليه من كل جانب فوقف على فيله حتى أُسر، فسأله شهاب الدين: لو استأسرتني ماذا كنت تفعل بي؟ فقال: قد استعملت لك قيداً من ذهب أقيدك به، فقال شهاب الدين: بل نحن لا نجعل لك من القدر ما نقيدك؛ فأُخذت أجمير وأقطعت لقطب الدين أيبك وقُتل ملك الهند {cite:kamil-ibn-al-athir p. 221-222}."
  en: "The king of Hind at Ajmer — identified in modern histories as Prithviraj Chauhan — who had routed Shihab al-Din in 583 and fell into his trap in 588: taken standing on his elephant at dawn, he answered the famous question ('had you taken me?') with 'I had a golden fetter for you', heard 'we give you no rank worth a fetter', and was killed as Ajmer passed to Aybak {cite:kamil-ibn-al-athir p. 221-222}."
