summary:
  ar: "لاعب كرة قدم جزائري معتزل، وُلد في حسين داي بالجزائر العاصمة سنة 1958. مهاجم بلغ نجوميته مع بورتو البرتغالي في الثمانينيات، ففاز معه بتسعة ألقاب كبرى منها كأس أوروبا 1987، وخاض مع منتخب الجزائر 87 مباراة دولية وشارك في كأسي العالم 1982 و1986 وفاز بكأس الأمم الأفريقية 1990. درّب منتخب الجزائر في فترات متعددة لاحقة."
  en: "Algerian retired footballer, born in Hussein Dey, Algiers in 1958. A striker who reached stardom with Porto in the 1980s, winning nine major titles including the 1987 European Cup, he won 87 caps for Algeria, played at the 1982 and 1986 World Cups and won the 1990 Africa Cup of Nations. He later coached the Algeria national team in several spells."
  ur: "الجزائری ریٹائرڈ فٹبالر، 1958 میں حسین دای، الجزائر میں پیدا ہوئے۔ اسٹرائیکر جنہوں نے 1980 کی دہائی میں پورٹو کے ساتھ شہرت پائی اور 1987 کا یورپی کپ سمیت نو بڑے خطاب جیتے؛ الجزائر کے لیے 87 میچ کھیلے، 1982 اور 1986 کے ورلڈ کپ میں شرکت کی اور 1990 کا افریقہ کپ جیتا۔ بعد میں کئی بار الجزائر کی قومی ٹیم کے کوچ رہے۔"
