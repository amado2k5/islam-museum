summary:
  ar: "رجل من الأزد سئل أتحب علياً فقال وكيف أحب رجلاً قتل من قومي في بعض يوم ألفين وخمسمائة وقتل من الناس حتى لم يكن أحد يعزي أحداً واشتغل أهل كل بيت بمن لهم {cite:muruj-al-dhahab p. 664}."
  en: "An Azdi asked whether he loved Ali — 'how could I love a man who killed twenty-five hundred of my tribe in one day, until no one was left to console anyone' {cite:muruj-al-dhahab p. 664}."
  fr: "Un Azdite à qui l'on demanda s'il aimait Ali — « comment aimerais-je un homme qui tua deux mille cinq cents des miens en un seul jour, jusqu'à ce qu'il ne reste plus personne pour consoler qui que ce soit » {cite:muruj-al-dhahab p. 664}."
  es: "Un Azdi preguntó si amaba a Ali: «¿Cómo podría amar a un hombre que mató a dos mil quinientos de mi tribu en un solo día, hasta que no quedó nadie para consolar a nadie?» {cita:muruj-al-dhahab p. 664}."
  ur: "ایک ایزدی نے پوچھا کہ کیا وہ علی سے محبت کرتا ہے - 'میں ایک ایسے شخص سے کیسے محبت کرسکتا ہوں جس نے ایک دن میں میرے قبیلے کے پچیس سو افراد کو قتل کردیا، یہاں تک کہ کسی کو تسلی دینے کے لیے کوئی باقی نہ رہ جائے'۔ 664}۔"
