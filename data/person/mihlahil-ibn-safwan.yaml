label: { ar: "مهلهل بن صفوان", en: "Mihlahil ibn Safwan", es: "Mihlahil ibn Safwan", fr: "Mihlahil ibn Safwan", ur: "محلح بن صفوان" }
summary:
  ar: "واسمه يحيى بن صفوان مولى علي بن عبد الله؛ عند البلاذري أقطعه المنصور قطيعة بالمدينة وإليه ينسب درب مهلهل وكان اسم مهلهل يحيى فاستنشده محمد بن علي شعراً فأنشده «ليلتنا بذي حشم أنيري» وهي لمحلمل فسماه مهللاً ومحمد أعتقه."
  en: "his name Yahya ibn Safwan, mawla of Ali ibn Abdallah; in al-Baladhuri al-Mansur granted him a qati'a in the city whence Darb Mihlahil — renamed by Muhammad ibn Ali from a verse of 'Muhalmil,' and Muhammad freed him."
  es: "su nombre Yahya ibn Safwan, mawla de Ali ibn Abdallah; en al-Baladhuri, al-Mansur le concedió una qati'a en la ciudad de donde proviene Darb Mihlahil (rebautizada por Muhammad ibn Ali a partir de un verso de 'Muhalmil'), y Mahoma lo liberó."
  fr: "son nom Yahya ibn Safwan, mawla d'Ali ibn Abdallah; à al-Baladhuri, al-Mansur lui accorda une qati'a dans la ville d'où Darb Mihlahil — rebaptisée par Muhammad ibn Ali d'après un verset de « Muhalmil », et Muhammad le libéra."
  ur: "اس کا نام یحییٰ بن صفوان، علی ابن عبداللہ کا مولا؛ البلادوری میں المنصور نے اسے شہر میں ایک قتیہ عطا کیا جہاں سے درب ملحل - جس کا نام محمد ابن علی نے 'محمل' کی ایک آیت سے تبدیل کیا اور محمد نے اسے آزاد کردیا۔"
