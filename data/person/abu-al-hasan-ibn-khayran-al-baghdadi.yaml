summary:
  ar: "أبو الحسن ابن خيران البغدادي، صاحب كتاب «اللطيف»، درس عليه شيخ الشيرازي أبو أحمد ابن رامين {cite:tabaqat-fuqaha-abbas-1981 p. 61}. حاشية الكتاب تذكر أن السبكي لم يترجم له، وأن حاجي خليفة ذكر كتابه باسم «اللطيف» في مجلد كبير {cite:tabaqat-fuqaha-abbas-1981 p. 61}. هذا الشخص غير أبي علي ابن خيران ⁦(الحسين بن صالح)⁩ المذكور في الصفحة 58."
  en: "Abu al-Hasan ibn Khayran al-Baghdadi, author of the book al-Latif. Abu Ahmad ibn Ramin, a shaykh of al-Shirazi, studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}. The book's marginal note states that al-Subki did not include a biography of him, and that Haji Khalifa mentioned his book under the title al-Latif in a large volume {cite:tabaqat-fuqaha-abbas-1981 p. 61}. This person is not Abu Ali ibn Khayran (al-Husayn ibn Salih), who is mentioned on page 58."
  fr: "Abu al-Hasan ibn Khayran al-Baghdadi, auteur du livre al-Latif. Abu Ahmad ibn Ramin, un shaykh d'al-Shirazi, étudia auprès de lui {cite:tabaqat-fuqaha-abbas-1981 p. 61}. La note marginale du livre indique qu'al-Subki ne lui consacra pas de biographie, et que Haji Khalifa mentionna son livre sous le titre al-Latif en un grand volume {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Ce personnage n'est pas Abu Ali ibn Khayran (al-Husayn ibn Salih), mentionné à la page 58."
  es: "Abu al-Hasan ibn Khayran al-Baghdadi, autor del libro al-Latif. Abu Ahmad ibn Ramin, un shaykh de al-Shirazi, estudió con él {cite:tabaqat-fuqaha-abbas-1981 p. 61}. La nota marginal del libro indica que al-Subki no incluyó una biografía suya, y que Haji Khalifa mencionó su libro con el título al-Latif en un gran volumen {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Esta persona no es Abu Ali ibn Khayran (al-Husayn ibn Salih), quien se menciona en la página 58."
  ur: "ابو الحسن بن خیران البغدادی، کتاب الطیف کے مصنف۔ الشیرازی کے شیخ ابو احمد بن رامین نے ان سے تعلیم حاصل کی۔ 61}۔ کتاب کے معمولی نوٹ میں کہا گیا ہے کہ السبکی نے ان کی سوانح عمری شامل نہیں کی ہے اور حاجی خلیفہ نے اپنی کتاب کا تذکرہ الطیف کے عنوان سے ایک بڑی جلد میں کیا ہے۔ 61}۔ یہ شخص ابو علی بن خیران ⁦(الحسین ابن صالح)⁩ نہیں ہے جس کا صفحہ 58 پر ذکر ہے۔"
  tr: "\"El-Latif\" kitabının yazarı Ebu el-Hasan ibn Hayran el-Bağdadi, Şeyh el-Şirazi Ebu Ahmed ibn Ramin tarafından incelenmiştir {kaynak: tabaqat-fuqaha-abbas-1981 s. 61}. Kitaptaki bir dipnotta, el-Subki'nin onun biyografisini içermediği ve Hacı Halife'nin büyük bir ciltte \"el-Latif\" başlığı altında kitabından bahsettiği belirtilmektedir {kaynak: tabaqat-fuqaha-abbas-1981 s. 61}. Bu kişi, 58. sayfada bahsedilen Ebu Ali ibn Hayran (el-Hüseyin ibn Salih) ile aynı kişi değildir."
  id: "Abu al-Hasan ibn Khayran al-Baghdadi, penulis buku \"al-Latif,\" dipelajari oleh Syekh al-Shirazi Abu Ahmad ibn Ramin {cite:tabaqat-fuqaha-abbas-1981 hlm. 61}. Catatan kaki dalam buku tersebut menyebutkan bahwa al-Subki tidak memasukkan biografi tentang dirinya, dan bahwa Haji Khalifa menyebutkan bukunya dengan judul \"al-Latif\" dalam sebuah buku besar {cite:tabaqat-fuqaha-abbas-1981 hlm. 61}. Orang ini bukanlah orang yang sama dengan Abu Ali ibn Khayran (al-Husayn ibn Salih) yang disebutkan di halaman 58."
