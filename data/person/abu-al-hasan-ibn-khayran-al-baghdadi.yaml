summary:
  ar: "أبو الحسن ابن خيران البغدادي، صاحب كتاب «اللطيف»، درس عليه شيخ الشيرازي أبو أحمد ابن رامين {cite:tabaqat-fuqaha-abbas-1981 p. 61}. حاشية الكتاب تذكر أن السبكي لم يترجم له، وأن حاجي خليفة ذكر كتابه باسم «اللطيف» في مجلد كبير {cite:tabaqat-fuqaha-abbas-1981 p. 61}. هذا الشخص غير أبي علي ابن خيران (الحسين بن صالح) المذكور في الصفحة 58."
  en: "Abu al-Hasan ibn Khayran al-Baghdadi, author of the book al-Latif. Abu Ahmad ibn Ramin, a shaykh of al-Shirazi, studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}. The book's marginal note states that al-Subki did not include a biography of him, and that Haji Khalifa mentioned his book under the title al-Latif in a large volume {cite:tabaqat-fuqaha-abbas-1981 p. 61}. This person is not Abu Ali ibn Khayran (al-Husayn ibn Salih), who is mentioned on page 58."
