summary:
  ar: "مكرم بن الفرز أحد بني جمونة بن الحارث بن تميم؛ وجهه الحجاج إلى خرزاد بن باس حين عصى ولحق بأيذج وتحصن بقلعة فلما طال عليه الحصار نزل مستخفياً يلحق بعبد الملك فظفر به مكرم ومعه درتان في قلنسوته فبعث به إلى الحجاج فضرب عنقه وإليه في قول تنسب عسكر مكرم."
  en: "Mukram ibn al-Farz of Banu Jamwana; al-Hajjaj's man sent after the rebel Kharrzad ibn Bas at Ayadhaj — who slipped his long siege by night for Abd al-Malik, was caught with two dirhams in his cap and beheaded by al-Hajjaj. To this Mukram some trace the name Askar Mukram."
