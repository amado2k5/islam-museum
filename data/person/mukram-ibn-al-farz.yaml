summary:
  ar: "مكرم بن الفرز أحد بني جمونة بن الحارث بن تميم؛ وجهه الحجاج إلى خرزاد بن باس حين عصى ولحق بأيذج وتحصن بقلعة فلما طال عليه الحصار نزل مستخفياً يلحق بعبد الملك فظفر به مكرم ومعه درتان في قلنسوته فبعث به إلى الحجاج فضرب عنقه وإليه في قول تنسب عسكر مكرم."
  en: "Mukram ibn al-Farz of Banu Jamwana; al-Hajjaj's man sent after the rebel Kharrzad ibn Bas at Ayadhaj — who slipped his long siege by night for Abd al-Malik, was caught with two dirhams in his cap and beheaded by al-Hajjaj. To this Mukram some trace the name Askar Mukram."
  es: "Mukram ibn al-Farz de Banu Jamwana; hombre de al-Hajjaj enviado tras el rebelde Kharrzad ibn Bas en Ayadhaj, quien escapó de su largo asedio nocturno a Abd al-Malik, fue capturado con dos dirhams en su gorra y decapitado por al-Hajjaj. De este Mukram se conserva algún rastro del nombre Askar Mukram."
  fr: "Mukram ibn al-Farz, de la tribu des Banu Jamwana, était un homme d'al-Hajjaj envoyé à la poursuite du rebelle Kharrzad ibn Bas à Ayadhaj. Ce dernier, ayant réussi à s'échapper de nuit du long siège pour Abd al-Malik, fut surpris avec deux dirhams dans sa casquette et décapité par al-Hajjaj. On retrouve des traces de ce Mukram sous le nom d'Askar Mukram."
