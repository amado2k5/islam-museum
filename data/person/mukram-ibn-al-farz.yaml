label: { ar: "مكرم بن الفرز", en: "Mukram ibn al-Farz", es: "Mukram ibn al-Farz", fr: "Mukram ibn al-Farz", ur: "مکرم بن الفرز" }
summary:
  ar: "مكرم بن الفرز أحد بني جمونة بن الحارث بن تميم؛ وجهه الحجاج إلى خرزاد بن باس حين عصى ولحق بأيذج وتحصن بقلعة فلما طال عليه الحصار نزل مستخفياً يلحق بعبد الملك فظفر به مكرم ومعه درتان في قلنسوته فبعث به إلى الحجاج فضرب عنقه وإليه في قول تنسب عسكر مكرم."
  en: "Mukram ibn al-Farz of Banu Jamwana; al-Hajjaj's man sent after the rebel Kharrzad ibn Bas at Ayadhaj — who slipped his long siege by night for Abd al-Malik, was caught with two dirhams in his cap and beheaded by al-Hajjaj. To this Mukram some trace the name Askar Mukram."
  es: "Mukram ibn al-Farz de Banu Jamwana; hombre de al-Hajjaj enviado tras el rebelde Kharrzad ibn Bas en Ayadhaj, quien escapó de su largo asedio nocturno a Abd al-Malik, fue capturado con dos dirhams en su gorra y decapitado por al-Hajjaj. De este Mukram se conserva algún rastro del nombre Askar Mukram."
  fr: "Mukram ibn al-Farz, de la tribu des Banu Jamwana, était un homme d'al-Hajjaj envoyé à la poursuite du rebelle Kharrzad ibn Bas à Ayadhaj. Ce dernier, ayant réussi à s'échapper de nuit du long siège pour Abd al-Malik, fut surpris avec deux dirhams dans sa casquette et décapité par al-Hajjaj. On retrouve des traces de ce Mukram sous le nom d'Askar Mukram."
  ur: "مکرم بن الفرز بنو جموانہ؛ عیاض میں باغی خرزاد بن باس کے بعد الحجاج کا ایک آدمی بھیجا گیا تھا - جس نے رات کو عبد الملک کے لیے اپنا طویل محاصرہ ختم کیا تھا، اس کی ٹوپی میں دو درہم کے ساتھ پکڑا گیا اور الحجاج نے اس کا سر قلم کر دیا۔ اس مکرم کو بعض لوگ عسکر مکرم کا نام دیتے ہیں۔"
  tr: "Banu Cumuna ibn el-Harit ibn Tamim'den Makram ibn el-Faraz; Eydin'in itaatsizliğinde onu Harzzad bin Bas'a yönlendirdi, Aydhaj'ı takip etti ve kendini bir kalede tahkim etti. Kuşatma uzadığında, Abd al-Malik'e katılmak için gizlice kamp kurdu. Makram onu şapkasında iki inciyle yakaladı, el-Hacac'a gönderdi; Hacac'ın boynunu vurdu ve Makram'ın ordusuna atfedildiği söylenir."
  id: "Makram ibn al-Faraz, salah satu dari Banu Jumuna ibn al-Harith ibn Tamim; al-Hajjaj mengarahkannya ke Kharzad ibn Bas ketika ia membangkang, mengikuti Aydhaj, dan memperkuat diri di sebuah benteng. Ketika pengepungan berlanjut, ia berkemah diam-diam untuk bergabung dengan Abd al-Malik. Makram menangkapnya dengan dua mutiara di topinya, mengirimnya ke al-Hajjaj, yang memukul lehernya dan dikatakan sebagai bagian dari pasukan Makram."
