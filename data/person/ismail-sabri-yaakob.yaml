summary:
  ar: "سياسي ومحام ماليزي، وُلد في تيميرلوه ببهانغ سنة 1960. عضو البرلمان عن بيرا منذ 2004، وتولى حقائب وزارية متتابعة في حكومتين، وزعامة المعارضة (2019–2020)، وبرز في استجابة ماليزيا لجائحة كوفيد-19 وزيرا أول للأمن ثم نائبا لرئيس الوزراء، قبل أن يتولى رئاسة الوزراء تاسعا من أغسطس 2021 إلى نوفمبر 2022 تحت مفهومه «أسرة ماليزيا»."
  en: "Malaysian politician and lawyer, born at Temerloh, Pahang, in 1960. MP for Bera from 2004, he held a series of cabinet posts under two prime ministers, served as Leader of the Opposition (2019–2020), and was prominent in Malaysia's COVID-19 response as senior minister for security and then deputy prime minister, before serving as ninth prime minister from August 2021 to November 2022 under his 'Keluarga Malaysia' concept."
  ur: "ملائیشیائی سیاست دان اور وکیل، جو 1960ء میں تیمرلوہ، پہانگ میں پیدا ہوئے۔ 2004ء سے بیرا کے رکنِ پارلیمنٹ، دو وزرائے اعظم کے دور میں کئی وزارتیں سنبھالیں، حزبِ اختلاف کے رہنما رہے (2019ء–2020ء)، اور کووڈ-19 کے خلاف ملائیشیا کے ردِ عمل میں سینئر وزیر برائے سلامتی اور پھر نائب وزیرِ اعظم کے طور پر نمایاں رہے، جس کے بعد اگست 2021ء سے نومبر 2022ء تک اپنے تصور «خاندانِ ملائیشیا» کے تحت نویں وزیرِ اعظم رہے۔"
