summary:
  en: "A leading Companion of the Prophet from the Banu Zuhra of Quraysh, counted among the ten promised paradise, who commanded the Arab army that defeated the Sasanians at al-Qadisiyya and then occupied al-Mada'in. He is credited with organising the garrison town of Kufa and was its first governor, until Umar removed him after complaints. The Encyclopaedia of Islam reports that he stayed neutral in the strife between Ali and Mu'awiya, and judges that later traditions have much elaborated what is remembered of him."
  ar: "من كبار صحابة النبي من بني زهرة من قريش، ويُعدّ من العشرة الموعودين بالجنة، وقاد الجيش العربي الذي هزم الساسانيين في القادسية ثم احتل المدائن. ويُنسب إليه تنظيم مدينة الكوفة وكان أول واليها حتى عزله عمر بعد شكاوى. وتذكر دائرة المعارف الإسلامية أنه التزم الحياد في الفتنة بين علي ومعاوية، وترى أن الروايات اللاحقة وسّعت كثيراً ما يُذكر عنه. وشهد له أبو عثمان النهدي أنه «أول من رمى بسهم في سبيل الله» {cite:sahih-al-bukhari 4326}. وقال في الصحيح «ما أسلم أحد إلا في اليوم الذي أسلمت فيه، ولقد مكثت سبعة أيام وإني لثلث الإسلام» {cite:sahih-al-bukhari 3858}. وعند مسلم عن علي «ما جمع رسول الله أبويه لأحد غير سعد بن مالك، إنه جعل يقول له يوم أحد ارمِ فداك أبي وأمي» {cite:sahih-muslim 2411}، وروى هو عن النبي في عمر «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim 2396}."
  ur: "نبی کے ممتاز صحابی، قریش کی شاخ بنو زہرہ سے، جنت کی بشارت پانے والے دس صحابہ میں شمار، جنھوں نے اس عرب لشکر کی قیادت کی جس نے قادسیہ میں ساسانیوں کو شکست دی اور پھر مدائن پر قبضہ کیا۔ کوفہ کی چھاؤنی کو منظم کرنے کا کام ان سے منسوب ہے اور وہ اس کے پہلے والی تھے، یہاں تک کہ شکایات کے بعد عمر نے انھیں معزول کیا۔ دائرۃ المعارف اسلامیہ کے مطابق وہ علی اور معاویہ کی کشمکش میں غیر جانبدار رہے، اور مضمون کی رائے ہے کہ بعد کی روایات نے ان کی یادوں کو بہت بڑھایا ہے۔"
