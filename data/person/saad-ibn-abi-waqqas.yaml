summary:
  en: "A leading Companion of the Prophet from the Banu Zuhra of Quraysh, counted among the ten promised paradise, who commanded the Arab army that defeated the Sasanians at al-Qadisiyya and then occupied al-Mada'in. He is credited with organising the garrison town of Kufa and was its first governor, until Umar removed him after complaints. The Encyclopaedia of Islam reports that he stayed neutral in the strife between Ali and Mu'awiya, and judges that later traditions have much elaborated what is remembered of him."
  ar: "من كبار صحابة النبي من بني زهرة من قريش، ويُعدّ من العشرة الموعودين بالجنة، وقاد الجيش العربي الذي هزم الساسانيين في القادسية ثم احتل المدائن. ويُنسب إليه تنظيم مدينة الكوفة وكان أول واليها حتى عزله عمر بعد شكاوى. وتذكر دائرة المعارف الإسلامية أنه التزم الحياد في الفتنة بين علي ومعاوية، وترى أن الروايات اللاحقة وسّعت كثيراً ما يُذكر عنه. وشهد له أبو عثمان النهدي أنه «أول من رمى بسهم في سبيل الله» {cite:sahih-al-bukhari 4326}. وقال في الصحيح «ما أسلم أحد إلا في اليوم الذي أسلمت فيه، ولقد مكثت سبعة أيام وإني لثلث الإسلام» {cite:sahih-al-bukhari 3858}. وعند مسلم عن علي «ما جمع رسول الله أبويه لأحد غير سعد بن مالك، إنه جعل يقول له يوم أحد ارمِ فداك أبي وأمي» {cite:sahih-muslim 2411}، وروى هو عن النبي في عمر «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim 2396}."
  ur: "نبی کے ممتاز صحابی، قریش کی شاخ بنو زہرہ سے، جنت کی بشارت پانے والے دس صحابہ میں شمار، جنھوں نے اس عرب لشکر کی قیادت کی جس نے قادسیہ میں ساسانیوں کو شکست دی اور پھر مدائن پر قبضہ کیا۔ کوفہ کی چھاؤنی کو منظم کرنے کا کام ان سے منسوب ہے اور وہ اس کے پہلے والی تھے، یہاں تک کہ شکایات کے بعد عمر نے انھیں معزول کیا۔ دائرۃ المعارف اسلامیہ کے مطابق وہ علی اور معاویہ کی کشمکش میں غیر جانبدار رہے، اور مضمون کی رائے ہے کہ بعد کی روایات نے ان کی یادوں کو بہت بڑھایا ہے۔"
  es: "Un destacado compañero del Profeta, perteneciente a la tribu Banu Zuhra de Quraysh, considerado uno de los diez a quienes se les prometió el paraíso, comandó el ejército árabe que derrotó a los sasánidas en al-Qadisiyya y posteriormente ocupó al-Mada'in. Se le atribuye la organización de la ciudad guarnición de Kufa y fue su primer gobernador, hasta que Umar lo destituyó tras las quejas recibidas. La Enciclopedia del Islam relata que se mantuvo neutral en la contienda entre Ali y Mu'awiya, y considera que las tradiciones posteriores han ampliado considerablemente la información que se conserva sobre él."
  fr: "Compagnon éminent du Prophète, issu de la tribu des Banu Zuhra de Quraysh, il comptait parmi les dix élus promis au paradis. Il commanda l'armée arabe qui vainquit les Sassanides à al-Qadisiyya et occupa ensuite al-Mada'in. On lui attribue l'organisation de la ville de garnison de Kufa, dont il fut le premier gouverneur jusqu'à sa destitution par Umar suite à des plaintes. L'Encyclopédie de l'Islam rapporte qu'il resta neutre dans le conflit entre Ali et Mu'awiya, et estime que les traditions postérieures ont largement enrichi le récit qui lui est parvenu."
  tr: "Peygamber'in Kurayşlı Banu Zuhrah'tan gelen en büyük sahabelerinden biriydi ve vaat edilen on cennetten biri olarak kabul edilir. Kadisiye'de Sasanileri yenen Arap ordusuna liderlik etti ve ardından şehirleri işgal etti. Kufa şehrini organize etmekle anılır ve Ömer şikayetler üzerine onu görevden alana kadar ilk valisi oldu. İslami Ansiklopedi, Ali ile Muaviye arasındaki çekişmede tarafsız kaldığını ve sonrasında onun hakkında sıkça anlatılanların yayıldığını kaydeder. Ebu Osman el-Nahdi, \"Allah yoluna ilk ok atan kişi\" olduğunu ifade etti {alıntı:sahih-al-bukhari 4326}. Sahih'te şöyle dedi: \"İslam'ı kabul ettiğim gün dışında kimse İslam'ı benimsemedi, yedi gün kaldım ve İslam'ın üçte biri içinim\" {cite:sahih-al-bukhari 3858}. Müslüman Ali'den rivayet etti: \"Allah'ın Resulü, anne babasını Sa'd ibn Malik'ten başka kimse için toplamadı. Uhud gününde ona şöyle derdi: 'Atın, babam ve annem sizin fidyenindir.' {cite:sahih-muslim 2411} ve Peygamber'in Ömer'den rivayet etti: \"Canım elinde olan Allah'la Şeytan seni yolcu olarak değil, sana gitmemiş bir yolcu olarak gördü\" {cite:sahih-Muslim 2396}."
  id: "Ia adalah salah satu sahabat senior Nabi dari Banu Zuhrah Quraisy, dan dianggap sebagai salah satu dari sepuluh surga yang dijanjikan. Ia memimpin tentara Arab yang mengalahkan Sassanid di Qadisiyyah dan kemudian menduduki kota-kota tersebut. Ia dianggap sebagai pengorganisir kota Kufa dan menjadi gubernur pertamanya hingga Umar memecatnya setelah keluhan. Ensiklopedia Islam mencatat bahwa ia tetap netral dalam perselisihan antara Ali dan Muawiya, dan riwayat-cerita selanjutnya sering menyebar tentangnya. Abu Uthman al-Nahdi bersaksi bahwa ia adalah \"yang pertama menembakkan panah di jalan Allah\" {cite:sahih-al-bukhari 4326}. Ia berkata dalam Sahih: \"Tidak ada yang memeluk Islam kecuali pada hari aku memeluk Islam, dan aku tinggal selama tujuh hari, dan aku memeluk sepertiga Islam\" {cite:sahih-al-bukhari 3858}. Dan Muslim bercerita dari Ali: \"Rasulullah tidak mengumpulkan orang tuanya untuk siapa pun kecuali Sa'd ibn Malik. Dia biasa berkata kepadanya pada hari Uhud, 'Buanglah, ayah dan ibuku adalah tebusanmu.'\" {cite:sahih-muslim 2411}, dan dia menceritakan dari Nabi dalam Umar: \"Demi Dia di tangan-Nya jiwaku, Setan tidak pernah bertemu denganmu sebagai pengembara melainkan pengembara yang tidak pergi kepadamu\" {cite:sahih-muslim 2396}."
