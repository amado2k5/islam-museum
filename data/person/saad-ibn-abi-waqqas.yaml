summary:
  en: "One of the earliest converts, an archer at Badr, and the commander who broke the Sasanian army at al-Qadisiyya about 636; founder of the garrison city of Kufa."
  ar: "من السابقين إلى الإسلام، رامي يوم بدر، والقائد الذي كسر الجيش الساساني في القادسية نحو سنة 636م؛ مؤسس مدينة الكوفة. وشهد له أبو عثمان النهدي أنه «أول من رمى بسهم في سبيل الله» {cite:sahih-al-bukhari 4326}. وقال في الصحيح «ما أسلم أحد إلا في اليوم الذي أسلمت فيه، ولقد مكثت سبعة أيام وإني لثلث الإسلام» {cite:sahih-al-bukhari 3858}. وعند مسلم عن علي «ما جمع رسول الله أبويه لأحد غير سعد بن مالك، إنه جعل يقول له يوم أحد ارمِ فداك أبي وأمي» {cite:sahih-muslim 2411}، وروى هو عن النبي في عمر «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim 2396}."
