summary:
  ar: "فقيه أخذ عن وهب بن عيسى وابن أبي تمام وابن لبابة، وحدّث وسمع منه جماعة، وكان حافظا للفقه على مذهب مالك وأصحابه، وله كتاب «النصائح» وكتاب «معالم الطهارة والصلاة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  en: "A jurist who studied with Wahb ibn Isa, Ibn Abi Tamam and Ibn Lubaba, and who narrated and was heard by several people. He knew the law of the Maliki school and its masters by heart, and wrote the Book of Counsels and a work on the rules of purity and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  es: "Un jurista que estudió con Wahb ibn Isa, Ibn Abi Tamam e Ibn Lubaba, y cuyas enseñanzas fueron transmitidas a numerosas personas. Conocía de memoria la ley de la escuela Maliki y a sus maestros, y escribió el Libro de los Consejos y una obra sobre las normas de pureza y oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  fr: "Juriste ayant étudié auprès de Wahb ibn Isa, Ibn Abi Tamam et Ibn Lubaba, il transmit son savoir à de nombreuses personnes. Il connaissait par cœur la loi de l'école malikite et de ses maîtres, et écrivit le Livre des conseils ainsi qu'un ouvrage sur les règles de pureté et de prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  ur: "ایک فقیہ جس نے وہب بن عیسیٰ، ابن ابی تمام اور ابن لبابہ سے تعلیم حاصل کی، اور جسے کئی لوگوں نے روایت کیا اور سنا۔ وہ مالکی مکتب اور اس کے آقاؤں کے قانون کو دل سے جانتے تھے، اور انہوں نے مشورے کی کتاب اور طہارت اور نماز کے قواعد پر ایک کام لکھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 5141}"
  tr: "Vahb bin İsa, İbn Ebi Tammam ve İbn Lubaba'nın yanında eğitim görmüş, ondan birçok kişiyi rivayet etmiş ve onlardan dinlemiş bir hukukçudur. Malik ve sahabelerinin okuluna göre fıkıh ezbercisiydi. \"El-Nasaih\" ve \"Ma'alim al-Taharah wa al-Salat\" kitaplarının yazarıdır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.5141}"
  id: "Seorang ahli hukum yang belajar di bawah bimbingan Wahb ibn Isa, Ibn Abi Tammam, dan Ibn Lubaba, serta menceritakan dan mendengar banyak orang lainnya. Ia adalah seorang penghafal hukum menurut mazhab Malik dan para sahabatnya. Ia menulis buku \"Al-Nasa'ih\" dan \"Ma'alim al-Taharah wa al-Salat.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5141}"
