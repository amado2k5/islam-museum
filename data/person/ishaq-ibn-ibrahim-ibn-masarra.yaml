summary:
  ar: "فقيه أخذ عن وهب بن عيسى وابن أبي تمام وابن لبابة، وحدّث وسمع منه جماعة، وكان حافظا للفقه على مذهب مالك وأصحابه، وله كتاب «النصائح» وكتاب «معالم الطهارة والصلاة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  en: "A jurist who studied with Wahb ibn Isa, Ibn Abi Tamam and Ibn Lubaba, and who narrated and was heard by several people. He knew the law of the Maliki school and its masters by heart, and wrote the Book of Counsels and a work on the rules of purity and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
