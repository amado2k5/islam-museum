summary:
  ar: "محدث قزوين صاحب «السنن» الذي صار عند جمهور المتأخرين سادس الكتب الستة؛ رحل في طلب الحديث إلى العراق والحجاز والشام ومصر، وتميز كتابه بأحاديث الزهد والفتن وما تفرد به عن الصحيحين."
  en: "The muhaddith of Qazvin, author of the Sunan counted by later scholars as the sixth of the six books; he travelled for hadith to Iraq, the Hijaz, al-Sham and Egypt, and his collection is noted for renunciation and tribulation reports not found in the two Sahihs."
  es: "El muhaddith de Qazvin, autor del Sunan considerado por estudiosos posteriores como el sexto de los seis libros; viajó en busca de hadices a Irak, el Hiyaz, al-Sham y Egipto, y su colección es conocida por los relatos de renuncia y tribulación que no se encuentran en los dos Sahihs."
  fr: "Le muhaddith de Qazvin, auteur du Sunan considéré par les érudits ultérieurs comme le sixième des six livres; il a voyagé pour recueillir des hadiths en Irak, au Hedjaz, au Levant et en Égypte, et sa collection est réputée pour ses récits de renoncement et d'épreuves qui ne se trouvent pas dans les deux Sahihs."
  ur: "قزوین کے محدث، سنن کے مصنف جنہیں بعد کے علماء نے چھ کتابوں میں سے چھٹا شمار کیا ہے۔ اس نے حدیث کے لیے عراق، حجاز، الشام اور مصر کا سفر کیا، اور ان کے مجموعے کو ترک کرنے اور فتنے کی خبریں دو صحیحوں میں نہیں ملتی۔"
  tr: "Kazwin'in hadis âlimi, \"El-Sünan\"ın yazarı, sonraki alimlerin çoğuna göre altı kitabın altıncısı olmuştur; hadis peşinde Irak, Hicaz, Şam ve Mısır'a seyahat etmiştir. Kitabı, münzevim ve sıkıntılar hakkındaki hadisleri ile iki Sahih'e özgü özellikleriyle ayırt edilir."
  id: "Ulama hadis Qazwin, penulis \"Al-Sunan,\" yang menurut mayoritas ulama berikutnya menjadi buku keenam dari enam buku; ia melakukan perjalanan untuk mengejar hadis ke Irak, Hijaz, Levant, dan Mesir. Bukunya dikenal oleh hadit-hadits tentang asketisme dan kesulitan, serta atribut uniknya pada kedua Sahih."
