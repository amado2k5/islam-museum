summary:
  ar: "قاضٍ وسياسي بنغلاديشي (وُلد في 10 ديسمبر 1949)، عمل قاضي مقاطعات ومفوضًا في لجنة مكافحة الفساد من 2011 إلى 2016، ثم تولى رئاسة بنغلاديش من 24 أبريل 2023 حتى تنحّيه في 24 يوليو 2026 لأسباب صحية. وهو الرئيس الوحيد الذي أدّت في عهده ثلاث حكومات متعاقبة اليمين: حكومة شيخة حسينة، والحكومة المؤقتة برئاسة محمد يونس، وحكومة طارق رحمن."
  en: "Bangladeshi jurist and politician (born 10 December 1949) who served as a district and sessions judge and as a commissioner of the Anti-Corruption Commission from 2011 to 2016, and then as president of Bangladesh from 24 April 2023 until he stepped down on 24 July 2026 citing ill health. He is the only president to have administered the oath to three successive governments: Sheikh Hasina's, the interim administration of Muhammad Yunus, and Tarique Rahman's."
  ur: "بنگلہ دیشی منصف اور سیاست دان (پیدائش 10 دسمبر 1949ء)، ضلعی جج اور 2011ء سے 2016ء تک انسدادِ بدعنوانی کمیشن کے کمشنر رہے، پھر 24 اپریل 2023ء سے 24 جولائی 2026ء کو صحت کی وجوہات سے مستعفی ہونے تک بنگلہ دیش کے صدر رہے۔ وہ واحد صدر ہیں جن کے عہد میں تین یکے بعد دیگرے حکومتوں نے حلف اٹھایا۔"
