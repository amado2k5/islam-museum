summary:
  ar: "خالد بن معدان بن أبي كرب، أبو عبد الله الكلاعي، تابعي ثقة، أدرك نحو سبعين من أصحاب النبي، روى عن ثوبان وابن عمر ومعاوية، وذكره ابن حبان في الثقات. توفي سنة 103هـ، وقيل غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Khalid ibn Ma'dan ibn Abi Karib, Abu Abd Allah al-Kala'i, a trustworthy Successor who met about seventy of the Companions and transmitted from Thawban, Ibn Umar and Mu'awiya. Ibn Hibban listed him among the trustworthy. He died in 103 AH, or another year is given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  es: "Khalid ibn Ma'dan ibn Abi Karib, Abu Abd Allah al-Kala'i, fue un sucesor de confianza que conoció a unos setenta Compañeros y transmitió enseñanzas de Thawban, Ibn Umar y Mu'awiya. Ibn Hibban lo incluyó entre los dignos de confianza. Falleció en el año 103 de la Hégira, o en otro año según se indica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  fr: "Khalid ibn Ma'dan ibn Abi Karib, Abu Abd Allah al-Kala'i, un successeur digne de confiance qui rencontra environ soixante-dix Compagnons et reçut l'enseignement de Thawban, Ibn Umar et Mu'awiya. Ibn Hibban le mentionne parmi les personnes dignes de confiance. Il mourut en 103 AH, ou une autre année est précisée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  ur: "خالد بن معدان ابن ابی کریب، ابو عبد اللہ الکلائی، ایک ثقہ جانشین جو تقریباً ستر صحابہ سے ملے اور ثوبان، ابن عمر اور معاویہ سے نقل ہوئے۔ ابن حبان نے اسے ثقہ لوگوں میں شمار کیا۔ ان کی وفات 103 ہجری میں ہوئی یا کوئی اور سال دیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2059}"
