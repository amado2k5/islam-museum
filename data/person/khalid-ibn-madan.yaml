summary:
  ar: "خالد بن معدان بن أبي كرب، أبو عبد الله الكلاعي، تابعي ثقة، أدرك نحو سبعين من أصحاب النبي، روى عن ثوبان وابن عمر ومعاوية، وذكره ابن حبان في الثقات. توفي سنة 103هـ، وقيل غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Khalid ibn Ma'dan ibn Abi Karib, Abu Abd Allah al-Kala'i, a trustworthy Successor who met about seventy of the Companions and transmitted from Thawban, Ibn Umar and Mu'awiya. Ibn Hibban listed him among the trustworthy. He died in 103 AH, or another year is given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
