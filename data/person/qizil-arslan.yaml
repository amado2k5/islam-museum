summary:
  ar: "قزل أرسلان بن إلدكز الأتابك ملك أذربيجان وأران وهمدان وأصبهان والري بعد أخيه البهلاوان محمد؛ قام بعد أخيه شمس الدين بهلاوان صاحب أذربيجان وعراق العجم الذي توفي سنة إحدى وثمانين، وكان السلطان طغرل بك السلجوقي من تحت حكمه كما كان أبوه أرسلان شاه من تحت حكم أبيه إلدكز، وكان له خمسة آلاف مملوك؛ قُتل غيلة على فراشه في شعبان سنة سبع وثمانين وخمسمائة {cite:shadharat-dhahab p. 749, 769-770}."
  en: "Qizil Arslan b. Ildegiz the atabeg, king of Azerbaijan, Arran, Hamadan, Isfahan and Rayy after his brother Pahlawan Muhammad, whose death in 581 raised him; the Seljuk sultan Tughril Beg stood under his power as Arslan Shah had under his father Ildegiz, and he kept five thousand mamluks. He was killed treacherously upon his bed in Sha'ban 587 {cite:shadharat-dhahab p. 749, 769-770}."
  es: "Qizil Arslan b. Ildegiz, el atabeg, rey de Azerbaiyán, Arran, Hamadán, Isfahán y Rayy, sucedió a su hermano Pahlawan Muhammad, cuya muerte en 581 lo elevó al trono. El sultán selyúcida Tughril Beg se encontraba bajo su poder, al igual que Arslan Shah bajo el de su padre Ildegiz, y mantenía a cinco mil mamelucos. Fue asesinado a traición en su cama en Sha'ban 587 {cita: shadharat-dhahab págs. 749, 769-770}."
  fr: "Qizil Arslan b. Ildegiz, l'atabeg, roi d'Azerbaïdjan, d'Arran, d'Hamadan, d'Ispahan et de Rayy, succéda à son frère Pahlawan Muhammad, dont la mort en 581 l'avait élevé au rang de roi. Le sultan seldjoukide Tughril Beg était soumis à son autorité, comme Arslan Shah l'avait été à celle de son père Ildegiz. Il disposait de cinq mille mamelouks. Il fut assassiné traîtreusement dans son lit en Sha'ban 587 (voir: shadharat-dhahab, p. 749, 769-770)."
  ur: "قزل ارسلان بی۔ آذربائیجان کے بادشاہ الدیگیز، اراان، ہمدان، اصفہان اور رے اپنے بھائی پہلوان محمد کے بعد، جن کی موت 581 میں اس کی پرورش ہوئی۔ سلجوق سلطان طغرل بیگ اس کی طاقت کے تحت کھڑا تھا جیسا کہ ارسلان شاہ اپنے والد الدیگیز کے ماتحت تھا، اور اس نے پانچ ہزار مملوک رکھے۔ آپ کو شعبان 587 میں بستر پر خیانت کے ساتھ قتل کر دیا گیا۔ 749، 769-770}۔"
  tr: "Azerbaycan, Aran, Hamadan, İsfahan ve Ray kralı Kızil Arslan ibn İldakz el-Atabeg, kardeşi Behlawan Muhammed'in adından; kardeşi Şemseddin Behlawan'ın adından, Azerbaycan ve Irak hükümdarı Perslerin hükümdarı ve seksen birinci yılda ölen Şemseddin Behlawan'ın adından gelmiştir. Sultan Tughril Beg Selçuklu onun yönetimi altındaydı, babası Arslan Şah ise babası İldakz dönemindeydi. Beş bin Memlüksü vardı; 587 yılında Şa'ban'da yatağında Ghayla'da öldürüldü {atıf: Shadharat-dhahab, s. 749, 769-770}."
  id: "Qizil Arslan ibn Ildakz al-Atabeg, raja Azerbaijan, Aran, Hamadan, Isfahan, dan Ray setelah saudaranya Behlawan Muhammad; setelah saudaranya Shams al-Din Behlawan, penguasa Azerbaijan dan Irak dari Persia, yang meninggal pada tahun delapan puluh satu. Sultan Tughril Beg dari Seljuk berada di bawah pemerintahannya, begitu juga ayahnya Arslan Shah di bawah ayahnya Ildakz. Ia memiliki lima ribu Mamluk; ia dibunuh di Ghayla di tempat tidurnya di Sha'ban pada tahun 587 {cite:shadharat-dhahab, hlm. 749, 769-770}."
