summary:
  ar: "قزل أرسلان بن إلدكز الأتابك ملك أذربيجان وأران وهمدان وأصبهان والري بعد أخيه البهلاوان محمد؛ قام بعد أخيه شمس الدين بهلاوان صاحب أذربيجان وعراق العجم الذي توفي سنة إحدى وثمانين، وكان السلطان طغرل بك السلجوقي من تحت حكمه كما كان أبوه أرسلان شاه من تحت حكم أبيه إلدكز، وكان له خمسة آلاف مملوك؛ قُتل غيلة على فراشه في شعبان سنة سبع وثمانين وخمسمائة {cite:shadharat-dhahab p. 749, 769-770}."
  en: "Qizil Arslan b. Ildegiz the atabeg, king of Azerbaijan, Arran, Hamadan, Isfahan and Rayy after his brother Pahlawan Muhammad, whose death in 581 raised him; the Seljuk sultan Tughril Beg stood under his power as Arslan Shah had under his father Ildegiz, and he kept five thousand mamluks. He was killed treacherously upon his bed in Sha'ban 587 {cite:shadharat-dhahab p. 749, 769-770}."
