summary:
  ar: "مربٍّ وكاتب كازاخي (1 نوفمبر 1841 – 29 يوليو 1889)، أبرز متنوّري الكازاخ في القرن التاسع عشر؛ فتح مدارس كازاخية روسية في منطقة تورغاي، وألّف أول مختارات كازاخية (1879)، ونقل الكازاخية من الأبجدية العربية الفارسية إلى السيريلية."
  en: "Kazakh educator and writer (1 November 1841 – 29 July 1889), the foremost Kazakh enlightener of the nineteenth century; he opened Kazakh–Russian schools across the Turgay region, wrote the first Kazakh chrestomathy (1879), and carried Kazakh from the Perso-Arabic to the Cyrillic alphabet."
  ur: "قازق معلم اور مصنف (1 نومبر 1841ء – 29 جولائی 1889ء)، انیسویں صدی کے ممتاز قازق مصلح؛ انہوں نے تورغائی خطے میں قازق–روسی اسکول کھولے، پہلی قازق منتخبات (1879ء) لکھی اور قازق زبان کو فارسی–عربی رسم الخط سے سیریلک میں منتقل کیا۔"
