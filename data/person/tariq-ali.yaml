summary:
  ar: "طارق علي (وُلد 21 أكتوبر 1943) كاتب ومؤرخ وناشط سياسي باكستاني بريطاني. وُلد في لاهور في أسرة سياسية بارزة، ودرس في أكسفورد وترأس اتحاد طلابها سنة 1965، وبرز في حركة اليسار الجديد واحتجاجات حرب فيتنام، وله عشرات الكتب في التاريخ والسياسة منها «صدام الأصوليات» (2002). صرّح بنفسه في مقال باسمه في الغارديان سنة 2006 قائلًا: «أنا ملحد»."
  en: "Tariq Ali (born 21 October 1943) is a Pakistani-British writer, historian and political activist. Born in Lahore into a prominent political family, he studied at Oxford and was president of the Oxford Union in 1965, rose to prominence in the New Left and the anti-Vietnam War movement, and has written dozens of books on history and politics, including Clash of Fundamentalisms (2002). In his own bylined Guardian column of 2006 he wrote: 'I am an atheist.'"
  ur: "طارق علی (پیدائش 21 اکتوبر 1943ء) پاکستانی نژاد برطانوی مصنف، مورخ اور سیاسی کارکن ہیں۔ وہ لاہور کے ایک ممتاز سیاسی خاندان میں پیدا ہوئے، آکسفورڈ میں تعلیم پائی اور 1965ء میں آکسفورڈ یونین کے صدر رہے؛ وہ نیو لیفٹ اور ویتنام جنگ مخالف تحریک میں نمایاں ہوئے اور تاریخ و سیاست پر درجنوں کتابیں لکھیں۔ 2006ء میں گارڈین میں اپنے دستخطی کالم میں انہوں نے لکھا: «میں ملحد ہوں»۔"
