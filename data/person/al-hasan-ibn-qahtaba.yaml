id: person/al-hasan-ibn-qahtaba
class: person
label: { ar: "الحسن بن قحطبة الطائي", en: "al-Hasan ibn Qahtaba al-Ta'i" }
summary:
  ar: "الحسن بن قحطبة الطائي الكوفي، من قواد جند خراسان ودعاة الدولة العباسية؛ عند البلاذري: غزا بلاد الروم سنة 162 في أهل خراسان وأهل الموصل والشام وأمداد اليمن ومطوعة العراق والحجاز فأبلى بلاءً حسناً ودوّخ أرض الروم حتى سموه الشيطان، وكان معه مندل العنزي الحدّث الكوفي ومعتجر بن سليمان البصري؛ ولما خرج نزل مرج طرسوس فطاف بمدينتها الخراب وحزر من يسكنها فبلغ مائة ألف فوصفها للمهدي فرغبه في بنائها — وهو أصل عمارتها."
  en: "al-Hasan ibn Qahtaba al-Ta'i of Kufa, commander of the Khurasani army and da'i of the Abbasid da'wa; in al-Baladhuri: he raided Byzantine lands in year 162 with the men of Khurasan, Mosul and Syria, Yemenite reinforcements and the volunteers of Iraq and the Hijaz, fighting so well and harrying the Byzantine land until they named him the Shaytan, with him Mandal al-Anazi al-Haddathi al-Kufi and Mu'tajir ibn Sulayman al-Basri; coming out he camped at Tarsus's meadow, circled its ruined city and reckoned its capacity at a hundred thousand, describing it to al-Mahdi and so rousing him to build it — the origin of its settlement."
