summary:
  ar: "ميرجاقيب دولاتولي (1885–1935)، شاعر وكاتب كازاخي وأحد قادة حكومة ألاش أوردا، صاحب أول رواية في الأدب الكازاخي الحديث «باقيتسيز جمال» (1910) وكتاب الشعر «أويان! قازاق» (1909)، اعتُقل سنة 1928 بتهمة القومية ومات في معسكر الاعتقال سنة 1935."
  en: "Mirjaqip Dulatuli (1885–1935) was a Kazakh poet and writer and a leader of the Alash Orda government, author of the first novel in modern Kazakh literature, Baqytsyz Jamal (1910), and of the poetry book Oyan! Qazaq (1909); arrested on nationalism charges in 1928, he died in a labour camp in 1935."
  ur: "میر جاقیب دولاتولی (1885–1935) قازق شاعر اور مصنف اور علاش اوردا حکومت کے رہنماؤں میں سے تھے، جدید قازق ادب کے پہلے ناول «باقیتسز جمال» (1910) اور شعری مجموعے «اویان! قازق» (1909) کے مصنف؛ 1928 میں قوم پرستی کے الزام میں گرفتار ہوئے اور 1935 میں مزدور کیمپ میں وفات پائی۔"
