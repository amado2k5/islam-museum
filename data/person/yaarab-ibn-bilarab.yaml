gender: male
summary:
  ar: يعرب بن بلعرب بن سلطان اليعربي، سابع الأئمة اليعربيين في عمان، من الإباضية بتصنيف الزركلي؛ قتل الإمام مهنا بن سلطان سنة 1132 هـ، وبويع سنة 1134 هـ بنزوى، ثم ثارت البلاد عليه فخلع، وعاد فتحصن بنزوى حتى توفي بها سنة 1135 هـ الموافقة 1723 م.
  en: Ya'rub ibn Bil'arab ibn Sultan al-Ya'rubi, seventh of the Ya'rubi imams of Oman, an Ibadi in al-Zirikli's classification; killed the imam Muhanna ibn Sultan in 1132 AH, was acknowledged in 1134 AH at Nizwa, was deposed amid revolt, returned to fortify himself in Nizwa and died there in 1135 AH (1723 CE).
  es: "Ya'rub ibn Bil'arab ibn Sultan al-Ya'rubi, séptimo de los imanes Ya'rubi de Omán, un ibadí en la clasificación de al-Zirikli; mató al imán Muhanna ibn Sultan en 1132 AH, fue reconocido en 1134 AH en Nizwa, fue depuesto en medio de una revuelta, regresó para fortificarse en Nizwa y murió allí en 1135 AH (1723 d. C.)."
