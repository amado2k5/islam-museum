summary:
  ar: "بطاقة أولية لمهرماه سلطان، ابنة سليمان القانوني وخرم سلطان وبانية مسجديها في إسطنبول، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Mihrimah Sultan, daughter of Suleiman the Magnificent and Hurrem Sultan and patron of her two Istanbul mosque complexes, named from an open reference description (Wikidata); her entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Mihrimah Sultan, hija de Solimán el Magnífico y Hurrem Sultan y mecenas de sus dos complejos de mezquitas en Estambul, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de Mihrimah Sultan, fille de Soliman le Magnifique et de Hurrem Sultan et mécène de ses deux complexes de mosquées à Istanbul, nommée d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "مہریمہ سلطان کے لیے ڈرافٹ کارڈ، جو سلیمان دی میگنیفیشنٹ کی بیٹی اور حریم سلطان اور اس کے استنبول کے دو مسجد کمپلیکس کے سرپرست ہیں، جن کا نام کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "İstanbul'daki iki caminin inşaatçısı ve Süleyman Khurram Sultan'ın kızı Mehremah Sultan'ın ön kartı açık bir referans açıklamasında (Wikidata) yer almaktadır. Al-Sallabi'nin Osmanlı İmparatorluğu Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Mehremah Sultan, putri Suleiman yang Agung, Khurram Sultan, dan pembangun dua masjidnya di Istanbul, muncul dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Kekaisaran Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggal tidak disebutkan di sini."
