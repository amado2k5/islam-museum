summary:
  ar: أخت زينب بنت جحش، كانت زوج مصعب بن عمير فقُتل عنها يوم أحد، ثم تزوجها طلحة بن عبيد الله؛ شهدت أحداً تسقي العطشى وتداوي الجرحى، وروت حديث الاستحاضة.
  en: Sister of Zaynab bint Jahsh, wife of Mus'ab ibn Umayr, who was killed at Uhud, and then of Talha ibn Ubaydullah; she was at Uhud giving water to the thirsty and tending the wounded, and she narrated the hadith on abnormal bleeding.
