summary:
  ar: "صاحب «قصص الأنبياء» الذي حققه إسحاق كاهانا عن نسخة ليدن ⁦(مطبعة بربل 1932-1933م)⁩؛ ترجمة موسعة له لم تُثبت بعد، وهو غير علي بن حمزة الكسائي النحوي ⁦(ت 189هـ)⁩."
  en: "Author of the Qisas al-Anbiya edited by Isaac Kahana from the Leiden copy ⁦(Brill, Leiden 1932-33)⁩; his biography is not yet established, and he is distinct from Ali ibn Hamza al-Kisa'i the grammarian ⁦(d. 189 AH)⁩."
  es: "Autor del Qisas al-Anbiya editado por Isaac Kahana a partir del ejemplar de Leiden (Brill, Leiden 1932-33); su biografía aún no está establecida y es distinto de Ali ibn Hamza al-Kisa'i, el gramático (fallecido en 189 AH)."
  fr: "Auteur du Qisas al-Anbiya édité par Isaac Kahana à partir de la copie de Leiden (Brill, Leiden 1932-33); sa biographie n'est pas encore établie, et il est distinct d'Ali ibn Hamza al-Kisa'i le grammairien (mort en 189 AH)."
  ur: "قصاص الانبیاء کا مصنف جس کی تدوین اسحاق کہانہ نے لیڈن کاپی سے کی ہے ⁦(برل، لیڈن 1932-33)⁩؛ ان کی سوانح عمری ابھی تک قائم نہیں ہوئی ہے، اور وہ علی بن حمزہ کسائی گرامر ⁦(متوفی 189ھ)⁩ سے ممتاز ہیں۔"
  tr: "\"Peygamberlerin Hikayeleri\"nin yazarı, Leiden baskısından (Burbal Press 1932-1933) Ishaq Kahane tarafından düzenlenmiştir; hakkında kapsamlı bir biyografi henüz oluşturulmamıştır ve henüz tanınmamıştır, sadece dilbilgici Ali ibn Hamza al-Kisai (ö. 189 Hicri) hariç."
  id: "Penulis \"Kisah Para Nabi,\" yang disunting oleh Ishaq Kahane dari edisi Leiden (Burbal Press 1932-1933); biografi panjang tentangnya belum ditetapkan, dan ia belum ditetapkan, kecuali Ali ibn Hamza al-Kisai sang ahli tata bahasa (wafat 189 H)."
