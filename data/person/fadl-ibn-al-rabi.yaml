id: person/fadl-ibn-al-rabi
class: person
label: { ar: "الفضل بن الربيع" }
summary:
  ar: "أبو العباس الفضل بن الربيع بن يونس بن محمد بن أبي فروة — واسم أبي فروة كيسان — وزير الأمين؛ وكان أبوه الربيع حاجب المنصور والمهدي، وكان الفضل حاجب هارون الرشيد، فلما أفضت الخلافة إلى الأمين قدم عليه من خراسان بالأموال والقضيب والخاتم فألقى إليه زمام الأمور حتى صار يولي ويعزل، وروى الحديث عن المنصور والمهدي. وأنبه الناس وأعظمهم عند الجاحظ؛ علم أن الخلافة إذا أفضت إلى المأمون لم يبق عليه فأغرى الأمين بخلعه وحثه على أن يولي العهد لابنه موسى. وله فيه قول أبي نواس: «أرى الفضل للدنيا وللدين جامعاً كما السهم فيه الفوق والريش والنصل». توفي يوم الاثنين سلخ ذي القعدة سنة ثمان ومائتين، وقيل سنة سبع، وقيل مولده سنة أربعين ومائة وقيل ثمان وثلاثين {cite:tarikh-baghdad-khatib j.10 p.343-344}."
  en: "Abu'l-'Abbas al-Fadl ibn al-Rabi' — son of al-Mansur's and al-Mahdi's chamberlain, chamberlain of al-Rashid and vizier of al-Amin, to whom he delivered the staff and seal from Khurasan and who then 'appointed and dismissed at will'; he also narrated hadith from al-Mansur and al-Mahdi. Al-Jahiz: 'the shrewdest and greatest of men'; knowing al-Ma'mun's accession meant his end he egged al-Amin to depose him for his infant son Musa. Died at the close of Dhu'l-Qa'da 208 {cite:tarikh-baghdad-khatib j.10 p.343-344}."
