id: person/fadl-ibn-al-rabi
class: person
label: { ar: "الفضل بن الربيع" }
summary:
  ar: "أبو العباس الفضل بن الربيع بن يونس بن محمد بن أبي فروة — واسم أبي فروة كيسان — وزير الأمين؛ وكان أبوه الربيع حاجب المنصور والمهدي، وكان الفضل حاجب هارون الرشيد، فلما أفضت الخلافة إلى الأمين قدم عليه من خراسان بالأموال والقضيب والخاتم فألقى إليه زمام الأمور حتى صار يولي ويعزل، وروى الحديث عن المنصور والمهدي. وأنبه الناس وأعظمهم عند الجاحظ؛ علم أن الخلافة إذا أفضت إلى المأمون لم يبق عليه فأغرى الأمين بخلعه وحثه على أن يولي العهد لابنه موسى. وله فيه قول أبي نواس: «أرى الفضل للدنيا وللدين جامعاً كما السهم فيه الفوق والريش والنصل». توفي يوم الاثنين سلخ ذي القعدة سنة ثمان ومائتين، وقيل سنة سبع، وقيل مولده سنة أربعين ومائة وقيل ثمان وثلاثين {cite:tarikh-baghdad-khatib j.10 p.343-344}."
  en: "Abu'l-'Abbas al-Fadl ibn al-Rabi' — son of al-Mansur's and al-Mahdi's chamberlain, chamberlain of al-Rashid and vizier of al-Amin, to whom he delivered the staff and seal from Khurasan and who then 'appointed and dismissed at will'; he also narrated hadith from al-Mansur and al-Mahdi. Al-Jahiz: 'the shrewdest and greatest of men'; knowing al-Ma'mun's accession meant his end he egged al-Amin to depose him for his infant son Musa. Died at the close of Dhu'l-Qa'da 208 {cite:tarikh-baghdad-khatib j.10 p.343-344}."
  es: "Abu'l-'Abbas al-Fadl ibn al-Rabi' — hijo del chambelán de al-Mansur y al-Mahdi, chambelán de al-Rashid y visir de al-Amin, a quien entregó el bastón y el sello de Jorasán y quien luego 'nombraba y destituía a su antojo'; también narró hadices de al-Mansur y al-Mahdi. Al-Jahiz: 'el más astuto y grande de los hombres'; sabiendo que la ascensión de al-Ma'mun significaba su fin, incitó a al-Amin a deponerlo en favor de su hijo pequeño Musa. Murió al final de Dhu'l-Qa'da 208 {cite:tarikh-baghdad-khatib j.10 p.343-344}."
  fr: "Abu'l-'Abbas al-Fadl ibn al-Rabi', fils du chambellan d'al-Mansur et d'al-Mahdi, chambellan d'al-Rashid et vizir d'al-Amin, à qui il remit le bâton et le sceau du Khorasan et qui pouvait ensuite le nommer et le révoquer à sa guise, rapporta également des hadiths d'al-Mansur et d'al-Mahdi. Al-Jahiz, surnommé « l'homme le plus rusé et le plus grand », savait que l'accession d'al-Ma'mun signifierait sa fin; il incita donc al-Amin à le destituer au profit de son jeune fils Musa. Il mourut à la fin de Dhu'l-Qa'da 208 (voir: Tarikh-Baghdad-Khatib, vol. 10, p. 343-344)."
  ur: "ابو العباس الفضل بن الربیع - المنصور اور المہدی کے چیمبر لین کا بیٹا، الرشید کا چیمبر لین اور الامین کا وزیر، جس کو اس نے خراسان سے عملہ اور مہر پہنچایا اور پھر جسے اپنی مرضی سے 'مقرر اور برطرف کیا'؛ اس نے المنصور اور المہدی سے بھی حدیثیں روایت کیں۔ الجاحز: 'مردوں میں سب سے زیادہ ہوشیار اور عظیم'؛ مامون کے الحاق کو جان کر اس کا انجام ختم ہو گیا، اس نے الامین کو اپنے شیر خوار بیٹے موسیٰ کے لیے معزول کرنے کے لیے انڈے دیے۔ ذوالقعدہ 208 کے اختتام پر وفات پائی۔"
  tr: "Ebu el-Abbas el-Fadl bin Rabi' ibn Yunus ibn Muhammed ibn Ebi Furva — adı Ebu Furva Kaysan — el-Amin'in veziriydi; babası el-Rabi', el-Mensur ve el-Mehdi'nin başkâhibi, el-Fadl ise Harun el-Reşid'in başkâhnasıydı. Halifelik el-Amin'e ulaştığında, o da Horasan'dan servet, bar ve yüzükle geldi ve dizginleri devretti Ta ki atanıp görevden alınana kadar. El-Mensur ve el-Mehdi hakkında hadisleri anlattı. Halkın en uyandırdığı ve en büyüğü el-Cizdi; halifelik el-Memun'a ulaştığında kimsenin yanında kalmayacağını biliyordu, bu yüzden el-Emin onu tahttan indirmeye teşvik etti ve ahdi oğlu Musa'ya emanet etmesini istedi. Ebu Nuwas bu konuda şöyle dedi: \"Dünya için erdemi ve dinin en üstündeki ok, tüyler ve kılıç kadar kapsamlı olduğunu görüyorum.\" 208 yılında Pazartesi günü Sulh, Dhu al-Qi'dah öldü; bazıları yedinci yılda, bazıları 140'ta, bazıları ise 38 yaşında doğduğunu söylüyor {cite:Tarikh-baghdad-khatib J.10 s.343-344} diyor."
  id: "Abu al-Abbas al-Fadl ibn al-Rabi' ibn Yunus ibn Muhammad ibn Abi Furwah — bernama Abu Furwah Kaysan — adalah wazir al-Amin; ayahnya al-Rabi' adalah kamarawan al-Mansur dan al-Mahdi, dan al-Fadl adalah kamarawan Harun al-Rashid. Ketika kekhalifahan tiba di al-Amin, ia datang kepadanya dari Khurasan dengan membawa kekayaan, bar, dan cincin, sehingga ia menyerahkan kendali hingga ia diangkat dan diberhentikan. Ia menceritakan hadits tentang al-Mansur dan al-Mahdi. Yang paling waspada dan terbesar di antara rakyat adalah al-Jahiz; ia tahu bahwa setelah kekhalifahan mencapai al-Ma'mun, tidak ada yang akan tinggal bersamanya, maka al-Amin menggoda dia untuk menggulingkannya dan mendesaknya untuk mempercayakan perjanjian itu kepada putranya Musa. Abu Nuwas berkata tentang hal ini: \"Saya melihat kebajikan bagi dunia dan agama seluas seperti panah di dalamnya adalah yang atas, bulu, dan bilahnya.\" Ia meninggal pada hari Senin, Sulh, Dhu al-Qi'dah, tahun 208, dan beberapa mengatakan pada tahun ketujuh, beberapa mengatakan ia lahir pada tahun 140, dan beberapa mengatakan 38 {sitasi: Tarikh-baghdad-khatib J.10 hlm.343-344}."
