id: person/umar-ibn-hubayra
class: person
label: { ar: "عمر بن هبيرة", en: "Umar ibn Hubayra" }
summary:
  ar: "عمر بن هبيرة الفزاري؛ والي العراق ليزيد بن عبد الملك؛ كتب إليه يزيد أن يسير على القطائع فيأخذ فضولها لأمير المؤمنين فجعل يمسحها حتى أجابه رجل بقوله ورثناها عن آباء صدق ويورثها إذا متنا بنينا فضج الناس فأمسك؛ وتعرف مهلبان في الديوان بقطيعة عمر بن هبيرة إذ أقطعه إياها يزيد حين قبض مال يزيد بن المهلب وإخوته. وعند المسعودي بعث سنة ثلاث ومائة إلى الحسن البصري والشعبي وابن سيرين فقال ابن سيرين والشعبي قولاً فيه تقية وقال الحسن يا ابن هبيرة خف الله في يزيد ولا تخف يزيد في الله إن الله يمنعك من يزيد وإن يزيد لا يمنعك من الله وأوشك أن يبعث إليك ملكاً فيزيلك عن سريرك ويخرجك من سعة قصرك إلى ضيق قبرك فلا طاعة لمخلوق في معصية الخالق، فأجازهم وأضعف جائزة الحسن فقال الشعبي سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}. وعند البلاذري أحدث قنطرة الكوفة أيام ولايته العراق"
  en: "Umar ibn Hubayra al-Fazari; Yazid ibn Abd al-Malik's governor of Iraq — ordered to survey the grants and seize their surplus, he measured till a landowner answered 'we inherited them from truthful fathers' and the outcry stopped him; the Mahallaban estate is known in the diwan as 'Umar ibn Hubayra's qati'a', granted him when Yazid seized the Muhallabids' wealth."
