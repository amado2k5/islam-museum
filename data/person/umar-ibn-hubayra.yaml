id: person/umar-ibn-hubayra
class: person
label: { ar: "عمر بن هبيرة", en: "Umar ibn Hubayra", es: "Umar ibn Hubayra", fr: "Umar ibn Hubayra", ur: "عمر بن ہبیرہ" }
summary:
  ar: "عمر بن هبيرة الفزاري؛ والي العراق ليزيد بن عبد الملك؛ كتب إليه يزيد أن يسير على القطائع فيأخذ فضولها لأمير المؤمنين فجعل يمسحها حتى أجابه رجل بقوله ورثناها عن آباء صدق ويورثها إذا متنا بنينا فضج الناس فأمسك؛ وتعرف مهلبان في الديوان بقطيعة عمر بن هبيرة إذ أقطعه إياها يزيد حين قبض مال يزيد بن المهلب وإخوته. وعند المسعودي بعث سنة ثلاث ومائة إلى الحسن البصري والشعبي وابن سيرين فقال ابن سيرين والشعبي قولاً فيه تقية وقال الحسن يا ابن هبيرة خف الله في يزيد ولا تخف يزيد في الله إن الله يمنعك من يزيد وإن يزيد لا يمنعك من الله وأوشك أن يبعث إليك ملكاً فيزيلك عن سريرك ويخرجك من سعة قصرك إلى ضيق قبرك فلا طاعة لمخلوق في معصية الخالق، فأجازهم وأضعف جائزة الحسن فقال الشعبي سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}. وعند البلاذري أحدث قنطرة الكوفة أيام ولايته العراق ويذكر الكتاب أن عمر ولاه الجزيرة سنة 100هـ، فغزا الروم من ناحية أرمينية فهزمهم وأسر منهم خلقاً كثيراً، ثم ولي العراق وخراسان في خلافة يزيد بن عبد الملك، ثم عزله هشام وقيده وسجنه، ثم هرب واستجار بمسلمة بن عبد الملك فأجاره، ومات نحو سنة 107هـ. {cite:salabi-umayyad-state-2020 p.386} ويذكر الكتاب أن يزيد بن عبد الملك جمع له أمر المشرق كله مع مسلمة في العراق. {cite:salabi-umayyad-state-2020 p.435}"
  en: "Umar ibn Hubayra al-Fazari; Yazid ibn Abd al-Malik's governor of Iraq — ordered to survey the grants and seize their surplus, he measured till a landowner answered 'we inherited them from truthful fathers' and the outcry stopped him; the Mahallaban estate is known in the diwan as 'Umar ibn Hubayra's qati'a', granted him when Yazid seized the Muhallabids' wealth."
  es: "Umar ibn Hubayra al-Fazari, gobernador de Irak por Yazid ibn Abd al-Malik, recibió la orden de inspeccionar las concesiones y confiscar su excedente. Midió hasta que un terrateniente respondió: \"Las heredamos de padres veraces\", y el clamor lo detuvo. La propiedad de Mahallaban se conoce en el diwan como \"la qati'a de Umar ibn Hubayra\", que le fue otorgada cuando Yazid se apoderó de la riqueza de los Muhallabids."
  fr: "Umar ibn Hubayra al-Fazari, gouverneur d'Irak sous Yazid ibn Abd al-Malik, reçut l'ordre d'arpenter les concessions et de s'emparer de leur excédent. Il effectua ses mesures jusqu'à ce qu'un propriétaire terrien réponde: « Nous les avons hérités de pères véridiques », et les protestations l'arrêtèrent. Le domaine de Mahallaban est connu dans le diwan sous le nom de « qati'a d'Umar ibn Hubayra », qui lui fut octroyé lorsque Yazid s'empara des richesses des Muhallabids."
  ur: "عمر بن حبیرہ الفزاری؛ عراق کے گورنر یزید بن عبد المالک نے گرانٹس کا سروے کرنے اور ان کی اضافی رقم ضبط کرنے کا حکم دیا، اس نے اس وقت تک پیمائش کی جب تک کہ ایک زمیندار نے جواب دیا کہ 'ہم نے انہیں سچے باپ دادا سے وراثت میں حاصل کیا ہے' اور اس کی چیخ و پکار نے روک دیا۔ محلہ بن املاک کو دیوان میں عمر بن ہبیرہ کی قتیعہ کے نام سے جانا جاتا ہے، جب یزید نے محلہ والوں کے مال پر قبضہ کیا تو اسے عطا کیا گیا۔"
  tr: "Yazid bin Abd al-Malik'in Irak valisi Umar bin Hubayrah el-Fazari, Yazid'e fazla malları Müminler Komutanı'na götürmek için ocaklara yürümesini yazdı. Onları silmeye başladı ta ki bir adam, 'Onları dürüst babalardan miras aldık ve biz oğul olarak öldüğümüzde miras alacak.' divanda halk huzursuzlandı, bu yüzden onları sakladı. Muhlban, diwanda Umar ibn Hubayrah'ın uzaklaşmasıyla bilinir; çünkü Yezid, Yazid ibn al-Muhallab ve kardeşleri paralarını aldığında ona kestirdi. El-Mes'udi'ye göre, 103 Hicri yılında Hasan el-Basri'ye, el-Şa'bi'ye ve İbn Sirin'e gönderdi. İbn Sirin ve Şa'bi takiyye olan bir şey söylediler. El-Hasan şöyle dedi: Ey İbn Hubeyre, Yezid'den kork ve Allah uğruna Yezid'den korkma. Gerçekten Allah seni Yezid'den uzak tutar; eğer Yezid seni Allah'tan alıkoymazsa, seni yatağından kaldıracak ve sarayının genişliğinden mezarının dar köşesine çıkaracak bir melek gönderecek. Yaratıcıya itaatsizlik eden hiçbir yaratıka itaat yoktur. Bu yüzden onlara izin verdi ve el-Hasan'ın ödülünü zayıflattı. El-Şabi dedi ki: 'Biz aptalız, bu yüzden bizim için susun.' {atı: Muruj-al-Dhahab, s. 190}. El-Baladri'ye göre, Irak'taki yönetimi sırasında Kufa köprüsü'nü inşa etmiştir. Kitap, Umar'ın onu 100 Hicri yıllarında Cazire'ye atadığını, burada Romalıları Ermeni tarafından işgal ettiğini, onları yendiğini ve birçoğunu ele geçirdiğini belirtir. Daha sonra Yezid bin Abdülmelik'in halifeliği sırasında Irak ve Horasan'ı yönetmiştir. Hisham onu görevden almış, hapse atmış ve hapse atmış, ardından kaçmış, kendisine sığınak sağlayan Maslama ibn Abd al-Malik'e sığınmış ve yaklaşık 107 Hicri yılında ölmüştür. {cite:selabi-umayyad-state-2020 s.386} Kitap, Yezid bin Abdülmelik'in tüm Doğu'nun işlerini Irak'taki Müslüman ile birleştirdiğini belirtir. {cite:Selabi-Umayyad-devlet-2020 s.435}"
  id: "Umar ibn Hubayrah al-Fazari, gubernur Irak untuk Yazid ibn Abd al-Malik, menulis kepada Yazid untuk maju ke tambang dan membawa surplusnya kepada Komandan Orang Beriman. Ia mulai menghapus tambang-tambangnya hingga seorang pria menjawab, 'Kami mewarisinya dari ayah yang benar, dan ia akan mewarisinya ketika kita mati sebagai anak.' Rakyat menjadi gelisah, sehingga ia menahan mereka. Muhlban dikenal dalam diwan karena keterasingan Umar ibn Hubayrah, seperti yang diucapkan Yazid kepadanya ketika Yazid ibn al-Muhallab dan saudara-saudaranya menerima uang mereka. Menurut al-Mas'udi, pada tahun 103 H, ia mengirim surat kepada al-Hasan al-Basri, al-Sha'bi, dan Ibn Sirin. Ibn Sirin dan al-Sha'bi mengatakan sesuatu yang taqiyya. Al-Hasan berkata: Wahai Ibn Hubayrah, takutlah Allah tentang Yazid dan janganlah takut pada Yazid demi Allah. Memang, Allah menghalangmu dari Yazid, dan jika Yazid tidak menghalangmu dari Allah, Dia akan mengirim malaikat untuk mengangkat kamu dari ranjangmu dan membawamu keluar dari luasnya istana ke sempitnya kuburmu. Tidak ada ketaatan kepada makhluk yang membangkang kepada Pencipta. Jadi dia mengizinkan mereka dan melemahkan ganjaran al-Hasan. Al-Sha'bi berkata: 'Kami bodoh, maka kamu diam demi kami.' {cite:muruj-al-dhahab, hlm. 190}. Menurut al-Baladhuri, ia membangun jembatan Kufa selama pemerintahannya di Irak. Buku tersebut menyebutkan bahwa Umar mengangkatnya ke Jazira pada tahun 100 H, di mana ia menyerang Romawi dari pihak Armenia, mengalahkan mereka, dan menangkap banyak dari mereka. Ia kemudian memerintah Irak dan Khorasan selama kekhalifahan Yazid ibn Abd al-Malik. Hisham kemudian memecat, memenjarakan, dan memenjarakannya, lalu melarikan diri, mencari perlindungan kepada Maslama ibn Abd al-Malik, yang memberinya tempat berlindung, dan meninggal sekitar tahun 107 H. {cite:salabi-umayyad-state-2020 hlm.386} Buku tersebut menyebutkan bahwa Yazid ibn Abd al-Malik menyatukan urusan seluruh Timur dengan Muslimah di Irak. {cite:salabi-umayyad-state-2020 hlm.435}"
