names:
  - { value: "أبو محمد عبد الله بن علي سبط الخياط البغدادي المقرئ الفقيه الحنبلي النحوي", kind: full }
summary:
  ar: "سبط الخياط أبو محمد عبد الله بن علي البغدادي المقرئ الفقيه الحنبلي النحوي شيخ المقرئين بالعراق وصاحب التصانيف؛ ولد سنة أربع وستين وأربعمائة وقرأ القرآن على جده الزاهد أبي منصور وبرع في العربية على ابن فاخر وأمّ بمسجد حردة بضعاً وخمسين سنة وكان من أندى الناس صوتاً بالقرآن؛ قال ابن الجوزي لم أسمع قارئاً قط أطيب صوتاً منه ولا أحسن أداءً على كبر سنه، وقال ابن شافع كان شيخ العراق رجع إلى دين وثقة وأمانة وكان جمال العراق بأسره؛ توفي بكرة الاثنين ثاني عشر ربيع الآخر فحُط تابوته بالحبال من سطح مسجده وما رأى ابن الجوزي جمعاً أكثر من جمعه ودفن في دكة الإمام أحمد عند جده {cite:shadharat-dhahab p. 609-610}."
  en: "Sibt al-Khiyat, Abu Muhammad Abdallah ibn Ali of Baghdad — shaykh of Iraq's Qur'an readers, Hanbali jurist and grammarian; b. 464, he led prayer at the Harida mosque for fifty-odd years and was among the sweetest-voiced reciters; Ibn al-Jawzi heard none finer, Ibn Shafi' calls him 'the shaykh of Iraq' and 'the beauty of all Iraq'; d. Monday morning 12 Rabi' II, his coffin lowered by ropes from the mosque roof before an uncountable funeral crowd, buried in Imam Ahmad's dakka beside his grandfather {cite:shadharat-dhahab p. 609-610}."
