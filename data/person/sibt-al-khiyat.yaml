summary:
  ar: "سبط الخياط أبو محمد عبد الله بن علي البغدادي المقرئ الفقيه الحنبلي النحوي شيخ المقرئين بالعراق وصاحب التصانيف؛ ولد سنة أربع وستين وأربعمائة وقرأ القرآن على جده الزاهد أبي منصور وبرع في العربية على ابن فاخر وأمّ بمسجد حردة بضعاً وخمسين سنة وكان من أندى الناس صوتاً بالقرآن؛ قال ابن الجوزي لم أسمع قارئاً قط أطيب صوتاً منه ولا أحسن أداءً على كبر سنه، وقال ابن شافع كان شيخ العراق رجع إلى دين وثقة وأمانة وكان جمال العراق بأسره؛ توفي بكرة الاثنين ثاني عشر ربيع الآخر فحُط تابوته بالحبال من سطح مسجده وما رأى ابن الجوزي جمعاً أكثر من جمعه ودفن في دكة الإمام أحمد عند جده {cite:shadharat-dhahab p. 609-610}."
  en: "Sibt al-Khiyat, Abu Muhammad Abdallah ibn Ali of Baghdad — shaykh of Iraq's Qur'an readers, Hanbali jurist and grammarian; b. 464, he led prayer at the Harida mosque for fifty-odd years and was among the sweetest-voiced reciters; Ibn al-Jawzi heard none finer, Ibn Shafi' calls him 'the shaykh of Iraq' and 'the beauty of all Iraq'; d. Monday morning 12 Rabi' II, his coffin lowered by ropes from the mosque roof before an uncountable funeral crowd, buried in Imam Ahmad's dakka beside his grandfather {cite:shadharat-dhahab p. 609-610}."
  es: "Sibt al-Khiyat, Abu Muhammad Abdallah ibn Ali de Bagdad, shaykh de los lectores del Corán de Irak, jurista y gramático hanbalí; n. 464, dirigió la oración en la mezquita Harida durante más de cincuenta años y fue uno de los recitadores de voz más dulce; Ibn al-Jawzi no escuchó a nadie mejor, Ibn Shafi' lo llama 'el shaykh de Irak' y 'la belleza de todo Irak'; murió el lunes por la mañana del 12 de Rabi' II, su ataúd fue bajado con cuerdas desde el techo de la mezquita ante una multitud fúnebre incontable, enterrado en la dakka del Imam Ahmad junto a su abuelo {cite:shadharat-dhahab p. 609-610}."
  fr: "Sibt al-Khiyat, Abu Muhammad Abdallah ibn Ali de Bagdad — cheikh des lecteurs du Coran d'Irak, juriste et grammairien hanbalite; né en 464, il dirigea la prière à la mosquée Harida pendant une cinquantaine d'années et comptait parmi les récitants à la voix la plus douce; Ibn al-Jawzi n'en a jamais entendu de meilleur, Ibn Shafi' l'appelle « le cheikh d'Irak » et « la beauté de tout l'Irak »; décédé le lundi matin 12 Rabi' II, son cercueil descendu par des cordes du toit de la mosquée devant une foule funéraire innombrable, enterré dans le dakka de l'imam Ahmad à côté de son grand-père {cite:shadharat-dhahab p. 609-610}."
