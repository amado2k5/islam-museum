  ar: "صحابي جهني؛ شهد الحديبية وكان معه لواء جهينة يوم الفتح، وحديثه في الصحيحين وغيرهما، ومات بالمدينة واختُلف في سنته بين ثمان وستين وثمان وسبعين."
