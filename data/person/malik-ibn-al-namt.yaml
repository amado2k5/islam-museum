summary:
  ar: "وافد همدان على النبي مرجعه من تبوك، ارتجز بالقوم ثم قام بين يدي النبي فقال: نصية من همدان من كل حاضر وباد أتوك على قلص نواجٍ متصلة بحبائل الإسلام، فكتب له النبي كتاباً لمخلاف خارف وأهل جناب الهضب وحقاف الرمل بأن لهم فراع أرضهم ووهاطها ما أقاموا الصلاة وآتوا الزكاة؛ وقال في ذلك شعراً يذكر فيه أنه ذكر رسول الله في فحمة الدجى. والمصادر المتأخرة تقول إن النبي أمّره على من أسلم من همدان."
  en: "The envoy of Hamdan who met the Prophet on his return from Tabuk, chanted rajaz before the company, then stood before the Prophet and said that the pick of Hamdan, settled and nomad, had come on swift camels bound to the ropes of Islam; the Prophet wrote him a letter for the district of Kharif and the people of the highland slopes and sand dunes granting them their heights and lowlands while they prayed and paid zakat, and he composed verses recalling the Messenger in the blackness of night. Later sources say the Prophet set him over the Muslims of Hamdan."
