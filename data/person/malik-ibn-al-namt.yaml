summary:
  ar: "وافد همدان على النبي مرجعه من تبوك، ارتجز بالقوم ثم قام بين يدي النبي فقال: نصية من همدان من كل حاضر وباد أتوك على قلص نواجٍ متصلة بحبائل الإسلام، فكتب له النبي كتاباً لمخلاف خارف وأهل جناب الهضب وحقاف الرمل بأن لهم فراع أرضهم ووهاطها ما أقاموا الصلاة وآتوا الزكاة؛ وقال في ذلك شعراً يذكر فيه أنه ذكر رسول الله في فحمة الدجى. والمصادر المتأخرة تقول إن النبي أمّره على من أسلم من همدان."
  en: "The envoy of Hamdan who met the Prophet on his return from Tabuk, chanted rajaz before the company, then stood before the Prophet and said that the pick of Hamdan, settled and nomad, had come on swift camels bound to the ropes of Islam; the Prophet wrote him a letter for the district of Kharif and the people of the highland slopes and sand dunes granting them their heights and lowlands while they prayed and paid zakat, and he composed verses recalling the Messenger in the blackness of night. Later sources say the Prophet set him over the Muslims of Hamdan."
  ur: "ہمدان کا قاصد جو تبوک سے واپسی پر نبی سے ملا، مجلس میں رجز پڑھا، پھر نبی کے سامنے کھڑا ہو کر کہا۔"
  es: "El enviado de Hamdan que se encontró con el Profeta a su regreso de Tabuk, recitó rajaz ante la compañía, luego se presentó ante el Profeta y dijo que la élite de Hamdan, tanto sedentaria como nómada, había llegado en veloces camellos atados a las cuerdas del Islam. El Profeta le escribió una carta para el distrito de Kharif y la gente de las laderas de las tierras altas y las dunas de arena, otorgándoles sus tierras altas y bajas mientras oraban y pagaban el zakat, y compuso versos recordando al Mensajero en la oscuridad de la noche. Fuentes posteriores dicen que el Profeta lo puso al frente de los musulmanes de Hamdan."
  fr: "L'envoyé de Hamdan, qui rencontra le Prophète à son retour de Tabuk, récita le rajaz devant l'assemblée, puis se présenta devant le Prophète et déclara que l'élite de Hamdan, sédentaires et nomades, était arrivée sur des chameaux rapides, liés par les liens de l'Islam. Le Prophète lui écrivit une lettre pour la région de Kharif et les habitants des hauts plateaux et des dunes, leur accordant leurs terres, tant qu'ils y priaient et s'acquittaient de la zakat. L'envoyé composa ensuite des versets en mémoire du Messager dans l'obscurité de la nuit. Des sources plus tardives rapportent que le Prophète le chargea de la charge des musulmans de Hamdan."
