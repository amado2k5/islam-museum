    note: "Her current position is recorded exactly as she states it herself, on two independent attestations. In her own essay 'Why I am now a Christian', published by UnHerd on 13 November 2023, Hirsi Ali wrote that she now considers herself a Christian, that she had found life without spiritual solace unendurable, and that atheism had failed to answer the question of the meaning and purpose of life; the Catholic News Agency report of the same day, carried by EWTN, reports the essay in the same terms and records that she 'now considers herself a member of the Christian religion'. The English Wikipedia article independently records: 'In November 2023, Hirsi Ali converted to Christianity'. Her earlier position is part of this same record and is not suppressed: she renounced Islam and acknowledged her disbelief in God in 2002, identified as an atheist for over two decades alongside the New Atheist writers, and that atheist period is attested by the same sources (the English article's section 'Atheism and conversion to Christianity'; the CNA report: 'in 2002 renounced her Muslim faith and declared herself an atheist'; Encyclopedia.com's entry lists her religion in that period as 'Atheist'). The segment recorded is christian because that is her own latest self-description; the atheist-or-sceptic value the queue-era framing expected describes the 2002-2023 period only. Critics of the conversion are also on record in the sources: some Christians read it as a cultural rather than a spiritual response, and some atheists said they were baffled by it; both responses are carried in the prose, attributed, with no verdict from the museum."
    sources: [source/wikipedia-ayaan-hirsi-ali-en, source/ewtn-hirsi-ali-christian]
