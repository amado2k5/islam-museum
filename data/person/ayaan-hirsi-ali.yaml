summary:
  ar: "كاتبة وناشطة وسياسية سابقة صومالية المولد هولندية أمريكية، وُلدت في مقديشو سنة 1969؛ طلبت اللجوء في هولندا سنة 1992 وجلست في برلمانها (2003–2006)، وكتبت سيناريو فيلم «الخضوع» مع ثيو فان غوخ الذي اغتيل بعد عرضه سنة 2004، واشتهرت كتبها «الكافرة» و«البدوية» و«الزنديقة». تركت الإسلام وأعلنت الإلحاد سنة 2002، ثم أعلنت اعتناقها المسيحية في نوفمبر 2023؛ وهي مدرجة هنا بوصفها شخصية مؤثرة في قصة العالم الإسلامي الحديث، ومواقفها وانتقاداتها منقولة منسوبة إلى مصادرها مع ردود منتقديها، بلا حكم من المتحف."
  en: "Somali-born Dutch-American writer, activist and former politician, born in Mogadishu in 1969. She sought asylum in the Netherlands in 1992 and sat in its parliament (2003-2006); she wrote the script for the film Submission with Theo van Gogh, who was murdered after its release in 2004, and her books Infidel, Nomad and Heretic became bestsellers. She renounced Islam and declared herself an atheist in 2002, then announced her conversion to Christianity in November 2023. She is included here as an influential figure in the story of the modern Muslim world; her positions and criticisms are carried attributed from the sources, with her critics' responses, and with no verdict from the museum."
  ur: "صومالی نژاد ڈچ امریکی مصنفہ، کارکن اور سابق سیاست دان، 1969 میں موغادیشو میں پیدا ہوئیں؛ 1992 میں نیدرلینڈز میں پناہ لی اور اس کی پارلیمنٹ کی رکن رہیں (2003ء–2006ء)، تھیو وان گوخ کے ساتھ فلم «سبمیشن» لکھی جس کی نمائش کے بعد 2004 میں وان گوخ قتل ہوئے، اور ان کی کتابیں «انفیڈل»، «نوماڈ» اور «ہیریٹک» مقبول ہوئیں۔ انھوں نے 2002 میں اسلام چھوڑ کر الحاد کا اعلان کیا، پھر نومبر 2023 میں مسیحیت قبول کرنے کا اعلان کیا۔ وہ یہاں جدید مسلم دنیا کی کہانی کی ایک مؤثر شخصیت کے طور پر شامل ہیں؛ ان کے مواقف اور تنقیدات مآخذ سے منسوب کر کے، ان کے ناقدین کے جوابات سمیت، درج ہیں اور میوزیم کا کوئی فیصلہ نہیں دیا گیا۔"
