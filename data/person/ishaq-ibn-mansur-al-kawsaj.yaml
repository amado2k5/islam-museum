summary:
  ar: "إسحاق بن منصور بن بهرام، أبو يعقوب المروزي، المعروف بالكوسج، فقيه حنبلي من رجال الحديث، ولد بمرو ورحل إلى العراق والحجاز والشام واستوطن نيسابور وتوفي بها سنة ٢٥١هـ الموافقة ٨٦٥م، وله المسائل في الفقه دونها عن الإمام أحمد."
  en: "Ishaq ibn Mansur ibn Bahram, Abu Ya'qub al-Marwazi, known as al-Kawsaj, a Hanbali jurist and man of hadith, born in Merv; he travelled to Iraq, the Hijaz and Syria, settled in Nishapur and died there in 251 AH, 865 CE; his al-Masa'il on jurisprudence records questions put to Imam Ahmad."
  es: "Ishaq ibn Mansur ibn Bahram, Abu Ya'qub al-Marwazi, conocido como al-Kawsaj, jurista hanbalí y hombre de hadices, nació en Merv; viajó a Irak, el Hiyaz y Siria, se estableció en Nishapur y murió allí en el año 251 AH, 865 d. C.; su obra al-Masa'il sobre jurisprudencia recoge las preguntas formuladas al Imam Ahmad."
  fr: "Ishaq ibn Mansur ibn Bahram, Abu Ya'qub al-Marwazi, connu sous le nom d'al-Kawsaj, juriste hanbalite et spécialiste du hadith, né à Merv; il voyagea en Irak, dans le Hedjaz et en Syrie, s'installa à Nishapur et y mourut en 251 AH, 865 CE; son ouvrage al-Masa'il sur la jurisprudence recense les questions posées à l'imam Ahmad."
