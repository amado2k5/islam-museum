summary:
  ar: "إسحاق بن منصور بن بهرام، أبو يعقوب المروزي، المعروف بالكوسج، فقيه حنبلي من رجال الحديث، ولد بمرو ورحل إلى العراق والحجاز والشام واستوطن نيسابور وتوفي بها سنة ٢٥١هـ الموافقة ٨٦٥م، وله المسائل في الفقه دونها عن الإمام أحمد."
  en: "Ishaq ibn Mansur ibn Bahram, Abu Ya'qub al-Marwazi, known as al-Kawsaj, a Hanbali jurist and man of hadith, born in Merv; he travelled to Iraq, the Hijaz and Syria, settled in Nishapur and died there in 251 AH, 865 CE; his al-Masa'il on jurisprudence records questions put to Imam Ahmad."
