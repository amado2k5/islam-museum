id: person/muhammad-ibn-zayd-al-alawi
class: person
label: { ar: "محمد بن زيد العلوي" }
summary:
  ar: "خرج نحو خراسان في سنة سبع وثمانين ومائتين، ثم ورد الخبر بمقتله في شوال من السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.10 p.81}. وعند المسعودي ورد مال منه ليفرق في آل أبي طالب سراً فأظهره المعتضد وقربهم، ولما قتله محمد بن هارون أظهر المعتضد لذلك النكير والحزن تأسفاً على قتله {cite:muruj-al-dhahab p. 630-631} وعند ابن الجوزي دخل رافع بن هرثمة نيسابور سنة ثلاث وثمانين وخطب له ولأبيه فيها، وفي سنة اثنتين وثمانين وجّه من طبرستان اثنين وثلاثين ألف دينار تُفرَّق على العلوية بالحرمين والكوفة ومن في بغداد فأطلقها المعتضد بعد رؤيا بدر {cite:muntazam-ibn-al-jawzi p. 154-155, 162}."
  tr: "287 Hicri yılında Horasan'a doğru yola çıktı ve ölüm haberi aynı yılın Şavval'ında geldi {atıf:tabari-tarikh-abu-al-fadl j.10 s.81}. al-Mas'udi'ye göre, ondan para geri verildi ve gizlice Ebu Talib'in ailesi arasında dağıtıldı, böylece al-Mu'tadid ve akrabaları bunu açıkladı. Muhammed ibn Harun onu öldürdüğünde, al-Mu'tadid ölümüne karşı hoşnutsuzluk ve üzüntü gösterdi {atıf:muruj-al-dhahab s. 630-631} İbn al-Jawzi'ye göre, Rafi'bin Harthama seksen üçüncü yılında Nişapur'a girdi ve orada ona ve babasına bir vaaz verdi. Seksen iki yılında, iki kutsal Camii, Kufe ve Bağdat'taki Aleviler arasında otuz iki bin dinar dağıtıldı; al-Mu'tadid Badir'in vizyonundan sonra bu camileri serbest bıraktı {cite:Muntazam-ibn-al-jawzi s. 154-155, 162}."
  id: "Ia berangkat menuju Khorasan pada tahun 287 H, dan kabar kematiannya muncul dalam Shawwal tahun yang sama {cite:tabari-tarikh-abu-al-fadl j.10 hlm.81}. Menurut al-Mas'udi, uang dikembalikan darinya untuk didistribusikan secara diam-diam kepada keluarga Abu Talib, sehingga al-Mu'tadid dan kerabat mereka mengungkapkannya. Ketika Muhammad ibn Harun membunuhnya, al-Mu'tadid menunjukkan ketidaksetujuan dan kesedihan atas kematiannya {cite:muruj-al-dhahab hlm. 630-631} Menurut Ibn al-Jawzi, Rafi' ibn Harthama memasuki Nishapur pada tahun delapan puluh tiga dan memberikan khotbah kepada dia dan ayahnya di sana. Pada tahun delapan puluh dua, tiga puluh dua ribu dinar dibagikan kepada Alawit di Dua Masjid Suci, Kufa, dan yang di Baghdad, yang dirilis al-Mu'tadid setelah penglihatan Badr {cite:Muntazam-ibn-al-jawzi hlm. 154-155, 162}."
