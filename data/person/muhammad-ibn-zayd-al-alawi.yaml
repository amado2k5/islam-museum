id: person/muhammad-ibn-zayd-al-alawi
class: person
label: { ar: "محمد بن زيد العلوي" }
summary:
  ar: "خرج نحو خراسان في سنة سبع وثمانين ومائتين، ثم ورد الخبر بمقتله في شوال من السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.10 p.81}. وعند المسعودي ورد مال منه ليفرق في آل أبي طالب سراً فأظهره المعتضد وقربهم، ولما قتله محمد بن هارون أظهر المعتضد لذلك النكير والحزن تأسفاً على قتله {cite:muruj-al-dhahab p. 630-631} وعند ابن الجوزي دخل رافع بن هرثمة نيسابور سنة ثلاث وثمانين وخطب له ولأبيه فيها، وفي سنة اثنتين وثمانين وجّه من طبرستان اثنين وثلاثين ألف دينار تُفرَّق على العلوية بالحرمين والكوفة ومن في بغداد فأطلقها المعتضد بعد رؤيا بدر {cite:muntazam-ibn-al-jawzi p. 154-155, 162}."
