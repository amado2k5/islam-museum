id: person/said-al-harashi
class: person
label: { ar: "سعيد بن عمرو بن أسود الحرشي", en: "Sa'id ibn Amr ibn Aswad al-Harashi" }
summary:
  ar: "سعيد بن عمرو بن أسود الحرشي من أمراء الثغور؛ وجّهه هشام بن عبد الملك على مقدمة مسلمة بن عبد الملك إلى أرمينية فواقع الخزر وقد حاصروا ورتان فكشفهم عنها وهزمهم فأتاه كتاب مسلمة يلومه على قتالهم قبل قدومه فأُخذ وقيّد وحُبس ببرذعة حتى كتب هشام بإخراجه، وولّاه هشام الثغر بعد مسلمة سنتين. ويذكر الكتاب أن سعيد بن عمرو الحرشي جهزه مسلمة بن عبد الملك بعشرة آلاف لقتال شوذب الخارجي، فقتل شوذب وأصحابه سنة 101هـ. {cite:salabi-umayyad-state-2020 p.430} ويذكر الكتاب أن عمر بن هبيرة استعمله على خراسان. {cite:salabi-umayyad-state-2020 p.435} ويذكر الكتاب أنه تولى خراسان بعد عبد الرحمن بن نعيم، فقضى على انتفاضة الصغد وطخارستان، وصالح أهل كش، وأعاد للمسلمين سيطرتهم على ما وراء النهر، وشارك فيه الموالي وأمير سمرقند غورك. {cite:salabi-umayyad-state-2020 p.448-456}"
  en: "Sa'id ibn Amr ibn Aswad al-Harashi, an amir of the marches; Hisham ibn Abd al-Malik sent him at the head of Maslama ibn Abd al-Malik's vanguard to Armenia, where he met the Khazars besieging Wartan, drove them off and routed them — whereupon Maslama's letter came blaming him for fighting before his arrival, so he was seized, bound and jailed at Bardha'a until Hisham wrote for his release; after Maslama, Hisham gave him the march for two years."
