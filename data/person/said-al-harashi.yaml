label: { ar: "سعيد بن عمرو بن أسود الحرشي", en: "Sa'id ibn Amr ibn Aswad al-Harashi", es: "Sa'id ibn Amr ibn Aswad al-Harashi", fr: "Sa'id ibn Amr ibn Aswad al-Harashi", ur: "سعید بن عمرو بن اسود الحرشی" }
summary:
  ar: "سعيد بن عمرو بن أسود الحرشي من أمراء الثغور؛ وجّهه هشام بن عبد الملك على مقدمة مسلمة بن عبد الملك إلى أرمينية فواقع الخزر وقد حاصروا ورتان فكشفهم عنها وهزمهم فأتاه كتاب مسلمة يلومه على قتالهم قبل قدومه فأُخذ وقيّد وحُبس ببرذعة حتى كتب هشام بإخراجه، وولّاه هشام الثغر بعد مسلمة سنتين. ويذكر الكتاب أن سعيد بن عمرو الحرشي جهزه مسلمة بن عبد الملك بعشرة آلاف لقتال شوذب الخارجي، فقتل شوذب وأصحابه سنة 101هـ. {cite:salabi-umayyad-state-2020 p.430} ويذكر الكتاب أن عمر بن هبيرة استعمله على خراسان. {cite:salabi-umayyad-state-2020 p.435} ويذكر الكتاب أنه تولى خراسان بعد عبد الرحمن بن نعيم، فقضى على انتفاضة الصغد وطخارستان، وصالح أهل كش، وأعاد للمسلمين سيطرتهم على ما وراء النهر، وشارك فيه الموالي وأمير سمرقند غورك. {cite:salabi-umayyad-state-2020 p.448-456}"
  en: "Sa'id ibn Amr ibn Aswad al-Harashi, an amir of the marches; Hisham ibn Abd al-Malik sent him at the head of Maslama ibn Abd al-Malik's vanguard to Armenia, where he met the Khazars besieging Wartan, drove them off and routed them — whereupon Maslama's letter came blaming him for fighting before his arrival, so he was seized, bound and jailed at Bardha'a until Hisham wrote for his release; after Maslama, Hisham gave him the march for two years."
  es: "Sa'id ibn Amr ibn Aswad al-Harashi, un emir de las marcas; Hisham ibn Abd al-Malik lo envió al frente de la vanguardia de Maslama ibn Abd al-Malik a Armenia, donde se encontró con los jázaros que sitiaban Wartan, los expulsó y los derrotó; entonces llegó la carta de Maslama culpándolo de haber luchado antes de su llegada, por lo que fue apresado, atado y encarcelado en Bardha'a hasta que Hisham escribió para su liberación; después de Maslama, Hisham le dio la marca por dos años."
  fr: "Sa'id ibn Amr ibn Aswad al-Harashi, un émir des marches; Hisham ibn Abd al-Malik l'envoya à la tête de l'avant-garde de Maslama ibn Abd al-Malik en Arménie, où il rencontra les Khazars assiégeant Wartan, les repoussa et les mit en déroute — sur quoi arriva la lettre de Maslama le blâmant d'avoir combattu avant son arrivée, il fut donc arrêté, ligoté et emprisonné à Bardha'a jusqu'à ce que Hisham écrive pour sa libération; après Maslama, Hisham lui confia la marche pendant deux ans."
  ur: "سعید بن عمرو بن اسود الحرشی، مارچوں کے امیر؛ ہشام بن عبد الملک نے اسے مسلمہ بن عبد الملک کے ہراول دستے کے سر پر آرمینیا بھیجا، جہاں اس نے وارتن کا محاصرہ کرنے والے خزاروں سے ملاقات کی، انہیں بھگا دیا اور ان کو بھگا دیا - اس کے بعد مسلمہ کا خط آیا کہ اس پر اس کی آمد سے پہلے لڑائی کا الزام لگایا گیا، چنانچہ اسے پکڑ لیا گیا، اس کی رہائی کے لیے پابند سلاسل کیا گیا۔ مسلمہ کے بعد ہشام نے اسے دو سال تک مارچ دیا۔"
