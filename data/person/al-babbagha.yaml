label: { ar: "أبو الفرج عبد الواحد بن نصر المخزومي الببغاء" }
summary:
  ar: "عبد الواحد بن نصر بن علي أبو الفرج المخزومي الشاعر الملقب بالببغاء، كان أديباً فاضلاً وكاتباً مترسلاً وشاعراً مجيداً لطيفاً، ومن مشهور شعره قوله إلى عميد الجيوش لما حبس يستغيث به وقد ثبت به داره وفر العبيد وأودت ثيابه وباع فروشه، وكان قد لقب بالببغاء قديماً فيقول قد مزق الدهر وشيي وكان غذائي نقي الأرز فها أنا مقتفع بسال الشيش، وكتب إليه أبو إسحاق إبراهيم بن هلال الصابي من السجن وقد زاره في محبسه. توفي الببغاء في شعبان سنة ثمان وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.241-243}."
