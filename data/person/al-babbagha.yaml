label: { ar: "أبو الفرج عبد الواحد بن نصر المخزومي الببغاء", en: "Abu al-Faraj al-Makhzumi al-Babbagha", fr: "Abu al-Faraj al-Makhzumi al-Babbagha", es: "Abu al-Faraj al-Makhzumi al-Babbagha", ur: "ابو الفراج المخزومی الباباء" }
summary:
  ar: "عبد الواحد بن نصر بن علي أبو الفرج المخزومي الشاعر الملقب بالببغاء، كان أديباً فاضلاً وكاتباً مترسلاً وشاعراً مجيداً لطيفاً، ومن مشهور شعره قوله إلى عميد الجيوش لما حبس يستغيث به وقد ثبت به داره وفر العبيد وأودت ثيابه وباع فروشه، وكان قد لقب بالببغاء قديماً فيقول قد مزق الدهر وشيي وكان غذائي نقي الأرز فها أنا مقتفع بسال الشيش، وكتب إليه أبو إسحاق إبراهيم بن هلال الصابي من السجن وقد زاره في محبسه. توفي الببغاء في شعبان سنة ثمان وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.241-243}."
  en: "Abd al-Wahid ibn Nasr ibn Ali, Abu al-Faraj al-Makhzumi, the poet called al-Babbagha; a cultivated man of letters, an elegant epistolary writer and a fine poet. Among his best-known verses is one addressed to Amid al-Juyush, appealing for help while he was imprisoned, when his house had been seized, his slaves had fled, his clothes were ruined and he had sold his furnishings. He had been nicknamed al-Babbagha long before, and in that verse he says that time has torn his garment, and that where his food was once fine rice he now makes do with plainer fare. Abu Ishaq Ibrahim ibn Hilal al-Sabi wrote to him from the prison, after visiting him in his confinement. He died in Sha'ban 398 {cite:muntazam-ibn-al-jawzi j.7 p.241-243}."
  fr: "Abd al-Wahid ibn Nasr ibn Ali, Abu al-Faraj al-Makhzumi, poète appelé al-Babbagha ; homme de lettres cultivé, élégant épistolier et bon poète. Parmi ses vers les plus connus figurent ceux adressés à Amid al-Juyush pour lui demander de l’aide en prison, alors que sa maison avait été saisie, ses esclaves avaient fui, ses vêtements étaient usés et qu’il avait vendu son mobilier. Surnommé al-Babbagha depuis longtemps, il dit dans ces vers que le temps a déchiré son habit et que, là où il mangeait jadis du riz fin, il se contente désormais de mets plus simples. Abu Ishaq Ibrahim ibn Hilal al-Sabi lui écrivit de prison, après lui avoir rendu visite dans son confinement. Il mourut en sha’ban 398 H {cite:muntazam-ibn-al-jawzi j.7 p.241-243}."
  es: "Abd al-Wahid ibn Nasr ibn Ali, Abu al-Faraj al-Makhzumi, el poeta llamado al-Babbagha; un hombre culto de letras, un elegante escritor epistolar y un excelente poeta. Entre sus versos más conocidos se encuentra uno dirigido a Amid al-Juyush, en el que le pide ayuda mientras estaba encarcelado, cuando su casa había sido confiscada, sus esclavos habían huido, su ropa estaba arruinada y había vendido sus enseres. Ya era conocido como al-Babbagha desde mucho antes, y en ese verso dice que el tiempo ha desgarrado su vestidura, y que donde antes comía arroz fino ahora se conforma con comida más sencilla. Abu Ishaq Ibrahim ibn Hilal al-Sabi le escribió desde la prisión, después de visitarlo en su confinamiento. Murió en Sha'ban 398 {cite:muntazam-ibn-al-jawzi j.7 p.241-243}."
  ur: "عبد الواحد ابن نصر ابن علی، ابو الفراج المخزومی، الببغہ کہلانے والے شاعر۔ خطوط کا ایک کھیتی باڑی آدمی، ایک خوبصورت خطاطی مصنف اور ایک عمدہ شاعر۔ ان کی سب سے مشہور آیات میں سے ایک ہے امد الجیوش کو خطاب کرتے ہوئے، جب وہ قید میں تھا، جب اس کے گھر پر قبضہ کیا گیا تھا، اس کے غلام بھاگ گئے تھے، اس کے کپڑے خراب ہوگئے تھے اور اس نے اپنا سامان بیچ دیا تھا۔ اس کو بہت پہلے الببغہ کے لقب سے پکارا گیا تھا، اور اس آیت میں وہ کہتا ہے کہ وقت نے اس کا لباس پھاڑ دیا ہے، اور جہاں اس کا کھانا کبھی عمدہ چاول تھا، اب وہ سادہ کرایہ کے ساتھ کرتا ہے۔ ابو اسحاق ابراہیم بن ہلال السبی نے قید میں ان کی عیادت کے بعد انہیں جیل سے خط لکھا۔ آپ کی وفات شعبان 398 میں ہوئی۔"
