summary:
  ar: "محدثة وقارئة دمشقية (661–741هـ)، زوجة الحافظ جمال الدين المزي، سمعت من أبي الفضل بن عساكر، ولقّنت النساء القرآن فختمن عليها، وقال ابن كثير إنها كانت عديمة النظير في كثرة عبادتها وحسن أدائها للقرآن."
  en: "A Damascene hadith transmitter and Qur'an teacher (661–741 AH), wife of the hafiz Jamal al-Din al-Mizzi; she heard from Abu al-Fadl ibn Asakir and taught women the Qur'an until they completed it with her, and Ibn Kathir called her matchless in devotion and in her recitation."
  ur: "دمشق کی ایک محدثہ اور قاریہ (661–741ھ)، حافظ جمال الدین مزی کی اہلیہ؛ انہوں نے ابو الفضل بن عساکر سے سنا، عورتوں کو قرآن سکھایا یہاں تک کہ انہوں نے ان کے پاس ختم کیا، اور ابن کثیر نے کہا کہ عبادت کی کثرت اور قرآن کی عمدہ ادائیگی میں ان کا کوئی ثانی نہ تھا۔"
