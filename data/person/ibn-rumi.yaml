id: person/ibn-rumi
class: person
label: { ar: "ابن الرومي" }
summary:
  ar: "علي بن العباس الشاعر، مدح المعتضد بقصيدته إمام الهدى والبأس والجود أحمد هنيئاً بني العباس إن إمامكم كما بأبي العباس أنشىء ملككم كذا بأبي العباس أيضا يجدد {cite:tarikh-khulafa-minhaj-1434 p. 573}. وعند المسعودي قال في وصول قطر الندى بنت خمارويه للمعتضد يا سيد العرب الذي زفت له باليمن والبركات سيدة العجم {cite:muruj-al-dhahab p. 631}، وعند المسعودي أهلكه القاسم بن عبيد الله بسم في خشكنانجة على ما قيل، وكان من مختلقي معاني الشعراء المجودين في القصير والطويل، ومن محكم شعره رأيت الدهر يجرح ثم يأسو يعوض أو يسلي أو ينسي، وقوله في صاعد بن مخلد إذا تؤذن الدنيا به من زوالها يكون بكاء الطفل ساعة يوضع وإلا فما يبكيه منها وإنها لأفسح مما كان فيه وأوسع {cite:muruj-al-dhahab p. 640-641}"
  en: "Ali ibn al-Abbas, the poet; he praised al-Mu'tadid — 'as your kingship was founded by Abu'l-Abbas, so by Abu'l-Abbas it is renewed' {cite:tarikh-khulafa-minhaj-1434 p. 573}."
