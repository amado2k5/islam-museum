id: person/ibn-rumi
class: person
label: { ar: "ابن الرومي" }
summary:
  ar: "علي بن العباس الشاعر، مدح المعتضد بقصيدته إمام الهدى والبأس والجود أحمد هنيئاً بني العباس إن إمامكم كما بأبي العباس أنشىء ملككم كذا بأبي العباس أيضا يجدد {cite:tarikh-khulafa-minhaj-1434 p. 573}. وعند المسعودي قال في وصول قطر الندى بنت خمارويه للمعتضد يا سيد العرب الذي زفت له باليمن والبركات سيدة العجم {cite:muruj-al-dhahab p. 631}، وعند المسعودي أهلكه القاسم بن عبيد الله بسم في خشكنانجة على ما قيل، وكان من مختلقي معاني الشعراء المجودين في القصير والطويل، ومن محكم شعره رأيت الدهر يجرح ثم يأسو يعوض أو يسلي أو ينسي، وقوله في صاعد بن مخلد إذا تؤذن الدنيا به من زوالها يكون بكاء الطفل ساعة يوضع وإلا فما يبكيه منها وإنها لأفسح مما كان فيه وأوسع {cite:muruj-al-dhahab p. 640-641}"
  en: "Ali ibn al-Abbas, the poet; he praised al-Mu'tadid — 'as your kingship was founded by Abu'l-Abbas, so by Abu'l-Abbas it is renewed' {cite:tarikh-khulafa-minhaj-1434 p. 573}."
  es: "Ali ibn al-Abbas, el poeta, alabó a al-Mu'tadid: «Así como tu reino fue fundado por Abu'l-Abbas, así también por Abu'l-Abbas es renovado» {cite:tarikh-khulafa-minhaj-1434 p. 573}."
  fr: "Ali ibn al-Abbas, le poète; il a fait l'éloge d'al-Mu'tadid — 'comme votre royauté a été fondée par Abu'l-Abbas, ainsi par Abu'l-Abbas elle est renouvelée' {cite:tarikh-khulafa-minhaj-1434 p. 573}."
  ur: "علی ابن العباس، شاعر؛ اس نے المتدد کی تعریف کی - 'جیسا کہ آپ کی بادشاہت کی بنیاد ابو العباس نے رکھی تھی، اسی طرح ابوالعباس نے اس کی تجدید کی'۔ 573}۔"
  tr: "Şair Ali ibn el-Abbas, 'Rehber, cesaret ve cömertlik imamı' şiirinde el-Mu'tadid'i övdü. Ahmed, 'Abbasiler kutsanmıştır. Gerçekten de, imamınız, tıpkı Ebu el-Abbas gibi, krallığınız kuruldu, Ebu Abbas ile de öyle,' diye yenilendi {atıf:Tarikh-khulafa-minhaj-1434, s. 573}. El-Mes'udi'ye göre, Qatr el-Nada bint Humarawayh'in el-Mu'tadid'e gelişiyle ilgili olarak şöyle demiştir: Ey Arapların efendisi, Perslerin Hanımefendisi için bereket ve bereketler almıştır. {alıntı:Muruj-al-Dhahab, s. 631} ve el-Mes'udi'ye göre, el-Kasım bin Ubeyd Allah onu Haşkananca adına yok etmiştir, denildiği gibi. Kısa ve uzun şiirlerde üstün olan şairlerin anlamlarının yaratıcıları arasındaydı. Onun titiz şiirlerinde zamanın yaralandığını, sonra umutsuzluğu, telafi edildiğini, teselli edildiğini ya da unutulduğunu gördüm. Said ibn Mukhlad hakkında sözü: 'Dünya sonu ilan edildiğinde, bir çocuğun ağlaması yerleştirilecek bir saattir; aksi takdirde, onu ağlatan şey, içinde bulunduğu saatten daha geniş ve geniştir.' {atıf:Muruj-al-Dhahab, s. 640-641}"
  id: "Ali ibn al-Abbas, sang penyair, memuji al-Mu'tadid dalam puisinya 'Imam bimbingan, keberanian, dan kemurahan hati.' Ahmad, 'Berbahagialah orang Abbasiyah. Sesungguhnya, Imammu, seperti halnya Abu al-Abbas, kerajaanmu telah didirikan, demikian pula dengan Abu al-Abbas,' memperbarui {cite:Tarikh-khulafa-minhaj-1434, hlm. 573}. Menurut al-Mas'udi, mengenai kedatangan Qatr al-Nada bint Khumarawayh kepada al-Mu'tadid, ia berkata: Wahai tuan orang Arab, yang telah diberkati dengan kemakmuran dan berkah kepada Ibu Persia. {cite:muruj-al-dhahab, hlm. 631}, dan menurut al-Mas'udi, al-Qasim ibn Ubayd Allah menghancurkannya atas nama Khashkananja, seperti yang dikatakan. Ia termasuk di antara pencipta makna para penyair yang unggul dalam puisi pendek maupun panjang. Di antara puisinya yang teliti, saya melihat waktu terluka, lalu putus asa, dikompensasi, dihibur, atau dilupakan. Perkataannya tentang Sa'id ibn Mukhlad: 'Ketika dunia diumumkan tentang akhirnya, tangisan seorang anak adalah waktu yang harus ditentukan; jika tidak, yang membuatnya menangis karenanya, dan itu lebih luas dan lebih luas daripada apa yang ia alami.' {cite:muruj-al-dhahab, hlm. 640-641}"
