label:
  ar: "إبراهيم هندي"
  en: "Ibrahim Hindy"
  ur: "ابراہیم ہندی"
summary:
  ar: "إمام وباحث كندي في ميسيساغا بأونتاريو؛ إمام مركز دار التوحيد الإسلامي، والمدير الديني لفرع يقين كندا في معهد يقين للبحوث الإسلامية، ورئيس مجلس مسلمي بيل. نال شهادة في الدراسات الدينية من جامعة تورونتو وماجستير في أصول الفقه من جامعة المدينة العالمية في ماليزيا، ويقدّم بودكاست مشروع هندي."
  en: "Canadian imam and scholar in Mississauga, Ontario: imam of Dar Al-Tawheed Islamic Centre, Religious Director for Yaqeen Canada at the Yaqeen Institute for Islamic Research, and chairman of the Muslim Council of Peel. He holds a degree in Religious Studies from the University of Toronto and an MA in Usul al-Fiqh from Al-Madinah International University in Malaysia, and hosts The Hindy Project Podcast."
  ur: "مسی ساگا، اونٹاریو میں کینیڈین امام اور عالم؛ دار التوحید اسلامک سینٹر کے امام، یقین انسٹیٹیوٹ میں یقین کینیڈا کے مذہبی ڈائریکٹر، اور مسلم کونسل آف پیل کے چیئرمین۔ انہوں نے یونیورسٹی آف ٹورنٹو سے مذہبی مطالعات میں ڈگری اور ملائیشیا کی المدینہ انٹرنیشنل یونیورسٹی سے اصول الفقہ میں ایم اے کیا ہے، اور «دی ہندی پروجیکٹ پوڈکاسٹ» کے میزبان ہیں۔"
