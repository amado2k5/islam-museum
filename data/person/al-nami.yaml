summary:
  ar: "أبو العباس أحمد بن محمد الدارمي المصيصي المعروف بالنامي؛ الشاعر المشهور؛ كان من الشعراء المفلقين وفحولة شعراء عصره وخواص مدّاح سيف الدولة بن حمدان وكان عنده يلو أبي الطيب المتنبي في المنزلة والرتبة؛ فاضل أديب عارف باللغة والأدب وله آمالي أملاها بحلب روى فيها عن الأخفش وابن درستويه والكرماني والصولي {cite:wafayat-ayan}."
  en: "Al-Nami, Abu al-Abbas Ahmad al-Darimi al-Masisi (d. 399, or 370/1) — foremost panegyrist of Sayf al-Dawla after al-Mutanabbi; philologist whose dictation-sessions at Aleppo carried the Akhfash-Durstuya-Suli line {cite:wafayat-ayan}."
  fr: "Al-Nami, Abu al-Abbas Ahmad al-Darimi al-Masisi (mort en 399, ou 370/1) – panégyrique de Sayf al-Dawla après al-Mutanabbi  ; philologue dont les séances de dictée à Alep ont porté la ligne Akhfash-Durstuya-Suli {cite:wafayat-ayan}."
  es: "Al-Nami, Abu al-Abbas Ahmad al-Darimi al-Masisi (m. 399 o 370/1), principal panegirista de Sayf al-Dawla después de al-Mutanabbi; filólogo cuyas sesiones de dictado en Alepo seguían la línea Akhfash-Durstuya-Suli."
  ur: "النمی، ابو العباس احمد الدارمی المسیسی ⁦(متوفی 399، یا 370/1)⁩ - المتنبی کے بعد سیف الدولہ کا سب سے بڑا علمبردار؛ ماہر فلکیات جن کے حلب میں ڈکٹیشن سیشن میں اخفش-درستویا-سولی لائن {حوالہ: وفایت-عیان} تھی۔"
  tr: "Ebu el-Abbas Ahmed bin Muhammed el-Derimi el-Musaysi, ünlü şair olarak bilinen El-Nami, zamanının seçkin şairleri ve en gururlu şairleri arasındaydı ve Seyf-el-Devle bin Hamdan'ın seçkin övgüsçüsüdür. Ebu el-Tayyib el-Mutanabbi rütbesindeydi; dil ve edebiyatta bilgili seçkin bir edebi figürdü ve Halep'te dikte etti, el-Akhfash, İbn Darstovey, Kurmanci ve el-Suli'den anlatımlar yaptırmıştı."
  id: "Abu al-Abbas Ahmad ibn Muhammad al-Darimi al-Musaysi, yang dikenal sebagai Al-Nami, penyair terkenal, adalah salah satu penyair terkemuka dan penyair paling bangga pada zamannya, serta seorang pujian terkemuka bagi Sayf al-Dawla ibn Hamdan. Ia berada dalam pangkat dan pangkat Abu al-Tayyib al-Mutanabbi; tokoh sastra terkemuka yang mahir dalam bahasa dan sastra, dan ia pernah mendiktekan dikte di Aleppo, yang menceritakan dari al-Akhfash, Ibn Darstowayh, al-Kurmani, dan al-Suli."
