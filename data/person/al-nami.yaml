  ar: "أبو العباس أحمد بن محمد الدارمي المصيصي المعروف بالنامي؛ الشاعر المشهور؛ كان من الشعراء المفلقين وفحولة شعراء عصره وخواص مدّاح سيف الدولة بن حمدان وكان عنده يلو أبي الطيب المتنبي في المنزلة والرتبة؛ فاضل أديب عارف باللغة والأدب وله آمالي أملاها بحلب روى فيها عن الأخفش وابن درستويه والكرماني والصولي {cite:wafayat-ayan}."
  en: "Al-Nami, Abu al-Abbas Ahmad al-Darimi al-Masisi (d. 399, or 370/1) — foremost panegyrist of Sayf al-Dawla after al-Mutanabbi; philologist whose dictation-sessions at Aleppo carried the Akhfash-Durstuya-Suli line {cite:wafayat-ayan}."
