summary:
  ar: زيد بن سهل الأنصاري الخزرجي النجاري، زوج أم سليم؛ مشهور بكنيته، وعدّه ابن حجر من فضلاء الصحابة، وذكره عروة وموسى بن عقبة فيمن شهد العقبة، وذكروه كلهم فيمن شهد بدراً، وكان يرمي بين يدي النبي يوم أحد؛ واختُلف في وفاته بين سنة اثنتين وثلاثين
    وأربع وثلاثين وخمسين.
  en: Zayd ibn Sahl al-Ansari of the Khazraj, from the Najjar, husband of Umm Sulaym. Known by his kunya, Ibn Hajar counts him among the best of the Companions; Urwa and Musa ibn Uqba place him at al-Aqaba, all list him at Badr, and he shot arrows
    before the Prophet at Uhud. His death is dated variously between 32, 34 and about 50 AH.
