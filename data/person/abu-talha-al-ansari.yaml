summary:
  ar: زيد بن سهل الأنصاري الخزرجي النجاري، زوج أم سليم؛ مشهور بكنيته، وعدّه ابن حجر من فضلاء الصحابة، وذكره عروة وموسى بن عقبة فيمن شهد العقبة، وذكروه كلهم فيمن شهد بدراً، وكان يرمي بين يدي النبي يوم أحد؛ واختُلف في وفاته بين سنة اثنتين وثلاثين
    وأربع وثلاثين وخمسين.
  en: Zayd ibn Sahl al-Ansari of the Khazraj, from the Najjar, husband of Umm Sulaym. Known by his kunya, Ibn Hajar counts him among the best of the Companions; Urwa and Musa ibn Uqba place him at al-Aqaba, all list him at Badr, and he shot arrows
    before the Prophet at Uhud. His death is dated variously between 32, 34 and about 50 AH.
  fr: "Zayd ibn Sahl al-Ansari des Khazraj, issu des Najjar, époux d'Umm Sulaym. Connu par sa kunya, Ibn Hajar le compte parmi les meilleurs Compagnons ; Urwa et Musa ibn Uqba le placent à al-Aqaba, tous le comptent à Badr, et il tira des flèches devant le Prophète à Uhud. Sa mort est diversement datée de 32, de 34 ou d'environ 50 H."
  ur: "زید بن سہل خزرجی نجاری، ام سلیم کے شوہر؛ عقبیٰ اور بدر میں شریک رہے اور احد میں نبی کے سامنے تیر چلاتے رہے۔ ان کی وفات کے سال میں روایات مختلف ہیں۔ {cite:ibn-hajar-isaba}"
  es: "Zayd ibn Sahl al-Ansari de Khazraj, originario de Najjar, esposo de Umm Sulaym. Conocido por su kunya, Ibn Hajar lo considera uno de los mejores Compañeros; Urwa y Musa ibn Uqba lo ubican en al-Aqaba, todos lo mencionan en Badr, y disparó flechas ante el Profeta en Uhud. Su muerte se fecha en diferentes fechas, entre el 32, el 34 y alrededor del 50 d. H."
  tr: "Ümmü Süleym'in kocası Zeyd ibn Sahl el-Ensari el-Hazereci el-Necarî; lakabıyla ünlüdür ve İbn Hacer onu Sahabelerin en faziletlilerinden biri olarak kabul etmiştir. Urve ve Musa ibn Ukbe, Akabe Biatına şahit olanlar arasında onu zikretmiş ve hepsi de Bedir Savaşına şahit olanlar arasında onu anmıştır. Uhud günü Peygamber'in önünde ok atardı. Ölümü hakkında otuz iki, otuz dört ve elli yılları arasında ihtilaf vardır."
  id: "Zayd ibn Sahl al-Ansari al-Khazraji al-Najjari, suami Umm Sulaym; ia terkenal dengan julukannya, dan Ibnu Hajar menganggapnya sebagai salah satu Sahabat yang paling berbudi luhur. Urwah dan Musa ibn Uqbah menyebutnya sebagai salah satu saksi Ikrar Aqaba, dan mereka semua menyebutnya sebagai salah satu saksi Perang Badar. Ia biasa menembakkan panah di depan Nabi pada hari Perang Uhud. Terdapat perbedaan pendapat mengenai kematiannya, antara tahun 32, 34, dan 50."
