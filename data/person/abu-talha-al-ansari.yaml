    ar: "أبو طلحة الأنصاري زيد بن سهل، زوج أم سليم؛ شهد العقبة وبدراً، وكان يرمي بين يدي النبي يوم أحد، وعدّه ابن حجر من فضلاء الصحابة."
    en: "Abu Talha al-Ansari, Zayd ibn Sahl, husband of Umm Sulaym, witnessed Aqaba and Badr and shot arrows before the Prophet at Uhud; Ibn Hajar ranks him among the virtuous companions."
    ur: "ابو طلحہ انصاری، زید بن سہل، ام سلیم کے شوہر، عقبہ اور بدر میں شریک تھے اور احد میں نبی کے سامنے تیر چلائے؛ ابن حجر انہیں فاضل صحابہ میں گنتے ہیں۔"
