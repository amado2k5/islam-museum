summary:
  ar: "أستاذة ومؤلفة مصرية وُلدت سنة 1968، رائدة عمل الأمم المتحدة في ربط الدين بالتنمية المستدامة. درست في الجامعة الأمريكية بالقاهرة وجامعة أمستردام، وعملت مستشارة أولى في برنامج الأمم المتحدة الإنمائي وصندوق الأمم المتحدة للسكان، وأسست فريق العمل المشترك بين وكالات الأمم المتحدة المعني بالدين والتنمية، وانتُخبت سنة 2019 أول امرأة وأول مسلمة وأول شخصية من شمال أفريقيا أمينة عامة لمنظمة أديان من أجل السلام، فشغلت المنصب حتى استقالتها في يوليو 2023؛ وهي أستاذة الدين والتنمية في جامعة فريي أمستردام وأستاذة منتسبة في معهد الأنصاري بجامعة نوتردام."
  en: "Egyptian professor and author, born in 1968, who pioneered the United Nations' work linking religion with sustainable development. Educated at the American University in Cairo and the University of Amsterdam, she served as a senior advisor at UNDP and UNFPA, founded the UN Inter-Agency Task Force on Religion and Development, and in 2019 was elected the first woman, first Muslim and first North African secretary general of Religions for Peace, holding the post until her resignation in July 2023; she is professor of religion and development at the Vrije Universiteit Amsterdam and an affiliate professor at Notre Dame's Ansari Institute."
  ur: "مصری پروفیسر اور مصنفہ، جو 1968ء میں پیدا ہوئیں اور جنھوں نے اقوام متحدہ میں مذہب کو پائیدار ترقی سے جوڑنے کے کام کی قیادت کی۔ انھوں نے قاہرہ کی امریکن یونیورسٹی اور یونیورسٹی آف ایمسٹرڈیم سے تعلیم حاصل کی، یو این ڈی پی اور یو این ایف پی اے میں سینئر مشیر رہیں، مذہب و ترقی پر اقوام متحدہ کی بین الایجنسی ٹاسک فورس کی بنیاد رکھی، اور 2019ء میں «ادیان برائے امن» (Religions for Peace) کی پہلی خاتون، پہلی مسلمان اور پہلی شمالی افریقی سیکرٹری جنرل منتخب ہوئیں اور جولائی 2023ء میں استعفے تک اس عہدے پر رہیں؛ وہ ورئیے یونیورسٹی ایمسٹرڈیم میں مذہب و ترقی کی پروفیسر اور نوٹرے ڈیم کے انصاری انسٹی ٹیوٹ میں منسلک پروفیسر ہیں۔"
