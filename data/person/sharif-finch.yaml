  ar: "لاعب كرة قدم أمريكية (وُلد سنة 1995) من كوينز في نيويورك، لعب 53 مباراة مع فريق جامعة تمبل — معادلاً الرقم القياسي في تاريخ الجامعة — ووصل إلى دوري NFL وكيلاً حراً غير مختار في الدرافت مع تينيسي تايتنز سنة 2018، ثم تنقّل بين فرق عدة في الدوري ولعب في XFL وكندا."
