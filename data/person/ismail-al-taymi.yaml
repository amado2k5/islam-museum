summary:
  ar: "الحافظ الكبير قوام السنة أبو القاسم إسماعيل بن محمد التيمي الطلحي الأصبهاني الشافعي؛ قال أبو موسى المديني إمام أئمة وقته وأستاذ علماء عصره وقدوة أهل السنة في زمانه، وأصمت في صفر سنة أربع وثلاثين ثم أفلج؛ وكان إماماً في التفسير والحديث واللغة والأدب عارفاً بالمتون والأسانيد، أملى بجامع أصبهان قريباً من ثلاثة آلاف مجلس، وصنف تفسير الجامع في ثلاثين مجلدة كباراً والإيضاح في أربع مجلدات والموضح في ثلاث والمعتمد في عشر وتفسيراً بالعجمي وكتاب الترغيب والترهيب وشرح صحيحي البخاري ومسلم أتمهما ولده ودلائل النبوة والتذكرة في نحو ثلاثين جزءاً؛ وقال أئمة بغداد ما رحل إلى بغداد بعد أحمد بن حنبل أفضل ولا أحفظ منه؛ ومولده سنة سبع وخمسين وأربعمائة وتوفي بكرة يوم عيد الأضحى سنة خمس وثلاثين وخمسمائة {cite:shadharat-dhahab p. 585-586}."
  en: "The great hafiz Qawam al-Sunna Abu al-Qasim Ismail ibn Muhammad al-Taymi al-Talhi of Isfahan; Abu Musa al-Madini calls him 'imam of the imams of his time, teacher of its scholars, exemplar of the Sunna' — struck mute in Safar 534 then paralysed; imam in tafsir, hadith, language and adab, master of texts and isnads, who dictated nearly three thousand sessions at Isfahan's mosque; his works: the thirty-volume tafsir al-Jami', al-Idah, al-Mawdih, the ten-volume Mu'tamad, a Persian tafsir, al-Targhib wa'l-tarhib, commentaries on both Sahihs (finished by his son), Dala'il al-nubuwwa and the thirty-part Tadhkira; Baghdad's imams said none better-versed nor more retentive had journeyed to Baghdad after Ahmad ibn Hanbal; b. 457, d. the morning of Eid al-Adha 535 {cite:shadharat-dhahab p. 585-586}."
  es: "El gran Hafiz Qawam al-Sunna Abu al-Qasim Ismail ibn Muhammad al-Taymi al-Talhi de Isfahán; Abu Musa al-Madini lo llama 'imán de los imanes de su tiempo, maestro de sus eruditos, ejemplo de la Sunna', quedó mudo en Safar 534 y luego paralizado; imán en tafsir, hadiz, lengua y adab, maestro de textos e isnads, que dictó casi tres mil sesiones en la mezquita de Isfahán; sus obras: el tafsir de treinta volúmenes al-Jami', al-Idah, al-Mawdih, el Mu'tamad de diez volúmenes, un tafsir persa, al-Targhib wa'l-tarhib, comentarios sobre ambos Sahihs (terminados por su hijo), Dala'il al-nubuwwa y el Tadhkira de treinta partes; Los imanes de Bagdad dijeron que nadie mejor versado ni con mejor memoria había viajado a Bagdad después de Ahmad ibn Hanbal; n. 457, m. la mañana de Eid al-Adha 535 {cita: shadharat-dhahab p. 585-586}."
  fr: "Le grand Hafiz Qawam al-Sunna Abu al-Qasim Ismail ibn Muhammad al-Taymi al-Talhi d'Ispahan; Abu Musa al-Madini le qualifie d'« imam des imams de son temps, maître de ses savants, modèle de la Sunna » — frappé de mutisme en Safar 534 puis paralysé; imam en tafsir, hadith, langue et adab, maître des textes et des isnads, qui a dicté près de trois mille sessions à la mosquée d'Ispahan; ses œuvres: le tafsir en trente volumes al-Jami', al-Idah, al-Mawdih, le Mu'tamad en dix volumes, un tafsir persan, al-Targhib wa'l-tarhib, des commentaires sur les deux Sahihs (achevés par son fils), Dala'il al-nubuwwa et le Tadhkira en trente parties; Les imams de Bagdad ont dit qu'aucun homme plus versé ni plus mémorisant n'avait voyagé à Bagdad après Ahmad ibn Hanbal; né en 457, mort le matin de l'Aïd al-Adha 535 {cite: shadharat-dhahab p. 585-586}."
  ur: "عظیم حافظ قوام السنۃ ابو القاسم اسماعیل بن محمد التیمی الطلحی آف اصفہان؛ ابو موسیٰ المدینی اسے 'اپنے زمانے کے ائمہ کا امام، اس کے علماء کا استاد، سنت کا نمونہ' کہتے ہیں - صفر 534 میں گونگا ہو گیا پھر مفلوج ہو گیا۔ تفسیر، حدیث، زبان اور ادب کے امام، نصوص اور اسناد کے ماہر، جو اصفہان کی مسجد میں تقریباً تین ہزار اجلاسوں کا حکم دیتے تھے۔ ان کی تصانیف: تیس جلدوں پر مشتمل تفسیر الجامع، الائدۃ، المودیح، دس جلدوں پر مشتمل معتمد، ایک فارسی تفسیر، الترغیب والترہیب، دونوں صحاح کی تفسیریں ⁦(ان کے بیٹے کی طرف سے ختم)⁩، دلائل النبوۃ اور تذکرہ؛ بغداد کے ائمہ کا کہنا ہے کہ احمد بن حنبل کے بعد کسی نے بھی بغداد کا سفر نہیں کیا اور نہ ہی اس سے زیادہ علم رکھنے والا۔ ب 457، ڈی. عید الاضحی کی صبح 535 585-586}۔"
