summary:
  ar: "الحافظ الكبير قوام السنة أبو القاسم إسماعيل بن محمد التيمي الطلحي الأصبهاني الشافعي؛ قال أبو موسى المديني إمام أئمة وقته وأستاذ علماء عصره وقدوة أهل السنة في زمانه، وأصمت في صفر سنة أربع وثلاثين ثم أفلج؛ وكان إماماً في التفسير والحديث واللغة والأدب عارفاً بالمتون والأسانيد، أملى بجامع أصبهان قريباً من ثلاثة آلاف مجلس، وصنف تفسير الجامع في ثلاثين مجلدة كباراً والإيضاح في أربع مجلدات والموضح في ثلاث والمعتمد في عشر وتفسيراً بالعجمي وكتاب الترغيب والترهيب وشرح صحيحي البخاري ومسلم أتمهما ولده ودلائل النبوة والتذكرة في نحو ثلاثين جزءاً؛ وقال أئمة بغداد ما رحل إلى بغداد بعد أحمد بن حنبل أفضل ولا أحفظ منه؛ ومولده سنة سبع وخمسين وأربعمائة وتوفي بكرة يوم عيد الأضحى سنة خمس وثلاثين وخمسمائة {cite:shadharat-dhahab p. 585-586}."
  en: "The great hafiz Qawam al-Sunna Abu al-Qasim Ismail ibn Muhammad al-Taymi al-Talhi of Isfahan; Abu Musa al-Madini calls him 'imam of the imams of his time, teacher of its scholars, exemplar of the Sunna' — struck mute in Safar 534 then paralysed; imam in tafsir, hadith, language and adab, master of texts and isnads, who dictated nearly three thousand sessions at Isfahan's mosque; his works: the thirty-volume tafsir al-Jami', al-Idah, al-Mawdih, the ten-volume Mu'tamad, a Persian tafsir, al-Targhib wa'l-tarhib, commentaries on both Sahihs (finished by his son), Dala'il al-nubuwwa and the thirty-part Tadhkira; Baghdad's imams said none better-versed nor more retentive had journeyed to Baghdad after Ahmad ibn Hanbal; b. 457, d. the morning of Eid al-Adha 535 {cite:shadharat-dhahab p. 585-586}."
