summary:
  ar: "فيبوناتشي، ويسميه الباحثون في دائرة المعارف الإسلامية ليوناردو البيزي، رياضي أوروبي ألّف سنة 1202م كتابه «ليبر أباتشي» واستعمل فيه الصيغة اللاتينية لمصطلح الجبر والمقابلة. وتقول المقالات إنه أفاد من أبي كامل ومن الهندسة العملية التي نقلها ساڤاسوردا، وإن نظام الكسور المصرية عند العرب وصل إلى أوروبا في جزء منه عن طريقه. ولم تذكر المقالات المقروءة ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 2 p. 386} {cite:encyclopaedia-of-islam-2 vol. 1 p. 152} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  en: "Fibonacci, called Leonardo or Leonard of Pisa in the Encyclopaedia of Islam, was a European mathematician whose Liber abaci of 1202 used the Latin form of the term for al-jabr and al-muqabala. The articles say he drew on Abu Kamil and on the practical geometry passed on through Savasorda, and that the Arab system of Egyptian fractions entered Europe partly through him. The articles read give neither his birth nor his death {cite:encyclopaedia-of-islam-2 vol. 2 p. 386} {cite:encyclopaedia-of-islam-2 vol. 1 p. 152} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  ur: "فبوناچی، جنہیں دائرۃ المعارف الاسلامیہ لیونارڈو یا لیونارڈ آف پیسا کہتی ہے، یورپی ریاضی دان تھے جن کی لیبر اباچی 1202ء میں لکھی گئی اور جس میں الجبر والمقابلہ کی اصطلاح کی لاطینی صورت استعمال ہوئی۔ مضامین کے مطابق انہوں نے ابو کامل اور ساوا سوردا کے ذریعے پہنچی عملی ہندسہ سے فائدہ اٹھایا، اور عربوں کا مصری کسور کا نظام جزوی طور پر ان کے ذریعے یورپ پہنچا۔ پڑھے گئے مضامین ان کی ولادت اور وفات کا ذکر نہیں کرتے {cite:encyclopaedia-of-islam-2 vol. 2 p. 386} {cite:encyclopaedia-of-islam-2 vol. 1 p. 152} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
