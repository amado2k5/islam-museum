summary:
  ar: "الحافظ الزاهد؛ أحد من عني بشأن الحديث، وكتب عن سبعمائة شيخ بالشام والجزيرة ومصر، وما زال في طلب الحديث وإفادته وتخريجه إلى آخر أيامه، وكان من الثقات الأثبات؛ كان أبوه مولى للظاهر غازي بن يوسف {cite:shadharat-dhahab p. 759-760}."
  tr: "Zahi ezberci; hadisle ilgilenenlerden biri. Levant, Arap Yarımadası ve Mısır'da yaklaşık yedi yüz şeyh yazdı ve hadisi aramaya, sağlamaya ve son günlerine kadar doğrulamaya devam etti. Güvenilir ve itibarlı kaynaklar arasındaydı; babası el-Zahir Gazi ibn Yusuf'un özgür bir adamıydı {atıf: shadharat-dhahab, s. 759-760}."
  id: "Seorang pengapal asketik; salah satu yang peduli dengan hadis. Ia menulis sekitar tujuh ratus sheikh di Levant, Semenanjung Arab, dan Mesir, dan terus mencari hadits, menyediakannya, dan mengotentifikasinya hingga hari-hari terakhirnya. Ia termasuk di antara sumber yang dapat dipercaya dan dapat diandalkan; ayahnya adalah mantan al-Zahir Ghazi ibn Yusuf {cite:shadharat-dhahab, hlm. 759-760}."
