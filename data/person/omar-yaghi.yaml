summary:
  ar: "كيميائي أردني أمريكي من أصل فلسطيني، وُلد في عمّان سنة 1965 لأسرة لاجئة من قرية المسمية، أسس علم الكيمياء الشبكية وطوّر الأطر الفلزية العضوية والأطر العضوية التساهمية، ونال جائزة نوبل في الكيمياء سنة 2025 بالمشاركة مع سوسومو كيتاغاوا وريتشارد روبسون، وانتقل سنة 2026 إلى جامعة تسينغهوا في الصين لقيادة معهد جديد للذكاء الاصطناعي وعلم المواد."
  en: "Jordanian-American chemist of Palestinian origin, born in Amman in 1965 to a refugee family from al-Masmiya, who founded reticular chemistry and developed metal–organic frameworks and covalent organic frameworks, shared the 2025 Nobel Prize in Chemistry with Susumu Kitagawa and Richard Robson, and moved in 2026 to Tsinghua University in China to lead a new institute for AI and materials science."
  ur: "فلسطینی الاصل اردنی۔امریکی کیمیا دان، جو 1965 میں عمان میں گاؤں المسمية کے مہاجر خاندان میں پیدا ہوئے، جنہوں نے شبکی کیمیا (ریٹیکولر کیمسٹری) کی بنیاد رکھی اور دھاتی۔نامیاتی ڈھانچے تیار کیے، 2025 میں کیمیا کا نوبل انعام سوسومو کیتاگاوا اور رچرڈ روبسن کے ساتھ مشترکہ طور پر پایا، اور 2026 میں چین کی چھنگہوا یونیورسٹی منتقل ہو گئے۔"
