label: { ar: "المسيب بن نجبة الفزاري", en: "al-Musayyib ibn Najaba al-Fazari", fr: "al-Musayyib ibn Najaba al-Fazari", es: "al-Musayyib ibn Najaba al-Fazari", ur: "المصیب ابن نجبہ الفزاری" }
summary:
  ar: "عند البلاذري: كان له حمران بن أبان التمري من سبي عين التمر فاشتراه عثمان منه فأعتقه ثم وجهه إلى الكوفة للمسألة عن عامله فكذبه فأخرجه من جواره فنزل البصرة. وأخذ راية التوابين بعد استشهاد سليمان بن صرد بعين الوردة وكان من وجوه أصحاب علي وكر على القوم وهو يقول قد علمت ميالة الذوائب واضحة اللبات والترائب {cite:muruj-al-dhahab p. 88}"
  en: "In al-Baladhuri: Humran ibn Aban al-Tamri of Ayn al-Tamr's captives belonged to him; Uthman bought Humran from him and freed him — then sent him to Kufa to ask about his agent, who denied him and expelled him from protection, so he settled Basra."
  fr: "Dans al-Baladhuri : Humran ibn Aban al-Tamri des captifs d'Ayn al-Tamr lui appartenait ; Uthman lui a acheté Humran et l'a libéré - puis l'a envoyé à Kufa pour s'enquérir de son agent, qui l'a nié et l'a expulsé de la protection, alors il s'est installé Basra."
  es: "En al-Baladhuri: Humran ibn Aban al-Tamri, de entre los cautivos de Ayn al-Tamr, le pertenecía; Uthman le compró a Humran y lo liberó, luego lo envió a Kufa para preguntar por su agente, quien lo negó y lo expulsó de su protección, por lo que se estableció en Basora."
  ur: "البلادوری میں ہے: عین التمر کے اسیروں میں سے حمران بن ابان التمری اس کا تھا۔ عثمان نے حمران کو اس سے خرید لیا اور اسے آزاد کر دیا - پھر اسے اپنے ایجنٹ کے بارے میں پوچھنے کے لیے کوفہ بھیجا، جس نے اسے جھٹلایا اور اسے تحفظ سے نکال دیا، چنانچہ اس نے بصرہ کو آباد کیا۔"
  tr: "el-Baladhuri'ye göre: Hamran ibn Aban al-Tamri'yi Ayn el-Tamr'ın esiri olarak tutmuştu, bu yüzden Osman onu satın alıp serbest bıraktı. Sonra onu Kufa'ya gönderip vekilini sormaya çalıştı, ancak onu reddetti, mahallesinden kovdu ve Basra'ya yerleşti. Süleyman bin Sürd'ün Ayn el-Varda'da şehit edilmesinden sonra Tevabin bayrağını aldı. Ali'nin önde gelen yoldaşlarından biriydi, halk üzerinde bir kaleydi ve şöyle dedi: 'Kurtların berrak iplikler ve tozlarla berrak olma eğilimini öğrendim.' {alıntı:Muruj-al-Dhahab, s. 88}"
  id: "Menurut al-Baladhuri: Ia telah menjadikan Hamran ibn Aban al-Tamri sebagai tawanan Ain al-Tamr, sehingga Uthman membelinya dan membebaskannya. Ia kemudian mengirimnya ke Kufa untuk menanyakan tentang agennya, tetapi ia menolak dan mengusirnya dari lingkungannya dan menetap di Basra. Ia mengambil panji Tawabin setelah syahid Sulayman ibn Surd di Ain al-Warda. Ia termasuk di antara sahabat terkemuka Ali, benteng di atas rakyat, dan ia berkata, 'Aku telah belajar kecenderungan serigala untuk menjadi jernih, dengan benang dan debu yang jernih.' {sitasi: Muruj-al-Dhahab, hlm. 88}"
