summary:
  ar: "عند البلاذري: كان له حمران بن أبان التمري من سبي عين التمر فاشتراه عثمان منه فأعتقه ثم وجهه إلى الكوفة للمسألة عن عامله فكذبه فأخرجه من جواره فنزل البصرة. وأخذ راية التوابين بعد استشهاد سليمان بن صرد بعين الوردة وكان من وجوه أصحاب علي وكر على القوم وهو يقول قد علمت ميالة الذوائب واضحة اللبات والترائب {cite:muruj-al-dhahab p. 88}"
  en: "In al-Baladhuri: Humran ibn Aban al-Tamri of Ayn al-Tamr's captives belonged to him; Uthman bought Humran from him and freed him — then sent him to Kufa to ask about his agent, who denied him and expelled him from protection, so he settled Basra."
