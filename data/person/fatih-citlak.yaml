summary:
  ar: "كاتب ومقدّم تلفزيوني تركي في موضوعات التصوف، وُلد سنة 1966 في حي الفاتح بإسطنبول، درس في ثانوية الفاتح للإمام الخطيب وقسم التركولوجيا بجامعة مرمرة، وألّف كتبًا في الإسلام والتصوف، وقدّم برامج إذاعية وتلفزيونية منها قراءات المثنوي وبرامج السحور، وهو رئيس دراويش فرقة إسطنبول للموسيقى التركية التاريخية التابعة لوزارة الثقافة. بلغت قناته على يوتيوب 141,000 مشترك كما في 16 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish author and television presenter on Sufi topics, born in 1966 in Istanbul's Fatih district. He studied at Fatih Imam Hatip High School and Marmara University's Turkology department, wrote books on Islam and Sufism, presented radio and television programmes including Mesnevi readings and sahur programmes, and is the head of the dervishes of the Istanbul Historical Turkish Music Ensemble affiliated with the Ministry of Culture. His YouTube channel counted 141,000 subscribers as of 16 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "تصوف کے موضوعات پر ترک مصنف اور ٹیلی ویژن میزبان، جو 1966ء میں استنبول کے ضلع فاتح میں پیدا ہوئے، فاتح امام خطیب ہائی سکول اور مرمرہ یونیورسٹی کے شعبۂ ترکولوجی میں پڑھا، اسلام اور تصوف پر کتابیں لکھیں، مثنوی خوانی اور سحری پروگرام پیش کیے، اور استنبول تاریخی ترک موسیقی جماعت کے درویشوں کے سربراہ ہیں۔ vidIQ کے مطابق 16 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 141,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Autor y presentador de televisión turco especializado en temas sufíes, nacido en 1966 en el distrito de Fatih, Estambul. Estudió en el Liceo Fatih Imam Hatip y en el departamento de Turcología de la Universidad de Marmara. Ha escrito libros sobre el islam y el sufismo, ha presentado programas de radio y televisión, incluyendo lecturas de Mesnevi y programas de sahur, y dirige a los derviches del Conjunto Histórico de Música Turca de Estambul, afiliado al Ministerio de Cultura. Su canal de YouTube contaba con 141.000 suscriptores al 16 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por el museo)."
  fr: "Écrivain et présentateur de télévision turc spécialisé dans le soufisme, né en 1966 dans le quartier de Fatih à Istanbul. Il a étudié au lycée Imam Hatip de Fatih et au département de turcologie de l'université de Marmara. Auteur d'ouvrages sur l'islam et le soufisme, il a animé des émissions de radio et de télévision, notamment des lectures de Mesnevi et des programmes de sahur. Il dirige également les derviches de l'Ensemble de musique historique turque d'Istanbul, affilié au ministère de la Culture. Sa chaîne YouTube comptait 141 000 abonnés au 16 novembre 2026, selon vidIQ – un chiffre ancien, non vérifié par un musée."
