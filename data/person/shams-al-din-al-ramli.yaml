gender: male
summary:
  ar: محمد بن أحمد بن حمزة، شمس الدين الرملي، فقيه الديار المصرية في عصره ومرجعها في الفتوى، يقال له الشافعي الصغير، ولد ومات بالقاهرة، صاحب «نهاية المحتاج إلى شرح المنهاج»، 919 إلى 1004 هـ.
  en: Muhammad ibn Ahmad ibn Hamza, Shams al-Din al-Ramli, the jurist of the Egyptian lands in his time and their authority for fatwa, called al-Shafi'i al-Saghir; born and died in Cairo, author of 'Nihayat al-Muhtaj ila Sharh al-Minhaj', 919 to 1004 AH.
  es: "Muhammad ibn Ahmad ibn Hamza, Shams al-Din al-Ramli, jurista de las tierras egipcias en su tiempo y su autoridad para la fatwa, llamado al-Shafi'i al-Saghir; nacido y muerto en El Cairo, autor de 'Nihayat al-Muhtaj ila Sharh al-Minhaj', 919 a 1004 AH."
  fr: "Muhammad ibn Ahmad ibn Hamza, Shams al-Din al-Ramli, le juriste des terres égyptiennes de son temps et leur autorité en matière de fatwa, appelé al-Shafi'i al-Saghir; né et mort au Caire, auteur de 'Nihayat al-Muhtaj ila Sharh al-Minhaj', 919 à 1004 AH."
  ur: "محمد بن احمد بن حمزہ، شمس الدین الرملی، اپنے زمانے میں مصری سرزمین کے فقیہ اور فتویٰ کے لیے ان کا اختیار، جسے الشافعی الصغیر کہا جاتا ہے؛ \"نہایت المحتاج الاشارۃ المنہاج\" کے مصنف، 919 تا 1004 ہجری قاہرہ میں پیدا ہوئے اور وفات پائی۔"
