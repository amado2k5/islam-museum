id: person/dawud-ibn-isa
class: person
label: { ar: "داود بن عيسى أمير مكة", en: "Dawud ibn Isa, amir of Mecca", es: "Dawud ibn Isa, amir of Mecca", fr: "Dawud ibn Isa, amir of Mecca", ur: "داؤد بن عیسیٰ، امیر مکہ" }
summary:
  ar: "داود بن عيسى أخو الأمير مكثر؛ أمر الخليفة بإقامته مقام أخيه في إمارة مكة لبناء مكثر قلعة على جبل أبي قبيس، فولي الإمارة بعد فتنة ذي الحجة سنة إحدى وسبعين وخمسمائة وهروب مكثر من المدينة {cite:kamil-ibn-al-athir p. 77-78}."
  en: "Dawud ibn Isa — installed in Mecca's emirate by caliphal order when his brother Mukaththir was besieged in his Abu Qubays castle and fled, Dhu al-Hijja 571 {cite:kamil-ibn-al-athir p. 77-78}."
  es: "Dawud ibn Isa — instalado en el emirato de La Meca por orden del califa cuando su hermano Mukaththir fue asediado en su castillo de Abu Qubays y huyó, Dhu al-Hijja 571 {cite:kamil-ibn-al-athir p. 77-78}."
  fr: "Dawud ibn Isa — installé dans l'émirat de La Mecque par ordre califal lorsque son frère Mukaththir fut assiégé dans son château d'Abu Qubays et s'enfuit, Dhu al-Hijja 571 {cite:kamil-ibn-al-athir p. 77-78}."
  ur: "داؤد بن عیسیٰ - کو خلیفہ کے حکم سے مکہ کی امارت میں اس وقت نصب کیا گیا جب اس کے بھائی مقتدر کو اس کے ابو قبیس قلعے میں محصور کر کے فرار ہو گئے تھے، ذی الحجہ 571 {حوالہ: کامل ابن الثیر ص۔ 77-78}۔"
  tr: "Emiri Mukathir'in kardeşi Davud bin İsa; halife, kardeşinin ikametgahının Mekke emirliğinde kurulmasını emretti; böylece Mukathir için Ebu Kubey Dağı'nda bir kale inşa edildi. 571 Hicri yılındaki Dhu al-Hijjah kargaşasından sonra emirliği devraldı ve Mukathir Medine'den kaçtıktan sonra {cite:kamil-ibn-al-athir s. 77-78}"
  id: "Dawud ibn Isa, saudara Emir Mukathir; khalifah memerintahkan agar kediaman saudaranya didirikan di kediaman Mekah untuk membangun benteng Mukathir di Gunung Abu Qubays. Ia mengambil alih kebangkitan setelah gejolak Dhu al-Hijjah pada tahun 571 H, dan setelah Mukathir melarikan diri dari Madinah {cite:kamil-ibn-al-athir hlm. 77-78}."
