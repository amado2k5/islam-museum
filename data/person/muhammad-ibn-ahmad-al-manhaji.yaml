summary:
  ar: "محمد بن أحمد بن علي بن عبد الخالق، شمس الدين، الأسيوطي ثم القاهري الشافعي المنهاجي، فقيه أديب، ولد بأسيوط، وحفظ القرآن عند سعد الدين الواجي، وقرأ الفقه على الزكي الميدومي وابن عبد الرحيم والبدر بن الخلال. (٨٨٠-٨١٣ه، كما طبع). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  en: "Muhammad ibn Ahmad ibn Ali ibn Abd al-Khaliq, Shams al-Din, al-Asyuti then al-Qahiri, a Shafi'i jurist and man of letters, called al-Manhaji. Born in Asyut, he learned the Qur'an by heart under Sa'd al-Din al-Wajiyy, and studied fiqh with al-Zaki al-Maydumi and al-Badr ibn al-Khallal. The dates as printed are 880 to 813 H, given as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
