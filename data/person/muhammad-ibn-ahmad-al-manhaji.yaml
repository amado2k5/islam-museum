summary:
  ar: "محمد بن أحمد بن علي بن عبد الخالق، شمس الدين، الأسيوطي ثم القاهري الشافعي المنهاجي، فقيه أديب، ولد بأسيوط، وحفظ القرآن عند سعد الدين الواجي، وقرأ الفقه على الزكي الميدومي وابن عبد الرحيم والبدر بن الخلال. ⁦(٨٨٠-٨١٣ه، كما طبع)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  en: "Muhammad ibn Ahmad ibn Ali ibn Abd al-Khaliq, Shams al-Din, al-Asyuti then al-Qahiri, a Shafi'i jurist and man of letters, called al-Manhaji. Born in Asyut, he learned the Qur'an by heart under Sa'd al-Din al-Wajiyy, and studied fiqh with al-Zaki al-Maydumi and al-Badr ibn al-Khallal. The dates as printed are 880 to 813 H, given as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  es: "Muhammad ibn Ahmad ibn Ali ibn Abd al-Khaliq, Shams al-Din, al-Asyuti y luego al-Qahiri, jurista y hombre de letras shafií, llamado al-Manhaji. Nacido en Asyut, aprendió el Corán de memoria con Sa'd al-Din al-Wajiyy y estudió fiqh con al-Zaki al-Maydumi y al-Badr ibn al-Khallal. Las fechas impresas son de 880 a 813 H, tal como están impresas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  fr: "Muhammad ibn Ahmad ibn Ali ibn Abd al-Khaliq, Shams al-Din, al-Asyuti puis al-Qahiri, juriste shafi'ite et homme de lettres, appelé al-Manhaji. Né à Assiout, il apprit le Coran par cœur sous Sa'd al-Din al-Wajiyy et étudia le fiqh avec al-Zaki al-Maydumi et al-Badr ibn al-Khallal. Les dates telles qu'imprimées sont de 880 à 813 H, données telles qu'imprimées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
