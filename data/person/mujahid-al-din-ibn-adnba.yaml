  ar: "والي دمشق، كان عاقلاً فاضلاً؛ بنى الخانقاه المجاهدية بدمشق على الشرف القبلي، وله نظم منها: «أشبهك الغصن في خصال القد واللين والتثنّى * لكن تجنيك ما حكاه الغصن يجنى وأنت تجنى» {cite:shadharat-dhahab p. 272-273}."
  en: "Wali of Damascus (d. 654) — builder of the Khanqah al-Mujahidiyya on the southern ridge, where he lies buried; a sensible, virtuous governor and a poet {cite:shadharat-dhahab p. 272-273}."
  es: "Wali de Damasco (m. 654) — constructor de la Khanqah al-Mujahidiyya en la cresta sur, donde yace enterrado; un gobernador sensato y virtuoso y un poeta {cite:shadharat-dhahab p. 272-273}."
  fr: "Wali de Damas (mort en 654) — constructeur de la Khanqah al-Mujahidiyya sur la crête sud, où il est enterré; un gouverneur sensé et vertueux et un poète {cite: shadharat-dhahab p. 272-273}."
  ur: "ولی آف دمشق ⁦(وفات 654)⁩ - خانقاہ المجاہدیہ کے جنوبی کنارے پر تعمیر کرنے والا، جہاں وہ دفن ہے۔ ایک سمجھدار، نیک گورنر اور شاعر 272-273}۔"
