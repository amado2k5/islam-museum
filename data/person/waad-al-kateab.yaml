summary:
  ar: "وعد الخطيب ⁦(وُلدت نحو ١٩٩١)⁩ هو الاسم المستعار لصحفية ومخرجة سورية وثّقت حصار حلب خمس سنوات للقناة الرابعة البريطانية، ونالت عن تغطيتها جائزة إيمي الدولية، وأخرجت مع إدوارد واتس الفيلم الوثائقي «من أجل سما» ⁦(٢٠١٩)⁩ الفائز بجائزة بافتا لأفضل وثائقي والمرشح للأوسكار؛ تقيم في المملكة المتحدة منذ فرارها من حلب سنة ٢٠١٦، وأدرجتها تايم في قائمة المئة الأكثر تأثيرًا سنة ٢٠٢٠."
  en: "Waad Al-Kateab (born c. 1991) is the pseudonym of a Syrian journalist and filmmaker who documented the siege of Aleppo for five years for Channel 4 News, winning an International Emmy for her reporting, and co-directed the documentary For Sama (2019), which won the BAFTA for Best Documentary and was nominated for an Academy Award; she has lived in the United Kingdom since fleeing Aleppo in 2016 and was named to the Time 100 in 2020."
  ur: "وعد الخطیب (پیدائش تقریباً 1991) ایک سوری صحافی و فلم ساز کا تخلصی نام ہے جنھوں نے پانچ برس حلب کے محاصرے کی چینل 4 نیوز کے لیے دستاویزی رپورٹنگ کی، بین الاقوامی ایمی جیتا، اور دستاویزی فلم «فور سما» (2019) بنائی جو بافٹا جیت کر آسکر کے لیے نامزد ہوئی؛ وہ 2016 سے برطانیہ میں مقیم ہیں اور 2020 میں ٹائم 100 میں شامل ہوئیں۔"
