summary:
  ar: "السري الرفا الشاعر كان جارا لأبي الحسن علي بن عيسى الرماني بسوق العطش وكان كثيرا ما يجتاز به وهو جالس على باب داره فيستجلسه ويحادثه، وكان سري يتشيع فلما طال ذلك على الرماني أنشد قصيدته في حب الوصي {cite:fihrist-ibn-al-nadim p. 530}."
  en: "Al-Sari al-Raffa — the Shi'i poet of Suq al-Atash {cite:fihrist-ibn-al-nadim}"
