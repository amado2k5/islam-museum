summary:
  ar: "عالمة فيزياء فلكية تركية. تعلمت في جامعة بيلكنت وجامعة تكساس التقنية وجامعة مينيسوتا (دكتوراه 2017)، واكتشفت المجرة ذات الحلقتين PGC 1000714 الملقبة «مجرة بورتشين»، وعملت زميلة باحثة في جامعتي أريزونا وشيكاغو، وهي أستاذة مساعدة في كلية دارتموث منذ سنة 2022. اختيرت زميلة TED سنة 2018."
  en: "Turkish astrophysicist. Educated at Bilkent University, Texas Tech University and the University of Minnesota (PhD 2017), she discovered the double-ringed galaxy PGC 1000714, nicknamed 'Burçin's Galaxy', held research fellowships at the University of Arizona and the University of Chicago, and has been an assistant professor at Dartmouth College since 2022. She was a TED Fellow in 2018."
  ur: "ترکی ماہر فلکی طبیعیات۔ انہوں نے بلکنٹ یونیورسٹی، ٹیکساس ٹیک یونیورسٹی اور یونیورسٹی آف مینیسوٹا سے تعلیم حاصل کی (پی ایچ ڈی 2017ء)، دوہری حلقوں والی کہکشاں PGC 1000714 دریافت کی جسے «برچن کی کہکشاں» کہا جاتا ہے، یونیورسٹی آف ایریزونا اور یونیورسٹی آف شکاگو میں تحقیقی فیلوشپ رہیں، اور 2022ء سے ڈارٹماؤتھ کالج میں اسسٹنٹ پروفیسر ہیں۔ وہ 2018ء میں TED فیلو منتخب ہوئیں۔"
