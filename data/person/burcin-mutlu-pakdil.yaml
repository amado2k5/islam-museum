summary:
  ar: "عالمة فيزياء فلكية تركية. تعلمت في جامعة بيلكنت وجامعة تكساس التقنية وجامعة مينيسوتا ⁦(دكتوراه 2017)⁩، واكتشفت المجرة ذات الحلقتين PGC 1000714 الملقبة «مجرة بورتشين»، وعملت زميلة باحثة في جامعتي أريزونا وشيكاغو، وهي أستاذة مساعدة في كلية دارتموث منذ سنة 2022. اختيرت زميلة TED سنة 2018."
  en: "Turkish astrophysicist. Educated at Bilkent University, Texas Tech University and the University of Minnesota (PhD 2017), she discovered the double-ringed galaxy PGC 1000714, nicknamed 'Burçin's Galaxy', held research fellowships at the University of Arizona and the University of Chicago, and has been an assistant professor at Dartmouth College since 2022. She was a TED Fellow in 2018."
  ur: "ترکی ماہر فلکی طبیعیات۔ انہوں نے بلکنٹ یونیورسٹی، ٹیکساس ٹیک یونیورسٹی اور یونیورسٹی آف مینیسوٹا سے تعلیم حاصل کی ⁦(پی ایچ ڈی 2017ء)⁩، دوہری حلقوں والی کہکشاں PGC 1000714 دریافت کی جسے «برچن کی کہکشاں» کہا جاتا ہے، یونیورسٹی آف ایریزونا اور یونیورسٹی آف شکاگو میں تحقیقی فیلوشپ رہیں، اور 2022ء سے ڈارٹماؤتھ کالج میں اسسٹنٹ پروفیسر ہیں۔ وہ 2018ء میں TED فیلو منتخب ہوئیں۔"
  es: "Astrofísica turca. Se formó en la Universidad de Bilkent, la Universidad Tecnológica de Texas y la Universidad de Minnesota (doctorado en 2017). Descubrió la galaxia de doble anillo PGC 1000714, apodada \"Galaxia de Burçin\". Fue becaria de investigación en la Universidad de Arizona y la Universidad de Chicago, y es profesora asistente en el Dartmouth College desde 2022. Fue becaria TED en 2018."
  fr: "Astrophysicienne turque, diplômée de l'Université Bilkent, de l'Université Texas Tech et de l'Université du Minnesota (doctorat en 2017), elle a découvert la galaxie à double anneau PGC 1000714, surnommée « galaxie de Burçin », a bénéficié de bourses de recherche à l'Université d'Arizona et à l'Université de Chicago, et est professeure adjointe au Dartmouth College depuis 2022. Elle a été boursière TED en 2018."
  tr: "Türk astrofizikçi. Bilkent Üniversitesi, Texas Tech Üniversitesi ve Minnesota Üniversitesi'nde (PhD 2017) eğitim gördü, 'Porchin Galaksisi' lakabını 1000714 iki halkalı PGC galaksisini keşfetti. Arizona ve Chicago Üniversitelerinde araştırma görevlisi olarak çalıştı ve 2022'den beri Dartmouth College'da yardımcı doçent olarak görev yapıyor. 2018 yılında TED Bursiyeri olarak seçildi."
  id: "Astrofisikawan Turki. Ia belajar di Bilkent University, Texas Tech University, dan University of Minnesota (PhD 2017), menemukan galaksi PGC dua cincin 1000714 dijuluki 'Porchin Galaxy.' Ia bekerja sebagai peneliti di Universitas Arizona dan Chicago, dan telah menjadi asisten profesor di Dartmouth College sejak 2022. Ia terpilih sebagai TED Fellow pada tahun 2018."
