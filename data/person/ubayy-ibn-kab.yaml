summary:
  ar: «سيد القراء» من الأنصار، من أصحاب العقبة الثانية وشهد بدراً والمشاهد كلها؛ قال له النبي إن الله أمره أن يقرأ عليه، وكان عمر يسميه سيد المسلمين؛ وفي تاريخ وفاته أقوال بين سنة 19هـ و32هـ يرجح ابن حجر وأبو نعيم أنها في خلافة عثمان.
  en: The 'master of the reciters' among the Ansar, present at the second pledge of al-Aqaba, at Badr and in all the campaigns; the Prophet told him that God had commanded him to recite to him, and Umar called him the master of the Muslims; the
    date of his death is given from 19 AH to 32 AH, and Abu Nu'aym favours the caliphate of Uthman.
