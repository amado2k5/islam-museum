label:
  ar: أبي بن كعب، وعند ابن النديم أن تأليف السور في قراءته كان بالبصرة في قرية الأنصار عند محمد بن عبد الملك الأنصاري وأن مصحفه مائة وست عشرة سورة فيها سورتا الخلع والحفد وأن جميع آي القرآن في قوله ستة آلاف ومائتان وعشر آيات {cite:fihrist-ibn-al-nadim p. 67-68}
  en: Ubayy ibn Ka'b
