summary:
  ar: "محمد بن عجلان المدني (ت 148هـ)، يصفه الذهبي في «ميزان الاعتدال» بإمام صدوق مشهور، روى عن أبيه والمقبري، وعنه مالك وشعبة والقطان، ووثقه أحمد وابن معين وابن عيينة وأبو حاتم، وأخرج له مسلم ثلاثة عشر حديثاً كلها شواهد، وتكلم المتأخرون في سوء حفظه، واضطرب في حديث نافع وفي التمييز بين روايات سعيد المقبري عن أبيه وعن أبي هريرة. وكان من أهل الفتوى له حلقة في المسجد النبوي، وخرج مع محمد بن عبد الله بن حسن فعفا عنه والي المدينة {cite:mizan-itidal-bijawi-v3 p. 644-647}."
  en: "Muhammad ibn Ajlan of Medina (d. 148 AH), described by al-Dhahabi in Mizan al-I'tidal as a truthful, well-known imam who narrated from his father and al-Maqburi, with Malik, Shu'ba and al-Qattan narrating from him; Ahmad, Ibn Ma'in, Ibn Uyayna and Abu Hatim declared him trustworthy, Muslim cites thirteen of his hadiths, all as supporting reports, and later critics spoke of his weak memory — his confusion in Nafi''s hadith and in keeping apart Sa'id al-Maqburi's reports from his father and from Abu Hurayra. He gave fatwas and held a circle in the Prophet's Mosque, and joined the revolt of Muhammad ibn Abd Allah ibn Hasan, after which the governor of Medina pardoned him."
