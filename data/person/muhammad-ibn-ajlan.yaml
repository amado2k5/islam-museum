summary:
  ar: "محمد بن عجلان المدني ⁦(ت 148هـ)⁩، يصفه الذهبي في «ميزان الاعتدال» بإمام صدوق مشهور، روى عن أبيه والمقبري، وعنه مالك وشعبة والقطان، ووثقه أحمد وابن معين وابن عيينة وأبو حاتم، وأخرج له مسلم ثلاثة عشر حديثاً كلها شواهد، وتكلم المتأخرون في سوء حفظه، واضطرب في حديث نافع وفي التمييز بين روايات سعيد المقبري عن أبيه وعن أبي هريرة. وكان من أهل الفتوى له حلقة في المسجد النبوي، وخرج مع محمد بن عبد الله بن حسن فعفا عنه والي المدينة {cite:mizan-itidal-bijawi-v3 p. 644-647}."
  en: "Muhammad ibn Ajlan of Medina (d. 148 AH), described by al-Dhahabi in Mizan al-I'tidal as a truthful, well-known imam who narrated from his father and al-Maqburi, with Malik, Shu'ba and al-Qattan narrating from him; Ahmad, Ibn Ma'in, Ibn Uyayna and Abu Hatim declared him trustworthy, Muslim cites thirteen of his hadiths, all as supporting reports, and later critics spoke of his weak memory — his confusion in Nafi''s hadith and in keeping apart Sa'id al-Maqburi's reports from his father and from Abu Hurayra. He gave fatwas and held a circle in the Prophet's Mosque, and joined the revolt of Muhammad ibn Abd Allah ibn Hasan, after which the governor of Medina pardoned him."
  es: "Muhammad ibn Ajlan de Medina (m. 148 AH), descrito por al-Dhahabi en Mizan al-I'tidal como un imán veraz y conocido que narraba de su padre y de al-Maqburi, con Malik, Shu'ba y al-Qattan narrando de él; Ahmad, Ibn Ma'in, Ibn Uyayna y Abu Hatim lo declararon digno de confianza, Muslim cita trece de sus hadices, todos como informes de apoyo, y críticos posteriores hablaron de su mala memoria: su confusión en el hadiz de Nafi y al separar los informes de Sa'id al-Maqburi de su padre y de Abu Hurayra. Emitió fatuas y dirigió un círculo en la Mezquita del Profeta, y se unió a la revuelta de Muhammad ibn Abd Allah ibn Hasan, después de lo cual el gobernador de Medina lo perdonó."
  fr: "Muhammad ibn Ajlan de Médine (mort en 148 AH), décrit par al-Dhahabi dans Mizan al-I'tidal comme un imam véridique et renommé, transmettant des hadiths de son père et d'al-Maqburi, également transmis par Malik, Shu'ba et al-Qattan, fut déclaré digne de confiance par Ahmad, Ibn Ma'in, Ibn Uyayna et Abu Hatim. Muslim cite treize de ses hadiths, tous comme sources à l'appui de son autorité. Des critiques postérieures ont souligné sa mémoire défaillante, notamment sa confusion concernant le hadith de Nafi' et sa difficulté à distinguer les hadiths de Sa'id al-Maqburi attribués à son père et à Abu Hurayra. Il émettait des fatwas, animait des cercles à la Mosquée du Prophète et participa à la révolte de Muhammad ibn Abd Allah ibn Hasan, après quoi le gouverneur de Médine le gracia."
