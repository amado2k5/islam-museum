id: person/al-wathiq
class: person
label: { ar: "الواثق بالله", en: "al-Wathiq" }
summary:
  ar: "هارون الواثق بالله بن المعتصم، تاسع خلفاء بني العباس؛ عند البلاذري: كان بعض العمال قد ألزم الجراجمة بأنطاكية جزية رؤوسهم — وهم أهل عهد خدمة لا جزية — فرفعوا ذلك إليه وهو خليفة فأمر بإسقاطها عنهم، ثم جاء المتوكل فأمر بأخذها منهم مع إجراء الأرزاق عليهم وعند السيوطي بويع له في تاسع عشر ربيع الأول سنة سبع وعشرين وكان يسمى المأمون الأصغر لأدبه وفضله وكان أعلم الخلفاء بالغناء وله أصوات وألحان عملها نحو مئة صوت وحاذق بضرب العود وأروى الخلفاء للشعر ولم يكن في خلفاء بني العباس أحلم منه ولا أصبر على أذى، وكان له خوان من ذهب مؤلف من أربع قطع تحمل كل قطعة عشرون رجلاً فسأله ابن أبي دؤاد ألا يأكل عليه فأمر أن يكسر ويضرب ويحمل إلى بيت المال {cite:tarikh-khulafa-minhaj-1434 p. 529-533}. وعند المسعودي أن الواثق اتبع ديانة أبيه وعمه في المحنة وعاقب المخالف وامتحن الناس وأمر القضاة في سائر الأمصار ألا يقبلوا شهادة من خالفه، وكان كثير الأكل واسع العطاء متحبباً إلى رعيته {cite:muruj-al-dhahab p. 672}، وعند المسعودي عقد مجلساً للمتطببين سألهم فيه عن مذاهبهم فأخبروه بأهل التجربة وأرباب القياس وأصحاب الطب الجبلي ثم سأل حنيناً عن آلات الغذاء وعن نطق الحكماء على جدث الإسكندر حتى بكى لما قال ديوجانس إنه أمس أنطق منه اليوم وهو اليوم أوعظ منه أمساً {cite:muruj-al-dhahab p. 467-471}"
  en: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, ninth Abbasid caliph; in al-Baladhuri: certain officials had laid head-jizya on the Jarajima at Antioch — they being a service-treaty people, not jizya-payers — and they appealed it to him as caliph, whereupon he ordered it remitted; al-Mutawakkil afterwards ordered it taken of them while paying them stipends."
