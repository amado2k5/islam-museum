education:
  did_you_know:
    ar: "الواثق هارون بن المعتصم تاسع خلفاء بني العباس؛ رفع إليه الجراجمة بأنطاكية أن بعض العمال ألزمهم جزية الرؤوس وهم أهل عهد خدمة لا جزية."
    en: "Al-Wathiq, Harun son of al-Mu'tasim, ninth Abbasid caliph — the Jarajima of Antioch petitioned him when some officials bound them to a head tax though theirs was a covenant of service, not tribute."
    ur: "واثق، ہارون بن معتصم، نویں عباسی خلیفہ — انطاکیہ کے جراجمہ نے اس کے پاس شکایت کی کہ کچھ عمال نے ان پر جزیرہ لگا دیا حالانکہ ان کا عہد خدمت کا تھا نہ محصول کا۔"
    sources: [source/futuh-buldan-maarif-1407, source/tabari-tarikh-abu-al-fadl]
class: person
label: { ar: "الواثق بالله", en: "al-Wathiq" }
summary:
  ar: "هارون الواثق بالله بن المعتصم، تاسع خلفاء بني العباس؛ عند البلاذري: كان بعض العمال قد ألزم الجراجمة بأنطاكية جزية رؤوسهم — وهم أهل عهد خدمة لا جزية — فرفعوا ذلك إليه وهو خليفة فأمر بإسقاطها عنهم، ثم جاء المتوكل فأمر بأخذها منهم مع إجراء الأرزاق عليهم وعند السيوطي بويع له في تاسع عشر ربيع الأول سنة سبع وعشرين وكان يسمى المأمون الأصغر لأدبه وفضله وكان أعلم الخلفاء بالغناء وله أصوات وألحان عملها نحو مئة صوت وحاذق بضرب العود وأروى الخلفاء للشعر ولم يكن في خلفاء بني العباس أحلم منه ولا أصبر على أذى، وكان له خوان من ذهب مؤلف من أربع قطع تحمل كل قطعة عشرون رجلاً فسأله ابن أبي دؤاد ألا يأكل عليه فأمر أن يكسر ويضرب ويحمل إلى بيت المال {cite:tarikh-khulafa-minhaj-1434 p. 529-533}. وعند المسعودي أن الواثق اتبع ديانة أبيه وعمه في المحنة وعاقب المخالف وامتحن الناس وأمر القضاة في سائر الأمصار ألا يقبلوا شهادة من خالفه، وكان كثير الأكل واسع العطاء متحبباً إلى رعيته {cite:muruj-al-dhahab p. 672}، وعند المسعودي عقد مجلساً للمتطببين سألهم فيه عن مذاهبهم فأخبروه بأهل التجربة وأرباب القياس وأصحاب الطب الجبلي ثم سأل حنيناً عن آلات الغذاء وعن نطق الحكماء على جدث الإسكندر حتى بكى لما قال ديوجانس إنه أمس أنطق منه اليوم وهو اليوم أوعظ منه أمساً {cite:muruj-al-dhahab p. 467-471}. وفي تاريخ بغداد (ترجمة 7351): ولد سنة ست وثمانين ومائة بطريق مكة وأمه أم ولد يقال لها قراطيس، وبويع بسر من رأى يوم مات أبوه المعتصم في ربيع الأول سنة سبع وعشرين ومائتين وهو ابن تسع وعشرين سنة، وورد كتابه إلى بغداد فقرأه إسحاق بن إبراهيم على الناس ودُعي للمعتصم وهو ميت ثم أخذ البيعة للواثق؛ ومات بالقصر الهاروني من سر من رأى يوم الأربعاء لست بقين من ذي الحجة سنة اثنتين وثلاثين ومائتين وكان عمره اثنتين وثلاثين سنة — وعن ابنه أحمد بلغ ثمانياً وثلاثين — وخلافته خمس سنين ونحو شهرين، وصلى عليه أخوه جعفر ودفن هناك؛ وكان أبيض يعلوه صفرة حسن اللحية في عينه نكت، وفيه أبيات دعبل الشهيرة «خليفة مات لم يحزن له أحد وآخر قام لم يفرح به أحد» {cite:tarikh-baghdad-khatib j.11 p.16-21}."
  en: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, ninth Abbasid caliph; in al-Baladhuri: certain officials had laid head-jizya on the Jarajima at Antioch — they being a service-treaty people, not jizya-payers — and they appealed it to him as caliph, whereupon he ordered it remitted; al-Mutawakkil afterwards ordered it taken of them while paying them stipends. Tarikh Baghdad (#7351): born 186 on the Mecca road to an umm walad named Qaratis; bay'a at Samarra on his father's death in Rabi' I 227 aged twenty-nine, his letter read to Baghdad by Ishaq b. Ibrahim; died Wednesday six days short of Dhu'l-Hijja 232 at Qasr al-Haruni aged thirty-two (his son Ahmad said thirty-eight), his brother Ja'far praying over him — Di'bil's famous lines 'a caliph died unwept, another rose unblessed' are here too {cite:tarikh-baghdad-khatib j.11 p.16-21}."
