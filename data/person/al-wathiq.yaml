label: { ar: "الواثق بالله", en: "al-Wathiq" }
summary:
  ar: "هارون الواثق بالله بن المعتصم، تاسع خلفاء بني العباس؛ عند البلاذري: كان بعض العمال قد ألزم الجراجمة بأنطاكية جزية رؤوسهم — وهم أهل عهد خدمة لا جزية — فرفعوا ذلك إليه وهو خليفة فأمر بإسقاطها عنهم، ثم جاء المتوكل فأمر بأخذها منهم مع إجراء الأرزاق عليهم."
  en: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, ninth Abbasid caliph; in al-Baladhuri: certain officials had laid head-jizya on the Jarajima at Antioch — they being a service-treaty people, not jizya-payers — and they appealed it to him as caliph, whereupon he ordered it remitted; al-Mutawakkil afterwards ordered it taken of them while paying them stipends."
