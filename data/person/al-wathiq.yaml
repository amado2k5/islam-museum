label: { ar: "الواثق بالله", en: "al-Wathiq", fr: "al-Wathiq" , ur: "الواثق باللہ", es: "al-Wathiq"}
summary:
  ar: "هارون الواثق بالله بن المعتصم، تاسع خلفاء بني العباس؛ عند البلاذري: كان بعض العمال قد ألزم الجراجمة بأنطاكية جزية رؤوسهم — وهم أهل عهد خدمة لا جزية — فرفعوا ذلك إليه وهو خليفة فأمر بإسقاطها عنهم، ثم جاء المتوكل فأمر بأخذها منهم مع إجراء الأرزاق عليهم وعند السيوطي بويع له في تاسع عشر ربيع الأول سنة سبع وعشرين وكان يسمى المأمون الأصغر لأدبه وفضله وكان أعلم الخلفاء بالغناء وله أصوات وألحان عملها نحو مئة صوت وحاذق بضرب العود وأروى الخلفاء للشعر ولم يكن في خلفاء بني العباس أحلم منه ولا أصبر على أذى، وكان له خوان من ذهب مؤلف من أربع قطع تحمل كل قطعة عشرون رجلاً فسأله ابن أبي دؤاد ألا يأكل عليه فأمر أن يكسر ويضرب ويحمل إلى بيت المال {cite:tarikh-khulafa-minhaj-1434 p. 529-533}. وعند المسعودي أن الواثق اتبع ديانة أبيه وعمه في المحنة وعاقب المخالف وامتحن الناس وأمر القضاة في سائر الأمصار ألا يقبلوا شهادة من خالفه، وكان كثير الأكل واسع العطاء متحبباً إلى رعيته {cite:muruj-al-dhahab p. 672}، وعند المسعودي عقد مجلساً للمتطببين سألهم فيه عن مذاهبهم فأخبروه بأهل التجربة وأرباب القياس وأصحاب الطب الجبلي ثم سأل حنيناً عن آلات الغذاء وعن نطق الحكماء على جدث الإسكندر حتى بكى لما قال ديوجانس إنه أمس أنطق منه اليوم وهو اليوم أوعظ منه أمساً {cite:muruj-al-dhahab p. 467-471}. وفي تاريخ بغداد ⁦(ترجمة 7351)⁩: ولد سنة ست وثمانين ومائة بطريق مكة وأمه أم ولد يقال لها قراطيس، وبويع بسر من رأى يوم مات أبوه المعتصم في ربيع الأول سنة سبع وعشرين ومائتين وهو ابن تسع وعشرين سنة، وورد كتابه إلى بغداد فقرأه إسحاق بن إبراهيم على الناس ودُعي للمعتصم وهو ميت ثم أخذ البيعة للواثق؛ ومات بالقصر الهاروني من سر من رأى يوم الأربعاء لست بقين من ذي الحجة سنة اثنتين وثلاثين ومائتين وكان عمره اثنتين وثلاثين سنة — وعن ابنه أحمد بلغ ثمانياً وثلاثين — وخلافته خمس سنين ونحو شهرين، وصلى عليه أخوه جعفر ودفن هناك؛ وكان أبيض يعلوه صفرة حسن اللحية في عينه نكت، وفيه أبيات دعبل الشهيرة «خليفة مات لم يحزن له أحد وآخر قام لم يفرح به أحد» {cite:tarikh-baghdad-khatib j.11 p.16-21}."
  en: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, ninth Abbasid caliph; in al-Baladhuri: certain officials had laid head-jizya on the Jarajima at Antioch — they being a service-treaty people, not jizya-payers — and they appealed it to him as caliph, whereupon he ordered it remitted; al-Mutawakkil afterwards ordered it taken of them while paying them stipends. Tarikh Baghdad (#7351): born 186 on the Mecca road to an umm walad named Qaratis; bay'a at Samarra on his father's death in Rabi' I 227 aged twenty-nine, his letter read to Baghdad by Ishaq b. Ibrahim; died Wednesday six days short of Dhu'l-Hijja 232 at Qasr al-Haruni aged thirty-two (his son Ahmad said thirty-eight), his brother Ja'far praying over him — Di'bil's famous lines 'a caliph died unwept, another rose unblessed' are here too {cite:tarikh-baghdad-khatib j.11 p.16-21}."
  fr: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, neuvième calife abbasside ; à al-Baladhuri : certains fonctionnaires avaient posé la tête-jizya sur le Jarajima à Antioche - ils étant un peuple traité de service, pas jizya-payeurs - et ils ont fait appel à lui comme calife, après quoi il a ordonné qu'il remis ; al-Mutawakkil a ensuite ordonné qu’on les prenne tout en leur versant des allocations. Tarikh Baghdad (#7351)  : né 186 sur la route de La Mecque à un Oumm Walad nommé Qaratis  ; bay'a à Samarra à la mort de son père en Rabi'I 227 âgé de vingt-neuf ans, sa lettre lue à Bagdad par Ishaq b. Ibrahim  ; est mort mercredi six jours avant Dhu'l-Hijja 232 à Qasr al-Haruni âgé de trente-deux ans (son fils Ahmad a dit trente-huit), son frère Ja'far priant sur lui - les célèbres lignes de Di'bil \"un calife est mort sans être pleuré, une autre rose non bénie\" sont ici aussi {cite:tarikh-baghdad-khatib j.11 p.16-21}."
  ur: "ہارون الواثق، معتصم کے بیٹے اور نویں عباسی خلیفہ؛ ماخذ ان کی بیعت، حکومت اور سامرا میں وفات کے احوال بیان کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "Harun al-Wathiq bi'llah ibn al-Mu'tasim, noveno califa abasí; en al-Baladhuri: ciertos funcionarios habían impuesto jizya a los Jarajima en Antioquía —siendo ellos un pueblo de tratado de servicio, no pagadores de jizya— y se lo apelaron como califa, tras lo cual ordenó que se les condonara; al-Mutawakkil luego ordenó que se les cobrara mientras les pagaba estipendios. Tarikh Baghdad (#7351): nació en 186 en el camino a La Meca de un umm walad llamado Qaratis; bay'a en Samarra a la muerte de su padre en Rabi' I 227 a la edad de veintinueve años, su carta leída a Baghdad por Ishaq b. Ibrahim; murió el miércoles seis días antes de Dhu'l-Hijja 232 en Qasr al-Haruni a la edad de treinta y dos años (su hijo Ahmad dijo treinta y ocho), su hermano Ja'far oró por él; los famosos versos de Di'bil 'un califa murió sin ser llorado, otra rosa sin ser bendecida' también están aquí {cite:tarikh-baghdad-khatib j.11 p.16-21}."
  tr: "Dokuzuncu Abbasi halifesi Harun al-Wathiq Billah ibn al-Mu'tasim; al-Baladhuri'ye göre: Antakya'daki bazı valiler, Antakya'daki Jarajima'yı başlarına vergi ödemeye zorlamışlardı—onlar hizmet ahidi kişilerdi, cizye değil—ve bunu ona halifeyken sundular, o da haraç ellerinden alınmasını emretti. Sonra al-Mutawakkil geldi ve bu vergiyi onlardan alıp yiyecek sağladı. al-Suyuti'ye göre, yirmi yedinci yılın Rabi'al-Awwal'ının on dokuzuncusunda bağlılık yemini etti. Adabı ve erdemi nedeniyle ona Genç El-Memun denirdi. Halifeler arasında şarkı söylemede en bilgili olanıydı; sesleri ve ezgileri yaklaşık yüz kişi bestelenmişti ve vuruşta ustaydı Ud ve halifeler şiiri ışınladı ve Abbasi halifeleri arasında ondan daha sabırlı ya da zarara karşı sabırlı kimse yoktu. Dört parçadan oluşan altın bir sepeti vardı, her biri yirmi adam taşıyordu. İbn Ebi Du'ad ona sepeti yememesini söyledi, bu yüzden sepetin kırılmasını, dövülmesini ve kamu hazinesine götürülmesini emretti {atıf:Tarikh-khulafa-minhaj-1434, s. 529-533}. al-Mas'udi'ye göre, al-Wathiq zorluklarda babasının ve amcasının dinini takip etti, karşı çıkanları cezalandırdı, insanları sınadı ve tüm bölgelerdeki hakimlere karşı olanların tanıklığını kabul etmemelerini emretti. Sık sık yiyen, cömert ve tebaasının sevgisiyle seçilen biriydi {cite:muruj-al-dhahab, s. 672}. Al-Mas'udi'ye göre, uygulayıcılar için bir konsey düzenledi ve onlara doktrinlerini sordu, onlar da ona deneyimli insanlar, benzetme uzmanları ve dağ tıbbı uzmanları hakkında bilgi verdi. Sonra Hanin'e yiyecek gereçleri ve İskender'in ataları hakkında bilge konuşmalar sordu, ta ki Diogenes dün bugünden daha çok konuştuğunu ve bugün dünden daha çok vaaz verdiğini söyleyince ağladı {cite:muruj-al-dhahab s. 467-471}. Bağdat'ta (biyografi 7351): Yüz seksen altıncı yılda Mekke yolunda doğdu ve annesi Qartis adında bir çocuğun annesiydi. Babası el-Mu'tasim 227 Hicri yılının Rabi' el-Avval'da yirmi dokuz yaşında öldüğü gün, 'Man Ra'ya' sırına bağlılık yemini etti. Mektubu Bağdat'a getirildi, burada İshaq ibn İbrahim halkına okudu ve ölüyken el-Mu'tasim'e çağrıldı, ardından el-Vathiq'e bağlılık yemini etti. Çarşamba günü El-Haruni sarayında 'Man Ra'a, ben 232 Hicce'de Zhu'l-Hijce'de kalmadım.' sırrından öldü. Otuz iki yaşındaydı — oğlu Ahmad'a göre otuz sekiz yaşındaydı — ve halifeliği beş yıl yaklaşık iki ay sürdü. Kardeşi Cafer cenaze namazını onun üzerine yaptı ve oraya defnedildi; beyazdı, gözlerinde güzel sarı bir sakal vardı ve namazda Di'bal'ın ünlü ayetleri yer alıyordu: \"Ölen bir halife, kimse yas tutmadı, ve kimsenin sevinmediği bir başka gül\" {kaynak:Tarikh-baghdad-khatib j.11, s.16-21}."
  id: "Harun al-Wathiq Billah ibn al-Mu'tasim, khalifah Abbasiyah kesembilan; menurut al-Baladhuri: Beberapa gubernur di Antiokhia mewajibkan Jarajima di Antiokhia membayar upeti kepada kepala mereka—mereka adalah orang yang menerima perjanjian, bukan jizya—dan mereka menyerahkan ini kepadanya saat ia menjadi khalifah, yang memerintahkan agar upeti itu diambil dari mereka. Kemudian al-Mutawakkil datang dan memerintahkan agar upeti itu diambil dari mereka beserta menyediakan makanan. Menurut al-Suyuti, ia disumpah setia pada tanggal kesembilan belas Rabi' al-Awwal tahun dua puluh tujuh. Ia disebut al-Ma'mun yang Muda karena tata krama dan kebajikannya. Ia adalah yang paling berpengetahuan di antara para khalifah dalam bernyanyi, dengan suara dan melodi yang tercipta sekitar seratus orang dan terampil dalam memukul Oud dan khalifah memancarkan puisi, dan di antara khalifah Abbasiyah, tidak ada yang lebih sabar atau lebih sabar dengan bahaya. Ia memiliki keranjang emas yang terbuat dari empat potong, masing-masing membawa dua puluh orang. Ibn Abi Du'ad memintanya untuk tidak memakannya, sehingga ia memerintahkan agar keranjang itu dipecahkan, dipukul, dan dibawa ke kas umum {cite:Tarikh-khulafa-minhaj-1434, hlm. 529-533}. Menurut al-Mas'udi, al-Wathiq mengikuti agama ayah dan pamannya dalam kesulitan, menghukum mereka yang tidak setuju, menguji orang, dan memerintahkan hakim di semua wilayah untuk tidak menerima kesaksian mereka yang menentangnya. Ia sering makan, murah hati, dan dicintai oleh rakyatnya {cite:muruj-al-dhahab, hlm. 672}. Menurut al-Mas'udi, ia mengadakan dewan untuk para praktisi dan menanyakan doktrin mereka, dan mereka memberitahunya tentang orang-orang berpengalaman, ahli analogi, dan ahli pengobatan gunung. Kemudian ia bertanya kepada Hanin tentang peralatan makanan dan pidato orang bijak tentang leluhur Alexander, hingga ia menangis ketika Diogenes berkata bahwa kemarin ia berbicara lebih banyak daripada hari ini, dan hari ini ia berkhotbah lebih banyak daripada kemarin {cite:muruj-al-dhahab hlm. 467-471}. Dalam Tarikh Baghdad (biografi 7351): Ia lahir pada tahun seratus delapan puluh enam di jalan menuju Mekah, dan ibunya adalah ibu dari seorang anak laki-laki bernama Qartis. Ia diikrarkan setia dalam rahasia 'Man Ra'ya, pada hari ayahnya al-Mu'tasim meninggal di Rabi' al-Awwal tahun 227 H, pada usia dua puluh sembilan tahun. Suratnya dibawa ke Baghdad, di mana Ishaq ibn Ibrahim membacakannya kepada rakyat, dan ia dipanggil ke al-Mu'tasim saat ia meninggal, lalu mengucapkan sumpah setia kepada al-Wathiq. Ia meninggal di istana Al-Haruni karena rahasia 'Man Ra'a pada hari Rabu, aku tidak ditinggalkan di Dhu al-Hijjah pada tahun 232 H.' Ia berusia tiga puluh dua tahun — dan menurut putranya Ahmad, ia berusia tiga puluh delapan — dan khalifahnya berlangsung lima tahun sekitar dua bulan. Saudaranya, Ja'far, memimpin doa pemakaman di atasnya dan dimakamkan di sana; ia berkulit putih, dengan janggut kuning yang indah di matanya, dan di dalamnya terdapat ayat-ayat terkenal Di'bal: \"Seorang khalifah yang meninggal, tidak ada yang meratapi dia, dan satu lagi bangkit sehingga tidak ada yang bersukacita\" {cite:tarikh-baghdad-khatib j.11, hlm.16-21}."
