summary:
  ar: "من بني أسد بن خزيمة، حليف بني أمية، هاجر إلى الحبشة مع امرأته أم حبيبة؛ يذكر ابن إسحاق أنه تنصّر بها وفارق الإسلام ومات نصرانياً، فتزوج النبي أم حبيبة بعده."
  en: Of Banu Asad ibn Khuzayma, ally of Banu Umayya; he emigrated to Abyssinia with his wife Umm Habiba. Ibn Ishaq records that he became Christian there, left Islam and died a Christian, and the Prophet married Umm Habiba after him.
  es: "Pertenecía a la tribu Banu Asad ibn Khuzayma, aliada de Banu Umayya; emigró a Abisinia con su esposa Umm Habiba. Ibn Ishaq relata que allí se convirtió al cristianismo, abandonó el islam y murió siendo cristiano, y que el Profeta se casó con Umm Habiba después de él."
  fr: "Ibn Asad ibn Khuzayma, membre de la tribu des Umayya, émigra en Abyssinie avec son épouse Umm Habiba. Ibn Ishaq rapporte qu'il se convertit au christianisme, apostasie et mourut chrétien. Le Prophète épousa ensuite Umm Habiba."
  ur: "بنو اسد بن خزیمہ، بنو امیہ کے حلیف؛ آپ نے اپنی بیوی ام حبیبہ کے ساتھ حبشہ کی طرف ہجرت کی۔ ابن اسحاق نے لکھا ہے کہ وہ وہاں عیسائی ہو گئے، اسلام چھوڑ کر عیسائی ہو کر فوت ہو گئے، اور نبی نے ان کے بعد ام حبیبہ سے شادی کی۔"
