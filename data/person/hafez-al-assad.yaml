summary:
  ar: "ضابط وسياسي سوري من القرداحة (1930–2000)، رئيس سوريا من 1971 إلى وفاته. صعد عبر سلاح الجو وحزب البعث، وقاد «الحركة التصحيحية» في نوفمبر 1970، وحكم سوريا ثلاثة عقود حتى وفاته في دمشق سنة 2000، فخلفه ابنه بشار."
  en: "Syrian officer and politician from Qardaha (1930–2000), president of Syria from 1971 until his death. He rose through the air force and the Ba'ath Party, led the 'Corrective Movement' of November 1970, and ruled Syria for three decades until his death at Damascus in 2000, when his son Bashar succeeded him."
  ur: "قرداحہ سے تعلق رکھنے والے سوری افسر اور سیاست دان (1930–2000)، جو 1971 سے اپنی وفات تک سوریہ کے صدر رہے۔ وہ فضائیہ اور بعث پارٹی کے ذریعے آگے بڑھے، نومبر 1970 کی «اصلاحی تحریک» کی قیادت کی، اور 2000 میں دمشق میں وفات تک تین دہائیوں تک سوریہ پر حکومت کی، جب ان کے بیٹے بشار جانشین بنے۔"
