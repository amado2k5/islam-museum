class: person
label: { ar: "داود بن علي", en: "Dawud ibn Ali", es: "Dawud ibn Ali", fr: "Dawud ibn Ali", ur: "داؤد بن علی" }
summary:
  ar: "داود بن علي بن عبد الله بن العباس؛ عند البلاذري أقطع جميع السيبين لما قبضت أموال بني أمية في الدولة المباركة ثم ابتيع ذلك من ورثته بحقوقه وحدوده فصار من ضياع الخلافة. وقال على منبر الكوفة يوم بويع لأبي العباس يا أهل الكوفة لم يقم فيكم إمام بعد رسول الله إلا علي بن أبي طالب وهذا القائم فيكم {cite:muruj-al-dhahab p. 224}، وعند المسعودي لقيهم بدومة الجندل منصرفاً من الشراة فهاب الوثوب بالكوفة ومروان مطل على أهل العراق وابن هبيرة في جلة العرب، فلما تمثل أبو العباس بفما ميتة إن متها غير عاجز بعار قال لابنه موسى صدق ابن عمك ارجع بنا معه نحيا أعزاء أو نموت كراماً، وقال على المنبر ما كان بينكم وبين رسول الله خليفة إلا علي وهذا، واستخلفه أبو العباس على الكوفة وأرضها {cite:muruj-al-dhahab p. 239-242}"
  en: "Dawud ibn Ali ibn Abdallah ibn al-Abbas; in al-Baladhuri he was granted all al-Sibayn when Umayyad wealth was seized under the blessed dawla — later bought from his heirs with its rights and bounds into the caliphal estates."
  es: "Dawud ibn Ali ibn Abdallah ibn al-Abbas; en al-Baladhuri se le concedió todo al-Sibayn cuando la riqueza omeya fue confiscada bajo la bendita dawla, que más tarde compró a sus herederos con sus derechos y límites en las propiedades califales."
  fr: "Dawud ibn Ali ibn Abdallah ibn al-Abbas; à al-Baladhuri, il reçut tout al-Sibayn lorsque les richesses omeyyades furent saisies sous la dawla bénie — rachetées plus tard à ses héritiers avec ses droits et limites dans les domaines califes."
  ur: "داؤد بن علی ابن عبداللہ ابن العباس؛ البلادوری میں اسے تمام السیبین عطا کیے گئے جب اموی دولت مبارک دولت کے تحت ضبط کی گئی - بعد میں اس کے وارثوں سے اس کے حقوق اور حدود کے ساتھ خلیفہ کی جاگیروں میں خریدا گیا۔"
  tr: "Davud ibn Ali ibn Abdullah ibn al-Abbas; el-Baladhuri'ye göre, Emeviyelerin serveti mübarek devlette alındığında iki sibin de kesilmiş, sonra hakları ve sınırlarıyla birlikte varislerinden satın alınmış ve böylece halifeliğin kaybının bir parçası olmuştur. Ebu Abbas'ın sadakat ettiği gün Kufe kürsüsünde şöyle dedi: Ey Kufe halkı, aranızda Allah'ın Elçisi sonrası İmam Ali ibn Ebi Talib'den başka yükselmedi ve aranızda duran budur {alıntı::Muruj-al-Dhahab s. 224}. El-Mes'udi'de, pazardan ayrılırken Dumat el-Candal'da onları karşıladı, böylece El-Vathub Kufe'deydi, Mervan ise Irak halkını ve Araplar arasında İbn Hubayre'yi gözetliyordu. Ebu el-Abbas ölü bir yerde göründüğünde, ölümü engellenmedi, oğlu Musa'ya şöyle dedi: 'Kuzeniniz dürüsttür. Bizi onunla birlikte sağ ve onurlu geri getirin ya da onurla öl.' Kürsüden şöyle dedi: 'Seninle Allah'ın Elçisi arasında Ali ve bu halife dışında bir halife yoktu.' Ebu el-Abbas onu Kufe ve toprakları üzerinde vekil olarak atadı. {atıf:Muruj-al-Dhahab s. 239-242}"
  id: "Dawud ibn Ali ibn Abdullah ibn al-Abbas; menurut al-Baladhuri, ia memutus kedua sibin ketika kekayaan Umayyah diambil dalam keadaan berkah, kemudian dibeli dari ahli warisnya beserta hak dan batasannya, sehingga menjadi bagian dari kehilangan kekhalifahan. Dia berkata di mimbar Kufa pada hari Abu al-Abbas diikrarkan kesetiaan: Wahai umat Kufa, tidak ada Imam yang bangkit di antara kalian setelah Rasulullah kecuali Ali ibn Abi Talib, dan inilah yang berdiri di antara kalian {cite:Muruj-al-Dhahab hlm. 224}. Di Al-Mas'udi, ia bertemu mereka di Dumat al-Jandal saat meninggalkan pasar, jadi Al-Wathub berada di Kufa, sementara Marwan mengawasi rakyat Irak dan Ibn Hubayrah di antara orang Arab. Ketika Abu al-Abbas muncul di tempat mati, kematiannya tidak melumpuhkan, ia berkata kepada putranya Musa: 'Sepupumu benar. Bawa kami kembali bersamanya dalam keadaan hidup dan terhormat atau mati dengan kehormatan.' Ia berkata dari mimbar: 'Tidak ada khalifah antara kamu dan Rasul Allah kecuali Ali, dan yang ini.' Abu al-Abbas mengangkatnya sebagai wakilnya atas Kufa dan tanahnya. {cite:muruj-al-dhahab hlm. 239-242}"
