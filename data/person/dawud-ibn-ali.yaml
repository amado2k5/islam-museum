id: person/dawud-ibn-ali
class: person
label: { ar: "داود بن علي", en: "Dawud ibn Ali" }
summary:
  ar: "داود بن علي بن عبد الله بن العباس؛ عند البلاذري أقطع جميع السيبين لما قبضت أموال بني أمية في الدولة المباركة ثم ابتيع ذلك من ورثته بحقوقه وحدوده فصار من ضياع الخلافة.، وقال على منبر الكوفة يوم بويع لأبي العباس يا أهل الكوفة لم يقم فيكم إمام بعد رسول الله إلا علي بن أبي طالب وهذا القائم فيكم {cite:muruj-al-dhahab p. 224}، وعند المسعودي لقيهم بدومة الجندل منصرفاً من الشراة فهاب الوثوب بالكوفة ومروان مطل على أهل العراق وابن هبيرة في جلة العرب، فلما تمثل أبو العباس بفما ميتة إن متها غير عاجز بعار قال لابنه موسى صدق ابن عمك ارجع بنا معه نحيا أعزاء أو نموت كراماً، وقال على المنبر ما كان بينكم وبين رسول الله خليفة إلا علي وهذا، واستخلفه أبو العباس على الكوفة وأرضها {cite:muruj-al-dhahab p. 239-242}"
  en: "Dawud ibn Ali ibn Abdallah ibn al-Abbas; in al-Baladhuri he was granted all al-Sibayn when Umayyad wealth was seized under the blessed dawla — later bought from his heirs with its rights and bounds into the caliphal estates."
