summary:
  ar: "الحافظ الأصبهاني الحنبلي صاحب «تاريخ أصبهان»؛ سمع منه بغداد حين قدمها حاجاً في شيخوخته فأملى وحدث بها وسمع منه ابن ناصر وعبد الوهاب الأنماطي والشيخ عبد القادر الجيلي وابن الخشاب والحافظ السلفي، وقال ابن السمعاني: جليل القدر وافر الفضل واسع الرواية ثقة حافظ مكثر صدوق كثير التصانيف حسن السيرة، بيته أوجد بيت في عصره؛ صنف مناقب العباس ومناقب أحمد في مجلد كبير؛ توفي في ذي الحجة سنة إحدى عشرة وخمسمائة وله أربع وسبعون سنة {cite:shadharat-dhahab p. 511-512}."
  en: "The Isfahani Hanbali hafiz, author of Tarikh Isfahan — in old age he came to Baghdad on hajj, dictated, and was heard by Ibn Nasir, Abd al-Qadir al-Jili, Ibn al-Khashshab and al-Silafi; al-Sam'ani called his house the worthiest of its age; d. Dhu al-Hijja 511 at seventy-four {cite:shadharat-dhahab p. 511-512}."
