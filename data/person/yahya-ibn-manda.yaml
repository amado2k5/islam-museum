id: person/yahya-ibn-manda
class: person
label: { ar: "أبو زكريا يحيى بن منده" }
names:
  - { value: "أبو زكريا يحيى بن عبد الوهاب بن محمد بن إسحاق بن منده العبدي الأصبهاني", kind: full }
summary:
  ar: "الحافظ الأصبهاني الحنبلي صاحب «تاريخ أصبهان»؛ سمع منه بغداد حين قدمها حاجاً في شيخوخته فأملى وحدث بها وسمع منه ابن ناصر وعبد الوهاب الأنماطي والشيخ عبد القادر الجيلي وابن الخشاب والحافظ السلفي، وقال ابن السمعاني: جليل القدر وافر الفضل واسع الرواية ثقة حافظ مكثر صدوق كثير التصانيف حسن السيرة، بيته أوجد بيت في عصره؛ صنف مناقب العباس ومناقب أحمد في مجلد كبير؛ توفي في ذي الحجة سنة إحدى عشرة وخمسمائة وله أربع وسبعون سنة {cite:shadharat-dhahab p. 511-512}."
  en: "The Isfahani Hanbali hafiz, author of Tarikh Isfahan — in old age he came to Baghdad on hajj, dictated, and was heard by Ibn Nasir, Abd al-Qadir al-Jili, Ibn al-Khashshab and al-Silafi; al-Sam'ani called his house the worthiest of its age; d. Dhu al-Hijja 511 at seventy-four {cite:shadharat-dhahab p. 511-512}."
  es: "El hafiz hanbalí de Isfahán, autor de Tarikh Isfahan, en su vejez llegó a Bagdad para realizar el Hajj, dictó y fue escuchado por Ibn Nasir, Abd al-Qadir al-Jili, Ibn al-Khashshab y al-Silafi; al-Sam'ani llamó a su casa la más digna de su época; murió en Dhu al-Hijja 511 a los setenta y cuatro años {cite:shadharat-dhahab p. 511-512}."
  fr: "Le hafiz hanbalite d'Ispahan, auteur du Tarikh Ispahan — à un âge avancé, il vint à Bagdad en pèlerinage, dicta et fut entendu par Ibn Nasir, Abd al-Qadir al-Jili, Ibn al-Khashshab et al-Silafi; al-Sam'ani qualifia sa maison de la plus digne de son époque; d. Dhu al-Hijja 511 à soixante-quatorze ans {cite: shadharat-dhahab p. 511-512}."
  ur: "اصفہانی حنبلی حافظ، تاریخ اصفہان کے مصنف - بڑھاپے میں حج پر بغداد آئے، حکم دیا، اور ابن ناصر، عبد القادر الجیلی، ابن الخشاب اور السلفی سے سنا؛ السمانی نے اپنے گھر کو اس کی عمر کا سب سے زیادہ لائق قرار دیا۔ d ذی الحجہ 511 بوقت چوہتر۔ 511-512}۔"
  tr: "'Tarih İsfahan'ın yazarı El-Hafız el-İsfahani el-Hanbali; Bağdat'ta yaşlılığında hacı iken ondan haber aldı ve ondan anlattı. Ayrıca İbn Nasir, Abdül-Vahhab el-Enmati, Şeyh Abd al-Qadir al-Jili, İbn el-Khashab ve Selefi hafız'dan da söz aldı. İbn el-Sam'ani şöyle dedi: Büyük bir boylu, bol erdemli, geniş bir anlatıya sahip, güvenilir, üretken, dürüst ve sayısız eserli, iyi davranışlı biriydi. Evi döneminin en özgün eviydi; el-Abbas ve Ahmed'in erdemlerini büyük bir ciltte derledi; Dhicce'de beş yüz on bir yaşında yetmiş dört yaşında vefat etti {atıft: shadharat-dhahab, s. 511-512}."
  id: "Al-Hafiz al-Isfahani al-Hanbali, penulis 'Tarikh Isfahan'; ia mendengar darinya di Baghdad ketika ia menjadi peziarah di usia tua, mendikte dan menceritakan darinya. Ia juga mendengar dari Ibn Nasir, Abd al-Wahhab al-Anmati, Sheikh Abd al-Qadir al-Jili, Ibn al-Khashab, dan para Hafiz Salafi. Ibn al-Sam'ani berkata: Ia bertubuh besar, bersifat mulia, berwibawa, memiliki narasi yang luas, dapat dipercaya, produktif, jujur, dan banyak karya, serta perilaku yang baik. Rumahnya adalah yang paling asli pada zamannya; ia mengumpulkan kebajikan al-Abbas dan Ahmad dalam sebuah buku besar; ia meninggal di Dhu al-Hijjah pada tahun lima ratus sebelas pada usia tujuh puluh empat {cite:shadharat-dhahab, hlm. 511-512}."
