summary:
  ar: 'عبد الجبار بن عمر، أبو عمر، ويقال أبو الصباح، الأيلي الأموي مولاهم. روى عن الزهري وابن المنكدر ونافع مولى ابن عمر وربيعة ويحيى بن سعيد الأنصاري وغيرهم، وروى عنه رشدين بن سعد وابن المبارك وابن وهب وأبو عبد الرحمن المقري وغيرهم. قال الدوري عن ابن معين إنه ضعيف ليس بشيء، ونقل ابن أبي حاتم عن أبي زرعة أنه كان ثقة، وقال: واهي الحديث، وأما مسائله فلا بأس بها. وتاريخ وفاته في العنوان بعد سنة 260 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}'
  en: Abd al-Jabbar ibn Umar, Abu Umar, also called Abu al-Sabbah, al-Ayli of the Umayyad clients. He related from al-Zuhri, Ibn al-Munkadir, Nafi' the client of Ibn Umar, Rabi'a and Yahya ibn Sa'id al-Ansari and others; Rashdin ibn Sa'd, Ibn al-Mubarak, Ibn Wahb and Abu Abd al-Rahman al-Maqri related from him. al-Duri reported from Ibn Ma'in that he was weak and of no account; Ibn Abi Hatim reported that Abu Zur'a called him trustworthy yet weak in hadith, but his legal answers are acceptable. The heading gives death after 260 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  ur: عبد الجبار بن عمر، ابو عمر، جنہیں ابو الصباح بھی کہا جاتا ہے، ایلی اموی، بنو امیہ کے آزاد کردہ۔ انہوں نے زہری، ابن المنکدر، نافع مولیٰ ابن عمر، ربیعہ اور یحییٰ بن سعید انصاری وغیرہ سے روایت کیا، اور ان سے رشدین بن سعد، ابن المبارک، ابن وہب اور ابو عبد الرحمن المقری وغیرہ نے روایت کیا۔ دوری نے ابن معین سے نقل کیا کہ وہ ضعیف تھے، جبکہ ابن ابی حاتم نے ابو زرعہ سے نقل کیا کہ وہ ثقہ تھے مگر حدیث میں کمزور، اور ان کے فقہی مسائل میں کوئی حرج نہیں۔ عنوان کے مطابق وفات 260 ہجری کے بعد۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
