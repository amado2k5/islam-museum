summary:
  ar: "من بيت المناذرة ملوك الحيرة؛ رجع معه بعد وفاة النبي من كان أسلم من عبد القيس إلى دينهم الأول، فقام الجارود يدعوهم إلى الإسلام. يقول السهيلي، فيما ينقله المحققون، إن اسمه المنذر وإنما سُمّي الغرور لأنه غرّ قومه يوم حرب الردة."
  en: "Of the Lakhmid house of al-Hira; after the Prophet's death those of Abd al-Qays who had converted reverted with him, and al-Jarud rose to call them back to Islam. Al-Suhayli, as the editors report, says his name was al-Mundhir and that he was called al-Gharur, the deceiver, because he deceived his people on the day of the ridda war."
