summary:
  ar: "من بيت المناذرة ملوك الحيرة؛ رجع معه بعد وفاة النبي من كان أسلم من عبد القيس إلى دينهم الأول، فقام الجارود يدعوهم إلى الإسلام. يقول السهيلي، فيما ينقله المحققون، إن اسمه المنذر وإنما سُمّي الغرور لأنه غرّ قومه يوم حرب الردة."
  en: "Of the Lakhmid house of al-Hira; after the Prophet's death those of Abd al-Qays who had converted reverted with him, and al-Jarud rose to call them back to Islam. Al-Suhayli, as the editors report, says his name was al-Mundhir and that he was called al-Gharur, the deceiver, because he deceived his people on the day of the ridda war."
  fr: "De la maison lakhmide d’al-Hira ; après la mort du Prophète, les convertis des Abd al-Qays revinrent avec lui à leur ancienne religion, et al-Jarud se leva pour les rappeler à l’islam. Al-Suhayli, selon les éditeurs, dit qu’il s’appelait al-Mundhir et fut appelé al-Gharur, le trompeur, parce qu’il trompa les siens au jour de la guerre de la Ridda."
  es: "De la casa Lakhmid de al-Hira; tras la muerte del Profeta, aquellos de Abd al-Qays que se habían convertido regresaron con él, y al-Jarud se alzó para llamarlos de nuevo al Islam. Al-Suhayli, según informan los editores, dice que su nombre era al-Mundhir y que se le conocía como al-Gharur, el engañador, porque engañó a su pueblo el día de la guerra de Ridda."
  ur: "الحیرہ کے لخمید گھر میں سے؛ رسول اللہ کی وفات کے بعد عبد القیس میں سے جو لوگ اسلام قبول کر چکے تھے وہ آپ کے ساتھ واپس آ گئے اور جارود انہیں دوبارہ اسلام کی طرف بلانے کے لیے اٹھ کھڑا ہوا۔ السحیلی، جیسا کہ ایڈیٹرز کی رپورٹ ہے، کہتا ہے کہ اس کا نام المنذر تھا اور اسے الغرور، دھوکہ باز کہا جاتا ہے، کیونکہ اس نے جنگِ ردّہ کے دن اپنے لوگوں کو دھوکہ دیا تھا۔"
