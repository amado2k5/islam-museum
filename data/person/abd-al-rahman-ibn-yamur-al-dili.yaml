gender: male
summary:
  ar: 'عبد الرحمن بن يعمر الدَّيلي، يكنى أبا الأسود، صحابي، روى عن النبي حديث: «الحج عرفة»، وحديث النهي عن الدباء والمزفت. وروى عنه بكير بن عطاء الليثي. قال ابن حجر: ذكره ابن حبان في الصحابة وأنه مكي سكن الكوفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}'
  en: Abd al-Rahman ibn Ya'mur al-Dili, known as Abu al-Aswad, a Companion. He related from the Prophet the report that the Hajj is Arafat and the report forbidding the gourd and the pitched vessel; Bukayr ibn Ata al-Laythi related from him. Ibn Hajar said Ibn Hibban counted him among the Companions and that he was a Meccan who settled in Kufa. The book gives no date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}
  ur: عبد الرحمن بن یعمر دیلی، ابو الاسود کنیت، صحابی۔ انہوں نے نبی سے حدیث «الحج عرفة» اور دباء و مزفت کی ممانعت کی حدیث روایت کی، اور ان سے بکیر بن عطاء اللیثی نے روایت کیا۔ ابن حجر کے مطابق ابن حبان نے انہیں صحابہ میں ذکر کیا، وہ مکی تھے اور کوفہ میں سکونت پذیر ہوئے۔ کتاب میں تاریخ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}
