summary:
  ar: "كاتبة بريطانية في الأدب الديني غير الخيالي للبالغين والأطفال، تقيم في باكينغهامشير بإنجلترا. من كتبها «مدّ الروح» (Turning the Tide) الصادر عن المؤسسة الإسلامية، و«رسائل إلى أمي» (Dear Mother). وهي أيضًا محررة وباحثة ومستشارة تعليمية، ودرّست لسنوات طويلة في قطاع تعليم الكبار والتعليم التكميلي."
  en: "British author of faith-based non-fiction for adults and children, based in Buckinghamshire, England. Her books include Turning the Tide, published by the Islamic Foundation, and Dear Mother — Letters from the Heart. She is also an editor, researcher and educational consultant, and taught for many years in the supplementary and adult education sector."
  ur: "برطانوی مصنفہ جو بالغوں اور بچوں کے لیے ایمانی غیر افسانوی ادب لکھتی ہیں اور بکنگھم شائر، انگلستان میں مقیم ہیں۔ ان کی کتابوں میں اسلامک فاؤنڈیشن سے شائع شدہ Turning the Tide اور Dear Mother شامل ہیں۔ وہ مدیرہ، محققہ اور تعلیمی مشیر بھی ہیں اور کئی برس تکمیلی و بالغ تعلیم کے شعبے میں پڑھاتی رہیں۔"
