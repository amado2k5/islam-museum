  ar: "يعقوب بن إسحاق، أبو يوسف، المعروف بابن السكيت، إمام في اللغة والأدب أصله من خوزستان وتعلم ببغداد؛ أدب أولاد المتوكل ثم قتله لسبب مجهول، وله إصلاح المنطق؛ توفي سنة 244 هـ الموافقة 858 م."
  en: "Ya'qub ibn Ishaq, Abu Yusuf, known as Ibn al-Sikkit, a leading authority on language and literature, of Khuzistani origin and trained in Baghdad; tutor of al-Mutawakkil's sons until the caliph had him killed for a reason al-Zirikli calls unknown; author of Islah al-Mantiq; died 244 AH (858 CE)."
