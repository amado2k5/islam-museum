summary:
  ar: "يعقوب بن إسحاق، أبو يوسف، المعروف بابن السكيت ⁦(186 - 244هـ / 802 - 858م)⁩، إمام في اللغة والأدب، أصله من خوزستان وتعلم ببغداد، واتصل بالمتوكل العباسي وعهد إليه بتأديب أولاده ثم قتله لسبب مجهول؛ ومن كتبه «إصلاح المنطق» {cite:al-aalam}."
  en: "Ya'qub ibn Ishaq, Abu Yusuf, known as Ibn al-Sikkit (186-244 AH / 802-858), an authority on language and literature of Khuzistani origin who was educated in Baghdad, joined the court of the Abbasid caliph al-Mutawakkil as tutor to his sons and was then killed on his orders for a reason al-Zirikli calls unknown; best known for his Islah al-mantiq {cite:al-aalam}."
