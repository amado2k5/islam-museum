  ar: "محمد بن سعود بن محمد بن مقرن، أول من لقب بالإمامة من آل سعود في نجد، مقامه بالدرعية، ولي الإمارة سنة 1139 هـ وتعاهد مع الشيخ محمد بن عبد الوهاب سنة 1157 هـ، وتوفي بالدرعية سنة 1179 هـ الموافقة 1765 م."
