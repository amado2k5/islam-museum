summary:
  ar: "غازي عبد الرحمن القصيبي ⁦(1940–2010)⁩ روائي وشاعر ودبلوماسي ووزير سعودي، تولى حقائب الصناعة والكهرباء والصحة والعمل وسفيراً في البحرين وبريطانيا. من رواياته «شقة الحرية» و«العصفورية» و«سقف الكفاية»، وله دواوين شعرية وكتاب «حياة في الإدارة»."
  en: "Ghazi al-Gosaibi (1940–2010) was a Saudi novelist, poet, diplomat and minister who held the portfolios of industry, electricity, health and labour and served as ambassador to Bahrain and Britain. His novels include An Apartment Called Freedom and Al-'Usfuriyya, plus poetry collections and the memoir A Life in Administration."
  ur: "غازی عبدالرحمٰن قصیبی ⁦(1940–2010)⁩ سعودی ناول نگار، شاعر، سفیر اور وزیر تھے جو صنعت، بجلی، صحت اور محنت کی وزارتیں اور بحرین و برطانیہ میں سفارت سنبھالیں۔ ناولوں میں «شقة الحرية» اور «العصفرية»، شعری مجموعے اور «حياة في الإدارة» شامل ہیں۔"
  es: "Ghazi al-Gosaibi (1940-2010) fue un novelista, poeta, diplomático y ministro saudí que ocupó las carteras de industria, electricidad, sanidad y trabajo, y fue embajador en Baréin y Gran Bretaña. Entre sus novelas destacan Un apartamento llamado libertad y Al-'Usfuriyya, además de poemarios y sus memorias Una vida en la administración."
  fr: "Ghazi al-Gosaibi (1940-2010) était un romancier, poète, diplomate et ministre saoudien. Il occupa les portefeuilles de l'industrie, de l'électricité, de la santé et du travail, et fut ambassadeur au Bahreïn et en Grande-Bretagne. Parmi ses romans figurent « Un appartement nommé liberté » et « Al-'Usfuriyya », ainsi que des recueils de poésie et ses mémoires, « Une vie dans l'administration »."
  tr: "Ghazi Abdulrahman Al-Gosaibi (1940–2010), romancı, şair, diplomat ve Suudi bakanıydı; Sanayi, Elektrik, Sağlık ve Çalışma portföylerini üstlenmiş, Bahreyn ve Britanya'ya büyükelçi olarak hizmet vermiştir. Romanları arasında \"Özgürlük Dairesi\", \"Kuş\" ve \"Kapasite Tavanı\" bulunmaktadır. Ayrıca şiir koleksiyonları ve \"Yönetim Hayatı\" adlı kitabı bulunmaktadır."
  id: "Ghazi Abdulrahman Al-Gosaibi (1940–2010) adalah seorang novelis, penyair, diplomat, dan menteri Saudi yang memegang portofolio Industri, Listrik, Kesehatan, dan Tenaga Kerja, serta menjabat sebagai duta besar untuk Bahrain dan Inggris. Novel-novelnya meliputi \"Apartment of Freedom,\" \"The Bird,\" dan \"The Ceiling of Capacity.\" Ia juga memiliki kumpulan puisi dan buku \"Life in Administration.\""
