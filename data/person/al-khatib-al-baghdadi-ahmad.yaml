summary:
  ar: "الحافظ أبو بكر أحمد بن علي بن ثابت المعروف بالخطيب البغدادي، محدث بغداد ومؤرخها وخاتمة حفاظ عصره عند المتأخرين؛ ولد سنة ٣٩٢هـ وكان أبوه خطيب قرية درزيجان تحت بغداد، فسمع وله إحدى عشرة سنة، ورحل إلى البصرة وهو ابن عشرين وإلى نيسابور وهو ابن ثلاث وعشرين ثم إلى إصبهان، وحج فسمع بدمشق وصور ومكة وقرأ «صحيح البخاري» في خمسة أيام على كريمة المروزية، وخرج من بغداد بعد فتنة البساسيري سنة ٤٥١هـ فأقام بالشام ثم بصور يزور بيت المقدس حتى عاد إلى بغداد في ذي الحجة ٤٦٢هـ فسمع منه «تاريخ بغداد» البغداديون في المدرسة النظامية؛ وكان قديماً على مذهب أحمد بن حنبل فمال عليه أصحابه وآذوه فانتقل إلى مذهب الشافعي، وله نحو ستين مصنفاً؛ توفي الاثنين سابع ذي الحجة ٤٦٣هـ ودفن بباب حرب إلى جنب بشر الحافي {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  en: "The hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, known as al-Khatib al-Baghdadi — Baghdad's traditionist, its historian and, for later generations, the seal of the memorizers of his age; born in 392, son of the preacher of Darzijan below Baghdad, he began hearing hadith at eleven, journeyed to Basra at twenty, to Nishapur at twenty-three and on to Isfahan, made the hajj with hearings at Damascus, Tyre and Mecca and read Sahih al-Bukhari in five days upon Karima al-Marwaziyya, left Baghdad after the Basasiri fitna in 451 to reside in al-Sham and then Tyre, visiting Jerusalem, until he re-entered Baghdad in Dhu al-Hijja 462 and the Baghdadis heard his Tarikh Baghdad from him at the Nizamiyya madrasa; long a Hanbali, he was driven by the hostility of its partisans to the Shafi'i school; about sixty works are counted for him; he died on Monday 7 Dhu al-Hijja 463 and was buried at Bab Harb beside Bishr al-Hafi {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  ur: "حافظ ابو بکر احمد بن علی بن ثابت معروف بہ خطیب بغدادی — بغداد کے محدث، مؤرخ اور بعد والوں کی نظر میں اپنے عصر کے حفاظ کی خاتمہ؛ 392ھ میں پیدا ہوئے، والد بغداد کے قریب درزیجان کے خطیب تھے؛ گیارہ برس سے سماعت شروع کی، بیس برس میں بصرہ، تئیس میں نیشاپور اور پھر اصفہان گئے؛ حج کے سفر میں دمشق، صور اور مکہ میں سماعت کی اور کریمہ مروزیہ پر صحیح بخاری پانچ دن میں پڑھی؛ فتنہ بساسیری کے بعد 451ھ میں بغداد چھوڑ کر شام اور پھر صور میں مقیم رہے، بیت المقدس کی زیارت کرتے رہے، یہاں تک کہ ذوالحجہ 462ھ میں بغداد لوٹے اور نظامیہ مدرسہ میں لوگوں نے ان سے «تاریخ بغداد» سنی؛ پہلے حنبلی تھے مگر اہل مذہب کی مخالفت پر شافعی ہوئے؛ تقریباً ساٹھ تصانیف گنی جاتی ہیں؛ پیر کو 7 ذوالحجہ 463ھ کو فوت ہوئے اور باب حرب میں بشر حافی کے پہلو میں دفن ہوئے {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
