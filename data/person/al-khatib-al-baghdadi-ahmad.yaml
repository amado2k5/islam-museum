summary:
  ar: "الحافظ أبو بكر أحمد بن علي بن ثابت المعروف بالخطيب البغدادي، محدث بغداد ومؤرخها وخاتمة حفاظ عصره عند المتأخرين؛ ولد سنة ٣٩٢هـ وكان أبوه خطيب قرية درزيجان تحت بغداد، فسمع وله إحدى عشرة سنة، ورحل إلى البصرة وهو ابن عشرين وإلى نيسابور وهو ابن ثلاث وعشرين ثم إلى إصبهان، وحج فسمع بدمشق وصور ومكة وقرأ «صحيح البخاري» في خمسة أيام على كريمة المروزية، وخرج من بغداد بعد فتنة البساسيري سنة ٤٥١هـ فأقام بالشام ثم بصور يزور بيت المقدس حتى عاد إلى بغداد في ذي الحجة ٤٦٢هـ فسمع منه «تاريخ بغداد» البغداديون في المدرسة النظامية؛ وكان قديماً على مذهب أحمد بن حنبل فمال عليه أصحابه وآذوه فانتقل إلى مذهب الشافعي، وله نحو ستين مصنفاً؛ توفي الاثنين سابع ذي الحجة ٤٦٣هـ ودفن بباب حرب إلى جنب بشر الحافي {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  en: "The hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, known as al-Khatib al-Baghdadi — Baghdad's traditionist, its historian and, for later generations, the seal of the memorizers of his age; born in 392, son of the preacher of Darzijan below Baghdad, he began hearing hadith at eleven, journeyed to Basra at twenty, to Nishapur at twenty-three and on to Isfahan, made the hajj with hearings at Damascus, Tyre and Mecca and read Sahih al-Bukhari in five days upon Karima al-Marwaziyya, left Baghdad after the Basasiri fitna in 451 to reside in al-Sham and then Tyre, visiting Jerusalem, until he re-entered Baghdad in Dhu al-Hijja 462 and the Baghdadis heard his Tarikh Baghdad from him at the Nizamiyya madrasa; long a Hanbali, he was driven by the hostility of its partisans to the Shafi'i school; about sixty works are counted for him; he died on Monday 7 Dhu al-Hijja 463 and was buried at Bab Harb beside Bishr al-Hafi {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  ur: "حافظ ابو بکر احمد بن علی بن ثابت معروف بہ خطیب بغدادی — بغداد کے محدث، مؤرخ اور بعد والوں کی نظر میں اپنے عصر کے حفاظ کی خاتمہ؛ 392ھ میں پیدا ہوئے، والد بغداد کے قریب درزیجان کے خطیب تھے؛ گیارہ برس سے سماعت شروع کی، بیس برس میں بصرہ، تئیس میں نیشاپور اور پھر اصفہان گئے؛ حج کے سفر میں دمشق، صور اور مکہ میں سماعت کی اور کریمہ مروزیہ پر صحیح بخاری پانچ دن میں پڑھی؛ فتنہ بساسیری کے بعد 451ھ میں بغداد چھوڑ کر شام اور پھر صور میں مقیم رہے، بیت المقدس کی زیارت کرتے رہے، یہاں تک کہ ذوالحجہ 462ھ میں بغداد لوٹے اور نظامیہ مدرسہ میں لوگوں نے ان سے «تاریخ بغداد» سنی؛ پہلے حنبلی تھے مگر اہل مذہب کی مخالفت پر شافعی ہوئے؛ تقریباً ساٹھ تصانیف گنی جاتی ہیں؛ پیر کو 7 ذوالحجہ 463ھ کو فوت ہوئے اور باب حرب میں بشر حافی کے پہلو میں دفن ہوئے {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  es: "El hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, conocido como al-Khatib al-Baghdadi, el tradicionalista de Bagdad, su historiador y, para las generaciones posteriores, el sello de los memorizadores de su época; nacido en 392, hijo del predicador de Darzijan, cerca de Bagdad, comenzó a escuchar hadices a los once años, viajó a Basora a los veinte, a Nishapur a los veintitrés y luego a Isfahán, realizó el Hajj con audiencias en Damasco, Tiro y La Meca y leyó Sahih al-Bukhari en cinco días sobre Karima al-Marwaziyya, dejó Bagdad después de la fitna Basasiri en 451 para residir en al-Sham y luego en Tiro, visitando Jerusalén, hasta que volvió a entrar en Bagdad en Dhu al-Hijja 462 y los bagdadíes escucharon su Tarikh Baghdad de él en la madrasa Nizamiyya; Durante mucho tiempo seguidor de la escuela Hanbali, la hostilidad de sus partidarios lo empujó hacia la escuela Shafi'i; se le atribuyen alrededor de sesenta obras; murió el lunes 7 de Dhu al-Hijja 463 y fue enterrado en Bab Harb junto a Bishr al-Hafi {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  fr: "Le hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, connu sous le nom d'al-Khatib al-Baghdadi — le traditionniste de Bagdad, son historien et, pour les générations futures, le sceau des mémorisateurs de son époque; né en 392, fils du prédicateur de Darzijan au sud de Bagdad, il commença à écouter des hadiths à onze ans, voyagea à Bassora à vingt ans, à Nishapur à vingt-trois ans et ensuite à Ispahan, fit le hajj avec des écoutes à Damas, Tyr et La Mecque et lut le Sahih al-Bukhari en cinq jours sur Karima al-Marwaziyya, quitta Bagdad après la fitna de Basasiri en 451 pour résider à al-Sham puis à Tyr, visitant Jérusalem, jusqu'à ce qu'il revienne à Bagdad en Dhu al-Hijja 462 et que les Bagdadis entendent son Tarikh Baghdad de lui à la madrasa Nizamiyya; Longtemps hanbalite, il fut poussé par l'hostilité de ses partisans envers l'école shafi'ite; on lui attribue une soixantaine d'œuvres; il mourut le lundi 7 Dhu al-Hijja 463 et fut enterré à Bab Harb près de Bishr al-Hafi {cite:tarikh-islam-dhahabi pp. 86-107} {cite:muntazam-ibn-al-jawzi j.8 pp. 265-267}."
  tr: "Hafıza yapan Ebu Bekir Ahmed bin Ali bin Tebit, Al-Khatib Al-Baghdadi olarak bilinir, Bağdat'ın hadis âlimi ve tarihçisi, sonraki alimlere göre döneminin son ezbercisidir; 392 Hicri doğumlu babası, Bağdat'ın Darzican köyünün vaiziydi. On bir yaşında duydu, yirmi yaşında Basra'ya, yirmi üç yaşında Nişapur'a, ardından İsfahan'a gitti ve Şam, Sur ve Mekke'de hac dinledi. Beş gün içinde Sahih al-Buhari'yi Merveziye'nin kızıyla birlikte inceledi. 451 Hicri isyanından sonra Bağdat'tan ayrıldı, önce Levant'ta ve ardından Sur'da yaşadı Kudüs'ü ziyaret etti ve 462 Hicce'de Dhu al-Hijjah'da Bağdat'a döndü; burada Nizamiyya okulunda Bağdatlıların 'Bağdat Tarihi'ni duydu; eskiden Ahmed ibn Hanbal okulundaydı, ancak yoldaşları ona karşı çıktı ve zarar verdi, bu yüzden Şafii okuluna geçti. Yaklaşık altmış eser yazdı; Zulhice'nin yedinci Pazartesi günü 463 H.'de vefat etti ve Bab Harb'da Biş el-Hafi'nin yanına defnedildi {cite:Tarikh-Islam-dhahabi s. 86-107} {cite:Muntazam-ibn-al-jawzi J.8 s. 265-267}."
  id: "Pengapal Abu Bakr Ahmad ibn Ali ibn Thabit, dikenal sebagai Al-Khatib Al-Baghdadi, seorang ulama hadis dan sejarawan Baghdad, serta pengapal terakhir pada zamannya menurut ulama berikutnya; lahir pada tahun 392 H, ayahnya adalah pengkhotbah di desa Darzijan di bawah Baghdad. Ia mendengar pada usia sebelas tahun, pergi ke Basra pada usia dua puluh tiga, ke Nishapur pada usia dua puluh tiga, lalu ke Isfahan, dan melaksanakan Haji, di mana ia mendengar di Damaskus, Tirus, dan Mekah. Ia belajar Sahih al-Bukhari dalam lima hari bersama putri Marwaziyyah. Ia meninggalkan Baghdad setelah hasutan Al-Basasiri pada tahun 451 H, tinggal di Levant dan kemudian di Tyre Ia mengunjungi Yerusalem hingga kembali ke Baghdad di Dhu al-Hijjah 462 H, di mana ia mendengar darinya 'Sejarah Baghdad' orang Baghdad di sekolah Nizamiyya; ia sebelumnya berasal dari aliran Ahmad ibn Hanbal, tetapi para sahabatnya cenderung menentangnya dan menyakitinya, sehingga ia pindah ke mazhab Shafi'i. Ia menulis sekitar enam puluh karya; ia meninggal pada hari Senin, tanggal tujuh Dhu al-Hijjah 463 H, dan dimakamkan di Bab Harb di sebelah Bishr al-Hafi {cite:Tarikh-Islam-dhahabi hlm. 86-107} {cite:Muntazam-ibn-al-jawzi J.8 hlm. 265-267}."
