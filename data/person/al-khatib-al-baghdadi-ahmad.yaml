summary:
  ar: "محدّث مؤرّخ حافظ من أهل قرية من أعمال نهر الملك، صنّف «تاريخ بغداد». يحكي ابن الجوزي أن الوزير ابن المسلمة عرض عليه كتاباً أظهره بعض اليهود زعموا أنه كتاب بإسقاط الجزية عن أهل خيبر وفيه شهادات الصحابة، فقال الخطيب «هذا مزور»، فقيل من أين لك؟ قال «في الكتاب شهادة معاوية بن أبي سفيان ومعاوية أسلم يوم الفتح وخيبر كانت في سنة سبع، وفيه شهادة سعد بن معاذ وقد مات عقيب غزاة بني قريظة» فاستُحسن ذلك منه. ولما جاءت نوبة البساسيري استتر وخرج من بغداد إلى الشام فدمشق وصور وطرابلس وحلب ثم عاد سنة 462هـ، وانتهى إليه علم الحديث وصنّف فأجاد وله ستة وخمسون مصنفاً، وكان قديماً على مذهب أحمد بن حنبل فمال عليه أصحابه وآذوه فانتقل إلى مذهب الشافعي {cite:muntazam-ibn-al-jawzi j.8 p.265-267}."
  en: "A hadith scholar, historian and memorizer from a village near the Nahr al-Malik, author of the History of Baghdad."
