summary:
  ar: "طه بن عبد الباقي سرور، من أسرة نعيم، باحث مصري فيه نزعة صوفية، كتب كثيرا في المجلات المعنية بالشؤون الإسلامية وألف رسائل عن الغزالي والحلاج ورابعة العدوية وابن عربي، وتوفي بالقاهرة سنة ١٣٨٢هـ الموافقة ١٩٦٢م."
  en: "Taha ibn Abd al-Baqi Surur, of the Nu'aym family, an Egyptian researcher with a Sufi leaning who wrote much in the magazines on Islamic affairs and published books on al-Ghazali, al-Hallaj, Rabi'a al-Adawiyya and Ibn Arabi; he died in Cairo in 1382 AH, 1962 CE."
