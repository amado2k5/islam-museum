summary:
  ar: "طه بن عبد الباقي سرور، من أسرة نعيم، باحث مصري فيه نزعة صوفية، كتب كثيرا في المجلات المعنية بالشؤون الإسلامية وألف رسائل عن الغزالي والحلاج ورابعة العدوية وابن عربي، وتوفي بالقاهرة سنة ١٣٨٢هـ الموافقة ١٩٦٢م."
  en: "Taha ibn Abd al-Baqi Surur, of the Nu'aym family, an Egyptian researcher with a Sufi leaning who wrote much in the magazines on Islamic affairs and published books on al-Ghazali, al-Hallaj, Rabi'a al-Adawiyya and Ibn Arabi; he died in Cairo in 1382 AH, 1962 CE."
  es: "Taha ibn Abd al-Baqi Surur, de la familia Nu'aym, fue un investigador egipcio de tendencia sufí que escribió mucho en revistas sobre asuntos islámicos y publicó libros sobre al-Ghazali, al-Hallaj, Rabi'a al-Adawiyya e Ibn Arabi; murió en El Cairo en 1382 AH (1962 d. C.)."
  fr: "Taha ibn Abd al-Baqi Surur, de la famille Nu'aym, chercheur égyptien à tendance soufie, qui a beaucoup écrit dans des revues sur les affaires islamiques et a publié des livres sur al-Ghazali, al-Hallaj, Rabi'a al-Adawiyya et Ibn Arabi; il est mort au Caire en 1382 AH, 1962 CE."
  ur: "طحہ ابن عبد الباقی سورور، نعیم خاندان سے تعلق رکھنے والے، ایک مصری محقق جس میں ایک صوفی رجحان تھا، جس نے اسلامی امور پر رسائل میں بہت کچھ لکھا اور الغزالی، الحلاج، ربیعہ العدویہ اور ابن عربی پر کتابیں شائع کیں۔ آپ کا انتقال قاہرہ میں 1382ھ بمطابق 1962ء میں ہوا۔"
  tr: "Na'im ailesinden Taha ibn Abd al-Baqi Surur, Sufi eğilimli Mısırlı bir araştırmacıydı. İslam meseleleriyle ilgili dergilerde kapsamlı yazılar yazdı ve el-Gazali, el-Hallaj, Rabi'a al-Adawiya ve İbn Arabi üzerine eserler yazdı. 1382 Hicri yılında, yani 1962 M.S. Kahire'de öldü."
  id: "Taha ibn Abd al-Baqi Surur, dari keluarga Na'im, adalah seorang peneliti Mesir yang cenderung Sufi. Ia menulis secara luas di jurnal-jurnal yang berkaitan dengan urusan Islam dan menulis risalah tentang al-Ghazali, al-Hallaj, Rabi'a al-Adawiya, dan Ibn Arabi. Ia meninggal di Kairo pada tahun 1382 H, yang bertepatan dengan tahun 1962 M."
