summary:
  ar: "معلّم قرآن وشيخ زاوية سنوسية ليبي، وُلد سنة 1858 وقاد مقاومة برقة ضد الاحتلال الإيطالي من سنة 1911 حتى أُسر وأُعدم شنقا في معسكر سلوك في 16 سبتمبر 1931، ولُقّب بأسد الصحراء وشيخ الشهداء."
  en: "Libyan Qur'an teacher and sheikh of the Senussi order, born in 1858, who led the resistance of Cyrenaica against the Italian occupation from 1911 until his capture and hanging at the Soluch camp on 16 September 1931; he is known as the Lion of the Desert and the Sheikh of the Martyrs."
  ur: "لیبیا کے قرآن کے استاد اور سنوسی سلسلے کے شیخ، جو 1858 میں پیدا ہوئے اور 1911 سے اطالوی قبضے کے خلاف برقة کی مزاحمت کی قیادت کی، یہاں تک کہ 16 ستمبر 1931 کو سلوک کیمپ میں گرفتار کر کے پھانسی دی گئی؛ وہ اسد الصحراء اور شیخ الشہداء کے لقب سے مشہور ہیں۔"
