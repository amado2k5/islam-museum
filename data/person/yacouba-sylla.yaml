summary:
  ar: "داعية تيجاني حماوي وتاجر (ح. 1906–1988)، من أبرز تلاميذ الشيخ حماه الله ومقدّميه؛ أثار نشاطه في كايدي بجنوب موريتانيا مواجهات مع التيجانيين العمريين فحُكم عليه سنة 1930 بالنفي ثماني سنوات إلى ساساندرا بساحل العاج. استقر بعد إطلاقه سنة 1938 في غانيوا فبنى هناك مجتمعًا دينيًا يُعرف باليعقوبية وإمبراطورية تجارية من المزارع والنقل ودور السينما، وصار من أعيان مسلمي ساحل العاج وأصدقاء الرئيس هوفويه بوانيي، وتوفي في غانيوا سنة 1988."
  en: "Hamawi Tijani preacher and entrepreneur (c. 1906–1988), one of Shaykh Hamahullah's most prominent disciples and his appointed muqaddam. His preaching at Kaédi in southern Mauritania sparked clashes with the Umari Tijanis, and in 1930 he was sentenced to eight years' exile at Sassandra in Côte d'Ivoire. Released in 1938, he settled at Gagnoa and built there a religious community known as Yacoubism and a business empire of plantations, transport and cinemas, becoming a leading Muslim notable of Côte d'Ivoire and a friend of President Houphouët-Boigny; he died at Gagnoa in 1988."
  ur: "حماوی تیجانی مبلغ و تاجر (تقریباً 1906–1988)، شیخ حماہ اللہ کے نمایاں ترین شاگردوں اور ان کے مقرر کردہ مقدّموں میں سے ایک۔ جنوبی موریطانیہ کے شہر کائیدی میں ان کی تبلیغ سے عمری تیجانیوں کے ساتھ جھڑپیں ہوئیں اور 1930 میں انہیں آٹھ برس کے لیے آئیوری کوسٹ کے ساساندرا جلاوطن کر دیا گیا۔ 1938 میں رہائی کے بعد وہ گانیوا میں آباد ہوئے اور وہاں «یعقوبیہ» کے نام سے مشہور دینی برادری اور باغات، نقل و حمل اور سینما گھروں پر مشتمل کاروباری نیٹ ورک قائم کیا، آئیوری کوسٹ کے سرکردہ مسلم معززین اور صدر ہوفوے بوانی کے دوست بنے، اور 1988 میں گانیوا میں وفات پائی۔"
