summary:
  ar: "الشيخ أبو علي الصدفي؛ من مشاهير العلماء بالأندلس، وكان على المسلمين في وقعة كتندة الأمير إبراهيم بن يوسف بن تاشفين، وخرج الصدفي وقرينه في الفضل أبو عبد الله ابن الفراء غازيين فكانا ممن فقد فيها سنة أربع عشرة وخمسمائة {cite:nafh-tib-maqqari p. 465}."
  en: "Abu Ali al-Sadafi, among the most famous scholars of al-Andalus — he and his peer Ibn al-Farra went out as volunteers to the battle of Cutanda in 514 and were among the lost {cite:nafh-tib-maqqari p. 465}."
  fr: "Abu Ali al-Sadafi, parmi les savants les plus célèbres d'al-Andalus - lui et son pair Ibn al-Farra sont sortis comme volontaires à la bataille de Cutanda en 514 et ont été parmi les perdus {cite:nafh-tib-maqqari p. 465}."
  es: "Abu Ali al-Sadafi, uno de los eruditos más famosos de al-Ándalus, él y su colega Ibn al-Farra salieron como voluntarios a la batalla de Cutanda en 514 y estuvieron entre los caídos {cite:nafh-tib-maqqari p. 465}."
  ur: "ابو علی الصدفی، اندلس کے سب سے مشہور علماء میں سے ایک - وہ اور اس کے ہم عمر ابن الفارہ 514 میں کٹنڈہ کی جنگ میں رضاکاروں کے طور پر نکلے اور گمشدہ لوگوں میں شامل تھے۔ 465}۔"
  tr: "Şeyh Ebu Ali el-Sadafi, Endülüs'ün ünlü alimlerinden biriydi ve Kintada Savaşı sırasında Prens İbrahim bin Yusuf ibn Taşfin Müslümanlar arasındaydı. El-Sadafi ve erdem yoldaşı Ebu Abdullah ibn el-Farra, 1455 yılında orada kaybolanlar arasındaydı {atıf:nafh-tib-maqqari, s. 465}."
  id: "Sheikh Abu Ali al-Sadafi adalah salah satu ulama terkenal di al-Andalus, dan selama pertempuran Kintada, Pangeran Ibrahim ibn Yusuf ibn Tashfin termasuk di antara umat Muslim. Al-Sadafi dan sahabatnya, Abu Abdullah ibn al-Farra', termasuk di antara mereka yang kalah di sana pada tahun 1455 {cite:nafh-tib-maqqari, hlm. 465}."
