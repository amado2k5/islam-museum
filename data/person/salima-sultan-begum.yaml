summary:
  ar: "سليمة سلطان بيغوم (1539–1613)، إمبراطورة مغولية، ابنة كلرخ بيكم ابنة بابر وحفيدته؛ تزوجت أولًا بيرم خان سنة 1557 ثم ابن عمها أكبر سنة 1561، وكانت من كبار زوجات أكبر، قارئة وشاعرة تكتب باسم «مخفي»، ولعبت دور الوسيط بين أكبر وجهانكير."
  en: "Salima Sultan Begum (1539–1613), a Mughal empress and granddaughter of Babur through his daughter Gulrukh Begum; married first to Bairam Khan in 1557 and then to her cousin Akbar in 1561, she became a senior wife of Akbar, a reader and poet writing under the pen name Makhfi, and a mediator between Akbar and Jahangir."
  ur: "سلیمہ سلطان بیگم (1539ء–1613ء)، مغل ملکہ اور بابر کی پوتی (بیٹی گل رخ بیگم سے)؛ پہلی شادی 1557ء میں بیرم خان سے، پھر 1561ء میں اپنے چچا زاد اکبر سے ہوئی؛ اکبر کی سینئر بیویوں میں شامل، قاریہ اور «مخفی» تخلص سے شاعرہ، اور اکبر و جہانگیر کے درمیان ثالث کا کردار ادا کیا۔"
