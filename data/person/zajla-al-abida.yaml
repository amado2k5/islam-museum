label: { ar: "زجلة العابدة مولاة معاوية", en: "Zajla al-Abida, client of Mu'awiya", ur: "زجلہ العابدہ، معاویہ کی مولاۃ" }
gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل الشام، مولاة معاوية، يذكرها ابن الجوزي في «صفة الصفوة»؛ صامت حتى اسودّت وبكت حتى عمشت وصلّت حتى أُقعدت، وكانت تغسل ثياب المرابطين على الساحل، وقال سعيد بن عبد العزيز: ما بالشام ولا بالعراق أفضل من زجلة."
  en: "A devout woman of Syria, a client (mawla) of Mu'awiya, recorded by Ibn al-Jawzi in Sifat al-Safwa: she fasted until her skin darkened, wept until her eyes weakened and prayed until she could only pray seated; she washed the clothes of the frontier garrisons on the coast, and Sa'id ibn Abd al-Aziz said there was none better in Syria or Iraq."
  ur: "شام کی ایک عابدہ، معاویہ کی مولاۃ، جن کا ذکر ابن الجوزی نے «صفۃ الصفوہ» میں کیا ہے: انہوں نے اتنے روزے رکھے کہ رنگ سیاہ پڑ گیا، اتنا روئیں کہ آنکھیں کمزور ہو گئیں اور اتنی نماز پڑھی کہ بیٹھ کر پڑھنے لگیں؛ وہ ساحل پر سرحدی محافظوں کے کپڑے دھوتیں، اور سعید بن عبد العزیز نے کہا کہ شام اور عراق میں زجلہ سے افضل کوئی نہیں۔"
