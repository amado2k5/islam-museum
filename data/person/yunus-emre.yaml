summary:
  ar: "بطاقة أولية ليونس إمره، الشاعر الشعبي والمتصوف التركي الذي تُنسب إليه الروائع التركية الصوفية الأولى، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Yunus Emre, the Turkish folk poet and Sufi to whom the first great Turkish mystical poems are ascribed, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Yunus Emre, el poeta popular y sufí turco al que se atribuyen los primeros grandes poemas místicos turcos, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche provisoire de Yunus Emre, poète populaire turc et soufi à qui sont attribués les premiers grands poèmes mystiques turcs, nommé d'après une description de référence ouverte (Wikidata); son entrée al-A'lam n'est pas encore vérifiée sur la page, donc aucune date n'est indiquée."
  ur: "ترکی کے لوک شاعر اور صوفی یونس ایمرے کے لیے ڈرافٹ کارڈ جس کی پہلی عظیم ترک صوفیانہ نظمیں منسوب کی گئی ہیں، جن کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا ہے۔ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "En eski Türk Sufi başyapıtlarının atfedildiği popüler şair ve Türk mistiği Yunus Emre için ön bir kart, açık kaynak açıklamasında (Wikidata) belirtilmiştir. Çevirisi henüz Önemli Sözlük'te incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan untuk Yunus Emre, penyair populer dan mistikus Turki yang menjadi sahabat karya sufi Turki paling awal, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya belum ditinjau di Kamus Terkenal di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
