label: { ar: "ابن عائشة العباسي", en: "Ibn 'A'isha al-'Abbasi", es: "Ibn 'A'isha al-'Abbasi", fr: "Ibn 'A'isha al-'Abbasi", ur: "ابن عائشہ العباسی" }
summary:
  ar: "إبراهيم بن محمد بن عبد الوهاب بن إبراهيم الإمام أخي السفاح والمنصور من ولد العباس بن عبد المطلب، ركب إليه المأمون إلى المطبق بالليل حتى قتله سنة تسع ومائتين وقتل معه محمد بن إبراهيم الأفريقي، وهو أول عباسي صلب في الإسلام {cite:muruj-al-dhahab p. 428}."
  en: "The Imam Ibrahim's grandson — ridden to al-Mutbaq by night and killed by al-Ma'mun in 209, the first 'Abbasid crucified in Islam {cite:muruj-al-dhahab p. 428}."
  es: "El nieto del Imam Ibrahim, llevado a al-Mutbaq de noche y asesinado por al-Ma'mun en 209, el primer 'abbasí crucificado en el Islam {cita:muruj-al-dhahab p. 428}."
  fr: "Le petit-fils de l'Imam Ibrahim — monté à al-Mutbaq de nuit et tué par al-Ma'mun en 209, le premier 'Abbasside crucifié dans l'Islam {cite:muruj-al-dhahab p. 428}."
  ur: "امام ابراہیم کا پوتا - رات کو المطبق پر سوار ہوا اور 209 میں المامون کے ہاتھوں قتل ہوا، اسلام میں پہلا عباسی مصلوب ہوا 428}۔"
  tr: "İbrahim ibn Muhammed bin Abd al-Wahhab ibn Abd al-Wahhab ibn İbrahim İmam, el-Saffah ve el-Mansur'un kardeşi, el-Abbas bin Abd al-Muttalib'in soyundan gelir. Al-Ma'mun gece al-Mutabaq'a at sürer, 209 yılında onu öldürür ve Muhammed ibn İbrahim el-Afriqi de onunla birlikte öldürülür; İslam'da çarmıha gerilen ilk Abbasiler olmuştur {cite:muruj-al-dhahab, s. 428}."
  id: "Ibrahim ibn Muhammad ibn Abd al-Wahhab ibn Ibrahim sang Imam, saudara al-Saffah dan al-Mansur, keturunan al-Abbas ibn Abd al-Muttalib. Al-Ma'mun menunggang kuda ke al-Mutabaq pada malam hari hingga ia membunuhnya pada tahun 209, dan Muhammad ibn Ibrahim al-Afriqi juga dibunuh bersamanya, menjadi Abbasiyah pertama yang disalibkan dalam Islam {cite:muruj-al-dhahab, hlm. 428}."
