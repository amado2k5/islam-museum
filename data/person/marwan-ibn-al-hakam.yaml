id: person/marwan-ibn-al-hakam
class: person
roles: [caliph]
label: { ar: "مروان بن الحكم", en: "Marwan ibn al-Hakam", es: "Marwan ibn al-Hakam", fr: "Marwan ibn al-Hakam", ur: "مروان ابن الحکم" }
summary:
  ar: "مروان بن الحكم بن أبي العاص بن أمية؛ كان في جيش عبد الله بن سعد بن أبي سرح الممدود إلى إفريقية في غزوة عثمان مع أخيه الحارث بن الحكم، ثم كانت ولايته بعد موت معاوية بن يزيد وفتنة ابن الزبير. وقال يوم الجمل حين رجع الزبير وطلحة رجع الزبير ويرجع طلحة ما أبالي رميت ههنا أم ههنا فرمى طلحة في أكحله فقتله {cite:muruj-al-dhahab p. 658}، وعند المسعودي لما حول البيعة عن خالد بن يزيد إلى ابنه عبد الملك غضب خالد فقال له مروان أتكلمني يا ابن الرطبة، وكان قد تزوج بأمه فاختة ليذله، فمنهم من رأى أنها وضعت على وجهه وسادة وقعدت عليها حتى مات ومنهم من رأى أنها سقته لبناً مسموماً، وجعل يشير إليها برأسه وهو يجود بنفسه وهي تقول بأبي وأمي أنت إنه يوصيكم بي، وكانت أيامه تسعة أشهر وهلك وهو ابن ثلاث وستين سنة {cite:muruj-al-dhahab p. 84-85}"
  en: "Marwan ibn al-Hakam ibn Abi al-As ibn Umayya; he rode in Abdallah ibn Sa'd ibn Abi Sarh's reinforced army to Ifriqiya in Uthman's raid with his brother al-Harith ibn al-Hakam; his rule came later, after Mu'awiya ibn Yazid's death amid Ibn al-Zubayr's fitna."
  es: "Marwan ibn al-Hakam ibn Abi al-As ibn Umayya; cabalgó en el ejército reforzado de Abdallah ibn Sa'd ibn Abi Sarh hasta Ifriqiya en la incursión de Uthman con su hermano al-Harith ibn al-Hakam; su gobierno llegó más tarde, después de la muerte de Mu'awiya ibn Yazid en medio de la fitna de Ibn al-Zubayr."
  fr: "Marwan ibn al-Hakam ibn Abi al-As ibn Umayya; il est monté dans l'armée renforcée d'Abdallah ibn Sa'd ibn Abi Sarh en Ifriqiya lors du raid d'Uthman avec son frère al-Harith ibn al-Hakam; son règne est venu plus tard, après la mort de Mu'awiya ibn Yazid au milieu de la fitna d'Ibn al-Zubayr."
  ur: "مروان ابن الحکم ابن ابی العاص ابن امیہ؛ وہ اپنے بھائی الحارث ابن الحکم کے ساتھ عثمان کے چھاپے میں عبداللہ بن سعد ابن ابی سرح کی کمک فوج میں سوار ہو کر عفریقیہ تک پہنچا۔ ابن الزبیر کے فتنے کے درمیان معاویہ بن یزید کی موت کے بعد اس کی حکومت آئی۔"
  tr: "Mervan ibn el-Hakam ibn Ebi el-As ibn Umeyye; Abdullah ibn Sa'd ibn Abi Sarh'ın ordusundaydı; Abdullah ibn Sa'd ibn Abi Sarh, Osman Savaşı sırasında kardeşi el-Haris bin Hakam ile birlikte Ifriqiye'ye kadar uzandı. Daha sonra valiliği, Muaviye bin Yezid'in ölümü ve İbn el-Zubeyr'in isyanından sonra geldi. Dedi ki: Deve günü, el-Zubeyr ve Talha döndüğünde, el-Zubeyr geri döndü ve Talha geri döndü, Umurumda değildi, onu buraya oraya attım, Talha ise deveyi bileğine attı ve onu öldürdü {alıntı: Muric-al-Dhahab, s. 658}. Al-Mas'udi'ye göre, Halid bin Yezid'den sadakat yemini oğlu Abd al-Malik'e devrettiğinde Halid sinirlendi ve ona, \"Marwan, bana konuş, el-Rutbah'ın oğlu\" dedi. Annesiyle evlenmiş ve onu küçük düşürmek için götürmüştü. Bazıları annesinin yüzüne yastık koyup onun ölene kadar oturduğunu görürken, diğerleri ona zehirli süt verdiğini gördü. Kendisine cömert davranarak başını ona işaret ederek, \"Babam ve annem adına beni bana emanet eden sensin.\" dedi. Dokuz aylıktı ve altmış üç yaşında öldü {cite:muruj-al-dhahab s. 84-85}"
  id: "Marwan ibn al-Hakam ibn Abi al-As ibn Umayyah; ia berada dalam pasukan Abdullah ibn Sa'd ibn Abi Sarh, yang kemudian diperluas ke Ifriqiya selama Pertempuran Uthman bersama saudaranya al-Harith ibn al-Hakam. Kemudian masa jabatannya terjadi setelah kematian Muawiyah ibn Yazid dan pemberontakan Ibn al-Zubayr. Dia berkata: Pada hari Unta, ketika al-Zubair dan Talha kembali, al-Zubair kembali, dan Talha kembali, aku tidak peduli, aku melemparkannya ke sana kemari, jadi Talha melemparkannya ke pergelangan kakinya dan membunuhnya {cite:Muruj-al-Dhahab, hlm. 658}. Menurut al-Mas'udi, ketika ia memindahkan sumpah setia dari Khalid ibn Yazid kepada putranya Abd al-Malik, Khalid marah dan berkata kepadanya, \"Marwan, bicaralah padaku, putra al-Rutbah.\" Ia telah menikahi ibunya dan membawanya untuk mempermalukannya. Beberapa melihat bahwa ibunya meletakkan bantal di wajahnya dan duduk di atasnya sampai ia meninggal, sementara yang lain melihat bahwa ibunya memberinya susu beracun. Ia menunjuk ke arahnya dengan kepalanya sambil bersikap murah hati pada dirinya sendiri, berkata, \"Atas nama ayah dan ibuku, kau yang mempercayakanku kepadaku.\" Ia berusia sembilan bulan dan meninggal pada usia enam puluh tiga {cite:muruj-al-dhahab hlm. 84-85}"
