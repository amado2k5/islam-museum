label: { ar: "مروان بن الحكم", en: "Marwan ibn al-Hakam" }
summary:
  ar: "مروان بن الحكم بن أبي العاص بن أمية؛ كان في جيش عبد الله بن سعد بن أبي سرح الممدود إلى إفريقية في غزوة عثمان مع أخيه الحارث بن الحكم، ثم كانت ولايته بعد موت معاوية بن يزيد وفتنة ابن الزبير.، وقال يوم الجمل حين رجع الزبير وطلحة رجع الزبير ويرجع طلحة ما أبالي رميت ههنا أم ههنا فرمى طلحة في أكحله فقتله {cite:muruj-al-dhahab p. 658}"
  en: "Marwan ibn al-Hakam ibn Abi al-As ibn Umayya; he rode in Abdallah ibn Sa'd ibn Abi Sarh's reinforced army to Ifriqiya in Uthman's raid with his brother al-Harith ibn al-Hakam; his rule came later, after Mu'awiya ibn Yazid's death amid Ibn al-Zubayr's fitna."
