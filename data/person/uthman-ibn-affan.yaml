perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition venerates Uthman as the third rightly-guided caliph: modest and generous, the preserver who gave the community one recension of the Qur'an, and a martyr killed unjustly.", ar: "تُجِلّه السنة ثالث الخلفاء الراشدين: حييًّا كريمًا، وحافظ نص القرآن، وشهيدًا قُتل ظلمًا." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: academic
    id: academic
    summary: { en: "Historians record both his standardization of the Qur'an and the grievances — appointments of kinsmen, fiscal policy — that fed the revolt which killed him; the sources are early but partisan.", ar: "يحفظ المؤرخون توحيد المصحف والشكاوى معًا — تولية الأقارب والمالية — التي غذّت الثورة؛ والمصادر الأولى متخاصمة." }
    sources: [source/watt-1956-medina]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition is critical of Uthman's caliphate, seeing in it the entrenchment of the Umayyads and further sidelining of the Prophet's household.", ar: "ينتقد التراث الإمامي خلافته ويراها رسّخت الأمويين وأقصت آل البيت." }
    sources: [source/momen-1985]
