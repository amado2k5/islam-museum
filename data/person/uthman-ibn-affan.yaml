summary:
  en: "Third caliph (644–656); the early community married him to two of the Prophet's daughters in succession. Under him the Qur'an was standardized into a single recension; he was killed by rebels in Medina, opening the first civil war."
  ar: "ثالث الخلفاء الراشدين (644–656م)؛ تزوج اثنتين من بنات النبي تباعًا. في عهده جُمع القرآن في مصحف معتمد؛ وقُتل على يد ثائرين في المدينة فافتُتحت الفتنة الأولى. وكان في نهاية الجود فسلك عماله طريقته، وخلف عند خازنه خمسين ومائة ألف دينار وألف ألف درهم وضياعاً بوادي القرى وحنين بمائة ألف دينار، ودفن بحش كوكب وكان ابن اثنتين وثمانين سنة {cite:muruj-al-dhahab p. 627-628}. ودافع ابن عمر عنه في الصحيح: أما فراره يوم أحد فالله قد عفا عنه، وأما تغيبه عن بدر فكانت تحته رقية بنت النبي مريضة فقال له «إن لك أجر رجل ممن شهد بدراً وسهمه»، وأما تغيبه عن بيعة الرضوان فلو كان أعزّ ببطن مكة منه لبعثه رسولاً {cite:sahih-al-bukhari 3699}. وعند مسلم جلس النبي لدخوله فسوّى ثيابه وقال لعائشة «ألا أستحي من رجل تستحي منه الملائكة» {cite:sahih-muslim 2401}."
