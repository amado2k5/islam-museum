id: person/abu-inan-faris
class: person
label:
  ar: أبو عنان فارس المريني
  en: Abu Inan Faris al-Marini
summary:
  ar: "أبو عنان فارس بن علي المريني، سلطان بني مرين الذي وثب على الأمر حين كان أبوه أبو الحسن محاصراً بالقيروان في هوة واقعة العرب سنة 749هـ، فدعا لنفسه ورحل إلى المغرب وانتحر أباه عند عودته، ثم تغلب على تلمسان سنة 753هـ وعلى إفريقية سنة 758هـ فملك ما ملك الأسلاف من البلاد، وبنى المدارس المشهورة بفاس ومكناس وبها درس ابن خلدون نفسه، حتى قتله وزيره سنة 759هـ."
  en: "Abu Inan Faris ibn Ali al-Marini, the Marinid sultan who seized power while his father Abu al-Hasan lay besieged at Kairouan after the Arab rout of 749 AH, claimed the throne and forced his father's abdication on his return, then took Tlemcen in 753 AH and Ifriqiya in 758 AH, ruling the full ancestral realm and building the famed madrasas of Fez and Meknes where Ibn Khaldun himself studied, until his vizier had him killed in 759 AH."
