label:
  ar: أبو عنان فارس المريني
  en: Abu Inan Faris al-Marini
  fr: "Abu Inan Faris al-Marini"
  es: "Abu Inan Faris al-Marini"
summary:
  ar: "أبو عنان فارس بن علي المريني، سلطان بني مرين الذي وثب على الأمر حين كان أبوه أبو الحسن محاصراً بالقيروان في هوة واقعة العرب سنة 749هـ، فدعا لنفسه ورحل إلى المغرب وانتحر أباه عند عودته، ثم تغلب على تلمسان سنة 753هـ وعلى إفريقية سنة 758هـ فملك ما ملك الأسلاف من البلاد، وبنى المدارس المشهورة بفاس ومكناس وبها درس ابن خلدون نفسه، حتى قتله وزيره سنة 759هـ."
  en: "Abu Inan Faris ibn Ali al-Marini, the Marinid sultan who seized power while his father Abu al-Hasan lay besieged at Kairouan after the Arab rout of 749 AH, claimed the throne and forced his father's abdication on his return, then took Tlemcen in 753 AH and Ifriqiya in 758 AH, ruling the full ancestral realm and building the famed madrasas of Fez and Meknes where Ibn Khaldun himself studied, until his vizier had him killed in 759 AH."
  fr: "Abu Inan Faris ibn Ali al-Marini, le sultan mérinide qui s'empara du pouvoir pendant que son père Abu al-Hasan était assiégé à Kairouan après la déroute face aux Arabes en 749 H, revendiqua le trône et contraignit son père à abdiquer à son retour, puis prit Tlemcen en 753 H et l'Ifriqiya en 758 H, régnant sur tout le royaume ancestral et bâtissant les célèbres madrasas de Fès et de Meknès où Ibn Khaldun lui-même étudia, jusqu'à ce que son vizir le fasse tuer en 759 H."
  es: "Abu Inan Faris ibn Ali al-Marini, el sultán mariní que tomó el poder mientras su padre Abu al-Hasan estaba asediado en Kairouan tras la derrota árabe del año 749 AH, reclamó el trono y forzó la abdicación de su padre a su regreso. Luego tomó Tlemcen en el año 753 AH e Ifriqiya en el año 758 AH, gobernando todo el reino ancestral y construyendo las famosas madrasas de Fez y Meknes, donde el propio Ibn Khaldun estudió, hasta que su visir lo mandó matar en el año 759 AH."
