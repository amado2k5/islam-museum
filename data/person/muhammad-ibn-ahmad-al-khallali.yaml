summary:
  ar: "محمد بن أحمد بن علي الخلالي، أبو بكر، من أصحاب المزني والربيع، ذكره العبادي، وروى عنه أبو الحسن أحمد بن محمد بن الحسن المقرئ. قال المقرئ: هو ثقة صاحب المزني والربيع {cite:tabaqat-shafiiyya-subki p. 288}."
  en: "Muhammad ibn Ahmad al-Khallali, Abu Bakr — a companion of al-Muzani and al-Rabi' in the Shafi'i circle; graded thiqa, transmitted to Ahmad b. Muhammad al-Muqri' {cite:tabaqat-shafiiyya-subki p. 288}."
  ur: "محمد بن احمد خلالی، ابو بکر — امام مزنی اور ربیع کے صاحبزادے میں سے؛ ثقہ، احمد بن محمد مقری ان سے روایت کرتے ہیں {cite:tabaqat-shafiiyya-subki p. 288}."
