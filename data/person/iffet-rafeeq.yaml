summary:
  ar: "عالمة ومعلمة بريطانية وُلدت ونشأت في المملكة المتحدة من أصل جنوب آسيوي وتقيم حاليًا في كيب تاون؛ أتمّت دورة العالمية في بريطانيا ونالت منحة للدراسة في الأزهر بالقاهرة، ودرّست العقيدة في كلية حسنات، وشاركت في تأسيس منظمة «من غبار إلى ألماس» للدعوة والإرشاد ومعهد وتطبيق «الفانوس الأزرق»، وتشتهر بدورتها «الفصول الداخلية» في صحة المرأة والدورة الشهرية من منظور إسلامي."
  en: "British scholar and teacher, born and raised in the UK of South Asian heritage and now residing in Cape Town. She completed the classical 'Aalimah course in the UK, won a scholarship to Al-Azhar in Cairo, taught theology at City Hasanat College, and co-founded the Dust To Diamonds dawah and counselling organisation and the Blue Lantern Institute and app. She is known for her 'Seasons Within' teaching on women's health and the menstrual cycle from an Islamic perspective."
  ur: "برطانوی عالمہ اور معلمہ، برطانیہ میں پیدا ہوئیں اور پلی بڑھیں، جنوبی ایشیائی پس منظر رکھتی ہیں اور اب کیپ ٹاؤن میں مقیم ہیں۔ انہوں نے برطانیہ میں کلاسیکی عالمیہ کورس مکمل کیا، قاہرہ کی الازہر یونیورسٹی کے لیے اسکالرشپ حاصل کی، حسنات کالج میں عقیدہ پڑھایا، اور «ڈسٹ ٹو ڈائمنڈز» دعوہ و مشاورت تنظیم اور «بلیو لالٹین» انسٹیٹیوٹ و ایپ کی شریک بانی ہیں۔ وہ اسلامی نقطۂ نظر سے خواتین کی صحت اور ماہواری پر اپنی «سیزنز ودِن» تدریس کے لیے معروف ہیں۔"
