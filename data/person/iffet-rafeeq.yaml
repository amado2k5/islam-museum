summary:
  ar: "عالمة ومعلمة بريطانية وُلدت ونشأت في المملكة المتحدة من أصل جنوب آسيوي وتقيم حاليًا في كيب تاون؛ أتمّت دورة العالمية في بريطانيا ونالت منحة للدراسة في الأزهر بالقاهرة، ودرّست العقيدة في كلية حسنات، وشاركت في تأسيس منظمة «من غبار إلى ألماس» للدعوة والإرشاد ومعهد وتطبيق «الفانوس الأزرق»، وتشتهر بدورتها «الفصول الداخلية» في صحة المرأة والدورة الشهرية من منظور إسلامي."
  en: "British scholar and teacher, born and raised in the UK of South Asian heritage and now residing in Cape Town. She completed the classical 'Aalimah course in the UK, won a scholarship to Al-Azhar in Cairo, taught theology at City Hasanat College, and co-founded the Dust To Diamonds dawah and counselling organisation and the Blue Lantern Institute and app. She is known for her 'Seasons Within' teaching on women's health and the menstrual cycle from an Islamic perspective."
  ur: "برطانوی عالمہ اور معلمہ، برطانیہ میں پیدا ہوئیں اور پلی بڑھیں، جنوبی ایشیائی پس منظر رکھتی ہیں اور اب کیپ ٹاؤن میں مقیم ہیں۔ انہوں نے برطانیہ میں کلاسیکی عالمیہ کورس مکمل کیا، قاہرہ کی الازہر یونیورسٹی کے لیے اسکالرشپ حاصل کی، حسنات کالج میں عقیدہ پڑھایا، اور «ڈسٹ ٹو ڈائمنڈز» دعوہ و مشاورت تنظیم اور «بلیو لالٹین» انسٹیٹیوٹ و ایپ کی شریک بانی ہیں۔ وہ اسلامی نقطۂ نظر سے خواتین کی صحت اور ماہواری پر اپنی «سیزنز ودِن» تدریس کے لیے معروف ہیں۔"
  es: "Académica y docente británica, nacida y criada en el Reino Unido, de ascendencia del sur de Asia y residente actualmente en Ciudad del Cabo. Completó el curso clásico de 'Aalimah en el Reino Unido, obtuvo una beca para Al-Azhar en El Cairo, impartió clases de teología en el City Hasanat College y cofundó la organización de prédica y asesoramiento Dust To Diamonds, así como el Instituto y la aplicación Blue Lantern. Es reconocida por su enseñanza \"Seasons Within\" sobre la salud de la mujer y el ciclo menstrual desde una perspectiva islámica."
  fr: "Universitaire et enseignante britannique, née et élevée au Royaume-Uni, d'origine sud-asiatique, elle réside actuellement au Cap. Après avoir suivi le cursus classique d'Aalimah au Royaume-Uni, obtenu une bourse pour Al-Azhar au Caire, elle a enseigné la théologie au City Hasanat College et cofondé l'organisation de prédication et de conseil Dust To Diamonds, ainsi que le Blue Lantern Institute et son application. Elle est reconnue pour son enseignement « Seasons Within » sur la santé des femmes et le cycle menstruel d'un point de vue islamique."
  tr: "Birleşik Krallık'ta doğup büyümüş, Güney Asya kökenli ve şu anda Cape Town'da yaşayan bir İngiliz bilim insanı ve öğretmen; Britanya'da Al-Alamiya kursunu tamamladı, Kahire'deki Al-Azhar'da eğitim almak için burs aldı, Hasanat Koleji'nde mezun eğitimi aldı, 'Tozdan Elmas'a savunuculuk ve rehberlik için organizasyonun ve 'Blue Lantern' Enstitüsü ve Uygulaması'nın kurulmasına katıldı. İslami bakış açısından kadın sağlığı ve adet üzerine 'Yatılı Sınıflar' kursuyla tanınır."
  id: "Seorang ilmuwan dan guru asal Inggris yang lahir dan besar di Inggris dengan keturunan Asia Selatan dan saat ini tinggal di Cape Town; ia menyelesaikan kursus Al-Alamiya di Inggris, menerima beasiswa untuk belajar di Al-Azhar di Kairo, belajar agama di Hasanat College, berpartisipasi dalam pendirian organisasi 'From Dust to Diamonds' untuk advokasi dan bimbingan, serta 'Blue Lantern' Institute and Application. Ia dikenal lewat mata kuliahnya 'Boarding Classes' tentang kesehatan perempuan dan menstruasi dari perspektif Islam."
