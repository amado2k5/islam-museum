  ar: "خطاط أمريكي، وُلد سنة 1942 في كاليفورنيا. نال الإجازة في الخط من إسطنبول وأصبح أبرز معلم للخط الإسلامي الكلاسيكي في الغرب، وصمم طابع العيد للبريد الأمريكي، وتعرض أعماله في متاحف كبرى."
