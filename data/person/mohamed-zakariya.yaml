  es: "Maestro calígrafo estadounidense, nacido en 1942 en California. Obtuvo su ijaza en Estambul y se convirtió en el principal maestro occidental de caligrafía islámica clásica, diseñando el sello de Eid del Servicio Postal de los Estados Unidos y exponiendo en importantes museos."
  fr: "Maître calligraphe américain, né en 1942 en Californie. Il obtint ses ijazas à Istanbul et devint le plus éminent professeur occidental de calligraphie islamique classique, concevant notamment le timbre de l'Aïd de l'USPS et exposant dans de grands musées."
