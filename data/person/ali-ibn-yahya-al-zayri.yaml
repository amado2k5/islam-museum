summary:
  ar: "علي بن يحيى بن تميم الصنهاجي؛ صاحب إفريقية؛ ولّاه أبوه سفاقس فلما مات أبوه اجتمع أعيان دولته على كتاب كتبوه إليه يأمرونه بالوصول مسرعاً فوصل الظهر ثاني يوم العيد وجلس للناس صبيحة الجمعة ثالث عشر ذي الحجة فسلموا بالإمارة؛ ولم تزل أموره جارية على السداد إلى أن توفي يوم الثلاثاء بعد أن فوض الأمر من بعده إلى ولده الحسن بن علي {cite:wafayat-ayan}."
  en: "Ali b. Yahya al-Sanhaji (b. Safar 499, al-Mahdiyya) — Zirid ruler of Ifriqiya; summoned from Sfax at his father's death and acclaimed on 13 Dhu al-Hijja; ruled soundly until his death, delegating the succession to his twelve-year-old son al-Hasan {cite:wafayat-ayan}."
