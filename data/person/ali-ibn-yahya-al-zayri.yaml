summary:
  ar: "علي بن يحيى بن تميم الصنهاجي؛ صاحب إفريقية؛ ولّاه أبوه سفاقس فلما مات أبوه اجتمع أعيان دولته على كتاب كتبوه إليه يأمرونه بالوصول مسرعاً فوصل الظهر ثاني يوم العيد وجلس للناس صبيحة الجمعة ثالث عشر ذي الحجة فسلموا بالإمارة؛ ولم تزل أموره جارية على السداد إلى أن توفي يوم الثلاثاء بعد أن فوض الأمر من بعده إلى ولده الحسن بن علي {cite:wafayat-ayan}."
  en: "Ali b. Yahya al-Sanhaji (b. Safar 499, al-Mahdiyya) — Zirid ruler of Ifriqiya; summoned from Sfax at his father's death and acclaimed on 13 Dhu al-Hijja; ruled soundly until his death, delegating the succession to his twelve-year-old son al-Hasan {cite:wafayat-ayan}."
  es: "Ali b. Yahya al-Sanhaji (n. Safar 499, al-Mahdiyya) — Gobernante zirí de Ifriqiya; llamado desde Sfax a la muerte de su padre y aclamado el 13 de Dhu al-Hijja; gobernó sólidamente hasta su muerte, delegando la sucesión a su hijo de doce años al-Hasan {cite:wafayat-ayan}."
  fr: "Ali b. Yahya al-Sanhaji (né en Safar 499, al-Mahdiyya) — souverain ziride d'Ifriqiya; appelé de Sfax à la mort de son père et acclamé le 13 Dhu al-Hijja; a régné avec sagesse jusqu'à sa mort, déléguant la succession à son fils al-Hasan, âgé de douze ans {cite:wafayat-ayan}."
  ur: "علی بی یحییٰ السنہجی ⁦(ب. صفر 499، المہدیہ)⁩ - افریقیہ کا زرد حکمران؛ اپنے والد کی وفات پر Sfax سے طلب کیا گیا اور 13 ذی الحجہ کو تعریف کی گئی۔ اس نے اپنی موت تک اچھی طرح حکومت کی اور جانشینی اپنے بارہ سالہ بیٹے الحسن کو سونپ دی۔"
  tr: "İfrikiye hükümdarı Ali ibn Yahya ibn Tamim al-Sanhaji, babası Saffaqi tarafından atandı. Babası öldüğünde, devletinin ileri gelenleri ona hızlıca gelmesini emrettikleri bir mektup etrafında toplandı. Bayramın ikinci günü öğle vakti geldi ve Cuma sabahı, Zulhice'nin on üçüncü gününde halkla oturdu ve valilik kabul edildi. İşleri Salı günü vefat edene kadar devam etti, ardından oğlu el-Hasan ibn Ali'ye emanet edildi {alıntı:vafayat-ayan}."
  id: "Ali ibn Yahya ibn Tamim al-Sanhaji, penguasa Ifriqiya, diangkat oleh ayahnya Saffaqis. Ketika ayahnya meninggal, para bangsawan negaranya berkumpul di sekitar surat yang mereka tulis kepadanya yang memerintahkannya untuk segera datang. Ia tiba pada tengah hari hari kedua Idul Fitri, dan duduk bersama rakyat pada pagi hari Jumat, tanggal tiga belas Dhu al-Hijjah, dan mereka menerima jabatan gubernur. Urusannya tetap berjalan hingga ia meninggal pada hari Selasa, setelah itu ia dipercayakan kepada putranya al-Hasan ibn Ali {cite:wafayat-ayan}."
