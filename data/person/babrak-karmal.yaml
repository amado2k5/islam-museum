summary:
  ar: "سياسي شيوعي أفغاني، وُلد باسم سلطان حسين سنة 1929 في كاماري قرب كابل. شارك في تأسيس حزب الشعب الديمقراطي الأفغاني وقاد فصيله برچم، ونصّبه التدخل السوفيتي رئيسا للدولة في ديسمبر 1979 بعد اغتيال حفيظ الله أمين، فبقي حتى عزله سنة 1986 ونفيه إلى موسكو، وعاد إلى أفغانستان سنة 1991 ثم غادرها نهائيا، وتوفي في موسكو في ديسمبر 1996 بسرطان الكبد."
  en: "Afghan communist politician, born as Sultan Hussein in 1929 at Kamari near Kabul. He co-founded the People's Democratic Party of Afghanistan and led its Parcham faction; the Soviet intervention installed him as head of state in December 1979 after the assassination of Hafizullah Amin. He held power until his removal in 1986 and exile to Moscow, returned to Afghanistan in 1991 and later left for good, and died in Moscow in December 1996 of liver cancer."
  ur: "افغان کمیونسٹ سیاست دان، جو 1929ء میں کابل کے قریب کماری میں سلطان حسین کے نام سے پیدا ہوئے۔ انھوں نے پیپلز ڈیموکریٹک پارٹی آف افغانستان کی تاسیس میں حصہ لیا اور اس کے پرچم دھڑے کی قیادت کی؛ سوویت مداخلت نے حفیظ اللہ امین کے قتل کے بعد دسمبر 1979ء میں انھیں سربراہِ مملکت بنا دیا۔ 1986ء میں معزولی اور ماسکو جلاوطنی تک اقتدار میں رہے، 1991ء میں افغانستان واپس آئے اور پھر مستقل روانہ ہو گئے، اور دسمبر 1996ء میں ماسکو میں جگر کے کینسر سے انتقال کر گئے۔"
