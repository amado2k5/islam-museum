summary:
  ar: "بطرس الأكبر قيصر روسيا الذي ذكرته دائرة المعارف الإسلامية في سياق علاقة روسيا بالدولة العثمانية وفارس وآسيا الوسطى. استولى على آزاق سنة 1696م وأُجبر على التخلي عنها بمعاهدة بروت سنة 1711م، وتدخل في شمال القوقاز وساحل بحر قزوين وبلغ دربند سنة 1722م، وأرسل بعثة إلى خيوة سنة 1717م {cite:encyclopaedia-of-islam-2 vol. 1 p. 857} {cite:encyclopaedia-of-islam-2 vol. 2 p. 101}."
  en: "Peter the Great, tsar of Russia, appears in the Encyclopaedia of Islam through Russia's relations with the Ottoman Empire, Persia and Central Asia. He took Azak in 1696 and gave it up under the Treaty of the Prut in 1711, intervened on the western Caspian shore and occupied Derbend in 1722, and sent an expedition against Khiva in 1717 {cite:encyclopaedia-of-islam-2 vol. 1 p. 857} {cite:encyclopaedia-of-islam-2 vol. 2 p. 101}."
  ur: "پیٹر اعظم روس کے زار تھے اور دائرۃ المعارف الاسلامیہ میں ان کا ذکر روس کے عثمانیوں، ایران اور وسطی ایشیا سے تعلقات کے ضمن میں آتا ہے۔ انہوں نے 1696ء میں آزاق لیا اور 1711ء کے معاہدۂ پروت کے تحت اسے چھوڑنا پڑا، 1722ء میں بحیرۂ قزوین کے مغربی ساحل میں مداخلت کر کے دربند پر قبضہ کیا، اور 1717ء میں خیوا کی طرف مہم بھیجی {cite:encyclopaedia-of-islam-2 vol. 1 p. 857} {cite:encyclopaedia-of-islam-2 vol. 2 p. 101}۔"
