summary:
  ar: "أمانغكورات الثاني (توفي 1703)، وُلد باسم رادن ماس رحمة ولُقّب سونان أمرال، سوسوهونان ماتارام من 1677 إلى 1703 وأكبر أبناء أمانغكورات الأول. كان وليّ عهد ثار على والده، ثم مموّل تمرّد تروناجايا الذي صار خصمه، فخلف والده الذي مات في فراره سنة 1677، واستعاد المملكة بسلاح الشركة الهولندية بموجب معاهدة جيبارا في أيلول 1677، وقتل تروناجايا بيده في 2 كانون الثاني 1680، وأسّس كارتاسورا عاصمة له، وترك لابنه أمانغكورات الثالث عرشًا مثقلًا بديون الحرب وبالنفوذ الهولندي."
  en: "Amangkurat II (died 1703), born Raden Mas Rahmat and nicknamed Sunan Amral, was susuhunan of Mataram from 1677 to 1703, the eldest son of Amangkurat I. Crown prince in rebellion against his father and then financier-turned-rival of the Trunajaya rebellion, he succeeded on his father's death in flight in 1677, regained the kingdom with Dutch East India Company arms under the Jepara treaty of September 1677, killed Trunajaya with his own hands on 2 January 1680, founded Kartasura as his capital, and left his son Amangkurat III a throne encumbered by war debt and Dutch control."
  ur: "امانگکورات دوم (وفات 1703ء)، پیدائشی نام رادن ماس رحمت اور لقب سونان امرال، 1677ء سے 1703ء تک ماتارام کے سوسوہونان تھے، امانگکورات اول کے بڑے بیٹے۔ ولی عہد کی حیثیت سے والد کے خلاف اٹھے، پھر تروناجایا کی بغاوت کے سرمایہ کار بن کر اسی کے حریف بن گئے؛ 1677ء میں فرار کے دوران والد کی وفات پر جانشین ہوئے، ستمبر 1677ء کے جیپارا معاہدے کے تحت ولندیزی کمپنی کے اسلحے سے سلطنت واپس لی، 2 جنوری 1680ء کو تروناجایا کو اپنے ہاتھ سے قتل کیا، کارتاسورا کو دارالحکومت بنایا، اور بیٹے امانگکورات سوم کے لیے جنگی قرض اور ولندیزی تسلط سے دبا تخت چھوڑا۔"

