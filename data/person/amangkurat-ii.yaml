summary:
  ar: "أمانغكورات الثاني ⁦(توفي 1703)⁩، وُلد باسم رادن ماس رحمة ولُقّب سونان أمرال، سوسوهونان ماتارام من 1677 إلى 1703 وأكبر أبناء أمانغكورات الأول. كان وليّ عهد ثار على والده، ثم مموّل تمرّد تروناجايا الذي صار خصمه، فخلف والده الذي مات في فراره سنة 1677، واستعاد المملكة بسلاح الشركة الهولندية بموجب معاهدة جيبارا في أيلول 1677، وقتل تروناجايا بيده في 2 كانون الثاني 1680، وأسّس كارتاسورا عاصمة له، وترك لابنه أمانغكورات الثالث عرشًا مثقلًا بديون الحرب وبالنفوذ الهولندي."
  en: "Amangkurat II (died 1703), born Raden Mas Rahmat and nicknamed Sunan Amral, was susuhunan of Mataram from 1677 to 1703, the eldest son of Amangkurat I. Crown prince in rebellion against his father and then financier-turned-rival of the Trunajaya rebellion, he succeeded on his father's death in flight in 1677, regained the kingdom with Dutch East India Company arms under the Jepara treaty of September 1677, killed Trunajaya with his own hands on 2 January 1680, founded Kartasura as his capital, and left his son Amangkurat III a throne encumbered by war debt and Dutch control."
  ur: "امانگکورات دوم ⁦(وفات 1703ء)⁩، پیدائشی نام رادن ماس رحمت اور لقب سونان امرال، 1677ء سے 1703ء تک ماتارام کے سوسوہونان تھے، امانگکورات اول کے بڑے بیٹے۔ ولی عہد کی حیثیت سے والد کے خلاف اٹھے، پھر تروناجایا کی بغاوت کے سرمایہ کار بن کر اسی کے حریف بن گئے؛ 1677ء میں فرار کے دوران والد کی وفات پر جانشین ہوئے، ستمبر 1677ء کے جیپارا معاہدے کے تحت ولندیزی کمپنی کے اسلحے سے سلطنت واپس لی، 2 جنوری 1680ء کو تروناجایا کو اپنے ہاتھ سے قتل کیا، کارتاسورا کو دارالحکومت بنایا، اور بیٹے امانگکورات سوم کے لیے جنگی قرض اور ولندیزی تسلط سے دبا تخت چھوڑا۔"
  es: "Amangkurat II (fallecido en 1703), nacido Raden Mas Rahmat y apodado Sunan Amral, fue susuhunan de Mataram desde 1677 hasta 1703, hijo mayor de Amangkurat I. Príncipe heredero en rebelión contra su padre y luego financiero convertido en rival de la rebelión de Trunajaya, sucedió a su padre tras su muerte en fuga en 1677, recuperó el reino con armas de la Compañía Holandesa de las Indias Orientales bajo el tratado de Jepara de septiembre de 1677, mató a Trunajaya con sus propias manos el 2 de enero de 1680, fundó Kartasura como su capital y dejó a su hijo Amangkurat III un trono lastrado por deudas de guerra y bajo el control holandés."
  fr: "Amangkurat II (mort en 1703), né Raden Mas Rahmat et surnommé Sunan Amral, fut susuhunan de Mataram de 1677 à 1703, fils aîné d'Amangkurat I. Prince héritier en rébellion contre son père, puis financier devenu rival de la rébellion de Trunajaya, il succéda à son père, mort en fuite en 1677, reconquit le royaume avec les armes de la Compagnie néerlandaise des Indes orientales en vertu du traité de Jepara de septembre 1677, tua Trunajaya de ses propres mains le 2 janvier 1680, fonda Kartasura comme capitale et laissa à son fils Amangkurat III un trône grevé de dettes de guerre et sous contrôle néerlandais."
  tr: "Amangakurat II (ö. 1703), Raden Maas Rahma olarak doğdu ve unvanı Sunan Amral, 1677'den 1703'e kadar Susuhunan Mataram idi ve Amangakurat I'in en büyük oğluydu. Babası karşısında isyan eden bir veliaht prensti, ardından rakibi haline gelen Trunajaya isyanını finanse etti. 1677'de kaçışta ölen babasının yerine geçti, Eylül 1677'de Jibara Antlaşması ile Hollanda şirketinin armasıyla krallığı geri aldı, 2 Ocak 1680'de Trunajaya'yı kendi elleriyle öldürdü, Kartasura'yı başkent etti ve oğlu Amangakurat III'e savaş borçları ve Hollanda etkisiyle yüklenmiş bir taht bıraktı."
  id: "Amangakurat II (meninggal 1703), lahir dengan nama Raden Maas Rahma dengan gelar Sunan Amral, adalah Susuhunan Mataram dari tahun 1677 hingga 1703, dan merupakan putra sulung Amangakurat I. Ia adalah putra mahkota yang memberontak melawan ayahnya, kemudian membiayai pemberontakan Trunajaya yang menjadi rivalnya. Ia menggantikan ayahnya, yang meninggal dalam pelarian pada tahun 1677, merebut kembali kerajaan dengan lambang perusahaan Belanda berdasarkan Perjanjian Jibara pada September 1677, membunuh Trunajaya dengan tangannya sendiri pada 2 Januari 1680, menetapkan Kartasura sebagai ibu kotanya, dan meninggalkan putranya Amangakurat III sebagai takhta yang dibebani utang perang dan pengaruh Belanda."

