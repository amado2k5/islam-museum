summary:
  ar: "فيروز ميرشانت (وُلد سنة 1958) رجل أعمال ومحسن هندي مقيم في دبي، مؤسس مجموعة بيور غولد ورئيس مجلس إدارتها، التي أسس ضمنها مجوهرات بيور غولد سنة 1989. اشتهر في الإمارات بمبادرته «المجتمع المنسي» التي تسدد منذ سنة 2008 ديون السجناء المعسرين لإطلاق سراحهم، وبحملات عطائه في مواسم رمضان."
  en: "Firoz Merchant (born 1958) is an Indian businessman and philanthropist based in Dubai, founder and chairman of the Pure Gold Group, whose Pure Gold Jewellers he established in 1989. He is widely known in the Emirates for his 'Forgotten Society' initiative, which since 2008 has settled the debts of insolvent prisoners so that they can be released, and for his Ramadan-season charitable campaigns."
  ur: "فیروز مرچنٹ (پیدائش 1958) دبئی میں مقیم بھارتی تاجر اور مخیر شخصیت ہیں، پیور گولڈ گروپ کے بانی و چیئرمین، جس کے تحت انھوں نے 1989 میں پیور گولڈ جیولرز قائم کیا۔ وہ امارات میں اپنی «فارگاٹن سوسائٹی» پہل کے لیے مشہور ہیں جس کے ذریعے 2008 سے نادہندہ قیدیوں کے قرضے ادا کر کے ان کی رہائی کرائی جاتی ہے، اور رمضان کی خیراتی مہمات کے لیے بھی جانے جاتے ہیں۔"
