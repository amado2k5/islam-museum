summary:
  ar: "عمر الشريف ⁦(10 نيسان 1932 – 10 تموز 2015)⁩، المولود ميشيل يوسف ديمتري شلهوب في الإسكندرية، ممثل مصري عالمي؛ بدأ في السينما المصرية مطلع الخمسينيات وذاع صيته عالميًا بدور الشريف علي في «لورنس العرب» (1962) وبطولة «دكتور جيفاغو» (1965)، ومثّل في أكثر من مئة فيلم على مدى خمسين عامًا."
  en: "Omar Sharif (10 April 1932 – 10 July 2015), born Michel Yusef Dimitri Chalhoub in Alexandria, was an Egyptian actor of world fame; he began in Egyptian cinema in the early 1950s, rose internationally as Sherif Ali in Lawrence of Arabia (1962) and in the title role of Doctor Zhivago (1965), and acted in over 100 films across fifty years."
  ur: "عمر شریف ⁦(10 اپریل 1932 – 10 جولائی 2015)⁩، پیدائشی نام میشیل یوسف دمتری چالھوب، اسکندریہ میں پیدا ہونے والے عالمی شہرت یافتہ مصری اداکار تھے؛ انھوں نے 1950 کی دہائی کے اوائل میں مصری سینما سے آغاز کیا، «لارنس آف عریبیہ» (1962) میں شریف علی اور «ڈاکٹر ژیواگو» (1965) کے مرکزی کردار سے عالمی شہرت پائی، اور پچاس برس میں سو سے زائد فلموں میں کام کیا۔"
