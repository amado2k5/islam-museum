summary:
  ar: "نمّ على موسى بن عبد الله عند الرشيد بما لم يقل، فحلف له موسى بيمين الحول والقوة فأصابه الجذام قبل ثلاثة أيام وتورم واسودّ حتى صار كالفحم ثم مات، فلما دلوه في حفرته انخسفت به وخرجت منها رائحة منتنة فملؤها شوكاً وألواح ساج ثم التراب {cite:muruj-al-dhahab p. 329-330}."
  en: "The traducer whose false word against Musa ibn 'Abd Allah was answered by three-day leprosy and a grave that would not hold him {cite:muruj-al-dhahab p. 329-330}."
  fr: "Le calomniateur dont la fausse parole contre Musa ibn 'Abd Allah fut suivie d'une lèpre en trois jours et d'une tombe qui ne voulut pas le garder {cite:muruj-al-dhahab p. 329-330}."
  es: "El calumniador cuya palabra falsa contra Musa ibn 'Abd Allah fue respondida con tres días de lepra y una tumba que no pudo retenerlo {cite:muruj-al-dhahab p. 329-330}."
  ur: "وہ تاجر جس کی موسیٰ بن عبد اللہ کے خلاف جھوٹی بات کا جواب تین دن کے کوڑھ اور ایک قبر نے دیا جو اسے تھامے گا نہیں 329-330}۔"
  tr: "Musa bin Abdullah'ı, söylemediği bir şeyle Reşid'e iftira etti; bunun üzerine Musa ona güç ve kudret yemini etti. Üç gün önce cüzzam hastalığına yakalanmıştı ve şişip karararak kömür gibi oldu, sonra öldü. Onu mezarına indirdiklerinde mezar çöktü ve kötü bir koku yayıldı; bunun üzerine mezarı dikenlerle, tik tahtalarıyla, sonra da toprakla doldurdular. {kaynak: Muruj-al-dhahab s. 329-330}"
  id: "Dia memfitnah Musa bin Abdullah kepada Al-Rashid dengan sesuatu yang tidak dia ucapkan, sehingga Musa bersumpah kepadanya dengan sumpah kekuatan dan kekuasaan, dan dia terkena penyakit kusta tiga hari sebelumnya, dan tubuhnya membengkak dan menghitam hingga seperti arang, lalu dia meninggal. Ketika mereka menurunkannya ke dalam kuburnya, kubur itu ambles dan mengeluarkan bau busuk, sehingga mereka mengisinya dengan duri dan papan kayu jati, lalu dengan tanah. {cite:muruj-al-dhahab p. 329-330}."
