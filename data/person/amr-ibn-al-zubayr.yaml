summary:
  ar: "عمرو بن الزبير بن العوام الأسدي، أخو عبد الله بن الزبير، وأمه أم خالد بنت خالد بن سعيد الأموية. ذكر الذهبي أنه سمع من أبيه وأخيه ولا رواية معروفة له، وأن له وفادة على معاوية وابنه، وأنه كانت بينه وبين أخيه عبد الله خصومة {cite:tarikh-islam-dhahabi p. 198}. ولّاه عمرو بن سعيد بن العاص شرطة المدينة سنة 60هـ تقريباً، ثم سار على رأس جند من الشام إلى مكة لقتال أخيه، فهُزم وأُسر، وانتهى أمره في سجن عبد الله بن الزبير {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}. وتختلف الروايات في كيفية وفاته، ولم تذكر المصادر المقروءة تاريخ ميلاده."
  en: "Amr ibn al-Zubayr ibn al-Awwam al-Asadi was a brother of Abd Allah ibn al-Zubayr; his mother was Umm Khalid bint Khalid ibn Sa'id of the Umayyad clan. Al-Dhahabi says he heard from his father and brother, has no known transmitted report, went as a delegate to Mu'awiya and to his son, and was in dispute with his brother Abd Allah {cite:tarikh-islam-dhahabi p. 198}. Amr ibn Sa'id ibn al-As gave him command of the police of Medina in about 60 AH, and he then marched with a force from Syria on Mecca against his brother, was defeated and captured, and ended his days in Abd Allah ibn al-Zubayr's prison {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}. The accounts differ on how he died, and the sources read give no date of his birth."
  ur: "عمرو بن زبیر بن عوام اسدی عبد اللہ بن زبیر کے بھائی تھے؛ ان کی والدہ ام خالد بنت خالد بن سعید اموی خاندان سے تھیں۔ ذہبی کے مطابق انہوں نے اپنے والد اور بھائی سے سنا، ان کی کوئی روایت معلوم نہیں، وہ معاویہ اور ان کے بیٹے کے پاس وفد لے کر گئے، اور ان کے اور ان کے بھائی عبد اللہ کے درمیان نزاع تھا {cite:tarikh-islam-dhahabi p. 198}۔ عمرو بن سعید بن العاص نے تقریباً 60ھ میں انہیں مدینہ کی پولیس کا سربراہ بنایا، پھر وہ شام کے لشکر کے ساتھ اپنے بھائی کے خلاف مکہ کی طرف بڑھے، شکست کھائی، پکڑے گئے اور عبد اللہ بن زبیر کی قید میں ان کا انجام ہوا {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}۔ ان کی وفات کی کیفیت میں روایات مختلف ہیں، اور پڑھے گئے مآخذ ان کی پیدائش کی تاریخ نہیں دیتے۔"
