summary:
  ar: "عمرو بن الزبير بن العوام الأسدي، أخو عبد الله بن الزبير، وأمه أم خالد بنت خالد بن سعيد الأموية. ذكر الذهبي أنه سمع من أبيه وأخيه ولا رواية معروفة له، وأن له وفادة على معاوية وابنه، وأنه كانت بينه وبين أخيه عبد الله خصومة {cite:tarikh-islam-dhahabi p. 198}. ولّاه عمرو بن سعيد بن العاص شرطة المدينة سنة 60هـ تقريباً، ثم سار على رأس جند من الشام إلى مكة لقتال أخيه، فهُزم وأُسر، وانتهى أمره في سجن عبد الله بن الزبير {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}. وتختلف الروايات في كيفية وفاته، ولم تذكر المصادر المقروءة تاريخ ميلاده."
  en: "Amr ibn al-Zubayr ibn al-Awwam al-Asadi was a brother of Abd Allah ibn al-Zubayr; his mother was Umm Khalid bint Khalid ibn Sa'id of the Umayyad clan. Al-Dhahabi says he heard from his father and brother, has no known transmitted report, went as a delegate to Mu'awiya and to his son, and was in dispute with his brother Abd Allah {cite:tarikh-islam-dhahabi p. 198}. Amr ibn Sa'id ibn al-As gave him command of the police of Medina in about 60 AH, and he then marched with a force from Syria on Mecca against his brother, was defeated and captured, and ended his days in Abd Allah ibn al-Zubayr's prison {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}. The accounts differ on how he died, and the sources read give no date of his birth."
  ur: "عمرو بن زبیر بن عوام اسدی عبد اللہ بن زبیر کے بھائی تھے؛ ان کی والدہ ام خالد بنت خالد بن سعید اموی خاندان سے تھیں۔ ذہبی کے مطابق انہوں نے اپنے والد اور بھائی سے سنا، ان کی کوئی روایت معلوم نہیں، وہ معاویہ اور ان کے بیٹے کے پاس وفد لے کر گئے، اور ان کے اور ان کے بھائی عبد اللہ کے درمیان نزاع تھا {cite:tarikh-islam-dhahabi p. 198}۔ عمرو بن سعید بن العاص نے تقریباً 60ھ میں انہیں مدینہ کی پولیس کا سربراہ بنایا، پھر وہ شام کے لشکر کے ساتھ اپنے بھائی کے خلاف مکہ کی طرف بڑھے، شکست کھائی، پکڑے گئے اور عبد اللہ بن زبیر کی قید میں ان کا انجام ہوا {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}۔ ان کی وفات کی کیفیت میں روایات مختلف ہیں، اور پڑھے گئے مآخذ ان کی پیدائش کی تاریخ نہیں دیتے۔"
  es: "Amr ibn al-Zubayr ibn al-Awwam al-Asadi era hermano de Abd Allah ibn al-Zubayr; su madre era Umm Khalid bint Khalid ibn Sa'id del clan Omeya. Al-Dhahabi dice que escuchó de su padre y hermano, no tiene ningún informe transmitido conocido, fue como delegado a Mu'awiya y a su hijo, y estuvo en disputa con su hermano Abd Allah {cite:tarikh-islam-dhahabi p. 198}. Amr ibn Sa'id ibn al-As le dio el mando de la policía de Medina alrededor del año 60 AH, y luego marchó con una fuerza desde Siria hacia La Meca contra su hermano, fue derrotado y capturado, y terminó sus días en la prisión de Abd Allah ibn al-Zubayr {cite:tarikh-islam-dhahabi p. 199} {cite:al-bidaya-wal-nihaya p. 518}. Los relatos difieren sobre cómo murió, y las fuentes consultadas no dan fecha de su nacimiento."
  fr: "Amr ibn al-Zubayr ibn al-Awwam al-Asadi était le frère d'Abd Allah ibn al-Zubayr; sa mère était Umm Khalid bint Khalid ibn Sa'id, de la famille omeyyade. Selon Al-Dhahabi, il aurait appris de son père et de son frère, mais aucun récit transmis oralement ne lui est parvenu. Il se rendit comme délégué auprès de Mu'awiya et de son fils, et fut en conflit avec son frère Abd Allah (voir: Tarikh Islam Dhahabi, p. 198). Vers l'an 60 de l'Hégire, Amr ibn Sa'id ibn al-As lui confia le commandement de la police de Médine. Il marcha ensuite avec une armée depuis la Syrie sur La Mecque contre son frère, fut vaincu et capturé, et finit ses jours dans la prison d'Abd Allah ibn al-Zubayr (voir: Tarikh Islam Dhahabi, p. 199; voir: Al-Bidaya Wal Nihaya, p. 518). Les récits divergent quant aux circonstances de sa mort, et les sources consultées ne donnent aucune date de naissance."
  tr: "Amr ibn al-Zubeyr ibn al-Awwam al-Asadi, Abdullah ibn al-Zubayr'ın kardeşi ve annesi Um Halid bint Halid bin Sa'id al-Umayyah'dır. Al-Dhahabi, babasından ve kardeşinden duyduğunu ancak bilinen bir anlatı olmadığını, Muaviye ve oğluyla bir bağlantısı olduğunu ve kendisi ile kardeşi Abdullah arasında bir anlaşmazlık olduğunu belirtmiştir {alıntı:] Tarikh-Islam-dhahabi, s. 198}. Amr ibn Sa'id ibn al-As, onu yaklaşık 60 Hicri Medine'nin polisi olarak atadı, ardından bir ordunun başında Levant'tan Mekke'ye yürüyerek kardeşiyle savaştı, ancak yenildi ve esir alındı, kaderi Abdullah ibn al-Zubayr hapishanesinde sona erdi {cite:Tarikh-Islam-dhahabi s. 199} {cite:al-bidaya-wal-nihaya s. 518}. Ölüm şekli konusunda farklı anlatımlar vardır ve okunan kaynaklarda doğum tarihi belirtilmemektedir."
  id: "Amr ibn al-Zubayr ibn al-Awwam al-Asadi, saudara Abdullah ibn al-Zubayr, dan ibunya adalah um Khalid bint Khalid ibn Sa'id al-Umayyah. Al-Dhahabi menyebutkan bahwa ia mendengar dari ayah dan saudaranya tetapi tidak memiliki narasi yang diketahui, bahwa ia memiliki hubungan dengan Muawiyah dan putranya, serta bahwa ada perselisihan antara dirinya dan saudaranya Abdullah {cite:Tarikh-Islam-dhahabi, hlm. 198}. Amr ibn Sa'id ibn al-As mengangkatnya sebagai polisi Madinah sekitar tahun 60 H, lalu memimpin pasukan dari Levant ke Mekah untuk melawan saudaranya, tetapi ia dikalahkan dan ditangkap, dan nasibnya berakhir di penjara Abdullah ibn al-Zubayr {cite:Tarikh-Islam-dhahabi hlm. 199} {cite:al-bidaya-wal-nihaya hlm. 518}. Catatan mengenai cara kematiannya berbeda-beda, dan sumber yang telah dibaca tidak menyebutkan tanggal lahirnya."
