summary:
  ar: "خطاط إيراني ⁦(1737–1771م تقريبًا)⁩ من كبار أساتذة خط الشكسته، في متحف المتروبوليتان رسالة بخطه مؤرخة 1176هـ/1763م {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 49}."
  en: "Iranian calligrapher (about 1737–71), one of the great masters of the shikasta script; The Met holds a letter in his hand dated 1176 AH/1763 CE {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 49}."
