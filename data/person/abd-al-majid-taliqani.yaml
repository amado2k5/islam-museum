  ur: "ایرانی خطاط ⁦(تقریباً 1737–71ء)⁩، خطِ شکستہ کے بڑے اساتذہ میں سے؛ میٹ میں ان کے ہاتھ کا 1176ھ/1763ء کا ایک خط ہے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 49}۔"
  es: "Calígrafo iraní (alrededor de 1737-1771), uno de los grandes maestros de la escritura shikasta; el Met conserva una carta escrita de su puño y letra, fechada en 1176 AH/1763 CE {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 49}."
  tr: "Şikasteh yazısının büyük ustalarından biri olan İranlı bir hattat (yaklaşık 1737–1771 MS). Metropolitan Sanat Müzesi'nde, 1176 Hicri/1763 Miladi tarihli, onun el yazısıyla yazılmış bir mektup bulunmaktadır {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 49}."
  id: "Seorang kaligrafer Iran (sekitar 1737–1771 M) yang merupakan salah satu master besar kaligrafi Shikasteh. Di Metropolitan Museum of Art terdapat surat tulisan tangannya yang bertanggal 1176 H/1763 M {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 49}."
