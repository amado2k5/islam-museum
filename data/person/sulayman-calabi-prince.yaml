summary:
  ar: "الأمير سليمان بن بايزيد الأول؛ أكبر أبناء بايزيد الخمسة الذين اشتركوا معه في القتال، نجا من هزيمة أنقرة سنة ٨٠٤هـ/١٤٠٢م فذهب إلى أدرنة وأعلن نفسه سلطاناً عليها، فصار حاكم الجناح الأوروبي من الدولة الممزقة خلال الحرب الأهلية العثمانية التي استمرت عشر سنوات بينه وبين أخويه عيسى في بروسة ومحمد في أماسيا {cite:dawlat-uthmaniyya-salabi p. 70}. وانتهت الفترة بغلبة أخيه الأصغر محمد الأول سنة ١٤١٣م {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  en: "Süleyman Çelebi, eldest of Bayezid I's five sons — escaped the Ankara disaster of 804/1402, reached Edirne and proclaimed himself sultan there, ruling the European wing of the fragmented state through the ten-year civil war against his brothers İsa in Bursa and Mehmed in Amasya {cite:dawlat-uthmaniyya-salabi p. 70}, until the youngest, Mehmed I, prevailed in 1413 {cite:dawlat-uthmaniyya-salabi p. 72-73}."
