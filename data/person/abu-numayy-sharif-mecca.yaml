id: person/abu-numayy-sharif-mecca
class: person
label:
  ar: أبو نمي شريف مكة
  en: Abu Numayy, Sharif of Mecca
  fr: "Abu Numayy, sharif de La Mecque"
  es: "Abu Numayy, Sharif of Mecca"
  ur: "ابو نمائی، شریف مکہ"
summary:
  ar: "أبو نمي بن أبي سعد الحسني، شريف مكة ومتولي أمرها وصاحب ولاية الموسم؛ كان وأخوه إدريس قائمين بالدعوة العباسية منذ حوّلها إليهم صلاح الدين، فلما استولت التتر على بغداد ومحت رسم الخلافة بها داخله في أمر البيعة للمستنصر الحفصي الفقيه الصوفي محمد بن عبد الحق بن سبعين النزيل بجوار الحرم، فأملى رسالة بيعتهم وكتبها بخطه، وخطب أهل مكة للمستنصر صاحب إفريقية."
  en: "Abu Numayy ibn Abi Sa'd al-Hasani, Sharif of Mecca, keeper of its affairs and lord of the pilgrimage season; he and his brother Idris had held the Abbasid da'wa since Saladin transferred it to them, and when the Tatars took Baghdad and erased the caliphate's rite, the Sufi jurist Ibn Sab'in dwelling by the sanctuary persuaded him to the bay'a of the Hafsid al-Mustansir, dictating the letter which the sharif had preached from Mecca's minbars."
  fr: "Abu Numayy ibn Abi Sa'd al-Hasani, sharif de La Mecque, gardien de ses affaires et maître de la saison du pèlerinage ; lui et son frère Idris portaient l'appel abbasside depuis que Saladin le leur avait remis, et quand les Tatars prirent Bagdad et effacèrent le rite du califat, le juriste soufi Ibn Sab'in, qui demeurait près du sanctuaire, le persuada de prêter allégeance au hafside al-Mustansir, dictant la lettre que le sharif fit prêcher depuis les chaires de La Mecque."
  es: "Abu Numayy ibn Abi Sa'd al-Hasani, jerife de La Meca, custodio de sus asuntos y señor de la temporada de peregrinación; él y su hermano Idris habían mantenido la da'wa abasí desde que Saladino se la transfirió, y cuando los tártaros tomaron Bagdad y borraron el rito del califato, el jurista sufí Ibn Sab'in que vivía junto al santuario lo persuadió para que aceptara la bay'a del Hafsid al-Mustansir, dictando la carta que el jerife había predicado desde los minbares de La Meca."
  ur: "ابو نمعی بن ابی سعد الحسنی، شریف مکہ، اس کے امور کا نگہبان اور حج کے موسم کا مالک؛ اس نے اور اس کے بھائی ادریس نے عباسی دعوت کو اس وقت سے سنبھال رکھا تھا جب سے صلاح الدین نے اسے ان کے پاس منتقل کیا تھا، اور جب تاتاریوں نے بغداد لے کر خلافت کی رسم کو مٹا دیا تو صوفی فقیہ ابن سبعین نے اسے حفصۃ المستقیر کی بیعت کی طرف آمادہ کیا، جس سے پہلے شیخ مستشرقین کا خط تھا۔ مکہ کے منبر۔"
  tr: "Mekke Şerifi, yöneticisi ve sabıka yetkisinin sahibi Ebu Numey ibn Ebu Sa'd el-Hasani; kendisi ve kardeşi İdris, Selahaddin'in bu görevi onlara devretmesinden beri Abbasilerin çağrısını yönetiyorlardı. Tatarlar Bağdat'ı ele geçirip oradaki halifeliğin sembolünü sildiklerinde, Haram yakınlarında ikamet eden Sufi hukukçu Muhammed ibn Abd el-Haqq ibn Sab'in, el-Mustansir el-Hafsi'ye biat etme meselesine girdi. Biat mektuplarını dikte ettirdi ve kendi el yazısıyla yazdı; Mekke halkı da İfrikiye hükümdarı el-Mustansir için hutbe okudu."
  id: "Abu Numay ibn Abi Sa’d al-Hasani, Syarif Mekah, administratornya, dan pemegang wewenang sabat; dia dan saudaranya Idris telah memimpin seruan Abbasiyah sejak Saladin menyerahkannya kepada mereka. Ketika Tatar merebut Baghdad dan menghapus simbol Kekhalifahan di sana, ahli hukum Sufi Muhammad ibn Abd al-Haqq ibn Sab’in, yang tinggal di dekat Haram, ikut campur dalam masalah sumpah setia kepada al-Mustansir al-Hafsi. Dia mendiktekan surat sumpah setia mereka dan menulisnya dengan tulisan tangannya sendiri, dan penduduk Mekah menyampaikan khutbah untuk al-Mustansir, penguasa Ifriqiya."
