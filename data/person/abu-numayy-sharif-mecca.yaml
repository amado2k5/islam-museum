label:
  ar: أبو نمي شريف مكة
  en: Abu Numayy, Sharif of Mecca
summary:
  ar: "أبو نمي بن أبي سعد الحسني، شريف مكة ومتولي أمرها وصاحب ولاية الموسم؛ كان وأخوه إدريس قائمين بالدعوة العباسية منذ حوّلها إليهم صلاح الدين، فلما استولت التتر على بغداد ومحت رسم الخلافة بها داخله في أمر البيعة للمستنصر الحفصي الفقيه الصوفي محمد بن عبد الحق بن سبعين النزيل بجوار الحرم، فأملى رسالة بيعتهم وكتبها بخطه، وخطب أهل مكة للمستنصر صاحب إفريقية."
  en: "Abu Numayy ibn Abi Sa'd al-Hasani, Sharif of Mecca, keeper of its affairs and lord of the pilgrimage season; he and his brother Idris had held the Abbasid da'wa since Saladin transferred it to them, and when the Tatars took Baghdad and erased the caliphate's rite, the Sufi jurist Ibn Sab'in dwelling by the sanctuary persuaded him to the bay'a of the Hafsid al-Mustansir, dictating the letter which the sharif had preached from Mecca's minbars."
