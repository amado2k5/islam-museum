summary:
  ar: "كاهن خزاعي، جد عمرو بن الحمق، منزله عسفان؛ جعله هاشم وأمية بن عبد شمس حكماً بينهما في المنافرة فقال «والقمر الباهر والكوكب الزاهر والغمام الماطر وما بالحوّ من طائر وما اهتدى بعلم مسافر في منجد وغائر لقد سبق هاشمٌ أمية إلى المآثر أولها وآخرها وأبو همهمة بذلك خابر» {cite:ansab-al-ashraf p. 61-62}."
  en: "The Khuza'i soothsayer of Usfan, grandfather of Amr ibn al-Hamiq; judge in the Hashim–Umayya munafara, his rhymed verdict — 'by the shining moon... Hashim has outstripped Umayya in every glory first and last' — became proverbial {cite:ansab-al-ashraf p. 61-62}."
