label: { ar: "كاهن عسفان الخزاعي" }
summary:
  ar: "كاهن خزاعي، جد عمرو بن الحمق، منزله عسفان؛ جعله هاشم وأمية بن عبد شمس حكماً بينهما في المنافرة فقال «والقمر الباهر والكوكب الزاهر والغمام الماطر وما بالحوّ من طائر وما اهتدى بعلم مسافر في منجد وغائر لقد سبق هاشمٌ أمية إلى المآثر أولها وآخرها وأبو همهمة بذلك خابر» {cite:ansab-al-ashraf p. 61-62}."
  en: "The Khuza'i soothsayer of Usfan, grandfather of Amr ibn al-Hamiq; judge in the Hashim–Umayya munafara, his rhymed verdict — 'by the shining moon... Hashim has outstripped Umayya in every glory first and last' — became proverbial {cite:ansab-al-ashraf p. 61-62}."
  es: "El adivino Khuza'i de Usfan, abuelo de Amr ibn al-Hamiq; juez en el munafara Hashim-Umayya, su veredicto rimado — 'por la luna brillante... Hashim ha superado a Umayya en toda gloria, de principio a fin' — se convirtió en proverbio {cite:ansab-al-ashraf p. 61-62}."
  fr: "Le devin Khuza'i d'Usfan, grand-père d'Amr ibn al-Hamiq; juge dans le munafara Hashim-Umayya, son verdict rimé — « par la lune brillante... Hashim a surpassé Umayya en toute gloire, du début à la fin » — est devenu proverbial {cite:ansab-al-ashraf p. 61-62}."
  ur: "عمرو بن الحمق کے دادا عثمان کے خزاعی کاہن؛ ہاشم – امیہ منافرہ میں جج، اس کا منظوم فیصلہ - 'چمکتے چاند کی قسم... ہاشم نے امیہ کو ہر اول و آخر میں پیچھے چھوڑ دیا' - ضرب المثل بن گیا۔ 61-62}۔"
  tr: "Huza'i rahibi, Amr ibn al-Hammaq'ın atası ve evi Usfan'dı; Haşim ve Umeyye ibn Abd Şems, onu aralarındaki anlaşmazlıklarda hakem olarak atadılar ve şöyle dediler: \"Parlayan ay, parlak yıldız, yağmurlu bulutlar, havadaki kuşlar ve alçakgönüllü ve derin bir yerde bir yolcunun bilgisiyle, Haşim, Umayyah'dan önce büyük işlere, başlangıca ve sona kadar ilerledi ve Ebu Hamma bunu bildirdi.\" {atıf:Ansab-al-Ashraf, s. 61-62}."
  id: "Pendeta Khuza'i, leluhur Amr ibn al-Hammaq, yang rumahnya adalah Usfan; Hashim dan Umayyah ibn Abd Shams menunjuknya sebagai penengah antara mereka dalam perselisihan, dengan mengatakan: \"Dengan bulan yang bersinar, bintang yang bersinar, awan yang turun, dan burung-burung di udara, serta pengetahuan seorang pengembara di tempat yang rendah dan dalam, Hashim mendahului Umayyah dalam perbuatan besar, awal dan terakhir, dan Abu Hamma memberitahu hal ini.\" {cite:ansab-al-ashraf, hlm. 61-62}."
