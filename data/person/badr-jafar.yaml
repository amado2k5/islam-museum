summary:
  ar: "بدر جعفر (وُلد في 9 آب 1979) رجل أعمال إماراتي من الشارقة، الرئيس التنفيذي للهلال للمشاريع ورئيس نفط الهلال. تعلّم في إيتون وكامبريدج، وأطلق مبادرة بيرل لحوكمة الشركات سنة 2010، وكان الممثل الخاص للأعمال والعمل الخيري في مؤتمر المناخ COP28، وعُيّن مبعوثًا خاصًا لدولة الإمارات لشؤون الأعمال والعمل الخيري سنة 2024."
  en: "Badr Jafar (born 9 August 1979) is an Emirati businessman from Sharjah, chief executive officer of Crescent Enterprises and president of Crescent Petroleum. Educated at Eton and Cambridge, he founded the Pearl Initiative for corporate governance in 2010, served as the COP28 Special Representative for Business and Philanthropy, and was appointed the UAE's Special Envoy for Business and Philanthropy in 2024."
  ur: "بدر جعفر (پیدائش 9 اگست 1979) شارجہ سے تعلق رکھنے والے اماراتی تاجر ہیں، ہلال انٹرپرائزز (Crescent Enterprises) کے چیف ایگزیکٹو اور ہلال پٹرولیم کے صدر۔ ایٹن اور کیمبرج سے تعلیم یافتہ، انھوں نے 2010 میں کارپوریٹ گورننس کے لیے پرل انیشیٹو قائم کیا، COP28 میں کاروبار و فلاحِ عامہ کے خصوصی نمائندے رہے، اور 2024 میں انھیں کاروبار و فلاح کے لیے متحدہ عرب امارات کا خصوصی ایلچی مقرر کیا گیا۔"
