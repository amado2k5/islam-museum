summary:
  ar: "عبد الرحمن بن عيسى بن مرشد، أبو الوجاهة العمري المرشدي، مفتي الحرم المكي وأحد الشعراء العلماء في الحجاز، ولد بمكة وولي الإمامة والخطابة والإفتاء السلطاني، وتوفي في سجنه مخنوقاً في عهد الشريف أحمد بن عبد المطلب."
  en: "Abd al-Rahman ibn Isa al-Murshidi, Abu al-Wajaha, mufti of the Meccan sanctuary and one of the scholar-poets of the Hejaz, born in Mecca; he held the imamate, preaching and sultanic ifta' of the Sacred Mosque and died strangled in prison under the Sharif Ahmad ibn Abd al-Muttalib."
