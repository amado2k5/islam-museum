label:
  ar: "عبد الرحمن بن عيسى المرشدي"
  en: "Abd al-Rahman al-Murshidi"
  fr: "Abd al-Rahman al-Murshidi"
  es: "Abd al-Rahman al-Murshidi"
  ur: "عبدالرحمن المرشدی"
roles: [mufti, poet, scholar]
gender: male
summary:
  ar: "عبد الرحمن بن عيسى بن مرشد، أبو الوجاهة العمري المرشدي، مفتي الحرم المكي وأحد الشعراء العلماء في الحجاز، ولد بمكة وولي الإمامة والخطابة والإفتاء السلطاني، وتوفي في سجنه مخنوقاً في عهد الشريف أحمد بن عبد المطلب."
  en: "Abd al-Rahman ibn Isa al-Murshidi, Abu al-Wajaha, mufti of the Meccan sanctuary and one of the scholar-poets of the Hejaz, born in Mecca; he held the imamate, preaching and sultanic ifta' of the Sacred Mosque and died strangled in prison under the Sharif Ahmad ibn Abd al-Muttalib."
  fr: "Abd al-Rahman ibn Isa al-Murshidi, Abu al-Wajaha, mufti du sanctuaire mecquois et l'un des savants-poètes du Hedjaz, né à La Mecque ; il tint l'imamat, la prédication et l'ifta' sultanien de la Mosquée sacrée et mourut étranglé en prison sous le chérif Ahmad ibn Abd al-Muttalib."
  es: "Abd al-Rahman ibn Isa al-Murshidi, Abu al-Wajaha, muftí del santuario de La Meca y uno de los eruditos-poetas del Hiyaz, nació en La Meca; ostentó el imamato, la predicación y el ifta' sultánico de la Mezquita Sagrada y murió estrangulado en prisión bajo el Sharif Ahmad ibn Abd al-Muttalib."
  ur: "عبدالرحمٰن بن عیسیٰ المرشدی، ابو الوجاح، مکہ مکرمہ کے مفتی اور حجاز کے عالم شاعروں میں سے ایک، مکہ میں پیدا ہوئے۔ اس نے مسجد نبوی کی امامت، تبلیغ اور سلطانی افتاء کی ذمہ داریاں سنبھالیں اور شریف احمد بن عبدالمطلب کے ماتحت جیل میں گلا گھونٹ کر انتقال کر گئے۔"
  tr: "Mekke Camii Müftüsü ve Hicaz'ın önde gelen şairlerinden Abdul Rahman bin Issa bin Murshid, Abu al-Wajaha al-Umari al-Murshidi, Mekke'de doğmuş, imam, vaiz ve sultan müftüsü görevlerinde bulunmuş ve Şerif Ahmed bin Abdul Muttalib döneminde hapishanesinde boğularak öldürülmüştür."
  id: "Abdul Rahman bin Issa bin Murshid, Abu al-Wajahah al-Umari al-Murshidi, Mufti Masjidil Haram Mekah dan salah satu penyair terkemuka di Hijaz, lahir di Mekah dan memegang jabatan Imam, pendakwah, dan Mufti Kesultanan, dan meninggal di penjara karena dicekik, pada masa pemerintahan Syarif Ahmad bin Abdul Muttalib."
