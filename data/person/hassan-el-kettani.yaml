summary:
  ar: "عالم وفقيه مغربي، وُلد في سلا في 16 أغسطس 1972 لأسرة الكتاني العلمية، ودرس على محمد أبو خبزة وعبد الله وعبد العزيز الغماري وغيرهم، ونال الماجستير في الفقه وأصوله من جامعة آل البيت والدكتوراه في أصول الفقه. اعتُقل في فبراير 2003 وحُكم عليه بالسجن عشرين سنة في قضية تفجيرات الدار البيضاء، وأنكر التهم، ثم أُفرج عنه بعفو ملكي في 5 فبراير 2012، ومنذ ذلك نبذ العنف وانتقده. له مصنفات وشرح كثيرة في الفقه والحديث."
  en: "Moroccan Muslim scholar and jurist, born at Salé on 16 August 1972 into the scholarly Kettani family. He studied under Muhammad Abu Khubza, Abdullah and Abd al-Aziz al-Ghumari and others, and took a master's in fiqh and its principles at Al al-Bayt University and a doctorate in usul al-fiqh. Arrested in February 2003, he was sentenced to twenty years in the Casablanca bombings case, denied the charges, and was released by royal pardon on 5 February 2012; since then he has denounced extremism. He has written many works and recorded commentaries in fiqh and hadith."
  ur: "مراکشی مسلمان عالم اور فقیہ، 16 اگست 1972ء کو سلا میں علمی کتانی خاندان میں پیدا ہوئے۔ انھوں نے محمد ابو خبزہ، عبد اللہ اور عبد العزیز غماری اور دیگر سے تعلیم حاصل کی، جامعہ آل البیت سے فقہ و اصول میں ماسٹرز اور اصولِ فقہ میں ڈاکٹریٹ کیا۔ فروری 2003ء میں گرفتار ہوئے، کاسا بلانکا بم دھماکوں کے مقدمے میں بیس سال قید کی سزا پائی، الزامات سے انکار کیا، اور 5 فروری 2012ء کو شاہی عفو سے رہا ہوئے؛ اس کے بعد سے وہ انتہا پسندی کی مذمت کرتے ہیں۔ فقہ و حدیث میں ان کی بہت سی تصانیف اور شرحیں ہیں۔"
