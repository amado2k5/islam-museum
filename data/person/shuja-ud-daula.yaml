summary:
  ar: "شجاع الدولة (19 يناير 1732 – 26 يناير 1775)، نواب أوده الثالث والوزير الأعظم للمغول، ابن صفدر جنك، حكم من 1754 إلى 1775. أيد الأمير علي كوهر (شاه عالم الثاني) وصار وزيره الأعظم، وقاتل إلى جانب أحمد شاه الأبدالي في بانيبات الثالثة سنة 1761، ثم هُزم مع حلفائه عند بوكسار سنة 1764 فعقد معاهدة الله آباد، ودُفن في كلاب باري بفيض آباد."
  en: "Shuja-ud-Daula (19 January 1732 – 26 January 1775) was the third Nawab of Awadh and Grand Vizier of the Mughal Empire, a son of Safdar Jang, reigning from 1754 to 1775. He backed Prince Ali Gauhar (Shah Alam II) and became his Grand Vizier, fought beside Ahmad Shah Durrani at the Third Battle of Panipat in 1761, and after defeat with his allies at Buxar in 1764 signed the Treaty of Allahabad; he was buried at Gulab Bari, Faizabad."
  ur: "شجاع الدولہ (19 جنوری 1732ء – 26 جنوری 1775ء) اودھ کے تیسرے نواب اور مغلیہ سلطنت کے وزیر اعظم، صفدر جنگ کے فرزند، 1754ء سے 1775ء تک حکمران رہے۔ آپ نے شہزادہ علی گوہر (شاہ عالم ثانی) کی حمایت کر کے ان کے وزیر اعظم بنے، 1761ء میں پانی پت کی تیسری لڑائی میں احمد شاہ ابدالی کے ساتھ لڑے، اور 1764ء میں بکسر کی شکست کے بعد معاہدۂ الٰہ آباد کیا؛ آپ فیض آباد کے گلاب باڑی میں دفن ہیں۔"

