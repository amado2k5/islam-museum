summary:
  ar: "شجاع الدولة ⁦(19 يناير 1732 – 26 يناير 1775)⁩، نواب أوده الثالث والوزير الأعظم للمغول، ابن صفدر جنك، حكم من 1754 إلى 1775. أيد الأمير علي كوهر ⁦(شاه عالم الثاني)⁩ وصار وزيره الأعظم، وقاتل إلى جانب أحمد شاه الأبدالي في بانيبات الثالثة سنة 1761، ثم هُزم مع حلفائه عند بوكسار سنة 1764 فعقد معاهدة الله آباد، ودُفن في كلاب باري بفيض آباد."
  en: "Shuja-ud-Daula (19 January 1732 – 26 January 1775) was the third Nawab of Awadh and Grand Vizier of the Mughal Empire, a son of Safdar Jang, reigning from 1754 to 1775. He backed Prince Ali Gauhar (Shah Alam II) and became his Grand Vizier, fought beside Ahmad Shah Durrani at the Third Battle of Panipat in 1761, and after defeat with his allies at Buxar in 1764 signed the Treaty of Allahabad; he was buried at Gulab Bari, Faizabad."
  ur: "شجاع الدولہ ⁦(19 جنوری 1732ء – 26 جنوری 1775ء)⁩ اودھ کے تیسرے نواب اور مغلیہ سلطنت کے وزیر اعظم، صفدر جنگ کے فرزند، 1754ء سے 1775ء تک حکمران رہے۔ آپ نے شہزادہ علی گوہر ⁦(شاہ عالم ثانی)⁩ کی حمایت کر کے ان کے وزیر اعظم بنے، 1761ء میں پانی پت کی تیسری لڑائی میں احمد شاہ ابدالی کے ساتھ لڑے، اور 1764ء میں بکسر کی شکست کے بعد معاہدۂ الٰہ آباد کیا؛ آپ فیض آباد کے گلاب باڑی میں دفن ہیں۔"
  es: "Shuja-ud-Daula (19 de enero de 1732 – 26 de enero de 1775) fue el tercer Nawab de Awadh y Gran Visir del Imperio mogol, hijo de Safdar Jang, y reinó desde 1754 hasta 1775. Apoyó al príncipe Ali Gauhar (Shah Alam II) y se convirtió en su Gran Visir, luchó junto a Ahmad Shah Durrani en la Tercera Batalla de Panipat en 1761, y tras la derrota con sus aliados en Buxar en 1764 firmó el Tratado de Allahabad; fue enterrado en Gulab Bari, Faizabad."
  fr: "Shuja-ud-Daula (19 janvier 1732 – 26 janvier 1775) fut le troisième Nawab d'Awadh et Grand Vizir de l'Empire moghol, fils de Safdar Jang, régnant de 1754 à 1775. Il soutint le prince Ali Gauhar (Shah Alam II) et devint son Grand Vizir, combattit aux côtés d'Ahmad Shah Durrani lors de la troisième bataille de Panipat en 1761, et après sa défaite avec ses alliés à Buxar en 1764, signa le traité d'Allahabad; il fut enterré à Gulab Bari, Faizabad."
  tr: "Shuja al-Daula (19 Ocak 1732 – 26 Ocak 1775), Oudh III'ün Nawabı ve Babürlerin Sadrazamı, Safdar Jink'in oğlu, 1754'ten 1775'e kadar hüküm sürdü. Prens Ali Kohar'ı (Şah Alam II) destekledi ve onun sadrazamı oldu, 1761'de Panipat III'te Ahmed Şah Abdali ile birlikte savaştı, ardından 1764'te müttefikleriyle birlikte Buxar'da yenildi; burada Allahabad Antlaşması'nı imzaladı ve Faizabad'daki Kalabbari'de defnedildi."
  id: "Shuja al-Daula (19 Januari 1732 – 26 Januari 1775), Nawab Oudh III dan Wazir Agung Mughal, putra Safdar Jink, memerintah dari tahun 1754 hingga 1775. Ia mendukung Pangeran Ali Kohar (Shah Alam II) dan menjadi wazir agungnya, bertempur bersama Ahmad Shah Abdali di Panipat III pada tahun 1761, kemudian dikalahkan bersama sekutunya di Buxar pada tahun 1764, di mana ia menandatangani Perjanjian Allahabad dan dimakamkan di Kalabbari, Faizabad."

