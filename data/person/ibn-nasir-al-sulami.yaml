id: person/ibn-nasir-al-sulami
class: person
label: { ar: "ابن ناصر الحافظ" }
names:
  - { value: "أبو الفضل محمد بن ناصر بن محمد بن علي بن عمر السلامي البغدادي الحنبلي محدث العراق", kind: full }
summary:
  ar: "الحافظ الثقة أبو الفضل ابن ناصر محمد بن ناصر السلامي البغدادي محدث العراق؛ ولد سنة سبع وستين وأربعمائة وعني بالحديث بعد أن برع في الفقه وتحول من مذهب الشافعي إلى مذهب الحنابلة لمنام رأى فيه النبي وهو يقول له عليك بمذهب الشيخ أبي منصور الخياط، وكان الناس يقولون يخرج ابن ناصر لغوي بغداد وابن الجواليقي محدثها فانعكس الأمر فصار ابن ناصر محدث بغداد وابن الجواليقي لغويها؛ قال ابن الجوزي هو الذي تولى تسميعي الحديث وعنه أخذت ما أخذت من علم الحديث قرأت عليه ثلاثين سنة ولم أستفد من أحد كاستفادتي منه، وقال أبو موسى المديني هو مقدم أصحاب الحديث في وقته ببغداد، ووقف كتبه وخلف ثياباً خَلِقة وثلاثة دنانير ولم يعقب؛ توفي حوالي سنة خمسين وخمسمائة {cite:shadharat-dhahab p. 635-636}."
  en: "The trustworthy hafiz Abu al-Fadl Ibn Nasir Muhammad ibn Nasir al-Sulami of Baghdad, muhaddith of Iraq; b. 467, he turned to hadith after excelling in fiqh and moved from the Shafi'i to the Hanbali madhhab on a dream in which the Prophet told him 'keep to the madhhab of Shaykh Abu Mansur al-Khayyat' — people used to say Ibn Nasir would emerge Baghdad's linguist and Ibn al-Jawaliqi its muhaddith, and it turned out the reverse; Ibn al-Jawzi: 'he it was who dictated hadith to me — I read to him thirty years and profited from none as from him', and Abu Musa al-Madini: 'foremost of Baghdad's hadith men of his time'; he endowed his books and left three dinars, no offspring; d. about 550 {cite:shadharat-dhahab p. 635-636}."
  es: "El confiable hafiz Abu al-Fadl Ibn Nasir Muhammad ibn Nasir al-Sulami de Bagdad, muhaddith de Irak; n. 467, se dedicó al hadiz después de sobresalir en fiqh y pasó de la madhhab Shafi'i a la Hanbali en un sueño en el que el Profeta le dijo 'mantente en la madhhab del Shaykh Abu Mansur al-Khayyat'. La gente solía decir que Ibn Nasir se convertiría en el lingüista de Bagdad e Ibn al-Jawaliqi en su muhaddith, y resultó ser al revés; Ibn al-Jawzi: 'fue él quien me dictó hadiz; le leí durante treinta años y no aprendí de ninguno como de él', y Abu Musa al-Madini: 'el más destacado de los hombres de hadiz de Bagdad de su tiempo'; dotó sus libros y dejó tres dinares, sin descendencia; m. alrededor de 550 {cita: shadharat-dhahab p. 635-636}."
  fr: "Le digne de confiance hafiz Abu al-Fadl Ibn Nasir Muhammad ibn Nasir al-Sulami de Bagdad, muhaddith d'Irak; né en 467, il se tourna vers le hadith après avoir excellé en fiqh et passa du madhhab shafi'ite au madhhab hanbalite suite à un rêve dans lequel le Prophète lui dit: « Reste fidèle au madhhab du cheikh Abu Mansur al-Khayyat » — on disait qu'Ibn Nasir deviendrait le linguiste de Bagdad et Ibn al-Jawaliqi son muhaddith, mais il s'avéra que c'était l'inverse; Ibn al-Jawzi: « C'est lui qui me dictait des hadiths — je lui en ai lu pendant trente ans et nul autre ne m'a autant profité que lui », et Abu Musa al-Madini: « Le plus éminent des spécialistes du hadith de Bagdad à son époque »; il légua ses livres et ne laissa que trois dinars, sans descendance; mort. environ 550 {cite: shadharat-dhahab p. 635-636}."
  ur: "ثقہ حافظ ابو الفضل ابن ناصر محمد بن ناصر السلمی بغداد، محدث عراق؛ ب 467 میں فقہ میں مہارت حاصل کرنے کے بعد حدیث کی طرف متوجہ ہوئے اور ایک خواب میں شافعی سے حنبلی مذہب کی طرف چلے گئے جس میں نبی نے ان سے کہا کہ 'شیخ ابو منصور الخیاط کے مذہب پر قائم رہو' - لوگ کہتے تھے کہ ابن ناصر بغداد کے ماہر لسانیات کا ظہور کریں گے اور ابن ثقلین اس کا علمبردار ہو گا۔ معکوس؛ ابن الجوزی: 'وہ وہی تھا جس نے مجھ سے حدیثیں سنائیں - میں نے ان کو تیس سال پڑھا اور اس سے کوئی فائدہ نہیں اٹھایا'، اور ابو موسی المدینی: 'بغداد کے اپنے زمانے کے محدثین میں سب سے آگے'؛ اس نے اپنی کتابیں عطا کیں اور تین دینار چھوڑے، کوئی اولاد نہیں۔ d تقریباً 550 {حوالہ: شدھارت ذہاب ص۔ 635-636}۔"
  tr: "Güvenilir hadis âlimi Ebu el-Fadl bin Nasır Muhammed bin Nasır el-Salami el-Bağdadi, Irak'ta bir hadis âlimidir; 467 Hicri yılında doğmuş, fıkıhta üstün başarı gösterdikten ve Peygamber'in kendisine Şeyh Ebu Mansur el-Hayyat okulunu takip etmesini söylediği rüyasından sonra Şafii okulundan Hanbeli okuluna geçtikten sonra hadise ilgi duymaya başlamıştır. İnsanlar, İbn Nasir'in Bağdat'ın dilbilimci ve İbn el-Caze'nin dilbilimci olarak ortaya çıkacağını söylerlerdi Velikiyi hadis âlimi olarak kabul etti, ancak durum tersine döndü. İbn Nasir Bağdat'ın hadis âlimi oldu ve İbn al-Jawaliqi dilbilimci oldu. İbn al-Jawzi şöyle dedi: Hadisi bana öğreten oydu ve ondan otuz yıl çalıştım ama kimseden bu kadar fayda görmedim. Ebu Musa el-Madini, Bağdat'taki döneminde en önde gelen hadis alimiydi ve geride kıyafet ve üç dinar bıraktı ama başarısız oldu; yaklaşık 550 Hicri yılında vefat etti {alıntı::Shadharat-Dhahab, s. 635-636}."
  id: "Ulama hadis terpercaya, Abu al-Fadl ibn Nasser Muhammad ibn Nasir al-Salami al-Baghdadi, seorang ulama hadis di Irak; lahir pada tahun 467 H, ia mulai tertarik pada hadis setelah unggul dalam fiksi dan berpindah dari mazhab Shafi'i ke mazhab Hanbali setelah mimpi di mana ia melihat Nabi menyuruhnya mengikuti aliran Sheikh Abu Mansur al-Khayyat. Orang-orang dulu mengatakan bahwa Ibn Nasir akan muncul sebagai ahli bahasa Baghdad dan Ibn al-Jawaliyah Qi sebagai ulama haditsnya, tetapi situasinya terbalik. Ibn Nasir menjadi ulama hadis Baghdad dan Ibn al-Jawaliqi menjadi ahli bahasanya. Ibn al-Jawzi berkata: Dialah yang mengajarkan saya hadis dan darinya, dan dari dia saya belajar selama tiga puluh tahun dan tidak mendapat manfaat sebanyak yang saya dapatkan. Abu Musa al-Madini adalah ulama hadits terkemuka pada masanya di Baghdad, dan ia meninggalkan pakaian serta tiga dinar tanpa hasil; ia meninggal sekitar tahun 550 H {cite:Shadharat-Dhahab, hlm. 635-636}."
