summary:
  ar: "الزاهد القدوة صاحب الزاوية بجبل قاسيون؛ كان صالحاً متواضعاً مطرحاً للتكلف يمشي وحده ويشتري الحاجة، وله أحوال ومجاهدات وقدم في الفقر وسافر الأقطار ولقي الأبدال والأبرار، وفي بدايته لا يأوي إلا القفار؛ حكى عن نفسه أنه وقع على حرامية الفرنج فعذبوه وربطوه فلما ناموا جاءت حرامية المسلمين فأيقظهم وأدخلهم مغارة فلما بعدوا سأله الفرنج هلا دللت علينا وتخلصت فقال إني صحبتكم وأكلت خبزكم وفي طريقنا أن الصحبة عزيزة فما رأيت خلاص نفسي بهلاككم فشكروه وأطلقوه {cite:shadharat-dhahab p. 145-146}."
  en: "Abdallah b. Yunus al-Irmawi (d. 631) — the model ascetic of the Qasyun zawiya; once seized by Frankish robbers, he woke them when Muslim bandits approached and hid them in a cave, refusing to buy his freedom with his captors' lives — 'I ate your bread, and companionship is sacred'; they released him in wonder {cite:shadharat-dhahab p. 145-146}."
