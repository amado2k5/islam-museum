  ar: "حفصة بنت سيرين"
  en: "Hafsa bint Sirin"
  ur: "حفصہ بنت سیرین"
roles: [scholar, mystic]
gender: female
summary:
  ar: "حفصة بنت سيرين، أم الهذيل، تابعية عابدة من البصرة وأخت محمد بن سيرين؛ يذكر ابن الجوزي في «صفة الصفوة» أنها قرأت القرآن وهي ابنة اثنتي عشرة سنة وماتت ابنة تسعين، ومكثت في مصلاها ثلاثين سنة، وكان أخوها يحيل إليها في وجوه القراءة."
  en: "Hafsa bint Sirin, Umm al-Hudhayl, a Successor and ascetic of Basra and sister of Muhammad ibn Sirin; Ibn al-Jawzi's Sifat al-Safwa says she had read the Qur'an by twelve and died at ninety, kept to her prayer room for thirty years, and that her brother sent questions on Qur'anic readings to her."
  ur: "حفصہ بنت سیرین، ام الہذیل، بصرہ کی ایک تابعی عابدہ اور محمد بن سیرین کی بہن؛ ابن الجوزی کی «صفۃ الصفوہ» کے مطابق انہوں نے بارہ سال کی عمر میں قرآن پڑھ لیا اور نوے سال کی عمر میں وفات پائی، تیس سال اپنی جائے نماز میں رہیں، اور ان کے بھائی قراءت کے مسائل ان کے پاس بھیجتے تھے۔"
