label: { ar: "ابن الوحيد ⁦(شرف الدين محمد بن شريف)⁩", en: "Ibn al-Wahid (Sharaf al-Din Muhammad ibn Sharif)", ur: "ابن الوحید ⁦(شرف الدین محمد بن شریف)⁩" }
summary:
  ar: "خطاط شامي من تلاميذ ياقوت في بغداد، انتقل إلى القاهرة فخدم بيبرس الجاشنكير وكتب له مصحفًا بالذهب في سبعة أجزاء ⁦(704–705هـ)⁩، وتوفي سنة 1311م عن إحدى وستين سنة {cite:blair-islamic-calligraphy-2006 p. 386}."
  en: "Syrian-born calligrapher, pupil of Yaqut at Baghdad, who moved to Cairo, served Baybars al-Jashankir and penned for him a seven-part Qur'an in gold (704–5/1304–6); he died in 1311 aged 61 {cite:blair-islamic-calligraphy-2006 p. 386}."
  ur: "شام میں پیدا ہونے والے خطاط، بغداد میں یاقوت کے شاگرد، جو قاہرہ منتقل ہوئے، بیبرس الجاشنکیر کی خدمت کی اور ان کے لیے سونے سے سات جلدوں کا مصحف لکھا ⁦(704–705ھ/1304–6ء)⁩؛ 1311ء میں اکسٹھ برس کی عمر میں وفات پائی {cite:blair-islamic-calligraphy-2006 p. 386}۔"
