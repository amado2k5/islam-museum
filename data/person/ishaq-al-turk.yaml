id: person/ishaq-al-turk
class: person
label: { ar: "إسحاق الترك", en: "Ishaq Al Turk" }
summary:
  ar: "رجل يعرف بإسحاق الترك وقع إلى بلاد ما وراء النهر وأقام بها داعية لأبي مسلم يدعي أنه محبوس في جبال الري وأنه يخرج في وقت يعرفونه، وسمي بالترك لأنه دخل بلاد الترك يدعوهم برسالة أبي مسلم، وقال قوم إنه من العلوية من ولد يحيى بن زيد بن علي خرج هاربا من بني أمية يجول بلاد الترك {cite:fihrist-ibn-al-nadim p. 483}. وهو الذي وقع إلى بلاد ما وراء النهر فدعا إلى أبي مسلم وادعى أنه محبوس في جبال الري، وقيل إن إسحاق كان رجلا من أهل ما وراء النهر أميا وكانت له تابعة من الجن فكان إذا سئل عن شيء أجاب بعد ليلة، وزعم أنه نبي أنفذه زرادشت وادعى أن زرادشت حي لم يمت وأصحابه يعتقدون أنه حي لا يموت {cite:fihrist-ibn-al-nadim p. 483-484}"
  en: "The Transoxanian da'i claiming Abu Muslim alive — the Muslimiyya's apostle to the Turks {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
