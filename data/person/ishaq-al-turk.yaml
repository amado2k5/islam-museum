label: { ar: "إسحاق الترك", en: "Ishaq Al Turk", es: "Ishaq Al Turk", fr: "Ishaq Al Turk", ur: "اسحاق الترک" }
summary:
  ar: "رجل يعرف بإسحاق الترك وقع إلى بلاد ما وراء النهر وأقام بها داعية لأبي مسلم يدعي أنه محبوس في جبال الري وأنه يخرج في وقت يعرفونه، وسمي بالترك لأنه دخل بلاد الترك يدعوهم برسالة أبي مسلم، وقال قوم إنه من العلوية من ولد يحيى بن زيد بن علي خرج هاربا من بني أمية يجول بلاد الترك {cite:fihrist-ibn-al-nadim p. 483}. وهو الذي وقع إلى بلاد ما وراء النهر فدعا إلى أبي مسلم وادعى أنه محبوس في جبال الري، وقيل إن إسحاق كان رجلا من أهل ما وراء النهر أميا وكانت له تابعة من الجن فكان إذا سئل عن شيء أجاب بعد ليلة، وزعم أنه نبي أنفذه زرادشت وادعى أن زرادشت حي لم يمت وأصحابه يعتقدون أنه حي لا يموت {cite:fihrist-ibn-al-nadim p. 483-484}"
  en: "The Transoxanian da'i claiming Abu Muslim alive — the Muslimiyya's apostle to the Turks {cite:fihrist-ibn-al-nadim}"
  es: "El da'i de Transoxiana que afirma que Abu Muslim está vivo — el apóstol de la Muslimiyya ante los turcos {cite:fihrist-ibn-al-nadim}"
  fr: "Le da'i transoxanien affirmant qu'Abu Muslim est vivant — l'apôtre des Muslimiyya auprès des Turcs {cite:fihrist-ibn-al-nadim}"
  ur: "Transoxanian da'i ابو مسلم کو زندہ ہونے کا دعویٰ کرتا ہے - ترکوں کے لیے مسلمیہ کا رسول"
  tr: "İshaq el-Türk olarak bilinen bir adam, Transoksiana'ya gitmiş ve orada Ebu Müslüm'e vaiz olarak kalmış, Rayy dağlarında hapsedildiğini ve kendisinin bildiği bir zamanda çıkacağını iddia etmiştir. Türk olarak adlandırılmıştır çünkü Ebu Müslüm'ün mesajıyla Türklerin topraklarına girmiş ve onları çağırmıştır. Bazıları onun Yahya ibn Zeyd bin Ali'nin soyundan gelen Alevilerden olduğunu ve Emevilerden kaçıp Türklerin topraklarında dolaştığını söylemiştir {alıntı:Fihrist-ibn-al-Nadim s. 483}. Transoksiana'ya gidip Abu Müslüm'ü çağıran ve onun Rayı dağlarında hapsedildiğini iddia eden oydu. İshaq'ın Transoksiana'dan okuma yazma bilmeyen bir adam olduğu, cinlerden bir astı olduğu ve bir şey sorulduğunda bir gece sonra cevap verdiği söylenir. Kendisinin Zerdüşt tarafından gönderilen bir peygamber olduğunu, Zerdüşt onun hayatta olduğunu ve ölmediğini iddia ederken, sahabelerinin onun hayatta olduğuna inanıp hiç ölmediğini iddia etti. {atıf:Fihrist-ibn-al-Nadim s. 483-484}"
  id: "Seorang pria yang dikenal sebagai Ishaq al-Turk pergi ke Transoxiana dan tinggal di sana sebagai pengkhotbah Abu Muslim, mengklaim bahwa ia dipenjara di pegunungan Rayy dan akan keluar pada waktu yang diketahuinya. Ia disebut Turki karena ia memasuki tanah orang Turki dan memanggil mereka dengan pesan Abu Muslim. Beberapa orang mengatakan ia berasal dari Alawit dari keturunan Yahya ibn Zayd ibn Ali, yang melarikan diri dari Umayyah untuk menjelajahi tanah Turki {cite:Fihrist-ibn-al-Nadim hlm. 483}. Dia adalah orang yang pergi ke Transoxiana dan memanggil Abu Muslim serta mengaku dipenjara di pegunungan Rayy. Dikatakan bahwa Ishaq adalah seorang buta huruf dari Transoxiana yang memiliki bawahan dari jin, dan ketika ditanya sesuatu, dia akan menjawab setelah satu malam. Dia mengaku bahwa dia adalah nabi yang dikirim oleh Zoroaster, yang mengklaim bahwa Zoroaster masih hidup dan tidak mati, sementara teman-temannya percaya dia masih hidup dan tidak pernah mati. {cite:Fihrist-ibn-al-Nadim hlm. 483-484}"
