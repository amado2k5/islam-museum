id: person/ishaq-al-turk
class: person
label: { ar: "إسحاق الترك", en: "Ishaq Al Turk" }
summary:
  ar: "رجل يعرف بإسحاق الترك وقع إلى بلاد ما وراء النهر وأقام بها داعية لأبي مسلم يدعي أنه محبوس في جبال الري وأنه يخرج في وقت يعرفونه، وسمي بالترك لأنه دخل بلاد الترك يدعوهم برسالة أبي مسلم، وقال قوم إنه من العلوية من ولد يحيى بن زيد بن علي خرج هاربا من بني أمية يجول بلاد الترك {cite:fihrist-ibn-al-nadim p. 483}."
  en: "The Transoxanian da'i claiming Abu Muslim alive — the Muslimiyya's apostle to the Turks {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
