summary:
  ar: "عالم حديث هندي (1879–1957) ومناضل من أجل استقلال الهند. تخرج في دار العلوم ديوبند ودرّس ثمانية عشر عامًا في المدينة المنورة، ثم صار شيخ الحديث ومدير دار العلوم من 1927 حتى وفاته، ورئيس جمعية علماء الهند من 1940. أُسر في مالطا مع شيخه محمود حسن الديوبندي، وألّف «القومية المتحدة والإسلام» (1938) مدافعًا عن وحدة الهند ضد التقسيم، ونال وسام بادما بهوشان سنة 1954."
  en: "Indian hadith scholar (1879–1957) and independence activist. A graduate of Darul Uloom Deoband, he taught for eighteen years in Medina, then served as the seminary's Shaykh al-Hadith and principal from 1927 until his death, and as president of Jamiat Ulama-e-Hind from 1940. Imprisoned in Malta with his teacher Mahmud Hasan Deobandi, he wrote Composite Nationalism and Islam (1938) for a united India against partition, and received the Padma Bhushan in 1954."
  ur: "ہندوستانی محدث (1879ء–1957ء) اور تحریک آزادی کے رہنما۔ دار العلوم دیوبند کے فاضل، مدینہ منورہ میں اٹھارہ سال تدریس کی، پھر 1927ء سے وفات تک دار العلوم کے شیخ الحدیث و صدر مدرس اور 1940ء سے جمعیت علماء ہند کے صدر رہے۔ شیخ الہند محمود حسن دیوبندی کے ساتھ مالٹا میں اسیر رہے، «متحدہ قومیت اور اسلام» (1938ء) میں متحدہ ہندوستان کی حمایت کی، اور 1954ء میں پدم بھوشن ملا۔"
