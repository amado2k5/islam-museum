summary:
  ar: "من الحكميين، وفد على الهادي بجماعة من الخيل والرجال سنة 294هـ فراراً من خوف ابن عمه الغطريف بن محمد الأشج، وخرج معه إلى نجران."
  en: "Of the Hakam, he came to al-Hadi in 294 AH with a band of horsemen and men, fleeing for fear of his cousin al-Futayf ibn Muhammad al-Ashajj, and went with him to Najran."
  fr: "Des Hakam, il vint auprès d'al-Hadi en 294 H avec une troupe de cavaliers et d'hommes, fuyant par crainte de son cousin al-Futayf ibn Muhammad al-Ashajj, et partit avec lui pour Najran."
  ur: "حکمی قبیلے سے؛ 294ھ میں ہادی کے پاس گھوڑسواروں اور آدمیوں کے گروہ کے ساتھ آئے، اپنے چچا زاد الغطریف بن محمد الاشج کے خوف سے بھاگ کر، اور ان کے ساتھ نجران گئے۔"
  es: "De los Hakam, llegó a al-Hadi en el año 294 de la Hégira con un grupo de jinetes y hombres, huyendo por temor a su primo al-Futayf ibn Muhammad al-Ashajj, y fue con él a Najran."
