summary:
  ar: محمد بن أحمد بن سالم السفاريني، شمس الدين أبو العون، عالم بالحديث والأصول والأدب ولد في سفارين من قرى نابلس ودرس وأفتى في نابلس، صاحب «غذاء الألباب»، 1114 إلى 1188هـ.
  en: Muhammad ibn Ahmad ibn Salim al-Saffarini, Shams al-Din Abu al-Awn, a scholar of hadith, usul and letters, born in Saffarin near Nablus, who taught and gave fatwas in Nablus, author of Ghidha al-Albab, 1114 to 1188 AH.
  fr: "Muhammad ibn Ahmad ibn Salim al-Saffarini, Shams al-Din Abu al-Awn, un savant du hadith, usul et lettres, né à Saffarin près de Naplouse, qui a enseigné et donné des fatwas à Naplouse, auteur de Ghidha al-Albab, 1114 à 1188 de l’hégire."
  es: "Muhammad ibn Ahmad ibn Salim al-Saffarini, Shams al-Din Abu al-Awn, un erudito en hadices, usul y letras, nacido en Saffarin cerca de Nablus, que enseñó y dio fatwas en Nablus, autor de Ghidha al-Albab, 1114 a 1188 AH."
  ur: "محمد بن احمد بن سالم الصفرینی، شمس الدین ابو العون، حدیث، اصول اور خطوط کے ایک عالم، نابلس کے قریب سفارین میں پیدا ہوئے، جنہوں نے نابلس میں تعلیم دی اور فتویٰ دیا، غضہ الالباب کے مصنف، 1114 سے 1188 ہجری۔"
