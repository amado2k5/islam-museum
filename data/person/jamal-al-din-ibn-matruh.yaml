summary:
  ar: "الكاتب الشاعر؛ ولد بأسيوط سنة اثنتين وتسعين وخمسمائة واتصل بخدمة الملك الكامل ثم ولده الصالح فرتبه ناظراً في الخزانة وكان بصورة وزير لدمشق سنة ثلاث وأربعين، ثم تغير عليه الصالح فأقام بداره إلى أن مات؛ قال ابن خلكان كان بيني وبينه مكاتبات ومودة أكيدة وله ديوان شعر، وكان بينه وبين البهاء زهير محبة قديمة من زمن الصبا حتى كانا كالأخوين؛ وأوصى أن يكتب عند رأسه بيتاه: «أصبحت بقعر حفرتي مرتهناً لا أملك من دنياي إلا كفناً» {cite:shadharat-dhahab p. 255-257}."
  en: "The secretary-poet (b. Asyut 592, d. early Sha'ban 649, Muqattam) — al-Kamil's then al-Salih's man, treasurer and quasi-vizier of Damascus, boyhood friend of Baha' al-Din Zuhayr; by his will the grave-verses were carved at his head: 'in my pit I lie pawned — of this world only a shroud is mine' {cite:shadharat-dhahab p. 255-257}."
