gender: male
summary:
  ar: "شيخ الخرقة البرهامية وصاحب المحاضرات القدسية عند أهله، انتهت إليه رياسة الكلام على خواطر الأنام، وذكر عنه من كرامات الشيوخ أنه كان يتكلم بجميع اللغات من عجمي وسرياني وأنه كان يعرف لغات الوحش والطير وأنه صام في المهد وأنه رأى في اللوح المحفوظ وهو ابن سبع سنين وأنه فك طلسم السبع المثاني وأن قدمه لم تسعه الدنيا وأنه ينقل اسم مريده من الشقاوة إلى السعادة وقال توليت القطبانية فرأيت المشرقين والمغربين وما تحت العرش ودون الثرى، توفي سنة ست وسبعين وست مئة {cite:shadharat-dhahab p. 359}."
  en: "Ibrahim al-Dasuqi, shaykh of the Burhami khirqa — the hagiographers credit him with all tongues, the speech of beasts and birds, fasting in the cradle and sight of the Preserved Tablet at seven; he died in 676 {cite:shadharat-dhahab p. 359}."
  es: "Ibrahim al-Dasuqi, shaykh del khirqa Burhami: los hagiógrafos le atribuyen el dominio de todas las lenguas, el habla de las bestias y las aves, el ayuno en la cuna y la visión de la Tabla Preservada a los siete años; murió en 676 {cita: shadharat-dhahab p. 359}."
  fr: "Ibrahim al-Dasuqi, cheikh de la khirqa Burhami — les hagiographes lui attribuent le don de parler toutes les langues, la parole des bêtes et des oiseaux, le jeûne au berceau et la vision de la Tablette Préservée à sept ans; il mourut en 676 {cite: shadharat-dhahab p. 359}."
  ur: "ابراہیم الدسوقی، برہامی خرقے کے شیخ - حاشیہ نگار اسے تمام زبانوں، حیوانوں اور پرندوں کی بولی، گہوارے میں روزہ رکھنے اور سات بجے محفوظ شدہ تختی کی نظر سے نوازتے ہیں۔ ان کی وفات 676ء میں ہوئی۔ 359}۔"
  tr: "Brahmin Pelerini'nin Şeyhi ve ailesi arasında kutsal dersler veren kişi, konuşmayı insanların düşünceleri üzerinde yönlendirmesiyle sona erdi. Şeyhlerin mucizelerinden biri, Arap olmayan dilden Süryaniceye kadar tüm dilleri konuşması, hayvan ve kuşun dillerini bilmesi, beşikte oruç tutması, yedi yaşında Korunan Tablet'te görmesi, sık sık tekrarlanan Yedi'nin tılsımını çözmesi, ayaklarının onu alamaması, müridinin adını sefaletten mutluluğa taşıması ve Kutbaniye'yi ele geçirip Doğu'yu, Batı'yı, tahtın altındaki ve yeryüzünün altındaki yeryüzünü görmesiydi. 676 Hicri yılında öldü {atıf:shadharat-dhahab, s. 359}."
  id: "Sheikh Jubah Brahmana dan penulis ceramah suci di antara keluarganya berakhir dengan dia memimpin pidato melebihi pikiran orang-orang. Di antara mukjizat para sheikh adalah bahwa dia berbicara semua bahasa, dari non-Arab hingga Siria, bahwa dia menguasai bahasa binatang dan burung, bahwa dia berpuasa di buaian, yang dia lihat dalam Tablet Terawat pada usia tujuh tahun, bahwa dia telah menguraikan jimat Tujuh yang sering diulang, bahwa kakinya tidak mampu menampungnya, bahwa dia memindahkan nama muridnya dari kesengsaraan menjadi kebahagiaan, dan bahwa dia mengambil alih Qutbaniya dan melihat Timur, Barat, dan mereka yang berada di bawah takhta dan di bawah bumi. Dia meninggal pada tahun 676 H {cite:shadharat-dhahab, hlm. 359}."
