summary:
  ar: "شيخ الخرقة البرهامية وصاحب المحاضرات القدسية عند أهله، انتهت إليه رياسة الكلام على خواطر الأنام، وذكر عنه من كرامات الشيوخ أنه كان يتكلم بجميع اللغات من عجمي وسرياني وأنه كان يعرف لغات الوحش والطير وأنه صام في المهد وأنه رأى في اللوح المحفوظ وهو ابن سبع سنين وأنه فك طلسم السبع المثاني وأن قدمه لم تسعه الدنيا وأنه ينقل اسم مريده من الشقاوة إلى السعادة وقال توليت القطبانية فرأيت المشرقين والمغربين وما تحت العرش ودون الثرى، توفي سنة ست وسبعين وست مئة {cite:shadharat-dhahab p. 359}."
  en: "Ibrahim al-Dasuqi, shaykh of the Burhami khirqa — the hagiographers credit him with all tongues, the speech of beasts and birds, fasting in the cradle and sight of the Preserved Tablet at seven; he died in 676 {cite:shadharat-dhahab p. 359}."
