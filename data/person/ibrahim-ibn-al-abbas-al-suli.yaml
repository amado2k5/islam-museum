label: { ar: "إبراهيم بن العباس الصولي", en: "Ibrahim ibn al-'Abbas al-Suli" }
summary:
  ar: "شاعر، قال المسعودي إن أحسن ما قيل في أن الحديث لا يمل قوله إن الزمان وما ترين يمفرقي صرف الغواية فانصرفت كريماً، وضجرت إلا من لقاء محدث حسن الحديث يزيدني تعليماً {cite:muruj-al-dhahab p. 255}. وعند المسعودي من خبره أن عاملاً على مؤامرة عزله رد يمينه وقال ليست يمين السلطان عندك يميناً لأنك رافضي فقال له احتملت كل شيء إلا الرفض والرافضي من زعم أن علياً أفضل من العباس وأن ولده أحق من ولد العباس فقال ومن قال ذلك فقال أنت وخطك عندي به فسقط في يده وأحضره الدفتر فوضعه في خفه بعد أن حلف له وخرق المؤامرة، ومات سنة ست وأربعين ومائتين وكان يدعي خثولة العباس بن الأحنف، ومن كلامه وقديماً غذت المعصية أبناءها فحلبت عليهم من درها مرضعة، وكان يقول مثل أصحاب السلطان مثل قوم علوا جبلاً ثم وقعوا منه فكان أقربهم إلى التلف أبعدهم من الارتقاء {cite:muruj-al-dhahab p. 492-495}"
  en: "The poet whose 'I weary of all but a sweet teller of tales' Mas'udi judged the best verse on talk that never wearies {cite:muruj-al-dhahab p. 255}."
