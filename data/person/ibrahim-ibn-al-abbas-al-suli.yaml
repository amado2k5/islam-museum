class: person
label: { ar: "إبراهيم بن العباس الصولي", en: "Ibrahim ibn al-'Abbas al-Suli", es: "Ibrahim ibn al-'Abbas al-Suli", fr: "Ibrahim ibn al-'Abbas al-Suli", ur: "ابراہیم بن العباس السولی" }
summary:
  ar: "شاعر، قال المسعودي إن أحسن ما قيل في أن الحديث لا يمل قوله إن الزمان وما ترين يمفرقي صرف الغواية فانصرفت كريماً، وضجرت إلا من لقاء محدث حسن الحديث يزيدني تعليماً {cite:muruj-al-dhahab p. 255}. وعند المسعودي من خبره أن عاملاً على مؤامرة عزله رد يمينه وقال ليست يمين السلطان عندك يميناً لأنك رافضي فقال له احتملت كل شيء إلا الرفض والرافضي من زعم أن علياً أفضل من العباس وأن ولده أحق من ولد العباس فقال ومن قال ذلك فقال أنت وخطك عندي به فسقط في يده وأحضره الدفتر فوضعه في خفه بعد أن حلف له وخرق المؤامرة، ومات سنة ست وأربعين ومائتين وكان يدعي خثولة العباس بن الأحنف، ومن كلامه وقديماً غذت المعصية أبناءها فحلبت عليهم من درها مرضعة، وكان يقول مثل أصحاب السلطان مثل قوم علوا جبلاً ثم وقعوا منه فكان أقربهم إلى التلف أبعدهم من الارتقاء {cite:muruj-al-dhahab p. 492-495}"
  en: "The poet whose 'I weary of all but a sweet teller of tales' Mas'udi judged the best verse on talk that never wearies {cite:muruj-al-dhahab p. 255}."
  es: "El poeta cuyo poema \"Me canso de todo excepto de un dulce narrador de cuentos\" Mas'udi consideró que el mejor verso era sobre la conversación que nunca cansa {cite:muruj-al-dhahab p. 255}."
  fr: "Le poète dont le poème « Je me lasse de tout sauf d'un doux conteur d'histoires » a été jugé par Mas'udi comme le meilleur vers sur la parole qui ne lasse jamais {cite:muruj-al-dhahab p. 255}."
  ur: "وہ شاعر جس کے 'میں سب سے تھک گیا ہوں مگر ایک میٹھی کہانیاں سنانے والا' مسعودی نے گفتگو پر بہترین نظم کا فیصلہ کیا جو کبھی نہیں تھکتی {حوالہ: مروج الذہب ص۔ 255}۔"
  tr: "Bir şair olan El-Mes'udi şöyle demiştir: En iyi söylenen şey hadisin asla yorulmadığıdır; şöyle der: 'Zaman ve gördüğün beni oyalar, ayartmayı saptırır,' bu yüzden cömertçe yüzümü çevirdim ve eğitimimi artıracak bir hadis âlimiyle karşılaşmaktan yoruldum. {kaynak:Muruj-al-Dhahab, s. 255}. El-Mes'udi'ye göre, kendisini tahttan indirmek için bir komplo düzenlendiğini bildiren Al-Mas'udi, yeminini geri verdi ve şöyle dedi: Sultanın yemini senin için yemin değildir çünkü sen bir Rafidisin. O da 'Reddedilme dışında her şeye katlandım.' diye cevap verdi. Rafidiler, Ali'nin Abbas'tan daha iyi olduğunu ve oğlunun Abbas'ın soyundan daha layık olduğunu iddia etti. Dedi ki, 'Sen ve soyunun benimlesiniz.' Eline düştü, defteri aldı ve kumuna koydu Alwood, ona yemin ettikten ve komployu bozduktan sonra Khathula al-Abbas ibn al-Ahnaf olarak anıldı. Onun sözlerini eskiden dinledi, günah çocuklarını besler ve incilerinden sağırdı. Sultanın yoldaşlarının, dağa tırmanıp ondan düşen bir halk gibi örnek aldığını söylerdi; yıkıma en yakın olan yer ise yükselişten en uzak olanıydı. {cite:) Muruj-al-Dhahab, s. 492-495}"
  id: "Seorang penyair, Al-Mas'udi berkata: Hal terbaik yang dikatakan adalah hadits tidak pernah lelah, mengatakan: 'Waktu dan apa yang kamu lihat akan mengalihkan perhatianku, mengalihkan godaan,' jadi saya berpaling dengan murah hati, dan saya lelah bertemu ulama hadits yang akan meningkatkan pendidikan saya. {cite:muruj-al-dhahab, hlm. 255}. Menurut Al-Mas'udi yang memberitahunya bahwa ada konspirasi untuk menggulingkannya, dia mengembalikan sumpahnya dan berkata: Sumpah sultan bukanlah sumpah untukmu karena kamu seorang Rafidi. Dia menjawab, 'Aku menahan segalanya kecuali penolakan.' Rafidi mengklaim bahwa Ali lebih baik daripada Abbas dan bahwa putranya lebih pantas daripada keturunan Abbas. Dia berkata, 'Kamu dan garis keturunanmu bersamaku.' Dia jatuh ke tangannya, membawa buku catatan itu, dan meletakkannya di dalam cendana setelah bersumpah kepadanya dan memecahkan konspirasi. Dia meninggal pada tahun 246 H, dan disebut Khathula al-Abbas ibn al-Ahnaf. Dari perkataannya, dahulu kala, dosa memberi makan anak-anaknya dan memerah mereka dari mutiara. Dia biasa mengucapkan contoh sahabat sultan seperti bangsa yang mendaki gunung dan jatuh darinya, dan yang paling dekat dengan kehancuran adalah yang paling jauh dari kenaikan. {cite:Muruj-al-Dhahab, hlm. 492-495}"
