summary:
  ar: "محمد بن محمد بن محمد بن الحسين بن محمد بن خلف بن أحمد الفراء، عماد الدين، أبو يعلى الصغير، ابن القاضي أبي خازم بن القاضي أبي يعلى، البغدادي، فقيه حنبلي، شيخ المذهب في وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} سمع الحديث من أبيه وعمه القاضي أبي الحسين وطبقتهما، وتفقه عليهما، وبرع في المذهب والخلاف والمناظرة، وأفتى ودرّس وولي القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} قرأ عليه المذهب والخلاف جماعة كثيرة منهم أبو إسحاق الصقال، وأبو العباس القطيعي، وأبو الحسن بن ورخذ، وأبو البقاء العكبري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} من تصانيفه «التعليقة» في مسائل الخلاف، و«المفردات»، و«النكت والإشارات»، بحسب ما ظهر في النص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} أوردته الموسوعة بتاريخي ولادة 494هـ ووفاة 560هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  en: "Muhammad ibn Muhammad ibn Muhammad ibn al-Husayn ibn Muhammad ibn Khalaf ibn Ahmad al-Farra', Imad al-Din, Abu Ya'la al-Saghir — son of the qadi Abu Khazim and grandson of the qadi Abu Ya'la — a Baghdadi Hanbali jurist and the shaykh of the madhhab in his time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} He heard hadith from his father and his uncle the qadi Abu al-Husayn and their peers, studied fiqh under them, excelled in the madhhab, the divergences and disputation, and he gave fatwa, taught and held judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} A large circle read the madhhab and the divergences under him, among them Abu Ishaq al-Saqal, Abu al-Abbas al-Qati'i, Abu al-Hasan ibn Warkhadh and Abu al-Baqa' al-Ukbari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} His works, as legible in the scan, include al-Ta'liqa on the questions of divergence, al-Mufradat and al-Nukt wa-l-Isharat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} The encyclopedia dates him 494–560 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  fr: "Muhammad ibn Muhammad ibn Muhammad ibn al-Husayn ibn Muhammad ibn Khalaf ibn Ahmad al-Farra', Imad al-Din, Abu Ya'la al-Saghir — fils du cadi Abu Khazim et petit-fils du cadi Abu Ya'la — fut un juriste hanbalite bagdadien et le cheikh de l'école à son époque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Il entendit le hadith de son père, de son oncle le cadi Abu al-Husayn et de leurs pairs, étudia le fiqh auprès d'eux, excella dans la doctrine de l'école, les divergences et la controverse ; il donna des fatwas, enseigna et exerça la judicature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Un large cercle étudia auprès de lui la doctrine et les divergences, dont Abu Ishaq al-Saqal, Abu al-Abbas al-Qati'i, Abu al-Hasan ibn Warkhadh et Abu al-Baqa' al-Ukbari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Ses œuvres, selon ce qui est lisible dans la numérisation, comprennent al-Ta'liqa sur les questions de divergence, al-Mufradat et al-Nukt wa-l-Isharat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} L'encyclopédie le date de 494–560 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  ur: "محمد بن محمد بن محمد بن الحسین بن محمد بن خلف بن احمد الفراء، عماد الدین، ابو یعلی الصغیر — قاضی ابی خازم کے فرزند اور قاضی ابی یعلی کے پوتے — بغدادی حنبلی فقیہ اور اپنے وقت کے مذہب کے شیخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} انھوں نے اپنے والد اور چچا قاضی ابی الحسین اور ان کے ہم عصروں سے حدیث سنی، ان ہی سے فقہ پڑھی، مذہب، خلافیات اور مناظرہ میں مہارت پائی، فتویٰ دیا، تدریس کی اور قضاء کا منصب سنبھالا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} ان سے مذہب اور خلافیات ایک بڑی جماعت نے پڑھی جن میں ابو اسحاق الصقال، ابو العباس القطیعی، ابو الحسن بن ورخذ اور ابو البقاء العکبری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} اسکین کے مطابق ان کی تصانیف میں مسائل خلاف پر «التعلیقہ»، «المفردات» اور «النکت والاشارات» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} موسوعہ نے ان کی ولادت 494ھ اور وفات 560ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  es: "Muhammad ibn Muhammad ibn Muhammad ibn al-Husayn ibn Muhammad ibn Khalaf ibn Ahmad al-Farra', Imad al-Din, Abu Ya'la al-Saghir — hijo de Qadi Abu Khazim y nieto de Qadi Abu Ya'la — un jurista hanbalí de Bagdad y el shaykh de la madhhab en su tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Escuchó hadices de su padre y de su tío, el qadi Abu al-Husayn, y de sus compañeros, estudió fiqh con ellos, sobresalió en la madhhab, en las divergencias y disputas, y dio fatwas, enseñó y dictó sentencias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Un gran círculo leyó el madhab y las divergencias bajo su mando, entre ellos Abu Ishaq al-Saqal, Abu al-Abbas al-Qati'i, Abu al-Hasan ibn Warkhadh y Abu al-Baqa' al-Ukbari. Sus obras, legibles en el escaneo, incluyen al-Ta'liqa sobre las cuestiones de la divergencia, al-Mufradat y al-Nukt wa-l-Isharat. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} La enciclopedia lo fecha entre 494 y 560 d.H. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  tr: "Muhammed ibn Muhammed ibn Muhammed ibn el-Hüseyn ibn Muhammed ibn Halef ibn Ahmed el-Farra', İmadeddin, Ebu Ya'la el-Sağhir, Kadı Ebu Hazim ibn Kadı Ebu Ya'la'nın oğlu, el-Bağdadi, Hanbeli fıkıhçısı, zamanının önde gelen âlimlerinden biriydi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16244} Babasından ve amcası Kadı Ebu el-Hüseyn'den ve onların neslinden diğerlerinden hadis öğrendi ve onlardan fıkıh eğitimi aldı. Hanbeli mezhebinde, hukuki ihtilaflarda ve münazaralarda üstün başarı gösterdi, hukuki görüşler ortaya koydu, ders verdi ve kadı olarak görev yaptı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16244} Aralarında Ebu İshak el-Saqqal, Ebu el-Abbas el-Qati'i, Ebu el-Hasan ibn Warkhadh ve Ebu el-Baqa' el-'Akbari'nin de bulunduğu büyük bir grup ilim adamı Hanbelî mezhebini ve onun yönetimindeki hukuki ihtilafları inceledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16244} Eserleri arasında, metinde görünene göre, ihtilaflı konularda “Şerh”, “Kelimeler” ve “Şakalar ve İşaretler” bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16244} Ansiklopedi onun doğum tarihini H. 494, ölüm tarihini ise H. 560 olarak sıralıyordu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16244}"
  id: "Muhammad ibn Muhammad ibn Muhammad ibn al-Husayn ibn Muhammad ibn Khalaf ibn Ahmad al-Farra', Imad al-Din, Abu Ya'la al-Saghir, putra Hakim Abu Khazim ibn Hakim Abu Ya'la, al-Baghdadi, seorang ahli hukum Hanbali, ulama terkemuka mazhab tersebut pada masanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} Beliau mendengar hadits dari ayah dan pamannya, Hakim Abu al-Husayn, dan orang-orang sezaman mereka, dan mempelajari ilmu hukum di bawah bimbingan mereka. Beliau unggul dalam mazhab Hanbali, sengketa hukum, dan debat, serta mengeluarkan pendapat hukum, mengajar, dan menjabat sebagai hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.16244} Sekelompok besar ulama mempelajari mazhab Hanbali dan sengketa hukum di bawahnya, termasuk Abu Ishaq al-Saqqal, Abu al-Abbas al-Qati'i, Abu al-Hasan ibn Warkhadh, dan Abu al-Baqa' al-'Akbari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.16244} Di antara karyanya adalah “Komentar” tentang masalah perselisihan, “Kosakata,” dan “Lelucon dan Tanda,” sesuai dengan apa yang muncul dalam teks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.16244} Ensiklopedia mencantumkan dia dengan tanggal lahir pada tahun 494 H dan meninggal pada tahun 560 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.16244}"
