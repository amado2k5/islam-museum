summary:
  ar: "محمد بن محمد بن محمد بن الحسين بن محمد بن خلف بن أحمد الفراء، عماد الدين، أبو يعلى الصغير، ابن القاضي أبي خازم بن القاضي أبي يعلى، البغدادي، فقيه حنبلي، شيخ المذهب في وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} سمع الحديث من أبيه وعمه القاضي أبي الحسين وطبقتهما، وتفقه عليهما، وبرع في المذهب والخلاف والمناظرة، وأفتى ودرّس وولي القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} قرأ عليه المذهب والخلاف جماعة كثيرة منهم أبو إسحاق الصقال، وأبو العباس القطيعي، وأبو الحسن بن ورخذ، وأبو البقاء العكبري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} من تصانيفه «التعليقة» في مسائل الخلاف، و«المفردات»، و«النكت والإشارات»، بحسب ما ظهر في النص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} أوردته الموسوعة بتاريخي ولادة 494هـ ووفاة 560هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  en: "Muhammad ibn Muhammad ibn Muhammad ibn al-Husayn ibn Muhammad ibn Khalaf ibn Ahmad al-Farra', Imad al-Din, Abu Ya'la al-Saghir — son of the qadi Abu Khazim and grandson of the qadi Abu Ya'la — a Baghdadi Hanbali jurist and the shaykh of the madhhab in his time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} He heard hadith from his father and his uncle the qadi Abu al-Husayn and their peers, studied fiqh under them, excelled in the madhhab, the divergences and disputation, and he gave fatwa, taught and held judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} A large circle read the madhhab and the divergences under him, among them Abu Ishaq al-Saqal, Abu al-Abbas al-Qati'i, Abu al-Hasan ibn Warkhadh and Abu al-Baqa' al-Ukbari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} His works, as legible in the scan, include al-Ta'liqa on the questions of divergence, al-Mufradat and al-Nukt wa-l-Isharat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} The encyclopedia dates him 494–560 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
  ur: "محمد بن محمد بن محمد بن الحسین بن محمد بن خلف بن احمد الفراء، عماد الدین، ابو یعلی الصغیر — قاضی ابی خازم کے فرزند اور قاضی ابی یعلی کے پوتے — بغدادی حنبلی فقیہ اور اپنے وقت کے مذہب کے شیخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} انھوں نے اپنے والد اور چچا قاضی ابی الحسین اور ان کے ہم عصروں سے حدیث سنی، ان ہی سے فقہ پڑھی، مذہب، خلافیات اور مناظرہ میں مہارت پائی، فتویٰ دیا، تدریس کی اور قضاء کا منصب سنبھالا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} ان سے مذہب اور خلافیات ایک بڑی جماعت نے پڑھی جن میں ابو اسحاق الصقال، ابو العباس القطیعی، ابو الحسن بن ورخذ اور ابو البقاء العکبری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} اسکین کے مطابق ان کی تصانیف میں مسائل خلاف پر «التعلیقہ»، «المفردات» اور «النکت والاشارات» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244} موسوعہ نے ان کی ولادت 494ھ اور وفات 560ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16244}"
