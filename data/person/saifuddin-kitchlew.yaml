summary:
  ar: "محامٍ ومناضل استقلال هندي (1888–1963) من أمريتسار، درس في كامبريدج وألمانيا. قاد احتجاجات البنجاب ضد قانون رولات، واعتُقل مع ستيابال في أبريل 1919 فكانت مسيرة جليانوالا باغ ومذبحتها، وقضى نحو أربعة عشر عامًا في السجون البريطانية. كان من مؤسسي الجامعة الملية الإسلامية، وعارض تقسيم الهند، ونال جائزة ستالين للسلام 1952."
  en: "Indian barrister and independence activist (1888–1963) from Amritsar, educated at Cambridge and in Germany. He led the Punjab protests against the Rowlatt Act; his arrest with Satyapal in April 1919 set off the Jallianwala Bagh gathering and massacre, and he spent some fourteen years in British prisons in all. He was a founding member of Jamia Millia Islamia, opposed the Partition of India, and received the Stalin Peace Prize in 1952."
  ur: "امرتسر کے ہندوستانی بیرسٹر اور مجاہد آزادی (1888ء–1963ء)، کیمبرج اور جرمنی سے تعلیم یافتہ۔ انھوں نے رولٹ ایکٹ کے خلاف پنجاب کی تحریک کی قیادت کی؛ اپریل 1919ء میں ستیاپال کے ساتھ ان کی گرفتاری جلیانوالہ باغ کے اجتماع اور قتل عام کا سبب بنی، اور وہ مجموعی طور پر تقریباً چودہ برس برطانوی جیلوں میں رہے۔ وہ جامعہ ملیہ اسلامیہ کے بانی ارکان میں سے تھے، تقسیم ہند کے مخالف تھے، اور 1952ء میں اسٹالن امن انعام ملا۔"
