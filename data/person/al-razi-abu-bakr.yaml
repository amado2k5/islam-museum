id: person/al-razi-abu-bakr
class: person
label: { ar: "أبو بكر محمد بن زكريا الرازي", en: "Abu Bakr al-Razi" }
summary:
  ar: "أبو بكر محمد بن زكريا الرازي، المعروف عند اللاتين باسم رازيس، طبيب وفيلسوف وكيميائي ولد في الري وعاش نحو 250هـ/854م إلى 313هـ/925م أو 323هـ/935م بحسب تقدير آخر. تولى رئاسة مستشفى الري ثم مستشفى بغداد، وألّف المنصوري والحاوي والشكوك على جالينوس وكتابه في الجدري والحصبة. وتنسب إليه مقالة دائرة المعارف الإسلامية آراء فلسفية في النفس والزمان والمكان والمادة وفي النبوة، تعرضها دون حكم، إلى جانب مصادر أخرى تنقل عنه في الكيمياء والطب."
  en: "Abu Bakr Muhammad ibn Zakariya al-Razi, known to the Latins as Rhazes, was a physician, philosopher and alchemist born in Rayy, who lived from about 250/854 to 313/925, or 323/935 by another reckoning. He headed the hospitals of Rayy and Baghdad and wrote the Mansuri, the Hawi, the Doubts about Galen and the book on smallpox and measles. The Encyclopaedia of Islam attributes to him philosophical positions on soul, time, space, matter and prophecy, reported here without a verdict, alongside material from other sources on his alchemy and medicine."
  ur: "ابوبکر محمد بن زکریا رازی، جنھیں لاطینی رازیس کہتے تھے، رے میں پیدا ہونے والے طبیب، فلسفی اور کیمیا دان تھے، جو تقریباً 250ھ/854ء سے 313ھ/925ء تک، یا ایک دوسرے حساب سے 323ھ/935ء تک، زندہ رہے۔ انھوں نے رے اور بغداد کے ہسپتالوں کی سربراہی کی اور المنصوری، الحاوی، الشکوک علی جالینوس اور چیچک و خسرہ پر کتاب لکھی۔ انسائیکلو پیڈیا آف اسلام ان سے نفس، زمان، مکان، مادے اور نبوت کے بارے میں فلسفیانہ مواقف منسوب کرتا ہے، جو یہاں بغیر فیصلے کے نقل کیے گئے ہیں، ساتھ ہی ان کی کیمیا اور طب پر دوسرے ماخذ کا مواد بھی ہے."
