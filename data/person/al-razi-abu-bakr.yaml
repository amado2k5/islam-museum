label: { ar: "أبو بكر محمد بن زكريا الرازي", en: "Abu Bakr al-Razi" }
summary:
  ar: "الفيلسوف الطبيب صاحب كتاب المنصوري في الطب وغيره، رأى المسعودي له كتاباً ذكر فيه مذاهب الصابئة الحرانيين دون من خالفهم من الصابئة وهم الكيماريون، وذكر فيه أشياء يطول ذكرها ويقبح عند كثير من الناس وصفها من أعمالهم وقرابينهم {cite:muruj-al-dhahab p. 547}. وعند المسعودي نقض رسالة الكندي في إبطال صنعة الذهب وأرى القول أن ما ذكره الكندي فاسد وأن ذلك قد يتأتى فعله، وصنف في هذا المعنى كتباً في الأحجار المعدنية والشعر وكيفية الأعمال {cite:muruj-al-dhahab p. 620}، وزعم أنه لا يجوز أن يصح علم الفيلسوف ولا يسمى الإنسان فيلسوفا إلا أن يصح له علم صناعة الكيمياء، وأن جماعة من الفلاسفة كفيثاغورس وديموقراط وأفلاطون وأرسطاطاليس وجالينوس كانوا يعملون الصناعة، ويقول في كتبه المؤلفة في الصنعة قال أستاذنا أبو موسى جابر بن حيان {cite:fihrist-ibn-al-nadim p. 494,500}، وفي فن المتطببين: أوحد دهره وفريد عصره قد جمع المعرفة بعلوم القدماء وسيما الطب وكان يتنقل في البلدان وبينه وبين منصور بن إسماعيل صداقة وله ألف كتاب المنصوري، وحكى شيخ من أهل الري كان كبير الرأس مسقطا يجلس في مجلسه ودونه تلاميذ ودونهم تلاميذهم ودونهم تلاميذ آخر فيجيء الرجل فيصف ما يجد لأول من تلقاه وكان كريما متفضلا بارا بالناس وحسن الرأفة بالفقراء والعلاء حتى كان يجري عليهم الجرايات الواسعة ويمرضهم ولم يكن يفارق المدارج والنسخ وكان في بصره رطوبة لكثرة أكله الباقلى وعمي في آخر عمره وكان يقول إنه قرأ الفلسفة على البلخي، ومن فهرسته كتاب البرهان وكتاب سمع الكيان وكتاب المدخل إلى المنطق وكتاب اللذة وكتاب الشكوك على جالينوس وكتاب في أن صناعة الكيمياء إلى الوجوب أقرب منها إلى الامتناع وكتاب الحاوي ويسمى الجامع الحافظ لصناعة الطب يقسم اثني عشر قسما {cite:fihrist-ibn-al-nadim p. 415-417}"
  en: "The philosopher-physician, author of the Mansuri — al-Mas'udi saw his book on the Harranian Sabians' doctrines (apart from the rival Kimariyyun), whose rites he judged too ugly to repeat {cite:muruj-al-dhahab p. 547}."
