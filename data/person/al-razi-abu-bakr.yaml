id: person/al-razi-abu-bakr
class: person
label: { ar: "أبو بكر محمد بن زكريا الرازي", en: "Abu Bakr al-Razi" }
summary:
  ar: "الفيلسوف الطبيب صاحب كتاب المنصوري في الطب وغيره، رأى المسعودي له كتاباً ذكر فيه مذاهب الصابئة الحرانيين دون من خالفهم من الصابئة وهم الكيماريون، وذكر فيه أشياء يطول ذكرها ويقبح عند كثير من الناس وصفها من أعمالهم وقرابينهم {cite:muruj-al-dhahab p. 547}.، وعند المسعودي نقض رسالة الكندي في إبطال صنعة الذهب وأرى القول أن ما ذكره الكندي فاسد وأن ذلك قد يتأتى فعله، وصنف في هذا المعنى كتباً في الأحجار المعدنية والشعر وكيفية الأعمال {cite:muruj-al-dhahab p. 620}، وزعم أنه لا يجوز أن يصح علم الفيلسوف ولا يسمى الإنسان فيلسوفا إلا أن يصح له علم صناعة الكيمياء، وأن جماعة من الفلاسفة كفيثاغورس وديموقراط وأفلاطون وأرسطاطاليس وجالينوس كانوا يعملون الصناعة، ويقول في كتبه المؤلفة في الصنعة قال أستاذنا أبو موسى جابر بن حيان {cite:fihrist-ibn-al-nadim p. 494,500}"
  en: "The philosopher-physician, author of the Mansuri — al-Mas'udi saw his book on the Harranian Sabians' doctrines (apart from the rival Kimariyyun), whose rites he judged too ugly to repeat {cite:muruj-al-dhahab p. 547}."
