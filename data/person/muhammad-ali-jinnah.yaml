    note: "Built unknown under the founder's ruling of 5 November 2026 (rulings packet §1, option A): every reading is preserved and none is followed, because the readings contest one another and the man himself refused both labels. THE TWELVER READING. The English article's text: the family 'was from a Gujarati Khoja Shi'a Muslim background, though Jinnah later followed the Twelver Shi'a teachings. After his death, his relatives and other witnesses claimed that he had converted in later life to the Sunni sect. His religion at the time of his death was disputed in multiple court cases.' Vali Nasr, quoted in the article and in the article on his death and state funeral: Jinnah 'was an Ismaili by birth and a Twelver Shia by confession, though not a religiously observant man.' His biographer Yasser Latif Hamdani has described him as having 'joined the Khoja Ithna Ashari Shia Jamaat in the early 1900s' (as reported in the 2026 evidence survey at alvidscriptorium.com, a second-hand pointer to Hamdani's published work). Two documentary acts point the same way: his 1939 will is reported to have followed the Ja'fari (Twelver) law of bequests (the thuluth cap), and after his death Fatima Jinnah and Prime Minister Liaquat Ali Khan jointly filed an affidavit describing him as a 'Shia Khoja Mohamedan' so that the estate would be administered under Shia inheritance law. The Urdu article's text likewise asserts that he was of a Gujarati Khoja Ismaili Shia background and later adopted the Twelver school, displaying his nikahnama as proof. THE SUNNI READING. Syed Sharifuddin Pirzada testified in court that Jinnah converted to Sunni Islam in 1901, when his sisters married Sunnis (carried in both English articles). An eminent lawyer who practised in the Bombay High Court until 1940 testified that Jinnah used to pray as an orthodox Sunni. Akbar S. Ahmed's considered conclusion, in Jinnah, Pakistan and Islamic Identity, is that by the end of his life Jinnah 'had become a firm Sunni Muslim' (as carried in both articles). HIS OWN PUBLIC POSITION. Liaquat H. Merchant, his grandnephew: 'the Quaid was not a Shia; he was also not a Sunni, he was simply a Muslim.' As Akbar Ahmed records it (1997, p. 98, quoted in the Maarif Research Journal study): 'He never declared himself a Sunni or a Shia. Whenever enquired about it, he always asked: Was Muhammad Shia or Sunni? and always said: I am a Muslim like the Prophet.' Khaled Ahmed: publicly Jinnah 'was at pains to gather the Muslims of India under the banner of a general Muslim faith and not under a divisive sectarian identity.' THE COURTS NEVER SETTLED IT. The sect was litigated for forty years over his estate: the 1948 Shia affidavit was rejected in 1970 (a 1970 decision separately described his faith as making him 'neither Shia nor Sunni'); in 1976 the court rejected the Sunni-conversion claim, effectively accepting him as a Shia; in 1984 a Division Bench reversed 1976 and maintained that 'the Quaid was definitely not a Shia.' No ruling stands unreversed. STRUCTURED VALUES SETTLE NOTHING: the Arabic article's infobox gives his religion as 'Muslim (secular)' and the Urdu article's as 'Islam'; the English article's categories file him among Sunni Muslims, former Shia Muslims and converts — filings, not attestations; Wikidata's religion statement is structured data of the same family. NOR DOES FAMILY: his sister Fatima's record is shia-twelver/documented on attestations about her herself; family background never counts, and her settlement transfers nothing to him. The Arabic article's text adds only that the family belonged to the Bohra Ismaili branch and that he studied the Twelver teachings and the Sunni schools. Two independent texts naming one school for the man himself, uncontested, do not exist; under the doubt rule the value is unknown."
