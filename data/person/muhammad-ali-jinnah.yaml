summary:
  ar: "محامٍ وسياسي (1876–1948) ومؤسس دولة باكستان. تدرّب في لينكولن إن بلندن ودُعي إلى نقابة المحاماة سنة 1895، وبزغ في المؤتمر الوطني الهندي داعيةً للوحدة بين الهندوس والمسلمين — فكان من صانعي حلف لكناو سنة 1916 — قبل أن يتزعم عصبة مسلمي عموم الهند منذ 1913؛ وحملت نقاطه الأربع عشرة (1929) وقرار لاهور (1940) مطلب الدولة المسلمة المستقلة إلى قيام باكستان في 14 أغسطس 1947، فكان أول حاكم عام لها حتى وفاته. يُعرف في باكستان بـ«القائد الأعظم» و«أبو الأمة». لم يعلن جناح نفسه انتماءً دينيًا قط، وظل انتماؤه موضوع نزاع قضائي أربعين سنة بعد وفاته دون حسم، فيسجّله المتحف مجهولًا مع حفظ القراءات كلها."
  en: "Barrister and politician (1876–1948), the founder of Pakistan. Trained at Lincoln's Inn in London and called to the bar in 1895, he rose in the Indian National Congress as an advocate of Hindu–Muslim unity — he helped shape the Lucknow Pact of 1916 — before leading the All-India Muslim League from 1913; his Fourteen Points (1929) and the League's Lahore Resolution (1940) carried the demand for a separate Muslim state to the creation of Pakistan on 14 August 1947, and he was its first Governor-General until his death. In Pakistan he is the Quaid-e-Azam ('Great Leader') and Baba-e-Qaum ('Father of the Nation'). Jinnah never publicly declared a religious affiliation of his own, and his was litigated for forty years after his death without a settled outcome; the museum records it as unknown, with every reading preserved."
  ur: "وکیل اور سیاست دان (1876ء–1948ء)، بانیِ پاکستان۔ لنکنز اِن لندن سے تربیت پائی اور 1895ء میں بار میں بلائے گئے؛ آل انڈیا کانگریس میں ہندو مسلم اتحاد کے وکیل کے طور پر ابھرے — 1916ء کے میثاقِ لکھنؤ کی تشکیل میں ان کا کردار تھا — پھر 1913ء سے آل انڈیا مسلم لیگ کے سربراہ رہے؛ ان کے چودہ نکات (1929ء) اور لیگ کی قراردادِ لاہور (1940ء) نے علاحدہ مسلم ریاست کے مطالبے کو 14 اگست 1947ء کو قیامِ پاکستان تک پہنچایا، اور وہ اس کے پہلے گورنر جنرل ہوئے تا وفات۔ پاکستان میں وہ قائدِ اعظم اور بابائے قوم ہیں۔ جناح نے خود کبھی اپنے مذہبی انتماء کا اعلان نہیں کیا، اور ان کی وفات کے بعد چالیس برس تک یہ معاملہ عدالتوں میں بے نتیجہ رہا؛ عجائب گھر اسے نامعلوم درج کرتا ہے، تمام قراءات محفوظ رکھتے ہوئے۔"
