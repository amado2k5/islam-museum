summary:
  ar: عالم بحريني من أبرز مراجع التمويل الإسلامي المعاصر. درس الشريعة تقليديًا في البحرين ومكة ونال اقتصاديات وأديانًا مقارنة من جامعة مكغيل بكندا ودكتوراه في الشريعة؛ يجلس على عشرات هيئات الرقابة الشرعية
    لبنوك ومؤسسات عالمية، وعضو هيئة المحاسبة والمراجعة للمؤسسات المالية الإسلامية ⁦(AAOIFI)⁩، ويوصف بأنه «حارس بوابة» سوق التمويل الإسلامي.
  en: Bahraini scholar and among the leading references of contemporary Islamic finance. Traditionally trained in sharia in Bahrain and Mecca and holding an economics and comparative-religion degree from
    McGill University and a doctorate in Islamic law, he sits on dozens of sharia supervisory boards of global banks and institutions, is a member of AAOIFI, and has been described as the 'gatekeeper' of
    the Islamic finance market.
  ur: بحرینی عالم اور عصری اسلامی مالیات کے ممتاز مراجع میں سے ایک۔ بحرین اور مکہ میں روایتی شرعیات پڑھیں، کینیڈا کی مکگل یونیورسٹی سے معیشت و تقابلی اديان کی ڈگری اور اسلامی قانون میں ڈاکٹریٹ لی؛ عالمی
    بینکوں اور اداروں کے درجنوں شرعی نگرانی بورڈوں کے رکن ہیں، AAOFI کے ممبر ہیں، اور انہیں اسلامی مالیاتی بازار کا «نگہبان» کہا گیا ہے۔
  es: "Académico bareiní y una de las principales referencias en finanzas islámicas contemporáneas. Formado tradicionalmente en la sharia en Baréin y La Meca, licenciado en economía y religiones comparadas por la Universidad McGill y doctor en derecho islámico, forma parte de decenas de consejos de supervisión de la sharia de bancos e instituciones globales, es miembro de la AAOIFI y ha sido descrito como el \"guardián\" del mercado de las finanzas islámicas."
  fr: "Érudit bahreïni et figure parmi les plus grandes références de la finance islamique contemporaine. Formé à la charia à Bahreïn et à La Mecque, titulaire d'une licence en économie et religions comparées de l'Université McGill et d'un doctorat en droit islamique, il siège dans des dizaines de conseils de surveillance de la charia de banques et d'institutions internationales, est membre de l'AAOIFI et est considéré comme le « gardien » du marché de la finance islamique."
  tr: "Bahreynli bir akademisyen ve çağdaş İslami finansın önde gelen referanslarından biridir. Geleneksel olarak Bahreyn ve Mekke'de Şeriat çalışmış, Kanada'daki McGill Üniversitesi'nden ekonomi ve karşılaştırmalı dinler almış ve Şeriat alanında doktora derecesi almıştır; bankalar ve küresel kurumlar için onlarca Şeriat denetim kurulunda yer almakta, İslami Finans Kurumları Muhasebe ve Denetim Organizasyonu (AAOIFI) üyesidir ve İslami finans piyasasının \"kapı bekçisi\" olarak tanımlanmaktadır."
  id: "Seorang cendekiawan Bahrain dan salah satu referensi terkemuka dalam keuangan Islam kontemporer. Ia secara tradisional mempelajari Syariah di Bahrain dan Mekah, meraih ekonomi dan agama perbandingan dari Universitas McGill di Kanada, serta meraih gelar PhD dalam Syariah; ia duduk di puluhan dewan pengawas Syariah untuk bank dan institusi global, menjadi anggota Organisasi Akuntansi dan Audit untuk Lembaga Keuangan Islam (AAOIFI), dan digambarkan sebagai \"penjaga gerbang\" pasar keuangan Islam."
