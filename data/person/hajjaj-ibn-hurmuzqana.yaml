summary:
  ar: "الحجاج بن هرمزقنة أبو جعفر القائد، كان قد استنابه بهاء الدولة بالعراق وندبه لحرب الأعراب والأكراد، وكان مقدماً في أيام عضد الدولة وأولاده عارفاً بالحرب شجاعاً صاحب هيبة عظيمة وآراء صائبة، فلما خرج عن بغداد في رمضان سنة اثنتين وتسعين وقعت بها الفتن وتشتت الأمن. توفي بالأهواز في ربيع الأول سنة أربعمائة عن مائة وخمس سنين {cite:muntazam-ibn-al-jawzi j.7 p.248}."
