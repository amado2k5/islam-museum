id: person/hajjaj-ibn-hurmuzqana
class: person
label: { ar: "الحجاج بن هرمزقنة أبو جعفر القائد" }
summary:
  ar: "الحجاج بن هرمزقنة أبو جعفر القائد، كان قد استنابه بهاء الدولة بالعراق وندبه لحرب الأعراب والأكراد، وكان مقدماً في أيام عضد الدولة وأولاده عارفاً بالحرب شجاعاً صاحب هيبة عظيمة وآراء صائبة، فلما خرج عن بغداد في رمضان سنة اثنتين وتسعين وقعت بها الفتن وتشتت الأمن. توفي بالأهواز في ربيع الأول سنة أربعمائة عن مائة وخمس سنين {cite:muntazam-ibn-al-jawzi j.7 p.248}."
  tr: "El-Hacı bin Hurmuzqana, Ebu Ca'far el-Kaid, Baha' al-Dawla tarafından Irak'ta atanmış ve Araplar ile Kürtlerle savaşmak üzere görevlendirilmişti. Adud al-Dawla ve oğullarının günlerinde komutandı; savaşta bilgili, cesur ve büyük prestije ve sağduyulu muhakemeye sahipti. Doksan ikinci yılın Ramazan ayında Bağdat'tan ayrıldığında, çatışma ve güvenlik dağıldı. 405 Hile yılında Rabi'al-Awwal'da Ahvaz'da öldü {atıf:muntazam-ibn-al-jawzi j.7 s.248}."
  id: "Al-Hajjaj ibn Hurmuzqana, Abu Ja'far al-Qa'id, telah diangkat oleh Baha' al-Dawla di Irak dan menugaskannya untuk melawan Arab dan Kurdi. Ia adalah seorang komandan pada masa Adud al-Dawla dan putra-putranya, berpengetahuan dalam peperangan, berani, dan memiliki prestise serta penilaian yang bijaksana. Ketika ia meninggalkan Baghdad pada Ramadan tahun sembilan puluh dua, perselisihan dan keamanan pun tercerai. Ia meninggal di Ahvaz di Rabi' al-Awwal pada tahun 405 H {cite:muntazam-ibn-al-jawzi j.7 hlm.248}."
