    note: "Two independent texts attest Ali-Hajji's personal position inside Dagestan's Sufi murid institution. The English text records that Mamma-Hajji was 'a murid of Ali-Hajji', that he used his resources 'to travel with 500 murids to various locations in Dagestan', and that as a young man he was the student of 'tariqa sheikh Abdurrahman-Hajji as-Suguri' among other Dagestani theologians. The Russian text independently records that he 'had many murids' (Имел множество мюридов) in the Temir-Khan-Shura, Dargin and Kaytago-Tabasaran districts, and quotes his own stated aim to make of the people of Akusha 'true servants of God, that is, my murids'. A sheikh personally holding a murid following of his own, attested in two texts, is documented Sufi affiliation of the discipleship kind, and the segment is recorded as sufi, documented. Neither text names his order: as-Suguri was a Naqshbandi sheikh, but a teacher's order is not the pupil's recorded affiliation, so no order is specified and no member_of edge is written. No madhhab segment is recorded: no text names a school for him; his offices of qadi and shaykh al-Islam are office-holding and never count, and Wikidata's religion value is Islam in general."
