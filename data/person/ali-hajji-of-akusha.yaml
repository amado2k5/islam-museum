summary:
  ar: "علي حاجي الأكوشي (1847–1930)، عالم وفقيه داغستاني من أكوشا، صار قاضي مسجدها الجامع ثم انتُخب شيخا للإسلام لشمال القوقاز وداغستان سنة 1918؛ ترأس مجلس الدفاع الذي قاوم اجتياح قوات جنوب روسيا البيضاء لداغستان، وكان له مريدون كثيرون في داغستان الوسطى؛ أيّد البلاشفة أولا طمعا في الشريعة ثم عارض سياستهم المعادية للدين، فأعدم النظام السوفيتي كثيرا من أتباعه وأبنائه سنة 1928 ومات في أكوشا بعد ذلك بقليل."
  en: "Ali-Hajji of Akusha (1847–1930) was a Dagestani scholar and jurist from Akusha who became qadi of its congregational mosque and was elected shaykh al-Islam of the Northern Caucasus and Dagestan in 1918. He chaired the Security Council that resisted the White invasion of Dagestan, and had a large murid following in central Dagestan. He first supported the Bolsheviks in hope of sharia, then opposed their anti-religious policy; the Soviet regime executed many of his followers and sons in 1928, and he died at Akusha soon after."
  ur: "علی حاجی اکوشا (1847–1930) اکوشا کے داغستانی عالم اور فقیہ تھے، جو وہاں کی جامع مسجد کے قاضی بنے اور 1918 میں شمالی قفقاز و داغستان کے شیخ الاسلام منتخب ہوئے۔ انہوں نے سلامتی کونسل کی صدارت کی جس نے داغستان پر سفید فوج کے حملے کی مزاحمت کی، اور وسطی داغستان میں ان کے مریدوں کی بڑی تعداد تھی۔ انہوں نے ابتدا میں شریعت کی امید پر بالشویکوں کی حمایت کی، پھر ان کی مذہب دشمن پالیسی کی مخالفت کی؛ سوویت نظام نے 1928 میں ان کے بہت سے پیروکاروں اور بیٹوں کو سزائے موت دی، اور اس کے کچھ عرصے بعد اکوشا میں ان کا انتقال ہوا۔"
