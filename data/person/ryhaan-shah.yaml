summary:
  ar: "روائية وكاتبة غيانية من أصل هندي وُلدت في بربيس، تُعدّ من أبرز كتّاب الكاريبي المعاصرين. روايتها الأولى «حياة صامتة» ⁦(A Silent Life، 2005)⁩ فازت بجائزة غيانا للأدب لأفضل كتاب أول، وهي رئيسة جمعية التراث الهندي الغياني."
  en: "Indo-Guyanese novelist and writer born in Berbice, counted among the best contemporary writers in Guyana and the Caribbean. Her first novel A Silent Life (2005) won the Guyana Prize for Literature's Best First Book award, and she is president of the Guyanese Indian Heritage Association."
  ur: "ہندی نژاد گیانی ناول نگار اور مصنفہ جو بربیس میں پیدا ہوئیں اور گیانا و کیریبین کی بہترین معاصر مصنفات میں شمار ہوتی ہیں۔ ان کا پہلا ناول A Silent Life ⁦(2005ء)⁩ گیانا پرائز فار لٹریچر کا بہترین پہلی کتاب کا ایوارڈ جیت چکا ہے، اور وہ گیانیز انڈین ہیرٹیج ایسوسی ایشن کی صدر ہیں۔"
  es: "Novelista y escritora indo-guyanesa nacida en Berbice, considerada una de las mejores escritoras contemporáneas de Guyana y el Caribe. Su primera novela, Una vida silenciosa (2005), ganó el premio al mejor primer libro del Premio de Literatura de Guyana, y es presidenta de la Asociación de la Herencia India de Guyana."
  fr: "Romancière et écrivaine indo-guyanaise née à Berbice, elle compte parmi les meilleurs auteurs contemporains du Guyana et des Caraïbes. Son premier roman, Une vie silencieuse (2005), a remporté le prix du meilleur premier roman décerné par le Guyana Prize for Literature. Elle est également présidente de la Guyanese Indian Heritage Association."
  tr: "Barbies doğumlu Hint kökenli Guyanalı romancı ve yazar olan Sherly, çağdaş Karayiplerin en önde gelen yazarlarından biri olarak kabul edilir. İlk romanı \"A Silent Life\" (2005), En İyi İlk Kitap dalında Guyana Ödülü'nü kazandı ve Guyana Hint-Miras Derneği'nin başkanıdır."
  id: "Seorang novelis dan penulis asal Guyana keturunan India, lahir di Barbie, ia dianggap sebagai salah satu penulis Karibia kontemporer paling menonjol. Novel pertamanya, \"A Silent Life\" (2005), memenangkan Guyana Prize untuk Buku Pertama Terbaik, dan ia menjabat sebagai presiden Asosiasi Indo-Heritage Guyana."
