    note: "What each source gives, stated exactly: no source names a religion or a school for him — the Turkish infobox religion field (dini) is empty, the Arabic stub names no religion, and Wikidata carries no religion (P140) value at all. What the sources do give is a philosophy: the English article presents him as a positivist ideologue formed by Auguste Comte and Pierre Laffitte, an active member of the Société Positiviste who served as its Muslim or Ottoman representative at international positivist conferences; Wikidata likewise records only his movement (positivism, P135) and his influence by Comte. The same English article reports that conservative Young Turks and supporters of Abdülhamid II accused him of atheism, and that Islamist rioters put him at the top of their hit list during the 31 March Incident 'due to his alleged atheism' — an opponents' accusation, not a self-description; the article also reports him condemning the Hamidian massacres as contrary to the traditions of Islam and the precepts of the Qur'an. His mother was a Munich-born convert to Islam who married his father (family background, which never counts). Positivism is a philosophy, not a school, and an accusation is not an attestation; under the two-source rule and the doubt rule his faith is left unknown, with all the readings preserved here."
