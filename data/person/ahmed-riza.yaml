summary:
  ar: "أحمد رضا (وُلد في إسطنبول سنة 1858 عند الإنجليزية والتركية و1859 عند العربية وويكيبيانات – توفي فيها في 26 فبراير 1930)، سياسي وكاتب عثماني تركي ومن أبرز شباب الأتراك، قاد فرع جمعية الاتحاد والترقي في باريس نحو عشرين سنة وأسّس جريدة «مشورت»، ونقل وضعية أوغست كونت إلى الفكر التركي، وصار بعد ثورة 1908 أول رئيس لمجلس المبعوثان المستعاد فلُقّب «أبا الحرية»، وكان من قلائل السياسيين الذين أدانوا إبادة الأرمن أثناء وقوعها."
  en: "Ahmed Rıza (born in Istanbul in 1858 by the English and Turkish articles, 1859 by the Arabic article and Wikidata – died there on 26 February 1930) was an Ottoman-Turkish politician and author, a leading Young Turk who ran the Paris branch of the Committee of Union and Progress for nearly twenty years, founded the journal Meşveret, carried Auguste Comte's positivism into Turkish thought, became the first President of the restored Chamber of Deputies after the 1908 revolution — hailed as the 'Father of Liberty' — and was among the few politicians who condemned the Armenian genocide while it was happening."
  ur: "احمد رضا (پیدائش: استنبول، 1858ء/1859ء – وفات: استنبول، 26 فروری 1930ء)، عثمانی ترک سیاست دان و مصنف، نوجوان ترکوں کے رہنما، پیرس میں جمعیتِ اتحاد و ترقی کے سربراہ، «مشورت» کے بانی اور آگسٹ کومٹ کی اثباتیت کو ترکی میں متعارف کرانے والے اولین مفکر۔"
