summary:
  ar: "العلامة محمود شكري بن عبد الله الألوسي البغدادي، من أسرة بغدادية علمية، عُني بإحياء تراث السلف ونشر كتبه، وانتسب جده أبو الثناء الألوسي إلى تفسير «روح المعاني»."
  en: "The Baghdadi scholar Mahmud Shukri ibn Abd Allah al-Alusi, of a Baghdad family of scholars; he devoted himself to editing and publishing the classical heritage, and his grandfather was the author of the tafsir 'Ruh al-Ma'ani'."
  es: "El erudito bagdadí Mahmud Shukri ibn Abd Allah al-Alusi, perteneciente a una familia de eruditos de Bagdad, se dedicó a editar y publicar el legado clásico, y su abuelo fue el autor del tafsir 'Ruh al-Ma'ani'."
  fr: "Le savant bagdadien Mahmud Shukri ibn Abd Allah al-Alusi, issu d'une famille de savants de Bagdad, s'est consacré à l'édition et à la publication du patrimoine classique, et son grand-père était l'auteur du tafsir 'Ruh al-Ma'ani'."
  ur: "بغدادی عالم محمود شکری ابن عبد اللہ العلوسی، بغداد کے علماء کے ایک خاندان سے؛ اس نے اپنے آپ کو کلاسیکی ورثے کی تدوین اور اشاعت کے لیے وقف کر دیا، اور ان کے دادا تفسیر 'روح المعانی' کے مصنف تھے۔"
  tr: "Bağdadlı bir alim ailesinden gelen âlim Mahmud Şukri bin Abdullah Al-Alusi Al-Bağdadi, Selef mirasını canlandırmaya ve kitaplarını yayımlamaya kendini adamıştı. Dedesi Ebu Al-Thanaa Al-Alusi, \"Ruh al-Ma'ani\"nin yorumuyla ilişkilendirildi."
  id: "Cendekiawan Mahmoud Shukri bin Abdullah Al-Alusi Al-Baghdadi, dari keluarga sarjana Baghdadi, berdedikasi untuk menghidupkan kembali warisan Salaf dan menerbitkan bukunya. Kakeknya, Abu Al-Thanaa Al-Alusi, dikaitkan dengan interpretasi \"Ruh al-Ma'ani.\""
