summary:
  ar: "محمد بن عبد الوهاب بن عبد الرحمن الثقفي النيسابوري، الأستاذ أبو علي، الإمام الجليل الجامع بين الفقه والكلام والوعظ والورع، شيخ الحاكم النيسابوري. بذل ظاهر التصوف بنيسابور وتكلم على الصوفية أحسن كلام. قال أبو بكر الشبلي في مجالسه: كلام هذا الرجل بالغدوات في علم الحقائق معجز، وقال له ابن خزيمة بعد أن أجاب عن مسائله: ما يحل لأحد منا بعد اليوم أن يفتي وأنت حي، وقال ابن سريج: ما جاءنا من خراسان أفقه منه. توفي ليلة الجمعة ودفن يوم الجمعة الثالث والعشرين من جمادى الأولى سنة 328 وهو ابن تسع وثمانين سنة، وشهد الحاكم الصلاة عليه وقال ما رأى بنيسابور بعده مثل ذلك الجمع {cite:tabaqat-shafiiyya-subki j.2 p.172-173}."
  en: "Muhammad ibn Abd al-Wahhab al-Thaqafi al-Naysaburi, the master Abu 'Ali (d. 23 Jumada I 328, aged 89) — 'the imam joined fiqh, kalam, preaching and scrupulosity' and was al-Hakim's shaykh; he displayed Sufism openly at Nishapur and spoke of the Sufis in the best terms. Ibn Khuzayma, after setting him questions, said: 'no one of us may issue fatwa while you live'; Ibn Surayj: 'no one more learned in fiqh ever came to us from Khurasan'; al-Shibli judged his morning discourses 'miraculous in the science of realities'. Buried on Friday, al-Hakim attending a funeral gathering unlike anything seen at Nishapur after him {cite:tabaqat-shafiiyya-subki j.2 p.172-173}."
  ur: "محمد بن عبد الوہاب ثقفی نیشاپوری، استاذ ابو علی (مت 328ھ، 89 سال) — فقہ، کلام، وعظ اور ورع کے جامع امام اور حاکم نیشاپوری کے شیخ۔ ابن خزیمہ کا قول: تمہارے زندہ رہتے کسی کو فتویٰ کی اجازت نہیں؛ ابن سریج: خراسان سے اس سے بڑھ کر فقیہ کوئی نہیں آیا؛ شبلی نے ان کی صبح کی مجلسوں کو علمِ حقائق میں معجز قرار دیا۔ جمعہ کی رات وفات، حاکم نے نمازِ جنازہ میں شرکت کی {cite:tabaqat-shafiiyya-subki j.2 p.172-173}."
