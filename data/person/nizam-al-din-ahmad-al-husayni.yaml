summary:
  ar: "نظام الدين أحمد الحسيني (7 تموز 1618 – أيار 1674) علويّ من أسرة سادة من أصل إيراني استقرت في الحجاز، وُلد في الطائف وتعلّم الفقه والحديث والمنطق. هاجر إلى الدكن فتزوّج ابنة السلطان عبد الله قطب شاه، وصار رئيس وزراء سلطنة قلقندة (1656–1672) ولُقّب بعين الملك، ورعى الثقافة العربية الأدبية في بلاطها. بعد وفاة قطب شاه سُجن وقُتل في أيار 1674، على الأرجح بالسم. وهو والد الأديب ابن معصوم المدني صاحب «سلافة العصر»."
  en: "Nizam al-Din Ahmad al-Husayni (7 July 1618 – May 1674) was a sayyid of an Iranian-descended family settled in the Hejaz, born at Taif and educated in jurisprudence, hadith and logic. He migrated to the Deccan, married a daughter of Sultan Abdullah Qutb Shah, and became prime minister of the Sultanate of Golconda (1656–1672) with the title Ayn al-Mulk, patronising Arabic literary culture at its court. After Qutb Shah's death he was imprisoned and killed in May 1674, likely by poisoning. He was the father of the writer Ibn Ma'sum al-Madani, author of Sulafat al-Asr."
  ur: "نظام الدین احمد حسینی (7 جولائی 1618ء – مئی 1674ء) حجاز میں آباد ایرانی النسل سادات خاندان کے سید تھے، طائف میں پیدا ہوئے اور فقہ، حدیث اور منطق کی تعلیم پائی۔ دکن ہجرت کر کے سلطان عبد اللہ قطب شاہ کی بیٹی سے شادی کی اور سلطنتِ قلقندہ کے وزیرِ اعظم بنے (1656ء–1672ء)، «عین الملک» کا لقب پایا اور دربار میں عربی ادبی ثقافت کی سرپرستی کی۔ قطب شاہ کی وفات کے بعد قید ہوئے اور مئی 1674ء میں قتل کر دیے گئے، غالباً زہر سے۔ وہ ادیب ابن معصوم مدنی، صاحبِ «سلافۃ العصر»، کے والد تھے۔"

