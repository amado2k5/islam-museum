id: person/jafar-ibn-yahya-al-barmaki
class: person
label: { ar: "جعفر بن يحيى البرمكي" }
summary:
  ar: "ذكر الطبري أن هلاكه وهلاك البرامكة كان بسبب صبر الرشيد عنه وعن أخته عباسة بنت المهدي {cite:tabari-tarikh-abu-al-fadl j.8 p.294}. ورد الأمين عند خروجه من الكعبة يحلف له فإن غدرت بأخيك خذلك الله ثلاثاً فكان ذلك سبب اضطغان أم جعفر عليه {cite:muruj-al-dhahab p. 341}، وحمل خادمه معه ألف دينار على أن يجعلها للأصمعي إن أضحكه فلما رأى رثاثة داره أمسكها وقال ظهور الصنيعة أمدح من مدحه، وقيل في الرشيد وإياه أضاف إلى بيعة بيعة فقام بها جعفر وحده {cite:muruj-al-dhahab p. 357}"
  tr: "El-Taberi, kendisinin ve Barmakilerin ölümünün el-Reşid'in kendisine ve kız kardeşi Abbasa bint al-Mahdi'ye gösterdiği sabır sayesinde olduğunu belirtti {cite:tabari-tarikh-abu-al-fadl j.8 s.294}. Güvenilir kişi Kabe'den ayrıldıktan sonra geri döndü ve ona yemin etti: 'Kardeşini ihanet edersen, Allah seni üç kez hayal kırıklığına uğratsın.' Bu yüzden Um Ca'far'ın ona karşı öfkesi buydu {cite:muruj-al-dhahab s. 341}. Hizmetçisini yanında bin dinar aldı, eğer al-Asma'i'ye alay ederse vereceği şartı vardı. Harabe evi görünce onu tuttu ve yaptığı işin görünüşünün övgüden daha değerli olduğunu söyledi. Al-Rashid ve onun hakkında, Ja'far'ın tek başına yaptığı bir rehin eklediği söylenir {cite:muruj-al-dhahab, s. 357}"
  id: "Al-Tabari menyebutkan bahwa kematiannya dan kematian Barmakid disebabkan oleh kesabaran al-Rashid terhadapnya dan saudara perempuannya Abbasa bint al-Mahdi {cite:tabari-tarikh-abu-al-fadl j.8 hlm.294}. Orang yang dipercaya kembali setelah meninggalkan Ka'bah dan bersumpah kepadanya, 'Jika kamu mengkhianati saudaramu, semoga Allah mengecewakanmu tiga kali.' Inilah alasan kemarahan um Ja'far terhadapnya {cite:muruj-al-dhahab hlm. 341}. Dia membawa pelayannya seribu dinar dengan syarat dia akan memberikannya kepada al-Asma'i jika dia menertawakannya. Ketika dia melihat rumah yang rusak itu, dia memegangnya dan berkata bahwa penampilan perbuatan itu lebih terpuji daripada pujian. Dikatakan tentang al-Rashid dan dia menambahkan janji pada janji itu, yang dilakukan Ja'far sendiri {cite:muruj-al-dhahab, hlm. 357}"
