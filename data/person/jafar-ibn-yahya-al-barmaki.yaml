summary:
  ar: "ذكر الطبري أن هلاكه وهلاك البرامكة كان بسبب صبر الرشيد عنه وعن أخته عباسة بنت المهدي {cite:tabari-tarikh-abu-al-fadl j.8 p.294}. ورد الأمين عند خروجه من الكعبة يحلف له فإن غدرت بأخيك خذلك الله ثلاثاً فكان ذلك سبب اضطغان أم جعفر عليه {cite:muruj-al-dhahab p. 341}، وحمل خادمه معه ألف دينار على أن يجعلها للأصمعي إن أضحكه فلما رأى رثاثة داره أمسكها وقال ظهور الصنيعة أمدح من مدحه، وقيل في الرشيد وإياه أضاف إلى بيعة بيعة فقام بها جعفر وحده {cite:muruj-al-dhahab p. 357}"
