summary:
  ar: "صاحب الروم الملك الغالب عز الدين كيكاوس بن كيخسرو بن قلج أرسلان السلجوقي؛ سلطان قونية وأقصراي وملطية وأخو السلطان علاء الدين كيقباد؛ ذكرت الشذرات أنه أخذ إنطاكية من الفرنج سنة اثنتي عشرة وستمائة — وإنطاكية بقيت في يد الفرنج إلى سنة ست وستين وستمائة فالظاهر التباس في اسم المدينة والأرجح أنها سينوب التي فتحها سنة إحدى عشرة وستمائة؛ كان في وصف ابن العماد ظلوماً غشوماً سفاكاً للدماء، قيل إنه مات فجأة مخموراً فأخرجوا أخاه علاء الدين وملّكوه بعده وذلك في شوال سنة خمس عشرة وستمائة {cite:shadharat-dhahab p. 49, 64}."
