id: person/kaykawus-i
class: person
label: { ar: "كيكاوس الأول" }
summary:
  ar: "صاحب الروم الملك الغالب عز الدين كيكاوس بن كيخسرو بن قلج أرسلان السلجوقي؛ سلطان قونية وأقصراي وملطية وأخو السلطان علاء الدين كيقباد؛ ذكرت الشذرات أنه أخذ إنطاكية من الفرنج سنة اثنتي عشرة وستمائة — وإنطاكية بقيت في يد الفرنج إلى سنة ست وستين وستمائة فالظاهر التباس في اسم المدينة والأرجح أنها سينوب التي فتحها سنة إحدى عشرة وستمائة؛ كان في وصف ابن العماد ظلوماً غشوماً سفاكاً للدماء، قيل إنه مات فجأة مخموراً فأخرجوا أخاه علاء الدين وملّكوه بعده وذلك في شوال سنة خمس عشرة وستمائة {cite:shadharat-dhahab p. 49, 64}."
  tr: "Roma hükümdarı, baskın kral İzzeddin Kaykaus ibn Kaykhosrow ibn Kilij Arslan Selçuklu; Konya, Aksra ve Malatya Sultanı ve Sultan Ala al-Din Kayqubad'ın kardeşiydi; parçalar, onun altı yüz on ikinci yılında Franklardan Antakya'yı aldığını belirtir — ve Antakya, altmış altı yüz yılına kadar Frankların kontrolünde kalmıştır. Görünüşe göre şehrin adı konusunda karışıklık vardır, muhtemelen on altı hicri yılında fethettiği Sinob'dur. İbn el-İmad, zalim, zalim ve kana susamış olarak tanımlanmıştır. Aniden sarhoş olarak öldüğü söylenir, bu yüzden kardeşi Ala al-Din sürgün edilmiş ve kralı on altı Hicri yılında Şevval'de onun ardından alınmıştır {atıf:shadharat-dhahab s. 49, 64}."
  id: "Penguasa Romawi adalah raja dominan Izz al-Din Kaykaus ibn Kaykhosrow ibn Kilij Arslan dari Seljuk; Sultan Konya, Aqsra, dan Malatya, serta saudara Sultan Ala al-Din Kayqubad; fragmen menyebutkan bahwa ia merebut Antiokhia dari bangsa Franka pada tahun enam ratus dua belas — dan Antiokhia tetap berada di bawah pemerintahan bangsa Franka hingga tahun enam puluh enam ratus. Tampaknya, ada kebingungan mengenai nama kota ini, kemungkinan besar nama Sinob, yang ia taklukkan pada tahun enam belas H. Ibn al-Imad digambarkan sebagai kejam, kejam, dan haus darah. Dikatakan ia meninggal mendadak dalam keadaan mabuk, sehingga saudaranya Ala al-Din diusir dan rajanya ditangkap setelahnya di Shawwal pada tahun enam belas H {cite:shadharat-dhahab hlm. 49, 64}."
