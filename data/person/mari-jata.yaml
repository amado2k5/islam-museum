label:
  ar: ماري جاطة
  en: Mari Jata (Sundiata Keita)
summary:
  ar: مؤسس مملكة مالي وأعظم ملوك السودان الغربي. معنى اسمه عندهم «جاطة» الأسد و«ماري» الملك. تغلب على أهل صوصو وانتزع من أيديهم ملك أهل غانة القديم فملك من النيل إلى المحيط الأطلسي.
  en: Founder of the Mali Empire and the greatest of the western Sudanese kings; in their tongue jata means lion and mari means king. He defeated the Susu and wrested from them the old kingdom of Ghana, ruling from the Niger to the Atlantic.
