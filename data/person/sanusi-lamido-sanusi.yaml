summary:
  ar: "مصرفي واقتصادي نيجيري وُلد في كانو سنة 1961، من أسرة فولانية حاكمة وحفيد الأمير محمد السنوسي الأول. كان محافظا للبنك المركزي النيجيري (2009–2014) وقاد إصلاحات مصرفية واسعة، ثم صار أمير كانو سنة 2014 باسم محمد السنوسي الثاني، فخُلع سنة 2020 وأُعيد سنة 2024. وهو الخليفة الروحي للطريقة التيجانية في نيجيريا منذ 2021."
  en: "Nigerian banker and economist born in Kano in 1961, of a Fulani ruling family and grandson of Emir Muhammadu Sanusi I. He was Governor of the Central Bank of Nigeria (2009–2014), where he led sweeping banking reforms, then Emir of Kano from 2014 under the regnal name Muhammadu Sanusi II; deposed in 2020, he was reinstated in 2024. Since 2021 he has also been the spiritual leader (khalifa) of the Tijaniyyah order in Nigeria."
  ur: "نائجریائی بینکار اور ماہرِ معاشیات، 1961 میں کانو میں پیدا ہوئے؛ فلانی حکمران خاندان سے تعلق اور امیر محمد سنوسی اول کے پوتے ہیں۔ وہ نائجریا کے مرکزی بینک کے گورنر رہے (2009ء–2014ء) جہاں انھوں نے وسیع بینکاری اصلاحات کیں، پھر 2014 میں ’محمد سنوسی ثانی‘ کے نام سے امیرِ کانو بنے؛ 2020 میں معزول ہوئے اور 2024 میں بحال کر دیے گئے۔ 2021 سے وہ نائجریا میں سلسلہ تیجانیہ کے روحانی پیشوا (خلیفہ) بھی ہیں۔"
