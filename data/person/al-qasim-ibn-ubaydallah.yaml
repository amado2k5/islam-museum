id: person/al-qasim-ibn-ubaydallah
class: person
label: { ar: "القاسم بن عبيد الله", en: "al-Qasim ibn Ubaydallah", fr: "al-Qasim ibn Ubaydallah", es: "al-Qasim ibn Ubaydallah", ur: "القاسم بن عبیداللہ" }
summary:
  ar: "وزير المكتفي، كان عظيم الهيبة شديد الإقدام سفاكاً للدماء والكبير والصغير على رعب منه، ممن قتله عبد الواحد بن الموفق عم المكتفي وأهلك علي بن العباس بن جريج الرومي الشاعر بسم في خشكنانجة على ما قيل، وتوفي عشية الأربعاء لعشر خلون من ربيع الآخر سنة إحدى وتسعين ومائتين وله نيف وثلاثون سنة فشرب الناس فرحاً بموته وقال قائلهم شربنا عشية مات الوزير ونشرب يا قوم في ثالثه، وأراد المكتفي نبشه وضربه وحرقه لما تبين قتله عبد الواحد {cite:muruj-al-dhahab p. 638-640}. وكان إسحاق بن حنين منقطعا إليه وخصيصا به مقدما عنده يفضي إليه بأسراره {cite:fihrist-ibn-al-nadim p. 415}"
  en: "Al-Muktafi's dread vizier who killed Abd al-Wahid b. al-Muwaffaq and poisoned Ibn al-Rumi — Baghdad drank to his death at thirty-some {cite:muruj-al-dhahab p. 638-640}."
  fr: "Le redoutable vizir d’Al-Muktafi qui a tué Abd al-Wahid b. al-Muwaffaq et empoisonné Ibn al-Rumi – Bagdad a bu jusqu’à sa mort à trente ans {cite:muruj-al-dhahab p. 638-640}."
  es: "El temido visir de Al-Muktafi que mató a Abd al-Wahid b. al-Muwaffaq y envenenó a Ibn al-Rumi — Bagdad bebió hasta su muerte a los treinta y tantos años {cite:muruj-al-dhahab p. 638-640}."
  ur: "المکتفی کا خوفناک وزیر جس نے عبد الواحد بن کو قتل کیا۔ الموفق اور ابن الرومی کو زہر دیا - بغداد نے پینتیس سال کی عمر میں اپنی موت کو پیا۔ 638-640}۔"
  tr: "Bakan el-Muktafi büyük prestijli ve son derece cesurdu; hem genç hem yaşlı kan döküyor, ondan korkuyordu. Haberlere göre, Khushkananja'da şair Basim Ali ibn el-Abbas bin Jureyc el-Rumi'yi öldüren el-Muktafi'nin amcası Abd al-Wahid ibn al-Muwaffaq tarafından öldürüldü. Çarşamba akşamı, Rabi'l-Akhir'den on ay önce, 291 Hicri yılında, otuz yaşını aşarak öldü. İnsanlar onun ölümüne sevinçle içtiler: Bakanın ölüm gecesi içtik, üçüncü gün içtik. Al-Muktafi onu kazıp dövüp yakmak istedi, çünkü Abdul Wahid'in onu öldürdüğü anlaşıldı. {cite:) Muruj-al-Dhahab s. 638-640}. İshaq ibn Hunayn ona özellikle ona bağlıydı ve sırlarını ona sundu {atıf:Fihrist-ibn-al-Nadim s. 415}"
  id: "Menteri al-Muktafi sangat bergengsi dan sangat berani, menumpahkan darah, baik muda maupun tua, ketakutan padanya. Ia dibunuh oleh Abd al-Wahid ibn al-Muwaffaq, paman al-Muktafi, yang membunuh Ali ibn al-Abbas ibn Jurayj al-Rumi, penyair Basim, di Khushkananja, menurut laporan. Ia meninggal pada Rabu malam, sepuluh bulan sebelum Rabi' al-Akhir pada tahun 291 H, di usia lebih dari tiga puluh tahun. Orang-orang minum dengan sukacita atas kematiannya, berkata: Kami minum pada malam kematian menteri, dan kami minum pada hari ketiga. Al-Muktafi ingin menggali dia, memukulinya, dan membakarnya ketika jelas bahwa Abdul Wahid telah membunuhnya. Muruj-al-Dhahab hlm. 638-640}. Ishaq ibn Hunayn sangat setia kepadanya, terutama bersamanya, dengan memberinya rahasia {cite:fihrist-ibn-al-nadim hlm. 415}"
