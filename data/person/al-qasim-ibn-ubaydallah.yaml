class: person
label: { ar: "القاسم بن عبيد الله", en: "al-Qasim ibn Ubaydallah" }
summary:
  ar: "وزير المكتفي، كان عظيم الهيبة شديد الإقدام سفاكاً للدماء والكبير والصغير على رعب منه، ممن قتله عبد الواحد بن الموفق عم المكتفي وأهلك علي بن العباس بن جريج الرومي الشاعر بسم في خشكنانجة على ما قيل، وتوفي عشية الأربعاء لعشر خلون من ربيع الآخر سنة إحدى وتسعين ومائتين وله نيف وثلاثون سنة فشرب الناس فرحاً بموته وقال قائلهم شربنا عشية مات الوزير ونشرب يا قوم في ثالثه، وأراد المكتفي نبشه وضربه وحرقه لما تبين قتله عبد الواحد {cite:muruj-al-dhahab p. 638-640}.، وكان إسحاق بن حنين منقطعا إليه وخصيصا به مقدما عنده يفضي إليه بأسراره {cite:fihrist-ibn-al-nadim p. 415}"
  en: "Al-Muktafi's dread vizier who killed Abd al-Wahid b. al-Muwaffaq and poisoned Ibn al-Rumi — Baghdad drank to his death at thirty-some {cite:muruj-al-dhahab p. 638-640}."
