summary:
  ar: "خطاط إيراني ⁦(نشط 1682–1739م)⁩ قنّن «النسخ المحيا» الكبير الواضح للمصاحف وكتب الأدعية، وكثيرًا ما حملت مصاحفه ترجمة فارسية بين الأسطر، وكان من أتباع محمد إبراهيم القمي {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  en: "Iranian calligrapher (active 1682–1739) who codified the large, clear \"revival naskh\" for Qur'ans and prayer books, whose Qur'ans often carry interlinear Persian translation; a follower of Muhammad Ibrahim Qummi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  ur: "ایرانی خطاط ⁦(فعال 1682–1739ء)⁩ جنہوں نے مصاحف اور دعاؤں کی کتابوں کے لیے بڑا اور واضح «احیائی نسخ» مرتب کیا؛ ان کے مصاحف میں اکثر سطروں کے بیچ فارسی ترجمہ ہے؛ محمد ابراہیم قمی کے پیرو {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}۔"
  es: "Calígrafo iraní (activo entre 1682 y 1739) que codificó la gran y clara \"naskh del renacimiento\" para los Coranes y libros de oraciones, cuyos Coranes a menudo llevan traducción interlineal al persa; seguidor de Muhammad Ibrahim Qummi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  fr: "Calligraphe iranien (actif de 1682 à 1739) qui a codifié le grand et clair « naskh de renaissance » pour les Corans et les livres de prières, dont les Corans comportent souvent une traduction persane interlinéaire; un disciple de Muhammad Ibrahim Qummi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  tr: "Kur'an ve dua kitapları için büyük ve açık \"Naskh\" yazısını sistemleştiren İranlı bir hattat (1682-1739 yılları arasında aktif). Kur'anlarında genellikle satır aralarında Farsça bir çeviri de yer alırdı. Muhammed İbrahim el-Kummi'nin takipçilerindendi. {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 29}"
  id: "Seorang kaligrafer Iran (aktif 1682–1739 M) yang mengkodifikasi aksara “Naskh” yang besar dan jelas untuk Al-Qur'an dan buku-buku doa. Al-Qur'an karyanya seringkali memuat terjemahan Persia di antara baris-barisnya. Ia adalah pengikut Muhammad Ibrahim al-Qummi. {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}"
