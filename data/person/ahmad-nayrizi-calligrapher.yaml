summary:
  ar: "خطاط إيراني (نشط 1682–1739م) قنّن «النسخ المحيا» الكبير الواضح للمصاحف وكتب الأدعية، وكثيرًا ما حملت مصاحفه ترجمة فارسية بين الأسطر، وكان من أتباع محمد إبراهيم القمي {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  en: "Iranian calligrapher (active 1682–1739) who codified the large, clear \"revival naskh\" for Qur'ans and prayer books, whose Qur'ans often carry interlinear Persian translation; a follower of Muhammad Ibrahim Qummi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  ur: "ایرانی خطاط (فعال 1682–1739ء) جنہوں نے مصاحف اور دعاؤں کی کتابوں کے لیے بڑا اور واضح «احیائی نسخ» مرتب کیا؛ ان کے مصاحف میں اکثر سطروں کے بیچ فارسی ترجمہ ہے؛ محمد ابراہیم قمی کے پیرو {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}۔"
