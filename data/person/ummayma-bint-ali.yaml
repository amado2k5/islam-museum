  ar: من بنات علي بن أبي طالب وفاطمة بنت النبي، تزوجت ابن عمها عبد الله بن جعفر بن أبي طالب؛ وتُعدّ من أهل البيت داخل في آية التطهير ومفهوم الكساء.
