summary:
  ar: "من خاصة عمر بن عبد العزيز، لما استخلف قال له عمر أسرك ما وليت أم ساءك فقال سرني للناس وساءني لك، قال إني أخاف أن أكون قد أوبقت نفسي قال ما أحسن حالك إن كنت تخاف إني أخاف عليك ألا تخاف، قال عظني قال أبونا آدم أخرج من الجنة بخطيئة واحدة {cite:muruj-al-dhahab p. 173}."
  en: "Umar's intimate who greeted his caliphate with 'it pleased me for the people and grieved me for you — I fear only that you will not fear' {cite:muruj-al-dhahab p. 173}."
  es: "El íntimo de Umar que saludó a su califato con 'me alegró por el pueblo y me entristeció por ti; solo temo que no temas' {cite:muruj-al-dhahab p. 173}."
  fr: "L'intime d'Umar qui a salué son califat en disant: « Cela m'a réjoui pour le peuple et m'a attristé pour vous — je crains seulement que vous ne craigniez pas » {cite: muruj-al-dhahab p. 173}."
  ur: "عمر کا وہ قرب جس نے آپ کی خلافت کو سلام پیش کیا اس نے مجھے لوگوں کے لیے خوش کیا اور آپ کے لیے مجھے غمگین کیا - مجھے صرف اس بات کا خوف ہے کہ تم نہ ڈرو۔ 173}۔"
  tr: "Ömer bin Abdülaziz'in özel halkı arasında, halef olarak atandığında, Ömer ona şöyle dedi: 'Ömer senin sırrın, atanmadın mı yoksa haksızlığa mı uğradın?' O dedi ki, 'Halktan memnunum ve senden memnunum.' Dedi ki, 'Korkarım kendimi kurtarmış olabilirim.' Dedi ki: 'Korkuyorsan durumun ne kadar iyi; senin için korkuyorum, korkma.' Dedi ki: 'Bana azarlat.' Dedi ki, 'Babamız Adem tek bir günah yüzünden cennetten kovulacak.' {atıf:Muruj-al-Dhahab, s. 173}."
  id: "Di antara orang-orang istimewa Umar ibn Abd al-Aziz, ketika ia diangkat sebagai penerus, Umar berkata kepadanya, 'Umar adalah rahasiamu, bukankah engkau diangkat atau telah disalahgunakan?' Ia berkata, 'Aku senang dengan rakyat dan aku senang denganmu.' Ia berkata, 'Aku takut aku telah menyelamatkan diriku sendiri.' Ia berkata: 'Betapa baiknya keadaanmu jika kau takut; aku takut padamu, jadi jangan takut.' Ia berkata: 'Tegurlah aku.' Ia berkata, 'Bapa kita Adam akan diusir dari Surga hanya karena satu dosa.' {cite:muruj-al-dhahab, hlm. 173}."
