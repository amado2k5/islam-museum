summary:
  ar: "قائد فتوح الجزيرة؛ عند البلاذري فتح الطيرهان والموصل وأنفذ لأهل تكريت كتاب الأمان الذي كتبه لهم التسير وحذيفة بن محصن."
  en: "Commander of the Jazira conquests; in al-Baladhuri he opened al-Tirhan and Mosul and enforced for Tikrit's people the safe-conduct document written them by al-Tusayr and Hudhayfa ibn Mihsan."
  es: "Comandante de las conquistas de Jazira; en al-Baladhuri abrió al-Tirhan y Mosul e hizo cumplir para la gente de Tikrit el salvoconducto que les habían redactado al-Tusayr y Hudhayfa ibn Mihsan."
  fr: "Commandant des conquêtes de la Jazira; à al-Baladhuri, il ouvrit al-Tirhan et Mossoul et fit appliquer pour les habitants de Tikrit le document de sauf-conduit rédigé par al-Tusayr et Hudhayfa ibn Mihsan."
