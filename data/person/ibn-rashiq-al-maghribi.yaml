summary:
  ar: "عبد الله بن رشيق المغربي، ناسخ من أهل دمشق، وصفه ابن كثير بأنه كاتب مصنفات ابن تيمية، وتاريخ وفاته 749 هـ الموافقة 1349 م."
  en: "Abdallah ibn Rashiq al-Maghribi, a copyist of Damascus whom Ibn Kathir describes as the copyist of Ibn Taymiyya's works; dated 749 AH (1349 CE)."
  es: "Abdallah ibn Rashiq al-Maghribi, copista de Damasco a quien Ibn Kathir describe como el copista de las obras de Ibn Taymiyya; fechado en 749 AH (1349 CE)."
  fr: "Abdallah ibn Rashiq al-Maghribi, copiste de Damas qu'Ibn Kathir décrit comme le copiste des œuvres d'Ibn Taymiyya; daté de 749 AH (1349 CE)."
  ur: "عبداللہ ابن رشق المغربی، دمشق کا ایک نقل نگار جسے ابن کثیر نے ابن تیمیہ کی تصانیف کا نقل کرنے والا قرار دیا ہے۔ مورخہ 749ھ ⁦(1349 عیسوی)⁩۔"
  tr: "Şam'dan bir kâtip olan Abdullah ibn Raşik al-Maghribi, İbn Teymiyye'nin eserlerinin yazarı olarak İbn Kathir tarafından tanımlanır ve ölüm tarihi 749 Hicri'dir, bu da 1349 M.S. yılına karşılık gelir."
  id: "Abdullah ibn Rashiq al-Maghribi, seorang juru tulis dari Damaskus, digambarkan oleh Ibn Kathir sebagai penulis karya-karya Ibn Taymiyyah, dan tanggal kematiannya adalah tahun 749 H, yang setara dengan tahun 1349 M."
