id: person/subuktakin
class: person
label: { ar: "سبكتكين حاجب عز الدولة" }
summary:
  ar: "حاجب عز الدولة بختيار بن معز الدولة، دعا المطيع لما أصابه الفالج وثقل لسانه إلى خلع نفسه وتسليم الأمر إلى ولده الطائع ففعل سنة ثلاث وستين {cite:tarikh-khulafa-minhaj-1434 p. 624}، وخلع عليه الطائع من الغد خلع السلطنة وعقد له اللواء ولقبه نصر الدولة ثم وقع بينه وبين عز الدولة فدعا الأتراك لنفسه فأجابوه وجرى بينهما حروب {cite:tarikh-khulafa-minhaj-1434 p. 626}."
  en: "Izz al-Dawla's chamberlain; when al-Muti' suffered paralysis and heavy speech in 363 he proposed the abdication to his son al-Ta'i' — and it was done {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  es: "El chambelán de Izz al-Dawla; cuando al-Muti' sufrió parálisis y dificultad para hablar en 363, propuso la abdicación a su hijo al-Ta'i', y así se hizo {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  fr: "Le chambellan d'Izz al-Dawla; lorsqu'al-Muti' souffrit de paralysie et de troubles de la parole en 363, il proposa l'abdication à son fils al-Ta'i' — et cela fut fait {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  ur: "عز الدولہ کے چیمبرلین؛ 363 میں جب الموطی کو فالج اور بھاری تقریر کا سامنا کرنا پڑا تو اس نے اپنے بیٹے الطائی کے سامنے دستبرداری کی تجویز پیش کی - اور ایسا کیا گیا۔ 624}۔"
  tr: "Hacı İzz-Devle Bakhtiyar ibn Mu'izz al-Dawla, felç geçirip dili ağırlaştığında el-Muti' olarak anıldı; bu yüzden tahttan çekildi ve işi oğlu el-Ta'i'ye devretti; bunu altmış üçüncü yılda yaptı {atıf:History-Khulafa-minhaj-1434, s. 624}. Ertesi gün, al-Ta'i onu tahttan indirdi, sultanlığı tahttan indirdi, sancağa atadı ve ona Nasr al-Dawla unvanını verdi. Sonra Izz al-Dawla ile arasında bir anlaşmazlık çıktı, bu yüzden Türkler onu kendisi için çağırdı, kabul ettiler ve aralarında savaşlar çıktı {cite:History-Khulafa-minhaj-1434, s. 626}."
  id: "Hajib Izz al-Dawla Bakhtiyar ibn Mu'izz al-Dawla dipanggil al-Muti', ketika ia mengalami stroke dan lidahnya menjadi berat, untuk turun tahta dan menyerahkan perkara itu kepada putranya al-Ta'i', yang ia lakukan pada tahun enam puluh tiga {cite:History-Khulafa-minhaj-1434, hlm. 624}. Keesokan harinya, al-Ta'i menggulingkannya, menggulingkan kesultanan, mengangkatnya sebagai panji, dan memberinya gelar Nasr al-Dawla. Kemudian terjadi konflik antara dirinya dan Izz al-Dawla, sehingga orang Turki memanggilnya atas nama sendiri, dan mereka setuju, dan perang pun terjadi di antara mereka {cite:History-Khulafa-minhaj-1434, hlm. 626}."
