summary:
  ar: "الزاهد أحد عباد الله الأخفياء الأتقياء؛ ولد بقرية بورين من عمل نابلس وسكن القدس عام أنقذه السلطان صلاح الدين من الفرنج سنة ثلاث وثمانين وخمسمائة، وساح بالشام ورأى الصالحين وكان مؤثراً للخمول صاحب أحوال؛ قال ابنه عبد الله انقطع تحت الصخرة في الأقباء السليمانية سبع سنين، وصحب الشيخ عبد الله الأرموي بقية عمره وعاشا جميعاً مصطحبين؛ توفي في غرة شعبان ودفن بسفح قاسيون {cite:shadharat-dhahab p. 155}."
  en: "Ghanim b. Asakir al-Maqdisi (562–632) — the hidden saint of Burin: settled at Jerusalem the year Salah al-Din freed it, spent seven years in seclusion in the vaults beneath the Rock, then companioned al-Irmawi to the end; buried beside him at Qasyun's foot {cite:shadharat-dhahab p. 155}."
  es: "Ghanim b. Asakir al-Maqdisi (562–632) — el santo oculto de Burin: se estableció en Jerusalén el año en que Salah al-Din la liberó, pasó siete años en reclusión en las bóvedas bajo la Roca, luego acompañó a al-Irmawi hasta el final; enterrado junto a él al pie de Qasyun {cite:shadharat-dhahab p. 155}."
  fr: "Ghanim b. Asakir al-Maqdisi (562–632) — le saint caché de Burin: s'installa à Jérusalem l'année où Salah al-Din la libéra, passa sept ans en réclusion dans les caveaux sous le Rocher, puis accompagna al-Irmawi jusqu'à la fin; enterré à ses côtés au pied de Qasyun {cite: shadharat-dhahab p. 155}."
  ur: "غنیم بی۔ عساکر المقدسی (562-632) - برن کا پوشیدہ ولی: یروشلم میں اس سال آباد ہوا جس سال صلاح الدین نے اسے آزاد کیا، سات سال چٹان کے نیچے والٹس میں تنہائی میں گزارے، پھر آخر تک ال ارماوی کے ساتھ رہے۔ قصیون کے قدموں میں ان کے پاس دفن کیا گیا 155}۔"
