summary:
  ar: "الزاهد أحد عباد الله الأخفياء الأتقياء؛ ولد بقرية بورين من عمل نابلس وسكن القدس عام أنقذه السلطان صلاح الدين من الفرنج سنة ثلاث وثمانين وخمسمائة، وساح بالشام ورأى الصالحين وكان مؤثراً للخمول صاحب أحوال؛ قال ابنه عبد الله انقطع تحت الصخرة في الأقباء السليمانية سبع سنين، وصحب الشيخ عبد الله الأرموي بقية عمره وعاشا جميعاً مصطحبين؛ توفي في غرة شعبان ودفن بسفح قاسيون {cite:shadharat-dhahab p. 155}."
  en: "Ghanim b. Asakir al-Maqdisi (562–632) — the hidden saint of Burin: settled at Jerusalem the year Salah al-Din freed it, spent seven years in seclusion in the vaults beneath the Rock, then companioned al-Irmawi to the end; buried beside him at Qasyun's foot {cite:shadharat-dhahab p. 155}."
