id: person/hudayr-al-kataib
class: person
label: { ar: "حضير الكتائب", en: "Hudayr al-Kata'ib", es: "Hudayr al-Kata'ib", fr: "Hudayr al-Kata'ib", ur: "حدیر الکتاب" }
summary:
  ar: "حضير الملقب بالكتائب، والد أسيد بن حضير ورئيس الأوس يوم بعاث؛ رثاه خفاف بن ندبة بقوله «فيا عين بكي حضير الندى، حضير الكتائب والمجلس»، وقيل ثبّت الأوس بعدما كانت الدبرة على الخزرج أولاً فرجعوا وانتصروا {cite:samhudi-wafa-al-wafa p. 229-230}."
  en: "Hudayr, called 'of the Squadrons', father of Usayd ibn Hudayr and the Aws commander on the day of Bu'ath; Khufaf ibn Nadba eulogised him as 'Hudayr of generosity, of squadrons and of council', and it is said he rallied the Aws after the first rout fell on the Khazraj, so they returned and prevailed {cite:samhudi-wafa-al-wafa p. 229-230}."
  es: "Hudayr, llamado 'de los escuadrones', padre de Usayd ibn Hudayr y comandante de los Aws el día de Bu'ath; Khufaf ibn Nadba lo elogió como 'Hudayr de la generosidad, de los escuadrones y del consejo', y se dice que reagrupó a los Aws después de la primera derrota sufrida por los Khazraj, por lo que regresaron y prevalecieron {cite:samhudi-wafa-al-wafa p. 229-230}."
  fr: "Hudayr, dit « des Escadrons », père d'Usayd ibn Hudayr et commandant des Aws le jour de Bu'ath; Khufaf ibn Nadba l'a loué comme « Hudayr de la générosité, des escadrons et du conseil », et il est dit qu'il a rallié les Aws après la première déroute subie par les Khazraj, de sorte qu'ils sont revenus et ont triomphé {cite:samhudi-wafa-al-wafa p. 229-230}."
  ur: "حدیر، جسے 'اسکواڈرن کا' کہا جاتا ہے، اسید بن حضیر کے والد اور بعثت کے دن اوس کمانڈر؛ خفاف بن ندبہ نے اسے سخاوت، دستہ اور کونسل کا حیدر کہا، اور کہا جاتا ہے کہ اس نے خزرج پر پہلی شکست کے بعد اوس پر حملہ کیا، چنانچہ وہ واپس آئے اور غالب آئے۔ 229-230}۔"
  tr: "Kata'ib lakablı Hudayr, Asid ibn Hudayr'ın babası ve Baas gününde Aws'un lideriydi; Khafaf ibn Nadbah ona şöyle övmüştür: 'Ey ağlayan Hudhair al-Nada'nın gözü, Taburların ve meclisin Yoldaşı.' Rivayete göre, Khazraj'a ilk cephe ulaştıktan sonra Aws'ın kararlı kaldığı ve geri dönüp zafer kazandıkları söylenir {cite:samhudi-wafa-al-wafa, s. 229-230}."
  id: "Hudayr, yang dijuluki Kata'ib, adalah ayah dari Asid ibn Hudayr dan pemimpin Aws pada hari Ba'ath; Khafaf ibn Nadbah memuji beliau dengan berkata: 'Wahai mata Hudhair al-Nada yang menangis, Sahabat Batalion dan dewan.' Dikatakan bahwa Aws tetap kokoh setelah garis depan pertama kali berada di Khazraj, sehingga mereka kembali dan menang {cite:samhudi-wafa-al-wafa, hlm. 229-230}."
