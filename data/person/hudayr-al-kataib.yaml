summary:
  ar: "حضير الملقب بالكتائب، والد أسيد بن حضير ورئيس الأوس يوم بعاث؛ رثاه خفاف بن ندبة بقوله «فيا عين بكي حضير الندى، حضير الكتائب والمجلس»، وقيل ثبّت الأوس بعدما كانت الدبرة على الخزرج أولاً فرجعوا وانتصروا {cite:samhudi-wafa-al-wafa p. 229-230}."
  en: "Hudayr, called 'of the Squadrons', father of Usayd ibn Hudayr and the Aws commander on the day of Bu'ath; Khufaf ibn Nadba eulogised him as 'Hudayr of generosity, of squadrons and of council', and it is said he rallied the Aws after the first rout fell on the Khazraj, so they returned and prevailed {cite:samhudi-wafa-al-wafa p. 229-230}."
