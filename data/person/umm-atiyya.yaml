summary:
  ar: صحابية أنصارية اسمها نسيبة، غزت مع النبي سبع غزوات تخلف الغزاة في رحالهم، وروت في الصحيحين أحاديث في غسل الميت وخروج النساء إلى العيدين وبيعة النساء ألا ينحن؛ وقدمت البصرة فنزلت قصر بني خلف.
  en: An Ansari Companion named Nusayba, who joined seven campaigns with the Prophet looking after the fighters' baggage, and narrated in the two collections on washing the dead, on women going out to the Eid prayers, and on the women's pledge
    not to wail; she came to Basra and stayed at the palace of Banu Khalaf.
  ur: "نصیبہ نامی انصاری صحابیہ جو نبی کے ساتھ سات مہمات میں لڑکیوں کے سامان کی دیکھ بھال کرتی رہی اور روایت کیا۔"
