summary:
  ar: صحابية أنصارية اسمها نسيبة، غزت مع النبي سبع غزوات تخلف الغزاة في رحالهم، وروت في الصحيحين أحاديث في غسل الميت وخروج النساء إلى العيدين وبيعة النساء ألا ينحن؛ وقدمت البصرة فنزلت قصر بني خلف.
  en: An Ansari Companion named Nusayba, who joined seven campaigns with the Prophet looking after the fighters' baggage, and narrated in the two collections on washing the dead, on women going out to the Eid prayers, and on the women's pledge
    not to wail; she came to Basra and stayed at the palace of Banu Khalaf.
  ur: "نصیبہ نامی انصاری صحابیہ جو نبی کے ساتھ سات مہمات میں لڑکیوں کے سامان کی دیکھ بھال کرتی رہی اور روایت کیا۔"
  es: "Una compañera de los Ansari llamada Nusayba, que participó en siete campañas con el Profeta cuidando el equipaje de los combatientes, narró en dos colecciones sobre el lavado de los muertos, sobre las mujeres que salían a las oraciones del Eid y sobre la promesa de las mujeres de no llorar; ella llegó a Basora y se hospedó en el palacio de Banu Khalaf."
  fr: "Une compagne Ansari nommée Nusayba, qui participa à sept campagnes avec le Prophète, s'occupant des bagages des combattants, et qui a narré dans les deux recueils sur le lavage des morts, sur les femmes se rendant aux prières de l'Aïd et sur le serment des femmes de ne pas pleurer; elle vint à Bassora et séjourna au palais des Banu Khalaf."
  tr: "Nusaybah adında bir Ansari kadın sahabe, Peygamber ile yedi sefer yaptı ve istilacıları geride bıraktı. İki Sahih'te ölülerin yıkanması, kadınların iki bayrama gitmesi ve kadınlara eğilmemeleri için bağlılık yemini etti; Basra'ya geldi ve Banu Halaf'ın sarayında yerleşti."
  id: "Seorang teman wanita Ansari bernama Nusaybah bertempur tujuh kali melawan Nabi, meninggalkan para penyerang. Ia menceritakan dalam dua hadits Sahih tentang mandi orang mati, wanita yang pergi ke dua Idul Fitri, dan bersumpah setia kepada wanita untuk tidak membungkuk; ia datang ke Basra dan menetap di istana Banu Khalaf."
