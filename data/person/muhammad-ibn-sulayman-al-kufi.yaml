summary:
  ar: صاحب الهادي إلى الحق وأمينه في وصف الكتاب، ومن روّاة «سيرة الهادي إلى الحق»، سبق الهادي إلى اليمن بنيف وخمسين يوماً وشغل ما يشبه منصب الوزير.
  en: Described in the book as al-Hadi ila al-Haqq's companion and trusted man, and one of the narrators of Sirat al-Hadi ila al-Haqq; he went to Yemen some fifty days before the imam and filled what resembled the office of vizier.
  ur: کتاب کے بیان کے مطابق ہادی الی الحق کے ساتھی اور امین، اور «سیرت الہادی الی الحق» کے راویوں میں سے؛ وہ امام سے پچاس سے کچھ زیادہ دن پہلے یمن گیا اور وزیر جیسے منصب پر رہا۔
