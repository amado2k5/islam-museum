summary:
  ar: "محمد الأمين الكانمي (1776–1837)، عالم كانمبو من مرزق، أنقذ إمبراطورية كانم–برنو من أن تسقط بيد جهاد الفولاني، وصار «شيخ» برنو وحاكمها الفعلي. دافع عن برنو بالسيف وبالرسائل، إذ ناظر عثمان بن فودي ثم محمد بيلو في مشروعية الجهاد ضد بلد مسلم قديم، وأسّس كوكاوا سنة 1814 عاصمةً له، وبقي في الحكم حتى وفاته سنة 1837."
  en: "Muhammad al-Amin al-Kanemi (1776–1837), a Kanembu scholar of Murzuk who saved the Kanem–Bornu Empire from the Fulani jihad and became Bornu's shehu and de facto ruler. He defended Bornu by arms and by letters, debating Usman dan Fodio and then Muhammad Bello on the lawfulness of a jihad against an old Muslim land, founded Kukawa as his seat in 1814, and remained in power until his death in 1837."
  ur: "محمد الامین الکانمی (1776–1837)، مرزُق کے کانمبو عالم جنھوں نے کانم بورنو سلطنت کو فولانی جہاد سے بچایا اور بورنو کے شیخ اور عملاً حکمران بن گئے۔ انھوں نے بورنو کا دفاع تلوار اور خطوط دونوں سے کیا، عثمان دان فودیو اور پھر محمد بیلو سے ایک قدیم مسلم ملک کے خلاف جہاد کے جواز پر مناظرہ کیا، 1814 میں کوکاوا کو اپنا مرکز بنایا، اور 1837 میں وفات تک اقتدار میں رہے۔"

