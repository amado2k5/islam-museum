summary:
  ar: "مهاجم مغربي وُلد في آسفي سنة 1990 ويلعب للتعاون السعودي. بدأ مع أولمبيك آسفي، واحترف في النرويج والصين وقطر قبل أن يصبح من أبرز هدافي الدوري السعودي مع النصر والاتحاد، وكان هداف العالم في سنة 2019، وفاز مع المغرب بكأس العرب 2025 ثم اعتزل دوليًا."
  en: "Moroccan striker born in Safi in 1990 who plays for Saudi club Al-Taawoun. He began with Olympic Safi, played in Norway, China and Qatar, then became one of the Saudi Pro League's leading scorers with Al-Nassr and Al-Ittihad; he was the world's leading goalscorer of 2019, won the 2025 FIFA Arab Cup with Morocco and then retired from international football."
  ur: "مراکشی اسٹرائیکر، 1990 میں آسفی میں پیدا ہوئے، سعودی کلب التعاون کے لیے کھیلتے ہیں۔ انہوں نے اولمپک آسفی سے آغاز کیا، ناروے، چین اور قطر میں کھیلے، پھر النصر اور الاتحاد کے ساتھ سعودی پرو لیگ کے نمایاں گول اسکورروں میں شامل ہوئے؛ وہ 2019 میں دنیا کے سب سے بڑے گول اسکورر تھے، مراکش کے ساتھ 2025 فیفا عرب کپ جیتا اور پھر بین الاقوامی فٹبال سے ریٹائر ہو گئے۔"
