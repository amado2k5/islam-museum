summary:
  ar: "مهاجم مغربي وُلد في آسفي سنة 1990 ويلعب للتعاون السعودي. بدأ مع أولمبيك آسفي، واحترف في النرويج والصين وقطر قبل أن يصبح من أبرز هدافي الدوري السعودي مع النصر والاتحاد، وكان هداف العالم في سنة 2019، وفاز مع المغرب بكأس العرب 2025 ثم اعتزل دوليًا."
  en: "Moroccan striker born in Safi in 1990 who plays for Saudi club Al-Taawoun. He began with Olympic Safi, played in Norway, China and Qatar, then became one of the Saudi Pro League's leading scorers with Al-Nassr and Al-Ittihad; he was the world's leading goalscorer of 2019, won the 2025 FIFA Arab Cup with Morocco and then retired from international football."
  fr: "Attaquant marocain né à Safi en 1990, qui joue pour le club saoudien d'Al-Taawoun. Il débuta à l'Olympic Safi, joua en Norvège, en Chine et au Qatar, puis devint l'un des meilleurs buteurs de la Saudi Pro League avec Al-Nassr et Al-Ittihad ; il fut le meilleur buteur mondial de 2019, remporta la Coupe arabe de la FIFA 2025 avec le Maroc puis prit sa retraite internationale."
  ur: "مراکشی اسٹرائیکر، 1990 میں آسفی میں پیدا ہوئے، سعودی کلب التعاون کے لیے کھیلتے ہیں۔ انہوں نے اولمپک آسفی سے آغاز کیا، ناروے، چین اور قطر میں کھیلے، پھر النصر اور الاتحاد کے ساتھ سعودی پرو لیگ کے نمایاں گول اسکورروں میں شامل ہوئے؛ وہ 2019 میں دنیا کے سب سے بڑے گول اسکورر تھے، مراکش کے ساتھ 2025 فیفا عرب کپ جیتا اور پھر بین الاقوامی فٹبال سے ریٹائر ہو گئے۔"
  es: "Delantero marroquí nacido en Safi en 1990 que juega en el club saudí Al-Taawoun. Comenzó su carrera en el Olympic Safi, jugó en Noruega, China y Qatar, y luego se convirtió en uno de los máximos goleadores de la Liga Profesional Saudí con el Al-Nassr y el Al-Ittihad; fue el máximo goleador mundial de 2019, ganó la Copa Árabe de la FIFA 2025 con Marruecos y luego se retiró del fútbol internacional."
  tr: "1990 yılında Safi'de doğan Faslı forvet, Suudi Arabistan'da Al-Taawoun'da forma giymektedir. Kariyerine Olympique Safi'de başlayan futbolcu, Norveç, Çin ve Katar'da profesyonel olarak oynadıktan sonra Al-Nassr ve Al-Ittihad ile Suudi Ligi'nin en golcü oyuncularından biri oldu. 2019'da dünya gol kralı oldu, 2025'te Fas ile Arap Kupası'nı kazandı ve ardından milli takımdan emekli oldu."
  id: "Seorang striker Maroko kelahiran Safi pada tahun 1990, ia bermain untuk Al-Taawoun di Arab Saudi. Ia memulai kariernya di Olympique Safi, dan bermain secara profesional di Norwegia, Tiongkok, dan Qatar sebelum menjadi salah satu pencetak gol terbanyak di Liga Saudi bersama Al-Nassr dan Al-Ittihad. Ia menjadi pencetak gol terbanyak dunia pada tahun 2019, memenangkan Piala Arab bersama Maroko pada tahun 2025, dan kemudian pensiun dari sepak bola internasional."
