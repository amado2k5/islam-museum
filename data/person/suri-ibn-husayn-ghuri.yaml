label:
  ar: شوري بن حسين الغوري
  en: Suri ibn al-Husayn al-Ghuri
summary:
  ar: "شوري بن حسين، ملك الغور؛ ملك بعد مقتل أخيه محمد بن حسين الذي مال إلى أرسلان في فتنته مع بهرام شاه فحبسه بهرام وقتله، وأجمع شوري الأخذ بثأر أخيه فسار إلى غزنة سنة 543هـ فانفض عنه عسكر غزنة إلى بهرام شاه فانهزم وأسره بهرام، ودخل غزنة في محرم سنة 544هـ وصلب شوري على باب غزنة، فقام أخوه علاء الدين الحسين بالثأر لهما."
  en: "Suri ibn al-Husayn, king of Ghor; succeeding his brother Muhammad — whom Bahramshah of Ghazna imprisoned and killed for siding with Arslan — he swore vengeance and marched on Ghazna in 543 AH, but the Ghaznavid host deserted back to Bahramshah, he was routed and captured, and in Muharram 544 was crucified at Ghazna's gate — the blood-feud their brother Ala al-Din al-Husayn then took up."
