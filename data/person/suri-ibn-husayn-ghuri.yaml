id: person/suri-ibn-husayn-ghuri
class: person
label:
  ar: شوري بن حسين الغوري
  en: Suri ibn al-Husayn al-Ghuri
  es: "Suri ibn al-Husayn al-Ghuri"
  fr: "Suri ibn al-Husayn al-Ghuri"
summary:
  ar: "شوري بن حسين، ملك الغور؛ ملك بعد مقتل أخيه محمد بن حسين الذي مال إلى أرسلان في فتنته مع بهرام شاه فحبسه بهرام وقتله، وأجمع شوري الأخذ بثأر أخيه فسار إلى غزنة سنة 543هـ فانفض عنه عسكر غزنة إلى بهرام شاه فانهزم وأسره بهرام، ودخل غزنة في محرم سنة 544هـ وصلب شوري على باب غزنة، فقام أخوه علاء الدين الحسين بالثأر لهما."
  en: "Suri ibn al-Husayn, king of Ghor; succeeding his brother Muhammad — whom Bahramshah of Ghazna imprisoned and killed for siding with Arslan — he swore vengeance and marched on Ghazna in 543 AH, but the Ghaznavid host deserted back to Bahramshah, he was routed and captured, and in Muharram 544 was crucified at Ghazna's gate — the blood-feud their brother Ala al-Din al-Husayn then took up."
  es: "Suri ibn al-Husayn, rey de Ghor, sucedió a su hermano Muhammad —a quien Bahramshah de Ghazna encarceló y mató por aliarse con Arslan—, juró venganza y marchó sobre Ghazna en el año 543 de la Hégira, pero el ejército gaznávida desertó y regresó con Bahramshah, fue derrotado y capturado, y en Muharram del año 544 fue crucificado en la puerta de Ghazna; la venganza de sangre la continuó entonces su hermano Ala al-Din al-Husayn."
  fr: "Suri ibn al-Husayn, roi de Ghor, succédant à son frère Muhammad — que Bahramshah de Ghazna avait emprisonné et tué pour avoir pris le parti d'Arslan — jura vengeance et marcha sur Ghazna en 543 AH, mais l'armée ghaznévide déserta et retourna à Bahramshah, il fut mis en déroute et capturé, et en Muharram 544, il fut crucifié à la porte de Ghazna — la vendetta que leur frère Ala al-Din al-Husayn reprit ensuite."
