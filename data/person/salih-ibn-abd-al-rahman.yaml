label: { ar: "صالح بن عبد الرحمن", en: "Salih ibn Abd al-Rahman" }
summary:
  ar: "صالح بن عبد الرحمن مولى بني تميم وكان أبوه من سبي سجستان؛ عند البلاذري كان يخط بين يدي زادان فروخ بن بيري كاتب الحجاج بالعربية والفارسية فوصله زادان فروخ بالحجاج فخف على قلبه ونقل ديوان خراج السواد وسائر العراق إلى العربية. عُيّن على العراق، وكان من أشد أعداء الحجاج، فعزل محمد بن القاسم عن السند وحبسه بواسط انتقاماً لأخ له قتله الحجاج. {cite:salabi-umayyad-state-2020 p.106} ويذكر الكتاب أن سليمان عهد إليه بخراج العراق، ولم يولّ يزيد بن المهلب الخراج، لأنه رأى أهل المعرفة بأمر الخراج في صالح. {cite:salabi-umayyad-state-2020 p.146}"
  en: "Salih ibn Abd al-Rahman, mawla of Banu Tamim — his father among Sijistan's captives; in al-Baladhuri he wrote Arabic and Persian before al-Hajjaj's scribe Zadhanfarrukh, was presented to al-Hajjaj who took to him, and transferred the Sawad and Iraq kharaj diwan into Arabic."
