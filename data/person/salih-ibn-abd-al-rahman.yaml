id: person/salih-ibn-abd-al-rahman
class: person
label: { ar: "صالح بن عبد الرحمن", en: "Salih ibn Abd al-Rahman", es: "Salih ibn Abd al-Rahman", fr: "Salih ibn Abd al-Rahman", ur: "صالح بن عبدالرحمٰن" }
summary:
  ar: "صالح بن عبد الرحمن مولى بني تميم وكان أبوه من سبي سجستان؛ عند البلاذري كان يخط بين يدي زادان فروخ بن بيري كاتب الحجاج بالعربية والفارسية فوصله زادان فروخ بالحجاج فخف على قلبه ونقل ديوان خراج السواد وسائر العراق إلى العربية. عُيّن على العراق، وكان من أشد أعداء الحجاج، فعزل محمد بن القاسم عن السند وحبسه بواسط انتقاماً لأخ له قتله الحجاج. {cite:salabi-umayyad-state-2020 p.106} ويذكر الكتاب أن سليمان عهد إليه بخراج العراق، ولم يولّ يزيد بن المهلب الخراج، لأنه رأى أهل المعرفة بأمر الخراج في صالح. {cite:salabi-umayyad-state-2020 p.146}"
  en: "Salih ibn Abd al-Rahman, mawla of Banu Tamim — his father among Sijistan's captives; in al-Baladhuri he wrote Arabic and Persian before al-Hajjaj's scribe Zadhanfarrukh, was presented to al-Hajjaj who took to him, and transferred the Sawad and Iraq kharaj diwan into Arabic."
  es: "Salih ibn Abd al-Rahman, mawla de Banu Tamim —su padre entre los cautivos de Sijistan—, escribió en árabe y persa en al-Baladhuri ante el escriba de al-Hajjaj, Zadhanfarrukh, fue presentado a al-Hajjaj, quien lo aceptó y transcribió el Sawad y el Iraq kharaj diwan al árabe."
  fr: "Salih ibn Abd al-Rahman, mawla de Banu Tamim — son père parmi les captifs du Sijistan; à al-Baladhuri, il écrivit en arabe et en persan devant le scribe d'al-Hajjaj, Zadhanfarrukh, fut présenté à al-Hajjaj qui le prit sous son aile et transféra le Sawad et l'Iraq kharaj diwan en arabe."
  ur: "صالح بن عبدالرحمٰن، بنو تمیم کے مولا - سجستان کے اسیروں میں سے ان کے والد؛ البلادوری میں اس نے الحجاج کے کاتب زادنفرخ سے پہلے عربی اور فارسی لکھی، اسے الحجاج کے سامنے پیش کیا گیا جو اس کے پاس گیا، اور سواد اور عراق کے خرج دیوان کو عربی میں منتقل کیا۔"
  tr: "Salih ibn Abd al-Rahman, babası Sijastan'dan esiri olan Banu Tamim'in özgür bırakılmış bir adamıydı; el-Baladhuri'ye göre, Arapça ve Farsça yazıyordu; el-Hacac'ın kâtili Zadan Farukh bin Biri'nin önünde Arapça ve Farsça yazıyordu. Zadan Farukh onu el-Haccac ile ilişkilendirdi ve bu da onu kurtardı. Kharaj al-Sawad'ın Diwanını ve Irak'ın geri kalanını Arapçaya aktardı. Onu Irak'a atadı ve el-Hacac'ın en amansız düşmanlarından biriydi. Muhammed bin el-Kasim, vekal zincirinden çıkarıldı ve el-Hacac'ın öldürdüğü kardeşinin intikamı olarak Wasit'te hapsedildi. {alıntı:salabi-umayyad-state-2020 s.106} Kitapta Süleyman'a Irak vergisi emanet edildiği belirtilir, ancak Yazid bin al-Muhallab Salih'i vergi konusunda bilgili gördüğü için ona vergiyi vermemiştir. {cite:Salabi-umayyad-state-2020 s.146}"
  id: "Salih ibn Abd al-Rahman adalah mantan Banu Tamim, yang ayahnya adalah tawanan dari Sijistan; menurut al-Baladhuri, ia menulis dalam bahasa Arab dan Persia sebelum Zadan Farukh ibn Biri, juru tulis al-Hajjaj. Zadan Farukh menghubungkannya dengan al-Hajjaj, yang membebaskannya. Ia memindahkan Diwan Kharaj al-Sawad dan seluruh Irak ke dalam bahasa Arab. Ia menunjuknya sebagai pemimpin Irak dan menjadi salah satu musuh terberat al-Hajjaj. Muhammad ibn al-Qasim diberhentikan dari rantai transmisi dan dipenjara di Wasit sebagai balas dendam atas saudaranya yang telah dibunuh al-Hajjaj. {cite:salabi-umayyad-state-2020 hlm.106} Buku tersebut menyebutkan bahwa Sulayman dipercayakan untuk membayar pajak Irak, tetapi Yazid ibn al-Muhallab tidak memberinya pajak karena ia melihat Salih memiliki pengetahuan tentang pajak tersebut. {sitasi: salabi-umayyad-state-2020 hlm.146}"
