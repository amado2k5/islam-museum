summary:
  ar: "مساور المغربي، مستوطن الفيافي الأبي. روى عنه كُرز بن عنبسة أنه وقف على راهب لم يكلم أحدًا منذ أربعين سنة، فلما ألحّ عليه تكلم وقال: إنما الأمر يوم واحد: أمس قد فات، واليوم لي، وغدًا لا أدري أدركه أم لا."
  en: "Musawwir al-Maghribi, a dweller in the wastes, who would not yield. Kurz ibn Anbasa relates that Musawwir ibn Labib al-Maghribi stood before a monk who had not spoken to anyone for forty years; when he pressed him, the monk spoke briefly: the matter is one day; yesterday has passed, today is mine, and tomorrow I do not know whether I shall reach it."
  ur: "مساور مغربی بیابانوں میں رہنے والے اور باوقار تھے۔ کرز بن عنبسہ نے نقل کیا کہ مساور بن لبیب مغربی ایک ایسے راہب کے پاس کھڑے ہوئے جس نے چالیس سال سے کسی سے بات نہ کی تھی؛ جب انہوں نے اصرار کیا تو راہب نے مختصر کلام کیا: معاملہ ایک دن کا ہے؛ کل گزر چکا، آج میرا ہے، اور کل کا مجھے علم نہیں کہ اسے پاؤں گا یا نہیں۔"
