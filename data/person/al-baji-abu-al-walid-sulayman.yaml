summary:
  ar: "محدث وفقيه وأديب وشاعر ومتكلم وأصولي من أهل باجة في الأندلس، مالكي المذهب. وقدم بغداد فأقام بها ثلاثة أعوام يدرس الفقه ويقرأ الحديث ولقي بها أبا الطيب الطبري وأبا إسحاق الشيرازي والصيمري وابن عمروس، وأقام بالموصل سنة مع أبي جعفر السمناني يأخذ عنه علم الكلام، وتداج مع الحافظ أبي بكر الخطيب بحيث روى كل واحد منهما عن الآخر، ورجع إلى الأندلس بعد ثلاث عشرة سنة بعلم جم حصّله مع الفقر والتعفف {cite:nafh-tib-maqqari p. 73}."
  en: "A hadith scholar, jurist, man of letters, poet, theologian and legal theorist from Beja in al-Andalus, a Maliki."
