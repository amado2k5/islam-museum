label:
  ar: رضوان قائد قمص برشلونة بغرناطة
  en: Ridwan, Commander of the Catalan Company at Granada
summary:
  ar: "رضوان، مولى سلطان الأندلس أبي الحجاج وقائد جنده من القمص النصارى؛ احتجب بدولته بعد مهلك مولاه واستبد على السلطان محمد بن يوسف، وصاهر ذمياً يهودياً فنكر له ذلك السلطان، وأظلم الجو بينه وبين دولته حتى تقلب أمر غرناطة فخلع ابن الأحمر وقتل رضوان وصلب شلوه بسور البلد عند باب المحروق."
  en: "Ridwan, mawla of Granada's sultan Abu al-Hajjaj and commander of his Christian Catalan troops; he held the reins after his master's death and dominated Sultan Muhammad ibn Yusuf, allying with the Castilian tyrant Pedro against his own — until Granada's affair turned, Ibn al-Ahmar was deposed, and Ridwan was killed, his torso crucified on the city wall by the Bab al-Mahruq gate as an example."
