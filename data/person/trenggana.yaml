summary:
  ar: "ثالث سلاطين دماك ⁦(حكم 1521–1546)⁩، ابن مؤسسها رادين فاتح وأعظم حكام أول مملكة إسلامية في جاوة. توّجه سونن غونونغجاتي من الأولياء التسعة، فأمر بحملات 1527 التي انتزعت بنتن وسوندا كيلابا ⁦(أُعيدت تسميتها جاياكارتا)⁩ من مملكة سوندا وجعلت بنتن سلطنة تابعة لدماك، ثم بسط سلطان دماك شرقًا على بقايا ماجاباهيت وموانئ شرق جاوة، حتى قُتل في حملة على باناروكان عام 1546."
  en: "Third sultan of Demak (r. 1521–1546), son of its founder Raden Patah and the greatest ruler of Java's first Islamic kingdom. Crowned by Sunan Gunungjati of the Wali Songo, he ordered the 1527 expeditions that took Banten and Sunda Kelapa (renamed Jayakarta) from the Sunda kingdom and made Banten a vassal sultanate of Demak, then carried Demak's power east over the remains of Majapahit and the ports of East Java, until he was killed campaigning at Panarukan in 1546."
  ur: "دماک کے تیسرے سلطان ⁦(دورِ حکومت 1521ء–1546ء)⁩، اس کے بانی رادین پاتاہ کے بیٹے اور جاوا کی پہلی اسلامی سلطنت کے عظیم ترین حکمران۔ ولی سونگو کے سونن گوننگ جاتی نے ان کی تاج پوشی کی؛ انھوں نے 1527ء کی مہمات کا حکم دیا جنھوں نے بنتن اور سونڈا کیلاپا ⁦(نیا نام جایاکارتا)⁩ مملکت سونڈا سے چھینے اور بنتن کو دماک کی باج گزار سلطنت بنایا، پھر دماک کی طاقت مشرق میں ماجاپاہت کے باقی ماندہ علاقوں اور مشرقی جاوا کی بندرگاہوں تک پھیلائی، یہاں تک کہ وہ 1546ء میں پاناروکان کی مہم میں قتل ہوئے۔"
  es: "Tercer sultán de Demak (r. 1521–1546), hijo de su fundador Raden Patah y el gobernante más importante del primer reino islámico de Java. Coronado por Sunan Gunungjati del Wali Songo, ordenó las expediciones de 1527 que arrebataron Banten y Sunda Kelapa (renombrada Jayakarta) al reino de Sunda e hicieron de Banten un sultanato vasallo de Demak. Posteriormente, extendió el poder de Demak hacia el este, sobre los restos de Majapahit y los puertos de Java Oriental, hasta que murió en campaña en Panarukan en 1546."
  fr: "Troisième sultan de Demak (r. 1521-1546), fils de son fondateur Raden Patah et plus grand souverain du premier royaume islamique de Java. Couronné par Sunan Gunungjati du Wali Songo, il ordonna les expéditions de 1527 qui prirent Banten et Sunda Kelapa (rebaptisée Jayakarta) au royaume de Sunda et firent de Banten un sultanat vassal de Demak. Il étendit ensuite la puissance de Demak vers l'est, au-delà des vestiges de Majapahit et des ports de Java oriental, jusqu'à sa mort lors d'une campagne à Panarukan en 1546."
  tr: "Damac'ın üçüncü Sultanı (1521–1546 yılları arasında hüküm sürdü), kurucusu Fatih Radin'in oğlu ve Java'daki ilk İslam krallığının en büyük hükümdarıydı. Sunen Gunungjati, dokuz azizden biriydi ve 1527 seferlerini Sunda krallığından Benten ile Sunda Kelapa'nın (Jayakarta olarak yeniden adlandırıldı) ele geçirmesiyle Benten'i Damac'ın vasalı yaptı, ardından Damac sultanlığını doğuya, Majapahit'in kalıntıları ve doğu Java limanları üzerinde genişletti; ta ki 1546'da Banarukan'a yapılan bir seferde öldürülene kadar."
  id: "Sultan ketiga Damac (memerintah 1521–1546), putra pendirinya Radin Sang Penakluk dan penguasa terbesar kerajaan Islam pertama di Jawa. Sunen Gunungjati adalah salah satu dari sembilan wali dan memerintahkan kampanye tahun 1527 yang merebut Benten dan Sunda Kelapa (berganti nama menjadi Jayakarta) dari kerajaan Sunda dan menjadikan Benten sebagai vasal Damac, kemudian memperluas kesultanan Damac ke timur melewati sisa-sisa Majapahit dan pelabuhan di Jawa timur, hingga ia tewas dalam kampanye melawan Banarukan pada tahun 1546."

