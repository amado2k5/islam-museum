summary:
  ar: "ثالث سلاطين دماك (حكم 1521–1546)، ابن مؤسسها رادين فاتح وأعظم حكام أول مملكة إسلامية في جاوة. توّجه سونن غونونغجاتي من الأولياء التسعة، فأمر بحملات 1527 التي انتزعت بنتن وسوندا كيلابا (أُعيدت تسميتها جاياكارتا) من مملكة سوندا وجعلت بنتن سلطنة تابعة لدماك، ثم بسط سلطان دماك شرقًا على بقايا ماجاباهيت وموانئ شرق جاوة، حتى قُتل في حملة على باناروكان عام 1546."
  en: "Third sultan of Demak (r. 1521–1546), son of its founder Raden Patah and the greatest ruler of Java's first Islamic kingdom. Crowned by Sunan Gunungjati of the Wali Songo, he ordered the 1527 expeditions that took Banten and Sunda Kelapa (renamed Jayakarta) from the Sunda kingdom and made Banten a vassal sultanate of Demak, then carried Demak's power east over the remains of Majapahit and the ports of East Java, until he was killed campaigning at Panarukan in 1546."
  ur: "دماک کے تیسرے سلطان (دورِ حکومت 1521ء–1546ء)، اس کے بانی رادین پاتاہ کے بیٹے اور جاوا کی پہلی اسلامی سلطنت کے عظیم ترین حکمران۔ ولی سونگو کے سونن گوننگ جاتی نے ان کی تاج پوشی کی؛ انھوں نے 1527ء کی مہمات کا حکم دیا جنھوں نے بنتن اور سونڈا کیلاپا (نیا نام جایاکارتا) مملکت سونڈا سے چھینے اور بنتن کو دماک کی باج گزار سلطنت بنایا، پھر دماک کی طاقت مشرق میں ماجاپاہت کے باقی ماندہ علاقوں اور مشرقی جاوا کی بندرگاہوں تک پھیلائی، یہاں تک کہ وہ 1546ء میں پاناروکان کی مہم میں قتل ہوئے۔"

