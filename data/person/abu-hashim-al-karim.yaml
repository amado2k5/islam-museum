summary:
  ar: "أبو هاشم الكريم، للمال قاسم، وللبخل قاصم، وللغيظ كاظم. قال: عباد ينفقون على قدر بضائعهم، وعباد ينفقون على حسن الظن بالله، فأولئك أولئك، ونظرنا في هذا الأمر فإذا الذين بلغوا منه الغايات هم المنفردون."
  en: "Abu Hashim al-Karim, a giver who divides wealth, breaks stinginess and restrains anger; he said that some worshippers spend according to what they have, and others spend in good opinion of God, and those are the ones; looking into the matter, he found that those who reached its ends were the solitary ones."
  ur: "ابو ہاشم کریم مال تقسیم کرنے والے، بخل توڑنے والے اور غصہ پینے والے تھے۔ انہوں نے کہا: کچھ عبادت گزار اپنے مال کی مقدار کے مطابق خرچ کرتے ہیں، اور کچھ اللہ کے بارے میں حسنِ ظن کے ساتھ خرچ کرتے ہیں، اور وہی لوگ ہیں۔ اس معاملے کو دیکھ کر ہم نے پایا کہ جو لوگ اس کی انتہا تک پہنچے وہ تنہا رہنے والے ہیں۔"
