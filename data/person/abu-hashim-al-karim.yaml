summary:
  ar: "أبو هاشم الكريم، للمال قاسم، وللبخل قاصم، وللغيظ كاظم. قال: عباد ينفقون على قدر بضائعهم، وعباد ينفقون على حسن الظن بالله، فأولئك أولئك، ونظرنا في هذا الأمر فإذا الذين بلغوا منه الغايات هم المنفردون."
  en: "Abu Hashim al-Karim, a giver who divides wealth, breaks stinginess and restrains anger; he said that some worshippers spend according to what they have, and others spend in good opinion of God, and those are the ones; looking into the matter, he found that those who reached its ends were the solitary ones."
  ur: "ابو ہاشم کریم مال تقسیم کرنے والے، بخل توڑنے والے اور غصہ پینے والے تھے۔ انہوں نے کہا: کچھ عبادت گزار اپنے مال کی مقدار کے مطابق خرچ کرتے ہیں، اور کچھ اللہ کے بارے میں حسنِ ظن کے ساتھ خرچ کرتے ہیں، اور وہی لوگ ہیں۔ اس معاملے کو دیکھ کر ہم نے پایا کہ جو لوگ اس کی انتہا تک پہنچے وہ تنہا رہنے والے ہیں۔"
  fr: "Abu Hashim al-Karim, homme généreux qui partage ses biens, brise l'avarice et retient sa colère ; il disait que certains adorateurs dépensent selon ce qu'ils possèdent, et d'autres dépensent par bonne opinion de Dieu, et que ce sont ceux-là ; examinant la question, il trouva que ceux qui en atteignaient le terme étaient les solitaires."
  es: "Abu Hashim al-Karim, un benefactor que reparte la riqueza, combate la tacañería y refrena la ira, dijo que algunos fieles gastan según lo que tienen, y otros gastan según la buena voluntad de Dios, y esos son los elegidos; al examinar el asunto, descubrió que los que llegaban a su fin eran los solitarios."
  tr: "Ebu Haşim el-Karim şöyle demiştir: “Bazıları imkanlarına göre harcar, bazıları ise Allah'a olan sevgilerine göre harcar. İşte bu konuda gerçek üstünlük gösterenler bunlardır.” Bu konuyu inceledik ve en yüksek mertebeye ulaşanların gerçekten istisnai kişiler olduğunu gördük."
  id: "Abu Hashim al-Karim berkata: “Ada orang-orang yang berinfak sesuai kemampuan mereka, dan ada pula orang-orang yang berinfak berdasarkan keyakinan mereka yang baik kepada Allah. Mereka inilah yang benar-benar unggul dalam hal ini.” Kami meneliti masalah ini dan menemukan bahwa mereka yang mencapai tingkatan tertinggi adalah orang-orang yang benar-benar luar biasa."
