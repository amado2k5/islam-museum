label: { ar: "قبيحة أم المعتز" }
summary:
  ar: "أم ولد رومية أم المعتز، أبت على ابنها مالاً ينفقه في الأتراك وشخت نفسها فخلعوه، ثم اختفت وظهرت في رمضان فأعطت صالح بن وصيف مالاً عظيماً ألف ألف دينار وثلاث مئة ألف دينار وأسفاط زمرد ولؤلؤ وياقوت قومت بألفي ألف دينار فقال قبحها الله عرضت ابنها للقتل لأجل خمسين ألفاً فأخذ الجميع ونفاها إلى مكة حتى تولى المعتمد فردها وماتت سنة أربع وستين {cite:tarikh-khulafa-minhaj-1434 p. 557-559}. وعند المسعودي وجهت إلى المتوكل ليلة مقتله بخلعة فيها دراعة حمراء ومطرف خز فخرق المطرف وقال لخادمها احتفظي به ليكون كفناً لي عند وفاتي {cite:muruj-al-dhahab p. 506}"
  en: "Al-Mu'tazz's Byzantine umm-walad; she refused him money to buy the Turks and 'barked her soul', so they deposed him. Hiding then surfacing in Ramadan, she gave Salih ibn Wasif 1.3 million dinars and baskets of emeralds, pearls and rubies valued at two million — 'she exposed her son to death over fifty thousand, holding this?' He took it all and exiled her to Mecca until al-Mu'tamid's reign; she died 264 {cite:tarikh-khulafa-minhaj-1434 p. 557-559}."
  es: "La umm-walad bizantina de Al-Mu'tazz; ella le negó dinero para comprar a los turcos y \"ladró su alma\", por lo que lo depusieron. Ocultándose y reapareciendo en Ramadán, le dio a Salih ibn Wasif 1,3 millones de dinares y cestas de esmeraldas, perlas y rubíes valoradas en dos millones: \"¿expuso a su hijo a la muerte por más de cincuenta mil, teniendo esto?\". Él lo tomó todo y la exilió a La Meca hasta el reinado de Al-Mu'tamid; murió en 264 {cite:tarikh-khulafa-minhaj-1434 p. 557-559}."
  fr: "L'épouse byzantine d'Al-Mu'tazz refusa de lui donner de l'argent pour acheter les Turcs et, furieuse, le déposa. Cachée, elle réapparut pendant le Ramadan et donna à Salih ibn Wasif 1,3 million de dinars ainsi que des paniers d'émeraudes, de perles et de rubis d'une valeur de deux millions. « Elle a exposé son fils à la mort pour cinquante mille dinars, en tenant de tels biens ? » s'exclama-t-elle. Il prit tout et l'exila à La Mecque jusqu'au règne d'al-Mu'tamid; elle mourut en 264 av. J.-C. (Voir: Tarikh-Khulafa-Minhaj-1434, p. 557-559)."
  ur: "المعتز کی بازنطینی ام ولاد؛ اس نے اسے ترکوں کو خریدنے کے لیے رقم دینے سے انکار کر دیا اور 'اس کی روح کو بھونکا'، تو انہوں نے اسے معزول کر دیا۔ رمضان میں چھپ کر اس نے صالح بن واصف کو 1.3 ملین دینار اور زمرد، موتیوں اور یاقوت کی ٹوکریاں دیں جن کی قیمت 20 لاکھ تھی - 'اس نے اپنے بیٹے کو پچاس ہزار سے زیادہ موت کے گھاٹ اتار دیا، یہ پکڑ کر کیا؟' اس نے یہ سب کچھ لے لیا اور المتمید کے دور تک اسے مکہ جلاوطن کر دیا۔ وفات 264 {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 557-559}۔"
  tr: "Müvət Rumiye, el-Mu'tazz'ın annesi, oğluna Türklere harcaması için para vermeyi reddetti, bu yüzden Türkler onu tahttan indirdi. Sonra ortadan kayboldu ve Ramazan'da ortaya çıktı. Salih ibn Waseef'e bin üç yüz bin dinar ve zümrüt, inci ve yakut yağı verdi. İki bin dinar topladı. Dedi ki, 'Allah onu rezil etsin. Oğlunu elli bin için ölüme sundu.' Hepsini aldı ve onu Mekke'ye sürgün etti, ta ki al-Mu'tamid devralana kadar ve geri getirdi. Altmış dört yaşında öldü {alıntı:] Tarih-Khulafa-minhaj-1434, s. 557-559}. El-Mes'udi'de, ölüm gecesi, al-Mutawakkil'e içinde kırmızı bir atkı ve bir mızrak usturası içeren bir pelerin gönderildi. Pelerini kırdı ve hizmetkarına, 'Ölümümde kefenim olacak şekilde sakla.' dedi. {alıntı:Muruj-al-dhahab, s. 506}"
  id: "um Walad Rumiya, ibu al-Mu'tazz, menolak memberikan uang kepada putranya untuk dibelanjakan pada Turki, sehingga mereka menggulingkannya. Kemudian dia menghilang dan muncul pada Ramadan. Dia memberikan Salih ibn Waseef sejumlah besar seribu tiga ratus ribu dinar, dan setebal zamrud, mutiara, dan rubi. Dia mengumpulkan dua ribu dinar. Dia berkata, 'Semoga Allah mempermalukannya. Dia mempersembahkan putranya mati dengan bayaran lima puluh ribu.' Dia membawa mereka semua dan mengasingkannya ke Mekah sampai al-Mu'tamid mengambil alih dan mengembalikannya. Dia meninggal pada tahun enam puluh empat {cite:Sejarah-Khulafa-minhaj-1434, hlm. 557-559}. Di Al-Mas'udi, pada malam kematiannya, al-Mutawakkil dikirim jubah berisi syal merah dan pisau cukur tombak. Ia memecahkan jubah itu dan berkata kepada pelayannya, 'Simpan agar menjadi kain kafan saya saat saya meninggal.' {cite:Muruj-al-dhahab, hlm. 506}"
