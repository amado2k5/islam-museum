label: { ar: "قبيحة أم المعتز" }
summary:
  ar: "أم ولد رومية أم المعتز، أبت على ابنها مالاً ينفقه في الأتراك وشخت نفسها فخلعوه، ثم اختفت وظهرت في رمضان فأعطت صالح بن وصيف مالاً عظيماً ألف ألف دينار وثلاث مئة ألف دينار وأسفاط زمرد ولؤلؤ وياقوت قومت بألفي ألف دينار فقال قبحها الله عرضت ابنها للقتل لأجل خمسين ألفاً فأخذ الجميع ونفاها إلى مكة حتى تولى المعتمد فردها وماتت سنة أربع وستين {cite:tarikh-khulafa-minhaj-1434 p. 557-559}. وعند المسعودي وجهت إلى المتوكل ليلة مقتله بخلعة فيها دراعة حمراء ومطرف خز فخرق المطرف وقال لخادمها احتفظي به ليكون كفناً لي عند وفاتي {cite:muruj-al-dhahab p. 506}"
  en: "Al-Mu'tazz's Byzantine umm-walad; she refused him money to buy the Turks and 'barked her soul', so they deposed him. Hiding then surfacing in Ramadan, she gave Salih ibn Wasif 1.3 million dinars and baskets of emeralds, pearls and rubies valued at two million — 'she exposed her son to death over fifty thousand, holding this?' He took it all and exiled her to Mecca until al-Mu'tamid's reign; she died 264 {cite:tarikh-khulafa-minhaj-1434 p. 557-559}."
