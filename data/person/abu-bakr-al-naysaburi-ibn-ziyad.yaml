summary:
  ar: "أبو بكر عبد الله بن محمد بن زياد بن واصل بن ميمون النيسابوري، مولى أبان بن عثمان بن عفان، وسكن بغداد. ولد سنة ثمان وثلاثين ومائتين ومات سنة أربع وعشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}. كان زاهداً لم يَنَم الليل أربعين سنة، يصلي الغداة على طهارة العشاء، وجمع بين الفقه والحديث، وله زيادات على كتاب المزني {cite:tabaqat-fuqaha-abbas-1981 p. 59}. قال الدارقطني: «ما رأيت أحفظ منه» {cite:tabaqat-fuqaha-abbas-1981 p. 59}، وروى الشيرازي خبر مجلس ببغداد سأل فيه رجل عن لفظ «وتربتها» في حديث الأرض مسجداً، فلم يجد الحاضرون جواباً حتى سُئل أبو بكر فساق الحديث من حفظه {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Bakr Abd Allah ibn Muhammad ibn Ziyad ibn Wasil ibn Maymun al-Naysaburi, a client (mawla) of Aban ibn Uthman ibn Affan, who settled in Baghdad. He was born in 238 and died in 324 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. He was an ascetic who did not sleep at night for forty years, and who performed the dawn prayer with the ablution he had made for the night prayer; he combined fiqh and hadith, and he wrote additions to al-Muzani's book {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Daraqutni said: 'I have not seen anyone with a better memory than him' {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Shirazi relates an account of a session in Baghdad at which a man asked about the word 'wa-turbatuha' in the hadith about the earth being made a mosque; none of those present had an answer until Abu Bakr was asked, and he recited the hadith from memory {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
