summary:
  ar: "أبو بكر عبد الله بن محمد بن زياد بن واصل بن ميمون النيسابوري، مولى أبان بن عثمان بن عفان، وسكن بغداد. ولد سنة ثمان وثلاثين ومائتين ومات سنة أربع وعشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}. كان زاهداً لم يَنَم الليل أربعين سنة، يصلي الغداة على طهارة العشاء، وجمع بين الفقه والحديث، وله زيادات على كتاب المزني {cite:tabaqat-fuqaha-abbas-1981 p. 59}. قال الدارقطني: «ما رأيت أحفظ منه» {cite:tabaqat-fuqaha-abbas-1981 p. 59}، وروى الشيرازي خبر مجلس ببغداد سأل فيه رجل عن لفظ «وتربتها» في حديث الأرض مسجداً، فلم يجد الحاضرون جواباً حتى سُئل أبو بكر فساق الحديث من حفظه {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
