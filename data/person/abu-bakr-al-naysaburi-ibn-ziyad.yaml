summary:
  ar: "أبو بكر عبد الله بن محمد بن زياد بن واصل بن ميمون النيسابوري، مولى أبان بن عثمان بن عفان، وسكن بغداد. ولد سنة ثمان وثلاثين ومائتين ومات سنة أربع وعشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}. كان زاهداً لم يَنَم الليل أربعين سنة، يصلي الغداة على طهارة العشاء، وجمع بين الفقه والحديث، وله زيادات على كتاب المزني {cite:tabaqat-fuqaha-abbas-1981 p. 59}. قال الدارقطني: «ما رأيت أحفظ منه» {cite:tabaqat-fuqaha-abbas-1981 p. 59}، وروى الشيرازي خبر مجلس ببغداد سأل فيه رجل عن لفظ «وتربتها» في حديث الأرض مسجداً، فلم يجد الحاضرون جواباً حتى سُئل أبو بكر فساق الحديث من حفظه {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Bakr Abd Allah ibn Muhammad ibn Ziyad ibn Wasil ibn Maymun al-Naysaburi, a client (mawla) of Aban ibn Uthman ibn Affan, who settled in Baghdad. He was born in 238 and died in 324 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. He was an ascetic who did not sleep at night for forty years, and who performed the dawn prayer with the ablution he had made for the night prayer; he combined fiqh and hadith, and he wrote additions to al-Muzani's book {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Daraqutni said: 'I have not seen anyone with a better memory than him' {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Shirazi relates an account of a session in Baghdad at which a man asked about the word 'wa-turbatuha' in the hadith about the earth being made a mosque; none of those present had an answer until Abu Bakr was asked, and he recited the hadith from memory {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  fr: "Abu Bakr Abd Allah ibn Muhammad ibn Ziyad ibn Wasil ibn Maymun al-Naysaburi, client (mawla) d'Aban ibn Uthman ibn Affan, qui s'établit à Bagdad. Il naquit en 238 et mourut en 324 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. C'était un ascète qui ne dormit pas la nuit pendant quarante ans, et qui accomplissait la prière de l'aube avec l'ablution faite pour la prière de la nuit ; il réunissait le fiqh et le hadith, et écrivit des additions au livre d'al-Muzani {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Daraqutni dit : « je n'ai vu personne doté d'une meilleure mémoire que lui » {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi rapporte le récit d'une séance à Bagdad où un homme demanda le sens du mot « wa-turbatuha » dans le hadith sur la terre faite mosquée ; aucun des présents n'eut de réponse jusqu'à ce qu'on interroge Abu Bakr, qui récita le hadith de mémoire {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  es: "Abu Bakr Abd Allah ibn Muhammad ibn Ziyad ibn Wasil ibn Maymun al-Naysaburi, un cliente (mawla) de Aban ibn Uthman ibn Affan, que se estableció en Bagdad. Nació en 238 y murió en 324 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Fue un asceta que no durmió por la noche durante cuarenta años y que realizó la oración del amanecer con la ablución que había hecho para la oración de la noche; combinó fiqh y hadith, y escribió adiciones al libro de al-Muzani {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Daraqutni dijo: «No he visto a nadie con mejor memoria que él» {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi relata una sesión en Bagdad en la que un hombre preguntó sobre la palabra 'wa-turbatuha' en el hadiz acerca de la tierra convertida en mezquita; ninguno de los presentes tuvo una respuesta hasta que se le preguntó a Abu Bakr, y él recitó el hadiz de memoria {cite:tabaqat-fuqaha-abbas-1981 p. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  ur: "ابوبکر عبد اللہ بن محمد بن زیاد بن واصل ابن میمون النیسابوری، ابان بن عثمان بن عفان کے مولا ⁦(مولا)⁩، جو بغداد میں آباد ہوئے۔ وہ 238 میں پیدا ہوئے اور 324 میں وفات پائی۔ 59}۔ وہ ایک سنیاسی تھا جو چالیس سال تک رات کو نہیں سوتا تھا اور جس نے فجر کی نماز اس وضو سے ادا کی تھی جو اس نے رات کی نماز کے لیے کی تھی۔ اس نے فقہ اور حدیث کو یکجا کیا، اور اس نے المزانی کی کتاب میں اضافہ لکھا۔ 59}۔ الدارقطنی نے کہا: ''میں نے ان سے بہتر حافظہ والا کوئی نہیں دیکھا''۔ 59}۔ الشیرازی نے بغداد میں ایک اجلاس کا واقعہ بیان کیا ہے جس میں ایک شخص نے حدیث میں لفظ 'و تربتہ' کے بارے میں پوچھا کہ زمین کو مسجد بنانے کے بارے میں۔ حاضرین میں سے کسی کے پاس جواب نہ تھا یہاں تک کہ ابوبکر سے پوچھا گیا اور انہوں نے یادداشت سے حدیث سنائی۔ 59}-{حوالہ دیں:طبقات فقہ عباس-1981 صفحہ۔ 60}۔"
  tr: "Ebu Bekir Abdullah ibn Muhammed ibn Ziyad ibn Wasil ibn Maymun el-Naysaburi, Aban ibn Osman ibn Affan'ın azatlı kölesi olup Bağdat'ta yaşamıştır. Hicri 238 yılında doğmuş ve 324 yılında vefat etmiştir. Kırk yıl boyunca geceleri uyumayan, sabah namazını da akşam namazındaki aynı temizlikle kılan bir zahitti. Fıkıh ve hadis ilmini birleştirmiş ve el-Muzani'nin kitabına katkıda bulunmuştur. El-Daraqutni, \"Ondan daha iyi bir hafızaya sahip birini hiç görmedim\" demiştir. El-Şirazi, Bağdat'ta bir toplantıda bir adamın, yeryüzünün mescit olduğuna dair hadiste geçen \"ve toprağı\" ifadesi hakkında soru sorduğu bir olayı anlatmıştır. Orada bulunanlar bir cevap bulamayınca Ebu Bekir'e sorulmuş ve o da hadisi ezberden okumuştur. 59}–{cite:tabaqat-fuqaha-abbas-1981 s. 60}."
  id: "Abu Bakr Abdullah ibn Muhammad ibn Ziyad ibn Wasil ibn Maymun al-Naysaburi, seorang budak yang dibebaskan oleh Aban ibn Uthman ibn Affan, tinggal di Baghdad. Ia lahir pada tahun 238 H dan wafat pada tahun 324 H. Ia adalah seorang pertapa yang tidak tidur di malam hari selama empat puluh tahun, melaksanakan salat subuh dengan kesucian yang sama seperti yang ia capai dalam salat maghrib. Ia menggabungkan pengetahuan tentang fiqih dan hadits, dan ia menambahkan sesuatu pada kitab al-Muzani. Al-Daraqutni berkata, \"Aku belum pernah melihat siapa pun yang memiliki daya ingat lebih baik darinya.\" Al-Shirazi meriwayatkan sebuah kejadian dalam sebuah pertemuan di Baghdad di mana seorang pria bertanya tentang redaksi \"dan tanahnya\" dalam hadits tentang bumi sebagai masjid. Orang-orang yang hadir tidak dapat menemukan jawaban sampai Abu Bakr ditanya, dan ia membacakan hadits tersebut dari hafalannya. 59}–{cite:tabaqat-fuqaha-abbas-1981 p. 60}."
