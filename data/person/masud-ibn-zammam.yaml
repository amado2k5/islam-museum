label: { ar: "مسعود بن زمام البلاط", en: "Mas'ud ibn Zammam al-Balat", es: "Mas'ud ibn Zammam al-Balat", fr: "Mas'ud ibn Zammam al-Balat", ur: "مسعود ابن زمام البلات" }
summary:
  ar: "مسعود بن زمام المعروف بمسعود البلاط، من أعيان أمراء جبال نفوسة وكان خارجاً عن طاعة عبد المؤمن؛ اجتمع بقراقوش مملوك تقي الدين عمر سنة ثمان وستين وخمسمائة فاتفقا وكثر جمعهما ونزلا على طرابلس الغرب ففتحت {cite:kamil-ibn-al-athir p. 47}."
  en: "Mas'ud ibn Zammam 'al-Balat', a leading amir of the Nafusa mountains in revolt against the Almohad Abd al-Mu'min — joined Qaraqush's Turkish corps in 568 and took Tripoli with him {cite:kamil-ibn-al-athir p. 47}."
  es: "Mas'ud ibn Zammam 'al-Balat', un destacado emir de las montañas Nafusa que se rebeló contra el almohad Abd al-Mu'min, se unió al cuerpo turco de Qaraqush en 568 y tomó Trípoli consigo {cite:kamil-ibn-al-athir p. 47}."
  fr: "Mas'ud ibn Zammam 'al-Balat', un émir important des montagnes de Nafusa en révolte contre l'Almohade Abd al-Mu'min — a rejoint le corps turc de Qaraqush en 568 et a pris Tripoli avec lui {cite:kamil-ibn-al-athir p. 47}."
  ur: "مسعود بن زمام 'البلات'، الموحد عبد المومن کے خلاف بغاوت میں نفوسہ پہاڑوں کا ایک سرکردہ امیر - 568 میں قراقش کی ترک فوج میں شامل ہوا اور طرابلس کو اپنے ساتھ لے گیا۔ 47}۔"
  tr: "Mas'ud ibn Zamam, Mas'ud al-Balat olarak bilinir, Nafusa dağ prenslerinin önemli isimlerinden biriydi ve Abd al-Mu'min'in komutası dışındaydı; 568 Hicri yılında Karaqosh Memlük Taqi al-Din Umar ile görüştü, birçoğunu bir araya getirdi ve batıdaki Trablus'a yerleşti; burada {cite:kamil-ibn-al-athir, s. 47} fethedildi."
  id: "Mas'ud ibn Zamam, yang dikenal sebagai Mas'ud al-Balat, adalah salah satu tokoh penting para pangeran gunung Nafusa dan berada di luar komando Abd al-Mu'min; ia bertemu dengan Qaraqosh Mamluk Taqi al-Din Umar pada tahun 568 H, setuju dan mengumpulkan banyak dari mereka, lalu menetap di Tripoli di barat, di mana {cite:kamil-ibn-al-athir, hlm. 47} ditaklukkan."
