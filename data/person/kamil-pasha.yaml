summary:
  ar: "رجل دولة عثماني من أصل قبرصي تركي، تولى الصدارة العظمى أربع مرات بين 1885 و1913، وهو من أطول صُدور عبد الحميد الثاني خدمة، ثم صار منافسًا ليبراليًّا لجمعية الاتحاد والترقي. عُرف بـ«كامل الإنجليزي» لميله إلى بريطانيا، وانتهت وزارته الأخيرة حين أجبره ضباط اتحاديون على الاستقالة تحت تهديد السلاح في اقتحام الباب العالي في 23 يناير 1913."
  en: "Ottoman statesman of Turkish Cypriot origin who served four times as Grand Vizier between 1885 and 1913, among the longest-serving grand viziers of Abdul Hamid II and later a liberal rival of the Committee of Union and Progress. Known as 'English Kâmil' for his Anglophilia, his last ministry ended when Unionist officers forced his resignation at gunpoint in the raid on the Sublime Porte of 23 January 1913."
  ur: "ترک قبرصی نژاد عثمانی مدبر جنھوں نے 1885 اور 1913 کے درمیان چار مرتبہ صدارتِ عظمیٰ سنبھالی؛ عبدالحمید ثانی کے طویل خدمت کرنے والے صدورِ اعظم میں سے اور بعد ازاں جمعیتِ اتحاد و ترقی کے آزاد خیال حریف۔ برطانیہ سے لگاؤ کی وجہ سے «انگریز کامل» کہلائے؛ ان کی آخری وزارت 23 جنوری 1913 کو بابِ عالی پر دھاوے میں اتحادی افسروں کے بندوق کی نوک پر استعفے پر مجبور کرنے پر ختم ہوئی۔"
