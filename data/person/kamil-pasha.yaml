summary:
  ar: "رجل دولة عثماني من أصل قبرصي تركي، تولى الصدارة العظمى أربع مرات بين 1885 و1913، وهو من أطول صُدور عبد الحميد الثاني خدمة، ثم صار منافسًا ليبراليًّا لجمعية الاتحاد والترقي. عُرف بـ«كامل الإنجليزي» لميله إلى بريطانيا، وانتهت وزارته الأخيرة حين أجبره ضباط اتحاديون على الاستقالة تحت تهديد السلاح في اقتحام الباب العالي في 23 يناير 1913."
  en: "Ottoman statesman of Turkish Cypriot origin who served four times as Grand Vizier between 1885 and 1913, among the longest-serving grand viziers of Abdul Hamid II and later a liberal rival of the Committee of Union and Progress. Known as 'English Kâmil' for his Anglophilia, his last ministry ended when Unionist officers forced his resignation at gunpoint in the raid on the Sublime Porte of 23 January 1913."
  ur: "ترک قبرصی نژاد عثمانی مدبر جنھوں نے 1885 اور 1913 کے درمیان چار مرتبہ صدارتِ عظمیٰ سنبھالی؛ عبدالحمید ثانی کے طویل خدمت کرنے والے صدورِ اعظم میں سے اور بعد ازاں جمعیتِ اتحاد و ترقی کے آزاد خیال حریف۔ برطانیہ سے لگاؤ کی وجہ سے «انگریز کامل» کہلائے؛ ان کی آخری وزارت 23 جنوری 1913 کو بابِ عالی پر دھاوے میں اتحادی افسروں کے بندوق کی نوک پر استعفے پر مجبور کرنے پر ختم ہوئی۔"
  es: "Estadista otomano de origen turcochipriota que ocupó el cargo de Gran Visir en cuatro ocasiones entre 1885 y 1913. Fue uno de los grandes visires que más tiempo permaneció en el cargo durante el reinado de Abdul Hamid II y, posteriormente, un rival liberal del Comité de Unión y Progreso. Conocido como «Kâmil el Inglés» por su anglofilia, su último ministerio terminó cuando oficiales unionistas lo obligaron a renunciar a punta de pistola durante el asalto a la Sublime Puerta el 23 de enero de 1913."
  fr: "Homme d'État ottoman d'origine chypriote turque, il occupa quatre fois la fonction de grand vizir entre 1885 et 1913, figurant parmi les grands vizirs ayant exercé le plus long mandat sous Abdul Hamid II. Plus tard, il fut un rival libéral du Comité Union et Progrès. Surnommé « Kâmil l'Anglais » en raison de son anglophilie, son dernier ministère prit fin lorsque des officiers unionistes le forcèrent à démissionner sous la menace des armes lors du raid sur la Sublime Porte le 23 janvier 1913."
  tr: "Türk kökenli Osmanlı devlet adamı olan Kıbrıslı Sher, 1885 ile 1913 yılları arasında dört kez en yüksek makamı üstlendi ve Abdul Hamid'in en uzun süre görev yapan bakanlarından biri oldu, ardından Birlik ve İlerleme Derneği'nin liberal rakibi haline geldi. Britanya'ya olan eğilimi nedeniyle 'İngiliz' olarak biliniyordu ve son bakanlığı, 23 Ocak 1913'te Yüce Porte'nin basılması sırasında federal yetkililerin onu silah zoruyla istifa etmeye zorlamasıyla sona erdi."
  id: "Sebagai negarawan Ottoman keturunan Siprus Turki, ia memegang posisi tertinggi sebanyak empat kali antara tahun 1885 dan 1913, dan merupakan salah satu menteri Abdul Hamid II yang paling lama menjabat, kemudian menjadi rival liberal dari Union and Progress Association. Ia dikenal sebagai 'orang Inggris' karena kecenderungannya ke Inggris, dan masa jabatannya yang terakhir berakhir ketika pejabat federal memaksanya mengundurkan diri dengan todongan senjata saat penyerbuan Sublime Porte pada 23 Januari 1913."
