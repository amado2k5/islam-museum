summary:
  ar: "والي الجزائر العثماني؛ عاد بنفسه إلى الجزائر حين بلغه انتشار الفوضى بين الجنود فانتصب عليها للمرة الثانية في ربيع الثاني ٩٩١هـ/أبريل ١٥٨٣م ولم يعارض الباب العالي. لم يترك قيادة الأسطول لغيره وكثرت في أيامه المغانم من السواحل الأسبانية؛ وفي ٩٩٢هـ/١٥٨٤م أبحر بأسطوله على ثغر بلنسية فحمل أعداداً كبيرة من مسلمي الأندلس منقذاً إياهم من اضطهاد الأسبان، وفي السنة التالية أنقذ جميع سكان كالوسا وحملهم إلى الجزائر. بقي على رأس حكومة الجزائر حتى استدعاه السلطان إلى إستانبول ليتولى منصب إمارة البحر ⁦(قبودان دريا)⁩ بعد وفاة قلج علي سنة ٩٩٥هـ/١٥٨٧م {cite:dawlat-uthmaniyya-salabi p. 272}."
  en: "Ottoman governor of Algiers; he returned on his own initiative when word reached him of chaos among the soldiery, seated himself over Algiers a second time in Rabi' II 991/April 1583, and the Porte did not object. He kept the fleet's command to himself and booty multiplied off the Spanish coasts; in 992/1584 he sailed on Valencia and carried off large numbers of al-Andalus's Muslims, saving them from Spanish persecution, and the next year saved all of Calosa's people, ferrying them to Algiers. He stayed at the head of Algiers' government until the sultan called him to Istanbul as kapudan (commander of the sea) after Uluj Ali's death in 995/1587 {cite:dawlat-uthmaniyya-salabi p. 272}."
  es: "Gobernador otomano de Argel; regresó por iniciativa propia al enterarse del caos reinante entre la tropa, y volvió a gobernar Argel en Rabi' II de 991/abril de 1583, sin que la Sublime Puerta presentara objeciones. Mantuvo el mando de la flota y el botín se multiplicó frente a las costas españolas; en 992/1584 navegó sobre Valencia y rescató a un gran número de musulmanes de al-Ándalus, salvándolos de la persecución española, y al año siguiente salvó a toda la población de Calosa, transportándolos a Argel. Permaneció al frente del gobierno de Argel hasta que el sultán lo llamó a Estambul como kapudan (comandante del mar) tras la muerte de Uluj Ali en 995/1587 {cite:dawlat-uthmaniyya-salabi p. 272}."
  fr: "Gouverneur ottoman d'Alger, il revint de sa propre initiative lorsqu'il apprit le chaos qui régnait parmi les soldats. Il s'installa à la tête d'Alger une seconde fois en Rabi' II 991/avril 1583, sans que la Sublime Porte ne s'y oppose. Il conserva le commandement de la flotte et le butin se multiplia au large des côtes espagnoles. En 992/1584, il fit voile vers Valence et emmena avec lui un grand nombre de musulmans d'al-Andalus, les sauvant ainsi des persécutions espagnoles. L'année suivante, il sauva tout le peuple de Calosa et le conduisit à Alger. Il resta à la tête du gouvernement d'Alger jusqu'à ce que le sultan le nomme kapudan (commandant de la mer) à Istanbul après la mort d'Uluj Ali en 995/1587 (voir: Dawlat-Uthmaniyya-Salabi, p. 272)."
  ur: "الجزائر کے عثمانی گورنر؛ جب سپاہی کے درمیان افراتفری کی بات اس کے پاس پہنچی تو وہ اپنی ہی پہل پر واپس آیا، ربیع دوم 991/اپریل 1583 میں دوسری بار الجزائر پر بیٹھ گیا، اور پورٹے نے کوئی اعتراض نہیں کیا۔ اس نے بحری بیڑے کی کمان اپنے پاس رکھی اور مال غنیمت ہسپانوی ساحلوں سے کئی گنا بڑھ گیا۔ 992/1584 میں اس نے والنسیا پر سفر کیا اور الاندلس کے مسلمانوں کی بڑی تعداد کو لے کر انہیں ہسپانوی ظلم و ستم سے بچا لیا، اور اگلے سال کالوسا کے تمام لوگوں کو بچایا، انہیں الجزائر لے جایا گیا۔ وہ اس وقت تک الجزائر کی حکومت کے سربراہ رہے جب تک کہ سلطان نے 995/1587 میں الوج علی کی موت کے بعد اسے کپودان ⁦(سمندر کا کمانڈر)⁩ کے طور پر استنبول بلایا۔ 272}۔"
