summary:
  ar: "أحمد الأول، السلطان العثماني الرابع عشر، ابن محمد الثالث، ولد في مَنيسا سنة 998هـ/1590م، وتولى سنة 1012هـ/1603م، وباني جامع السلطان أحمد في الميدان بإسطنبول، وتوفي سنة 1026هـ/1617م بعد مرض دام شهرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahmed I, the fourteenth Ottoman sultan and son of Mehmed III, born at Manisa in 998/1590 and succeeded in 1012/1603. He built the Sultan Ahmed mosque at the Atmeydani in Istanbul, and died in 1026/1617 after a two-month illness {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  fr: "Ahmed Ier, quatorzième sultan ottoman et fils de Mehmed III, naquit à Manisa en 998 H/1590 ap. J.-C. et accéda au trône en 1012 H/1603 ap. J.-C. Il bâtit la mosquée du sultan Ahmed à l'Atmeydani d'Istanbul et mourut en 1026 H/1617 ap. J.-C. après deux mois de maladie {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  es: "Ahmed I, el decimocuarto sultán otomano e hijo de Mehmed III, nació en Manisa en 998/1590 y sucedió a su padre en 1012/1603. Construyó la mezquita del sultán Ahmed en Atmeydani, Estambul, y murió en 1026/1617 tras una enfermedad de dos meses {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
