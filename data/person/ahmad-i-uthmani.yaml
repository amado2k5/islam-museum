  ar: "أحمد الأول، السلطان العثماني الرابع عشر، ابن محمد الثالث، ولد في مَنيسا سنة 998هـ/1590م، وتولى سنة 1012هـ/1603م، وباني جامع السلطان أحمد في الميدان بإسطنبول، وتوفي سنة 1026هـ/1617م بعد مرض دام شهرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahmed I, the fourteenth Ottoman sultan and son of Mehmed III, born at Manisa in 998/1590 and succeeded in 1012/1603. He built the Sultan Ahmed mosque at the Atmeydani in Istanbul, and died in 1026/1617 after a two-month illness {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
