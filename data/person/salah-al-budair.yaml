  ar: "إمام وقاضٍ سعودي (وُلد 1970 بالهفوف)، إمام وخطيب المسجد النبوي منذ 1998 وإمام ضيف بالمسجد الحرام في 2005–2006، وقاضي محكمة المدينة العليا، حاصل على الدكتوراه في الفقه من جامعة الملك فيصل (2023)."
