summary:
  ar: "عينه حسن بن خير الدين سنة ٩٦٥هـ/١٥٥٨م قائداً على باديس فخرب الساحل الأسباني من قرطاجنة إلى رأس سانت فنست ولُقب بحق سيد مضيق جبل طارق؛ كانت له أربع سفن حربية في مياه المضيق وسفينتان في باديس وثالثة قيد الصنع حسب تقرير أسباني بقلم فرانسوا دي ايبانيير. فلم تستطع السفن العبور دون إذنه وعم الخوف سكان الساحل، حتى عزله حسن أواخر ٩٧١هـ/١٥٦٣م {cite:dawlat-uthmaniyya-salabi p. 247-251}."
  en: "Appointed by Hasan b. Khayr al-Din in 965/1558 as commander of Badis; he ravaged the Spanish coast from Cartagena to Cape St Vincent and was rightly called lord of the Strait of Gibraltar — four warships in the strait's waters, two at Badis and one building, per the Spanish report of Francois de Ibanier. No ship could pass without his leave and fear spread along the coast, until Hasan deposed him in late 971/1563 {cite:dawlat-uthmaniyya-salabi p. 247-251}."
