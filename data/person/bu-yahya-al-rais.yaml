summary:
  ar: "عينه حسن بن خير الدين سنة ٩٦٥هـ/١٥٥٨م قائداً على باديس فخرب الساحل الأسباني من قرطاجنة إلى رأس سانت فنست ولُقب بحق سيد مضيق جبل طارق؛ كانت له أربع سفن حربية في مياه المضيق وسفينتان في باديس وثالثة قيد الصنع حسب تقرير أسباني بقلم فرانسوا دي ايبانيير. فلم تستطع السفن العبور دون إذنه وعم الخوف سكان الساحل، حتى عزله حسن أواخر ٩٧١هـ/١٥٦٣م {cite:dawlat-uthmaniyya-salabi p. 247-251}."
  en: "Appointed by Hasan b. Khayr al-Din in 965/1558 as commander of Badis; he ravaged the Spanish coast from Cartagena to Cape St Vincent and was rightly called lord of the Strait of Gibraltar — four warships in the strait's waters, two at Badis and one building, per the Spanish report of Francois de Ibanier. No ship could pass without his leave and fear spread along the coast, until Hasan deposed him in late 971/1563 {cite:dawlat-uthmaniyya-salabi p. 247-251}."
  es: "Nombrado comandante de Badis por Hasan b. Khayr al-Din en 965/1558, asoló la costa española desde Cartagena hasta el cabo de San Vicente y, con razón, fue llamado señor del estrecho de Gibraltar: cuatro buques de guerra navegaban por sus aguas, dos en Badis y uno en construcción, según el informe español de François de Ibanier. Ningún barco podía pasar sin su permiso y el temor se extendió por la costa, hasta que Hasan lo depuso a finales de 971/1563 {cite:dawlat-uthmaniyya-salabi p. 247-251}."
  fr: "Nommé commandant de Badis par Hassan ibn Khayr al-Din en 965/1558, il ravagea les côtes espagnoles de Carthagène au cap Saint-Vincent et fut à juste titre surnommé le seigneur du détroit de Gibraltar. Selon le rapport espagnol de François de Ibanier, quatre navires de guerre naviguaient dans les eaux du détroit, dont deux à Badis et un en construction. Aucun navire ne pouvait passer sans son autorisation et la peur se répandit le long de la côte, jusqu'à ce qu'Hasan le dépose fin 971/1563 (voir: Dawlat-Uthmaniyya-Salabi, p. 247-251)."
