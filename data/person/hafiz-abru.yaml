summary:
  ar: "كاتب كتب ذيلاً لجامع التواريخ عن أولجايتو وأبي سعيد ومن خلفهما من الإيلخانيين، يُلحق في آخر المخطوطة {cite:jami-al-tawarikh-khashshab-1960 p. 6}. وقد نشر بياني هذا الذيل في إيران سنة 1937 مع ترجمة فرنسية وتعليقات {cite:jami-al-tawarikh-khashshab-1960 p. 10}."
  en: "A writer who composed an appendix to the Jami' al-Tawarikh on Oljeitu, Abu Sa'id and their Ilkhanid successors, which is attached at the end of the manuscript {cite:jami-al-tawarikh-khashshab-1960 p. 6}. The introduction says that Bayani published this appendix in Iran in 1937 with a French translation and notes {cite:jami-al-tawarikh-khashshab-1960 p. 10}. The appendix is named again in the introduction's account of the Ilkhanid history {cite:jami-al-tawarikh-khashshab-1960 p. 21}."
  es: "Escritor que compuso un apéndice a Jami' al-Tawarikh sobre Oljeitu, Abu Sa'id y sus sucesores ilcánidas, que va al final del manuscrito {cite:jami-al-tawarikh-khashshab-1960 p. 6}. La introducción dice que Bayani publicó este apéndice en Irán en 1937 con traducción francesa y notas {cite:jami-al-tawarikh-khashshab-1960 p. 10}."
  fr: "Auteur d'un appendice au Jami' al-Tawarikh sur Oljeitu, Abu Sa'id et leurs successeurs ilkhanides, placé à la fin du manuscrit {cite:jami-al-tawarikh-khashshab-1960 p. 6}. L'introduction indique que Bayani publia cet appendice en Iran en 1937, avec une traduction française et des notes {cite:jami-al-tawarikh-khashshab-1960 p. 10}."
  ur: "ایک مصنف جنہوں نے جامع التواریخ کے ساتھ اولجایتو، ابوسعید اور ان کے ایلخانی جانشینوں کے بارے میں ایک ذیل لکھا، جو مخطوطے کے آخر میں ہے {cite:jami-al-tawarikh-khashshab-1960 p. 6}۔ مقدمے کے مطابق بیانی نے 1937ء میں ایران میں یہ ذیل فرانسیسی ترجمے اور حواشی کے ساتھ شائع کیا {cite:jami-al-tawarikh-khashshab-1960 p. 10}۔"
  tr: "Jami'al-Tawarikh'e Oljeitu ve Abu Sa'id ile onların İlhanlılardan halefleri hakkında bir ek yazdı; bu ek, el yazmasının sonunda eklenmiştir {cite:jami-al-tawarikh-khashshab-1960 s. 6}. Bu ekin iki eki 1937'de İran'da Fransızca çeviri ve açıklamalarla yayımlanmıştır {cite:jami-al-tawarikh-khashshab-1960 s. 10}."
  id: "Ia menulis lampiran Jami' al-Tawarikh tentang Oljeitu dan Abu Sa'id serta penerus mereka dari Ilkhanid, yang dilampirkan di akhir manuskrip {cite:jami-al-tawarikh-khashshab-1960 hlm. 6}. Dua lampiran suplemen ini diterbitkan di Iran pada tahun 1937 dengan terjemahan Prancis dan anotasi {cite:jami-al-tawarikh-khashshab-1960 hlm. 10}."
