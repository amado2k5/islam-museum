summary:
  ar: "حمد الله الأماسي (1436–1520)، المعروف بالشيخ حمد الله وابن الشيخ، مؤسس مدرسة الخط العثماني و«قبلة الكتّاب»؛ وُلد في أماسيا لأسرة هاجرت من بخارى، وتعلّم الأقلام الستة لدى خير الدين المرعشي، وعلّم الشاهزاده بايزيد ⁦(الثاني لاحقًا)⁩ الخط في أماسيا، ثم صار خطاط البلاط في إسطنبول من 1481، وكتب نحو سبعة وأربعين مصحفًا، وصارت طريقته في النسخ معيار كتابة المصاحف في العالم الإسلامي."
  en: "Hamdullah al-Amasi (1436–1520), known as Shaykh Hamdullah and Ibn al-Shaykh, was the founder of the Ottoman school of calligraphy and the 'Qibla of the Scribes'. Born at Amasya to a family from Bukhara, he mastered the six scripts under Hayreddin Mar'ashi, taught Prince Bayezid (the future Bayezid II) calligraphy at Amasya, and became court calligrapher at Istanbul from 1481. He wrote some forty-seven copies of the Qur'an, and his naskh became the standard hand for Qur'an manuscripts across the Islamic world."
  ur: "حمد اللہ اماسی ⁦(1436ء–1520ء)⁩، جو شیخ حمد اللہ اور ابن الشیخ کے نام سے مشہور ہیں، عثمانی خطاطی کے مکتب کے بانی اور «قبلۂ کُتّاب» تھے؛ اماسیہ میں بخارا سے آئے ہوئے خاندان میں پیدا ہوئے، خیر الدین مرعشی سے چھ قلم سیکھے، اماسیہ میں شہزادہ بایزید ⁦(بعد میں بایزید ثانی)⁩ کو خطاطی سکھائی، اور 1481ء سے استنبول میں دربار کے خطاط بنے۔ انھوں نے تقریباً سینتالیس مصاحف لکھے اور ان کا نسخ اسلامی دنیا میں قرآن لکھنے کا معیار بن گیا۔"
