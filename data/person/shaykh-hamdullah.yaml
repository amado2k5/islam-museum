    note: "No text read attests an order or school for Hamdullah himself. His father Mustafa Dede was a sheikh of the Suhrawardiyya (Sühreverdiyye) order who migrated from Bukhara to Amasya — attested for the father by the Sakıp Sabancı Museum and by the Azerbaijani, Polish and Japanese article texts — and the Polish article adds that this Sufi lineage (silsila) is what entitled Hamdullah to the title şeyh. A father's order and an inherited title are family background, which never settles the son; the texts attest Hamdullah's own piety (his withdrawal after 1512 to prayer and his students, per the Museum) but not his own initiation or affiliation. The Encyclopaedia of Islam 3 and TDV İslâm Ansiklopedisi entries cited by the Arabic article were not read in full for this build. The value therefore stays unknown, with the Suhrawardi family reading preserved here."
