summary:
  ar: "رجل أعمال هندي وفاعل خير، وُلد في بومباي سنة 1945 لأسرة مسلمة، وتولى سنة 1966 وهو في الحادية والعشرين شركة الزيوت النباتية التي أسسها والده فحوّلها إلى شركة «ويبرو» العالمية لخدمات تقنية المعلومات، وأسس سنة 2001 مؤسسة عظيم بريمجي التعليمية ونقل إليها قسما كبيرا من ثروته، فتصدّر قوائم فاعلي الخير في الهند."
  en: "Indian businessman and philanthropist, born in Bombay in 1945 into a Muslim family. In 1966, aged 21, he took over his father's vegetable-oil company and transformed it into Wipro, the global information-technology services company; in 2001 he founded the education-focused Azim Premji Foundation and transferred a large share of his wealth to it, topping India's philanthropy lists."
  ur: "ہندوستانی کاروباری اور فلاحی شخصیت، جو 1945 میں بمبئی میں ایک مسلم خاندان میں پیدا ہوئے۔ 1966 میں اکیس برس کی عمر میں انہوں نے اپنے والد کی نباتی تیل کی کمپنی سنبھالی اور اسے عالمی آئی ٹی خدمات کی کمپنی «وِپرو» میں بدل دیا؛ 2001 میں تعلیم پر مرکوز عظیم پریمجی فاؤنڈیشن قائم کی اور اپنی دولت کا بڑا حصہ اسے منتقل کیا، اور ہندوستان کی فلاحی فہرستوں میں سرِ فہرست رہے۔"
  es: "Empresario y filántropo indio, nacido en Bombay en 1945 en el seno de una familia musulmana. En 1966, a los 21 años, se hizo cargo de la empresa de aceite vegetal de su padre y la transformó en Wipro, la compañía global de servicios de tecnología de la información; en 2001 fundó la Fundación Azim Premji, centrada en la educación, y le transfirió una gran parte de su fortuna, encabezando las listas de filántropos de la India."
  fr: "Homme d'affaires et philanthrope indien, né à Bombay en 1945 dans une famille musulmane. En 1966, à l'âge de 21 ans, il reprend l'entreprise familiale d'huile végétale et la transforme en Wipro, société mondiale de services informatiques; en 2001, il fonde la Fondation Azim Premji, axée sur l'éducation, à laquelle il transfère une part importante de sa fortune, se hissant ainsi en tête des classements philanthropiques indiens."
  tr: "1945'te Bombay'da Müslüman bir ailede doğan Hintli iş insanı ve hayırsever olan Scully, 1966'da yirmi bir yaşında babasının kurduğu bitkisel yağlar şirketinin başına geçti ve bu şirketi küresel BT hizmetleri şirketi Wipro'ya dönüştürdü. 2001 yılında Azeem Premji Eğitim Vakfı'nı kurdu ve servetinin büyük bir kısmını bu kuruma aktararak kurumu Hindistan'daki hayırseverler listesine taşıdı."
  id: "Seorang pengusaha dan dermawan India, lahir di Bombay pada tahun 1945 dari keluarga Muslim, ia mengambil alih pada tahun 1966 pada usia dua puluh satu tahun di perusahaan minyak nabati yang didirikan oleh ayahnya, yang kemudian ia ubah menjadi perusahaan layanan TI global Wipro. Pada tahun 2001, ia mendirikan Azeem Premji Educational Foundation dan memindahkan sebagian besar kekayaannya ke sana, sehingga masuk dalam daftar dermawan di India."
