summary:
  ar: "رجل أعمال هندي وفاعل خير، وُلد في بومباي سنة 1945 لأسرة مسلمة، وتولى سنة 1966 وهو في الحادية والعشرين شركة الزيوت النباتية التي أسسها والده فحوّلها إلى شركة «ويبرو» العالمية لخدمات تقنية المعلومات، وأسس سنة 2001 مؤسسة عظيم بريمجي التعليمية ونقل إليها قسما كبيرا من ثروته، فتصدّر قوائم فاعلي الخير في الهند."
  en: "Indian businessman and philanthropist, born in Bombay in 1945 into a Muslim family. In 1966, aged 21, he took over his father's vegetable-oil company and transformed it into Wipro, the global information-technology services company; in 2001 he founded the education-focused Azim Premji Foundation and transferred a large share of his wealth to it, topping India's philanthropy lists."
  ur: "ہندوستانی کاروباری اور فلاحی شخصیت، جو 1945 میں بمبئی میں ایک مسلم خاندان میں پیدا ہوئے۔ 1966 میں اکیس برس کی عمر میں انہوں نے اپنے والد کی نباتی تیل کی کمپنی سنبھالی اور اسے عالمی آئی ٹی خدمات کی کمپنی «وِپرو» میں بدل دیا؛ 2001 میں تعلیم پر مرکوز عظیم پریمجی فاؤنڈیشن قائم کی اور اپنی دولت کا بڑا حصہ اسے منتقل کیا، اور ہندوستان کی فلاحی فہرستوں میں سرِ فہرست رہے۔"
