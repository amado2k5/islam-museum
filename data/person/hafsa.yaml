summary:
  en: "A wife of the Prophet and daughter of Umar ibn al-Khattab, remembered in Sunni tradition as the keeper of the collected Qur'anic codex. The Encyclopaedia of Islam says she was widowed after Badr, married the Prophet in Sha'ban of 3 AH, played no political role after his death, and died at Medina in 45 AH, most sources say. It reports that the sheets of the Qur'an kept by her were returned to her after Uthman's committee used them and were destroyed by Marwan after her death."
  ar: "زوجة النبي وابنة عمر بن الخطاب، تُذكر في التقليد السني بحفظها المصحف الجامع. وتذكر دائرة المعارف الإسلامية أنها ترملت بعد بدر وتزوجها النبي في شعبان سنة 3هـ، وأنها لم تؤدِّ دورًا سياسيًا بعد وفاته، وتوفيت بالمدينة سنة 45هـ في أكثر المصادر. وتروي أن الصحف التي كانت عندها ردّتها إليها لجنة عثمان بعد الاستعانة بها، ثم أتلفها مروان بعد وفاتها. وعندها كانت صحف جمع أبي بكر، فأرسل إليها عثمان يستعيرها لتُنسخ في المصاحف ثم تُرد، وأرسلت بها {cite:sahih-al-bukhari 4987}. وعند ابن عباس أنها وعائشة هما المرأتان اللتان تظاهرتا على النبي في خبر الاعتزال {cite:sahih-al-bukhari 4914}."
  ur: "نبی کی اہلیہ اور عمر بن خطاب کی بیٹی، جنہیں سنی روایت میں جمع شدہ قرآنی صحیفوں کی نگہبان کے طور پر یاد کیا جاتا ہے۔ دائرۃ المعارف اسلامیہ کے مطابق وہ بدر کے بعد بیوہ ہوئیں، شعبان ۳ھ میں نبی سے ان کا نکاح ہوا، نبی کی وفات کے بعد انہوں نے کوئی سیاسی کردار ادا نہیں کیا، اور اکثر مآخذ کے مطابق وہ ۴۵ھ میں مدینہ میں فوت ہوئیں۔ مضمون بتاتا ہے کہ ان کے پاس رکھے صحیفے عثمان کی کمیٹی کے استعمال کے بعد انہیں لوٹائے گئے اور ان کی وفات کے بعد مروان نے انہیں تلف کر دیا۔"
  es: "Esposa del Profeta e hija de Umar ibn al-Khattab, recordada en la tradición sunita como la guardiana del códice coránico recopilado. La Enciclopedia del Islam afirma que enviudó tras la batalla de Badr, se casó con el Profeta en Sha'ban del año 3 de la Hégira, no desempeñó ningún papel político tras su muerte y falleció en Medina en el año 45 de la Hégira, según la mayoría de las fuentes. Se relata que las hojas del Corán que custodiaba le fueron devueltas después de que el comité de Uthman las utilizara y que Marwan las destruyó tras su muerte."
  fr: "Épouse du Prophète et fille d'Umar ibn al-Khattab, elle est connue dans la tradition sunnite comme la gardienne du Coran compilé. L'Encyclopédie de l'Islam indique qu'elle devint veuve après Badr, épousa le Prophète en Sha'ban de l'an 3 de l'Hégire, n'exerça aucun rôle politique après sa mort et mourut à Médine en l'an 45 de l'Hégire, selon la plupart des sources. Il est rapporté que les feuillets du Coran qu'elle conservait lui furent restitués après leur utilisation par le comité d'Uthman et détruits par Marwan après son décès."
  tr: "Peygamber'in eşi ve Sünni gelenekte kapsamlı Kur'an'ı ezberlediği belirtilen Ömer bin el-Hattab'ın kızı. İslam Ansiklopedisi, Bedr'den sonra dul kaldığını ve 3 Hicri yılında Peygamber tarafından Şaban'da evlendiğini, ölümünden sonra siyasi bir rol oynamadığını ve çoğu kaynağa göre 45 Hile yılında Medine'de öldüğünü belirtir. Kitapta, sahip olduğu gazetelerin Osman'ın komitesi tarafından yardım istedikten sonra geri verildiği, ardından Mervan'ın ölümünden sonra onları yok ettiği anlatılır. O dönemde Ebu Bekir tarafından toplanan gazeteler vardı, bu yüzden Osman onları Kur'an'a kopyalamak için ödünç alıp sonra geri döndü ve onlarla birlikte gönderdi {alıntı::] Sahih-al-Buhari 4987}. İbn Abbas'a göre, o ve Aişe, Mu'tazila haberinde Peygamber'e karşı protesto eden iki kadındı. {kaynak:Sahih-al-Buhari 4914}."
  id: "Istri Nabi dan putri Umar ibn al-Khattab, disebutkan dalam tradisi Sunni sebagai orang yang menghafal Al-Qur'an yang komprehensif. Ensiklopedia Islam menyatakan bahwa dia menjadi janda setelah Badr dan menikah oleh Nabi dalam Sha'ban tahun 3 H, dan tidak berperan secara politik setelah kematiannya, dan meninggal di Madinah pada tahun 45 H menurut sebagian besar sumber. Menurut sebagian besar sumber, surat kabar yang dimilikinya dipulangkan oleh komite Utsman setelah meminta bantuan mereka, kemudian Marwan menghancurkannya setelah kematiannya. Pada waktu itu, ada koran yang dikumpulkan oleh Abu Bakr, sehingga Utsman mengirimnya untuk dipinjam untuk disalin ke dalam Al-Qur'an, lalu kembali, dan mengirimkannya {cite:sahih-al-bukhari 4987}. Menurut Ibn Abbas, dia dan Aisha adalah dua wanita yang memprotes Nabi dalam berita Mu'tazila. {cite:sahih-al-bukhari 4914}."
