summary:
  en: "A wife of the Prophet and daughter of Umar ibn al-Khattab, remembered in Sunni tradition as the keeper of the collected Qur'anic codex. The Encyclopaedia of Islam says she was widowed after Badr, married the Prophet in Sha'ban of 3 AH, played no political role after his death, and died at Medina in 45 AH, most sources say. It reports that the sheets of the Qur'an kept by her were returned to her after Uthman's committee used them and were destroyed by Marwan after her death."
  ar: "زوجة النبي وابنة عمر بن الخطاب، تُذكر في التقليد السني بحفظها المصحف الجامع. وتذكر دائرة المعارف الإسلامية أنها ترملت بعد بدر وتزوجها النبي في شعبان سنة 3هـ، وأنها لم تؤدِّ دورًا سياسيًا بعد وفاته، وتوفيت بالمدينة سنة 45هـ في أكثر المصادر. وتروي أن الصحف التي كانت عندها ردّتها إليها لجنة عثمان بعد الاستعانة بها، ثم أتلفها مروان بعد وفاتها. وعندها كانت صحف جمع أبي بكر، فأرسل إليها عثمان يستعيرها لتُنسخ في المصاحف ثم تُرد، وأرسلت بها {cite:sahih-al-bukhari 4987}. وعند ابن عباس أنها وعائشة هما المرأتان اللتان تظاهرتا على النبي في خبر الاعتزال {cite:sahih-al-bukhari 4914}."
  ur: "نبی کی اہلیہ اور عمر بن خطاب کی بیٹی، جنہیں سنی روایت میں جمع شدہ قرآنی صحیفوں کی نگہبان کے طور پر یاد کیا جاتا ہے۔ دائرۃ المعارف اسلامیہ کے مطابق وہ بدر کے بعد بیوہ ہوئیں، شعبان ۳ھ میں نبی سے ان کا نکاح ہوا، نبی کی وفات کے بعد انہوں نے کوئی سیاسی کردار ادا نہیں کیا، اور اکثر مآخذ کے مطابق وہ ۴۵ھ میں مدینہ میں فوت ہوئیں۔ مضمون بتاتا ہے کہ ان کے پاس رکھے صحیفے عثمان کی کمیٹی کے استعمال کے بعد انہیں لوٹائے گئے اور ان کی وفات کے بعد مروان نے انہیں تلف کر دیا۔"
