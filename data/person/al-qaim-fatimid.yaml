id: person/al-qaim-fatimid
class: person
label: { ar: "القائم بأمر الله محمد بن المهدي", en: "al-Qa'im bi-Amr Allah Muhammad ibn al-Mahdi", fr: "al-Qa'im bi-Amr Allah Muhammad ibn al-Mahdi", es: "al-Qa'im bi-Amr Allah Muhammad ibn al-Mahdi", ur: "القائم بن عمرو اللہ محمد ابن المہدی" }
summary:
  ar: "أبو القاسم محمد بن المهدي عبيد الله، ثاني ملوك الدولة العبيدية، قام بالأمر بعد موت أبيه في أيام الراضي، وكان قبل قد سار إلى مصر فأخذ أكثر الصعيد وملكت جيوشه الجزيرة من الفسطاط {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}، ومات في أيام المطيع وقام بعده ولي عهده ابنه المنصور بالله إسماعيل، ونقل السيوطي عن منتقديه أنه كان شراً من أبيه وأظهر سب الأنبياء وكان مناديه ينادي العنوا الغار وما حوى وقتل خلقاً من العلماء {cite:tarikh-khulafa-minhaj-1434 p. 616}. وعند ابن الأثير لما استولى أبو يزيد على القيروان وقتل ميسوراً حفر الخنادق حول أرباض المهدية آخر ربيع الآخر سنة 333هـ وكتب إلى زيري بن مناد سيد صنهاجة وإلى سادات كتامة والقبائل يحضهم على الاجتماع بالمهدية وقتال الخارجي فتهيأوا للمسير {cite:kamil-ibn-al-athir p. 318}، وعند ابن خلدون وفي أيامه خرج أبو يزيد الخارجي على حماره يتلقب بشيخ المؤمنين يدعو للناصر فملك المغرب كله ما عدا فاس ونهب باجة وأحرقها وقتل الأطفال وسبى النساء ولحق فل أهل الضواحي بالقيروان حفاة عراة ومات أكثرهم {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "Abu'l-Qasim Muhammad, the Ubaydid Mahdi's son and second ruler of the dynasty, succeeding on his father's death under al-Radi; earlier he had taken most of Upper Egypt and his armies held Fustat's riverine quarter {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}."
  fr: "Abu'l-Qasim Muhammad, fils de l'Ubaydid Mahdi et deuxième souverain de la dynastie, succédant à la mort de son père sous al-Radi ; plus tôt, il avait pris la majeure partie de la Haute-Égypte et ses armées tenaient le quartier riverain de Fustat {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}."
  es: "Abu'l-Qasim Muhammad, hijo del Mahdi Ubaydid y segundo gobernante de la dinastía, sucedió a su padre tras su muerte bajo el mando de al-Radi; anteriormente había tomado la mayor parte del Alto Egipto y sus ejércitos controlaban el barrio ribereño de Fustat {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}."
  ur: "ابو القاسم محمد، عبید مہدی کا بیٹا اور خاندان کا دوسرا حکمران، الرادی کے ماتحت اپنے والد کی موت پر کامیاب ہوا۔ اس سے قبل اس نے بالائی مصر کا بیشتر حصہ لے لیا تھا اور اس کی فوجوں نے فوستات کے دریائی علاقے پر قبضہ کر لیا تھا۔ 589-590,604}۔"
  tr: "Ebu el-Kasım Muhammed bin el-Mehdi Ubeyd Allah, babasının ölümünden sonra el-Radi döneminde tahta geçti. Daha önce Mısır'a yürümüş, Yukarı Mısır'ın çoğunu ele geçirmiş ve orduları adayı Fustat'tan kontrol etmişti {atıf:Tarikh-khulafa-minhaj-1434 s. 589-590,604}. Al-Muti' döneminde öldü ve ardından tahta veliaht prensi oğlu el-Mansur Billah İsmail geçti. El-Suyuti, eleştirmenlerinin babasından daha kötü olduğunu ve peygamberleri açıkça aşağıladığını aktardı. Arayan kişi mağaraya ve içerdiklerine lanet edilmesini istedi, bir grup âlimi öldürdü {cite:Tarikh-Khulafa-minhaj-1434, s. 616}. İbn al-Athir'e göre, Ebu Yezid Kairuan'ı ele geçirip Maysura'yı öldürdüğünde, 333 Hicri yılında Rabi'l-Thani'nin sonunda Mahdist mahallelerinin etrafında siperler kazmıştır. Sanhaja'nın reisi Ziri ibn Mnad'a, Katama ve kabilelerin liderlerine mektup yazarak onları Mahdia'da toplanıp el-Harici ile savaşmaya çağırmış, böylece yürüyüşe hazırlanmışlardır {alıntı:) Kamil ibn al-Athir s. 318}. İbn Haldun'a göre, Ebu Yazid el-Hariji günlerinde eşeğine binerek destek istedi; bu kişi Müminlerin Şeyhi olarak anılırdı. Fez hariç tüm Fas'ı yönetti, Béja'yı yağmaladı, yaktı, çocukları öldürdü ve kadınları köleleştirdi. Kairouan banliyölerinin halkı çıplak ayakla ve çıplak onu takip etti ve çoğu öldü. {cit:History-ibn-khaldun-ibar s. 926}"
  id: "Abu al-Qasim Muhammad ibn al-Mahdi Ubayd Allah, raja kedua dinasti Ubayid, mengambil alih setelah kematian ayahnya pada masa al-Radi. Sebelumnya ia telah berbaris ke Mesir, merebut sebagian besar Mesir Hulu, dan pasukannya menguasai pulau itu dari Fustat {cite:Tarikh-khulafa-minhaj-1434 hlm. 589-590,604}. Ia meninggal pada masa Al-Muti', dan setelahnya, putra mahkotanya, putranya al-Mansur Billah Ismail, menggantikan. Al-Suyuti mengutip para pengkritiknya yang mengatakan ia lebih buruk dari ayahnya dan secara terbuka menghina para nabi. Peneluhnya menyerukan agar gua itu dikutuk dan isinya, membunuh sekelompok ulama {cite:Tarikh-Khulafa-minhaj-1434, hlm. 616}. Menurut Ibn al-Athir, ketika Abu Yazid merebut Kairouan dan membunuh Maysura, ia menggali parit di sekitar kawasan Mahdis di akhir Rabi' al-Thani pada tahun 333 H. Ia menulis kepada Ziri ibn Mnad, kepala Sanhaja, dan para kepala suku Katama serta suku-suku, mendesak mereka untuk berkumpul di Mahdia dan melawan al-Khariji, sehingga mereka bersiap untuk berangkat {cite:Kamil-ibn-al-Athir hlm. 318}. Menurut Ibn Khaldun, pada masa-masanya, Abu Yazid al-Khariji menunggang keledainya, yang disebut Sheikh Orang Beriman, memanggil dukungan. Ia memerintah seluruh Maroko kecuali Fez, menjarah Béja, membakarnya, membunuh anak-anak, dan memperbudak wanita. Orang-orang pinggiran Kairouan mengikutinya tanpa alas kaki dan telanjang, dan sebagian besar dari mereka meninggal. {cite:History-ibn-khaldun-ibar hlm. 926}"
