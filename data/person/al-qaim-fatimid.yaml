id: person/al-qaim-fatimid
class: person
label: { ar: "القائم بأمر الله محمد بن المهدي", en: "al-Qa'im bi-Amr Allah Muhammad ibn al-Mahdi" }
summary:
  ar: "أبو القاسم محمد بن المهدي عبيد الله، ثاني ملوك الدولة العبيدية، قام بالأمر بعد موت أبيه في أيام الراضي، وكان قبل قد سار إلى مصر فأخذ أكثر الصعيد وملكت جيوشه الجزيرة من الفسطاط {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}، ومات في أيام المطيع وقام بعده ولي عهده ابنه المنصور بالله إسماعيل، ونقل السيوطي عن منتقديه أنه كان شراً من أبيه وأظهر سب الأنبياء وكان مناديه ينادي العنوا الغار وما حوى وقتل خلقاً من العلماء {cite:tarikh-khulafa-minhaj-1434 p. 616}. وعند ابن الأثير لما استولى أبو يزيد على القيروان وقتل ميسوراً حفر الخنادق حول أرباض المهدية آخر ربيع الآخر سنة 333هـ وكتب إلى زيري بن مناد سيد صنهاجة وإلى سادات كتامة والقبائل يحضهم على الاجتماع بالمهدية وقتال الخارجي فتهيأوا للمسير {cite:kamil-ibn-al-athir p. 318}، وعند ابن خلدون وفي أيامه خرج أبو يزيد الخارجي على حماره يتلقب بشيخ المؤمنين يدعو للناصر فملك المغرب كله ما عدا فاس ونهب باجة وأحرقها وقتل الأطفال وسبى النساء ولحق فل أهل الضواحي بالقيروان حفاة عراة ومات أكثرهم {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "Abu'l-Qasim Muhammad, the Ubaydid Mahdi's son and second ruler of the dynasty, succeeding on his father's death under al-Radi; earlier he had taken most of Upper Egypt and his armies held Fustat's riverine quarter {cite:tarikh-khulafa-minhaj-1434 p. 589-590,604}."
