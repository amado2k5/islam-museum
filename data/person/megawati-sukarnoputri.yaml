summary:
  ar: "سياسية إندونيسية وُلدت سنة 1947، أكبر بنات الرئيس المؤسس سوكارنو؛ قادت حزب النضال الديمقراطي الإندونيسي، وصارت نائبة للرئيس سنة 1999 ثم خامس رئيس لإندونيسيا وأول امرأة تتولى المنصب (2001–2004)، وخسرت انتخابات 2004 و2009 وبقيت زعيمة حزبها عبر العقود التالية."
  en: "Indonesian politician born in 1947, the eldest daughter of founding president Sukarno. She led the Indonesian Democratic Party of Struggle (PDI-P), became vice president in 1999 and then Indonesia's fifth president and first woman to hold the office (2001–2004); she lost the 2004 and 2009 elections and remained her party's leader through the decades that followed."
  ur: "انڈونیشی سیاست دان، پیدائش 1947ء، بانی صدر سوکارنو کی سب سے بڑی بیٹی۔ انڈونیشین ڈیموکریٹک پارٹی آف سٹرگل کی قیادت کی، 1999ء میں نائب صدر بنیں اور پھر انڈونیشیا کی پانچویں صدر اور اس منصب پر فائز ہونے والی پہلی خاتون ⁦(2001ء–2004ء)⁩؛ 2004ء اور 2009ء کے انتخابات ہار گئیں اور بعد کے عشروں تک اپنی جماعت کی سربراہ رہیں۔"
  es: "Política indonesia nacida en 1947, hija mayor del presidente fundador Sukarno. Lideró el Partido Democrático Indonesio de Lucha (PDI-P), se convirtió en vicepresidenta en 1999 y luego en la quinta presidenta de Indonesia y la primera mujer en ocupar el cargo (2001-2004); perdió las elecciones de 2004 y 2009 y siguió siendo la líder de su partido durante las décadas siguientes."
  fr: "Femme politique indonésienne née en 1947, fille aînée du président fondateur Sukarno. Elle a dirigé le Parti démocratique indonésien de lutte (PDI-P), est devenue vice-présidente en 1999, puis cinquième présidente de l'Indonésie et première femme à occuper ce poste (2001-2004); elle a perdu les élections de 2004 et 2009 et est restée à la tête de son parti pendant les décennies suivantes."
  tr: "1947 doğumlu Endonezyalı bir siyasetçi, kurucu Cumhurbaşkanı Sukarno'nun en büyük kızıdır; Endonezya Demokratik Mücadele Partisi'nin lideriydi, 1999'da başkan yardımcısı oldu, ardından Endonezya'nın beşinci cumhurbaşkanı oldu ve bu görevi üstlenen ilk kadın oldu (2001–2004). 2004 ve 2009 seçimlerini kaybetti ve sonraki on yıllarda partisinin lideri olarak kaldı."
  id: "Seorang politikus Indonesia yang lahir pada tahun 1947, putri sulung dari Presiden pendiri Sukarno; ia memimpin Partai Perjuangan Demokratik Indonesia, menjadi wakil presiden pada tahun 1999, kemudian presiden kelima Indonesia dan wanita pertama yang memegang posisi tersebut (2001–2004). Ia kalah dalam pemilihan tahun 2004 dan 2009 dan tetap menjadi pemimpin partainya selama beberapa dekade berikutnya."
