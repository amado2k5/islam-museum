summary:
  ar: "سياسية إندونيسية وُلدت سنة 1947، أكبر بنات الرئيس المؤسس سوكارنو؛ قادت حزب النضال الديمقراطي الإندونيسي، وصارت نائبة للرئيس سنة 1999 ثم خامس رئيس لإندونيسيا وأول امرأة تتولى المنصب (2001–2004)، وخسرت انتخابات 2004 و2009 وبقيت زعيمة حزبها عبر العقود التالية."
  en: "Indonesian politician born in 1947, the eldest daughter of founding president Sukarno. She led the Indonesian Democratic Party of Struggle (PDI-P), became vice president in 1999 and then Indonesia's fifth president and first woman to hold the office (2001–2004); she lost the 2004 and 2009 elections and remained her party's leader through the decades that followed."
  ur: "انڈونیشی سیاست دان، پیدائش 1947ء، بانی صدر سوکارنو کی سب سے بڑی بیٹی۔ انڈونیشین ڈیموکریٹک پارٹی آف سٹرگل کی قیادت کی، 1999ء میں نائب صدر بنیں اور پھر انڈونیشیا کی پانچویں صدر اور اس منصب پر فائز ہونے والی پہلی خاتون (2001ء–2004ء)؛ 2004ء اور 2009ء کے انتخابات ہار گئیں اور بعد کے عشروں تک اپنی جماعت کی سربراہ رہیں۔"
