faith:
  - { value: sunni-shafii, basis: documented, note: "The English article's religious infobox and its 'Religious views' passage give denomination Sunni, jurisprudence Shafi'i, creed Ash'ari and tariqa Ba 'Alawiyya, both resting on The Muslim 500 and so counting as one family; the Arabic infobox independently gives the same values — Ahl al-Sunna wal-Jama'a, the Ash'ari creed and the Shafi'i madhhab — a second attestation of the same configuration that recorded Zaid Shakir's school (a referenced infobox plus an independent naming). The Ash'ari creed has no compound value in the faith enum and is recorded in this note only. That his teacher Zain bin Sumait was a Shafi'i jurist is a teacher's school and was not used as evidence.", sources: [source/wikipedia-umar-bin-hafiz-en, source/wikipedia-umar-bin-hafiz-ar] }
  - { value: sufi, basis: documented, note: "Membership of the Ba 'Alawi tradition is attested of him personally in text. The Arabic lead places him among those pointed to as foremost in the science of spiritual wayfaring (ilm al-suluk), 'especially in the Ba 'Alawi tariqa', citing a 1999 biographical work; the English text associates him with the Ba 'Alawiyya Sufi tradition and lists his occupation as Sufi scholar. Both articles also attest his own discipleship under Ba 'Alawi masters — his father Muhammad bin Salim bin Hafiz, Muhammad bin Abd-Allah al-Haddar of Ribat al-Bayda and Abdul Qadir bin Ahmad al-Saqqaf — so the segment rests on his documented discipleship and teaching, not on his family's standing in the tradition.", sources: [source/wikipedia-umar-bin-hafiz-ar, source/wikipedia-umar-bin-hafiz-en] }
