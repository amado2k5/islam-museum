id: person/al-farabi
class: person
label: { ar: "الفارابي", en: "al-Farabi" }
summary:
  ar: "أبو نصر محمد بن محمد بن طرخان الفارابي، فيلسوف تركي الأصل وُلد في ناحية فاراب بتركستان، ولقب بالمعلم الثاني بعد أرسطو. أقام سنوات في بغداد ثم قبل سنة 330هـ/942م دعوة سيف الدولة الحمداني وعاش في حلب، وتوفي بدمشق سنة 339هـ/950م. وضع شروحاً على أرسطو ورسائل في المنطق والسياسة، منها إحصاء العلوم وآراء أهل المدينة الفاضلة، وأثّر في ابن سينا وابن رشد ومن جاء بعدهم {cite:encyclopaedia-of-islam-2 vol. 2 p. 808}."
  en: "Abu Nasr Muhammad ibn Muhammad ibn Tarkhan al-Farabi was a philosopher of Turkish origin, born in the district of Farab in Turkestan and called the Second Teacher after Aristotle. He lived for years in Baghdad, accepted Sayf al-Dawla's invitation in 330/942, lived mainly in Aleppo, and died in Damascus in 339/950. He wrote commentaries on Aristotle and treatises on logic and politics, among them the Survey of the Sciences and Ara' Ahl al-Madina al-Fadila, and influenced Ibn Sina, Ibn Rushd and later thinkers {cite:encyclopaedia-of-islam-2 vol. 2 p. 808}."
  ur: "ابو نصر محمد بن محمد بن طرخان فارابی ترک نژاد فلسفی تھے جو ترکستان میں فاراب کے علاقے میں پیدا ہوئے اور ارسطو کے بعد معلمِ ثانی کہلائے۔ وہ برسوں بغداد میں رہے، پھر 330ھ/942ء میں سیف الدولہ کی دعوت قبول کر کے زیادہ تر حلب میں رہے اور 339ھ/950ء میں دمشق میں فوت ہوئے۔ انہوں نے ارسطو کی شروحات اور منطق و سیاست پر رسائل لکھے، جن میں احصاء العلوم اور آراء اہل المدینۃ الفاضلہ شامل ہیں، اور ابن سینا، ابن رشد اور بعد کے مفکروں پر اثر ڈالا {cite:encyclopaedia-of-islam-2 vol. 2 p. 808}."
