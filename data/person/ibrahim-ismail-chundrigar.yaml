summary:
  ar: "محامٍ وسياسي باكستاني (1897–1960)، قيادي في الرابطة المسلمة بمومباي، ووزير التجارة في أول حكومة باكستانية سنة 1947، وحاكم المقاطعة الشمالية الغربية ثم البنجاب الغربية ووزير القانون، ورئيس وزراء باكستان من 17 أكتوبر إلى 11 ديسمبر 1957 على رأس ائتلاف قصير العمر. توفي في لندن في 26 سبتمبر 1960 ودُفن في كراتشي."
  en: "Pakistani lawyer and politician (1897–1960), a Bombay Muslim League leader who served as trade minister in Pakistan's first cabinet in 1947, as governor of the North-West Frontier Province and then West Punjab and as law minister, and as prime minister of Pakistan from 17 October to 11 December 1957 at the head of a short-lived coalition. He died at London on 26 September 1960 and was buried at Karachi."
  ur: "پاکستانی وکیل اور سیاست دان (1897ء–1960ء)، بمبئی مسلم لیگ کے رہنما، 1947ء میں پاکستان کی پہلی کابینہ میں وزیرِ تجارت، پھر شمال مغربی سرحدی صوبے اور مغربی پنجاب کے گورنر اور وزیرِ قانون رہے، اور 17 اکتوبر سے 11 دسمبر 1957ء تک ائتلاف کے سربراہ کی حیثیت سے پاکستان کے وزیرِ اعظم رہے۔ 26 ستمبر 1960ء کو لندن میں وفات پائی اور کراچی میں دفن ہوئے۔"
