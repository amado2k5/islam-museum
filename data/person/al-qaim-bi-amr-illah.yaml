id: person/al-qaim-bi-amr-illah
class: person
label: { ar: "القائم بأمر الله حمزة بن المتوكل", en: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil", fr: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil", es: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil", ur: "القائم بن عمرو اللہ حمزہ بن المتوکل" }
summary:
  ar: "خليفة القاهرة [٨٥٤–٨٥٩هـ]، أبو البقاء حمزة بن المتوكل، بويع بالخلافة بعد أخيه ولم يكن عهد إليه ولا إلى غيره وكان شهماً صارماً أقام أبهة الخلافة قليلاً وعنده جبروت بخلاف سائر إخوته، قلد عثمان بن جقمق المنصور ثم الأشرف إينال لما وثب عليه، ثم وقع بين الخليفة والأشرف بسبب ركوب الجند عليه فخلعه من الخلافة في جمادى سنة تسع وخمسين وسيره إلى الإسكندرية فاعتقله بها إلى أن مات بها سنة ثلاث وستين وله نحو سبعين ودفن عند شقيقه المستعين وقد خلعا كلاهما واعتقلا بالإسكندرية ودفنا معاً {cite:tarikh-khulafa-minhaj-1434 p. 775}. وفي شذرات الذهب في خامس سنة خمس وخمسين وثمان مئة بويع بالخلافة القائم بأمر الله حمزة بن المتوكل على الله بعد وفاة أخيه المستكفي بالله سليمان {cite:shadharat-dhahab p. 284}."
  en: "Cairo caliph [854–859], hailed without any deed — 'bold, severe, with a majesty unlike his brothers'' — till his breach with al-Ashraf Inal over the soldiers' intrusion saw him deposed and held at Alexandria to his death in 863, buried beside his full brother al-Musta'in: both deposed, both jailed there, buried together {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  fr: "Le calife du Caire [854-859], salué sans aucun acte – « audacieux, sévère, avec une majesté différente de celle de ses frères  » – jusqu’à ce que sa rupture avec al-Ashraf Inal sur l’intrusion des soldats le voit déposé et détenu à Alexandrie jusqu’à sa mort en 863, enterré à côté de son frère complet al-Musta’in : tous deux déposés, tous deux emprisonnés là, enterrés ensemble {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  es: "Califa de El Cairo [854–859], aclamado sin mérito alguno —«audaz, severo, con una majestad distinta a la de sus hermanos»— hasta que su ruptura con al-Ashraf Inal por la intrusión de los soldados provocó su deposición y su encarcelamiento en Alejandría hasta su muerte en 863, enterrado junto a su hermano al-Musta'in: ambos depuestos, ambos encarcelados allí, enterrados juntos {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  ur: "قاہرہ کا خلیفہ [854-859]، بغیر کسی عمل کے تعریف کیا جاتا تھا - 'جرات مند، شدید، اپنے بھائیوں کے برعکس عظمت کے ساتھ' - جب تک کہ فوجیوں کی مداخلت پر الاشرف انال کے ساتھ اس کی خلاف ورزی تک اسے معزول اور 863 میں اسکندریہ میں اس کی موت تک رکھا گیا، اس کے پورے بھائی المصطفیٰ کے پاس دفن کیا گیا: دونوں کو ایک ساتھ دفن کیا گیا۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 775}۔"
  tr: "Kahire Halifesi [854–859 H.C.], Ebu el-Baka Hamza bin el-Mutawakkil, kardeşinden sonra halifeliğe bağlılık yemini etmişti ve ona ya da başkasına emanet edilmedi. O, kısa süreliğine halifeliğin prestijini kazanmış ve diğer kardeşlerinden farklı olarak büyük bir güce sahip olan vahşi ve vahşi bir adamdı. Halifenin saldırısına uğradığında Osman bin Jaqmaq al-Mansur'u, ardından el-Eşref'i taklit etti. Daha sonra, üzerinde askerler olduğu için halife ile el-Eşref arasında çatıştı, bu yüzden 59 Hicri yılında Cumada'da onu tahttan indirdi, İskenderiye'ye yürüdü ve orada yaklaşık yetmişte ölene kadar hapsedildi. Kardeşi el-Musta'in ile birlikte defnedildi. İkisi de tahttan indirildi, İskenderiye'de hapsedildi ve birlikte defnedildi {alıntı:) History-Khulafa-minhaj-1434, s. 775}. Şadharat al-Dhahab'da, sekiz yüz elli beşinci yılın beşinci yılında, halifelik, kardeşi el-Mustakfi Billah Süleyman'ın ölümünden sonra el-Ka'im bi-Amr Allah Hamza ibn el-Mutavakkil 'ala Allah'a bağlılık yemini etti {kaynak: şadharat-dhahab, s. 284}."
  id: "Khalifah Kairo [854–859 H], Abu al-Baqa Hamza ibn al-Mutawakkil, bersumpah setia kepada kekhalifahan setelah saudaranya dan tidak dipercayakan kepada dia atau siapa pun. Dia adalah pria yang garang dan garang yang sempat membangun prestise kekhalifahan dan memiliki kekuasaan besar yang berbeda dari saudara-saudaranya yang lain. Dia meniru Uthman ibn Jaqmaq al-Mansur, kemudian al-Ashraf ketika diserang oleh khalifah. Kemudian dia bentrok antara khalifah dan al-Ashraf karena tentara yang menunggang dirinya, sehingga dia menggulingkannya di Jumada tahun 59 H, lalu berbaris ke Alexandria, di mana dia dipenjara hingga meninggal sekitar tahun tujuh puluh. Dia dimakamkan bersama saudaranya al-Musta'in. Keduanya digulingkan, dipenjara di Alexandria, dan dimakamkan bersama {cite:History-Khulafa-minhaj-1434, hlm. 775}. Dalam Shadharat al-Dhahab, pada tahun kelima delapan ratus lima puluh lima, kekhalifahan bersumpah setia kepada khalifah al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil 'ala Allah setelah kematian saudaranya al-Mustakfi Billah Sulayman {cite:shadharat-dhahab, hlm. 284}."
