id: person/al-qaim-bi-amr-illah
class: person
label: { ar: "القائم بأمر الله حمزة بن المتوكل", en: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil", fr: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil", es: "al-Qa'im bi-Amr Allah Hamza ibn al-Mutawakkil" }
summary:
  ar: "خليفة القاهرة [٨٥٤–٨٥٩هـ]، أبو البقاء حمزة بن المتوكل، بويع بالخلافة بعد أخيه ولم يكن عهد إليه ولا إلى غيره وكان شهماً صارماً أقام أبهة الخلافة قليلاً وعنده جبروت بخلاف سائر إخوته، قلد عثمان بن جقمق المنصور ثم الأشرف إينال لما وثب عليه، ثم وقع بين الخليفة والأشرف بسبب ركوب الجند عليه فخلعه من الخلافة في جمادى سنة تسع وخمسين وسيره إلى الإسكندرية فاعتقله بها إلى أن مات بها سنة ثلاث وستين وله نحو سبعين ودفن عند شقيقه المستعين وقد خلعا كلاهما واعتقلا بالإسكندرية ودفنا معاً {cite:tarikh-khulafa-minhaj-1434 p. 775}. وفي شذرات الذهب في خامس سنة خمس وخمسين وثمان مئة بويع بالخلافة القائم بأمر الله حمزة بن المتوكل على الله بعد وفاة أخيه المستكفي بالله سليمان {cite:shadharat-dhahab p. 284}."
  en: "Cairo caliph [854–859], hailed without any deed — 'bold, severe, with a majesty unlike his brothers'' — till his breach with al-Ashraf Inal over the soldiers' intrusion saw him deposed and held at Alexandria to his death in 863, buried beside his full brother al-Musta'in: both deposed, both jailed there, buried together {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  fr: "Le calife du Caire [854-859], salué sans aucun acte – « audacieux, sévère, avec une majesté différente de celle de ses frères  » – jusqu’à ce que sa rupture avec al-Ashraf Inal sur l’intrusion des soldats le voit déposé et détenu à Alexandrie jusqu’à sa mort en 863, enterré à côté de son frère complet al-Musta’in : tous deux déposés, tous deux emprisonnés là, enterrés ensemble {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  es: "Califa de El Cairo [854–859], aclamado sin mérito alguno —«audaz, severo, con una majestad distinta a la de sus hermanos»— hasta que su ruptura con al-Ashraf Inal por la intrusión de los soldados provocó su deposición y su encarcelamiento en Alejandría hasta su muerte en 863, enterrado junto a su hermano al-Musta'in: ambos depuestos, ambos encarcelados allí, enterrados juntos {cite:tarikh-khulafa-minhaj-1434 p. 775}."
