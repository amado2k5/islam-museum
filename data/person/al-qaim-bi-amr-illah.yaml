label: { ar: "القائم بأمر الله حمزة بن المتوكل" }
summary:
  ar: "خليفة القاهرة [٨٥٤–٨٥٩هـ]، أبو البقاء حمزة بن المتوكل، بويع بالخلافة بعد أخيه ولم يكن عهد إليه ولا إلى غيره وكان شهماً صارماً أقام أبهة الخلافة قليلاً وعنده جبروت بخلاف سائر إخوته، قلد عثمان بن جقمق المنصور ثم الأشرف إينال لما وثب عليه، ثم وقع بين الخليفة والأشرف بسبب ركوب الجند عليه فخلعه من الخلافة في جمادى سنة تسع وخمسين وسيره إلى الإسكندرية فاعتقله بها إلى أن مات بها سنة ثلاث وستين وله نحو سبعين ودفن عند شقيقه المستعين وقد خلعا كلاهما واعتقلا بالإسكندرية ودفنا معاً {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  en: "Cairo caliph [854–859], hailed without any deed — 'bold, severe, with a majesty unlike his brothers'' — till his breach with al-Ashraf Inal over the soldiers' intrusion saw him deposed and held at Alexandria to his death in 863, buried beside his full brother al-Musta'in: both deposed, both jailed there, buried together {cite:tarikh-khulafa-minhaj-1434 p. 775}."
