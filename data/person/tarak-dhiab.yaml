  ar: "لاعب كرة قدم تونسي سابق وسياسي (وُلد سنة 1954 في تونس العاصمة)، صانع ألعاب اختير أفضل لاعب أفريقي سنة 1977 وقاد تونس في كأس العالم 1978 حين حققت أول فوز أفريقي في تاريخ المونديال، ثم تولى وزارة الشباب والرياضة من 2011 إلى 2014."
