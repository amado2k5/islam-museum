summary:
  ar: "لاعب كرة قدم تونسي سابق وسياسي ⁦(وُلد سنة 1954 في تونس العاصمة)⁩، صانع ألعاب اختير أفضل لاعب أفريقي سنة 1977 وقاد تونس في كأس العالم 1978 حين حققت أول فوز أفريقي في تاريخ المونديال، ثم تولى وزارة الشباب والرياضة من 2011 إلى 2014."
  en: "Tunisian former footballer and politician (born 1954 in Tunis), a playmaker named African Footballer of the Year in 1977 who played at the 1978 World Cup, where Tunisia became the first African team to win a World Cup match; he later served as Minister of Youth and Sports from 2011 to 2014."
  ur: "تیونسی سابق فٹبالر اور سیاست دان ⁦(پیدائش 1954، تیونس شہر)⁩، پلے میکر جنہیں 1977 میں افریقی فٹبالر آف دی ایئر منتخب کیا گیا اور جو 1978 کے ورلڈ کپ میں کھیلے جب تیونس ورلڈ کپ میچ جیتنے والی پہلی افریقی ٹیم بنی؛ بعد میں وہ 2011 سے 2014 تک وزیرِ نوجوانان و کھیل رہے۔"
  es: "Exfutbolista y político tunecino (nacido en 1954 en Túnez), un creador de juego que fue nombrado Futbolista Africano del Año en 1977 y que participó en la Copa del Mundo de 1978, donde Túnez se convirtió en el primer equipo africano en ganar un partido de la Copa del Mundo; posteriormente, fue Ministro de Juventud y Deportes de 2011 a 2014."
  fr: "Ancien footballeur et homme politique tunisien (né en 1954 à Tunis), meneur de jeu nommé footballeur africain de l'année en 1977, il a participé à la Coupe du monde de 1978, où la Tunisie est devenue la première équipe africaine à remporter un match de Coupe du monde; il a ensuite été ministre de la Jeunesse et des Sports de 2011 à 2014."
  tr: "Eski Tunuslu futbolcu ve siyasetçi (1954 doğumlu, Tunus), 1977'de en iyi Afrika oyuncusu seçilen ve 1978 Dünya Kupası'nda Tunus'u ilk Afrika zaferini elde ettiği oyun kurucusudur. Daha sonra 2011-2014 yılları arasında Gençlik ve Spor Bakanı olarak görev yaptı."
  id: "Mantan pemain sepak bola dan politisi Tunisia (lahir tahun 1954 di Tunis), seorang playmaker yang terpilih sebagai pemain Afrika terbaik pada tahun 1977 dan memimpin Tunisia di Piala Dunia 1978 ketika mereka meraih kemenangan Afrika pertama dalam sejarah Piala Dunia. Ia kemudian menjabat sebagai Menteri Pemuda dan Olahraga dari tahun 2011 hingga 2014."
