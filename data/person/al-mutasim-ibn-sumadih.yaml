label: { ar: "المعتصم بن صمادح", en: "al-Mu'tasim ibn Sumadih", fr: "al-Mu'tasim ibn Sumadih", es: "al-Mu'tasim ibn Sumadih", ur: "معتصم بن سمادیح" }
died: { edtf: "1091", hijri: "0484", calendar: julian, precision: day, status: tradition, derived: true, note: "مات يوم الخميس لثمان بقين من شهر ربيع الأول سنة أربع وثمانين وأربعمائة بالمرية، ودفن في تربة له عند باب الخوخة {cite:wafayat-ayan}." }
summary:
  ar: "أبو يحيى محمد بن معن بن محمد بن أحمد بن صمادح التجيبي المعتصم، آخر ملوك بني طجيب بالمرية؛ كان جده صاحب وشقة والمرية في أيام المؤيد هشام، وملك أبوه معن المرية، فلما مضت رياسته شارك المعتصم المعتمدَ بن عباد في الخروج على أمير المسلمين يوسف بن تاشفين فخلعه يوسف وقبض بلده؛ وكان شاعراً مفلقاً، وروى ابن بسام في الذخيرة طرفاً من أخباره وأشعاره وصورة حصاره {cite:wafayat-ayan}."
  en: "al-Mu'tasim b. Sumadih (d. 484) — last Tujibid king of Almeria; sided with al-Mu'tamid b. Abbad against Yusuf b. Tashfin, who deposed him; a gifted poet mourned by Ibn Bassam's Dhakhira {cite:wafayat-ayan}."
  fr: "Al-Mu'tasim b. Sumadih (mort en 484) - dernier roi Tujibid d'Almeria ; côté avec al-Mu'tamid b. Abbad contre Yusuf b. Tashfin, qui l'a déposé ; un poète doué pleuré par Dhakira Ibn Bassam {cite:wafayat-ayan}."
  es: "al-Mutasim b. Sumadih (m. 484), último rey tujibí de Almería; del lado de al-Mu'tamid b. Abbad contra Yusuf b. Tashfin, quien lo depuso; un poeta talentoso llorado por Dhakhira {cita:wafayat-ayan} de Ibn Bassam."
  ur: "المعتصم ب سمادیح ⁦(متوفی 484)⁩ - المیریا کا آخری تاجیب بادشاہ؛ المتمد ب کا ساتھ دیا۔ یوسف ب کے خلاف آباد۔ تاشفین، جس نے اسے معزول کیا؛ ابن بسام کے ذخیرہ کا ماتم کرنے والا ایک ہونہار شاعر۔"
  tr: "Ebu Yahya Muhammed ibn Ma'n ibn Muhammed ibn Ahmed ibn Samadih al-Tujibi al-Mu'tasim, Almerya'daki Banu Tacib'in son kralı; büyükbabası Al-Mu'eyyad Hisham döneminde Almeria'nın bir hissesine sahipti ve babası Al-Muriyah'ı yönetiyordu. Liderliği sona erdiğinde, Al-Mu'tasim, Al-Mu'tamid ibn 'Abbad ile birlikte Müslüman komutan Yusuf ibn 'Tashfin'e karşı isyan etti; Yusuf onu tahttan indirdi ve şehrinin kontrolünü ele geçirdi. O bir şair ve filiactı. İbn Bassam, Al-Dhakira gazetesinde haberlerinin, şiirlerinin ve kuşatmasının bir tasvirini anlattı {atıf:wafayat-ayan}."
  id: "Abu Yahya Muhammad ibn Ma'n ibn Muhammad ibn Ahmad ibn Samadih al-Tujibi al-Mu'tasim, raja terakhir Banu Tajib di Almeria; kakeknya adalah pemilik saham dan Almeria pada masa Al-Mu'ayyad Hisham, serta ayahnya memerintah Al-Muriyah. Ketika kepemimpinannya berakhir, Al-Mu'tasim bergabung dengan Al-Mu'tamid ibn 'Abbad untuk memberontak melawan komandan Muslim Yusuf ibn Tashfin, yang menggulingkannya dan mengambil alih kotanya. Ia adalah seorang penyair dan seorang filia. Ibn Bassam menceritakan dalam Al-Dhakira sebagian berita, puisi, dan gambaran pengepungannya {cite:wafayat-ayan}."
