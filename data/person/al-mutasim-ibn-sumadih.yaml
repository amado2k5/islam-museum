summary:
  ar: "أبو يحيى محمد بن معن بن محمد بن أحمد بن صمادح التجيبي المعتصم، آخر ملوك بني طجيب بالمرية؛ كان جده صاحب وشقة والمرية في أيام المؤيد هشام، وملك أبوه معن المرية، فلما مضت رياسته شارك المعتصم المعتمدَ بن عباد في الخروج على أمير المسلمين يوسف بن تاشفين فخلعه يوسف وقبض بلده؛ وكان شاعراً مفلقاً، وروى ابن بسام في الذخيرة طرفاً من أخباره وأشعاره وصورة حصاره {cite:wafayat-ayan}."
  en: "al-Mu'tasim b. Sumadih (d. 484) — last Tujibid king of Almeria; sided with al-Mu'tamid b. Abbad against Yusuf b. Tashfin, who deposed him; a gifted poet mourned by Ibn Bassam's Dhakhira {cite:wafayat-ayan}."
