label:
  ar: السلطان يوسف الأول أبو الحجاج النصري
  en: Sultan Yusuf I Abu al-Hajjaj al-Nasri
summary:
  ar: "أبو الحجاج يوسف بن إسماعيل بن نصر، سلطان غرناطة؛ هلك طعناً بمصلى العيد يوم الفطر سنة 755هـ بيد أسود مدسوس نُسبت مداخلته إلى بعض إماء قصرهم على حكاية ابن خلدون، فنصب أهل الأندلس ابنه محمداً الخامس وحجبه مولاه رضوان واستبد عليه."
  en: "Abu al-Hajjaj Yusuf ibn Ismail ibn Nasr, sultan of Granada; killed by stabbing at the Eid musalla on the day of Fitr 755 AH by an infiltrated black man whose intrusion was attributed to some of the palace slave-women, per Ibn Khaldun's account — whereupon the Andalusians installed his son Muhammad V while his mawla Ridwan held him under ward and ruled over him."
