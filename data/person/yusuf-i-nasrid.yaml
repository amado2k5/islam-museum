id: person/yusuf-i-nasrid
class: person
label:
  ar: السلطان يوسف الأول أبو الحجاج النصري
  en: Sultan Yusuf I Abu al-Hajjaj al-Nasri
  es: "Sultan Yusuf I Abu al-Hajjaj al-Nasri"
  fr: "Sultan Yusuf I Abu al-Hajjaj al-Nasri"
summary:
  ar: "أبو الحجاج يوسف بن إسماعيل بن نصر، سلطان غرناطة؛ هلك طعناً بمصلى العيد يوم الفطر سنة 755هـ بيد أسود مدسوس نُسبت مداخلته إلى بعض إماء قصرهم على حكاية ابن خلدون، فنصب أهل الأندلس ابنه محمداً الخامس وحجبه مولاه رضوان واستبد عليه."
  en: "Abu al-Hajjaj Yusuf ibn Ismail ibn Nasr, sultan of Granada; killed by stabbing at the Eid musalla on the day of Fitr 755 AH by an infiltrated black man whose intrusion was attributed to some of the palace slave-women, per Ibn Khaldun's account — whereupon the Andalusians installed his son Muhammad V while his mawla Ridwan held him under ward and ruled over him."
  es: "Abu al-Hajjaj Yusuf ibn Ismail ibn Nasr, sultán de Granada, fue asesinado a puñaladas en la sala de oración del Eid el día de Fitr del año 755 AH por un hombre negro infiltrado cuya intrusión se atribuyó a algunas de las esclavas del palacio, según el relato de Ibn Khaldun. Acto seguido, los andalusíes instalaron a su hijo Muhammad V, mientras que su mawla Ridwan lo mantuvo bajo tutela y gobernó sobre él."
  fr: "Abu al-Hajjaj Yusuf ibn Ismail ibn Nasr, sultan de Grenade; tué par un coup de couteau à la salle de prière de l'Aïd le jour de Fitr 755 AH par un homme noir infiltré dont l'intrusion a été attribuée à certaines esclaves du palais, selon le récit d'Ibn Khaldun — sur quoi les Andalous ont installé son fils Muhammad V tandis que son mawla Ridwan le gardait sous sa tutelle et gouvernait sur lui."
