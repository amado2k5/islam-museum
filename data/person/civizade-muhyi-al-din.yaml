id: person/civizade-muhyi-al-din
class: person
label:
  ar: "جوي زاده محيي الدين"
  en: "Civizade Muhyi al-Din Mehmed"
  es: "Civizade Muhyi al-Din Mehmed"
  fr: "Civizade Muhyi al-Din Mehmed"
  ur: "شہری زادے محی الدین محمد"
roles: [scholar, qadi]
gender: male
summary:
  ar: "محمد بن إلياس الحنفي الرومي، محيي الدين، المعروف بجوي زاده، قاض عثماني ولي القضاء بمصر ثم قضاء العساكر الأناضولية ثم الإفتاء بالقسطنطينية، فعزله السلطان بعد إنكاره بعض أقوال ابن العربي، وأعيد قاضيا لعساكر روم إيلي ومات فيها، سنة 954 هـ الموافقة 1547 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 40}."
  en: "Muhammad ibn Ilyas al-Hanafi al-Rumi, Muhyi al-Din, known as Civizade, an Ottoman judge who served in Egypt, as judge of the Anatolian armies and as mufti at Constantinople, was removed from the iftā' office after objecting to some statements of Ibn al-Arabi, was restored as judge of the Rumelian armies and died in that post in 954 AH (1547 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 40}."
  es: "Muhammad ibn Ilyas al-Hanafi al-Rumi, Muhyi al-Din, conocido como Civizade, un juez otomano que sirvió en Egipto, como juez de los ejércitos de Anatolia y como muftí en Constantinopla, fue destituido del cargo de iftā' después de objetar algunas declaraciones de Ibn al-Arabi, fue restituido como juez de los ejércitos de Rumelia y murió en ese cargo en 954 AH (1547 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 40}."
  fr: "Muhammad ibn Ilyas al-Hanafi al-Rumi, Muhyi al-Din, connu sous le nom de Civizade, un juge ottoman qui a servi en Égypte, comme juge des armées anatoliennes et comme mufti à Constantinople, a été démis de ses fonctions d'iftā' après avoir contesté certaines déclarations d'Ibn al-Arabi, a été rétabli comme juge des armées rouméliennes et est mort à ce poste en 954 AH (1547 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 40}."
  ur: "محمد بن الیاس الحنفی الرومی، محی الدین، جسے سولی زادے کے نام سے جانا جاتا ہے، ایک عثمانی جج جس نے مصر میں اناطولیہ کی فوجوں کے جج اور قسطنطنیہ کے مفتی کے طور پر خدمات انجام دیں، کو ابن العربی کے بعض بیانات پر اعتراض کرنے کے بعد افطار کے دفتر سے ہٹا دیا گیا تھا اور رومی 59 میں اس عہدے پر بحال کر دیا گیا تھا۔ ہجری ⁦(1547 عیسوی)⁩ {حوالہ:عالم-زرقلی-در-العلم-2002 جلد۔ 6ص۔ 40}۔"
  tr: "Muhammed bin İlyas el-Hanafi el-Rumi, Muhyiddin, Joy Zadeh olarak bilinir, önce Mısır'da yargıçlık yapmış, ardından Anadolu askerlerinin yargıcı olarak görev yapmış ve ardından İstanbul'da fetvalar çıkarmıştır. Sultan, İbn el-Arabi'nin bazı açıklamalarını reddettikten sonra onu görevden aldı ve Um-Eli ordusunun yargıcı olarak yeniden göreve getirildi; 954 M.S. {cite:alam-zirikli-dar-al-ilm-2002 cilt 6, s. 40}) orada öldü."
  id: "Muhammad ibn Ilyas al-Hanafi al-Rumi, Muhyiddin, yang dikenal sebagai Joy Zadeh, adalah seorang hakim Ottoman yang bertugas sebagai hakim di Mesir, kemudian sebagai hakim tentara Anatolia, dan kemudian mengeluarkan fatwa di Konstantinopel. Sultan memecatnya setelah menolak beberapa pernyataan Ibn al-Arabi, dan ia diangkat kembali sebagai hakim tentara Um-Eli dan meninggal di sana pada tahun 954 H (1547 M {cite:alam-zirikli-dar-al-ilm-2002 vol. 6, hlm. 40}."
