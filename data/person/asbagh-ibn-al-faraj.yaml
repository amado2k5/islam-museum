summary:
  ar: "أبو عبد الله أصبغ بن الفرج بن سعيد بن نافع، الفقيه المالكي المصري؛ قال عبد الملك بن الماجشون في حقه: ما أخرجت مصر مثل أصبغ، قيل له لولا ابن القاسم قال ولا ابن القاسم؛ وكان كاتب ابن وهب وأحد رواته {cite:wafayat-ayan}."
  en: "Asbagh b. al-Faraj — the Maliki of Egypt whom Abd al-Malik b. al-Majishun ranked even with Ibn al-Qasim; katib and rawi of Ibn Wahb {cite:wafayat-ayan}."
  es: "Asbagh b. al-Faraj — el Maliki de Egipto a quien Abd al-Malik b. al-Majishun estaba a la altura de Ibn al-Qasim; katib y rawi de Ibn Wahb {cita:wafayat-ayan}."
  fr: "Asbagh b. al-Faraj — le Maliki d'Égypte dont Abd al-Malik b. al-Majishun se classait à égalité avec Ibn al-Qasim; katib et rawi d'Ibn Wahb {cite: wafayat-ayan}."
  ur: "اصباغ ب۔ الفراج - مصر کا مالکی جسے عبد الملک بن۔ المجشن ابن القاسم کے ساتھ بھی درجہ بندی کرتا ہے۔ ابن وہب کے کاتب و راوی"
  tr: "Mısır'ın Maliki hukukçusu Ebu Abdullah Asbag ibn al-Faraj ibn Sa'id ibn Nafi'; Abd al-Malik ibn al-Majishun onun hakkında şöyle demiştir: Mısır Asbagh gibi bir şey üretmedi. Ona şöyle denir: İbn al-Qasim olmasaydı, 'Ne de İbn al-Kasim olmazdı.' O, İbn Vahb'in katibi ve rivayetçilerinden biriydi {atıf:wafayat-ayan}."
  id: "Abu Abdullah Asbagh ibn al-Faraj ibn Sa'id ibn Nafi', ahli hukum Maliki dari Mesir; Abd al-Malik ibn al-Majishun berkata tentang dirinya: Mesir tidak pernah menghasilkan sesuatu seperti Asbagh. Dikatakan kepadanya: Jika bukan karena Ibn al-Qasim, ia berkata, 'Bukan Ibn al-Qasim.' Ia adalah juru tulis Ibn Wahb dan salah satu naratornya {cite:wafayat-ayan}."
