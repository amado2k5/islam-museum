summary:
  ar: "عالم وشاعر إندونيسي ⁦(المولود 1944 في رمبانغ بجاوة الوسطى)⁩، المعروف بغوس موس؛ رئيس معهد روضة الطالبين في رمبانغ، والرئيس العام لنهضة العلماء 2014–2015 بعد أن كان رئيس شورياها، وأحد أبرز شعراء إندونيسيا المعاصرين وكتّابها."
  en: "An Indonesian scholar and poet (born 1944 in Rembang, Central Java), known as Gus Mus; head of the Raudlatut Thalibin pesantren in Rembang, Rais Aam (supreme leader) of Nahdlatul Ulama in 2014–2015 after serving as its Rais Syuriah, and one of Indonesia's best-known contemporary poets and essayists."
  ur: "احمد مصطفیٰ بصری ⁦(پیدائش 1944ء، رمبانگ، وسطی جاوا)⁩، جو گُس مُس کے نام سے مشہور ہیں، انڈونیشیائی عالم اور شاعر ہیں؛ رمبانگ کے مدرسہ روضۃ الطالبین کے سربراہ، 2014–2015ء میں نہضۃ العلماء کے رئیس عام، اور انڈونیشیا کے معروف ترین عصری شعرا اور مضمون نگاروں میں سے ایک۔"
  es: "Un erudito y poeta indonesio (nacido en 1944 en Rembang, Java Central), conocido como Gus Mus; director del pesantren Raudlatut Thalibin en Rembang, Rais Aam (líder supremo) de Nahdlatul Ulama en 2014-2015 después de haber sido su Rais Syuriah, y uno de los poetas y ensayistas contemporáneos más conocidos de Indonesia."
  fr: "Érudit et poète indonésien (né en 1944 à Rembang, Java central), connu sous le nom de Gus Mus; directeur du pesantren Raudlatut Thalibin à Rembang, Rais Aam (chef suprême) de Nahdlatul Ulama en 2014-2015 après avoir été son Rais Syuriah, et l'un des poètes et essayistes contemporains les plus connus d'Indonésie."
  tr: "Endonezyalı bir akademisyen ve şair (1944'te Rembang, Orta Java'da doğdu), Gus Mus olarak bilinir; Rembang'daki Rawdat al-Talibin Enstitüsü Başkanı ve Şurayya başkanlığından sonra 2014-2015 yılları arasında Nahdlatul Ulama Başkanı olan ve Endonezya'nın en önde gelen çağdaş şair ve yazarlarından biridir."
  id: "Seorang cendekiawan dan penyair Indonesia (lahir 1944 di Rembang, Jawa Tengah), dikenal sebagai Gus Mus; Presiden Institut Rawdat al-Talibin di Rembang, dan Presiden Nahdlatul Ulama 2014–2015 setelah menjabat sebagai kepala Syuraia, dan salah satu penyair dan penulis kontemporer Indonesia yang paling terkemuka."
