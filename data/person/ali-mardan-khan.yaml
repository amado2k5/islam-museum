summary:
  ar: "علي مردان خان (توفي 1657) قائد عسكري وإداري كردي من قبيلة الزيغ، حكم قندهار باسم الشاهات الصفويين ثم سلّم المدينة إلى الإمبراطور المغولي شاه جهان سنة 1638. كافأه المغول بأعلى رتب النبلاء ولقب «أمير الأمراء»، فحكم كشمير والبنجاب وكابل، وكان راعيًا كبيرًا للحدائق والقنوات والخانات، ومنها القناة التي غذّت شاليمار باغ في لاهور."
  en: "Ali Mardan Khan (died 1657) was a Kurdish military leader and administrator of the Zig tribe who governed Kandahar for the Safavid shahs before surrendering the city to the Mughal emperor Shah Jahan in 1638. Rewarded with the highest rank of the Mughal nobility and the title Amir al-Umara, he governed Kashmir, the Punjab and Kabul, and was a major patron of gardens, canals and caravanserais, including the canal that fed Lahore's Shalimar Bagh."
  ur: "علی مردان خان (وفات 1657ء) زیگ قبیلے کے کرد فوجی قائد اور منتظم تھے، جنھوں نے صفوی شاہوں کی طرف سے قندھار کی حکومت کی، پھر 1638ء میں شہر مغل شہنشاہ شاہ جہاں کے حوالے کر دیا۔ مغلوں نے انھیں امرا کی بلند ترین رتبہ اور «امیر الامرا» کا خطاب دیا؛ انھوں نے کشمیر، پنجاب اور کابل کی حکومت کی، اور باغات، نہروں اور کارواں سرایوں کے بڑے سرپرست رہے، جن میں لاہور کے شالیمار باغ کو پانی پہنچانے والی نہر بھی شامل ہے۔"

