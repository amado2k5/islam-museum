summary:
  ar: "مغنية شعبية باكستانية (حوالي 1947–2013) وُلدت في راجستان وانتقلت أسرتها إلى كراتشي بعد التقسيم؛ اكتُشفت طفلةً وهي تغني عند مزار لال شهباز قلندر، فصارت بصوتها القوي من أشهر أصوات الغناء الشعبي في باكستان والهند بأغانٍ مثل «لال ميري» و«لمبي جدائي»، ونالت ستارة الامتياز (2008)."
  en: "Pakistani folk singer (c. 1947–2013) born in Rajasthan, whose family moved to Karachi after Partition; discovered as a child singing at the shrine of Lal Shahbaz Qalandar, she became one of the most popular folk voices in Pakistan and India with songs such as Laal Meri and Lambi Judai, and received the Sitara-i-Imtiaz (2008) and the Pride of Performance (1982)."
  ur: "پاکستانی لوک گلوکارہ (تقریباً 1947ء–2013ء) جو راجستھان میں پیدا ہوئیں اور جن کا خاندان تقسیم کے بعد کراچی آ گیا؛ لعل شہباز قلندر کے مزار پر گاتے ہوئے دریافت ہوئیں اور «لال میری» اور «لمبی جدائی» جیسے گیتوں سے پاکستان اور بھارت کی مقبول ترین لوک آوازوں میں شمار ہوئیں؛ انھیں ستارۂ امتیاز (2008ء) سے نوازا گیا۔"
