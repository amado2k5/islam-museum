summary:
  ar: "رافي بيلاي (وُلد في 2 أيلول 1953 في تشافارا بولاية كيرالا)، رجل أعمال وملياردير هندي، مؤسس مجموعة آر بي ورئيسها، التي تعد شركة ناصر س. الهاجري التابعة لها من أكبر شركات الإنشاءات الصناعية في الخليج. بدأ بصندوق ادخار في كولام، وانتقل إلى السعودية سنة 1978، وبنى مجموعة توظف أكثر من 70,000 شخص في الإنشاءات والضيافة والرعاية الصحية والتجزئة. نال وسام برافاسي بهاراتيا سامان سنة 2008 ووسام بادما شري سنة 2010."
  en: "Ravi Pillai (born 2 September 1953 at Chavara, Kerala) is an Indian billionaire businessman, founder and chairman of the RP Group, whose flagship Nasser S. Al Hajri Corporation is one of the Gulf's largest industrial construction contractors. He began with a chit fund in Kollam, moved to Saudi Arabia in 1978, and built a group employing over 70,000 people across construction, hospitality, healthcare and retail. He received the Pravasi Bharatiya Samman in 2008 and the Padma Shri in 2010."
  ur: "روی پلئی (پیدائش 2 ستمبر 1953، چاورا، کیرالا) بھارتی ارب پتی تاجر اور آر پی گروپ کے بانی و چیئرمین ہیں، جس کی سرکردہ کمپنی ناصر ایس الہاجری کارپوریشن خلیج کی صنعتی تعمیرات کی سب سے بڑی کمپنیوں میں سے ہے۔ انھوں نے کولم میں چٹ فنڈ سے آغاز کیا، 1978 میں سعودی عرب چلے گئے اور ایک ایسا گروپ کھڑا کیا جو تعمیرات، مہمان نوازی، صحت کی دیکھ بھال اور خوردہ فروشی میں 70,000 سے زیادہ افراد کو ملازمت دیتا ہے۔ انھیں 2008 میں پرواسی بھارتیا سمان اور 2010 میں پدم شری ملا۔"

