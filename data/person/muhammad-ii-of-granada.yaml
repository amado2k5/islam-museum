summary:
  ar: "محمد الثاني الفقيه ⁦(633 هـ / 1235 أو 1236 – 8 أبريل 1302)⁩، ثاني أمراء بني نصر في غرناطة، ابن مؤسس الدولة محمد الأول وخليفته. ثبتت في عهده حدود الإمارة النصرية وسط ضغط قشتالة والمغرب المريني، فعقد التحالفات ونازل الطرفين بالتناوب، وبنى ورعى العلماء حتى لُقّب بالفقيه لورعه وتدينه واشتغاله بالفقه. توفي سنة 701 هـ، وقيل إن ابنه محمد الثالث سمّه، وهي تهمة لم تثبت."
  en: "Muhammad II al-Faqih (633 AH / 1235 or 1236 - 8 April 1302) was the second Nasrid emir of Granada, son and successor of the dynasty's founder Muhammad I. His reign fixed the frontiers of the Nasrid emirate under pressure from Castile and Marinid Morocco, alternating war and alliance with both; he was a builder and a patron of scholars, and his epithet al-Faqih ('the jurist') is explained by his piety and religiosity and by his reputation as a canon lawyer. He died in 701 AH; the report that his son Muhammad III poisoned him is an allegation the texts do not confirm."
  ur: "محمد دوم الفقیہ ⁦(633ھ / 1235ء یا 1236ء – 8 اپریل 1302ء)⁩ غرناطہ کے دوسرے نصری امیر تھے، بانیٔ دولت محمد اول کے بیٹے اور جانشین۔ ان کے عہد میں قشتالہ اور مرینی مراکش کے دباؤ کے درمیان امارت کی سرحدیں مستحکم ہوئیں؛ وہ علما کے سرپرست تھے اور ورع و تدین کی وجہ سے «الفقیہ» کہلائے۔ وفات 701ھ میں ہوئی؛ یہ الزام کہ ان کے بیٹے محمد سوم نے انھیں زہر دیا، ثابت نہیں۔"

