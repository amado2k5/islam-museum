summary:
  ar: "لغوي ومعجمي وكاتب ساخر إيراني (1879–1956)؛ مؤلف «لغت‌نامه» أكبر معاجم الفارسية، و«امثال و حکم»، وصاحب زاوية «چرند و پرند» الساخرة في صحيفة «صور اسرافیل» زمن الثورة الدستورية، وكان نائبًا في المجلس وأستاذًا في جامعة طهران."
  en: "Iranian lexicographer, linguist and satirical writer (1879-1956); author of the Loghat-nameh (Dehkhoda Dictionary), the largest Persian dictionary, of Amsal o Hekam, and of the Charand-o-Parand satirical columns in the constitutional-era newspaper Sur-e Esrafil; also a Majlis deputy and Tehran University teacher."
