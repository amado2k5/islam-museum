label: { ar: "زرادشت بن أسبيمان", en: "Zardusht (Zoroaster)" }
summary:
  ar: "صاحب ملة المجوس، اتخذ بعد ملوك الفرس الأولى بيوت النيران وكان مما اتخذ بيتاً بمدينة نيسابور من بلاد خراسان {cite:muruj-al-dhahab p. 548}. وبيتاً آخر بمدينة نسا البيضاء من أرض فارس، وأمر يستاسف الملك أن يطلب ناراً كان يعظمها جم الملك فوجدت بخوارزم فنقلها يستاسف إلى دارابجرد وكورها بهذا البيت، وهي تسمى سنة اثنتين وثلاثين وثلاثمائة آزرجوي أي نار النهر وتعظمها المجوس ما لا تعظم غيرها، وقيل إن كيخسرو لما غزا الترك مرّ على تلك النار بخوارزم فعظمها وسجد لها وقيل أنوشروان نقلها إلى الكاريان، فلما ظهر الإسلام تركوا بعضها بالكاريان ونقلوا بعضاً إلى نسا البيضاء لتبقى إحداهما إن طفئت الأخرى {cite:muruj-al-dhahab p. 550}"
  en: "Founder-figure of the Magian creed — builder of the first fire temples after the early Persian kings, including the Nishapur house {cite:muruj-al-dhahab p. 548}."
