label: { ar: "زرادشت بن أسبيمان", en: "Zardusht (Zoroaster)", es: "Zardusht (Zoroaster)", fr: "Zardusht (Zoroaster)", ur: "زردشت ⁦(زروسٹر)⁩" }
summary:
  ar: "صاحب ملة المجوس، اتخذ بعد ملوك الفرس الأولى بيوت النيران وكان مما اتخذ بيتاً بمدينة نيسابور من بلاد خراسان {cite:muruj-al-dhahab p. 548}. وبيتاً آخر بمدينة نسا البيضاء من أرض فارس، وأمر يستاسف الملك أن يطلب ناراً كان يعظمها جم الملك فوجدت بخوارزم فنقلها يستاسف إلى دارابجرد وكورها بهذا البيت، وهي تسمى سنة اثنتين وثلاثين وثلاثمائة آزرجوي أي نار النهر وتعظمها المجوس ما لا تعظم غيرها، وقيل إن كيخسرو لما غزا الترك مرّ على تلك النار بخوارزم فعظمها وسجد لها وقيل أنوشروان نقلها إلى الكاريان، فلما ظهر الإسلام تركوا بعضها بالكاريان ونقلوا بعضاً إلى نسا البيضاء لتبقى إحداهما إن طفئت الأخرى {cite:muruj-al-dhahab p. 550}، وعنده وعند جاماسب العالم تحذير ملوك فارس من فعلة الإسكندر فنسخت الكتب وأحرزت بناحية الهند والصين على رواية أبي سهل بن نوبخت {cite:fihrist-ibn-al-nadim p. 333}"
  en: "Founder-figure of the Magian creed — builder of the first fire temples after the early Persian kings, including the Nishapur house {cite:muruj-al-dhahab p. 548}."
  es: "Figura fundadora del credo mago: constructor de los primeros templos del fuego después de los primeros reyes persas, incluida la casa de Nishapur {cite:muruj-al-dhahab p. 548}."
  fr: "Figure fondatrice du credo des Mages — constructeur des premiers temples du feu après les premiers rois perses, y compris la maison de Nishapur {cite:muruj-al-dhahab p. 548}."
  ur: "مجوسی عقیدے کی بانی شخصیت - ابتدائی فارسی بادشاہوں کے بعد پہلے آتش گیر مندروں کا معمار، بشمول نیشاپور گھر {حوالہ: مروج الذہاب صفحہ۔ 548}۔"
  tr: "Magi mezhebinin kurucusu, erken Pers krallarından sonra ateş evlerini kurdu ve Horasan topraklarındaki Nişapur şehrinde bir ev inşa edenler arasındaydı {atıf:muruj-al-dhahab, s. 548}. Ve Pers diyarındaki Nisa el-Beyda şehrinde başka bir ev vardı. Kral Yatsasif, kralın büyük onurlandırdığı bir ateş istemesini emretti. Bu ateş Harezm'de bulundu, bu yüzden Yatsasif ateşi Darabgerd'e ve evlerini bu eve taşıdı. Ateşe Azarjui denirdi, yani nehrin ateşi anlamına gelir ve Magiler ona diğerlerinden daha çok saygı gösterirdi. Türkler işgal ettiğinde, Kaykhosrow'un Hagerezm'deki o ateşin yanından geçip ona saygı gösterdiği ve ona secde ettiği söylenir. Anuşirwan'ın ateşi Karyalılara taşıdığı söylenir. İslam ortaya çıktığında, bazıları Karyan'da kaldı, bazıları ise Nisa al-Bayda'ya taşındı ve onlardan biri bırakıldı Diğer {atıf:muruj-al-dhahab s. 550} söndürüldüyse ve o ile Jamasp al-Alam Pers krallarını İskender'in hareketleri konusunda uyardıysa, kitaplar Abu Sahl ibn Nawbakht'ın rivayetine göre Hindistan ve Çin bölgelerinde kopyalanıp korundu {cite:fihrist-ibn-al-nadim s. 333}"
  id: "Pendiri sekte Majus mendirikan rumah api setelah raja-raja Persia awal dan termasuk di antara mereka yang membangun rumah di kota Nishapur di tanah Khorasan {cite:muruj-al-dhahab, hlm. 548}. Dan rumah lain di kota Nisa al-Bayda di tanah Persia. Raja Yatsasif memerintahkannya untuk meminta api yang sangat dihormati oleh raja. Api itu ditemukan di Khwarezm, sehingga Yatsasif memindahkannya ke Darabgerd dan rumah-rumahnya di rumah ini. Api itu disebut Azarjui, yang berarti api sungai, dan orang Majus menghormatinya lebih dari yang lain. Konon ketika Turki menyerang, Kaykhosrow melewati api di Khwarezm, menghormatinya, dan sujud ke sana. Dikatakan bahwa Anushirwan memindahkannya ke Carian. Ketika Islam muncul, beberapa ditinggalkan di Carian dan beberapa dipindahkan ke Nisa al-Bayda, meninggalkan salah satu dari mereka Jika {cite:muruj-al-dhahab hlm. 550} lainnya dihapuskan, dan ia bersama Jamasp al-Alam memperingatkan raja-raja Persia tentang tindakan Alexander, maka buku-buku tersebut disalin dan disimpan di wilayah India dan Tiongkok sesuai dengan riwayat Abu Sahl ibn Nawbakht {cite:fihrist-ibn-al-nadim hlm. 333}"
