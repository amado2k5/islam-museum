summary:
  ar: "لاعبة كرة قدم نيجيرية، وُلدت في إيكورودو بلاغوس سنة 1994؛ مهاجمة الهلال السعودي ومنتخب نيجيريا، وفازت بجائزة أفضل لاعبة أفريقية ست مرات وهو رقم قياسي، وكانت أول أفريقية تسجل في نهائي دوري أبطال أوروبا للسيدات (2019) وأول أفريقية تفوز بالبطولة (2021) مع برشلونة، وأسست مؤسسة لدعم لاعبات كرة القدم الفتيات في أفريقيا."
  en: "Nigerian professional footballer, born in Ikorodu, Lagos, in 1994. A striker for Saudi club Al Hilal and the Nigeria national team, she has won African Women's Footballer of the Year a record six times, was the first African to score in a UEFA Women's Champions League final (2019) and the first African woman to win the competition (2021) with Barcelona, and founded a foundation supporting young women footballers in Africa."
  ur: "نائجیریا کی پیشہ ور فٹبالر، 1994 میں اکوروڈو، لاگوس میں پیدا ہوئیں؛ سعودی کلب الہلال اور نائجیریا کی قومی ٹیم کی اسٹرائیکر، انھوں نے ریکارڈ چھ بار افریقی خواتین فٹبالر آف دی ایئر کا اعزاز جیتا، وہ یوئیفا ویمنز چیمپئنز لیگ کے فائنل میں گول کرنے والی پہلی افریقی (2019) اور بارسلونا کے ساتھ یہ مقابلہ جیتنے والی پہلی افریقی خاتون (2021) بنیں، اور افریقہ میں نوجوان لڑکی فٹبالرز کی مدد کے لیے فاؤنڈیشن قائم کی۔"
