summary:
  ar: "لاعبة كرة قدم نيجيرية، وُلدت في إيكورودو بلاغوس سنة 1994؛ مهاجمة الهلال السعودي ومنتخب نيجيريا، وفازت بجائزة أفضل لاعبة أفريقية ست مرات وهو رقم قياسي، وكانت أول أفريقية تسجل في نهائي دوري أبطال أوروبا للسيدات (2019) وأول أفريقية تفوز بالبطولة (2021) مع برشلونة، وأسست مؤسسة لدعم لاعبات كرة القدم الفتيات في أفريقيا."
  en: "Nigerian professional footballer, born in Ikorodu, Lagos, in 1994. A striker for Saudi club Al Hilal and the Nigeria national team, she has won African Women's Footballer of the Year a record six times, was the first African to score in a UEFA Women's Champions League final (2019) and the first African woman to win the competition (2021) with Barcelona, and founded a foundation supporting young women footballers in Africa."
  ur: "نائجیریا کی پیشہ ور فٹبالر، 1994 میں اکوروڈو، لاگوس میں پیدا ہوئیں؛ سعودی کلب الہلال اور نائجیریا کی قومی ٹیم کی اسٹرائیکر، انھوں نے ریکارڈ چھ بار افریقی خواتین فٹبالر آف دی ایئر کا اعزاز جیتا، وہ یوئیفا ویمنز چیمپئنز لیگ کے فائنل میں گول کرنے والی پہلی افریقی (2019) اور بارسلونا کے ساتھ یہ مقابلہ جیتنے والی پہلی افریقی خاتون (2021) بنیں، اور افریقہ میں نوجوان لڑکی فٹبالرز کی مدد کے لیے فاؤنڈیشن قائم کی۔"
  es: "Futbolista profesional nigeriana, nacida en Ikorodu, Lagos, en 1994. Delantera del club saudí Al Hilal y de la selección nacional de Nigeria, ha ganado el premio a la Futbolista Africana del Año un récord de seis veces, fue la primera africana en marcar en una final de la Liga de Campeones Femenina de la UEFA (2019) y la primera mujer africana en ganar la competición (2021) con el Barcelona, y fundó una fundación que apoya a jóvenes futbolistas femeninas en África."
  fr: "Footballeuse professionnelle nigériane, née à Ikorodu, Lagos, en 1994. Attaquante du club saoudien Al Hilal et de l'équipe nationale du Nigeria, elle a remporté le titre de Joueuse africaine de l'année à six reprises, un record. Elle a été la première Africaine à marquer en finale de la Ligue des champions féminine de l'UEFA (2019) et la première Africaine à remporter la compétition (2021) avec Barcelone. Elle a également fondé une fondation soutenant les jeunes footballeuses en Afrique."
  tr: "1994 yılında Ikorodo Belagos'ta doğan Nijeryalı futbolcu; Suudi Arabistan'ın Al Hilal takımı ve Nijerya milli takımında forvet olarak oynadı; altı kez En İyi Afrikalı Oyuncu ödülünü kazanarak rekor kırdı, UEFA Kadınlar Şampiyonlar Ligi finalinde (2019) gol atan ilk Afrikalı ve Barcelona ile turnuvayı kazanan ilk Afrikalı (2021) oldu. Ayrıca Afrika'daki kadın futbolcuları desteklemek için bir organizasyon kurdu."
  id: "Seorang pemain sepak bola Nigeria, lahir di Ikorodo Belagos pada tahun 1994; penyerang untuk Al Hilal Arab Saudi dan tim nasional Nigeria, ia telah memenangkan penghargaan Pemain Afrika Terbaik sebanyak enam kali, sebuah rekor, menjadi orang Afrika pertama yang mencetak gol di final UEFA Women's Champions League (2019) dan Afrika pertama yang memenangkan turnamen tersebut (2021) bersama Barcelona. Ia juga mendirikan organisasi untuk mendukung pesepakbola wanita di Afrika."
