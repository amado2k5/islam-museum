summary:
  en: "Second caliph (634–644); under his rule the early community conquered Syria, Egypt and much of the Sasanian Empire. Remembered in Sunni tradition as al-Faruq, the model of just rule. ومن مناقبه في الصحيح القصر الذي رآه له النبي في الجنة فأخلى النظر إليه حياءً لغيرته {cite:sahih-al-bukhari 3680}، ولبن الرؤيا الذي أوله النبي بالعلم فناوله إياه {cite:sahih-al-bukhari 3681}. ويروي هو صعوده إلى مشربة النبي حين اعتزل أزواجه فرأى أثر الحصير في جنبه فبكى فقال له «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» {cite:sahih-al-bukhari 4913}. ورأى حلة سيراء عند باب المسجد فعرضها على النبي ليلبسها يوم الجمعة وللوفد فقال «إنما يلبسها من لا خلاق له في الآخرة» ثم أهداها إليه بعد فكساها أخاً له مشركاً بمكة {cite:sahih-al-bukhari 2612}."
  ar: "ثاني الخلفاء الراشدين (634–644م)؛ في عهده فتحت الجماعة الأولى الشام ومصر وجزءًا كبيرًا من الإمبراطورية الساسانية. يذكره التراث السني بالفاروق، مثال العدل في الحكم. وأمه حنتمة بنت هشام بن المغيرة المخزومية وكانت سوداء، وأول من سماه أمير المؤمنين عدي بن حاتم على رواية وأول من سلم عليه بها المغيرة بن شعبة وأول من دعاه بها على المنبر وكتبها إليه أبو موسى الأشعري فقال عمر إني لعبد الله وإني لعمر وإني لأمير المؤمنين، وكان يلبس الجبة الصوف المرقعة بالأديم ويحمل القربة على كتفه ورحله مشدودة بالليف واتبعه عماله في شيمه {cite:muruj-al-dhahab p. 601-602}. وفي الصحيح قال ابن مسعود «ما زلنا أعزة منذ أسلم عمر» {cite:sahih-al-bukhari 3863}، ويروي ابن عمر أن قريشاً اجتمعوا على باب داره حين أسلم يدعون «صبا عمر» فجاءهم العاص بن وائل السهمي في حلة حبرة فقال «لا سبيل إليه» فكرّوا {cite:sahih-al-bukhari 3864}، ويروي عمر في صحيح مسلم حديث جبريل: طلع رجل شديد بياض الثياب فسأل النبي عن الإسلام والإيمان والإحسان والساعة ثم قال في الجواب «هذا جبريل أتاكم يعلمكم دينكم» {cite:sahih-muslim 8}، وعند مسلم قال له النبي «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim 2396}."
