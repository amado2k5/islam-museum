summary:
  en: "Second caliph (634–644); under his rule the early community conquered Syria, Egypt and much of the Sasanian Empire. Remembered in Sunni tradition as al-Faruq, the model of just rule. ومن مناقبه في الصحيح القصر الذي رآه له النبي في الجنة فأخلى النظر إليه حياءً لغيرته {cite:sahih-al-bukhari 3680}، ولبن الرؤيا الذي أوله النبي بالعلم فناوله إياه {cite:sahih-al-bukhari 3681}. ويروي هو صعوده إلى مشربة النبي حين اعتزل أزواجه فرأى أثر الحصير في جنبه فبكى فقال له «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» {cite:sahih-al-bukhari 4913}. ورأى حلة سيراء عند باب المسجد فعرضها على النبي ليلبسها يوم الجمعة وللوفد فقال «إنما يلبسها من لا خلاق له في الآخرة» ثم أهداها إليه بعد فكساها أخاً له مشركاً بمكة {cite:sahih-al-bukhari 2612}. Usd al-Ghaba's entry on him (no. 3831) calls him one of Quraysh's noblest who bore their envoy in the Jahiliyya, once hostile to the Muslims until he heard Surat al-Haqqah recited in Dar al-Arqam and Islam settled in his heart {cite:usd-ghaba p.897}. Abu Nu'aym's Ma'rifat entry on his lineage traces him through al-Zuhri to Mudar ibn Nizar ibn Ma'add ibn Adnan, and reports that the people of Najran saw a black birthmark on his thigh when it was bared as he rode, saying 'this is the one we find in our book that will drive us from our land' {cite:marifat-sahaba-abu-nuaym p.38} {cite:marifat-sahaba-abu-nuaym p.45}. The Encyclopaedia of Islam, 2nd edition, describes him as stern, strong-willed and devoted to Muhammad, the Qur'an and Islam, reports that Sunni tradition reveres him as the paradigmatic just ruler while Shi'i tradition has never concealed its antipathy to him, and records modern disagreement over whether the early elite was united or divided."
  ar: "ثاني الخلفاء الراشدين ⁦(634–644م)⁩؛ في عهده فتحت الجماعة الأولى الشام ومصر وجزءًا كبيرًا من الإمبراطورية الساسانية. يذكره التراث السني بالفاروق، مثال العدل في الحكم. وأمه حنتمة بنت هشام بن المغيرة المخزومية وكانت سوداء، وأول من سماه أمير المؤمنين عدي بن حاتم على رواية وأول من سلم عليه بها المغيرة بن شعبة وأول من دعاه بها على المنبر وكتبها إليه أبو موسى الأشعري فقال عمر إني لعبد الله وإني لعمر وإني لأمير المؤمنين، وكان يلبس الجبة الصوف المرقعة بالأديم ويحمل القربة على كتفه ورحله مشدودة بالليف واتبعه عماله في شيمه {cite:muruj-al-dhahab p. 601-602}. وفي الصحيح قال ابن مسعود «ما زلنا أعزة منذ أسلم عمر» {cite:sahih-al-bukhari 3863}، ويروي ابن عمر أن قريشاً اجتمعوا على باب داره حين أسلم يدعون «صبا عمر» فجاءهم العاص بن وائل السهمي في حلة حبرة فقال «لا سبيل إليه» فكرّوا {cite:sahih-al-bukhari 3864}، ويروي عمر في صحيح مسلم حديث جبريل: طلع رجل شديد بياض الثياب فسأل النبي عن الإسلام والإيمان والإحسان والساعة ثم قال في الجواب «هذا جبريل أتاكم يعلمكم دينكم» {cite:sahih-muslim 8}، وعند مسلم قال له النبي «والذي نفسي بيده ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك» {cite:sahih-muslim 2396}. ويذكر أسد الغابة في ترجمته رقم ٣٨٣١ أنه كان من أشرف قريش وإليه كانت السفارة في الجاهلية، وكان شديداً على المسلمين وكاهناً حتى سمع سورة الحاقة في دار الأرقم فوقع الإسلام في قلبه {cite:usd-ghaba p.897}، وتذكر «معرفة الصحابة» لأبي نعيم في ترجمة نسبه أن الزهري أخرجه إلى مضر بن نزار بن معد بن عدنان، وأن أهل نجران رأوا على فخذه شامة سوداء حين انكشف راكباً فرسه فقالوا هذا الذي نجده في كتابنا أنه يخرجنا من أرضنا {cite:marifat-sahaba-abu-nuaym p.38} {cite:marifat-sahaba-abu-nuaym p.45}."
  ur: "دوسرے خلیفہ؛ بریٹانیکا انہیں صراحت سے مسلمان کہتا اور ہجری سن کے انتظامی اختیار کو ان سے منسوب کرتا ہے؛ قمری مہینوں کی ایجاد کا دعویٰ نہیں {cite:britannica-umar-i}۔ دائرۃ المعارف اسلامیہ، دوسرا ایڈیشن، انہیں سخت مزاج، مضبوط ارادے والا اور محمد، قرآن اور اسلام کے لیے وقف بتاتی ہے، کہتی ہے کہ سنی روایت انہیں مثالی عادل حکمران مانتی ہے جبکہ شیعی روایت نے ان سے ناپسندیدگی کبھی نہیں چھپائی، اور جدید اختلاف بیان کرتی ہے کہ ابتدائی اشرافیہ متحد تھی یا منقسم۔"
  es: "Segundo califa (634-644); bajo su gobierno, la comunidad primitiva conquistó Siria, Egipto y gran parte del Imperio sasánida. En la tradición sunita se le recuerda como al-Faruq, el modelo de gobierno justo. Entre sus virtudes, según consta en Sahih al-Bukhari, se encuentra el palacio que el Profeta vio en el Paraíso, y que, por modestia y celos, se abstuvo de mirar. Otra virtud es la leche del sueño, que el Profeta interpretó como conocimiento y se la dio. También relata su ascenso a la habitación superior del Profeta cuando este se había retirado de sus esposas. Vio la marca de la estera en el costado del Profeta y lloró. El Profeta le dijo: \"¿No te contentas con que ellos tengan este mundo y nosotros el Más Allá?\". Vio una prenda de seda en la puerta de la mezquita y se la ofreció al Profeta para que la usara el viernes y a la delegación. El Profeta dijo: \"Solo la usarán quienes no tengan parte en el Más Allá\". Luego se lo dio como regalo, y el Profeta se lo dio a un hermano politeísta suyo en La Meca. {cita:sahih-al-bukhari 2612}. La entrada de Usd al-Ghaba sobre él (n.º 3831) lo llama uno de los más nobles de los Quraysh que portaron a su enviado en la época preislámica, un hombre que fue hostil a los musulmanes hasta que escuchó la Sura al-Haqqah recitada en Dar al-Arqam y el Islam se arraigó en su corazón. {cita:usd-ghaba p.897}. La entrada de Ma'rifat de Abu Nu'aym sobre su linaje lo rastrea a través de al-Zuhri hasta Mudar ibn Nizar ibn Ma'add ibn Adnan, y relata que la gente de Najran vio una marca de nacimiento negra en su muslo cuando lo descubrió mientras cabalgaba, diciendo 'este es el que encontramos en nuestro libro que nos expulsará de nuestra tierra' {cite:marifat-sahaba-abu-nuaym p.38} {cite:marifat-sahaba-abu-nuaym p.45}. La Enciclopedia del Islam, 2.ª edición, lo describe como severo, de voluntad fuerte y devoto de Mahoma, el Corán y el Islam, informa que la tradición sunita lo venera como el gobernante justo paradigmático, mientras que la tradición chiíta nunca ha ocultado su antipatía hacia él, y los registros modernos discrepan sobre si la élite inicial estaba unida o dividida."
  fr: "Deuxième calife (634-644); sous son règne, la première communauté conquit la Syrie, l'Égypte et une grande partie de l'empire sassanide. Il est resté dans la tradition sunnite sous le nom d'al-Faruq, modèle de justice. Parmi ses vertus, rapportées dans le Sahih al-Bukhari, figure le palais que le Prophète lui aperçut au Paradis, mais que le Prophète, par pudeur et jalousie, s'abstint de regarder. Une autre est le lait du rêve, que le Prophète interpréta comme une connaissance, et qu'il lui offrit. Il raconte également son ascension jusqu'à la chambre haute du Prophète, alors que celui-ci s'était retiré auprès de ses épouses. Il vit la marque du tapis sur le côté du Prophète et pleura. Le Prophète lui dit: « N'es-tu pas satisfait qu'elles possèdent ce monde et que nous possédions l'au-delà ? » Il vit un vêtement de soie à la porte de la mosquée et l'offrit au Prophète pour qu'il le porte le vendredi, ainsi qu'à la délégation. Le Prophète dit: « Seuls ceux qui n'ont aucune part à l'au-delà le portent. » Il le lui offrit ensuite en cadeau, et le Prophète le donna à son frère polythéiste à La Mecque. (Source: Sahih al-Bukhari, p. 2612). Usd al-Ghaba, dans sa notice biographique à son sujet (n° 3831), le décrit comme l'un des plus nobles Qurayshites, ayant porté leur émissaire durant la Jahiliyya. Autrefois hostile aux musulmans, il se convertit à l'islam après avoir entendu la sourate Al-Haqqah récitée à Dar al-Arqam. (Source: Usd al-Ghaba, p. 897). L'entrée consacrée à la lignée d'Abu Nu'aym dans Ma'rifat le retrace par al-Zuhri jusqu'à Mudar ibn Nizar ibn Ma'add ibn Adnan. Elle rapporte que les habitants de Najran aperçurent une tache de naissance noire sur sa cuisse lorsqu'il la dévoilait à cheval, et dirent: « Voilà celui que nous trouvons dans notre livre et qui nous chassera de notre terre » (voir: marifat-sahaba-abu-nuaym p. 38 et p. 45). L'Encyclopédie de l'Islam, 2e édition, le décrit comme sévère, déterminé et dévoué à Mahomet, au Coran et à l'islam. Elle indique que la tradition sunnite le vénère comme le modèle du souverain juste, tandis que la tradition chiite n'a jamais caché son hostilité à son égard. Les sources modernes divergent quant à l'unité ou la division de l'élite de l'époque."
  tr: "Doğru Rehberli Halifelerin ikincisi (634–644 MS); onun saltanatı sırasında Birinci Grup, Levant, Mısır ve Sasani İmparatorluğu'nun büyük bir bölümünü fethetti. Sünni kökenleri onu adaletin bir örneği olan Al-Faruq olarak anar. Annesi, siyahi olan Hantamah bint Hisham ibn al-Mughira al-Makhzumiyya'dır. Ona ilk kez 'Amir al-Mu'minin' adını veren kişi 'Uday ibn Hatim'di. Bir rivayete ve onu ilk selamlayan kişi oldu. Onu ilk selamlayan el-Muğira bin Şu'bah oldu. Ebu Musa el-Eş'eri ona şöyle yazdı: 'Ben Abdullah'danım, ben Ömer için ve Müminlerin Komutanı'ndan yanayım.' Deri yamalı yün bir cübbe giymişti, eyerini omzunda taşıyordu ve eyeri lifle sarılmış bir lifle bağlanmıştı. İşçileri onun görgü kurallarını takip etti {alıntı:) Muruj-al-Dhahab, s. 601-602}. Gerçek rivayette İbn Mes'ud, \"Ömer İslam'ı kabul ettiğinden beri onurlandırıldık\" demiştir. Sahih-al-Buhari 3863}. İbn Ömer, Kureyşlerin İslam'ı kabul ettiğinde evinin kapısında toplandıklarını ve onlara \"Ömer'in Sabası\" dediklerini rivayet eder. El-As ibn Va'il-Sahmi beyaz bir pelerinle yanlarına geldi ve dedi ki, \"Hiçbir yolu yok.\" Düşünün {atı:sahih-al-bukhari 3864}. Ömer Sahih Müslüm'de Cebrail'in hadisini rivayet eder: Çok beyaz giysili bir adam ortaya çıktı ve Peygamber'e İslam, iman, iyilik ve Saat hakkında sorular sordu, ardından \"Bu, sana dinini öğretmek için gelen Cebrail'dir\" dedi. Müslüman'a göre Peygamber ona şöyle dedi: \"Ruhumun elinde olan Allah'la Şeytan seni yolcu olarak hiç görmedi, ama bir yola çıkmadı, seni görmedi.\" {atıp:sahih-müslim 2396}. Asad al-Ghabah, biyografisi numarası 3831'de en soylu Qureyş'ten olduğunu ve İslam öncesi dönemde ona bir görev yaptığını belirtir. Müslümanlara karşı katıydı ve Dar al-Arqam'da Heqah Suresini duyana kadar rahip olarak hizmet etti; İslam kalbine yerleşti {cite:usd-ghaba s.897}. Abu Nu'eym'in biyografisindeki 'Ma'rifat al-Sahabah' adlı eserinde, al-Zuhri bunu Mudar ibn Nizar ibn Ma'ad ibn Adnan'a anlattığı ve Necran halkının at üzerinde soyunurken uyluğunda siyah bir benek gördüğünü ve 'Kitabımızda bulduğumuz şey bizi topraklarımızdan kovan şeydir' dediğini belirtir."
  id: "Khalifah Yang Dibimbing dengan Tepat kedua (634–644 M); selama pemerintahannya, Kelompok Pertama menaklukkan Levant, Mesir, dan sebagian besar Kekaisaran Sasanian. Warisan Sunni menyebutnya sebagai Al-Faruq, contoh keadilan dalam pemerintahan. Ibunya adalah Hantamah bint Hisham ibn al-Mughira al-Makhzumiyya, yang berkulit hitam. Orang pertama yang memanggilnya 'Amir al-Mu'minin adalah 'Uday ibn Hatim menurut sebuah narasi, dan yang pertama menyambutnya dengan narasi itu. Orang pertama yang menyambutnya adalah al-Mughira ibn Shu'bah. Abu Musa al-Ash'ari menulis kepadanya, berkata: 'Aku mendukung Abdullah, aku mendukung Umar, dan aku untuk Panglima Orang Beriman.' Ia mengenakan jubah wol yang ditambal kulit, membawa pelana di bahunya, dan pelananya diikat dengan serat yang dibalut serat. Para pekerjanya mengikuti sopan santunya {cite:Muruj-al-Dhahab, hlm. 601-602}. Dalam riwayat otentik, Ibn Mas'ud berkata, \"Kami tetap dihormati sejak Umar memeluk Islam\" {cite:sahih-al-bukhari 3863}. Ibn Umar menceritakan bahwa Quraisy berkumpul di pintu rumahnya ketika ia memeluk Islam, menyebut mereka \"Saba Umar.\" Al-As ibn Wa'il al-Sahmi datang kepada mereka dengan jubah putih dan berkata, \"Tidak ada jalan ke sana.\" Pikirkan {cite:sahih-al-bukhari 3864}. Umar menceritakan dalam Sahih Muslim hadits Gabril: Seorang pria berpakaian sangat putih muncul dan bertanya kepada Nabi tentang Islam, iman, kebaikan, dan Jam, lalu menjawab, \"Ini adalah Gabriel, yang datang untuk mengajarkan agamamu\" {cite:sahih-muslim 8}. Dan menurut Muslim, Nabi berkata kepadanya: \"Demi Dia di tangan Yang jiwa-Ku ada, Setan tidak pernah bertemu denganmu sebagai pengembara, tetapi dia tidak berjalan di jalan, tetapi dia tidak melihatmu.\" {cite:sahih-muslim 2396}. Asad al-Ghabah menyebutkan dalam biografinya nomor 3831 bahwa ia berasal dari Quraisy yang paling mulia dan memiliki misi kepadanya pada era pra-Islam. Ia tegas kepada umat Muslim dan melayani sebagai imam sampai ia mendengar Surah Al-Haqqah di Dar al-Arqam, dan Islam menetap di hatinya {cite:usd-ghaba hlm.897}. 'Ma'rifat al-Sahabah' karya Abu Nu'aym dalam biografinya menyebutkan bahwa al-Zuhri menceritakannya kepada Mudar ibn Nizar ibn Ma'ad ibn Adnan, dan bahwa orang-orang Najran melihat tahi lalat hitam di pahanya saat ia melepas pakaian menunggang kuda dan berkata, 'Inilah yang kami temukan dalam kitab kami yang mengusir kami dari tanah kami' {cite:marifat-sahaba-abu-nuaym hlm.38} {cite:marifat-sahaba-abu-nuaym hlm.45}."
