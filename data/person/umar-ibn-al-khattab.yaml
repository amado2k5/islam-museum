perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition venerates Umar as the second rightly-guided caliph, al-Faruq: the conversion that strengthened the community, and the just ruler who founded the institutions of the early Islamic state.", ar: "تُجِلّ السنة عمرَ فاروقَها: الخليفة الراشد الثاني ومثال الحاكم العادل، وواضع مؤسسات الدولة الأولى." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: academic
    id: academic
    summary: { en: "Historians credit his caliphate with the conquests of Syria, Egypt and Iraq and with organizing the early state, while reading the idealized memory of his justice as partly a later construction.", ar: "يَرجع المؤرخون إليه في الفتوح والمؤسسات الأولى، ويقرؤون مثاليته المروية في العدل بوصفها جزءًا من بناء متأخر." }
    sources: [source/watt-1956-medina]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition is critical of Umar, above all for the Saqifa succession that set aside Ali, and for episodes in the relationship with Fatima.", ar: "ينتقد التراث الإمامي عمر خصوصًا في خلافة السقيفة التي أقصت عليًّا، وفي أخبار ما وقع مع فاطمة." }
    sources: [source/momen-1985]
