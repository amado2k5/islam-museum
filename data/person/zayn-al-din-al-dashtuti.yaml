summary:
  ar: "الشيخ زين الدين الدشطوطي — نسبة إلى دشطوط من قرى الصعيد؛ قال الشيخ عبد الرؤوف المناوي في طبقاته: هو المعروف بالكرامات المشهورة وخوارق الآيات والكشف العام والقبول التام عند الملوك فمن سواهم، وكان من ديّر وعمّر جوامع مصر وقراها وأوقف الناس عليه أوقافاً كثيرة، وكان صاحياً حافياً مكشوف الرأس عليه جبة حرير، وكان لقبه بين الأولياء «صاحب مصر»؛ وقال في بعض المواعظ إذا استحكمت هيبة الله في قلب عبد أخذ عن إدراك التكليف وقامت به حالته بينه وبين الحركة والصلاة وصار عليه كل بلا أهون من صلاة ركعتين؛ ووقف النيل أيام الوفاء ثلاثة أذرع فخاض في البحر وقال أطلع بإذن الله فطلع فوراً فاقتتل الناس عليه يتبركون به، وحج ماشياً حافياً فلما وصل باب السلام وضع خده على العتبة فما أفاق إلا بعد ثلاث، وكان قايتباي إذا زاره يمرغ وجهه على قدميه، وطلب من الله مقام الحضور بين يديه فتجلى له من حضرته أمر ذابت له الأعضاء؛ توفي سنة أربع وعشرين وتسعمائة وصُلي عليه غائباً بجامع بني أمية بدمشق يوم الجمعة ثاني عشر رمضان {cite:shadharat-dhahab p. 543-544}."
  en: "'Sahib Misr' — the Upper Egyptian mystic of the famous karamat whom Qaytbay venerated by rubbing his face on the mystic's feet; the Nile stood still three cubits at his command 'rise, by God's leave'; he walked barefoot on hajj and lay three days unconscious on the Bab al-Salam threshold; died 924, his absent funeral prayed at the Umayyad mosque {cite:shadharat-dhahab p. 543-544}."
  es: "'Sahib Misr', el místico del Alto Egipto del famoso karamat, a quien Qaytbay veneraba frotando su rostro en los pies del místico; el Nilo se detuvo tres codos a su orden de 'levántate, por el permiso de Dios'; caminó descalzo en el Hajj y permaneció tres días inconsciente en el umbral de Bab al-Salam; murió en 924, su funeral ausente fue rezado en la mezquita de los Omeyas {cita: shadharat-dhahab págs. 543-544}."
  fr: "« Sahib Misr » — le mystique de Haute-Égypte, célèbre pour ses karamat, que Qaytbay vénérait en frottant son visage sur les pieds du mystique; le Nil s'arrêta de trois coudées à son ordre « Lève-toi, par la permission de Dieu »; il marcha pieds nus lors du hajj et resta inconscient pendant trois jours sur le seuil de Bab al-Salam; il mourut en 924, ses funérailles en son absence furent célébrées à la mosquée des Omeyyades {cite: shadharat-dhahab p. 543-544}."
  ur: "'صاحب مصر' - مشہور کرامت کا بالائی مصری صوفی جس کی قطبی نے صوفی کے پیروں پر چہرہ رگڑ کر تعظیم کی تھی۔ اس کے حکم پر دریائے نیل تین ہاتھ کھڑا تھا 'خدا کے حکم سے اٹھو'۔ وہ حج پر ننگے پاؤں چلا اور باب السلام کی دہلیز پر تین دن تک بے ہوش پڑا رہا۔ وفات 924، ان کی غائبانہ نماز جنازہ اموی مسجد میں ادا کی گئی۔ 543-544}۔"
  tr: "Şeyh Zain al-Din al-Dashtuti — Yukarı Mısır'ın köylerinden biri olan Dashtut'tan adını alan Şeyh Abdul Rauf al-Manawi Tabaqat'ında şöyle demiştir: Ünlü mucizeler, mucizeler, genel vahiy ve krallar ile diğerleri tarafından tam kabulüyle tanınır. Mısır'daki manastır, camiler ve köylerden geliyordu ve insanlar ona birçok vafşet bağışladı. Uyanık, çıplak ayak, başı açık ve ipek bir cübbe giyerdi. Azizler arasında 'Sahib Misr' lakabı vardı; bazı vaazlarda, bir hizmetçinin kalbinde Allah'ın korkusu oluştuğunda sorumluluk aldı ve bunu yerine getirdi. Durumu hareket ile namaz arasındaydı ve namaz olmadan her şey iki rekah kadar kolay hale geldi; Nil sadakat günlerinde üç arşın ateş içinde durdu ve denize girip, 'İnşallah ortaya çıkacağım' dedi. Sonra hemen dışarı çıktı ve insanlar ona karşı bereket için mücadele etti. Hacı çıplak ayakla yürüyerek yaptı ve barış kapısına ulaştığında yanağını eşiğe koydu ve üç gün sonra uyandı. Qaitbay onu ziyaret ettiğinde, yüzünü ayaklarına sürter, Allah'tan önünde bulunmasını isterdi ve eriyen bir şey ona vahy oldu. 924 Hicri'nde öldü ve cenaze namazı Ramazan ayının on ikinci Cuma günü Şam'daki Emevi Camii'nde yokluğunda kılındı {cite:shadharat-dhahab, s. 543-544}."
  id: "Sheikh Zain al-Din al-Dashtuti — Dinamai menurut Dashtut, salah satu desa di Mesir Hulu; Sheikh Abdul Raouf al-Manawi berkata dalam Tabaqat-nya: Ia dikenal karena mukjizat, mukjizat, wahyu umum, dan penerimaan penuh oleh raja dan lainnya. Ia berasal dari biara, masjid, dan desa-desa di Mesir, dan orang-orang memberikan banyak anugerah untuknya. Ia waspada, bertelanjang kaki, dengan kepala terbuka, dan mengenakan jubah sutra. Di antara para wali, ia dijuluki 'Sahib Misr'; dan dalam beberapa khotbah, ketika rasa takut kepada Tuhan menguasai hati seorang hamba, ia mengambil tanggung jawab dan melaksanakannya. Kondisinya antara bergerak dan berdoa, dan segala sesuatu tanpa shalat menjadi lebih mudah daripada dua rak'ah; Sungai Nil berhenti selama hari-hari kesetiaan, tiga hasta api, dan dia masuk ke laut dan berkata, 'Aku akan muncul, insya Allah.' Kemudian dia segera keluar, dan orang-orang melawan melawannya mencari berkat. Dia melaksanakan Haji berjalan tanpa alas kaki, dan ketika dia sampai di gerbang kedamaian, dia meletakkan pipinya di ambang pintu dan tidak bangun sampai setelah tiga hari. Ketika Qaitbay mengunjunginya, dia menggosok wajahnya di atas kaki dan memohon kepada Tuhan agar hadir di hadapannya, dan sebuah hal yang telah meleleh terungkap kepadanya. Dia meninggal pada tahun 924 H, dan shalat pemakaman diadakan untuknya secara tidak hadir di Masjid Umayyah di Damaskus pada hari Jumat, tanggal dua belas Ramadan {cite:shadharat-dhahab, hlm. 543-544}."
