summary:
  ar: "الشيخ زين الدين الدشطوطي — نسبة إلى دشطوط من قرى الصعيد؛ قال الشيخ عبد الرؤوف المناوي في طبقاته: هو المعروف بالكرامات المشهورة وخوارق الآيات والكشف العام والقبول التام عند الملوك فمن سواهم، وكان من ديّر وعمّر جوامع مصر وقراها وأوقف الناس عليه أوقافاً كثيرة، وكان صاحياً حافياً مكشوف الرأس عليه جبة حرير، وكان لقبه بين الأولياء «صاحب مصر»؛ وقال في بعض المواعظ إذا استحكمت هيبة الله في قلب عبد أخذ عن إدراك التكليف وقامت به حالته بينه وبين الحركة والصلاة وصار عليه كل بلا أهون من صلاة ركعتين؛ ووقف النيل أيام الوفاء ثلاثة أذرع فخاض في البحر وقال أطلع بإذن الله فطلع فوراً فاقتتل الناس عليه يتبركون به، وحج ماشياً حافياً فلما وصل باب السلام وضع خده على العتبة فما أفاق إلا بعد ثلاث، وكان قايتباي إذا زاره يمرغ وجهه على قدميه، وطلب من الله مقام الحضور بين يديه فتجلى له من حضرته أمر ذابت له الأعضاء؛ توفي سنة أربع وعشرين وتسعمائة وصُلي عليه غائباً بجامع بني أمية بدمشق يوم الجمعة ثاني عشر رمضان {cite:shadharat-dhahab p. 543-544}."
  en: "'Sahib Misr' — the Upper Egyptian mystic of the famous karamat whom Qaytbay venerated by rubbing his face on the mystic's feet; the Nile stood still three cubits at his command 'rise, by God's leave'; he walked barefoot on hajj and lay three days unconscious on the Bab al-Salam threshold; died 924, his absent funeral prayed at the Umayyad mosque {cite:shadharat-dhahab p. 543-544}."
