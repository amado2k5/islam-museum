summary:
  ar: "سلطان المغرب من الأسرة العلوية ⁦(حكم 1873–1894)⁩؛ وُلد بفاس، وخلف أباه محمد الرابع، فحدّث الجيش والإدارة وقاد حملات سنوية لتوحيد البلاد، وحافظ على استقلال المغرب أمام الأطماع الأوروبية فانعقد في عهده مؤتمر مدريد 1880، وتوفي أثناء حملة بتادلة ودُفن بالرباط."
  en: "Sultan of Morocco of the Alawi dynasty (reigned 1873–1894). Born at Fez, he succeeded his father Muhammad IV, modernised the army and administration, campaigned yearly to hold the country together, and preserved Morocco's independence against European encroachment, the Madrid Conference of 1880 falling in his reign; he died on campaign in the Tadla region and was buried in Rabat."
  ur: "علوی سلسلے کے سلطانِ مراکش ⁦(دورِ حکومت 1873–1894)⁩؛ فاس میں پیدا ہوئے، والد محمد چہارم کے جانشین بنے، فوج و انتظامیہ کو جدید خطوط پر استوار کیا، ملک کو متحد رکھنے کے لیے سالانہ مہمات چلائیں، یورپی تجاوزات کے مقابل مراکش کی آزادی برقرار رکھی؛ انہی کے دور میں 1880 کی میڈرڈ کانفرنس ہوئی، اور تادلہ کی مہم کے دوران وفات پا کر رباط میں دفن ہوئے۔"
  es: "Sultán de Marruecos de la dinastía alauita (reinó entre 1873 y 1894). Nacido en Fez, sucedió a su padre, Muhammad IV, modernizó el ejército y la administración, realizó campañas anuales para mantener unido al país y preservó la independencia de Marruecos frente a la injerencia europea. La Conferencia de Madrid de 1880 tuvo lugar durante su reinado; murió en campaña en la región de Tadla y fue enterrado en Rabat."
  fr: "Sultan du Maroc de la dynastie alaouite (règne: 1873-1894). Né à Fès, il succéda à son père, Mohammed IV, modernisa l'armée et l'administration, mena des campagnes militaires annuelles pour maintenir l'unité du pays et préserva l'indépendance du Maroc face aux empiètements européens; la conférence de Madrid de 1880 eut lieu sous son règne. Il mourut en campagne dans la région de Tadla et fut inhumé à Rabat."
  tr: "Alaouite hanedanından Fas Sultanı (1873–1894 yılları arasında hüküm sürdü); Fez'de doğdu, babası Muhammed IV'ün yerine geçti. Ordu ve idareyi modernize etti, ülkeyi birleştirmek için yıllık seferler düzenledi, Fas'ın bağımsızlığını Avrupa emellerine karşı korudu ve saltanatı sırasında 1880 Madrid Konferansı'nı düzenledi. Tadla seferi sırasında öldü ve Rabat'ta defnedildi."
  id: "Sultan Maroko dari dinasti Alaouite (memerintah 1873–1894); lahir di Fez, menggantikan ayahnya Muhammad IV. Ia memodernisasi tentara dan administrasi, memimpin kampanye tahunan untuk menyatukan negara, mempertahankan kemerdekaan Maroko dari ambisi Eropa, dan selama masa pemerintahannya mengadakan Konferensi Madrid tahun 1880. Ia meninggal selama kampanye Tadla dan dimakamkan di Rabat."
