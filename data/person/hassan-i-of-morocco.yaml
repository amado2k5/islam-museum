summary:
  ar: "سلطان المغرب من الأسرة العلوية (حكم 1873–1894)؛ وُلد بفاس، وخلف أباه محمد الرابع، فحدّث الجيش والإدارة وقاد حملات سنوية لتوحيد البلاد، وحافظ على استقلال المغرب أمام الأطماع الأوروبية فانعقد في عهده مؤتمر مدريد 1880، وتوفي أثناء حملة بتادلة ودُفن بالرباط."
  en: "Sultan of Morocco of the Alawi dynasty (reigned 1873–1894). Born at Fez, he succeeded his father Muhammad IV, modernised the army and administration, campaigned yearly to hold the country together, and preserved Morocco's independence against European encroachment, the Madrid Conference of 1880 falling in his reign; he died on campaign in the Tadla region and was buried in Rabat."
  ur: "علوی سلسلے کے سلطانِ مراکش (دورِ حکومت 1873–1894)؛ فاس میں پیدا ہوئے، والد محمد چہارم کے جانشین بنے، فوج و انتظامیہ کو جدید خطوط پر استوار کیا، ملک کو متحد رکھنے کے لیے سالانہ مہمات چلائیں، یورپی تجاوزات کے مقابل مراکش کی آزادی برقرار رکھی؛ انہی کے دور میں 1880 کی میڈرڈ کانفرنس ہوئی، اور تادلہ کی مہم کے دوران وفات پا کر رباط میں دفن ہوئے۔"
