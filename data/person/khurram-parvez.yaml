summary:
  ar: "مدافع كشميري عن حقوق الإنسان، وُلد سنة 1977 في سرينغر. منسّق برنامج جمعية التضامن بين جامو وكشمير ⁦(JKCCS)⁩، فقد ساقه في انفجار لغم سنة 2004، واعتُقل في نوفمبر 2021 بموجب قانون منع الأنشطة غير القانونية، ونال جائزة مارتن إينالز لحقوق الإنسان سنة 2023."
  en: "Kashmiri human rights defender, born in 1977 in Srinagar. Programme coordinator of the Jammu and Kashmir Coalition of Civil Society (JKCCS), he lost a leg to a landmine explosion in 2004, was detained in November 2021 under the Unlawful Activities (Prevention) Act, and received the 2023 Martin Ennals Award for Human Rights Defenders."
  ur: "کشمیری انسانی حقوق کارکن، 1977ء میں سری نگر میں پیدا ہوئے۔ جموں و کشمیر کوئلیشن آف سول سوسائٹی ⁦(JKCCS)⁩ کے پروگرام کوآرڈینیٹر؛ 2004ء میں لینڈ مائن دھماکے میں اپنی ٹانگ کھو بیٹھے، نومبر 2021ء میں غیر قانونی سرگرمیوں ⁦(روک تھام)⁩ ایکٹ کے تحت گرفتار ہوئے، اور 2023ء میں مارٹن اینالز ایوارڈ دیا گیا۔"
  es: "Defensor de los derechos humanos de Cachemira, nacido en 1977 en Srinagar. Coordinador de programas de la Coalición de la Sociedad Civil de Jammu y Cachemira (JKCCS), perdió una pierna en la explosión de una mina terrestre en 2004, fue detenido en noviembre de 2021 en virtud de la Ley de Prevención de Actividades Ilegales y recibió el Premio Martin Ennals 2023 para Defensores de los Derechos Humanos."
