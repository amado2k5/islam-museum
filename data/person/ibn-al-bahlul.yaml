id: person/ibn-al-bahlul
class: person
label: { ar: "أبو عبد الله ابن البهلول القارئ" }
summary:
  ar: "أبو عبد الله ابن البهلول قارئ محسن من القراء المشهورين ببغداد، أخذه أبو الحسين بن بويه مع أبي الحسين بن الرفاء للتراويح فكانا يتناوبان الصلاة ورغب الناس في التراويح لأجلهما. حكى أحمد بن علي المحاملي عن أبي الحسين أحمد بن علي بن المهتدي أن أبا عبد الله ابن البهلول قرأ يوماً في دار القطان في الجامع بعد الصلاة يوم الجمعة سورة الحديد فقام رجل من أهل عكبرا فقال كيف قرأت يا أبا عبد الله فردد عليه فقال الرجل بلى والله فسقط ميتاً {cite:muntazam-ibn-al-jawzi j.7 p.228}."
  tr: "Ebu Abdullah ibn al-Bahlul, erdemli bir kavalet ve Bağdat'ın ünlü okuyucularından biriydi. Ebu el-Hüseyin ibn Beyah onu Ebu el-Hüseyin bin Rafa' ile birlikte Teraviye götürdü ve sırayla namaz kılarak insanları kendi hatırları için Teraviye etmeye teşvik ettiler. Ahmed ibn Ali el-Muhamili, Ebu el-Hüseyin Ahmed bin Ali ibn el-Muhtadi'den bir gün Ebu Abdullah ibn al-Bahlul'un cuma namazından sonra caminin Qattan Evi'nde Küme' suresini okuduğunu anlattı. Ekber halkından bir adam ayağa kalktı ve 'Ey Ebu Abdullah, nasıl okudun?' diye sordu. Adam 'Evet, Allah'a şükür' dedi ve öldü {atıf:Muntazam-ibn-al-Jawzi j.7 s.228}."
  id: "Abu Abdullah ibn al-Bahlul adalah seorang pembaca yang berbudi luhur dan salah satu pembaca terkenal di Baghdad. Abu al-Husayn ibn Buyah membawanya bersama Abu al-Husayn ibn al-Rafa' untuk Taraweeh, dan mereka bergantian berdoa, mendorong orang untuk melaksanakan Taraweeh demi mereka. Ahmad ibn Ali al-Muhamili menceritakan dari Abu al-Husayn Ahmad ibn Ali ibn al-Muhtadi bahwa suatu hari Abu Abdullah ibn al-Bahlul membaca Surah Al-Hadid di Rumah Qattan di masjid setelah salat Jumat. Seorang pria dari masyarakat Akbar berdiri dan bertanya, 'Bagaimana kau membaca Taraweeh, wahai Abu Abdullah?' Pria itu menjawab, 'Ya, demi Allah,' dan ia jatuh meninggal {cite:muntazam-ibn-al-jawzi j.7 hlm.228}."
