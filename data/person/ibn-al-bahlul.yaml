summary:
  ar: "أبو عبد الله ابن البهلول قارئ محسن من القراء المشهورين ببغداد، أخذه أبو الحسين بن بويه مع أبي الحسين بن الرفاء للتراويح فكانا يتناوبان الصلاة ورغب الناس في التراويح لأجلهما. حكى أحمد بن علي المحاملي عن أبي الحسين أحمد بن علي بن المهتدي أن أبا عبد الله ابن البهلول قرأ يوماً في دار القطان في الجامع بعد الصلاة يوم الجمعة سورة الحديد فقام رجل من أهل عكبرا فقال كيف قرأت يا أبا عبد الله فردد عليه فقال الرجل بلى والله فسقط ميتاً {cite:muntazam-ibn-al-jawzi j.7 p.228}."
