summary:
  ar: "عالم ومفسِّر وفقيه تونسي (1879–1973)؛ تعلّم في جامع الزيتونة ودرّس فيه طوال حياته وتولى مشيخته، وحمل لقب شيخ الإسلام سنة 1932، واشتهر بتفسيره «التحرير والتنوير» وكتابه «مقاصد الشريعة الإسلامية»، وبموقفه الرافض طلبَ بورقيبة فتوى تبيح إفطار رمضان."
  en: "Tunisian scholar, exegete and jurist (1879–1973). Educated at the Zaytuna, where he taught all his life and whose rectorship he held, he received the title Shaykh al-Islam in 1932; he is best known for his Qur'an commentary al-Tahrir wa'l-Tanwir and his Maqasid al-Shari'ah al-Islamiyyah, and for refusing President Bourguiba's request for a fatwa permitting the abandonment of the Ramadan fast."
  ur: "تونسی عالم، مفسر اور فقیہ (1879–1973)؛ جامع زیتونہ میں تعلیم پائی اور عمر بھر وہیں پڑھایا اور اس کی مشیخت سنبھالی، 1932 میں شیخ الاسلام کا لقب ملا؛ وہ اپنی تفسیر «التحریر والتنویر» اور کتاب «مقاصد الشریعۃ الاسلامیہ» کے لیے مشہور ہیں، اور اس بات کے لیے بھی کہ انھوں نے صدر بورقیبہ کی رمضان کے روزے ترک کرنے کی فتویٰ طلبی مسترد کر دی۔"
