aliases: [person/al-qudai]
died: { edtf: "1062~", hijri: "0454", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي بمصر ليلة الخميس السادس عشر من ذي القعدة سنة 454 {cite:wafayat-ayan}؛ وفي الشذرات: توفي بمنصرة في ذي الحجة سنة 454 وصلى عليه يوم جمعة {cite:shadharat-dhahab p. 301-302}." }
summary:
  ar: "أبو عبد الله محمد بن سلامة بن جعفر القضاعي الفقيه الشافعي؛ ذكره ابن عساكر في تاريخ دمشق، تولى القضاء بمصر نيابةً عن الظاهر بن الحاكم صاحب مصر وتوجه رسولاً إلى ناحية الروم؛ له مصنفات منها كتاب «الشهاب» في القضاء و«مناقب الإمام الشافعي وأخباره» و«الإنباء عن الأنباء» و«تواريخ الخلفاء» و«خطط مصر»؛ وذكره ابن ماكولا في الإكمال فقال كان متفنناً في عدة علوم {cite:wafayat-ayan}؛ وحج سنة 445 وسمع منه الخطيب البغدادي الحديث {cite:shadharat-dhahab p. 301-302}."
  en: "Abu Abd Allah Muhammad ibn Salama ibn Ja'far al-Qada'i, Shafi'i jurist. Ibn Asakir mentions him in the Ta'rikh Dimashq. He held the judgeship in Egypt as deputy of al-Zahir ibn al-Hakim, ruler of Egypt, and was sent as envoy to the land of the Byzantines (al-Rum). His works include the book al-Shihab on judicature, Manaqib al-Imam al-Shafi'i wa-akhbaruhu, al-Inba' 'an al-anba', Tawarikh al-khulafa and Khitat Misr. Ibn Makula mentions him in al-Ikmal, saying he was accomplished in several sciences {cite:wafayat-ayan}; he performed the hajj in 445, and al-Khatib al-Baghdadi heard hadith from him {cite:shadharat-dhahab p. 301-302}."
