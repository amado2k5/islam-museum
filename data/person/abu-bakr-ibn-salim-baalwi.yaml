summary:
  ar: "الولي الكبير الشيخ أبو بكر بن سالم باعلوي؛ قال في النور: كان من المشايخ الأفراد المقصودين بالزيارة من أقصى البلاد، وانتفع ببركته الحاضر والباد وانغمرت بنفحات أنفاسه العباد، واشتهرت كراماته ومناقبه في الآفاق وسارت بها الركبان والرفاق، ووقع على ولايته الإجماع والاتفاق؛ توفي ليلة الأحد السابع والعشرين من ذي الحجة بعينات من قرى حضرموت على نصف مرحلة من تريم {cite:shadharat-dhahab p. 426}."
  en: "Abu Bakr b. Salim Ba 'Alawi of 'Aynat — 'sought by visitors from the farthest lands, his miracles carried by every caravan; consensus agreed upon his sainthood'; died Sunday eve 27 Dhu'l-Hijja 992 at 'Aynat, half a stage from Tarim {cite:shadharat-dhahab p. 426}."
