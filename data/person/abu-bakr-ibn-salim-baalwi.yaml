summary:
  ar: "الولي الكبير الشيخ أبو بكر بن سالم باعلوي؛ قال في النور: كان من المشايخ الأفراد المقصودين بالزيارة من أقصى البلاد، وانتفع ببركته الحاضر والباد وانغمرت بنفحات أنفاسه العباد، واشتهرت كراماته ومناقبه في الآفاق وسارت بها الركبان والرفاق، ووقع على ولايته الإجماع والاتفاق؛ توفي ليلة الأحد السابع والعشرين من ذي الحجة بعينات من قرى حضرموت على نصف مرحلة من تريم {cite:shadharat-dhahab p. 426}."
  en: "Abu Bakr b. Salim Ba 'Alawi of 'Aynat — 'sought by visitors from the farthest lands, his miracles carried by every caravan; consensus agreed upon his sainthood'; died Sunday eve 27 Dhu'l-Hijja 992 at 'Aynat, half a stage from Tarim {cite:shadharat-dhahab p. 426}."
  fr: "Abu Bakr b. Salim Ba 'Alawi de 'Aynat — « recherché par des visiteurs venus des pays les plus lointains, ses prodiges portés par chaque caravane ; le consensus s'accorda sur sa sainteté » ; mort la veille du dimanche 27 Dhu'l-Hijja 992 à 'Aynat, à une demi-étape de Tarim {cite:shadharat-dhahab p. 426}."
  es: "Abu Bakr b. Salim Ba 'Alawi de 'Aynat — 'buscado por visitantes de las tierras más lejanas, sus milagros llevados por cada caravana; consenso sobre su santidad'; murió la víspera del domingo 27 de Dhu'l-Hijja 992 en 'Aynat, a media etapa de Tarim {cita: shadharat-dhahab p. 426}."
  ur: "ابوبکر ب۔ سلیم با علوی آف عینات - 'دور دراز علاقوں سے آنے والوں کی طرف سے تلاش کیا جاتا ہے، اس کے معجزات ہر کارواں کے ذریعے کیے جاتے ہیں۔ ان کی ولیت پر اجماع ہوا'؛ آپ کا وصال اتوار کی شام 27 ذی الحجہ 992 کو عینات میں ہوا، ترم سے آدھا مرحلہ۔ 426}۔"
  tr: "Büyük evliya Şeyh Ebu Bekir bin Salim Ba'alavi; Nur Suresi'nde şöyle buyurmuştur: \"O, en uzak diyarlardan ziyaret edilen, hem bugünün hem de çölün bereketinden faydalandığı, kulların nefesinin esintisine daldığı, mucizeleri ve faziletlerinin ufuklarda meşhur olduğu, biniciler ve yoldaşlar tarafından taşındığı, evliyalığı konusunda ittifak ve anlaşmaya varıldığı eşsiz şeyhlerden biriydi.\" Zilhicce ayının 27. Pazar gecesi, Tarim'e yarım at mesafesindeki Hadhramaut köylerinden Aynat'ta vefat etmiştir. {Kaynak: Şadharat-Dhaba, s. 426}"
  id: "Sang wali besar, Syekh Abu Bakr bin Salem Ba’alawi; beliau berkata dalam Al-Nur: Beliau adalah salah satu syekh yang unik yang dikunjungi dari negeri-negeri terjauh, dan masa kini serta padang gurun mendapat manfaat dari berkahnya, dan para jamaah terhanyut dalam semilir napasnya, dan mukjizat serta kebajikannya menjadi terkenal di cakrawala dan dibawa oleh para penunggang kuda dan sahabat, dan konsensus serta kesepakatan tercapai mengenai kewaliannya; beliau wafat pada malam Minggu, tanggal 27 Dzul Hijjah, di Aynat, salah satu desa di Hadhramaut, setengah tahta dari Tarim {kutipan:shadharat-dhahab hlm. 426}."
