summary:
  ar: "إدوارد كودرينغتون نائب أميرال بريطاني قاد الأسطول المتحالف لبريطانيا وفرنسا وروسيا في معركة نافارين يوم 20 أكتوبر 1827م، حيث دُمّر الأسطول العثماني المصري التونسي. وتذكر دائرة المعارف الإسلامية أنه اضطر إبراهيم باشا إلى هدنة، وأن ظهوره أمام الإسكندرية دفع محمد علي إلى استدعاء ابنه وجيشه من المورة {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}."
  en: "Edward Codrington was the British vice-admiral who commanded the allied fleets of Britain, France and Russia at the battle of Navarino on 20 October 1827, in which the Ottoman, Egyptian and Tunisian fleet was destroyed. The Encyclopaedia of Islam says Ibrahim Pasha was forced into a truce with him, and that his appearance before Alexandria led Muhammad Ali to recall his son and the Egyptian troops from the Morea {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}."
  ur: "ایڈورڈ کوڈرنگٹن برطانوی وائس ایڈمرل تھے جنہوں نے 20 اکتوبر 1827ء کو نوارینو کی لڑائی میں برطانیہ، فرانس اور روس کے متحدہ بیڑوں کی قیادت کی، جس میں عثمانی، مصری اور تیونسی بیڑا تباہ ہو گیا۔ دائرۃ المعارف الاسلامیہ کے مطابق ابراہیم پاشا کو ان سے جنگ بندی پر مجبور ہونا پڑا، اور ان کے اسکندریہ کے سامنے آنے پر محمد علی نے اپنے بیٹے اور مصری فوج کو موریا سے واپس بلا لیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}۔"
  es: "Edward Codrington fue el vicealmirante británico que comandó las flotas aliadas de Gran Bretaña, Francia y Rusia en la batalla de Navarino el 20 de octubre de 1827, en la que la flota otomana, egipcia y tunecina fue destruida. La Enciclopedia del Islam dice que Ibrahim Pasha se vio obligado a firmar una tregua con él, y que su aparición ante Alejandría llevó a Muhammad Ali a llamar a su hijo y a las tropas egipcias de Morea {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}."
  fr: "Edward Codrington était le vice-amiral britannique qui commandait les flottes alliées de Grande-Bretagne, de France et de Russie lors de la bataille de Navarin, le 20 octobre 1827, au cours de laquelle les flottes ottomane, égyptienne et tunisienne furent anéanties. L'Encyclopédie de l'Islam indique qu'Ibrahim Pacha fut contraint de conclure une trêve avec lui et que sa comparution devant Alexandrie incita Muhammad Ali à rappeler son fils et les troupes égyptiennes de Morée (voir: Encyclopédie de l'Islam, vol. 7, p. 1094; vol. 3, p. 1031)."
  tr: "Edward Codrington, 20 Ekim 1827'de Navarino Muharebesi'nde Britanya, Fransa ve Rusya'nın müttefik filosuna liderlik eden ve Osmanlı-Mısır-Tunus filosunu yok eden bir İngiliz amiral yardımcısıydı. İslam Ansiklopedisi, İbrahim Paşa'nın ateşkes yapmak zorunda kaldığını ve İskenderiye önündeki görünüşünün Muhammed Ali'yi oğlunu ve ordusunu Mores'tan çağırmaya teşvik ettiğini belirtir {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 1094} {cite:Encyclopaedia-of-Islam-2 cilt 3, s. 1031}."
  id: "Edward Codrington adalah seorang wakil laksamana Inggris yang memimpin armada sekutu Inggris, Prancis, dan Rusia dalam Pertempuran Navarino pada 20 Oktober 1827, di mana ia menghancurkan armada Ottoman-Mesir-Tunisia. Ensiklopedia Islam mencatat bahwa Ibrahim Pasha terpaksa membuat gencatan senjata, dan kemunculannya di hadapan Alexandria mendorong Muhammad Ali untuk memanggil putra dan pasukannya dari Mores {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 1094} {cite:Encyclopaedia-of-Islam-2 vol. 3, hlm. 1031}."
