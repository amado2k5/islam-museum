summary:
  ar: "إدوارد كودرينغتون نائب أميرال بريطاني قاد الأسطول المتحالف لبريطانيا وفرنسا وروسيا في معركة نافارين يوم 20 أكتوبر 1827م، حيث دُمّر الأسطول العثماني المصري التونسي. وتذكر دائرة المعارف الإسلامية أنه اضطر إبراهيم باشا إلى هدنة، وأن ظهوره أمام الإسكندرية دفع محمد علي إلى استدعاء ابنه وجيشه من المورة {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}."
  en: "Edward Codrington was the British vice-admiral who commanded the allied fleets of Britain, France and Russia at the battle of Navarino on 20 October 1827, in which the Ottoman, Egyptian and Tunisian fleet was destroyed. The Encyclopaedia of Islam says Ibrahim Pasha was forced into a truce with him, and that his appearance before Alexandria led Muhammad Ali to recall his son and the Egyptian troops from the Morea {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}."
  ur: "ایڈورڈ کوڈرنگٹن برطانوی وائس ایڈمرل تھے جنہوں نے 20 اکتوبر 1827ء کو نوارینو کی لڑائی میں برطانیہ، فرانس اور روس کے متحدہ بیڑوں کی قیادت کی، جس میں عثمانی، مصری اور تیونسی بیڑا تباہ ہو گیا۔ دائرۃ المعارف الاسلامیہ کے مطابق ابراہیم پاشا کو ان سے جنگ بندی پر مجبور ہونا پڑا، اور ان کے اسکندریہ کے سامنے آنے پر محمد علی نے اپنے بیٹے اور مصری فوج کو موریا سے واپس بلا لیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 1094} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1031}۔"
