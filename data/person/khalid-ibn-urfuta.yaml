id: person/khalid-ibn-urfuta
class: person
label: { ar: "خالد بن عرفطة العذري", en: "Khalid ibn Urfuta al-Udhri", es: "Khalid ibn Urfuta al-Udhri", fr: "Khalid ibn Urfuta al-Udhri", ur: "خالد بن عرفتہ الذری" }
summary:
  ar: "خليفة بني زهرة في جيش سعد يوم القادسية؛ استخلفه سعد على العسكر مقيماً في قصر المذيب ثم بعثه على خيل الطلب فجعلوا يقتلون من لحقوا حتى انتهوا إلى برس ونزل على رجل يقال له بسطام فأكرمه فسمّي نهر بسطام واجتاز الصراة فلحق جالينوس."
  en: "Banu Zuhra's deputy in Sa'd's army at al-Qadisiyya; left over the camp at Qasr al-Mudhayyib, then sent with the pursuit cavalry killing fugitives to Burs, where he lodged with a man named Bustam who honored him — Nahr Bustam being named for it — and crossed al-Sirat to overtake the Jalinus."
  es: "El lugarteniente de Banu Zuhra en el ejército de Sa'd en al-Qadisiyya; quedó a cargo del campamento en Qasr al-Mudhayyib, luego fue enviado con la caballería de persecución matando fugitivos a Burs, donde se hospedó con un hombre llamado Bustam que lo honró —Nahr Bustam recibió su nombre en su honor— y cruzó al-Sirat para alcanzar a los Jalinu."
  fr: "Le lieutenant de Banu Zuhra dans l'armée de Sa'd à al-Qadisiyya; il quitta le camp de Qasr al-Mudhayyib, puis fut envoyé avec la cavalerie de poursuite tuant les fugitifs jusqu'à Burs, où il logea chez un homme nommé Bustam qui l'honora — Nahr Bustam étant nommé d'après cela — et traversa al-Sirat pour rattraper les Jalinus."
  ur: "بنو زہرہ کا نائب قادسیہ میں سعد کی فوج میں؛ قصر المذائب کے کیمپ کو چھوڑ دیا، پھر تعاقب کرنے والے گھڑسوار دستے کے ساتھ فراریوں کو قتل کر کے برس بھیجا، جہاں اس نے بسطام نامی ایک شخص کے پاس قیام کیا جس نے اسے عزت بخشی - جس کا نام نہر بستم رکھا گیا ہے - اور جالینس کو عبور کرنے کے لیے سیرت کو عبور کیا۔"
