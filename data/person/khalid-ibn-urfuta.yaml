summary:
  ar: "خليفة بني زهرة في جيش سعد يوم القادسية؛ استخلفه سعد على العسكر مقيماً في قصر المذيب ثم بعثه على خيل الطلب فجعلوا يقتلون من لحقوا حتى انتهوا إلى برس ونزل على رجل يقال له بسطام فأكرمه فسمّي نهر بسطام واجتاز الصراة فلحق جالينوس."
  en: "Banu Zuhra's deputy in Sa'd's army at al-Qadisiyya; left over the camp at Qasr al-Mudhayyib, then sent with the pursuit cavalry killing fugitives to Burs, where he lodged with a man named Bustam who honored him — Nahr Bustam being named for it — and crossed al-Sirat to overtake the Jalinus."
