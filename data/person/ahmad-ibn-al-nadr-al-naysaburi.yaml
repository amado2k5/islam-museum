summary:
  ar: "أحمد بن النضر بن عبد الوهاب النيسابوري، أبو الفضل، حافظ مجوّد علّامة ومصنف، نزل عنده البخاري بنيسابور وروى عنه؛ عمّر إلى بضع وثمانين ومئتين."
  en: "Ahmad ibn al-Nadr ibn Abd al-Wahhab al-Naysaburi, Abu al-Fadl, a skilled memoriser, scholar and author, who hosted al-Bukhari at Nishapur and from whom al-Bukhari narrated; he lived on to some years past 280 AH."
  fr: "Ahmad ibn al-Nadr ibn Abd al-Wahhab al-Naysaburi, Abu al-Fadl, mémorisateur habile, savant et auteur qui hébergea al-Bukhari à Nichapour et dont celui-ci transmit ; il vécut quelques années au-delà de 280 H."
  es: "Ahmad ibn al-Nadr ibn Abd al-Wahhab al-Naysaburi, Abu al-Fadl, un hábil memorizador, erudito y autor, que alojó a al-Bukhari en Nishapur y de quien al-Bukhari narró; vivió algunos años más allá del 280 AH."
  ur: "احمد بن الندر بن عبد الوہاب النیسابوری، ابو الفضل، ایک ماہر حافظ، عالم اور مصنف، جس نے نیشاپور میں البخاری کی میزبانی کی اور جن سے بخاری نے روایت کی ہے۔ وہ 280 ہجری کے کچھ سال تک زندہ رہا۔"
  tr: "Ahmed ibn el-Nadr ibn Abd el-Vahhab el-Nisaburi, Ebu el-Fadl, ezberci, uzman, âlim ve yazar. Buhari, Nişapur'da onunla birlikte kaldı ve ondan rivayetlerde bulundu. İki yüz seksen küsur yıl yaşadı."
  id: "Ahmad ibn al-Nadr ibn Abd al-Wahhab al-Nisaburi, Abu al-Fadl, seorang penghafal, ahli, ulama, dan penulis. Al-Bukhari tinggal bersamanya di Nishapur dan meriwayatkan hadits darinya. Beliau hidup hingga usia dua ratus delapan puluh tahun lebih."
