summary:
  ar: "فيلسوف سنغالي (وُلد سنة 1955 في سان لوي)، أستاذ الفرنسية والفلسفة في جامعة كولومبيا، يجمع عمله بين تاريخ المنطق والرياضيات والتقاليد الفلسفية في الإسلام وأفريقيا. من كتبه «كيف نتفلسف في الإسلام» (2010) و«الانفتاح على العقل: فلاسفة مسلمون في حوار مع التراث الغربي» (2018)."
  en: "Senegalese philosopher (born 1955 in Saint-Louis), professor of French and philosophy at Columbia University, whose work joins the history of logic and mathematics to the philosophical traditions of Islam and Africa. His books include Comment philosopher en Islam (2010) and Open to Reason: Muslim Philosophers in Conversation with the Western Tradition (2018)."
  ur: "سینیگالی فلسفی (پیدائش 1955ء، سینٹ لوئس)، کولمبیا یونیورسٹی میں فرانسیسی اور فلسفے کے پروفیسر؛ ان کا کام منطق و ریاضی کی تاریخ کو اسلام اور افریقا کی فلسفیانہ روایات سے جوڑتا ہے۔ ان کی کتابوں میں «اسلام میں فلسفہ کیسے ہو» (2010ء) اور «عقل کی طرف کشادگی» (2018ء) شامل ہیں۔"
