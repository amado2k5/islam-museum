summary:
  ar: "محامٍ ورجل دولة باكستاني (1928–1979)، مؤسس حزب الشعب الباكستاني، تولى رئاسة باكستان (1971–1973) ثم رئاسة الوزراء (1973–1977) في ظل دستور 1973. أطاح به انقلاب الجنرال ضياء الحق سنة 1977، وحُوكم بتهمة الإذن بقتل معارض سياسي وأُعدم سنة 1979، وهي محاكمة أعلنت المحكمة العليا الباكستانية لاحقا أنها لم تكن عادلة."
  en: "Pakistani barrister and statesman (1928–1979), founder of the Pakistan People's Party, who served as president of Pakistan (1971–1973) and then as prime minister (1973–1977) under the 1973 constitution. He was deposed in General Zia-ul-Haq's 1977 coup, tried for authorising the murder of a political opponent and executed in 1979 — a trial Pakistan's Supreme Court later declared unfair."
  ur: "پاکستانی وکیل اور سیاست دان (1928ء–1979ء)، پاکستان پیپلز پارٹی کے بانی، جو صدرِ پاکستان (1971ء–1973ء) اور پھر 1973ء کے آئین کے تحت وزیرِ اعظم (1973ء–1977ء) رہے۔ 1977ء میں جنرل ضیاء الحق کی بغاوت میں معزول ہوئے، ایک سیاسی مخالف کے قتل کی اجازت کے الزام میں مقدمہ چلا اور 1979ء میں پھانسی دی گئی — اس مقدمے کو بعد میں سپریم کورٹ آف پاکستان نے غیر منصفانہ قرار دیا۔"
