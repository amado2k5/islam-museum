summary:
  ar: "مغيث الأسود، الواعظ بالأجود، والمذكّر بالأوكد. كان يقول: زوروا القبور كل يوم بفكركم، وتوهّموا جوامع الخير في الجنة، وانظروا إلى المنصرف بالفريقين إلى الجنة أو النار، وأشعروا قلوبكم ذكر النار ومقامعها وأطباقها."
  en: "Mughith al-Aswad, a preacher of the finest counsel and the most binding reminders; he used to say: visit the graves each day in your thought, picture the comprehensive good of Paradise each day, look at where the two groups go, to Paradise or to Hell, and let your hearts and bodies feel the mention of the Fire with its hooks and its layers."
  ur: "مغیث اسود بہترین نصیحت کرنے اور سب سے پختہ یاد دہانی کرانے والے تھے۔ وہ کہا کرتے: ہر روز اپنے فکر سے قبروں کی زیارت کرو، ہر روز جنت کی جامع بھلائیوں کا تصور کرو، اور دونوں گروہوں کی منزل کو دیکھو کہ کون جنت کی طرف جاتا ہے اور کون جہنم کی طرف، اور اپنے دلوں اور جسموں کو جہنم کے ذکر، اس کے آنکڑوں اور اس کی تہوں کا احساس دلاؤ۔"
