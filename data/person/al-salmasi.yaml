summary:
  ar: "ثقة مشهور باصطناع البر وفعل الخير وانتقاد الفقراء وكثرة الصدقة، وكان قد عُرضت عليه الشهادة فأبى. سمع ابن حيويه والدارقطني وابن شاهين. لم يُعلم مصدر نفقة أبي الحسن القزويني حتى مات السلماسي فوُجد في روزنامجته عشرة دنانير في كل شهر نفقة القزويني. ودخل إلى بغداد السلطان فاحتاج إلى نفقة فاستقرض من التجار ومن السلماسي عشرة آلاف دينار، واتفق أن السلماسي اشترى زيتًا بعشرة آلاف فباعه بعشرين فلمّا دخل السلطان دخله بعث إليه بالعشرة آلاف فلم يأخذها وقال: «قولوا للسلطان هو في أوسع حلٍّ منها، وإني أسأل أن يعفي عنها»، فقيل له ما سبب ذلك فقال: «يأكل من مالي أقوام لو علموا أني تداخلت من مال السلطان لما أكلوا منه شيئًا». وخُدّم في ثمرة بستان له بخمسمائة دينار فسكت فزاده آخرون زيادة كبيرة فقال: «سكنت إلى الأول، لا أُغيّر نيتي». توفي في جمادى الأولى سنة ست وأربعين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
  en: "A renowned benefactor — famous for kindness to the poor and abundant alms, refusing even the office of a court witness. Al-Qazwini's mysterious income proved, after al-Salmasi's death, to be a ten-dinar monthly stipend recorded in his ledger. He lent the sultan ten thousand dinars, then — having made another ten thousand on an oil sale — declined repayment 'lest those who eat of my money refuse it once they know I trafficked in sultan's money'; offered a larger second bid on his orchard's fruit, he kept to the first bidder, 'I do not change my intention'. Died Jumada I 446 {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
  fr: "Un bienfaiteur de renom – célèbre pour sa gentillesse envers les pauvres et ses aumônes abondantes, refusant même le bureau d’un témoin de la cour. Le mystérieux revenu d'Al-Qazwini s'est avéré, après la mort d'al-Salmasi, être une allocation mensuelle de dix dinars enregistrée dans son grand livre. Il a prêté dix mille dinars au sultan, puis - après en avoir fait dix mille sur une vente de pétrole - a refusé le remboursement \"de peur que ceux qui mangent de mon argent ne le refusent une fois qu'ils savent que j'ai trafiqué dans l'argent du sultan\" ; Il a offert une deuxième offre plus importante sur le fruit de son verger, il a gardé au premier soumissionnaire, \"je ne change pas mon intention\". Décédé Jumada I 446 {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
  es: "Un benefactor de renombre, famoso por su bondad con los pobres y sus abundantes limosnas, que incluso rechazó el cargo de testigo en un tribunal. Tras la muerte de al-Salmasi, se descubrió que los misteriosos ingresos de Al-Qazwini consistían en una asignación mensual de diez dinares registrada en su libro de contabilidad. Le prestó al sultán diez mil dinares y, tras obtener otros diez mil con la venta de aceite, rechazó el reembolso «para que quienes se benefician de mi dinero no lo rechacen al saber que trafiqué con el dinero del sultán». Si bien se le ofreció una segunda oferta mayor por la fruta de su huerto, se mantuvo fiel al primer postor: «No cambio de opinión». Murió en Jumada I de 446 {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
  ur: "ایک مشہور محسن - غریبوں کے ساتھ مہربانی کرنے اور بکثرت خیرات کے لیے مشہور، عدالتی گواہ کے دفتر سے بھی انکار۔ السلماسی کی موت کے بعد القزوینی کی پراسرار آمدنی ثابت ہوئی کہ اس کے لیجر میں درج دس دینار ماہانہ وظیفہ ہے۔ اس نے سلطان کو دس ہزار دینار ادھار دیے، پھر - تیل کی فروخت پر مزید دس ہزار کمانے کے بعد - واپسی سے انکار کر دیا 'ایسا نہ ہو کہ جو لوگ میرے پیسے کھاتے ہیں وہ یہ جان لیں کہ میں نے سلطان کے پیسوں کی اسمگلنگ کی ہے'۔ اپنے باغ کے پھل پر دوسری بڑی بولی لگائی، اس نے پہلی بولی لگانے والے سے کہا، 'میں اپنا ارادہ نہیں بدلتا'۔ متوفی جمادی الثانی 446۔"
  tr: "Güvenilirdi, hayırseverlik yapması, iyilik yapması, yoksulları eleştirmesi ve bolca sadaka vermesiyle tanınırdı. Şehit edilme teklifi edildi ama reddetti. İbn Heyvey, El-Darakutni ve İbn Şahin'den haber aldı. Ebu el-Hasan el-Kazwini'nin masraflarının kaynağı, el-Sulmasinin ölümüne kadar bilinmiyordu ve günlüğünde her ay on dinar el-Kazwini'nin masraflarını buldu. Sultan Bağdat'a girdi ve masraflara ihtiyaç duydu, bu yüzden tüccarlardan ve el-Salmasi'den on bin dinar borç aldı. Anlaşmaya varıldı ki, el-Selmasi on bin dolara petrol alıp yirmi bin dinara sattı. Sultan içeri girdiğinde ona on bin dinar gönderdi, fakat Sultan almadı ve dedi ki: 'Sultana en izinli dinar olduğunu söyle, ben de affetmesini istiyorum.' Ne sebep olduğu sorulduğunda, 'İnsanlar benim servetimden yer. Eğer sultanın servetini karıştırdığımı bilselerdi, ondan hiçbir şey yemezlerdi.' dedi. Bir meyve bahçesinde beş yüz dinar karşılığında çalıştı, ancak sessiz kaldı, bu yüzden diğerleri bunu önemli ölçüde artırdı ve şöyle dedi: \"İlkinde sakinleştim, niyetimi değiştirmeyeceğim.\" Dört yüz kırk altıncı yılda Jumada al-Awwal'da öldü {atıf:Muntazam-ibn-al-jawzi J.8 s.503-504}."
  id: "Ia dapat dipercaya, dikenal karena beramal, berbuat baik, mengkritik orang miskin, dan memberikan amal yang melimpah. Ia ditawari syahid namun menolak. Ia mendengar kabar dari Ibn Hayawayh, Al-Daraqutni, dan Ibn Shaheen. Sumber pengeluaran Abu al-Hasan al-Qazwini tidak diketahui hingga al-Sulmasi wafat, dan ia menemukan dalam buku hariannya sepuluh dinar setiap bulan biaya al-Qazwini. Sultan memasuki Baghdad dan membutuhkan biaya, sehingga ia meminjam sepuluh ribu dinar dari para pedagang dan al-Salmasi. Disepakati bahwa al-Salmasi membeli minyak seharga sepuluh ribu dan menjualnya seharga dua puluh. Ketika sultan masuk, ia mengirimkan sepuluh ribu dinar, tetapi ia tidak menerimanya, berkata: 'Beritahu sultan bahwa ia termasuk yang paling diperbolehkan, dan saya mohon maaf.' Ia ditanya apa penyebabnya, dan ia berkata: 'Orang-orang makan dari kekayaan saya. Jika mereka tahu saya telah mencampuradukkan harta sultan, mereka tidak akan makan apa pun darinya.' Ia bekerja di kebun buah dengan gaji lima ratus dinar, tetapi tetap diam, sehingga orang lain menambah jumlah itu secara signifikan, berkata: \"Saya menetap sampai yang pertama, saya tidak akan mengubah niat saya.\" Ia meninggal di Jumada al-Awwal pada tahun empat ratus empat puluh enam {cite:Muntazam-ibn-al-jawzi J.8 hlm.503-504}."
