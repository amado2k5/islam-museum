summary:
  ar: "ثقة مشهور باصطناع البر وفعل الخير وانتقاد الفقراء وكثرة الصدقة، وكان قد عُرضت عليه الشهادة فأبى. سمع ابن حيويه والدارقطني وابن شاهين. لم يُعلم مصدر نفقة أبي الحسن القزويني حتى مات السلماسي فوُجد في روزنامجته عشرة دنانير في كل شهر نفقة القزويني. ودخل إلى بغداد السلطان فاحتاج إلى نفقة فاستقرض من التجار ومن السلماسي عشرة آلاف دينار، واتفق أن السلماسي اشترى زيتًا بعشرة آلاف فباعه بعشرين فلمّا دخل السلطان دخله بعث إليه بالعشرة آلاف فلم يأخذها وقال: «قولوا للسلطان هو في أوسع حلٍّ منها، وإني أسأل أن يعفي عنها»، فقيل له ما سبب ذلك فقال: «يأكل من مالي أقوام لو علموا أني تداخلت من مال السلطان لما أكلوا منه شيئًا». وخُدّم في ثمرة بستان له بخمسمائة دينار فسكت فزاده آخرون زيادة كبيرة فقال: «سكنت إلى الأول، لا أُغيّر نيتي». توفي في جمادى الأولى سنة ست وأربعين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
  en: "A renowned benefactor — famous for kindness to the poor and abundant alms, refusing even the office of a court witness. Al-Qazwini's mysterious income proved, after al-Salmasi's death, to be a ten-dinar monthly stipend recorded in his ledger. He lent the sultan ten thousand dinars, then — having made another ten thousand on an oil sale — declined repayment 'lest those who eat of my money refuse it once they know I trafficked in sultan's money'; offered a larger second bid on his orchard's fruit, he kept to the first bidder, 'I do not change my intention'. Died Jumada I 446 {cite:muntazam-ibn-al-jawzi j.8 p.503-504}."
