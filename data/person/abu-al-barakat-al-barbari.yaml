summary:
  ar: "رجل مغربي حافظ للقرآن يروي ابن بطوطة عن أهل جزائر ذيبة المهل أن ملكهم شنورازة وأهل الجزائر أسلموا على يده وتمذهبوا بمذهب مالك، وأنه قرأ ذلك منقوشا على مقصورة جامعها {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  en: "A Maghribi who knew the Qur'an by heart, at whose hands, Ibn Battuta reports from the people of the Maldives, their king Shanuraza and the islanders became Muslim and adopted the school of Malik; Ibn Battuta says he read this carved on the maqsura of their mosque {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  ur: "ایک مغربی حافظِ قرآن، جس کے بارے میں ابن بطوطہ مالدیپ کے لوگوں سے نقل کرتا ہے کہ ان کا بادشاہ شنورازہ اور اہلِ جزائر اس کے ہاتھ پر مسلمان ہوئے اور مالکی مذہب اختیار کیا؛ ابن بطوطہ کہتا ہے کہ اس نے یہ بات ان کی جامع مسجد کے مقصورے پر کندہ پڑھی {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}۔"
  fr: "Un Maghrébin qui savait le Coran par cœur, entre les mains de qui, rapporte Ibn Battuta d'après les gens des Maldives, leur roi Shanuraza et les insulaires devinrent musulmans et adoptèrent l'école de Malik ; Ibn Battuta dit l'avoir lu gravé sur la maqsura de leur mosquée {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  es: "Un magrebí que conocía el Corán de memoria, de cuyas manos, según relata Ibn Battuta del pueblo de las Maldivas, su rey Shanuraza y los isleños se convirtieron al Islam y adoptaron la escuela de Malik; Ibn Battuta dice que leyó esto grabado en la maqsura de su mezquita {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  tr: "Kur'an'ı ezberlemiş bir Faslı adam. İbn Battuta, Zihba el-Mahal adalarının halkı hakkında, kralları Şanuraza ve ada halkının onun eliyle İslam'ı kabul edip Maliki mezhebini benimsediklerini ve onun da caminin surlarında yazılı olanı okuduğunu anlatır. {cite:rihla-ibn-battuta-ihya-al-ulum-1987 s. 590}"
  id: "Seorang pria Maroko yang menghafal Al-Qur'an. Ibn Battuta meriwayatkan tentang penduduk pulau Dhiba al-Mahal bahwa raja mereka, Shanuraza, dan penduduk pulau tersebut masuk Islam di bawah bimbingannya dan menganut mazhab Maliki, dan bahwa ia membaca tulisan yang terukir di sekeliling masjidnya {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
