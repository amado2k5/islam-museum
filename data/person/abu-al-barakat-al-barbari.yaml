summary:
  ar: "رجل مغربي حافظ للقرآن يروي ابن بطوطة عن أهل جزائر ذيبة المهل أن ملكهم شنورازة وأهل الجزائر أسلموا على يده وتمذهبوا بمذهب مالك، وأنه قرأ ذلك منقوشا على مقصورة جامعها {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  en: "A Maghribi who knew the Qur'an by heart, at whose hands, Ibn Battuta reports from the people of the Maldives, their king Shanuraza and the islanders became Muslim and adopted the school of Malik; Ibn Battuta says he read this carved on the maqsura of their mosque {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}."
  ur: "ایک مغربی حافظِ قرآن، جس کے بارے میں ابن بطوطہ مالدیپ کے لوگوں سے نقل کرتا ہے کہ ان کا بادشاہ شنورازہ اور اہلِ جزائر اس کے ہاتھ پر مسلمان ہوئے اور مالکی مذہب اختیار کیا؛ ابن بطوطہ کہتا ہے کہ اس نے یہ بات ان کی جامع مسجد کے مقصورے پر کندہ پڑھی {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 590}۔"
