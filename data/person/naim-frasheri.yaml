summary:
  ar: "شاعر ألباني (1846-1900) يُعدّ الشاعر الوطني لألبانيا وأبرز أدباء صحوتها القومية، وأحد الإخوة فراشري الثلاثة. تلقّى تعليمه الأول في تكية فراشر البكتاشية وكتب «دفتر البكتاشية» (1896) معربا فيه عن إعلانه إيمانه البكتاشي، وألّف ملحمة «كربلاء» و«تاريخ إسكندر بك» شعرا، وشغل في إسطنبول رئاسة لجنة التفتيش والرقابة على المطبوعات في وزارة المعارف فخفّف الحظر عن الكتب الألبانية."
  en: "Albanian poet (1846–1900), regarded as the national poet of Albania and the foremost literary voice of its National Awakening, and one of the three Frashëri brothers. He received his first education at the Bektashi tekke of Frashër and wrote the Bektashi Notebook (1896), opening with a profession of his Bektashi faith; he composed the epic Qerbelaja and a verse History of Skanderbeg, and in Istanbul chaired the Ministry of Education's inspection and censorship commission, using the post to ease the ban on Albanian books."
  ur: "البانوی شاعر ⁦(1846ء–1900ء)⁩ جنھیں البانیہ کا قومی شاعر اور اس کی قومی بیداری کی نمایاں ادبی آواز سمجھا جاتا ہے، اور وہ تینوں فراشری بھائیوں میں سے ایک تھے۔ انھوں نے فراشر کی بکتاشی تکیہ میں ابتدائی تعلیم پائی اور «بکتاشی دفتر» ⁦(1896ء)⁩ لکھی جس کے آغاز میں ان کے بکتاشی عقیدے کا اعلان تھا۔ استنبول میں وہ وزارتِ تعلیم کے معائنہ و سنسر کمیشن کے صدر رہے اور اس عہدے سے البانوی کتابوں پر پابندی میں نرمی کی۔"
  es: "Poeta albanés (1846-1900), considerado el poeta nacional de Albania y la voz literaria más destacada de su Despertar Nacional, y uno de los tres hermanos Frashëri. Recibió su primera educación en la tekke bektashi de Frashër y escribió el Cuaderno bektashi (1896), que comienza con una profesión de fe bektashi; compuso la epopeya Qerbelaja y una Historia de Skanderbeg en verso, y en Estambul presidió la comisión de inspección y censura del Ministerio de Educación, utilizando el cargo para suavizar la prohibición de los libros albaneses."
  fr: "Poète albanais (1846-1900), considéré comme le poète national de l'Albanie et la voix littéraire la plus importante du Réveil national albanais, il était l'un des trois frères Frashëri. Il reçut sa première éducation à l'école Bektashi de Frashër et écrivit le Cahier Bektashi (1896), qu'il ouvre par une profession de foi. Il composa l'épopée Qerbelaja et une Histoire de Skanderbeg en vers. À Istanbul, il présida la commission d'inspection et de censure du ministère de l'Éducation, poste qu'il utilisa pour assouplir l'interdiction des livres albanais."
  tr: "Arnavut şair (1846-1900), Arnavutluk'un ulusal şairi ve ulusal uyanışının en önde gelen yazarlarından biri olarak kabul edilir; ayrıca üç Vrashiri kardeşten biridir. İlk eğitimini Bektashi'nin Fraser Tekyeh'inde aldı ve Bektaşiye olan inancını ilan ettiği \"Bektaşi Defteri\"ni (1896) yazdı. \"Kerbel\" destanı ve \"İskender Beg'in Tarihi\" adlı şiir eserlerini besteledi. Ayrıca İstanbul Eğitim Bakanlığı'nda Arnavutça kitap yasağı hafifletilen Yayınların Denetim ve Kontrol Komitesi'ne başkanlık etti."
  id: "Penyair Albania (1846-1900) dianggap sebagai penyair nasional Albania dan salah satu penulis paling menonjol dalam kebangkitan nasionalnya, serta salah satu dari tiga bersaudara Vrashiri. Ia menerima pendidikan awalnya di Fraser Tekyeh Bektashi dan menulis \"Buku Catatan Bektashi\" (1896), di mana ia menyatakan keyakinannya pada Bektashi. Ia menggubah epik \"Karbala\" dan \"Sejarah Iskandar Beg\" sebagai puisi. Ia juga memimpin Komite Inspeksi dan Pengawasan Publikasi di Kementerian Pendidikan di Istanbul, di mana larangan buku Albania dilonggarkan."

