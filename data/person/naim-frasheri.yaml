summary:
  ar: "شاعر ألباني (1846-1900) يُعدّ الشاعر الوطني لألبانيا وأبرز أدباء صحوتها القومية، وأحد الإخوة فراشري الثلاثة. تلقّى تعليمه الأول في تكية فراشر البكتاشية وكتب «دفتر البكتاشية» (1896) معربا فيه عن إعلانه إيمانه البكتاشي، وألّف ملحمة «كربلاء» و«تاريخ إسكندر بك» شعرا، وشغل في إسطنبول رئاسة لجنة التفتيش والرقابة على المطبوعات في وزارة المعارف فخفّف الحظر عن الكتب الألبانية."
  en: "Albanian poet (1846–1900), regarded as the national poet of Albania and the foremost literary voice of its National Awakening, and one of the three Frashëri brothers. He received his first education at the Bektashi tekke of Frashër and wrote the Bektashi Notebook (1896), opening with a profession of his Bektashi faith; he composed the epic Qerbelaja and a verse History of Skanderbeg, and in Istanbul chaired the Ministry of Education's inspection and censorship commission, using the post to ease the ban on Albanian books."
  ur: "البانوی شاعر (1846ء–1900ء) جنھیں البانیہ کا قومی شاعر اور اس کی قومی بیداری کی نمایاں ادبی آواز سمجھا جاتا ہے، اور وہ تینوں فراشری بھائیوں میں سے ایک تھے۔ انھوں نے فراشر کی بکتاشی تکیہ میں ابتدائی تعلیم پائی اور «بکتاشی دفتر» (1896ء) لکھی جس کے آغاز میں ان کے بکتاشی عقیدے کا اعلان تھا۔ استنبول میں وہ وزارتِ تعلیم کے معائنہ و سنسر کمیشن کے صدر رہے اور اس عہدے سے البانوی کتابوں پر پابندی میں نرمی کی۔"

