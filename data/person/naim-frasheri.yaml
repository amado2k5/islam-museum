faith:
  - value: sufi
    status: documented
    basis_sources: [source/wikipedia-naim-frasheri-en, source/wikipedia-naim-frasheri-sq, source/elsie-naim-frasheri]
    note: "His own adherence to the Bektashi order is attested by three independent sources, each naming the affiliation itself: the English Wikipedia article states 'Himself a Bektashi, he desired purity of the Albanian language... in his work Fletore e Bektashinjët', adds that the Notebook 'contains an introductory profession of his faith', and calls him 'the most representative writer of Sufi poetry in Albanian'; the Albanian Wikipedia article states that he began learning Ottoman Turkish, Arabic and Persian at the Tekke of Frashër 'si myhib bektashi' — as a Bektashi muhib, an adherent of the order — and calls Fletore e Bektashinjet and Qerbelaja 'the first works of Albanian Bektashism'; and Robert Elsie's scholarly biography speaks of 'his affinity for his pantheistic Bektashi religion' and of 'liberal Bektashi beliefs to which he had been attached since his childhood in Frashër'. The Turkish article's 'Kendisi de bir Bektaşi' agrees but runs closely parallel to the English article, so it is counted as corroboration, not as an independent attestation. The segment is recorded as sufi with the Bektashi affiliation stated here, following the precedent of person/omer-vrioni-ii and person/ali-al-mirghani, whose documented sufi segments likewise rest on attested order affiliation and office. No source names a school of law for him; Wikidata's religion statement is Islam generically. His Qerbelaja, a Bektashi epic on the Karbala theme, is not a Shia attestation and is not treated as one."

