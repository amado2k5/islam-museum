summary:
  ar: "أحمد بن الخضر المعروف بابن خضرويه البلخي، شيخ خراسان المشهور بالفتوة، زار أبا يزيد البسطامي مع زوجته أم علي، وعاش خمسًا وتسعين سنة بحسب «حلية الأولياء»."
  en: "Ahmad ibn al-Khidr, known as Ibn Khidruya al-Balkhi, a shaykh of Khurasan famed for futuwwa (spiritual chivalry); he visited Abu Yazid al-Bistami with his wife Umm Ali and lived to ninety-five according to Hilyat al-Awliya."
  ur: "احمد بن خضر، جو ابن خضرویہ بلخی کے نام سے معروف ہیں، خراسان کے شیخ تھے اور فتوت میں مشہور تھے۔ وہ اپنی اہلیہ ام علی کے ساتھ ابو یزید بسطامی سے ملے، اور «حلیۃ الاولیاء» کے مطابق پچانوے برس جیے۔"
  es: "Ahmad ibn al-Khidr, conocido como Ibn Khidruya al-Balkhi, un jeque de Jorasán famoso por su futuwwa (caballerosidad espiritual); visitó a Abu Yazid al-Bistami con su esposa Umm Ali y vivió hasta los noventa y cinco años según Hilyat al-Awliya."
  fr: "Ahmad ibn al-Khidr, connu sous le nom d'Ibn Khidruya al-Balkhi, un cheikh du Khorasan célèbre pour sa futuwwa (chevalerie spirituelle); il a rendu visite à Abu Yazid al-Bistami avec sa femme Umm Ali et a vécu jusqu'à quatre-vingt-quinze ans selon Hilyat al-Awliya."
