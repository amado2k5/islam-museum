summary:
  ar: "عبد الكريم بن أحمد بن موسى ابن طاووس العلوي الحسني، فقيه نسابة إمامي، ولد في الحائر ونشأ ببغداد وتوفي في الكاظمية، من كتبه الشمل المنظوم في مصنفي العلوم وفرحة الغري؛ 648 إلى 693 هـ."
  en: "Abd al-Karim ibn Ahmad ibn Tawus al-Alawi al-Hasani, an Imami (Twelver Shi'i) jurist and genealogist, born in al-Ha'ir, raised in Baghdad and died in al-Kazimiyya, author of al-Shaml al-Manzum fi Musannafi al-Ulum and Farhat al-Ghari; 648 to 693 AH (1250 to 1294)."
  fr: "Abd al-Karim ibn Ahmad ibn Tawus al-Alawi al-Hasani, juriste et généalogiste imamite (chiite duodécimain), né à al-Ha'ir, élevé à Bagdad et mort à al-Kazimiyya, auteur d'al-Shaml al-Manzum fi Musannafi al-Ulum et de Farhat al-Ghari ; 648 à 693 H (1250 à 1294)."
  es: "Abd al-Karim ibn Ahmad ibn Tawus al-Alawi al-Hasani, jurista y genealogista imami (doce chií), nacido en al-Ha'ir, criado en Bagdad y fallecido en al-Kazimiyya, autor de al-Shaml al-Manzum fi Musannafi al-Ulum y Farhat al-Ghari; 648 a 693 AH (1250 a 1294)."
  ur: "عبد الکریم بن احمد بن طاؤس العلوی الحسنی، ایک امامی ⁦(بارہ شیعہ)⁩ فقیہ اور نسبی ماہر، الحائر میں پیدا ہوئے، بغداد میں پرورش پائی اور الکاظمیہ میں وفات پائی، الشمل المنظوم فی مسنفی الغہری کے مصنف؛ 648 تا 693 ہجری ⁦(1250 تا 1294)⁩۔"
  tr: "İmami hukukçu ve soybilimci Abdulkerim bin Ahmed bin Musa bin Tawus Al-Alavi Al-Hasani, Al-Ha'ir'de doğdu, Bağdat'ta büyüdü ve Al-Kazimiyah'da öldü. Kitapları arasında Al-Shamal Al-Manzoum fi Musannifi Al-Ulum ve Farhat Al-Ghari; 648 ila 693 H."
  id: "Abdul Karim bin Ahmed bin Musa bin Tawus Al-Alawi Al-Hasani, seorang ahli hukum dan silsilah Imamiyah, lahir di Al-Ha'ir, besar di Bagdad, dan meninggal di Al-Kazimiyah. Di antara buku-bukunya adalah Al-Shamal Al-Manzoum fi Musannifi Al-Ulum dan Farhat Al-Ghari; 648 hingga 693 H."
