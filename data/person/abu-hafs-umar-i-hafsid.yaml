summary:
  ar: "عمر بن يحيى الحفصي، أبو حفص، المستنصر الثاني، صاحب تونس، استعاد تونس من ابن أبي عمارة بمن بايعه من العرب سنة 683 هـ، وتوفي بتونس سنة 694 هـ الموافقة 1295 م."
  en: "Umar ibn Yahya al-Hafsi, Abu Hafs, al-Mustansir the Second, ruler of Tunis, who retook Tunis from Ibn Abi Umara with the Arabs who swore allegiance to him in 683 AH, and died in Tunis in 694 AH (1295)."
  fr: "Umar ibn Yahya al-Hafsi, Abu Hafs, al-Mustansir II, souverain de Tunis, qui reprit Tunis à Ibn Abi Umara avec les Arabes qui lui prêtèrent allégeance en 683 H, et mourut à Tunis en 694 H (1295)."
  es: "Umar ibn Yahya al-Hafsi, Abu Hafs, al-Mustansir el Segundo, gobernante de Túnez, que reconquistó Túnez de Ibn Abi Umara con los árabes que le juraron lealtad en el año 683 de la Hégira, y murió en Túnez en el año 694 de la Hégira (1295)."
