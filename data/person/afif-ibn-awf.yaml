summary:
  ar: "عفيف بن عوف بن عباد النصري ثم اليربوعي، رأس بني نصر بن معاوية في حربهم على الأحلاف من ثقيف حين حمت الأحلاف حمى جلذان من أرضهم؛ صاح يوم كروبا صيحة يزعمون أن سبعين حبلى منهم ألقت ما في بطنها {cite:kamil-ibn-al-athir p. 512-513}."
  en: "Afif ibn Awf of Banu Nasr-Yarbu', their chief in the war on Thaqif's Ahlaf over the fenced pasture of Jalathan; his war-cry on the day of Karuba was said to have made seventy pregnant women miscarry {cite:kamil-ibn-al-athir p. 512-513}."
  fr: "Afif ibn Awf des Banu Nasr-Yarbu', leur chef dans la guerre contre les Ahlaf de Thaqif pour le pâturage clôturé de Jalathan ; son cri de guerre le jour de Karuba aurait provoqué la fausse couche de soixante-dix femmes enceintes {cite:kamil-ibn-al-athir p. 512-513}."
  es: "Afif ibn Awf de Banu Nasr-Yarbu', su jefe en la guerra contra el Ahlaf de Thaqif por el pastizal cercado de Jalathan; se dice que su grito de guerra el día de Karuba hizo que setenta mujeres embarazadas abortaran {cite:kamil-ibn-al-athir p. 512-513}."
