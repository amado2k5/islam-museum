summary:
  ar: "قاضٍ وسياسي هندي (1867–1952) من البنغال، صار قاضيًا في محكمة مدراس العليا ثم رئيسًا لها، وألّف «مبادئ الفقه المحمدي» على المذاهب الأربعة. كان من قادة الرابطة الإسلامية ورأس جلستها في عليكرة سنة 1925، ثم رأس الجمعية التشريعية المركزية للهند من 1935 إلى 1945."
  en: "Indian judge and politician (1867–1952) from Bengal who became a judge, and then Chief Justice, of the Madras High Court and wrote The Principles of Muhammadan Jurisprudence according to the four Sunni schools. A leading member of the All-India Muslim League, he presided over its 1925 Aligarh session and was President of the Central Legislative Assembly of India from 1935 to 1945."
  ur: "بنگال سے تعلق رکھنے والے ہندوستانی جج اور سیاست دان ⁦(1867ء–1952ء)⁩ جو مدراس ہائی کورٹ کے جج اور پھر چیف جسٹس بنے اور انھوں نے چاروں سنی مکاتب کے مطابق «اصولِ فقہِ محمدی» لکھی۔ وہ آل انڈیا مسلم لیگ کے سرکردہ رکن تھے، 1925ء میں علی گڑھ اجلاس کی صدارت کی، اور 1935ء سے 1945ء تک ہندوستان کی مرکزی قانون ساز اسمبلی کے صدر رہے۔"
