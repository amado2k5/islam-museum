summary:
  ar: "داعية وباحث بنغلاديشي شاب، وُلد سنة 1991 في رانغبور، عُرف خصوصا بين الشباب بمحاضراته في التفسير والحديث وعلامات الساعة، يبث عبر قناة Taw Haa Tv وقناة شخصية على يوتيوب، وأسس مدرسة طه ذي النورين الإلكترونية؛ واختفاؤه ثمانية أيام في يونيو 2021 أثار جدلا وطنيا واسعا في بنغلاديش."
  en: "Young Bangladeshi Islamic speaker and researcher, born in 1991 in Rangpur, known especially among the young for lectures on tafsir, hadith and the signs of the Hour. He broadcasts through Taw Haa Tv and a personal YouTube channel, and founded the Taw Haa Jin Nurain Online Madrasah; his eight-day disappearance in June 2021 drew nationwide attention in Bangladesh."
  ur: "نوجوان بنگلہ دیشی اسلامی مقرر اور محقق، جو 1991 میں رنگپور میں پیدا ہوئے، خاص طور پر نوجوانوں میں تفسیر، حدیث اور علاماتِ قیامت پر اپنے خطبات کے لیے جانے جاتے ہیں۔ وہ Taw Haa Tv اور اپنے ذاتی یوٹیوب چینل سے نشر کرتے ہیں، اور انہوں نے طہٰ ذی النورین آن لائن مدرسہ قائم کیا؛ جون 2021 میں ان کی آٹھ دن کی گمشدگی نے بنگلہ دیش بھر میں توجہ حاصل کی۔"
