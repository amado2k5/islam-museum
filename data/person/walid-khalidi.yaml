summary:
  ar: "مؤرخ فلسطيني (1925–2026)، شارك في تأسيس معهد الدراسات الفلسطينية في بيروت (1963) وكان أمينه العام حتى 2016. درّس في أكسفورد والجامعة الأمريكية في بيروت وهارفارد؛ ومن أشهر أعماله «قبل الشتات» وموسوعته عن قرى فلسطين التي دُمّرت سنة 1948. توفي في كامبريدج بولاية ماساتشوستس عن عمر ناهز المئة."
  en: "Palestinian historian (1925–2026), co-founder of the Institute for Palestine Studies in Beirut (1963) and its general secretary until 2016. He taught at Oxford, the American University of Beirut and Harvard; his Before Their Diaspora and All That Remains are foundational documentation of Palestinian society and of the villages depopulated in 1948. He died in Cambridge, Massachusetts, aged 100."
  ur: "فلسطینی مؤرخ (1925–2026)، بیروت میں انسٹی ٹیوٹ فار فلسطین اسٹڈیز (1963ء) کے شریک بانی اور 2016ء تک اس کے سیکرٹری جنرل۔ آکسفورڈ، امریکن یونیورسٹی آف بیروت اور ہارورڈ میں تدریس کی؛ «قبل الشتات» اور 1948ء میں تباہ ہونے والے فلسطینی دیہات پر ان کی موسوعہ ان کے مشہور ترین کام ہیں۔ وہ کیمبرج، میساچوسٹس میں سو برس کی عمر میں انتقال کر گئے۔"
