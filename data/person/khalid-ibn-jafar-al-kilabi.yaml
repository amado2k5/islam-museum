id: person/khalid-ibn-jafar-al-kilabi
class: person
label: { ar: "خالد بن جعفر الكلابي", en: "Khalid ibn Ja'far al-Kilabi", es: "Khalid ibn Ja'far al-Kilabi", fr: "Khalid ibn Ja'far al-Kilabi", ur: "خالد بن جعفر الکلبی" }
summary:
  ar: "نديم النعمان بن المنذر ملك الحيرة، توسط للنابغة الذبياني عند حاجب الملك حتى أدخله، فلما قال النعمان لأنت في وصفك أبلغ إحساناً من النابغة في نظام قافيته قال خالد ما أبلغ فيك حسناً إلا وهو دون قدرك استحقاقاً للشرف الباهر {cite:muruj-al-dhahab p. 417-418}. وعند البلاذري حارب بني عبس وقتل مع أصحابه سيدهم زهير بن جذيمة ثم مضى إلى النعمان فاستجار به خوفاً من أن يطلبه قومه بدم زهير، فضمن الحارث بن ظالم لغطفان أن يفتك به فقدم على النعمان فحياه وواكله ثم دخل على خالد فقتله، فخرج أخوه الأحوص ببني عامر يطلب قاتله فكان يوم رحرحان {cite:ansab-al-ashraf p. 40}"
  en: "al-Nu'man ibn al-Mundhir's boon-companion whose intercession admitted al-Nabigha to the court — himself praised by the king as finer in prose than the poet in verse {cite:muruj-al-dhahab p. 417-418}."
  es: "Compañero de al-Nu'man ibn al-Mundhir, cuya intercesión permitió la entrada de al-Nabigha a la corte, a quien el rey elogió por ser más refinado en prosa que el poeta en verso {cite:muruj-al-dhahab p. 417-418}."
  fr: "Le compagnon bienfaiteur d'al-Nu'man ibn al-Mundhir dont l'intercession a permis à al-Nabigha d'entrer à la cour — lui-même loué par le roi comme étant plus fin en prose que le poète en vers {cite:muruj-al-dhahab p. 417-418}."
  ur: "النعمان بن المنذر کا وہ ساتھی جس کی شفاعت نے نبیحہ کو دربار میں داخل کیا - خود بادشاہ نے اس کی تعریف آیت میں شاعر سے زیادہ نثر میں کی ہے۔ 417-418}۔"
  tr: "El-Hirah kralı Nadim el-Nu'man bin el-Mundhir, el-Nabigha el-Dhubyani ile kralın odasında aracılık etti ve onu içeri aldı. al-Nu'man, 'Sen kendini al-Nabigha'dan daha nazik bir şekilde tarif ediyorsun, kafiyeli sisteminde söylüyorsun,' dediğinde, Şöyle dedi: 'Halid sana hiçbir zaman iyi bir şey katmadı, sadece senin değerinin altında olduğunu, yüce onuru hak ettiğini gösterdi.' {atıf:Muruj-al-Dhahab s. 417-418}. al-Baladhuri'ye göre, Banu Abs ile savaştı ve onların ustası Zuhayr ibn Judhaimah'ı yoldaşlarıyla birlikte öldürdü. Sonra el-Nu'man'a sığındı, halkının Zuhayr'ın kanını talep edeceğinden korkarak ona sığındı. Al-Harith ibn Zalim onu öldüreceğine söz verdi, bu yüzden al-Nu'man'a geldi, onu selamladı ve öldürdü. Kardeşi el-Ahwas, Banu Emir ile birlikte katilini aramaya çıktı. Rahran günü, {cite:ansab-al-ashraf, s. 40}"
  id: "Nadim al-Nu'man ibn al-Mundhir, raja al-Hirah, berperantara kepada al-Nabigha al-Dhubyani di kamar raja sampai ia membawanya masuk. Ketika al-Nu'man berkata, 'Kau lebih baik menggambarkanmu daripada al-Nabigha dalam sistem sajaknya,' ia berkata: 'Khalid tidak pernah menyampaikan kebaikan dalam dirimu kecuali bahwa ia di bawah nilaimu, layak menerima kehormatan mulia.' {cite:Muruj-al-Dhahab hlm. 417-418}. Menurut al-Baladhuri, ia bertempur melawan Banu Abs dan membunuh tuan mereka Zuhayr ibn Judhaimah bersama para sahabatnya. Ia kemudian pergi menemui al-Nu'man, mencari perlindungan karena takut rakyatnya akan menuntut darah Zuhayr. Al-Harith ibn Zalim menjamin akan membunuhnya, sehingga ia datang kepada al-Nu'man, menyapanya, dan membunuhnya. Saudaranya al-Ahwas pergi bersama Banu Amir untuk mencari pembunuhnya. Pada hari Rahran, ia {cite:ansab-al-ashraf, hlm. 40}"
