summary:
  ar: "عبد الله بن ناشرة التميمي؛ أشار على عبد العزيز بن عبد الله بن عامر أن يأخذ جميع ما في بيت مال سجستان وينصرف ففعل ثم أقبل هو حتى دخل زرنج فأخرجه وكيع بن أبي سود فجمع جمعاً فقاتل فعثرت به فرسه فقتل ورثاه أبو حزابة ويقال حنظلة بن عرادة ألا لا فتى بعد ابن ناشرة الفتى."
  en: "Abdallah ibn Nashira al-Tamimi; he counselled Abd al-Aziz to empty Sijistan's treasury and leave, then came himself and entered Zaranj — expelled by Waki' ibn Abi Sud, he raised a host and fought till his horse stumbled and he was killed, elegized as 'no youth after Ibn Nashira the youth'."
