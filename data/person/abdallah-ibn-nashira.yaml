id: person/abdallah-ibn-nashira
class: person
label: { ar: "عبد الله بن ناشرة التميمي", en: "Abdallah ibn Nashira al-Tamimi", fr: "Abdallah ibn Nashira al-Tamimi", es: "Abdallah ibn Nashira al-Tamimi", ur: "عبداللہ بن ناصرہ التمیمی۔" }
summary:
  ar: "عبد الله بن ناشرة التميمي؛ أشار على عبد العزيز بن عبد الله بن عامر أن يأخذ جميع ما في بيت مال سجستان وينصرف ففعل ثم أقبل هو حتى دخل زرنج فأخرجه وكيع بن أبي سود فجمع جمعاً فقاتل فعثرت به فرسه فقتل ورثاه أبو حزابة ويقال حنظلة بن عرادة ألا لا فتى بعد ابن ناشرة الفتى."
  en: "Abdallah ibn Nashira al-Tamimi; he counselled Abd al-Aziz to empty Sijistan's treasury and leave, then came himself and entered Zaranj — expelled by Waki' ibn Abi Sud, he raised a host and fought till his horse stumbled and he was killed, elegized as 'no youth after Ibn Nashira the youth'."
  fr: "Abdallah ibn Nashira al-Tamimi ; il conseilla à Abd al-Aziz de vider le trésor du Sistan et de partir, puis vint lui-même et entra à Zaranj — chassé par Waki' ibn Abi Sud, il leva une troupe et combattit jusqu'à ce que son cheval trébuche et qu'il soit tué, pleuré par ce vers : « plus de jeune homme après Ibn Nashira le jeune homme »."
  es: "Abdallah ibn Nashira al-Tamimi; aconsejó a Abd al-Aziz que vaciara el tesoro de Sijistan y se marchara, luego vino él mismo y entró en Zaranj; expulsado por Waki' ibn Abi Sud, reunió un ejército y luchó hasta que su caballo tropezó y murió, siendo elogiado como 'ningún joven después de Ibn Nashira el joven'."
  ur: "عبداللہ بن ناصرہ التمیمی؛ اس نے عبدالعزیز کو مشورہ دیا کہ وہ سجستان کا خزانہ خالی کر دے اور وہاں سے چلا جائے، پھر خود آیا اور زرنج میں داخل ہوا - جسے وکیع ابن ابی سعود نے نکال دیا، اس نے ایک لشکر کھڑا کیا اور لڑا یہاں تک کہ اس کا گھوڑا لڑکھڑا گیا اور وہ مارا گیا، 'ابن ناصرہ کے بعد کوئی جوانی نہیں' کہلایا۔"
  tr: "Abdullah bin Naşira el-Tamimi, Abdül Aziz bin Abdullah bin Amer'e Sijistan hazinesindeki her şeyi alıp gitmesini tavsiye etti ve o da öyle yaptı. Sonra Zaranj'a kadar ilerledi, bunun üzerine Vaki bin Ebu Sud onu oradan çıkardı. Bir grup topladı ve savaştı, ancak atı tökezledi ve öldürüldü. Ebu Hazaba onun için yas tuttu ve Hanzala bin Arada şöyle der: \"İbn Naşira'dan sonra genç bir adam yoktur.\""
  id: "Abdullah bin Nashira al-Tamimi menasihati Abdul Aziz bin Abdullah bin Amer untuk mengambil semua harta benda di Sijistan dan pergi, maka ia pun melakukannya. Kemudian ia maju hingga memasuki Zaranj, lalu Waki’ bin Abi Sud membawanya keluar. Ia mengumpulkan sekelompok orang dan berperang, tetapi kudanya tersandung dan ia terbunuh. Abu Hazaba meratapinya, dan dikatakan oleh Hanzala bin Arada: “Tidak ada pemuda setelah Ibnu Nashira, pemuda yang sesungguhnya.”"
