  ar: "جم الملك عند ذوي الخبرة بأخبار ملوكهم أول من عظم النار ودعا الناس إلى تعظيمها وقال إنها تشبه ضوء الشمس والكواكب لأن النور عنده أفضل من الظلمة وجعل للنور مراتب، وقيل إن ظهور بوداسف كان في ملكه وقيل في أوائل ملك طهمورث {cite:muruj-al-dhahab p. 538}."
  en: "King Jam — first, say the Persian chroniclers, to exalt fire and call men to honour it as the likeness of the sun's and stars' light, setting degrees to light over darkness; Budasaf's appearance is put in his reign or Tahmurath's {cite:muruj-al-dhahab p. 538}."
  es: "El rey Jam — primero, dicen los cronistas persas, en exaltar el fuego y llamar a los hombres a honrarlo como la semejanza de la luz del sol y las estrellas, estableciendo grados de luz sobre la oscuridad; la aparición de Budasaf se sitúa en su reinado o en el de Tahmurath {cite:muruj-al-dhahab p. 538}."
  fr: "Le roi Jam — le premier, selon les chroniqueurs persans, à exalter le feu et à appeler les hommes à l'honorer comme la ressemblance de la lumière du soleil et des étoiles, établissant des degrés de lumière sur les ténèbres; l'apparition de Budasaf est placée dans son règne ou celui de Tahmurath {cite:muruj-al-dhahab p. 538}."
