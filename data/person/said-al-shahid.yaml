summary:
  ar: "سعيد الشهيد، المقنّع في الحديد، المشتاق إلى رؤية المنعم المجيد. روى ميسرة الخادم أنه في إحدى الغزوات حمل على ميمنة العدو وميسرته وقلبه، وأنشد أبياتًا في الشوق إلى الجنان، ثم قاتل حتى قُتل."
  en: "Sa'id al-Shahid, veiled in iron, longing to see the glorious Benefactor; Maysara the servant relates that in one raid, a youth beside him in armour charged the enemy's right wing, left wing and centre, reciting verses of longing for the gardens; he fought on, killed many, charged again, and fought until he was killed."
  ur: "سعید شہید، لوہے میں چھپے ہوئے اور اس عظیم انعام دینے والے کے دیدار کے مشتاق۔ میسرہ خادم نے ایک غزوہ کا حال بیان کیا کہ ان کے پہلو میں ایک نوجوان لوہے کے لباس میں تھا جس نے دشمن کے دائیں، بائیں اور درمیان پر حملہ کیا، جنت کے شوق کے اشعار پڑھتے ہوئے؛ وہ بہت سوں کو قتل کر کے لوٹا، پھر دوبارہ حملہ کیا، اور لڑتے ہوئے شہید ہو گیا۔"
  es: "Sa'id al-Shahid, velado por el hierro, anhelaba ver al glorioso Benefactor; Maysara, el sirviente, relata que en una incursión, un joven a su lado, con armadura, cargó contra el flanco derecho, el flanco izquierdo y el centro del enemigo, recitando versos de anhelo por los jardines; luchó, mató a muchos, volvió a cargar y luchó hasta que murió."
  fr: "Sa'id al-Shahid, voilé de fer, aspirait à voir le glorieux Bienfaiteur; Maysara, le serviteur, raconte que lors d'un raid, un jeune homme à ses côtés, en armure, chargea l'aile droite, l'aile gauche et le centre de l'ennemi, récitant des versets exprimant son désir des jardins; il continua à combattre, tua de nombreux ennemis, chargea à nouveau et combattit jusqu'à ce qu'il soit tué."
  tr: "Demir maskeli şehit Saeed, görkemli hayırseveri görmeyi arzuluyor. Maysara Al-Khadim, savaşlardan birinde düşmanın sağında, sol tarafında ve kalbinde saldırıya uğradığını, cennete özlem duyduğunu ve ardından öldürülene kadar savaştığını anlattı."
  id: "Saeed sang syahid, bertopeng besi, merindukan untuk melihat dermawan mulia itu. Maysara Al-Khadim menceritakan bahwa selama salah satu pertempuran, ia diserang di sisi kanan dan kiri serta jantung musuh, sambil melantunkan bait-bait tentang kerinduan akan surga, lalu bertempur hingga ia tewas."
