summary:
  ar: "سعيد الشهيد، المقنّع في الحديد، المشتاق إلى رؤية المنعم المجيد. روى ميسرة الخادم أنه في إحدى الغزوات حمل على ميمنة العدو وميسرته وقلبه، وأنشد أبياتًا في الشوق إلى الجنان، ثم قاتل حتى قُتل."
  en: "Sa'id al-Shahid, veiled in iron, longing to see the glorious Benefactor; Maysara the servant relates that in one raid, a youth beside him in armour charged the enemy's right wing, left wing and centre, reciting verses of longing for the gardens; he fought on, killed many, charged again, and fought until he was killed."
  ur: "سعید شہید، لوہے میں چھپے ہوئے اور اس عظیم انعام دینے والے کے دیدار کے مشتاق۔ میسرہ خادم نے ایک غزوہ کا حال بیان کیا کہ ان کے پہلو میں ایک نوجوان لوہے کے لباس میں تھا جس نے دشمن کے دائیں، بائیں اور درمیان پر حملہ کیا، جنت کے شوق کے اشعار پڑھتے ہوئے؛ وہ بہت سوں کو قتل کر کے لوٹا، پھر دوبارہ حملہ کیا، اور لڑتے ہوئے شہید ہو گیا۔"
