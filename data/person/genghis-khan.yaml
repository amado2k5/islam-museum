label: { ar: "جنكزخان قان التتار" }
summary:
  ar: "قام مقام ابن عمته دوش خان سلطان إحدى ممالك الصين الست فانضم إليه خلق من المغول فاستشاط القان الأكبر غضباً فتحالف هو وكشلوخان على التعاضد فكسروا القان وملكوا بلاده واستمر الملك بينهما على المشاركة ثم وثب على ولد كشلوخان واستقل ودانت له التتار واعتقدوا فيه الإلهية وبالغوا في طاعته، وكان أول خروجهم سنة ست وست مئة إلى نواحي الترك وفرغانة، وأرسل إلى خوارزم شاه رسلاً وهدايا يطلب المسالمة فلما غدر خوارزم شاه بالتجار وقتل الرسل سار إليه فأباده وأباد مملكته {cite:tarikh-khulafa-minhaj-1434 p. 712-714}."
  en: "Rising through his aunt's dead husband's kingdom, Genghis allied with Kashlukhan against the great Qan, broke him, then seized sole rule — the Tatars held him divine and obeyed utterly. Their first ride was 606; when Khwarazmshah's men broke faith with the traders and killed the envoys, Genghis wiped out him and his realm {cite:tarikh-khulafa-minhaj-1434 p. 712-714}."
