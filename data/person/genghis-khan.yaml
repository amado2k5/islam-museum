label: { ar: "جنكزخان قان التتار" , ur: "چنگیز خان", en: "Genghis Khan", es: "Genghis Khan", fr: "Genghis Khan"}
summary:
  ar: "قام مقام ابن عمته دوش خان سلطان إحدى ممالك الصين الست فانضم إليه خلق من المغول فاستشاط القان الأكبر غضباً فتحالف هو وكشلوخان على التعاضد فكسروا القان وملكوا بلاده واستمر الملك بينهما على المشاركة ثم وثب على ولد كشلوخان واستقل ودانت له التتار واعتقدوا فيه الإلهية وبالغوا في طاعته، وكان أول خروجهم سنة ست وست مئة إلى نواحي الترك وفرغانة، وأرسل إلى خوارزم شاه رسلاً وهدايا يطلب المسالمة فلما غدر خوارزم شاه بالتجار وقتل الرسل سار إليه فأباده وأباد مملكته {cite:tarikh-khulafa-minhaj-1434 p. 712-714}. وفي شذرات الذهب اتفق موته في رمضان سنة أربع وعشرين وست مئة قبل مصاف جلال الدين بأيام وهو طاغية التتار وسلطانهم الأعظم الذي خرب البلاد وأباد الأمم وهو الذي جيش الجيوش وخرج بهم من بادية الصين فدانت له المغول وعقدوا له عليهم وأطاعوه ولا طاعة الأبرار للملك القهار واسمه قبل الملك تمرجين ومات على الكفر وكان من دهاة العالم وأفراد الدهر وعقال الترك وهو جد ابني العم بركة وهولاكو {cite:shadharat-dhahab p. 113}."
  en: "Rising through his aunt's dead husband's kingdom, Genghis allied with Kashlukhan against the great Qan, broke him, then seized sole rule — the Tatars held him divine and obeyed utterly. Their first ride was 606; when Khwarazmshah's men broke faith with the traders and killed the envoys, Genghis wiped out him and his realm {cite:tarikh-khulafa-minhaj-1434 p. 712-714}."
  ur: "منگول حکمران جس کے عہد میں منگول افواج نے خوارزم شاہی علاقوں پر حملہ کیا؛ مسلمان مؤرخین نے ان مہمات اور ان سے ہونے والی تباہی کو قلم بند کیا۔ {cite:shadharat-dhahab}"
  es: "Ascendiendo desde el reino del difunto esposo de su tía, Gengis Kan se alió con Kashlukhan contra el gran Qan, lo derrotó y luego tomó el poder absoluto; los tártaros lo veneraban y le obedecían por completo. Su primer viaje fue en 606; cuando los hombres de Khwarazmshah traicionaron a los comerciantes y mataron a los enviados, Gengis Kan lo aniquiló a él y a su reino {cite:tarikh-khulafa-minhaj-1434 p. 712-714}."
  fr: "S'élevant à travers le royaume du défunt mari de sa tante, Gengis Khan s'allia à Kashlukhan contre le grand Qan, le vainquit, puis s'empara du pouvoir absolu. Les Tatars le vénéraient comme un dieu et lui obéissaient sans réserve. Leur première chevauchée eut lieu en 606; lorsque les hommes de Khwarezmshah trahirent les marchands et massacrèrent les envoyés, Gengis Khan l'anéantit, lui et son royaume."
  tr: "Çin'in altı krallığından birinin sultanı olan kuzeni Dush Han'ın konumuna yükseldi ve bir grup Moğol ona katıldı. Büyük Qan öfkelendi, bu yüzden o ve Kaşlu Han birleşip Qan'ı kırmak ve topraklarını yönetmek için ittifak kurdu. Kral onlarla paylaşmaya devam etti, sonra Kaşlukhan'ın oğluna saldırdı, bağımsız oldu ve Tatarlar onu ilahi ve aşırı itaat olarak kabul ederek teslim oldular. İlk yolculukları 6600 Hicri yılında Türkler ve Fergana bölgelerine oldu. Harezm Şah'a barış için elçiler ve hediyeler gönderdi. Horezm Şah tüccarları satıp elçileri öldürdüğünde, ona yürüdü, onu yok etti ve krallığını yok etti {cite:History-Khulafa-minhaj-1434, s. 712-714}. Şadharat al-Dhahab'da ölümü, 2604 H.C. yılının Ramazan ayına denk geldi; bu, Celaldin'in ölümünden birkaç gün önceydi. O, Tatarların zorbası ve ülkeyi yok eden ve ulusları yok eden en büyük sultanıydı. Orduları yöneten ve onları Çin çölünden çıkaran oydu, fakat Moğollar ona teslim oldu, onunla antlaşmalar yaptı ve itaat etti. Doğrular Yüce Kral'a itaat etmedi. Kral Tamarjin'in önündeki adı, inançsızlıkla ölmesiydi. O, dünyanın ve dönemin en kurnaz adamlarından biri, Türklerin Aql'ıydı. Kuzenler Baraka ve Hulagu'nun atasıydı {cite:shadharat-dhahab s. 113}."
  id: "Ia naik jabatan sepupunya Dush Khan, Sultan salah satu dari enam kerajaan Tiongkok, dan sekelompok Mongol bergabung dengannya. Qan Agung menjadi marah, sehingga ia dan Kashlu Khan bersekutu untuk bersatu dan memecah Qan serta memerintah wilayahnya. Raja terus berbagi dengan mereka, kemudian menyerang putra Kashlukhan, menjadi merdeka, dan bangsa Tatar tunduk, percaya bahwa dia adalah ilahi dan terlalu taat kepadanya. Keberangkatan pertama mereka adalah pada tahun 6600 H ke wilayah Turki dan Fergana. Ia mengirim utusan dan hadiah kepada Khwarezm Shah untuk mencari perdamaian. Ketika Khwarezm Shah mengkhianati para pedagang dan membunuh utusan, ia berbaris ke arahnya, memusnahkannya, dan memusnahkan kerajaannya {cite:History-Khulafa-minhaj-1434, hlm. 712-714}. Di Shadharat al-Dhahab, kematiannya bertepatan dengan Ramadan tahun 2604 H, beberapa hari sebelum kematian Jalal al-Din. Ia adalah tiran Tatar dan sultan terbesar mereka yang menghancurkan negara dan memusnahkan bangsa-bangsa. Ia adalah orang yang memimpin pasukan dan memimpin mereka keluar dari gurun Tiongkok, tetapi bangsa Mongol menyerah kepadanya, membuat perjanjian dengannya, dan menaatinya. Orang benar tidak menaati raja Yang Maha Kuasa. Namanya di hadapan Raja Tamarjin adalah bahwa ia meninggal dalam ketidakpercayaan. Ia adalah salah satu orang licik di dunia dan rakyat pada zamannya, serta Aql bangsa Turki. Ia adalah leluhur sepupu Baraka dan Hulagu {cite:shadharat-dhahab hlm. 113}."
