summary:
  ar: "الشيخ صفي الدين الأردبيلي (650–735هـ/1252–1334م)، الجد الأكبر للشاه [[person/ismail-i-safavi|إسماعيل الصفوي]]؛ ينقل الصلابي أنه التفّ حوله عدد كبير من المريدين نتيجة دعوته ودعاته من المتصوفة والدراويش الذين نشروا دعوتهم في إيران وبعض أقاليم الدولة العثمانية والعراق وبلاد الشام {cite:dawlat-uthmaniyya-salabi p. 177}. ويزعم الكتاب أنه مارس التقية فكان مظهره يوحي بأنه سني من أتباع المذهب الشافعي، وأنه أُشيع انتسابه وأولاده إلى علي بن أبي طالب فصار لهم على ذلك الحق في المطالبة بالحكم — وهذا تصوير المؤلف لنشأة الدعوة الصفوية {cite:dawlat-uthmaniyya-salabi p. 177-178}."
  en: "Shaykh Safi al-Din al-Ardabili (650–735/1252–1334), great ancestor of Shah [[person/ismail-i-safavi|Ismail]]; al-Salabi records the great following of Sufis and dervishes that spread his call through Iran, Ottoman provinces, Iraq and Syria {cite:dawlat-uthmaniyya-salabi p. 177}. The book claims he practised dissimulation — outwardly a Shafi'i Sunni — while descent from Ali ibn Abi Talib was propagated for his line, giving them ground to claim rule; this is the author's framing of Safavid origins {cite:dawlat-uthmaniyya-salabi p. 177-178}."
