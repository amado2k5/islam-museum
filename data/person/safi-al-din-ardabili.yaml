summary:
  ar: "الشيخ صفي الدين الأردبيلي ⁦(650–735هـ/1252–1334م)⁩، الجد الأكبر للشاه [[person/ismail-i-safavi|إسماعيل الصفوي]]؛ ينقل الصلابي أنه التفّ حوله عدد كبير من المريدين نتيجة دعوته ودعاته من المتصوفة والدراويش الذين نشروا دعوتهم في إيران وبعض أقاليم الدولة العثمانية والعراق وبلاد الشام {cite:dawlat-uthmaniyya-salabi p. 177}. ويزعم الكتاب أنه مارس التقية فكان مظهره يوحي بأنه سني من أتباع المذهب الشافعي، وأنه أُشيع انتسابه وأولاده إلى علي بن أبي طالب فصار لهم على ذلك الحق في المطالبة بالحكم — وهذا تصوير المؤلف لنشأة الدعوة الصفوية {cite:dawlat-uthmaniyya-salabi p. 177-178}."
  en: "Shaykh Safi al-Din al-Ardabili (650–735/1252–1334), great ancestor of Shah [[person/ismail-i-safavi|Ismail]]; al-Salabi records the great following of Sufis and dervishes that spread his call through Iran, Ottoman provinces, Iraq and Syria {cite:dawlat-uthmaniyya-salabi p. 177}. The book claims he practised dissimulation — outwardly a Shafi'i Sunni — while descent from Ali ibn Abi Talib was propagated for his line, giving them ground to claim rule; this is the author's framing of Safavid origins {cite:dawlat-uthmaniyya-salabi p. 177-178}."
  es: "Shaykh Safi al-Din al-Ardabili (650–735/1252–1334), gran antepasado del Shah [[person/ismail-i-safavi|Ismail]]; al-Salabi registra el gran número de seguidores sufíes y derviches que difundieron su llamado por Irán, las provincias otomanas, Irak y Siria {cite:dawlat-uthmaniyya-salabi p. 177}. El libro afirma que practicó la disimulación —exteriormente un suní shafi'í— mientras que se propagaba la descendencia de Ali ibn Abi Talib para su linaje, dándoles una base para reclamar el poder; esta es la interpretación del autor sobre los orígenes safávidas {cite:dawlat-uthmaniyya-salabi p. 177-178}."
  fr: "Cheikh Safi al-Din al-Ardabili (650-735/1252-1334), ancêtre illustre du Shah Ismaïl. Al-Salabi relate l'important mouvement de soufis et de derviches qui diffusa son message à travers l'Iran, les provinces ottomanes, l'Irak et la Syrie (voir: Dawlat-Uthmaniyya-Salabi, p. 177). L'ouvrage affirme qu'il pratiquait la dissimulation – se présentant comme un sunnite chaféite – tout en faisant valoir une descendance d'Ali ibn Abi Talib pour sa lignée, ce qui leur permettait de revendiquer le pouvoir; telle est l'interprétation que l'auteur donne des origines safavides (voir: Dawlat-Uthmaniyya-Salabi, p. 177-178)."
  ur: "شیخ صفی الدین الاردبیلی (650-735/1252-1334)، شاہ کے عظیم اجداد [[شخص/اسماعیل صفوی|اسماعیل]]؛ الصلبی نے صوفیاء اور درویشوں کی عظیم پیروی کو درج کیا ہے جنہوں نے ایران، عثمانی صوبوں، عراق اور شام میں اپنی دعوت کو پھیلایا۔ 177}۔ کتاب میں دعویٰ کیا گیا ہے کہ اس نے تخریب کاری کی مشق کی - ظاہری طور پر ایک شافعی سنی - جبکہ علی ابن ابی طالب کی نسل کو ان کے سلسلے کے لیے پروپیگنڈہ کیا گیا، جس سے انھیں حکمرانی کا دعویٰ کرنے کی بنیاد فراہم کی گئی۔ یہ صفوی ماخذ کی مصنف کی تشکیل ہے {حوالہ:دولت عثمانیہ سلبی ص۔ 177-178}۔"
  tr: "Şeyh Safi el-Din el-Erdebili (650–735 Hicri / 1252–1334 M.S.), Şah'ın büyük büyükbabasıdır [[kişi/ismail-i-safavi|İsmail el-Safavi]]]; el-Sallabi, çağrısı sonucunda çok sayıda müridin etrafında toplandığını ve vaizlerinin, İran, bazı Osmanlı eyaletleri, Irak ve Şam'da çağrılarını yayan Sufiler ve Dervişler arasında olduğunu bildirir {alıntı:Dawlat-Uthmaniyya-Salabi s. 177}. Kitap, onun takiyye uyguladığını iddia eder; bu nedenle görünüşü onun Sünni ve Şafii mezhebi takipçisi olduğunu ve kendisinin ve oğullarının Ali ibn Ebi Talib'e olan soyunun geniş çapta bilindiğini ve böylece onlara iktidarı talep etme hakkı verdiğini belirtir — bu, yazarın Safevi çağrısının ortaya çıkışını tasvir etmesidir {cite:dawlat-uthmaniyya-salabi s. 177-178}."
  id: "Sheikh Safi al-Din al-Ardabili (650–735 H / 1252–1334 M), buyut Shah [[orang/ismail-i-safavi|Ismail al-Safavi]]; al-Sallabi melaporkan bahwa sejumlah besar murid berkumpul di sekitarnya sebagai hasil dari panggilannya dan para pengkhotbahnya di antara para Sufi dan dervish yang menyebarkan seruan mereka di Iran, beberapa provinsi Ottoman, Irak, dan Levant {cite:Dawlat-Uthmaniyya-Salabi hlm. 177}. Buku tersebut mengklaim bahwa ia mempraktikkan taqiyya, sehingga penampilannya menunjukkan bahwa ia adalah Sunni dan pengikut aliran Shafi'i, dan garis keturunan dirinya dan putranya dengan Ali ibn Abi Talib menjadi dikenal luas, sehingga memberi mereka hak untuk mengklaim kekuasaan — ini adalah gambaran penulis tentang munculnya panggilan Safavid {cite:dawlat-uthmaniyya-salabi hlm. 177-178}."
