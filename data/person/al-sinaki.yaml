summary:
  ar: "كاتب عمائر جامع دمشق، فاضل أديب كثير التواضع وله شعر؛ رتب ناظراً بدار الضرب فجاءه شخص وسأله أن يترك عنده صندوقاً وديعة إلى أن يقدم من الحجاز فأحضره ولا يعرف ما فيه، ثم كُتب إلى الأمير طيبرس الوزيري أن عنده صندوقاً فيه سكك لعمل الزغل فكُبس بيته ووجد الصندوق فلم يقبل قوله في الاعتذار فاشتهر في دمشق على صورة قبيحة وأنفي منها، فأرسل من الطريق إلى رفيق له: بلادي وإن جارت عليّ عزيزة؛ ما أنا إلا المسك في غير أرضكم يضيع {cite:shadharat-dhahab p. 546-547}."
  en: "Katib of the Umayyad Mosque's building-works, then overseer of the mint — a deposit-box left by a pilgrim proved to hold dies for false coin; his house was raided, his excuse refused, and he was driven from Damascus in disgrace, sending back the verse: 'my land, though it wrong me, is dear — I am but musk that is lost outside your soil' {cite:shadharat-dhahab p. 546-547}."
  fr: "Katib des bâtiments de la mosquée omeyyade, alors surveillant de la monnaie – un coffre laissé par un pèlerin s’est avéré contenir des matrices pour fausse pièce de monnaie ; Sa maison a été perquisitionnée, son excuse refusée, et il a été chassé de Damas en disgrâce, renvoyant le verset : « Mon pays, bien que cela me fasse du tort, est cher - je ne suis que du musc perdu en dehors de votre sol » {cite:shadharat-dhahab p. 546-547}."
  es: "Katib, de las obras de construcción de la Mezquita Omeya, y luego supervisor de la ceca, descubrió que una caja de depósito dejada por un peregrino contenía troqueles para falsificar monedas; allanaron su casa, rechazaron su excusa y lo expulsaron de Damasco en desgracia, enviando de vuelta el verso: «Mi tierra, aunque me haga daño, es preciosa; no soy más que almizcle perdido fuera de tu suelo» {cita: shadharat-dhahab págs. 546-547}."
  ur: "اموی مسجد کے تعمیراتی کام کے کاتب، پھر ٹکسال کے نگران - ایک حاجی کے ذریعہ چھوڑا گیا ڈپازٹ باکس جھوٹے سکے کے لیے مرنے والا ثابت ہوا۔ اس کے گھر پر چھاپہ مارا گیا، اس کے عذر نے انکار کر دیا، اور اسے ذلت کے ساتھ دمشق سے نکال دیا گیا، اس آیت کو واپس بھیج دیا: 'میری زمین، اگرچہ اس نے مجھ پر ظلم کیا، عزیز ہے - میں تو وہ مشک ہوں جو تیری مٹی سے باہر گم ہو گئی ہے'۔ 546-547}۔"
  tr: "Şam Camii binalarının katibi, erdemli bir yazar, çok alçakgönüllü ve şair; damıtımevinin gözetmenliği için atandı. Bir adam yanına gelip Hicaz'dan dönene kadar yanında bir depozito bırakmasını istedi, ama içinde ne olduğunu bilmeden getirdi. Sonra Prens Taybars el-Veziri'ye Zaghl yapmak için raylar içeren bir kutu olduğunu yazdı. Evini bastırdı ve kutuyu buldu, ama özrünü kabul etmedi. Şam'da çirkin bir imajıyla ünlü oldu ve bu hakkı reddedildi. Yoldan bir arkadaşına mesaj gönderdi: Ülkem, bana haksızlık etse de, değerlidir; ben senin ülken dışında bir diyarda kaybolmuş miskten başka bir şeyim {atıf: shadharat-dhahab s. 546-547}."
  id: "Juru tulis bangunan Masjid Damaskus, seorang penulis yang berbudi luhur, sangat rendah hati dan seorang penyair; ia diangkat menjadi pengawas di penyulingan. Seorang pria datang kepadanya dan memintanya meninggalkan kotak deposit sampai ia kembali dari Hijaz, tetapi ia membawanya tanpa tahu isi sana. Kemudian ia menulis kepada Pangeran Taybars al-Waziri bahwa ia memiliki kotak berisi pagar untuk membuat Zaghl. Ia menekan rumahnya dan menemukan kotak itu, tetapi ia tidak menerima permintaan maafnya. Ia menjadi terkenal di Damaskus karena sebuah gambar jelek dan ditolak. Ia mengirim pesan dari jalan kepada seorang sahabat: Negaraku, meskipun tidak adil bagiku, sangat berharga; aku hanyalah bau yang hilang di negeri selain milikmu {cite:shadharat-dhahab hlm. 546-547}."
