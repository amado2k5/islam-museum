summary:
  ar: "كاتب عمائر جامع دمشق، فاضل أديب كثير التواضع وله شعر؛ رتب ناظراً بدار الضرب فجاءه شخص وسأله أن يترك عنده صندوقاً وديعة إلى أن يقدم من الحجاز فأحضره ولا يعرف ما فيه، ثم كُتب إلى الأمير طيبرس الوزيري أن عنده صندوقاً فيه سكك لعمل الزغل فكُبس بيته ووجد الصندوق فلم يقبل قوله في الاعتذار فاشتهر في دمشق على صورة قبيحة وأنفي منها، فأرسل من الطريق إلى رفيق له: بلادي وإن جارت عليّ عزيزة؛ ما أنا إلا المسك في غير أرضكم يضيع {cite:shadharat-dhahab p. 546-547}."
  en: "Katib of the Umayyad Mosque's building-works, then overseer of the mint — a deposit-box left by a pilgrim proved to hold dies for false coin; his house was raided, his excuse refused, and he was driven from Damascus in disgrace, sending back the verse: 'my land, though it wrong me, is dear — I am but musk that is lost outside your soil' {cite:shadharat-dhahab p. 546-547}."
