class: person
label: { ar: "محمد بن إدريس الشافعي", en: "Muhammad ibn Idris al-Shafi'i" }
summary:
  ar: "إمام المذهب الشافعي المطلبي، مات في أيام المأمون، وعند السيوطي قال المتوكل واحسرتي على محمد بن إدريس الشافعي كنت أحب أن أكون في أيامه فأراه وأتعلم منه فإني رأيت رسول الله في المنام يقول إن محمد بن إدريس المطلبي قد صار إلى رحمة الله وخلف فيكم علماً حسناً فاتبعوه تهتدوا ثم دعا أن يسهل عليه حفظ مذهبه، وقال السيوطي استفدنا من هذا أن المتوكل كان متمذهباً بمذهب الشافعي وهو أول من تمذهب له من الخلفاء {cite:tarikh-khulafa-minhaj-1434 p. 518-519,545-546}. وعند المسعودي توفي في رجب ليلة الجمعة سنة أربع ومائتين ودفن صبيحة الليلة وهو ابن أربع وخمسين سنة وصلى عليه السري بن الحكم أمير مصر، ودفن بحومة قبور الشهداء في مقبرة بني عبد الحكم وعلى العمود عند رأسه حفر هذا قبر محمد بن إدريس الشافعي أمين الله، وروى فقير بن مسكين عن المزني أنه دخل عليه غداة وفاته فقال أصبحت من الدنيا راحلاً وبكأس المنية شارباً وأنشأ ولما قسا قلبي وضاقت مذاهبي جعلت الرجا مني لعفوك سلماً {cite:muruj-al-dhahab p. 417-418}"
  en: "Imam of the Shafi'i madhhab, died in al-Ma'mun's days; per al-Suyuti, al-Mutawakkil said 'my grief over Muhammad ibn Idris — I wished I lived in his days to learn from him, for I dreamt the Prophet saying he left you a good science: follow it and be guided' — whence al-Suyuti concludes al-Mutawakkil was the first caliph to adopt a madhhab {cite:tarikh-khulafa-minhaj-1434 p. 518-519,545-546}."
