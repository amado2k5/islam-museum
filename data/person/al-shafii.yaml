label: { ar: "محمد بن إدريس الشافعي", en: "Muhammad ibn Idris al-Shafi'i" }
summary:
  ar: "إمام المذهب الشافعي المطلبي، ولد سنة 150هـ/767م في غزة أو عسقلان أو اليمن بحسب الروايات، ونشأ يتيمًا في مكة، ولازم مالك بن أنس في المدينة، ثم مرّ بمحنة بين يدي هارون الرشيد وعاش في العراق، واستقر أخيرًا في الفسطاط حيث كتب النسخة الباقية من الرسالة وأكثر كتاب الأم. توفي سنة 204هـ/820م ودُفن عند سفح المقطم. وتعدّ مقالة دائرة المعارف الإسلامية إسهامه في أصول الفقه تحديدًا للأصول وترتيبًا لها، ومنها حصر السنة في ما ثبت عن النبي وتنظيم القياس. وفي الصفحة أيضًا ما رواه السيوطي والمسعودي عن وفاته ومكانته."
  en: "Imam of the Shafi'i school, born in 150/767 at Gaza, Ashkelon or Yemen according to different reports, raised an orphan in Mecca, a pupil of Malik ibn Anas in Medina, who passed through a crisis before Harun al-Rashid, lived in Iraq, and finally settled at Fustat, where he wrote the surviving Risala and most of the Umm. He died in 204/820 and was buried at the foot of the Muqattam hills. The Encyclopaedia of Islam article describes his contribution to legal theory as defining and ranking the sources, including limiting the Sunna to what is firmly reported of the Prophet and systematising analogy. The page also keeps what al-Suyuti and al-Mas'udi report of his death and standing."
  ur: "شافعی مذہب کے امام، 150ھ/767ء میں مختلف روایات کے مطابق غزہ، عسقلان یا یمن میں پیدا ہوئے، مکہ میں یتیمی میں پلے، مدینہ میں مالک بن انس کے شاگرد رہے، ہارون الرشید کے سامنے ایک ابتلا سے گزرے، عراق میں رہے، اور آخر میں فسطاط میں بسے جہاں انھوں نے رسالہ کا موجودہ نسخہ اور الام کا بڑا حصہ لکھا۔ ان کی وفات 204ھ/820ء میں ہوئی اور وہ مقطم کے دامن میں دفن ہوئے۔ انسائیکلوپیڈیا آف اسلام کا مقالہ اصول فقہ میں ان کی خدمت کو ماخذ کی تعریف اور ترتیب بتاتا ہے، جس میں سنت کو نبی سے ثابت امور تک محدود کرنا اور قیاس کو منظم کرنا شامل ہے۔ صفحے میں سیوطی اور مسعودی کی ان کی وفات اور مقام سے متعلق روایات بھی محفوظ ہیں۔"
