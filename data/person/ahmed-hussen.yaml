summary:
  ar: "محامٍ وسياسي ليبرالي صومالي كندي، أول صومالي كندي يُنتخب لبرلمان كندا، يمثّل دائرة يورك الجنوبية—وستون (يورك الجنوبية—وستون—إتوبيكوك منذ 2025) منذ 2015، وتولّى وزارات الهجرة والعائلات والإسكان والتنمية الدولية بين 2017 و2025."
  en: "Somali-Canadian lawyer and Liberal politician, the first Somali-Canadian elected to Canada's Parliament, who has represented York South—Weston (York South—Weston—Etobicoke since 2025) since 2015 and served as minister of immigration, families and social development, housing and diversity and inclusion, and international development between 2017 and 2025."
  ur: "صومالی نژاد کینیڈین وکیل اور لبرل سیاست دان، کینیڈا کی پارلیمنٹ کے لیے منتخب ہونے والے پہلے صومالی کینیڈین، جو 2015 سے یارک ساؤتھ—ویسٹن (2025 سے یارک ساؤتھ—ویسٹن—ایٹوبیکوک) کی نمائندگی کر رہے ہیں اور 2017 سے 2025 کے درمیان امیگریشن، خاندان، ہاؤسنگ اور بین الاقوامی ترقی کے وزیر رہے۔"
