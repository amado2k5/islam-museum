summary:
  ar: "محارب بن حسان، فتى الفتيان، المحفوظ عن النقص والخسران، المتحصن بحصن اليقين والإيمان. كان محرمًا في مسجد الخيف فنظر إلى غلام، فلما نُبّه قال: منعني عن الوقوع في شرك إبليس ثلاث: ستر الإيمان، وعفة الإسلام، وحياء من الله أن يطلع عليّ وأنا على منكر نهاني عنه."
  en: "Muharib ibn Hassan, the best of young men, kept from loss and ruin, fortified by certainty and faith. While in the state of ihram at Masjid al-Khayf, he looked at a handsome youth from the Maghrib; when Khayr al-Nassaj warned him of the sanctity of the place and the time, he answered that three things had kept him from falling into the snare of Iblis: the covering of faith, the chastity of Islam, and, greatest of all, shame before God that He should see him committing what He had forbidden; then he fainted until the people gathered around them."
  ur: "محارب بن حسان، نوجوانوں کے سردار، نقصان اور خسارے سے محفوظ اور یقین و ایمان کے قلعے میں پناہ گزین۔ مسجد خیف میں احرام کی حالت میں انہوں نے ایک خوبصورت مغربی نوجوان کی طرف دیکھا؛ جب خیر نساج نے وقت اور جگہ کی حرمت یاد دلائی تو انہوں نے کہا کہ تین چیزوں نے انہیں ابلیس کے جال میں گرنے سے روکا: ایمان کا پردہ، اسلام کی پاکدامنی، اور سب سے بڑھ کر اللہ سے حیا کہ وہ انہیں اس حال میں دیکھے کہ وہ اس برائی میں ہوں جس سے اس نے منع کیا؛ پھر وہ بے ہوش ہو گئے یہاں تک کہ لوگ جمع ہو گئے۔"
  es: "Muharib ibn Hassan, el mejor de los jóvenes, se mantuvo a salvo de la pérdida y la ruina, fortalecido por la certeza y la fe. Mientras se encontraba en estado de ihram en la Mezquita de al-Khayf, vio a un apuesto joven del Magreb; cuando Khayr al-Nassaj le advirtió sobre la santidad del lugar y del momento, respondió que tres cosas lo habían mantenido alejado de la trampa de Iblis: el manto de la fe, la castidad del Islam y, sobre todo, la vergüenza ante Dios de que Él lo viera cometiendo lo que Él había prohibido; entonces se desmayó hasta que la gente se reunió a su alrededor."
  fr: "Muharib ibn Hassan, le plus brillant des jeunes hommes, préservé de la ruine et de la perdition, fortifié par la certitude et la foi, était en état d'ihram à la mosquée al-Khayf. Son regard se posa sur un beau jeune homme du Maghreb. Lorsque Khayr al-Nassaj l'avertit du caractère sacré du lieu et du moment, il répondit que trois choses l'avaient empêché de tomber dans le piège d'Iblis: la protection de sa foi, la pureté de l'islam et, par-dessus tout, la honte devant Dieu de le voir commettre l'interdit. Puis il s'évanouit, jusqu'à ce que la foule se rassemble autour d'eux."
  tr: "Genç Muharib bin Hassan, eksiklik ve kayıptan korunmuş, kesinlik ve iman kalesiyle güçlendirilmişti. El-Hayf Camii'nde yasak namaz halindeydi, bu yüzden bir çocuğa baktı. Beni uyardığında şöyle dedi: İblis'in tuzağına düşmemi üç şey engelledi: İnancı gizlemek, İslam'ın iffetini ve Allah huzurunda bana göstermek için alçakgönüllülüğü, ki bunu yasakladım."
  id: "Muharib ibn Hassan, pemuda muda, dilindungi dari kekurangan dan kehilangan, diperkuat dengan benteng kepastian dan iman. Dia dalam keadaan shalat terlarang di Masjid Al-Khayf, sehingga dia memandang seorang anak laki-laki. Ketika dia memperingatkan saya, dia berkata: Tiga hal mencegah saya jatuh ke dalam perangkap Iblis: menyembunyikan iman, kesucian Islam, dan kerendahan hati di hadapan Tuhan untuk menunjukkan kepada saya saat saya melakukan kesalahan, yang telah saya larang."
