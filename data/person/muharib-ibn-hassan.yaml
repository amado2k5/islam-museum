summary:
  ar: "محارب بن حسان، فتى الفتيان، المحفوظ عن النقص والخسران، المتحصن بحصن اليقين والإيمان. كان محرمًا في مسجد الخيف فنظر إلى غلام، فلما نُبّه قال: منعني عن الوقوع في شرك إبليس ثلاث: ستر الإيمان، وعفة الإسلام، وحياء من الله أن يطلع عليّ وأنا على منكر نهاني عنه."
  en: "Muharib ibn Hassan, the best of young men, kept from loss and ruin, fortified by certainty and faith. While in the state of ihram at Masjid al-Khayf, he looked at a handsome youth from the Maghrib; when Khayr al-Nassaj warned him of the sanctity of the place and the time, he answered that three things had kept him from falling into the snare of Iblis: the covering of faith, the chastity of Islam, and, greatest of all, shame before God that He should see him committing what He had forbidden; then he fainted until the people gathered around them."
  ur: "محارب بن حسان، نوجوانوں کے سردار، نقصان اور خسارے سے محفوظ اور یقین و ایمان کے قلعے میں پناہ گزین۔ مسجد خیف میں احرام کی حالت میں انہوں نے ایک خوبصورت مغربی نوجوان کی طرف دیکھا؛ جب خیر نساج نے وقت اور جگہ کی حرمت یاد دلائی تو انہوں نے کہا کہ تین چیزوں نے انہیں ابلیس کے جال میں گرنے سے روکا: ایمان کا پردہ، اسلام کی پاکدامنی، اور سب سے بڑھ کر اللہ سے حیا کہ وہ انہیں اس حال میں دیکھے کہ وہ اس برائی میں ہوں جس سے اس نے منع کیا؛ پھر وہ بے ہوش ہو گئے یہاں تک کہ لوگ جمع ہو گئے۔"
