  ar: بطاقة أولية لنوغاي خان، أمير القبيلة الذهبية الذي صار صانع الخانات فيها، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في الكامل لابن الأثير على الصفحة بعد، لذلك لا تُذكر هنا تواريخ.
  en: Draft card for Nogai Khan, the Golden Horde commander who became its kingmaker, named from an open reference description (Wikidata); his coverage in Ibn al-Athir's al-Kamil is not yet checked on the page, so no dates are given.
  es: "Ficha de borrador para Nogai Khan, el comandante de la Horda de Oro que se convirtió en su hacedor de reyes, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su cobertura en al-Kamil de Ibn al-Athir aún no se ha verificado en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet pour Nogai Khan, le commandant de la Horde d'Or qui en devint le faiseur de rois, nommé d'après une description de référence ouverte (Wikidata); sa couverture dans al-Kamil d'Ibn al-Athir n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "نوگئی خان کے لیے ڈرافٹ کارڈ، گولڈن ہارڈ کمانڈر جو اس کا کنگ میکر بن گیا، جس کا نام کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ ابن الثیر کے الکامل میں اس کی کوریج ابھی تک صفحہ پر چیک نہیں کی گئی ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
