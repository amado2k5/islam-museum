summary:
  ar: "أبو بكر محمد بن السري بن سهل المعروف بابن السراج النحوي؛ أخذ الأدب عن أبي العباس المبرد وغيره وأخذ عنه جماعة من الأعيان منهم أبو سعيد السيرافي وعلي بن عيسى الرماني ونقل عنه الجوهري في الصحاح مواضع عديدة؛ له التصانيف المشهورة في النحو منها كتاب الأصول وهو من أجود الكتب المصنفة في هذا الشأن وإليه المرجع عند اضطراب النقل واختلافه، وكتاب جمل الأصول والموجز والاشتقاق وشرح كتاب سيبويه واحتجاج القراء والشعر والشعراء والرياح والحواء والنار والجمل والمواصلات؛ كان يلثغ في الراء فيجعلها غيناً {cite:wafayat-ayan}."
  en: "Abu Bakr Ibn al-Sarraj — the great Baghdadi grammarian, al-Mubarrad's pupil and teacher of al-Sirafi and al-Rummani; author of al-Usul ('the reference when transmissions differ'), a commentary on Sibawayh's Kitab and many other works {cite:wafayat-ayan}."
