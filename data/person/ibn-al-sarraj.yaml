class: person
label: { ar: "ابن السراج", en: "Ibn al-Sarraj", es: "Ibn al-Sarraj", fr: "Ibn al-Sarraj", ur: "ابن السراج" }
summary:
  ar: "أبو بكر محمد بن السري بن سهل المعروف بابن السراج النحوي؛ أخذ الأدب عن أبي العباس المبرد وغيره وأخذ عنه جماعة من الأعيان منهم أبو سعيد السيرافي وعلي بن عيسى الرماني ونقل عنه الجوهري في الصحاح مواضع عديدة؛ له التصانيف المشهورة في النحو منها كتاب الأصول وهو من أجود الكتب المصنفة في هذا الشأن وإليه المرجع عند اضطراب النقل واختلافه، وكتاب جمل الأصول والموجز والاشتقاق وشرح كتاب سيبويه واحتجاج القراء والشعر والشعراء والرياح والحواء والنار والجمل والمواصلات؛ كان يلثغ في الراء فيجعلها غيناً {cite:wafayat-ayan}."
  en: "Abu Bakr Ibn al-Sarraj — the great Baghdadi grammarian, al-Mubarrad's pupil and teacher of al-Sirafi and al-Rummani; author of al-Usul ('the reference when transmissions differ'), a commentary on Sibawayh's Kitab and many other works {cite:wafayat-ayan}."
  es: "Abu Bakr Ibn al-Sarraj — el gran gramático de Bagdad, discípulo de al-Mubarrad y maestro de al-Sirafi y al-Rummani; autor de al-Usul ('la referencia cuando las transmisiones difieren'), un comentario sobre el Kitab de Sibawayh y muchas otras obras {cite:wafayat-ayan}."
  fr: "Abou Bakr Ibn al-Sarraj — le grand grammairien bagdadien, élève d'al-Mubarrad et maître d'al-Sirafi et d'al-Rummani; auteur d'al-Usul (« la référence lorsque les transmissions divergent »), un commentaire sur le Kitab de Sibawayh et de nombreuses autres œuvres {cite:wafayat-ayan}."
  ur: "ابو بکر ابن السراج - عظیم بغدادی گرامر، المبراد کے شاگرد اور الصرافی اور الرمانی کے استاد؛ الصول کے مصنف ⁦('ریفرنس جب ٹرانسمیشنز مختلف ہوں')⁩، سباویہ کی کتاب اور بہت سی دوسری تصانیف کی تفسیر"
  tr: "Ebu Bekir Muhammed ibn el-Sari bin Sahl, dilbilgisi İbn el-Sirec olarak bilinir; edebiyatı Ebu el-Abbas el-Mübarrad ve diğerlerinden öğrendi; ayrıca onun altında eğitim aldığı bir grup önemli şahsiyet, arasında Ebu Seyid el-Sirafi ve Ali bin İsa el-Rumani de vardı. El-Cevhari, el-Siha'da birçok yerde ondan alıntılar yaptı; en iyilerden biri olan İlkeler Kitabı da dahil olmak üzere dilbilgisi alanında ünlü eserler yazdı. bu konuda eserler ve karmaşık ve farklı aktarımlar için bir referans kaynağıdır. Ayrıca 'Jumal el-Usul', 'al-Mujasr', 'Ishtiqaq', 'Sharh al-Sibawayh', 'İhtiyat al-Qur'an' (Okunanların Argümanları), şiir, şairler, rüzgarlar, Havva, ateş, develer ve 'al-Muwasulat' eserlerini de yazmıştır; 'ra'yı kusardı, bu da onu tekil yapardı (kaynak: Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn al-Sari ibn Sahl, dikenal sebagai Ibn al-Siraj sang ahli tata bahasa; ia mempelajari sastra dari Abu al-Abbas al-Mubarrad dan lainnya, serta sekelompok tokoh terkenal yang belajar di bawah bimbingannya, termasuk Abu Sa'id al-Sirafi dan Ali ibn Isa al-Rumani. Al-Jawhari mengutip darinya di banyak tempat dalam al-Sihah; ia menulis karya-karya terkenal dalam bidang tata bahasa, termasuk Kitab Prinsip, yang merupakan salah satu karya terbaik tentang subjek ini dan menjadi referensi untuk transmisi yang membingungkan dan berbeda. Ia juga menulis 'Jumal al-Usul', 'al-Mujasr', 'Ishtiqaq', 'Sharh al-Sibawayh', 'Ihtijat al-Qur'an' (Argumen Para Penbaca), puisi, penyair, angin, Hawa, api, unta, dan 'al-Muwasulat'; ia akan memuntahkan 'ra', menjadikannya tunggal (kutip: wafayat-ayan}."
