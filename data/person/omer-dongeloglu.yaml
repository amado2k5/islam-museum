summary:
  ar: "عالم دين وكاتب ومنتج ومقدّم تلفزيوني تركي، وُلد سنة 1968 في زيله بولاية طوكات وتوفي بكوفيد-19 في 3 مايو 2020 في إسطنبول، تخرّج في كلية الإلهيات بجامعة سقاريا، وعمل إمامًا وخطيبًا في طوكات بين 1986 و1996، واشتهر ببرامجه الدينية على قناة كنال 7 وبأبحاثه في السيرة النبوية. قناته على يوتيوب قناة إرث أُنشئت بعد وفاته وبلغت 339,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish theologian, writer, producer and television presenter, born in 1968 in Zile, Tokat, and died of COVID-19 on 3 May 2020 in Istanbul. He graduated from Sakarya University's theology faculty, worked as an imam-hatip in Tokat between 1986 and 1996, and was known for his religious programmes on Kanal 7 and his research on the sirah. His YouTube channel is a posthumous legacy channel, created after his death, which counted 339,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک عالمِ دین، مصنف، پروڈیوسر اور ٹیلی ویژن میزبان، جو 1968ء میں طوکات کے علاقے زیلے میں پیدا ہوئے اور 3 مئی 2020ء کو استنبول میں کووڈ-19 سے وفات پائی، سقاریا یونیورسٹی کے شعبۂ الہیات سے فارغ التحصیل ہوئے، 1986ء تا 1996ء طوکات میں امام خطیب رہے، اور کنال 7 پر اپنے دینی پروگراموں اور سیرت پر اپنی تحقیق کے لیے جانے گئے۔ ان کا یوٹیوب چینل ان کی وفات کے بعد قائم ہوا میراثی چینل ہے؛ vidIQ کے مطابق 15 نومبر 2026ء کو اس کے سبسکرائبر 339,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Teólogo, escritor, productor y presentador de televisión turco, nacido en 1968 en Zile, Tokat, y fallecido por COVID-19 el 3 de mayo de 2020 en Estambul. Se graduó en la facultad de teología de la Universidad de Sakarya, trabajó como imán en Tokat entre 1986 y 1996, y fue conocido por sus programas religiosos en Kanal 7 y su investigación sobre la sirah. Su canal de YouTube es un canal póstumo, creado tras su muerte, que contaba con 339 000 suscriptores al 15 de noviembre de 2026 según vidIQ (dato desactualizado de la plataforma, no verificado por ningún museo)."
  fr: "Théologien, écrivain, producteur et présentateur de télévision turc, né en 1968 à Zile, dans le département de Tokat, il est décédé de la COVID-19 le 3 mai 2020 à Istanbul. Diplômé de la faculté de théologie de l'université de Sakarya, il a exercé la fonction d'imam à Tokat de 1986 à 1996 et était connu pour ses émissions religieuses sur Kanal 7 et ses recherches sur la Sira. Sa chaîne YouTube, créée à titre posthume, comptait 339 000 abonnés au 15 novembre 2026 selon vidIQ – un chiffre ancien, non vérifié par un musée."
  tr: "Türk dini alim, yazar, yapımcı ve televizyon sunucusu, 1968'de Tokat vilayetinin Zeile şehrinde doğdu ve 3 Mayıs 2020'de İstanbul'da COVID-19'dan hayatını kaybetti. Sakarya Üniversitesi İlahiyat Fakültesi'nden mezun oldu ve 1986-1996 yılları arasında Tok'ta imam ve vaiz olarak çalıştı. Kanal 7 üzerine dini programları ve Peygamber'in biyografisi üzerine yaptığı araştırmalarla ün kazandı. YouTube kanalı Irth Channel, 15 Kasım 2026 itibarıyla 339.000 aboneye ulaştı; vidIQ, müze tarafından doğrulanmış bilgi içermeyen tarihçi platform numarasına göre."
  id: "Seorang cendekiawan agama Turki, penulis, produser, dan pembawa acara televisi, lahir pada tahun 1968 di Zeile, provinsi Tokat, dan meninggal karena COVID-19 pada 3 Mei 2020 di Istanbul. Ia lulus dari Fakultas Teologi Universitas Sakarya dan bekerja sebagai imam serta pengkhotbah di Tokat antara tahun 1986 dan 1996. Ia menjadi terkenal karena program keagamaannya di Kanal 7 dan penelitiannya tentang biografi Nabi. Saluran YouTube-nya, Irth Channel, didirikan secara anumerta dan mencapai 339.000 pelanggan per 15 November 2026, menurut vidIQ, sebuah nomor platform sejarawan yang tidak memiliki fakta yang diverifikasi oleh museum."
