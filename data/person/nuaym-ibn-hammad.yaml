summary:
  ar: "نعيم بن حماد راوية في إسناد حديث «لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به» — الحديث الحادي والأربعون من الأربعين — بين عبد الوهاب الثقفي وعبد الرحمن بن حاتم المرادي وابن واره؛ قال الحافظ أبو موسى المديني: هذا الحديث مختلف فيه على نعيم — وقيل فيه «حدثنا بعض شيختنا حدثنا هشام أو غيره» — وقال ابن رجب: تصحيح هذا الحديث بعيد جداً من وجوه منها أنه يتفرد به نعيم بن حماد (جامع العلوم والحكم ص 824–825)."
  en: "Nu'aym ibn Hammad, a narrator in the chain of 'none of you believes until his desire follows what I have brought' — the forty-first hadith of the Forty — between Abd al-Wahhab al-Thaqafi and Abd al-Rahman ibn Hatim al-Maradi and Ibn Wara'; the memoriser Abu Musa al-Madini said 'this hadith is disputed over Nu'aym', the chain also running 'one of our shaykhs — Hisham or another — told us'; and Ibn Rajab held grading it sound very remote for reasons including that Nu'aym ibn Hammad alone narrates it (Jami' al-Ulum wal-Hikam pp. 824–825)."
