summary:
  ar: "مغنية وممثلة مصرية (1898–1975)، لُقّبت بـ«كوكب الشرق» و«صوت مصر» و«الهرم الرابع»؛ أشهر مطربات العالم العربي في القرن العشرين، إذ جمعت حفلاتها الإذاعية الشهرية المستمعين في أنحاء العالم العربي نحو أربعين عامًا، وبقي صوتها رمزًا ثقافيًا لمصر بعد رحيلها."
  en: "Egyptian singer and film actress (1898–1975), known as Kawkab al-Sharq ('Star of the East'), 'the Voice of Egypt' and 'Egypt's Fourth Pyramid'. She was the most celebrated Arab singer of the twentieth century: her monthly radio concerts drew listeners across the Arab world for some forty years, and her voice has remained a cultural emblem of Egypt since her death."
  ur: "مصری گلوکارہ و اداکارہ (1898ء–1975ء)، جو «کوکب الشرق»، «مصر کی آواز» اور «مصر کا چوتھا ہرم» کے القاب سے مشہور ہیں؛ بیسویں صدی کی سب سے نامور عرب گلوکارہ، جن کے ماہانہ ریڈیو کنسرٹس نے تقریباً چالیس برس تک پورے عرب دنیا کے سامعین کو محو رکھا۔"
