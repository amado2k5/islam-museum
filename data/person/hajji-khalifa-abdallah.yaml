summary:
  ar: "الشيخ عبد الله المشهور بحاجي خليفة أصله من ولاية قسطموني واشتغل بالعلوم الظاهرة أولاً فأتقنها ثم اتصل بخدمة الشيخ تاج الدين بن بخشى وحصل عنده طريقة الصوفية حتى أجازه بالإرشاد وأقامه مقامه بعد وفاته وكان جامعاً للعلوم والمعارف متواضعاً متخشعاً صاحب أخلاق حميدة وآثار سعيدة مظهراً للخيرات والبركات صاحب كرامات مرجعاً للعلماء والفضلاء مربياً للفقراء والصلحاء آية في الكرم والفتوة كثير البشر جميل الخلق والخلق، توفي في سلخ جمادى الآخرة سنة أربع وتسعين وثمانمائة {cite:shadharat-dhahab p. 356}."
  en: "Hajji Khalifa of Kastamonu — the exoteric sciences mastered first, then Taj al-Din ibn Bakhshi's successor in the Sufi path, 'an aya in generosity and futuwwa'; died end of Jumada II 894 {cite:shadharat-dhahab p. 356}."
