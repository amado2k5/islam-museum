summary:
  ar: "الشيخ عبد الله المشهور بحاجي خليفة أصله من ولاية قسطموني واشتغل بالعلوم الظاهرة أولاً فأتقنها ثم اتصل بخدمة الشيخ تاج الدين بن بخشى وحصل عنده طريقة الصوفية حتى أجازه بالإرشاد وأقامه مقامه بعد وفاته وكان جامعاً للعلوم والمعارف متواضعاً متخشعاً صاحب أخلاق حميدة وآثار سعيدة مظهراً للخيرات والبركات صاحب كرامات مرجعاً للعلماء والفضلاء مربياً للفقراء والصلحاء آية في الكرم والفتوة كثير البشر جميل الخلق والخلق، توفي في سلخ جمادى الآخرة سنة أربع وتسعين وثمانمائة {cite:shadharat-dhahab p. 356}."
  en: "Hajji Khalifa of Kastamonu — the exoteric sciences mastered first, then Taj al-Din ibn Bakhshi's successor in the Sufi path, 'an aya in generosity and futuwwa'; died end of Jumada II 894 {cite:shadharat-dhahab p. 356}."
  es: "Hajji Khalifa de Kastamonu: primero dominó las ciencias exotéricas, luego fue el sucesor de Taj al-Din ibn Bakhshi en el camino sufí, \"un verso de generosidad y futuwwa\"; murió a finales de Jumada II 894 {cita: shadharat-dhahab p. 356}."
  fr: "Hajji Khalifa de Kastamonu — maîtrisa d'abord les sciences exotériques, puis successeur de Taj al-Din ibn Bakhshi dans la voie soufie, « un vers de générosité et de futuwwa »; décédé fin Joumada II 894 {cite: shadharat-dhahab p. 356}."
  ur: "کسطامونو کے حاجی خلیفہ - پہلے خارجی علوم میں مہارت حاصل کی، پھر صوفی راہ میں تاج الدین ابن بخشی کے جانشین، 'سخاوت اور فتویٰ میں ایک آیا'؛ جمادی الثانی 894ء کے آخر میں وفات پائی۔ 356}۔"
  tr: "Şeyh Abdullah, Hacı Halife olarak bilinir, aslen Kassimuni eyaletindendir; başlangıçta bilimsel bilimlerle uğraşır, bunları ustalıkla öğrenir, ardından Şeyh Taceddin bin Bakhşi'nin hizmetine girmiştir; burada Sufi tarikatını almıştır; ölümünden sonra rehberlik yetkisi alıp konumunu sağlamlaştırmıştır. Bilim ve bilgi toplayıcıydı; alçakgönüllü ve alçakgönüllü, iyi ahlaklı ve olumlu miraslara sahip, nimetler ve nimetler gösteren, mucizeler adamı, alimler ve erdemliler için bir referans, fakirlerin ve doğruların öğretmeni, cömertlik ve fıkhihi simgesi, birçok güzel karakter ve karaktere sahip insanın simgesiydi. 894 Hicri yılında Cumedül-Ahira'nın teninde öldü {atıf:shadharat-dhahab, s. 356}."
  id: "Sheikh Abdullah, yang dikenal sebagai Haji Khalifa, berasal dari provinsi Qassimuni, awalnya mendalami ilmu yang tampak dan menguasainya, kemudian bergabung dengan pelayanan Sheikh Taj al-Din bin Bakhshi, di mana ia memperoleh tarekat Sufi hingga ia mendapat izin untuk membimbing dan menegakkan posisinya setelah wafat. Ia adalah seorang pengumpul ilmu pengetahuan dan ilmu, rendah hati dan rendah hati, memiliki moral yang baik dan warisan positif, memanifestasikan berkah dan berkat, seorang pria mukjizat, referensi bagi ulama dan orang berbudi luhur, guru bagi orang miskin dan orang yang benar, simbol kemurahan hati dan kebijaksanaan, bagi banyak orang dengan karakter dan karakter yang indah. Ia meninggal dalam kulit Jumada al-Akhirah pada tahun 894 H {cite:shadharat-dhahab, hlm. 356}."
