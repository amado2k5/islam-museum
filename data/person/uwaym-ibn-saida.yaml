summary:
  ar: "من الأنصار؛ لقي أبا بكر وعمر وأبا عبيدة في طريقهم إلى السقيفة مع معن بن عدي، فذكرا لهم ما اجتمع عليه القوم؛ وهو الذي نزل فيه عند ابن إسحاق قوله تعالى في رجال يحبون أن يتطهروا، والنبي قال فيه: نعم المرء منهم."
  en: "One of the Ansar who met Abu Bakr, Umar and Abu Ubayda on their way to Saqifa with Ma'n ibn Adi, and told them what the assembly had agreed; Ibn Ishaq says the Prophet praised him as an excellent man among them."
  ur: "انصار میں سے جو معن بن عدي کے ساتھ ابو بکر، عمر اور ابو عبیدہ سے ثقیفہ کے راستے میں ملا اور انہیں مجلس کے فیصلے کی خبر دی۔"
  es: "Uno de los Ansar que se encontró con Abu Bakr, Umar y Abu Ubayda de camino a Saqifa con Ma'n ibn Adi, y les comunicó lo que la asamblea había acordado; Ibn Ishaq dice que el Profeta lo elogió como un hombre excelente entre ellos."
  fr: "L'un des Ansar qui rencontra Abu Bakr, Umar et Abu Ubayda sur leur route vers Saqifa avec Ma'n ibn Adi, et leur rapporta ce que l'assemblée avait décidé; Ibn Ishaq dit que le Prophète le loua comme un homme excellent parmi eux."
