  ar: "من الأنصار؛ لقي أبا بكر وعمر وأبا عبيدة في طريقهم إلى السقيفة مع معن بن عدي، فذكرا لهم ما اجتمع عليه القوم؛ وهو الذي نزل فيه عند ابن إسحاق قوله تعالى في رجال يحبون أن يتطهروا، والنبي قال فيه: نعم المرء منهم."
  en: "One of the Ansar who met Abu Bakr, Umar and Abu Ubayda on their way to Saqifa with Ma'n ibn Adi, and told them what the assembly had agreed; Ibn Ishaq says the Prophet praised him as an excellent man among them."
