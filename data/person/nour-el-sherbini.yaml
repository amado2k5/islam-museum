summary:
  ar: "لاعبة اسكواش مصرية محترفة، وُلدت في الإسكندرية سنة 1995، بدأت اللعب في السادسة من عمرها، وأصبحت أصغر بطلة عالم للناشئين في تاريخ اللعبة سنة 2009، ثم فازت بثمانية ألقاب عالمية فردية (2015 و2016 و2018-19 و2019-20 و2020-21 و2022 و2023 و2025) معادلة الرقم القياسي لنيكول ديفيد، وتصدرت التصنيف العالمي مرات عدة."
  en: "Egyptian professional squash player, born in Alexandria in 1995. She took up the game at six, became the youngest world junior champion in the sport's history in 2009, and went on to win eight individual world titles (2015, 2016, 2018-19, 2019-20, 2020-21, 2022, 2023 and 2025), equalling Nicol David's all-time record, with several spells as world No. 1."
  ur: "مصری پیشہ ور اسکواش کھلاڑی، جو 1995 میں اسکندریہ میں پیدا ہوئیں۔ انہوں نے چھ سال کی عمر میں کھیل شروع کیا، 2009 میں اس کھیل کی تاریخ کی سب سے کم عمر عالمی جونیئر چیمپئن بنیں، اور پھر آٹھ انفرادی عالمی ٹائٹل جیتے (2015، 2016، 2018-19، 2019-20، 2020-21، 2022، 2023 اور 2025)، یوں نکول ڈیوڈ کا آل ٹائم ریکارڈ برابر کیا، اور کئی مرتبہ عالمی نمبر 1 رہیں۔"
