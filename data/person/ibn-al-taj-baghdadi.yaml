gender: male
summary:
  ar: "العلاء ابن التاج البغدادي الشافعي الإمام المحدث المتقن المكثر مسند بغداد في وقته؛ ولد سنة ثلاث وتسعين وسبعمائة فسمع بها من الحسني والقصري وفي حداثته من أبي هريرة بن الذهبي وسمع بالقاهرة ودمشق من جماعة، كان رجلاً صالحاً خيراً مؤثراً لأمور الآخرة مكثراً للرواية متقيماً للعبادات قد لازم مجلس الإقراء وعظيم الاحترام بالتدريس والإفتاء ويترأس جماعة في فنون كثيرة وكانوا يسمونه بالمقرئ، قال الذهبي كان جليلاً، توفي سنة سبع وستين وثمانمائة ودفن في مقابر باب نصر {cite:shadharat-dhahab p. 307-308}."
  en: "Ibn al-Taj (b. Baghdad 793) — the musnid of Baghdad who heard in his youth from Abu Hurayra ibn al-Dhahabi, then took Cairo and Damascus; 'a righteous man whose assemblies multiplied in recitation'; al-Dhahabi: 'he was great'; died 867, buried at Bab Nasr cemetery {cite:shadharat-dhahab p. 307-308}."
