  id: "Hakim Abu Ubaid Ibn Harbawayh wafat pada tahun 319 H {cite:tabaqat-fuqaha-abbas-1981 hlm. 58}, dari golongan yang sebagian besar adalah sahabat Abu al-Abbas Ibn Surayj {cite:tabaqat-fuqaha-abbas-1981 hlm. 58}."
