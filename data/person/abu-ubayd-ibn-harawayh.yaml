  ar: "القاضي أبو عبيد ابن حربويه، مات سنة تسع عشرة وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}، من طبقة أكثرها من أصحاب أبي العباس بن سريج {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  en: "Qadi Abu Ubayd ibn Harawayh, who died in 319 {cite:tabaqat-fuqaha-abbas-1981 p. 58}, a member of a tabaqa most of whom were companions of Abu al-Abbas ibn Surayj {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
