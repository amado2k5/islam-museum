  es: "Qadi Abu Ubayd ibn Harawayh, que murió en 319 {cita:tabaqat-fuqaha-abbas-1981 p. 58}, miembro de una tabaqa, la mayoría de los cuales eran compañeros de Abu al-Abbas ibn Surayj {cita:tabaqat-fuqaha-abbas-1981 p. 58}."
