label: { ar: "الملك المنصور أبو بكر بن الناصر", en: "al-Malik al-Mansur Abu Bakr ibn al-Nasir", fr: "al-Malik al-Mansur Abu Bakr ibn al-Nasir", es: "al-Malik al-Mansur Abu Bakr ibn al-Nasir", ur: "المالک المنصور ابو بکر بن الناصر" }
summary:
  ar: "سلطان مملوكي ابن الملك الناصر محمد بن قلاوون، عقد مجلساً يوم الخميس حادي عشر ذي الحجة سنة إحدى وأربعين وطلب الخليفة إبراهيم وولي العهد أحمد والقضاة وقال من يستحق الخلافة شرعاً فقال ابن جماعة إن المستكفي أوصى بالخلافة لولده أحمد فخلع إبراهيم وبايع أحمد {cite:tarikh-khulafa-minhaj-1434 p. 742}."
  en: "Al-Nasir's son; in his council of 11 Dhu'l-Hijja 741 he asked 'who deserves the caliphate by law?' — Ibn Jama'a read the Qus deed and al-Hakim II was hailed {cite:tarikh-khulafa-minhaj-1434 p. 742}."
  fr: "Le fils d'Al-Nasir ; dans son conseil de 11 Dhu'l-Hijja 741 il a demandé \"qui mérite le califat par la loi ?\" - Ibn Jama'a lu l'acte Qus et al-Hakim II a été salué {cite:tarikh-khulafa-minhaj-1434 p. 742}."
  es: "Hijo de Al-Nasir; en su consejo del 11 de Dhu'l-Hijja 741 preguntó '¿quién merece el califato por ley?' — Ibn Jama'a leyó el hecho de Qus y al-Hakim II fue aclamado {cite:tarikh-khulafa-minhaj-1434 p. 742}."
  ur: "الناصر کا بیٹا؛ 11 ذی الحجہ 741 کی مجلس میں انہوں نے پوچھا کہ 'شریعت کے لحاظ سے خلافت کا مستحق کون ہے؟' ابن جماعہ نے تصنیف القس پڑھی اور الحکیم دوم کی تعریف کی گئی۔ 742}۔"
