summary:
  ar: "ممثل ورابر بريطاني من أصل باكستاني، وُلد في ويمبلي بلندن سنة 1982؛ أول مسلم وأول جنوب آسيوي يفوز بجائزة إيمي لأفضل ممثل رئيسي عن «ليلة من» (2016)، ورُشّح للأوسكار عن «صوت المعدن» (2019)، وفاز فيلمه القصير «الوداع الطويل» بجائزة الأوسكار، وهو من أبرز الأصوات في قضية تمثيل المسلمين على الشاشة حتى سُمّي «اختبار ريز» على اسمه."
  en: "British actor and rapper of Pakistani origin, born in Wembley, London, in 1982. He was the first Muslim and first South Asian to win a lead-acting Emmy, for The Night Of (2016), was Oscar-nominated for Sound of Metal (2019), won the Academy Award for his short film The Long Goodbye, and is a leading voice on the screen representation of Muslims, with the 'Riz Test' named after him."
  ur: "پاکستانی نژاد برطانوی اداکار و ریپر، 1982 میں ویمبلی، لندن میں پیدا ہوئے؛ «دی نائٹ آف» (2016) پر مرکزی اداکاری کا ایمی جیتنے والے پہلے مسلمان اور پہلے جنوبی ایشیائی، «ساؤنڈ آف میٹل» (2019) پر آسکر کے لیے نامزد، ان کی مختصر فلم «دی لانگ گڈ بائی» نے اکیڈمی ایوارڈ جیتا، اور پردے پر مسلمانوں کی نمائندگی کے نمایاں ترین وکلا میں سے ایک ہیں جن کے نام پر «رض ٹیسٹ» رکھا گیا۔"
