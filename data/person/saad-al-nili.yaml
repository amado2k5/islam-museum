summary:
  ar: "سعد بن أحمد بن مكي النيلي — نسبة إلى نيل بلد على الفرات — المؤدب الشاعر؛ أكثر شعره مديح في أهل البيت، قال العماد كان غالياً في التشيع حالفاً بالتورع عالماً بالأدب؛ توفي سنة اثنتين وتسعين وخمسمائة {cite:shadharat-dhahab p. 789}."
  en: "Sa'd b. Ahmad b. Makki al-Nili — of Nil, a town on the Euphrates — tutor and poet; most of his verse praises the Prophet's house, and al-Imad calls him extreme in his Shi'ism yet given to scrupulosity and learned in adab; he died in 592 {cite:shadharat-dhahab p. 789}."
