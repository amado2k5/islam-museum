names:
  - { value: "سعد بن أحمد بن مكي النيلي المؤدب الشاعر", kind: full }
summary:
  ar: "سعد بن أحمد بن مكي النيلي — نسبة إلى نيل بلد على الفرات — المؤدب الشاعر؛ أكثر شعره مديح في أهل البيت، قال العماد كان غالياً في التشيع حالفاً بالتورع عالماً بالأدب؛ توفي سنة اثنتين وتسعين وخمسمائة {cite:shadharat-dhahab p. 789}."
  en: "Sa'd b. Ahmad b. Makki al-Nili — of Nil, a town on the Euphrates — tutor and poet; most of his verse praises the Prophet's house, and al-Imad calls him extreme in his Shi'ism yet given to scrupulosity and learned in adab; he died in 592 {cite:shadharat-dhahab p. 789}."
  es: "Sa'd b. Ahmad b. Makki al-Nili — de Nil, una ciudad en el Éufrates — tutor y poeta; la mayor parte de su poesía alaba la casa del Profeta, y al-Imad lo llama extremista en su chiismo, pero dado a la escrupulosidad y versado en adab; murió en 592 {cite:shadharat-dhahab p. 789}."
  fr: "Sa'd b. Ahmad b. Makki al-Nili — de Nil, une ville sur l'Euphrate — précepteur et poète; la plupart de ses vers font l'éloge de la maison du Prophète, et al-Imad le qualifie d'extrémiste dans son chiisme, mais enclin à la scrupulosité et versé dans l'adab; il mourut en 592 {cite: shadharat-dhahab p. 789}."
  ur: "سعد ب۔ احمد بی۔ مکی النلی — نیل کا، فرات کے کنارے ایک قصبہ — استاد اور شاعر؛ اس کی زیادہ تر آیت میں پیغمبر کے گھر کی تعریف کی گئی ہے، اور عماد نے انہیں اپنے شیعوں میں انتہا پسند کہا ہے لیکن اس کے باوجود وہ ادب میں سیکھے ہوئے ہیں؛ ان کی وفات 592ء میں ہوئی۔ 789}۔"
