summary:
  ar: "عمران بن ملحان، ويقال ابن عبد الله، أبو رجاء العطاردي التميمي البصري، من كبار المخضرمين، أدرك الجاهلية وأسلم بعد فتح مكة، وروى عن عمر وعلي وعمران بن حصين وابن عباس وأبي موسى وغيرهم، وكان ثقة مع غفلة فيه. (؟ - ١٠٥ وقيل ١٠٧ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  en: "Imran ibn Milhan, also called Ibn Abd Allah, Abu Raja al-Utaridi of Basra, one of the senior mukhadramun. He lived in the pre-Islamic period, accepted Islam after the conquest of Mecca, narrated from Umar, Ali and Ibn Abbas and others, and was held reliable with some heedlessness. Death 105 or 107 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
