summary:
  ar: "صحفية وكاتبة أمريكية من أصل لبناني وهندي، وُلدت في بيروت سنة 1965، وهي حفيدة الفنانة الإسبانية أنيتا دلغادو التي تزوجت مهراجا كابورتهالا. بدأت حياتها المهنية في صناعة الموسيقى سنة 1985، ثم عملت في «سي بي إس نيوز» من سنة 1993 إلى جانب دان راذر، مديرةً لمكتبه ومتحدثةً باسمه، وكتبت خطبًا لشخصيات عامة منها الملكة نور الأردن. ألّفت بالإسبانية مذكرات وروايات منها «La nieta de la maharaní» (2009) و«Las huellas en el desierto» (2014)."
  en: "American journalist and author of Lebanese and Indian origin, born in Beirut in 1965; she is a granddaughter of Anita Delgado, the Spanish flamenco singer and dancer who married the Maharaja of Kapurthala. She began her career in the music business in 1985, joined CBS News in January 1993 as Dan Rather's chief of staff and spokesperson, and has written speeches for public figures including Queen Noor of Jordan. Her Spanish-language books include the memoirs La nieta de la maharaní (2009) and La princesa perdida (2011) and the novels Miel y almendras (2012), Las huellas en el desierto (2014) and Medianoche en Damasco (2017)."
  ur: "لبنانی و ہندی نژاد امریکی صحافی اور مصنفہ، 1965 میں بیروت میں پیدا ہوئیں؛ وہ ہسپانوی فنکارہ انیتا ڈیلگاڈو کی پوتی ہیں جو کاپورتھلا کے مہاراجا کی اہلیہ بنیں۔ انہوں نے 1985 میں موسیقی کے کاروبار سے آغاز کیا، 1993 میں سی بی ایس نیوز سے وابستہ ہو کر ڈان ریدر کے دفتر کی سربراہ اور ترجمان رہیں، اور کئی ہسپانوی کتابیں لکھیں۔"
