summary:
  ar: "الشيخ مدين خليفة الأشموني الزاهد؛ قال المناوي أصله من ذرية الشيخ أبي مدين فرحل من المغرب جده الأدنى وهو مغربي فقير فأقام بطبلية بالمنوفية فولد له بها علي ودفن بطبلية ثم انتقل إلى أشمون فولد له بها مدين هذا فاشتغل بالعلم حتى صار يفتي ثم تحرك لطلب الطريق فخرج يطلب شيخاً بمصر فوافق خروجه خروج الشيخ محمد الغمري يطلب مطلوبه فلقيهما رجل من أرباب الأحوال فقال اذهبا إلى أحد الزاهد ففتح عليهما على يديه ولا تطلبا الأبواب الكبار فدخلا على الزاهد فلقنهما ففتح على مدين في ثلاثة أيام وعلى الغمري بعد خمس عشرة سنة، وكان صاحب همة وله عز في الطريق وعزمه ويد طولى في التصوف وإذا تكلم في الطريق بلغ المريد مرامه وسؤله فانتفع به خلق كثير من العلماء والصلحاء والفقراء والفقهاء، ودانت له كرامات منها أنه مالت منارة زاويته فقيل له لابد من هدمها فصعد مع المهندس وقال أرني على الميل فأراه ذلك فألصق ظهره به فاستقام، ومنها أنه لما ضاقت النفقة على السلطان جقمق أرسل يأخذ خاطره فأرسل له نصف عمود من معدن يثاقل به الفضة فجعل ثمنه في بيت المال واتسع الحال فقال السلطان الملوك حقيقة هؤلاء، ومنها أنه أتاه رجل طعن في السن فقال أريد حفظ القرآن فقال ادخل الخلوة واشتغل بذكر الله تحفظه فدخل فأصبح يحفظه، توفي يوم الأربعاء تاسع ربيع الأولى سنة اثنتين وتسعين وثمانمائة ودفن بزاويته {cite:shadharat-dhahab p. 361-362}."
  en: "Shaykh Midin — descendant of Abu Madyan's line, the Ashmuni zahid who reached the opening in three days where al-Ghumri needed fifteen years; his tilted minaret straightened at his leaning back, he sent Jaqmaq a silver-assaying rod when the treasury ran short ('the sultan said: these are the real kings'), and set the old man who asked to memorize the Qur'an to dhikr in the khalwa; died Wednesday 9 Rabi' I 892, buried at his zawiya {cite:shadharat-dhahab p. 361-362}."
  es: "Shaykh Midin — descendiente de la línea de Abu Madyan, el zahid Ashmuni que llegó a la apertura en tres días donde al-Ghumri necesitó quince años; su minarete inclinado se enderezó a su espalda reclinada, envió a Jaqmaq una vara para ensayar plata cuando el tesoro se quedó sin fondos ('el sultán dijo: estos son los verdaderos reyes'), y puso al anciano que pidió memorizar el Corán a hacer dhikr en el khalwa; murió el miércoles 9 de Rabi' I de 892, enterrado en su zawiya {cite:shadharat-dhahab p. 361-362}."
  fr: "Cheikh Midin — descendant de la lignée d'Abu Madyan, le zahid ashmuni qui atteignit l'ouverture en trois jours là où al-Ghumri mit quinze ans; son minaret incliné se redressa à son dos penché, il envoya à Jaqmaq une baguette d'essai d'argent lorsque le trésor vint à manquer (« le sultan dit: ce sont les vrais rois »), et mit le vieil homme qui demandait à mémoriser le Coran au dhikr dans la khalwa; mourut le mercredi 9 Rabi' I 892, enterré dans sa zawiya {cite: shadharat-dhahab p. 361-362}."
  ur: "شیخ مدین - ابو مدین کی نسل سے، اشمونی زاہد جو تین دنوں میں افتتاحی مقام پر پہنچے جہاں الغمری کو پندرہ سال درکار تھے۔ اس کا جھکا ہوا مینار اس کی پیٹھ پر سیدھا ہو گیا، جب خزانہ کم ہو گیا تو اس نے جقمق کو چاندی کی ایک چھڑی بھیجی ⁦('سلطان نے کہا: یہ اصلی بادشاہ ہیں')⁩، اور اس بوڑھے کو کھڑا کیا جس نے قرآن حفظ کرنے کو کہا تھا کہ وہ خلوہ میں ذکر کرے؛ بدھ 9 ربیع الثانی 892 کو وفات پائی، ان کی زاویہ میں تدفین ہوئی۔ 361-362}۔"
  tr: "Şeyh Madyan, münzevi Al-Ashmuni'nin halefi; Al-Manawi, kökeninin Şeyh Ebu Madyan'ın soyundan geldiğini söyledi. Genç büyükbabası, fakir bir Faslı olarak Fas'tan ayrıldı ve Menoufia'daki Tabliyah'a yerleşti. Ali orada doğdu ve Tablia'ya defnedildi, ardından Ashmun'a taşındı ve orada Madian adında bir oğlu oldu. Kendini bilgiye adadı, ta ki fetvalar vermeye başlayana kadar, sonra bir yol aramaya başladı ve Mısır'da bir şeyh aramaya çıktı. Onun ayrılışı, Şeyh Muhammed Al-Ghamri'nin aradığını aramak için ayrılmasıyla aynı zamana denk geldi. Yöneticilerden bir adam onları karşıladı ve dedi ki, 'Bir münzeviye git.' Kapıyı elleriyle açtı ve Büyük kapıları aradılar, bu yüzden onlara eğitim veren ve üç günde Midyan'ı fetheden münzeviye girdiler, on beş yıl sonra ise Al-Ghumri'yi fethetti. O, hırslı, yolda onurlu, kararlı ve tasavvuf konusunda uzun bir adamdı. Yolda konuştuğunda, arayıcı amacına ve sorusuna ulaştı, bu da birçok alim, doğru insan, yoksul ve hukukçuya fayda sağladı. Mucizeler yaşadı, köşesinin minaresinin eğilmesi ve yıkılması gerektiği söylendi. Mühendisle birlikte yukarı çıktı ve 'Bana yamaçta göster,' dedi, böylece göreyim. Sırtını ona yasladı ve doğruldu, aralarında Sultan Jaqmaq'ın masrafları zorlaştığında, gümüş tartmak için kullanılan yarım metal bir direk göndererek onu teselli etmek için gönderdi ve parasını hazinede tuttu. Durum genişledi ve Sultan krallara bu konularda gerçeği söyledi. Bunlar arasında, yaşlı bir adam ona gelip, 'Kur'an'ı ezberlemek istiyorum.' dedi. O da dedi ki, 'İnzivaya gir ve Allah'ı anmaya başla.' İçeri girdi ve ezberlemeye başladı. Çarşamba, 9 Rebi'l-Awwal günü, 892 Hile öldü ve zawiyasında defnedildi {atıf:shadharat-dhahab s. 361-362}."
  id: "Sheikh Madyan, penerus Al-Ashmuni sang pertapa mengatakan asal-usulnya dari keturunan Sheikh Abu Madyan. Kakek bungsunya meninggalkan Maroko, seorang Maroko miskin, dan menetap di Tabliyah di Menoufia. Ali lahir di sana dan dimakamkan di Tablia, lalu pindah ke Ashmun, di mana ia memiliki seorang putra bernama Madian. Ia mendedikasikan diri pada pengetahuan hingga mulai mengeluarkan fatwa, lalu mencari jalan dan pergi mencari seorang sheikh di Mesir. Kepergiannya bertepatan dengan kepergian Sheikh Muhammad Al-Ghamri mencari apa yang ia cari. Seorang pria dari para penguasa menyambut mereka dan berkata, 'Pergilah kepada salah satu pertapa.' Ia membuka pintu untuk mereka dengan tangannya, dan Mereka mencari gerbang besar, sehingga mereka masuk ke pertapa yang mengajar mereka dan menaklukkan Midian dalam tiga hari, dan Al-Ghumri setelah lima belas tahun. Dia adalah pria yang ambisius, terhormat di jalan, ketekunan, dan tangan panjang dalam Sufisme. Ketika dia berbicara di jalan, pencari mencapai tujuan dan pertanyaannya, yang menguntungkan banyak cendekiawan, orang benar, orang miskin, dan ahli hukum. Dia mengalami mukjizat, termasuk menara di sudutnya miring, dan dia diberitahu bahwa menara itu harus dihancurkan. Dia naik bersama insinyur dan berkata, 'Tunjukkan padaku di lereng,' agar aku bisa melihatnya. Dia bersandar punggungnya dan berdiri tegak, dan di antara mereka Ketika biaya Sultan Jaqmaq menjadi sulit, ia mengirim surat untuk menghiburnya dengan mengirimkan setengah tongkat logam yang digunakan untuk menimbang perak, dan ia menyimpan harganya di perbendaharaan. Situasi semakin meluas, dan Sultan memberitahu para raja kebenaran tentang hal-hal ini. Di antaranya adalah seorang pria tua datang kepadanya dan berkata, 'Aku ingin menghafal Al-Qur'an.' Ia berkata, 'Masuklah ke tempat persembunyian dan bersibatlah dalam mengenang Tuhan.' Ia masuk dan mulai menghafalnya. Ia meninggal pada hari Rabu, 9 Rabi' al-Awwal, 892 H, dan dimakamkan di zawiya miliknya {cite:shadharat-dhahab hlm. 361-362}."
