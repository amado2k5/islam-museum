summary:
  ar: "الشيخ مدين خليفة الأشموني الزاهد؛ قال المناوي أصله من ذرية الشيخ أبي مدين فرحل من المغرب جده الأدنى وهو مغربي فقير فأقام بطبلية بالمنوفية فولد له بها علي ودفن بطبلية ثم انتقل إلى أشمون فولد له بها مدين هذا فاشتغل بالعلم حتى صار يفتي ثم تحرك لطلب الطريق فخرج يطلب شيخاً بمصر فوافق خروجه خروج الشيخ محمد الغمري يطلب مطلوبه فلقيهما رجل من أرباب الأحوال فقال اذهبا إلى أحد الزاهد ففتح عليهما على يديه ولا تطلبا الأبواب الكبار فدخلا على الزاهد فلقنهما ففتح على مدين في ثلاثة أيام وعلى الغمري بعد خمس عشرة سنة، وكان صاحب همة وله عز في الطريق وعزمه ويد طولى في التصوف وإذا تكلم في الطريق بلغ المريد مرامه وسؤله فانتفع به خلق كثير من العلماء والصلحاء والفقراء والفقهاء، ودانت له كرامات منها أنه مالت منارة زاويته فقيل له لابد من هدمها فصعد مع المهندس وقال أرني على الميل فأراه ذلك فألصق ظهره به فاستقام، ومنها أنه لما ضاقت النفقة على السلطان جقمق أرسل يأخذ خاطره فأرسل له نصف عمود من معدن يثاقل به الفضة فجعل ثمنه في بيت المال واتسع الحال فقال السلطان الملوك حقيقة هؤلاء، ومنها أنه أتاه رجل طعن في السن فقال أريد حفظ القرآن فقال ادخل الخلوة واشتغل بذكر الله تحفظه فدخل فأصبح يحفظه، توفي يوم الأربعاء تاسع ربيع الأولى سنة اثنتين وتسعين وثمانمائة ودفن بزاويته {cite:shadharat-dhahab p. 361-362}."
  en: "Shaykh Midin — descendant of Abu Madyan's line, the Ashmuni zahid who reached the opening in three days where al-Ghumri needed fifteen years; his tilted minaret straightened at his leaning back, he sent Jaqmaq a silver-assaying rod when the treasury ran short ('the sultan said: these are the real kings'), and set the old man who asked to memorize the Qur'an to dhikr in the khalwa; died Wednesday 9 Rabi' I 892, buried at his zawiya {cite:shadharat-dhahab p. 361-362}."
