summary:
  ar: "رجل بنسبة «المداني» وصفه كتاب الزيدية بأنه من أهل الفساد والإدغال على الإمام الهادي؛ أمر الهادي بحبسه في الحديد اثني عشر يوماً بالهجر ⁦(294هـ)⁩."
  en: "A man of the nisba al-Madani, whom the Zaydi book describes as one of the people of corruption and sedition against the imam al-Hadi. Al-Hadi ordered him held in irons for twelve days at al-Hijr (294 AH)."
  ur: "نسبت «المدانی» والا ایک شخص جسے زیدی کتاب امام ہادی کے خلاف فساد اور بدامنی کرنے والوں میں شمار کرتی ہے؛ ہادی نے اسے الہجر میں بارہ دن زنجیروں میں رکھنے کا حکم دیا ⁦(294ھ)⁩۔"
