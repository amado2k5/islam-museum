label:
  ar: "علي بن الربيع المداني"
  en: "Ali ibn al-Rabi' al-Madani"
  ur: "علی بن الربیع المدانی"
  es: "Ali ibn al-Rabi' al-Madani"
  fr: "Ali ibn al-Rabi' al-Madani"
summary:
  ar: "رجل بنسبة «المداني» وصفه كتاب الزيدية بأنه من أهل الفساد والإدغال على الإمام الهادي؛ أمر الهادي بحبسه في الحديد اثني عشر يوماً بالهجر ⁦(294هـ)⁩."
  en: "A man of the nisba al-Madani, whom the Zaydi book describes as one of the people of corruption and sedition against the imam al-Hadi. Al-Hadi ordered him held in irons for twelve days at al-Hijr (294 AH)."
  ur: "نسبت «المدانی» والا ایک شخص جسے زیدی کتاب امام ہادی کے خلاف فساد اور بدامنی کرنے والوں میں شمار کرتی ہے؛ ہادی نے اسے الہجر میں بارہ دن زنجیروں میں رکھنے کا حکم دیا ⁦(294ھ)⁩۔"
  es: "Un hombre de la nisba al-Madani, a quien el libro zaidí describe como uno de los corruptos y sediciosos contra el imán al-Hadi. Al-Hadi ordenó que lo mantuvieran encadenado durante doce días en al-Hijr (294 AH)."
  fr: "Un homme de la nisba al-Madani, que le livre zaydite décrit comme un corrompu et un séditieux contre l'imam al-Hadi. Al-Hadi ordonna qu'il soit enchaîné pendant douze jours à al-Hijr (294 AH)."
  tr: "'el-Medeni' soyundan bir adam, Zaydi kitabında İmam el-Hadi'ye karşı yozlaşmış ve aldatıcı olarak tanımlanmıştır; el-Hadi, sürgünde on iki gün boyunca demir hapis cezası emretti (294 Hâri)."
  id: "Seorang pria dari garis keturunan 'al-Madani' yang menurut kitab Zaydi digambarkan sebagai korup dan menipu Imam al-Hadi; al-Hadi memerintahkan penahanan besi selama dua belas hari dalam pengasingan (294 H)."
