summary:
  ar: "علي المتقي بن حسام الدين الهندي ثم المكي؛ كان من العلماء العاملين وعباد الله الصالحين على جانب عظيم من الورع والتقوى والاجتهاد في العبادة ورفض السوى، وله مصنفات عديدة وكرامات كثيرة، وتوفي بمكة المشرفة بعد مجاورته بها مدة طويلة {cite:shadharat-dhahab p. 379}."
  en: "'Ali al-Muttaqi al-Hindi — a scholar of works and one of the righteous, on a great side of scrupulosity, piety and striving in worship; many works to his name and frequent karamat; he died at Mecca after a long mujawara {cite:shadharat-dhahab p. 379}."
  fr: "Ali al-Muttaqi al-Hindi - un savant des œuvres et l'un des justes, sur un grand côté de la scrupuleuse, la piété et la lutte dans le culte ; beaucoup d'œuvres à son nom et karamat fréquent ; il est mort à La Mecque après une longue mujawara {cite:shadharat-dhahab p. 379}."
  es: "'Ali al-Muttaqi al-Hindi — un erudito de obras y uno de los justos, de gran escrupulosidad, piedad y esfuerzo en la adoración; muchas obras a su nombre y frecuentes karamat; murió en La Meca después de una larga mujawara {cite:shadharat-dhahab p. 379}."
  ur: "علی المتقی الہندی - کاموں کا عالم اور صالحین میں سے ایک، بے وقوفی، تقویٰ اور عبادت میں کوشش کرنے کے عظیم پہلو پر؛ اس کے نام کے بہت سے کام اور متواتر کرامت۔ ایک طویل مجاورہ کے بعد مکہ میں وفات پائی۔ 379}۔"
  tr: "Ali el-Muttaqi bin Hüsam el-Din el-Hindi, o zamanlar el-Makki, Allah'ın dindar alimleri ve doğru hizmetkarları arasındaydı; büyük dindarlık, dindarlık, ibadet ve gayret ile bunu yapmayı reddeden bir adaydı. Çok sayıda eser ve mucize yazdı. Mekke'de uzun süre yaşadıktan sonra vefat etti {atıf:shadharat-dhahab, s. 379}."
  id: "Ali al-Muttaqi ibn Hussam al-Din al-Hindi, yang saat itu bernama al-Makki, adalah salah satu ulama saleh dan hamba Allah yang benar, memiliki kesalehan, kesalehan, ketekunan dalam ibadah, dan penolakan untuk melakukannya. Ia menulis banyak karya dan banyak mukjizat. Ia meninggal di Mekah setelah tinggal lama di sana {cite:shadharat-dhahab, hlm. 379}."
