  ar: "علي المتقي بن حسام الدين الهندي ثم المكي؛ كان من العلماء العاملين وعباد الله الصالحين على جانب عظيم من الورع والتقوى والاجتهاد في العبادة ورفض السوى، وله مصنفات عديدة وكرامات كثيرة، وتوفي بمكة المشرفة بعد مجاورته بها مدة طويلة {cite:shadharat-dhahab p. 379}."
