summary:
  ar: "عبد الرحمن بن محمد بن أحمد الشربيني المصري، فقيه شافعي أصولي بياني، مشارك في بعض العلوم، ولي مشيخة الجامع الأزهر في سنوات 1322-1324 ه، وتوفي بالقاهرة. من تصانيفه «حاشية بهجة» في فروع الفقه الشافعي، و«تقرير على جمع الجوامع» في الأصول، و«فيض المفتاح» تقرير على شرح تلخيص المفتاح في البلاغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. وتاريخ وفاته في الكتاب (؟-1326 ه)."
  en: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, a Cairo Shafi'i jurist, usuli and rhetorician, who also worked in some other fields. He was shaykh of al-Azhar mosque in the years 1322-1324 AH and died in Cairo. His works include Hashiyat Bahja on Shafi'i positive law, Taqrir on Jam' al-jawami' in the roots of law, and Fayd al-miftah, a gloss on the commentary of Talkhis al-miftah in rhetoric {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. The book gives his death as 1326 AH."
  ur: "عبد الرحمن بن محمد بن احمد شربینی مصری، شافعی فقیہ، اصولی اور بیانی، بعض دیگر علوم میں بھی شریک۔ 1322 تا 1324 ہجری جامع ازہر کے شیخ رہے اور قاہرہ میں وفات پائی۔ ان کی تصانیف میں بہجۃ پر حاشیہ، جمع الجوامع پر تقریر اور تلخیص المفتاح کی شرح پر فیض المفتاح شامل ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}۔ کتاب ان کی وفات 1326 ہجری بتاتی ہے۔"
