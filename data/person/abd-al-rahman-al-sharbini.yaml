summary:
  ar: "عبد الرحمن بن محمد بن أحمد الشربيني المصري، فقيه شافعي أصولي بياني، مشارك في بعض العلوم، ولي مشيخة الجامع الأزهر في سنوات 1322-1324 ه، وتوفي بالقاهرة. من تصانيفه «حاشية بهجة» في فروع الفقه الشافعي، و«تقرير على جمع الجوامع» في الأصول، و«فيض المفتاح» تقرير على شرح تلخيص المفتاح في البلاغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. وتاريخ وفاته في الكتاب ⁦(؟-1326 ه)⁩."
  en: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, a Cairo Shafi'i jurist, usuli and rhetorician, who also worked in some other fields. He was shaykh of al-Azhar mosque in the years 1322-1324 AH and died in Cairo. His works include Hashiyat Bahja on Shafi'i positive law, Taqrir on Jam' al-jawami' in the roots of law, and Fayd al-miftah, a gloss on the commentary of Talkhis al-miftah in rhetoric {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. The book gives his death as 1326 AH."
  fr: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, juriste shafi'ite du Caire, spécialiste des fondements du droit et rhétoricien, qui travailla aussi dans d'autres domaines. Il fut cheikh de la mosquée al-Azhar dans les années 1322-1324 H et mourut au Caire. Ses œuvres comprennent la Hashiyat Bahja sur le droit positif shafi'ite, un Taqrir sur le Jam' al-jawami' en fondements du droit, et le Fayd al-miftah, glose sur le commentaire du Talkhis al-miftah en rhétorique {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. Le livre donne sa mort en 1326 H."
  ur: "عبد الرحمن بن محمد بن احمد شربینی مصری، شافعی فقیہ، اصولی اور بیانی، بعض دیگر علوم میں بھی شریک۔ 1322 تا 1324 ہجری جامع ازہر کے شیخ رہے اور قاہرہ میں وفات پائی۔ ان کی تصانیف میں بہجۃ پر حاشیہ، جمع الجوامع پر تقریر اور تلخیص المفتاح کی شرح پر فیض المفتاح شامل ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}۔ کتاب ان کی وفات 1326 ہجری بتاتی ہے۔"
  es: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, jurista, usuli y retórico shafi'í de El Cairo, también trabajó en otros campos. Fue jeque de la mezquita de al-Azhar entre los años 1322 y 1324 de la Hégira y falleció en El Cairo. Entre sus obras destacan Hashiyat Bahja sobre el derecho positivo shafi'í, Taqrir sobre Jam' al-jawami' en los fundamentos del derecho y Fayd al-miftah, un glosario del comentario de Talkhis al-miftah sobre retórica {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758-13759}. El libro indica que falleció en 1326 de la Hégira."
  tr: "Abdülrahman ibn Muhammed ibn Ahmed el-Şirbini el-Mişri, Şafiî mezhebine mensup bir hukukçu, hukuk teorisi alimi ve retorikçi olup, birçok başka bilim dalında da uzmandı. 1322-1324 Hicri yılları arasında El-Ezher Camii'nin Baş Şeyhi olarak görev yaptı ve Kahire'de vefat etti. Eserleri arasında Şafiî fıkıhının dalları üzerine \"Haşiyet Bahja\", hukuk teorisi üzerine \"Takrir ala Cem' el-Cevami\" ve retorikte \"Talkhis el-Miftah\"ın açıklamasına dair bir tefsir olan \"Feyd el-Miftah\" bulunmaktadır. Kitapta ölüm tarihi 1326 Hicri olarak verilmiştir."
  id: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Shirbini al-Misri adalah seorang ahli hukum mazhab Syafi'i, pakar teori hukum, dan ahli retorika, dengan keahlian dalam beberapa ilmu lainnya. Beliau menjabat sebagai Syekh Agung Masjid al-Azhar dari tahun 1322 hingga 1324 H dan meninggal di Kairo. Di antara karya-karyanya adalah \"Hashiyat Bahja\" tentang cabang-cabang yurisprudensi Syafi'i, \"Taqrir 'ala Jam' al-Jawami'\" tentang teori hukum, dan \"Fayd al-Miftah,\" sebuah komentar tentang penjelasan \"Talkhis al-Miftah\" dalam retorika. Tanggal kematiannya tercantum dalam buku tersebut sebagai tahun 1326 H."
