died: { edtf: "1194", hijri: "0590", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الأحد بعد صلاة العصر الثامن والعشرين من جمادى الآخرة سنة تسعين وخمسمائة ودفن يوم الاثنين في تربة القاضي الفاضل بالقرافة الصغرى؛ قال ابن خلكان: زرت قبره مراراً {cite:wafayat-ayan}." }
summary:
  ar: "الشيخ الشاطئي أبو محمد وأبو القاسم القاسم بن فيرة بن خلف بن أحمد الرعيني الشاطبي الضرير المقرئ؛ صاحب القصيدة التي سماها «حرز الأماني ووجه التهاني» في القراءات وعدتها ألف ومائة وثلاثة وسبعون بيتاً ولقد أبدع فيها كل الإبداع وهي عمدة قراء هذا الزمان في نقلهم فقلّ من يشتغل بالقراءات إلا ويقدم عليها ويحفظها وهي مشتملة على رموز عجيبة وإشارات خفية لطيفة؛ وكان عالماً بكتاب الله قراءة وتفسيراً وبالحديث مبرزاً فيه وكان إذا قُرئ عليه صحيح البخاري ومسلم والموطأ تُصحح النسخ من حفظه ويُملي النكت على المواضع المحتاج إليها وكان أوحداً في النحو عارفاً بمارونه حسن القاصد خليلاً في قوله وفعله؛ قرأ القراءات على أبي عبد الله محمد بن علي بن محمد بن أبي العاص الفرّي المقري وأبي الحسن علي بن محمد بن هذيل الأندلسي {cite:wafayat-ayan}."
  en: "Al-Shatibi (d. 590) — the blind master of the qira'at; author of Hirz al-Amani wa-Wajh al-Tahani ('al-Shatibiyya'), the 1,173-verse poem that became the standard reference for all students of the readings; manuscripts of Bukhari, Muslim and the Muwatta were corrected against his memory; Ibn Khallikan visited his grave repeatedly {cite:wafayat-ayan}."
