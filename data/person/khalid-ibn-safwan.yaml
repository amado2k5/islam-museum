label: { ar: "خالد بن صفوان", en: "Khalid ibn Safwan" }
summary:
  ar: "خالد بن صفوان التميمي خطيب العرب، كان في مجلس السفاح حين فخر بعض أولاد قحطان على ولد نزار فقال له السفاح ألا تنطق وقد غمرتكم قحطان بشرفها، فقال ماذا أقول لقوم ليس فيهم إلا دابغ جلد أو ناسج برد أو سائس قرد أو راكب عرد أغرقتهم فأرة وملكتهم امرأة ودل عليهم هدهد، ثم مضى في ذمهم إلى قصة تملك الحبشة واستنقاذ الفرس إياهم {cite:muruj-al-dhahab p. 491}."
  en: "The Arabs' orator at al-Saffah's court who answered the Qahtanite boast: 'a folk among whom is only a tanner of hides, a weaver of mantles, a driver of monkeys, a rider of goats — a rat drowned them, a woman ruled them, a hoopoe guided them' {cite:muruj-al-dhahab p. 491}."
