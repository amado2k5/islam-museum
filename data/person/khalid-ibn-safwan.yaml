id: person/khalid-ibn-safwan
class: person
label: { ar: "خالد بن صفوان", en: "Khalid ibn Safwan" }
summary:
  ar: "خالد بن صفوان التميمي خطيب العرب، كان في مجلس السفاح حين فخر بعض أولاد قحطان على ولد نزار فقال له السفاح ألا تنطق وقد غمرتكم قحطان بشرفها، فقال ماذا أقول لقوم ليس فيهم إلا دابغ جلد أو ناسج برد أو سائس قرد أو راكب عرد أغرقتهم فأرة وملكتهم امرأة ودل عليهم هدهد، ثم مضى في ذمهم إلى قصة تملك الحبشة واستنقاذ الفرس إياهم {cite:muruj-al-dhahab p. 491}.، وعند المسعودي خلا بأبي العباس فوصف له النساء وصنوفهن حتى أعاد كلامه ثم أبلغته أم سلمة ما قال فأرسلت إليه النجارية فهرب وأغلق بابه، فلما أحضره أبو العباس وخلف الستر حركة انقلب يصف مضرة الضرائر والثلاث كأثافي القدر والأربع شر مجموع، حتى قالت أم سلمة من وراء الستر صدقت يا عماه ولكنه بدل وغير، فخرج وقد أيقن بالحياة وصارت إليه رسلها بعشرة آلاف درهم وتخت وبرذون وغلام {cite:muruj-al-dhahab p. 247-250}"
  en: "The Arabs' orator at al-Saffah's court who answered the Qahtanite boast: 'a folk among whom is only a tanner of hides, a weaver of mantles, a driver of monkeys, a rider of goats — a rat drowned them, a woman ruled them, a hoopoe guided them' {cite:muruj-al-dhahab p. 491}."
