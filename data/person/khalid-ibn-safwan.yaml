label: { ar: "خالد بن صفوان", en: "Khalid ibn Safwan", es: "Khalid ibn Safwan", fr: "Khalid ibn Safwan", ur: "خالد بن صفوان" }
summary:
  ar: "خالد بن صفوان التميمي خطيب العرب، كان في مجلس السفاح حين فخر بعض أولاد قحطان على ولد نزار فقال له السفاح ألا تنطق وقد غمرتكم قحطان بشرفها، فقال ماذا أقول لقوم ليس فيهم إلا دابغ جلد أو ناسج برد أو سائس قرد أو راكب عرد أغرقتهم فأرة وملكتهم امرأة ودل عليهم هدهد، ثم مضى في ذمهم إلى قصة تملك الحبشة واستنقاذ الفرس إياهم {cite:muruj-al-dhahab p. 491}. وعند المسعودي خلا بأبي العباس فوصف له النساء وصنوفهن حتى أعاد كلامه ثم أبلغته أم سلمة ما قال فأرسلت إليه النجارية فهرب وأغلق بابه، فلما أحضره أبو العباس وخلف الستر حركة انقلب يصف مضرة الضرائر والثلاث كأثافي القدر والأربع شر مجموع، حتى قالت أم سلمة من وراء الستر صدقت يا عماه ولكنه بدل وغير، فخرج وقد أيقن بالحياة وصارت إليه رسلها بعشرة آلاف درهم وتخت وبرذون وغلام {cite:muruj-al-dhahab p. 247-250}"
  en: "The Arabs' orator at al-Saffah's court who answered the Qahtanite boast: 'a folk among whom is only a tanner of hides, a weaver of mantles, a driver of monkeys, a rider of goats — a rat drowned them, a woman ruled them, a hoopoe guided them' {cite:muruj-al-dhahab p. 491}."
  es: "El orador árabe en la corte de al-Saffah que respondió a la jactancia qahtanita: \"un pueblo entre el cual solo hay un curtidor de pieles, un tejedor de mantos, un conductor de monos, un jinete de cabras; una rata los ahogó, una mujer los gobernó, una abubilla los guió\" {cite:muruj-al-dhahab p. 491}."
  fr: "L'orateur arabe à la cour d'al-Saffah qui a répondu à la vantardise des Qahtanites: « un peuple parmi lequel il n'y a qu'un tanneur de peaux, un tisserand de manteaux, un conducteur de singes, un cavalier de chèvres — un rat les a noyés, une femme les a gouvernés, une huppe les a guidés » {cite: muruj-al-dhahab p. 491}."
  ur: "الصفح کے دربار میں عربوں کا خطیب جس نے قحطانی شیخی کا جواب دیا: 'ایک قوم جن میں صرف کھالیں بنانے والا، چادریں بنانے والا، بندروں کا ڈرائیور، بکریوں کا سوار - ایک چوہے نے انہیں ڈبو دیا، ایک عورت نے ان پر حکومت کی، ایک ہوپو نے ان کی رہنمائی کی'۔ 491}۔"
  tr: "Arapların hatipi Halid bin Safvan el-Tamimi, kasaplar toplantısındayken Qahtan'ın bazı oğulları Nizar'ın oğlundan övünürken. Kasap, Kahtan size onurunu doldurduğunda konuşmamasını söyledi. Dedi ki, 'Sadece deri tabakçısı, soğuk dokumacı, maymun gezgin ya da bir fare ve bir kadın kraliçe tarafından boğulmuş bir atlı bir halk için ne diyebilirim ki?' Sonra onları Habeşlilerin ele geçirmesi ve Perslerin kurtarılması hikayesiyle eleştirdi {cite:muruj-al-dhahab, s. 491}. El-Mes'udi Ebu Abbas ile bir sır tutuyordu ve ona kadınları ve kategorilerini anlattı, ta ki o da sözlerini tekrarlayana kadar. Sonra Um Salama söylediklerini aktardı, ona bir marangoz gönderdi ve o kaçtı, kapısını kapattı. Ebu Abbas onu perdenin arkasına getirdiğinde, kötülüklerin zararını anlatmak için döndü, üçü kaderin kalın ve dördü en kötüsü. Um Salama dedi ki, 'Sen tam perdenin arkasındasın amcam, ama o değişti ve değişti.' Hayatına inanarak ayrıldı ve elçileri ona on bin dirhem, bir taht, bir bardun ve bir çocukla geldiler {atıf:Muruj-al-Dhahab s. 247-250}"
  id: "Khalid bin Safwan al-Tamimi, orator orang Arab, berada dalam pertemuan tukang daging ketika beberapa putra Qahtan membanggakan putra Nizar. Tukang daging itu menyuruhnya untuk tidak berbicara ketika Qahtan telah membanjiri Anda dengan kehormatan itu. Dia berkata, 'Apa yang bisa saya katakan kepada bangsa yang tidak lebih dari seorang penyamak kulit, penenun dingin, pengembara monyet, atau penunggang kuda yang tenggelam oleh tikus dan seorang ratu wanita, dan seorang hoopoe menunjuk mereka? Kemudian dia melanjutkan mengkritik mereka dengan cerita tentang kekuasaan orang Abyssinia dan penyelamatan orang Persia {cite:muruj-al-dhahab, hlm. 491}. Al-Mas'udi memiliki rahasia dengan Abu al-Abbas dan menjelaskan kepadanya wanita-wanita dan kategorinya sampai ia mengulangi kata-katanya. Kemudian um Salama menyampaikan apa yang ia katakan, sehingga ia mengirim seorang tukang kayu kepadanya, dan ia melarikan diri dan menutup pintunya. Ketika Abu al-Abbas membawanya ke balik tirai, ia berbalik untuk menggambarkan bahaya dari kejahatan, ketiganya seperti dalam takdir, dan empat yang terburuk secara keseluruhan. um Salama berkata, 'Kau berada tepat di balik tirai, pamanku, tapi dia berubah dan berubah.' Ia pergi dengan yakin akan kehidupan, dan utusannya datang kepadanya dengan sepuluh ribu dirham, sebuah takhta, seorang bardun, dan seorang anak laki-laki {cite:muruj-al-dhahab hlm. 247-250}"
