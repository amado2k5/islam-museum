summary:
  ar: "كاتب ساخر ومربٍّ أذربيجاني (1869–1932؛ سنة مولده متنازع عليها)، مؤسس مجلة «ملا نصر الدين» الساخرة (1906) ومحررها، التي هاجمت الجهل والفساد والتعصب الديني بلغة الشعب، فصارت أوسع مجلات العالم الإسلامي انتشارًا في عصرها وشكّلت النثر الأذربيجاني الحديث."
  en: "Azerbaijani satirist, writer and teacher (1869–1932; his birth year is disputed), founder and editor of the satirical magazine Molla Nasreddin (1906), which attacked ignorance, corruption and religious fanaticism in the language of ordinary people and became the most widely read Muslim periodical of its era."
  ur: "آذربائیجانی طنز نگار، ادیب اور استاد (1869–1932؛ سالِ پیدائش متنازع ہے)، ساتری رسالے «ملا نصرالدین» (1906) کے بانی و مدیر، جس نے عوامی زبان میں جہالت، بدعنوانی اور مذہبی تعصب پر کاری ضرب لگائی۔"
