    note: "Exactly one attestation of an affiliation exists, and it is a single document. The Azerbaijani article quotes verbatim his 1887 graduation certificate (attestat) from the Transcaucasian Teachers Seminary at Gori, which describes the 21-year-old graduate as 'belonging to the Shia madhhab of Islam' (müsəlman şiə məzhəbinə mənsub): a contemporary administrative record of his registered confession, quoted in one article. No second independent source names any affiliation for him: the English article's 'Religious views' section calls his views disputed — the Azerbaijani philosopher Agalar Mammedov claimed he was an atheist, others read him as a modernist and advocate of Islamic democracy — and concludes that no definitive evidence supports either the atheist or the religious-liberal reading. His father is described in the Azerbaijani article as a devout man, which is family background, and his lifelong satire of clerics and religious fanaticism is a position, not unbelief. Under the Shia-mapping rule and the doubt rule, one document cannot carry a shia-twelver value: his faith is recorded unknown, with the attestat wording preserved here in full. One independent second source attesting Shia affiliation would change this value."
