  note: "Born at Nakhchivan. The English article and the Azerbaijani article's main text give 22 February 1869 (10 February Old Style), and the Azerbaijani article states that recent research has established 1869. The older year 1866 — the queue's year — is given by the Russian article, is preserved in the Azerbaijani article as a reading of some sources, and is implied by his Gori seminary certificate, quoted verbatim in the Azerbaijani article, which in 1887 describes him as aged 21; the English article's statement that he died in 1932 'aged 65' likewise fits 1866 rather than 1869. The record follows 1869 with the dispute stated, not merged. The Hijri year 1285 is the tabular conversion of the recorded date (the 1866 reading would convert to 1282). The museum has no place entity for Nakhchivan, so no born_in edge is written."
