summary:
  ar: "أبو بكر محمد بن إسماعيل بن العباس البغدادي المستملي الوراق، يقرن مع ابن حيويه في رواية كتاب الزهد عن ابن صاعد؛ قال ابن العماد إنه كان صاحب حديث ثقة عاش خمساً وثمانين سنة، وذكره في سنة 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  en: "Abu Bakr Muhammad ibn Isma'il ibn al-Abbas al-Baghdadi al-Mustamli al-Warraq, paired with Ibn Hayyuya in transmitting Kitab al-Zuhd from Ibn Sa'id; Ibn al-Imad calls him a trustworthy hadith man who lived eighty-five years and lists him under the year 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  ur: "ابو بکر محمد بن اسماعیل بن عباس بغدادی مستملی وراق، ابن صاعد سے کتاب الزہد کی روایت میں ابن حیویہ کے ساتھ آتے ہیں؛ ابن العماد کے مطابق ثقہ محدث تھے، پچاسی برس جیے، اور انہیں سنہ 378 میں ذکر کیا {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}۔"
  fr: "Abu Bakr Muhammad ibn Isma'il ibn al-Abbas al-Baghdadi al-Mustamli al-Warraq, associé à Ibn Hayyuya dans la transmission du Kitab al-Zuhd d'après Ibn Sa'id ; Ibn al-Imad le dit traditionniste digne de confiance, qui vécut quatre-vingt-cinq ans, et le place sous l'année 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  es: "Abu Bakr Muhammad ibn Isma'il ibn al-Abbas al-Baghdadi al-Mustamli al-Warraq, junto con Ibn Hayyuya, transmitió el Kitab al-Zuhd de Ibn Sa'id; Ibn al-Imad lo llama un hombre de hadices confiable que vivió ochenta y cinco años y lo enumera bajo el año 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  tr: "Ebu Bekir Muhammed ibn İsmail ibn el-Abbas el-Bağdadi el-Mustamli el-Varrak, İbn Hayveyh ile birlikte İbn Sa'id'den zühd kitabı rivayet eder; İbn el-İmad, onun seksen beş yıl yaşamış güvenilir bir hadis âlimi olduğunu söylemiş ve 378 yılında ondan bahsetmiştir. {cite:zuhd-ibn-mubarak-farid-1995-v1 s. 101} {cite:zuhd-ibn-mubarak-azami-scan s. 2}"
  id: "Abu Bakr Muhammad ibn Ismail ibn al-Abbas al-Baghdadi al-Mustamli al-Warraq, dikaitkan dengan Ibn Haywayh dalam meriwayatkan Kitab Asketisme dari Ibn Sa’id; Ibn al-Imad mengatakan bahwa beliau adalah seorang ulama hadits terpercaya yang hidup selama delapan puluh lima tahun, dan beliau menyebutkannya pada tahun 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
