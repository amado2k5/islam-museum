summary:
  ar: "أبو بكر محمد بن إسماعيل بن العباس البغدادي المستملي الوراق، يقرن مع ابن حيويه في رواية كتاب الزهد عن ابن صاعد؛ قال ابن العماد إنه كان صاحب حديث ثقة عاش خمساً وثمانين سنة، وذكره في سنة 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  en: "Abu Bakr Muhammad ibn Isma'il ibn al-Abbas al-Baghdadi al-Mustamli al-Warraq, paired with Ibn Hayyuya in transmitting Kitab al-Zuhd from Ibn Sa'id; Ibn al-Imad calls him a trustworthy hadith man who lived eighty-five years and lists him under the year 378 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}."
  ur: "ابو بکر محمد بن اسماعیل بن عباس بغدادی مستملی وراق، ابن صاعد سے کتاب الزہد کی روایت میں ابن حیویہ کے ساتھ آتے ہیں؛ ابن العماد کے مطابق ثقہ محدث تھے، پچاسی برس جیے، اور انہیں سنہ 378 میں ذکر کیا {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 2}۔"
