label: { ar: "ظهوري ⁦(شاعر بيجاپور)⁩", en: "Zuhuri (poet laureate of Bijapur)", ur: "ظہوری ⁦(بیجاپور کے ملک الشعرا)⁩", es: "Zuhuri (poet laureate of Bijapur)", fr: "Zuhuri (poet laureate of Bijapur)" }
summary:
  ar: "شاعر فارسي من بلاط الشاه عباس، قدم الدكن سنة 988هـ/1580–1581م فخدم سلاطين أحمدنگر ثم صار شاعر بلاط إبراهيم عادل شاه الثاني في بيجاپور، وصاحب «سه نثر» {cite:zebrowski-deccani-painting-1983 p. 67}."
  en: "Persian poet from the court of Shah Abbas who came to the Deccan in 988 AH/1580–81, wrote for the sultans of Ahmadnagar and then became poet laureate of Ibrahim Adil Shah II at Bijapur; author of the Seh Nasr {cite:zebrowski-deccani-painting-1983 p. 67}."
  ur: "شاہ عباس کے دربار کے فارسی شاعر جو 988ھ/1580–81ء میں دکن آئے، احمد نگر کے سلاطین کے لیے لکھا اور پھر بیجاپور میں ابراہیم عادل شاہ دوم کے ملک الشعرا بنے؛ سہ نثر کے مصنف {cite:zebrowski-deccani-painting-1983 p. 67}۔"
  es: "Poeta persa de la corte de Shah Abbas que llegó al Deccan en 988 AH/1580–81, escribió para los sultanes de Ahmadnagar y luego se convirtió en poeta laureado de Ibrahim Adil Shah II en Bijapur; autor del Seh Nasr {cite:zebrowski-deccani-painting-1983 p. 67}."
  fr: "Poète persan de la cour du Shah Abbas, arrivé dans le Deccan en 988 AH/1580-81, écrivit pour les sultans d'Ahmadnagar puis devint poète lauréat d'Ibrahim Adil Shah II à Bijapur; auteur du Seh Nasr {cite:zebrowski-deccani-painting-1983 p. 67}."
  tr: "Şah Abbas'ın sarayından bir Fars şairi olan Şah, 988 Hicri / 1580–1581 yıllarında Dekkan'a gelmiş, Ahmednagar sultanlarına hizmet etmiş, ardından Bijapur'da İbrahim Adil Şah II'nin saray şairi olmuş ve 'Seh Nasr' adlı eserin yazarı olmuştur {cite:zebrowski-deccani-painting-1983, s. 67}."
  id: "Seorang penyair Persia dari istana Shah Abbas, ia tiba di Deccan pada tahun 988 H / 1580–1581 M, melayani para sultan Ahmednagar, kemudian menjadi penyair istana Ibrahim Adil Shah II di Bijapur, dan penulis 'Seh Nasr' {cite:zebrowski-deccani-painting-1983, hlm. 67}."
