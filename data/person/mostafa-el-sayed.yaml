summary:
  ar: "كيميائي فيزيائي مصري أمريكي، وُلد سنة 1933، صاحب «قاعدة السيد» في المطيافية التي تحمل اسمه، وعضو الأكاديمية الوطنية الأمريكية للعلوم، وحائز قلادة العلوم الوطنية الأمريكية سنة 2007 وميدالية بريستلي سنة 2016، ورائد في دراسة الجسيمات النانوية الذهبية وتطبيقاتها في الطب."
  en: "Egyptian-American physical chemist, born in 1933, author of the spectroscopic 'El-Sayed rule' that bears his name, member of the US National Academy of Sciences, recipient of the US National Medal of Science in 2007 and the Priestley Medal in 2016, and a pioneer of gold nanoparticle research and its medical applications."
  ur: "مصری نژاد امریکی طبعی کیمیا دان، جو 1933 میں پیدا ہوئے، طیف بینی کی «السید قاعدہ» کے خالق جس پر ان کا نام ہے، امریکی قومی اکادمی آف سائنسز کے رکن، 2007 میں امریکی قومی تمغۂ سائنس اور 2016 میں پریسٹلی میڈل کے حامل، اور سونے کے نینو ذرات کی تحقیق اور اس کے طبی استعمالات کے پیش رو۔"
