summary:
  ar: "مهاجم وُلد في الخرطوم بالسودان سنة 1996 وانتقل إلى قطر طفلًا، وهو قائد الدحيل والهداف التاريخي لمنتخب قطر. سجل تسعة أهداف قياسية في نسخة واحدة من كأس آسيا (2019) ونال جائزة أفضل لاعب في تلك البطولة، وهو اللاعب الوحيد الذي سجل في كأس آسيا وكوبا أمريكا والكأس الذهبية."
  en: "Striker born in Khartoum, Sudan, in 1996 who moved to Qatar as a child; he captains Al-Duhail and is Qatar's all-time top scorer. He scored a record nine goals in a single AFC Asian Cup edition (2019) and was named that tournament's best player, and he is the only footballer to have scored at the Asian Cup, the Copa América and the CONCACAF Gold Cup."
  ur: "اسٹرائیکر، 1996 میں خرطوم، سوڈان میں پیدا ہوئے اور بچپن میں قطر منتقل ہوئے؛ وہ الدحیل کے کپتان اور قطر کے ہم وقتی سب سے بڑے گول اسکورر ہیں۔ انہوں نے ایشین کپ کے ایک ہی ایڈیشن میں ریکارڈ نو گول کیے (2019) اور اس ٹورنامنٹ کے بہترین کھلاڑی قرار پائے؛ وہ واحد فٹبالر ہیں جنہوں نے ایشین کپ، کوپا امریکا اور کونکاکاف گولڈ کپ تینوں میں گول کیا۔"
  es: "Delantero nacido en Jartum, Sudán, en 1996, que se mudó a Qatar siendo niño; es capitán del Al-Duhail y máximo goleador histórico de Qatar. Marcó un récord de nueve goles en una sola edición de la Copa Asiática de la AFC (2019) y fue nombrado mejor jugador de ese torneo. Es el único futbolista que ha marcado en la Copa Asiática, la Copa América y la Copa Oro de la CONCACAF."
  fr: "Attaquant né à Khartoum (Soudan) en 1996, il a déménagé au Qatar durant son enfance. Capitaine d'Al-Duhail, il est le meilleur buteur de l'histoire du Qatar. Il a inscrit un record de neuf buts lors d'une seule édition de la Coupe d'Asie des Nations (2019), où il a été élu meilleur joueur. Il est le seul footballeur à avoir marqué lors de la Coupe d'Asie des Nations, de la Copa América et de la Gold Cup de la CONCACAF."
  tr: "1996'da Sudan'ın Hartum kentinde doğan ve çocukken Katar'a taşınan forvet, Al-Duhail'in kaptanı ve Katar milli takımının tüm zamanların gol kralı oyuncusudur. 2019'da Asya Kupası'nın tek bir edisyonunda rekor dokuz gol attı ve o turnuvada En İyi Oyuncu ödülünü kazandı; Asya Kupası, Copa América ve Altın Kupa'da gol atan tek oyuncu oldu."
  id: "Seorang penyerang yang lahir di Khartoum, Sudan, pada tahun 1996, yang pindah ke Qatar saat masih anak-anak, ia adalah kapten Al-Duhail dan pencetak gol terbanyak sepanjang masa tim nasional Qatar. Ia mencetak rekor sembilan gol dalam satu edisi Piala Asia (2019) dan memenangkan penghargaan Pemain Terbaik di turnamen tersebut, menjadi satu-satunya pemain yang mencetak gol di Piala Asia, Copa América, dan Piala Emas."
