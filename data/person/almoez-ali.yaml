summary:
  ar: "مهاجم وُلد في الخرطوم بالسودان سنة 1996 وانتقل إلى قطر طفلًا، وهو قائد الدحيل والهداف التاريخي لمنتخب قطر. سجل تسعة أهداف قياسية في نسخة واحدة من كأس آسيا (2019) ونال جائزة أفضل لاعب في تلك البطولة، وهو اللاعب الوحيد الذي سجل في كأس آسيا وكوبا أمريكا والكأس الذهبية."
  en: "Striker born in Khartoum, Sudan, in 1996 who moved to Qatar as a child; he captains Al-Duhail and is Qatar's all-time top scorer. He scored a record nine goals in a single AFC Asian Cup edition (2019) and was named that tournament's best player, and he is the only footballer to have scored at the Asian Cup, the Copa América and the CONCACAF Gold Cup."
  ur: "اسٹرائیکر، 1996 میں خرطوم، سوڈان میں پیدا ہوئے اور بچپن میں قطر منتقل ہوئے؛ وہ الدحیل کے کپتان اور قطر کے ہم وقتی سب سے بڑے گول اسکورر ہیں۔ انہوں نے ایشین کپ کے ایک ہی ایڈیشن میں ریکارڈ نو گول کیے (2019) اور اس ٹورنامنٹ کے بہترین کھلاڑی قرار پائے؛ وہ واحد فٹبالر ہیں جنہوں نے ایشین کپ، کوپا امریکا اور کونکاکاف گولڈ کپ تینوں میں گول کیا۔"
