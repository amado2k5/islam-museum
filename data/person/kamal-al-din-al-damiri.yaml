label:
  ar: "كمال الدين الدميري"
  en: "Kamal al-Din al-Damiri"
  es: "Kamal al-Din al-Damiri"
  fr: "Kamal al-Din al-Damiri"
  ur: "کمال الدین الدمیری"
roles: [jurist, scholar, writer]
gender: male
summary:
  ar: "محمد بن موسى بن عيسى بن علي الدميري، أبو البقاء، كمال الدين، باحث أديب من فقهاء الشافعية، من أهل دميرة بمصر وُلد وتوفي بالقاهرة، له «حياة الحيوان» و«الديباجة» شرح ابن ماجة، توفي سنة 808 هـ."
  en: "Muhammad ibn Musa ibn Isa ibn Ali al-Damiri, Abu al-Baqa', Kamal al-Din, a researcher and man of letters among the Shafi'i jurists, from Damira in Egypt, born and died in Cairo; author of Hayat al-Hayawan and a commentary on Ibn Majah; died 808 AH (1405)."
  es: "Muhammad ibn Musa ibn Isa ibn Ali al-Damiri, Abu al-Baqa', Kamal al-Din, investigador y hombre de letras entre los juristas shafi'íes, de Damira en Egipto, nacido y muerto en El Cairo; autor de Hayat al-Hayawan y un comentario sobre Ibn Majah; murió en el año 808 de la Hégira (1405)."
  fr: "Muhammad ibn Musa ibn Isa ibn Ali al-Damiri, Abu al-Baqa', Kamal al-Din, chercheur et homme de lettres parmi les juristes Shafi'i, originaire de Damira en Égypte, né et mort au Caire; auteur de Hayat al-Hayawan et d'un commentaire sur Ibn Majah; mort en 808 AH (1405)."
  ur: "محمد بن موسیٰ بن عیسیٰ ابن علی الدمری، ابو البقع، کمال الدین، ایک محقق اور شافعی فقہاء میں خطوط کا آدمی، مصر کے دمیرا سے، قاہرہ میں پیدا ہوئے اور وفات پائی۔ حیات الحیوان کے مصنف اور ابن ماجہ کی تفسیر؛ وفات 808ھ (1405)۔"
  tr: "Muhammed ibn Musa ibn İsa ibn Ali al-Damiri, Ebu el-Baqa, Kamal al-Din, araştırmacı ve yazar, Mısır'daki Dumeirah halkından olan Şafii hukukçularından Kamal al-Din, Kahire'de doğup ölmüştür. İbn Majah'ın 808 Hicri yılında ölen 'Hayat al-Hayawan' ve 'al-Dibaja' eserlerini yazmıştır."
  id: "Muhammad ibn Musa ibn Isa ibn Ali al-Damiri, Abu al-Baqa, Kamal al-Din, seorang peneliti dan penulis dari ahli hukum Shafi'i, dari masyarakat Dumeirah di Mesir, lahir dan meninggal di Kairo. Ia menulis 'Hayat al-Hayawan' dan 'al-Dibaja' karya Ibn Majah, yang meninggal pada tahun 808 H."
