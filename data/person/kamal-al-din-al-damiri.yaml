  ar: "محمد بن موسى بن عيسى بن علي الدميري، أبو البقاء، كمال الدين، باحث أديب من فقهاء الشافعية، من أهل دميرة بمصر وُلد وتوفي بالقاهرة، له «حياة الحيوان» و«الديباجة» شرح ابن ماجة، توفي سنة 808 هـ."
