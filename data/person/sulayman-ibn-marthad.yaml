class: person
label: { ar: "سليمان بن مرثد", en: "Sulayman ibn Marthad", es: "Sulayman ibn Marthad", fr: "Sulayman ibn Marthad", ur: "سلیمان بن مرثد" }
summary:
  ar: "سليمان بن مرثد أحد بني سعد بن مالك بن صبيعة بن قيس بن ثعلبة بن عكابة من المرائد بن ربيعة؛ طعن في عهد سلم لابن خازم على خراسان واتفقا على حكم ابن الزبير فلما ولاه إياها أبى القبول وقال إن ابن الزبير بخليفة وإنما هو رجل عائذ بالبيت فحاربه ابن خازم وهو في ستة آلاف وسليمان في خمسة عشر ألفاً وشعاره يا نصر اقترب فقتله قيس بن عاصم السلمي واحتز رأسه."
  en: "Sulayman ibn Marthad of Banu Sa'd of the Mura'id of Rabi'a; he contested Salm's covenant for Ibn Khazim, accepted Ibn al-Zubayr's arbitration, then refused the award — 'Ibn al-Zubayr is no caliph, only a man sheltering at the House' — and fell with fifteen thousand against six thousand to Qays ibn Asim's sword, his cry 'ya nasr iqtarib', his head taken."
  es: "Sulayman ibn Marthad de Banu Sa'd de los Mura'id de Rabi'a; impugnó el pacto de Salm por Ibn Khazim, aceptó el arbitraje de Ibn al-Zubayr, luego rechazó el laudo —'Ibn al-Zubayr no es califa, solo un hombre que se refugia en la Casa'— y cayó con quince mil contra seis mil bajo la espada de Qays ibn Asim, gritando 'ya nasr iqtarib', y le cortaron la cabeza."
  fr: "Sulayman ibn Marthad des Banu Sa'd des Mura'id de Rabi'a; il contesta l'alliance de Salm pour Ibn Khazim, accepta l'arbitrage d'Ibn al-Zubayr, puis refusa la sentence — « Ibn al-Zubayr n'est pas un calife, seulement un homme qui se réfugie à la Maison » — et tomba avec quinze mille contre six mille sous l'épée de Qays ibn Asim, son cri « ya nasr iqtarib », sa tête prise."
  ur: "بنو سعد کے سلیمان بن مرثد مرید ربیعہ؛ اس نے ابن خزیم کے لئے سالم کے عہد کا مقابلہ کیا، ابن الزبیر کی ثالثی کو قبول کیا، پھر ایوارڈ سے انکار کر دیا - 'ابن الزبیر کوئی خلیفہ نہیں ہے، صرف ایک آدمی ہے جو ایوان میں پناہ لے رہا ہے' - اور قیس ابن عاصم کی تلوار، اس کے سر، اس کے سر پر چھ ہزار کے مقابلے میں پندرہ ہزار کے ساتھ گر پڑے۔"
