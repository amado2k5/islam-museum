label: { ar: "سليمان بن مرثد", en: "Sulayman ibn Marthad" }
summary:
  ar: "سليمان بن مرثد أحد بني سعد بن مالك بن صبيعة بن قيس بن ثعلبة بن عكابة من المرائد بن ربيعة؛ طعن في عهد سلم لابن خازم على خراسان واتفقا على حكم ابن الزبير فلما ولاه إياها أبى القبول وقال إن ابن الزبير بخليفة وإنما هو رجل عائذ بالبيت فحاربه ابن خازم وهو في ستة آلاف وسليمان في خمسة عشر ألفاً وشعاره يا نصر اقترب فقتله قيس بن عاصم السلمي واحتز رأسه."
  en: "Sulayman ibn Marthad of Banu Sa'd of the Mura'id of Rabi'a; he contested Salm's covenant for Ibn Khazim, accepted Ibn al-Zubayr's arbitration, then refused the award — 'Ibn al-Zubayr is no caliph, only a man sheltering at the House' — and fell with fifteen thousand against six thousand to Qays ibn Asim's sword, his cry 'ya nasr iqtarib', his head taken."
