label: { ar: "علي بن المحسن التنوخي", en: "Ali ibn al-Muhsin al-Tanukhi", es: "Ali ibn al-Muhsin al-Tanukhi", fr: "Ali ibn al-Muhsin al-Tanukhi", ur: "علی ابن المحسن التنوخی" }
summary:
  ar: "أبو القاسم علي بن المحسن بن علي التنوخي؛ من بيت القضاة والأدباء؛ والد القاضي أبي علي الحسن الذي قال فيه الثعالبي: «هلال ذلك القمر وغصن هاتيك الشجرة والشاهد العدل جد أبيه وفضل والفرع المسند لأصله والنائب عنه في حماته والقائم مقامه بعد وفاته»؛ وذكرهما الثعالبي في باب واحد فقدّم ذكر الأب {cite:wafayat-ayan}."
  en: "Abu al-Qasim Ali b. al-Muhsin al-Tanukhi — of the famous Tanukhi house of qadis and adibs; father of Qadi Abu Ali al-Hasan whom al-Tha'alibi praised in the joint notice {cite:wafayat-ayan}."
  es: "Abu al-Qasim Ali b. al-Muhsin al-Tanukhi—de la famosa casa Tanukhi de qadis y adibs; padre de Qadi Abu Ali al-Hasan a quien al-Tha'alibi elogió en el aviso conjunto {cita:wafayat-ayan}."
  fr: "Abou al-Qasim Ali b. al-Muhsin al-Tanukhi — de la célèbre maison Tanukhi des cadis et adibs; père de Qadi Abu Ali al-Hasan qu'al-Tha'alibi a loué dans l'avis conjoint {cite: wafayat-ayan}."
  ur: "ابو القاسم علی بی۔ المحسن التنوخی — قادیانیوں اور ادیبوں کے مشہور تنوخی گھر سے؛ قادی ابو علی الحسن کے والد جن کی الثعلبی نے مشترکہ نوٹس میں تعریف کی ہے۔"
  tr: "Ebu el-Kasım Ali ibn el-Muhsin ibn Ali el-Tanukhi; hakimler ve yazarlar evinden; hakim Ebu Ali el-Hasan'ın babası, el-Thaalibi hakkında şöyle demiştir: \"O ayın hilal, o ağacın dalı, adil şahit, babasının atası ve erdemi ve kökeninin kaynağı olan dal, kayınvalidesinde vekili ve ölümünden sonra vekilidir\"; el-Thaalibi bunlardan bir bölümde bahsetti, bu yüzden babanın adı {atıf:wafayat-ayan} öncesinde geçti."
  id: "Abu al-Qasim Ali ibn al-Muhsin ibn Ali al-Tanukhi; dari rumah hakim dan penulis; ayah dari hakim Abu Ali al-Hasan, tentang siapa al-Thaalibi berkata: \"Bulan sabit bulan itu, cabang pohon itu, saksi yang adil, leluhur dan kebajikan ayahnya, dan cabang yang garis keturunannya menjadi sumber asal-usulnya, wakilnya di ibu mertua, dan wakilnya setelah kematiannya\"; al-Thaalibi menyebutkan mereka dalam satu bab, sehingga penyebutan ayahnya {cite:wafayat-ayan} didahului."
