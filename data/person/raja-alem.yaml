summary:
  ar: "روائية سعودية وُلدت في مكة سنة 1956، درست الأدب الإنجليزي في جامعة الملك عبد العزيز بجدة وبدأت الكتابة في صفحة «حروف وأفكار» بجريدة الرياض، ووثّقت في رواياتها بيئة مكة والحجاز بسرد رمزي ذي ألوان صوفية وغنوصية. فازت روايتها «طوق الحمام» بالجائزة العالمية للرواية العربية سنة 2011 مناصفةً مع محمد الأشعري، ومن أعمالها «خاتم» والمجموعة القصصية «نهر الحيوان» (1994)."
  en: "Saudi novelist born in Mecca in 1956. She studied English literature at King Abdulaziz University in Jeddah, began writing on Al-Riyadh newspaper's 'Letters and Ideas' page, and works as a tutor at the Center for Training Kindergarten Teachers in Jeddah. Her novels document the Meccan and Hejazi environment in a symbolic narrative mode with Sufi and Gnostic colouring. Her novel The Dove's Necklace (Tawq al-Hamam) shared the 2011 International Prize for Arabic Fiction with Mohammed Achaari; her other works include Khatam and the short-story collection Nahr al-Hayawan (The Animal River, 1994)."
  ur: "سعودی ناول نگار، 1956 میں مکہ میں پیدا ہوئیں۔ انہوں نے جدہ کی شاہ عبدالعزیز یونیورسٹی میں انگریزی ادب پڑھا اور الریاض اخبار کے صفحۂ «حروف و افکار» سے لکھنے کا آغاز کیا۔ ان کے ناول «طوق الحمام» نے 2011 میں عربی فکشن کا بین الاقوامی انعام محمد الاشعری کے ساتھ مشترکہ طور پر جیتا؛ ان کی دیگر تصانیف میں «خاتم» اور افسانوی مجموعہ «نہر الحیوان» (1994) شامل ہیں۔"
  es: "Novelista saudí nacida en La Meca en 1956. Estudió literatura inglesa en la Universidad Rey Abdulaziz de Yeda, comenzó a escribir en la sección de «Cartas e Ideas» del periódico Al-Riyadh y trabaja como tutora en el Centro de Formación de Maestros de Jardín de Infancia de Yeda. Sus novelas documentan el entorno de La Meca y el Hiyaz mediante una narrativa simbólica con tintes sufíes y gnósticos. Su novela «El collar de la paloma» (Tawq al-Hamam) compartió el Premio Internacional de Ficción Árabe de 2011 con Mohammed Achaari; entre sus otras obras se encuentran «Khatam» y la colección de relatos «Nahr al-Hayawan» (El río de los animales, 1994)."
  fr: "Romancière saoudienne née à La Mecque en 1956, elle a étudié la littérature anglaise à l'Université du Roi Abdulaziz à Djeddah. Elle a commencé à écrire pour la rubrique « Courrier des lecteurs » du journal Al-Riyadh et travaille comme formatrice au Centre de formation des enseignants de maternelle de Djeddah. Ses romans, empreints de symbolisme et de spiritualité soufie et gnostique, décrivent l'environnement mecquois et hedjazien. Son roman « Le Collier de la colombe » (Tawq al-Hamam) a reçu le Prix international de la fiction arabe 2011, ex aequo avec Mohammed Achaari. Parmi ses autres œuvres figurent « Khatam » et le recueil de nouvelles « Nahr al-Hayawan » (La Rivière des animaux, 1994)."
  tr: "1956'da Mekke'de doğan Suudi romancı olan Swe, Cidde'deki Kral Abdulaziz Üniversitesi'nde İngiliz edebiyatı okudu ve Al-Riyad gazetesinin \"Mektuplar ve Fikirler\" sayfası için yazmaya başladı. Romanlarında Mekke ve Hicaz çevresini Sufi ve Gnostik renklerle sembolik anlatılarla belgeledi. \"Güvercinin Tasması\" adlı romanı, 2011 yılında Muhammad Al-Ash'ari ile paylaştığı Uluslararası Arap Kurgu Ödülü'nü kazandı. Eserleri arasında \"The Ring\" ve kısa öykü koleksiyonu \"River of the Animal\" (1994) bulunmaktadır."
  id: "Seorang novelis Saudi yang lahir di Mekah pada tahun 1956, ia belajar sastra Inggris di Universitas King Abdulaziz di Jeddah dan mulai menulis untuk halaman \"Letters and Ideas\" surat kabar Al-Riyadh. Ia mendokumentasikan lingkungan Mekah dan Hijaz dalam novelnya dengan narasi simbolis berwarna Sufi dan Gnostik. Novelnya \"The Dove's Collar\" memenangkan Penghargaan Internasional untuk Fiksi Arab pada tahun 2011, yang dibagikan bersama Muhammad Al-Ash'ari. Karyanya meliputi \"The Ring\" dan kumpulan cerita pendek \"River of the Animal\" (1994)."
