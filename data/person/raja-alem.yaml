summary:
  ar: "روائية سعودية وُلدت في مكة سنة 1956، درست الأدب الإنجليزي في جامعة الملك عبد العزيز بجدة وبدأت الكتابة في صفحة «حروف وأفكار» بجريدة الرياض، ووثّقت في رواياتها بيئة مكة والحجاز بسرد رمزي ذي ألوان صوفية وغنوصية. فازت روايتها «طوق الحمام» بالجائزة العالمية للرواية العربية سنة 2011 مناصفةً مع محمد الأشعري، ومن أعمالها «خاتم» والمجموعة القصصية «نهر الحيوان» (1994)."
  en: "Saudi novelist born in Mecca in 1956. She studied English literature at King Abdulaziz University in Jeddah, began writing on Al-Riyadh newspaper's 'Letters and Ideas' page, and works as a tutor at the Center for Training Kindergarten Teachers in Jeddah. Her novels document the Meccan and Hejazi environment in a symbolic narrative mode with Sufi and Gnostic colouring. Her novel The Dove's Necklace (Tawq al-Hamam) shared the 2011 International Prize for Arabic Fiction with Mohammed Achaari; her other works include Khatam and the short-story collection Nahr al-Hayawan (The Animal River, 1994)."
  ur: "سعودی ناول نگار، 1956 میں مکہ میں پیدا ہوئیں۔ انہوں نے جدہ کی شاہ عبدالعزیز یونیورسٹی میں انگریزی ادب پڑھا اور الریاض اخبار کے صفحۂ «حروف و افکار» سے لکھنے کا آغاز کیا۔ ان کے ناول «طوق الحمام» نے 2011 میں عربی فکشن کا بین الاقوامی انعام محمد الاشعری کے ساتھ مشترکہ طور پر جیتا؛ ان کی دیگر تصانیف میں «خاتم» اور افسانوی مجموعہ «نہر الحیوان» (1994) شامل ہیں۔"
