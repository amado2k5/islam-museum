summary:
  ar: "أبو العباس أحمد بن عبد الرحمن بن مضاء اللخمي القرطبي (1116–1196م)، نحوي وفقيه ظاهري من قرطبة، ولي قضاء فاس وبجاية ثم صار قاضي الجماعة في الدولة الموحدية حتى وفاته. اشتهر بثورته على نظرية العامل في النحو في كتابه «الرد على النحاة»، فدعا إلى إلغاء التقدير والعلل النحوية وبناء النحو على ظاهر كلام العرب، وهي ثورة امتداد لمذهبه الظاهري في الفقه الذي ينفي القياس والتعليل."
  en: "Abu al-Abbas Ahmad ibn Abd al-Rahman ibn Mada' al-Lakhmi of Cordoba (1116–1196), a grammarian and Zahiri jurist who held judgeships at Fes and Béjaïa and rose to chief judge (qadi al-jama'a) of the Almohad caliphate, an office he kept until his death. He is famous for his revolt against the theory of grammatical governance ('amil) in his Refutation of the Grammarians (al-Radd 'ala al-Nuhat), calling for the abolition of implied elements and grammatical causes and for a grammar built on the manifest surface of Arabic speech — the linguistic extension of his Zahiri legal method, which denies analogy and causal reasoning in the law."
  ur: "ابو العباس احمد بن عبد الرحمٰن بن مضاء لخمی قرطبی (1116ء–1196ء)، قرطبہ کے نحوی اور ظاہری فقیہ تھے۔ فاس اور بجایہ کی قضا کے بعد وہ ریاستِ موحدین کے قاضی الجماعہ بنے اور وفات تک اسی عہدے پر رہے۔ وہ اپنی کتاب «الرد على النحاة» میں عامل کے نظریے کے خلاف اپنی بغاوت کے لیے مشہور ہیں؛ انھوں نے تقدیر اور نحوی علل کے خاتمے اور عربی کلام کے ظاہر پر مبنی نحو کی دعوت دی، جو فقہ میں ان کے ظاہری منہج کی لسانی توسیع تھی۔"
