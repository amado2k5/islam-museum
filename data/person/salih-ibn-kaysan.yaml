summary:
  ar: "من كبار التابعين؛ عهد إليه عمر بن عبد العزيز، والي المدينة في عهد الوليد بن عبد الملك، بالإشراف على بناء المسجد النبوي وتوسعته، وقد استغرق العمل نحو ثلاث سنوات، وزار الوليد المدينة سنة 90هـ ليطمئن على سير العمل {cite:umayyad-birth-to-fall-2006 p. 163}. ويذكر الكتاب أنه اختاره عبد العزيز بن مروان مربياً لابنه عمر بن عبد العزيز، فكان يلزمه الصلوات في المسجد، وأنكر عليه تأخره عن الجماعة لأجل شعره. {cite:salabi-umayyad-state-2020 p.168}"
