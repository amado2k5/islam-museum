id: person/salih-ibn-kaysan
class: person
label: { ar: "صالح بن كيسان" }
gender: male
summary:
  ar: "من كبار التابعين؛ عهد إليه عمر بن عبد العزيز، والي المدينة في عهد الوليد بن عبد الملك، بالإشراف على بناء المسجد النبوي وتوسعته، وقد استغرق العمل نحو ثلاث سنوات، وزار الوليد المدينة سنة 90هـ ليطمئن على سير العمل {cite:umayyad-birth-to-fall-2006 p. 163}. ويذكر الكتاب أنه اختاره عبد العزيز بن مروان مربياً لابنه عمر بن عبد العزيز، فكان يلزمه الصلوات في المسجد، وأنكر عليه تأخره عن الجماعة لأجل شعره. {cite:salabi-umayyad-state-2020 p.168}"
  tr: "Önde gelen takipçiler arasında, el-Velid bin Abdülmelik'in saltanatı sırasında Medine valisi olan Ömer bin Abdülaziz, Peygamber Camii'nin inşası ve genişletilmesini denetlemekle görevlendirmiştir. Çalışma yaklaşık üç yıl sürmüş ve el-Velid, 90 Hicri'de Medine'yi ziyaret ederek çalışmanın ilerleyişini kontrol etmiştir {atıf:umayyad-birth-to-fall-2006, s. 163}. Kitapta, Abdulaziz bin Mervan'ın onu oğlu Ömer bin Abdülaziz'in bakıcısı olarak seçtiği, bu yüzden camide namaz kılmak zorunda kaldığı ve şiirleri nedeniyle cemaat namazlarına geç kaldığı için eleştirdiği belirtilir. {cite:Selabi-Umayyad-devlet-2020 s.168}"
  id: "Di antara para pengikut terkemuka, Umar ibn Abd al-Aziz, gubernur Madinah pada masa pemerintahan al-Walid ibn Abd al-Malik, mempercayakan kepadanya untuk mengawasi pembangunan dan perluasan Masjid Nabi. Pekerjaan ini memakan waktu sekitar tiga tahun, dan al-Walid mengunjungi Madinah pada tahun 90 H untuk memeriksa kemajuan pekerjaan {cite:umayyad-birth-to-fall-2006, hlm. 163}. Buku tersebut menyebutkan bahwa Abdul Aziz ibn Marwan memilihnya sebagai pengasuh putranya Umar ibn Abd al-Aziz, sehingga ia terpaksa melakukan shalat di masjid dan mengkritiknya karena terlambat dalam shalat jamaah karena puisinya. {cite:salabi-umayyad-state-2020 hlm.168}"
