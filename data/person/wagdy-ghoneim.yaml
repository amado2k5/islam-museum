summary:
  ar: "واعظ وإمام مصري، من مواليد الإسكندرية عام 1951، اشتهر بمحاضراته ودروسه الدينية في مصر وخارجها، وكان نشطًا في صفوف الحركة الإسلامية في مصر؛ يحفظ له أرشيف أسابيل ثماني سلاسل دروس منها «الأخلاق الحميدة» و«سلوك المسلم الملتزم» و«الشروح على مبادئ التوحيد»."
  en: "Egyptian preacher and imam, born in Alexandria in 1951, known for his religious lectures and lessons in Egypt and abroad; he was active in the ranks of the Egyptian Islamic movement. The Assabile archive keeps eight series of his recorded lessons, among them 'Al-Akhlaq al-Hamidah' (noble ethics), 'Suluk al-Muslim al-Multazim' (the committed Muslim's conduct) and 'A commentary on the principles of tawhid'."
  ur: "مصری واعظ اور امام، 1951 میں اسکندریہ میں پیدا ہوئے، مصر اور بیرونِ مصر اپنے دینی خطبات اور دروس کے لیے مشہور؛ وہ مصری اسلامی تحریک کے حلقوں میں سرگرم رہے۔ اسابیل آرکائیو میں ان کے آٹھ سلسلے محفوظ ہیں جن میں «الأخلاق الحميدہ»، «سلوک المسلم الملتزم» اور «مبادئ التوحید کی شرح» شامل ہیں۔"
