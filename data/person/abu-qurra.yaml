  tr: "Theodore Abu Qura, Harran'ın Melkit piskoposuydu ve İbn al-Nadim ile birlikte yazdığı bir kitapta, başkomutan Anstorus'u eleştirmiş ve bir grup insan da onu çürütmüştür. {cite:fihrist-ibn-al-nadim s. 58}."
  id: "Theodore Abu Qura adalah uskup Melkite di Harran, dan ia memiliki sebuah buku bersama Ibn al-Nadim di mana ia mengkritik Anstorus sang pemimpin, dan sekelompok orang membantahnya. {cite:fihrist-ibn-al-nadim p. 58}."
