summary:
  en: The Prophet of Islam (c. 570–632 CE), through whom Muslims believe the Qur'an was revealed, and the founder of the first Muslim community in Medina.
  ar: "نبي الإسلام (نحو 570–632م)، الذي يؤمن المسلمون بنزول القرآن عليه، ومؤسس أول مجتمع إسلامي في المدينة المنورة. توفي في المدينة المنورة في ربيع الأول سنة 11 هـ وهو ابن ثلاث وستين سنة {cite:mubarakpuri-raheeq p.444}، وكُفّن في ثلاثة أثواب يمانية بيض، وغسّله علي، وأعان العباس والفضل وقثم وأسامة وشقران {cite:mubarakpuri-raheeq p.445-446}."
