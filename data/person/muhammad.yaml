summary:
  en: The Prophet of Islam (c. 570–632 CE), through whom Muslims believe the Qur'an was revealed, and the founder of the first Muslim community in Medina.
  ar: "نبي الإسلام (نحو 570–632م)، الذي يؤمن المسلمون بنزول القرآن عليه، ومؤسس أول مجتمع إسلامي في المدينة المنورة. كُفّن في ثلاثة أثواب: ثوبين صحاريين وثوب حبرة. ونزل في قبره علي بن أبي طالب، والفضل وقثم ابنا العباس، وشقران مولاه. واختُلف في عمره، فقال ابن عباس وأبو هريرة وعائشةم: ثلاث وستون، وقيل خمس وستون عن ابن عباس، وقتادة عن الحسن عن دغفل بن حنظلة، وقيل ستون عن عروة بن الزبير وعائشةا {cite:muruj-al-dhahab p. 581-582}. ومن مشاهد بيته في الصحيح ما رآه عمر في مشربته زمن الاعتزال: حصير لا يفصل بينه وبين الأرض، ووسادة من أدم حشوها ليف، وأثر الحصير في جنبه {cite:sahih-al-bukhari 4913}. وعند مسلم أسماؤه الخمسة: «أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب الذي ليس بعده نبي» {cite:sahih-muslim 2355}. وصلى حتى انتفخت قدماه، فقيل له، فقال: «أفلا أكون عبداً شكوراً» {cite:sahih-muslim 2820}"
