summary:
  en: "The Prophet of Islam (c. 570–632 CE), through whom Muslims believe the Qur'an was revealed, and the founder of the first Muslim community in Medina. The Encyclopaedia of Islam presents him both as the Messenger of God of Muslim faith, fully human, and as a historical figure, tracing his emigration to Medina in 622, the truce of al-Hudaybiya and the entry into Mecca, and it leaves the year of his birth open. It gives his death as a Monday in 632."
  ar: "نبي الإسلام ⁦(نحو 570–632م)⁩، الذي يؤمن المسلمون بنزول القرآن عليه، ومؤسس أول مجتمع إسلامي في المدينة المنورة. توفي في المدينة المنورة في ربيع الأول سنة 11 هـ وهو ابن ثلاث وستين سنة {cite:mubarakpuri-raheeq p.444}، وكُفّن في ثلاثة أثواب يمانية بيض، وغسّله علي، وأعان العباس والفضل وقثم وأسامة وشقران {cite:mubarakpuri-raheeq p.445-446}. وتصفه مقالة موسوعة الإسلام بأنه رسول الله في الإيمان الإسلامي وبأنه بشر تام، وتتتبع تاريخيا هجرته إلى المدينة سنة 622م وصلح الحديبية ودخوله مكة، وتترك سنة مولده مفتوحة."
  ur: "اسلام کے نبی ⁦(تقریباً 570–632ء)⁩ جن پر مسلمانوں کے ایمان کے مطابق قرآن نازل ہوا، اور مدینہ میں پہلے مسلم معاشرے کے بانی۔ موسوعۂ اسلام انہیں مسلم ایمان کے اللہ کے رسول اور مکمل انسان کے طور پر بھی پیش کرتی ہے اور ایک تاریخی شخصیت کے طور پر بھی، اور 622ء میں مدینہ کی ہجرت، صلحِ حدیبیہ اور مکہ میں داخلے کا ذکر کرتی ہے جبکہ ولادت کا سال کھلا چھوڑتی ہے۔ وہ ان کی وفات 632ء میں پیر کے دن بتاتی ہے۔"
  es: "El Profeta del Islam (c. 570-632 d. C.), a través del cual los musulmanes creen que se reveló el Corán, y fundador de la primera comunidad musulmana en Medina. La Enciclopedia del Islam lo presenta tanto como el Mensajero de Dios de la fe musulmana, plenamente humano, como una figura histórica, relatando su emigración a Medina en 622, la tregua de al-Hudaybiya y la entrada en La Meca, aunque no especifica el año de su nacimiento. Indica que falleció un lunes de 632."
  fr: "Le Prophète de l'Islam (env. 570-632), par qui les musulmans croient que le Coran a été révélé, et le fondateur de la première communauté musulmane à Médine. L'Encyclopédie de l'Islam le présente à la fois comme le Messager de Dieu de la foi musulmane, pleinement humain, et comme un personnage historique, retraçant son émigration à Médine en 622, la trêve d'al-Hudaybiya et l'entrée à La Mecque, sans préciser l'année de sa naissance. Elle situe sa mort un lundi de l'année 632."
  tr: "İslam Peygamberi (yaklaşık 570–632 MS), Müslümanların Kur'an'ın vahiy edildiğine inandığı ve Medine'deki ilk İslami cemaatin kurucusudur. 11 Hicri yılında, Medine'de Rabi'al-Awwal'da, altmış üç yaşında (atıf:mubarakpuri-raheeq s.444}, üç beyaz Yemen giysisi içinde, Ali tarafından yıkanmış ve Abbas, Al-Fadl, Kutham, Usama ve Shakkran'ın yardımıyla vefat etmiştir {cite:mubarakpuri-raheeq s.445-446}. İslam Ansiklopedisi makalesi, onu İslam inancında Allah'ın Elçisi ve tam bir insan olarak tanımlar. Tarihsel olarak, 622 yılında Medine'ye göçü, Hudaybiye Antlaşması ve Mekke'ye girişi ile doğum yılını açık bırakır."
  id: "Nabi Islam (sekitar 570–632 M), yang diyakini umat Muslim telah diwahyukan Al-Qur'an, dan pendiri komunitas Islam pertama di Madinah. Ia wafat di Madinah pada Rabi' al-Awwal pada tahun 11 H pada usia enam puluh tiga tahun {cite:mubarakpuri-raheeq hlm.444}, mengenakan tiga pakaian putih Yaman, dicuci oleh Ali, dan dibantu oleh Abbas, Al-Fadl, Qutham, Usama, dan Shaqran {cite:mubarakpuri-raheeq hlm.445-446}. Artikel tentang Ensiklopedia Islam menggambarkannya sebagai Rasulullah dalam agama Islam dan sebagai manusia yang utuh. Secara historis, artikel ini menelusuri migrasinya ke Madinah pada tahun 622 M, Perjanjian Hudaybiyyah, dan kemasukannya ke Mekah, meninggalkan tahun kelahirannya terbuka."
