summary:
  ar: "أحمد عصمت عبد المجيد (22 مارس 1923 – 21 ديسمبر 2013)، دبلوماسي مصري من الإسكندرية، شارك شابًا في وفد 1957 الذي تفاوض على استئناف العلاقات مع فرنسا، وكان سفير مصر لدى فرنسا ثم وزير خارجيتها (1984–1991)، فالأمين العام الخامس لجامعة الدول العربية (1991–2001) خلفًا للشاذلي القليبي وخلفه عمرو موسى."
  en: "Ahmed Asmat Abdel-Meguid (22 March 1923 – 21 December 2013) was an Egyptian diplomat from Alexandria who, as a young diplomat, took part in the 1957 delegation that negotiated the resumption of relations with France. He was Egypt's ambassador to France and then its foreign minister (1984–1991), and the fifth Secretary-General of the Arab League (1991–2001), succeeding Chedli Klibi and succeeded by Amr Moussa."
  ur: "احمد عصمت عبد المجید (22 مارچ 1923ء – 21 دسمبر 2013ء) اسکندریہ سے تعلق رکھنے والے مصری سفارت کار تھے۔ نوجوان سفارت کار کی حیثیت سے انہوں نے 1957ء کے اس وفد میں حصہ لیا جس نے فرانس سے تعلقات کی بحالی پر مذاکرات کیے۔ وہ فرانس میں مصر کے سفیر اور پھر وزیرِ خارجہ (1984ء–1991ء) رہے، اس کے بعد عرب لیگ کے پانچویں سیکرٹری جنرل (1991ء–2001ء) بنے؛ ان کے پیش رو الشاذلی القلیبی اور جانشین عمرو موسیٰ تھے۔"
