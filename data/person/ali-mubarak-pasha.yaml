summary:
  ar: "علي باشا مبارك ⁦(١٨٢٣–١٨٩٣م)⁩؛ وزير مصري من المؤرخين العلماء العصاميين. ولد في قرية برنبال من دقهلية مصر وتلقى العربية وحذق بعض الفنون، وسافر سنة ١٢٦٠هـ مع البعثة المصرية إلى باريس فتعلم فن الاستحكام والمفرقعات والحركات الحربية، وعاد إلى مصر فتقلب في الوظائف العسكرية وبلغ رتبة أمير ألاي وحضر الحرب التركية الروسية سنة ١٢٧٠هـ، ثم نُصب ناظراً للأوقاف المصرية وأُضيفت إليه المعارف فأنشأ مدارس كثيرة وأبقى آثاراً منها دار الكتب المصرية في القاهرة، وتولى نظارة الأشغال العامة سنة ١٢٩٢هـ فحدثت حادثة عرابي باشا فاستقال مع زملائه في الوزارة، وآخر أعماله ولايته نظارة المعارف المصرية سنة ١٣٠٥هـ. له «الخطط التوفيقية» في عشرين جزءاً حذا فيه حذو المقريزي في خططه، وله رواية سماها «علم الدين» في عدة مجلدات ضمنها أبحاثاً دينية واجتماعية {cite:al-aalam tarjama}."
  en: "Ali Mubarak Pasha (1823–1893 CE) — the self-made engineer-minister who founded Egypt's Dar al-Kutub and wrote the twenty-volume al-Khitat al-Tawfiqiyya on Maqrizi's model {cite:al-aalam tarjama}."
  es: "Ali Mubarak Pasha (1823–1893 d.C.): el ingeniero-ministro que fundó Dar al-Kutub en Egipto y escribió los veinte volúmenes al-Khitat al-Tawfiqiyya sobre el modelo de Maqrizi {citar:al-aalam tarjama}."
  fr: "Ali Moubarak Pacha (1823-1893 CE) — l'ingénieur-ministre autodidacte qui a fondé le Dar al-Kutub en Égypte et a écrit les vingt volumes al-Khitat al-Tawfiqiyya sur le modèle de Maqrizi {cite: al-aalam tarjama}."
  ur: "علی مبارک پاشا ⁦(1823-1893 عیسوی)⁩ - ایک خود ساختہ انجینئر وزیر جس نے مصر کے دار الکتب کی بنیاد رکھی اور مقریزی کے نمونے پر بیس جلدوں والی الخطات التوفیقیہ لکھی۔"
  tr: "Ali Paşa Mübarek (1823–1893); Mısırlı bir din adamı ve kendi kendini yetiştirmiş tarihçi. Mısır'ın Dakahlia bölgesindeki Barnabal köyünde doğdu, burada Arapça öğrendi ve bazı sanatlarda ustalaştı. 1260 Hicri'de, Mısır misyonuyla birlikte tahkimat sanatı, havai fişek ve askeri manevralar öğrenmek için Paris'e gitti. Mısır'a döndü, burada askeri rütbelerde yükseldi, Alay Emiri rütbesine yükseldi ve 1270 Hicri Rus-Türk Savaşı'na katıldı. Daha sonra Mısır Vakıfları'nın müdürü olarak atandı ve bilgisi arttı. Birçok okul kurdu ve Kahire'deki Mısır Ulusal Kütüphanesi dahil olmak üzere izlerini korudu. 1292 Hicri'de Urabi Paşa olayı gerçekleştiğinde Kamu İşleri Müdürü oldu ve bakanlıktaki meslektaşlarıyla birlikte istifa etti. Son görevi 1305 Hicri'de Mısır Eğitim Müdürlüğüydü. \"Al-Khitat al-Tawfiqiyya\"yı yirmi ciltlik olarak yazdı; planlarında el-Maqrizi'nin izinden gitti ve dini ve sosyal çalışmaları içeren birkaç ciltlik \"Ilm al-Din\" adlı bir roman kaleme aldı {cite:al-alam tarjama}."
  id: "Ali Pasha Mubarak (1823–1893 M); seorang menteri Mesir dan sejarawan otodidak. Ia lahir di desa Barnabal di Dakahlia, Mesir, di mana ia belajar bahasa Arab dan menguasai beberapa seni. Pada tahun 1260 H, ia melakukan perjalanan bersama misi Mesir ke Paris untuk mempelajari seni pertahanan, kembang api, dan manuver militer. Ia kembali ke Mesir, di mana ia naik pangkat militer, mencapai pangkat Emir Alai, dan ikut serta dalam Perang Rusia-Turki pada tahun 1270 H. Ia kemudian diangkat sebagai direktur Endowmen Mesir, dan pengetahuan pun ditambahkan. Ia mendirikan banyak sekolah dan melestarikan jejak-jejaknya, termasuk Perpustakaan Nasional Mesir di Kairo. Ia menjadi Direktur Pekerjaan Umum pada tahun 1292 H, ketika insiden Urabi Pasha terjadi, yang membuatnya mengundurkan diri bersama rekan-rekannya di kementerian. Pekerjaan terakhirnya adalah sebagai Direktur Pendidikan Mesir pada tahun 1305 H. Ia menulis \"Al-Khitat al-Tawfiqiyya\" dalam dua puluh jilid, mengikuti jejak al-Maqrizi dalam rencananya, dan ia menulis novel berjudul \"Ilm al-Din\" dalam beberapa jilid yang memuat studi agama dan sosial {cite:al-aalam tarjama}."
