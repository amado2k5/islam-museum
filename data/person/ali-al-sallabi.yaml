summary:
  ar: "مؤرخ وسياسي ليبي، وُلد سنة 1963. اشتهر بسير وتراجم عربية متعددة المجلدات عن العصور الإسلامية الأولى والعثمانية منها السيرة النبوية و«الدولة العثمانية» و«الدولة السلجوقية»، وله حضور سياسي في ليبيا بعد ثورة 2011."
  en: "Libyan historian and politician, born in 1963. He is known for multi-volume Arabic biographies and histories of early Islamic and Ottoman eras, including a sira of the Prophet and histories of the Ottoman and Seljuk states, with a political role in Libya after the 2011 revolution."
  fr: "Historien et homme politique libyen, né en 1963. Il est connu pour ses biographies arabes en plusieurs volumes et ses histoires des premières époques islamiques et ottomanes, y compris une sira du prophète et des histoires des États ottomans et seldjoukides, avec un rôle politique en Libye après la révolution de 2011."
  ur: "لیبی مؤرخ اور سیاست دان، 1963 میں پیدا ہوئے۔ وہ ابتدائی اسلامی اور عثمانی ادوار پر کثیر الجلد عربی سیر و تاریخوں کے لیے مشہور ہیں جن میں سیرتِ نبوی اور «الدولۃ العثمانیہ» و «الدولۃ السلجوقیہ» شامل ہیں، اور 2011 کی انقلاب کے بعد لیبیا میں سیاسی کردار رکھتے ہیں۔"
  es: "Historiador y político libio, nacido en 1963. Es conocido por sus biografías en árabe en varios volúmenes e historias de las primeras épocas islámicas y otomanas, incluyendo una sira del Profeta e historias de los estados otomano y selyúcida, con un papel político en Libia después de la revolución de 2011."
