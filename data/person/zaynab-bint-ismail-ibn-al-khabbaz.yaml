summary:
  ar: "محدثة شامية تدعى أمة العزيز، ولدت في آخر جمادى الأولى سنة 659هـ، سمعت من أحمد بن عبد الدائم وابن البخاري وزينب بنت مكي وغيرهم أجزاء حديثية كثيرة، وحدّثت بها؛ يسرد كحالة عن «الدرر الكامنة» مسموعاتها."
  en: "A Syrian hadith transmitter also called Amat al-Aziz, born at the end of Jumada al-Ula 659 AH, who heard many hadith parts from Ahmad ibn Abd al-Da'im, Ibn al-Bukhari, Zaynab bint Makki and others and transmitted them; Kahhala lists her readings from al-Durar al-Kamina."
  ur: "شام کی ایک محدثہ جنہیں امۃ العزیز بھی کہا جاتا، جمادی الاولیٰ 659ھ کے آخر میں پیدا ہوئیں؛ انہوں نے احمد بن عبد الدائم، ابن البخاری، زینب بنت مکی وغیرہ سے حدیث کے بہت سے اجزا سنے اور روایت کیے؛ کحالہ «الدرر الکامنہ» سے ان کی مسموعات گنواتے ہیں۔"
