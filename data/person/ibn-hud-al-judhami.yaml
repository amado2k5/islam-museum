label: { ar: "محمد بن يوسف بن هود" }
summary:
  ar: "محمد بن يوسف بن هود الجذامي المستولي على الأندلس آخر دولة الموحدين؛ ثار على الموحدين ودعا إلى الخليفة العباسي الذي كان أكثر الملوك في ذلك الزمان يدينون بطاعته، فوصله الكتاب العباسي الكريم من بغداد بولاية الأندلس وثارت فيه الخلع العباسية في أعلى الصور وأشبه يومه بالأندلس يوم خرجت الرايات السود من خراسان، وهنأه أبو المطرف قاضي شاطبة برسالة مشهورة قال فيها إن الدولة العباسية خُطب لها ببلاد الأندلس {cite:nafh-tib-maqqari p. 319-321}."
  en: "Muhammad ibn Yusuf Ibn Hud al-Judhami, who rose against the Almohads and took most of al-Andalus; he proclaimed the Abbasid caliph, and the investiture document and black robes arrived from Baghdad — its day 'resembling the day the black banners came out of Khurasan', and the Abbasid da'wa was preached again in al-Andalus {cite:nafh-tib-maqqari p. 319-321}."
