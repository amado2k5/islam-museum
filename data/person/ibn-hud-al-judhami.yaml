id: person/ibn-hud-al-judhami
class: person
label: { ar: "محمد بن يوسف بن هود" }
summary:
  ar: "محمد بن يوسف بن هود الجذامي المستولي على الأندلس آخر دولة الموحدين؛ ثار على الموحدين ودعا إلى الخليفة العباسي الذي كان أكثر الملوك في ذلك الزمان يدينون بطاعته، فوصله الكتاب العباسي الكريم من بغداد بولاية الأندلس وثارت فيه الخلع العباسية في أعلى الصور وأشبه يومه بالأندلس يوم خرجت الرايات السود من خراسان، وهنأه أبو المطرف قاضي شاطبة برسالة مشهورة قال فيها إن الدولة العباسية خُطب لها ببلاد الأندلس {cite:nafh-tib-maqqari p. 319-321}."
  en: "Muhammad ibn Yusuf Ibn Hud al-Judhami, who rose against the Almohads and took most of al-Andalus; he proclaimed the Abbasid caliph, and the investiture document and black robes arrived from Baghdad — its day 'resembling the day the black banners came out of Khurasan', and the Abbasid da'wa was preached again in al-Andalus {cite:nafh-tib-maqqari p. 319-321}."
  es: "Muhammad ibn Yusuf Ibn Hud al-Judhami, quien se alzó contra los almohades y tomó la mayor parte de al-Ándalus; proclamó califa abasí, y el documento de investidura y las túnicas negras llegaron de Bagdad; su día \"se asemejaba al día en que las banderas negras salieron de Jorasán\", y la da'wa abasí fue predicada nuevamente en al-Ándalus {cite:nafh-tib-maqqari p. 319-321}."
  fr: "Muhammad ibn Yusuf Ibn Hud al-Judhami, qui se souleva contre les Almohades et prit la majeure partie d'al-Andalus; il proclama le calife abbasside, et le document d'investiture et les robes noires arrivèrent de Bagdad — son jour « ressemblant au jour où les bannières noires sortirent du Khorasan », et la da'wa abbasside fut prêchée à nouveau en al-Andalus {cite: nafh-tib-maqqari p. 319-321}."
  ur: "محمد بن یوسف ابن ہد الجودمی، جو المحدث کے خلاف اٹھے اور اندلس کا بیشتر حصہ لے لیا۔ اس نے عباسی خلیفہ کا اعلان کیا، اور سرمایہ کاری کی دستاویز اور سیاہ لباس بغداد سے پہنچے - اس دن 'اس دن سے مشابہت رکھتا تھا جس دن خراسان سے سیاہ جھنڈے نکلے تھے'، اور الاندلس میں عباسی دعوت کی دوبارہ تبلیغ کی گئی۔ 319-321}۔"
  tr: "Muhammed ibn Yusuf bin Hud el-Judhami, Almohadların son devleti, Endülüs'ü ele geçirdi; Muhamvadlara karşı isyan etti ve o dönemin çoğu kralının itaat ettiği Abbasi halifesini çağırdı. Abbasi mektubu, Endülüs eyaletindeki Bağdat'tan ona ulaştı ve Abbasilerin tahttan indirmesi en yüksek şekilde isyan etti. Onun günü, siyah bayrakların Horasan'dan yükseldiği Endülüs'e benziyordu. Şatiba'nın hakimi Ebu el-Mutarrif, Abbasi devletinin onu Endülüs'te hitap ettiğini belirten ünlü bir mektupla tebrik etti {cite:nafh-tib-maqqari s. 319-321}."
  id: "Muhammad ibn Yusuf ibn Hud al-Judhami, negara terakhir Almohad, merebut al-Andalus; ia memberontak melawan Almohad dan memanggil khalifah Abbasiyah, yang dipatuhi oleh sebagian besar raja pada masa itu. Surat Abbasiyah sampai kepadanya dari Baghdad di provinsi al-Andalus, dan pemberhentian Abbasiyah memberontak dengan tingkat tertinggi. Harinya mirip dengan al-Andalus ketika panji-panji hitam muncul dari Khorasan. Abu al-Mutarrif, hakim Shatiba, mengucapkan selamat kepadanya dengan surat terkenal di mana ia mengatakan bahwa negara Abbasiyah telah menyapanya dalam al-Andalus {cite:nafh-tib-maqqari hlm. 319-321}."
