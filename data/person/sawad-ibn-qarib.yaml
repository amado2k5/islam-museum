summary:
  ar: "سواد بن قارب الأزدي، رجل من أهل اليمن من بيت شرف، كان كاهناً في الجاهلية؛ يروي الحاكم أن عمر بن الخطاب سأله في المسجد عن خبر «رئيّه» الذي أتاه ثلاث ليال يخبره بمبعث النبي، فحدّثه أنه رحل إلى مكة فعلم بالهجرة فأتى المدينة فأسلم وأنشد شعراً؛ وقال الذهبي: الإسناد منقطع {cite:mustadrak-ilmiyya-ata-v3 p. 704-706}."
  en: "Sawad ibn Qarib al-Azdi, a Yemeni of a noble house and a soothsayer before Islam. Al-Hakim relates that 'Umar ibn al-Khattab asked him in the mosque about the familiar spirit that came to him on three nights announcing the Prophet's mission; Sawad told how he set out for Mecca, learned of the Hijra, went on to Medina, accepted Islam and recited a poem. Al-Dhahabi: the chain is broken {cite:mustadrak-ilmiyya-ata-v3 p. 704-706}."
  ur: "سواد بن قارب ازدی، یمن کے ایک معزز گھرانے کے فرد، جو جاہلیت میں کاہن تھے۔ حاکم روایت کرتے ہیں کہ عمر بن خطاب نے مسجد میں ان سے اس 'رئی' کا حال پوچھا جو تین راتیں ان کے پاس آ کر نبی کی بعثت کی خبر دیتا رہا؛ سواد نے بتایا کہ وہ مکہ روانہ ہوئے، ہجرت کی خبر ملی تو مدینہ پہنچے، اسلام قبول کیا اور ایک نظم پڑھی۔ ذہبی: سند منقطع ہے {cite:mustadrak-ilmiyya-ata-v3 p. 704-706}۔"
