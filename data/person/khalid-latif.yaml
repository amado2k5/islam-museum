summary:
  ar: "إمام أمريكي وقسيس جامعي، وُلد في إديسون بنيوجيرسي سنة 1982. كان أول قسيس مسلم في جامعة نيويورك (2005) وأصغر قسيس في تاريخ شرطة مدينة نيويورك (2007)، وشغل منصب المدير التنفيذي وإمام المركز الإسلامي في جامعة نيويورك نحو عشرين عامًا، ثم أصبح سنة 2025 مدير المركز الإسلامي لمدينة نيويورك ومؤسسًا مشاركًا له، وهو صاحب مطعم «أونست تشوبس» للحوم الحلال."
  en: "An American imam and university chaplain, born in Edison, New Jersey in 1982. He was New York University's first Muslim chaplain (2005) and the youngest chaplain in New York City Police Department history (2007), served as executive director and imam of the Islamic Center at NYU for almost twenty years, and in 2025 became director and co-founder of the Islamic Center of New York City; he also owns the halal butcher Honest Chops."
  ur: "امریکی امام اور یونیورسٹی چیپلن، 1982 میں ایڈیسن، نیوجرسی میں پیدا ہوئے۔ وہ نیویارک یونیورسٹی کے پہلے مسلم چیپلن (2005) اور نیویارک پولیس ڈیپارٹمنٹ کی تاریخ کے کم عمر ترین چیپلن (2007) رہے، تقریباً بیس سال این وائی یو کے اسلامک سینٹر کے ایگزیکٹو ڈائریکٹر اور امام رہے، اور 2025 میں اسلامک سینٹر آف نیویارک سٹی کے ڈائریکٹر اور شریک بانی بنے؛ وہ حلال قصاب خانے «آنسٹ چوپس» کے مالک بھی ہیں۔"
