summary:
  ar: "شارل الخامس — «شارل كنت» في نص الصلابي — إمبراطور الدولة الرومانية المقدسة في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ ينقل الكتاب أن انشغاله بحربه الكبرى مع [[person/francis-i-france|فرانسوا الأول]] ملك فرنسا كان من عوامل نجاح حملة رودس {cite:dawlat-uthmaniyya-salabi p. 201}، وأنه بعد رحيل [[group/knights-of-st-john|فرسان القديس يوحنا]] عن رودس منحهم حكم مالطة {cite:dawlat-uthmaniyya-salabi p. 201-202}، وأن تصالحه مع فرانسوا بعد طول قتال هو ما مكّنه من التفرغ لحرب العثمانيين وإنقاذ عاصمة الهابسبورج فيينا عام 1529م {cite:dawlat-uthmaniyya-salabi p. 202}."
  en: "Charles V — 'Sharl Kant' in al-Salabi — Holy Roman Emperor in [[person/sulayman-al-qanuni|Süleyman]]'s reign; his great war with [[person/francis-i-france|Francis I]] of France is listed among the factors enabling the Rhodes campaign {cite:dawlat-uthmaniyya-salabi p. 201}, he granted the departing [[group/knights-of-st-john|Knights of St John]] rule over Malta {cite:dawlat-uthmaniyya-salabi p. 201-202}, and his reconciliation with Francis freed him to fight the Ottomans and save Vienna in 1529 {cite:dawlat-uthmaniyya-salabi p. 202}."
