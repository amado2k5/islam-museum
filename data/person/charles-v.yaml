summary:
  ar: "شارل الخامس — «شارل كنت» في نص الصلابي — إمبراطور الدولة الرومانية المقدسة في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ ينقل الكتاب أن انشغاله بحربه الكبرى مع [[person/francis-i-france|فرانسوا الأول]] ملك فرنسا كان من عوامل نجاح حملة رودس {cite:dawlat-uthmaniyya-salabi p. 201}، وأنه بعد رحيل [[group/knights-of-st-john|فرسان القديس يوحنا]] عن رودس منحهم حكم مالطة {cite:dawlat-uthmaniyya-salabi p. 201-202}، وأن تصالحه مع فرانسوا بعد طول قتال هو ما مكّنه من التفرغ لحرب العثمانيين وإنقاذ عاصمة الهابسبورج فيينا عام 1529م {cite:dawlat-uthmaniyya-salabi p. 202}."
  en: "Charles V — 'Sharl Kant' in al-Salabi — Holy Roman Emperor in [[person/sulayman-al-qanuni|Süleyman]]'s reign; his great war with [[person/francis-i-france|Francis I]] of France is listed among the factors enabling the Rhodes campaign {cite:dawlat-uthmaniyya-salabi p. 201}, he granted the departing [[group/knights-of-st-john|Knights of St John]] rule over Malta {cite:dawlat-uthmaniyya-salabi p. 201-202}, and his reconciliation with Francis freed him to fight the Ottomans and save Vienna in 1529 {cite:dawlat-uthmaniyya-salabi p. 202}."
  ur: "مقدس رومی سلطنت کے شہنشاہ اور سلیمان عثمانی کے معاصر؛ فرانس، تونس، الجزائر اور بحیرۂ روم کی سیاست میں ان کا کردار نمایاں تھا۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Carlos V — 'Sharl Kant' en al-Salabi — Emperador del Sacro Imperio Romano Germánico durante el reinado de [[person/sulayman-al-qanuni|Süleyman]]; su gran guerra con [[person/francis-i-france|Francisco I]] de Francia se menciona entre los factores que permitieron la campaña de Rodas {cite:dawlat-uthmaniyya-salabi p. 201}, otorgó a los [[group/knights-of-st-john|Knights of St John]] salientes el gobierno de Malta {cite:dawlat-uthmaniyya-salabi p. 201-202}, y su reconciliación con Francisco lo liberó para luchar contra los otomanos y salvar Viena en 1529 {cite:dawlat-uthmaniyya-salabi p. 202}."
  fr: "Charles Quint — « Sharl Kant » dans al-Salabi — Empereur du Saint-Empire romain germanique sous le règne de Soliman le Magnifique; sa grande guerre contre François Ier de France est citée parmi les facteurs ayant permis la campagne de Rhodes {cite:dawlat-uthmaniyya-salabi p. 201}, il accorda aux Chevaliers de Saint-Jean le pouvoir sur Malte {cite:dawlat-uthmaniyya-salabi p. 201-202}, et sa réconciliation avec François lui permit de combattre les Ottomans et de sauver Vienne en 1529 {cite:dawlat-uthmaniyya-salabi p. 202}."
  tr: "V. Charles — Salabi metninde \"Charles Kent\" — [[kişi/süleyman-al-qanuni|Muhteşem Süleyman]] döneminde Kutsal Roma İmparatoru; kitapta, Fransa Kralı [[kişi/francis-i-france|I. François]] ile büyük savaşına olan takıntısının, Rodos seferinin başarısında etkili faktörlerden biri olduğu belirtilir {atıf:] dawlat-uthmaniyya-salabi s. 201} ve [[grup/knights-of-st-john|knights of St John Şövalyeleri]] Rodos'tan ayrıldıktan sonra onlara Malta yönetimini verdiğini {cite:dawlat-uthmaniyya-salabi s. 201-202} ve uzun bir savaş sonrası Francis ile barışması sayesinde kendini Osmanlı savaşına ve 1529'da Habsburg başkenti Viyana'nın kurtarılmasına adamıştır {cite:dawlat-uthmaniyya-salabi s. 202}."
  id: "Charles V — \"Charles Kent\" dalam teks Salabi — Kaisar Kekaisaran Romawi Suci selama masa pemerintahan [[person/sulayman-al-qanuni|Suleiman yang Agung]]; buku tersebut menyatakan bahwa obsesinya dengan perang besarnya dengan [[person/francis-i-france|Francis I]] Raja Prancis adalah salah satu faktor keberhasilan kampanye Rhodes {cite:dawlat-uthmaniyya-salabi hlm. 201}, dan bahwa setelah kepergian [[kelompok/ksatria-st-john|ksatria St-John|ksatria St John]] dari Rhodes, ia memberikan mereka pemerintahan Malta {cite:dawlat-uthmaniyya-salabi hlm. 201-202}, dan rekonsiliasinya dengan Francis setelah pertempuran panjang memungkinkannya untuk mendedikasikan diri pada perang Ottoman dan penyelamatan ibu kota Habsburg, Wina pada tahun 1529 {cite:dawlat-uthmaniyya-salabi hlm. 202}."
