summary:
  ar: "قاضي القضاة شمس الدين البساطي المالكي النحوي؛ ولد في جمادى الأولى سنة ستين وسبعمائة ببساط وانتقل إلى مصر واشتغل بها كثيراً في عدة فنون وكان نابغة الطلبة في شبيبته واشتهر أمره وبعد صيته وبرع في فنون المعقول والعربية والمعاني والبيان والأصلين وصنف فيهما وفي الفقه، وعاش دهراً في بؤس بحيث إنه كان ينام على قشر القصب ثم تحرك له الحظ فولي تدريس المالكية بمدرسة جمال الدين الأستادار ثم مشيخة تربة الملك الناصر ثم تدريس البرقوقية وتدريس الشيخونية وناب في الحكم عن ابن عمه ثم تولى القضاء بالديار المصرية سنة ثلاث وعشرين وثمانمائة فأقام فيه عشرين سنة مدة ولايته لم يعزل منه وكان سمع من التقي البغدادي وغيره ولم يعتن، ومن تصانيفه المغني في الفقه وشفاء الغليل في مختصر الشيخ خليل وشرح ابن الحاجب الفرعي وحاشية على المطول وحاشية على شرح المطالع للقطب وحاشية على المواقف للعضد ونكت على الطوالع للبيضاوي ومقدمة في أصول الدين، وأخذ عنه جماعة من أئمة العصر منهم الشيخ الإمام الشمني وقاضي القضاة محيي الدين المالكي قاضي مكة، ومات بالقولنج ثاني عشر شهر رمضان سنة اثنتين وأربعين وثمانمائة وأمطرت السماء بعد دفنه مطراً غزيراً وكانت وفاته بالقاهرة {cite:shadharat-dhahab p. 245-246}."
  en: "Al-Bisati (b. Bisat Jumada I 760) — Egypt's Maliki chief qadi for twenty uninterrupted years from 823; once slept on cane husks in poverty, then rose through the Ustadariyya, Barquqiyya and Shaykhuniyya chairs; author of al-Mughni, Shifa' al-Ghalil and the celebrated hawashi; died of colic 12 Ramadan 842 — 'the sky rained heavily after his burial' {cite:shadharat-dhahab p. 245-246}."
