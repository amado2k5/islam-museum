summary:
  ar: "قاضي القضاة شمس الدين البساطي المالكي النحوي؛ ولد في جمادى الأولى سنة ستين وسبعمائة ببساط وانتقل إلى مصر واشتغل بها كثيراً في عدة فنون وكان نابغة الطلبة في شبيبته واشتهر أمره وبعد صيته وبرع في فنون المعقول والعربية والمعاني والبيان والأصلين وصنف فيهما وفي الفقه، وعاش دهراً في بؤس بحيث إنه كان ينام على قشر القصب ثم تحرك له الحظ فولي تدريس المالكية بمدرسة جمال الدين الأستادار ثم مشيخة تربة الملك الناصر ثم تدريس البرقوقية وتدريس الشيخونية وناب في الحكم عن ابن عمه ثم تولى القضاء بالديار المصرية سنة ثلاث وعشرين وثمانمائة فأقام فيه عشرين سنة مدة ولايته لم يعزل منه وكان سمع من التقي البغدادي وغيره ولم يعتن، ومن تصانيفه المغني في الفقه وشفاء الغليل في مختصر الشيخ خليل وشرح ابن الحاجب الفرعي وحاشية على المطول وحاشية على شرح المطالع للقطب وحاشية على المواقف للعضد ونكت على الطوالع للبيضاوي ومقدمة في أصول الدين، وأخذ عنه جماعة من أئمة العصر منهم الشيخ الإمام الشمني وقاضي القضاة محيي الدين المالكي قاضي مكة، ومات بالقولنج ثاني عشر شهر رمضان سنة اثنتين وأربعين وثمانمائة وأمطرت السماء بعد دفنه مطراً غزيراً وكانت وفاته بالقاهرة {cite:shadharat-dhahab p. 245-246}."
  en: "Al-Bisati (b. Bisat Jumada I 760) — Egypt's Maliki chief qadi for twenty uninterrupted years from 823; once slept on cane husks in poverty, then rose through the Ustadariyya, Barquqiyya and Shaykhuniyya chairs; author of al-Mughni, Shifa' al-Ghalil and the celebrated hawashi; died of colic 12 Ramadan 842 — 'the sky rained heavily after his burial' {cite:shadharat-dhahab p. 245-246}."
  fr: "Al-Bisati (né à Bisat en jumada I 760 H) — grand cadi malikite d’Égypte pendant vingt ans sans interruption à partir de 823 H ; il dormit jadis sur des enveloppes de roseaux dans la pauvreté, puis accéda aux chaires de l’Ustadariyya, de la Barquqiyya et de la Shaykhuniyya ; auteur d’al-Mughni, de Shifa’ al-Ghalil et de célèbres gloses ; mort de coliques le 12 ramadan 842 H — « le ciel versa une pluie abondante après son enterrement » {cite:shadharat-dhahab p. 245-246}."
  es: "Al-Bisati (n. Bisat Jumada I 760) — cadí principal malikí de Egipto durante veinte años ininterrumpidos desde 823; una vez durmió sobre cáscaras de caña en la pobreza, luego ascendió a través de las cátedras Ustadariyya, Barquqiyya y Shaykhuniyya; autor de al-Mughni, Shifa' al-Ghalil y el célebre hawashi; murió de cólico el 12 de Ramadán de 842 — 'el cielo llovió intensamente después de su entierro' {cite:shadharat-dhahab p. 245-246}."
  ur: "البصاتی ⁦(بسط جمادۃ اول 760)⁩ - مصر کا مالکی سربراہ قادی جو 823 سے بیس سال تک بلا تعطل؛ ایک بار غربت میں گنے کے چھلکوں پر سوئے، پھر استادیہ، برقعیہ اور شیخونیہ کی کرسیوں سے گزرے۔ المغنی کے مصنف، شفاء الغلیل اور مشہور حواشی؛ 12 رمضان المبارک 842 میں درد کی وجہ سے انتقال ہوا - 'ان کی تدفین کے بعد آسمان پر موسلا دھار بارش ہوئی'۔ 245-246}۔"
  tr: "Başyargıç Şemseddin Basati el-Maliki el-Nahvi; Hicri 760 yılında Basat'ta Cemâde el-Ula'da doğdu, daha sonra Mısır'a taşındı ve çeşitli alanlarda kapsamlı çalışmalar yaptı. Gençliğinde parlak bir öğrenciydi ve ünü geniş bir alana yayıldı. Akıl bilimlerinde, Arapça gramerinde, retorikte, belagatta ve fıkıhın iki temel ilkesinde (el-Fuşa ve el-İslam) üstün başarı gösterdi ve bu konuların yanı sıra fıkıh üzerine de eserler yazdı. Bir süre sefalet içinde yaşadı, kamış kabukları üzerinde uyudu. Sonra şans ona gülümsedi ve Cemaleddin el-Ustadar Okulu'nda Maliki fıkıhı öğretmekle, daha sonra el-Malik el-Nasır'ın Mevlidini yönetmekle, ardından Barkıkıyye ve Şeyhuniyye okullarında ders vermekle görevlendirildi. Kuzeninin yanında yardımcı kadı olarak görev yaptıktan sonra, Hicri 823 yılında Mısır Başkadı olarak atandı ve bu görevi yirmi yıl boyunca görevden alınmadan sürdürdü. El-Taki el-Bağdadi ve diğerlerinden ders almıştı, ancak onlara fazla önem vermemişti. Eserleri arasında el-Muğni fi el-Fıkıh (Fıkıhta Yeterli Olan), Şifa el-Galil fi Mukhtasar el-Şeyh Halil (Şeyh Halil'in Özetinde Susuzluğun Giderilmesi), İbn el-Hacib'in el-Far'i tefsiri, el-Mutavval'e şerh, el-Kutb'un el-Matali' tefsiri üzerine şerh, el-Adud'un el-Mevakif tefsiri üzerine şerh, el-Beydavi'nin el-Tevali'si üzerine açıklamalar ve din esaslarına giriş bulunmaktadır. Dönemin önde gelen alimlerinden oluşan bir grup, Şeyhül-İmam-Şamni ve Mekke kadısı Başkadı Muhi el-Din el-Maliki de dahil olmak üzere, onun yanında eğitim görmüştür. Mekke kadısı Muhi el-Din el-Maliki, 842 yılında Ramazan ayının on ikinci günü kolik sancısından vefat etmiştir. Cenazesinden sonra şiddetli yağmur yağmıştır. Ölümü Kahire'de gerçekleşmiştir. {cite:shadharat-dhahab s. 245-246}"
  id: "Ketua Mahkamah Agung Shams al-Din al-Basati al-Maliki al-Nahwi; Beliau lahir di Jumada al-Ula pada tahun 760 H di Basat, kemudian pindah ke Mesir di mana beliau berkarya secara luas di berbagai bidang. Beliau adalah seorang siswa yang brilian di masa mudanya, dan reputasinya tersebar luas. Beliau unggul dalam ilmu-ilmu rasional, tata bahasa Arab, retorika, kefasihan berbicara, dan dua prinsip dasar fiqih (al-Fusha dan al-Islam), dan beliau menulis karya-karya tentang subjek-subjek ini serta tentang fiqih. Beliau pernah hidup dalam kemiskinan yang sangat parah, tidur di atas sekam alang-alang. Kemudian keberuntungan tersenyum padanya, dan beliau diangkat untuk mengajar fiqih Maliki di Sekolah Jamal al-Din al-Ustadar, kemudian memimpin Maulid al-Malik al-Nasir, kemudian mengajar di sekolah Barquqiyya dan Shaykhuniyya. Ia menjabat sebagai wakil hakim untuk sepupunya, kemudian pada tahun 823 H, ia diangkat menjadi Ketua Mahkamah Agung Mesir, sebuah jabatan yang dipegangnya selama dua puluh tahun tanpa pernah diberhentikan. Ia belajar di bawah bimbingan al-Taqi al-Baghdadi dan lainnya, tetapi tidak terlalu memperhatikan mereka. Di antara karya-karyanya adalah al-Mughni fi al-Fiqh (Yang Cukup dalam Fiqih), Shifa' al-Ghalil fi Mukhtasar al-Shaykh Khalil (Penyembuhan Dahaga dalam Ringkasan Syekh Khalil), komentar Ibn al-Hajib tentang al-Far'i, tafsir al-Mutawwal, tafsir al-Qutb tentang al-Matali', tafsir al-'Adud tentang al-Mawaqif, catatan kaki al-Baydawi tentang al-Tawali', dan pengantar prinsip-prinsip agama. Sekelompok ulama terkemuka pada masanya belajar di bawah bimbingannya, termasuk Syekh al-Imam al-Shamni dan Ketua Mahkamah Agung Muhi al-Din Al-Maliki, hakim Mekah, meninggal karena kolik pada tanggal 12 Ramadan tahun 842. Hujan deras turun setelah pemakamannya. Kematiannya terjadi di Kairo. {cite:shadharat-dhahab hlm. 245-246}"
