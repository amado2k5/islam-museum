summary:
  ar: "عبد الله بن خالد، كان من التعبد والورع بالمحل الرفيع، فأُكره على قضاء البلد. لقي سفيان بن عيينة وشعيب بن حرب وإبراهيم بن بكر الشيباني. كان يحمل جونته بنفسه مع غلامه إعانة لرجل أُنزل حمله، ثم لبس كساءه وتوجه إلى مجلس القضاء، فلما حكم بشيء فرّ المحكوم عليه ووضع يده على رأسه، وانقطع بعدها خبره إلا بالثغر حارسًا يومًا."
  en: "Abd Allah ibn Khalid had great worship and scrupulousness, and was compelled to be judge of the city; he met Sufyan ibn Uyayna, Shu'ayb ibn Harb and Ibrahim ibn Bakr al-Shaybani. He once carried his own basket with his slave to help a man whose load had fallen from his donkey, then put on his cloak and went to the court; when he gave a judgement, the man condemned by it beat his own head and the judge left his basket and register and fled, and he was afterwards heard of only as a guard on the frontier for a day."
  ur: "عبد اللہ بن خالد عبادت اور پرہیزگاری میں بلند مرتبے پر تھے، اور شہر کے قاضی بننے پر مجبور کیے گئے۔ انہوں نے سفیان بن عیینہ، شعیب بن حرب اور ابراہیم بن بکر شیبانی سے ملاقات کی۔ ایک بار انہوں نے اپنے غلام کے ساتھ اپنی ٹوکری خود اٹھائی تاکہ ایک شخص کی مدد کریں جس کا بوجھ اس کے گدھے سے گر گیا تھا؛ پھر اپنی چادر پہن کر مجلس قضاء کی طرف گئے۔ ایک فیصلے کے بعد جس شخص پر فیصلہ ہوا اس نے اپنا سر پیٹا، اور قاضی نے ٹوکری اور دفتر چھوڑ کر راہ فرار اختیار کی؛ اس کے بعد ان کی خبر صرف یہ ملی کہ وہ ایک دن سرحد پر پہرہ دار رہے۔"
