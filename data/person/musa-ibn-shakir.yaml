summary:
  ar: "موسى بن شاكر، والد المهندسين الثلاثة بني موسى؛ كان في شبابه من قطاع الطرق ثم تاب ودخل في خدمة المأمون وتعلم التنجيم وهيئة الأفلاك، وتوفي نحو سنة 200 هـ ⁦(نحو 815 م)⁩ وأبناؤه صغار فنشأوا في بيت الحكمة."
  en: "Musa ibn Shakir, father of the three engineers known as the Banu Musa; a highway robber in his youth who repented and entered al-Ma'mun's service, learned astrology and the form of the spheres, and died about 200 AH (about 815 CE) while his sons were small, who were then raised in the House of Wisdom."
