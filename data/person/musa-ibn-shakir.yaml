summary:
  ar: "موسى بن شاكر، والد المهندسين الثلاثة بني موسى؛ كان في شبابه من قطاع الطرق ثم تاب ودخل في خدمة المأمون وتعلم التنجيم وهيئة الأفلاك، وتوفي نحو سنة 200 هـ ⁦(نحو 815 م)⁩ وأبناؤه صغار فنشأوا في بيت الحكمة."
  en: "Musa ibn Shakir, father of the three engineers known as the Banu Musa; a highway robber in his youth who repented and entered al-Ma'mun's service, learned astrology and the form of the spheres, and died about 200 AH (about 815 CE) while his sons were small, who were then raised in the House of Wisdom."
  es: "Musa ibn Shakir, padre de los tres ingenieros conocidos como los Banu Musa; un bandido de caminos en su juventud que se arrepintió y entró al servicio de al-Ma'mun, aprendió astrología y la forma de las esferas, y murió alrededor del año 200 AH (alrededor del 815 d. C.) cuando sus hijos eran pequeños, quienes fueron criados en la Casa de la Sabiduría."
  fr: "Musa ibn Shakir, père des trois ingénieurs connus sous le nom de Banu Musa; un brigand de grand chemin dans sa jeunesse qui se repentit et entra au service d'al-Ma'mun, apprit l'astrologie et la forme des sphères, et mourut vers 200 AH (environ 815 CE) alors que ses fils étaient petits, qui furent ensuite élevés dans la Maison de la Sagesse."
  ur: "موسیٰ ابن شاکر، تین انجینئروں کے والد جنہیں بنو موسیٰ کہا جاتا ہے۔ اپنی جوانی میں ایک شاہراہ پر ڈاکو جس نے توبہ کی اور المامون کی خدمت میں داخل ہوا، علم نجوم اور دائروں کی شکل سیکھی، اور تقریباً 200 ہجری ⁦(تقریباً 815 عیسوی)⁩ میں اس کا انتقال ہوا جبکہ اس کے بیٹے چھوٹے تھے، جن کی پرورش اس وقت حکمت کے گھر میں ہوئی۔"
  tr: "Üç mühendis Banu Musa'nın babası Musa ibn Şakir, gençliğinde hayduttu, sonra tövbe edip el-Memun'un hizmetine girdi, astroloji ve astronomi öğrendi. Yaklaşık 200 Hicri yılında (yaklaşık 815 M.S.) öldü. Çocukları küçüktü ve Bilgelik Evi'nde büyüdüler."
  id: "Musa ibn Shakir, ayah dari tiga insinyur Banu Musa, adalah seorang bandit di masa mudanya, lalu menyesal dan masuk ke pelayanan al-Ma'mun, belajar astrologi dan astronomi. Ia meninggal sekitar tahun 200 H (sekitar 815 M). Anak-anaknya masih muda dan tumbuh di Rumah Kebijaksanaan."
