roles: [scholar, jurist]
gender: male
summary:
  ar: "أحمد بن نصر الداودي الأسدي، أبو جعفر، فقيه مالكي من أئمة المذهب في المغرب، ومن المتسمين في العلم المجيدين للتأليف، وكان درسه وحده ولم يتفقه في أكثر علمه عند إمام مشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} حمل عنه أبو عبد الله البوني وأبو بكر بن الشيخ ابن أبي زيد وأبو علي بن الوفاء، ومن تصانيفه شرح الموطأ المسمى «النامي»، و«الواعي» في الفقه، و«النصيحة» في شرح البخاري، و«الإيضاح» في الرد على القدرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
  en: "Ahmad ibn Nasr al-Dawudi al-Asadi, Abu Ja'far, a Maliki jurist among the leading masters of the school in the Maghrib, known for learning and for good writing; he studied largely on his own and did not follow a famous master in most of his learning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} Abu Abd Allah al-Buni, Abu Bakr ibn al-Shaykh Ibn Abi Zayd and Abu Ali ibn al-Wafa transmitted from him; his works include al-Nami fi sharh al-Muwatta', al-Wa'i in fiqh, al-Nasiha on the Sahih of al-Bukhari, and al-Idah refuting the Qadariyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
  es: "Ahmad ibn Nasr al-Dawudi al-Asadi, Abu Ja'far, un jurista malikí entre los principales maestros de la escuela en el Magreb, conocido por su erudición y su buena escritura; estudió en gran medida por su cuenta y no siguió a un maestro famoso en la mayor parte de su aprendizaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} Abu Abd Allah al-Buni, Abu Bakr ibn al-Shaykh Ibn Abi Zayd y Abu Ali ibn al-Wafa transmitieron de él; sus obras incluyen al-Nami fi sharh al-Muwatta', al-Wa'i en fiqh, al-Nasiha sobre el Sahih de al-Bukhari y al-Idah refutando a la Qadariyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
  fr: "Ahmad ibn Nasr al-Dawudi al-Asadi, dit Abu Ja'far, juriste malikite parmi les plus éminents maîtres de l'école maghrébine, était réputé pour son érudition et la qualité de ses écrits. Il étudia principalement en autodidacte et ne suivit pas l'enseignement d'un maître renommé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} Abu Abd Allah al-Buni, Abu Bakr ibn al-Shaykh Ibn Abi Zayd et Abu Ali ibn al-Wafa furent ses disciples. Parmi ses œuvres figurent al-Nami fi sharh al-Muwatta', al-Wa'i (traité de fiqh), al-Nasiha (commentaire sur le Sahih d'al-Bukhari) et al-Idah (réfutation de la doctrine Qadariyya). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
  ur: "احمد بن نصر الداؤدی الاسدی، ابو جعفر، ایک مالکی فقیہ، مغرب میں مکتب کے سرکردہ اساتذہ میں سے، سیکھنے اور اچھی تحریر کے لیے جانا جاتا ہے۔ اس نے بڑے پیمانے پر خود ہی تعلیم حاصل کی اور اپنی زیادہ تر تعلیم میں کسی مشہور ماسٹر کی پیروی نہیں کی۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16644} ابو عبد اللہ البنی، ابو بکر بن الشیخ ابن ابی زید اور ابو علی ابن الوفاء سے منقول ہے۔ ان کی تصانیف میں النمی فی شرح الموطۃ، فقہ میں الواعظ، صحیح البخاری پر النصیحہ، اور قدریہ کی تردید الاداح شامل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16644}"
