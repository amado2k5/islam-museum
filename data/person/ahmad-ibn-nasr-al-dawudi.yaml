summary:
  ar: "أحمد بن نصر الداودي الأسدي، أبو جعفر، فقيه مالكي من أئمة المذهب في المغرب، ومن المتسمين في العلم المجيدين للتأليف، وكان درسه وحده ولم يتفقه في أكثر علمه عند إمام مشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} حمل عنه أبو عبد الله البوني وأبو بكر بن الشيخ ابن أبي زيد وأبو علي بن الوفاء، ومن تصانيفه شرح الموطأ المسمى «النامي»، و«الواعي» في الفقه، و«النصيحة» في شرح البخاري، و«الإيضاح» في الرد على القدرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
  en: "Ahmad ibn Nasr al-Dawudi al-Asadi, Abu Ja'far, a Maliki jurist among the leading masters of the school in the Maghrib, known for learning and for good writing; he studied largely on his own and did not follow a famous master in most of his learning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644} Abu Abd Allah al-Buni, Abu Bakr ibn al-Shaykh Ibn Abi Zayd and Abu Ali ibn al-Wafa transmitted from him; his works include al-Nami fi sharh al-Muwatta', al-Wa'i in fiqh, al-Nasiha on the Sahih of al-Bukhari, and al-Idah refuting the Qadariyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16644}"
