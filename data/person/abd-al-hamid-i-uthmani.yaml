summary:
  ar: "السلطان عبد الحميد الأول ⁦(١١٨٧–١٢٠٣هـ/١٧٧٣–١٧٨٨م)⁩؛ تولى الحكم بعد وفاة أخيه مصطفى الثالث وكان محجوزاً في قصره مدة حكم إخوته. استطاعت روسيا أن تحقق نصراً على العثمانيين في مدينة فارنا ببلغاريا على البحر الأسود، فطلب الصدر الأعظم الصلح وتم توقيع معاهدة قينارجة ⁦(كوتشك قاينارجة)⁩ عام ١١٨٧هـ/١٧٧٤م التي اعترفت باستقلال بلاد القرم وحرية الملاحة الروسية في البحر الأسود والمتوسط وأذنت لروسيا ببناء كنيسة في غلطة وبحماية الكنائس النصرانية، وأنهت فعلياً السيطرة العثمانية على البحر الأسود {cite:dawlat-uthmaniyya-salabi p. 316-318}."
  en: "Abd al-Hamid I (r. 1187–1203/1773–1788) — came from the palace seclusion to sign away the Black Sea: Küçük Kaynarca (1774) freed Crimea, opened Ottoman waters to Russian ships and gave Russia a protected church in Galata {cite:dawlat-uthmaniyya-salabi p. 316-318}."
  fr: "Abd al-Hamid Ier (r. 1187–1203/1773–1788) — sorti de la réclusion du palais pour céder la mer Noire : Küçük Kaynarca (1774) affranchit la Crimée, ouvrit les eaux ottomanes aux navires russes et donna à la Russie une église protégée à Galata {cite:dawlat-uthmaniyya-salabi p. 316-318}."
  es: "Abd al-Hamid I (r. 1187–1203/1773–1788) — salió del reclusión del palacio para ceder el Mar Negro: Küçük Kaynarca (1774) liberó Crimea, abrió las aguas otomanas a los barcos rusos y le dio a Rusia una iglesia protegida en Galata {cite:dawlat-uthmaniyya-salabi p. 316-318}."
  ur: "عبد الحمید اول (r. 1187–1203/1773–1788) – بحیرہ اسود کو دور کرنے کے لیے محل کی تنہائی سے آیا تھا: Küçük Kaynarca (1774) نے کریمیا کو آزاد کرایا، عثمانی پانیوں کو روسی جہازوں کے لیے کھول دیا اور روس کو ایک محفوظ چرچ دیا۔ 316-318}۔"
  tr: "Sultan Abdülhamid I (1187–1203 Hicri/1773–1788 Miladi), kardeşi Mustafa III'ün ölümünden sonra iktidara geldi; kardeşlerinin hükümdarlığı sırasında sarayına hapsedilmişti. Rusya, Karadeniz'deki Bulgaristan'ın Varna kentinde Osmanlılara karşı bir zafer kazandı ve bu da Sadrazam'ın barış istemesine yol açtı. 1187 Hicri/1774 Miladi yılında Küçük Kaynarca Antlaşması imzalandı; bu antlaşma Kırım'ın bağımsızlığını, Rusya'nın Karadeniz ve Akdeniz'deki denizcilik özgürlüğünü tanıdı ve Rusya'ya Galata'da bir kilise inşa etme ve Hristiyan kiliselerini koruma yetkisi verdi. Bu, Osmanlı'nın Karadeniz üzerindeki kontrolüne fiilen son verdi. {cite:dawlat-uthmaniyya-salabi s. 316-318}"
  id: "Sultan Abdul Hamid I (1187–1203 H/1773–1788 M) naik tahta setelah kematian saudaranya, Mustafa III, setelah terkurung di istananya selama pemerintahan saudara-saudaranya. Rusia meraih kemenangan atas Ottoman di Varna, Bulgaria, di Laut Hitam, yang mendorong Wazir Agung untuk meminta perdamaian. Perjanjian Küçük Kaynarca ditandatangani pada tahun 1187 H/1774 M, yang mengakui kemerdekaan Krimea, kebebasan navigasi Rusia di Laut Hitam dan Mediterania, dan mengizinkan Rusia untuk membangun gereja di Galata dan melindungi gereja-gereja Kristen. Hal ini secara efektif mengakhiri kendali Ottoman atas Laut Hitam. {cite:dawlat-uthmaniyya-salabi hlm. 316-318}"
