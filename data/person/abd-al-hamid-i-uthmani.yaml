summary:
  ar: "السلطان عبد الحميد الأول ⁦(١١٨٧–١٢٠٣هـ/١٧٧٣–١٧٨٨م)⁩؛ تولى الحكم بعد وفاة أخيه مصطفى الثالث وكان محجوزاً في قصره مدة حكم إخوته. استطاعت روسيا أن تحقق نصراً على العثمانيين في مدينة فارنا ببلغاريا على البحر الأسود، فطلب الصدر الأعظم الصلح وتم توقيع معاهدة قينارجة ⁦(كوتشك قاينارجة)⁩ عام ١١٨٧هـ/١٧٧٤م التي اعترفت باستقلال بلاد القرم وحرية الملاحة الروسية في البحر الأسود والمتوسط وأذنت لروسيا ببناء كنيسة في غلطة وبحماية الكنائس النصرانية، وأنهت فعلياً السيطرة العثمانية على البحر الأسود {cite:dawlat-uthmaniyya-salabi p. 316-318}."
  en: "Abd al-Hamid I (r. 1187–1203/1773–1788) — came from the palace seclusion to sign away the Black Sea: Küçük Kaynarca (1774) freed Crimea, opened Ottoman waters to Russian ships and gave Russia a protected church in Galata {cite:dawlat-uthmaniyya-salabi p. 316-318}."
