summary:
  ar: "زوجة الخليفة عثمان بن عفان، من بني كلب، كانت نصرانية فأسلمت قبل أن يدخل بها، وولدت له مريم، وقيل ولداً اسمه عنبسة؛ ويُذكر أنها دافعت عنه يوم مقتله وانكبت عليه واتقت السيف بيدها فقُطعت أصابعها، وشهدت دفنه."
  en: "Wife of the caliph Uthman ibn Affan, of Banu Kalb; she was a Christian and became Muslim before the marriage was consummated, and bore him Maryam and, it is said, a son named Anbasa. She is reported to have defended him on the day he was killed, throwing herself over him and shielding him from the sword with her hand so that her fingers were cut off, and to have attended his burial."
  es: "Esposa del califa Uthman ibn Affan, de Banu Kalb; era cristiana y se convirtió al islam antes de consumar el matrimonio. Le dio a luz a Maryam y, según se dice, a un hijo llamado Anbasa. Se cuenta que lo defendió el día de su muerte, interponiéndose entre él y la espada, protegiéndolo con la mano hasta que le cortaron los dedos, y que asistió a su entierro."
  fr: "Épouse du calife Uthman ibn Affan, de la tribu des Banu Kalb, elle était chrétienne et se convertit à l'islam avant la consommation du mariage. De cette union naquit Maryam et, selon la tradition, un fils nommé Anbasa. On raconte qu'elle le défendit le jour de sa mort, se jetant sur lui et le protégeant de l'épée de sa main, au prix de ses doigts tranchés, et qu'elle assista à ses funérailles."
  ur: "بنو کلب کے خلیفہ عثمان بن عفان کی بیوی؛ وہ ایک عیسائی تھی اور شادی سے پہلے مسلمان ہوگئی تھی، اور اس سے مریم پیدا ہوئیں اور کہا جاتا ہے کہ انباسہ نام کا بیٹا ہے۔ بتایا جاتا ہے کہ جس دن وہ مارا گیا تھا اس دن اس نے اس کا دفاع کیا تھا، اپنے آپ کو اس پر پھینک دیا تھا اور اسے اپنے ہاتھ سے تلوار سے بچا لیا تھا تاکہ اس کی انگلیاں کاٹ دی گئیں، اور اس کی تدفین میں شرکت کی۔"
  tr: "Halife Osman bin Affan'ın eşi, Banu Kalb'dan, Hristiyandı ve onunla birlikte girmeden önce İslam'a geçti. Meryem ona bir oğul verdi ve Anbasa adında bir oğlu olduğu söylenir. Ölüm gününde onu savunduğu, ona karşı döndüğü, elindeki kılıcı parmaklarını kestiği ve gömülmesine tanık olduğu belirtilir."
  id: "Istri Khalifah Uthman ibn Affan, dari Banu Kalb, adalah seorang Kristen dan memeluk Islam sebelum masuk bersamanya. Mary memberinya seorang putra, dan dikatakan ia memiliki seorang putra bernama Anbasa. Disebutkan bahwa ia membela Anbasa pada hari kematiannya, berbalik melawannya, dan mengayunkan pedang di tangannya, memotong jarinya, serta menyaksikan pemakamannya."
