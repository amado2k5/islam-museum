summary:
  ar: "زوجة الخليفة عثمان بن عفان، من بني كلب، كانت نصرانية فأسلمت قبل أن يدخل بها، وولدت له مريم، وقيل ولداً اسمه عنبسة؛ ويُذكر أنها دافعت عنه يوم مقتله وانكبت عليه واتقت السيف بيدها فقُطعت أصابعها، وشهدت دفنه."
  en: "Wife of the caliph Uthman ibn Affan, of Banu Kalb; she was a Christian and became Muslim before the marriage was consummated, and bore him Maryam and, it is said, a son named Anbasa. She is reported to have defended him on the day he was killed, throwing herself over him and shielding him from the sword with her hand so that her fingers were cut off, and to have attended his burial."
