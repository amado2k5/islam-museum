label: { ar: "سعيد بن عبد العزيز حذيفة", en: "Sa'id ibn Abd al-Aziz 'Hudhayfa'", es: "Sa'id ibn Abd al-Aziz 'Hudhayfa'", fr: "Sa'id ibn Abd al-Aziz 'Hudhayfa'", ur: "سعید بن عبد العزیز حذیفہ" }
summary:
  ar: "سعيد بن عبد العزيز بن الحارث بن الحكم بن أبي العاصي بن أمية الملقب حذيفة؛ لقبه بذلك دهقان رآه عليه معصفر وقد رجل شعره فقال هذا حذيفة يعني دهقانة وكان صهر مسلمة بن عبد الملك على ابنته فولاه خراسان فقدم سورة بن الحر إلى ما وراء النهر فهزم الترك بإشتيخن ثم هزموه ثانية وولى نصر بن سيار فشكاه وجوه أهل خراسان إلى مسلمة فعزله."
  en: "Sa'id ibn Abd al-Aziz, nicknamed 'Hudhayfa' when a dahqan mocked his saffron robe and combed hair; Maslama's son-in-law over Khurasan, he sent Sawra to Ishtikhan — one victory, one rout — gave Nasr ibn Sayyar command, and was deposed on the notables' complaint."
  es: "Sa'id ibn Abd al-Aziz, apodado 'Hudhayfa' cuando un dahqan se burló de su túnica azafrán y su cabello peinado; yerno de Maslama sobre Jorasán, envió a Sawra a Ishtikhan —una victoria, una derrota— le dio el mando a Nasr ibn Sayyar y fue depuesto por la queja de los notables."
  fr: "Sa'id ibn Abd al-Aziz, surnommé « Hudhayfa » lorsqu'un dahqan se moqua de sa robe safran et de ses cheveux peignés; gendre de Maslama sur le Khorasan, il envoya Sawra à Ishtikhan — une victoire, une déroute — donna le commandement à Nasr ibn Sayyar et fut déposé sur la plainte des notables."
  ur: "سعید بن عبد العزیز، جسے 'حذیفہ' کا لقب دیا گیا جب ایک دہقان نے اس کے زعفرانی لباس اور کنگھی کے بالوں کا مذاق اڑایا۔ خراسان پر مسلمہ کے داماد، اس نے سوارا کو استیخان کے پاس بھیجا - ایک فتح، ایک شکست - نے نصر بن سیار کو حکم دیا، اور معززین کی شکایت پر معزول کر دیا گیا۔"
