label: { ar: "سعيد بن عبد العزيز حذيفة", en: "Sa'id ibn Abd al-Aziz 'Hudhayfa'" }
summary:
  ar: "سعيد بن عبد العزيز بن الحارث بن الحكم بن أبي العاصي بن أمية الملقب حذيفة؛ لقبه بذلك دهقان رآه عليه معصفر وقد رجل شعره فقال هذا حذيفة يعني دهقانة وكان صهر مسلمة بن عبد الملك على ابنته فولاه خراسان فقدم سورة بن الحر إلى ما وراء النهر فهزم الترك بإشتيخن ثم هزموه ثانية وولى نصر بن سيار فشكاه وجوه أهل خراسان إلى مسلمة فعزله."
  en: "Sa'id ibn Abd al-Aziz, nicknamed 'Hudhayfa' when a dahqan mocked his saffron robe and combed hair; Maslama's son-in-law over Khurasan, he sent Sawra to Ishtikhan — one victory, one rout — gave Nasr ibn Sayyar command, and was deposed on the notables' complaint."
