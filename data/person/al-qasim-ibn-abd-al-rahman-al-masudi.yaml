label:
  ar: القاسم بن عبد الرحمن المسعودي القاضي
  en: Al-Qasim ibn Abd al-Rahman al-Masudi, judge of Kufa
  ur: قاسم بن عبدالرحمن المسعودی (کوفہ کے قاضی)
summary:
  ar: 'القاسم بن عبد الرحمن بن عبد الله بن مسعود، أبو عبد الرحمن، المسعودي الكوفي
    القاضي، توفي سنة 120ه بحسب ما ذكر المدخل. روى عن أبيه وعن ابن عمر وجابر بن سمرة
    ومسروق وغيرهم، وكان على قضاء الكوفة ولا يأخذ على القضاء أجرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7522} '
  en: 'Al-Qasim ibn Abd al-Rahman ibn Abd Allah ibn Mas''ud, Abu Abd al-Rahman, al-Mas''udi
    of Kufa and its judge; the entry gives his death as 120 AH. He narrated from his
    father, Ibn Umar, Jabir ibn Samura and Masruq, and held the judgeship of Kufa
    taking no pay for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7522} '
  ur: 'قاسم بن عبدالرحمن بن عبداللہ بن مسعود، ابوعبدالرحمن مسعودی کوفی قاضی؛ مدخل
    کے مطابق وفات 120ھ ہے۔ اپنے والد، ابن عمر، جابر بن سمرہ اور مسروق سے روایت کی،
    اور کوفہ کے قضاء پر فائز رہے اور اس پر اجرت نہیں لیتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7522} '
