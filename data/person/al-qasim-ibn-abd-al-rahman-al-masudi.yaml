label:
  ar: القاسم بن عبد الرحمن المسعودي القاضي
  en: Al-Qasim ibn Abd al-Rahman al-Masudi, judge of Kufa
  fr: "Al-Qasim ibn Abd al-Rahman al-Masudi, juge de Koufa"
  ur: قاسم بن عبدالرحمن المسعودی ⁦(کوفہ کے قاضی)⁩
  es: "Al-Qasim ibn Abd al-Rahman al-Masudi, judge of Kufa"
summary:
  ar: 'القاسم بن عبد الرحمن بن عبد الله بن مسعود، أبو عبد الرحمن، المسعودي الكوفي
    القاضي، توفي سنة 120ه بحسب ما ذكر المدخل. روى عن أبيه وعن ابن عمر وجابر بن سمرة
    ومسروق وغيرهم، وكان على قضاء الكوفة ولا يأخذ على القضاء أجرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7522} '
  en: 'Al-Qasim ibn Abd al-Rahman ibn Abd Allah ibn Mas''ud, Abu Abd al-Rahman, al-Mas''udi
    of Kufa and its judge; the entry gives his death as 120 AH. He narrated from his
    father, Ibn Umar, Jabir ibn Samura and Masruq, and held the judgeship of Kufa
    taking no pay for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7522} '
  fr: "Al-Qasim ibn Abd al-Rahman ibn Abd Allah ibn Mas'ud, Abu Abd al-Rahman, al-Mas'udi de Kufa et son juge ; l'entrée donne sa mort comme 120 de l’hégire. Il a raconté de son père, Ibn Omar, Jabir ibn Samura et Masruq, et a tenu la magistrature de Kufa ne prenant aucun salaire pour cela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7522} "
  ur: 'قاسم بن عبدالرحمن بن عبداللہ بن مسعود، ابوعبدالرحمن مسعودی کوفی قاضی؛ مدخل
    کے مطابق وفات 120ھ ہے۔ اپنے والد، ابن عمر، جابر بن سمرہ اور مسروق سے روایت کی،
    اور کوفہ کے قضاء پر فائز رہے اور اس پر اجرت نہیں لیتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7522} '
  es: "Al-Qasim ibn Abd al-Rahman ibn Abd Allah ibn Mas'ud, Abu Abd al-Rahman, al-Mas'udi de Kufa y su juez; la entrada indica que falleció en el año 120 de la Hégira. Narró de su padre, Ibn Umar, Jabir ibn Samura y Masruq, y ejerció como juez de Kufa sin recibir remuneración alguna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7522}"
  tr: "Al-Kasim ibn Abd al-Rahman ibn Abdullah ibn Mas'ud, Ebu Abd al-Rahman, al-Mas'udi al-Kufi al-Qadi, kayda göre 120 Hicri'de öldü. Babası İbn Umar, Cabir ibn Samruq, Mesruk ve diğerlerinden rivayet etmiş, Kufe yargıcı olarak atanmış ve yargıçlık için herhangi bir ödeme almamıştır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7522}"
  id: "Al-Qasim ibn Abd al-Rahman ibn Abdullah ibn Mas'ud, Abu Abd al-Rahman, al-Mas'udi al-Kufi al-Qadi, wafat pada tahun 120 H menurut entri tersebut. Ia menceritakan dari ayahnya, Ibn Umar, Jabir ibn Samruq, Masruq, dan lainnya, dan ia diangkat menjadi hakim Kufa dan tidak menerima pembayaran untuk jabatan hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7522}"
