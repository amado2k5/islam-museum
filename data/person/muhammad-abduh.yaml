summary:
  ar: "أحد رواد الإصلاح الإسلامي في مصر في أواخر القرن التاسع عشر وأوائل القرن العشرين. يصفه شكيب أرسلان في تعليقه على حاضر العالم الإسلامي بأستاذه، ويذكر أنه تعرّف إليه في بيروت عام 1886 أثناء نفيه بعد الثورة العرابية، وأنه رأى في فهمه للعقيدة الإسلامية السبيل إلى نهضة الإسلام. ويذكر أن تلميذه ومعاصره رشيد رضا كتب تاريخه في مجلدين."
  en: "Egyptian reformer of the late 19th and early 20th century. Arslan, who studied under him in Beirut during Abduh's exile after the 'Urabi revolt (1886), calls him the teacher of the age and says that his reading of Islamic belief was the one that could revive the faith; Arslan also notes that Rashid Rida wrote his biography in two volumes {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 300–302}."
