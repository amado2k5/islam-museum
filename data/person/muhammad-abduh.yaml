summary:
  ar: "عالم لاهوت ومصلح مصري ولد سنة 1849 وتوفي سنة 1905، وتعدّه دائرة المعارف الإسلامية مؤسس المدرسة الحداثية المصرية. تتلمذ على جمال الدين الأفغاني، ونُفي بعد الثورة العرابية، ثم عاد سنة 1889 فصار قاضيًا ثم مفتيًا للدولة سنة 1899 وعضوًا في المجلس الإداري للأزهر. دعا إلى إحياء الاجتهاد ونقد التقليد وإلى التوفيق بين الدين والعلم، وتتباين الآراء في تقييم إصلاحه، من تأييد المسلمين الجادين إلى عداء الأوساط المحافظة، ومن وصف كاتب المقالة لاهوته بالحل الوسط الدفاعي."
  en: "Egyptian theologian and reformer, born in 1849 and died in 1905, whom the Encyclopaedia of Islam counts as founder of the Egyptian modernist school. A disciple of Jamal al-Din al-Afghani, he was exiled after the Urabi rebellion, returned in 1889 and became a judge, then state mufti in 1899, and a member of the Azhar's governing body. He called for the revival of ijtihad, criticised taqlid and sought agreement between religion and science; assessments of his reform differ, from the support of serious-minded Muslims to the hostility of conservative circles, and the article's author calls his theology an apologetic compromise. {cite:encyclopaedia-of-islam-2 vol. 7 p. 470} {cite:encyclopaedia-of-islam-2 vol. 7 p. 471}"
  ur: "مصر کے ماہرِ الٰہیات اور مصلح، جو 1849ء میں پیدا ہوئے اور 1905ء میں فوت ہوئے، اور جنہیں انسائیکلوپیڈیا آف اسلام مصری جدیدیت پسند مکتب کا بانی شمار کرتا ہے۔ وہ جمال الدین افغانی کے شاگرد تھے، عرابی بغاوت کے بعد جلاوطن ہوئے، 1889ء میں لوٹے اور جج بنے، پھر 1899ء میں ریاست کے مفتی اور ازہر کی انتظامی مجلس کے رکن۔ انہوں نے اجتہاد کی بحالی، تقلید پر تنقید اور دین و علم میں ہم آہنگی کی دعوت دی؛ ان کی اصلاح کے بارے میں آرا مختلف ہیں، سنجیدہ مسلمانوں کی حمایت سے لے کر قدامت پسند حلقوں کی دشمنی تک، اور مضمون کا مصنف ان کی الٰہیات کو معذرت خواہانہ سمجھوتا کہتا ہے۔"
