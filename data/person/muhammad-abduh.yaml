summary:
  ar: "عالم لاهوت ومصلح مصري ولد سنة 1849 وتوفي سنة 1905، وتعدّه دائرة المعارف الإسلامية مؤسس المدرسة الحداثية المصرية. تتلمذ على جمال الدين الأفغاني، ونُفي بعد الثورة العرابية، ثم عاد سنة 1889 فصار قاضيًا ثم مفتيًا للدولة سنة 1899 وعضوًا في المجلس الإداري للأزهر. دعا إلى إحياء الاجتهاد ونقد التقليد وإلى التوفيق بين الدين والعلم، وتتباين الآراء في تقييم إصلاحه، من تأييد المسلمين الجادين إلى عداء الأوساط المحافظة، ومن وصف كاتب المقالة لاهوته بالحل الوسط الدفاعي."
  en: "Egyptian theologian and reformer, born in 1849 and died in 1905, whom the Encyclopaedia of Islam counts as founder of the Egyptian modernist school. A disciple of Jamal al-Din al-Afghani, he was exiled after the Urabi rebellion, returned in 1889 and became a judge, then state mufti in 1899, and a member of the Azhar's governing body. He called for the revival of ijtihad, criticised taqlid and sought agreement between religion and science; assessments of his reform differ, from the support of serious-minded Muslims to the hostility of conservative circles, and the article's author calls his theology an apologetic compromise. {cite:encyclopaedia-of-islam-2 vol. 7 p. 470} {cite:encyclopaedia-of-islam-2 vol. 7 p. 471}"
  ur: "مصر کے ماہرِ الٰہیات اور مصلح، جو 1849ء میں پیدا ہوئے اور 1905ء میں فوت ہوئے، اور جنہیں انسائیکلوپیڈیا آف اسلام مصری جدیدیت پسند مکتب کا بانی شمار کرتا ہے۔ وہ جمال الدین افغانی کے شاگرد تھے، عرابی بغاوت کے بعد جلاوطن ہوئے، 1889ء میں لوٹے اور جج بنے، پھر 1899ء میں ریاست کے مفتی اور ازہر کی انتظامی مجلس کے رکن۔ انہوں نے اجتہاد کی بحالی، تقلید پر تنقید اور دین و علم میں ہم آہنگی کی دعوت دی؛ ان کی اصلاح کے بارے میں آرا مختلف ہیں، سنجیدہ مسلمانوں کی حمایت سے لے کر قدامت پسند حلقوں کی دشمنی تک، اور مضمون کا مصنف ان کی الٰہیات کو معذرت خواہانہ سمجھوتا کہتا ہے۔"
  es: "Teólogo y reformador egipcio, nacido en 1849 y fallecido en 1905, a quien la Enciclopedia del Islam considera fundador de la escuela modernista egipcia. Discípulo de Jamal al-Din al-Afghani, fue exiliado tras la rebelión de Urabi, regresó en 1889 y se convirtió en juez, luego en muftí estatal en 1899 y miembro del órgano de gobierno de Al-Azhar. Abogó por el resurgimiento del ijtihad, criticó el taqlid y buscó la concordia entre religión y ciencia; las valoraciones de su reforma difieren, desde el apoyo de musulmanes de mentalidad seria hasta la hostilidad de círculos conservadores, y el autor del artículo califica su teología como un compromiso apologético. {cite:encyclopaedia-of-islam-2 vol. 7 p. 470} {cite:encyclopaedia-of-islam-2 vol. 7 p. 471}"
  fr: "Théologien et réformateur égyptien, né en 1849 et mort en 1905, considéré par l'Encyclopédie de l'Islam comme le fondateur de l'école moderniste égyptienne. Disciple de Jamal al-Din al-Afghani, il fut exilé après la rébellion d'Urabi, puis revint en 1889 et devint juge, puis mufti d'État en 1899, et membre du conseil d'administration d'Al-Azhar. Il appela à la renaissance de l'ijtihad, critiqua le taqlid et rechercha un accord entre religion et science; les appréciations de sa réforme divergent, allant du soutien des musulmans les plus sérieux à l'hostilité des milieux conservateurs, et l'auteur de l'article qualifie sa théologie de compromis apologétique. {cite:encyclopaedia-of-islam-2 vol. 7 p. 470} {cite:encyclopaedia-of-islam-2 vol. 7 p. 471}"
  tr: "1849 doğumlu ve 1905'te ölen Mısırlı bir ilahiyatçı ve reformcu. İslam Ansiklopedisi onu Mısır modernist okulunun kurucusu olarak kabul eder. Cemaleddin el-Afgani'nin yanında eğitim aldı ve Urabi devriminden sonra sürgüne gönderildi, ardından 1889'da yargıç, ardından 1899'da devlet müftüsü ve El-Ezher'in idari konseyi üyesi olarak geri döndü. İctihadın (bağımsız akıl yürütme) canlandırılmasını, geleneğin eleştirilmesini ve din ile bilimin uzlaştırılmasını savundu. Reformun değerlendirilmesinde görüşler farklılık gösterdi; ciddi Müslümanların desteğinden muhafazakar çevrelerin düşmanlığına kadar değişti ve makalenin yazarı teolojisini savunmacı bir uzlaşma olarak tanımladı."
  id: "Seorang teolog dan reformis Mesir yang lahir pada tahun 1849 dan meninggal pada tahun 1905. Ensiklopedia Islam menganggapnya sebagai pendiri aliran modernis Mesir. Ia belajar di bawah bimbingan Jamal al-Din al-Afghani dan diasingkan setelah revolusi Urabi, kemudian kembali pada tahun 1889 untuk menjadi hakim, kemudian mufti negara pada tahun 1899, dan anggota dewan administrasi Al-Azhar. Ia menyerukan kebangkitan ijtihad (penalaran independen), mengkritik tradisi, dan merekonsiliasi agama dan ilmu pengetahuan. Pendapat berbeda dalam menilai reformasinya, mulai dari dukungan dari Muslim serius hingga permusuhan dari kalangan konservatif, dan penulis artikel tersebut menggambarkan teologinya sebagai kompromi defensif."
