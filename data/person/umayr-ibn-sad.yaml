summary:
  ar: "أنصاري؛ وجهه عمر بن الخطاب سنة 21 إلى بلاد الروم في جيش عظيم وولاه الصائفة وهي أول صائفة كانت، وأمره أن يتلطف لجبلة بن الأيهم ويستعطفه بالقرابة ويدعوه إلى الرجوع إلى بلاد الإسلام على أن يؤدي ما كان بذل من الصدقة ويقيم على دينه فأبى جبلة إلا المقام، فانتهى عمير إلى موضع يعرف بالحمار وهو وادٍ فأوقع بأهله وأخربه."
  en: "An Ansari; Umar ibn al-Khattab sent him in year 21 to Byzantine lands at the head of a great army, giving him the summer expedition — the first sa'ifa — and ordering him to conciliate Jabala ibn al-Ayham, appeal to their kinship and invite him back to the land of Islam on paying what alms he had offered while keeping his religion; Jabala refusing all but remaining, Umayr reached the place called al-Himar, a valley, and fell upon its people laying it waste."
