summary:
  ar: أنصاري؛ وجهه عمر بن الخطاب سنة 21 إلى بلاد الروم في جيش عظيم وولاه الصائفة وهي أول صائفة كانت، وأمره أن يتلطف لجبلة
    بن الأيهم ويستعطفه بالقرابة ويدعوه إلى الرجوع إلى بلاد الإسلام على أن يؤدي ما كان بذل من الصدقة ويقيم على دينه فأبى جبلة
    إلا المقام، فانتهى عمير إلى موضع يعرف بالحمار وهو وادٍ فأوقع بأهله وأخربه.
  en: An Ansari; Umar ibn al-Khattab sent him in year 21 to Byzantine lands at the head of a great army, giving him the summer
    expedition — the first sa'ifa — and ordering him to conciliate Jabala ibn al-Ayham, appeal to their kinship and invite
    him back to the land of Islam on paying what alms he had offered while keeping his religion; Jabala refusing all but remaining,
    Umayr reached the place called al-Himar, a valley, and fell upon its people laying it waste.
  ur: "انصاری؛ عمر بن خطاب نے 21 ہجری میں اسے عظیم فوج کے سربراہ رومی علاقوں میں بھیجا اور گرمیوں کی مہمیں دیں۔"
  es: "Un Ansari; Umar ibn al-Khattab lo envió en el año 21 a tierras bizantinas al frente de un gran ejército, dándole la expedición de verano —la primera sa'ifa— y ordenándole que se reconciliara con Jabala ibn al-Ayham, apelara a su parentesco y lo invitara a regresar a la tierra del Islam a cambio de la limosna que había ofrecido, manteniendo su religión; Jabala se negó a todo pero permaneció allí, Umayr llegó al lugar llamado al-Himar, un valle, y atacó a su gente dejándolo devastado."
  fr: "Un Ansari; Umar ibn al-Khattab l'envoya en l'an 21 aux terres byzantines à la tête d'une grande armée, lui confiant l'expédition d'été — la première sa'ifa — et lui ordonnant de concilier Jabala ibn al-Ayham, de faire appel à leurs liens de parenté et de l'inviter à revenir au pays de l'Islam en lui remboursant les aumônes qu'il avait offertes tout en conservant sa religion; Jabala refusant tout sauf restant, Umayr atteignit l'endroit appelé al-Himar, une vallée, et s'attaqua à ses habitants, la dévastant."
  tr: "Ensari; Ömer bin el-Hattab, onu 21 Hicri yılında büyük bir orduyla Romalıların topraklarına gönderdi ve yazların ilk üyesi olarak atadı. Ona Cibla bin el-Ayham'a iyilik göstermesini, akrabalık dilemesini ve sadaka olarak verdiği parayı ödemesi ve dininde sadık kalması şartıyla İslam topraklarına dönmesini emretti. Cübla, sadece o yere kalmayı reddetti. Umair, Al-Himmar olarak bilinen bir vadide kaldı ve oradaki halkı yok etti."
  id: "Ansari; Umar ibn al-Khattab mengirimnya ke tanah Romawi pada tahun 21 H dengan pasukan besar dan mengangkatnya sebagai musim panas pertama. Ia memerintahkannya untuk menunjukkan kebaikan kepada Jibla ibn al-Ayham, memohon persaudaraan, dan mengundangnya kembali ke tanah Islam dengan syarat ia membayar apa yang telah diberikan sebagai amal dan tetap teguh dalam agamanya. Jubla menolak tinggal kecuali di tempat itu. Umair akhirnya tiba di tempat yang dikenal sebagai Al-Himmar, yaitu sebuah lembah, dan ia menghancurkan rakyatnya dan menghancurkannya."
