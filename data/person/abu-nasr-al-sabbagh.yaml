summary:
  ar: "محمود بن الفضل بن محمود بن عبد الواحد، أبو النصر الصباغ الأصبهاني، سمع عبد الرحمن بن منده وأخاه عبد الوهاب، وعنه ابن ناصر وأبو الفتح محمد بن علي بن عبد السلام، كان حافظاً ثقة حسن السيرة عارفاً بالأسماء والنسب مفيداً لطلبة العلم. (؟ - ٥١٢ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13348}"
  en: "Mahmud ibn al-Fadl ibn Mahmud ibn Abd al-Wahid, Abu al-Nasr al-Sabbagh of Isfahan. He heard from Abd al-Rahman ibn Mandah and his brother Abd al-Wahhab; Ibn Nasir and Abu al-Fath Muhammad ibn Ali narrated from him. He was a reliable hadith memoriser, of good conduct, expert in names and genealogies, and useful to students. Death 512 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13348}"
