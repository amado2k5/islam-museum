gender: female
summary:
  ar: "البسوس بنت منقذ التميمية، خالة جساس بن مرة؛ نزل عليها سعد بن شميس الجرمي فكانت ناقته سراب ترعى مع نوق جساس، فلما رمى كليب بن ربيعة ضرعها وسمعت البسوس صراخ جارها وضعت يدها على رأسها وصاحت «واذلاه» فكان ذلك شرارة حرب البسوس، وضُرب بها المثل فقيل «أشأم من البسوس» و«أشأم من سراب» {cite:kamil-ibn-al-athir p. 391}."
  en: "Al-Basus bint Munqidh of Tamim, Jasas's aunt: her guest's she-camel Sarab was the beast Kulayb shot in the forbidden pasture, and her cry of 'wa-dhalah!' lit the war that bears her name — she passed into proverb as 'more ominous than al-Basus' {cite:kamil-ibn-al-athir p. 391}."
  fr: "Al-Basus bint Munqidh des Tamim, tante de Jasas : la chamelle Sarab de son hôte fut celle que Kulayb atteignit dans le pâturage interdit, et son cri « wa-dhalah ! » déclencha la guerre qui porte son nom — elle passa en proverbe comme « plus funeste qu’al-Basus » {cite:kamil-ibn-al-athir p. 391}."
  es: "Al-Basus bint Munqidh de Tamim, tía de Jasas: la camella de su huésped, Sarab, fue la bestia que Kulayb mató en el pasto prohibido, y su grito de 'wa-dhalah!' encendió la guerra que lleva su nombre; pasó a formar parte de un proverbio como 'más ominosa que al-Basus' {cite:kamil-ibn-al-athir p. 391}."
  ur: "تمیم کی البسوس بنت منقذ، جصاص کی خالہ: اس کی مہمان کی اونٹنی سرب وہ حیوان تھا جسے کلیب نے ممنوعہ چراگاہ میں گولی مار دی تھی، اور اس کی پکار 'و الضلہ!' اس جنگ کو روشن کیا جو اس کے نام کا حامل ہے - وہ 'الباس سے زیادہ بدصورت' کے طور پر کہاوت میں گزر گئی {حوالہ: کامل ابن الثیر صفحہ 391}۔"
