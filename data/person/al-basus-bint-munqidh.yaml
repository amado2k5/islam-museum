summary:
  ar: "البسوس بنت منقذ التميمية، خالة جساس بن مرة؛ نزل عليها سعد بن شميس الجرمي فكانت ناقته سراب ترعى مع نوق جساس، فلما رمى كليب بن ربيعة ضرعها وسمعت البسوس صراخ جارها وضعت يدها على رأسها وصاحت «واذلاه» فكان ذلك شرارة حرب البسوس، وضُرب بها المثل فقيل «أشأم من البسوس» و«أشأم من سراب» {cite:kamil-ibn-al-athir p. 391}."
  en: "Al-Basus bint Munqidh of Tamim, Jasas's aunt: her guest's she-camel Sarab was the beast Kulayb shot in the forbidden pasture, and her cry of 'wa-dhalah!' lit the war that bears her name — she passed into proverb as 'more ominous than al-Basus' {cite:kamil-ibn-al-athir p. 391}."
