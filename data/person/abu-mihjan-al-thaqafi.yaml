summary:
  ar: "أبو محجن عبد الله، ويقال مالك أو عمرو، بن حبيب الثقفي شاعر عربي من ثقيف عدّته دائرة المعارف الإسلامية من المخضرمين. شارك في الدفاع عن الطائف ضد محمد سنة 8هـ/630م، ثم أسلم سنة 9هـ/631-632م وقاتل في القادسية. اشتهر بخمرياته، ونفاه عمر بن الخطاب أكثر من مرة بسبب شعره في الخمر، وتذكر المقالة أنه توفي بعد نفيه الثاني سنة 16هـ/637م بقليل {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}."
  en: "Abu Mihjan 'Abd Allah (also given as Malik or 'Amr) ibn Habib al-Thaqafi was an Arab poet of the Thaqif tribe whom the Encyclopaedia of Islam counts among the mukhadramun. He took part in the defence of al-Ta'if against Muhammad in 8/630, entered Islam in 9/631-2 and fought at al-Qadisiyya. He was famous for his wine poems, and 'Umar banished him more than once because of verse that challenged the prohibition of wine; the article says he died shortly after his second banishment in 16/637 {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}."
  ur: "ابو محجن عبداللہ، جن کا نام مالک یا عمرو بھی بتایا گیا ہے، بن حبیب ثقفی قبیلۂ ثقیف کے عرب شاعر تھے جنہیں دائرۃ المعارف الاسلامیہ مخضرمین میں شمار کرتا ہے۔ انہوں نے 8ھ/630ء میں طائف کے دفاع میں محمد کے خلاف حصہ لیا، 9ھ/631-632ء میں مسلمان ہوئے اور قادسیہ میں لڑے۔ وہ اپنی شراب کی شاعری کے لیے مشہور تھے، اور عمر نے شراب کی حرمت کو چیلنج کرنے والے اشعار کی وجہ سے انہیں ایک سے زیادہ بار جلاوطن کیا؛ مضمون کے مطابق دوسری جلاوطنی کے تھوڑی دیر بعد، 16ھ/637ء میں، ان کی وفات ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}."
