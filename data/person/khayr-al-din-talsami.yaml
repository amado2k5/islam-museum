summary:
  ar: "الملا خير الدين التلسماني الصفاري الحنفي؛ قال في الشقائق كان جده الأعلى أتى من بلاد العجم إلى بلاد الروم هارباً من فتنة جنكيزخان وتوطن في نواحي قسطموني وكان صاحب كرامات يستجاب الدعاء عند قبره وبلغ صاحب الترجمة مبلغ الفضيلة قرأ في بلاده مباني العلوم ثم سافر إلى برسا فقرأ على ابن البشير ثم إلى أدرنة فقرأ على أخي مولانا خسرو وقرأ الحديث والتفسير على الملا خير الدين العجمي ثم أتى برسا وقرأ على الملا يوسف بالي بن الملا شمس الدين الفناري ثم وصل إلى خدمة الملا يكان واشتهر عنده بالفضيلة التامة وأرسله إلى مدرسة مظفر الدين الراقمة في بلدة طاش كبري من نواحي قسطموني وعين له كل يوم ثلاثون درهماً لوظيفة التدريس وخمسين درهماً من محصول كرة النحاس وعاش هناك في نعمة وعزة متكاثرة ثم عزله السلطان محمد لما أخذ تلك البلاد من يد إسماعيل بك فذهب إلى كرة النحاس فكان يعظ الناس هناك في كل جمعة وتوفي هناك سنة تسع وسبعين وثمانمائة {cite:shadharat-dhahab p. 325}."
  en: "Khayr al-Din al-Talsami — sixth-generation descendant of an 'Ajami who fled Genghis Khan into Kastamonu; studied at Bursa and Edirne under al-Fanari's son, served the Tashkopru madrasa till Mehmed II dismissed him with the district's fall, and preached Fridays at the copper-mine town till his death ~879 {cite:shadharat-dhahab p. 325}."
  es: "Khayr al-Din al-Talsami — descendiente de sexta generación de un 'Ajami que huyó de Genghis Khan a Kastamonu; estudió en Bursa y Edirne con el hijo de al-Fanari, sirvió en la madrasa de Tashkopru hasta que Mehmed II lo destituyó con la caída del distrito, y predicó los viernes en la ciudad minera de cobre hasta su muerte ~879 {cite:shadharat-dhahab p. 325}."
  fr: "Khayr al-Din al-Talsami — descendant de sixième génération d'un 'Ajami qui a fui Gengis Khan à Kastamonu; a étudié à Bursa et Edirne sous la direction du fils d'al-Fanari, a servi la madrasa de Tashkopru jusqu'à ce que Mehmed II le renvoie avec la chute du district, et a prêché le vendredi dans la ville minière de cuivre jusqu'à sa mort vers 879 {cite: shadharat-dhahab p. 325}."
  ur: "خیرالدین الطلسمی - ایک 'عجمی' کی چھٹی نسل کی اولاد جو چنگیز خان کو کستامونو میں بھاگ کر بھاگا تھا۔ الفناری کے بیٹے کے ماتحت برسا اور ادرنے میں تعلیم حاصل کی، تاشکوپرو مدرسہ کی خدمت کی یہاں تک کہ محمد دوم نے اسے ضلع کے زوال کے ساتھ برطرف کر دیا، اور اپنی وفات تک تانبے کی کان والے قصبے میں جمعہ کی تبلیغ کرتے رہے۔ 325}۔"
  tr: "Mele Hayreddin el-Tilsmani el-Saffari el-Hanafi; el-Şakaiq'te, büyük büyükbabasının Pers topraklarından Romalıların topraklarına geldiğini, Cengiz Han'ın karmaşasından kaçtığını ve Kastamuni yakınlarına yerleştiğini söylemiştir. O, mezarında duaları kabul edilen mucizeler adamıydı. Bu biyografinin yazarı erdem seviyesine ulaştı. Kendi topraklarındaki bilim yapılarını inceledi, sonra Barsa'ya giderek İbnüs el-Beşîr'in yanında eğitim aldı, sonra Edirne'ye giderek kardeşim Mevlana Hüzrav'ın yanında eğitim aldı, ardından Mela Hayriddin el-Ecmi'den hadis ve tefsir okudu, ardından Barsa'ya gelip Molla Yusuf'un yanında eğitim aldı. Bali ibn al-Mulla Şemseddin el-Fanari daha sonra Mulla Yakan'a hizmet etmek için geldi ve tam erdemiyle ün kazandı. Onu Qastamuni yakınlarındaki Taş Kubra kasabasındaki Muzaffar al-Din Rakkama okuluna gönderdi, ona günde otuz dirhem öğretti ve bakır topu hasadından elli dirhem verdi. Orada bol bir refah ve refah içinde yaşadı. Sonra Sultan Muhammed o toprağı İsmail Bey'den aldığında, her Cuma bakır topa gidip oradaki halka vaaz verdi. 879 Hicri yılında orada öldü {atıf:şadharat-dhahab, s. 325}."
  id: "Mulla Khair al-Din al-Tilsmani al-Saffari al-Hanafi; ia berkata dalam al-Shaqa'iq bahwa buyutnya berasal dari tanah Persia ke tanah Romawi, melarikan diri dari kekacauan Genghis Khan, dan menetap di dekat Qastamuni. Ia adalah pria mukjizat yang doanya dikabulkan di makamnya. Penulis biografi ini mencapai tingkat kebajikan. Ia mempelajari bangunan ilmu pengetahuan di tanahnya sendiri, lalu pergi ke Barsa, di mana ia belajar di bawah bimbingan Ibn al-Bashir, kemudian ke Edirne, di mana ia belajar di bawah saudara saya Mawlana Khusraw, mempelajari hadits dan tafsir di bawah Mulla Khair al-Din al-Ajmi, kemudian datang ke Barsa dan belajar di bawah Mulla Yusuf. Bali ibn al-Mulla Shams al-Din al-Fanari kemudian datang melayani Mulla Yakan, menjadi terkenal karena kebajikan penuhnya. Ia mengirimnya ke sekolah Muzaffar al-Din Raqqama di kota Tash Kubra dekat Qastamuni, memberinya tiga puluh dirham setiap hari untuk pengajaran dan lima puluh dirham dari panen bola tembaga. Ia hidup di sana dalam kemakmuran dan kemakmuran yang melimpah. Kemudian, ketika Sultan Muhammad mengambil tanah itu dari Ismail Bey, ia pergi ke pesta tembaga dan berkhotbah kepada masyarakat di sana setiap Jumat. Ia meninggal di sana pada tahun 879 H {cite:shadharat-dhahab, hlm. 325}."
