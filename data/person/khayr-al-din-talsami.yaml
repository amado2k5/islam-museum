summary:
  ar: "الملا خير الدين التلسماني الصفاري الحنفي؛ قال في الشقائق كان جده الأعلى أتى من بلاد العجم إلى بلاد الروم هارباً من فتنة جنكيزخان وتوطن في نواحي قسطموني وكان صاحب كرامات يستجاب الدعاء عند قبره وبلغ صاحب الترجمة مبلغ الفضيلة قرأ في بلاده مباني العلوم ثم سافر إلى برسا فقرأ على ابن البشير ثم إلى أدرنة فقرأ على أخي مولانا خسرو وقرأ الحديث والتفسير على الملا خير الدين العجمي ثم أتى برسا وقرأ على الملا يوسف بالي بن الملا شمس الدين الفناري ثم وصل إلى خدمة الملا يكان واشتهر عنده بالفضيلة التامة وأرسله إلى مدرسة مظفر الدين الراقمة في بلدة طاش كبري من نواحي قسطموني وعين له كل يوم ثلاثون درهماً لوظيفة التدريس وخمسين درهماً من محصول كرة النحاس وعاش هناك في نعمة وعزة متكاثرة ثم عزله السلطان محمد لما أخذ تلك البلاد من يد إسماعيل بك فذهب إلى كرة النحاس فكان يعظ الناس هناك في كل جمعة وتوفي هناك سنة تسع وسبعين وثمانمائة {cite:shadharat-dhahab p. 325}."
  en: "Khayr al-Din al-Talsami — sixth-generation descendant of an 'Ajami who fled Genghis Khan into Kastamonu; studied at Bursa and Edirne under al-Fanari's son, served the Tashkopru madrasa till Mehmed II dismissed him with the district's fall, and preached Fridays at the copper-mine town till his death ~879 {cite:shadharat-dhahab p. 325}."
