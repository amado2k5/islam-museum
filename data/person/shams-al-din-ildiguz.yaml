summary:
  ar: "بطاقة أولية لشمس الدين إيلدكز، المملوك الذي أسس دولة الأتابكة الإيلدكزيين في أذربيجان وآرّان في القرن الثاني عشر، توفي سنة ١١٧٥م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shams al-Din Ildiguz, the mamluk who founded the Eldiguzid atabegate of Azerbaijan and Arran in the twelfth century, d. 1175; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Shams al-Din Ildiguz, el mameluco que fundó el atabegate Eldiguzid de Azerbaiyán y Arran en el siglo XII, fallecido en 1175; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de Shams al-Din Ildiguz, le mamelouk qui a fondé l'atabégate eldiguzide d'Azerbaïdjan et d'Arran au XIIe siècle, mort en 1175; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "شمس الدین الدیگوز کے لیے ڈرافٹ کارڈ، مملوک جس نے بارہویں صدی میں آذربائیجان اور آران کے الدیگوزید اتابیگیٹ کی بنیاد رکھی، ڈی۔ 1175; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1175 yılında Azerbaycan ve Aran'da İldakzay Atabegleri devletini kuran Memlükler Şemeddin İlkaz'ın ön kartı 1175 yılında ölmüştür; İslam Devletleri sözlüklerinde adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Shams al-Din Ilkaz, Mamluk yang mendirikan negara Ildakzai Atabegs di Azerbaijan dan Aran pada abad kedua belas, meninggal pada tahun 1175 M; ia disebutkan dalam Kamus Negara-Negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
