summary:
  ar: "أبو علي الفارسي الحسن بن محمد بن عبد الغفار النحوي، صاحب التصانيف ببغداد؛ فضّله بعضهم على المبرد وقال ابن خلكان كان إمام وقته في علم النحو؛ دار البلاد وأقام بحلب عند سيف الدولة بن حمدان مدة وجرت بينه وبين أبي الطيب المتنبي مجالس، ثم انتقل إلى بلاد فارس وحظي عند عضد الدولة بن بويه حتى قال عضد الدولة: أنا غلام أبي علي في النحو، وصنّف له كتابي الإيضاح والتكملة؛ ومن حكاياته في ميدان شيراز أنه خانه جواب عن مسألة استثناء ثم رجع فوضع فيها كلاماً أثبته في كتابه {cite:shadharat-dhahab p. 88-89}."
  en: "Abu Ali al-Farisi (d. Rabi I 377, aged 89) — Baghdad's great grammarian, rated by some above al-Mubarrad; hosted at Sayf al-Dawla's Aleppo court (with famous majlis set-tos against al-Mutanabbi) and later so honoured by Adud al-Dawla that the sultan called himself 'al-Farisi's pupil in grammar' — al-Idah and al-Takmila were written for him {cite:shadharat-dhahab p. 88-89}."
