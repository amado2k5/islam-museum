summary:
  ar: "أبو علي الفارسي الحسن بن محمد بن عبد الغفار النحوي، صاحب التصانيف ببغداد؛ فضّله بعضهم على المبرد وقال ابن خلكان كان إمام وقته في علم النحو؛ دار البلاد وأقام بحلب عند سيف الدولة بن حمدان مدة وجرت بينه وبين أبي الطيب المتنبي مجالس، ثم انتقل إلى بلاد فارس وحظي عند عضد الدولة بن بويه حتى قال عضد الدولة: أنا غلام أبي علي في النحو، وصنّف له كتابي الإيضاح والتكملة؛ ومن حكاياته في ميدان شيراز أنه خانه جواب عن مسألة استثناء ثم رجع فوضع فيها كلاماً أثبته في كتابه {cite:shadharat-dhahab p. 88-89}."
  en: "Abu Ali al-Farisi (d. Rabi I 377, aged 89) — Baghdad's great grammarian, rated by some above al-Mubarrad; hosted at Sayf al-Dawla's Aleppo court (with famous majlis set-tos against al-Mutanabbi) and later so honoured by Adud al-Dawla that the sultan called himself 'al-Farisi's pupil in grammar' — al-Idah and al-Takmila were written for him {cite:shadharat-dhahab p. 88-89}."
  fr: "Abu Ali al-Farisi (mort en Rabi I 377, à 89 ans) — le grand grammairien de Bagdad, placé par certains au-dessus d'al-Mubarrad ; reçu à la cour d'Alep de Sayf al-Dawla (avec de célèbres joutes de séance contre al-Mutanabbi), puis si honoré par Adud al-Dawla que le sultan se disait « l'élève d'al-Farisi en grammaire » — al-Idah et al-Takmila furent écrits pour lui {cite:shadharat-dhahab p. 88-89}."
  es: "Abu Ali al-Farisi (m. I rabino 377, 89 años): el gran gramático de Bagdad, considerado por algunos por encima de al-Mubarrad; alojado en la corte de Sayf al-Dawla en Alepo (con famosos majlis enfrentados a al-Mutanabbi) y más tarde tan honrado por Adud al-Dawla que el sultán se llamó a sí mismo 'alumno de al-Farisi en gramática'; al-Idah y al-Takmila fueron escritos para él {citar: shadharat-dhahab p. 88-89}."
  ur: "ابو علی الفارسی ⁦(متوفی 1 ربیع 377، عمر 89)⁩ - بغداد کے عظیم گرامر، المبراد کے اوپر کچھ نے درجہ بندی کی ہے۔ سیف الدولہ کے حلب کے دربار میں میزبانی کی ⁦(جس میں المتنبی کے خلاف مشہور مجلس قائم کی گئی تھی)⁩ اور بعد میں عود الدولہ کی طرف سے اس قدر عزت افزائی کی گئی کہ سلطان نے اپنے آپ کو گرامر میں الفارسی کا شاگرد کہا۔ اس کے لیے الاداح اور التقمیلہ لکھی گئیں۔ 88-89}۔"
  tr: "Bağdat'taki eserlerin yazarı Ebu Ali el-Ferisi el-Hasan ibn Muhammed ibn Abd el-Ghaffer el-Nahvi; bazıları onu el-Mübarrad'a tercih etmiş ve İbn Hallikan onun zamanının dil bilgisi imamı olduğunu söylemiştir; diyar diyar dolaşmış ve bir süre Halep'te Sayf el-Davla ibn Hamdan ile kalmış, Ebu el-Tayyib el-Mutanabbi ile de görüşmeler yapmış, daha sonra İran diyarına gitmiş ve Adud el-Davla ibn Buveyh'in gözüne girmiş, hatta Adud el-Davla, \"Ben Ebu Ali'nin dil bilgisi hizmetkarıyım\" demiştir ve onun için El-İdeh ve El-Takmila adlı iki kitabı yazmıştır; Şiraz meydanındaki hikâyelerinden biri de, bir istisna sorusuna verdiği cevapla ihanete uğramasıdır; sonra geri dönmüş ve bu konuda bir açıklama yazmış, bunu da kitabına kaydetmiştir. {Kaynak: Şadharat-Dhaba, s. 88-89}"
  id: "Abu Ali al-Farisi al-Hasan ibn Muhammad ibn Abd al-Ghaffar al-Nahwi, penulis karya-karya di Baghdad; sebagian dari mereka lebih menyukai beliau daripada al-Mubarrad, dan Ibn Khallikan mengatakan bahwa beliau adalah imam pada zamannya dalam ilmu tata bahasa; beliau berkelana ke berbagai negeri dan tinggal di Aleppo bersama Sayf al-Dawla ibn Hamdan untuk sementara waktu, dan terjadi pertemuan antara beliau dan Abu al-Tayyib al-Mutanabbi, kemudian beliau pindah ke negeri Persia dan mendapatkan dukungan dari Adud al-Dawla ibn Buwayh hingga Adud al-Dawla berkata: Saya adalah pelayan Abu Ali dalam tata bahasa, dan beliau menuliskan dua buku Al-Idah dan Al-Takmila untuknya; dan di antara kisah-kisahnya di alun-alun Shiraz adalah bahwa beliau dikhianati dengan jawaban atas pertanyaan yang luar biasa, kemudian beliau kembali dan menulis pernyataan tentang hal itu yang dicatatnya dalam bukunya {cite:shadharat-dhahab p. 88-89}."
