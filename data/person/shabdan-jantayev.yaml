summary:
  ar: "شبدان جانتاييف (1839–1912)، المعروف بشبدان باتير، مناب قرغيزي من قبيلة ساريباغيش وبطل عسكري دخل خدمة روسيا بعد ضم شمال قرغيزيا، فصار كبيرًا لمنطقة توكماك وحاز أوسمة روسية؛ عُرف أيضًا بجهوده في تعليم القرغيز، فأسس مدرسة دينية خاصة في كمين سنة 1909."
  en: "Shabdan Jantayev (1839–1912), known as Shabdan Baatyr, was a Kyrgyz manap of the Sarybagysh tribe and military leader who entered Russian service after the annexation of northern Kyrgyzstan, becoming senior official of the Tokmak district and a holder of Russian decorations. He is also remembered for promoting Kyrgyz schooling, founding a private madrasa at Kemin in 1909."
  ur: "شبدان جانتائیف (1839–1912)، جو شبدان باتیر کے نام سے مشہور ہیں، ساریباغیش قبیلے کے کرغیز مناپ اور عسکری رہنما تھے؛ شمالی کرغیزستان کے روسی قبضے کے بعد وہ روسی خدمت میں آئے، توقماق ضلع کے بڑے اہلکار بنے اور روسی اعزازات پائے۔ وہ کرغیز تعلیم کے فروغ کے لیے بھی یاد کیے جاتے ہیں؛ 1909 میں انہوں نے کیمین میں نجی مدرسہ قائم کیا۔"
