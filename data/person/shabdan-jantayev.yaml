summary:
  ar: "شبدان جانتاييف (1839–1912)، المعروف بشبدان باتير، مناب قرغيزي من قبيلة ساريباغيش وبطل عسكري دخل خدمة روسيا بعد ضم شمال قرغيزيا، فصار كبيرًا لمنطقة توكماك وحاز أوسمة روسية؛ عُرف أيضًا بجهوده في تعليم القرغيز، فأسس مدرسة دينية خاصة في كمين سنة 1909."
  en: "Shabdan Jantayev (1839–1912), known as Shabdan Baatyr, was a Kyrgyz manap of the Sarybagysh tribe and military leader who entered Russian service after the annexation of northern Kyrgyzstan, becoming senior official of the Tokmak district and a holder of Russian decorations. He is also remembered for promoting Kyrgyz schooling, founding a private madrasa at Kemin in 1909."
  ur: "شبدان جانتائیف (1839–1912)، جو شبدان باتیر کے نام سے مشہور ہیں، ساریباغیش قبیلے کے کرغیز مناپ اور عسکری رہنما تھے؛ شمالی کرغیزستان کے روسی قبضے کے بعد وہ روسی خدمت میں آئے، توقماق ضلع کے بڑے اہلکار بنے اور روسی اعزازات پائے۔ وہ کرغیز تعلیم کے فروغ کے لیے بھی یاد کیے جاتے ہیں؛ 1909 میں انہوں نے کیمین میں نجی مدرسہ قائم کیا۔"
  es: "Shabdan Jantayev (1839-1912), conocido como Shabdan Baatyr, fue un jefe tribal kirguís de la tribu Sarybagysh y líder militar que entró al servicio ruso tras la anexión del norte de Kirguistán, llegando a ser alto funcionario del distrito de Tokmak y recibiendo condecoraciones rusas. También se le recuerda por promover la educación kirguís, fundando una madrasa privada en Kemin en 1909."
  fr: "Shabdan Jantayev (1839-1912), dit Shabdan Baatyr, était un manap kirghize de la tribu des Sarybagysh et un chef militaire qui entra au service de la Russie après l'annexion du nord du Kirghizistan. Il devint haut fonctionnaire du district de Tokmak et reçut des décorations russes. On se souvient également de lui pour son engagement en faveur de l'éducation kirghize; il fonda une madrasa privée à Kemin en 1909."
  tr: "Shebdan Jantayev (1839–1912), Shebdan Batyr olarak bilinir, Saripagish kabilesinden gelen bir Kırgız soyundan ve kuzey Kırgızistan'ın ilhakından sonra Rus hizmetine giren bir askeri kahramandı. Tokmak bölgesinin bir şefi oldu ve Rus madalyaları aldı; ayrıca Kırgızlara eğitim verme konusundaki çabalarıyla da tanınıyordu ve 1909'da Kamin'de özel bir dini okul kurdu."
  id: "Shebdan Jantayev (1839–1912), dikenal sebagai Shebdan Batyr, adalah keturunan Kyrgyz dari suku Saripagish dan pahlawan militer yang masuk dinas Rusia setelah aneksasi Kyrgyzstan utara. Ia menjadi kepala suku wilayah Tokmak dan menerima medali Rusia; ia juga dikenal atas usahanya dalam mengajar orang Kirgiz, mendirikan sekolah agama swasta di Kamin pada tahun 1909."
