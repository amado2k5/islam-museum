label: { ar: "أبلونيوس", en: "Abluniyus", fr: "Abluniyus", es: "Abluniyus", ur: "ابلونیوس" }
summary:
  ar: "أبلونيوس صاحب كتاب المخروطات وكان من أهل الاسكندرية، ذكر بنو موسى أن كتابه في المخروطات فسد لأسباب منها استصعاب نسخه وترك الاستقصاء لتصحيحه ودرس وامحى ذكره وحصل متفرقا في أيدي الناس إلى أن ظهر رجل بعسقلان يعرف بأوطوقيوس فلما جمع ما قدر عليه من الكتاب أصلح منه أربع مقالات، والكتاب ثمان مقالات والموجود منه سبع وبعض الثامنة، وترجم الأربع المقالات الأولى بين يدي أحمد بن موسى هلال بن أبي هلال الحمصي والثلاث الأواخر ثابت بن قرة الحراني {cite:fihrist-ibn-al-nadim p. 373}."
  en: "Apollonius — the Conics, lost then restored by Eutocius of Ascalon {cite:fihrist-ibn-al-nadim}"
  fr: "Apollonius — les Coniques, perdues puis restaurées par Eutocius d'Ascalon {cite:fihrist-ibn-al-nadim}"
  es: "Apolonio — Las Cónicas, perdidas y luego restauradas por Eutocio de Ascalón {cite:fihrist-ibn-al-nadim}"
  ur: "Apollonius - Conics، کھو گیا پھر Ascalon کے Eutocius نے بحال کیا"
  tr: "Konik kesitler üzerine kitabın yazarı Apollonius, İskenderiyeliydi. Beni Musa, konik kesitler üzerine yazdığı kitabın, kopyalamanın zorluğu ve düzeltmelerin yeterince titizlikle yapılmaması gibi nedenlerle bozulduğunu belirtmiştir. Kitap incelenmiş, bazı kısımları silinmiş ve insanların elinde dağılmış halde kalmıştır. Ta ki Aşkelon'da Eutychius adında bir adam ortaya çıkana kadar. Eutychius, kitaptan toplayabildiği kısımları bir araya getirerek dört maddeyi düzeltmiştir. Kitap sekiz maddeden oluşmaktadır ve günümüze ulaşan kısım yedi madde ve sekizinci maddenin bir bölümüdür. İlk dört madde Ahmed ibn Musa Hilal ibn Abi Hilal al-Himsi'nin huzurunda, son üç madde ise Sabit ibn Kurra al-Harrani tarafından tercüme edilmiştir. {cite:fihrist-ibn-al-nadim s. 373}"
  id: "Apollonius, penulis buku tentang irisan kerucut, berasal dari Alexandria. Bani Musa menyebutkan bahwa bukunya tentang irisan kerucut telah rusak karena berbagai alasan, termasuk kesulitan menyalinnya dan kurangnya ketelitian dalam memperbaikinya. Buku itu dipelajari, tetapi penyebutannya dihapus dan tersebar di tangan orang-orang hingga seorang pria bernama Eutychius muncul di Ashkelon. Ketika ia mengumpulkan apa yang bisa ia temukan dari buku itu, ia mengoreksi empat artikel darinya. Buku itu memiliki delapan artikel, dan yang tersisa adalah tujuh dan sebagian dari artikel kedelapan. Empat artikel pertama diterjemahkan di hadapan Ahmad ibn Musa Hilal ibn Abi Hilal al-Himsi, dan tiga artikel terakhir diterjemahkan oleh Thabit ibn Qurra al-Harrani. {cite:fihrist-ibn-al-nadim p. 373}."
