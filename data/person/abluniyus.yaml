label: { ar: "أبلونيوس", en: "Abluniyus" }
summary:
  ar: "أبلونيوس صاحب كتاب المخروطات وكان من أهل الاسكندرية، ذكر بنو موسى أن كتابه في المخروطات فسد لأسباب منها استصعاب نسخه وترك الاستقصاء لتصحيحه ودرس وامحى ذكره وحصل متفرقا في أيدي الناس إلى أن ظهر رجل بعسقلان يعرف بأوطوقيوس فلما جمع ما قدر عليه من الكتاب أصلح منه أربع مقالات، والكتاب ثمان مقالات والموجود منه سبع وبعض الثامنة، وترجم الأربع المقالات الأولى بين يدي أحمد بن موسى هلال بن أبي هلال الحمصي والثلاث الأواخر ثابت بن قرة الحراني {cite:fihrist-ibn-al-nadim p. 373}."
  en: "Apollonius — the Conics, lost then restored by Eutocius of Ascalon {cite:fihrist-ibn-al-nadim}"
