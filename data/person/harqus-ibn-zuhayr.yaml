id: person/harqus-ibn-zuhayr
class: person
label: { ar: "حرقوص بن زهير السعدي", en: "Harqus ibn Zuhayr al-Sa'di", es: "Harqus ibn Zuhayr al-Sa'di", fr: "Harqus ibn Zuhayr al-Sa'di", ur: "حرقس ابن زہیر السعدی" }
summary:
  ar: "من زعماء الثوار في البصرة أيام الجمل، وممن أفلت من القتل حين قتل قتلة عثمان هناك، ثم صار من زعماء الخوارج، وقُتل في النهروان سنة 38هـ بحسب الصلابي {cite:sallabi-ali-vol2 p. 51}."
  en: "A leader of the rioters in Basra at the time of the Camel, one of the few to escape the killing of Uthman's killers there; later a Kharijite commander, killed at Nahrawan in 38 AH according to al-Sallabi."
  es: "Líder de los alborotadores en Basora en la época del Camello, uno de los pocos que escapó de la matanza a manos de los asesinos de Uthman; más tarde comandante jariyí, muerto en Nahrawan en el año 38 de la Hégira, según al-Sallabi."
  fr: "Un chef des émeutiers de Bassora au moment du Chameau, l'un des rares à échapper au massacre perpétré par les assassins d'Uthman; plus tard un commandant kharijite, tué à Nahrawan en 38 AH selon al-Sallabi."
  ur: "اونٹ کے وقت بصرہ میں فسادیوں کا ایک رہنما، وہاں عثمان کے قاتلوں کے قتل سے بچنے والے چند لوگوں میں سے ایک؛ بعد میں ایک خارجی کمانڈر، السلبی کے مطابق 38 ہجری میں نہروان میں مارا گیا۔"
  tr: "Deve döneminde Basra'daki isyancıların liderlerinden biriydi ve Osman'ın katilleri orada öldürüldüğünde idamdan kurtuldu. Daha sonra Hawarij'in liderlerinden biri oldu ve Al-Selabi'ye göre 38 Hicri yılında Nahrawan'da öldürüldü {cite:sallabi-ali-cild2, s. 51}."
  id: "Ia adalah salah satu pemimpin pemberontak di Basra pada masa Unta, dan juga yang lolos dari eksekusi ketika para pembunuh Uthman dibunuh di sana. Ia kemudian menjadi salah satu pemimpin Khawarij, dan dibunuh di Nahrawan pada tahun 38 H menurut Al-Salabi {cite:sallabi-ali-vol2, hlm. 51}."
