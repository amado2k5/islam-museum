  ar: "واعظ وحافظ وكاتب تركي، وُلد في إسطنبول سنة 1965، تدرّب على يد محمود أوستا أوسمان أوغلو في جماعة إسماعيل آغا النقشبندية، وذاعت دروسه ومحاضراته عبر الكتب والتلفزيون ويوتيوب، وغادر جماعة إسماعيل آغا سنة 2024 وشارك في تأسيس جماعة جديدة تحمل اسم شيخه."
  en: "Turkish preacher, hafiz and writer, born in Istanbul in 1965. He was trained by Mahmut Ustaosmanoğlu within the Naqshbandi İsmailağa community, and his lessons and talks spread through books, television and YouTube; in 2024 he left the İsmailağa community and co-founded a new community named after his teacher."
  ur: "ترک واعظ، حافظ اور مصنف، جو 1965 میں استنبول میں پیدا ہوئے۔ انہوں نے نقشبندی اسماعیل آغا جماعت میں محمود استا عثمان اوغلو سے تربیت پائی، اور ان کے دروس کتابوں، ٹیلی ویژن اور یوٹیوب کے ذریعے پھیلے؛ 2024 میں انہوں نے اسماعیل آغا جماعت چھوڑ کر اپنے شیخ کے نام پر نئی جماعت کی بنیاد رکھی۔"
