  en: "Abd al-Ali Muhammad ibn Nizam al-Din al-Lucknawi"
summary:
  ar: "عبد العلي محمد بن نظام الدين محمد الأنصاري، أبو العياش، السهالوي اللكنوي الهندي، صاحب «فواتح الرحموت في شرح مسلم الثبوت»، ومن تصانيفه «الأركان الأربعة في العبادة»، وترجمة «منار الأنوار»، وحاشية على «سلم المنورق»، وحاشية على شرح الصدر الشيرازي لهداية الحكمة، وشرح التحرير لابن الهمام. توفي سنة 1225 هـ بحسب ما ذكره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  en: "Abd al-Ali Muhammad ibn Nizam al-Din Muhammad al-Ansari, Abu al-Iyyash, of Sahalawi and Lucknow in India, author of Fawatih al-rahamut on the Musallam al-thubut. His works include al-Arkan al-arba'a fi al-'ibada, a Persian translation of Manar al-anwar, glosses on Sullam al-munawraq and on al-Shirazi's commentary on the Hidaya of philosophy, and a commentary on the Tahrir of Ibn al-Humam. The book gives 1225 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
