summary:
  ar: "عبد العلي محمد بن نظام الدين محمد الأنصاري، أبو العياش، السهالوي اللكنوي الهندي، صاحب «فواتح الرحموت في شرح مسلم الثبوت»، ومن تصانيفه «الأركان الأربعة في العبادة»، وترجمة «منار الأنوار»، وحاشية على «سلم المنورق»، وحاشية على شرح الصدر الشيرازي لهداية الحكمة، وشرح التحرير لابن الهمام. توفي سنة 1225 هـ بحسب ما ذكره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  en: "Abd al-Ali Muhammad ibn Nizam al-Din Muhammad al-Ansari, Abu al-Iyyash, of Sahalawi and Lucknow in India, author of Fawatih al-rahamut on the Musallam al-thubut. His works include al-Arkan al-arba'a fi al-'ibada, a Persian translation of Manar al-anwar, glosses on Sullam al-munawraq and on al-Shirazi's commentary on the Hidaya of philosophy, and a commentary on the Tahrir of Ibn al-Humam. The book gives 1225 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  fr: "Abd al-Ali Muhammad ibn Nizam al-Din Muhammad al-Ansari, Abu al-Iyyash, de Sahalawi et de Lucknow en Inde, auteur des Fawatih al-rahamut sur le Musallam al-thubut. Ses œuvres comprennent al-Arkan al-arba'a fi al-'ibada, une traduction persane du Manar al-anwar, des gloses sur le Sullam al-munawraq et sur le commentaire d'al-Shirazi de la Hidaya de philosophie, et un commentaire du Tahrir d'Ibn al-Humam. Le livre donne 1225 H comme année de sa mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  es: "Abd al-Ali Muhammad ibn Nizam al-Din Muhammad al-Ansari, Abu al-Iyyash, de Sahalawi y Lucknow en la India, fue autor de Fawatih al-rahamut sobre el Musallam al-thubut. Entre sus obras se incluyen al-Arkan al-arba'a fi al-'ibada, una traducción al persa de Manar al-anwar, glosas sobre Sullam al-munawraq y sobre el comentario de al-Shirazi a la Hidaya de la filosofía, y un comentario sobre el Tahrir de Ibn al-Humam. El libro indica el año 1225 de la Hégira como su año de fallecimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  ur: "عبد العلی محمد بن نظام الدین محمد الانصاری، ابو العیاش، سہلاوی اور ہندوستان میں لکھنؤ، مسلم الثبوت پر فواتیح الرحمت کے مصنف۔ ان کی تصانیف میں الارکان العربعۃ فی العبادہ، منار الانوار کا فارسی ترجمہ، سلیم المنوراق اور الشیرازی کی فلسفہ ہدایہ کی تفسیر، اور ابن الہمام کی تحریر پر ایک تفسیر شامل ہیں۔ کتاب میں ان کی وفات کا سال 1225ھ بتایا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15411}"
