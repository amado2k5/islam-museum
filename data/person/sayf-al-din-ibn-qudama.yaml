summary:
  ar: "الحافظ الحنبلي ابن شيخ الإسلام موفق الدين ابن قدامة؛ ولد بالجبل وسمع من جده الكثير ومن أبي اليمن الكندي ورحل فسمع ببغداد، وكتب بخطه الكثير وصنف؛ قال الذهبي كان ثقة حافظاً ذكياً متيقظاً مليح الخط عاملاً بالأثر آمـراً بالمعروف قوالاً بالحق ولو طال عمره لساد أهل زمانه علماً وعملاً؛ وألف مجلداً كبيراً في الرد على الحافظ محمد بن طاهر المقدسي بإباحته للسماع {cite:shadharat-dhahab p. 225}."
  en: "Muwaffaq al-Din Ibn Qudama's grandson (b. 605, d. Sha'ban 643, Qasyun) — Dhahabi: 'had he lived he would have led his age in knowledge and practice'; author of a large volume refuting Ibn Tahir al-Maqdisi's permissibility of sama' {cite:shadharat-dhahab p. 225}."
