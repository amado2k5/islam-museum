summary:
  ar: "متين غوراك ⁦(وُلد في 20 آب 1960 في كيزيلتبه بماردين)⁩ قائد عسكري تركي شغل رئاسة الأركان العامة الحادية والثلاثين من آب 2023 إلى آب 2025. ضابط مدفعية وطيار بري من أسرة تركمانية هاجرت من الموصل؛ قاد الجيش الثاني (2020–2023) وكان قبلها نائبًا لرئيس الأركان العامة."
  en: "Metin Gürak (born 20 August 1960 in Kızıltepe, Mardin) is a Turkish general who served as the 31st Chief of the General Staff from August 2023 to August 2025. An artillery officer and army aviator of Turkmen family origin, he commanded the Second Army (2020–2023) and had earlier served as deputy chief of the General Staff."
