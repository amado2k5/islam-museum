summary:
  ar: "صاحب ميافارقين، ملك سنة خمس وأربعين وستمائة؛ كان عالماً فاضلاً شجاعاً عادلاً محسناً إلى الرعية ذا عبادة وورع ولم يكن في بيته من يضاهيه؛ حاصرته التتار عشرين شهراً حتى فني أهل البلد بالوباء والقحط ثم دخلوا وأسروه فضرب هلاكو عنقه بعد أخذ حلب وطيف برأسه ثم علق على باب الفراديس ثم دفنه المسلمون بمسجد الرأس داخل الباب؛ قال الذهبي بلغني أن التتار دخلوا البلد فوجدوا به سبعين نفساً بعد ألوف كثيرة {cite:shadharat-dhahab p. 303}."
  en: "Lord of Mayyafariqin (r. 645) — 'a learned, virtuous, just prince, none in his house his peer'; after a twenty-month Tatar siege that emptied the city by plague and famine, Hulagu had him beheaded, his head paraded and hung on Bab al-Faradis; Dhahabi heard the Tatars found seventy souls in what had been thousands {cite:shadharat-dhahab p. 303}."
