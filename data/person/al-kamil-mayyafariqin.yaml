summary:
  ar: "صاحب ميافارقين، ملك سنة خمس وأربعين وستمائة؛ كان عالماً فاضلاً شجاعاً عادلاً محسناً إلى الرعية ذا عبادة وورع ولم يكن في بيته من يضاهيه؛ حاصرته التتار عشرين شهراً حتى فني أهل البلد بالوباء والقحط ثم دخلوا وأسروه فضرب هلاكو عنقه بعد أخذ حلب وطيف برأسه ثم علق على باب الفراديس ثم دفنه المسلمون بمسجد الرأس داخل الباب؛ قال الذهبي بلغني أن التتار دخلوا البلد فوجدوا به سبعين نفساً بعد ألوف كثيرة {cite:shadharat-dhahab p. 303}."
  en: "Lord of Mayyafariqin (r. 645) — 'a learned, virtuous, just prince, none in his house his peer'; after a twenty-month Tatar siege that emptied the city by plague and famine, Hulagu had him beheaded, his head paraded and hung on Bab al-Faradis; Dhahabi heard the Tatars found seventy souls in what had been thousands {cite:shadharat-dhahab p. 303}."
  es: "Señor de Mayyafariqin (r. 645) — 'un príncipe erudito, virtuoso y justo, sin igual en su casa'; tras un asedio tártaro de veinte meses que dejó la ciudad vacía por la peste y el hambre, Hulagu lo mandó decapitar, su cabeza fue exhibida y colgada en Bab al-Faradis; Dhahabi oyó que los tártaros encontraron setenta almas entre miles {cita: shadharat-dhahab p. 303}."
  fr: "Seigneur de Mayyafariqin (r. 645) — « un prince savant, vertueux et juste, sans égal dans sa maison »; après un siège tatar de vingt mois qui vida la ville par la peste et la famine, Hulagu le fit décapiter, sa tête exhibée et accrochée à Bab al-Faradis; Dhahabi entendit dire que les Tatars trouvèrent soixante-dix âmes sur ce qui avait été des milliers {cite: shadharat-dhahab p. 303}."
  ur: "مایافارقین کا رب ⁦(ر. 645)⁩ - 'ایک عالم، نیک، عادل شہزادہ، اس کے گھر میں اس کا ہم عمر کوئی نہیں'؛ بیس ماہ کے تاتاری محاصرے کے بعد جس نے شہر کو طاعون اور قحط سے خالی کر دیا، ہلاگو نے اس کا سر قلم کر دیا، اس کا سر پریڈ کر دیا اور باب الفرادیس پر لٹکا دیا۔ ذہبی نے سنا ہے کہ تاتاریوں کو ستر روحیں ملی ہیں جو ہزاروں کی تعداد میں تھیں۔ 303}۔"
  tr: "645 Hicri yılında kral olan Miafariqin'in sahibi; erdemli, cesur, adil bir âlimdi, tebaasına cömert, dindar ve dindardı, evinde eşi yoktu. Tatarlar onu yirmi ay boyunca kuşattı, ta ki kasaba halkı veba ve kıtlıkla yok olana kadar. Sonra içeri girip onu yakaladılar. Halep'i ele geçirdikten sonra Halaku boynunu vurdu, başını kesti, ardından Cennet Kapısı'nda astı ve Müslümanlar onu kapıdaki El-Ras Camii'ne gömdü. El-Dhahabi, Tatarların şehre girip binlerce kişiden sonra yetmiş ruh bulduğunu duyduğunu söyledi {cite:shadharat-dhahab, s. 303}."
  id: "Pemilik Miafariqin, raja pada tahun 645 H; ia adalah seorang cendekiawan yang berbudi luhur, berani, adil, dermawan kepada rakyatnya, taat dan saleh, tanpa tandingan di rumahnya. Tatar mengepungnya selama dua puluh bulan hingga penduduk kota itu musnah akibat wabah dan kelaparan. Kemudian mereka masuk dan menangkapnya. Setelah merebut Aleppo, Halaku memukul lehernya dan memenggal kepalanya, lalu menggantungnya di Gerbang Surga, dan umat Muslim menguburnya di Masjid Al-Ras di dalam gerbang. Al-Dhahabi mengatakan ia mendengar bahwa Tatar masuk ke kota dan menemukan tujuh puluh jiwa setelah ribuan {cite:shadharat-dhahab, hlm. 303}."
