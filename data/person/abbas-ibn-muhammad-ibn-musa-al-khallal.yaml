summary:
  ar: "عباس بن محمد بن موسى الخلال، من أهل بغداد، كان من أصحاب الإمام أحمد بن حنبل الأوائل الذين كان يعتد بهم، وكان رجلا له قدر وعلم وعارضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065}"
  en: "Abbas ibn Muhammad ibn Musa al-Khallal, from Baghdad, one of the first companions of Imam Ahmad ibn Hanbal whom he counted on, a man of standing, learning and debating skill. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065}"
  fr: "Abbas ibn Muhammad ibn Musa al-Khallal, de Bagdad, l'un des premiers compagnons de l'imam Ahmad ibn Hanbal, sur qui celui-ci comptait, homme de rang, de savoir et d'habileté dans la controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065}"
  es: "Abbas ibn Muhammad ibn Musa al-Khallal, de Bagdad, fue uno de los primeros compañeros del Imam Ahmad ibn Hanbal, en quien confiaba plenamente; un hombre de gran prestigio, erudito y hábil en el debate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065}"
  ur: "عباس بن محمد بن موسیٰ الخلال، بغداد سے، امام احمد بن حنبل کے اولین اصحاب میں سے ایک جن پر وہ شمار کرتے تھے، کھڑے ہونے، سیکھنے اور بحث کرنے کی مہارت رکھنے والے آدمی تھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2065}"
  tr: "Bağdatlı Abbas ibn Muhammed ibn Musa el-Hallal, İmam Ahmed ibn Hanbel'in ilk ve saygın sahabelerinden biriydi. Saygınlığı, bilgisi ve hitabet yeteneğiyle öne çıkan bir kişiydi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2065}"
  id: "Abbas ibn Muhammad ibn Musa al-Khallal, dari Baghdad, adalah salah satu sahabat awal dan sangat dihormati dari Imam Ahmad ibn Hanbal. Beliau adalah seorang yang berwibawa, berilmu, dan fasih berbicara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2065}"
