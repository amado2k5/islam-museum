summary:
  ar: "عبد الغني بن إسماعيل النابلسي، شاعر عالم بالدين والأدب متصوف مكثر من التصنيف، ولد ونشأ وتوفي في دمشق بعد رحلات إلى بغداد وفلسطين ولبنان ومصر والحجاز، 1050 إلى 1143 هـ."
  en: "Abd al-Ghani ibn Isma'il al-Nabulsi, a poet, scholar of religion and literature, Sufi and very prolific author, born, raised and buried in Damascus after journeys to Baghdad, Palestine, Lebanon, Egypt and the Hijaz, 1050 to 1143 AH."
  fr: "Abd al-Ghani ibn Isma'il al-Nabulsi, poète, savant en religion et en littérature, soufi et auteur très prolifique, né, élevé et inhumé à Damas après des voyages à Bagdad, en Palestine, au Liban, en Égypte et au Hedjaz, 1050 à 1143 H."
  es: "Abd al-Ghani ibn Isma'il al-Nabulsi, poeta, erudito en religión y literatura, sufí y autor muy prolífico, nació, se crió y fue enterrado en Damasco después de viajar a Bagdad, Palestina, Líbano, Egipto y el Hiyaz, entre los años 1050 y 1143 de la Hégira."
