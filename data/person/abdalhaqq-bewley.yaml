summary:
  ar: "مترجم وكاتب بريطاني اعتنق الإسلام في المغرب سنة 1968 ودرس فيه ثلاث سنوات، وعمل مع الشيخ عبد القادر الصوفي في تأسيس جماعات مسلمة في نيجيريا وإسبانيا والولايات المتحدة وألمانيا وجنوب أفريقيا، وأمّ المصلين في نورويتش وكيب تاون. ترجم مع زوجته عائشة بيولي «القرآن الكريم: ترجمة جديدة لمعناه» (1999) والموطأ والشفا، وألّف «الزكاة: إحياء ركن ساقط» و«المذاهب الأربعة في الإسلام»."
  en: "British translator and writer who accepted Islam in Morocco in 1968 and studied there for three years. He worked with Shaykh Abdalqadir as-Sufi establishing Muslim communities in Nigeria, Spain, the United States, Germany and South Africa, and served as an imam at Norwich and Cape Town. With his wife Aisha Bewley he translated The Noble Qur'an (1999), the Muwatta and ash-Shifa; his own books include Zakat: Raising a Fallen Pillar and The Four Madhhabs of Islam."
  fr: "Traducteur et écrivain britannique qui embrassa l'islam au Maroc en 1968 et y étudia trois ans. Il travailla avec le cheikh Abdalqadir as-Sufi à l'établissement de communautés musulmanes au Nigeria, en Espagne, aux États-Unis, en Allemagne et en Afrique du Sud, et fut imam à Norwich et au Cap. Avec son épouse Aisha Bewley, il traduisit The Noble Qur'an (1999), le Muwatta et ash-Shifa ; ses propres livres comprennent Zakat: Raising a Fallen Pillar et The Four Madhhabs of Islam."
  ur: "برطانوی مترجم و مصنف، جنہوں نے 1968ء میں مراکش میں اسلام قبول کیا اور وہاں تین سال تعلیم حاصل کی۔ انہوں نے شیخ عبد القادر الصوفی کے ساتھ نائجیریا، اسپین، امریکہ، جرمنی اور جنوبی افریقہ میں مسلم جماعتوں کے قیام میں کام کیا اور ناروچ و کیپ ٹاؤن میں امامت کی۔ اپنی اہلیہ عائشہ بیولی کے ساتھ انہوں نے «قرآن کی نئی ترجمانی» ⁦(1999ء)⁩، موطا اور شفا کا ترجمہ کیا؛ ان کی اپنی کتابوں میں «زکاۃ: ایک گرا ہوا رکن پھر سے» اور «اسلام کے چار مذاہب» شامل ہیں۔"
  es: "Traductor y escritor británico que se convirtió al islam en Marruecos en 1968 y estudió allí durante tres años. Colaboró con el jeque Abdalqadir as-Sufi en la creación de comunidades musulmanas en Nigeria, España, Estados Unidos, Alemania y Sudáfrica, y fue imán en Norwich y Ciudad del Cabo. Junto con su esposa, Aisha Bewley, tradujo El Sagrado Corán (1999), el Muwatta y el ash-Shifa; entre sus libros se encuentran Zakat: Reconstruyendo un pilar caído y Las cuatro escuelas de pensamiento del islam."
  tr: "Bir İngiliz çevirmen ve yazar olan kendisi, 1968'de Fas'ta İslamiyet'i kabul etti ve orada üç yıl eğitim gördü. Şeyh Abdülkadir el-Sufi ile birlikte Nijerya, İspanya, Amerika Birleşik Devletleri, Almanya ve Güney Afrika'da Müslüman cemaatleri kurmak için çalıştı ve Norwich ve Cape Town'da namaz kıldırdı. Eşi Ayşe Bewley ile birlikte \"Kur'an-ı Kerim: Anlamının Yeni Bir Çevirisi\" (1999) ile birlikte el-Muvatta ve el-Şifa'yı da çevirdi. Ayrıca \"Zekat: Unutulmuş Bir Sütunu Canlandırmak\" ve \"İslam'da Dört Düşünce Okulu\" adlı eserlerin de yazarıdır."
  id: "Seorang penerjemah dan penulis Inggris, ia masuk Islam di Maroko pada tahun 1968 dan belajar di sana selama tiga tahun. Ia bekerja dengan Syekh Abdul Qadir al-Sufi dalam mendirikan komunitas Muslim di Nigeria, Spanyol, Amerika Serikat, Jerman, dan Afrika Selatan, serta memimpin salat di Norwich dan Cape Town. Ia dan istrinya, Aisha Bewley, menerjemahkan \"Al-Qur'an: Terjemahan Baru Maknanya\" (1999), serta al-Muwatta dan al-Shifa. Ia juga menulis \"Zakat: Menghidupkan Kembali Pilar yang Terlupakan\" dan \"Empat Mazhab dalam Islam.\""
