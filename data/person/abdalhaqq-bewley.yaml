    note: "No two independent sources attest a legal school or an order membership for Bewley himself. His Muslim practice is documented in full: he accepted Islam in Morocco in 1968 and studied there for three years, has served as an imam (Norwich through most of the 1980s; imam-khatib of the Jumu'a Mosque of Cape Town in 2006) and a teacher of Islam on four continents, and his translation and writing life has been spent inside Shaykh Abdalqadir as-Sufi's Maliki-oriented communities. Working within a teacher's movement, translating its Maliki and Sufi texts, and an imamate attest practice and affiliation, none of which names a school or proves an order membership for the man himself. One scholarly overview of women Qur'an translators (Bokhari & Shah, Abhath, 2021) describes the Bewleys jointly: 'They belonged to the Maliki School of jurisprudence. They are Sufis. In Sufi tariqah, they follow the Habibiyya branch of the Shadhili Darqawi Tariqah.' That is a single scholarly family, preserved here, and on its own it does not carry a value; the settlement is unknown, with the practice stated in full."
