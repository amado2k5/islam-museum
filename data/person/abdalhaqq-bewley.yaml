summary:
  ar: "مترجم وكاتب بريطاني اعتنق الإسلام في المغرب سنة 1968 ودرس فيه ثلاث سنوات، وعمل مع الشيخ عبد القادر الصوفي في تأسيس جماعات مسلمة في نيجيريا وإسبانيا والولايات المتحدة وألمانيا وجنوب أفريقيا، وأمّ المصلين في نورويتش وكيب تاون. ترجم مع زوجته عائشة بيولي «القرآن الكريم: ترجمة جديدة لمعناه» (1999) والموطأ والشفا، وألّف «الزكاة: إحياء ركن ساقط» و«المذاهب الأربعة في الإسلام»."
  en: "British translator and writer who accepted Islam in Morocco in 1968 and studied there for three years. He worked with Shaykh Abdalqadir as-Sufi establishing Muslim communities in Nigeria, Spain, the United States, Germany and South Africa, and served as an imam at Norwich and Cape Town. With his wife Aisha Bewley he translated The Noble Qur'an (1999), the Muwatta and ash-Shifa; his own books include Zakat: Raising a Fallen Pillar and The Four Madhhabs of Islam."
  ur: "برطانوی مترجم و مصنف، جنہوں نے 1968ء میں مراکش میں اسلام قبول کیا اور وہاں تین سال تعلیم حاصل کی۔ انہوں نے شیخ عبد القادر الصوفی کے ساتھ نائجیریا، اسپین، امریکہ، جرمنی اور جنوبی افریقہ میں مسلم جماعتوں کے قیام میں کام کیا اور ناروچ و کیپ ٹاؤن میں امامت کی۔ اپنی اہلیہ عائشہ بیولی کے ساتھ انہوں نے «قرآن کی نئی ترجمانی» (1999ء)، موطا اور شفا کا ترجمہ کیا؛ ان کی اپنی کتابوں میں «زکاۃ: ایک گرا ہوا رکن پھر سے» اور «اسلام کے چار مذاہب» شامل ہیں۔"
