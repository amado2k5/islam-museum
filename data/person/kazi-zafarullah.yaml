summary:
  ar: "صناعي وسياسي بنغلاديشي، وُلد في أبريل 1947. عضو هيئة رئاسة حزب رابطة عوامي الحاكم سابقًا ونائب سابق عن دائرة فريدبور-5، أُصيب في هجوم القنابل على تجمع للرابطة سنة 2004، واعتُقل خلال حالة الطوارئ سنة 2007، وبُرّئ من تهم فساد سنة 2009، وذُكر اسمه واسم أسرته في تسريبات أوراق بنما."
  en: "Bangladeshi industrialist and politician, born in April 1947. A presidium member of the Awami League and a former member of parliament for Faridpur-5, he was injured in the 2004 grenade attack on an Awami League rally, arrested during the 2007 state of emergency, cleared of corruption charges in 2009, and named with his family in the Panama Papers reporting."
  ur: "بنگلہ دیشی صنعت کار اور سیاست دان، جو اپریل 1947ء میں پیدا ہوئے۔ وہ عوامی لیگ کے پریزیڈیم کے رکن اور فریدپور-5 سے سابق رکن پارلیمنٹ ہیں؛ 2004ء کے گرینیڈ حملے میں زخمی ہوئے، 2007ء کی ایمرجنسی میں گرفتار ہوئے، 2009ء میں بدعنوانی کے الزامات سے بری ہوئے، اور ان کا اور ان کے خاندان کا نام پانامہ پیپرز میں آیا۔"
