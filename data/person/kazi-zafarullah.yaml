summary:
  ar: "صناعي وسياسي بنغلاديشي، وُلد في أبريل 1947. عضو هيئة رئاسة حزب رابطة عوامي الحاكم سابقًا ونائب سابق عن دائرة فريدبور-5، أُصيب في هجوم القنابل على تجمع للرابطة سنة 2004، واعتُقل خلال حالة الطوارئ سنة 2007، وبُرّئ من تهم فساد سنة 2009، وذُكر اسمه واسم أسرته في تسريبات أوراق بنما."
  en: "Bangladeshi industrialist and politician, born in April 1947. A presidium member of the Awami League and a former member of parliament for Faridpur-5, he was injured in the 2004 grenade attack on an Awami League rally, arrested during the 2007 state of emergency, cleared of corruption charges in 2009, and named with his family in the Panama Papers reporting."
  ur: "بنگلہ دیشی صنعت کار اور سیاست دان، جو اپریل 1947ء میں پیدا ہوئے۔ وہ عوامی لیگ کے پریزیڈیم کے رکن اور فریدپور-5 سے سابق رکن پارلیمنٹ ہیں؛ 2004ء کے گرینیڈ حملے میں زخمی ہوئے، 2007ء کی ایمرجنسی میں گرفتار ہوئے، 2009ء میں بدعنوانی کے الزامات سے بری ہوئے، اور ان کا اور ان کے خاندان کا نام پانامہ پیپرز میں آیا۔"
  es: "Industrial y político bangladesí, nacido en abril de 1947. Miembro del presidium de la Liga Awami y exdiputado por Faridpur-5, resultó herido en el ataque con granadas de 2004 contra un mitin de la Liga Awami, fue arrestado durante el estado de emergencia de 2007, absuelto de cargos de corrupción en 2009 y mencionado junto con su familia en los informes de los Papeles de Panamá."
  fr: "Industriel et homme politique bangladais, né en avril 1947. Membre du présidium de la Ligue Awami et ancien député de Faridpur-5, il a été blessé lors de l'attentat à la grenade de 2004 contre un rassemblement de la Ligue Awami, arrêté pendant l'état d'urgence de 2007, blanchi des accusations de corruption en 2009 et cité avec sa famille dans les Panama Papers."
  tr: "Bangladeşli sanayici ve siyasetçi, Nisan 1947 doğumlu. İktidardaki Awami League partisi başkanlık kurulu üyesi ve Faridpur-5 seçim bölgesinin eski milletvekili, 2004'te bir Lig toplantısına düzenlenen bombalı saldırıda yaralanmış, 2007'de olağanüstü hal sırasında tutuklanmış, 2009'da yolsuzluk suçlamalarından beraat etmiş ve Panama Belgeleri sızıntılarında adını ve ailesini anmıştır."
  id: "Pengusaha dan politisi Bangladesh, lahir pada April 1947. Anggota presidium partai penguasa Awami League dan mantan anggota parlemen untuk konstituensi Faridpur-5, terluka dalam serangan bom di pertemuan Liga pada 2004, ditangkap saat keadaan darurat pada 2007, dibebaskan dari tuduhan korupsi pada 2009, dan menyebut nama serta keluarganya dalam bocoran Panama Papers."
