summary:
  ar: "القاضي الرشيد أحمد بن علي الغساني الأسواني نسبة إلى أسوان بصعيد مصر؛ كاتب شاعر فقيه نحوي لغوي منطقي مهندس طبيب منجم على المذهب الشافعي، كان مفتياً وله ديوان شعر ومصنفات منها كتاب منية الألمعي ومقامات على نسق مقامات الحريري؛ ذهب رسولاً إلى اليمن وتولى القضاء بها، قتله الوزير شاور ظلماً — أمر أن يصلب شنقاً فجعل يقول للذي يولي ذلك «عجّل عجّل فلا رغبة لكريم في حياة بعد هذه الحال»، وكان الساعي في صلبه الفقيه عمارة اليمني، ولما قتل شاور بعد حين حفروا له قبراً فوجدوا الرشيد مدفوناً فيه فدفنا معاً؛ توفي سنة اثنتين وستين وخمسمائة {cite:shadharat-dhahab p. 683-685}."
  en: "Qadi al-Rashid Ahmad ibn Ali al-Ghassani of Aswan; scribe, poet, jurist, grammarian, physician and astronomer on the Shafi'i madhhab, author of Minyat al-Alma'i and Maqamat on al-Hariri's pattern; he went envoy to Yemen and judged there — wazir Shawar had him crucified unjustly (the qadi urging the hangman 'be quick — a nobleman has no wish for life after such a state'), and when Shawar himself was killed soon after they found al-Rashid already buried in the grave dug for him; d. 562 {cite:shadharat-dhahab p. 683-685}."
  fr: "Qadi al-Rashid Ahmad ibn Ali al-Ghassani d'Assouan ; scribe, poète, juriste, grammairien, médecin et astronome sur le madhab Shafi'i, auteur de Minyat al-Alma'i et Maqamat sur le modèle d'al-Hariri ; Il est allé envoyé au Yémen et jugé là-bas - Wazir Shawar l'a fait crucifier injustement (le qadi exhortant le bourreau \"soyez rapides - un noble n'a aucun désir de vie après un tel état\"), et quand Shawar lui-même a été tué peu de temps après avoir trouvé al-Rashid déjà enterré dans la tombe creusée pour lui ; Mort en 562 {cite:shadharat-dhahab p. 683-685}."
  es: "Qadi al-Rashid Ahmad ibn Ali al-Ghassani de Asuán; escriba, poeta, jurista, gramático, médico y astrónomo de la escuela Shafi'i, autor de Minyat al-Alma'i y Maqamat según el modelo de al-Hariri; fue enviado a Yemen y juzgó allí; el visir Shawar lo hizo crucificar injustamente (el cadí instó al verdugo a que se diera prisa, un noble no desea la vida después de tal estado), y cuando el propio Shawar fue asesinado poco después, encontraron a al-Rashid ya enterrado en la tumba cavada para él; murió en 562 {cita: shadharat-dhahab págs. 683-685}."
