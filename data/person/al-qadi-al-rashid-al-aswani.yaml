names:
  - { value: "القاضي الرشيد أبو الحسن أحمد بن القاضي الرشيد أبي الحسن علي الغساني الأسواني", kind: full }
summary:
  ar: "القاضي الرشيد أحمد بن علي الغساني الأسواني نسبة إلى أسوان بصعيد مصر؛ كاتب شاعر فقيه نحوي لغوي منطقي مهندس طبيب منجم على المذهب الشافعي، كان مفتياً وله ديوان شعر ومصنفات منها كتاب منية الألمعي ومقامات على نسق مقامات الحريري؛ ذهب رسولاً إلى اليمن وتولى القضاء بها، قتله الوزير شاور ظلماً — أمر أن يصلب شنقاً فجعل يقول للذي يولي ذلك «عجّل عجّل فلا رغبة لكريم في حياة بعد هذه الحال»، وكان الساعي في صلبه الفقيه عمارة اليمني، ولما قتل شاور بعد حين حفروا له قبراً فوجدوا الرشيد مدفوناً فيه فدفنا معاً؛ توفي سنة اثنتين وستين وخمسمائة {cite:shadharat-dhahab p. 683-685}."
  en: "Qadi al-Rashid Ahmad ibn Ali al-Ghassani of Aswan; scribe, poet, jurist, grammarian, physician and astronomer on the Shafi'i madhhab, author of Minyat al-Alma'i and Maqamat on al-Hariri's pattern; he went envoy to Yemen and judged there — wazir Shawar had him crucified unjustly (the qadi urging the hangman 'be quick — a nobleman has no wish for life after such a state'), and when Shawar himself was killed soon after they found al-Rashid already buried in the grave dug for him; d. 562 {cite:shadharat-dhahab p. 683-685}."
