summary:
  ar: "كمال الدين ابن المناقب الخضيري الأسيوطي الشافعي؛ ولد في أوائل القرن بأسيوط واشتغل بها ثم قدم القاهرة بعد عشرين وثمانمائة فلازم شيوخ العصر إلى أن برع في الفقه والأصلين والقراءات والحساب والنحو والتصريف والمعاني والبيان والمنطق وغير ذلك ولازم التدريس والإفتاء وكان له في الإنشاء اليد الطولى وكتب الخط المنسوب وصنف حاشية على شرح الألفية لابن المصنف حافلة في مجلدين وكتاباً في القراءات وحاشية على العضد وتعليقاً على الإرشاد لابن المقري وكتاباً في صناعة التوقيع، أخبره بعض أصحابه أن الظاهر جقمق عزم مرة على قضاء القضاة بالديار المصرية وأرسل يقول للخليفة المستكفي بالله قل لصاحبك يطلع أوليه فأرسل الخليفة قاصداً إلى الوالد يخبره بذلك فامتنع وأنشد: وألذ من نيل الوزارة أن ترى يوماً يريك مصارع الوزرا، ومن تلاميذه الشيخ فخر الدين المقدسي وقاضي مكة برهان الدين بن ظهيرة وقاضيها نور الدين بن أبي اليمن وقاضي المالكية محيي الدين بن تقى والعلامة محيي الدين بن مصيفح، مات ليلة الاثنين وقت أذان العشاء خامس صفر سنة خمس وخمسين وثمانمائة ودفن بالقرافة قريباً من الشمس الأصبهاني {cite:shadharat-dhahab p. 284-285}."
  en: "Ibn al-Munaqib — the Asyuti grammarian who trained a generation (Ibn Fahd of Mecca among his pupils); when Jaqmaq meant to seat him on Egypt's qadiship and sent word through the caliph al-Mustakfi, he refused with a verse: 'sweeter than reaching the vizierate is a day that shows you the viziers' downfall'; died Monday night at the 'isha' call, 5 Safar 855 {cite:shadharat-dhahab p. 284-285}."
  es: "Ibn al-Munaqib, el gramático asyutí que formó a una generación (entre sus alumnos se encontraba Ibn Fahd de La Meca); cuando Jaqmaq quiso nombrarlo cadí de Egipto y envió un mensaje a través del califa al-Mustakfi, se negó con un verso: «Más dulce que llegar al visir es un día que te muestre la caída de los visires»; murió el lunes por la noche a la llamada de «isha», 5 de Safar de 855 {cita: shadharat-dhahab págs. 284-285}."
  fr: "Ibn al-Munaqib — le grammairien asyoute qui a formé une génération (Ibn Fahd de La Mecque parmi ses élèves); lorsque Jaqmaq voulut le nommer cadi d'Égypte et envoya un message par l'intermédiaire du calife al-Mustakfi, il refusa avec un verset: « Plus doux que d'atteindre le vizirat est un jour qui vous montre la chute des vizirs »; mourut lundi soir à l'appel de l'isha, le 5 Safar 855 {cite: shadharat-dhahab p. 284-285}."
  ur: "ابن المناقب - اسیوتی گرامر جس نے ایک نسل کی تربیت کی ⁦(اپنے شاگردوں میں مکہ کا ابن فہد)⁩؛ جب جقمق نے اسے مصر کی قادیانیت پر بٹھانے کا ارادہ کیا اور خلیفہ المستقفی کے ذریعے پیغام بھیجا تو اس نے ایک آیت کے ساتھ انکار کر دیا: 'وزیریت تک پہنچنے سے زیادہ پیارا وہ دن ہے جو آپ کو وزیروں کا زوال دکھاتا ہے'۔ پیر کی رات عشاء کی اذان، 5 صفر 855 میں وفات پائی۔ 284-285}۔"
  tr: "Kamal al-Din İbn el-Manaqib el-Khudairi el-Asyuti el-Şafii; yüzyılın başlarında Assiut'ta doğdu, sonra sekiz yüz yirmi hicri'den sonra Kahire'ye geldi ve dönemin alimlerine eşlik etti; burada iki ilke: Kur'an okumaları, aritmetik, dilbilgisi, morfoloji, anlamlar, kafiye, mantık ve diğerlerinde üstün olana kadar dönemin alimlerine eşlik etti. Öğretim ve fetva yayımlama ile ilgilendi, yazımda uzun bir görev yaptı, yazılan yazının yazısını yazdı ve İbn el-Musannaf'ın Alfiyya açıklamasına iki ciltlik bir tefhi, okumalar üzerine bir kitap, 'al-'Adud' üzerine bir kenar tefhi, İbn el-Maqri'nin rehberliği üzerine bir yorum ve imza sanatı üzerine bir kitap kaleme aldı. Bazı sahabeleri ona, el-Zahir Ceqmaq'ın bir zamanlar Mısır'da hakimleri yargılamayı planladığını ve Halife el-Mustakfi bi-Allah'a 'Yoldaşına babasının yanına gelmesini söyle' diye bir mesaj gönderdiğini söyledi. Halife, babasına haber vermek için bir mesaj gönderdi, ancak babası reddetti ve şöyle dedi: 'Bir gün din adamı güreşçi görmek bir hizmete ulaşmaktan daha güzel.' öğrencileri arasında Mekke'nin hakimi Şeyh Fakhr al-Din al-Maqdisi, yargıcı Nur al-Din ibn Ebi el-Yaman, Maliki yargıcı Muhyiddin bin Taqi ve âlim Muhyiddin bin Musifah vardı. Pazartesi gecesi ezan zamanı vefat etti. El-İşa, sekiz yüz elli beş yılın Safar'inin beşincisidir ve El-Karafa'da, El-Şems el-İsfahani yakınlarında defnedilmiştir {atıf:shadharat-dhahab s. 284-285}."
  id: "Kamal al-Din Ibn al-Manaqib al-Khudairi al-Asyuti al-Shafi'i; lahir pada awal abad di Assiut, ia bekerja di sana, kemudian datang ke Kairo setelah delapan ratus dua puluh H, di mana ia mendampingi para sarjana pada masa itu hingga ia unggul dalam bidang hukum, dua prinsip, pembacaan Al-Quran, aritmatika, tata bahasa, morfologi, makna, rima, logika, dan lainnya. Ia terlibat dalam pengajaran dan penerbitan fatwa, memiliki pengalaman luas dalam menyusun, menulis naskah yang dikaitkan, dan menulis komentar atas penjelasan Alfiyya oleh Ibn al-Musannaf dalam dua jilid, sebuah buku tentang bacaan, komentar marginal tentang 'al-'Adud' dan komentar atas bimbingan Ibn al-Maqri, serta buku tentang seni tanda tangan. Beberapa sahabatnya memberitahunya bahwa al-Zahir Jaqmaq pernah berniat mengadili hakim di Mesir, dan ia mengirim kepada Khalifah al-Mustakfi bi-Allah, berkata, 'Katakan kepada sahabatmu untuk datang kepada ayahnya.' Khalifah mengirim pesan kepada ayahnya untuk memberitahu, tetapi ia menolak sambil melafalkan: 'Dan yang lebih menyenangkan daripada menjadi kementerian adalah suatu hari melihat seorang menteri pegulat.' Di antara murid-muridnya adalah Sheikh Fakhr al-Din al-Maqdisi, hakim Mekah Burhan al-Din ibn Zuhaira, hakimnya Nur al-Din ibn Abi al-Yaman, hakim Maliki Muhyiddin ibn Taqi, dan ulama Muhyiddin ibn Musifah. Ia meninggal pada malam Senin saat panggilan doa. Al-Isha adalah anak kelima Safar pada tahun delapan ratus lima puluh lima, dan ia dimakamkan di Al-Qarafa dekat Al-Shams al-Isfahani {cite:shadharat-dhahab hlm. 284-285}."
