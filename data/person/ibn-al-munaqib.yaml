summary:
  ar: "كمال الدين ابن المناقب الخضيري الأسيوطي الشافعي؛ ولد في أوائل القرن بأسيوط واشتغل بها ثم قدم القاهرة بعد عشرين وثمانمائة فلازم شيوخ العصر إلى أن برع في الفقه والأصلين والقراءات والحساب والنحو والتصريف والمعاني والبيان والمنطق وغير ذلك ولازم التدريس والإفتاء وكان له في الإنشاء اليد الطولى وكتب الخط المنسوب وصنف حاشية على شرح الألفية لابن المصنف حافلة في مجلدين وكتاباً في القراءات وحاشية على العضد وتعليقاً على الإرشاد لابن المقري وكتاباً في صناعة التوقيع، أخبره بعض أصحابه أن الظاهر جقمق عزم مرة على قضاء القضاة بالديار المصرية وأرسل يقول للخليفة المستكفي بالله قل لصاحبك يطلع أوليه فأرسل الخليفة قاصداً إلى الوالد يخبره بذلك فامتنع وأنشد: وألذ من نيل الوزارة أن ترى يوماً يريك مصارع الوزرا، ومن تلاميذه الشيخ فخر الدين المقدسي وقاضي مكة برهان الدين بن ظهيرة وقاضيها نور الدين بن أبي اليمن وقاضي المالكية محيي الدين بن تقى والعلامة محيي الدين بن مصيفح، مات ليلة الاثنين وقت أذان العشاء خامس صفر سنة خمس وخمسين وثمانمائة ودفن بالقرافة قريباً من الشمس الأصبهاني {cite:shadharat-dhahab p. 284-285}."
  en: "Ibn al-Munaqib — the Asyuti grammarian who trained a generation (Ibn Fahd of Mecca among his pupils); when Jaqmaq meant to seat him on Egypt's qadiship and sent word through the caliph al-Mustakfi, he refused with a verse: 'sweeter than reaching the vizierate is a day that shows you the viziers' downfall'; died Monday night at the 'isha' call, 5 Safar 855 {cite:shadharat-dhahab p. 284-285}."
