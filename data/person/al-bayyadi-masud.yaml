died: { edtf: "1173", hijri: "0568", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الثلاثاء سادس عشر ذي القعدة سنة ثمان وستين وخمسمائة ببغداد ودفن بمقبرة باب أبرز {cite:wafayat-ayan}." }
summary:
  ar: "الشريف أبو جعفر مسعود بن عبد العزيز بن المحسن بن الحسن بن عبد الرزاق البياضي؛ شاعر مشهور، إنما قيل له البياضي لأن أحد أجداده كان في مجلس بعض الخلفاء مع جماعة من العباسيين فتميز بكسوة بيضاء؛ وله شعر في تاريخ الدولة السلجوقية {cite:wafayat-ayan}."
  en: "al-Sharif al-Bayyadi (d. 568) — Baghdad's 'white-clad' sharif poet, named for an ancestor who stood out in white among the Abbasids at a caliph's majlis {cite:wafayat-ayan}."
  fr: "Al-Sharif al-Bayyadi (mort en 568 H) — poète chérif de Bagdad « vêtu de blanc », nommé d’après un ancêtre qui se distinguait en blanc parmi les Abbassides dans l’assemblée d’un calife {cite:wafayat-ayan}."
  es: "al-Sharif al-Bayyadi (m. 568) — Poeta sharif 'vestido de blanco' de Bagdad, llamado así por un antepasado que se destacó vestido de blanco entre los abasíes en el majlis de un califa {cite:wafayat-ayan}."
  ur: "الشریف البیادی ⁦(متوفی 568)⁩ - بغداد کا 'سفید پوش' شریف شاعر، جس کا نام ایک آباؤ اجداد کے لیے ہے جو عباسیوں کے درمیان خلیفہ کی مجلس میں سفید پوش کھڑے ہوئے تھے۔"
  tr: "Şerif Ebu Cafer Mesud bin Abdül Aziz bin El-Muhsin bin El-Hasan bin Abdül Razzak El-Bayadi; ünlü bir şairdir. El-Bayadi olarak anılmasının sebebi, atalarından birinin Abbasilerden oluşan bir grup halifenin meclisinde yer alması ve beyaz bir cübbe giymesiyle tanınmasıdır; Selçuklu devleti tarihi üzerine şiirleri bulunmaktadır. {Kaynak: Vefayyat-ı Ayan}"
  id: "Sharif Abu Jaafar Masoud bin Abdul Aziz bin Al-Muhsin bin Al-Hassan bin Abdul Razzaq Al-Bayadi; seorang penyair terkenal. Ia disebut Al-Bayadi karena salah satu leluhurnya berada di dewan beberapa khalifah bersama sekelompok Abbasiyah dan ia dibedakan oleh jubah putihnya; dan ia memiliki puisi tentang sejarah negara Seljuk {cite:wafayat-ayan}."
