  tr: "Al-Muntasir'in kızdığı görkemli bir şarkıcı, bu yüzden onu getirip şarkı söyledi. İmam Muhammed ile olan saltanatım uzun sürdü ve saltanatımın süreceğinden korkmadım {atıf:muruj-al-dhahab, s. 515}."
  id: "Seorang penyanyi mulia yang membuat Al-Muntasir marah, maka ia membawanya dan menyanyikannya. Masa pemerintahan saya bersama Imam Muhammad telah berlangsung lama, dan saya tidak takut bahwa masa pemerintahan saya akan bertahan {cite:muruj-al-dhahab, hlm. 515}."
