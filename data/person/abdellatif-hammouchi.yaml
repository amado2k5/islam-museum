summary:
  ar: "عبد اللطيف الحموشي ⁦(وُلد سنة ١٩٦٦ في تازة)⁩ مسؤول أمني مغربي يرأس في آن واحد المديرية العامة للأمن الوطني والمديرية العامة لمراقبة التراب الوطني منذ ٢٠١٥؛ درس الحقوق في فاس، والتحق بالأجهزة الأمنية سنة ١٩٩٣، وتخصص في تحليل الحركات الإسلامية وشبكات الجهاديين، وتولى مديرية مراقبة التراب الوطني سنة ٢٠٠٥."
  en: "Abdellatif Hammouchi (born 1966 in Taza) is a Moroccan security official who heads both the General Directorate for National Security (DGSN) and the General Directorate for Territorial Surveillance (DGST); a Fez law graduate who joined the security services in 1993, he specialised in analysing Islamist movements and jihadist networks and took over the territorial surveillance directorate in 2005."
  ur: "عبد اللطیف حموشی ⁦(پیدائش 1966، تازہ)⁩ مراکشی سیکیورٹی عہدیدار ہیں جو قومی سلامتی اور علاقائی نگرانی کے دونوں ڈائریکٹوریٹس کے سربراہ ہیں؛ انھوں نے فاس سے قانون پڑھا، 1993 میں سیکیورٹی سروسز میں شامل ہوئے، اسلام پسند تحریکوں کے تجزیے میں مہارت پائی، اور 2005 میں علاقائی نگرانی کی سربراہی سنبھالی۔"
