summary:
  ar: "ابن الحاجب العلامة أبو عمرو عثمان بن عمر بن أبي بكر الكردي الإسناثي وأسنا بليدة صغيرة من أعمال القوصية بالصعيد الأعلى من مصر ولد في أواخر سنة سبعين وخمسمائة بأسنا وكان أبوه حاجباً للأمير عز الدين موسك الصلاحي فاشتغل هو بالقراءات على الشاطي وغيره وبرع في الأصول والعربية وتفقه في مذهب الإمام مالك قال اليافعي وبلغني أنه كان محباً للشيخ عز الدين بن عبد السلام وأن ابن عبد السلام حين حبس بسبب إنكاره على السلطان دخل معه الحبس موافقة ومراعاة وقال ابن خلكان انتقل إلى دمشق ودرس بها في زاوية المالكية وأكب الناس على الاشتغال عليه توفي سنة ست وأربعين وست مئة {cite:shadharat-dhahab p. 234}."
  en: "Ibn al-Hajib, the Kurdish grammarian of Isnā in Upper Egypt — his father chamberlain to the amir Musak; he mastered qira'at, usul and Arabic, and fiqh on Malik's school. When Ibn Abd al-Salam was jailed for denouncing the sultan, Ibn al-Hajib entered the prison with him in solidarity; he later moved to Damascus and taught in the Maliki zawiya to crowded pupils {cite:shadharat-dhahab p. 234}."
  es: "Ibn al-Hajib, el gramático kurdo de Isnā en el Alto Egipto —cuyo padre era chambelán del emir Musak—, dominó la qira'at, el usul y el árabe, así como el fiqh de la escuela de Malik. Cuando Ibn Abd al-Salam fue encarcelado por denunciar al sultán, Ibn al-Hajib entró en prisión con él en señal de solidaridad; posteriormente se trasladó a Damasco y enseñó en la zawiya malikí a un numeroso grupo de alumnos {cite:shadharat-dhahab p. 234}."
  fr: "Ibn al-Hajib, grammairien kurde d'Isnā en Haute-Égypte – fils de chambellan de l'émir Musak –, maîtrisa la qira'at, l'usul, l'arabe et le fiqh à l'école de Malik. Lorsque Ibn Abd al-Salam fut emprisonné pour avoir dénoncé le sultan, Ibn al-Hajib entra en prison avec lui par solidarité. Il s'installa ensuite à Damas et enseigna à la zawiya malikite devant une foule d'élèves (cf. shadharat-dhahab, p. 234)."
  ur: "ابن الحجیب، بالائی مصر میں اسنا کے کرد گرامر - اس کے والد امیر مساک کے چیمبرلین؛ آپ نے قراءت، اصول اور عربی اور مالک کے مکتب میں فقہ میں مہارت حاصل کی۔ جب ابن عبدالسلام کو سلطان کی مذمت کرنے پر جیل بھیج دیا گیا تو ابن الحجیب اس کے ساتھ اظہار یکجہتی کے لیے جیل میں داخل ہوا۔ بعد میں وہ دمشق چلے گئے اور مالکی زاویہ میں ہجوم شاگردوں کو پڑھایا۔ 234}۔"
  tr: "İbn el-Hacib, alim Ebu Amr Osman ibn Ömer ibn Ebi Bekir el-Kurdi el-İsnathi, Mısır'ın üst ovasındaki Qusiya doğumlu genç bir yerliydi. Beş yüz yetmiş yıl geç yılın sonlarında Asna'da doğdu. Babası, Prens İzzeddin Musk el-Salahi'nin koruyucusuydu, bu yüzden kıyıda ve başka yerlerde Kur'an okumalarında çalıştı, prensiplerde ve Arapçada üstün oldu ve İmam Malik'in okulunu okudu. El-Yafii, Şeyh İzzeddin ibn Abdülselam'ı sevdiğini ve İbn Abdülselam sultanı reddettiği için hapse atıldığında onunla birlikte anlaşma ve düşünceyle girdiğini söyledi. İbn Hallikan, Şam'a taşındığını ve orada Maliki Zawiya'da ders verdiğini, halkı kendisi üzerinde çalışmaya adadığını söyledi. 646 Hicri yılında öldü {alıntı:] Shadharat-Dhahab, s. 234}."
  id: "Ibn al-Hajib, ulama Abu Amr Uthman ibn Umar ibn Abi Bakr al-Kurdi al-Isnathi, adalah seorang pemuda asli Qusiya di dataran atas Mesir. Ia lahir pada akhir tahun lima ratus tujuh puluh tahun di Asna. Ayahnya adalah penjaga Pangeran Izz al-Din Musk al-Salahi, sehingga ia bekerja dalam pembacaan Al-Qur'an di pesisir dan tempat lain, unggul dalam prinsip dan bahasa Arab, serta mempelajari aliran Imam Malik. Al-Yafi'i mengatakan bahwa ia mencintai Sheikh Izz al-Din ibn Abd al-Salam, dan ketika Ibn Abd al-Salam dipenjara karena menolak sultan, ia bergabung dengannya sebagai persetujuan dan pertimbangan. Ibn Khallikan mengatakan ia pindah ke Damaskus dan mengajar di sana di Maliki zawiya, mendedikasikan orang-orang untuk bekerja padanya. Ia meninggal pada tahun 646 H {cite::Shadharat-Dhahab, hlm. 234}."
