summary:
  ar: "ابن الحاجب العلامة أبو عمرو عثمان بن عمر بن أبي بكر الكردي الإسناثي وأسنا بليدة صغيرة من أعمال القوصية بالصعيد الأعلى من مصر ولد في أواخر سنة سبعين وخمسمائة بأسنا وكان أبوه حاجباً للأمير عز الدين موسك الصلاحي فاشتغل هو بالقراءات على الشاطي وغيره وبرع في الأصول والعربية وتفقه في مذهب الإمام مالك قال اليافعي وبلغني أنه كان محباً للشيخ عز الدين بن عبد السلام وأن ابن عبد السلام حين حبس بسبب إنكاره على السلطان دخل معه الحبس موافقة ومراعاة وقال ابن خلكان انتقل إلى دمشق ودرس بها في زاوية المالكية وأكب الناس على الاشتغال عليه توفي سنة ست وأربعين وست مئة {cite:shadharat-dhahab p. 234}."
  en: "Ibn al-Hajib, the Kurdish grammarian of Isnā in Upper Egypt — his father chamberlain to the amir Musak; he mastered qira'at, usul and Arabic, and fiqh on Malik's school. When Ibn Abd al-Salam was jailed for denouncing the sultan, Ibn al-Hajib entered the prison with him in solidarity; he later moved to Damascus and taught in the Maliki zawiya to crowded pupils {cite:shadharat-dhahab p. 234}."
