summary:
  ar: "تنوهي عاصر أبا موسى الأشعري، حين حدثه أبو موسى قبل صفين أن هذه الأمة ستبعث حكمين قال له إياك إن أدركت ذلك الزمان أن تكون أحد الحكمين، فكان أبو موسى يخلع قميصه ويقول لا جعل الله لي في السماء مصعداً ولا في الأرض مقعداً، فلقيه بعد ذلك فذكره بمقالته فقال سل ربك العافية {cite:muruj-al-dhahab p. 683}."
  en: "The Tamimi who warned Abu Musa against ever sitting as one of the two arbitrators — and whose reminder years later drew the evasive 'ask your Lord for wellbeing' {cite:muruj-al-dhahab p. 683}."
  es: "El Tamimi que advirtió a Abu Musa que nunca se sentara como uno de los dos árbitros, y cuyo recordatorio años después provocó la evasiva respuesta de \"pide a tu Señor por tu bienestar\" {cite:muruj-al-dhahab p. 683}."
  fr: "Le Tamimi qui avait mis en garde Abu Musa contre le fait de siéger comme l'un des deux arbitres — et dont le rappel des années plus tard a suscité l'évasive réponse « demandez à votre Seigneur le bien-être » {cite:muruj-al-dhahab p. 683}."
  ur: "وہ تمیمی جس نے ابو موسیٰ کو دو ثالثوں میں سے ایک کے طور پر بیٹھنے کے خلاف خبردار کیا تھا - اور جس کی یاددہانی سالوں بعد 'اپنے رب سے عافیت مانگو' کی طرف متوجہ ہوئی 683}۔"
