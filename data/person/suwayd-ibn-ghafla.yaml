summary:
  ar: "تنوهي عاصر أبا موسى الأشعري، حين حدثه أبو موسى قبل صفين أن هذه الأمة ستبعث حكمين قال له إياك إن أدركت ذلك الزمان أن تكون أحد الحكمين، فكان أبو موسى يخلع قميصه ويقول لا جعل الله لي في السماء مصعداً ولا في الأرض مقعداً، فلقيه بعد ذلك فذكره بمقالته فقال سل ربك العافية {cite:muruj-al-dhahab p. 683}."
  en: "The Tamimi who warned Abu Musa against ever sitting as one of the two arbitrators — and whose reminder years later drew the evasive 'ask your Lord for wellbeing' {cite:muruj-al-dhahab p. 683}."
