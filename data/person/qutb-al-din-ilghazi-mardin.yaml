id: person/qutb-al-din-ilghazi-mardin
class: person
label: { ar: "قطب الدين أيلغازي صاحب ماردين", en: "Qutb al-Din Ilghazi of Mardin", es: "Qutb al-Din Ilghazi of Mardin", fr: "Qutb al-Din Ilghazi of Mardin", ur: "ماردین کے قطب الدین الغازی" }
summary:
  ar: "قطب الدين أيلغازي بن نجم الدين بن ألبي بن تمرتاش بن أيلغازي بن أرتق صاحب ماردين؛ توفي سنة ثمانين وخمسمائة وملك بعده ابنه حسام الدين بولق أرسلان وهو طفل، فقام بتربيته وتدبير مملكته نظام الدين البقش مملوكه، وكان شاه أرمن صاحب خلاط خاله فحكم في دولته وهو الذي رتب البقش مع ولده {cite:kamil-ibn-al-athir p. 129}."
  en: "The Artuqid lord of Mardin — died 580 leaving the child Husam al-Din Yuluq Arslan, whom his own mamluk Nizam al-Din al-Baqish raised and ruled for under the guardianship of the boy's maternal uncle Shah-Arman of Khilat {cite:kamil-ibn-al-athir p. 129}."
  es: "El señor artúquida de Mardin murió en 580, dejando al niño Husam al-Din Yuluq Arslan, a quien su propio mameluco Nizam al-Din al-Baqish crió y gobernó bajo la tutela del tío materno del niño, Shah-Arman de Khilat {cite:kamil-ibn-al-athir p. 129}."
  fr: "Le seigneur artouqid de Mardin — mourut en 580 laissant l'enfant Husam al-Din Yuluq Arslan, que son propre mamelouk Nizam al-Din al-Baqish éleva et gouverna sous la tutelle de l'oncle maternel du garçon, Shah-Arman de Khilat {cite:kamil-ibn-al-athir p. 129}."
  ur: "ماردین کے آرتوقید آقا - کا انتقال 580 میں ہوا جس میں بچہ حسام الدین یولق ارسلان تھا، جسے اس کے اپنے مملوک نظام الدین البقیش نے پالا اور اس لڑکے کے ماموں شاہ ارمان خلعت کی سرپرستی میں حکومت کی۔ 129}۔"
  tr: "Qutb al-Din İlghazi ibn Najm al-Din ibn Albi ibn Tamartaş ibn İlghazi ibn Artuq, Mardin'in hükümdarı; 580 Hicri yılında öldü. Çocukken yerine oğlu Hussam al-Din Bulaq Arslan geçti. Krallığı memlükleri Nizam al-Din al-Baqsh tarafından büyütüldü ve yönetildi. Bir Ermeni Şahı ve amcasının karıştırıcı çiftliğinin sahibiydi, bu yüzden devletini yönetti ve oğluyla el-Baqsh'u ayarlayan oydu {cite:kamil-ibn-al-athir, s. 129}."
  id: "Qutb al-Din Ilghazi ibn Najm al-Din ibn Albi ibn Tamartash ibn Ilghazi ibn Artuq, penguasa Mardin; ia meninggal pada tahun 580 H. Ia digantikan oleh putranya Hussam al-Din Bulaq Arslan saat masih anak-anak. Ia dibesarkan dan kerajaannya dikelola oleh Nizam al-Din al-Baqsh, mamluknya. Ia adalah Shah Armenia dan pemilik tempat percampuran pamannya, sehingga ia memerintah negaranya, dan dialah yang mengatur al-Baqsh bersama putranya {cite:kamil-ibn-al-athir, hlm. 129}."
