  ar: "قطب الدين أيلغازي بن نجم الدين بن ألبي بن تمرتاش بن أيلغازي بن أرتق صاحب ماردين؛ توفي سنة ثمانين وخمسمائة وملك بعده ابنه حسام الدين بولق أرسلان وهو طفل، فقام بتربيته وتدبير مملكته نظام الدين البقش مملوكه، وكان شاه أرمن صاحب خلاط خاله فحكم في دولته وهو الذي رتب البقش مع ولده {cite:kamil-ibn-al-athir p. 129}."
