summary:
  ar: "اسمه زيد بن كلاب، سمي قصياً لأنه نشأ بعيداً عن مكة؛ جمع قريشاً من شعثها فلقب مجمعاً، وملك أمر مكة والكعبة على خزاعة، وأول من سن لقريش دار الندوة والحجابة والسقاية والرفادة والإيفاد واللواء {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/109-125} {cite:tarikh-al-tabari}."
  en: "His name was Zayd ibn Kilab; he was called Qusayy ('far away') because he grew up far from Mecca. He gathered scattered Quraysh — hence 'al-Mujammi' (the Gatherer) — took the rule of Mecca and the Ka'ba from Khuza'a, and was the first to institute for Quraysh the Dar al-Nadwa, the hijaba, the siqaya, the rifada, the ifada and the liwa {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/109-125} {cite:tarikh-al-tabari}."
