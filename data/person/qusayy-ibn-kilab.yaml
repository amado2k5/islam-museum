summary:
  en: "The Qahtani-raised Qurashi who returned to Mecca, married Hulayl’s daughter Hubba, took the custody of the Kaaba from Khuzaʾa around 440 CE after the arbitration of Yaʾmar ibn Awf, gathered Quraysh into the town’s quarters, founded Dar al-Nadwa, and held the five offices: riyasa, liwa, hijaba, siqaya and rifada."
  ar: "القرشي الذي نشأ في بلاد قضاعة بأطراف الشام ثم عاد إلى مكة وتزوج حُبّى بنت هليل، واستلب ولاية البيت من خزاعة نحو سنة 440م بعد تحكيم يعمر بن عوف، فجمع قريشاً في مكة، وأسس دار الندوة، وكانت له مناصب الرياسة واللواء والحجابة والسقاية والرفادة."
  es: "El Quraysh criado en Qahtani que regresó a La Meca, se casó con Hubba, la hija de Hulayl, tomó la custodia de la Kaaba de Khuzaʾa alrededor del año 440 d. C. después del arbitraje de Yaʾmar ibn Awf, reunió a los Quraysh en los barrios de la ciudad, fundó Dar al-Nadwa y ocupó los cinco cargos: riyasa, liwa, hijaba, siqaya y rifada."
  fr: "Les Qurashi élevés par les Qahtani qui retournèrent à La Mecque, épousèrent Hubba, la fille de Hulayl, prirent la garde de la Kaaba de Khuzaʾa vers 440 après l'arbitrage de Yaʾmar ibn Awf, rassemblèrent les Quraysh dans les quartiers de la ville, fondèrent Dar al-Nadwa et occupèrent les cinq offices: riyasa, liwa, hijaba, siqaya et rifada."
  ur: "قحطانی نسل کے قریشی جو مکہ واپس آئے، انہوں نے حلیل کی بیٹی ہبہ سے شادی کی، یمر بن عوف اور رفدہ کی ثالثی کے بعد 440 عیسوی کے قریب خزاعہ سے کعبہ کی حفاظت کی۔"
