summary:
  en: "The Qahtani-raised Qurashi who returned to Mecca, married Hulayl’s daughter Hubba, took the custody of the Kaaba from Khuzaʾa around 440 CE after the arbitration of Yaʾmar ibn Awf, gathered Quraysh into the town’s quarters, founded Dar al-Nadwa, and held the five offices: riyasa, liwa, hijaba, siqaya and rifada."
  ar: "القرشي الذي نشأ في بلاد قضاعة بأطراف الشام ثم عاد إلى مكة وتزوج حُبّى بنت هليل، واستلب ولاية البيت من خزاعة نحو سنة 440م بعد تحكيم يعمر بن عوف، فجمع قريشاً في مكة، وأسس دار الندوة، وكانت له مناصب الرياسة واللواء والحجابة والسقاية والرفادة."
