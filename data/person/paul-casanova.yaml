summary:
  ar: "مستشرق فرنسي درّس العربية وآدابها في الكوليج دي فرانس ثم في الجامعة المصرية، وألّف «محمد ونهاية العالم» {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 78}. ينسب إليه غلاب في هذا الكتاب أطروحة أن القرآن تغيّر بعد وفاة النبي، وأن النبي كان يظن قرب قيام الساعة، ويعرض غلاب أدلته ويناقشها فصلاً فصلاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79}. ينقل كازانوفا عن مقدمة ابن خلدون في مسألة الإمامة، ويعلّق عليه غلاب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92}. هذا وصف لعرض غلاب لأطروحة الكتاب، وليس حكماً على الرجل."
  tr: "Collège de France'ta ve ardından Mısır Üniversitesi'nde Arapça ve edebiyatı üzerine çalışmış ve \"Muhammed ve Dünyanın Sonu\" adlı kitabı yazmıştır. el-islam-kama-yarahu-al-urubiyyun-azhar, s. 78}. Ghallab, bu kitapta kendisine bir tez atfeder: Kur'an, Peygamber'in ölümünden sonra değişti ve Peygamber, Saatin yakın olduğunu düşündü. Ghallab, kanıtlarını bölüm bölüm sunar ve tartışır {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 79}. Casanova, İmmat meselesiyle ilgili İbn Haldun'un girişinden alıntı yapar ve Ghallab buna yorum yapar {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 92}. Bu, Ghallab'ın kitabın tezini sunuşunun bir tanımıdır, insana bir yargı olarak değil."
  id: "Seorang orientalis Prancis yang mempelajari bahasa Arab dan sastranya di Collège de France dan kemudian di Universitas Mesir, serta menulis \"Muhammad and the End of the World\" {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 78}. Ghallab mengaitkan dalam buku ini dengan tesis bahwa Al-Qur'an berubah setelah wafatnya Nabi, dan bahwa Nabi mengira Jam itu sudah dekat. Ghallab menyajikan dan membahas buktinya bab demi bab {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 79}. Casanova mengutip dari pengantar Ibn Khaldin tentang isu Imamat, dan Ghallab mengomentari hal itu {cite:al-islam-kama-yarahu-al-urubiyyun-azhar}. Ini adalah deskripsi tentang penyajian Ghallab atas tesis buku tersebut, bukan sebagai penilaian terhadap pria tersebut."
