summary:
  ar: "مستشرق فرنسي درّس العربية وآدابها في الكوليج دي فرانس ثم في الجامعة المصرية، وألّف «محمد ونهاية العالم» {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 78}. ينسب إليه غلاب في هذا الكتاب أطروحة أن القرآن تغيّر بعد وفاة النبي، وأن النبي كان يظن قرب قيام الساعة، ويعرض غلاب أدلته ويناقشها فصلاً فصلاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 79}. ينقل كازانوفا عن مقدمة ابن خلدون في مسألة الإمامة، ويعلّق عليه غلاب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 92}. هذا وصف لعرض غلاب لأطروحة الكتاب، وليس حكماً على الرجل."
