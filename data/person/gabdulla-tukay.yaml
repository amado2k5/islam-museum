summary:
  ar: "شاعر وناقد وناشر تتاري (1886–1913)، يُعد مؤسس الأدب التتري الحديث واللغة الأدبية التترية الحديثة. تيتم طفلا وتنقل بين بيوت كفلاء، وتشكّل في مدرسة موتيغيا بأورالسك، وصار الصوت الأبرز في صحافة قازان التترية، وتوفي بالسل في قازان في السادسة والعشرين؛ وقصيدته «توغان تل» هي النشيد غير الرسمي للغة التترية."
  en: "Tatar poet, critic and publisher (1886–1913), regarded as the founder of modern Tatar literature and of the modern Tatar literary language. Orphaned in infancy and passed between foster homes, he was formed at the Motıyğiya madrasa in Uralsk, became the leading voice of Kazan's Tatar press, and died of tuberculosis at Kazan aged twenty-six; his poem 'Tuğan tel' is the unofficial hymn of the Tatar language."
  ur: "تاتاری شاعر، نقاد اور ناشر (1886–1913)، جنہیں جدید تاتاری ادب اور جدید تاتاری ادبی زبان کا بانی سمجھا جاتا ہے۔ بچپن میں یتیم ہوئے اور کئی سرپرست گھروں میں پلے، اورالسک کے مدرسہ موتیغیہ میں تربیت پائی، قازان کی تاتاری صحافت کی نمایاں ترین آواز بنے، اور 26 برس کی عمر میں قازان میں تپ دق سے انتقال کیا؛ ان کی نظم «توغان تل» تاتاری زبان کا غیر سرکاری ترانہ ہے۔"
