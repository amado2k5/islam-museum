summary:
  ar: "مدرب دعوة أمريكي ومحاضر في معهد المغرب، لُقّب بـ«الحزام الأسود في الدعوة» واشتهر بورشته «كيف تُدخل شخصًا في الإسلام في عشر دقائق» الموجهة لجمعيات الطلاب المسلمين ومنظمات الدعوة، وكان إمامًا ومرسّخًا مسلمًا في جامعة جورج ماسون في فرجينيا. تستهدف محاضراته وفيديوهاته على الإنترنت قضايا معاصرة، وقد أثارت بعض مواقفه جدلًا عامًا في أيرلندا سنة 2015."
  en: "An American dawah trainer and AlMaghrib Institute instructor dubbed the 'Black Belt of Dawah', best known for his workshop 'How to Give Shahadah in 10 Minutes', aimed at Muslim student associations and dawah organisations, and formerly a Muslim chaplain and imam at George Mason University in Virginia. His lectures and online videos address contemporary issues, and some of his positions drew public controversy in Ireland in 2015."
  ur: "امریکی دعوتی تربیت کار اور المغرب انسٹیٹیوٹ کے استاد، جنہیں «دعوت کا بلیک بیلٹ» کہا جاتا ہے؛ وہ اپنی ورکشاپ «دس منٹ میں شہادت کیسے دلائیں» کے لیے مشہور ہیں جو مسلم طلبہ انجمنوں اور دعوتی تنظیموں کے لیے ہے، اور وہ ورجینیا کی جارج میسن یونیورسٹی میں مسلمان چیپلن اور امام رہ چکے ہیں۔ ان کے لیکچرز اور آن لائن ویڈیوز عصری مسائل پر ہوتے ہیں۔"
