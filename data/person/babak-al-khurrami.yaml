label: { ar: "بابك الخرمي" }
summary:
  ar: "ذكر الطبري قتله على يد المعتصم وأن الأفشين قدم به مع المعتصم في سنة ثلاث وعشرين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.670} {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. وحكى واقد بن عمرو التميمي في الفهرست مبدأ أمره: أن أباه رجل من أهل المدائن دهان نزع إلى ثغر أذربيجان فهوى امرأة عوراء هي أم بابك فزوجه أبوها إياها فأولدها بابكا ثم قتل في سفرة إلى جيلان، وأنه صار مع الشبل بن المنقذ الأزدي ثم مع محمد بن الرواد الأزدي بتبريز نحو سنتين ثم رجع وله ثمان عشرة سنة، وأن امرأة جاويدان بن سهرك كانت تتعشق بابكا فلما مات جاويدان جمعت جيشه إليه وروجت أن روح جاويدان دخلت بدن بابك وأنه سيملك الأرض ويقتل الجبابرة ويرد المزدكية، فبسطت جلد بقرة وصيرت عليه طستا مملوءا خمرا وكسرت فيه خبزا ثم دعت برجل رجل فطأ الجلد برجله وأخذ كسرة فغمسها في الخمر وكلها وقال آمنت بك يا روح بابك كما آمنت بروح جاويدان وأخذت بيد بابك فكفروا عليها وقبلوها، فكان ذلك تزويجهم ودخولهم في دينه {cite:fihrist-ibn-al-nadim p. 480-482}"
