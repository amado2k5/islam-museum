summary:
  ar: "ذكر الطبري قتله على يد المعتصم وأن الأفشين قدم به مع المعتصم في سنة ثلاث وعشرين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.670} {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. وحكى واقد بن عمرو التميمي في الفهرست مبدأ أمره: أن أباه رجل من أهل المدائن دهان نزع إلى ثغر أذربيجان فهوى امرأة عوراء هي أم بابك فزوجه أبوها إياها فأولدها بابكا ثم قتل في سفرة إلى جيلان، وأنه صار مع الشبل بن المنقذ الأزدي ثم مع محمد بن الرواد الأزدي بتبريز نحو سنتين ثم رجع وله ثمان عشرة سنة، وأن امرأة جاويدان بن سهرك كانت تتعشق بابكا فلما مات جاويدان جمعت جيشه إليه وروجت أن روح جاويدان دخلت بدن بابك وأنه سيملك الأرض ويقتل الجبابرة ويرد المزدكية، فبسطت جلد بقرة وصيرت عليه طستا مملوءا خمرا وكسرت فيه خبزا ثم دعت برجل رجل فطأ الجلد برجله وأخذ كسرة فغمسها في الخمر وكلها وقال آمنت بك يا روح بابك كما آمنت بروح جاويدان وأخذت بيد بابك فكفروا عليها وقبلوها، فكان ذلك تزويجهم ودخولهم في دينه {cite:fihrist-ibn-al-nadim p. 480-482}. وتؤرخ الموسوعة الإسلامية بدء نشاطه نحو 201هـ/816-817م، ووصول الأفشين بالحملة إلى سامراء في 223هـ/838م {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  en: "Head of the Khurrami movement in Adharbayjan, who revolted from about 201/816-7 from al-Badhdh; al-Afshin took the fortress in 222/837, and Babak was executed at Samarra in 223/838 {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  ur: "آذربائیجان میں خرمی تحریک کے سربراہ، جنہوں نے تقریباً 201ھ/816-817ء میں البذ سے بغاوت کی؛ افشین نے 222ھ/837ء میں قلعہ فتح کیا اور بابک کو 223ھ/838ء میں سامرہ میں قتل کیا گیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}۔"
  es: "Jefe del movimiento Khurrami en Adharbayjan, quien se rebeló alrededor del 201/816-7 de al-Badhdh; al-Afshin tomó la fortaleza en 222/837, y Babak fue ejecutado en Samarra en 223/838 {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  fr: "Chef du mouvement Khurrami à Adharbayjan, qui s'est révolté vers 201/816-7 contre al-Badhdh; al-Afshin a pris la forteresse en 222/837, et Babak a été exécuté à Samarra en 223/838 {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  tr: "Al-Taberi, Al-Mu'tasim tarafından öldürüldüğünü ve Al-Afshin'in 223 Hicri yılında Al-Mu'tasim ile birlikte getirildiğini belirtmiştir {atıf:tabari-tarikh-abu-al-fadl J.9 s.670} {cite:tabari-tarikh-abu-al-fadl j.9 s.57}. Vakıd bin Amr el-Temimi, El-Fihrist'te olayının kökenini anlatmıştır: babasının Mada'in Dahan halkından bir adam olduğunu, Azerbaycan sınırına seyahat ettiğini ve Um Babak adında Awra adlı bir kadına aşık olduğunu anlatmıştır. Babası onu onunla evlendirmiş, babası Babaka'yı doğurmuş, ardından Jilan'a yaptığı yolculukta öldürülmüştür. Yaklaşık iki yıl Şibl ibn al-Munqidh al-Azdi ile, ardından yaklaşık iki yıl Tebriz'de Muhammed bin el-Ruwad al-Azdi ile birlikte geçirmiş, ardından on sekiz yaşında geri dönmüştür. Jawidan ibn Sahrak'ın eşi Babaka'ya aşıktı, bu yüzden Jawidan öldüğünde ordusu ona karşı toplandı ve bu durumu yaydı Jawidan ruhu kapının bedenine girdi, dünyaya hükmedeceğini, zalimleri öldüreceğini ve Mazdakiyah'ı püskürteceğini iddia etti. Böylece bir ineğin derisini açtın, bir kase şarap yaptın, ekmek kestin, sonra bir adamı çağırdın, o da deriyi ayağıyla aldı, bir parça aldı, şaraba batırdı ve hepsini yaptı, 'Sana inanıyorum, ey kapının ruhu, tıpkı Javidan'ın ruhuna inandığım gibi.' dedi. Kapının elini tuttum, onlar buna inanmadılar ve kabul ettiler. Bu onların evliliği ve onun dinine girişleriydi {cite:Fihrist-ibn-al-nadim s. 480-482}. İslami Ansiklopedi, faaliyetlerinin başlangıcını 201 Hicri / 816-817 M.S. civarına ve Afshin'in 223 Hicri / 838 M.S. Samarra seferiyle gelişine tarihlendirir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 901-902}."
  id: "Al-Tabari menyebutkan pembunuhannya oleh Al-Mu'tasim dan bahwa Al-Afshin dibawa bersama Al-Mu'tasim pada tahun 223 HH. {cite:tabari-tarikh-abu-al-fadl J.9 hlm.670} {cite:tabari-tarikh-abu-al-fadl j.9 hlm.57}. Waqid ibn Amr al-Tamimi menceritakan dalam Al-Fihrist asal mula masalahnya: bahwa ayahnya adalah seorang pria dari masyarakat Mada'in Dahan yang melakukan perjalanan ke perbatasan Azerbaijan dan jatuh cinta pada seorang wanita bernama Awra, yang bernama um Babak. Ayahnya menikahkan wanita itu kepadanya, dan ia melahirkan Babaka, lalu dibunuh dalam perjalanan ke Jilan. Ia menghabiskan sekitar dua tahun bersama Shibl ibn al-Munqidh al-Azdi, kemudian bersama Muhammad ibn al-Ruwad al-Azdi di Tabriz selama sekitar dua tahun, lalu kembali pada usia delapan belas tahun. Istri Jawidan ibn Sahrak jatuh cinta pada Babaka, sehingga ketika Jawidan meninggal, pasukannya berkumpul melawannya dan menyebarkan bahwa Roh Jawidan masuk ke dalam tubuh pintumu, mengklaim bahwa dia akan menguasai bumi, membunuh para tiran, dan mengusir Mazdakiyah. Jadi kamu membentangkan kulit sapi, membuat mangkuk penuh anggur, memecahkan roti di dalamnya, lalu memanggil seorang pria, dan dia mengambil kulit itu dengan kakinya, mengambil sepotong, mencelupkannya ke dalam anggur, dan semuanya, sambil berkata, 'Aku percaya padamu, wahai roh pintumu, seperti aku percaya pada roh Javidan.' Aku menggenggam tangan pintumu, dan mereka tidak percaya dan menerimanya. Itulah pernikahan mereka dan masuknya mereka ke agamanya {cite:fihrist-ibn-al-nadim hlm. 480-482}. Ensiklopedia Islam mencatat awal aktivitasnya sekitar tahun 201 H / 816-817 M, dan kedatangan Afshin dengan kampanye ke Samarra pada tahun 223 H / 838 M {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 901-902}."
