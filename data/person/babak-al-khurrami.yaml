summary:
  ar: "ذكر الطبري قتله على يد المعتصم وأن الأفشين قدم به مع المعتصم في سنة ثلاث وعشرين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.670} {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. وحكى واقد بن عمرو التميمي في الفهرست مبدأ أمره: أن أباه رجل من أهل المدائن دهان نزع إلى ثغر أذربيجان فهوى امرأة عوراء هي أم بابك فزوجه أبوها إياها فأولدها بابكا ثم قتل في سفرة إلى جيلان، وأنه صار مع الشبل بن المنقذ الأزدي ثم مع محمد بن الرواد الأزدي بتبريز نحو سنتين ثم رجع وله ثمان عشرة سنة، وأن امرأة جاويدان بن سهرك كانت تتعشق بابكا فلما مات جاويدان جمعت جيشه إليه وروجت أن روح جاويدان دخلت بدن بابك وأنه سيملك الأرض ويقتل الجبابرة ويرد المزدكية، فبسطت جلد بقرة وصيرت عليه طستا مملوءا خمرا وكسرت فيه خبزا ثم دعت برجل رجل فطأ الجلد برجله وأخذ كسرة فغمسها في الخمر وكلها وقال آمنت بك يا روح بابك كما آمنت بروح جاويدان وأخذت بيد بابك فكفروا عليها وقبلوها، فكان ذلك تزويجهم ودخولهم في دينه {cite:fihrist-ibn-al-nadim p. 480-482}. وتؤرخ الموسوعة الإسلامية بدء نشاطه نحو 201هـ/816-817م، ووصول الأفشين بالحملة إلى سامراء في 223هـ/838م {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  en: "Head of the Khurrami movement in Adharbayjan, who revolted from about 201/816-7 from al-Badhdh; al-Afshin took the fortress in 222/837, and Babak was executed at Samarra in 223/838 {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}."
  ur: "آذربائیجان میں خرمی تحریک کے سربراہ، جنہوں نے تقریباً 201ھ/816-817ء میں البذ سے بغاوت کی؛ افشین نے 222ھ/837ء میں قلعہ فتح کیا اور بابک کو 223ھ/838ء میں سامرہ میں قتل کیا گیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 901-902}۔"
