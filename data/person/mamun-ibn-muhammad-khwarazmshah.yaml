summary:
  ar: "أمير الجرجانية التابع للسامانيين، أسر آخر الأفريغيين في كاث سنة 385هـ/995م وقتله، وتلقب بخوارزمشاه، وضرب سنة 387هـ أول درهم يحمل اسم مأمون {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 70}."
  en: "Samanid-dependent emir of Jurjaniyya who captured and killed the last Afrighid at Kath in 385/995, took the title Khwarazmshah, and in 387 AH struck the first dirham bearing the name Ma'mun {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 70}."
  ur: "جرجانیہ کے سامانی ماتحت امیر جنہوں نے 385ھ/995ء میں کاث میں آخری آفریغی کو گرفتار کر کے قتل کیا، خوارزم شاہ کا لقب لیا، اور 387ھ میں مامون نام والا پہلا درہم ڈھالا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 70}۔"
