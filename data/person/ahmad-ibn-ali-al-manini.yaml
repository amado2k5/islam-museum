summary:
  ar: "أحمد بن علي بن عمر بن صالح، شهاب الدين أبو النجاح المنيني، أديب من علماء دمشق، مولده في منين ومنشأه ووفاته في دمشق، له الفتح الوهبي في شرح تاريخ العتبي والإعلام بفضائل الشام؛ ١٠٨٩ إلى ١١٧٢هـ الموافقة ١٦٧٨ إلى ١٧٥٩م."
  en: "Ahmad ibn Ali ibn Umar ibn Salih, Shihab al-Din Abu al-Najah al-Manini, a man of letters among the scholars of Damascus, born at Manin, raised and deceased in Damascus, author of al-Fath al-Wahbi, a commentary on the history of al-Utbi, and al-I'lam bi Fada'il al-Sham; 1089 to 1172 AH, equal to 1678 to 1759 CE."
