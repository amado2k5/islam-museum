id: person/al-numan-ibn-muqarrin
class: person
label: { ar: "النعمان بن مقرن", en: "al-Nu'man ibn Muqarrin" }
summary:
  ar: "النعمان بن عمرو بن مقرن المزني؛ عند البلاذري كان عاملاً على كسكر وناحيتها ويقال كان بالمدينة فولاه عمر أمر جيش نهاوند وقال له أما إني سأستعملك فقال أما جابياً فلا ولكن غازياً قال فأنت غاز وكتب إليه إن أصبت فالأمير حذيفة بن اليمان فإن أصيب فجرير بن عبد الله فإن أصيب فالمغيرة بن شعبة فإن أصيب فالأشعث بن قيس وكان معه السائب بن الأقرع الثقفي. وقال في حملته بنهاوند إني هازّ لوائي ثلاث مرات فأولها لقضاء الحاجة وثانيها لشد الشسع ولزوم السلاح فإذا هززت الثالثة فاحملوا ولا يلوين أحد على أحد وإن قتل النعمان وإني داعٍ الله بدعوة اللهم ارزق النعمان اليوم شهادة في نصر وفتح عليهم فكان أول صريع وسفطه فيه كتاب خلفائه واحداً فواحداً {cite:muruj-al-dhahab p. 618-619}"
  en: "al-Nu'man ibn Amr ibn Muqarrin al-Muzani; in al-Baladhuri governor over Kaskar and its district — or at Medina — when Umar gave him the Nihawand army: 'I am employing you' — 'not as a tax-gatherer, but as a ghazi' — 'a ghazi, then'; the succession letter ran Hudhayfa ibn al-Yaman, then Jarir, then al-Mughira, then al-Ash'ath ibn Qays, with al-Sa'ib ibn al-Aqra' al-Thaqafi beside him."
