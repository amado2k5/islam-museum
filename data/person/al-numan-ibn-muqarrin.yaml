summary:
  ar: "النعمان بن عمرو بن مقرن المزني؛ عند البلاذري كان عاملاً على كسكر وناحيتها ويقال كان بالمدينة فولاه عمر أمر جيش نهاوند وقال له أما إني سأستعملك فقال أما جابياً فلا ولكن غازياً قال فأنت غاز وكتب إليه إن أصبت فالأمير حذيفة بن اليمان فإن أصيب فجرير بن عبد الله فإن أصيب فالمغيرة بن شعبة فإن أصيب فالأشعث بن قيس وكان معه السائب بن الأقرع الثقفي. وقال في حملته بنهاوند إني هازّ لوائي ثلاث مرات فأولها لقضاء الحاجة وثانيها لشد الشسع ولزوم السلاح فإذا هززت الثالثة فاحملوا ولا يلوين أحد على أحد وإن قتل النعمان وإني داعٍ الله بدعوة اللهم ارزق النعمان اليوم شهادة في نصر وفتح عليهم فكان أول صريع وسفطه فيه كتاب خلفائه واحداً فواحداً {cite:muruj-al-dhahab p. 618-619}"
  en: "al-Nu'man ibn Amr ibn Muqarrin al-Muzani; in al-Baladhuri governor over Kaskar and its district — or at Medina — when Umar gave him the Nihawand army: 'I am employing you' — 'not as a tax-gatherer, but as a ghazi' — 'a ghazi, then'; the succession letter ran Hudhayfa ibn al-Yaman, then Jarir, then al-Mughira, then al-Ash'ath ibn Qays, with al-Sa'ib ibn al-Aqra' al-Thaqafi beside him."
  fr: "al-Nu'man ibn Amr ibn Muqarrin al-Muzani ; dans al-Baladhuri gouverneur sur Kaskar et son district - ou à Médine - quand Umar lui a donné l'armée Nihawad : « Je vous emploie » - « pas comme un collecteur d'impôts, mais comme un ghazi' - 'un ghazi, alors' ; la lettre de succession a couru Hudhayfa ibn al-Yaman, puis Jarir, puis al-Mughira, puis al-Ash'ath ibn Qays, avec al-Sa'ib ibn al-Aqra' al-Thaqafi à ses côtés."
  es: "al-Nu'man ibn Amr ibn Muqarrin al-Muzani; en al-Baladhuri, gobernador de Kaskar y su distrito, o de Medina, cuando Umar le entregó el ejército de Nihawand: \"Te estoy empleando\" - \"no como recaudador de impuestos, sino como ghazi\" - \"un ghazi, entonces\"; la carta de sucesión decía Hudhayfa ibn al-Yaman, luego Jarir, luego al-Mughira, luego al-Ash'ath ibn Qays, con al-Sa'ib ibn al-Aqra' al-Thaqafi a su lado."
  ur: "النعمان بن عمرو بن مقرن المزانی؛ کاسکر اور اس کے ضلع پر البلادھوری گورنری میں — یا مدینہ میں — جب عمر نے اسے نہاوند کی فوج دی: 'میں تمہیں ملازمت دے رہا ہوں' - 'ٹیکس جمع کرنے والے کے طور پر نہیں، بلکہ ایک غازی کے طور پر' - 'ایک غازی، پھر'؛ جانشینی کا خط حذیفہ بن الیمان، پھر جریر، پھر المغیرہ، پھر اشعث بن قیس، ان کے ساتھ سائب بن الاقراء الثقفی کے ساتھ تھا۔"
