summary:
  ar: "زائدة بن قدامة الثقفي من أنفسهم ويكنى أبا الصلت مات بالروم في غزاة الحسن بن عطية سنة إحدى وستين أو اثنتين وستين ومائة وله كتاب السنن وكتاب القراءات وكتاب التفسير وكتاب الزهد وكتاب المناقب {cite:fihrist-ibn-al-nadim p. 316}."
  en: "Zaida ibn Qudama — died on campaign in Byzantine territory {cite:fihrist-ibn-al-nadim}"
  es: "Zaida ibn Qudama — murió en campaña en territorio bizantino {cite:fihrist-ibn-al-nadim}"
  fr: "Zaida ibn Qudama — mort en campagne en territoire byzantin {cite:fihrist-ibn-al-nadim}"
  ur: "زیدہ ابن قدامہ - بازنطینی علاقے میں مہم کے دوران انتقال کر گئے"
  tr: "Kendi aralarında Zeyde bin Kudəme el-Tekafi, Ebu al-Salt olarak bilinen, 161 Hicri veya 162 Hicri yılında el-Hasan ibn Atiyye'nin akınları sırasında Romalılarda öldü. Sünen Kitabı, Kur'an Okumaları Kitabı, Tefsir Kitabı, Asketizm Kitabı ve Erdemler Kitabı'nı (atı:fihrist-ibn-al-nadim s. 316} yazdı."
  id: "Zaidah ibn Qudamah al-Thaqafi di antara mereka sendiri, yang dikenal sebagai Abu al-Salt, meninggal di masa Romawi selama serangan al-Hasan ibn Atiyyah pada tahun 161 H atau 162 H. Ia menulis Kitab Sunan, Kitab Bacaan Al-Qur'an, Kitab Tafsir, Kitab Asketisme, dan Kitab Kebajikan {cite:fihrist-ibn-al-nadim hlm. 316}."
