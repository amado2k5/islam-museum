summary:
  ar: "أبو تراب الرملي. خرج من مكة في سنة فقال لأصحابه: خذوا الجادة وأنا آخذ طريق تبوك، ثم نزلوا الرملة عند صديقه، فأخذت حدأة قطعة من اللحم المشوي، فلما خرج من المفازة ذكر أن حدأة أخذت منه قطعة شواء، فقالوا: هي التي أخذتها من عندنا، فقال: كذا كان الصدق."
  en: "Abu Turab al-Ramli. He left Mecca one year, telling his companions to take the main road while he took the road to Tabuk; they stayed at Ramla with his friend; a kite snatched one piece of roast meat from the table; when he came out of the desert, he mentioned that a kite had taken a piece of hot roast from him, and they told him that it was the piece taken from their own table; he said: thus was the truth."
  ur: "ابو تراب رملی۔ ایک سال مکہ سے نکلے تو ساتھیوں سے کہا: تم سیدھا راستہ لو اور میں تبوک کا راستہ لوں گا؛ وہ رملہ میں اپنے دوست کے پاس ٹھہرے؛ ایک چیل نے بھنے گوشت کا ایک ٹکڑا اٹھا لیا۔ جب وہ ریگستان سے نکلے تو کہا کہ ایک چیل نے ان سے گرم بھنا ہوا ٹکڑا چھین لیا تھا؛ ساتھیوں نے بتایا کہ یہ وہی ٹکڑا تھا جو ان کے دسترخوان سے اٹھا تھا؛ انہوں نے کہا: سچ ایسا ہی ہوتا ہے۔"
