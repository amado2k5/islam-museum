summary:
  ar: "أبو تراب الرملي. خرج من مكة في سنة فقال لأصحابه: خذوا الجادة وأنا آخذ طريق تبوك، ثم نزلوا الرملة عند صديقه، فأخذت حدأة قطعة من اللحم المشوي، فلما خرج من المفازة ذكر أن حدأة أخذت منه قطعة شواء، فقالوا: هي التي أخذتها من عندنا، فقال: كذا كان الصدق."
  en: "Abu Turab al-Ramli. He left Mecca one year, telling his companions to take the main road while he took the road to Tabuk; they stayed at Ramla with his friend; a kite snatched one piece of roast meat from the table; when he came out of the desert, he mentioned that a kite had taken a piece of hot roast from him, and they told him that it was the piece taken from their own table; he said: thus was the truth."
  fr: "Abu Turab al-Ramli. Il quitta La Mecque une année en demandant à ses compagnons de prendre la grande route tandis qu'il prenait celle de Tabuk. Ils logèrent chez son ami à Ramla ; un milan prit un morceau de viande rôtie sur la table. À sa sortie du désert, il mentionna qu'un milan lui avait pris un morceau de rôti chaud ; ils lui dirent que c'était celui pris sur leur propre table. Il dit : telle était la vérité."
  ur: "ابو تراب رملی۔ ایک سال مکہ سے نکلے تو ساتھیوں سے کہا: تم سیدھا راستہ لو اور میں تبوک کا راستہ لوں گا؛ وہ رملہ میں اپنے دوست کے پاس ٹھہرے؛ ایک چیل نے بھنے گوشت کا ایک ٹکڑا اٹھا لیا۔ جب وہ ریگستان سے نکلے تو کہا کہ ایک چیل نے ان سے گرم بھنا ہوا ٹکڑا چھین لیا تھا؛ ساتھیوں نے بتایا کہ یہ وہی ٹکڑا تھا جو ان کے دسترخوان سے اٹھا تھا؛ انہوں نے کہا: سچ ایسا ہی ہوتا ہے۔"
  es: "Abu Turab al-Ramli. Un año, partió de La Meca, diciéndoles a sus compañeros que tomaran el camino principal mientras él tomaba el camino a Tabuk; se quedaron en Ramla con su amigo; un milano arrebató un trozo de carne asada de la mesa; cuando salió del desierto, mencionó que un milano le había quitado un trozo de carne asada caliente, y le dijeron que era el trozo que les habían quitado de su propia mesa; él dijo: así era la verdad."
  tr: "Ebu Turab el-Ramli, belli bir yılda Mekke'den ayrıldı ve arkadaşlarına şöyle dedi: \"Siz ana yoldan gidin, ben Tebük yolundan gideceğim.\" Sonra el-Ramla'da, bir arkadaşının evinde durdular ve bir çaylak kızarmış etten bir parça aldı. Çölden çıktığında, çaylağın kendisinden bir parça kızarmış et aldığını söyledi ve arkadaşları, \"Bizden alan oydu,\" dediler. O da, \"Doğruydu,\" dedi."
  id: "Abu Turab al-Ramli. Ia meninggalkan Mekah pada tahun tertentu dan berkata kepada para sahabatnya: Ambillah jalan utama dan aku akan mengambil jalan menuju Tabuk. Kemudian mereka berhenti di rumah temannya di tempat al-Ramla, dan seekor burung elang mengambil sepotong daging panggang. Ketika ia keluar dari padang pasir, ia menyebutkan bahwa seekor burung elang telah mengambil sepotong daging panggang darinya, dan mereka berkata: Itu burung yang mengambilnya dari kami. Ia berkata: Itu benar."
