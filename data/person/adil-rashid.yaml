summary:
  ar: "لاعب كريكت إنجليزي، وُلد في برادفورد سنة 1988 من أصل باكستاني ميربوري. رامٍ يدور الكرة بكسر الساق باليمنى، يلعب ليوركشير منذ 2006 ولإنجلترا في المباريات ليوم واحد والعشرينيات منذ 2009، ولعب للاختبار بين 2015 و2019، وهو أكثر رامي دوران أخذا للويكيت لإنجلترا في المباريات ليوم واحد والعشرينيات، وفاز مع إنجلترا بكأس العالم 2019 وكأس العالم للعشرينيات 2022، ونال وسام الإمبراطورية البريطانية برتبة عضو (MBE) سنة 2023، وتغيّب عن سلسلة الهند سنة 2022 لأداء الحج."
  en: "English cricketer, born in Bradford in 1988 of Pakistani Mirpuri descent. A right-arm leg-break bowler, he has played for Yorkshire since 2006 and for England in One Day International and Twenty20 International cricket since 2009, played Tests between 2015 and 2019, is England's highest wicket-taker among spin bowlers in both ODIs and T20Is, won the 2019 Cricket World Cup and the 2022 T20 World Cup with England, was appointed MBE in 2023, and missed the 2022 India series to perform Hajj."
  ur: "انگلش کرکٹ کھلاڑی، جو 1988 میں بریڈفورڈ میں پاکستانی میرپوری نسل سے پیدا ہوئے۔ دائیں ہاتھ سے لیگ بریک گیند بازی کرنے والے کھلاڑی کی حیثیت سے وہ 2006 سے یارکشائر اور 2009 سے ایک روزہ اور ٹی ٹوئنٹی بین الاقوامی کرکٹ میں انگلینڈ کے لیے کھیل رہے ہیں، 2015ء سے 2019ء تک ٹیسٹ کھیلے، ایک روزہ اور ٹی ٹوئنٹی دونوں میں اسپن باؤلرز میں انگلینڈ کے سب سے زیادہ وکٹیں لینے والے باؤلر ہیں، انگلینڈ کے ساتھ 2019ء کرکٹ ورلڈ کپ اور 2022ء ٹی ٹوئنٹی ورلڈ کپ جیتا، 2023 میں ایم بی ای بنائے گئے، اور 2022 میں حج کی ادائیگی کے لیے بھارت کے خلاف سیریز سے غیر حاضر رہے۔"
