id: person/al-rashid-almohad
class: person
label:
  ar: الرشيد بن المأمون الموحدي
  en: al-Rashid ibn al-Ma'mun al-Muwahhidi
  fr: "al-Rashid ibn al-Ma'mun al-Muwahhidi"
  es: "al-Rashid ibn al-Ma'mun al-Muwahhidi"
  ur: "الرشید بن الممون الموحدی"
summary:
  ar: عبد الواحد بن المأمون الملقب بالرشيد، بويع بعد هلاك أبيه سنة 630هـ وهزم يحيى بن الناصر ودخل مراكش، واشترط عليه مشيخة الموحدين إعادة رسوم الدعوة المهدية التي كان أبوه محاها فأعيدت، ودبّر في استدراج أمير الخلط مسعود بن حميدان فقتله، وملك إلى أن قتل سنة 640هـ.
  en: Abd al-Wahid ibn al-Ma'mun, titled al-Rashid; acclaimed after his father's death in 630 AH, he defeated Yahya ibn al-Nasir and entered Marrakesh, restoring at the Almohad shaykhs' condition the Mahdi rites his father had erased, and contrived the killing of the Arab commander Mas'ud ibn Humaydan, ruling until his death in 640 AH.
  fr: "Abd al-Wahid ibn al-Ma'mun, intitulé al-Rashid ; acclamé après la mort de son père en 630 de l’hégire, il a vaincu Yahya ibn al-Nasir et est entré dans Marrakech, restaurant à l'état Almohade les rites Mahdi que son père avait effacés, et a inventé le meurtre du commandant arabe Mas'ud ibn Humaydan, régnant jusqu'à sa mort en 640 de l’hégire."
  es: "Abd al-Wahid ibn al-Ma'mun, con el título de al-Rashid, fue aclamado tras la muerte de su padre en el año 630 de la Hégira. Derrotó a Yahya ibn al-Nasir y entró en Marrakech, restaurando, bajo la condición de los jeques almohades, los ritos del Mahdi que su padre había borrado. Además, orquestó el asesinato del comandante árabe Mas'ud ibn Humaydan y gobernó hasta su muerte en el año 640 de la Hégira."
  ur: "عبد الواحد بن المامون، لقب الرشید؛ 630 ہجری میں اپنے والد کی وفات کے بعد مشہور ہونے کے بعد، اس نے یحییٰ بن الناصر کو شکست دی اور مراکش میں داخل ہوئے، المحدث شیخوں کی حالت پر بحال کرتے ہوئے ان کے والد کی مہدی رسومات کو بحال کیا، اور عرب کمانڈر مسعود بن حمیدان کے قتل کی سازش کی، جو 64 ہجری میں اس کی موت تک حکومت کرتا رہا۔"
