label:
  ar: الرشيد بن المأمون الموحدي
  en: al-Rashid ibn al-Ma'mun al-Muwahhidi
summary:
  ar: عبد الواحد بن المأمون الملقب بالرشيد، بويع بعد هلاك أبيه سنة 630هـ وهزم يحيى بن الناصر ودخل مراكش، واشترط عليه مشيخة الموحدين إعادة رسوم الدعوة المهدية التي كان أبوه محاها فأعيدت، ودبّر في استدراج أمير الخلط مسعود بن حميدان فقتله، وملك إلى أن قتل سنة 640هـ.
  en: Abd al-Wahid ibn al-Ma'mun, titled al-Rashid; acclaimed after his father's death in 630 AH, he defeated Yahya ibn al-Nasir and entered Marrakesh, restoring at the Almohad shaykhs' condition the Mahdi rites his father had erased, and contrived the killing of the Arab commander Mas'ud ibn Humaydan, ruling until his death in 640 AH.
