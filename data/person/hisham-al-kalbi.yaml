id: person/hisham-al-kalbi
class: person
label: { ar: "هشام بن محمد الكلبي", en: "Hisham Al Kalbi" }
summary:
  ar: "هشام بن محمد بن السائب بن بشر الكلبي في قول محمد بن سعد كاتب الواقدي، عالم بالنسب وأخبار العرب وأيامها ومثالبها ووقائعها أخذ عن أبيه وعن جماعة من الرواة، توفي سنة ست ومائتين، وله كتب مصنفة رتبها ابن النديم أبوابا: كتب في الأحلاف منها حلف عبد المطلب وخزاعة وحلف الفضول، وفي المآثر والبيوتات والمنافرات منها بيوتات قريش وفضائل قيس عيلان والمثالب والنوافل، ومنها أخبار زياد بن أبيه وأدعاء زياد بن معاوية {cite:fihrist-ibn-al-nadim p. 301-302}."
  en: "The great genealogist (d. 206) whose bibliography Ibn al-Nadim lists by genre {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
