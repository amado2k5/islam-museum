summary:
  ar: "عالم لغوي من دمياط في مصر، أمسك بزمام اللغة العربية وملك ناصية العلوم الإسلامية، وتذكر كتب التراجم أن مصنفاته لم تتجاوز خمسة كتب في علوم مختلفة."
  en: "Linguist from Damietta in Egypt, described by biographers as master of the Arabic language and of the Islamic sciences, whose surviving works number about five books."
  fr: "Linguiste de Damiette en Égypte, décrit par les biographes comme maître de la langue arabe et des sciences islamiques, dont les œuvres conservées comptent environ cinq livres."
  es: "Lingüista originario de Damietta, Egipto, descrito por sus biógrafos como un maestro de la lengua árabe y de las ciencias islámicas, cuyas obras conservadas suman alrededor de cinco libros."
  ur: "مصر میں دمیتا سے تعلق رکھنے والے ماہر لسانیات، جسے سوانح نگاروں نے عربی زبان اور اسلامی علوم کا ماہر قرار دیا ہے، جن کی بقایا تصانیف کی تعداد تقریباً پانچ کتابیں ہیں۔"
  tr: "Mısır'ın Dimyat şehrinden bir dilbilimci olan bu kişi, Arap diline hakim ve İslami ilimlere de vakıftı. Biyografik kitaplarda, farklı bilim dallarında yazdığı eserlerin sayısının beşi geçmediği belirtilmektedir."
  id: "Seorang ahli bahasa dari Damietta di Mesir, ia menguasai bahasa Arab dan memiliki pemahaman yang mendalam tentang ilmu-ilmu Islam. Buku-buku biografi menyebutkan bahwa karyanya tidak lebih dari lima buku dalam berbagai bidang ilmu."
