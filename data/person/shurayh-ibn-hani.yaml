id: person/shurayh-ibn-hani
class: person
label: { ar: "شريح بن هانيء الحارثي", en: "Shurayh ibn Hani' al-Harithi", es: "Shurayh ibn Hani' al-Harithi", fr: "Shurayh ibn Hani' al-Harithi", ur: "شریح ابن ہانی الحارثی۔" }
summary:
  ar: "شريح بن هانيء الحارثي؛ قال لعبيد الله بن أبي بكرة حين صالح رتبيل على خمسمائة ألف درهم وبثلاثة من ولده هناء اتق الله وقاتل هؤلاء القوم فإنك إن فعلت ما تريد وهنت الإسلام بهذا الثغر وكنت قد فررت من الموت الذي إليه مصيرك فاقتتلوا وحمل شريح فقتل."
  en: "Shurayh ibn Hani' al-Harithi; when Ubaydallah ibn Abi Bakra truced Rutbil for five hundred thousand and three sons as hostages, he counselled 'fear God and fight — else you weaken Islam's frontier and flee the death that is your lot' — then charged and was killed."
  es: "Shurayh ibn Hani' al-Harithi: cuando Ubaydallah ibn Abi Bakra pactó una tregua con Rutbil a cambio de quinientos mil y tres hijos como rehenes, le aconsejó: \"Temed a Dios y luchad; de lo contrario, debilitaréis la frontera del Islam y huiréis de la muerte que os espera\". Luego atacó y fue asesinado."
  fr: "Shurayh ibn Hani' al-Harithi; lorsque Ubaydallah ibn Abi Bakra a conclu une trêve avec Rutbil contre cinq cent mille hommes et trois fils en otages, il a conseillé: « Craignez Dieu et combattez, sinon vous affaiblirez la frontière de l'Islam et fuirez la mort qui est votre lot », puis il a chargé et a été tué."
  ur: "شریح ابن ہانی الحارثی؛ جب عبیداللہ ابن ابی بکرہ نے پانچ لاکھ اور تین بیٹوں کو یرغمال بنا کر رتبیل کو فتح کیا تو اس نے نصیحت کی کہ 'خدا سے ڈرو اور لڑو - ورنہ تم اسلام کی سرحد کو کمزور کر دو اور موت سے بھاگ جاؤ جو تمہاری بہتات ہے' - پھر الزام لگایا گیا اور اسے قتل کر دیا گیا۔"
  tr: "Shurayh ibn Hani al-Harithi; Ebiyed Allah bin Epey Bakrah'a, Ratbil ile beş yüz bin dirhem ve üç oğlu Hana ile barış yaptığında, Allah'tan korkun ve bu insanlarla savaşın, çünkü istediğinizi yaparsanız, İslam bu sınır tarafından zayıflayacak ve kaderiniz olan ölümden kaçmış olacaksınız, böylece savaştılar ve Şurayh taşınıp öldürüldü."
  id: "Shurayh ibn Hani al-Harithi; ia berkata kepada Ubayd Allah ibn Abi Bakrah, ketika berdamai dengan Ratbil lebih dari lima ratus ribu dirham dan tiga putranya Hana, takulah kepada Tuhan dan lawanlah mereka, karena jika kamu melakukan apa yang kamu mau, Islam akan melemah oleh perbatasan ini dan kamu akan melarikan diri dari kematian, yang menjadi takdirmu, maka mereka bertempur, dan Shurayh dibawa dan dibunuh."
