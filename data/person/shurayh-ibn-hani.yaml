summary:
  ar: "شريح بن هانيء الحارثي؛ قال لعبيد الله بن أبي بكرة حين صالح رتبيل على خمسمائة ألف درهم وبثلاثة من ولده هناء اتق الله وقاتل هؤلاء القوم فإنك إن فعلت ما تريد وهنت الإسلام بهذا الثغر وكنت قد فررت من الموت الذي إليه مصيرك فاقتتلوا وحمل شريح فقتل."
  en: "Shurayh ibn Hani' al-Harithi; when Ubaydallah ibn Abi Bakra truced Rutbil for five hundred thousand and three sons as hostages, he counselled 'fear God and fight — else you weaken Islam's frontier and flee the death that is your lot' — then charged and was killed."
