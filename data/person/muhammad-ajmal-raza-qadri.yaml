summary:
  ar: "داعية باكستاني يقيم في غوجرانواله بالبنجاب، مؤسس «تحريك إصلاح معاشرة» (حركة إصلاح المجتمع)، وخطيب في خانقاه شريف غكهر؛ عُرف ببياناته الأردية على يوتيوب والتلفزيون في القرآن والحديث وسير الأولياء، وبأنه مريد للمفتي أختر رضا خان القادري البريلوي."
  en: "Pakistani preacher based in Gujranwala, Punjab, founder of Tehreek-e-Islahe Muashra (Movement for the Reform of Society) and khateeb at Khanqah Shareef Ghakkhar. He is known for his Urdu bayans (sermons) on YouTube and television on the Quran, Hadith and the lives of the Sufi saints, and as a disciple of Mufti Akhtar Raza Khan Qadri Barelvi."
  ur: "پاکستانی مبلغ، جو گوجرانوالہ، پنجاب میں مقیم ہیں، «تحریکِ اصلاحِ معاشرہ» کے بانی اور خانقاہ شریف گکھڑ کے خطیب ہیں۔ وہ قرآن، حدیث اور اولیائے کرام کی سیرت پر اپنے اردو بیانات کے لیے یوٹیوب اور ٹیلی ویژن پر جانے جاتے ہیں، اور مفتی اختر رضا خان قادری بریلوی کے مرید ہیں۔"
