summary:
  ar: "أبو طالب الكرخي مصاحب ابن الخل واسمه المبارك بن المبارك، شيخ الشافعية بوقته في بغداد وصاحب الخط المنسوب ومؤدب أولاد الناصر لدين الله؛ درس بالنظامية بعد أبي الخير القزويني وتفقه به جماعة وحدث عن ابن الحصين، وكان رب علم وعمل ونسك وورع، وكان أبوه مغنياً فتشاغل الابن بضرب العود حتى شهدوا له أنه في طبقة معبد، ثم أنف من ذلك فجود الكتابة حتى زاد بعضهم وقال هو أكتب من ابن البواب، ثم اشتغل بالفقه فبلغ في العلم الغاية؛ توفي سنة خمس وثمانين وخمسمائة {cite:shadharat-dhahab p. 764}."
  en: "Abu Talib al-Karkhi, companion of Ibn al-Khallal, named al-Mubarak b. al-Mubarak; shaykh of the Shafi'is of Baghdad in his time, owner of the hand ascribed to him, tutor of the caliph al-Nasir's children; he taught at the Nizamiyya after Abu al-Khayr al-Qazwini, trained jurists, and transmitted from Ibn al-Husayn — a man of knowledge, works, devotion and scrupulosity. His father had been a singer, and the son mastered the oud till they ranked him with Ma'bad; then scorning that, he perfected calligraphy till some said he wrote better than Ibn al-Bawwab; then he turned to fiqh and reached the summit. He died in 585 {cite:shadharat-dhahab p. 764}."
  fr: "Abu Talib al-Karkhi, compagnon d'Ibn al-Khallal, nommé al-Mubarak b. al-Mubarak ; cheikh des chaféites de Bagdad à son époque, maître de l'écriture qui lui est attribuée et précepteur des enfants du calife al-Nasir. Il enseigna à la Nizamiyya après Abu al-Khayr al-Qazwini, forma des juristes et transmit d'Ibn al-Husayn ; homme de savoir, d'œuvres, de dévotion et de scrupule. Son père avait été chanteur, et le fils maîtrisa le oud au point d'être classé avec Ma'bad ; puis, dédaignant cela, il perfectionna la calligraphie, jusqu'à ce que certains le disent meilleur qu'Ibn al-Bawwab ; enfin, il se tourna vers le fiqh et en atteignit le sommet. Il mourut en 585 {cite:shadharat-dhahab p. 764}."
  es: "Abu Talib al-Karkhi, compañero de Ibn al-Khallal, llamado al-Mubarak b. al-Mubarak; shaykh de los shafi'ís de Bagdad en su época, poseedor de la mano que se le atribuye, tutor de los hijos del califa al-Nasir; enseñó en la Nizamiyya después de Abu al-Khayr al-Qazwini, formó juristas y transmitió de Ibn al-Husayn; un hombre de conocimiento, obras, devoción y escrupulosidad. Su padre había sido cantante, y el hijo dominó el laúd hasta alcanzar el nivel de Ma'bad; luego, desdeñando esto, perfeccionó la caligrafía hasta que algunos dijeron que escribía mejor que Ibn al-Bawwab; luego se dedicó al fiqh y alcanzó la cima. Murió en 585 {cite:shadharat-dhahab p. 764}."
  ur: "ابو طالب الکرخی، ابن الخلال کے ساتھی، جس کا نام المبارک ہے۔ المبارک اپنے زمانے میں بغداد کے شافعیوں کا شیخ، اس سے منسوب ہاتھ کا مالک، خلیفہ الناصر کی اولاد کا استاد؛ اس نے ابو الخیر القزوینی کے بعد نظامیہ میں پڑھایا، فقہاء کی تربیت کی، اور ابن الحسین سے نقل کیا - جو علم، کام، عقیدت اور متانت کے آدمی تھے۔ اس کے والد ایک گلوکار تھے، اور بیٹے نے عود میں مہارت حاصل کی یہاں تک کہ انہوں نے اسے معبد کے ساتھ درجہ دیا۔ پھر اس پر طنز کرتے ہوئے، اس نے خطاطی میں کمال کر دیا یہاں تک کہ بعض نے کہا کہ اس نے ابن البواب سے بہتر لکھا ہے۔ پھر فقہ کی طرف متوجہ ہوئے اور چوٹی پر پہنچ گئے۔ ان کی وفات 585ء میں ہوئی۔ 764}۔"
  tr: "İbn el-Hal'in sahabelerinden, adı el-Mubarak ibn el-Mubarak olan Ebu Talib el-Karkhi, Bağdat'ta zamanının önde gelen Şafiî âlimlerindendi, isnat edilen yazının sahibi ve el-Nasır li-Din Allah'ın çocuklarının hocasıydı. Ebu el-Hayr el-Kazvini'den sonra Nizamiye'de eğitim gördü ve bir grup insan onunla fıkıh eğitimi aldı. İbn el-Hüseyn'den hadis rivayet etti. İlim, amel, zühd ve takva sahibi bir insandı. Babası şarkıcı olduğu için oğlu ud çalmaya merak sardı ve hatta Ma'bad ile aynı seviyede olduğu söylenir. Sonra bundan vazgeçti ve yazıda üstünlük sağladı; hatta bazıları onun İbn el-Bawwab'dan daha iyi bir yazar olduğunu ekledi. Daha sonra fıkıhla meşgul oldu ve en yüksek ilim seviyesine ulaştı. Hicri 585 yılında vefat etti. {alıntı: shadharat-dhahab s. 764}."
  id: "Abu Talib al-Karkhi, sahabat Ibn al-Khal, yang bernama al-Mubarak ibn al-Mubarak, adalah ulama Syafi'i terkemuka pada masanya di Baghdad, pemilik kitab yang dinisbahkan kepada Nabi Muhammad SAW, dan guru anak-anak al-Nasir li-Din Allah. Ia belajar di Nizamiyyah setelah Abu al-Khayr al-Qazwini, dan sekelompok orang belajar fiqih bersamanya. Ia meriwayatkan hadits dari Ibn al-Husayn. Ia adalah seorang yang berilmu, berbuat baik, bertakwa, dan saleh. Ayahnya adalah seorang penyanyi, sehingga putranya disibukkan dengan memainkan oud hingga mereka bersaksi bahwa ia setara dengan Ma'bad. Kemudian ia meninggalkannya dan unggul dalam menulis hingga beberapa orang menambahkan bahwa ia adalah penulis yang lebih baik daripada Ibn al-Bawwab. Kemudian ia menekuni fiqih dan mencapai tingkat ilmu tertinggi. Ia wafat pada tahun 585 H. {mengutip:shadharat-dhahab hal. 764}."
