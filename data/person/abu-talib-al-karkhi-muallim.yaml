summary:
  ar: "أبو طالب الكرخي مصاحب ابن الخل واسمه المبارك بن المبارك، شيخ الشافعية بوقته في بغداد وصاحب الخط المنسوب ومؤدب أولاد الناصر لدين الله؛ درس بالنظامية بعد أبي الخير القزويني وتفقه به جماعة وحدث عن ابن الحصين، وكان رب علم وعمل ونسك وورع، وكان أبوه مغنياً فتشاغل الابن بضرب العود حتى شهدوا له أنه في طبقة معبد، ثم أنف من ذلك فجود الكتابة حتى زاد بعضهم وقال هو أكتب من ابن البواب، ثم اشتغل بالفقه فبلغ في العلم الغاية؛ توفي سنة خمس وثمانين وخمسمائة {cite:shadharat-dhahab p. 764}."
  en: "Abu Talib al-Karkhi, companion of Ibn al-Khallal, named al-Mubarak b. al-Mubarak; shaykh of the Shafi'is of Baghdad in his time, owner of the hand ascribed to him, tutor of the caliph al-Nasir's children; he taught at the Nizamiyya after Abu al-Khayr al-Qazwini, trained jurists, and transmitted from Ibn al-Husayn — a man of knowledge, works, devotion and scrupulosity. His father had been a singer, and the son mastered the oud till they ranked him with Ma'bad; then scorning that, he perfected calligraphy till some said he wrote better than Ibn al-Bawwab; then he turned to fiqh and reached the summit. He died in 585 {cite:shadharat-dhahab p. 764}."
