summary:
  ar: "روائي وصحفي ومحرر ومعلم لبناني (1861–1914) استقر في القاهرة، فأسّس مجلة «الهلال» (1892) ودار الهلال للنشر، وكتب ثلاثًا وعشرين رواية تاريخية قرّبت التاريخ الإسلامي والعربي إلى جمهور واسع. من أعلام النهضة، ألّف «تاريخ التمدن الإسلامي» و«تاريخ آداب اللغة العربية» وساهم في صياغة نظرية القومية العربية."
  en: "Lebanese novelist, journalist, editor and teacher (1861–1914) who settled in Cairo, founded the magazine Al-Hilal (1892) and the Dar al-Hilal publishing house, and wrote twenty-three historical novels that carried Islamic and Arab history to a mass readership. A leading Nahda thinker, he wrote multi-volume histories of Islamic civilisation and of Arabic literature and helped formulate the theory of Arab nationalism."
  ur: "لبنانی ناول نگار، صحافی، مدیر اور معلم (1861–1914) جو قاہرہ میں آباد ہوئے، رسالہ «الہلال» (1892) اور دار الہلال کی بنیاد رکھی، اور تئیس تاریخی ناول لکھے جنہوں نے اسلامی و عرب تاریخ کو وسیع قارئین تک پہنچایا۔ نہضہ کے نمایاں مفکر، «تاریخ التمدن الاسلامی» اور «تاریخ آداب اللغۃ العربیہ» کے مصنف اور عرب قومیت کے نظریے کے اولین مرتبین میں سے تھے۔"
