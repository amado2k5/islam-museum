id: person/nafi-mawla-ibn-umar
class: person
label: { ar: "نافع مولى ابن عمر", en: "Nafi' mawla Ibn Umar" }
summary:
  ar: "أبو عبد الله نافع مولى عبد الله بن عمر؛ كان ديلمياً وأصابه مولاه في غزاته، وهو من كبار الصالحين التابعين، سمع مولاه وأبا سعيد الخدري وروى عنه الزهري وأيوب السختياني ومالك بن أنس، وهو من المشهورين بالحديث والثقات الذين يُروى عنهم ويُحجَّج حديثهم ويعمل به، ومعظم حديث ابن عمر عليه دار؛ وقال مالك: كنت إذا سمعت حديث نافع عن ابن عمر لم أبالِ ألا أسمعه من أحد، وأهل الحديث يقولون: رواية الشافعي عن مالك عن نافع عن ابن عمر سلسلة الذهب لجلالة كل واحد من هؤلاء الرواة {cite:wafayat-ayan}."
  en: "Nafi', mawla of Ibn Umar — the Daylami freedman, greatest of the Tabi'i transmitters; most of Ibn Umar's hadith ran through him: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar is the 'golden chain' {cite:wafayat-ayan}."
