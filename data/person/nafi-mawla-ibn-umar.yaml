id: person/nafi-mawla-ibn-umar
class: person
label: { ar: "نافع مولى ابن عمر", en: "Nafi' mawla Ibn Umar", es: "Nafi' mawla Ibn Umar", fr: "Nafi' mawla Ibn Umar", ur: "نافع مولا ابن عمر" }
summary:
  ar: "أبو عبد الله نافع مولى عبد الله بن عمر؛ كان ديلمياً وأصابه مولاه في غزاته، وهو من كبار الصالحين التابعين، سمع مولاه وأبا سعيد الخدري وروى عنه الزهري وأيوب السختياني ومالك بن أنس، وهو من المشهورين بالحديث والثقات الذين يُروى عنهم ويُحجَّج حديثهم ويعمل به، ومعظم حديث ابن عمر عليه دار؛ وقال مالك: كنت إذا سمعت حديث نافع عن ابن عمر لم أبالِ ألا أسمعه من أحد، وأهل الحديث يقولون: رواية الشافعي عن مالك عن نافع عن ابن عمر سلسلة الذهب لجلالة كل واحد من هؤلاء الرواة {cite:wafayat-ayan}."
  en: "Nafi', mawla of Ibn Umar — the Daylami freedman, greatest of the Tabi'i transmitters; most of Ibn Umar's hadith ran through him: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar is the 'golden chain' {cite:wafayat-ayan}."
  es: "Nafi', mawla de Ibn Umar — el liberto daylami, el más grande de los transmisores tabi'i; la mayor parte del hadiz de Ibn Umar pasó por él: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar es la 'cadena de oro' {cite:wafayat-ayan}."
  fr: "Nafi', mawla d'Ibn Umar — l'affranchi Daylami, le plus grand des transmetteurs Tabi'i; la plupart des hadiths d'Ibn Umar sont passés par lui: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar est la « chaîne d'or » {cite:wafayat-ayan}."
  ur: "نافع، ابن عمر کا مولا - دیلامی آزاد، تابعیوں میں سب سے بڑا؛ ابن عمر کی زیادہ تر حدیث ان کے ذریعے چلی ہے: الشافعی ← مالک ← نافع ← ابن عمر ’سنہری زنجیر‘ ہیں۔"
  tr: "Ebu Abdullah Nafi, Abdullah ibn Ömer'in özgür adamıydı; bir Daylamlıydı ve baskınları sırasında özgür bırakanlarının etkisi altındaydı. Önde gelen doğru takipçilerdendi. Özgür adamı Ebu Said el-Hudri'yi dinledi ve el-Zuhri, Eyyub el-Sakhtiyani ve Malik ibn Anas tarafından ondan rivayet edildi. O, rivayet ettiği tanınmış hadis ve güvenilir rivayetçilerdendir; onun hadisleri delil olarak kullanılır ve onlara göre hareket eder. İbn Ömer'in hadislerinin çoğu ona dayanır. Malik şöyle der: Ben Nafi'den İbn Ömer'den bir hadis duyduğumda, kimseden duymak bana sorun etmez. Hadis âlimleri şöyle derler: Malik'ten Şafii'nin rivayeti, İbn Ömer'den Nafi'den gelen altın zincirdir."
  id: "Abu Abdullah Nafi' adalah mantan Abdullah ibn Umar; ia adalah seorang Daylamit dan dipengaruhi oleh para mantan budaknya selama serangan. Ia termasuk di antara pengikut yang benar dan terkemuka. Ia mendengar mantan hadisnya, Abu Sa'id al-Khudri, dan diceritakan darinya oleh al-Zuhri, Ayyub al-Sakhtiyani, dan Malik ibn Anas. Ia termasuk di antara hadis terkenal dan narator yang dapat dipercaya dari siapa ia ceritakan, yang hadit-hadisnya digunakan sebagai bukti, dan ia bertindak berdasarkan haditsnya. Sebagian besar hadis Ibn Umar didasarkan padanya. Malik berkata: Setiap kali saya mendengar hadis dari Nafi' dari Ibn Umar, saya tidak keberatan mendengarnya dari siapa pun. Para ulama hadis berkata: Riwayat al-Shafi'i dari Malik dari Nafi' dari Ibn Umar adalah rantai emas untuk keagungan masing-masing narator ini."
