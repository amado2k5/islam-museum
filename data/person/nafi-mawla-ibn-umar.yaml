label: { ar: "نافع مولى ابن عمر", en: "Nafi' mawla Ibn Umar", es: "Nafi' mawla Ibn Umar", fr: "Nafi' mawla Ibn Umar", ur: "نافع مولا ابن عمر" }
summary:
  ar: "أبو عبد الله نافع مولى عبد الله بن عمر؛ كان ديلمياً وأصابه مولاه في غزاته، وهو من كبار الصالحين التابعين، سمع مولاه وأبا سعيد الخدري وروى عنه الزهري وأيوب السختياني ومالك بن أنس، وهو من المشهورين بالحديث والثقات الذين يُروى عنهم ويُحجَّج حديثهم ويعمل به، ومعظم حديث ابن عمر عليه دار؛ وقال مالك: كنت إذا سمعت حديث نافع عن ابن عمر لم أبالِ ألا أسمعه من أحد، وأهل الحديث يقولون: رواية الشافعي عن مالك عن نافع عن ابن عمر سلسلة الذهب لجلالة كل واحد من هؤلاء الرواة {cite:wafayat-ayan}."
  en: "Nafi', mawla of Ibn Umar — the Daylami freedman, greatest of the Tabi'i transmitters; most of Ibn Umar's hadith ran through him: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar is the 'golden chain' {cite:wafayat-ayan}."
  es: "Nafi', mawla de Ibn Umar — el liberto daylami, el más grande de los transmisores tabi'i; la mayor parte del hadiz de Ibn Umar pasó por él: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar es la 'cadena de oro' {cite:wafayat-ayan}."
  fr: "Nafi', mawla d'Ibn Umar — l'affranchi Daylami, le plus grand des transmetteurs Tabi'i; la plupart des hadiths d'Ibn Umar sont passés par lui: al-Shafi'i ← Malik ← Nafi' ← Ibn Umar est la « chaîne d'or » {cite:wafayat-ayan}."
  ur: "نافع، ابن عمر کا مولا - دیلامی آزاد، تابعیوں میں سب سے بڑا؛ ابن عمر کی زیادہ تر حدیث ان کے ذریعے چلی ہے: الشافعی ← مالک ← نافع ← ابن عمر ’سنہری زنجیر‘ ہیں۔"
