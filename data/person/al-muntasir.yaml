class: person
label: { ar: "المنتصر بالله", en: "al-Muntasir bi-Allah", fr: "al-Muntasir bi-Allah", es: "al-Muntasir bi-Allah", ur: "المنتصر با اللہ" }
summary:
  ar: "خليفة عباسي، بويع له بعد مقتل أبيه المتوكل سنة سبع وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.234}، وتوفي سنة ثمان وأربعين {cite:tabari-tarikh-abu-al-fadl j.9 p.251}، وعند السيوطي بويع له بولاية العهد ثم أراد المتوكل أن يقدم عليه المعتز فسأله أن ينزل فأبى فكان يحط منزلته فاتفق الأتراك معه على قتل أبيه فدخل عليه خمسة فقتلوه في خامس شوال سنة سبع وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 543-544}، وعند السيوطي كان مليحاً مهيباً وافر العقل راغباً في الخير قليل الظلم، ومن كلامه لذة العفو أعذب من لذة التشفي وأقبح أفعال المقتدر الانتقام، وقال فيه يزيد المهلبي ولقد بررت الطالبية بعدما ذموا زماناً بعدها وزمانا ورددت ألفة هاشم فرأيتهم بعد العداوة بينهم إخوانا {cite:tarikh-khulafa-minhaj-1434 p. 553}. وعند المسعودي دبّر بغا الصغير قتل أبيه فامتحن باغراً بابنه فارس ثم بأخيه وصيف ثم به فقال باغر يقتل الابن والأب باق نبدأ بالأب أولاً {cite:muruj-al-dhahab p. 503-504}، وعند المسعودي بويع في صبيحة الليلة التي قتل فيها أبوه بالجعفري وهو ابن خمس وعشرين سنة وأمه أم ولد يقال لها حبشية رومية، وكان مقامه في الماخورة التي قتل فيها أبوه سبعة أيام وهي الموضع الذي قتل فيه شيرويه أباه أبرويز، ورأى محمد بن سهل الكاتب في بساطها صورة شيرويه قاتل أبيه ملك ستة أشهر وصورة يزيد بن الوليد قاتل ابن عمه ملك ستة أشهر فقال لا أرى يدوم ملكه أكثر من ستة أشهر فكان كذلك، ومات سنة ثمان وأربعين ومائتين {cite:muruj-al-dhahab p. 514-515}"
  en: "Abbasid caliph, pledged allegiance after his father al-Mutawakkil was killed in 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.234}, and he died in 248 {cite:tabari-tarikh-abu-al-fadl j.9 p.251}. According to al-Suyuti, he was first pledged heir apparent; then al-Mutawakkil wanted to advance al-Mu'tazz over him and asked him to step down, and when he refused, al-Mutawakkil kept lowering his standing. The Turks agreed with him to kill his father; five men entered upon the caliph and killed him on 5 Shawwal 247 {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. According to al-Suyuti, he was handsome and dignified, of full intellect, eager for good and little given to injustice. Among his sayings: 'The pleasure of pardon is sweeter than the pleasure of vengeance, and the ugliest of al-Muqtadir's deeds was retaliation.' Yazid al-Muhallabi said of him: 'You were generous to the Talibiyyun after they had blamed the age, time after time, and you restored the kinship of Hashim, so that I see them, after enmity between them, as brothers' {cite:tarikh-khulafa-minhaj-1434 p. 553}. According to al-Mas'udi, Bugha al-Saghir plotted his father's murder. He put Bugha to the test through his son Faris, then through his brother Wasif, then through Bugha himself, and Bugha said: 'He kills the son while the father remains; let us begin with the father first' {cite:muruj-al-dhahab p. 503-504}. According to al-Mas'udi, he was proclaimed on the morning of the night his father was killed at al-Ja'fari, aged twenty-five. His mother was an umm walad called Habashiyya Rumiyya. He stayed seven days in the al-Makhura pavilion where his father was killed, the place where Shiruyah had killed his father Khusraw Parviz. Muhammad ibn Sahl the scribe saw in its carpet the figure of Shiruyah, who killed his father and ruled six months, and the figure of Yazid ibn al-Walid, who killed his cousin and ruled six months; he said: 'I do not see his rule lasting longer than six months', and so it was. He died in 248 {cite:muruj-al-dhahab p. 514-515}."
  fr: "Le calife abbasside, a prêté allégeance après que son père al-Mutawakkil ait été tué en 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.234}Il mourut en 248 {cite:tabari-tarikh-abu-al-fadl j.9 p.251}. Selon al-Suyuti, il a d'abord été promis héritier apparent ; puis al-Mutawakkil voulait avancer al-Mu'tazz sur lui et lui a demandé de se retirer, et quand il a refusé, al-Mutawakkil a continué à baisser sa position. Les Turcs convinrent avec lui de tuer son père  ; cinq hommes s’introduisirent auprès du calife et le tuèrent le 5 chawwal 247 {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. Selon al-Suyuti, il était beau et digne, d'une intelligence pleine, avide de bien et peu enclin à l'injustice. Parmi ses paroles  : « Le plaisir du pardon est plus doux que le plaisir de la vengeance, et le plus laid des actes d’al-Muqtadir était la vengeance.  » Yazid al-Muhallabi dit de lui  : « Tu as été généreux envers les Talibiyyyun après qu’ils eurent blâmé l’âge, maintes fois, et tu as rétabli la parenté de Hashim, de sorte que je les vois, après inimité entre eux, comme des frères.  » {cite:tarikh-khulafa-minhaj-1434 p. 553}. Selon al-Mas'udi, Bugha al-Saghir a comploté le meurtre de son père. Il a mis Bugha à l'épreuve par son fils Faris, puis par son frère Wasif, puis par Bugha lui-même, et Bugha a dit : « Il tue le fils pendant que le père reste ; commençons par le père d'abord {cite:muruj-al-dhahab p. 503-504}. Selon al-Mas'udi, il fut proclamé le matin de la nuit où son père fut tué à al-Ja'fari, âgé de vingt-cinq ans. Sa mère était une oumm walad appelée Habashiyya Rumiyya. Il est resté sept jours dans le pavillon al-Makhura où son père a été tué, l'endroit où Shiruyah avait tué son père Khusraw Parviz. Muhammad ibn Sahl le scribe a vu dans son tapis la figure de Shiruyah, qui a tué son père et a régné six mois, et la figure de Yazid ibn al-Walid, qui a tué son cousin et a régné six mois ; Il a dit : « Je ne vois pas sa règle durer plus de six mois », et il en était ainsi. Il est mort en 248 {cite:muruj-al-dhahab p. 514-515}."
  es: "El califa abasí juró lealtad tras la muerte de su padre, al-Mutawakkil, en 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.234}, y falleció en 248 {cite:tabari-tarikh-abu-al-fadl j.9 p.251}. Según al-Suyuti, primero fue nombrado heredero aparente; luego, al-Mutawakkil quiso ascender a al-Mu'tazz por encima de él y le pidió que renunciara, y ante su negativa, al-Mutawakkil siguió rebajándole el poder. Los turcos acordaron con él asesinar a su padre; cinco hombres atacaron al califa y lo mataron el 5 de Shawwal de 247 {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. Según al-Suyuti, era guapo y digno, de gran intelecto, deseoso del bien y poco dado a la injusticia. Entre sus dichos: 'El placer del perdón es más dulce que el placer de la venganza, y la más fea de las acciones de al-Muqtadir fue la represalia'. Yazid al-Muhallabi dijo de él: 'Fuiste generoso con los Talibiyyun después de que culparan a la época, una y otra vez, y restauraste el parentesco de Hashim, de modo que los veo, después de la enemistad entre ellos, como hermanos' {cite:tarikh-khulafa-minhaj-1434 p. 553}. Según al-Mas'udi, Bugha al-Saghir planeó el asesinato de su padre. Puso a prueba a Bugha a través de su hijo Faris, luego a través de su hermano Wasif, luego a través del propio Bugha, y Bugha dijo: 'Mata al hijo mientras el padre permanece; Comencemos con el padre primero' {cite:muruj-al-dhahab p. 503-504}. Según al-Mas'udi, fue proclamado la mañana de la noche en que su padre fue asesinado en al-Ja'fari, a la edad de veinticinco años. Su madre era una umm walad llamada Habashiyya Rumiyya. Permaneció siete días en el pabellón de al-Makhura donde su padre fue asesinado, el lugar donde Shiruyah había matado a su padre Khusraw Parviz. Muhammad ibn Sahl, el escriba, vio en su alfombra la figura de Shiruyah, quien mató a su padre y gobernó seis meses, y la figura de Yazid ibn al-Walid, quien mató a su primo y gobernó seis meses; dijo: 'No veo que su gobierno dure más de seis meses', y así fue. Murió en 248 {cite:muruj-al-dhahab p. 514-515}."
  ur: "عباسی خلیفہ نے 247 میں اپنے والد المتوکل کے قتل کے بعد بیعت کی اور 248 میں وفات پائی۔ السیوطی کے مطابق، وہ سب سے پہلے ظاہری وارث تھا؛ پھر متوکل نے معتز کو اس پر آگے بڑھانا چاہا اور اس سے مستعفی ہونے کو کہا اور جب اس نے انکار کیا تو متوکل اپنا کھڑا ہونے لگا۔ ترک اس کے باپ کو قتل کرنے پر راضی ہو گئے۔ 5 شوال 247 کو پانچ آدمی خلیفہ کے پاس داخل ہوئے اور اسے قتل کر دیا۔ 543-544}۔ السیوطی کے مطابق، وہ خوبصورت اور باوقار، پوری عقل، بھلائی کے شوقین اور ناانصافی کے لیے بہت کم تھے۔ ان کے اقوال میں سے ہے: 'معافی کی لذت انتقام کی لذت سے زیادہ میٹھی ہے، اور مقتدیر کے اعمال میں سب سے برا عمل انتقام تھا۔' یزید المحلبی نے ان کے بارے میں کہا: ''تم نے طالبان کے لیے اس وقت سخاوت کی جب وہ وقت کے ساتھ ساتھ ملامت کرتے رہے، اور تم نے ہاشم کی قرابت کو بحال کیا، تاکہ میں ان کے درمیان دشمنی کے بعد انھیں بھائیوں کی طرح دیکھتا ہوں''۔ 553}۔ المسعودی کے مطابق، بگا الصغیر نے اپنے والد کے قتل کی سازش کی تھی۔ اس نے بوگھا کو اپنے بیٹے فارس کے ذریعے، پھر اپنے بھائی واصف کے ذریعے، پھر خود بوغا کے ذریعے امتحان میں ڈالا، اور بگا نے کہا: 'وہ بیٹے کو مار ڈالتا ہے جب تک کہ باپ باقی رہتا ہے۔ آئیے سب سے پہلے باپ سے شروع کریں' 503-504}۔ المسعودی کے مطابق، اس کا اعلان اس رات کی صبح ہوئی جب اس کے والد کو پچیس سال کی عمر میں الجعفری میں قتل کیا گیا۔ ان کی والدہ ام ولد تھیں جن کا نام حبشیہ رومیہ تھا۔ وہ المخورا برآمدے میں سات دن رہے جہاں اس کے والد کو قتل کیا گیا تھا، وہ جگہ جہاں شیرویہ نے اپنے والد خسرو پرویز کو قتل کیا تھا۔ محمد بن سہل کاتب نے اس کے قالین میں شیرویہ کی شکل دیکھی جس نے اپنے والد کو قتل کیا اور چھ ماہ حکومت کی، اور یزید بن الولید کی شکل جس نے اپنے چچا زاد بھائی کو قتل کیا اور چھ ماہ حکومت کی۔ اس نے کہا: 'میں اس کی حکومت کو چھ ماہ سے زیادہ دیر تک نہیں دیکھتا'، اور ایسا ہی ہوا۔ ان کی وفات 248ھ میں ہوئی۔ 514-515}۔"
