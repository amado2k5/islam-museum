label: { ar: "المنتصر بالله", en: "al-Muntasir bi-Allah" }
summary:
  ar: "خليفة عباسي، بويع له بعد مقتل أبيه المتوكل سنة سبع وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.234}، وتوفي سنة ثمان وأربعين {cite:tabari-tarikh-abu-al-fadl j.9 p.251}، وعند السيوطي بويع له بولاية العهد ثم أراد المتوكل أن يقدم عليه المعتز فسأله أن ينزل فأبى فكان يحط منزلته فاتفق الأتراك معه على قتل أبيه فدخل عليه خمسة فقتلوه في خامس شوال سنة سبع وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 543-544}، وعند السيوطي كان مليحاً مهيباً وافر العقل راغباً في الخير قليل الظلم، ومن كلامه لذة العفو أعذب من لذة التشفي وأقبح أفعال المقتدر الانتقام، وقال فيه يزيد المهلبي ولقد بررت الطالبية بعدما ذموا زماناً بعدها وزمانا ورددت ألفة هاشم فرأيتهم بعد العداوة بينهم إخوانا {cite:tarikh-khulafa-minhaj-1434 p. 553}. وعند المسعودي دبّر بغا الصغير قتل أبيه فامتحن باغراً بابنه فارس ثم بأخيه وصيف ثم به فقال باغر يقتل الابن والأب باق نبدأ بالأب أولاً {cite:muruj-al-dhahab p. 503-504}، وعند المسعودي بويع في صبيحة الليلة التي قتل فيها أبوه بالجعفري وهو ابن خمس وعشرين سنة وأمه أم ولد يقال لها حبشية رومية، وكان مقامه في الماخورة التي قتل فيها أبوه سبعة أيام وهي الموضع الذي قتل فيه شيرويه أباه أبرويز، ورأى محمد بن سهل الكاتب في بساطها صورة شيرويه قاتل أبيه ملك ستة أشهر وصورة يزيد بن الوليد قاتل ابن عمه ملك ستة أشهر فقال لا أرى يدوم ملكه أكثر من ستة أشهر فكان كذلك، ومات سنة ثمان وأربعين ومائتين {cite:muruj-al-dhahab p. 514-515}"
  en: "Abbasid caliph, pledged allegiance after his father al-Mutawakkil was killed in 247 {cite:tabari-tarikh-abu-al-fadl j.9 p.234}, and he died in 248 {cite:tabari-tarikh-abu-al-fadl j.9 p.251}. According to al-Suyuti, he was first pledged heir apparent; then al-Mutawakkil wanted to advance al-Mu'tazz over him and asked him to step down, and when he refused, al-Mutawakkil kept lowering his standing. The Turks agreed with him to kill his father; five men entered upon the caliph and killed him on 5 Shawwal 247 {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. According to al-Suyuti, he was handsome and dignified, of full intellect, eager for good and little given to injustice. Among his sayings: 'The pleasure of pardon is sweeter than the pleasure of vengeance, and the ugliest of al-Muqtadir's deeds was retaliation.' Yazid al-Muhallabi said of him: 'You were generous to the Talibiyyun after they had blamed the age, time after time, and you restored the kinship of Hashim, so that I see them, after enmity between them, as brothers' {cite:tarikh-khulafa-minhaj-1434 p. 553}. According to al-Mas'udi, Bugha al-Saghir plotted his father's murder. He put Bugha to the test through his son Faris, then through his brother Wasif, then through Bugha himself, and Bugha said: 'He kills the son while the father remains; let us begin with the father first' {cite:muruj-al-dhahab p. 503-504}. According to al-Mas'udi, he was proclaimed on the morning of the night his father was killed at al-Ja'fari, aged twenty-five. His mother was an umm walad called Habashiyya Rumiyya. He stayed seven days in the al-Makhura pavilion where his father was killed, the place where Shiruyah had killed his father Khusraw Parviz. Muhammad ibn Sahl the scribe saw in its carpet the figure of Shiruyah, who killed his father and ruled six months, and the figure of Yazid ibn al-Walid, who killed his cousin and ruled six months; he said: 'I do not see his rule lasting longer than six months', and so it was. He died in 248 {cite:muruj-al-dhahab p. 514-515}."
