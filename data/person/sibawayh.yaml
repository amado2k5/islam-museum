id: person/sibawayh
class: person
label: { ar: "سيبويه", en: "Sibawayh" }
summary:
  ar: "سيبويه اسمه عمرو بن عثمان بن قنبرا مولى بني الحارث بن كعب، يكنى أبا بشر ويقال أبو الحسن، وسيبويه بالفارسية رائحة التفاح، أخذ النحو عن الخليل وهو أستاذه وعن عيسى بن عمر ويونس واللغات عن أبي الخطاب الأخفش، وعمل كتابه الذي لم يسبق إلى مثله، قدم العراق أيام الرشيد قاصدا يحيى بن خالد وهو ابن اثنتين وثلاثين سنة فجمع بينه وبين الكسائي والأخفش فناظراه وخطآه وحاكماه إلى فصحاء الأعراب الوافدين على السلطان أبي فقعس وأبي دثار وأبي الجراح وأبي ثروان فكان الكسائي على الصواب، وكلمه الكسائي عند يحيى بن خالد فأجازه بعشرة آلاف درهم فعاد إلى البصرة ثم إلى فارس ومات بها سنة تسع وسبعين ومائة وله نيف وأربعون سنة {cite:fihrist-ibn-al-nadim p. 142-143}."
  en: "Persian grammar master (d. ~180), author of the peerless Kitab — defeated by al-Kisa'i before Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
