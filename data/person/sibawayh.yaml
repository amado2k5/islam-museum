label: { ar: "سيبويه", en: "Sibawayh", es: "Sibawayh", fr: "Sibawayh", ur: "سباویہ" }
summary:
  ar: "سيبويه اسمه عمرو بن عثمان بن قنبرا مولى بني الحارث بن كعب، يكنى أبا بشر ويقال أبو الحسن، وسيبويه بالفارسية رائحة التفاح، أخذ النحو عن الخليل وهو أستاذه وعن عيسى بن عمر ويونس واللغات عن أبي الخطاب الأخفش، وعمل كتابه الذي لم يسبق إلى مثله، قدم العراق أيام الرشيد قاصدا يحيى بن خالد وهو ابن اثنتين وثلاثين سنة فجمع بينه وبين الكسائي والأخفش فناظراه وخطآه وحاكماه إلى فصحاء الأعراب الوافدين على السلطان أبي فقعس وأبي دثار وأبي الجراح وأبي ثروان فكان الكسائي على الصواب، وكلمه الكسائي عند يحيى بن خالد فأجازه بعشرة آلاف درهم فعاد إلى البصرة ثم إلى فارس ومات بها سنة تسع وسبعين ومائة وله نيف وأربعون سنة {cite:fihrist-ibn-al-nadim p. 142-143}."
  en: "Persian grammar master (d. ~180), author of the peerless Kitab — defeated by al-Kisa'i before Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  es: "Maestro de la gramática persa (m. ~180), autor del inigualable Kitab — derrotado por al-Kisa'i antes que Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  fr: "Maître de la grammaire persane (mort vers 180), auteur du Kitab sans égal — vaincu par al-Kisa'i avant Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  ur: "فارسی گرائمر ماسٹر ⁦(متوفی ~180)⁩، بے مثال کتاب کے مصنف - یحییٰ البرمکی سے پہلے الکسائی کے ہاتھوں شکست کھا گیا {حوالہ: فہرست ابن الندیم"
  tr: "Sibevey'in adı Banu el-Haris ibn Ka'b'ın özgür kabarısı Amr ibn Osman ibn Kanbara idi. Ebu Bişr lakabı ve aynı zamanda Ebu el-Hasan olarak da anılırdı. Siboweh, Farsça'da 'Elma Kokusu' olarak anılır. Öğretmeni El-Halil'den, İsa ibn Ömer, Yunus ve dil eğitimi Ebu El-Khattab el-Akhfash'ten aldı. Daha önce eşi benzeri görülmemiş bir kitabını yazdı. El-Reşid döneminde Irak'a geldi, otuz iki yaşında Yahya bin Halid'e gitti ve onu El-Kisai ve El-Akhfaş ile bir araya getirdi, onunla tartıştı, hata yaptı ve Sultan Ebu Fekaas ve Ebu'ya gelen etkileyici bedeviler üzerinde onu yargıladı Dathir, Abu al-Jarrah ve Abu Tharwan, yani al-Kisai haklıydı. Al-Kisai ona Yahya ibn Halid ile konuştu ve ona on bin dirhem izin verdi. Basra'ya, ardından Pers'e döndü ve 179 Hicri yılında, kırk yaşından fazla yaşta öldü {cite:fihrist-ibn-al-nadim s. 142-143}."
  id: "Nama Sibawayh adalah Amr ibn Uthman ibn Qanbara, seorang mantan Banu al-Harith ibn Ka'b. Ia dijuluki Abu Bishr dan juga disebut Abu al-Hasan. Sibawayh disebut 'Aroma Apel' dalam bahasa Persia. Ia mempelajari tata bahasa dari Al-Khalil, yang merupakan gurunya, dan dari Isa ibn Umar, Yunus, serta bahasa dari Abu Al-Khattab Al-Akhfash. Ia menulis bukunya yang belum pernah terjadi sebelumnya. Ia tiba di Irak pada masa Al-Rashid, menuju ke Yahya ibn Khalid saat berusia tiga puluh dua tahun, dan ia mempertemukannya dengan Al-Kisai dan Al-Akhfash, berdebat dengannya, membuat kesalahan, dan menilainya dibandingkan dengan para Badui fasih yang datang kepada Sultan Abu Faqa'as dan Abu Dathir, Abu al-Jarrah, dan Abu Tharwan, jadi al-Kisai benar. Al-Kisai berbicara kepadanya bersama Yahya ibn Khalid, yang memberinya izin untuk sepuluh ribu dirham. Ia kembali ke Basra, lalu ke Persia, di mana ia meninggal pada tahun 179 H, berusia lebih dari empat puluh tahun {cite:fihrist-ibn-al-nadim hlm. 142-143}."
