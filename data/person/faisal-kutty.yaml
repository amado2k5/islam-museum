summary:
  ar: محامٍ وأستاذ قانون ومعلّق كندي مسلم؛ شارك في تأسيس شركة محاماة ومارس القانون الدولي وحقوق الإنسان، ودرّس القانون في جامعات أمريكية، ويكتب عن الشريعة وحقوق المسلمين في الغرب.
  en: Canadian Muslim lawyer, law professor and commentator; co-founded the KSM Law firm, practised international and human-rights law, taught at American universities, and writes on Islamic law and Muslim
    rights in the West.
  ur: کینیڈین مسلم وکیل، قانون کے پروفیسر اور مبصر؛ کے ایس ایم لا فرم کے شریک بانی، بین الاقوامی و انسانی حقوق کے قانون کی پریکٹس کی، امریکی جامعات میں تدریس کی، اور شرعیہ اور مغرب میں مسلمانوں کے حقوق
    پر لکھتے ہیں۔
  es: "Abogado, profesor de derecho y comentarista musulmán canadiense; cofundó el bufete de abogados KSM, ejerció el derecho internacional y de derechos humanos, impartió clases en universidades estadounidenses y escribe sobre derecho islámico y derechos de los musulmanes en Occidente."
  fr: "Avocat, professeur de droit et commentateur musulman canadien; cofondateur du cabinet KSM Law, a pratiqué le droit international et le droit des droits de l'homme, a enseigné dans des universités américaines et écrit sur le droit islamique et les droits des musulmans en Occident."
  tr: "Avukat, hukuk profesörü ve Kanadalı Müslüman yorumcu olan Scully, bir hukuk firması kurmuş, uluslararası hukuk ve insan hakları uygulamış, Amerikan üniversitelerinde hukuk okudu ve Batı'daki Şeriat ile Müslüman hakları üzerine yazmaktadır."
  id: "Seorang pengacara, profesor hukum, dan komentator Muslim Kanada; ia ikut mendirikan firma hukum, mempraktikkan hukum internasional dan hak asasi manusia, belajar hukum di universitas-universitas Amerika, dan menulis tentang Syariah serta hak-hak Muslim di Barat."
