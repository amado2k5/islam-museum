summary:
  ar: "داعية وكاتب بريطاني، والرئيس التنفيذي لمنظمة آيَرا (iERA)؛ يوقّع تقريرها السنوي لسنة 2024-2025 بهذه الصفة. اشتهر بمناظراته في ركن الخطباء بلندن وبمحاضراته حول وجود الله وفلسفة التطور. تذكر سيرة أكاديمية بكلية هامبشير دراسته الهندسة في جامعة سيتي بلندن وعمله في فلسفة العلوم وإدارته شركة النشر «ون ريزن»، وتذكر سيرة بودكاست سنة 2026 حصوله على الماجستير في الفلسفة من بيركبيك، جامعة لندن."
  en: "A British dawah speaker and writer, and the chief executive officer of iERA, whose annual report for 2024-2025 he signs in that office. He made his name in Speakers' Corner debates in London and in talks on the existence of God and the philosophy of evolution. A Hampshire College academic profile records his engineering studies at City University London, his postgraduate work in philosophy of science and his management of the One Reason publishing company; a 2026 podcast biography records a master's degree in philosophy from Birkbeck, University of London."
  ur: "برطانوی داعی اور مصنف، اور iERA کے چیف ایگزیکٹو آفیسر؛ تنظیم کی 2024-2025 سالانہ رپورٹ پر اسی حیثیت میں ان کے دستخط ہیں۔ لندن کے اسپیکرز کارنر کی مناظروں اور وجودِ خدا و فلسفۂ ارتقا پر محاضرات سے شہرت پائی۔ ہیمپشائر کالج کی ایک تعلیمی سوانح میں سٹی یونیورسٹی لندن میں انجینئرنگ کی تعلیم، فلسفۂ سائنس میں پوسٹ گریجویٹ مطالعہ اور «ون ریزن» اشاعتی کمپنی کی انتظامی ذمہ داری کا ذکر ہے؛ 2026 کی ایک پوڈکاسٹ سوانح میں برک بیک، یونیورسٹی آف لندن سے فلسفے میں ماسٹرز کا ذکر ہے۔"
