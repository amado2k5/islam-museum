summary:
  ar: "أولوبي دانيالوفيتش بويناكسكي (1890–1919)، ثوري بلشفي داغستاني من أصل قوموقي نبيل؛ درس الحقوق في جامعة موسكو وانضم إلى البلاشفة سنة 1916 ففُصل، وقاد اللجنة الثورية العسكرية في بورت بتروفسك، ثم انتُخب رئيسا للجنة الإقليمية للحزب الشيوعي في داغستان سنة 1919؛ اعتقله حكومة الجبل ثم سلّم إلى القوات البيضاء، فحاكمته محكمة عسكرية شرعية وأُعدم قرب محطة تميرغويه في أغسطس 1919، وسُمّيت مدينة تمير خان شورا باسمه «بويناكسك» سنة 1921."
  en: "Ullubay Daniyalovich Buynaksky (1890–1919) was a Dagestani Bolshevik revolutionary of Kumyk noble descent. He studied law at Moscow University, joined the Bolsheviks in 1916 and was expelled for it, headed the military revolutionary committee of Port-Petrovsk, and in 1919 was elected chairman of the Dagestan Regional Committee of the Communist Party. Arrested by the Mountainous Republic government and handed over after the White invasion, he was tried by a military sharia court and executed near the Temirgoe station in August 1919; in 1921 Temir-Khan-Shura was renamed Buynaksk in his honour."
  ur: "اُلّوبی دانیالووچ بویناکسکی (1890–1919) قوموق اشرافی نسل کے داغستانی بالشویک انقلابی تھے۔ انہوں نے ماسکو یونیورسٹی میں قانون پڑھا، 1916 میں بالشویکوں میں شامل ہونے پر نکال دیے گئے، پورٹ پیٹرووسک کی فوجی انقلابی کمیٹی کے سربراہ رہے اور 1919 میں داغستان کی کمیونسٹ پارٹی کی علاقائی کمیٹی کے چیئرمین منتخب ہوئے۔ پہاڑی جمہوریہ کی حکومت نے انہیں گرفتار کیا اور سفید فوج کے حملے کے بعد حوالے کیا گیا؛ فوجی شرعی عدالت کے فیصلے سے اگست 1919 میں تمیرگوئے اسٹیشن کے قریب انہیں پھانسی دی گئی، اور 1921 میں تمیر خان شورا کا نام ان کے اعزاز میں «بویناکسک» رکھا گیا۔"
