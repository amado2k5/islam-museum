summary:
  ar: "عبد الله بن أبي عتيق، من آل أبي بكر الصديق، وكان ذا نسب وغفاف وشرف، وكثير المجون. يذكر النويري أنه لقي عبد الله بن عمر بن الخطاب فأنشده شعراً في إنسان هجاه، فقال له ابن عمر: ما تقول في الإنسان الذي هجاك؟ فذكر أن ... {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  en: "Abdullah ibn Abi Atiq, of the family of Abu Bakr al-Siddiq, a man of lineage, restraint and standing, known for much jesting. Al-Nuwayri records an exchange with Abdullah ibn Umar about a verse of satire against him {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  ur: "عبد اللہ بن ابی عتیق ابوبکر صدیق کے خاندان سے تھے، نسب اور شرف والے، اور بہت مزاح کرنے والے۔ نویری بیان کرتے ہیں کہ ان کی عبداللہ بن عمر سے ایک گفتگو ہوئی جس میں ان کی ہجو کے ایک شعر کا ذکر آیا {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}۔"
