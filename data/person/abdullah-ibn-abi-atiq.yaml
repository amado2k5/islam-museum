label:
  ar: "عبد الله بن أبي عتيق، من آل أبي بكر الصديق، وكان ذا نسب وغفاف وشرف، وكثير المجون. يذكر النويري أنه لقي عبد الله بن عمر بن الخطاب، فأنشده شعراً هجاه به إنسان، فقال له ابن عمر: ما فعلت بذلك الإنسان؟ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}. تتمة الخبر في الصفحة التالية، ولم تُقرأ بعد."
  en: "Abdullah ibn Abi Atiq"
  ur: "عبد اللہ بن ابی عتیق"
