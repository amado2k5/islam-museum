summary:
  ar: "عبد الله بن أبي عتيق، من آل أبي بكر الصديق، وكان ذا نسب وغفاف وشرف، وكثير المجون. يذكر النويري أنه لقي عبد الله بن عمر بن الخطاب فأنشده شعراً في إنسان هجاه، فقال له ابن عمر: ما تقول في الإنسان الذي هجاك؟ فذكر أن ... {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  en: "Abdullah ibn Abi Atiq, of the family of Abu Bakr al-Siddiq, a man of lineage, restraint and standing, known for much jesting. Al-Nuwayri records an exchange with Abdullah ibn Umar about a verse of satire against him {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  ur: "عبد اللہ بن ابی عتیق ابوبکر صدیق کے خاندان سے تھے، نسب اور شرف والے، اور بہت مزاح کرنے والے۔ نویری بیان کرتے ہیں کہ ان کی عبداللہ بن عمر سے ایک گفتگو ہوئی جس میں ان کی ہجو کے ایک شعر کا ذکر آیا {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}۔"
  es: "Abdullah ibn Abi Atiq, de la familia de Abu Bakr al-Siddiq, un hombre de linaje, comedido y prestigio, conocido por sus muchas bromas. Al-Nuwayri registra un intercambio con Abdullah ibn Umar sobre un verso de sátira contra él {citar:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  fr: "Abdullah ibn Abi Atiq, de la famille d'Abu Bakr al-Siddiq, un homme de lignée, retenu et debout, connu pour ses nombreuses plaisanteries. Al-Nuwayri enregistre un échange avec Abdullah ibn Umar à propos d'un verset satirique contre lui {cite: nihayat-al-arab-nuwayri-vol4-scan p. 7}."
  tr: "Ebu Bekir el-Siddik ailesinden olan Abdullah ibn Abi Atık, soylu bir soydan, iffetli ve şerefli biriydi, ancak aynı zamanda ahlaksız davranışlarıyla da tanınıyordu. El-Nuveyri, Abdullah ibn Ömer ibn el-Hattab ile karşılaştığını ve ona kendisini hicveden biri hakkında bir şiir okuduğunu anlatır. İbn Ömer ona, \"Seni hicveden kişi hakkında ne diyorsun?\" diye sordu. Bunun üzerine Abdullah ibn Ebu Atık şunları söyledi... {cite:nihayat-al-arab-nuwayri-vol4-scan s. 7}."
  id: "Abdullah ibn Abi Atiq, dari keluarga Abu Bakr al-Siddiq, berasal dari keturunan bangsawan, memiliki kesucian dan kehormatan, tetapi juga dikenal karena perilakunya yang bejat. Al-Nuwayri menceritakan bahwa ia bertemu Abdullah ibn Umar ibn al-Khattab dan membacakan sebuah puisi kepadanya tentang seseorang yang telah menyindirnya. Ibn Umar bertanya kepadanya, \"Apa pendapatmu tentang orang yang menyindirmu?\" Kemudian ia menyebutkan bahwa... {cite:nihayat-al-arab-nuwayri-vol4-scan p. 7}."
