summary:
  ar: "خوارزاده الحتفي شيخ الطائفة بما وراء النهر أبو بكر محمد بن الحسين البخاري القديدي — مصغراً نسبة إلى قديد بين مكة والمدينة؛ روى عن منصور الكاغدي وطائفة وبرع في المذهب وفاق الأقران وكانت عارضته أبسط طريقة للأصحاب وكان يحفظها؛ توفي في جمادى الأولى سنة ثلاث وثمانين وأربعمائة ببخارى {cite:shadharat-dhahab p. 368}."
  en: "Khwarazada al-Khatafi, shaykh of the ta'ifa in Transoxiana — Abu Bakr Muhammad b. al-Husayn al-Bukhari al-Qudaydi (of Qudayd between Mecca and Medina); transmitted from Mansur al-Kaghidi, excelled in the madhhab beyond his peers and kept the widest arida of the companions memorized; died Jumada I 483 at Bukhara {cite:shadharat-dhahab p. 368}."
