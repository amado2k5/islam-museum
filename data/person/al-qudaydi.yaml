id: person/al-qudaydi
class: person
label: { ar: "أبو بكر القديدي خوارزاده الحتفي", en: "Abu Bakr al-Qudaydi Khwarazada al-Khatafi", fr: "Abu Bakr al-Qudaydi Khwarazada al-Khatafi", es: "Abu Bakr al-Qudaydi Khwarazada al-Khatafi", ur: "ابوبکر القدیدی خوارزدہ الخطافی" }
summary:
  ar: "خوارزاده الحتفي شيخ الطائفة بما وراء النهر أبو بكر محمد بن الحسين البخاري القديدي — مصغراً نسبة إلى قديد بين مكة والمدينة؛ روى عن منصور الكاغدي وطائفة وبرع في المذهب وفاق الأقران وكانت عارضته أبسط طريقة للأصحاب وكان يحفظها؛ توفي في جمادى الأولى سنة ثلاث وثمانين وأربعمائة ببخارى {cite:shadharat-dhahab p. 368}."
  en: "Khwarazada al-Khatafi, shaykh of the ta'ifa in Transoxiana — Abu Bakr Muhammad b. al-Husayn al-Bukhari al-Qudaydi (of Qudayd between Mecca and Medina); transmitted from Mansur al-Kaghidi, excelled in the madhhab beyond his peers and kept the widest arida of the companions memorized; died Jumada I 483 at Bukhara {cite:shadharat-dhahab p. 368}."
  fr: "Khwarazada al-Khatafi, shaykh du ta'ifa en Transoxiane – Abu Bakr Muhammad b. al-Husayn al-Bukhari al-Qudaydi (de Qudayd entre La Mecque et Médine) ; transmis de Mansur al-Kaghidi, excellait dans le madhhab au-delà de ses pairs et gardait la plus large arida des compagnons mémorisée ; mort Jumada I 483 à Boukhara {cite:shadharat-dhahab p. 368}."
  es: "Khwarazada al-Khatafi, Sheikh del Ta'ifa en Transoxiana — Abu Bakr Muhammad b. al-Husayn al-Bukhari al-Qudaydi (de Qudayd entre La Meca y Medina); transmitido por Mansur al-Kaghidi, sobresalió en la madhhab más que sus pares y memorizó la más amplia gama de compañeros; murió el viernes 1 de 483 en Bukhara {cite:shadharat-dhahab p. 368}."
  ur: "خوارزدہ الخطافی، ٹرانسکسیانا میں طائفہ کے شیخ - ابو بکر محمد بن۔ الحسین البخاری القدیدی ⁦(مکہ اور مدینہ کے درمیان قدید)⁩؛ منصور الکاغیدی سے منقول، اپنے ہم عصروں سے بڑھ کر مذھب میں فضیلت رکھتے تھے اور صحابہ کے وسیع ترین عریضہ کو حفظ کرتے تھے۔ وفات جمادی الثانی 483ھ بخارا میں 368}۔"
  tr: "Mezhebin transoksiyanizminin şeyhi Ebu Bekir Muhammed bin el-Hüseyin el-Buhari el-Kudidi — Mekke ile Medine arasında yer alan Qudid'e ait küçültülmüş bir özellik; Mansur al-Kaghdi adlı mezhebden rivayet etmiş ve sahabeler arasında en basit yöntem olan akravarlar doktrininde üstün başarı göstermiştir ve ezberlemiştir; dört yüz seksen üçüncü yılda Buhara'da Cumadeliu-Avval'da ölmüştür {atıf:shadharat-dhahab, s. 368}."
  id: "Khwarzadeh al-Hutfi, sheikh transoxianisme sekte tersebut, Abu Bakr Muhammad ibn al-Husayn al-Bukhari al-Qudidi — atribut kecil dari Qudid, antara Mekah dan Madinah; ia menceritakan dari Mansur al-Kaghdi, sebuah sekte, dan unggul dalam ajaran para bangsawan, yang merupakan metode paling sederhana di antara para sahabat dan menghafalnya; ia meninggal di Jumada al-Awwal pada tahun empat ratus delapan puluh tiga di Bukhara {cite:shadharat-dhahab, hlm. 368}."
