summary:
  ar: "محمد بن يوسف بن معدان بن سليم، عروس الزهاد، في الفضل والعلم والعبادة. توفي بالمصيصة ودفن إلى جنب مخلد بن الحسين، وفارق ضياعه زاهدًا فيها، وكان يقول: لقد خاب من كان حظه من الله الدنيا."
  en: "Muhammad ibn Yusuf ibn Ma'dan ibn Sulaym, called the bride of the ascetics, in virtue, knowledge and worship; he died at Massisa and was buried beside Mukhallad ibn al-Husayn; he left his estate in asceticism and used to say: whoever has the world as his share from God has lost."
  ur: "محمد بن یوسف بن معدان بن سلیم، جو عروس الزہاد کے لقب سے مشہور تھے، فضیلت، علم اور عبادت میں ممتاز۔ مصیصہ میں انتقال ہوا اور مخلد بن حسین کے پہلو میں دفن ہوئے؛ انہوں نے اپنی جائیداد زہد کی بنا پر چھوڑ دی تھی اور کہا کرتے: جس کا حصہ اللہ کی طرف سے دنیا ہو وہ نامراد ہوا۔"
