summary:
  ar: "ضابط عسكري أوغندي (1928–2003) صار ثالث رئيس لأوغندا بانقلاب 25 يناير 1971 وحكمها حتى أُطيح به في 11 أبريل 1979؛ اتسم حكمه بانتهاكات واسعة لحقوق الإنسان وسوء إدارة اقتصادية، وطرد سنة 1972 الآسيويين المقيمين في أوغندا، وانتهى بحرب أوغندا وتنزانيا. نشأ في أسرة مسلمة وحفظ القرآن صبيا، ولم تسمِّ المصادر له مدرسة دينية. مات في منفاه بجدة سنة 2003."
  en: "Ugandan military officer (1928–2003) who became the third president of Uganda in the coup of 25 January 1971 and ruled until his overthrow on 11 April 1979. His rule was marked by widespread human-rights abuses and economic mismanagement; he expelled Uganda's Asian residents in 1972, and his regime ended with the Uganda–Tanzania War. He was raised in a Muslim family and memorised the Quran as a boy; the sources name no religious school for him. He died in exile at Jeddah in 2003."
  ur: "یوگنڈا کے فوجی افسر (1928ء–2003ء) جو 25 جنوری 1971ء کی فوجی بغاوت میں یوگنڈا کے تیسرے صدر بنے اور 11 اپریل 1979ء کو معزول ہونے تک حکمران رہے۔ ان کے دور میں انسانی حقوق کی وسیع پامالی اور معاشی بدانتظامی ہوئی؛ 1972ء میں انہوں نے یوگنڈا کے ایشیائی باشندوں کو نکال دیا، اور ان کی حکومت یوگنڈا–تنزانیہ جنگ پر ختم ہوئی۔ وہ ایک مسلمان گھرانے میں پلے بڑھے اور بچپن میں قرآن حفظ کیا؛ مصادر ان کے لیے کوئی مذہبی مکتب فکر بیان نہیں کرتے۔ 2003ء میں جدہ میں جلاوطنی کے دوران ان کا انتقال ہوا۔"
