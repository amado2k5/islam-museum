summary:
  ar: رجل أعمال بريطاني، وُلد سنة 1971؛ شارك مع أخيه زبير في تأسيس مجموعة ⁦EG⁩ من محطة بنزين واحدة في بلاكبيرن إلى إمبراطورية عالمية للوقود والتجزئة، ثم استحوذا على سلسلة أسدا للمتاجر.
  en: British businessman, born 1971; with his brother Zuber he co-founded the EG Group from a single Blackburn petrol station into a global fuel-and-retail empire, then acquired the Asda supermarket chain.
  ur: برطانوی کاروباری شخصیت، پیدائش 1971؛ اپنے بھائی زبیر کے ساتھ ای جی گروپ کی مشترک بنیاد رکھی جو بلیبرن کی ایک پٹرول پمپ سے عالمی ایندھن-ریٹیل سلطنت بنی، پھر انہوں نے اسدا سپر مارکیٹ سلسلہ خریدا۔
  es: "Empresario británico, nacido en 1971; junto con su hermano Zuber, cofundó el Grupo EG, que pasó de una sola gasolinera en Blackburn a un imperio global de combustible y venta minorista, y posteriormente adquirió la cadena de supermercados Asda."
  fr: "Homme d'affaires britannique, né en 1971; avec son frère Zuber, il a cofondé le groupe EG, passant d'une simple station-service à Blackburn à un empire mondial du carburant et de la vente au détail, puis a acquis la chaîne de supermarchés Asda."
  tr: "1971 doğumlu İngiliz bir iş insanı; kardeşi Zubair ile birlikte Blackburn'daki tek bir benzin istasyonundan küresel bir yakıt ve perakende imparatorluğuna dönüştüren EG Group'u kurdu, ardından Asda perakende zincirini satın aldı."
  id: "Seorang pengusaha Inggris, lahir tahun 1971; ia ikut mendirikan EG Group bersama saudaranya Zubair dari satu pom bensin di Blackburn menjadi kerajaan bahan bakar dan ritel global, lalu mengakuisisi jaringan ritel Asda."
