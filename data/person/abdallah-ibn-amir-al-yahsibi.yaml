id: person/abdallah-ibn-amir-al-yahsibi
class: person
label: { ar: "عبد الله بن عامر اليحصبي", en: "Ibn Amir al-Dimashqi" }
summary:
  ar: "عبد الله بن عامر اليحصبي يكنى أبا عمران أحد السبعة، يقال إنه أخذ القرآن عن عثمان بن عفان وقرأ عليه، وهو في الطبقة الأولى من التابعين من أهل دمشق وتوفي بها سنة ثمان عشرة ومائة، وروى عن جماعة من الصحابة منهم واثلة بن الأسقع وفضالة بن عبيد ومعاوية بن أبي سفيان، وروى عنه يحيى بن الحارث الذماري وإسماعيل بن عبد الله بن أبي المهاجر وهشام بن الغاز وثور بن يزيد {cite:fihrist-ibn-al-nadim p. 75}."
  en: "Damascene reader (d. 118) who read the Qur'an upon Uthman himself {cite:fihrist-ibn-al-nadim p. 75}."
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
