summary:
  ar: "ناشط وعالم اجتماع فلسطيني أمريكي، وُلد سنة 1972 في عمّان بالأردن لأبوين فلسطينيين. أسس سنة 1997، وهو طالب دراسات عليا، شبكة عمل المسلمين في المدينة الداخلية (IMAN) في الجانب الجنوبي من شيكاغو، وعمل مديرها التنفيذي سنوات طويلة: تدير الشبكة عيادة صحية مجانية وتدريبًا مهنيًا للسجناء السابقين وبرامج فنية وثقافية. نال زمالة ماك آرثر سنة 2017 وجائزة أوبوس سنة 2018، ونال الدكتوراه في علم الاجتماع من جامعة شيكاغو سنة 2011."
  en: "Palestinian-American activist and sociologist, born in 1972 in Amman, Jordan, to Palestinian parents. In 1997, while a graduate student, he founded the Inner-City Muslim Action Network (IMAN) on Chicago's South Side and served as its executive director for many years: IMAN runs a free community health clinic, job training and transitional housing for formerly incarcerated men, and arts and cultural programming. He was named a MacArthur Fellow in 2017 and won the Opus Prize in 2018, and took his PhD in sociology at the University of Chicago in 2011."
  ur: "فلسطینی امریکی کارکن اور ماہرِ سماجیات، 1972 میں عمان، اردن میں فلسطینی والدین کے ہاں پیدا ہوئے۔ انھوں نے 1997 میں، دورانِ تعلیم، شکاگو کے ساؤتھ سائیڈ میں «انر سٹی مسلم ایکشن نیٹ ورک» (IMAN) قائم کی اور برسوں اس کے ایگزیکٹو ڈائریکٹر رہے: یہ ادارہ مفت صحت کلینک، سابق قیدیوں کے لیے پیشہ ورانہ تربیت اور فنی و ثقافتی پروگرام چلاتا ہے۔ وہ 2017 میں میک آرتھر فیلو بنے، 2018 میں اوپس پرائز جیتا، اور 2011 میں یونیورسٹی آف شکاگو سے سماجیات میں پی ایچ ڈی کی۔"
