summary:
  ar: "الدكتور أحمد شلبي، مؤرخ مصري، أستاذ التاريخ الإسلامي والحضارة الإسلامية بكلية دار العلوم بجامعة القاهرة، حاصل على الدكتوراه من جامعة كمبردج في موضوع التربية الإسلامية، صاحب «موسوعة التاريخ الإسلامي» و«موسوعة الحضارة الإسلامية»، ومنها جزء «الاقتصاد في الفكر الإسلامي». {cite:iqtisad-fikr-islami-shalabi-1993 p.1} {cite:iqtisad-fikr-islami-shalabi-1993 p.25}"
  en: "Dr Ahmad Shalabi, an Egyptian historian, professor of Islamic history and civilisation at Dar al-Ulum, Cairo University, with a Cambridge doctorate on Islamic education, author of Mawsu'at al-Tarikh al-Islami and Mawsu'at al-Hadara al-Islamiyya, including the volume al-Iqtisad fi al-Fikr al-Islami."
  ur: "ڈاکٹر احمد شلبی، مصری مؤرخ، دار العلوم، قاہرہ یونیورسٹی میں اسلامی تاریخ و تہذیب کے استاد، کیمبرج یونیورسٹی سے اسلامی تعلیم کے موضوع پر ڈاکٹریٹ، «موسوعۃ التاریخ الاسلامی» اور «موسوعۃ الحضارۃ الاسلامیہ» کے مصنف، جس کی ایک جلد «الاقتصاد فی الفکر الاسلامی» ہے۔"
