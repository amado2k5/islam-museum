summary:
  ar: "صحابي من الأنصار، شاعر الجهاد في الإسلام المبكر، عُيِّن ثالث قادة جيش مؤتة. حين قُتل صاحباه زيد وجعفر تردد لحظة ثم أقدم قاتلًا حتى استُشهد. أبلغ النبي بشهادته غيبًا ورأى في رؤياه سريره مائلًا قليلًا عن سريري رفيقيه بسبب تردده ثم مضيه."
  en: "Companion from the Ansar and poet of early Islam; appointed third commander of the Mu'tah expedition. After both of his comrades Zayd and Ja'far were killed he hesitated briefly then charged and was martyred. The Prophet announced his death while still in Medina, reporting in a vision that his throne was slightly tilted beside his companions' because of his hesitation before pressing on."
