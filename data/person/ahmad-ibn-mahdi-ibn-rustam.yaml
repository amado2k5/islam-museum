summary:
  ar: "أبو جعفر أحمد بن مهدي بن رستم، ذو الدين المتين والحدث الأمين، أنفق على العلم المال الكثير، كان ذا سخاء وكرم. ذكر أبو نعيم قصة امرأة جاءته ببغداد، ومقامه بعد ذلك على الكتمان، وأنه أنفق ماله كله على العلم، نحو ثلاثمائة ألف درهم."
  en: "Abu Ja'far Ahmad ibn Mahdi ibn Rustam, of firm faith and trustworthy in transmission, who spent much wealth on learning and was generous. The notice tells of a woman who came to him at night in Baghdad asking him to conceal a wrong done to her, of his concealment, and of how he gave his wealth to learning, about three hundred thousand dirhams."
  ur: "ابو جعفر احمد بن مہدی بن رستم، مضبوط دین اور امانت دار راوی، جنہوں نے علم پر بہت مال خرچ کیا اور سخی تھے۔ خبر میں ایک عورت کا ذکر ہے جو بغداد میں رات کو ان کے پاس آئی اور ایک زیادتی کے ڈھانپنے کی درخواست کی، اور ان کے اس پردہ پوشی کا ذکر ہے؛ اور یہ کہ انہوں نے اپنا سارا مال علم پر خرچ کیا، تقریباً تین لاکھ درہم۔"
