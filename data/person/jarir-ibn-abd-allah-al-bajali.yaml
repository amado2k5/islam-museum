label: { ar: "جرير بن عبد الله البجلي" }
aliases: [person/jarir-ibn-abdillah-al-bajali]
summary:
  ar: "بعثه علي بن أبي طالب إلى معاوية يدعوه إلى الدخول في طاعته، كما يذكر فهرس الجزء الرابع {cite:tabari-tarikh-abu-al-fadl j.4 p.584}. وبعثه علي إلى معاوية بعد الجمل رغم تحذير الأشتر منه فماطل معاوية وأشار عليه عمرو بن العاص بالمساومة، ورجع بخبرهم فقال له الأشتر لو أطاعني أمير المؤمنين فيك لحبسك وأشباهك حتى يستقيم الأمر، فخرج إلى قرقيسيا والرحبة وكاتب معاوية {cite:muruj-al-dhahab p. 664-665} وفي الصحيح قال «ما حجبني رسول الله منذ أسلمت ولا رآني إلا ضحك» {cite:sahih-al-bukhari 3822}، وبعثه النبي فهدم ذا الخلصة «الكعبة اليمانية» في خمسين ومائة فارس من أحمس {cite:sahih-al-bukhari 3823}."
gender: male
