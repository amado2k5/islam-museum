class: person
label: { ar: "جرير بن عبد الله البجلي" }
aliases: [person/jarir-ibn-abdillah-al-bajali]
summary:
  ar: "بعثه علي بن أبي طالب إلى معاوية يدعوه إلى الدخول في طاعته، كما يذكر فهرس الجزء الرابع {cite:tabari-tarikh-abu-al-fadl j.4 p.584}. وبعثه علي إلى معاوية بعد الجمل رغم تحذير الأشتر منه فماطل معاوية وأشار عليه عمرو بن العاص بالمساومة، ورجع بخبرهم فقال له الأشتر لو أطاعني أمير المؤمنين فيك لحبسك وأشباهك حتى يستقيم الأمر، فخرج إلى قرقيسيا والرحبة وكاتب معاوية {cite:muruj-al-dhahab p. 664-665} وفي الصحيح قال «ما حجبني رسول الله منذ أسلمت ولا رآني إلا ضحك» {cite:sahih-al-bukhari 3822}، وبعثه النبي فهدم ذا الخلصة «الكعبة اليمانية» في خمسين ومائة فارس من أحمس {cite:sahih-al-bukhari 3823}."
  tr: "Ali bin Abi Talib, onu Muaviye'ye göndererek kendisine teslim olmasını istedi; bu, dördüncü cildin kataloğunda belirtildiği gibi {cite:tabari-tarikh-abu-al-fadl j.4 s.584} Ali, el-Aştar'ın uyarısına rağmen onu Deve'den sonra Muaviye'ye gönderdi. Muaviye gecikti ve Amr ibn al-As ona pazarlık yapmasını tavsiye etti. Raporlarını getirdi ve el-Aştar ona şöyle dedi: Eğer Müminlerin Komutanı seninle ilgili bana itaat ederse, mesele çözülene kadar seni ve senin gibilerini hapse atardı. Qarqisiya ve el-Rahbah'a gidip Muaviye'ye yazdı {atıf:muruj-al-dhahab, s. 664-665}. Gerçek rivayette şöyle dedi: \"Allah'ın Elçisi İslam'ı kabul ettiğimden beri beni asla tutmadı, beni sadece gülerek gördü\" {atıf:sahih-al-bukhari 3822}. Peygamber onu gönderdi ve Ahmos'tan elli yüz süvarıyla 'Yemeni Kabe'yi yıktı {cite:sahih-al-bukhari 3823}."
  id: "Ali ibn Abi Talib mengirimnya ke Muawiyah untuk mengundangnya menyerah, sebagaimana disebutkan dalam katalog volume empat {cite:tabari-tarikh-abu-al-fadl j.4 hlm.584}. Ali mengirimnya ke Muawiyah setelah unta meskipun sudah diperingatkan oleh al-Ashtar. Muawiya menunda, dan Amr ibn al-As menyarankan agar dia bernegosiasi. Dia kembali dengan laporan mereka, dan al-Ashtar berkata kepadanya: Jika Panglima Orang Beriman mematuhi saya mengenai kamu, dia akan memenjarakan kamu dan orang-orang seperti kamu sampai masalah ini selesai. Dia pergi ke Qarqisiya dan al-Rahbah dan menulis kepada Muawiya {cite:muruj-al-dhahab, hlm. 664-665}. Dalam riwayat yang asli, dia berkata: \"Rasulullah tidak pernah menahan saya sejak saya memeluk Islam, dan dia tidak pernah melihat saya kecuali dengan tawa\" {cite:sahih-al-bukhari 3822}. Nabi mengirimnya dan menghancurkan 'Ka'bah Yaman' dengan lima puluh seratus penunggang kuda dari Ahmo {cite:sahih-al-bukhari 3823}."
