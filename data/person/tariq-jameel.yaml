summary:
  ar: "داعية وعالم باكستاني وُلد في ميان جنو بالبنجاب سنة 1953، عضو في جماعة التبليغ، ترك دراسة الطب في لاهور ليلتحق بمدرسة عربية رائيوند، واشتهر بمحاضراته العاطفية في التصوف العملي وتهذيب النفس بالأردية، ونال وسام فخر الأداء سنة 2020، ويدير مؤسسة خيرية ومدارس، وتتابعه قناته على يوتيوب بملايين المشتركين."
  en: "Pakistani preacher and scholar born in Mian Channu, Punjab, in 1953. A member of the Tablighi Jama'at, he left medical studies in Lahore for the Madrasa Arabia at Raiwind and became known for emotional Urdu sermons on self-purification; he received the Pride of Performance in 2020, runs a charitable foundation and schools, and his YouTube channel has millions of subscribers."
  ur: "پاکستانی مبلغ و عالم، جو 1953ء میں پنجاب کے شہر میاں چنوں میں پیدا ہوئے۔ تبلیغی جماعت کے رکن ہیں؛ لاہور میں طب کی تعلیم چھوڑ کر مدرسہ عربیہ رائیونڈ سے دینی تعلیم حاصل کی، اور خود احتسابی و تزکیۂ نفس پر جذباتی اردو بیانات سے شہرت پائی۔ 2020ء میں پرائڈ آف پرفارمنس ملا، ایک فلاحی فاؤنڈیشن اور مدارس چلاتے ہیں، اور ان کے یوٹیوب چینل کے لاکھوں سبسکرائبر ہیں۔"
