class: person
label: { ar: "ثابت بن قرة الحراني", en: "Thabit ibn Qurra", es: "Thabit ibn Qurra", fr: "Thabit ibn Qurra", ur: "ثابت بن قرہ" }
summary:
  ar: "ثابت بن قرة بن كراني الصابئ الحراني، عند المسعودي أنه حين أوفى المعتضد بالله سنة تسع وثمانين ومائتين في طلب وصيف الخادم أتى هيكل أنطاكية وعظمه وأخبر من شأنه {cite:muruj-al-dhahab p. 542}. وكان فيمن يرزقه بنو المنجم مع حنين بن إسحاق نحو خمسمائة دينار في الشهر للنقل والملازمة {cite:fihrist-ibn-al-nadim p. 340}، وهو أبو الحسن ثابت بن قرة بن مروان بن ثابت بن كرايا بن إبراهيم بن كرايا بن مارينوس بن سلاموس ومولده سنة إحدى وعشرين ومائتين وتوفي سنة ثمان وثمانين ومائتين وله سبع وسبعون سنة شمسية، وكان صيرفيا بحران استصحبه محمد بن موسى لما انصرف من بلد الروم لأنه رآه فصيحا فتعلم في داره فوجب حقه عليه فوصله بالمعتضد وأدخله في جملة المنجمين، وأصل رياسة الصابئة في هذه البلاد وبحضرة الخلفاء ثابت بن قرة ثم ثبتت أحوالهم وعلت مراتبهم وبرعوا {cite:fihrist-ibn-al-nadim p. 380}"
  en: "The Harranian Sabian scholar — al-Mas'udi places him at Antioch's ancient temple in 289, when al-Mu'tadid summoned him in the search for Wasif the servant; he venerated it and reported on it {cite:muruj-al-dhahab p. 542}."
  es: "El erudito sabeo de Harran, al-Mas'udi, lo sitúa en el antiguo templo de Antioquía en el año 289, cuando al-Mu'tadid lo convocó en la búsqueda de Wasif el sirviente; lo veneró e informó sobre él {cite:muruj-al-dhahab p. 542}."
  fr: "Le savant sabien de Harran — al-Mas'udi le situe dans l'ancien temple d'Antioche en 289, lorsqu'al-Mu'tadid l'a convoqué à la recherche de Wasif le serviteur; il l'a vénéré et en a fait rapport {cite:muruj-al-dhahab p. 542}."
  ur: "ہررانی صابی عالم - المسعودی نے اسے 289 میں انطاکیہ کے قدیم مندر میں رکھا، جب المتدید نے اسے خادم واصف کی تلاش میں بلایا؛ اس نے اس کی تعظیم کی اور اس کی خبر دی 542}۔"
  tr: "Tebit bin Kurra ibn Karani el-Sabi el-Harrani'ye göre, el-Mes'udi'ye göre, 289 Hicri yılında el-Mu'tadid Billah'ı yerine getirdiğinde, hizmetçinin hizmetkarını ararken Antakya tapınağına gelmiş, onu büyütmüş ve ona durumunu bildirmiştir {atıf:Muruj-al-Dhahab, s. 542}. Astrologların Hunayn ibn İshaq ile sağladığı kişiler arasında ayda yaklaşık beş yüz dinar taşıma ve eşlik için vardı {alıntı:Fihrist-ibn-al-Nadim s. 340}. Ebu el-Hasan Tebit bin Kurra ibn Mervan ibn Tebit ibn Tebit ibn Karaya ibn İbrahim ibn Karaya ibn Marinus ibn Salamus'tu. 221 Hicri yılında doğdu ve 288 Hicri'de öldü, yetmiş yedi yaşındaydı. Bahran'dan gelen bir döviz bozdurcusuydu ve Muhammed ibn Musa, Romalıların topraklarından ayrılırken ona eşlik etti çünkü onu evde konuşan ve öğrenmiş görüyordu, bu yüzden ona borcluydu. El-Mu'tadid'e katıldı ve onu astrologlar arasına dahil etti. Bu topraklarda Sablıların liderliğini kurdu ve halife Tebit bin Kurrah'ın huzurunda statüleri istikrara kavuştu, rütbeleri yükseldi ve üstün oldular {atıf:Fihrist-ibn-al-Nadim s. 380}"
  id: "Thabit ibn Qurra ibn Karani al-Sabi al-Harrani, menurut al-Mas'udi, ketika ia memenuhi al-Mu'tadid Billah pada tahun 289 H, mencari hamba hamba, ia datang ke kuil Antiokhia, memperbesarnya, dan memberitahukan statusnya {cite:muruj-al-dhahab, hlm. 542}. Di antara mereka yang diberikan para ahli nujum bersama Hunayn ibn Ishaq terdapat sekitar lima ratus dinar per bulan untuk transportasi dan pendamping {cite:Fihrist-ibn-al-Nadim hlm. 340}. Ia adalah Abu al-Hasan Thabit ibn Qurra ibn Marwan ibn Thabit ibn Karaya ibn Ibrahim ibn Karaya ibn Marinus ibn Salamus. Ia lahir pada tahun 221 H dan meninggal pada tahun 288 H, berusia tujuh puluh tujuh tahun. Ia adalah penukar mata uang dari Bahran yang ditemani Muhammad ibn Musa ketika meninggalkan tanah Romawi karena melihat Muhammad ibn Musa fasih dan berilmu di rumah, sehingga ia berutang budi padanya. Ia bergabung dengan Al-Mu'tadid dan memasukkannya di antara para ahli nujum. Ia mendirikan kepemimpinan para Sabian di tanah ini dan di hadapan khalifah Thabit ibn Qurrah, kemudian status mereka stabil, pangkat mereka naik, dan mereka unggul {cite:Fihrist-ibn-al-Nadim hlm. 380}"
