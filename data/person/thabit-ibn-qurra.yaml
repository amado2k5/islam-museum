id: person/thabit-ibn-qurra
class: person
label: { ar: "ثابت بن قرة الحراني", en: "Thabit ibn Qurra" }
summary:
  ar: "ثابت بن قرة بن كراني الصابئ الحراني، عند المسعودي أنه حين أوفى المعتضد بالله سنة تسع وثمانين ومائتين في طلب وصيف الخادم أتى هيكل أنطاكية وعظمه وأخبر من شأنه {cite:muruj-al-dhahab p. 542}.، وكان فيمن يرزقه بنو المنجم مع حنين بن إسحاق نحو خمسمائة دينار في الشهر للنقل والملازمة {cite:fihrist-ibn-al-nadim p. 340}، وهو أبو الحسن ثابت بن قرة بن مروان بن ثابت بن كرايا بن إبراهيم بن كرايا بن مارينوس بن سلاموس ومولده سنة إحدى وعشرين ومائتين وتوفي سنة ثمان وثمانين ومائتين وله سبع وسبعون سنة شمسية، وكان صيرفيا بحران استصحبه محمد بن موسى لما انصرف من بلد الروم لأنه رآه فصيحا فتعلم في داره فوجب حقه عليه فوصله بالمعتضد وأدخله في جملة المنجمين، وأصل رياسة الصابئة في هذه البلاد وبحضرة الخلفاء ثابت بن قرة ثم ثبتت أحوالهم وعلت مراتبهم وبرعوا {cite:fihrist-ibn-al-nadim p. 380}"
  en: "The Harranian Sabian scholar — al-Mas'udi places him at Antioch's ancient temple in 289, when al-Mu'tadid summoned him in the search for Wasif the servant; he venerated it and reported on it {cite:muruj-al-dhahab p. 542}."
