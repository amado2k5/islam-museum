id: person/abu-hassan-al-ziyadi
class: person
label: { ar: "أبو حسان الزيادي", en: "Abu Hassan al-Ziyadi", fr: "Abu Hassan al-Ziyadi", es: "Abu Hassan al-Ziyadi", ur: "ابو حسن الزیادی" }
summary:
  ar: "من فقهاء المحنة، أجاب عند الامتحان بأن القرآن كلام الله وإن أمرنا أمير المؤمنين بشيء سمعنا وأطعنا، وعابه المأمون في كتابه بأنه كان منتحلاً ولاء دعي فأنكر أن يكون مولى لزياد بن أبيه {cite:tarikh-khulafa-minhaj-1434 p. 491-492}."
  en: "A mihna jurist who answered 'the Quran is God's speech; whatever the commander of the faithful commands we hear and obey' — al-Ma'mun's letter charged he had claimed a mawla-tie to Ziyad ibn Abihi, which he denied {cite:tarikh-khulafa-minhaj-1434 p. 491-492}."
  fr: "Juriste de la mihna qui répondit « le Coran est la parole de Dieu ; tout ce que le commandeur des croyants ordonne, nous l'entendons et y obéissons » — la lettre d'al-Ma'mun l'accusait d'avoir revendiqué un lien de clientèle avec Ziyad ibn Abihi, ce qu'il nia {cite:tarikh-khulafa-minhaj-1434 p. 491-492}."
  es: "Un jurista de la mihna que respondió \"el Corán es la palabra de Dios; todo lo que el comandante de los creyentes ordena, lo escuchamos y obedecemos\" — la carta de al-Ma'mun lo acusó de haber afirmado tener un mawla-tie con Ziyad ibn Abihi, lo cual negó {cite:tarikh-khulafa-minhaj-1434 p. 491-492}."
  ur: "ایک مہنا فقیہ جس نے جواب دیا کہ 'قرآن خدا کا کلام ہے۔ وفاداری کا حکم جو بھی ہم سنتے ہیں اور مانتے ہیں'' - المامون کے خط میں الزام لگایا گیا ہے کہ اس نے زیاد بن ابیحی سے مولا باندھنے کا دعوی کیا تھا، جس کی اس نے تردید کی تھی۔ 491-492}۔"
  tr: "Bu imtihanın âlimlerinden biri, sınandığında Kur'an'ın Allah'ın kelamı olduğunu ve Müminlerin Emiri bize bir şey emrederse, işitip itaat edeceğimizi söylemiştir. El-Ma'mun, kitabında onu sahte bir sadakatçi olmakla eleştirmiş ve Ziyad ibn Abihi'nin müşterisi olduğunu reddetmiştir. {cite:tarikh-khulafa-minhaj-1434 s. 491-492}."
  id: "Salah satu ulama yang membahas masalah ini, ketika diuji, menjawab bahwa Al-Qur'an adalah firman Allah dan jika Amirul Mukmin memerintahkan kita untuk melakukan sesuatu, kita akan mendengar dan menaatinya. Al-Ma'mun mengkritiknya dalam bukunya karena berpura-pura setia, dan ia menyangkal menjadi sekutu Ziyad ibn Abihi. {cite:tarikh-khulafa-minhaj-1434 p. 491-492}."
