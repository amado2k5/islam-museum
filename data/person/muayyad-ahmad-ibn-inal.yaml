summary:
  ar: "الملك المؤيد أحمد بن إينال؛ عقد له أبوه السلطان الأشرف إينال السلطنة في يوم الأربعاء رابع عشر ليلة خلت من جمادى الأولى سنة خمس وستين وثمانمائة وخلع أتابكه خشقدم بعد خمسة أشهر وخمسة أيام {cite:shadharat-dhahab p. 305}."
  en: "Al-Mu'ayyad Ahmad ibn Inal — proclaimed sultan by his abdicating father al-Ashraf Inal on Wed 14 Jumada I 865; his atabeg Khushqadam deposed him after five months and five days {cite:shadharat-dhahab p. 305}."
  es: "Al-Mu'ayyad Ahmad ibn Inal fue proclamado sultán por su padre abdicante, al-Ashraf Inal, el miércoles 14 de Jumada I de 865; su atabeg Khushqadam lo depuso después de cinco meses y cinco días {cita: shadharat-dhahab p. 305}."
  fr: "Al-Mu'ayyad Ahmad ibn Inal — proclamé sultan par son père abdiqué al-Ashraf Inal le mercredi 14 Jumada I 865; son atabeg Khushqadam le déposa après cinq mois et cinq jours {cite: shadharat-dhahab p. 305}."
  ur: "المعیاد احمد بن انال - کو اس کے دست بردار والد الاشرف انال نے 14 جمادی الثانی 865 بروز بدھ کو سلطان کا اعلان کیا۔ اس کے عتبہ خوشقدم نے اسے پانچ ماہ اور پانچ دن کے بعد معزول کر دیا۔ 305}۔"
  tr: "Kral El-Mueyyad Ahmed bin İnal; babası Sultan el-Eşref İnal, 865 H. yılının Cumadeldi-Avval'in on dördüncü gecesi Çarşamba günü onu hükümdar olarak atadı ve Atabega Haşkadam'ı beş ay beş gün sonra tahttan indirdi {atıf: Shadharat-Dhahab, s. 305}."
  id: "Raja Al-Mu'ayyad Ahmad ibn Inal; ayahnya, Sultan al-Ashraf Inal, mengangkatnya sebagai penguasa pada hari Rabu, malam keempat belas Jumada al-Awwal, 865 H, dan menggulingkan Atabega Khashqadam setelah lima bulan dan lima hari {cite:shadharat-dhahab, hlm. 305}."
