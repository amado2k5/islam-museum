  ar: "أبو بكر الأصبهاني صاحب كتاب الزهرة، روى عن أبيه، وكان عالمًا أديبًا وفقيهًا مناظرًا وشاعرًا فصيحًا؛ وحكى جعفر الخلدي أن رويمًا قال كنا عند داود بن علي الأصبهاني إذ دخل عليه ابنه محمد وهو يبكي فضمّه إليه وقال ما يبكيك؟ قال الصبيان يلقّبونني يقولون لي يا عصفور الشوك، فضحك داود فقال له ابنه: أنت أشد عليّ من الصبيان! فقال داود: لا إله إلا الله! ما الألقاب إلا من السماء! ما أنت يا بني إلا عصفور الشوك {cite:muntazam-ibn-al-jawzi p. 206}."
