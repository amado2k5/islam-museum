label: { ar: "محمد بن داود الأصبهاني صاحب الزهرة", en: "Muhammad ibn Dawud al-Asbahani", es: "Muhammad ibn Dawud al-Asbahani", fr: "Muhammad ibn Dawud al-Asbahani", ur: "محمد بن داؤد الاصبہانی" }
roles: [scholar, writer]
gender: male
summary:
  ar: "أبو بكر الأصبهاني صاحب كتاب الزهرة، روى عن أبيه، وكان عالمًا أديبًا وفقيهًا مناظرًا وشاعرًا فصيحًا؛ وحكى جعفر الخلدي أن رويمًا قال كنا عند داود بن علي الأصبهاني إذ دخل عليه ابنه محمد وهو يبكي فضمّه إليه وقال ما يبكيك؟ قال الصبيان يلقّبونني يقولون لي يا عصفور الشوك، فضحك داود فقال له ابنه: أنت أشد عليّ من الصبيان! فقال داود: لا إله إلا الله! ما الألقاب إلا من السماء! ما أنت يا بني إلا عصفور الشوك {cite:muntazam-ibn-al-jawzi p. 206}."
  en: "Abu Bakr al-Asbahani, author of Kitab al-Zahra — scholar, belletrist, jurist, debater and eloquent poet; the boyhood story survives of his father Dawud laughing that nicknames come from heaven: 'you are nothing but the thorn-sparrow' {cite:muntazam-ibn-al-jawzi p. 206}."
  es: "Abu Bakr al-Asbahani, autor de Kitab al-Zahra, erudito, literato, jurista, orador y elocuente poeta; se conserva la historia de su infancia en la que su padre Dawud se reía diciendo que los apodos venían del cielo: \"no eres más que el gorrión espinoso\" {cite:muntazam-ibn-al-jawzi p. 206}."
  fr: "Abou Bakr al-Asbahani, auteur du Kitab al-Zahra — érudit, poète, juriste, débatteur et poète éloquent; l'histoire de son enfance survit, celle de son père Dawud riant que les surnoms viennent du ciel: « tu n'es rien d'autre que le moineau épineux » {cite: muntazam-ibn-al-jawzi p. 206}."
  ur: "ابو بکر الاسبہانی، کتاب الزہرہ کے مصنف - عالم، بیلٹسٹ، فقیہ، مباحثہ اور فصیح شاعر؛ لڑکپن کی کہانی اپنے والد داؤد کے ہنستے ہوئے زندہ ہے کہ عرفی نام آسمان سے آتے ہیں: 'تم کانٹے کی چڑیا کے سوا کچھ نہیں ہو'۔ 206}۔"
  tr: "El-Zehra kitabının yazarı Ebu Bekir el-İsfahani, babasından rivayet etmiş, bir alim, edebi figür, hukukçu, münazara yapan ve etkileyici bir şairdir. Cefer-el-Haldi şöyle anlatmıştır: Rubeyma'nın şöyle dediğini anlatmıştır: Davud bin Ali el-İsfahani ile birlikteydik, oğlu Muhammed ağlarken yanına geldi, onu kucakladı ve 'Seni ne ağlatıyor?' dedi. Çocuklar, 'Bana 'Ey dikenli kuş' diyorlar.' dediler. Davud güldü ve oğlu ona dedi ki: Bana çocuklardan daha sertsin! Davud dedi ki: Allah'tan başka tanrı yoktur! Ne unvanlar göklerden başka değildir! Sen bensin, oğlum, sadece bir dikenli kuşsun {atı: Muntazam-ibn-al-Jawzi s. 206}."
  id: "Abu Bakr al-Isfahani, penulis buku Al-Zahra, menceritakan dari ayahnya dan merupakan seorang cendekiawan, tokoh sastra, ahli hukum, debat, dan penyair yang fasih. Ja'far al-Khaldi menceritakan bahwa Ruwayma berkata: Kami bersama Dawud ibn Ali al-Isfahani ketika putranya Muhammad datang kepadanya saat ia menangis, memeluknya, dan berkata, 'Apa yang membuatmu menangis?' Anak-anak itu berkata, 'Mereka memanggilku 'Wahai burung berduri.' Dawood tertawa, dan putranya berkata kepadanya: Kau lebih keras padaku daripada anak-anak! Dawud berkata: Tidak ada tuhan selain Allah! Gelar apa pun kecuali dari langit! Kau adalah aku, anakku, hanya burung berduri {cite:muntazam-ibn-al-jawzi hlm. 206}."
