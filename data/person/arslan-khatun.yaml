summary:
  ar: "بنت الخليفة القائم بأمر الله، أشهر زيجات العصر السياسية. في سنة أربع وخمسين وأربعمائة طلبها السلطان طغربك زوجة له وطال شرح الأمر، ووردت إلى دار الخلافة في ثامن جمادى الأولى ومعها عميد الملك أبو نصر وقاضي الري وفي الصحبة المهر والجهاز، وتلكّأ الخليفة في التسليم حتى قال عميد الملك قد كان يجب إرهابه، وساق الأمر إلى العقد على أن يشهد عميد الملك وقاضي الري العقد؛ وزفت إلى السلطان ليلة الاثنين خامس عشر صفر سنة ٤٥٥ وضُربت لها سرادق من دجلة إلى الدار وجلست على سرير مُلبّس بالذهب، فدخل السلطان فقبّل الأرض وخرج من غير أن يمازح ولم تقم له ولا كشفت برقعها ولا أبصرته، وأنفذ لها عقدين فاخرين وقطعة ياقوت حمراء، ودخل بابنة القائم وله سبعون سنة {cite:muntazam-ibn-al-jawzi j.8 p.560-562; shadharat-dhahab p. 302-303}. وفي سنة ٤٥١ حين أُسر حرم الخليفة بيد البساسيري أنفذت مع عميد الملك إلى أبيها المنفي اثنتي عشرة حبة لؤلؤ كبارًا تسأل أن يتسبّح بها {cite:muntazam-ibn-al-jawzi j.8 p.549}."
  en: "Daughter of the caliph al-Qa'im: the most famous political bride of the age — demanded in marriage by the seventy-year-old Tughril Beg in 454, delivered with mahr and trousseau to the Sultan's palace under the escort of Amid al-Mulk and the qadi of Rayy, and married in Safar 455 in a pavilion pitched from the Tigris to the palace, veiled on a gold-covered couch while the sultan kissed the ground and withdrew; during her father's captivity in 451 she sent him twelve large pearls asking that he count them as her tasbih {cite:muntazam-ibn-al-jawzi j.8 p.549,560-562}."
