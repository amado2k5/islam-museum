summary:
  ar: "بنت الخليفة القائم بأمر الله، أشهر زيجات العصر السياسية. في سنة أربع وخمسين وأربعمائة طلبها السلطان طغربك زوجة له وطال شرح الأمر، ووردت إلى دار الخلافة في ثامن جمادى الأولى ومعها عميد الملك أبو نصر وقاضي الري وفي الصحبة المهر والجهاز، وتلكّأ الخليفة في التسليم حتى قال عميد الملك قد كان يجب إرهابه، وساق الأمر إلى العقد على أن يشهد عميد الملك وقاضي الري العقد؛ وزفت إلى السلطان ليلة الاثنين خامس عشر صفر سنة ٤٥٥ وضُربت لها سرادق من دجلة إلى الدار وجلست على سرير مُلبّس بالذهب، فدخل السلطان فقبّل الأرض وخرج من غير أن يمازح ولم تقم له ولا كشفت برقعها ولا أبصرته، وأنفذ لها عقدين فاخرين وقطعة ياقوت حمراء، ودخل بابنة القائم وله سبعون سنة {cite:muntazam-ibn-al-jawzi j.8 p.560-562; shadharat-dhahab p. 302-303}. وفي سنة ٤٥١ حين أُسر حرم الخليفة بيد البساسيري أنفذت مع عميد الملك إلى أبيها المنفي اثنتي عشرة حبة لؤلؤ كبارًا تسأل أن يتسبّح بها {cite:muntazam-ibn-al-jawzi j.8 p.549}."
  en: "Daughter of the caliph al-Qa'im: the most famous political bride of the age — demanded in marriage by the seventy-year-old Tughril Beg in 454, delivered with mahr and trousseau to the Sultan's palace under the escort of Amid al-Mulk and the qadi of Rayy, and married in Safar 455 in a pavilion pitched from the Tigris to the palace, veiled on a gold-covered couch while the sultan kissed the ground and withdrew; during her father's captivity in 451 she sent him twelve large pearls asking that he count them as her tasbih {cite:muntazam-ibn-al-jawzi j.8 p.549,560-562}."
  es: "Hija del califa al-Qa'im: la novia política más famosa de la época, exigida en matrimonio por el septuagenario Tughril Beg en 454, llevada con dote y ajuar al palacio del sultán bajo la escolta de Amid al-Mulk y el cadí de Rayy, y casada en Safar 455 en un pabellón instalado desde el Tigris hasta el palacio, velada en un diván cubierto de oro mientras el sultán besaba el suelo y se retiraba; durante el cautiverio de su padre en 451 le envió doce grandes perlas pidiéndole que las contara como su tasbih {cite:muntazam-ibn-al-jawzi j.8 p.549,560-562}."
  fr: "Fille du calife al-Qa'im: la plus célèbre épouse politique de l'époque — demandée en mariage par Tughril Beg, âgé de soixante-dix ans, en 454, livrée avec mahr et trousseau au palais du sultan sous l'escorte d'Amid al-Mulk et du cadi de Rayy, et mariée en Safar 455 dans un pavillon dressé du Tigre au palais, voilée sur un lit recouvert d'or tandis que le sultan embrassait le sol et se retirait; pendant la captivité de son père en 451, elle lui envoya douze grosses perles en lui demandant de les compter comme son tasbih {cite:muntazam-ibn-al-jawzi j.8 p.549,560-562}."
  ur: "خلیفہ القائم کی دختر: اس زمانے کی سب سے مشہور سیاسی دلہن - ستر سالہ طغرل بیگ نے 454 میں شادی کا مطالبہ کیا، مہر اور طوطے کے ساتھ امیڈ الملک اور ری کے قادی کی نگرانی میں سلطان کے محل میں پہنچایا، اور 454ء میں طغرل بیگ سے 454ء میں شادی کی۔ محل، سونے سے ڈھکے صوفے پر چڑھا ہوا تھا جب کہ سلطان نے زمین کو چوما اور پیچھے ہٹ گیا۔ 451 میں اپنے والد کی اسیری کے دوران اس نے اسے بارہ بڑے موتی بھیجے اور کہا کہ وہ ان کو اپنی تسبیح میں شمار کریں۔"
  tr: "O, dönemin en ünlü siyasi evliliği olan Halife el-Kaim bi-Amr Allah'ın kızıydı. Dört yüz elli dört yılında, Sultan Taghribk onu eşi olarak çağırdı ve konu uzun uzun anlatıldı. Cumedül-Avval'ın sekizinde, kralın reisi Ebu Nasr ve Rey hakimi eşliğinde, çeyiz ve ekipmanla birlikte halifeliğin konutuna geldi. Halife, kralın reisi ona korkutulması gerektiğini söyleyene kadar konuyu sunmayı geciktirdi. Konu, kralın valisi ve Rayı hakimi tarafından tanıklık edilmek üzere sözleşmeye taşındı. 455 Hicri Yılı'nın on beşi Sefer Pazartesi gecesi, sultana sunuldu ve Dicle'den eve kadar bir çadır kuruldu Altınla süslenmiş bir yatak. Sultan içeri girdi, yere öptü ve şaka yapmadan ayrıldı. Ne onun için ayağa kalktı, ne peçesini açtı, ne de onu gördü. Ona iki lüks kolye ve kırmızı bir yakut yaptı ve yetmiş yaşındaki Ka'im'in kızıyla içeri girdi {atıf:Muntazam-ibn-al-jawzi J.8 s.560-562; shadharat-dhahab s. 302-303}. 451 yılında, halifenin karısı al-Basasiri tarafından yakalandığında, sürgündeki babasına kralın reisiyle birlikte on iki büyük inci gönderdi ve ondan {cite:Muntazam-ibn-al-Jawzi j.8 s.549} ile yüzmesini istedi."
  id: "Dia adalah putri Khalifah al-Qa'im bi-Amr Allah, pernikahan politik paling terkenal pada masa itu. Pada tahun empat ratus lima puluh empat, Sultan Taghribk memanggilnya sebagai istri, dan masalah ini dijelaskan secara panjang. Dia tiba di kediaman kekhalifahan pada tanggal delapan Jumada al-Awwal, ditemani oleh kepala raja Abu Nasr dan hakim Rayy, disertai dengan mas kawin dan perlengkapan. Khalifah menunda mengajukan masalah sampai kepala raja mengatakan dia harus diintimidasi. Masalah ini dibawa ke kontrak untuk disaksikan oleh gubernur raja dan hakim Rayy. Pada malam Senin, tanggal lima belas Safar, 455 H, dia diperkenalkan kepada sultan, dan sebuah tenda didirikan untuknya dari Tigris ke rumah, dan dia duduk di Sebuah ranjang yang dihiasi emas. Sultan masuk, mencium tanah, dan pergi tanpa bercanda. Dia tidak membelanya, tidak membuka kerudungnya, juga tidak melihatnya. Dia membuat dua kalung mewah dan sebuah rubi merah untuknya, dan masuk bersama putri Qa'im, yang berusia tujuh puluh tahun {cite:Muntazam-ibn-al-jawzi J.8 hlm.560-562; shadharat-dhahab hlm. 302-303}. Pada tahun 451, ketika istri khalifah ditangkap oleh al-Basasiri, ia mengirimkan dua belas mutiara besar bersama kepala raja kepada ayahnya yang diasingkan dan meminta agar ia berenang bersama {cite:muntazam-ibn-al-jawzi j.8 hlm.549}."
