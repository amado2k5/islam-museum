id: person/jariya-ibn-qudama
class: person
label: { ar: "جارية بن قدامة السعدي", en: "Jariya ibn Qudama al-Sa'di" }
summary:
  ar: "جارية بن قدامة السعدي التميمي من أمراء علي بن أبي طالب؛ بعثه في ألفين مع وهب بن مسعود في ألفين طلباً لبسر بن أبي أرطاة الذي نهب الحجاز واليمن سنة أربعين، فهرب بسر منه واتبعه جارية إلى مكة فبايع أهلها، ثم أتى المدينة وأبو هريرة يصلي بالناس فهرب منه فقال: لو وجدت أبا سنور لقتلته، وبايع أهلها الحسن بن علي لما بلغه هلاك أبيه {cite:kamil-ibn-al-athir p. 732-733}."
  en: "Al-Sa'di of Tamim, Ali's commander — sent with four thousand men after Busr's raiders, chased him out of the Hijaz, took Mecca and Medina's bay'a for al-Hasan when Ali's death reached him; of Abu Hurayra he said 'had I caught Abu Sinnur I would have killed him' {cite:kamil-ibn-al-athir p. 732-733}."
