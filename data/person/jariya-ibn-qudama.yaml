label: { ar: "جارية بن قدامة السعدي", en: "Jariya ibn Qudama al-Sa'di", es: "Jariya ibn Qudama al-Sa'di", fr: "Jariya ibn Qudama al-Sa'di", ur: "جریہ ابن قدامہ السعدی" }
summary:
  ar: "جارية بن قدامة السعدي التميمي من أمراء علي بن أبي طالب؛ بعثه في ألفين مع وهب بن مسعود في ألفين طلباً لبسر بن أبي أرطاة الذي نهب الحجاز واليمن سنة أربعين، فهرب بسر منه واتبعه جارية إلى مكة فبايع أهلها، ثم أتى المدينة وأبو هريرة يصلي بالناس فهرب منه فقال: لو وجدت أبا سنور لقتلته، وبايع أهلها الحسن بن علي لما بلغه هلاك أبيه {cite:kamil-ibn-al-athir p. 732-733}."
  en: "Al-Sa'di of Tamim, Ali's commander — sent with four thousand men after Busr's raiders, chased him out of the Hijaz, took Mecca and Medina's bay'a for al-Hasan when Ali's death reached him; of Abu Hurayra he said 'had I caught Abu Sinnur I would have killed him' {cite:kamil-ibn-al-athir p. 732-733}."
  es: "Al-Sa'di de Tamim, comandante de Ali, enviado con cuatro mil hombres tras los asaltantes de Busr, lo expulsó del Hiyaz, tomó la bay'a de La Meca y Medina por al-Hasan cuando la muerte de Ali llegó a sus oídos; de Abu Hurayra dijo: \"Si hubiera capturado a Abu Sinnur, lo habría matado\" {cita:kamil-ibn-al-athir págs. 732-733}."
  fr: "Al-Sa'di de Tamim, le commandant d'Ali — envoyé avec quatre mille hommes après les pillards de Busr, le chassa du Hedjaz, prit la bay'a de La Mecque et de Médine pour al-Hasan lorsque la mort d'Ali le parvint; d'Abu Hurayra, il dit: « Si j'avais attrapé Abu Sinnur, je l'aurais tué » {cite: kamil-ibn-al-athir p. 732-733}."
  ur: "تمیم کے السعدی، علی کے سپہ سالار - نے چار ہزار آدمیوں کے ساتھ بصر کے حملہ آوروں کے ساتھ بھیجا، اس کا تعاقب کرتے ہوئے حجاز سے باہر نکلا، جب علی کی موت اس کے پاس پہنچی تو مکہ اور مدینہ کی بیعت حسن کے لیے لے گئی۔ ابو ہریرہ کے بارے میں انہوں نے کہا کہ اگر میں ابو سنور کو پکڑتا تو اسے قتل کر دیتا۔ 732-733}۔"
