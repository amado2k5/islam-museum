summary:
  ar: "حافظ دمشق شمس الدين ابن ناصر الدين القيسي الشافعي وقيل الحنبلي؛ ولد في أواسط محرم سنة سبع وسبعين وسبعمائة بدمشق وحفظ القرآن وعدة متون وسمع الحديث في صغره من الحافظ أبي بكر بن المحب وتلا بالروايات على الجمال البانياسي ثم أكب على طلب الحديث ولازم الشيوخ وكتب الطباق وسمع من خلق منهم بدر الدين بن رزام ومحمد بن تقي الدين العز الأناني وابن غشم المرداوي والصدر المناوي ونجم الدين بن العز وبرهان الدين بن عبد الهادي وأبو هريرة بن الذهبي وخلائق يطول ذكرهم، وأخبر السخاوي أنه قرأ على ابن حجر وابن حجر قرأ عليه، ومهر في الحديث وكتب وخرج وعرف العالي والنازل وخرج لنفسه ولغيره وصار حافظ الشام بلا منازع، وأخذ العربية عن البانياسي وغيره والفقه عن ابن خطيب الدهشة والسراج البلقيني وأجاز له من القاهرة الحافظ الزين العراقي والسراج بن الملقن وغيرهما واشتهر اسمه وبعد صيته، وألف التآليف الجليلة منها توضيح مشتبه الذهب في ثلاث مجلدات كبار وجرد منه كتاب الأعلام بما وقع في مشتبه الذهبي من الأوهام، وبديعة البيان عن موت الأعيان نظماً وشرحها في مجلد سماه التبيان، وقصيدة في أنواع علوم الحديث سماها عقود الدرر في علوم الأثر وشرحها شرحين مطولاً ومختصراً، وكتاب الشراق من الضعفاء وكشف القناع عن حال من افترى الصحبة والاتباع، وإتحاف السالك برواية الموطأ عن مالك وجامع الآثار في مولد المختار ثلاثة أسفار كبار ومورد الصادي في مولد الهادي واختصر منه اللفظ الرائق في مولد خير الخلائق، وله مصنفات في المعراج وكذا في الوفاة النبوية وافتتاح القاري لصحيح البخاري وتحفة الأخباري بترجمة البخاري ومنهاج السلامة في ميزان القيامة والتنقيح لحديث التسبيح وجزء في فضل يوم عرفة وجزء في فضل يوم عاشوراء والأربعون المتباينة الأسانيد والمتون وعرف العتبر في وصف المدبر والروض الندي في الحوض المحمدي مجلد ذكر فيه طرق حديث الحوض من ثمانين طريقاً ورفع الدسيسة بوضع الهريسة وجزء فيه أحاديث ستة عن حفاظ ستة في معان ستة ونيل الأمنية بذكر الخيل النبوية والإملاء الأنفسي في ترجمة عيسى وإعلام الرواة بأحكام حديث القضاة والأعلام الواضحة في أحكام المصافحة وإطفاء حرقة الحوبة بإلباس خرقة التوبة ومختصر في مناسك الحج وعدة مصنفات أخر، وتوفي بدمشق في ليلة الجمعة سادس عشر ربيع الآخر سنة اثنتين وأربعين وثمانمائة ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 243-245}."
  en: "Ibn Nasir al-Din (b. Damascus mid-Muharram 777), 'hafiz of Syria without rival' — pupil of Ibn al-Muhibb and the Baniyasi, teacher of and taught by Ibn Hajar himself; author of Tawdih Mushtabih al-Dhahab, the Tibyan, 'Uqud al-Durar on hadith sciences, Kashf al-Qina' on false Companion-claims, the great three-volume mawlid Jami' al-Athar, and dozens more; died Damascus Friday night 16 Rabi' II 842, buried at Bab al-Faradis {cite:shadharat-dhahab p. 243-245}."
  es: "Ibn Nasir al-Din (n. Damasco a mediados de Muharram en 777), 'hafiz de Siria sin rival', alumno de Ibn al-Muhibb y los Baniyasi, maestro y enseñado por el propio Ibn Hajar; autor de Tawdih Mushtabih al-Dhahab, el Tibyan, 'Uqud al-Durar sobre las ciencias del hadiz, Kashf al-Qina' sobre las falsas afirmaciones de los Compañeros, el gran mawlid de tres volúmenes Jami' al-Athar y docenas más; murió en Damasco el viernes 16 por la noche Rabi' II 842, enterrado en Bab al-Faradis {cita: shadharat-dhahab p. 243-245}."
  fr: "Ibn Nasir al-Din (né à Damas au milieu de Muharram 777), « hafiz de Syrie sans rival » — élève d'Ibn al-Muhibb et des Baniyasi, professeur et enseigné par Ibn Hajar lui-même; auteur du Tawdih Mushtabih al-Dhahab, du Tibyan, de « Uqud al-Durar sur les sciences des hadiths, de Kashf al-Qina » sur les fausses affirmations des compagnons, du grand mawlid en trois volumes Jami' al-Athar, et de dizaines d'autres; est décédé à Damas vendredi soir 16 Rabi' II 842, enterré à Bab al-Faradis {cite: shadharat-dhahab p. 243-245}."
  ur: "ابن ناصر الدین ⁦(پیدائش دمشق وسط محرم 777)⁩، 'حافظ شام کے بغیر حریف' - ابن المذہب اور بنیاسی کے شاگرد، خود ابن حجر کے استاد اور سکھائے گئے؛ تجوید مشتبیٰ الذہب کے مصنف، تبیان، علوم حدیث پر عقد الدرار، جھوٹے صحابی کے دعووں پر کشف القینہ، عظیم تین جلدوں پر مشتمل مولد جامع الاطہر، اور درجنوں مزید؛ دمشق کا وصال جمعہ کی رات 16 ربیع الثانی 842 کو باب الفرادیس میں ہوا۔ 243-245}۔"
  tr: "Şam'ın Hafizi Şemseddin İbn Nasır el-Din el-Kaisi el-Şafi'i, Hanbali olarak adlandırılır; 777 Hicri yılında Şam'da Muharrem ortasında doğmuş, Kur'an'ı ve birkaç metni ezberlemiştir. Gençliğinde hadis âlimi Ebu Bekir bin Mühhib'den hadis duymuş, el-Cemal el-Beniasi'ye rivayetler okumuş, sonra kendini hadis aramaya adamış, şeyhleri takip etmiş, metinler yazmış ve Bedreddin ibn Razam, Muhammed bin Takieddin el-İzz-Anani, İbn Gazam el-Merdevi, el-Sadr el-Manavi, Necmeddin ibn el-İzz ve Burhan al-Din ibn Abd gibi büyük karakterli kişilerden dinlemiştir El-Hadi, Ebu Hureyre ibn el-Dahabi ve adı çok uzun olan diğerleri. El-Sakhavi, İbn Hacer'in yanında eğitim gördüğünü, İbn Hacer'in onunla hadis çalıştığını, yazdığını ve dışarı çıktığını, hem yüksekleri hem de alçağı tanıdığını, kendisi ve başkaları için dışarı çıktığını ve tartışmasız el-Şam Hafızı olduğunu aktarmıştır. Arapçayı el-Beniyasi ve diğerlerinden, fıkıhi ise İbn Hatib el-Dhasha ve el-Siraj el-Balkini'den öğrenmiştir. Kahire'den al-Hafız el-Zeyn el-Iraki, el-Sirec ibn el-Mulqin ve diğerlerinden yetki almıştır. Adı ünlü oldu ve itibarı arttı. 'Şüpheli Tutkunun Açıklaması' da dahil olmak üzere üç büyük ciltte önemli eserler yazdı ve bu eserden derledi 'Al-A'lam bima Waqi' adlı kitabı Mashtabah al-Dhahabi min al-Awmah, Badi'at al-Bayan 'an Mawt al-A'yan adlı şiirle ve açıklaması Al-Tibyan adlı ciltte ve hadis bilimleri üzerine 'Aqud al-Durar fi 'Uloom al-Athar' adlı şiir ve iki uzun ve öz açıklamasıyla açıklanan 'Al-Sharaq min al-Du'afa' kitabı, ve 'Kaşf el-Qina' 'an Hal min Iftari al-Sahiba wa al-Ibtiba', 'Ithaf al-Salik bi Ri'at al-Muwatta' ve Jami' al-Athar fi Mawlid al-Mukhtar (üç büyük eser), Mawrid al-Sadi (Mawlid al-Hadi'de) ve buradan net bir kelime olan 'Mawlid Khayr al-Khala'iq' adlı eserleri vardır. Ayrıca Yükseliş ve Peygamber'in ölümü üzerine eserler, Kari'nin Sahih al-Buhari'nin açılışı, el-Buhari'nin biyografisiyle haber verme, Diriliş'in dengesinde güvenlik yöntemi, yüceltme hadislerinin gözden geçirilmesi, Arafah Günü erdemi üzerine bir bölüm, Aşura gününün erdemi ve kırk farklı aktarım zinciri ile metinler. Ayrıca el-'Atbar'ı Müsmedan Havzası'ndaki yönetici ve çiy bahçesinin tanımında tanıtmıştır. Havzanın hadis yöntemlerini seksen yoldan ve harissa ile yerleştirerek kurgu kaldırılmasını, altıdan altı hadis içeren altı hadisi ve peygamberlik atlarının anılmasıyla dileklerin doğuşunu belirttiği bir ciltte yer almıştır. Ve İsa'nın biyografisindeki kendi dikte, rivayetçilerin hakimlerin hadislerinin kararlarıyla bilgilendirilmesi, el sıkışma kararlarındaki net rakamlar, tövbe pelerinini giyerek kalp kırıklığının yakılması, Hac ritüellerinin özeti ve daha birçok eser. 842 Hicri yılında, Rabi'al-Thani ayının on altıncı günü Cuma gecesi Şam'da öldü ve Bab el-Faradis mezarlığına defnedildi {cite:shadharat-dhahab, s. 243-245}."
  id: "Hafiz dari Damaskus Shams al-Din Ibn Nasir al-Qaisi al-Shafi'i, dan disebut Hanbali; lahir di pertengahan Muharram tahun 777 H di Damaskus, ia menghafal Al-Qur'an dan beberapa teks. Ia mendengar hadis di masa mudanya dari ulama hadis Abu Bakr ibn al-Muhib, membacakan riwayat kepada al-Jamal al-Baniasi, kemudian mendedikasikan dirinya untuk mencari hadits, mengikuti para sheikh, menulis buku-buku teks, dan mendengar dari orang-orang berwibawa, termasuk Badr al-Din ibn Razam, Muhammad ibn Taqi al-Din al-Izz al-Anani, Ibn Ghasham al-Mardawi, al-Sadr al-Manawi, Najm al-Din ibn al-Izz, dan Burhan al-Din ibn Abd Al-Hadi, Abu Huraira ibn al-Dhahabi, dan lainnya yang penyebutannya terlalu panjang. Al-Sakhawi melaporkan bahwa ia belajar di bawah bimbingan Ibn Hajar, dan Ibn Hajar belajar di bawah bimbingan beliau, belajar hadits bersamanya, menulis, dan keluar, mengenali baik yang tinggi maupun yang rendah, dan berusaha untuk dirinya sendiri dan orang lain, menjadi Hafiz yang tak terbantahkan dari al-Sham. Ia belajar bahasa Arab dari al-Baniyasi dan lainnya, serta hukum dari Ibn Khatib al-Dhasha dan al-Siraj al-Balqini. Ia menerima otorisasi dari Kairo oleh al-Hafiz al-Zain al-Iraqi, al-Siraj ibn al-Mulqin, dan lainnya. Namanya menjadi terkenal dan reputasinya meningkat. Ia menulis karya-karya penting, termasuk 'Klarifikasi Sengsara yang Dicurigai' dalam tiga volume besar, dan ia mengekstraknya Buku 'Al-A'lam bima Waqi' fi Mashtabah al-Dhahabi min al-Awmah, Badi'at al-Bayan 'an Mawt al-A'yan dalam bentuk puisi dan penjelasannya dalam sebuah buku berjudul Al-Tibyan, sebuah puisi tentang berbagai ilmu hadis berjudul 'Aqud al-Durar fi 'Uloom al-Athar' dan penjelasannya dalam dua penjelasan panjang dan ringkas, yaitu buku 'Al-Sharaq min al-Du'afa' dan 'Kashf al-Qina' 'an Hal min Iftari al-Sahiba wa al-Ibtiba', 'Ithaf al-Salik bi Ri'at al-Muwatta' dari Malik dan Jami' al-Athar fi Mawlid al-Mukhtar (tiga karya utama), Mawrid al-Sadi dalam Mawlid al-Hadi, dari mana ia merangkum kata yang jelas 'Mawlid Khayr al-Khala'iq.' Ia juga memiliki Karya-karya tentang Kenaikan serta kematian Nabi, pembukaan Sahih al-Bukhari oleh Qari, pemberian berita beserta biografi al-Bukhari, metode keselamatan dalam keseimbangan Kebangkitan, revisi hadits pemuliaan, bagian tentang kebajikan Hari Arafah, bagian tentang kebajikan hari Ashura, serta empat puluh rantai transmisi dan teks yang berbeda. Ia juga memperkenalkan al-'Atbar dalam deskripsi pengelola dan taman embun di Cekungan Muhammadan. Sebuah volume di mana ia menyebutkan metode hadits cekungan dari delapan puluh rute, dan penghapusan plot dengan menempatkan harissa, bagian yang berisi enam hadis dari penghafal enam dalam makna enam, dan kelahiran harapan dengan menyebut kuda nabi. Dan dikte diri dalam biografi Yesus, informasi para narator dengan putusan hadits para hakim, angka jelas tentang putusan jabat tangan, memadamkan pembakaran patah hati dengan mengenakan jubah pertobatan, ringkasan ritual Haji, dan beberapa karya lainnya. Ia wafat di Damaskus pada malam Jumat, tanggal enam belas Rabi' al-Thani, tahun 842 H, dan dimakamkan di pemakaman Bab al-Faradis {cite:shadharat-dhahab, hlm. 243-245}."
