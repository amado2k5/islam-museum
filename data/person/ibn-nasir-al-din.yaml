summary:
  ar: "حافظ دمشق شمس الدين ابن ناصر الدين القيسي الشافعي وقيل الحنبلي؛ ولد في أواسط محرم سنة سبع وسبعين وسبعمائة بدمشق وحفظ القرآن وعدة متون وسمع الحديث في صغره من الحافظ أبي بكر بن المحب وتلا بالروايات على الجمال البانياسي ثم أكب على طلب الحديث ولازم الشيوخ وكتب الطباق وسمع من خلق منهم بدر الدين بن رزام ومحمد بن تقي الدين العز الأناني وابن غشم المرداوي والصدر المناوي ونجم الدين بن العز وبرهان الدين بن عبد الهادي وأبو هريرة بن الذهبي وخلائق يطول ذكرهم، وأخبر السخاوي أنه قرأ على ابن حجر وابن حجر قرأ عليه، ومهر في الحديث وكتب وخرج وعرف العالي والنازل وخرج لنفسه ولغيره وصار حافظ الشام بلا منازع، وأخذ العربية عن البانياسي وغيره والفقه عن ابن خطيب الدهشة والسراج البلقيني وأجاز له من القاهرة الحافظ الزين العراقي والسراج بن الملقن وغيرهما واشتهر اسمه وبعد صيته، وألف التآليف الجليلة منها توضيح مشتبه الذهب في ثلاث مجلدات كبار وجرد منه كتاب الأعلام بما وقع في مشتبه الذهبي من الأوهام، وبديعة البيان عن موت الأعيان نظماً وشرحها في مجلد سماه التبيان، وقصيدة في أنواع علوم الحديث سماها عقود الدرر في علوم الأثر وشرحها شرحين مطولاً ومختصراً، وكتاب الشراق من الضعفاء وكشف القناع عن حال من افترى الصحبة والاتباع، وإتحاف السالك برواية الموطأ عن مالك وجامع الآثار في مولد المختار ثلاثة أسفار كبار ومورد الصادي في مولد الهادي واختصر منه اللفظ الرائق في مولد خير الخلائق، وله مصنفات في المعراج وكذا في الوفاة النبوية وافتتاح القاري لصحيح البخاري وتحفة الأخباري بترجمة البخاري ومنهاج السلامة في ميزان القيامة والتنقيح لحديث التسبيح وجزء في فضل يوم عرفة وجزء في فضل يوم عاشوراء والأربعون المتباينة الأسانيد والمتون وعرف العتبر في وصف المدبر والروض الندي في الحوض المحمدي مجلد ذكر فيه طرق حديث الحوض من ثمانين طريقاً ورفع الدسيسة بوضع الهريسة وجزء فيه أحاديث ستة عن حفاظ ستة في معان ستة ونيل الأمنية بذكر الخيل النبوية والإملاء الأنفسي في ترجمة عيسى وإعلام الرواة بأحكام حديث القضاة والأعلام الواضحة في أحكام المصافحة وإطفاء حرقة الحوبة بإلباس خرقة التوبة ومختصر في مناسك الحج وعدة مصنفات أخر، وتوفي بدمشق في ليلة الجمعة سادس عشر ربيع الآخر سنة اثنتين وأربعين وثمانمائة ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 243-245}."
  en: "Ibn Nasir al-Din (b. Damascus mid-Muharram 777), 'hafiz of Syria without rival' — pupil of Ibn al-Muhibb and the Baniyasi, teacher of and taught by Ibn Hajar himself; author of Tawdih Mushtabih al-Dhahab, the Tibyan, 'Uqud al-Durar on hadith sciences, Kashf al-Qina' on false Companion-claims, the great three-volume mawlid Jami' al-Athar, and dozens more; died Damascus Friday night 16 Rabi' II 842, buried at Bab al-Faradis {cite:shadharat-dhahab p. 243-245}."
