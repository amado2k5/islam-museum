summary:
  ar: "شهرزاد الجارية من أولاد الملوك في أصل حكاية هزار أفسان: تزوجها الملك الذي كان يقتل أزواجه من الغد فابتدأت تخرفه وتصل الحديث عند انقضاء الليل ما يحمله على استبقائها إلى أن أبى عليها ألف ليلة ورزقت منه ولدا أظهرته وأوقفته على حيلتها فاستعقلها واستبقاها، وكان يوافقها دينارزاد قهرمانة الملك {cite:fihrist-ibn-al-nadim p. 422-423}."
  en: "Shahrazad — the vizier's-daughter figure of the Hazar Afsan frame, as Ibn al-Nadim tells it {cite:fihrist-ibn-al-nadim}"
