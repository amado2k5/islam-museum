id: person/shahrazad
class: person
label: { ar: "شهرزاد", en: "Shahrazad", es: "Shahrazad", fr: "Shahrazad", ur: "شہرزاد" }
summary:
  ar: "شهرزاد الجارية من أولاد الملوك في أصل حكاية هزار أفسان: تزوجها الملك الذي كان يقتل أزواجه من الغد فابتدأت تخرفه وتصل الحديث عند انقضاء الليل ما يحمله على استبقائها إلى أن أبى عليها ألف ليلة ورزقت منه ولدا أظهرته وأوقفته على حيلتها فاستعقلها واستبقاها، وكان يوافقها دينارزاد قهرمانة الملك {cite:fihrist-ibn-al-nadim p. 422-423}."
  en: "Shahrazad — the vizier's-daughter figure of the Hazar Afsan frame, as Ibn al-Nadim tells it {cite:fihrist-ibn-al-nadim}"
  es: "Shahrazad — la figura de la hija del visir en el marco de Hazar Afsan, según lo cuenta Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  fr: "Shahrazad — la figure de la fille du vizir dans le cadre de Hazar Afsan, comme le raconte Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  ur: "شہرزاد - ہزار افشاں فریم کی وزیر کی بیٹی کی شخصیت، جیسا کہ ابن الندیم نے اسے بتایا ہے"
  tr: "Şehrazade, kralın çocuklarından olan köle kız, Hazar Afsan hikayesinin kökeninde: Ertesi gün karılarını öldüren kralla evlendi. Aldatılmaya başladı ve hikaye gecenin sonuna kadar geldi, bu da onun onu bin gece reddedene kadar yanında tutmasına yol açtı ve ona gösteriş yapıp planında tuttuğu bir oğul doğurdu. Dinarzad onu destekledi, kralın kahramanı {atıf:fihrist-ibn-al-nadim s. 422-423}."
  id: "Scheherazade, gadis budak dari anak-anak raja, dalam asal cerita Hazar Afsan: Dia menikah dengan raja yang biasa membunuh istrinya keesokan harinya. Dia mulai tertipu dan cerita itu sampai ke akhir malam, yang membuat raja memeliharanya sampai menolak selama seribu malam, dan dia melahirkan seorang putra yang dia pamerkan dan simpan dalam rencananya. Dinarzad mendukungnya, pahlawan raja {cite:fihrist-ibn-al-nadim hlm. 422-423}."
