summary:
  ar: "محقق محدث معاصر، أستاذ مشارك بجامعة أم القرى بمكة المكرمة عند صدور الطبعة الثانية من تحقيقه لكتاب «فضائل الصحابة» لأحمد بن حنبل؛ كان تحقيق الكتاب رسالته للدكتوراه، وطبعته الجامعة سنة 1403هـ ثم دار ابن الجوزي سنة 1420هـ، وترجم فيه لأكثر من 1762 راوياً وحكم على أسانيده."
  en: "A contemporary hadith scholar and editor, associate professor at Umm al-Qura University in Mecca when the second edition of his critical edition of Ahmad ibn Hanbal's Fada'il al-Sahaba appeared; the edition was his doctoral thesis, printed by the university in 1403 AH and by Dar Ibn al-Jawzi in 1420 AH, with detailed notices of more than 1,762 transmitters and a grading of every chain."
  es: "Un erudito y editor contemporáneo de hadices, profesor asociado en la Universidad Umm al-Qura de La Meca cuando apareció la segunda edición de su edición crítica de Fada'il al-Sahaba de Ahmad ibn Hanbal; la edición fue su tesis doctoral, impresa por la universidad en 1403 AH y por Dar Ibn al-Jawzi en 1420 AH, con notas detalladas de más de 1762 transmisores y una clasificación de cada cadena."
  fr: "Érudit et éditeur contemporain de hadiths, professeur associé à l'université Umm al-Qura de La Mecque lors de la parution de la deuxième édition de son édition critique du Fada'il al-Sahaba d'Ahmad ibn Hanbal; cette édition était sa thèse de doctorat, imprimée par l'université en 1403 AH et par Dar Ibn al-Jawzi en 1420 AH, avec des notices détaillées de plus de 1 762 transmetteurs et une évaluation de chaque chaîne."
  ur: "ایک ہم عصر حدیث کے اسکالر اور مدیر، مکہ کی ام القریٰ یونیورسٹی میں ایسوسی ایٹ پروفیسر جب احمد بن حنبل کے فدائیل الصحابہ کے ان کے تنقیدی ایڈیشن کا دوسرا ایڈیشن شائع ہوا؛ ایڈیشن ان کا ڈاکٹریٹ کا مقالہ تھا، جسے یونیورسٹی نے 1403 ہجری میں اور دار ابن الجوزی نے 1420 ہجری میں چھاپا، جس میں 1,762 سے زیادہ ٹرانسمیٹر کے تفصیلی نوٹس اور ہر سلسلہ کی درجہ بندی تھی۔"
  tr: "Çağdaş bir hadis âlimi olan, Mekke'deki Um Al-Qura Üniversitesi'nde doçent, Ahmed bin Hanbal'in \"Fada'il al-Sahabe\" adlı kitabının ikinci baskısının yayımlanmasıyla birlikte; kitabın doğruluğu, üniversite tarafından 1403 Hicri'de yayımlanan doktora tezi, ardından 1420 Hicri'de Dar İbn el-Cewzi tarafından yayımlandı; burada 1.762'den fazla rivayetçinin biyografilerini yazdı ve aktarım zincirlerini değerlendirdi."
  id: "Seorang ulama hadis kontemporer, profesor madya di Universitas um Al-Qura di Mekah, setelah terbitnya edisi kedua dari buku \"Fada'il al-Sahabah\" karya Ahmad ibn Hanbal; verifikasi buku tersebut adalah tesis doktoralnya, yang diterbitkan oleh universitas pada tahun 1403 H, kemudian oleh Dar Ibn al-Jawzi pada tahun 1420 H, di mana ia menulis biografi lebih dari 1.762 narator dan menilai rantai transmisinya."
