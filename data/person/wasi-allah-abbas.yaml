  ar: "محقق محدث معاصر، أستاذ مشارك بجامعة أم القرى بمكة المكرمة عند صدور الطبعة الثانية من تحقيقه لكتاب «فضائل الصحابة» لأحمد بن حنبل؛ كان تحقيق الكتاب رسالته للدكتوراه، وطبعته الجامعة سنة 1403هـ ثم دار ابن الجوزي سنة 1420هـ، وترجم فيه لأكثر من 1762 راوياً وحكم على أسانيده."
  en: "A contemporary hadith scholar and editor, associate professor at Umm al-Qura University in Mecca when the second edition of his critical edition of Ahmad ibn Hanbal's Fada'il al-Sahaba appeared; the edition was his doctoral thesis, printed by the university in 1403 AH and by Dar Ibn al-Jawzi in 1420 AH, with detailed notices of more than 1,762 transmitters and a grading of every chain."
