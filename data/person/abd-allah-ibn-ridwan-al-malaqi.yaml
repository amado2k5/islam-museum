summary:
  ar: "عبد الله بن يوسف بن رضوان بن يوسف بن رضوان النجاري المالقي ثم الفاسي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} أخذ عن والده وخاله أبي الحاكم ابن القاضي أبي القاسم بن ربيع، وعن قاضي مالقة أحمد بن عبد الحق الجدلي، والقاضي أبي بكر بن منظور، وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} قال أبو زكريا السراج: شيخنا الفقيه الخطيب البليغ النحوي اللغوي الراوية المتفنن الناظم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} والتاريخ المكتوب في رأس الترجمة مشوّش في المسح، فلا يُعتمد عليه هنا."
  en: "Abd Allah ibn Yusuf ibn Ridwan ibn Yusuf ibn Ridwan al-Najjari al-Malaqi then al-Fasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He studied with his father, with his maternal uncle Abu al-Hakam, son of the judge Abu al-Qasim ibn Rabi', with the judge of Malaga Ahmad ibn Abd al-Haqq al-Judhami, with the judge Abu Bakr ibn Mansur, and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Abu Zakariyya al-Sarraj called him our shaykh, a jurist, an eloquent preacher, a grammarian, a philologist, a transmitter, and a versifier of many arts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} The dates in the heading are blurred in the scan and are not relied on here."
