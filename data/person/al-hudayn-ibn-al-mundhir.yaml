label: { ar: "الحضين بن المنذر", en: "al-Hudayn ibn al-Mundhir", es: "al-Hudayn ibn al-Mundhir", fr: "al-Hudayn ibn al-Mundhir", ur: "الحدین ابن المنذر" }
summary:
  ar: "الحضين بن المنذر؛ طلب إليه أهل خراسان أن يوليهم أمرهم لمحاربة قتيبة فأبى وأشار عليهم بوكيع بن حسان التميمي وقال لا يقوى على هذا الأمر غيره."
  en: "al-Hudayn ibn al-Mundhir; Khurasan's people begged him to lead them against Qutayba — he refused and pointed them to Waki' ibn Hassan, 'none else can bear it'."
  es: "al-Hudayn ibn al-Mundhir; la gente de Jorasán le rogó que los liderara contra Qutayba; él se negó y les señaló a Waki' ibn Hassan, 'nadie más puede soportarlo'."
  fr: "al-Hudayn ibn al-Mundhir; les habitants du Khorasan le supplièrent de les mener contre Qutayba — il refusa et les désigna vers Waki' ibn Hassan, « personne d'autre ne peut le supporter »."
  ur: "الحدین ابن المنذر؛ خراسان کے لوگوں نے اس سے التجا کی کہ وہ ان کو قطیبہ کے خلاف لے جائیں - اس نے انکار کر دیا اور وکیع بن حسن کی طرف اشارہ کیا، 'کوئی دوسرا یہ برداشت نہیں کر سکتا'۔"
  tr: "Al-Hudeyn ibn al-Mundhir; Horasan halkı, Kutteybe ile savaşma komutasını kendilerine vermesini istedi, ancak o reddetti ve bu konuyu başka kimsenin halledemeyeceğini söyleyerek Bukay' ibn Hassan al-Tamimi'ye danışmanlık yaptı."
  id: "Al-Hudayn ibn al-Mundhir; orang-orang Khurasan memintanya untuk mempercayakan komando mereka melawan Qutaybah, tetapi ia menolak dan menasihati mereka kepada Bukay' ibn Hassan al-Tamimi, mengatakan bahwa tidak ada orang lain yang mampu menangani masalah ini."
