summary:
  ar: "عالم حديث وأكاديمي تركي، وُلد في 25 ديسمبر 1960 في صاري قامش بولاية قارص، أكمل الماجستير سنة 1996 والدكتوراه سنة 2006 في علم الحديث بجامعة سلجوق، ويعمل عضو هيئة تدريس في كلية الإلهيات بجامعة يالوفا، وألّف كتبًا في الحديث ونقد الفكر الإسلامي الحديث وكتب عمودًا صحفيًا لسنوات. بلغت قناته على يوتيوب 112,000 مشترك كما في 16 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish hadith scholar and academic, born on 25 December 1960 in Sarıkamış, Kars. He completed his master's in 1996 and his doctorate in 2006 in hadith studies at Selçuk University, serves as a faculty member at Yalova University's theology faculty, and has written books on hadith and a critique of modern Islamic thought as well as a newspaper column for years. His YouTube channel counted 112,000 subscribers as of 16 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک عالمِ حدیث اور ماہرِ تعلیم، جو 25 دسمبر 1960ء کو قارص کے علاقے صاری قامش میں پیدا ہوئے، 1996ء میں ماسٹرز اور 2006ء میں سلجوق یونیورسٹی سے حدیث میں ڈاکٹریٹ مکمل کی، یالوفا یونیورسٹی کے شعبۂ الہیات میں استاد ہیں، اور حدیث اور جدید اسلامی فکر کی تنقید پر کتابیں لکھیں۔ vidIQ کے مطابق 16 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 112,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Erudito y académico turco especializado en hadices, nacido el 25 de diciembre de 1960 en Sarıkamış, Kars. Completó su maestría en 1996 y su doctorado en 2006 en estudios de hadices en la Universidad Selçuk. Es profesor en la facultad de teología de la Universidad de Yalova y ha escrito libros sobre hadices y una crítica del pensamiento islámico moderno, además de una columna periodística durante años. Su canal de YouTube contaba con 112 000 suscriptores al 16 de noviembre de 2026, según vidIQ (dato antiguo de la plataforma, no verificado por ningún museo)."
