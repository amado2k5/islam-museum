summary:
  ar: "القاضي كمال الدين أبو حامد الضرير؛ أجاز له السلفي وسمع من البوصيري والقاسم بن عساكر ودرس وأفتى واشتغل وجالس الملوك وتوفي في شوال {cite:shadharat-dhahab p. 307}."
  en: "The blind Egyptian qadi (b. 576) — ijaza from al-Silafi, hearing from al-Busiri and Ibn Asakir; he taught, gave fatwa and kept kings' company; d. Shawwal 659 {cite:shadharat-dhahab p. 307}."
  es: "El cadí egipcio ciego (n. 576) — ijaza de al-Silafi, habiendo escuchado a al-Busiri e Ibn Asakir; enseñó, dio fatwa y frecuentaba a los reyes; murió en Shawwal 659 {cita: shadharat-dhahab p. 307}."
  fr: "Le cadi égyptien aveugle (né en 576) — ijaza d'al-Silafi, ayant entendu d'al-Busiri et d'Ibn Asakir; il enseigna, donna des fatwas et fréquenta les rois; mort en Shawwal 659 {cite: shadharat-dhahab p. 307}."
  ur: "نابینا مصری قادی ⁦(متوفی 576)⁩ - السلفی سے اعجاز، البصیری اور ابن عساکر سے سماع؛ اس نے پڑھایا، فتویٰ دیا اور بادشاہوں کی صحبت رکھی۔ d شوال 659 {حوالہ: شدّرت ذہب ص 307}۔"
  tr: "Hakim Kamal al-Din Ebu Hamid el-Darir; Selefiler tarafından yetkilendirildi, el-Busiri ve el-Kasim ibn Asakir'den dinlendi, ders verdi, fetva verdi, nişanlandı, krallarla oturdu ve Şevval'de öldü {atıf:şadharat-dhahab, s. 307}."
  id: "Hakim Kamal al-Din Abu Hamid al-Darir; ia diberi wewenang oleh Salafi, mendengar dari al-Busiri dan al-Qasim ibn Asakir, mengajar, mengeluarkan fatwa, bertunangan, duduk bersama raja, dan meninggal di Shawwal {cite:shadharat-dhahab, hlm. 307}."
