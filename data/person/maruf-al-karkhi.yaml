  tr: "Ja'far al-Khaldi'nin anlattığı tasavvuf serisinde Ma'ruf al-Karkhi şöyle bir şey yaşamıştır: O, el-Sari'yi Ma'ruf al-Karkhi'den, Ma'ruf al-Karkhi Farqad el-Sanji'den, Farqud ise el-Hasan el-Basri'den almıştır {atıf:fihrist-ibn-al-nadim s. 260}."
  id: "Ma'ruf al-Karkhi dalam seri Sufi yang diceritakan oleh Ja'far al-Khaldi: Ia mengambil al-Sari dari Ma'ruf al-Karkhi, dan Ma'ruf al-Karkhi mengambil dari Farqad al-Sanji, dan Farqud mengambil dari al-Hasan al-Basri {cite:fihrist-ibn-al-nadim hlm. 260}."
