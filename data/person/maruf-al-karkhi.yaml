  ar: "معروف الكرخي في سلسلة التصوف التي رواها جعفر الخلدي: أخذ السري عن معروف الكرخي وأخذ معروف الكرخي عن فرقد السنجي وأخذ فرقد عن الحسن البصري {cite:fihrist-ibn-al-nadim p. 260}."
