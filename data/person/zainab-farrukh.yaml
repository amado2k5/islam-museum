summary:
  ar: "طبيبة نفسية سريرية ومعالجة متخصصة في الصدمات، وهي الممارسة الوحيدة خلف «مسلمة ويلنس»، ممارسة علاج نفسي عبر الإنترنت للنساء المسلمات. تحمل ماجستير علم النفس السريري من جامعة العلوم والتكنولوجيا الوطنية (NUST) وماجستير علم النفس من جامعة قائد أعظم ودبلومًا في الإرشاد والعلاج النفسي التكاملي، ولها أكثر من سبع سنوات من الممارسة السريرية، منها ثلاث سنوات في باكستان وعمل سابق مع «تيلوس هيلث»؛ وتخدم عميلات في أمريكا الشمالية والمملكة المتحدة والشرق الأوسط وباكستان بالإنجليزية والأردية، وكتبت مقالات في علم النفس لموقع «أباوت إسلام»."
  en: "Clinical psychologist and trauma-informed therapist, and the sole practitioner behind Muslimah Wellness, an online therapy practice for Muslim women. She holds a master's in Clinical Psychology from the National University of Sciences and Technology (NUST), a master's in Psychology from Quaid-e-Azam University and a diploma in integrative counselling and psychotherapy, and has more than seven years of clinical practice, including three years in Pakistan and prior work with Telus Health. She serves clients across North America, the UK, the Middle East and Pakistan in English and Urdu, and has written on psychology for About Islam."
  ur: "بالینی نفسیات کی ماہرہ اور صدمے سے آگاہ معالجہ، اور «مسلمہ ویلنیس» — مسلمان خواتین کے لیے آن لائن تھراپی کی ممارست — کے پیچھے واحد ممارس۔ ان کے پاس نیشنل یونیورسٹی آف سائنسز اینڈ ٹیکنالوجی (NUST) سے طبی نفسیات میں ماسٹرز، قائداعظم یونیورسٹی سے نفسیات میں ماسٹرز اور تکاملی مشاورت و نفسیاتی علاج میں ڈپلوما ہے، اور سات سال سے زائد طبی ممارست ہے، بشمول پاکستان میں تین سال اور «ٹیلوس ہیلتھ» کے ساتھ سابقہ کام؛ وہ شمالی امریکہ، برطانیہ، مشرقِ وسطیٰ اور پاکستان میں انگریزی اور اردو میں خواتین مؤکلات کی خدمت کرتی ہیں، اور «اباؤٹ اسلام» کے لیے نفسیات پر مضامین لکھ چکی ہیں۔"
