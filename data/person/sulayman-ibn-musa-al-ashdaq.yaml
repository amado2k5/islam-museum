summary:
  ar: "سليمان بن موسى الأشدق، أبو أيوب، ويقال أبو هشام وأبو ربيع، الإمام الكبير، مفتي دمشق، وكان من كبار أصحاب مكحول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} قال أبو حاتم: محله الصدق، وفي حديثه بعض الاضطراب، ولا أعلم أحداً من أصحاب مكحول أفقه منه ولا أثبت منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} والمصادر المذكورة: سير أعلام النبلاء، وطبقات الفقهاء للشيرازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} وفي رأس الترجمة تاريخان مطبوعان على نحو «١١٩-٢ه»، غالب الظن أنهما «د. ١١٩ه»، ولم تتضح الأرقام تماماً في المسح فلا يُثبت تاريخ هنا."
  en: "Sulayman ibn Musa al-Ashdaq, Abu Ayyub — also called Abu Hisham and Abu Rabi' — a great imam and the mufti of Damascus, among the foremost disciples of Makhul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Abu Hatim said of him that his standing is truthfulness though his hadith shows some wavering, and that he knew no disciple of Makhul more learned in fiqh or more firmly grounded than him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} The cited sources are Siyar a'lam al-nubala' and al-Shirazi's Tabaqat al-fuqaha'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} The heading prints two figures in the form \"119-2 AH\", most plausibly \"d. 119 AH\", but the digits are not fully clear in the scan so no date is stated here."
  es: "Sulayman ibn Musa al-Ashdaq, Abu Ayyub —también llamado Abu Hisham y Abu Rabi'— un gran imán y muftí de Damasco, entre los discípulos más destacados de Makhul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Abu Hatim dijo de él que su reputación es la veracidad, aunque su hadiz muestra cierta vacilación, y que no conocía a ningún discípulo de Makhul más erudito en fiqh ni más firmemente fundamentado que él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Las fuentes citadas son Siyar a'lam al-nubala' y Tabaqat al-fuqaha' de al-Shirazi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} El encabezado imprime dos cifras en el formato \"119-2 AH\", muy probablemente \"m. 119 AH\", pero los dígitos no son completamente claros en el escaneo, por lo que no se indica ninguna fecha aquí."
  fr: "Sulayman ibn Musa al-Ashdaq, dit Abu Ayyub (également appelé Abu Hisham et Abu Rabi'), grand imam et mufti de Damas, fut l'un des plus éminents disciples de Makhul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Abu Hatim a dit de lui que sa réputation repose sur la véracité, malgré quelques hésitations dans ses hadiths, et qu'il ne connaissait aucun disciple de Makhul plus savant en fiqh ni plus solidement ancré dans la tradition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Les sources citées sont Siyar a'lam al-nubala' et Tabaqat al-fuqaha' d'al-Shirazi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} L'en-tête imprime deux chiffres sous la forme « 119-2 AH », probablement « d. 119 AH », mais les chiffres ne sont pas entièrement clairs dans le scan, donc aucune date n'est indiquée ici."
  ur: "سلیمان بن موسیٰ الاشدق، ابو ایوب - جنہیں ابو ہشام اور ابو ربیع بھی کہا جاتا ہے - ایک عظیم امام اور دمشق کے مفتی، مکول کے اولین شاگردوں میں سے تھے۔ ابو حاتم نے ان کے بارے میں کہا کہ ان کا موقف حق پر ہے حالانکہ اس کی حدیث میں کچھ ڈگمگاتی نظر آتی ہے اور وہ مکول کے کسی شاگرد کو نہیں جانتے تھے جو ان سے زیادہ فقہ کا ماہر ہو اور نہ ہی ان سے زیادہ پختہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18073} حوالہ کردہ ماخذ سیار اعلام النبلاء اور الشیرازی کی طبقات الفقہاء ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 18073} سرخی میں دو اعداد \"119-2 ہجری\" کی شکل میں چھاپے گئے ہیں، زیادہ تر ممکنہ طور پر \"متوفی 119 ہجری\"، لیکن ہندسے سکین میں مکمل طور پر واضح نہیں ہیں اس لیے یہاں کوئی تاریخ بیان نہیں کی گئی ہے۔"
