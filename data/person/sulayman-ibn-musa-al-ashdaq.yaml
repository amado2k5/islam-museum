summary:
  ar: "سليمان بن موسى الأشدق، أبو أيوب، ويقال أبو هشام وأبو ربيع، الإمام الكبير، مفتي دمشق، وكان من كبار أصحاب مكحول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} قال أبو حاتم: محله الصدق، وفي حديثه بعض الاضطراب، ولا أعلم أحداً من أصحاب مكحول أفقه منه ولا أثبت منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} والمصادر المذكورة: سير أعلام النبلاء، وطبقات الفقهاء للشيرازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} وفي رأس الترجمة تاريخان مطبوعان على نحو «١١٩-٢ه»، غالب الظن أنهما «د. ١١٩ه»، ولم تتضح الأرقام تماماً في المسح فلا يُثبت تاريخ هنا."
  en: "Sulayman ibn Musa al-Ashdaq, Abu Ayyub — also called Abu Hisham and Abu Rabi' — a great imam and the mufti of Damascus, among the foremost disciples of Makhul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} Abu Hatim said of him that his standing is truthfulness though his hadith shows some wavering, and that he knew no disciple of Makhul more learned in fiqh or more firmly grounded than him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} The cited sources are Siyar a'lam al-nubala' and al-Shirazi's Tabaqat al-fuqaha'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18073} The heading prints two figures in the form \"119-2 AH\", most plausibly \"d. 119 AH\", but the digits are not fully clear in the scan so no date is stated here."
