summary:
  ar: "زعيم فلاحي وسياسي بنغلاديشي (1880–1976)، يُعرف بالمولانا الأحمر، تتلمذ على البير سيد ناصر الدين البغدادي ودرس في ديوبند، وقاد حركات الفلاحين في آسام والبنغال، وأسس رابطة مسلمي عوامي سنة 1949 وحزب عوامي الوطني سنة 1957، وبقي مرجعًا للمعارضة اليسارية والإسلامية الشعبية حتى وفاته في دكا في 17 نوفمبر 1976."
  en: "Bangladeshi peasant leader and politician (1880–1976), known as the Red Maulana, who was taken as a disciple by the pir Sayyid Nasir al-Din al-Baghdadi and studied at Deoband, led peasant movements in Assam and Bengal, founded the Awami Muslim League in 1949 and the National Awami Party in 1957, and remained a reference point for leftist and populist-Islamic opposition until his death at Dhaka on 17 November 1976."
  ur: "بنگلہ دیشی کسان رہنما اور سیاست دان (1880ء–1976ء)، «سرخ مولانا» کے نام سے مشہور، پیر سید ناصر الدین بغدادی کے مرید بنے اور دیوبند میں تعلیم پائی، آسام اور بنگال میں کسان تحریکوں کی قیادت کی، 1949ء میں عوامی مسلم لیگ اور 1957ء میں نیشنل عوامی پارٹی کی بنیاد رکھی اور 17 نومبر 1976ء کو ڈھاکہ میں وفات تک بائیں بازو اور عوامی اسلامی اپوزیشن کا مرکز رہے۔"
