summary:
  ar: "كاتب وناقد أدبي ومربٍّ تتاري قرمي من حلقة إسماعيل غاسبرينسكي: نشر في «ترجمان» غاسبرينسكي طالبا في إسطنبول ثم حرّرها من سنة 1914، وحرّر جريدة «ملت» سنة 1917 وترأس القورولتاي القرمي مرتين سنة 1918. اعتقلته المفوضية الشعبية للشؤون الداخلية سنة 1937 بعد اعتقال أول سنة 1930، وأُعدم رميا في 17 أبريل 1938."
  en: "Crimean Tatar writer, literary critic and educator of Ismail Gasprinsky's circle: a contributor to Gasprinsky's Tercüman as a student in Istanbul and its editor from 1914, editor of the newspaper Millet in 1917 and twice chairman of the Crimean Qurultay in 1918. Arrested by the NKVD in 1937 after an earlier arrest in 1930, he was shot on 17 April 1938."
  ur: "کریمیائی تاتاری مصنف، ادبی نقاد اور معلم؛ اسماعیل گاسپرینسکی کے حلقے سے وابستہ۔ استنبول میں طالب علمی کے دوران گاسپرینسکی کے «ترجمان» میں لکھا اور 1914 سے اس کے مدیر رہے، 1917 میں اخبار «ملت» کی ادارت کی اور 1918 میں دو بار کریمیائی قرولتائی کے چیئرمین رہے۔ 1930 کی پہلی گرفتاری کے بعد 1937 میں دوبارہ گرفتار ہوئے اور 17 اپریل 1938 کو گولی مار کر شہید کیے گئے۔"
  es: "Escritor tártaro de Crimea, crítico literario y educador del círculo de Ismail Gasprinsky: colaboró con la revista Tercüman de Gasprinsky cuando era estudiante en Estambul y fue su editor desde 1914, editor del periódico Millet en 1917 y presidente en dos ocasiones del Qurultay de Crimea en 1918. Arrestado por el NKVD en 1937 tras un arresto anterior en 1930, fue fusilado el 17 de abril de 1938."
  fr: "Écrivain, critique littéraire et éducateur tatar de Crimée, proche du cercle d'Ismail Gasprinsky: collaborateur du Tercüman de Gasprinsky lorsqu'il était étudiant à Istanbul, puis rédacteur en chef à partir de 1914, rédacteur en chef du journal Millet en 1917 et deux fois président du Qurultay de Crimée en 1918. Arrêté par le NKVD en 1937 après une première arrestation en 1930, il fut fusillé le 17 avril 1938."
  tr: "İsmail Gasperinsky çevresinden yazar, edebiyat eleştirmeni ve Kırım Tatar eğitimcisi: İstanbul'da öğrenciyken Tarjuman'da yayımladı, ardından 1914'te editörlüğünü yaptı, 1917'de 'Melt' gazetesini yönetti ve 1918'de iki kez Kırım Koroltai'nin başında oldu. İlk tutuklanmasının ardından 1937'de İçişleri Halk Komiserliği tarafından tutuklandı ve 17 Nisan 1938'de kurşuna dizilerek idam edildi."
  id: "Seorang penulis, kritikus sastra, dan pendidik Tatar Krimea dari lingkaran Ismail Gasperinsky: Ia menerbitkan karya di Tarjuman' saat masih mahasiswa di Istanbul, kemudian mengeditnya pada tahun 1914, mengedit surat kabar 'Melt' pada tahun 1917, dan memimpin Korortai Krimea dua kali pada tahun 1918. Ia ditangkap oleh Komisariat Rakyat untuk Urusan Dalam Negeri pada tahun 1937 setelah penangkapan pertamanya pada tahun 1930, dan dieksekusi dengan regu tembak pada 17 April 1938."
