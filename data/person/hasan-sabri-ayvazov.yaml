summary:
  ar: "كاتب وناقد أدبي ومربٍّ تتاري قرمي من حلقة إسماعيل غاسبرينسكي: نشر في «ترجمان» غاسبرينسكي طالبا في إسطنبول ثم حرّرها من سنة 1914، وحرّر جريدة «ملت» سنة 1917 وترأس القورولتاي القرمي مرتين سنة 1918. اعتقلته المفوضية الشعبية للشؤون الداخلية سنة 1937 بعد اعتقال أول سنة 1930، وأُعدم رميا في 17 أبريل 1938."
  en: "Crimean Tatar writer, literary critic and educator of Ismail Gasprinsky's circle: a contributor to Gasprinsky's Tercüman as a student in Istanbul and its editor from 1914, editor of the newspaper Millet in 1917 and twice chairman of the Crimean Qurultay in 1918. Arrested by the NKVD in 1937 after an earlier arrest in 1930, he was shot on 17 April 1938."
  ur: "کریمیائی تاتاری مصنف، ادبی نقاد اور معلم؛ اسماعیل گاسپرینسکی کے حلقے سے وابستہ۔ استنبول میں طالب علمی کے دوران گاسپرینسکی کے «ترجمان» میں لکھا اور 1914 سے اس کے مدیر رہے، 1917 میں اخبار «ملت» کی ادارت کی اور 1918 میں دو بار کریمیائی قرولتائی کے چیئرمین رہے۔ 1930 کی پہلی گرفتاری کے بعد 1937 میں دوبارہ گرفتار ہوئے اور 17 اپریل 1938 کو گولی مار کر شہید کیے گئے۔"
