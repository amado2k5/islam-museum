summary:
  ar: "القاضي ابن غنائم بن العديم الحلبي الشيخ الصالح من بيت العديم قضاة ومؤرخي حلب؛ قال ابن الأثير: كان من المجتهدين في العبادة والرياضة والعاملين بعلمهم، فلو قال قائل إنه لم يكن في زمانه أعبد منه لكان صادقاً، فإنه من جملة شيوخنا سمعنا عليه الحديث وانتفعنا برؤيته وكلامه؛ توفي سنة ثمان وعشرين وستمائة {cite:kamil-ibn-al-athir p. 439}."
  en: "The Aleppine qadi of the Ibn al-Adim house — 'one of the devout who act on their knowledge; if one said none in his age worshipped more, he would speak truth — he is of our teachers; we heard hadith from him' — died 628 {cite:kamil-ibn-al-athir p. 439}."
