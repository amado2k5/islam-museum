id: person/al-mustajir-billah
class: person
label: { ar: "المستجير بالله العباسي", en: "al-Mustajir bi'llah al-Abbasi", fr: "al-Mustajir bi'llah al-Abbasi", es: "al-Mustajir bi'llah al-Abbasi", ur: "المستجر باللہ العباسی" }
summary:
  ar: "ابن لعيسى بن المكتفي بالله ظهر بناحية أرمينية وموقان سنة 349هـ يلقب بالمستجير بالله يدعو إلى المرتضى من آل رسول الله ويلبس الصوف ويأمر بالمعروف فتبعه جماعة فسار إلى آذربيجان فقلب على عدة بلدان منها ثم حورب فأخذ {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "A son of Isa ibn al-Muktafi who appeared in Armenia and Muqan in 349 styling himself al-Mustajir-billah, wearing wool and summoning to 'the accepted one of the Prophet's house'; he won followers, swept several towns of Adharbayjan, then was fought and taken {cite:muntazam-ibn-al-jawzi p. 687}."
  fr: "Un fils d'Isa ibn al-Muktafi qui est apparu en Arménie et Muqan en 349 se coiffant al-Mustajir-billah, portant de la laine et convoquant « l'accepté de la maison du Prophète » ; il a gagné des partisans, balayé plusieurs villes d'Adharbayjan, puis a été combattu et pris {cite:muntazam-ibn-al-jawzi p. 687}."
  es: "Un hijo de Isa ibn al-Muktafi que apareció en Armenia y Muqan en 349 haciéndose llamar al-Mustajir-billah, vistiendo lana y llamando a 'el aceptado de la casa del Profeta'; ganó seguidores, arrasó varias ciudades de Adharbayjan, luego fue combatido y capturado {cite:muntazam-ibn-al-jawzi p. 687}."
  ur: "عیسیٰ ابن المکتفی کا ایک بیٹا جو 349 میں آرمینیا اور مقان میں نمودار ہوا، اپنے آپ کو المستاجیر باللہ کا اسٹائل بنا کر، اون پہنے ہوئے اور 'پیغمبر کے گھر میں سے ایک قبول کرنے والے' کو بلایا؛ اس نے پیروکاروں کو جیت لیا، ادھربایجان کے کئی قصبوں پر قبضہ کیا، پھر لڑا اور پکڑا گیا۔ 687}۔"
  tr: "İbn La'Isa ibn al-Muktafi Billah, 349 Hicri yılında Ermeni'nin Mukan bölgesinde ortaya çıktı ve El-Mustajir Billah lakabıyla tanındı. El-Murtadha'ya Allah'ın El-Elçisinin ailesinden çağrıda bulundu, yün giydi ve iyilik için emretti. Bir grup onu takip etti, ardından Azerbaycan'a yürüdü, birkaç şehrini fethetti, ardından savaştı ve aldı {atıf:Muntazam-ibn-al-Jawzi, s. 687}."
  id: "Ibn La'Isa ibn al-Muktafi Billah muncul di wilayah Armenia Muqan pada tahun 349 H, dijuluki Al-Mustajir Billah. Ia memanggil Al-Murtadha dari keluarga Rasulullah, mengenakan wol, dan memerintahkan kebaikan. Sekelompok orang mengikutinya, lalu berbaris ke Azerbaijan, menaklukkan beberapa kotanya, kemudian bertempur dan merebut {cite:muntazam-ibn-al-jawzi, hlm. 687}."
