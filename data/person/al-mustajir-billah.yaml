  en: "A son of Isa ibn al-Muktafi who appeared in Armenia and Muqan in 349 styling himself al-Mustajir-billah, wearing wool and summoning to 'the accepted one of the Prophet's house'; he won followers, swept several towns of Adharbayjan, then was fought and taken {cite:muntazam-ibn-al-jawzi p. 687}."
