summary:
  ar: "مؤرخ من القرن التاسع الهجري، كتب مع أولغ بيك عرضا لحوادث فروع الإمبراطورية المغولية الأربعة، ولم يستنيرا برشيد الدين بل فضلا روايات أخرى {cite:jami-al-tawarikh-khashshab-1960 p. 156}{cite:jami-al-tawarikh-khashshab-1960 p. 157}. واعتمد في بداية عهد جنكيزخان ومفاخره على قصص بعيدة عن الحقيقة، بحسب قراءة الخشاب {cite:jami-al-tawarikh-khashshab-1960 p. 157}، وأخذ عنه ميرخوند وخوندمير ما يقع فيه من أخطاء {cite:jami-al-tawarikh-khashshab-1960 p. 157}."
  en: "A historian of the ninth century AH who, with Ulugh Beg, presented the events of the four branches of the Mongol empire. They did not use Rashid al-Din and preferred other accounts {cite:jami-al-tawarikh-khashshab-1960 p. 156}{cite:jami-al-tawarikh-khashshab-1960 p. 157}. According to the editor, their account of the beginnings of Genghis Khan and his glories rests on stories far from the truth, and Mirkhwand and Khwandamir followed them in these errors {cite:jami-al-tawarikh-khashshab-1960 p. 157}."
  es: "Historiador del siglo IX de la Hégira que, junto con Ulugh Beg, presentó los sucesos de las cuatro ramas del imperio mongol. No utilizaron a Rashid al-Din y prefirieron otras narraciones {cite:jami-al-tawarikh-khashshab-1960 p. 156}{cite:jami-al-tawarikh-khashshab-1960 p. 157}. Según el editor, su relato de los orígenes de Genghis Khan se apoya en historias alejadas de la verdad, y Mirkhwand y Khwandamir siguieron sus errores {cite:jami-al-tawarikh-khashshab-1960 p. 157}."
  fr: "Historien du IXe siècle de l'Hégire qui, avec Ulugh Beg, exposa les événements des quatre branches de l'empire mongol. Ils ne se servirent pas de Rashid al-Din et préférèrent d'autres récits {cite:jami-al-tawarikh-khashshab-1960 p. 156}{cite:jami-al-tawarikh-khashshab-1960 p. 157}. Selon l'éditeur, leur récit des débuts de Gengis Khan repose sur des histoires éloignées de la vérité, que Mirkhwand et Khwandamir reprirent à leur suite {cite:jami-al-tawarikh-khashshab-1960 p. 157}."
  ur: "نویں صدی ہجری کا مؤرخ، جس نے الغ بیگ کے ساتھ منگول سلطنت کی چاروں شاخوں کے واقعات پیش کیے۔ دونوں نے رشید الدین سے استفادہ نہیں کیا اور دوسری روایات کو ترجیح دی {cite:jami-al-tawarikh-khashshab-1960 p. 156}{cite:jami-al-tawarikh-khashshab-1960 p. 157}۔ مرتب کے مطابق چنگیز خان کے آغاز اور اس کی عظمت کا بیان حقیقت سے دور کہانیوں پر مبنی ہے، اور میرخواند و خواندمیر نے ان غلطیوں میں ان کی پیروی کی {cite:jami-al-tawarikh-khashshab-1960 p. 157}۔"
  tr: "9. yüzyıl Hicri tarihçisi olan Han, Ulugh Beg ile birlikte Moğol İmparatorluğu'nun dört kolunun olaylarını sunan bir yazı yazdı. Bu olaylar Raşiddin tarafından aydınlanmamış, daha çok başka anlatımları tercih etmişlerdir {cite:jami-al-tawarikh-khashshab-1960 s. 156} {cite:jami-al-tawarikh-khashshab-1960 s. 157}. Cengiz Han'ın saltanatının ve görkemlerinin başında, Hashab okumasına göre gerçek dışı hikayelere dayandı {cite:jami-al-tawarikh-khashshab-1960 s. 157} ve Mirkhund ile Khundmir onun yaptığı hataları ondan öğrendi {cite:jami-al-tawarikh-khashshab-1960 s. 157}."
  id: "Sebagai sejarawan Hijriyah abad ke-9, ia menulis bersama Ulugh Beg untuk menyajikan peristiwa dari empat cabang Kekaisaran Mongol. Mereka tidak mendapat pencerahan dari Rashid al-Din, melainkan lebih memilih kisah lain {cite:jami-al-tawarikh-khashshab-1960 hlm. 156} {cite:jami-al-tawarikh-khashshab-1960 hlm. 157}. Pada awal masa pemerintahan dan kejayaan Genghis Khan, ia mengandalkan cerita-cerita yang jauh dari kebenaran, menurut bacaan Khashab {cite:jami-al-tawarikh-khashshab-1960 hlm. 157}, dan Mirkhund serta Khundmir belajar darinya kesalahan yang ia buat {cite:jami-al-tawarikh-khashshab-1960 hlm. 157}."
