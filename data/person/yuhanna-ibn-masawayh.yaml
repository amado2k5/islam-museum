id: person/yuhanna-ibn-masawayh
class: person
label: { ar: "يوحنا بن ماسويه", en: "Yuhanna Ibn Masawayh", es: "Yuhanna Ibn Masawayh", fr: "Yuhanna Ibn Masawayh", ur: "یوحنا ابن مساویہ" }
summary:
  ar: "يوحنا بن ماسويه ممن أنفذ إلى بلد الروم في رواية {cite:fihrist-ibn-al-nadim p. 339}. وكان فاضلا طبيبا مقدما عند الملوك عالما مصنفا خدم المأمون والمعتصم والواثق والمتوكل، وعبث ابن حمدون النديم بابن ماسويه بحضرة المتوكل فقال له ابن ماسويه لو أن مكان ما فيك من الجهل عقل ثم قسم على مائة خنفساء لكانت كل واحدة منهن أعقل من أرستاليس {cite:fihrist-ibn-al-nadim p. 411}"
  en: "Yuhanna b. Masawayh — reported among those sent to Byzantium {cite:fihrist-ibn-al-nadim}"
  es: "Yuhanna b. Masawayh — mencionado entre los enviados a Bizancio {cite:fihrist-ibn-al-nadim}"
  fr: "Yuhanna b. Masawayh — mentionné parmi ceux envoyés à Byzance {cite:fihrist-ibn-al-nadim}"
  ur: "یوہانا بی۔ مساویہ - بازنطیم کو بھیجے جانے والوں میں سے رپورٹ کیا گیا"
  tr: "Yuhanna ibn Masawayh, rivayette Romalıların topraklarına gönderilenler arasındaydı {atıf:fihrist-ibn-al-nadim s. 339}. O, erdemliydi, krallara takdir edilen bir hekim, alim ve al-Ma'mun, al-Mu'tasim, al-Wathiq ve al-Mutawakkil'e hizmet eden bir yazardı. İbn Hamdun el-Nadim, el-Mutevakkil'in huzurunda İbn Masawayh ile oynadı. İbn Masawayh ona şöyle dedi: 'Eğer biraz cehaletin olsaydı ve sonra yüz böceğe böldüysen, her biri Aristalis'ten daha bilge olurdu {atıf:fihrist-ibn-al-nadim s. 411}"
  id: "Yuhanna ibn Masawayh termasuk di antara mereka yang dikirim ke tanah Romawi dalam riwayat {cite:fihrist-ibn-al-nadim hlm. 339}. Ia berbudi luhur, seorang tabib yang dipresentasikan kepada raja, seorang cendekiawan, dan penulis yang melayani al-Ma'mun, al-Mu'tasim, al-Wathiq, dan al-Mutawakkil. Ibn Hamdun al-Nadim mengganggu Ibn Masawayh di hadapan al-Mutawakkil. Ibn Masawayh berkata kepadanya, 'Jika kau memiliki sedikit ketidaktahuan dan kemudian membagi di antara seratus kumbang, masing-masing akan lebih bijak daripada Aristalis {cite:fihrist-ibn-al-nadim hlm. 411}"
