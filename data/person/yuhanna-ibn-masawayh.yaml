  ar: "يوحنا بن ماسويه ممن أنفذ إلى بلد الروم في رواية {cite:fihrist-ibn-al-nadim p. 339}. وكان فاضلا طبيبا مقدما عند الملوك عالما مصنفا خدم المأمون والمعتصم والواثق والمتوكل، وعبث ابن حمدون النديم بابن ماسويه بحضرة المتوكل فقال له ابن ماسويه لو أن مكان ما فيك من الجهل عقل ثم قسم على مائة خنفساء لكانت كل واحدة منهن أعقل من أرستاليس {cite:fihrist-ibn-al-nadim p. 411}"
