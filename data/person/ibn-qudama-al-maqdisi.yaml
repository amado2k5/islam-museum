summary:
  ar: "موفق الدين أبو محمد عبد الله بن أحمد بن محمد بن قدامة المقدسي ثم الدمشقي الصالحي (541–620هـ)، شيخ الحنابلة في زمانه وصاحب «المغني» و«الكافي» و«المقنع» و«العمدة» و«روضة الناظر» و«لمعة الاعتقاد». ولد بجمّاعيل من أرض نابلس، وقدم دمشق مع أهله وله عشر سنين، ورحل إلى بغداد سنة 561هـ مع ابن خالته الحافظ عبد الغني فقرأ على الشيخ عبد القادر الجيلاني مدة يسيرة ثم لازم أبا الفتح ابن المنّي. ينقل ابن رجب في ترجمته ثناء ابن النجار وأبي شامة وعمر بن الحاجب وابن الصلاح والعز بن عبد السلام وابن تيمية عليه، ويصف طريقته في أصول الدين على طريقة أئمة الحديث في إمرار الصفات من غير تأويل ولا تكييف. توفي يوم عيد الفطر سنة 620هـ بمنزله بدمشق ودفن بسفح قاسيون {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 133-142}."
  en: "Muwaffaq al-Din Abu Muhammad Abd Allah ibn Ahmad ibn Muhammad ibn Qudama al-Maqdisi, later of Damascus and al-Salihiyya (541–620 AH), the leading Hanbali of his time and author of al-Mughni, al-Kafi, al-Muqni', al-Umda, Rawdat al-Nazir and Lum'at al-I'tiqad. Born at Jamma'il in the land of Nablus, he came to Damascus with his family aged ten and travelled to Baghdad in 561 AH with his cousin the hafiz Abd al-Ghani, studying briefly with Shaykh Abd al-Qadir al-Jilani and then closely with Abu al-Fath Ibn al-Manni. Ibn Rajab's entry gathers the praise of Ibn al-Najjar, Abu Shama, Umar ibn al-Hajib, Ibn al-Salah, al-Izz ibn Abd al-Salam and Ibn Taymiyya, and describes his creed as following the hadith imams in passing over the divine attributes as they came, without figurative interpretation or asking how. He died on the day of Eid al-Fitr 620 AH at his home in Damascus and was buried on the slope of Qasyun."
