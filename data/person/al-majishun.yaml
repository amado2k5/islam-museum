  id: "Abd al-Malik ibn Abd al-Aziz ibn Abdullah ibn Abi Salamah al-Majshoon, dan gelar Abu Salamah diberikan oleh gelar ini Sukayna bint al-Husayn. Majishun adalah pewarna yang berbasis di Madinah. Ia termasuk di antara sahabat terkemuka Malik dan menulis buku-buku tentang hukum yang disusun {cite:fihrist-ibn-al-nadim hlm. 281}."
