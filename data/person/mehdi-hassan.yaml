summary:
  ar: "مغنٍّ باكستاني للغزل والأغاني المصوّرة (1927–2012)، وُلد في لونا بولاية راجستان لأسرة من موسيقيي البلاط الوراثيين، ولُقّب «شاهنشاه الغزل»؛ هاجر إلى باكستان سنة 1947، وغنّى في أكثر من ثلاثمئة فيلم، ونال فخر الأداء (1985) ونيشان الامتياز (2006) وهلال الامتياز (2010)."
  en: "Pakistani ghazal and playback singer (1927–2012), born at Luna in Rajasthan into a family of hereditary Kalawant musicians and known as Shahenshah-e-Ghazal, 'Emperor of Ghazal'; he migrated to Pakistan in 1947, sang for more than 300 films and received the Pride of Performance (1985), the Nishan-e-Imtiaz (2006) and the Hilal-e-Imtiaz (2010)."
  ur: "پاکستانی غزل و پسِ پردہ گلوکار (1927ء–2012ء)، جو راجستھان کے لونا میں کلاونت موسیقاروں کے گھرانے میں پیدا ہوئے اور «شہنشاہِ غزل» کہلائے؛ 1947ء میں پاکستان ہجرت کی، تین سو سے زائد فلموں کے لیے گایا اور پرائیڈ آف پرفارمنس (1985ء)، نشانِ امتیاز (2006ء) اور ہلالِ امتیاز (2010ء) سے نوازے گئے۔"
