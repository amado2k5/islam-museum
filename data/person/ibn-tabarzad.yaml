summary:
  ar: "أبو حفص عمر بن أبي بكر محمد بن معمر بن أحمد بن يحيى المؤدب المعروف بابن طبرزذ؛ المحدث المشهور البغدادي الملقب موفق الدين؛ من ساكني محلة دار القز ولذا عُرف بالدارقزي؛ أسمعه أخوه الأكبر أبو البقاء محمد كثيراً من الحديث ثم استقل بإفادة نفسه وعمّر حتى حدّث سنين؛ جمع له ابن المديني مشيخة في جزأين وبعض ثالث فيها ثلاثة وثمانون شيخاً؛ وكان عالي الإسناد طاف البلاد وأفاد أهلها وألحق الأصاغر بالأكابر وطبق الأرض بالسماعات والإجازات وامتدت له الحياة فخلا له العصر {cite:wafayat-ayan}."
  en: "Muwaffaq al-Din Ibn Tabarzad (516–607) — Baghdad's long-lived muhaddith of Dar al-Qazz; his eighty-three-shaykh mashyakha and high isnad made him the last of his generation, crossing lands to grant ijazas {cite:wafayat-ayan}."
  es: "Muwaffaq al-Din Ibn Tabarzad (516–607): el longevo muhaddith de Dar al-Qazz en Bagdad; sus ochenta y tres shaykh mashyakha y su alto isnad lo convirtieron en el último de su generación, cruzando tierras para otorgar ijazas {cita:wafayat-ayan}."
  fr: "Muwaffaq al-Din Ibn Tabarzad (516-607) — le muhaddith de Dar al-Qazz de Bagdad; ses quatre-vingt-trois shaykh mashyakha et son haut isnad ont fait de lui le dernier de sa génération, traversant des terres pour accorder des ijazas {cite: wafayat-ayan}."
  ur: "موفق الدین ابن تبرزاد (516-607) - بغداد کے دارالقضاء کے طویل المدت محدث؛ ان کے تراسی شیخ مشائخ اور اعلیٰ اسناد نے انہیں اپنی نسل کا آخری شخص بنا دیا، جس نے اُجازات دینے کے لیے زمینوں کو عبور کیا۔"
  tr: "Ebu Hafs Ömer bin Ebi Bekir Muhammed bin Muammer bin Ahmed ibn Yahya al-Muaddib, İbn Tabarzdhah olarak bilinir; ünlü Bağdadî hadis âlimi Muwafaq al-Din lakaplı; Dar al-Kız mahallesinde yaşayan bir kişi, bu nedenle el-Derkızi olarak bilinir; ağabeyi Ebu el-Baka Muhammed çok hadis duymuş, sonra birkaç yıl kendi ve Ömer'e güvenmiş, yıllarca rivsaletçi olmuştur. İbn el-Madini iki şeyhini iki ciltte derlemiştir ve üçüncüsünde seksen üç şeyh bulunmaktadır. Ülkeyi dolaşan, halkına fayda sağlayan, gençleri yaşlılarla bağlayan ve toprağı dinleyiciler ve icatlarla döşeyen yüksek bir aktarım zincirine sahipti. Hayatı uzadı ve vefat etti {atı:wafayat-ayan}."
  id: "Abu Hafs Umar ibn Abi Bakr Muhammad ibn Mu'ammar ibn Ahmad ibn Yahya al-Muaddib, dikenal sebagai Ibn Tabarzdhah; ulama hadis Baghdadi terkenal yang dijuluki Muwafaq al-Din; penduduk lingkungan Dar al-Qiz, sehingga dikenal sebagai al-Darqizi; kakaknya Abu al-Baqa Muhammad banyak mendengar hadits, kemudian ia mengandalkan hadisnya sendiri dan Umar selama beberapa tahun hingga ia menceritakan selama bertahun-tahun. Ibn al-Madini menyusun dua sheikh dalam dua jilid dan satu jilid ketiga di mana ia memiliki delapan puluh tiga sheikh. Ia memiliki rangkaian transmisi tinggi yang berkeliling negeri, memberi manfaat kepada rakyatnya, menghubungkan anak muda dengan para tetua, dan menyediakan para pendengar serta ijazah. Hidupnya bertambah dan ia wafat {cite:wafayat-ayan}."
