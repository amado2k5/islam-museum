summary:
  ar: "أبو حفص عمر بن أبي بكر محمد بن معمر بن أحمد بن يحيى المؤدب المعروف بابن طبرزذ؛ المحدث المشهور البغدادي الملقب موفق الدين؛ من ساكني محلة دار القز ولذا عُرف بالدارقزي؛ أسمعه أخوه الأكبر أبو البقاء محمد كثيراً من الحديث ثم استقل بإفادة نفسه وعمّر حتى حدّث سنين؛ جمع له ابن المديني مشيخة في جزأين وبعض ثالث فيها ثلاثة وثمانون شيخاً؛ وكان عالي الإسناد طاف البلاد وأفاد أهلها وألحق الأصاغر بالأكابر وطبق الأرض بالسماعات والإجازات وامتدت له الحياة فخلا له العصر {cite:wafayat-ayan}."
  en: "Muwaffaq al-Din Ibn Tabarzad (516–607) — Baghdad's long-lived muhaddith of Dar al-Qazz; his eighty-three-shaykh mashyakha and high isnad made him the last of his generation, crossing lands to grant ijazas {cite:wafayat-ayan}."
