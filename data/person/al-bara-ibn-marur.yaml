summary:
  en: "Senior chief of Banu Salima of the Khazraj and the foremost spokesman for the Yathrib delegation at the Second Pledge of Aqaba; he took the Prophet's hand and proclaimed their commitment to defend him with their lives and arms; he died shortly before the Prophet reached Medina in the Hijra."
  fr: "Chef aîné des Banu Salima des Khazraj et principal porte-parole de la délégation de Yathrib au second serment d’Aqaba ; il prit la main du Prophète et proclama leur engagement à le défendre de leur vie et de leurs armes ; il mourut peu avant l’arrivée du Prophète à Médine lors de l’Hégire."
  ar: "سيد بني سلمة وشيخ وفد الأنصار في بيعة العقبة الثانية والمتكلم باسمهم حين أخذ بيد النبي معاهداً على نصرته وحمايته مما يحمون منه نساءهم وأبناءهم؛ وكان أحد النقباء الاثني عشر، وتوفي بيثرب في صفر قبيل قدوم النبي مهاجراً. وعند ابن إسحاق في وفاء الوفا كان قد صلى إلى الكعبة قبل القدوم، فلما وصل الوفد مكة وسألوا عن النبي فقيل هو مع العباس في المسجد جلسوا إليه فسأله البراء عن القبلة {cite:samhudi-wafa-al-wafa p. 240-241}."
  ur: "بنو سلیمہ خزرج کے بزرگ سردار اور دوسری بیعت عقبہ میں یثرب کے وفد کے مقدم ترجمان؛ انہوں نے نبی کا ہاتھ پکڑا۔"
  es: "Jefe principal de Banu Salima del Khazraj y portavoz principal de la delegación Yathrib en el Segundo Juramento de Aqaba; tomó la mano del Profeta y proclamó su compromiso de defenderlo con sus vidas y sus armas; murió poco antes de que el Profeta llegara a Medina en la Hégira."
  tr: "Beni Salama'nın başı ve Akabe'deki İkinci Biat'ta Ensar heyetinin lideri ve Peygamber'in elini tutarak onu kendi kadın ve çocuklarını koruyacakları gibi koruyacaklarına dair söz veren sözcüleriydi; on iki liderden biriydi ve Peygamber'in hicret için gelişinden kısa bir süre önce Safer'deki Yathrib'de vefat etti. İbn İshak'ın Vefa' el-Vafa'da belirttiğine göre, gelişten önce Kâbe'ye doğru namaz kılmış ve heyet Mekke'ye vardığında Peygamber hakkında bilgi sorduğunda, onun mescitte Abbas ile birlikte olduğu söylenmiştir. Onunla birlikte oturdular ve el-Bara' ona namazın yönünü (kıble) sordu. {Kaynak: Samhudi-Vafa el-Vafa s. 240-241}"
  id: "Pemimpin Bani Salama dan pemimpin delegasi Ansar pada Ikrar Kedua Aqaba, dan juru bicara mereka ketika ia memegang tangan Nabi, berjanji untuk mendukung dan melindunginya sebagaimana mereka akan melindungi wanita dan anak-anak mereka sendiri; ia adalah salah satu dari dua belas pemimpin, dan ia meninggal di Yathrib pada bulan Safar tak lama sebelum kedatangan Nabi sebagai seorang emigran. Menurut Ibnu Ishaq dalam Wafa' al-Wafa, ia telah shalat menghadap Ka'bah sebelum kedatangan, dan ketika delegasi sampai di Mekah dan bertanya tentang Nabi, mereka diberitahu bahwa beliau bersama al-Abbas di masjid. Mereka duduk bersamanya, dan al-Bara' bertanya kepadanya tentang arah salat (qibla) {kutip:samhudi-wafa-al-wafa hlm. 240-241}."
