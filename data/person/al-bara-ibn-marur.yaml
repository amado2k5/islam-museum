summary:
  en: "Senior chief of Banu Salima of the Khazraj and the foremost spokesman for the Yathrib delegation at the Second Pledge of Aqaba; he took the Prophet's hand and proclaimed their commitment to defend him with their lives and arms; he died shortly before the Prophet reached Medina in the Hijra."
  ar: "سيد بني سلمة وشيخ وفد الأنصار في بيعة العقبة الثانية والمتكلم باسمهم حين أخذ بيد النبي معاهداً على نصرته وحمايته مما يحمون منه نساءهم وأبناءهم؛ وكان أحد النقباء الاثني عشر، وتوفي بيثرب في صفر قبيل قدوم النبي مهاجراً. وعند ابن إسحاق في وفاء الوفا كان قد صلى إلى الكعبة قبل القدوم، فلما وصل الوفد مكة وسألوا عن النبي فقيل هو مع العباس في المسجد جلسوا إليه فسأله البراء عن القبلة {cite:samhudi-wafa-al-wafa p. 240-241}."
