summary:
  ar: "محمد حسني مبارك (4 مايو 1928 – 25 فبراير 2020)، ضابط وسياسي مصري قاد القوات الجوية ثم كان نائب الرئيس أنور السادات، وتولى رئاسة مصر عقب اغتيال السادات سنة 1981 فحكم نحو ثلاثين عاما في ظل قانون الطوارئ، حتى أطاحت به ثورة يناير 2011، فحُوكم وسُجن ثم أُخلي سبيله سنة 2017، وتوفي في القاهرة سنة 2020 ودُفن بعد جنازة عسكرية في مصر الجديدة."
  en: "Muhammad Hosni Mubarak (4 May 1928 – 25 February 2020) was an Egyptian officer and politician who commanded the air force and served as Anwar Sadat's vice president, then ruled Egypt as president from Sadat's assassination in 1981 for almost thirty years under emergency law, until the January 2011 revolution forced him out. He was tried and imprisoned, released in 2017, and died in Cairo in 2020; he was buried in Heliopolis after a military funeral."
  ur: "محمد حسنی مبارک (4 مئی 1928ء – 25 فروری 2020ء) مصری افسر اور سیاست دان تھے جنہوں نے فضائیہ کی کمان سنبھالی اور انور سادات کے نائب صدر رہے، پھر 1981ء میں سادات کے قتل کے بعد تقریباً تیس برس مصر کے صدر رہے حتیٰ کہ جنوری 2011ء کے انقلاب نے انہیں ہٹا دیا۔ ان پر مقدمات چلے، وہ قید رہے، 2017ء میں رہا ہوئے اور 2020ء میں قاہرہ میں وفات پائی۔"
