label:
  ar: محمد بن أبي هشام راوي خبر المرأة الشاربة
  en: Muhammad ibn Abi Hisham, narrator of the account of the woman who drank wine
  ur: محمد بن ابی ہشام، شراب پینے والی عورت کی روایت کا راوی
summary:
  ar: راوٍ يحدّث عن يحيى بن الحسين خبر امرأة شربت الخمر وسألته العفو بحق علي بن أبي طالب، يرويه عنه علي بن محمد.
  en: A narrator who tells of Yahya ibn al-Husayn the account of a woman who drank wine and begged mercy for the sake of Ali ibn Abi Talib, given by Ali ibn Muhammad.
  ur: ایک راوی جو یحییٰ بن الحسین کے بارے میں اس عورت کا واقعہ بیان کرتا ہے جس نے شراب پی اور علی بن ابی طالب کے حق کا واسطہ دے کر معافی مانگی، جسے علی بن محمد نقل کرتے ہیں۔
