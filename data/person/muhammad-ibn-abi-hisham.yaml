id: person/muhammad-ibn-abi-hisham
class: person
label:
  ar: محمد بن أبي هشام راوي خبر المرأة الشاربة
  en: Muhammad ibn Abi Hisham, narrator of the account of the woman who drank wine
  ur: محمد بن ابی ہشام، شراب پینے والی عورت کی روایت کا راوی
  es: "Muhammad ibn Abi Hisham, narrator of the account of the woman who drank wine"
  fr: "Muhammad ibn Abi Hisham, narrator of the account of the woman who drank wine"
summary:
  ar: راوٍ يحدّث عن يحيى بن الحسين خبر امرأة شربت الخمر وسألته العفو بحق علي بن أبي طالب، يرويه عنه علي بن محمد.
  en: A narrator who tells of Yahya ibn al-Husayn the account of a woman who drank wine and begged mercy for the sake of Ali ibn Abi Talib, given by Ali ibn Muhammad.
  ur: ایک راوی جو یحییٰ بن الحسین کے بارے میں اس عورت کا واقعہ بیان کرتا ہے جس نے شراب پی اور علی بن ابی طالب کے حق کا واسطہ دے کر معافی مانگی، جسے علی بن محمد نقل کرتے ہیں۔
  es: "Un narrador que relata a Yahya ibn al-Husayn la historia de una mujer que bebió vino y suplicó misericordia por Ali ibn Abi Talib, contada por Ali ibn Muhammad."
  fr: "Un narrateur qui rapporte à Yahya ibn al-Husayn l'histoire d'une femme qui a bu du vin et imploré la miséricorde pour Ali ibn Abi Talib, racontée par Ali ibn Muhammad."
  tr: "Bir anlatıcı, Yahya ibn al-Hüseyin'den, Ali ibn Ebi Talib adına şarap içen ve ondan af dileyen bir kadının hikayesini anlatır; bu hikaye Ali ibn Muhammed'in anlattığıdır."
  id: "Seorang narator menceritakan dari Yahya ibn al-Husayn kisah seorang wanita yang minum anggur dan memohon ampun atas nama Ali ibn Abi Talib, yang diceritakan oleh Ali ibn Muhammad."
