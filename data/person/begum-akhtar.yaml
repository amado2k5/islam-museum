summary:
  ar: "مغنية هندية (1914–1974)، وُلدت باسم أختري باي فيض آبادي في فيض آباد، ولُقّبت «ملكة الغزل»، وتُعدّ من أعظم مغنيات الغزل والثمري والدادرة؛ مثّلت في أفلام في الثلاثينيات وفي فيلم «روتي» (1942)، ونالت جائزة أكاديمية سانغيت ناتاك (1972) ووسام بادما شري (1968)، ومُنحت بادما بوشان بعد وفاتها."
  en: "Indian singer (1914–1974), born Akhtari Bai Faizabadi at Faizabad, dubbed Mallika-e-Ghazal, 'Queen of Ghazals', and regarded as one of the greatest exponents of ghazal, thumri and dadra; she acted in films in the 1930s and in Mehboob Khan's Roti (1942), received the Sangeet Natak Akademi Award (1972) and the Padma Shri (1968), and was awarded the Padma Bhushan posthumously."
  ur: "بھارتی گلوکارہ (1914ء–1974ء)، جو اختری بائی فیض آبادی کے نام سے فیض آباد میں پیدا ہوئیں، «ملکہِ غزل» کہلائیں اور غزل، ٹھمری اور دادرے کی عظیم ترین گلوکاروں میں شمار ہوتی ہیں؛ تیس کی دہائی میں اور فلم «روٹی» (1942ء) میں اداکاری کی، سنگیت ناٹک اکیڈمی ایوارڈ (1972ء) اور پدم شری (1968ء) پایا اور بعد از وفات پدم بھوشن سے نوازی گئیں۔"
