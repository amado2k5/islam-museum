summary:
  ar: لقبه «ذو الرمحين»، من بني مخزوم وابن عم خالد بن الوليد؛ من السابقين الأولين وهاجر الهجرتين، ثم خدعه أبو جهل حتى رجع إلى مكة فحبسوه، وكان النبي يدعو له في القنوت كما في الصحيحين؛ مات بالشام سنة 15هـ في قول، وقيل استشهد باليمامة أو باليرموك.
  en: Nicknamed 'the man of the two spears', of Banu Makhzum and a cousin of Khalid ibn al-Walid; one of the earliest Muslims who made both emigrations, until Abu Jahl tricked him into returning to Mecca where he was held, and the Prophet prayed
    for him in the qunut as the two collections report; he died in Syria in 15 AH on one account, and others say he fell at al-Yamama or al-Yarmuk.
  ur: "دو نیزوں والے کے نام سے مشہور، بنو مخزوم سے اور خالد بن ولید کے چچا زاد؛ ابتدائی مسلمانوں میں سے جنہوں نے دونوں ہجرتیں کیں۔"
  es: "Apodado \"el hombre de las dos lanzas\", perteneciente a Banu Makhzum y primo de Khalid ibn al-Walid; uno de los primeros musulmanes que emigró a La Meca, hasta que Abu Jahl lo engañó para que regresara a la Meca, donde estuvo prisionero, y el Profeta oró por él en el Qunut, según informan las dos colecciones; murió en Siria en el año 15 de la Hégira, según una versión, y otras dicen que cayó en al-Yamama o al-Yarmuk."
  fr: "Surnommé « l'homme aux deux lances », issu de la tribu des Banu Makhzum et cousin de Khalid ibn al-Walid; l'un des premiers musulmans à avoir effectué les deux émigrations, jusqu'à ce qu'Abu Jahl le trompe et le fasse retourner à La Mecque où il fut détenu, et le Prophète pria pour lui dans le qunut, comme le rapportent les deux recueils; il mourut en Syrie en 15 AH selon un récit, et d'autres disent qu'il tomba à al-Yamama ou al-Yarmuk."
