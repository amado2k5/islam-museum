summary:
  ar: لقبه «ذو الرمحين»، من بني مخزوم وابن عم خالد بن الوليد؛ من السابقين الأولين وهاجر الهجرتين، ثم خدعه أبو جهل حتى رجع إلى مكة فحبسوه، وكان النبي يدعو له في القنوت كما في الصحيحين؛ مات بالشام سنة 15هـ في قول، وقيل استشهد باليمامة أو باليرموك.
  en: Nicknamed 'the man of the two spears', of Banu Makhzum and a cousin of Khalid ibn al-Walid; one of the earliest Muslims who made both emigrations, until Abu Jahl tricked him into returning to Mecca where he was held, and the Prophet prayed
    for him in the qunut as the two collections report; he died in Syria in 15 AH on one account, and others say he fell at al-Yamama or al-Yarmuk.
