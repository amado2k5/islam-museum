id: person/bughra-khan-qarakhanid
class: person
label:
  ar: بقراخان الخاقاني
  en: Bughra Khan al-Qarakhani
  es: "Bughra Khan al-Qarakhani"
  fr: "Bughra Khan al-Qarakhani"
  ur: "بغرا خان القارخانی۔"
summary:
  ar: "بقراخان من ملوك الترك الخاقانيين؛ طمع في بلاد بني سامان بإغواء أبي علي بن سمجور عند اضطراب دولتهم فقصد أعمالهم وملكها شيئاً فشيئاً وهزم عساكر الأمير نوح بن منصور وأسر قائده أنج، ودخل بخارى حتى رجع عنها الأمير نوح، ولما ارتحل منها وهو على ما به من المرض أدركه الموت في طريقه سنة ثلاث وثمانين وأربعمائة على قراءة النص، وكان ديناً عادلاً حسن السيرة محباً للعلماء وأهل الدين مكرماً لهم متشيعاً سنياً، وولي بعده أخوه ايلك خان سليمان."
  en: "Bughra Khan of the Qarakhanid Turkic kings; drawn into the Samanid lands by Abu Ali ibn Simjur's tempting of him with Bukhara in that dynasty's collapse, he took their country piece by piece, routed Nuh ibn Mansur's armies and captured his commander Anj, entered Bukhara until Nuh's return — then, departing sick, died on the road in the year the text reads as 403 of the fourth century; pious, just, of good conduct, a Sunni-leaning honourer of scholars, succeeded by his brother Ilig Khan Sulayman."
  es: "Bughra Khan, de la dinastía de reyes turcos Qarakhanid, fue atraído a las tierras de los Samánidas por Abu Ali ibn Simjur, quien lo tentó con Bujará tras el colapso de dicha dinastía. Tomó el país poco a poco, derrotó a los ejércitos de Nuh ibn Mansur y capturó a su comandante Anj. Entró en Bujará hasta el regreso de Nuh; luego, enfermo, murió en el camino en el año que el texto indica como 403 del siglo IV. Era piadoso, justo, de buena conducta, de tendencia sunita y admirador de los eruditos, y fue sucedido por su hermano Ilig Khan Sulayman."
  fr: "Bughra Khan, roi turc qarakhanide, fut attiré dans les terres samanides par la tentation d'Abu Ali ibn Simjur qui lui offrit Boukhara lors de l'effondrement de cette dynastie. Il conquit leur pays morceau par morceau, mit en déroute les armées de Nuh ibn Mansur et captura son commandant Anj, entra dans Boukhara jusqu'au retour de Nuh, puis, malade, il mourut en chemin en l'an 403 du IVe siècle, selon le texte. Pieux, juste, de bonne conduite, sunnite et respectueux des érudits, il fut remplacé par son frère Ilig Khan Sulayman."
  ur: "قرہ خانی ترک بادشاہوں کا بغرا خان؛ اس خاندان کے خاتمے میں ابو علی ابن سمجور کی طرف سے اسے بخارا کے ساتھ لالچ میں لے کر سامانی سرزمین میں کھینچا گیا، اس نے ان کے ملک کو ٹکڑے ٹکڑے کر کے نوح بن منصور کی فوجوں کو شکست دی اور اس کے کمانڈر انج کو گرفتار کر لیا، نوح کی واپسی تک بخارا میں داخل ہو گیا- پھر چار سال کی بیماری کے طور پر 4 سال کے متن کے طور پر سڑک پر روانہ ہو کر انتقال کر گئے۔ صدی؛ پرہیزگار، انصاف پسند، اچھے اخلاق کے حامل، علماء کے ایک سنی جھکاؤ والے معزز، ان کے بھائی ایلگ خان سلیمان نے جانشین کیا۔"
