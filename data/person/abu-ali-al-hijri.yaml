names:
  - { value: "أبو محمد عبد الله بن محمد بن علي بن عبد الله بن عبيد الله الحجري الأندلسي المري الحافظ الزاهد", kind: full }
summary:
  ar: "أبو محمد عبد الله بن محمد بن علي الحجري الأندلسي المري الحافظ الزاهد القدوة أحد الأعلام؛ ولد سنة خمس وخمسمائة وقرأ صحيح البخاري على شريح وسمع فأكثر عن أبي الحسن ابن مغيث وابن العربي والكبار، وتفنن في العلوم وبرع في الحديث وطال عمره وشاع ذكره، وكان قد تمكن سبتة فدعاه السلطان إلى مراكش ليسمع منه، وكان غاية في العدالة في هذا الشأن؛ توفي في أول صفر سنة إحدى وتسعين وخمسمائة {cite:shadharat-dhahab p. 787}."
  en: "Abu Muhammad Abdallah b. Muhammad al-Hijri al-Andalusi al-Mari, hafiz, ascetic exemplar, one of the luminaries; b. 505, read Sahih al-Bukhari on Shurayh, heard abundantly from Ibn Mughith, Ibn al-Arabi and the great, ranged through the sciences and excelled in hadith — long-lived and far-famed; he had settled at Ceuta when the sultan summoned him to Marrakesh to hear him, and he was the utmost in probity in this field. He died at the start of Safar 591 {cite:shadharat-dhahab p. 787}."
  fr: "Abu Muhammad Abdallah b. Muhammad al-Hijri al-Andalusi al-Mari, hafiz, modèle d'ascèse, l'une des lumières ; né en 505, il lut le Sahih d'al-Bukhari auprès de Shurayh, entendit abondamment Ibn Mughith, Ibn al-Arabi et les grands maîtres, parcourut les sciences et excella dans le hadith — il vécut longtemps et sa renommée s'étendit au loin ; il s'était établi à Ceuta lorsque le sultan le fit venir à Marrakech pour l'entendre, et il était au plus haut degré de probité dans ce domaine. Il mourut au début de Safar 591 {cite:shadharat-dhahab p. 787}."
  es: "Abu Muhammad Abdallah b. Muhammad al-Hijri al-Andalusi al-Mari, hafiz, ejemplo de asceta, una de las luminarias; n. 505, leyó Sahih al-Bukhari sobre Shurayh, escuchó abundantemente a Ibn Mughith, Ibn al-Arabi y a los grandes, abarcó diversas ciencias y sobresalió en hadices; fue longevo y de gran renombre; se había establecido en Ceuta cuando el sultán lo convocó a Marrakech para escucharlo, y fue el más íntegro en este campo. Murió al comienzo de Safar 591 {cite:shadharat-dhahab p. 787}."
  ur: "ابو محمد عبداللہ بی۔ محمد الہجری الاندلسی الماری، حافظ، مثالی نمونہ، نورانیوں میں سے ایک؛ ب 505، شریح پر صحیح البخاری پڑھیں، ابن مغیث، ابن العربی اور عظیم لوگوں سے کثرت سے سنا، علوم کے حوالے سے اور حدیث میں کمال حاصل کیا - طویل المدت اور دور دراز سے مشہور؛ وہ سیوٹا میں مقیم تھا جب سلطان نے اسے سننے کے لیے ماراکیش بلوایا، اور وہ اس میدان میں سب سے زیادہ قابلیت تھا۔ آپ کی وفات صفر 591 کے شروع میں ہوئی۔ 787}۔"
  tr: "Ebu Muhammed Abdullah bin Muhammed bin Ali el-Haceri el-Endülüs el-Murri, ezberci, zühd sahibi, örnek kişi, önde gelen şahsiyetlerden biriydi; 505 yılında doğdu, Şurayh'a Sahih el-Buhari'yi okudu ve Ebu el-Hasan İbn Muğit, İbn el-Arabi ve büyüklerden çok şey öğrendi, ilimlerde üstün başarı gösterdi ve hadis konusunda uzmandı, uzun bir ömür yaşadı ve adı yaygınlaştı, Ceuta'da yerleşti, bu yüzden Sultan onu Marakeş'e davet etti ve bu konuda son derece adil davrandı; 591 yılında Safar ayının başında vefat etti. {Kaynak: Şadharat-Dhaba s. 787}"
  id: "Abu Muhammad Abdullah bin Muhammad bin Ali Al-Hajari Al-Andalusi Al-Murri, seorang penghafal Al-Qur'an, seorang pertapa, panutan, salah satu tokoh terkemuka; beliau lahir pada tahun 505, dan beliau membaca Sahih Al-Bukhari hingga Shurayh dan banyak belajar dari Abu Al-Hasan Ibn Mughith, Ibn Al-Arabi dan para ulama besar, dan beliau unggul dalam ilmu-ilmu dan mahir dalam Hadits, dan beliau hidup panjang umur dan namanya tersebar luas, dan beliau telah memantapkan diri di Ceuta, sehingga Sultan mengundangnya ke Marrakesh untuk mendengarkan ceramahnya, dan beliau sangat adil dalam hal ini; beliau wafat pada awal bulan Safar tahun 591 {cite:shadharat-dhahab p. 787}."
