summary:
  ar: "أبو محمد عبد الله بن محمد بن علي الحجري الأندلسي المري الحافظ الزاهد القدوة أحد الأعلام؛ ولد سنة خمس وخمسمائة وقرأ صحيح البخاري على شريح وسمع فأكثر عن أبي الحسن ابن مغيث وابن العربي والكبار، وتفنن في العلوم وبرع في الحديث وطال عمره وشاع ذكره، وكان قد تمكن سبتة فدعاه السلطان إلى مراكش ليسمع منه، وكان غاية في العدالة في هذا الشأن؛ توفي في أول صفر سنة إحدى وتسعين وخمسمائة {cite:shadharat-dhahab p. 787}."
  en: "Abu Muhammad Abdallah b. Muhammad al-Hijri al-Andalusi al-Mari, hafiz, ascetic exemplar, one of the luminaries; b. 505, read Sahih al-Bukhari on Shurayh, heard abundantly from Ibn Mughith, Ibn al-Arabi and the great, ranged through the sciences and excelled in hadith — long-lived and far-famed; he had settled at Ceuta when the sultan summoned him to Marrakesh to hear him, and he was the utmost in probity in this field. He died at the start of Safar 591 {cite:shadharat-dhahab p. 787}."
