summary:
  ar: "مربية وناشطة ومحسنة أذربيجانية (1873–1955)، من أوائل المتنوّرات في أذربيجان، زوجة الكاتب الساخر جليل محمد قلي زاده وشريكته في مجلة «ملا نصر الدين»، أسست في قريتها كهريزلي مدرسة مختلطة ومستشفى، وشاركت في تأسيس جمعية نساء القوقاز المسلمات الخيرية، وخلّفت مذكرات نُشرت بعد وفاتها."
  en: "Azerbaijani educator, activist and philanthropist (1873–1955), one of the first enlightened women of Azerbaijan; wife and working partner of the satirist Jalil Mammadguluzadeh on the magazine Molla Nasreddin. She founded a coeducational school and a hospital in her home village of Kahrizli, co-founded the Caucasian Muslim Women's Benevolent Society, and left memoirs published after her death."
  ur: "آذربائیجانی معلمہ، سماجی کارکن اور صاحبِ خیر (1873–1955)، آذربائیجان کی اولین روشن خیال خواتین میں سے ایک؛ طنز نگار جلیل محمد قلی زادہ کی اہلیہ اور رسالے «ملا نصرالدین» میں ان کی شریکِ کار۔ انہوں نے اپنے گاؤں کہریزلی میں مخلوط تعلیم کا اسکول اور اسپتال قائم کیا، قفقازی مسلم خواتین کی فلاحی انجمن کی بانیوں میں شامل ہوئیں، اور ان کی یادداشتیں ان کی وفات کے بعد شائع ہوئیں۔"
