summary:
  ar: "ألف شفق ⁦(وُلدت في ٢٥ تشرين الأول ١٩٧١ في ستراسبورغ)⁩ روائية تركية بريطانية وعالمة سياسة، من أشهر رواياتها «قواعد العشق الأربعون» ⁦(٢٠٠٩)⁩ التي تدور حول جلال الدين الرومي وشمس التبريزي، و«لقيطة إسطنبول» و«ثلاث بنات لحواء» و«ثمة أنهار في السماء»؛ حوكمت في تركيا سنة ٢٠٠٦ بتهمة إهانة الهوية التركية وبُرّئت، وتعيش في لندن منذ ٢٠١٣، وتولت رئاسة الجمعية الملكية للأدب سنة ٢٠٢٥."
  en: "Elif Shafak (born 25 October 1971 in Strasbourg) is a Turkish-British novelist and political scientist, best known for The Forty Rules of Love (2009), a novel of Rumi and Shams of Tabriz, and for The Bastard of Istanbul, Three Daughters of Eve and There Are Rivers in the Sky; prosecuted in Turkey in 2006 for 'insulting Turkishness' and acquitted, she has lived in London since 2013 and became president of the Royal Society of Literature in 2025."
  ur: "ایلِف شفق ⁦(پیدائش 25 اکتوبر 1971، اسٹراسبرگ)⁩ ترک نژاد برطانوی ناول نگار و سیاسیات دان ہیں؛ ان کے معروف ناولوں میں «قواعد العشق الأربعون»، «لقیطۂ استنبول» اور «حوّا کی تین بیٹیاں» شامل ہیں؛ 2006 میں ترکی میں مقدمہ چل کر بری ہوئیں، 2013 سے لندن میں مقیم ہیں، اور 2025 میں رائل سوسائٹی آف لٹریچر کی صدر بنیں۔"
