id: person/ibn-ayshun-al-harrani
class: person
label: { ar: "ابن عيشون الحراني القاضي", en: "Ibn Ayshun al-Harrani", es: "Ibn Ayshun al-Harrani", fr: "Ibn Ayshun al-Harrani", ur: "ابن ایشون حرانی" }
summary:
  ar: "قاض حراني ذو فهم ومعرفة توفي بعد الثلاثمائة، له قصيدة طويلة يذكر فيها مذاهب الحرانيين المعروفين بالصابئة وذكر فيها بيتهم مغليتيا وما تحته من السراديب الأربعة المتخذة لأنواع صور الأصنام التي جعلت مثالاً للأجسام السماوية وكيفية إيرادهم لأطفالهم إلى السراديب وما يتكلم به السدنة من وراء الجدر في المنافيخ حتى يظهر من الصور المجوفة نطق {cite:muruj-al-dhahab p. 545-546}."
  en: "The Harranian judge, a man of learning who died after 300; his long qasida on the Sabians' doctrines describes the temple Mighlitiya, its four vaults of planet-shaped idols, and the priests speaking through hidden pipes so the hollow images seemed to talk {cite:muruj-al-dhahab p. 545-546}."
  es: "El juez de Harran, un hombre de letras que murió después del año 300; su larga qasida sobre las doctrinas de los sabeos describe el templo Mighlitiya, sus cuatro bóvedas de ídolos con forma de planeta y los sacerdotes hablando a través de tubos ocultos de modo que las imágenes huecas parecían hablar {cite:muruj-al-dhahab p. 545-546}."
  fr: "Le juge harranien, un homme de savoir mort après 300; sa longue qasida sur les doctrines des Sabéens décrit le temple Mighlitiya, ses quatre voûtes d'idoles en forme de planète, et les prêtres parlant à travers des tuyaux cachés de sorte que les images creuses semblaient parler {cite:muruj-al-dhahab p. 545-546}."
  ur: "Harranian جج، ایک سیکھنے والا آدمی جو 300 کے بعد مر گیا؛ صابیوں کے عقائد پر اس کا طویل قصیدہ ہیکل مغلیہ، اس کے سیارے کی شکل کے بتوں کے چار وولٹ، اور پجاری چھپے ہوئے پائپوں کے ذریعے بات کرتے ہوئے اس طرح کھوکھلی تصویریں بات کرتے دکھائی دیتے ہیں {حوالہ: مروج الذہاب صفحہ۔ 545-546}۔"
  tr: "300 yılından sonra ölen bir Harrani anlayış ve bilgi hakimi olarak, uzun bir şiir yazdı; burada Harrani halkının Sabians olarak bilinen mezheplerinden bahsetti ve Meglitia'daki evlerini ve altındaki dört mahzeni anlattı; bunlar gök cisimlerinin çeşitli imgelerine örnek olarak kullanıldı, çocuklarını mahzenlere nasıl getirdiklerini ve koruyucuların duvarların arkasından üfleyicilerde konuştuğu sözleri, böylece boş görüntülerden telaffuz {cite:muruj-al-dhahab s. 545-546} ortaya çıktı."
  id: "Seorang hakim Harrani yang meninggal setelah tahun 300 M, ia menulis puisi panjang di mana ia menyebutkan sekte-sekte orang Harrani yang dikenal sebagai Sabian, dan menyebutkan rumah mereka di Meglitia serta empat ruang bawah tanah di bawahnya, yang digunakan sebagai contoh berbagai gambar benda langit dan bagaimana mereka membawa anak-anak mereka ke ruang bawah tanah, serta apa yang dikatakan para penjaga dari balik dinding di blower sehingga dari gambar berongga itu, pengucapan {cite:muruj-al-dhahab hlm. 545-546} muncul."
