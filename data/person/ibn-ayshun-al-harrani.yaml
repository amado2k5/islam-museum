label: { ar: "ابن عيشون الحراني القاضي", en: "Ibn Ayshun al-Harrani" }
summary:
  ar: "قاض حراني ذو فهم ومعرفة توفي بعد الثلاثمائة، له قصيدة طويلة يذكر فيها مذاهب الحرانيين المعروفين بالصابئة وذكر فيها بيتهم مغليتيا وما تحته من السراديب الأربعة المتخذة لأنواع صور الأصنام التي جعلت مثالاً للأجسام السماوية وكيفية إيرادهم لأطفالهم إلى السراديب وما يتكلم به السدنة من وراء الجدر في المنافيخ حتى يظهر من الصور المجوفة نطق {cite:muruj-al-dhahab p. 545-546}."
  en: "The Harranian judge, a man of learning who died after 300; his long qasida on the Sabians' doctrines describes the temple Mighlitiya, its four vaults of planet-shaped idols, and the priests speaking through hidden pipes so the hollow images seemed to talk {cite:muruj-al-dhahab p. 545-546}."
