summary:
  ar: "عمرو بن بحر الجاحظ الأديب، صنف كتاب إمامة ولد العباس يحتج فيه لمذهب الراوندية ويذكر فعل أبي بكر في فدك وقصته مع فاطمة ومطالبتها بإرثها، ولم يكن ذلك مذهبه ولا كان يعتقده ولكن فعل ذلك تماجناً وتطرباً، وله العثمانية {cite:muruj-al-dhahab p. 224-225}. وعند المسعودي ذكر للمتوكل لتأديب بعض ولده فلما رآه استبشع منظره فأمر له بعشرة آلاف درهم وصرفه، وركب في حراقة محمد بن إبراهيم فغنت طنبورية وا رحمتا للعاشقين ففزعت عوادة إلى الماء فلحقها غلام فادار الملاح الحراقة فإذا هما معتنقان ثم غاصا فلم يريا {cite:muruj-al-dhahab p. 486-487}، وعند المسعودي توفي بالبصرة في المحرم سنة خمس وخمسين ومائتين وقيل سنة ست وخمسين، ولا يعلم أحد من الرواة أكثر كتباً منه مع قوله بالعثمانية، ومن كتبه البيان والتبيين وهو أشرفها جمع فيه بين المنثور والمنظوم وغرر الأشعار وبليغ الخطب، وكتاب الحيوان وكتاب الطفيليين وكتاب البخلاء، وكان غلام إبراهيم بن سيار النظام عنه أخذ ومنه تعلم، وكان إذا تخوف ملل القارئ وسآمة السامع خرج من جد إلى هزل، وكان في مرضه يطلي نصفه الأيمن بالصندل والكافور لشدة حرارته ونصفه الآخر لو قرض بالمقاريض ما شعر به من خدره وبرده، وروى خبر مرضه ابن أخته يموت بن المزرع {cite:muruj-al-dhahab p. 568-569}، ومن رسالته إلى محمد بن عبد الملك الزيات المنفعة توجب المحبة والمضرة توجب البغضاء والمضادة توجب العداوة وخلاف الهوى يوجب الاستثقال ومتابعته توجب الألفة والأمانة توجب الطمأنينة والخيانة توجب المنافرة والعدل يوجب اجتماع القلوب والجور يوجب الوحشة والتكبر يوجب المقت والتواضع يوجب المودة والجود يوجب الحمد والبخل يوجب المذمة {cite:fihrist-ibn-al-nadim p. 527}"
  en: "The man of letters — his 'Imamat wuld al-'Abbas argues the Rawandiyya case through the Fadak affair, composed in sport and display rather than conviction, beside his 'Uthmaniyya {cite:muruj-al-dhahab p. 224-225}."
