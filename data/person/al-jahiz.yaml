summary:
  ar: "أبو عثمان عمرو بن بحر الجاحظ أديب بصري وكاتب نثر عربي مشهور، صنف في الأدب وعلم الكلام المعتزلي والمناظرات السياسية والدينية. تذكر موسوعة الإسلام أنه ولد في البصرة نحو 160هـ/776م في أسرة من موالي بني كنانة، وأن مؤلفاته في الإمامة نحو سنة 200هـ/815م نالت ثناء المأمون فاتصل بالعاصمة بغداد ثم سامراء، وصحب ابن الزيات وابن أبي دؤاد والفتح بن خاقان. وتعده في المقام الأول كاتباً وأديباً أعطى النثر الأدبي أتم صورة. ومن المصادر الأخرى أنه صنف كتاب إمامة ولد العباس، ومن كتبه البيان والتبيين والحيوان والبخلاء."
  en: "Abu Uthman Amr ibn Bahr al-Jahiz was a man of letters from Basra and a famous Arab prose writer, who wrote on adab, Mu'tazili theology and politico-religious polemics. The Encyclopaedia of Islam says he was born in Basra about 160 AH/776 CE into a family of clients of the Banu Kinana, and that his works on the imamate around 200 AH/815 CE won al-Ma'mun's praise, leading him to Baghdad and later Samarra, where he attached himself to Ibn al-Zayyat, Ibn Abi Duad and al-Fath ibn Khaqan. It judges him above all a writer and adib who gave literary prose its most perfect form. Other sources record his book on the Abbasid imamate and works such as al-Bayan wa-l-Tabyin, al-Hayawan and al-Bukhala."
  ur: "ابو عثمان عمرو بن بحر جاحظ بصرہ کے ادیب اور عربی نثر کے مشہور مصنف تھے جنھوں نے ادب، معتزلی علمِ کلام اور سیاسی و دینی مناظروں پر لکھا۔ دائرۃ المعارف اسلام کے مطابق وہ تقریباً 160ھ/776ء میں بصرہ میں بنو کنانہ کے موالی کے خاندان میں پیدا ہوئے، اور امامت پر ان کی تصانیف کو تقریباً 200ھ/815ء میں مامون نے سراہا جس کے بعد وہ بغداد اور پھر سامرا گئے اور ابن زیات، ابن ابی دؤاد اور فتح بن خاقان سے وابستہ رہے۔ وہ انھیں سب سے بڑھ کر ادیب مانتا ہے جس نے ادبی نثر کو کامل ترین صورت دی۔ دوسرے مآخذ میں ان کی اولادِ عباس کی امامت پر کتاب اور البیان والتبیین، الحیوان اور البخلاء جیسی تصانیف کا ذکر ہے۔"
