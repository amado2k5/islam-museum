education:
  did_you_know:
    ar: "صنّف الجاحظ كتاباً في إمامة ولد العباس احتج فيه لمذهب الراوندية وذكر قصة فدك، ولم يكن ذلك مذهبه ولا كان يعتقده، كما يذكر عن نفسه."
    en: "Al-Jahiz composed a book on the imamate of the Abbasids' line, pleading the Rawandiyya's case and recounting the story of Fadak — though, as he himself notes, that was neither his creed nor his belief."
    ur: "جاحظ نے عباسیوں کی امامت پر کتاب لکھی جس میں راوندیہ کے مذہب کی طرف داری کی اور فدک کی کہانی بیان کی — حالانکہ، جیسا کہ وہ خود کہتا ہے، یہ نہ ان کا مذہب تھا نہ عقیدہ۔"
    sources: [source/fihrist-ibn-al-nadim, source/encyclopaedia-of-islam-2]
