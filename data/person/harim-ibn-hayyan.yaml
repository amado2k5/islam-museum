summary:
  ar: "هرم بن حيان العبدي؛ بعثه عثمان بن أبي العاص إلى قلعة شبير ففتحها عنوة بعد حصار وقتال وقال بعضهم فتح قلعة الستوج عنوة."
  en: "Harim ibn Hayyan al-Abdi; sent by Uthman to Qal'at Shabir — taken by force after siege and fighting, or, as some say, Qal'at al-Sutuj."
  es: "Harim ibn Hayyan al-Abdi; enviado por Uthman a Qal'at Shabir, tomada por la fuerza después de un asedio y combates, o, como algunos dicen, Qal'at al-Sutuj."
  fr: "Harim ibn Hayyan al-Abdi; envoyé par Uthman à Qal'at Shabir — pris de force après un siège et des combats, ou, comme certains le disent, Qal'at al-Sutuj."
  ur: "حریم بن حیان العبدی؛ عثمان کی طرف سے قلعہ شبیر کی طرف بھیجا گیا - محاصرہ اور لڑائی کے بعد طاقت کے ذریعے لیا گیا، یا جیسا کہ بعض کہتے ہیں، قلات الستوج۔"
  tr: "Haram ibn Hayyan el-Abdi; Osman bin Abi el-As tarafından Şubayr kalesine gönderildi; kuşatma ve çatışmadan sonra burayı zorla fethetti ve bazıları el-Stouj kalesini zorla fethettiğini söyler."
  id: "Haram ibn Hayyan al-Abdi; ia dikirim oleh Uthman ibn Abi al-As ke benteng Shubair, yang ia taklukkan dengan paksa setelah pengepungan dan pertempuran, dan beberapa orang mengatakan ia menaklukkan benteng al-Stouj dengan kekerasan."
