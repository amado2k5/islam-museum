names:
  - { kind: full, lang: ar, value: "أبو الحسن علي بن عثمان بن أبي علي الجلابي الهجويري الغزنوي" }
  - { kind: laqab, lang: ur, value: "داتا گنج بخش" }
summary:
  ar: "أبو الحسن علي بن عثمان الجلابي الهجويري الغزنوي، صوفي من القرن الخامس الهجري ولد بغزنة، تتلمذ على أبي العباس الشقاني وسلك على يد أبي الفضل محمد بن الحسن الختلي، ورحل بين الشام والتركستان والهند، ثم استقر بلاهور وتوفي بها نحو 465هـ، وقبره بها في مزار «داتا كنج بخش»؛ صاحب «كشف المحجوب» {cite:kashf-al-mahjub-qandil-2007-v1 p. 10} {cite:kashf-al-mahjub-qandil-2007-v1 p. 11}."
  en: "Abu al-Hasan 'Ali ibn 'Uthman al-Jullabi al-Hujwiri al-Ghaznawi, a fifth-century AH Sufi born in Ghazna, pupil of Abu al-'Abbas al-Shaqqani and disciple of Abu al-Fadl Muhammad ibn al-Hasan al-Khuttali, who travelled from Syria to Turkestan and India, settled in Lahore and died there around 465 AH; his tomb there is the shrine of 'Data Ganj Bakhsh'; author of Kashf al-Mahjub {cite:kashf-al-mahjub-qandil-2007-v1 p. 10} {cite:kashf-al-mahjub-qandil-2007-v1 p. 11}."
  ur: "ابو الحسن علی بن عثمان جلابی ہجویری غزنوی، پانچویں صدی ہجری کے صوفی، غزنی میں پیدا ہوئے، ابو العباس شقانی کے شاگرد اور ابو الفضل محمد بن الحسن ختلی کے مرید، شام سے ترکستان اور ہندوستان تک سفر کیا، لاہور میں مقیم ہوئے اور تقریباً 465ھ میں وہیں فوت ہوئے؛ ان کا مزار وہاں «داتا گنج بخش» کے نام سے ہے؛ «کشف المحجوب» کے مصنف {cite:kashf-al-mahjub-qandil-2007-v1 p. 10} {cite:kashf-al-mahjub-qandil-2007-v1 p. 11}۔"
