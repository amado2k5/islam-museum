id: person/muhammad-ibn-ali-jurjaniyya
class: person
label: { ar: "محمد بن علي أمير الجرجانية", en: "Muhammad ibn Ali, emir of Jurjaniyya", ur: "محمد بن علی، امیرِ جرجانیہ", es: "Muhammad ibn Ali, emir of Jurjaniyya", fr: "Muhammad ibn Ali, emir of Jurjaniyya" }
summary:
  ar: "أمير الجرجانية في القرن العاشر، ضرب باسمه فلس سنة 356هـ/967م، ويراه شاهرخ ميرزا إسماعيلوف أول المأمونيين، ويراه بعض الباحثين والد مأمون بن محمد {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  en: "Tenth-century emir of Jurjaniyya in whose name a fals was struck in 356/967; Shohruxmirzo Ismoilov counts him the first Ma'munid, and some scholars take him for the father of Ma'mun ibn Muhammad {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  ur: "دسویں صدی کے امیرِ جرجانیہ جن کے نام سے 356ھ/967ء میں ایک فلس ڈھلا؛ شاہرخ میرزا اسماعیلوف انہیں پہلا مامونی شمار کرتے ہیں، اور بعض محققین انہیں مامون بن محمد کا والد سمجھتے ہیں {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}۔"
  es: "Emir de Jurjaniyya del siglo X en cuyo nombre se acuñó un fals en 356/967; Shohruxmirzo Ismoilov lo considera el primer Ma'munid, y algunos eruditos lo consideran el padre de Ma'mun ibn Muhammad {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  fr: "Émir de Jurjaniyya du Xe siècle au nom duquel un fals fut frappé en 356/967; Shohruxmirzo Ismoilov le considère comme le premier Ma'mounide, et certains érudits le prennent pour le père de Ma'mun ibn Muhammad {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  tr: "Onuncu yüzyılda Jurcanidlerin prensi olan Şahrukh Mirza İsmailov, 356 H/967 M.S. yılında onun adına bir fil basılmıştır. Şahrukh Mirza İsmailov Ma'munidlerin ilki olarak kabul edilir ve bazı araştırmacılar onu Ma'mun ibn Muhammed'in babası olarak kabul eder {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 224}."
  id: "Pangeran Jurjanid pada abad kesepuluh, sebuah fil dicetak atas namanya pada tahun 356 H/967 M. Shahrukh Mirza Ismailov dianggap sebagai yang pertama dari Ma'munid, dan beberapa peneliti menganggapnya sebagai ayah dari Ma'mun ibn Muhammad {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 224}."
