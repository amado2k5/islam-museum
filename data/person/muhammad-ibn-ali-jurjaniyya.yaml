label: { ar: "محمد بن علي أمير الجرجانية", en: "Muhammad ibn Ali, emir of Jurjaniyya", ur: "محمد بن علی، امیرِ جرجانیہ" }
summary:
  ar: "أمير الجرجانية في القرن العاشر، ضرب باسمه فلس سنة 356هـ/967م، ويراه شاهرخ ميرزا إسماعيلوف أول المأمونيين، ويراه بعض الباحثين والد مأمون بن محمد {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  en: "Tenth-century emir of Jurjaniyya in whose name a fals was struck in 356/967; Shohruxmirzo Ismoilov counts him the first Ma'munid, and some scholars take him for the father of Ma'mun ibn Muhammad {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  ur: "دسویں صدی کے امیرِ جرجانیہ جن کے نام سے 356ھ/967ء میں ایک فلس ڈھلا؛ شاہرخ میرزا اسماعیلوف انہیں پہلا مامونی شمار کرتے ہیں، اور بعض محققین انہیں مامون بن محمد کا والد سمجھتے ہیں {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 69} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}۔"
