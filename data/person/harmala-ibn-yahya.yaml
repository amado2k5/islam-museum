summary:
  ar: "أبو حفص حرملة بن يحيى التجيبي، من فقهاء الشافعية بمصر {cite:tabaqat-fuqaha-abbas-1981 p. 52}، كان حافظاً للحديث، وصنف «المبسوط» و«المختصر» {cite:tabaqat-fuqaha-abbas-1981 p. 52}. ومات بمصر سنة ثلاث وأربعين ومائتين {cite:tabaqat-fuqaha-abbas-1981 p. 52}."
  tr: "Mısır'daki Şafii hukukçularından biri olan Ebu Hafs Harmala ibn Yahya el-Tujibi {cite:tabaqat-fuqaha-abbas-1981 s. 52}, hadis ezbercisi ve \"Al-Mabsut\" ile \"Al-Mukhtasar\" (atıf:tabaqat-fuqaha-abbas-1981, s. 52} yazarıydı. 243 Hicri yılında Mısır'da öldü {cite:tabaqat-fuqaha-abbas-1981, s. 52}."
  id: "Abu Hafs Harmala ibn Yahya al-Tujibi, salah satu ahli hukum Syafi'i di Mesir {cite:tabaqat-fuqaha-abbas-1981 hlm. 52}, adalah seorang penghafal hadis dan menulis \"Al-Mabsut\" dan \"Al-Mukhtasar\" {cite:tabaqat-fuqaha-abbas-1981, hlm. 52}. Ia meninggal di Mesir pada tahun 243 H {cite:tabaqat-fuqaha-abbas-1981, hlm. 52}."
