summary:
  ar: "عبد الله بن علوي بن محمد الحسيني الحضرمي، المعروف بالحداد باعلوي، فاضل من أهل تريم بحضرموت، ولد في السبير من ضواحيها وتوفي في الحاوي ودفن بتريم، كان كفيفاً، ومن كتبه «الدعوة التامة والتذكرة العامة» و«النصائح الدينية» وديوان «الدر المنظوم»."
  en: "Abd Allah ibn Alawi al-Haddad Ba Alawi, a man of learning from Tarim in Hadramawt, born at al-Subayr, died at al-Hawi and buried in Tarim; he was blind from childhood, and his books include al-Da'wa al-Tamma wa'l-Tadhkira al-Amma, al-Nasa'ih al-Diniyya and the poetry collection al-Durr al-Manzum."
