summary:
  ar: "يحيى بن يوسف بن يحيى الأنصاري، أبو زكريا، جمال الدين الصرصري، شاعر ضرير من أهل صرصر قرب بغداد، له منظومات في الفقه الحنبلي وفي مدح الرسول، قتله التتار يوم دخلوا بغداد سنة 656 هـ."
  en: "Yahya ibn Yusuf ibn Yahya al-Ansari, Abu Zakariyya, Jamal al-Din al-Sarsari, a blind poet from Sarsar near Baghdad who versified Hanbali jurisprudence and praise of the Prophet; killed by the Tatars when they entered Baghdad, 656 AH (1258)."
  es: "Yahya ibn Yusuf ibn Yahya al-Ansari, Abu Zakariyya, Jamal al-Din al-Sarsari, un poeta ciego de Sarsar, cerca de Bagdad, que versificó la jurisprudencia hanbali y las alabanzas del Profeta; asesinado por los tártaros cuando entraron en Bagdad, 656 AH (1258)."
  fr: "Yahya ibn Yusuf ibn Yahya al-Ansari, Abu Zakariyya, Jamal al-Din al-Sarsari, un poète aveugle de Sarsar près de Bagdad qui a versifié la jurisprudence hanbalite et l'éloge du Prophète; tué par les Tatars lors de leur entrée à Bagdad, 656 AH (1258)."
