summary:
  ar: "السلطان أحمد الثاني ⁦(١١٠٢–١١٠٦هـ/١٦٩١–١٦٩٤م تقريباً)⁩؛ تولى الحكم بعد وفاة أخيه السلطان سليمان الثاني عام ١١٠٢هـ، واستشهد في زمنه الصدر الأعظم مصطفى كوبريللي الذي كان عظيم النفع للدولة، وتولى بعده علي باشا أوريجي وكان ضعيفاً، فاحتلت البندقية بعض جزر بحر إيجة، ولم يطل القتال في أيامه القصيرة إذ كان مناوشات، حتى توفي عام ١١٠٦هـ فتولى بعده ابن أخيه مصطفى الثاني بن محمد الرابع {cite:dawlat-uthmaniyya-salabi p. 309}."
  en: "Sultan Ahmed II (r. 1691–1694): a four-year reign of skirmishes in which the great Köprülü vizier Mustafa fell in battle and Venice seized Aegean islands {cite:dawlat-uthmaniyya-salabi p. 309}."
  es: "Sultán Ahmed II (r. 1691–1694): un reinado de cuatro años de escaramuzas en el que el gran visir de Köprülü, Mustafa, cayó en batalla y Venecia se apoderó de las islas del Egeo {cite:dawlat-uthmaniyya-salabi p. 309}."
  fr: "Sultan Ahmed II (r. 1691–1694): un règne de quatre ans d'escarmouches au cours duquel le grand vizir de Köprülü, Mustafa, est tombé au combat et Venise s'est emparée des îles de la mer Égée {cite: dawlat-uthmaniyya-salabi p. 309}."
  ur: "سلطان احمد دوم (1691-1694): جھڑپوں کا چار سالہ دور جس میں عظیم کوپرلو وزیر مصطفیٰ جنگ میں گرے اور وینس نے ایجیئن جزائر پر قبضہ کر لیا۔ 309}۔"
  tr: "Sultan II. Ahmed (1102–1106 Hicri/1691–1694 Miladi); 1102 Hicri yılında kardeşi Sultan II. Süleyman'ın ölümünden sonra yönetimi devraldı ve onun döneminde devlete büyük fayda sağlayan Sadrazam Mustafa Köprülü şehit edildi. Ondan sonra Ali Paşa Origi yönetimi devraldı, ancak zayıf olduğu için Venedik Ege Denizi'ndeki bazı adaları işgal etti ve kısa süren hükümdarlığı boyunca çatışmalar uzun sürmedi, sadece küçük çaplı savaşlar oldu. 1106 Hicri yılında vefat etti ve ondan sonra yeğeni II. Mustafa bin IV. Mehmed yönetimi devraldı. {cite:dawlat-uthmaniyya-salabi s. 309}"
  id: "Sultan Ahmed II (1102–1106 H/1691–1694 M); ia mengambil alih pemerintahan setelah kematian saudaranya, Sultan Suleiman II pada tahun 1102 H, dan selama masa pemerintahannya, Wazir Agung Mustafa Köprülü, yang sangat bermanfaat bagi negara, gugur sebagai martir, dan setelahnya Ali Pasha Origi mengambil alih, namun ia lemah, sehingga Venesia menduduki beberapa pulau di Laut Aegea, dan pertempuran tidak berlangsung lama selama masa pemerintahannya yang singkat, karena hanya berupa pertempuran kecil, hingga ia meninggal pada tahun 1106 H, dan setelahnya keponakannya Mustafa II bin Mehmed IV mengambil alih {cite:dawlat-uthmaniyya-salabi p. 309}."
