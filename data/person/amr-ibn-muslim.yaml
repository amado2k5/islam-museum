class: person
label: { ar: "عمرو بن مسلم الباهلي", en: "Amr ibn Muslim al-Bahili", es: "Amr ibn Muslim al-Bahili", fr: "Amr ibn Muslim al-Bahili", ur: "عمرو بن مسلم الباہلی" }
summary:
  ar: "عمرو بن مسلم الباهلي أخو قتيبة؛ ولاه قتيبة سجستان في أيام الوليد بن عبد الملك فطالب رتبيل بدراهم مدرةمة فذكر أنه لا يمكنه إلا ما فارق عليه الحجاج من العرض فكتب بذلك إلى قتيبة فأقبل قتيبة بنفسه إلى سجستان."
  en: "Amr ibn Muslim al-Bahili, Qutayba's brother; his governor of Sijistan under al-Walid — his demand for arrears drew Rutbil's answer that only al-Hajjaj's 'urud was due, and brought Qutayba himself to the frontier."
  es: "Amr ibn Muslim al-Bahili, hermano de Qutayba y gobernador de Sijistan bajo el mando de al-Walid, exigió el pago de los atrasos, lo que provocó que Rutbil respondiera que solo se adeudaba el 'urud de al-Hajjaj, y que el propio Qutayba se encontrara en la frontera."
  fr: "Amr ibn Muslim al-Bahili, le frère de Qutayba; son gouverneur du Sijistan sous al-Walid — sa demande d'arriérés a suscité la réponse de Rutbil selon laquelle seul l'urud d'al-Hajjaj était dû, et a amené Qutayba lui-même à la frontière."
  ur: "عمرو بن مسلم الباہلی، قتیبہ کے بھائی؛ الولید کے ماتحت سجستان کے اس کے گورنر - بقایا جات کے اس کے مطالبے نے رتبیل کے جواب کی طرف متوجہ کیا کہ صرف الحجاج کا 'ارود' باقی ہے، اور قتیبہ کو خود سرحد پر لے آیا۔"
  tr: "Qutaybah'ın kardeşi Amr ibn Muslim al-Bahili; Qutaybah, onu al-Walid ibn Abd al-Malik döneminde Sijistan valisi olarak atadı. Ratbil, dirhama talep etti ve sadece al-Hajjaj'ın onur için ayrıldığı kadar ödeyebileceğini belirtti. Qutaybah'a yazdı ve Qutaybah bizzat Sijistan'a gitti."
  id: "Amr ibn Muslim al-Bahili, saudara Qutaybah; Qutaybah mengangkatnya sebagai gubernur Sijistan pada masa al-Walid ibn Abd al-Malik. Ratbil menuntut dirham dirhamah, dengan alasan bahwa ia hanya bisa membayar apa yang telah dipisahkan al-Hajjaj sebagai kehormatan. Ia menulis surat kepada Qutaybah, dan Qutaybah sendiri pergi ke Sijistan."
