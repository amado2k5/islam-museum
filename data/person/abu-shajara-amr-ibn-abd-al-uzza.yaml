summary:
  ar: "سلمي ابن الخنساء؛ كان على جمع لبني سليم بجو قراقر ⁦(وقيل النقرة)⁩ فقاتل خالد بن الوليد في الردة فاستشهد من المسلمين رجل ثم فضّ الله جمعهم؛ وأسلم فقدم على عمر بن الخطاب وهو يعطي المساكين فاستعطاه فقال له «ألست القائل: ودويت ريحي من كتيبة خالد وإني لأزجو بعدها أن أعمرا» وعلاه بالدرة فقال «قد محى الإسلام ذلك يا أمير المؤمنين»."
  en: "A Sulami, son of al-Khansa'; he led a gathering of Banu Sulaym at Jaw Quraqir (some say al-Nuqra) and fought Khalid ibn al-Walid in the Ridda until God scattered their gathering after one Muslim fell a martyr; he later embraced Islam and came to Umar ibn al-Khattab as he was giving to the poor, begging of him — Umar said 'are you not the one who said: I have healed my spirit from Khalid's squadron, yet I hope to live long after it?' and struck him with the durra, to which he answered 'Islam has erased that, commander of the faithful'."
  fr: "Sulamite, fils d'al-Khansa', il commanda un rassemblement des Banu Sulaym à Jaw Quraqir (ou, selon d'autres, al-Nuqra) et combattit Khalid ibn al-Walid lors de la Ridda jusqu'à ce que Dieu disperse leur troupe après qu'un musulman fut tombé en martyr. Il embrassa ensuite l'islam et vint solliciter Umar ibn al-Khattab, qui distribuait des dons aux pauvres. Umar lui dit : « N'es-tu pas celui qui a dit : J'ai apaisé mon esprit contre l'escadron de Khalid, mais j'espère vivre longtemps après cela ? » et le frappa de sa durra. Il répondit : « L'islam a effacé cela, Commandeur des croyants. »"
  es: "Un Sulami, hijo de al-Khansa'; dirigió una reunión de Banu Sulaym en Jaw Quraqir (algunos dicen al-Nuqra) y luchó contra Khalid ibn al-Walid en la Ridda hasta que Dios dispersó su reunión después de que un musulmán cayera mártir; más tarde abrazó el Islam y fue a ver a Umar ibn al-Khattab mientras este daba a los pobres, suplicándole. Umar le dijo: \"¿No eres tú quien dijo: 'He curado mi espíritu del escuadrón de Khalid, pero aún espero vivir mucho tiempo después'?\" y lo golpeó con la durra, a lo que él respondió: \"El Islam ha borrado eso, comandante de los creyentes\"."
