summary:
  ar: "سلمي ابن الخنساء؛ كان على جمع لبني سليم بجو قراقر (وقيل النقرة) فقاتل خالد بن الوليد في الردة فاستشهد من المسلمين رجل ثم فضّ الله جمعهم؛ وأسلم فقدم على عمر بن الخطاب وهو يعطي المساكين فاستعطاه فقال له «ألست القائل: ودويت ريحي من كتيبة خالد وإني لأزجو بعدها أن أعمرا» وعلاه بالدرة فقال «قد محى الإسلام ذلك يا أمير المؤمنين»."
  en: "A Sulami, son of al-Khansa'; he led a gathering of Banu Sulaym at Jaw Quraqir (some say al-Nuqra) and fought Khalid ibn al-Walid in the Ridda until God scattered their gathering after one Muslim fell a martyr; he later embraced Islam and came to Umar ibn al-Khattab as he was giving to the poor, begging of him — Umar said 'are you not the one who said: I have healed my spirit from Khalid's squadron, yet I hope to live long after it?' and struck him with the durra, to which he answered 'Islam has erased that, commander of the faithful'."
