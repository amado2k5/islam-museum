label: { ar: "أبو العباس بن واصل صاحب البطيحة" }
summary:
  ar: "أبو العباس بن واصل، كان يخدم الكرج فكان يخرج له في الحساب أنه يملك فكانوا يهزؤون به ويقول له بعضهم إذا صرت ملكاً فاستخدمني ويقول الآخر اخلع عليّ، فصار ملكاً وملك سيراف ثم البصرة وقصد الأهواز وهزم بهاء الدولة وملك البطيحة وأخرج عنها مهذب الدولة علي بن نصر إلى بغداد، وقد فرج بهاء الدولة بما أمكنه من أمواله فأخذت في الطريق واضطر حتى ركب بقرة، ثم قصد ابن واصل فاستجار بحسان بن ثمال الخفاجي فصيره إلى مشهد علي فتصدق هناك بصدقات كثيرة وسار قاصداً بدر بن حسنويه لصداقة بينهما فكيسه أبو الفتح بن عناز فسلمه إلى أصحاب بهاء الدولة فقتله بواسط في صفر سنة سبع وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
