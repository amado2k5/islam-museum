id: person/abu-al-abbas-ibn-wasil
class: person
label: { ar: "أبو العباس بن واصل صاحب البطيحة", en: "Abu al-Abbas ibn Wasil, lord of al-Bata'ih" }
summary:
  ar: "أبو العباس بن واصل، كان يخدم الكرج فكان يخرج له في الحساب أنه يملك فكانوا يهزؤون به ويقول له بعضهم إذا صرت ملكاً فاستخدمني ويقول الآخر اخلع عليّ، فصار ملكاً وملك سيراف ثم البصرة وقصد الأهواز وهزم بهاء الدولة وملك البطيحة وأخرج عنها مهذب الدولة علي بن نصر إلى بغداد، وقد فرج بهاء الدولة بما أمكنه من أمواله فأخذت في الطريق واضطر حتى ركب بقرة، ثم قصد ابن واصل فاستجار بحسان بن ثمال الخفاجي فصيره إلى مشهد علي فتصدق هناك بصدقات كثيرة وسار قاصداً بدر بن حسنويه لصداقة بينهما فكيسه أبو الفتح بن عناز فسلمه إلى أصحاب بهاء الدولة فقتله بواسط في صفر سنة سبع وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
  en: "Abu al-Abbas ibn Wasil. He served the Karaj, and by reckoning it was calculated that he would become a king, so they mocked him: one would say, 'When you are king, employ me,' and another, 'Bestow a robe of honour on me.' He became king: he took Siraf, then Basra, and marched on al-Ahwaz; he defeated Baha al-Dawla, seized al-Bata'ih and expelled Muhadhdhab al-Dawla Ali ibn Nasr from it to Baghdad. Baha al-Dawla escaped with as much of his wealth as he could, but it was taken on the road and he was reduced to riding a cow. He then went to Ibn Wasil and sought protection from Hassan ibn Thumal al-Khafaji, who sent him to the shrine of Ali, where he gave many alms. He set out for Badr ibn Hasanwayh, with whom he had friendship, but Abu al-Fath ibn Anaz took his money and handed him over to Baha al-Dawla's men, who killed him at Wasit in Safar 397 {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
