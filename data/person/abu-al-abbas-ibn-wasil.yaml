id: person/abu-al-abbas-ibn-wasil
class: person
label: { ar: "أبو العباس بن واصل صاحب البطيحة", en: "Abu al-Abbas ibn Wasil, lord of al-Bata'ih", fr: "Abu al-Abbas ibn Wasil, seigneur d'al-Bata'ih", es: "Abu al-Abbas ibn Wasil, lord of al-Bata'ih", ur: "ابو العباس بن واصل، رب البطیح" }
summary:
  ar: "أبو العباس بن واصل، كان يخدم الكرج فكان يخرج له في الحساب أنه يملك فكانوا يهزؤون به ويقول له بعضهم إذا صرت ملكاً فاستخدمني ويقول الآخر اخلع عليّ، فصار ملكاً وملك سيراف ثم البصرة وقصد الأهواز وهزم بهاء الدولة وملك البطيحة وأخرج عنها مهذب الدولة علي بن نصر إلى بغداد، وقد فرج بهاء الدولة بما أمكنه من أمواله فأخذت في الطريق واضطر حتى ركب بقرة، ثم قصد ابن واصل فاستجار بحسان بن ثمال الخفاجي فصيره إلى مشهد علي فتصدق هناك بصدقات كثيرة وسار قاصداً بدر بن حسنويه لصداقة بينهما فكيسه أبو الفتح بن عناز فسلمه إلى أصحاب بهاء الدولة فقتله بواسط في صفر سنة سبع وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
  en: "Abu al-Abbas ibn Wasil. He served the Karaj, and by reckoning it was calculated that he would become a king, so they mocked him: one would say, 'When you are king, employ me,' and another, 'Bestow a robe of honour on me.' He became king: he took Siraf, then Basra, and marched on al-Ahwaz; he defeated Baha al-Dawla, seized al-Bata'ih and expelled Muhadhdhab al-Dawla Ali ibn Nasr from it to Baghdad. Baha al-Dawla escaped with as much of his wealth as he could, but it was taken on the road and he was reduced to riding a cow. He then went to Ibn Wasil and sought protection from Hassan ibn Thumal al-Khafaji, who sent him to the shrine of Ali, where he gave many alms. He set out for Badr ibn Hasanwayh, with whom he had friendship, but Abu al-Fath ibn Anaz took his money and handed him over to Baha al-Dawla's men, who killed him at Wasit in Safar 397 {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
  fr: "Abu al-Abbas ibn Wasil. Il servit le Karaj, et par un calcul l'on établit qu'il deviendrait roi ; on se moquait donc de lui : l'un disait « Quand tu seras roi, emploie-moi », un autre « Accorde-moi une robe d'honneur ». Il devint roi : il prit Siraf, puis Bassora, et marcha sur al-Ahwaz ; il vainquit Baha al-Dawla, s'empara d'al-Bata'ih et en chassa Muhadhdhab al-Dawla Ali ibn Nasr vers Bagdad. Baha al-Dawla s'échappa avec autant de ses biens qu'il put, mais ils lui furent pris en route et il fut réduit à monter une vache. Il se rendit ensuite auprès d'Ibn Wasil et demanda la protection de Hassan ibn Thumal al-Khafaji, qui l'envoya au sanctuaire d'Ali, où il donna beaucoup d'aumônes. Il partit pour rejoindre Badr ibn Hasanwayh, avec qui il était lié d'amitié, mais Abu al-Fath ibn Anaz prit son argent et le livra aux hommes de Baha al-Dawla, qui le tuèrent à Wasit en Safar 397 {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
  es: "Abu al-Abbas ibn Wasil. Sirvió a los Karaj, y según los cálculos, se preveía que llegaría a ser rey, por lo que se burlaban de él: uno le decía: «Cuando seas rey, contrátame», y otro: «Concédeme una túnica de honor». Llegó a ser rey: tomó Siraf, luego Basora, y marchó sobre al-Ahwaz; derrotó a Baha al-Dawla, se apoderó de al-Bata'ih y expulsó a Muhadhdhab al-Dawla Ali ibn Nasr a Bagdad. Baha al-Dawla escapó con la mayor parte de su riqueza, pero se la robaron en el camino y se vio obligado a montar una vaca. Entonces fue a ver a Ibn Wasil y buscó la protección de Hassan ibn Thumal al-Khafaji, quien lo envió al santuario de Ali, donde ofreció muchas limosnas. Se dirigió a Badr ibn Hasanwayh, con quien tenía amistad, pero Abu al-Fath ibn Anaz le quitó el dinero y lo entregó a los hombres de Baha al-Dawla, quienes lo mataron en Wasit en Safar 397 {cite:muntazam-ibn-al-jawzi j.7 p.236-237}."
  ur: "ابو العباس ابن واصل۔ اس نے کاراج کی خدمت کی، اور حساب لگا کر یہ کہا گیا کہ وہ بادشاہ بنے گا، تو انہوں نے اس کا مذاق اڑایا: ایک کہتا تھا، 'جب تم بادشاہ ہو تو مجھے ملازمت پر رکھو،' اور دوسرا کہتا تھا، 'مجھے عزت کی چادر عطا کرو۔' وہ بادشاہ بنا: اس نے سیرف، پھر بصرہ، اور الاہواز پر چڑھائی کی۔ اس نے بہاء الدولہ کو شکست دی، البطیح پر قبضہ کر لیا اور محدث الدولہ علی بن نصر کو اس سے بغداد نکال دیا۔ بہاء الدولہ اپنی زیادہ سے زیادہ دولت لے کر فرار ہو گیا، لیکن اسے سڑک پر لے جایا گیا اور وہ گائے پر سوار ہو گیا۔ اس کے بعد وہ ابن وصل کے پاس گیا اور حسن بن ثمل الخفاجی سے حفاظت کی درخواست کی، جس نے اسے علی کے مزار پر بھیجا، جہاں اس نے بہت سے خیرات کیں۔ وہ بدر بن حسنویہ کی طرف روانہ ہوا، جس سے اس کی دوستی تھی، لیکن ابو الفتح ابن اناز نے اس کی رقم لے کر بہاء الدولہ کے آدمیوں کے حوالے کر دی، جنہوں نے صفر 397 میں وصیت کے مقام پر اسے قتل کر دیا۔"
