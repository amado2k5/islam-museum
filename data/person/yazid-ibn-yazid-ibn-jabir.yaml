summary:
  ar: "يزيد بن يزيد بن جابر الأزدي الدمشقي، كان ثقة فقيها عالما حافظا، روى عن مكحول وعبد الرحمن بن أبي عمرة وبسر بن عبيد الله الحضرمي وجماعة، وروى عنه أخوه عبد الرحمن والأوزاعي والسفيانان. توفي سنة 134هـ، وقيل قبل ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  en: "Yazid ibn Yazid ibn Jabir al-Azdi al-Dimashqi, a trustworthy jurist, scholar and memoriser. He transmitted from Makhul, Abd al-Rahman ibn Abi Amra, Busr ibn Ubayd Allah al-Hadrami and others; his brother Abd al-Rahman, al-Awza'i and the two Sufyans transmitted from him. He died in 134 AH, or earlier by another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
