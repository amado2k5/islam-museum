summary:
  ar: "يزيد بن يزيد بن جابر الأزدي الدمشقي، كان ثقة فقيها عالما حافظا، روى عن مكحول وعبد الرحمن بن أبي عمرة وبسر بن عبيد الله الحضرمي وجماعة، وروى عنه أخوه عبد الرحمن والأوزاعي والسفيانان. توفي سنة 134هـ، وقيل قبل ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  en: "Yazid ibn Yazid ibn Jabir al-Azdi al-Dimashqi, a trustworthy jurist, scholar and memoriser. He transmitted from Makhul, Abd al-Rahman ibn Abi Amra, Busr ibn Ubayd Allah al-Hadrami and others; his brother Abd al-Rahman, al-Awza'i and the two Sufyans transmitted from him. He died in 134 AH, or earlier by another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  es: "Yazid ibn Yazid ibn Jabir al-Azdi al-Dimashqi, jurista, erudito y memorizador de gran confianza. Transmitió de Makhul, Abd al-Rahman ibn Abi Amra, Busr ibn Ubayd Allah al-Hadrami y otros; su hermano Abd al-Rahman, al-Awza'i y los dos Sufyan transmitieron de él. Falleció en el año 134 de la Hégira, o antes según otro relato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  fr: "Yazid ibn Yazid ibn Jabir al-Azdi al-Dimashqi, juriste, érudit et mémorisateur de confiance, transmit de Makhul, Abd al-Rahman ibn Abi Amra, Busr ibn Ubayd Allah al-Hadrami et d'autres; son frère Abd al-Rahman, al-Awza'i et les deux Sufyans transmirent de lui. Il mourut en 134 AH, ou plus tôt selon une autre source. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  ur: "یزید بن یزید بن جابر العزدی الدمشقی، ایک ثقہ فقیہ، عالم اور حافظ۔ انہوں نے مکول، عبدالرحمٰن بن ابی عمرہ، بسر بن عبید اللہ الحدرمی وغیرہ سے روایت کی ہے۔ اس کے بھائی عبدالرحمٰن، الاوزاعی اور دو سفیان اس سے نقل ہوئے ہیں۔ ان کی وفات 134 ہجری یا اس سے قبل کسی اور روایت کے مطابق ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2073}"
  tr: "Yezid bin Yezid ibn Cabir el-Azdi el-Dimashqi güvenilir, hukukçu, alim ve ezberleyiciydi. Makhul, Abd al-Rahman ibn Ebi Ömer, Basr bin Ubeyd Allah el-Hadrami ve diğer birçok kişiden rivayet etti. Kardeşi Abdülrahman, el-Avzai ve el-Sufyan ondan rivayet etti. 134 Hicri yılında öldü ve bundan önce de söylendi. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.2073}"
  id: "Yazid ibn Yazid ibn Jabir al-Azdi al-Dimashqi adalah seorang yang dapat dipercaya, ahli hukum, cendekiawan, dan penghafal. Ia menceritakan dari Makhul, Abd al-Rahman ibn Abi Umar, Basr ibn Ubayd Allah al-Hadrami, dan sekelompok lainnya. Saudaranya Abd al-Rahman, al-Awza'i, dan al-Sufyan menceritakan darinya. Ia meninggal pada tahun 134 H, dan itu dikatakan sebelum itu. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.2073}"
