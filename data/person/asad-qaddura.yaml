summary:
  ar: "عالم دين فلسطيني من صفد (1880–1959)، درس في دمشق ثم في الأزهر على يد محمد عبده، وأسّس مدرسة وطنية في الجامع الأحمر بصفد، وكان مفتي صفد في الحرب العالمية الأولى وقاضيًا شرعيًا على الناصرة وعكا وصفد في عهد الانتداب، وشارك في الحركة الوطنية وفي مؤتمرات علماء فلسطين، ونزح بعد نكبة 1948 إلى دمشق حيث توفي."
  en: "Palestinian religious scholar from Safed (1880–1959). He studied at Damascus and then at al-Azhar under Muhammad Abduh, founded a national school in Safed's Red Mosque, served as mufti of Safed in the First World War and as sharia judge for Nazareth, Acre and Safed under the Mandate, and took part in the national movement and the Palestine scholars' conferences; after the Nakba of 1948 he fled to Damascus, where he died."
  ur: "صفد سے تعلق رکھنے والے فلسطینی عالمِ دین (1880–1959)۔ انہوں نے دمشق اور پھر الازہر میں محمد عبدہ سے تعلیم پائی، صفد کی سرخ مسجد میں ایک قومی مدرسہ قائم کیا، پہلی جنگِ عظیم میں صفد کے مفتی اور انتداب کے دور میں ناصرہ، عکہ اور صفد کے شرعی قاضی رہے، قومی تحریک اور فلسطینی علماء کی کانفرنسوں میں حصہ لیا؛ 1948ء کے نکبہ کے بعد دمشق چلے گئے جہاں ان کا انتقال ہوا۔"
