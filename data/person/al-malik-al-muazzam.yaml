id: person/al-malik-al-muazzam
class: person
label: { ar: "الملك المعظم عيسى بن العادل صاحب دمشق", en: "al-Malik al-Mu'azzam Isa ibn al-Adil, lord of Damascus" }
summary:
  ar: "ابن الملك العادل أبي بكر بن أيوب صاحب دمشق من وفاة أبيه سنة خمس عشرة وستمائة إلى موته، كان عالماً بعدة علوم فاضلاً فيها منها الفقه على مذهب أبي حنيفة حتى صار من المتميزين فيه والنحو واللغة، وأمر أن يجمع له كتاب في اللغة جامع فيه الصحاح للجوهري ويضاف إليه ما فاته من التهذيب للأزهري والجمهرة لابن دريد، وأمر بترتيب مسند أحمد بن حنبل على الأبواب يرد كل حديث إلى بابه، ونفق العلم في سوقه وقصده العلماء من الآفاق فأكرمهم وأجرى عليهم الجرايات وجالسهم وصبر على سماع ما يكره، وكان حسن الاعتقاد يقول إن اعتقادي في الأصول ما سطره أبو جعفر الطحاوي، ووصى أن يكفن في البياض لا ثوب فيه ذهب ويدفن في لحد لا بناء عليه تحت السماء، وكان يقول في مرضه لي عند الله في أمر دمياط ما أرجو أن يرحمني به، وتوفي يوم الجمعة سلخ ذي القعدة سنة أربع وعشرين وستمائة بدوسنطاريا بعد عشر سنين وخمسة أشهر في الملك وولي بعده ابنه الناصر داود {cite:kamil-ibn-al-athir p. 474}. وفي الشذرات ولد بالقاهرة سنة ست وسبعين وخمسمائة وحفظ القرآن وبرع في الفقه وشرح الجامع الكبير في عدة مجلدات بإعانة غيره وسمع المسند لابن حنبل وله شعر كثير، وكان عديم الالتفات إلى النواميس وأبهة الملوك ويركب وحده مراراً؛ وقال ابن الأهدل كان حنفياً شديد التعصب لمذهبه ولم يكن في بني أيوب حنفي سواه وتبعه أولاده، وكان قد شرط لمن حفظ المفصل للزمخشري مائة دينار وخلعة فحفظه جماعة لهذا السبب؛ ولما مرض ابن عنين كتب إليه فجاءه بصرة فيها ثلاثمائة دينار وقال هذه الصلة وأنا العائد؛ توفي في سلخ ذي القعدة وقال ابن خلكان توفي يوم الجمعة مستهل ذي الحجة بدمشق ودفن في قلعتها ثم نقل إلى الصالحية ودفن في مدرسته بها قبور جماعة من إخوته وأهل بيته تعرف بالمعظمية {cite:shadharat-dhahab p. 115-116}."
  en: "Son of al-Malik al-Adil Abu Bakr ibn Ayyub, lord of Damascus from his father's death in 615 until his own death. He was learned in several sciences and excelled in them: jurisprudence in the school of Abu Hanifa, to the point of being among its distinguished scholars, and grammar and lexicography. He ordered a comprehensive dictionary compiled for him, combining al-Jawhari's Sihah with what it lacked from al-Azhari's Tahdhib and Ibn Durayd's Jamhara. He ordered Ahmad ibn Hanbal's Musnad arranged by chapters, so that each hadith returned to its chapter. Learning flourished in his time, scholars came to him from distant regions, and he honoured them, paid them stipends, sat with them, and bore patiently with what he disliked to hear. His creed was sound; he said that his creed in the fundamentals was what Abu Ja'far al-Tahawi had written. He directed that he be shrouded in white cloth without gold and buried in a lahd with no structure over it, under the open sky. In his illness he said that, concerning Damietta, he had with God what he hoped would win him mercy. He died on Friday, the last day of Dhu'l-Qa'da 624, of dysentery, after ten years and five months in power, and was succeeded by his son al-Nasir Dawud {cite:kamil-ibn-al-athir p. 474}. Shadharat al-Dhahab says he was born in Cairo in 576, memorised the Qur'an, excelled in jurisprudence, wrote a commentary on the Jami' al-Kabir in several volumes with help from others, heard the Musnad of Ibn Hanbal, and wrote much poetry; he was indifferent to the protocol and pomp of kings and often rode alone. Ibn al-Ahdal said he was a Hanafi, intensely partisan for his school and the only Hanafi among the Ayyubids, and that his children followed him in this. He had set a reward of a hundred dinars and a robe for anyone who memorised al-Zamakhshari's Mufassal, and a group memorised it for that reason. When Ibn Unayn fell ill, he wrote to him and sent him a purse of three hundred dinars, saying, 'This is the gift, and I am the visitor.' He died on the last day of Dhu'l-Qa'da; Ibn Khallikan said he died on Friday, the first of Dhu'l-Hijja, in Damascus, and was buried in its citadel, then moved to al-Salihiyya and buried in his madrasa there, where the graves of several of his brothers and kinsmen are known as the Mu'azzamiyya {cite:shadharat-dhahab p. 115-116}."
