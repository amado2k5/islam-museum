class: person
label: { ar: "الملك المعظم عيسى بن العادل صاحب دمشق" }
summary:
  ar: "ابن الملك العادل أبي بكر بن أيوب صاحب دمشق من وفاة أبيه سنة خمس عشرة وستمائة إلى موته، كان عالماً بعدة علوم فاضلاً فيها منها الفقه على مذهب أبي حنيفة حتى صار من المتميزين فيه والنحو واللغة، وأمر أن يجمع له كتاب في اللغة جامع فيه الصحاح للجوهري ويضاف إليه ما فاته من التهذيب للأزهري والجمهرة لابن دريد، وأمر بترتيب مسند أحمد بن حنبل على الأبواب يرد كل حديث إلى بابه، ونفق العلم في سوقه وقصده العلماء من الآفاق فأكرمهم وأجرى عليهم الجرايات وجالسهم وصبر على سماع ما يكره، وكان حسن الاعتقاد يقول إن اعتقادي في الأصول ما سطره أبو جعفر الطحاوي، ووصى أن يكفن في البياض لا ثوب فيه ذهب ويدفن في لحد لا بناء عليه تحت السماء، وكان يقول في مرضه لي عند الله في أمر دمياط ما أرجو أن يرحمني به، وتوفي يوم الجمعة سلخ ذي القعدة سنة أربع وعشرين وستمائة بدوسنطاريا بعد عشر سنين وخمسة أشهر في الملك وولي بعده ابنه الناصر داود {cite:kamil-ibn-al-athir p. 474}."
