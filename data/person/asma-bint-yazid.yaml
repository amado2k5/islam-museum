summary:
  ar: صحابية من بني عبد الأشهل ابنة عم معاذ بن جبل، تكنى أم سلمة ويقال لها «خطيبة النساء»؛ بايعت النبي في نسوة، وشهدت اليرموك، وقتلت يومئذ تسعة من الروم بعمود فسطاطها وعاشت بعد ذلك دهراً.
  en: A Companion of Banu Abd al-Ashhal, cousin of Mu'adh ibn Jabal, known by the kunya Umm Salama and called 'the orator of the women'; she gave her pledge to the Prophet among a group of women, was at al-Yarmuk, and killed nine Byzantines with
    a tent pole there and lived on for a long time.
