gender: male
roles: [commander]
summary:
  ar: "أظهر خلافة عبد الله بن الزبير بالشام، وكان على رأس جيشه هناك، فالتقى مروان بن الحكم بمرج راهط قرب دمشق فقُتل فيها على يد رجل من تيم اللات، وقُتل معه كثير من قيس {cite:bakr-umayyad-state-1134715 p. 202}."
  en: "He proclaimed the caliphate of Abd Allah ibn al-Zubayr in Syria and was at the head of his army there. At Marj Rahit near Damascus he met Marwan ibn al-Hakam, and he was killed there at the hands of a man of Taym al-Lat, and many of Qays fell with him {cite:bakr-umayyad-state-1134715 p. 202}."
  fr: "Il proclama le califat d’Abd Allah ibn al-Zubayr en Syrie et y commanda son armée. À Marj Rahit près de Damas, il rencontra Marwan ibn al-Hakam et y fut tué par un homme de Taym al-Lat ; de nombreux hommes de Qays tombèrent avec lui {cite:bakr-umayyad-state-1134715 p. 202}."
  es: "Proclamó el califato de Abd Allah ibn al-Zubayr en Siria y estuvo al frente de su ejército allí. En Marj Rahit, cerca de Damasco, se encontró con Marwan ibn al-Hakam, y fue asesinado allí por un hombre de Taym al-Lat, y muchos Qays cayeron con él {cite:bakr-umayyad-state-1134715 p. 202}."
  ur: "اس نے شام میں عبد اللہ بن الزبیر کی خلافت کا اعلان کیا اور وہاں اپنی فوج کے سربراہ تھے۔ دمشق کے قریب مرج رہیت کے مقام پر اس کی ملاقات مروان بن الحکم سے ہوئی اور وہ وہاں تیم اللات کے ایک شخص کے ہاتھوں مارا گیا اور بہت سے قیس اس کے ساتھ مارے گئے۔ 202}۔"
