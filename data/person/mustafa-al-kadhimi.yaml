summary:
  ar: "مصطفى عبد اللطيف مشتت الغريباوي، المعروف بمصطفى الكاظمي (وُلد 5 تموز 1967)، سياسي عراقي مستقل، رئيس وزراء العراق من 7 أيار 2020 إلى 27 تشرين الأول 2022. ترأس جهاز المخابرات الوطني العراقي من 2016 إلى 2022، وعمل قبلها صحفيًا ومديرًا لمؤسسة ذاكرة العراق، ونجا من محاولة اغتيال بطائرة مسيّرة في تشرين الثاني 2021."
  en: "Mustafa Abdul Latif Mishatat al-Gharibawi, known as Mustafa Al-Kadhimi (born 5 July 1967), is an independent Iraqi politician who was prime minister of Iraq from 7 May 2020 to 27 October 2022. He directed the Iraqi National Intelligence Service from 2016 to 2022, worked earlier as a journalist and as director of the Iraq Memory Foundation, and survived a drone assassination attempt in November 2021."
  ur: "مصطفى عبد اللطیف مشتت الغریباوی، معروف بہ مصطفى الکاظمی (پیدائش 5 جولائی 1967ء)، ایک آزاد عراقی سیاست دان ہیں جو 7 مئی 2020ء سے 27 اکتوبر 2022ء تک عراق کے وزیرِ اعظم رہے۔ وہ 2016ء سے 2022ء تک عراقی قومی انٹیلی جنس سروس کے سربراہ رہے، اس سے پہلے صحافی اور عراق میموری فاؤنڈیشن کے ڈائریکٹر تھے، اور نومبر 2021ء میں ڈرون قاتلانہ حملے میں بچ گئے۔"
