summary:
  ar: "عالم سعودي وأستاذ أصول الفقه بالجامعة الإسلامية بالمدينة المنورة، وإمام مسجد قباء وخطيبه، ومدرّس بالمسجد النبوي، وُلد بالمدينة المنورة في رجب 1386هـ الموافق أكتوبر 1966م، وحفظ القرآن قبل العاشرة وحضر مجالس علماء المدينة منذ طفولته."
  en: "Saudi scholar and professor of usul al-fiqh at the Islamic University of Madinah, imam and khateeb of Quba Mosque and a teacher in the Prophet's Mosque. He was born in Madinah in Rajab 1386 AH (October 1966), memorised the Quran before the age of ten, and attended the circles of Madinah's scholars from childhood."
  ur: "سعودی عالم اور جامعہ اسلامیہ مدینہ منورہ میں اصولِ فقہ کے استاد، مسجدِ قباء کے امام و خطیب اور مسجدِ نبوی کے مدرس۔ وہ رجب 1386ھ ⁦(اکتوبر 1966)⁩ میں مدینہ منورہ میں پیدا ہوئے، دس برس کی عمر سے پہلے قرآن حفظ کیا اور بچپن ہی سے مدینہ کے علما کی مجلسوں میں حاضر ہوتے رہے۔"
  es: "Erudito saudí y profesor de usul al-fiqh en la Universidad Islámica de Medina, imán y predicador de la Mezquita de Quba y maestro en la Mezquita del Profeta. Nació en Medina en Rajab de 1386 AH (octubre de 1966), memorizó el Corán antes de los diez años y frecuentó los círculos de eruditos de Medina desde su infancia."
  fr: "Érudit saoudien et professeur de jurisprudence islamique (usul al-fiqh) à l'Université islamique de Médine, imam et khatib de la mosquée de Quba et enseignant à la mosquée du Prophète, il est né à Médine en Rajab 1386 AH (octobre 1966). Il a mémorisé le Coran avant l'âge de dix ans et a fréquenté les cercles d'érudits de Médine dès son enfance."
  tr: "Suudi bir âlim, Medine İslam Üniversitesi'nde fıkıh prensipleri profesörü, Kube Camii'nin imamı ve vaizi ile Peygamber Camii'nde öğretmendir. 1386 Hicri Rajab'ında, yani Ekim 1966'ya denk gelen Medine'de doğdu. On yaşından önce Kur'an'ı ezberledi ve çocukluğundan beri Medine'deki alimlerin toplantılarına katıldı."
  id: "Seorang ulama Saudi, profesor prinsip fiqhologi di Universitas Islam Madinah, imam dan pengkhotbah Masjid Quba, serta guru di Masjid Nabi. Ia lahir di Madinah pada Rajab 1386 H, sesuai dengan Oktober 1966 M. Ia menghafal Al-Qur'an sebelum usia sepuluh tahun dan menghadiri pertemuan ulama Madinah sejak kecil."
