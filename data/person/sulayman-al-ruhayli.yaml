summary:
  ar: "عالم سعودي وأستاذ أصول الفقه بالجامعة الإسلامية بالمدينة المنورة، وإمام مسجد قباء وخطيبه، ومدرّس بالمسجد النبوي، وُلد بالمدينة المنورة في رجب 1386هـ الموافق أكتوبر 1966م، وحفظ القرآن قبل العاشرة وحضر مجالس علماء المدينة منذ طفولته."
  en: "Saudi scholar and professor of usul al-fiqh at the Islamic University of Madinah, imam and khateeb of Quba Mosque and a teacher in the Prophet's Mosque. He was born in Madinah in Rajab 1386 AH (October 1966), memorised the Quran before the age of ten, and attended the circles of Madinah's scholars from childhood."
  ur: "سعودی عالم اور جامعہ اسلامیہ مدینہ منورہ میں اصولِ فقہ کے استاد، مسجدِ قباء کے امام و خطیب اور مسجدِ نبوی کے مدرس۔ وہ رجب 1386ھ (اکتوبر 1966) میں مدینہ منورہ میں پیدا ہوئے، دس برس کی عمر سے پہلے قرآن حفظ کیا اور بچپن ہی سے مدینہ کے علما کی مجلسوں میں حاضر ہوتے رہے۔"
