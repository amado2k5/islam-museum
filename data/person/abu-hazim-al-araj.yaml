label: { ar: "أبو حازم الأعرج", en: "Abu Hazim al-A'raj", fr: "Abu Hazim al-A'raj", es: "Abu Hazim al-A'raj", ur: "ابو حازم العراج" }
summary:
  ar: "الزاهد الواعظ، سأله سليمان بن عبد الملك ما لنا نكره الموت فقال لأنكم عمرتم دنياكم وأخربتم آخرتكم فأنتم تكرهون النقلة من العمران إلى الخراب، وقال كيف القدوم على الله فقال أما المحسن فكالغائب يأتي أهله مسروراً وأما المسيء فكالعبد الآبق يأتي مولاه محزوناً {cite:muruj-al-dhahab p. 167-168}. ويذكر الكتاب أن سليمان بن عبد الملك دعاه حين حج سنة 97هـ، فنصحه أبو حازم بتقوى الله وبأن يعرض عمله على كتاب الله، وأن من أفضل الأعمال أداء الفرائض مع اجتناب المحارم، ورفض عطاءه. {cite:salabi-umayyad-state-2020 p.149-151}"
  en: "The ascetic whose counsel to Sulayman — 'you loathe death because you built your world and ruined your next; the doer of good arrives like a traveller to his folk rejoicing' {cite:muruj-al-dhahab p. 167-168}."
  fr: "L'ascète dont le conseil à Sulayman — « vous haïssez la mort parce que vous avez bâti votre monde et ruiné votre au-delà ; celui qui fait le bien arrive comme un voyageur qui rejoint les siens dans la joie » {cite:muruj-al-dhahab p. 167-168}."
  es: "El asceta cuyo consejo a Sulayman — 'odias la muerte porque construiste tu mundo y arruinaste el siguiente; el que hace el bien llega como un viajero a su pueblo regocijado' {cite:muruj-al-dhahab p. 167-168}."
  ur: "وہ سنیاسی جس کا سلیمان کو مشورہ - 'تم موت سے نفرت کرتے ہو کیونکہ تم نے اپنی دنیا بنائی اور اپنی اگلی بربادی کی۔ نیکی کرنے والا ایک مسافر کی طرح اپنی قوم کے پاس پہنچتا ہے جو خوشی مناتے ہیں''۔ 167-168}۔"
  tr: "Münzevi vaiz, Süleyman ibn Abdülmalik tarafından neden ölümden hoşlanmadığımız sorulduğunda, \"Çünkü dünyevi hayatınızı kurdunuz ve ahiret hayatınızı mahvettiniz, bu yüzden refahtan yıkıma geçişten hoşlanmıyorsunuz\" diye cevap verdi. Sonra ona, \"Allah'ın huzuruna nasıl çıkacağız?\" diye soruldu. O da, \"Salihler, ailesine sevinçle dönen bir yolcu gibi olacaklar; kötüler ise efendisine kederle dönen kaçak bir köle gibi olacaklar\" diye cevap verdi. {kaynak: Muruj-al-Dhahab s. 167-168}. Kitap ayrıca, Süleyman ibn Abdülmalik'in Hicri 97 yılında Hac ibadetini yerine getirirken onu çağırdığını da belirtiyor. Ebu Hazim ona Allah'tan korkmasını ve amellerini Kur'an ışığında değerlendirmesini tavsiye etmiş, en hayırlı amellerin farzları yerine getirirken haramlardan uzak durmak olduğunu söylemiş ve hediyesini reddetmiştir. {kaynak: Salabi-Umayyad-State-2020 s. 149-151}"
  id: "Pendakwah yang hidup sederhana itu ditanya oleh Sulaiman ibn Abd al-Malik mengapa mereka tidak menyukai kematian. Beliau menjawab, \"Karena kalian telah membangun kehidupan duniawi kalian dan menghancurkan kehidupan akhirat kalian, sehingga kalian tidak menyukai peralihan dari kemakmuran ke kehancuran.\" Kemudian beliau ditanya, \"Bagaimana kita akan menghadap Allah?\" Beliau menjawab, \"Orang-orang yang saleh akan seperti seorang musafir yang kembali kepada keluarganya dengan gembira, sedangkan orang-orang jahat akan seperti seorang budak yang melarikan diri dan kembali kepada tuannya dengan sedih.\" {kutipan:muruj-al-dhahab hlm. 167-168}. Kitab ini juga menyebutkan bahwa Sulaiman ibn Abd al-Malik memanggilnya ketika beliau menunaikan ibadah haji pada tahun 97 Hijriah. Abu Hazim menasihatinya untuk takut kepada Allah dan memeriksa tindakannya berdasarkan Al-Quran, dengan menyatakan bahwa amal terbaik adalah melaksanakan amal wajib sambil menjauhi hal-hal yang dilarang, dan beliau menolak hadiah tersebut. {kutipan:salabi-umayyad-state-2020 hlm. 149-151}"
