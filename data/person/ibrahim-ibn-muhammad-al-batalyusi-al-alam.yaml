  ur: "اندلس کے ادیب، ماہر فلکیات اور قرآن کے قاری ابو اسحاق ابراہیم بن محمد العلام البطالیوسی، بادجوز میں پیدا ہوئے اور سیویل میں آباد ہوئے، جو شعریات پر فلسفی، گرامر اور تفسیر کے لیے جانا جاتا ہے۔"
