id: person/al-mutasim-abi-ishaq
class: person
label: { ar: "المعتصم بالله أبو إسحاق بن الرشيد", en: "al-Mu'tasim Abu Ishaq ibn al-Rashid" }
summary:
  ar: "المعتصم بالله أبو إسحاق محمد بن هارون الرشيد ثامن خلفاء بني العباس؛ عند البلاذري: خرجت الروم في خلافته إلى زبطرة فقتلوا الرجال وسبوا النساء وأخربوها فأحفظه ذلك وأغضبه فغزاهم حتى بلغ عمورية — وقد أخرب قبلها حصوناً — فأناخ عليها حتى فتحها فقتل المقاتلة وسبى النساء والذرية ثم أخربها وأمر ببناء زبطرة وحصّنها وشحنها. وعند السيوطي نص المأمون له بالخلافة في كتب نفذت إلى البلدان قبيل وفاته فقيل إن ذلك وقع بأمر المأمون وقيل كتب وقت غشي أصابه {cite:tarikh-khulafa-minhaj-1434 p. 493}، وعند السيوطي كان يقال له المثمن لأنه ثامن الخلفاء من بني العباس وثامن من ولد العباس وثامن أولاد الرشيد وملك ثمان سنين وثمانية أشهر وثمانية أيام وعاش ثماناً وأربعين سنة وفتح ثمانية فتوح وقتل ثمانية أعداء وخلف ثمانية أولاد ذكور ومن الإناث كذلك ومات لثمان بقين من ربيع الأول، وكان يتشبه بملوك الأعاجم ويمشي مشيهم، وكان نقش خاتمه الحمد لله الذي ليس كمثله شيء، وأول من ثرى الطعام وكثره حتى بلغ ألف دينار في اليوم، وكتب لملك الروم لما هدده الجواب ما ترى لا ما تسمع وسيعلم الكافر لمن عقبى الدار، وروى الصولي عن حديث أورده عن بني أمية أنه موضوع وآفته الغلابي {cite:tarikh-khulafa-minhaj-1434 p. 520-527}.، وعند المسعودي أن المعتصم سلك في النحلة رأي أخيه المأمون وغلب عليه حب الفروسية والتشبه بالملوك الأعاجم في الآلة ولبس القلانس والشاشيات فلبسها الناس اقتداء به فسميت المعتصميات، وأمنت به السبل في أيامه {cite:muruj-al-dhahab p. 672}"
  en: "al-Mu'tasim bi'llah Abu Ishaq Muhammad ibn Harun al-Rashid, eighth caliph of the Abbasids; in al-Baladhuri: in his caliphate the Romans came out to Zibatra, killed its men, captured its women and wrecked it — which grieved and angered him so that he raided them as far as Amorium, having destroyed forts on the way, camped on it, took it, killed the fighters, captured the women and children, demolished it, and ordered Zibatra rebuilt, fortified and garrisoned."
