id: person/al-mutasim-abi-ishaq
class: person
label: { ar: "المعتصم بالله أبو إسحاق بن الرشيد", en: "al-Mu'tasim Abu Ishaq ibn al-Rashid", fr: "al-Mu'tasim Abu Ishaq ibn al-Rashid", es: "al-Mu'tasim Abu Ishaq ibn al-Rashid", ur: "المعتصم ابو اسحاق ابن الرشید" }
summary:
  ar: "المعتصم بالله أبو إسحاق محمد بن هارون الرشيد ثامن خلفاء بني العباس؛ عند البلاذري: خرجت الروم في خلافته إلى زبطرة فقتلوا الرجال وسبوا النساء وأخربوها فأحفظه ذلك وأغضبه فغزاهم حتى بلغ عمورية — وقد أخرب قبلها حصوناً — فأناخ عليها حتى فتحها فقتل المقاتلة وسبى النساء والذرية ثم أخربها وأمر ببناء زبطرة وحصّنها وشحنها. وعند السيوطي نص المأمون له بالخلافة في كتب نفذت إلى البلدان قبيل وفاته فقيل إن ذلك وقع بأمر المأمون وقيل كتب وقت غشي أصابه {cite:tarikh-khulafa-minhaj-1434 p. 493}، وعند السيوطي كان يقال له المثمن لأنه ثامن الخلفاء من بني العباس وثامن من ولد العباس وثامن أولاد الرشيد وملك ثمان سنين وثمانية أشهر وثمانية أيام وعاش ثماناً وأربعين سنة وفتح ثمانية فتوح وقتل ثمانية أعداء وخلف ثمانية أولاد ذكور ومن الإناث كذلك ومات لثمان بقين من ربيع الأول، وكان يتشبه بملوك الأعاجم ويمشي مشيهم، وكان نقش خاتمه الحمد لله الذي ليس كمثله شيء، وأول من ثرى الطعام وكثره حتى بلغ ألف دينار في اليوم، وكتب لملك الروم لما هدده الجواب ما ترى لا ما تسمع وسيعلم الكافر لمن عقبى الدار، وروى الصولي عن حديث أورده عن بني أمية أنه موضوع وآفته الغلابي {cite:tarikh-khulafa-minhaj-1434 p. 520-527}. وعند المسعودي أن المعتصم سلك في النحلة رأي أخيه المأمون وغلب عليه حب الفروسية والتشبه بالملوك الأعاجم في الآلة ولبس القلانس والشاشيات فلبسها الناس اقتداء به فسميت المعتصميات، وأمنت به السبل في أيامه {cite:muruj-al-dhahab p. 672}، وعند المسعودي كان يحب جمع الأتراك وشراءهم فاجتمع له أربعة آلاف ألبسهم الديباج والمناطق المذهبة وأبانهم بالزي، واصطنع قوماً من حوف مصر واليمن وقيس سماهم المغاربة، فلما آذت الأتراك عوام بغداد بجري الخيول في الأسواق عزم على النقلة فنزل البراذان ثم القاطول ثم سامرا، ومن خبره أنه رأى شيخاً زلق حماره في الطين فنزل واحتمله بيد واحدة وأخرجه ثم حمل الشوك عليه وغسل يديه وأمر له بأربعة آلاف درهم {cite:muruj-al-dhahab p. 442, 444-445}، وتوفي على دجلة في قصره المعروف بالخاقاني يوم الخميس لثماني عشرة ليلة بقيت من ربيع الأول سنة سبع وعشرين ومائتين وهو ابن ثمان وأربعين سنة، وولد بالخلد ببغداد سنة ثمانين ومائة وهو ثامن الخلفاء والثامن من ولد العباس ومات عن ثمانية بنين وثماني بنات {cite:muruj-al-dhahab p. 453}"
  en: "al-Mu'tasim bi'llah Abu Ishaq Muhammad ibn Harun al-Rashid, eighth caliph of the Abbasids; in al-Baladhuri: in his caliphate the Romans came out to Zibatra, killed its men, captured its women and wrecked it — which grieved and angered him so that he raided them as far as Amorium, having destroyed forts on the way, camped on it, took it, killed the fighters, captured the women and children, demolished it, and ordered Zibatra rebuilt, fortified and garrisoned."
  fr: "Al-Mu'tasim bi'llah Abu Ishaq Muhammad ibn Harun al-Rashid, huitième calife des Abbassides ; à al-Baladhuri : dans son califat, les Romains sont sortis à Zibatra, ont tué ses hommes, capturé ses femmes et l'ont détruit - ce qui l'a attristé et irrité de sorte qu'il les a attaqués jusqu'à Amorium, après avoir détruit des forts sur le chemin, campé dessus, l'a pris, a tué les combattants, capturé les femmes et les enfants, l'a démoli, et il ordonna la reconstruction de Tsibatra, sa fortification et sa garnison."
  es: "al-Mu'tasim bi'llah Abu Ishaq Muhammad ibn Harun al-Rashid, octavo califa de los abasíes; en al-Baladhuri: durante su califato, los romanos llegaron a Zibatra, mataron a sus hombres, capturaron a sus mujeres y la devastaron, lo cual lo entristeció y enfureció de tal manera que los saqueó hasta Amorium, habiendo destruido fortalezas en el camino, acampó en ella, la tomó, mató a los combatientes, capturó a las mujeres y los niños, la demolió y ordenó que Zibatra fuera reconstruida, fortificada y guarnecida."
  ur: "المعتصم باللہ ابو اسحاق محمد بن ہارون الرشید، عباسیوں کے آٹھویں خلیفہ؛ البلادوری میں ہے کہ: اس کی خلافت میں رومی زیبطرہ کے لیے نکلے، اس کے مردوں کو قتل کیا، اس کی عورتوں کو پکڑا اور اسے تباہ کر دیا - جس سے اسے غم اور غصہ آیا کہ اس نے اموریم تک ان پر چھاپہ مارا، راستے میں قلعے توڑ کر اس پر پڑاؤ ڈالا، اس پر قبضہ کیا، جنگجوؤں کو مار ڈالا، عورتوں اور بچوں کو گرفتار کیا، زیباترہ کو مسمار کر دیا، اور اس کو دوبارہ مسمار کرنے کا حکم دیا۔ چوکیدار"
  tr: "El-Mu'tasim Billah Ebu İshaq Muhammed bin Harun el-Raşid, sekizinci Abbasi halifesi; el-Baladhuri'ye göre: Halifeliği sırasında Romalılar Zubtra'ya gitti, erkekleri öldürdü, kadınları esir aldı ve yok etti. Bu konuda dikkatli davrandı, onu kızdırdı ve Amorium'a ulaşana kadar saldırdı—daha önce kaleleri yıkmıştı—ve burayı fethedene kadar saldırdı, savaşçıları öldürdü, kadınları ve çocukları esir aldı, sonra da şehri harap etti. Zubatra'nın inşasını, tahkimatını ve saldırısını emretti. al-Suyuti'ye göre, al-Ma'mun, ölümünden kısa süre önce şehirlere gönderilen kitaplarda onu halife olarak atamıştır. Bunun al-Ma'mun'un emriyle gerçekleştiği ve bayıldığında yazdığı söylenir. {cite:History-Khulafa-minhaj-1434, s. 493}. Al-Suyuti'ye göre, Abbasi halifelerinin sekizincisi, Abbasi soyundan sekizinci, al-Rashid'in sekizinci oğlu, sekiz yıl, sekiz ay ve sekiz gün hüküm sürdüğü, kırk sekiz yıl yaşadığı, sekiz fetih fethetti, sekiz düşmanı öldürdüğü, sekiz oğul ve kız bıraktığı ve sekiz yıl sonra öldüğü için al-Muthman olarak anılırdı Rabi'al-Awwal'dan, Arap olmayanların krallarını taklit etti ve onların yolunda yürüdü. Mührü, eşsiz olan Allah'a övgüyle kazındı. Yiyeceği tozlayan ve artıran ilk kişi oydu, ta ki günde bin dinara ulaşana kadar. Bir cevapla tehdit edildiğinde Romalıların Kralı'na şöyle yazdı: 'Gördüğünüz, duyduğunuz değil, kâfir kimin evi miras alacağını anlar.' Al-Suli, Banu Umeyye'den aktardığı bir hadisten bunun uydurulduğunu ve onun belası olan Halabi olduğunu rivayet etti {atıf:Tarikh-khulafa-minhaj-1434, s. 520-527}. al-Mas'udi'ye göre, al-Mu'tasim Nahlah'ta kardeşi el-Ma'mun'un görüşünü takip etmiş ve atçılığa ve yabancı kralların taklitine olan sevgisiyle büyülenmişti. Kapüşon ve şallar taklidi ve bu yüzden onlara al-Mu'tasimiya denildi {atıf:Muruj-al-Dhahab, s. 672}. El-Mes'udi'ye göre, Türkleri toplamayı ve satın almayı severdi, bu yüzden dört bin kişi onun için toplandı, onları brokar ve altın kaplamalarla giydirdi ve giydirdi. Mısır ve Yemen'in dışından bir grup insan yarattı ve Kays onlara Faslılar dedi. Türkler pazarlarda at koşturarak Bağdat'ın halkına zarar verdiğinde, o da Naqala Önce Baradhan'dan, sonra Qatil'den, sonra Samarra'dan inmiştir. Anlattıklarından biri, yaşlı bir adamın eşeğini çamura kaydırdığını gördüğü, bu yüzden aşağı indiği, tek eliyle taşıdığı, çıkardığı, sonra üzerine dikenler taşıdığı, ellerini yıkadığı ve dört bin dirhem emrettiği {atı:Muruj-al-Dhahab s. 442, 444-445}. Perşembe günü Al-Khaqani olarak bilinen sarayında Dicle Nehri'nde, 227 Hicri yılında Rabi'al-Awwal'dan kalan kırk sekiz yaşında öldü. 180 Hicri yılında, Bağdat'ta El-Halid'de doğdu, halifelerin sekizincisi ve Abbasi soyunun sekizincisiydi. Sekiz oğlu ve sekiz kızı varken vefat etti {atıf:Muruj-al-Dhahab, s. 453}"
  id: "Al-Mu'tasim Billah Abu Ishaq Muhammad ibn Harun al-Rashid, khalifah Abbasiyah kedelapan; menurut al-Baladhuri: Romawi selama masa khalifahnya pergi ke Zubtra, membunuh pria, menangkap wanita, dan menghancurkan mereka. Dia berhati-hati dalam hal ini, membuatnya marah, dan menyerang mereka sampai mencapai Amorium—setelah menghancurkan benteng sebelumnya—dan menyerang mereka sampai dia menaklukkannya, membunuh para pejuang, menangkap wanita dan keturunannya, lalu merusaknya. Dia memerintahkan pembangunan, penguatan benteng, dan serangan Zubatra. Menurut al-Suyuti, al-Ma'mun mengangkatnya sebagai khalifah dalam buku-buku yang dikirim ke kota-kota tak lama sebelum kematiannya. Konon hal ini terjadi atas perintah al-Ma'mun, dan dikatakan ia menulisnya saat pingsan. {cite:History-Khulafa-minhaj-1434, hlm. 493}. Menurut al-Suyuti, ia disebut al-Muthman karena ia adalah khalifah Abbasiyah kedelapan, kedelapan keturunan Abbasiyah, putra kedelapan al-Rashid, memerintah selama delapan tahun, delapan bulan, dan delapan hari, hidup empat puluh delapan tahun, menaklukkan delapan penaklukan, membunuh delapan musuh, meninggalkan delapan putra dan putri juga, dan meninggal delapan tahun kemudian Dari Rabi' al-Awwal, ia meniru raja-raja non-Arab dan berjalan di jalan mereka. Segelnya terukir dengan pujian kepada Tuhan, yang tiada banding. Ia adalah yang pertama membersihkan debu dan menambah makanan hingga mencapai seribu dinar per hari. Ia menulis kepada Raja Romawi ketika diancam dengan jawaban: 'Apa yang kau lihat, bukan apa yang kau dengar, dan orang kafir akan tahu siapa yang akan mewarisi rumah itu.' Al-Suli menceritakan dari hadits yang ia laporkan dari Banu Umayyah bahwa rumah itu dibuat-buat dan penderitaannya adalah Ghalabi {cite:Tarikh-khulafa-minhaj-1434, hlm. 520-527}. Menurut al-Mas'udi, al-Mu'tasim mengikuti pendapat saudaranya al-Ma'mun dalam Nahlah, dan ia dikuasai oleh kecintaan pada berkuda serta meniru raja asing dalam alat musiknya. Ia mengenakan tudung dan selendang, yang dipakai orang-orang secara imitatif, sehingga disebut al-Mu'tasimiyat, dan jalan-jalan diamankan untuknya selama masa kejayaannya {cite:muruj-al-dhahab, hlm. 672}. Menurut al-Mas'udi, ia suka mengumpulkan dan membeli orang Turki, sehingga empat ribu orang berkumpul untuknya, mengenakan brokat dan area berlapis emas, serta mengenakan pakaian. Ia membentuk sekelompok orang dari pinggiran Mesir dan Yaman, dan Qays menyebut mereka orang Maroko. Ketika orang Turki menyakiti rakyat biasa Baghdad dengan berlari kuda di pasar, ia bertekad untuk Naqala Ia turun dari Baradhan, lalu Qatil, lalu Samarra. Di antara catatannya adalah ia melihat seorang pria tua menyelipkan keledainya ke lumpur, lalu ia turun, membawanya dengan satu tangan, mengeluarkannya, lalu membawa duri di atasnya, mencuci tangan, dan memerintahkan empat ribu dirham {cite:muruj-al-dhahab hlm. 442, 444-445}. Ia meninggal di Sungai Tigris di istananya yang dikenal sebagai Al-Khaqani pada hari Kamis selama delapan belas malam, meninggalkan Rabi' al-Awwal pada tahun 227 H pada usia empat puluh delapan tahun. Ia lahir di Al-Khalid, Baghdad pada tahun 180 H, sebagai khalifah kedelapan dan kedelapan dari garis keturunan Abbasiyah. Ia meninggal pada usia delapan putra dan delapan putri {cite:muruj-al-dhahab, hlm. 453}"
