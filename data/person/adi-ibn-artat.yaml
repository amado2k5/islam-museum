label: { ar: "عدي بن أرطاة الفزاري", en: "Adi ibn Artat al-Fazari" }
summary:
  ar: "عدي بن أرطاة الفزاري؛ ولاه عمر بن عبد العزيز البصرة فأراد أن يبني فوق دار الإمارة غرفاً فكتب إليه عمر هبلتك أمك يا بن أم عدي أيعجز عنك منزل وسع زياداً وآل زياد فأمسك عن إتمام تلك الغرف. ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه بأن يضع الجزية عمن أسلم من أهل الذمة وأن يعيد الناس إلى أرضهم، فأجابه عمر بأن الإسلام لم يُبعث به جابياً، وأنه يتمنى أن يسلم الناس كلهم. {cite:salabi-umayyad-state-2020 p.203-204} ويذكر الكتاب أنه كان أمير البصرة لعمر، وأن عمر كتب إليه: غررتني بعمامتك السوداء وجلسائك القراء، ونقل الكتاب أن يزيد بن المهلب قُيّد بعد ذلك ونُفّذ إلى عمر، وأن عدي دعا لنفسه بعد وفاة عمر ونُصبت راياته السود فقتله مسلمة بن عبد الملك سنة 102هـ. {cite:salabi-umayyad-state-2020 p.387}"
  en: "Adi ibn Artat al-Fazari; Umar ibn Abd al-Aziz's Basra governor who meant to raise upper rooms on the dar al-imara till the caliph's letter — 'your mother lose you, son of Umm Adi — does the house that held Ziyad and his folk fail you?' — stopped him."
