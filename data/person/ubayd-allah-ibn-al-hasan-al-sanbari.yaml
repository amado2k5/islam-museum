summary:
  ar: "عبيد الله بن الحسن الصنبري، ذكره الشيرازي في فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 49}، ومات سنة ثمان وستين ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 49}. وتذكر حواشي المحقق أن «ابن الحصين» في نسبه تختلف فيه النسخ والطبعة."
  tr: "Ubeyd Allah ibn al-Hasan al-Sanbari, el-Şirazi tarafından Basra hukukçularında anılmıştır {atıf:tabaqat-fuqaha-abbas-1981, s. 49} ve yüz altmış sekizinci yılda vefat etmiştir {atıf:tabaqat-fuqaha-abbas-1981, s. 49}. Editörün kenar notlarında, 'İbn al-Hüseyin'in el yazmaları ve baskılarında soyundan farklı olduğu belirtilmektedir."
  id: "Ubayd Allah ibn al-Hasan al-Sanbari, disebutkan oleh al-Shirazi dalam para ahli hukum Basra {cite:tabaqat-fuqaha-abbas-1981, hlm. 49}, dan meninggal pada tahun seratus enam puluh delapan {cite:tabaqat-fuqaha-abbas-1981, hlm. 49}. Catatan pinggir editor menyebutkan bahwa 'Ibn al-Husayn' berbeda dalam garis keturunannya dalam naskah dan edisi."
