died: { edtf: "1094", hijri: "0487", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في ذي القعدة وقيل في ذي الحجة سنة ثمان وثمانين وأربعمائة وقد جاوز الثمانين سنة {cite:wafayat-ayan}؛ وذكره ابن العماد في أموات سنة 488 {cite:shadharat-dhahab p. 384}." }
summary:
  ar: "بدر الجمالي أمير الجيوش؛ كان أرمني الجنس اشتراه جمال الدولة بن عمار وتربى عبده وتقدم لسيده؛ استنابه المستنصر صاحب مصر بمدينة صور وقيل عكا فلما ضعف حال المستنصر استدعاه فركب البحر في الشتاء ووصل القاهرة عشية الأربعاء لليلتين بقيتا من جمادى الآخرة سنة ست وستين وأربعمائة فولّاه تدبير أموره فقامت بوصوله الدولة؛ كان وزير السيف والقلم وإليه قضاء القضاة والتقدم على الدعاة؛ وهو الذي بنى الجامع بثغر الإسكندرية في سوق العطارين ومشهد الرأس بعسقلان {cite:wafayat-ayan}."
  en: "Badr al-Jamali (d. 487) — Armenian mamluk risen to 'Amir al-Juyush'; al-Mustansir's saviour, arriving Cairo 466 to rule as vizier of sword and pen; builder of Alexandria's Attarin mosque and the Mashhad al-Ra’s at Ascalon {cite:wafayat-ayan}."
  es: "Badr al-Jamali (m. 487) — Mameluco armenio ascendido a 'Amir al-Juyush'; salvador de al-Mustansir, llegó a El Cairo en 466 para gobernar como visir de espada y pluma; constructor de la mezquita Attarin de Alejandría y del Mashhad al-Ra's en Ascalón {cite:wafayat-ayan}."
  fr: "Badr al-Jamali (d. 487) — Mamelouk arménien élevé au rang d'« Amir al-Juyush »; sauveur d'al-Mustansir, arrivant au Caire en 466 pour régner en tant que vizir de l'épée et de la plume; constructeur de la mosquée Attarin d'Alexandrie et du Mashhad al-Ra's à Ascalon {cite:wafayat-ayan}."
  ur: "بدر الجمالی ⁦(متوفی 487)⁩ - آرمینیائی مملوک کا 'امیر الجیوش' میں اضافہ ہوا؛ المستنصر کا نجات دہندہ، تلوار اور قلم کے وزیر کے طور پر حکومت کرنے کے لیے قاہرہ 466 پہنچنا؛ اسکندریہ کی عطرین مسجد اور مشہد الرا کی اسکالون میں تعمیر کرنے والا۔"
  tr: "Ordu komutanı Badr al-Jamali Ermeni kökenliydi. Cemal el-Devle bin Ammar tarafından satın alındı, kölesi olarak yetiştirildi ve efendisine sunuldu. Mısır hükümdarı el-Mustansir, onu Sur şehrine, ya da bazılarına göre Akka olarak atadı. El-Mustansir'in durumu zayıflayınca onu çağırdı ve kışın denize açıldı. Çarşamba akşamı Kahire'ye vardı, dört yüz altmış altıncı yılda Cumada'l-Akhirah'da iki gece kaldı. İşlerini yönetmekle görevlendirildi ve devlet gelişini devraldı. Kılıç ve kalem bakanıydı, ona göre ise hakimlerin ve önceki misyonerlerin yargıcıydı. İskenderiye limanlarında, Attarin pazarında ve Ascalon'daki baş türbesinde camiyi inşa eden oydu {kaynak: wafayat-ayan}."
  id: "Badr al-Jamali, komandan pasukan, berasal dari keturunan Armenia. Ia dibeli oleh Jamal al-Dawla ibn Ammar, dibesarkan sebagai budaknya, dan diperkenalkan kepada tuannya. Al-Mustansir, penguasa Mesir, mengangkatnya di kota Tyre, atau ada yang mengatakan Acre. Ketika kondisi al-Mustansir melemah, ia memanggilnya, dan berlayar ke laut di musim dingin. Ia tiba di Kairo pada Rabu malam, dua malam tersisa di Jumada al-Akhirah pada tahun empat ratus enam puluh enam. Ia dipercayakan untuk mengelola urusannya, dan negara mengambil alih kedatangannya. Ia adalah menteri pedang dan pena, dan baginya adalah hakim para hakim dan misionaris sebelumnya. Ia adalah orang yang membangun masjid di pelabuhan Alexandria, di pasar Attarin dan tempat suci kepala di Ascalon {cite:wafayat-ayan}."
