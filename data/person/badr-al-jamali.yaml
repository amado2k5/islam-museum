summary:
  ar: "بدر الجمالي أمير الجيوش؛ كان أرمني الجنس اشتراه جمال الدولة بن عمار وتربى عبده وتقدم لسيده؛ استنابه المستنصر صاحب مصر بمدينة صور وقيل عكا فلما ضعف حال المستنصر استدعاه فركب البحر في الشتاء ووصل القاهرة عشية الأربعاء لليلتين بقيتا من جمادى الآخرة سنة ست وستين وأربعمائة فولّاه تدبير أموره فقامت بوصوله الدولة؛ كان وزير السيف والقلم وإليه قضاء القضاة والتقدم على الدعاة؛ وهو الذي بنى الجامع بثغر الإسكندرية في سوق العطارين ومشهد الرأس بعسقلان {cite:wafayat-ayan}."
  en: "Badr al-Jamali (d. 487) — Armenian mamluk risen to 'Amir al-Juyush'; al-Mustansir's saviour, arriving Cairo 466 to rule as vizier of sword and pen; builder of Alexandria's Attarin mosque and the Mashhad al-Ra’s at Ascalon {cite:wafayat-ayan}."
