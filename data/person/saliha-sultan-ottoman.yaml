summary:
  ar: "بطاقة أولية لصالحة سبكتي سلطان، الوالدة سلطان زوجة مصطفى الثاني وأم محمود الأول، توفيت سنة ١٧٣٩م؛ تذكرها كتب التاريخ العثماني ولم تُراجع ترجمتها على الصفحة بعد."
  en: "Draft card for Saliha Sultan, consort of Mustafa II and mother of Mahmud I who served as valide sultan, d. 1739; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Saliha Sultan, consorte de Mustafa II y madre de Mahmud I, quien se desempeñó como valide sultan, fallecida en 1739; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Saliha Sultan, épouse de Mustafa II et mère de Mahmud Ier, qui a servi comme valide sultane, décédée en 1739; la source n'est pas encore vérifiée sur la page."
  ur: "صالحہ سلطان کے لیے ڈرافٹ کارڈ، مصطفی دوم کی ہمشیرہ اور محمود اول کی والدہ جنہوں نے صحیح سلطان کے طور پر خدمات انجام دیں۔ 1739; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Anne Sultan, Mustafa II'nin eşi ve 1739 yılında ölen Mahmud I'in annesi Saleha Sebketi Sultan lehine ön kart; Osmanlı tarih kitaplarında adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Saleha Sebketi Sultan, ibu Sultan, istri Mustafa II dan ibu Mahmud I, yang meninggal pada tahun 1739 M; ia disebutkan dalam buku sejarah Ottoman dan terjemahannya belum pernah diulas di halaman tersebut."
