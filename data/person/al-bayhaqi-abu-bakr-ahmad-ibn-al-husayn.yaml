summary:
  ar: "الحافظ المحدث الأصولي أبو بكر أحمد بن الحسين البيهقي، من خسروجرد ببيهق؛ رحل في طلب الحديث حتى قيل إنه حدّث عن نحو مائة شيخ، وأخذ عن الحاكم النيسابوري، وشهد فتنة الكندري على الأشاعرة سنة ٤٤٥هـ فكتب رسالته المشهورة إلى عميد الملك، وهاجر مع أهل العلم إلى الحجاز، ثم عاد فتوفي بنيسابور سنة ٤٥٨هـ ودُفن بخسروجرد."
  en: "The hadith memorist, legal theorist and jurist Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi of Khusrawjird in the Bayhaq district; he travelled widely for hadith and is credited with about a hundred shaykhs, studied under al-Hakim al-Nisaburi, witnessed the Kunduri persecution of the Ash'aris in 445/1053 and wrote his famous letter to the vizier Amid al-Mulk, joined the scholars' exodus to the Hijaz, then returned and died at Nishapur in 458/1066, buried at Khusrawjird."
  ur: "حافظِ حدیث، اصولی اور فقیہ ابو بکر احمد بن حسین بيهقی، جو بيهق کے علاقے خسروجرد سے تھے؛ انہوں نے طلبِ حدیث میں وسیع سفر کیے اور تقریباً سو شیوخ سے روایت کی، حاکم نیشاپوری سے پڑھا، 445ھ/1053ء میں کندری کے اصحابِ اشعری پر مظالم دیکھے اور وزیر عمید الملک کے نام اپنی مشہور رسالہ لکھی، علماء کے ہجرتِ حجاز میں شریک ہوئے، پھر واپس آئے اور 458ھ/1066ء میں نیشاپور میں فوت ہوئے اور خسروجرد میں دفن کیے گئے۔"
