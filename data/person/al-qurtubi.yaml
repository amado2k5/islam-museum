summary:
  ar: "أبو عبد الله محمد بن أحمد بن أبي بكر بن فرج الأنصاري الخزرجي القرطبي (ت ٦٧١هـ)، المفسر المالكي صاحب «الجامع لأحكام القرآن»؛ هاجر من الأندلس إلى مصر فسمع المفهم على مؤلفه بالإسكندرية واستقر بمنية بني خصيب في الصعيد حيث صنف ومات {cite:nafh-tib-maqqari 2/210-211} {cite:siyar-alam-nubala 17/97}."
  en: "Abu Abdallah Muhammad ibn Ahmad ibn Abi Bakr ibn Faraj al-Ansari al-Khazraji al-Qurtubi (d. 671/1273), the Maliki exegete author of al-Jami' li-Ahkam al-Qur'an; he emigrated from al-Andalus to Egypt, heard al-Mufhim from its author at Alexandria, and settled at Munyat Bani Khusayb in Upper Egypt where he wrote and died {cite:nafh-tib-maqqari 2/210-211} {cite:siyar-alam-nubala 17/97}."
