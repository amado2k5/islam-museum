summary:
  ar: "بديع الدين شاه الرشيدي السندي ⁦(1926–1996)⁩ محدّث باكستاني من أهل الحديث، من كبار أسانيد الحديث في القرن العشرين، درّس الكتب الستة في الحرم المكي عقوداً. من آثاره «الإجابة البديعة» و«غاية المرام» و«الفتاوى البديعية»."
  en: "Badi' al-Din Shah al-Rashidi al-Sindi (1926–1996) was a Pakistani Ahl-i Hadith hadith scholar, among the highest hadith transmitters of the twentieth century, who taught the Six Books in the Meccan Sanctuary for decades. His works include Al-Ijaba al-Badi'a, Ghayat al-Maram and Al-Fatawa al-Badi'iyya."
  ur: "بدیع الدین شاہ رشیدی سندی ⁦(1926–1996)⁩ پاکستانی اہلِ حدیث محدث تھے، بیسویں صدی کے عالی ترین محدثین میں، جنہوں نے دہائیاں مسجد حرام میں کتبِ ستہ پڑھائے۔ آثار میں «الإجابة البديعة»، «غاية المرام» اور «الفتاوى البديعية» شامل ہیں۔"
