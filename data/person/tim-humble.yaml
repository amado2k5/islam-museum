label:
  ar: "محمد تيم همبل"
  en: "Muhammad Tim Humble"
  ur: "محمد ٹم ہمبل"
summary:
  ar: "مدرّس بريطاني للحديث مقيم في نيوكاسل، وداعية وممارس للرقية الشرعية. اعتنق الإسلام في الرابعة عشرة من عمره بعد أن اهتم به في دروس التربية الدينية بالمدرسة الابتدائية، وتقدّم إلى الجامعة الإسلامية بالمدينة المنورة أثناء حجته الأولى، وتخرّج في كلية الحديث الشريف وعلومه سنة 2011 حاملاً إجازة في الكتب الستة. يعمل مع منظمة IDC North East الدعوية في نيوكاسل وحولها، وأسّس مؤسسة همبل، ويُدرّس عبر محاضراته ودوراته المسجلة التي يحمل بودكاست مسلم سنترال منها مئات الحلقات."
  en: "A Newcastle-based British teacher of hadith, dawah speaker and practitioner of ruqyah. He accepted Islam at the age of fourteen after becoming interested in it in primary-school religious education classes, applied to the Islamic University of Madinah during his first Hajj, and graduated from its Faculty of Hadith Studies in 2011, holding ijaza in the six canonical books of hadith. He works with the dawah organisation IDC North East in and around Newcastle, founded the Humble Foundation, and teaches through recorded lectures and courses, several hundred episodes of which are carried by the Muslim Central podcast."
  ur: "نیو کیسل میں مقیم برطانوی مدرسِ حدیث، داعی اور رقیہ شرعیہ کے ماہر۔ پرائمری اسکول کی مذہبی تعلیم کی کلاسوں میں دلچسپی کے بعد چودہ سال کی عمر میں اسلام قبول کیا، پہلے حج کے دوران جامعہ اسلامیہ مدینہ منورہ میں داخلے کی درخواست دی اور 2011 میں کلیۃ الحدیث سے فارغ التحصیل ہوئے؛ کتبِ ستہ میں اجازہ رکھتے ہیں۔ نیو کیسل اور اس کے اطراف میں دعوتی تنظیم IDC North East سے وابستہ ہیں، ہمبل فاؤنڈیشن کے بانی ہیں، اور ریکارڈ شدہ محاضرات و دوروں کے ذریعے تدریس کرتے ہیں جن کی سیکڑوں اقساط مسلم سینٹرل پوڈکاسٹ میں موجود ہیں۔"
