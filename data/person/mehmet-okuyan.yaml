summary:
  ar: "عالم تركي في تفسير القرآن وأستاذ جامعي وكاتب، وُلد سنة 1965 في تشايكارا بولاية طرابزون، وقضى دراسته ومسيرته الأكاديمية كلها في كلية الإلهيات بجامعة أوندوكوز مايس حتى صار أستاذًا في قسم التفسير سنة 2008، ويُعرف ببرامجه التلفزيونية الدينية وبمؤلفاته الكثيرة في التفسير. بلغت قناته على يوتيوب 485,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish Qur'an-commentary (tafsir) scholar, professor and writer, born in 1965 in Çaykara, Trabzon. His whole education and academic career ran at Ondokuz Mayıs University's theology faculty, where he became professor in the tafsir department in 2008; he is known for his religious television programmes and his many books on tafsir. His YouTube channel counted 485,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک مفسرِ قرآن، استاد اور مصنف، جو 1965ء میں طرابزون کے علاقے چائیکارا میں پیدا ہوئے، ان کی تمام تعلیم اور تدریسی زندگی اوندوکوز مایس یونیورسٹی کے شعبۂ الہیات میں گزری جہاں وہ 2008ء میں شعبۂ تفسیر کے پروفیسر بنے، اور وہ اپنے دینی ٹیلی ویژن پروگراموں اور تفسیر پر اپنی کثیر کتابوں کے لیے جانے جاتے ہیں۔ vidIQ کے مطابق 15 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 485,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
