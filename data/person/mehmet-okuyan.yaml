summary:
  ar: "عالم تركي في تفسير القرآن وأستاذ جامعي وكاتب، وُلد سنة 1965 في تشايكارا بولاية طرابزون، وقضى دراسته ومسيرته الأكاديمية كلها في كلية الإلهيات بجامعة أوندوكوز مايس حتى صار أستاذًا في قسم التفسير سنة 2008، ويُعرف ببرامجه التلفزيونية الدينية وبمؤلفاته الكثيرة في التفسير. بلغت قناته على يوتيوب 485,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish Qur'an-commentary (tafsir) scholar, professor and writer, born in 1965 in Çaykara, Trabzon. His whole education and academic career ran at Ondokuz Mayıs University's theology faculty, where he became professor in the tafsir department in 2008; he is known for his religious television programmes and his many books on tafsir. His YouTube channel counted 485,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک مفسرِ قرآن، استاد اور مصنف، جو 1965ء میں طرابزون کے علاقے چائیکارا میں پیدا ہوئے، ان کی تمام تعلیم اور تدریسی زندگی اوندوکوز مایس یونیورسٹی کے شعبۂ الہیات میں گزری جہاں وہ 2008ء میں شعبۂ تفسیر کے پروفیسر بنے، اور وہ اپنے دینی ٹیلی ویژن پروگراموں اور تفسیر پر اپنی کثیر کتابوں کے لیے جانے جاتے ہیں۔ vidIQ کے مطابق 15 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 485,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Erudito turco en comentarios del Corán (tafsir), profesor y escritor, nacido en 1965 en Çaykara, Trabzon. Toda su formación y carrera académica se desarrolló en la facultad de teología de la Universidad Ondokuz Mayıs, donde se convirtió en profesor del departamento de tafsir en 2008. Es conocido por sus programas religiosos de televisión y sus numerosos libros sobre tafsir. Su canal de YouTube contaba con 485 000 suscriptores al 15 de noviembre de 2026, según vidIQ (dato antiguo de la plataforma, no verificado por ningún museo)."
  fr: "Exégète du Coran (tafsir), professeur et écrivain turc, né en 1965 à Çaykara, dans la préfecture de Trabzon. Il a effectué l'intégralité de ses études et de sa carrière universitaire à la faculté de théologie de l'université Ondokuz Mayıs, où il est devenu professeur au département de tafsir en 2008. Il est connu pour ses émissions religieuses à la télévision et ses nombreux ouvrages sur le tafsir. Sa chaîne YouTube comptait 485 000 abonnés au 15 novembre 2026 selon vidIQ – un chiffre ancien, non vérifié par un musée."
  tr: "Kuran tefsirleri alanında Türk bir alim, üniversite profesörü ve yazar olan Trabzon vilayetinin Çaykara kentinde 1965 doğumlu olan Trabzon Eyaleti, akademik çalışmalarını ve kariyerini tüm akademik çalışmalarını ve kariyerini Ondükuz Mayes Üniversitesi İlahiyat Fakültesi'nde geçirdi, 2008'de Tafsir Bölümü'nde profesör oldu. Dini televizyon programları ve Tafsir üzerine çok sayıda çalışmasıyla tanınır. YouTube kanalı, vidIQ'ye göre 15 Kasım 2026 itibarıyla 485.000 aboneye ulaşmıştır; bu bilgi tarihçi sayısıdır, gerçek kontrolü yapılmış bir müze platformu değildir."
  id: "Seorang cendekiawan Turki dalam tafsir Al-Qur'an, profesor universitas, dan penulis, lahir pada tahun 1965 di Çaykara, provinsi Trabzon, ia menghabiskan seluruh studi akademik dan kariernya di Fakultas Teologi Universitas Ondükuz Mayes hingga menjadi profesor di Departemen Tafsir pada tahun 2008. Ia dikenal melalui program televisi keagamaannya dan banyak karya tentang Tafsir. Saluran YouTube-nya mencapai 485.000 pelanggan per 15 November 2026, menurut vidIQ, yang merupakan angka seorang sejarawan, bukan platform museum yang diperiksa fakta."
