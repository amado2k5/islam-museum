summary:
  ar: "الفقيه الإمام اليمني؛ تفقه على أبي إسحاق المرهي وزوجه ابنته ثم ارتحل إلى مكة فقرأ على الحسين بن علي الشاشي تلميذ الشيخ أبي إسحاق الشيرازي، واجتمع عليه أهل اليمن فقرأ عليه الإمام يحيى صاحب البيان وعبد الله الهمذاني وغيرهما، وكان صغير الجسم عظيم المهابة؛ توفي بالجند سنة أربع عشرة وخمسمائة {cite:shadharat-dhahab p. 523-524}."
  en: "The Yemeni faqih Zayd al-Yafa'i — pupil and son-in-law of Abu Ishaq al-Murhi, who then studied in Mecca under al-Shirazi's pupil and taught all Yemen, among his students Imam Yahya author of the Bayan; small of body, great of awe; d. at al-Jund in 514 {cite:shadharat-dhahab p. 523-524}."
