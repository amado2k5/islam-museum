id: person/zayd-al-yafai
class: person
label: { ar: "زيد اليفاعي" }
names:
  - { value: "زيد بن عبد الله بن جعفر اليفاعي اليمني", kind: full }
summary:
  ar: "الفقيه الإمام اليمني؛ تفقه على أبي إسحاق المرهي وزوجه ابنته ثم ارتحل إلى مكة فقرأ على الحسين بن علي الشاشي تلميذ الشيخ أبي إسحاق الشيرازي، واجتمع عليه أهل اليمن فقرأ عليه الإمام يحيى صاحب البيان وعبد الله الهمذاني وغيرهما، وكان صغير الجسم عظيم المهابة؛ توفي بالجند سنة أربع عشرة وخمسمائة {cite:shadharat-dhahab p. 523-524}."
  en: "The Yemeni faqih Zayd al-Yafa'i — pupil and son-in-law of Abu Ishaq al-Murhi, who then studied in Mecca under al-Shirazi's pupil and taught all Yemen, among his students Imam Yahya author of the Bayan; small of body, great of awe; d. at al-Jund in 514 {cite:shadharat-dhahab p. 523-524}."
  es: "El faqih yemení Zayd al-Yafa'i — discípulo y yerno de Abu Ishaq al-Murhi, quien luego estudió en La Meca con el discípulo de al-Shirazi y enseñó a todo Yemen, entre sus alumnos el Imam Yahya autor del Bayan; pequeño de cuerpo, grande en temor; murió en al-Jund en 514 {cita:shadharat-dhahab pág. 523-524}."
  fr: "Le faqih yéménite Zayd al-Yafa'i — élève et gendre d'Abu Ishaq al-Murhi, qui étudia ensuite à La Mecque sous l'égide d'un élève d'al-Shirazi et enseigna dans tout le Yémen, parmi ses élèves l'imam Yahya, auteur du Bayan; petit de corps, grand de crainte; mort à al-Jund en 514 {cite: shadharat-dhahab p. 523-524}."
  ur: "یمنی فقیہ زید ال یافعی - ابو اسحاق المرحی کے شاگرد اور داماد، جس نے پھر مکہ میں الشرازی کے شاگرد کے ماتحت تعلیم حاصل کی اور اپنے شاگردوں میں سے تمام یمن کو پڑھایا، امام یحیی نے بیان کے مصنف؛ جسم کا چھوٹا، خوف کا بڑا d الجند ص 514 میں 523-524}۔"
  tr: "Yemenli fahhih ve imam; Ebu İshaq el-Marhi'nin yanında hukuk eğitimi aldı ve onun kızıyla evlendi, ardından Mekke'ye giderek Şeyh Ebu İshaq el-Şirazi'nin öğrencisi el-Hüseyin bin Ali el-Şaşi'nin yanında eğitim aldı. Yemen halkı onun altında toplandı ve İmam Yahya, el-Bayan'ın yazarı, Abdullah el-Hamadhani ve diğerleri onun yanında eğitim aldı. Kısa boylu ve heybetliydi ve beş yüz yaşında el-Cund'da öldü {atıf:şadharat-dhahab, s. 523-524}."
  id: "Ahli hukum dan imam Yaman; ia belajar hukum di bawah bimbingan Abu Ishaq al-Marhi dan menikahi putrinya, kemudian pergi ke Mekah dan belajar di bawah bimbingan al-Husayn ibn Ali al-Shashi, murid Sheikh Abu Ishaq al-Shirazi. Rakyat Yaman berkumpul di bawah arahnya, dan Imam Yahya, penulis al-Bayan, Abdullah al-Hamadhani, serta lainnya belajar di bawah bimbingannya. Ia bertubuh kecil dan gagah serta meninggal pada al-Jund pada tahun lima ratus {cite:shadharat-dhahab, hlm. 523-524}."
