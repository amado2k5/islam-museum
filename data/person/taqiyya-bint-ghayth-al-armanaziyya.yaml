gender: female
roles: [poet, scholar]
summary:
  ar: "شاعرة ومحدثة من صور ⁦(505–579هـ)⁩، صحبت الحافظ أبا طاهر السلفي بالإسكندرية فأثنى عليها، ولها ديوان صغير؛ يروي ابن خلكان عن المنذري خبر قصيدتيها في الملك المظفر تقي الدين عمر، كما ينقله كحالة في «أعلام النساء»."
  en: "A poet and hadith transmitter from Tyre (505–579 AH) who kept company with the hafiz Abu Tahir al-Silafi at Alexandria, who praised her; she left a small diwan. Ibn Khallikan, from al-Mundhiri, tells of her two poems for al-Malik al-Muzaffar Taqi al-Din Umar, as Kahhala relates in A'lam al-Nisa'."
  ur: "صور کی ایک شاعرہ اور محدثہ ⁦(505–579ھ)⁩ جنہوں نے اسکندریہ میں حافظ ابو طاہر السلفی کی صحبت پائی اور انہوں نے ان کی تعریف کی؛ ان کا ایک چھوٹا دیوان تھا۔ ابن خلکان، منذری سے، الملک المظفر تقی الدین عمر کے لیے ان کے دو قصیدوں کا واقعہ بیان کرتے ہیں، جیسا کہ کحالہ «اعلام النساء» میں نقل کرتے ہیں۔"
  es: "Poeta y transmisora de hadices de Tiro (505-579 AH), que frecuentaba al hafiz Abu Tahir al-Silafi en Alejandría, quien la elogió, dejó un pequeño diván. Ibn Khallikan, de al-Mundhiri, menciona sus dos poemas para al-Malik al-Muzaffar Taqi al-Din Umar, como relata Kahhala en A'lam al-Nisa'."
  fr: "Poétesse et transmettrice de hadiths originaire de Tyr (505-579 AH), elle fréquenta le hafiz Abu Tahir al-Silafi à Alexandrie, qui la loua; elle laissa un petit diwan. Ibn Khallikan, d'après al-Mundhiri, mentionne deux poèmes qu'elle composa pour al-Malik al-Muzaffar Taqi al-Din Umar, comme le rapporte Kahhala dans A'lam al-Nisa'."
  tr: "Sur'lu (505–579 H) şair ve hadis âlimi olan Khallikan, İskenderiye'de hadis alimi Ebu Tahir el-Selefi'ye eşlik etmiş ve kendisini övmüştür. Küçük bir koleksiyonu vardır; İbn Hallikan, el-Mundhiri'den 'A'lam al-Nisa'da al-Malik al-Muzaffar Taqi al-Din Umar üzerine yazdığı iki şiirin anlatımını aktarır."
  id: "Seorang penyair dan ulama hadis dari Tyre (505–579 H), ia menemani ulama hadis Abu Tahir al-Salafi di Alexandria, yang memujinya. Ia memiliki koleksi kecil; Ibn Khallikan menceritakan dari al-Mundhiri kisah dua puisinya tentang al-Malik al-Muzaffar Taqi al-Din Umar, seperti yang ia kutip sebagai kasus dalam 'A'lam al-Nisa'."
