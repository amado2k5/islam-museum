gender: female
roles: [poet, scholar]
summary:
  ar: "شاعرة ومحدثة من صور ⁦(505–579هـ)⁩، صحبت الحافظ أبا طاهر السلفي بالإسكندرية فأثنى عليها، ولها ديوان صغير؛ يروي ابن خلكان عن المنذري خبر قصيدتيها في الملك المظفر تقي الدين عمر، كما ينقله كحالة في «أعلام النساء»."
  en: "A poet and hadith transmitter from Tyre (505–579 AH) who kept company with the hafiz Abu Tahir al-Silafi at Alexandria, who praised her; she left a small diwan. Ibn Khallikan, from al-Mundhiri, tells of her two poems for al-Malik al-Muzaffar Taqi al-Din Umar, as Kahhala relates in A'lam al-Nisa'."
  ur: "صور کی ایک شاعرہ اور محدثہ ⁦(505–579ھ)⁩ جنہوں نے اسکندریہ میں حافظ ابو طاہر السلفی کی صحبت پائی اور انہوں نے ان کی تعریف کی؛ ان کا ایک چھوٹا دیوان تھا۔ ابن خلکان، منذری سے، الملک المظفر تقی الدین عمر کے لیے ان کے دو قصیدوں کا واقعہ بیان کرتے ہیں، جیسا کہ کحالہ «اعلام النساء» میں نقل کرتے ہیں۔"
