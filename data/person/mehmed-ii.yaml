summary:
  ar: "سلطان عثماني حكم في 848-850هـ/1444-1446م ثم في 855-886هـ/1451-1481م، ويلقب بالفاتح وأبي الفتح، وتعدّه دائرة المعارف الإسلامية المؤسس الأخير للدولة العثمانية. وُلد في أدرنة سنة 835هـ/1432م وفتح القسطنطينية في 857هـ/1453م وجعلها عاصمته، وخاض حملات في البلقان والبحر الأسود وضد البندقية والمجر، وأخضع الكرمانيين. ونظّم دولة مركزية وجمع قوانين الدولة وأعاد تنظيم التعليم الديني ومراتب العلماء، وتوفي في 4 ربيع الأول 886هـ/3 مايو 1481م {cite:encyclopaedia-of-islam-2 vol. 6 p. 1005} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1006} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1007}. وعند ابن العماد حاصر القسطنطينية خمسين يوماً وصلى الجمعة في آيا صوفيا وبنى مدارس بثمانية أبواب في إسطنبول {cite:shadharat-dhahab p. 344-345}."
  en: "Ottoman sultan who reigned in 848-850/1444-1446 and 855-886/1451-1481, called al-Fatih and Abu l-Fath, whom the Encyclopaedia of Islam calls the ultimate founder of the Ottoman Empire. Born in Edirne in 835/1432, he took Constantinople in 857/1453 and made it his capital, campaigned in the Balkans, the Black Sea and against Venice and Hungary, and annexed Karamanid lands. He built a centralised state, codified its laws and organised religious teaching and the ranks of the scholars, and died on 4 Rabi' I 886/3 May 1481 {cite:encyclopaedia-of-islam-2 vol. 6 p. 1005} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1006} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1007}. In Ibn al-Imad he besieged Constantinople fifty days, prayed Friday in Hagia Sophia and founded eight-door madrasas in Istanbul {cite:shadharat-dhahab p. 344-345}."
  ur: "عثمانی سلطان جو 848-850ھ/1444-1446ء اور پھر 855-886ھ/1451-1481ء میں حکمران رہے، فاتح اور ابو الفتح کے لقب سے معروف، جنہیں دائرۃ المعارف اسلامیہ سلطنتِ عثمانیہ کا حقیقی بانی کہتا ہے۔ وہ ادرنہ میں 835ھ/1432ء میں پیدا ہوئے، 857ھ/1453ء میں قسطنطنیہ فتح کر کے اسے دارالحکومت بنایا، بلقان، بحیرۂ اسود اور وینس و ہنگری کے خلاف مہمات کیں اور قرامانی علاقے ضم کیے۔ انہوں نے مرکزی ریاست قائم کی، قوانین مدون کیے، دینی تدریس اور علما کے مراتب منظم کیے، اور 4 ربیع الاول 886ھ/3 مئی 1481ء کو وفات پائی {cite:encyclopaedia-of-islam-2 vol. 6 p. 1005} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1006} {cite:encyclopaedia-of-islam-2 vol. 6 p. 1007}۔ ابن العماد کے مطابق انہوں نے قسطنطنیہ کا پچاس دن محاصرہ کیا، آیا صوفیہ میں جمعہ پڑھا اور استنبول میں آٹھ دروازوں والے مدارس بنائے {cite:shadharat-dhahab p. 344-345}۔"
