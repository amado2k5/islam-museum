summary:
  ar: "سابع ملوك بني عثمان السلطان محمد بن السلطان مراد خان ولد سنة خمس وثلاثين وثمان مئة وولي السلطنة سنة ست وخمسين وكانت مدة ولايته إحدى وثلاثين سنة وكان من أعاظم سلاطين بني عثمان أعظمهم جهاداً وأقواهم إقداماً واجتهاداً وأثبتهم جأشاً وقوادة وأكثرهم توكلاً على الله واعتماداً وهو الذي أسس ملك بني عثمان وسن لهم قوانين صارت كالأطواق في أعناق الزمان وغزواته كسرت بها أصلاب الصلبان والأصنام من أعظمها أنه فتح القسطنطينية الكبرى وساق بها السفن تجري براً وبحراً وحاصرها خمسين يوماً أشد الحصار حتى فتحها يوم الأربعاء العشرون من جمادى الآخرة سنة سبع وخمسين وثمان مئة وصلى في أياصوفيا أكبر كنائس النصارى صلاة الجمعة وأسس في أصطنبول للعلم أساساً راسخاً وبنى بها مدارس كالجفان لها ثمانية أبواب وسن بها قوانين تطابق المعقول والمنقول وجعل للطلاب أيام الطلب ما يسد فاقتهم ومراتب يترقون إليها واستجلب العلماء الكبار من أقصى الديار وأنعم عليهم كمولانا علي القوشجي والفاضل الطوسي والعالم الكوراني فصارت أصطنبول بهم أم الدنيا واستقر بعده في المملكة ابنه الأكبر أبو يزيد يلدرم ومعناه البرق {cite:shadharat-dhahab p. 344-345}. وعند الصلابي: ولي السلطنة بعد وفاة أبيه في 16 محرم 855هـ الموافق 18 فبراير 1451م وله اثنان وعشرون عاماً، فأعاد تنظيم إدارات الدولة وماليتها وكتائب الجيش وسجلات الجند ومرتباتهم، ثم تطلع إلى القسطنطينية فأعد لها ربع مليون مقاتل وأكثر من أربعمئة سفينة، وبنى قلعة روملي حصار في أضيق نقطة من البوسفور، وجلب المهندس المجري أوربان لصناعة المدافع العظيمة {cite:dawlat-uthmaniyya-salabi p. 87-92}."
  en: "Mehmed the Conqueror, seventh of the Ottoman kings — sultan for thirty-one years from 856, 'the greatest of their sultans in jihad', who laid the Ottoman state's foundations and its statutes. His fame rests on the conquest of Constantinople: he drove ships over land, besieged it fifty days and took it on Wednesday 20 Jumada II 857, prayed Friday in Hagia Sophia, built the Eight Madrasas with endowed stipend-ranks for students, and drew the age's great scholars — Ali al-Qushji, al-Tusi, al-Kurani — till Istanbul became mother of the world {cite:shadharat-dhahab p. 344-345}."
