summary:
  ar: من بني ليث بن عبد مناة، أسلم قبل تبوك وشهدها، وكان من أهل الصفة كما يذكر ابن سعد ثم نزل الشام؛ شهد فتح دمشق وحمص كما يذكر أبو حاتم، ومات في خلافة عبد الملك سنة 83هـ أو 85هـ، وهو آخر من مات بدمشق من الصحابة في قول الواقدي. روى عن النبي حديث الاصطفاء المشهور «إن الله اصطفى كنانة من ولد إسماعيل واصطفى قريشاً من كنانة واصطفى من قريش بني هاشم واصطفاني من بني هاشم» {cite:sahih-muslim 2276}.
  en: From Banu Layth ibn Abd Manat, he embraced Islam before Tabuk and took part in it; Ibn Sa'd lists him among the people of the Suffa, after which he settled in Syria; Abu Hatim says he was at the conquests of Damascus and Homs; he died in
    the caliphate of Abd al-Malik in 83 or 85 AH, and in al-Waqidi's account was the last Companion to die at Damascus.
