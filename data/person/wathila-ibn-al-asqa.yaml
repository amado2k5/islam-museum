summary:
  ar: من بني ليث بن عبد مناة، أسلم قبل تبوك وشهدها، وكان من أهل الصفة كما يذكر ابن سعد ثم نزل الشام؛ شهد فتح دمشق وحمص كما يذكر أبو حاتم، ومات في خلافة عبد الملك سنة 83هـ أو 85هـ، وهو آخر من مات بدمشق من الصحابة في قول الواقدي. روى عن النبي حديث الاصطفاء المشهور «إن الله اصطفى كنانة من ولد إسماعيل واصطفى قريشاً من كنانة واصطفى من قريش بني هاشم واصطفاني من بني هاشم» {cite:sahih-muslim 2276}.
  en: From Banu Layth ibn Abd Manat, he embraced Islam before Tabuk and took part in it; Ibn Sa'd lists him among the people of the Suffa, after which he settled in Syria; Abu Hatim says he was at the conquests of Damascus and Homs; he died in
    the caliphate of Abd al-Malik in 83 or 85 AH, and in al-Waqidi's account was the last Companion to die at Damascus.
  ur: "بنو لیث بن عبد منات سے، تبوک سے پہلے مسلمان ہوا اور اس میں شریک رہا؛ ابن سعد اسے بعد میں اہل صفہ میں گنتا ہے۔"
  es: "Procedente de Banu Layth ibn Abd Manat, abrazó el Islam antes de Tabuk y participó en él; Ibn Sa'd lo incluye entre la gente de Suffa, tras lo cual se estableció en Siria; Abu Hatim dice que estuvo presente en las conquistas de Damasco y Homs; murió en el califato de Abd al-Malik en el año 83 o 85 de la Hégira, y según al-Waqidi fue el último Compañero en morir en Damasco."
  fr: "Issu de la tribu des Banu Layth ibn Abd Manat, il embrassa l'islam avant Tabuk et y participa; Ibn Sa'd le mentionne parmi les habitants de la Suffa, après quoi il s'installa en Syrie; Abu Hatim affirme qu'il participa aux conquêtes de Damas et de Homs; il mourut sous le califat d'Abd al-Malik en 83 ou 85 AH, et selon al-Waqidi, il fut le dernier Compagnon à mourir à Damas."
