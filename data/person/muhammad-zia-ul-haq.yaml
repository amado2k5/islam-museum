summary:
  ar: "جنرال باكستاني (1924–1988) أطاح برئيس الوزراء ذو الفقار علي بوتو في انقلاب 5 يوليو 1977، وحكم بوصفه المدير الرئيسي للأحكام العرفية ثم سادس رؤساء باكستان (1978–1988)، وقاد برنامج أسلمة للدولة ونسق دعم المجاهدين الأفغان في الحرب السوفيتية الأفغانية. قُتل في تحطم طائرة قرب بهاولبور في 17 أغسطس 1988."
  en: "Pakistani general (1924–1988) who deposed Prime Minister Zulfikar Ali Bhutto in the coup of 5 July 1977, ruled as chief martial law administrator and then as the sixth president of Pakistan (1978–1988), and drove a state Islamisation programme while coordinating support for the Afghan mujahideen in the Soviet–Afghan War. He died in a plane crash near Bahawalpur on 17 August 1988."
  ur: "پاکستانی جرنیل (1924ء–1988ء) جنھوں نے 5 جولائی 1977ء کی بغاوت میں وزیرِ اعظم ذوالفقار علی بھٹو کو معزول کیا، چیف مارشل لا ایڈمنسٹریٹر اور پھر پاکستان کے چھٹے صدر (1978ء–1988ء) کے طور پر حکومت کی، ریاست کی اسلام کاری کا پروگرام چلایا اور سوویت افغان جنگ میں افغان مجاہدین کی حمایت کی سرپرستی کی۔ 17 اگست 1988ء کو بہاولپور کے قریب طیارہ حادثے میں جاں بحق ہوئے۔"
