summary:
  ar: "خازن بيوت أموال المهدي، لما فرّق مال أبيه رمى بالمفاتيح بين يديه وقال ما معنى مفاتيح لبيوت فرغ، فلما وردت الأموال وشغل بتصحيحها قال له المهدي أنت أعرابي أحمق فقال إن الحادثة إذا حدثت لم تنتظرك حتى توجه في استخراج الأموال {cite:muruj-al-dhahab p. 302-303}."
  en: "Al-Mahdi's treasury-keeper who flung down the keys of the emptied vaults — 'accidents do not wait while you send for money' {cite:muruj-al-dhahab p. 302-303}."
  fr: "Le gardien du trésor d'al-Mahdi qui jeta à terre les clés des caveaux vidés — « les accidents n'attendent pas qu'on envoie chercher l'argent » {cite:muruj-al-dhahab p. 302-303}."
  es: "El tesorero de Al-Mahdi, que arrojó las llaves de las bóvedas vacías, dijo: «Los accidentes no esperan mientras pides dinero» {cita:muruj-al-dhahab págs. 302-303}."
  ur: "المہدی کے خزانے کا رکھوالا جس نے خالی تجوریوں کی چابیاں نیچے پھینک دیں - 'حادثات انتظار نہیں کرتے جب تک آپ رقم بھیجتے ہیں' {حوالہ: مروج الذہب صفحہ 302-303}۔"
  tr: "Mehdi'nin hazinesinin hazinedarı, babasının parasını dağıtırken anahtarları eline verdi ve \"Boş evlere anahtarların ne anlamı var?\" dedi. Para geldiğinde ve hazinedar parayı düzeltmekle meşgulken, Mehdi ona, \"Sen ahmak bir Bedevisin\" dedi. Hazinedar ise, \"Bir olay olursa, parayı çekip almanı beklemez.\" diye cevap verdi. {kaynak: Muruj-al-dhahab s. 302-303}"
  id: "Bendahara perbendaharaan Mahdi, ketika membagikan uang ayahnya, melemparkan kunci ke tangannya dan berkata, “Apa artinya kunci untuk rumah kosong?” Ketika uang itu tiba dan dia sibuk mengaturnya, Mahdi berkata kepadanya, “Kamu orang Badui yang bodoh.” Dia menjawab, “Jika terjadi suatu kejadian, kejadian itu tidak akan menunggu kamu pergi dan mengambil uangnya.” {cite:muruj-al-dhahab p. 302-303}"
