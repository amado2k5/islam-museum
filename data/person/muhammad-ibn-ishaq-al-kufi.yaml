summary:
  ar: "أبو عبد الله محمد بن إسحاق الكوفي، المتشمّر للحاق، المتحرّز من الفراق، كان على فوت الساعات ضنينًا. روى عنه عبد الله بن علي الأموي قول الحكماء: الأيام سهام، والناس أغراض، والدهر يرميك كل يوم بسهامه، ويستخدمك بليله ونهاره، والأمل طويل والعمر قصير."
  en: "Abu Abd Allah Muhammad ibn Ishaq al-Kufi, who girded himself for the meeting with God and guarded against parting, was miserly with the hours and grieved over their loss; he relates the sayings of the wise: days are arrows and people are targets, time shoots you each day with its arrows and uses you by its nights and days; hope is long and life is short, and all things return to God."
  ur: "ابو عبد اللہ محمد بن اسحاق کوفی اللہ سے ملاقات کے لیے کمر بستہ اور جدائی سے محفوظ رہنے والے تھے، اوقات کی حفاظت کرتے اور ان کے ضائع ہونے پر افسوس کرتے تھے۔ انہوں نے حکماء کے اقوال نقل کیے: دن تیر ہیں اور لوگ نشانے، زمانہ ہر روز اپنے تیر تم پر چلاتا ہے اور اپنی راتوں اور دنوں سے تمہیں خدمت پر لگاتا ہے؛ امید لمبی ہے اور عمر مختصر، اور سب کچھ اللہ کی طرف لوٹتا ہے۔"
