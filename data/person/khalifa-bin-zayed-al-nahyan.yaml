summary:
  ar: "ثاني رؤساء دولة الإمارات العربية المتحدة وحاكم أبوظبي (2004–2022)، الابن الأكبر لزايد بن سلطان آل نهيان. وُلد في العين سنة 1948، وكان ممثل والده في المنطقة الشرقية ثم ولي عهد أبوظبي من 1969، ونائب رئيس الوزراء ونائب القائد الأعلى، وتولى بعض مهام الرئاسة فعليًا منذ أواخر التسعينيات، ثم خلف والده في 2 نوفمبر 2004 وانتُخب رئيسًا في اليوم التالي. في عهده صارت الإمارات قوة اقتصادية إقليمية، وأُسست طيران الاتحاد ومتحف اللوفر أبوظبي، وسُمّي برج خليفة باسمه سنة 2010، وبعد إصابته بجلطة سنة 2014 تولى أخوه محمد بن زايد الشؤون اليومية. توفي في 13 مايو 2022."
  en: "Second President of the United Arab Emirates and ruler of Abu Dhabi (2004–2022), the eldest son of Zayed bin Sultan Al Nahyan. Born at Al Ain in 1948, he was his father's representative in the Eastern Region, crown prince of Abu Dhabi from 1969, deputy prime minister and deputy supreme commander, and carried out some presidential duties de facto from the late 1990s before succeeding his father on 2 November 2004 and being elected president the next day. Under him the UAE became a regional economic powerhouse; Etihad Airways and the Louvre Abu Dhabi were established and the Burj Khalifa was renamed for him in 2010. After a stroke in 2014 his half-brother Mohamed bin Zayed ran day-to-day affairs. He died on 13 May 2022."
  ur: "متحدہ عرب امارات کے دوسرے صدر اور ابوظبی کے حکمران (2004ء–2022ء)، زاید بن سلطان آل نہیان کے بڑے صاحبزادے۔ 1948ء میں العین میں پیدا ہوئے، اپنے والد کے نمائندے برائے مشرقی علاقہ رہے، 1969ء سے ابوظبی کے ولی عہد، نائب وزیرِ اعظم اور نائب سپریم کمانڈر رہے، اور 1990ء کی دہائی کے آخر سے عملی طور پر صدارت کے بعض امور انجام دیتے رہے، حتیٰ کہ 2 نومبر 2004ء کو والد کے جانشین بنے اور اگلے دن صدر منتخب ہوئے۔ ان کے دور میں امارات علاقائی اقتصادی قوت بنی، اتحاد ایئرویز اور لوور ابوظبی قائم ہوئے اور 2010ء میں برج خلیفہ ان کے نام سے منسوب ہوا۔ 2014ء میں فالج کے بعد ان کے سوتیلے بھائی محمد بن زاید روزمرہ امور چلاتے رہے۔ 13 مئی 2022ء کو وفات پائی۔"
