summary:
  ar: "عيسى نجاتي (ت. 1509)، المعروف بنجاتي بك، أول شاعر غنائي عظيم في الأدب التركي العثماني. وُلد عبدًا في أدرنة في أربعينيات القرن الخامس عشر على الأرجح، وتبنّته امرأة أدرنية مسنّة، فتعلّم الخط والشعر، ثم صار كاتبًا في ديوان محمد الثاني، وخدم الأميرين عبد الله ومحمود كاتبًا ونيشانجيًا، واعتزل بعد موت الأمير محمود في منزله بحي وفا بإسطنبول حتى مات سنة 1509. لم يبقَ من آثاره إلا ديوانه، وهو عند معاصريه ومن بعدهم من أئمة الغزل التركي."
  en: "İsa Necati (d. 1509), known as Necati Bey, the first great lyric poet of Ottoman Turkish literature. Born into slavery at Edirne, probably in the 1440s, and adopted by an elderly woman of the city, he taught himself calligraphy and poetry, became a secretary in Mehmed II's divan, served Princes Abdullah and Mahmud as katib and nişancı, and after Mahmud's death retired to his house in Istanbul's Vefa quarter, where he died in 1509. Only his Divan survives, and contemporaries and later tezkire writers alike rank him among the masters of the Turkish ghazel."
  ur: "عيسى نجاتي (وفات 1509ء)، معروف بہ نجاتي بے، عثمانی ترک ادب کے پہلے عظیم غنائی شاعر۔ غالباً 1440ء کی دہائی میں ادرنہ میں غلام پیدا ہوئے اور ایک بزرگ خاتون نے انھیں گود لیا؛ خطاطی اور شاعری خود سیکھی، محمد ثانی کے دیوان میں کاتب بنے، شہزادہ عبد اللہ اور شہزادہ محمود کی خدمت میں کاتب اور نشانچی رہے، اور محمود کی وفات کے بعد استنبول کے وفا محلے میں گوشہ نشین ہو کر 1509ء میں وفات پائی۔ ان کا صرف دیوان باقی ہے۔"

