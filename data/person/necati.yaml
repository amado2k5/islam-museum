  note: "His birth is an estimate, not a recorded date. The TDV İslâm Ansiklopedisi entry (Kaya) places it at Edirne in the first reign years of Mehmed II, 1444–1446, and the English and Arabic articles likewise say he was born a slave at Edirne; Wikidata gives the single year 1444, the opening year of that estimate. The Turkish article dissents on both points: it says his birth date is unknown and his birthplace is thought to be Kastamonu — the city the other sources have him move to in his youth. No source read pairs a Hijri year with the birth (1444 CE spans 848–849 AH), so the hijri field is omitted."
