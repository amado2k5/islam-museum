summary:
  ar: "شاعر جاهلي يشكري تنسب إليه إحدى المعلقات السبع، وفيها «آذنتنا ببينها أسماء»؛ يوردها شرح الزوزني بعد معلقة عنترة {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  en: "A pre-Islamic poet of Yashkur to whom one of the seven Mu'allaqat is ascribed, the one opening \"Asma' announced her parting to us\"; al-Zawzani's commentary gives it after the Mu'allaqa of Antara {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  fr: "Poète préislamique des Yashkur auquel est attribuée l’une des sept Mu’allaqat, celle qui commence par « Asma nous a annoncé son départ » ; le commentaire d’al-Zawzani la donne après la Mu’allaqa d’Antara {{cite:sharh-muallaqat-sab-zawzani-1921 p.163}}."
  es: "Un poeta preislámico de Yashkur a quien se le atribuye uno de los siete Mu'allaqat, el que abre \"Asma' nos anunció su partida\"; El comentario de al-Zawzani lo da después del Mu'allaqa de Antara {{cita:sharh-muallaqat-sab-zawzani-1921 p.163}}."
