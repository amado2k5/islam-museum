id: person/hisham-ibn-ismail-al-makhzumi
class: person
label: { ar: "هشام بن إسماعيل المخزومي" }
gender: male
roles: [emir]
summary:
  ar: "والي المدينة في عهد عبد الملك بن مروان، دعا الناس إلى البيعة لولي العهد الوليد وسليمان، فلما أبى سعيد بن المسيب ضربه هشام وطاف به وسجنه، وأخبر الخليفة بذلك {cite:salabi-umayyad-state-2020 p.34}. ثم كتب عبد الملك إلى الوالي أن سعيداً كان أحوج إلى الرحمة من الضرب {cite:salabi-umayyad-state-2020 p.35}."
  tr: "Abd al-Malik bin Mervan döneminde Medine valisi, halkı veliaht prens el-Velid ve Süleyman'a bağlılık yemini etmeye çağırdı. Said ibn el-Musayyib reddedince, Hisham onu dövdü, yürüyüşe çıkardı ve hapse attı; halifeye halifeyi bildirdi {cite:salabi-umayyad-state-2020 s.34}. Sonra Abd al-Malik, valiye Sa'id'in bir dayaktan daha fazla merhamete ihtiyaç duyduğunu yazdı {cite:salabi-umayyad-state-2020 s.35}."
  id: "Gubernur Madinah pada masa pemerintahan Abd al-Malik ibn Marwan menyerukan kepada rakyat untuk bersumpah setia kepada putra mahkota al-Walid dan Suleiman. Ketika Sa'id ibn al-Musayyib menolak, Hisham memukulnya, memamerkan, dan memenjarakannya, serta memberitahukan kepada khalifah {cite:salabi-umayyad-state-2020 hlm.34}. Kemudian Abd al-Malik menulis kepada gubernur bahwa Sa'id lebih membutuhkan belas kasihan daripada pukulan {cite:salabi-umayyad-state-2020 hlm.35}."
