summary:
  ar: "داعية وباحث باكستاني، وُلد في غوجرانوالة سنة 1972، أسس منظمة إدارة المصطفى الدولية وجامعة المصطفى في غوجرانوالة، وهو من أتباع الطريقة النقشبندية، تصل خطبه ومحاضراته إلى الملايين عبر يوتيوب، ونال وسام نجمة الامتياز سنة 2023."
  en: "Pakistani preacher and scholar, born in Gujranwala in 1972. He founded Idara-tul-Mustafa International and Jamia-tul-Mustafa in Gujranwala, is a follower of the Naqshbandi Sufi order, and his sermons and lectures reach millions on YouTube; he received the Sitara-e-Imtiaz award in 2023."
  ur: "پاکستانی مبلغ اور عالم، جو 1972 میں گوجرانوالہ میں پیدا ہوئے۔ انہوں نے ادارۃ المصطفٰی انٹرنیشنل اور جامعۃ المصطفٰی گوجرانوالہ کی بنیاد رکھی، وہ نقشبندی صوفی سلسلے کے پیروکار ہیں، اور ان کے خطبات و بیانات یوٹیوب پر لاکھوں لوگوں تک پہنچتے ہیں؛ 2023 میں انہیں ستارۂ امتیاز سے نوازا گیا۔"
