summary:
  ar: "السلطان أورخان بن عثمان ⁦(حكم ٧٢٦–٧٦١هـ/١٣٢٧–١٣٦٠م)⁩؛ ثاني سلاطين آل عثمان، سار على سياسة والده في الحكم والفتوحات. سقطت في يده نيقوميديا سنة ٧٢٧هـ فأنشأ بها أول جامعة عثمانية وعهد بإدارتها إلى داود القيصري أحد العلماء العثمانيين الذين درسوا في مصر، واهتم ببناء الجيش على أسس عصرية فجعله جيشاً نظامياً {cite:dawlat-uthmaniyya-salabi p. 52}. يذكر الصلابي أن أورخان نظّم الجيش في عشرات ومئات وألوف وخصّص خمس الغنائم للجيش وأنشأ مراكز للتدريب، وأنه أنشأ فيلقاً جديداً من الأسرى والمسبيين هو فيلق الجنود الجديدة ⁦(الينيچري)⁩ وأن الفكرة كانت لأخيه علاء الدين، وهو يرد على الروايات التي تصوّر أخذ أبناء النصارى بالإكراه {cite:dawlat-uthmaniyya-salabi p. 53-55}. وضع أورخان خطة استراتيجية لمحاصرة القسطنطينية من الغرب والشرق فأرسل ابنه وولي عهده سليمان لعبور مضيق الدردنيل والاستيلاء على مواقع في الجانب الغربي، فعبر ليلاً في أربعين فارساً وأنشأ القاعدة الأولى في أوروبا {cite:dawlat-uthmaniyya-salabi p. 52}. واستفاد من خلاف ورثة أمير قره سي فضمّ إمارته سنة ٧٣٦هـ/١٣٣٦م، وتدخّل في الخلاف البيزنطي الداخلي، واستثمر زلزلة ١٣٥٨م التي خرّبت حصون تراقيا فأصبحت جليبولو أول قاعدة عثمانية في أوروبا {cite:dawlat-uthmaniyya-salabi p. 56-57}."
  en: "Sultan Orhan (r. 726–761 AH/1327–1360 CE) — took Nicomedia 727, founded the first Ottoman madrasa there under Dawud al-Qaysari, and made the army a regular force {cite:dawlat-uthmaniyya-salabi p. 52}. Al-Sallabi describes him organizing units in tens, hundreds and thousands, reserving a fifth of spoils, and raising the new 'yeni çeri' corps at his brother Alaeddin's suggestion — an account he marshals against the forced-levy reading {cite:dawlat-uthmaniyya-salabi p. 53-55}. Orhan sent his heir Sulayman across the Dardanelles by night with forty horsemen to open the European front {cite:dawlat-uthmaniyya-salabi p. 52}, annexed the Karasi emirate amid a succession dispute in 736/1336, and exploited the 1358 earthquake and Byzantine civil strife to make Gallipoli the first Ottoman base in Europe {cite:dawlat-uthmaniyya-salabi p. 56-57}."
  es: "El sultán Orhan (r. 726–761 AH/1327–1360 CE) tomó Nicomedia en 727, fundó allí la primera madrasa otomana bajo el mando de Dawud al-Qaysari y convirtió al ejército en una fuerza regular {cite:dawlat-uthmaniyya-salabi p. 52}. Al-Sallabi lo describe organizando unidades por decenas, cientos y miles, reservando una quinta parte del botín y levantando el nuevo cuerpo 'yeni çeri' por sugerencia de su hermano Alaeddin, un relato que contrapone a la lectura de leva forzosa {cite:dawlat-uthmaniyya-salabi p. 53-55}. Orhan envió a su heredero Sulayman a través de los Dardanelos por la noche con cuarenta jinetes para abrir el frente europeo {cite:dawlat-uthmaniyya-salabi p. 52}, anexó el emirato de Karasi en medio de una disputa sucesoria en 736/1336, y explotó el terremoto de 1358 y la lucha civil bizantina para convertir a Gallipoli en la primera base otomana en Europa {cite:dawlat-uthmaniyya-salabi p. 56-57}."
  fr: "Le sultan Orhan (r. 726-761 AH/1327-1360 CE) s'empara de Nicomédie en 727, y fonda la première madrasa ottomane sous la direction de Dawud al-Qaysari et organisa l'armée en une force régulière (voir Dawlat-uthmaniyya-salabi, p. 52). Al-Sallabi décrit comment il organisa des unités de dizaines, de centaines et de milliers d'hommes, se réserva un cinquième du butin et créa le nouveau corps des « yeni çeri » sur la suggestion de son frère Alaeddin – un récit qu'il réfute face à la version de la levée forcée (voir Dawlat-uthmaniyya-salabi, p. 53-55). Orhan envoya son héritier Sulayman traverser les Dardanelles de nuit avec quarante cavaliers pour ouvrir le front européen (voir Dawlat-uthmaniyya-salabi, p. 54). 52}, annexa l'émirat de Karasi au milieu d'un conflit de succession en 736/1336, et exploita le tremblement de terre de 1358 et les troubles civils byzantins pour faire de Gallipoli la première base ottomane en Europe {cite:dawlat-uthmaniyya-salabi p. 56-57}."
  ur: "سلطان اورحان (r. 726-761 AH/1327-1360 CE) - نے نیکومیڈیا 727 لیا، وہاں داؤد القیسری کے تحت پہلا عثمانی مدرسہ قائم کیا، اور فوج کو ایک باقاعدہ فورس بنایا۔ 52}۔ السلبی نے دسیوں، سیکڑوں اور ہزاروں میں اکائیوں کو منظم کرنے، غنیمت کا پانچواں حصہ محفوظ کرنے، اور اپنے بھائی علاء الدین کی تجویز پر نئی 'ینی قیری' کور کی تشکیل کے بارے میں بتایا ہے - ایک اکاؤنٹ جو وہ زبردستی لیوی پڑھنے کے خلاف مارشل کرتا ہے۔ 53-55}۔ اورحان نے اپنے وارث سلیمان کو چالیس گھڑ سواروں کے ساتھ رات کے وقت دردانیل کے پار بھیجا تاکہ یورپی محاذ کھولے۔ 52}، 736/1336 میں جانشینی کے تنازعہ کے درمیان کراسی کی امارت کا الحاق کیا، اور 1358 کے زلزلے اور بازنطینی خانہ جنگی کا فائدہ اٹھا کر گیلیپولی کو یورپ کا پہلا عثمانی اڈہ بنایا۔ 56-57}۔"
  tr: "Osmanlı hanedanının ikinci sultanı Sultan Orhan bin Osman (726–761 Hicri / 1327–1360 M.S. hüküm sürdü), babasının yönetim ve fetih politikasını takip etti. Nikomedia 727 Hicri'de ona geçti; burada ilk Osmanlı üniversitesini kurdu ve yönetimini Mısır'da eğitim gören Osmanlı alimlerinden Davud el-Qaysari'ye emanet etti. Orduyu modern temeller üzerine inşa etmeye odaklandı ve onu düzenli bir ordu haline getirdi {cite:dawlat-uthmaniyya-salabi s. 52}. El-Selabi, Orhan'ın orduyu onlarca, yüzlerce, binlerce kişiye ayırdığını, ganimetin beşte birini orduya tahsis ettiğini, eğitim merkezleri kurduğunu ve yeni bir esir ve esirler birliği olan Yeni Askerler Lejyonu (Yenigeri) kurduğunu ve bu fikrin kardeşi Aladdin için olduğunu belirtir. Hristiyan oğulların zorla alındığına dair anlatımlara yanıt verir {cite:dawlat-uthmaniyya-salabi s. 53-55}. Orhan, Konstantinopolis'i batı ve doğudan kuşatmak için stratejik bir plan geliştirdi; oğlu ve veliaht prensi Süleyman'ı Çanakkale'yi geçip batı tarafındaki mevzileri ele geçirmeye gönderdi. Gece kırk süvarıyla geçti ve Avrupa'daki ilk üssünü kurdu {cite:dawlat-uthmaniyya-salabi s. 52}. Qarasi Emiri'nin varisleri arasındaki anlaşmazlıktan yararlanarak 736 Hicri / 1336 M.S. yılında emirliğini ilhak etti, iç Bizans anlaşmazlığına müdahale etti ve 1358 MS depreminden faydalandı; bu deprem Trakya'nın kalelerini yıktı ve Glipulo'yu Avrupa'daki ilk Osmanlı üssü yaptı {cite:dawlat-uthmaniyya-salabi s. 56-57}."
  id: "Sultan Orhan ibn Osman (memerintah 726–761 H / 1327–1360 M), sultan kedua dinasti Ottoman, mengikuti kebijakan pemerintahan dan penaklukan ayahnya. Nicomedia jatuh ke tangannya pada tahun 727 H, di mana ia mendirikan universitas Ottoman pertama dan mempercayakan administrasinya kepada Dawud al-Qaysari, salah satu cendekiawan Ottoman yang belajar di Mesir. Ia fokus membangun tentara di atas fondasi modern dan menjadikannya tentara reguler {cite:dawlat-uthmaniyya-salabi hlm. 52}. Al-Salabi menyebutkan bahwa Orhan mengorganisasi pasukan menjadi puluhan, ratusan, dan ribuan, mengalokasikan seperlima rampasan untuk tentara, mendirikan pusat pelatihan, dan membentuk korps baru tawanan dan tawanan, Legiun Prajurit Baru (Yenigeri), dan bahwa ide itu untuk saudaranya Aladdin. Ia menanggapi laporan yang menggambarkan putra-putra Kristen ditangkap dengan paksa {cite:dawlat-uthmaniyya-salabi hlm. 53-55}. Orhan merancang rencana strategis untuk mengepung Konstantinopel dari barat dan timur, mengirim putranya sekaligus putra mahkota Suleiman menyeberangi Dardanelles dan merebut posisi di sisi barat. Ia menyeberang pada malam hari bersama empat puluh penunggang kuda dan mendirikan pangkalan pertama di Eropa {cite:dawlat-uthmaniyya-salabi hlm. 52}. Ia memanfaatkan perselisihan di antara para ahli waris Emir Qarasi untuk menganeksasi emirnya pada tahun 736 H / 1336 M, ikut campur dalam perselisihan internal Bizantium, dan memanfaatkan gempa bumi tahun 1358 M, yang menghancurkan benteng-benteng Thrace, menjadikan Glipulo sebagai basis Ottoman pertama di Eropa {cite:dawlat-uthmaniyya-salabi hlm. 56-57}."
