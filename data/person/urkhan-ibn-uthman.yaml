summary:
  ar: "السلطان أورخان بن عثمان (حكم ٧٢٦–٧٦١هـ/١٣٢٧–١٣٦٠م)؛ ثاني سلاطين آل عثمان، سار على سياسة والده في الحكم والفتوحات. سقطت في يده نيقوميديا سنة ٧٢٧هـ فأنشأ بها أول جامعة عثمانية وعهد بإدارتها إلى داود القيصري أحد العلماء العثمانيين الذين درسوا في مصر، واهتم ببناء الجيش على أسس عصرية فجعله جيشاً نظامياً {cite:dawlat-uthmaniyya-salabi p. 52}. يذكر الصلابي أن أورخان نظّم الجيش في عشرات ومئات وألوف وخصّص خمس الغنائم للجيش وأنشأ مراكز للتدريب، وأنه أنشأ فيلقاً جديداً من الأسرى والمسبيين هو فيلق الجنود الجديدة (الينيچري) وأن الفكرة كانت لأخيه علاء الدين، وهو يرد على الروايات التي تصوّر أخذ أبناء النصارى بالإكراه {cite:dawlat-uthmaniyya-salabi p. 53-55}. وضع أورخان خطة استراتيجية لمحاصرة القسطنطينية من الغرب والشرق فأرسل ابنه وولي عهده سليمان لعبور مضيق الدردنيل والاستيلاء على مواقع في الجانب الغربي، فعبر ليلاً في أربعين فارساً وأنشأ القاعدة الأولى في أوروبا {cite:dawlat-uthmaniyya-salabi p. 52}. واستفاد من خلاف ورثة أمير قره سي فضمّ إمارته سنة ٧٣٦هـ/١٣٣٦م، وتدخّل في الخلاف البيزنطي الداخلي، واستثمر زلزلة ١٣٥٨م التي خرّبت حصون تراقيا فأصبحت جليبولو أول قاعدة عثمانية في أوروبا {cite:dawlat-uthmaniyya-salabi p. 56-57}."
  en: "Sultan Orhan (r. 726–761 AH/1327–1360 CE) — took Nicomedia 727, founded the first Ottoman madrasa there under Dawud al-Qaysari, and made the army a regular force {cite:dawlat-uthmaniyya-salabi p. 52}. Al-Sallabi describes him organizing units in tens, hundreds and thousands, reserving a fifth of spoils, and raising the new 'yeni çeri' corps at his brother Alaeddin's suggestion — an account he marshals against the forced-levy reading {cite:dawlat-uthmaniyya-salabi p. 53-55}. Orhan sent his heir Sulayman across the Dardanelles by night with forty horsemen to open the European front {cite:dawlat-uthmaniyya-salabi p. 52}, annexed the Karasi emirate amid a succession dispute in 736/1336, and exploited the 1358 earthquake and Byzantine civil strife to make Gallipoli the first Ottoman base in Europe {cite:dawlat-uthmaniyya-salabi p. 56-57}."
