summary:
  ar: "حنفي يمامي؛ أتاه النبي فأقطعه وكتب له كتاباً بإقطاع الغورة وغرابة والحبل، ثم أقطعه أبو بكر الخضرمة وعثمان قطيعة أخرى؛ ويوم وقعة اليمامة قال لخالد بن الوليد إن أكثر أهل اليمامة لم يخرجوا لقتاله وصالحه عنهم على نصف السبي ونصف الصفراء والبيضاء والحلقة والكراع، ثم ألبس من بقي في الحصون من المشايخ والصبيان والنساء السلاح وأقامهم على الحصون فرأهم خالد مقاتلة، ورجع مجاعة فزعم أنهم رفضوا حتى رضّوه بالمصالحة على ربع السبي ونصف المال، فلما دخل خالد اليمامة ورأى من بقي بها قال «خدعتني يا مجاع»؛ وكان ممن حدّث بها الحارث بن مرة الحنفي عن هشام بن إسماعيل."
  en: "A Hanafi of al-Yamama; he came to the Prophet who made him a grant and wrote him a letter allotting al-Ghawra, Ghuraba and al-Habal, then Abu Bakr granted him al-Khidrima and Uthman a further allotment; on the day of the battle of al-Yamama he told Khalid ibn al-Walid that most of its people had not come out to fight, and made peace on their behalf for half the captives and half the gold, silver, armour and mounts, then armed the remaining old men, boys and women and stood them on the fortresses so that Khalid saw fighters, returning to claim they had refused until he brought the terms down to a quarter of the captives and half the wealth — whereupon Khalid, entering and seeing who remained, said 'you deceived me, Mujja'a'; al-Harith ibn Murra al-Hanafi transmitted the report from Hisham ibn Isma'il."
  ur: "یمامہ کا حنفی؛ نبی کے پاس آیا جس نے اسے عطیہ دیا اور الغورہ، غرابہ اور الہبل کی تحویل کا خط لکھا۔"
  es: "Un hanafí de al-Yamama; se presentó ante el Profeta, quien le concedió una subvención y le escribió una carta asignándole al-Ghawra, Ghuraba y al-Habal. Luego, Abu Bakr le concedió al-Khidrima y a Uthman una asignación adicional. El día de la batalla de al-Yamama, le dijo a Khalid ibn al-Walid que la mayoría de su gente no había salido a luchar, y firmó la paz en su nombre a cambio de la mitad de los cautivos y la mitad del oro, la plata, las armaduras y las monturas. Después, armó a los ancianos, niños y mujeres restantes y los colocó en las fortalezas, de modo que Khalid vio a los combatientes regresar para alegar que se habían negado hasta que redujo los términos a una cuarta parte de los cautivos y la mitad de la riqueza. Entonces, Khalid, entrando y viendo quiénes quedaban, dijo: \"Me has engañado, Mujja'a\". Al-Harith ibn Murra al-Hanafi transmitió el informe de Hisham ibn Isma'il."
  fr: "Un hanafite d'al-Yamama; il vint trouver le Prophète qui lui fit une donation et lui écrivit une lettre lui attribuant al-Ghawra, Ghuraba et al-Habal, puis Abu Bakr lui octroya al-Khidrima et Uthman une autre part; le jour de la bataille d'al-Yamama, il dit à Khalid ibn al-Walid que la plupart de ses habitants n'étaient pas sortis combattre, et négocia la paix en leur nom pour la moitié des captifs et la moitié de l'or, de l'argent, des armures et des montures, puis arma les vieillards, les garçons et les femmes restants et les plaça sur les forteresses de sorte que Khalid vit des combattants, revenant prétendre qu'ils avaient refusé jusqu'à ce qu'il réduise les conditions à un quart des captifs et la moitié des richesses — alors Khalid, entrant et voyant qui était resté, dit: « Tu m'as trompé, Mujja'a »; al-Harith ibn Murra al-Hanafi transmit le récit de Hisham ibn Isma'il."
