summary:
  ar: "حنفي يمامي؛ أتاه النبي فأقطعه وكتب له كتاباً بإقطاع الغورة وغرابة والحبل، ثم أقطعه أبو بكر الخضرمة وعثمان قطيعة أخرى؛ ويوم وقعة اليمامة قال لخالد بن الوليد إن أكثر أهل اليمامة لم يخرجوا لقتاله وصالحه عنهم على نصف السبي ونصف الصفراء والبيضاء والحلقة والكراع، ثم ألبس من بقي في الحصون من المشايخ والصبيان والنساء السلاح وأقامهم على الحصون فرأهم خالد مقاتلة، ورجع مجاعة فزعم أنهم رفضوا حتى رضّوه بالمصالحة على ربع السبي ونصف المال، فلما دخل خالد اليمامة ورأى من بقي بها قال «خدعتني يا مجاع»؛ وكان ممن حدّث بها الحارث بن مرة الحنفي عن هشام بن إسماعيل."
  en: "A Hanafi of al-Yamama; he came to the Prophet who made him a grant and wrote him a letter allotting al-Ghawra, Ghuraba and al-Habal, then Abu Bakr granted him al-Khidrima and Uthman a further allotment; on the day of the battle of al-Yamama he told Khalid ibn al-Walid that most of its people had not come out to fight, and made peace on their behalf for half the captives and half the gold, silver, armour and mounts, then armed the remaining old men, boys and women and stood them on the fortresses so that Khalid saw fighters, returning to claim they had refused until he brought the terms down to a quarter of the captives and half the wealth — whereupon Khalid, entering and seeing who remained, said 'you deceived me, Mujja'a'; al-Harith ibn Murra al-Hanafi transmitted the report from Hisham ibn Isma'il."
