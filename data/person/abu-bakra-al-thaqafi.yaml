summary:
  en: "A slave of Thaqif who descended from the besieged fortress of Ta'if on a pulley (bakra) in response to the Prophet's proclamation of freedom; the Prophet manumitted him as a 'freeman of God', and he became a prominent Companion and hadith transmitter in Basra."
  ar: "كان مولى لثقيف في حصن الطائف؛ فلما أعلن النبي أن من تدلى من الحصن فهو حر تدلى ببكرة فعُرف بها، فأعتقه النبي وسماه من عتقاء الله، وصار صحابياً وفقيهاً ومحدثاً نزل البصرة. وفي الصحيح أنه «تسوّر حضن الطائف في أناس فجاء إلى النبي ثالث ثلاثة وعشرين من الطائف» {cite:sahih-al-bukhari 4327}. وشهد بعد ذلك على المغيرة بن شعبة في قصة أم جميل فجلده عمر في القذف، وحلف أن لا يكلم أخاه لأمه زياداً أبداً، وكان قدم البصرة مع عتبة بن غزوان {cite:futuh-buldan-maarif-1407}."
