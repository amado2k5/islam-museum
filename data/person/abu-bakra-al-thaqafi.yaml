summary:
  en: "A slave of Thaqif who descended from the besieged fortress of Ta'if on a pulley (bakra) in response to the Prophet's proclamation of freedom; the Prophet manumitted him as a 'freeman of God', and he became a prominent Companion and hadith transmitter in Basra."
  ar: "كان مولى لثقيف في حصن الطائف؛ فلما أعلن النبي أن من تدلى من الحصن فهو حر تدلى ببكرة فعُرف بها، فأعتقه النبي وسماه من عتقاء الله، وصار صحابياً وفقيهاً ومحدثاً نزل البصرة. وفي الصحيح أنه «تسوّر حضن الطائف في أناس فجاء إلى النبي ثالث ثلاثة وعشرين من الطائف» {cite:sahih-al-bukhari 4327}. وشهد بعد ذلك على المغيرة بن شعبة في قصة أم جميل فجلده عمر في القذف، وحلف أن لا يكلم أخاه لأمه زياداً أبداً، وكان قدم البصرة مع عتبة بن غزوان {cite:futuh-buldan-maarif-1407}."
  ur: "ثقیف کا غلام جو طائف کی محصور قلعے سے بکرو ⁦(چرخی)⁩ پر اترا، نبی کے آزادی کے اعلان کے جواب میں؛ اسی سے اس کا نام پڑا۔"
  fr: "Esclave des Thaqif qui descendit de la forteresse assiégée de Ta'if au moyen d'une poulie (bakra) en réponse à la proclamation de liberté du Prophète ; le Prophète l'affranchit comme « affranchi de Dieu », et il devint un Compagnon et transmetteur de hadith en vue à Bassora."
  es: "Un esclavo de Thaqif que descendió de la fortaleza sitiada de Ta'if en una polea (bakra) en respuesta a la proclamación de libertad del Profeta; el Profeta lo manumitió como un \"hombre libre de Dios\", y se convirtió en un Compañero destacado y transmisor de hadices en Basora."
  tr: "O, Taif kalesinde Sakif kabilesinden azat edilmiş bir köleydi. Peygamber, kaleden inen herkesin azat edileceğini ilan ettiğinde, bir makarayı çekerek aşağı indi ve bu sayede tanındı. Peygamber onu azat etti ve onu Allah'ın azat edilmiş kullarından biri olarak adlandırdı. Sahabe, fıkıhçı ve hadis âlimi oldu ve Basra'ya yerleşti. Sahih el-Buhari'de, \"bir grup insanla Taif surunu tırmanıp, Taif'ten gelen yirmi üç kişiden üçüncüsü olarak Peygamber'in huzuruna geldiği\" rivayet edilir (Sahih el-Buhari 4327). Daha sonra Ümmü Cemil kıssasında el-Muğire ibn Şube aleyhine şahitlik etti, bu yüzden Ömer onu iftira suçundan kırbaçladı. Annesinin üvey kardeşi Ziyad ile bir daha asla konuşmayacağına yemin etti. Utbe ibn Gazvan ile Basra'ya gelmişti (alıntı:futuh-buldan-maarif-1407)."
  id: "Dia adalah seorang budak yang dibebaskan dari suku Thaqif di benteng Ta'if. Ketika Nabi mengumumkan bahwa siapa pun yang turun dari benteng akan dibebaskan, dia turun dengan menarik katrol, dan dia dikenali olehnya. Nabi membebaskannya dan menobatkannya sebagai salah satu budak Allah yang dibebaskan. Dia menjadi seorang Sahabat, ahli hukum, dan sarjana hadits, dan dia menetap di Basra. Diriwayatkan dalam Sahih al-Bukhari bahwa dia \"memanjat tembok Ta'if bersama sekelompok orang dan datang kepada Nabi sebagai orang ketiga dari dua puluh tiga orang dari Ta'if\" (kutipan: sahih-al-bukhari 4327). Dia kemudian bersaksi melawan al-Mughirah ibn Shu'bah dalam kisah Umm Jamil, sehingga Umar mencambuknya karena fitnah. Dia bersumpah untuk tidak pernah berbicara lagi dengan saudara tirinya dari pihak ibu, Ziyad. Dia datang ke Basra bersama Utbah ibn Ghazwan (kutip:futuh-buldan-maarif-1407)."
