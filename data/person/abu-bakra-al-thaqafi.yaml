summary:
  en: "A slave of Thaqif who descended from the besieged fortress of Ta'if on a pulley (bakra) in response to the Prophet's proclamation of freedom; the Prophet manumitted him as a 'freeman of God', and he became a prominent Companion and hadith transmitter in Basra."
  ar: "كان مولى لثقيف في حصن الطائف؛ فلما أعلن النبي أن من تدلى من الحصن فهو حر تدلى ببكرة فعُرف بها، فأعتقه النبي وسماه من عتقاء الله، وصار صحابياً وفقيهاً ومحدثاً نزل البصرة."
