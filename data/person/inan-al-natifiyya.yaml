summary:
  ar: "عنان الناطفية، شاعرة جارية لرجل من أهل بغداد يدعى الناطفي، من مولدات اليمامة وقيل المدينة، اشتهرت ببغداد وكانت من أذكى النساء وأشعرهن، أخبارها مع العباس بن الأحنف وأبي نواس، توفيت سنة 226 هـ."
  en: "Inan al-Natifiyya, a poet and slave girl of a Baghdadi called al-Natifi, raised in al-Yamama or, by another report, Medina, and famous in Baghdad as one of the quickest-witted and most gifted women poets; she has reports with al-Abbas ibn al-Ahnaf and Abu Nuwas; died 226 AH (841)."
  es: "Inan al-Natifiyya, poetisa y esclava de un bagdadí llamado al-Natifi, criada en al-Yamama o, según otro relato, en Medina, y famosa en Bagdad como una de las poetisas más ingeniosas y talentosas; se dice que tuvo relación con al-Abbas ibn al-Ahnaf y Abu Nuwas; murió en el año 226 de la Hégira (841 d. C.)."
  fr: "Inan al-Natifiyya, poétesse et esclave d'un Bagdadi appelé al-Natifi, élevée à al-Yamama ou, selon un autre rapport, à Médine, et célèbre à Bagdad comme l'une des femmes poètes les plus brillantes et les plus douées; elle a des rapports avec al-Abbas ibn al-Ahnaf et Abu Nuwas; décédée en 226 AH (841)."
  ur: "عنان النطیفیہ، ایک شاعرہ اور البغدادی کی لونڈی جسے النطفی کہا جاتا ہے، جس کی پرورش ال یمامہ یا ایک اور رپورٹ کے مطابق، مدینہ میں ہوئی، اور بغداد میں سب سے زیادہ ذہین اور ہونہار خواتین شاعروں میں سے ایک کے طور پر مشہور ہے۔ اس کے پاس العباس ابن الاحنف اور ابو نواس سے روایتیں ہیں۔ وفات 226ھ (841)۔"
