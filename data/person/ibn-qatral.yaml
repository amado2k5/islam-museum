summary:
  ar: "قاضي القضاة؛ ولي القضاء بعميد مدة وكان يوم أخذ الفرنج عميد سنة تسع وستمائة أسيراً في أيديهم ثم أفلت منهم وسار إلى الأندلس فولي قضاء شاطبة ثم قرطبة ثم أخيراً قضاء فاس، وتوفي بمراكش عن ثمان وثمانين سنة {cite:shadharat-dhahab p. 261}."
  en: "Qadi of qadis (d. Marrakesh, Rabi' I 652, aged 88) — taken captive when the Franks seized Amid in 609, he escaped west and held the judicature of Játiva, then Cordoba, then Fez {cite:shadharat-dhahab p. 261}."
  es: "Qadi de qadis (m. Marrakech, Rabi' I 652, edad 88) — capturado cuando los francos tomaron Amid en 609, escapó al oeste y ejerció la jurisdicción de Játiva, luego Córdoba, luego Fez {cite:shadharat-dhahab p. 261}."
  fr: "Cadi des cadis (décédé à Marrakech, Rabi' I 652, à l'âge de 88 ans) — fait prisonnier lorsque les Francs s'emparent d'Amid en 609, il s'échappe vers l'ouest et détient la justice de Játiva, puis de Cordoue, puis de Fès {cite: shadharat-dhahab p. 261}."
  ur: "قادیوں کا قادی ⁦(متوفی مراکش، ربیع اول 652، عمر 88)⁩ - جب فرینکوں نے 609 میں امڈ پر قبضہ کر لیا تو اس نے مغرب سے فرار ہو کر جاتیوا، پھر قرطبہ، پھر فیز کی عدالت سنبھالی۔ 261}۔"
  tr: "Baş yargıç; bir süre baş yargıç olarak görev yaptı. Franklar Ameed'i 600 Hicri yılında ele geçirdiği gün, sonra onlardan kaçtı. Endülüs'e gitti, burada Şatiba'nın, ardından Cordoba'nın ve son olarak Fez yargıcı oldu. Seksen sekiz yaşında Marakeş'te öldü {atıf:shadharat-dhahab, s. 261}."
  id: "Hakim Ketua; ia menjabat sebagai hakim utama untuk suatu waktu. Pada hari ketika bangsa Franka menangkap Ameed pada tahun 600 H, kemudian melarikan diri dari mereka. Ia pergi ke al-Andalus, di mana ia menjadi hakim Shatiba, kemudian Cordoba, dan akhirnya hakim Fez. Ia meninggal di Marrakesh pada usia delapan puluh delapan tahun {cite:shadharat-dhahab, hlm. 261}."
