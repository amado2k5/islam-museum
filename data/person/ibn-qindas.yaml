summary:
  ar: "تقي الدين بن قندس البعلي الحنبلي الأنصاري الإمام المقرئ اللغوي؛ ولد سنة اثنتين وسبعين وسبعمائة بقرية بعلي من قرى الصالحية وأقرأ بالمقبرة التي بناها والده ثم رحل إلى دمشق وأخذ الفقه عن الشيخ علاء الدين بن مفلح وولده والشيخ قطب الدين ابن الهمذاني والشيخ مجد الدين بن قاضي شهبة ولازم ولده القاضي النور جعفر والشيخ أبي بكر بن الميدامي حتى برع، ثم ارتحل إلى الإسكندرية ومصر واشتغل بها مدة وحج مع ابن عمه الشيخ عثمان سنة ثمان وتسعين وسبعمائة وقرأ عليه الحديث وأخذ عن العلامة ابن رسلان المصري وولده في روايته له كتابه الزبد، وتفقه به جماعة وفقهاء وأقرأ بعجلة في رجب سنة خمس وأربعين بكثير من الروايات، وله يد في الفرائض والنحو والتصوف والحديث وسمعت منه ليلة في المدرسة الجديدية محفلاً فأقرأ فيه في الجزء الأول برواية معروف قال الشيخ تقي الدين أبو السدق وكان ذا نفس بارد وتقاعس مع فرط ذكائه، توفي بدمشق سنة عاشر ومات يوم عاشوراء سنة اثنتين وستين وثمانمائة {cite:shadharat-dhahab p. 300-301}."
  en: "Ibn Qindas (b. Ba'li village 772) — the Hanbali qurra'-linguist who studied under both Ibn Muflihs and Ibn Qadi Shuhba's son, took the Zubd directly from Ibn Ruslan, made hajj in 798, and led Qur'an sessions at the Madrasa Jaddidiyya — 'a cold soul for all his razor wit'; died Damascus on Ashura 862 {cite:shadharat-dhahab p. 300-301}."
