summary:
  ar: "تقي الدين بن قندس البعلي الحنبلي الأنصاري الإمام المقرئ اللغوي؛ ولد سنة اثنتين وسبعين وسبعمائة بقرية بعلي من قرى الصالحية وأقرأ بالمقبرة التي بناها والده ثم رحل إلى دمشق وأخذ الفقه عن الشيخ علاء الدين بن مفلح وولده والشيخ قطب الدين ابن الهمذاني والشيخ مجد الدين بن قاضي شهبة ولازم ولده القاضي النور جعفر والشيخ أبي بكر بن الميدامي حتى برع، ثم ارتحل إلى الإسكندرية ومصر واشتغل بها مدة وحج مع ابن عمه الشيخ عثمان سنة ثمان وتسعين وسبعمائة وقرأ عليه الحديث وأخذ عن العلامة ابن رسلان المصري وولده في روايته له كتابه الزبد، وتفقه به جماعة وفقهاء وأقرأ بعجلة في رجب سنة خمس وأربعين بكثير من الروايات، وله يد في الفرائض والنحو والتصوف والحديث وسمعت منه ليلة في المدرسة الجديدية محفلاً فأقرأ فيه في الجزء الأول برواية معروف قال الشيخ تقي الدين أبو السدق وكان ذا نفس بارد وتقاعس مع فرط ذكائه، توفي بدمشق سنة عاشر ومات يوم عاشوراء سنة اثنتين وستين وثمانمائة {cite:shadharat-dhahab p. 300-301}."
  en: "Ibn Qindas (b. Ba'li village 772) — the Hanbali qurra'-linguist who studied under both Ibn Muflihs and Ibn Qadi Shuhba's son, took the Zubd directly from Ibn Ruslan, made hajj in 798, and led Qur'an sessions at the Madrasa Jaddidiyya — 'a cold soul for all his razor wit'; died Damascus on Ashura 862 {cite:shadharat-dhahab p. 300-301}."
  es: "Ibn Qindas (n. Ba'li village 772) — el lingüista hanbalí de qurra' que estudió con Ibn Muflihs y con el hijo de Ibn Qadi Shuhba, tomó el Zubd directamente de Ibn Ruslan, hizo el Hajj en 798 y dirigió sesiones del Corán en la Madrasa Jaddidiyya — 'un alma fría a pesar de su ingenio afilado'; murió en Damasco el Ashura de 862 {cite:shadharat-dhahab p. 300-301}."
  fr: "Ibn Qindas (né au village de Ba'li en 772) — le linguiste coranique hanbalite qui étudia sous la direction d'Ibn Muflihs et du fils d'Ibn Qadi Shuhba, reçut le Zubd directement d'Ibn Ruslan, fit le hajj en 798 et dirigea des sessions de Coran à la Madrasa Jaddidiyya — « une âme froide malgré son esprit acéré »; mourut à Damas le jour d'Achoura 862 {cite: shadharat-dhahab p. 300-301}."
  ur: "ابن قنداس ⁦(بعضی گاؤں 772)⁩ - حنبلی قراء لسانیات کا ماہر جس نے ابن مفلح اور ابن قادی شعبہ کے بیٹے دونوں سے تعلیم حاصل کی، براہ راست ابن رسلان سے زبد لیا، 798 میں حج کیا، اور مدرسہ الجدید میں قرآن کی نشست کی قیادت کی۔ عاشورہ 862 کو دمشق کی وفات ہوئی۔ 300-301}۔"
  tr: "İmam ve dil okuyucusu Taqi al-Din ibn Qundas al-Ba'li al-Hanbali al-Ansari, 772 Hicri yılında Salihiye köylerinden biri olan Ba'ali köyünde doğdu. Babası tarafından yaptırılan mezarlıkta eğitim gördü, ardından Şam'a giderek Şeyh Ala'ddin ibn Muflih ve oğlu Şeyh Kutb al-Din ibn el-Hamadhani ile Şeyh Majd al-Din ibn el-Hamadhani ve Şeyh Majd al-Din ibn Kadi Şahba'nın yanında eğitim aldı. Oğulları Hakim el-Nur Ca'far ve Şeyh Ebu Bekir bin Midemi'ye eşlik etti ve başarılı olana kadar eşlik etti. Daha sonra İskenderiye ve Mısır'a seyahat etti, burada bir süre kuzeni Şeyh Osman ile birlikte çalıştı ve hac yaptı 798 Hicri yılında, onun yanında hadis çalıştı ve alim İbn Raslan el-Masri ile oğlunun yanında eğitim aldı. Rivayetinde 'El-Zabad' adlı kitabını yazdı. Bir grup hukukçu onun yanında çalıştı ve kırk beşinci yılın Recep'inde hızla birçok rivayet okudu. Miras kanunları, dilbilgisi, tasavvuf ve hadis konusunda yetkindi. Bir gece Jadididiye Okulu'nda ondan bir toplantıda Ma'ruf'un rivayetinin birinci cildinde okudu. Şeyh Taqi al-Din Ebu el-Sadiq şöyle dedi: Soğuk bir ruhu vardı ve büyük zekasına rağmen tembeldi. Onuncu yılında Şam'da öldü ve 862 Hicri yılında Aşura'da öldü {atıf:shadharat-dhahab, s. 300-301}."
  id: "Taqi al-Din ibn Qundas al-Ba'li al-Hanbali al-Ansari, sang imam dan pembaca bahasa, lahir pada tahun 772 H di desa Ba'ali, salah satu desa di al-Salihiyah. Ia belajar di pemakaman yang dibangun oleh ayahnya, lalu pergi ke Damaskus dan mempelajari hukum di bawah bimbingan Sheikh Ala' al-Din ibn Muflih dan putranya, Sheikh Qutb al-Din ibn al-Hamadhani, serta Sheikh Majd al-Din ibn Qadi Shahba. Ia menemani putra-putranya Hakim al-Nur Ja'far dan Sheikh Abu Bakr ibn al-Midami hingga ia berprestasi. Kemudian ia melakukan perjalanan ke Alexandria dan Mesir, di mana ia bekerja untuk sementara waktu dan melaksanakan Haji bersama sepupunya Sheikh Uthman Pada tahun 798 H, ia mempelajari hadits di bawah bimbingan dan belajar di bawah ulama Ibn Raslan al-Masri dan putranya. Dalam riwayatnya, ia menulis bukunya 'Al-Zabad.' Sekelompok ahli hukum belajar di bawah bimbingannya, dan ia dengan cepat membacakan banyak riwayat dalam Rajab tahun empat puluh lima. Ia mahir dalam hukum warisan, tata bahasa, tasawuf, dan hadits. Suatu malam saya mendengar darinya di Sekolah Jadididiya sebuah pertemuan, di mana ia membacakan dalam jilid pertama riwayat Ma'ruf. Sheikh Taqi al-Din Abu al-Sadiq berkata: Ia memiliki jiwa yang dingin dan malas meskipun sangat cerdas. Ia meninggal di Damaskus pada tahun kesepuluh dan meninggal pada Ashura tahun 862 H. {cite:shadharat-dhahab, hlm. 300-301}."
