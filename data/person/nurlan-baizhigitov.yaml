  ar: "إمام وداعية كازاخستاني ⁦(المولود 1979 في منطقة جامبيل)⁩، إمام أكبر لمسجد يريسكيلدي قاجي في أستانا منذ مايو 2023، اشتهر بلقب «إمام تيك توك»؛ يعدّ حسابه على إنستغرام نحو 927 ألف متابع بحسب دراسة محكّمة ⁦(يناير 2025)⁩، ويعرف بخطبه في حقوق النساء ودعوته إلى إفطار الصلاة الوطني في واشنطن."
  en: "A Kazakhstani imam and preacher (born 1979 in the Zhambyl region), chief imam of Astana's Yryskeldi Kazhy Mosque since May 2023 and popularly known as the 'TikTok Imam'; his Instagram account counted 927 thousand followers in a peer-reviewed study (January 2025), and he is known for sermons on women's rights and for his invitation to the National Prayer Breakfast in Washington."
  ur: "نورلان بائی جیگیتوف (پیدائش 1979ء، جامبیل علاقہ) قازق امام اور مبلغ ہیں، مئی 2023 سے آستانہ کی یریسکلدی قاجی مسجد کے امامِ اکبر اور عوام میں «ٹک ٹاک امام» کے لقب سے مشہور ہیں۔ ایک محققانہ مطالعے کے مطابق جنوری 2025 میں ان کے انسٹاگرام فالوورز تقریباً 927 ہزار تھے، اور وہ خواتین کے حقوق پر خطبوں اور واشنگٹن کے نیشنل پریئر بریک فاسٹ کی دعوت کے لیے جانے جاتے ہیں۔"
