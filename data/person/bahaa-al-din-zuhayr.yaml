summary:
  ar: "أبو الفضل زهير بن محمد بن علي بن يحيى، الملقب بهاء الدين؛ الشاعر الكاتب؛ كان متمكناً من مخدومه كثير القدر عنده لا يتوسط إلا بالخير ونفع خلقاً كثيراً بحسن وساطته؛ أول ما قاله من المدح بثغر دمياط سنة خمس وستمائة؛ توجه إلى الموصل رسولاً من جهة مخدومه الملك الصالح؛ وصفه ابن خلكان الذي اجتمع به بالقاهرة بمكارم الأخلاق وكثرة العفة ودماثة السجايا، وأجازه رواية ديوانه وهو كثير الوجود بأيدي الناس {cite:wafayat-ayan}."
  en: "Bahaa al-Din Zuhayr b. Muhammad (b. 581 Mecca, d. 656 Cairo) — poet and secretary in the service of the Ayyubid al-Malik al-Salih; famed for interceding only for good; Ibn Khallikan met him in Cairo and describes his gentle character; died in the epidemic of 656 {cite:wafayat-ayan}."
