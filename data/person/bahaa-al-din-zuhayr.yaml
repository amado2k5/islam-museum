summary:
  ar: "أبو الفضل زهير بن محمد بن علي بن يحيى، الملقب بهاء الدين؛ الشاعر الكاتب؛ كان متمكناً من مخدومه كثير القدر عنده لا يتوسط إلا بالخير ونفع خلقاً كثيراً بحسن وساطته؛ أول ما قاله من المدح بثغر دمياط سنة خمس وستمائة؛ توجه إلى الموصل رسولاً من جهة مخدومه الملك الصالح؛ وصفه ابن خلكان الذي اجتمع به بالقاهرة بمكارم الأخلاق وكثرة العفة ودماثة السجايا، وأجازه رواية ديوانه وهو كثير الوجود بأيدي الناس {cite:wafayat-ayan}."
  en: "Bahaa al-Din Zuhayr b. Muhammad (b. 581 Mecca, d. 656 Cairo) — poet and secretary in the service of the Ayyubid al-Malik al-Salih; famed for interceding only for good; Ibn Khallikan met him in Cairo and describes his gentle character; died in the epidemic of 656 {cite:wafayat-ayan}."
  es: "Bahaa al-Din Zuhayr b. Muhammad (n. 581 La Meca, m. 656 El Cairo) — poeta y secretario al servicio del ayubí al-Malik al-Salih; famoso por interceder solo por el bien; Ibn Khallikan lo conoció en El Cairo y describe su carácter gentil; murió en la epidemia de 656 {cite:wafayat-ayan}."
  fr: "Bahaa al-Din Zuhayr b. Muhammad (né en 581 à La Mecque, mort en 656 au Caire) — poète et secrétaire au service de l'Ayyoubide al-Malik al-Salih; célèbre pour n'avoir intercédé que pour le bien; Ibn Khallikan l'a rencontré au Caire et décrit son caractère doux; mort lors de l'épidémie de 656 {cite:wafayat-ayan}."
  ur: "بہاء الدین زہیر ب۔ محمد ⁦(پیدائش 581 مکہ، وفات 656 قاہرہ)⁩ - ایوبید الملک الصالح کی خدمت میں شاعر اور سکریٹری؛ صرف بھلائی کے لیے شفاعت کرنے کے لیے مشہور؛ ابن خلیقان نے قاہرہ میں ان سے ملاقات کی اور ان کے نرم کردار کو بیان کیا۔ 656 کی وبا میں وفات پائی۔"
