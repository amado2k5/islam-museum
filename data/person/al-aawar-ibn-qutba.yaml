label: { ar: "الأعور بن قطبة", en: "al-A'war ibn Qutba", fr: "Al-A'war ibn Qutba", es: "al-A'war ibn Qutba", ur: "الاوار ابن قطبہ" }
summary:
  ar: "بارز يوم أغواث من القادسية شهريار سجستان فقتل كل واحد منهما صاحبه، وأثخن فحمل من المعركة فأريح تحت النخلة الوحيدة بين موضع الوقعة وحصن العذيب فقال فيها أيا نخلة بين العذيب فتلعة سقتك الغوادي الداجنات من النخل {cite:muruj-al-dhahab p. 610-613}."
  en: "The duelist who traded deaths with Shahriyar of Sijistan on the day of Aghwath — carried grievously wounded to the lone palm and made his verse on it {cite:muruj-al-dhahab p. 610-613}."
  fr: "Combattant qui tua Shahriyar du Sijistan et fut mortellement blessé par lui le jour d’Aghwath — transporté grièvement blessé jusqu’au palmier solitaire, il y composa son vers {cite:muruj-al-dhahab p. 610-613}."
  es: "El duelista que intercambió muertes con Shahriyar de Sijistan el día de Aghwath, fue llevado gravemente herido a la palmera solitaria y escribió su verso en ella {cite:muruj-al-dhahab p. 610-613}."
  ur: "عروض کے دن سجستان کے شہریار کے ساتھ موت کا سودا کرنے والا جنگجو شدید زخمی ہو کر اکیلی ہتھیلی پر لے گیا اور اس پر اپنی آیت بنائی۔ 610-613}۔"
  tr: "Ağvat günü, Kadisiye'den Şahryar Sicistan birbirleriyle savaştılar ve birbirlerini öldürdüler. Ağır yaralandı ve savaş alanından taşınarak, savaş yeri ile Al-Adhaib kalesi arasındaki tek başına duran hurma ağacının altında dinlendi. Ağaca şöyle dedi: \"Ey Al-Adhaib ile tepe arasındaki hurma ağacı, hurmadan süzülen hafif yağmurlar seni sulasın.\" {kaynak: Muruj-al-dhahab s. 610-613}"
  id: "Pada hari Aghwath, Shahryar Sijistan dari Qadisiyah bertempur dan saling membunuh. Ia terluka parah dan dibawa dari medan perang lalu beristirahat di bawah pohon kurma tunggal di antara lokasi pertempuran dan benteng Al-Adhaib. Ia berkata kepada pohon itu: Wahai pohon kurma di antara Al-Adhaib dan bukit, semoga hujan lembut menyiramimu dari dahan-dahan pohon kurma. {kutipan:muruj-al-dhahab hlm. 610-613}."
