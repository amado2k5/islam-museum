summary:
  ar: "مصلح اجتماعي وعالم وكاتب وصحفي هندي (1873-1932) من فاكوم في مملكة ترافنكور، يُلقَّب بأبي نهضة المسلمين في كيرالا. أسّس صحيفة «سواديشابهیماني» سنة 1905 فصادرتها حكومة ترافنكور سنة 1910، وأصدر مجلات «مسلم» و«الإسلام» و«ديبيكا»، وقاد حركة إصلاح ديني قائمة على القرآن والحديث ونبذ البدع، ودعا إلى تعليم النساء والتعليم الحديث ووحدة المسلمين، فأسّس جمعيات منها «مسلم أيكيا سنغام»."
  en: "Indian social reformer, scholar, writer and journalist (1873–1932) of Vakkom in the Kingdom of Travancore, called the father of the Muslim renaissance in Kerala. He founded the Swadeshabhimani newspaper in 1905, confiscated by the Travancore government in 1910, published the journals Muslim, Al-Islam and Deepika, led a religious reform grounded in the Qur'an and Hadith against innovation, and campaigned for women's and modern education and Muslim unity, helping to found the Muslim Aikya Sangham."
  ur: "ہندوستانی سماجی مصلح، عالم، مصنف اور صحافی (1873ء–1932ء) جن کا تعلق ٹراوانکور کے واکم سے تھا اور جو کیرالا میں مسلم نشاۃ ثانیہ کے بانی کہلاتے ہیں۔ انھوں نے 1905ء میں «سوادیشابھیمانی» اخبار شروع کیا جسے 1910ء میں حکومت نے ضبط کر لیا، «مسلم»، «الاسلام» اور «دیپیکا» رسائل نکالے، قرآن و حدیث پر مبنی اصلاحی تحریک چلائی اور خواتین کی تعلیم اور مسلم اتحاد کی دعوت دی۔"
