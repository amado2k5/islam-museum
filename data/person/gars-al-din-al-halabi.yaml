      ur: "ہائینن کے مطابق غرث الدین الحلبي زوتر کی رائے میں 971ھ میں فوت ہونے والا شامی فلکیات دان ہے، جبکہ TDV مراجع اسے حلب کے شافعی عالم ابن النقیب غرس الدین خلیل الحلبي ⁦(ت 971ھ/1563ء)⁩ سے جانتے ہیں؛ دونوں ناموں کا ربط یہاں غیر ثابت ہے اور علمی قیاس کے طور پر پیش کیا گیا ہے {cite:heinen-islamic-cosmology p. 31} {cite:tdv-ibnun-nakib-el-halebi}۔"
