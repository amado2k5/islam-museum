id: person/gars-al-din-al-halabi
class: person
label: { ar: "غرس الدين بن أحمد بن خليل الحلبي", en: "Gars al-Din ibn Ahmad ibn Khalil al-Halabi", ur: "غرس الدین بن احمد بن خلیل حلبی", es: "Gars al-Din ibn Ahmad ibn Khalil al-Halabi", fr: "Gars al-Din ibn Ahmad ibn Khalil al-Halabi" }
summary:
  ar: "فلكي شامي توفي سنة 971هـ بحسب زوتر، صاحب «تنبيه النقاد على ما في الهيئة المشهورة من الفساد» ⁦(958هـ)⁩ الذي نقد فيه أصولًا بطلمية ونقل عن ابن الشاطر ومؤيد الدين العرضي {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
  en: "Syrian astronomer who died in 971 AH according to Suter, author of Tanbih al-naqqad (958 AH), critiquing Ptolemaic principles and citing Ibn al-Shatir and Mu'ayyad al-Din al-Urdi {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
  ur: "شامی فلکیات دان، زوٹر کے مطابق 971ھ میں فوت، «تنبیہ النقاد» ⁦(958ھ)⁩ کے مصنف جس میں بطلیموسی اصولوں پر تنقید کی اور ابن الشاطر اور مؤید الدین عرضی سے نقل کیا {cite:heinen-islamic-cosmology p. 31}."
  es: "Astrónomo sirio que murió en 971 AH según Suter, autor de Tanbih al-naqqad (958 AH), criticando los principios ptolemaicos y citando a Ibn al-Shatir y Mu'ayyad al-Din al-Urdi {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
  fr: "Astronome syrien décédé en 971 AH selon Suter, auteur de Tanbih al-naqqad (958 AH), critiquant les principes ptolémaïques et citant Ibn al-Shatir et Mu'ayyad al-Din al-Urdi {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
