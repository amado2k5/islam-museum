    summary:
      ar: "ينقل هاينن أن غرس الدين الحلبي فلكي سوري توفي سنة 971هـ بحسب زوتر، بينما تعرفه معاجم TDV بابن النقيب غرس الدين خليل الحلبي الشافعي المتوفى سنة 971هـ/1563م؛ الربط بين الاسمين غير مثبت في هذا السجل ويُعرض كاحتمال بحثي {cite:heinen-islamic-cosmology p. 31} {cite:tdv-ibnun-nakib-el-halebi}."
