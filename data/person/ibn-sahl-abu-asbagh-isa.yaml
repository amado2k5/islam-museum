  fr: "Le juriste et juge malikite Abu al-Asbagh Isa ibn Sahl al-Asadi de Cordoue, connu pour ses responsa sur des cas nouveaux; les premiers biographes ont loué l'étendue de son savoir."
  ur: "مالکی فقیہ اور قرطبہ کے جج ابو الاسباغ عیسیٰ بن سہل الاسدی، جو نئے مقدمات پر اپنے ردعمل کے لیے جانا جاتا ہے۔ ابتدائی سوانح نگاروں نے اس کی تعلیم کی وسعت کی تعریف کی۔"
  tr: "Maliki hukukçusu ve yargıç Ebu el-Esbağ İsa bin Sahl al-Asadi, çağdaş konularda fetvalar vermesiyle ünlüydü ve imamlar onu bol bilgisi ve üstün nitelikleri nedeniyle övmüştür."
  id: "Ahli hukum dan hakim Maliki, Abu al-Asbagh Isa ibn Sahl al-Asadi, terkenal karena mengeluarkan fatwa tentang isu-isu kontemporer, dan para imam memujinya atas pengetahuan yang melimpah dan kualitas luar biasanya."
