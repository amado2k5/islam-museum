  ar: "الفقيه المالكي القرطبي القاضي أبو الأصبغ عيسى بن سهل الأسدي، اشتهر بالفتاوى في النوازل، وأثنى عليه الأئمة بغزارة علمه وحسن خصاله."
  en: "The Maliki jurist and judge Abu al-Asbagh Isa ibn Sahl al-Asadi of Cordoba, known for his responsa on new cases; early biographers praised the breadth of his learning."
