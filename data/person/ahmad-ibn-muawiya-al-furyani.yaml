roles: [mystic, transmitter]
summary:
  ar: "أحمد بن معاوية بن الهذيل أبو جعفر الفريانى، وأخوه الهذيل بن معاوية، كان فاضلًا في التعبد والاتباع والاقتداء بمنهج البدلاء والأولياء، سمعا الحديث من أصحاب الثوري والحسين بن حفص وغيرهما."
  en: "Ahmad ibn Mu'awiya ibn al-Hudhayl, Abu Ja'far al-Furyani, and his brother al-Hudhayl ibn Mu'awiya; excellent in worship, in following and taking as models the way of the substitutes and the friends of God; they heard hadith from the companions of al-Thawri, al-Husayn ibn Hafs and others. He transmitted reports of Ibrahim al-Taymi, of Mutarrif ibn al-Shikhkhir, and of an ascetic, and reports on praising the dead and seeking their forgiveness."
  ur: "احمد بن معاویہ بن ہذیل ابو جعفر فریانی، اور ان کے بھائی ہذیل بن معاویہ، عبادت میں نمایاں اور ابدال و اولیاء کے طریقے کی پیروی اور اقتداء میں ممتاز؛ انہوں نے ثوری کے ساتھیوں، حسین بن حفص اور دوسروں سے حدیث سنی۔ انہوں نے ابراہیم تیمی، مطرف بن شخیر اور ایک زاہد کے اقوال نقل کیے۔"
  es: "Ahmad ibn Mu'awiya ibn al-Hudhayl, Abu Ja'far al-Furyani y su hermano al-Hudhayl ibn Mu'awiya; excelentes en la adoración, siguiendo y tomando como modelo el camino de los sustitutos y los amigos de Dios; escucharon hadices de los compañeros de al-Thawri, al-Husayn ibn Hafs y otros. Transmitió relatos de Ibrahim al-Taymi, de Mutarrif ibn al-Shikhkhir y de un asceta, así como relatos sobre la alabanza a los muertos y la búsqueda de su perdón."
  fr: "Ahmad ibn Mu'awiya ibn al-Hudhayl, Abu Ja'far al-Furyani et son frère al-Hudhayl ibn Mu'awiya, excellents dans l'adoration et pour l'exemple qu'ils donnèrent aux substituts et aux amis de Dieu, reçurent des hadiths des compagnons d'al-Thawri, d'al-Husayn ibn Hafs et d'autres. Il transmit des hadiths d'Ibrahim al-Taymi, de Mutarrif ibn al-Shikhkhir et d'un ascète, ainsi que des hadiths sur la louange des défunts et la recherche de leur pardon."
