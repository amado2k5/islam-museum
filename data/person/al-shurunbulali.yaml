summary:
  ar: "الحسن بن عمار بن علي الشرنبلالي، فقيه حنفي مكثر من التصنيف، نسبته إلى شبرى بلولة بالمنوفية، ونشأ بالقاهرة ودرس بالأزهر، وصار المعول عليه في الفتيا، وتوفي بالقاهرة. من كتبه «نور الإيضاح» في الفقه وشرحه «مراقي الفلاح»، و«غنية ذوي الأحكام»، و«حاشية على درر الحكام» لملا خسرو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
  en: "Al-Hasan ibn Ammar ibn Ali al-Shurunbulali, a prolific Hanafi jurist of Shibra Bilula in Minufiyya, taken as a child to Cairo, where he studied at al-Azhar and became the reference for fatwas. He died in Cairo. His works include Nur al-idah in law and its commentary Maraqi al-falah, Ghunyat dhawi al-ahkam, and a gloss on Mulla Khusraw's Durar al-hukkam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
