summary:
  ar: "الحسن بن عمار بن علي الشرنبلالي، فقيه حنفي مكثر من التصنيف، نسبته إلى شبرى بلولة بالمنوفية، ونشأ بالقاهرة ودرس بالأزهر، وصار المعول عليه في الفتيا، وتوفي بالقاهرة. من كتبه «نور الإيضاح» في الفقه وشرحه «مراقي الفلاح»، و«غنية ذوي الأحكام»، و«حاشية على درر الحكام» لملا خسرو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
  en: "Al-Hasan ibn Ammar ibn Ali al-Shurunbulali, a prolific Hanafi jurist of Shibra Bilula in Minufiyya, taken as a child to Cairo, where he studied at al-Azhar and became the reference for fatwas. He died in Cairo. His works include Nur al-idah in law and its commentary Maraqi al-falah, Ghunyat dhawi al-ahkam, and a gloss on Mulla Khusraw's Durar al-hukkam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
  fr: "Al-Hasan ibn Ammar ibn Ali al-Shurunbulali, un juriste hanafite prolifique de Shibra Bilula dans la Minufiyya, emmené enfant au Caire, où il a étudié à al-Azhar et est devenu la référence pour les fatwas. Il est mort au Caire. Ses œuvres comprennent Nour al-idah en droit et son commentaire Maraqi al-falah, Ghunyat dhawi al-ahkam, et un glose sur Durar al-hukkam de Mulla Khusraw. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
  es: "Al-Hasan ibn Ammar ibn Ali al-Shurunbulali, un prolífico jurista hanafí de Shibra Bilula en Minufiyya, fue llevado cuando era niño a El Cairo, donde estudió en al-Azhar y se convirtió en la referencia de las fatwas. Murió en El Cairo. Sus obras incluyen Nur al-idah in law y su comentario Maraqi al-falah, Ghunyat dhawi al-ahkam y una glosa sobre Durar al-hukkam de Mulla Khusraw. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1629}"
  ur: "الحسن بن عمار بن علی الشعرونبلالی، منوفیہ میں شبرہ بلولا کے ایک مشہور حنفی فقیہ کو بچپن میں قاہرہ لے جایا گیا، جہاں اس نے الازہر میں تعلیم حاصل کی اور فتووں کا حوالہ بنے۔ ان کا انتقال قاہرہ میں ہوا۔ ان کی تصانیف میں نور الاضحیٰ اور اس کی تفسیر مراقی الفلاح، غنیات ذوی الاحکام، اور ملا خسرو کی درار الحکم پر ایک چمک شامل ہیں۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 ص1629}"
  tr: "El-Hasan ibn Ammar ibn Ali el-Şernbalali, Menoufia'da Şubri Balula'ya atfedilen kapsamlı yazılarıyla tanınan bir Hanefi hukukçusuydu. Kahire'de büyüdü, El-Ezher'de eğitim gördü, fetva verme konusunda güvenilir otorite oldu ve Kahire'de öldü. Kitapları arasında 'Nur al-Idah' fıkıh ve tefsiri, 'Maraqi al-Falah', 'Ghaniyya Dhawi al-Ahkam' ve Molla Hüsraw'un 'Haşiyet 'ala Durar al-Hukkam' adlı eserleri bulunmaktadır. {alıntı:Fiqh-Mawsua-Kuwaitiyya-V3 s.1629}"
  id: "Al-Hasan ibn Ammar ibn Ali al-Sharnbalali adalah seorang ahli hukum Hanafi yang dikenal karena tulisan-tulisannya yang luas, yang dikaitkan dengan Shubri Balula di Menoufia. Ia tumbuh besar di Kairo, belajar di Al-Azhar, menjadi otoritas terpercaya dalam mengeluarkan fatwa, dan meninggal di Kairo. Di antara bukunya adalah 'Nur al-Idah' dalam bidang hukum dan komentarnya, 'Maraqi al-Falah,' 'Ghaniyya Dhawi al-Ahkam,' dan 'Hashiyat 'ala Durar al-Hukkam' oleh Mulla Khusraw. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1629}"
