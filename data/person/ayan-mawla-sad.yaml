id: person/ayan-mawla-sad
class: person
label: { ar: "أعين مولى سعد", en: "A'yan, Mawla of Sa'd", es: "A'yan, Mawla of Sa'd", fr: "A'yan, Mawla of Sa'd", ur: "اعیان، سعد کا مولا" }
summary:
  ar: "مولى سعد بن أبي وقاص؛ عند البلاذري نسب إليه حمام أعين بالكوفة وهو الذي أرسله الحجاج بن يوسف إلى عبد الله بن الجارود العبدي من رستقاباذ حين خالف وتابعه الناس على إخراج الحجاج من العراق فقال له حين أدى الرسالة لولا أنك رسول لقتلتك."
  en: "Sa'd ibn Abi Waqqas's mawla; in al-Baladhuri Kufa's Hammam A'yan is named for him — the man al-Hajjaj ibn Yusuf sent to the defecting Abdallah ibn al-Jarud al-Abdi of Rustuqubadh, who answered 'were you not a messenger I'd kill you.'"
  es: "mawla de Sa'd ibn Abi Waqqas; en el Hammam A'yan de al-Baladhuri Kufa lleva su nombre: el hombre que al-Hajjaj ibn Yusuf envió al desertor Abdallah ibn al-Jarud al-Abdi de Rustuqubadh, quien respondió: 'si no fueras un mensajero, te mataría'."
  fr: "Le mawla de Sa'd ibn Abi Waqqas; dans al-Baladhuri Kufa, Hammam A'yan porte son nom - l'homme qu'al-Hajjaj ibn Yusuf a envoyé au transfuge Abdallah ibn al-Jarud al-Abdi de Rustuqubadh, qui a répondu \"si tu n'étais pas un messager, je te tuerais\"."
  ur: "سعد بن ابی وقاص کا مولا؛ البلادوری کوفہ کے حمام اعیان میں اس کا نام ہے - وہ شخص الحجاج ابن یوسف نے رسطوقبد کے منحرف عبداللہ بن جارود العبدی کے پاس بھیجا، جس نے جواب دیا کہ 'اگر تم رسول نہیں ہوتے تو میں تمہیں قتل کر دیتا'۔"
  tr: "Sa'd ibn Ebi Vakqas'ın özgür adamı; el-Baladhuri'ye göre, Hammam 'A'yan Kufe'de ona atfedilmiştir ve o, el-Haccac bin Yusuf tarafından Abdullah ibn al-Jarud al-Abdi'ye Rastaqabadh'dan gönderilmiştir; o karşı çıktığında ve halk da onu takip ederek el-Haccac'ı Irak'tan kovmuştur. Mesajı yerine getirdiğinde ona, 'Sen bir elçi olmasaydın, seni öldürürdüm.' dedi."
  id: "Bekas budak Sa'd ibn Abi Waqqas; menurut al-Baladhuri, Hammam 'A'yan dikaitkan dengannya dalam Kufa, dan dialah yang dikirim oleh al-Hajjaj ibn Yusuf kepada Abdullah ibn al-Jarud al-Abdi dari Rastaqabadh ketika ia menentang dan rakyat mengikutinya mengusir al-Hajjaj dari Irak. Ia berkata kepadanya saat menyampaikan pesan, 'Jika kau bukan utusan, aku akan membunuhmu.'"
