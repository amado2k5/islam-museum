summary: {ar: 'محمد بن محمد بن داود الصنهاجي، أبو عبد الله، ابن آجروم: نحوي صاحب رسالة «الأجرومية»، ولد ومات بفاس ٦٧٢ إلى ٧٢٣ هـ الموافقة ١٢٧٣ إلى ١٣٢٣ م، وله شرح على الشاطبية.', en: 'Muhammad ibn Muhammad ibn Dawud al-Sanhaji, Abu Abd Allah, Ibn Ajurrum: a grammarian famous for the «Ajurrumiyya», born and died in Fez, 672 to 723 AH (1273 to 1323 CE), who also wrote a commentary on al-Shatibiyya.', es: "Muhammad ibn Muhammad ibn Dawud al-Sanhaji, Abu Abd Allah, Ibn Ajurrum: un gramático famoso por el \"Ajurrumiyya\", nacido y muerto en Fez, 672 a 723 AH (1273 a 1323 EC), quien también escribió un comentario sobre al-Shatibiyya.", fr: "Muhammad ibn Muhammad ibn Dawud al-Sanhaji, Abu Abd Allah, Ibn Ajurrum: un grammairien célèbre pour \"Ajurrumiyya\", né et mort à Fès, 672 à 723 AH (1273 à 1323 CE), qui a également écrit un commentaire sur al-Shatibiyya.", ur: "محمد بن محمد بن داؤد السنہجی، ابو عبد اللہ، ابن اجورم: ایک گرامر جو \"اجرومیہ\" کے لیے مشہور ہے، فیز، 672 تا 723 ہجری ⁦(1273 تا 1323 عیسوی)⁩ میں پیدا ہوا اور فوت ہوا، جس نے الشاطبیہ پر ایک تفسیر بھی لکھی۔"}
