summary:
  ar: "مصطفى بن فتح الله الشافعي، الحموي ثم المكي، مؤرخ من أدباء عصره، أصله من حماة، رحل إلى دمشق واليمن واستقر بمكة وتوفي بذمار سنة ١١٢٣هـ، صاحب فوائد الارتحال ونتائج السفر في أخبار أهل القرن الحادي عشر."
  en: "Mustafa ibn Fathallah al-Shafi'i, al-Hamawi and later al-Makki, a historian and literary man of his age whose family came from Hama; he travelled to Damascus and Yemen, settled in Mecca and died at Dhamar in 1123 AH (1711); author of Fawa'id al-Irtihal wa-Natayij al-Safar fi Akhbar Ahl al-Qarn al-Hadi Ashar."
  es: "Mustafa ibn Fathallah al-Shafi'i, al-Hamawi y más tarde al-Makki, un historiador y literato de su época cuya familia procedía de Hama; viajó a Damasco y Yemen, se estableció en La Meca y murió en Dhamar en 1123 d. H. (1711); autor de Fawa'id al-Irtihal wa-Natayij al-Safar fi Akhbar Ahl al-Qarn al-Hadi Ashar."
  fr: "Mustafa ibn Fathallah al-Shafi'i, al-Hamawi et plus tard al-Makki, historien et homme de lettres de son âge dont la famille était originaire de Hama; il voyagea à Damas et au Yémen, s'installa à La Mecque et mourut à Dhamar en 1123 AH (1711); auteur de Fawa'id al-Irtihal wa-Natayij al-Safar fi Akhbar Ahl al-Qarn al-Hadi Ashar."
  ur: "مصطفیٰ بن فتح اللہ الشافعی، الحماوی اور بعد میں المکی، اپنے دور کے ایک مورخ اور ادبی آدمی جن کا خاندان حما سے آیا تھا۔ اس نے دمشق اور یمن کا سفر کیا، مکہ میں سکونت اختیار کی اور 1123 ہجری (1711) میں دمار میں وفات پائی۔ مصنف فوائد الارتحل و نطائج الصفار فی اخبار اہل القرن الہدی اشعر۔"
  tr: "Mustafa ibn Fath Allah al-Shafi'i, el-Hamavi sonra el-Makki, zamanının tarihçisi ve edebi figürlerinden biriydi, aslen Hama'dandı. Şam ve Yemen'e seyahat etti, Mekke'ye yerleşti ve 1123 Hicri yılında Damar'da öldü. 'Fawa'id al-Irtyar wa Na'ta'id al-Safar fi Akhbar Ahl al-Qarn al-Hadi al-'Ashar' adlı eseri kaleme aldı."
  id: "Mustafa ibn Fath Allah al-Shafi'i, al-Hamawi yang kemudian al-Makki, adalah seorang sejarawan dan tokoh sastra pada zamannya, berasal dari Hama. Ia melakukan perjalanan ke Damaskus dan Yaman, menetap di Mekah, dan meninggal di Dhamar pada tahun 1123 H. Ia menulis 'Fawa'id al-Irtyar wa Na'ta'id al-Safar fi Akhbar Ahl al-Qarn al-Hadi al-'Ashar."
