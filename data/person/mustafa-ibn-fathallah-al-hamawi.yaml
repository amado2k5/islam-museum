  ar: "مصطفى بن فتح الله الشافعي، الحموي ثم المكي، مؤرخ من أدباء عصره، أصله من حماة، رحل إلى دمشق واليمن واستقر بمكة وتوفي بذمار سنة ١١٢٣هـ، صاحب فوائد الارتحال ونتائج السفر في أخبار أهل القرن الحادي عشر."
  en: "Mustafa ibn Fathallah al-Shafi'i, al-Hamawi and later al-Makki, a historian and literary man of his age whose family came from Hama; he travelled to Damascus and Yemen, settled in Mecca and died at Dhamar in 1123 AH (1711); author of Fawa'id al-Irtihal wa-Natayij al-Safar fi Akhbar Ahl al-Qarn al-Hadi Ashar."
