summary:
  ar: "خطاط عراقي ⁦(1917–1973)⁩ يُعدّ من أعظم خطاطي القرن العشرين، بلغ القمة في خطي الثلث والنسخ. كتب مصاحف ونقوش مساجد وصمّم عملات عراقية، وألّف «قواعد الخط العربي» الذي صار مرجعًا مدرسيًا، وعُرف بعنايته بضبط الحرف ورسمته."
  en: "Iraqi calligrapher (1917–1973), counted among the greatest calligraphers of the twentieth century, reaching the summit in thuluth and naskh. He wrote Qur'an manuscripts, mosque inscriptions and Iraqi currency designs, and authored Qawa'id al-Khatt al-Arabi (Rules of Arabic Calligraphy), now a standard reference."
  ur: "عراقی خطاط ⁦(1917–1973)⁩ جو بیسویں صدی کے عظیم خطاطوں میں شمار ہیں اور ثلث و نسخ میں کمال کو پہنچے۔ انہوں نے مصاحف، مساجد کے کتبے اور عراقی کرنسی کے ڈیزائن لکھے اور «قواعد الخط العربي» تصنیف کی جو معیاری مرجع بنی؛ وہ حرف کی ضبط و رسمی کے لیے مشہور تھے۔"
