summary:
  ar: "داعية إندونيسي، وُلد في لامبونغ سنة 1981، يدير مدرسة أورا آجي الداخلية في سليمان، واشتهر بالدعوة بين المهمشين وفي الملاهي الليلية، وعُيّن مبعوثا خاصا للرئيس لشؤون التناغم الديني سنة 2024 ثم استقال في العام نفسه."
  en: "Indonesian preacher, born in Lampung in 1981. He leads the Ora Aji Islamic boarding school in Sleman and became known for preaching to marginalised communities and in nightclubs; in 2024 he was appointed the President's Special Envoy for Religious Harmony and resigned the same year."
  ur: "انڈونیشیائی مبلغ، جو 1981 میں لامپونگ میں پیدا ہوئے۔ وہ سلیمان میں اورا آجی دینی بورڈنگ اسکول کے سربراہ ہیں اور پسماندہ طبقوں اور نائٹ کلبوں میں تبلیغ سے مشہور ہوئے؛ 2024 میں وہ صدر کے خصوصی ایلچی برائے مذہبی ہم آہنگی مقرر ہوئے اور اسی سال مستعفی ہو گئے۔"
  es: "Predicador indonesio, nacido en Lampung en 1981. Dirige el internado islámico Ora Aji en Sleman y se hizo conocido por predicar a comunidades marginadas y en clubes nocturnos; en 2024 fue nombrado Enviado Especial del Presidente para la Armonía Religiosa y renunció ese mismo año."
  fr: "Prédicateur indonésien, né à Lampung en 1981. Il dirige l'internat islamique Ora Aji à Sleman et s'est fait connaître pour ses prêches auprès des communautés marginalisées et dans les boîtes de nuit; en 2024, il a été nommé envoyé spécial du président pour l'harmonie religieuse et a démissionné la même année."
  tr: "1981'de Lampung'da doğan Endonezyalı bir vaiz olan Sculen, Sulayman'daki Ora Aji yatılı okulunu yönetiyor, dezavantajlılar arasında ve gece kulüplerinde vaaz vermesiyle tanınıyor, 2024'te cumhurbaşkanına dini uyum için özel elçi olarak atanmış, aynı yıl istifa etmiştir."
  id: "Seorang pendeta Indonesia, lahir di Lampung pada tahun 1981, ia menjalankan sekolah asrama Ora Aji di Sulayman, dikenal karena berkhotbah di kalangan terpinggirkan dan di klub malam, diangkat sebagai utusan khusus presiden untuk harmoni agama pada tahun 2024, lalu mengundurkan diri pada tahun yang sama."
