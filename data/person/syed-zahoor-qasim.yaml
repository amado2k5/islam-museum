summary:
  ar: "عالم أحياء بحرية ومحيطات هندي قاد أول بعثة هندية إلى القارة القطبية الجنوبية سنة 1981 وأشرف على البعثات السبع التالية؛ مدير المعهد المركزي لبحوث المصايد البحرية (1971–1974)، ونائب مستشار جامعة ملية إسلامية (1989–1991)، وعضو لجنة التخطيط الهندية (1991–1996)؛ نال بادما شري (1974) وبادما بهوشان (1982)."
  en: "Indian marine biologist and oceanographer who led India's first expedition to Antarctica in 1981 and guided the seven expeditions that followed; director of the Central Marine Fisheries Research Institute (1971–1974), vice-chancellor of Jamia Millia Islamia (1989–1991) and a member of India's Planning Commission (1991–1996); he received the Padma Shri (1974) and the Padma Bhushan (1982)."
  ur: "ہندوستانی بحری حیاتیات دان اور سمندر شناس جنھوں نے 1981ء میں انٹارکٹیکا کی پہلی ہندوستانی مہم کی قیادت کی اور اگلی سات مہموں کی رہنمائی کی؛ سینٹرل میرین فشریز ریسرچ انسٹی ٹیوٹ کے ڈائریکٹر (1971ء–1974ء)، جامعہ ملیہ اسلامیہ کے وائس چانسلر (1989ء–1991ء) اور بھارت کے پلاننگ کمیشن کے رکن (1991ء–1996ء) رہے؛ انھیں پدم شری (1974ء) اور پدم بھوشن (1982ء) سے نوازا گیا۔"
