summary:
  ar: "طائي؛ كان دليل خالد بن الوليد في مفازته من قراقر إلى سوى حين مسيره من العراق إلى الشام سنة 13هـ، وفيه قال الشاعر: «لله در رافع أنّى اهتدى فوز من قراقر إلى سوى، ماء إذا ما رامه الجيش أنشا ما جازها قبلك من أنسٍ يُرى»."
  en: "A Ta'i; Khalid ibn al-Walid's guide across the waterless stretch from Qaraqir to Suwa on his march from Iraq to Syria in year 13, of whom the poet said: 'God bless Rafi' — how he guided, traversing from Qaraqir to Suwa, a water the army sought and found where no man was seen passing before you'."
  ur: "طائی؛ خالد بن ولید کا رہنما جو عراق سے شام کے سفر میں قراقر سے سوا تک بے پانی راستے میں رہا۔"
