summary:
  ar: "هبة الله بن الحسن بن يوسف المعروف بالبديع الأسترلابي؛ صاحب الترجمة شاعراً مشهوراً وأحد الأدباء الفضلاء، وكان وحيد زمانه في عمل الآلات الفلكية متقناً لهذه الصناعة وحصل له من جهة عملها مال جزيل في خلافة المسترشد، وذكره العماد الكاتب في الخريدة وأثنى عليه وأورد له مقاطيع من شعره، وقال ابن خلّكان كان كثير الخلاعة ظريفاً في جميع حركاته؛ توفي بعلة الفالج سنة ثلاث وثلاثين وخمسمائة ودفن بمقبرة الوردية من بغداد {cite:shadharat-dhahab p. 583-584}."
  en: "Hibatallah ibn al-Hasan, known as al-Badi' al-Asturlabi; a translator, famed poet and eminent littérateur, and the unique master of his age in making astronomical instruments — a craft that earned him a large fortune in al-Mustarshid's caliphate; al-Imad al-Katib praises him in the Kharida, and Ibn Khallikan calls him witty in all his movements though much given to ribaldry; d. of paralysis in 533, buried at Baghdad's Wardiyya cemetery {cite:shadharat-dhahab p. 583-584}."
  fr: "Hibatallah ibn al-Hasan, connu comme al-Badi’ al-Asturlabi ; traducteur, poète célèbre et éminent homme de lettres, maître sans égal en son temps dans la fabrication d’instruments astronomiques — art qui lui valut une grande fortune sous le califat d’al-Mustarshid ; al-Imad al-Katib le loue dans la Kharida, et Ibn Khallikan le décrit comme spirituel dans tous ses mouvements, bien que porté sur la grivoiserie ; mort de paralysie en 533 H, enterré au cimetière Wardiyya de Bagdad {cite:shadharat-dhahab p. 583-584}."
  es: "Hibatallah ibn al-Hasan, conocido como al-Badi' al-Asturlabi; traductor, famoso poeta y eminente literato, y el único maestro de su época en la fabricación de instrumentos astronómicos, un oficio que le reportó una gran fortuna en el califato de al-Mustarshid; al-Imad al-Katib lo elogia en el Kharida, e Ibn Khallikan lo describe como ingenioso en todos sus movimientos, aunque muy dado a la obscenidad; murió de parálisis en 533 y fue enterrado en el cementerio Wardiyya de Bagdad {cite:shadharat-dhahab p. 583-584}."
  ur: "ہیبت اللہ ابن الحسن، جسے البادی الاسترالبی کے نام سے جانا جاتا ہے؛ ایک مترجم، مشہور شاعر اور نامور ادیب، اور فلکیاتی آلات بنانے میں اپنی عمر کا منفرد ماہر - ایک ایسا ہنر جس نے انہیں المسترشد کی خلافت میں بڑی دولت حاصل کی۔ العماد الکاتب نے خریدہ میں اس کی تعریف کی ہے، اور ابن خلیقان اسے اپنی تمام حرکات میں عقلمند کہتا ہے، حالانکہ اس میں بہت کچھ کہا جاتا ہے۔ d 533 میں فالج کا شکار، بغداد کے وردیہ قبرستان میں دفن ہوئے۔ 583-584}۔"
  tr: "Biyografinin konusu olan Hibat Allah ibn al-Hasan ibn Yusuf, diğer adıyla al-Badi' al-Astarlabi, ünlü bir şair ve erdemli edebiyatçılardan biriydi. Astronomi aletleri alanındaki çalışmalarıyla kendi döneminde eşsizdi, bu alanda uzmandı ve al-Mustarshid halifeliği döneminde bu çalışmalarından büyük miktarda para kazandı. Al-Imad al-Katib, al-Kharida adlı eserinde ondan bahsetmiş, onu övmüş ve şiirlerinden alıntılar yapmıştır. İbn Hallikan, onun her hareketinde çok ahlaksız ve zeki olduğunu söylemiştir. Hicri 533 yılında felç geçirerek vefat etmiş ve Bağdat'taki al-Wardiya mezarlığına defnedilmiştir. {kaynak:shadharat-dhahab s. 583-584}"
  id: "Hibat Allah ibn al-Hasan ibn Yusuf, yang dikenal sebagai al-Badi’ al-Astarlabi, tokoh biografi ini, adalah seorang penyair terkenal dan salah satu sastrawan yang berbudi luhur. Ia unik pada zamannya dalam bidang instrumen astronomi, mahir dalam keahlian ini, dan memperoleh banyak uang dari pekerjaannya selama kekhalifahan al-Mustarshid. Al-Imad al-Katib menyebutkannya dalam al-Kharida dan memujinya serta mengutip beberapa bagian puisinya. Ibn Khallikan mengatakan bahwa ia sangat bejat dan cerdas dalam semua tingkah lakunya. Ia meninggal karena stroke pada tahun 533 H dan dimakamkan di pemakaman al-Wardiya di Baghdad. {cite:shadharat-dhahab hlm. 583-584}."
