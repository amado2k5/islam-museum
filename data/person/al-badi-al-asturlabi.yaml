summary:
  ar: "هبة الله بن الحسن بن يوسف المعروف بالبديع الأسترلابي؛ صاحب الترجمة شاعراً مشهوراً وأحد الأدباء الفضلاء، وكان وحيد زمانه في عمل الآلات الفلكية متقناً لهذه الصناعة وحصل له من جهة عملها مال جزيل في خلافة المسترشد، وذكره العماد الكاتب في الخريدة وأثنى عليه وأورد له مقاطيع من شعره، وقال ابن خلّكان كان كثير الخلاعة ظريفاً في جميع حركاته؛ توفي بعلة الفالج سنة ثلاث وثلاثين وخمسمائة ودفن بمقبرة الوردية من بغداد {cite:shadharat-dhahab p. 583-584}."
  en: "Hibatallah ibn al-Hasan, known as al-Badi' al-Asturlabi; a translator, famed poet and eminent littérateur, and the unique master of his age in making astronomical instruments — a craft that earned him a large fortune in al-Mustarshid's caliphate; al-Imad al-Katib praises him in the Kharida, and Ibn Khallikan calls him witty in all his movements though much given to ribaldry; d. of paralysis in 533, buried at Baghdad's Wardiyya cemetery {cite:shadharat-dhahab p. 583-584}."
