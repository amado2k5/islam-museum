summary:
  ar: "سياسي صومالي (1908–2007) من بلد وين، قيادي في رابطة الشباب الصومالية ورئيس الجمعية التشريعية، صار أول رئيس للصومال عند الاستقلال (1 يوليو 1960 – 1967) ثم خسر انتخابات 1967 وسلم السلطة سلميا لخلفه المنتخب عبد الرشيد علي شرماركي — أول رئيس أفريقي يتنازل طوعا بعد خسارة انتخابية — ومات في نيروبي عن 98 عاما."
  en: "Somali politician (1908–2007) from Beledweyne, a leader of the Somali Youth League and speaker of the Legislative Assembly who became the first president of Somalia at independence (1 July 1960 – 1967), then lost the 1967 election and peacefully handed power to his elected successor Abdirashid Ali Shermarke — the first African president to give up office voluntarily after an electoral defeat — and died in Nairobi aged 98."
  ur: "صومالی سیاست دان (1908ء–2007ء) جن کا تعلق بلدوین سے تھا؛ صومالی یوتھ لیگ کے رہنما اور قانون ساز اسمبلی کے اسپیکر، آزادی پر صومالیہ کے پہلے صدر بنے (1 جولائی 1960ء – 1967ء)، پھر 1967ء کا انتخاب ہار کر اقتدار پُرامن طور پر منتخب جانشین عبدالرشید علی شرمارکی کے حوالے کر دیا — انتخابی شکست کے بعد رضاکارانہ طور پر عہدہ چھوڑنے والے پہلے افریقی صدر — اور 98 برس کی عمر میں نیروبی میں وفات پائی۔"
