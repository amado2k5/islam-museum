label: { ar: "غياث الدين الغوري", en: "Ghiyath al-Din Muhammad ibn Sam", es: "Ghiyath al-Din Muhammad ibn Sam", fr: "Ghiyath al-Din Muhammad ibn Sam", ur: "غیاث الدین محمد بن سام" }
summary:
  ar: "غياث الدين أبو الفتح محمد بن سام الغوري صاحب غزنة وبعض خراسان؛ يصفه ابن الأثير بأنه كان مظفراً منصوراً في حروبه لم تهزم له راية قط، قليل المباشرة للقتال وله دهاء ومكر، جواداً كثير الصدقات والأوقاف بخراسان بنى المساجد والمدارس لأصحاب الشافعي والخانكاهات في الطرق وأسقط المكوس؛ أكرم الفقيه فخر الدين الرازي وبالغ في إكرامه وبنى له مدرسة بهراة بالقرب من الجامع، وحضر مناظرته مع الكرامية بفيروزكوه سنة خمس وتسعين وخمسمائة؛ توفي في جمادى الأولى سنة تسع وتسعين وخمسمائة وأخفيت وفاته حتى وصل أخوه شهاب الدين إلى هراة فأظهرها في رجب، وخلفه ابنه محمود الذي لُقّب غياث الدين {cite:kamil-ibn-al-athir p. 262، 282}."
  en: "Abu al-Fath Muhammad ibn Sam al-Ghuri, sultan of Ghazna and much of Khurasan — Ibn al-Athir credits him with a never-defeated standard, rule by stratagem rather than personal combat, abolition of the mukus tolls, and madrasas and khanqahs across Khurasan; patron of Fakhr al-Din al-Razi at Herat and host of the Firuzkuh debate (595); died Jumada I 599, his death concealed until his brother Shihab al-Din reached Herat {cite:kamil-ibn-al-athir p. 262, 282}."
  es: "Abu al-Fath Muhammad ibn Sam al-Ghuri, sultán de Ghazna y gran parte de Jorasán — Ibn al-Athir le atribuye un estandarte invicto, el gobierno mediante estratagemas en lugar de combates personales, la abolición de los peajes mukus y madrasas y khanqahs en todo Jorasán; mecenas de Fakhr al-Din al-Razi en Herat y anfitrión del debate de Firuzkuh (595); murió en Jumada I de 599, su muerte se mantuvo oculta hasta que su hermano Shihab al-Din llegó a Herat {cite:kamil-ibn-al-athir p. 262, 282}."
  fr: "Abu al-Fath Muhammad ibn Sam al-Ghuri, sultan de Ghazna et d'une grande partie du Khorasan — Ibn al-Athir lui attribue un étendard jamais vaincu, un gouvernement par la ruse plutôt que par le combat personnel, l'abolition des péages mukus, et des madrasas et khanqahs à travers le Khorasan; protecteur de Fakhr al-Din al-Razi à Hérat et hôte du débat de Firuzkuh (595); mort en Jumada I 599, sa mort étant cachée jusqu'à ce que son frère Shihab al-Din atteigne Hérat {cite:kamil-ibn-al-athir p. 262, 282}."
  ur: "ابو الفتح محمد بن سام الثوری، غزنہ اور خراسان کے زیادہ تر سلطان - ابن الثیر نے اسے کبھی شکست نہ ہونے والا معیار، ذاتی لڑائی کے بجائے حکمت عملی کے ذریعے حکمرانی، مکس ٹولوں کا خاتمہ، اور پورے خراسان میں مدارس اور خانقاہوں کا سہرا دیا۔ ہرات میں فخر الدین الرازی کا سرپرست اور فیروزکوہ بحث کا میزبان (595)؛ جمادی الاول 599 میں وفات پائی، اس کی موت اس وقت تک چھپی رہی جب تک کہ اس کا بھائی شہاب الدین ہرات نہ پہنچا۔ 262، 282}۔"
  tr: "Ghiyath al-Din Ebu el-Feth Muhammed bin Sam el-Guri, Gazni ve Horasan'ın bazı bölgelerinin hükümdarı; İbn el-Athir, onu savaşlarında zafer kazanmış ve hiçbir bayrağın yenilmediği savaşlarda zafer kazanmış, nadiren savaşan biri olarak tanımlar; kurnaz ve kurnaz, Hırasan'da sadaka ve bağışlarda cömert olan, Şafii takipçileri için camiler ve okullar inşa eden ve yollarda hankalar inşa eden, vergileri kaldıran biri olarak tanımlar. O Fıhrüddin el-Razi'yi onurlandırdı ve büyük bir onurlandırma yaptı, caminin yakınında Harat'ta bir okul inşa etti, 595 Hicri yılında Firuzkuh'da Karamiyye ile münazarasına katıldı, 599 Hicr yılı'nda Cumed-Avval'da öldü ve ölümü, kardeşi Şihab Din Herat'a gelene kadar gizli tutuldu; burada Recep'te atandı. Yerine oğlu Mahmud geçti; ona Ghiyath al-Din lakabı verildi {alıntı:) Kamil-ibn-al-Athir s. 262, 282}."
  id: "Ghiyath al-Din Abu al-Fath Muhammad ibn Sam al-Ghouri, penguasa Ghazni dan beberapa bagian Khorasan; Ibn al-Athir menggambarkannya sebagai pemenang dan pemenang dalam perang-perangnya di mana tidak ada panji yang pernah dikalahkan, jarang terlibat dalam pertempuran, licik dan licik, murah hati dalam amal dan wakaf di Khorasan, membangun masjid dan sekolah untuk para pengikut al-Shafi'i dan khanqah di jalan-jalan, serta menghapus pajak. Ia menghormati ahli hukum Fakhr al-Din al-Razi dan sangat menghormatinya, membangun sebuah sekolah di Harat dekat masjid, menghadiri debat dengan Karamiyya di Firuzkuh pada tahun 595 H, meninggal di Jumada al-Awwal 599 H, dan kematiannya disembunyikan sampai saudaranya Shihab al-Din tiba di Herat, di mana ia diangkat di Rajab. Ia digantikan oleh putranya Mahmoud, yang dijuluki Ghiyath al-Din {cite:Kamil-ibn-al-Athir hlm. 262, 282}."
