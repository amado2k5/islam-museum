summary:
  ar: "حمزة بن أحمد بن علي بن محمد بن العباس، الحسيني، الدمشقي، الشافعي، فقيه ومؤرخ وحافظ، حفظ القرآن والتنبيه، وأخذ الفقه عن ابن قاضي شهبة، وكان فاضلا متواضعا. من تصانيفه: الإيضاح على تحرير التنبيه للنووي، وبقايا الخبايا، وهو استدراك على خبايا الزوايا للزركشي في فروع الفقه الشافعي، وفضائل بيت المقدس. ذكرته الموسوعة بين سنتي 818 و874هـ، والتاريخ مرتب في المصدر بهذا الترتيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
  en: "Hamza ibn Ahmad ibn 'Ali ibn Muhammad ibn al-'Abbas al-Husayni of Damascus, a Shafi'i jurist, historian and memoriser who learned the Quran and al-Tanbih by heart and studied law under Ibn Qadi Shuhba; a modest and well-read man. His works include a commentary on al-Nawawi's edition of al-Tanbih, Baqaya al-Khabaya (a supplement to al-Zarkashi's Khabaya al-Zawaya on Shafi'i law) and a book on the merits of Jerusalem. The source gives his dates as 818 to 874 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
  es: "Hamza ibn Ahmad ibn 'Ali ibn Muhammad ibn al-'Abbas al-Husayni de Damasco, jurista shafi'í, historiador y memorizador que aprendió de memoria el Corán y al-Tanbih y estudió derecho con Ibn Qadi Shuhba; un hombre modesto y culto. Entre sus obras se incluyen un comentario sobre la edición de al-Nawawi de al-Tanbih, Baqaya al-Khabaya (un suplemento a Khabaya al-Zawaya de al-Zarkashi sobre derecho shafi'í) y un libro sobre los méritos de Jerusalén. La fuente indica que vivió entre 818 y 874 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
  fr: "Hamza ibn Ahmad ibn 'Ali ibn Muhammad ibn al-'Abbas al-Husayni de Damas, juriste, historien et mémorisateur chaféite, apprit le Coran et le Tanbih par cœur et étudia le droit auprès d'Ibn Qadi Shuhba. Homme modeste et érudit, il est l'auteur d'un commentaire de l'édition du Tanbih par al-Nawawi, de la Baqaya al-Khabaya (un supplément à la Khabaya al-Zawaya d'al-Zarkashi sur le droit chaféite) et d'un ouvrage sur les mérites de Jérusalem. La source situe sa vie entre 818 et 874 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
  ur: "دمشق کے حمزہ بن احمد بن علی بن محمد بن العباس الحسینی، ایک شافعی فقیہ، مؤرخ اور حافظ جنہوں نے قرآن اور التنبیح کو دل سے سیکھا اور ابن قدی شعبہ کے تحت قانون کی تعلیم حاصل کی۔ ایک معمولی اور پڑھا لکھا آدمی۔ ان کے کاموں میں النووی کے التنبیح کے ایڈیشن پر تفسیر، بقایا الخبایہ ⁦(الزرکشی کی شافعی قانون پر خبایہ الزاویہ کا ایک ضمیمہ)⁩ اور یروشلم کی خوبیوں پر ایک کتاب شامل ہے۔ ماخذ اس کی تاریخیں 818 تا 874 ہجری بتاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص10354}"
