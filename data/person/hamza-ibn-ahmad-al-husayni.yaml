label: { ar: "حمزة بن أحمد الحسيني", en: "Hamza ibn Ahmad al-Husayni" }
summary:
  ar: "حمزة بن أحمد بن علي بن محمد بن العباس، الحسيني، الدمشقي، الشافعي، فقيه ومؤرخ وحافظ، حفظ القرآن والتنبيه، وأخذ الفقه عن ابن قاضي شهبة، وكان فاضلا متواضعا. من تصانيفه: الإيضاح على تحرير التنبيه للنووي، وبقايا الخبايا، وهو استدراك على خبايا الزوايا للزركشي في فروع الفقه الشافعي، وفضائل بيت المقدس. ذكرته الموسوعة بين سنتي 818 و874هـ، والتاريخ مرتب في المصدر بهذا الترتيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
  en: "Hamza ibn Ahmad ibn 'Ali ibn Muhammad ibn al-'Abbas al-Husayni of Damascus, a Shafi'i jurist, historian and memoriser who learned the Quran and al-Tanbih by heart and studied law under Ibn Qadi Shuhba; a modest and well-read man. His works include a commentary on al-Nawawi's edition of al-Tanbih, Baqaya al-Khabaya (a supplement to al-Zarkashi's Khabaya al-Zawaya on Shafi'i law) and a book on the merits of Jerusalem. The source gives his dates as 818 to 874 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10354}"
