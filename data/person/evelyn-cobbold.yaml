summary:
  ar: "أرستقراطية وكاتبة اسكتلندية (1867-1963) نشأت في الجزائر والقاهرة، أكدت إسلامها بحلول سنة 1915 واتخذت اسم زينب، وفي 1933 أصبحت أول امرأة مسلمة مولودة في بريطانيا تؤدي فريضة الحج، ودونت رحلتها في كتاب «الحج إلى مكة» (1934)."
  en: "Scottish aristocrat and writer (1867-1963) raised partly in Algiers and Cairo who affirmed her Islam by 1915, taking the name Zainab; in 1933 she became the first British-born Muslim woman to perform the Hajj, recording it in Pilgrimage to Mecca (1934)."
  ur: "اسکاٹش اشرافیہ خاتون اور مصنفہ (1867ء–1963ء) جن کی پرورش جزائر اور قاہرہ میں ہوئی؛ 1915ء تک اسلام کی تصدیق کر کے زینب نام اختیار کیا، اور 1933ء میں برطانیہ میں پیدا ہونے والی پہلی مسلمان خاتون بنیں جنہوں نے حج ادا کیا، جسے انہوں نے «حجِ مکہ» (1934ء) میں قلم بند کیا۔"
