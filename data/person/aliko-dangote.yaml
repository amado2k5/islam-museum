summary:
  ar: رجل أعمال نيجيري، وُلد سنة 1957؛ مؤسس ورئيس مجموعة دانغوتي، أكبر تكتل صناعي في غرب أفريقيا — إسمنت وسكر ودقيق ومصفاة نفط عملاقة — وأغنى رجل في أفريقيا لأكثر من عقد.
  en: Nigerian businessman, born 1957; founder and chairman of the Dangote Group, West Africa's largest industrial conglomerate — cement, sugar, flour and a giant oil refinery — and Africa's richest man
    for over a decade.
  ur: نائیجیریائی کاروباری شخصیت، پیدائش 1957؛ دانگوتے گروپ کے بانی و چیئرمین، مغربی افریقہ کا سب سے بڑا صنعتی گروپ — سیمنٹ، چینی، آٹا اور ایک عظیم تیل ریفائنری — اور ایک دہائی سے زیادہ عرصہ افریقہ کے سب
    سے امیر شخص۔
  es: "Empresario nigeriano, nacido en 1957; fundador y presidente del Grupo Dangote, el mayor conglomerado industrial de África Occidental —cemento, azúcar, harina y una gigantesca refinería de petróleo— y el hombre más rico de África durante más de una década."
  fr: "Homme d'affaires nigérian, né en 1957; fondateur et président du groupe Dangote, le plus grand conglomérat industriel d'Afrique de l'Ouest — ciment, sucre, farine et une gigantesque raffinerie de pétrole — et homme le plus riche d'Afrique pendant plus d'une décennie."
