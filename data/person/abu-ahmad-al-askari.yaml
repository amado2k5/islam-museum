summary:
  ar: "الحسن بن عبد الله بن سعيد بن إسماعيل العسكري، أبو أحمد: فقيه أديب، انتهت إليه رياسة التحديث والإملاء والتدريس في خوزستان، ولد في عسكر مكرم وتوفي سنة 382هـ، وهو خال أبي هلال العسكري وأستاذه؛ من كتبه «التفضيل بين بلاغتي العرب والعجم»."
  en: "Al-Hasan ibn Abdallah ibn Sa'id ibn Isma'il al-Askari, Abu Ahmad: a jurist and man of letters who held the headship of hadith transmission, dictation and teaching in Khuzistan; born at Askar Mukram, died 382 AH; maternal uncle and teacher of Abu Hilal al-Askari; author of «al-Tafdil bayna balaghati al-Arab wa-l-Ajam»."
