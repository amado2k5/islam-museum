summary:
  ar: "عميد سوري في الحرس الجمهوري وابن وزير الدفاع الأسبق مصطفى طلاس، كان من الحلقة المقربة من بشار الأسد قبل أن ينشق في يوليو 2012 ويعلن دعمه للمعارضة، فكان أول قائد في الحرس الجمهوري ينشق عن الجيش السوري."
  en: "Syrian Republican Guard brigadier general and son of former defence minister Mustafa Tlass. A member of Bashar al-Assad's inner circle, he defected in July 2012 and declared support for the opposition, the first Republican Guard commander to do so."
  ur: "شامی ریپبلکن گارڈ کے بریگیڈیئر جنرل اور سابق وزیر دفاع مصطفى طلاس کے بیٹے۔ بشار الاسد کے قریبی حلقے کے رکن تھے، جولائی 2012 میں منحرف ہو کر حزب اختلاف کی حمایت کا اعلان کیا؛ وہ ایسا کرنے والے ریپبلکن گارڈ کے پہلے کمانڈر تھے۔"
  es: "General de brigada de la Guardia Republicana Siria e hijo del exministro de Defensa Mustafa Tlass. Miembro del círculo íntimo de Bashar al-Assad, desertó en julio de 2012 y declaró su apoyo a la oposición, siendo el primer comandante de la Guardia Republicana en hacerlo."
  fr: "Le général de brigade Mustafa Tlass, commandant de la Garde républicaine syrienne et fils de l'ancien ministre de la Défense, était membre du cercle restreint de Bachar al-Assad. Il a fait défection en juillet 2012 et a déclaré son soutien à l'opposition, devenant ainsi le premier commandant de la Garde républicaine à le faire."
