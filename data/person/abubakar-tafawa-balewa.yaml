summary:
  ar: "سياسي نيجيري (1912–1966) من مقاطعة باوتشي، عمل معلّما ومدير مدرسة وكتب رواية «شايحو عمر» (1934)، ثم صار نائبا ووزيرا، فأول رئيس وزراء لنيجيريا عند استقلالها سنة 1960 ووحيد من حمل هذا المنصب. اغتيل في انقلاب 15 يناير 1966 ووُجدت جثته قرب لاغوس فدُفن في باوتشي."
  en: "Nigerian politician (1912–1966) from Bauchi province who worked as a teacher and headmaster and wrote the novella Shaihu Umar (1934), then became a legislator and minister, and at independence in 1960 Nigeria's first — and only — prime minister. He was murdered in the coup of 15 January 1966; his body was found near Lagos and he was buried in Bauchi."
  ur: "نائجریائی سیاست دان (1912ء–1966ء)، صوبہ باوچی سے تعلق؛ مدرس اور ہیڈ ماسٹر رہے اور ناولٹ ’شایہو عمر‘ (1934ء) لکھا، پھر رکنِ اسمبلی اور وزیر بنے، اور 1960 میں آزادی کے وقت نائجریا کے پہلے — اور واحد — وزیرِ اعظم مقرر ہوئے۔ 15 جنوری 1966 کی بغاوت میں قتل ہوئے؛ لاش لاگوس کے قریب ملی اور باوچی میں دفن ہوئے۔"
