summary:
  ar: "شهاب الدين أحمد التلعفري الدمشقي الشافعي الشهير بابن الموجج، ولد في ربيع الأول سنة إحدى أو اثنتين وأربعين وثمانمائة، وكان له خط حسن كتب به كثيراً، وكان مهيباً عند الملوك والأمراء وله كرم وافر وسفاطه من أفخر الأطعمة يأكل منه الخاص والعام حتى نائب دمشق وقاضيها، وكانت له كلمة نافذة يأوي إليه كل مظلوم، وكان قد جزّأ الليل ثلاثة أثلاث: ثلثاً للسمر والكتابة وثلثاً للنوم وثلثاً للتهجد والتلاوة، وتردد إليه أكابر الناس العلماء والأمراء خصوصاً شيخ الإسلام زين الدين خطاب، وانتهت إليه الرياسة والسيادة بالشام، ووجه إليه السلطان قايتباي خطابة القدس وهو بمصر فقبلها ثم نزل عنها لبعض المقادسة لما رأى من شدة عنايتهم بطلبها؛ توفي بدمشق يوم السبت ثالث عشر ربيع الأول سنة اثنتي عشرة وتسعمائة ودُفن قبلي قبر الشيخ تقي الدين الحصني {cite:shadharat-dhahab p. 465}."
  en: "Damascus's last-word dignitary — 'his word carried, every wronged man sheltered with him', his table fed commoner and governor alike; he split the night in thirds: company and copying, sleep, and tahajjud with recitation; Qaytbay sent him Jerusalem's khitaba while he was in Egypt — he accepted then yielded it to a Jerusalemites' eager rival; d. Saturday 13 Rabi' I 912, buried beside Taqi al-Din al-Hisni {cite:shadharat-dhahab p. 465}."
