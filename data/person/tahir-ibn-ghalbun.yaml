summary:
  ar: "أبو الحسن طاهر بن عبد المنعم بن غلبون الحلبي، نزيل مصر وصاحب «التذكرة في القراءات الثمان»؛ توفي بمصر لعشر مضين من ذي القعدة سنة 399هـ، وهو ابن المقرئ أبي الطيب عبد المنعم بن غلبون {cite:nashr-dahman-damascus-1345-v1 p. 82}."
  en: "Abu al-Hasan Tahir ibn 'Abd al-Mun'im ibn Ghalbun al-Halabi, a native of Aleppo who settled in Egypt and author of al-Tadhkira fi al-Qira'at al-Thaman; he died in Egypt on the tenth of Dhu al-Qa'da 399 AH, and was the son of the reader Abu al-Tayyib 'Abd al-Mun'im ibn Ghalbun {cite:nashr-dahman-damascus-1345-v1 p. 82}."
  ur: "ابو الحسن طاہر بن عبد المنعم بن غلبون حلبی، مصر میں آ بسنے والے اور «التذکرہ فی القراءات الثمان» کے مصنف؛ مصر میں 10 ذی القعدہ 399ھ کو فوت ہوئے؛ وہ مقرئ ابو الطیب عبد المنعم بن غلبون کے بیٹے تھے {cite:nashr-dahman-damascus-1345-v1 p. 82}."
  es: "Abu al-Hasan Tahir ibn 'Abd al-Mun'im ibn Ghalbun al-Halabi, natural de Alepo que se estableció en Egipto y autor de al-Tadhkira fi al-Qira'at al-Thaman; murió en Egipto el diez de Dhu al-Qa'da 399 AH, y era hijo del lector Abu al-Tayyib 'Abd al-Mun'im ibn Ghalbun {cita:nashr-dahman-damascus-1345-v1 p. 82}."
  fr: "Abu al-Hasan Tahir ibn 'Abd al-Mun'im ibn Ghalbun al-Halabi, originaire d'Alep installé en Égypte et auteur d'al-Tadhkira fi al-Qira'at al-Thaman; il mourut en Égypte le dixième Dhu al-Qa'da 399 AH, et était le fils du lecteur Abu al-Tayyib 'Abd al-Mun'im ibn Ghalbun {cite:nashr-dahman-damascus-1345-v1 p. 82}."
