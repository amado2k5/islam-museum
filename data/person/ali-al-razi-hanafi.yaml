summary:
  ar: "علي الرازي، من أقران محمد بن شجاع، وكان عارفاً بمذهب أصحابنا، أي الحنفية كما يقتضيه السياق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} قال الصيمري إنه طعن على مسائل من الجامع ومن الأصول مع ورع وزهد وسخاء وإفضال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} أخذ الفقه عن الحسن بن زياد، وروى عن محمد وأبي يوسف، وله كتاب في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وعدّه صاحب الهداية من أولى طبقات المقلّدين، وهم أصحاب الترجيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} والمصادر المذكورة: الجواهر المضية، والفوائد البهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وفي رأس الترجمة تاريخ مكتوب بصيغة «٢ - قريباً من ٢٦٦ هجرية»، والرقم الأول غير واضح في المسح."
  en: "Ali al-Razi, a contemporary of Muhammad ibn Shuja', who knew the doctrine of 'our companions' (that is, the Hanafis, as the context implies). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Saymari says that he criticised questions in al-Jami' and in the principles, and was known for piety, asceticism, generosity and bounty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} He studied fiqh under al-Hasan ibn Ziyad, transmitted from Muhammad and Abu Yusuf, and wrote a book on prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The author of al-Hidaya counted him among the first rank of those who follow and yet weigh opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The sources cited are al-Jawahir al-mudiyya and al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The heading gives a date close to 266 AH, and its first figure is not clear in the scan."
  fr: "Ali al-Razi, un contemporain de Muhammad ibn Shuja', qui connaissait la doctrine de 'nos compagnons' (c'est-à-dire les Hanafis, comme le contexte l'implique). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Saymari dit qu'il a critiqué les questions dans al-Jami et dans les principes, et était connu pour la piété, l'ascétisme, la générosité et la générosité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Il a étudié le fiqh sous al-Hasan ibn Ziyad, transmis par Muhammad et Abu Yusuf, et a écrit un livre sur la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} L’auteur d’al-Hidaya le compte parmi les premiers de ceux qui suivent et pourtant pèsent les opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Les sources citées sont al-Jawahir al-mudiyya et al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Le titre donne une date proche de 266 de l’hégire, et sa première figure n'est pas claire dans le scan."
  es: "Ali al-Razi, contemporáneo de Muhammad ibn Shuja', conocía la doctrina de 'nuestros compañeros' (es decir, los Hanafi, como implica el contexto). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Saymari dice que criticó cuestiones en al-Jami' y en los principios, y era conocido por su piedad, ascetismo, generosidad y bondad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Estudió fiqh con al-Hasan ibn Ziyad, transmitido por Muhammad y Abu Yusuf, y escribió un libro sobre la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} El autor de al-Hidaya lo contó entre el primer rango de aquellos que siguen y a la vez sopesan opiniones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Las fuentes citadas son al-Jawahir al-mudiyya y al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} El encabezado da una fecha cercana al 266 AH, y su primera cifra no es clara en el escaneo."
  ur: "علی الرازی، محمد بن شجاع کے ہم عصر، جو 'ہمارے اصحاب' کے عقیدہ کو جانتے تھے ⁦(یعنی احناف، جیسا کہ سیاق و سباق سے ظاہر ہوتا ہے)⁩۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17709} السامری کہتے ہیں کہ وہ الجامع اور اصول میں سوالات پر تنقید کرتے تھے اور تقویٰ، پرہیزگاری، سخاوت اور فضل کے لیے مشہور تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17709} انہوں نے حسن بن زیاد کے ماتحت فقہ کی تعلیم حاصل کی، جو محمد اور ابو یوسف سے منقول ہے، اور نماز پر ایک کتاب لکھی۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17709} الہدایہ کے مصنف نے ان کا شمار ان لوگوں میں اولین درجے میں کیا ہے جو رائے کی پیروی کرتے ہیں اور پھر بھی ان کا وزن کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17709} جن ذرائع کا حوالہ دیا گیا ہے وہ الجواہر المدیہ اور الفوائد البحیہ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17709} سرخی 266 ہجری کے قریب کی تاریخ بتاتی ہے اور اسکین میں اس کا پہلا نمبر واضح نہیں ہے۔"
