summary:
  ar: "علي الرازي، من أقران محمد بن شجاع، وكان عارفاً بمذهب أصحابنا، أي الحنفية كما يقتضيه السياق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} قال الصيمري إنه طعن على مسائل من الجامع ومن الأصول مع ورع وزهد وسخاء وإفضال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} أخذ الفقه عن الحسن بن زياد، وروى عن محمد وأبي يوسف، وله كتاب في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وعدّه صاحب الهداية من أولى طبقات المقلّدين، وهم أصحاب الترجيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} والمصادر المذكورة: الجواهر المضية، والفوائد البهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وفي رأس الترجمة تاريخ مكتوب بصيغة «٢ - قريباً من ٢٦٦ هجرية»، والرقم الأول غير واضح في المسح."
  en: "Ali al-Razi, a contemporary of Muhammad ibn Shuja', who knew the doctrine of 'our companions' (that is, the Hanafis, as the context implies). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Saymari says that he criticised questions in al-Jami' and in the principles, and was known for piety, asceticism, generosity and bounty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} He studied fiqh under al-Hasan ibn Ziyad, transmitted from Muhammad and Abu Yusuf, and wrote a book on prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The author of al-Hidaya counted him among the first rank of those who follow and yet weigh opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The sources cited are al-Jawahir al-mudiyya and al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The heading gives a date close to 266 AH, and its first figure is not clear in the scan."
