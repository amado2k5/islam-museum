summary:
  ar: "شمس الدين محمد بن أحمد الفرياني نسبة إلى فريانة قرية قرب مفاقس المغربي توجه سنة ثمان وأربعين وثمان مئة إلى جبال حميدة بالأرض المقدسة وهي جبال شاهقة صعبة المرتقى ليس لها مسلك يسع أكثر من واحد وبأعلى جبل منها سهلة بها مزدرع وعيون ماء وكروم وأقوام في غاية المنعة والقوة من التجأ إليهم أمن ولو حارب به السلطان فمن دونه فنزل الفرياني عندهم وادعى أنه المهدي وقيل ادعى أنه القحطاني وراج أمره هناك وكان قدم القاهرة وأكثر التردد إلى المقريزي وواظب الجولان في قرى الريف الأدنى يعمل المواعظ ويذكر الناس وكان يستحضر كثيراً من التواريخ والأخبار الماضية ويدعي معرفة الحديث النبوي ورجاله وتحول عن مذهب مالك وادعى أنه يقلد الشافعي وولي قضاء نابلس إلى أن ظهر منه ما ظهر {cite:shadharat-dhahab p. 261-262}."
  en: "Shams al-Din Muhammad al-Firyani of the Maghreb — a wandering preacher who frequented al-Maqrizi in Cairo, recited histories and prophetic reports from memory, claimed Shafi'i allegiance after Malikism, and held the judgeship of Nablus — then withdrew in 848 to the impregnable Hamida mountains of the Holy Land, whose heights had fields, springs and vines and a folk so secure that none below the sultan could war on them, and there proclaimed himself the Mahdi — some said the Qahtani — and his cause flourished {cite:shadharat-dhahab p. 261-262}."
