summary:
  ar: "شمس الدين محمد بن أحمد الفرياني نسبة إلى فريانة قرية قرب مفاقس المغربي توجه سنة ثمان وأربعين وثمان مئة إلى جبال حميدة بالأرض المقدسة وهي جبال شاهقة صعبة المرتقى ليس لها مسلك يسع أكثر من واحد وبأعلى جبل منها سهلة بها مزدرع وعيون ماء وكروم وأقوام في غاية المنعة والقوة من التجأ إليهم أمن ولو حارب به السلطان فمن دونه فنزل الفرياني عندهم وادعى أنه المهدي وقيل ادعى أنه القحطاني وراج أمره هناك وكان قدم القاهرة وأكثر التردد إلى المقريزي وواظب الجولان في قرى الريف الأدنى يعمل المواعظ ويذكر الناس وكان يستحضر كثيراً من التواريخ والأخبار الماضية ويدعي معرفة الحديث النبوي ورجاله وتحول عن مذهب مالك وادعى أنه يقلد الشافعي وولي قضاء نابلس إلى أن ظهر منه ما ظهر {cite:shadharat-dhahab p. 261-262}."
  en: "Shams al-Din Muhammad al-Firyani of the Maghreb — a wandering preacher who frequented al-Maqrizi in Cairo, recited histories and prophetic reports from memory, claimed Shafi'i allegiance after Malikism, and held the judgeship of Nablus — then withdrew in 848 to the impregnable Hamida mountains of the Holy Land, whose heights had fields, springs and vines and a folk so secure that none below the sultan could war on them, and there proclaimed himself the Mahdi — some said the Qahtani — and his cause flourished {cite:shadharat-dhahab p. 261-262}."
  fr: "Shams al-Din Muhammad al-Firyani du Maghreb — prédicateur itinérant qui fréquentait al-Maqrizi au Caire, récitait de mémoire histoires et récits prophétiques, revendiquait l’appartenance chaféite après le malikisme et exerça la judicature de Naplouse ; il se retira ensuite en 848 H dans les montagnes imprenables de Hamida en Terre sainte, dont les hauteurs avaient champs, sources et vignes, et des habitants si en sécurité que nul inférieur au sultan ne pouvait leur faire la guerre ; il s’y proclama le Mahdi — selon certains, le Qahtani — et sa cause y prospéra {cite:shadharat-dhahab p. 261-262}."
  es: "Shams al-Din Muhammad al-Firyani del Magreb —un predicador errante que frecuentaba al-Maqrizi en El Cairo, recitaba historias e informes proféticos de memoria, afirmaba ser seguidor de la escuela Shafi'i tras el Malikismo y ostentaba el cargo de juez de Nablus— se retiró en 848 a las inexpugnables montañas Hamida de Tierra Santa, cuyas alturas contaban con campos, manantiales y viñedos, y un pueblo tan seguro que nadie por debajo del sultán podía hacerles la guerra, y allí se proclamó el Mahdi —algunos decían el Qahtani— y su causa floreció {cite:shadharat-dhahab p. 261-262}."
  ur: "مغرب کا شمس الدین محمد الفریانی - ایک آوارہ مبلغ جو قاہرہ میں مقریزی میں کثرت سے آیا کرتا تھا، تاریخوں اور یادداشت سے پیشن گوئی کی رپورٹیں پڑھتا تھا، ملکیت کے بعد شافعی کی بیعت کا دعویٰ کرتا تھا، اور نابلس کی حاکمیت پر فائز ہوتا تھا - پھر 848 میں واپس چلا گیا تھا، جس کے پہاڑی علاقے حمیدہ کے پہاڑی علاقے میں اس کے پاس ناقابل تسخیر تھا۔ چشمے اور انگور اور ایک قوم اتنی محفوظ تھی کہ سلطان سے نیچے کوئی بھی ان سے جنگ نہیں کر سکتا تھا، اور وہاں اپنے آپ کو مہدی کا اعلان کیا - بعض نے کہا کہ قحطانی - اور اس کی وجہ پروان چڑھی {حوالہ: شدارت ذہاب ص۔ 261-262}۔"
  tr: "Şemseddin Muhammed ibn Ahmed el-Faryani, Mafakis el-Mağribi yakınlarındaki Faryana köyünden adını alarak, Hicri 848 yılında Kutsal Topraklar'daki Hamida dağlarına gitti. Bunlar, tırmanması zor, tek bir kişinin bile geçebileceği bir patika bulunmayan, yükselen dağlardı. Dağlardan birinin tepesinde, ekili araziler, su kaynakları, bağlar ve büyük güç ve kudret sahibi insanların yaşadığı bir ova vardı. Sultan ona ve altındakilere karşı savaşsa bile, onlara sığınan herkes güvende olurdu. El-Faryani onlarla birlikte kaldı ve kendisinin Mehdi olduğunu iddia etti. El-Kahtani olduğunu iddia ettiği ve bu olayının orada yaygınlaştığı söylenir. Kahire'ye gelmiş ve sık sık el-Makrizi'yi ziyaret etmiş, düzenli olarak Golan Tepeleri'nin alt kesimlerindeki köyleri gezerek vaazlar vermiş ve insanları uyarmıştı. Birçok geçmiş tarihi ve haberi anlatır, Peygamber hadislerini ve ravilerini bildiğini iddia ederdi. Maliki mezhebinden ayrılıp Şafiî mezhebine mensup olduğunu iddia etti. Nablus kadısı olarak atandı, ta ki ondan anlaşılan şey ortaya çıkana kadar. {Kaynak: Şadharat-Dhaba, s. 261-262}"
  id: "Shams al-Din Muhammad ibn Ahmad al-Faryani, yang namanya diambil dari Faryana, sebuah desa dekat Mafaqis al-Maghribi, pergi pada tahun 848 H ke pegunungan Hamida di Tanah Suci. Pegunungan ini menjulang tinggi, sulit didaki, tanpa jalan yang dapat dilalui lebih dari satu orang. Di puncak salah satu gunung terdapat dataran dengan lahan pertanian, mata air, kebun anggur, dan orang-orang yang sangat kuat dan berkuasa. Siapa pun yang berlindung di sana akan aman, bahkan jika Sultan berperang melawannya dan orang-orang di bawahnya. Al-Faryani tinggal di sana dan mengaku sebagai Mahdi. Dikatakan bahwa ia mengaku sebagai al-Qahtani, dan kisahnya menjadi populer di sana. Ia datang ke Kairo dan sering mengunjungi al-Maqrizi serta secara teratur berkeliling Dataran Tinggi Golan di desa-desa di dataran rendah, memberikan khutbah dan mengingatkan orang-orang. Ia sering menceritakan banyak sejarah dan berita masa lalu dan mengaku mengetahui hadits Nabi dan para perawinya. Dia beralih dari mazhab Maliki dan mengaku mengikuti al-Shafi’i. Dia diangkat menjadi hakim Nablus hingga apa yang kemudian terungkap darinya {cite:shadharat-dhahab p. 261-262}."
