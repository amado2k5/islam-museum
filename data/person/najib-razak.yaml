summary:
  ar: "سياسي ماليزي، وُلد في كوالا ليبيس ببهانغ سنة 1953 الابن الأكبر لعبد الرزاق حسين. انتُخب عضوا في البرلمان في الثالثة والعشرين في مقعد أبيه الراحل، وتولى حقائب وزارية متتابعة ونيابة رئاسة الوزراء، فصار سادس رئيس وزراء سنة 2009؛ وسقطت حكومته سنة 2018 وسط فضيحة صندوق التنمية الماليزي (1MDB) التي أُدين فيها لاحقا وسُجن."
  en: "Malaysian politician, born at Kuala Lipis, Pahang, in 1953, the eldest son of Abdul Razak Hussein. Elected to parliament at twenty-three in his late father's seat, he held a succession of cabinet posts, served as deputy prime minister, and became sixth prime minister in 2009; his government fell in 2018 amid the 1Malaysia Development Berhad (1MDB) scandal, in which he was later convicted and imprisoned."
  ur: "ملائیشیائی سیاست دان، جو 1953ء میں کوالا لیپس، پہانگ میں عبد الرزاق حسین کے بڑے بیٹے پیدا ہوئے۔ تئیس برس کی عمر میں اپنے مرحوم والد کی نشست سے رکنِ پارلیمنٹ منتخب ہوئے، یکے بعد دیگرے کئی وزارتیں اور نائب وزیرِ اعظم کا عہدہ سنبھالا اور 2009ء میں چھٹے وزیرِ اعظم بنے؛ ان کی حکومت 2018ء میں ون ملائیشیا ڈیولپمنٹ برحد (1MDB) اسکینڈل کے درمیان گر گئی، جس میں بعد میں انھیں سزا ہوئی اور وہ قید ہوئے۔"
