summary:
  ar: "سياسي ماليزي، وُلد في كوالا ليبيس ببهانغ سنة 1953 الابن الأكبر لعبد الرزاق حسين. انتُخب عضوا في البرلمان في الثالثة والعشرين في مقعد أبيه الراحل، وتولى حقائب وزارية متتابعة ونيابة رئاسة الوزراء، فصار سادس رئيس وزراء سنة 2009؛ وسقطت حكومته سنة 2018 وسط فضيحة صندوق التنمية الماليزي (1MDB) التي أُدين فيها لاحقا وسُجن."
  en: "Malaysian politician, born at Kuala Lipis, Pahang, in 1953, the eldest son of Abdul Razak Hussein. Elected to parliament at twenty-three in his late father's seat, he held a succession of cabinet posts, served as deputy prime minister, and became sixth prime minister in 2009; his government fell in 2018 amid the 1Malaysia Development Berhad (1MDB) scandal, in which he was later convicted and imprisoned."
  ur: "ملائیشیائی سیاست دان، جو 1953ء میں کوالا لیپس، پہانگ میں عبد الرزاق حسین کے بڑے بیٹے پیدا ہوئے۔ تئیس برس کی عمر میں اپنے مرحوم والد کی نشست سے رکنِ پارلیمنٹ منتخب ہوئے، یکے بعد دیگرے کئی وزارتیں اور نائب وزیرِ اعظم کا عہدہ سنبھالا اور 2009ء میں چھٹے وزیرِ اعظم بنے؛ ان کی حکومت 2018ء میں ون ملائیشیا ڈیولپمنٹ برحد (1MDB) اسکینڈل کے درمیان گر گئی، جس میں بعد میں انھیں سزا ہوئی اور وہ قید ہوئے۔"
  es: "Político malasio, nacido en Kuala Lipis, Pahang, en 1953, hijo mayor de Abdul Razak Hussein. Elegido diputado a los veintitrés años por el escaño de su difunto padre, ocupó varios cargos ministeriales, fue viceprimer ministro y se convirtió en sexto primer ministro en 2009; su gobierno cayó en 2018 en medio del escándalo de 1Malaysia Development Berhad (1MDB), por el que posteriormente fue condenado y encarcelado."
  fr: "Homme politique malaisien, né à Kuala Lipis, dans l'État de Pahang, en 1953, il est le fils aîné d'Abdul Razak Hussein. Élu au Parlement à l'âge de vingt-trois ans pour succéder à son père, il a occupé successivement des postes ministériels, a été vice-Premier ministre et est devenu le sixième Premier ministre en 2009; son gouvernement a chuté en 2018 dans le contexte du scandale 1MDB (1Malaysia Development Berhad), pour lequel il a été par la suite reconnu coupable et emprisonné."
  tr: "1953'te Bhang, Kuala Lips'te doğan Malezyalı bir siyasetçi, Abdul Razak Hussain'in en büyük oğludur. Yirmi üçüncü yılda babasının koltuğunda milletvekili seçildi, ardışık bakanlık görevlerinde bulundu ve 2009'da altıncı başbakan oldu; hükümeti, 2018'de Malezya Kalkınma Fonu (1MDB) skandalı nedeniyle düştü; bu skandal nedeniyle mahkum edilip hapse atıldı."
  id: "Seorang politikus Malaysia, lahir di Kuala Lips, Bhang pada tahun 1953, putra sulung Abdul Razak Hussain. Ia terpilih sebagai anggota parlemen pada tahun ke-23 di kursi almarhum ayahnya, memegang portofolio menteri berturut-turut dan wakil perdana menteri, menjadi perdana menteri keenam pada tahun 2009; pemerintahannya jatuh pada tahun 2018 di tengah skandal Dana Pembangunan Malaysia (1MDB), yang kemudian membuatnya dihukum dan dipenjara."
