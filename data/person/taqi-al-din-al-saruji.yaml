roles:
- poet
gender: male
summary:
  ar: عبد الله بن علي بن منجد السروجي، تقي الدين، شاعر في سيرته فضل وأدب، ولد في سروج وتوفي بالقاهرة سنة 693 هـ الموافقة 1294 م، وله أبيات مطلعها «أنعم بوصلك لي فهذا وقته».
  en: Abd Allah ibn Ali ibn Munjid al-Saruji, Taqi al-Din, a poet of merit and literary culture, born in Saruj and died in Cairo in 693 AH (1294 CE); author of verses beginning «أنعم بوصلك لي فهذا وقته».
  es: "Abd Allah ibn Ali ibn Munjid al-Saruji, Taqi al-Din, poeta de mérito y cultura literaria, nacido en Saruj y muerto en El Cairo en 693 d. H. (1294 d. C.); autor de versos que comienzan con «أنعم بوصلك لي فهذا وقته»."
  fr: "Abd Allah ibn Ali ibn Munjid al-Saruji, Taqi al-Din, poète de mérite et de culture littéraire, né à Saruj et mort au Caire en 693 AH (1294 CE); auteur de vers commençant par «أنعم بوصلك لي فهذا وقته»."
  ur: "عبد اللہ ابن علی ابن منجد السروجی، تقی الدین، ایک قابلیت اور ادبی ثقافت کا شاعر، سروج میں پیدا ہوا اور 693 ہجری ⁦(1294 عیسوی)⁩ میں قاہرہ میں فوت ہوا؛ شروع ہونے والی آیات کے مصنف \"میں آپ کو جگہ اور وقت میں خوش آمدید کہتا ہوں\"۔"
  tr: "Abdullah ibn Ali ibn Munjid al-Sarouji, Taqi al-Din, biyografisi erdem ve edebiyat üzerine kurulu bir şairdir; Surouj'da doğmuş ve 693 Hicri (1294) yılında Kahire'de ölmüştür. Dizeleri 'Lütuf seni bana bağlamak için, çünkü bu onun zamanıdır' diye başlar."
  id: "Abdullah ibn Ali ibn Munjid al-Sarouji, Taqi al-Din, seorang penyair yang biografinya adalah kebajikan dan sastra, lahir di Surouj dan meninggal di Kairo pada tahun 693 H (1294 M). Ia memiliki bait-bait yang dimulai dengan 'Rahmat untuk menghubungkanmu denganku, karena ini adalah waktunya.'"
