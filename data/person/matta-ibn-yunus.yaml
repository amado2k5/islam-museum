summary:
  ar: "أبو بشر متى بن يونس الحكيم المشهور؛ كان شيخاً كبيراً يقرأ الناس عليه فن المنطق وله إذ ذاك صيت عظيم وشهرة واسعة ويجتمع في حلقته كل يوم المثنون من المشتغلين بالمنطق وهو يقرأ كتاب أرسطاطاليس في المنطق ويملي على تلامذته شرحه فكتب عنه الفارابي في شرحه سبعون سفراً ولم يكن في ذلك الوقت أحد مثله في فنه؛ وكان حسن العبارة في تواليفه لطيف الإشارة وكان يستعمل في تصانيفه البسط والتذليل حتى قال بعض علماء هذا الفن: ما أرى أبا نصر الفارابي أخذ طريق تفهيم المعاني الجزلة بالألفاظ السهلة إلا من أبي بشر المذكور؛ وكان أبو نصر يحضر حلقته في غمار تلامذته {cite:wafayat-ayan}."
  en: "Abu Bishr Matta b. Yunus (d. under al-Radi) — the Nestorian logician of Baghdad; taught Aristotle's Organon to a daily circle in which al-Farabi sat as a pupil, copying seventy volumes of his commentary {cite:wafayat-ayan}."
  es: "Abu Bishr Matta b. Yunus (m. bajo al-Radi) — el lógico nestoriano de Bagdad; enseñó el Organon de Aristóteles a un círculo diario en el que al-Farabi se sentaba como alumno, copiando setenta volúmenes de su comentario {cite:wafayat-ayan}."
  fr: "Abu Bishr Matta b. Yunus (d. sous al-Radi) — le logicien nestorien de Bagdad; enseigna l'Organon d'Aristote à un cercle quotidien dans lequel al-Farabi était assis comme élève, copiant soixante-dix volumes de son commentaire {cite:wafayat-ayan}."
  ur: "ابو بشر متہ بی۔ یونس ⁦(متوفی الرادی کے تحت)⁩ - بغداد کا نسطوری منطق دان؛ ارسطو کے آرگنون کو روزانہ ایک دائرے میں پڑھایا جس میں الفارابی ایک شاگرد کی حیثیت سے بیٹھا تھا، اس نے اپنی تفسیر کی ستر جلدیں نقل کی تھیں۔"
  tr: "Ünlü âlim Ebu Bişr Mata ibn Yunus el-Hakim, insanların mantık sanatını onun altında çalıştığı büyük bir şeyhti. O dönemde büyük bir üne ve geniş bir üne sahipti. Her gün mantıkla ilgilenen ikisi onun çevresinde toplanır, Aristoteles'in mantık kitabını okur ve öğrencilerine açıklamasını dikte ederdi. El-Ferabi onun hakkında yetmiş kitap yazdı ve o dönemde sanatında başka kimse onun gibi değildi. Yazılarında etkileyici bir şekilde konuşur, eserlerinde ayrıntı ve incelik kullanırdı; o kadar ki bu alandaki bazı alimler şöyle demiştir: Ebu Nasr el-Ferabi'nin yüksek anlamları basit kelimelerle aktarma yolunu seçtiğini görmüyorum, sadece bahsedilen Ebu Bişr'den dolayı; Ebu Nasr öğrencileri arasında onun çevresine katıldı {atıf:wafayat-ayan}."
  id: "Abu Bishr Mata ibn Yunus al-Hakim, seorang cendekiawan terkenal, adalah seorang sheikh besar di bawah bimbingan siapa orang mempelajari seni logika. Pada masa itu, ia sangat terkenal dan terkenal. Setiap hari, keduanya yang terlibat dalam logika berkumpul di lingkarannya, membaca buku Aristoteles tentang logika dan mendiktekan penjelasannya kepada murid-muridnya. Al-Farabi menulis tujuh puluh buku tentangnya dalam komentarnya, dan tidak ada orang lain dalam seni pada masa itu yang seperti dirinya. Ia fasih dalam tulisannya dan menggunakan elaborasi serta kehalusan dalam karyanya, sampai-sampai beberapa sarjana di bidang ini berkata: Saya tidak melihat Abu Nasr al-Farabi mengambil jalan menyampaikan makna tinggi dengan kata-kata sederhana kecuali dari Abu Bishr yang telah disebutkan sebelumnya; Abu Nasr mengikuti lingkarannya di antara murid-muridnya {cite:wafayat-ayan}."
