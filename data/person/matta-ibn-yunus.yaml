summary:
  ar: "أبو بشر متى بن يونس الحكيم المشهور؛ كان شيخاً كبيراً يقرأ الناس عليه فن المنطق وله إذ ذاك صيت عظيم وشهرة واسعة ويجتمع في حلقته كل يوم المثنون من المشتغلين بالمنطق وهو يقرأ كتاب أرسطاطاليس في المنطق ويملي على تلامذته شرحه فكتب عنه الفارابي في شرحه سبعون سفراً ولم يكن في ذلك الوقت أحد مثله في فنه؛ وكان حسن العبارة في تواليفه لطيف الإشارة وكان يستعمل في تصانيفه البسط والتذليل حتى قال بعض علماء هذا الفن: ما أرى أبا نصر الفارابي أخذ طريق تفهيم المعاني الجزلة بالألفاظ السهلة إلا من أبي بشر المذكور؛ وكان أبو نصر يحضر حلقته في غمار تلامذته {cite:wafayat-ayan}."
  en: "Abu Bishr Matta b. Yunus (d. under al-Radi) — the Nestorian logician of Baghdad; taught Aristotle's Organon to a daily circle in which al-Farabi sat as a pupil, copying seventy volumes of his commentary {cite:wafayat-ayan}."
