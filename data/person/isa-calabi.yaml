summary:
  ar: "الأمير عيسى بن بايزيد الأول؛ أحد أبناء بايزيد الخمسة الذين اشتركوا معه في القتال، نجا من هزيمة أنقرة سنة ٨٠٤هـ/١٤٠٢م فذهب إلى بروسة وأعلن للناس أنه خليفة أبيه، فكان أحد المتنازعين الثلاثة على أشلاء الدولة في الحرب الأهلية العثمانية إلى جانب أخويه سليمان في أدرنة ومحمد في أماسيا {cite:dawlat-uthmaniyya-salabi p. 70}. وانتهت الفترة بغلبة أخيه الأصغر محمد الأول سنة ١٤١٣م {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  en: "İsa Çelebi, son of Bayezid I — escaped the Ankara defeat of 804/1402, went to Bursa and proclaimed himself his father's successor, one of the three brothers fighting over the fragments of the state in the Ottoman civil war alongside Süleyman in Edirne and Mehmed in Amasya {cite:dawlat-uthmaniyya-salabi p. 70}, until Mehmed I prevailed in 1413 {cite:dawlat-uthmaniyya-salabi p. 72-73}."
