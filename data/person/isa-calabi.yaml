summary:
  ar: "الأمير عيسى بن بايزيد الأول؛ أحد أبناء بايزيد الخمسة الذين اشتركوا معه في القتال، نجا من هزيمة أنقرة سنة ٨٠٤هـ/١٤٠٢م فذهب إلى بروسة وأعلن للناس أنه خليفة أبيه، فكان أحد المتنازعين الثلاثة على أشلاء الدولة في الحرب الأهلية العثمانية إلى جانب أخويه سليمان في أدرنة ومحمد في أماسيا {cite:dawlat-uthmaniyya-salabi p. 70}. وانتهت الفترة بغلبة أخيه الأصغر محمد الأول سنة ١٤١٣م {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  en: "İsa Çelebi, son of Bayezid I — escaped the Ankara defeat of 804/1402, went to Bursa and proclaimed himself his father's successor, one of the three brothers fighting over the fragments of the state in the Ottoman civil war alongside Süleyman in Edirne and Mehmed in Amasya {cite:dawlat-uthmaniyya-salabi p. 70}, until Mehmed I prevailed in 1413 {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  es: "İsa Çelebi, hijo de Bayezid I, escapó de la derrota de Ankara en 804/1402, fue a Bursa y se proclamó sucesor de su padre, uno de los tres hermanos que lucharon por los fragmentos del estado en la guerra civil otomana junto con Süleyman en Edirne y Mehmed en Amasya {cite:dawlat-uthmaniyya-salabi p. 70}, hasta que Mehmed I prevaleció en 1413 {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  fr: "İsa Çelebi, fils de Bayezid Ier, échappa à la défaite d'Ankara de 804/1402, se rendit à Bursa et se proclama successeur de son père, l'un des trois frères se disputant les fragments de l'État lors de la guerre civile ottomane aux côtés de Süleyman à Edirne et de Mehmed à Amasya {cite:dawlat-uthmaniyya-salabi p. 70}, jusqu'à ce que Mehmed Ier l'emporte en 1413 {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  ur: "عیسیٰ چیلیبی، بایزید اول کا بیٹا - 804/1402 کی انقرہ کی شکست سے بچ کر برسا گیا اور اپنے والد کا جانشین ہونے کا اعلان کیا، تین بھائیوں میں سے ایک جو عثمانی خانہ جنگی میں ریاست کے ٹکڑوں پر ادرنے میں سلیمان کے ساتھ لڑ رہے تھے اور عماسیہ میں محمد۔ 70}، جب تک کہ محمد 1413 میں غالب ہوا 72-73}۔"
  tr: "Bayezid'in beş oğlundan biri olan Prens İsa ibn Bayezid I, 804 Hicri / 1402 yılında Ankara'nın yenilgisinden sağ kurtuldu, ardından Prusa'ya giderek babasının halefi olduğunu ilan etti. Osmanlı iç savaşında devletin parçalanması için üç adaydan biriydi; Edirne'deki kardeşleri Süleyman ve Amasya'da Muhammed ile birlikte yer aldı {cite:dawlat-uthmaniyya-salabi s. 70}. Dönem, küçük kardeşi Mehmed I'in 1413 yılında zaferiyle sona erdi {cite:dawlat-uthmaniyya-salabi s. 72-73}."
  id: "Pangeran Isa ibn Bayezid I, salah satu dari lima putra Bayezid yang bertempur bersamanya, selamat dari kekalahan Ankara pada tahun 804 H / 1402 M, lalu pergi ke Prusa dan menyatakan dirinya sebagai penerus ayahnya. Ia adalah salah satu dari tiga pesangon atas pecahan negara dalam perang saudara Ottoman bersama saudara-saudaranya Suleiman dalam Edirne dan Muhammad dalam Amasya {cite:dawlat-uthmaniyya-salabi hlm. 70}. Periode ini berakhir dengan kemenangan adik laki-lakinya Mehmed I pada tahun 1413 M {cite:dawlat-uthmaniyya-salabi hlm. 72-73}."
