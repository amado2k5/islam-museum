summary:
  ar: "باحثة أمريكية في المنسوجات، كانت مساعدة في قسم المنسوجات بمتحف الفنون الجميلة في بوسطن، ونشرت سنة 1938 دراسة لمنسوجاته الإسلامية المبكرة {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1}."
  en: "American textile scholar, formerly assistant in the Department of Textiles of the Museum of Fine Arts, Boston, who published a study of its early Islamic textiles in 1938 {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1}."
  ur: "امریکی ماہرِ پارچہ جات، بوسٹن کے میوزیم آف فائن آرٹس کے شعبۂ پارچہ جات میں سابق معاون، جنہوں نے 1938ء میں اس کے ابتدائی اسلامی پارچہ جات کا مطالعہ شائع کیا {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1}۔"
  es: "Investigadora textil estadounidense, anteriormente asistente en el Departamento de Textiles del Museo de Bellas Artes de Boston, que publicó un estudio sobre sus primeros textiles islámicos en 1938 {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1}."
  fr: "Chercheuse américaine en textiles, ancienne assistante au département des textiles du Musée des Beaux-Arts de Boston, qui a publié une étude sur ses premiers textiles islamiques en 1938 {cite:britton-early-islamic-textiles-mfa-boston-1938 p. 1}."
