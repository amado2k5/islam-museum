summary:
  ar: "رابع ملوك المملكة العربية السعودية (1913–1982)، ابن الملك عبد العزيز من الجوهرة بنت مساعد آل سعود. زار الولايات المتحدة مع فيصل سنة 1943، وصار نائبًا لرئيس الوزراء سنة 1962 ووليًا للعهد سنة 1965، واعتلى العرش في 25 مارس 1975 بعد اغتيال فيصل، فشهد عهده طفرة النفط وحادثة احتجاز الحرم سنة 1979، وتوفي في الطائف في 13 يونيو 1982 ودُفن في مقبرة العود بالرياض وخلفه أخوه فهد."
  en: "Fourth King of Saudi Arabia (1913–1982), a son of King Abdulaziz by Al Jawhara bint Musaed Al Saud. He visited the United States with Faisal in 1943, became deputy prime minister in 1962 and crown prince in 1965, and ascended the throne on 25 March 1975 after Faisal's assassination; his reign saw the oil boom and the 1979 Grand Mosque seizure. He died in Taif on 13 June 1982, was buried at Al Oud cemetery in Riyadh, and was succeeded by his half-brother Fahd."
  ur: "سعودی عرب کے چوتھے بادشاہ (1913ء–1982ء)، شاہ عبد العزیز اور الجوہرہ بنت مساعد آل سعود کے صاحبزادے۔ 1943ء میں فیصل کے ساتھ امریکا کا دورہ کیا، 1962ء میں نائب وزیر اعظم اور 1965ء میں ولی عہد بنے، اور فیصل کے قتل کے بعد 25 مارچ 1975ء کو تخت نشین ہوئے؛ ان کے دور میں تیل کی خوشحالی اور 1979ء میں حرم پر قبضے کا واقعہ پیش آیا۔ 13 جون 1982ء کو طائف میں وفات پائی، ریاض کے العود قبرستان میں دفن ہوئے اور ان کے بعد ان کے سوتیلے بھائی فہد بادشاہ بنے۔"
