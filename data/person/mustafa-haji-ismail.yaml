summary:
  ar: "عالم وداعية صومالي وصفته «صومالي غارديان» سنة 2026 بأنه أبرز علماء الدين في الصومال. تخرّج مهندسًا كهربائيًا من جامعة الصومال الوطنية سنة 1980، وهو من أهل بوراو، درّس فيها وسُجن في عهد النظام العسكري، ثم استقر في النرويج. تُسمع محاضراته في العالم الناطق بالصومالية كله: بلغ عدد مشتركي قناته الخاصة على يوتيوب «Sheekh Mustafe Official Channel» 452 ألف مشترك في نوفمبر 2026، وتوزّع دور إنتاج محاضراته رقميًا على نطاق أوسع."
  en: "Somali scholar and preacher described by Somali Guardian in 2026 as Somalia's most prominent religious scholar. An electrical-engineering graduate of Somali National University (1980) from Burao who taught there and was imprisoned under the military regime, he later settled in Norway. His lectures are heard across the Somali-speaking world: his own YouTube channel, Sheekh Mustafe Official Channel, counted 452,000 subscribers in November 2026, and production houses distribute his lectures further."
  ur: "صومالی عالم اور واعظ جنہیں «صومالی گارڈین» نے 2026 میں صومالیہ کا نمایاں ترین دینی عالم قرار دیا۔ بوراو سے تعلق رکھنے والے، صومالی نیشنل یونیورسٹی سے 1980 میں الیکٹریکل انجینئرنگ کے فارغ التحصیل؛ تدریس کی، فوجی حکومت کے دور میں قید کاٹی، پھر ناروے میں مقیم ہو گئے۔ ان کے خطبات پورے صومالی بولنے والے خطے میں سنے جاتے ہیں: ان کے اپنے یوٹیوب چینل «Sheekh Mustafe Official Channel» کے نومبر 2026 میں 452 ہزار سبسکرائبر تھے، اور پروڈکشن ادارے ان کے خطبات مزید تقسیم کرتے ہیں۔"
