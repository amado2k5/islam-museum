id: person/al-nasafi-al-dai
class: person
label: { ar: "النسفي الداعي", en: "Al Nasafi Al Dai" }
summary:
  ar: "أبو عبد الله محمد بن أحمد النسفي النخشبي من مصنفي الإسماعيلية، وله كتاب عنوان الدين وكتاب أصول الشرع وكتاب الدعوة المتجبة {cite:fihrist-ibn-al-nadim p. 673}. وعند ابن النديم خلف المروزي في خراسان واستغوى نصر بن أحمد وأدخله في الدعوة وأغرمه دية المروزي مائة وتسعة عشر دينارا في كل دينار ألف دينار وزعم أنه ينفذها إلى صاحب المغرب القائم بالأمر فلحق نصرا سقم طرحه على فراشه وندم على إجابته للنسفي فأظهر ذلك ومات {cite:fihrist-ibn-al-nadim p. 266}"
  en: "Transoxanian Ismaili da'i — Unwan al-Din {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
