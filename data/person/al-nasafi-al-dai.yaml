id: person/al-nasafi-al-dai
class: person
label: { ar: "النسفي الداعي", en: "Al Nasafi Al Dai", fr: "Al Nasafi Al Dai", es: "Al Nasafi Al Dai", ur: "النصفی الدائی" }
summary:
  ar: "أبو عبد الله محمد بن أحمد النسفي النخشبي من مصنفي الإسماعيلية، وله كتاب عنوان الدين وكتاب أصول الشرع وكتاب الدعوة المتجبة {cite:fihrist-ibn-al-nadim p. 673}. وعند ابن النديم خلف المروزي في خراسان واستغوى نصر بن أحمد وأدخله في الدعوة وأغرمه دية المروزي مائة وتسعة عشر دينارا في كل دينار ألف دينار وزعم أنه ينفذها إلى صاحب المغرب القائم بالأمر فلحق نصرا سقم طرحه على فراشه وندم على إجابته للنسفي فأظهر ذلك ومات {cite:fihrist-ibn-al-nadim p. 266}"
  en: "Transoxanian Ismaili da'i — Unwan al-Din {cite:fihrist-ibn-al-nadim}"
  fr: "Transoxanien Ismaili da'i – Unwan al-Din {cite:fihrist-ibn-al-nadim}"
  es: "Ismaili da'i de Transoxania - Unwan al-Din {cita:fihrist-ibn-al-nadim}"
  ur: "ٹرانسکسانی اسماعیلی داعی - انوان الدین {حوالہ: فہرست ابن الندیم}"
  tr: "Ebu Abdullah Muhammed bin Ahmed el-Nasafi el-Nadim İsmaili yazarlardan biriydi ve 'Unwan al-Din', 'Usul al-Shara' ve 'The Mutajbah Da'wah' kitaplarını yazdı {atıf:fihrist-ibn-al-nadim s. 673}. İbn al-Nadim ile birlikte el-Mervazi'nin yerine Horasan'da geçti, Nasr ibn Ahmed'den saray desteğini istedi, onu misyona dahil etti ve her dinar için yüz on dokuz dinar para cezası verdi, bunu Mağrip hükümdarına aktardığını iddia etti. Nasr'ın yerine geçti ve onu yatağına attı, el-Nesafi'ye verdiği yanıttan pişman oldu, bunu açıkladı ve öldü {cite:fihrist-ibn-al-nadim s. 266}"
  id: "Abu Abdullah Muhammad ibn Ahmad al-Nasafi al-Nadim adalah salah satu penulis Ismaili, dan ia menulis buku 'Unwan al-Din,' 'Usul al-Shara', dan 'The Mutajbah Da'wah' {cite:fihrist-ibn-al-nadim hlm. 673}. Bersama Ibn al-Nadim, ia menggantikan al-Marwazi di Khurasan, meminta restu istana dari Nasr ibn Ahmad, membawanya ke misi, dan mendendanya seratus sembilan belas dinar untuk setiap dinar, dengan alasan akan melaksanakannya kepada penguasa Maghreb yang berkuasa. Ia menggantikan Nasr dan melemparkannya ke tempat tidur, menyesali jawabannya kepada al-Nasafi, sehingga ia mengungkapkan hal itu dan meninggal {cite:fihrist-ibn-al-nadim hlm. 266}"
