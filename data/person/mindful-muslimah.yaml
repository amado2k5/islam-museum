summary:
  ar: "معلمة ومرشدة زواج تعمل بالكامل تحت هذا الاسم العلني. أسست «مدرسة اليقظة الذهنية للمسلمين» وتقدم بودكاست «المسلمة الواعية تتحدث» (Mindful Muslimah Speaks)، وقضت أكثر من 25 عامًا معلمة مرخّصة، منها أدوار إدارية واستشارية في أنظمة تعليمية في الولايات المتحدة ودبي."
  en: "Educator and marriage coach who works entirely under this public name. She is the founder of the Muslim Mindfulness School and the host of the Mindful Muslimah Speaks podcast, and spent over 25 years as a licensed educator, including administrator and consultant roles in education systems in the United States and Dubai."
  ur: "معلمہ اور ازدواجی رہنما جو مکمل طور پر اسی عوامی نام سے کام کرتی ہیں۔ وہ مسلم مائنڈفلنیس اسکول کی بانی اور «Mindful Muslimah Speaks» پوڈکاسٹ کی میزبان ہیں، اور 25 سال سے زائد عرصہ لائسنس یافتہ معلمہ رہیں، بشمول امریکہ اور دبئی کے تعلیمی نظاموں میں انتظامی و مشاورتی کردار۔"
