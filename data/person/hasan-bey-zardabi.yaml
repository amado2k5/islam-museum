faith:
  - value: sunni
    basis: documented
    note: "Two independent sources name Sunni Islam for Zardabi himself. The Russian article states, of his confession, that he 'was a Muslim-Sunni', citing the contemporary survey Periodical Press in the Caucasus (Tiflis, 1901, p. 50). Independently, the English article quotes Tadeusz Swietochowski (Russia and Azerbaijan, Cambridge University Press, 1985) describing the circle of contributors to Zardabi's newspaper Akinchi as 'mainly Sunnis like Zardabi'. Neither source names a legal school within Sunni Islam, so the value is recorded as sunni without a madhhab qualifier. His advocacy of secularism and of modern schooling, set out in the prose, is a position he argued, not a counter-attestation of affiliation."
