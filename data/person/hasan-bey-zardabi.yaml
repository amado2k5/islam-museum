summary:
  ar: "صحفي ومربٍّ أذربيجاني (1837–1907)، وُلد باسم ماليكوف؛ أسس سنة 1875 صحيفة «أكينجي» (الفلّاح)، أول صحيفة باللغة الأذربيجانية، وكان من أبرز رموز حركة التنوير عند مسلمي القوقاز، وداعية إلى التعليم الحديث والمسرح الوطني."
  en: "Azerbaijani journalist, educator and enlightener (1837–1907), born Malikov. In 1875 he founded Akinchi (The Ploughman), the first newspaper in the Azerbaijani language, staged the first Azerbaijani theatrical production, and spent his life campaigning for modern education among the Muslims of the Caucasus."
  ur: "آذربائیجانی صحافی، ماہرِ تعلیم اور روشن خیال رہنما (1837–1907)، ولدیت کا نام ماليکوف۔ 1875 میں انہوں نے «اکینچی» (کسان) جاری کیا جو آذربائیجانی زبان کا پہلا اخبار تھا؛ قفقاز کے مسلمانوں میں جدید تعلیم کی تحریک کے اہم رہنما رہے۔"
