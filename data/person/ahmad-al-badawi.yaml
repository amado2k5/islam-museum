summary:
  ar: "السيد الجليل البدوي صاحب طنطا؛ أصله من بني بري قبيلة من غرب الشام ثم سكن والده المغرب فولد له بفاس سنة ست وتسعين وخمس مئة وحج أبوه به سنة ست وست مئة وأقاموا بمكة ومات أبوه سنة سبع وعشرين ودفن بالمعلى، وعرف بالبدوي للزومه اللثام لأنه كان يلبس لثامين ولا يفارقهما ولم يتزوج قط، قال المتبولي قال لي رسول الله ما في أولياء مصر بعد محمد بن إدريس أكبر فتوة منه ثم نفيسة ثم شرف الدين الكردي ثم المنوفي، وكان يمكث أربعين يوماً لا يأكل ولا يشرب ولا ينام ثم سمع هاتفاً يقول ثلاثاً قم واطلب مطلع الشمس فإذا وصلته فاطلب مغربها وسر إلى طندتا فإن فيها مقامك أيها الفتى فسار إلى العراق فتلقاه العارفان الكيلاني والرفاعي فقالا يا أحمد مفاتيح العراق والهند واليمن والمشرق والمغرب بيدنا فاختر أيها شئت فقال لا آخذ المفاتيح إلا من الفتاح ثم رحل إلى مصر فتلقاه الظاهر بيبرس بعسكره وأكرمه وعظمه ودخلها سنة أربع وثلاثين فأقام بطندتا على سطح دار لا يفارقه ليلاً ولا نهاراً اثنتي عشرة سنة، وكان لا يكشف اللثام عن وجهه فقال له عبد المجيد أرني وجهك قال كل نظرة برجل قال أرنيه ولو مت فكشفه فمات حالاً، وحدث لأصحابه بعد مدة عمل المولد فصار يقصد من بلاد بعيدة وقام بعض العلماء والأمراء بإبطاله فلم يتهيأ لهم ذلك إلا في سنة واحدة؛ ذكره ابن العماد باختصار من طبقات عبد الرؤوف المناوي {cite:shadharat-dhahab p. 353-355}."
  en: "Ahmad al-Badawi of Tanta — the veiled saint of Fes who fasted forty days, heard the voice thrice bidding him to Tanta, refused the 'keys of the realms' offered in spirit by al-Jilani and al-Rifa'i, and was received with honour by Baybars in 634; he kept a rooftop twelve years and died in 675 — his disciples' mawlid still draws pilgrims {cite:shadharat-dhahab p. 353-355}."
  fr: "Ahmad al-Badawi de Tanta : saint voilé de Fès qui, selon le récit, jeûnait quarante jours, entendit trois fois une voix l'envoyant à Tanta, refusa les « clés des royaumes » offertes en esprit par al-Jilani et al-Rifa'i et fut reçu avec honneur par Baybars en 634 H ; il demeura douze ans sur un toit et mourut en 675 H. Le mawlid de ses disciples attire encore des pèlerins {cite:shadharat-dhahab p. 353-355}."
  es: "Ahmad al-Badawi de Tanta — el santo velado de Fez que ayunó cuarenta días, escuchó tres veces la voz que lo llamaba a Tanta, rechazó las \"llaves de los reinos\" ofrecidas en espíritu por al-Jilani y al-Rifa'i, y fue recibido con honores por Baybars en 634; mantuvo una azotea durante doce años y murió en 675 — el mawlid de sus discípulos todavía atrae peregrinos {cite:shadharat-dhahab p. 353-355}."
  ur: "طنطہ کے احمد البداوی - فیس کے پردہ دار بزرگ جس نے چالیس دن روزہ رکھا، تین بار آواز سنی جس نے اسے طنطا سے کہا، الجیلانی اور الرفاعی کی طرف سے روح کے ساتھ پیش کی گئی 'ملکوں کی چابیاں' سے انکار کر دیا، اور 634 میں Baybars کی طرف سے اعزاز کے ساتھ استقبال کیا گیا؛ اس نے بارہ سال چھت پر رکھی اور 675 میں ان کا انتقال ہوا - اس کے شاگردوں کا میلاد اب بھی زائرین کو کھینچتا ہے 353-355}۔"
  tr: "Tanta'nın sahibi saygıdeğer Bay El-Badavi; aslen Batı Suriye'deki Beni Bari kabilesindendi. Babası daha sonra Fas'a yerleşti ve kendisi Hicri 596 yılında Fez'de doğdu. Babası onu Hicri 606 yılında Hac ibadetine götürdü ve Mekke'de kaldılar. Babası Hicri 627 yılında vefat etti ve Mu'alla'ya defnedildi. Sürekli sarık takması nedeniyle El-Badavi olarak bilinirdi; iki sarık takar ve hiç çıkarmazdı. Hiç evlenmedi. El-Mutabuli şöyle dedi: Allah'ın Resulü bana şöyle buyurdu: \"Muhammed ibn İdris'ten sonra Mısır evliyaları arasında ondan daha büyük bir şövalyelik yoktur, sonra Nafisa, sonra Şaraf el-Din el-Kurdi, sonra da el-Manufi gelir.\" Kırk gün boyunca yemeden, içmeden ve uyumadan geçirirdi. Sonra üç defa şöyle diyen bir ses duydu: \"Kalk ve güneşin doğuşunu ara. Ona ulaştığında batışını ara ve Tandata'ya git, çünkü ey genç adam, senin yurtun orasıdır.\" Bunun üzerine Irak'a gitti. Orada iki tasavvufçu, el-Kilani ve el-Rifa'i, onu karşıladı ve şöyle dediler: \"Ey Ahmed, Irak'ın, Hindistan'ın, Yemen'in, Doğu'nun ve Batı'nın anahtarları elimizde. Dilediğini seç.\" O da şöyle cevap verdi: \"Anahtarları ancak Açan'dan alacağım.\" Sonra Mısır'a gitti. Orada el-Zahir Baybars onu ordusuyla karşıladı, ona şeref verdi ve büyük saygı gösterdi. Hicri 634 yılında Mısır'a girdi ve Tandata'da kaldı. Bir evin çatısında, gece gündüz on iki yıl boyunca hiç ayrılmadı. Yüzünü açmak istemediği için Abdülmecid ona, \"Yüzünü göster bana\" dedi. O da, \"Her bakış bir insana bedeldir\" dedi. Abdülmecid, \"Ölsem bile göster bana\" dedi. Bunun üzerine onu ortaya çıkardı ve hemen öldü. Bir süre sonra arkadaşları Mevlid kutlamalarına başladılar ve insanlar uzak diyarlardan gelip bu kutlamalara katıldılar. Bazı âlimler ve prensler bunu engellemeye çalıştılar, ancak bunu sadece bir yıl boyunca başarabildiler. İbn el-İmad, bunu Abdül Rauf el-Menavi'nin Tabakat'ında kısaca belirtmiştir {kaynak: Şadharat-dahab s. 353-355}."
  id: "Tuan Al-Badawi yang terhormat, pemilik Tanta; Asal-usulnya dari suku Banu Bari, dari Suriah barat. Ayahnya kemudian menetap di Maroko, dan ia lahir di Fez pada tahun 596 H. Ayahnya membawanya dalam ibadah haji pada tahun 606 H, dan mereka tinggal di Mekah. Ayahnya meninggal pada tahun 627 H dan dimakamkan di al-Mu'alla. Ia dikenal sebagai al-Badawi karena selalu mengenakan sorban, karena ia mengenakan dua sorban dan tidak pernah melepaskannya. Ia tidak pernah menikah. Al-Mutabuli berkata: Rasulullah SAW bersabda kepadaku, \"Di antara para wali Mesir setelah Muhammad bin Idris, tidak ada seorang pun yang lebih hebat dalam kesatriaan daripada dia, kemudian Nafisa, kemudian Sharaf al-Din al-Kurdi, kemudian al-Manufi.\" Ia akan menghabiskan empat puluh hari tanpa makan, minum, atau tidur. Kemudian ia mendengar suara berkata tiga kali, \"Bangkitlah dan carilah terbitnya matahari. Ketika kau menemukannya, carilah terbenamnya dan pergilah ke Tandata, karena di sanalah tempat tinggalmu, wahai pemuda.\" Maka ia pergi ke Irak, di mana dua mistikus, al-Kilani dan al-Rifa'i, menemuinya dan berkata, \"Wahai Ahmad, kunci-kunci Irak, India, Yaman, Timur, dan Barat ada di tangan kami. Pilihlah mana pun yang kau inginkan.\" Ia menjawab, \"Aku tidak akan mengambil kunci-kunci itu kecuali dari Sang Pembuka.\" Kemudian ia melakukan perjalanan ke Mesir, di mana al-Zahir Baybars menerimanya bersama pasukannya, menghormatinya, dan memperlakukannya dengan sangat hormat. Ia memasuki Mesir pada tahun 634 H dan tinggal di Tandata. Di atas atap sebuah rumah, ia tidak pernah meninggalkannya, baik siang maupun malam, selama dua belas tahun. Ia tidak mau membuka wajahnya, sehingga Abdul Majid berkata kepadanya, \"Tunjukkan wajahmu kepadaku.\" Ia berkata, \"Setiap pandangan bernilai seorang manusia.\" Abdul Majid berkata, \"Tunjukkan kepadaku, meskipun aku mati.\" Maka ia menyingkapnya, dan ia langsung meninggal dunia. Setelah beberapa waktu, para sahabatnya mulai merayakan Maulid Nabi, dan orang-orang datang dari negeri yang jauh untuk ikut merayakannya. Beberapa ulama dan pangeran berusaha menghentikannya, tetapi mereka hanya mampu melakukannya dalam satu tahun. Ibn al-Imad menyebutkannya secara singkat dalam Tabaqat karya Abdul Raouf al-Manawi {kutip:shadharat-dhahab hlm. 353-355}."
