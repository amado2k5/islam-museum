summary:
  ar: "السيد الجليل البدوي صاحب طنطا؛ أصله من بني بري قبيلة من غرب الشام ثم سكن والده المغرب فولد له بفاس سنة ست وتسعين وخمس مئة وحج أبوه به سنة ست وست مئة وأقاموا بمكة ومات أبوه سنة سبع وعشرين ودفن بالمعلى، وعرف بالبدوي للزومه اللثام لأنه كان يلبس لثامين ولا يفارقهما ولم يتزوج قط، قال المتبولي قال لي رسول الله ما في أولياء مصر بعد محمد بن إدريس أكبر فتوة منه ثم نفيسة ثم شرف الدين الكردي ثم المنوفي، وكان يمكث أربعين يوماً لا يأكل ولا يشرب ولا ينام ثم سمع هاتفاً يقول ثلاثاً قم واطلب مطلع الشمس فإذا وصلته فاطلب مغربها وسر إلى طندتا فإن فيها مقامك أيها الفتى فسار إلى العراق فتلقاه العارفان الكيلاني والرفاعي فقالا يا أحمد مفاتيح العراق والهند واليمن والمشرق والمغرب بيدنا فاختر أيها شئت فقال لا آخذ المفاتيح إلا من الفتاح ثم رحل إلى مصر فتلقاه الظاهر بيبرس بعسكره وأكرمه وعظمه ودخلها سنة أربع وثلاثين فأقام بطندتا على سطح دار لا يفارقه ليلاً ولا نهاراً اثنتي عشرة سنة، وكان لا يكشف اللثام عن وجهه فقال له عبد المجيد أرني وجهك قال كل نظرة برجل قال أرنيه ولو مت فكشفه فمات حالاً، وحدث لأصحابه بعد مدة عمل المولد فصار يقصد من بلاد بعيدة وقام بعض العلماء والأمراء بإبطاله فلم يتهيأ لهم ذلك إلا في سنة واحدة؛ ذكره ابن العماد باختصار من طبقات عبد الرؤوف المناوي {cite:shadharat-dhahab p. 353-355}."
  en: "Ahmad al-Badawi of Tanta — the veiled saint of Fes who fasted forty days, heard the voice thrice bidding him to Tanta, refused the 'keys of the realms' offered in spirit by al-Jilani and al-Rifa'i, and was received with honour by Baybars in 634; he kept a rooftop twelve years and died in 675 — his disciples' mawlid still draws pilgrims {cite:shadharat-dhahab p. 353-355}."
