summary:
  ar: "زعيم وطني بشتوني من بلوشستان، وُلد سنة 1907 في عناية الله كاريز قرب غلستان، وأسّس سنة 1938 «أنجمن وطن بلوشستان» حليفة المؤتمر الوطني الهندي، وعارض تقسيم الهند، وقضى نحو 35 سنة من حياته في سجون الاستعمار ثم باكستان، وأسّس أول صحيفة في الإقليم «استقلال»، وترجم إلى البشتو أعمالًا منها «ترجمان القرآن» لأبي الكلام آزاد و«غلستان» لسعدي. اغتيل بقنبلة على بيته في كويتا سنة 1973 وهو عضو في مجلس بلوشستان الإقليمي."
  en: "Pashtun nationalist leader from Balochistan, born in 1907 at Inayatullah Karez near Gulistan. In 1938 he founded the Anjuman-i-Watan Baluchistan, allied with the Indian National Congress, and opposed the partition of India. He spent some 35 years of his life in prison under the British and then in Pakistan, founded the province's first newspaper, Istiqlal, and translated works into Pashto including Abul Kalam Azad's Tarjuman-ul-Quran and Saadi's Gulistan. He was assassinated by a grenade attack on his home in 1973 while a member of the Balochistan Provincial Assembly."
  ur: "بلوچستان کے پشتون قوم پرست راہنما، جو 1907 میں گلستان کے قریب عنایت اللہ کاریز میں پیدا ہوئے۔ 1938 میں انھوں نے «انجمن وطن بلوچستان» قائم کی جو انڈین نیشنل کانگریس کی اتحادی تھی، اور تقسیم ہند کی مخالفت کی۔ انھوں نے اپنی زندگی کے تقریباً 35 سال انگریزوں اور پھر پاکستان کی جیلوں میں گزارے، صوبے کا پہلا اخبار «استقلال» نکالا، اور ابوالکلام آزاد کی «ترجمان القرآن» اور سعدی کی «گلستان» سمیت کئی کتابیں پشتو میں منتقل کیں۔ 1973 میں بلوچستان صوبائی اسمبلی کے رکن ہوتے ہوئے اپنے گھر پر دستی بم حملے میں شہید ہوئے۔"
