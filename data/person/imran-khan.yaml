summary:
  ar: "لاعب كريكت باكستاني سابق وفاعل خير وسياسي ورئيس وزراء باكستان التاسع عشر، وُلد في لاهور سنة 1952. لاعب شامل رامٍ سريع بالذراع اليمنى، لعب لباكستان بين 1971 و1992 في 88 مباراة اختبار أخذ فيها 362 ويكيت وسجّل 3,807 جولات، وقاد باكستان إلى لقبها الوحيد في كأس العالم سنة 1992، ودخل قاعة مشاهير المجلس الدولي للكريكت سنة 2009، ثم أسس مستشفى شوكت خانم التذكاري للسرطان، أول مستشفى سرطان في باكستان، وأسس حزب حركة الإنصاف الباكستانية سنة 1996 وقاده حتى 2023، وكان رئيس وزراء باكستان من أغسطس 2018 إلى أبريل 2022 حين عُزل بتصويت حجب ثقة، وهو أول رئيس وزراء باكستاني يُعزل بهذه الطريقة، وسُجن منذ 2023 كما تنقل المصادر."
  en: "Pakistani former cricketer, philanthropist and politician who served as the 19th prime minister of Pakistan, born in Lahore in 1952. A fast-bowling all-rounder, he played for Pakistan from 1971 to 1992, taking 362 wickets and scoring 3,807 runs in 88 Tests, captained Pakistan to its only Cricket World Cup title in 1992, and was inducted into the ICC Cricket Hall of Fame in 2009. He then founded the Shaukat Khanum Memorial Cancer Hospital, Pakistan's first cancer hospital, founded the Pakistan Tehreek-e-Insaf party in 1996 and chaired it until 2023, and was prime minister of Pakistan from August 2018 to April 2022, when he was removed by a no-confidence vote — the first Pakistani prime minister removed that way — and has been imprisoned since 2023 as the sources report."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی، فلاحی کارکن اور سیاست دان اور پاکستان کے انیسویں وزیرِ اعظم، جو 1952 میں لاہور میں پیدا ہوئے۔ تیز گیند باز آل راؤنڈر کی حیثیت سے انھوں نے 1971ء سے 1992ء تک پاکستان کے لیے کھیلا، 88 ٹیسٹ میچوں میں 362 وکٹیں لیں اور 3,807 رنز بنائے، پاکستان کو 1992ء میں اس کے واحد کرکٹ ورلڈ کپ ٹائٹل تک پہنچایا، اور 2009 میں آئی سی سی کرکٹ ہال آف فیم میں شامل ہوئے۔ پھر انھوں نے شوکت خانم میموریل کینسر ہسپتال قائم کیا، جو پاکستان کا پہلا کینسر ہسپتال ہے، 1996 میں پاکستان تحریکِ انصاف قائم کی اور 2023 تک اس کے چیئرمین رہے، اور اگست 2018 سے اپریل 2022 تک پاکستان کے وزیرِ اعظم رہے، جب انھیں تحریکِ عدم اعتماد کے ذریعے ہٹایا گیا — اس طریقے سے ہٹائے جانے والے پہلے پاکستانی وزیرِ اعظم — اور ماخذوں کی رپورٹ کے مطابق 2023 سے قید میں ہیں۔"
