summary:
  ar: "أمير شيباني قدم من مصر إلى سامرا سنة ثلاث وخمسين ومائتين ومعه مال كثير وستة وسبعون رجلاً من ولد أبي طالب من ولد علي وجعفر وعقيل كانوا خرجوا من الحجاز فراراً من الفتنة إلى مصر، فأمر المعتز بتكفيلهم والتخلية عنهم وولى عيسى فلسطين {cite:muruj-al-dhahab p. 551-552}."
  en: "The Shaybani amir who escorted seventy-six Talibids from Egypt to Samarra and was appointed over Palestine {cite:muruj-al-dhahab p. 551-552}."
  es: "El emir de Shaybani que escoltó a setenta y seis talíbidos desde Egipto hasta Samarra y fue nombrado gobernador de Palestina {cite:muruj-al-dhahab p. 551-552}."
  fr: "L'émir Shaybani qui a escorté soixante-seize Talibides d'Égypte à Samarra et a été nommé sur la Palestine {cite:muruj-al-dhahab p. 551-552}."
  ur: "شیبانی امیر جس نے چھہتر طالبان کو مصر سے سامرا لے کر آیا اور فلسطین پر مقرر کیا گیا۔ 551-552}۔"
  tr: "Amir Şeybani, 253 Hicri yılında Mısır'dan Samarra'ya geldi, yanında büyük bir servet ve Ebu Talib'in soyundan yetmiş altı adamı, yani Ali, Ca'far ve Aqil'in soyundan gelenleri getirdi. Onlar, kargaşadan kaçarak Hicaz'dan Mısır'a kaçmışlardı. El-Mu'tazz onların sponsorluğunu ve terk edilmesini emretti, İsa ise Filistin valisi olarak atandı {atıf:muruj-al-dhahab, s. 551-552}."
  id: "Amir Shaybani datang dari Mesir ke Samarra pada tahun 253 H, membawa kekayaan besar, dan tujuh puluh enam orang dari keturunan Abu Talib, keturunan Ali, Ja'far, dan Aqil. Mereka meninggalkan Hijaz melarikan diri dari kekacauan ke Mesir. Al-Mu'tazz memerintahkan dukungan dan pengabaian mereka, dan Isa diangkat menjadi gubernur Palestina {cite:muruj-al-dhahab, hlm. 551-552}."
