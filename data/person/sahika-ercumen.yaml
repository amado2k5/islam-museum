summary:
  ar: "غوّاصة حرة تركية وأخصائية تغذية، وُلدت في جناق قلعة سنة 1985. حاملة أرقام قياسية عالمية في عدة فئات من الغوص الحر؛ سجّلت سنة 2011 رقمًا معترفًا به في موسوعة غينيس بقطع 110 أمتار تحت الجليد بأنفاس واحدة، ورقمًا في الوزن المتغير دون زعانف بلغ 100 متر سنة 2021، ووصلت إلى 107 أمتار في أكتوبر 2025."
  en: "Turkish freediver and dietitian, born in Çanakkale in 1985. A world record holder in several freediving disciplines, she set a Guinness-recognised 110 m under-ice dynamic apnea record in 2011 and a 100 m variable-weight no-fins record in 2021, and reached 107 m in October 2025."
  ur: "ترک آزاد غوطہ خور اور ماہرِ غذائیات، جو 1985 میں چناق قلعہ میں پیدا ہوئیں۔ آزاد غوطہ خوری کی کئی قسموں میں عالمی ریکارڈ ہولڈر؛ 2011 میں انہوں نے ایک ہی سانس میں برف کے نیچے 110 میٹر کا گنیز تسلیم شدہ ریکارڈ قائم کیا، 2021 میں بغیر پنکھوں کے متغیر وزن میں 100 میٹر کا ریکارڈ بنایا، اور اکتوبر 2025 میں 107 میٹر تک پہنچیں۔"
