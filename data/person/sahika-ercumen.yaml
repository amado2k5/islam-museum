summary:
  ar: "غوّاصة حرة تركية وأخصائية تغذية، وُلدت في جناق قلعة سنة 1985. حاملة أرقام قياسية عالمية في عدة فئات من الغوص الحر؛ سجّلت سنة 2011 رقمًا معترفًا به في موسوعة غينيس بقطع 110 أمتار تحت الجليد بأنفاس واحدة، ورقمًا في الوزن المتغير دون زعانف بلغ 100 متر سنة 2021، ووصلت إلى 107 أمتار في أكتوبر 2025."
  en: "Turkish freediver and dietitian, born in Çanakkale in 1985. A world record holder in several freediving disciplines, she set a Guinness-recognised 110 m under-ice dynamic apnea record in 2011 and a 100 m variable-weight no-fins record in 2021, and reached 107 m in October 2025."
  ur: "ترک آزاد غوطہ خور اور ماہرِ غذائیات، جو 1985 میں چناق قلعہ میں پیدا ہوئیں۔ آزاد غوطہ خوری کی کئی قسموں میں عالمی ریکارڈ ہولڈر؛ 2011 میں انہوں نے ایک ہی سانس میں برف کے نیچے 110 میٹر کا گنیز تسلیم شدہ ریکارڈ قائم کیا، 2021 میں بغیر پنکھوں کے متغیر وزن میں 100 میٹر کا ریکارڈ بنایا، اور اکتوبر 2025 میں 107 میٹر تک پہنچیں۔"
  es: "Apneadora y dietista turca, nacida en Çanakkale en 1985. Poseedora de récords mundiales en varias disciplinas de apnea, estableció un récord Guinness de apnea dinámica bajo el hielo de 110 m en 2011 y un récord de 100 m sin aletas con peso variable en 2021, y alcanzó los 107 m en octubre de 2025."
  fr: "Apnéiste et diététicienne turque, née à Çanakkale en 1985. Détentrice de records du monde dans plusieurs disciplines d'apnée, elle a établi un record Guinness de 110 m en apnée dynamique sous glace en 2011 et un record de 100 m en apnée à poids variable sans palmes en 2021, et a atteint 107 m en octobre 2025."
  tr: "1985 yılında Çanakkale'de doğan Türk serbest stil dalgıcı ve beslenme uzmanı. Serbest dalışın çeşitli kategorilerinde dünya rekorları kırdı; 2011'de buz altında 110 metreyi tek nefeste geçerek Guinness Dünya Rekoru rekoru kırdı, 2021'de yüzgeçsiz değişken ağırlıkta 100 metre rekoru kırdı ve Ekim 2025'te 107 metreye ulaştı."
  id: "Seorang penyelam gaya bebas asal Turki dan spesialis nutrisi, lahir di Canakkale pada tahun 1985. Memegang rekor dunia di beberapa kategori freediving; pada tahun 2011, ia mencetak rekor Guinness World Record dengan melewati 110 meter di bawah es dalam satu tarikan napas, dan rekor berat variabel tanpa sirip sebesar 100 meter pada tahun 2021, mencapai 107 meter pada Oktober 2025."
