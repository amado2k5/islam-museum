summary:
  ar: "أحد الأولياء التسعة في جاوة (ت. 1506)، مؤسس قيري كداتون قرب غريسيك، المدرسة التي صارت مركزًا دينيًا وسياسيًا نشر الإسلام في شرق جاوة ومنه إلى مادورا ولومبوك وكاليمانتان وسولاويزي ومالوكو. تقول المرويات إنه ابن مولانا إسحاق المالقي الذي أُلقي به رضيعًا في البحر فأنقذه بحارة نياي غيدي بيناتيه في غريسيك وربّته، ثم درس عند سونن أمبل وكان رادين فاتح زميله، وعُرف بصرامته الأرثوذكسية وبألعاب الأطفال والأغاني الجاوية المنسوبة إليه."
  en: "One of the nine Wali Songo of Java (d. 1506), founder of Giri Kedaton near Gresik, the school that became a religious and political centre spreading Islam through East Java and onward to Madura, Lombok, Kalimantan, Sulawesi and Maluku. Tradition makes him a son of Maulana Ishak of Melaka who as an infant was set adrift at sea, rescued by the sailors of the Gresik merchant Nyai Gede Pinatih and raised by her; he studied under Sunan Ampel alongside Raden Patah, was known for orthodox strictness, and is credited with Javanese children's games and songs still in use."
  ur: "جاوا کے نو اولیا میں سے ایک (وفات 1506ء)، گریسیک کے قریب گیری کداتون کے بانی — وہ مدرسہ جو دینی و سیاسی مرکز بن کر مشرقی جاوا اور وہاں سے مادورا، لومبوک، کالیمانتان، سولاویسی اور مالوکو تک اسلام کی اشاعت کا ذریعہ بنا۔ روایت کے مطابق وہ ملاکا کے مولانا اسحاق کے بیٹے تھے جنھیں شیر خوارگی میں سمندر میں بہا دیا گیا؛ گریسیک کی تاجر بیوہ نیائی گیدے پیناتیح کے ملاحوں نے انھیں بچایا اور انھی نے پرورش کی؛ انھوں نے سونن امپل سے تعلیم پائی، رادین پاتاہ ان کے ہم سبق تھے، وہ راست اعتقادی کی سختی کے لیے مشہور تھے اور جاوا کے بچوں کے کھیل اور گیت ان سے منسوب ہیں۔"

