id: person/ali-ibn-muhammad-al-sulayhi
class: person
label: { ar: "علي بن محمد الصليحي القائم باليمن" }
summary:
  ar: "أبو الحسن علي بن محمد الصليحي، القائم باليمن ومؤسس الدولة الصليحية؛ كان أبوه قاضياً باليمن، فاستماله الداعي عامر بن عبد الله الرواحي وهو دون البلوغ وأوصى له بكتبه فتضلع من علوم الباطنية الإسماعيلية، ثم صار يحج بالناس داعياً في الطريق قرابة خمس عشرة سنة وشاع أنه يملك اليمن بأسره؛ فلما كان سنة تسع وعشرين وأربعمائة ارتقى جبل مسور وهو أعلى جبال اليمن ذروة ومعه ستون رجلاً حالفهم بمكة على الموت، فأحاط به عشرون ألف ضارب فلم ينزلوا عنه وانصرفوا عنه؛ وكان يدعو للمستنصر صاحب مصر خفية ويخاف من نجاح صاحب تهامة ويداريه حتى قتله بالسم مع جارية أهداها له بالكدراء، ثم استأذن المستنصر في إظهار الدعوة فأذن له فطوى البلاد وافتتح الحصون سريعاً واستقر ملكه في صنعاء، وحلف أن لا يولي تهامة إلا من وزن له مائة ألف دينار فوزنتها زوجته أسماء بنت شهاب عن أخيها سعيد بن شهاب فولاه؛ وعزم على الحج سنة ثلاث وسبعين في ألفي فارس منهم من آل الصليحي مائة وستون شخصاً فهجمه سعيد الأحول بن نجاح قرب المهجم فقتله وقتل أخاه وسائر الصليحيين معه، ورُفع رأسه على رأس عود مظلمة ورجع الأحول إلى زبيد سالماً غانماً {cite:shadharat-dhahab p. 354-356}."
  en: "Ali b. Muhammad al-Sulayhi, founder of Yemen's Sulayhid state; groomed young by the da'i Amir b. Abdallah al-Rawahi into Ismaili learning, he preached on the hajj road fifteen years, then in 439 seized Jabal Maswar's summit with sixty sworn men and faced down twenty thousand; fearing Najah of Tihama he had him poisoned by the gifted slave-girl al-Kudra', then won al-Mustansir's licence to preach openly, wrapped up the land and took the fortresses, seating his rule at Sanaa; on the hajj of 473 with two thousand horse Sa'id al-Ahwal b. Najah fell on him at al-Mahjam and killed him with his brother and the Sulayhids, and bore his head back to Zabid {cite:shadharat-dhahab p. 354-356}."
  es: "Ali b. Muhammad al-Sulayhi, fundador del estado Sulayhid de Yemen; educado desde joven por el da'i Amir b. Abdallah al-Rawahi en el saber ismaelita, predicó en el camino del Hajj durante quince años, luego en 439 tomó la cima de Jabal Maswar con sesenta hombres juramentados y se enfrentó a veinte mil; temiendo a Najah de Tihama, lo hizo envenenar por la talentosa esclava al-Kudra', luego obtuvo la licencia de al-Mustansir para predicar abiertamente, cubrió la tierra y tomó las fortalezas, estableciendo su gobierno en Sanaa; en el Hajj de 473 con dos mil jinetes Sa'id al-Ahwal b. Najah lo atacó en al-Mahjam y lo mató junto con su hermano y los Sulayhids, y llevó su cabeza de regreso a Zabid {cite:shadharat-dhahab p. 354-356}."
  fr: "Ali b. Muhammad al-Sulayhi, fondateur de l'État sulayhide du Yémen, fut initié dès son plus jeune âge à l'étude ismaélienne par le da'i Amir b. Abdallah al-Rawahi. Il prêcha sur la route du hajj pendant quinze ans, puis, en 439, s'empara du sommet du Jabal Maswar avec soixante hommes assermentés et affronta vingt mille hommes. Craignant Najah de Tihama, il le fit empoisonner par l'esclave al-Kudra', une jeune fille douée. Il obtint ensuite l'autorisation d'al-Mustansir de prêcher ouvertement, conquit le territoire et prit les forteresses, établissant son pouvoir à Sanaa. Lors du hajj de 473, avec deux mille cavaliers, Sa'id al-Ahwal b. Najah l'attaqua à al-Mahjam et le tua avec son frère et les Sulayhides, puis rapporta sa tête à Zabid (voir: shadharat-dhahab, p. 354-356)."
  ur: "علی بی محمد السلیحی، یمن کی سلیحی ریاست کے بانی؛ داعی امیر بی نے جوانوں کو تیار کیا۔ عبد اللہ الرواحی نے اسماعیلی سیکھنے میں حصہ لیا، اس نے 15 سال حج کے راستے پر تبلیغ کی، پھر 439 میں جبل مسور کی چوٹی پر ساٹھ قسم کے آدمیوں کے ساتھ قبضہ کیا اور بیس ہزار کا مقابلہ کیا۔ تہامہ کے نجاح کے خوف سے اس نے اسے تحفہ شدہ لونڈی الکدرہ کے ذریعہ زہر دیا، پھر المستنصر کو کھلے عام تبلیغ کرنے کا لائسنس حاصل کیا، زمین کو سمیٹ لیا اور قلعوں پر قبضہ کر لیا، صنعاء میں اپنی حکومت قائم کی۔ 473 کے حج کو دو ہزار گھوڑے کے ساتھ سعید الاہول بن۔ نجح المہجم میں اس پر گرا اور اسے اپنے بھائی اور سلیقہ کے ساتھ قتل کر دیا اور اس کا سر واپس زبید کی طرف لے جایا۔ 354-356}۔"
  tr: "Yemen valisi ve Süleyhid devletinin kurucusu Ebu el-Hasan Ali bin Muhammed el-Süleyhi, babası Yemen'de yargıçtı; ergenlikteyken vaiz Emir bin Abdullah el-Rawahi tarafından baştan çıkarıldı ve kitapları ona emanet edildi. İsmaili ezoterik bilimlerinde ustalaştı, ardından yaklaşık on beş yıl boyunca yolculukta insanlarla hac yapmaya başladı ve Yemen'in tamamını yönettiği geniş çapta bilindi. 429 Hicri yılına ulaştığında, altmış adamla birlikte, yirmi bin saldırganla çevrili olarak Mekke'ye ölüme yemin ettiği altmış adamla birlikte Yemen'in dağlarının en yüksek zirvesi olan Maswar Dağı'na tırmandı Onlar atından inip ondan uzaklaşmadılar; gizlice Mısır hükümdarı el-Mustansir için dua etti, Tihama hükümdarının başarısından korktu ve onu sakladı, ta ki Mustansir ve ona hediye ettiği bir köle kızla birlikte zehirle öldürene kadar. Bunun üzerine el-Mustansir daveti açmak için izin istedi, bu yüzden toprakları fethetmek, kaleleri hızla fethetmek ve Sana'a'da hüküm sürmek için izin verdi. Tihama'ya sadece yüz bin dinar ağırlığında birini vereceğine yemin etti; bu değeri kardeşi Seyid bin Şihab adına tarttı; yetmiş üçüncü yılda, aralarında iki bin süvariyle Hac yapmaya karar verdi Al-Suleyhi ailesinden yüz altmış kişi, Sa'id Al-Ahwal ibn Najah tarafından saldırıya uğradı; Necah ile birlikte kardeşi ve Suleyhi kabilesinin geri kalanını öldürdü. Başını koyu bir sopanın başına kaldırdı ve El-Ahval, Zabid'e sağ salim ve zaferle döndü {cite:shadharat-dhahab s. 354-356}."
  id: "Abu al-Hasan Ali ibn Muhammad al-Sulayhi, gubernur Yaman dan pendiri negara Sulayhid, yang ayahnya adalah seorang hakim di Yaman, digoda oleh pengkhotbah Amir ibn Abdullah al-Rawahi saat ia masih pubertas, yang mempercayakan buku-bukunya kepadanya. Ia menguasai ilmu esoterik Ismaili, kemudian mulai melakukan ziarah bersama orang-orang di jalan selama sekitar lima belas tahun, dan menjadi diketahui luas bahwa ia menguasai seluruh Yaman. Ketika ia mencapai tahun 429 H, ia mendaki Gunung Maswar, puncak tertinggi di pegunungan Yaman, ditemani enam puluh orang yang ia janjikan untuk mati ke Mekah, dikelilingi oleh dua puluh ribu penyerang Mereka tidak turun darinya dan berpaling; ia diam-diam berdoa untuk al-Mustansir, penguasa Mesir, takut akan keberhasilan penguasa Tihama, dan menyembunyikannya hingga ia membunuhnya dengan racun bersama seorang budak perempuan yang ia berikan kepadanya di al-Kadra. Kemudian al-Mustansir meminta izin untuk membuka undangan itu, sehingga ia memberi izin untuk menaklukkan tanah itu, dengan cepat menaklukkan benteng, dan mendirikan kekuasaannya di Sana'a. Ia bersumpah tidak akan memberikan Tihama kecuali untuk seseorang yang beratnya seratus ribu dinar, yang ditimbang oleh istrinya Asma bint Shihab atas nama saudaranya Sa'id ibn Shihab, yang mengangkatnya; ia memutuskan untuk melaksanakan Haji pada tahun tujuh puluh tiga dengan dua ribu kavaleri di antara mereka Dari keluarga Al-Sulayhi, seratus enam puluh orang diserang oleh Sa'id Al-Ahwal ibn Najah di dekat serangan, membunuhnya bersama saudaranya dan seluruh suku Sulayhi bersamanya. Ia mengangkat kepalanya di atas kepala tongkat gelap, dan Al-Ahwal kembali ke Zabid dengan selamat dan kemenangan {cite:shadharat-dhahab hlm. 354-356}."
