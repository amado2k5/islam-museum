id: person/ali-ibn-muhammad-al-sulayhi
class: person
label: { ar: "علي بن محمد الصليحي القائم باليمن" }
summary:
  ar: "أبو الحسن علي بن محمد الصليحي، القائم باليمن ومؤسس الدولة الصليحية؛ كان أبوه قاضياً باليمن، فاستماله الداعي عامر بن عبد الله الرواحي وهو دون البلوغ وأوصى له بكتبه فتضلع من علوم الباطنية الإسماعيلية، ثم صار يحج بالناس داعياً في الطريق قرابة خمس عشرة سنة وشاع أنه يملك اليمن بأسره؛ فلما كان سنة تسع وعشرين وأربعمائة ارتقى جبل مسور وهو أعلى جبال اليمن ذروة ومعه ستون رجلاً حالفهم بمكة على الموت، فأحاط به عشرون ألف ضارب فلم ينزلوا عنه وانصرفوا عنه؛ وكان يدعو للمستنصر صاحب مصر خفية ويخاف من نجاح صاحب تهامة ويداريه حتى قتله بالسم مع جارية أهداها له بالكدراء، ثم استأذن المستنصر في إظهار الدعوة فأذن له فطوى البلاد وافتتح الحصون سريعاً واستقر ملكه في صنعاء، وحلف أن لا يولي تهامة إلا من وزن له مائة ألف دينار فوزنتها زوجته أسماء بنت شهاب عن أخيها سعيد بن شهاب فولاه؛ وعزم على الحج سنة ثلاث وسبعين في ألفي فارس منهم من آل الصليحي مائة وستون شخصاً فهجمه سعيد الأحول بن نجاح قرب المهجم فقتله وقتل أخاه وسائر الصليحيين معه، ورُفع رأسه على رأس عود مظلمة ورجع الأحول إلى زبيد سالماً غانماً {cite:shadharat-dhahab p. 354-356}."
  en: "Ali b. Muhammad al-Sulayhi, founder of Yemen's Sulayhid state; groomed young by the da'i Amir b. Abdallah al-Rawahi into Ismaili learning, he preached on the hajj road fifteen years, then in 439 seized Jabal Maswar's summit with sixty sworn men and faced down twenty thousand; fearing Najah of Tihama he had him poisoned by the gifted slave-girl al-Kudra', then won al-Mustansir's licence to preach openly, wrapped up the land and took the fortresses, seating his rule at Sanaa; on the hajj of 473 with two thousand horse Sa'id al-Ahwal b. Najah fell on him at al-Mahjam and killed him with his brother and the Sulayhids, and bore his head back to Zabid {cite:shadharat-dhahab p. 354-356}."
