summary:
  ar: "أحمد اليسوي، شيخ صوفي تركي من آسيا الوسطى، وُلد في سيرام (إسفيجاب) في تركستان في النصف الثاني من القرن الخامس الهجري، وتتلمذ في بخارى على يوسف الهمداني، وخلفه سنة 555هـ، وتوفي في يسي سنة 562هـ/1166م، وقبره مزار لملوك وأمراء الترك، ونُسب إليه «ديوان الحكمة» {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
  en: "Ahmad Yasawi, Turkish Sufi shaykh of Central Asia, born at Sayram (Isfijab) in Turkistan in the second half of the fifth/eleventh century. He studied at Bukhara under Yusuf Hamadhani, succeeded him in 555/1160, and died at Yasi in 562/1166. His tomb became a place of pilgrimage for kings and princes, and the Diwan-i Hikmet is ascribed to him {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
