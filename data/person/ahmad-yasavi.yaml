summary:
  ar: "أحمد اليسوي، شيخ صوفي تركي من آسيا الوسطى، وُلد في سيرام ⁦(إسفيجاب)⁩ في تركستان في النصف الثاني من القرن الخامس الهجري، وتتلمذ في بخارى على يوسف الهمداني، وخلفه سنة 555هـ، وتوفي في يسي سنة 562هـ/1166م، وقبره مزار لملوك وأمراء الترك، ونُسب إليه «ديوان الحكمة» {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
  en: "Ahmad Yasawi, Turkish Sufi shaykh of Central Asia, born at Sayram (Isfijab) in Turkistan in the second half of the fifth/eleventh century. He studied at Bukhara under Yusuf Hamadhani, succeeded him in 555/1160, and died at Yasi in 562/1166. His tomb became a place of pilgrimage for kings and princes, and the Diwan-i Hikmet is ascribed to him {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
  es: "Ahmad Yasawi, jeque sufí turco de Asia Central, nació en Sayram (Isfijab), en Turkistán, en la segunda mitad del siglo V/XI. Estudió en Bujará con Yusuf Hamadhani, a quien sucedió en 555/1160, y falleció en Yasi en 562/1166. Su tumba se convirtió en lugar de peregrinación para reyes y príncipes, y se le atribuye el Diwan-i Hikmet {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
  fr: "Ahmad Yasawi, cheikh soufi turc d'Asie centrale, naquit à Sayram (Isfijab) au Turkestan dans la seconde moitié du Ve/XIe siècle. Il étudia à Boukhara auprès de Yusuf Hamadhani, lui succéda en 555/1160 et mourut à Yasi en 562/1166. Son tombeau devint un lieu de pèlerinage pour les rois et les princes, et le Diwan-i Hikmet lui est attribué (voir Encyclopaedia of Islam, vol. 1, p. 320)."
  ur: "احمد یساوی، وسطی ایشیا کے ترک صوفی شیخ، پانچویں/گیارہویں صدی کے دوسرے نصف میں ترکستان کے سیرام ⁦(اسفیجاب)⁩ میں پیدا ہوئے۔ اس نے بخارا میں یوسف ہمدانی کے ماتحت تعلیم حاصل کی، 555/1160 میں اس کا جانشین ہوا، اور 562/1166 میں یاسی میں وفات پائی۔ ان کا مقبرہ بادشاہوں اور شہزادوں کے لیے زیارت گاہ بن گیا، اور دیوان حکمت ان سے منسوب ہے۔ 1 ص۔ 320}۔"
