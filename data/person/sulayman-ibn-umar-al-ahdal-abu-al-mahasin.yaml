summary:
  ar: "المحدّث اليمني أبو المحاسن سليمان بن عمر الأهدل الزبيدي، ولد بزبيد سنة 1137 هـ، ويلقّب بمحدّث اليمن، وله مؤلفات منها شرح منظومة في مصطلح الحديث."
  en: "The Yemeni traditionist Abu al-Mahasin Sulayman ibn Umar al-Ahdal al-Zabidi, born at Zabid in 1137 AH and known as the traditionist of Yemen; he wrote works including a commentary on a versified treatise on hadith terminology."
  es: "El tradicionalista yemení Abu al-Mahasin Sulayman ibn Umar al-Ahdal al-Zabidi, nacido en Zabid en el año 1137 de la Hégira y conocido como el tradicionalista de Yemen, escribió obras que incluyen un comentario sobre un tratado en verso sobre la terminología de los hadices."
  fr: "Le traditionniste yéménite Abu al-Mahasin Sulayman ibn Umar al-Ahdal al-Zabidi, né à Zabid en 1137 AH et connu comme le traditionniste du Yémen; il a écrit des œuvres comprenant un commentaire sur un traité versifié sur la terminologie des hadiths."
  ur: "یمنی روایت دان ابو المحسین سلیمان بن عمر الاحدال الزبیدی، 1137 ہجری میں زبید میں پیدا ہوئے اور یمن کے روایت پسند کے طور پر جانا جاتا ہے۔ اس نے حدیث کی اصطلاحات پر ایک مستند مقالے کی تفسیر سمیت کام لکھا۔"
  tr: "Yemenli hadis âlimi Ebu el-Mahasin Süleyman ibn Ömer el-Ahdal el-Zubeydi, 1137 Hicri yılında Zabid'de doğmuştur. Yemen'in hadis âlimi olarak bilinir ve hadis terimleri üzerine bir şiir üzerine bir tefsir de dahil olmak üzere eserler kaleme almıştır."
  id: "Ulama hadis Yaman, Abu al-Mahasin Sulayman ibn Umar al-Ahdal al-Zubaidi, lahir di Zabid pada tahun 1137 H. Ia dikenal sebagai ulama Hadis Yaman, dan ia menulis karya-karya termasuk komentar atas puisi tentang terminologi hadis."
