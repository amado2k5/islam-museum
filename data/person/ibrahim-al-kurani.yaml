summary:
  ar: "إبراهيم بن حسن بن شهاب الدين الشهراني الشهرزوري الكوراني، برهان الدين، مجتهد من فقهاء الشافعية وعالم بالحديث، ولد بشهران من أعمال شهرزور سنة ١٠٢٥هـ وسكن المدينة وتوفي بها ودفن بالبقيع سنة ١١٠١هـ."
  en: "Ibrahim ibn Hasan ibn Shihab al-Din al-Shahrani al-Shahrazuri al-Kurani, Burhan al-Din, a mujtahid among the Shafi'i jurists and a scholar of hadith, born at Shahran in the district of Shahrazur in 1025 AH, who settled in Medina, died there and was buried at al-Baqi' in 1101 AH (1690)."
