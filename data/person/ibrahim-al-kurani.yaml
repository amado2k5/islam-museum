  ar: "إبراهيم الكوراني"
  en: "Ibrahim al-Kurani"
  es: "Ibrahim al-Kurani"
  fr: "Ibrahim al-Kurani"
  ur: "ابراہیم الکرانی"
roles: [faqih]
gender: male
summary:
  ar: "إبراهيم بن حسن بن شهاب الدين الشهراني الشهرزوري الكوراني، برهان الدين، مجتهد من فقهاء الشافعية وعالم بالحديث، ولد بشهران من أعمال شهرزور سنة ١٠٢٥هـ وسكن المدينة وتوفي بها ودفن بالبقيع سنة ١١٠١هـ."
  en: "Ibrahim ibn Hasan ibn Shihab al-Din al-Shahrani al-Shahrazuri al-Kurani, Burhan al-Din, a mujtahid among the Shafi'i jurists and a scholar of hadith, born at Shahran in the district of Shahrazur in 1025 AH, who settled in Medina, died there and was buried at al-Baqi' in 1101 AH (1690)."
  es: "Ibrahim ibn Hasan ibn Shihab al-Din al-Shahrani al-Shahrazuri al-Kurani, Burhan al-Din, un mujtahid entre los juristas shafi'íes y un erudito de hadices, nació en Shahran en el distrito de Shahrazur en 1025 AH, que se estableció en Medina, murió allí y fue enterrado en al-Baqi' en 1101 AH (1690)."
  fr: "Ibrahim ibn Hasan ibn Shihab al-Din al-Shahrani al-Shahrazuri al-Kurani, Burhan al-Din, un mujtahid parmi les juristes Shafi'i et un érudit du hadith, né à Shahran dans le district de Shahrazur en 1025 AH, qui s'est installé à Médine, y est mort et a été enterré à al-Baqi' en 1101 AH (1690)."
  ur: "ابراہیم بن حسن بن شہاب الدین الشہرانی الشہرازی الکرانی، برہان الدین، شافعی فقہاء میں سے ایک مجتہد اور محدث حدیث، 1025 ہجری میں شہرازور کے شہر شہران میں پیدا ہوئے، جو مدینہ میں مقیم ہوئے، وہیں الباری میں وفات پائی۔ (1690)۔"
  tr: "İbrahim bin Hasan ibn Şihabeddin el-Şehrani el-Şahrazuri el-Kurani, Burhan al-Din, Şafii fıhilleri arasında bir müctehid ve hadis âlimi olarak, 1025 Hicri yılında Şehrezur eserlerinde Şehrezur'da doğmuş, Medine'ye yerleşmiş, orada ölmüş ve 1101 Hicri yılında el-Baqi'de defnedilmiştir."
  id: "Ibrahim ibn Hasan ibn Shihab al-Din al-Shahrani al-Shahrazuri al-Kurani, Burhan al-Din, seorang mujtahid di antara para ahli hukum Shafi'i dan ulama hadis, lahir di Shahrazur dalam karya Shahrazur pada tahun 1025 H, menetap di Madinah, meninggal di sana, dan dimakamkan di al-Baqi' pada tahun 1101 H."
