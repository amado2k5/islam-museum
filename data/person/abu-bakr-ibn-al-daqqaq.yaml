summary:
  ar: "القاضي أبو بكر محمد بن محمد البغدادي المعروف بابن الدقاق، فقيه أصولي، شرح «المختصر» وولي القضاء بكرخ بغداد {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ولد سنة ست وثلاثمائة ومات سنة اثنتين وتسعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 62}."
  en: "Qadi Abu Bakr Muhammad ibn Muhammad al-Baghdadi, known as Ibn al-Daqqaq, a jurist and scholar of legal theory who commented on the 'Mukhtasar' and held the judgeship in al-Karkh, Baghdad {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Born in 306 and died in 392 {cite:tabaqat-fuqaha-abbas-1981 p. 62}."
  fr: "Le cadi Abu Bakr Muhammad ibn Muhammad al-Baghdadi, dit Ibn al-Daqqaq, juriste et savant en théorie du droit qui commenta le « Mukhtasar » et exerça la judicature à al-Karkh, à Bagdad {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Né en 306 et mort en 392 {cite:tabaqat-fuqaha-abbas-1981 p. 62}."
  es: "Qadi Abu Bakr Muhammad ibn Muhammad al-Baghdadi, conocido como Ibn al-Daqqaq, jurista y estudioso de la teoría jurídica que comentó sobre el 'Mukhtasar' y ocupó el cargo de juez en al-Karkh, Bagdad {cita:tabaqat-fuqaha-abbas-1981 p. 62}. Nacido en 306 y muerto en 392 {cita:tabaqat-fuqaha-abbas-1981 p. 62}."
