summary:
  ar: "القاضي أبو بكر محمد بن محمد البغدادي المعروف بابن الدقاق، فقيه أصولي، شرح «المختصر» وولي القضاء بكرخ بغداد {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ولد سنة ست وثلاثمائة ومات سنة اثنتين وتسعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 62}."
  en: "Qadi Abu Bakr Muhammad ibn Muhammad al-Baghdadi, known as Ibn al-Daqqaq, a jurist and scholar of legal theory who commented on the 'Mukhtasar' and held the judgeship in al-Karkh, Baghdad {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Born in 306 and died in 392 {cite:tabaqat-fuqaha-abbas-1981 p. 62}."
