summary:
  ar: "مستشرق وعالم نقود ألماني في خدمة روسيا، مدير المتحف الآسيوي لأكاديمية العلوم في بطرسبورغ وأمين مكتبتها، نشر سنة 1826 فهرس النقود الإسلامية فيه {cite:fraehn-recensio-numorum-muhammedanorum-1826 p. 10}."
  en: "German orientalist and numismatist in Russian service, director of the Asiatic Museum of the St Petersburg Academy of Sciences and chief librarian of its library, who published the catalogue of its Islamic coins in 1826 {cite:fraehn-recensio-numorum-muhammedanorum-1826 p. 10}."
  ur: "روس کی خدمت میں جرمن مستشرق اور سکہ شناس، سینٹ پیٹرزبرگ اکیڈمی آف سائنسز کے ایشیائی عجائب گھر کے ڈائریکٹر اور اس کے کتب خانے کے ناظم، جنہوں نے 1826ء میں وہاں کے اسلامی سکوں کا کیٹلاگ شائع کیا {cite:fraehn-recensio-numorum-muhammedanorum-1826 p. 10}۔"
  es: "Orientalista y numismático alemán al servicio de Rusia, director del Museo Asiático de la Academia de Ciencias de San Petersburgo y bibliotecario jefe de su biblioteca, que publicó el catálogo de sus monedas islámicas en 1826 {cita:fraehn-recensio-numorum-muhammedanorum-1826 p. 10}."
  fr: "Orientaliste et numismate allemand au service de la Russie, directeur du Musée asiatique de l'Académie des sciences de Saint-Pétersbourg et bibliothécaire en chef de sa bibliothèque, qui publia le catalogue de ses monnaies islamiques en 1826 {cite:fraehn-recensio-numorum-muhammedanorum-1826 p. 10}."
  tr: "Rusya'da hizmet eden Alman oryantalist ve nümizmatik, St. Petersburg'daki Bilimler Akademisi Asya Müzesi'nin müdürü ve kütüphanecisi, 1826'da İslami paralar dizinini yayımladı {cite:fraehn-recensio-numorum-muhammedanorum-1826 s. 10}."
  id: "Seorang orientalis dan numismatis Jerman yang melayani Rusia, direktur Museum Asia Akademi Ilmu Pengetahuan di St. Petersburg dan pustakawannya, menerbitkan pada tahun 1826 indeks koin Islam {cite:fraehn-recensio-numorum-muhammedanorum-1826 hlm. 10}."
