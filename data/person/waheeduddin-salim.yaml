summary:
  ar: "عالم وأديب ولغوي أردي من باني بت، عمل سكرتيرًا لسر سيد أحمد خان حتى وفاة سر سيد، وحرّر صحفًا منها «الزمرد» و«مسلم غازيت»، ثم التحق بدار الترجمة في حيدر آباد فألّف كتابه المشهور «وضع اصطلاحات»، أول كتاب أردي في علم وضع المصطلحات، وعُيّن عند قيام جامعة عثمانية أول أستاذ مساعد للأردية فيها ثم أستاذًا. اختلفت المصادر في سنتي مولده ووفاته."
  en: "Urdu scholar, writer and linguist from Panipat. He served as secretary to Sir Syed Ahmad Khan until Sir Syed's death, edited newspapers including Zamindar and the Muslim Gazette, then joined Hyderabad's Dar-ul-Tarjuma, where he wrote his best-known book Vaz-i Istalahat, the first Urdu book on terminology. When Osmania University was founded he became its first assistant professor of Urdu and later professor. The sources disagree on his birth and death years."
  ur: "پانی پت کے اردو عالم، ادیب اور ماہر لسانیات۔ سرسید احمد خان کے سیکرٹری رہے اور ان کی وفات تک یہ رفاقت قائم رہی، «زمیندار» اور «مسلم گزٹ» سمیت کئی اخبارات کی ادارت کی، پھر حیدرآباد کے دارالترجمہ سے وابستہ ہوئے جہاں اپنی مشہور کتاب «وضع اصطلاحات» لکھی جو اصطلاح سازی پر اردو کی پہلی کتاب مانی جاتی ہے۔ جامعہ عثمانیہ قائم ہوئی تو وہ اردو کے پہلے اسسٹنٹ پروفیسر مقرر ہوئے اور بعد ازاں پروفیسر بنے۔ ان کے سنہ پیدائش و وفات میں مصادر مختلف ہیں۔"
