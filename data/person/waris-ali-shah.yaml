summary:
  ar: "متصوف هندي (1817–1905) من ديوا في بره بنكي، مؤسس الطريقة الوارثية. بايع في صباه الشيخ خادم علي شاه ولازمه حتى وفاته، ثم أجاز الناس في طريقته على مذهب متسامح أبقى أتباعه على أديانهم، وسافر إلى مكة وأوروبا فقابل سلطان العثمانيين وبسمارك، وضريحه في ديوا مزار مشهور."
  en: "Indian Sufi (1817–1905) of Dewa in Barabanki, founder of the Warsi Sufi order. As a boy he became the disciple of Khadim Ali Shah and remained with him until the latter's death; he then admitted people of several faiths to his order without requiring them to change their religion, travelled repeatedly to Mecca and through Europe, where he met the Ottoman sultan and Bismarck, and his shrine at Dewa remains a major place of devotion."
  ur: "ہندوستانی صوفی بزرگ (1817ء–1905ء) جن کا تعلق دیوا، بارہ بنکی سے تھا اور جو سلسلہ وارثیہ کے بانی تھے۔ لڑکپن میں خادم علی شاہ کے مرید ہوئے اور ان کی وفات تک ان کے مرید و خلیفہ رہے، پھر اپنے سلسلے میں لوگوں کو داخل کیا اور پیروکاروں کو ان کے اپنے مذہب پر قائم رہنے کی اجازت دی؛ بارہا مکہ گئے اور یورپ کے سفر میں عثمانی سلطان اور بسمارک سے ملاقات کی، اور دیوا میں ان کا مزار مشہور ہے۔"
