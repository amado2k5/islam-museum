    note: "Two independent texts state his personal Sufi discipleship and his founding of an order, which is the lane's test for a sufi segment. The English text states that he was the founder of the Warsi Sufi order, that as a boy he attached himself to Khadim Ali Shah, a dervish of Golaganj, Lucknow, and remained with him until the latter's death, and that he admitted people to his spiritual order. The Urdu text, independently written, states that he founded the Warsiyya silsila, that in boyhood he became the murid of Khadim Ali Shah and remained his murid and khalifa until the latter's death, and that his affiliation was with the Qadiri and Chishti schools of Sufism. No source names a madhhab for him, so no second segment is recorded; Wikidata's religion value is Islam in general."
