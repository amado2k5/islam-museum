id: person/kulthum-ibn-iyad-al-qushayri
class: person
label: { ar: "كلثوم بن عياض القشيري" }
gender: male
summary:
  ar: "قائد عربي هزمته البربر بملوية؛ نجا من وقعة جنده منهم بلج بن بشر القشيري الذي دخل بهم الأندلس سنة أربع وعشرين ومائة {cite:nafh-tib-maqqari p. 273}. ويذكر الكتاب أن هشاماً ولاه إفريقية، وأنه قُتل في الغزو، فأرسل هشام حنظلة بن صفوان إلى إفريقية، وتولى بعدها حفص بن الوليد الحضرمي مصر. {cite:salabi-umayyad-state-2020 p.485}"
  en: "Arab commander defeated by the Berbers at the Malwiya; the Syrian survivors under Balj b. Bishr crossed into al-Andalus in 124 {cite:nafh-tib-maqqari p. 273}."
  es: "Comandante árabe derrotado por los bereberes en Malwiya; los supervivientes sirios bajo el mando de Balj b. Bishr cruzaron a al-Andalus en 124 {cite:nafh-tib-maqqari p. 273}."
  fr: "Commandant arabe vaincu par les Berbères à la Malwiya; les survivants syriens sous Balj b. Bishr traversèrent en al-Andalus en 124 {cite:nafh-tib-maqqari p. 273}."
  ur: "مالویہ میں بربروں کے ہاتھوں عرب کمانڈر کو شکست؛ بلج بی کے تحت شامی زندہ بچ جانے والے۔ بشر 124 میں اندلس میں داخل ہوا۔ 273}۔"
  tr: "Mulviye'de Berberiler tarafından yenilen bir Arap komutan; 124 Hicri yılında Endülüs'e giren Balaj bin Bişr el-Kuşayri ile birlikte savaştan sağ kurtuldu {atıf:nafh-tib-maqqari, s. 273}. Kitapta Hisham'ın onu İfrikiye valisi olarak atadığı ve işgalde öldürüldüğü belirtilir. Hisham, Hanzala ibn Safvan'ı İfrikiye'ye gönderdi, ardından Hafs ibn al-Walid al-Hadrami Mısır'ı ele geçirdi. {cite:Salabi-umayyad-state-2020 s.485}"
  id: "Seorang komandan Arab yang dikalahkan oleh Berber di Mulwiya; ia selamat dari pertempuran pasukannya di antaranya, Balaj ibn Bishr al-Qushayri, yang masuk ke al-Andalusia bersama mereka pada tahun 124 H {cite:nafh-tib-maqqari, hlm. 273}. Buku tersebut menyebutkan bahwa Hisham mengangkatnya sebagai gubernur Ifriqiya dan bahwa ia tewas dalam invasi tersebut. Hisham mengirim Hanzala ibn Safwan ke Ifriqiya, setelah itu Hafs ibn al-Walid al-Hadrami mengambil alih Mesir. {cite:salabi-umayyad-state-2020 hlm.485}"
