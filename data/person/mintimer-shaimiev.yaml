summary:
  ar: "سياسي روسي من تتارستان ⁦(مولود 1937)⁩، أول رئيس لجمهورية تتارستان (1991–2010)، قاد إعلان سيادتها (1990)، وأعاد بناء مساجد هُدمت في العهود السابقة وعُني بإحياء الثقافة الإسلامية فيها، ونال جائزة الملك فيصل لخدمة الإسلام (2007)، وسُمّي سفير اليونسكو للنوايا الحسنة للحوار بين الثقافات (2017)."
  en: "Russian politician from Tatarstan (born 1937), first President of the Republic of Tatarstan (1991–2010), who led its declaration of sovereignty (1990), rebuilt mosques destroyed in earlier eras and promoted the revival of Islamic culture there; King Faisal Prize for Service to Islam (2007) and UNESCO Goodwill Ambassador for intercultural dialogue (2017)."
  ur: "تاتارستان کے روسی سیاست دان ⁦(پیدائش 1937ء)⁩، جمہوریہ تاتارستان کے پہلے صدر ⁦(1991ء–2010ء)⁩، جنھوں نے اس کے اعلانِ خود مختاری ⁦(1990ء)⁩ کی قیادت کی، پچھلے ادوار میں منہدم مساجد دوبارہ تعمیر کرائیں اور وہاں اسلامی ثقافت کے احیا کی سرپرستی کی؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2007ء)⁩ اور بین الثقافتی مکالمے کے لیے یونیسکو کے خیرسگالی سفیر ⁦(2017ء)⁩۔"
