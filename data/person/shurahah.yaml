summary:
  ar: "امرأة أقرّت عند علي بالزنا وبها حمل، وكان لها زوج غائب بالشام، فحكم علي بجلدها ثم رجمها {cite:sallabi-ali-vol1 p. 303}{cite:sallabi-ali-vol1 p. 304}. ولم يذكر الكتاب نسبها."
  en: "A woman who confessed to zina before Ali while pregnant; her husband was away in Syria. Ali ordered her flogged and then stoned. The book gives no lineage."
  es: "Una mujer que confesó haber cometido adulterio ante Alí estando embarazada; su esposo se encontraba en Siria. Alí ordenó que la azotaran y luego la lapidaran. El libro no menciona su linaje."
  fr: "Une femme enceinte a avoué l'adultère à Ali; son mari était en Syrie. Ali a ordonné qu'elle soit fouettée puis lapidée. Le livre ne mentionne pas sa lignée."
  ur: "وہ عورت جس نے حمل کے دوران علی کے سامنے زنا کا اقرار کیا۔ اس کا شوہر شام میں تھا۔ علی نے اسے کوڑے مارنے کا حکم دیا اور پھر سنگسار کیا۔ کتاب کوئی نسب نہیں دیتی۔"
