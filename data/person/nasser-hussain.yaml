summary:
  ar: "لاعب كريكت إنجليزي سابق ومعلّق، وُلد في مدراس بالهند سنة 1968 لأسرة مسلمة وانتقل مع أسرته إلى إنجلترا سنة 1975. لعب لإسيكس (1987-2004) ولإنجلترا في 96 مباراة اختبار و88 مباراة دولية ليوم واحد، وقاد إنجلترا في 45 مباراة اختبار (1999-2003) فحققت في عهده أربعة انتصارات متتالية في السلاسل وصعدت إلى المركز الثالث عالميا، وسجّل أعلى نتيجة له 207 أمام أستراليا سنة 1997، ثم صار من أبرز معلّقي سكاي سبورتس وفازت سيرته الذاتية «اللعب بالنار» بجائزة أفضل سيرة ذاتية في جوائز الكتاب الرياضي البريطاني سنة 2005."
  en: "English former cricketer and commentator, born in Madras, India, in 1968 into a Muslim family, whose family moved to England in 1975. He played for Essex (1987–2004) and for England in 96 Tests and 88 One Day Internationals, captained England in 45 Tests from 1999 to 2003 — overseeing four consecutive series wins and a rise to third in the Test rankings — scored a highest Test score of 207 against Australia in 1997, and became a leading Sky Sports commentator; his autobiography Playing With Fire won Best Autobiography at the British Sports Book Awards in 2005."
  ur: "انگلینڈ کے سابق کرکٹ کھلاڑی اور مبصر، جو 1968 میں مدراس، بھارت میں ایک مسلم خاندان میں پیدا ہوئے اور 1975 میں خاندان کے ساتھ انگلینڈ منتقل ہوئے۔ انھوں نے ایسیکس (1987ء–2004ء) اور انگلینڈ کے لیے 96 ٹیسٹ اور 88 ایک روزہ بین الاقوامی میچ کھیلے، 1999ء سے 2003ء تک 45 ٹیسٹ میچوں میں انگلینڈ کی کپتانی کی — ان کے دور میں ٹیم نے مسلسل چار سیریز جیتیں اور ٹیسٹ درجہ بندی میں تیسرے نمبر پر پہنچی — 1997 میں آسٹریلیا کے خلاف 207 کا سب سے بڑا ٹیسٹ سکور بنایا، اور اسکائی اسپورٹس کے ممتاز مبصر بنے؛ ان کی خودنوشت «پلے انگ ود فائر» نے 2005 میں برٹش اسپورٹس بک ایوارڈز میں بہترین خودنوشت کا اعزاز جیتا۔"
