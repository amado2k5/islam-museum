summary:
  ar: "لاعب كريكت إنجليزي سابق ومعلّق، وُلد في مدراس بالهند سنة 1968 لأسرة مسلمة وانتقل مع أسرته إلى إنجلترا سنة 1975. لعب لإسيكس (1987-2004) ولإنجلترا في 96 مباراة اختبار و88 مباراة دولية ليوم واحد، وقاد إنجلترا في 45 مباراة اختبار (1999-2003) فحققت في عهده أربعة انتصارات متتالية في السلاسل وصعدت إلى المركز الثالث عالميا، وسجّل أعلى نتيجة له 207 أمام أستراليا سنة 1997، ثم صار من أبرز معلّقي سكاي سبورتس وفازت سيرته الذاتية «اللعب بالنار» بجائزة أفضل سيرة ذاتية في جوائز الكتاب الرياضي البريطاني سنة 2005."
  en: "English former cricketer and commentator, born in Madras, India, in 1968 into a Muslim family, whose family moved to England in 1975. He played for Essex (1987–2004) and for England in 96 Tests and 88 One Day Internationals, captained England in 45 Tests from 1999 to 2003 — overseeing four consecutive series wins and a rise to third in the Test rankings — scored a highest Test score of 207 against Australia in 1997, and became a leading Sky Sports commentator; his autobiography Playing With Fire won Best Autobiography at the British Sports Book Awards in 2005."
  ur: "انگلینڈ کے سابق کرکٹ کھلاڑی اور مبصر، جو 1968 میں مدراس، بھارت میں ایک مسلم خاندان میں پیدا ہوئے اور 1975 میں خاندان کے ساتھ انگلینڈ منتقل ہوئے۔ انھوں نے ایسیکس ⁦(1987ء–2004ء)⁩ اور انگلینڈ کے لیے 96 ٹیسٹ اور 88 ایک روزہ بین الاقوامی میچ کھیلے، 1999ء سے 2003ء تک 45 ٹیسٹ میچوں میں انگلینڈ کی کپتانی کی — ان کے دور میں ٹیم نے مسلسل چار سیریز جیتیں اور ٹیسٹ درجہ بندی میں تیسرے نمبر پر پہنچی — 1997 میں آسٹریلیا کے خلاف 207 کا سب سے بڑا ٹیسٹ سکور بنایا، اور اسکائی اسپورٹس کے ممتاز مبصر بنے؛ ان کی خودنوشت «پلے انگ ود فائر» نے 2005 میں برٹش اسپورٹس بک ایوارڈز میں بہترین خودنوشت کا اعزاز جیتا۔"
  es: "Exjugador de críquet y comentarista inglés, nacido en Madrás, India, en 1968 en el seno de una familia musulmana, que se trasladó a Inglaterra en 1975. Jugó para Essex (1987-2004) y para Inglaterra en 96 partidos de prueba y 88 partidos internacionales de un día, fue capitán de Inglaterra en 45 partidos de prueba entre 1999 y 2003, logrando cuatro victorias consecutivas en series y el ascenso al tercer puesto en la clasificación de partidos de prueba, anotó la puntuación más alta en un partido de prueba de 207 contra Australia en 1997 y se convirtió en un destacado comentarista de Sky Sports; su autobiografía, Playing With Fire, ganó el premio a la Mejor Autobiografía en los British Sports Book Awards en 2005."
  fr: "Ancien joueur de cricket et commentateur anglais, né à Madras, en Inde, en 1968 dans une famille musulmane, dont la famille a déménagé en Angleterre en 1975. Il a joué pour l'Essex (1987-2004) et pour l'Angleterre dans 96 tests et 88 ODI, a été capitaine de l'Angleterre dans 45 tests de 1999 à 2003 — supervisant quatre victoires consécutives en série et une ascension à la troisième place du classement des tests — a marqué un score de 207 contre l'Australie en 1997, et est devenu un commentateur vedette de Sky Sports; son autobiographie Playing With Fire a remporté le prix de la meilleure autobiographie aux British Sports Book Awards en 2005."
  tr: "1968'de Hindistan'ın Madras şehrinde Müslüman bir ailede doğan eski bir İngiliz kriketçi ve yorumcu olan Sher, 1975'te ailesiyle birlikte İngiltere'ye taşındı. Essex için (1987-2004) ve İngiltere için 96 Test maçı ile 88 tek günlük uluslararası maçta oynadı. 1999-2003 yılları arasında 45 Test maçında İngiltere'yi yönetti, liderliğinde üst üste dört seri galibiyeti elde etti ve dünya çapında üçüncü sıraya yükseldi. 1997'de Avustralya'ya karşı en yüksek skoru olan 207'yi kaydetti, ardından Sky Sports'un en önde gelen yorumcularından biri oldu ve otobiyografisi 'Playing with Fire' 2005'te British Sports Book Awards'ta En İyi Biyografi ödülünü kazandı."
  id: "Mantan pemain kriket dan komentator Inggris, lahir di Madras, India, pada tahun 1968 dari keluarga Muslim, ia pindah bersama keluarganya ke Inggris pada tahun 1975. Ia bermain untuk Essex (1987-2004) dan untuk Inggris dalam 96 pertandingan Test serta 88 pertandingan satu hari internasional. Ia memimpin Inggris dalam 45 pertandingan Test (1999-2003), meraih empat kemenangan seri berturut-turut di bawah kepemimpinannya, naik ke posisi ketiga dunia. Ia mencatat skor tertinggi 207 melawan Australia pada tahun 1997, kemudian menjadi salah satu komentator paling menonjol di Sky Sports, dan otobiografinya 'Playing with Fire' memenangkan penghargaan Biografi Terbaik di British Sports Book Awards tahun 2005."
