summary:
  ar: "خزانة وعارض جيش السلطان السلجوقي محمد بن ملكشاه، ثم وزير الخليفة المسترشد ووزير مسعود بن محمد، وتوفي ببغداد سنة 533هـ أو 532هـ، وكتب بالفارسية كتابًا عن أحداث عصره نقله عماد الدين الأصفهاني إلى العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  en: "Treasurer and army-inspector of the Saljuq sultan Muhammad ibn Malikshah, later vizier to the caliph al-Mustarshid and to Mas'ud ibn Muhammad, who died in Baghdad in 533 or 532. He wrote a Persian account of the events of his time, which 'Imad al-Din translated into Arabic {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
