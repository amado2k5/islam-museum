id: person/sharaf-al-din-abu-nasr-al-kashani
class: person
label:
  ar: "شرف الدين أبو نصر الكاشاني"
  en: "Sharaf al-Din Abu Nasr al-Kashani"
  es: "Sharaf al-Din Abu Nasr al-Kashani"
  fr: "Sharaf al-Din Abu Nasr al-Kashani"
  ur: "شرف الدین ابو نصر الکشانی"
gender: male
roles: [vizier, historian]
summary:
  ar: "خزانة وعارض جيش السلطان السلجوقي محمد بن ملكشاه، ثم وزير الخليفة المسترشد ووزير مسعود بن محمد، وتوفي ببغداد سنة 533هـ أو 532هـ، وكتب بالفارسية كتابًا عن أحداث عصره نقله عماد الدين الأصفهاني إلى العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  en: "Treasurer and army-inspector of the Saljuq sultan Muhammad ibn Malikshah, later vizier to the caliph al-Mustarshid and to Mas'ud ibn Muhammad, who died in Baghdad in 533 or 532. He wrote a Persian account of the events of his time, which 'Imad al-Din translated into Arabic {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  es: "Tesorero e inspector del ejército del sultán selyúcida Muhammad ibn Malikshah, más tarde visir del califa al-Mustarshid y de Mas'ud ibn Muhammad, quien murió en Bagdad en 533 o {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  fr: "Trésorier et inspecteur de l'armée du sultan seldjoukide Muhammad ibn Malikshah, plus tard vizir du calife al-Mustarshid et de Mas'ud ibn Muhammad, décédé à Bagdad en 533 ou {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  ur: "سلجوق سلطان محمد بن مالک شاہ کے خزانچی اور فوجی انسپکٹر، بعد میں خلیفہ المسترشد اور مسعود ابن محمد کے وزیر، جو 533 یا 532 میں بغداد میں فوت ہوئے تھے۔ اس نے اپنے زمانے کے واقعات کا ایک فارسی بیان لکھا، جس کا 'عماد الدین نے عربی میں ترجمہ کیا:'۔ 1 ص۔ 546}۔"
  tr: "Selçuklu Sultanı Muhammed bin Malikşah'ın ordusuna karşı veznedar olarak görev yaptı ve ardından Halife el-Müstarşid'in veziri ve Mes'ud bin Muhammed'in veziri olarak görev yaptı. 533 Hicri veya 532 Hicri Bağdat'ta öldü. Döneminin olaylarını Farsça olarak yazdı; İmaddin el-İsfahani bu kitabı Arapçaya çevirdi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 546}."
  id: "Ia menjabat sebagai bendahara dan menentang tentara Sultan Seljuk Muhammad ibn Malikshah, kemudian menjadi wazir Khalifah al-Mustarshid dan wazir Mas'ud ibn Muhammad. Ia meninggal di Baghdad pada tahun 533 H atau 532 H. Ia menulis sebuah buku dalam bahasa Persia tentang peristiwa pada zamannya, yang diterjemahkan Imad al-Din al-Isfahani ke dalam bahasa Arab {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 546}."
