  ar: "قاعد في دولة الحاكم بأمر الله كان الحاكم يخافه ويقول لأخته ست الملك: ما لي ولهذا الرجل. فاصطنعت ست الملك بينهما، وفي رواية أهل مصر أن ابن دوّاس أعطاها عبدين مغربيين موثوقين فقتلا الحاكم ليلًا على المقطم وحملاه إلى ابن دوّاس فحمله إليها؛ ووعدته ست الملك بالملك ومائة ألف ثم دبرت قتله على يد نسيم صاحب الستر والسيف فقيل لأهل مصر «هذا قاتل مولانا الحاكم» {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
