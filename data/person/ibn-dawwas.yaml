id: person/ibn-dawwas
class: person
label: { ar: "ابن دوّاس القاعد", en: "Ibn Dawwas", es: "Ibn Dawwas", fr: "Ibn Dawwas", ur: "ابن داؤس" }
summary:
  ar: "قاعد في دولة الحاكم بأمر الله كان الحاكم يخافه ويقول لأخته ست الملك: ما لي ولهذا الرجل. فاصطنعت ست الملك بينهما، وفي رواية أهل مصر أن ابن دوّاس أعطاها عبدين مغربيين موثوقين فقتلا الحاكم ليلًا على المقطم وحملاه إلى ابن دوّاس فحمله إليها؛ ووعدته ست الملك بالملك ومائة ألف ثم دبرت قتله على يد نسيم صاحب الستر والسيف فقيل لأهل مصر «هذا قاتل مولانا الحاكم» {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
  tr: "O, El-Hakim bi-Amr Allah devletinde oturuyordu. Hükümdar ondan korktu ve kız kardeşi Hanımefendi el-Mülk'e dedi ki: Bu adamla ne işim var? Böylece Hanımefendi el-Malik aralarında bir anlaşmazlık uydurdu ve Mısır halkının anlatımlarına göre, İbn Davas ona iki güvenilir Faslı köle verdi, onlar hükümdarı gece Mokattam'da öldürdü ve İbn Davas'a götürdü, İbn Davas da onu oraya getirdi; Hanımefendi el-Malik ona kralı ve yüz bin vaat etti, sonra da kılıç ve kılıcın sahibi Nasim'in elinden öldürmeyi ayarladı. Mısır halkına \"Bu, efendimiz el-Hakim'in katili\" denildi {atıf:Muntazam-ibn-al-jawzi J.7 s.302-305}."
  id: "Ia duduk di negara Al-Hakim bi-Amr Allah. Sang penguasa takut kepadanya dan berkata kepada saudara perempuannya, Lady al-Mulk: Apa hubunganku dengan pria ini? Jadi Lady al-Malik mengarang perselisihan di antara mereka, dan menurut catatan rakyat Mesir, Ibn Dawas memberikan dua budak Maroko kepercayaannya, yang membunuh penguasa itu pada malam hari di Mokattam dan membawanya kepada Ibn Dawas, yang membawanya ke sana; Lady al-Malik menjanjikan raja dan seratus ribu, lalu mengatur pembunuhan di tangan Nasim, pemilik penutup dan pedang. Rakyat Mesir diberitahu, \"Inilah pembunuh tuan kami al-Hakim\" {cite:Muntazam-ibn-al-jawzi J.7 hlm.302-305}."
