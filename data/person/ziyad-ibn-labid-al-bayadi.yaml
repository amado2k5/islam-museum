summary:
  ar: صحابي أنصاري؛ أجمع رواة البلاذري على أن النبي ولّاه حضرموت، وكتب إليه أبو بكر لما استخلف بولاية كِندة والصَّدِف إلى
    ما كان يتولى من حضرموت.
  en: An Ansari Companion; al-Baladhuri's transmitters agree the Prophet appointed him over Hadramawt, and Abu Bakr on succeeding
    wrote him into the governorship of Kinda and al-Sadif in addition to what he held of Hadramawt.
  ur: "انصاری صحابی؛ بلاذری کے راوی متفق ہیں کہ نبی نے اسے حضرموت پر مقرر کیا اور ابو بکر نے جانشینی میں اسے اسی عہدے پر رکھا۔"
  es: "Un compañero de los Ansari; los transmisores de al-Baladhuri coinciden en que el Profeta lo designó para Hadramawt, y Abu Bakr, al sucederle, le otorgó el gobierno de Kinda y al-Sadif, además de lo que ya ostentaba sobre Hadramawt."
  fr: "Compagnon Ansari; les transmetteurs d'al-Baladhuri s'accordent à dire que le Prophète l'a nommé gouverneur du Hadramaout, et Abu Bakr, à son successeur, l'a inscrit dans le gouvernement de Kinda et d'al-Sadif en plus de celui qu'il détenait du Hadramaout."
