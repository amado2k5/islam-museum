summary:
  ar: "الحسين بن القاسم أبو علي الطبري الفقيه الشافعي ⁦(ت 350هـ)⁩؛ درس على أبي علي بن أبي هريرة وبرع في العلم وسكن بغداد، وصنّف كتاب «المحرر» وهو أول كتاب صُنّف في الخلاف، وصنّف كتاب «الإفصاح» في المذهب وكتاباً في الجدل وكتاباً في أصول الفقه، وتوفي ببغداد سنة خمسين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
  en: "Al-Husayn b. al-Qasim Abu 'Ali al-Tabari the Shafi'i jurist (d. 350); he studied under Abu 'Ali b. Abi Hurayra, excelled and settled at Baghdad, and composed al-Muharrar — the first book ever written on legal divergence — plus al-Ifsah on the madhhab, a book on jadal and one on usul al-fiqh; he died at Baghdad in 350 {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
  es: "Al-Husayn b. al-Qasim Abu 'Ali al-Tabari, el jurista shafi'í (m. 350); estudió con Abu 'Ali b. Abi Hurayra, sobresalió y se estableció en Bagdad, y compuso al-Muharrar —el primer libro jamás escrito sobre divergencia legal— además de al-Ifsah sobre la madhhab, un libro sobre jadal y otro sobre usul al-fiqh; murió en Bagdad en 350 {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
  fr: "Al-Husayn b. al-Qasim Abu 'Ali al-Tabari, le juriste shafi'ite (mort en 350); il étudia sous la direction d'Abu 'Ali b. Abi Hurayra, excella et s'établit à Bagdad, et composa al-Muharrar — le premier livre jamais écrit sur la divergence juridique — ainsi qu'al-Ifsah sur le madhhab, un livre sur le jadal et un autre sur l'usul al-fiqh; il mourut à Bagdad en 350 {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
  ur: "الحسین بی القاسم ابو علی الطبری شافعی فقیہ ⁦(متوفی 350)⁩؛ اس نے ابو علی بن علی سے تعلیم حاصل کی۔ ابی ہریرہ، بغداد میں فضیلت رکھتا اور آباد ہوا، اور المحرر - جو کہ قانونی اختلاف پر لکھی گئی پہلی کتاب ہے - کے علاوہ مذھب پر الفصاح، جدل پر ایک کتاب اور اصول الفقہ پر ایک کتاب؛ آپ کی وفات بغداد میں 350 میں ہوئی۔"
