summary:
  ar: "الحسين بن القاسم أبو علي الطبري الفقيه الشافعي (ت 350هـ)؛ درس على أبي علي بن أبي هريرة وبرع في العلم وسكن بغداد، وصنّف كتاب «المحرر» وهو أول كتاب صُنّف في الخلاف، وصنّف كتاب «الإفصاح» في المذهب وكتاباً في الجدل وكتاباً في أصول الفقه، وتوفي ببغداد سنة خمسين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
  en: "Al-Husayn b. al-Qasim Abu 'Ali al-Tabari the Shafi'i jurist (d. 350); he studied under Abu 'Ali b. Abi Hurayra, excelled and settled at Baghdad, and composed al-Muharrar — the first book ever written on legal divergence — plus al-Ifsah on the madhhab, a book on jadal and one on usul al-fiqh; he died at Baghdad in 350 {cite:muntazam-ibn-al-jawzi j.7 p.8-9}."
