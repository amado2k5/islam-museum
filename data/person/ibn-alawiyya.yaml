summary:
  ar: "الأستاذ أبو عبد الله الحسين بن أحمد الهمذاني النحوي اللغوي المعروف بابن علوية، صاحب التصانيف وشيخ أهل حلب؛ أخذ عن ابن مجاهد وأبي بكر بن الأنباري وأبي عمر الزاهد؛ انتقل عن بغداد إلى حلب فاستوطنها ومات بها وكان الحمذانيون يعظمونه، ودخل على سيف الدولة فلما قيل له اجلس فاتخذت فضيلة لسيف الدولة، وله مواقف مع المتنبي في مجلس سيف الدولة {cite:shadharat-dhahab p. 72-73}."
  en: "Abu Abdallah al-Husayn b. Ahmad al-Hamadhani, called Ibn Alawiyya (d. 370, Aleppo) — grammarian and philologist, author, shaykh of Aleppo, settled there from Baghdad; at Sayf al-Dawla's court he took a seat unbidden — 'for the standing man is told sit down, not the seated' — with famous set-tos against al-Mutanabbi in the same majlis {cite:shadharat-dhahab p. 72-73}."
