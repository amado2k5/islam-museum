id: person/ibn-alawiyya
class: person
label: { ar: "الحسين بن أحمد ابن علوية", en: "Ibn Alawiyya al-Hamadhani", es: "Ibn Alawiyya al-Hamadhani", fr: "Ibn Alawiyya al-Hamadhani", ur: "ابن علویہ الحمدانی" }
died: { edtf: "0980~", hijri: "0370", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة سبعين وثلاثمائة بحلب {cite:shadharat-dhahab p. 72-73}." }
summary:
  ar: "الأستاذ أبو عبد الله الحسين بن أحمد الهمذاني النحوي اللغوي المعروف بابن علوية، صاحب التصانيف وشيخ أهل حلب؛ أخذ عن ابن مجاهد وأبي بكر بن الأنباري وأبي عمر الزاهد؛ انتقل عن بغداد إلى حلب فاستوطنها ومات بها وكان الحمذانيون يعظمونه، ودخل على سيف الدولة فلما قيل له اجلس فاتخذت فضيلة لسيف الدولة، وله مواقف مع المتنبي في مجلس سيف الدولة {cite:shadharat-dhahab p. 72-73}."
  en: "Abu Abdallah al-Husayn b. Ahmad al-Hamadhani, called Ibn Alawiyya (d. 370, Aleppo) — grammarian and philologist, author, shaykh of Aleppo, settled there from Baghdad; at Sayf al-Dawla's court he took a seat unbidden — 'for the standing man is told sit down, not the seated' — with famous set-tos against al-Mutanabbi in the same majlis {cite:shadharat-dhahab p. 72-73}."
  es: "Abu Abdullah al-Husayn b. Ahmad al-Hamadhani, llamado Ibn Alawiyya (m. 370, Alepo) — gramático y filólogo, autor, shaykh de Alepo, se estableció allí desde Bagdad; en la corte de Sayf al-Dawla tomó asiento sin ser invitado — 'porque al hombre de pie se le dice que se siente, no al sentado' — con famosos set-tos contra al-Mutanabbi en el mismo majlis {cite:shadharat-dhahab p. 72-73}."
  fr: "Abu Abdullah al-Husayn b. Ahmad al-Hamadhani, dit Ibn Alawiyya (mort en 370 à Alep) — grammairien et philologue, auteur, cheikh d'Alep, s'y installa en provenance de Bagdad; à la cour de Sayf al-Dawla, il prit place sans y être invité — « car on dit à l'homme debout de s'asseoir, pas à celui qui est assis » — avec des joutes oratoires célèbres contre al-Mutanabbi dans le même majlis {cite: shadharat-dhahab p. 72-73}."
  ur: "ابو عبداللہ الحسین بن احمد الحمدانی، جسے ابن علویہ ⁦(متوفی 370، حلب)⁩ کہا جاتا ہے - گرامر اور ماہر فلسفی، مصنف، حلب کے شیخ، بغداد سے وہاں آباد ہوئے؛ سیف الدولہ کے دربار میں اس نے بلا مبالغہ ایک نشست لی - 'کیونکہ کھڑے ہونے والے کو بیٹھنے سے کہا جاتا ہے نہ کہ بیٹھے ہوئے' - اسی مجلس میں المتنبی کے خلاف مشہور سیٹ ٹوس کے ساتھ۔ 72-73}۔"
  tr: "Profesör Ebu Abdullah el-Hüseyin ibn Ahmed el-Hamadhani, İbn Alaviye olarak bilinen dilbilimci ve dilbilimci, eserlerin yazarı ve Halep halkının şeyhi; İbn Mücahid, Ebu Bekir bin Anbari ve Ebu Ömer el-Zahid'in yanında eğitim aldı; Bağdat'tan Halep'e taşındı, orada yerleşti ve orada öldü; Hamdhaniler ona saygı duydu. Seyf-i Devle'nin emrinde göreve girdi ve oturması söylendiğinde Seyf-i Devle için papa olarak atandı. Sayf al-Dawla konseyinde el-Mutanabbi ile bazı ilişkileri oldu {atıf: shadharat-dhahab, s. 72-73}."
  id: "Profesor Abu Abdullah al-Husayn ibn Ahmad al-Hamadhani, seorang ahli tata bahasa dan ahli bahasa yang dikenal sebagai Ibn Alawiyyah, penulis karya dan sheikh masyarakat Aleppo; ia belajar di bawah bimbingan Ibn Mujahid, Abu Bakr ibn al-Anbari, dan Abu Umar al-Zahid; ia pindah dari Baghdad ke Aleppo, menetap di sana, dan meninggal di sana, di mana para Hamdhani menghormatinya. Ia masuk di bawah Sayf al-Dawla, dan ketika diperintahkan untuk duduk, ia diangkat sebagai paus untuk Sayf al-Dawla. Ia memiliki beberapa hubungan dengan al-Mutanabbi dalam dewan Sayf al-Dawla {cite:shadharat-dhahab, hlm. 72-73}."
