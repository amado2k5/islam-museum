summary:
  ar: "حميل بن بصرة بن وقاص بن حاجب بن غفار، أبو بصرة الغفاري، صحابي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} روى عن النبي وعن أبي ذر الغفاري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} روى عنه تميم بن فرع المهري وأبو الهيثم سليمان بن عمرو العتواري وعبيد بن جبر وعمرو بن العاص وأبو هريرة وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} أخرج له البخاري في «الأدب المفرد» ومسلم وأبو داود والنسائي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949}"
  en: "Humayl ibn Basra ibn Waqqas ibn Hajib ibn Ghifar, Abu Basra al-Ghifari, a Companion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} He narrated from the Prophet and from Abu Dhar al-Ghifari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} Those who narrated from him include Tamim ibn Fara' al-Mahri, Abu al-Haytham Sulayman ibn Amr al-Utwari, Ubayd ibn Jabr, Amr ibn al-As and Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949} Al-Bukhari in al-Adab al-mufrad, Muslim, Abu Dawud and al-Nasa'i included reports from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14949}"
