id: person/al-malik-al-mansur-hama
class: person
label: { ar: "الملك المنصور صاحب حماة", en: "al-Malik al-Mansur, lord of Hama" }
summary:
  ar: "صاحب حماة الملك المنصور محمد بن المظفر تقي الدين عمر بن شاهنشاه بن أيوب؛ سمع من أبي الظاهر بن عوف وجمع تاريخاً على السنين في مجلدات عُرف بتاريخه المنسوب إليه؛ وتملك حماة بعده ولده الناصر قلج أرسلان فأخذها منه الكامل وسجنه ثم أعطاها لأخيه الملك المظفر؛ توفي سنة سبع عشرة وستمائة {cite:shadharat-dhahab p. 77-78}."
  en: "Lord of Hama, al-Malik al-Mansur Muhammad ibn al-Muzaffar Taqi al-Din Umar ibn Shahanshah ibn Ayyub; he heard from Abu al-Zahir ibn Awf and compiled a history arranged by years in several volumes, known as the history attributed to him. After him his son al-Nasir Qilij Arslan ruled Hama until al-Kamil took it from him, imprisoned him, and gave it to his brother al-Malik al-Muzaffar; he died in 617 {cite:shadharat-dhahab p. 77-78}."
