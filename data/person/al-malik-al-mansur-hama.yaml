id: person/al-malik-al-mansur-hama
class: person
label: { ar: "الملك المنصور صاحب حماة", en: "al-Malik al-Mansur, lord of Hama", es: "al-Malik al-Mansur, lord of Hama", fr: "al-Malik al-Mansur, lord of Hama", ur: "المالک المنصور، حما کا رب" }
summary:
  ar: "صاحب حماة الملك المنصور محمد بن المظفر تقي الدين عمر بن شاهنشاه بن أيوب؛ سمع من أبي الظاهر بن عوف وجمع تاريخاً على السنين في مجلدات عُرف بتاريخه المنسوب إليه؛ وتملك حماة بعده ولده الناصر قلج أرسلان فأخذها منه الكامل وسجنه ثم أعطاها لأخيه الملك المظفر؛ توفي سنة سبع عشرة وستمائة {cite:shadharat-dhahab p. 77-78}."
  en: "Lord of Hama, al-Malik al-Mansur Muhammad ibn al-Muzaffar Taqi al-Din Umar ibn Shahanshah ibn Ayyub; he heard from Abu al-Zahir ibn Awf and compiled a history arranged by years in several volumes, known as the history attributed to him. After him his son al-Nasir Qilij Arslan ruled Hama until al-Kamil took it from him, imprisoned him, and gave it to his brother al-Malik al-Muzaffar; he died in 617 {cite:shadharat-dhahab p. 77-78}."
  es: "Señor de Hama, al-Malik al-Mansur Muhammad ibn al-Muzaffar Taqi al-Din Umar ibn Shahanshah ibn Ayyub; escuchó de Abu al-Zahir ibn Awf y compiló una historia organizada por años en varios volúmenes, conocida como la historia que se le atribuye. Después de él, su hijo al-Nasir Qilij Arslan gobernó Hama hasta que al-Kamil se la arrebató, lo encarceló y se la dio a su hermano al-Malik al-Muzaffar; murió en 617 {cite:shadharat-dhahab p. 77-78}."
  fr: "Al-Malik al-Mansur Muhammad ibn al-Muzaffar Taqi al-Din Umar ibn Shahanshah ibn Ayyub, seigneur de Hama, reçut d'Abu al-Zahir ibn Awf un récit historique en plusieurs volumes, organisé par années et connu sous le nom d'histoire qui lui est attribuée. Son fils, al-Nasir Qilij Arslan, régna ensuite sur Hama jusqu'à ce qu'al-Kamil le lui prenne, l'emprisonne et le confie à son frère al-Malik al-Muzaffar. Il mourut en 617 (cf. Hadharat-Dhahab, p. 77-78)."
  ur: "رب حما، المالک المنصور محمد بن المظفر تقی الدین عمر بن شہنشاہ ابن ایوب؛ اس نے ابو الظاہر بن عوف سے سنا اور کئی جلدوں میں برسوں کے حساب سے ایک تاریخ مرتب کی، جسے ان سے منسوب تاریخ کہا جاتا ہے۔ اس کے بعد اس کے بیٹے النصیر قلیج ارسلان نے حما پر حکومت کی یہاں تک کہ الکامل نے اسے اس سے چھین لیا، اسے قید کر لیا اور اسے اپنے بھائی المالک المظفر کو دے دیا۔ ان کا انتقال 617 میں ہوا 77-78}۔"
