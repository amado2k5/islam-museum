summary:
  ar: "الإمام الحافظ أبو عمرو بن الصلاح؛ أملى مجلساً سماه «الأحاديث الكلية» جمع فيه الأحاديث الجوامع التي يُقال إن مدار الدين عليها، فاشتمل على ستة وعشرين حديثاً أخذها النووي وبنى عليها «الأربعين». وهو الكردي الشهرزوري الموصلي الشافعي؛ تفقه بشهرزور على والده ثم أعاد على ابن يونس بالموصل وسافر إلى خراسان فحصل علم الحديث هناك، وتولى المدرسة الصلاحية بالقدس ثم درس بالرواحية ودار حديث الأشرف ومدرسة ست الشام بدمشق؛ وإذا أطلق «الشيخ» في علم الحديث فالمراد به كما أشار العراقي في ألفيته؛ من تصانيفه علوم الحديث وأدب المفتي والمستفتي وطبقات الشافعية الذي اختصره النووي {cite:shadharat-dhahab p. 229-230} {cite:tarikh-islam-dhahabi p. 185-186}."
  en: "The hadith master Abu Amr ibn al-Salah; author of the dictation 'al-Ahadith al-Kulliyya', twenty-six comprehensive hadiths on which al-Nawawi built his 'Arba'un'."
  ur: "حافظِ حدیث ابو عمرو ابن الصلاح؛ «الأحاديث الكلية» کی املاء کے مصنف، چھبیس جامع احادیث جن پر نووی نے «الأربعین» قائم کی؛ شہرزور، موصل، خراسان، قدس اور دمشق کے سفر کے بعد دار الحدیث اشرفیہ اور مدرسہ ست الشام کے شیخ {cite:shadharat-dhahab p. 229-230} {cite:tarikh-islam-dhahabi p. 185-186}۔"
