summary:
  ar: "الإمام الحافظ أبو عمرو بن الصلاح؛ أملى مجلساً سماه «الأحاديث الكلية» جمع فيه الأحاديث الجوامع التي يُقال إن مدار الدين عليها، فاشتمل على ستة وعشرين حديثاً أخذها النووي وبنى عليها «الأربعين». وهو الكردي الشهرزوري الموصلي الشافعي؛ تفقه بشهرزور على والده ثم أعاد على ابن يونس بالموصل وسافر إلى خراسان فحصل علم الحديث هناك، وتولى المدرسة النظامية بالقدس ثم درس بالرواحية ودار حديث الأشرف ومدرسة ست الشام بدمشق؛ وإذا أطلق «الشيخ» في علم الحديث فالمراد به كما أشار العراقي في ألفيته؛ من تصانيفه علوم الحديث وأدب المفتي والمستفتي وطبقات الشافعية الذي اختصره النووي {cite:shadharat-dhahab p. 229-230}."
  en: "The hadith master Abu Amr ibn al-Salah; author of the dictation 'al-Ahadith al-Kulliyya', twenty-six comprehensive hadiths on which al-Nawawi built his 'Arba'un'."
