summary:
  ar: "الصلاح عبد الرحمن بن عثمان الشهرزوري الكردي؛ والد الحافظ تقي الدين ابن الصلاح؛ كان من جلّة مشايخ الأكراد المشار إليهم وقرأ ولده الفقه أولاً عليه ثم نقله إلى الموصل فاشتغل بها؛ وكان قد دخل بغداد واشتغل بها واشتغل أيضاً على شرف الدين بن أبي عصرون {cite:wafayat-ayan}."
  en: "Al-Salah Abd al-Rahman b. Uthman al-Shahrazuri (b. c. 539, d. 618 Aleppo) — father of the great hadith scholar Ibn al-Salah and himself one of the noted Kurdish shaykhs; studied under Sharaf al-Din Ibn Abi Asrun {cite:wafayat-ayan}."
  fr: "Al-Salah Abd al-Rahman b. Uthman al-Shahrazuri (né vers 539, mort en 618 Alep) – père du grand savant de hadith Ibn al-Salah et lui-même l’un des célèbres cheikhs kurdes  ; a étudié sous Sharaf al-Din Ibn Abi Asrun {cite:wafayat-ayan}."
  es: "Al-Salah Abd al-Rahman b. Uthman al-Shahrazuri (539 a. C., m. 618 en Alepo): padre del gran erudito en hadices Ibn al-Salah y él mismo uno de los jeques kurdos más destacados; estudió con Sharaf al-Din Ibn Abi Asrun {cita:wafayat-ayan}."
  ur: "الصلاح عبدالرحمٰن بی۔ عثمان الشہرازوری ⁦(بی سی 539، وفات 618 حلب)⁩ - عظیم حدیث کے اسکالر ابن الصلاح کے والد اور خود بھی مشہور کرد شیخوں میں سے ایک ہیں۔ شرف الدین ابن ابی عصرون سے مطالعہ کیا۔"
  tr: "El-Salah Abdurrahman bin Osman El-Şehrazuri el-Kürdi; Hafız Takieddin İbn El-Selah'ın babası; yukarıda bahsedilen önde gelen Kürt şeyhlerinden biriydi. Oğlu önce onun yanında hukuk eğitimi aldı, sonra onu Musul'a transfer edip orada çalıştı; Bağdat'a girdi ve orada çalıştı, ayrıca Şerafeddin bin Ebi Asroon'un yanında çalıştı."
  id: "Al-Salah Abdul Rahman bin Uthman Al-Shahrazuri Al-Kurdi; ayah dari Hafiz Taqi al-Din Ibn Al-Salah; ia termasuk di antara para sheikh Kurdi terkemuka yang disebutkan di atas. Putranya pertama kali belajar hukum di bawah bimbingannya, lalu memindahkannya ke Mosul dan bekerja di sana; ia masuk ke Baghdad dan bekerja di sana, serta di bawah Sharaf al-Din bin Abi Asroon {cite:wafayat-ayan}."
