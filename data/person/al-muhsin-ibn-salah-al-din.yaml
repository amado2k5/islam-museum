summary:
  ar: "الملك المحسن عين الدين أحمد بن السلطان صلاح الدين؛ روى عن ابن صدقة الحراني والبوصيري وعني بالحديث أتم عناية وكتب الكثير، وكان متواضعاً متزهداً كثير الإفضال على المحدثين وفيه تشيع قليل؛ توفي بحلب في المحرم {cite:shadharat-dhahab p. 162}."
  en: "Al-Malik al-Muhsin Ayn al-Din Ahmad (d. Muharram 634) — a son of Salah al-Din who turned hadith scholar: transmitted from Ibn Sadaqa al-Harrani and al-Busiri, wrote copiously, humble and ascetic, generous to the hadith folk, with a slight Shi'i leaning; died at Aleppo {cite:shadharat-dhahab p. 162}."
  fr: "Al-Malik al-Muhsin Ayn al-Din Ahmad (d. Muharram 634) - un fils de Salah al-Din qui est devenu érudit du hadith : transmis d'Ibn Sadaqa al-Harrani et al-Busiri, a écrit copieusement, humble et ascétique, généreux envers les gens du hadith, avec un léger penchant chiite ; Mort à Alep {cite:shadharat-dhahab p. 162}."
  es: "Al-Malik al-Muhsin Ayn al-Din Ahmad (m. Muharram 634) — hijo de Salah al-Din que se convirtió en erudito de hadices: transmitido por Ibn Sadaqa al-Harrani y al-Busiri, escribió profusamente, humilde y ascético, generoso con la gente de hadices, con una ligera inclinación chiíta; murió en Alepo {cite:shadharat-dhahab p. 162}."
  ur: "المالک المحسن عین الدین احمد ⁦(متوفی محرم 634)⁩ - صلاح الدین کا ایک بیٹا جو حدیث کے اسکالر ہوا: ابن صدق الحرانی اور البصیری سے نقل کیا گیا، اس نے بہت زیادہ شائستہ، عاجز اور پرہیزگار، اہل حدیث کے لیے فیاض، شیعوں کے ساتھ لکھا۔ حلب میں وفات پائی۔ 162}۔"
