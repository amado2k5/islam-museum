summary:
  ar: "محمد سعيد رمضان البوطي ⁦(1929–2013)⁩ عالم سني أشعري سوري كردي الأصل، عميد كلية الشريعة بجامعة دمشق سابقاً، غزير التأليف في العقيدة والفقه والسيرة. قُتل في تفجير بجامع الإيمان بدمشق سنة 2013 إبان الحرب الأهلية، بعد سنوات من تأييده للحكومة السورية."
  en: "Muhammad Sa'id Ramadan al-Bouti (1929–2013) was a Syrian Sunni Ash'ari scholar of Kurdish origin, former dean of the Faculty of Sharia at Damascus University and a prolific author on creed, fiqh and sira. He was killed in a bombing at al-Iman Mosque in Damascus in 2013 during the civil war, after years of support for the Syrian government — a position that remains contested."
  ur: "محمد سعید رمضان بوطی ⁦(1929–2013)⁩ کرد نسل کے شامی سنی اشعری عالم تھے، جامعہ دمشق کی کلیۂ شریعہ کے سابق ڈین اور عقیدہ، فقہ اور سیرت پر غزیر مصنف۔ 2013 میں خانہ جنگی کے دوران دمشق کی جامع ایمان میں ایک بم دھماکے میں مارے گئے، شامی حکومت کی حمایت کے برسوں کے بعد — یہ موقف اب بھی متنازع ہے۔"
