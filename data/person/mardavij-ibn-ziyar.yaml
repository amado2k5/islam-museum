id: person/mardavij-ibn-ziyar
class: person
label: { ar: "مرداويج بن زيار الجيلي" }
summary:
  ar: "مؤسس دولة آل زيار بطبرستان وجرجان؛ استدعاه أسفار بن شيرويه من جيلان فحضر إليه فجعله أمير الجيش وأحسن إليه فقصدا طبرستان واستوليا عليها، وكان مرداويج من أجلاء أهل ديلم ومن كان يدعي أنه من ولد شيرويه بن قواد أخي كسرى أبرويز {cite:kamil-ibn-al-athir p. 130}."
  en: "Founder of the Ziyarid power in Tabaristan and Jurjan; summoned from Gilan by Asfar ibn Shirawayh who made him army-commander, together they took Tabaristan {cite:kamil-ibn-al-athir p. 130}."
  es: "Fundador del poder ziyarí en Tabaristán y Jurjan; llamado desde Gilán por Asfar ibn Shirawayh, quien lo nombró comandante del ejército, juntos tomaron Tabaristán {cite:kamil-ibn-al-athir p. 130}."
  fr: "Fondateur du pouvoir ziyaride au Tabaristan et au Jurjan; appelé de Gilan par Asfar ibn Shirawayh qui le nomma commandant de l'armée, ensemble ils prirent le Tabaristan {cite:kamil-ibn-al-athir p. 130}."
  ur: "طبرستان اور جرجان میں زیارد طاقت کا بانی؛ گیلان سے اسفر بن شیراویہ نے بلوایا جس نے اسے فوج کا سپہ سالار بنایا، انہوں نے مل کر تبرستان لے لیا۔ 130}۔"
  tr: "Tabaristan ve Jurcan'daki Ziyar hanedanının kurucusuydu; Asfar ibn Shiruwayh onu Jilan'dan çağırdı, bu yüzden yanına geldi, ordu komutanı olarak atadı ve iyi davrandı, böylece Tabaristan'a gidip şehri ele geçirdi. Mardavij, Daylam'ın en önde gelen kişilerinden biriydi ve Khosrow Abruiz'in kardeşi Shiruyah ibn Qawad'ın soyundan olduğunu iddia etti {cite:kamil-ibn-al-athir, s. 130}."
  id: "Pendiri dinasti Ziyar di Tabaristan dan Jurjan; Asfar ibn Shiruwayh memanggilnya dari Jilan, sehingga ia datang kepadanya, mengangkatnya sebagai komandan tentara, dan memperlakukannya dengan baik, sehingga ia pergi ke Tabaristan dan merebutnya. Mardavij adalah salah satu tokoh paling terkemuka di Daylam, dan ia mengaku sebagai keturunan Shiruyah ibn Qawad, saudara Khosrow Abruiz {cite:kamil-ibn-al-athir, hlm. 130}."
