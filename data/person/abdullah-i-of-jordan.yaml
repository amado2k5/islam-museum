summary:
  ar: "عبد الله الأول بن الحسين (2 فبراير 1882 – 20 يوليو 1951)، ثاني أبناء الشريف حسين بن علي من زوجته الأولى عبدية بنت عبد الله، ومؤسس إمارة شرق الأردن ثم المملكة الأردنية الهاشمية وأول ملوكها، المعروف بلقب الملك المؤسس. كان نائب مكة في البرلمان العثماني (1909–1914)، وقاد الجيش الشرقي في الثورة العربية الكبرى وحاصر الطائف والمدينة، ورفض تاج العراق الذي عرضه عليه مؤتمر عراقي سنة 1920، فأسس الإمارة في عمان في 11 أبريل 1921، وحكم أميرًا حتى الاستقلال فصار ملكًا في 25 مايو 1946، وضمّ الضفة الغربية سنة 1950، وكان شاعرًا أديبًا ازدهرت في بلاطه المجالس الأدبية. اغتاله عند مدخل المسجد الأقصى في القدس أثناء صلاة الجمعة شاب فلسطيني، فخلفه ابنه طلال."
  en: "Abdullah I bin Hussein (2 February 1882 – 20 July 1951) was the second son of Sharif Hussein bin Ali, by his first wife Abdiyya bint Abdullah, and the founder of the Emirate of Transjordan and then of the Hashemite Kingdom of Jordan, its first king, known as the Founder King. Deputy for Mecca in the Ottoman parliament (1909–1914), he commanded the Arab Eastern Army in the Great Arab Revolt, besieging Taif and Medina; proclaimed King of Iraq by the Iraqi Congress in 1920, he refused that crown, founded the emirate at Amman on 11 April 1921, ruled as Emir until independence made him king on 25 May 1946, annexed the West Bank in 1950, and kept a court where literary salons flourished, being himself a poet. He was assassinated at the entrance of al-Aqsa Mosque in Jerusalem during Friday prayers by a Palestinian gunman, and was succeeded by his son Talal."
  ur: "عبداللہ اول بن حسین (2 فروری 1882ء – 20 جولائی 1951ء) شریف حسین بن علی کے دوسرے بیٹے (ان کی پہلی اہلیہ عبدیہ بنت عبداللہ سے) اور امارتِ شرق اردن اور پھر مملکتِ اردن ہاشمیہ کے بانی اور اس کے پہلے بادشاہ تھے، جو «الملک المؤسس» کے لقب سے معروف ہیں۔ وہ عثمانی پارلیمان میں مکہ کے نائب رہے (1909ء–1914ء)، ثورۂ عربیہ کبریٰ میں مشرقی فوج کی قیادت کی اور طائف و مدینہ کا محاصرہ کیا؛ 1920ء میں عراق کی پیش کردہ بادشاہت سے انکار کے بعد 11 اپریل 1921ء کو عمان میں امارت قائم کی، 25 مئی 1946ء کو آزادی پر بادشاہ بنے، 1950ء میں مغربی کنارے کو ضم کیا، اور شاعر و ادیب ہونے کے ناطے ان کے دربار میں ادبی محفلیں سجا کرتی تھیں۔ جمعہ کی نماز کے دوران مسجد اقصیٰ کے دروازے پر ایک فلسطینی نوجوان نے انہیں قتل کر دیا؛ جانشین ان کے بیٹے طلال ہوئے۔"
