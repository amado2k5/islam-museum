summary:
  en: "An early Muslim Companion and skilled diplomat from Hadramawt; appointed by the Prophet as his envoy to al-Mundhir ibn Sawa, ruler of Bahrain, who accepted Islam alongside his people; served as governor of Bahrain under the Prophet, Abu Bakr, and Umar."
  ar: "صحابي جليل وفقيه من قادة المسلمين، من حضرموت؛ بعثه النبي بكتابه إلى المنذر بن ساوى عظيم البحرين فأسلم المنذر وقومه، وولاه النبي إمرة البحرين وجمع صدقاتها، واستمر والياً عليها في خلافتي أبي بكر وعمر."
