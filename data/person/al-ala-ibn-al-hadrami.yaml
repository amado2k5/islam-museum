label:
  ar: العلاء بن الحضرمي
  en: Al-Ala ibn al-Hadrami (Companion, governor of Bahrain)
summary:
  ar: صحابي من حضرموت، سكن أبوه مكة فولد بها العلاء؛ ولاه النبي البحرين وجعل له جباية، وأعطاه كتابا فيه فرائض الصدقة في الإبل والبقر والغنم والثمار والأموال، وأقره أبو بكر ثم عمر؛ روى عنه السائب بن يزيد وأبو هريرة، ويقال إنه أول مسلم ركب البحر للغزو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
  en: A Companion from Hadramawt, whose father settled in Mecca where al-Ala was born; the Prophet made him governor of Bahrain with the collection of alms and gave him a writing on the rates of zakat for camels, cattle, sheep, fruit and goods; Abu Bakr and Umar confirmed him; al-Sa'ib ibn Yazid and Abu Hurayra transmitted from him; he is said to be the first Muslim to ride the sea for a raid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
  ur: صحابی، حضرموت کے؛ والد مکہ میں آباد ہوئے تو العلاء وہیں پیدا ہوئے؛ نبی نے انہیں بحرین کا عامل بنایا اور زکوٰۃ کے فرائض کی تحریر دی؛ ابو بکر اور عمر نے بحال رکھا؛ سائب بن یزید اور ابو ہریرہ نے ان سے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}
