summary:
  ar: "بابسي سيدهوا (1938–2024) روائية باكستانية كتبت بالإنجليزية وأقامت في الولايات المتحدة. وُلدت في كراتشي لأسرة بارسية زرادشتية ونشأت في لاهور، وأصيبت بشلل الأطفال في الثانية من عمرها وعاشت آثاره طوال حياتها. اشتهرت بروايتها «Ice-Candy-Man» (1988؛ صدرت في الولايات المتحدة بعنوان «Cracking India» سنة 1991) عن تقسيم الهند، وقد حوّلتها ديبا مهتا إلى فيلم «Earth» (1998)، كما حوّلت روايتها «Water» (2006) إلى فيلم. نالت وسام «ستارة الامتياز» الباكستاني سنة 1991، وأُدخلت قاعة مشاهير الزرادشتيين سنة 2000، وتوفيت في هيوستن في 25 كانون الأول 2024."
  en: "Bapsi Sidhwa (1938–2024) was a Pakistani novelist who wrote in English and lived in the United States. Born in Karachi to a Parsi Zoroastrian family and raised in Lahore, she contracted polio at the age of two and lived with its effects all her life. She is best known for Ice-Candy-Man (1988; published in the United States as Cracking India, 1991), the Partition novel filmed by Deepa Mehta as Earth (1998); Mehta also filmed her novel Water (2006). She received Pakistan's Sitara-i-Imtiaz in 1991, was inducted into the Zoroastrian Hall of Fame in 2000, and died in Houston on 25 December 2024."
  ur: "بیپسی سدھوا (1938–2024) پاکستانی ناول نگار تھیں جو انگریزی میں لکھتی تھیں اور امریکا میں مقیم تھیں۔ کراچی میں ایک پارسی زرتشتی خاندان میں پیدا ہوئیں، لاہور میں پلیں بڑھیں، دو برس کی عمر میں پولیو کا شکار ہوئیں اور اس کے اثرات عمر بھر ساتھ رہے۔ وہ اپنے ناول «Ice-Candy-Man» (1988؛ امریکا میں «Cracking India»، 1991) کے لیے مشہور ہیں، جس پر دیپا مہتا نے فلم «Earth» (1998) بنائی؛ مہتا نے ان کے ناول «Water» (2006) پر بھی فلم بنائی۔ انہیں 1991 میں ستارۂ امتیاز ملا، 2000 میں زرتشتی ہال آف فیم میں شامل کیا گیا، اور 25 دسمبر 2024 کو ہیوسٹن میں وفات پائی۔"

