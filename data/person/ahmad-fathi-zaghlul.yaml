summary:
  ar: "أحمد فتحي باشا زغلول ⁦(١٨٦٣–١٩١٤م)⁩؛ من نوابغ مصر في القضاء. ولد في إبيانة من قرى مصر وسماه والداه «فتح الله سرّي» ثم حُوّل اسمه في المدرسة إلى «أحمد فتحي». تعلم في مدارس مصر ودرس الحقوق في فرنسة وعاد إلى القاهرة سنة ١٣٠٤هـ فتقاضى في المناصب إلى أن وافته منيته في القاهرة وهو وكيل نظارة الحقانية. له تصانيف ومترجمات جليلة؛ من كتبه «المحاماة» في الحقوق و«شرح القانون المدني»، ومن مترجماته عن الفرنسية «أصول الشرائع لبنتام» في مجلدين و«خواطر وسوانح في الإسلام» و«سر تقدم الإنكليز السكسونيين» و«روح الاجتماع» و«سر تطور الأمم» {cite:al-aalam tarjama}."
  en: "Ahmad Fathi Zaghlul (1863–1914 CE) — the Egyptian jurist who translated Bentham and Demolins's Secret of Anglo-Saxon Advance {cite:al-aalam tarjama}."
  fr: "Ahmad Fathi Zaghlul (1863–1914 ap. J.-C.), juriste égyptien qui traduisit Bentham et À quoi tient la supériorité des Anglo-Saxons ? de Demolins {cite:al-aalam tarjama}."
  es: "Ahmad Fathi Zaghlul (1863–1914 d. C.) — el jurista egipcio que tradujo El secreto del avance anglosajón de Bentham y Demolins {cite:al-aalam tarjama}."
  ur: "احمد فتحی زغلول ⁦(1863-1914 عیسوی)⁩ - مصری فقیہ جس نے بینتھم اور ڈیمولنز کے راز اینگلو سیکسن ایڈوانس کا ترجمہ کیا"
  tr: "Ahmed Fathi Paşa Zaghloul (1863–1914 MS), Mısır'ın en seçkin yargıçlarından biriydi. Mısır'ın İbyana köyünde doğdu ve ailesi ona Fathallah Sirri adını verdi, ancak okulda adı Ahmed Fathi olarak değiştirildi. Mısır okullarında eğitim gördükten sonra Fransa'da hukuk okudu. 1304 Hicri yılında (1865 MS) Kahire'ye döndü ve Kahire'de Adalet Bakan Yardımcısı olarak görev yaparken vefat edene kadar çeşitli yargı görevlerinde bulundu. Hukuk üzerine \"El-Muhame\" (Savunma) ve \"Şerh el-Kanun el-Medeni\" (Medeni Hukuk Tefsiri) dahil olmak üzere birçok önemli eser yazdı ve tercüme etti. Fransızcadan yaptığı çeviriler arasında Bentham'ın iki ciltlik \"Usul al-Sharai'a\" (Hukuk Prensipleri), \"Khawatir wa Sawanih fi al-Islam\" (İslam Üzerine Düşünceler ve İçgörüler), \"Sir Taqdif al-Inklis al-Saxonin\" (Anglo-Saksonların İlerlemesinin Sırrı), \"Ruh al-Ijtima'\" (Toplumun Ruhu) ve \"Sir Tatwirat al-Umam\" (Milletlerin Gelişiminin Sırrı) bulunmaktadır."
  id: "Ahmed Fathi Pasha Zaghloul (1863–1914 M) adalah salah satu hakim terkemuka Mesir. Ia lahir di Ibyana, sebuah desa di Mesir, dan orang tuanya memberinya nama Fathallah Sirri, tetapi namanya diubah menjadi Ahmed Fathi saat bersekolah. Ia bersekolah di Mesir dan kemudian belajar hukum di Prancis. Ia kembali ke Kairo pada tahun 1304 H (1865 M) dan menjabat di berbagai posisi peradilan hingga kematiannya di Kairo, di mana ia menjabat sebagai Wakil Menteri Kehakiman. Ia menulis dan menerjemahkan beberapa karya penting, termasuk \"Al-Muhamah\" (Pembelaan) tentang hukum dan \"Sharh al-Qanun al-Madani\" (Komentar tentang Hukum Perdata). Terjemahannya dari bahasa Prancis meliputi \"Usul al-Sharai'a\" (Prinsip-prinsip Hukum) karya Bentham dalam dua jilid, \"Khawatir wa Sawanih fi al-Islam\" (Refleksi dan Wawasan tentang Islam), \"Sir Taqdif al-Inklis al-Saxonin\" (Rahasia Kemajuan Bangsa-Bangsa Anglo-Saxon), \"Ruh al-Ijtima'\" (Semangat Masyarakat), dan \"Sir Tatwirat al-Umam\" (Rahasia Perkembangan Bangsa-Bangsa)."
