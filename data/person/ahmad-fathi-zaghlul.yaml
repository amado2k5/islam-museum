summary:
  ar: "أحمد فتحي باشا زغلول (١٨٦٣–١٩١٤م)؛ من نوابغ مصر في القضاء. ولد في إبيانة من قرى مصر وسماه والداه «فتح الله سرّي» ثم حُوّل اسمه في المدرسة إلى «أحمد فتحي». تعلم في مدارس مصر ودرس الحقوق في فرنسة وعاد إلى القاهرة سنة ١٣٠٤هـ فتقاضى في المناصب إلى أن وافته منيته في القاهرة وهو وكيل نظارة الحقانية. له تصانيف ومترجمات جليلة؛ من كتبه «المحاماة» في الحقوق و«شرح القانون المدني»، ومن مترجماته عن الفرنسية «أصول الشرائع لبنتام» في مجلدين و«خواطر وسوانح في الإسلام» و«سر تقدم الإنكليز السكسونيين» و«روح الاجتماع» و«سر تطور الأمم» {cite:al-aalam tarjama}."
  en: "Ahmad Fathi Zaghlul (1863–1914 CE) — the Egyptian jurist who translated Bentham and Demolins's Secret of Anglo-Saxon Advance {cite:al-aalam tarjama}."
