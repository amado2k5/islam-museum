id: person/shadhi-ibn-marwan
class: person
label: { ar: "شاذي بن مروان" }
gender: male
summary:
  ar: "جد صلاح الدين؛ من دوين في آخر عمل أذربيجان، أكراد روادية من بطن الهذبانية، أخذ ولديه شيركوه وأيوب إلى بغداد ثم نزلوا تكريت ومات بها وعلى قبره قبة داخل البلد؛ وقال ابن خلكان إنه تتبع نسبتهم كثيراً فلم يجد أحداً ذكر بعد شاذي أبا آخر، وإن وقف على مدرج رتبه الحرشي يوصلهم إلى عدنان فحمله على جهة الاختلاق {cite:wafayat-ayan p. 140}."
  en: "Saladin's grandfather, of the Rawadiyya Kurds at Dvin, who brought his sons Shirkuh and Ayyub to Baghdad and died at Tikrit under a dome; Ibn Khallikan traced the family and found no ancestor named beyond Shadhi — the Adnani pedigree in the scroll he saw he treated as fabricated {cite:wafayat-ayan p. 140}."
  es: "El abuelo de Saladino, de los kurdos Rawadiyya de Dvin, que llevó a sus hijos Shirkuh y Ayyub a Bagdad y murió en Tikrit bajo una cúpula; Ibn Khallikan rastreó la familia y no encontró ningún antepasado nombrado más allá de Shadhi; el linaje Adnani en el pergamino que vio lo trató como fabricado {cite:wafayat-ayan p. 140}."
  fr: "Le grand-père de Saladin, des Kurdes Rawadiyya de Dvin, qui a amené ses fils Shirkuh et Ayyub à Bagdad et est mort à Tikrit sous un dôme; Ibn Khallikan a retracé la famille et n'a trouvé aucun ancêtre nommé au-delà de Shadhi — la généalogie Adnani dans le rouleau qu'il a vu, il l'a traitée comme fabriquée {cite:wafayat-ayan p. 140}."
  ur: "صلاح الدین کے دادا، دیوین میں روادیہ کردوں کے، جو اپنے بیٹوں شرکوہ اور ایوب کو بغداد لائے اور تکریت میں ایک گنبد کے نیچے انتقال کر گئے۔ ابن خلیقان نے خاندان کا سراغ لگایا اور اسے شدی سے آگے کوئی آباؤ اجداد نہیں ملا - عدنانی نسب جس کو اس نے طومار میں دیکھا اسے من گھڑت سمجھا جاتا ہے۔ 140}۔"
  tr: "Salah al-Din'in büyükbabası, Dwinli, Azerbaycan'daki sonraki çalışmalarında Hudbani ailesinden öncü bir Kürttü. İki oğlu Şirkuh ve Eyyub'u Bağdat'a götürdü, ardından Tikrit'e yerleşti ve orada öldü; mezarında şehir içinde bir kubbe vardı. İbn Hallikan, soyunu kapsamlı şekilde takip ettiğini ancak Şadhi'den sonra başka bir babadan bahsetmediğini söyledi. Eğer el-Harşi tarafından düzenlenen bir platformda durursa, onları Adnan'a götürürdü, o da onu üretim yönüne götürürdü {atıf:wafayat-ayan, s. 140}."
  id: "Kakek Salah al-Din, dari Dwin, adalah seorang perintis Kurdi dari klan Hudbanid dalam pekerjaannya di Azerbaijan kemudian. Ia membawa kedua putranya, Shirkuh dan Ayyub, ke Baghdad, lalu menetap di Tikrit dan meninggal di sana, dengan kubah di makamnya di dalam kota. Ibn Khallikan mengatakan ia menelusuri garis keturunan mereka secara mendalam tetapi tidak menemukan catatan setelah Shadhi tentang ayah lain. Jika ia berdiri di atas panggung yang diatur oleh al-Harshi, ia akan membawa mereka ke Adnan, yang membawanya ke arah pembuatan {cite:wafayat-ayan, hlm. 140}."
