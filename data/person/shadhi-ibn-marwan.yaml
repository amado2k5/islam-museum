summary:
  ar: "جد صلاح الدين؛ من دوين في آخر عمل أذربيجان، أكراد روادية من بطن الهذبانية، أخذ ولديه شيركوه وأيوب إلى بغداد ثم نزلوا تكريت ومات بها وعلى قبره قبة داخل البلد؛ وقال ابن خلكان إنه تتبع نسبتهم كثيراً فلم يجد أحداً ذكر بعد شاذي أبا آخر، وإن وقف على مدرج رتبه الحرشي يوصلهم إلى عدنان فحمله على جهة الاختلاق {cite:wafayat-ayan p. 140}."
  en: "Saladin's grandfather, of the Rawadiyya Kurds at Dvin, who brought his sons Shirkuh and Ayyub to Baghdad and died at Tikrit under a dome; Ibn Khallikan traced the family and found no ancestor named beyond Shadhi — the Adnani pedigree in the scroll he saw he treated as fabricated {cite:wafayat-ayan p. 140}."
