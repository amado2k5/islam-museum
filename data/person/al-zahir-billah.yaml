id: person/al-zahir-billah
class: person
label:
  ar: الظاهر بأمر الله محمد بن الناصر
  en: al-Zahir bi-Amr Allah Muhammad ibn al-Nasir
  fr: "al-Zahir bi-Amr Allah Muhammad ibn al-Nasir"
  es: "al-Zahir bi-Amr Allah Muhammad ibn al-Nasir"
  ur: "الظاہر بن عمرو اللہ محمد بن الناصر"
summary:
  ar: خليفة عباسي [٦٢٢–٦٢٣هـ]، أبو نصر محمد بن الناصر، ولد سنة إحدى وسبعين وخمس مئة واستخلف وله اثنتان وخمسون سنة فقيل له
    ألا تتفسح فقال من فتح دكاناً بعد العصر أيش يكسب، وقال ابن الأثير لما ولي أظهر من العدل والإحسان ما أعاد به سنة العمرين
    فلو قيل ما ولي الخلافة بعد عمر بن عبد العزيز مثله لكان القائل صادقاً فإنه أعاد من الأموال المغصوبة والأملاك المأخوذة في
    أيام أبيه شيئاً كثيراً وأطلق المكوس وأمر بإعادة الخراج القديم فمن ذلك بعقوبا كان يؤخذ منها في أيام أبيه ثمانون ألف دينار
    فأعادها إلى عشرة آلاف، وكتب في صنجة المخزن الراجحة أوله ويل للمطففين، ورد مئة ألف دينار جاءت من ظلم على أربابها وأخرج
    أهل الحبوس وفرق ليلة عيد النحر مئة ألف دينار وقال ما فعلت الخزائن لتمتلئ بل لتفرغ وتنفق في سبيل الله، وتوفي في ثالث عشر
    رجب سنة ثلاث وعشرين فكانت خلافته تسعة أشهر وأياماً {cite:tarikh-khulafa-minhaj-1434 p. 699-701}.
  en: 'Abbasid caliph [622–623], fifty-two at accession — ''who opens a shop after asr, what does he earn?'' Ibn al-Athir:
    ''he showed a justice that revived the way of the two Umars; had it been said none ruled after Umar ibn Abd al-Aziz like
    him, it were true'' — confiscated estates returned, tolls lifted, Ba''quba''s eighty thousand back to ten, the treasury''s
    heavy weight denounced with ''Woe to the defrauders'', a hundred thousand of wronged money restored. ''Treasuries are
    not made to fill but to be spent in God''s way''. Nine months, dying 13 Rajab 623 {cite:tarikh-khulafa-minhaj-1434 p.
    699-701}.'
  fr: "Le calife abbasside [622-623], cinquante-deux à l'accession - « qui ouvre une boutique après asr, que gagne-t-il ?  » Ibn al-Athir : « Il a montré une justice qui a ravivé la voie des deux Omars ; Si l'on avait dit qu'aucun ne régnait après Omar ibn Abd al-Aziz comme lui, il était vrai  » - les biens confisqués restitués, les péages levés, les 80 000 de Ba'quba de retour à dix, le poids lourd du trésor dénoncé avec « Malheur aux fraudeurs  », cent mille de l'argent lésé restauré. Neuf mois, mourant 13 Rajab 623 {cite:tarikh-khulafa-minhaj-1434 p. 699-701}."
  es: "Califa abasí [622–623], cincuenta y dos años al ascender al trono: «¿Quién abre una tienda después de la oración de Asr? ¿Cuánto gana?». Ibn al-Athir: «Demostró una justicia que revivió el camino de los dos Umars; si se hubiera dicho que nadie gobernó después de Umar ibn Abd al-Aziz como él, sería cierto». Se devolvieron las propiedades confiscadas, se levantaron los peajes, los ochenta mil de Ba'quba volvieron a ser diez, se denunció el peso del tesoro con un «¡Ay de los defraudadores!», se restituyeron cien mil de dinero malversado. «Los tesoros no están hechos para llenarse, sino para gastarse en el camino de Dios». Nueve meses, murió el 13 de Rajab de 623 {cite:tarikh-khulafa-minhaj-1434 p. 699-701}."
  ur: "عباسی خلیفہ [622-623]، الحاق کے وقت باون - 'جو عصر کے بعد دکان کھولتا ہے، وہ کیا کماتا ہے؟' ابن اثیر: 'اس نے انصاف کا مظاہرہ کیا جس نے دونوں عمروں کے راستے کو زندہ کر دیا۔ اگر یہ کہا جاتا کہ عمر بن عبدالعزیز کے بعد ان جیسا کوئی حکمران نہیں ہوا، تو یہ سچ تھا\" - ضبط شدہ املاک واپس آگئی، ٹول اٹھا لیا گیا، بعقوبہ کے اسّی ہزار واپس دس پر، خزانے کے بھاری وزن کی مذمت کی گئی 'دھوکہ بازوں پر افسوس'، ایک لاکھ غلط رقم کی واپسی۔ خزانے بھرنے کے لیے نہیں بلکہ راہ خدا میں خرچ کرنے کے لیے بنائے جاتے ہیں۔ نو ماہ، وفات 13 رجب 623 {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 699-701}۔"
