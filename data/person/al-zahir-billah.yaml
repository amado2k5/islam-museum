id: person/al-zahir-billah
class: person
label: { ar: "الظاهر بأمر الله محمد بن الناصر" }
summary:
  ar: "خليفة عباسي [٦٢٢–٦٢٣هـ]، أبو نصر محمد بن الناصر، ولد سنة إحدى وسبعين وخمس مئة واستخلف وله اثنتان وخمسون سنة فقيل له ألا تتفسح فقال من فتح دكاناً بعد العصر أيش يكسب، وقال ابن الأثير لما ولي أظهر من العدل والإحسان ما أعاد به سنة العمرين فلو قيل ما ولي الخلافة بعد عمر بن عبد العزيز مثله لكان القائل صادقاً فإنه أعاد من الأموال المغصوبة والأملاك المأخوذة في أيام أبيه شيئاً كثيراً وأطلق المكوس وأمر بإعادة الخراج القديم فمن ذلك بعقوبا كان يؤخذ منها في أيام أبيه ثمانون ألف دينار فأعادها إلى عشرة آلاف، وكتب في صنجة المخزن الراجحة أوله ويل للمطففين، ورد مئة ألف دينار جاءت من ظلم على أربابها وأخرج أهل الحبوس وفرق ليلة عيد النحر مئة ألف دينار وقال ما فعلت الخزائن لتمتلئ بل لتفرغ وتنفق في سبيل الله، وتوفي في ثالث عشر رجب سنة ثلاث وعشرين فكانت خلافته تسعة أشهر وأياماً {cite:tarikh-khulafa-minhaj-1434 p. 699-701}."
  en: "Abbasid caliph [622–623], fifty-two at accession — 'who opens a shop after asr, what does he earn?' Ibn al-Athir: 'he showed a justice that revived the way of the two Umars; had it been said none ruled after Umar ibn Abd al-Aziz like him, it were true' — confiscated estates returned, tolls lifted, Ba'quba's eighty thousand back to ten, the treasury's heavy weight denounced with 'Woe to the defrauders', a hundred thousand of wronged money restored. 'Treasuries are not made to fill but to be spent in God's way'. Nine months, dying 13 Rajab 623 {cite:tarikh-khulafa-minhaj-1434 p. 699-701}."
