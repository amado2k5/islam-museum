summary:
  ar: صحابية أموية أسلمت قديماً وبايعت، وخرجت إلى المدينة مهاجرة وحدها في الهدنة عام الحديبية فجاء أخواها يطلبانها فلم يردها النبي؛ تزوجت زيد بن حارثة ثم الزبير ثم عبد الرحمن بن عوف ثم عمرو بن العاص.
  en: An Umayyad Companion who embraced Islam early and gave her pledge; she emigrated to Medina alone during the truce of al-Hudaybiyya, and when her two brothers came to demand her the Prophet did not return her; she married in turn Zayd ibn
    Haritha, al-Zubayr, Abd al-Rahman ibn Awf and Amr ibn al-As.
  ur: "اموی صحابیہ جو جلد مسلمان ہوئی اور بیعت کی؛ حدیبیہ کی جنگ بندی میں وہ اکیلی مدینہ ہجرت کی۔"
  es: "Una compañera omeya que abrazó el Islam tempranamente e hizo su juramento; emigró sola a Medina durante la tregua de al-Hudaybiyya, y cuando sus dos hermanos vinieron a reclamarla, el Profeta no la devolvió; se casó sucesivamente con Zayd ibn Haritha, al-Zubayr, Abd al-Rahman ibn Awf y Amr ibn al-As."
  fr: "Compagne omeyyade qui embrassa l'islam très tôt et fit vœu de chasteté, elle émigra seule à Médine pendant la trêve d'al-Hudaybiyya, et lorsque ses deux frères vinrent la réclamer, le Prophète ne la renvoya pas; elle épousa successivement Zayd ibn Haritha, al-Zubayr, Abd al-Rahman ibn Awf et Amr ibn al-As."
  tr: "Uzun zaman önce İslam'ı benimsemiş ve bağlılık yemini etmiş bir Emevi sahabi olarak, Hudeybiye yılındaki ateşkes sırasında tek başına Medine'ye göç etti. Kardeşleri onu aramaya geldi, ancak Peygamber onu reddetti; Zeyd bin Harithah, sonra el-Zubeyr, sonra Abdurrahman ibn Awf ve ardından Amr ibn al-As ile evlendi."
  id: "Seorang sahabat Umayyah yang lama memeluk Islam dan bersumpah setia, ia bermigrasi sendirian ke Madinah selama gencatan senjata di tahun Hudaybiyyah. Saudara-saudaranya datang mencarinya, tetapi Nabi menolaknya; ia menikah dengan Zayd ibn Harithah, kemudian Al-Zubayr, kemudian Abd al-Rahman ibn Awf, dan kemudian Amr ibn al-As."
