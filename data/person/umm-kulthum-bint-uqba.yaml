summary:
  ar: صحابية أموية أسلمت قديماً وبايعت، وخرجت إلى المدينة مهاجرة وحدها في الهدنة عام الحديبية فجاء أخواها يطلبانها فلم يردها النبي؛ تزوجت زيد بن حارثة ثم الزبير ثم عبد الرحمن بن عوف ثم عمرو بن العاص.
  en: An Umayyad Companion who embraced Islam early and gave her pledge; she emigrated to Medina alone during the truce of al-Hudaybiyya, and when her two brothers came to demand her the Prophet did not return her; she married in turn Zayd ibn
    Haritha, al-Zubayr, Abd al-Rahman ibn Awf and Amr ibn al-As.
