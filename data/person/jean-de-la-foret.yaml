label:
  ar: "جان دو لافوريه"
  en: "Jean de la Forêt"
  es: "Jean de la Forêt"
  fr: "Jean de la Forêt"
  ur: "جین ڈی لا فورٹ"
gender: male
roles: [diplomat]
summary:
  ar: "جان دو لافوريه، سكرتير الملك [[person/francis-i-france|فرانسوا الأول]]؛ ينقل الصلابي أن الملك أرسله سنة 941هـ/1535م إلى السلطان [[person/sulayman-al-qanuni|سليمان القانوني]] بهدف عقد تحالف في شكل معاهدة سُميت فيما بعد بمعاهدة الامتيازات العثمانية الفرنسية {cite:dawlat-uthmaniyya-salabi p. 203}."
  en: "Jean de la Forêt, secretary to King [[person/francis-i-france|Francis I]]; al-Salabi records the king sent him in 941/1535 to Sultan [[person/sulayman-al-qanuni|Süleyman]] to conclude the alliance in treaty form — the pact later called the Franco-Ottoman Capitulations {cite:dawlat-uthmaniyya-salabi p. 203}."
  es: "Jean de la Forêt, secretario del rey [[person/francis-i-france|Francisco I]]; al-Salabi registra que el rey lo envió en 941/1535 al sultán [[person/sulayman-al-qanuni|Süleyman]] para concluir la alianza en forma de tratado, pacto que más tarde se denominó Capitulaciones Franco-Otomanas {cite:dawlat-uthmaniyya-salabi p. 203}."
  fr: "Jean de la Forêt, secrétaire du roi François Ier; al-Salabi rapporte que le roi l'envoya en 941/1535 auprès du sultan Süleyman pour conclure l'alliance sous forme de traité — le pacte plus tard appelé les capitulations franco-ottomanes {cite:dawlat-uthmaniyya-salabi p. 203}."
  ur: "جین ڈی لا فوریٹ، بادشاہ کے سیکرٹری [[فرانسس/فرانسس-ای-فرانس|فرانسس اول]]؛ الصلابی نے ریکارڈ کیا ہے کہ بادشاہ نے اسے 941/1535 میں سلطان [[شخص/سلیمان القانونی|سلیمان]] کے پاس معاہدہ کی شکل میں اتحاد کو ختم کرنے کے لیے بھیجا تھا - اس معاہدے کو بعد میں فرانکو-عثمانیہ کیپٹلیشنز کہا گیا۔ 203}۔"
  tr: "Kralın sekreteri Jean de Lafourier [[kişi/France-i-France|I. Francis]]; Al-Salabi, kralın onu 941 Hicri/1535 yılında Sultan'a [[kişi/süleyman-al-qanuni|Muhteşem Süleyman]] gönderdiğini, daha sonra Fransız Osmanlı Ayrıcalıkları Antlaşması olarak adlandırılan bir antlaşma şeklinde bir ittifak kurmak amacıyla gönderdiğini bildirir {cite:dawlat-uthmaniyya-salabi s. 203}."
  id: "Jean de Lafourier, sekretaris raja [[orang/Prancis-i-Prancis|Francis I]]; Al-Salabi melaporkan bahwa raja mengirimnya pada tahun 941 H/1535 M kepada Sultan [[orang/sulayman-al-qanuni|Suleiman yang Agung]] dengan tujuan membentuk aliansi dalam bentuk perjanjian yang kemudian disebut Perjanjian Hak Istimewa Ottoman Prancis {cite:dawlat-uthmaniyya-salabi hlm. 203}."
