summary:
  ar: "إبراهيم بن محمد بن سعيد بن هلال الثقفي، عالم كان يرى رأي الزيدية ثم انتقل إلى القول بالإمامية، من أهل الكوفة، انتقل إلى أصفهان وتوفي بها سنة 283 هـ، من كتبه «المغازي» و«الغارات»."
  en: "Ibrahim ibn Muhammad ibn Sa'id ibn Hilal al-Thaqafi, a scholar who held the Zaydi view and then moved to the Imami position, of Kufa; he moved to Isfahan and died there in 283 AH. His books include 'al-Maghazi' and 'al-Gharat'."
  es: "Ibrahim ibn Muhammad ibn Sa'id ibn Hilal al-Thaqafi, un erudito de Kufa que defendió la postura zaidí y posteriormente se adhirió a la imamí, se trasladó a Isfahán, donde falleció en el año 283 de la Hégira. Entre sus obras destacan «al-Maghazi» y «al-Gharat»."
  fr: "Ibrahim ibn Muhammad ibn Sa'id ibn Hilal al-Thaqafi, un érudit de Kufa qui adhéra d'abord à l'école zaydite puis à l'école imami, s'installa à Ispahan où il mourut en 283 AH. Parmi ses ouvrages figurent « al-Maghazi » et « al-Gharat »."
  ur: "ابراہیم بن محمد بن سعید ابن ہلال ثقفی، ایک عالم جو زیدی نظریہ کا حامل تھا اور پھر کوفہ کے امامی عہدے پر چلا گیا۔ وہ اصفہان چلے گئے اور وہاں 283ھ میں وفات پائی۔ ان کی کتابوں میں 'المغازی' اور 'الغرات' شامل ہیں۔"
