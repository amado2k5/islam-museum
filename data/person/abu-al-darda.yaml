summary:
  ar: عويمر الأنصاري الخزرجي، مشهور بكنيته؛ قيل أسلم يوم بدر وشهد أحداً وأبلى فيها، وقال له النبي يوم أحد «نعم الفارس عويمر» ووصفه بـ«حكيم أمتي»، وكان تاجراً قبل البعث؛ توفي سنة 32هـ في قول الواقدي وجماعة، والأصح عند أهل الحديث أنه في خلافة عثمان.
  en: Uwaymir al-Ansari al-Khazraji, known by his kunya; it is said he embraced Islam the day of Badr, he fought well at Uhud, where the Prophet said 'what a fine horseman Uwaymir is' and called him the wise man of his community; he had been
    a merchant before the mission; he died in 32 AH on the account of al-Waqidi and others, and hadith scholars hold it was in Uthman's caliphate.
