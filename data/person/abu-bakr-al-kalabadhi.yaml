summary:
  ar: "بطاقة أولية لأبي بكر محمد بن إسحاق الكلاباذي، حنفي بخارى صاحب «التعرف لمذهب أهل التصوف» في القرن العاشر، توفي سنة ٩٩٠م تقريباً؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Bakr Muhammad ibn Ishaq al-Kalabadhi, the Bukhara Hanafi author of al-Ta'arruf in the tenth century, d. about 990; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Abu Bakr Muhammad ibn Ishaq al-Kalabadhi, autor hanafí de Bujará de al-Ta'arruf en el siglo X, fallecido alrededor del año 990; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de brouillon d'Abu Bakr Muhammad ibn Ishaq al-Kalabadhi, auteur hanafite de Boukhara d'al-Ta'arruf au Xe siècle, mort vers 990; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "دسویں صدی میں التعرف کے بخارا حنفی مصنف ابو بکر محمد بن اسحاق الکلابادی کے لیے ڈرافٹ کارڈ، ڈی۔ تقریباً 990؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Onuncu yüzyılda yaşamış, Buharalı bir Hanefi olan ve \"El-Ta'arruf li-Madhhab Ehl el-Tasavvuf\" adlı eserin yazarı Ebu Bekir Muhammed ibn İshak el-Kalabadhi'ye ait ön tanıtım kartı. Yaklaşık 990 yılında vefat etmiştir; biyografik kitaplarda adı geçmektedir ve biyografisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Abu Bakr Muhammad ibn Ishaq al-Kalabadhi, seorang Hanafi dari Bukhara, penulis \"Al-Ta'arruf li-Madhhab Ahl al-Tasawwuf\" pada abad kesepuluh, yang meninggal sekitar tahun 990 M; ia disebutkan dalam buku-buku biografi, dan biografinya belum diulas di halaman ini."
