id: person/muhammad-ibn-dawud-ibn-al-jarrah
class: person
label: { ar: "محمد بن داود بن الجراح" }
summary:
  ar: "وزير بغدادي من آل الجراح الكتّاب؛ كان من رؤوس أصحاب خلع المقتدر بالله سنة 296هـ فلما لُقّب ابن المعتز بالخلافة استوزره، فلما انهارت البيعة اختفى في داره {cite:kamil-ibn-al-athir p. 11-13}. وعند ابن الجوزي ولد سنة ثلاث وأربعين ومائتين في الليلة التي توفي فيها إبراهيم بن العباس الصولي، وحدّث عن عمر بن شبة وغيره، وكان فاضلًا من علماء الكتاب عارفًا بأيام الناس وأخبار الخلفاء والوزراء وله في ذلك تصانيف، وهو عم علي بن عيسى الوزير، وتوفي في ربيع الآخر {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "A Jarrahid vizier of Baghdad, one of the chiefs of the 296 deposition of al-Muqtadir; Ibn al-Mu'tazz made him vizier, and when the day collapsed he hid in his house {cite:kamil-ibn-al-athir p. 11-13}."
  es: "Un visir jarrahid de Bagdad, uno de los jefes de la deposición de al-Muqtadir en el año 296; Ibn al-Mu'tazz lo nombró visir, y cuando el día se derrumbó se escondió en su casa {cite:kamil-ibn-al-athir p. 11-13}."
  fr: "Un vizir jarrahid de Bagdad, l'un des chefs de la déposition de 296 d'al-Muqtadir; Ibn al-Mu'tazz le nomma vizir, et lorsque le jour tomba, il se cacha dans sa maison {cite:kamil-ibn-al-athir p. 11-13}."
  ur: "بغداد کا ایک جراحد وزیر، المقتدیر کی 296 معزولی کے سرداروں میں سے ایک؛ ابن المعتز نے اسے وزیر بنایا اور جب دن ڈھل گیا تو وہ اپنے گھر میں چھپ گیا۔ 11-13}۔"
  tr: "El-Cerre el-Kitab ailesinden bir Bağdadî veziri olan Kât, 296 H yılında el-Muktadir Billah'ı tahttan indiren halkın liderlerindendi. İbn el-Mu'tazz halifelik aldığında onun korumasını aradı. Bağ yemini çöktüğünde, evine kayboldu {alıntı:) Kamil ibn al-Athir s. 11-13}. İbn el-Cevzi'ye göre, 243 Hicri yılında, İbrahim bin Abbas el-Suli'nin öldüğü gece doğmuştur. Ömer ibn Şabbe ve diğerlerinden rivayet etmiştir. Kitabın erdemli bir âlimiydi, halkın günlerini ve halifeler ile din adamlarının haberlerini bilir ve bu konuda eserler yazmıştır. Ali ibn İsa el-Vezir'in amcasıydı ve Rabi'l-Akhir'de öldü {atıf:muntazam-ibn-al-jawzi s. 205}."
  id: "Seorang wazir Baghdadi dari keluarga Al-Jarrah al-Kitab; ia termasuk di antara pemimpin rakyat yang menggulingkan al-Muqtadir Billah pada tahun 296 H. Ketika Ibn al-Mu'tazz dianugerahi kekhalifahan, ia memohon perlindungannya. Ketika sumpah setia runtuh, ia menghilang ke rumahnya {cite:Kamil-ibn-al-Athir hlm. 11-13}. Menurut Ibn al-Jawzi, ia lahir pada tahun 243 H, pada malam Ibrahim ibn al-Abbas al-Suli wafat. Ia menceritakan dari Umar ibn Shabbah dan lainnya. Ia adalah seorang ulama yang berbudi luhur, memahami hari-hari rakyat dan kabar para khalifah serta menteri, serta menulis karya-karya tentang hal ini. Ia adalah paman Ali ibn Isa al-vizir dan meninggal di Rabi' al-Akhir {cite:muntazam-ibn-al-jawzi hlm. 205}."
