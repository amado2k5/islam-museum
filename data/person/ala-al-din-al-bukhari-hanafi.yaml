label:
  ar: "علاء الدين البخاري الحنفي"
  en: "Ala al-Din al-Bukhari (d. 1437)"
  fr: "Ala al-Din al-Bukhari (mort en 1437)"
  es: "Ala al-Din al-Bukhari (d. 1437)"
  ur: "علاء الدین البخاری ⁦(متوفی 1437)⁩"
roles: [jurist]
gender: male
summary:
  ar: "محمد بن محمد بن محمد البخاري، علاء الدين، فقيه من كبار الحنفية، ولد بإيران ونشأ ببخارى وسكن مصر ثم دمشق وتوفي بها ودفن بالمزة، ردّ على ابن عربي في «فاضحة الملحدين» ثم في «الملجمة للمجسمة»."
  en: "Muhammad ibn Muhammad ibn Muhammad al-Bukhari, Ala al-Din, a leading Hanafi jurist, born in Iran, raised in Bukhara, settled in Egypt then Damascus where he died and was buried at al-Mizza; he wrote against Ibn Arabi in Fadihat al-Mulhidin and al-Mulajjima li-l-Mujassima."
  fr: "Muhammad ibn Muhammad ibn Muhammad al-Bukhari, Ala al-Din, un éminent juriste hanafite, né en Iran, élevé à Boukhara, s’est installé en Égypte puis à Damas où il est mort et a été enterré à al-Mizza ; Il a écrit contre Ibn Arabi dans Fadihat al-Mulhidin et al-Mulajjima li-l-Mujassima."
  es: "Muhammad ibn Muhammad ibn Muhammad al-Bukhari, Ala al-Din, un destacado jurista hanafi, nació en Irán, se crió en Bujará, se estableció en Egipto y luego en Damasco, donde murió y fue enterrado en al-Mizza; escribió contra Ibn Arabi en Fadihat al-Mulhidin y al-Mulajjima li-l-Mujassima."
  ur: "محمد بن محمد بن محمد البخاری، علاء الدین، ایک معروف حنفی فقیہ، ایران میں پیدا ہوئے، بخارا میں پرورش پائی، مصر پھر دمشق میں سکونت اختیار کی جہاں ان کا انتقال ہوا اور المیزہ میں دفن ہوئے۔ اس نے ابن عربی کے خلاف فدیہات المحدثین اور الملاجمہ لی المجاسمہ میں لکھا۔"
