id: person/ubayd-allah-ibn-ziyad
class: person
label: { ar: "عبيد الله بن زياد", en: "Ubaydallah ibn Ziyad", es: "Ubaydallah ibn Ziyad", fr: "Ubaydallah ibn Ziyad", ur: "عبیداللہ ابن زیاد" }
summary:
  ar: "ورد اسمه في أخبار الكوفة سنة ستين، وقُتل في عهد ولايته هانئ بن عروة الذي أجار مسلم بن عقيل على يد أحد موالي ابن زياد {cite:tabari-tarikh-abu-al-fadl j.5 p.362} {cite:tabari-tarikh-abu-al-fadl j.5 p.379}. ورأى داود الناقد درهماً شاذاً عليه اسمه {cite:futuh-buldan-maarif-1407}. وعند المسعودي دخل الكوفة متلثماً بعمامة سوداء على بغلة والناس يتوقعون الحسين فيقولون له وعليك السلام يا ابن رسول الله حتى انتهى إلى القصر فقال له النعمان بن بشير يا ابن رسول الله ما لي ولك فحسر اللثام عن فيه فعرفه، وضرب هانئ بن عروة بقضيب حتى كسر أنفه وشق حاجبه ونثر لحم وجنته {cite:muruj-al-dhahab p. 56}"
  en: "Ubaydallah ibn Ziyad ibn Abi Sufyan; Mu'awiya and Yazid's governor of Basra, Kufa and Iraq — a strange dirham bore his name."
  es: "Ubaydallah ibn Ziyad ibn Abi Sufyan; Mu'awiya y el gobernador de Yazid en Basora, Kufa e Irak: un extraño dirham llevaba su nombre."
  fr: "Ubaydallah ibn Ziyad ibn Abi Sufyan; Mu'awiya et Yazid, gouverneur de Bassorah, de Kufa et de l'Irak, un étrange dirham portait son nom."
  ur: "عبیداللہ ابن زیاد ابن ابی سفیان؛ معاویہ اور یزید کے گورنر بصرہ، کوفہ اور عراق - ایک عجیب درہم ان کا نام تھا۔"
  tr: "Adı altmış yılın Akhbar al-Kufa'sında geçti ve valiliği sırasında, İbn Ziyad'ın özgür bırakanlarından birinin elinden Müslüman ibn Aqil'i kiraladığı Hani ibn Urwah öldürüldü {cite:tabari-tarikh-abu-al-fadl j.5 s.362} {cite:tabari-tarikh-abu-al-fadl j.5 s.379}. Eleştirmen Davud, adını taşıyan tuhaf bir dirhem gördü {cite:futuh-buldan-maarif-1407}. El-Mes'udi'de, siyah bir sarık içinde bir eşek üzerinde Kufa'ya girdi ve halk Hüseyin'i bekledi, ona 'Selamümün olsun, Allah'ın Elçi'nin oğlu.' dedi. Saraya ulaştı. El-Nu'man bin Beşîr ona, 'Ey Allah'ın Elçi'nin oğlu, seninle ne işim var?' dedi. Ağzını açtı, onu tanıdı ve Hani ibn Urve'ye bir çubukla vurdu, burnunu kırdı, kaşını yardı ve yanağının etini dağıttı. {kaynak:Muruj-al-Dhahab, s. 56}"
  id: "Namanya muncul dalam Akhbar al-Kufa tahun enam puluh, dan selama masa pemerintahannya, Hani ibn Urwah dibunuh, yang telah menyewa Muslim ibn Aqil di tangan salah satu mantan Ibn Ziyad {cite:tabari-tarikh-abu-al-fadl j.5 hlm.362} {cite:tabari-tarikh-abu-al-fadl j.5 hlm.379}. Dawood sang kritikus melihat sebuah dirham aneh yang bernama {cite:futuh-buldan-maarif-1407}. Di Al-Mas'udi, ia masuk ke Kufa dengan menyamar dengan sorban hitam di atas keledai, dan rakyat menantikan Husayn, berkata kepadanya, 'Salam ke atasmu, putra Rasulullah.' Ia sampai di istana. Al-Nu'man ibn Bashir berkata kepadanya, 'Wahai putra Rasulullah, apa hubunganku denganmu?' Ia membuka mulutnya, mengenalinya, dan memukul Hani ibn Urwah dengan tongkat hingga hidungnya patah, alisnya pecah, dan menghamburkan daging pipinya. {cite:Muruj-al-Dhahab, hlm. 56}"
