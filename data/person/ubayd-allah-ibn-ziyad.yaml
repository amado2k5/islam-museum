id: person/ubayd-allah-ibn-ziyad
class: person
label: { ar: "عبيد الله بن زياد", en: "Ubaydallah ibn Ziyad" }
summary:
  ar: "ورد اسمه في أخبار الكوفة سنة ستين، وقُتل في عهد ولايته هانئ بن عروة الذي أجار مسلم بن عقيل على يد أحد موالي ابن زياد {cite:tabari-tarikh-abu-al-fadl j.5 p.362} {cite:tabari-tarikh-abu-al-fadl j.5 p.379}. ورأى داود الناقد درهماً شاذاً عليه اسمه {cite:futuh-buldan-maarif-1407}. وعند المسعودي دخل الكوفة متلثماً بعمامة سوداء على بغلة والناس يتوقعون الحسين فيقولون له وعليك السلام يا ابن رسول الله حتى انتهى إلى القصر فقال له النعمان بن بشير يا ابن رسول الله ما لي ولك فحسر اللثام عن فيه فعرفه، وضرب هانئ بن عروة بقضيب حتى كسر أنفه وشق حاجبه ونثر لحم وجنته {cite:muruj-al-dhahab p. 56}"
  en: "Ubaydallah ibn Ziyad ibn Abi Sufyan; Mu'awiya and Yazid's governor of Basra, Kufa and Iraq — a strange dirham bore his name."
