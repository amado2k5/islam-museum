summary:
  ar: "ورد اسمه في أخبار الكوفة سنة ستين، وقُتل في عهد ولايته هانئ بن عروة الذي أجار مسلم بن عقيل على يد أحد موالي ابن زياد {cite:tabari-tarikh-abu-al-fadl j.5 p.362} {cite:tabari-tarikh-abu-al-fadl j.5 p.379}. ورأى داود الناقد درهماً شاذاً عليه اسمه {cite:futuh-buldan-maarif-1407}."
  en: "Ubaydallah ibn Ziyad ibn Abi Sufyan; Mu'awiya and Yazid's governor of Basra, Kufa and Iraq — a strange dirham bore his name."
