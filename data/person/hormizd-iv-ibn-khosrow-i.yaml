label: { ar: "هرمز بن كسرى أنوشروان" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك هرمز بن كسرى أنو شروان» {cite:tabari-tarikh-abu-al-fadl j.2 p.172}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Perslerinin kralıydı ve el-Tabari'nin \"Hürmüz Kralı ibn Khosrow onun Şirvan olduğunu belirtti\" başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl j.2 s.172}. Bu yerde, saltanatı yılları ve hikayeleri hakkında söylenenler anlatılır."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan gelar \"Raja Hormuz ibn Khosrow menyebutkan bahwa ia adalah Shirwan\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.172}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
