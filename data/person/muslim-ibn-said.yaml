summary:
  ar: "مسلم بن سعيد؛ استعمله عمر بن هبيرة على خراسان فصالح أفشين على ستة آلاف رأس ودفع إليه قلعته فلما سمع بولاية أسد بن عبد الله غزا فرغانة فقطع شجرها وأخرب عمارتها فانحدر عليه خاقان الترك فارتحل وسار ثلاث مراحل في يوم حتى قامت دوابه وتطرفت الترك عسكره."
  en: "Muslim ibn Sa'id; Umar ibn Hubayra's governor, truced by al-Afshin on six thousand heads and his fortress — then, fearing dismissal when Asad was named, he ravaged Farghana and fled the Khaqan three marches in a day."
  es: "Muslim ibn Sa'id, gobernador de Umar ibn Hubayra, recibió una tregua de al-Afshin por seis mil cabezas y su fortaleza; luego, temiendo ser destituido cuando Asad fue nombrado, asoló Farghana y huyó de Khaqan tres veces en un día."
  fr: "Muslim ibn Sa'id; gouverneur d'Umar ibn Hubayra, contraint par al-Afshin de prendre six mille têtes et sa forteresse — puis, craignant d'être renvoyé lorsque Asad fut nommé, il ravagea Farghana et s'enfuit du Khaqan, parcourant trois marches en une journée."
  ur: "مسلم بن سعید؛ عمر بن ہبیرہ کا گورنر، جسے افشین نے چھ ہزار سروں اور اس کے قلعے پر چڑھایا - پھر جب اسد کا نام لیا گیا تو برطرفی کے خوف سے، اس نے فرغانہ کو تباہ کر دیا اور خاقان سے ایک دن میں تین مارچ کر کے فرار ہو گئے۔"
