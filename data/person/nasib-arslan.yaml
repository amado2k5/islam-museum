summary:
  ar: "نسيب بن حمود بن حسن أرسلان ⁦(١٨٦٧–١٩٢٧م)⁩؛ شاعر من الكتّاب المفكرين، من نوابغ الأمراء الأرسلانيين، وأخوه شكيب وعادل. ولد في بيروت وتعلم بالشويفات ثم بمدرسة الحكمة ببيروت، وأولع بشعر الجاهليين والخضرميين فحفظ كثيراً منه وقال الشعر وهو في المدرسة. عُيّن مديراً لناحية الشويفات فأقام نحو عشر سنين محمود السيرة، واستعفى وسكن بيروت. ولما أُعلن الدستور العثماني انتُخب رئيساً لنادي جمعية الاتحاد والترقي في بيروت، ثم تقيأ على الاتحاديين لسوء سيرتهم مع العرب فانفصل عنهم وانضم إلى طلاب اللامركزية، وأخذ ينشر آراءه في جريدة «المفيد» البيروتية فكانت مقالاته أثراً كبيراً في الحركة العربية، وكان مجلسه في مكتبها مجمع الكتّاب والأدباء وقادة الرأي، ويمضي مقالاته باسم «أميل حر» {cite:al-aalam tarjama}."
  en: "Amir Nasib Arslan (1867–1927 CE) — the Beiruti poet-journalist of al-Mufid who broke with the Unionists for the decentralist Arab cause; brother of Shakib Arslan {cite:al-aalam tarjama}."
  es: "Amir Nasib Arslan (1867–1927 d. C.) — poeta y periodista beirutí de al-Mufid que rompió con los unionistas por la causa árabe descentralizadora; hermano de Shakib Arslan {cite:al-aalam tarjama}."
  fr: "Amir Nasib Arslan (1867–1927 CE) — le poète-journaliste beyrouthin d'al-Mufid qui a rompu avec les unionistes pour la cause arabe décentralisatrice; frère de Shakib Arslan {cite:al-aalam tarjama}."
  ur: "امیر نصیب ارسلان ⁦(1867-1927 عیسوی)⁩ - المفید کے بیروت کے شاعر-صحافی جنہوں نے غیر مرکزی عرب کاز کے لیے یونینسٹوں کے ساتھ توڑ دیا؛ شکیب ارسلان کے بھائی {حوالہ: العالم ترجمہ}۔"
  tr: "Naseeb bin Hamoud bin Hassan Arslan (1867–1927); yazarlar ve düşünürler arasında şair ve düşünür, Arslani prenslerinin ve kardeşi Shakib ile Adel'in dahilerinden biri. Beyrut'ta doğdu, Choueifat'ta ve ardından Beyrut'taki Hikma Okulu'nda eğitim gördü. İslam öncesi ve Khudrami halkının şiirlerine düşkündü, çoğunu ezberledi ve okuldayken şiir okudu. Choueifat bölgesinin müdürü olarak atandı, yaklaşık on yıl boyunca terbiyeli bir şekilde yaşadı, istifa etti ve Beyrut'a yerleşti. Osmanlı anayasası açıklandığında, Beyrut'taki Birlik ve İlerleme Derneği Kulübü'nün başkanı seçildi. Daha sonra İttihadcıları Araplara karşı kötü davranışları nedeniyle azarladı, onlardan ayrıldı ve yerinden yönetim öğrencilerine katıldı. Görüşlerini Beyrut merkezli 'Al-Mufid' gazetesinde yayımlamaya başladı ve makaleleri Arap hareketi üzerinde önemli bir etki yarattı. Ofisindeki konseyi, yazarlar, edebiyatçılar ve kanaat önderlerinin bir araya geldiği bir yerdi. Makalelerini 'Emile Hurr' {cite:al-aalam tarjama} adıyla yayımladı."
  id: "Naseeb bin Hamoud bin Hassan Arslan (1867–1927 M); penyair dan pemikir di antara para penulis dan pemikir, salah satu anak ajaib pangeran Arslani, serta saudaranya Shakib dan Adel. Ia lahir di Beirut dan belajar di Choueifat lalu di Sekolah Hikma di Beirut. Ia gemar puisi dari masyarakat pra-Islam dan Khudrami, menghafal banyak di antaranya, dan membacakan puisi saat bersekolah. Ia diangkat sebagai direktur distrik Choueifat, di mana ia tinggal sekitar sepuluh tahun dengan sopan, mengundurkan diri, dan menetap di Beirut. Ketika konstitusi Ottoman diumumkan, ia terpilih sebagai presiden Klub Asosiasi Persatuan dan Kemajuan di Beirut. Ia kemudian menegur kaum Ittihadis atas perilaku buruk mereka terhadap orang Arab, memisahkan diri dari mereka dan bergabung dengan mahasiswa desentralisasi. Ia mulai menerbitkan pendapatnya di surat kabar 'Al-Mufid' yang berbasis di Beirut, dan artikel-artikelnya memberikan dampak signifikan pada gerakan Arab. Dewannya di kantornya adalah pertemuan penulis, sastrawan, dan pemimpin opini. Ia menerbitkan artikelnya dengan nama 'Emile Hurr' {cite:al-aalam tarjama}."
