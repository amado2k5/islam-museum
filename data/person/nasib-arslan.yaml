summary:
  ar: "نسيب بن حمود بن حسن أرسلان (١٨٦٧–١٩٢٧م)؛ شاعر من الكتّاب المفكرين، من نوابغ الأمراء الأرسلانيين، وأخوه شكيب وعادل. ولد في بيروت وتعلم بالشويفات ثم بمدرسة الحكمة ببيروت، وأولع بشعر الجاهليين والخضرميين فحفظ كثيراً منه وقال الشعر وهو في المدرسة. عُيّن مديراً لناحية الشويفات فأقام نحو عشر سنين محمود السيرة، واستعفى وسكن بيروت. ولما أُعلن الدستور العثماني انتُخب رئيساً لنادي جمعية الاتحاد والترقي في بيروت، ثم تقيأ على الاتحاديين لسوء سيرتهم مع العرب فانفصل عنهم وانضم إلى طلاب اللامركزية، وأخذ ينشر آراءه في جريدة «المفيد» البيروتية فكانت مقالاته أثراً كبيراً في الحركة العربية، وكان مجلسه في مكتبها مجمع الكتّاب والأدباء وقادة الرأي، ويمضي مقالاته باسم «أميل حر» {cite:al-aalam tarjama}."
  en: "Amir Nasib Arslan (1867–1927 CE) — the Beiruti poet-journalist of al-Mufid who broke with the Unionists for the decentralist Arab cause; brother of Shakib Arslan {cite:al-aalam tarjama}."
