summary:
  ar: "شهاب الدين الخفاجي، وُلد سنة ٩٧٧هـ، ١٥٦٩–١٥٧٠م، في سرياقوس قرب القاهرة، ونسبته إلى قبيلة خفاجة، وأول من أخذ عنه خاله أبو بكر الشنواني. صاحب «شفاء الغليل فيما في كلام العرب من الدخيل» وشرح «درة الغواص»."
  en: "Shihab al-Din al-Khafaji, born in 977 AH (1569-70) at Siryaqus near Cairo and named after the tribe of Khafaja; his first teacher was his maternal uncle Abu Bakr al-Shanawani. Author of Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil and of a commentary on Durrat al-ghawwas."
  es: "Shihab al-Din al-Khafaji, nacido en 977 AH (1569-70) en Siryaqus, cerca de El Cairo, y nombrado por la tribu de Khafaja; su primer maestro fue su tío materno Abu Bakr al-Shanawani. Autor del Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil y de un comentario a la Durrat al-ghawwas."
  fr: "Shihab al-Din al-Khafaji, né en 977 AH (1569-70) à Siryaqus près du Caire et nommé d'après la tribu de Khafaja ; son premier maître fut son oncle maternel Abu Bakr al-Shanawani. Auteur du Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil et d'un commentaire de la Durrat al-ghawwas."
  ur: "شہاب الدین خفاجی، 977ھ ⁦(1569–70ء)⁩ میں قاہرہ کے قریب سریاقوس میں پیدا ہوئے، قبیلہ خفاجہ کی نسبت؛ پہلے استاد ان کے ماموں ابو بکر شنوانی تھے۔ شفاء الغلیل فیما فی کلام العرب من الدخیل اور درۃ الغواص کی شرح کے مصنف۔"
  tr: "Şihabeddin el-Hafaci, 977 H., 1569–1570 yıllarında Kahire yakınlarındaki Suriyeklerde doğmuş, Khafaja kabilesine atfedilmiştir ve ondan ilk öğrenen amcası Ebu Bekir el-Shanawani'dir. 'Şifa' el-Ghalili fima fi Kalam al-Arab min al-Dakhil' adlı eserin ve 'Durrat al-Ghawas' üzerine yorumların yazarıdır."
  id: "Shihab al-Din al-Khafaji, lahir pada tahun 977 H, 1569–1570 M, di Syriaqus dekat Kairo, dikaitkan dengan suku Khafaja, dan yang pertama belajar darinya adalah pamannya Abu Bakr al-Shanawani. Penulis 'Shifa' al-Ghaleel fima fi Kalam al-Arab min al-Dakhil' dan komentar atas 'Durrat al-Ghawas'."
