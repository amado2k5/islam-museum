id: person/muayyid-al-din-ibn-al-qassab
class: person
label: { ar: "مؤيد الدين ابن القصاب", en: "Mu'ayyid al-Din Ibn al-Qassab", es: "Mu'ayyid al-Din Ibn al-Qassab", fr: "Mu'ayyid al-Din Ibn al-Qassab", ur: "معیّد الدین ابن القصاب" }
summary:
  ar: "مؤيد الدين أبو عبد الله محمد بن علي المعروف بابن القصاب، نائب الوزارة للخليفة الناصر لدين الله؛ خلع عليه الخليفة خلع الوزارة في شعبان سنة تسعين وخمسمائة وكان قبل ذلك قد ولى الأعمال بخوزستان فعرفها وعرف من أي وجه يمكن الاستيلاء عليها، فلما ولي نيابة الوزارة أشار على الخليفة بأن يرسله في عسكر ليملكها له، فسار فوصلها سنة إحدى وتسعين فملك مدينة تستر في المحرم وملك قلعة الناظر وقلعة كاكرد وقلعة الأموج وغيرها من الحصون، وكان قد راسل بعض بني شملة أصحاب البلاد حين اختلفوا بعد موت أبيهم فاستنجدوه لقدم الصحبة، وأنفذهم بعد الملك إلى بغداد {cite:kamil-ibn-al-athir p. 233-234}."
  en: "Ibn al-Qassab, al-Nasir's deputy-vizier — who had earlier administered Khuzistan and mapped its weakness — won the vizieral robe in Sha'ban 590 and the commission to take the country for the caliph; he took Tustar in Muharram 591, the citadels al-Nazir, Kakard and al-Amuj, and shipped the feuding Banu Shamla heirs off to Baghdad {cite:kamil-ibn-al-athir p. 233-234}."
  es: "Ibn al-Qassab, el vicevisir de al-Nasir, quien anteriormente había administrado Juzestán y había identificado sus puntos débiles, ganó la túnica de visir en Sha'ban 590 y la comisión para tomar el país para el califa; tomó Tustar en Muharram 591, las ciudadelas al-Nazir, Kakard y al-Amuj, y envió a los herederos de Banu Shamla, que estaban en conflicto, a Bagdad {cite:kamil-ibn-al-athir p. 233-234}."
  fr: "Ibn al-Qassab, le vice-vizir d'al-Nasir — qui avait auparavant administré le Khuzistan et cartographié ses faiblesses — obtint la robe de vizir en Sha'ban 590 et la commission de prendre le pays pour le calife; il prit Tustar en Muharram 591, les citadelles d'al-Nazir, de Kakard et d'al-Amuj, et envoya les héritiers querelleurs de Banu Shamla à Bagdad {cite:kamil-ibn-al-athir p. 233-234}."
  ur: "ابن القصاب، الناصر کے نائب وزیر - جس نے پہلے خوزستان کا انتظام کیا تھا اور اس کی کمزوری کی نقشہ کشی کی تھی - نے شعبان 590 میں وزیر کا لباس اور ملک کو خلیفہ کے لیے لینے کا کمیشن حاصل کیا؛ اس نے محرم 591 میں تسطار لیا، قلعہ النظیر، ککرد اور العموج، اور جنگجو بنو شاملہ کے وارثوں کو بغداد بھیج دیا۔ 233-234}۔"
  tr: "Mu'eyyad al-Din Abu Abdullah Muhammed bin Ali, İbn al-Kasab olarak bilinir, Halife Nasir li-Din Allah'ın yardımcısıydı; halife onu görevden aldı ve 590 Hicri yılında Şaban'da görevden aldı. Bundan önce, Huzistan'da yönetimi yürütmüş ve onu nasıl ele geçireceğini biliyordu. Vezirliği devraldığında, halifeye onu bir askeri kampa göndermesini tavsiye etti. 1991'de oraya ulaştı, burada Muharrem'deki Tuster şehrini, Kakard, Kakard, Kalaat al-Amuj ve diğer kaleleri yönetti. Babalarının ölümünden sonra anlaşmazlık yaşadıklarında bazı Banu Şamla ile yazışmıştı, bu yüzden yakın dostluk için ondan yardım istediler. Krallıktan sonra onları Bağdat'a gönderdi {alıntı:) Kamil-ibn-al-Athir s. 233-234}."
  id: "Mu'ayyad al-Din Abu Abdullah Muhammad ibn Ali, yang dikenal sebagai Ibn al-Qassab, adalah wakil menteri untuk Khalifah al-Nasir li-Din Allah; khalifah menggulingkannya dan mencopotkannya di Sha'ban pada tahun 590 H. Sebelumnya, ia memegang pemerintahan di Khuzestan, mengetahui cara merebutnya. Ketika ia mengambil alih jabatan wazir, ia menyarankan khalifah untuk mengirimnya ke kamp militer untuk memerintahnya. Ia melakukan perjalanan dan sampai di sana pada tahun 1991, di mana ia memerintah kota Tuster di Muharram, serta memerintah Qalaat al-Nazir, Kakard, Qalaat al-Amuj, dan benteng-benteng lainnya. Ia pernah berkorespondensi dengan beberapa Banu Shamla ketika mereka tidak sepakat setelah kematian ayah mereka, sehingga mereka meminta bantuannya untuk menjaga kebersamaan erat. Setelah menjadi raja, ia mengirim mereka ke Baghdad {cite:kamil-ibn-al-athir hlm. 233-234}."
