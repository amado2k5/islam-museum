summary:
  ar: "مؤيد الدين أبو عبد الله محمد بن علي المعروف بابن القصاب، نائب الوزارة للخليفة الناصر لدين الله؛ خلع عليه الخليفة خلع الوزارة في شعبان سنة تسعين وخمسمائة وكان قبل ذلك قد ولى الأعمال بخوزستان فعرفها وعرف من أي وجه يمكن الاستيلاء عليها، فلما ولي نيابة الوزارة أشار على الخليفة بأن يرسله في عسكر ليملكها له، فسار فوصلها سنة إحدى وتسعين فملك مدينة تستر في المحرم وملك قلعة الناظر وقلعة كاكرد وقلعة الأموج وغيرها من الحصون، وكان قد راسل بعض بني شملة أصحاب البلاد حين اختلفوا بعد موت أبيهم فاستنجدوه لقدم الصحبة، وأنفذهم بعد الملك إلى بغداد {cite:kamil-ibn-al-athir p. 233-234}."
  en: "Ibn al-Qassab, al-Nasir's deputy-vizier — who had earlier administered Khuzistan and mapped its weakness — won the vizieral robe in Sha'ban 590 and the commission to take the country for the caliph; he took Tustar in Muharram 591, the citadels al-Nazir, Kakard and al-Amuj, and shipped the feuding Banu Shamla heirs off to Baghdad {cite:kamil-ibn-al-athir p. 233-234}."
