summary:
  ar: "أمانغكورات الأول (1619 – 13 تموز 1677)، وُلد باسم رادن ماس سايّدين، سوسوهونان ماتارام في جاوة من 1646 إلى 1677 وابن سلطان أغونغ وخليفته. مركَز السلطنة بتصفيات في النبلاء وبمذبحة للعلماء وأسرهم سنة 1648 — كما روى مبعوث الشركة الهولندية ريكلوف فان غونس في التقارير التي تتبعها المقالتان الإنجليزية والإندونيسية وقُدّر ضحاياها بنحو خمسة إلى ستة آلاف — ونقل البلاط من كارتا إلى بليريد، ثم أخرجه تمرّد تروناجايا سنة 1677 فمات في فراره قرب تيغال وخلفه ابنه أمانغكورات الثاني."
  en: "Amangkurat I (1619 – 13 July 1677), born Raden Mas Sayyidin, was susuhunan of Mataram in Java from 1646 to 1677, son and successor of Sultan Agung. He centralised the sultanate through purges of nobles and — in the report of the Dutch envoy Rijcklof van Goens, followed by both the English and Indonesian articles — a massacre of ulema and their families in 1648 put at some 5,000-6,000 people, moved the court from Karta to Plered, and in 1677 was driven out by the Trunajaya rebellion, dying in flight near Tegal and succeeded by his son Amangkurat II."
  ur: "امانگکورات اول (1619ء – 13 جولائی 1677ء)، پیدائشی نام رادن ماس سیدین، 1646ء سے 1677ء تک جاوا میں ماتارام کے سوسوہونان تھے، سلطان آگونگ کے بیٹے اور جانشین۔ انہوں نے امراء کی صفائیوں اور — ولندیزی ایلچی رائکلوف وان گوئنس کی رپورٹ کے مطابق، جس کی پیروی انگریزی اور انڈونیشیائی دونوں مقالے کرتے ہیں — 1648ء میں علماء اور ان کے خاندانوں کے اس قتلِ عام کے ذریعے سلطنت کو مرکزی بنایا جس کے مقتول تقریباً پانچ سے چھ ہزار بتائے جاتے ہیں، دربار کارتا سے پلیرید منتقل کیا، اور 1677ء میں تروناجایا کی بغاوت نے انہیں نکال دیا؛ تیگال کے قریب فرار میں وفات پائی اور بیٹے امانگکورات دوم جانشین ہوئے۔"

