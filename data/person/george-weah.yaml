summary:
  ar: "لاعب كرة قدم ليبيري معتزل ورئيس ليبيريا الخامس والعشرون (2018–2024)، وُلد في مونروفيا سنة 1966. الأفريقي الوحيد الفائز بالكرة الذهبية وجائزة أفضل لاعب في العالم من الفيفا (1995 مع ميلان)، وأول لاعب محترف سابق يصبح رئيس دولة؛ انتُخب عضوًا في مجلس الشيوخ قبل رئاسته."
  en: "Liberian retired footballer and 25th president of Liberia (2018–2024), born in Monrovia in 1966. The only African winner of both the Ballon d'Or and the FIFA World Player of the Year award (both in 1995, at AC Milan), and the first former professional footballer to become a head of state; he served as a senator before his presidency."
  ur: "لائبیریا کے ریٹائرڈ فٹبالر اور لائبیریا کے 25ویں صدر (2018–2024)، 1966 میں مونروویا میں پیدا ہوئے۔ بیلن ڈی اور اور فیفا ورلڈ پلیئر آف دی ایئر (دونوں 1995، اے سی میلان میں) جیتنے والے واحد افریقی، اور سربراہِ مملکت بننے والے پہلے سابق پیشہ ور فٹبالر؛ صدارت سے پہلے سینیٹر رہے۔"
