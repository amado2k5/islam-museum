  fr: "Le premier roi de la liste royale franque, l'évêque Urmazd, envoya al-Hakam en 328 — « un mage dont l'épouse Ghartala l'a converti au christianisme », remplacé par son fils Ludhriq, puis Daqashrat {cite:muruj-al-dhahab p. 358}."
  ur: "فرانکی حکومت کی فہرست میں پہلے بادشاہ بشپ ارمازد نے 328 میں الحکم کو بھیجا - 'ایک مجوسی جس کی بیوی گھرتلا نے اسے عیسائی بنایا'، اس کے بعد اس کا بیٹا لدھیرک، پھر دقشرت {حوالہ: مروج الذہب صفحہ 358}۔"
