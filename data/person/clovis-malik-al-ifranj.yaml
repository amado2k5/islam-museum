summary:
  ar: "أول ملوك الإفرنجة في القائمة التي أرسلها عرماز أسقف جربدة إلى الحكم بن عبد الرحمن سنة ثمان وعشرين وثلاثمائة؛ كان مجوسياً فنصرته امرأته غرطلة، ثم ملك بعده ابنه لذريق ثم دقشرت {cite:muruj-al-dhahab p. 358}."
  en: "First king in the Frankish regnal list Bishop Urmazd sent al-Hakam in 328 — 'a Magian whose wife Ghartala converted him to Christianity', succeeded by his son Ludhriq, then Daqashrat {cite:muruj-al-dhahab p. 358}."
