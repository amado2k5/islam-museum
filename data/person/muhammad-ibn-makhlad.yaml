summary:
  ar: "محمد بن مخلد العطار محدّث بغدادي توفي سنة 331هـ/942 ــ 943م، ذكره الخطيب في تاريخ بغداد والذهبي في تذكرة الحفاظ، وهو من شيوخ الحديث عند اللغوي ابن خالويه الهمذاني. لا تقدم دائرة المعارف الإسلامية عنه ترجمة مستقلة، وما يُعرف هنا مستخلص من الإشارة إليه في مادة ابن خالويه {cite:encyclopaedia-of-islam-2 vol. 3 p. 856}."
  en: "Muhammad ibn Makhlad al-Attar was a hadith transmitter of Baghdad who died in 331/942-3. Al-Khatib's History of Baghdad and al-Dhahabi's Tadhkirat al-huffaz record him, and he was one of the hadith teachers of the philologist Ibn Khalawayh of Hamadhan. The Encyclopaedia of Islam has no article on him, so what is known here comes from its mention in the Ibn Khalawayh entry {cite:encyclopaedia-of-islam-2 vol. 3 p. 856}."
  ur: "محمد بن مخلد عطار بغداد کے ایک محدث تھے جو 331ھ/942 ــ 943ء میں فوت ہوئے۔ خطیب کی تاریخ بغداد اور ذہبی کی تذکرۃ الحفاظ میں ان کا ذکر ہے اور وہ ہمدان کے ماہرِ لغت ابن خالویہ کے حدیث کے اساتذہ میں سے تھے۔ دائرۃ المعارف اسلامیہ میں ان پر الگ مضمون نہیں، اس لیے یہاں جو معلوم ہے وہ ابن خالویہ کے مضمون میں ان کے ذکر سے ماخوذ ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 856}."
