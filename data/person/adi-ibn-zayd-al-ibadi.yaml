summary:
  ar: "شاعر الحيرة النصراني، له في قتل سابور للنضيرة بنت الضيزن وما كان منها من الغدر بأبيها وقومها وإرشاد سابور إلى دخول الحصن قصيدته المشهورة والحضر صبت عليه داهية {cite:muruj-al-dhahab p. 553-554}."
  en: "The Christian poet of al-Hira whose famous ode on Shapur's killing of al-Nadira — 'A calamity poured over al-Hadr' — mourns her treachery and its price {cite:muruj-al-dhahab p. 553-554}."
  fr: "Poète chrétien d'al-Hira dont la célèbre ode sur la mise à mort d'al-Nadira par Shapur — « Un malheur s'abattit sur al-Hadr » — déplore sa trahison et son prix {cite:muruj-al-dhahab p. 553-554}."
  es: "El poeta cristiano de al-Hira, cuya famosa oda sobre el asesinato de al-Nadira por Shapur — 'Una calamidad se derramó sobre al-Hadr' — lamenta su traición y su precio {cite:muruj-al-dhahab p. 553-554}."
  ur: "الحیرہ کی مسیحی شاعر جس کا شاپور کی جانب سے النادیرہ کے قتل پر مشہور غزل - 'الحدر پر ایک آفت نازل ہوئی' - اس کی غداری اور اس کی قیمت پر ماتم کرتی ہے۔ 553-554}۔"
  tr: "Hira'lı Hristiyan şairin, Şapur'un Nadira bint el-Dhayzan'ı öldürmesi ve Nadira'nın babasına ve halkına ihanet ederek Şapur'u kaleye girmeye yönlendirmesi ve bunun sonucunda Şapur'un şehirde başına gelen felaket hakkında ünlü bir şiiri vardır. {kaynak: Muruj-al-Dhahab s. 553-554}."
  id: "Penyair Kristen dari Hira, memiliki sebuah puisi terkenal tentang Shapur yang membunuh Nadira bint al-Dhayzan dan apa yang dilakukannya sebagai pengkhianatan terhadap ayahnya dan kaumnya serta membimbing Shapur untuk memasuki benteng, dan malapetaka menimpanya di kota {cite:muruj-al-dhahab p. 553-554}."
