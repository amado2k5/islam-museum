summary:
  ar: "شمس الدين إلدجز؛ رجل من بلاد القفجاق كان مملوكاً للسلطان مسعود السلجوقي في العراق، أسس أتابكية أذربيجان سنة 531هـ فدامت دولته في الجبال وأذربيجان والعراق العجمي نحو قرن حتى أزالها خوارزمشاه سنة 622هـ."
  en: "Shams al-Din Eldiguz; a Qipchaq mamluk of the Seljuk sultan Mas'ud of Iraq who founded the Azerbaijan atabegate in 531 — his house ruling the Jibal and Persian Iraq for near a century until Khwarazmshah ended it in 622."
