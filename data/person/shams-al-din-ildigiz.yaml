summary:
  ar: "شمس الدين إلدجز؛ رجل من بلاد القفجاق كان مملوكاً للسلطان مسعود السلجوقي في العراق، أسس أتابكية أذربيجان سنة 531هـ فدامت دولته في الجبال وأذربيجان والعراق العجمي نحو قرن حتى أزالها خوارزمشاه سنة 622هـ."
  en: "Shams al-Din Eldiguz; a Qipchaq mamluk of the Seljuk sultan Mas'ud of Iraq who founded the Azerbaijan atabegate in 531 — his house ruling the Jibal and Persian Iraq for near a century until Khwarazmshah ended it in 622."
  es: "Shams al-Din Eldiguz; un mameluco kipchaq del sultán selyúcida Mas'ud de Irak que fundó el atabegate de Azerbaiyán en 531; su dinastía gobernó el Jibal y el Irak persa durante casi un siglo hasta que Khwarazmshah le puso fin en 622."
  fr: "Shams al-Din Eldiguz; un mamelouk qipchaq du sultan seldjoukide Mas'ud d'Irak qui fonda l'atabégate d'Azerbaïdjan en 531 — sa maison régnant sur le Jibal et l'Irak perse pendant près d'un siècle jusqu'à ce que Khwarezmshah y mette fin en 622."
  ur: "شمس الدین الدیگز؛ عراق کے سلجوق سلطان مسعود کا ایک کیپچاق مملوک جس نے 531 میں آذربائیجان اتابیگیٹ کی بنیاد رکھی - اس کے گھر نے جبل اور فارس عراق پر تقریباً ایک صدی تک حکومت کی یہاں تک کہ خوارزمشاہ نے اسے 622 میں ختم کر دیا۔"
  tr: "Irak'ta Selçuklu Sultan Mesud'un kölesi olan Kipçak topraklarından Şemseddin Eldicas, 531 Hicri'nde Azerbaycan Atabegleri'ni kurdu. Devleti yaklaşık bir yüzyıl boyunca dağlarda, Azerbaycan'da ve Acemi Irak'ta varlığını sürdürdü, ta ki 622 Hicri yılında Harezmşah tarafından devrilene kadar."
  id: "Shams al-Din Eldijaz, seorang pria dari tanah Kipchak yang merupakan budak Sultan Mas'ud dari Seljuk di Irak, mendirikan Atabeg Azerbaijan pada tahun 531 H. Negaranya bertahan di pegunungan, Azerbaijan, dan Ajami Irak selama sekitar satu abad hingga digulingkan oleh Khwarezmshah pada tahun 622 H."
