summary:
  ar: "أحمد بن إبراهيم بن عبد الغني، أبو العباس شمس الدين السروجي، فقيه حنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} تفقه على أبي الربيع سليمان بن أبي العز، وأبي الظاهر إسحاق بن علي بن يحيى، والشيخ نجم الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} كان مشاركًا في علوم، وجمع وصنّف وأفتى ودرّس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} من تصانيفه «اعتراضات على ابن تيمية» في علم الكلام، و«شرح الهداية» وسماه «الغاية» ولم يكمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
  en: "Ahmad ibn Ibrahim ibn Abd al-Ghani, Abu al-Abbas Shams al-Din al-Saruji, a Hanafi jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He studied under Abu al-Rabi' Sulayman ibn Abi al-Izz, Abu al-Zahir Ishaq ibn Ali ibn Yahya and Shaykh Najm al-Din. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He was active in many sciences and also compiled, wrote, issued legal opinions and taught. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} His works include Objections to Ibn Taymiyya in kalam, and a commentary on al-Hidaya which he titled al-Ghaya and did not complete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
  fr: "Ahmad ibn Ibrahim ibn Abd al-Ghani, Abu al-Abbas Shams al-Din al-Saruji, juriste hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Il étudia auprès d'Abu al-Rabi' Sulayman ibn Abi al-Izz, d'Abu al-Zahir Ishaq ibn Ali ibn Yahya et du cheikh Najm al-Din. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Actif dans de nombreuses sciences, il compilait, écrivait, rendait des avis juridiques et enseignait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Ses œuvres comprennent des Objections à Ibn Taymiyya en théologie et un commentaire inachevé d'al-Hidaya intitulé al-Ghaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
  es: "Ahmad ibn Ibrahim ibn Abd al-Ghani, Abu al-Abbas Shams al-Din al-Saruji, jurista hanafí. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Estudió con Abu al-Rabi' Sulayman ibn Abi al-Izz, Abu al-Zahir Ishaq ibn Ali ibn Yahya y Shaykh Najm al-Din. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Participó activamente en muchas ciencias y también compiló, escribió, emitió opiniones jurídicas y enseñó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Sus obras incluyen Objeciones a Ibn Taymiyya en kalam y un comentario sobre al-Hidaya que tituló al-Ghaya y no completó. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
  ur: "احمد بن ابراہیم ابن عبد الغنی، ابو العباس شمس الدین السروجی، حنفی فقیہ۔ انہوں نے ابو الربیع سلیمان ابن ابی العز، ابو الظاہر اسحاق ابن علی ابن یحییٰ اور شیخ نجم الدین سے تعلیم حاصل کی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 14957} وہ بہت سے علوم میں سرگرم تھے اور تالیف، تصنیف، قانونی آراء اور تدریس بھی کرتے تھے۔ ان کی تصانیف میں ابن تیمیہ کے کلام پر اعتراضات اور الہدایہ کی تفسیر شامل ہے جسے انہوں نے الضیاء کا عنوان دیا اور مکمل نہیں کیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص14958}"
  tr: "Ahmed ibn İbrahim ibn Abd al-Ghani, Ebu el-Abbas Şems el-Din el-Saruji, Hanefi fıkıhçıydı. Fıkıh eğitimini Ebu el-Rabi' Süleyman ibn Abi el-İzz, Ebu el-Zahir İshak ibn Ali ibn Yahya ve Şeyh Necm el-Din'den aldı. Çeşitli ilimlerde bilgi sahibiydi; derleme, sınıflandırma, hukuki görüş bildirme ve öğretim alanlarında çalıştı. Eserleri arasında teoloji alanında \"İbn Teymiye'ye İtirazlar\" ve \"el-Hidaye Tefsiri\" (ki buna \"el-Ghaye\" adını vermişti ancak tamamlamadı) bulunmaktadır."
  id: "Ahmad ibn Ibrahim ibn Abd al-Ghani, Abu al-Abbas Shams al-Din al-Saruji, seorang ahli hukum Hanafi. Ia belajar ilmu hukum di bawah bimbingan Abu al-Rabi' Sulayman ibn Abi al-'Izz, Abu al-Zahir Ishaq ibn Ali ibn Yahya, dan Syekh Najm al-Din. Ia mahir dalam berbagai ilmu, menyusun, mengklasifikasikan, mengeluarkan pendapat hukum, dan mengajar. Di antara karyanya adalah \"Keberatan terhadap Ibn Taymiyyah\" dalam bidang teologi, dan \"Komentar tentang al-Hidayah,\" yang ia beri judul \"al-Ghayah\" tetapi tidak diselesaikan."
