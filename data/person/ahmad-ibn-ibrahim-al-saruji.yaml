summary:
  ar: "أحمد بن إبراهيم بن عبد الغني، أبو العباس شمس الدين السروجي، فقيه حنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} تفقه على أبي الربيع سليمان بن أبي العز، وأبي الظاهر إسحاق بن علي بن يحيى، والشيخ نجم الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} كان مشاركًا في علوم، وجمع وصنّف وأفتى ودرّس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} من تصانيفه «اعتراضات على ابن تيمية» في علم الكلام، و«شرح الهداية» وسماه «الغاية» ولم يكمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
  en: "Ahmad ibn Ibrahim ibn Abd al-Ghani, Abu al-Abbas Shams al-Din al-Saruji, a Hanafi jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He studied under Abu al-Rabi' Sulayman ibn Abi al-Izz, Abu al-Zahir Ishaq ibn Ali ibn Yahya and Shaykh Najm al-Din. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He was active in many sciences and also compiled, wrote, issued legal opinions and taught. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} His works include Objections to Ibn Taymiyya in kalam, and a commentary on al-Hidaya which he titled al-Ghaya and did not complete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14958}"
