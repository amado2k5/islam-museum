id: person/abu-bakr-ibn-mansur-al-samani
class: person
label: { ar: "أبو بكر السمعاني", en: "Abu Bakr al-Sam'ani", fr: "Abu Bakr al-Sam'ani", es: "Abu Bakr al-Sam'ani", ur: "ابوبکر السمانی" }
names:
  - { value: "تاج الإسلام أبو بكر محمد بن منصور بن محمد التميمي المروزي", kind: full }
summary:
  ar: "الحافظ المروزي والد الحافظ أبي سعد السمعاني؛ كان بارعاً في الحديث ومعرفته والفقه ودقائقه — وكان شافعياً — والأدب وفنونه والتاريخ والنسب والوعظ، رحل فسمع ببغداد ونيسابور وأصبهان والكوفة والحجاز وأملى الكثير وتقدم على أقرانه، وقال عبد الغافر: هو الإمام ابن الإمام ابن الإمام ووالد الإمام؛ توفي سنة عشر وخمسمائة عن ثلاث وأربعين سنة {cite:shadharat-dhahab p. 509}."
  en: "The Marwazi hafiz Taj al-Islam Abu Bakr al-Sam'ani, father of the hafiz Abu Sa'd — master of hadith, Shafi'i fiqh, adab, history and genealogy who taught dictations across the Hijaz, Iraq and Khurasan; 'imam son of imam son of imam, and father of an imam'; d. 510 at forty-three {cite:shadharat-dhahab p. 509}."
  fr: "Le hafiz de Merv Taj al-Islam Abu Bakr al-Sam'ani, père du hafiz Abu Sa'd — maître du hadith, du fiqh shafi'ite, de l'adab, de l'histoire et de la généalogie, qui dicta des leçons à travers le Hedjaz, l'Iraq et le Khurasan ; « imam fils d'imam fils d'imam, et père d'un imam » ; mort en 510 à quarante-trois ans {cite:shadharat-dhahab p. 509}."
  es: "El hafiz marwazi Taj al-Islam Abu Bakr al-Sam'ani, padre del hafiz Abu Sa'd, maestro de hadices, fiqh shafi'i, adab, historia y genealogía que impartió dictados por todo el Hiyaz, Irak y Jorasán; 'imán hijo de imán hijo de imán, y padre de un imán'; murió en 510 a los cuarenta y tres años {cite:shadharat-dhahab p. 509}."
  ur: "مروازی حافظ تاج الاسلام ابوبکر السمانی، حافظ ابو سعد کے والد - حدیث، شافعی فقہ، ادب، تاریخ اور نسب کے ماہر جنہوں نے حجاز، عراق اور خراسان میں حکم کی تعلیم دی۔ 'امام کا بیٹا امام کا بیٹا اور امام کا باپ'؛ d 510 پر تینتالیس {حوالہ: شدارت ذہاب ص۔ 509}۔"
  tr: "El-Hafız El-Marvezi, El-Hafız Ebu Saad El-Samani'nin babası, Hadis ve hadis ilmi, fıkıh ve incelikleri konusunda -ve Şafiî mezhebine mensuptu- edebiyat ve edebiyat, tarih, şecere ve vaaz konularında uzmandı. Bağdat, Nişapur, İsfahan, Kufe ve Hicaz'da seyahat etti, vaazlar verdi, birçok eser dikte ettirdi ve akranlarını geride bıraktı. Abdül-Gafir şöyle dedi: O, İmam, İmamın oğlu, İmamın oğlu ve İmamın babasıdır. Hicri 510 yılında kırk üç yaşında vefat etti. {kaynak: Şadharat-dhahab s. 509}"
  id: "Al-Hafiz Al-Marwazi, ayah dari Al-Hafiz Abu Saad Al-Samani, mahir dalam Hadits dan ilmunya, fiqih dan seluk-beluknya—dan beliau adalah seorang Syafi'i—sastra dan seninya, sejarah, silsilah, dan dakwah. Beliau melakukan perjalanan dan belajar di Baghdad, Nishapur, Isfahan, Kufa, dan Hijaz, serta banyak mendiktekan dan melampaui rekan-rekannya. Abd Al-Ghafir berkata: Beliau adalah Imam, putra Imam, putra Imam, dan ayah dari Imam. Beliau wafat pada tahun 510 H pada usia empat puluh tiga tahun. {cite:shadharat-dhahab p. 509}"
