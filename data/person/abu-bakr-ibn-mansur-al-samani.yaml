summary:
  ar: "الحافظ المروزي والد الحافظ أبي سعد السمعاني؛ كان بارعاً في الحديث ومعرفته والفقه ودقائقه — وكان شافعياً — والأدب وفنونه والتاريخ والنسب والوعظ، رحل فسمع ببغداد ونيسابور وأصبهان والكوفة والحجاز وأملى الكثير وتقدم على أقرانه، وقال عبد الغافر: هو الإمام ابن الإمام ابن الإمام ووالد الإمام؛ توفي سنة عشر وخمسمائة عن ثلاث وأربعين سنة {cite:shadharat-dhahab p. 509}."
  en: "The Marwazi hafiz Taj al-Islam Abu Bakr al-Sam'ani, father of the hafiz Abu Sa'd — master of hadith, Shafi'i fiqh, adab, history and genealogy who taught dictations across the Hijaz, Iraq and Khurasan; 'imam son of imam son of imam, and father of an imam'; d. 510 at forty-three {cite:shadharat-dhahab p. 509}."
