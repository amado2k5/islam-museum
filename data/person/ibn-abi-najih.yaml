summary:
  ar: عبد الله بن أبي نجيح يسار، أبو يسار الثقفي المكي، مولى الأخنس بن شريق، مفسر ومفتي مكة بعد عمرو بن دينار؛ وثقه ابن معين وغيره، وذكر النقاد دخوله في القدر والاعتزال، وتوفي سنة ١٣١هـ.
  en: Abd Allah ibn Abi Najih Yasar, Abu Yasar al-Thaqafi al-Makki, a client of al-Akhnas ibn Shuraiq, exegete and mufti of Mecca after Amr ibn Dinar; Ibn Ma'in and others held him reliable while the critics record his entry into qadar and i'tizal; he died in 131 AH.
