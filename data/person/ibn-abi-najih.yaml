gender: male
summary:
  ar: عبد الله بن أبي نجيح يسار، أبو يسار الثقفي المكي، مولى الأخنس بن شريق، مفسر ومفتي مكة بعد عمرو بن دينار؛ وثقه ابن معين وغيره، وذكر النقاد دخوله في القدر والاعتزال، وتوفي سنة ١٣١هـ.
  en: Abd Allah ibn Abi Najih Yasar, Abu Yasar al-Thaqafi al-Makki, a client of al-Akhnas ibn Shuraiq, exegete and mufti of Mecca after Amr ibn Dinar; Ibn Ma'in and others held him reliable while the critics record his entry into qadar and i'tizal; he died in 131 AH.
  es: "Abd Allah ibn Abi Najih Yasar, Abu Yasar al-Thaqafi al-Makki, cliente de al-Akhnas ibn Shuraiq, exegeta y mufti de La Meca después de Amr ibn Dinar; Ibn Ma'in y otros lo consideraron confiable mientras los críticos registran su entrada en qadar e i'tizal; Murió en 131 AH."
  fr: "Abd Allah ibn Abi Najih Yasar, Abu Yasar al-Thaqafi al-Makki, client d'al-Akhnas ibn Shuraiq, exégète et mufti de La Mecque après Amr ibn Dinar; Ibn Ma'in et d'autres le tenaient pour fiable tandis que les critiques enregistrent son entrée dans le qadar et l'itizal; il mourut en 131 AH."
  ur: "عبد اللہ بن ابی نجیح یسار، ابو یسار الثقفی المکی، الاخناس بن شوریق کے مؤکل، عمرو بن دینار کے بعد مکہ کے مفسر اور مفتی؛ ابن معین اور دیگر نے اسے قابل اعتماد قرار دیا ہے جبکہ ناقدین نے اس کا قدر اور اعتکاف میں داخلہ درج کیا ہے۔ آپ کی وفات 131ھ میں ہوئی۔"
  tr: "Abdullah ibn Abi Najih Yasar, Ebu Yasar el-Tekafi el-Makki, el-Akhnas ibn Şurayk'ın özgür adamı, Amr ibn Dinar'dan sonra Mekke'nin tefsiri ve müftüsü; İbn Ma'in ve diğerleri tarafından doğrulandı, eleştirmenler kadere ve Mu'tazillere girişinden bahsetti ve 131 Hicri yılında öldü."
  id: "Abdullah ibn Abi Najih Yasar, Abu Yasar al-Thaqafi al-Makki, mantan al-Akhnas ibn Shurayq, penafsir dan mufti Mekah setelah Amr ibn Dinar; ia disahkan oleh Ibn Ma'in dan lainnya, dan para kritikus menyebutkan kemasukannya ke dalam predestinasi dan Mu'tazilite, dan ia meninggal pada tahun 131 H."
