summary:
  ar: "خازم بن خزيمة التميمي أمير المنصور؛ وجّهه المنصور مع روح بن حاتم المهلبي إلى طبرستان حين نقض أهلها وقتلوا المسلمين ومعهما مولاه مرزوق أبو الخصيب الذي احتال للفتح ونسب إليه قصر الخصيب بالكوفة."
  en: "Khazim ibn Khuzayma al-Tamimi, al-Mansur's commander; sent with Rawh ibn Hatim against breaching Tabaristan — his mawla Marzuq Abu al-Khasib, namesake of Kufa's Qasr al-Khasib, contrived the city's fall by the false-defection ruse."
  es: "Khazim ibn Khuzayma al-Tamimi, comandante de al-Mansur; enviado con Rawh ibn Hatim contra la invasión de Tabaristán; su mawla Marzuq Abu al-Khasib, homónimo de Qasr al-Khasib de Kufa, ideó la caída de la ciudad mediante la artimaña de la falsa deserción."
  fr: "Khazim ibn Khuzayma al-Tamimi, commandant d'al-Mansur; envoyé avec Rawh ibn Hatim contre la brèche dans le Tabaristan - son mawla Marzuq Abu al-Khasib, homonyme de Qasr al-Khasib de Kufa, a provoqué la chute de la ville par la ruse de la fausse défection."
  ur: "خزیم بن خزیمہ التمیمی، المنصور کا کمانڈر؛ راح ابن حاتم کے ساتھ تبرستان کی خلاف ورزی کے خلاف بھیجا - اس کے مولا مرزوق ابو الخصیب، کوفہ کے قصر الخصیب کے نام سے، جھوٹے انحراف کی چال سے شہر کے زوال کا سبب بنے۔"
