summary:
  ar: "ابن ديصان وإنما سمي لأنه ولد على نهر يقال له ديصان، ظهر بعد مرقيون بنحو ثلاثين سنة، وهو عند ابن النديم في مذاهب التنوية {cite:fihrist-ibn-al-nadim p. 458}. وله كتاب النور والظلمة وكتاب روحانية الحق وكتاب المتحرك والجماد وكتب كثيرة {cite:fihrist-ibn-al-nadim p. 474}"
  en: "Bar Daysan — named for the river on which he was born; appeared ~30 years after Marcion {cite:fihrist-ibn-al-nadim}"
