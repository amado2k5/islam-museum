summary:
  ar: "ممثلة هندية (وُلدت سنة 1992) في حيدر آباد، بدأت طفلةً في «تشاتشي 420» (1997) وذاع صيتها بدور المصارعة غيتا فوغات في «دانغال» (2016)، أعلى الأفلام الهندية إيراداً، ثم تألقت في «لودو» (2020) وجسّدت أنديرا غاندي في «سام بهادور» (2023)."
  en: "Indian actress (born 1992) at Hyderabad who began as a child artist in Chachi 420 (1997) and rose to fame as the wrestler Geeta Phogat in Dangal (2016), the highest-grossing Indian film; she later starred in Ludo (2020) and portrayed Indira Gandhi in Sam Bahadur (2023)."
  ur: "بھارتی اداکارہ (پیدائش 1992) جو حیدر آباد میں پیدا ہوئیں، بچپن میں «چاچی 420» (1997) سے آغاز کیا اور «دنگل» (2016) میں پہلوان گیتا پھوگٹ کا کردار ادا کر کے شہرت پائی؛ بعد میں «لڈو» (2020) میں کام کیا اور «سام بہادر» (2023) میں اندرا گاندھی کا کردار نبھایا۔"
