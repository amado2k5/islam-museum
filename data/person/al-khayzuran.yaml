label: { ar: "الخيزران أم الخلفاء", en: "al-Khayzuran, Mother of the Caliphs" }
summary:
  ar: "أم الخلفاء؛ عند البلاذري أمرت أن يحفر النهر المعروف بمحدود فسمته الريان وكان وكيلها جعله أقساماً وحدّ كل قسم ووكل بحفره قوماً فسمي محدوداً، وعند السيوطي لا تعرف امرأة ولدت خليفتين إلا الخيزران أم الهادي والرشيد وولادة بنت العباس العبسية زوج عبد الملك ولدت الوليد وسليمان وشاهفرند بنت فيروز ولدت للوليد بن عبد الملك يزيد الناقص وإبراهيم، وكانت الخيزران حاكمة مستبدة بالأمور الكبار في عهد ولدها الهادي وقيل إنها دبرت قتله لما زجرها عن مواكب بابها {cite:tarikh-khulafa-minhaj-1434 p. 451-453}، وبنت الدار التي فيها مولد النبي بمكة مسجداً {cite:muruj-al-dhahab p. 571}، وفي دارها المعروفة بأشناس دخلت عليها مزنة امرأة مروان بن محمد في أطمار رثة فأحسنت إليها، وشكت إليها عتبة جاريتها تشبيب أبي العتاهية {cite:muruj-al-dhahab p. 303-305}"
  en: "Mother of the caliphs; in al-Baladhuri she ordered the canal known as Mahdud dug — naming it al-Rayyan — her agent dividing it into bounded sections each assigned to a digging crew, whence the name Mahdud."
