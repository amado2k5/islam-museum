id: person/al-khayzuran
education:
  did_you_know:
    ar: "الخيزران أم الخلفاء؛ أمرت أن يحفر النهر المعروف بمحدود فسُمّي الريان وكان وكيلها قسّمه أقساماً ووكّل بحفر كل قسم قوماً، ويقال لا تعرف امرأة ولدت خليفتين سواها."
    en: "Al-Khayzuran, mother of caliphs, ordered the digging of the stream called al-Rayyan — her agent parcelled it into sections, each dug by a crew; it is said no other woman bore two caliphs."
    ur: "خیزران، خلفا کی ماں، نے وہ نہر کھدوائی جو ریان کہلائی — اس کے نائب نے اسے حصوں میں بانٹا؛ کہا جاتا ہے اس کے سوا کسی عورت نے دو خلیفوں کو جنم نہیں دیا۔"
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434]
