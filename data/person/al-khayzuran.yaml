label: { ar: "الخيزران أم الخلفاء", en: "al-Khayzuran, Mother of the Caliphs", es: "al-Khayzuran, Mother of the Caliphs", fr: "al-Khayzuran, Mother of the Caliphs", ur: "الخیزوران، خلفاء کی ماں" }
summary:
  ar: "أم الخلفاء؛ عند البلاذري أمرت أن يحفر النهر المعروف بمحدود فسمته الريان وكان وكيلها جعله أقساماً وحدّ كل قسم ووكل بحفره قوماً فسمي محدوداً، وعند السيوطي لا تعرف امرأة ولدت خليفتين إلا الخيزران أم الهادي والرشيد وولادة بنت العباس العبسية زوج عبد الملك ولدت الوليد وسليمان وشاهفرند بنت فيروز ولدت للوليد بن عبد الملك يزيد الناقص وإبراهيم، وكانت الخيزران حاكمة مستبدة بالأمور الكبار في عهد ولدها الهادي وقيل إنها دبرت قتله لما زجرها عن مواكب بابها {cite:tarikh-khulafa-minhaj-1434 p. 451-453}، وبنت الدار التي فيها مولد النبي بمكة مسجداً {cite:muruj-al-dhahab p. 571}، وفي دارها المعروفة بأشناس دخلت عليها مزنة امرأة مروان بن محمد في أطمار رثة فأحسنت إليها، وشكت إليها عتبة جاريتها تشبيب أبي العتاهية {cite:muruj-al-dhahab p. 303-305}"
  en: "Mother of the caliphs; in al-Baladhuri she ordered the canal known as Mahdud dug — naming it al-Rayyan — her agent dividing it into bounded sections each assigned to a digging crew, whence the name Mahdud."
  es: "Madre de los califas; en al-Baladhuri ordenó excavar el canal conocido como Mahdud, al que llamó al-Rayyan; su agente lo dividió en secciones delimitadas, cada una asignada a un equipo de excavación, de donde proviene el nombre Mahdud."
  fr: "Mère des califes; à al-Baladhuri, elle ordonna le creusement du canal connu sous le nom de Mahdud — le nommant al-Rayyan — son agent le divisant en sections délimitées, chacune étant attribuée à une équipe de creuseurs, d'où le nom Mahdud."
  ur: "خلفاء کی ماں؛ البلادھوری میں اس نے مہدود کے نام سے کھودی جانے والی نہر کا حکم دیا - اسے الریان کا نام دیا - اس کے ایجنٹ نے اسے گھیرے ہوئے حصوں میں تقسیم کیا جس میں سے ہر ایک کو کھودنے والے عملے کو تفویض کیا گیا تھا، جس کا نام مہدود پڑا۔"
  tr: "Ümmü el-Xulafa'; el-Baladhuri'ye göre, Mu'mind olarak bilinen nehrin kazılmasını emretmiş, bu yüzden nehrin adını al-Rayyan olarak koymuştur. Ajanı nehri parçalara ayırmış, her bölümü birleştirmiş ve kazmak için bir halk atamıştır, bu yüzden 'Mu'mind' olarak adlandırılmıştır. El-Süyyuti'ye göre, iki halife doğurmuş olan hiçbir kadının yoktur; sadece el-Hayzaran, Um el-Hadi ve el-Reşid ile Abdül-Malik'in eşi Velade bint Abbas el-Abbasiyye. Annesi, el-Velid, Süleyman ve Şehfand bint Fairuz'u doğurmuştur; bu çocuklar el-Velid bin Abdülmelik, Yezid el-Naqis ve İbrahim'den doğmuştur. El-Hayzaran, oğlu el-Hadi'nin saltanatı sırasında önemli işlerde zorba bir hükümdardı. Oğlu el-Hadi tarafından konvoylara girmesini yasakladığında onun öldürülmesini planladığı söylenir. Kapısı {atıf:Tarikh-Khulafa-minhaj-1434 s. 451-453} ve Peygamber'in Mekke'de doğduğu ev bir camidir {atıf:muruj-al-dhahab s. 571} ve Ashnas olarak bilinen evinde, Mervan bin Muhammed'in karısı harabe bir avluda ona girer ve iyi davranır, hizmetkarı Tabat ise ona şikayette bulunur {cite:muruj-al-dhahab s. 303-305}"
  id: "Umm al-Khulafa'; menurut al-Baladhuri, ia memerintahkan sungai yang dikenal sebagai Mu'mind digali, sehingga ia menamainya al-Rayyan. Agennya membaginya menjadi bagian-bagian, menyatukan setiap bagian, dan menugaskan satu bangsa untuk menggali, sehingga disebut 'Mu'mind'. Menurut al-Suyuti, tidak ada wanita yang diketahui melahirkan dua khalifah kecuali al-Khayzaran, um al-Hadi dan al-Rashid, serta Walada bint al-Abbas al-Abbasiyyah, suami Abd al-Malik. Ia melahirkan al-Walid, Sulayman, dan Shahfand bint Fairuz, yang lahir dari al-Walid ibn Abd al-Malik, Yazid al-Naqis, dan Ibrahim. Al-Khayzaran adalah penguasa tirani atas urusan besar selama pemerintahan putranya al-Hadi. Konon ia merencanakan pembunuhan al-Khayzaran ketika ia dilarang berkonvoi. Pintunya {cite:Tarikh-Khulafa-minhaj-1434 hlm. 451-453}, dan rumah tempat kelahiran Nabi di Mekah adalah sebuah masjid {cite:muruj-al-dhahab hlm. 571}, dan di rumahnya yang dikenal sebagai Ashnas, istri Marwan ibn Muhammad masuk kepadanya di halaman yang sudah rusak dan memperlakukannya dengan baik, dan hambanya Tabat mengeluh kepadanya tentang hal itu {cite:muruj-al-dhahab hlm. 303-305}"
