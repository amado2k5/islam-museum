id: person/al-khayzuran
class: person
label: { ar: "الخيزران أم الخلفاء", en: "al-Khayzuran, Mother of the Caliphs" }
summary:
  ar: "أم الخلفاء؛ عند البلاذري أمرت أن يحفر النهر المعروف بمحدود فسمته الريان وكان وكيلها جعله أقساماً وحدّ كل قسم ووكل بحفره قوماً فسمي محدوداً، وعند السيوطي لا تعرف امرأة ولدت خليفتين إلا الخيزران أم الهادي والرشيد وولادة بنت العباس العبسية زوج عبد الملك ولدت الوليد وسليمان وشاهفرند بنت فيروز ولدت للوليد بن عبد الملك يزيد الناقص وإبراهيم، وكانت الخيزران حاكمة مستبدة بالأمور الكبار في عهد ولدها الهادي وقيل إنها دبرت قتله لما زجرها عن مواكب بابها {cite:tarikh-khulafa-minhaj-1434 p. 451-453}"
  en: "Mother of the caliphs; in al-Baladhuri she ordered the canal known as Mahdud dug — naming it al-Rayyan — her agent dividing it into bounded sections each assigned to a digging crew, whence the name Mahdud."
