id: person/thamal-ibn-salih-al-kilabi
class: person
label: { ar: "معز الدولة ثمال بن صالح الكلابي صاحب حلب" }
summary:
  ar: "معز الدولة ثمال بن صالح الكلابي المرداسي، صاحب حلب؛ التقى هو وملك الروم على أرتاح من أعمال حلب سنة أربع وخمسين وأربعمائة فانتصر المسلمون وغنموا وسبوا حتى بيعت السرية الحسناء بمائة درهم، وبعدها بيسير توفي ثمال بحلب {cite:shadharat-dhahab p. 301}."
  en: "Mu'izz al-Dawla Thamal b. Salih al-Kilabi, the Mirdasid lord of Aleppo; he and the Byzantine king met at Artah near Aleppo in 454 — the Muslims prevailed, took spoils and captives till a beautiful slave-girl sold for a hundred dirhams — and Thamal died at Aleppo soon after {cite:shadharat-dhahab p. 301}."
  es: "Mu'izz al-Dawla Thamal b. Salih al-Kilabi, el señor mirdasí de Alepo; él y el rey bizantino se encontraron en Artah, cerca de Alepo, en 454. Los musulmanes prevalecieron, tomaron botín y cautivos hasta que una hermosa esclava fue vendida por cien dirhams, y Thamal murió en Alepo poco después {cite:shadharat-dhahab p. 301}."
  fr: "Mu'izz al-Dawla Thamal b. Salih al-Kilabi, le seigneur mirdaside d'Alep; lui et le roi byzantin se rencontrèrent à Artah près d'Alep en 454 — les musulmans l'emportèrent, prirent butin et captifs jusqu'à ce qu'une belle esclave soit vendue pour cent dirhams — et Thamal mourut à Alep peu après {cite:shadharat-dhahab p. 301}."
