summary:
  ar: "قاضي القضاة شهاب الدين أحمد بن الفرفور الدمشقي الشافعي، ولد في نصف شوال سنة اثنتين وخمسين وثمانمائة، وأخذ عن البرهان الباعوني وأبي القاسم بن الشيخ خليل والنجم بن قاضي عجلون والشمس السعدي وأبي المحاسن بن شاهين وغيرهم وبرع وتميز على أقرانه، وكان جامعاً بين العلم والرياسة والكرم وحسن العشرة بحيث قال الحمَوي إنه خاتم رؤساء الدنيا على الإطلاق وسلطان الفقهاء والرؤساء؛ ولى قضاء قضاة الشافعية بدمشق ثم جُمع له بينه وبين قضاء مصر يوم الخميس رابع ربيع الأول، توفي سنة إحدى عشرة وتسعمائة {cite:shadharat-dhahab p. 462-463}."
  en: "'Seal of the world's dignitaries and sultan of jurists and chiefs' per al-Hamawi — b. mid-Shawwal 852, Damascus's Shafi'i chief qadi who was then granted the Cairo chief-judgeship together with it; d. 911 {cite:shadharat-dhahab p. 462-463}."
