summary:
  ar: "قاضي القضاة شهاب الدين أحمد بن الفرفور الدمشقي الشافعي، ولد في نصف شوال سنة اثنتين وخمسين وثمانمائة، وأخذ عن البرهان الباعوني وأبي القاسم بن الشيخ خليل والنجم بن قاضي عجلون والشمس السعدي وأبي المحاسن بن شاهين وغيرهم وبرع وتميز على أقرانه، وكان جامعاً بين العلم والرياسة والكرم وحسن العشرة بحيث قال الحمَوي إنه خاتم رؤساء الدنيا على الإطلاق وسلطان الفقهاء والرؤساء؛ ولى قضاء قضاة الشافعية بدمشق ثم جُمع له بينه وبين قضاء مصر يوم الخميس رابع ربيع الأول، توفي سنة إحدى عشرة وتسعمائة {cite:shadharat-dhahab p. 462-463}."
  en: "'Seal of the world's dignitaries and sultan of jurists and chiefs' per al-Hamawi — b. mid-Shawwal 852, Damascus's Shafi'i chief qadi who was then granted the Cairo chief-judgeship together with it; d. 911 {cite:shadharat-dhahab p. 462-463}."
  es: "'Sello de los dignatarios del mundo y sultán de juristas y jefes' según al-Hamawi — n. mediados de Shawwal 852, cadí jefe shafi'í de Damasco a quien se le concedió entonces el cargo de juez jefe de El Cairo junto con él; m. 911 {cita: shadharat-dhahab p. 462-463}."
  fr: "« Sceau des dignitaires du monde et sultan des juristes et des chefs » selon al-Hamawi — né au milieu du Shawwal 852, cadi en chef chaféite de Damas qui s'est vu octroyer ensuite la charge de juge en chef du Caire; mort en 911 {cite: shadharat-dhahab p. 462-463}."
  ur: "''دنیا کے معززین کی مہر اور سلطان فقہاء و سرداران'' فی الحماوی - ب۔ وسط شوال 852، دمشق کے شافعی سردار قاضی جنہیں اس کے ساتھ قاہرہ کے چیف منصف کا عہدہ دیا گیا تھا۔ d 911 {حوالہ: شدارت ذہاب صفحہ 462-463}۔"
  tr: "Baş Hakim Şihabeddin Ahmed bin Farfur el-Dimashqi el-Şafii, 852 Hicri yılında Şavval'ın ortasında doğdu. El-Burhan el-Ba'uni, Ebu el-Kasım bin Şeyh Halil, el-Necm bin Kaddi Eclun, el-Şems el-Sa'di, Ebu el-Muhasin ibn Şahin ve diğerlerinin yanında eğitim aldı. Akranları arasında öne çıktı ve kendini gösterdi. Bilgi, liderlik, cömertlik ve iyi dostluğu birleştirdi; öyle ki el-Hamavi kendisinin dünyanın nihai hükümdarı ve hukukçular ile liderlerin otoritesi olduğunu söyledi. Şam'daki Şafii okulunun yargıçlarını atadı, ardından Perşembe günü Rabi'al-Awwal'ın dördüncüsü olarak Mısır yargısıyla birleşti. 911 Hicri yılında vefat etti {alıntı:] Shadharat-Dhahab, s. 462-463}."
  id: "Hakim Agung Shihab al-Din Ahmad ibn al-Farfur al-Dimashqi al-Shafi'i lahir di tengah Shawwal pada tahun 852 H. Ia belajar di bawah bimbingan al-Burhan al-Ba'uni, Abu al-Qasim ibn al-Sheikh Khalil, al-Najm ibn Qadi Ajloun, al-Shams al-Sa'di, Abu al-Muhasin ibn Shahin, dan lainnya. Ia unggul dan menonjol di antara rekan-rekannya. Ia menggabungkan pengetahuan, kepemimpinan, kemurahan hati, dan persahabatan yang baik, sehingga al-Hamawi mengatakan dirinya adalah penguasa tertinggi dunia dan otoritas para ahli hukum dan pemimpin. Ia mengangkat hakim mazhab Shafi'i di Damaskus dan kemudian bergabung dengan lembaga peradilan Mesir pada hari Kamis, tanggal keempat Rabi' al-Awwal. Ia meninggal pada tahun 911 H {cite:shadharat-dhahab, hlm. 462-463}."
