summary:
  ar: "العارف بالله عبد الله الإلهي الصوفي الحنفي؛ قال في الشقائق ولد بقصبة سماو من ولاية أناضولي واشتغل أول أمره بالعلوم وسكن مدة بقسطنطينية بمدرسة زيرك ولما ارتحل المولى علي الطوسي إلى بلاد العجم ارتحل هو أيضاً فلقيه بمدينة كرمان واشتغل عليه بالعلوم الظاهرة ثم غلبت عليه داعية الترك فقصد حرق كتبه أو إغراقها ولما كان في هذا التردد دخل عليه فقير وقال له بع الكتب وتصدق بثمنها إلا هذا الكتاب فإنه ينفعك فإذا هو كتاب فيه رسائل المشايخ ففعل ذلك وذهب إلى سمرقند وخدم العارف بالله خواجه عبد الله السمرقندي وتلقن منه الذكر ثم ذهب بإشارته إلى بخارى واعتكف هناك عند قبر خواجه بهاء الدين النقشبندي وتربى بروحانيته ثم عاد إلى سمرقند وصحب خواجه عبيد ثم ذهب بإشارته إلى بلاد الروم فمر ببلاد هرأة وصحب المولى عبد الرحمن الجامي وغيره من مشايخ خراسان ثم أتى إلى وطنه واشتهر حاله في الآفاق واجتمعت عليه العامة والطلاب ووصلوا إلى ما ربهم وبلغ صيته إلى قسطنطينية وطلبه علماؤها وأكابرها فلم يلتفت إليهم إلى زمن السلطان محمد فظهرت الفتن في وطنه فأتى قسطنطينية وسكن بجامع زيرك واجتمع عليه الأكابر والأعيان ثم لما تزاحم عليه الناس تشوش من ذلك وارتحل إلى ولاية رملي فتوفي هناك في حدود سنة ست وتسعين وثمانمائة {cite:shadharat-dhahab p. 358-359}."
  en: "Al-Ilahi of Simav — the Naqshbandi carrier to Anatolia: a faqir's prompting saved only the book of shaykhs' letters when he meant to burn his library; served Khwaja 'Ubaydallah Ahrar at Samarqand, did i'tikaf at Baha' al-Din Naqshband's grave, kept company with Jami at Herat; the Zeyrek mosque crowd in Constantinople finally drove him to Rumeli where he died ~896 {cite:shadharat-dhahab p. 358-359}."
  es: "Al-Ilahi de Simav, el portador de los Naqshbandi a Anatolia: la incitación de un faqir salvó solo el libro de cartas de los shaykhs cuando pretendía quemar su biblioteca; sirvió a Khwaja 'Ubaydallah Ahrar en Samarcanda, realizó i'tikaf en la tumba de Baha' al-Din Naqshband, mantuvo compañía con Jami en Herat; la multitud de la mezquita de Zeyrek en Constantinopla finalmente lo obligó a ir a Rumeli, donde murió alrededor del año 896 {cita: shadharat-dhahab págs. 358-359}."
  fr: "Al-Ilahi de Simav — le porteur Naqshbandi en Anatolie: l'incitation d'un faqir ne sauva que le livre des lettres des cheikhs alors qu'il avait l'intention de brûler sa bibliothèque; servit Khwaja 'Ubaydallah Ahrar à Samarcande, fit l'i'tikaf sur la tombe de Baha' al-Din Naqshband, fréquenta Jami à Hérat; la foule de la mosquée Zeyrek à Constantinople le poussa finalement à Rumeli où il mourut vers 896 {cite: shadharat-dhahab p. 358-359}."
  ur: "سماو کے الٰہی - اناطولیہ کی طرف نقشبندی لے جانے والا: ایک فقیر کے اشارے سے صرف شیخوں کے خطوط کی کتاب ہی بچ گئی جب اس کا مقصد اپنی لائبریری کو جلانا تھا۔ سمرقند میں خواجہ عبیداللہ احرار کی خدمت کی، بہاء الدین نقشبند کی قبر پر اعتکاف کیا، ہرات میں جامی سے صحبت کی۔ قسطنطنیہ میں زیرک مسجد کے ہجوم نے بالآخر اسے رومیلی لے جایا جہاں اس کی موت ~896۔ 358-359}۔"
  tr: "Mistik Abdullah el-İlahi, Hanefi Sufi; El-Şakaiq'ta şöyle demiştir: Anadolu vilayetindeki Samaw Kasbah'ında doğmuştur. Başlangıçta fen bilimlerinde çalışmış ve bir süre Konstantinopolis'te Zirk okulunda yaşamıştır. Mawla Ali el-Tusi İran topraklarına seyahat ettiğinde o da seyahat etmiş. Onunla Kirman şehrinde karşılaşmış ve onunla görünen bilimlerde çalışmıştır. Sonra Türk vaizi ona üstün gelmiş, bu yüzden kitaplarını yakmayı ya da su basmayı planlamıştır. Tereddüt ettiğinde, fakir bir adam içeri girer ve \"Kitapları sat, fiyatlarına sadaka ver, bu kitap hariç, çünkü sana fayda sağlar.\" dedi. O zaman bu bir kitaptır. Şeyhlerin mektuplarını içerir, bu yüzden Semerkand'a gitti, Allah'ın gnostikleri Hoca Abdullah el-Samerkendi'ye hizmet etti ve ondan zikr öğrendi. Sonra onun rehberliğiyle Buhara'ya gitti ve orada Hoca Baha'eddin el-Nakşibendi'nin mezarında inzivada kaldı, burada maneviyat içinde yetiştirildi. Sonra Semerkand'a döndü, Hoca Übeyd eşliğinde, ardından onun talimatlarıyla Romalıların topraklarına gitti, Hera topraklarından geçerek Mevle Abdurrahman el-Cemi ve Horasan'ın diğer şeyhleriyle birlikte gitti, ardından memleketine döndü ve statüsü geniş çapta ün kazandı. Halk ve öğrenciler etrafında toplandı ve öğrendiklerine ulaştılar. Ünü Konstantinopolis'teydi ve burada alimler ile ileri gelenler onu arıyordu, ancak Sultan Muhammed zamanına kadar onlara dikkat etmedi; bu da memleketinde çatışmaların ortaya çıkmasına yol açtı. Konstantinopolis'e geldi, Zirk Camii'nde yaşadı ve ileri gelenleri ve ileri gelenleri topladı. İnsanlar etrafında toplanınca kafası karıştı ve Ramli Vilayeti'ne gitti; burada yaklaşık 896 Hicri yılında öldü {cite:shadharat-dhahab, s. 358-359}."
  id: "Mistikus Abdullah al-Ilahi, Sufi Hanafi; ia berkata dalam Al-Shaqa'iq: Ia lahir di Kasbah Samaw di provinsi Anatolia. Awalnya ia bekerja di bidang ilmu pengetahuan dan sempat tinggal di Konstantinopel di sekolah Zirk. Ketika Mawla Ali al-Tusi melakukan perjalanan ke tanah Persia, ia juga bepergian. Ia bertemu dengannya di kota Kerman, dan bekerja bersama dalam ilmu yang tampak nyata. Kemudian pendakwah Turki berhasil mengalahkannya, sehingga ia berniat membakar atau membanjiri buku-bukunya. Ketika ia ragu, seorang pria miskin masuk dan berkata, \"Jual buku-buku itu dan berikan sedekah dengan harganya, kecuali buku ini, karena itu akan menguntungkanmu.\" Maka itu adalah sebuah buku. Buku itu berisi surat-surat para sheikh, jadi ia pergi ke Samarkand, melayani para gnostik Allah, Khwaja Abdullah al-Samarqandi, dan belajar dzikir darinya. Kemudian, atas bimbingannya, ia pergi ke Bukhara dan bersembunyi di sana di makam Khwaja Baha' al-Din al-Naqshbandi, tempat ia dibesarkan dalam spiritualitas. Kemudian ia kembali ke Samarkand menemani Khwaja Ubaid, kemudian mengikuti instruksinya ke tanah Romawi, melewati tanah Hera, ditemani oleh Mawla Abd al-Rahman al-Jami dan sheikh Khorasan lainnya, lalu kembali ke tanah airnya, dan statusnya menjadi terkenal di mana-mana. Masyarakat umum dan pelajar berkumpul di sekitarnya, dan mereka mencapai apa yang telah mereka pelajari. Reputasinya berada di Konstantinopel, dan para ulama serta pejabat di sana mencari dirinya, tetapi ia tidak memperhatikan mereka sampai masa Sultan Muhammad, yang menyebabkan munculnya perselisihan di tanah airnya. Ia datang ke Konstantinopel, tinggal di Masjid Zirk, dan mengumpulkan para pejabat dan pejabat. Ketika orang-orang berkerumun di sekitarnya, ia menjadi bingung dan pergi ke Wilaya Ramli, di mana ia wafat sekitar tahun 896 H {cite:shadharat-dhahab, hlm. 358-359}."
