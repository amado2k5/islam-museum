summary:
  ar: "العارف بالله عبد الله الإلهي الصوفي الحنفي؛ قال في الشقائق ولد بقصبة سماو من ولاية أناضولي واشتغل أول أمره بالعلوم وسكن مدة بقسطنطينية بمدرسة زيرك ولما ارتحل المولى علي الطوسي إلى بلاد العجم ارتحل هو أيضاً فلقيه بمدينة كرمان واشتغل عليه بالعلوم الظاهرة ثم غلبت عليه داعية الترك فقصد حرق كتبه أو إغراقها ولما كان في هذا التردد دخل عليه فقير وقال له بع الكتب وتصدق بثمنها إلا هذا الكتاب فإنه ينفعك فإذا هو كتاب فيه رسائل المشايخ ففعل ذلك وذهب إلى سمرقند وخدم العارف بالله خواجه عبد الله السمرقندي وتلقن منه الذكر ثم ذهب بإشارته إلى بخارى واعتكف هناك عند قبر خواجه بهاء الدين النقشبندي وتربى بروحانيته ثم عاد إلى سمرقند وصحب خواجه عبيد ثم ذهب بإشارته إلى بلاد الروم فمر ببلاد هرأة وصحب المولى عبد الرحمن الجامي وغيره من مشايخ خراسان ثم أتى إلى وطنه واشتهر حاله في الآفاق واجتمعت عليه العامة والطلاب ووصلوا إلى ما ربهم وبلغ صيته إلى قسطنطينية وطلبه علماؤها وأكابرها فلم يلتفت إليهم إلى زمن السلطان محمد فظهرت الفتن في وطنه فأتى قسطنطينية وسكن بجامع زيرك واجتمع عليه الأكابر والأعيان ثم لما تزاحم عليه الناس تشوش من ذلك وارتحل إلى ولاية رملي فتوفي هناك في حدود سنة ست وتسعين وثمانمائة {cite:shadharat-dhahab p. 358-359}."
  en: "Al-Ilahi of Simav — the Naqshbandi carrier to Anatolia: a faqir's prompting saved only the book of shaykhs' letters when he meant to burn his library; served Khwaja 'Ubaydallah Ahrar at Samarqand, did i'tikaf at Baha' al-Din Naqshband's grave, kept company with Jami at Herat; the Zeyrek mosque crowd in Constantinople finally drove him to Rumeli where he died ~896 {cite:shadharat-dhahab p. 358-359}."
