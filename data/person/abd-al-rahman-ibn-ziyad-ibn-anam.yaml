  ur: "عالم، محدث اور جج ابو خالد عبدالرحمٰن بن زیاد ابن انعام المفاری الشعبانی، جو افریقی مشرق میں جانا جاتا ہے؛ آپ نے حدیث کی ترسیل کی اور عدالتی عہدے پر فائز رہے۔"
  tr: "Afrika doğusunda tanınan âlim, hadis rivayetçisi ve kadı Ebu Halid Abdülrahman ibn Ziyad ibn An'am el-Ma'afiri el-Şabani, hadis rivayet etmiş ve yargı işini devralmıştır."
  id: "Ulama, perawi hadits, dan hakim Abu Khalid Abd al-Rahman ibn Ziyad ibn An’am al-Ma’afiri al-Sha’bani, yang terkenal di Afrika Timur, meriwayatkan hadits dan mengambil alih lembaga peradilan."
