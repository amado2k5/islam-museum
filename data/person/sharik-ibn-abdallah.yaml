summary:
  ar: "أبو عبد الله شريك بن عبد الله بن أبي شريك، وهو الحارث بن أوس بن الحوث بن ذهل بن وهيب بن سعد بن مالك بن النخع النخعي المضحجي، قاضي الكوفة؛ ولد ببخارى بأرض خراسان سنة خمس وتسعين، وكان جده قد شهد القادسية. سمع عمر بن عبد العزيز وسمع أبا إسحاق السبيعي ومنصور بن المعتمر وعبد الملك بن عمير وسماك بن حرب وسلمة بن كهيل وحبيب بن أبي ثابت وعلي بن الأقمر وزبيداً اليامي وعاصم الأحول وعبد الله بن محمد بن عقيل ومخول بن راشد وهلال الوزان والأشعث بن سوار وشبيب بن غرقدة وحكيم بن جبير وجابراً الجعفي وعلي بن بذيمة وعماراً الدهني وسليمان الأعمش وإسماعيل بن أبي خالد؛ روى عنه عبد الله بن المبارك وعباد بن العوام ووكيع بن الجراح وعبد الرحمن بن مهدي وإسحاق الأزرق ويزيد بن هارون وأبو نعيم ويحيى بن الحماتي وعلي بن الجعد وخلف بن هشام ومحرز بن عوانة وبشر بن الوليد ومحمد بن سليمان لوين؛ قدم بغداد مراراً وحدّث بها، وقال له عبد الله بن المبارك: أما يكفيك علم شريك، ووصفه أبو حاتم بأنه كوفي ثقة {cite:tarikh-baghdad-khatib j.9 p.280}."
  en: "Sharik ibn Abd Allah al-Nakha'i, qadi of Kufa — born at Bukhara in 95 to a family whose grandfather had fought at al-Qadisiyya; Ibn al-Mubarak asked 'is Sharik's knowledge not enough for you?' {cite:tarikh-baghdad-khatib j.9 p.280}."
  es: "Sharik ibn Abd Allah al-Nakha'i, cadí de Kufa, nacido en Bukhara en 95 en una familia cuyo abuelo había luchado en al-Qadisiyya; Ibn al-Mubarak preguntó: \"¿No te bastan los conocimientos de Sharik?\". {citar:tarikh-bagdad-khatib j.9 p.280}."
  fr: "Sharik ibn Abd Allah al-Nakha'i, cadi de Kufa — né à Boukhara en 95 dans une famille dont le grand-père avait combattu à al-Qadisiyya; Ibn al-Moubarak a demandé: « Les connaissances de Sharik ne vous suffisent-elles pas ? {cite:tarikh-bagdad-khatib j.9 p.280}."
  ur: "شارق بن عبد اللہ النخعی، کوفہ کے قاضی - بخارا میں 95 میں ایک ایسے گھرانے میں پیدا ہوئے جن کے دادا نے القدسیہ میں جنگ کی تھی۔ ابن مبارک نے پوچھا کہ کیا شارق کا علم تمہارے لیے کافی نہیں ہے؟ {حوالہ:تاریخ بغداد خطیب ج.9 ص280}۔"
  tr: "Ebu Abdullah Şerik ibn Abdullah ibn Ebi Şerik, el-Haris ibn Av ibn el-Huth ibn Dhuhl ibn Wahib ibn Sa'd ibn Malik ibn al-Nakha'i al-Nakha'i al-Mudhahji, Kufe'nin hakimi; doksan beşinci yılında Horasan topraklarındaki Buhara'da doğmuş ve büyükbabası Kadisiye'ye katılmıştır. Ömer ibn Abdülaziz'den, aynı zamanda Ebu İshaq el-Subai'i, Mansur bin el-Mu'tamir, Abd al-Malik ibn Umair, Samak ibn Harb, Salmah ibn Kuhail, Habib ibn Abi Thabit, Ali ibn al-Aqmar, Zubeydah al-Yami, Asim al-Ahwal, Abdullah ibn Muhammed bin Aqil, Makhul ibn Rashid, Hilal al-Wazzan, al-Ash'ath ibn Suwar, Shabib ibn Gharqada, Hakim ibn Jubayr, Jabir al-Ju'fi, Ali ibn Budhaymah, Ammar al-Dahani, Sulayman al-A'mash, İsmail bin Ebi Halid; Abdullah ibn al-Mubarak ve 'Abbad ibn al-'Awwam ondan rivayet etti Waki' ibn al-Jarrah, Abd al-Rahman ibn Mahdi, İshaq al-Azraq, Yazid ibn Harun, Ebu Nu'eym, Yahya ibn al-Hamati, Ali ibn al-Ja'd, Khalaf ibn Hisham, Muharriz ibn 'Awanah, Bishr ibn al-Walid ve Muhammad ibn Sulayman Luwayn; Bağdat'ı defalarca ziyaret etti ve bu konuda konuştu. Abdullah ibn al-Mubarak ona şöyle dedi: 'Bir ortağın bilgisi yeterli midir? Abu Hatim onu güvenilir bir Kufan olarak tanımladı {cite:Tarikh-baghdad-khatib j.9, s.280}."
  id: "Abu Abdullah Sharik ibn Abdullah ibn Abi Sharik, yang merupakan al-Harith ibn Aws ibn al-Huth ibn Dhuhl ibn Wahib ibn Sa'd ibn Malik ibn al-Nakha' al-Nakha'i al-Mudhahji, hakim Kufa; ia lahir di Bukhara di tanah Khorasan pada tahun sembilan puluh lima, dan kakeknya pernah menghadiri Qadisiyyah. Ia mendengar dari Umar ibn Abd al-Aziz, demikian pula Abu Ishaq al-Subai'i, Mansur ibn al-Mu'tamir, Abd al-Malik ibn Umair, Samak ibn Harb, Salmah ibn Kuhail, Habib ibn Abi Thabit, Ali ibn al-Aqmar, Zubaydah al-Yami, Asim al-Ahwal, Abdullah ibn Muhammad ibn Aqil, Makhul ibn Rashid, Hilal al-Wazzan, al-Ash'ath ibn Suwar, Shabib ibn Gharqada, Hakim ibn Jubayr, Jabir al-Ju'fi, Ali ibn Budhaymah, Ammar al-Dahani, Sulayman al-A'mash, Ismail ibn Abi Khalid; Abdullah ibn al-Mubarak dan 'Abbad ibn al-'Awwam menceritakan darinya Waki' ibn al-Jarrah, Abd al-Rahman ibn Mahdi, Ishaq al-Azraq, Yazid ibn Harun, Abu Nu'aym, Yahya ibn al-Hamati, Ali ibn al-Ja'd, Khalaf ibn Hisham, Muharriz ibn 'Awanah, Bishr ibn al-Walid, dan Muhammad ibn Sulayman Luwayn; ia berulang kali mengunjungi Baghdad dan membicarakannya. Abdullah ibn al-Mubarak berkata kepadanya: 'Apakah pengetahuan tentang seorang mitra sudah cukup? Abu Hatim menggambarkannya sebagai Kufan yang dapat dipercaya {kutip: Tarikh-baghdad-khatib j.9, hlm.280}."
