summary:
  ar: "أبو عبد الله شريك بن عبد الله بن أبي شريك، وهو الحارث بن أوس بن الحوث بن ذهل بن وهيب بن سعد بن مالك بن النخع النخعي المضحجي، قاضي الكوفة؛ ولد ببخارى بأرض خراسان سنة خمس وتسعين، وكان جده قد شهد القادسية. سمع عمر بن عبد العزيز وسمع أبا إسحاق السبيعي ومنصور بن المعتمر وعبد الملك بن عمير وسماك بن حرب وسلمة بن كهيل وحبيب بن أبي ثابت وعلي بن الأقمر وزبيداً اليامي وعاصم الأحول وعبد الله بن محمد بن عقيل ومخول بن راشد وهلال الوزان والأشعث بن سوار وشبيب بن غرقدة وحكيم بن جبير وجابراً الجعفي وعلي بن بذيمة وعماراً الدهني وسليمان الأعمش وإسماعيل بن أبي خالد؛ روى عنه عبد الله بن المبارك وعباد بن العوام ووكيع بن الجراح وعبد الرحمن بن مهدي وإسحاق الأزرق ويزيد بن هارون وأبو نعيم ويحيى بن الحماتي وعلي بن الجعد وخلف بن هشام ومحرز بن عوانة وبشر بن الوليد ومحمد بن سليمان لوين؛ قدم بغداد مراراً وحدّث بها، وقال له عبد الله بن المبارك: أما يكفيك علم شريك، ووصفه أبو حاتم بأنه كوفي ثقة {cite:tarikh-baghdad-khatib j.9 p.280}."
  en: "Sharik ibn Abd Allah al-Nakha'i, qadi of Kufa — born at Bukhara in 95 to a family whose grandfather had fought at al-Qadisiyya; Ibn al-Mubarak asked 'is Sharik's knowledge not enough for you?' {cite:tarikh-baghdad-khatib j.9 p.280}."
