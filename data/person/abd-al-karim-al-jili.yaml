summary:
  ar: "عبد الكريم الجيلي ⁦(767هـ/1365م – نحو 832هـ/1428م)⁩، صوفي مسلم من أحفاد عبد القادر الجيلاني، صاحب كتاب الإنسان الكامل في معرفة الأواخر والأوائل، وشارح فتوحات ابن عربي وأحد أتباعه كما تصفه الموسوعة. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  en: "Abd al-Karim al-Jili (767/1365 to about 832/1428), a Muslim mystic and a descendant of the Sufi 'Abd al-Qadir al-Jilani, author of al-Insan al-Kamil and a commentator on Ibn 'Arabi's Futuhat. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  fr: "Abd al-Karim al-Jili (767/1365 à environ 832/1428), mystique musulman et descendant du soufi 'Abd al-Qadir al-Jilani, auteur d'al-Insan al-Kamil et commentateur des Futuhat d'Ibn 'Arabi. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  ur: "عبدالکریم الجیلی ⁦(767ھ/1365ء تا تقریباً 832ھ/1428ء)⁩، مسلم صوفی، عبدالقادر جیلانی کی نسل سے، کتاب الانسان الکامل کے مصنف اور ابن عربی کی فتوحات کے شارح۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  es: "Abd al-Karim al-Jili (767/1365 a aproximadamente 832/1428), místico musulmán y descendiente del sufí 'Abd al-Qadir al-Jilani, autor de al-Insan al-Kamil y comentarista de Futuhat de Ibn 'Arabi. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  tr: "Abdülkerim el-Cili (767 Hicri/1365 Miladi – yaklaşık 832 Hicri/1428 Miladi), Abdülkadir el-Cilani'nin soyundan gelen, *İlk ve Sonuncuyu Bilen Kusursuz İnsan* adlı eserin yazarı ve İbn Arabi'nin *Futûḥât* adlı eserinin yorumcusu ve onun takipçilerinden biri olarak ansiklopedide tanımlanmıştır. {cite:encyclopaedia-of-islam-2 cilt 1 s. 90}"
  id: "Abd al-Karim al-Jili (767 H/1365 M – sekitar 832 H/1428 M), seorang Sufi Muslim keturunan Abd al-Qadir al-Jilani, penulis *Manusia Sempurna dalam Pengetahuan tentang Yang Terakhir dan Yang Pertama*, dan komentator *Futūḥāt* karya Ibn Arabi, dan salah satu pengikutnya, sebagaimana dijelaskan dalam ensiklopedia. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
