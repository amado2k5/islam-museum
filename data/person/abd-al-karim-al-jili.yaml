  ar: "عبد الكريم الجيلي (767هـ/1365م – نحو 832هـ/1428م)، صوفي مسلم من أحفاد عبد القادر الجيلاني، صاحب كتاب الإنسان الكامل في معرفة الأواخر والأوائل، وشارح فتوحات ابن عربي وأحد أتباعه كما تصفه الموسوعة. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  en: "Abd al-Karim al-Jili (767/1365 to about 832/1428), a Muslim mystic and a descendant of the Sufi 'Abd al-Qadir al-Jilani, author of al-Insan al-Kamil and a commentator on Ibn 'Arabi's Futuhat. {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
  ur: "عبدالکریم الجیلی (767ھ/1365ء تا تقریباً 832ھ/1428ء)، مسلم صوفی، عبدالقادر جیلانی کی نسل سے، کتاب الانسان الکامل کے مصنف اور ابن عربی کی فتوحات کے شارح۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 90}"
