label: { ar: "الإسكندر المقدوني", en: "Al Iskandar Al Maqduni" }
summary:
  ar: "الإسكندر ملك اليونانيين الذي خرج من مدينة مقدونية غازيا أرض فارس فقتل دارا بن دار الملك واستولى على ملكه وهدم المدائن وأحرق ما كان في صنوف البناء من أنواع العلم المنقوش في الصخور والخشب ونسخ ما كان مجموعا في دواوين أصطخر وقلبه إلى اللسان الرومي والقبطي وأخذ من علم النجوم والطب والطبائع وبعثها إلى مصر على ما حكاه أبو سهل بن نوبخت {cite:fihrist-ibn-al-nadim p. 333}."
  en: "Alexander of Macedon — in the Nawbakhti narrative, the destroyer-copier of Persia's sciences {cite:fihrist-ibn-al-nadim}"
