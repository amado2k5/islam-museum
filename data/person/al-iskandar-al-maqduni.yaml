id: person/al-iskandar-al-maqduni
class: person
label: { ar: "الإسكندر المقدوني", en: "Al Iskandar Al Maqduni", es: "Al Iskandar Al Maqduni", fr: "Al Iskandar Al Maqduni", ur: "اسکندر المقدونی" }
summary:
  ar: "الإسكندر ملك اليونانيين الذي خرج من مدينة مقدونية غازيا أرض فارس فقتل دارا بن دار الملك واستولى على ملكه وهدم المدائن وأحرق ما كان في صنوف البناء من أنواع العلم المنقوش في الصخور والخشب ونسخ ما كان مجموعا في دواوين أصطخر وقلبه إلى اللسان الرومي والقبطي وأخذ من علم النجوم والطب والطبائع وبعثها إلى مصر على ما حكاه أبو سهل بن نوبخت {cite:fihrist-ibn-al-nadim p. 333}."
  en: "Alexander of Macedon — in the Nawbakhti narrative, the destroyer-copier of Persia's sciences {cite:fihrist-ibn-al-nadim}"
  es: "Alejandro de Macedonia — en la narración nawbakhti, el destructor y copiador de las ciencias de Persia {cite:fihrist-ibn-al-nadim}"
  fr: "Alexandre de Macédoine — dans le récit des Nawbakhtis, le destructeur-copiste des sciences perses {cite:fihrist-ibn-al-nadim}"
  ur: "مقدون کا سکندر - نوبختی کی داستان میں، فارس کے علوم کو تباہ کرنے والا نقل کرنے والا۔"
  tr: "Yunan kralı İskender, Makedonya şehrinden Pers'i fetih olarak terk etti, Dara ibn Dar al-Mulk'u öldürdü, krallığını ele geçirdi, şehirleri yıktı, kaya ve ahşaptan oyulmuş her türlü yapı malzemesini yaktı, Astakhr koleksiyonlarında toplananları kopyaladı, Roma ve Kıpti dillerine dönüştürdü, astronomi, tıp ve doğa bilimleri bilgilerini aldı ve bunları Mısır'a gönderdi; bu, Abu Sahl ibn Nawbakht'ın anlatımına göre {cite:fihrist-ibn-al-nadim s. 333}."
  id: "Alexander, raja bangsa Yunani, yang meninggalkan kota Makedonia sebagai penakluk Persia, membunuh Dara ibn Dar al-Mulk, merebut kerajaannya, menghancurkan kota-kota, membakar segala jenis bahan bangunan yang diukir di batu dan kayu, menyalin koleksi Astakhr, mengubahnya ke dalam bahasa Romawi dan Koptik, mengambil pengetahuan astronomi, kedokteran, dan ilmu alam, lalu mengirimnya ke Mesir sebagaimana diceritakan oleh Abu Sahl ibn Nawbakht {cite:fihrist-ibn-al-nadim hlm. 333}."
