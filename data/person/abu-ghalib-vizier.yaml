id: person/abu-ghalib-vizier
class: person
label: { ar: "أبو غالب الوزير ذو السعادتين", en: "Abu Ghalib the vizier", fr: "Abu Ghalib le vizir", es: "Abu Ghalib the vizier", ur: "ابو غالب وزیر" }
summary:
  ar: "أبو غالب الحسن بن منصور ذو السعادتين؛ ولد بسيراف سنة ٣٥٢، وخدم فخر الملك، ثم أعطاه سلطان الدولة لقب الوزارة «نجاح الملوك» فكان نظّارًا ببغداد؛ فلما انتقلت الخطبة إلى مشرف الدولة أُنزل مع الديلم إلى خوزستان فوثبت عليه الديلمية فقتلوه بالأهواز، وكانت وزارته ثمانية عشر شهرًا وثلاثة أيام، وعمره ستون سنة وخمسة أشهر؛ وصودر ابنه في ثمانين ألف دينار فتنفّس سلطان الدولة؛ ورثاه المطرّز {cite:muntazam-ibn-al-jawzi j.8 p.345}."
  en: "Abu Ghalib al-Hasan ibn Mansur, 'possessor of the two felicities'; born at Siraf in 352, he served Fakhr al-Mulk. Sultan al-Dawla then gave him the vizierate with the title 'Success of the Kings' (Najah al-Muluk), and he became administrator (nazzar) in Baghdad. When the khutba passed to Musharraf al-Dawla, he was sent down with the Daylam to Khuzistan, where the Daylamis fell on him and killed him at al-Ahwaz; his vizierate lasted eighteen months and three days, and he was sixty years and five months old. His son was fined eighty thousand dinars, and Sultan al-Dawla breathed easier; al-Mutarriz elegised him {cite:muntazam-ibn-al-jawzi j.8 p.345}."
  fr: "Abu Ghalib al-Hasan ibn Mansur, « détenteur des deux félicités » ; né à Siraf en 352, il servit Fakhr al-Mulk. Sultan al-Dawla lui donna ensuite le vizirat avec le titre de « Succès des rois » (Najah al-Muluk), et il devint administrateur (nazzar) à Bagdad. Quand la khutba passa à Musharraf al-Dawla, il fut envoyé avec les Daylamites au Khuzistan, où les Daylamites se jetèrent sur lui et le tuèrent à al-Ahwaz ; son vizirat dura dix-huit mois et trois jours, et il avait soixante ans et cinq mois. Son fils fut frappé d'une amende de quatre-vingt mille dinars, et Sultan al-Dawla respira plus librement ; al-Mutarriz composa son élégie {cite:muntazam-ibn-al-jawzi j.8 p.345}."
  es: "Abu Ghalib al-Hasan ibn Mansur, «poseedor de las dos felicidades», nacido en Siraf en el año 352, sirvió a Fakhr al-Mulk. El sultán al-Dawla le otorgó entonces el visirismo con el título de «Sucesión de los Reyes» (Najah al-Muluk), y se convirtió en administrador (nazzar) en Bagdad. Cuando la jutba pasó a manos de Musharraf al-Dawla, fue enviado con los Daylam a Juzestán, donde los Daylamíes lo atacaron y lo mataron en al-Ahwaz; su visirismo duró dieciocho meses y tres días, y tenía sesenta años y cinco meses. Su hijo fue multado con ochenta mil dinares, y el sultán al-Dawla respiró aliviado; al-Mutarriz le dedicó una elegía {cite:muntazam-ibn-al-jawzi j.8 p.345}."
  ur: "ابو غالب الحسن بن منصور، 'دو نعمتوں کے مالک'؛ 352 میں سیراف میں پیدا ہوئے، اس نے فخر الملک کی خدمت کی۔ اس کے بعد سلطان الدولہ نے اسے 'بادشاہوں کی کامیابی' ⁦(نجاح الملوک)⁩ کے لقب سے وزیریٹ دیا، اور وہ بغداد میں منتظم ⁦(نازار)⁩ بن گئے۔ جب خطبہ مشرف الدولہ کے پاس پہنچا تو وہ دیلم کے ساتھ خوزستان بھیجے گئے، جہاں دیلامیوں نے اس پر گر کر اسے الاہواز میں قتل کر دیا۔ اس کی وصیت اٹھارہ مہینے تین دن رہی اور اس کی عمر ساٹھ سال پانچ ماہ تھی۔ اس کے بیٹے پر اسی ہزار دینار کا جرمانہ عائد کیا گیا، اور سلطان الدولہ نے سکون کا سانس لیا۔ المطرز نے اس کی تعریف کی ہے {حوالہ:منتظم ابن الجوزی ج8 ص 345}۔"
