id: person/abu-ghalib-vizier
class: person
label: { ar: "أبو غالب الوزير ذو السعادتين", en: "Abu Ghalib the vizier" }
summary:
  ar: "أبو غالب الحسن بن منصور ذو السعادتين؛ ولد بسيراف سنة ٣٥٢، وخدم فخر الملك، ثم أعطاه سلطان الدولة لقب الوزارة «نجاح الملوك» فكان نظّارًا ببغداد؛ فلما انتقلت الخطبة إلى مشرف الدولة أُنزل مع الديلم إلى خوزستان فوثبت عليه الديلمية فقتلوه بالأهواز، وكانت وزارته ثمانية عشر شهرًا وثلاثة أيام، وعمره ستون سنة وخمسة أشهر؛ وصودر ابنه في ثمانين ألف دينار فتنفّس سلطان الدولة؛ ورثاه المطرّز {cite:muntazam-ibn-al-jawzi j.8 p.345}."
  en: "Abu Ghalib al-Hasan ibn Mansur, 'possessor of the two felicities'; born at Siraf in 352, he served Fakhr al-Mulk. Sultan al-Dawla then gave him the vizierate with the title 'Success of the Kings' (Najah al-Muluk), and he became administrator (nazzar) in Baghdad. When the khutba passed to Musharraf al-Dawla, he was sent down with the Daylam to Khuzistan, where the Daylamis fell on him and killed him at al-Ahwaz; his vizierate lasted eighteen months and three days, and he was sixty years and five months old. His son was fined eighty thousand dinars, and Sultan al-Dawla breathed easier; al-Mutarriz elegised him {cite:muntazam-ibn-al-jawzi j.8 p.345}."
