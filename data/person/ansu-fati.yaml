  ar: "لاعب كرة قدم إسباني محترف (وُلد سنة 2002 في بيساو بغينيا بيساو ونشأ في إشبيلية)، جناح أيسر برز مع برشلونة سنة 2019 محققا أرقاما قياسية في صغر السن، وأعير إلى برايتون وموناكو قبل انتقاله النهائي إلى موناكو سنة 2026، وفاز مع إسبانيا بدوري الأمم الأوروبية 2023."
