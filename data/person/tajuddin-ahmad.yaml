summary:
  ar: "سياسي بنغلاديشي (23 يوليو 1925 – 3 نوفمبر 1975)، أول رئيس وزراء لبنغلاديش. صاغ المسودة الأولى للنقاط الست، وقاد الحكومة المؤقتة في المنفى أثناء حرب التحرير سنة 1971 بينما كان الشيخ مجيب الرحمن سجينًا، ثم تولى وزارة المالية والتخطيط من 1972 إلى 1974 في حكومة مجيب، واستقال، فاعتُقل بعد اغتيال مجيب سنة 1975 واغتيل داخل سجن دكا المركزي مع ثلاثة من قادة رابطة عوامي."
  en: "Bangladeshi politician (23 July 1925 – 3 November 1975), the first prime minister of Bangladesh. He drafted the first version of the Six Points, led the provisional government in exile during the 1971 Liberation War while Sheikh Mujibur Rahman was imprisoned, then served as minister of finance and planning from 1972 to 1974 in Mujib's cabinet and resigned, and after Mujib's assassination in 1975 was arrested and assassinated inside Dhaka Central Jail with three other Awami League leaders."
  ur: "بنگلہ دیشی سیاست دان (23 جولائی 1925ء – 3 نومبر 1975ء)، بنگلہ دیش کے پہلے وزیر اعظم۔ انھوں نے چھ نکات کا پہلا مسودہ تیار کیا، 1971ء کی جنگ آزادی کے دوران شیخ مجیب الرحمان کی قید میں عبوری حکومت کی جلا وطنی میں قیادت کی، پھر 1972ء سے 1974ء تک مجیب کی کابینہ میں وزیر خزانہ و منصوبہ بندی رہے اور استعفیٰ دیا، اور 1975ء میں مجیب کے قتل کے بعد گرفتار ہوئے اور ڈھاکہ مرکزی جیل کے اندر عوامی لیگ کے تین دیگر رہنماؤں سمیت قتل کر دیے گئے۔"
