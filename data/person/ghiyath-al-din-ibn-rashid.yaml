summary:
  ar: "غياث الدين محمد، أحد أبناء رشيد الدين، أرسله أبوه لاستقبال السلطان أبي سعيد عند قدومه {cite:jami-al-tawarikh-khashshab-1960 p. 71}. بعد إعدام أبيه سنة 718هـ عيّنه أبو سعيد وزيراً، ووافق الأمراء على الاختيار لما ذكروه من خدمات والده وكفايته {cite:jami-al-tawarikh-khashshab-1960 p. 86}. ويصفه الخشاب بأنه متضلع في معظم العلوم وكريم الطبع {cite:jami-al-tawarikh-khashshab-1960 p. 86}. فشلت محاولة لاغتياله دبّرها نارين طاغاي {cite:jami-al-tawarikh-khashshab-1960 p. 87}، ثم أُعدم في الحادي عشر من رمضان سنة 736هـ بعد هزيمة أرباخان، الذي كان قد قاتل إلى جانبه {cite:jami-al-tawarikh-khashshab-1960 p. 92}."
  en: "Ghiyath al-Din Muhammad, one of Rashid al-Din's sons, whom his father sent to meet Abu Sa'id on his arrival {cite:jami-al-tawarikh-khashshab-1960 p. 71}. After his father's execution in 718 AH, Abu Sa'id made him wazir, and the amirs agreed, citing his father's service and his ability {cite:jami-al-tawarikh-khashshab-1960 p. 86}. The introduction calls him learned in most sciences and generous {cite:jami-al-tawarikh-khashshab-1960 p. 86}. A plot to kill him, led by Narin Taghay, failed {cite:jami-al-tawarikh-khashshab-1960 p. 87}. He was executed on 11 Ramadan 736 AH, after the defeat of Arpa Khan, whom he had fought for {cite:jami-al-tawarikh-khashshab-1960 p. 92}."
  ur: "غیاث الدین محمد، رشید الدین کے بیٹوں میں سے ایک، جنہیں ان کے والد نے ابوسعید کے استقبال کے لیے بھیجا {cite:jami-al-tawarikh-khashshab-1960 p. 71}۔ والد کے 718ھ میں قتل کے بعد ابوسعید نے انہیں وزیر بنایا، اور امرا نے ان کے والد کی خدمات اور ان کی صلاحیت کے باعث اس انتخاب کی تائید کی {cite:jami-al-tawarikh-khashshab-1960 p. 86}۔ ان کے قتل کی ایک سازش نارین طاغای کی تھی جو ناکام رہی {cite:jami-al-tawarikh-khashshab-1960 p. 87}۔ 736ھ میں ارباخان کی شکست کے بعد 11 رمضان کو انہیں قتل کیا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 92}۔"
  fr: "Ghiyath al-Din Muhammad, l'un des fils de Rashid al-Din, que son père envoya à la rencontre d'Abu Sa'id à son arrivée {cite:jami-al-tawarikh-khashshab-1960 p. 71}. Après l'exécution de son père en 718 AH, Abu Sa'id le nomma vizir, et les émirs approuvèrent ce choix en raison des services de son père et de ses capacités {cite:jami-al-tawarikh-khashshab-1960 p. 86}. L'introduction le décrit comme savant dans la plupart des sciences et généreux {cite:jami-al-tawarikh-khashshab-1960 p. 86}. Un complot visant à le tuer, mené par Narin Taghay, échoua {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Il fut exécuté le 11 ramadan 736 AH, après la défaite d'Arpa Khan, aux côtés duquel il avait combattu {cite:jami-al-tawarikh-khashshab-1960 p. 92}."
  es: "Ghiyath al-Din Muhammad, uno de los hijos de Rashid al-Din, a quien su padre envió a recibir a Abu Sa'id a su llegada {cite:jami-al-tawarikh-khashshab-1960 p. 71}. Tras la ejecución de su padre en 718 AH, Abu Sa'id lo nombró visir, y los emires aprobaron la elección por los servicios de su padre y por su capacidad {cite:jami-al-tawarikh-khashshab-1960 p. 86}. La introducción lo describe como versado en la mayoría de las ciencias y generoso {cite:jami-al-tawarikh-khashshab-1960 p. 86}. Un complot para matarlo, dirigido por Narin Taghay, fracasó {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Fue ejecutado el 11 de ramadán de 736 AH, tras la derrota de Arpa Khan, con quien había combatido {cite:jami-al-tawarikh-khashshab-1960 p. 92}."
