summary:
  ar: "علي بن الحسن بن موسى، كان للحكم واعيًا، وعن العمال راويًا. روى عنه أبو بكر بن عبيد قول بعض العلماء إن ما يفتح الفكر اجتماع الهم، وإن التنقل في الفضائل ينتهي بالعبد إلى أن يدنيه الله بلطفه."
  en: "Ali ibn al-Hasan ibn Musa, who kept wisdom in mind and transmitted from workers; Abu Bakr ibn Ubayd relates his report of a learned man asked what opens thought: the gathering of resolve, which leads through sight and action to a graded ascent in virtue that God brings near by His kindness."
  ur: "علی بن حسن بن موسیٰ حکمت کو یاد رکھنے والے اور محنت کرنے والوں سے روایت کرنے والے تھے۔ ابو بکر بن عبید نے ان سے ایک عالم کا قول نقل کیا کہ فکر کو کھولنے والی چیز ہمت کا جمع ہونا ہے، اور فضائل میں ترقی اس بندے کو اللہ کی لطف کے ساتھ اپنے قریب کر دیتی ہے۔"
