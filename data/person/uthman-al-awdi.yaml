summary:
  ar: "عند البلاذري حاول مغالبة مرة بن علي الرديني على سيسر فلم يقدر فغلبه مرة على ما كان في يده من أذربيجان أو أكثره."
  en: "in al-Baladhuri, who tried and failed to wrest Sisar from Murra ibn Ali, losing most of his held Adharbayjan to him."
  es: "en al-Baladhuri, quien intentó sin éxito arrebatarle Sisar a Murra ibn Ali, perdiendo la mayor parte de su territorio Adharbayjan ante él."
  fr: "à al-Baladhuri, qui a essayé et échoué à arracher Sisar à Murra ibn Ali, perdant la majeure partie de ce qu'il tenait à Adharbayjan."
  ur: "البلادھوری میں، جس نے مررہ ابن علی سے سیسار چھیننے کی کوشش کی اور ناکام ہو گئے، اور اپنا زیادہ تر ادربایجان اس سے کھو دیا۔"
  tr: "Al-Baladhuri bir keresinde İbn Ali el-Rudini'yi Sisar'a karşı yenmeye çalıştı, ancak başaramadı; bu yüzden Azerbaycan'dan elde ettikleri kadar ya da daha fazlasını bir kez yendi."
  id: "Al-Baladhuri pernah mencoba mengalahkan Ibn Ali al-Rudini melawan Sisar, tetapi gagal, sehingga ia mengalahkannya sekali atas apa yang ia miliki dari Azerbaijan atau lebih."
