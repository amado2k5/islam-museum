label: { ar: "أبو الفتح الكراجكي محمد بن علي", en: "Abu al-Fath al-Karajiki Muhammad ibn Ali", es: "Abu al-Fath al-Karajiki Muhammad ibn Ali", fr: "Abu al-Fath al-Karajiki Muhammad ibn Ali", ur: "ابو الفتح الکرجیکی محمد ابن علی" }
summary:
  ar: "أبو الفتح الكراجكي — أي الخيمي — محمد بن علي، رأس الشيعة وصاحب التصانيف؛ كان جامعاً طبيباً متكلماً متفنناً من كبار أصحاب الشريف المرتضى، وهو مؤلف كتاب «تلقين أولاد المؤمنين»؛ مات بصور في ربيع الآخر سنة تسع وأربعين وأربعمائة {cite:shadharat-dhahab p. 291}."
  en: "Abu al-Fath al-Karajiki (al-Khaymi) Muhammad b. Ali — head of the Shi'a and an author, physician, mutakallim and polymath among al-Sharif al-Murtada's leading pupils; author of *Talqin awlad al-mu'minin*; died at Tyre in Rabi' II 449 {cite:shadharat-dhahab p. 291}."
  es: "Abu al-Fath al-Karajiki (al-Khaymi) Muhammad n. Ali, líder de los chiítas y autor, médico, mutakallim y erudito entre los principales alumnos de al-Sharif al-Murtada; autor de *Talqin awlad al-mu'minin*; murió en Tiro en Rabi' II 449 {cita: shadharat-dhahab p. 291}."
  fr: "Abu al-Fath al-Karajiki (al-Khaymi) Muhammad b. Ali – chef des chiites et auteur, médecin, mutakallim et mathématicien parmi les principaux élèves d'al-Sharif al-Murtada; auteur de *Talqin awlad al-mu'minin*; mort à Tyr en Rabi' II 449 {cite: shadharat-dhahab p. 291}."
  ur: "ابو الفتح الکرجیکی ⁦(الخیمی)⁩ محمد بن۔ علی - شیعوں کے سربراہ اور ایک مصنف، طبیب، متکلم اور الشریف المرتضیٰ کے سرکردہ شاگردوں میں سے *تلقین اولد المومنین* کے مصنف؛ ربیع الثانی 449 میں صور میں وفات پائی۔ 291}۔"
  tr: "Ebu el-Feth el-Karacaki — yani el-Haymi — Şiilerin başı ve eserlerin yazarı Muhammed ibn Ali; bir koleksiyoncu, hekim, hatip ve sanatçıydı, Şerif el-Murtada'nın büyük sahabelerinden biri ve 'İnananların Oğullarına Öğretmek' kitabının yazarıydı; dört yüz kırk dokuzuncu yılda Rabi' al-Thani'de Sur'da öldü {atıf:shadharat-dhahab, s. 291}."
  id: "Abu al-Fath al-Karajaki — yaitu al-Khaymi — Muhammad ibn Ali, kepala Syiah dan penulis karya; ia adalah seorang kolektor, dokter, orator, dan seniman, salah satu sahabat besar Sharif al-Murtada, dan penulis buku 'Mengajarkan Anak-anak Orang Beriman'; ia meninggal di Tyre di Rabi' al-Thani pada tahun empat ratus empat puluh sembilan {cite:shadharat-dhahab, hlm. 291}."
