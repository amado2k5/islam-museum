summary:
  en: "A Hashimi Muhajir, the eldest of the three Muslim duelists at Badr; he exchanged two blows with Utba ibn Rabi'a that left both mortally wounded, and died at al-Safra days later on the march home."
  ar: "هاشمي مهاجري، أسنّ المبارزين الثلاثة يوم بدر؛ اختلف بينه وبين عتبة بن ربيعة ضربتان أثخن كلٌّ منهما صاحبه، فقُطعت رجله ومات بالصفراء بعد أربعة أو خمسة أيام."
  ur: "ہاشمی مہاجر اور بدر کے تین مسلمان مبارزوں میں سب سے عمر رسیدہ؛ عتبہ بن ربیعہ کے ساتھ مقابلے میں شدید زخمی ہوئے اور واپسی کے سفر میں چار یا پانچ دن بعد صفراء میں وفات پائی۔ {cite:mubarakpuri-raheeq}"
  es: "Un muhajir hashimi, el mayor de los tres duelistas musulmanes en Badr, intercambió dos golpes con Utba ibn Rabi'a que los dejaron a ambos mortalmente heridos, y murió en al-Safra días después, durante la marcha de regreso a casa."
  fr: "Un Hashimi Muhajir, l'aîné des trois duellistes musulmans de Badr; il échangea deux coups avec Utba ibn Rabi'a qui les laissèrent tous deux mortellement blessés, et mourut à al-Safra quelques jours plus tard sur le chemin du retour."
  tr: "Bedr gününde üç düellocunun en büyüğü olan Haşimi Muhaciri; o ve Utbah ibn Rabi'ah, diğerinin en ağır darbeleriyle iki darbe aldılar; bacağını kesip dört-beş gün sonra sarılıktan öldüler."
  id: "Hashemi Muhajiri, yang tertua dari tiga duelman pada hari Badr; ia dan Utbah ibn Rabi'ah menerima dua pukulan, masing-masing dengan pukulan terberat satu sama lain, memotong kakinya dan meninggal karena penyakit kuning empat atau lima hari kemudian."
