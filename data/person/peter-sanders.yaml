summary:
  ar: 'مصور بريطاني وُلد سنة 1946؛ صوّر موسيقيي الروك في الستينيات ثم أسلم سنة 1971، وكرّس خمسة عقود لتوثيق العالم الإسلامي: مدنه ومساجده وعلماؤه وناسه، في أرشيف يُعدّ من أهم الصور الفوتوغرافية للحضارة
    الإسلامية المعاصرة.'
  en: British photographer born in 1946; after photographing 1960s rock musicians he embraced Islam in 1971 and devoted five decades to documenting the Muslim world — its cities, mosques, scholars and people
    — in an archive ranked among the most important photographic records of contemporary Islamic civilisation.
  ur: برطانوی فوٹوگرافر جو 1946 میں پیدا ہوا؛ 60 کی دہائی کے راک موسیقاروں کی تصویریں لینے کے بعد 1971 میں مسلمان ہوا اور پانچ دہائیاں مسلم دنیا — شہر، مسجدیں، علماء اور لوگ — کی دستاویزی کاری کو وقف کی،
    جس کا مجموعہ عصری اسلامی تہذیب کے اہم ترین فوٹو ریکارڈ میں شمار ہوتا ہے۔
  es: "Fotógrafo británico nacido en 1946; tras fotografiar a músicos de rock de los años 60, se convirtió al islam en 1971 y dedicó cinco décadas a documentar el mundo musulmán —sus ciudades, mezquitas, eruditos y gentes— en un archivo considerado uno de los registros fotográficos más importantes de la civilización islámica contemporánea."
  fr: "Photographe britannique né en 1946; après avoir photographié des musiciens de rock des années 1960, il s'est converti à l'islam en 1971 et a consacré cinq décennies à documenter le monde musulman — ses villes, ses mosquées, ses érudits et ses habitants — dans des archives considérées comme parmi les plus importantes archives photographiques de la civilisation islamique contemporaine."
  tr: "1946 doğumlu bir İngiliz fotoğrafçı; 1960'larda rock müzisyenlerini fotoğrafladı, ardından 1971'de İslam'a geçti ve İslam dünyasını belgelemeye beş on yıl adadı; şehirleri, camileri, alimleri ve insanları, çağdaş İslam medeniyetinin en önemli fotoğraflarından biri olarak kabul edilen bir arşivde."
  id: "Seorang fotografer Inggris yang lahir pada tahun 1946; ia memotret musisi rock pada tahun 1960-an, lalu memeluk Islam pada tahun 1971, mendedikasikan lima dekade untuk mendokumentasikan dunia Islam: kota-kotanya, masjid, para cendekiawan, dan penduduknya, dalam arsip yang dianggap sebagai salah satu foto terpenting peradaban Islam kontemporer."
