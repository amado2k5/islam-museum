summary:
  ar: "بطاقة أولية لرضي الدين علي بن طاووس، عالم الحلة ومؤلفها في القرن الثالث عشر صاحب «اللطيف في المعارف»، توفي سنة ١٢٦٦م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Radi al-Din Ali ibn Tawus, the thirteenth-century scholar of Hilla author of al-Latif fi al-Ma'arif, d. 1266; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar para Radi al-Din Ali ibn Tawus, erudito de Hilla del siglo XIII, autor de al-Latif fi al-Ma'arif, fallecido en 1266; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche provisoire de Radi al-Din Ali ibn Tawus, érudit du XIIIe siècle originaire de Hilla et auteur d'al-Latif fi al-Ma'arif, mort en 1266; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "ردی الدین علی ابن طاؤس کے لیے ڈرافٹ کارڈ، ہللا کے تیرہویں صدی کے عالم الطیف فی المعارف کے مصنف، ڈی۔ 1266; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Hillah bilgini ve on üçüncü yüzyılda yazarı olan Radi al-Din Ali ibn Tawus'un ön kartı, 1266 yılında ölen 'Al-Latif fi al-Ma'arif' kitabının yazarı; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Radi al-Din Ali ibn Tawus, sarjana Hillah dan penulisnya pada abad ketiga belas, penulis 'Al-Latif fi al-Ma'arif,' yang meninggal pada tahun 1266 M; buku biografi menyebutkannya, dan biografinya belum pernah diulas di halaman tersebut."
