summary:
  ar: "شرف الدين أبو النجا موسى بن أحمد الحجاوي المقدسي ثم الصالحي الحنبلي، الإمام العلامة مفتي الحنابلة بدمشق وشيخ الإسلام بها؛ كان إماماً بارعاً أصولياً فقيهاً محدثاً ورعاً، ومن تأليفه كتاب الإقناع جرّد فيه الصحيح من مذهب الإمام أحمد — لم يؤلف أحد مؤلفاً مثله في تحرير النقول وكثرة المسائل — ومنها شرح المفردات وشرح منظومة الآداب لابن مفلح وزاد المستقنع في اختصار المقنع وحاشية على الفروع وغير ذلك؛ توفي يوم الخميس الثاني والعشرين من ربيع الأول ودُفن بأسفل الروضة تجاه قبر المحقق من جهة الغرب يفصل بينهما الطريق {cite:shadharat-dhahab p. 327}."
  en: "Musa al-Hajjawi — Hanbali mufti and shaykh al-Islam of Damascus, author of al-Iqna', the distilled sound of Ahmad's madhhab — 'no one composed its like for verified transmissions and multitude of issues'; also Sharh al-Mufarradat, Zad al-Mustaqni' and a gloss on al-Furu'; died Thursday 22 Rabi' I [960], buried below the Rawda {cite:shadharat-dhahab p. 327}."
died: { edtf: "1553-04-12~", hijri: "0960-03-22~", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي الخميس 22 ربيع الأول ودُفن بأسفل الروضة تجاه قبر المحقق؛ التحويل مشتق {cite:shadharat-dhahab p. 327}", sources: [source/shadharat-dhahab] }
