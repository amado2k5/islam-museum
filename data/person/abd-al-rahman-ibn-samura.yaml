label: { ar: "عبد الرحمن بن سمرة", en: "Abd al-Rahman ibn Samura" }
summary:
  ar: "عبد الرحمن بن سمرة بن حبيب بن عبد شمس؛ ولاه ابن عامر سجستان فحصر مرزبان زرنج يوم عيدهم فصالحه على ألفي ألف درهم وألفي وصيف وغلب إلى كش من ناحية الهند وإلى بلاد الداور وحصرهم في جبل الزور فصالحهم ودخل على الزور صنم من ذهب عيناه ياقوتتان فقطع يده وأخذ الياقوتتين وقال للمرزبان دونك الذهب والجوهر إنما أردت أن أعلمك أنه لا يضر ولا ينفع وفتح بست وزابل بعهد."
  en: "Abd al-Rahman ibn Samura ibn Habib ibn Abd Shams; Ibn Amir's governor of Sijistan — Zaranj's marzban truced under feast-day siege for two million and two thousand wadif; he conquered to Kish and the Dawar country, trapped them in Jabal al-Zur, cut the hand off the gold ruby-eyed Zur idol and took its eyes: 'yours — I meant to show you it neither harms nor benefits'; Bust and Zabil by compact."
