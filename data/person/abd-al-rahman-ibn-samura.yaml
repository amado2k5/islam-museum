label: { ar: "عبد الرحمن بن سمرة", en: "Abd al-Rahman ibn Samura", fr: "Abd al-Rahman ibn Samura", es: "Abd al-Rahman ibn Samura", ur: "عبدالرحمٰن بن سمرہ" }
summary:
  ar: "عبد الرحمن بن سمرة بن حبيب بن عبد شمس؛ ولاه ابن عامر سجستان فحصر مرزبان زرنج يوم عيدهم فصالحه على ألفي ألف درهم وألفي وصيف وغلب إلى كش من ناحية الهند وإلى بلاد الداور وحصرهم في جبل الزور فصالحهم ودخل على الزور صنم من ذهب عيناه ياقوتتان فقطع يده وأخذ الياقوتتين وقال للمرزبان دونك الذهب والجوهر إنما أردت أن أعلمك أنه لا يضر ولا ينفع وفتح بست وزابل بعهد."
  en: "Abd al-Rahman ibn Samura ibn Habib ibn Abd Shams; Ibn Amir's governor of Sijistan — Zaranj's marzban truced under feast-day siege for two million and two thousand wadif; he conquered to Kish and the Dawar country, trapped them in Jabal al-Zur, cut the hand off the gold ruby-eyed Zur idol and took its eyes: 'yours — I meant to show you it neither harms nor benefits'; Bust and Zabil by compact."
  fr: "Abd al-Rahman ibn Samura ibn Habib ibn Abd Shams ; gouverneur du Sijistan pour Ibn Amir — le marzban de Zaranj, assiégé un jour de fête, traita pour deux millions et deux mille wadif ; il conquit jusqu'à Kish et au pays de Dawar, les enferma au Jabal al-Zur, coupa la main de l'idole d'or de Zur aux yeux de rubis et prit ses yeux : « gardez-les — je voulais vous montrer qu'elle ne nuit ni ne sert » ; Bust et Zabil par traité."
  es: "Abd al-Rahman ibn Samura ibn Habib ibn Abd Shams; gobernador de Sijistan de Ibn Amir: el marzban de Zaranj pactó una tregua bajo asedio en día festivo por dos millones y dos mil wadif; conquistó Kish y el país de Dawar, los atrapó en Jabal al-Zur, cortó la mano del ídolo Zur de oro y ojos de rubí y tomó sus ojos: 'tuyos, quise mostrarte que no dañan ni benefician'; Busto y Zabil por pacto."
  ur: "عبدالرحمٰن بن سمرہ ابن حبیب ابن عبد شمس؛ ابن عامر کا سجستان کا گورنر - زرنج کا مرزبان عید کے دن کے محاصرے میں 20 لاکھ 20 ہزار ودیف؛ اس نے کیش اور داور کے ملک کو فتح کیا، انہیں جبل الزور میں پھنسا دیا، سونے کی روبی آنکھوں والے ظور کے بت سے ہاتھ کاٹ کر اس کی آنکھیں نکال لیں: 'تمہاری - میں تمہیں دکھانا چاہتا تھا کہ اس کا نہ نقصان ہے اور نہ فائدہ'۔ Bust اور Zabil by compact."
  tr: "Abdülrahman ibn Samra ibn Habib ibn Abd Şems; İbn Amir onu Sijistan valisi olarak atadı, böylece Zaranj Marzbanı'nı bayram günlerinde kuşattı ve iki milyon dirhem ve iki bin hizmetçi karşılığında onunla barış yaptı. Hindistan yönünden Kaş'ı ve Dawar topraklarını fethetti ve onları Zur Dağı'nda kuşattı, böylece onlarla barış yaptı. Gözleri iki yakut olan altın bir putla Zur'a girdi, elini kesti ve iki yakutu aldı ve Marzbana, \"İşte altın ve mücevher. Sadece size bunun ne zararı ne de faydası olduğunu bildirmek istedim.\" dedi. Bir antlaşma ile Bust ve Zabul'u fethetti."
  id: "Abd al-Rahman ibn Samra ibn Habib ibn Abd Shams; Ibn Amir mengangkatnya sebagai gubernur Sijistan, lalu ia mengepung Marzban Zaranj pada hari raya mereka, dan berdamai dengannya dengan imbalan dua juta dirham dan dua ribu pelayan. Ia menaklukkan Kash dari arah India dan tanah Dawar, dan mengepung mereka di gunung al-Zur, lalu ia berdamai dengan mereka. Ia memasuki al-Zur dengan sebuah patung emas yang matanya berupa dua batu rubi, lalu ia memotong tangannya dan mengambil kedua batu rubi itu dan berkata kepada Marzban, “Inilah emas dan permata itu. Aku hanya ingin memberitahumu bahwa itu tidak membahayakan maupun memberi manfaat.” Ia menaklukkan Bust dan Zabul dengan sebuah perjanjian."
