summary:
  ar: "أكبر أبناء النبي من خديجة بنت خويلد؛ به كان يُكنّى أبا القاسم، وتوفي صغيراً في مكة ولم يعش من أبناء النبي الذكور أحد. وتوفي سنة ثمان ومائة {cite:muruj-al-dhahab p. 192} ويذكر الكتاب أنه كان من الفقهاء العشرة الذين دعاهم عمر بن عبد العزيز إلى مجلس الشورى بالمدينة. {cite:salabi-umayyad-state-2020 p.173}"
  en: "The Prophet's eldest son by Khadija, from whom his kunya Abu al-Qasim derives; he died young in Mecca."
  fr: "Le fils aîné du Prophète par Khadija, de qui sa kunya Abu al-Qasim dérive ; il est mort jeune à La Mecque."
  es: "El hijo mayor del Profeta y Jadiya, de quien deriva su kunya Abu al-Qasim; murió joven en La Meca."
  ur: "خدیجہ کی طرف سے پیغمبر کا سب سے بڑا بیٹا، جس سے ان کی کنیت ابو القاسم نکلی ہے۔ جوانی میں مکہ میں وفات پائی۔"
  tr: "Peygamber'in en büyük oğlu Khadice bint Khuveylid'di; Ebu el-Kasim olarak biliniyordu ve genç yaşta Mekke'de öldü, Peygamber'in erkek oğullarından hiçbiri hayatta kalmadı. 108 yılında öldü {atıf:muruj-al-dhahab s. 192}. Kitapta, Ömer bin Abdülaziz'in Medine'deki Şura Konseyi'ne davet ettiği on hukukçudan biri olduğu belirtilir. {kaynak:Selabi-Ümevyed-devlet-2020 s.173}"
  id: "Putra sulung Nabi adalah Khadijah bint Khuwaylid; ia dikenal sebagai Abu al-Qasim, dan ia meninggal muda di Mekah, dan tidak ada putra laki-laki Nabi yang selamat. Ia meninggal pada tahun 108 {cite:muruj-al-dhahab hlm. 192}. Kitab tersebut menyebutkan bahwa ia termasuk di antara sepuluh ahli hukum yang diundang Umar ibn Abd al-Aziz ke Majelis Shura di Madinah. {cite:salabi-umayyad-state-2020 hlm.173}"
