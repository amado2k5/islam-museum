summary:
  ar: "بطاقة أولية لخسرو ميرزا، الأمير المغولي ابن جهانكير الذي شُغّل بأخويه على العرش وعُمّي وسُجن حتى قُتل سنة ١٦٢٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Khusrau Mirza, the Mughal prince son of Jahangir who was pushed into contesting the throne, blinded and imprisoned until his death in 1622; the biographical entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Khusrau Mirza, el príncipe mogol hijo de Jahangir que fue forzado a disputar el trono, cegado y encarcelado hasta su muerte en 1622; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de convocation de Khusrau Mirza, prince moghol fils de Jahangir, contraint de contester le trône, aveuglé et emprisonné jusqu'à sa mort en 1622; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "جہانگیر کے مغل شہزادے کے بیٹے خسرو مرزا کے لیے ڈرافٹ کارڈ جسے تخت پر مقابلہ کرنے کے لیے دھکیل دیا گیا تھا، 1622 میں ان کی موت تک اندھا اور قید رکھا گیا تھا۔ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Tahtta iki kardeşiyle birlikte oturan Jahangir'in oğlu Moğol prensi Hüsrau Mirza'nın ilk kartı, amcaydı ve 1622'deki ölümüne kadar hapsedildi; önemli kişilerin sözlüklerinde bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Khusrau Mirza, pangeran Mongol putra Jahangir, yang menduduki tahta bersama dua saudaranya, adalah paman, dan dipenjara hingga kematiannya pada tahun 1622 M; kartu ini disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
