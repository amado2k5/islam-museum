summary:
  ar: "قاضٍ ومصلح تعليمي هندي (1854–1917). دَرّس القانون في الكلية المحمدية الأنجلو-شرقية بعليكرة من سنة 1891، وصار قاضيًا في المحكمة العليا بألاهاباد، وقضى سنواته الأخيرة في الدعوة إلى تعليم النساء المسلمات؛ فأسّس سنة 1912 مدرسة البنات المسلمات في لكناو، التي تحمل اليوم اسمه كليةً للبنات."
  en: "Indian judge and education reformer (1854–1917). He taught law at the Muhammadan Anglo-Oriental College, Aligarh, from 1891, became a judge of the Allahabad High Court, and spent his later years campaigning for the education of Muslim women; in 1912 he founded the Muslim Girls' School at Lucknow, which today bears his name as a girls' college."
  ur: "ہندوستانی جج اور تعلیمی مصلح (1854ء–1917ء)۔ انھوں نے 1891ء سے علی گڑھ کے محمڈن اینگلو اورینٹل کالج میں قانون پڑھایا، الہ آباد ہائی کورٹ کے جج بنے، اور اپنی آخری عمر مسلمان خواتین کی تعلیم کی تحریک میں گزاری؛ 1912ء میں انھوں نے لکھنؤ میں مسلم گرلز اسکول قائم کیا جو آج ان کے نام سے لڑکیوں کا کالج ہے۔"
