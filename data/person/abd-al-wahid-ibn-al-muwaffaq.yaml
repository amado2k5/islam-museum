summary:
  ar: "ابن الموفق وعم المكتفي، كان المعتضد يعزه ويميل إليه ميلاً شديداً ولم تكن له همة في خلافة ولا رياسة بل كانت همته في اللعب مع الأحداث، واعتقل عند مؤنس الفحل فبعث إليه القاسم بن عبيد الله حتى أخذ برأسه، وكان المكتفي قد أخبر عنه أنه راسل غلمانه فسمع منه وهو طرب ينشد شعر العتابي أسرك أني نلت ما نال جعفر من الملك أو ما نال يحيى بن خالد، فلما انتهى إلى المكتفي قال هذا قول من ليس له همة غير فرجه وجوفه وأمرد يعانقه وكلاب يهارش بها، فلم يزل القاسم به حتى قتله {cite:muruj-al-dhahab p. 639-640}."
  en: "Al-Muwaffaq's pleasure-loving son, harmless to the throne yet killed by the vizier al-Qasim {cite:muruj-al-dhahab p. 639-640}."
