summary:
  ar: "ابن الموفق وعم المكتفي، كان المعتضد يعزه ويميل إليه ميلاً شديداً ولم تكن له همة في خلافة ولا رياسة بل كانت همته في اللعب مع الأحداث، واعتقل عند مؤنس الفحل فبعث إليه القاسم بن عبيد الله حتى أخذ برأسه، وكان المكتفي قد أخبر عنه أنه راسل غلمانه فسمع منه وهو طرب ينشد شعر العتابي أسرك أني نلت ما نال جعفر من الملك أو ما نال يحيى بن خالد، فلما انتهى إلى المكتفي قال هذا قول من ليس له همة غير فرجه وجوفه وأمرد يعانقه وكلاب يهارش بها، فلم يزل القاسم به حتى قتله {cite:muruj-al-dhahab p. 639-640}."
  en: "Al-Muwaffaq's pleasure-loving son, harmless to the throne yet killed by the vizier al-Qasim {cite:muruj-al-dhahab p. 639-640}."
  fr: "Le fils d'al-Muwaffaq, amateur de plaisirs, inoffensif pour le trône et pourtant tué par le vizir al-Qasim {cite:muruj-al-dhahab p. 639-640}."
  es: "El hijo hedonista de Al-Muwaffaq, inofensivo para el trono, fue asesinado por el visir al-Qasim {cite:muruj-al-dhahab p. 639-640}."
  ur: "الموفق کا لذت پسند بیٹا، تخت کے لیے بے ضرر، پھر بھی وزیر القاسم کے ہاتھوں مارا گیا۔ 639-640}۔"
  tr: "İbn el-Muveffaq ve el-Muktafi'nin amcası el-Mu'tadid ona büyük saygı duyuyor ve ona çok meyilliydi. Halifelik veya liderlik hırsı yoktu, tek amacı genç erkeklerle oynamaktı. Mu'nis el-Fahl'ın evinde tutuklandı, bu yüzden el-Kasım ibn Ubeydullah onu yakalayıp öldürene kadar peşine düştü. El-Muktafi, hizmetkarlarıyla yazışmalarını dinlediğini ve sevinç içinde el-Attabi'nin şu şiirini okuduğunu rivayet etmiştir: \"Cafer'in veya Yahya ibn Halid'in elde ettiği krallığı elde etmem sizi memnun ediyor mu?\" El-Muktafi'ye ulaştığında şöyle dedi: \"Bu, cinsel organlarından ve midesinden başka bir hırsı olmayan, sakalsız bir genci kucaklamak ve köpeklerle dövüşmek isteyen birinin sözüdür.\" El-Kasım onu öldürene kadar peşini bırakmadı. {alıntı:muruj-al-dhahab s. 639-640}"
  id: "Ibn al-Muwaffaq dan paman al-Muktafi, al-Mu'tadid sangat menghormatinya dan sangat menyukainya. Ia tidak memiliki ambisi untuk menjadi khalifah atau pemimpin, tetapi ambisinya adalah bermain-main dengan pemuda. Ia ditangkap di rumah Mu'nis al-Fahl, sehingga al-Qasim ibn Ubayd Allah dikirim untuk menemuinya hingga ia memenggal kepalanya. Al-Muktafi melaporkan bahwa ia telah berkorespondensi dengan para pelayannya dan mendengarnya, ketika ia sedang gembira, membacakan puisi al-Attabi: \"Apakah kalian senang bahwa aku telah mencapai apa yang dicapai Ja'far yaitu kekuasaan raja atau apa yang dicapai Yahya ibn Khalid?\" Ketika ia sampai di hadapan al-Muktafi, ia berkata: \"Ini adalah ucapan orang yang tidak memiliki ambisi selain alat kelamin dan perutnya, dan seorang pemuda tak berjenggot untuk dipeluk dan anjing untuk diajak berkelahi.\" Al-Qasim terus menyerangnya hingga ia membunuhnya. {cite:muruj-al-dhahab p. 639-640}"
