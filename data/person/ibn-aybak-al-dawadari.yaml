  ar: "المؤرخ أبو بكر بن عبد الله بن أيبك الداوداري، صاحب الموسوعة التاريخية «كنز الدرر وجامع الغرر» في تاريخ مصر والدول الإسلامية، وقد جمع فيها بين الأخبار السياسية والحكايات الأدبية والشعر."
