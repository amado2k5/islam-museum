summary:
  ar: "عالم مسلم صيني من نانتشنغ في شنشي (1888–1943)، عُرف باسمه الديني هلال الدين، وكان من كبار الأئمة «الأهونغ» في جمهورية الصين وأحد «الأئمة الأربعة الكبار»؛ حجّ سنة 1913، وشارك سنة 1928 في تأسيس المدرسة الإسلامية النظامية في شنغهاي، وترجم الأجزاء الأولى من القرآن إلى الصينية، وقضى سنواته الأخيرة في شاديان يعين تلميذه ما جيان على ترجمة القرآن كاملًا."
  en: "Chinese Muslim scholar from Nanzheng, Shaanxi (1888–1943), known by his religious name Hilal al-Din, a leading ahong of the Republic of China and one of the four great ahongs of modern China. He performed the hajj in 1913, co-founded the Shanghai Islamic Normal School in 1928, published Chinese translations of the first three volumes of the Qur'an, and spent his last years at Shadian helping his student Ma Jian translate the whole Qur'an."
  ur: "نن ژینگ، شانشی سے تعلق رکھنے والے ایک چینی مسلمان عالم (1888ء–1943ء)، جن کا دینی نام ہلال الدین تھا؛ جمہوریہ چین کے ممتاز آہونگ اور جدید چین کے چار بڑے آہونگوں میں سے ایک۔ انہوں نے 1913ء میں حج کیا، 1928ء میں شنگھائی اسلامی نارمل اسکول کی تاسیس میں حصہ لیا، قرآن کے پہلے تین اجزا کا چینی ترجمہ شائع کیا، اور اپنی زندگی کے آخری سال شادیان میں اپنے شاگرد ما جیان کی مکمل قرآن کے ترجمے میں مدد کرتے ہوئے گزارے۔"
