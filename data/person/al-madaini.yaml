label: { ar: "المدائني", en: "al-Mada'ini" }
summary:
  ar: "عند البلاذري: المدائني عن مسلمة بن محارب أن خالد بن يزيد أشار على عبد الملك بتحريم دنانير الروم والمنع من التعامل بها وبمنع دخول القراطيس بلادهم فمكث حيناً لا يحمل إليهم — راوٍ في كتاب فتوح البلدان. وقيل في سنة أربع وثلاثين ومائتين وقيل في أيام الواثق سنة ثمان وعشرين ومائتين {cite:muruj-al-dhahab p. 512}، وعند العلماء كما قرأ ابن النديم أنه بأمر خراسان والهند وفارس {cite:fihrist-ibn-al-nadim p. 293}"
  en: "In al-Baladhuri: al-Mada'ini via Maslama ibn Muharib — Khalid ibn Yazid counselled Abd al-Malik to forbid Roman dinars, prevent trading them, and bar papyrus from their lands, so none was carried to them for a time — a narrator in Futuh al-Buldan."
