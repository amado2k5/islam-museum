id: person/al-madaini
education:
  did_you_know:
    ar: "المدائني راوية الأخبار عند البلاذري؛ يروي عن مسلمة بن محارب أن خالد بن يزيد أشار على عبد الملك بتحريم دنانير الروم ومنع دخول قراطيسهم بلادهم."
    en: "Al-Mada'ini is al-Baladhuri's chronicler of reports; from Muslima ibn Muharib he relates Khalid ibn Yazid's advice to Abd al-Malik — ban the Byzantines' dinars and bar their papyrus from the realm."
    ur: "مدائنی بلاذری کے اخبار نقل کرنے والے ہیں؛ مسلمہ بن محارب سے وہ خالد بن یزید کا مشورہ عبدالملک کو نقل کرتے ہیں — رومی دینار حرام کرو اور ان کا قرطاس سلطنت میں داخل ہونے دو۔"
    sources: [source/futuh-buldan-maarif-1407, source/encyclopaedia-of-islam-2]
