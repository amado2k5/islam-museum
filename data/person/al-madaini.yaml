id: person/al-madaini
education:
  did_you_know:
    ar: "المدائني راوية الأخبار عند البلاذري؛ يروي عن مسلمة بن محارب أن خالد بن يزيد أشار على عبد الملك بتحريم دنانير الروم ومنع دخول قراطيسهم بلادهم."
    en: "Al-Mada'ini is al-Baladhuri's chronicler of reports; from Muslima ibn Muharib he relates Khalid ibn Yazid's advice to Abd al-Malik — ban the Byzantines' dinars and bar their papyrus from the realm."
    ur: "مدائنی بلاذری کے اخبار نقل کرنے والے ہیں؛ مسلمہ بن محارب سے وہ خالد بن یزید کا مشورہ عبدالملک کو نقل کرتے ہیں — رومی دینار حرام کرو اور ان کا قرطاس سلطنت میں داخل ہونے دو۔"
    sources: [source/futuh-buldan-maarif-1407, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "المدائني", en: "al-Mada'ini", es: "al-Mada'ini", fr: "al-Mada'ini", ur: "المدائنی" }
summary:
  ar: "عند البلاذري: المدائني عن مسلمة بن محارب أن خالد بن يزيد أشار على عبد الملك بتحريم دنانير الروم والمنع من التعامل بها وبمنع دخول القراطيس بلادهم فمكث حيناً لا يحمل إليهم — راوٍ في كتاب فتوح البلدان. وقيل في سنة أربع وثلاثين ومائتين وقيل في أيام الواثق سنة ثمان وعشرين ومائتين {cite:muruj-al-dhahab p. 512}، وعند العلماء كما قرأ ابن النديم أنه بأمر خراسان والهند وفارس {cite:fihrist-ibn-al-nadim p. 293}"
  en: "In al-Baladhuri: al-Mada'ini via Maslama ibn Muharib — Khalid ibn Yazid counselled Abd al-Malik to forbid Roman dinars, prevent trading them, and bar papyrus from their lands, so none was carried to them for a time — a narrator in Futuh al-Buldan."
  es: "En al-Baladhuri: al-Mada'ini vía Maslama ibn Muharib — Khalid ibn Yazid aconsejó a Abd al-Malik que prohibiera los dinares romanos, impidiera su comercio y prohibiera la entrada de papiro a sus tierras, por lo que no se les llevó ninguno durante un tiempo — un narrador en Futuh al-Buldan."
  fr: "Dans al-Baladhuri: al-Mada'ini via Maslama ibn Muharib — Khalid ibn Yazid conseilla à Abd al-Malik d'interdire les dinars romains, d'empêcher leur commerce et d'interdire le papyrus sur leurs terres, de sorte qu'aucun ne leur fut apporté pendant un certain temps — un narrateur dans Futuh al-Buldan."
  ur: "البلادھوری میں: المدائنی بذریعہ مسلمہ ابن محارب - خالد بن یزید نے عبد الملک کو مشورہ دیا کہ وہ رومی دینار سے منع کریں، ان کی تجارت کو روکیں، اور ان کی زمینوں سے پاپائرس کو روک دیں، اس لیے ایک وقت تک ان کے پاس کوئی نہیں پہنچایا گیا - فتوح البلدان میں ایک راوی۔"
  tr: "El-Baladhuri: Maslamah ibn Muharib'den Al-Mada'ini'ye göre, Halid bin Yezid, Abdülmelik'e Roma dinarlarını yasaklamasını ve onlarla ticaret yapmayı yasaklamasını ve topraklarına plastik torbaların girmesini engellemesini tavsiye etmiş, bu yüzden bir süre onlara getirilmeden kalmıştır — 'Futuh al-Buldan' kitabında anlatılan. 234 yılında ve 228 yılında el-Vetik'in zamanında da söylenmiştir {atıf:Muruj-al-Dhahab s. 512} ve alimlere göre, İbn el-Nadim'in okuduğu gibi, bu Khorasan, Hindistan ve Pers sırasındadır {atıf:Fihrist-ibn-al-Nadim s. 293}"
  id: "Menurut Al-Baladhuri: Al-Mada'ini dari Maslamah ibn Muharib bahwa Khalid ibn Yazid menyarankan Abd al-Malik untuk melarang dinar Romawi dan melarang berdagang dengan dinar Romawi, serta mencegah masuk kantong plastik ke tanah mereka, sehingga ia tinggal untuk sementara waktu tanpa dibawa kepada mereka — diceritakan dalam buku 'Futuh al-Buldan'. Dikatakan pada tahun 234, dan dikatakan pada masa al-Wathiq tahun 228 {cite:muruj-al-dhahab hlm. 512}, dan menurut para sarjana, seperti yang dibaca Ibn al-Nadim, ia dalam urutan Khorasan, India, dan Persia {cite:fihrist-ibn-al-nadim hlm. 293}"
