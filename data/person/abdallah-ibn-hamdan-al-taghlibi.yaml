summary:
  ar: "عبد الله بن حمدان بن حمدون التغلبي العدوي، أبو الهيجاء، أمير ومن القادة المقدمين في العصر العباسي، ولاه المكتفي الموصل سنة ٢٩٣هـ وعزله المقتدر سنة ٣٠١هـ ثم أعاده، وقتله أحد رجال المقتدر سنة ٣١٧هـ."
  en: "Abdallah ibn Hamdan ibn Hamdun al-Taghlibi al-Adawi, Abu al-Hayja', an amir and foremost commander of the Abbasid age; al-Muktafi made him governor of Mosul in 293 AH, al-Muqtadir dismissed and later reinstated him, and one of al-Muqtadir's men killed him in 317 AH (929)."
