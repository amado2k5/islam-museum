summary:
  ar: "عبد الله بن حمدان بن حمدون التغلبي العدوي، أبو الهيجاء، أمير ومن القادة المقدمين في العصر العباسي، ولاه المكتفي الموصل سنة ٢٩٣هـ وعزله المقتدر سنة ٣٠١هـ ثم أعاده، وقتله أحد رجال المقتدر سنة ٣١٧هـ."
  en: "Abdallah ibn Hamdan ibn Hamdun al-Taghlibi al-Adawi, Abu al-Hayja', an amir and foremost commander of the Abbasid age; al-Muktafi made him governor of Mosul in 293 AH, al-Muqtadir dismissed and later reinstated him, and one of al-Muqtadir's men killed him in 317 AH (929)."
  fr: "Abdallah ibn Hamdan ibn Hamdun al-Taghlibi al-Adawi, Abu al-Hayja', émir et commandant de premier plan de l'époque abbasside ; al-Muktafi le nomma gouverneur de Mossoul en 293 H, al-Muqtadir le destitua puis le rétablit, et l'un des hommes d'al-Muqtadir le tua en 317 H (929)."
  es: "Abdallah ibn Hamdan ibn Hamdun al-Taghlibi al-Adawi, Abu al-Hayja', emir y principal comandante de la época abasí; al-Muktafi lo nombró gobernador de Mosul en 293 AH, al-Muqtadir lo destituyó y luego lo reintegró, y uno de los hombres de al-Muqtadir lo mató en 317 AH (929)."
  ur: "عبداللہ بن حمدان بن حمدون الطغلبی العدوی، ابو الحیجہ، عباسی دور کا امیر اور سب سے اہم کمانڈر؛ المقتفی نے اسے 293 ہجری میں موصل کا گورنر بنایا، مقتدیر نے اسے برطرف کیا اور بعد میں اسے بحال کر دیا، اور مقتدیر کے ایک آدمی نے اسے 317 ہجری (929) میں قتل کر دیا۔"
