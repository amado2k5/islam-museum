summary:
  ar: "سياسي أوزبكي، وُلد في 24 يوليو 1957 في مقاطعة زعامين بجهة جيزاك. تدرّج في إدارات الأقاليم ثم رئاسة الوزراء ⁦(2003–2016)⁩، وتولى رئاسة أوزبكستان خلفًا لإسلام كريموف منذ ديسمبر 2016؛ ارتبط اسمه بإصلاحات انفتاحية في الاقتصاد والشؤون الدينية تحت شعار «أوزبكستان الجديدة»."
  en: "Uzbek politician, born on 24 July 1957 in Zaamin district, Jizzakh region. He rose through regional administrations to become prime minister (2003–2016), then succeeded Islam Karimov as president of Uzbekistan in December 2016; his name is tied to liberalising economic and religious-affairs reforms under the New Uzbekistan banner."
  ur: "ازبک سیاست دان، 24 جولائی 1957 کو صوبہ جیزاخ کے ضلع زعامین میں پیدا ہوئے۔ وہ علاقائی انتظامیوں سے ہوتا ہوا وزیرِ اعظم (2003–2016) بنا، پھر دسمبر 2016 میں اسلام کریموف کے جانشین ہو کر ازبکستان کا صدر؛ ان کا نام «نیا ازبکستان» کے عنوان سے معاشی اور مذہبی امور میں کشادہ اصلاحات سے جڑا ہے۔"
  es: "Político uzbeko, nacido el 24 de julio de 1957 en el distrito de Zaamin, región de Jizzakh. Ascendió a través de las administraciones regionales hasta convertirse en primer ministro (2003-2016), y luego sucedió a Islam Karimov como presidente de Uzbekistán en diciembre de 2016; su nombre está ligado a las reformas de liberalización económica y religiosa impulsadas bajo el estandarte del Nuevo Uzbekistán."
  fr: "Homme politique ouzbek, né le 24 juillet 1957 dans le district de Zaamin, région de Jizzakh. Il gravit les échelons des administrations régionales jusqu'à devenir Premier ministre (2003-2016), puis succède à Islam Karimov à la présidence de l'Ouzbékistan en décembre 2016; son nom est associé aux réformes libérales économiques et religieuses menées sous la bannière du Nouvel Ouzbékistan."
