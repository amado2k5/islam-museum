summary:
  ar: "المفضل بن سلمة بن عاصم، أبو طالب الضبي، لغوي صاحب تصانيف مشهورة في فنون الأدب ومعاني القرآن، أخذ عن ابن الأعرابي وغيره من مشاهير العلماء، وأخذ عنه الصولي وغيره. من تصانيفه «البارع في علم اللغة» وكتاب «ضياء القلوب» في معاني القرآن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. وتاريخ وفاته في الكتاب (؟-290 ه)."
  en: "Al-Mufaddal ibn Salama ibn Asim, Abu Talib al-Dabbi, a philologist known for works on the arts of literature and the meanings of the Qur'an. He studied with Ibn al-A'rabi and other well-known scholars, and al-Suli and others studied with him. His works include al-Bari' fi ilm al-lugha and Diya' al-qulub on the meanings of the Qur'an {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. The book gives his death as 290 AH."
  ur: "مفضل بن سلمہ بن عاصم، ابو طالب ضبی، ماہر لغت، ادب اور معانیِ قرآن میں مشہور کتب کے مصنف۔ انہوں نے ابن الاعرابی اور دیگر مشہور علماء سے علم حاصل کیا، اور ان سے صولی وغیرہ نے استفادہ کیا۔ ان کی تصانیف میں البارع فی علم اللغہ اور ضیاء القلوب شامل ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}۔ کتاب ان کی وفات 290 ہجری بتاتی ہے۔"
