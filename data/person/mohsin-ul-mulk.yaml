summary:
  ar: "سياسي هندي مسلم، وُلد باسم سيد مير مهدي علي في إيتاوا سنة 1837، وتصدّر امتحان الخدمة المدنية الإقليمية، ثم خدم دولة حيدر آباد فنال لقبي منير نواز جنغ (1884) ونواب محسن الملك (1887). كان أقرب رفقاء السيد أحمد خان وخلفه أمينًا عامًا لكلية عليكرة وللمؤتمر التعليمي المحمدي، ومن مؤسسي رابطة مسلمي عموم الهند سنة 1906. وُلد شيعيًا ثم قبل عقيدة أهل السنة وكتب في ذلك كتابه «آيات بينات»."
  en: "Indian Muslim politician, born Syed Mir Mehdi Ali at Etawah in 1837. He topped the Provincial Civil Service examination, then served the state of Hyderabad, receiving the titles Munir Nawaz Jang (1884) and Nawab Mohsin-ul-Mulk (1887). He was Syed Ahmad Khan's closest associate and succeeded him as secretary of the MAO College at Aligarh and of the Muhammadan Educational Conference, and was a founder of the All India Muslim League in 1906. Born a Shia, he accepted the Sunni creed and wrote his book Ayat-i Bayanat in its defence."
  ur: "ہندوستانی مسلمان سیاست دان، جو 1837 میں ایٹاوہ میں سید میر مہدی علی کے نام سے پیدا ہوئے۔ صوبائی سول سروس کے امتحان میں اول آئے، پھر ریاست حیدر آباد کی خدمت کی جہاں انھیں منیر نواز جنگ (1884) اور نواب محسن الملک (1887) کے خطابات ملے۔ سر سید احمد خان کے قریب ترین رفیق تھے اور ان کے بعد علی گڑھ کالج اور محمدن ایجوکیشنل کانفرنس کے سیکرٹری بنے، اور 1906 میں آل انڈیا مسلم لیگ کے بانیوں میں شامل تھے۔ شیعہ گھرانے میں پیدا ہوئے مگر بعد میں اہل سنت کی عقیدہ قبول کیا اور اس پر اپنی کتاب «آیات بیانات» لکھی۔"
  es: "Político musulmán indio, nacido como Syed Mir Mehdi Ali en Etawah en 1837. Obtuvo la máxima calificación en el examen del Servicio Civil Provincial y posteriormente sirvió al estado de Hyderabad, recibiendo los títulos de Munir Nawaz Jang (1884) y Nawab Mohsin-ul-Mulk (1887). Fue el colaborador más cercano de Syed Ahmad Khan y lo sucedió como secretario del Colegio MAO en Aligarh y de la Conferencia Educativa Muhammadana. Fue fundador de la Liga Musulmana de la India en 1906. Nacido en una familia chiíta, adoptó la fe suní y escribió su libro Ayat-i Bayanat en defensa de esta."
  fr: "Homme politique musulman indien, né Syed Mir Mehdi Ali à Etawah en 1837, il réussit brillamment le concours de la fonction publique provinciale, puis servit l'État d'Hyderabad, recevant les titres de Munir Nawaz Jang (1884) et de Nawab Mohsin-ul-Mulk (1887). Proche collaborateur de Syed Ahmad Khan, il lui succéda comme secrétaire du MAO College d'Aligarh et de la Conférence éducative musulmane, et fut l'un des fondateurs de la Ligue musulmane panindienne en 1906. Né chiite, il se convertit au sunnisme et écrivit son ouvrage Ayat-i Bayanat pour le défendre."
  tr: "1837'de Ettawa'da Syed Mir Mehdi Ali adıyla doğan Hintli Müslüman bir siyasetçi olan Shern, bölgesel memurluk sınavını geçti, ardından Haydarabad eyaletine hizmet etti ve Munir Nawaz Jung (1884) ile Nawab Mohsin al-Mulk (1887) unvanlarını kazandı. Sayyid Ahmad Khan'ın en yakın ortaklarından biri ve Alikra Koleji ile Muhammadi Eğitim Konferansı'nın genel sekreteri olarak halefiydi ve 1906'da Tüm Hindistan Müslüman Birliği'nin kurucularından biriydi. Şii olarak doğdu, ardından Sünni inancını kabul etti ve bu konuda 'Ayat Baynat' adlı kitabını yazdı."
  id: "Seorang politikus Muslim India, lahir dengan nama Syed Mir Mehdi Ali di Ettawa pada tahun 1837, ia lulus ujian pegawai negeri daerah, kemudian melayani negara bagian Hyderabad, meraih gelar Munir Nawaz Jung (1884) dan Nawab Mohsin al-Mulk (1887). Ia adalah salah satu rekan terdekat Sayyid Ahmad Khan dan penerus sebagai sekretaris jenderal Alikra College dan Konferensi Pendidikan Muhammadi, serta termasuk pendiri All India Muslim League pada tahun 1906. Ia lahir sebagai Syiah, kemudian menerima ajaran Sunni dan menulis bukunya 'Ayat Baynat' tentang topik ini."
