summary:
  ar: "سياسي هندي مسلم، وُلد باسم سيد مير مهدي علي في إيتاوا سنة 1837، وتصدّر امتحان الخدمة المدنية الإقليمية، ثم خدم دولة حيدر آباد فنال لقبي منير نواز جنغ (1884) ونواب محسن الملك (1887). كان أقرب رفقاء السيد أحمد خان وخلفه أمينًا عامًا لكلية عليكرة وللمؤتمر التعليمي المحمدي، ومن مؤسسي رابطة مسلمي عموم الهند سنة 1906. وُلد شيعيًا ثم قبل عقيدة أهل السنة وكتب في ذلك كتابه «آيات بينات»."
  en: "Indian Muslim politician, born Syed Mir Mehdi Ali at Etawah in 1837. He topped the Provincial Civil Service examination, then served the state of Hyderabad, receiving the titles Munir Nawaz Jang (1884) and Nawab Mohsin-ul-Mulk (1887). He was Syed Ahmad Khan's closest associate and succeeded him as secretary of the MAO College at Aligarh and of the Muhammadan Educational Conference, and was a founder of the All India Muslim League in 1906. Born a Shia, he accepted the Sunni creed and wrote his book Ayat-i Bayanat in its defence."
  ur: "ہندوستانی مسلمان سیاست دان، جو 1837 میں ایٹاوہ میں سید میر مہدی علی کے نام سے پیدا ہوئے۔ صوبائی سول سروس کے امتحان میں اول آئے، پھر ریاست حیدر آباد کی خدمت کی جہاں انھیں منیر نواز جنگ (1884) اور نواب محسن الملک (1887) کے خطابات ملے۔ سر سید احمد خان کے قریب ترین رفیق تھے اور ان کے بعد علی گڑھ کالج اور محمدن ایجوکیشنل کانفرنس کے سیکرٹری بنے، اور 1906 میں آل انڈیا مسلم لیگ کے بانیوں میں شامل تھے۔ شیعہ گھرانے میں پیدا ہوئے مگر بعد میں اہل سنت کی عقیدہ قبول کیا اور اس پر اپنی کتاب «آیات بیانات» لکھی۔"
