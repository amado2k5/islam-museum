summary:
  ar: "كاتب ومترجم بوسني من غوريتسا قرب تريبيني، رئيس حركة الشباب المسلمين في سراييفو ومن أبرز المثقفين المسلمين في ما بين الحربين؛ من كتبه «المسلمون في روسيا السوفيتية». حاكمته محكمة عسكرية يوغوسلافية في مايو 1945 بتهمة التعاون مع المحتل، فحُكم عليه بالإعدام وأُعدم رمياً بالرصاص في سراييفو في 29 يونيو 1945."
  en: "Bosnian writer and translator from Gorica near Trebinje, the Young Muslims movement's president in Sarajevo and a prominent Islamic intellectual of the interwar years; among his works is the booklet Muslims in Soviet Russia. A Yugoslav military court tried him in May 1945 as a collaborator, sentenced him to death, and he was shot at Sarajevo on 29 June 1945."
  ur: "گوریتسا (قریب تریبینئے) سے تعلق رکھنے والے بوسنیائی مصنف اور مترجم، سرائیوو میں نوجوان مسلمانان تحریک کے صدر اور بین الحربین دور کے نمایاں مسلم دانشور؛ ان کی تصانیف میں «سوویت روس میں مسلمان» شامل ہے۔ مئی 1945ء میں یوگوسلاو فوجی عدالت نے غاصبوں سے تعاون کے الزام میں مقدمہ چلایا، سزائے موت سنائی، اور 29 جون 1945ء کو سرائیوو میں گولی مار دی گئی۔"
