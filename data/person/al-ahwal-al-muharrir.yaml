summary:
  ar: "رجل من صنائع البرامكة ظهر في عصرهم عارفاً بمعاني الخط وأشكاله فتكلم على رسومه وقوانينه وجعله أنواعاً، وكان يحرر الكتب النافذة من السلطان إلى ملوك الأطراف في الطوامير وكان في نهاية الحرفة والوسخ ومع ذلك سمحاً لا يليق على شيء {cite:fihrist-ibn-al-nadim p. 21}."
  en: "Barmakid-trained calligrapher who codified the pen-styles' rules and wrote the sultan's scrolls to distant kings {cite:fihrist-ibn-al-nadim p. 21}."
  fr: "Calligraphe formé auprès des Barmécides qui codifia les règles des styles d’écriture et rédigea les rouleaux du sultan destinés aux rois lointains {cite:fihrist-ibn-al-nadim p. 21}."
  es: "Calígrafo formado en Barmakid que codificó las reglas de los estilos de pluma y escribió los pergaminos del sultán para reyes lejanos {cite:fihrist-ibn-al-nadim p. 21}."
  ur: "برمکد کا تربیت یافتہ خطاط جس نے قلمی طرز کے اصولوں کو مرتب کیا اور دور دراز کے بادشاہوں کو سلطان کے طومار لکھے۔ 21}۔"
