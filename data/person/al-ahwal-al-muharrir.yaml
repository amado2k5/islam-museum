id: person/al-ahwal-al-muharrir
class: person
tags: [qiraat-browser, qiraat-people, qiraat-khatt]
label: { ar: "الأحول المحرر", en: "al-Ahwal al-Muharrir", fr: "Al-Ahwal al-Muharrir", es: "al-Ahwal al-Muharrir", ur: "الاحوال المحرر" }
summary:
  ar: "رجل من صنائع البرامكة ظهر في عصرهم عارفاً بمعاني الخط وأشكاله فتكلم على رسومه وقوانينه وجعله أنواعاً، وكان يحرر الكتب النافذة من السلطان إلى ملوك الأطراف في الطوامير وكان في نهاية الحرفة والوسخ ومع ذلك سمحاً لا يليق على شيء {cite:fihrist-ibn-al-nadim p. 21}."
  en: "Barmakid-trained calligrapher who codified the pen-styles' rules and wrote the sultan's scrolls to distant kings {cite:fihrist-ibn-al-nadim p. 21}."
  fr: "Calligraphe formé auprès des Barmécides qui codifia les règles des styles d’écriture et rédigea les rouleaux du sultan destinés aux rois lointains {cite:fihrist-ibn-al-nadim p. 21}."
  es: "Calígrafo formado en Barmakid que codificó las reglas de los estilos de pluma y escribió los pergaminos del sultán para reyes lejanos {cite:fihrist-ibn-al-nadim p. 21}."
  ur: "برمکد کا تربیت یافتہ خطاط جس نے قلمی طرز کے اصولوں کو مرتب کیا اور دور دراز کے بادشاہوں کو سلطان کے طومار لکھے۔ 21}۔"
  tr: "Barmakidler döneminde, yazının anlamları ve biçimleri konusunda bilgili bir adam ortaya çıktı; yazının çizimleri ve kuralları hakkında konuştu ve bunları tipo haline getirdi. Sultanlardan uzak bölgelerin krallarına kadar etkili kitapları arşivlerde saklardı. Zanaatın ve kirliliğin sonuna gelmişti, yine de cömertti ve hiçbir şeye layık değildi. {cite:fihrist-ibn-al-nadim s. 21}"
  id: "Seorang pria dari dinasti Barmakid muncul pada masa mereka yang berpengetahuan tentang makna dan bentuk tulisan, sehingga ia berbicara tentang gambar dan aturannya serta membuatnya menjadi berbagai jenis huruf. Ia biasa menulis buku-buku penting dari Sultan hingga raja-raja di wilayah terpencil di dalam arsip. Ia berada di ujung keahlian dan kotoran, namun ia murah hati dan tidak cocok untuk apa pun. {cite:fihrist-ibn-al-nadim p. 21}."
