label: { ar: "الأحول المحرر", en: "al-Ahwal al-Muharrir" }
summary:
  ar: "رجل من صنائع البرامكة ظهر في عصرهم عارفاً بمعاني الخط وأشكاله فتكلم على رسومه وقوانينه وجعله أنواعاً، وكان يحرر الكتب النافذة من السلطان إلى ملوك الأطراف في الطوامير وكان في نهاية الحرفة والوسخ ومع ذلك سمحاً لا يليق على شيء {cite:fihrist-ibn-al-nadim p. 21}."
  en: "Barmakid-trained calligrapher who codified the pen-styles' rules and wrote the sultan's scrolls to distant kings {cite:fihrist-ibn-al-nadim p. 21}."
