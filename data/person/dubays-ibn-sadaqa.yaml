id: person/dubays-ibn-sadaqa
class: person
label:
  ar: دبيس بن صدقة المزيدي
  en: Dubays ibn Sadaqa al-Mazyadidi
  es: "Dubays ibn Sadaqa al-Mazyadidi"
  fr: "Dubays ibn Sadaqa al-Mazyadidi"
  ur: "دبیس ابن صدقہ المزیدیدی"
summary:
  ar: "دبيس بن صدقة بن منصور المزيدي؛ أسر يوم مقتل أبيه سنة 501هـ فأطلقه السلطان محمد لأمه واستحلفه على الطاعة، ثم سرحه السلطان محمود إلى بلده فملك الحلة واجتمع عليه خلق من العرب والأكراد، فثار على المسترشد وجمع له الخليفة العساكر فانهزم عسكره وسبيت حرمه سنة 517هـ، فلحق بالفرنج وأطمعهم في حلب سنة 518هـ فامتنعت عليهم، ثم لحق بالملك طغرل بن السلطان محمد فأغراه بالمسير إلى العراق وضمن له ملكه."
  en: "Dubays ibn Sadaqa ibn Mansur al-Mazyadidi; captured at his father's death in 501 AH, released by Sultan Muhammad to his mother under oath of obedience, then sent home by Sultan Mahmud to rule al-Hilla where Arabs and Kurds rallied to him — he rose against caliph al-Mustarshid, whose mustered army routed him and took his household captive in 517 AH; he fled to the Franks tempting them with Aleppo in 518 (which resisted), then joined Malik Tughril ibn Sultan Muhammad and incited him to march on Iraq, pledging him its kingship."
  es: "Dubays ibn Sadaqa ibn Mansur al-Mazyadidi; capturado tras la muerte de su padre en el año 501 de la Hégira, fue liberado por el sultán Muhammad y entregado a su madre bajo juramento de obediencia. Posteriormente, el sultán Mahmud lo envió a su país para gobernar al-Hilla, donde árabes y kurdos se unieron a él. Se alzó contra el califa al-Mustarshid, cuyo ejército reunido lo derrotó y tomó a su familia como prisionera en el año 517 de la Hégira. Huyó a los francos, tentándolos con Alepo en el año 518 (a la que resistieron), y luego se unió a Malik Tughril ibn Sultan Muhammad, incitándolo a marchar sobre Irak y prometiéndole su reinado."
  fr: "Dubays ibn Sadaqa ibn Mansur al-Mazyadidi; capturé à la mort de son père en 501 AH, libéré par le sultan Muhammad et remis à sa mère sous serment d'obéissance, puis renvoyé chez lui par le sultan Mahmud pour gouverner al-Hilla où Arabes et Kurdes se rallièrent à lui — il se souleva contre le calife al-Mustarshid, dont l'armée rassemblée le mit en déroute et fit prisonnier sa maisonnée en 517 AH; il s'enfuit chez les Francs, les tentant avec Alep en 518 (qui résista), puis rejoignit Malik Tughril ibn Sultan Muhammad et l'incita à marcher sur l'Irak, lui promettant la royauté."
  ur: "دبیس ابن صدقہ ابن منصور المزیدیدی؛ 501 ہجری میں اپنے والد کی وفات پر گرفتار کیا گیا، سلطان محمد نے فرمانبرداری کے حلف کے تحت اپنی والدہ کو رہا کر دیا، پھر سلطان محمود نے الہلہ پر حکومت کرنے کے لیے گھر بھیجا جہاں عرب اور کرد اس کے خلاف جمع ہوئے - وہ خلیفہ المسترشد کے خلاف کھڑا ہوا، جس کی جمع فوج نے اسے شکست دی اور اس کے گھر والوں کو قید کر لیا۔ وہ 518 میں حلب کے ساتھ فرینکوں کی طرف بھاگا ⁦(جس نے مزاحمت کی)⁩، پھر ملک طغرل بن سلطان محمد کے ساتھ شامل ہوا اور اسے عراق پر چڑھائی کرنے پر اکسایا، اور اس سے اس کی بادشاہی کا عہد کیا۔"
  tr: "Dubays bin Sadaqah bin Mansur Al-Muzaidi; babasının öldürüldüğü gün 501 Hicri'de yakalandı. Sultan Muhammed onu annesine teslim etti ve itaat yemini etti. Sultan Mahmud onu memleketine gönderdi, burada Hillah'ı yönetti ve bir grup Arap ve Kürt ona karşı toplandı. El-Mustaşid'e karşı isyan etti ve halifeyi ordularıyla topladı, ancak ordusu yenildi ve karısı 517 Hicri'de esir alındı. Franklara katıldı ve 518 H yılında Halep'te onları ayarttı, ancak onlar reddetti. Daha sonra Kral Tuğril bin Sultan Muhammed'e katıldı; Tuğril bin Sultan Muhammed onu Irak'a yürümeye ikna etti ve hükümdarlığını garanti altına aldı."
  id: "Dubays bin Sadaqah bin Mansur Al-Muzaidi; ia ditangkap pada hari ayahnya dibunuh pada tahun 501 H. Sultan Muhammad menyerahkannya kepada ibunya dan bersumpah taat. Sultan Mahmud kemudian memecatnya kembali ke tanah airnya, di mana ia memerintah Hillah, dan sekelompok Arab serta Kurdi berkumpul melawannya. Ia memberontak melawan Al-Mustashid dan mengumpulkan pasukan khalifah, tetapi pasukannya dikalahkan dan istrinya ditangkap pada tahun 517 H. Ia bergabung dengan bangsa Franka dan menggoda mereka di Aleppo pada tahun 518 H, tetapi mereka menolak. Ia kemudian bergabung dengan Raja Tughril bin Sultan Muhammad, yang menggodanya untuk berbaris ke Irak dan menjamin kekuasaannya."
