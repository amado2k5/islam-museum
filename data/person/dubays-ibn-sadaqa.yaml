label:
  ar: دبيس بن صدقة المزيدي
  en: Dubays ibn Sadaqa al-Mazyadidi
summary:
  ar: "دبيس بن صدقة بن منصور المزيدي؛ أسر يوم مقتل أبيه سنة 501هـ فأطلقه السلطان محمد لأمه واستحلفه على الطاعة، ثم سرحه السلطان محمود إلى بلده فملك الحلة واجتمع عليه خلق من العرب والأكراد، فثار على المسترشد وجمع له الخليفة العساكر فانهزم عسكره وسبيت حرمه سنة 517هـ، فلحق بالفرنج وأطمعهم في حلب سنة 518هـ فامتنعت عليهم، ثم لحق بالملك طغرل بن السلطان محمد فأغراه بالمسير إلى العراق وضمن له ملكه."
  en: "Dubays ibn Sadaqa ibn Mansur al-Mazyadidi; captured at his father's death in 501 AH, released by Sultan Muhammad to his mother under oath of obedience, then sent home by Sultan Mahmud to rule al-Hilla where Arabs and Kurds rallied to him — he rose against caliph al-Mustarshid, whose mustered army routed him and took his household captive in 517 AH; he fled to the Franks tempting them with Aleppo in 518 (which resisted), then joined Malik Tughril ibn Sultan Muhammad and incited him to march on Iraq, pledging him its kingship."
