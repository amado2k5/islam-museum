summary:
  ar: "من بني سهم، هاجر إلى الحبشة؛ يصفه ابن إسحاق برسول رسول الله إلى كسرى. وعند البلاذري: وجّهه عمرو بن العاص بعد فتح الفسطاط إلى عين شمس فثاب على أرضها وصالح أهل قراها على مثل حكم الفسطاط. وعند البلاذري بعثه النبي إلى كسرى في سنة سبع {cite:ansab-al-ashraf p. 531}"
  en: Of Banu Sahm; he emigrated to Abyssinia. Ibn Ishaq describes him as the Messenger of God's envoy to the Chosroes.
  ur: "بنو سہم کے صحابی جو حبشہ ہجرت کیے؛ ابن اسحاق انہیں نبی کا کسرے کے پاس بھیجا گیا قاصد کہتے ہیں۔"
  fr: "Des Banu Sahm ; il émigra en Abyssinie. Ibn Ishaq le décrit comme l'envoyé du Messager de Dieu auprès de Chosroès."
  es: "Pertenecía a Banu Sahm y emigró a Abisinia. Ibn Ishaq lo describe como el enviado de Dios a los Cosroes."
  tr: "Beni Sahm kabilesinden olup Habeşistan'a hicret etmiştir. İbn İshak onu Peygamber'in Hüsrü'ye gönderdiği elçi olarak tanımlar. El-Baladhuri'ye göre, Fustat'ın fethinden sonra Amr ibn el-As onu Ayn Şems'e göndermiş, orada yerleşmiş ve Fustat'takiyle aynı şartlarda köylerin sakinleriyle barış yapmıştır. El-Baladhuri ayrıca Peygamber'in onu Hicretin yedinci yılında Hüsrü'ye gönderdiğini belirtir."
  id: "Berasal dari suku Banu Sahm, ia berhijrah ke Abyssinia. Ibn Ishaq menggambarkannya sebagai utusan Nabi ke Khosrow. Menurut al-Baladhuri, setelah penaklukan Fustat, Amr ibn al-As mengirimnya ke Ain Shams, di mana ia menetap dan berdamai dengan penduduk desa-desa di sana dengan syarat yang sama seperti di Fustat. Al-Baladhuri juga menyatakan bahwa Nabi mengirimnya ke Khosrow pada tahun ketujuh Hijrah."
