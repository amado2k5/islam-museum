summary:
  ar: "من بني سهم، هاجر إلى الحبشة؛ يصفه ابن إسحاق برسول رسول الله إلى كسرى. وعند البلاذري: وجّهه عمرو بن العاص بعد فتح الفسطاط إلى عين شمس فثاب على أرضها وصالح أهل قراها على مثل حكم الفسطاط. وعند البلاذري بعثه النبي إلى كسرى في سنة سبع {cite:ansab-al-ashraf p. 531}"
  en: Of Banu Sahm; he emigrated to Abyssinia. Ibn Ishaq describes him as the Messenger of God's envoy to the Chosroes.
