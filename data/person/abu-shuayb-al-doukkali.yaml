summary:
  ar: "عالم مغربي (1878–1937) من دكالة، فقيه ومحدث لُقب بشيخ الإسلام؛ درس بالأزهر على سليم البشري ومحمد بخيت المطيعي ودرّس به وبالزيتونة، وتولى وزارة العدل والتعليم بالمغرب والرياسة العلمية في الدروس السلطانية لثلاثة سلاطين، ويُعد من رواد الإصلاح السلفي بالمغرب."
  en: "Moroccan scholar (1878–1937) from Doukkala, a jurist and hadith master titled Shaykh al-Islam. He studied at al-Azhar under Salim al-Bishri and Muhammad Bakhit al-Muti'i and taught there and at al-Zaytuna, served as Morocco's minister of justice and of education, and presided over the royal scholarly lessons under three sultans; he is counted a pioneer of Salafi reform in Morocco."
  ur: "مراکشی عالم (1878–1937) جن کا تعلق دکالہ سے تھا، فقیہ و محدث اور «شیخ الاسلام» کے لقب سے موسوم؛ الازہر میں سلیم البشری اور محمد بخیت المطیعی سے پڑھا اور وہیں اور جامع زیتونہ میں پڑھایا، مراکش کے وزیرِ عدل و تعلیم رہے اور تین سلاطین کے دروسِ سلطانیہ کی علمی صدارت کی؛ مراکش میں سلفی اصلاح کے رواد میں شمار ہوتے ہیں۔"
