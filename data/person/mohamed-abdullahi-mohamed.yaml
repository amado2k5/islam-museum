summary:
  ar: "سياسي صومالي (ولد 1962) من مقديشو، المعروف بفرماجو، درس في جامعة بافالو وعمل موظفا في ولاية نيويورك، صار رئيس وزراء الصومال (2010–2011) ثم استقال تحت ضغط اتفاق كمبالا، وأسس حزب تايو، وانتُخب رئيسا للصومال (2017–2022) خلفا لحسن شيخ محمود الذي خلفه بدوره؛ وشهد عهده أزمة تمديد الولاية سنة 2021."
  en: "Somali politician (born 1962) from Mogadishu, known as Farmajo, educated at the University at Buffalo and formerly a New York State official, who became prime minister of Somalia (2010–2011) and resigned under the pressure of the Kampala Accord, founded the Tayo party, and was elected president of Somalia (2017–2022), succeeding Hassan Sheikh Mohamud, who in turn succeeded him; his term saw the 2021 term-extension crisis."
  ur: "صومالی سیاست دان (پیدائش 1962ء) جن کا تعلق مقديشو سے ہے، فرماجو کے نام سے معروف؛ یونیورسٹی ایٹ بفیلو سے تعلیم یافتہ اور نیویارک اسٹیٹ کے سابق اہلکار؛ صومالیہ کے وزیر اعظم بنے (2010ء–2011ء) اور کمپالا معاہدے کے دباؤ پر مستعفی ہوئے، تائیو پارٹی کی بنیاد رکھی، اور صومالیہ کے صدر منتخب ہوئے (2017ء–2022ء) حسن شیخ محمود کے جانشین کے طور پر، اور پھر حسن ہی ان کے جانشین بنے؛ ان کے دور میں 2021ء کا مدتِ توسیع کا بحران آیا۔"
