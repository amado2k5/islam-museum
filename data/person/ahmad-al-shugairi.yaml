summary:
  ar: "إعلامي وكاتب ومقدم برامج سعودي، وُلد في جدة سنة 1973. اشتهر بسلسلة «خواطر» التي عُرضت في أحد عشر موسمًا رمضانيًا (2005–2015)، وسبقها ببرنامج «يلا شباب» سنة 2002، وله مشروعات ثقافية وتطوعية منها مقهى أندلسية الثقافي وموقع ثقافة وشبكة إحسان."
  en: "Saudi media presenter, writer and television host, born in Jeddah in 1973. He is best known for Khawater (Reflections), which ran for eleven Ramadan seasons (2005–2015), after his start on Yalla Shabab in 2002; his cultural and volunteering projects include the Andalusiya cultural café, the Thaqafa website and the Ihsan network."
  ur: "سعودی میڈیا پیش کار، مصنف اور ٹیلی ویژن میزبان، جو 1973 میں جدہ میں پیدا ہوئے۔ وہ «خواطر» سلسلے کے لیے مشہور ہیں جو رمضان کے گیارہ سیزن (2005–2015) چلی، اس سے پہلے 2002 میں «یلا شباب» سے آغاز کیا؛ ان کے ثقافتی و رضاکارانہ منصوبوں میں اندلسیہ ثقافتی کیفے، ثقافہ ویب سائٹ اور احسان نیٹ ورک شامل ہیں۔"
