roles: [companion]
gender: male
summary:
  ar: "شاعر تغلبي مشهور؛ استدركه ابن فتحون في الصحابة نقلاً عن البغوي، وكانت له مع معاوية قصة في سؤاله إياه عن خالد بن الوليد، وكان شاعر أهل الشام وشهد صفين مع معاوية."
  en: "A celebrated Taghlibi poet; Ibn Fathun counts him among the Companions on al-Baghawi's authority. He had a well-known exchange with Mu'awiya over Khalid ibn al-Walid, was the poet of the people of Syria, and witnessed Siffin on Mu'awiya's side."
  ur: "مشہور تغلبی شاعر؛ ابن فتھون اسے بغوی کی سند سے صحابہ میں گنتا ہے؛ معاویہ سے اس کا معروف مکالمہ ہے۔"
  es: "Un célebre poeta taghlibi; Ibn Fathun lo incluye entre los Compañeros, según la autoridad de al-Baghawi. Tuvo un conocido intercambio con Mu'awiya sobre Khalid ibn al-Walid, fue el poeta del pueblo de Siria y presenció el Siffin del lado de Mu'awiya."
  fr: "Poète taghlibi renommé, il est considéré comme un Compagnon par Ibn Fathun, sur l'autorité d'al-Baghawi. Il eut un échange mémorable avec Mu'awiya au sujet de Khalid ibn al-Walid, fut le poète du peuple syrien et assista à la bataille de Siffin aux côtés de Mu'awiya."
  tr: "Ünlü bir Taghlibi şairi; İbn Fathhun, Sahabeler adlı eserinde Al-Baghawi'yi alıntılayarak onu düzeltmiştir. Muawiya ona Halid ibn al-Velid hakkında sorduğunda bir hikayesi vardı. Levant halkının şairiydi ve Muaviye ile birlikte Sifin'e tanıklık etti."
  id: "Seorang penyair Taghlibi terkenal; Ibn Fathhun mengoreksinya dalam Companions dengan mengutip Al-Baghawi. Ia memiliki cerita dengan Muawiya ketika ia bertanya tentang Khalid ibn al-Walid. Ia adalah penyair rakyat Levant dan menyaksikan Siffin bersama Muawiyah."
