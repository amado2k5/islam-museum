summary:
  ar: "عالم مصري (1910–1978) تولى مشيخة الأزهر من 1973 حتى وفاته. درس في الأزهر ثم في السوربون حيث نال الدكتوراه في الفلسفة عن الحارث المحاسبي سنة 1940، وله أكثر من ستين مؤلفا كثير منها في التصوف والفلسفة، وعُرف باستعادته مكانة المشيخة ودفاعه عن تطبيق الشريعة في القانون المصري."
  en: "Egyptian scholar (1910–1978), Grand Imam of al-Azhar from 1973 until his death. Trained at al-Azhar and at the Sorbonne, where his 1940 doctorate treated al-Harith al-Muhasibi, he wrote more than sixty works, many on Sufism and philosophy, and is remembered for restoring al-Azhar's public standing and for arguing that Egypt's civil code should be replaced by sharia."
  ur: "مصری عالم (1910ء–1978ء) جو 1973ء سے اپنی وفات تک الازہر کے شیخ رہے۔ الازہر اور سوربون سے تعلیم پائی (1940ء میں الحارث المحاسبی پر فلسفے میں ڈاکٹریٹ)، ان کی ساٹھ سے زائد تصانیف ہیں جن میں سے کئی تصوف اور فلسفے پر ہیں؛ وہ الازہر کے عوامی مقام کی بحالی اور مصری قانون میں شریعت کے نفاذ کی حمایت کے لیے یاد کیے جاتے ہیں۔"
