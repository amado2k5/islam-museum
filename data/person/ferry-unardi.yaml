summary:
  ar: "فيري أوناردي (وُلد في 16 كانون الثاني 1988 في بادانغ بغرب سومطرة) مهندس برمجيات ورجل أعمال إندونيسي، شارك في تأسيس وكالة السفر عبر الإنترنت ترافيلوكا سنة 2012 وهو رئيسها التنفيذي المؤسس؛ درس علوم الحاسوب والرياضيات في جامعة بيردو، وعمل مهندس برمجيات في مايكروسوفت ثلاث سنوات، ثم ترك ماجستير إدارة الأعمال في كلية هارفارد للأعمال ليبني ترافيلوكا التي غدت أكبر وكالة سفر عبر الإنترنت في جنوب شرق آسيا، ونال وسام ساتيالانكانا ويرا كاريا سنة 2016."
  en: "Ferry Unardi (born 16 January 1988 in Padang, West Sumatra) is an Indonesian software engineer and business executive, co-founder in 2012 of the online travel agency Traveloka and its founding chief executive; he studied computer science and mathematics at Purdue University, worked three years as a software engineer at Microsoft, left a Harvard Business School MBA to build Traveloka into Southeast Asia's largest online travel agency, and received the Satyalancana Wira Karya award in 2016."
  ur: "فیری انارڈی (پیدائش 16 جنوری 1988، پادانگ، مغربی سماٹرا) انڈونیشیائی سافٹ ویئر انجینئر و کاروباری منتظم ہیں، 2012 میں آن لائن ٹریول ایجنسی ٹریولوکا کے شریک بانی اور اس کے بانی چیف ایگزیکٹو ہیں؛ انھوں نے پرڈیو یونیورسٹی سے کمپیوٹر سائنس و ریاضی پڑھی، مائیکروسافٹ میں تین سال سافٹ ویئر انجینئر رہے، پھر ہارورڈ بزنس اسکول کی ایم بی اے چھوڑ کر ٹریولوکا بنائی جو جنوب مشرقی ایشیا کی سب سے بڑی آن لائن ٹریول ایجنسی بنی، اور 2016 میں انھیں ساتیالانچانا ویرا کاریا اعزاز ملا۔"
