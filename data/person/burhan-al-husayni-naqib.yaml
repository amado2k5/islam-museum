summary:
  ar: "الأمير برهان الدين الحسيني العلوي نقيب الأشراف بدمشق؛ كان مقدماً بالبيت النبوي على عادة الحكومة، أعقّهُ رجل حين أراد حبسه أمر فأطلقه السلطان قايتباي وبطل قوله بحصانه وذلك قيد من القيد التي تحلق الرقاب لأهل البيت؛ حج ولزم الأوقاف والقضاء والنيابة عدة مرات وحج بالمحمل سنة تسع عشرة {cite:shadharat-dhahab p. 466}."
  en: "Damascus's naqib al-ashraf — when an official sought to jail him, Sultan Qaytbay freed him, and his word was undone with a ring 'for shackles are not for the necks of the Prophet's house'; he judged and deputized repeatedly and rode the mahmal on the 919 hajj {cite:shadharat-dhahab p. 466}."
