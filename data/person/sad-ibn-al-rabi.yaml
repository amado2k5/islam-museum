id: person/sad-ibn-al-rabi
class: person
label: { ar: "سعد بن الربيع الأنصاري الخزرجي", en: "Sad ibn al-Rabi al-Ansari" , ur: "سعد بن ربیع انصاری", es: "Sad ibn al-Rabi al-Ansari", fr: "Sad ibn al-Rabi al-Ansari"}
summary:
  ar: "صحابي أنصاري خزرجي. بعث النبي زيد بن ثابت يوم أحد يبحث عنه بين القتلى فوجده بآخر رمق وفيه سبعون ضربة ما بين طعنة برمح وضربة بسيف ورمية بسهم. فأبلغه سلام النبي فقال: «وعلى رسول الله السلام، قل له: يا رسول الله أجد ريح الجنة. وقل لقومك الأنصار: لا عذر لكم عند الله إن خُلص إلى رسول الله وفيكم عين تطرف». فاضت روحه من وقته {cite:mubarakpuri-raheeq p.280}."
  en: "An Ansari Companion of the Khazraj. On the day of Uhud the Prophet sent Zayd ibn Thabit to search for him among the slain; he found him at his last breath with seventy blows on him — spear-thrusts, sword-blows and arrow-shots. He gave him the Prophet's greeting, and he said: 'and on the Messenger of God be peace. Tell him: Messenger of God, I catch the breeze of Paradise. And tell your people the Ansar: you have no excuse with God if the Messenger of God is reached while among you there is an eye that still blinks.' His soul flowed out on the spot {cite:mubarakpuri-raheeq p.280}."
  ur: "خزرج کے انصاری صحابی؛ احد میں نبی نے زید بن ثابت کو ان کی تلاش میں بھیجا، جنہوں نے انہیں متعدد زخموں کے ساتھ آخری سانسوں میں پایا؛ انہوں نے انصار کو نبی کی حفاظت کا پیغام دیا۔ {cite:mubarakpuri-raheeq}"
  es: "Un compañero Ansar de Khazraj. El día de Uhud, el Profeta envió a Zayd ibn Thabit a buscarlo entre los muertos; lo encontró en su último aliento con setenta golpes: estocadas de lanza, golpes de espada y flechas. Le dio el saludo del Profeta y dijo: «Y sobre el Mensajero de Dios sea la paz. Dile: ¡Mensajero de Dios, respiro la brisa del Paraíso! Y dile a tu gente, los Ansar: No tenéis excusa ante Dios si el Mensajero de Dios es alcanzado mientras entre vosotros hay un ojo que aún parpadea». Su alma se desvaneció en el acto {cite:mubarakpuri-raheeq p.280}."
  fr: "Un compagnon Ansar des Khazraj. Le jour d'Uhud, le Prophète envoya Zayd ibn Thabit le chercher parmi les morts. Il le trouva à son dernier souffle, criblé de soixante-dix coups: coups de lance, coups d'épée et flèches. Il lui transmit le salut du Prophète et dit: « Que la paix soit sur le Messager de Dieu. Dis-lui: Ô Messager de Dieu, je ressens le souffle du Paradis. Et dis à ton peuple, les Ansar: vous n'avez aucune excuse auprès de Dieu si le Messager de Dieu est atteint alors qu'il reste parmi vous un œil qui cligne encore. » Son âme s'écoula sur-le-champ. (Voir: Mubarakpuri-Raheeq, p. 280)."
  tr: "Yoldaşım bir Ansari Hazracidir. Uhud gününde, Peygamber Zeyd bin Tebit onu ölüler arasında aramak için gönderildi ve son nefesinde, mızrak saplama, kılıç darbesi ve ok dahil olmak üzere yetmiş darbeyle buldu. Peygamber'in selamını ona iletti ve şöyle dedi: \"Ve Allah'ın Elçisi üzerine ona de ki: Ey Allah'ın Elçisi, cennetin kokusunu buluyorum. Ve halkına Ensar'a söyle: Eğer Allah Elçi'ye samimiyse ve aranızda bir nazar varsa, Allah nezdinde hiçbir mazeretin yok.\" Ruhu zamanından vefat etti {atıf:mubarakpuri-raheeq s.280}."
  id: "Sahabatku adalah seorang Khazraji Ansari. Pada hari Uhud, Nabi Zayd ibn Thabit dikirim mencari dia di antara orang mati dan menemukannya dalam nafas terakhirnya, dengan tujuh puluh pukulan termasuk tusukan tombak, tusukan pedang, dan panah. Dia menyampaikan salam Nabi kepadanya dan berkata: \"Dan kepada Rasulullah, katakanlah kepadanya: Wahai Rasulullah, aku menemukan harum Surga. Dan katakanlah kepada umatmu: Kamu tidak punya alasan kepada Allah jika dia tulus kepada Rasulullah sementara di antara kamu ada mata jahat.\" Jiwanya telah meninggal dari zamannya {cite:mubarakpuri-raheeq hlm.280}."
