roles: [scholar]
gender: male
summary:
  ar: "أبو العباس الفرغاني الضرير، حدّث عن أحمد بن إبراهيم الدورقي وأبي سعيد فصيح اللسان وسمع علي بن عبد الملك بن أبي الشوارب وإسحاق بن أبي إسرائيل وأحمد بن مضيع البغوي وأبا همام الوليد بن شجاع وأبا كريب ويعقوب الدورقي وأبا سعيد الأشج وعبد الله بن بشار وخلقًا كثيرًا من أهل العراق والشام ومصر، وحدّث عنه أحمد بن كامل القاضي وغيره {cite:muntazam-ibn-al-jawzi p. 150}."
  en: "Abu'l-'Abbas the blind Farghani, who heard across Iraq, Syria and Egypt — Ibn Abi'l-Shawarib, Abu Hammam, Abu Kurayb, al-Ashajj and many more; the qadi Ahmad ibn Kamil transmitted from him {cite:muntazam-ibn-al-jawzi p. 150}."
  es: "Abu'l-'Abbas el ciego Farghani, que escuchó en Irak, Siria y Egipto: Ibn Abi'l-Shawarib, Abu Hammam, Abu Kurayb, al-Ashajj y muchos más; el cadí Ahmad ibn Kamil transmitió de él {citar:muntazam-ibn-al-jawzi p. 150}."
  fr: "Abu'l-'Abbas l'aveugle Farghani, qui a entendu à travers l'Irak, la Syrie et l'Egypte — Ibn Abi'l-Shawarib, Abu Hammam, Abu Kurayb, al-Ashajj et bien d'autres; le cadi Ahmad ibn Kamil a transmis de lui {cite:muntazam-ibn-al-jawzi p. 150}."
  ur: "ابو العباس نابینا فرغانی، جس نے عراق، شام اور مصر میں سنا — ابن ابی الشواریب، ابو حمام، ابو کریب، الاشج اور بہت کچھ؛ قادی احمد بن کامل نے ان سے نقل کیا ہے {حوالہ:منتظم ابن الجوزی ص۱۲۲۔ 150}۔"
  tr: "Ebu el-Abbas el-Farghani al-Darir, Ahmed bin İbrahim el-Devraki'den, Ebu Said el-Seyseyyid'den etkileyici bir şekilde anlattı ve Ali bin Abd al-Malik ibn Abi al-Shawarib, İshaq ibn Ebi İsrail, Ahmed bin Mudi'al-Baghawi, Ebu Hammam el-Velid bin Şuca', Ebu Kurayb, Yaqub al-Dawraqi, Ebu Sa'id al-Ashaj, Abdullah ibn Bashar ve Irak, Şam ve Mısır'dan birçok kişiden dinledi. Ahmed ibn Kamil el-Kadi ve diğerleri ondan rivayet etti {atıf:Muntazam-ibn-al-Jawzi s. 150}."
  id: "Abu al-Abbas al-Farghani al-Darir, diceritakan dari Ahmad ibn Ibrahim al-Dawraqi, Abu Sa'id al-Saysayyid, fasih, dan didengar dari Ali ibn Abd al-Malik ibn Abi al-Shawarib, Ishaq ibn Abi Isra'il, Ahmad ibn Mudi' al-Baghawi, Abu Hammam al-Walid ibn Shuja', Abu Kurayb, Yaqub al-Dawraqi, Abu Sa'id al-Ashaj, Abdullah ibn Bashar, dan banyak orang dari Irak, Levant, dan Mesir. Ahmad ibn Kamil al-Qadi dan lainnya menceritakan darinya {cite:muntazam-ibn-al-jawzi hlm. 150}."
