summary:
  ar: "زين الدين ابن عياش المكي الزاهد المعمر؛ ولد بدمشق في شهر ربيع الأول سنة اثنتين وسبعين وسبعمائة وأخذ القراءات عن أبيه إفراداً وجمعاً وقرأ عليه ختمة جامعة للقراءات العشرة بما تضمنه كتاب ورقة المهرة في تتمة قراءات الأئمة العشرة تأليف والده وقرأ على الشيخ شمس الدين محمد بن أحمد العسقلاني القراءات العشرة فساوى والده في علو السند، ثم رحل إلى القاهرة سنة إحدى وتسعين وسبعمائة ثم رحل إلى مكة المشرفة واستوطنها وانصب بها لإقراء القراءات بالمسجد الحرام كل يوم وانتفع به عامة الناس وصار رحلة زمانه وتردد إلى المدينة المنورة وجاور بها غير مرة وتصدى بها أيضاً للإقراء وأقام بها سنين ثم عاد إلى مكة واستمر إلى أن مات بها سنة ثلاث وخمسين وثمانمائة {cite:shadharat-dhahab p. 277}."
  en: "Ibn 'Ayyash (b. Damascus Rabi' I 772) — Mecca's daily reciter of the ten qira'at at the Haram, equal to his father in height of isnad through Ibn Hajar's own reading; mujawir of Medina as well for years, 'the destination of his age's travellers'; died at Mecca 853 {cite:shadharat-dhahab p. 277}."
