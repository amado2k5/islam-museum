summary:
  ar: "زين الدين ابن عياش المكي الزاهد المعمر؛ ولد بدمشق في شهر ربيع الأول سنة اثنتين وسبعين وسبعمائة وأخذ القراءات عن أبيه إفراداً وجمعاً وقرأ عليه ختمة جامعة للقراءات العشرة بما تضمنه كتاب ورقة المهرة في تتمة قراءات الأئمة العشرة تأليف والده وقرأ على الشيخ شمس الدين محمد بن أحمد العسقلاني القراءات العشرة فساوى والده في علو السند، ثم رحل إلى القاهرة سنة إحدى وتسعين وسبعمائة ثم رحل إلى مكة المشرفة واستوطنها وانصب بها لإقراء القراءات بالمسجد الحرام كل يوم وانتفع به عامة الناس وصار رحلة زمانه وتردد إلى المدينة المنورة وجاور بها غير مرة وتصدى بها أيضاً للإقراء وأقام بها سنين ثم عاد إلى مكة واستمر إلى أن مات بها سنة ثلاث وخمسين وثمانمائة {cite:shadharat-dhahab p. 277}."
  en: "Ibn 'Ayyash (b. Damascus Rabi' I 772) — Mecca's daily reciter of the ten qira'at at the Haram, equal to his father in height of isnad through Ibn Hajar's own reading; mujawir of Medina as well for years, 'the destination of his age's travellers'; died at Mecca 853 {cite:shadharat-dhahab p. 277}."
  es: "Ibn 'Ayyash (n. Damasco Rabi' I 772) — Recitador diario de las diez qira'at en el Haram de La Meca, igual a su padre en altura de isnad a través de la propia lectura de Ibn Hajar; también fue mujawir de Medina durante años, 'el destino de los viajeros de su época'; murió en La Meca en 853 {cita: shadharat-dhahab p. 277}."
  fr: "Ibn 'Ayyash (né à Damas en Rabi' I 772) — récitant quotidien des dix qira'at à La Mecque au Haram, égal à son père en hauteur d'isnad grâce à la lecture d'Ibn Hajar; mujawir de Médine également pendant des années, « la destination des voyageurs de son époque »; mort à La Mecque en 853 {cite: shadharat-dhahab p. 277}."
  ur: "ابن عیاش ⁦(پیدائش دمشق ربیع اول 772)⁩ - مکہ کا روزانہ دس قیراط حرم میں پڑھنے والا، ابن حجر کی اپنی پڑھائی سے اسناد کی بلندی میں اپنے والد کے برابر؛ مدینہ کے مجاور بھی برسوں سے، 'اپنے دور کے مسافروں کی منزل'؛ مکہ 853 میں وفات پائی۔ 277}۔"
  tr: "Dindar bir münzevi olan Zain al-Din İbn Ayyash al-Makki, 772 Hicri yılında Rabi'al-Awwal ayında Şam'da doğdu. Okumaları babasından hem bireysel hem toplu olarak aldı ve babasının yazdığı 'Waraqah al-Mahra' adlı kitabın On İmam Okumalarının Devamı adlı kitabında yer alan on okumanın kapsamlı bir tamamlanmasını ondan, okudu. On okumayı Şeyh S'in yanında okudu Hams al-Din Muhammed bin Ahmed al-Askelani, babasını rivayet zincirinin zirvesiyle eşitledi. Daha sonra 791 Hicri yılında Kahire'ye gitti, ardından Mekke'ye giderek orada yerleşti ve her gün Mescid'i okuyarak halkın yararına oldu. Zamanının bir gezgini oldu, Medine'ye sık sık gitti, orada birden fazla kez yaşadı ve yıllarca orada kaldı, sonra Mekke'ye döndü ve 853 Hicri yılında vefat edene kadar orada kaldı. {cit:) Shadharat-Dhahab, s. 277}."
  id: "Zain al-Din Ibn Ayyash al-Makki, seorang pertapa yang taat, lahir di Damaskus pada bulan Rabi' al-Awwal tahun 772 H. Ia menerima bacaan dari ayahnya, baik secara individu maupun kolektif, dan membacakan dari ayahnya penyelesaian lengkap sepuluh bacaan tersebut, sebagaimana tercantum dalam buku 'Waraqah al-Mahra' dalam Kelanjutan Bacaan Sepuluh Imam, yang ditulis oleh ayahnya. Ia membacakan sepuluh bacaan tersebut di bawah Sheikh Shamh s al-Din Muhammad ibn Ahmad al-Asqalani, menyamakan ayahnya dengan puncak rantai narator. Ia kemudian pergi ke Kairo pada tahun 791 H, kemudian ke Mekah, menetap di sana, dan setiap hari mendedikasikan dirinya untuk membaca Masjid Suci, demi manfaat bagi masyarakat umum. Ia menjadi pengembara pada zamannya, sering mengunjungi Madinah, tinggal di sana lebih dari sekali, dan tinggal di sana selama bertahun-tahun, lalu kembali ke Mekah, di mana ia menetap hingga wafat pada tahun 853 H. {cite::Shadharat-Dhahab, hlm. 277}."
