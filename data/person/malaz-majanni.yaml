  ar: "منتج إعلامي مسلم أسترالي مقيم في سيدني، مؤسس شبكة ون باث (OnePath Network) ورئيسها التنفيذي، وهي شبكة إعلامية إسلامية غير ربحية تأسست في مارس 2014 لتقديم الإسلام بصورة إيجابية في الإعلام العام. قاد الشبكة منذ تأسيسها، وبلغت قناتها على يوتيوب نحو مليوني مشترك في 2026."
