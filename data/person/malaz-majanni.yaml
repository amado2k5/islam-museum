summary:
  ar: "منتج إعلامي مسلم أسترالي مقيم في سيدني، مؤسس شبكة ون باث (OnePath Network) ورئيسها التنفيذي، وهي شبكة إعلامية إسلامية غير ربحية تأسست في مارس 2014 لتقديم الإسلام بصورة إيجابية في الإعلام العام. قاد الشبكة منذ تأسيسها، وبلغت قناتها على يوتيوب نحو مليوني مشترك في 2026."
  en: "An Australian Muslim media producer based in Sydney, founder and chief executive of OnePath Network, a not-for-profit Islamic media network established in March 2014 to present Islam positively in mainstream media. He has led the network since its founding, and its YouTube channel had about two million subscribers in 2026."
  ur: "سڈنی میں مقیم آسٹریلوی مسلمان میڈیا پروڈیوسر، ون پاتھ نیٹ ورک (OnePath Network) کے بانی اور چیف ایگزیکٹو؛ یہ ایک غیر منافع بخش اسلامی میڈیا نیٹ ورک ہے جو مارچ 2014 میں اسلام کو مرکزی میڈیا میں مثبت انداز میں پیش کرنے کے لیے قائم ہوا۔ وہ اس کے قیام سے اس کی قیادت کر رہے ہیں اور اس کے یوٹیوب چینل کے سبسکرائبرز 2026 میں تقریباً بیس لاکھ تھے۔"
  es: "Productor de medios musulmán australiano radicado en Sídney, fundador y director ejecutivo de OnePath Network, una red de medios islámicos sin fines de lucro creada en marzo de 2014 para presentar el islam de manera positiva en los medios de comunicación convencionales. Ha liderado la red desde su fundación, y su canal de YouTube contaba con aproximadamente dos millones de suscriptores en 2026."
  fr: "Producteur de médias musulman australien basé à Sydney, il est le fondateur et directeur général de OnePath Network, un réseau médiatique islamique à but non lucratif créé en mars 2014 afin de présenter l'islam de manière positive dans les médias grand public. Il dirige le réseau depuis sa création, et sa chaîne YouTube comptait environ deux millions d'abonnés en 2026."
  tr: "Sydney merkezli Müslüman Avustralyalı medya yapımcısı, Mart 2014'te İslam'ı kamu medyasında olumlu şekilde sunmak amacıyla kurulan kar amacı gütmeyen bir İslami medya ağı olan OnePath Network'ün kurucusu ve CEO'su. Kuruluşundan bu yana ağı yönetiyor ve YouTube kanalı 2026 yılına kadar neredeyse iki milyon aboneye ulaştı."
  id: "Seorang produser media Muslim Australia yang berbasis di Sydney, pendiri dan CEO OnePath Network, sebuah jaringan media Islam nirlaba yang didirikan pada Maret 2014 untuk menampilkan Islam secara positif di media publik. Ia telah memimpin jaringan tersebut sejak didirikan, dan saluran YouTube-nya mencapai hampir dua juta pelanggan pada tahun 2026."
