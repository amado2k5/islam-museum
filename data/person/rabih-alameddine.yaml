summary:
  ar: "روائي ورسام لبناني أمريكي، وُلد في عمّان سنة 1959 لأبوين درزيين لبنانيين ونشأ في الكويت ولبنان. تدرّب مهندسًا، وهو مؤلف «كوليدز» و«الحكواتي» و«امرأة غير ضرورية» و«ملاك التاريخ»؛ فازت روايته «الطرف الخطأ من التلسكوب» بجائزة بن/فوكنر، وفازت «القصة الحقيقية الحقيقية لرجا الساذج (ووالدته)» بالجائزة الوطنية للكتاب للرواية سنة 2025."
  en: "Lebanese-American novelist and painter, born in Amman in 1959 to Lebanese Druze parents and raised in Kuwait and Lebanon. Trained as an engineer, he is the author of Koolaids, The Hakawati, An Unnecessary Woman and The Angel of History; The Wrong End of the Telescope won the PEN/Faulkner Award, and The True True Story of Raja the Gullible (and His Mother) won the National Book Award for Fiction in 2025."
  ur: "لبنانی نژاد امریکی ناول نگار اور مصور، 1959 میں عمان میں لبنانی دروز والدین کے ہاں پیدا ہوئے اور کویت و لبنان میں پلے بڑھے۔ انجینئر کی تربیت پائی؛ ان کے ناولوں میں «کولیڈز»، «الحکاواتی»، «این ان نیسیسری وومن» اور «دی اینجل آف ہسٹری» شامل ہیں؛ «دی رانگ اینڈ آف دی ٹیلی سکوپ» نے پین/فاکنر ایوارڈ اور «دی ٹرو ٹرو اسٹوری آف راجا دی گلیبل» نے 2025 میں نیشنل بک ایوارڈ جیتا۔"
