summary:
  ar: "عالم بوسني من مسؤولي المشيخة الإسلامية في البوسنة والهرسك. كان مفتي سراييفو ومرشحًا لمنصب رئيس العلماء في انتخابات 2012، ثم نائبًا لرئيس العلماء (نائب الرئيس) من 2012 إلى 2019، ومثّل المشيخة في المجلس المشترك بين الأديان في البوسنة والهرسك."
  en: "Bosnian scholar and official of the Islamic Community in Bosnia and Herzegovina. Mufti of Sarajevo and a candidate for Reis-ul-ulema in the 2012 election, he served as deputy Reis-ul-ulema (naibu-reis) from 2012 to 2019 and represented the Community on the Interreligious Council of Bosnia and Herzegovina."
  ur: "بوسنیائی عالم اور بوسنیا و ہرزیگووینا کی اسلامی کمیونٹی کے عہدیدار۔ وہ سرائیوو کے مفتی رہے اور 2012ء کے انتخاب میں رئیس العلماء کے امیدوار تھے، پھر 2012ء سے 2019ء تک نائب رئیس العلماء (نائب الرئیس) رہے اور بین المذاہب کونسل میں کمیونٹی کی نمائندگی کی۔"
