summary:
  en: "An early Muhajir Companion and Badri veteran from Banu al-Muttalib, maternal cousin of Abu Bakr who provided for him; drawn into repeating the slander against Aisha, he received the prescribed punishment; when Abu Bakr swore to cut his financial aid, God revealed Surat al-Nur 24:22 urging forgiveness, after which Abu Bakr restored and increased his stipend."
  ar: "صحابي بدري ومهاجري من بني المطلب بن عبد مناف؛ كان فقيراً قريباً لأبي بكر ينفق عليه لقرابته وفقره، فوقع في خوض الإفك وجُلد الحد، فحلف أبو بكر ألا ينفق عليه فنزل قوله تعالى: «ولا يأتل أولو الفضل منكم والسعة أن يؤتوا أولي القربى... ألا تحبون أن يغفر الله لكم»، فقال أبو بكر: بلى والله إني لأحب أن يغفر الله لي، فرد عليه نفقته."
