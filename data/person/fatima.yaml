summary:
  en: "The youngest daughter of the Prophet and Khadija and wife of Ali ibn Abi Talib; mother of Hasan and Husayn and a central figure of Ahl al-Bayt in both Sunni and Shia tradition."
  ar: "صغرى بنات النبي وخديجة وزوجة علي بن أبي طالب، وهي أم الحسن والحسين وشخصية محورية في أهل البيت عند السنة والشيعة معًا. ومن بيتها في الصحيح: علّق عليّ على بابها ستراً موشياً فلم يدخل النبي حتى أشار «ما لي وللدنيا» فأرسلت به إلى أهل بيت بهم حاجة {cite:sahih-al-bukhari 2613}، وفي مسلم أدخلها النبي تحت المرط المرحل مع علي والحسنين وتلا آية التطهير {cite:sahih-muslim 2424}، وقال «إنما ابنتي بضعة مني يريني ما رابها ويؤذيني ما آذاها» {cite:sahih-muslim 2449}."
