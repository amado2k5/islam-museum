    summary: { en: "Sunni tradition reveres Fatima as the foremost woman of the Prophet's household, the wife of Ali and mother of Hasan and Husayn, holding her among the most virtuous women.", ar: "تُجِلّها السنة سيدةَ نساء بيت النبوة، وتعدّها من أفضل نساء الأمة." }
