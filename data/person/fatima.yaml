  - tradition: academic
    id: academic
    summary: { en: "Historians note that early sources record few independent details of her life, and that the disputed events after the Prophet's death — the succession and the estate of Fadak — are reported through later, partisan accounts.", ar: "يلاحظ المؤرخون قلة ما حفظته المصادر المبكرة من تفاصيل مستقلة عن حياتها، وأن أخبار ما بعد وفاة النبي — الخلافة وفدك — جاءت عبر روايات متأخرة متخاصمة." }
