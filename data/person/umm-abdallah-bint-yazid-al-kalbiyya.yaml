id: person/umm-abdallah-bint-yazid-al-kalbiyya
class: person
label: { ar: "أم عبد الله بنت يزيد الكلبية", en: "Umm Abdallah bint Yazid al-Kalbiyya", es: "Umm Abdallah bint Yazid al-Kalbiyya", fr: "Umm Abdallah bint Yazid al-Kalbiyya", ur: "ام عبداللہ بنت یزید الکلبیہ" }
summary:
  ar: "أم عبد الله بنت يزيد الكلبية امرأة حبيب بن مسلمة الفهري؛ عند البلاذري: قالت له ليلة بيات الروم بقاليقلا «أين موعدك؟» قال «سرادق الطاغية أو الجنة» فلما انتهى إلى السرادق وجدها عنده."
  en: "Umm Abdallah bint Yazid al-Kalbiyya, wife of Habib ibn Maslama al-Fihri; in al-Baladhuri: on the night of the Muslims' night-attack on the Romans at Qaliqala she asked him 'where is your tryst?' — he answered 'the tyrant's pavilion or Paradise', and when he reached the pavilion he found her there."
  es: "Umm Abdallah bint Yazid al-Kalbiyya, esposa de Habib ibn Maslama al-Fihri; en al-Baladhuri: en la noche del ataque nocturno de los musulmanes contra los romanos en Qaliqala, ella le preguntó '¿dónde está tu cita?', a lo que él respondió 'el pabellón del tirano o el Paraíso', y cuando llegó al pabellón la encontró allí."
  fr: "Umm Abdallah bint Yazid al-Kalbiyya, épouse de Habib ibn Maslama al-Fihri; dans al-Baladhuri: la nuit de l'attaque nocturne des musulmans contre les Romains à Qaliqala, elle lui demanda « où est ton rendez-vous ? » — il répondit « le pavillon du tyran ou le Paradis », et lorsqu'il atteignit le pavillon, il la trouva là."
  ur: "ام عبد اللہ بنت یزید الکلبیہ، حبیب بن مسلمہ الفہری کی بیوی؛ البلادوری میں ہے: قلیقلہ میں رومیوں پر مسلمانوں کے حملے کی رات اس نے اس سے پوچھا 'تمہاری کوشش کہاں ہے؟' - اس نے جواب دیا 'ظالم کا برآمدہ یا جنت'، اور جب وہ برآمدے میں پہنچا تو اسے وہاں پایا۔"
  tr: "Habib bin Maslamah el-Fihri'nin eşi um Abdullah bint Yazid el-Kalbiyya; el-Baladhuri'ye göre: Roma gecesi Kaliqla'da ona \"Randevun nerede?\" diye sormuştur. Çadıra ulaştığında onu yanında bulmuştur."
  id: "um Abdullah bint Yazid al-Kalbiyyah, istri Habib ibn Maslamah al-Fihri; menurut al-Baladhuri: Pada malam malam Romawi di Qaliqla, dia bertanya kepadanya, \"Di mana janjimu?\" Dia berkata, \"Tenda atau surga tiran.\" Ketika dia sampai di tenda, dia menemukannya bersamanya."
