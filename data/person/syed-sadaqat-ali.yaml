summary:
  ar: "قارئ قرآن باكستاني ومدرّس للتلاوة، تتلمذ على القارئ المصري عبد الباسط عبد الصمد. اشتهر ببرنامجه التعليمي «القرآن» على تلفزيون باكستان منذ 1992 لتعليم الأطفال القراءة والنطق، وهو من القراء الرسميين في الجلسات الافتتاحية لمجلس البنجاب الإقليمي، وحاصل على هلال الامتياز (2020) وستارة الامتياز (2015) وفخر الأداء."
  en: "Pakistani Qur'an reciter and teacher of recitation who studied under the Egyptian reciter Abdul Basit 'Abd us-Samad. He is known for AlQuran, the PTV programme teaching children reading and pronunciation since 1992; he is an official reader at the inaugural sessions of the Punjab Provincial Assembly and holds the Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) and Pride of Performance."
  ur: "پاکستانی قاریِ قرآن اور قراءت کے استاد، جنھوں نے مصری قاری عبد الباسط عبد الصمد سے تعلیم حاصل کی۔ وہ 1992ء سے پی ٹی وی کے تعليمی پروگرام «القرآن» کے ذریعے بچوں کو قراءت و تلفظ سکھانے کے لیے مشہور ہیں؛ وہ پنجاب اسمبلی کے افتتاحی اجلاسوں کے سرکاری قاری ہیں اور ہلالِ امتیاز ⁦(2020ء)⁩، ستارۂ امتیاز ⁦(2015ء)⁩ اور تمغائے حسنِ کارکردگی کے حامل ہیں۔"
  es: "Recitador y profesor pakistaní del Corán, formado con el recitador egipcio Abdul Basit 'Abd us-Samad. Es conocido por AlQuran, el programa de PTV que enseña a los niños a leer y pronunciar el Corán desde 1992; es lector oficial en las sesiones inaugurales de la Asamblea Provincial de Punjab y ostenta los títulos de Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) y Orgullo de Desempeño."
  fr: "Récitation du Coran et professeur de récitation pakistanais, il a étudié auprès du récitateur égyptien Abdul Basit 'Abd us-Samad. Il est connu pour AlQuran, l'émission de PTV qui enseigne la lecture et la prononciation aux enfants depuis 1992; il est lecteur officiel lors des séances inaugurales de l'Assemblée provinciale du Pendjab et a reçu les distinctions Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) et Pride of Performance."
  tr: "Pakistanlı bir Kur'an okumacı ve okuma öğretmeni olan Sèm, Mısırlı okunucu Abdul Basit Abdul Samad'ın yanında eğitim aldı. 1992'den beri Pakistan Televizyonu'nda çocuklara okuma ve telaffuz öğretmek için yayımlanan 'Kur'an' adlı eğitim programıyla ünlendi. Pencap Bölge Konseyi'nin açılış oturumlarında resmi bir okunucudur ve Hilal al-Imtiaz (2020), Sitara-e al-Imtiaz (2015) ve Pride of Performance ödüllerini almıştır."
  id: "Sebagai pembaca Al-Qur'an dan guru pembacaan Al-Qur'an Pakistan, ia belajar di bawah bimbingan pembaca Mesir Abdul Basit Abdul Samad. Ia menjadi terkenal lewat program pendidikannya 'Al-Quran' di Televisi Pakistan sejak 1992 untuk mengajarkan anak-anak membaca dan melafalkan. Ia adalah pembaca resmi pada sesi pembukaan Dewan Regional Punjab, dan telah menerima Hilal al-Imtiaz (2020), Sitara-e al-Imtiaz (2015), dan Pride of Performance."
