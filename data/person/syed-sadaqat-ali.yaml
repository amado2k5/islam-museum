summary:
  ar: "قارئ قرآن باكستاني ومدرّس للتلاوة، تتلمذ على القارئ المصري عبد الباسط عبد الصمد. اشتهر ببرنامجه التعليمي «القرآن» على تلفزيون باكستان منذ 1992 لتعليم الأطفال القراءة والنطق، وهو من القراء الرسميين في الجلسات الافتتاحية لمجلس البنجاب الإقليمي، وحاصل على هلال الامتياز (2020) وستارة الامتياز (2015) وفخر الأداء."
  en: "Pakistani Qur'an reciter and teacher of recitation who studied under the Egyptian reciter Abdul Basit 'Abd us-Samad. He is known for AlQuran, the PTV programme teaching children reading and pronunciation since 1992; he is an official reader at the inaugural sessions of the Punjab Provincial Assembly and holds the Hilal-i-Imtiaz (2020), Sitara-i-Imtiaz (2015) and Pride of Performance."
  ur: "پاکستانی قاریِ قرآن اور قراءت کے استاد، جنھوں نے مصری قاری عبد الباسط عبد الصمد سے تعلیم حاصل کی۔ وہ 1992ء سے پی ٹی وی کے تعليمی پروگرام «القرآن» کے ذریعے بچوں کو قراءت و تلفظ سکھانے کے لیے مشہور ہیں؛ وہ پنجاب اسمبلی کے افتتاحی اجلاسوں کے سرکاری قاری ہیں اور ہلالِ امتیاز (2020ء)، ستارۂ امتیاز (2015ء) اور تمغائے حسنِ کارکردگی کے حامل ہیں۔"
