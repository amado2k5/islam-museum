summary:
  ar: "أبو شعيب صالح بن زياد السوسي الرقي، راوي قراءة أبي عمرو بن العلاء عن اليزيدي؛ توفي في أول سنة 261هـ وقد قارب التسعين، ووصفه ابن الجزري بأنه مقرئ ضابط محرر ثقة، من أجل أصحاب اليزيدي وأكبرهم {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  en: "Abu Shu'ayb Salih ibn Ziyad al-Susi al-Raqqi, transmitter of Abu 'Amr ibn al-'Ala''s reading through al-Yazidi; he died at the start of 261 AH, close to ninety years old, and Ibn al-Jazari calls him an exact and careful reader, reliable, and among the most distinguished and senior companions of al-Yazidi {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  fr: "Abu Shu'ayb Salih ibn Ziyad al-Susi al-Raqqi, transmetteur de la lecture d'Abu 'Amr ibn al-'Ala' par al-Yazidi ; il mourut au début de 261 H, à près de quatre-vingt-dix ans. Ibn al-Jazari le décrit comme un lecteur exact, soigneux, digne de confiance et l'un des compagnons les plus éminents et les plus anciens d'al-Yazidi {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  ur: "ابو شعیب صالح بن زیاد سوسی رقی، یزیدی کے واسطے سے ابو عمرو بن العلاء کی قراءت کے راوی؛ 261ھ کے آغاز میں تقریباً نوے برس کی عمر میں فوت ہوئے؛ ابن الجزری انہیں ضابط، محرر اور ثقہ قاری اور یزیدی کے جلیل ترین و بڑے ساتھیوں میں شمار کرتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  es: "Abu Shu'ayb Salih ibn Ziyad al-Susi al-Raqqi, transmisor de la lectura de Abu 'Amr ibn al-'Ala a través de al-Yazidi; murió a principios del 261 AH, cerca de los noventa años, e Ibn al-Jazari lo llama un lector exacto y cuidadoso, confiable y uno de los compañeros más distinguidos y veteranos de al-Yazidi {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  tr: "Ebu Şuayb Salih bin Ziyad el-Susi el-Rakka, Ebu Amr bin el-Ala'nın El-Yazidi'den rivayet ettiği kıraatinin ravisidir; Hicri 261 yılının başlarında, doksan yaşına yaklaşmışken vefat etmiştir. İbn el-Ceziri onu güvenilir, doğru ve dürüst bir kıraatçi, El-Yazidi'nin en önemli ve en büyük sahabelerinden biri olarak tanımlamıştır. {cite:nashr-dahman-damascus-1345-v1 s. 144}"
  id: "Abu Shuaib Salih bin Ziyad Al-Susi Al-Raqqi, perawi bacaan Abu Amr bin Al-Ala atas otoritas Al-Yazidi; beliau wafat pada awal tahun 261 H, pada usia hampir sembilan puluh tahun. Ibn Al-Jazari menggambarkannya sebagai seorang perawi yang dapat diandalkan, tepat, dan terpercaya, salah satu sahabat Al-Yazidi yang paling penting dan terhebat. {cite:nashr-dahman-damascus-1345-v1 p. 144}."
