id: person/al-hakam-ibn-farrukh
class: person
label: { ar: "أبو بكار الحكم بن فروخ", en: "Abu Bakkar al-Hakam ibn Farrukh", fr: "Abu Bakkar al-Hakam ibn Farrukh", es: "Abu Bakkar al-Hakam ibn Farrukh", ur: "ابوبکر الحکم ابن فرخ" }
summary:
  ar: "أبو بكار الحكم بن فروخ الغزال البصري، من رواة الحديث. روى عن أبي المليح بن أسامة وعكرمة، وروى عنه شعبة ومحمد بن سوار وحماد بن زيد ومسلم بن إبراهيم. قال النسائي إنه ثقة، وذكره ابن حبان في الثقات، وقال أحمد إنه صالح الحديث. ولم تذكر الموسوعة تاريخ ولادته ووفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
  en: "Abu Bakkar al-Hakam ibn Farrukh al-Ghazzal of Basra, a transmitter of hadith. He narrated from Abu al-Malih ibn Usama and Ikrima; Shuba, Muhammad ibn Sawwar, Hammad ibn Zayd and Muslim ibn Ibrahim narrated from him. al-Nasa'i called him trustworthy, Ibn Hibban listed him among the trustworthy, and Ahmad called him sound in hadith. The source gives no dates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
  fr: "Abu Bakkar al-Hakam ibn Farrukh al-Ghazzal de Bassora, transmetteur de hadith. Il transmit d’Abu al-Malih ibn Usama et d’Ikrima ; Shu’ba, Muhammad ibn Sawwar, Hammad ibn Zayd et Muslim ibn Ibrahim transmirent de lui. Al-Nasa’i le qualifia de digne de confiance, Ibn Hibban le compta parmi les transmetteurs dignes de confiance et Ahmad le dit solide en hadith. La source ne donne pas de dates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
  es: "Abu Bakkar al-Hakam ibn Farrukh al-Ghazzal de Basora, transmisor de hadices. Narró de Abu al-Malih ibn Usama e Ikrima; Shuba, Muhammad ibn Sawwar, Hammad ibn Zayd y Muslim ibn Ibrahim narraron de él. al-Nasa'i lo llamó digno de confianza, Ibn Hibban lo incluyó entre los dignos de confianza y Ahmad lo llamó sano en un hadiz. La fuente no da fechas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
  ur: "ابوبکر الحکم ابن فرخ الغزل بصرہ، حدیث کا ایک ٹرانسمیٹر۔ انہوں نے ابو ملیح بن اسامہ اور عکرمہ سے روایت کی ہے۔ شعبہ، محمد بن سوار، حماد بن زید اور مسلم بن ابراہیم نے ان سے روایت کی ہے۔ نسائی نے اسے ثقہ کہا، ابن حبان نے اسے ثقہ قرار دیا اور احمد نے اسے حدیث میں صحیح کہا۔ ماخذ کوئی تاریخ نہیں دیتا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 10351}"
  tr: "Ebu Bakkar el-Hakam ibn Furukh al-Gazal el-Basri hadis rivayetçisiydi. Ebu el-Malih bin Usama ve İkrimah'tan rivayet etti; Şube, Muhammed ibn Suwar, Hammad ibn Zayd ve Müslüman ibn İbrahim ondan rivayet etti. El-Nasa'i onun güvenilir olduğunu söyledi, İbn Hibban onu güvenilir rivayetçiler arasında saydı ve Ahmed onun hadislerde sağlam olduğunu söyledi. Ansiklopedi doğum veya ölüm tarihlerinden bahsetmedi. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.10351}"
  id: "Abu Bakkar al-Hakam ibn Furukh al-Ghazal al-Basri adalah seorang narator hadits. Ia menceritakan dari Abu al-Malih ibn Usama dan Ikrimah, dan Shu'bah, Muhammad ibn Suwar, Hammad ibn Zayd, dan Muslim ibn Ibrahim menceritakan darinya. Al-Nasa'i mengatakan ia dapat dipercaya, dan Ibn Hibban menyebutnya di antara para narator yang dapat dipercaya, dan Ahmad mengatakan ia mahir dalam hadis. Ensiklopedia tidak menyebutkan tanggal lahir atau kematiannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10351}"
