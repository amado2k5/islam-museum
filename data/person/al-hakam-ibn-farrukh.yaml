label: { ar: "أبو بكار الحكم بن فروخ", en: "Abu Bakkar al-Hakam ibn Farrukh" }
summary:
  ar: "أبو بكار الحكم بن فروخ الغزال البصري، من رواة الحديث. روى عن أبي المليح بن أسامة وعكرمة، وروى عنه شعبة ومحمد بن سوار وحماد بن زيد ومسلم بن إبراهيم. قال النسائي إنه ثقة، وذكره ابن حبان في الثقات، وقال أحمد إنه صالح الحديث. ولم تذكر الموسوعة تاريخ ولادته ووفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
  en: "Abu Bakkar al-Hakam ibn Farrukh al-Ghazzal of Basra, a transmitter of hadith. He narrated from Abu al-Malih ibn Usama and Ikrima; Shuba, Muhammad ibn Sawwar, Hammad ibn Zayd and Muslim ibn Ibrahim narrated from him. al-Nasa'i called him trustworthy, Ibn Hibban listed him among the trustworthy, and Ahmad called him sound in hadith. The source gives no dates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10351}"
