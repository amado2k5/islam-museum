  ar: "أبو القاسم عمر بن الحسين بن عبد الله الخرقي، فقيه الحنابلة صاحب المختصر في الفقه على مذهب أحمد بن حنبل الذي صار من أصلين في المذهب، حدّث عن جماعة وروى عنه أبو بكر الشافعي وابن الصواف وعبد العزيز بن جعفر وكان خليفة المروزي؛ توفي يوم الفطر ودفن بباب حرب عند قبر الإمام أحمد بن حنبل {cite:muntazam-ibn-al-jawzi p. 207}."
