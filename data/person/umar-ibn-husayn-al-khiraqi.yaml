label:
  ar: "عمر بن الحسين الخرقي"
  en: "Umar ibn Husayn al-Khiraqi"
  es: "Umar ibn Husayn al-Khiraqi"
  fr: "Umar ibn Husayn al-Khiraqi"
  ur: "عمر بن حسین الخیراقی"
roles: [jurist, scholar]
gender: male
summary:
  ar: "أبو القاسم عمر بن الحسين بن عبد الله الخرقي، فقيه الحنابلة صاحب المختصر في الفقه على مذهب أحمد بن حنبل الذي صار من أصلين في المذهب، حدّث عن جماعة وروى عنه أبو بكر الشافعي وابن الصواف وعبد العزيز بن جعفر وكان خليفة المروزي؛ توفي يوم الفطر ودفن بباب حرب عند قبر الإمام أحمد بن حنبل {cite:muntazam-ibn-al-jawzi p. 207}."
  en: "Abu'l-Qasim al-Khiraqi, the Hanbali jurist whose Mukhtasar became one of the school's two foundational manuals; he died on the day of Fitr and was buried at Bab Harb beside Imam Ahmad's grave {cite:muntazam-ibn-al-jawzi p. 207}."
  es: "Abu'l-Qasim al-Khiraqi, el jurista hanbalí cuyo Mukhtasar se convirtió en uno de los dos manuales fundamentales de la escuela; murió el día de Fitr y fue enterrado en Bab Harb junto a la tumba del Imam Ahmad {cite:muntazam-ibn-al-jawzi p. 207}."
  fr: "Abu'l-Qasim al-Khiraqi, le juriste hanbalite dont le Mukhtasar est devenu l'un des deux manuels fondateurs de l'école; il est mort le jour de Fitr et a été enterré à Bab Harb à côté de la tombe de l'imam Ahmad {cite:muntazam-ibn-al-jawzi p. 207}."
  ur: "ابو القاسم الخیراقی، حنبلی فقیہ جن کا مختار مکتب کے دو بنیادی دستورالعمل میں سے ایک ہے۔ آپ کا انتقال فطر کے دن ہوا اور باب حرب میں امام احمد کی قبر کے پاس دفن کیا گیا۔ 207}۔"
  tr: "Hanbali hukukçusu ve Ahmed bin Hanbal mezhebine göre kısaltılmış hukuk eserinin yazarı olan Ebu el-Kasım Ömer bin Hüseyin bin Abdullah el-Harqi, bir gruptan anlatılmış ve Ebu Bekir el-Şafii, İbn el-Savvaf ve Abdülaziz ibn Ca'far tarafından kendisinden anlatılmıştır. O, el-Mervezi'nin halefiydi. Bayram günü öldü ve İmam Ahmed bin Hanbel'in mezarının yakınında Bab Harb'a defnedildi {atıf:Muntazam-ibn-al-Jawzi s. 207}."
  id: "Abu al-Qasim Umar ibn al-Husayn ibn Abdullah al-Kharqi, seorang ahli hukum Hanbali dan penulis ringkasan fiksi menurut mazhab Ahmad ibn Hanbal, yang menjadi salah satu dari dua aliran utama pemikiran, dinarasikan dari sebuah kelompok dan diceritakan darinya oleh Abu Bakr al-Shafi'i, Ibn al-Sawwaf, dan Abd al-Aziz ibn Ja'far. Ia adalah penerus al-Marwazi. Ia meninggal pada hari Idul Fitri dan dimakamkan di Bab Harb dekat makam Imam Ahmad ibn Hanbal {cite:muntazam-ibn-al-jawzi hlm. 207}."
