summary:
  ar: "صاحب كورة تدمير سميت به واسم قصبتها أربولة؛ قاتل طارقاً مضحياً فأفنى السيف أكثر أهلها فلجأ إلى أربولة في يسير من أصحابه، فأمر النساء بنشر الشعور وحمل القصب والظهور على السور في زي القتال متشبهات بالرجال، ونكّر زيه فنزل إلى المسلمين بأمان على أنه رسول فصالحهم على أهل بلده ثم على نفسه وتوثق منهم، فلما تم له ما أراد عرفهم بنفسه وأخذهم بالوفاء بعهده فسلمت كورة تدمير كلها صلحاً {cite:nafh-tib-maqqari p. 300}."
  en: "The Gothic lord of Tudmir — the district named for him, whose capital was Orihuela; when his people were destroyed he held out, dressed his women as soldiers on the wall, came down disguised as his own envoy and bound the Muslims to a treaty that saved the whole kura {cite:nafh-tib-maqqari p. 300}."
