id: person/al-muafa-ibn-al-haddus
class: person
label: { ar: "أبو محمد المعافى ابن الحدوس الموصلي", en: "Abu Muhammad al-Mu'afa ibn al-Haddus al-Mawsili", fr: "Abu Muhammad al-Mu'afa ibn al-Haddus al-Mawsili", es: "Abu Muhammad al-Mu'afa ibn al-Haddus al-Mawsili", ur: "ابو محمد المضعیفہ ابن الحدوس الموسیلی" }
summary:
  ar: "أبو محمد المعافى بن إسماعيل بن الحسين الموصلي ويعرف أيضاً بابن الحدوس؛ الشافعي، كان إماماً فقيهاً بارعاً جيداً صالحاً أديباً، ولد بالموصل وتفقه بها على ابن مهاجر ثم على القاضي الفخر السهروردي ثم على العماد بن يونس، وسمع وحدث وأفتى وصنف وناظر؛ من تصانيفه كتاب الكامل في الفقه كتاب مطول وأنس المنقطعين وهو مشهور وتفسير يسمى البيان وكتاب الموجز في الذكر؛ توفي بالموصل في شعبان أو في رمضان سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 143}."
  en: "al-Mu'afa b. al-Haddus of Mosul — the Shafi'i imam, pupil of Ibn Muhajir, al-Fakhr al-Suhrawardi and al-Imad Ibn Yunus, author of the lengthy al-Kamil fi al-Fiqh, the well-known Uns al-Munqati'in, a tafsir called al-Bayan and al-Mujiz fi al-Dhikr; died at Mosul in Sha'ban or Ramadan 630 {cite:shadharat-dhahab p. 143}."
  fr: "al-Mu'afa b. al-Haddus de Mossoul - l'imam Shafi'i, élève d'Ibn Muhajir, al-Fakhr al-Suhrawardi et al-Imad Ibn Yunus, auteur du long al-Kamil fi al-Fiqh, le bien connu Uns al-Munqati'in, un tafsir appelé al-Bayan et al-Mujiz Mort à Mossoul à chaabane ou Ramadan 630 {cite:shadharat-dhahab p. 143}."
  es: "al-Mu'afa b. al-Haddus de Mosul — el imán Shafi'i, alumno de Ibn Muhajir, al-Fakhr al-Suhrawardi y al-Imad Ibn Yunus, autor del extenso al-Kamil fi al-Fiqh, el conocido Uns al-Munqati'in, un tafsir llamado al-Bayan y al-Mujiz fi al-Dhikr; murió en Mosul en Sha'ban o Ramadán 630 {cita: shadharat-dhahab p. 143}."
  ur: "المضافہ ب۔ موصل کا الحدوس - شافعی امام، ابن مہاجر کے شاگرد، الفخر السحروردی اور عماد ابن یونس، طویل الکامل فی الفقہ کے مصنف، المعروف ان المنقطین، ایک تفسیر جسے البیان اور البیان کہتے ہیں۔ شعبان یا رمضان 630 میں موصل میں وفات پائی۔ 143}۔"
  tr: "Ebu Muhammed el-Maafi ibn İsmail bin el-Hüseyin el-Mevsili, diğer adıyla İbn el-Hadus; el-Şafii, bir imam, yetenekli bir hukukçu, erdemli, doğru ve edebi bir figürdü. Musul'da doğdu ve orada İbn Muhacir'in, ardından Hakim Fakhr al-Suhrawardi'nin ve ardından el-İmad bin Yunus'un yanında fıkıh eğitimi aldı. Fetvaları dinledi, anlattı, verdi, yazdı ve münazara yaptı. Eserleri arasında 'El-Kamil fiqh', 'Kitab el-Mütevval', 'Kesintiye uğrayanların sahabesi' (bilinen bir tefsir', 'El-Bayan' adlı bir tafsir ve 'El-Mücaz fi'l-Dzir' kitabı yer alır. 633 Hicri yılında Musul'da Şaban veya Ramazan ayında öldü."
  id: "Abu Muhammad al-Ma'afi ibn Ismail ibn al-Husayn al-Mawsili, juga dikenal sebagai Ibn al-Hadous; al-Shafi'i, adalah seorang imam, ahli hukum yang terampil, berbudi luhur, berhak dan seorang tokoh sastra. Ia lahir di Mosul dan belajar hukum di sana di bawah bimbingan Ibn Muhajir, kemudian di bawah Hakim Fakhr al-Suhrawardi, kemudian di bawah al-Imad ibn Yunus. Ia mendengar, menceritakan, mengeluarkan fatwa, menulis, dan berdebat. Di antara karyanya adalah buku 'Al-Kamil fi al-Fiqh,' 'Kitab al-Mutawwal,' 'Sahabat Orang yang Terputus,' yang terkenal, sebuah tafsir bernama 'Al-Bayan,' dan buku 'Al-Mujaz fi al-Dhikr.' Ia meninggal di Mosul pada masa Sha'ban atau Ramadan pada tahun 633 H."
