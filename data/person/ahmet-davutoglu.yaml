  ar: "أكاديمي وسياسي تركي، رئيس وزراء تركيا وزعيم حزب العدالة والتنمية من 2014 إلى 2016، ووزير خارجيتها من 2009 إلى 2014، ومستشار رئيس الوزراء للسياسة الخارجية قبل ذلك. صاحب كتاب «العمق الإستراتيجي» ومهندس سياسة «صفر مشاكل» مع الجيران، ثم مؤسس حزب المستقبل سنة 2019."
  en: "Turkish academic and politician, prime minister of Turkey and leader of the Justice and Development Party (AKP) from 2014 to 2016, foreign minister from 2009 to 2014 and chief foreign-policy advisor to the prime minister before that. Author of Strategic Depth and architect of the 'zero problems with neighbours' policy, he later founded the Future Party in 2019."
  ur: "ترک ماہرِ تعلیمات اور سیاست دان، 2014 سے 2016 تک ترکی کے وزیر اعظم اور جسٹس اینڈ ڈویلپمنٹ پارٹی کے قائد، 2009 سے 2014 تک وزیر خارجہ اور اس سے پہلے وزیر اعظم کے مشیرِ خارجہ پالیسی رہے۔ کتاب «اسٹریٹجک ڈیپتھ» کے مصنف اور «پڑوسیوں سے صفر مسائل» پالیسی کے معمار؛ بعد میں 2019 میں فیوچر پارٹی قائم کی۔"
