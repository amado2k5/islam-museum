summary:
  ar: "أكاديمي وسياسي تركي، رئيس وزراء تركيا وزعيم حزب العدالة والتنمية من 2014 إلى 2016، ووزير خارجيتها من 2009 إلى 2014، ومستشار رئيس الوزراء للسياسة الخارجية قبل ذلك. صاحب كتاب «العمق الإستراتيجي» ومهندس سياسة «صفر مشاكل» مع الجيران، ثم مؤسس حزب المستقبل سنة 2019."
  en: "Turkish academic and politician, prime minister of Turkey and leader of the Justice and Development Party (AKP) from 2014 to 2016, foreign minister from 2009 to 2014 and chief foreign-policy advisor to the prime minister before that. Author of Strategic Depth and architect of the 'zero problems with neighbours' policy, he later founded the Future Party in 2019."
  ur: "ترک ماہرِ تعلیمات اور سیاست دان، 2014 سے 2016 تک ترکی کے وزیر اعظم اور جسٹس اینڈ ڈویلپمنٹ پارٹی کے قائد، 2009 سے 2014 تک وزیر خارجہ اور اس سے پہلے وزیر اعظم کے مشیرِ خارجہ پالیسی رہے۔ کتاب «اسٹریٹجک ڈیپتھ» کے مصنف اور «پڑوسیوں سے صفر مسائل» پالیسی کے معمار؛ بعد میں 2019 میں فیوچر پارٹی قائم کی۔"
  es: "Académico y político turco, primer ministro de Turquía y líder del Partido de la Justicia y el Desarrollo (AKP) entre 2014 y 2016, ministro de Asuntos Exteriores entre 2009 y 2014 y, antes de eso, principal asesor de política exterior del primer ministro. Autor de *Profundidad estratégica* y artífice de la política de «cero problemas con los vecinos», fundó posteriormente el Partido del Futuro en 2019."
  fr: "Universitaire et homme politique turc, Premier ministre de Turquie et chef du Parti de la justice et du développement (AKP) de 2014 à 2016, ministre des Affaires étrangères de 2009 à 2014 et principal conseiller en politique étrangère du Premier ministre auparavant. Auteur de « Strategic Depth » et architecte de la politique du « zéro problème avec les voisins », il a fondé le Parti de l'avenir en 2019."
  tr: "Türk akademisyen ve siyasetçi olan kendisi, 2014-2016 yılları arasında Türkiye Başbakanı ve Adalet ve Kalkınma Partisi (AKP) lideri, 2009-2014 yılları arasında ise Dışişleri Bakanı olarak görev yapmıştır. Bundan önce Başbakanın Dış Politika Danışmanıydı. \"Stratejik Derinlik\" kitabının yazarı ve Türkiye'nin komşularıyla \"sıfır sorun\" politikasının mimarıdır. Ayrıca 2019 yılında Gelecek Partisi'ni kurmuştur."
  id: "Seorang akademisi dan politikus Turki, ia menjabat sebagai Perdana Menteri Turki dan pemimpin Partai Keadilan dan Pembangunan (AKP) dari tahun 2014 hingga 2016, dan sebagai Menteri Luar Negeri dari tahun 2009 hingga 2014. Sebelumnya, ia adalah Penasihat Perdana Menteri untuk Kebijakan Luar Negeri. Ia adalah penulis buku \"Kedalaman Strategis\" dan arsitek kebijakan \"nol masalah\" Turki dengan negara-negara tetangganya. Ia juga mendirikan Partai Masa Depan pada tahun 2019."
