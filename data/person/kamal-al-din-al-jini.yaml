summary:
  ar: "كمال الدين الجيني الحموي ثم القاهري الشافعي أوحد الرؤساء كاتب السر بمصر؛ كان إماماً عالماً ناظماً ناثراً ولد بحماة في ذي الحجة سنة ست وتسعين وسبعمائة ونشأ بها وحفظ القرآن وتميز في الفقه وقرأه على الحافظ برهان الدين الحلي المعروف بالقوف ثم قدم الديار المصرية مع والده فتفقه بالولي العراقي والعز بن جماعة وأخذ عنهما العقليات وعن القاضي شمس الدين البساطي المالكي وأخذ النحو عن الشيخ يحيى المغربي السجيسي واجتهد في التحصيل وساعده فرط ذكائه واستقامة ذهنه حتى برع في المنطوق والمفهوم وصارت له اليد الطولى في المنثور والمنظوم، وولي قضاء قضاة دمشق وحج، قال في المنهل وكان أعظم من رأينا في هذا العصر، وتوفي بالقاهرة يوم الأحد سادس عشر صفر سنة ست وخمسين وثمانمائة {cite:shadharat-dhahab p. 290}."
  en: "Al-Jini (b. Hama Dhu'l-Hijja 796) — katib al-sirr of Egypt and 'singular among the notables,' Damascus's chief qadi too; al-Manhal: 'the greatest we saw in this age'; died Cairo Sunday 16 Safar 856 {cite:shadharat-dhahab p. 290}."
  es: "Al-Jini (n. Hama Dhu'l-Hijja 796): katib al-sirr de Egipto y \"singular entre los notables\", también cadí principal de Damasco; al-Manhal: 'el más grande que hemos visto en esta época'; murió en El Cairo el domingo 16 de Safar 856 {cita: shadharat-dhahab p. 290}."
  fr: "Al-Jini (né Hama Dhu'l-Hijja 796) — katib al-sirr d'Égypte et « singulier parmi les notables », également le cadi en chef de Damas; al-Manhal: « le plus grand que nous ayons vu à cette époque »; décédé au Caire dimanche 16 Safar 856 {cite: shadharat-dhahab p. 290}."
  ur: "الجنی ⁦(ب. حما ذوالحجہ 796)⁩ - مصر کے کاتب السیر اور 'مشہور افراد میں واحد'، دمشق کے چیف قاضی بھی؛ المنحل: 'ہم نے اس دور میں سب سے بڑا دیکھا'؛ وفات قاہرہ اتوار 16 صفر 856 290}۔"
  tr: "Kamal al-Din al-Jinni al-Hamawi, o zamanlar el-Qahiri el-Şafii, Mısır'daki tek baş gizli katipti; imam, alim, şair ve nesir şairiydi. 796 Hicr yılında Hama'da Dhu al-Hijjah'de doğdu, orada büyüdü, Kur'an'ı ezberledi, fıkıhta kendini gösterdi ve hafız Burhan al-Din al-Hilli, yani el-Küf'ün yanında eğitim aldı. Sonra babasıyla birlikte Mısır'a döndü ve burada Irak valisi el-İzz bin Cemaah'ın yanında hukuk eğitimi aldı; ondan akıl bilimleri ve hakim Şemseddin el-Basati el-Maliki'den öğrendi. Şeyh Yahya el-Mağribi el-Sicisi'den dilbilgisi öğrendi, çalışmalarında gayretle çalıştı ve olağanüstü zekası sayesinde destek aldı. Entelektüel bütünlüğü o kadar açıktı ki, hem konuşmada hem de anlamada üstün oldu ve düzyazı ile şiirde derin bir ustalık kazandı. Şam ve Hac yargıçlarının yargıcı olarak görev yaptı. Al-Manhal'da yazdı ve bu dönemin en büyüğüydü. Sekiz yüz elli altıncı yılda, Safar'ın on altısı Pazar günü Kahire'de vefat etti {atıf:shadharat-dhahab, s. 290}."
  id: "Kamal al-Din al-Jinni al-Hamawi, yang saat itu al-Qahiri al-Shafi'i, adalah satu-satunya juru tulis rahasia utama di Mesir; ia adalah seorang imam, cendekiawan, penyair, dan penyair prosa. Ia lahir di Hama di Dhu al-Hijjah pada tahun 796 H, tumbuh besar di sana, menghafal Al-Qur'an, menonjol dalam bidang fiqh, dan belajar di bawah hafiz Burhan al-Din al-Hilli, yang dikenal sebagai al-Quf. Kemudian ia kembali ke Mesir bersama ayahnya, di mana ia belajar hukum di bawah gubernur Irak dan al-Izz ibn Jama'ah, dari siapa ia mempelajari ilmu rasional, dan dari Hakim Shams al-Din al-Basati al-Maliki. Ia belajar tata bahasa dari Sheikh Yahya al-Maghribi al-Sijisi, bekerja keras dalam studinya, dan dibantu oleh kecerdasan luar biasanya. Integritas intelektualnya begitu jelas sehingga ia unggul baik dalam lisan maupun pemahaman, dan memperoleh penguasaan mendalam dalam prosa dan puisi. Ia menjadi hakim Damaskus dan Haji. Ia menulis di Al-Manhal, dan ia adalah yang terbesar di zaman kita pada masa itu. Ia meninggal di Kairo pada hari Minggu, tanggal enam belas Safar, tahun delapan ratus lima puluh enam {cite:shadharat-dhahab, hlm. 290}."
