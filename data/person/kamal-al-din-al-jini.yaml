gender: male
summary:
  ar: "كمال الدين الجيني الحموي ثم القاهري الشافعي أوحد الرؤساء كاتب السر بمصر؛ كان إماماً عالماً ناظماً ناثراً ولد بحماة في ذي الحجة سنة ست وتسعين وسبعمائة ونشأ بها وحفظ القرآن وتميز في الفقه وقرأه على الحافظ برهان الدين الحلي المعروف بالقوف ثم قدم الديار المصرية مع والده فتفقه بالولي العراقي والعز بن جماعة وأخذ عنهما العقليات وعن القاضي شمس الدين البساطي المالكي وأخذ النحو عن الشيخ يحيى المغربي السجيسي واجتهد في التحصيل وساعده فرط ذكائه واستقامة ذهنه حتى برع في المنطوق والمفهوم وصارت له اليد الطولى في المنثور والمنظوم، وولي قضاء قضاة دمشق وحج، قال في المنهل وكان أعظم من رأينا في هذا العصر، وتوفي بالقاهرة يوم الأحد سادس عشر صفر سنة ست وخمسين وثمانمائة {cite:shadharat-dhahab p. 290}."
  en: "Al-Jini (b. Hama Dhu'l-Hijja 796) — katib al-sirr of Egypt and 'singular among the notables,' Damascus's chief qadi too; al-Manhal: 'the greatest we saw in this age'; died Cairo Sunday 16 Safar 856 {cite:shadharat-dhahab p. 290}."
