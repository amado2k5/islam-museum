summary:
  ar: كاتبة وعالمة اجتماع وناشطة جنوب أفريقية ضد الفصل العنصري، وُلدت في ديربان سنة 1928. من مؤسِّسات اتحاد نساء جنوب أفريقيا، ومحاضِرة في علم الاجتماع بجامعة ناتال، ومؤسِّسة معهد بحوث السود، ومؤلفة «أسمى من الأمل»، أول سيرة مرخّصة لنيلسون مانديلا.
  en: South African writer, sociologist and anti-apartheid activist, born in Durban in 1928. She was a founding member of the Federation of South African Women, a lecturer in sociology at the University of Natal, founder of the Institute for Black Research, and author of Higher than Hope, the first authorised biography of Nelson Mandela.
  ur: جنوبی افریقی مصنفہ، ماہرِ عمرانیات اور نسل پرستی کے خلاف سرگرم کارکن، جو 1928 میں ڈربن میں پیدا ہوئیں۔ وہ فیڈریشن آف ساؤتھ افریقن ویمن کی بانی اراکین، یونیورسٹی آف نٹال میں عمرانیات کی لیکچرر، انسٹیٹیوٹ فار بلیک ریسرچ کی بانی، اور نیلسن منڈیلا کی پہلی باقاعدہ سوانح «ہائر دین ہوپ» کی مصنفہ تھیں۔
