summary:
  ar: "أحمد بن سعيد بن إبراهيم، أبو عمر، المعروف بابن الهندي، الهمداني القرطبي، فقيه مالكي ثقة عمدة، كان واحد عصره في علم الشروط وأقر له بذلك فقهاء الأندلس، أخذ عن أبي إبراهيم إسحاق بن إبراهيم. من تصانيفه «ديوان الوثائق» في ستة أجزاء. وُلد سنة 320هـ وتوفي سنة 399هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
  en: "Ahmad ibn Said ibn Ibrahim, Abu Umar, known as Ibn al-Hindi, of Hamadan origin and Cordoba, a trustworthy Maliki jurist. He was the foremost man of his time in the science of legal documents, which the jurists of al-Andalus acknowledged, and he studied with Abu Ibrahim Ishaq ibn Ibrahim. His work is 'Diwan al-watha'iq' in six parts. Born 320 AH, died 399 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
  es: "Ahmad ibn Said ibn Ibrahim, Abu Umar, conocido como Ibn al-Hindi, originario de Hamadán y Córdoba, fue un jurista malikí de gran prestigio. Fue la figura más destacada de su tiempo en la ciencia de los documentos legales, reconocida por los juristas de al-Ándalus, y estudió con Abu Ibrahim Ishaq ibn Ibrahim. Su obra es el «Diwan al-watha'iq», dividido en seis partes. Nació en el año 320 de la Hégira y falleció en el año 399 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
  fr: "Ahmad ibn Said ibn Ibrahim, dit Abu Umar ou Ibn al-Hindi, originaire de Hamadan et de Cordoue, était un juriste malikite réputé. Il fut le plus éminent spécialiste de son temps en matière de documents juridiques, ce qui était reconnu par les juristes d'al-Andalus. Il étudia auprès d'Abu Ibrahim Ishaq ibn Ibrahim. Son œuvre majeure, le « Diwan al-watha'iq », est en six parties. Né en 320 AH, mort en 399 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
  ur: "احمد بن سعید ابن ابراہیم، ابو عمر، ابن الہندی کے نام سے مشہور، ہمدان نژاد اور قرطبہ، ایک ثقہ مالکی فقیہ۔ وہ قانونی دستاویزات کی سائنس میں اپنے وقت کے سب سے آگے آدمی تھے، جسے اندلس کے فقہاء نے تسلیم کیا، اور اس نے ابو ابراہیم اسحاق ابن ابراہیم سے تعلیم حاصل کی۔ ان کی تصنیف 'دیوان الوثیق' چھ حصوں میں ہے۔ پیدائش 320ھ، وفات 399ھ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2051}"
  tr: "Ahmed ibn Sa'id ibn İbrahim, Ebu Ömer, İbn el-Hindi, el-Hamdani el-Kurtubi olarak da bilinen, güvenilir ve otorite sahibi bir Maliki fıkıhçısıydı. Zamanının hukuk hükümleri alanındaki en önde gelen otoritesiydi; bu gerçek Endülüs fıkıhçıları tarafından da kabul edilmiştir. Ebu İbrahim İshak ibn İbrahim'in yanında eğitim görmüştür. Eserleri arasında altı ciltlik \"Divan el-Vatha'iq\" (Belgeler Koleksiyonu) bulunmaktadır. Hicri 320 yılında doğmuş ve 399 yılında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2051}"
  id: "Ahmad ibn Sa'id ibn Ibrahim, Abu 'Umar, yang dikenal sebagai Ibn al-Hindi, al-Hamdani al-Qurtubi, adalah seorang ahli hukum Maliki yang terpercaya dan berwibawa. Beliau adalah tokoh terkemuka pada zamannya di bidang hukum, sebuah fakta yang diakui oleh para ahli hukum Andalusia. Beliau belajar di bawah bimbingan Abu Ibrahim Ishaq ibn Ibrahim. Di antara karyanya adalah \"Diwan al-Watha'iq\" (Kumpulan Dokumen) dalam enam jilid. Beliau lahir pada tahun 320 H dan wafat pada tahun 399 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
