summary:
  ar: "أحمد بن سعيد بن إبراهيم، أبو عمر، المعروف بابن الهندي، الهمداني القرطبي، فقيه مالكي ثقة عمدة، كان واحد عصره في علم الشروط وأقر له بذلك فقهاء الأندلس، أخذ عن أبي إبراهيم إسحاق بن إبراهيم. من تصانيفه «ديوان الوثائق» في ستة أجزاء. وُلد سنة 320هـ وتوفي سنة 399هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
  en: "Ahmad ibn Said ibn Ibrahim, Abu Umar, known as Ibn al-Hindi, of Hamadan origin and Cordoba, a trustworthy Maliki jurist. He was the foremost man of his time in the science of legal documents, which the jurists of al-Andalus acknowledged, and he studied with Abu Ibrahim Ishaq ibn Ibrahim. His work is 'Diwan al-watha'iq' in six parts. Born 320 AH, died 399 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2051}"
