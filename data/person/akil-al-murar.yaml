summary:
  ar: "ملك من ملوك كندة انتسب إليه الأشعث بن قيس من قبل النساء وادعى الوفد أن النبي ابنه؛ يذكر ابن هشام أنه الحارث بن عمرو بن حجر، وأنه سُمّي آكل المرار لأن عمرو بن الهبولة الغساني أغار على قومه وسبى امرأته أم أناس بنت عوف الشيبانية فوصفته لآسرها برجل أدلم كأن مشافره مشافر بعير آكل مرار، ثم تبعه الحارث فقتله واستنقذها؛ ويقال بل هو حجر بن عمرو، سُمّي بذلك لأنه أكل مع أصحابه شجر المرار في تلك الغزوة."
  en: "A king of Kinda to whom al-Ash'ath ibn Qays traced his line through women and whose descendant the delegation claimed the Prophet was; Ibn Hisham names him al-Harith ibn Amr ibn Hujr and explains the name: Amr ibn al-Habula the Ghassanid raided his people and captured his wife Umm Unas bint Awf of Shayban, who described to her captor a dark man with lips like a camel's that has eaten the bitter murar shrub, and al-Harith pursued and killed him and recovered her; others say he was Hujr ibn Amr, so named because he and his men ate the murar on that raid."
  fr: "Roi de Kinda auquel al-Ash’ath ibn Qays rattachait sa lignée par les femmes et dont la délégation affirmait que le Prophète descendait ; Ibn Hisham le nomme al-Harith ibn Amr ibn Hujr et explique son nom : Amr ibn al-Habula le Ghassanide attaqua son peuple et captura son épouse Umm Unas bint Awf de Shayban, qui décrivit à son ravisseur un homme sombre aux lèvres semblables à celles d’un chameau ayant mangé l’arbuste amer murar. Al-Harith le poursuivit, le tua et la délivra ; d’autres disent qu’il s’agissait de Hujr ibn Amr, ainsi nommé parce que lui et ses hommes avaient mangé du murar pendant ce raid."
  es: "Un rey de Kinda, a quien al-Ash'ath ibn Qays remontaba su linaje a través de mujeres y de cuyo descendiente la delegación afirmaba que era el Profeta; Ibn Hisham lo nombra al-Harith ibn Amr ibn Hujr y explica el nombre: Amr ibn al-Habula el Gasánida asaltó a su pueblo y capturó a su esposa Umm Unas bint Awf de Shayban, quien describió a su captor como un hombre moreno con labios como los de un camello que había comido el arbusto amargo murar, y al-Harith lo persiguió, lo mató y la recuperó; otros dicen que era Hujr ibn Amr, llamado así porque él y sus hombres comieron el murar en ese asalto."
  ur: "ایک قسم کا بادشاہ جس کی طرف اشعث بن قیس نے عورتوں کے ذریعے اپنا سلسلہ معلوم کیا اور جس کی نسل سے وفد نے دعویٰ کیا کہ وہ پیغمبر تھے؛ ابن ہشام نے اس کا نام حارث بن عمرو ابن حجر رکھا ہے اور نام کی وضاحت کرتے ہوئے کہا ہے: عمرو بن الحبولہ غسانی نے اپنی قوم پر چھاپہ مارا اور اس کی بیوی ام اناس بنت عوف کو شیبان سے پکڑ لیا، اس نے اپنے قیدی کو ایک سیاہ آدمی بتایا جس کے ہونٹ اونٹ کی طرح تھے اور اس نے اس کو کھایا اور ہڑبڑ مارا۔ اسے بازیافت کیا؛ دوسرے کہتے ہیں کہ وہ حجر بن عمرو تھے، اس لیے یہ نام اس لیے رکھا گیا تھا کہ اس نے اور اس کے آدمیوں نے اس چھاپے میں مرر کھایا تھا۔"
  tr: "El-Aş'at bin Kays'ın kadınlar aracılığıyla akrabalık bağı bulunan Kindah kabilesinin bir kralı vardı ve heyet, Peygamber'in onun oğlu olduğunu iddia etti. İbn Hişam, onun El-Harith bin Amr bin Hajar olduğunu ve \"Acı Ot Yiyen\" olarak anılmasının nedeninin, Amr bin El-Habula El-Ghassani'nin halkına baskın düzenleyip karısı Ümmü Enes bint Avf El-Şeybaniyye'yi esir alması ve Ümmü Enes bint Avf El-Şeybaniyye'nin onu esir alan kişiye, dudakları acı ot yiyen bir devenin dudaklarına benzeyen esmer tenli bir adam olarak tarif etmesi olduğunu belirtir. Bunun üzerine El-Harith onu takip etti, öldürdü ve Ümmü Enes'i kurtardı. Onun Hajar bin Amr olduğu ve bu baskında arkadaşlarıyla birlikte acı ot yediği için bu adı aldığı söylenir."
  id: "Seorang raja dari suku Kindah yang memiliki hubungan kekerabatan dengan Al-Ash’ath bin Qais melalui seorang wanita, dan delegasi tersebut mengklaim bahwa Nabi adalah putranya. Ibn Hisham menyebutkan bahwa dia adalah Al-Harith bin Amr bin Hajar, dan bahwa dia disebut Pemakan Rempah Pahit karena Amr bin Al-Habula Al-Ghassani menyerang kaumnya dan menangkap istrinya, Umm Anas bint Awf Al-Shaibaniyya, dan dia menggambarkannya kepada penangkapnya sebagai seorang pria berkulit gelap yang bibirnya seperti bibir unta yang memakan rempah pahit. Kemudian Al-Harith mengejarnya, membunuhnya, dan menyelamatkannya. Dikatakan bahwa dia adalah Hajar bin Amr, dan dia diberi nama demikian karena dia memakan rempah pahit bersama para sahabatnya dalam penyerangan itu."
