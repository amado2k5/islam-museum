summary:
  ar: "ملك من ملوك كندة انتسب إليه الأشعث بن قيس من قبل النساء وادعى الوفد أن النبي ابنه؛ يذكر ابن هشام أنه الحارث بن عمرو بن حجر، وأنه سُمّي آكل المرار لأن عمرو بن الهبولة الغساني أغار على قومه وسبى امرأته أم أناس بنت عوف الشيبانية فوصفته لآسرها برجل أدلم كأن مشافره مشافر بعير آكل مرار، ثم تبعه الحارث فقتله واستنقذها؛ ويقال بل هو حجر بن عمرو، سُمّي بذلك لأنه أكل مع أصحابه شجر المرار في تلك الغزوة."
  en: "A king of Kinda to whom al-Ash'ath ibn Qays traced his line through women and whose descendant the delegation claimed the Prophet was; Ibn Hisham names him al-Harith ibn Amr ibn Hujr and explains the name: Amr ibn al-Habula the Ghassanid raided his people and captured his wife Umm Unas bint Awf of Shayban, who described to her captor a dark man with lips like a camel's that has eaten the bitter murar shrub, and al-Harith pursued and killed him and recovered her; others say he was Hujr ibn Amr, so named because he and his men ate the murar on that raid."
