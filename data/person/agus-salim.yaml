summary:
  ar: "صحفي ودبلوماسي ورجل دولة إندونيسي (1884–1954)، من قادة شريكة الإسلام واليد اليمنى لتجوكروامينوتو، وعضو المجلس الشعبي (1921–1924)، ووزير خارجية إندونيسيا (1947–1949) الذي نال اعتراف الدول العربية بالجمهورية الوليدة، ولقّبه مواطنوه «الرجل العجوز الكبير». كتب في التوحيد والتقدير والتوكل ودافع في مجلس الاستقلال عن أساس الدولة."
  en: "Indonesian journalist, diplomat and statesman (1884–1954), a leader of Sarekat Islam and Tjokroaminoto's right-hand man, a Volksraad member (1921–1924), and the foreign minister (1947–1949) who won the Arab states' recognition of the young republic; his countrymen called him 'the Grand Old Man'. He wrote on tawhid, takdir and tawakal and argued over the basis of the state in the independence committee."
  ur: "انڈونیشی صحافی، سفارت کار اور سیاست دان (1884ء–1954ء)، شریکۃ اسلام کے رہنما اور تجوکروامینوتو کے دست راست، فولکسراد کے رکن (1921ء–1924ء)، اور وزیر خارجہ (1947ء–1949ء) جنہوں نے نوزائیدہ جمہوریہ کو عرب ریاستوں سے تسلیم کرایا؛ ہم وطن انہیں «دی گرینڈ اولڈ مین» کہتے تھے۔ انہوں نے توحید، تقدیر اور توکل پر لکھا اور آزادی کمیٹی میں ریاست کی بنیاد پر بحث کی۔"
