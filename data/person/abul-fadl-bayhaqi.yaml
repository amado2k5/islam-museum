summary:
  ar: "كاتب ومؤرخ فارسي في الدولة الغزنوية (نحو 995–1077)، وُلد في حارث آباد من أعمال بيهق وتعلّم في نيسابور، فالتحق بديوان الرسائل سنة 1020/1021 وصار تلميذًا ومساعدًا للكاتب الأول أبي نصر مشكان تسعة عشر عامًا، ثم تولى رئاسة الديوان في عهد عبد الرشيد، فأُقيل وسُجن وصودرت أمواله قبل إطلاقه سنة 1052. اعتزل في غزنة وقضى اثنين وعشرين عامًا في كتابة «تاريخ البيهقي» (التاريخ المسعودي) الذي كان في ثلاثين مجلدًا ولم يبقَ منه إلا نحو خمسة ونصف، وهو أوسع مصدر باقٍ عن عهد مسعود الأول، مشهور بصراحته ودقته ونثره الفارسي الرفيع. وليس هو المحدّث أبا بكر أحمد بن الحسين البيهقي صاحب السنن."
  en: "Persian secretary and historian of the Ghaznavid court (c. 995 - 21 September 1077). Born at Harethabad in Bayhaq and educated at Nishapur, he entered the chancery (divan al-risala) in 1020/1 and served nineteen years as pupil and assistant to the chief secretary Abu Nasr Mushkan. After a turn as chief secretary under Abd al-Rashid he was dismissed, imprisoned and stripped of his possessions, then released in 1052 and retired to Ghazni, where he spent twenty-two years writing the Tarikh-i Bayhaqi (also called Tarikh-i Mas'udi): originally thirty volumes, of which about five and a half survive, it is the fullest surviving source for the reign of Mas'ud I, praised for its frankness, precision and elegant Persian prose. He is not the hadith scholar Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi."
  ur: "غزنوی دربار کے فارسی منشی و مؤرخ (تقریباً 995ء – 21 ستمبر 1077ء)۔ بیہق کے حارث آباد میں پیدا ہوئے، نیشاپور میں تعلیم پائی، 1020/1021ء میں دیوانِ رسالت سے وابستہ ہو کر انیس برس ابو نصر مشکان کے شاگرد و معاون رہے۔ عبد الرشید کے عہد میں رئیسِ دیوان ہوئے، پھر معزول و قید ہوئے اور مال ضبط ہوا؛ 1052ء میں رہائی کے بعد غزنی میں گوشہ نشین ہو کر بائیس برس «تاریخِ بیہقی» (تاریخِ مسعودی) لکھی، جو تیس جلدوں میں تھی مگر تقریباً ساڑھے پانچ جلدیں باقی ہیں — مسعود اول کے عہد کا سب سے مفصل ماخذ۔ یہ محدث ابو بکر احمد بن الحسین البیہقی سے مختلف شخص ہیں۔"

