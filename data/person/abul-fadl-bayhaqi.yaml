summary:
  ar: "كاتب ومؤرخ فارسي في الدولة الغزنوية ⁦(نحو 995–1077)⁩، وُلد في حارث آباد من أعمال بيهق وتعلّم في نيسابور، فالتحق بديوان الرسائل سنة 1020/1021 وصار تلميذًا ومساعدًا للكاتب الأول أبي نصر مشكان تسعة عشر عامًا، ثم تولى رئاسة الديوان في عهد عبد الرشيد، فأُقيل وسُجن وصودرت أمواله قبل إطلاقه سنة 1052. اعتزل في غزنة وقضى اثنين وعشرين عامًا في كتابة «تاريخ البيهقي» ⁦(التاريخ المسعودي)⁩ الذي كان في ثلاثين مجلدًا ولم يبقَ منه إلا نحو خمسة ونصف، وهو أوسع مصدر باقٍ عن عهد مسعود الأول، مشهور بصراحته ودقته ونثره الفارسي الرفيع. وليس هو المحدّث أبا بكر أحمد بن الحسين البيهقي صاحب السنن."
  en: "Persian secretary and historian of the Ghaznavid court (c. 995 - 21 September 1077). Born at Harethabad in Bayhaq and educated at Nishapur, he entered the chancery (divan al-risala) in 1020/1 and served nineteen years as pupil and assistant to the chief secretary Abu Nasr Mushkan. After a turn as chief secretary under Abd al-Rashid he was dismissed, imprisoned and stripped of his possessions, then released in 1052 and retired to Ghazni, where he spent twenty-two years writing the Tarikh-i Bayhaqi (also called Tarikh-i Mas'udi): originally thirty volumes, of which about five and a half survive, it is the fullest surviving source for the reign of Mas'ud I, praised for its frankness, precision and elegant Persian prose. He is not the hadith scholar Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi."
  fr: "Secrétaire et historien persan de la cour ghaznévide (vers 995 – 21 septembre 1077). Né à Harethabad dans le Bayhaq et formé à Nishapur, il entra à la chancellerie (divan al-risala) en 1020/1021 et servit dix-neuf ans comme élève et assistant du secrétaire en chef Abu Nasr Mushkan. Devenu secrétaire en chef sous Abd al-Rashid, il fut destitué, emprisonné et dépouillé de ses biens, puis libéré en 1052. Retiré à Ghazni, il consacra vingt-deux ans au Tarikh-i Bayhaqi, ou Tarikh-i Mas'udi : trente volumes à l'origine, dont environ cinq et demi subsistent, source conservée la plus complète sur le règne de Mas'ud Ier, appréciée pour sa franchise, sa précision et l'élégance de sa prose persane. À distinguer du savant du hadith Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi."
  ur: "غزنوی دربار کے فارسی منشی و مؤرخ ⁦(تقریباً 995ء – 21 ستمبر 1077ء)⁩۔ بیہق کے حارث آباد میں پیدا ہوئے، نیشاپور میں تعلیم پائی، 1020/1021ء میں دیوانِ رسالت سے وابستہ ہو کر انیس برس ابو نصر مشکان کے شاگرد و معاون رہے۔ عبد الرشید کے عہد میں رئیسِ دیوان ہوئے، پھر معزول و قید ہوئے اور مال ضبط ہوا؛ 1052ء میں رہائی کے بعد غزنی میں گوشہ نشین ہو کر بائیس برس «تاریخِ بیہقی» ⁦(تاریخِ مسعودی)⁩ لکھی، جو تیس جلدوں میں تھی مگر تقریباً ساڑھے پانچ جلدیں باقی ہیں — مسعود اول کے عہد کا سب سے مفصل ماخذ۔ یہ محدث ابو بکر احمد بن الحسین البیہقی سے مختلف شخص ہیں۔"
  es: "Secretario e historiador persa de la corte gaznávida (c. 995 - 21 de septiembre de 1077). Nacido en Harethabad, en Bayhaq, y educado en Nishapur, ingresó en la cancillería (diván al-risala) en 1020/1 y sirvió diecinueve años como discípulo y asistente del secretario principal Abu Nasr Mushkan. Tras ejercer como secretario principal bajo el mandato de Abd al-Rashid, fue destituido, encarcelado y despojado de sus posesiones. Fue liberado en 1052 y se retiró a Ghazni, donde dedicó veintidós años a escribir el Tarikh-i Bayhaqi (también llamado Tarikh-i Mas'udi): originalmente constaba de treinta volúmenes, de los cuales se conservan aproximadamente cinco y medio. Es la fuente más completa que se conserva del reinado de Mas'ud I, elogiada por su franqueza, precisión y elegante prosa persa. No se trata del erudito de hadices Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi."
  tr: "Gaznevi hanedanlığı döneminde (yaklaşık 995-1077) yaşamış bir Fars yazar ve tarihçi olan I. Mes'udi, Bayhaq yakınlarındaki Harithabad'da doğmuş ve Nişapur'da eğitim görmüştür. 1020/1021 yılında şansölyeliğe katılmış ve on dokuz yıl boyunca baş kâtip Ebu Nasr Mişkan'ın öğrencisi ve yardımcısı olmuştur. Daha sonra Abdül-Raşid döneminde şansölyeliğin başına geçmiş, ancak görevden alınmış, hapsedilmiş ve mal varlığına el konulduktan sonra 1052 yılında serbest bırakılmıştır. Gazne'ye çekilerek yirmi iki yıl boyunca \"Tarikh al-Bayhaqi\" (aynı zamanda \"al-Tarikh al-Mas'udi\" olarak da bilinir) adlı eserini yazmıştır. Başlangıçta otuz cilt olan bu eserden sadece yaklaşık beş buçuk cildi günümüze ulaşmıştır. Mas'udi I'in saltanatından günümüze ulaşan en kapsamlı kaynak olup, dürüstlüğü, kesinliği ve zarif Farsça üslubuyla ünlüdür. Kendisi, Sünen'in yazarı hadis âlimi Ebu Bekir Ahmed ibn el-Hüseyn el-Beyhaki ile karıştırılmamalıdır."
  id: "Seorang penulis dan sejarawan Persia dari dinasti Ghaznavid (sekitar 995–1077), ia lahir di Harithabad, dekat Bayhaq, dan belajar di Nishapur. Ia bergabung dengan kantor pemerintahan pada tahun 1020/1021 dan menjadi murid serta asisten juru tulis utama, Abu Nasr Mishkan, selama sembilan belas tahun. Kemudian ia menjabat sebagai kepala kantor pemerintahan selama pemerintahan Abd al-Rashid, tetapi dipecat, dipenjara, dan hartanya disita sebelum dibebaskan pada tahun 1052. Ia mengasingkan diri di Ghazna dan menghabiskan dua puluh dua tahun untuk menulis \"Tarikh al-Bayhaqi\" (juga dikenal sebagai \"al-Tarikh al-Mas'udi\"), yang awalnya terdiri dari tiga puluh jilid, yang hanya sekitar lima setengahnya yang masih ada. Karya ini merupakan sumber terlengkap yang masih ada dari masa pemerintahan Mas'ud I, terkenal karena kejujuran, ketelitian, dan prosa Persia yang elegan. Ia tidak boleh disamakan dengan ulama hadits Abu Bakr Ahmad ibn al-Husayn al-Bayhaqi, penulis kitab Sunan."

