summary:
  ar: "طارق البشري ⁦(1933–2021)⁩ قاضٍ ومؤرخ ومفكر قانوني مصري، نائب رئيس مجلس الدولة سابقاً، اشتهر بدراساته في الحركة السياسية المصرية والعلاقات الإسلامية القبطية. من أعماله «المسلمون والأقباط» و«الحركة السياسية في مصر» و«الديمقراطية والناصرية»."
  en: "Tariq al-Bishri (1933–2021) was an Egyptian judge, historian and legal thinker, former deputy head of the Council of State, known for foundational studies of the Egyptian political movement and Muslim-Coptic relations. His works include Al-Muslimun wal-Aqbat (Muslims and Copts), Al-Haraka al-Siyasiyya fi Misr and Al-Dimuqratiyya wal-Nasiriyya."
  ur: "طارق البشری ⁦(1933–2021)⁩ مصری جج، مؤرخ اور قانونی مفکر تھے، کونسل آف اسٹیٹ کے سابق نائب صدر، مصری سیاسی تحریک اور مسلم-قبطی تعلقات کی بنیادی تحقیقات کے لیے مشہور۔ تصانیف میں «المسلمون والأقباط»، «الحركة السياسية في مصر» اور «الديمقراطية والناصرية» شامل ہیں۔"
  es: "Tariq al-Bishri (1933-2021) fue un juez, historiador y pensador jurídico egipcio, ex subdirector del Consejo de Estado, conocido por sus estudios fundamentales del movimiento político egipcio y las relaciones entre musulmanes y coptos. Sus obras incluyen Al-Muslimun wal-Aqbat (Musulmanes y coptos), Al-Haraka al-Siyasiyya fi Misr y Al-Dimuqratiyya wal-Nasiriyya."
  fr: "Tariq al-Bishri (1933-2021) était un juge, historien et penseur juridique égyptien, ancien chef adjoint du Conseil d'État, connu pour ses études fondamentales sur le mouvement politique égyptien et les relations entre musulmans et coptes. Ses œuvres comprennent Al-Muslimun wal-Aqbat (Musulmans et Coptes), Al-Haraka al-Siyasiyya fi Misr et Al-Dimuqratiyya wal-Nasiriyya."
  tr: "Tarek Al-Bishri (1933–2021), Mısırlı bir yargıç, tarihçi ve hukuk düşünürü, eski Devlet Konseyi Başkan Yardımcısı, Mısır siyasi hareketi ve Kıpti-İslam ilişkileri üzerine yaptığı çalışmalarla tanınır. Eserleri arasında 'Müslümanlar ve Kıptiler', 'Mısır'daki Siyasi Hareket' ve 'Demokrasi ve Nasırizm' bulunmaktadır."
  id: "Tarek Al-Bishri (1933–2021) adalah seorang hakim, sejarawan, dan pemikir hukum asal Mesir, mantan Wakil Presiden Dewan Negara, dikenal atas studinya tentang gerakan politik Mesir dan hubungan Koptik-Islam. Karya-karyanya meliputi 'Muslim dan Koptik,' 'Gerakan Politik di Mesir,' dan 'Demokrasi dan Nasserisme.'"
