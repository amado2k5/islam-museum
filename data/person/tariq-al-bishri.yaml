  ar: "طارق البشري ⁦(1933–2021)⁩ قاضٍ ومؤرخ ومفكر قانوني مصري، نائب رئيس مجلس الدولة سابقاً، اشتهر بدراساته في الحركة السياسية المصرية والعلاقات الإسلامية القبطية. من أعماله «المسلمون والأقباط» و«الحركة السياسية في مصر» و«الديمقراطية والناصرية»."
  en: "Tariq al-Bishri (1933–2021) was an Egyptian judge, historian and legal thinker, former deputy head of the Council of State, known for foundational studies of the Egyptian political movement and Muslim-Coptic relations. His works include Al-Muslimun wal-Aqbat (Muslims and Copts), Al-Haraka al-Siyasiyya fi Misr and Al-Dimuqratiyya wal-Nasiriyya."
  ur: "طارق البشری ⁦(1933–2021)⁩ مصری جج، مؤرخ اور قانونی مفکر تھے، کونسل آف اسٹیٹ کے سابق نائب صدر، مصری سیاسی تحریک اور مسلم-قبطی تعلقات کی بنیادی تحقیقات کے لیے مشہور۔ تصانیف میں «المسلمون والأقباط»، «الحركة السياسية في مصر» اور «الديمقراطية والناصرية» شامل ہیں۔"
