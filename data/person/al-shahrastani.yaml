born: { edtf: "1074", hijri: "0467", calendar: julian, precision: year, status: tradition, derived: true, note: "ولد سنة سبع وستين وأربعمائة بشهرستان، هكذا وجده ابن خلكان بخطه عن مولده، وقيل سنة تسع وسبعين وأربعمائة {cite:wafayat-ayan}." }
died: { edtf: "1153", hijri: "0548", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي بشهرستان في أواخر شعبان سنة ثمان وأربعين وخمسمائة، وقيل سنة تسع وأربعين {cite:wafayat-ayan}." }
summary:
  ar: "أبو الفتح محمد بن أبي القاسم عبد الكريم بن أبي بكر أحمد الشهرستاني المتكلم على مذهب الأشعري؛ كان إماماً مبرزاً فقيهاً متكلماً، تفقه على أحمد الخوافي وأبي نصر القشيري وقرأ الكلام على أبي القاسم الأنصاري وتفرد فنّه، وصنّف «نهاية الإقدام في علم الكلام» و«الملل والنحل» و«المضارعة» و«تلخيص الأقسام لمذاهب الأنام»، وكان كثير التحفظ حسن المحاورة يعظ الناس، ودخل بغداد سنة عشر وخمسمائة فأقام بها ثلاث سنين وظهر له قبول كثير عند العوام {cite:wafayat-ayan}."
  en: "al-Shahrastani (467–548) — the Ash'ari theologian of Nihayat al-Iqdam and al-Milal wa-l-Nihal, the landmark heresiography; preached at Baghdad 510–513 {cite:wafayat-ayan}."
