class: person
label: { ar: "الشهرستاني", en: "al-Shahrastani", fr: "al-Shahrastani", es: "al-Shahrastani", ur: "الشہرستانی" }
born: { edtf: "1074", hijri: "0467", calendar: julian, precision: year, status: tradition, derived: true, note: "ولد سنة سبع وستين وأربعمائة بشهرستان، هكذا وجده ابن خلكان بخطه عن مولده، وقيل سنة تسع وسبعين وأربعمائة {cite:wafayat-ayan}." }
died: { edtf: "1153", hijri: "0548", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي بشهرستان في أواخر شعبان سنة ثمان وأربعين وخمسمائة، وقيل سنة تسع وأربعين {cite:wafayat-ayan}." }
summary:
  ar: "أبو الفتح محمد بن أبي القاسم عبد الكريم بن أبي بكر أحمد الشهرستاني المتكلم على مذهب الأشعري؛ كان إماماً مبرزاً فقيهاً متكلماً، تفقه على أحمد الخوافي وأبي نصر القشيري وقرأ الكلام على أبي القاسم الأنصاري وتفرد فنّه، وصنّف «نهاية الإقدام في علم الكلام» و«الملل والنحل» و«المضارعة» و«تلخيص الأقسام لمذاهب الأنام»، وكان كثير التحفظ حسن المحاورة يعظ الناس، ودخل بغداد سنة عشر وخمسمائة فأقام بها ثلاث سنين وظهر له قبول كثير عند العوام {cite:wafayat-ayan}."
  en: "al-Shahrastani (467–548) — the Ash'ari theologian of Nihayat al-Iqdam and al-Milal wa-l-Nihal, the landmark heresiography; preached at Baghdad 510–513 {cite:wafayat-ayan}."
  fr: "al-Shahrastani (467–548) – le théologien Ash'ari de Nihayat al-Iqdam et al-Milal wa-l-Nihal, l'hérésiographie historique  ; prêché à Bagdad 510–513 {cite:wafayat-ayan}."
  es: "al-Shahrastani (467–548): el teólogo Ash'ari de Nihayat al-Iqdam y al-Milal wa-l-Nihal, la heresiografía histórica; predicó en Bagdad 510–513 {cita:wafayat-ayan}."
  ur: "الشہرستانی (467-548) - نحیات الاقدام کے اشعری ماہر الہیات اور المال و النہال، تاریخی وراثت؛ بغداد 510-513 میں تبلیغ کی۔"
  tr: "Ebu el-Feth Muhammed bin Ebi el-Kasım Abdül-Kerim ibn Ebi Bekir Ahmed el-Şahrastani, Aş'ari okulunu takip eden bir ilahiyatçı; önde gelen bir imam, hukukçu ve ilahiyatçıydı. Ahmad el-Khawafi ve Ebu Nasr el-Kuşayri'nin yanında fıkıh eğitimi aldı, teoloji eğitimini Ebu el-Kasım el-Ensari'den aldı, sanatını öne çıkardı ve 'Nihayat al-Iqdam fi 'Ilm al-Kalam', 'Al-Milal wa al-Nihal', 'Mudari'ah' ve 'Talkhis al-Qasam li-Madhahib al-Anam' adlı eserleri yazdı. Çok titiz ve etkili bir şekilde insanlara öğüt verirdi. 500 H yılında Bağdat'a girdi, orada üç yıl kaldı ve halk arasında büyük kabul gördü {cite:wafayat-ayan}."
  id: "Abu al-Fath Muhammad ibn Abi al-Qasim Abd al-Karim ibn Abi Bakr Ahmad al-Shahrastani, seorang teolog yang mengikuti aliran Ash'ari; ia adalah imam, ahli hukum, dan teolog terkemuka. Ia mempelajari fiksi di bawah Ahmad al-Khawafi dan Abu Nasr al-Qushayri, mempelajari teologi di bawah Abu al-Qasim al-Ansari, membuktikan kemampuannya, dan menulis 'Nihayat al-Iqdam fi 'Ilm al-Kalam,' 'Al-Milal wa al-Nihal,' 'Mudari'ah,' dan 'Talkhis al-Qasam li-Madhahib al-Anam.' Ia sangat teliti dan fasih, memberikan nasihat kepada masyarakat. Ia memasuki Baghdad pada tahun 500 H, tinggal di sana selama tiga tahun, dan mendapat penerimaan besar di kalangan rakyat biasa {cite:wafayat-ayan}."
