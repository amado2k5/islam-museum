summary:
  ar: "عجوز كبيرة من بني فزارة في بيت شرف من قومها، كانت عند مالك بن حذيفة بن بدر؛ كانت العرب تقول: لو كنت أعز من أم قرفة ما زدت. أُسرت في غزوة زيد بن حارثة الثانية لفزارة بوادي القرى فأمر زيد قيس بن المسحّر بقتلها فقتلها قتلاً عنيفاً، وأُسرت بنتها فوهبها النبي لخاله حزن بن أبي وهب."
  en: "An aged woman of Banu Fazara from a noble house, wife of Malik ibn Hudhayfa ibn Badr; the Arabs said that no one could be mightier than Umm Qirfa. She was captured in Zayd ibn Haritha's second raid on Fazara at Wadi al-Qura and Zayd ordered Qays ibn al-Musahhar to kill her, which he did violently; her daughter was captured and the Prophet gave her to his maternal uncle Hazn ibn Abi Wahb."
