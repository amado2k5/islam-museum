roles: [tribal-leader]
summary:
  ar: "عجوز كبيرة من بني فزارة في بيت شرف من قومها، كانت عند مالك بن حذيفة بن بدر؛ كانت العرب تقول: لو كنت أعز من أم قرفة ما زدت. أُسرت في غزوة زيد بن حارثة الثانية لفزارة بوادي القرى فأمر زيد قيس بن المسحّر بقتلها فقتلها قتلاً عنيفاً، وأُسرت بنتها فوهبها النبي لخاله حزن بن أبي وهب."
  en: "An aged woman of Banu Fazara from a noble house, wife of Malik ibn Hudhayfa ibn Badr; the Arabs said that no one could be mightier than Umm Qirfa. She was captured in Zayd ibn Haritha's second raid on Fazara at Wadi al-Qura and Zayd ordered Qays ibn al-Musahhar to kill her, which he did violently; her daughter was captured and the Prophet gave her to his maternal uncle Hazn ibn Abi Wahb."
  es: "Una anciana de Banu Fazara, perteneciente a una familia noble, esposa de Malik ibn Hudhayfa ibn Badr; los árabes decían que nadie podía ser más poderosa que Umm Qirfa. Fue capturada en la segunda incursión de Zayd ibn Haritha en Fazara, en Wadi al-Qura, y Zayd ordenó a Qays ibn al-Musahhar que la matara, lo cual hizo violentamente; su hija fue capturada y el Profeta la entregó a su tío materno Hazn ibn Abi Wahb."
  fr: "Umm Qirfa, une femme âgée issue d'une famille noble de Banu Fazara et épouse de Malik ibn Hudhayfa ibn Badr, était réputée pour sa force et sa puissance auprès des Arabes. Capturée lors du second raid de Zayd ibn Haritha sur Fazara à Wadi al-Qura, elle fut tuée par Qays ibn al-Musahhar, qui s'exécuta avec violence. Sa fille fut également capturée, mais le Prophète la confia à son oncle maternel, Hazn ibn Abi Wahb."
  ur: "بنو فزارہ کی ایک بزرگ خاتون، مالک بن حذیفہ بن بدر کی بیوی؛ عربوں کا کہنا تھا کہ ام قرفہ سے بڑا کوئی نہیں ہو سکتا۔ وہ زید بن حارثہ کے فزارہ پر وادی القریٰ کے دوسرے چھاپے میں پکڑی گئی اور زید نے قیس بن المشہر کو اسے قتل کرنے کا حکم دیا، جو اس نے تشدد سے کیا۔ ان کی بیٹی کو پکڑ لیا گیا اور نبی نے اسے اپنے ماموں حزن بن ابی وہب کے حوالے کر دیا۔"
  tr: "Banu Fazara'dan yaşlı bir kadın, kabilesinden soylu bir evde, Malik ibn Hudhayfah ibn Badr ile birlikteydi; Araplar derdi ki: Eğer Um Karfa'dan daha onurlu olsaydım, artmazdım. Zeyd bin Haritha'nın köylerin vadisindeki Fazara'ya yaptığı ikinci seferde esir alındı, bu yüzden Zayd, Qays ibn al-Mushir'e onu öldürmesini emretti; onu şiddetle öldürdü ve Peygamber'in annesinin kardeşi Hazn bin Ebi Vahb'a hediye ettiği kızını yakaladı."
  id: "Seorang wanita tua dari Banu Fazara di rumah bangsawan dari sukunya, ia bersama Malik ibn Hudhayfah ibn Badr; orang Arab biasa berkata: Jika aku lebih terhormat daripada um Qarfa, aku tidak akan bertambah. Ia ditangkap dalam ekspedisi kedua Zayd ibn Haritha ke Fazara di lembah desa, sehingga Zayd memerintahkan Qays ibn al-Mushir untuk membunuhnya, membunuhnya dengan kekerasan, dan menangkap putrinya, yang diberikan Nabi kepada pamannya dari pihak ibu, Hazn ibn Abi Wahb."
