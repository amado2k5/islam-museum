summary:
  ar: "أبو محمد يحيى بن المبارك اليزيدي، تلميذ أبي عمرو بن العلاء وراوي قراءته، توفي سنة 202هـ عن أربع وسبعين سنة، وقيل جاوز التسعين؛ يقول ابن الجزري إنه كان ثقة علامة فصيحاً إماماً في اللغات والآداب، وأملى عن أبي عمرو وحده من حفظه عشرة آلاف ورقة {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  en: "Abu Muhammad Yahya ibn al-Mubarak al-Yazidi, pupil of Abu 'Amr ibn al-'Ala' and transmitter of his reading; he died in 202 AH aged seventy-four, or, by another report, beyond ninety. Ibn al-Jazari calls him reliable, learned, eloquent and an imam in the dialects and letters, and says he dictated from memory ten thousand leaves from Abu 'Amr alone {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  ur: "ابو محمد یحییٰ بن المبارک یزیدی، ابو عمرو بن العلاء کے شاگرد اور ان کی قراءت کے راوی؛ 202ھ میں چوہتر برس کی عمر میں فوت ہوئے، اور ایک قول میں نوے سے زیادہ؛ ابن الجزری انہیں ثقہ، علامہ، فصیح اور لغات و آداب کا امام کہتے ہیں اور بتاتے ہیں کہ انہوں نے صرف ابو عمرو سے دس ہزار اوراق زبانی املا کرائے {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  es: "Abu Muhammad Yahya ibn al-Mubarak al-Yazidi, discípulo de Abu 'Amr ibn al-'Ala' y transmisor de su lectura, falleció en el año 202 de la Hégira a la edad de setenta y cuatro años, o, según otro relato, a más de noventa. Ibn al-Jazari lo describe como fiable, erudito, elocuente e imán en dialectos y letras, y afirma que dictó de memoria diez mil hojas solo de Abu 'Amr {cite:nashr-dahman-damascus-1345-v1 p. 144}."
