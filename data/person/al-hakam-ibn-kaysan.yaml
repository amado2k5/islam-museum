summary:
  ar: مولى لبني مخزوم أُسر في سرية عبد الله بن جحش ⁦(نخلة)⁩، فأسلم عند النبي وقُتل شهيداً ببئر معونة؛ وكان حجّاماً في ما رواه الهيثم بن عدي.
  en: A client (mawla) of the Banu Makhzum, taken captive on the expedition of Abd Allah ibn Jahsh (Nakhla); he accepted Islam in the Prophet's presence and was killed at Bi'r Ma'una. Al-Haytham ibn Adi reports that he was a cupper by trade.
  fr: "Client (mawla) des Banu Makhzum, capturé lors de l’expédition d’Abd Allah ibn Jahsh (Nakhla) ; il embrassa l’islam en présence du Prophète et fut tué à Bi’r Ma’una. Al-Haytham ibn Adi rapporte qu’il exerçait le métier de praticien des ventouses."
  ur: "بنو مخزوم کے مولیٰ جو عبد اللہ بن جحش کی مہم ⁦(نخلہ)⁩ میں قیدی بنے؛ نبی کے حضور اسلام لائے اور فدک میں رہے۔"
  es: "Cliente (mawla) de los Banu Makhzum, capturado durante la expedición de Abd Allah ibn Jahsh (Nakhla); aceptó el Islam en presencia del Profeta y fue asesinado en Bi'r Ma'una. Al-Haytham ibn Adi relata que era cuprero de oficio."
  tr: "Banu Makhzum'un özgür bırakılmış bir adamıydı, Abdullah ibn Jahsh (Nakhla) seferinde esir alınmış, Peygamber ile birlikte İslam'a geçmiş ve Bir Ma'una'da şehit edilmiştir; el-Haytham bin Adi'nin anlattığına göre bir kupa ustasıydı."
  id: "Ia adalah mantan Banu Makhzum, ditangkap dalam ekspedisi Abdullah ibn Jahsh (Nakhla), memeluk Islam bersama Nabi, dan gugur di Bir Ma'una; ia adalah seorang seniman cupping menurut cerita al-Haytham ibn Adi."
