summary:
  ar: مولى لبني مخزوم أُسر في سرية عبد الله بن جحش (نخلة)، فأسلم عند النبي وقُتل شهيداً ببئر معونة؛ وكان حجّاماً في ما رواه الهيثم بن عدي.
  en: A client (mawla) of the Banu Makhzum, taken captive on the expedition of Abd Allah ibn Jahsh (Nakhla); he accepted Islam in the Prophet's presence and was killed at Bi'r Ma'una. Al-Haytham ibn Adi reports that he was a cupper by trade.
