provenance:
  layer: own-research
  source: "Turkish and Persian Wikipedia articles on the poet Ahmed Pasha, the TDV İslâm Ansiklopedisi entry AHMED PAŞA, Bursalı by Günay Kut (vol. 2, 1989), and Wikidata Q3652239, each read in full at the revision recorded in its source file (revisions fetched live from the MediaWiki API on 1 November 2026; the Wikidata revision re-asserted against a second live query; the QID grounded from the Turkish article's own page property). Identity was pinned against the two traps of this name: Hersekli (Hersekzade) Ahmed Pasha the grand vizier, who has his own record, and Ahmad Pasha ibn Khidr Beg, the Bursa mufti who died in 933/1526–27 and also has a record — this man is the kazasker's son Veliyyüddin Efendi's son, the poet. Bursa has a place entity, so the died_in and buried_in edges are written; the contested birthplace has none. The student_of edge targets person/melihi, at present a draft card, on the TDV entry's explicit statement that Melîhî was his teacher. His father Veliyyüddin Efendi has no record, so the parentage is prose-only."
