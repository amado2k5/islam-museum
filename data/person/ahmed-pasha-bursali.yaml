summary:
  ar: "أحمد باشا البرسوي ⁦(نحو 1426 – 1496/97)⁩، شاعر الديوان الذي لقّبه عصره «سلطان الشعراء»، وعالم من علماء الدولة العثمانية: ابن وليّ الدين أفندي قاضي عسكر مراد الثاني، درّس في مدرسة المرادية ببرسا، ثم خلف الملا خسرو في قضاء أدرنة سنة 1451، وصار قاضي عسكر ومصاحبًا ومعلّمًا لمحمد الفاتح وبلغ رتبة الوزارة، ثم غضب عليه السلطان فسُجن ونجا بقصيدته المشهورة «كرم»، وقضى بقية عمره بين ولايات الأناضول وبرسا التي مات فيها ودُفن في تربته قرب المرادية."
  en: "Ahmed Pasha of Bursa (c. 1426 – 1496/97), the divan poet his age called 'sultan of poets' and a statesman-scholar of the early Ottoman Empire: son of Veliyyüddin Efendi, kazasker of Murad II, he taught at Bursa's Muradiye Madrasa, succeeded Molla Hüsrev as qadi of Edirne in 1451, rose to kazasker, companion and tutor to Mehmed II and the rank of vizier, then fell from favour, was imprisoned, and saved himself with his famous 'Kerem' qasida; he spent his last years between Anatolian sancak posts and Bursa, where he died and was buried in his türbe beside the Muradiye."
  ur: "احمد پاشا بورسوی ⁦(تقریباً 1426ء – 1496/97ء)⁩، دیوان کے شاعر جنھیں ان کے عہد نے «سلطان الشعراء» کہا، اور ابتدائی عثمانی سلطنت کے عالم و ریاستی شخصیت: مراد ثانی کے قاضی عسکر ولی الدین آفندی کے بیٹے؛ برسا کی مرادیہ مدرسہ میں پڑھایا، 1451ء میں ملا خسرو کے بعد ادرنہ کے قاضی بنے، پھر قاضی عسکر، محمد فاتح کے مصاحب و اتالیق اور وزیر کے رتبے تک پہنچے، پھر سلطان کی ناراضی سے قید ہوئے اور اپنی مشہور «کرم» قصیدے سے جان بچائی؛ آخری برس اناطولیہ کی سنجقوں اور برسا میں گزارے، جہاں وفات پائی اور مرادیہ کے قریب اپنے تربے میں دفن ہوئے۔"
  es: "Ahmed Pasha de Bursa (c. 1426 – 1496/97), el poeta diván al que su época llamó 'sultán de los poetas' y un estadista y erudito del Imperio Otomano temprano: hijo de Veliyyüddin Efendi, kazasker de Murad II, enseñó en la madrasa Muradiye de Bursa, sucedió a Molla Hüsrev como cadí de Edirne en 1451, ascendió a kazasker, compañero y tutor de Mehmed II y al rango de visir, luego cayó en desgracia, fue encarcelado y se salvó con su famosa qasida 'Kerem'; pasó sus últimos años entre puestos sancak de Anatolia y Bursa, donde murió y fue enterrado en su tumba junto a la Muradiye."
  fr: "Ahmed Pacha de Bursa (vers 1426 – 1496/97), poète divan surnommé à son époque « sultan des poètes » et homme d'État-érudit du début de l'Empire ottoman: fils de Veliyyüddin Efendi, cazasker de Murad II, il enseigna à la madrasa Muradiye de Bursa, succéda à Molla Hüsrev comme cadi d'Edirne en 1451, devint cazasker, compagnon et précepteur de Mehmed II et obtint le rang de vizir, puis tomba en disgrâce, fut emprisonné et se sauva grâce à sa célèbre qasida « Kerem »; il passa ses dernières années entre les postes de sancak anatoliens et Bursa, où il mourut et fut enterré dans son türbe à côté de la Muradiye."
  tr: "Ahmed Paşa el-Bursavi (yaklaşık 1426 – 1496/97), Divan şairi, döneminde “Şairler Sultanı” lakabıyla anılan ve Osmanlı devletinin bir alimiydi: Murad II'nin baş kadısı Veli el-Din Efendi'nin oğluydu. Bursa'daki Muradiyye Okulu'nda öğretmenlik yaptıktan sonra, 1451'de Edirne'de Molla Husraw'ın yerine yargıç oldu. Baş kadı, Fatih Sultan Muhammed'in arkadaşı ve öğretmeni oldu ve bakanlık rütbesine yükseldi. Bunun üzerine Sultan ona kızdı ve hapsedildi, ancak ünlü şiiri “Karam” ile birlikte kaçtı. Hayatının geri kalanını Anadolu ve Bursa illeri arasında geçirdi ve burada Muradiyye yakınlarındaki türbesine defnedildi."
  id: "Ahmed Pasha al-Bursawi (sekitar 1426 – 1496/97), penyair Divan, yang pada zamannya dijuluki \"Sultan Para Penyair,\" dan seorang cendekiawan negara Ottoman: putra Wali al-Din Efendi, hakim kepala Murad II. Ia mengajar di Sekolah Muradiyya di Bursa, kemudian menggantikan Mulla Khusraw di peradilan Edirne pada tahun 1451. Ia menjadi hakim kepala, sahabat, dan guru Muhammad Sang Penakluk, dan mencapai pangkat menteri. Kemudian Sultan marah kepadanya, sehingga ia dipenjara dan melarikan diri dengan puisinya yang terkenal \"Karam.\" Ia menghabiskan sisa hidupnya di antara provinsi Anatolia dan Bursa, tempat ia meninggal dan dimakamkan di makamnya dekat Muradiyya."

