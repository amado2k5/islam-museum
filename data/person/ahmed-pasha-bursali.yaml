  note: "Neither his birth date nor his birthplace is certainly known. Fuad Köprülü reasoned (in the İslâm Ansiklopedisi article, quoted by the Turkish article) that he was born shortly before or after 830/1426. For the place, the tezkires divide: Latifi and Gelibolulu Âlî say Bursa; Sehi, Beliğ and Âşık Çelebi — the last on the word of the poet's cousin and heir, Edirneli Nazır Çelebi — say Edirne; the TDV entry concludes 'in all likelihood Edirne', and the Persian article also gives Edirne. Because the sources divide, no born_in edge is written and the birthplace is carried in this note and the prose only."
  sources: [source/wikipedia-ahmed-pasha-tr, source/tdv-ahmed-pasa-bursali, source/wikipedia-ahmed-pasha-fa, source/wikidata-ahmed-pasha]

