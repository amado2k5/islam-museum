    note: "No source read names a legal school for Ahmed Pasha, and none is recorded. His documented practice is stated in full: a career member of the Ottoman ulema — müderris at the Muradiye, qadi of Edirne, kazasker, and in the army nicknamed 'sipahi müftüsü' for his meticulousness (TDV entry) — whose Divan opens with a münacat and a na't to the Prophet. Office, teaching and judgeship in a Hanafi-administered state are not a personal attestation of a school in this lane, and neither the TDV entry nor the articles make one. Wikidata carries no religion value."
