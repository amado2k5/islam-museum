summary:
  ar: "أحمد باشا البرسوي (نحو 1426 – 1496/97)، شاعر الديوان الذي لقّبه عصره «سلطان الشعراء»، وعالم من علماء الدولة العثمانية: ابن وليّ الدين أفندي قاضي عسكر مراد الثاني، درّس في مدرسة المرادية ببرسا، ثم خلف الملا خسرو في قضاء أدرنة سنة 1451، وصار قاضي عسكر ومصاحبًا ومعلّمًا لمحمد الفاتح وبلغ رتبة الوزارة، ثم غضب عليه السلطان فسُجن ونجا بقصيدته المشهورة «كرم»، وقضى بقية عمره بين ولايات الأناضول وبرسا التي مات فيها ودُفن في تربته قرب المرادية."
  en: "Ahmed Pasha of Bursa (c. 1426 – 1496/97), the divan poet his age called 'sultan of poets' and a statesman-scholar of the early Ottoman Empire: son of Veliyyüddin Efendi, kazasker of Murad II, he taught at Bursa's Muradiye Madrasa, succeeded Molla Hüsrev as qadi of Edirne in 1451, rose to kazasker, companion and tutor to Mehmed II and the rank of vizier, then fell from favour, was imprisoned, and saved himself with his famous 'Kerem' qasida; he spent his last years between Anatolian sancak posts and Bursa, where he died and was buried in his türbe beside the Muradiye."
  ur: "احمد پاشا بورسوی (تقریباً 1426ء – 1496/97ء)، دیوان کے شاعر جنھیں ان کے عہد نے «سلطان الشعراء» کہا، اور ابتدائی عثمانی سلطنت کے عالم و ریاستی شخصیت: مراد ثانی کے قاضی عسکر ولی الدین آفندی کے بیٹے؛ برسا کی مرادیہ مدرسہ میں پڑھایا، 1451ء میں ملا خسرو کے بعد ادرنہ کے قاضی بنے، پھر قاضی عسکر، محمد فاتح کے مصاحب و اتالیق اور وزیر کے رتبے تک پہنچے، پھر سلطان کی ناراضی سے قید ہوئے اور اپنی مشہور «کرم» قصیدے سے جان بچائی؛ آخری برس اناطولیہ کی سنجقوں اور برسا میں گزارے، جہاں وفات پائی اور مرادیہ کے قریب اپنے تربے میں دفن ہوئے۔"

