  calendar: julian
  precision: year
  status: debated
  derived: true
  note: "The TDV entry heads his life with the death year 902 AH, which spans 1496–97 CE, and no source read resolves it further: the Turkish article's heading gives 1497 while its text says 1496 (printing a corrupt Hijri year), the Persian article gives 1496, and Wikidata carries both 1496 and 1497 as competing values. The record follows 1497 within the attested span and preserves 1496 here. He died at Bursa, as sancakbeyi of the city under Bayezid II, and was buried in the türbe he had built beside the Muradiye Madrasa."
  sources: [source/tdv-ahmed-pasa-bursali, source/wikipedia-ahmed-pasha-tr, source/wikipedia-ahmed-pasha-fa, source/wikidata-ahmed-pasha]

