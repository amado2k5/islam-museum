summary:
  ar: "الحافظ البغدادي المعروف بالساجي؛ حافظ محقق واسع الرحلة كثير الكتابة متين الورع والديانة، روى عن أبي الحسين بن النقور وأبي بكر الخطيب وطبقتهما بالشام والعراق وأصبهان وخراسان، وتفقه وكتب الشامل عن مؤلفه ابن الصباغ؛ توفي في صفر سنة سبع وخمسمائة عن اثنتين وستين سنة {cite:shadharat-dhahab p. 500}."
  en: "The Baghdadi hafiz al-Mu'taman al-Saji — a wide-travelling, prolific, deeply scrupulous scholar who transmitted from Ibn al-Naqur and al-Khatib al-Baghdadi's tier and copied Ibn al-Sabbagh's Shamil from its author; d. Safar 507 at sixty-two {cite:shadharat-dhahab p. 500}."
