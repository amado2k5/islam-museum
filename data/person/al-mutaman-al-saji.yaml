names:
  - { value: "المؤتمن بن أحمد بن علي بن نصر الربعي البغدادي", kind: full }
summary:
  ar: "الحافظ البغدادي المعروف بالساجي؛ حافظ محقق واسع الرحلة كثير الكتابة متين الورع والديانة، روى عن أبي الحسين بن النقور وأبي بكر الخطيب وطبقتهما بالشام والعراق وأصبهان وخراسان، وتفقه وكتب الشامل عن مؤلفه ابن الصباغ؛ توفي في صفر سنة سبع وخمسمائة عن اثنتين وستين سنة {cite:shadharat-dhahab p. 500}."
  en: "The Baghdadi hafiz al-Mu'taman al-Saji — a wide-travelling, prolific, deeply scrupulous scholar who transmitted from Ibn al-Naqur and al-Khatib al-Baghdadi's tier and copied Ibn al-Sabbagh's Shamil from its author; d. Safar 507 at sixty-two {cite:shadharat-dhahab p. 500}."
  fr: "Le Baghdadi hafiz al-Mu'taman al-Saji - un érudit à grand voyage, prolifique, profondément scrupuleux qui a transmis d'Ibn al-Naqur et al-Khatib al-Baghdadi niveau et copié Shamil Ibn al-Sabbagh de son auteur ; d. Safar 507 à soixante-deux ans {cite:shadharat-dhahab p. 500}."
  es: "El bagdadí hafiz al-Mu'taman al-Saji, un erudito prolífico, profundamente escrupuloso, que viajó mucho y que transmitió desde el nivel de Ibn al-Naqur y al-Khatib al-Baghdadi y copió el Shamil de Ibn al-Sabbagh de su autor; d. Safar 507 a los sesenta y dos {cita: shadharat-dhahab p. 500}."
  ur: "بغدادی حافظ المتعمان الساجی - ایک وسیع سفر کرنے والا، پرکشش، گہرا علمبردار جس نے ابن النقور اور الخطیب البغدادی کے درجے سے نقل کیا اور ابن الصباغ کی شمل کو اس کے مصنف سے نقل کیا؛ d صفر 507 بمطابق باسٹھ {حوالہ: شدّرت ذہاب ص۔ 500}۔"
