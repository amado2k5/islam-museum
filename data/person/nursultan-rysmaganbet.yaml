summary:
  ar: "داعية كازاخستاني على الإنترنت، عدّت دراسة محكّمة متابعي حسابه الشخصي على إنستغرام بنحو 864 ألف متابع في يناير 2025؛ وتنتشر محاضراته على نطاق أوسع عبر قناة الاستوديو «ÁLI stýdıasy» على يوتيوب ⁦(نحو 1.09 مليون مشترك)⁩، وهي قناة توزيع لا يملكها."
  en: "A Kazakhstani online preacher whose personal Instagram account counted 864 thousand followers in a peer-reviewed study (January 2025); his sermons circulate more widely through the ÁLI stýdıasy studio channel on YouTube (about 1.09 million subscribers), a distribution channel he does not own."
  ur: "نورسلطان ریسماگانبیت قازقستان کے آن لائن مبلغ ہیں؛ ایک محققانہ مطالعے کے مطابق جنوری 2025 میں ان کے ذاتی انسٹاگرام حساب کے تقریباً 864 ہزار فالوورز تھے۔ ان کے خطبات اس سے وسیع تر پیمانے پر یوٹیوب کی اسٹوڈیو چینل «ÁLI stýdıasy» ⁦(تقریباً 1.09 ملین سبسکرائبر)⁩ کے ذریعے پھیلتے ہیں، جو ایک تقسیمی چینل ہے، ان کی ملکیت نہیں۔"
  es: "Un predicador kazajo en línea cuya cuenta personal de Instagram contaba con 864 mil seguidores en un estudio revisado por pares (enero de 2025); sus sermones circulan más ampliamente a través del canal de estudio ÁLI stýdıasy en YouTube (alrededor de 1,09 millones de suscriptores), un canal de distribución que no le pertenece."
  fr: "Un prédicateur kazakh en ligne dont le compte Instagram personnel comptait 864 000 abonnés dans une étude évaluée par des pairs (janvier 2025); ses sermons circulent plus largement via la chaîne du studio ÁLI stýdıasy sur YouTube (environ 1,09 million d'abonnés), un canal de distribution qu'il ne possède pas."
  tr: "Kazak çevrimiçi vaiz olan Stüdyo, kişisel Instagram hesap takipçilerini detaylı bir şekilde inceledi; Ocak 2025'te yaklaşık 864.000 takipçi sayısı var; konferansları, kendisinin sahip olmadığı stüdyonun YouTube kanalı \"ÁLI stýdıasy\" (yaklaşık 1,09 milyon abone) üzerinden geniş çapta dağıtılıyor."
  id: "Sebagai pengkhotbah daring Kazakhstan, studi mendalam terhadap pengikut akun Instagram pribadinya mencatat sekitar 864.000 pengikut pada Januari 2025; kuliahnya didistribusikan secara luas melalui saluran YouTube studio \"ÁLI stýdıasy\" (sekitar 1,09 juta pelanggan), saluran distribusi yang bukan miliknya."
