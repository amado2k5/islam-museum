summary:
  ar: "شاعر وصحفي وكاتب فلسطيني وُلد في يافا ودرس في الأزهر، واستقر في القاهرة فعمل بالصحافة وأسّس مجلة «الإنسانية» (1903) وحرّر صحف الحزب الوطني المصري، وجمع ابن أخيه مصطفى مراد الدباغ ديوانه في جزأين بعد وفاته."
  en: "Palestinian poet, journalist and writer born in Jaffa and trained at al-Azhar. Settled in Cairo, he worked in journalism, founded the magazine al-Insaniyya in 1903 and edited newspapers of Egypt's National Party; his nephew Mustafa Murad al-Dabbagh collected his diwan in two volumes after his death."
  ur: "فلسطینی شاعر، صحافی اور مصنف، یافا میں پیدا ہوئے اور الازہر میں پڑھے۔ قاہرہ میں سکونت اختیار کر کے صحافت سے وابستہ رہے، 1903 میں مجلہ «الانسانیہ» جاری کیا اور مصر کی نیشنل پارٹی کے اخبارات کی ادارت کی؛ ان کے بھتیجے مصطفی مراد الدباغ نے ان کا دیوان بعد از وفات دو جلدوں میں مرتب کیا۔"
