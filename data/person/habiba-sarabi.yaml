summary:
  ar: "طبيبة دم أفغانية وسياسية ومصلحة، وُلدت سنة 1956. فرّت مع أطفالها إلى بيشاور في حكم طالبان الأول وعملت سرًّا معلّمة للبنات. خلفت سيما سمر وزيرةً لشؤون المرأة (2002–2004)، ثم عيّنها الرئيس كرزاي سنة 2005 حاكمة لولاية باميان فصارت أول امرأة تتولى حاكمية ولاية في تاريخ أفغانستان، وبقيت في المنصب حتى 2013. نالت جائزة رامون ماغسايساي سنة 2013، وكانت عضوة في فريق الحكومة الأفغانية المفاوض للسلام مع طالبان سنة 2020. اسمها يُكتب أحيانًا ساروبي."
  en: "Afghan hematologist, politician and reformer, born in 1956. During the first Taliban rule she fled with her children to Peshawar and worked underground as a teacher of girls. She succeeded Sima Samar as Minister of Women's Affairs (2002–2004), and in 2005 President Karzai appointed her Governor of Bamyan province — the first woman to govern an Afghan province — a post she held until 2013. She received the Ramon Magsaysay Award in 2013 and sat on the Afghan government's peace negotiation team with the Taliban in 2020. Her surname is sometimes spelled Sarobi."
  ur: "افغان ماہرِ امراضِ خون، سیاست دان اور مصلح، 1956ء میں پیدا ہوئیں۔ طالبان کے پہلے دور میں وہ بچوں کے ساتھ پشاور فرار ہوئیں اور خفیہ طور پر لڑکیوں کو پڑھاتی رہیں۔ وہ سیما سمر کے بعد وزیرِ امورِ خواتین بنیں (2002ء–2004ء)، پھر 2005ء میں صدر کرزئی نے انھیں بامیان صوبے کی گورنر مقرر کیا — افغانستان کی تاریخ میں کسی صوبے کی پہلی خاتون گورنر — اور وہ 2013ء تک اس عہدے پر رہیں۔ انھیں 2013ء میں رامون میگسیسے ایوارڈ ملا اور 2020ء میں وہ طالبان کے ساتھ حکومتی مذاکراتی ٹیم کی رکن تھیں۔ ان کا خاندانی نام کبھی ساروبی بھی لکھا جاتا ہے۔"
