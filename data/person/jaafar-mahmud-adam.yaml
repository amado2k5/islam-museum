summary:
  ar: "عالم نيجيري (1960–2007) من داورا، درس في الجامعة الإسلامية بالمدينة المنورة، وكان عضوا في جماعة إزالة البدعة وإقامة السنة (إزالا) وأشهر واعظي الشمال النيجيري، عُرف بتفسيره الرمضاني السنوي في مايدوغوري وتسجيلات دروسه المنتشرة. اغتيل بالرصاص أثناء صلاة الفجر في مسجده بكانو في 13 أبريل 2007."
  en: "Nigerian scholar (1960–2007) from Daura who studied at the Islamic University of Madinah. A member of the Izala Society and one of northern Nigeria's best-known preachers, he was famed for his annual Ramadan tafsir in Maiduguri and his widely distributed recorded lessons. He was shot dead during the dawn prayer in his Kano mosque on 13 April 2007."
  ur: "نائجریائی عالم (1960ء–2007ء)، دورہ سے تعلق، جامعہ اسلامیہ مدینہ منورہ کے فاضل۔ جماعتِ إزالہ کے رکن اور شمالی نائجریا کے مشہور ترین واعظوں میں سے ایک تھے؛ میدوگوری میں ان کی سالانہ رمضان تفسیر اور ریکارڈ شدہ دروس دور دور تک پھیلے۔ 13 اپریل 2007 کو کانو کی اپنی مسجد میں نمازِ فجر کے دوران گولی مار کر شہید کر دیے گئے۔"
