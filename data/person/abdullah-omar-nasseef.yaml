summary:
  ar: "عالم جيولوجيا ومسؤول سعودي (1939–2025) من جدة، مدير جامعة الملك عبد العزيز ⁦(1400–1403هـ)⁩، والأمين العام لرابطة العالم الإسلامي ⁦(1403–1414هـ / 1983–1993)⁩، ونائب رئيس مجلس الشورى، ورئيس مؤتمر العالم الإسلامي، ونال جائزة الملك فيصل لخدمة الإسلام (1991)."
  en: "Saudi geologist and public figure (1939–2025) from Jeddah, president of King Abdulaziz University (1400–1403 AH), secretary-general of the Muslim World League (1403–1414 AH / 1983–1993), deputy chairman of the Shura Council and president of the World Muslim Congress; King Faisal Prize for Service to Islam (1991)."
  ur: "جدہ کے سعودی ماہرِ ارضیات اور عوامی شخصیت ⁦(1939ء–2025ء)⁩، جامعہ ملک عبد العزیز کے سربراہ ⁦(1400–1403ھ)⁩، رابطہ عالمِ اسلامی کے سیکرٹری جنرل ⁦(1403–1414ھ / 1983ء–1993ء)⁩، مجلسِ شوریٰ کے نائب صدر اور موتمر عالمِ اسلامی کے صدر؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(1991ء)⁩۔"
