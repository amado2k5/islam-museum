summary:
  ar: "زعيم وسياسي ألباني من مرتفعات غياكوفا، قاد النضال من أجل استقلال ألبانيا ثم من أجل ضمّ كوسوفو إليها، وكان من قادة لجنة الدفاع الوطني عن كوسوفو ووزيراً للحرب سنة 1921، ومات سنة 1925 وهو يقاوم قوات زوغو."
  en: "Albanian chieftain and politician from the Highlands of Gjakova who fought for the independence of Albania and then for Kosovo's incorporation into it; a leader of the Committee for the National Defence of Kosovo and minister of war in 1921, he died in 1925 resisting Zogu's forces."
  ur: "گیاکووا کے پہاڑی علاقے سے تعلق رکھنے والے البانوی سردار اور سیاست دان، جنھوں نے البانیا کی آزادی اور پھر کوسوو کے اس میں انضمام کے لیے جدوجہد کی؛ کوسوو کی قومی دفاعی کمیٹی کے رہنما اور 1921 میں وزیرِ جنگ؛ 1925 میں زوغو کی افواج سے مزاحمت کرتے ہوئے وفات پائی۔"
