  calendar: gregorian
  precision: day
  status: historical
  derived: true
  note: "Died on 29 March 1925 in a cave near Dragobi (Dragobia), surrounded by government troops after the fall of the June 1924 revolution; the English biography says he was killed by his own companions so that their lives would be spared, the Albanian biography that he took his own life. The Hijri year 1343 is derived by conversion and is marked derived."
