  note: "Born on 16 January 1862 at Krushë e Madhe while his family was being taken under guard from Gjakova toward the prison at Prizren; the family came from Krasniqi in the Highlands of Gjakova. Most sources give 1862, but the English biography records that more recent sources based on his recently discovered passport give 1866 — hence debated. The Hijri year 1278 is derived by conversion and is marked derived. Krushë e Madhe, Gjakova and Prizren have no place entities on main, so the places are carried here."
