summary:
  ar: "سياسي سوفييتي من أسرة أوزبكية من خوجند (1896–1938): ترأس اللجنة التنفيذية المركزية لجمهورية تركستان (1920–1922)، وعمل أمينا مسؤولا للجنة المركزية للحزب الشيوعي الأوزبكي (1923–1925)، ثم رئيسا لمجلس مفوضي الشعب لجمهورية طاجيكستان السوفييتية (1933–1937). اعتُقل سنة 1937 وأُعدم في سجن ليفورتوفو بموسكو في 7 مايو 1938 ورُدّ اعتباره سنة 1956."
  en: "Soviet politician of an Uzbek family from Khujand (1896–1938): he chaired the Central Executive Committee of the Turkestan ASSR (1920–1922), served as responsible secretary of the Central Committee of the Communist Party of Uzbekistan (1923–1925), and chaired the Council of People's Commissars of the Tajik SSR (1933–1937). Arrested in 1937, he was shot in Moscow's Lefortovo Prison on 7 May 1938 and rehabilitated in 1956."
  ur: "خوجند کے ازبک خاندان سے تعلق رکھنے والے سوویت سیاست دان (1896–1938): ترکستان جمہوریہ کی مرکزی ایگزیکٹو کمیٹی کے صدر (1920–1922)، ازبکستان کی کمیونسٹ پارٹی کی مرکزی کمیٹی کے ذمہ دار سیکرٹری (1923–1925) اور پھر تاجک سوویت جمہوریہ کے مفوضینِ عوام کی کونسل کے صدر (1933–1937) رہے۔ 1937 میں گرفتار ہوئے، 7 مئی 1938 کو ماسکو کی لیفورتوو جیل میں گولی مار دیے گئے اور 1956 میں بحالِ حیثیت ہوئے۔"
