summary:
  ar: "قوام الدين ابن زبادة يحيى بن سعيد بن هبة الله الواسطي ثم البغدادي، صاحب ديوان الإنشاء ببغداد ومن انتهت إليه صناعة الترسل مع معرفته بالفقه والأصول والكلام والنحو والشعر؛ أخذ عن ابن الجواليقي وحدث عن علي بن الصباغ والقاضي الأرجاني، وولي نظر واسط ثم ولي حجابة الحجاب وغير ذلك؛ توفي في ذي الحجة سنة أربع وتسعين وخمسمائة {cite:shadharat-dhahab p. 798}."
  en: "Qiwam al-Din Ibn Zubada Yahya b. Sa'id, of Wasit then Baghdad; master of the diwan al-insha' and end of the line in the chancery art, with knowledge of fiqh, usul, kalam, grammar and verse; he studied under Ibn al-Jawaliqi, transmitted from Ibn al-Sabbagh and the qadi al-Arjani, held the nazr of Wasit then the chief hajaba; he died in Dhu al-Hijja 594 {cite:shadharat-dhahab p. 798}."
  es: "Qiwam al-Din Ibn Zubada Yahya b. Sa'id, de Wasit y luego de Bagdad; maestro del diwan al-insha' y último de la línea en el arte de la cancillería, con conocimiento de fiqh, usul, kalam, gramática y poesía; estudió con Ibn al-Jawaliqi, transmitido por Ibn al-Sabbagh y el cadí al-Arjani, ostentó el nazr de Wasit y luego el jefe hajaba; murió en Dhu al-Hijja 594 {cite:shadharat-dhahab p. 798}."
  fr: "Qiwam al-Din Ibn Zubada Yahya b. Sa'id, de Wasit puis Bagdad; maître du diwan al-insha' et dernier de la lignée dans l'art de la chancellerie, avec une connaissance du fiqh, de l'usul, du kalam, de la grammaire et de la poésie; il étudia sous Ibn al-Jawaliqi, transmis par Ibn al-Sabbagh et le qadi al-Arjani, occupa le nazr de Wasit puis le hajaba en chef; il mourut en Dhu al-Hijja 594 {cite: shadharat-dhahab p. 798}."
  ur: "قیام الدین ابن زبادہ یحییٰ بی۔ سعید، واسط پھر بغداد؛ فقہ، اصول، کلام، گرامر اور آیت کے علم کے ساتھ، دیوان الانشا کے ماسٹر اور چانسری آرٹ میں لائن آف لائن؛ اس نے ابن الجوالقی کے تحت تعلیم حاصل کی، جو ابن الصباح اور قضاء الارجانی سے منقول ہے، اس وقت کے چیف حجابہ واسط کے ناظر تھے۔ آپ کی وفات ذی الحجہ 594 میں ہوئی۔ 798}۔"
  tr: "Bağdat'taki Diwan al-Insha'nın sahibi, hukuk, ilkeler, teoloji, dilbilgisi ve şiir bilgisine rağmen mercan aktarımında ustaydı; İbn al-Jawaliqi'nin yanında eğitim aldı, Ali ibn al-Sabbagh ve Qadi al-Arcani'den rivayet etti, Wasit'in sorumluluğunu üstlendi ve ardından başörtüsü ve diğer görevleri üstlendi; Dhicace'da beş yüz doksan dört yılında Zhu'l-Hicce'de vefat etti {atıf:Shadharat-Dhahab, s. 798}."
  id: "Qawam al-Din Ibn Zubadah Yahya ibn Sa'id ibn Hibat Allah al-Wasiti saat itu al-Baghdadi, pemilik Diwan al-Insha di Baghdad, yang merupakan ahli dalam seni transmisi karang meskipun memiliki pengetahuan tentang hukum, prinsip, teologi, tata bahasa, dan puisi; ia belajar di bawah bimbingan Ibn al-Jawaliqi, yang diceritakan dari Ali ibn al-Sabbagh dan Qadi al-Arjani, memimpin Wasit dan kemudian mengambil peran sebagai hijab dan tugas lainnya; ia meninggal di Dhu al-Hijjah pada tahun lima ratus sembilan puluh empat {cite:shadharat-dhahab, hlm. 798}."
