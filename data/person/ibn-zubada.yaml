summary:
  ar: "قوام الدين ابن زبادة يحيى بن سعيد بن هبة الله الواسطي ثم البغدادي، صاحب ديوان الإنشاء ببغداد ومن انتهت إليه صناعة الترسل مع معرفته بالفقه والأصول والكلام والنحو والشعر؛ أخذ عن ابن الجواليقي وحدث عن علي بن الصباغ والقاضي الأرجاني، وولي نظر واسط ثم ولي حجابة الحجاب وغير ذلك؛ توفي في ذي الحجة سنة أربع وتسعين وخمسمائة {cite:shadharat-dhahab p. 798}."
  en: "Qiwam al-Din Ibn Zubada Yahya b. Sa'id, of Wasit then Baghdad; master of the diwan al-insha' and end of the line in the chancery art, with knowledge of fiqh, usul, kalam, grammar and verse; he studied under Ibn al-Jawaliqi, transmitted from Ibn al-Sabbagh and the qadi al-Arjani, held the nazr of Wasit then the chief hajaba; he died in Dhu al-Hijja 594 {cite:shadharat-dhahab p. 798}."
