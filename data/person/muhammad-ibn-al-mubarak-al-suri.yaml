summary:
  ar: "أبو عبد الله محمد بن المبارك الصوري، زاهد عالم بالحديث، ذو عقل وورع وبيان، تُروى عنه في «حلية الأولياء» أقوال في الإخلاص والإيمان ومحاورة في معرفة الله وطريق الآخرة."
  en: "Abu Abd Allah Muhammad ibn al-Mubarak al-Suri, an ascetic and transmitter of hadith known for judgment, piety and eloquence; Hilyat al-Awliya relates his sayings on sincerity and an exchange on knowledge of God and the road to the afterlife."
  ur: "ابو عبد اللہ محمد بن المبارک صوری ایک زاہد اور حدیث کے راوی تھے، جو عقل، تقویٰ اور بیان میں مشہور تھے۔ «حلیۃ الاولیاء» میں ان کے اخلاص اور ایمان پر اقوال اور معرفتِ الٰہی اور آخرت کے راستے پر ایک مکالمہ نقل ہوا ہے۔"
  es: "Abu Abd Allah Muhammad ibn al-Mubarak al-Suri, un asceta y transmisor de hadices conocido por su juicio, piedad y elocuencia; Hilyat al-Awliya relata sus dichos sobre la sinceridad y un intercambio sobre el conocimiento de Dios y el camino hacia la otra vida."
  fr: "Abu Abd Allah Muhammad ibn al-Mubarak al-Suri, ascète et transmetteur de hadiths connu pour son jugement, sa piété et son éloquence; Hilyat al-Awliya relate ses paroles sur la sincérité et un échange sur la connaissance de Dieu et le chemin vers l'au-delà."
