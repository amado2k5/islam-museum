summary:
  ar: "محامٍ من ليفربول (1856-1932) اعتنق الإسلام سنة 1887 وأسس معهد ليفربول الإسلامي، أول مسجد عامل في إنجلترا (1889)، ومنحه السلطان العثماني عبد الحميد الثاني لقب شيخ الإسلام للجزر البريطانية؛ يُنسب إليه اهتداء نحو ستمائة بريطاني."
  en: "Liverpool solicitor (1856-1932) who converted to Islam in 1887 and founded the Liverpool Muslim Institute, England's first functioning mosque (1889); the Ottoman Sultan Abdul Hamid II granted him the title of Shaykh al-Islam of the British Isles, and some 600 British converts are credited to his preaching."
  ur: "لیورپول کے وکیل (1856ء–1932ء) جنہوں نے 1887ء میں اسلام قبول کیا اور لیورپول مسلم انسٹی ٹیوٹ قائم کیا، جو انگلستان کی پہلی فعال مسجد تھی (1889ء)؛ عثمانی سلطان عبد الحمید ثانی نے انہیں جزائر برطانیہ کے شیخ الاسلام کا خطاب دیا، اور تقریباً چھ سو برطانویوں کی ہدایت انہی سے منسوب ہے۔"
