summary:
  ar: "محامٍ من ليفربول (1856-1932) اعتنق الإسلام سنة 1887 وأسس معهد ليفربول الإسلامي، أول مسجد عامل في إنجلترا (1889)، ومنحه السلطان العثماني عبد الحميد الثاني لقب شيخ الإسلام للجزر البريطانية؛ يُنسب إليه اهتداء نحو ستمائة بريطاني."
  en: "Liverpool solicitor (1856-1932) who converted to Islam in 1887 and founded the Liverpool Muslim Institute, England's first functioning mosque (1889); the Ottoman Sultan Abdul Hamid II granted him the title of Shaykh al-Islam of the British Isles, and some 600 British converts are credited to his preaching."
  ur: "لیورپول کے وکیل ⁦(1856ء–1932ء)⁩ جنہوں نے 1887ء میں اسلام قبول کیا اور لیورپول مسلم انسٹی ٹیوٹ قائم کیا، جو انگلستان کی پہلی فعال مسجد تھی ⁦(1889ء)⁩؛ عثمانی سلطان عبد الحمید ثانی نے انہیں جزائر برطانیہ کے شیخ الاسلام کا خطاب دیا، اور تقریباً چھ سو برطانویوں کی ہدایت انہی سے منسوب ہے۔"
  fr: "Avocat de Liverpool (1856-1932) converti à l'islam en 1887, qui fonda le Liverpool Muslim Institute, première mosquée en activité d'Angleterre (1889) ; le sultan ottoman Abdülhamid II lui conféra le titre de cheikh al-islam des îles Britanniques, et quelque 600 convertis britanniques sont attribués à sa prédication."
  es: "Abogado de Liverpool (1856-1932) que se convirtió al Islam en 1887 y fundó el Instituto Musulmán de Liverpool, la primera mezquita en funcionamiento de Inglaterra (1889); el sultán otomano Abdul Hamid II le otorgó el título de Shaykh al-Islam de las Islas Británicas, y se le atribuyen unos 600 conversos británicos a sus prédicas."
  tr: "Liverpoollu bir avukat (1856-1932), 1887'de İslamiyet'i kabul etti ve İngiltere'deki ilk faal cami olan Liverpool İslam Enstitüsü'nü (1889) kurdu. Osmanlı Sultanı II. Abdülhamid tarafından Britanya Adaları Şeyhü'l-İslam unvanı verildi; yaklaşık alt yüz Britanyalının İslamiyet'e geçmesi ona atfedilir."
  id: "Seorang pengacara dari Liverpool (1856-1932) masuk Islam pada tahun 1887 dan mendirikan Institut Islam Liverpool, masjid pertama yang berfungsi di Inggris (1889). Ia dianugerahi gelar Sheikh al-Islam Kepulauan Inggris oleh Sultan Ottoman Abdul Hamid II; sekitar enam ratus warga Inggris diislamkan berkat dirinya."
