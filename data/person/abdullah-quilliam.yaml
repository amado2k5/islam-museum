    note: "FLAGGED for a founder ruling. His scholarly biographer Ron Geaves reports that Quilliam 'defined himself as an Ottoman Hanafi with an allegiance to traditional Islam', that he considered the Wahhabi movement a rebellion against the legitimate Sunni Caliphate, and that there is no evidence he belonged to a Sufi order. That is a single scholarly family, however: no second independent source names a school for him — the English, Arabic and Urdu articles and Wikidata give Islam only — so under the two-source rule the value stays unknown pending a ruling, with the Hanafi self-definition preserved here. His Ottoman title of Shaykh al-Islam of the British Isles and his Afghan and Persian appointments are honours and offices, which never count."
