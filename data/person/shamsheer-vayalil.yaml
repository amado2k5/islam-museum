summary:
  ar: "شمشير فاياليل (وُلد في 11 كانون الثاني 1977) طبيب أشعة ورجل أعمال هندي في مجال الرعاية الصحية من كوزيكود بولاية كيرالا، مؤسس مجموعة برجيل القابضة (التي بُنيت باسم في بي إس للرعاية الصحية) ورئيس مجلس إدارتها، التي نمت من أول مستشفى له في أبوظبي سنة 2007 إلى شبكة من المستشفيات والمراكز الطبية في الشرق الأوسط والهند. نال وسام برافاسي بهاراتيا سامان سنة 2014."
  en: "Shamsheer Vayalil (born 11 January 1977) is an Indian radiologist and healthcare entrepreneur from Kozhikode in Kerala, founder and chairman of Burjeel Holdings, built as VPS Healthcare, which grew from his first hospital in Abu Dhabi in 2007 into a network of hospitals and medical centres across the Middle East and India. He received the Pravasi Bharatiya Samman in 2014."
  ur: "شمشیر وائلل (پیدائش 11 جنوری 1977) کیرالا کے کالیکٹ سے تعلق رکھنے والے بھارتی ماہر شعاعیات اور صحت کے کاروباری ہیں، برجیل ہولڈنگز (جو وی پی ایس ہیلتھ کیئر کے طور پر بنی) کے بانی و چیئرمین، جو 2007 میں ابوظہبی میں ان کے پہلے اسپتال سے مشرق وسطیٰ و بھارت میں اسپتالوں اور طبی مراکز کے جال میں بدلی۔ انھیں 2014 میں پرواسی بھارتیا سمان ملا۔"
