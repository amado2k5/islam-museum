summary:
  ar: "مشير (مارشال) ورجل دولة تركي، أحد مشيرَي تركيا الاثنين إلى جانب مصطفى كمال أتاتورك. قاد الفيلق الخامس في غاليبولي، وتولى رئاسة الأركان ونظارة الحربية في الدولة العثمانية، ثم كان وزير دفاع حكومة أنقرة ورئيس حكومتها، فرئيس أركان الجمهورية الأول من 1921 إلى 1944. وبعد تقاعده دخل البرلمان وشارك في تأسيس حزب الأمة، وتوفي في إسطنبول سنة 1950 فشيّعته جنازة شعبية حاشدة."
  en: "Turkish field marshal and statesman, with Mustafa Kemal Atatürk one of Turkey's only two marshals. He commanded the V Corps at Gallipoli, served as Ottoman Chief of the General Staff and Minister of War, then as the Ankara government's Minister of Defense and Prime Minister, and as the Republic's first Chief of the General Staff from 1921 to 1944. After retiring he sat in parliament and co-founded the Nation Party; his death at Istanbul in 1950 drew a vast popular funeral."
  ur: "ترک فیلڈ مارشل اور مدبر، مصطفی کمال اتاترک کے ساتھ ترکی کے صرف دو مارشلوں میں سے ایک۔ انہوں نے گیلی پولی میں پانچویں کور کی قیادت کی، عثمانی چیف آف جنرل سٹاف اور وزیرِ حرب رہے، پھر انقرہ حکومت کے وزیرِ دفاع اور وزیرِ اعظم بنے، اور 1921 سے 1944 تک جمہوریہ کے پہلے چیف آف جنرل سٹاف رہے۔ ریٹائرمنٹ کے بعد وہ پارلیمان کے رکن اور نیشن پارٹی کے شریک بانی رہے؛ 1950 میں اسطنبول میں ان کی وفات پر ایک عظیم عوامی جنازہ نکلا۔"
