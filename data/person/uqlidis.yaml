class: person
label: { ar: "إقليدس", en: "Uqlidis", es: "Uqlidis", fr: "Uqlidis", ur: "اقلیدس" }
summary:
  ar: "إقليدس بن نوقطرس بن برنيقس صاحب الجومطريا ومعناها الهندسة المظهر للهندسة المبرز فيها، أقدم من أرشميدس وغيره وهو من الفلاسفة الرياضيين، وكتابه في أصول الهندسة واسمه الاسطروشيا نقله الحجاج بن يوسف بن مطر نقلين أحدهما يعرف بالهاروني وهو الأول ونقله ثانيا وهو المأموني وعليه يعول، ونقله إسحاق بن حنين وأصلحه ثابت بن قرة الحراني ونقل أبو عثمان الدمشقي منه مقالات، وفسره وشرح شكوكه أيون وشرحه النيريزي وللجوهرى شرح من أوله إلى آخره وللماهاني شرح المقالة الخامسة، وذكر الكندي في رسالته في أغراض كتاب إقليدس أن هذا الكتاب ألفه رجل يقال له أبلينس النجار ورسمه خمسة عشر قولا فلما تقادم عهده وأتهمل تحرك بعض ملوك الاسكندرانية لطلب علم الهندسة وكان على عهده إقليدس فأمره بإصلاحه وتفسيره ففعل فنسب إليه، ثم وجد بعد ذلك بسقلاوس تلميذ إقليدس مقالتين هما الرابعة عشرة والخامسة عشرة فأهداهما إلى الملك فانضافتا إلى الكتاب وكل ذلك بالاسكندرية {cite:fihrist-ibn-al-nadim p. 371-372}."
  en: "Euclid — the Fihrist's transmission history: Hajjaj's two versions, Ishaq and Thabit's revision, and al-Kindi's Ablinus attribution {cite:fihrist-ibn-al-nadim}"
  es: "Euclides — Historia de la transmisión del Fihrist: Las dos versiones de Hajjaj, la revisión de Ishaq y Thabit, y la atribución de Ablinus por al-Kindi {cite:fihrist-ibn-al-nadim}"
  fr: "Euclide — l'histoire de la transmission du Fihrist: les deux versions de Hajjaj, la révision d'Ishaq et de Thabit, et l'attribution d'al-Kindi à Ablinus {cite:fihrist-ibn-al-nadim}"
  ur: "یوکلڈ - فہرسٹ کی ترسیل کی تاریخ: حجاج کے دو نسخے، اسحاق اور ثابت کی نظر ثانی، اور الکندی کی ابلینس انتساب {حوالہ: فہرست ابن الندیم}"
  tr: "Geometrinin yazarı Öklid ibn Noctarus ibn Bernicus, geometri anlamına gelir ve geometride ayırt edilen geometrinin tezahürüdür. Arşimet ve diğerlerinden daha yaşlıydı ve matematik filozofuydu. Geometri prensipleri üzerine kitabı Al-Astroshiya, al-Hajjaj ibn Yusuf ibn Matar tarafından iki versiyonda aktarıldı: biri al-Haruni olarak bilinir, birincisi olan al-Haruni, ikincisi ise buna dayanan al-Ma'muni. İshaq ibn Hunayn aktardı, Thabit ibn Qurrah al-Harrani düzeltti, Abu Uthman al-Dimashqi bazı makaleler aktardı ve şüphelerini Ion ile açıkladı, al-Nirizi de yorum yaptı. Al-Jawhari baştan sona açıkladı, Al-Mahani ise makaleyi açıkladı. Beşincisi, al-Kindi, Öklid'in kitabının amaçları üzerine yazdığı eserde, bu kitabın on beş şiir çizen Marangoz Abelins adlı bir adam tarafından yazıldığını belirtmiştir. Dönemi modası geçmiş ve ihmal edildiğinde, bazı İskenderiye kralları geometri incelemeye yönelmiştir. Öklid'in saltanatı sırasında ona geometriyi düzeltmesini ve yorumlamasını emretmiş, bunu yapmış ve bu eser ona atfedilmiştir. Daha sonra, Öklid'in öğrencisi Pascleus, on dördüncü ve on beşinci iki risale bulup krala hediye etmiş ve hepsi İskenderiye'de eklenmiştir {cite:fihrist-ibn-al-nadim s. 371-372}."
  id: "Euclid ibn Noctarus ibn Bernicus, penulis geometri, yang berarti geometri, adalah manifestasi geometri yang dibedakan di dalamnya. Ia lebih tua dari Archimedes dan lainnya, dan ia adalah seorang filsuf matematika. Bukunya tentang prinsip geometri, yang disebut Al-Astroshiya, disampaikan oleh al-Hajjaj ibn Yusuf ibn Matar dalam dua versi: satu dikenal sebagai al-Haruni, yang merupakan yang pertama, dan yang kedua adalah al-Ma'muni, yang mengandalkannya. Ishaq ibn Hunayn meneruskannya, Thabit ibn Qurrah al-Harrani memperbaikinya, Abu Uthman al-Dimashqi meneruskan beberapa artikel darinya, dan ia menjelaskan dan menjelaskan keraguannya oleh Ion, dan al-Nirizi mengomentarinya. Al-Jawhari menjelaskannya dari awal hingga akhir, dan Al-Mahani menjelaskan artikel tersebut. Kelima, al-Kindi menyebutkan dalam risalahnya tentang tujuan buku Euclid bahwa buku ini ditulis oleh seorang pria bernama Abelins si Tukang Kayu, yang menggambar lima belas bait. Ketika zamannya menjadi usang dan diabaikan, beberapa raja Alexandria berusaha mempelajari geometri. Selama masa pemerintahan Euclid, ia memerintahkan Euclid untuk mengoreksi dan menafsirkannya, yang ia lakukan, dan buku itu dikaitkan dengannya. Kemudian, Pascleus, murid Euclid, menemukan dua risalah, yang keempat belas dan kelima belas, dan memberikannya kepada raja, dan semuanya ditambahkan ke dalam buku tersebut, semuanya di Alexandria {cite:fihrist-ibn-al-nadim hlm. 371-372}."
