label: { ar: "إقليدس", en: "Uqlidis" }
summary:
  ar: "إقليدس بن نوقطرس بن برنيقس صاحب الجومطريا ومعناها الهندسة المظهر للهندسة المبرز فيها، أقدم من أرشميدس وغيره وهو من الفلاسفة الرياضيين، وكتابه في أصول الهندسة واسمه الاسطروشيا نقله الحجاج بن يوسف بن مطر نقلين أحدهما يعرف بالهاروني وهو الأول ونقله ثانيا وهو المأموني وعليه يعول، ونقله إسحاق بن حنين وأصلحه ثابت بن قرة الحراني ونقل أبو عثمان الدمشقي منه مقالات، وفسره وشرح شكوكه أيون وشرحه النيريزي وللجوهرى شرح من أوله إلى آخره وللماهاني شرح المقالة الخامسة، وذكر الكندي في رسالته في أغراض كتاب إقليدس أن هذا الكتاب ألفه رجل يقال له أبلينس النجار ورسمه خمسة عشر قولا فلما تقادم عهده وأتهمل تحرك بعض ملوك الاسكندرانية لطلب علم الهندسة وكان على عهده إقليدس فأمره بإصلاحه وتفسيره ففعل فنسب إليه، ثم وجد بعد ذلك بسقلاوس تلميذ إقليدس مقالتين هما الرابعة عشرة والخامسة عشرة فأهداهما إلى الملك فانضافتا إلى الكتاب وكل ذلك بالاسكندرية {cite:fihrist-ibn-al-nadim p. 371-372}."
  en: "Euclid — the Fihrist's transmission history: Hajjaj's two versions, Ishaq and Thabit's revision, and al-Kindi's Ablinus attribution {cite:fihrist-ibn-al-nadim}"
