  ar: "منتج إعلامي كندي للأطفال يقيم في إدمونتون، وهو مؤسس منصة «مسلم كيدز تي في» ومديرها التنفيذي، وهي منصة بث للرسوم والمحتوى التعليمي الإسلامي للأطفال أسسها مع زوجته فلورديليزا دايريت، وشاركها إنشاء فيلم الرسوم «تايم هوبرز: طريق الحرير»."
  en: "Canadian children's-media producer based in Edmonton. He is the founder and CEO of Muslim Kids TV, a streaming platform of Islamic cartoons and educational content for children, which he founded with his wife Flordeliza Dayrit, and he co-created with her the animated feature Time Hoppers: The Silk Road."
