summary:
  ar: فقيه كردي عراقي، وُلد سنة 1949 في منطقة قرة داغ بكردستان العراق. درس الشريعة في بغداد ثم نال الماجستير والدكتوراه من الأزهر، وأستاذ الفقه المقارن بجامعة قطر منذ 1985؛ خبير دولي في فقه المعاملات المالية
    والاقتصاد الإسلامي، وأمين عام الاتحاد العالمي لعلماء المسلمين.
  en: Iraqi Kurdish jurist, born in 1949 in the Qara Dagh region of Iraqi Kurdistan. He studied sharia in Baghdad then took his master's and doctorate at Al-Azhar, and has been professor of jurisprudence
    at Qatar University since 1985; an international authority on the jurisprudence of financial transactions and Islamic economics, he is secretary-general of the International Union of Muslim Scholars.
  fr: "Juriste kurde irakien, né en 1949 dans la région de Qara Dagh au Kurdistan irakien. Il a étudié la charia à Bagdad puis a obtenu sa maîtrise et son doctorat à Al-Azhar, et est professeur de jurisprudence à l'Université du Qatar depuis 1985 ; Autorité internationale en matière de jurisprudence des transactions financières et d’économie islamique, il est secrétaire général de l’Union internationale des savants musulmans."
  ur: عراقی کرد فقیہ، 1949 میں عراقی کردستان کے قرہ داغ علاقے میں پیدا ہوئے۔ انہوں نے بغداد میں شرعیات پڑھیں پھر الازہر سے ایم اے اور ڈاکٹریٹ لی، اور 1985 سے جامعہ قطر میں فقہ کے پروفیسر ہیں؛ فقہِ معاملاتِ
    مالیات اور اسلامی معیشت کے بین الاقوامی ماہر ہیں اور عالمی اتحادِ علمائے مسلمین کے سیکریٹری جنرل ہیں۔
  es: "Jurista kurdo iraquí, nacido en 1949 en la región de Qara Dagh, en el Kurdistán iraquí. Estudió sharia en Bagdad y posteriormente obtuvo su maestría y doctorado en Al-Azhar. Desde 1985 es profesor de jurisprudencia en la Universidad de Qatar. Reconocido internacionalmente en jurisprudencia sobre transacciones financieras y economía islámica, es secretario general de la Unión Internacional de Eruditos Musulmanes."
