summary:
  ar: "أبو بكر المطوعي، سمع أحمد بن حنبل وعلي بن المديني، روى عنه النجاد والخلدي؛ قال جعفر الخلدي سمعت أبا بكر المطوعي يقول: كان وردي في شبيبتي أقرأ كل يوم ولاية ⁦(قل هو الله أحد)⁩ إحدى وثلاثين ألف مرة أو إحدى وأربعين ألف مرة؛ توفي في هذه السنة {cite:muntazam-ibn-al-jawzi p. 187}."
  en: "Abu Bakr al-Mutawwi'i, who heard Ibn Hanbal and Ibn al-Madini; Ja'far al-Khaldi heard him say his youth's daily wird was the recitation of 'Qul huwa'llahu ahad' thirty-one or forty-one thousand times {cite:muntazam-ibn-al-jawzi p. 187}."
  fr: "Abu Bakr al-Mutawwi'i, qui entendit Ibn Hanbal et Ibn al-Madini ; Ja'far al-Khaldi l'entendit dire que sa litanie quotidienne de jeunesse était la récitation de la sourate « Qul huwa'llahu ahad » trente et un mille ou quarante et un mille fois {cite:muntazam-ibn-al-jawzi p. 187}."
  es: "Abu Bakr al-Mutawwi'i, quien escuchó a Ibn Hanbal e Ibn al-Madini; Ja'far al-Khaldi lo escuchó decir que su wird diario de juventud era la recitación de 'Qul huwa'llahu ahad' treinta y un o cuarenta y un mil veces {cite:muntazam-ibn-al-jawzi p. 187}."
  ur: "ابو بکر المتوی، جس نے ابن حنبل اور ابن المدینی کو سنا؛ جعفر الخالدی نے اسے یہ کہتے ہوئے سنا کہ ان کی جوانی کا یومیہ وارڈ اکتیس یا اکتالیس ہزار مرتبہ ’’قل ھو اللہ احد‘‘ پڑھتا تھا۔ 187}۔"
