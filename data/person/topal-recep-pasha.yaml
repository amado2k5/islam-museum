label:
  ar: "رجب باشا الأعرج"
  en: "Topal Recep Pasha"
  ur: "توپال رجب پاشا"
summary:
  ar: "رجب باشا الملقب «طوپال» (الأعرج)؛ بوسني، تربى في أوقية البوسطنجية فصار بوسطنجي باشي ثم ختن دار ومير أخور أول وتزوج السلطانة كوهرخان؛ صار صردار البحر الأسود برتبة وزير سنة ١٠٣٣هـ/١٦٢٤م وقائم مقام الصدر الأعظم سنة ١٠٣٥هـ، ثم صدراً أعظم سنة ١٠٤١هـ/١٦٣١م فمات بعد ستة أشهر {cite:sicill-i-osmani vol. 4, 'Receb Paşa (Topal)'}."
  en: "Recep Pasha, nicknamed 'Topal' (the Lame); a Bosnian raised in the bostancı corps to bostancıbaşı, then kapıcılar kethüdası and chief equerry and married to Gevherhan Sultan; made serdar of the Black Sea with vizier rank in 1033/1624, kaymakam in 1035, and grand vizier in 1041/1631–32 — dying six months later {cite:sicill-i-osmani vol. 4, 'Receb Paşa (Topal)'}."
  ur: "رجب پاشا ملقب «توپال» (لنگڑا)؛ بوسنیائی، بوسطانجی ایلی سے تربیت پا کر بوسطانجی باشی بنا، پھر ختن دار و میر آخور اول اور کیوہرخان سلطان کا شوہر؛ سنہ ١٠٣٣ھ/١٦٢٤ء میں وزیر کے رتبے سے بحیرہ اسود کا سردار، ١٠٣٥ھ میں قائم مقامِ صدر اعظم، اور ١٠٤١ھ/١٦٣١ء میں صدر اعظم بنا تو چھ ماہ بعد وفات پا گیا {cite:sicill-i-osmani vol. 4, 'Receb Paşa (Topal)'}."
