summary:
  ar: "منتج إعلامي مسلم أسترالي مقيم في سيدني، مؤسس شركة «ون فور كيدز» (One 4 Kids) ومنتجها الرئيس، وهي الاستوديو صاحب شخصية الأطفال «زاكي»، وهو المنتج والمخرج المنسوبة إليه أعمال قناة «ون إسلام برودكشنز» (One Islam Productions) في أوصاف مقاطعها نفسها. أطلقت الشركة قناتها للرسوم المتحركة لأطفال المسلمين سنة 2016 بديلًا عن «بيبا بيغ»، وبلغ عدد مشتركي قناة ون إسلام برودكشنز — التي تنشر ون فور كيدز تطبيقها «ون إسلام تي في» — نحو مليونين و660 ألف مشترك في أكتوبر 2026."
  en: "An Australian Muslim media producer based in Sydney, founder and lead producer of One 4 Kids, the studio behind the children's character Zaky, and the producer and director credited on the One Islam Productions channel's own videos. The company launched its cartoon channel for Muslim children in 2016 as an alternative to Peppa Pig; One Islam Productions, whose streaming app One Islam TV is published by One 4 Kids, had about 2.66 million YouTube subscribers in October 2026."
  ur: "سڈنی میں مقیم آسٹریلوی مسلم میڈیا پروڈیوسر، «ون فور کڈز» (One 4 Kids) کے بانی اور مرکزی پروڈیوسر — وہی اسٹوڈیو جس کا بچوں کا کردار «زاکی» ہے — اور «ون اسلام پروڈکشنز» (One Islam Productions) چینل کی اپنی ویڈیوز میں درج پروڈیوسر و ڈائریکٹر۔ کمپنی نے 2016 میں مسلم بچوں کے لیے اپنا کارٹون چینل «پیپا پگ» کے متبادل کے طور پر شروع کیا؛ ون اسلام پروڈکشنز — جس کی اسٹریمنگ ایپ «ون اسلام ٹی وی» ون فور کڈز شائع کرتی ہے — کے سبسکرائبرز اکتوبر 2026 میں تقریباً 2.66 ملین تھے۔"
