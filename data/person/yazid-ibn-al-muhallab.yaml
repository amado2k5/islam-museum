id: person/yazid-ibn-al-muhallab
class: person
label: { ar: "يزيد بن المهلب" }
summary:
  ar: "قُتل في صفر سنة اثنتين ومائة بعد أن وجّه إليه يزيد بن عبد الملك العباس بن الوليد ومسلمة بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.590}، وكان قد خرج سنة إحدى ومائة فأقبل البصرة في كتيبة تهول من رآها حتى دخلها وخلّص إخوته من الحبس، ثم سار حتى نزل العقر فلقيه مسلمة بن عبد الملك والعباس بن الوليد، وكان يزيد يوم القتل على بردون أشهب أقبل نحو مسلمة لا يريد غيره فعطفت عليه خيول أهل الشام فقتل ومعه ابنه السميدع وأخوه محمد، وحمل عليه الفضل بن عياش الكلبي فقتله ومات بآخر رمق وهو يومئ أنه قتله، وجيء برأس يزيد فغسل وعمم وبعث به إلى الخليفة {cite:tabari-khayyat-part2 p. 110-112,124-125}."
gender: male
