id: person/yazid-ibn-al-muhallab
class: person
label: { ar: "يزيد بن المهلب" }
summary:
  ar: "قُتل في صفر سنة اثنتين ومائة بعد أن وجّه إليه يزيد بن عبد الملك العباس بن الوليد ومسلمة بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.590}، وكان قد خرج سنة إحدى ومائة فأقبل البصرة في كتيبة تهول من رآها حتى دخلها وخلّص إخوته من الحبس، ثم سار حتى نزل العقر فلقيه مسلمة بن عبد الملك والعباس بن الوليد، وكان يزيد يوم القتل على بردون أشهب أقبل نحو مسلمة لا يريد غيره فعطفت عليه خيول أهل الشام فقتل ومعه ابنه السميدع وأخوه محمد، وحمل عليه الفضل بن عياش الكلبي فقتله ومات بآخر رمق وهو يومئ أنه قتله، وجيء برأس يزيد فغسل وعمم وبعث به إلى الخليفة {cite:tabari-khayyat-part2 p. 110-112,124-125}. فتح قلعة أبذجنس سنة 84هـ بعد أن وضع عليها العيون، وكان صاحبها ينزك يسجد لها. {cite:salabi-umayyad-state-2020 p.87} ويذكر الكتاب أن سليمان جمع له العراق سنة 96هـ ثم أضاف له خراسان سنة 97هـ، فتولى الحرب والصلاة، فيما عهد الخراج إلى صالح بن عبد الرحمن. {cite:salabi-umayyad-state-2020 p.146} ويذكر الكتاب أن يزيد بن المهلب خرج على يزيد بن عبد الملك بعد توليه الخلافة، واستولى على البصرة، فجهز يزيد جيشاً بقيادة أخيه مسلمة، فدارت معركة العقر من أرض بابل دامت ثمانية أيام، قُتل فيها يزيد بن المهلب وعدد من إخوته، وذلك سنة 102هـ. {cite:salabi-umayyad-state-2020 p.429}"
