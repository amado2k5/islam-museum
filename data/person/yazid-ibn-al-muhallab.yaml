id: person/yazid-ibn-al-muhallab
class: person
label: { ar: "يزيد بن المهلب" }
summary:
  ar: "قُتل في صفر سنة اثنتين ومائة بعد أن وجّه إليه يزيد بن عبد الملك العباس بن الوليد ومسلمة بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.590}، وكان قد خرج سنة إحدى ومائة فأقبل البصرة في كتيبة تهول من رآها حتى دخلها وخلّص إخوته من الحبس، ثم سار حتى نزل العقر فلقيه مسلمة بن عبد الملك والعباس بن الوليد، وكان يزيد يوم القتل على بردون أشهب أقبل نحو مسلمة لا يريد غيره فعطفت عليه خيول أهل الشام فقتل ومعه ابنه السميدع وأخوه محمد، وحمل عليه الفضل بن عياش الكلبي فقتله ومات بآخر رمق وهو يومئ أنه قتله، وجيء برأس يزيد فغسل وعمم وبعث به إلى الخليفة {cite:tabari-khayyat-part2 p. 110-112,124-125}. فتح قلعة أبذجنس سنة 84هـ بعد أن وضع عليها العيون، وكان صاحبها ينزك يسجد لها. {cite:salabi-umayyad-state-2020 p.87} ويذكر الكتاب أن سليمان جمع له العراق سنة 96هـ ثم أضاف له خراسان سنة 97هـ، فتولى الحرب والصلاة، فيما عهد الخراج إلى صالح بن عبد الرحمن. {cite:salabi-umayyad-state-2020 p.146} ويذكر الكتاب أن يزيد بن المهلب خرج على يزيد بن عبد الملك بعد توليه الخلافة، واستولى على البصرة، فجهز يزيد جيشاً بقيادة أخيه مسلمة، فدارت معركة العقر من أرض بابل دامت ثمانية أيام، قُتل فيها يزيد بن المهلب وعدد من إخوته، وذلك سنة 102هـ. {cite:salabi-umayyad-state-2020 p.429}"
  tr: "Yazid ibn Abd al-Malik al-Abbas ibn al-Walid ve Maslamah ibn Abd al-Malik'ten sonra yüz ikinci yılda Safar'da öldürüldü {cite:tabari-tarikh-abu-al-fadl J.6 s. 590} ona gönderildi. Yüz yüz yaşında ayrıldı ve Basra'ya bir taburla geldi; tabur onu görünce şaşkına döndü, ta ki içeri girip kardeşlerini esaretten kurtarana kadar. Sonra yürüyerek Al-'Aqr'a ulaştı ve Maslama ibn Abd al-Malik ile al-Abbas ibn al-Walid tarafından karşılandı. Ölüm günü, Yazid, başka kimseyi istemeyen Muslimah'a doğru bir bardun üzerindeydi. Levant halkının atları ona sırtını döndü ve oğlu el-Sümeyd ile kardeşi Muhammed ile birlikte öldürüldü. El-Fadl bin Ayyyş el-Kalbi ona saldırdı, öldürdü ve son nefesinde öldürmekle tehdit ederek öldü. Yezid'in başı ona getirildi, yıkandı, dolaşıma sokuldu ve halifeye gönderildi {cite:tabari-khayyat-part2, s. 110-112,124-125}. 84 Hicri'de Abdjans kalesini gözetledikten sonra ele geçirdi ve sahibi ona secde ederdi. {alıntı:Selabi-umayyad-devlet-2020 s.87} Kitap, Süleyman'ın 96 Hicri'de Irak'ı ilhak ettiğini, ardından 97 Hicri'de Horasan'ı eklediğini, savaş ve duanın sorumluluğunu üstlendiğini, verginin ise Salih ibn Abd al-Rahman'a verildiğini belirtir. {cite:Salabi-umayyad-state-2020 s.146} Kitapta, Yezid bin el-Muhallab'ın Halifeliği ele geçirdikten sonra Yazid ibn Abd al-Malik'e karşı isyan ettiğini belirtir. Yazid, kardeşi Muslima'nın komutasında bir ordu hazırladı ve 102 Hicri yılında Babil topraklarında sekiz gün süren El-Aqr Savaşı gerçekleşti; bu savaşta Yezîd bin Mühülleb ve birkaç kardeşi öldürüldü. {cite:Selabi-Umayyad-devlet-2020 s.429}"
  id: "Ia dibunuh di Safar pada tahun seratus dua setelah Yazid ibn Abd al-Malik al-Abbas ibn al-Walid dan Maslamah ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl J.6 hlm. 590} dikirim kepadanya. Ia pergi pada tahun seratus seratus dan datang ke Basra dengan satu batalion yang kewalahan melihatnya hingga ia masuk dan membebaskan saudara-saudaranya dari tawanan. Ia kemudian berbaris hingga mendarat di Al-'Aqr dan bertemu dengannya oleh Maslama ibn Abd al-Malik dan al-Abbas ibn al-Walid. Pada hari kematiannya, Yazid berada di atas bardun ashhab, menuju Muslimah yang tidak menginginkan siapa pun. Kuda-kuda rakyat Levant berbalik melawannya, dan ia dibunuh bersama putranya al-Sumayd' dan saudaranya Muhammad. Al-Fadl ibn Ayyash al-Kalbi menyerangnya dan membunuhnya serta meninggal di nafas terakhir dengan ancaman akan membunuhnya. Kepala Yazid dibawa kepadanya, dicuci, dibudarkan, dan dikirim kepada khalifah {cite:tabari-khayyat-part2, hlm. 110-112,124-125}. Ia merebut benteng Abdjans pada tahun 84 H setelah melihatnya, dan pemiliknya biasa bersujud di sana. {cite:salabi-umayyad-state-2020 hlm.87} Buku tersebut menyebutkan bahwa Suleiman menganeksasi Irak pada tahun 96 H, lalu menambahkan Khurasan pada tahun 97 H, mengambil alih perang dan doa, sementara pajak dipercayakan kepada Saleh ibn Abd al-Rahman. {cite:salabi-umayyad-state-2020 hlm.146} Buku tersebut menyebutkan bahwa Yazid ibn al-Muhallab memberontak melawan Yazid ibn Abd al-Malik setelah ia mengambil alih kekhalifahan dan merebut Basra. Yazid menyiapkan pasukan yang dipimpin oleh saudaranya Muslima, dan Pertempuran Al-'Aqr terjadi di tanah Babilon selama delapan hari, di mana Yazid ibn al-Muhallab dan beberapa saudaranya tewas pada tahun 102 H. {cite:salabi-umayyad-state-2020 hlm.429}"
