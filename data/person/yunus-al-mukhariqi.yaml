summary:
  ar: "يونس بن يوسف الشيباني ثم المخارقي، شيخ الفقراء اليونسية المنسوبين إليه؛ كان رجلاً صالحاً، وسأل ابن خلكان جماعة من أصحابه عن شيخه فقالوا لم يكن له شيخ بل كان مجذوباً — وهم يسمون من لا شيخ له بالمجذوب يريدون أنه جُذب إلى طريق الخير والصلاح — ويذكرون له كرامات؛ حكى عنه أنه نام في طريق مخوفة بين سنجار وعانة فلما انتبه قال ما نمت حتى جاء إسماعيل بن إبراهيم وتدرك القفل فأصبحوا ورحلوا سالمين ببركته، وأمر مرة صاحبه حين عزم على دخول نصيبين أن يشتري لأم ولده مساعد كفناً وكانت في عافية فلما عاد وجدها قد ماتت؛ وتوفي سنة تسع عشرة وستمائة في قريته القنية من أعمال دارا وقبره مشهور بها يزار وكان قد ناهز تسعين سنة {cite:wafayat-ayan p. 256-257}."
  en: "Yunus al-Mukhariqi — eponym of the Yunusiyya fuqara'; a majdhub with no shaykh, his companions saying he was 'drawn' straight to the path, credited with karamat like foreseeing a caravan's safety between Sinjar and 'Ana and ordering a shroud for his son's mother while she was still well; died 619 AH at al-Qunayya near Dara aged about ninety, his tomb still visited {cite:wafayat-ayan p. 256-257}."
