summary:
  ar: "متكلم من أهل السنة، تُنسب إليه الأشعرية، صاحب «مقالات الإسلاميين» الذي عرض فيه قول أهل الحديث والسنة وقال إنه يذهب إليه، وتصفه طبعة الكتاب بأنه شيخ أهل السنة والجماعة. وُلد بالبصرة سنة ٢٦٠هـ/٨٧٣-٨٧٤م، وكان من أجود تلاميذ أبي علي الجبائي شيخ معتزلة البصرة حتى تاب من الاعتزال سنة ٣٠٠هـ وأعلن ذلك في جامع البصرة، ثم انتقل في أواخر حياته إلى بغداد ومات بها سنة ٣٢٤هـ/٩٣٥-٩٣٦م {cite:siyar-alam-nubala 15/85-86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  en: "A Sunni theologian to whom the Ash'ari school is attributed, author of Maqalat al-Islamiyyin in which he sets out the position of the hadith scholars and Ahl al-Sunna and says he holds it; the edition of the book calls him the shaykh of Ahl al-Sunna wa'l-Jama'a. Born at Basra in 260/873-4, he was among the best pupils of Abu Ali al-Jubba'i, shaykh of the Basran Mu'tazila, until he renounced Mu'tazilism in 300 and proclaimed it in the Great Mosque of Basra; he moved to Baghdad late in life and died there in 324/935-6 {cite:siyar-alam-nubala 15/85-86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  ur: "اہلِ سنت کے متکلم جن کی طرف اشعریہ منسوب ہے، «مقالات الاسلامیین» کے مصنف جس میں انہوں نے اہلِ حدیث و سنت کا قول پیش کیا اور خود کو اسی کا قائل بتایا۔ وہ 260ھ/873-874ء کو بصرہ میں پیدا ہوئے، بصری معتزلہ کے شیخ ابو علی جبّائی کے بہترین شاگردوں میں تھے یہاں تک کہ 300ھ میں اعتزال سے توبہ کر کے بصرہ کی جامع مسجد میں اس کا اعلان کیا؛ آخری عمر میں بغداد منتقل ہوئے اور 324ھ/935-936ء کو وہیں فوت ہوئے {cite:siyar-alam-nubala 15/85-86} {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}۔"
