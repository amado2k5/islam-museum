summary:
  ar: "أبو أحمد الفارسي البزار ويعرف بابن البستبان، سمع سفيان بن عيينة وابن علية وداود بن الحبر، روى عنه المحاملي وابن مخلد، وقال ابن أبي حاتم هو صدوق؛ توفي في ربيع الأول سنة ثلاث وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 133}."
  en: "Abu Ahmad 'Ibn al-Bustaban' of Fars, a truthful transmitter from Sufyan ibn 'Uyayna and Ibn 'Ulayya heard by al-Muhamili and Ibn Makhlid; he died in Rabi' I 263 {cite:muntazam-ibn-al-jawzi p. 133}."
  es: "Abu Ahmad 'Ibn al-Bustaban' de Fars, un transmisor veraz de Sufyan ibn 'Uyayna e Ibn 'Ulayya escuchado por al-Muhamili e Ibn Makhlid; murió en Rabi' I 263 {cita:muntazam-ibn-al-jawzi p. 133}."
  fr: "Abu Ahmad 'Ibn al-Bustaban' du Fars, un émetteur véridique de Sufyan ibn 'Uyayna et Ibn 'Ulayya entendu par al-Muhamili et Ibn Makhlid; il est mort à Rabi' I 263 {cite: muntazam-ibn-al-jawzi p. 133}."
  ur: "ابو احمد 'ابن البسطبان' فارس، سفیان بن عیینہ اور ابن علیہ سے ایک سچا ٹرانسمیٹر جو المحمیلی اور ابن مخلد نے سنا؛ آپ کی وفات ربیع الثانی 263 میں ہوئی۔ 133}۔"
  tr: "Ebu Ahmed el-Farsi el-Bazzar, İbn el-Bastban olarak bilinir, Sufyan ibn 'Uyaynah, İbn 'Ulayyah ve Davud ibn al-Habr'dan haber almıştır. El-Muhamli ve İbn Muhhilid ondan rivayet etmiştir. İbn Ebi Hatim onun doğru olduğunu söylemiştir; 263 yılında Rabi' al-Awwal'da ölmüştür {atıf:Muntazam-ibn-al-Jawzi, s. 133}."
  id: "Abu Ahmad al-Farsi al-Bazzar, yang dikenal sebagai Ibn al-Bastban, mendengar dari Sufyan ibn 'Uyaynah, Ibn 'Ulayyah, dan Dawud ibn al-Habr. Al-Muhamili dan Ibn Mukhlid menceritakan darinya. Ibn Abi Hatim mengatakan bahwa ia benar; ia meninggal di Rabi' al-Awwal pada tahun 263 {cite:muntazam-ibn-al-jawzi, hlm. 133}."
