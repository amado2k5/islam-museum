summary:
  ar: "عطية بن سعد بن جنادة العوفي الكوفي، أبو الحسن، تابعي مفسر توفي سنة 111هـ؛ روى عن أبي سعيد وأبي هريرة وابن عباس وابن عمر، وقال فيه أبو حاتم: ضعيف يكتب حديثه. نقل الطبري تفسيره عن ابن عباس في نحو 1560 موضعًا من جامع البيان بإسناد عائلي من ذريته."
  en: "Atiyya ibn Sa'd ibn Junada al-Awfi of Kufa, Abu al-Hasan, a Successor and exegete who died in 111 AH; he transmitted from Abu Sa'id, Abu Hurayra, Ibn Abbas and Ibn Umar, and Abu Hatim said of him: weak, his hadith is written down. Al-Tabari quotes his commentary from Ibn Abbas in some 1,560 places of Jami' al-Bayan through a family chain of his descendants."
  ur: "عطیہ بن سعد بن جنادہ عوفی کوفی، ابو الحسن، تابعی مفسر جن کی وفات 111ھ میں ہوئی؛ انہوں نے ابو سعید، ابو ہریرہ، ابن عباس اور ابن عمر سے روایت کی، اور ابو حاتم نے ان کے بارے میں کہا: ضعیف ہیں، ان کی حدیث لکھی جاتی ہے۔ طبری جامع البیان کے تقریباً 1560 مقامات پر ان کی ابن عباس سے تفسیر ان کی اولاد کی خاندانی سند سے نقل کرتے ہیں۔"
