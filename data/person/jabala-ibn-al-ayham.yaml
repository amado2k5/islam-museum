summary:
  en: "The last Ghassanid king: after the Yarmuk defeat his dynasty’s role as Rome’s Arab wardens ended, and he entered Islam in the caliphate of Umar, later leaving it for Byzantine territory."
  ar: "آخر ملوك الغساسنة: بعد وقعة اليرموك انتهى دور بيته وكلاءً للروم على عرب الشام، وأسلم في عهد عمر بن الخطاب ثم خرج عنه لاحقاً إلى بلاد الروم. وعند البلاذري: بعثه هرقل على مقدمة جموعه يوم اليرموك في مستعربة الشام من لخم وجذام، فانحاز إلى الأنصار وقال «أنتم إخوتنا وبنو أبينا» وأظهر الإسلام، فلما طلب عمر الاقتصاص منه قال «أوعينه مثل عيني؟ والله لا أقيم في بلد عليّ فيه سلطان» فدخل بلاد الروم مرتداً — وكان ملك غسان بعد الحارث بن أبي شمر؛ وروي أيضاً أن جبلة أتى عمر على نصرانيته فعرض عليه الإسلام أو أداء الجزية فأبى أنفاً من الجزية فقال له عمر ما عندنا لك إلا واحدة من ثلاث: الإسلام أو الجزية أو الذهاب حيث شئت، فدخل بلاد الروم في ثلاثين ألفاً فندم عمر وعاتبه عبادة بن الصامت «لو قبلت منه الصدقة ثم تألفته لأسلم»، فوجّه عمر سنة 21 عمير بن سعد الأنصاري في جيش عظيم — وهي أول صائفة — يدعوه إلى الرجوع على أن يؤدي ما بذل من الصدقة ويقيم على دينه فأبى إلا المقام في بلاد الروم {cite:futuh-buldan-maarif-1407 p.184–186}. وهو عند المسعودي آخر ملوك غسان الأحد عشر بالشام وامتدحه حسان بن ثابت بأشهرنها فإن ملكك بالشام إلى الروم فخر كل يماني، وأسلم ثم ارتد عن دينه خوف العار والقود من اللطمة {cite:muruj-al-dhahab p. 427-428}"
  es: "El último rey gasánida: tras la derrota de Yarmuk, el papel de su dinastía como guardianes árabes de Roma llegó a su fin, y se convirtió al islam en el califato de Umar, para luego abandonarlo y dirigirse al territorio bizantino."
  fr: "Le dernier roi ghassanide: après la défaite du Yarmouk, le rôle de sa dynastie en tant que gardiens arabes de Rome prit fin, et il entra dans l'islam au sein du califat d'Omar, avant de le quitter pour le territoire byzantin."
  ur: "آخری غسانی بادشاہ: یرموک کی شکست کے بعد روم کے عرب محافظوں کے طور پر اس کے خاندان کا کردار ختم ہو گیا، اور وہ عمر کی خلافت میں اسلام میں داخل ہوا، بعد میں اسے بازنطینی علاقہ چھوڑ کر چلا گیا۔"
  tr: "Gasanilerin son kralı: Yermuk Savaşı'ndan sonra, hanesi Romalıların Şam Arapları üzerindeki ajanları oldu. Ömer bin el-Hattab döneminde İslam'a geçti, ardından Romalıların topraklarına gitti. El-Baladhuri'ye göre: Herakleios, Yarmuk gününde ordusuna liderlik etmesi için Levant'ın Araplaşmış bölgesinde, Lakhm ve Lexam'dan gönderdi. Ensar'ın yanında yer aldı ve \"Siz bizim atalarımızın kardeşleri ve oğullarısınız\" dedi, ve açıkça İslam'ı benimsedi. Ömer ondan intikam talep ettiğinde, \"Gözleri benim gözlerim gibi olsun?\" dedi. Allah'a yemin ederim, Ali'nin otoritesi olan bir toprakta yerleşmem.\" Bizans topraklarına bir mürd olarak girdi — bu, el-Haris bin Ebi Şemmer'den sonra Gassan'ın yönetimiydi. Ayrıca Cibla'nın Hristiyan olarak Ömer'e gelip ona İslam ya da cizye teklif ettiği ama Cizye ödemeyi reddettiği de rivayet edilir. Ömer ona, 'Senin için sadece üç tane var: İslam, cizye ya da istediğin yere gitmek.' dedi. Otuz kişiyle Bizans topraklarına girdi bin kişi, ancak Ömer üzüldü ve Ubadah ibn al-Samit'i azarladı: \"Onun sadakasını kabul edip sonra barıştırsaydım, İslam'ı kabul ederdim.\" Ömer ibn Said el-Ensari'yi büyük bir orduyla—ilk yaz—gönderdi; ona verdiği sadakayı ödemesi ve dininde kararlı kalması şartıyla geri dönmesini istedi. Bizans topraklarında kalmayı reddetti {cite:futuh-buldan-maarif-1407 s. 184–186}. el-Mes'udi'ye göre, Levant'taki on bir Gasan kralının sonuncusuydu ve Hasan ibn Tabit onu en ünlüsü olarak yüceltti; çünkü Levant üzerindeki yönetiminiz Romalılara karşı her Yemenlinin gururuydu. İslam'ı benimsedi ve utanç ve darbe korkusuyla dininden döndü {atıf:muruj-al-dhahab, s. 427-428}"
  id: "Raja terakhir Ghassanid: Setelah Pertempuran Yarmouk, keluarganya menjadi agen Romawi atas Arab di Levant. Ia memeluk Islam pada masa pemerintahan Umar ibn al-Khattab, lalu kemudian pergi ke tanah Romawi. Menurut al-Baladhuri: Heraclius mengirimnya untuk memimpin pasukannya pada hari Yarmouk di wilayah Levant yang telah diArabisasi, dari Lakhm dan Lexam. Ia berpihak pada Ansar dan berkata, \"Kalian adalah saudara dan putra nenek moyang kami,\" lalu ia secara terbuka memeluk Islam. Ketika Umar menuntut pembalasan darinya, ia berkata, \"Semoga matanya seperti mataku?\" Demi Tuhan, aku tidak akan menetap di tanah di mana Ali memegang otoritas.\" Ia masuk ke tanah Bizantium sebagai murtad — itu adalah pemerintahan Ghassan setelah al-Harith ibn Abi Shammar. Juga diceritakan bahwa Jibla datang kepada Umar sebagai seorang Kristen dan menawarkan Islam atau membayar jizya, tetapi ia menolak membayar jizya. Umar berkata kepadanya, 'Kami hanya punya satu dari tiga untukmu: Islam, jizya, atau pergi ke mana pun engkau mau.' Ia memasuki tanah Bizantium dengan tiga puluh ribu, tetapi Umar menyesal dan menegur Ubadah ibn al-Samit: \"Jika aku menerima amalnya dan kemudian mendamaikannya, aku akan memeluk Islam.\" Umar mengirim Umar ibn Sa'd al-Ansari dalam pasukan besar—musim panas pertama—mendesaknya untuk kembali dengan syarat ia membayar sedekah yang telah diberikan dan tetap teguh dalam agamanya. Ia menolak tinggal di tanah Bizantium {cite:Futuh-buldan-maarif-1407 hlm.184–186}. Menurut al-Mas'udi, ia adalah raja Ghassan terakhir dari sebelas raja di Levant, dan Hassan ibn Thabit memujinya sebagai yang paling terkenal dari semuanya, karena pemerintahan Anda atas Levant bagi orang Romawi adalah kebanggaan setiap orang Yaman. Ia memeluk Islam lalu murtad dari agamanya karena takut malu dan dipukul {cite:muruj-al-dhahab, hlm. 427-428}"
