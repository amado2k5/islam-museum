summary:
  en: "The last Ghassanid king: after the Yarmuk defeat his dynasty’s role as Rome’s Arab wardens ended, and he entered Islam in the caliphate of Umar, later leaving it for Byzantine territory."
  ar: "آخر ملوك الغساسنة: بعد وقعة اليرموك انتهى دور بيته وكلاءً للروم على عرب الشام، وأسلم في عهد عمر بن الخطاب ثم خرج عنه لاحقاً إلى بلاد الروم. وعند البلاذري: بعثه هرقل على مقدمة جموعه يوم اليرموك في مستعربة الشام من لخم وجذام، فانحاز إلى الأنصار وقال «أنتم إخوتنا وبنو أبينا» وأظهر الإسلام، فلما طلب عمر الاقتصاص منه قال «أوعينه مثل عيني؟ والله لا أقيم في بلد عليّ فيه سلطان» فدخل بلاد الروم مرتداً — وكان ملك غسان بعد الحارث بن أبي شمر؛ وروي أيضاً أن جبلة أتى عمر على نصرانيته فعرض عليه الإسلام أو أداء الجزية فأبى أنفاً من الجزية فقال له عمر ما عندنا لك إلا واحدة من ثلاث: الإسلام أو الجزية أو الذهاب حيث شئت، فدخل بلاد الروم في ثلاثين ألفاً فندم عمر وعاتبه عبادة بن الصامت «لو قبلت منه الصدقة ثم تألفته لأسلم»، فوجّه عمر سنة 21 عمير بن سعد الأنصاري في جيش عظيم — وهي أول صائفة — يدعوه إلى الرجوع على أن يؤدي ما بذل من الصدقة ويقيم على دينه فأبى إلا المقام في بلاد الروم {cite:futuh-buldan-maarif-1407 p.184–186}."
