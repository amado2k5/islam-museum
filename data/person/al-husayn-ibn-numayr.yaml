label: { ar: "الحصين بن نمير", en: "al-Husayn ibn Numayr", es: "al-Husayn ibn Numayr", fr: "al-Husayn ibn Numayr", ur: "الحسین بن نمیر" }
summary:
  ar: "استخلفه مسرف بن عقبة على جيش أهل الشام عند موته بقديد فسار إلى مكة وأحاط بها ونصب المجانيق والعرادات عليها وعلى المسجد من الجبال والفجاج فانهدمت الكعبة واحترقت البنية لثلاث خلون من ربيع الأول سنة أربع وستين قبل وفاة يزيد بأحد عشر يوماً {cite:muruj-al-dhahab p. 69}."
  en: "Musrif's successor — besieged Ibn al-Zubayr in the sanctuary, planted mangonels on the heights, and the Ka'ba's structure burned and collapsed on 3 Rabi' I 64 {cite:muruj-al-dhahab p. 69}."
  es: "El sucesor de Musrif sitió a Ibn al-Zubayr en el santuario, plantó mangoneles en las alturas, y la estructura de la Kaaba se incendió y se derrumbó el 3 de Rabi' I 64 {cite:muruj-al-dhahab p. 69}."
  fr: "Le successeur de Musrif — a assiégé Ibn al-Zubayr dans le sanctuaire, a placé des mangonneaux sur les hauteurs, et la structure de la Ka'ba a brûlé et s'est effondrée le 3 Rabi' I 64 {cite:muruj-al-dhahab p. 69}."
  ur: "مصف کے جانشین نے ابن الزبیر کا حرم میں محاصرہ کیا، بلندیوں پر مینگونیل لگائے اور کعبہ کا ڈھانچہ 3 ربیع الثانی 64 کو جل کر گر گیا۔ 69}۔"
  tr: "Musrif bin Uqbah, onu Levant halkının ordusunun Kudud'daki halefi olarak atadı. Mekke'ye yürüdü, kuşattı ve üzerine mancınıklar ve kanolar yerleştirdi; ayrıca dağlardan ve el-Fecec'den camiye de yerleştirdi. Kabe çöktü ve yapı, Rebi'l-Avvel'den üç gün önce, altmış dört yılda, Yezid'in ölümünden on bir gün önce yandı {atıf:muruj-al-dhahab, s. 69}."
  id: "Musrif ibn Uqbah mengangkatnya sebagai penerusnya atas pasukan rakyat Levant di Qudud. Ia berjalan ke Mekah, mengepungnya, dan memasang katapel serta kano di sana, serta di masjid dari pegunungan dan al-Fajaj. Ka'bah runtuh dan bangunan itu terbakar tiga hari sebelum Rabi' al-Awwal pada tahun enam puluh empat, sebelas hari sebelum kematian Yazid {cite:muruj-al-dhahab, hlm. 69}."
