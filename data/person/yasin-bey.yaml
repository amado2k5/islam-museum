summary:
  ar: "مغنّي راب وممثل أمريكي، وُلد في بروكلين بنيويورك سنة 1973 باسم دانتي تيريل سميث، وعُرف فنيًا باسم «موس ديف» قبل أن يتخذ اسم ياسين باي سنة 2011. أسس مع طالب كويلي ثنائي «بلاك ستار» (1998)، وحقق ألبومه المنفرد الأول «أسود على الوجهين» (1999) نجاحًا نقديًا واسعًا، ومثّل في أفلام ومسلسلات تلفزيونية بارزة. اعتنق الإسلام في مراهقته."
  en: "American rapper and actor, born in Brooklyn, New York in 1973 as Dante Terrell Smith, and known professionally as Mos Def before adopting the name Yasiin Bey in 2011. With Talib Kweli he formed the duo Black Star (1998); his solo debut Black on Both Sides (1999) was widely acclaimed, and he has acted in major films and television series. He converted to Islam in his teens."
  ur: "امریکی ریپر اور اداکار، 1973 میں بروکلین، نیویارک میں دانتے تیریل سمتھ کے نام سے پیدا ہوئے، فنی نام «موس ڈیف» سے مشہور ہوئے پھر 2011 میں یاسین بے کا نام اپنایا۔ طالب کویلی کے ساتھ انھوں نے جوڑی «بلیک اسٹار» (1998ء) بنائی؛ ان کا پہلا سولو البم «بلیک آن بوتھ سائیڈز» (1999ء) بڑی نقدی پذیرائی لایا، اور وہ اہم فلموں اور ٹیلی ویژن سلسلوں میں اداکاری کر چکے ہیں۔ انھوں نے نوجوانی میں اسلام قبول کیا۔"
