summary:
  ar: "كيخاتو، الإلخان من سنة 690هـ/1291م إلى سنة 694هـ/1295م، الابن الأصغر لأباقا، رفعه أمراء المغول بعد موت أخيه أرغون. وتصفه دائرة المعارف الإسلامية بالسخاء المفرط وبتبديد الخزينة، وبأنه الإلخان الوحيد الذي لم ينفذ أي إعدام. أدخل النقد الورقي على النمط الصيني بنصيحة وزيره، فانهارت مالية الدولة، ثم خذله أمراؤه وأُعدم عند زحف بيدو عليه {cite:encyclopaedia-of-islam-2 vol. 2 p. 1024}."
  en: "Gaykhatu was Ilkhan from 690/1291 to 694/1295, the younger son of Abaqa, raised to power by the Mongol leaders after the death of his brother Arghun. The Encyclopaedia of Islam describes his unbounded liberality and his emptying of the treasury, and says he was the only Ilkhan to carry out no executions. On his finance minister's advice he introduced Chinese-style paper money, the state's finances collapsed, and he was deserted by his amirs and executed when Baydu advanced against him {cite:encyclopaedia-of-islam-2 vol. 2 p. 1024}."
  ur: "گیخاتو 690ھ/1291ء سے 694ھ/1295ء تک ایل خان رہے، ابقا کے چھوٹے بیٹے تھے اور بھائی ارغون کی وفات کے بعد منگول سرداروں نے انہیں اقتدار دیا۔ دائرۃ المعارف الاسلامیہ ان کی بے پایاں سخاوت اور خزانہ لٹا دینے کا ذکر کرتا ہے اور کہتا ہے کہ وہ واحد ایل خان تھے جنہوں نے کوئی سزائے موت نافذ نہ کی۔ وزیرِ مالیات کے مشورے پر چینی طرز کا کاغذی زر متعارف کرایا تو ریاست کی مالیات ڈھے گئی، اور بیدو کی پیش قدمی پر امیروں نے ساتھ چھوڑ دیا اور انہیں قتل کر دیا گیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 1024}."
