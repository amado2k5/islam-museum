summary:
  ar: "من أمراء العرب في الجاهلية، عُرف بقيس الرأي؛ ترك الإمارة في آخر عمره وزهد، ومات في عُمان. يُذكر في المثل المتعلق بأخذ راحلة أمه. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
  en: "An Arab leader in pre-Islamic times known as Qays al-Ra'y; he gave up leadership, lived in asceticism and died in Oman. He appears in the proverb about taking a mount. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
  ur: "جاہلیت کے عرب سرداروں میں سے، جو قیس الرأی کے نام سے مشہور تھے؛ آخری عمر میں امارت چھوڑ کر زہد اختیار کیا اور عمان میں وفات پائی۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
