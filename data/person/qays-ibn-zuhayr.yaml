summary:
  ar: "قيس بن زهير العبسي «قيس الرأي»، أمير عبس وداهيتها من سادة عرب الجاهلية، زهد ورحل إلى عُمان؛ توفي سنة 10هـ ⁦(631م)⁩."
  en: "Qays ibn Zuhayr al-'Absi “Qays al-Ra'y” (d. 10/631), amir of 'Abs, proverbial strategist who died in Oman."
  ur: "جاہلیت کے عرب سرداروں میں سے، جو قیس الرأی کے نام سے مشہور تھے؛ آخری عمر میں امارت چھوڑ کر زہد اختیار کیا اور عمان میں وفات پائی۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 24}"
  es: "Qays ibn Zuhayr al-'Absi “Qays al-Ra'y” (m. 10/631), emir de 'Abs, proverbial estratega que murió en Omán."
