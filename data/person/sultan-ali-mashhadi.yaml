summary:
  ar: "خطاط النستعليق الذي بلغ به هذا القلم صورته الكلاسيكية، عمل نحو 1453–1520 في هراة لدى السلطان حسين بايقرا وعلي شير نوائي، وكتب في مشهد سنة 1514 رسالة منظومة في الخط {cite:blair-islamic-calligraphy-2006 p. 320}."
  en: "The nasta'liq master under whom the script reached its classical form; active c. 1453–1520 at Herat for Sultan Husayn Bayqara and Ali Shir Nava'i, he wrote a verse treatise on calligraphy at Mashhad in 1514 {cite:blair-islamic-calligraphy-2006 p. 320}."
  ur: "نستعلیق کے وہ استاد جن کے ہاتھوں یہ قلم اپنی کلاسیکی صورت کو پہنچا؛ تقریباً 1453–1520 میں ہرات میں سلطان حسین بایقرا اور علی شیر نوائی کے لیے کام کیا، اور 1514ء میں مشہد میں خطاطی پر ایک منظوم رسالہ لکھا {cite:blair-islamic-calligraphy-2006 p. 320}۔"
