summary:
  ar: "سياسي ماليزي، وُلد في موار بجوهر سنة 1947 باسم محيي الدين بن محمد ياسين. موظف في ولاية جوهر ثم رئيس حكومتها (1986–1995)، فصار نائب رئيس الوزراء سنة 2009، وأُقصي من أمنو وطُرد منها لانتقاده فضيحة 1MDB، وشارك في تأسيس حزب بيرساتو، وتولى رئاسة الوزراء ثامنا من مارس 2020 حتى استقالته في أغسطس 2021."
  en: "Malaysian politician, born at Muar, Johor, in 1947 as Mahiaddin bin Md. Yasin. A Johor civil servant and later the state's Menteri Besar (1986–1995), he rose to deputy prime minister in 2009, was dropped from cabinet and expelled from UMNO over his criticism of the 1MDB scandal, co-founded BERSATU, and served as eighth prime minister from March 2020 until his resignation in August 2021."
  ur: "ملائیشیائی سیاست دان، جو 1947ء میں موار، جوہر میں محی الدین بن محمد یاسین کے نام سے پیدا ہوئے۔ جوہر کے سرکاری افسر اور بعد میں ریاست کے وزیرِ اعلیٰ (1986ء–1995ء) رہے، 2009ء میں نائب وزیرِ اعظم بنے، 1MDB اسکینڈل پر تنقید کی وجہ سے کابینہ سے ہٹائے گئے اور امنو سے نکالے گئے، بیرساتو کی تاسیس میں شریک ہوئے اور مارچ 2020ء سے اگست 2021ء میں اپنے استعفے تک آٹھویں وزیرِ اعظم رہے۔"
