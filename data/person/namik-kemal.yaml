summary:
  ar: "كاتب وشاعر وصحفي ومصلح عثماني، وُلد في تكيرداغ سنة 1840 وتوفي في خيوس سنة 1888. من أبرز شباب العثمانيين المطالبين بالحكم الدستوري، حرّر صحف «تصوير أفكار» و«حرية» و«عبرة»، ونُفي ثلاث مرات بسبب كتاباته، وألّف مسرحية «الوطن أو سيليسترة» وروايتي «انتباه» و«جزمي»، فصار صوت فكرة الوطن والحرية في الأدب التركي الحديث."
  en: "Ottoman writer, poet, journalist and reformer, born at Tekirdağ in 1840 and died on Chios in 1888. A leading Young Ottoman campaigner for constitutional government, he edited the newspapers Tasvîr-i Efkâr, Hürriyet and İbret, was exiled three times for his writings, and wrote the play Vatan Yahut Silistre (Homeland or Silistra) and the novels İntibah and Cezmi, becoming the voice of fatherland and freedom in modern Turkish literature."
  ur: "عثمانی مصنف، شاعر، صحافی اور مصلح، جو 1840 میں تکیرداغ میں پیدا ہوئے اور 1888 میں خیوس میں وفات پائی۔ آئینی حکومت کے علمبردار نوجوان عثمانیوں کے سرکردہ رہنما، انہوں نے «تصویر افکار»، «حریت» اور «عبرت» کی ادارت کی، اپنی تحریروں کی پاداش میں تین بار جلاوطن ہوئے، اور ڈراما «وطن یا سلیسترے» اور ناول «انتباہ» و «جزمی» لکھے۔"
