roles: [scholar]
gender: male
summary:
  ar: "محمود بن أحمد بن محمود بن بختيار، أبو المناقب شهاب الدين الزنجاني، لغوي من فقهاء الشافعية، من أهل زنجان، استوطن بغداد وولي نيابة قضاء القضاة ودرس بالنظامية ثم بالمستنصرية، واستشهد ببغداد أيام نكبتها بالمغول، وتوفي سنة 656 هـ الموافقة 1258 م."
  en: "Mahmud ibn Ahmad ibn Mahmud ibn Bakhtiyar, Abu al-Manaqib Shihab al-Din al-Zanjani, a philologist and Shafi'i jurist from Zanjan who settled in Baghdad, was deputy to the chief judge and taught at the Nizamiyya and the Mustansiriyya; al-Zirikli says he was killed as a martyr in Baghdad during the Mongol catastrophe, in 656 AH (1258 CE)."
  es: "Mahmud ibn Ahmad ibn Mahmud ibn Bakhtiyar, Abu al-Manaqib Shihab al-Din al-Zanjani, filólogo y jurista shafi'í de Zanjan que se estableció en Bagdad, fue adjunto del juez principal y enseñó en la Nizamiyya y la Mustansiriyya; al-Zirikli dice que fue asesinado como mártir en Bagdad durante la catástrofe mongola, en el año 656 AH (1258 d. C.)."
  fr: "Mahmud ibn Ahmad ibn Mahmud ibn Bakhtiyar, Abu al-Manaqib Shihab al-Din al-Zanjani, philologue et juriste chaféite de Zanjan qui s'est installé à Bagdad, était adjoint du juge en chef et enseignait à la Nizamiyya et à la Mustansiriyya; al-Zirikli dit qu'il a été tué en martyr à Bagdad lors de la catastrophe mongole, en 656 AH (1258 CE)."
  ur: "محمود بن احمد بن محمود ابن بختیار، ابو المناقب شہاب الدین الزنجانی، زنجان سے تعلق رکھنے والے ماہر فلسفی اور شافعی فقیہ جو بغداد میں آباد ہوئے، چیف جج کے نائب تھے اور نظامیہ اور مستنصریہ میں پڑھاتے تھے۔ الزرکلی کا کہنا ہے کہ وہ بغداد میں منگول تباہی کے دوران 656 ہجری ⁦(1258 عیسوی)⁩ میں شہید ہوئے تھے۔"
  tr: "Mahmud ibn Ahmed ibn Mahmud ibn Mahmud ibn Bakhtiyar, Şafii hukukçuları arasında dilbilimci olan Ebu el-Manaqib Şihab al-Din el-Zancani, Zancan'dan Bağdat'a yerleşti, yardımcı yargıç olarak görev yaptı, önce Nizamiyye'de ve ardından Mustansiriya'da eğitim aldı ve Nakba sırasında Moğollar tarafından Bağdat'ta şehit edildi. 656 Hicri'de, yani 1258 yılında öldü."
  id: "Mahmoud ibn Ahmad ibn Mahmoud ibn Bakhtiar, Abu al-Manaqib Shihab al-Din al-Zanjani, seorang ahli bahasa di antara ahli hukum Shafi'i dari Zanjan, menetap di Baghdad, menjabat sebagai wakil hakim, belajar di Nizamiyya dan kemudian di Mustansiriya, dan menjadi martir di Baghdad selama Nakba oleh bangsa Mongol. Ia meninggal pada tahun 656 H, yang bertepatan dengan tahun 1258 M."
