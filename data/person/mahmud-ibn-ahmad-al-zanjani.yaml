summary:
  ar: "محمود بن أحمد بن محمود بن بختيار، أبو المناقب شهاب الدين الزنجاني، لغوي من فقهاء الشافعية، من أهل زنجان، استوطن بغداد وولي نيابة قضاء القضاة ودرس بالنظامية ثم بالمستنصرية، واستشهد ببغداد أيام نكبتها بالمغول، وتوفي سنة 656 هـ الموافقة 1258 م."
  en: "Mahmud ibn Ahmad ibn Mahmud ibn Bakhtiyar, Abu al-Manaqib Shihab al-Din al-Zanjani, a philologist and Shafi'i jurist from Zanjan who settled in Baghdad, was deputy to the chief judge and taught at the Nizamiyya and the Mustansiriyya; al-Zirikli says he was killed as a martyr in Baghdad during the Mongol catastrophe, in 656 AH (1258 CE)."
