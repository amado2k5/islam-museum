summary:
  ar: "أبو منصور عبد الملك بن محمد بن إسماعيل الثعالبي النيسابوري؛ قال ابن بسام صاحب الذخيرة في حقه: كان في وقته راعي ثلاثة العلم وجامع أشتات النثر والنظم، رأس المؤلفين في زمانه وإمام المصنفين بحق قرانه، سار ذكره سير المثل وضربت إليه أكباد الإبل؛ صاحب «يتيمة الدهر» و«فقه اللغة» و«لطائف المعارف» وغيرها؛ ولد سنة خمسين وثلاثمائة وتوفي سنة تسع وعشرين وأربعمائة {cite:wafayat-ayan}."
  en: "al-Tha'alibi of Nishapur (350–429) — the great anthologist, author of Yatimat al-Dahr, Lata'if al-Ma'arif and Fiqh al-Lugha; Ibn Bassam called him head of authors of his age {cite:wafayat-ayan}."
