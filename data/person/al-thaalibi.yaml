summary:
  ar: "أبو منصور عبد الملك بن محمد بن إسماعيل الثعالبي النيسابوري (٣٥٠-٤٢٩هـ)؛ قال ابن بسام صاحب «الذخيرة» في حقه: كان في وقته راعي ثلاثة العلم وجامع أشتات النثر والنظم، رأس المؤلفين في زمانه وإمام المصنفين بحق قرانه، سار ذكره سير المثل وضربت إليه أكباد الإبل {cite:wafayat-ayan}. قرأ الأدب على أبي بكر الخوارزمي، ووصل بآل ميكالة أشرف بيوت نيسابور، ورحل إلى بخارى في أيام السامانيين الأخيرة، وأقام بجرجان مرتين مهدياً إلى قابوس بن وشمكير، ثم إلى بلاط الخوارزمشاه مأمون بن مأمون بجرجانية حيث صحب ابن سينا والبيروني، ثم بغزنة، وعاد فقضى سنيّه الأخيرة بنيسابور؛ صاحب «يتيمة الدهر» و«فقه اللغة» و«لطائف المعارف» وذيلها «تتمة اليتيمة» {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}."
  en: "al-Tha'alibi of Nishapur (350–429) — the great anthologist, author of Yatimat al-Dahr, Lata'if al-Ma'arif and Fiqh al-Lugha; Ibn Bassam called him head of authors of his age {cite:wafayat-ayan}. He studied adab under Abu Bakr al-Khwarazmi, tied himself to the Mikali family, travelled to Bukhara in the Samanids' last days, sojourned twice at Jurjan dedicating works to Qabus ibn Wushmgir, then joined the Khwarazmshah Ma'mun II's court at Jurjaniyya alongside Ibn Sina and al-Biruni, resided at Ghazna, and returned to spend his last years at Nishapur {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}."
  ur: "نیشاپور کا ثعالبی (350-429ھ) — عظیم مرتب ادیب، «یتیمۃ الدہر»، «لطائف المعارف» اور «فقہ اللغہ» کا صاحب؛ ابن بسام نے اسے اپنے عہد کے مصنفوں کا سرغنہ کہا {cite:wafayat-ayan}۔ اس نے ابو بکر خوارزمی سے ادب پڑھا، آل میکالہ سے تعلق جوڑا، سامانیوں کے آخری ایام میں بخارا گیا، جرجان میں دو مرتبہ قیام کیا اور قابوس بن وشمگیر کے نام تصانیف وقف کیں، پھر جرجانیہ میں خوارزمشاہ مامون دوم کے دربار میں ابن سینا اور بیرونی کے ساتھ رہا، غزنہ میں مقیم ہوا، اور آخری برس نیشاپور میں گزارے {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}۔"
