education:
  did_you_know:
    ar: "الكسائي علي بن حمزة شيخ قراءة الكوفة ونحوها ومعلم الهادي والأمين والرشيد؛ مات بالري سنة ١٨٩هـ وهو يصحب الرشيد."
    en: "Al-Kisa'i, Ali ibn Hamza, was shaykh of Kufa's recitation and grammar and tutor to al-Hadi, al-Amin and al-Rashid; he died at Rayy in 189 AH in al-Rashid's company."
    ur: "کسائی علی بن حمزہ، کوفہ کے قراءت و نحو کے شیخ اور ہادی، امین اور رشید کے معلم؛ 189ھ میں رے میں رشید کے ہمراہ وفات پائے۔"
    sources: [source/muruj-al-dhahab, source/fihrist-ibn-al-nadim]
class: person
label: { ar: "الكسائي النحوي", en: "al-Kisa'i the Grammarian" }
summary:
  ar: "علي بن حمزة الكسائي شيخ قراءة الكوفة ونحوها ومعلم الهادي والأمين والرشيد؛ دفن بالري. وعند المسعودي مات سنة تسع وثمانين ومائة وكان شخص مع الرشيد إلى الري فمات بها {cite:muruj-al-dhahab p. 331}، وعند ابن النديم هو علي بن حمزة بن عبد الله بن بهمن بن فيروز أصله أعجمي من القراء السبعة من أهل الكوفة ومنشؤه بها وكان يتنقل في البلدان ومات بقرية من قرى {cite:fihrist-ibn-al-nadim p. 76}، وهو الذي ناظر سيبويه وحاكمه إلى فصحاء الأعراب فكان على الصواب وكلمه عند يحيى بن خالد فأجازه بعشرة آلاف درهم {cite:fihrist-ibn-al-nadim p. 143}"
  en: "Ali ibn Hamza al-Kisa'i, master of Kufa's reading and grammar and tutor of al-Hadi, al-Amin and al-Rashid; buried at Rayy."
