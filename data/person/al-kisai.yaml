label: { ar: "الكسائي النحوي", en: "al-Kisa'i the Grammarian" }
summary:
  ar: "علي بن حمزة الكسائي شيخ قراءة الكوفة ونحوها ومعلم الهادي والأمين والرشيد؛ دفن بالري.، وعند المسعودي مات سنة تسع وثمانين ومائة وكان شخص مع الرشيد إلى الري فمات بها {cite:muruj-al-dhahab p. 331}، وعند ابن النديم هو علي بن حمزة بن عبد الله بن بهمن بن فيروز أصله أعجمي من القراء السبعة من أهل الكوفة ومنشؤه بها وكان يتنقل في البلدان ومات بقرية من قرى {cite:fihrist-ibn-al-nadim p. 76}"
  en: "Ali ibn Hamza al-Kisa'i, master of Kufa's reading and grammar and tutor of al-Hadi, al-Amin and al-Rashid; buried at Rayy."
