summary:
  ar: "علي بن حمزة الكسائي شيخ قراءة الكوفة ونحوها ومعلم الهادي والأمين والرشيد؛ دفن بالري. وعند المسعودي مات سنة تسع وثمانين ومائة وكان شخص مع الرشيد إلى الري فمات بها {cite:muruj-al-dhahab p. 331}، وعند ابن النديم هو علي بن حمزة بن عبد الله بن بهمن بن فيروز أصله أعجمي من القراء السبعة من أهل الكوفة ومنشؤه بها وكان يتنقل في البلدان ومات بقرية من قرى {cite:fihrist-ibn-al-nadim p. 76}، وهو الذي ناظر سيبويه وحاكمه إلى فصحاء الأعراب فكان على الصواب وكلمه عند يحيى بن خالد فأجازه بعشرة آلاف درهم {cite:fihrist-ibn-al-nadim p. 143}"
  en: "Ali ibn Hamza al-Kisa'i, master of Kufa's reading and grammar and tutor of al-Hadi, al-Amin and al-Rashid; buried at Rayy."
  es: "Ali ibn Hamza al-Kisa'i, maestro de lectura y gramática de Kufa y tutor de al-Hadi, al-Amin y al-Rashid; enterrado en Rayy."
  fr: "Ali ibn Hamza al-Kisa'i, maître de lecture et de grammaire de Kufa et tuteur d'al-Hadi, d'al-Amin et d'al-Rashid; enterré à Rayy."
  ur: "علی ابن حمزہ کسائی، کوفہ کے پڑھنے اور گرامر کے ماہر اور الہادی، الامین اور الرشید کے استاد؛ رے میں دفن کیا گیا۔"
  tr: "Kufa ve çevresinin okuma ustası ve el-Hadi, el-Amin ve el-Reşid'in öğretmeni Ali bin Hamza el-Kisai; Rayy'de defnedildi. El-Mes'udi'ye göre, 189 Hicri yılında öldü. El-Reşid eşliğinde Rayı'ya gitti ve orada öldü {alıntı::Muric-al-Dhahab, s. 331}. İbn el-Nadim'e göre, yabancı kökenli Ali ibn Hamza ibn Abdullah ibn Bahman ibn Fayruz'dur ve Kufa'dan gelen yedi şiirciden biridir. Topraklar arasında seyahat etti ve köylerden birinde öldü {atıf:Fihrist-ibn-al-Nadim s. 76}. Sibavey ile tartıştı ve etkileyici bedevilerle hüküm sürdü, bu yüzden haklıydı ve Yahya ibn Khalid ile konuştu, o da ona on bin dirhem izin verdi {atıf:Fihrist-ibn-al-nadim s. 143}"
  id: "Ali ibn Hamza al-Kisai, guru pembacaan Kufa dan sekitarnya, serta guru al-Hadi, al-Amin, dan al-Rashid; ia dimakamkan di Rayy. Menurut al-Mas'udi, ia meninggal pada tahun 189 H. Ia ditemani oleh al-Rashid ke Rayy, di mana ia wafat {cite:Muruj-al-Dhahab, hlm. 331}. Menurut Ibn al-Nadim, ia adalah Ali ibn Hamza ibn Abdullah ibn Bahman ibn Fayruz, berasal dari luar negeri, di antara tujuh pembaca dari Kufa yang berasal dari sana. Ia melakukan perjalanan antar negeri dan meninggal di salah satu desa {cite:fihrist-ibn-al-nadim hlm. 76}. Ia berdebat tentang Sibawayh dan memerintah bersama Badui yang fasih, sehingga ia benar dan berbicara dengan Yahya ibn Khalid, yang memberinya izin untuk sepuluh ribu dirham {cite:fihrist-ibn-al-nadim hlm. 143}"
