label: { ar: "وجيه الدين القزويني" }
names:
  - { value: "وجيه الدين أبو الخير أحمد بن إسماعيل بن يوسف الطالقاني القزويني الشافعي الواعظ", kind: full }
summary:
  ar: "العلامة وجيه الدين أبو الخير أحمد بن إسماعيل الطالقاني القزويني الفقيه الشافعي الواعظ؛ ولد سنة إحدى وخمسمائة وتفقه على ملكدار القزويني وفاق الأقران وسمع من الفراوي وزاهر وخلقاً، ثم قدم بغداد قبل الستين ودرس بها ووعظ، وكان إماماً في المذهب والخلاف والأصول والتفسير والوعظ، وانفق كلامه على الناس لحسن سمته وحلاوة منطقه، وصنف كتاب الإنبيان في مسائل القرآن رداً على الحلولية والجهمية، وسار رئيس الوعاظ وكان يتكلم يوماً وابن الجوزي يوماً ويحضر الخليفة من وراء الستار وتحضر الخلائق والأمم؛ رجع إلى قزوين سنة ثمانين ولزم العبادة إلى أن مات في المحرم سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 780-781}."
  en: "The learned Wajih al-Din Abu al-Khayr Ahmad b. Isma'il al-Taliqani al-Qazwini, Shafi'i jurist and preacher; b. 501, outstripped his peers at Qazwin, then came to Baghdad before 560 to teach and preach — imam in madhhab, khilaf, usul, tafsir and homiletics, his speech beloved for its sweetness; he wrote al-Inbyan on questions of the Qur'an against the Hululiyya and Jahmiyya, and became chief of the preachers — he would speak one day and Ibn al-Jawzi the next, the caliph listening from behind the curtain and the multitudes attending; he returned to Qazwin in 580 and kept to worship till he died in Muharram 590 {cite:shadharat-dhahab p. 780-781}."
  es: "El erudito Wajih al-Din Abu al-Khayr Ahmad b. Isma'il al-Taliqani al-Qazwini, jurista y predicador shafi'í, nacido en 501, superó a sus compañeros en Qazwin y luego llegó a Bagdad antes de 560 para enseñar y predicar. Fue imán en madhhab, khilaf, usul, tafsir y homilética; su discurso era apreciado por su dulzura. Escribió al-Inbyan sobre cuestiones del Corán contra los hululiyya y jahmiyya, y se convirtió en jefe de los predicadores. Un día hablaba él y al siguiente Ibn al-Jawzi, con el califa escuchando detrás de la cortina y las multitudes presentes. Regresó a Qazwin en 580 y continuó practicando su culto hasta su muerte en Muharram de 590 {cite:shadharat-dhahab p. 780-781}."
  fr: "Le savant Wajih al-Din Abu al-Khayr Ahmad b. Isma'il al-Taliqani al-Qazwini, juriste et prédicateur chaféite, né en 501, surpassa ses pairs à Qazwin, puis vint à Bagdad avant 560 pour enseigner et prêcher. Imam en matière de madhhab, de khilaf, d'usul, de tafsir et d'homilétique, son discours était apprécié pour sa douceur. Il écrivit al-Inbyan sur les questions du Coran contre les Hululiyya et les Jahmiyya, et devint le chef des prédicateurs. Il prêchait un jour, et Ibn al-Jawzi le lendemain, le calife écoutant derrière le rideau tandis que les foules assistaient. Il retourna à Qazwin en 580 et continua à adorer jusqu'à sa mort en Muharram 590 {cite:shadharat-dhahab p. 780-781}."
  ur: "عالم وجیہہ الدین ابو الخیر احمد بی۔ اسماعیل الطالقانی القزوینی، شافعی فقیہ اور مبلغ؛ ب 501، قزوین میں اپنے ساتھیوں کو پیچھے چھوڑ دیا، پھر 560 سے پہلے بغداد آیا اور تعلیم و تبلیغ کے لیے - مذہب، خلافت، اصول، تفسیر اور ہوملیٹکس میں امام، اس کی تقریر اس کی مٹھاس کی وجہ سے محبوب تھی۔ اس نے حلولیہ اور جہمیہ کے خلاف قرآن کے سوالات پر الانبیان لکھا، اور مبلغین کے سربراہ بن گئے - وہ ایک دن تقریر کریں گے اور اگلے دن ابن الجوزی، خلیفہ پردے کے پیچھے سے سن رہے تھے اور کثیر تعداد میں شرکت کریں گے۔ وہ 580 میں قزوین واپس آئے اور محرم 590 میں وفات تک عبادت کرتے رہے۔ 780-781}۔"
