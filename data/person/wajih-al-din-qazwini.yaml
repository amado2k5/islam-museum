names:
  - { value: "وجيه الدين أبو الخير أحمد بن إسماعيل بن يوسف الطالقاني القزويني الشافعي الواعظ", kind: full }
summary:
  ar: "العلامة وجيه الدين أبو الخير أحمد بن إسماعيل الطالقاني القزويني الفقيه الشافعي الواعظ؛ ولد سنة إحدى وخمسمائة وتفقه على ملكدار القزويني وفاق الأقران وسمع من الفراوي وزاهر وخلقاً، ثم قدم بغداد قبل الستين ودرس بها ووعظ، وكان إماماً في المذهب والخلاف والأصول والتفسير والوعظ، وانفق كلامه على الناس لحسن سمته وحلاوة منطقه، وصنف كتاب الإنبيان في مسائل القرآن رداً على الحلولية والجهمية، وسار رئيس الوعاظ وكان يتكلم يوماً وابن الجوزي يوماً ويحضر الخليفة من وراء الستار وتحضر الخلائق والأمم؛ رجع إلى قزوين سنة ثمانين ولزم العبادة إلى أن مات في المحرم سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 780-781}."
  en: "The learned Wajih al-Din Abu al-Khayr Ahmad b. Isma'il al-Taliqani al-Qazwini, Shafi'i jurist and preacher; b. 501, outstripped his peers at Qazwin, then came to Baghdad before 560 to teach and preach — imam in madhhab, khilaf, usul, tafsir and homiletics, his speech beloved for its sweetness; he wrote al-Inbyan on questions of the Qur'an against the Hululiyya and Jahmiyya, and became chief of the preachers — he would speak one day and Ibn al-Jawzi the next, the caliph listening from behind the curtain and the multitudes attending; he returned to Qazwin in 580 and kept to worship till he died in Muharram 590 {cite:shadharat-dhahab p. 780-781}."
