summary:
  ar: "الداماد إبراهيم باشا، الصدر الأعظم في عهد أحمد الثالث وأول مسئول عثماني يعترف بأهمية التعرف على أوروبا؛ أرسل السفراء إلى فينا وباريس لأول مرة، وفي عهده نشطت الترجمة وأُنشئ مكتب الطباعة في إستانبول."
  en: "Damat Ibrahim Pasha, grand vizier under Ahmad III and the first Ottoman official to acknowledge the need to understand Europe; sent ambassadors to Vienna and Paris for the first time, and in his day translation flourished and Istanbul gained a printing office."
  es: "Damat Ibrahim Pasha, gran visir bajo el reinado de Ahmad III y el primer funcionario otomano en reconocer la necesidad de comprender Europa, envió embajadores a Viena y París por primera vez, y en su época floreció la traducción y Estambul contó con una imprenta."
  fr: "Damat Ibrahim Pacha, grand vizir sous Ahmad III et premier responsable ottoman à reconnaître la nécessité de comprendre l'Europe, envoya pour la première fois des ambassadeurs à Vienne et à Paris, et à son époque, la traduction connut un essor considérable et Istanbul se dota d'une imprimerie."
  ur: "دامت ابراہیم پاشا، احمد III کے ماتحت عظیم وزیر اور یورپ کو سمجھنے کی ضرورت کو تسلیم کرنے والا پہلا عثمانی اہلکار؛ اس نے پہلی بار ویانا اور پیرس میں سفیر بھیجے اور اس کے زمانے میں ترجمے کی ترقی ہوئی اور استنبول کو پرنٹنگ کا دفتر مل گیا۔"
  tr: "Ahmed III döneminde Sadrazam olan ve Avrupa'yı öğrenmenin önemini kabul eden ilk Osmanlı yetkilisi olan damadı İbrahim Paşa, ilk kez Viyana ve Paris'e elçiler gönderdi ve onun saltanatı sırasında çeviri faaliyete geçti, İstanbul'da bir matbaa kuruldu."
  id: "Menantu Ibrahim Pasha, Grand Vizier pada masa pemerintahan Ahmed III dan pejabat Ottoman pertama yang mengakui pentingnya mempelajari Eropa, mengirim duta besar ke Wina dan Paris untuk pertama kalinya, dan selama masa pemerintahannya, penerjemahan menjadi aktif dan kantor percetakan didirikan di Istanbul."
