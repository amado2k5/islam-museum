summary:
  ar: "أبو دلف مِسْعَر بن مهلهل الخزرجي، معدني ورحّالة من القرن الرابع الهجري، ينسب إليه رسالتان جغرافيتان عن رحلاته في المشرق، والموسوعة ترى أن الأولى مزيفة في ادعائها الرحلة، وأن الثانية أمينة. {cite:encyclopaedia-of-islam-2 vol. 1 p. 135}"
  en: "Abu Dulaf Misar b. Muhalhil al-Khazraji, a mineralogist and traveller of the fourth/tenth century, to whom two geographical risalas on his journeys are attributed. The encyclopaedia judges the first to be spurious in its claimed journey and the second to be genuine in its itinerary. {cite:encyclopaedia-of-islam-2 vol. 1 p. 135}"
  ur: "ابو دلف مسعر بن مہلہل الخزرجی، چوتھی/دسویں صدی کے معدنیات کے ماہر اور سیاح، جن کی طرف دو جغرافیائی رسالے منسوب ہیں۔ موسوعہ پہلے رسالے کے دعوائے سفر کو جعلی اور دوسرے کے راستے کو قابل تصدیق قرار دیتی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 135}"
