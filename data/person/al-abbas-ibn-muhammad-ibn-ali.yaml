label: { ar: "العباس بن محمد بن علي", en: "al-Abbas ibn Muhammad ibn Ali" }
summary:
  ar: "العباس بن محمد بن علي بن عبد الله بن العباس عمّ السفاح والمنصور؛ عند البلاذري: جعله المنصور على الغزاة سنة 149 من حديثة الموصل وأمره أن يغزو بهم كمخ فسار مع الحسن بن قحطبة حتى ملطية فحملا منها الميرة ثم أناخا على كمخ وأمر بنصب المجانيق فقتل الروم من المسلمين بالحجارة مائتي رجل فاتخذ المسلمون الدبابات حتى فتحوه، وكان معه في غزاته هذه مطر الوراق."
  en: "al-Abbas ibn Muhammad ibn Ali ibn Abdallah ibn al-Abbas, uncle of al-Saffah and al-Mansur; in al-Baladhuri: al-Mansur set him over the raiders of year 149 from Hadithat al-Mawsil ordering him to march them on Kamkh; he went with al-Hasan ibn Qahtaba to Malatya, took provisions, camped on Kamkh and ordered the mangonels set — the Romans killed two hundred Muslims with stones until the Muslims took the fort behind armoured shelters; Matar al-Warraq was with him on this expedition."
