  ar: "فقيه باكستاني حنفي ديوبندي، وُلد سنة 1943، رئيس وفاق المدارس العربية وقاضٍ سابق في المحكمة العليا الباكستانية. يُعد من أعيان علماء عصره ومهندس المصرفية الإسلامية الحديثة ومعايير أيوفي، ومن كتبه «تكملة فتح الملهم» و«توضيح القرآن»."
