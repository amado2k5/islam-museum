names:
  - { value: "عبد الرزاق بن الشيخ عبد القادر بن أبي صالح الحافظ الثقة الحنبلي أبو بكر الجيلي", kind: full }
summary:
  ar: "عبد الرزاق بن الشيخ عبد القادر الجيلي الحنبلي أبو بكر؛ ولد يوم الاثنين ثامن عشر ذي القعدة سنة ثمان وعشرين وخمسمائة ببغداد، أسمعه أبوه من أبي الفضل الأرموي وطبقته ثم سمع بنفسه، قال الضياء: ما رأيت ببغداد في تيقظه وتحريه مثله، وقال ابن نقطة كان حافظاً ثقة مأموناً، وقال ابن النجار كان حافظاً متقناً فقيهاً على مذهب أحمد ورعاً منقطعاً في منزله لا يخرج إلا في الجمعات محباً للرواية مكرماً لطلاب العلم عزيز النفس على منهاج السلف، وقال أبو شامة كان زاهداً عابداً لم يكن في أولاد الشيخ مثله ولم يدخل فيما دخل فيه غيره من إخوته؛ توفي ليلة السبت سادس شوال سنة ثلاث وستمائة وصلى عليه بمواضع متعددة وكان يوماً مشهوداً ودفن بمقبرة الإمام أحمد {cite:shadharat-dhahab p. 17-18}."
  en: "Abd al-Razzaq, son of Shaykh Abd al-Qadir al-Jilani, Hanbali hafiz — b. Monday 18 Dhu al-Qa'da 528 in Baghdad, trained by his father then in his own right; al-Diya' saw none in Baghdad more wakeful and painstaking, Ibn Nuqta and Ibn al-Najjar call him trustworthy, exact, a jurist of Ahmad's madhhab, pious, secluded at home save for Fridays, generous to knowledge-seekers; Abu Shama: 'ascetic, devout — none of the shaykh's sons like him, and he never entered what his brothers entered.' He died Saturday night 6 Shawwal 603, prayed over at several places on a witnessed day, buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 17-18}."
  fr: "Abd al-Razzaq, fils du cheikh Abd al-Qadir al-Jilani, hafiz hanbalite — né le lundi 18 dhu al-qa'da 528 à Bagdad, formé par son père puis par lui-même ; al-Diya' ne vit à Bagdad personne de plus vigilant et minutieux, Ibn Nuqta et Ibn al-Najjar le disent digne de confiance, exact, juriste de l'école d'Ahmad, pieux, retiré chez lui sauf le vendredi, généreux envers les chercheurs de savoir ; Abu Shama : « ascète, dévot — aucun des fils du cheikh ne lui ressemblait, et il n'entra jamais dans ce où entrèrent ses frères. » Il mourut la nuit du samedi 6 shawwal 603 ; on pria sur lui en plusieurs endroits lors d'une journée mémorable, et il fut inhumé au cimetière de l'imam Ahmad {cite:shadharat-dhahab p. 17-18}."
  es: "Abd al-Razzaq, hijo del jeque Abd al-Qadir al-Jilani, hafiz hanbalí, nació el lunes 18 de Dhu al-Qa'da de 528 en Bagdad, donde fue formado por su padre y luego por mérito propio. Al-Diya' no vio a nadie en Bagdad más atento y meticuloso. Ibn Nuqta e Ibn al-Najjar lo describen como digno de confianza, exacto, jurista de la escuela de pensamiento de Ahmad, piadoso, recluido en su casa salvo los viernes y generoso con los buscadores de conocimiento. Abu Shama lo describe como asceta, devoto, ninguno de los hijos del jeque se le parecía, y nunca siguió los pasos de sus hermanos. Falleció la noche del sábado 6 de Shawwal de 603, fue honrado con oraciones en varios lugares en un día presenciado y enterrado en el cementerio del Imam Ahmad {cite: shadharat-dhahab p. 17-18}."
  ur: "عبد الرزاق، ولد شیخ عبد القادر الجیلانی، حنبلی حافظ۔ سوموار 18 ذی القعدہ 528 بغداد میں، اس کے والد نے اس کے بعد اپنے طور پر تربیت حاصل کی۔ الدیاء نے بغداد میں اس سے زیادہ بیدار اور محنتی کوئی نہیں دیکھا، ابن نکتہ اور ابن النجار اسے ثقہ، صحیح، احمد کے مذہب کا ایک فقیہ، پرہیزگار، جمعہ کے دن کے علاوہ گھر میں تنہا رہنے والا، علم کے متلاشیوں کے لیے فیاض قرار دیتے ہیں۔ ابو شمع: 'سنجیدہ، پرہیزگار - شیخ کے بیٹوں میں سے کوئی بھی اس جیسا نہیں ہے، اور وہ کبھی اس میں داخل نہیں ہوا جس میں اس کے بھائی داخل ہوئے تھے۔' آپ کا انتقال ہفتہ کی رات 6 شوال 603 کو ہوا، کئی مقامات پر ایک گواہی کے دن نماز پڑھی، امام احمد کے قبرستان میں دفن ہوئے۔ 17-18}۔"
