summary:
  ar: "أحمد رسمي أفندي، من أهل ريثيمنو في كريت من أصل يوناني، ولد سنة 1112هـ/1700م، وانتقل إلى إسطنبول سنة 1146هـ/1733م، وصار سفيرًا عثمانيًا إلى فيينا (1171هـ/1757م) وإلى بلاط برلين (1176هـ/1763م)، وألّف رحلتيه، وكتاب «خلاصة الاعتبار» عن الحرب الروسية العثمانية، وتوفي في إسطنبول سنة 1197هـ/1783م {cite:encyclopaedia-of-islam-2 vol. 1 p. 316}."
  en: "Ahmed Resmi Efendi, Ottoman statesman, envoy and historian, born in 1112/1700 at Rethymno in Crete of Greek descent, who came to Istanbul in 1733. He was Ottoman envoy to Vienna in 1757 and ambassador to Berlin in 1763, wrote accounts of both embassies, the Khulasat al-i'tibar on the Russo-Turkish war, and biographical collections. He died in Istanbul on 2 Shawwal 1197/31 August 1783 {cite:encyclopaedia-of-islam-2 vol. 1 p. 316}."
