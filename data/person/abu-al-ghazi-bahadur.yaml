  es: "Ficha preliminar de Abu al-Ghazi Bahadur Khan, kan de Khwarezm y autor del Shajara-yi Turkman y el Shajara-yi Turk, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
