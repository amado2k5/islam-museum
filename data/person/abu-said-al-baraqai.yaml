summary:
  ar: "أبو سعيد البراقعي، من كبار العارفين بالشام، روى عنه أحمد بن أبي الحواري قول الحسن: تفقّدوا الطلاوة في الصلاة وفي القرآن وفي الذكر، فإن وجدتموها فامضوا وأبشروا، وإن لم تجدوها فاعلموا أن الباب مغلق."
  en: "Abu Sa'id al-Baraqa'i, one of the great knowers of God in Syria; Ahmad ibn Abi al-Hawari relates from him the saying of al-Hasan: look for the sweetness in prayer, in the Qur'an and in remembrance; if you find it, go on and rejoice, and if you do not find it, know that the door is closed."
  ur: "ابو سعید براقعی شام کے بڑے عارفین میں سے تھے۔ احمد بن ابی الحواری نے ان سے حسن کا قول نقل کیا: نماز، قرآن اور ذکر میں مٹھاس تلاش کرو؛ اگر پا لو تو آگے بڑھو اور خوش ہو جاؤ، اور اگر نہ پاؤ تو جان لو کہ دروازہ بند ہے۔"
