summary:
  ar: "مؤرخ ولغوي وإداري تونسي (1884–1968)، وُلد وتوفي بتونس العاصمة. تعلّم بالمدرسة الصادقية وبمدرسة العلوم السياسية بباريس، ودرّس التاريخ بالخلدونية، وترأّس خزينة المحفوظات التونسية فوضع أول فهرس لمحتوياتها، وتولى القيادة على المهدية والوطن القبلي، وصار وزير القلم بين 1943 و1947، وبعد الاستقلال ترأّس مصلحة الآثار فأسّس خمسة متاحف. من كتبه «خلاصة تاريخ تونس» (1918) و«كتاب العمر»، ولُقّب ببارون التاريخ التونسي، وأهدى مكتبته المخطوطة إلى المكتبة الوطنية."
  en: "Tunisian historian, linguist and administrator (1884–1968), born and deceased at Tunis. Trained at Sadiki College and at the Paris School of Political Sciences, he taught history at the Khaldounia, headed the Tunisian national archives and made their first catalogue, governed at Mahdia and in the Cap Bon, served as Minister of the Pen from 1943 to 1947, and after independence directed the antiquities service, founding five museums. His works, from the Résumé de l'histoire de Tunisie (1918) to Kitab al-'Umr, earned him the name of 'baron of Tunisian history', and he bequeathed his rich manuscript library to the National Library of Tunisia."
  ur: "تونسی مورخ، ماہرِ لسانیات اور منتظم (1884–1968)، جو تونس شہر میں پیدا ہوئے اور وہیں انتقال ہوا۔ صادقی کالج اور پیرس کے سکول آف پولیٹیکل سائنسز سے تعلیم پائی، خلدونیہ میں تاریخ پڑھائی، قومی محفوظات کے سربراہ بن کر ان کی پہلی فہرست مرتب کی، مہدیہ اور الوطن القبلی کے گورنر رہے، 1943ء سے 1947ء تک وزیرِ قلم رہے، اور آزادی کے بعد محکمۂ آثارِ قدیمہ کی سربراہی میں پانچ عجائب گھر قائم کیے۔ ان کی تصانیف، «خلاصہ تاریخِ تونس» ⁦(1918ء)⁩ سے «کتاب العمر» تک، نے انہیں تونسی تاریخ کا بیرن کہلوایا، اور انہوں نے اپنا مخطوطات کا ذخیرہ قومی کتب خانے کو عطیہ کیا۔"
  es: "Historiador, lingüista y administrador tunecino (1884-1968), nacido y fallecido en Túnez. Formado en el Colegio Sadiki y en la Escuela de Ciencias Políticas de París, impartió clases de historia en Khaldounia, dirigió el archivo nacional tunecino y elaboró su primer catálogo, gobernó en Mahdia y en Cap Bon, fue Ministro de la Pluma de 1943 a 1947 y, tras la independencia, dirigió el servicio de antigüedades, fundando cinco museos. Sus obras, desde el Résumé de l'histoire de Tunisie (1918) hasta el Kitab al-'Umr, le valieron el sobrenombre de «barón de la historia tunecina», y legó su rica biblioteca de manuscritos a la Biblioteca Nacional de Túnez."
  fr: "Historien, linguiste et administrateur tunisien (1884-1968), né et décédé à Tunis. Formé au Collège Sadiki et à l'École des sciences politiques de Paris, il enseigna l'histoire à la Khaldounia, dirigea les Archives nationales tunisiennes et en réalisa le premier catalogue, exerça des fonctions administratives à Mahdia et au Cap Bon, fut ministre de la Pen de 1943 à 1947, et, après l'indépendance, dirigea le service des antiquités, fondant cinq musées. Ses œuvres, du Résumé de l'histoire de Tunisie (1918) au Kitab al-'Umr, lui valurent le surnom de « baron de l'histoire tunisienne », et il légua sa riche bibliothèque de manuscrits à la Bibliothèque nationale de Tunisie."
  tr: "Tunuslu tarihçi, dilbilimci ve yönetici (1884–1968), Tunus'ta doğup ölmüştür. Paris'teki Sadiqiya Okulu ve Siyaset Bilimi Okulu'nda eğitim gördü, Chaldunia'da tarih okudu, Tunus arşiv hazinesinin başında, içeriğin ilk kataloğunu hazırladı, Mahdia ve Yukarı Mısır'ın komutasını üstlendi ve 1943-1947 yılları arasında Kalem Bakanı olarak görev yaptı. Bağımsızlıktan sonra Antikalar Dairesi'nin başına geçti ve beş müze kurdu. Kitapları arasında \"Tunus Tarihinin Özeti\" (1918) ve \"Bir Hayatın Kitabı\" yer alır; bu eserler ona Tunus Tarihi Baronu unvanını kazandırdı ve el yazması kütüphanesini Ulusal Kütüphaneye bağışladı."
  id: "Seorang sejarawan, ahli bahasa, dan administrator Tunisia (1884–1968), lahir dan meninggal di Tunis. Ia belajar di Sekolah Sadiqiya dan Sekolah Ilmu Politik di Paris, belajar sejarah di Chaldunia, memimpin kas arsip Tunisia, menyusun katalog pertama isinya, memimpin Mahdia dan Mesir Hulu, serta menjabat sebagai Menteri Pena antara tahun 1943 dan 1947. Setelah kemerdekaan, ia memimpin Departemen Antik dan mendirikan lima museum. Di antara bukunya adalah \"Ringkasan Sejarah Tunisia\" (1918) dan \"Buku Kehidupan,\" yang memberinya gelar Baron Sejarah Tunisia dan menyumbangkan perpustakaan manuskripnya ke Perpustakaan Nasional."
