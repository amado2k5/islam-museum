summary:
  ar: "مؤرخ ولغوي وإداري تونسي (1884–1968)، وُلد وتوفي بتونس العاصمة. تعلّم بالمدرسة الصادقية وبمدرسة العلوم السياسية بباريس، ودرّس التاريخ بالخلدونية، وترأّس خزينة المحفوظات التونسية فوضع أول فهرس لمحتوياتها، وتولى القيادة على المهدية والوطن القبلي، وصار وزير القلم بين 1943 و1947، وبعد الاستقلال ترأّس مصلحة الآثار فأسّس خمسة متاحف. من كتبه «خلاصة تاريخ تونس» (1918) و«كتاب العمر»، ولُقّب ببارون التاريخ التونسي، وأهدى مكتبته المخطوطة إلى المكتبة الوطنية."
  en: "Tunisian historian, linguist and administrator (1884–1968), born and deceased at Tunis. Trained at Sadiki College and at the Paris School of Political Sciences, he taught history at the Khaldounia, headed the Tunisian national archives and made their first catalogue, governed at Mahdia and in the Cap Bon, served as Minister of the Pen from 1943 to 1947, and after independence directed the antiquities service, founding five museums. His works, from the Résumé de l'histoire de Tunisie (1918) to Kitab al-'Umr, earned him the name of 'baron of Tunisian history', and he bequeathed his rich manuscript library to the National Library of Tunisia."
  ur: "تونسی مورخ، ماہرِ لسانیات اور منتظم (1884–1968)، جو تونس شہر میں پیدا ہوئے اور وہیں انتقال ہوا۔ صادقی کالج اور پیرس کے سکول آف پولیٹیکل سائنسز سے تعلیم پائی، خلدونیہ میں تاریخ پڑھائی، قومی محفوظات کے سربراہ بن کر ان کی پہلی فہرست مرتب کی، مہدیہ اور الوطن القبلی کے گورنر رہے، 1943ء سے 1947ء تک وزیرِ قلم رہے، اور آزادی کے بعد محکمۂ آثارِ قدیمہ کی سربراہی میں پانچ عجائب گھر قائم کیے۔ ان کی تصانیف، «خلاصہ تاریخِ تونس» (1918ء) سے «کتاب العمر» تک، نے انہیں تونسی تاریخ کا بیرن کہلوایا، اور انہوں نے اپنا مخطوطات کا ذخیرہ قومی کتب خانے کو عطیہ کیا۔"
