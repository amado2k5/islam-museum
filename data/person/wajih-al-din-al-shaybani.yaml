summary:
  ar: "الحافظ وجيه الدين عبد الرحمن بن علي الديبع الشيباني الزبيدي الشافعي؛ قال في آخر كتابه بغية المستفيد بأخبار زبيد: كان مولدي بمدينة زبيد المحروسة يوم الخميس الرابع من المحرم سنة خمس وستين وثمانمائة في منزل والدي، وغاب والدي عن زبيد في آخر السنة التي ولدت فيها ولم تره عيني قط، ونشأت في حجر جدي لأمي العلامة الصالح العارف شرف الدين أني المعروف إسماعيل بن محمد بن مبارز. وقال في النور: هو الإمام الحافظ الحجة المتقن شيخ الإسلام علامة الأنام الجهبذ الإمام مسند الدنيا أمير المؤمنين في الحديث خاتمة المحققين ملحق الأواخر بالأوائل؛ أخذ عمن لا يحصى وأخذ عنه الأكابر كالعلامة ابن زياد والحافظ الطاهر بن حسين الأهدل وأحمد بن علي المزجاجي، وانتهت إليه رياسة الرحلة في علم الحديث وقصده الطلبة من نواحي الأرض؛ ومن مصنفاته تيسير الوصول إلى جامع الأصول في مجلدين، مصباح المشكاة، شرح دعاء ابن أبي حربة، غاية المطلوب وأعظم المنة فيما يغفر الله به الذنوب ويوجب به الجنة، بغية المستفيد في أخبار مدينة زبيد، كتاب قرة العيون في أخبار اليمن الميمون، مولد شريف نبوي، كتاب المعراج؛ توفي ضحى يوم الجمعة السادس والعشرين من رجب {cite:shadharat-dhahab p. 671-672}."
  en: "Zabid's musnid — 'shaykh al-Islam, musnid of the world, amir al-mu'minin in hadith, seal of the verifiers who joins the last generation to the first'; b. Thursday 4 Muharram 865, raised by his maternal grandfather; teacher of Ibn Ziyad, al-Ahdal and al-Muzjaji; works include Taysir al-Wusul ila Jami' al-Usul, Baghyat al-Mustafid on Zabid's history and Qurrat al-'Uyun on Yemen's history; died Friday 26 Rajab [944] {cite:shadharat-dhahab p. 671-672}."
