summary:
  ar: "الحافظ وجيه الدين عبد الرحمن بن علي الديبع الشيباني الزبيدي الشافعي؛ قال في آخر كتابه بغية المستفيد بأخبار زبيد: كان مولدي بمدينة زبيد المحروسة يوم الخميس الرابع من المحرم سنة خمس وستين وثمانمائة في منزل والدي، وغاب والدي عن زبيد في آخر السنة التي ولدت فيها ولم تره عيني قط، ونشأت في حجر جدي لأمي العلامة الصالح العارف شرف الدين أني المعروف إسماعيل بن محمد بن مبارز. وقال في النور: هو الإمام الحافظ الحجة المتقن شيخ الإسلام علامة الأنام الجهبذ الإمام مسند الدنيا أمير المؤمنين في الحديث خاتمة المحققين ملحق الأواخر بالأوائل؛ أخذ عمن لا يحصى وأخذ عنه الأكابر كالعلامة ابن زياد والحافظ الطاهر بن حسين الأهدل وأحمد بن علي المزجاجي، وانتهت إليه رياسة الرحلة في علم الحديث وقصده الطلبة من نواحي الأرض؛ ومن مصنفاته تيسير الوصول إلى جامع الأصول في مجلدين، مصباح المشكاة، شرح دعاء ابن أبي حربة، غاية المطلوب وأعظم المنة فيما يغفر الله به الذنوب ويوجب به الجنة، بغية المستفيد في أخبار مدينة زبيد، كتاب قرة العيون في أخبار اليمن الميمون، مولد شريف نبوي، كتاب المعراج؛ توفي ضحى يوم الجمعة السادس والعشرين من رجب {cite:shadharat-dhahab p. 671-672}."
  en: "Zabid's musnid — 'shaykh al-Islam, musnid of the world, amir al-mu'minin in hadith, seal of the verifiers who joins the last generation to the first'; b. Thursday 4 Muharram 865, raised by his maternal grandfather; teacher of Ibn Ziyad, al-Ahdal and al-Muzjaji; works include Taysir al-Wusul ila Jami' al-Usul, Baghyat al-Mustafid on Zabid's history and Qurrat al-'Uyun on Yemen's history; died Friday 26 Rajab [944] {cite:shadharat-dhahab p. 671-672}."
  es: "Musnid de Zabid — 'shaykh al-Islam, musnid del mundo, amir al-mu'minin en hadiz, sello de los verificadores que une la última generación con la primera'; n. Jueves 4 de Muharram 865, criado por su abuelo materno; maestro de Ibn Ziyad, al-Ahdal y al-Muzjaji; sus obras incluyen Taysir al-Wusul ila Jami' al-Usul, Baghyat al-Mustafid sobre la historia de Zabid y Qurrat al-'Uyun sobre la historia de Yemen; murió el viernes 26 de Rajab [944] {cite:shadharat-dhahab p. 671-672}."
  fr: "Le musnid de Zabid — « cheikh de l'Islam, musnid du monde, amir des croyants en hadith, sceau des vérificateurs qui unit la dernière génération à la première »; né le jeudi 4 Muharram 865, élevé par son grand-père maternel; maître d'Ibn Ziyad, d'al-Ahdal et d'al-Muzjaji; parmi ses œuvres figurent Taysir al-Wusul ila Jami' al-Usul, Baghyat al-Mustafid sur l'histoire de Zabid et Qurrat al-'Uyun sur l'histoire du Yémen; décédé le vendredi 26 Rajab [944] {cite: shadharat-dhahab p. 671-672}."
  ur: "زبید کا مسنید - 'شیخ الاسلام، دنیا کے مسنید، حدیث میں امیر المومنین، تصدیق کرنے والوں کی مہر جو آخری نسل سے پہلی نسل میں شامل ہیں'؛ ب جمعرات 4 محرم 865، اپنے نانا کی پرورش؛ ابن زیاد، الاحدال اور المزجی کے استاد؛ تصانیف میں تیسیر الوصول الا جامع الصلوۃ، زبید کی تاریخ پر بغیث المصطفید اور یمن کی تاریخ پر قرات العیون شامل ہیں۔ وفات جمعہ 26 رجب [944]۔ 671-672}۔"
  tr: "Hafızeci Vecieddin Abdülrahman ibn Ali el-Diba' el-Şeybani el-Zubeydi el-Şafii, kitabının sonunda şöyle demiştir: 865 Hicri yılında, Muharrem'in dördüncü günü Perşembe günü koruma altındaki Zabîd şehrinde babamın evinde doğdum. Babam, doğduğum yılın sonunda Zabid'de yoktu ve bunu kendi gözlerimle hiç görmedim. Büyükbabamın kucağında, doğru alim ve mistik Şeraf Din'in, yani İsmail ibn Muhammed bin Mübarez olarak bilinen, kucağında büyüdüm. Al-Nur'da şöyle dedi: O İmam, ezberleyici, kesin delil, İslam'ın şeyhi, insanlığın seçkin âlimi, imam, dünyanın öncüsü, hadislerde müminlerin komutanı, son doğrulayıcı, sonrakilere ek; İbn Ziyad, ezberci el-Tahir bin Hüseyin el-Ahdal ve Ahmed bin Ali el-Muzcaci gibi sayısız alim ve büyük alimden ders aldı. Hadis biliminde yolculuğa öncülük etti ve dünyanın dört bir yanından öğrencilere rehberlik etti. Eserleri arasında iki ciltlik 'Tayshar al-Yusu' el-Usul, 'Misbah al-Mişkat' yer alır: 'Şerh ibn Abi Harbah', 'Tanrı'nın günahları affettiği ve Müstüf'e cennet bahşettiği en büyük lütuf ve en büyük lütuf ile birlikte', 'Zabid Şehri Haberlerinden Faydalanma Amacı', 'Peygamberin Doğum Kitabı', Yükseliş Kitabı; Recep 26 Cuma sabahı vefat etti {atıf:Shadharat-dhahab, s. 671-672}."
  id: "Pengapal Wajih al-Din Abd al-Rahman ibn Ali al-Diba' al-Shaybani al-Zubaidi al-Shafi'i berkata di akhir bukunya Bughiyat al-Mustafid bi Akhbar Zubayd: Saya lahir di kota terlindung Zabid pada hari Kamis, tanggal 4 Muharram, tahun 865 H, di rumah ayah saya. Ayah saya tidak ada di Zabid pada akhir tahun saya lahir, dan saya tidak pernah melihatnya dengan mata kepala sendiri. Saya tumbuh di pangkuan kakek saya di pangkuan ibu saya, ulama dan mistikus yang benar Sharaf al-Din, yang dikenal sebagai Ismail ibn Muhammad ibn Mubarez. Ia berkata dalam Al-Noor: Ia adalah Imam, pengapal, bukti yang tepat, Sheikh Islam, ulama terkemuka umat manusia, Imam, predikat dunia, Komandan Orang Beriman dalam hadis, verifik terakhir, lampiran untuk yang kemudian; ia belajar dari banyak ulama dan ulama besar seperti ulama Ibn Ziyad, penghafal al-Tahir ibn Husayn al-Ahdal, dan Ahmad ibn Ali al-Muzjaji. Ia memimpin perjalanan dalam ilmu hadits dan membimbing para murid dari di seluruh dunia. Di antara karya-karyanya adalah 'Tayshar al-Yusu' al-Usul dalam dua jilid, 'Misbah al-Mishkat,' 'Sharh Ibn Abi Harbah', 'Yang Paling Tertutup dan Anugerah Terbesar dalam Apa yang Tuhan Ampuni dan Anugerahkan Surga Mustaf' bersamaan dengan karyanya, 'Tujuan Mendapat Manfaat dalam Berita Kota Zabid,' 'Kitab Kelahiran Nabi,' Kitab Kenaikan; Ia wafat pada pagi hari Jumat, tanggal 26 Rajab {cite::' Shadharat-Dhahab, hlm. 671-672}."
