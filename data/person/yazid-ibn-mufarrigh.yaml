died: { edtf: "0689", hijri: "0069", calendar: julian, precision: year, status: tradition, derived: true, note: "مات يزيد بن مفرغ سنة تسع وستين {cite:wafayat-ayan}." }
summary:
  ar: "أبو عثمان يزيد بن زياد بن ربيعة بن مفرغ الحميري؛ الشاعر الجاهلي الإسلامي الهجّاء الذي اشتهر بهجائه آل الزبير بعد قتلهم أخاه، ومن صحب عباد بن زياد بن أبيه إلى خراسان حين استعمله؛ وجد أباه مفرغاً حداداً باليمن؛ وجده مفرغ لقب سمي به لأنه راهن على سقاء من لبن يشرب به كله فشربه حتى فرغه؛ ومات سنة تسع وستين {cite:wafayat-ayan}."
  en: "Yazid b. Mufarrigh al-Himyari (d. 69) — the satirist who destroyed the Zubayrid house for killing his brother and rode with Ubadah b. Ziyad to Khurasan {cite:wafayat-ayan}."
  es: "Yazid b. Mufarrigh al-Himyari (m. 69) — el satírico que destruyó la casa Zubayrid por matar a su hermano y cabalgó con Ubadah b. Ziyad a Jorasán {cite:wafayat-ayan}."
  fr: "Yazid b. Mufarrigh al-Himyari (d. 69) — le satiriste qui détruisit la maison Zubayrid pour avoir tué son frère et chevaucha avec Ubadah b. Ziyad jusqu'au Khorasan {cite:wafayat-ayan}."
  ur: "یزید بی۔ مفرح الحمیری ⁦(متوفی 69)⁩ - وہ طنز کرنے والا جس نے اپنے بھائی کو قتل کرنے پر زبیرید کے گھر کو تباہ کیا اور عبادہ بن کے ساتھ سوار ہوا۔ زیاد تا خراسان۔"
  tr: "Ebu Osman Yezid ibn Ziyad ibn Rabi'ah ibn Mufargh al-Himyari; kardeşini öldürdükten sonra el-Zubeyr ailesi tarafından hicvettiği İslam öncesi şair ve hiciv türü. Babası Abbad bin Ziyad ibn'in Horasan'a gittiği zamanlarda onun yoldaşlarından biriydi; babası Mufragh'ı Yemen'de demirci olarak buldu; ona Mufagh lakabını buldu; ona verilen lakabı buldu; çünkü içecek tüm sütü olan bir sütü bir sucunun olduğuna bahse girdiği için onu bitirene kadar içti; altmış dokuzuncu yılda öldü {atıf:wafayat-ayan}."
  id: "Abu Uthman Yazid ibn Ziyad ibn Rabi'ah ibn Mufargh al-Himyari; penyair pra-Islam dan satir yang terkenal karena satir oleh keluarga al-Zubayr setelah membunuh saudaranya. Ia adalah salah satu sahabat Abbad ibn Ziyad ibn ayahnya ke Khurasan ketika ia mempekerjakannya; ayahnya menemukan Mufragh sebagai pandai besi di Yaman; ia menemukan Mufagh, julukan yang diberikan kepadanya karena ia bertaruh pada seorang tukang air dengan semua susu untuk diminum, sehingga ia meminumnya sampai habis; ia meninggal pada tahun enam puluh sembilan {cite:wafayat-ayan}."
