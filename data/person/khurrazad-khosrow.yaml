  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك خرّزا خسروا» {cite:tabari-tarikh-abu-al-fadl j.2 p.233}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Perslerinin bir kralı, el-Tabari'nin \"Kaybettikleri bir boncuk kralının anılışı\" başlığıyla anılmıştır {cite:tabari-tarikh-abu-al-fadl J.2 s.233}. Bu yerde, saltanatı yaşı ve haberleri hakkında söylenenler anlatılır."
  id: "Seorang raja Persia Sasanian, disebut oleh al-Tabari dengan judul \"Sebutan raja manik-manik yang hilang\" {cite:tabari-tarikh-abu-al-fadl J.2 hlm.233}. Di tempat ini, apa yang dikatakan tentang usia pemerintahannya dan kabarnya diceritakan."
