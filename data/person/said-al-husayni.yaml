summary:
  ar: "سياسي فلسطيني من القدس (1878–1945)، تولّى رئاسة بلدية القدس سنة 1905، ومثّلها نائبًا في مجلس المبعوثان العثماني، ثم صار في آذار 1920 أول وزير خارجية في الحكومة العربية بدمشق في عهد الملك فيصل الأول."
  en: "Palestinian politician from Jerusalem (1878–1945). He became mayor of Jerusalem in 1905, sat for the city in the Ottoman parliament, and in March 1920 became the first foreign minister of the Arab government at Damascus under King Faysal I."
  ur: "قدس سے تعلق رکھنے والے فلسطینی سیاست دان (1878–1945)۔ وہ 1905ء میں قدس کے میئر بنے، عثمانی پارلیمنٹ میں شہر کی نمائندگی کی، اور مارچ 1920ء میں شاہ فیصل اول کے دور میں دمشق کی عرب حکومت کے پہلے وزیرِ خارجہ بنے۔"
