summary:
  ar: "سياسي فلسطيني من القدس (1878–1945)، تولّى رئاسة بلدية القدس سنة 1905، ومثّلها نائبًا في مجلس المبعوثان العثماني، ثم صار في آذار 1920 أول وزير خارجية في الحكومة العربية بدمشق في عهد الملك فيصل الأول."
  en: "Palestinian politician from Jerusalem (1878–1945). He became mayor of Jerusalem in 1905, sat for the city in the Ottoman parliament, and in March 1920 became the first foreign minister of the Arab government at Damascus under King Faysal I."
  ur: "قدس سے تعلق رکھنے والے فلسطینی سیاست دان (1878–1945)۔ وہ 1905ء میں قدس کے میئر بنے، عثمانی پارلیمنٹ میں شہر کی نمائندگی کی، اور مارچ 1920ء میں شاہ فیصل اول کے دور میں دمشق کی عرب حکومت کے پہلے وزیرِ خارجہ بنے۔"
  es: "Político palestino de Jerusalén (1878-1945). Fue alcalde de Jerusalén en 1905, representó a la ciudad en el parlamento otomano y, en marzo de 1920, se convirtió en el primer ministro de Asuntos Exteriores del gobierno árabe en Damasco, bajo el reinado del rey Faysal I."
  fr: "Homme politique palestinien de Jérusalem (1878-1945). Il devint maire de Jérusalem en 1905, siégea pour la ville au parlement ottoman et, en mars 1920, devint le premier ministre des Affaires étrangères du gouvernement arabe à Damas sous le roi Fayçal Ier."
  tr: "Kudüs'ten Filistinli bir politikacı olan Sculs, 1905'te Kudüs belediye başkanı olarak görev yaptı, Osmanlı elçiler konseyinde milletvekili olarak temsil etti ve ardından Mart 1920'de Kral Faysal I döneminde Şam'daki Arap hükümetinin ilk dışişleri bakanı oldu."
  id: "Seorang politikus Palestina dari Yerusalem (1878–1945), ia menjabat sebagai walikota Yerusalem pada tahun 1905, mewakilinya sebagai deputi di dewan utusan Ottoman, dan kemudian pada Maret 1920 menjadi menteri luar negeri pertama dalam pemerintahan Arab di Damaskus selama masa pemerintahan Raja Faisal I."
