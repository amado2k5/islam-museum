summary:
  ar: "مغنّي ريغي من كوت ديفوار، اسمه الأصلي سيدو كوني، وُلد في ديمبوكرو في 1 يناير 1953. حقّق انطلاقته بألبوم «جاه غلوري» (1982)، وسجّل «القدس» (1986) مع فرقة «ذا ويلرز»، ويغنّي بالديولا والفرنسية والإنجليزية وأحيانًا بالعربية والعبرية، ويدعو في أغانيه إلى الوحدة بين الأديان، وعُيّن سفيرًا للسلام للأمم المتحدة في بلاده."
  en: "Ivorian reggae singer, born Seydou Koné at Dimbokro on 1 January 1953. He broke through with the album Jah Glory (1982), recorded Jerusalem (1986) with the Wailers, sings in Dyula, French and English — occasionally also in Arabic and Hebrew — and has used his songs to call for unity between religions; he was appointed a United Nations Ambassador of Peace for Côte d'Ivoire."
  ur: "آئیوری کوسٹ کے ریگے گلوکار، اصل نام سیدو کونے، جو 1 جنوری 1953 کو دیمبوکرو میں پیدا ہوئے۔ انہیں البم «جاہ گلوری» (1982) سے شہرت ملی، انہوں نے «یروشلم» (1986) دی ویلرز کے ساتھ ریکارڈ کیا، وہ دیولا، فرانسیسی اور انگریزی میں گاتے ہیں اور اپنے گیتوں میں مذاہب کے درمیان اتحاد کی دعوت دیتے ہیں؛ انہیں اپنے ملک کے لیے اقوامِ متحدہ کا سفیرِ امن مقرر کیا گیا۔"
