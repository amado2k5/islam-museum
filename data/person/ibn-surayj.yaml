label: { ar: "ابن سريج المغني", en: "Ibn Surayj" }
summary:
  ar: "من مغني أيام الوليد بن يزيد وهو أول من حمل المغنين من البلدان إليه مع معبد والغريض وابن عائشة وابن محرز وطويس ودحمان، وإليه نسب الغناء الذي أطرب به الوليد على حسب ما في كتب الأغاني {cite:muruj-al-dhahab p. 201-203}. وعند ابن الجوزي انتهت إليه رياسة أصحاب الشافعي وشرح المذهب ونخصه وعمل المسائل في الفروع، وقال رأيت في المنام كأنها مطرنا كبريتًا أحمر فملأت أكمامي وجيبي وحجري فعُبّر لي أني أرزق علمًا عنيزًا كعزّ الكبريت الأحمر، وقال في علته التي مات فيها: رُئيت البارحة في النوم كأن قائلًا يقول لي هذا ربك تعالى يخاطبك فسمعت بماذا أجبتم المرسلين قالوا فوقع في قلبي بالإيمان والتصديق فقيل لي أما إني قد غفرت لكم؛ توفي في جمادى الأولى عن سبع وخمسين سنة وستة أشهر ودفن بحجرة سويقة غالب {cite:muntazam-ibn-al-jawzi p. 149-150}."
  en: "One of the singers al-Walid first imported to court — the song that enraptured him is ascribed to Ibn Surayj or Malik in the song-books' dispute {cite:muruj-al-dhahab p. 201-203}."
