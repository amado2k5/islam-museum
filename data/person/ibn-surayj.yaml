label: { ar: "ابن سريج المغني", en: "Ibn Surayj", es: "Ibn Surayj", fr: "Ibn Surayj", ur: "ابن سریج" }
summary:
  ar: "من مغني أيام الوليد بن يزيد وهو أول من حمل المغنين من البلدان إليه مع معبد والغريض وابن عائشة وابن محرز وطويس ودحمان، وإليه نسب الغناء الذي أطرب به الوليد على حسب ما في كتب الأغاني {cite:muruj-al-dhahab p. 201-203}. وعند ابن الجوزي انتهت إليه رياسة أصحاب الشافعي وشرح المذهب ونخصه وعمل المسائل في الفروع، وقال رأيت في المنام كأنها مطرنا كبريتًا أحمر فملأت أكمامي وجيبي وحجري فعُبّر لي أني أرزق علمًا عنيزًا كعزّ الكبريت الأحمر، وقال في علته التي مات فيها: رُئيت البارحة في النوم كأن قائلًا يقول لي هذا ربك تعالى يخاطبك فسمعت بماذا أجبتم المرسلين قالوا فوقع في قلبي بالإيمان والتصديق فقيل لي أما إني قد غفرت لكم؛ توفي في جمادى الأولى عن سبع وخمسين سنة وستة أشهر ودفن بحجرة سويقة غالب {cite:muntazam-ibn-al-jawzi p. 149-150}."
  en: "One of the singers al-Walid first imported to court — the song that enraptured him is ascribed to Ibn Surayj or Malik in the song-books' dispute {cite:muruj-al-dhahab p. 201-203}."
  es: "Uno de los cantantes que al-Walid importó por primera vez a la corte —la canción que lo cautivó se atribuye a Ibn Surayj o Malik en la disputa sobre los cancioneros {cite:muruj-al-dhahab p. 201-203}."
  fr: "L'un des chanteurs qu'al-Walid a fait venir à la cour en premier - la chanson qui l'a ravi est attribuée à Ibn Surayj ou Malik dans la dispute des livres de chansons {cite:muruj-al-dhahab p. 201-203}."
  ur: "الولید کے گلوکاروں میں سے ایک سب سے پہلے عدالت میں درآمد کیا گیا تھا - جس گانے نے اسے مسحور کیا تھا وہ گانوں کی کتابوں کے تنازعہ میں ابن سریج یا مالک سے منسوب کیا گیا ہے {حوالہ: مروج الذہاب صفحہ۔ 201-203}۔"
  tr: "El-Velid bin Yezid döneminde şarkıcıydı ve Ma'bad, Al-Gharid, İbn Aisha, İbn Muhraz, Tavis ve Dahman ile birlikte diğer topraklardan şarkıcıları kendisine getiren ilk kişiydi. Al-Walid'in sevdiği şarkılar, şarkı kitaplarında bulunanlara göre ona atfedilir {atıf:muruj-al-dhahab, s. 201-203}. İbn al-Jawzi'ye göre, Şafii âlimlerinin liderliğini elde etti, okulu ve uzmanlıklarını açıkladı ve şubelerde meseleler üzerinde çalıştı. Dedi ki: Rüyamda sanki kollarımı, cebimi ve taşımı dolduran kırmızı kükürt yağıyormuş gibi gördüm. Bana kırmızı kükürt kadar değerli bir bilgi verildiğini açıkladı. Öldüğü hastalığından bahsetti: Dün gece rüyamda biri bana 'Bu Yüce Rab'bin, sana hitap ediyor.' Ne cevap verdiğini duydum. Onlar da 'Ve bu kalbime iman ve inançla yerleşti.' dediler. Bana, 'Seni affettim mi?' denildi. Cumada-el-Avval'da elli yedi yaş altı aylıkken öldü ve Galip'in Suveyka odasına defnedildi {atıf: Muntazam-ibn-al-Jawzi, s. 149-150}."
  id: "Ia adalah seorang penyanyi pada masa Al-Walid ibn Yazid dan merupakan orang pertama yang membawa penyanyi dari negeri lain kepadanya bersama Ma'bad, Al-Gharid, Ibn Aisha, Ibn Muhraz, Tawis, dan Dahman. Nyanyian yang disukai Al-Walid dikaitkan dengannya menurut apa yang ditemukan dalam buku lagu {cite:muruj-al-dhahab, hlm. 201-203}. Menurut Ibn al-Jawzi, ia mencapai kepemimpinan para ulama Syafi Syafi'i, menjelaskan aliran dan spesialisasinya, serta mengerjakan masalah di cabang-cabang. Ia berkata: Saya melihat dalam mimpi seolah-olah hujan belerang merah, memenuhi lengan baju, saku, dan batu saya. Ia menjelaskan kepada saya bahwa saya diberikan pengetahuan yang berharga seperti belerang merah. Ia berkata tentang penyakitnya yang menyebabkan kematiannya: Tadi malam saya melihat dalam mimpi seolah-olah seseorang berkata kepada saya, 'Inilah Tuhanmu, yang Maha Agung, berbicara kepada-Mu.' Saya mendengar apa yang Anda jawab kepada para utusan. Mereka berkata, 'Dan itu menetap di hati saya dengan iman dan keyakinan.' Dikatakan kepada saya, 'Apakah saya telah memaafkanmu?' Ia meninggal di Jumada al-Awwal pada usia lima puluh tujuh tahun enam bulan dan dimakamkan di kamar Suwayqa Ghalib {cite:muntazam-ibn-al-jawzi, hlm. 149-150}."
