summary:
  ar: "فضل وحيد (1858–1937)، عالم ومربٍّ پشتوني من تورنغزي بقضاء چارسده. تلميذ آخوندزاده نجم الدين صاحب هده وخليفته، درس في دار العلوم ديوبند ورافق الشيخ محمود حسن في الحج سنة 1890، وقاتل البريطانيين في ثورة 1897، ثم انصرف إلى التعليم فأسّس مع عبد الغفار خان نحو 120 مدرسة، فلاحقه البريطانيون سنة 1915 ففرّ إلى أراضي مهمند وقاد المقاومة منها حتى وفاته."
  en: "Fazal Wahid (1858–1937), Pashtun scholar and education campaigner of Turangzai in Charsadda district. A disciple and deputy of Najm al-Din Akhundzada, the Mulla of Hadda, he studied at Darul Uloom Deoband, accompanied Sheikh Mahmud Hasan on the Hajj in 1890, fought the British in the 1897 revolt, then turned to education and, with Khan Abdul Ghaffar Khan, helped found some 120 schools; driven out by a British warrant in 1915, he directed resistance from Mohmand territory until his death."
  ur: "فضل وحید (1858ء–1937ء)، ضلع چارسدہ کے قصبے تورنگزئی کے پشتون عالم اور تعلیمی رہنما۔ وہ آخوندزادہ نجم الدین صاحبِ ہدہ کے شاگرد اور خلیفہ تھے، دارالعلوم دیوبند میں پڑھے، 1890ء میں شیخ محمود حسن کے ساتھ حج کیا، 1897ء کی بغاوت میں انگریزوں سے لڑے، پھر تعلیم کی طرف متوجہ ہوئے اور عبد الغفار خان کے ساتھ مل کر تقریباً 120 اسکول قائم کیے؛ 1915ء میں برطانوی وارنٹ کے بعد مہمند کے علاقے میں پناہ لی اور وہیں سے مزاحمت جاری رکھی۔"
