    basis: documented
    note: "Two independent texts attest a personal Sufi discipleship, not merely a title or office. Edwards, from the oral histories of the disciples' descendants, prints the Mulla of Hadda's network chart with 'Haji Sahib of Turangzai — Disciple of the Mulla of Hadda', calls him one of the Mulla's principal deputies, and preserves the Haji's own narrated account of recognising Hadda Sahib and becoming his disciple. The Tribal Analysis Center report, drawing on Sana Haroon's Frontier of Faith, independently states that Najmuddin's disciple Haji Turangzai inherited his teacher's blend of the four orders' teaching — a personal teaching succession. No single named order is attested for him personally, so the generic value sufi is recorded, exactly as for his teacher (wave 116). His studies at Darul Uloom Deoband and his attachment to Mahmud Hasan, given by the English article, are formation and are not counted, and no source names a legal school for him."
