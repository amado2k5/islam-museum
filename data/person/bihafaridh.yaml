id: person/bihafaridh
class: person
label: { ar: "بهافريذ", en: "Bihafaridh" }
summary:
  ar: "بهافريذ رجل من قرية يقال لها روى من أبرشهر مجوسي ظهر في صدر الدولة العباسية قبل ظهور أبي العباس، يصلي الصلوات الخمس بلا سجود متياسرا عن القبلة وتكهن ودعا المجوس إلى مذهبه فاستجاب له خلق كثير، فوجه إليه أبو مسلم شبيب بن داح وعبد الله بن سعيد فعرضا عليه الإسلام فأسلم وسود ثم لم يقبل إسلامه لتكهنه فقتل، وعلى مذهبه بخراسان جماعة إلى وقت ابن النديم {cite:fihrist-ibn-al-nadim p. 482-483}."
  en: "The Zoroastrian reformer who prayed without prostration — killed despite accepting Islam {cite:fihrist-ibn-al-nadim}"
