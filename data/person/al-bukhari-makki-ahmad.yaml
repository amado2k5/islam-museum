summary:
  ar: "شهاب الدين أحمد البخاري الأصل المكي الحنفي؛ ولد بمكة في صفر سنة ثلاث وثمانين وثمانمائة واشتغل بالعلم فقرأ على السخاوي في سنن أبي داود والشفا، ودخل القاهرة مراراً وسمع الحديث فيها على جماعة منهم الحافظ الديمي والجلال السيوطي، ولبس خرقة التصوف من بعض المشايخ وولي المناصب الجلية كالقضاء والإمامة والمشيخة، وأجازه بعضهم وقرأ الكتب الستة وغيرها وسمع كثيراً من الفقه والحديث مع قوة حافظة وحسن خطابة وناطقة؛ توفي بجدة ظهر يوم السبت عاشر ربيع الثاني وحُمل إلى مكة فدُفن بالمعلاة {cite:shadharat-dhahab p. 689}."
  en: "The Bukharan-born Meccan — b. Safar 803; he read Abu Dawud and the Shifa' on al-Sakhawi, heard al-Dimyati and al-Suyuti in Cairo, wore the khirqa, held qadi, imama and mashyakha posts; died at Jeddah Saturday 10 Rabi' II [948], carried to Mecca and buried at Ma'la {cite:shadharat-dhahab p. 689}."
  fr: "Mecquois d’origine boukhariote — né à La Mecque en safar 883 H ; il lut Abu Dawud et le Shifa’ auprès d’al-Sakhawi, entendit al-Daymi et al-Suyuti au Caire, revêtit la khirqa, exerça les charges de cadi, d’imam et de cheikh ; mort à Djeddah le samedi 10 rabi’ II [948 H], transporté à La Mecque et enterré à Ma’la {cite:shadharat-dhahab p. 689}."
  es: "El mecano nacido en Bujará - n. Safar 803; leyó a Abu Dawud y al Shifa' en al-Sakhawi, escuchó a al-Dimyati y al-Suyuti en El Cairo, usó la khirqa, ocupó los cargos de qadi, imama y mashyakha; murió en Jeddah el sábado 10 Rabi' II [948], llevado a La Meca y enterrado en Ma'la {cita:shadharat-dhahab p. 689}."
  ur: "بخاران میں پیدا ہونے والا مکہ - بی۔ صفر 803; اس نے الصخاوی پر ابوداؤد اور شفاء پڑھی، قاہرہ میں الدیمیاتی اور السیوطی کو سنا، خرقہ پہنا، قاضی، امامت اور مشائخ کے عہدوں پر فائز ہوئے۔ ہفتہ 10 ربیع الثانی [948] جدہ میں انتقال ہوا، مکہ لے جایا گیا اور مولا میں دفن کیا گیا۔ 689}۔"
  tr: "Mekke asıllı Şihab el-Din Ahmed el-Buhari, Hanefi âlimidir; Hicri 883 yılının Safer ayında Mekke'de doğmuştur. İlimlerle meşgul olmuş ve Sünen Ebu Davud ve Şifa üzerine el-Sakhawi ile çalışmıştır. Kahire'ye birkaç kez gitmiş ve orada aralarında el-Hafız el-Dimi ve el-Celale el-Suyuti'nin de bulunduğu bir grup insandan hadis öğrenmiştir. Bazı şeyhlerden tasavvuf cübbesi giymiş ve kadılık, imamlık ve şeyhlik gibi önemli görevlerde bulunmuştur. Bazıları ona ders verme izni vermiştir. Altı Kitabı ve diğerlerini okumuş, fıkıh ve hadis konusunda çok şey öğrenmiş, güçlü bir hafızaya ve güzel bir hitabet yeteneğine sahipti. Rebiü'l-Sani ayının onuncu günü Cumartesi öğleden sonra Cidde'de vefat etmiş, Mekke'ye götürülerek Mualla'ya defnedilmiştir. {Kaynak: Şadharat-dhahab s. 689}"
  id: "Shihab al-Din Ahmad al-Bukhari, berasal dari Mekah, seorang ulama Hanafi; beliau lahir di Mekah pada bulan Safar tahun 883 Hijriah. Beliau mendalami ilmu dan belajar dengan al-Sakhawi tentang Sunan Abi Dawud dan al-Shifa. Beliau beberapa kali memasuki Kairo dan mendengar hadits di sana dari sekelompok orang, termasuk al-Hafiz al-Dimi dan al-Jalal al-Suyuti. Beliau mengenakan jubah Sufi dari beberapa syekh dan memegang posisi penting seperti hakim, imam, dan kesyekhan. Beberapa dari mereka memberinya izin untuk mengajar. Beliau membaca enam kitab dan kitab-kitab lainnya serta banyak mendengar tentang fiqih dan hadits, dengan daya ingat yang kuat dan kemampuan berpidato serta berbicara yang baik. Beliau wafat di Jeddah pada Sabtu sore, tanggal sepuluh Rabi' al-Thani, dan dibawa ke Mekah dan dimakamkan di al-Mu'alla. {cite:shadharat-dhahab p. 689}"
