summary:
  ar: "سويد بن عبد الله التميمي؛ أوفده سليمان بن علي إلى المنصور في وفد أهل البصرة ومعهم صورة البطيحة يخبرونه أنهم يتخوفون أن يملح ماؤهم إذا استخرجت السبيطية."
  en: "Suwayd ibn Abdallah al-Tamimi; first of the Basran delegation Sulayman sent al-Mansur with the batiha's picture, warning the water would bracken were al-Subaytiyya cut."
  es: "Suwayd ibn Abdallah al-Tamimi; primero de la delegación de Basran que Sulayman envió a al-Mansur con la imagen de la batiha, advirtiendo que el agua se asentaría si se cortaba al-Subaytiyya."
  fr: "Suwayd ibn Abdallah al-Tamimi; premier de la délégation de Basran, Sulayman envoya al-Mansur avec la photo de la batiha, avertissant que l'eau serait fougueuse si al-Subaytiyya était coupée."
  ur: "سوید بن عبداللہ التمیمی؛ بصران کے وفد میں سے سب سے پہلے سلیمان نے بیتحہ کی تصویر کے ساتھ المنصور کو بھیجا اور خبردار کیا کہ اگر السبیطیہ کو کاٹ دیا گیا تو پانی ٹوٹ جائے گا۔"
  tr: "Suweyd bin Abdullah Al-Tamimi; Süleyman bin Ali, onu Basra halkından bir heyetle birlikte El-Mənsur'a gönderdi, yanında El-Beytiha'nın resmini taşıyarak, Subeyiyye çıkarılırsa sularının tuzlu olmasından korktuklarını söyledi."
  id: "Suwayd bin Abdullah Al-Tamimi; Sulayman bin Ali mengirimnya ke Al-Mansur bersama delegasi rakyat Basra, membawa gambar Al-Batiha, mengatakan bahwa mereka khawatir air mereka akan menjadi asin jika Subaitiyya diekstrak."
