label: { ar: "چترمن ⁦(مصور مغولي)⁩", en: "Chitarman (Mughal painter)", ur: "چترمن ⁦(مغل مصور)⁩", es: "Chitarman (Mughal painter)", fr: "Chitarman (Mughal painter)" }
summary:
  ar: "مصور مغولي في عهد شاه جهان، من أعماله صورة دارا شكوه المؤرخة 1049هـ/1639–1640م وصورته في ألبوم منتو نحو 1645م، وامتد عمله إلى عهد أورنكزيب {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 111}."
  en: "Mughal painter under Shah Jahan, whose works include the portrait of Dara Shikoh dated 1049 AH/1639–40 and another in the Minto Album of about 1645; his career extended into Aurangzeb's reign {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 111}."
  ur: "شاہ جہان کے دور کے مغل مصور، جن کے کاموں میں 1049ھ/1639–40ء کی دارا شکوہ کی شبیہ اور منٹو البم میں تقریباً 1645ء کی ایک اور شبیہ ہے؛ ان کا کام اورنگزیب کے دور تک چلا {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 111}۔"
  es: "Pintor mogol durante el reinado de Shah Jahan, cuyas obras incluyen el retrato de Dara Shikoh fechado en 1049 AH/1639–40 y otro en el Álbum Minto de alrededor de 1645; su carrera se extendió hasta el reinado de Aurangzeb {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 111}."
  fr: "Peintre moghol sous Shah Jahan, dont les œuvres comprennent le portrait de Dara Shikoh daté de 1049 AH/1639–40 et un autre dans l'Album Minto d'environ 1645; sa carrière s'est étendue jusqu'au règne d'Aurangzeb {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 111}."
  tr: "Şah Cahan döneminde bir Babür ressamı olan Şah Cihan döneminde eserleri arasında 1049 Hicri / 1639–1640 yıllarına tarihlenen Dara Shikuh'un portresi ve yaklaşık 1645 M.S. Manto albümündeki resmi bulunmaktadır. Eserleri Aurangzeb'in saltanatına kadar uzanmıştır {cite:beach-grand-mogul-1978 s. 25} {cite:beach-grand-mogul-1978 s. 111}"
  id: "Sebagai pelukis Mughal pada masa pemerintahan Shah Jahan, di antara karyanya adalah potret Dara Shikuh bertanggal 1049 H / 1639–1640 M dan gambarnya dalam album Manto sekitar 1645 M. Karyanya meluas hingga masa pemerintahan Aurangzeb {cite:beach-grand-mogul-1978 hlm. 25} {cite:beach-grand-mogul-1978 hlm. 111}."
