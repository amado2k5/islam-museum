summary:
  ar: "أبو عمر محمد بن عبد الواحد بن أبي هاشم الزاهد، غلام ثعلب، المعروف بالمطرز؛ صحب أبا العباس ثعلباً زماناً فعُرف به ونُسب إليه وأكثر من الأخذ عنه؛ استدرك على كتابه «الفصيح» جزءاً سماه «فائت الفصيح» وشرحه أيضاً، وله كتب كثيرة منها البواقت والجرجاني والموضح والساعات ويوم وليلة والمستحسن والعشرات والشورى وتفسير أسماء الشعراء والقبائل والمكنون والمكتوم؛ كان ينقل غريب اللغة وحوشيها وقيل إنه أملى من حفظه ثلاثين ألف ورقة من اللغة فلهذا الإكثار نُسب إلى الكذب، وأما رواية الحديث فإن الناس يصدقونه ويوثقونه؛ كان اشتغاله بالعلوم قد منعه اكتساب الرزق فلم يزل مضيقاً عليه {cite:wafayat-ayan}."
  en: "Abu Umar al-Mutarriz (161–345) — Tha'lab's companion and the most prolific transmitter of gharib al-lugha; author of Fa'it al-Fasih and dozens of lexical works; reputed to have dictated 30,000 folios of language from memory, which earned him both fame and suspicion {cite:wafayat-ayan}."
  fr: "Abou Umar al-Mutarriz (161–345), compagnon de Tha‘lab et le plus prolifique des transmetteurs du lexique rare (gharib al-lugha)  ; auteur de Fa'it al-Fasih et des dizaines d'œuvres lexicales ; réputé pour avoir dicté 30 000 folios de langage de mémoire, ce qui lui a valu à la fois la renommée et la suspicion {cite:wafayat-ayan}."
  es: "Abu Umar al-Mutarriz (161–345) — Compañero de Tha'lab y el transmisor más prolífico de gharib al-lugha; autor de Fa'it al-Fasih y docenas de obras léxicas; se dice que dictó 30.000 folios de lengua de memoria, lo que le valió fama y sospechas {cite:wafayat-ayan}."
  ur: "ابو عمر المطرز (161-345) - ثعلب کے ساتھی اور غریب اللوثہ کا سب سے زیادہ فروغ دینے والا؛ فیض الفصیح اور درجنوں لغوی کام کے مصنف؛ یادداشت سے زبان کے 30,000 فولیو مرتب کرنے کے لیے مشہور ہے، جس کی وجہ سے اسے شہرت اور شک دونوں ملے۔"
  tr: "Ebu Ömer Muhammed bin Abdülvahid ibn Ebi Haşim el-Zahid, Thalab'ın kölesi ve nakışçı olarak bilinir, uzun süre Ebu el-Abbas Thalab ile birlikte oldu, ona atfedildi ve ondan geniş bir ders aldı. \"Al-Fasih\" adlı kitabını \"Fa'at al-Fasih\" adlı bir bölümle tamamladı ve bunu açıkladı. El-Bavekat, El-Jurcani, El-Muwadda, El-Sâat, Gün gibi birçok kitap yazdı. ve Gece, El-Mustashan, El-Adarat, El-Şura ve Tafsir Esma'l-Şu'ara, el-Maqnun ve El-Mektum. Garip diller ve detaylar aktardı ve ezberlediği otuz bin sayfayı dikte ettiği söylenir. Bu bolluk yalan söylemeye bağlandı. Hadis rivayet etmeye gelince, insanlar buna inanır ve doğrular; bilimlere olan ilgisi geçimini sağlamasını engellediği için bu onun için bir yük olarak kaldı {alıntı: Wafayat-ayan}."
  id: "Abu Umar Muhammad ibn Abd al-Wahid ibn Abi Hashim al-Zahid, seorang budak Thalab, yang dikenal sebagai pensulam, telah menemani Abu al-Abbas Thalab untuk waktu yang lama, dikenal olehnya, dikaitkan dengannya, dan belajar banyak darinya. Ia melengkapi bukunya \"Al-Fasih\" dengan bagian berjudul \"Fa'at al-Fasih\" dan juga menjelaskannya. Ia menulis banyak buku termasuk Al-Bawaqat, Al-Jurjani, Al-Muwaddah, Al-Sa'atat, Siang dan Malam, Al-Mustashan, Al-Adarat, Al-Shura, dan Tafsir Asma' al-Shu'ara', al-Maqnoon, dan Al-Maktum. Ia menyampaikan bahasa-bahasa aneh dan rinciannya, dan dikatakan bahwa ia mendiktekan tiga puluh ribu halaman dari hafalannya. Kelimpahan ini dikaitkan dengan kebohongan. Adapun bercerita hadis, orang-orang percaya dan mengotentikasinya; obsesiasinya pada ilmu pengetahuan menghalanginya mencari nafkah, sehingga hal itu tetap menjadi beban baginya {cite:Wafayat-Ayan}."
