summary:
  ar: "أبو عمر محمد بن عبد الواحد بن أبي هاشم الزاهد، غلام ثعلب، المعروف بالمطرز؛ صحب أبا العباس ثعلباً زماناً فعُرف به ونُسب إليه وأكثر من الأخذ عنه؛ استدرك على كتابه «الفصيح» جزءاً سماه «فائت الفصيح» وشرحه أيضاً، وله كتب كثيرة منها البواقت والجرجاني والموضح والساعات ويوم وليلة والمستحسن والعشرات والشورى وتفسير أسماء الشعراء والقبائل والمكنون والمكتوم؛ كان ينقل غريب اللغة وحوشيها وقيل إنه أملى من حفظه ثلاثين ألف ورقة من اللغة فلهذا الإكثار نُسب إلى الكذب، وأما رواية الحديث فإن الناس يصدقونه ويوثقونه؛ كان اشتغاله بالعلوم قد منعه اكتساب الرزق فلم يزل مضيقاً عليه {cite:wafayat-ayan}."
  en: "Abu Umar al-Mutarriz (161–345) — Tha'lab's companion and the most prolific transmitter of gharib al-lugha; author of Fa'it al-Fasih and dozens of lexical works; reputed to have dictated 30,000 folios of language from memory, which earned him both fame and suspicion {cite:wafayat-ayan}."
