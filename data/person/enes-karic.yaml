summary:
  ar: أنس كاريتش ⁦(1958–)⁩ أستاذ بوسني في الدراسات القرآنية بجامعة سراييفو، ووزير سابق للتعليم والثقافة ⁦(1994–1996)⁩ أثناء حصار سراييفو، ومن أشهر كتّاب البوسنة في القرآن وتاريخ الفكر الإسلامي.
  en: Enes Karic (born 1958) is a Bosnian scholar, professor of Qur'anic studies at the University of Sarajevo and former Minister of Education, Science, Culture and Sports (1994–1996) during the siege
    of Sarajevo, widely published on the Qur'an and Islamic intellectual history.
  ur: انس کاریچ ⁦(1958–)⁩ بوسنیائی محقق اور سرائیوو یونیورسٹی میں مطالعاتِ قرآن کے پروفیسر ہیں اور محاصرے کے زمانے میں ⁦(1994–1996)⁩ وزیرِ تعلیم، سائنس، ثقافت و کھیل رہے؛ قرآن اور اسلامی فکری تاریخ پر ان
    کی تصانیف وسیع ہیں۔
  es: "Enes Karic (nacido en 1958) es un erudito bosnio, profesor de estudios coránicos en la Universidad de Sarajevo y exministro de Educación, Ciencia, Cultura y Deportes (1994-1996) durante el asedio de Sarajevo. Ha publicado numerosos trabajos sobre el Corán y la historia intelectual islámica."
  fr: "Enes Karic (né en 1958) est un érudit bosnien, professeur d'études coraniques à l'Université de Sarajevo et ancien ministre de l'Éducation, des Sciences, de la Culture et des Sports (1994-1996) pendant le siège de Sarajevo, largement publié sur le Coran et l'histoire intellectuelle islamique."
  tr: "Anas Karic (1958–), Saraybosna Üniversitesi'nde Kur'an çalışmaları profesörü, Saraybosna kuşatması sırasında eski Eğitim ve Kültür Bakanı (1994–1996) ve Bosna'nın Kur'an ve İslam düşüncesi tarihi üzerine en ünlü yazarlarından biriydi."
  id: "Anas Karic (1958–) adalah profesor studi Al-Qur'an Bosnia di Universitas Sarajevo, dan mantan Menteri Pendidikan dan Kebudayaan (1994–1996) selama pengepungan Sarajevo, serta salah satu penulis paling terkenal di Bosnia tentang Al-Qur'an dan sejarah pemikiran Islam."
