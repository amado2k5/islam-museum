id: person/ibn-al-akhdar
class: person
label: { ar: "ابن الأخضر الجنابذي" }
summary:
  ar: "أبو محمد عبد العزيز بن محمود بن المبارك الجنابذي نسبة إلى جنابذ قرية بنيسابور، الحنبلي ثم البغدادي؛ مسند العراق وحافظها في وقته؛ ولد يوم الخميس ثامن عشر رجب سنة أربع وعشرين وخمسمائة ببغداد وأول سماعه سنة ثلاث وخمسمائة؛ لازم أبا الحسن بن بكروس وابن ناصر، وقال ابن النجار لم يكن في أقرانه أكثر سماعاً منه ولا أحسن أصولاً وحدث نحو ستين سنة؛ من تصانيفه «المقصد الأرشد في ذكر من روى عن أحمد» في مجلدين و«تنبيه اللبيب وتلقيح فهم المريب في تحقيق أوهام الخطيب» و«تلخيص وصف الأسماء»؛ روى عنه ابن الجوزي وابن الدبيثي وابن نقطة وابن النجار والضياء المقدسي والبرزالي وابن خليل؛ توفي ليلة السبت بين العشاءين سادس شوال سنة إحدى عشرة وستمائة ودفن بمقبرة باب حرب {cite:shadharat-dhahab p. 46-47}."
