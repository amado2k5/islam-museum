id: person/ibn-al-akhdar
class: person
label: { ar: "ابن الأخضر الجنابذي" }
summary:
  ar: "أبو محمد عبد العزيز بن محمود بن المبارك الجنابذي نسبة إلى جنابذ قرية بنيسابور، الحنبلي ثم البغدادي؛ مسند العراق وحافظها في وقته؛ ولد يوم الخميس ثامن عشر رجب سنة أربع وعشرين وخمسمائة ببغداد وأول سماعه سنة ثلاث وخمسمائة؛ لازم أبا الحسن بن بكروس وابن ناصر، وقال ابن النجار لم يكن في أقرانه أكثر سماعاً منه ولا أحسن أصولاً وحدث نحو ستين سنة؛ من تصانيفه «المقصد الأرشد في ذكر من روى عن أحمد» في مجلدين و«تنبيه اللبيب وتلقيح فهم المريب في تحقيق أوهام الخطيب» و«تلخيص وصف الأسماء»؛ روى عنه ابن الجوزي وابن الدبيثي وابن نقطة وابن النجار والضياء المقدسي والبرزالي وابن خليل؛ توفي ليلة السبت بين العشاءين سادس شوال سنة إحدى عشرة وستمائة ودفن بمقبرة باب حرب {cite:shadharat-dhahab p. 46-47}."
  tr: "Ebu Muhammed Abdulaziz bin Mahmud bin Mahmud bin El-Mübarek El-Cenabdi, Nişapur köyünün liderlerinden adını almış, Hanbali ve o zamanın El-Bağdadi; Irak'ın Musnadı ve onun zamanının ezbercisi; 524 Hicri yılında, on sekizinci Recep ayının Perşembe günü Bağdat'ta doğmuş, ilk iştahı 503 Hicri yılında olmuştur; Ebu Hasan bin Bakrus ve İbn Nasir'in takipçisiydi. İbn El-Necer, akranları arasında kendisinden daha çok duyulmuş ve en iyi ilkelere sahip olmadığını söylemiştir; yaklaşık altmış yıl boyunca anlatmıştır; eserleri arasında \"Ahmed'den Zikr Eden Zımker Rava\" adlı iki ciltlik \"El-Maqsad El-Arshad fi Zikr Man Rawa'\" ve \" \"Tanbih al-Labib wa Taqih Fahm al-Mureeb fi Tahqiq Awham al-Khatib\" ve \"İsimlerin Tanımının Özeti\"; İbn al-Jawzi, İbn al-Dubaythi, İbn Nuqta, İbn al-Najjar, el-Diya el-Makdisi, el-Barzali ve İbn Halil tarafından anlatıldı; Cumartesi gecesi, Şevval'in altıncı namazı arasında, altı yüz on bir hicri tarihinde vefat etti ve Bab Harb mezarlığına defnedildi {atıf:shadharat-dhahab, s. 46-47}."
  id: "Abu Muhammad Abdul Aziz bin Mahmoud bin Al-Mubarak Al-Janabdhi, dinamai menurut para pemimpin desa Nishapur, Hanbali yang kemudian Al-Baghdadi; Musnad Irak dan pengapalnya pada zamannya; lahir pada hari Kamis, tanggal 18 Rajab, tahun 524 H, di Baghdad, dan pendengarannya pertama kali terjadi pada tahun 503 H; ia adalah pengikut Abu Al-Hasan bin Bakrous dan Ibn Nasir. Ibn Al-Najjar mengatakan bahwa di antara rekan-rekannya, ia tidak lebih didengar maupun memiliki prinsip terbaik darinya, dan ia bercerita selama sekitar enam puluh tahun; di antara karyanya adalah \"Al-Maqsad Al-Arshad fi Dhikr Man Rawa' dari Ahmad\" dalam dua jilid dan \" \"Tanbih al-Labib wa Taqih Fahm al-Mureeb fi Tahqiq Awham al-Khatib\" dan \"Ringkasan Deskripsi Nama\"; diceritakan darinya oleh Ibn al-Jawzi, Ibn al-Dubaythi, Ibn Nuqta, Ibn al-Najjar, al-Diya al-Maqdisi, al-Barzali, dan Ibn Khalil; ia meninggal pada malam Sabtu di antara dua shalat Iha, shalat keenam Shawwal, enam ratus sebelas H, dan dimakamkan di pemakaman Bab Harb {cite:shadharat-dhahab, hlm. 46-47}."
