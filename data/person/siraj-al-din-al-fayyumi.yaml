summary:
  ar: "نزيل حلب؛ ولي بها قضاء العسكر ثم عزل ثم ولي تدريس الظاهرية ثم نوزع في نصفها، وكان يقرئ في محراب الجامع الكبير ويذكر الميعاد بعد صلاة الصبح في محراب الحنابلة، ماهراً في علم الفرائض مشاركاً في غيرها وله نظم ونثر؛ ولما طعن لما قدم عليه بنظم ونثر فأجازه؛ ثم خرج من حلب طالباً القاهرة فلما وصل خان غباغب أصبح مقتولاً وذهب دمه هدراً — كما قتل قبله بعام ابنه عمر قاضي العسكر في الموضع نفسه {cite:shadharat-dhahab p. 25, 17}."
  en: "Aleppo's faradi teacher — murdered at Khan Ghabaghib on the road to Cairo, exactly where his son the army-qadi had been killed the year before {cite:shadharat-dhahab p. 25, 17}."
