summary:
  ar: "نزيل حلب؛ ولي بها قضاء العسكر ثم عزل ثم ولي تدريس الظاهرية ثم نوزع في نصفها، وكان يقرئ في محراب الجامع الكبير ويذكر الميعاد بعد صلاة الصبح في محراب الحنابلة، ماهراً في علم الفرائض مشاركاً في غيرها وله نظم ونثر؛ ولما طعن لما قدم عليه بنظم ونثر فأجازه؛ ثم خرج من حلب طالباً القاهرة فلما وصل خان غباغب أصبح مقتولاً وذهب دمه هدراً — كما قتل قبله بعام ابنه عمر قاضي العسكر في الموضع نفسه {cite:shadharat-dhahab p. 25, 17}."
  en: "Aleppo's faradi teacher — murdered at Khan Ghabaghib on the road to Cairo, exactly where his son the army-qadi had been killed the year before {cite:shadharat-dhahab p. 25, 17}."
  es: "El maestro faradi de Alepo fue asesinado en Khan Ghabaghib, en el camino a El Cairo, exactamente donde su hijo, el cadí del ejército, había sido asesinado el año anterior {cite:shadharat-dhahab p. 25, 17}."
  fr: "Le professeur faradi d'Alep — assassiné à Khan Ghabaghib sur la route du Caire, exactement là où son fils, le cadi de l'armée, avait été tué l'année précédente {cite:shadharat-dhahab p. 25, 17}."
  ur: "حلب کے فریادی استاد کو قاہرہ جانے والی سڑک پر خان غبغیب کے مقام پر قتل کیا گیا، جہاں اس کا بیٹا فوجی قادی ایک سال پہلے مارا گیا تھا۔ 25، 17}۔"
  tr: "Halep'te ikamet etti; orada askeri yargıç olarak atandı, sonra görevden alındı, ardından Zahiriye'yi öğretmeye başladı ve ardından namazı ikiye böldü. Büyük Camii'nin mihrabında okunur ve şafak namazından sonraki belirlenen zamanı Hanbali namazında belirtirdi. Miras hukuku biliminde yetkindi, başka alanlarda da yer aldı, yazdı ve düzyazılar yazdı. Şiir ve düzyazı sunduğu için eleştirildiğinde izin verdi. Sonra Halep'ten Kahire'yi aramak için ayrıldı ve Han Ghabaghab geldiğinde öldürüldü, kanı boşuna döküldü—tıpkı oğlu Ömer'in, askeri hakimin, bir yıl önce aynı yerde öldürülmesi gibi {atıf:shadharat-dhahab, s. 25, 17}."
  id: "Ia tinggal di Aleppo; ia diangkat sebagai hakim militer di sana, lalu diberhentikan, kemudian mengajar Zahiriya, lalu membagikannya menjadi dua. Ia biasa membaca dalam mihrab Masjid Agung dan menyebutkan waktu yang ditentukan setelah shalat fajar dalam shalat Hanbali. Ia mahir dalam ilmu hukum warisan dan berpartisipasi dalam bidang lain, serta menulis dan prosa. Ketika ia dikritik atas apa yang ia sampaikan melalui puisi dan prosa, ia memberikan izin. Kemudian ia meninggalkan Aleppo mencari Kairo, dan ketika Khan Ghabaghab tiba, ia dibunuh dan darahnya tertumpah sia-sia—sama seperti putranya Umar, hakim militer, dibunuh setahun sebelumnya di tempat yang sama {cite:shadharat-dhahab, hlm. 25, 17}."
