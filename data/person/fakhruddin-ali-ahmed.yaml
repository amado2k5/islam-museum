summary:
  ar: "محامٍ وسياسي هندي (1905–1977)، وزير مالية آسام سنة 1939 ثم من 1957 إلى 1966، ومحاميها العام منذ 1946، ووزير في الحكومة المركزية منذ 1966. وبوصفه خامس رؤساء الهند (1974–1977) أعلن «حالة الطوارئ» في يونيو 1975 بنصيحة رئيسة الوزراء؛ وتوفي في المنصب بأزمة قلبية في 11 فبراير 1977، وهو ثاني مسلم يتولى الرئاسة."
  en: "Indian lawyer and politician (1905–1977), finance minister of Assam in 1939 and again from 1957 to 1966, the province's advocate general from 1946, and a Union cabinet minister from 1966. As fifth president of India (1974–1977) he proclaimed the Emergency of June 1975 on the prime minister's advice; he died in office of a heart attack on 11 February 1977, the second Muslim to hold the presidency."
  ur: "ہندوستانی وکیل اور سیاست دان (1905ء–1977ء)، 1939ء میں اور پھر 1957ء سے 1966ء تک آسام کے وزیرِ خزانہ، 1946ء سے صوبے کے ایڈووکیٹ جنرل، اور 1966ء سے مرکزی کابینہ کے وزیر۔ ہندوستان کے پانچویں صدر (1974ء–1977ء) کی حیثیت سے انھوں نے جون 1975ء میں وزیرِ اعظم کے مشورے پر ایمرجنسی نافذ کی؛ 11 فروری 1977ء کو دل کے دورے سے عہدے میں وفات پائی، وہ صدارت سنبھالنے والے دوسرے مسلمان تھے۔"
