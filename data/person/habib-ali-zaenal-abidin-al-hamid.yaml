    en: "Habib Ali Zaenal Abidin Al-Hamid is an Indonesian-born preacher active in Malaysia; he studied in Hadhramaut, Yemen, guides the Darul Murtadza majlis, and his Instagram counted 1,432,708 followers in November 2026."
    ur: "حبیب علی زین العابدین الحامد انڈونیشی نژاد مبلغ ہیں جو ملائیشیا میں سرگرم ہیں؛ انہوں نے یمن کے حضرموت میں تعلیم پائی، دار المرتضیٰ مجلس کی رہنمائی کرتے ہیں، اور نومبر 2026ء میں ان کے انسٹاگرام فالوور 1,432,708 تھے۔"
