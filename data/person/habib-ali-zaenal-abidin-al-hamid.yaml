summary:
  ar: "داعية مستقل من بوندووسو في جاوة الشرقية بإندونيسيا، سافر إلى حضرموت في اليمن فدرس أصول الدين والشريعة والتصوف، واشتهر في ماليزيا بمجالس دار المرتضى وببرنامجه الأسبوعي في مسجد معاذ بن جبل وبرنامج ليلة حب الرسول في تاواو بصباح. يرأس مؤسسة الرياح ويرشد دار المرتضى، وبلغ حسابه في إنستغرام 1,432,708 متابعين وصفحته في فيسبوك 224,308 متابعين بحسب قراءة المنصتين في 15 نوفمبر 2026."
  en: "Freelance preacher from Bondowoso, East Java, Indonesia, who travelled to Hadhramaut in Yemen and studied usuluddin, sharia and tasawwuf, and became well known in Malaysia through the Darul Murtadza majlis, his weekly programme at Masjid Mu'az bin Jabal and the Malam Cinta Rasul programme in Tawau, Sabah. He chairs Yayasan Ar-Riayah and guides Darul Murtadza; his Instagram counted 1,432,708 followers and his Facebook page 224,308 followers when the platforms were read on 15 November 2026."
  ur: "انڈونیشیا کے مشرقی جاوا کے بوندووسو سے تعلق رکھنے والے آزاد مبلغ، جنہوں نے یمن کے حضرموت جا کر اصول الدین، شریعت اور تصوف کی تعلیم حاصل کی، اور ملائیشیا میں دار المرتضیٰ مجلس، مسجد معاذ بن جبل میں اپنے ہفتہ وار پروگرام اور صباح کے تاواؤ میں ”ملام چنتا رسول“ پروگرام سے شہرت پائی۔ وہ یایاسن الریاح کے صدر اور دار المرتضیٰ کے رہنما ہیں؛ 15 نومبر 2026ء کی قرأت کے مطابق ان کے انسٹاگرام فالوور 1,432,708 اور فیس بک صفحے کے فالوور 224,308 تھے۔"
  es: "Predicador independiente de Bondowoso, Java Oriental, Indonesia, que viajó a Hadhramaut en Yemen y estudió usuluddin, sharia y tasawwuf, y se hizo muy conocido en Malasia a través del Darul Murtadza majlis, su programa semanal en Masjid Mu'az bin Jabal y el programa Malam Cinta Rasul en Tawau, Sabah. Preside Yayasan Ar-Riayah y guía a Darul Murtadza; su Instagram contaba con 1.432.708 seguidores y su página de Facebook con 224.308 seguidores cuando se leyeron las plataformas el 15 de noviembre de 2026."
  fr: "Prédicateur indépendant de Bondowoso, Java oriental, Indonésie, qui s'est rendu à Hadhramaout au Yémen et a étudié l'usuluddin, la charia et le tasawwuf, et s'est fait connaître en Malaisie grâce au majlis Darul Murtadza, son programme hebdomadaire à Masjid Mu'az bin Jabal et le programme Malam Cinta Rasul à Tawau, Sabah. Il préside Yayasan Ar-Riayah et guide Darul Murtadza; son Instagram comptait 1 432 708 abonnés et sa page Facebook 224 308 abonnés lors de la lecture des plateformes le 15 novembre 2026."
  tr: "Endonezya'nın Doğu Cava bölgesindeki Bondusu'dan bağımsız bir vaiz olan Da, din, Şeriat ve Tasavvufun temellerini incelemek için Yemen'deki Hadramaut'a gitti. Malezya'da Dar Al-Murtada'daki toplantıları, Muadh bin Jabal Camii'ndeki haftalık programı ve sabahları Tawao'daki \"Peygamberin Aşk Gecesi\" programıyla ün kazandı. Al-Riah Vakfı'nın başında ve Dar Al-Murtada'ya rehberlik etmektedir. Her iki platformun 15 Kasım 2026 tarihli okumalarına göre Instagram hesabında 1.432.708 takipçisi ve Facebook sayfası 224.308 takipçisi bulunuyor."
  id: "Sebagai penceramah independen dari Bondusu di Jawa Timur, Indonesia, ia melakukan perjalanan ke Hadramaut di Yaman untuk mempelajari dasar-dasar agama, Syariah, dan Sufisme. Ia menjadi terkenal di Malaysia karena pertemuannya di Dar Al-Murtada, program mingguan di Masjid Muadh bin Jabal, dan program \"Malam Cinta Nabi\" di Tawao pada pagi hari. Ia memimpin Yayasan Al-Riah dan membimbing Dar Al-Murtada. Akun Instagram-nya memiliki 1.432.708 pengikut dan halaman Facebook-nya 224.308 pengikut menurut pembacaan kedua platform pada 15 November 2026."
