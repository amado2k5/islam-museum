id: person/yahya-ibn-zakrawayh
class: person
label: { ar: "يحيى بن زكرويه القرمطي" }
summary:
  ar: "خرج بالشام في أيام المكتفي فاستمر القتال بينه وبين عسكر الخليفة إلى أن قتل في سنة تسعين فقام عوضه أخوه الحسين وأظهر شامة في وجهه زعم أنها آيته وجاءه ابن عمه عيسى بن مهرويه زعم أن لقبه المدثر وأنه المعني في السورة ولقب غلاماً له المطوق بالنور وظهر على الشام وعاث وأفسد وتسمى أمير المؤمنين المهدي ودعي له على المنابر ثم قتل الثلاثة في سنة إحدى وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 582}. وعند ابن الجوزي ظهر أخوه الحسين — صاحب الشامة — بعده فأُسر سنة إحدى وتسعين وأُعدم على دكة بالمصلى العتيق، ثم ظهر أخ آخر بالدالية سنة ثلاث وتسعين فدعا وحارب فدخل طبرية فقتل ونهبها وانصرف إلى البادية {cite:muntazam-ibn-al-jawzi p. 335-336, 348-349}."
  en: "The Qarmatian who rose in Syria under al-Muktafi, killed in 290; his brother al-Husayn — the mole on his face claimed as his 'sign' — and cousin Isa ibn Muhrih 'al-Muddaththir' followed, styling himself amir al-mu'minin al-Mahdi, all three slain in 291 {cite:tarikh-khulafa-minhaj-1434 p. 582}."
