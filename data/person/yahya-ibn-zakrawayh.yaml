id: person/yahya-ibn-zakrawayh
class: person
label: { ar: "يحيى بن زكرويه القرمطي" }
summary:
  ar: "خرج بالشام في أيام المكتفي فاستمر القتال بينه وبين عسكر الخليفة إلى أن قتل في سنة تسعين فقام عوضه أخوه الحسين وأظهر شامة في وجهه زعم أنها آيته وجاءه ابن عمه عيسى بن مهرويه زعم أن لقبه المدثر وأنه المعني في السورة ولقب غلاماً له المطوق بالنور وظهر على الشام وعاث وأفسد وتسمى أمير المؤمنين المهدي ودعي له على المنابر ثم قتل الثلاثة في سنة إحدى وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 582}. وعند ابن الجوزي ظهر أخوه الحسين — صاحب الشامة — بعده فأُسر سنة إحدى وتسعين وأُعدم على دكة بالمصلى العتيق، ثم ظهر أخ آخر بالدالية سنة ثلاث وتسعين فدعا وحارب فدخل طبرية فقتل ونهبها وانصرف إلى البادية {cite:muntazam-ibn-al-jawzi p. 335-336, 348-349}."
  en: "The Qarmatian who rose in Syria under al-Muktafi, killed in 290; his brother al-Husayn — the mole on his face claimed as his 'sign' — and cousin Isa ibn Muhrih 'al-Muddaththir' followed, styling himself amir al-mu'minin al-Mahdi, all three slain in 291 {cite:tarikh-khulafa-minhaj-1434 p. 582}."
  es: "El cármata que se alzó en Siria bajo el mando de al-Muktafi, asesinado en 290; su hermano al-Husayn —el lunar en su rostro se consideraba su \"signo\"— y su primo Isa ibn Muhrih 'al-Muddaththir' le siguieron, autodenominándose amir al-mu'minin al-Mahdi, los tres asesinados en 291 {cite:tarikh-khulafa-minhaj-1434 p. 582}."
  fr: "Le Qarmate qui s'est soulevé en Syrie sous al-Muktafi, tué en 290; son frère al-Husayn — le grain de beauté sur son visage était considéré comme son « signe » — et son cousin Isa ibn Muhrih 'al-Muddaththir' ont suivi, se proclamant amir al-mu'minin al-Mahdi, tous trois tués en 291 {cite:tarikh-khulafa-minhaj-1434 p. 582}."
  ur: "قرمطین جو شام میں المکتفی کے ماتحت اٹھے، 290 میں مارے گئے۔ اس کے بھائی الحسین - اس کے چہرے پر تل کو اس کی 'نشان' کے طور پر دعوی کیا گیا - اور چچا زاد بھائی عیسیٰ ابن مہری 'المدثر' نے پیروی کرتے ہوئے اپنے آپ کو امیر المومنین المہدی کا اسٹائل کیا، تینوں نے 291 میں قتل کیا {حوالہ: تاریخ خلفاء منہاج صفحہ 134۔ 582}۔"
  tr: "El-Muktaf günlerinde Suriye'ye gitti ve doksan yılına kadar halifenin ordusu ile çatışmalar devam etti. Kardeşi Hüseyin onun yerine geçti ve yüzünde bir ben göstererek bunun kendi işareti olduğunu iddia etti. Kuzeni İsa bin Mahruvey ona geldi, unvanının el-Muddthir olduğunu ve suredede kendisinin adı geçtiğini söyledi. Bir çocuğu olarak adlandırıldı, ışıkla çevrili, el-Şam'da ortaya çıktı, yıkım yarattı ve onu yozlaştırdı. Kendisine Müminlerin Komutanı el-Mehdi denildi ve kürsüye çağrıldı. Sonra üçü doksan birinci yılda öldürüldü {atıf:Tarikh-khulafa-minhaj-1434, s. 582}. İbn el-Cewzi ile birlikte, kardeşi el-Hüseyin — Levant'ın hükümdarı — ondan sonra geldi, doksan birinci yılında yakalandı ve eski namaz salonunda bir bankta idam edildi. Sonra doksan üçüncü yılda başka bir kardeş Daliya'da ortaya çıktı, çağrıldı ve savaştı, Tiberya'ya girdi, öldürüldü, yağmalandı ve ardından çöle çekildi {atıf:Muntazam-ibn-al-Jawzi s. 335-336, 348-349}."
  id: "Ia pergi ke Suriah pada masa al-Muktaf, dan pertempuran terus berlanjut antara dirinya dan pasukan khalifah hingga ia tewas pada tahun sembilan puluh. Saudaranya Husayn menggantikannya dan menunjukkan tahi lalat di wajahnya, mengklaim itu adalah tandanya. Sepupunya Isa ibn Mahruwayh datang kepadanya, mengklaim bahwa gelarnya adalah al-Muddthir dan bahwa dialah yang disebutkan dalam surah. Ia disebut sebagai anak laki-lakinya, dikelilingi cahaya, muncul di al-Sham, menyebarkan kekacauan, dan merusaknya. Ia disebut Komandan Orang Beriman al-Mahdi, dan dipanggil ke mimbar. Kemudian ketiganya dibunuh pada tahun sembilan puluh satu {cite:Tarikh-khulafa-minhaj-1434, hlm. 582}. Bersama Ibn al-Jawzi, saudaranya al-Husayn — penguasa Levant — muncul setelahnya, ditangkap pada tahun sembilan puluh satu dan dieksekusi di bangku di ruang doa tua. Kemudian saudara lain muncul di Daliyah pada tahun sembilan puluh tiga, dipanggil dan bertempur, masuk ke Tiberias, dibunuh, dan dijarah, lalu mundur ke gurun {cite:muntazam-ibn-al-jawzi hlm. 335-336, 348-349}."
