summary:
  ar: ناشط فلسطيني أمريكي مسلم، وُلد سنة 1960؛ شارك سنة 1994 في تأسيس مجلس العلاقات الأمريكية الإسلامية ⁦(CAIR)⁩، كبرى منظمات الحقوق المدنية للمسلمين في الولايات المتحدة، ويشغل منصب مديره التنفيذي الوطني.
  en: Palestinian-American Muslim activist, born 1960; co-founder in 1994 of the Council on American-Islamic Relations (CAIR), the largest Muslim civil-rights organisation in the United States, serving
    as its National Executive Director.
  ur: فلسطینی نژاد امریکی مسلم کارکن، پیدائش 1960؛ 1994 میں کونسل آن امریکن-اسلامک ریلیشنز ⁦(CAIR)⁩ کے شریک بانی، جو امریکہ کی سب سے بڑی مسلم شہری حقوق کی تنظیم ہے، اور اس کے قومی ایگزیکٹو ڈائریکٹر ہیں۔
  es: "Activista musulmán palestino-estadounidense, nacido en 1960; cofundador en 1994 del Consejo de Relaciones Americano-Islámicas (CAIR), la mayor organización musulmana de derechos civiles en Estados Unidos, donde se desempeñó como Director Ejecutivo Nacional."
  fr: "Militante musulmane palestino-américaine, née en 1960; cofondatrice en 1994 du Conseil des relations américano-islamiques (CAIR), la plus grande organisation de défense des droits civiques des musulmans aux États-Unis, dont elle est la directrice exécutive nationale."
