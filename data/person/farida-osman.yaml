summary:
  ar: "سبّاحة مصرية، وُلدت في إنديانابولس بالولايات المتحدة سنة 1995 ونشأت في القاهرة. فازت بثلاث برونزيات في بطولات العالم في 50 متر فراشة (2017 و2019 و2024)، وهي حاملة الأرقام القياسية الأفريقية في الفراشة وتوصف بأنها أسرع سبّاحة في مصر وأفريقيا."
  en: "Egyptian swimmer, born in Indianapolis, United States, in 1995 and raised in Cairo. She won three World Championship bronze medals in the 50 m butterfly (2017, 2019 and 2024), holds the African butterfly records, and is described as the fastest female swimmer in Egypt and Africa."
