summary:
  ar: "الشاه الرابع من الأسرة القاجارية في إيران (حكم من 5 سبتمبر 1848 إلى 1 مايو 1896)، وثالث أطول ملوك إيران حكمًا. بدأ عهده بإصلاحات وزيره الأول أمير كبير ثم إعدامه سنة 1852، وشهد أول رحلات رسمية لملك فارسي إلى أوروبا (1873 و1878 و1889) واحتجاج التبغ (1890-92)، وانتهى باغتياله في مرقد الشاه عبد العظيم بالري."
  en: "Fourth shah of Qajar Iran (reigned 5 September 1848 – 1 May 1896), the third-longest-reigning monarch in Iranian history. His reign opened with the reforms of his first minister Amir Kabir and that minister's execution in 1852, saw the first formal European tours by a Persian monarch (1873, 1878 and 1889) and the Tobacco Protest of 1890-92, and ended with his assassination at the Shah Abdol-Azim Shrine in Ray."
  ur: "قاجاری ایران کے چوتھے شاہ (دورِ حکومت 5 ستمبر 1848 تا 1 مئی 1896) اور ایرانی تاریخ کے تیسرے طویل ترین حکمران۔ ان کا عہد ان کے پہلے وزیر امیر کبیر کی اصلاحات اور 1852 میں اسی وزیر کے قتل سے شروع ہوا، کسی فارسی بادشاہ کے پہلے باقاعدہ یورپی دوروں (1873، 1878، 1889) اور تمباکو احتجاج (1890-92) کا گواہ بنا، اور رے میں شاہ عبد العظیم کے مزار پر ان کے قتل پر ختم ہوا۔"
