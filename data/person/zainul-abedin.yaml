summary:
  ar: "رسام بنغلاديشي (1914–1976) لُقّب بـ«شيلباتشاريا» أي سيد الفن، ويُعد مؤسس الفن الحديث في بنغلاديش. وُلد في كيشورغانج، وذاعت شهرته سنة 1944 برسوم مجاعة البنغال سنة 1943 التي رسمها بحبر صنعه من الفحم المحروق على ورق رخيص، وأسس سنة 1948 معهد الفنون والحرف في جامعة دكا وكان أول مدير له، وتوفي في دكا سنة 1976."
  en: "Bangladeshi painter (1914–1976), titled Shilpacharya, 'Great Teacher of the Arts', and regarded as the founding father of Bangladeshi modern art. Born in Kishoreganj, he became well known in 1944 through his sketches of the 1943 Bengal famine, drawn with ink he made from burnt charcoal on cheap packing paper. In 1948 he helped establish the Institute of Arts and Crafts at the University of Dhaka and was its founding principal. He died in Dhaka in 1976."
  ur: "بنگلہ دیشی مصور (1914ء–1976ء) جنھیں «شلپاچاریہ» یعنی استادِ فن کا لقب ملا اور جو بنگلہ دیش کے جدید فن کے بانی سمجھے جاتے ہیں۔ کشور گنج میں پیدا ہوئے، 1944 میں 1943 کے بنگال قحط کی خاکہ نگاری سے مشہور ہوئے جو انھوں نے جلے کوئلے کی سیاہی سے سستے کاغذ پر بنائی تھی۔ 1948 میں جامعہ ڈھاکہ میں انسٹی ٹیوٹ آف آرٹس اینڈ کرافٹس کے قیام میں حصہ لیا اور اس کے پہلے پرنسپل بنے۔ 1976 میں ڈھاکہ میں وفات پائی۔"
