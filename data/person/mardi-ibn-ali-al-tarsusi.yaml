  ar: "صاحب رسالة في صناعة السلاح أُلّفت لصلاح الدين قبيل1199م؛ يخصّص فيها باباً للمناجيق، وكلها من نوع الجذب إلا واحداً يسميه «الفارسي» قد يكون ذا ثقل موازن، بحسب قراءة كاان ⁦(EI2, MANDJANIK)⁩ {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426}."
