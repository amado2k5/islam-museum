  es: "Autor de un tratado sobre armas compuesto para Saladino antes de 1199; una sección trata sobre trabuquetes, todos de tipo tracción excepto uno 'persa' que Cahen pensó que posiblemente podría ser una máquina de contrapeso (EI2, MANDJANIK) {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426}."
