summary:
  ar: "أمير معروف، كان يملك سبعمائة مملوك وتخاف دولته، وكان سيفاً منقطع النظير وشجاعاً فاتكاً؛ اتفقت شجرة الدر والملك المعز ومن معهما على سوء نياته فقالوا لا يقوى على إخراجه من مصر إلا بالحيلة، فدعاه المعز إلى قلعة الجبل فخلا به ومهله فرده متعفناً قد ظهرت على ملامحه آثار الشر ودس السم فما دقّ حتى مات؛ وقيل ملزوزاً برمح فأشهد على إيصال فريضته لعبدة بن عبد الرحمن السلمي قاضي مدينته، وعُدّ موته طليعة سقوط دولتهم وانتقاص ملكهم؛ له قصيدة في مدح النبي {cite:shadharat-dhahab p. 257-258}."
  en: "The Salihi amir who held seven hundred mamluks — 'a sword without peer'; Shajar al-Durr and al-Mu'izz Izz al-Din plotted him out of Egypt, lured him to the Citadel and poisoned him; in some tellings, speared — with him goes the couplet that their sultanate's fall began {cite:shadharat-dhahab p. 257-258}."
