died: { edtf: "1253~", hijri: "0651~", calendar: julian, precision: year, status: tradition, derived: true, note: "قُتل بالقلعة بعد أن استدعته شجرة الدر والمعز {cite:shadharat-dhahab p. 258}." }
summary:
  ar: "أمير معروف، كان يملك سبعمائة مملوك وتخاف دولته، وكان سيفاً منقطع النظير وشجاعاً فاتكاً؛ اتفقت شجرة الدر والملك المعز ومن معهما على سوء نياته فقالوا لا يقوى على إخراجه من مصر إلا بالحيلة، فدعاه المعز إلى قلعة الجبل فخلا به ومهله فرده متعفناً قد ظهرت على ملامحه آثار الشر ودس السم فما دقّ حتى مات؛ وقيل ملزوزاً برمح فأشهد على إيصال فريضته لعبدة بن عبد الرحمن السلمي قاضي مدينته، وعُدّ موته طليعة سقوط دولتهم وانتقاص ملكهم؛ له قصيدة في مدح النبي {cite:shadharat-dhahab p. 257-258}."
  en: "The Salihi amir who held seven hundred mamluks — 'a sword without peer'; Shajar al-Durr and al-Mu'izz Izz al-Din plotted him out of Egypt, lured him to the Citadel and poisoned him; in some tellings, speared — with him goes the couplet that their sultanate's fall began {cite:shadharat-dhahab p. 257-258}."
  es: "El emir Salihi que tenía setecientos mamelucos —'una espada sin igual'—; Shajar al-Durr y al-Mu'izz Izz al-Din conspiraron para expulsarlo de Egipto, lo atrajeron a la Ciudadela y lo envenenaron; en algunos relatos, lo lanzaron; con él se va el pareado que dice que comenzó la caída de su sultanato {cite:shadharat-dhahab p. 257-258}."
  fr: "L'émir salihi qui détenait sept cents mamelouks — « une épée sans égale »; Shajar al-Durr et al-Mu'izz Izz al-Din l'ont fait sortir d'Égypte, l'ont attiré à la Citadelle et l'ont empoisonné; dans certains récits, l'ont transpercé d'une lance — avec lui va le distique qui a marqué le début de la chute de leur sultanat {cite:shadharat-dhahab p. 257-258}."
  ur: "صالحی امیر جس کے پاس سات سو مملوک تھے - ایک تلوار بغیر پیر کے۔ شجر الدر اور المعز عز الدین نے اسے مصر سے نکالنے کی سازش کی، اسے قلعہ کی طرف راغب کیا اور اسے زہر دے دیا۔ کچھ بیانات میں، نیزہ دار - اس کے ساتھ یہ شعر جاتا ہے کہ ان کی سلطنت کا زوال شروع ہوا 257-258}۔"
  tr: "Tanınmış bir prens olan D'Durr, yedi yüz köleye sahipti ve devleti korkuyordu. Eşsiz bir kılıç ve vahşi bir savaşçıydı. Şacar al-Durr, Kral el-Muizz ve arkadaşları, kötü niyetlerini kabul ederek ancak kurnazlıkla Mısır'dan çıkarılabileceğini söylediler. Al-Muizz onu dağ kalesine çağırdı, ancak alındı ve geri çekildi, yüzünde kötülük ve zehir izleri vardı, ve ölene kadar vurdu. Bir mızrakla vurulduğu ve görevinin şehrinin hakimi Abda ibn Abd al-Rahman al-Sulami'ye teslim edildiğine tanıklık ettiği ve ölümünü devletlerinin çöküşü ve krallıklarının zayıflaması olarak gördüğünü ifade ettiği söylenir. Peygamber'i öven bir şiir yazdı {atıf: shadharat-dhahab, s. 257-258}."
  id: "Seorang pangeran terkenal, ia memiliki tujuh ratus budak dan negaranya ditakuti. Ia adalah pedang yang tiada tara dan pejuang yang gagah. Shajar al-Durr, Raja al-Mu'izz, dan para pengikutnya sepakat dengan niat buruknya, mengatakan bahwa ia hanya bisa diusir dari Mesir dengan kelicikan. Al-Mu'izz memanggilnya ke benteng gunung, tetapi ia ditangkap dan mundur, meninggalkannya dalam keadaan membusuk dengan tanda-tanda kejahatan dan racun di wajahnya, dan ia memukul hingga meninggal. Konon ia terkena tombak dan bersaksi bahwa tugasnya diserahkan kepada Abda ibn Abd al-Rahman al-Sulami, hakim kotanya, dan menganggap kematiannya sebagai fajar kejatuhan negara mereka dan melemahnya kerajaan mereka. Ia menulis puisi yang memuji Nabi {cite:shadharat-dhahab, hlm. 257-258}."
