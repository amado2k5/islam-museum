summary:
  ar: "قرمانجان داتقا (1811–1907)، وُلدت قرمانجان ماماتباي قيزى، حاكمة قرغيز الألاي من 1862 إلى 1876 بلقب «داتقا» الذي منحها إياه خانا بخارى وخوقند، والمعروفة بـ«ملكة الألاي» و«ملكة الجنوب»؛ أقنعت قومها سنة 1876 بقبول السيادة الروسية تفاديًا للدمار، وتوفيت في مادي سنة 1907."
  en: "Kurmanjan Datka (1811–1907), born Kurmanjan Mamatbay kyzy, was ruler of the Alai Kyrgyz from 1862 to 1876 with the title Datka, granted by the khans of Bukhara and Kokand, and is remembered as the Queen of Alai and the Queen of the South. In 1876 she persuaded her people to accept Russian overlordship rather than face destruction, and she died at Mady in 1907."
  ur: "قرمانجان داتقا (1811–1907)، اصل نام قرمانجان ماماتبائی قیزی، 1862 سے 1876 تک آلائی کرغیزوں کی حکمران رہیں؛ انہیں بخارا اور خوقند کے خانوں نے «داتقا» کا لقب دیا۔ 1876 میں انہوں نے اپنے لوگوں کو روسی بالادستی قبول کرنے پر آمادہ کیا اور 1907 میں مادی میں وفات پائی۔"
  es: "Kurmanjan Datka (1811-1907), nacida Kurmanjan Mamatbay kyzy, gobernó a los kirguises de Alai desde 1862 hasta 1876 con el título de Datka, otorgado por los kanes de Bujará y Kokand, y es recordada como la Reina de Alai y la Reina del Sur. En 1876 persuadió a su pueblo para que aceptara la soberanía rusa en lugar de enfrentarse a la destrucción, y murió en Mady en 1907."
  fr: "Kurmanjan Datka (1811-1907), née Kurmanjan Mamatbay kyzy, régna sur les Kirghizes d'Alaï de 1862 à 1876. Portant le titre de Datka, octroyé par les khans de Boukhara et de Kokand, elle est restée dans les mémoires comme la Reine d'Alaï et la Reine du Sud. En 1876, elle persuada son peuple d'accepter la suzeraineté russe plutôt que de subir l'anéantissement. Elle mourut à Mady en 1907."
  tr: "Qarmancan Datka (1811–1907), doğum adıyla Qarmanjan Mamatbay Kızi, 1862'den 1876'ya kadar Kırgız Alai'nin hükümdarıydı, Buhara ve Khokand Hanlıkları tarafından kendisine verilen \"Datqa\" unvanını aldı; \"Alay Kraliçesi\" ve \"Güney Kraliçesi\" olarak bilinir; 1876'da halkını yıkımdan kaçınmak için Rus egemenliğini kabul etmeye ikna etti ve 1907'de Madi'de öldü."
  id: "Qarmanjan Datka (1811–1907), lahir dengan nama Qarmanjan Mamatbay Qizi, penguasa Alai Kyrgyz dari tahun 1862 hingga 1876, dengan gelar \"Datqa\" yang diberikan kepadanya oleh Khanat Bukhara dan Khokand, yang dikenal sebagai \"Ratu Alay\" dan \"Ratu Selatan\"; ia meyakinkan rakyatnya pada tahun 1876 untuk menerima kedaulatan Rusia demi menghindari kehancuran, dan ia meninggal di Madi pada tahun 1907."
