summary:
  ar: "قرمانجان داتقا (1811–1907)، وُلدت قرمانجان ماماتباي قيزى، حاكمة قرغيز الألاي من 1862 إلى 1876 بلقب «داتقا» الذي منحها إياه خانا بخارى وخوقند، والمعروفة بـ«ملكة الألاي» و«ملكة الجنوب»؛ أقنعت قومها سنة 1876 بقبول السيادة الروسية تفاديًا للدمار، وتوفيت في مادي سنة 1907."
  en: "Kurmanjan Datka (1811–1907), born Kurmanjan Mamatbay kyzy, was ruler of the Alai Kyrgyz from 1862 to 1876 with the title Datka, granted by the khans of Bukhara and Kokand, and is remembered as the Queen of Alai and the Queen of the South. In 1876 she persuaded her people to accept Russian overlordship rather than face destruction, and she died at Mady in 1907."
  ur: "قرمانجان داتقا (1811–1907)، اصل نام قرمانجان ماماتبائی قیزی، 1862 سے 1876 تک آلائی کرغیزوں کی حکمران رہیں؛ انہیں بخارا اور خوقند کے خانوں نے «داتقا» کا لقب دیا۔ 1876 میں انہوں نے اپنے لوگوں کو روسی بالادستی قبول کرنے پر آمادہ کیا اور 1907 میں مادی میں وفات پائی۔"
