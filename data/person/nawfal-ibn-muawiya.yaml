summary:
  en: "Chief of Banu al-Dil of Banu Bakr in the truce years; he led the night attack on Khuza'a at al-Watir seeking blood-revenge and refused to halt at the sanctuary's bounds — the breach that precipitated the conquest of Mecca."
  ar: "سيد بني الديل من بني بكر في سنين الهدنة؛ قاد التبييت على خزاعة عند ماء الوتير طلبًا بثأر قديم، وأبى أن يفيء إليها حين ناشده رجاله حدود الحرم — وهو الخرق الذي ترتب عليه فتح مكة."
  es: "Jefe de Banu al-Dil de Banu Bakr durante los años de la tregua; dirigió el ataque nocturno contra Khuza'a en al-Watir buscando venganza de sangre y se negó a detenerse en los límites del santuario, la brecha que precipitó la conquista de La Meca."
  fr: "Chef des Banu al-Dil des Banu Bakr pendant les années de trêve; il mena l'attaque nocturne contre Khuza'a à al-Watir en quête de vengeance et refusa de s'arrêter aux limites du sanctuaire — la brèche qui précipita la conquête de La Mecque."
