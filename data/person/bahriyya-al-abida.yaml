gender: female
roles: [mystic]
summary:
  ar: "عابدة واعظة من البصرة كان لها مجلس تذكّر فيه؛ يروي ابن الجوزي في «صفة الصفوة» مناجاتها وقولها: إذا ترك القلب الشهوات ألف العلم واتبعه."
  en: "A devout woman preacher of Basra who held a gathering of admonition; Ibn al-Jawzi's Sifat al-Safwa records her prayer and her saying, 'When the heart leaves its desires it becomes familiar with knowledge and follows it.'"
  ur: "بصرہ کی ایک عابدہ واعظہ جن کی وعظ کی مجلس ہوتی تھی؛ ابن الجوزی کی «صفۃ الصفوہ» ان کی مناجات اور یہ قول نقل کرتی ہے: «جب دل خواہشات چھوڑ دے تو علم سے مانوس ہو کر اس کی پیروی کرتا ہے»۔"
  es: "Una devota predicadora de Basora que organizó una reunión de exhortación; en el Sifat al-Safwa de Ibn al-Jawzi se recoge su oración y sus palabras: «Cuando el corazón abandona sus deseos, se familiariza con el conocimiento y lo sigue»."
  fr: "Une fervente prédicatrice de Bassora qui organisait une réunion d'exhortation; le Sifat al-Safwa d'Ibn al-Jawzi rapporte sa prière et ses paroles: « Lorsque le cœur abandonne ses désirs, il se familiarise avec la connaissance et la suit. »"
  tr: "Basra'dan bir anma toplantısı yapmış dindar bir vaiz; İbn al-Jawzi, 'Sifatal-Safwa'da duasını ve şu sözünü anlatır: 'Eğer kalp arzuları terk ederse, bilgi edinin ve onu takip edinin.'"
  id: "Seorang pengkhotbah taat dari Basra yang mengadakan pertemuan untuk mengenang; Ibn al-Jawzi menceritakan dalam 'Sifat al-Safwa' permohonannya dan ucapannya: 'Jika hati meninggalkan keinginan, perolehlah pengetahuan dan ikutilah.'"
