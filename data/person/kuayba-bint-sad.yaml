summary:
  ar: "صحابية أسلمية من الممرضات اللاتي أكببن على مداواة جرحى المسلمين بعد غزوة أحد؛ عالجت منهم جريحاً أصيب بسهم في ذراعه حتى برأ، وعُدت من خدمة المؤمنين الدؤوبة."
  en: "An Aslami Companion among the women nurses who tended the wounded Muslims after the Battle of Uhud; she treated a man struck by an arrow in the arm until he recovered."
  ur: "اسلمی صحابیہ، ان نرس خواتین میں سے جنہوں نے احد کے بعد مسلمان زخمیوں کی دیکھ بھال کی؛ اس نے تیر لگے ایک شخص کا علاج کیا۔"
  es: "Una compañera aslamí del cuerpo de enfermeras que atendieron a los musulmanes heridos tras la batalla de Uhud; trató a un hombre herido por una flecha en el brazo hasta que se recuperó."
  fr: "Une Aslami Compagne parmi les infirmières qui soignaient les musulmans blessés après la bataille d'Uhud; elle soigna un homme touché au bras par une flèche jusqu'à sa guérison."
  tr: "Uhud Savaşı'ndan sonra yaralı Müslümanları iyileştirmeye çaba harcayan Müslüman bir kadın hemşire; bir yaralıyı koluna bir ok ile tedavi etti, iyileşene kadar ve inananlara özverili hizmete geri döndü."
  id: "Seorang perawat wanita Muslim yang mendedikasikan usahanya untuk menyembuhkan Muslim yang terluka setelah Pertempuran Uhud; ia merawat seorang yang terluka oleh panah di lengannya hingga ia pulih, dan ia kembali ke pelayanan yang tekun bagi para umat."
