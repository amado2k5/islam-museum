id: person/abdallah-ibn-bistam-al-harithi
class: person
label:
  ar: "عبد الله بن بسطام الحارثي"
  en: "Abdallah ibn Bistam al-Harithi"
  fr: "Abdallah ibn Bistam al-Harithi"
  ur: "عبداللہ بن بسطام الحارثی"
  es: "Abdallah ibn Bistam al-Harithi"
summary:
  ar: "من بني ربيعة، لقي الهادي بيولس سنة 294هـ، ومع الوادعيين أمر بالغارة على راحة، ثم جاء بالحماسيين مستأمنين فأمنهم الهادي."
  en: "Of Banu Rabi'a, he met al-Hadi at Yulis in 294 AH; with Wada'a he ordered the raid on Raha, and later brought the Hamasiyin seeking safety, whom al-Hadi granted safety."
  fr: "Des Banu Rabi'a, il rencontra al-Hadi à Yulis en 294 H ; avec les Wada'a, il ordonna l'attaque contre Raha, et amena plus tard les Hamasiyin en quête de sauvegarde, qu'al-Hadi leur accorda."
  ur: "بنی ربیعہ میں سے؛ 294ھ میں یولس میں ہادی سے ملے، وادعہ کے ساتھ راحہ پر حملے کا حکم دیا، اور بعد میں الحماسیین کو امان طلب کرتے ہوئے لائے جنہیں ہادی نے امان دی۔"
  es: "De Banu Rabi'a, se reunió con al-Hadi en Yulis en el año 294 de la Hégira; junto con Wada'a ordenó la incursión en Raha, y más tarde trajo a los Hamasiyin que buscaban refugio, a quienes al-Hadi les concedió protección."
  tr: "Banu Rabi’ah kabilesinden El-Hadi, Hicri 294 yılında Yulus ile karşılaştı ve Wadi’iyin ile birlikte Rahah’a baskın düzenlenmesini emretti. Daha sonra Hamasiyin kabilesini koruma talebiyle getirdi ve El-Hadi onlara koruma sağladı."
  id: "Dari Bani Rabi’ah, Al-Hadi bertemu dengan Yulus pada tahun 294 H, dan bersama Wadi’iyin ia memerintahkan penyerangan ke Rahah, kemudian ia membawa Hamasiyin untuk meminta perlindungan, sehingga Al-Hadi memberi mereka perlindungan."
