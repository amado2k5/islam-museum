summary:
  ar: "محدث هندي ⁦(1857–1911)⁩ من أعلام أهل الحديث في شبه القارة الهندية. اشتهر بشرحه «عون المعبود على سنن أبي داود» الذي صار أكثر شروح أبي داود تداولًا، وله «غاية المقصود في حل مراسيل أبي داود» و«التعليق المغني على موطأ محمد» وخدمات تحقيقية أخرى."
  en: "Indian hadith scholar (1857–1911), a luminary of the Ahl-i Hadith in the subcontinent. He is famed for 'Awn al-Ma'bud 'ala Sunan Abi Dawud, now the most-used commentary on Abu Dawud, and for Ghayat al-Maqsud, Al-Ta'liq al-Mughni on the Muwatta of Muhammad al-Shaybani, and other editorial services."
  ur: "ہندوستانی محدث ⁦(1857–1911)⁩ جو برِصغیر میں اہلِ حدیث کے ممتاز علماء میں شمار ہوتے ہیں۔ وہ «عون المعبود علی سنن ابی داود» کے لیے معروف ہیں جو ابی داؤد کی سب سے زیادہ مستعمل شرح بنی؛ ان کی دیگر تصانیف میں «غایۃ المقصود» اور موطأ محمد پر «التعلیق المغنی» شامل ہیں۔"
