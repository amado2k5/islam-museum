summary:
  ar: "أبو الفضل الهاشمي. دخل عليه أبو العباس بن مسروق الطوسي وهو عليل ذو عيال، فلما خرج تساءل في نفسه من أين يأكل هذا الرجل، فصاح به أبو الفضل: يا أبا العباس، رد هذه الهمة الرديئة، فإن لله ألطافًا خفية."
  en: "Abu al-Fadl al-Hashimi. Abu al-Abbas ibn Masruq al-Tusi visited him while he was ill and had a family, and when he left, Abu al-Abbas wondered in his heart how the man would eat; Abu al-Fadl cried out to him: Abu al-Abbas, return this bad concern, for God has hidden graces."
  ur: "ابو الفضل ہاشمی۔ ابو العباس بن مسروق طوسی بیمار اور عیال دار ابو الفضل کے پاس گئے؛ جب وہ نکلے تو دل میں سوچا کہ یہ شخص کہاں سے کھاتا ہوگا؛ ابو الفضل نے پکارا: اے ابو العباس، یہ بری فکر واپس لو، کیونکہ اللہ کے پوشیدہ لطف ہیں۔"
  fr: "Abu al-Fadl al-Hashimi. Abu al-Abbas ibn Masruq al-Tusi lui rendit visite alors qu'il était malade et avait une famille, et en sortant, Abu al-Abbas se demanda en son cœur comment cet homme mangerait ; Abu al-Fadl lui cria : Abu al-Abbas, renvoie ce mauvais souci, car Dieu a des grâces cachées."
  es: "Abu al-Fadl al-Hashimi. Abu al-Abbas ibn Masruq al-Tusi lo visitó mientras estaba enfermo y tenía familia, y cuando se fue, Abu al-Abbas se preguntó en su corazón cómo comería el hombre; Abu al-Fadl le gritó: Abu al-Abbas, devuelve esta mala preocupación, porque Dios tiene gracias ocultas."
  tr: "Ebu el-Fadl el-Haşimi. Ebu el-Abbas ibn Masruq el-Tusi, Ebu el-Abbas hasta ve bakmakla yükümlü olduğu kişiler varken onun yanına girdi. Ayrılırken kendi kendine, \"Bu adam yemeğini nereden buluyor?\" diye düşündü. Ebu el-Fadl ona, \"Ey Ebu el-Abbas, bu kötü niyetinden vazgeç, çünkü Allah'ın gizli nimetleri vardır\" diye seslendi."
  id: "Abu al-Fadl al-Hashimi. Abu al-Abbas ibn Masruq al-Tusi mengunjunginya ketika ia sedang sakit dan memiliki tanggungan. Ketika ia pergi, ia bertanya-tanya dalam hati, “Dari mana orang ini mendapatkan makanannya?” Abu al-Fadl berteriak kepadanya, “Wahai Abu al-Abbas, tinggalkan niat buruk ini, karena Allah memiliki nikmat yang tersembunyi.”"
