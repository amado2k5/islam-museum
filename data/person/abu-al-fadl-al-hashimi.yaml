summary:
  ar: "أبو الفضل الهاشمي. دخل عليه أبو العباس بن مسروق الطوسي وهو عليل ذو عيال، فلما خرج تساءل في نفسه من أين يأكل هذا الرجل، فصاح به أبو الفضل: يا أبا العباس، رد هذه الهمة الرديئة، فإن لله ألطافًا خفية."
  en: "Abu al-Fadl al-Hashimi. Abu al-Abbas ibn Masruq al-Tusi visited him while he was ill and had a family, and when he left, Abu al-Abbas wondered in his heart how the man would eat; Abu al-Fadl cried out to him: Abu al-Abbas, return this bad concern, for God has hidden graces."
  ur: "ابو الفضل ہاشمی۔ ابو العباس بن مسروق طوسی بیمار اور عیال دار ابو الفضل کے پاس گئے؛ جب وہ نکلے تو دل میں سوچا کہ یہ شخص کہاں سے کھاتا ہوگا؛ ابو الفضل نے پکارا: اے ابو العباس، یہ بری فکر واپس لو، کیونکہ اللہ کے پوشیدہ لطف ہیں۔"
