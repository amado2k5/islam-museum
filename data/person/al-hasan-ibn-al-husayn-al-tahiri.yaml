summary:
  ar: "الحسن بن الحسين عم عبد الله بن طاهر؛ وجهه ابن أخيه في رجال خراسان إلى مازيار بن قارن وكان صاحب حيلة الكمين التي أخذ بها مازيار بالأمان المخادع."
  en: "Al-Hasan ibn al-Husayn, Abdallah ibn Tahir's uncle; sent at Khurasan's head against Mazyar, his the ambush-ruse that took him on the false aman."
  es: "Al-Hasan ibn al-Husayn, tío de Abdallah ibn Tahir, fue enviado a atacar a Jorasán contra Mazyar, mediante una emboscada que lo llevó a la trampa del falso aman."
  fr: "Al-Hasan ibn al-Husayn, l'oncle d'Abdallah ibn Tahir; envoyé à la tête de Khurasan contre Mazyar, son embuscade-ruse qui le prit sur le faux aman."
  ur: "الحسن بن الحسین، عبداللہ بن طاہر کے چچا؛ خراسان کے سر پر مزیار کے خلاف بھیجا، اس کی گھات کی چال جس نے اسے جھوٹے امان پر لے لیا۔"
  tr: "Abdullah ibn Tahir'in amcası el-Hasan bin el-Hüseyin; yeğeni onu Horasan adamları arasına Maziar ibn Qaran'a gönderdi ve Maziar'ın aldatıcı güvenliği sağlamak için kullandığı pusu numarasının ustasıydı."
  id: "Al-Hasan ibn al-Husayn, paman Abdullah ibn Tahir; keponakannya mengirimnya ke antara orang-orang Khurasan ke Maziar ibn Qaran, dan ia adalah ahli dalam trik penyergapan yang digunakan Maziar untuk mengamankan keselamatan yang menipu."
