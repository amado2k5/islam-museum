summary:
  ar: "طبيبة قلب وسياسية باكستانية وُلدت في بيشاور في 16 فبراير 1963. تخرجت في كلية خيبر للطب أولى على دفعتها سنة 1986 ونالت الدكتوراه من كلية كينغز لندن، وأسست منظمة هارتفايل للسياسات الصحية، وشغلت مناصب وزارية في الحكومة الانتقالية سنة 2013، وقادت برنامج إحساس لتخفيف الفقر مساعدة خاصة لرئيس الوزراء برتبة وزيرة اتحادية، وانتُخبت لعضوية مجلس الشيوخ سنة 2021، وعُيّنت سنة 2024 رئيسة تنفيذية لتحالف غافي للقاحات."
  en: "Pakistani cardiologist and politician, born in Peshawar on 16 February 1963. She graduated top of her class from Khyber Medical College in 1986 and took her PhD at King's College London, founded the health-policy think tank Heartfile, held caretaker cabinet portfolios in 2013, led the Ehsaas poverty-alleviation programme as special assistant to the prime minister with federal-minister rank, was elected to the Senate in 2021, and in 2024 became CEO of Gavi, the Vaccine Alliance."
  ur: "پاکستانی ماہر امراض قلب اور سیاست دان، جو 16 فروری 1963ء کو پشاور میں پیدا ہوئیں۔ انھوں نے 1986ء میں خیبر میڈیکل کالج سے اپنی جماعت میں اول آ کر گریجویشن کی اور کنگز کالج لندن سے پی ایچ ڈی کی، صحتی پالیسی کے تھنک ٹینک ہارٹ فائل کی بنیاد رکھی، 2013ء میں نگران کابینہ میں وزارتیں سنبھالیں، وفاقی وزیر کے درجے کے ساتھ وزیر اعظم کی معاون خصوصی کی حیثیت سے احساس پروگرام کی قیادت کی، 2021ء میں سینیٹ کی رکن منتخب ہوئیں، اور 2024ء میں ویکسین الائنس گاوی کی چیف ایگزیکٹو بن گئیں۔"
