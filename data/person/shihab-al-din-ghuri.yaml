label: { ar: "شهاب الدين الغوري", en: "Shihab al-Din al-Ghuri" }
summary:
  ar: "شهاب الدين أبو المظفر محمد بن سام الغوري ملك غزنة وبعض خراسان؛ وصفه ابن الأثير بأنه كان شجاعاً مقداماً كثير الغزو إلى بلاد الهند عادلاً في رعيته حاكماً بينهم بما يوجبه الشرع، وكان القاضي بغزنة يحضر داره من كل أسبوع السبت والأحد والاثنين والثلاثاء ومعه أمير حاجب وأمير دار وصاحب التربة فيحكم القاضي وتنفذ أصحاب السلطان أحكامه على الصغير والكبير والشريف والوضيع؛ قتله الكوكرية — وقيل الإسماعيلية — بدميك في أول ليلة شعبان سنة اثنتين وستمائة وهو عائد من لهاور، ودفن بالمدرسة التي أنشأها بغزنة {cite:kamil-ibn-al-athir p. 303-305}."
  en: "Muhammad ibn Sam al-Ghuri, lord of Ghazna and part of Khurasan — Ibn al-Athir praises his courage, constant campaigning in India, and the weekly qadi-court at his house whose rulings ran on great and small alike; killed by the Khokkars (or, some said, the Ismailis) at Damiyak returning from Lahore, Sha'ban 602 {cite:kamil-ibn-al-athir p. 303-305}."
