summary:
  ar: "سياسي تركي، رئيس جمهورية تركيا منذ سنة 2014، ورئيس وزرائها من 2003 إلى 2014، ورئيس بلدية إسطنبول من 1994 إلى 1998. شارك في تأسيس حزب العدالة والتنمية سنة 2001 وقاده إلى انتصارات انتخابية متتالية، وارتبط اسمه بتحول تركيا إلى النظام الرئاسي وبجدل واسع حول مسار الديمقراطية والحريات في بلاده."
  en: "Turkish politician, president of Turkey since 2014, previously prime minister from 2003 to 2014 and mayor of Istanbul from 1994 to 1998. He co-founded the Justice and Development Party (AKP) in 2001 and led it to repeated election victories; his rule is associated with Turkey's move to a presidential system and with wide debate over the course of democracy and freedoms in his country."
  ur: "ترک سیاست دان، 2014 سے ترکی کے صدر، اس سے پہلے 2003 سے 2014 تک وزیر اعظم اور 1994 سے 1998 تک استنبول کے میئر رہے۔ انہوں نے 2001 میں جسٹس اینڈ ڈویلپمنٹ پارٹی (AKP) کی تاسیس میں حصہ لیا اور اسے مسلسل انتخابی فتوحات دلائیں؛ ان کے دور کو ترکی کے صدارتی نظام کی طرف انتقال اور جمہوریت و آزادیوں پر وسیع بحث سے جوڑا جاتا ہے۔"
  es: "Político turco, presidente de Turquía desde 2014, anteriormente primer ministro de 2003 a 2014 y alcalde de Estambul de 1994 a 1998. Cofundó el Partido de la Justicia y el Desarrollo (AKP) en 2001 y lo llevó a repetidas victorias electorales; su mandato está asociado con la transición de Turquía a un sistema presidencial y con un amplio debate sobre el rumbo de la democracia y las libertades en su país."
  fr: "Homme politique turc, président de la Turquie depuis 2014, il a auparavant été Premier ministre de 2003 à 2014 et maire d'Istanbul de 1994 à 1998. Il a cofondé le Parti de la justice et du développement (AKP) en 2001 et l'a mené à de nombreuses victoires électorales; son mandat est associé à la transition de la Turquie vers un système présidentiel et à de larges débats sur l'évolution de la démocratie et des libertés dans son pays."
  tr: "Türk siyasetçi, 2014'ten beri Türkiye Cumhurbaşkanı, 2003-2014 yılları arasında Başbakan ve 1994-1998 yılları arasında İstanbul Belediye Başkanı olarak görev yaptı. 2001'de Adalet ve Kalkınma Partisi'nin kuruluşunda yer aldı ve partiyi ardışık seçim zaferlerine taşıdı. Adı, Türkiye'nin cumhurbaşkanlığına geçişi ve ülkesinde demokrasi ve özgürlükler yolu üzerine yaygın tartışmalarla ilişkilendirildi."
  id: "Politikus Turki, Presiden Republik Turki sejak 2014, Perdana Menteri dari 2003 hingga 2014, dan Wali Kota Istanbul dari 1994 hingga 1998. Ia berpartisipasi dalam pendirian Partai Keadilan dan Pembangunan pada tahun 2001 dan memimpinnya meraih kemenangan elektoral berturut-turut. Namanya menjadi terkait dengan transisi Turki menuju sistem presidensial dan perdebatan luas mengenai jalan demokrasi dan kebebasan di negaranya."
