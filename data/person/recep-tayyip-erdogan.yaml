summary:
  ar: "سياسي تركي، رئيس جمهورية تركيا منذ سنة 2014، ورئيس وزرائها من 2003 إلى 2014، ورئيس بلدية إسطنبول من 1994 إلى 1998. شارك في تأسيس حزب العدالة والتنمية سنة 2001 وقاده إلى انتصارات انتخابية متتالية، وارتبط اسمه بتحول تركيا إلى النظام الرئاسي وبجدل واسع حول مسار الديمقراطية والحريات في بلاده."
  en: "Turkish politician, president of Turkey since 2014, previously prime minister from 2003 to 2014 and mayor of Istanbul from 1994 to 1998. He co-founded the Justice and Development Party (AKP) in 2001 and led it to repeated election victories; his rule is associated with Turkey's move to a presidential system and with wide debate over the course of democracy and freedoms in his country."
  ur: "ترک سیاست دان، 2014 سے ترکی کے صدر، اس سے پہلے 2003 سے 2014 تک وزیر اعظم اور 1994 سے 1998 تک استنبول کے میئر رہے۔ انہوں نے 2001 میں جسٹس اینڈ ڈویلپمنٹ پارٹی (AKP) کی تاسیس میں حصہ لیا اور اسے مسلسل انتخابی فتوحات دلائیں؛ ان کے دور کو ترکی کے صدارتی نظام کی طرف انتقال اور جمہوریت و آزادیوں پر وسیع بحث سے جوڑا جاتا ہے۔"
