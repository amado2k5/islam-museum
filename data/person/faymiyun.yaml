summary:
  en: "The ascetic and answered supplicant who entered Najran before the second Abyssinian occupation and called its people to Christianity; the Raheeq narrative names him as the agent of Najran’s conversion."
  ar: "رجل زاهد مستجاب الدعوات صاحب كرامات دخل نجران قبل الاحتلال الحبشي الثاني ودعا أهلها إلى النصرانية، فرأوا من أمارات صدقه ما لبّوا لأجله فاعتنقوها؛ يذكره الرحيق وسيط دخول النصرانية نجران."
  es: "El asceta y suplicante que entró en Najrán antes de la segunda ocupación abisinia y llamó a su gente al cristianismo; la narración de Raheeq lo nombra como el agente de la conversión de Najrán."
  fr: "L'ascète et suppliant exaucé qui entra à Najran avant la seconde occupation abyssinienne et appela son peuple au christianisme; le récit de Raheeq le désigne comme l'agent de la conversion de Najran."
  ur: "حبشہ کے دوسرے تسلط سے پہلے نجران میں داخل ہونے والے اور اس کے لوگوں کو عیسائیت کی طرف بلانے والا متقی اور مدعا قبول کرنے والا۔ رحیق کی روایت اسے نجران کی تبدیلی کا ایجنٹ قرار دیتی ہے۔"
  tr: "İkinci Habeşistan işgalinden önce Necran'a giren, duası kabul edilen, mucizeler dolu bir adamdır. Onlar onun doğruluğunun işaretlerini gördüler ve kabul ettiler; Al-Hareq tarafından Najran'ın Hristiyanlığa girişinde arabulucu olarak anılmaktadır."
  id: "Seorang pertapa yang terjawab doa, pria mukjizat, yang memasuki Najran sebelum pendudukan Abyssinia kedua dan mengundang rakyatnya ke dalam Kekristenan. Mereka melihat tanda-tanda kebenarannya dan menerimanya; ia disebut oleh Al-Hareq sebagai mediator masuknya Najran ke dalam Kekristenan."
