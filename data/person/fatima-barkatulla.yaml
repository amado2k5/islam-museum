summaries:
  ar: «عالمة شرعية بريطانية ومؤلفة ومقدمة بودكاست، وُلدت في لندن، درست العربية والدراسات الإسلامية في مصر وفي معاهد بريطانية وتخصصت في الفقه، وأسست منصة «Muslim Womanhood» وتديرها، وألفت كتبًا في سير نساء صدر الإسلام منها «خديجة» و«عائشة».»
  en: "British Islamic scholar ('alimah), author and podcaster, born in London. She studied Arabic and Islamic studies in Egypt and at British seminaries, specialised in fiqh, founded and leads Muslim Womanhood, directed the Seeds of Change women's conference, and wrote Khadijah and Aisha."
  ur: «برطانوی عالمہ، مصنفہ اور پوڈکاسٹ میزبان، لندن میں پیدا ہوئیں؛ مصر اور برطانوی مدارس میں عربی و اسلامی علوم پڑھے اور فقہ میں تخصص کیا، «Muslim Womanhood» کی بانی ہیں اور «خدیجہ» و «عائشہ» کی مصنفہ ہیں۔»
