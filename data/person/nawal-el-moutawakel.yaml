summary:
  ar: "نوال المتوكل ⁦(وُلدت في 15 نيسان 1962 في الدار البيضاء)⁩ عدّاءة مغربية سابقة، فازت بذهبية سباق 400 متر حواجز في أولمبياد لوس أنجلوس 1984 لتصبح أول امرأة مغربية وعربية وأفريقية ومسلمة تنال ذهبًا أولمبيًا؛ تولت وزارة الشباب والرياضة المغربية (2007–2009) وهي عضوة في اللجنة الأولمبية الدولية منذ 1998 ونائبة لرئيسها."
  en: "Nawal El Moutawakel (born 15 April 1962 in Casablanca) is a Moroccan former hurdler who won the women's 400 metres hurdles at the 1984 Los Angeles Olympics, becoming the first Moroccan, Arab, African, and Muslim woman to win an Olympic gold medal; she served as Morocco's Minister of Youth and Sports (2007-2009) and has been an International Olympic Committee member since 1998 and one of its vice-presidents."
  ur: "نوال المتوکل ⁦(پیدائش 15 اپریل 1962، دار البیضاء)⁩ مراکش کی سابق رکاوٹ دوڑ دوڑنے والی کھلاڑی ہیں جنھوں نے 1984 کے لاس اینجلس اولمپکس میں خواتین کی 400 میٹر رکاوٹ دوڑ جیت کر اولمپک طلائی تمغا جیتنے والی پہلی مراکشی، عرب، افریقی اور مسلم خاتون بننے کا اعزاز حاصل کیا؛ وہ مراکش کی وزیرِ نوجوانان و کھیل (2007–2009) رہیں اور 1998 سے بین الاقوامی اولمپک کمیٹی کی رکن اور اس کی نائب صدر ہیں۔"
