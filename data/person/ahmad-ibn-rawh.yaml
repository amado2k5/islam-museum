summary:
  ar: "أحمد بن روح المستغيث بالمولى من حلول البلوى. أنشد عثمان بن محمد العثماني شعرًا يستغيث فيه بسيّد يُدفع به البلوى، ويؤمّل مولى لا يخيب عبده، ويلوذ بباب من يدعوه فردًا إذا نامت عيون الناس."
  en: "Ahmad ibn Rawh, who cried to his Lord for relief when trials fell; Uthman ibn Muhammad al-Uthmani relates verses he recited, crying to a master by whom affliction is removed, hoping in a lord who does not disappoint his servant, and seeking the door of the One he calls alone while the eyes of the people sleep."
  ur: "احمد بن روح، جو آزمائش آنے پر اپنے آقا سے فریاد کرتے تھے۔ عثمان بن محمد عثمانی نے ان کے وہ اشعار نقل کیے جن میں وہ اس سردار کو پکارتے ہیں جس سے مصیبت دور ہوتی ہے، اس آقا سے امید رکھتے ہیں جو اپنے بندے کو نامراد نہیں کرتا، اور اس کے دروازے پر پناہ لیتے ہیں جسے وہ تنہا پکارتے ہیں جب لوگوں کی آنکھیں سو جاتی ہیں۔"
