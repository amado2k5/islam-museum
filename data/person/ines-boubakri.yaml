summary:
  ar: "مبارزة تونسية في سلاح الشيش، وُلدت في تونس العاصمة سنة 1988. نالت برونزية أولمبياد ريو 2016 فكانت أول تونسية وأول أفريقية وعربية تفوز بميدالية أولمبية في المبارزة، وشاركت في أربع دورات أولمبية بين 2008 و2020."
  en: "Tunisian foil fencer, born in Tunis in 1988. Her bronze medal at the Rio 2016 Olympics made her the first Tunisian, and the first African and Arab woman, to win an Olympic medal in fencing; she competed at four Olympic Games between 2008 and 2020."
