summary:
  ar: قارئ نعت باكستاني وُلد سنة 1970 في كراتشي؛ من أشهر قرّاء النعت في العالم الإسلامي السني، لُقّب «بلبل المدينة»، وتلا النعت في عشرات الدول وأصدر مئات الألبومات.
  en: Pakistani naat reciter born in Karachi in 1970; among the most famous naat voices in the Sunni Muslim world, honoured with the title Bulbul-e-Madinah, he has recited in dozens of countries and released
    hundreds of albums.
  ur: پاکستانی نعت خواں جو 1970 میں کراچی میں پیدا ہوا؛ سنی مسلم دنیا کے مشہور ترین نعت اصوات میں سے، بلبل مدینہ کا لقب پایا، درجنوں ممالک میں نعت خوانی کی اور سینکڑوں البم جاری کیے۔
  es: "Recitador de naat pakistaní nacido en Karachi en 1970; una de las voces de naat más famosas del mundo musulmán sunita, honrado con el título de Bulbul-e-Madinah, ha recitado en docenas de países y ha lanzado cientos de álbumes."
  fr: "Récitation de naat pakistanaise, née à Karachi en 1970; l'une des voix de naat les plus célèbres du monde musulman sunnite, honorée du titre de Bulbul-e-Madinah, il a récité dans des dizaines de pays et sorti des centaines d'albums."
  tr: "1970 yılında Karaçi'de doğan Pakistanlı bir övgü okuyan Sünni İslam dünyasının en ünlü övgü konuşmacılarından biri olan ve 'Bulbul al-Medina' lakaplı bir sanatçıdır. Onlarca ülkede övgüler okudu ve yüzlerce albüm çıkardı."
  id: "Seorang pembaca eulogi asal Pakistan yang lahir pada tahun 1970 di Karachi, salah satu pembaca eulogi paling terkenal di dunia Islam Sunni, dijuluki 'Bulbul al-Madina'. Ia membacakan eulogi di puluhan negara dan merilis ratusan album."
