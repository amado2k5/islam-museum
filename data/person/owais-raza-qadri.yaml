  es: "Recitador de naat pakistaní nacido en Karachi en 1970; una de las voces de naat más famosas del mundo musulmán sunita, honrado con el título de Bulbul-e-Madinah, ha recitado en docenas de países y ha lanzado cientos de álbumes."
