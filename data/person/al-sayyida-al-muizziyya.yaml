  ur: "فاطمی خلیفہ المعز ل الدین اللہ کی دسویں صدی کی پرنسپل ساتھی، السیدۃ المعزیہ کے لیے کارڈ کا مسودہ، d۔ 995; ماخذ کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
