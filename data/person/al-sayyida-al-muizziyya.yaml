  id: "Kartu pendahuluan Lady Al-Mu'izziyya, istri Al-Mu'izz li-Din Allah si Fatimiyah pada abad kesepuluh, yang meninggal pada tahun 995 M; ia disebutkan dalam buku sejarah dan terjemahannya belum pernah diulas di halaman."
