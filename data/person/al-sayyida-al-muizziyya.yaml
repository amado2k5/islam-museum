  ar: "بطاقة أولية للسيدة المعزية، قرينة المعز لدين الله الفاطمي الرئيسة في القرن العاشر، توفيت سنة ٩٩٥م؛ تذكرها كتب التاريخ ولم تُراجع ترجمتها على الصفحة بعد."
  en: "Draft card for al-Sayyida al-Mu'izziyya, the tenth-century principal consort of the Fatimid caliph al-Mu'izz li-Din Allah, d. 995; the source entry is not yet checked on the page."
