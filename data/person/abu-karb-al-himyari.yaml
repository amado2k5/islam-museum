label: { ar: "تبع أبو كرب", en: "Tubba' Abu Karib" }
summary:
  ar: "تبع أبو كرب الحميري، سار في الأرض ووطئ الممالك وذللها، لقي بأرض العراق قباد ملك الطوائف فهزمه وملك العراق والشام والحجاز وكثيراً من الشرق، وفي أشعاره المنسوبة إليه وصف كسوة البيت الحرام بالملاء المقصب والبرود وطوافه به سبعاً وسبعاً وسجوده عند المقام، وقال المسعودي إنما يسمى ملك اليمن تبعاً حين ينقاد إليه أهل الشحر وحضرموت {cite:muruj-al-dhahab p. 429-430}."
  en: "The Himyarite conqueror who broke the Partisan king Qubadh and ruled Iraq, Syria and the Hijaz — his verses claim the Ka'ba's striped covering and seventy circuits — while al-Mas'udi glosses the title 'Tubba' as earned only once Shahar and Hadhramawt obeyed {cite:muruj-al-dhahab p. 429-430}."
