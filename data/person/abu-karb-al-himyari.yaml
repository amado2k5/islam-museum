label: { ar: "تبع أبو كرب", en: "Tubba' Abu Karib", fr: "Tubba' Abu Karib", es: "Tubba' Abu Karib" }
summary:
  ar: "تبع أبو كرب الحميري، سار في الأرض ووطئ الممالك وذللها، لقي بأرض العراق قباد ملك الطوائف فهزمه وملك العراق والشام والحجاز وكثيراً من الشرق، وفي أشعاره المنسوبة إليه وصف كسوة البيت الحرام بالملاء المقصب والبرود وطوافه به سبعاً وسبعاً وسجوده عند المقام، وقال المسعودي إنما يسمى ملك اليمن تبعاً حين ينقاد إليه أهل الشحر وحضرموت {cite:muruj-al-dhahab p. 429-430}."
  en: "The Himyarite conqueror who broke the Partisan king Qubadh and ruled Iraq, Syria and the Hijaz — his verses claim the Ka'ba's striped covering and seventy circuits — while al-Mas'udi glosses the title 'Tubba' as earned only once Shahar and Hadhramawt obeyed {cite:muruj-al-dhahab p. 429-430}."
  fr: "Le conquérant himyarite qui brisa le roi des Tawa'if Qubadh et régna sur l'Irak, la Syrie et le Hijaz — ses vers revendiquent la couverture rayée de la Kaaba et soixante-dix circumambulations — tandis qu'al-Mas'udi explique que le titre de « Tubba' » ne s'acquiert qu'une fois Shahar et le Hadramaout soumis {cite:muruj-al-dhahab p. 429-430}."
  es: "El conquistador himyarita que derrotó al rey partisano Qubadh y gobernó Irak, Siria y el Hiyaz —sus versos afirman la cubierta a rayas de la Kaaba y sus setenta circuitos— mientras que al-Mas'udi explica que el título de 'Tubba' se obtuvo solo una vez que Shahar y Hadhramawt obedecieron {cite:muruj-al-dhahab p. 429-430}."
