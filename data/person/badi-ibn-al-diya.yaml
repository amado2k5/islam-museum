summary:
  ar: "بديع بن الضياء قاضي مكة المشرفة وشيخ الحرم بها؛ قال ابن طولون: كان من أهل الفضل والرياسة قدم دمشق ثم سافر إلى مصر فبلغه تولية قضاء مكة للشيخ زين الدين عبد اللطيف بن أبي كثير فرجع إلى دمشق وأقام بها مدة، ثم سافر إلى الروم سنة إحدى وأربعين بعد أن حضر عند الشيخ علي الكيزواني تجاه مسجد العفيف بالصالحية وسمع المولد وشرب هو والشيخ علي وجماعته القهوة المتخذة من البن — ولا أعلم أنها شربت في بلدنا هذه يعني دمشق قبل ذلك؛ فلما وصل القاضي بديع إلى الروم أعيد إليه قضاء جدة ثم رجع فتوفي بمدينة بدليس من أطراف ديار بكر {cite:shadharat-dhahab p. 663-664}."
  en: "Mecca's qadi and shaykh of the Haram — at Damascus in 941 he attended Shaykh 'Ali al-Kizwani's mawlid opposite the 'Afif mosque and drank with him 'the coffee made of bunn — and I do not know that it was drunk in our country, Damascus, before that' (Ibn Tulun's notice); reappointed qadi of Jeddah in Rum, died at Bitlis {cite:shadharat-dhahab p. 663-664}."
