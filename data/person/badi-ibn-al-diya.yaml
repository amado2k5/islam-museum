summary:
  ar: "بديع بن الضياء قاضي مكة المشرفة وشيخ الحرم بها؛ قال ابن طولون: كان من أهل الفضل والرياسة قدم دمشق ثم سافر إلى مصر فبلغه تولية قضاء مكة للشيخ زين الدين عبد اللطيف بن أبي كثير فرجع إلى دمشق وأقام بها مدة، ثم سافر إلى الروم سنة إحدى وأربعين بعد أن حضر عند الشيخ علي الكيزواني تجاه مسجد العفيف بالصالحية وسمع المولد وشرب هو والشيخ علي وجماعته القهوة المتخذة من البن — ولا أعلم أنها شربت في بلدنا هذه يعني دمشق قبل ذلك؛ فلما وصل القاضي بديع إلى الروم أعيد إليه قضاء جدة ثم رجع فتوفي بمدينة بدليس من أطراف ديار بكر {cite:shadharat-dhahab p. 663-664}."
  en: "Mecca's qadi and shaykh of the Haram — at Damascus in 941 he attended Shaykh 'Ali al-Kizwani's mawlid opposite the 'Afif mosque and drank with him 'the coffee made of bunn — and I do not know that it was drunk in our country, Damascus, before that' (Ibn Tulun's notice); reappointed qadi of Jeddah in Rum, died at Bitlis {cite:shadharat-dhahab p. 663-664}."
  es: "El cadí de La Meca y jeque del Haram —en Damasco en 941 asistió al mawlid del jeque 'Ali al-Kizwani frente a la mezquita 'Afif y bebió con él 'el café hecho con bunn —y no sé si se bebía en nuestro país, Damasco, antes de eso' (nota de Ibn Tulun); fue nombrado nuevamente cadí de Yeda en Rum, murió en Bitlis {cita: shadharat-dhahab pág. 663-664}."
  fr: "Le cadi de La Mecque et cheikh du Haram — à Damas en 941, il assista au mawlid du cheikh 'Ali al-Kizwani en face de la mosquée 'Afif et but avec lui « le café fait de bunn — et je ne sais pas s'il était bu dans notre pays, Damas, avant cela » (note d'Ibn Tulun); nommé de nouveau cadi de Djeddah à Rum, mourut à Bitlis {cite: shadharat-dhahab p. 663-664}."
  ur: "مکہ کے قاضی اور حرم کے شیخ - دمشق میں 941 میں انہوں نے عفیف مسجد کے سامنے شیخ علی الکزوانی کے میلاد میں شرکت کی اور ان کے ساتھ 'بن سے بنی کافی' پی - اور مجھے نہیں معلوم کہ اس سے پہلے ہمارے ملک دمشق میں یہ پیا گیا تھا' ⁦(ابن الطیح)⁩؛ رم میں جدہ کے دوبارہ قاضی مقرر ہوئے، بطلیس میں وفات پائی۔ 663-664}۔"
  tr: "Bedi ibn al-Diya' Mekke'nin hakimi ve oradaki Haram'ın şeyhiydi; İbn Tulun şöyle dedi: O erdemli ve lider bir adamdı, Şam'a geldi, sonra Mısır'a gitti ve Şeyh Zeyndin Abdüllatif ibn Ebi Kathir'in onu Mekke'nin hakimi olarak atadığı bildirildi. Bir süre Şam'a döndü ve orada kaldı, ardından 41 Hicri yılında Romalıların yanına gitti Şeyh Ali el-Kizvani'ye katıldığında, el-Salihiye'deki El-Afif Camii yakınlarında Mevlid'i duydu ve Şeyh Ali ve grubuyla kahveden yapılan kahve içti—bizim kasabamızda, yani Şam'da içildiğini bilmiyorum. Kadi Badi' Romalılara geldiğinde, Cidde yargısına geri gönderildi, sonra döndü ve Diyarbekr dışındaki Bitlis şehrinde öldü {cite:] Shadharat-Dhahab, s. 663-664}."
  id: "Badi' ibn al-Diya' adalah hakim Mekah dan sheikh Haram di sana; Ibn Tulun berkata: Ia adalah orang yang berbudi dan berwibawa, datang ke Damaskus, lalu pergi ke Mesir, di mana ia diberitahu bahwa Sheikh Zain al-Din Abdul Latif ibn Abi Kathir telah mengangkatnya sebagai hakim Mekah. Ia kembali ke Damaskus dan tinggal di sana untuk beberapa waktu, kemudian pergi ke Romawi pada tahun 41 H setelah menghadiri Sheikh Ali al-Kizwani di dekat Masjid Al-Afif di al-Salihiyah, di mana ia mendengar Mawlid dan minum kopi yang dibuat dari kopi bersama Sheikh Ali dan kelompoknya—saya tidak tahu apakah kopi itu diminum di kota kami, yang berarti Damaskus, sebelum itu. Ketika Qadi Badi' tiba di Romawi, ia dikembalikan ke pengadilan Jeddah, kemudian kembali, dan meninggal di kota Bitlis, di pinggiran Diyarbakr {cite:Shadharat-Dhahab, hlm. 663-664}."
