label: { ar: "المستظهر بالله أحمد بن المقتدي" }
summary:
  ar: "خليفة عباسي [٤٨٧–٥١٢هـ]، أبو العباس أحمد بن المقتدي، ولد في شوال سنة سبعين وأربع مئة وبويع له عند موت أبيه وله ست عشرة سنة، وقال ابن الأثير كان لين الجانب كريم الأخلاق يسارع في أعمال البر حسن الخط جيد التوقيعات لا يقاربه فيها أحد يدل على فضل غزير وعلم واسع سمحاً جواداً محباً للعلماء والصلحاء ولم تصف له الخلافة بل كانت أيامه مضطربة كثيرة الحروب {cite:tarikh-khulafa-minhaj-1434 p. 655}."
  en: "Abbasid caliph [487–512], Abu'l-Abbas Ahmad ibn al-Muqtadi, born Shawwal 470, hailed at sixteen; Ibn al-Athir praises his mildness, noble hand and fine rescripts — 'his caliphate never knew calm: his days were turbulent, full of wars' {cite:tarikh-khulafa-minhaj-1434 p. 655}."
