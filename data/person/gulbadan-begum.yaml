  ar: "بطاقة أولية لكل بدن بيكم، بنت بابر وصاحبة همايون نامه، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Gulbadan Begum, daughter of Babur and author of the Humayun Nama, named from an open reference description (Wikidata); her entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Gulbadan Begum, hija de Babur y autora del Humayun Nama, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet pour Gulbadan Begum, fille de Babur et auteure du Humayun Nama, nommée d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "بابر کی بیٹی اور ہمایوں نامہ کی مصنفہ گلبدن بیگم کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Bekum'un her bedeni için, Babur'un kızı ve Humayun Nama'nın sahibi olarak, açık referans açıklamasında (Wikidata) belirtilen ön kart. Hassan İbrahim'in İslam Tarihi kitabındaki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal untuk setiap tubuh Bekum, putri Babur dan pemilik Humayun Nama, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
