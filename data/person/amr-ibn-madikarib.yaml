summary:
  ar: الشاعر الفارس المشهور من زبيد؛ قدم على النبي في وفد زبيد فأسلم في رواية ابن إسحاق، وارتد بعد وفاة النبي ثم أُسر وعاد إلى الإسلام، وأبلى في القادسية؛ واختُلف هل لقي النبي.
  en: The famous poet and horseman of Zubayd; in Ibn Ishaq's account he came to the Prophet with the delegation of Zubayd and embraced Islam, he left Islam after the Prophet's death, was captured and returned to it, and fought well at al-Qadisiyya;
    whether he met the Prophet is disputed.
  ur: "زبید کا مشہور شاعر اور سوار؛ ابن اسحاق کے مطابق وہ زبید کے وفد کے ساتھ نبی کے پاس آیا اور مسلمان ہوا، پھر واپس آیا۔"
  es: "El famoso poeta y jinete de Zubayd; según el relato de Ibn Ishaq, llegó al Profeta con la delegación de Zubayd y abrazó el Islam, lo abandonó tras la muerte del Profeta, fue capturado y regresó a él, y luchó valientemente en al-Qadisiyya; si llegó a conocer al Profeta es un tema controvertido."
  fr: "Le célèbre poète et cavalier de Zubayd; selon le récit d'Ibn Ishaq, il vint auprès du Prophète avec la délégation de Zubayd et embrassa l'islam, il quitta l'islam après la mort du Prophète, fut capturé et y retourna, et combattit vaillamment à al-Qadisiyya; la question de savoir s'il rencontra le Prophète est controversée."
  tr: "Zabid'in ünlü şövalye şairi; Zabid'in heyetiyle Peygamber'e geldi, İbn İshaq'ın rivayetine göre İslam'a geçti, Peygamber'in ölümünden sonra dinden döndü, sonra yakalanıp İslam'a döndü ve günlerini Kadisiye'de geçirdi; Peygamber ile görüşüp görüşmediği konusunda anlaşmazlık var."
  id: "Penyair ksatria terkenal dari Zabid; ia datang kepada Nabi dalam delegasi Zabid, memeluk Islam menurut riwayat Ibn Ishaq, murtad setelah kematian Nabi, kemudian ditangkap dan dikembalikan ke Islam, menghabiskan hari-harinya di Qadisiyyah; ada perbedaan pendapat apakah ia bertemu dengan Nabi."
