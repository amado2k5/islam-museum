summary:
  ar: الشاعر الفارس المشهور من زبيد؛ قدم على النبي في وفد زبيد فأسلم في رواية ابن إسحاق، وارتد بعد وفاة النبي ثم أُسر وعاد إلى الإسلام، وأبلى في القادسية؛ واختُلف هل لقي النبي.
  en: The famous poet and horseman of Zubayd; in Ibn Ishaq's account he came to the Prophet with the delegation of Zubayd and embraced Islam, he left Islam after the Prophet's death, was captured and returned to it, and fought well at al-Qadisiyya;
    whether he met the Prophet is disputed.
