summary:
  ar: "أبو جعفر اليامي الكوفي، سمع أبا بكر بن عياش وعبد الله بن إدريس وحفص بن غياث وعبد بن فضيل ووكيعًا وأبا معاوية وغيرهم، وكان من أهل العلم والفضل؛ ولي قضاء الكوفة وكان يقول حين قُلّد: خُذلت على كبر سني، وتقلد أيضًا قضاء همدان، وورد بغداد يحدث بها، وتوفى سنة ثمان وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 101}."
  en: "Abu Ja'far al-Yami al-Kufi, traditionist and judge of Kufa and Hamadhan — on appointment he said 'I have been betrayed in my old age' — who transmitted at Baghdad and died in 258 {cite:muntazam-ibn-al-jawzi p. 101}."
  fr: "Abu Ja'far al-Yami al-Kufi, traditionniste et cadi de Kufa et de Hamadhan, qui déclara à sa nomination avoir été trahi dans sa vieillesse, transmit à Bagdad et mourut en 258 H {cite:muntazam-ibn-al-jawzi p. 101}."
  es: "Abu Ja'far al-Yami al-Kufi, tradicionalista y juez de Kufa y Hamadhan —al ser nombrado dijo: «He sido traicionado en mi vejez»—, quien transmitió en Bagdad y murió en 258 {cite:muntazam-ibn-al-jawzi p. 101}."
  ur: "ابو جعفر ال یمی الکوفی، کوفہ اور حماد کے محدث اور قاضی - تقرری پر اس نے کہا کہ 'میرے بڑھاپے میں خیانت کی گئی ہے' - جو بغداد میں منتقل ہوئے اور 258 میں وفات پائی۔ 101}۔"
  tr: "Ebu Cafer el-Yami el-Kufi, Ebu Bekr ibn Ayyaş, Abdullah ibn İdris, Hafs ibn Ghiyat, Abd ibn Fadil, Vaki', Ebu Muaviye ve diğerlerinden ilim öğrendi. Bilgili ve erdemli bir adamdı. Kufa'ya kadı olarak atandı ve atandığında şöyle dedi: \"Yaşlılığımda hayal kırıklığına uğradım.\" Ayrıca Hamadan'a da kadı olarak atandı ve orada ders vermek için Bağdat'a geldi. Hicri 258 yılında vefat etti. {cite:muntazam-ibn-al-jawzi s. 101}"
  id: "Abu Ja'far al-Yami al-Kufi mendengar dari Abu Bakr ibn Ayyash, Abdullah ibn Idris, Hafs ibn Ghiyath, Abd ibn Fadil, Waki', Abu Mu'awiyah, dan lainnya. Beliau adalah seorang yang berilmu dan berbudi luhur. Beliau diangkat menjadi hakim Kufa, dan ketika diangkat, beliau berkata: “Aku telah dikecewakan di usia tuaku.” Beliau juga diangkat menjadi hakim Hamadan, dan beliau datang ke Baghdad untuk mengajar di sana. Beliau wafat pada tahun 258 H. {cite:muntazam-ibn-al-jawzi p. 101}"
