  ar: "قادم الديلمي، صحب الفضيل بن عياض وأقرانه، وسلك مسلكه في الخضوع والخشوع، ويروي عن الفضيل قوله في الراضي من الله، وعن عابد من بخارى حكاية راهب في تقلب الأحوال وفناء الآجال."
