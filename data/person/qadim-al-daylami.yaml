roles: [mystic, transmitter]
summary:
  ar: "قادم الديلمي، صحب الفضيل بن عياض وأقرانه، وسلك مسلكه في الخضوع والخشوع، ويروي عن الفضيل قوله في الراضي من الله، وعن عابد من بخارى حكاية راهب في تقلب الأحوال وفناء الآجال."
  en: "Qadim al-Daylami, who kept company with Fudayl ibn Iyad and his peers and followed his way of humility and submission; he relates Fudayl's saying on who is content with God, and a report from a worshipper of Bukhara of a monk's words on the changing of states and the ending of appointed times."
  ur: "قادم دیلمی فضیل بن عیاض اور ان کے ہم عصروں کی صحبت میں رہے اور ان کی عاجزی و خشوع کی راہ اختیار کی۔ وہ فضیل کا قول نقل کرتے ہیں کہ اللہ سے راضی کون ہے، اور بخارا کے ایک عابد سے ایک راہب کی بات بیان کرتے ہیں جو حالات کے بدلنے اور اجلوں کے ختم ہونے کے بارے میں تھی۔"
  es: "Qadim al-Daylami, quien frecuentaba a Fudayl ibn Iyad y a sus compañeros y seguía su camino de humildad y sumisión, relata las palabras de Fudayl sobre quién está contento con Dios, y un relato de un devoto de Bujará sobre las palabras de un monje acerca del cambio de estados y el fin de los tiempos señalados."
  fr: "Qadim al-Daylami, qui fréquentait Fudayl ibn Iyad et ses pairs et suivait sa voie d'humilité et de soumission, rapporte les paroles de Fudayl sur celui qui est satisfait de Dieu, ainsi que le récit d'un fidèle de Boukhara concernant les paroles d'un moine sur le changement des états et la fin des temps fixés."
  tr: "El-Daylami geldi, el-Fudeyl bin İyad ve arkadaşlarına eşlik etti ve onun alçakgönüllülük ve bağlılık yolunu izledi. El-Fudayl'dan 'Al-Radi min Allah' sözünü ve Buhara'dan bir ibadet eden, değişen koşullar ve hayatın geçişi sırasında bir keşişin hikayesini anlatır."
  id: "Al-Daylami datang, menemani al-Fudayl ibn Iyad dan para rakannya, dan mengikuti jalan kerendahan hati dan pengabdiannya. Ia menceritakan dari al-Fudayl ucapannya 'Al-Radi min Allah,' dan dari seorang pemuja dari Bukhara, kisah seorang biksu dalam keadaan yang berubah dan berlalunya kehidupan."
