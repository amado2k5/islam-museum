summary:
  ar: "خالد بن عبد الله المصلح (وُلد 1385هـ/1965م) عالم سعودي وأستاذ الفقه بكلية الشريعة في جامعة القصيم، من أبرز تلاميذ محمد بن صالح العثيمين وملازميه، يفتي في برنامج «يستفتونك» على قناة الرسالة، وله مصنفات في الفقه والعقيدة."
  en: "Khalid ibn Abdullah Al-Musleh (born 1385 AH / 1965 CE) is a Saudi scholar and professor of fiqh at the College of Sharia of Qassim University, a close student and companion of Muhammad ibn Salih Al-Uthaymeen, mufti on Al-Resalah channel's Yastaftunak programme, and author of works on fiqh and creed."
  ur: "خالد بن عبد اللہ المصلح (پیدائش 1385ھ/1965ء) سعودی عالم اور جامعہ قصیم کے کلیہ الشریعہ میں فقہ کے استاد ہیں، محمد بن صالح العثیمین کے قریبی شاگردوں میں سے ہیں اور چینل الرسالہ کے پروگرام «یستفتونک» میں مفتی ہیں۔"
