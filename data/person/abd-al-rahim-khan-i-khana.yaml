  ar: "بطاقة أولية لعبد الرحيم خان خانان بن بيرم خان، القائد المغولي وصاحب خان خانان وأحد أعيان بلاط أكبر وجهانكير ومن أشهر شعراء الهند بالهندية والفارسية، توفي سنة ١٦٢٧م؛ تذكره مصادر التاريخ المغولي ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd al-Rahim Khan-i-Khana, son of Bairam Khan, the Mughal commander holding the rank of Khan-i-Khanan under Akbar and Jahangir and a celebrated Hindi and Persian poet, d. 1627; the Encyclopaedia of Islam entry (vol. 1, pp. 99-100) has been checked and its facts are added."
