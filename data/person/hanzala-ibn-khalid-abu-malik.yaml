label: { ar: "حنظلة بن خالد أبو مالك", en: "Hanzala ibn Khalid, Abu Malik", es: "Hanzala ibn Khalid, Abu Malik", fr: "Hanzala ibn Khalid, Abu Malik" }
summary:
  ar: "حنظلة بن خالد التميمي يكنى أبا مالك من أهل قزوين؛ سعى في أمر دستبى حتى صيّرت كلها إلى قزوين بعد أن كانت مقسومة بين الري وهمذان فسمعه رجل من أهل بلده يقول كورتها وأنا أبو مالك فقال بل أفسدتها وأنت أبو هالك."
  en: "Hanzala ibn Khalid al-Tamimi, Abu Malik of Qazwin; he worked till all of Dastaba — long split between Rayy and Hamadhan — was joined to Qazwin, and hearing a fellow townsman say 'I won it over, I Abu Malik', answered 'rather you ruined it, you Abu Halik (father of ruin)'."
  es: "Hanzala ibn Khalid al-Tamimi, Abu Malik de Qazwin; trabajó hasta que todo Dastaba —dividido durante mucho tiempo entre Rayy y Hamadhan— se unió a Qazwin, y al oír a un vecino decir 'Yo lo conquisté, yo Abu Malik', respondió 'más bien lo arruinaste tú, Abu Halik (padre de la ruina)'."
  fr: "Hanzala ibn Khalid al-Tamimi, Abu Malik de Qazwin; il travailla jusqu'à ce que tout Dastaba — longtemps divisé entre Rayy et Hamadhan — soit rattaché à Qazwin, et entendant un autre habitant dire « Je l'ai conquis, moi Abu Malik », il répondit « plutôt tu l'as ruiné, toi Abu Halik (père de la ruine) »."
