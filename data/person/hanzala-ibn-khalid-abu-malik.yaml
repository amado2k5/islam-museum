summary:
  ar: "حنظلة بن خالد التميمي يكنى أبا مالك من أهل قزوين؛ سعى في أمر دستبى حتى صيّرت كلها إلى قزوين بعد أن كانت مقسومة بين الري وهمذان فسمعه رجل من أهل بلده يقول كورتها وأنا أبو مالك فقال بل أفسدتها وأنت أبو هالك."
  en: "Hanzala ibn Khalid al-Tamimi, Abu Malik of Qazwin; he worked till all of Dastaba — long split between Rayy and Hamadhan — was joined to Qazwin, and hearing a fellow townsman say 'I won it over, I Abu Malik', answered 'rather you ruined it, you Abu Halik (father of ruin)'."
