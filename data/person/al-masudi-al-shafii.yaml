label: { ar: "المسعودي الفقيه الشافعي", en: "al-Mas'udi the jurist" }
summary:
  ar: "أبو عبد الله محمد بن عبد الله بن مسعود بن أحمد المسعودي الفقيه الشافعي؛ إمام فاضل مبرز ورع من أهل مرو، تفقه على أبي عثمان المروزي وشرح «مختصر» المزني وأحسن فيه، وروى قليلاً من الحديث عن أستاذه القفال، وحكى عنه الغزالي في كتاب الوسيط في الأيمان {cite:wafayat-ayan}."
  en: "Abu Abd Allah Muhammad ibn Abd Allah ibn Mas'ud ibn Ahmad al-Mas'udi, the Shafi'i jurist: a learned, outstanding and pious imam from Merv. He studied jurisprudence under Abu Uthman al-Marwazi and wrote a commentary on al-Muzani's Mukhtasar, doing it well; he transmitted a little hadith from his teacher al-Qaffal, and al-Ghazali cited him in the Book of Oaths of al-Wasit {cite:wafayat-ayan}."
