class: person
label: { ar: "أبو نخيلة الشاعر", en: "Abu Nakhayla", fr: "Abu Nakhayla", es: "Abu Nakhayla", ur: "ابو نخائلہ" }
summary:
  ar: "شاعر قال في مسلمة بن عبد الملك أمسلم إني يا ابن كل خليفة ويا فارس الهيجا ويا جبل الأرض شكرتك، فلما دخل على أبي العباس قال فيه لما رأينا استمسكت يداكا كنا أناساً نرهب الملاكا، فكل ما قد قلت في سواكا زور وقد كفر هذا ذاكا، فرضي عنه ووصله وأجازه {cite:muruj-al-dhahab p. 250-251}."
  en: "The panegyrist who repudiated before al-Saffah every earlier praise-poem — 'all I said of others was false' — and was rewarded {cite:muruj-al-dhahab p. 250-251}."
  fr: "Le panégyriste qui renia devant al-Saffah tous ses éloges antérieurs — « tout ce que j'ai dit d'autres était faux » — et fut récompensé {cite:muruj-al-dhahab p. 250-251}."
  es: "El panegirista que repudió ante al-Saffah todos los poemas de alabanza anteriores —«todo lo que dije de los demás era falso»— y fue recompensado {cite:muruj-al-dhahab p. 250-251}."
  ur: "وہ شخص جس نے الصفح سے پہلے ہر پہلے کی تعریفی نظم کی تردید کی تھی - 'میں نے دوسروں کے بارے میں جو کچھ کہا وہ جھوٹا تھا' - اور اسے انعام دیا گیا {حوالہ: مروج الذہب صفحہ۔ 250-251}۔"
  tr: "Bir şair, Müslimîme bin Abdül Malik hakkında şöyle demiştir: “Ey Müslim, ben her halifenin oğluyum, ey savaş meydanının şövalyesi, ey yeryüzünün dağı, sana şükrediyorum.” Ebu el-Abbas’ın yanına girdiğinde onun hakkında şöyle dedi: “Ellerinin sağlam olduğunu görünce, meleklerden korkan insanlar olduk. Bu yüzden başkaları hakkında söylediklerimin hepsi yalandır ve bu da diğerini inkâr etmiştir.” Bunun üzerine ondan memnun kaldı, ona bir hediye verdi ve onu ödüllendirdi. {cite:muruj-al-dhahab s. 250-251}"
  id: "Seorang penyair berkata tentang Muslimah bin Abdul Malik: “Wahai Muslim, aku adalah putra setiap khalifah, wahai ksatria medan perang, wahai gunung bumi, aku berterima kasih kepadamu.” Ketika ia menemui Abu al-Abbas, ia berkata tentangnya: “Ketika kami melihat bahwa tanganmu teguh, kami adalah orang-orang yang takut kepada para malaikat. Maka segala yang kukatakan tentang orang lain adalah salah, dan yang satu ini telah mengingkari yang lain.” Maka Abu al-Abbas merasa senang dengannya, dan memberinya hadiah serta pahala. {kutipan:muruj-al-dhahab hlm. 250-251}"
