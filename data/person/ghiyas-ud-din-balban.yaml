summary:
  ar: "غياث الدين بلبن (1216 – 13 يناير 1287)، تاسع سلاطين دهلي المماليك وأقوى ملوكها، حمل لقب ألغ خان قبل سلطنته. تركي إلبري أسره المغول صبيًّا فاشتراه التتمش سنة 1232 وضمّه إلى الأربعين، فصار نائبًا ووزيرًا للسلطان ناصر الدين محمود ثم اعتلى العرش سنة 1266. حطّم قوة الأربعين، وقضى على ثورة الميواتيين وقطاع طرق الدوآب، وأخضع بنغال سنة 1280، وأعاد بناء قلاع الحدود ضد المغول، وفرض في بلاطه نظرية الملك الظلِّ الإلهي ومراسم السجدة والتقبيل. مات سنة 1287 بعد مقتل ابنه الأكبر محمد على يد المغول."
  en: "Ghiyas ud din Balban (1216 - 13 January 1287) was the ninth sultan of the Mamluk Sultanate of Delhi and its most powerful ruler, bearing the title Ulugh Khan before his kingship. An Ilbari Turk captured by the Mongols as a boy, he was bought by Iltutmish in 1232 and enrolled among the Forty, rose to be deputy and vizier under Sultan Nasiruddin Mahmud, and took the throne in 1266. He broke the power of the Forty, crushed the Mewati rebels and the highwaymen of the Doab, subdued Bengal in 1280, rebuilt the frontier fortresses against the Mongols, and imposed at his court the doctrine of the sultan as the shadow of God, with prostration and foot-kissing. He died in 1287, soon after his eldest son Muhammad was killed fighting the Mongols."
  ur: "غیاث الدین بلبن (1216ء – 13 جنوری 1287ء) دہلی کی مملوک سلطنت کے نویں سلطان اور اس کے سب سے طاقتور حکمران تھے؛ سلطنت سے پہلے ان کا لقب الغ خان تھا۔ ایک ایلبری ترک تھے جنہیں بچپن میں منگولوں نے پکڑا؛ التتمش نے 1232ء میں انھیں خرید کر چہلگانی میں شامل کیا، وہ سلطان ناصر الدین محمود کے نائب و وزیر بنے اور 1266ء میں تخت پر بیٹھے۔ انھوں نے چہلگانی کی طاقت توڑی، میواتی باغیوں اور دوآب کے ڈاکوؤں کو کچلا، 1280ء میں بنگال کو مطیع کیا، منگولوں کے مقابل سرحدی قلعے دوبارہ بنائے، اور دربار میں سلطان کو خدا کا سایہ قرار دینے کا نظریہ اور سجدہ و پابوسی کی رسوم نافذ کیں۔ 1287ء میں اپنے بڑے بیٹے محمد کے منگولوں سے لڑتے ہوئے مارے جانے کے بعد وفات پائی۔"

