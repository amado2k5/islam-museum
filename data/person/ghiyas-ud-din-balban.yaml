summary:
  ar: "غياث الدين بلبن ⁦(1216 – 13 يناير 1287)⁩، تاسع سلاطين دهلي المماليك وأقوى ملوكها، حمل لقب ألغ خان قبل سلطنته. تركي إلبري أسره المغول صبيًّا فاشتراه التتمش سنة 1232 وضمّه إلى الأربعين، فصار نائبًا ووزيرًا للسلطان ناصر الدين محمود ثم اعتلى العرش سنة 1266. حطّم قوة الأربعين، وقضى على ثورة الميواتيين وقطاع طرق الدوآب، وأخضع بنغال سنة 1280، وأعاد بناء قلاع الحدود ضد المغول، وفرض في بلاطه نظرية الملك الظلِّ الإلهي ومراسم السجدة والتقبيل. مات سنة 1287 بعد مقتل ابنه الأكبر محمد على يد المغول."
  en: "Ghiyas ud din Balban (1216 - 13 January 1287) was the ninth sultan of the Mamluk Sultanate of Delhi and its most powerful ruler, bearing the title Ulugh Khan before his kingship. An Ilbari Turk captured by the Mongols as a boy, he was bought by Iltutmish in 1232 and enrolled among the Forty, rose to be deputy and vizier under Sultan Nasiruddin Mahmud, and took the throne in 1266. He broke the power of the Forty, crushed the Mewati rebels and the highwaymen of the Doab, subdued Bengal in 1280, rebuilt the frontier fortresses against the Mongols, and imposed at his court the doctrine of the sultan as the shadow of God, with prostration and foot-kissing. He died in 1287, soon after his eldest son Muhammad was killed fighting the Mongols."
  ur: "غیاث الدین بلبن ⁦(1216ء – 13 جنوری 1287ء)⁩ دہلی کی مملوک سلطنت کے نویں سلطان اور اس کے سب سے طاقتور حکمران تھے؛ سلطنت سے پہلے ان کا لقب الغ خان تھا۔ ایک ایلبری ترک تھے جنہیں بچپن میں منگولوں نے پکڑا؛ التتمش نے 1232ء میں انھیں خرید کر چہلگانی میں شامل کیا، وہ سلطان ناصر الدین محمود کے نائب و وزیر بنے اور 1266ء میں تخت پر بیٹھے۔ انھوں نے چہلگانی کی طاقت توڑی، میواتی باغیوں اور دوآب کے ڈاکوؤں کو کچلا، 1280ء میں بنگال کو مطیع کیا، منگولوں کے مقابل سرحدی قلعے دوبارہ بنائے، اور دربار میں سلطان کو خدا کا سایہ قرار دینے کا نظریہ اور سجدہ و پابوسی کی رسوم نافذ کیں۔ 1287ء میں اپنے بڑے بیٹے محمد کے منگولوں سے لڑتے ہوئے مارے جانے کے بعد وفات پائی۔"
  es: "Ghiyas ud din Balban (1216 - 13 de enero de 1287) fue el noveno sultán del Sultanato Mameluco de Delhi y su gobernante más poderoso, ostentando el título de Ulugh Khan antes de su reinado. De origen turco Ilbari, fue capturado por los mongoles cuando era niño. En 1232, Iltutmish lo compró y lo inscribió entre los Cuarenta. Ascendió a lugarteniente y visir bajo el sultán Nasiruddin Mahmud, y tomó el trono en 1266. Quebró el poder de los Cuarenta, aplastó a los rebeldes Mewati y a los bandoleros del Doab, sometió Bengala en 1280, reconstruyó las fortalezas fronterizas contra los mongoles e impuso en su corte la doctrina del sultán como sombra de Dios, con postraciones y besos a los pies. Murió en 1287, poco después de que su hijo mayor, Muhammad, muriera luchando contra los mongoles."
  fr: "Ghiyas ud din Balban (1216 - 13 janvier 1287) fut le neuvième sultan du sultanat mamelouk de Delhi et son souverain le plus puissant. Avant son accession au trône, il portait le titre d'Ulugh Khan. Turc ilbari capturé par les Mongols dans son enfance, il fut racheté par Iltutmish en 1232 et intégré à la Confrérie des Quarante. Il devint ensuite vice-roi puis vizir sous le sultan Nasiruddin Mahmud, et monta sur le trône en 1266. Il brisa le pouvoir de la Confrérie des Quarante, écrasa les rebelles mewatis et les brigands du Doab, soumit le Bengale en 1280, reconstruisit les forteresses frontalières contre les Mongols et imposa à sa cour la doctrine du sultan comme l'ombre de Dieu, avec prosternation et baisers de pieds. Il mourut en 1287, peu après la mort de son fils aîné, Muhammad, tué au combat contre les Mongols."
  tr: "Delhi'nin dokuzuncu Memlük Sultanı ve en güçlüsü olan Giyath al-Din Balban (1216 – 13 Ocak 1287), hükümdarlığından önce Ulugh Han unvanını taşıyordu. Turki Elbari çocukken Babürler tarafından esir alındı, 1232'de ona al-Tammus satın alındı ve Kırk'a dahil edildi; 1266'da tahta çıkan Sultan Nasiruddin Mahmud'un vekili ve bakanı oldu. Kırkların gücünü ezdi, Mewatis isyanını ve hayvan haydutlarını bastırdı, 1280'de Bengal'i boyun eğdirdi, Babürlere karşı sınır kalelerini yeniden inşa etti ve sarayında kutsal gölge krallığı teorisi ile secde ve öpüşme ritüellerini dayattı. 1287'de en büyük oğlu Muhammed'in Babürler tarafından öldürülmesinden sonra öldü."
  id: "Ghiyath al-Din Balban (1216 – 13 Januari 1287), Sultan Mamluk kesembilan dari Delhi dan terkuatnya, memegang gelar Ulugh Khan sebelum pemerintahannya. Turki Elbari ditangkap oleh Mughal saat masih kecil, yang membelikannya al-Tammus pada tahun 1232 dan memasukkannya ke dalam Empat Puluh, menjadi wakil dan menteri Sultan Nasiruddin Mahmud, lalu naik takhta pada tahun 1266. Ia menghancurkan kekuasaan Empat Puluh, menumpas pemberontakan Mewatis dan para bandit ternak, menaklukkan Bengal pada tahun 1280, membangun kembali benteng perbatasan melawan Mughal, dan memaksakan teori kekuasaan bayangan ilahi serta ritual sujud dan ciuman di istananya. Ia meninggal pada tahun 1287 setelah putra sulungnya Muhammad dibunuh oleh Mughal."

