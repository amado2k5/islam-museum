summary:
  ar: "شيخ صوفي من نسل گيسو دراز، كان مرشد السلطان أبي الحسن قطب شاه، صحبه إلى حيدرآباد وكان له نفوذ في البلاط، وكتب بالأردية مراثي الحسن والحسين {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  en: "Sufi shaykh descended from Gesudaraz, spiritual guide of Sultan Abul Hasan Qutb Shah, who went with him to Hyderabad and wielded influence at court, and wrote marthiyas in Urdu on Hasan and Husain {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  ur: "گیسو دراز کی نسل کے صوفی شیخ، سلطان ابو الحسن قطب شاہ کے مرشد، جو ان کے ساتھ حیدرآباد آئے اور دربار میں اثر رکھتے تھے، اور اردو میں حسن و حسین کے مرثیے لکھے {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}۔"
