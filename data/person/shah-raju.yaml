class: person
label: { ar: "شاه راجو ⁦(الشيخ الصوفي بحيدرآباد)⁩", en: "Shah Raju (Sufi saint of Hyderabad)", ur: "شاہ راجو ⁦(حیدرآباد کے صوفی بزرگ)⁩", es: "Shah Raju (Sufi saint of Hyderabad)", fr: "Shah Raju (Sufi saint of Hyderabad)" }
summary:
  ar: "شيخ صوفي من نسل گيسو دراز، كان مرشد السلطان أبي الحسن قطب شاه، صحبه إلى حيدرآباد وكان له نفوذ في البلاط، وكتب بالأردية مراثي الحسن والحسين {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  en: "Sufi shaykh descended from Gesudaraz, spiritual guide of Sultan Abul Hasan Qutb Shah, who went with him to Hyderabad and wielded influence at court, and wrote marthiyas in Urdu on Hasan and Husain {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  ur: "گیسو دراز کی نسل کے صوفی شیخ، سلطان ابو الحسن قطب شاہ کے مرشد، جو ان کے ساتھ حیدرآباد آئے اور دربار میں اثر رکھتے تھے، اور اردو میں حسن و حسین کے مرثیے لکھے {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}۔"
  es: "El shaykh sufí descendía de Gesudaraz, guía espiritual del sultán Abul Hasan Qutb Shah, quien lo acompañó a Hyderabad y ejerció influencia en la corte, y escribió marthiyas en urdu sobre Hasan y Husain {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  fr: "Cheikh soufi descendant de Gesudaraz, guide spirituel du sultan Abul Hasan Qutb Shah, qui l'accompagna à Hyderabad et exerça une influence à la cour, et écrivit des marthiyas en ourdou sur Hasan et Husain {cite:zebrowski-deccani-painting-1983 p. 186} {cite:zebrowski-deccani-painting-1983 p. 188}."
  tr: "Gisu Daraz soyundan bir Sufi şeyhi olan Swen, Sultan Ebu el-Hasan Kutb Şah'ın manevi rehberiydi, ona Haydarabad'a eşlik etti, sarayda etkili oldu ve Urduca olarak Hasan ve Hüseyin ağıtlarını yazdı {cite:zebrowski-deccani-painting-1983 s. 186} {cite:zebrowski-deccani-painting-1983 s. 188}."
  id: "Seorang sheikh Sufi dari garis keturunan Gisu Daraz, ia menjadi pembimbing spiritual Sultan Abu al-Hasan Qutb Shah, menemaninya ke Hyderabad, memiliki pengaruh di istana, dan menulis elegi tentang Hasan dan Husayn dalam bahasa Urdu {cite:zebrowski-deccani-painting-1983 hlm. 186} {cite:zebrowski-deccani-painting-1983 hlm. 188}."
