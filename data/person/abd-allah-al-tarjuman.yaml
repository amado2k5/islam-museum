summary:
  ar: "بطاقة أولية لعبد الله الترجمان، الكاتب الميورقي المعروف قبل إسلامه بأنسلم تورميدا، صاحب «تحفة الأريب في الرد على أهل الصليب»، توفي سنة ١٤٣٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd Allah al-Turjuman, the Mallorcan writer known before his conversion as Anselm Turmeda, author of Tuhfat al-Arib, d. 1432; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar para Abd Allah al-Turjuman, el escritor mallorquín conocido antes de su conversión como Anselm Turmeda, autor de Tuhfat al-Arib, fallecido en 1432; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Abd Allah al-Turjuman, l'écrivain majorquin connu avant sa conversion sous le nom d'Anselm Turmeda, auteur de Tuhfat al-Arib, mort en 1432; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عبد اللہ الترجمن کے لیے ڈرافٹ کارڈ، میلورکن کے مصنف، جو اپنی تبدیلی سے قبل انسلم ترمیڈا کے نام سے جانا جاتا تھا، تحفۃ العریب کے مصنف، ڈی۔ 1432; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "İslamiyetine geçmeden önce Anselm Turmeda olarak bilinen Mayorkalı yazar Abdullah el-Tarjuman'ın ön profili; 1432 yılında vefat eden yazarın \"Tuhfat al-Arib fi al-Radd ala Ahl al-Salib\" (Haçlıları Çürütmede Bilginin Armağanı) adlı eseri bulunmaktadır; biyografik sözlüklerde adı geçmektedir ve biyografisi bu sayfada henüz incelenmemiştir."
  id: "Profil pendahuluan Abdullah al-Tarjuman, penulis asal Mallorca yang sebelum masuk Islam dikenal sebagai Anselm Turmeda, penulis \"Tuhfat al-Arib fi al-Radd ala Ahl al-Salib\" (Karunia Orang Terpelajar dalam Membantah Kaum Salib), yang meninggal pada tahun 1432 M; ia disebutkan dalam kamus biografi, dan biografinya belum diulas di halaman ini."
