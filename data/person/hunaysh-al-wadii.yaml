summary:
  ar: رجل من وادعة بنجران، أخذ مع جماعة من عشيرته مال عمال الهادي وقتل رجلاً سنة 285هـ، فقطع الهادي نخله، ومات بعد يومين بحسب الراوي.
  en: A man of Wadi'a at Najran who with a band of his clan took the money of al-Hadi's agents and killed a man in 285 AH; al-Hadi had his palms cut, and he died two days later according to the narrator.
  ur: نجران میں وادعہ کا ایک شخص جس نے اپنے قبیلے کی جماعت کے ساتھ 285ھ میں ہادی کے کارندوں کا مال لیا اور ایک آدمی قتل کیا؛ ہادی نے اس کے کھجور کٹوائے، اور راوی کے مطابق دو دن بعد وہ مر گیا۔
