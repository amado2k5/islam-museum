class: person
label:
  ar: حنيش الوادعي
  en: Hunaysh al-Wadi'i
  ur: حنیش وادعی
  es: "Hunaysh al-Wadi'i"
  fr: "Hunaysh al-Wadi'i"
summary:
  ar: رجل من وادعة بنجران، أخذ مع جماعة من عشيرته مال عمال الهادي وقتل رجلاً سنة 285هـ، فقطع الهادي نخله، ومات بعد يومين بحسب الراوي.
  en: A man of Wadi'a at Najran who with a band of his clan took the money of al-Hadi's agents and killed a man in 285 AH; al-Hadi had his palms cut, and he died two days later according to the narrator.
  ur: نجران میں وادعہ کا ایک شخص جس نے اپنے قبیلے کی جماعت کے ساتھ 285ھ میں ہادی کے کارندوں کا مال لیا اور ایک آدمی قتل کیا؛ ہادی نے اس کے کھجور کٹوائے، اور راوی کے مطابق دو دن بعد وہ مر گیا۔
  es: "Un hombre de Wadi'a, en Najran, que junto con un grupo de su clan robó el dinero de los agentes de al-Hadi y mató a un hombre en el año 285 de la Hégira, sufrió un corte en las palmas de las manos de al-Hadi, y murió dos días después, según el narrador."
  fr: "Un homme de Wadi'a à Najran qui, avec une bande de son clan, prit l'argent des agents d'al-Hadi et tua un homme en 285 AH; al-Hadi lui fit couper les paumes, et il mourut deux jours plus tard selon le narrateur."
