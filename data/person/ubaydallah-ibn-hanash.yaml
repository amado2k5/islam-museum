summary:
  ar: "رجل من صنعاء رأى رجوع الجند من شبام فأخبر علي بن سليمان أن الخبر قبيح وأن خروجه خير، فخرج مع أحمد بن حرنود إلى الدعام بن إبراهيم يستنهضانه إلى الهادي سنة 288هـ."
  en: "A man of Sana'a who, seeing the troops return from Shibam, told Ali ibn Sulayman the news was bad and that his leaving was better, and who went with Ahmad ibn Harnud to al-Da'am ibn Ibrahim to rouse him to al-Hadi in 288 AH."
  ur: "صنعاء کا ایک شخص جس نے شبام سے سپاہیوں کو لوٹتے دیکھا تو علی بن سلیمان سے کہا کہ خبر بری ہے اور ان کا جانا بہتر ہے، اور جو احمد بن حرنود کے ساتھ دعام بن ابراہیم کے پاس گیا کہ اسے سنہ 288ھ میں ہادی کی طرف اٹھائے۔"
