id: person/ubaydallah-ibn-hanash
class: person
label:
  ar: "عبيد الله بن حنش"
  en: "Ubaydallah ibn Hanash"
  ur: "عبید اللہ بن حنش"
  es: "Ubaydallah ibn Hanash"
  fr: "Ubaydallah ibn Hanash"
summary:
  ar: "رجل من صنعاء رأى رجوع الجند من شبام فأخبر علي بن سليمان أن الخبر قبيح وأن خروجه خير، فخرج مع أحمد بن حرنود إلى الدعام بن إبراهيم يستنهضانه إلى الهادي سنة 288هـ."
  en: "A man of Sana'a who, seeing the troops return from Shibam, told Ali ibn Sulayman the news was bad and that his leaving was better, and who went with Ahmad ibn Harnud to al-Da'am ibn Ibrahim to rouse him to al-Hadi in 288 AH."
  ur: "صنعاء کا ایک شخص جس نے شبام سے سپاہیوں کو لوٹتے دیکھا تو علی بن سلیمان سے کہا کہ خبر بری ہے اور ان کا جانا بہتر ہے، اور جو احمد بن حرنود کے ساتھ دعام بن ابراہیم کے پاس گیا کہ اسے سنہ 288ھ میں ہادی کی طرف اٹھائے۔"
  es: "Un hombre de Sana'a que, al ver regresar a las tropas de Shibam, le dijo a Ali ibn Sulayman que las noticias eran malas y que su partida era mejor, y que fue con Ahmad ibn Harnud a ver a al-Da'am ibn Ibrahim para animarlo a ir a al-Hadi en el año 288 de la Hégira."
  fr: "Un homme de Sana'a qui, voyant les troupes revenir de Shibam, dit à Ali ibn Sulayman que les nouvelles étaient mauvaises et que son départ était préférable, et qui alla avec Ahmad ibn Harnud à al-Da'am ibn Ibrahim pour le convaincre de rejoindre al-Hadi en 288 AH."
  tr: "Sana'a'dan bir adam, Şibab'dan askerlerin dönüşünü gördü ve Ali bin Süleyman'a haberin kötü olduğunu, ayrılışının iyi olduğunu söyledi. 288 Hicri yılında Ahmed ibn Harnud'la birlikte El-Da'bin İbrahim'e gitti."
  id: "Seorang pria dari Sana'a melihat kembalinya para prajurit dari Shibam dan memberitahu Ali ibn Sulayman bahwa kabar itu buruk dan kepergiannya baik. Ia pergi bersama Ahmad ibn Harnud ke Al-Da'am ibn Ibrahim untuk membangunkannya kepada Al-Hadi pada tahun 288 H."
