summary:
  ar: "آزاد موبين (وُلد سنة 1953) طبيب ورجل أعمال هندي في مجال الرعاية الصحية من كالباكانشيري بولاية كيرالا، مؤسس مجموعة أستر دي إم للرعاية الصحية ورئيس مجلس إدارتها ومديرها العام، وهي المجموعة التي بدأها بعيادة طبيب واحد في دبي سنة 1987 وبناها لتصبح من أكبر مقدمي الرعاية الصحية الخاصة في الخليج والهند. نال وسام برافاسي بهاراتيا سامان سنة 2010 ووسام بادما شري سنة 2011."
  en: "Azad Moopen (born 1953) is an Indian physician and healthcare entrepreneur from Kalpakanchery in Kerala, founder and chairman of Aster DM Healthcare, the Dubai-based group he began with a single-doctor clinic in 1987 and built into one of the largest private healthcare providers in the Gulf and India. He received the Pravasi Bharatiya Samman in 2010 and the Padma Shri in 2011."
  ur: "آزاد موپن (پیدائش 1953) کیرالا کے کلپاکانچری سے تعلق رکھنے والے بھارتی معالج اور صحت کے شعبے کے کاروباری ہیں، آستر ڈی ایم ہیلتھ کیئر کے بانی، چیئرمین و منیجنگ ڈائریکٹر، جس کا آغاز انھوں نے 1987 میں دبئی میں ایک ڈاکٹر کی کلینک سے کیا اور اسے خلیج و بھارت کے نجی صحت کے سب سے بڑے اداروں میں سے ایک بنایا۔ انھیں 2010 میں پرواسی بھارتیا سمان اور 2011 میں پدم شری ملا۔"
