summary:
  ar: "آزاد موبين ⁦(وُلد سنة 1953)⁩ طبيب ورجل أعمال هندي في مجال الرعاية الصحية من كالباكانشيري بولاية كيرالا، مؤسس مجموعة أستر دي إم للرعاية الصحية ورئيس مجلس إدارتها ومديرها العام، وهي المجموعة التي بدأها بعيادة طبيب واحد في دبي سنة 1987 وبناها لتصبح من أكبر مقدمي الرعاية الصحية الخاصة في الخليج والهند. نال وسام برافاسي بهاراتيا سامان سنة 2010 ووسام بادما شري سنة 2011."
  en: "Azad Moopen (born 1953) is an Indian physician and healthcare entrepreneur from Kalpakanchery in Kerala, founder and chairman of Aster DM Healthcare, the Dubai-based group he began with a single-doctor clinic in 1987 and built into one of the largest private healthcare providers in the Gulf and India. He received the Pravasi Bharatiya Samman in 2010 and the Padma Shri in 2011."
  ur: "آزاد موپن ⁦(پیدائش 1953)⁩ کیرالا کے کلپاکانچری سے تعلق رکھنے والے بھارتی معالج اور صحت کے شعبے کے کاروباری ہیں، آستر ڈی ایم ہیلتھ کیئر کے بانی، چیئرمین و منیجنگ ڈائریکٹر، جس کا آغاز انھوں نے 1987 میں دبئی میں ایک ڈاکٹر کی کلینک سے کیا اور اسے خلیج و بھارت کے نجی صحت کے سب سے بڑے اداروں میں سے ایک بنایا۔ انھیں 2010 میں پرواسی بھارتیا سمان اور 2011 میں پدم شری ملا۔"
  es: "Azad Moopen (nacido en 1953) es un médico y empresario del sector sanitario indio originario de Kalpakanchery, en Kerala. Es fundador y presidente de Aster DM Healthcare, el grupo con sede en Dubái que inició con una clínica unipersonal en 1987 y que convirtió en uno de los mayores proveedores privados de atención médica del Golfo Pérsico e India. Recibió el premio Pravasi Bharatiya Samman en 2010 y el Padma Shri en 2011."
  fr: "Azad Moopen (né en 1953) est un médecin et entrepreneur indien du secteur de la santé, originaire de Kalpakanchery, au Kerala. Il est le fondateur et président d'Aster DM Healthcare, un groupe basé à Dubaï qu'il a créé en 1987 avec un seul cabinet médical et qu'il a développé pour en faire l'un des plus importants prestataires de soins de santé privés du Golfe et de l'Inde. Il a reçu le Pravasi Bharatiya Samman en 2010 et le Padma Shri en 2011."
  tr: "Azad Mobin (1953 doğumlu), Kalpakancherry, Kerala'dan Hintli bir hekim ve sağlık iş insanıdır; Aster DM Healthcare Group'un kurucusu, başkanı ve genel müdürüdür. Bu grup, 1987'de Dubai'de tek doktorlu bir klinikle başladı ve Körfez ve Hindistan'daki en büyük özel sağlık hizmeti sağlayıcılarından biri haline getirdi. 2010 yılında Pravasi Bharatiya Saman Madalyası'nı, 2011'de ise Padma Shri Madalyası'nı aldı."
  id: "Azad Mobin (lahir 1953) adalah seorang dokter dan pengusaha kesehatan asal India dari Kalpakancherry, Kerala, pendiri, ketua, dan manajer umum Aster DM Healthcare Group. Kelompok ini memulai dengan klinik satu dokter di Dubai pada tahun 1987 dan berkembang menjadi salah satu penyedia layanan kesehatan swasta terbesar di Teluk dan India. Ia menerima Medali Pravasi Bharatiya Saman pada tahun 2010 dan Medali Padma Shri pada tahun 2011."
