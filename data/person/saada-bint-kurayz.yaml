summary:
  en: "A soothsayer and poetess of the Banu Abd Shams — Uthman ibn Affan's maternal aunt — who foretold to Uthman the marriage of Ruqayya to the Prophet, and who composed verses on his Islam and marriage; al-Isaba and Ibn Abd al-Hadi's al-Iqd record her account."
  ar: "كاهنة من كاهنات العرب وشاعرة من شواعرهم، خالة عثمان بن عفان؛ حدث عنها عثمان أنها تكهنت لقومها، فلما سمع عن زواج رقية بابن عبد المطلب أخبرته بأنها ستتزوج محمداً، وأنشدت أبياتاً في إسلامه وزواجه، وذكرها ابن حجر في الإصابة وابن عبد الهادي في العقد التام."
  es: "Una adivina y poetisa de los Banu Abd Shams —tía materna de Uthman ibn Affan— que predijo a Uthman el matrimonio de Ruqayya con el Profeta, y que compuso versos sobre su Islam y su matrimonio; al-Isaba y al-Iqd de Ibn Abd al-Hadi recogen su relato."
  fr: "Une voyante et poétesse des Banu Abd Shams — la tante maternelle d'Uthman ibn Affan — qui prédit à Uthman le mariage de Ruqayya avec le Prophète, et qui composa des vers sur son islam et son mariage; al-Isaba et al-Iqd d'Ibn Abd al-Hadi rapportent son récit."
