summary:
  en: "A soothsayer and poetess of the Banu Abd Shams — Uthman ibn Affan's maternal aunt — who foretold to Uthman the marriage of Ruqayya to the Prophet, and who composed verses on his Islam and marriage; al-Isaba and Ibn Abd al-Hadi's al-Iqd record her account."
  ar: "كاهنة من كاهنات العرب وشاعرة من شواعرهم، خالة عثمان بن عفان؛ حدث عنها عثمان أنها تكهنت لقومها، فلما سمع عن زواج رقية بابن عبد المطلب أخبرته بأنها ستتزوج محمداً، وأنشدت أبياتاً في إسلامه وزواجه، وذكرها ابن حجر في الإصابة وابن عبد الهادي في العقد التام."
