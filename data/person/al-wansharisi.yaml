summary:
  ar: "بطاقة أولية لأحمد بن يحيى الونشريسي، فقيه المالكية في فاس صاحب «المعيار» في فتاوى المغرب والأندلس، توفي سنة ١٥٠٨م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ahmad ibn Yahya al-Wansharisi, the Maliki jurist of Fez author of al-Mi'yar on the fatwas of the Maghreb and al-Andalus, d. 1508; the biographical entry is not yet checked on the page."
  fr: "Projet de carte pour Ahmad ibn Yahya al-Wansharisi, le juriste malékite de Fès auteur d'al-Mi'yar sur les fatwas du Maghreb et d'al-Andalus, décédé en 1508 ; l'entrée biographique n'est pas encore vérifiée sur la page."
  es: "Ficha preliminar de Ahmad ibn Yahya al-Wansharisi, jurista malikí de Fez, autor de al-Mi'yar sobre las fatuas del Magreb y al-Ándalus, fallecido en 1508; la entrada biográfica aún no ha sido verificada en la página."
  ur: "مغرب اور الاندلس کے فتاویٰ پر المیار کے مصنف فیز کے مالکی فقیہ احمد بن یحییٰ الونشرسی کے لیے مسودہ کارڈ۔ 1508; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
