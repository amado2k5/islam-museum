  stance:
    ar: 'رواية الشعبي عند الحاكم أبي أحمد: أسلم بمكة بعد أداء الودائع ثم قدم مهاجراً'
  summary:
    ar: 'أخرج الحاكم أبو أحمد بسند صحيح عن الشعبي أن زينب هاجرت وأبو العاص على دينه فخرج إلى الشام في تجارة، فلما قرب من المدينة أراد بعض المسلمين أن يأخذوا ما معه فبلغ ذلك زينب فأجارته، فقال له أصحاب رسول الله: هل لك أن تسلم فتغتنم ما معك، قال:
      «بئسما أمرتموني به أن أنسخ ديني بغدرة»، فمضى حتى قدم مكة فدفع إلى كل ذي حق حقه ثم شهد الشهادتين وقدم المدينة مهاجراً فدفع إليه النبي زوجته بالنكاح الأول.'
