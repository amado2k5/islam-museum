summary:
  ar: ابن هالة بنت خويلد أخت خديجة، لقبه «جرو البطحاء» ويقال له «الأمين»؛ زوج زينب بنت النبي الكبرى، شهد بدراً مع المشركين وأُسر ففادته زينب، ثم أسلم بعد الهجرة وردّ النبي إليه ابنته؛ وتختلف الروايات في كيفية أسره الثاني وإسلامه.
  en: A son of Hala bint Khuwaylid, Khadija's sister, nicknamed 'the cub of al-Batha' and called 'the trustworthy'; husband of the Prophet's eldest daughter Zaynab, he fought at Badr with the polytheists and was captured, Zaynab ransomed him,
    then he embraced Islam after the Hijra and the Prophet returned his daughter to him; the reports differ on how he was captured the second time and became Muslim.
