id: person/abu-al-as-ibn-al-rabi
education:
  did_you_know:
    ar: "أبو العاص بن الربيع زوج زينب بنت النبي الكبرى، كان يُلقّب «الأمين»؛ أُسر يوم بدر ففادته زينب ثم أسلم وردّ النبي إليه ابنته."
    en: "Abu al-As ibn al-Rabi', husband of the Prophet's eldest daughter Zaynab, was called 'the Trustworthy'; captured at Badr, ransomed by Zaynab, he later embraced Islam and the Prophet restored his daughter to him."
    ur: "ابو العاص بن ربیع، نبی کی بڑی بیٹی زینب کے شوہر، «امین» کہلاتے تھے؛ بدر میں قید ہوئے، زینب نے ان کا فدیہ دیا، بعد میں مسلمان ہوئے اور نبی نے ان کی بیٹی واپس کی۔"
    sources: [source/ibn-hajar-isaba, source/mubarakpuri-raheeq]
