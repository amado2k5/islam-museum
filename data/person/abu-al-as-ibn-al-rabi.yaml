summary:
  ar: ابن هالة بنت خويلد أخت خديجة، لقبه «جرو البطحاء» ويقال له «الأمين»؛ زوج زينب بنت النبي الكبرى، شهد بدراً مع المشركين وأُسر ففادته زينب، ثم أسلم بعد الهجرة وردّ النبي إليه ابنته؛ وتختلف الروايات في كيفية أسره الثاني وإسلامه.
  en: A son of Hala bint Khuwaylid, Khadija's sister, nicknamed 'the cub of al-Batha' and called 'the trustworthy'; husband of the Prophet's eldest daughter Zaynab, he fought at Badr with the polytheists and was captured, Zaynab ransomed him,
    then he embraced Islam after the Hijra and the Prophet returned his daughter to him; the reports differ on how he was captured the second time and became Muslim.
  ur: "ہالہ بنت خویلد — خدیجہ کی بہن — کے فرزند، «بطحاء کا شیر» اور «امین» کہلائے؛ نبی کی بڑی بیٹی زینب کے شوہر۔"
  fr: "Fils de Hala bint Khuwaylid, sœur de Khadija, surnommé « le lionceau d'al-Batha » et appelé « le digne de confiance » ; époux de Zaynab, fille aînée du Prophète, il combattit à Badr avec les polythéistes et fut capturé, Zaynab le racheta, puis il embrassa l'islam après l'Hégire et le Prophète lui rendit sa fille ; les récits divergent sur la manière dont il fut capturé la seconde fois et devint musulman."
  es: "Hijo de Hala bint Khuwaylid, hermana de Khadija, apodado \"el cachorro de al-Batha\" y llamado \"el digno de confianza\"; esposo de Zaynab, la hija mayor del Profeta, luchó en Badr con los politeístas y fue capturado. Zaynab pagó un rescate por él, luego abrazó el Islam después de la Hégira y el Profeta le devolvió a su hija. Los relatos difieren sobre cómo fue capturado por segunda vez y se convirtió al Islam."
  tr: "Hz. Hatice'nin kız kardeşi İbn Hala bint Huveylid, \"Cerve el-Bat'ha\" ve \"el-Emin\" lakaplarıyla da anılır; Peygamberin en büyük kızı Zeynep'in kocasıdır. Bedir Savaşı'na müşriklerle birlikte şahit olmuş ve esir alınmıştır. Zeynep onu fidye karşılığında kurtarmış, hicretten sonra İslam'ı kabul etmiş ve Peygamber kızını ona geri vermiştir. İkinci kez nasıl esir alındığı ve İslam'ı nasıl kabul ettiği konusunda ise rivayetler farklılık göstermektedir."
  id: "Ibn Hala bint Khuwaylid, saudara perempuan Khadija, yang dijuluki “Jarw al-Bat’ha” dan juga disebut “al-Amin”; suami Zaynab, putri sulung Nabi, menyaksikan Perang Badar bersama kaum musyrik dan ditawan, sehingga Zaynab menebusnya, kemudian ia masuk Islam setelah hijrah dan Nabi mengembalikan putrinya kepadanya; dan riwayatnya berbeda mengenai bagaimana ia ditawan untuk kedua kalinya dan masuk Islam."
