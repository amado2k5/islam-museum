summary:
  ar: "أرستقراطي بريطاني (1876-1939)، البارونيت الخامس، ورث لقبي أبيه سنة 1915 واعتنق الإسلام في 20 كانون الأول 1923 فعُرف بالسير عبد الله هاملتون؛ نقلت مجلة بعثة ووكينغ «الإسلامية ريفيو» خبر إسلامه، ودُفن في مقبرة بروكوود بجانب اللورد هيدلي."
  en: "British aristocrat (1876-1939), 5th Baronet, who inherited his father's two baronetcies in 1915 and converted to Islam on 20 December 1923, being known thereafter as Sir Abdullah Hamilton; his conversion was noticed in the Woking mission's Islamic Review, and he was buried at Brookwood beside Lord Headley."
  ur: "برطانوی رئیس ⁦(1876ء–1939ء)⁩، پانچویں بیرونٹ، جنہوں نے 1915ء میں والد کی دو بیرونٹیاں ورثے میں پائیں اور 20 دسمبر 1923ء کو اسلام قبول کیا، جس کے بعد وہ سر عبداللہ ہیملٹن کے نام سے جانے گئے؛ ان کے قبولِ اسلام کی خبر ووکنگ مشن کے «اسلامک ریویو» میں شائع ہوئی، اور وہ بروک وڈ میں لارڈ ہیڈلے کے پہلو میں دفن ہوئے۔"
  es: "Aristócrata británico (1876-1939), quinto baronet, que heredó los dos títulos de baronet de su padre en 1915 y se convirtió al islam el 20 de diciembre de 1923, siendo conocido a partir de entonces como Sir Abdullah Hamilton; su conversión fue reseñada en la Revista Islámica de la misión de Woking, y fue enterrado en Brookwood junto a Lord Headley."
  fr: "Aristocrate britannique (1876-1939), 5e baronnet, qui hérita des deux titres de baronnet de son père en 1915 et se convertit à l'islam le 20 décembre 1923, étant connu par la suite sous le nom de Sir Abdullah Hamilton; sa conversion fut remarquée dans la revue islamique de la mission de Woking, et il fut enterré à Brookwood à côté de Lord Headley."
  tr: "Bir İngiliz aristokrat (1876-1939), beşinci Baronet, 1915'te babasının unvanlarını miras aldı ve 20 Aralık 1923'te İslam'a geçti, Sir Abdullah Hamilton olarak tanındı; Woking Mission dergisi 'Islamic Review' onun İslam'a geçişini bildirdi ve Lord Headley'nin yanına Brookwood Mezarlığı'na defnedildi."
  id: "Seorang bangsawan Inggris (1876-1939), Baronet kelima, mewarisi gelar ayahnya pada tahun 1915 dan memeluk Islam pada 20 Desember 1923, dikenal sebagai Sir Abdullah Hamilton; majalah Misi Woking 'Islamic Review' melaporkan konversinya ke Islam, dan ia dimakamkan di Pemakaman Brookwood di sebelah Lord Headley."
