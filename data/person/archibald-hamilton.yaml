summary:
  ar: "أرستقراطي بريطاني (1876-1939)، البارونيت الخامس، ورث لقبي أبيه سنة 1915 واعتنق الإسلام في 20 كانون الأول 1923 فعُرف بالسير عبد الله هاملتون؛ نقلت مجلة بعثة ووكينغ «الإسلامية ريفيو» خبر إسلامه، ودُفن في مقبرة بروكوود بجانب اللورد هيدلي."
  en: "British aristocrat (1876-1939), 5th Baronet, who inherited his father's two baronetcies in 1915 and converted to Islam on 20 December 1923, being known thereafter as Sir Abdullah Hamilton; his conversion was noticed in the Woking mission's Islamic Review, and he was buried at Brookwood beside Lord Headley."
  ur: "برطانوی رئیس (1876ء–1939ء)، پانچویں بیرونٹ، جنہوں نے 1915ء میں والد کی دو بیرونٹیاں ورثے میں پائیں اور 20 دسمبر 1923ء کو اسلام قبول کیا، جس کے بعد وہ سر عبداللہ ہیملٹن کے نام سے جانے گئے؛ ان کے قبولِ اسلام کی خبر ووکنگ مشن کے «اسلامک ریویو» میں شائع ہوئی، اور وہ بروک وڈ میں لارڈ ہیڈلے کے پہلو میں دفن ہوئے۔"
