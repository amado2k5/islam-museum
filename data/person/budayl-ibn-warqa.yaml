gender: male
roles: [tribal-leader]
summary:
  en: "A Khuza'i leader of the truce years: he sheltered the driven-in Khuza'a in his house, led their complaint delegation to Medina, met Abu Sufyan at Usfan while concealing his own visit, and scouted the Muslim army with him at Marr al-Zahran — where he slipped away to warn the Prophet. As 'Budayl ibn Umm Asram' he answered al-Akhzar's war poem."
  ar: "سيد خزاعي في سنين الهدنة: آوى خزاعة المحزوة في داره، وقدم المدينة في نفر يخبرون النبي بمظاهرة قريش بني بكر، ولقي أبا سفيان بعسفان فكتم خبره، وتجسس معه الجيش بمر الظهران ثم أفلت فأخبر النبي بعددهم. وبنسبته «بديل بن أم أصرم» أجاب شعر الأخزر بن لعط. واستشهد ابناه عبد الله وعبد الرحمن بصفين في خلق من خزاعة، وقيل إن أبيات أضربهم ولا أرى معاوية الأخزر العين العظيم الجاوية لبديل قالها في ذلك اليوم {cite:muruj-al-dhahab p. 675-677}"
