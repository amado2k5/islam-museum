summary:
  en: "A Khuza'i leader of the truce years: he sheltered the driven-in Khuza'a in his house, led their complaint delegation to Medina, met Abu Sufyan at Usfan while concealing his own visit, and scouted the Muslim army with him at Marr al-Zahran — where he slipped away to warn the Prophet. As 'Budayl ibn Umm Asram' he answered al-Akhzar's war poem."
  ar: "سيد خزاعي في سنين الهدنة: آوى خزاعة المحزوة في داره، وقدم المدينة في نفر يخبرون النبي بمظاهرة قريش بني بكر، ولقي أبا سفيان بعسفان فكتم خبره، وتجسس معه الجيش بمر الظهران ثم أفلت فأخبر النبي بعددهم. وبنسبته «بديل بن أم أصرم» أجاب شعر الأخزر بن لعط. واستشهد ابناه عبد الله وعبد الرحمن بصفين في خلق من خزاعة، وقيل إن أبيات أضربهم ولا أرى معاوية الأخزر العين العظيم الجاوية لبديل قالها في ذلك اليوم {cite:muruj-al-dhahab p. 675-677}"
  es: "Un líder khuzaí de los años de la tregua: dio refugio en su casa a los khuzaíes expulsados, encabezó su delegación de quejas a Medina, se reunió con Abu Sufyan en Usfan ocultando su propia visita y exploró con él al ejército musulmán en Marr al-Zahran, donde se escabulló para advertir al Profeta. Como Budayl ibn Umm Asram, respondió al poema de guerra de al-Akhzar."
  fr: "Un chef khuza'i durant les années de trêve: il abrita chez lui les khuza'a chassés du pays, mena leur délégation de protestation à Médine, rencontra Abou Soufyan à Usfan tout en dissimulant sa propre visite, et l'accompagna en reconnaissance dans l'armée musulmane à Marr al-Zahran – d'où il s'éclipsa pour avertir le Prophète. Sous le nom de « Budayl ibn Umm Asram », il répondit au poème de guerre d'al-Akhzar."
  ur: "جنگ بندی کے سالوں کا ایک خزاعی رہنما: اس نے خزاعہ میں محصور افراد کو اپنے گھر میں پناہ دی، ان کے شکایتی وفد کی قیادت میں مدینہ منورہ گیا، اپنے دورے کو چھپاتے ہوئے عسفان کے مقام پر ابو سفیان سے ملاقات کی، اور مر الزہران میں اس کے ساتھ مسلم فوج کو اسکاؤٹ کیا - جہاں وہ رسول اللہ کو تنبیہ کرنے کے لیے وہاں سے کھسک گیا۔ بطور 'بدیل بن ام اسرم' اس نے الاخضر کی جنگی نظم کا جواب دیا۔"
  tr: "Seyyid Huza'i, ateşkes yıllarında: Huza'ah, El-Mahzve'yi evinde barındırdı, Medine'ye bir grupla birlikte Peygamber'e Kureyş Banu Bekir'in gösterisini bildirdi, Ebu Sufyan ile Asfan ile buluştu, haberini gizledi ve ordu onunla birlikte Dhahran üzerinden casusluk yaptı, sonra kaçtı ve Peygamber'e sayılarını bildirdi. Soyu 'Badil ibn um Asram' olarak soyunca, El-Akhzar bin La'at'ın şiirlerine yanıt verdi. İki oğlu Abdullah ve Abdülrahman, Huza'a toplantısında Sifin'de şehit edildi. Söylenen ayetler, o gün büyük Cava gözü Badal'ın okuduğu gibi Muaviye el-Akhzar'ı görmüyorum {atıf: Muruj-al-Dhahab, s. 675-677}"
  id: "Sayyid Khuza'i selama masa gencatan senjata: Khuza'ah melindungi Al-Mahzwah di rumahnya, tiba di Madinah bersama sekelompok orang yang memberitahu Nabi tentang demonstrasi Quraysh Banu Bakr, bertemu Abu Sufyan dengan Asfan, menyembunyikan kabarnya, dan pasukan memata-matai bersamanya melalui Dhahran, lalu melarikan diri, dan memberitahu Nabi tentang jumlah mereka. Mengenai garis keturunannya sebagai 'Badil ibn um Asram,' ia menanggapi puisi Al-Akhzar ibn La'at. Kedua putranya, Abdullah dan Abdul Rahman, gugur di Siffin saat pertemuan Khuza'ah. Konon ayat-ayat yang saya sampaikan, dan saya tidak melihat Muawiya Al-Akhzar sebagai mata Jawa agung Badal yang dibacakan pada hari itu {cite:muruj-al-dhahab, hlm. 675-677}"
