  id: "Amr ibn Ilyas ibn Mudar, yang merupakan Mudraka, adalah saudara dari Tabikha dan Qama'a dari Khandaf, dari mana asal-usul Kinana ibn Khuzaymah ibn Mudrikah, dalam garis keturunan Nabi {cite:muruj-al-dhahab, hlm. 567}."
