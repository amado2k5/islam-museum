label:
  ar: منسا سليمان
  en: Mansa Sulayman
  es: "Mansa Sulayman"
  fr: "Mansa Sulayman"
  ur: "منسا سلیمان"
summary:
  ar: منسا سليمان بن أبي بكر، أخو منسا موسى وخلفه في ملك مالي بعد ابنه منسا مغا، ملك أربعاً وعشرين سنة فثبت ملكه واتسعت به حدود مملكة مالي.
  en: Mansa Sulayman ibn Abi Bakr, brother of Mansa Musa and his successor after Mansa Magha; he ruled Mali for twenty-four years, consolidating the empire his brother had raised.
  es: "Mansa Sulayman ibn Abi Bakr, hermano de Mansa Musa y su sucesor tras Mansa Magha, gobernó Malí durante veinticuatro años, consolidando el imperio que su hermano había creado."
  fr: "Mansa Sulayman ibn Abi Bakr, frère de Mansa Musa et son successeur après Mansa Magha; il régna sur le Mali pendant vingt-quatre ans, consolidant l'empire que son frère avait bâti."
  ur: "منسا سلیمان ابن ابی بکر، منسا موسیٰ کے بھائی اور منصہ ماگھ کے بعد ان کے جانشین؛ اس نے چوبیس سال تک مالی پر حکومت کی، اس سلطنت کو مضبوط کیا جو اس کے بھائی نے قائم کی تھی۔"
  tr: "Mansa Musa'nın kardeşi Mansa Sulayman ibn Abi Bakr, oğlu Mansa Magha'dan sonra Mali kralı oldu. Yirmi dört yıl hüküm sürerek hüküm sürdü ve böylece Mali Krallığı'nın sınırlarını genişletti."
  id: "Mansa Sulayman ibn Abi Bakr, saudara Mansa Musa, menggantikannya sebagai raja Mali setelah putranya Mansa Magha. Ia memerintah selama dua puluh empat tahun, sehingga menegaskan kekuasaannya dan memperluas batas Kerajaan Mali."
