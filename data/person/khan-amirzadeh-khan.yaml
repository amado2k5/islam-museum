summary:
  ar: "محامٍ وسياسي پشتوني باكستاني (1918–1977) من بخښالي في مردان. عضو في حركة خداي خدمتغار منذ شبابه، ثم قيادي في حزب العوامي الوطني، فاز بمقعدي الجمعية الوطنية وجمعية الإقليم سنة 1970، وصار وزير القانون والتعليم في إقليم الحدود، وشارك في لجنة دستور 1973، وكان مرشح المعارضة الموحّد للرئاسة سنة 1973، واعتُقل في قضية مؤامرة حيدرآباد."
  en: "Pakistani Pashtun lawyer and politician (1918–1977) of Bakhshali in Mardan. A Khudai Khidmatgar member from his student days and then a National Awami Party leader, he won both National and Provincial Assembly seats in 1970, served as the Frontier province's senior minister for law, education and parliamentary affairs, sat on the committee that framed the 1973 constitution, stood as the combined opposition's presidential candidate in 1973, and was tried in the Hyderabad conspiracy case."
  ur: "بخښالی (مردان) کے پاکستانی پشتون وکیل اور سیاست دان (1918ء–1977ء)۔ وہ طالب علمی سے خدائی خدمت گار تحریک کے رکن اور پھر نیشنل عوامی پارٹی کے رہنما رہے، 1970ء میں قومی و صوبائی اسمبلی دونوں کی نشستیں جیتیں، صوبے کے وزیرِ قانون، تعلیم و پارلیمانی امور بنے، 1973ء کے آئین کی کمیٹی میں بیٹھے، اسی سال اپوزیشن کے متفقہ صدارتی امیدوار ہوئے، اور حیدرآباد سازش کیس میں مقدمہ چلا۔"
