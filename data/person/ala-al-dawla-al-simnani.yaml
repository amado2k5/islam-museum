summary:
  ar: "أحمد بن محمد بن أحمد السمناني، علاء الدولة ركن الدين، باحث من علماء الصوفية شافعي المذهب، ولد بسمنان وسكن تبريز وبغداد وتوفي ببغداد سنة 736 هـ، تقول الترجمة إن مصنفاته تزيد على ثلاثمئة، ومن كتبه العروة لأهل الخلوة."
  en: "Ahmad ibn Muhammad al-Simnani, Ala al-Dawla Rukn al-Din, a Shafi'i researcher among the Sufi scholars, born at Simnan, resident in Tabriz and Baghdad, died in Baghdad in 736 AH (1336); his writings are said to exceed 300, among them al-Urwa li-Ahl al-Khalwa."
  fr: "Ahmad ibn Muhammad al-Simnani, Ala al-Dawla Rukn al-Din, un chercheur Shafi'i parmi les savants soufis, né à Simnan, résidant à Tabriz et Bagdad, est mort à Bagdad en 736 de l’hégire (1336) ; ses écrits seraient supérieurs à 300, parmi eux al-Urwa li-Ahl al-Khalwa."
