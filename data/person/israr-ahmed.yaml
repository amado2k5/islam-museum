summary:
  ar: عالم دين باكستاني وخطيب، وُلد في حصار سنة 1932 وتوفي في لاهور سنة 2010. طبيب تدرّب في لاهور وكراچي، غادر الجماعة الإسلامية لخلافه مع دخولها السياسة الانتخابية، وأسّس أنجمن خدام القرآن (1972) وتنظيم إسلامي (1975) داعيًا إلى إحياء قرآني وإلى إقامة الخلافة، ونال وسام ستارة امتياز سنة 1981.
  en: Pakistani Islamic scholar and orator, born in Hisar in 1932 and died in Lahore in 2010. A physician trained in Lahore and Karachi, he left Jamaat-e-Islami over its turn to electoral politics and founded Anjuman Khuddam-ul-Quran (1972) and Tanzeem-e-Islami (1975), preaching a Qur'an-centred revival and the restoration of the caliphate. He received the Sitara-i-Imtiaz in 1981.
  ur: پاکستانی عالمِ دین اور خطیب، جو 1932 میں حصار میں پیدا ہوئے اور 2010 میں لاہور میں وفات پائے۔ وہ لاہور اور کراچی سے تعلیم یافتہ معالج تھے؛ جماعتِ اسلامی کی انتخابی سیاست سے اختلاف پر اسے چھوڑا، انجمن خدام القرآن (1972) اور تنظیم اسلامی (1975) کی بنیاد رکھی، اور 1981 میں ستارۂ امتیاز ملا۔
  es: "Erudito y orador islámico pakistaní, nacido en Hisar en 1932 y fallecido en Lahore en 2010. Médico formado en Lahore y Karachi, abandonó Jamaat-e-Islami debido a su incursión en la política electoral y fundó Anjuman Khuddam-ul-Quran (1972) y Tanzeem-e-Islami (1975), predicando un renacimiento centrado en el Corán y la restauración del califato. Recibió la condecoración Sitara-i-Imtiaz en 1981."
  fr: "Érudit islamique et orateur pakistanais, né à Hisar en 1932 et décédé à Lahore en 2010. Médecin formé à Lahore et Karachi, il quitta Jamaat-e-Islami suite à son virage politique électoral et fonda Anjuman Khuddam-ul-Quran (1972) et Tanzeem-e-Islami (1975), prônant un renouveau centré sur le Coran et la restauration du califat. Il reçut la Sitara-i-Imtiaz en 1981."
  tr: "1932'de Hisar'da doğan ve 2010'da Lahor'da vefat eden Pakistanlı bir din bilgini ve vaizdir. Lahor ve Karaçi'de doktor olarak eğitim almış, halifeliği seçim siyasetine girerken Cemaat Islami'den ayrılmış, 1972'de Anjuman Khaddam al-Quran'ı (1972) ve Kur'an'ın canlanmasını ve halifeliğin kurulmasını savunan bir İslami örgütü (1975) kurmuş, 1981'de Seçkin Kalkan Nişanı ile ödüllendirilmiştir."
  id: "Seorang ulama agama dan pengkhotbah Pakistan, lahir di Hisar pada tahun 1932 dan meninggal di Lahore pada tahun 2010. Sebagai seorang dokter yang berpendidikan di Lahore dan Karachi, ia meninggalkan Jamaat-e-Islami karena kekhalifahannya yang memasuki politik elektoral, mendirikan Anjuman Khaddam al-Quran (1972) dan organisasi Islam (1975), menyerukan kebangkitan Al-Qur'an dan pendirian kekhalifahan, serta dianugerahi Ordo Perisai Terhormat pada tahun 1981."
