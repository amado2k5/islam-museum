label:
  ar: إسرار أحمد
  en: Israr Ahmed
  ur: اسرار احمد
summary:
  ar: عالم دين باكستاني وخطيب، وُلد في حصار سنة 1932 وتوفي في لاهور سنة 2010. طبيب تدرّب في لاهور وكراچي، غادر الجماعة الإسلامية لخلافه مع دخولها السياسة الانتخابية، وأسّس أنجمن خدام القرآن (1972) وتنظيم إسلامي (1975) داعيًا إلى إحياء قرآني وإلى إقامة الخلافة، ونال وسام ستارة امتياز سنة 1981.
  en: Pakistani Islamic scholar and orator, born in Hisar in 1932 and died in Lahore in 2010. A physician trained in Lahore and Karachi, he left Jamaat-e-Islami over its turn to electoral politics and founded Anjuman Khuddam-ul-Quran (1972) and Tanzeem-e-Islami (1975), preaching a Qur'an-centred revival and the restoration of the caliphate. He received the Sitara-i-Imtiaz in 1981.
  ur: پاکستانی عالمِ دین اور خطیب، جو 1932 میں حصار میں پیدا ہوئے اور 2010 میں لاہور میں وفات پائے۔ وہ لاہور اور کراچی سے تعلیم یافتہ معالج تھے؛ جماعتِ اسلامی کی انتخابی سیاست سے اختلاف پر اسے چھوڑا، انجمن خدام القرآن (1972) اور تنظیم اسلامی (1975) کی بنیاد رکھی، اور 1981 میں ستارۂ امتیاز ملا۔
