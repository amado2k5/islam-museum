  note: No source names a madhhab for Israr Ahmed himself. The Urdu article's infobox gives his sect as Ahl-e-Sunnat (اہل سنت) — a single infobox, which never suffices. The English article groups him, as a class, among "Sunni Islamic activists/revivalists" and files him under "Pakistani Sunni Muslim scholars of Islam", and quotes his own organisation calling him in Qur'anic exegesis "a firm traditionalist of the genre of Mahmud Hasan Deobandi and Shabbir Ahmad Usmani" — the tradition of his teachers, not his own attested school. The Arabic article files him under "Pakistani Sunni scholars" by category only, and Wikidata's only religion value is Islam (Q432), generic. Founding and leading Tanzeem-e-Islami is organisational leadership, not a school. All readings are preserved here; under the doubt rule the value stays unknown.
