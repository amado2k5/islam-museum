summary:
  ar: "الشيخ محمد بن عبد الله البكري الصديقي الشافعي، الإمام الأستاذ الأعظم شيخ زمانه بلا مدافعة؛ حذا فيه حذاء أبيه وبقي بعده على طريقته العلية ومدرسته السنية، وانتفع الناس في أيامه بالسلف الصالح، ومن جلست في صحبته يوماً واحداً نال علوماً وبركات، وكان علمه بالأحوال والمكاشفات والتجلي والحقائق كما نص عليه ابن حجر الهيتمي بأنه كان كامل الشيخية محقق في صفاتها وخواصها، وسمع منه ابن حجر فوائد تفوق بيت فوائد؛ ومات في ربيع الآخر {cite:shadharat-dhahab p. 431-432}."
  en: "Shaykh Muhammad al-Bakri al-Siddiqi — 'the greatest teacher, shaykh of his age unchallenged,' son and successor of Abu al-Hasan al-Bakri; Ibn Hajar al-Haytami attested his perfected shaykh-hood and heard 'benefits beyond reckoning' from him; died Rabi' II 993 {cite:shadharat-dhahab p. 431-432}."
  es: "Shaykh Muhammad al-Bakri al-Siddiqi — 'el más grande maestro, el shaykh indiscutible de su época', hijo y sucesor de Abu al-Hasan al-Bakri; Ibn Hajar al-Haytami atestiguó su perfecta condición de shaykh y escuchó de él 'beneficios incalculables'; murió en Rabi' II 993 {cita: shadharat-dhahab págs. 431-432}."
  fr: "Cheikh Muhammad al-Bakri al-Siddiqi — « le plus grand maître, cheikh incontesté de son époque », fils et successeur d'Abu al-Hasan al-Bakri; Ibn Hajar al-Haytami a attesté de sa perfection en tant que cheikh et a entendu de lui des « bienfaits incommensurables »; décédé en Rabi' II 993 {cite: shadharat-dhahab p. 431-432}."
  ur: "شیخ محمد البکری الصدیقی - 'سب سے بڑے استاد، اپنی عمر کے شیخ،' ابو الحسن البکری کے بیٹے اور جانشین؛ ابن حجر الہیتمی نے اپنے کمال شیخ ہونے کی تصدیق کی اور ان سے 'بے حساب فوائد' سنا۔ متوفی ربیع ثانی 993 431-432}۔"
  tr: "Şeyh Muhammed bin Abdullah Al-Bakri Al-Siddiqi Al-Shafi'i, zamanının en büyük öğretmeni ve eleştirilmeden kendi zamanının şeyhi; babasının izinden gitti ve onun soylu yolunda ve Sünni okulunda kaldı. İnsanlar onun zamanında doğru seleflerinden faydalandı. Onunla bir gün bile oturan herkes bilgi ve bereket kazandı; İbn Hajar Al-Haytami'nin belirttiği gibi, onun koşullar, vahiyler, tezahürler ve gerçekler hakkındaki bilgisi tam bir şeyhist ve niteliklerinde ve özelliklerinde kesin olduğunu gösterdi. İbn Hajar ondan bir ayetin ötesinde faydalar duydu; Rebi'l-Akhir'de vefat etti {cite:shadharat-dhahab, s. 431-432}."
  id: "Sheikh Muhammad bin Abdullah Al-Bakri Al-Siddiqi Al-Shafi'i, Imam, guru terbesar, dan sheikh pada zamannya tanpa kritik; ia mengikuti jejak ayahnya dan tetap berada setelahnya di jalan mulia dan aliran Sunni. Orang-orang mendapat manfaat pada masa-masanya dari para pendahulu yang benar. Siapa pun yang duduk bersamanya bahkan sehari pun memperoleh pengetahuan dan berkat, serta pengetahuannya tentang kondisi, wahyu, manifestasi, dan realitas, seperti yang dinyatakan oleh Ibn Hajar Al-Haytami, bahwa ia adalah seorang Sheikhist yang sempurna dan tepat dalam kualitas serta karakteristik mereka. Ibn Hajar mendengar dari beliau manfaat yang melampaui satu ayat manfaat; ia meninggal dalam Rabi' al-Akhir {cite:shadharat-dhahab, hlm. 431-432}."
