summary:
  ar: "الشيخ محمد بن عبد الله البكري الصديقي الشافعي، الإمام الأستاذ الأعظم شيخ زمانه بلا مدافعة؛ حذا فيه حذاء أبيه وبقي بعده على طريقته العلية ومدرسته السنية، وانتفع الناس في أيامه بالسلف الصالح، ومن جلست في صحبته يوماً واحداً نال علوماً وبركات، وكان علمه بالأحوال والمكاشفات والتجلي والحقائق كما نص عليه ابن حجر الهيتمي بأنه كان كامل الشيخية محقق في صفاتها وخواصها، وسمع منه ابن حجر فوائد تفوق بيت فوائد؛ ومات في ربيع الآخر {cite:shadharat-dhahab p. 431-432}."
  en: "Shaykh Muhammad al-Bakri al-Siddiqi — 'the greatest teacher, shaykh of his age unchallenged,' son and successor of Abu al-Hasan al-Bakri; Ibn Hajar al-Haytami attested his perfected shaykh-hood and heard 'benefits beyond reckoning' from him; died Rabi' II 993 {cite:shadharat-dhahab p. 431-432}."
