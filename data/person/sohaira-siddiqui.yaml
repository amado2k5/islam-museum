  es: "Investigadora de estudios islámicos y profesora en la Universidad de Georgetown en Qatar; directora ejecutiva fundadora del Centro y Mezquita Al-Mujadilah para Mujeres en Doha, y autora de un libro sobre derecho y política bajo el dominio abasí."
  fr: "Spécialiste des études islamiques et professeur à l'université de Georgetown au Qatar; directeur exécutif fondateur du centre Al-Mujadilah et de la mosquée pour femmes à Doha, et auteur d'un ouvrage sur le droit et la politique sous les Abbassides."
