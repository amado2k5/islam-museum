  ar: باحثة في الدراسات الإسلامية وأستاذة في جامعة جورجتاون في قطر؛ المديرة التنفيذية المؤسِّسة لمركز ومسجد «المجادلة» للنساء في الدوحة، ومؤلفة كتاب عن القانون والسياسة في العصر العباسي.
