summary:
  ar: "مغنٍّ وكاتب أغانٍ سنغالي-أمريكي، وُلد في سانت لويس بولاية ميزوري في 16 أبريل 1973 لأسرة سنغالية، وحقّق انطلاقته بألبوم «ترابل» (2004)، وأسس شركتي «كونفيكت ميوزيك» و«كونلايف»، وأطلق سنة 2014 مبادرة «إيكون لايتينغ أفريقيا» لإيصال الكهرباء إلى بلدان أفريقية، ثم أُعلن سنة 2025 التخلي عن مشروع مدينته المستقبلية «إيكون سيتي» في السنغال."
  en: "Senegalese-American singer and songwriter, born at St. Louis, Missouri, on 16 April 1973 to a Senegalese family. He broke through with the album Trouble (2004), founded the labels Konvict Muzik and KonLive Distribution, launched the Akon Lighting Africa electricity initiative in 2014, and saw his planned Senegalese futuristic city, Akon City, officially abandoned in 2025."
  ur: "سینیگالی-امریکی گلوکار و گیت نگار، جو 16 اپریل 1973 کو سینٹ لوئس، میزوری میں سینیگالی خاندان میں پیدا ہوئے۔ انہیں البم «ٹرابل» (2004) سے شہرت ملی، انہوں نے «کونوکٹ میوزک» اور «کون لائیو» لیبل قائم کیے، 2014 میں افریقہ میں بجلی کی فراہمی کی مہم «ایکن لائٹنگ افریقہ» شروع کی، اور سینیگال میں ان کے مجوزہ شہر «ایکن سٹی» کا منصوبہ 2025 میں باضابطہ ترک کر دیا گیا۔"
