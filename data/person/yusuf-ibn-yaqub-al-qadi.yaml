id: person/yusuf-ibn-yaqub-al-qadi
class: person
label: { ar: "يوسف بن يعقوب القاضي", en: "Yusuf ibn Ya'qub", es: "Yusuf ibn Ya'qub", fr: "Yusuf ibn Ya'qub" }
summary:
  ar: "ولاه المعتضد القضاء بمدينة السلام سنة ثلاث وثمانين ومائتين وخلع عليه وانتدبه للجانب الشرقي، وهو أبو حازم الذي هجا ولده الشاعر في يوسف بن يعقوب أضحى أهل بغداد منكم في غرور أنتم كلكم فداء أبي حازم {cite:muruj-al-dhahab p. 620,636}."
  en: "Al-Mu'tadid's qadi of Baghdad for the East Side — Abu Hazim, whose sons the poet lampooned {cite:muruj-al-dhahab p. 620,636}. Ibn al-Jawzi: appointed over the mazalim in 277 with unmatched strictness; invested with the East Side judgeship plus Kufa in 283 after Baghdad had gone three months and eighteen days without a qadi; and supervisor of the Jami' al-Mansur enlargement {cite:muntazam-ibn-al-jawzi p. 105, 143, 163}."
  es: "El cadí de Al-Mu'tadid para Bagdad en el lado oriental — Abu Hazim, cuyos hijos fueron ridiculizados por el poeta {cite:muruj-al-dhahab p. 620,636}. Ibn al-Jawzi: nombrado sobre los mazalim en 277 con una rigurosidad sin igual; investido con el cargo de juez del lado oriental más Kufa en 283 después de que Bagdad hubiera estado tres meses y dieciocho días sin cadí; y supervisor de la ampliación de Jami' al-Mansur {cite:muntazam-ibn-al-jawzi p. 105, 143, 163}."
  fr: "Le cadi d'Al-Mu'tadid à Bagdad pour la rive orientale était Abu Hazim, dont les fils furent raillés par le poète (voir: Muruj-al-Dhahab, p. 620, 636). Ibn al-Jawzi: nommé à la tête des mazalim en 277 avec une rigueur sans égale; investi de la juridiction de la rive orientale et de Koufa en 283, après trois mois et dix-huit jours sans cadi à Bagdad; et superviseur de l'agrandissement de la Jami' al-Mansur (voir: Muntazam-ibn-al-Jawzi, p. 105, 143, 163)."
