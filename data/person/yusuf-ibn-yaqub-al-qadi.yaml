summary:
  ar: "ولاه المعتضد القضاء بمدينة السلام سنة ثلاث وثمانين ومائتين وخلع عليه وانتدبه للجانب الشرقي، وهو أبو حازم الذي هجا ولده الشاعر في يوسف بن يعقوب أضحى أهل بغداد منكم في غرور أنتم كلكم فداء أبي حازم {cite:muruj-al-dhahab p. 620,636}."
  en: "Al-Mu'tadid's qadi of Baghdad for the East Side — Abu Hazim, whose sons the poet lampooned {cite:muruj-al-dhahab p. 620,636}. Ibn al-Jawzi: appointed over the mazalim in 277 with unmatched strictness; invested with the East Side judgeship plus Kufa in 283 after Baghdad had gone three months and eighteen days without a qadi; and supervisor of the Jami' al-Mansur enlargement {cite:muntazam-ibn-al-jawzi p. 105, 143, 163}."
