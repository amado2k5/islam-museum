summary:
  ar: "المؤرخ والرحالة أبو الحسن علي بن الحسين بن علي المسعودي البغدادي المتوفى نحو سنة ست وثلاثين وثلاث مئة، صاحب مروج الذهب ومعادن الجوهر وكتاب التنبيه والإشراف، رحل في البلاد من فارس والهند إلى المغرب ومصر وجمع في مصنفاته من أخبار الأمم والأمصار والملل والنحل ما عدّه مؤرخو الإسلام من عيون الأدب التاريخي {cite:muruj-al-dhahab}."
  en: "The historian and traveller Abu'l-Hasan Ali ibn al-Husayn al-Mas'udi of Baghdad, d. c. 336 — author of Muruj al-Dhahab wa-Ma'adin al-Jawhar and al-Tanbih wa'l-Ishraf, whose journeys from Fars and India to the Maghreb and Egypt fed a corpus Islamic historians count among the finest works of historical letters {cite:muruj-al-dhahab}."
