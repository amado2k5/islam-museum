label: { ar: "أبو الحسن علي بن الحسين المسعودي" }
summary:
  ar: "المؤرخ والرحالة أبو الحسن علي بن الحسين بن علي المسعودي البغدادي المتوفى نحو سنة ست وثلاثين وثلاث مئة، صاحب مروج الذهب ومعادن الجوهر وكتاب التنبيه والإشراف، رحل في البلاد من فارس والهند إلى المغرب ومصر وجمع في مصنفاته من أخبار الأمم والأمصار والملل والنحل ما عدّه مؤرخو الإسلام من عيون الأدب التاريخي {cite:muruj-al-dhahab}. وختم مروج الذهب باعتذاره عما عرض من سهو أو تصحيف للأسفار المتواترة والحركة المتصلة تارة مشرقين وتارة مغربين وطوراً متيامنين وطوراً متشائمين وما يلحق من سهو الإنسانية، وتوعد من حرف كتابه أو نسبه إلى غيره بغضب الله، وقال لو كان لا يؤلف كتاباً إلا من حوى جميع العلوم إذن ما ألف أحد كتاباً {cite:muruj-al-dhahab p. 750-751}"
  en: "The historian and traveller Abu'l-Hasan Ali ibn al-Husayn al-Mas'udi of Baghdad, d. c. 336 — author of Muruj al-Dhahab wa-Ma'adin al-Jawhar and al-Tanbih wa'l-Ishraf, whose journeys from Fars and India to the Maghreb and Egypt fed a corpus Islamic historians count among the finest works of historical letters {cite:muruj-al-dhahab}."
