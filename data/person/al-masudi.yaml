id: person/al-masudi
class: person
label: { ar: "أبو الحسن علي بن الحسين المسعودي", en: "Abu al-Hasan Ali ibn al-Husayn al-Mas'udi", fr: "Abu al-Hasan Ali ibn al-Husayn al-Mas'udi", es: "Abu al-Hasan Ali ibn al-Husayn al-Mas'udi", ur: "ابو الحسن علی ابن الحسین المسعودی" }
summary:
  ar: "المؤرخ والرحالة أبو الحسن علي بن الحسين بن علي المسعودي البغدادي المتوفى نحو سنة ست وثلاثين وثلاث مئة، صاحب مروج الذهب ومعادن الجوهر وكتاب التنبيه والإشراف، رحل في البلاد من فارس والهند إلى المغرب ومصر وجمع في مصنفاته من أخبار الأمم والأمصار والملل والنحل ما عدّه مؤرخو الإسلام من عيون الأدب التاريخي {cite:muruj-al-dhahab}. وختم مروج الذهب باعتذاره عما عرض من سهو أو تصحيف للأسفار المتواترة والحركة المتصلة تارة مشرقين وتارة مغربين وطوراً متيامنين وطوراً متشائمين وما يلحق من سهو الإنسانية، وتوعد من حرف كتابه أو نسبه إلى غيره بغضب الله، وقال لو كان لا يؤلف كتاباً إلا من حوى جميع العلوم إذن ما ألف أحد كتاباً {cite:muruj-al-dhahab p. 750-751}"
  en: "The historian and traveller Abu'l-Hasan Ali ibn al-Husayn al-Mas'udi of Baghdad, d. c. 336 — author of Muruj al-Dhahab wa-Ma'adin al-Jawhar and al-Tanbih wa'l-Ishraf, whose journeys from Fars and India to the Maghreb and Egypt fed a corpus Islamic historians count among the finest works of historical letters {cite:muruj-al-dhahab}."
  fr: "L'historien et voyageur Abu'l-Hasan Ali ibn al-Husayn al-Mas'udi de Bagdad, décédé vers 336 - auteur de Muruj al-Dhahab wa-Ma'adin al-Jawhar et al-Tanbih wa'l-Ishraf, dont les voyages du Fars et de l'Inde au Maghreb et en Égypte nourris un corpus historiens islamiques comptent parmi les plus belles œuvres de lettres historiques {cite:muruj-al-dhahab}."
  es: "El historiador y viajero Abu'l-Hasan Ali ibn al-Husayn al-Mas'udi de Bagdad, dc 336 — autor de Muruj al-Dhahab wa-Ma'adin al-Jawhar y al-Tanbih wa'l-Ishraf, cuyos viajes desde Fars e India hasta el Magreb y Egipto alimentaron un corpus que los historiadores islámicos consideran entre las mejores obras de literatura histórica {cite:muruj-al-dhahab}."
  ur: "مؤرخ اور سیاح ابو الحسن علی ابن الحسین المسعودی، بغداد، dc 336 - مروج الذہب و المعادین الجوہر اور التنبیح والاشرف تاریخی خطوط کے مصنف۔"
  tr: "Tarihçi ve gezgin Ebu el-Hasan Ali ibn el-Hüseyin ibn el-Mes'udi el-Bağdadi, yaklaşık 336 Hicri yılında vefat eden, Muruj al-Dhahab, Ma'adin al-Johar ve Al-Tanbih wa al-Ashraf kitaplarının yazarıdır. İran ve Hindistan'dan Mağrip ve Mısır'a kadar topraklarda seyahat etti ve eserlerinde uluslar, şehirler, mezhepler ve inançların haberlerini topladı İslam tarihçileri tarih edebiyatının kaynaklarını değerlendirdiler. Muruj al-Dhahab, mutevatir kitaplarının ve sürekli hareketlerin gözden kaçırılması veya çarpıtılması nedeniyle özür dileyerek bitirdi—bazen Doğulular, bazen Batılılar, bazen Yemenliler, bazen kötümserler ve insanlık hakkındaki yanlış anlamalar. Kitabını değiştiren veya başkalarına atfeden herkesi Tanrı'nın gazabıyla tehdit etti ve eğer sadece tüm bilimleri içeren bir kitap yazsaydı, kimsenin bir kitap yazmayacağını söyledi {alıntı: Muruj-al-dhahab s. 750-751}"
  id: "Sejarawan dan pengembara Abu al-Hasan Ali ibn al-Husayn ibn Ali al-Mas'udi al-Baghdadi, yang meninggal sekitar tahun 336 H, penulis Muruj al-Dhahab, Ma'adin al-Johar, dan buku Al-Tanbih wa al-Ashraf. Ia melakukan perjalanan melintasi tanah dari Persia dan India hingga Maghreb dan Mesir, dan mengumpulkan dalam karyanya berita tentang bangsa, kota, sekte, dan kepercayaan yang dianggap oleh sejarawan Islam sebagai sumber sastra sejarah. Muruj al-Dhahab menutup dengan meminta maaf atas kelalaian atau distorsi kitab mutawatir dan gerakan yang terus-menerus—kadang orang Timur, kadang orang Barat, kadang Yaman, kadang pesimis, dan kesalahpahaman umat manusia. Ia mengancam siapa pun yang mengubah bukunya atau mengaitkannya dengan orang lain dengan murka Tuhan, dan mengatakan bahwa jika ia hanya menulis buku yang memuat semua ilmu pengetahuan, maka tidak ada yang akan menulis buku {cite:Muruj-al-dhahab hlm. 750-751}"
