summary:
  ar: "مؤلف تاريخ وصاف، وهو كتاب فارسي في تاريخ الإمبراطورية المغولية، عُرض على غازان خان في 13 رجب سنة 702 هـ، فسأل السلطان عن أحداث كثيرة فيه وأمر أن يُكسى الكتاب بغطاء من نسيج الذهب {cite:jami-al-tawarikh-khashshab-1960 p. 44}. ويذكر الخشاب أن رشيد الدين عرف الكتاب أثناء إقامة القصر في عانة على الفرات، في الحملة نفسها على الرحبة {cite:jami-al-tawarikh-khashshab-1960 p. 43}. يصف الخشاب أسلوبه بالتكلف والإغراق في الصنعة {cite:jami-al-tawarikh-khashshab-1960 p. 43}. انظر الكتاب: تاريخ وصاف."
  en: "Author of the Tarikh-i Wassaf, a Persian history of the Mongol empire. He presented part of it to Ghazan Khan on 13 Rajab 702 AH; the sultan asked him many questions about events in it and ordered the book covered in gold cloth {cite:jami-al-tawarikh-khashshab-1960 p. 44}. The introduction says Rashid al-Din came to know the book while the court was at Anah on the Euphrates, in the same campaign as Rahba {cite:jami-al-tawarikh-khashshab-1960 p. 43}. It describes the style as ornate and strained {cite:jami-al-tawarikh-khashshab-1960 p. 43}. See the work record."
  es: "Autor de Tarikh-i Wassaf, una historia persa del imperio mongol. Presentó una parte a Ghazan Jan el 13 de rayab de 702 de la Hégira; el sultán le hizo muchas preguntas sobre los acontecimientos y ordenó cubrir el libro con tela de oro {cite:jami-al-tawarikh-khashshab-1960 p. 44}. La introducción indica que Rashid al-Din conoció el libro durante la estancia de la corte en Anah, a orillas del Éufrates, en la misma campaña que Rahba {cite:jami-al-tawarikh-khashshab-1960 p. 43}. Describe su estilo como recargado y forzado {cite:jami-al-tawarikh-khashshab-1960 p. 43}. Véase el registro de la obra."
  fr: "Auteur du Tarikh-i Wassaf, histoire persane de l'empire mongol. Il en présenta une partie à Ghazan Khan le 13 rajab 702 de l'Hégire ; le sultan lui posa de nombreuses questions sur les événements et ordonna de couvrir le livre d'une étoffe d'or {cite:jami-al-tawarikh-khashshab-1960 p. 44}. L'introduction indique que Rashid al-Din connut le livre pendant le séjour de la cour à Anah, sur l'Euphrate, dans la même campagne que Rahba {cite:jami-al-tawarikh-khashshab-1960 p. 43}. Elle décrit son style comme chargé et forcé {cite:jami-al-tawarikh-khashshab-1960 p. 43}. Voir la notice de l'ouvrage."
  ur: "تاریخ وصاف کے مصنف، جو منگول سلطنت کی فارسی تاریخ ہے۔ انہوں نے اس کا ایک حصہ 13 رجب 702ھ کو غازان خان کو پیش کیا؛ سلطان نے اس میں درج واقعات کے بارے میں بہت سے سوالات کیے اور حکم دیا کہ کتاب کو سونے کے تار والے کپڑے سے ڈھانپا جائے {cite:jami-al-tawarikh-khashshab-1960 p. 44}۔ مقدمے کے مطابق رشید الدین نے یہ کتاب عانہ میں قیام کے دوران جانی، جو دریائے فرات پر ہے، اسی مہم میں جس میں رحبہ کا محاصرہ ہوا {cite:jami-al-tawarikh-khashshab-1960 p. 43}۔ اس کا اسلوب مزین اور تکلف آمیز بتایا گیا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 43}۔"
