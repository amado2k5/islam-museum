summary:
  ar: "أبو يعقوب يوسف بن يعقوب بن إسماعيل بن خرّزاذ النجيرمي، اللغوي البصري نزيل مصر؛ كان من أهل بيت فيه جماعة من الفضلاء الأدباء المتمكنين في اللغة، وكان أمثل أهل بيته وخطاطاً بارعاً رغب أهل مصر في خطه حتى بلغت نسخة من ديوان جرير بخطه عشرة دنانير {cite:wafayat-ayan}."
  en: "Abu Ya'qub Yusuf ibn Ya'qub ibn Isma'il ibn Kharrazadh al-Najirmi, the Basran philologist who settled in Egypt. He came from a family with several accomplished men of letters well grounded in the language; he was the best of his household and an accomplished calligrapher, and the people of Egypt prized his script so much that a copy of the Diwan of Jarir in his hand fetched ten dinars {cite:wafayat-ayan}."
  fr: "Abu Ya'qub Yusuf ibn Ya'qub ibn Isma'il ibn Kharrazadh al-Najirmi, le philologue Basran qui s'est installé en Égypte. Il venait d'une famille avec plusieurs hommes de lettres accomplis bien enracinés dans la langue ; Il était le meilleur de sa famille et un calligraphe accompli, et le peuple d'Égypte a pris son script tellement qu'une copie du Diwan de Jarir dans sa main a rapporté dix dinars {cite:wafayat-ayan}."
  es: "Abu Ya'qub Yusuf ibn Ya'qub ibn Isma'il ibn Kharrazadh al-Najirmi, el filólogo de Basora que se estableció en Egipto. Provenía de una familia con varios hombres de letras consumados y con un profundo conocimiento del idioma; era el mejor de su familia y un calígrafo consumado, y el pueblo egipcio apreciaba tanto su caligrafía que una copia del Diwan de Jarir escrita por él alcanzaba los diez dinares {cite:wafayat-ayan}."
  ur: "ابو یعقوب یوسف بن یعقوب بن اسماعیل ابن خرزاد النجرمی، بصری ماہر فلسفی جو مصر میں آباد ہوئے۔ وہ ایک ایسے گھرانے سے آیا تھا جس میں زبان کے کئی ماہر خطوط تھے۔ وہ اپنے خاندان کے سب سے اچھے اور ماہر خطاط تھے اور اہل مصر نے اس کے رسم الخط کی اتنی قدر کی کہ اس کے ہاتھ میں دیوان جریر کا ایک نسخہ دس دینار لے آیا۔"
  tr: "Mısır'da yaşayan Basri dilbilimci Ebu Yaqub Yusuf bin Ya'qub ibn İsmayıl ibn Kharzad al-Nujairmi, dili iyi bilen seçkin edebiyatçılardan oluşan bir aileden geliyordu. O, evinin en iyisiydi ve el yazısı Mısır halkını cezbetti; öyle ki Jarir'in Diwan'ının el yazısıyla yazdığı bir kopya on dinara ulaştı {atı:wafayat-ayan}."
  id: "Abu Yaqub Yusuf ibn Ya'qub ibn Isma'il ibn Kharzad al-Nujairmi, ahli bahasa Basri yang tinggal di Mesir, berasal dari keluarga yang terdiri dari sekelompok sastrawan terkemuka yang mahir dalam bahasa tersebut. Ia adalah yang terbaik di keluarganya dan seorang kaligrafer terkawal yang tulisan tangannya menarik perhatian masyarakat Mesir, sehingga sebuah salinan Diwan karya Jarir dengan tulisan tangannya mencapai sepuluh dinar {cite:wafayat-ayan}."
