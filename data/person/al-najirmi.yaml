summary:
  ar: "أبو يعقوب يوسف بن يعقوب بن إسماعيل بن خرّزاذ النجيرمي، اللغوي البصري نزيل مصر؛ كان من أهل بيت فيه جماعة من الفضلاء الأدباء المتمكنين في اللغة، وكان أمثل أهل بيته وخطاطاً بارعاً رغب أهل مصر في خطه حتى بلغت نسخة من ديوان جرير بخطه عشرة دنانير {cite:wafayat-ayan}."
  en: "Abu Ya'qub Yusuf ibn Ya'qub ibn Isma'il ibn Kharrazadh al-Najirmi, the Basran philologist who settled in Egypt. He came from a family with several accomplished men of letters well grounded in the language; he was the best of his household and an accomplished calligrapher, and the people of Egypt prized his script so much that a copy of the Diwan of Jarir in his hand fetched ten dinars {cite:wafayat-ayan}."
