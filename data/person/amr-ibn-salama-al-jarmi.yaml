summary:
  ar: "عمرو بن سلمة بن نفيع، وقيل سلمة بن قيس، أبو بريد الجرمي، ويقال أبو يزيد البصري. أدرك النبي، وكان يؤم قومه على عهد النبي لأنه كان أكثرهم حفظا للقرآن. روى عن أبيه، وعنه أبو قلابة الجرمي وعاصم الأحول وأبو الزبير. قال ابن حبان: له صحبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
  en: "Amr ibn Salama al-Jarmi, Abu Buraid, also called Abu Yazid of Basra, who met the Prophet and led his people in prayer in the Prophet's time because he had the most of the Qur'an by heart. He narrated from his father; Abu Qilaba al-Jarmi, Asim al-Ahwal and Abu al-Zubayr narrated from him. Ibn Hibban held that he had companionship with the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
  ur: "عمرو بن سلامہ الجرمی، ابو برید، بصرہ کے ابو یزید بھی کہلاتے؛ نبی سے ملے اور اپنے قوم کو نبی کے زمانے میں نماز پڑھائی کیونکہ وہ سب سے بڑا حافظ تھا۔"
  es: "Amr ibn Salama al-Jarmi, Abu Buraid, también llamado Abu Yazid de Basora, conoció al Profeta y dirigió la oración de su pueblo en tiempos del Profeta, pues conocía de memoria la mayor parte del Corán. Narró de su padre; Abu Qilaba al-Jarmi, Asim al-Ahwal y Abu al-Zubayr narraron de él. Ibn Hibban afirmó que tuvo compañía del Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
  fr: "Amr ibn Salama al-Jarmi, dit Abu Buraid, également appelé Abu Yazid de Bassora, rencontra le Prophète et dirigea la prière de son peuple à son époque, car il connaissait la plus grande partie du Coran par cœur. Il rapporta des hadiths de son père; Abu Qilaba al-Jarmi, Asim al-Ahwal et Abu al-Zubayr rapportèrent également des hadiths de lui. Ibn Hibban affirmait qu'il était un compagnon du Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
  tr: "Amr ibn Salamah ibn Nafi', ayrıca Salamah ibn Kays, Ebu Burayd al-Jurmi ve ayrıca Ebu Yezid el-Basri de denir. Peygamber'le görüştü ve Peygamber'in zamanında kendi halkını yönetti çünkü Kur'an'ın en ezberlenen kişisiydi. Babasından rivayet etti ve ondan Ebu Qilabah el-Cermi, Asim el-Ahval ve Ebu el-Zubeyr geldi. İbn Hibban şöyle dedi: Yoldaşlığı vardı. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.3493}"
  id: "Amr ibn Salamah ibn Nafi', dan juga disebut Salamah ibn Qays, Abu Burayd al-Jurmi, dan juga disebut Abu Yazid al-Basri. Ia bertemu Nabi dan memimpin umatnya pada masa Nabi karena ia adalah yang paling dihafal dalam Al-Qur'an. Ia menceritakan dari ayahnya, dan dari ayahnya adalah Abu Qilabah al-Jarmi, Asim al-Ahwal, dan Abu al-Zubayr. Ibn Hibban berkata: Ia memiliki teman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3493}"
