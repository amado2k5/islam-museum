summary:
  ar: "عمرو بن سلمة بن نفيع، وقيل سلمة بن قيس، أبو بريد الجرمي، ويقال أبو يزيد البصري. أدرك النبي، وكان يؤم قومه على عهد النبي لأنه كان أكثرهم حفظا للقرآن. روى عن أبيه، وعنه أبو قلابة الجرمي وعاصم الأحول وأبو الزبير. قال ابن حبان: له صحبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
  en: "Amr ibn Salama al-Jarmi, Abu Buraid, also called Abu Yazid of Basra, who met the Prophet and led his people in prayer in the Prophet's time because he had the most of the Qur'an by heart. He narrated from his father; Abu Qilaba al-Jarmi, Asim al-Ahwal and Abu al-Zubayr narrated from him. Ibn Hibban held that he had companionship with the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3493}"
