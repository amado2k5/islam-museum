summary:
  ar: "المولى محيي الدين محمد، من علماء عهد محمد الفاتح؛ ينقل الصلابي أن الوزراء لما عجزوا عن الشفاعة لغلام ضرب قاضي أدرنة التمسوا منه إصلاح الأمر لدى السلطان، فقال للفاتح: «إن النائب بقيامه عن مجلس القضاء بسبب الغضب سقط عن رتبة القضاء، فلم يكن هو عند الضرب قاضياً فلم يلزم تحقير الشرع حتى يحل قتله»، فسكت السلطان محمد خان {cite:dawlat-uthmaniyya-salabi p. 147}."
  en: "Molla Muhyi al-Din Muhammad, a scholar of Mehmed II's reign; when the viziers' intercession failed for the page who had struck Edirne's qadi, they begged him to make the sultan's peace. He argued: 'the deputy, by rising from the bench in anger, fell from the rank of judge — so at the moment of the blow he was no qadi, and the law's dishonour does not warrant killing.' The sultan fell silent {cite:dawlat-uthmaniyya-salabi p. 147}."
  es: "Molla Muhyi al-Din Muhammad, un erudito del reinado de Mehmed II, cuando la intercesión de los visires fracasó en favor del paje que había golpeado al cadí de Edirne, le rogaron que apaciguara al sultán. Argumentó: «El diputado, al levantarse del estrado con ira, perdió su rango de juez; por lo tanto, en el momento del golpe no era cadí, y la deshonra de la ley no justifica la muerte». El sultán guardó silencio {cite:dawlat-uthmaniyya-salabi p. 147}."
  fr: "Molla Muhyi al-Din Muhammad, un érudit du règne de Mehmed II, rapporta que lorsque l'intercession des vizirs en faveur du page ayant frappé le cadi d'Edirne échoua, ils le supplièrent d'intercéder auprès du sultan. Il argumenta: « Le député, en se levant de son siège sous le coup de la colère, a perdu son rang de juge; par conséquent, au moment du coup, il n'était plus cadi, et la violation de la loi ne justifie pas la mort. » Le sultan garda le silence."
  ur: "مولا محی الدین محمد، محمد ثانی کے دور کا ایک عالم؛ جب وزیروں کی شفاعت اس صفحہ کے لیے ناکام ہو گئی جس نے ایڈرن کی قضا کو مارا تھا، تو انہوں نے اس سے سلطان کی صلح کرنے کی التجا کی۔ اس نے دلیل دی: 'ڈپٹی، غصے میں بنچ سے اٹھ کر، جج کے عہدے سے گر گیا - اس لیے ضرب کے وقت وہ قادی نہیں تھا، اور قانون کی بے عزتی قتل کی ضمانت نہیں دیتی۔' سلطان خاموش ہو گیا۔ 147}۔"
