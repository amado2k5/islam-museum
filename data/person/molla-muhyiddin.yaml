summary:
  ar: "المولى محيي الدين محمد، من علماء عهد محمد الفاتح؛ ينقل الصلابي أن الوزراء لما عجزوا عن الشفاعة لغلام ضرب قاضي أدرنة التمسوا منه إصلاح الأمر لدى السلطان، فقال للفاتح: «إن النائب بقيامه عن مجلس القضاء بسبب الغضب سقط عن رتبة القضاء، فلم يكن هو عند الضرب قاضياً فلم يلزم تحقير الشرع حتى يحل قتله»، فسكت السلطان محمد خان {cite:dawlat-uthmaniyya-salabi p. 147}."
  en: "Molla Muhyi al-Din Muhammad, a scholar of Mehmed II's reign; when the viziers' intercession failed for the page who had struck Edirne's qadi, they begged him to make the sultan's peace. He argued: 'the deputy, by rising from the bench in anger, fell from the rank of judge — so at the moment of the blow he was no qadi, and the law's dishonour does not warrant killing.' The sultan fell silent {cite:dawlat-uthmaniyya-salabi p. 147}."
