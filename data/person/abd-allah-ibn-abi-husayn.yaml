label:
  ar: "عبد الله بن أبي حسين"
  en: "Abd Allah ibn Abi Husayn al-Makki"
summary:
  ar: "عبد الله بن عبد الرحمن بن أبي حسين بن الحارث بن عامر بن نوفل القرشي النوفلي المكي. روى عن الحارث بن جميلة والحسن البصري وشهر بن حوشب وطاوس بن كيسان وعطاء بن أبي رباح، وروى عنه جماعة منهم سفيان بن عيينة والثوري ومالك بن أنس وابن جريج. وثّقه أحمد والنسائي وأبو زرعة، وقال أبو حاتم: صالح، وقال ابن عبد البر: ثقة عند الجميع فقيه عالم بالمناسك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
  en: "Abd Allah ibn Abd al-Rahman ibn Abi Husayn al-Qurashi al-Nawfali al-Makki. He transmitted from al-Harith ibn Jumayla, al-Hasan al-Basri, Shahr ibn Hawshab, Tawus ibn Kaysan and Ata ibn Abi Rabah, and was transmitted from by Sufyan ibn Uyayna, al-Thawri, Malik ibn Anas and Ibn Jurayj, among others. Ahmad, al-Nasa'i and Abu Zur'a called him trustworthy; Abu Hatim called him sound; Ibn Abd al-Barr called him trustworthy by consensus, a jurist learned in the rites of pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
