label:
  ar: "عبد الله بن أبي حسين"
  en: "Abd Allah ibn Abi Husayn al-Makki"
  fr: "Abd Allah ibn Abi Husayn al-Makki"
  es: "Abd Allah ibn Abi Husayn al-Makki"
  ur: "عبد اللہ بن ابی حسین المکی"
summary:
  ar: "عبد الله بن عبد الرحمن بن أبي حسين بن الحارث بن عامر بن نوفل القرشي النوفلي المكي. روى عن الحارث بن جميلة والحسن البصري وشهر بن حوشب وطاوس بن كيسان وعطاء بن أبي رباح، وروى عنه جماعة منهم سفيان بن عيينة والثوري ومالك بن أنس وابن جريج. وثّقه أحمد والنسائي وأبو زرعة، وقال أبو حاتم: صالح، وقال ابن عبد البر: ثقة عند الجميع فقيه عالم بالمناسك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
  en: "Abd Allah ibn Abd al-Rahman ibn Abi Husayn al-Qurashi al-Nawfali al-Makki. He transmitted from al-Harith ibn Jumayla, al-Hasan al-Basri, Shahr ibn Hawshab, Tawus ibn Kaysan and Ata ibn Abi Rabah, and was transmitted from by Sufyan ibn Uyayna, al-Thawri, Malik ibn Anas and Ibn Jurayj, among others. Ahmad, al-Nasa'i and Abu Zur'a called him trustworthy; Abu Hatim called him sound; Ibn Abd al-Barr called him trustworthy by consensus, a jurist learned in the rites of pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
  fr: "Abd Allah ibn Abd al-Rahman ibn Abi Husayn al-Qurashi al-Nawfali al-Makki. Il transmit d'al-Harith ibn Jumayla, d'al-Hasan al-Basri, de Shahr ibn Hawshab, de Tawus ibn Kaysan et d'Ata ibn Abi Rabah, et Sufyan ibn Uyayna, al-Thawri, Malik ibn Anas et Ibn Jurayj, entre autres, transmirent de lui. Ahmad, al-Nasa'i et Abu Zur'a le dirent digne de confiance ; Abu Hatim le dit sain ; Ibn Abd al-Barr le dit digne de confiance par consensus, juriste savant dans les rites du pèlerinage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
  es: "Abd Allah ibn Abd al-Rahman ibn Abi Husayn al-Qurashi al-Nawfali al-Makki. Transmitió desde al-Harith ibn Jumayla, al-Hasan al-Basri, Shahr ibn Hawshab, Tawus ibn Kaysan y Ata ibn Abi Rabah, y fue transmitido por Sufyan ibn Uyayna, al-Thawri, Malik ibn Anas e Ibn Jurayj, entre otros. Ahmad, al-Nasa'i y Abu Zur'a lo llamaron digno de confianza; Abu Hatim lo llamó sano; Ibn Abd al-Barr lo llamó digno de confianza por consenso, un jurista versado en los ritos de peregrinación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15395}"
  ur: "عبد اللہ بن عبد الرحمن بن ابی حسین القرشی النفلی المکی۔ اس نے حارث بن جمائلہ، حسن البصری، شہر بن حوشب، طاؤس بن کیسان، اور عطاء بن ابی رباح سے نقل کیا ہے اور اسے سفیان بن عیینہ، الثوری، مالک ابن انس، اور ابن جوری کے علاوہ دوسرے لوگوں سے بھی نقل کیا ہے۔ احمد، النسائی، اور ابو زرعہ نے اسے ثقہ کہا؛ ابو حاتم نے اسے آواز کہا۔ ابن عبد البر نے اسے اجماع سے ثقہ کہا۔ وہ ایک فقیہ تھے جو حج کے مناسک میں سیکھے تھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15395}"
