summary:
  ar: "سياسي وكاتب تتاري قرمي، من قادة الحركة الوطنية التتارية القرمية ومفكريها. تولى وزارة الحربية والخارجية في جمهورية القرم الشعبية سنة 1917 ثم وزارة الخارجية في الحكومة الإقليمية القرمية سنة 1918، وأمضى منفاه في تركيا وأوروبا مناصرا لقضية تتار القرم، واتخذ لقب قريمر سنة 1934، وكتب مطولا عن القرم والثورة الروسية وإسماعيل غاسبرينسكي."
  en: "Crimean Tatar politician and writer, a leader and ideologist of the Crimean Tatar national movement. Minister of war and foreign affairs in the Crimean People's Republic in 1917 and foreign minister in the Crimean Regional Government in 1918, he spent his exile in Turkey and Europe advocating the Crimean Tatar cause, adopted the surname Kırımer in 1934, and wrote extensively on Crimea, the Russian Revolution and Ismail Gasprinsky."
  ur: "کریمیائی تاتاری سیاست دان اور مصنف؛ کریمیائی تاتاری قومی تحریک کے رہنما اور نظریہ ساز۔ 1917 میں جمہوریہ کریمیا کے وزیرِ جنگ و خارجہ اور 1918 میں کریمیائی علاقائی حکومت کے وزیرِ خارجہ رہے؛ جلاوطنی ترکی اور یورپ میں کریمیائی تاتاری قضیے کی وکالت میں گزاری، 1934 میں «قریمر» لقب اختیار کیا اور کریمیا، روسی انقلاب اور اسماعیل گاسپرینسکی پر تفصیل سے لکھا۔"
