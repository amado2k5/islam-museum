label:
  ar: "جعفر سيدامت قريمر"
  en: "Cafer Seydamet Kırımer"
  ur: "جعفر سیدامت قریمر"
  es: "Cafer Seydamet Kırımer"
  fr: "Cafer Seydamet Kırımer"
summary:
  ar: "سياسي وكاتب تتاري قرمي، من قادة الحركة الوطنية التتارية القرمية ومفكريها. تولى وزارة الحربية والخارجية في جمهورية القرم الشعبية سنة 1917 ثم وزارة الخارجية في الحكومة الإقليمية القرمية سنة 1918، وأمضى منفاه في تركيا وأوروبا مناصرا لقضية تتار القرم، واتخذ لقب قريمر سنة 1934، وكتب مطولا عن القرم والثورة الروسية وإسماعيل غاسبرينسكي."
  en: "Crimean Tatar politician and writer, a leader and ideologist of the Crimean Tatar national movement. Minister of war and foreign affairs in the Crimean People's Republic in 1917 and foreign minister in the Crimean Regional Government in 1918, he spent his exile in Turkey and Europe advocating the Crimean Tatar cause, adopted the surname Kırımer in 1934, and wrote extensively on Crimea, the Russian Revolution and Ismail Gasprinsky."
  ur: "کریمیائی تاتاری سیاست دان اور مصنف؛ کریمیائی تاتاری قومی تحریک کے رہنما اور نظریہ ساز۔ 1917 میں جمہوریہ کریمیا کے وزیرِ جنگ و خارجہ اور 1918 میں کریمیائی علاقائی حکومت کے وزیرِ خارجہ رہے؛ جلاوطنی ترکی اور یورپ میں کریمیائی تاتاری قضیے کی وکالت میں گزاری، 1934 میں «قریمر» لقب اختیار کیا اور کریمیا، روسی انقلاب اور اسماعیل گاسپرینسکی پر تفصیل سے لکھا۔"
  es: "Político y escritor tártaro de Crimea, líder e ideólogo del movimiento nacional tártaro de Crimea. Ministro de Guerra y Asuntos Exteriores en la República Popular de Crimea en 1917 y ministro de Asuntos Exteriores en el Gobierno Regional de Crimea en 1918, pasó su exilio en Turquía y Europa defendiendo la causa tártara de Crimea, adoptó el apellido Kırımer en 1934 y escribió extensamente sobre Crimea, la Revolución Rusa e Ismail Gasprinsky."
  fr: "Homme politique et écrivain tatar de Crimée, chef et idéologue du mouvement national tatar de Crimée. Ministre de la Guerre et des Affaires étrangères de la République populaire de Crimée en 1917 et ministre des Affaires étrangères du gouvernement régional de Crimée en 1918, il passa son exil en Turquie et en Europe à défendre la cause tatare de Crimée, adopta le nom de famille Kırımer en 1934 et écrivit abondamment sur la Crimée, la révolution russe et Ismail Gasprinsky."
  tr: "Kırım Tatar siyasetçisi ve yazarı, Kırım Tatar ulusal hareketinin liderlerinden ve düşünürlerinden biriydi. 1917'de Kırım Halk Cumhuriyeti'nde Savaş ve Dışişleri Bakanı olarak, ardından 1918'de Kırım Bölgesel Hükümeti'nde Dışişleri Bakanı olarak görev yaptı. Sürgününü Türkiye ve Avrupa'da Kırım Tatar davasını destekleyerek geçirdi ve 1934'te Kırım unvanını aldı. Kırım, Rus Devrimi ve İsmail Gasperinsky hakkında kapsamlı yazılar yazdı."
  id: "Seorang politikus dan penulis Tatar Krimea, salah satu pemimpin dan pemikir gerakan nasional Tatar Krimea. Ia menjabat sebagai Menteri Perang dan Urusan Luar Negeri di Republik Rakyat Krimea pada tahun 1917, lalu Menteri Luar Negeri di Pemerintah Regional Krimea pada tahun 1918. Ia menghabiskan masa pengasingannya di Turki dan Eropa mendukung perjuangan Tatar Krimea, mengambil gelar Krimea pada tahun 1934. Ia menulis secara luas tentang Krimea, Revolusi Rusia, dan Ismail Gasperinsky."
