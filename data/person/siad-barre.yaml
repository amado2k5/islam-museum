summary:
  ar: "ضابط وسياسي صومالي (نحو 1919–1995) قاد انقلاب 1969 العسكري وترأس الصومال من 21 أكتوبر 1969 إلى 26 يناير 1991 على رأس مجلس ثوري ثم حزب اشتراكي حاول التوفيق بين الاشتراكية العلمية والمبادئ الإسلامية؛ خاض حرب أوغادين (1977–1978) وقمعا واسعا، وأُطيح به في 1991 فمات في المنفى في لاغوس بنيجيريا."
  en: "Somali military officer and politician (c. 1919–1995) who led the 1969 military coup and ruled Somalia from 21 October 1969 to 26 January 1991, first through a revolutionary council and then a socialist party that tried to reconcile scientific socialism with Islamic principles; he fought the Ogaden War (1977–1978), ruled repressively, was overthrown in 1991 and died in exile in Lagos, Nigeria."
  ur: "صومالی فوجی افسر و سیاست دان (تقریباً 1919ء–1995ء) جنھوں نے 1969ء کی فوجی بغاوت کی قیادت کی اور 21 اکتوبر 1969ء سے 26 جنوری 1991ء تک صومالیہ پر حکومت کی، پہلے انقلابی کونسل اور پھر ایک اشتراکی پارٹی کے ذریعے جس نے سائنسی اشتراکیت اور اسلامی اصولوں میں مطابقت پیدا کرنے کی کوشش کی؛ اوگادن جنگ (1977ء–1978ء) لڑی، جابرانہ حکومت کی، 1991ء میں ہٹائے گئے اور نائجیریا کے لاگوس میں جلاوطنی میں وفات پائی۔"
