summary:
  ar: "ضابط وسياسي صومالي ⁦(نحو 1919–1995)⁩ قاد انقلاب 1969 العسكري وترأس الصومال من 21 أكتوبر 1969 إلى 26 يناير 1991 على رأس مجلس ثوري ثم حزب اشتراكي حاول التوفيق بين الاشتراكية العلمية والمبادئ الإسلامية؛ خاض حرب أوغادين (1977–1978) وقمعا واسعا، وأُطيح به في 1991 فمات في المنفى في لاغوس بنيجيريا."
  en: "Somali military officer and politician (c. 1919–1995) who led the 1969 military coup and ruled Somalia from 21 October 1969 to 26 January 1991, first through a revolutionary council and then a socialist party that tried to reconcile scientific socialism with Islamic principles; he fought the Ogaden War (1977–1978), ruled repressively, was overthrown in 1991 and died in exile in Lagos, Nigeria."
  ur: "صومالی فوجی افسر و سیاست دان ⁦(تقریباً 1919ء–1995ء)⁩ جنھوں نے 1969ء کی فوجی بغاوت کی قیادت کی اور 21 اکتوبر 1969ء سے 26 جنوری 1991ء تک صومالیہ پر حکومت کی، پہلے انقلابی کونسل اور پھر ایک اشتراکی پارٹی کے ذریعے جس نے سائنسی اشتراکیت اور اسلامی اصولوں میں مطابقت پیدا کرنے کی کوشش کی؛ اوگادن جنگ ⁦(1977ء–1978ء)⁩ لڑی، جابرانہ حکومت کی، 1991ء میں ہٹائے گئے اور نائجیریا کے لاگوس میں جلاوطنی میں وفات پائی۔"
  es: "Oficial militar y político somalí (c. 1919–1995) que lideró el golpe militar de 1969 y gobernó Somalia desde el 21 de octubre de 1969 hasta el 26 de enero de 1991, primero a través de un consejo revolucionario y luego de un partido socialista que intentó reconciliar el socialismo científico con los principios islámicos; luchó en la guerra de Ogaden (1977–1978), gobernó de forma represiva, fue derrocado en 1991 y murió en el exilio en Lagos, Nigeria."
  fr: "Officier militaire et homme politique somalien (vers 1919-1995) qui a mené le coup d'État militaire de 1969 et dirigé la Somalie du 21 octobre 1969 au 26 janvier 1991, d'abord par le biais d'un conseil révolutionnaire puis d'un parti socialiste qui a tenté de concilier le socialisme scientifique avec les principes islamiques; il a combattu lors de la guerre de l'Ogaden (1977-1978), a gouverné de manière répressive, a été renversé en 1991 et est mort en exil à Lagos, au Nigeria."
  tr: "Somalili bir subay ve siyasetçi olan Scully, 1969 askeri darbesine liderlik etti ve 21 Ekim 1969'dan 26 Ocak 1991'e kadar Somali'yi yönetti; devrimci bir konseyin başında, ardından bilimsel sosyalizmi İslami ilkelerle uzlaştırmaya çalışan bir sosyalist partinin başında bulundu; Ogaden Savaşı'nda (1977–1978) ve yaygın baskıya katıldı, 1991'de devrildi ve Lagos, Nijerya'da sürgünde öldü."
  id: "Seorang perwira dan politisi Somalia (sekitar 1919–1995), ia memimpin kudeta militer 1969 dan memimpin Somalia dari 21 Oktober 1969 hingga 26 Januari 1991, memimpin dewan revolusioner dan kemudian partai sosialis yang berusaha mendamaikan sosialisme ilmiah dengan prinsip-prinsip Islam; ia bertempur dalam Perang Ogaden (1977–1978) dan penindasan yang meluas, digulingkan pada tahun 1991, dan meninggal dalam pengasingan di Lagos, Nigeria."
