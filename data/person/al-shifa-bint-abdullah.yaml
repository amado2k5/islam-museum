summary:
  ar: من المهاجرات الأول، أسلمت قبل الهجرة وبايعت؛ كانت من عقلاء النساء وفضلائهن، وكان النبي يزورها ويقيل عندها، وعلّمت حفصة الكتابة، وكان عمر يقدمها في الرأي وربما ولاها شيئاً من أمر السوق.
  en: One of the first emigrants, she embraced Islam before the Hijra and gave her pledge; counted among the wise and virtuous of women, the Prophet visited her and took his midday rest at her house, she taught Hafsa to write, and Umar valued
    her opinion and at times put her in charge of something in the market.
