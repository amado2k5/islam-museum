summary:
  ar: من المهاجرات الأول، أسلمت قبل الهجرة وبايعت؛ كانت من عقلاء النساء وفضلائهن، وكان النبي يزورها ويقيل عندها، وعلّمت حفصة الكتابة، وكان عمر يقدمها في الرأي وربما ولاها شيئاً من أمر السوق.
  en: One of the first emigrants, she embraced Islam before the Hijra and gave her pledge; counted among the wise and virtuous of women, the Prophet visited her and took his midday rest at her house, she taught Hafsa to write, and Umar valued
    her opinion and at times put her in charge of something in the market.
  fr: "L'un des premiers émigrants, elle a embrassé l'islam avant l'Hégire et a donné son serment ; compté parmi les sages et vertueux des femmes, le Prophète lui a rendu visite et a pris son repos de midi à sa maison, elle a appris à Hafsa à écrire, et Umar évalué son opinion et parfois mis en charge de quelque chose sur le marché."
  ur: "پہلی مہاجروں میں سے، ہجرت سے پہلے مسلمان ہوئیں اور بیعت کی؛ عقلمند اور نیک خواتین میں شمار ہوتی تھیں اور نبی ان سے ملتے تھے۔"
  es: "Fue una de las primeras emigrantes, abrazó el Islam antes de la Hégira e hizo su juramento; contada entre las mujeres sabias y virtuosas, el Profeta la visitó y tomó su descanso del mediodía en su casa, ella enseñó a Hafsa a escribir, y Umar valoraba su opinión y en ocasiones la ponía a cargo de algo en el mercado."
  tr: "Hicre öncesinde İslam'ı kabul eden ve itaat eden ilk göçmenlerden biriydi; bilge ve erdemli kadınlar arasındaydı. Peygamber onu ziyaret eder ve onunla konuşurdu. Hafsa yazmayı öğrendi, Ömer ona üstünlük sağladı ve belki de pazar işlerinden bazılarını ona emanet etti."
  id: "Dia termasuk di antara emigran pertama yang memeluk Islam sebelum Hijrah dan bersumpah setia; dia termasuk wanita bijaksana dan berbudi luhur. Nabi biasa mengunjunginya dan berbicara dengannya. Hafsa belajar menulis, dan Umar memberinya keunggulan dalam pendapat dan mungkin mempercayakan beberapa urusan pasar kepadanya."
