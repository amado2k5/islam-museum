roles: [poet, writer]
gender: male
summary:
  ar: "عمر بن محمد بن حسن، أبو حفص، سراج الدين الوراق، شاعر مصر في عصره وكاتب واليها الأمير يوسف بن سباسلار، له ديوان شعر كبير في سبعة مجلدات اختار منه الصفدي لمع السراج، توفي بالقاهرة سنة 695 هـ."
  en: "Umar ibn Muhammad ibn Hasan, Abu Hafs, Siraj al-Din al-Warraq, the poet of Egypt in his age and secretary to its governor, the emir Yusuf ibn Sabasalar; his large diwan in seven volumes was the source of al-Safadi's selection Lum' al-Siraj; died in Cairo in 695 AH (1296)."
  es: "Umar ibn Muhammad ibn Hasan, Abu Hafs, Siraj al-Din al-Warraq, el poeta de Egipto en su época y secretario de su gobernador, el emir Yusuf ibn Sabasalar; su gran diwan en siete volúmenes fue la fuente de la selección de al-Safadi, Lum' al-Siraj; murió en El Cairo en el año 695 de la Hégira (1296)."
  fr: "Umar ibn Muhammad ibn Hasan, Abu Hafs, Siraj al-Din al-Warraq, le poète de l'Égypte de son temps et secrétaire de son gouverneur, l'émir Yusuf ibn Sabasalar; son grand diwan en sept volumes a été la source de la sélection Lum' al-Siraj d'al-Safadi; mort au Caire en 695 AH (1296)."
  ur: "عمر بن محمد بن حسن، ابو حفص، سراج الدین الوراق، اپنی عمر میں مصر کے شاعر اور اس کے گورنر، امیر یوسف ابن سبسالار کے سیکرٹری؛ سات جلدوں میں ان کا بڑا دیوان الصفدی کے انتخاب لم السراج کا ماخذ تھا۔ 695ھ (1296) میں قاہرہ میں وفات پائی۔"
