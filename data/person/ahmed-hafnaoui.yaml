summary:
  ar: "سبّاح تونسي، وُلد في المتلوي سنة 2002. فجّر مفاجأة أولمبياد طوكيو 2020 بفوزه بذهبية 400 متر حرة من الحارة الثامنة، ثم فاز بذهبيتي 800 و1500 متر وفضية 400 متر في بطولة العالم بفوكوكا 2023، وهو حامل الأرقام القياسية الأفريقية في السباحة الحرة."
  en: "Tunisian swimmer, born in Métlaoui in 2002. He produced the upset of the Tokyo 2020 Olympics by winning the 400 m freestyle gold from lane 8, then won the 800 m and 1500 m golds and the 400 m silver at the Fukuoka 2023 World Championships; he holds the African freestyle records."
  ur: "تیونس کے تیراک، 2002 میں میتلاوی میں پیدا ہوئے۔ انہوں نے ٹوکیو 2020 اولمپکس میں لین 8 سے 400 میٹر فری اسٹائل کا سونا جیت کر سب کو حیران کر دیا، پھر فوکوکا 2023 عالمی چیمپئن شپ میں 800 اور 1500 میٹر کے سونے اور 400 میٹر کی چاندی جیتی؛ افریقی فری اسٹائل ریکارڈ ان کے پاس ہیں۔"
