summary:
  ar: "ابن الوزير نظام الملك الطوسي؛ دخل بغداد سنة ثمان وستين وأربعمائة لتزوّجه بابنة السلطان، وانصرف إلى دار بناها والده مع المدرسة ومضى الوزير إليه في موكب {cite:muntazam-ibn-al-jawzi j.8 p.641}. حضر بيعة المقتدي سنة ٤٦٧، وفي فتنة سوق المدرسة سنة ٤٧٠ خاف على داره فأرسل إلى العميد أبي نصر فأنفذ إليه الديلم والحرسانية، وفتح تكريت {cite:muntazam-ibn-al-jawzi j.8 p.634,655,668}."
  en: "Son of the vizier Nizam al-Mulk: came to Baghdad in 468 for his marriage to the sultan's daughter and took up the palace his father had built beside the madrasa; present at al-Muqtadi's bay'a in 467, defended his quarter in the 470 madrasa-market riot, and took Tikrit for the sultan {cite:muntazam-ibn-al-jawzi j.8 p.634,641,655,668}."
  es: "Hijo del visir Nizam al-Mulk: llegó a Bagdad en 468 para su matrimonio con la hija del sultán y ocupó el palacio que su padre había construido junto a la madrasa; estuvo presente en la bay'a de al-Muqtadi en 467, defendió su barrio en el motín de la madrasa-mercado de 470 y tomó Tikrit para el sultán {cite:muntazam-ibn-al-jawzi j.8 p.634,641,655,668}."
  fr: "Fils du vizir Nizam al-Mulk: il arriva à Bagdad en 468 pour son mariage avec la fille du sultan et s'installa dans le palais que son père avait fait construire à côté de la madrasa; présent à la bay'a d'al-Muqtadi en 467, défendit son quartier lors de l'émeute du marché de la madrasa en 470 et prit Tikrit pour le sultan {cite: muntazam-ibn-al-jawzi j.8 p.634,641,655,668}."
  ur: "وزیر نظام الملک کا بیٹا: سلطان کی بیٹی سے شادی کے لیے 468 میں بغداد آیا اور اس محل کو لے لیا جو اس کے والد نے مدرسے کے ساتھ بنایا تھا۔ 467 میں مقتدی کی بیع میں موجود، 470 مدرسہ بازار فسادات میں اپنے کوارٹر کا دفاع کیا، اور سلطان کے لیے تکریت لے گیا"
  tr: "Bakan Nizam al-Mulk al-Tusi'nin oğlu; 468 Hicri yılında Sultan'ın kızıyla evlenmek üzere Bağdat'a girdi. Babası okulla birlikte inşa ettirdiği bir eve gitti ve vezir ona bir alay ile geldi {atıf:Muntazam-ibn-al-jawzi J.8 s.641}. 467 Hicri'de bağlılık yemini etti ve 470 Hicri'deki okul pazarındaki kargaşa sırasında evinden endişe etti ve Tuğgeneral Ebu Nasr'a gönderdi; o da Daylam ve Hursaniya seferlerini yürüttü ve Tikrit'i ele geçirdi {atıf:Muntazam-ibn-al-jawzi J.8 s.634,655,668}."
  id: "Putra menteri Nizam al-Mulk al-Tusi; ia memasuki Baghdad pada tahun 468 H untuk menikahi putri Sultan. Ia pergi ke sebuah rumah yang dibangun ayahnya dengan sekolah, dan wazir datang kepadanya dalam prosesi {cite:Muntazam-ibn-al-jawzi J.8 hlm.641}. Ia menghadiri sumpah setia pada tahun 467 H, dan selama kekacauan pasar sekolah pada 470 H, ia takut akan rumahnya dan mengirim kepada Brigadir Jenderal Abu Nasr, yang melaksanakan kampanye Daylam dan Hursaniya kepadanya, dan ia merebut Tikrit {cite:Muntazam-ibn-al-jawzi J.8 hlm.634,655,668}."
