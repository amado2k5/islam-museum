summary:
  ar: "ابن الوزير نظام الملك الطوسي؛ دخل بغداد سنة ثمان وستين وأربعمائة لتزوّجه بابنة السلطان، وانصرف إلى دار بناها والده مع المدرسة ومضى الوزير إليه في موكب {cite:muntazam-ibn-al-jawzi j.8 p.641}. حضر بيعة المقتدي سنة ٤٦٧، وفي فتنة سوق المدرسة سنة ٤٧٠ خاف على داره فأرسل إلى العميد أبي نصر فأنفذ إليه الديلم والحرسانية، وفتح تكريت {cite:muntazam-ibn-al-jawzi j.8 p.634,655,668}."
  en: "Son of the vizier Nizam al-Mulk: came to Baghdad in 468 for his marriage to the sultan's daughter and took up the palace his father had built beside the madrasa; present at al-Muqtadi's bay'a in 467, defended his quarter in the 470 madrasa-market riot, and took Tikrit for the sultan {cite:muntazam-ibn-al-jawzi j.8 p.634,641,655,668}."
