summary:
  ar: "أبان بن تغلب بن رباح البكري الجريري بالولاء، أبو سعيد، قارئ لغوي من أهل الكوفة، يعده الزركلي من غلاة الشيعة، توفي سنة 141 هـ الموافقة 758 م."
  en: "Aban ibn Taghlib ibn Rabah al-Bakri al-Jariri by clientage, Abu Sa'id, a reciter and linguist of Kufa whom al-Zirikli counts among the extreme Shi'a (ghulat al-Shi'a); he died in 141 AH (758 CE)."
  fr: "Aban ibn Taghlib ibn Rabah al-Bakri al-Jariri par clientèle, Abu Sa'id, lecteur du Coran et linguiste de Koufa qu'al-Zirikli compte parmi les chiites extrémistes (ghulat al-Shi'a) ; il mourut en 141 H (758 ap. J.-C.)."
  es: "Aban ibn Taghlib ibn Rabah al-Bakri al-Jariri por cliente, Abu Sa'id, un recitador y lingüista de Kufa a quien al-Zirikli cuenta entre los chiítas extremos (ghulat al-Shi'a); Murió en el año 141 d. H. (758 d. C.)."
  ur: "ابان ابن تغلب ابن رباح البکری الجریری بذریعہ مؤکل، ابو سعید، کوفہ کے ایک قاری اور ماہر لسانیات جن کا شمار الزرکلی کا شمار انتہائی شیعہ ⁦(غلط الشیعہ)⁩ میں ہوتا ہے۔ آپ کی وفات 141ھ ⁦(758ء)⁩ میں ہوئی۔"
  tr: "Aban ibn Taghlib ibn Rabah al-Bakri al-Jariri (mezhebi gereği), Kufa halkından bir dilbilimci ve Kur'an okuyucusu olan Ebu Said'dir. El-Zarkali onu aşırı Şiiler arasında sayar. Hicri 141 yılında, yani Miladi 758 yılında vefat etmiştir."
  id: "Aban ibn Taghlib ibn Rabah al-Bakri al-Jariri, yang juga dikenal dengan nama Abu Saeed, adalah seorang ahli bahasa dan pembaca Al-Quran dari Kufa. Al-Zarkali menganggapnya sebagai salah satu kelompok Syiah ekstremis. Ia meninggal pada tahun 141 Hijriah, yang bertepatan dengan tahun 758 Masehi."
