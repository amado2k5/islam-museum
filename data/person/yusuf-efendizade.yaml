summary:
  ar: عبد الله بن محمد بن يوسف الحنفي الرومي، المعروف بيوسف زاده وبعبد الله حلمي والاماسي، عالم عثماني بالتفسير والقراءات والحديث، ولد في أماسية سنة 1085 هـ وتوفي في الأستانة سنة 1167 هـ الموافقة 1754 م، له شرحان على مسلم والبخاري وحواش ونظم بثلاث لغات.
  en: Abd Allah ibn Muhammad ibn Yusuf al-Hanafi al-Rumi, known as Yusufzade, Abd Allah Hilmi and al-Amasi, an Ottoman scholar of exegesis, the readings and hadith; born in Amasya in 1085 AH (1674 CE), died in Istanbul in 1167 AH (1754 CE); author of commentaries on Muslim and al-Bukhari, glosses, and verse in three languages.
