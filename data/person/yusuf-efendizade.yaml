summary:
  ar: عبد الله بن محمد بن يوسف الحنفي الرومي، المعروف بيوسف زاده وبعبد الله حلمي والاماسي، عالم عثماني بالتفسير والقراءات والحديث، ولد في أماسية سنة 1085 هـ وتوفي في الأستانة سنة 1167 هـ الموافقة 1754 م، له شرحان على مسلم والبخاري وحواش ونظم بثلاث لغات.
  en: Abd Allah ibn Muhammad ibn Yusuf al-Hanafi al-Rumi, known as Yusufzade, Abd Allah Hilmi and al-Amasi, an Ottoman scholar of exegesis, the readings and hadith; born in Amasya in 1085 AH (1674 CE), died in Istanbul in 1167 AH (1754 CE); author of commentaries on Muslim and al-Bukhari, glosses, and verse in three languages.
  es: "Abd Allah ibn Muhammad ibn Yusuf al-Hanafi al-Rumi, conocido como Yusufzade, Abd Allah Hilmi y al-Amasi, fue un erudito otomano de exégesis, lecturas y hadices; nació en Amasya en 1085 AH (1674 d. C.) y murió en Estambul en 1167 AH (1754 d. C.); fue autor de comentarios sobre Muslim y al-Bukhari, glosas y versos en tres idiomas."
  fr: "Abd Allah ibn Muhammad ibn Yusuf al-Hanafi al-Rumi, connu sous les noms de Yusufzade, Abd Allah Hilmi et al-Amasi, un érudit ottoman d'exégèse, de lectures et de hadiths; né à Amasya en 1085 AH (1674 CE), mort à Istanbul en 1167 AH (1754 CE); auteur de commentaires sur Muslim et al-Bukhari, de gloses et de versets en trois langues."
