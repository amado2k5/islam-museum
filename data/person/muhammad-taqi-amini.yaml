summary:
  ar: "عالم هندي سني وفقيه ومؤلف باللغة الأردية (1926–1991). كان عميد كلية اللاهوت في جامعة عليكرة الإسلامية، واشتهر بأعماله في الفقه الإسلامي، ومنها كتابه «فقہ اسلامی کا تاریخی پس منظر»."
  en: "Indian Sunni Islamic scholar, jurist and Urdu author (1926–1991). He was dean of the Faculty of Theology at Aligarh Muslim University and is known for his works on Islamic jurisprudence, including Fiqh-e-Islami Ka Tareekhi Pas-e-Manzar."
  ur: "ہندوستانی سنی عالم، فقیہ اور اردو مصنف (1926ء–1991ء)۔ وہ علی گڑھ مسلم یونیورسٹی کے کلیہ دینیات کے ڈین رہے اور فقہ اسلامی پر اپنی تصانیف، خصوصاً «فقہ اسلامی کا تاریخی پس منظر» کے لیے مشہور ہیں۔"
