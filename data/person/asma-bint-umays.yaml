summary:
  ar: صحابية من الخثعميين، هاجرت إلى الحبشة وكانت زوجة لجعفر بن أبي طالب؛ لما أُصيب زوجها بمؤتة جاء النبي إلى بيتها وطلب أبناء جعفر، فلما رآهم تشممهم وذرفت عيناه، وأخبرها باستشهاده. وأمها العجوز الحريشية التي أكرم الناس أصهاراً لأن بناتها الأربع كن ميمونة تحت النبي وأم الفضل تحت العباس وسلمى تحت حمزة وأسماء تحت جعفر ثم أبي بكر فخلف منها محمداً ثم علي فأولدها أولاداً درجوا {cite:muruj-al-dhahab p. 597}
  en: Companion, wife of Ja'far ibn Abi Talib. When Ja'far was killed at Mu'tah the Prophet visited her home, asked for Ja'far's children, smelled them and wept, then told her of his martyrdom.
