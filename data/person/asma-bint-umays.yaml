  ar: صحابية من الخثعميين، هاجرت إلى الحبشة وكانت زوجة لجعفر بن أبي طالب؛ لما أُصيب زوجها بمؤتة جاء النبي إلى بيتها وطلب أبناء جعفر، فلما رآهم تشممهم وذرفت عيناه، وأخبرها باستشهاده.
