summary:
  ar: "صحابية، زوجة جعفر بن أبي طالب؛ لما أُصيب زوجها بمؤتة جاء النبي إلى بيتها وطلب أبناء جعفر، فلما رآهم تشممهم وذرفت عيناه، وأخبرها باستشهاده. رَوَت وصيّته بإطعام آل جعفر."
  en: "Companion, wife of Ja'far ibn Abi Talib. When Ja'far was killed at Mu'tah the Prophet visited her home, asked for Ja'far's children, smelled them and wept, then told her of his martyrdom. She transmitted the Prophet's instruction to provide food for Ja'far's household."
