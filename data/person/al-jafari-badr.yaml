gender: male
summary:
  ar: "قاضي القضاة بدر الدين الجعفري النابلسي الحنبلي؛ ولد سنة اثنتين وقيل إحدى وتسعين وسبعمائة ونشأ على طريقة حسنة وهو من بيت علم ورياسة وسمع من جده وابن العلائي وجماعة وباشر القضاء بنابلس نيابة عن ابن عمه القاضي تاج الدين عبد الوهاب ثم وليها استقلالاً بعد الأربعين وثمانمائة عوضاً عن القاضي شمس الدين بن الإمام ثم أضيف إليه قضاء القدس مدة ثم عزل من القدس واستمر قاضياً بنابلس وولي أيضاً قضاء الرملة ونيابة الحكم بالديار المصرية وكان حسن السيرة عفيفاً في مباشرة القضاء له هيبة عند الناس حسن الشكل عليه أبهة ووقار رزق الأولاد وألحق الأحفاد بالأجداد ومتع بدنياه وعزل عن القضاء في أواخر عمره واستمر معزولاً إلى أن توفي بنابلس يوم الخميس سادس عشر شهر رمضان سنة إحدى وثمانين وثمانمائة وله نحو التسعين سنة {cite:shadharat-dhahab p. 333-334}."
  en: "Al-Ja'fari (b. ~791) — from the house of knowledge and riyasa; qadi of Nablus, Jerusalem, Ramla and deputy of Egypt in turn, 'of good conduct, chaste in office'; dismissed in old age, died at Nablus Thursday 16 Ramadan 881 near ninety {cite:shadharat-dhahab p. 333-334}."
