gender: male
summary:
  ar: "قاضي القضاة بدر الدين الجعفري النابلسي الحنبلي؛ ولد سنة اثنتين وقيل إحدى وتسعين وسبعمائة ونشأ على طريقة حسنة وهو من بيت علم ورياسة وسمع من جده وابن العلائي وجماعة وباشر القضاء بنابلس نيابة عن ابن عمه القاضي تاج الدين عبد الوهاب ثم وليها استقلالاً بعد الأربعين وثمانمائة عوضاً عن القاضي شمس الدين بن الإمام ثم أضيف إليه قضاء القدس مدة ثم عزل من القدس واستمر قاضياً بنابلس وولي أيضاً قضاء الرملة ونيابة الحكم بالديار المصرية وكان حسن السيرة عفيفاً في مباشرة القضاء له هيبة عند الناس حسن الشكل عليه أبهة ووقار رزق الأولاد وألحق الأحفاد بالأجداد ومتع بدنياه وعزل عن القضاء في أواخر عمره واستمر معزولاً إلى أن توفي بنابلس يوم الخميس سادس عشر شهر رمضان سنة إحدى وثمانين وثمانمائة وله نحو التسعين سنة {cite:shadharat-dhahab p. 333-334}."
  en: "Al-Ja'fari (b. ~791) — from the house of knowledge and riyasa; qadi of Nablus, Jerusalem, Ramla and deputy of Egypt in turn, 'of good conduct, chaste in office'; dismissed in old age, died at Nablus Thursday 16 Ramadan 881 near ninety {cite:shadharat-dhahab p. 333-334}."
  es: "Al-Ja'fari (n. ~791) — de la casa del conocimiento y la riyasa; cadí de Nablus, Jerusalén, Ramla y diputado de Egipto sucesivamente, 'de buena conducta, casto en el cargo'; destituido en la vejez, murió en Nablus el jueves 16 de Ramadán de 881 cerca de los noventa {cita: shadharat-dhahab p. 333-334}."
  fr: "Al-Ja'fari (né vers 791) — de la maison de la connaissance et du riyasa; cadi de Naplouse, Jérusalem, Ramla et député d'Égypte tour à tour, « de bonne conduite, chaste dans sa fonction »; renvoyé à un âge avancé, mort à Naplouse le jeudi 16 Ramadan 881 près de quatre-vingt-dix ans {cite: shadharat-dhahab p. 333-334}."
  ur: "الجعفری (b. ~ 791) - علم و ریاضت کے گھر سے؛ نابلس، یروشلم، رملہ کا قاضی اور مصر کا نائب، 'اچھے اخلاق کا، عہدہ پر پاکیزہ'؛ بڑھاپے میں معزول ہوئے، جمعرات 16 رمضان 881ھ کو نوے کے قریب نابلس میں وفات پائی۔ 333-334}۔"
  tr: "Baş Yargıç Badr al-Din al-Ja'fari al-Nabulsi al-Hanbali; 2. yılda doğdu, bazılarına göre 791 H. İyi davranışlı ve yargı görevlerinde iffetliydi, insanlar arasında saygı görüyordu, onur ve onura sahipti, çocuklara bakıyor, torunlarına büyükanne ve büyükbaba eşlik ediyor, dünyevi hayatının tadını çıkarıyor ve ilerleyen yıllarında yargı görevlerinden uzaklaştırılmıştı. Ramazan'ın on altıncı Perşembe günü, sekiz yüz seksen birinci yılında, yaklaşık doksan yaşındayken, Nablus'ta vefat edene kadar izole kaldı. {kaynak: Shadharat-Dhahab, s. 333-334}."
  id: "Ketua Hakim Badr al-Din al-Ja'fari al-Nabulsi al-Hanbali; lahir pada tahun ke-2, atau beberapa orang mengatakan 791 H, dan tumbuh dengan baik. Ia berasal dari keluarga yang berpengetahuan dan memimpin, dan mendengar kabar dari kakeknya, Ibn al-'Alai, serta kelompoknya. Ia mulai menjabat sebagai hakim di Nablus atas nama sepupunya, Hakim Taj al-Din Abd al-Wahhab, kemudian merdeka setelah tahun 840 H, menggantikan Hakim Shams al-Din ibn al-Imam. Ia kemudian dimasukkan ke pengadilan Yerusalem untuk sementara waktu, kemudian diberhentikan dari Yerusalem dan melanjutkan sebagai hakim di Nablus. Ia juga memegang kehakiman Ramla dan wakil gubernur di Mesir. Ia berperilaku baik dan suci dalam tugas kehakimannya, dihormati oleh masyarakat, memiliki martabat dan martabat, menafkahi anak-anak, menemani cucu-cucu oleh kakek-nenek, menikmati kehidupan duniawinya, dan diberhentikan dari tugas yudisial di tahun-tahun terakhirnya. Ia tetap terisolasi hingga meninggal di Nablus pada hari Kamis, tanggal enam belas Ramadan, tahun delapan ratus delapan puluh satu, dan usianya sekitar sembilan puluh tahun. {cite:Shadharat-Dhahab, hlm. 333-334}."
