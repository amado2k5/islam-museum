summary:
  ar: "زكريا زاده يحيى أفندي ⁦(١٥٦١–١٦٤٤م)⁩، نجل شيخ الإسلام بيرم زاده زكريا أفندي، عالم وفقيه عثماني تولّى مشيخة الإسلام ثلاث مرات في عهود مصطفى الأول ومراد الرابع وإبراهيم، ومن كبار أساتذة الغزل في الشعر الديواني التركي الكلاسيكي."
  en: "Zekeriyazade Yahya Efendi (1561–1644), son of Shaykh al-Islam Bayramzade Zekeriya Efendi, was an Ottoman scholar and jurist who held the Shaykh al-Islamate for three terms under Mustafa I, Murad IV and Ibrahim, and one of the great ghazal masters of classical Turkish divan poetry."
faith:
