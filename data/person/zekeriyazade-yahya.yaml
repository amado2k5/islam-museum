    note: "No text read for this record names a madhhab for Yahya Efendi personally. He rose through the Ottoman learned hierarchy and held the Shaykh al-Islamate — the chief mufti's office of a Hanafi establishment — for three terms, but office and milieu are not attestation, so his faith is recorded unknown. The Hanafi character of the institution he headed is stated in the prose, not in this field."
