summary:
  ar: "هوذة بن علي الحنفي صاحب اليمامة، لُقب ذا التاج لأن كسرى دعا بعقد من در فعقد على رأسه؛ اصحب أصحاب العير إلى كسرى بعد واقعة أموال وهرز وكان في إذاعة أمر بني تميم إليه فقال لكسرى لا بيننا إلا الموت، واستوهب من المكعبر عامل البحرين مائة أسير من بني تميم يوم المشقر فأطلقهم {cite:kamil-ibn-al-athir p. 349}."
  en: "Hawdha ibn Ali of Banu Hanifa, lord of al-Yamama, surnamed dhu al-taj for the pearl-diadem Khusraw bound on his head; he brought the plundered convoy's owners to Khusraw, declared of Tamim 'only death lies between us', yet begged a hundred Tamimi captives at al-Mushaqqar and freed them {cite:kamil-ibn-al-athir p. 349}."
  es: "Hawdha ibn Ali de Banu Hanifa, señor de al-Yamama, apodado dhu al-taj por la diadema de perlas que Khusraw le colocó en la cabeza; llevó a los dueños del convoy saqueado ante Khusraw, declaró sobre Tamim que \"solo la muerte nos separa\", pero suplicó a cien cautivos de Tamim en al-Mushaqqar y los liberó {cite:kamil-ibn-al-athir p. 349}."
  fr: "Hawdha ibn Ali de Banu Hanifa, seigneur d'al-Yamama, surnommé dhu al-taj pour le diadème de perles que Khusraw portait sur sa tête; il amena les propriétaires du convoi pillé à Khusraw, déclara à propos de Tamim « seule la mort nous sépare », mais implora une centaine de captifs Tamimi à al-Mushaqqar et les libéra {cite: kamil-ibn-al-athir p. 349}."
  ur: "بنو حنیفہ کے حوادہ ابن علی، یمامہ کے آقا، اپنے سر پر موتی خسرو کے لیے ذو التاج کا لقب رکھتے تھے۔ وہ لوٹے ہوئے قافلے کے مالکان کو خسرو لے آیا، تمیم کے بارے میں اعلان کیا کہ 'ہمارے درمیان صرف موت ہے'، پھر بھی اس نے المشقار میں سو تمیمی اسیروں کی بھیک مانگی اور انہیں آزاد کرایا۔ 349}۔"
  tr: "Al-Yamama'nın sahibi Hudha ibn Ali el-Hanafi, Dürr'den bir kolye istediği için 'Tacın Sahibi' lakabını aldı ve Dürr'den bir kolye istedi ve başına bir sözleşme yaptı. Amwal ve Wasz olayından sonra, Banu Tamim'in işlerini ona aktarırken deve sahiplerine Khosrow'a eşlik etti. Khosrow'a, 'Aramızda ölümden başka bir şey yok.' dedi. Bahreyn valisi al-Makabbar'dan, el-Maşkar gününde Banu Tamim'den yüz esir gönderdi ve serbest bıraktı {cite:kamil-ibn-al-athir s. 349}."
  id: "Hudha ibn Ali al-Hanafi, pemilik Al-Yamama, dijuluki 'Pemilik Mahkota' karena Khosrow meminta kalung dari Durr, dan dia membuat kontrak atas kepalanya. Dia menemani para pemilik unta ke Khosrow setelah insiden Amwal dan Wasz, saat dia menyiarkan urusan Banu Tamim kepadanya. Dia berkata kepada Khosrow, 'Tidak ada apa-apa di antara kita selain kematian.' Dia mengirim dari al-Makabbar, gubernur Bahrain, seratus tawanan dari Banu Tamim pada hari al-Mashqar dan membebaskan mereka {cite:kamil-ibn-al-athir hlm. 349}."
