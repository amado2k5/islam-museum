summary:
  ar: "هوذة بن علي الحنفي صاحب اليمامة، لُقب ذا التاج لأن كسرى دعا بعقد من در فعقد على رأسه؛ اصحب أصحاب العير إلى كسرى بعد واقعة أموال وهرز وكان في إذاعة أمر بني تميم إليه فقال لكسرى لا بيننا إلا الموت، واستوهب من المكعبر عامل البحرين مائة أسير من بني تميم يوم المشقر فأطلقهم {cite:kamil-ibn-al-athir p. 349}."
  en: "Hawdha ibn Ali of Banu Hanifa, lord of al-Yamama, surnamed dhu al-taj for the pearl-diadem Khusraw bound on his head; he brought the plundered convoy's owners to Khusraw, declared of Tamim 'only death lies between us', yet begged a hundred Tamimi captives at al-Mushaqqar and freed them {cite:kamil-ibn-al-athir p. 349}."
