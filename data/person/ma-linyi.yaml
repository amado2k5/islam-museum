summary:
  ar: "مربٍّ وسياسي مسلم صيني من باوتشينغ في خونان (1864–1938)، من علماء الهوي في الإسلام؛ تولّى إدارة التعليم في قانسو سنة 1912 وأسّس سنة 1918 جمعية تعزيز التعليم الإسلامي في عاصمتها، كما تولّى إدارة التعليم في آنهوي وجلي، وكان نائبًا لوزير التعليم في بكين."
  en: "Chinese Muslim educator and politician from Baoqing, Hunan (1864–1938), a Hui scholar of Islam. He took charge of education in Gansu in 1912 and in 1918 founded the Association for the Promoting of Islamic Teaching in its capital; he also headed education in Anhui and Zhili and served as vice-minister of education in Beijing."
  ur: "باؤ چھنگ، ہونان سے تعلق رکھنے والے ایک چینی مسلمان ماہرِ تعلیم اور سیاست دان (1864ء–1938ء)، جو ہوئی مسلم عالم تھے؛ وہ 1912ء میں گانسو کے تعلیمی سربراہ بنے اور 1918ء میں اس کے دار الحکومت میں اسلامی تعلیم کے فروغ کی انجمن قائم کی، آنہوئی اور ژلی کے تعلیمی سربراہ بھی رہے اور بیجنگ میں نائب وزیرِ تعلیم کے منصب پر فائز ہوئے۔"
