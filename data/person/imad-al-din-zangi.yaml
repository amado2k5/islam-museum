summary:
  ar: "الأتابك صاحب الموصل وحلب؛ ولي شحنكية بغداد في آخر دولة المستظهر بالله ثم نقل إلى الموصل وسلم إليه السلطان محمود ولده فرخشاه ليربيه ولهذا قيل له أتابك، كان فارساً شجاعاً ميمون النقيبة شديد البأس قوي المراس عظيم الهيبة فيه ظلم وزعارة، سلك الموصل وحلب وحماة وحمص وحلبك والرها والمعرة، قتله بعض غلمانه وهو نائم في ربيع الآخر سنة إحدى وأربعين وخمس مئة وهربوا إلى قلعة جعبر ففتح لهم صاحبها علي بن مالك العقيلي، فتملك الموصل بعده ابنه غازي وتملك حلب وغيرها ابنه الآخر نور الدين محمود {cite:shadharat-dhahab p. 608-609}."
  en: "Zangi the atabak of Mosul and Aleppo — named for fostering the sultan Mahmud's son Farrukhshah — a brave hard-riding awe-inspiring lord with cruelty in him; his ghilman killed him in his sleep and were received into Ja'bar castle by 'Ali b. Malik the 'Uqaylid; Ghazi took Mosul and Nur al-Din Aleppo {cite:shadharat-dhahab p. 608-609}."
  es: "Zangi, el atabak de Mosul y Alepo —llamado así por haber criado al hijo del sultán Mahmud, Farrukhshah—, un señor valiente, intrépido e imponente, con crueldad en su interior; sus ghilman lo mataron mientras dormía y fueron recibidos en el castillo de Ja'bar por 'Ali b. Malik el 'Uqaylid; Ghazi tomó Mosul y Nur al-Din Alepo {cite:shadharat-dhahab p. 608-609}."
  fr: "Zangi, l'atabak de Mossoul et d'Alep — ainsi nommé pour avoir élevé le fils du sultan Mahmud, Farrukhshah — un seigneur courageux, cavalier intrépide et impressionnant, mais cruel en lui; ses ghilman le tuèrent dans son sommeil et furent reçus au château de Ja'bar par 'Ali b. Malik le 'Uqaylid; Ghazi prit Mossoul et Nur al-Din Alep {cite: shadharat-dhahab p. 608-609}."
  ur: "موصل اور حلب کے زنگی اتابک - جسے سلطان محمود کے بیٹے فرخشاہ کی پرورش کے لیے نامزد کیا گیا تھا - ایک بہادر سخت سواری کرنے والا خوف زدہ رب جس میں اس میں ظلم ہے۔ اس کے غلمان نے اسے ان کی نیند میں قتل کر دیا اور علی بن علی نے جبر کے قلعے میں استقبال کیا۔ مالک عقیلد؛ غازی نے موصل اور نورالدین حلب لے لیا 608-609}۔"
  tr: "Musul ve Halep'in hükümdarı El-Atabeg; El-Mustadhhir Billah'ın son devletinde Bağdat valisiydi, ardından Musul'a transfer edildi. Sultan Mahmud, oğlu Ferhşa'yı onu yetiştirmesi için emanet etti. Bu nedenle ona Atabeg denildi. Cesur, kutsanmış, çok güçlü, iradeli ve adaletsizlik ve isyanla karşı karşıya olan büyük bir şövalyeydi. Musul, Halep, Hama, Homs, Halep, El-Ra'sa ve Ma'ara'dan geçti. Bazı oğulları, 541 Hicri yılında Rabi'l-Thani'de uyurken onu öldürdü. Kalenin sahibi Ali bin Malik el-Aqili'nin fethettiği Ja'bar kalesine kaçtılar. Onun ardından oğlu Gazi Musul'u ele geçirdi ve diğer oğlu Nureddin Mahmud Halep ve diğerlerini yönetti {citasyon::] Shadharat-Dhahab, s. 608-609}."
  id: "Al-Atabeg, penguasa Mosul dan Aleppo; ia adalah gubernur Baghdad di negara terakhir Al-Mustadhhir Billah, lalu dipindahkan ke Mosul. Sultan Mahmoud mempercayakan putranya Farkhsha untuk membesarkannya. Karena alasan ini, ia disebut Atabeg. Ia adalah ksatria yang gagah berani dan diberkati, sangat kuat, berkemauan keras, dan sangat dipaksakan, serta menghadapi ketidakadilan dan pemberontakan. Ia melakukan perjalanan melalui Mosul, Aleppo, Hama, Homs, Aleppo, Al-Ra'sa, dan Al-Ma'ara. Beberapa putranya membunuhnya saat ia tidur di Rabi' al-Thani pada tahun 541 H. Mereka melarikan diri ke benteng Ja'bar, tempat pemiliknya Ali ibn Malik al-Aqili ditaklukkan. Setelah itu, putranya Ghazi mengambil alih Mosul, dan putranya yang lain, Nur al-Din Mahmoud, memerintah Aleppo dan lainnya {cite:Shadharat-Dhahab, hlm. 608-609}."
