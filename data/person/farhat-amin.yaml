summary:
  ar: "مؤلفة ومتحدثة بريطانية ومقدمة بودكاست «مسلمة ذكية»، نشأت في لندن وكانت معلمة لغة إنجليزية في مدرسة ثانوية قبل أن تتفرغ للكتابة والبودكاست سنة 2015؛ ألفت كتبًا في الحجاب والزواج وتربية الأبناء منها «مسلمة عزباء ذكية» و«ارفعوا أيديكم عن حجابنا»، وتوفيت سنة 2025 بعد أكثر من ثلاث سنوات مع السرطان."
  en: "British author, speaker and host of the Smart Muslima podcast. She grew up in London and was a secondary-school English teacher before leaving teaching in 2015 to write and podcast full-time. Her books on hijab, marriage and parenting include Smart Single Muslimah and Hands Off Our Hijab. She died in 2025 after more than three years living with cancer."
  ur: "برطانوی مصنفہ، مقررہ اور «سمارٹ مسلمہ» پوڈکاسٹ کی میزبان۔ وہ لندن میں پلی بڑھیں اور ثانوی سکول میں انگریزی کی معلمہ تھیں؛ 2015 میں تدریس چھوڑ کر تصنیف و پوڈکاسٹ کو کل وقتی اپنایا۔ ان کی کتابوں میں «سمارٹ سنگل مسلمہ» اور «ہینڈز آف آور حجاب» شامل ہیں۔ وہ 2025 میں تین سال سے زائد کینسر کے ساتھ زندگی گزارنے کے بعد وفات پا گئیں۔"
