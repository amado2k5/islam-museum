summary:
  ar: "علقمة بن مرثد الحضرمي الكوفي، أبو الحارث، إمام فقيه حجة وثبت في الحديث، عدّه الذهبي في صغار التابعين مع قدم وفاته؛ توفي سنة ١٢٠هـ."
  en: "Alqama ibn Marthad al-Hadrami of Kufa, Abu al-Harith, an imam, jurist and authority, firm in hadith, counted by al-Dhahabi among the younger Followers though he died early; he died in 120 AH."
  es: "Alqama ibn Marthad al-Hadrami de Kufa, Abu al-Harith, un imán, jurista y autoridad, firme en hadices, contado por al-Dhahabi entre los seguidores más jóvenes aunque murió joven; murió en el año 120 AH."
  fr: "Alqama ibn Marthad al-Hadrami de Kufa, Abu al-Harith, un imam, juriste et autorité, ferme dans le hadith, compté par al-Dhahabi parmi les jeunes disciples bien qu'il soit mort tôt; il est mort en 120 AH."
  ur: "کوفہ کے علقمہ بن مرثد الحدرمی، ابو الحارث، ایک امام، فقیہ اور مقتدر، حدیث میں پختہ، الذہبی نے ان کا شمار چھوٹے پیروکاروں میں کیا، اگرچہ وہ جلد فوت ہو گئے تھے۔ آپ کی وفات 120ھ میں ہوئی۔"
  tr: "Alkama ibn Murtad al-Hadrami al-Kufi, Ebu al-Harit, bir imam, hukukçu ve hadis alanında güvenilir bir otoriteydi. El-Dhahabi, ölümünden önce bile onu genç takipçiler arasında saydı; 120 Hicri yılında öldü."
  id: "Alqama ibn Murtad al-Hadrami al-Kufi, Abu al-Harith, adalah seorang imam, ahli hukum, dan otoritas hadis yang dapat diandalkan. Al-Dhahabi menganggapnya sebagai salah satu pengikut muda bahkan sebelum kematiannya; ia meninggal pada tahun 120 H."
