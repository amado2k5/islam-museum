summary:
  ar: "الحسن بن ثابت، أبو الحسن الأحول الثعلبي الكوفي، المعروف بابن الروزجار، تابعي روى عن إسماعيل بن أبي خالد وعبد الله بن الوليد المزني وهشام بن عروة وغيرهم، وعنه ابن المبارك وإبراهيم بن موسى الرازي ويحيى بن آدم وغيرهم. قال ابن نمير: هو ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192}"
  en: "Al-Hasan ibn Thabit, Abu al-Hasan al-Ahwal al-Tha'alabi of Kufa, known as Ibn al-Ruzjar, a Successor. He transmitted from Isma'il ibn Abi Khalid, Abd Allah ibn al-Walid al-Muzani and Hisham ibn Urwa, and Ibn al-Mubarak and Yahya ibn Adam heard him. Ibn Numayr called him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192}"
