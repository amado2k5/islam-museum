  ar: "أبو ركوة واسمه الوليد، متظاهر أموي على الحاكم بأمر الله؛ ملك برقة بأيدي بني قرة وكتامة وهزم عسكر الحاكم وقتل قائده ينالاً، وسار إلى الصعيد باستدعاء أهل مصر فجهز الحاكم نحو اثني عشر ألفاً للقائه."
  en: "Abu Rawka (al-Walid), an Umayyad pretender against al-Hakim bi-Amr Allah; he took Barqa with Banu Qurra and Kutama, routed the caliph's army and killed its commander Yinal, then marched to Upper Egypt at the Egyptians' call as al-Hakim sent some twelve thousand against him."
