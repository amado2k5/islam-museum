summary:
  ar: "أبو ركوة واسمه الوليد، متظاهر أموي على الحاكم بأمر الله؛ ملك برقة بأيدي بني قرة وكتامة وهزم عسكر الحاكم وقتل قائده ينالاً، وسار إلى الصعيد باستدعاء أهل مصر فجهز الحاكم نحو اثني عشر ألفاً للقائه."
  en: "Abu Rawka (al-Walid), an Umayyad pretender against al-Hakim bi-Amr Allah; he took Barqa with Banu Qurra and Kutama, routed the caliph's army and killed its commander Yinal, then marched to Upper Egypt at the Egyptians' call as al-Hakim sent some twelve thousand against him."
  fr: "Abu Rawka (al-Walid), prétendant omeyyade contre al-Hakim bi-Amr Allah ; il prit Barqa avec les Banu Qurra et les Kutama, mit en déroute l'armée du calife et tua son commandant Yinal, puis marcha sur la Haute-Égypte à l'appel des Égyptiens tandis qu'al-Hakim envoyait contre lui quelque douze mille hommes."
  es: "Abu Rawka (al-Walid), un pretendiente omeya contra al-Hakim bi-Amr Allah, tomó Barqa con Banu Qurra y Kutama, derrotó al ejército del califa y mató a su comandante Yinal, y luego marchó al Alto Egipto a petición de los egipcios, ya que al-Hakim envió a unos doce mil hombres contra él."
  ur: "ابو راوکا ⁦(الولید)⁩، ایک اموی ڈرامہ کرنے والا الحکیم بن عمرو اللہ کے خلاف؛ اس نے بنو قرہ اور قطمہ کے ساتھ برقعہ لیا، خلیفہ کی فوج کو شکست دی اور اس کے کمانڈر ینال کو قتل کر دیا، پھر مصریوں کے بلانے پر بالائی مصر کی طرف کوچ کیا کیونکہ الحکیم نے اس کے خلاف تقریباً بارہ ہزار بھیجے تھے۔"
  tr: "Adı El-Valid olan Ebu Rakva, El-Hakim bi-Amr Allah'ın tahtına talip olan bir Emeviydi. Beni Kura ve Kutama kabilelerinin yardımıyla Barka'yı yönetti, El-Hakim'in ordusunu yenerek komutanı Yanal'ı öldürdü ve Mısır halkının daveti üzerine Yukarı Mısır'a yürüdü. El-Hakim onu karşılamak için yaklaşık on iki bin adam hazırlamıştı."
  id: "Abu Rakwa, yang bernama Al-Walid, adalah seorang penuntut takhta Umayyah yang mengaku sebagai penerus Al-Hakim bi-Amr Allah. Ia memerintah Barqa dengan bantuan Bani Qura dan Kutama, mengalahkan pasukan Al-Hakim dan membunuh komandannya, Yanal, lalu berbaris ke Mesir Hulu atas undangan rakyat Mesir. Al-Hakim menyiapkan sekitar dua belas ribu orang untuk menghadapinya."
