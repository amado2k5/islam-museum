id: person/said-ibn-makhlad
class: person
label: { ar: "صاعد بن مخلد" }
summary:
  ar: "كاتب الموفق، تلقى المعتمد لما رده ابن كنداج فأنزله في دار أحمد بن الخصيب وأقام في خدمته ولقبه الموفق ذا الوزارتين {cite:tarikh-khulafa-minhaj-1434 p. 567}.، وعند المسعودي وجهه الموفق سنة اثنتين وسبعين ومائتين إلى حرب الصفار فأمره على الجيوش فلما صار إلى فارس تجبر واشتد سلطانه، وانصرف من المدائن فاحتجم في خفة ورانة فنمي ذلك إلى الموفق فأشخصه إلى واسط، وكانت مدة مقامه في الوزارة سبع سنين إلى أن قبض عليه وعلى أخيه عبدون النصراني، وأحصى ما وجد له في خاصة نفسه ثلثمائة ألف دينار وغلته في ضياعه ألف ألف وثلثمائة ألف، ومات في الحبس سنة ست وسبعين ومائتين {cite:muruj-al-dhahab p. 578-579}"
  en: "Al-Muwaffaq's secretary; he received the returned al-Mu'tamid, lodged him at Ibn al-Khasib's house and stayed in his service — titled Dhu'l-Wizaratayn {cite:tarikh-khulafa-minhaj-1434 p. 567}."
