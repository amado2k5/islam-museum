id: person/said-ibn-makhlad
class: person
label: { ar: "صاعد بن مخلد" }
gender: male
summary:
  ar: "وزير بني العباس ببغداد الملقب ذا الوزارتين؛ امتثل أحمد بن عبد الملك بن شهيد وزير عبد الرحمن الناصر اسمه فكان أول من تسمى بذو الوزارتين بالأندلس {cite:nafh-tib-maqqari p. 392}."
  en: "The Abbasid wazir in Baghdad titled Dhu'l-Wizaratayn whose style Ibn Shuhayd emulated as the first so called in al-Andalus {cite:nafh-tib-maqqari p. 392}."
  es: "El visir abasí en Bagdad, titulado Dhu'l-Wizaratayn, cuyo estilo Ibn Shuhayd emuló como el primero de este tipo en al-Ándalus {cite:nafh-tib-maqqari p. 392}."
  fr: "Le vizir abbasside de Bagdad, nommé Dhu'l-Wizaratayn, dont le style a été imité par Ibn Shuhayd comme le premier à porter ce nom en al-Andalus {cite:nafh-tib-maqqari p. 392}."
  ur: "بغداد میں عباسی وزیر نے ذوال وزارتین کا عنوان دیا جس کے انداز کو ابن شھید نے الاندلس میں پہلے نام نہاد کے طور پر نقل کیا ہے۔ 392}۔"
  tr: "Bağdat'taki Abbasi veziri, Zul-Awzratyn lakabıyla anılır; Abd al-Rahman al-Nasir'in veziri Ahmed ibn Abd al-Malik ibn Shahid, onun adını almış ve Endülüs'te Zul-Tarat al-Awzaratin olarak anılan ilk kişi olmuştur. {cite:nafh-tib-maqqari, s. 392}."
  id: "Wazir Abbasiyah di Baghdad, dijuluki Dhul-Awzratyn; Ahmad ibn Abd al-Malik ibn Shahid, wazir Abd al-Rahman al-Nasir, dinamai menurut namanya, menjadi yang pertama disebut Dhul-Tarat al-Awzaratin di al-Andalus. {cite:Nafh-Tib-Maqqari, hlm. 392}."
