summary:
  ar: "جاسم بن محمد بن ثاني (وُلد نحو 1825 في فويرط – توفي في لوسيل في 17 يوليو 1913)، الحاكم الثاني لقطر من 18 ديسمبر 1878 حتى وفاته ومؤسس دولتها الحديثة، والابن الأكبر لمحمد بن ثاني؛ وحّد قطر وصدّ العثمانيين في الوجبة سنة 1893، وترك إدارة البلاد لأخيه أحمد سنواته الأخيرة، وخلفه ابنه عبد الله."
  en: "Jassim bin Mohammed bin Thani (born circa 1825 at Fuwayrit – died at Lusail on 17 July 1913), the second ruler of Qatar from 18 December 1878 until his death and the founder of its modern state, the eldest son of Mohammed bin Thani; he unified Qatar, defeated the Ottomans at Al Wajbah in 1893, left the country's running to his brother Ahmed in his last years, and was succeeded by his son Abdullah."
  ur: "جاسم بن محمد بن ثانی (پیدائش تقریباً 1825ء فویرط – وفات 17 جولائی 1913ء لوسیل)، 18 دسمبر 1878ء سے وفات تک قطر کے دوسرے حکمران اور اس کی جدید ریاست کے بانی، محمد بن ثانی کے بڑے بیٹے؛ انہوں نے قطر کو متحد کیا، 1893ء میں الوجبہ میں عثمانیوں کو شکست دی، آخری برسوں میں انتظام بھائی احمد کے سپرد کیا، اور ان کے بیٹے عبد اللہ جانشین بنے۔"
