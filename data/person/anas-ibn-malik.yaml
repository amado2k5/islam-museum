summary:
  ar: "خادم النبي وأحد المكثرين من الرواية عنه؛ قدم النبي المدينة وهو ابن عشر سنين فأتت به أمه أم سليم ليخدمه، وسكن البصرة بعد الفتوح وهو آخر الصحابة موتاً بها، وتُذكر وفاته بين 90 و93هـ. وفي الصحيح أخرج لمريديه زوج نعال جرداوين لهما قبالان حدّث ثابت البناني بعده أنهما نعلا النبي {cite:sahih-al-bukhari 3107}."
  en: The servant of the Prophet and one of the most prolific narrators from him; he was ten when the Prophet reached Medina and his mother Umm Sulaym brought him to serve him; after the conquests he settled in Basra, where he was the last Companion
    to die, with his death given between 90 and 93 AH.
