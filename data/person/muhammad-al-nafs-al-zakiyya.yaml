id: person/muhammad-al-nafs-al-zakiyya
class: person
label: { ar: "محمد النفس الزكية" }
summary:
  ar: "محمد بن عبد الله بن الحسن بن الحسن بن علي بن أبي طالب، خرج هو وأخوه إبراهيم في سنة خمس وأربعين ومئة فظفر بهما المنصور فقتلهما وجماعة كثيرة من آل البيت، وكان المنصور أول من أوقع الفتنة بين العباسيين والعلويين وكانوا قبل شيئاً واحداً، وآذى خلقاً من العلماء ممن خرج معهما أو أفتى بالخروج منهم أبو حنيفة وعبد الحميد بن جعفر وابن عجلان، وأفتى مالك بجواز الخروج معه وقال إنما بايعتم مكرهين وليس على مكره يمين {cite:tarikh-khulafa-minhaj-1434 p. 424-425}. وتفرق إخوته وولده في البلدان يدعون إلى إمامته فقتل ابنه علي بمصر وابنه عبد الله بالسند وحبس ابنه الحسن باليمن فمات في الحبس وسار أخوه موسى إلى الجزيرة ويحيى إلى الري ثم طبرستان وإدريس إلى المغرب {cite:muruj-al-dhahab p. 285}"
  en: "Muhammad ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali, al-Nafs al-Zakiyya; he and his brother Ibrahim rose in year 145 and al-Mansur overcame them, killing them with a great company of the Prophet's house — al-Mansur being the first to sow strife between Abbasids and Alids, hitherto one party, and he harmed scholars who had joined them or sanctioned the rising: Abu Hanifa, Abd al-Hamid ibn Ja'far and Ibn Ajlan among them. Malik sanctioned the rising, saying 'your bay'a was coerced, and there is no oath upon the coerced' {cite:tarikh-khulafa-minhaj-1434 p. 424-425}."
