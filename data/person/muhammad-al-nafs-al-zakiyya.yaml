id: person/muhammad-al-nafs-al-zakiyya
class: person
label: { ar: "محمد النفس الزكية" }
summary:
  ar: "محمد بن عبد الله بن الحسن بن الحسن بن علي بن أبي طالب، خرج هو وأخوه إبراهيم في سنة خمس وأربعين ومئة فظفر بهما المنصور فقتلهما وجماعة كثيرة من آل البيت، وكان المنصور أول من أوقع الفتنة بين العباسيين والعلويين وكانوا قبل شيئاً واحداً، وآذى خلقاً من العلماء ممن خرج معهما أو أفتى بالخروج منهم أبو حنيفة وعبد الحميد بن جعفر وابن عجلان، وأفتى مالك بجواز الخروج معه وقال إنما بايعتم مكرهين وليس على مكره يمين {cite:tarikh-khulafa-minhaj-1434 p. 424-425}. وتفرق إخوته وولده في البلدان يدعون إلى إمامته فقتل ابنه علي بمصر وابنه عبد الله بالسند وحبس ابنه الحسن باليمن فمات في الحبس وسار أخوه موسى إلى الجزيرة ويحيى إلى الري ثم طبرستان وإدريس إلى المغرب {cite:muruj-al-dhahab p. 285}"
  en: "Muhammad ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali, al-Nafs al-Zakiyya; he and his brother Ibrahim rose in year 145 and al-Mansur overcame them, killing them with a great company of the Prophet's house — al-Mansur being the first to sow strife between Abbasids and Alids, hitherto one party, and he harmed scholars who had joined them or sanctioned the rising: Abu Hanifa, Abd al-Hamid ibn Ja'far and Ibn Ajlan among them. Malik sanctioned the rising, saying 'your bay'a was coerced, and there is no oath upon the coerced' {cite:tarikh-khulafa-minhaj-1434 p. 424-425}."
  es: "Muhammad ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali, al-Nafs al-Zakiyya; él y su hermano Ibrahim se sublevaron en el año 145 y al-Mansur los venció, matándolos con una gran compañía de la casa del Profeta. Al-Mansur fue el primero en sembrar la discordia entre los abasíes y los alíes, hasta entonces un solo partido, y perjudicó a los eruditos que se habían unido a ellos o habían sancionado la sublevación: Abu Hanifa, Abd al-Hamid ibn Ja'far e Ibn Ajlan, entre ellos. Malik sancionó la sublevación, diciendo: «Tu bay'a fue forzada, y no hay juramento sobre lo forzado» {cite:tarikh-khulafa-minhaj-1434 p. 424-425}."
  fr: "Muhammad ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali, al-Nafs al-Zakiyya, se souleva avec son frère Ibrahim en l'an 145. Al-Mansur les vainquit et les massacra avec une importante armée de la famille du Prophète. Al-Mansur fut le premier à semer la discorde entre les Abbassides et les Alides, qui formaient jusque-là un seul et même camp. Il s'en prit aux savants qui les avaient rejoints ou avaient approuvé le soulèvement, notamment Abu Hanifa, Abd al-Hamid ibn Ja'far et Ibn Ajlan. Malik approuva le soulèvement, déclarant: « Votre serment d'allégeance vous a été extorqué, et nul ne peut prêter serment sous la contrainte. » (Voir: Tarikh-Khulafa-Minhaj-1434, p. 424-425)."
  ur: "محمد بن عبد اللہ ابن الحسن ابن الحسن ابن علی، النفس الزکیہ۔ وہ اور اس کے بھائی ابراہیم نے سن 145 میں عروج حاصل کیا اور المنصور نے ان پر غلبہ حاصل کیا، انہیں رسول اللہ کے گھر کی ایک بڑی جماعت کے ساتھ قتل کر دیا - المنصور سب سے پہلے عباسیوں اور الیدوں کے درمیان جھگڑا بونے والا تھا، اب تک ایک فریق تھا، اور اس نے ان علماء کو نقصان پہنچایا جو ان میں شامل ہوئے تھے یا ان میں اضافہ کی منظوری دیتے تھے: ابو حنیفہ، ابو حنیفہ اور ابو حنیفہ۔ مالک نے یہ کہتے ہوئے اٹھنے کی منظوری دی کہ 'آپ کی بیعت زبردستی کی گئی ہے اور جبر پر کوئی قسم نہیں ہے'۔ 424-425}۔"
  tr: "Muhammed ibn Abdullah ibn al-Hasan ibn al-Hasan ibn Ali ibn Ebi Talib, 145 Hicri yılında kardeşi İbrahim ile birlikte isyan etti. El-Mansur onları yendi ve Ehlül-Beyt'in birçok üyesiyle birlikte öldürdü. El-Mansur, Abbasiler ile daha önce aynı halkla aynı olan Aleviler arasında ilk anlaşmazlığı kışkırtan kişiydi. Onlarla dışarı çıkan veya fetva veren bazı alimlere, aralarında Ebu Hanifa, Abdülhamidin bin Ca'fer ve İbn Eclan gibi kişilere zarar verdi. Malik, kendisiyle isyana izin veren bir fetva verdi ve şöyle dedi: \"Sadece zorla itaat ettiniz, zorla yemin edilmez.\" {atıf:Tarikh-Khulafa-minhaj-1434, s. 424-425}. Kardeşleri ve oğlu liderliğini talep ederek topraklara dağıldı. Oğlu Ali Mısır'da, oğlu Abdullah aktarım zincirinde, oğlu Al-Hasan ise Yemen'de hapsedildi ve orada esaret altında öldü. Kardeşi Musa Cazire'ye, Yahya Rayy'ye, sonra Tabaristan'a, İdris ise Mağrip'e gitti {cite:muruj-al-dhahab, s. 285}"
  id: "Muhammad ibn Abdullah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib memberontak bersama saudaranya Ibrahim pada tahun 145 H. Al-Mansur mengalahkan mereka dan membunuh mereka bersama banyak anggota Ahl al-Bayt. Al-Mansur adalah yang pertama menghasut perselisihan antara Abbasiyah dan Alawiyah, yang sebelumnya sama dengan bangsa yang sama. Ia menyakiti beberapa ulama yang pergi bersama mereka atau mengeluarkan fatwa untuk meninggalkan mereka, termasuk Abu Hanifa, Abdul Hamid ibn Ja'far, dan Ibn Ajlan. Malik mengeluarkan fatwa yang mengizinkan pemberontakan dengannya, mengatakan: Kamu hanya bersumpah setia di bawah paksaan, dan tidak ada sumpah atas paksaan. {cite:Tarikh-Khulafa-minhaj-1434, hlm. 424-425}. Saudara-saudaranya dan putranya tercerai-berai di negeri-negeri yang menuntut kepemimpinannya. Putranya Ali tewas di Mesir, putranya Abdullah dalam rantai transmisi, dan putranya Al-Hasan dipenjara di Yaman, di mana ia meninggal dalam tahanan. Saudaranya Musa pergi ke Jazira, Yahya ke Rayy, lalu ke Tabaristan, dan Idris ke Maghreb {cite:muruj-al-dhahab, hlm. 285}"
