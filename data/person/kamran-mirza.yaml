summary:
  ar: "بطاقة أولية لكمران ميرزا، الأمير المغولي ابن بابر وأخو همايون الذي تولى كابل ونازع أخاه على الهند، توفي سنة ١٥٥٧م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Kamran Mirza, the Mughal prince son of Babur and half-brother of Humayun who held Kabul and contested his brother for India, d. 1557; the biographical entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Kamran Mirza, príncipe mogol hijo de Babur y hermanastro de Humayun, que gobernó Kabul y disputó el control de la India a su hermano, fallecido en 1557; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Kamran Mirza, prince moghol fils de Babur et demi-frère d'Humayun, qui contrôla Kaboul et contesta le pouvoir de son frère en Inde, mort en 1557; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "مغل شہزادہ بابر کے بیٹے اور ہمایوں کے سوتیلے بھائی کامران مرزا کے لیے ڈرافٹ کارڈ جس نے کابل پر قبضہ کیا اور ہندوستان کے لیے اپنے بھائی کا مقابلہ کیا۔ 1557; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Kabil'i ele geçiren ve kardeşiyle Hindistan için çekişen Babür'ün oğlu ve Humayun'un kardeşi Babür prensi Kamran Mirza için ön kart, 1557 yılında öldü; önemli şahsiyetlerin sözlüklerinde adı geçti ve biyografisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan untuk Kamran Mirza, pangeran Mughal putra Babur dan saudara Humayun yang mengambil alih Kabul dan mempersebutan saudaranya atas India, meninggal pada tahun 1557 M; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum ditinjau di halaman tersebut."
