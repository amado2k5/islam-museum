label: { ar: "أم البنين بنت عبد العزيز", en: "Umm al-Banin bint 'Abd al-'Aziz", es: "Umm al-Banin bint 'Abd al-'Aziz", fr: "Umm al-Banin bint 'Abd al-'Aziz", ur: "ام البنین بنت عبدالعزیز" }
summary:
  ar: "ابنة عم الوليد بن عبد الملك، أنكرت عليه مجالسة الحجاج وهو في غلالة فقال الحجاج له دع عنك مفاكهة النساء بزخرف القول فإنما المرأة ريحانة وليست بقهرمانة، فأمرته بالتسليم عليها {cite:muruj-al-dhahab p. 149-150}. ويذكر الكتاب أنها كانت تحفظ القرآن وتتعاهده صباح مساء، وكانت تعتق في كل جمعة رقبة، وأنها ردّت هدية محمد بن يوسف حين بلغها أنه أخذها غصباً، وأنها وبّخت الحجاج حين دخل عليها مع الوليد وذكّرته بقتل ابن الزبير. {cite:salabi-umayyad-state-2020 p.136-139}"
  en: "al-Walid's cousin — scandalised by his lounging with al-Hajjaj; his counsel to keep women from secrets provoked her demand for his greeting {cite:muruj-al-dhahab p. 149-150}."
  es: "La prima de al-Walid, escandalizada por su tiempo libre con al-Hajjaj, vio cómo su consejo de mantener a las mujeres al margen de los secretos provocaba su exigencia de que él la saludara {cite:muruj-al-dhahab p. 149-150}."
  fr: "La cousine d'al-Walid — scandalisée par ses moments de détente avec al-Hajjaj; son conseil de garder les femmes au courant des secrets a provoqué sa demande de salutation {cite:muruj-al-dhahab p. 149-150}."
  ur: "الولید کا کزن - الحجاج کے ساتھ رہنے سے بدنام ہوا؛ عورتوں کو رازوں سے دور رکھنے کے اس کے مشورے نے اسے سلام کے مطالبے پر اکسایا۔ 149-150}۔"
  tr: "El-Velid bin Abdülmelik'in kuzeni, el-Hacac'ın peçe içinde oturmasına itiraz etti. El-Haccac ona, 'Kadınları süslemeyle kızdırmayı bırak, çünkü kadın sadece bir parfümdür, kahraman değildir.' dedi. Ona selamını vermesini emretti {atıf:muruj-al-dhahab s. 149-150}. Kitapta, Kur'an'ı ezberlediği ve onunla anlaşma yaptığını, her Cuma bir köleyi özgür bıraktığını, Muhammed bin Yusuf'un hediyesini zorla aldığını söylediğinde geri verdiğini, el-Hajjaj el-Valid ile içeri girdiğinde onu azarladığını ve İbn al-Zubayr'in öldürülmesini hatırlattığını belirtir. {cite:Selabi-Umayyad-state-2020 s.136-139}"
  id: "Sepupu al-Walid ibn Abd al-Malik menolak dia duduk bersama al-Hajjaj saat dia mengenakan kerudung. Al-Hajjaj berkata kepadanya, 'Berhenti menggoda wanita dengan hiasan, karena wanita hanyalah parfum, bukan pahlawan.' Dia memerintahkannya untuk menyapanya {cite:muruj-al-dhahab hlm. 149-150}. Kitab itu menyebutkan bahwa dia menghafal Al-Qur'an dan menepati perjanjian dengannya pagi dan sore, membebaskan seorang budak setiap Jumat, bahwa dia mengembalikan hadiah Muhammad ibn Yusuf ketika dia memberitahunya bahwa dia mengambilnya dengan paksa, bahwa dia menegur al-Hajjaj ketika dia masuk bersama al-Walid dan mengingatkannya tentang pembunuhan Ibn al-Zubayr. {cite:salabi-umayyad-state-2020 hlm.136-139}"
