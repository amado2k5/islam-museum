summary:
  ar: "ابنة عم الوليد بن عبد الملك، أنكرت عليه مجالسة الحجاج وهو في غلالة فقال الحجاج له دع عنك مفاكهة النساء بزخرف القول فإنما المرأة ريحانة وليست بقهرمانة، فأمرته بالتسليم عليها {cite:muruj-al-dhahab p. 149-150}. ويذكر الكتاب أنها كانت تحفظ القرآن وتتعاهده صباح مساء، وكانت تعتق في كل جمعة رقبة، وأنها ردّت هدية محمد بن يوسف حين بلغها أنه أخذها غصباً، وأنها وبّخت الحجاج حين دخل عليها مع الوليد وذكّرته بقتل ابن الزبير. {cite:salabi-umayyad-state-2020 p.136-139}"
  en: "al-Walid's cousin — scandalised by his lounging with al-Hajjaj; his counsel to keep women from secrets provoked her demand for his greeting {cite:muruj-al-dhahab p. 149-150}."
