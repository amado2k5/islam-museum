  en: "A devout woman of Mecca who kept company with al-Fudayl ibn Iyad; Ibn al-Jawzi in Sifat al-Safwa reports from Abu Ubayd al-Qasim ibn Sallam that she saw him lying with his legs stretched out facing the Ka'ba and said: they say you are a scholar; accept a word from me — sit with Him only with good manners, lest He erase your name from the register of nearness."
