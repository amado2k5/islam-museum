class: person
label: { ar: "غياث الدين كيخسرو الأول", en: "Ghiyath al-Din Kaykhusraw I", es: "Ghiyath al-Din Kaykhusraw I", fr: "Ghiyath al-Din Kaykhusraw I", ur: "غیاث الدین کیخسرو اول" }
summary:
  ar: "غياث الدين كيخسرو بن قلج أرسلان سلطان سلاجقة الروم؛ أخرجه أخوه ركن الدين سليمان من قونية فقصد الملك الظاهر بحلب فقصر به، فسار إلى القسطنطينية فأحسن إليه ملك الروم وأقطعه وتزوج ابنة بطريق كبير، فلما ملك الفرنج القسطنطينية لاذ بقلعة حميه؛ فلما مات أخوه سنة ستمائة استدعاه الأتراك الأوج، وهُزم أمام قونية ثم نادى به أهل أقصرا ثم أهل قونية أنفسهم فملكها في رجب وقبض ابن أخيه، وجمع الله له البلاد في ساعة واحدة {cite:kamil-ibn-al-athir p. 237-238}."
  en: "Seljuk sultan of Rum — exiled by his brother, snubbed at Aleppo, pensioned and married into the patriciate at Constantinople until the Frankish sack, then recalled by the Oghuz in 600 and carried into Konya by the acclamation of Aksaray and Konya themselves {cite:kamil-ibn-al-athir p. 237-238}."
  es: "Sultan selyúcida de Rum — exiliado por su hermano, despreciado en Alepo, pensionado y casado con una miembro del patriciado en Constantinopla hasta el saqueo franco, luego llamado de vuelta por los oguz en el año 600 y llevado a Konya por aclamación de Aksaray y Konya misma {cite:kamil-ibn-al-athir p. 237-238}."
  fr: "Sultan seldjoukide de Rum — exilé par son frère, snobé à Alep, mis à la retraite et marié à une patricienne à Constantinople jusqu'au sac franc, puis rappelé par les Oghuz en 600 et emmené à Konya par l'acclamation d'Aksaray et de Konya eux-mêmes {cite:kamil-ibn-al-athir p. 237-238}."
  ur: "رم کا سلجوق سلطان - اس کے بھائی کے ذریعہ جلاوطن کیا گیا، حلب میں چھین لیا گیا، پنشن حاصل کی گئی اور قسطنطنیہ کے سرپرست سے فرینکش بوری تک شادی کی، پھر 600 میں اوغوز کے ذریعہ واپس بلایا گیا اور خود اکسرے اور کونیا کی تعریف کے ذریعہ قونیہ لے جایا گیا۔ 237-238}۔"
  tr: "Rum Selçuklarının Sultanı Ghiyath al-Din Kaykhosrow ibn Kilij Arslan; kardeşi Rukn al-Din Süleyman onu Konya'dan aldı, bu yüzden Halep'teki Kral al-Zahir'e gitti ve onunla kalışını kısalttı. Sonra Konstantinopolis'e gitti; Roma kralı onu kayırıp hayatından çıkardı ve iri bir adamdan bir kızla evlendi. Franklar Konstantinopolis kralı olunca Hamiye kalesine sığındı; kardeşi 600 yılında öldüğünde, Türkler onu tahta çağırdı, Konya'nın önünde yendi, sonra Luksor halkı, ardından Konya halkı Recep'te hüküm sürdü ve yeğeni öldü. Tanrı toprakları onun için bir saatte birleştirdi {cite:kamil-ibn-al-athir s. 237-238}."
  id: "Ghiyath al-Din Kaykhosrow ibn Kilij Arslan, Sultan Seljuk Rum; saudaranya Rukn al-Din Suleiman membawanya dari Konya, sehingga ia pergi ke Raja al-Zahir di Aleppo dan mempersingkat masa tinggalnya. Ia kemudian pergi ke Konstantinopel, di mana raja Romawi memikanya, memutuskan hubungannya, dan menikahi seorang putri dari seorang pria besar. Ketika bangsa Franka menjadi raja Konstantinopel, ia berlindung di benteng Hamiyeh; ketika saudaranya meninggal pada tahun 600, Turki memanggilnya ke tahta, mengalahkannya di hadapan Konya, lalu rakyat Luxor, kemudian rakyat Konya sendiri yang memerintah di Rajab, dan keponakannya meninggal. Tuhan menyatukan tanah untuknya dalam satu jam {cite:kamil-ibn-al-athir hlm. 237-238}."
