summary:
  ar: "غياث الدين كيخسرو بن قلج أرسلان سلطان سلاجقة الروم؛ أخرجه أخوه ركن الدين سليمان من قونية فقصد الملك الظاهر بحلب فقصر به، فسار إلى القسطنطينية فأحسن إليه ملك الروم وأقطعه وتزوج ابنة بطريق كبير، فلما ملك الفرنج القسطنطينية لاذ بقلعة حميه؛ فلما مات أخوه سنة ستمائة استدعاه الأتراك الأوج، وهُزم أمام قونية ثم نادى به أهل أقصرا ثم أهل قونية أنفسهم فملكها في رجب وقبض ابن أخيه، وجمع الله له البلاد في ساعة واحدة {cite:kamil-ibn-al-athir p. 237-238}."
  en: "Seljuk sultan of Rum — exiled by his brother, snubbed at Aleppo, pensioned and married into the patriciate at Constantinople until the Frankish sack, then recalled by the Oghuz in 600 and carried into Konya by the acclamation of Aksaray and Konya themselves {cite:kamil-ibn-al-athir p. 237-238}."
