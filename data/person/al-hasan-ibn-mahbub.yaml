summary:
  ar: "الحسن بن محبوب السراد، أو الزارد، أبو علي، فقيه إمامي، أي من الإمامية الشيعة، من أهل الكوفة، له النوادر والتفسير والفرائض والمشيخة والحدود؛ توفي سنة 224 هـ الموافقة 839م."
  en: "al-Hasan ibn Mahbub al-Sarrad (or al-Zarid), Abu Ali, an Imami (Twelver Shi'i) jurist of Kufa, author of al-Nawadir, al-Tafsir, al-Fara'id, al-Mashyakha and al-Hudud; he died in 224 AH (839 CE)."
  es: "al-Hasan ibn Mahbub al-Sarrad (o al-Zarid), Abu Ali, un jurista imami (doce chií) de Kufa, autor de al-Nawadir, al-Tafsir, al-Fara'id, al-Mashyakha y al-Hudud; Murió en 224 AH (839 CE)."
  fr: "al-Hasan ibn Mahbub al-Sarrad (ou al-Zarid), Abu Ali, juriste imami (chiite duodécimain) de Kufa, auteur d'al-Nawadir, al-Tafsir, al-Fara'id, al-Mashyakha et al-Hudud; il mourut en 224 AH (839 CE)."
  ur: "الحسن بن محبوب السراد ⁦(یا الزرد)⁩، ابو علی، کوفہ کے امامی ⁦(بارہ شیعہ)⁩ فقیہ، النوادر، التفسیر، الفراید، المشائخ اور الحود کے مصنف؛ ان کی وفات 224ھ ⁦(839ء)⁩ میں ہوئی۔"
  tr: "El-Hasan ibn Mahbub el-Sarrad ya da El-Zerd, Ebu Ali, Şii İmamiyye'den, Kufe'den gelen bir İmam hukukçuydu. Anekdotlar, tefsirler, miras, şeyhler ve hudud yazdı; 839 M.S. 224 yılında öldü."
  id: "Al-Hasan ibn Mahbub al-Sarrad, atau Al-Zard, Abu Ali, adalah seorang ahli hukum Imani, yang berarti dari Syiah Imamiyyah, dari Kufa. Ia menulis anekdot, tafsir, warisan, syekh, dan hudud; ia meninggal pada tahun 224 H, yang bertepatan dengan tahun 839 M."
