  ar: "محمد بن محمد أبي السرور زين العابدين بن محمد أبي المكارم البكري الصديقي، المعروف بابن أبي السرور، مؤرخ مفسر باحث مصري، انتهت إليه رئاسة بيت البكري بمصر، ولد وتوفي في القاهرة، من سنة 1005 إلى 1087 هـ الموافقة 1596 إلى 1676 م."
