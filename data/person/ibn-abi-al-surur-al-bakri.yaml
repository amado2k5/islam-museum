  ur: "ابن ابی السرور البکری۔"
roles: [sufi, historian]
gender: male
summary:
  ar: "محمد بن محمد أبي السرور زين العابدين بن محمد أبي المكارم البكري الصديقي، المعروف بابن أبي السرور، مؤرخ مفسر باحث مصري، انتهت إليه رئاسة بيت البكري بمصر، ولد وتوفي في القاهرة، من سنة 1005 إلى 1087 هـ الموافقة 1596 إلى 1676 م."
  en: "Muhammad ibn Muhammad Abi al-Surur Zayn al-Abidin ibn Muhammad Abi al-Makarim al-Bakri al-Siddiqi, known as Ibn Abi al-Surur, an Egyptian historian, exegete and researcher who became head of the house of al-Bakri in Egypt; born and died in Cairo, 1005 to 1087 AH (1596 to 1676 CE)."
  es: "Muhammad ibn Muhammad Abi al-Surur Zayn al-Abidin ibn Muhammad Abi al-Makarim al-Bakri al-Siddiqi, conocido como Ibn Abi al-Surur, fue un historiador, exegeta e investigador egipcio que se convirtió en jefe de la casa de al-Bakri en Egipto; nació y murió en El Cairo, entre 1005 y 1087 AH (1596 y 1676 d. C.)."
  fr: "Muhammad ibn Muhammad Abi al-Surur Zayn al-Abidin ibn Muhammad Abi al-Makarim al-Bakri al-Siddiqi, connu sous le nom d'Ibn Abi al-Surur, historien, exégète et chercheur égyptien devenu chef de la maison d'al-Bakri en Égypte; né et mort au Caire, 1005 à 1087 AH (1596 à 1676 CE)."
  ur: "محمد بن محمد ابی السرور زین العابدین ابن محمد ابی المکارم البکری الصدیقی، جو ابن ابی السرور کے نام سے جانا جاتا ہے، ایک مصری مورخ، مفسر اور محقق جو مصر میں البکری کے گھر کا سربراہ بنا؛ قاہرہ میں پیدا ہوئے اور وفات 1005 تا 1087 ہجری ⁦(1596 تا 1676 عیسوی)⁩۔"
  tr: "Muhammed bin Muhammed Abi el-Surur, Zeyn el-Abidin bin Muhammed Abi el-Mekerim el-Bakri el-Siddiqi, İbn Ebi el-Surur olarak bilinen, Mısırlı bir tarihçi, tercüman ve araştırmacıydı. El-Bekri'nin Mısır'daki hanesinin reisi oldu. 1005'ten 1087 Hicri'ye kadar Kahire'de doğdu ve öldü; bu yıllar 1596'dan 1676'ya kadar sürdü."
  id: "Muhammad ibn Muhammad Abi al-Surur, Zain al-Abidin ibn Muhammad Abi al-Makarim al-Bakri al-Siddiqi, yang dikenal sebagai Ibn Abi al-Surur, adalah seorang sejarawan, penerjemah, dan peneliti Mesir. Ia menjadi kepala rumah tangga al-Bakri di Mesir. Ia lahir dan meninggal di Kairo dari tahun 1005 hingga 1087 H, yang bertepatan dengan tahun 1596 hingga 1676 M."
