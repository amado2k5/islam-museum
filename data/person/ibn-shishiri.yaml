summary:
  ar: "عبد الله ابن الشيشري الحنفي؛ قرأ على علماء العجم وبرع في العربية والمعقولات ثم دخل بلاد الروم وعيّن له السلطان سليم كل يوم ثلاثين عثمانياً، وعمل قصيدة بالفارسية نحو ثلاثين بيتاً أحد مصراعي كل بيت تاريخ لسلطنة السلطان سليمان والمصراع الثاني تاريخ لفتح رودس؛ وله حواش على حاشية شرح المطالع للسيد الشريف وشرح على الكافية ورسالة في المعنى فارسية {cite:shadharat-dhahab p. 560}."
  en: "A Persian-lands scholar who excelled in Arabic and the rational sciences, then entered Anatolia on Selim's thirty-uthmani daily stipend; his thirty-line Persian qasida carries a chronogram for Sulayman's accession in one hemistich and for the conquest of Rhodes in the other; author of glosses on the Sharif's Talkhis sharh and a sharh on the Kafiya {cite:shadharat-dhahab p. 560}."
