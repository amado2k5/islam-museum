summary:
  ar: "عالم ومؤرخ هندي ثم باكستاني (1884–1953) من ديسنه في بهار، من أبرز تلامذة شبلي النعماني؛ تخرج من دار العلوم ندوة العلماء سنة 1906 ودرّس فيها، وأكمل «سيرة النبي» لشيخه بعد وفاته، وأسس دار المصنفين في أعظم كره وحرّر مجلة «معارف»، وصار في آخر حياته مريدًا وخليفة لأشرف علي التهانوي، وهاجر إلى كراتشي سنة 1950 وتوفي فيها."
  en: "Indian, then Pakistani, scholar and historian (1884–1953) of Desna in Bihar, among the foremost pupils of Shibli Nomani; he graduated from Darul Uloom Nadwatul Ulama in 1906 and taught there, completed his teacher's Sirat-un-Nabi after Shibli's death, founded Darul Musannifeen at Azamgarh and edited the journal Ma'arif, became in later life a disciple and khalifa of Ashraf Ali Thanwi, moved to Karachi in 1950 and died there."
  ur: "بھارتی اور پھر پاکستانی عالم و مؤرخ (1884ء–1953ء) جن کا تعلق بہار کے دیسنہ سے تھا، شبلی نعمانی کے ممتاز شاگردوں میں سے تھے؛ 1906ء میں دار العلوم ندوۃ العلماء سے فارغ ہوئے اور وہیں مدرس رہے، استاد کی وفات کے بعد «سیرت النبی» مکمل کی، اعظم گڑھ میں دار المصنفین قائم کیا اور مجلہ «معارف» جاری کیا، آخر عمر میں اشرف علی تھانوی کے مرید و خلیفہ ہوئے، 1950ء میں کراچی منتقل ہوئے اور وہیں انتقال کیا۔"
