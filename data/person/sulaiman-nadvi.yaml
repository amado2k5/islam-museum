    note: "Two independent texts state his personal discipleship and khilafa, which is the lane's test for a sufi segment. The English text states that later in life he formed a close spiritual relation with Ashraf Ali Thanwi and became his disciple. The Arabic text, independently written from Urdu biographical literature, names him in its lead among the foremost students and khulafa of Thanwi and styles him 'al-Naqshbandi al-Mujaddidi'. A Hanafi naming is preserved but not recorded as a segment: the same Arabic lead styles him 'al-Hanafi', but no second independent text names a madhhab for him — the English and Urdu texts name none, and his own risala titled Ahl-us-Sunnah-wal-Jama'ah is a work, not a text naming his school — so the madhhab naming rests on one text and stands one attestation short. His father's being a Sufi is family background and never counts. His tariqa affiliation and his school are kept separate, neither inferred from the other."
