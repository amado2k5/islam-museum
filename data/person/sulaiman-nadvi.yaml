summary:
  ar: "عالم ومؤرخ هندي ثم باكستاني (1884–1953) من ديسنه في بهار، من أبرز تلامذة شبلي النعماني؛ تخرج من دار العلوم ندوة العلماء سنة 1906 ودرّس فيها، وأكمل «سيرة النبي» لشيخه بعد وفاته، وأسس دار المصنفين في أعظم كره وحرّر مجلة «معارف»، وصار في آخر حياته مريدًا وخليفة لأشرف علي التهانوي، وهاجر إلى كراتشي سنة 1950 وتوفي فيها."
  en: "Indian, then Pakistani, scholar and historian (1884–1953) of Desna in Bihar, among the foremost pupils of Shibli Nomani; he graduated from Darul Uloom Nadwatul Ulama in 1906 and taught there, completed his teacher's Sirat-un-Nabi after Shibli's death, founded Darul Musannifeen at Azamgarh and edited the journal Ma'arif, became in later life a disciple and khalifa of Ashraf Ali Thanwi, moved to Karachi in 1950 and died there."
  ur: "بھارتی اور پھر پاکستانی عالم و مؤرخ ⁦(1884ء–1953ء)⁩ جن کا تعلق بہار کے دیسنہ سے تھا، شبلی نعمانی کے ممتاز شاگردوں میں سے تھے؛ 1906ء میں دار العلوم ندوۃ العلماء سے فارغ ہوئے اور وہیں مدرس رہے، استاد کی وفات کے بعد «سیرت النبی» مکمل کی، اعظم گڑھ میں دار المصنفین قائم کیا اور مجلہ «معارف» جاری کیا، آخر عمر میں اشرف علی تھانوی کے مرید و خلیفہ ہوئے، 1950ء میں کراچی منتقل ہوئے اور وہیں انتقال کیا۔"
  es: "Erudito e historiador indio, luego pakistaní (1884-1953), originario de Desna en Bihar, fue uno de los alumnos más destacados de Shibli Nomani; se graduó de Darul Uloom Nadwatul Ulama en 1906 y enseñó allí, completó el Sirat-un-Nabi de su maestro después de la muerte de Shibli, fundó Darul Musannifeen en Azamgarh y editó la revista Ma'arif, se convirtió en su vida posterior en discípulo y califa de Ashraf Ali Thanwi, se mudó a Karachi en 1950 y murió allí."
  fr: "Érudit et historien indien, puis pakistanais (1884-1953) de Desna au Bihar, parmi les plus éminents élèves de Shibli Nomani; il obtint son diplôme de Darul Uloom Nadwatul Ulama en 1906 et y enseigna, acheva le Sirat-un-Nabi de son maître après la mort de Shibli, fonda Darul Musannifeen à Azamgarh et édita la revue Ma'arif, devint plus tard disciple et khalifa d'Ashraf Ali Thanwi, s'installa à Karachi en 1950 et y mourut."
  tr: "Hintli bir alim ve tarihçi, ardından Pakistanlı (1884–1953), Bihar doğumlu olan Shibli al-Numani'nin en önde gelen öğrencilerinden biriydi. 1906'da Dar al-Uloom Nadwat al-Ulama'dan mezun oldu, orada öğretmenlik yaptı, ölümünden sonra Peygamber'in biyografisini tamamladı, Dar al-Musannifin fi Azam al-Khar'ı kurdu, 'Maarif' dergisini düzenledi ve daha sonra Ashraf Ali al-Tihanawi'nin öğrencisi ve halefi oldu. 1950'de Karaçi'ye göç etti ve orada hayatını kaybetti."
  id: "Seorang cendekiawan dan sejarawan India yang kemudian berkebangsaan Pakistan (1884–1953), lahir di Bihar, ia adalah salah satu murid paling terkemuka Shibli al-Numani. Ia lulus dari Dar al-Uloom Nadwat al-Ulama pada tahun 1906, mengajar di sana, menyelesaikan biografi gurunya tentang Nabi setelah kematiannya, mendirikan Dar al-Musannifin fi Azam al-Khar, mengedit majalah 'Maarif', dan kemudian menjadi murid serta penerus Ashraf Ali al-Tihanawi. Ia bermigrasi ke Karachi pada tahun 1950 dan meninggal di sana."
