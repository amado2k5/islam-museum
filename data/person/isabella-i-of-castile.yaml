summary:
  ar: "ملكة قشتالة وزوج فرناندو ملك أرغون، ويُعرفان معاً بالملكين الكاثوليكيين. تذكر دائرة المعارف الإسلامية أن عرشها نُوزع عليها منذ توليها في أواخر 1474م، ثم استقر بمعاهدة ألكاسوفاس في 4 سبتمبر 1479م، فتمكن الملكان من توجيه جهدهما إلى غرناطة. وتقول المقالات إنهما دخلا الحمراء في 6 يناير 1492م بعد تسليم غرناطة، وإنهما أمرا بتقوية قصورها وترميمها، وإن الملكين الكاثوليكيين أصدرا سنة 1502م مرسوم التنصير الإجباري في الأراضي القشتالية {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1059} {cite:encyclopaedia-of-islam-2 vol. 7 p. 316}."
  en: "Queen of Castile and wife of Ferdinand of Aragon, the two being known together as the Catholic Monarchs. The Encyclopaedia of Islam says her throne was contested from her accession in late 1474 and was put on firmer ground by the Treaty of Alcacobas of 4 September 1479, after which the monarchs could turn to Granada. The articles say the pair entered the Alhambra on 6 January 1492 after Granada's surrender, had its palaces strengthened and restored, and that the Catholic Kings decreed compulsory conversion in the Castilian domains in 1502 {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1059} {cite:encyclopaedia-of-islam-2 vol. 7 p. 316}."
  ur: "قشتالہ کی ملکہ اور آراگون کے فرڈیننڈ کی اہلیہ؛ دونوں مل کر کیتھولک بادشاہین کہلاتے ہیں۔ اسلامی دائرۃ المعارف کے مطابق 1474ء کے آخر میں ان کے تخت نشین ہونے کے بعد ان کے تخت پر جھگڑا رہا اور 4 ستمبر 1479ء کے معاہدۂ آلکاسوواس سے وہ مضبوط بنیاد پر آیا، جس کے بعد دونوں بادشاہ غرناطہ کی طرف متوجہ ہو سکے۔ مضامین کے مطابق غرناطہ کی حوالگی کے بعد وہ 6 جنوری 1492ء کو الحمراء میں داخل ہوئے، اس کے محلات کو مضبوط اور بحال کرایا، اور کیتھولک بادشاہوں نے 1502ء میں قشتالی علاقوں میں جبری تبدیلیٔ مذہب کا حکم دیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 2 p. 1059} {cite:encyclopaedia-of-islam-2 vol. 7 p. 316}۔"
