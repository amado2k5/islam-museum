summary:
  ar: "عابدة من بني مخزوم جاورت بمكة، يذكرها ابن الجوزي في «صفة الصفوة» أول عابدات مكة برواية سلمة بن خالد المخزومي: كانت إذا رأت باب الكعبة مفتوحاً صرخت حتى يغمى عليها، ولا تكاد تفارق المسجد، فلما أخبرتها امرأة يوماً بفتح البيت في غيبتها صرخت واضطربت حتى ماتت."
  en: "A devout woman of Banu Makhzum who lived beside the sanctuary in Mecca; Ibn al-Jawzi places her first among the devout women of Mecca in Sifat al-Safwa, on the report of Salama ibn Khalid al-Makhzumi: when she saw the door of the Ka'ba open she would cry out until she fainted, she hardly left the mosque, and when a woman told her one day that the House had been opened in her absence she cried out and trembled until she died."
