roles: [mystic]
summary:
  ar: "عابدة من بني مخزوم جاورت بمكة، يذكرها ابن الجوزي في «صفة الصفوة» أول عابدات مكة برواية سلمة بن خالد المخزومي: كانت إذا رأت باب الكعبة مفتوحاً صرخت حتى يغمى عليها، ولا تكاد تفارق المسجد، فلما أخبرتها امرأة يوماً بفتح البيت في غيبتها صرخت واضطربت حتى ماتت."
  en: "A devout woman of Banu Makhzum who lived beside the sanctuary in Mecca; Ibn al-Jawzi places her first among the devout women of Mecca in Sifat al-Safwa, on the report of Salama ibn Khalid al-Makhzumi: when she saw the door of the Ka'ba open she would cry out until she fainted, she hardly left the mosque, and when a woman told her one day that the House had been opened in her absence she cried out and trembled until she died."
  es: "Una mujer devota de Banu Makhzum que vivía junto al santuario en La Meca; Ibn al-Jawzi la sitúa en primer lugar entre las mujeres devotas de La Meca en Sifat al-Safwa, según el relato de Salama ibn Khalid al-Makhzumi: cuando veía la puerta de la Kaaba abierta, gritaba hasta desmayarse, apenas salía de la mezquita, y cuando una mujer le dijo un día que la Casa se había abierto en su ausencia, gritó y tembló hasta morir."
  fr: "Une femme pieuse de Banu Makhzum qui vivait près du sanctuaire à La Mecque; Ibn al-Jawzi la place en première position parmi les femmes pieuses de La Mecque dans Sifat al-Safwa, d'après le récit de Salama ibn Khalid al-Makhzumi: lorsqu'elle voyait la porte de la Kaaba ouverte, elle criait jusqu'à s'évanouir, elle quittait rarement la mosquée, et lorsqu'une femme lui annonça un jour que la Maison avait été ouverte en son absence, elle cria et trembla jusqu'à en mourir."
  ur: "بنو مخزوم کی ایک متقی عورت جو مکہ میں حرم کے ساتھ رہتی تھی؛ ابن الجوزی نے سلمہ بن خالد المخزومی کی روایت میں اسے مکہ کی متقی عورتوں میں صفات الصفوی میں سب سے پہلے درج کیا ہے: جب وہ خانہ کعبہ کا دروازہ کھلا دیکھتی تھیں تو روتی تھیں یہاں تک کہ وہ بے ہوش ہو جاتی تھیں، وہ مشکل سے مسجد سے باہر نکلتی تھیں، اور جب ایک عورت نے اسے بتایا کہ اس کی غیر موجودگی میں خانہ کعبہ کھول دیا گیا ہے تو وہ رونے لگی اور وہ مر گئی۔"
