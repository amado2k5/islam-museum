summary:
  ar: "عالم ومؤلف ومحاضر مسلم بريطاني يُعرف بالشيخ عاصم خان. ألف خمسة كتب منها «السيرة المبسطة» و«قلب القرآن» وهو شرح لسورة يس. وهو حافظ للقرآن، حاصل على ماجستير في الصيدلة من كلية لندن الجامعية، ودرس العربية وعلوم القرآن في القاهرة، وتنشر منصة مسلم سنترال محاضراته المسجلة في التفسير."
  en: "A British Muslim scholar, author and lecturer known as Shaykh Asim Khan. He is the author of five books, including The Simple Seerah and The Heart of the Qur'ān, a commentary on Surat Yāsīn. A Hafidh of the Qur'ān with a Masters in Pharmacy from University College London, he studied Arabic and Qur'anic sciences in Cairo, and Muslim Central distributes his recorded tafsir lectures."
  ur: "برطانوی مسلمان عالم، مصنف و مدرس، جو شیخ عاصم خان کے نام سے معروف ہیں۔ وہ پانچ کتابوں کے مصنف ہیں جن میں ’دی سمپل سیرہ‘ اور سورۃ یٰسین کی تفسیر ’دی ہارٹ آف دی قرآن‘ شامل ہیں۔ وہ حافظِ قرآن ہیں، یونیورسٹی کالج لندن سے فارمیسی میں ماسٹرز کیا، قاہرہ میں عربی اور علومِ قرآن کی تعلیم حاصل کی، اور مسلم سینٹرل ان کے تفسیری دروس نشر کرتا ہے۔"
