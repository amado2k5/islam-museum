id: person/abdallah-ibn-maymun-al-qaddah
class: person
label: { ar: "عبد الله بن ميمون القداح", en: "Abdallah Ibn Maymun Al Qaddah" }
summary:
  ar: "عبد الله بن ميمون ويعرف ميمون بالقداح وكان من أهل قوزح العباس بقرب مدينة الأهواز، قال ابن رزام كان ميمون وابنه ديصانيين وأظهر ميمون اتباع أبي الخطاب محمد بن أبي زينب الذي دعا إلى إلهية علي بن أبي طالب، وادعى عبد الله أنه في مدة طويلة وكان يظهر الشعابذ ويذكر أن الأرض تطوى له، وانتقل فنزل عسكر مكرم فكبس بها فهرب منها فنقضت له داران بموضع يعرف بساباط أبي نوح فبنيت إحداهما مسجدا والأخرى خراب، ثم صار إلى البصرة فنزل على قوم من أولاد عقيل بن أبي طالب فكبس هناك فهرب إلى سلمية بقرب حمص واشترى هناك ضياعا وبث الدعاة إلى سواد الكوفة {cite:fihrist-ibn-al-nadim p. 264-265}. وعند ابن الجوزي جعل لهم رأس يعرف بعبيد الله بن ميمون بن عمر ويقال ابن ديصان قداح الأهوازي وكان مشيداً ممحلاً وكان معظم مخرقته بإظهار الزهد والورع وأن الأرض تطوى له، وكان يبعث خواص أصحابه إلى الأطراف معهم طير ويأمرهم أن يكتبوا إليه بالأخبار عن الأباعد ثم يحدث الناس بذلك فيقوى شبههم {cite:muntazam-ibn-al-jawzi p. 119}"
  en: "Abdallah ibn Maymun al-Qaddah — the founder of the da'wa per Ibn Rizam's hostile account {cite:fihrist-ibn-al-nadim}"
