id: person/abdallah-ibn-maymun-al-qaddah
class: person
label: { ar: "عبد الله بن ميمون القداح", en: "Abdallah Ibn Maymun Al Qaddah", fr: "Abdallah Ibn Maymun Al Qaddah", es: "Abdallah Ibn Maymun Al Qaddah", ur: "عبداللہ ابن میمون القدہ" }
summary:
  ar: "عبد الله بن ميمون ويعرف ميمون بالقداح وكان من أهل قوزح العباس بقرب مدينة الأهواز، قال ابن رزام كان ميمون وابنه ديصانيين وأظهر ميمون اتباع أبي الخطاب محمد بن أبي زينب الذي دعا إلى إلهية علي بن أبي طالب، وادعى عبد الله أنه في مدة طويلة وكان يظهر الشعابذ ويذكر أن الأرض تطوى له، وانتقل فنزل عسكر مكرم فكبس بها فهرب منها فنقضت له داران بموضع يعرف بساباط أبي نوح فبنيت إحداهما مسجدا والأخرى خراب، ثم صار إلى البصرة فنزل على قوم من أولاد عقيل بن أبي طالب فكبس هناك فهرب إلى سلمية بقرب حمص واشترى هناك ضياعا وبث الدعاة إلى سواد الكوفة {cite:fihrist-ibn-al-nadim p. 264-265}. وعند ابن الجوزي جعل لهم رأس يعرف بعبيد الله بن ميمون بن عمر ويقال ابن ديصان قداح الأهوازي وكان مشيداً ممحلاً وكان معظم مخرقته بإظهار الزهد والورع وأن الأرض تطوى له، وكان يبعث خواص أصحابه إلى الأطراف معهم طير ويأمرهم أن يكتبوا إليه بالأخبار عن الأباعد ثم يحدث الناس بذلك فيقوى شبههم {cite:muntazam-ibn-al-jawzi p. 119}"
  en: "Abdallah ibn Maymun al-Qaddah — the founder of the da'wa per Ibn Rizam's hostile account {cite:fihrist-ibn-al-nadim}"
  fr: "Abdallah ibn Maymun al-Qaddah — le fondateur de la da'wa selon le récit hostile d'Ibn Rizam {cite:fihrist-ibn-al-nadim}"
  es: "Abdallah ibn Maymun al-Qaddah, el fundador de la da'wa según el relato hostil de Ibn Rizam {cita:fihrist-ibn-al-nadim}"
  ur: "عبداللہ بن میمون القدہ - دعوۃ فی ابن رزام کے مخالفانہ اکاؤنٹ کا بانی"
  tr: "Abdullah ibn Maymun, diğer adıyla Maymun el-Kadde, Ahvaz şehri yakınlarındaki Kaze el-Abbas halkındandı. İbn Razam, Maymun ve oğlunun Daysani olduğunu ve Maymun'un açıkça Ebu el-Hattab Muhammed ibn Abi Zeyneb'e bağlılığını ilan ettiğini, Ebu el-Hattab Muhammed ibn Abi Zeyneb'in ise Ali ibn Abi Talib'in ilahlığını savunduğunu söyledi. Abdullah, uzun bir süre boyunca sihir belirtileri gösterdiğini ve yerin kendisi için büküldüğünü söylediğini iddia etti. Askar Mukram'a taşındı ve yerleşti, ancak orada saldırıya uğradı ve oradan kaçtı. Sabat Abi Nuh olarak bilinen bir yerde iki evi yıkıldı; bunlardan biri cami olarak inşa edildi, diğeri ise harabe halinde kaldı. Daha sonra Basra'ya gitti ve Akil ibn Abi Talib'in bazı torunlarıyla kaldı, ancak orada saldırıya uğradı ve Humus yakınlarındaki Selemeye'ye kaçtı. Orada mülkler satın aldı ve Kufa Sawad'ına vaizler gönderdi. {cite:fihrist-ibn-al-nadim p. 264-265}. İbn el-Cevzi, onlara Ubeyd Allah ibn Maymun ibn Ömer olarak bilinen, aynı zamanda İbn Daysan Kadde el-Ahvazi diye de anılan bir lider atadı. O, güçlü ve zengin bir adamdı ve aldatmacasının çoğu, zühd ve dindarlık göstererek ve yeryüzünün onun için katlanacağını vaat ederek gerçekleşiyordu. Yakın arkadaşlarını kuşlarla birlikte uzak bölgelere gönderir ve onlardan uzaklardaki insanlar hakkında kendisine haber yazmalarını isterdi, sonra da bunu insanlara anlatarak şüphelerini artırırdı. {cite:muntazam-ibn-al-jawzi s. 119}"
  id: "Abdullah ibn Maymun, juga dikenal sebagai Maymun al-Qaddah, berasal dari penduduk Qozah al-Abbas dekat kota Ahwaz. Ibn Razam mengatakan bahwa Maymun dan putranya adalah pengikut Daysani, dan Maymun secara terbuka menyatakan kesetiaannya kepada Abu al-Khattab Muhammad ibn Abi Zaynab, yang menyerukan ketuhanan Ali ibn Abi Talib. Abdullah mengklaim bahwa ia berada dalam periode waktu yang lama dan ia akan menunjukkan tanda-tanda sihir dan menyebutkan bahwa bumi terlipat untuknya. Ia pindah dan menetap di Askar Mukram, tetapi ia diserang di sana dan melarikan diri. Dua rumahnya dihancurkan di tempat yang dikenal sebagai Sabat Abi Nuh, salah satunya dibangun sebagai masjid dan yang lainnya tetap dalam reruntuhan. Kemudian ia pergi ke Basra dan tinggal bersama beberapa keturunan Aqil ibn Abi Talib, tetapi ia diserang di sana dan melarikan diri ke Salamiyah dekat Homs. Di sana ia membeli tanah dan mengirim para pendakwah ke Sawad di Kufa. {kutipan:fihrist-ibn-al-nadim hlm. 264-265}. Dan Ibn al-Jawzi menunjuk seorang pemimpin untuk mereka yang dikenal sebagai Ubayd Allah ibn Maymun ibn Umar, juga disebut Ibn Daysan Qaddah al-Ahwazi. Dia adalah orang yang berkuasa dan kaya, dan sebagian besar tipu dayanya adalah dengan menunjukkan sikap asketisme dan kesalehan, dan bahwa bumi akan dilipat untuknya. Dia akan mengirim sahabat-sahabat dekatnya ke daerah terpencil dengan burung-burung dan memerintahkan mereka untuk menulis kepadanya dengan berita tentang orang-orang yang jauh, kemudian dia akan memberi tahu orang-orang tentang hal itu, sehingga memperkuat keraguan mereka. {kutipan:muntazam-ibn-al-jawzi hlm. 119}"
