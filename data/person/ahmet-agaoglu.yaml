summary:
  ar: "كاتب وسياسي وحقوقي أذربيجاني-تركي (1869–1939)، وُلد في شوشة ودرس في بطرسبرغ وباريس. حرّر صحف «الحياة» و«إرشاد» في باكو، وأسس حزب «دفاعي» السري، ثم انتقل إلى إسطنبول فنُفي إلى مالطا، وصار نائبًا في المجلس الوطني التركي ومستشارًا لأتاتورك، وهو مؤسس «الكمالية الليبرالية» ومنظّر الحزب الجمهوري الحر سنة 1930."
  en: "Azerbaijani-Turkish writer, politician and jurist (1869–1939), born at Shusha and educated at St Petersburg and Paris. He edited the Baku newspapers Hayat and Irshad, founded the secret Difai party, moved to Istanbul and was exiled to Malta, then sat in the Turkish Grand National Assembly and advised Atatürk; he was the founder of liberal Kemalism and the theorist of the Free Republican Party of 1930."
  ur: "آذربائجانی-ترک مصنف، سیاست دان اور حقوق دان (1869–1939)، شوشا میں پیدا ہوئے اور سینٹ پیٹرزبرگ اور پیرس میں پڑھے۔ باکو میں «حیات» اور «ارشاد» اخبارات کی ادارت کی، خفیہ جماعت «دفاعی» بنائی، پھر استنبول گئے اور مالٹا جلاوطن ہوئے، بعد میں ترک قومی اسمبلی کے رکن اور اتاترک کے مشیر رہے؛ وہ لبرل کیمالزم کے بانی اور 1930 کی آزاد جمہوری جماعت کے نظریہ ساز تھے۔"
