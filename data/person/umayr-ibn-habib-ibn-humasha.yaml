summary:
  ar: "عمير بن حبيب بن حماشة، صحابي يروي عنه حفيده أبو جعفر الخطمي وصيته لبنيه في اجتناب مجالسة السفهاء والصبر على الأذى في الأمر بالمعروف، ويفرد له أحمد بن حنبل باباً في كتاب الزهد {cite:zuhd-ahmad-dkim-1983 p. 236}."
  en: "Umayr ibn Habib ibn Humasha, a Companion whose grandson Abu Ja'far al-Khatmi relates his counsel to his sons to avoid the company of fools and to bear harm patiently when enjoining good; Ahmad ibn Hanbal gives him a chapter of Kitab al-Zuhd {cite:zuhd-ahmad-dkim-1983 p. 236}."
  ur: "عمیر بن حبیب بن حماشہ، صحابی، جن کے پوتے ابو جعفر خطمی ان کی وہ وصیت روایت کرتے ہیں جو انہوں نے بیٹوں کو بے وقوفوں کی صحبت سے بچنے اور امر بالمعروف میں اذیت پر صبر کرنے کی کی؛ احمد بن حنبل کتاب الزہد میں ان کے لیے ایک باب لاتے ہیں {cite:zuhd-ahmad-dkim-1983 p. 236}۔"
  es: "Umayr ibn Habib ibn Humasha, un Compañero cuyo nieto Abu Ja'far al-Khatmi relata su consejo a sus hijos de evitar la compañía de los necios y de soportar el daño con paciencia al ordenar el bien; Ahmad ibn Hanbal le dedica un capítulo del Kitab al-Zuhd {cite:zuhd-ahmad-dkim-1983 p. 236}."
  fr: "Umayr ibn Habib ibn Humasha, un Compagnon dont le petit-fils Abu Ja'far al-Khatmi relate ses conseils à ses fils d'éviter la compagnie des fous et de supporter patiemment le mal lorsqu'on ordonne le bien; Ahmad ibn Hanbal lui consacre un chapitre du Kitab al-Zuhd {cite:zuhd-ahmad-dkim-1983 p. 236}."
  tr: "Umair ibn Habib ibn Hamasha, torunu Ebu Ca'fer el-Hatmi'nin oğullarına aptallarla ilişki kurmamaları ve iyilik için zarara sabırlı olmaları konusunda öğüt verdiği bir arkadaşıdır. Ahmed ibn Hanbal, ona bir bölüm ayırmıştır {cite:zuhd-ahmad-dkim-1983, s. 236}."
  id: "Umair ibn Habib ibn Hamasha, seorang sahabat dari siapa cucunya Abu Ja'far al-Khatmi menceritakan nasihatnya kepada anak-anaknya untuk menghindari bergaul dengan orang bodoh dan bersabar dengan bahaya dalam memerintahkan kebaikan. Ahmad ibn Hanbal mendedikasikan sebuah bab untuknya dalam kitab asketisme {cite:zuhd-ahmad-dkim-1983, hlm. 236}."
