  ar: "عمير بن حبيب بن حماشة، صحابي يروي عنه حفيده أبو جعفر الخطمي وصيته لبنيه في اجتناب مجالسة السفهاء والصبر على الأذى في الأمر بالمعروف، ويفرد له أحمد بن حنبل باباً في كتاب الزهد {cite:zuhd-ahmad-dkim-1983 p. 236}."
  en: "Umayr ibn Habib ibn Humasha, a Companion whose grandson Abu Ja'far al-Khatmi relates his counsel to his sons to avoid the company of fools and to bear harm patiently when enjoining good; Ahmad ibn Hanbal gives him a chapter of Kitab al-Zuhd {cite:zuhd-ahmad-dkim-1983 p. 236}."
  ur: "عمیر بن حبیب بن حماشہ، صحابی، جن کے پوتے ابو جعفر خطمی ان کی وہ وصیت روایت کرتے ہیں جو انہوں نے بیٹوں کو بے وقوفوں کی صحبت سے بچنے اور امر بالمعروف میں اذیت پر صبر کرنے کی کی؛ احمد بن حنبل کتاب الزہد میں ان کے لیے ایک باب لاتے ہیں {cite:zuhd-ahmad-dkim-1983 p. 236}۔"
