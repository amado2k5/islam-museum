summary:
  ar: "سنان بن سلمة بن المحبق الهذلي؛ كان فاضلاً متألهاً وهو أول من أحاف الجند بالطلاق فتح مكران عنوة ومصرها وأقام بها وضبط البلاد ومات بقصدار وقال ابن الكلبي إن حكيم بن جبلة فتح مكران وقام بأمر الناس بعد راشد بن عمرو فولاه زياد الثغر سنتين."
  en: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali; pious commander, first to bind troops with divorce-oaths — took Makran by storm, garrisoned it, died at Qusdar, and held the frontier two years after Rashid ibn Amr's fall. Ibn al-Kalbi credits Hakim ibn Jabala with Makran's conquest."
