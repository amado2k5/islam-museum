label: { ar: "سنان بن سلمة بن المحبق الهذلي", en: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali", es: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali", fr: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali" }
summary:
  ar: "سنان بن سلمة بن المحبق الهذلي؛ كان فاضلاً متألهاً وهو أول من أحاف الجند بالطلاق فتح مكران عنوة ومصرها وأقام بها وضبط البلاد ومات بقصدار وقال ابن الكلبي إن حكيم بن جبلة فتح مكران وقام بأمر الناس بعد راشد بن عمرو فولاه زياد الثغر سنتين."
  en: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali; pious commander, first to bind troops with divorce-oaths — took Makran by storm, garrisoned it, died at Qusdar, and held the frontier two years after Rashid ibn Amr's fall. Ibn al-Kalbi credits Hakim ibn Jabala with Makran's conquest."
  es: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali, un comandante piadoso, fue el primero en jurar lealtad a sus tropas mediante el divorcio. Tomó Makrán por asalto, la guarneció, murió en Qusdar y mantuvo el control de la frontera dos años después de la caída de Rashid ibn Amr. Ibn al-Kalbi atribuye la conquista de Makrán a Hakim ibn Jabala."
  fr: "Sinan ibn Salama ibn al-Muhabbiq al-Hudhali, commandant pieux et premier à sceller ses troupes par des serments de divorce, s'empara de Makran, y établit une garnison, mourut à Qusdar et conserva la frontière deux ans après la chute de Rashid ibn Amr. Ibn al-Kalbi attribue la conquête de Makran à Hakim ibn Jabala."
