id: person/musa-ibn-bugha
class: person
label: { ar: "موسى بن بغا", en: "Musa ibn Bugha" , ur: "موسیٰ بن بغا", es: "Musa ibn Bugha", fr: "Musa ibn Bugha"}
summary:
  ar: "عامل المعتز على الجبل؛ عند البلاذري وجهه إلى قم لمحاربة الطالبيين الذين ظهروا بطبرستان ففتحها عنوة وقتل من أهلها خلقاً كثيراً. وعند المسعودي أخرجه المهتدي مع بايكيال إلى حرب مساور الشاري صاحب الزنج، وتضارب بايكيال وموسى بالكتب في قتل بعضهما حتى علما بالأمر فرجعا، وكان موسى غير داخل في فعل الأتراك بقتل المهتدي {cite:muruj-al-dhahab p. 559-560}، وعند ابن الجوزي شخّصه المعتمد من سامرا لحرب الزنج في ذي القعدة سنة تسع وخمسين ومائتين وشيّعه وخلع عليه في الطريق فحاربهم بضعة عشر شهرًا ثم صُرف، وضُمّ إلى المفوض ابن المعتمد حين قُسمت المملكة سنة إحدى وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 105, 116}، وعند المسعودي توفي سنة أربع وستين ومائتين وكان شاعر قد امتدحه فلم يصله بشيء قال فيه مات موسى فهان ذاك علينا لم يضرني إذ قيل قدمات شيا {cite:muruj-al-dhahab p. 576-577}"

  en: "al-Mu'tazz's Jibal agent; in al-Baladhuri, sent against Qumm amid the Tabaristan Talibi war — took it by storm, killing many."
  ur: "عباسی قائد اور معتز کے عاملِ جبال؛ بلاذری قم کی شورش کے دوران ان کی فوجی کارروائی کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "el agente Jibal de al-Mu'tazz; en al-Baladhuri, enviado contra Qumm en medio de la guerra de Tabaristán Talibi, tomó por asalto y mató a muchos."
  fr: "l'agent Jibal d'al-Mu'tazz; à al-Baladhuri, envoyé contre Qumm au milieu de la guerre des talibis au Tabaristan — l'a pris d'assaut, tuant de nombreuses personnes."
  tr: "Al-Mu'tazz onu dağın valisi olarak atadı; Al-Baladhuri'nin yerinde, Tabaristan'da ortaya çıkan Talibanlarla savaşmak için Kum'a gitti, ancak burayı zorla fethetti ve birçok halkını öldürdü. al-Mas'udi'ye göre, el-Muhtadi onu Baykyal ile birlikte Zanj hükümdarının tüccarına karşı savaşa göndermiştir. Baykyal ve Musa, olaydan haberdar olup geri dönene kadar mektuplarda birbirlerinin öldürülmesi konusunda tartışmıştır. Musa, Türklerin el-Muhtadi'yi öldürme eylemine karışmamıştır {cite:muruj-al-dhahab s. 559-560}. İbn al-Jawzi'ye göre, Samarra'dan al-Mu'tamid 259 Hicri yılında Dhu al-Qi'dah'da Zanj savaşına girmiş ve yolda onu tahttan indirmiş, birkaç ay savaşmış ve ardından görevden alınmıştır. Krallık altmış birinci yılda bölünürken delege İbn al-Mu'tamid ile birlikte yer almıştır Ve iki yüz {alıntı:Muntazam-ibn-al-jawzi s. 105, 116} ve el-Mes'udi'ye göre iki yüz altmış dört yılda öldü. Bir şair onu övmüş ama ona hiçbir şey anlatmamış, 'Musa öldü, bizi küçük düşürdü ve bana zarar vermedi, çünkü şöyle deniyordu: Bir şeyin ayakları {atıf:muruj-al-dhahab s. 576-577}"
  id: "Al-Mu'tazz mengangkatnya sebagai gubernur gunung; di posisi Al-Baladhuri, ia menuju Qom untuk melawan Talibid yang muncul di Tabaristan, tetapi ia menaklukkannya secara paksa dan membunuh banyak penduduknya. Menurut al-Mas'udi, al-Muhtadi mengirimnya bersama Baykyal untuk berperang melawan pedagang penguasa Zanj. Baykyal dan Musa saling berselisih dalam surat hingga mereka mengetahui hal itu dan kembali. Musa tidak terlibat dalam tindakan Turki untuk membunuh al-Muhtadi {cite:muruj-al-dhahab hlm. 559-560}. Menurut Ibn al-Jawzi, al-Mu'tamid dari Samarra berperang dalam perang Zanj di Dhu al-Qi'dah pada tahun 259 H, dan menggulingkannya di perjalanan, bertarung melawan mereka selama beberapa bulan, lalu diberhentikan. Ia diikuti dengan delegasi Ibn al-Mu'tamid ketika kerajaan terbagi pada tahun enam puluh satu Dan dua ratus {cite:Muntazam-ibn-al-jawzi hlm. 105, 116}, dan menurut al-Mas'udi ia meninggal pada tahun dua ratus enam puluh empat. Seorang penyair memujinya tetapi tidak menceritakan apa pun tentang hal itu, berkata, 'Musa meninggal, sehingga mempermalukan kami dan tidak menyakitiku, karena dikatakan demikian: Kaki sesuatu {cite:muruj-al-dhahab hlm. 576-577}"
