id: person/musa-ibn-bugha
class: person
label: { ar: "موسى بن بغا", en: "Musa ibn Bugha" , ur: "موسیٰ بن بغا"}
summary:
  ar: "عامل المعتز على الجبل؛ عند البلاذري وجهه إلى قم لمحاربة الطالبيين الذين ظهروا بطبرستان ففتحها عنوة وقتل من أهلها خلقاً كثيراً. وعند المسعودي أخرجه المهتدي مع بايكيال إلى حرب مساور الشاري صاحب الزنج، وتضارب بايكيال وموسى بالكتب في قتل بعضهما حتى علما بالأمر فرجعا، وكان موسى غير داخل في فعل الأتراك بقتل المهتدي {cite:muruj-al-dhahab p. 559-560}، وعند ابن الجوزي شخّصه المعتمد من سامرا لحرب الزنج في ذي القعدة سنة تسع وخمسين ومائتين وشيّعه وخلع عليه في الطريق فحاربهم بضعة عشر شهرًا ثم صُرف، وضُمّ إلى المفوض ابن المعتمد حين قُسمت المملكة سنة إحدى وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 105, 116}، وعند المسعودي توفي سنة أربع وستين ومائتين وكان شاعر قد امتدحه فلم يصله بشيء قال فيه مات موسى فهان ذاك علينا لم يضرني إذ قيل قدمات شيا {cite:muruj-al-dhahab p. 576-577}"

  en: "al-Mu'tazz's Jibal agent; in al-Baladhuri, sent against Qumm amid the Tabaristan Talibi war — took it by storm, killing many."
  ur: "عباسی قائد اور معتز کے عاملِ جبال؛ بلاذری قم کی شورش کے دوران ان کی فوجی کارروائی کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
