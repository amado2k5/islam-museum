summary:
  ar: "صصة بن داهر؛ هرب يريد العراق ليشكو غدر الجنيد بن عبد الرحمن فلم يزل يؤنسه حتى وضع يده في يده فقتله."
  en: "Sasa ibn Dahir; fleeing to Iraq to charge al-Junayd's treachery, he was soothed into a handclasp — and killed."
