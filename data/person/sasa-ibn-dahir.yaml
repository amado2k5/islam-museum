  tr: "Sassa bin Dahir; Al-Junayd bin Abdul Rahman'ın ihanetinden şikayet etmek için Irak'a kaçtı, ancak onu teselli etmeye devam etti ve elini onun eline koyup öldürdü."
  id: "Sassa bin Dahir; ia melarikan diri ke Irak untuk mengeluh tentang pengkhianatan Al-Junayd bin Abdul Rahman, namun ia terus menghiburnya hingga ia meletakkan tangannya di tangan Sassa dan membunuhnya."
