summary:
  ar: "الحسين القلاس، الفقيه البغدادي، وكان من علية أصحاب الحديث وحفاظ مذهب الشافعي {cite:tabaqat-fuqaha-abbas-1981 p. 54}. حكى داود بن علي في «فضائل الشافعي» عنه عن أبي ثور وأبي علي الزعفراني {cite:tabaqat-fuqaha-abbas-1981 p. 54}. قال السبكي إن القلاس بالقاف واللام المشددة والسين المهملة، ويقال إن اسمه الحسن ⁦(حاشية المحقق، PDF ص54)⁩."
  tr: "Bağdatlı hukukçu El-Hüseyin el-Kallas, Şafii mezhebinin önde gelen hadis âlimleri ve koruyucularından biriydi {atıf:tabaqat-fuqaha-abbas-1981, s. 54}. Davud bin Ali, \"Fada'il al-Shafi'i\"de Ebu Tevr ve Ebu Ali el-Za'farani'den kendisinden rivayet etmiştir {cite:tabaqat-fuqaha-abbas-1981, s. 54}. Al-Subki, el-Kallas'ın vurgulu kaf, lam ve günah olarak atlandığını ve adının el-Hasan olduğu söylenmiştir (editörün dipnotu, PDF s. 54)."
  id: "Al-Husayn al-Qallas, ahli hukum Baghdadi, adalah salah satu ulama hadis terkemuka dan penjaga mazhab Shafi'i {cite:tabaqat-fuqaha-abbas-1981, hlm. 54}. Dawud ibn Ali menceritakan dalam \"Fada'il al-Shafi'i\" darinya dari Abu Thawr dan Abu Ali al-Za'farani {cite:tabaqat-fuqaha-abbas-1981, hlm. 54}. Al-Subki mengatakan bahwa al-Qallas dengan qaf yang ditekankan, lam, dan dosa dengan yang dihilangkan, dan dikatakan namanya adalah al-Hasan (catatan kaki editor, PDF hlm. 54)."
