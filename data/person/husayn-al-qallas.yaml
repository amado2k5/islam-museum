  ar: "الحسين القلاس، الفقيه البغدادي، وكان من علية أصحاب الحديث وحفاظ مذهب الشافعي {cite:tabaqat-fuqaha-abbas-1981 p. 54}. حكى داود بن علي في «فضائل الشافعي» عنه عن أبي ثور وأبي علي الزعفراني {cite:tabaqat-fuqaha-abbas-1981 p. 54}. قال السبكي إن القلاس بالقاف واللام المشددة والسين المهملة، ويقال إن اسمه الحسن (حاشية المحقق، PDF ص54)."
