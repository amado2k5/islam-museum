summary:
  ar: "قاضي القضاة الشافعي، مدرس المستنصرية؛ تفقه على والده العلامة أبي القاسم وبرع في المذهب والأصول والخلاف والنظر، وولي القضاء في آخر أيام الناصر فلما استخلف الظاهر عزله بعد شهرين، ورحل إلى خراسان وناظر علماءها وولي تدريس النظامية ببغداد ثم ولي قضاء القضاة ثم عزل، ودرس بالمستنصرية عند كمال عمارتها في رجب سنة إحدى وثلاثين وهو أول من درس بها؛ كان موصوفاً بحسن المناظرة سماحاً وجوداً ونبلاً {cite:shadharat-dhahab p. 146-147}."
  en: "Muhyi al-Din Ibn Fadlan (d. 631) — Shafi'i qadi al-qudat of Baghdad and the very first lecturer of the new Mustansiriyya (Rajab 631); a noted debater, generous and noble, he died months later {cite:shadharat-dhahab p. 146-147}."
