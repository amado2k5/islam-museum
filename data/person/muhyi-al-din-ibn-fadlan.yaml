summary:
  ar: "قاضي القضاة الشافعي، مدرس المستنصرية؛ تفقه على والده العلامة أبي القاسم وبرع في المذهب والأصول والخلاف والنظر، وولي القضاء في آخر أيام الناصر فلما استخلف الظاهر عزله بعد شهرين، ورحل إلى خراسان وناظر علماءها وولي تدريس النظامية ببغداد ثم ولي قضاء القضاة ثم عزل، ودرس بالمستنصرية عند كمال عمارتها في رجب سنة إحدى وثلاثين وهو أول من درس بها؛ كان موصوفاً بحسن المناظرة سماحاً وجوداً ونبلاً {cite:shadharat-dhahab p. 146-147}."
  en: "Muhyi al-Din Ibn Fadlan (d. 631) — Shafi'i qadi al-qudat of Baghdad and the very first lecturer of the new Mustansiriyya (Rajab 631); a noted debater, generous and noble, he died months later {cite:shadharat-dhahab p. 146-147}."
  es: "Muhyi al-Din ibn Fadlan (m. 631): Shafi'i qadi al-qudat de Bagdad y primer conferenciante del nuevo Mustansiriyya (Rajab 631); un destacado polemista, generoso y noble, murió meses después {citar: shadharat-dhahab p. 146-147}."
  fr: "Muhyi al-Din ibn Fadlan (mort en 631) — Shafi'i qadi al-qudat de Bagdad et le tout premier conférencier de la nouvelle Mustansiriyya (Rajab 631); débatteur réputé, généreux et noble, il mourut des mois plus tard {cite: shadharat-dhahab p. 146-147}."
  ur: "محی الدین ابن فضلان ⁦(متوفی 631)⁩ - بغداد کے شافعی قاضی القدات اور نئے مستنصریہ کے پہلے خطیب ⁦(رجب 631)⁩؛ ایک مشہور مباحثہ کرنے والا، فیاض اور عظیم، مہینوں بعد ان کا انتقال ہو گیا 146-147}۔"
  tr: "Şafii Başyargıcısı, Mustansiriya'nın öğretmeni; babası alim Ebu el-Kasım'dan fıkıh aldı, düşünce, ilkeler, anlaşmazlık ve akıl yürütme okulunda üstün başarı gösterdi. El-Nasir'in son günlerinde yargıyı üstlendi. El-Zahir onun yerine geçtiğinde, iki ay sonra görevden alındı. Horasan'a gitti, alimleriyle danıştı, Bağdat'ta Nizamiyye'yi öğretti, ardından yargıçların hakimi oldu ve görevden alındı. 31. yılın Recep'inde Mustansiriye'nin tamamlanmasının ardından orada ders verdiği ilk kişi oldu. Kendisi konuşan, cömert, hazır ve asil olarak tanımlandı {atıf:shadharat-dhahab, s. 146-147}."
  id: "Hakim Kepala Shafi'i, seorang guru Mustansiriya; ia belajar hukum di bawah ayahnya, ulama Abu al-Qasim, unggul dalam aliran pemikiran, prinsip, perselisihan, dan penalaran. Ia mengambil alih kehakiman pada hari-hari terakhir al-Nasir. Ketika al-Zahir menggantikannya, ia dipecat setelah dua bulan. Ia pergi ke Khorasan, berkonsultasi dengan para ulamanya, mengajar Nizamiyya di Baghdad, kemudian menjadi hakim hakim, dan diberhentikan. Ia mengajar di Mustansiriyah setelah selesai pada Rajab tahun 31, menjadi yang pertama mengajar di sana. Ia digambarkan sebagai fasih, murah hati, hadir, dan mulia {cite:shadharat-dhahab, hlm. 146-147}."
