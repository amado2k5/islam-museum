id: person/abu-hammu-i-musa-zayyanid
class: person
label:
  ar: أبو حمو موسى بن عثمان
  en: Abu Hammu I Musa ibn Uthman
summary:
  ar: "أبو حمو موسى بن عثمان بن يغمراسن سلطان تلمسان؛ اصطفى ابن عمه مسعوداً بن أبي عامر وقرّبه إلى خلواته، ودفع إلى ابنه عبد الرحمن أبا تاشفين أتراباً من المعلوجي يقومون بخدمته في مرباه، وكان كثيراً ما يقرع ابنه ويويخه إرهافاً في اكتساب الخلال ويعيره بمكان ابن عمه من النجابة، فاستشعر المعلوج غيرته وأغروه بالتوثب على الأمر، فتحينوا قايلة الهاجرة عند منصرف السلطان من مجلسه فهجموا ببطانتهم على خاصة القصر واعتوروه بأسيافهم فقتلوه، وقتلوا معه مسعود بن أبي عامر وأبا سرحان وهلك الوزراء بنو الملاح حجاب الدار من أهل قرطبة، وطاف الهاتف بسكك تلمسان بأن أبا سرحان غدر بالسلطان وأن ابنه أبا تاشفين ثار له."
  en: "Abu Hammu Musa ibn Uthman ibn Yaghmurasan, sultan of Tlemcen; he singled out his cousin Mas'ud ibn Abi Amir for his privy councils while heaping scorn on his son Abd al-Rahman Abu Tashfin, comparing him unfavourably to that cousin — until the son's M'aluji companions, stoking his envy, rushed the palace at the siesta hour as the council broke up, cut the sultan down with their swords, killed Mas'ud and Abu Sarhan, and massacred the Banu al-Mallah viziers, the Cordoban house of the hijaba — the town-crier going through Tlemcen's streets that Abu Sarhan had betrayed the sultan and his son Abu Tashfin had risen for him."
