id: person/abu-hammu-i-musa-zayyanid
class: person
label:
  ar: أبو حمو موسى بن عثمان
  en: Abu Hammu I Musa ibn Uthman
  fr: "Abu Hammu Ier Musa ibn Uthman"
  es: "Abu Hammu I Musa ibn Uthman"
  ur: "ابو حمو اول موسیٰ بن عثمان"
summary:
  ar: "أبو حمو موسى بن عثمان بن يغمراسن سلطان تلمسان؛ اصطفى ابن عمه مسعوداً بن أبي عامر وقرّبه إلى خلواته، ودفع إلى ابنه عبد الرحمن أبا تاشفين أتراباً من المعلوجي يقومون بخدمته في مرباه، وكان كثيراً ما يقرع ابنه ويويخه إرهافاً في اكتساب الخلال ويعيره بمكان ابن عمه من النجابة، فاستشعر المعلوج غيرته وأغروه بالتوثب على الأمر، فتحينوا قايلة الهاجرة عند منصرف السلطان من مجلسه فهجموا ببطانتهم على خاصة القصر واعتوروه بأسيافهم فقتلوه، وقتلوا معه مسعود بن أبي عامر وأبا سرحان وهلك الوزراء بنو الملاح حجاب الدار من أهل قرطبة، وطاف الهاتف بسكك تلمسان بأن أبا سرحان غدر بالسلطان وأن ابنه أبا تاشفين ثار له."
  en: "Abu Hammu Musa ibn Uthman ibn Yaghmurasan, sultan of Tlemcen; he singled out his cousin Mas'ud ibn Abi Amir for his privy councils while heaping scorn on his son Abd al-Rahman Abu Tashfin, comparing him unfavourably to that cousin — until the son's M'aluji companions, stoking his envy, rushed the palace at the siesta hour as the council broke up, cut the sultan down with their swords, killed Mas'ud and Abu Sarhan, and massacred the Banu al-Mallah viziers, the Cordoban house of the hijaba — the town-crier going through Tlemcen's streets that Abu Sarhan had betrayed the sultan and his son Abu Tashfin had risen for him."
  fr: "Abu Hammu Musa ibn Uthman ibn Yaghmurasan, sultan de Tlemcen ; il réservait à son cousin Mas'ud ibn Abi Amir ses conseils intimes tout en accablant de mépris son fils Abd al-Rahman Abu Tashfin, qu'il comparait défavorablement à ce cousin — jusqu'à ce que les compagnons mu'alluj du fils, attisant sa jalousie, se ruent sur le palais à l'heure de la sieste, au moment où le conseil se levait, abattent le sultan de leurs épées, tuent Mas'ud et Abu Sarhan, et massacrent les vizirs Banu al-Mallah, la maison cordouane de la hijaba — le crieur public parcourant les rues de Tlemcen pour annoncer qu'Abu Sarhan avait trahi le sultan et que son fils Abu Tashfin s'était levé pour lui."
  es: "Abu Hammu Musa ibn Uthman ibn Yaghmurasan, sultán de Tlemcen, eligió a su primo Mas'ud ibn Abi Amir para sus consejos privados, mientras que colmaba de desprecio a su hijo Abd al-Rahman Abu Tashfin, comparándolo desfavorablemente con ese primo, hasta que los compañeros M'aluji del hijo, alimentando su envidia, irrumpieron en el palacio a la hora de la siesta cuando se disolvió el consejo, mataron al sultán con sus espadas, asesinaron a Mas'ud y a Abu Sarhan, y masacraron a los visires Banu al-Mallah, la casa cordobesa del hiyab; el pregonero recorrió las calles de Tlemcen diciendo que Abu Sarhan había traicionado al sultán y que su hijo Abu Tashfin se había alzado en su defensa."
  ur: "ابو حمو موسیٰ بن عثمان بن یغموراسن، تلمسن کے سلطان؛ اس نے اپنے چچا زاد بھائی مسعود بن ابی عامر کو اپنی پرائیو کونسلوں کے لیے منتخب کیا اور اپنے بیٹے عبدالرحمٰن ابو تاشفین پر طعن و تشنیع کرتے ہوئے اس کا اس کزن سے نامناسب موازنہ کیا - یہاں تک کہ بیٹے کے ملوجی کے ساتھیوں نے اس کے حسد کو بھڑکاتے ہوئے، کونسل کے منہ سے محل کو توڑ ڈالا۔ مسعود اور ابو سرحان کو قتل کیا، اور بنو الملّہ کے وزیروں کا قتل عام کیا، حجاب کے قرطبہ گھر - ٹالمسن کی گلیوں سے گزرنے والا شہر کہ ابو سرحان نے سلطان کو دھوکہ دیا تھا اور اس کا بیٹا ابو تاشفین اس کے لیے اٹھ کھڑا ہوا تھا۔"
  tr: "Tlemcen Sultanı Ebu Hammu Musa ibn Osman ibn Yaghmurasen, kuzeni Mesud ibn Abi Amer'i seçti ve onu özel odasına yakın bir yere getirdi. Oğlu Abdülrahman Ebu Taşfin'i de, yetiştirilmesinde ona hizmet etmeleri için Mevlevilerden akranlarını görevlendirdi. Oğlunu sık sık azarladı ve erdem edinmedeki hevesi nedeniyle onu eleştirdi, kuzeninin soylu konumuyla alay etti. Mevleviler onun kıskançlığını sezdiler ve onu iktidarı ele geçirmeye kışkırttılar. Sultan meclisinden ayrılırken öğle sıcağını beklediler, ardından sarayın elitlerine ve maiyetine saldırdılar ve kılıçlarıyla ona saldırarak öldürdüler. Ayrıca Mesud ibn Abi Amer ve Ebu Sarhan'ı da öldürdüler ve Kurtuba halkından olan saray nazırları, Banu el-Mallah da yok oldu. Tlemcen sokaklarında, Ebu Sarhan'ın Sultan'a ihanet ettiği ve oğlu Ebu Taşfin'in babasının yanında yer aldığı haberi yayıldı."
  id: "Abu Hammu Musa ibn Uthman ibn Yaghmurasen, Sultan Tlemcen, memilih sepupunya Masoud ibn Abi Amer dan membawanya dekat dengan tempat tinggal pribadinya. Ia memberikan putranya, Abd al-Rahman Abu Tashfin, teman-teman dari Maalouj untuk membantunya dalam pendidikannya. Ia sering menegur putranya dan memarahinya karena terlalu bersemangat dalam memperoleh kebajikan dan mengejeknya tentang kedudukan bangsawan sepupunya. Maalouj merasakan kecemburuannya dan menghasutnya untuk merebut kekuasaan. Mereka menunggu tengah hari ketika Sultan meninggalkan dewan, kemudian mereka menyerang elit istana dengan rombongan mereka dan menyerang Sultan dengan pedang mereka, membunuhnya. Mereka juga membunuh Masoud ibn Abi Amer dan Abu Sarhan, dan para menteri, Banu al-Mallah, para pengawal istana dari orang-orang Cordoba, tewas. Utusan itu berkeliling di jalan-jalan Tlemcen dan mengumumkan bahwa Abu Sarhan telah mengkhianati Sultan dan bahwa putranya, Abu Tashfin, telah bangkit untuk membelanya."
