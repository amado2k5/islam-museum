  did_you_know:
    ar: "علي بن عيسى وزير عباسي اشتهر بحسن تدبيره المالي، ولّي الوزارة مرتين وأصلح خراج الدولة في زمن المقتدر كما يروي ابن الأثير."
    en: "Ali ibn Isa, the Abbasid vizier famed for fiscal management, held the vizierate twice and reformed the state's land tax under al-Muqtadir, as Ibn al-Athir records."
    ur: "علی بن عیسیٰ، مالی انتظام کے لیے مشہور عباسی وزیر، دو بار وزیر بنا اور مقتدر کے عہد میں خراج کی اصلاح کی، جیسا کہ ابن الاثیر لکھتا ہے۔"
    sources: [source/kamil-ibn-al-athir, source/tabari-tarikh-abu-al-fadl]
