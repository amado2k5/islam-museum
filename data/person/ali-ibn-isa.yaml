label: { ar: "علي بن عيسى الوزير" }
summary:
  ar: "وزير عباسي قُبض عليه في سنة أربع وثلاثمائة، وفي سنة أربع عشرة وثلاثمائة استُدعي من المغرب ليلي الوزارة، ثم قُبض عليه ثانية في سنة ست عشرة وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.112} {cite:tabari-tarikh-abu-al-fadl j.11 p.117}، وعند السيوطي ولي الوزارة للمقتدر سنة إحدى وثلاث مئة فسار بعفة وعدل وتقوى وأبطل الخمور وأبطل من المكوس ما ارتفاعه في العام خمس مئة ألف دينار، وأراد أن يصلح بين ابن صاعد وأبي بكر بن أبي داود فقال لابن أبي داود أنت شيخ زيف فقال الشيخ الزيف الكذاب على رسول الله {cite:tarikh-khulafa-minhaj-1434 p. 587,595}. وعند المسعودي استوزره المقتدر مرتين وخلع عليه أولاً يوم الثلاثاء لإحدى عشرة ليلة خلت من المحرم سنة إحدى وثلثمائة وقبض عليه يوم الاثنين لثمان خلون من ذي الحجة سنة أربع وثلثمائة {cite:muruj-al-dhahab p. 660-661}، وفي حكاية الفهرست عن الحلاج أنه قال له تعلمك لطهورك وفروضك أجدى عليك من رسائل لا تدري أنت ما تقول فيها، وأمر بصلبه في الجانب الشرقي بحضرة مجلس الشرطة وفي الجانب الغربي ثم حمل إلى دار السلطان فحبس {cite:fihrist-ibn-al-nadim p. 270}، وعند ابن الأثير قال لما ألصقت العامة بالطبرى الرفض ثم الإلحاد ومنعوا دفنه نهاراً والله لو سُئل هؤلاء عن معنى الرفض والإلحاد ما عرفوه ولا فهموه {cite:kamil-ibn-al-athir p. 99}"
gender: male
