education:
  did_you_know:
    ar: "علي بن عيسى وزير عباسي اشتهر بحسن تدبيره المالي، ولّي الوزارة مرتين وأصلح خراج الدولة في زمن المقتدر كما يروي ابن الأثير."
    en: "Ali ibn Isa, the Abbasid vizier famed for fiscal management, held the vizierate twice and reformed the state's land tax under al-Muqtadir, as Ibn al-Athir records."
    ur: "علی بن عیسیٰ، مالی انتظام کے لیے مشہور عباسی وزیر، دو بار وزیر بنا اور مقتدر کے عہد میں خراج کی اصلاح کی، جیسا کہ ابن الاثیر لکھتا ہے۔"
    sources: [source/kamil-ibn-al-athir, source/tabari-tarikh-abu-al-fadl]
class: person
label: { ar: "علي بن عيسى الوزير", fr: "Ali ibn Isa, vizir" }
summary:
  ar: "وزير عباسي قُبض عليه في سنة أربع وثلاثمائة، وفي سنة أربع عشرة وثلاثمائة استُدعي من المغرب ليلي الوزارة، ثم قُبض عليه ثانية في سنة ست عشرة وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.112} {cite:tabari-tarikh-abu-al-fadl j.11 p.117}، وعند السيوطي ولي الوزارة للمقتدر سنة إحدى وثلاث مئة فسار بعفة وعدل وتقوى وأبطل الخمور وأبطل من المكوس ما ارتفاعه في العام خمس مئة ألف دينار، وأراد أن يصلح بين ابن صاعد وأبي بكر بن أبي داود فقال لابن أبي داود أنت شيخ زيف فقال الشيخ الزيف الكذاب على رسول الله {cite:tarikh-khulafa-minhaj-1434 p. 587,595}. وعند المسعودي استوزره المقتدر مرتين وخلع عليه أولاً يوم الثلاثاء لإحدى عشرة ليلة خلت من المحرم سنة إحدى وثلثمائة وقبض عليه يوم الاثنين لثمان خلون من ذي الحجة سنة أربع وثلثمائة {cite:muruj-al-dhahab p. 660-661}، وفي حكاية الفهرست عن الحلاج أنه قال له تعلمك لطهورك وفروضك أجدى عليك من رسائل لا تدري أنت ما تقول فيها، وأمر بصلبه في الجانب الشرقي بحضرة مجلس الشرطة وفي الجانب الغربي ثم حمل إلى دار السلطان فحبس {cite:fihrist-ibn-al-nadim p. 270}، وعند ابن الأثير قال لما ألصقت العامة بالطبرى الرفض ثم الإلحاد ومنعوا دفنه نهاراً والله لو سُئل هؤلاء عن معنى الرفض والإلحاد ما عرفوه ولا فهموه {cite:kamil-ibn-al-athir p. 99} وعند ابن الجوزي ولي الوزارة سنة إحدى وثلاثمائة وكان من أفضل الوزراء وأيامه أبهى من غيرها وكان يجتهد في العدل والإحسان، وشاوره المقتدر في أمر القرامطة فأشار بمكاتبة أبي سعيد الجنابي فكتب إليه كتابًا طويلًا يتضمن الحث على طاعة الخلفاء وعتابه على ترك الطاعة {cite:muntazam-ibn-al-jawzi p. 410-411}."
  fr: "Vizir abbasside arrêté en 304 de l’hégire, rappelé du Maghreb pour exercer le vizirat en 314, puis arrêté de nouveau en 316 {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.112} {cite:tabari-tarikh-abu-al-fadl j.11 p.117}. Selon al-Suyuti, il devint vizir d’al-Muqtadir en 301, gouverna avec probité, justice et piété, interdit le vin et supprima des taxes rapportant cinq cent mille dinars par an ; voulant réconcilier Ibn Sa'id et Abu Bakr ibn Abi Dawud, il traita ce dernier de faux cheikh, qui répondit que le faux cheikh était celui qui mentait sur le Messager de Dieu {cite:tarikh-khulafa-minhaj-1434 p. 587,595}. Selon al-Mas'udi, al-Muqtadir le nomma deux fois vizir ; il reçut d’abord la robe d’honneur le mardi 11 muharram 301 et fut arrêté le lundi 8 dhu al-hijja 304 {cite:muruj-al-dhahab p. 660-661}. Dans le récit du Fihrist sur al-Hallaj, il lui dit qu’apprendre ses ablutions et ses obligations lui serait plus utile que des épîtres dont il ne comprenait pas lui-même le sens ; il ordonna de l’exposer sur une croix sur la rive orientale devant le siège de la police, puis sur la rive occidentale, avant son transfert et son emprisonnement au palais du souverain {cite:fihrist-ibn-al-nadim p. 270}. Selon Ibn al-Athir, lorsque la foule accusa al-Tabari de rafd, puis d’hérésie, et empêcha ses funérailles de jour, il dit que ces gens ne sauraient définir ni comprendre ces termes {cite:kamil-ibn-al-athir p. 99}. Selon Ibn al-Jawzi, il devint vizir en 301, fut parmi les meilleurs vizirs, son époque fut particulièrement brillante et il s’efforçait d’agir avec justice et bienfaisance ; consulté par al-Muqtadir sur les Qarmates, il conseilla d’écrire à Abu Sa'id al-Jannabi, qui reçut une longue lettre l’exhortant à obéir aux califes et lui reprochant sa désobéissance {cite:muntazam-ibn-al-jawzi p. 410-411}."
