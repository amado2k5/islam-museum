id: person/ali-ibn-isa
education:
  did_you_know:
    ar: "علي بن عيسى وزير عباسي اشتهر بحسن تدبيره المالي، ولّي الوزارة مرتين وأصلح خراج الدولة في زمن المقتدر كما يروي ابن الأثير."
    en: "Ali ibn Isa, the Abbasid vizier famed for fiscal management, held the vizierate twice and reformed the state's land tax under al-Muqtadir, as Ibn al-Athir records."
    ur: "علی بن عیسیٰ، مالی انتظام کے لیے مشہور عباسی وزیر، دو بار وزیر بنا اور مقتدر کے عہد میں خراج کی اصلاح کی، جیسا کہ ابن الاثیر لکھتا ہے۔"
    sources: [source/kamil-ibn-al-athir, source/tabari-tarikh-abu-al-fadl]
class: person
label: { ar: "علي بن عيسى الوزير" }
summary:
  ar: "وزير عباسي قُبض عليه في سنة أربع وثلاثمائة، وفي سنة أربع عشرة وثلاثمائة استُدعي من المغرب ليلي الوزارة، ثم قُبض عليه ثانية في سنة ست عشرة وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.112} {cite:tabari-tarikh-abu-al-fadl j.11 p.117}، وعند السيوطي ولي الوزارة للمقتدر سنة إحدى وثلاث مئة فسار بعفة وعدل وتقوى وأبطل الخمور وأبطل من المكوس ما ارتفاعه في العام خمس مئة ألف دينار، وأراد أن يصلح بين ابن صاعد وأبي بكر بن أبي داود فقال لابن أبي داود أنت شيخ زيف فقال الشيخ الزيف الكذاب على رسول الله {cite:tarikh-khulafa-minhaj-1434 p. 587,595}. وعند المسعودي استوزره المقتدر مرتين وخلع عليه أولاً يوم الثلاثاء لإحدى عشرة ليلة خلت من المحرم سنة إحدى وثلثمائة وقبض عليه يوم الاثنين لثمان خلون من ذي الحجة سنة أربع وثلثمائة {cite:muruj-al-dhahab p. 660-661}، وفي حكاية الفهرست عن الحلاج أنه قال له تعلمك لطهورك وفروضك أجدى عليك من رسائل لا تدري أنت ما تقول فيها، وأمر بصلبه في الجانب الشرقي بحضرة مجلس الشرطة وفي الجانب الغربي ثم حمل إلى دار السلطان فحبس {cite:fihrist-ibn-al-nadim p. 270}، وعند ابن الأثير قال لما ألصقت العامة بالطبرى الرفض ثم الإلحاد ومنعوا دفنه نهاراً والله لو سُئل هؤلاء عن معنى الرفض والإلحاد ما عرفوه ولا فهموه {cite:kamil-ibn-al-athir p. 99} وعند ابن الجوزي ولي الوزارة سنة إحدى وثلاثمائة وكان من أفضل الوزراء وأيامه أبهى من غيرها وكان يجتهد في العدل والإحسان، وشاوره المقتدر في أمر القرامطة فأشار بمكاتبة أبي سعيد الجنابي فكتب إليه كتابًا طويلًا يتضمن الحث على طاعة الخلفاء وعتابه على ترك الطاعة {cite:muntazam-ibn-al-jawzi p. 410-411}."
  tr: "304 yılında bir Abbasi veziri tutuklandı ve 340 Hicri'de Fas'tan vezirlik gecesine çağrıldı, ardından 316 Hicri yılında tekrar tutuklandı {cite:tabari-tarikh-abu-al-fadl j.11 s.117} {cite:tabari-tarikh-abu-al-fadl j.11 s.117}. al-Suyuti'ye göre, al-Muqtadir 301 Hicri yılında bakan olarak atandı, bu yüzden iffet, adalet ve dindarlıkla hareket etti, alkolü kaldırdı ve yıl içinde beş yüz bin dinar tutarında vergileri kaldırdı. İbn Sa'id ile Ebu Bekir ibn arasında uzlaşma sağlamak istedi Ebu Davud, İbn Ebi Davud'a şöyle dedi: 'Sen sahte bir şeyhsin.' Şeyh, Allah'ın Elçisi aleyhine 'Sahte yalancı' diye yanıt verdi {atıf:Tarih-Khulafa-minhaj-1434, s. 587,595}. El-Mes'udi, Al-Muqtadir'den iki kez ruhsatını almasını istedi ve ilk olarak 301 Hicri yılında, Muharrem'den on bir gece önce, Salı günü tahttan indirildi ve 304 Hicri'nin 8 Hicce'si Pazartesi günü tutuklandı. El-Hallajlı El-Fihrist'in hikayesinde, ona arınma ve sorumluluklarını öğrenmenin, ne dediğini bilmediğin mektuplardan daha faydalı olduğunu söyler. Doğu tarafında, polis konseyi huzurunda ve batı tarafında çarmıha gerilmesini emretti, ardından sultanın evine götürülüp hapsedildi. {alıntı: Fihrist-ibn-al-Nadim s. 270} ve İbn al-Athir'e göre, halk el-Taberi'ye reddetme ve ardından ateizm yüklediğinde ve gündüz defnedilmesini engellediğinde, Allah tarafından reddedilme ve ateizmin anlamı sorulduğunda ne bileceklerini ne de anlayacaklarını {atı:kamil-ibn-al-athir s. 99} Ve İbn al-Jawzi ile birlikte, 301 Hicri yılında vezirlik yaptı. En iyi hizmetkarlardan biriydi ve günleri diğerlerinden daha parlaktı. Adalet ve iyilikte titizdi. El-Muqtadir Karmatlıların işleri hakkında ona danıştı ve halifelere itaat ettiği için uzun bir teşvik ve azar yazan Ebu Sa'id el-Canabi ile yazışmasını tavsiye etti İtaatten vazgeçmek üzerine {atıf:muntazam-ibn-al-jawzi s. 410-411}."
  id: "Seorang wazir Abbasiyah ditangkap pada tahun 304, dan pada tahun 340 H ia dipanggil dari Maroko ke malam kepemimpinan wazir, lalu ditangkap lagi pada tahun 316 H {cite:tabari-tarikh-abu-al-fadl j.11 hlm.117} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.117}. Menurut al-Suyuti, al-Muqtadir diangkat menjadi menteri pada tahun 301 H, sehingga ia bertindak dengan kesucian, keadilan, dan kesalehan, menghapus alkohol dan menghapus pajak yang mencapai lima ratus ribu dinar dalam setahun. Ia ingin berdamai antara Ibn Sa'id dan Abu Bakr ibn Abu Dawood berkata kepada Ibn Abi Dawood, 'Kamu adalah sheikh palsu.' Sheikh menjawab, 'Pembohong palsu' terhadap Rasulullah {cite:History-Khulafa-minhaj-1434, hlm. 587,595}. Al-Mas'udi meminta Al-Muqtadir untuk mengambil lisensinya dua kali, dan ia pertama kali dicopot pada hari Selasa, sebelas malam sebelum Muharram tahun 301 H, dan ditangkap pada Senin, 8 H dari Dhu al-Hijjah tahun 304 H. Dalam kisah Al-Fihrist dari Al-Hallaj, ia mengatakan bahwa mempelajari penyucian dan kewajiban lebih bermanfaat bagimu daripada surat yang tidak kau tahu apa yang kau katakan. Ia memerintahkan penyalibannya di sisi timur di hadapan dewan polisi dan di sisi barat, lalu ia dibawa ke rumah sultan dan dipenjara. {kutip: fihrist-ibn-al-nadim hlm. 270} dan menurut Ibn al-Athir, ia mengatakan bahwa ketika rakyat biasa menempelkan penolakan dan ateisme kepada al-Tabari dan mencegah pemakamannya di siang hari, demi Tuhan, jika mereka ditanya tentang arti penolakan dan ateisme, mereka tidak akan tahu atau memahaminya {cite:kamil-ibn-al-athir hlm. 99} Dan bersama Ibn al-Jawzi, ia memegang jabatan wazir pada tahun 301 H. Ia adalah salah satu menteri terbaik dan hari-harinya lebih gemilang daripada yang lain. Ia rajin dalam keadilan dan kebaikan. Al-Muqtadir berkonsultasi dengannya mengenai urusan Qarmatian dan menyarankan agar ia berkorespondensi dengan Abu Sa'id al-Janabi, yang menulis surat panjang semangat dan teguran karena ketaatan kepada khalifah Tentang meninggalkan ketaatan {cite:muntazam-ibn-al-jawzi hlm. 410-411}."
