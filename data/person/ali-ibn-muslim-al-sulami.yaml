summary:
  ar: "جمال الإسلام علي بن مسلم السلمي مفتي الشام؛ صاحب مذهب الإمام الأوحد الشيخ أبي القاسم بن السميط، ولما كسده التدريس بالأمينية وكان أول مدرس بها تولاه الشيخ أبو حامد الغزالي حتى أدخله جامع دمشق مقرئاً للقرآن وكان الغزالي يثني عليه ويرغب فيه ويحث الناس على حفظ علومه؛ وأولى باب منظور إلى مدينة جنين قرب نابلس قرية يقال لها بسرجة وسكنها؛ قال ابن الجوزي توفي سنة ثلاث وثلاثين وخمسمائة {cite:shadharat-dhahab p. 584}."
  en: "Jamal al-Islam Ali ibn Muslim al-Sulami, mufti of Syria; pupil and standard-bearer of the shaykh Abu al-Qasim ibn al-Summayt, and first lecturer of the Aminiyya — when its teaching waned, al-Ghazali himself installed him as Qur'an-reader at Damascus's mosque, praising him and urging folk to keep his learning; he held sway over the Bab Manzur quarter of Janin near Nablus, a village called Busraja, where he dwelt; Ibn al-Jawzi gives his death as 533 {cite:shadharat-dhahab p. 584}."
  es: "Jamal al-Islam Ali ibn Muslim al-Sulami, muftí de Siria; discípulo y portaestandarte del shaykh Abu al-Qasim ibn al-Summayt, y primer maestro de la Aminiyya; cuando su enseñanza decayó, el propio al-Ghazali lo instaló como lector del Corán en la mezquita de Damasco, elogiándolo e instando a la gente a mantener su aprendizaje; ejerció influencia sobre el barrio de Bab Manzur de Janin, cerca de Nablus, un pueblo llamado Busraja, donde residía; Ibn al-Jawzi sitúa su muerte en el año 533 {cite:shadharat-dhahab p. 584}."
  fr: "Jamal al-Islam Ali ibn Muslim al-Sulami, mufti de Syrie; élève et porte-étendard du cheikh Abu al-Qasim ibn al-Summayt, et premier conférencier de l'Aminiyya — lorsque son enseignement déclina, al-Ghazali lui-même l'installa comme lecteur du Coran à la mosquée de Damas, le louant et exhortant les gens à maintenir son savoir; il exerçait son influence sur le quartier Bab Manzur de Janin près de Naplouse, un village appelé Busraja, où il résidait; Ibn al-Jawzi indique sa mort en 533 {cite:shadharat-dhahab p. 584}."
