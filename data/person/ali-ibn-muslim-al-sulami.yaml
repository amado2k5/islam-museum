summary:
  ar: "جمال الإسلام علي بن مسلم السلمي مفتي الشام؛ صاحب مذهب الإمام الأوحد الشيخ أبي القاسم بن السميط، ولما كسده التدريس بالأمينية وكان أول مدرس بها تولاه الشيخ أبو حامد الغزالي حتى أدخله جامع دمشق مقرئاً للقرآن وكان الغزالي يثني عليه ويرغب فيه ويحث الناس على حفظ علومه؛ وأولى باب منظور إلى مدينة جنين قرب نابلس قرية يقال لها بسرجة وسكنها؛ قال ابن الجوزي توفي سنة ثلاث وثلاثين وخمسمائة {cite:shadharat-dhahab p. 584}."
  en: "Jamal al-Islam Ali ibn Muslim al-Sulami, mufti of Syria; pupil and standard-bearer of the shaykh Abu al-Qasim ibn al-Summayt, and first lecturer of the Aminiyya — when its teaching waned, al-Ghazali himself installed him as Qur'an-reader at Damascus's mosque, praising him and urging folk to keep his learning; he held sway over the Bab Manzur quarter of Janin near Nablus, a village called Busraja, where he dwelt; Ibn al-Jawzi gives his death as 533 {cite:shadharat-dhahab p. 584}."
