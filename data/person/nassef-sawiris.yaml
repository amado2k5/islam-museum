summary:
  ar: "ناصف ساويرس (وُلد في 19 كانون الثاني 1961 في أسوان)، رجل أعمال مصري، أصغر أبناء أنسي ساويرس الثلاثة. درس الاقتصاد في جامعة شيكاغو، وقاد أوراسكوم للإنشاء ثم مجموعة أو سي آي للأسمدة والكيماويات، وهو شريك مالك ورئيس نادي أستون فيلا الإنكليزي، ويُعد أغنى شخص في مصر."
  en: "Nassef Sawiris (born 19 January 1961 in Aswan) is an Egyptian businessman, the youngest of Onsi Sawiris's three sons. He studied economics at the University of Chicago, led Orascom Construction and then the OCI fertilisers and chemicals group, co-owns and chairs Aston Villa Football Club, and is Egypt's richest person."
  ur: "ناصف ساویرس (پیدائش 19 جنوری 1961، اسوان) مصری تاجر اور انسی ساویرس کے تین بیٹوں میں سب سے چھوٹے ہیں۔ انہوں نے یونیورسٹی آف شکاگو سے معاشیات پڑھی، اوراسکوم کنسٹرکشن اور پھر او سی آئی کھاد و کیمیکل گروپ کی قیادت کی، ایسٹن ولا فٹ بال کلب کے شریک مالک و چیئرمین ہیں اور مصر کے امیر ترین شخص شمار ہوتے ہیں۔"

