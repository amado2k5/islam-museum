summary:
  ar: "مراد بيك، أحد أميرين مملوكيين كبيرين، هو وإبراهيم بيك، من مماليك محمد بك أبي الذهب، اقتسما السلطة في مصر بعد وفاة إسماعيل بك سنة 1791 في ثنائية قلقة. قاد البر الغربي في وقعة إمبابة سنة 1798 فانكسر أمام الفرنسيين، وتوفي في 4 ذي الحجة 1215هـ/1801م أثناء الاحتلال الفرنسي {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  en: "Murad Bey, with Ibrahim Bey one of two leading Mamluk amirs, both mamluks of Muhammad Bey Abu'l-Dhahab, shared power in Egypt in an uneasy duumvirate after Ismail Bey's death in 1791. He commanded the western bank at the battle of Imbaba in 1798, where he was broken by the French, and died on 4 Dhu'l-Hijja 1215/1801 during the French occupation {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  ur: "مراد بیگ، ابراہیم بیگ کے ساتھ دو بڑے مملوک امیروں میں سے ایک، دونوں محمد بیگ ابوالذہب کے مملوک، 1791ء میں اسماعیل بیگ کی وفات کے بعد مصر میں بے چین دو رکنی حکومت میں شریک اقتدار رہے۔ 1798ء میں امبابہ کی لڑائی میں مغربی کنارے کی کمان کی اور فرانسیسیوں کے سامنے ٹوٹ گئے، اور فرانسیسی قبضے کے دوران 4 ذوالحجہ 1215ھ/1801ء کو فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
