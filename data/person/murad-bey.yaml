summary:
  ar: "مراد بيك، أحد أميرين مملوكيين كبيرين، هو وإبراهيم بيك، من مماليك محمد بك أبي الذهب، اقتسما السلطة في مصر بعد وفاة إسماعيل بك سنة 1791 في ثنائية قلقة. قاد البر الغربي في وقعة إمبابة سنة 1798 فانكسر أمام الفرنسيين، وتوفي في 4 ذي الحجة 1215هـ/1801م أثناء الاحتلال الفرنسي {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  en: "Murad Bey, with Ibrahim Bey one of two leading Mamluk amirs, both mamluks of Muhammad Bey Abu'l-Dhahab, shared power in Egypt in an uneasy duumvirate after Ismail Bey's death in 1791. He commanded the western bank at the battle of Imbaba in 1798, where he was broken by the French, and died on 4 Dhu'l-Hijja 1215/1801 during the French occupation {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  ur: "مراد بیگ، ابراہیم بیگ کے ساتھ دو بڑے مملوک امیروں میں سے ایک، دونوں محمد بیگ ابوالذہب کے مملوک، 1791ء میں اسماعیل بیگ کی وفات کے بعد مصر میں بے چین دو رکنی حکومت میں شریک اقتدار رہے۔ 1798ء میں امبابہ کی لڑائی میں مغربی کنارے کی کمان کی اور فرانسیسیوں کے سامنے ٹوٹ گئے، اور فرانسیسی قبضے کے دوران 4 ذوالحجہ 1215ھ/1801ء کو فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  es: "Murad Bey, junto con Ibrahim Bey, uno de los dos principales emires mamelucos, ambos descendientes de Muhammad Bey Abu'l-Dhahab, compartieron el poder en Egipto en un inestable duunvirato tras la muerte de Ismail Bey en 1791. Comandó la orilla occidental en la batalla de Imbaba en 1798, donde fue derrotado por los franceses, y murió el 4 de Dhu'l-Hijja de 1215/1801 durante la ocupación francesa {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  fr: "Murad Bey, avec Ibrahim Bey, l'un des deux principaux émirs mamelouks, tous deux mamelouks de Muhammad Bey Abu'l-Dhahab, partagea le pouvoir en Égypte dans un duumvirat instable après la mort d'Ismail Bey en 1791. Il commandait la rive ouest lors de la bataille d'Imbaba en 1798, où il fut vaincu par les Français, et mourut le 4 Dhu'l-Hijja 1215/1801 pendant l'occupation française {cite:encyclopaedia-of-islam-2 vol. 4 p. 891}."
  tr: "İki büyük Memlük prensinden biri olan Murad Bey, Muhammed Bey Abi el-Dhahab'ın Memlüklerinden İbrahim Bey ile birlikte, İsmail Bey'in 1791'deki ölümünden sonra Mısır'da gergin bir ortaklıkla iktidarı paylaştılar. 1798'de İmbaba Muharebesi'nde batı kıyısını yönetti, Fransızlar tarafından yenildi ve 4 Dhu al-Hijjah 1215 Hicce / 1801 yılında Fransız işgali sırasında öldü {cite:Encyclopaedia-of-Islam-2 cilt 4 s. 891}."
  id: "Murad Bey, salah satu dari dua pangeran besar Mamluk, bersama Ibrahim Bey, salah satu Mamluk Muhammad Bey Abi al-Dhahab, berbagi kekuasaan di Mesir setelah kematian Ismail Bey pada tahun 1791 dalam kemitraan yang tegang. Ia memimpin tepi barat dalam Pertempuran Imbaba tahun 1798, dikalahkan oleh Prancis, dan meninggal pada 4 Dhu al-Hijjah 1215 AH / 1801 M selama pendudukan Prancis {cite:Encyclopaedia-of-Islam-2 vol. 4 hlm. 891}."
