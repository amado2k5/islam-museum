    note: >-
      Settled as a Sufi on two independent attestations of personal
      discipleship. The Arabic article, in the al-Zirikli tradition, states
      that he took the Sufi path from Shaykh Muhammad Ashiq ibn Ubayd Allah
      al-Bahattli — an initiation received by the man himself, not an
      office or a descent. The Urdu article independently presents a scholar
      of dervish character whose works include Asrar al-Mahabba, a Sufi
      treatise, and quotes the biographical tradition on his succession to
      the teaching seat. Neither source names the order he was initiated
      into, and the record names none. His legal school is NOT settled: no
      consulted source names a madhhab for Rafiuddin himself — the Dehlawi
      family's Hanafi tradition is the context he taught in, and family
      tradition never counts — so no school segment is recorded.
