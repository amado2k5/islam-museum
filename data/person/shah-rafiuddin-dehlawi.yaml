summary:
  ar: "شاه رفيع الدين الدهلوي (1163هـ/1750م – 1233هـ/1818م)، محدّث ومفسّر من دلهي، ابن شاه ولي الله الدهلوي وأخوه الأصغر لشاه عبد العزيز. أتمّ سنة 1200هـ أول ترجمة أردية حرفية (تحت اللفظ) للقرآن، وله تفسير رفيع وكتب «دفع الباطل» و«أسرار المحبة»، وخلَف أخاه على مسند التدريس بالمدرسة الرحيمية في كبر سنّه."
  en: "Shah Rafiuddin Dehlawi (1163/1750 – 1233/1818) was a Delhi hadith scholar and Qur'an commentator, a son of Shah Waliullah al-Dihlawi and younger brother of Shah Abdul Aziz. In 1200 AH he completed the first literal, word-for-word Urdu translation of the Qur'an; his works include the Tafsir Rafi'i, Daf' al-Batil and Asrar al-Mahabba, and in his brother's old age he succeeded to the teaching seat of the Madrasa Rahimia."
  ur: "شاہ رفیع الدین دہلوی (1163ھ/1750ء – 1233ھ/1818ء) دہلی کے محدث و مفسر، شاہ ولی اللہ دہلوی کے صاحبزادے اور شاہ عبدالعزیز کے چھوٹے بھائی تھے۔ آپ نے 1200ھ میں قرآن کا پہلا تحت اللفظ اردو ترجمہ مکمل کیا؛ آپ کی تصانیف میں تفسیر رفیع، «دفع الباطل» اور «اسرار المحبہ» شامل ہیں، اور آپ اپنے بھائی کی کبرسنی میں مدرسہ رحیمیہ کی مسندِ تدریس پر بیٹھے۔"

