summary:
  ar: "ملك بابل الذي غزا العرب في ذات عرق فكان قائد العرب في الموقعة غير جرهمي، وتفرقت بنو عدنان إلى اليمن عند غزوته الثانية سنة 587 ق.م، وذهب برميا النبي بمعد إلى الشام؛ وهو الذي خرّب فلسطين ودمر الهيكل سنة 587 ق.م وسبى اليهود إلى بابل فهاجر قسم منهم إلى شمالي الحجاز، في رواية الرحيق المختوم."
  en: "The king of Babylon who attacked the Arabs at Dhat Irq, where the Arabs' commander was no Jurhumite; the Adnanis scattered to Yemen at his second campaign in 587 BCE and the prophet Jeremiah took Ma'add to al-Sham; he also laid waste Palestine, destroyed the Temple in 587 BCE and carried the Jews to Babylon, after which some migrated to northern Hijaz, in al-Raheeq al-Makhtum's account."
  es: "El rey de Babilonia que atacó a los árabes en Dhat Irq, donde el comandante árabe no era jurhumita; los adnaníes se dispersaron por Yemen en su segunda campaña en el 587 a. C. y el profeta Jeremías llevó a Ma'add a al-Sham; también devastó Palestina, destruyó el Templo en el 587 a. C. y llevó a los judíos a Babilonia, después de lo cual algunos emigraron al norte de Hiyaz, según el relato de al-Raheeq al-Makhtum."
  fr: "Le roi de Babylone qui attaqua les Arabes à Dhat Irq, où le commandant arabe n'était pas un Jurhumite; les Adnanis se dispersèrent au Yémen lors de sa seconde campagne en 587 avant notre ère et le prophète Jérémie emmena Ma'add au Levant; il ravagea également la Palestine, détruisit le Temple en 587 avant notre ère et déporta les Juifs à Babylone, après quoi certains émigrèrent vers le nord du Hedjaz, selon le récit d'al-Raheeq al-Makhtum."
  ur: "بابل کا بادشاہ جس نے دھت عرق کے مقام پر عربوں پر حملہ کیا، جہاں عربوں کا کمانڈر جورومائٹ نہیں تھا۔ عدنانی 587 قبل مسیح میں اپنی دوسری مہم میں یمن میں بکھر گئے اور یرمیاہ نبی معد کو الشام لے گئے۔ اس نے فلسطین کو بھی برباد کر دیا، 587 قبل مسیح میں ہیکل کو تباہ کر دیا اور یہودیوں کو بابل لے گئے، جس کے بعد کچھ لوگ شمالی حجاز کی طرف ہجرت کر گئے، الرحیق المختم کے بیان میں۔"
  tr: "Hath Arq'da Araplara saldıran ve savaşta Arap lideri olan Babil kralı Jurhami değildi. Adnanlar, MÖ 587'deki ikinci seferinde Yemen'e dağıldı. Peygamber Bermiah Ma'ad'a, Şam'a gitti; Filistin'i yok eden, MÖ 587'de Tapınağı yıkan ve Yahudileri Babil'e sürgün eden oydu, bu yüzden bazıları kuzey Hicaz'a göç etti, \"Mühürlü Nektar\" romanına göre."
  id: "Raja Babilonia, yang menyerang orang Arab di Hath Arq dan menjadi pemimpin Arab dalam pertempuran itu, bukanlah Jurhami. Keluarga Adnan tercerai-berai ke Yaman selama kampanye keduanya pada tahun 587 SM. Nabi Bermiah pergi ke Ma'ad ke Levant; dialah yang menghancurkan Palestina, menghancurkan Bait Suci pada tahun 587 SM, dan mengasingkan orang Yahudi ke Babilonia, sehingga beberapa dari mereka bermigrasi ke Hejaz utara, menurut novel \"The Sealed Nectar.\""
