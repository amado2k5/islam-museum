summary:
  ar: "ملك بابل الذي غزا العرب في ذات عرق فكان قائد العرب في الموقعة غير جرهمي، وتفرقت بنو عدنان إلى اليمن عند غزوته الثانية سنة 587 ق.م، وذهب برميا النبي بمعد إلى الشام؛ وهو الذي خرّب فلسطين ودمر الهيكل سنة 587 ق.م وسبى اليهود إلى بابل فهاجر قسم منهم إلى شمالي الحجاز، في رواية الرحيق المختوم."
  en: "The king of Babylon who attacked the Arabs at Dhat Irq, where the Arabs' commander was no Jurhumite; the Adnanis scattered to Yemen at his second campaign in 587 BCE and the prophet Jeremiah took Ma'add to al-Sham; he also laid waste Palestine, destroyed the Temple in 587 BCE and carried the Jews to Babylon, after which some migrated to northern Hijaz, in al-Raheeq al-Makhtum's account."
