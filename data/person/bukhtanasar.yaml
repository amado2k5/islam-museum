    ar: "بختنصر ملك بابل غزا العرب في ذات عرق، وتفرقت بنو عدنان إلى اليمن عند غزوته الثانية نحو سنة ٥٨٧ ق.م، وذهب برميا النبي بمعد إلى الشام."
    en: "Bukhtanasar, the king of Babylon, raided the Arabs at Dhat Irq; at his second campaign around 587 BCE the sons of Adnan scattered toward Yemen, and the prophet Jeremiah led Ma'add to Syria."
