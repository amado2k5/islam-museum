roles: [mystic]
summary:
  ar: "مضاء بن عيسى الشامي، زاهد يروي عنه أحمد بن أبي الحواري أقوالًا قصيرة في الخوف والعمل والصحبة، وحدّث بالكوفة عن شعبة بحسب «حلية الأولياء»."
  en: "Mada' ibn Isa al-Shami, an ascetic whose short sayings on fear, work and companionship are related by Ahmad ibn Abi al-Hawari; he transmitted hadith in Kufa from Shu'ba according to Hilyat al-Awliya."
  ur: "مضاء بن عیسیٰ شامی ایک زاہد تھے۔ احمد بن ابی الحواری ان سے خوف، عمل اور صحبت کے بارے میں مختصر اقوال نقل کرتے ہیں۔ «حلیۃ الاولیاء» کے مطابق انہوں نے کوفہ میں شعبہ سے حدیث بیان کی۔"
  es: "Mada' ibn Isa al-Shami, un asceta cuyos breves dichos sobre el temor, el trabajo y la compañía son relatados por Ahmad ibn Abi al-Hawari; transmitió hadices en Kufa desde Shu'ba según Hilyat al-Awliya."
  fr: "Mada' ibn Isa al-Shami, un ascète dont les courts hadiths sur la peur, le travail et la compagnie sont rapportés par Ahmad ibn Abi al-Hawari; il a transmis des hadiths à Kufa depuis Shu'ba selon Hilyat al-Awliya."
  tr: "Muda ibn İsa al-Shami, bir münzevi, Ahmed ibn Ebi el-Havari tarafından korku, eylem ve arkadaşlık hakkında kısa sözler anlatmış ve 'Hilyat al-Awliya'ya göre Şube'den Kufa dilinde rivayet etmiştir."
  id: "Muda' ibn Isa al-Shami, seorang pertapa, menceritakan dari Ahmad ibn Abi al-Hawari ucapan singkat tentang ketakutan, tindakan, dan persahabatan, serta ia menceritakan dalam Kufa dari Shu'bah menurut 'Hilyat al-Awliya'."
