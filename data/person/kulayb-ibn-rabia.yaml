summary:
  ar: "كليب بن ربيعة التغلبي، اسمه وائل بن ربيعة، لُقب كليباً لأنه كان يأخذ معه جرو كلب يضربه فيلقيه في الروضة التي تعجبه فلا يقربها أحد؛ تحول إليه لواء ربيعة ولم تجتمع معد إلا على ثلاثة هو ثالثهم، وكان قائد معد يوم خزاز ففض جموع اليمن، ثم دخله زهو وبغى حتى كان يحمي مواقع السحاب، وقتله جساس بن مرة الشيباني حين رمى ضرع ناقة جاره الجرمي، فكانت حرب البسوس {cite:kamil-ibn-al-athir p. 390-392}."
  en: "Kulayb (Wa'il) ibn Rabi'a of Taghlib — 'little whelp' for the puppy he would beat and leave howling to mark his pleasure-grounds; bearer of Rabi'a's banner, leader of Ma'add at Khazzaz and one of only three men all Ma'add united behind, whose swagger grew until he fenced off the very rain-pools; Jasas ibn Murra speared him over the camel Sarab, and the Basus war began {cite:kamil-ibn-al-athir p. 390-392}."
  es: "Kulayb (Wa'il) ibn Rabi'a de Taghlib — 'pequeño cachorro' por el cachorro al que golpeaba y dejaba aullando para marcar sus terrenos de placer; portador del estandarte de Rabi'a, líder de Ma'add en Khazzaz y uno de los tres únicos hombres detrás de los cuales se unió todo Ma'add, cuya arrogancia creció hasta que cercó los mismos charcos de lluvia; Jasas ibn Murra lo lanceó sobre el camello Sarab, y comenzó la guerra de Basus {cite:kamil-ibn-al-athir p. 390-392}."
  fr: "Kulayb (Wa'il) ibn Rabi'a de Taghlib — « petit chiot » pour le chiot qu'il battait et laissait hurler pour marquer ses terrains de plaisir; porteur de la bannière de Rabi'a, chef de Ma'add à Khazzaz et l'un des trois seuls hommes derrière lesquels tout Ma'add s'est uni, dont la fanfaronnade grandit jusqu'à ce qu'il clôture les mares de pluie; Jasas ibn Murra le transperça de sa lance au-dessus du chameau Sarab, et la guerre des Basus commença {cite:kamil-ibn-al-athir p. 390-392}."
  ur: "تغلب کے کلیب ⁦(وائل)⁩ ابن ربیعہ - کتے کے بچے کے لیے 'چھوٹی سی مدد' وہ اپنی خوشیوں کے نشانات کے لیے مارتا اور چیختا چلا جاتا۔ ربیعہ کا جھنڈا اٹھانے والا، خزاز میں معد کا سردار اور صرف تین آدمیوں میں سے ایک تمام معد پیچھے اکٹھے ہو گئے، جن کی اکھاڑ پچھاڑ یہاں تک کہ اس نے بارش کے تالابوں کو بند کر دیا۔ جصاص بن مرہ نے اسے اونٹ سرب پر چڑھا دیا اور بسوس کی جنگ شروع ہو گئی۔ 390-392}۔"
  tr: "Kulayb ibn Rabi'ah al-Taghlibi, Wa'il ibn Rabi'ah olarak adlandırıldı, yanında bir yavru köpek alıp dövüp sevdiği bahçeye attığı için kimsenin yaklaşamaması için Kulayb lakabını aldı. Rabi'ah'ın bayrağı ona döndü ve Ma'ad sadece üç kişiyi topladı, üçüncüsü oradaydı. Ma'ad, Khazzaz gününde Ma'ad'ın komutanıydı, Yemenli kalabalığı dağıttı, ardından gurur ve isyanla girerek bulut mevzilerini korudu. Jassas ibn Murrah al-Shaybani, komşusu al-Jarmi'nin devesinin memesini fırlattığında onu öldürdü ve bu da Basus Savaşı'na yol açtı {cite:kamil-ibn-al-athir s. 390-392}."
  id: "Kulayb ibn Rabi'ah al-Taghlibi, bernama Wa'il ibn Rabi'ah, dijuluki Kulayb karena ia biasa membawa seekor anak anjing, memukulnya, dan melemparkannya ke taman yang ia sukai agar tidak ada yang bisa mendekatinya. Panji Rabi'ah berbalik ke arahnya, dan Ma'ad hanya mengumpulkan tiga orang, yang ketiga hadir. Ma'ad adalah komandan Ma'ad pada hari Khazzaz, membubarkan massa Yaman, lalu masuk ke sana dengan bangga dan memberontak hingga ia melindungi posisi awan. Jassas ibn Murrah al-Shaybani membunuhnya ketika ia melempar ambing unta tetangganya al-Jarmi, yang menyebabkan Perang Basus {cite:kamil-ibn-al-athir hlm. 390-392}."
