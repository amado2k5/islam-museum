summary:
  ar: "أبو علي محمد بن عبد الوهاب بن سلام بن خالد الجبائي أحد أئمة المعتزلة؛ كان إماماً في علم الكلام ورئيس المتكلمين في عصره، أخذ هذا العلم عن أبي يوسف يعقوب بن عبد الله الشحام البصري رئيس المعتزلة بالبصرة، وعنه أخذ الشيخ أبو الحسن الأشعري شيخ السنة علم الكلام {cite:wafayat-ayan}."
  en: "Abu Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Jubba'i, one of the imams of the Mu'tazila; he was an imam in kalam and the leading theologian of his age. He took this discipline from Abu Yusuf Ya'qub ibn Abd Allah al-Shahham al-Basri, head of the Mu'tazila in Basra, and from him Abu al-Hasan al-Ash'ari, shaykh of the Sunna, took the science of kalam {cite:wafayat-ayan}."
