summary:
  ar: "أبو علي محمد بن عبد الوهاب بن سلام بن خالد الجبائي أحد أئمة المعتزلة؛ كان إماماً في علم الكلام ورئيس المتكلمين في عصره، أخذ هذا العلم عن أبي يوسف يعقوب بن عبد الله الشحام البصري رئيس المعتزلة بالبصرة، وعنه أخذ الشيخ أبو الحسن الأشعري شيخ السنة علم الكلام {cite:wafayat-ayan}. وهو الذي ذلل الكلام وسهله وإليه انتهت رئاسة البصريين في زمانه عند ابن النديم، مولده سنة ٢٣٥ وتوفي سنة ٣٠٣ ودفنه ابنه أبو هاشم في جبا {cite:fihrist-ibn-al-nadim p. 530}."
  en: "Abu Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Jubba'i, one of the imams of the Mu'tazila; he was an imam in kalam and the leading theologian of his age. He took this discipline from Abu Yusuf Ya'qub ibn Abd Allah al-Shahham al-Basri, head of the Mu'tazila in Basra, and from him Abu al-Hasan al-Ash'ari, shaykh of the Sunna, took the science of kalam {cite:wafayat-ayan}. Ibn al-Nadim calls him the man who made kalam easy and to whom the leadership of the Basrans came in his time; born 235, died 303, buried by his son Abu Hashim at Jubba {cite:fihrist-ibn-al-nadim p. 530}."
  ur: "ابو علی محمد بن عبد الوہاب بن سلام بن خالد جبّائی معتزلہ کے ائمہ میں سے تھے؛ وہ علمِ کلام کے امام اور اپنے عہد کے رئیس المتکلمین تھے۔ انہوں نے یہ علم بصرہ کے معتزلی سردار ابو یوسف یعقوب بن عبد اللہ شحام بصری سے لیا، اور انھی سے ابو الحسن اشعری نے علمِ کلام پڑھا {cite:wafayat-ayan}۔ ابن الندیم کے نزدیک انہی نے کلام کو آسان کیا اور اپنے زمانے میں بصریوں کی قیادت انہی تک پہنچی؛ پیدائش 235ھ، وفات 303ھ، اور ان کے بیٹے ابو ہاشم نے انہیں جبا میں دفنایا {cite:fihrist-ibn-al-nadim p. 530}۔"
