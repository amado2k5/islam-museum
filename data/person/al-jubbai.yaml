summary:
  ar: "أبو علي محمد بن عبد الوهاب بن سلام بن خالد الجبائي أحد أئمة المعتزلة؛ كان إماماً في علم الكلام ورئيس المتكلمين في عصره، أخذ هذا العلم عن أبي يوسف يعقوب بن عبد الله الشحام البصري رئيس المعتزلة بالبصرة، وعنه أخذ الشيخ أبو الحسن الأشعري شيخ السنة علم الكلام {cite:wafayat-ayan}. وهو الذي ذلل الكلام وسهله وإليه انتهت رئاسة البصريين في زمانه عند ابن النديم، مولده سنة ٢٣٥ وتوفي سنة ٣٠٣ ودفنه ابنه أبو هاشم في جبا {cite:fihrist-ibn-al-nadim p. 530}."
  en: "Abu Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Jubba'i, one of the imams of the Mu'tazila; he was an imam in kalam and the leading theologian of his age. He took this discipline from Abu Yusuf Ya'qub ibn Abd Allah al-Shahham al-Basri, head of the Mu'tazila in Basra, and from him Abu al-Hasan al-Ash'ari, shaykh of the Sunna, took the science of kalam {cite:wafayat-ayan}. Ibn al-Nadim calls him the man who made kalam easy and to whom the leadership of the Basrans came in his time; born 235, died 303, buried by his son Abu Hashim at Jubba {cite:fihrist-ibn-al-nadim p. 530}."
  ur: "ابو علی محمد بن عبد الوہاب بن سلام بن خالد جبّائی معتزلہ کے ائمہ میں سے تھے؛ وہ علمِ کلام کے امام اور اپنے عہد کے رئیس المتکلمین تھے۔ انہوں نے یہ علم بصرہ کے معتزلی سردار ابو یوسف یعقوب بن عبد اللہ شحام بصری سے لیا، اور انھی سے ابو الحسن اشعری نے علمِ کلام پڑھا {cite:wafayat-ayan}۔ ابن الندیم کے نزدیک انہی نے کلام کو آسان کیا اور اپنے زمانے میں بصریوں کی قیادت انہی تک پہنچی؛ پیدائش 235ھ، وفات 303ھ، اور ان کے بیٹے ابو ہاشم نے انہیں جبا میں دفنایا {cite:fihrist-ibn-al-nadim p. 530}۔"
  es: "Abu Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Jubba'i, uno de los imanes de los Mu'tazila, fue un imán en kalam y el teólogo más destacado de su época. Recibió esta disciplina de Abu Yusuf Ya'qub ibn Abd Allah al-Shahham al-Basri, jefe de los Mu'tazila en Basora, y de él, Abu al-Hasan al-Ash'ari, shaykh de la Sunna, tomó la ciencia del kalam {cite:wafayat-ayan}. Ibn al-Nadim lo llama el hombre que facilitó el kalam y a quien recayó el liderazgo de los basranos en su tiempo; nació en 235, murió en 303 y fue enterrado por su hijo Abu Hashim en Jubba {cite:fihrist-ibn-al-nadim p. 530}."
  fr: "Abou Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Jubba'i, l'un des imams mu'tazilites, était un maître du kalam et le théologien le plus éminent de son époque. Il reçut cet enseignement d'Abou Yusuf Ya'qub ibn Abd Allah al-Shahham al-Basri, chef des mu'tazilites de Bassora, et c'est de lui qu'Abou al-Hasan al-Ash'ari, cheikh de la Sunna, reçut la science du kalam (voir: wafayat-ayan). Ibn al-Nadim le décrit comme celui qui a facilité l'accès au kalam et à qui revint la direction des Bassorahs de son temps; né en 235, mort en 303, il fut inhumé par son fils Abou Hashim à Jubba (voir: fihrist-ibn-al-nadim, p. 530)."
  tr: "Ebu Ali Muhammed bin Abdülvahhab bin Salam, Salam'ın ve Halid el-Cubeyi, Mu'tazillerin imamlarından biriydi; teoloji alanında bir imam ve zamanının baş teologuydu. Bu bilgiyi Basra'daki Mu'tazila başı Ebu Yusuf Ya'qub bin Abdullah al-Shaham al-Basri'den, ondan ise Sünnet'in ve kalem biliminin ustası Şeyh Ebu al-Hasan al-Ash'ari de ondan aldı. Konuşmayı alçakgönüllü ve kolay yapan oydu ve onun için Basranlıların liderliği onun zamanında İbn el-Nadim ile sona erdi. 235 Hicri yılında doğdu, 303'te öldü ve oğlu Ebu Haşim tarafından Cubba'da defnedildi {atıf:fihrist-ibn-al-nadim s. 530}."
  id: "Abu Ali Muhammad ibn Abd al-Wahhab ibn Salam ibn Khalid al-Juba'i adalah salah satu imam Mu'tazili; ia adalah imam teologi dan teolog utama pada zamannya. Pengetahuan ini diperoleh dari Abu Yusuf Ya'qub ibn Abdullah al-Shaham al-Basri, kepala Mu'tazila di Basra, dan dari sinilah Sheikh Abu al-Hasan al-Ash'ari, guru Sunnah, mempelajari ilmu kalam {cite:wafayat-ayan}. Ia adalah orang yang membuat ucapan menjadi sederhana dan mudah, dan baginya kepemimpinan Basrani pada masanya berakhir dengan Ibn al-Nadim. Ia lahir pada tahun 235 H, meninggal pada tahun 303, dan dimakamkan oleh putranya Abu Hashim di Jubba {cite:fihrist-ibn-al-nadim hlm. 530}."
