id: person/busr-ibn-said
class: person
label: { ar: "بسر بن سعيد", en: "Busr ibn Said", es: "Busr ibn Said", fr: "Busr ibn Said", ur: "بسر بن سعید" }
summary:
  ar: "بُسر بن سعيد المدني العابد، مولى ابن الحضرمي، تابعي. روى عن أبي هريرة وعثمان وأبي سعيد وسعد بن أبي وقاص وزيد بن ثابت وغيرهم، وروى عنه سالم بن أبي النضر ويعقوب بن الأشج وأبو سلمة بن عبد الرحمن وغيرهم. وصفه ابن معين والنسائي بالثقة، ويذكر الكتاب وفاته سنة مئة للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
  en: "Busr ibn Said al-Madani, a devout Successor (tabi'i) and mawla of Ibn al-Hadrami. He related from Abu Hurayra, Uthman, Abu Sa'id, Sa'd ibn Abi Waqqas and Zayd ibn Thabit, among others, and was related from by Salim ibn Abi al-Nadr and Ya'qub ibn al-Ashajj. Ibn Ma'in and al-Nasa'i called him trustworthy. The book gives his death as 100 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
  es: "Busr ibn Said al-Madani, un devoto sucesor (tabi'i) y mawla de Ibn al-Hadrami. Transmitió de Abu Hurayra, Uthman, Abu Sa'id, Sa'd ibn Abi Waqqas y Zayd ibn Thabit, entre otros, y fue transmitido por Salim ibn Abi al-Nadr y Ya'qub ibn al-Ashajj. Ibn Ma'in y al-Nasa'i lo consideraron digno de confianza. El libro indica que falleció en el año 100 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
  fr: "Busr ibn Said al-Madani, un dévot successeur (tabi'i) et mawla d'Ibn al-Hadrami, a rapporté ses enseignements d'après Abu Hurayra, Uthman, Abu Sa'id, Sa'd ibn Abi Waqqas et Zayd ibn Thabit, entre autres, et a été lui-même rapporté par Salim ibn Abi al-Nadr et Ya'qub ibn al-Ashajj. Ibn Ma'in et al-Nasa'i le considéraient comme digne de confiance. Le livre indique son décès en l'an 100 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
  ur: "بسر بن سعید المدنی، ایک متقی جانشین ⁦(تابعی)⁩ اور ابن الحدرمی کے مولا۔ انہوں نے ابوہریرہ، عثمان، ابو سعید، سعد بن ابی وقاص اور زید بن ثابت وغیرہ سے روایت کی ہے اور سلیم بن ابی النضر اور یعقوب بن الاشج سے روایت کی ہے۔ ابن معین اور نسائی نے اسے ثقہ کہا ہے۔ کتاب ان کی وفات 100ھ بتاتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6799}"
  tr: "Basr ibn Sa'id al-Madani al-Abd, bir Tabî olan İbn al-Hadrami'nin özgür adamı. Ebu Hureyre, Osman Ebu Said, Ebu Seyid, Seyd bin Ebi Vaqqas, Zayd ibn Tebit ve diğerlerinden rivayet etti. Salim ibn Ebi el-Nadr, Ya'qub ibn al-Ashaj, Ebu Salamah ibn Abd al-Rahman ve diğerleri ondan rivayet etti. İbn Ma'in ve el-Nasa'i onu güvenilir olarak tanımladı ve kitapta yüz hicri yılında öldüğünden bahsetti. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6799}"
  id: "Basr ibn Sa'id al-Madani al-'Abd, mantan Ibn al-Hadrami, seorang Tabi'i. Ia menceritakan dari Abu Huraira, Uthman, Abu Sa'id, Sa'd ibn Abi Waqqas, Zayd ibn Thabit, dan lainnya. Salim ibn Abi al-Nadr, Ya'qub ibn al-Ashaj, Abu Salamah ibn Abd al-Rahman, dan lainnya menceritakan darinya. Ibn Ma'in dan al-Nasa'i menggambarkannya sebagai dapat dipercaya, dan kitab tersebut menyebutkan kematiannya pada tahun seratus H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6799}"
