label: { ar: "بسر بن سعيد", en: "Busr ibn Said" }
summary:
  ar: "بُسر بن سعيد المدني العابد، مولى ابن الحضرمي، تابعي. روى عن أبي هريرة وعثمان وأبي سعيد وسعد بن أبي وقاص وزيد بن ثابت وغيرهم، وروى عنه سالم بن أبي النضر ويعقوب بن الأشج وأبو سلمة بن عبد الرحمن وغيرهم. وصفه ابن معين والنسائي بالثقة، ويذكر الكتاب وفاته سنة مئة للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
  en: "Busr ibn Said al-Madani, a devout Successor (tabi'i) and mawla of Ibn al-Hadrami. He related from Abu Hurayra, Uthman, Abu Sa'id, Sa'd ibn Abi Waqqas and Zayd ibn Thabit, among others, and was related from by Salim ibn Abi al-Nadr and Ya'qub ibn al-Ashajj. Ibn Ma'in and al-Nasa'i called him trustworthy. The book gives his death as 100 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6799}"
