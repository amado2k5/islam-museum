summary:
  ar: "صحابي يروي عنه حديث «لا يزال لسانك رطباً من ذكر الله عز وجل» — الحديث الخمسون وخاتمة زيادات ابن رجب على الأربعين — أخرجه أحمد والترمذي وابن ماجه وابن حبان من رواية عمرو بن قيس الكندي عنه، وقال الترمذي حسن غريب (جامع العلوم والحكم ص 927)."
  en: "A Companion who transmits 'keep your tongue moist with the remembrance of God' — the fiftieth hadith and seal of Ibn Rajab's additions to the Forty — transmitted by Ahmad, al-Tirmidhi, Ibn Majah and Ibn Hibban through Amr ibn Qays al-Kindi from him, al-Tirmidhi grading it hasan gharib (Jami' al-Ulum wal-Hikam p. 927)."
