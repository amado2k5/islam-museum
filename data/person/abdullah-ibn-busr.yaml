summary:
  ar: "صحابي يروي عنه حديث «لا يزال لسانك رطباً من ذكر الله عز وجل» — الحديث الخمسون وخاتمة زيادات ابن رجب على الأربعين — أخرجه أحمد والترمذي وابن ماجه وابن حبان من رواية عمرو بن قيس الكندي عنه، وقال الترمذي حسن غريب ⁦(جامع العلوم والحكم ص 927)⁩."
  en: "A Companion who transmits 'keep your tongue moist with the remembrance of God' — the fiftieth hadith and seal of Ibn Rajab's additions to the Forty — transmitted by Ahmad, al-Tirmidhi, Ibn Majah and Ibn Hibban through Amr ibn Qays al-Kindi from him, al-Tirmidhi grading it hasan gharib (Jami' al-Ulum wal-Hikam p. 927)."
  ur: "وہ صحابی جن سے «اپنی زبان کو اللہ کے ذکر سے تر رکھو» کی حدیث منقول ہے — ابن رجب کی چالیس میں پچاسویں حدیث۔"
  fr: "Un Compagnon qui transmet « que ta langue reste humide du rappel de Dieu » — le cinquantième hadith et sceau des ajouts d'Ibn Rajab aux Quarante — rapporté par Ahmad, al-Tirmidhi, Ibn Majah et Ibn Hibban par Amr ibn Qays al-Kindi d'après lui, al-Tirmidhi le jugeant hasan gharib (Jami' al-Ulum wal-Hikam p. 927)."
  es: "Un Compañero que transmite \"mantén tu lengua húmeda con el recuerdo de Dios\" —el quincuagésimo hadiz y sello de las adiciones de Ibn Rajab a los Cuarenta— transmitido por Ahmad, al-Tirmidhi, Ibn Majah e Ibn Hibban a través de Amr ibn Qays al-Kindi de él, al-Tirmidhi lo califica como hasan gharib (Jami' al-Ulum wal-Hikam p. 927)."
  tr: "“Diliniz her zaman Yüce Allah’ı anmakla nemli olsun” hadisini rivayet eden bir sahabe, bu hadisin ellinci hadis ve İbn Receb’in kırk hadise yaptığı eklemelerin sonuncusu olduğunu, Ahmed, Tirmizi, İbn Majah ve İbn Hibban’ın Amr ibn Kays el-Kindi’den, onun da rivayetine dayanarak naklettiğini ve Tirmizi’nin bunun hem güzel hem de garip olduğunu söylediğini belirtmiştir (Cami’ el-Ulum ve el-Hikam, s. 927)."
  id: "Seorang sahabat yang meriwayatkan hadits, “Hendaklah lidahmu senantiasa basah dengan mengingat Allah Yang Maha Agung” — hadits kelima puluh dan kesimpulan dari tambahan Ibn Rajab pada hadits keempat puluh — yang diriwayatkan oleh Ahmad, Al-Tirmidhi, Ibn Majah dan Ibn Hibban atas otoritas Amr ibn Qais Al-Kindi atas otoritasnya, dan Al-Tirmidhi mengatakan bahwa hadits ini baik dan luar biasa (Jami’ Al-‘Ulum wa Al-Hikam hlm. 927)."
