summary:
  ar: "صاحب راية تنوخ وبهراء في جيش معاوية بصفين، لما طال القتل في أهل الشام أجاب معاوية بقوله المشهور لقد نصحتك على نفسي وآثرت ملكك على ديني وتركت لهواك الرشد وأنا أعرفه، وسنقاتل عن تين الغوطة وزيتونها إذ حرمنا أثمار الجنة وأنهارها ثم صمد إلى الحرب {cite:muruj-al-dhahab p. 676}."
  en: "Tanukh and Bahra's bannerman in Mu'awiya's host — whose devastatingly honest reply at Siffin survives: 'I preferred your kingship over my religion and abandoned right-guidance knowing it... we fight for the Ghuta's figs and olives since Paradise's fruits are denied us' {cite:muruj-al-dhahab p. 676}."
