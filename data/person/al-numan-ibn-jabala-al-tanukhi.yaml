summary:
  ar: "صاحب راية تنوخ وبهراء في جيش معاوية بصفين، لما طال القتل في أهل الشام أجاب معاوية بقوله المشهور لقد نصحتك على نفسي وآثرت ملكك على ديني وتركت لهواك الرشد وأنا أعرفه، وسنقاتل عن تين الغوطة وزيتونها إذ حرمنا أثمار الجنة وأنهارها ثم صمد إلى الحرب {cite:muruj-al-dhahab p. 676}."
  en: "Tanukh and Bahra's bannerman in Mu'awiya's host — whose devastatingly honest reply at Siffin survives: 'I preferred your kingship over my religion and abandoned right-guidance knowing it [passage omitted] we fight for the Ghuta's figs and olives since Paradise's fruits are denied us' {cite:muruj-al-dhahab p. 676}."
  fr: "Porte-étendard des Tanukh et des Bahra dans l’armée de Mu’awiya, il a laissé cette réponse d’une grande franchise à Siffin : « J’ai préféré ta royauté à ma religion et j’ai délaissé la droite voie en connaissance de cause [passage omis]. Nous combattons pour les figues et les olives de la Ghouta, puisque les fruits du paradis nous sont refusés. » {cite:muruj-al-dhahab p. 676}"
  es: "Tanukh y el portaestandarte de Bahra en el ejército de Mu'awiya —cuya respuesta devastadoramente honesta en Siffin sobrevive: 'Preferí tu reinado a mi religión y abandoné la guía recta sabiendo que [pasaje omitido] luchamos por los higos y las aceitunas de Ghuta ya que se nos niegan los frutos del Paraíso' {cite:muruj-al-dhahab p. 676}."
  ur: "معاویہ کے میزبان میں تنوخ اور بحرہ کا بینر مین - جس کا صفین میں تباہ کن ایماندارانہ جواب زندہ رہتا ہے: 'میں نے آپ کی بادشاہی کو اپنے مذہب پر ترجیح دی اور یہ جانتے ہوئے کہ صحیح رہنمائی کو ترک کردیا [حسب کو چھوڑ دیا گیا] ہم غوطہ کے انجیر اور زیتون کے لیے لڑتے ہیں کیونکہ جنت کے پھل ہمارے پھل ہیں۔ 676}۔"
