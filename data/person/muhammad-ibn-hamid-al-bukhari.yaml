id: person/muhammad-ibn-hamid-al-bukhari
class: person
label: { ar: "محمد بن حامد البخاري", en: "Muhammad ibn Hamid al-Bukhari", es: "Muhammad ibn Hamid al-Bukhari", fr: "Muhammad ibn Hamid al-Bukhari" }
gender: male
roles: [jurist]
summary:
  ar: "محمد بن حامد بن علي، أبو بكر البخاري، فقيه حنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} سمع من الهيثم بن كليب الشاشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} قال الحاكم إنه إمام أصحاب أبي حنيفة في بخارى، وأعلمهم بالنظر والجدل، وأزهدهم في الدنيا، وألزمهم لسيرة أئمتهم في العزلة والورع وتجنب السلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} مات في بخارى، وأُغلقت الحوانيت له ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
  en: "Muhammad ibn Hamid ibn Ali, Abu Bakr al-Bukhari, a Hanafi jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He heard from al-Haytham ibn Kulayb al-Shashi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Al-Hakim called him the leading Hanafi scholar of Bukhara, the most learned in disputation and argument, the most ascetic, and the most committed to seclusion and to avoiding rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He died in Bukhara, and the shops were closed for three days in his mourning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
  es: "Muhammad ibn Hamid ibn Ali, Abu Bakr al-Bukhari, un jurista hanafí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Escuchaba de al-Haytham ibn Kulayb al-Shashi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Al-Hakim lo llamó el principal erudito hanafí de Bujará, el más versado en disputas y argumentos, el más ascético y el más comprometido con el aislamiento y con evitar a los gobernantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Murió en Bujará, y las tiendas permanecieron cerradas durante tres días en su luto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
  fr: "Muhammad ibn Hamid ibn Ali, Abu Bakr al-Bukhari, juriste hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Il reçut l'enseignement d'al-Haytham ibn Kulayb al-Shashi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Al-Hakim le qualifia de plus grand savant hanafite de Boukhara, le plus versé dans la dispute et l'argumentation, le plus ascétique et le plus attaché à la solitude et à l'éloignement des dirigeants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Il mourut à Boukhara et les commerces restèrent fermés pendant trois jours en signe de deuil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
