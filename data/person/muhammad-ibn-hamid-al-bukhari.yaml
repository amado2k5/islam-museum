summary:
  ar: "محمد بن حامد بن علي، أبو بكر البخاري، فقيه حنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} سمع من الهيثم بن كليب الشاشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} قال الحاكم إنه إمام أصحاب أبي حنيفة في بخارى، وأعلمهم بالنظر والجدل، وأزهدهم في الدنيا، وألزمهم لسيرة أئمتهم في العزلة والورع وتجنب السلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} مات في بخارى، وأُغلقت الحوانيت له ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
  en: "Muhammad ibn Hamid ibn Ali, Abu Bakr al-Bukhari, a Hanafi jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He heard from al-Haytham ibn Kulayb al-Shashi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} Al-Hakim called him the leading Hanafi scholar of Bukhara, the most learned in disputation and argument, the most ascetic, and the most committed to seclusion and to avoiding rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He died in Bukhara, and the shops were closed for three days in his mourning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
