summary:
  ar: "قارئ قرآن وداعية من الإمارات العربية المتحدة. إمام مسجد الشيخ سعود القاسمي، وقد أمّ المصلين في المسجد النبوي بالمدينة المنورة؛ ويُقارن صوته في التلاوة بصوت الشيخ عبد الرحمن السديس. ينتشر مصحفه المرتل الكامل عبر قنوات مسلم سنترال الصوتية منذ سنة 2013."
  en: "Qur'an reciter and preacher native to the United Arab Emirates. He serves as imam of the Sheikh Saoud Al Qassimi Mosque and has led prayers at the Prophet's Mosque in Medina; his recitation voice is compared to that of Sheikh Abdul Rahman Al-Sudais. His complete recorded murattal recitation has circulated through Muslim Central's audio channels since 2013."
  ur: "متحدہ عرب امارات سے تعلق رکھنے والے قاریِ قرآن اور واعظ۔ مسجد شیخ سعود القاسمی کے امام ہیں اور مدینہ منورہ میں مسجدِ نبوی میں بھی امامت کر چکے ہیں؛ ان کی آوازِ تلاوت کو شیخ عبد الرحمن السدیس کی آواز سے تشبیہ دی جاتی ہے۔ ان کا مکمل مرتل مصحف 2013ء سے مسلم سنٹرل کے صوتی چینلز پر رائج ہے۔"
  es: "Recitador y predicador del Corán originario de los Emiratos Árabes Unidos. Es imán de la Mezquita Sheikh Saoud Al Qassimi y ha dirigido las oraciones en la Mezquita del Profeta en Medina; su voz de recitación se compara con la del Sheikh Abdul Rahman Al-Sudais. Su recitación completa del Corán, grabada en su forma murattal, circula por los canales de audio de Muslim Central desde 2013."
  fr: "Récitateur du Coran et prédicateur originaire des Émirats arabes unis, il est imam de la mosquée Cheikh Saoud Al Qassimi et a dirigé la prière à la mosquée du Prophète à Médine. Sa voix est souvent comparée à celle du cheikh Abdul Rahman Al-Sudais. L'intégralité de son enregistrement de récitation du Coran (murattal) est diffusée sur les chaînes audio de Muslim Central depuis 2013."
  tr: "Birleşik Arap Emirlikleri'nden bir Kur'an okuyucu ve vaiiz. Şeyh Suud El-Kasimi Camii imamı ve Medine'deki Peygamber Camii'nde namaz kılmıştır; okuma sesi, Şeyh Abdulrahman Al-Sudais'in sesiyle karşılaştırılır. Kur'an'ın tam okuyu 2013'ten beri Muslim Central ses kanallarında yayınlanmaktadır."
  id: "Seorang pembaca Al-Qur'an dan penceramah dari Uni Emirat Arab. Imam Masjid Sheikh Saud Al-Qasimi, dan telah memimpin shalat di Masjid Nabi di Madinah; suara bacaannya dibandingkan dengan Sheikh Abdulrahman Al-Sudais. Pembacaan Al-Qur'an lengkapnya telah disiarkan di saluran audio Muslim Central sejak 2013."
