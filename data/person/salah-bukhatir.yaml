  ar: "قارئ قرآن وداعية من الإمارات العربية المتحدة. إمام مسجد الشيخ سعود القاسمي، وقد أمّ المصلين في المسجد النبوي بالمدينة المنورة؛ ويُقارن صوته في التلاوة بصوت الشيخ عبد الرحمن السديس. ينتشر مصحفه المرتل الكامل عبر قنوات مسلم سنترال الصوتية منذ سنة 2013."
  en: "Qur'an reciter and preacher native to the United Arab Emirates. He serves as imam of the Sheikh Saoud Al Qassimi Mosque and has led prayers at the Prophet's Mosque in Medina; his recitation voice is compared to that of Sheikh Abdul Rahman Al-Sudais. His complete recorded murattal recitation has circulated through Muslim Central's audio channels since 2013."
