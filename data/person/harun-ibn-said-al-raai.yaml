summary:
  ar: "أبو عبد الرحمن هارون بن سعيد الراعي، من الزاهدين والسائحين، لقي بالشام أبا سليمان الداراني ومحمد بن المبارك الصوري وأحمد بن عاصم الأنطاكي. حدّث عنه أبو مسعود الرازي في مسنده."
  en: "Abu Abd al-Rahman Harun ibn Sa'id al-Ra'i, one of the ascetics and wanderers; in Syria he met Abu Sulayman al-Darani, Muhammad ibn al-Mubarak al-Suri and Ahmad ibn Asim al-Antaki; Abu Mas'ud al-Razi transmitted from him in his musnad. His reports include a saying that regret is repentance, and Ibn Abbas's explanation of the verse on not advancing before God and His Messenger."
  ur: "ابو عبد الرحمن ہارون بن سعید راعی، زاہدوں اور سیاحوں میں سے؛ شام میں ابو سلیمان دارانی، محمد بن مبارک صوری اور احمد بن عاصم انطاکی سے ملے۔ ابو مسعود رازی نے اپنی مسند میں ان سے روایت کی۔ ان کی روایات میں یہ ہے کہ ندامت توبہ ہے، اور ابن عباس کی وہ تفسیر ہے کہ اللہ اور اس کے رسول سے آگے نہ بڑھو کے حکم کا مطلب کتاب و سنت کے خلاف کہنا نہیں۔"
