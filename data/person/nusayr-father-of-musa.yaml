id: person/nusayr-father-of-musa
class: person
label: { ar: "نصير أبو موسى بن نصير" }
summary:
  ar: "عند البلاذري: نصير أبو موسى بن نصير صاحب المغرب وهو مولى بني أمية من سبي عين التمر على رواية وله بالمغرب موال من أولاد من أعتق؛ وقال ابن الكلبي كان عربياً من أراشة من بلي سبي أيام أبي بكر من جبل الجليل بالشام وكان اسمه نصراً فصُغّر واعتقه بعض بني أمية فرجع إلى الشام وولد له موسى بقرية يقال لها كفر مري وكان أعرج وقد قيل إنه وأبو فروة أخوان من سبي عين التمر وولاؤهما لبني ضبة."
  en: "In al-Baladhuri: Nusayr, father of Musa ibn Nusayr the Maghreb's conqueror, mawla of the Umayyads, of Ayn al-Tamr's captives on one account — his own freedmen's sons being clients in the Maghreb; al-Kalbi said he was an Arab of Arasha of Bali captured in Abu Bakr's days from Syria's Jabal al-Jalil, his name Nasr diminutivized, freed by an Umayyad, returned to Syria, Musa born to him at Kafr Mari village — he was lame; it is also said he and Abu Farwa were brothers of Ayn al-Tamr's captives with wala' to Banu Dubba."
  es: "En al-Baladhuri: Nusayr, padre de Musa ibn Nusayr, el conquistador del Magreb, mawla de los Omeyas, de los cautivos de Ayn al-Tamr en un relato: los hijos de sus propios libertos eran clientes en el Magreb; al-Kalbi dijo que era un árabe de Arasha de Bali capturado en los días de Abu Bakr en Jabal al-Jalil de Siria, su nombre Nasr diminutivizado, liberado por un Omeya, regresó a Siria, Musa nació de él en la aldea de Kafr Mari; era cojo; también se dice que él y Abu Farwa eran hermanos de los cautivos de Ayn al-Tamr con wala' para Banu Dubba."
  fr: "Selon al-Baladhuri: Nusayr, père de Musa ibn Nusayr, le conquérant du Maghreb, mawla des Omeyyades, et, d'une certaine manière, des captifs d'Ayn al-Tamr — les fils de ses propres affranchis étant des clients au Maghreb; al-Kalbi dit qu'il était un Arabe d'Arasha de Bali, capturé à l'époque d'Abu Bakr à Jabal al-Jalil en Syrie, son nom Nasr diminutif, libéré par un Omeyyade, retourné en Syrie, Musa lui naquit au village de Kafr Mari — il était boiteux; il est également dit que lui et Abu Farwa étaient frères des captifs d'Ayn al-Tamr avec wala' des Banu Dubba."
  ur: "البلادوری میں ہے: نصیر، مغرب کے فاتح موسیٰ بن نصیر کے والد، امویوں کے مولا، عین التمر کے اسیروں میں سے ایک وجہ سے - اس کے اپنے آزاد ہونے والے بیٹے مغرب میں گاہک ہیں؛ الکلبی نے کہا کہ وہ بالی کے عراشہ کا ایک عرب تھا جسے ابوبکر کے دنوں میں شام کے جبل الجلیل سے پکڑا گیا تھا، اس کا نام نصر کم ہوا، ایک اموی کے ہاتھوں آزاد ہو کر شام واپس آیا، موسیٰ اس کے ہاں کفر ماری گاؤں میں پیدا ہوا - وہ لنگڑا تھا۔ یہ بھی کہا جاتا ہے کہ وہ اور ابو فروہ عین التمر کے اسیروں کے بھائی تھے جو بنو دبہ کے ساتھ تھے۔"
