label: { ar: "نصير أبو موسى بن نصير" }
summary:
  ar: "عند البلاذري: نصير أبو موسى بن نصير صاحب المغرب وهو مولى بني أمية من سبي عين التمر على رواية وله بالمغرب موال من أولاد من أعتق؛ وقال ابن الكلبي كان عربياً من أراشة من بلي سبي أيام أبي بكر من جبل الجليل بالشام وكان اسمه نصراً فصُغّر واعتقه بعض بني أمية فرجع إلى الشام وولد له موسى بقرية يقال لها كفر مري وكان أعرج وقد قيل إنه وأبو فروة أخوان من سبي عين التمر وولاؤهما لبني ضبة."
  en: "In al-Baladhuri: Nusayr, father of Musa ibn Nusayr the Maghreb's conqueror, mawla of the Umayyads, of Ayn al-Tamr's captives on one account — his own freedmen's sons being clients in the Maghreb; al-Kalbi said he was an Arab of Arasha of Bali captured in Abu Bakr's days from Syria's Jabal al-Jalil, his name Nasr diminutivized, freed by an Umayyad, returned to Syria, Musa born to him at Kafr Mari village — he was lame; it is also said he and Abu Farwa were brothers of Ayn al-Tamr's captives with wala' to Banu Dubba."
