summary:
  ar: "شيخ الشيوخ الصوفي، شيخ السميساطية؛ ولد بدمشق سنة ست وستين وخمسمائة وسمع من شهدة والحافظ أبي القاسم بن عساكر، ودخل المغرب قبل الستمائة فأقام هناك ست سنين، وله مجاميع وفوائد وصنف التاريخ؛ كان نزهاً عفيفاً قليل الطمع لا يلتفت إلى أحد من خلق الله لأجل الدنيا؛ وهو عم أولاد شيخ الشيوخ صدر الدين الجويني {cite:shadharat-dhahab p. 222}."
  en: "Shaykh al-shuyukh of the Sumaysatiyya (b. Damascus 566, d. Safar 642) — heard Shuhdah and Ibn Asakir, spent six years in the Maghrib before 600, wrote a Tarikh; uncle in the Juwayni house of shaykh al-shuyukh Sadr al-Din {cite:shadharat-dhahab p. 222}."
