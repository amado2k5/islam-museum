summary:
  ar: "العلامة الفرضي؛ درس بالنظامية وترسل غير مرة وحدث بحلب ودمشق ومصر وبغداد، وبنى بدمشق المدرسة الكبيرة المشهورة به المعروفة بالبدرائية؛ قال الذهبي كان فقيهاً عالماً ديّناً صدراً محتشماً جليل القدر وافر الحرمة متواضعاً دمث الأخلاق منبسطاً، وولي القضاء ببغداد على كره وتوفي بعد خمسة عشر يوماً في ذي القعدة وعافاه الله من كائنة التتار؛ قال السيوطي نسبة إلى بادرايا قرية من عمل واسط {cite:shadharat-dhahab p. 277}."
  en: "The faridi (b. 594) — taught at the Nizamiyya, built Damascus's famous Badra'iyya madrasa; appointed qadi of Baghdad against his will he died fifteen days later, Dhu al-Qa'da 655 — 'God spared him the Tatar calamity' {cite:shadharat-dhahab p. 277}."
  fr: "Spécialiste des parts successorales (né en 594 H) — il enseigna à la Nizamiyya et construisit la célèbre madrasa Badra’iyya de Damas ; nommé cadi de Bagdad contre son gré, il mourut quinze jours plus tard, en dhu al-qi’da 655 H — « Dieu lui épargna la calamité tatare » {cite:shadharat-dhahab p. 277}."
  es: "Los faridi (n. 594): enseñaron en Nizamiyya, construyeron la famosa madrasa Badra'iyya de Damasco; Nombrado cadí de Bagdad contra su voluntad, murió quince días después, Dhu al-Qa'da 655 - 'Dios le libró de la calamidad tártara' {cita: shadharat-dhahab p. 277}."
  ur: "فریدی ⁦(پیدائش 594)⁩ - نظامیہ میں پڑھایا جاتا تھا، دمشق کا مشہور مدرسہ بدرئیہ بنایا۔ اس کی مرضی کے خلاف بغداد کا قاضی مقرر کیا گیا، پندرہ دن بعد اس کا انتقال ہو گیا، ذوالقعدہ 655 - 'خدا نے اسے تاتاری آفت سے بچایا'۔ 277}۔"
  tr: "Fardi âlimi; Nizamiye'de eğitim görmüş, birden fazla kez Halep, Şam, Mısır ve Bağdat'a gönderilmiş ve buralarda hadis rivayet etmiştir. Şam'da, kendisiyle ünlü olan ve el-Badraiyye olarak bilinen büyük bir okul kurmuştur. El-Dhahabi şöyle demiştir: O, bir hukukçu, bir âlim, dindar bir adam, saygın ve onurlu bir şahsiyet, büyük bir şahsiyet, bolca şeref sahibi, mütevazı, nazik ve uysal bir insandı. İsteği dışında Bağdat'ta kadı olarak atanmış ve on beş gün sonra Zülkade'de vefat etmiştir. Allah onu Tatarların felaketinden kurtarmıştır. El-Suyuti şöyle demiştir: Wasit bölgesindeki Badraya köyüne atfedilir. {Kaynak: Şadharat-Dhahab, s. 277}"
  id: "Ulama al-Fardi; ia belajar di Nizamiyya dan diutus lebih dari sekali serta meriwayatkan hadits di Aleppo, Damaskus, Mesir dan Baghdad, dan ia membangun di Damaskus sekolah besar yang terkenal karena jasanya, yang dikenal sebagai al-Badra’iyya; al-Dhahabi berkata: Ia adalah seorang ahli hukum, seorang ulama, seorang tokoh agama, seorang figur yang bermartabat dan dihormati, berwibawa, sangat terhormat, rendah hati, lembut karakternya dan mudah bergaul. Ia diangkat menjadi hakim di Baghdad melawan kehendaknya dan meninggal lima belas hari kemudian di Dzul Qa'dah, dan Allah menyelamatkannya dari musibah Tatar; al-Suyuti berkata: Ia dikaitkan dengan Badraya, sebuah desa di distrik Wasit {kutip:shadharat-dhahab hlm. 277}."
