summary:
  ar: "العلامة الفرضي؛ درس بالنظامية وترسل غير مرة وحدث بحلب ودمشق ومصر وبغداد، وبنى بدمشق المدرسة الكبيرة المشهورة به المعروفة بالبدرائية؛ قال الذهبي كان فقيهاً عالماً ديّناً صدراً محتشماً جليل القدر وافر الحرمة متواضعاً دمث الأخلاق منبسطاً، وولي القضاء ببغداد على كره وتوفي بعد خمسة عشر يوماً في ذي القعدة وعافاه الله من كائنة التتار؛ قال السيوطي نسبة إلى بادرايا قرية من عمل واسط {cite:shadharat-dhahab p. 277}."
  en: "The faridi (b. 594) — taught at the Nizamiyya, built Damascus's famous Badra'iyya madrasa; appointed qadi of Baghdad against his will he died fifteen days later, Dhu al-Qa'da 655 — 'God spared him the Tatar calamity' {cite:shadharat-dhahab p. 277}."
