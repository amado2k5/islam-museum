gender: male
summary:
  ar: "سيد علي نديم رضوي مؤرخ، كاتب الفصل «الأثر الإيراني في العمارة الهندية الوسيطة» في كتاب «تراث مشترك: نمو الحضارات في الهند وإيران» بتحرير عرفان حبيب، 2002، وهو عن انتقال العناصر المعمارية الإيرانية والتيمورية إلى عمارة سلطنة دلهي والمغول. لا يتوافر للمتحف غير هذا الفصل، فسيرته غير معروفة هنا {cite:rezavi-iranian-influence-indian-architecture-2002}."
  en: "Syed Ali Nadeem Rezavi is a historian and the author of the chapter \"Iranian Influence on Medieval Indian Architecture\" in A Shared Heritage: The Growth of Civilizations in India and Iran, edited by Irfan Habib (2002), on the transmission of Iranian and Timurid architectural elements to Delhi Sultanate and Mughal architecture. The museum holds only this chapter, so his biography is unknown here {cite:rezavi-iranian-influence-indian-architecture-2002}."
  ur: "سید علی ندیم رضوی مؤرخ ہیں اور «مشترکہ ورثہ: ہندوستان اور ایران میں تہذیبوں کی نشوونما» میں، جس کے مدیر عرفان حبیب ہیں اور جو 2002ء میں شائع ہوئی، باب «قرونِ وسطیٰ کے ہندوستانی فنِ تعمیر پر ایرانی اثر» کے مصنف ہیں، جو ایرانی اور تیموری تعمیری عناصر کے دہلی سلطنت اور مغل فنِ تعمیر تک پہنچنے پر ہے۔ عجائب گھر کے پاس صرف یہی باب ہے، اس لیے ان کی سوانح یہاں معلوم نہیں {cite:rezavi-iranian-influence-indian-architecture-2002}."
  es: "Syed Ali Nadeem Rezavi es historiador y autor del capítulo «Influencia iraní en la arquitectura medieval india» en «Un patrimonio compartido: El desarrollo de las civilizaciones en India e Irán», editado por Irfan Habib (2002), sobre la transmisión de elementos arquitectónicos iraníes y timúridas a la arquitectura del Sultanato de Delhi y la arquitectura mogol. El museo solo conserva este capítulo, por lo que su biografía es desconocida en este lugar {cite:rezavi-iranian-influence-indian-architecture-2002}."
  fr: "Syed Ali Nadeem Rezavi est un historien et l'auteur du chapitre « L'influence iranienne sur l'architecture indienne médiévale » dans l'ouvrage *A Shared Heritage: The Growth of Civilizations in India and Iran*, dirigé par Irfan Habib (2002). Ce chapitre traite de la transmission des éléments architecturaux iraniens et timourides à l'architecture du sultanat de Delhi et à l'architecture moghole. Le musée ne conserve que ce chapitre; sa biographie n'est donc pas disponible ici."
  tr: "Sayed Ali Nadim Razavi, tarihçi ve Irfan Habib tarafından 2002 yılında derlenen \"Paylaşılan Miras: Hindistan ve İran'da Uygarlıkların Büyümesi\" adlı kitapta \"Ortaçağ Hint Mimarisinde İran Etkisi\" başlıklı bölümünün yazarıdır. Bu bölüm, İran ve Timur mimari unsurlarının Delhi Sultanlığı ve Babürler mimarisine aktarılmasıyla ilgilidir. Müzede sadece bu bölüm bulunmaktadır, çünkü biyografisi burada bilinmemektedir {cite:rezavi-iranian-influence-indian-architecture-2002}."
  id: "Sayed Ali Nadim Razavi adalah sejarawan dan penulis bab \"Pengaruh Iran dalam Arsitektur India Abad Pertengahan\" dalam buku \"Shared Heritage: The Growth of Civilizations in India and Iran,\" yang disunting oleh Irfan Habib, 2002. Buku ini membahas transfer elemen arsitektur Iran dan Timurid ke arsitektur Kesultanan Delhi dan Mughal. Museum ini hanya memiliki bab ini, karena biografinya tidak diketahui di sini {cite:rezavi-iranian-influence-indian-architecture-2002}."
