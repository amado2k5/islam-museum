label: { ar: "سيد علي نديم رضوي", en: "Syed Ali Nadeem Rezavi", ur: "سید علی ندیم رضوی" }
gender: male
summary:
  ar: "سيد علي نديم رضوي مؤرخ، كاتب الفصل «الأثر الإيراني في العمارة الهندية الوسيطة» في كتاب «تراث مشترك: نمو الحضارات في الهند وإيران» بتحرير عرفان حبيب، 2002، وهو عن انتقال العناصر المعمارية الإيرانية والتيمورية إلى عمارة سلطنة دلهي والمغول. لا يتوافر للمتحف غير هذا الفصل، فسيرته غير معروفة هنا {cite:rezavi-iranian-influence-indian-architecture-2002}."
  en: "Syed Ali Nadeem Rezavi is a historian and the author of the chapter \"Iranian Influence on Medieval Indian Architecture\" in A Shared Heritage: The Growth of Civilizations in India and Iran, edited by Irfan Habib (2002), on the transmission of Iranian and Timurid architectural elements to Delhi Sultanate and Mughal architecture. The museum holds only this chapter, so his biography is unknown here {cite:rezavi-iranian-influence-indian-architecture-2002}."
  ur: "سید علی ندیم رضوی مؤرخ ہیں اور «مشترکہ ورثہ: ہندوستان اور ایران میں تہذیبوں کی نشوونما» میں، جس کے مدیر عرفان حبیب ہیں اور جو 2002ء میں شائع ہوئی، باب «قرونِ وسطیٰ کے ہندوستانی فنِ تعمیر پر ایرانی اثر» کے مصنف ہیں، جو ایرانی اور تیموری تعمیری عناصر کے دہلی سلطنت اور مغل فنِ تعمیر تک پہنچنے پر ہے۔ عجائب گھر کے پاس صرف یہی باب ہے، اس لیے ان کی سوانح یہاں معلوم نہیں {cite:rezavi-iranian-influence-indian-architecture-2002}."
