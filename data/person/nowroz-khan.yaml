summary:
  ar: "زعيم قبلي بلوشي (1874–1964، وسنة ميلاده محل نزاع) من الزاركزاي (الزهري) في جهلوان: بعد اعتقال خان قلات في أكتوبر 1958 قاد تمرد 1958–1960، واستسلم في 15 مايو 1959 على عهد أمان بالمصحف فاعتُقل مع أتباعه، وأفلت من الإعدام الذي نال سبعة من رفاقه سنة 1960 لكبر سنه، وتوفي في سجن كوهلو سنة 1964."
  en: "Baloch tribal leader (1874–1964, the birth year debated) of the Zarakzai (Zehri) of Jhalawan: after the Khan of Kalat's arrest in October 1958 he led the 1958–60 insurgency, surrendered on 15 May 1959 under a Quran oath of amnesty and was arrested with his followers; spared, on account of his age, the execution that took seven of his companions in 1960, he died in Kohlu jail in 1964."
  ur: "بلوچ قبائلی سردار (1874ء–1964ء، سنِ پیدائش متنازع) جن کا تعلق جھالاوان کے زارکزئی (زہری) سے تھا: اکتوبر 1958ء میں خانِ قلات کی گرفتاری کے بعد انھوں نے 1958ء تا 1960ء کی شورش کی قیادت کی، 15 مئی 1959ء کو قرآن پر امان کے عہد پر ہتھیار ڈالے تو پیروکاروں سمیت گرفتار کر لیے گئے؛ 1960ء میں ان کے سات رفقا کو پھانسی ہوئی مگر بڑھاپے کی بنا پر وہ بچ گئے، اور 1964ء میں کوہلو جیل میں وفات پائی۔"
