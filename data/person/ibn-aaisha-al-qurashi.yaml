label: { ar: "ابن عائشة القرشي", en: "Ibn 'A'isha al-Qurashi", es: "Ibn 'A'isha al-Qurashi", fr: "Ibn 'A'isha al-Qurashi", ur: "ابن عائشہ القرشی۔" }
summary:
  ar: "مغني الوليد بن يزيد، غناه إنها رأيت صبيحة النحر حوراً فقال له الوليد أعد بحق عبد شمس فأعاد ثم بحق أمية فأعاد وجعل يتخطى من أب إلى أب حتى بلغ نفسه فقال أعد بحياتي فأعاد، فأكب عليه الوليد ولم يبق عضواً إلا قبله ونزع ثيابه فألقاها عليه وأمر له بألف دينار وحمله على بغلته وقال انصرف فقد تركتني على أحر من جمر الغضى، وقد غنى بهذا الشعر يزيد أباه فأطربه {cite:muruj-al-dhahab p. 203}."
  en: "al-Walid's Qurashi singer — made to repeat 'I saw maidens on slaughter-morn' through the Umayyad ancestors till the caliph kissed every limb, cast his own clothes on him and gave a thousand dinars {cite:muruj-al-dhahab p. 203}."
  es: "El cantante Qurashi de al-Walid fue obligado a repetir \"Vi doncellas en la mañana de la matanza\" a través de los ancestros omeyas hasta que el califa besó cada miembro, le echó sus propias ropas y le dio mil dinares {cite:muruj-al-dhahab p. 203}."
  fr: "Le chanteur qurashi d'al-Walid a été contraint de répéter « J'ai vu des jeunes filles le matin du massacre » à travers les ancêtres omeyyades jusqu'à ce que le calife embrasse chaque membre, jette ses propres vêtements sur lui et lui donne mille dinars {cite:muruj-al-dhahab p. 203}."
  ur: "الولید کی قریشی گلوکارہ - اموی آباؤ اجداد کے ذریعے 'میں نے صبح کے وقت کنواریاں دیکھیں' کو دہرایا یہاں تک کہ خلیفہ نے ہر عضو کو چوما، اس پر اپنے کپڑے ڈالے اور ایک ہزار دینار دیئے {حوالہ: مروج الذہب صفحہ 203}۔"
  tr: "Al-Walid ibn Yazid'in şarkıcısı, kurban sabahı bir houri gördüğünü söyledi. Al-Walid ona, 'Abd Şams için hazırlan.' dedi. O da onu geri verdi, sonra Umayyah'a geri verdi ve babadan babaya geçti, ta ki aklına gelene kadar. 'Hayatıma hazırlanın,' dedi ve geri döndü. Al-Walid ona seslendi, sadece önünde kalan tek bir uzvu kalmadı, bu yüzden kıyafetlerini çıkardı, ona fırlattı ve ona bin dinar verilmesini emretti, onu katırına bindirdi, 'Git, çünkü beni yanan közlerin sıcaklığında terk ettin.' dedi. Yazid bu şiiri söyledi ve onu sevindirdi. {cite:muruj-al-dhahab s. 203}."
  id: "Penyanyi Al-Walid ibn Yazid menyanyikan bahwa ia melihat satu houri pada pagi hari persembahan. Al-Walid berkata kepadanya, 'Bersiaplah demi Abd Shams.' Ia mengembalikannya, lalu mengembalikannya kepada Umayyah, dan ia terus berpindah dari ayah ke ayah sampai ia sadar. Ia berkata, 'Bersiaplah untuk hidupku,' lalu ia kembali. Al-Walid berteriak kepadanya, dan tidak ada satu pun anggota tubuh yang tersisa kecuali di hadapannya, maka ia melepas pakaiannya, melemparkannya ke arahnya, dan memerintahkan seribu dinar diberikan kepadanya dan menggendongnya dengan keledai, sambil berkata, 'Pergilah, karena kau telah meninggalkanku dalam panasnya bara api.' Yazid menyanyikan puisi ini dan membuatnya senang. {cite:muruj-al-dhahab hlm. 203}."
