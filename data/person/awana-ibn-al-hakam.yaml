id: person/awana-ibn-al-hakam
class: person
label: { ar: "عوانة بن الحكم" }
summary:
  ar: "عند البلاذري: قال إن الأقباط كانت تذكر المسيح في رؤوس الطوامير وتنسبه إلى الربوبية وتجعل الصليب مكان بسم الله الرحمن الرحيم فلذلك قوّه ملك الروم ما كره واشتد عليه تغيير عبد الملك ما غيّره — راوٍ في كتاب فتوح البلدان."
  en: "In al-Baladhuri: he said the Copts used to mention Christ at scroll-heads attributing divinity to him and place the cross where the basmala was — hence Rome's king was galled and Abd al-Malik's change weighed on him — a narrator in Futuh al-Buldan."
  es: "En al-Baladhuri: dijo que los coptos solían mencionar a Cristo en los encabezados de los rollos atribuyéndole divinidad y colocando la cruz donde estaba la basmala; por eso el rey de Roma se enojó y el cambio de Abd al-Malik le pesó —un narrador en Futuh al-Buldan."
  fr: "Dans al-Baladhuri: il dit que les Coptes avaient l'habitude de mentionner le Christ en tête de rouleau, lui attribuant la divinité, et de placer la croix là où se trouvait la basmala — c'est pourquoi le roi de Rome était irrité et le changement d'Abd al-Malik lui pesait — un narrateur dans Futuh al-Buldan."
  ur: "البلادھوری میں: اس نے کہا کہ قبطی طومار کے سروں پر مسیح کا ذکر کرتے تھے اور اس کی طرف الوہیت منسوب کرتے تھے اور صلیب کو وہیں رکھتے تھے جہاں بسملہ تھا - اس لیے روم کے بادشاہ کو غصہ آیا اور عبد الملک کی تبدیلی نے اس پر وزن کیا - فتوح البلدان میں ایک راوی۔"
