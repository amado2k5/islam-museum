summary:
  ar: "أبو البركات المبارك بن أبي الفتح أحمد بن المبارك بن موهوب بن غنيمة بن غالب اللخمي، الملقب شرف الدين، المعروف بابن المستوفي الإربلي؛ كان رئيساً جليل القدر كثير التواضع واسع الكرم لا يصل إلى إربل أحد من الفضلاء إلا بادر إلى زيارته؛ كان عالماً بالحديث وعلومه وأسماء رجاله إماماً فيه وماهراً في النحو واللغة والعروض والقوافي وعلم البيان وأشعار العرب وأيامها وأمثالها وبارعاً في علم الديوان وحسابه؛ جمع لإربل تاريخاً في أربع مجلدات وله كتاب «النظم في شرح شعر المتنبي وأبي تمام» في عشر مجلدات و«إثبات المفصل» في مجلدين و«سر الصنعة» وكتاب «أبا قهاش»؛ قال ابن خلكان: سمعت منه كثيراً وسمعت بقراءته على المشايخ الواردين على إربل فإنه كان يعتمد القراءة بنفسه، وله ديوان شعر أجاد فيه {cite:wafayat-ayan}. وفي الشذرات: كان بيته مجمع الفضلاء، وسلّم قلعة أربل من التتار سنة أربع وثلاثين ثم سكن الموصل ومات بها {cite:shadharat-dhahab p. 187}."
  en: "Sharaf al-Din Ibn al-Mustawfi (d. 638) — the historian of Irbil; author of the four-volume Tarikh Irbil, a ten-volume sharh on the poetry of al-Mutanabbi and Abu Tammam, and a diwan; Ibn Khallikan heard much from him in person {cite:wafayat-ayan}."
  es: "Sharaf al-Din ibn al-Mustawfi (m. 638) — el historiador de Irbil; autor del Tarikh Irbil en cuatro volúmenes, un sharh en diez volúmenes sobre la poesía de al-Mutanabbi y Abu Tammam, y un diwan; Ibn Khallikan escuchó mucho de él personalmente."
  fr: "Sharaf al-Din ibn al-Mustawfi (mort en 638) — l'historien d'Erbil; auteur du Tarikh Irbil en quatre volumes, d'un sharh en dix volumes sur la poésie d'al-Mutanabbi et d'Abu Tammam, et d'un diwan; Ibn Khallikan a beaucoup entendu parler de lui en personne."
  ur: "شرف الدین ابن المصطفی ⁦(متوفی 638)⁩ - اربیل کا مورخ؛ چار جلدوں پر مشتمل تاریخ اربیل کے مصنف، المتنبی اور ابو تمام کی شاعری پر دس جلدوں پر مشتمل شارح، اور ایک دیوان؛ ابن خلیقان نے ان سے ذاتی طور پر بہت کچھ سنا ہے۔"
  tr: "Ebu el-Barakat el-Mübarek ibn Ebi el-Feth Ahmed bin el-Mübarek ibn Muhubib ibn Ghanimah ibn Ghalib al-Lakhmi, lakaplı adı Sharaf al-Din, İbn el-Mustawfi el-Irbali olarak bilinir, onurlu ve son derece alçakgönüllü bir liderdi. Hiçbir seçkin kişi Erbil'e aceleyle gitmeden ulaşamazdı. Hadis, illeri, imamlarının isimleri hakkında bilgiliydi, dilbilgisi, dil, prosodi, kafiyeler, retorik, Arap şiiri, dönemi ve benzeri türlerde yetkindi ve divan ile aritmetikte yetkindi. Erbil tarihini dört cilt halinde derledi ve bir kitap yazdı \" Al-Nazm fi Sharh Shi'ar al-Mutanabbi wa Abu Tammam\" on ciltlikte, \"Ithbat al-Mufassal\"ı iki ciltlikte, \"Sirr al-San'ah\" ve \"Abu Qahash\" kitabını yazmıştır; İbn Hallikan şöyle demiştir: Ondan çok şey duydum ve Erbil'e gelen şeyhlerden okunduğunu duydum, çünkü kendi okumalarına dayanıyordu ve üstün olduğu bir şiir koleksiyonu vardı. El-Şadhrat'ta: Evi erdemlilerin toplandığı yerdi ve 34 H. yılında Erbil kalesini Tatarlardan teslim etti, ardından Musul'a yerleşti ve orada öldü {atıf:şadharat-dhahab, s. 187}."
  id: "Abu al-Barakat al-Mubarak ibn Abi al-Fath Ahmad ibn al-Mubarak ibn Muhubib ibn Ghanimah ibn Ghalib al-Lakhmi, yang dijuluki Sharaf al-Din, dikenal sebagai Ibn al-Mustawfi al-Irbali, adalah seorang pemimpin yang bermartabat dan sangat rendah hati. Tidak ada orang terkemuka yang datang ke Erbil tanpa mengunjunginya dengan tergesa-gesa. Ia menguasai hadis, ilmu pengetahuannya, nama-nama imamnya, mahir dalam tata bahasa, bahasa, prosodi, rima, retorika, puisi Arab, zamannya, dan genre serupa, serta mahir dalam diwan dan aritmatika. Ia menyusun sejarah Erbil dalam empat jilid dan menulis sebuah buku \" Al-Nazm fi Sharh Shi'ar al-Mutanabbi wa Abu Tammam\" dalam sepuluh jilid, \"Ithbat al-Mufassal\" dalam dua jilid, \"Sirr al-San'ah,\" dan buku \"Abu Qahash\"; Ibn Khallikan berkata: Saya banyak mendengar darinya dan mendengar dia membacakan dari para sheikh yang datang ke Erbil, karena dia mengandalkan pembacaannya sendiri, dan dia memiliki kumpulan puisi yang sangat dia kuasai. Dalam Al-Shadhrat: Rumahnya adalah tempat berkumpulnya orang-orang berbudi luhur, dan ia menyerahkan benteng Erbil dari Tatar pada tahun 34 H, lalu menetap di Mosul dan meninggal di sana {cite:shadharat-dhahab, hlm. 187}."
