summary:
  ar: "أبو البركات المبارك بن أبي الفتح أحمد بن المبارك بن موهوب بن غنيمة بن غالب اللخمي، الملقب شرف الدين، المعروف بابن المستوفي الإربلي؛ كان رئيساً جليل القدر كثير التواضع واسع الكرم لا يصل إلى إربل أحد من الفضلاء إلا بادر إلى زيارته؛ كان عالماً بالحديث وعلومه وأسماء رجاله إماماً فيه وماهراً في النحو واللغة والعروض والقوافي وعلم البيان وأشعار العرب وأيامها وأمثالها وبارعاً في علم الديوان وحسابه؛ جمع لإربل تاريخاً في أربع مجلدات وله كتاب «النظم في شرح شعر المتنبي وأبي تمام» في عشر مجلدات و«إثبات المفصل» في مجلدين و«سر الصنعة» وكتاب «أبا قهاش»؛ قال ابن خلكان: سمعت منه كثيراً وسمعت بقراءته على المشايخ الواردين على إربل فإنه كان يعتمد القراءة بنفسه، وله ديوان شعر أجاد فيه {cite:wafayat-ayan}. وفي الشذرات: كان بيته مجمع الفضلاء، وسلّم قلعة أربل من التتار سنة أربع وثلاثين ثم سكن الموصل ومات بها {cite:shadharat-dhahab p. 187}."
  en: "Sharaf al-Din Ibn al-Mustawfi (d. 638) — the historian of Irbil; author of the four-volume Tarikh Irbil, a ten-volume sharh on the poetry of al-Mutanabbi and Abu Tammam, and a diwan; Ibn Khallikan heard much from him in person {cite:wafayat-ayan}."
