summary:
  ar: "محمد البهي ⁦(1905–1982م)⁩، من علماء الأزهر ومفكريه في القرن العشرين؛ ولد بقرية أسمانية بالبحيرة في 3 أغسطس 1905م، ونال الدكتوراه من جامعة هامبورج عام 1936م في الشيخ محمد عبده والتربية القومية، ثم عمل أول مدير لجامعة الأزهر بعد قانون 1961م ووزيرًا للأوقاف وشئون الأزهر في سبتمبر 1962م، وتوفي في 10 سبتمبر 1982م {cite:al-islam-fitrat-allah-azhar p. 11} {cite:al-islam-fitrat-allah-azhar p. 12} {cite:al-islam-fitrat-allah-azhar p. 13}. ألّف في نقد الفكر المادي التاريخي {cite:al-islam-fitrat-allah-azhar p. 13}."
  en: "Muhammad al-Bahi (1905-1982), Azhari scholar and thinker, first director of al-Azhar University after the 1961 law and Egyptian minister of Awqaf in 1962; born 3 August 1905 and died 10 September 1982, dates as printed in his book (pp. 11-13)."
  es: "Muhammad al-Bahi (1905-1982), erudito y pensador de Al-Azhar, primer director de la Universidad de Al-Azhar tras la ley de 1961 y ministro egipcio de Awqaf en 1962; nació el 3 de agosto de 1905 y murió el 10 de septiembre de 1982, fechas tal como aparecen impresas en su libro (págs. 11-13)."
  fr: "Muhammad al-Bahi (1905-1982), érudit et penseur azhari, premier directeur de l'université al-Azhar après la loi de 1961 et ministre égyptien des Awqaf en 1962; né le 3 août 1905 et mort le 10 septembre 1982, dates imprimées dans son livre (pp. 11-13)."
  ur: "محمد البہی (1905-1982)، ازہری عالم اور مفکر، 1961 کے قانون کے بعد الازہر یونیورسٹی کے پہلے ڈائریکٹر اور 1962 میں اوقاف کے مصری وزیر؛ 3 اگست 1905 کو پیدا ہوا اور 10 ستمبر 1982 کو انتقال ہوا، ان کی کتاب میں چھپی ہوئی تاریخیں ⁦(صفحہ 11-13)⁩۔"
