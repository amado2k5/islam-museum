summary:
  ar: "محمد البهي (1905–1982م)، من علماء الأزهر ومفكريه في القرن العشرين؛ ولد بقرية أسمانية بالبحيرة في 3 أغسطس 1905م، ونال الدكتوراه من جامعة هامبورج عام 1936م في الشيخ محمد عبده والتربية القومية، ثم عمل أول مدير لجامعة الأزهر بعد قانون 1961م ووزيرًا للأوقاف وشئون الأزهر في سبتمبر 1962م، وتوفي في 10 سبتمبر 1982م {cite:al-islam-fitrat-allah-azhar p. 11} {cite:al-islam-fitrat-allah-azhar p. 12} {cite:al-islam-fitrat-allah-azhar p. 13}. ألّف في نقد الفكر المادي التاريخي {cite:al-islam-fitrat-allah-azhar p. 13}."
  en: "Muhammad al-Bahi (1905-1982), Azhari scholar and thinker, first director of al-Azhar University after the 1961 law and Egyptian minister of Awqaf in 1962; born 3 August 1905 and died 10 September 1982, dates as printed in his book (pp. 11-13)."
