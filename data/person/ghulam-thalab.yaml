label: { ar: "أبو عمر غلام ثعلب اللغوي الزاهد" }
summary:
  ar: "محمد بن عبد الواحد بن أبي هاشم أبو عمر اللغوي الزاهد المعروف بغلام ثعلب؛ سمع أحمد بن عبيد الله الأنباري ودوسة بن سهل الوشاء والكديمي وكان غزير العلم كثير الزهد؛ أملى من حفظه ثلاثين ألف ورقة لغة وجميع كتبه التي في أيدي الناس أملاها بغير تصنيف ولسعة حفظه اتهم بالكذب وجرى له أنه سئل عن معنى القنطرة فأجاب ثم سئل بعد أشهر فذكر السائل متى سأله وماذا أجابه {cite:muntazam-ibn-al-jawzi p. 672-673}."
  en: "Muhammad ibn Abd al-Wahid, Abu Umar 'Ghulam Tha'lab', the philologist-ascetic who dictated thirty thousand sheets of lexicography from memory and, accused for his prodigious recall, recalled months later the very questioner, date and answer to a qantara question {cite:muntazam-ibn-al-jawzi p. 672-673}."
