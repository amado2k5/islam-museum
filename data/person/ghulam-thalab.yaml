id: person/ghulam-thalab
class: person
label: { ar: "أبو عمر غلام ثعلب اللغوي الزاهد" }
summary:
  ar: "محمد بن عبد الواحد بن أبي هاشم أبو عمر اللغوي الزاهد المعروف بغلام ثعلب؛ سمع أحمد بن عبيد الله الأنباري ودوسة بن سهل الوشاء والكديمي وكان غزير العلم كثير الزهد؛ أملى من حفظه ثلاثين ألف ورقة لغة وجميع كتبه التي في أيدي الناس أملاها بغير تصنيف ولسعة حفظه اتهم بالكذب وجرى له أنه سئل عن معنى القنطرة فأجاب ثم سئل بعد أشهر فذكر السائل متى سأله وماذا أجابه {cite:muntazam-ibn-al-jawzi p. 672-673}."
  en: "Muhammad ibn Abd al-Wahid, Abu Umar 'Ghulam Tha'lab', the philologist-ascetic who dictated thirty thousand sheets of lexicography from memory and, accused for his prodigious recall, recalled months later the very questioner, date and answer to a qantara question {cite:muntazam-ibn-al-jawzi p. 672-673}."
  es: "Muhammad ibn Abd al-Wahid, Abu Umar 'Ghulam Tha'lab', el filólogo-asceta que dictó treinta mil hojas de lexicografía de memoria y, acusado por su prodigiosa memoria, recordó meses después al mismo interrogador, la fecha y la respuesta a una pregunta qantara {cite:muntazam-ibn-al-jawzi p. 672-673}."
  fr: "Muhammad ibn Abd al-Wahid, Abu Umar 'Ghulam Tha'lab', le philologue-ascète qui a dicté trente mille feuilles de lexicographie de mémoire et, accusé pour sa mémoire prodigieuse, a rappelé des mois plus tard le questionneur, la date et la réponse à une question de qantara {cite:muntazam-ibn-al-jawzi p. 672-673}."
  ur: "محمد بن عبد الواحد، ابو عمر 'غلام ثعلب'، ماہر فلسفی-سنسنی جس نے حافظے سے لغت کے تیس ہزار ورق مرتب کیے اور اپنی شاندار یاد کا الزام لگایا، مہینوں بعد ایک سوال کنندہ، تاریخ اور قنطارہ کے سوال کا جواب یاد کیا۔ 672-673}۔"
  tr: "Muhammed ibn Abd al-Wahid ibn Ebi Haşim, Ghulam Tha'lab olarak bilinen münzevi dilbilimci Ebu Ömer; Ahmed ibn Ubayd Allah el-Anbari, Dawsa ibn Sahl al-Washa ve al-Kadimi'yi dinledi. Bilgi ve çok fazla münzeviydi. Ezberlediği otuz bin sayfa dil dikte etti ve insanların elindeki tüm kitaplar derlenmeden dikte edildi. Ezberlemesi geniş çapta atfedildi. Yalan söylemekle suçlandı ve köprünün anlamı soruldu ve cevap verildi, birkaç ay sonra soru soranın ne zaman ve ne cevap verdiği soruldu. {Kaynak:Muntazam-ibn-al-Jawzi s. 672-673}."
  id: "Muhammad ibn Abd al-Wahid ibn Abi Hashim, Abu Umar seorang ahli linguistik pertapa yang dikenal sebagai Ghulam Tha'lab; ia mendengar Ahmad ibn Ubayd Allah al-Anbari, Dawsa ibn Sahl al-Washa, dan al-Kadimi. Ia sangat berpengetahuan dan banyak asketisme. Ia mendiktekan tiga puluh ribu halaman bahasa dari hafalannya, dan semua bukunya di tangan orang lain didiktekan tanpa kompilasi. Hafalan itu banyak dikaitkan. Ia dituduh berbohong, dan kebetulan ia ditanya tentang makna jembatan itu dan menjawab, lalu setelah beberapa bulan, ia ditanya kapan dan apa jawaban penanya. {sitasi:Muntazam-ibn-al-Jawzi hlm. 672-673}."
