  - { value: "علي بن محمود بن إبراهيم بن ماخرة أبو الحسن الزوزني", kind: full }
summary:
  ar: "شيخ الصوفية ببغداد، ولد سنة ست وستين وثلاثمائة وأمه ماخرة كانت عجوزًا، صحب أبا الحسن الحصري وروى عن أبي عبد الرحمن السلمي، وصار شيخ الصوفية فنُسب إليه الرباط المقابل لجامع المنصور، وإنما بني للحصري والزوزني صاحب الحصري فنُسب إلى الزوزني، وكان يقول «صحبت ألف شيخ أحدهم الحصري، أحفظ عن كل شيخ حكاية». توفي في رمضان سنة إحدى وخمسين وأربعمائة ودُفن بالرباط {cite:muntazam-ibn-al-jawzi j.8 p.555}."
  en: "Shaykh of the Sufis of Baghdad, companion of Abu'l-Hasan al-Husri and transmitter from Abd al-Rahman al-Sulami; the ribat opposite the Mansur mosque — built for al-Husri — came to bear his name, and he used to say 'I accompanied a thousand shaykhs, the first of them al-Husri, and from each I kept a tale'. Died Ramadan 451, buried in the ribat {cite:muntazam-ibn-al-jawzi j.8 p.555}."
