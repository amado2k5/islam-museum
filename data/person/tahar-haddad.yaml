    note: "No source names a school for him personally, and his own religious position is presented in two opposed ways, both preserved here. The English and French articles present his 1930 book as an argument made from within Islam: a modernist reading of the Qur'an, a call to renewed ijtihad, and proposals drawn, in the French article's account, from what accords with the shari'a; the English article, citing Qantara, calls him an Islamic scholar 'loyal to the Koran'. Against that stand his opponents' verdicts: the same article records that fatwas from the Zitouna establishment declared him a heretic and even an apostate. Those fatwas are judgements by opponents, not a description of his own unbelief, and no two sources describe Haddad himself as having left Islam, so the bar for any other value is not met either. Studying at the Zitouna is not a personal attestation. Under the doubt rule no value is recorded."
