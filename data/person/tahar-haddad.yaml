summary:
  ar: "مؤلف ونقابي ومصلح تونسي (1899–1935)؛ درس الشريعة بجامع الزيتونة وتخرج 1920، وكان من مؤسسي الحركة النقابية التونسية مع محمد علي الحامي، واشتهر بكتابه «امرأتنا في الشريعة والمجتمع» (1930) الداعي إلى تعليم المرأة وإصلاح أحوالها، فتعرض لحملة تكفير وتشهير من المؤسسة المحافظة ونُبذ حتى وفاته."
  en: "Tunisian author, trade unionist and reformer (1899–1935). He studied Islamic law at the Zitouna and graduated in 1920, co-founded the Tunisian labour movement with Mohamed Ali El Hammi, and became known above all for Our Women in the Shari'a and Society (1930), which argued for women's education and legal reform; the conservative establishment answered with takfir fatwas and a smear campaign, and he died ostracised."
  ur: "تونسی مصنف، مزدور رہنما اور مصلح (1899–1935)؛ جامع زیتونہ سے 1920 میں فارغ التحصیل ہوئے، محمد علی الحامی کے ساتھ تونسی مزدور تحریک کے بانیوں میں سے تھے، اور اپنی کتاب «امرأتنا فی الشریعہ والمجتمع» (1930) سے مشہور ہوئے جس میں خواتین کی تعلیم اور قانونی اصلاح کی وکالت کی گئی؛ قدامت پسند حلقوں نے ان کے خلاف تکفیر اور بہتان کی مہم چلائی اور وہ گوشہ نشینی میں وفات پا گئے۔"
