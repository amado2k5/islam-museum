id: person/abu-l-hayja-ibn-hamdan
class: person
label: { ar: "أبو الهيجاء عبد الله بن حمدان", en: "Abu l-Hayja Abd Allah ibn Hamdan", fr: "Abu l-Hayja Abd Allah ibn Hamdan", es: "Abu l-Hayja Abd Allah ibn Hamdan", ur: "ابو الحیا عبد اللہ بن حمدان" }
summary:
  ar: "ابن حمدان بن حمدون؛ حصر عنده مؤنس المظفر في عسكره من أهل الجبل حين استيحش من المقتدر سنة 317هـ وكان معه في خلع المقتدر وأقطعه القاهر مصاف إلى ما بيده من أعمال طريق خراسان وحلوان والدينور وهذان وكنكور وكرمان وشاهان والرافقات ودقوقا وخاني جار ونهاوند والصيمرة والسيروان وماسبذان، ثم خرج بعد إلى الموصل فاستولى عليها {cite:kamil-ibn-al-athir p. 148-150}. وعند ابن الجوزي خُلع عليه سنة تسع وثلاثمائة وقُلّد أعمال الحرب وطريق مكة {cite:muntazam-ibn-al-jawzi p. 449}."
  en: "Ibn Hamdan ibn Hamdun, founder of Hamdanid power; Mu'nis quartered with him in the 317 estrangement, al-Qahir confirmed his iqta's across the Khurasan road towns, and he later seized Mosul {cite:kamil-ibn-al-athir p. 148-150}."
  fr: "Ibn Hamdan ibn Hamdun, fondateur de la puissance hamdanide ; Mu'nis logea chez lui lors de la brouille de 317, al-Qahir confirma ses iqta' dans les villes de la route du Khurasan, et il s'empara plus tard de Mossoul {cite:kamil-ibn-al-athir p. 148-150}."
  es: "Ibn Hamdan ibn Hamdun, fundador del poder hamdaní; Mu'nis se alojó con él en el distanciamiento de 317, al-Qahir confirmó sus iqta en las ciudades de la ruta de Jorasán, y más tarde se apoderó de Mosul {cite:kamil-ibn-al-athir p. 148-150}."
  ur: "ابن حمدان ابن حمدون، ہمدانی طاقت کا بانی؛ معنیس نے 317 میں اس کے ساتھ ملاقات کی، القاہر نے خراسان روڈ کے قصبوں کے اس پار اپنے اکتا کی تصدیق کی، اور بعد میں اس نے موصل پر قبضہ کر لیا۔ 148-150}۔"
  tr: "İbn Hamdan ibn Hamdun; Hicri 317 yılında Muktadir'den ayrıldığında, dağ halkından oluşan ordusuyla Mu'nis el-Muzaffar'ı kuşattı. Muktadir'in tahttan indirilmesinde onunla birlikteydi ve el-Kahir ona, Horasan yolu, Hulvan, Dinav, Hadhan, Kankur, Kerman, Şahan, el-Rafikat, Dakuka, Hani Jar, Nahavand, el-Saymarah, el-Sirvan ve Masabzan bölgelerine ek olarak Musaf'ı da verdi. Sonra Musul'a gitti ve orayı ele geçirdi. {Kaynak: Kamil ibn el-Atir s. 148-150} İbn el-Cevzi'ye göre, kendisine Hicri 309 yılında şeref cübbesi verilmiş ve askeri işler ile Mekke yolunun sorumluluğu kendisine emanet edilmiştir. {cite:muntazam-ibn-al-jawzi s. 449}"
  id: "Ibn Hamdan ibn Hamdun; Mu'nis al-Muzaffar dikepung olehnya dalam pasukannya dari penduduk pegunungan ketika ia berselisih dengan al-Muqtadir pada tahun 317 H. Ia bersamanya dalam penggulingan al-Muqtadir, dan al-Qahir memberinya Musaf sebagai tambahan atas wilayah-wilayah yang dimilikinya di jalan Khurasan, Hulwan, Dinawar, Hadhan, Kankur, Kerman, Shahan, al-Rafiqat, Daquqa, Khani Jar, Nahawand, al-Saymarah, al-Sirwan, dan Masabzan. Kemudian ia pergi ke Mosul dan merebutnya {kutip:kamil-ibn-al-athir hlm. 148-150}. Menurut Ibn al-Jawzi, beliau diberi jubah kehormatan pada tahun 309 H dan dipercayakan dengan urusan militer dan jalan menuju Mekah {kutip:muntazam-ibn-al-jawzi hlm. 449}."
