summary:
  ar: "ابن حمدان بن حمدون؛ حصر عنده مؤنس المظفر في عسكره من أهل الجبل حين استيحش من المقتدر سنة 317هـ وكان معه في خلع المقتدر وأقطعه القاهر مصاف إلى ما بيده من أعمال طريق خراسان وحلوان والدينور وهذان وكنكور وكرمان وشاهان والرافقات ودقوقا وخاني جار ونهاوند والصيمرة والسيروان وماسبذان، ثم خرج بعد إلى الموصل فاستولى عليها {cite:kamil-ibn-al-athir p. 148-150}."
  en: "Ibn Hamdan ibn Hamdun, founder of Hamdanid power; Mu'nis quartered with him in the 317 estrangement, al-Qahir confirmed his iqta's across the Khurasan road towns, and he later seized Mosul {cite:kamil-ibn-al-athir p. 148-150}."
