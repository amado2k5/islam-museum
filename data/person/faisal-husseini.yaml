summary:
  ar: "فيصل عبد القادر الحسيني (17 يوليو 1940 – 31 مايو 2001)، سياسي فلسطيني وُلد في بغداد ابنا للقائد عبد القادر الحسيني، وعمل في منظمة التحرير الفلسطينية منذ تأسيسها، وأسس جمعية الدراسات العربية في القدس سنة 1979، وكان أبرز وجه فلسطيني في القدس الشرقية ووزير السلطة الفلسطينية لشؤون القدس حتى وفاته بأزمة قلبية في الكويت، ودُفن في الخاتونية بالقدس."
  en: "Faisal Abdel Qader al-Husseini (17 July 1940 – 31 May 2001) was a Palestinian politician born in Baghdad, the son of the commander Abd al-Qadir al-Husayni. He worked for the PLO from its founding, founded the Arab Studies Society in Jerusalem in 1979, and was the leading Palestinian figure in East Jerusalem and the Palestinian Authority's Minister for Jerusalem Affairs until his death from a heart attack in Kuwait; he was buried in the Khatuniyya in Jerusalem."
  ur: "فیصل عبد القادر حسینی (17 جولائی 1940ء – 31 مئی 2001ء) فلسطینی سیاست دان تھے جو بغداد میں پیدا ہوئے اور کمانڈر عبد القادر الحسینی کے بیٹے تھے۔ وہ تنظیم آزادی فلسطین کے ابتدائی کارکن، 1979ء میں یروشلم میں عرب اسٹڈیز سوسائٹی کے بانی اور فلسطینی اتھارٹی کے وزیر برائے یروشلم امور رہے؛ کویت میں دل کے دورے سے وفات پائی اور یروشلم کی خاتونیہ میں دفن ہوئے۔"
