summary:
  ar: من سادات قريش من بني جمح؛ قُتل أبوه يوم بدر كافراً، وهرب يوم فتح مكة ثم جاءه ابن عمه عمير بن وهب بأمان من النبي، وحضر حنيناً قبل أن يسلم وأعاره النبي سلاحه، وأعطاه من الغنائم حتى أسلم.
  en: A leader of Quraysh from Banu Jumah; his father was killed at Badr as a disbeliever; he fled on the day Mecca was taken until his cousin Umayr ibn Wahb brought him a promise of safety from the Prophet; he was at Hunayn before he embraced
    Islam, lent the Prophet his weapons, and was given so much of the spoils that he embraced Islam.
