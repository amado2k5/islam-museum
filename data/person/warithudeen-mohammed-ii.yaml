summary:
  ar: "إمام أمريكي، الابن الأكبر للإمام وارث دين محمد الذي حوّل «أمة الإسلام» نحو الإسلام السني السائد بعد 1975. يترأس منظمة «ذي موسك كيرز» الخيرية التي أسسها والده، وتعنى بدروس العربية القرآنية والتثقيف المالي والصحي ومبادرات الأعمال، ويواصل خط والده في التعليم والعبادة على المنهج السني."
  en: "American imam, the eldest son of Imam W. Deen Mohammed, who moved the Nation of Islam toward mainstream Sunni Islam after 1975. He presides over The Mosque Cares, the charitable organisation his father established, which sponsors Qur'anic Arabic classes, financial literacy, health and nutrition sessions and business initiatives, and he continues his father's line of Sunni teaching and worship."
  ur: "امریکی امام، امام وارث دین محمد کے بڑے بیٹے جنہوں نے 1975 کے بعد نیشن آف اسلام کو مرکزی دھارے کے سنی اسلام کی طرف مائل کیا۔ وہ اپنے والد کی قائم کردہ خیراتی تنظیم «دی مسجد کیئرز» کے صدر ہیں جو قرآنی عربی کے دروس، مالی خواندگی، صحت و تغذیہ کے پروگرام اور کاروباری مہمات چلاتی ہے، اور وہ اپنے والد کے سنی تدریس و عبادت کے راستے کو جاری رکھے ہوئے ہیں۔"
  es: "Imán estadounidense, hijo mayor del imán W. Deen Mohammed, quien impulsó a la Nación del Islam hacia el islam suní tradicional después de 1975. Preside The Mosque Cares, la organización benéfica que fundó su padre, la cual patrocina clases de árabe coránico, educación financiera, sesiones sobre salud y nutrición e iniciativas empresariales, y continúa la tradición paterna de enseñanza y culto suní."
  fr: "Imam américain, fils aîné de l'imam W. Deen Mohammed, qui a orienté la Nation of Islam vers l'islam sunnite traditionnel après 1975. Il préside The Mosque Cares, l'organisation caritative fondée par son père, qui finance des cours d'arabe coranique, des ateliers d'éducation financière, des sessions sur la santé et la nutrition, ainsi que des initiatives commerciales, et il perpétue l'enseignement et le culte sunnites de son père."
  tr: "Amerikalı bir imam, Muhammed dininin varisinin en büyük oğludur ve 1975'ten sonra 'İslam Milleti'ni hâkim Sünni İslam'a dönüştürmüştür. Babası tarafından kurulan, Kuran Arapça dersleri, finansal ve sağlık eğitimi ile iş girişimlerine odaklanan 'The Musk Cares' adlı hayır kurumunun başında olup, babasının eğitim ve ibadet yolunu Sünni yöntemiyle sürdürmektedir."
  id: "Seorang imam Amerika, putra sulung dari pewaris agama Muhammad, yang mengubah 'Nation of Islam' menuju Islam Sunni yang berlaku setelah tahun 1975. Ia memimpin organisasi amal 'The Musk Cares,' yang didirikan oleh ayahnya, yang berfokus pada pelajaran bahasa Arab Al-Qur'an, pendidikan keuangan dan kesehatan, serta inisiatif bisnis, melanjutkan perjalanan ayahnya dalam pendidikan dan ibadah mengikuti metode Sunni."
