summary:
  ar: "محمد بن عبد الله بن تومرت المصمودي البربري، أبو عبد الله، المتلقب بالمهدي ويقال له مهدي الموحدين، صاحب الدعوة التي قامت عليها دولة عبد المؤمن بن علي في المغرب، من قبيلة هرغة من المصامدة بجبل السوس؛ من 485هـ الموافقة 1092م إلى 524هـ الموافقة 1130م."
  en: "Muhammad ibn Abdallah ibn Tumart al-Masmudi al-Barbari, Abu Abdallah, who took the title of the Mahdi and is called the Mahdi of the Almohads, founder of the call on which the state of Abd al-Mumin ibn Ali in the Maghreb was built, of the Hargha of the Masmuda in the Sous mountains; 485 AH, 1092 CE, to 524 AH, 1130 CE."
