summary:
  ar: "محمد بن عبد الله بن تومرت المصمودي البربري، أبو عبد الله، المتلقب بالمهدي ويقال له مهدي الموحدين، صاحب الدعوة التي قامت عليها دولة عبد المؤمن بن علي في المغرب، من قبيلة هرغة من المصامدة بجبل السوس؛ من 485هـ الموافقة 1092م إلى 524هـ الموافقة 1130م."
  en: "Muhammad ibn Abdallah ibn Tumart al-Masmudi al-Barbari, Abu Abdallah, who took the title of the Mahdi and is called the Mahdi of the Almohads, founder of the call on which the state of Abd al-Mumin ibn Ali in the Maghreb was built, of the Hargha of the Masmuda in the Sous mountains; 485 AH, 1092 CE, to 524 AH, 1130 CE."
  es: "Muhammad ibn Abdallah ibn Tumart al-Masmudi al-Barbari, Abu Abdallah, quien tomó el título de Mahdi y es llamado el Mahdi de los Almohades, fundador del llamamiento sobre el cual se construyó el estado de Abd al-Mumin ibn Ali en el Magreb, de la Hargha de la Masmuda en las montañas Sous; 485 AH, 1092 CE, a 524 AH, 1130 CE."
  fr: "Muhammad ibn Abdallah ibn Tumart al-Masmudi al-Barbari, Abu Abdallah, qui prit le titre de Mahdi et est appelé le Mahdi des Almohades, fondateur de l'appel sur lequel fut construit l'État d'Abd al-Mumin ibn Ali au Maghreb, de la Hargha des Masmuda dans les montagnes de Sous; 485 AH, 1092 CE, à 524 AH, 1130 CE."
  ur: "محمد بن عبداللہ ابن تمرت المسمودی البربری، ابو عبداللہ، جنہوں نے مہدی کا لقب اختیار کیا اور الموحدث کا مہدی کہلاتا ہے، اس دعوت کا بانی جس پر مغرب میں عبد المومن ابن علی کی ریاست قائم ہوئی، سوس پہاڑوں میں مسمودہ کے ہرغہ کا؛ 485 ہجری، 1092 عیسوی، 524 ہجری، 1130 عیسوی۔"
  tr: "Muhammed bin Abdullah ibn Tumart el-Mesmudi el-Barbari, Ebu Abdullah, lakabı el-Mehdi ve Mahdi el-Muvahhidin olarak anılır, Fas'ta Abdül-Mümin ibn Ali devletinin kurulmasına yol açan çağrının kurucusudur; 485 H.'den, 1092'ye karşılık gelir, 524 H.Y. 1130'a karşılık gelir."
  id: "Muhammad ibn Abdullah ibn Tumart al-Masmudi al-Barbari, Abu Abdullah, dijuluki al-Mahdi dan disebut Mahdi al-Muwahhidin, pendiri panggilan yang menjadi dasar pendirian negara Abd al-Mu'min ibn Ali di Maroko, dari suku Hargha Masamada di Jabal al-Sous; dari tahun 485 H, setara dengan 1092 M, hingga 524 H, setara dengan 1130 M."
