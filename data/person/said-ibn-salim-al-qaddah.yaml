summary:
  ar: "سعيد بن سالم القداح، أبو عثمان، أصله من خراسان، ويقال من الكوفة، سكن مكة، روى عن الثوري وابن جريج وغيرهما، وروى عنه علي بن حرب وابن عيينة والشافعي. قال ابن عدي: حسن الحديث، صدوق لا بأس به، ويقال إنه كان يرى الإرجاء. كان يفتي بمكة ويذهب إلى قول أهل العراق. توفي قبل سنة 200هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  en: "Said ibn Salim al-Qaddah, Abu Uthman, from Khurasan or, it is said, Kufa, who settled in Mecca. He transmitted from al-Thawri and Ibn Jurayj, and Ali ibn Harb, Ibn Uyayna and al-Shafi'i transmitted from him. Ibn Adi called him good in hadith, truthful and acceptable, and it is said he held the Murji'a view. He gave fatwas in Mecca and followed the view of the Iraqi jurists. He died before 200 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
