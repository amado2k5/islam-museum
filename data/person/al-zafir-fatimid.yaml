id: person/al-zafir-fatimid
class: person
label:
  ar: الظافر بالله إسماعيل بن الحافظ
  en: al-Zafir bi-Llah Isma'il ibn al-Hafiz
  fr: "al-Zafir bi-Llah Isma'il ibn al-Hafiz"
  es: "al-Zafir bi-Llah Isma'il ibn al-Hafiz"
  ur: "الظفیر باللہ اسماعیل بن الحافظ"
summary:
  ar: ثاني عشر ملوك الدولة العبيدية، أقيم بعد أبيه الحافظ سنة أربع وأربعين، وقتل سنة تسع وأربعين وأقاموا ابنه الفائز عيسى
    صبياً صغيراً ووهى أمر المصريين {cite:tarikh-khulafa-minhaj-1434 p. 673-674}.
  en: Twelfth Ubaydid caliph, succeeding his father in 544; killed in 549, his boy al-Fa'iz raised as Egypt's power failed
    {cite:tarikh-khulafa-minhaj-1434 p. 673-674}.
  fr: "Douzième calife d'Ubaydid, succédant à son père en 544 ; tué en 549, son fils al-Faiz a été élevé comme puissance de l'Égypte a échoué {cite:tarikh-khulafa-minhaj-1434 p. 673-674}."
  es: "Duodécimo califa Ubaydid, sucedió a su padre en 544; fue asesinado en 549, su hijo al-Fa'iz fue criado cuando el poder de Egipto se desvaneció {cite:tarikh-khulafa-minhaj-1434 p. 673-674}."
  ur: "544 میں اپنے والد کی جانشینی بارہویں عبیدید خلیفہ؛ 549 میں مارا گیا، اس کا لڑکا الفیض مصر کی طاقت کے ناکام ہونے پر پرورش پا گیا۔ 673-674}۔"
