summary:
  ar: "صاحب مكة، دعا إلى نفسه وتلقب بالراشد بالله وسلم عليه بالخلافة فانزعج صاحب مصر ثم ضعف أمره وعاد إلى طاعة الحاكم العبيدي {cite:tarikh-khulafa-minhaj-1434 p. 635}. يورد ابن الجوزي خروجه في حوادث سنة إحدى وأربعمائة فيلقبه بالراشد بالله ويذكر أنه لم يحج في تلك السنة أحد من العراق — وقد قدّمه السيوطي إلى سنة إحدى وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.256}."
  en: "Mecca's sharif; he made the caliphal claim in 381 as al-Rashid bi'llah — shaking Egypt's lord — then flagged and returned to the Ubaydid al-Aziz's obedience {cite:tarikh-khulafa-minhaj-1434 p. 635}."
