class: person
label: { ar: "أبو الفتوح الحسن بن جعفر العلوي", en: "Abu al-Futuh al-Hasan ibn Ja'far al-Alawi", fr: "Abu al-Futuh al-Hasan ibn Ja'far al-Alawi", es: "Abu al-Futuh al-Hasan ibn Ja'far al-Alawi", ur: "ابو الفتوح الحسن ابن جعفر علوی" }
summary:
  ar: "صاحب مكة، دعا إلى نفسه وتلقب بالراشد بالله وسلم عليه بالخلافة فانزعج صاحب مصر ثم ضعف أمره وعاد إلى طاعة الحاكم العبيدي {cite:tarikh-khulafa-minhaj-1434 p. 635}. يورد ابن الجوزي خروجه في حوادث سنة إحدى وأربعمائة فيلقبه بالراشد بالله ويذكر أنه لم يحج في تلك السنة أحد من العراق — وقد قدّمه السيوطي إلى سنة إحدى وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.256}."
  en: "Mecca's sharif; he made the caliphal claim in 381 as al-Rashid bi'llah — shaking Egypt's lord — then flagged and returned to the Ubaydid al-Aziz's obedience {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  fr: "Le chérif de La Mecque ; il revendiqua le califat en 381 sous le nom d'al-Rashid bi'llah — ébranlant le maître de l'Égypte — puis faiblit et revint à l'obéissance de l'Ubaydide al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  es: "Sharif de La Meca; hizo la reclamación califal en 381 como al-Rashid bi'llah — sacudiendo al señor de Egipto — luego flaqueó y regresó a la obediencia de Ubaydid al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  ur: "مکہ شریف؛ اس نے 381 میں خلافت کا دعویٰ الرشید باللہ کے طور پر کیا - مصر کے رب کو ہلاتے ہوئے - پھر جھنڈا لگایا اور عبید العزیز کی اطاعت کی طرف واپس آیا۔ 635}۔"
  tr: "Mekke hükümdarı kendini halife ilan etti ve kendisine \"Allah tarafından doğru yola yönlendirilmiş\" dedi ve onu halife unvanıyla selamladı. Mısır hükümdarı endişelendi, ancak gücü zayıfladı ve Fatımi halifesine itaat etmeye geri döndü. {kaynak:tarikh-khulafa-minhaj-1434 s. 635}. İbn el-Cevzi, onun ayaklanmasından Hicri 401 yılındaki olaylar arasında bahseder, onu \"Allah tarafından doğru yola yönlendirilmiş\" olarak adlandırır ve o yıl Irak'tan kimsenin Hac yapmadığını belirtir; el-Suyuti ise bunu Hicri 481 yılının başlarına yerleştirir. {kaynak:muntazam-ibn-al-jawzi j.7 s.256}."
  id: "Penguasa Mekah memproklamirkan dirinya sebagai Khalifah dan menyebut dirinya sebagai Yang Diberi Petunjuk oleh Allah, dan menyambutnya dengan gelar Khalifah. Penguasa Mesir merasa khawatir, tetapi kekuasaannya melemah, dan ia kembali taat kepada Khalifah Fatimiyah. {cite:tarikh-khulafa-minhaj-1434 p. 635}. Ibn al-Jawzi menyebutkan pemberontakannya dalam peristiwa tahun 401 H, menyebutnya sebagai Yang Diberi Petunjuk oleh Allah, dan menyatakan bahwa tidak seorang pun dari Irak melaksanakan ibadah haji pada tahun itu—al-Suyuti menempatkannya lebih awal pada tahun 481 H. {cite:muntazam-ibn-al-jawzi j.7 p.256}."
