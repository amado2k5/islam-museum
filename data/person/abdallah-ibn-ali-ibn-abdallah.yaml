id: person/abdallah-ibn-ali-ibn-abdallah
class: person
label: { ar: "عبد الله بن علي", en: "Abdallah ibn Ali", fr: "Abdallah ibn Ali", es: "Abdallah ibn Ali", ur: "عبداللہ ابن علی" }
summary:
  ar: "عبد الله بن علي بن عبد الله بن العباس العميد العباسي؛ عند البلاذري كان مقيماً بالبصرة وأبو الأسد مولى أمير المؤمنين هو الذي أدخله الكوفة؛ وكان هارباً من المنصور عند أخيه سليمان بالبصرة فاجتمع أهلها إلى بابه وصاحوا يا أمير المؤمنين انزل إلينا نبايعك فكفهم سليمان وفرقهم. وعند المسعودي هدم قصر مروان بحران وقد أنفق عليه عشرة آلاف ألف درهم، ونزل دمشق فحاصرها وقتل خلقاً كثيراً ونزل نهر أبي فطرس فقتل من بني أمية بضعاً وثمانين رجلاً، وأتاه يزيد بن معاوية وعبد الجبار بن يزيد بن عبد الملك فحملهما إلى السفاح فقتلهما وصلبهما بالحيرة {cite:muruj-al-dhahab p. 232}، وخالف على المنصور فدعا إلى نفسه من كان معه من أهل الشام زاعماً أن السفاح جعل الخلافة لمن انتدب لقتل مروان، فصبر هو وأبو مسلم شهوراً على حرب الخنادق بدير الأعور ثم انهزم إلى البصرة عند أخيه سليمان بن علي {cite:muruj-al-dhahab p. 279}، وأقام في محبسه تسع سنين فحوله المنصور إلى عيسى بن موسى وآمره بقتله فاستشار ابن أبي ليلى وابن شبرمة فأبى ودفعه إلى أبي الأزهر فخنقه وجارية له وهدم عليهما البيت فدفن بمقبرة أبي سويد بباب الشام {cite:muruj-al-dhahab p. 293-294}"
  en: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, the Abbasid commander; in al-Baladhuri he stayed at Basra, and Abu al-Asad — al-Mansur's mawla — was the one who brought him into Kufa; a fugitive from al-Mansur at his brother Sulayman's in Basra, the crowd cried at his door 'Commander of the Faithful, come down, we give you bay'a' till Sulayman dispersed them."
  fr: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, le commandant abbasside ; chez al-Baladhuri, il résida à Bassora, et Abu al-Asad — client d'al-Mansur — fut celui qui le fit entrer à Koufa ; fugitif devant al-Mansur chez son frère Sulayman à Bassora, la foule criait à sa porte « Commandeur des croyants, descends, nous te prêtons allégeance » jusqu'à ce que Sulayman la disperse."
  es: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, el comandante abasí; en al-Baladhuri se hospedó en Basora, y Abu al-Asad — mawla de al-Mansur — fue quien lo llevó a Kufa; fugitivo de al-Mansur en casa de su hermano Sulayman en Basora, la multitud gritó a su puerta: «¡Comandante de los Creyentes, baja, te damos bay'a!» hasta que Sulayman los dispersó."
  ur: "عبداللہ ابن علی ابن عبداللہ ابن العباس، عباسی کمانڈر؛ البلادوری میں اس نے بصرہ میں قیام کیا، اور ابو الاسد - المنصور کا مولا - وہ تھا جو اسے کوفہ لے آیا۔ بصرہ میں اپنے بھائی سلیمان کے پاس المنصور سے ایک مفرور، ہجوم نے اس کے دروازے پر پکارا، 'وفاداروں کے کمانڈر، نیچے آؤ، ہم آپ کی بیعت کرتے ہیں' یہاں تک کہ سلیمان نے انہیں منتشر کردیا۔"
