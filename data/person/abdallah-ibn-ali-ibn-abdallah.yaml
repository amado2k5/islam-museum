id: person/abdallah-ibn-ali-ibn-abdallah
class: person
label: { ar: "عبد الله بن علي", en: "Abdallah ibn Ali" }
summary:
  ar: "عبد الله بن علي بن عبد الله بن العباس العميد العباسي؛ عند البلاذري كان مقيماً بالبصرة وأبو الأسد مولى أمير المؤمنين هو الذي أدخله الكوفة؛ وكان هارباً من المنصور عند أخيه سليمان بالبصرة فاجتمع أهلها إلى بابه وصاحوا يا أمير المؤمنين انزل إلينا نبايعك فكفهم سليمان وفرقهم.، وعند المسعودي هدم قصر مروان بحران وقد أنفق عليه عشرة آلاف ألف درهم، ونزل دمشق فحاصرها وقتل خلقاً كثيراً ونزل نهر أبي فطرس فقتل من بني أمية بضعاً وثمانين رجلاً، وأتاه يزيد بن معاوية وعبد الجبار بن يزيد بن عبد الملك فحملهما إلى السفاح فقتلهما وصلبهما بالحيرة {cite:muruj-al-dhahab p. 232}"
  en: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, the Abbasid commander; in al-Baladhuri he stayed at Basra, and Abu al-Asad — al-Mansur's mawla — was the one who brought him into Kufa; a fugitive from al-Mansur at his brother Sulayman's in Basra, the crowd cried at his door 'Commander of the Faithful, come down, we give you bay'a' till Sulayman dispersed them."
