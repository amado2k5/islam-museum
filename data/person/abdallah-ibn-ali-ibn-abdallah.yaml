id: person/abdallah-ibn-ali-ibn-abdallah
class: person
label: { ar: "عبد الله بن علي", en: "Abdallah ibn Ali", fr: "Abdallah ibn Ali", es: "Abdallah ibn Ali", ur: "عبداللہ ابن علی" }
summary:
  ar: "عبد الله بن علي بن عبد الله بن العباس العميد العباسي؛ عند البلاذري كان مقيماً بالبصرة وأبو الأسد مولى أمير المؤمنين هو الذي أدخله الكوفة؛ وكان هارباً من المنصور عند أخيه سليمان بالبصرة فاجتمع أهلها إلى بابه وصاحوا يا أمير المؤمنين انزل إلينا نبايعك فكفهم سليمان وفرقهم. وعند المسعودي هدم قصر مروان بحران وقد أنفق عليه عشرة آلاف ألف درهم، ونزل دمشق فحاصرها وقتل خلقاً كثيراً ونزل نهر أبي فطرس فقتل من بني أمية بضعاً وثمانين رجلاً، وأتاه يزيد بن معاوية وعبد الجبار بن يزيد بن عبد الملك فحملهما إلى السفاح فقتلهما وصلبهما بالحيرة {cite:muruj-al-dhahab p. 232}، وخالف على المنصور فدعا إلى نفسه من كان معه من أهل الشام زاعماً أن السفاح جعل الخلافة لمن انتدب لقتل مروان، فصبر هو وأبو مسلم شهوراً على حرب الخنادق بدير الأعور ثم انهزم إلى البصرة عند أخيه سليمان بن علي {cite:muruj-al-dhahab p. 279}، وأقام في محبسه تسع سنين فحوله المنصور إلى عيسى بن موسى وآمره بقتله فاستشار ابن أبي ليلى وابن شبرمة فأبى ودفعه إلى أبي الأزهر فخنقه وجارية له وهدم عليهما البيت فدفن بمقبرة أبي سويد بباب الشام {cite:muruj-al-dhahab p. 293-294}"
  en: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, the Abbasid commander; in al-Baladhuri he stayed at Basra, and Abu al-Asad — al-Mansur's mawla — was the one who brought him into Kufa; a fugitive from al-Mansur at his brother Sulayman's in Basra, the crowd cried at his door 'Commander of the Faithful, come down, we give you bay'a' till Sulayman dispersed them."
  fr: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, le commandant abbasside ; chez al-Baladhuri, il résida à Bassora, et Abu al-Asad — client d'al-Mansur — fut celui qui le fit entrer à Koufa ; fugitif devant al-Mansur chez son frère Sulayman à Bassora, la foule criait à sa porte « Commandeur des croyants, descends, nous te prêtons allégeance » jusqu'à ce que Sulayman la disperse."
  es: "Abdallah ibn Ali ibn Abdallah ibn al-Abbas, el comandante abasí; en al-Baladhuri se hospedó en Basora, y Abu al-Asad — mawla de al-Mansur — fue quien lo llevó a Kufa; fugitivo de al-Mansur en casa de su hermano Sulayman en Basora, la multitud gritó a su puerta: «¡Comandante de los Creyentes, baja, te damos bay'a!» hasta que Sulayman los dispersó."
  ur: "عبداللہ ابن علی ابن عبداللہ ابن العباس، عباسی کمانڈر؛ البلادوری میں اس نے بصرہ میں قیام کیا، اور ابو الاسد - المنصور کا مولا - وہ تھا جو اسے کوفہ لے آیا۔ بصرہ میں اپنے بھائی سلیمان کے پاس المنصور سے ایک مفرور، ہجوم نے اس کے دروازے پر پکارا، 'وفاداروں کے کمانڈر، نیچے آؤ، ہم آپ کی بیعت کرتے ہیں' یہاں تک کہ سلیمان نے انہیں منتشر کردیا۔"
  tr: "Abdullah ibn Ali ibn Abdullah ibn el-Abbas el-Amid el-Abbasi; el-Baladhuri'ye göre Basra'da ikamet ediyordu ve Müminlerin Emiri'nin azatlı kölesi Ebu el-Esad onu Kufa'ya getiren kişiydi. El-Mansur'dan Basra'daki kardeşi Süleyman'ın yanına kaçmıştı ve Basra halkı kapısına toplanıp \"Ey Müminlerin Emiri, yanımıza gel de sana biat edelim!\" diye bağırmıştı. Ancak Süleyman onları durdurup dağıtmıştı. El-Mas'udi'ye göre, on milyon dirhem harcanmış olan Harran'daki Mervan sarayını yıktırmıştı. Şam'a inmiş, şehri kuşatmış ve birçok insanı öldürmüştü. Ebu Futrus Nehri'ne inmiş ve Beni Umayya'dan seksenin üzerinde adamı öldürmüştü. Yezid ibn Muaviye ve Abdülcebber ibn Yezid ibn Abdülmalik ona geldiler, o da onları Saffe'ye götürdü; Saffe onları öldürdü ve Hira'da çarmıha gerdi. 232} Ve Mansur'a isyan etti, bu yüzden Saffe'nin Mervan'ı öldürmeye gönüllü olan herkese halifelik verdiğini iddia ederek Suriye halkından yanındakileri yanına çağırdı. Böylece o ve Ebu Müslim, Deyr el-Evver'de aylarca siper savaşına katlandılar, sonra yenildi ve Basra'ya, kardeşi Süleyman ibn Ali'nin yanına gitti. {Kaynak: Muruj-al-Dhahab s. 279} ve dokuz yıl hapiste kaldı. Sonra Mansur onu İsa ibn Musa'ya teslim etti ve onu öldürmesini emretti. Bunun üzerine İbn Abi Leyla ve İbn Şubrume'ye danıştı, ancak onlar reddedip onu Ebu'l-Azhar'a teslim ettiler. Ebu'l-Azhar onu ve cariyesini boğarak öldürdü ve evlerini yıktı. Böylece Bab el-Şam'daki Ebu Suveyd mezarlığına gömüldü. {kaynak: Muruj el-Dhahab s. 293-294}"
  id: "Abdullah ibn Ali ibn Abdullah ibn al-Abbas al-Amid al-Abbasi; menurut al-Baladhuri, ia tinggal di Basra, dan Abu al-Asad, orang yang dibebaskan oleh Amirul Mukminin, adalah orang yang membawanya ke Kufa. Ia telah melarikan diri dari al-Mansur kepada saudaranya Sulaiman di Basra, dan penduduknya berkumpul di depan pintunya dan berteriak, \"Wahai Amirul Mukminin, turunlah kepada kami agar kami dapat berbaiat kepadamu!\" Tetapi Sulaiman menahan mereka dan membubarkan mereka. Menurut al-Mas'udi, ia menghancurkan istana Marwan di Harran, yang telah menghabiskan sepuluh juta dirham. Ia turun ke Damaskus, mengepungnya, dan membunuh banyak orang. Ia turun ke Sungai Abu Futrus dan membunuh lebih dari delapan puluh orang dari Bani Umayyah. Yazid ibn Mu'awiya dan Abd al-Jabbar ibn Yazid ibn Abd al-Malik datang kepadanya, lalu ia membawa mereka kepada al-Saffah, yang membunuh mereka dan menyalibkan mereka di al-Hira. 232}, dan ia memberontak terhadap Al-Mansur, lalu ia memanggil orang-orang yang bersamanya dari penduduk Suriah, dengan alasan bahwa Al-Saffah telah menjadikan kekhalifahan bagi siapa pun yang sukarela membunuh Marwan. Maka ia dan Abu Muslim bertahan selama berbulan-bulan dalam perang parit di Dayr Al-Awar, kemudian ia dikalahkan dan pergi ke Basra kepada saudaranya Sulayman ibn Ali {kutip:muruj-al-dhahab hlm. 279}, dan ia tinggal di penjara selama sembilan tahun. Kemudian Al-Mansur memindahkannya kepada Isa ibn Musa dan memerintahkannya untuk membunuhnya. Maka ia meminta nasihat kepada Ibn Abi Layla dan Ibn Shubrumah, tetapi mereka menolak dan menyerahkannya kepada Abu Al-Azhar, yang mencekiknya dan seorang budak perempuan miliknya serta menghancurkan rumah tempat mereka tinggal. Maka ia dimakamkan di pemakaman Abu Suwayd di Bab Al-Sham {cite:muruj-al-dhahab p. 293-294}"
