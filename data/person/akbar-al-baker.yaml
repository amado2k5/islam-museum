summary:
  ar: "أكبر الباكر (وُلد سنة 1962) رجل أعمال قطري كان الرئيس التنفيذي لمجموعة الخطوط الجوية القطرية من 1997 حتى 5 نوفمبر 2023، وأعاد إطلاق الشركة وبنى شبكتها العالمية وأساطيلها، وقاد تطوير مطار حمد الدولي الذي افتُتح سنة 2014. ورأس هيئة قطر للسياحة حتى أكتوبر 2023، وترأس مجلس إدارة تحالف ون وورلد سنة 2021، وعُرف بأسلوبه الصريح في مواجهة منافسيه وشركات صناعة الطائرات."
  en: "Akbar Al Baker (born 1962) is a Qatari businessman who was Group CEO of Qatar Airways from 1997 until 5 November 2023, relaunching the airline and building its global network and fleets, and who led the development of Hamad International Airport, which opened in 2014. He chaired Qatar Tourism until October 2023 and the Oneworld alliance's governing board from 2021, and was known for an outspoken style in disputes with rivals and aircraft manufacturers."
  ur: "اکبر الباکر (پیدائش 1962) قطری کاروباری شخصیت ہیں جو 1997 سے 5 نومبر 2023 تک قطر ایئرویز کے گروپ سی ای او رہے، انھوں نے ایئرلائن کو دوبارہ لانچ کرکے اس کا عالمی نیٹ ورک اور بیڑے بنائے، اور حمد انٹرنیشنل ایئرپورٹ کی تعمیر کی قیادت کی جو 2014 میں کھلا۔ وہ اکتوبر 2023 تک قطر ٹورازم کے چیئرمین اور 2021 سے ون ورلڈ الائنس کے گورننگ بورڈ کے چیئرمین رہے، اور حریفوں اور طیارہ ساز کمپنیوں سے تنازعات میں اپنے بے باک انداز کے لیے جانے جاتے تھے۔"
