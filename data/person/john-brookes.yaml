summary:
  ar: "جون بروكس مصمم بساتين، ألّف كتاب «جنان الفردوس: تاريخ البساتين الإسلامية الكبرى وتصميمها» الصادر في لندن سنة 1987، وهو عرض مصور لتاريخ البستان الإسلامي من الأندلس إلى فارس والهند المغولية. لا تتوافر في سجلات المتحف سيرة له، فتاريخ ميلاده ووفاته ومكانهما غير معروفة هنا {cite:brookes-gardens-of-paradise-1987}."
  en: "John Brookes was a garden designer and the author of Gardens of Paradise: The History and Design of the Great Islamic Gardens (London, 1987), an illustrated survey of the Islamic garden from al-Andalus to Persia and Mughal India. The museum holds no biography of him, so his dates and places of birth and death are unknown here {cite:brookes-gardens-of-paradise-1987}."
  ur: "جان بروکس باغات کے ڈیزائنر تھے اور «جنانِ فردوس: عظیم اسلامی باغات کی تاریخ اور ڈیزائن» کے مصنف، جو 1987ء میں لندن میں شائع ہوئی، اور اندلس سے فارس اور مغل ہندوستان تک اسلامی باغ کا مصور جائزہ ہے۔ عجائب گھر کے پاس ان کی کوئی سوانح نہیں، اس لیے ان کی پیدائش اور وفات کی تاریخیں اور مقامات یہاں معلوم نہیں {cite:brookes-gardens-of-paradise-1987}."
  es: "John Brookes fue diseñador de jardines y autor de Jardines del Paraíso: Historia y diseño de los grandes jardines islámicos (Londres, 1987), un estudio ilustrado del jardín islámico desde al-Ándalus hasta Persia y la India mogol. El museo no posee ninguna biografía suya, por lo que se desconocen sus fechas y lugares de nacimiento y fallecimiento {cite:brookes-gardens-of-paradise-1987}."
  fr: "John Brookes était un paysagiste et l'auteur de *Gardens of Paradise: The History and Design of the Great Islamic Gardens* (Londres, 1987), un ouvrage illustré présentant les jardins islamiques d'al-Andalus à la Perse et à l'Inde moghole. Le musée ne possède aucune biographie de lui; ses dates et lieux de naissance et de décès sont donc inconnus."
  tr: "Bahçe tasarımcısı John Brooks, 1987'de Londra'da yayımlanan 'Cennet Bahçeleri: Büyük İslami Bahçelerin Tarihi ve Tasarımı' adlı kitabı yazmıştır. Bu kitap, İslam bahçesinin Endülüs'ten Pers'e ve Moğol Hindistan'ına kadar olan tarihini konu alan görsel bir sergidir. Müze kayıtlarında biyografisi yoktur; doğum ve ölüm tarihleri ile yeri burada bilinmemektedir {cite:Brookes-gardens-of-paradise-1987}."
  id: "John Brooks, seorang perancang kebun buah, menulis buku 'Gardens of Paradise: The History and Design of the Great Islamic Gardens' yang diterbitkan di London pada tahun 1987. Ini adalah pameran bergambar tentang sejarah taman Islam dari Andalusia hingga Persia dan India Mongol. Tidak ada biografi dirinya dalam catatan museum; tanggal dan tempat kelahiran serta kematiannya tidak diketahui di sini {cite:Brookes-gardens-of-paradise-1987}."
