summary:
  ar: "جون بروكس مصمم بساتين، ألّف كتاب «جنان الفردوس: تاريخ البساتين الإسلامية الكبرى وتصميمها» الصادر في لندن سنة 1987، وهو عرض مصور لتاريخ البستان الإسلامي من الأندلس إلى فارس والهند المغولية. لا تتوافر في سجلات المتحف سيرة له، فتاريخ ميلاده ووفاته ومكانهما غير معروفة هنا {cite:brookes-gardens-of-paradise-1987}."
  en: "John Brookes was a garden designer and the author of Gardens of Paradise: The History and Design of the Great Islamic Gardens (London, 1987), an illustrated survey of the Islamic garden from al-Andalus to Persia and Mughal India. The museum holds no biography of him, so his dates and places of birth and death are unknown here {cite:brookes-gardens-of-paradise-1987}."
  ur: "جان بروکس باغات کے ڈیزائنر تھے اور «جنانِ فردوس: عظیم اسلامی باغات کی تاریخ اور ڈیزائن» کے مصنف، جو 1987ء میں لندن میں شائع ہوئی، اور اندلس سے فارس اور مغل ہندوستان تک اسلامی باغ کا مصور جائزہ ہے۔ عجائب گھر کے پاس ان کی کوئی سوانح نہیں، اس لیے ان کی پیدائش اور وفات کی تاریخیں اور مقامات یہاں معلوم نہیں {cite:brookes-gardens-of-paradise-1987}."
