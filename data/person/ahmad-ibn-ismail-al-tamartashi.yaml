summary:
  ar: أحمد بن إسماعيل بن محمد، ظهير الدين أبو محمد، وقيل أبو العباس، التمرتاشي الحنفي الخوارزمي، نسبة إلى تمرتاش قرية من قرى خوارزم، ومفتي خوارزم. من تصانيفه فتاوى التمرتاشي، وشرح الجامع الصغير، وكتاب التراويح. وتوفي في حدود سنة 600 هـ بحسب عنوان المصدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
  en: Ahmad ibn Ismail ibn Muhammad, Zahir al-Din Abu Muhammad, or Abu al-Abbas, al-Tamartashi, a Hanafi of Khwarazm, named after the village of Tamartash in Khwarazm, and mufti of Khwarazm. His works include the Fatawa al-Tamartashi, a commentary on the Jami' al-Saghir, and a book on the Tarawih. The heading places his death around 600 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
  fr: "Ahmad ibn Ismail ibn Muhammad, Zahir al-Din Abu Muhammad ou Abu al-Abbas al-Tamartashi, hanafite du Khwarezm nommé d'après le village de Tamartash et mufti du Khwarezm. Ses œuvres comprennent les Fatawa al-Tamartashi, un commentaire du Jami' al-Saghir et un livre sur les tarawih. Le titre situe sa mort vers 600 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}"
  ur: احمد بن اسماعیل بن محمد، ظہیر الدین ابو محمد، یا ابو العباس، تمرتاشی حنفی خوارزمی، جو خوارزم کے گاؤں تمرتاش کی طرف منسوب ہیں اور خوارزم کے مفتی تھے۔ تصانیف میں فتاوی التمرتاشی، جامع صغیر کی شرح، اور کتاب التراویح شامل ہیں۔ عنوان کے مطابق وفات 600 ہجری کے لگ بھگ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
  es: "Ahmad ibn Ismail ibn Muhammad, Zahir al-Din Abu Muhammad, o Abu al-Abbas, al-Tamartashi, un hanafi de Khwarazm, que lleva el nombre de la aldea de Tamartash en Khwarazm, y mufti de Khwarazm. Sus obras incluyen Fatawa al-Tamartashi, un comentario sobre Jami' al-Saghir y un libro sobre Tarawih. El encabezamiento sitúa su muerte alrededor del año 600 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}"
  tr: "Ahmed ibn İsmail ibn Muhammed, Zahir al-Din Ebu Muhammed, diğer adıyla Ebu el-Abbas, el-Tamartashi el-Hanefi el-Harezmi, Harezm'deki Tamartash köyünden adını almıştır ve Harezm Müftüsü'dür. Eserleri arasında el-Tamartashi'nin Fetvaları, el-Cami' el-Sağrir üzerine bir tefsir ve Teravih namazları üzerine bir kitap bulunmaktadır. Kaynağa göre, Hicri 600 yılı civarında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5496}"
  id: "Ahmad ibn Ismail ibn Muhammad, Zahir al-Din Abu Muhammad, juga dikenal sebagai Abu al-Abbas, al-Tamartashi al-Hanafi al-Khwarizmi, dinamai menurut Tamartash, sebuah desa di Khwarazm, dan Mufti Khwarazm. Di antara karya-karyanya adalah Fatwa al-Tamartashi, sebuah komentar atas al-Jami' al-Saghir, dan sebuah buku tentang salat Tarawih. Ia meninggal sekitar tahun 600 H, menurut sumber tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}"
