summary:
  ar: أحمد بن إسماعيل بن محمد، ظهير الدين أبو محمد، وقيل أبو العباس، التمرتاشي الحنفي الخوارزمي، نسبة إلى تمرتاش قرية من قرى خوارزم، ومفتي خوارزم. من تصانيفه فتاوى التمرتاشي، وشرح الجامع الصغير، وكتاب التراويح. وتوفي في حدود سنة 600 هـ بحسب عنوان المصدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
  en: Ahmad ibn Ismail ibn Muhammad, Zahir al-Din Abu Muhammad, or Abu al-Abbas, al-Tamartashi, a Hanafi of Khwarazm, named after the village of Tamartash in Khwarazm, and mufti of Khwarazm. His works include the Fatawa al-Tamartashi, a commentary on the Jami' al-Saghir, and a book on the Tarawih. The heading places his death around 600 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
  ur: احمد بن اسماعیل بن محمد، ظہیر الدین ابو محمد، یا ابو العباس، تمرتاشی حنفی خوارزمی، جو خوارزم کے گاؤں تمرتاش کی طرف منسوب ہیں اور خوارزم کے مفتی تھے۔ تصانیف میں فتاوی التمرتاشی، جامع صغیر کی شرح، اور کتاب التراویح شامل ہیں۔ عنوان کے مطابق وفات 600 ہجری کے لگ بھگ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5496}
