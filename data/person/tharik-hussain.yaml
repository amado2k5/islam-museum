summary:
  ar: كاتب رحلات وصحفي بريطاني بنغلاديشي الأصل؛ يكتب عن تراث الإسلام في أوروبا والغرب، من كتبه «مآذن في الجبال» عن البلقان و«أرض الأطلس المرجانية»، وعمل في الإذاعة البريطانية واكتشف مساجد نادرة في أوروبا.
  en: British-Bangladeshi travel writer and journalist; his books on Europe's Muslim heritage include Minarets in the Mountains on the Balkans and A White Mosque in the Mountains?, and he has reported for
    the BBC and uncovered rare mosques across Europe.
  ur: برطانوی بنگلہ دیشی نژاد سیاحتی مصنف اور صحافی؛ یورپ کے مسلم ورثے پر کتابوں میں Minarets in the Mountains شامل ہے، BBC کے لیے رپورٹنگ کی اور یورپ بھر میں نایاب مساجد دریافت کیں۔
  es: "Escritor y periodista de viajes británico-bangladesí; entre sus libros sobre la herencia musulmana de Europa se incluyen Minaretes en las montañas de los Balcanes y ¿Una mezquita blanca en las montañas?, y ha colaborado con la BBC, descubriendo mezquitas singulares por toda Europa."
  fr: "Écrivain de voyage et journaliste britanno-bangladais; ses ouvrages sur le patrimoine musulman de l'Europe comprennent Minarets in the Mountains on the Balkans et A White Mosque in the Mountains ?, et il a réalisé des reportages pour la BBC et découvert des mosquées rares à travers l'Europe."
  tr: "Bangladeşli kökenli Britanyalı bir seyahat yazarı ve gazeteci olan Scully, Avrupa ve Batı'daki İslami miras hakkında yazıyor. Kitapları arasında Balkanlar hakkında 'Minares in the Mountains' ve 'The Land of the Atlas Coral' yer alıyor. İngiliz radyosunda çalıştı ve Avrupa'da nadir camiler keşfetti."
  id: "Sebagai penulis perjalanan dan jurnalis asal Bangladesh, ia menulis tentang warisan Islam di Eropa dan Barat. Di antara bukunya adalah 'Menarets in the Mountains' tentang Balkan dan 'The Land of the Atlas Coral.' Ia bekerja untuk radio Inggris dan menemukan masjid-masjid langka di Eropa."
