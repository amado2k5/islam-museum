summary:
  ar: "جراحة عيون باكستانية من يارخون بتشترال، أول امرأة تتخصص في جراحة العيون من منطقتها. درست الطب في جامعة الآغا خان بكراتشي، وخدمت في بلدتها قبل تخصصها في أيرلندا، ثم عادت سنة 2020 لتؤسس خدمات طب العيون وتقودها لدى خدمة الآغا خان الصحية في تشترال وغلغت، رائدة نموذج «المحور والأذرع» الذي وثّقته في مجلة Cureus سنة 2026؛ وهي مؤلفة كتاب «Optics Made Easy» الذي دخل قائمة أفضل كتب طب العيون، وتعمل استشارية وقائدة لطب العيون المجتمعي في جامعة الآغا خان وتتابع زمالة متقدمة في جامعة كالغاري."
  en: "Pakistani eye surgeon from Yarkhun, Chitral, the first female eye surgeon from her region. She took her MBBS at the Aga Khan University in Karachi, served in her hometown before specialising in Ireland, and returned in 2020 to establish and lead eye services for Aga Khan Health Services in Chitral and Gilgit, pioneering the hub-and-spoke model she documented in Cureus in 2026; she is the author of Optics Made Easy, which entered a best-ophthalmology-books list, and is a consultant and Lead of Community Ophthalmology at the Aga Khan University, pursuing an advanced fellowship at the University of Calgary."
  ur: "پاکستانی ماہر جراحت چشم، جن کا تعلق چترال کے علاقے یارخون سے ہے اور وہ اپنے علاقے کی پہلی خاتون آئی سرجن ہیں۔ انھوں نے کراچی کی آغا خان یونیورسٹی سے ایم بی بی ایس کیا، اپنے آبائی علاقے میں خدمت کی، پھر آئرلینڈ سے تخصص کیا اور 2020ء میں واپس آ کر آغا خان ہیلتھ سروسز کے تحت چترال اور گلگت میں چشم خدمات کی بنیاد رکھی اور قیادت کی؛ «حب اینڈ اسپوک» ماڈل کی بانی ہیں جسے انھوں نے 2026ء میں Cureus میں دستاویزی شکل دی؛ وہ کتاب «Optics Made Easy» کی مصنفہ ہیں جو طب چشم کی بہترین کتب کی فہرست میں شامل ہوئی، آغا خان یونیورسٹی میں کنسلٹنٹ اور کمیونٹی آپتھلمولوجی کی سربراہ ہیں اور یونیورسٹی آف کیلگری میں اعلیٰ فیلوشپ کر رہی ہیں۔"
