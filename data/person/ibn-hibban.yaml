summary:
  ar: "أبو حاتم محمد بن حبان البستي الحافظ ⁦(ت 354هـ)⁩، صاحب «الأنواع» ومؤلف كتابي الجرح والتعديل. يصفه الذهبي في «ميزان الاعتدال» بأنه من أئمة زمانه، طلب العلم على رأس الثلاثمائة، وكتب بالشام والحجاز ومصر والعراق والجزيرة وخراسان، وولي قضاء سمرقند، وكان عارفاً بالطب والنجوم والكلام والفقه رأساً في معرفة الحديث؛ ويذكر ما أُخذ عليه من إنكار الحد وقوله «النبوة العلم والعمل»، وما ترتب على ذلك من إخراجه من سجستان {cite:mizan-itidal-bijawi-v3 p. 506-508}."
  en: "Abu Hatim Muhammad ibn Hibban al-Busti, the hadith master (d. 354 AH), author of al-Anwa' and of the two books on criticism and vindication. Al-Dhahabi's Mizan al-I'tidal calls him one of the imams of his time, who sought knowledge at the turn of the year 300, wrote in Syria, the Hijaz, Egypt, Iraq, the Jazira and Khurasan, served as judge of Samarqand, and knew medicine, astronomy, theology and law, being foremost in knowledge of hadith; it records what was held against him — his denial of the 'limit' and his saying 'prophethood is knowledge and action' — and his expulsion from Sijistan."
  es: "Abu Hatim Muhammad ibn Hibban al-Busti, el maestro de hadices (fallecido en el año 354 de la Hégira), autor de al-Anwa' y de dos libros sobre crítica y vindicación. El Mizan al-I'tidal de Al-Dhahabi lo describe como uno de los imanes de su tiempo, quien buscó el conocimiento a principios del año 300, escribió en Siria, el Hiyaz, Egipto, Irak, el Jazira y Jorasán, fue juez de Samarcanda y poseía conocimientos de medicina, astronomía, teología y derecho, siendo el más destacado en el estudio de los hadices. En él se recogen las críticas que recibió: su negación del «límite» y su afirmación de que «la profecía es conocimiento y acción», así como su expulsión de Sijistan."
  fr: "Abou Hatim Muhammad ibn Hibban al-Busti, maître du hadith (mort en 354 AH), auteur d'al-Anwa' et de deux ouvrages sur la critique et la justification. Le Mizan al-I'tidal d'Al-Dhahabi le présente comme l'un des imams de son temps. Il s'est consacré à l'étude du savoir au tournant de l'an 300, a écrit en Syrie, au Hedjaz, en Égypte, en Irak, en Jazira et au Khorasan, a exercé la fonction de juge à Samarcande et maîtrisait la médecine, l'astronomie, la théologie et le droit, excellant dans la connaissance du hadith. L'ouvrage relate les griefs qui lui furent reprochés: son refus de la « limite » et son affirmation selon laquelle « la prophétie est connaissance et action », ainsi que son expulsion du Sijistan."
  ur: "ابو حاتم محمد بن حبان البستی، ماہر حدیث ⁦(متوفی 354ھ)⁩، الانواع کے مصنف اور تنقید و توثیق پر دو کتابوں کے مصنف۔ الذہبی کا میزان الاعتدال اسے اپنے زمانے کے ائمہ میں سے ایک کہتا ہے، جس نے 300 کے آخر میں علم حاصل کیا، شام، حجاز، مصر، عراق، جزیرہ اور خراسان میں لکھا، سمرقند کے قاضی کے طور پر خدمات انجام دیں، اور علم طب، فلکیات، علم الٰہیات اور قانون کا علم رکھتے تھے۔ اس میں ریکارڈ کیا گیا ہے کہ اس کے خلاف کیا کیا گیا تھا - اس کا 'حد' کا انکار اور اس کا کہنا 'نبوت علم اور عمل ہے' - اور سجستان سے اس کا اخراج۔"
  tr: "Ebu Hatim Muhammed bin Hibban el-Busti el-Hafız (ö. 354 Ahri), 'El-Anva''' kitabının yazarı ve Al-Jarh wa al-Ta'dil kitaplarının yazarıdır. El-Dhahabi, 'Mizan el-Tidal'da onu zamanının önde gelen alimlerinden biri olarak tanımlar; üç yüzün başında bilgi arayan, Şam, Hicaz, Mısır, Irak, Cezira ve Horasan'da yazan ve Semerkand'ın hakimi olarak görev yapmıştır. Hadis bilgisinin başında tıp, astronomi, teoloji ve fıkıh bilgisine sahipti. Hududun inkârı ve 'Peygamberlik bilgi ve eylemdir' ifadesiyle ilgili ondan ne aldığını ve bunun sonucunda Sijistan'dan kovulmasını belirtir {cite:mizan-itidal-bijawi-v3, s. 506-508}."
  id: "Abu Hatim Muhammad ibn Hibban al-Busti al-Hafiz (wafat 354 H), penulis 'Al-Anwa'' dan penulis buku Al-Jarh wa al-Ta'dil. Al-Dhahabi menggambarkannya dalam 'Mizan al-I'tidal' sebagai salah satu ulama terkemuka pada zamannya, mencari pengetahuan di depan tiga ratus orang, menulis di Levant, Hejaz, Mesir, Irak, Jazira, dan Khorasan, serta menjabat sebagai hakim Samarkand. Ia memiliki pengetahuan dalam bidang kedokteran, astronomi, teologi, dan fiih di puncak pengetahuan hadis. Ia menyebutkan apa yang ia ambil dari Theodor mengenai penolakan hudud dan pernyataannya 'Kenabian adalah pengetahuan dan tindakan,' serta pengusiran yang diakibatkannya dari Sijistan {cite:mizan-itidal-bijawi-v3, hlm. 506-508}."
