  - tradition: sunni
    id: sunni-dhahabi
    standing: main
    stance: { ar: "إمام في الحديث له أوهام، وقوله في النبوة يُحمل على محمل سائغ", en: "An imam of hadith with errors; his saying on prophethood can bear an acceptable reading" }
    summary:
      ar: "يرى الذهبي أنه من أئمة زمانه، ويوافق ابن الصلاح في أنه غلط الغلط الفاحش في تصرفه، ويرى أن السكوت عن إثبات الحد ونفيه أولى، وأن قوله «النبوة العلم والعمل» سائغ إن أراد أن عماد النبوة العلم والعمل، وزندقة وفلسفة إن أراد الحصر."
      en: "Al-Dhahabi holds him an imam of his time, agrees with Ibn al-Salah that he erred grossly in his handling, holds that silence on affirming or denying the 'limit' is better, and that 'prophethood is knowledge and action' is acceptable if meant as its pillars, but heresy and philosophy if meant exclusively."
    holders: [person/al-dhahabi, person/ibn-al-salah]
    sources: [source/mizan-itidal-bijawi-v3]
  - tradition: sunni
    id: sunni-yahya-ibn-ammar
    standing: secondary
    stance: { ar: "عالم كثير العلم قليل الدين، أُخرج من سجستان", en: "Learned but of little religion; expelled from Sijistan" }
    summary:
      ar: "نقل أبو إسماعيل الأنصاري عن يحيى بن عمار أنه رآه، وأن له علماً كثيراً ولم يكن له كبير دين، وأنهم أخرجوه من سجستان لإنكاره الحد لله؛ ونقل عن غيره أنهم أنكروا قوله «النبوة العلم والعمل» وحكموا عليه بالزندقة وهجروه."
      en: "Abu Isma'il al-Ansari reported Yahya ibn Ammar saying he saw him, that he had much learning but little religion, and that they expelled him from Sijistan for denying the 'limit' of God; others reported that his saying 'prophethood is knowledge and action' was condemned as heresy and he was shunned."
