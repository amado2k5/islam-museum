roles: [scholar, qadi]
gender: male
summary:
  ar: "أبو حاتم محمد بن حبان البستي الحافظ (ت 354هـ)، صاحب «الأنواع» ومؤلف كتابي الجرح والتعديل. يصفه الذهبي في «ميزان الاعتدال» بأنه من أئمة زمانه، طلب العلم على رأس الثلاثمائة، وكتب بالشام والحجاز ومصر والعراق والجزيرة وخراسان، وولي قضاء سمرقند، وكان عارفاً بالطب والنجوم والكلام والفقه رأساً في معرفة الحديث؛ ويذكر ما أُخذ عليه من إنكار الحد وقوله «النبوة العلم والعمل»، وما ترتب على ذلك من إخراجه من سجستان {cite:mizan-itidal-bijawi-v3 p. 506-508}."
  en: "Abu Hatim Muhammad ibn Hibban al-Busti, the hadith master (d. 354 AH), author of al-Anwa' and of the two books on criticism and vindication. Al-Dhahabi's Mizan al-I'tidal calls him one of the imams of his time, who sought knowledge at the turn of the year 300, wrote in Syria, the Hijaz, Egypt, Iraq, the Jazira and Khurasan, served as judge of Samarqand, and knew medicine, astronomy, theology and law, being foremost in knowledge of hadith; it records what was held against him — his denial of the 'limit' and his saying 'prophethood is knowledge and action' — and his expulsion from Sijistan."
died: { hijri: "0354", edtf: "0965", calendar: julian, precision: year, status: tradition, derived: true, note: "الذهبي: مات سنة أربع وخمسين وثلثمائة {cite:mizan-itidal-bijawi-v3 p. 508}؛ التحويل مشتق.", sources: [source/mizan-itidal-bijawi-v3] }
