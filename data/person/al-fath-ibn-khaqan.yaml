id: person/al-fath-ibn-khaqan
class: person
label: { ar: "الفتح بن خاقان", en: "al-Fath ibn Khaqan", fr: "Al-Fath ibn Khaqan", es: "al-Fath ibn Khaqan", ur: "الفتح ابن خاقان" }
summary:
  ar: "وزير المتوكل، قتل معه في ليلة مقتله على يد خمسة من الأتراك في خامس شوال سنة سبع وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 544}. وتنازع هو والمتوكل في تأويل آية فبعث المتوكل بالمبرد إلى عامل البصرة محمد بن القاسم الهاشمي فيها {cite:muruj-al-dhahab p. 476}، وعند المسعودي لما هجم باغر والأتراك على المتوكل تطاير الحاضرون ولم يبق غيره يمانعهم حتى بعجوه بالسيف فأخرجوه من متنه وهو صابر {cite:muruj-al-dhahab p. 506}"
  en: "Al-Mutawakkil's vizier, slain with him in the night-murder by five Turks on 5 Shawwal 247 {cite:tarikh-khulafa-minhaj-1434 p. 544}."
  fr: "Vizir d’al-Mutawakkil, tué avec lui dans l’assassinat nocturne perpétré par cinq Turcs le 5 shawwal 247 H {cite:tarikh-khulafa-minhaj-1434 p. 544}."
  es: "El visir de Al-Mutawakkil, asesinado con él en la noche-asesinato por cinco turcos el 5 de Shawwal de 247 {cite:tarikh-khulafa-minhaj-1434 p. 544}."
  ur: "المتوکل کا وزیر، اس کے ساتھ 5 شوال 247 کو پانچ ترکوں کے ہاتھوں رات کے قتل میں قتل ہوا۔ 544}۔"
  tr: "El-Mutavakkil'in veziri, Hicri 447 yılının Şevval ayının beşinci günü, beş Türk tarafından suikaste uğradığı gece onunla birlikte öldürüldü. {Kaynak:tarikh-khulafa-minhaj-1434 s. 544}. Kendisi ve El-Mutavakkil bir ayetin tefsiri konusunda anlaşmazlık yaşamışlardı, bu yüzden El-Mutavakkil, bu konuda El-Mubarrad'ı Basra valisi Muhammed ibn el-Kasım el-Haşimi'ye gönderdi. {Kaynak:muruj-al-dhahab s. 476}. El-Mas'udi'ye göre, Bağır ve Türkler El-Mutavakkil'e saldırdığında, orada bulunanlar dağıldı ve sadece o direndi. Onlar onu kılıçla bıçaklayıp bedeninden çıkarana kadar direndi, ancak o sabırla direndi. {Kaynak:muruj-al-dhahab s. 506}."
  id: "Menteri al-Mutawakkil terbunuh bersamanya pada malam pembunuhannya di tangan lima orang Turki pada tanggal lima Syawal tahun 447 H {cite:tarikh-khulafa-minhaj-1434 hlm. 544}. Ia dan al-Mutawakkil berselisih mengenai penafsiran sebuah ayat, sehingga al-Mutawakkil mengirim al-Mubarrad kepada gubernur Basra, Muhammad ibn al-Qasim al-Hashimi, mengenai hal itu {cite:muruj-al-dhahab hlm. 476}. Menurut al-Mas'udi, ketika Baghir dan orang-orang Turki menyerang al-Mutawakkil, orang-orang yang hadir berpencar, dan hanya dia yang tersisa untuk melawan mereka sampai mereka menikamnya dengan pedang dan menariknya keluar dari tubuhnya sementara dia tetap sabar {cite:muruj-al-dhahab hlm. 506}."
