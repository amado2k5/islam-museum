summary:
  ar: "لاعب كريكت باكستاني سابق وقائد سابق لمنتخب باكستان وكبير مختاريه لاحقا، وُلد في ملتان سنة 1970. ضارب أيمن في الوسط عُرف بهدوئه وقوته، لعب لباكستان بين 1991 و2007 في 120 مباراة اختبار سجّل فيها 8,830 جولة و378 مباراة ليوم واحد سجّل فيها 11,739 جولة فكان أعلى مسجّل لباكستان في مباريات اليوم الواحد والوحيد من باكستان الذي بلغ 20,000 جولة دولية، واشتهر بجولاته 60 من 37 كرة في نصف نهائي كأس العالم 1992 التي أوصلت باكستان إلى النهائي واللقب، وقاد باكستان بين 2003 و2007، ودرّب أفغانستان (2015-2016)، وعمل كبيرا لمختاري باكستان في فترتين."
  en: "Pakistani former cricketer, former captain of the Pakistan national team and later its chief selector, born in Multan in 1970. A right-handed middle-order batsman known for his calm and power, he played for Pakistan from 1991 to 2007, scoring 8,830 runs in 120 Tests and 11,739 runs in 378 One Day Internationals — Pakistan's leading ODI run-scorer and the only Pakistani to score 20,000 international runs — rose to fame with 60 off 37 balls in the 1992 World Cup semi-final that took Pakistan to the final and the title, captained Pakistan from 2003 to 2007, coached Afghanistan (2015–2016) and served two spells as Pakistan's chief selector."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی، قومی ٹیم کے سابق کپتان اور بعد میں چیف سلیکٹر، جو 1970 میں ملتان میں پیدا ہوئے۔ دائیں ہاتھ کے مڈل آرڈر بلے باز، جو اپنے سکون اور طاقت کے لیے مشہور ہیں، انھوں نے 1991ء سے 2007ء تک پاکستان کے لیے کھیلا، 120 ٹیسٹ میچوں میں 8,830 رنز اور 378 ایک روزہ میچوں میں 11,739 رنز بنائے — پاکستان کے سب سے زیادہ ایک روزہ رنز بنانے والے اور 20,000 بین الاقوامی رنز مکمل کرنے والے واحد پاکستانی — 1992ء ورلڈ کپ سیمی فائنل میں 37 گیندوں پر 60 رنز کی اننگز سے شہرت پائی جس نے پاکستان کو فائنل اور ٹائٹل تک پہنچایا، 2003ء سے 2007ء تک پاکستان کی قیادت کی، افغانستان کی کوچنگ کی ⁦(2015ء–2016ء)⁩ اور دو ادوار میں پاکستان کے چیف سلیکٹر رہے۔"
  es: "Exjugador de críquet pakistaní, excapitán de la selección nacional de Pakistán y posteriormente su seleccionador principal, nacido en Multan en 1970. Bateador diestro de la parte media del orden, conocido por su calma y potencia, jugó para Pakistán desde 1991 hasta 2007, anotando 8.830 carreras en 120 Tests y 11.739 carreras en 378 One Day Internationals. Fue el máximo anotador de carreras de Pakistán en ODI y el único pakistaní en anotar 20.000 carreras internacionales. Saltó a la fama con 60 carreras en 37 bolas en la semifinal de la Copa del Mundo de 1992 que llevó a Pakistán a la final y al título. Fue capitán de Pakistán desde 2003 hasta 2007, entrenó a Afganistán (2015-2016) y se desempeñó dos veces como seleccionador principal de Pakistán."
  fr: "Ancien joueur de cricket pakistanais, ancien capitaine de l'équipe nationale du Pakistan puis son sélectionneur en chef, né à Multan en 1970. Batteur droitier de milieu de tableau, connu pour son calme et sa puissance, il a joué pour le Pakistan de 1991 à 2007, marquant 8 830 courses en 120 tests et 11 739 courses en 378 matchs internationaux d'un jour (ODI) - meilleur marqueur de courses ODI du Pakistan et le seul Pakistanais à avoir marqué 20 000 courses internationales - s'est fait connaître avec 60 courses en 37 balles lors de la demi-finale de la Coupe du monde de 1992 qui a conduit le Pakistan en finale et au titre, a été capitaine du Pakistan de 2003 à 2007, a entraîné l'Afghanistan (2015-2016) et a occupé à deux reprises le poste de sélectionneur en chef du Pakistan."
  tr: "Eski bir Pakistanlı kriketçi, Pakistan milli takımının eski kaptanı ve daha sonra baş seçicisi olan Sher, 1970'te Multan'da doğdu. Orta sahada sağ kanat oyuncusu olarak, sakinliği ve gücüyle tanınan Shern, 1991-2007 yılları arasında Pakistan için 120 Test maçında oynadı, 8.830 inning ve 378 tek günlük maçta 11.739 inning yaptı. Pakistan'ın en yüksek tek günlük rekoru ve 20.000 uluslararası inninge ulaşan tek oyuncuydu. 1992 Dünya Kupası yarı finalinde 37 topta 60 sayı yapmasıyla tanındı; bu maç Pakistan'ı finale ve şampiyonluğa taşıdı. 2003-2007 yılları arasında Pakistan'ı yönetti, Afganistan'ı çalıştırdı (2015-2016) ve iki dönemde Pakistan seçicileri için önemli bir oyuncu olarak görev yaptı."
  id: "Mantan pemain kriket Pakistan, mantan kapten tim nasional Pakistan, dan kemudian menjadi pemilih utama, ia lahir di Multan pada tahun 1970. Seorang sayap kanan di tengah yang dikenal karena ketenangan dan kekuatannya, ia bermain untuk Pakistan antara 1991 dan 2007 dalam 120 pertandingan Test, mencetak 8.830 inning dan 378 pertandingan satu hari, mencetak 11.739 inning. Ia adalah rekor tertinggi Pakistan dalam satu hari dan satu-satunya pemain yang mencapai 20.000 inning internasional. Ia terkenal karena 60 run dari 37 bola di semifinal Piala Dunia 1992, yang membawa Pakistan ke final dan gelar juara. Ia memimpin Pakistan antara 2003 dan 2007, melatih Afghanistan (2015-2016), dan menjadi pemain utama bagi para selektor Pakistan dalam dua periode."
