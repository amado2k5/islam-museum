  ar: "محمد المنتصر بن محمد المنصور الحفصي، من ملوك الدولة الحفصية بتونس، بويع سنة 837 هـ بعد وفاة جده عزوز، ومدة حكمه سنة و71 يوما، وتوفي سنة 839 هـ في سانية باردو، وبدأ بناء المدرسة المنتصرية بتونس {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 46}."
  en: "Muhammad al-Muntasir ibn Muhammad al-Mansur, Hafsid ruler of Tunis: acknowledged in 837 AH after his grandfather Azzuz died, reigned one year and 71 days, died at Sanyat Bardo in 839 AH (1435 CE), and began the Muntasiriyya madrasa in Tunis {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 46}."
