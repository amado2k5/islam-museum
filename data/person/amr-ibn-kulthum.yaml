summary:
  ar: "عمرو بن كلثوم التغلبي، شاعر الجاهلية وصاحب إحدى المعلقات، أمه ليلى بنت مهلهل وعمه كليب وائل؛ قتل عمرو بن هند مضرط الحجارة صاحب الحيرة حين أهان أمه ليلى، وردّ على الحارث بن أبي شمر الغساني حين توعد تغلب بالغزو «ما استيقظ قوم قط إلا نبل رأيهم وعزت جماعتهم، فلا توقظن نائمهم» فغزاهم الحارث فانهزم وقتل أخوه {cite:kamil-ibn-al-athir p. 403, 409}."
  en: "Amr ibn Kulthum of Taghlib, jahili poet and Mu'allaqa author, son of Layla bint Muhalhil and nephew of Kulayb; he killed King Amr ibn Hind for insulting his mother, and answered the Ghassanid al-Harith's threat — 'no people ever woke save to their own counsel's shafts; do not wake the sleeper' — then routed him and slew his brother {cite:kamil-ibn-al-athir p. 403, 409}."
  es: "Amr ibn Kulthum de Taghlib, poeta jahili y autor de Mu'allaqa, hijo de Layla bint Muhalhil y sobrino de Kulayb; mató al rey Amr ibn Hind por insultar a su madre y respondió a la amenaza del gasánida al-Harith: «Ningún pueblo jamás despertó sino por las flechas de su propio consejo; no despiertes al durmiente». Luego lo derrotó y mató a su hermano {cite:kamil-ibn-al-athir p. 403, 409}."
  fr: "Amr ibn Kulthum de Taghlib, poète jahili et auteur de Mu'allaqa, fils de Layla bint Muhalhil et neveu de Kulayb; il tua le roi Amr ibn Hind pour avoir insulté sa mère et répondit à la menace du Ghassanide al-Harith — « aucun peuple ne s'est jamais réveillé, sauf aux flèches de son propre conseil; ne réveillez pas le dormeur » — puis le mit en déroute et tua son frère {cite:kamil-ibn-al-athir p. 403, 409}."
  ur: "عمرو بن کلثوم آف تغلب، جاہلی شاعر اور معلق مصنف، لیلیٰ بنت محلل کے بیٹے اور کلیب کے بھتیجے؛ اس نے شاہ عمرو بن ہند کو اپنی والدہ کی توہین کرنے پر قتل کر دیا، اور غسانی الحارث کی دھمکی کا جواب دیا - 'کوئی بھی لوگ اپنے ہی مشیروں کے سوا کبھی نہیں اٹھے۔ سوئے ہوئے کو نہ جگاؤ - پھر اس کو بھگا دیا اور اس کے بھائی کو قتل کر دیا۔ 403، 409}۔"
  tr: "İslam öncesi dönemin şairi ve Mu'allakat'lardan birinin yazarı Amr ibn Kulthum al-Taghlibi, annesi Layla bint Muhallal, amcası ise Kulayb Wa'il'di. Taş gazı ve el-Hirah'ın sahibi Amr ibn Hind, annesine hakaret ettiğinde annesi Leyla'yı öldürdü. Al-Harith ibn Abi Shammar al-Ghassani'ye işgal tehdidinde bulunduğunda şöyle yanıt verdi: \"Hiçbir halk uyanmadı, ancak asil görüşleri ve grubunun onuru hiç uyanmadı, bu yüzden uykularını uyandırmayın.\" El-Haris onlara saldırdı, yenildi ve kardeşi öldürüldü {atıf:kamil-ibn-al-athir s. 403, 409}."
  id: "Amr ibn Kulthum al-Taghlibi, seorang penyair dari era pra-Islam dan penulis salah satu Mu'allaqat, ibunya adalah Layla bint Muhallal, dan pamannya adalah Kulayb Wa'il. Amr ibn Hind, si tukang benteng batu dan pemilik al-Hirah, membunuh ibunya Layla ketika ia menghina ibunya. Ia menanggapi al-Harith ibn Abi Shammar al-Ghassani ketika ia mengancam akan menyerang: \"Tidak ada bangsa yang pernah terbangun kecuali bahwa pendapat mulia dan kehormatan kelompok mereka tidak pernah terbangun, jadi jangan bangunkan tidur mereka.\" Al-Harith menyerang mereka, dikalahkan, dan saudaranya terbunuh {cite:kamil-ibn-al-athir hlm. 403, 409}."
