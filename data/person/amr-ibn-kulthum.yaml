summary:
  ar: "عمرو بن كلثوم التغلبي، شاعر الجاهلية وصاحب إحدى المعلقات، أمه ليلى بنت مهلهل وعمه كليب وائل؛ قتل عمرو بن هند مضرط الحجارة صاحب الحيرة حين أهان أمه ليلى، وردّ على الحارث بن أبي شمر الغساني حين توعد تغلب بالغزو «ما استيقظ قوم قط إلا نبل رأيهم وعزت جماعتهم، فلا توقظن نائمهم» فغزاهم الحارث فانهزم وقتل أخوه {cite:kamil-ibn-al-athir p. 403, 409}."
  en: "Amr ibn Kulthum of Taghlib, jahili poet and Mu'allaqa author, son of Layla bint Muhalhil and nephew of Kulayb; he killed King Amr ibn Hind for insulting his mother, and answered the Ghassanid al-Harith's threat — 'no people ever woke save to their own counsel's shafts; do not wake the sleeper' — then routed him and slew his brother {cite:kamil-ibn-al-athir p. 403, 409}."
