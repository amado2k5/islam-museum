  note: "Died in 1492: so the English article and Wikidata. The Tarikh al-Sudan's account, quoted in the article, has him drown while crossing the Niger on 6 November 1492, a detail the article itself marks as conjecture; an oral tradition instead has him killed by his sister's son, Askia Muhammad. Both accounts are preserved here and in the prose. A bare year 1492 spans 897-898 AH, so no Hijri year is recorded."
