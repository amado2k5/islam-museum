summary:
  ar: "سوني علي بير (حكم نحو 1464–1492)، خامس عشر حكام أسرة سوني ومؤسس إمبراطورية سونغاي في غرب أفريقيا. ورث مملكة صغيرة على نهر النيجر فحوّلها بالفتوح إلى إمبراطورية: أخذ تمبكتو من الطوارق سنة 1469، وحاصر جني حتى استسلمت سنة 1473، وفتح ماسينا ودلتا النيجر الداخلية. وديانته متنازع عليها في المصادر نفسها: فقد نشأ في وسط تقليدي، وصلى وصام وتصدّق معلنًا إسلامه، لكنه أبى تطبيق الشريعة ووقّر الأشجار والأحجار، فهاجمه مؤرخو تمبكتو المسلمون، بينما تشكك شواهد قبور كوكيا في صورتهم. مات سنة 1492، وخلفه ابنه سوني بارو ثم أسكيا محمد."
  en: "Sonni Ali Ber (r. c. 1464–1492), fifteenth ruler of the Sonni dynasty and founder of the Songhai Empire in West Africa. He inherited a small Niger-bend kingdom and turned it by conquest into an empire: he took Timbuktu from the Tuareg in 1469, starved Djenne into surrender in 1473, and conquered Massina and the Inner Niger Delta. His religion is contested in the sources themselves: raised in a traditional milieu, he professed Islam and observed the prayers, the fast and almsgiving, yet refused the sharia a place in Songhai and venerated trees and stones, for which the Muslim chroniclers of Timbuktu attacked him — a picture the funeral stelae of Kukiya partly contradict. He died in 1492 and was succeeded by his son Sunni Baru and then by Askia Muhammad."
  ur: "سونی علی بیر (حکومت تقریباً 1464ء–1492ء)، سونی خاندان کے پندرہویں حکمران اور مغربی افریقا میں سلطنت سونغائی کے بانی تھے۔ انھیں دریائے نائیجر کے کنارے ایک چھوٹی سی مملکت ورثے میں ملی جسے انھوں نے فتوحات سے سلطنت بنا دیا: 1469ء میں انھوں نے طوارق سے ٹمبکٹو لیا، 1473ء میں جینے کو بھوکا مار کر تسلیم کرایا، اور ماسینا و اندرونی نائیجر ڈیلٹا فتح کیے۔ ان کا مذہب خود مصادر میں متنازع ہے: وہ روایتی ماحول میں پلے، اسلام کا اقرار کرتے، نماز، روزہ اور زکاۃ کی پابندی کرتے، مگر شریعت کو سونغائی میں نافذ کرنے سے انکار کیا اور درختوں اور پتھروں کی تعظیم کی، جس پر ٹمبکٹو کے مسلم مؤرخین نے ان پر حملے کیے — ایسی تصویر جس سے کوکیا کے مقبرہ کتبے جزوی طور پر اختلاف کرتے ہیں۔ 1492ء میں ان کی وفات ہوئی اور ان کے بعد ان کے بیٹے سنی بارو اور پھر اسکیا محمد تخت نشین ہوئے۔"

