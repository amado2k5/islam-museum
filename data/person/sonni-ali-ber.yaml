    note: >-
      His religion is genuinely contested in the sources, and no source read names a school or
      order for him, so the settlement is unknown with the readings preserved in full. The
      English article reports that he received an Islamic education and professed Islam, and
      that he observed the Islamic prayers, fasted and gave alms; it reports in the same
      breath that his faith was syncretic and unorthodox, that he venerated certain trees and
      stones by slaughtering at them, consulted soothsayers and magicians, and did not permit
      the acceptance of the sharia in Songhai or see any barrier to enslaving Muslims — the
      grounds on which al-Maghili and the Timbuktu chroniclers condemned him as outwardly or
      nominally Muslim at best. It also records the counter-evidence: al-Sa'di acknowledged
      his respect for some scholars, and the funeral stelae of Kukiya suggest the chroniclers,
      who wrote for the Askia dynasty that overthrew his house, exaggerated his impiety.
      Professed Islam with traditional practice, attested by hostile and apologetic readings
      alike, names no school, so nothing further is recorded.
    sources: [source/wikipedia-sonni-ali-en, source/wikidata-sonni-ali]

