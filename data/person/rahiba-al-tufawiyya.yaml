roles: [mystic]
summary:
  ar: "عابدة من البصرة، أم عثمان بن سودة الطفاوي؛ يروي ابن الجوزي في «صفة الصفوة» دعاءها عند الموت ورؤيا ابنها لها توصيه بزيارة القبور والدعاء لأهلها."
  en: "A devout woman of Basra, mother of Uthman ibn Sawda al-Tufawi; Ibn al-Jawzi's Sifat al-Safwa records her prayer at death and her son's dream in which she urged him to keep visiting the graves and praying for their people."
  ur: "بصرہ کی ایک عابدہ، عثمان بن سودہ الطفاوی کی والدہ؛ ابن الجوزی کی «صفۃ الصفوہ» موت کے وقت ان کی دعا اور ان کے بیٹے کا خواب نقل کرتی ہے جس میں انہوں نے قبروں کی زیارت اور اہلِ قبور کے لیے دعا جاری رکھنے کی تاکید کی۔"
  es: "Una mujer devota de Basora, madre de Uthman ibn Sawda al-Tufawi; en su Sifat al-Safwa, Ibn al-Jawzi recoge su oración antes de morir y el sueño de su hijo en el que ella le instaba a seguir visitando las tumbas y rezando por su pueblo."
