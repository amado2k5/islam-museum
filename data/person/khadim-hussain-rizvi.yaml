summary:
  ar: "عالم وخطيب باكستاني (22 مايو 1966 – 19 نوفمبر 2020)، مؤسس تحريك لبيك باكستان وأميرها الأول، عُرف بدفاعه الصارم عن قوانين التجديف الباكستانية وباعتصامي فيض آباد 2017 واحتجاجات آسيا بيبي 2018. ورغم وفاته سنة 2020 ما زالت قناته الأرشيفية الرسمية على يوتيوب تنشر تسجيلاته وبلغت نحو 1.2 مليون مشترك في نوفمبر 2026."
  en: "Pakistani Islamic scholar and preacher (22 May 1966 – 19 November 2020), founder and first ameer of Tehreek-e-Labbaik Pakistan, known for his uncompromising defence of Pakistan's blasphemy laws, the 2017 Faizabad sit-in and the 2018 Asia Bibi protests. Although he died in 2020, his official archive YouTube channel still publishes his recordings and counted some 1.2 million subscribers in November 2026."
  ur: "پاکستانی عالم اور خطیب (22 مئی 1966 – 19 نومبر 2020)، تحریکِ لبیک پاکستان کے بانی اور پہلے امیر، جو پاکستان کے قوانینِ توہین کے سخت دفاع، 2017 کے فیض آباد دھرنے اور 2018 کے آسیہ بی بی احتجاج کے لیے جانے گئے۔ 2020 میں وفات کے باوجود ان کا سرکاری آرکائیو یوٹیوب چینل ان کی ریکارڈنگز شائع کرتا رہا اور نومبر 2026 میں اس کے تقریباً 1.2 ملین سبسکرائبر تھے۔"
