summary:
  ar: "علي خامنئي (1939–2026)، رجل دين شيعي وسياسي إيراني، رئيس إيران من 1981 إلى 1989 ثم مرشدها الأعلى الثاني من 1989 حتى اغتياله في 28 شباط 2026 في غارات إسرائيلية خلال حرب إيران 2026، وهو أطول مرشد أعلى بقاءً في المنصب. وُلد في مشهد ودرس في قم على يد روح الله الخميني، وكان من وجوه الثورة الإيرانية، وخلفه في القيادة ابنه مجتبى خامنئي."
  en: "Ali Khamenei (1939–2026) was an Iranian Shia cleric and politician, president of Iran from 1981 to 1989 and then its second supreme leader from 1989 until his assassination on 28 February 2026 in Israeli airstrikes during the 2026 Iran war — the longest tenure of any supreme leader. Born at Mashhad, he studied at Qom in the classes of Ruhollah Khomeini and was a mainstream figure of the Iranian Revolution; his son Mojtaba Khamenei was chosen to succeed him as supreme leader."
  ur: "علی خامنہ ای (1939ء–2026ء) ایرانی شیعہ عالمِ دین اور سیاست دان تھے، 1981ء سے 1989ء تک ایران کے صدر اور پھر 1989ء سے 28 فروری 2026ء کو ایران جنگ 2026ء کے دوران اسرائیلی فضائی حملوں میں اپنے قتل تک اس کے دوسرے رہبرِ اعلیٰ رہے — یہ کسی بھی رہبرِ اعلیٰ کی طویل ترین مدت ہے۔ وہ مشہد میں پیدا ہوئے، قم میں روح اللہ خمینی کے دروس میں شریک ہوئے اور انقلابِ ایران کی نمایاں شخصیات میں سے تھے؛ ان کے بیٹے مجتبیٰ خامنہ ای کو ان کا جانشین چنا گیا۔"
