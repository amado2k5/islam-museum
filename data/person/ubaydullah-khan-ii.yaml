summary:
  ar: "عبيد الله خان الثاني (1675–1711)، سابع خان بخارى من الأسرة الأشتارخانية، ابن سبحان قلي خان وخليفته، حكم من 1702 إلى مقتله. سعى إلى الحدّ من سلطان زعماء القبائل الأوزبك وحصر الحكم في رجال يعيّنهم، فاصطدم بالأمراء وبخواجات جويبار، وأجرى سنة 1708 إصلاحًا نقديًا بعملة مخفّضة الفضة فأشعل أزمة، وقُتل في مؤامرة سنة 1711 ودُفن في مزار بهاء الدين نقشبند بجانب أبيه، فخلفه أخوه أبو الفيض خان. سمّاه المؤرخون «الثاني» تمييزًا له من عبيد الله خان الشيباني (حكم 1533–1540)."
  en: "Ubaydullah Khan II (1675-1711) was the seventh khan of Bukhara of the Ashtarkhanid dynasty, the son and successor of Subhan Quli Khan, reigning from 1702 until his killing. He tried to break the power of the Uzbek tribal chiefs and rule through his own appointees, clashed with the emirs and the Juybari khojas, and carried out a monetary reform in 1708 whose debased coinage provoked a crisis; he was killed in a conspiracy in 1711, buried in the mazar of Bahauddin Naqshband beside his father, and succeeded by his brother Abu'l-Fayz Khan. Historians number him 'the Second' to distinguish him from the Shaybanid Ubaydullah Khan (r. 1533-1540)."
  ur: "عبید اللہ خان ثانی (1675ء–1711ء) بخارا کے اشترخانی خاندان کے ساتویں خان، سبحان قلی خان کے بیٹے اور جانشین تھے، جن کا دور 1702ء سے قتل تک رہا۔ انھوں نے ازبک قبائلی سرداروں کی طاقت توڑ کر اپنے مقرر کردہ آدمیوں سے حکومت کی کوشش کی، امراء اور جویباری خواجوں سے ٹکرائے، اور 1708ء میں کم چاندی والی نئی کرنسی کی اصلاح کی جس سے بحران پیدا ہوا؛ 1711ء میں سازش میں قتل ہوئے، مزارِ بہاء الدین نقشبند میں والد کے پہلو میں دفن ہوئے اور ان کے بھائی ابوالفیض خان جانشین ہوئے۔ مورخین انھیں شیبانی عبید اللہ خان (دور 1533ء–1540ء) سے الگ کرنے کے لیے «ثانی» کہتے ہیں۔"

