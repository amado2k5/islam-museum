id: person/al-husayn-ibn-al-qasim-ibn-wahb
class: person
label: { ar: "الحسين بن القاسم بن عبد الله بن سليمان بن وهب", en: "al-Husayn ibn al-Qasim ibn Abd Allah ibn Sulayman ibn Wahb", es: "al-Husayn ibn al-Qasim ibn Abd Allah ibn Sulayman ibn Wahb", fr: "al-Husayn ibn al-Qasim ibn Abd Allah ibn Sulayman ibn Wahb", ur: "الحسین بن القاسم بن عبد اللہ بن سلیمان بن وہب" }
summary:
  ar: "وزير للمقتدر بالله؛ قيل إنه اتبع الشلمغاني على مذهبه وإن رقعة بخطه وجدت في دار الشلمغاني يخاطبه فيها بما لا يخاطب به البشر بعضهم بعضاً فعُرضت المخطوطة فعرفها الناس {cite:kamil-ibn-al-athir p. 218}."
  en: "A vizier of al-Muqtadir said to have followed al-Shalmaghani; a note in his hand addressing the man in inhuman terms was found in his house {cite:kamil-ibn-al-athir p. 218}."
  es: "Se dice que un visir de al-Muqtadir siguió a al-Shalmaghani; en su casa se encontró una nota escrita por él que se dirigía al hombre en términos inhumanos {cite:kamil-ibn-al-athir p. 218}."
  fr: "Un vizir d'al-Muqtadir aurait suivi al-Shalmaghani; une note de sa main s'adressant à l'homme en termes inhumains a été trouvée dans sa maison {cite:kamil-ibn-al-athir p. 218}."
  ur: "المقتدیر کے ایک وزیر نے کہا کہ الشلمغانی کی پیروی کی ہے۔ اس کے ہاتھ میں ایک نوٹ جس میں آدمی کو غیر انسانی الفاظ میں مخاطب کیا گیا تھا اس کے گھر سے ملا۔ 218}۔"
  tr: "Yüce Billah'ın Bakanı; Al-Shalmghani'nin evinde insanların birbirine hitap etmediği şekilde el yazısıyla yazılmış bir not bulunmasına rağmen, onun öğretisine göre El-Şalmghani'yi takip ettiği söylenir. El yazması sergilendi ve insanlar onu tanıdı {atıf:kamil-ibn-al-athir s. 218}."
  id: "Menteri Billah Yang Maha Kuasa; konon ia mengikuti Al-Shalmghani sesuai ajarannya, meskipun sebuah catatan dengan tulisan tangannya ditemukan di rumah Al-Shalmghani yang berbicara kepadanya dengan cara yang tidak biasa digunakan orang untuk berbicara satu sama lain. Naskah itu dipajang dan orang-orang mengenalinya {cite:kamil-ibn-al-athir hlm. 218}."
