label:
  ar: إسماعيل بن المسلم الهمداني
  en: Ismail ibn al-Muslim al-Hamdani
  ur: اسماعیل بن المسلم ہمدانی
summary:
  ar: رجل من همدان من أهل خيوان، كان أحد الأربعة الذين حملوا مع أبي القاسم محمد بن الهادي، وأحد مشايخ خيوان الذين أشاروا عليه بالخروج.
  en: A man of Hamdan from Khiwan, one of the four who charged with Abu al-Qasim Muhammad ibn al-Hadi and one of the elders of Khiwan who advised him to leave.
  ur: ہمدان کا ایک شخص، اہل خیوان میں سے، ان چار میں سے ایک جنہوں نے ابو القاسم محمد بن ہادی کے ساتھ حملہ کیا اور خیوان کے ان بزرگوں میں سے جنہوں نے انہیں نکل جانے کا مشورہ دیا۔
