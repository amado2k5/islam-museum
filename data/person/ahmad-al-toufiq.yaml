  ar: "مؤرخ وروائي وسياسي مغربي، وُلد سنة 1943 في مريغة بالأطلس الكبير. وزير الأوقاف والشؤون الإسلامية المغربي منذ سنة 2002، وأستاذ سابق للتاريخ بجامعة محمد الخامس ومدير سابق للمكتبة الوطنية."
