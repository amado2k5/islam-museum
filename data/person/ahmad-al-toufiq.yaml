  es: "Historiador, novelista y político marroquí, nacido en 1943 en Marigha, en el Alto Atlas. Ministro de Asuntos Religiosos e Islámicos de Marruecos desde 2002, anteriormente profesor de historia en la Universidad Mohammed V y director de la Biblioteca Nacional."
