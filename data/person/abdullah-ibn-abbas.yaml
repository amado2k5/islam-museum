summary:
  en: "The Prophet's young cousin who grew up in Medina and became the tradition's founding authority on the interpretation of the Qur'an — remembered as the father of tafsir."
  ar: "ابن عم النبي الصغير الذي نشأ في المدينة وصار في التراث أعلى مرجعية في تفسير القرآن — يُذكر أبًا للتفسير؛ وفي الصحيح ضمّه النبي إلى صدره غلاماً وقال «اللهم علمه الحكمة» وفي رواية «علمه الكتاب» {cite:sahih-al-bukhari 3756}، وفي مسلم دعا له حين وضع له الماء للوضوء «اللهم فقهه» {cite:sahih-muslim 2477}. وعند المسعودي أن معاوية سأله عن أبي بكر فقال كان للقرآن تالياً وعن المنكرات ناهياً فاق أصحابه ورعاً وكفافاً وسادهم زهداً وعفافاً، وعن عمر فقال كان حليف الإسلام ومأوى الأيتام حتى أوضح الدين وفتح البلاد وأمن العباد، وعن عثمان فقال كان أكرم الحفدة وأفضل البررة هجاداً بالأسحار صاحب جيش العسرة، وعن علي فقال كان علم الهدى وكهف التقى ومحل الحجا وبحر الندى خير من آمن واتقى صاحب القبلتين وأبا السبطين وزوج خير النساء، وعن أبيه العباس فقال كان صنو نبيه وقرة عين صفيه سيد الأعمام صاحب البيت والسقاية والمشاعر والتلاوة {cite:muruj-al-dhahab p. 51-52}، ومر بقوم ينالون من علي فقال لقائدهم أدنني منهم فقال أيكم الساب الله قالوا نعوذ بالله، أيكم الساب رسول الله قالوا نعوذ بالله، أيكم الساب علياً قالوا أما هذه فنعم، قال أشهد لقد سمعت رسول الله يقول من سبني فقد سب الله ومن سب علياً فقد سبني فأطرقوا {cite:muruj-al-dhahab p. 712-713}، وسأل صعصعة بن صوحان عن السؤدد والمروءة والحكيم والفارس فأجابه بأجمع الأوصاف حتى قال له أنت يا ابن صوحان باقر علم العرب، وقال في الفزاري الذي هدده أما لو كلف نفسه نقل الصخور من جبال شمام إلى الهضام لكان أهون عليه من منازعة أخي عبد القيس {cite:muruj-al-dhahab p. 44-47}، وعند المسعودي أجاب ابن الزبير حين عرض له في المتعة وأم المؤمنين فقال أما قولك في المتعة فسل أمك تخبرك وأما قولك أم المؤمنين فبنا سميت وبنا ضرب عليها الحجاب وأما قولك حواري رسول الله فقد لقيت أباك في الزحف وأنا مع إمام هدى، فانقطع ابن الزبير ودخل على أمه أسماء فأخبرها فقالت صدق، وخرج ابن عباس خوفاً على نفسه فنزل الطائف فتوفي هنالك {cite:muruj-al-dhahab p. 77}، وتوفي بالطائف في سلطنة عبد الملك سنة ثمان وستين وقيل تسع وستين وله إحدى وسبعون سنة وأمه لبابة بنت الحارث بن حزن، وصلى عليه محمد بن الحنفية، وكان قد ذهب بصره بكائه على علي والحسن والحسين ويخضب شيبه بالحناء وهو القائل إن يأخذ الله من عيني نورهما ففي لساني وقلبي منهما نور، وقال فيما حيل بينه وبين الحكومة حائل القدر وقصر المدة ومحنة الابتلاء، وولده علي أبو الخلفاء من بني العباس {cite:muruj-al-dhahab p. 94-95}"
  ur: "نبی کے کم عمر چچا زاد بھائی، جن کی پرورش مدینہ میں ہوئی؛ اسلامی روایت میں تفسیر قرآن کی بنیادی علمی شخصیات میں شمار ہوتے ہیں۔ {cite:ibn-sad-tabaqat-bewley} {cite:watt-1956-medina}"
