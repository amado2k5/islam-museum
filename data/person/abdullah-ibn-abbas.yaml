summary:
  ar: "ابن عم النبي الصغير، وُلد قبل الهجرة بثلاث سنين وصار في التراث أعلى مرجعية في تفسير القرآن، ولُقّب بالحبر والبحر. وتذكر دائرة المعارف الإسلامية أنه كان يعقد دروسًا أسبوعية في التفسير والقضاء والمغازي والشعر القديم، وأنه رافق جيوشًا في حملات عدة، وقاد جناحًا من جيش علي في الجمل وصفين، وتولى البصرة ثم انسحب إلى مكة، وتوفي بالطائف سنة 68هـ."
  en: "The Prophet's young cousin, born three years before the Hijra, who became the tradition's founding authority on the interpretation of the Qur'an and was nicknamed al-Hibr and al-Bahr. The Encyclopaedia of Islam reports that he gave weekly classes on exegesis, judicial questions, expeditions and ancient poetry, accompanied several military campaigns, commanded a wing of Ali's army at the Camel and Siffin, governed Basra before withdrawing to Mecca, and died at al-Ta'if in 68 AH."
  ur: "نبی کے کم عمر چچا زاد بھائی، ہجرت سے تین سال پہلے پیدا ہوئے اور اسلامی روایت میں تفسیرِ قرآن کی بنیادی علمی شخصیت بنے، حبر اور بحر کے لقب سے معروف ہوئے۔ انسائیکلوپیڈیا آف اسلام کے مطابق وہ تفسیر، عدالتی مسائل، مہمات اور قدیم شاعری پر ہفتہ وار درس دیتے تھے، کئی مہمات میں لشکروں کے ساتھ گئے، جمل اور صفین میں علی کے لشکر کے ایک بازو کی کمان کی، بصرہ کے والی رہے، پھر مکہ چلے گئے اور 68ھ میں طائف میں فوت ہوئے۔"
