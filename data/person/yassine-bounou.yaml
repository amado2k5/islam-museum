summary:
  ar: "حارس مرمى مغربي محترف ⁦(وُلد سنة 1991 في مونتريال بكندا لأبوين مغربيين)⁩، يُعرف باسم «بونو». نشأ في الدار البيضاء وبدأ مع الوداد، ثم لعب في إسبانيا لأتلتيكو مدريد وجيرونا وإشبيلية — الذي فاز معه بالدوري الأوروبي مرتين وبجائزة زامورا — وانتقل سنة 2023 إلى الهلال السعودي؛ كان حارس المغرب الأساسي في بلوغ نصف نهائي كأس العالم 2022 وسُمّي أفضل حارس في كأس أمم أفريقيا 2025."
  en: "Moroccan professional goalkeeper (born 1991 in Montreal, Canada, to Moroccan parents), known mononymously as Bono. Raised in Casablanca, he began at Wydad, played in Spain for Atlético Madrid, Girona and Sevilla — winning the Europa League twice and the Zamora Trophy with Sevilla — and moved to Al Hilal in Saudi Arabia in 2023; he was Morocco's first-choice goalkeeper in their run to the 2022 World Cup semi-finals and was named the best goalkeeper of the 2025 Africa Cup of Nations."
  ur: "مراکشی پیشہ ور گول کیپر ⁦(پیدائش 1991، مونٹریال، کینیڈا، مراکشی والدین کے ہاں)⁩، جو «بونو» کے نام سے جانے جاتے ہیں۔ کاسابلانکا میں پلے بڑھے اور وداد سے آغاز کیا، پھر اسپین میں ایٹلیٹیکو میڈرڈ، جیرونا اور سیویلا کے لیے کھیلے — سیویلا کے ساتھ دو بار یوروپا لیگ اور زامورا ٹرافی جیتی — اور 2023 میں سعودی عرب کے الہلال میں منتقل ہوئے؛ وہ 2022 ورلڈ کپ کے سیمی فائنل تک مراکش کی دوڑ میں اس کے پہلی پسند کے گول کیپر تھے اور افریقہ کپ آف نیشنز 2025 کے بہترین گول کیپر قرار پائے۔"
  es: "Portero profesional marroquí (nacido en 1991 en Montreal, Canadá, de padres marroquíes), conocido simplemente como Bono. Criado en Casablanca, comenzó su carrera en el Wydad, jugó en España para el Atlético de Madrid, el Girona y el Sevilla —ganando la Europa League dos veces y el Trofeo Zamora con el Sevilla— y se trasladó al Al Hilal de Arabia Saudí en 2023; fue el portero titular de Marruecos en su camino a las semifinales de la Copa Mundial de 2022 y fue nombrado mejor portero de la Copa Africana de Naciones de 2025."
  fr: "Gardien de but professionnel marocain (né en 1991 à Montréal, au Canada, de parents marocains), connu sous le nom de Bono. Formé à Casablanca, il a débuté au Wydad, puis a évolué en Espagne à l'Atlético Madrid, à Gérone et à Séville – remportant deux fois la Ligue Europa et le Trophée Zamora avec Séville – avant de rejoindre Al Hilal en Arabie saoudite en 2023. Il était le gardien titulaire du Maroc lors de son parcours jusqu'en demi-finale de la Coupe du monde 2022 et a été élu meilleur gardien de but de la Coupe d'Afrique des Nations 2025."
  tr: "Profesyonel bir Faslı kaleci (1991'de Montreal, Kanada'da doğdu, Faslı ebeveynlerin çocuğu), 'Bono' olarak bilinir. Casablanca'da büyüdü ve Wydad'da başladı, ardından İspanya'da Atlético Madrid, Girona ve Sevilla takımlarında oynadı — bu takımlarla iki kez Avrupa Ligi ve Zamora Kupası'nı kazandı — ve 2023'te Suudi Arabistan'ın Al Hilal takımına geçti; 2022 Dünya Kupası yarı finallerine kadar yükselen Fas'ın ilk kalecisi oldu ve 2025 Afrika Uluslar Kupası'nın en iyi kalecisi seçildi."
  id: "Seorang penjaga gawang profesional asal Maroko (lahir tahun 1991 di Montreal, Kanada, dari orang tua Maroko), dikenal sebagai 'Bono'. Ia tumbuh besar di Casablanca dan memulai karier di Wydad, lalu bermain di Spanyol untuk Atlético Madrid, Girona, dan Sevilla — di mana ia memenangkan Liga Europa dua kali dan Trofi Zamora — dan pindah pada tahun 2023 ke Al Hilal Arab Saudi; ia menjadi penjaga gawang utama Maroko saat mencapai semifinal Piala Dunia 2022 dan dinobatkan sebagai penjaga gawang terbaik Piala Afrika 2025."
