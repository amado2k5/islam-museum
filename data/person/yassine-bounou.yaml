summary:
  ar: "حارس مرمى مغربي محترف (وُلد سنة 1991 في مونتريال بكندا لأبوين مغربيين)، يُعرف باسم «بونو». نشأ في الدار البيضاء وبدأ مع الوداد، ثم لعب في إسبانيا لأتلتيكو مدريد وجيرونا وإشبيلية — الذي فاز معه بالدوري الأوروبي مرتين وبجائزة زامورا — وانتقل سنة 2023 إلى الهلال السعودي؛ كان حارس المغرب الأساسي في بلوغ نصف نهائي كأس العالم 2022 وسُمّي أفضل حارس في كأس أمم أفريقيا 2025."
  en: "Moroccan professional goalkeeper (born 1991 in Montreal, Canada, to Moroccan parents), known mononymously as Bono. Raised in Casablanca, he began at Wydad, played in Spain for Atlético Madrid, Girona and Sevilla — winning the Europa League twice and the Zamora Trophy with Sevilla — and moved to Al Hilal in Saudi Arabia in 2023; he was Morocco's first-choice goalkeeper in their run to the 2022 World Cup semi-finals and was named the best goalkeeper of the 2025 Africa Cup of Nations."
  ur: "مراکشی پیشہ ور گول کیپر (پیدائش 1991، مونٹریال، کینیڈا، مراکشی والدین کے ہاں)، جو «بونو» کے نام سے جانے جاتے ہیں۔ کاسابلانکا میں پلے بڑھے اور وداد سے آغاز کیا، پھر اسپین میں ایٹلیٹیکو میڈرڈ، جیرونا اور سیویلا کے لیے کھیلے — سیویلا کے ساتھ دو بار یوروپا لیگ اور زامورا ٹرافی جیتی — اور 2023 میں سعودی عرب کے الہلال میں منتقل ہوئے؛ وہ 2022 ورلڈ کپ کے سیمی فائنل تک مراکش کی دوڑ میں اس کے پہلی پسند کے گول کیپر تھے اور افریقہ کپ آف نیشنز 2025 کے بہترین گول کیپر قرار پائے۔"
