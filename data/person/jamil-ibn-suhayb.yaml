summary:
  ar: "دهقان الفلوجة المستشار، أجاب عبيد بن أبي المخارق حين استشاره في عمل الحجاج بأربع خلال: افتح بابك ولا يكن لك حاجب، وأطل الجلوس لأهل عملك، ولا يختلف حكمك بين الناس، ولا تقبل من أهل عملك هدية، ثم اسلخ ما بين أقفيتهم إلى عجوز أذناً بهم فيرضوا عنك ولا يكون للحجاج عليك سبيل {cite:muruj-al-dhahab p. 136-137}."
  en: "The Faluja dihqan consulted by al-Hajjaj's new officer — four counsels: keep your door unguarded, sit long among your subjects, judge high and low alike and take no gifts, then tax them till they praise you and the Hajjaj has no way against you {cite:muruj-al-dhahab p. 136-137}."
