class: person
label: { ar: "جميل بن صهيب", en: "Jamil ibn Suhayb", es: "Jamil ibn Suhayb", fr: "Jamil ibn Suhayb", ur: "جمیل بن صہیب" }
summary:
  ar: "دهقان الفلوجة المستشار، أجاب عبيد بن أبي المخارق حين استشاره في عمل الحجاج بأربع خلال: افتح بابك ولا يكن لك حاجب، وأطل الجلوس لأهل عملك، ولا يختلف حكمك بين الناس، ولا تقبل من أهل عملك هدية، ثم اسلخ ما بين أقفيتهم إلى عجوز أذناً بهم فيرضوا عنك ولا يكون للحجاج عليك سبيل {cite:muruj-al-dhahab p. 136-137}."
  en: "The Faluja dihqan consulted by al-Hajjaj's new officer — four counsels: keep your door unguarded, sit long among your subjects, judge high and low alike and take no gifts, then tax them till they praise you and the Hajjaj has no way against you {cite:muruj-al-dhahab p. 136-137}."
  es: "El dihqan de Faluja consultado por el nuevo oficial de al-Hajjaj: cuatro consejos: mantén tu puerta sin vigilancia, siéntate largo tiempo entre tus súbditos, juzga por igual a altos y bajos y no aceptes regalos, luego impónles impuestos hasta que te alaben y el Hajjaj no tenga forma de hacerte frente {cita:muruj-al-dhahab p. 136-137}."
  fr: "Le Faluja dihqan consulté par le nouvel officier d'al-Hajjaj — quatre conseils: laissez votre porte sans surveillance, asseyez-vous longtemps parmi vos sujets, jugez les hauts et les bas de la même manière et ne prenez pas de cadeaux, puis taxez-les jusqu'à ce qu'ils vous louent et que le Hajjaj n'ait aucun moyen contre vous {cite:muruj-al-dhahab p. 136-137}."
  ur: "فلوجہ دحقان نے الحجاج کے نئے افسر سے مشورہ کیا - چار نصیحتیں: اپنے دروازے کی حفاظت نہ کرو، اپنی رعایا کے درمیان دیر تک بیٹھو، اونچ نیچ کا فیصلہ کرو اور تحفہ نہ لو، پھر ان پر ٹیکس لگاؤ جب تک کہ وہ تمہاری تعریف نہ کریں اور حجاج کے پاس تمہارے خلاف کوئی راستہ نہ رہے۔ 136-137}۔"
