  ar: "أبو عبد الله مسلم بن يسار، قال قتادة: كان مسلم بن يسار يعد خامس خمسة من فقهاء أهل البصرة، وقال ابن عون: أدركت هذا المسجد وما فيه حلقة يذكر فيها الفقه إلا حلقة مسلم بن يسار {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  tr: "Ebu Abdullah Müslim bin Yasar, Katadah şöyle dedi: Müslüman ibn Yasar, Basra'nın hukukçuları arasında beşinci kişi olarak kabul edilirdi. İbn 'Awn şöyle dedi: Bu camiye rastladım ve burada Müslüman ibn Yasar çemberi hariç fıkıhtan bahsedilen bir çember vardır {atıf: tabaqat-fuqaha-abbas-1981, s. 47}."
  id: "Abu Abdullah Muslim ibn Yasar, Qatadah berkata: Muslim ibn Yasar dianggap sebagai yang kelima di antara para ahli hukum Basra. Ibn 'Awn berkata: Saya pernah bertemu masjid ini dan di dalamnya terdapat lingkaran di mana yurisprudensi disebutkan kecuali lingkaran Muslim ibn Yasar {cite:tabaqat-fuqaha-abbas-1981, hlm. 47}."
