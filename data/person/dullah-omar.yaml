label:
  ar: دولا عمر
  en: Dullah Omar
  ur: دولا عمر
summary:
  ar: محامٍ وسياسي جنوب أفريقي من كيب تاون، دافع عن مناضلي مناهضة الأبارتايد، وأصبح أول وزير للعدل في جنوب أفريقيا الديمقراطية سنة 1994 فأشرف على إنشاء لجنة الحقيقة والمصالحة، ثم وزيرًا للنقل منذ 1999 حتى وفاته سنة 2004.
  en: South African lawyer and politician from Cape Town who defended anti-apartheid activists, became democratic South Africa's first minister of justice in 1994 and oversaw the creation of the Truth and Reconciliation Commission, then served as minister of transport from 1999 until his death in 2004.
  ur: کیپ ٹاؤن سے تعلق رکھنے والے جنوبی افریقی وکیل اور سیاست دان جنہوں نے اپارتھائیڈ مخالف کارکنوں کا دفاع کیا، 1994 میں جمہوری جنوبی افریقہ کے پہلے وزیر انصاف بنے اور سچ اور مفاہمت کمیشن کے قیام کی نگرانی کی، پھر 1999 سے 2004 میں وفات تک وزیر ٹرانسپورٹ رہے۔
