summary:
  ar: طلحة بن طاهر بن الحسين الخزاعي، أمير خراسان وابن أميرها، ولاه المأمون العباسي عليها بعد وفاة أبيه طاهر سنة 207هـ فاستمر فيها إلى أن توفي، وكان جواداً عاقلاً، بحسب الزركلي {cite:alam-zirikli-1927-v2 p. 50}.
  en: 'Talha ibn Tahir ibn al-Husayn al-Khuza''i, emir of Khurasan and son of its emir: the Abbasid caliph al-Ma''mun appointed him after his father Tahir died in 207 AH, and he held it until his death; generous and sensible, according to al-Zirikli.'
  ur: 'طلحہ بن طاہر بن الحسین خزاعی، خراسان کے امیر اور اس کے امیر کے بیٹے: عباسی خلیفہ مامون نے انہیں ان کے والد طاہر کی 207ھ میں وفات کے بعد مقرر کیا، اور وہ وفات تک اس پر رہے؛ زرکلی کے مطابق سخی اور عقل مند تھے۔'
