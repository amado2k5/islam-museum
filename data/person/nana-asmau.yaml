summary:
  ar: "عالمة وشاعرة ومعلّمة من خلافة سوكوتو في غرب أفريقيا، ابنة مؤسس الخلافة عثمان بن فودي، وُلدت سنة 1793 وتوفيت سنة 1864. ألّفت أكثر من ستين عملا بالعربية والفولانية والهوسا والتماشق، وأسست شبكة «يان تارو» من المعلّمات المتجولات لتعليم النساء، فصارت أبرز عالمات غرب أفريقيا في عصرها."
  en: "Scholar, poet and teacher of the Sokoto Caliphate in West Africa, daughter of its founder Usman dan Fodio; born in 1793 and died in 1864. She wrote more than sixty works in Arabic, Fula, Hausa and Tamacheq, and built the 'Yan Taru network of travelling women teachers, becoming the most prominent woman scholar of West Africa in her age."
  ur: "مغربی افریقہ کی خلافت سوکوتو کی عالمہ، شاعرہ اور معلمہ، خلافت کے بانی عثمان بن فودیو کی بیٹی؛ 1793 میں پیدا ہوئیں اور 1864 میں وفات پائی۔ انہوں نے عربی، فولانی، ہاؤسا اور تماشق میں ساٹھ سے زائد تصانیف لکھیں اور خواتین کی تعلیم کے لیے سفر کرنے والی معلمات کا جال «یان تارو» قائم کیا۔"
