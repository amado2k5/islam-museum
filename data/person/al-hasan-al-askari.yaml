class: person
label: { ar: "الحسن العسكري", en: "al-Hasan al-Askari", es: "al-Hasan al-Askari", fr: "al-Hasan al-Askari", ur: "الحسن العسکری" }
summary:
  ar: "أبو محمد الحسن بن علي بن محمد بن علي بن موسى بن جعفر، قبض بسامرا سنة ستين ومائتين في خلافة المعتمد وهو ابن تسع وعشرين سنة، وهو عند القطعية من الإمامية وهم جمهور الشيعة أبو المهدي المنتظر، وقد افترق هؤلاء في المنتظر من آل النبي بعد وفاته على عشرين فرقة {cite:muruj-al-dhahab p. 571-572}."
  en: "Abu Muhammad al-Hasan b. 'Ali — died at Samarra in 260, aged 29; father of the awaited Mahdi for the Qat'iyya, whose community split into twenty sects after him {cite:muruj-al-dhahab p. 571-572}."
  es: "Abu Muhammad al-Hasan b. 'Ali — murió en Samarra en 260, a la edad de 29 años; padre del Mahdi esperado para la Qat'iyya, cuya comunidad se dividió en veinte sectas después de él {cite:muruj-al-dhahab p. 571-572}."
  fr: "Abu Muhammad al-Hasan b. 'Ali — est mort à Samarra en 260, à l'âge de 29 ans; père du Mahdi attendu pour la Qat'iyya, dont la communauté s'est divisée en vingt sectes après lui {cite:muruj-al-dhahab p. 571-572}."
  ur: "ابو محمد الحسن بی۔ علی - 260 میں سامرا میں 29 سال کی عمر میں فوت ہوا؛ قطیہ کے منتظر مہدی کے والد، جن کی جماعت ان کے بعد بیس فرقوں میں بٹ گئی 571-572}۔"
  tr: "Ebu Muhammed el-Hasan ibn Ali ibn Muhammed ibn Ali ibn Musa ibn Ca'fer, 260 Hicri yılında el-Mu'tamid halifeliği sırasında yirmi dokuz yaşında Samarra'da öldü. Katiyye'ye göre, Şiilerin çoğunluğunu oluşturan İmamiyiye, Ebu el-Mehdi el-Muntazar'a aittir. Bu gruplar, Peygamber'in ölümünden sonra beklenen ailesi yüzünden yirmi mezhebe bölündü {atıf:Muruj-al-Dhahab, s. 571-572}."
  id: "Abu Muhammad al-Hasan ibn Ali ibn Muhammad ibn Ali ibn Musa ibn Ja'far wafat di Samarra pada tahun 260 H selama kekhalifahan al-Mu'tamid pada usia dua puluh sembilan tahun. Menurut Qatiyya, ia berasal dari Imamiyyah, yang merupakan mayoritas Syiah, Abu al-Mahdi al-Muntazar. Kelompok-kelompok ini terpecah karena keluarga Nabi yang dinantikan setelah wafatnya menjadi dua puluh sekte {cite:muruj-al-dhahab, hlm. 571-572}."
