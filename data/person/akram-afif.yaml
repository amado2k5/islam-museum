summary:
  ar: "جناح قطري وُلد في الدوحة سنة 1996 ويلعب للسد. نال جائزة أفضل لاعب في آسيا مرتين ⁦(2019 و2023)⁩، وصنع عشرة أهداف قياسية في كأس آسيا 2019، وكان هداف كأس آسيا 2023 بثمانية أهداف، وهو أول لاعب مولود في قطر يوقّع في الدوري الإسباني."
  en: "Qatari winger born in Doha in 1996 who plays for Al Sadd. He won the Asian Footballer of the Year award twice (2019 and 2023), set a tournament record of 10 assists at the 2019 AFC Asian Cup, finished top scorer of the 2023 AFC Asian Cup with eight goals, and was the first Qatari-born signing in La Liga history."
  fr: "Ailier qatarien né à Doha en 1996, jouant à Al Sadd. Il remporta deux fois le titre de joueur asiatique de l’année (2019 et 2023), établit un record de 10 passes décisives à la Coupe d’Asie de l’AFC 2019, termina meilleur buteur de celle de 2023 avec huit buts et fut le premier joueur né au Qatar recruté dans l’histoire de la Liga."
  ur: "قطری ونگر، 1996 میں دوحہ میں پیدا ہوئے، السد کے لیے کھیلتے ہیں۔ انہوں نے دو بار ایشین فٹبالر آف دی ایئر جیتا ⁦(2019 اور 2023)⁩، 2019 اے ایف سی ایشین کپ میں ریکارڈ 10 اسسٹ کیے، اور 2023 ایشین کپ میں آٹھ گولوں کے ساتھ ٹاپ اسکورر رہے؛ وہ لا لیگا میں دستخط کرنے والے قطر میں پیدا ہونے والے پہلے کھلاڑی تھے۔"
  es: "Extremo catarí nacido en Doha en 1996 que juega en el Al Sadd. Ganó el premio al Futbolista Asiático del Año en dos ocasiones (2019 y 2023), estableció un récord del torneo con 10 asistencias en la Copa Asiática de la AFC de 2019, fue el máximo goleador de la Copa Asiática de la AFC de 2023 con ocho goles y fue el primer jugador nacido en Catar en ser fichado en la historia de La Liga."
  tr: "1996 yılında Doha'da doğan ve Al Sadd'da forma giyen Katarlı kanat oyuncusu. İki kez AFC Yılın Oyuncusu ödülünü kazandı (2019 ve 2023), 2019 AFC Asya Kupası'nda rekor kıran on asist yaptı ve 2023 AFC Asya Kupası'nda sekiz golle gol kralı oldu. İspanya Ligi'ne imza atan ilk Katar doğumlu oyuncudur."
  id: "Seorang pemain sayap asal Qatar kelahiran Doha tahun 1996 yang bermain untuk Al Sadd. Ia memenangkan penghargaan Pemain Terbaik AFC dua kali (2019 dan 2023), memberikan rekor sepuluh assist di Piala Asia AFC 2019, dan menjadi pencetak gol terbanyak di Piala Asia AFC 2023 dengan delapan gol. Ia adalah pemain pertama kelahiran Qatar yang menandatangani kontrak dengan Liga Spanyol."
