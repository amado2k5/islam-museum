summary:
  ar: "جناح قطري وُلد في الدوحة سنة 1996 ويلعب للسد. نال جائزة أفضل لاعب في آسيا مرتين (2019 و2023)، وصنع عشرة أهداف قياسية في كأس آسيا 2019، وكان هداف كأس آسيا 2023 بثمانية أهداف، وهو أول لاعب مولود في قطر يوقّع في الدوري الإسباني."
  en: "Qatari winger born in Doha in 1996 who plays for Al Sadd. He won the Asian Footballer of the Year award twice (2019 and 2023), set a tournament record of 10 assists at the 2019 AFC Asian Cup, finished top scorer of the 2023 AFC Asian Cup with eight goals, and was the first Qatari-born signing in La Liga history."
  ur: "قطری ونگر، 1996 میں دوحہ میں پیدا ہوئے، السد کے لیے کھیلتے ہیں۔ انہوں نے دو بار ایشین فٹبالر آف دی ایئر جیتا (2019 اور 2023)، 2019 اے ایف سی ایشین کپ میں ریکارڈ 10 اسسٹ کیے، اور 2023 ایشین کپ میں آٹھ گولوں کے ساتھ ٹاپ اسکورر رہے؛ وہ لا لیگا میں دستخط کرنے والے قطر میں پیدا ہونے والے پہلے کھلاڑی تھے۔"
