summary:
  ar: "قائد بيزنطي وأخو الإمبراطور هرقل، تسميه دائرة المعارف الإسلامية ثيودور تريثوريوس الساكلاريوس، أي أمين الخزانة. تذكر في مقالة أجنادين أن القوات الرومية في المعركة سنة 13هـ الموافقة تموز-آب 634م كان يقودها ثيودورس أخو هرقل، وتذكر في مقالة اليرموك أنه جاء من حمص مع القائد فاهان، وأن الروايات تتضارب في حضوره المعركة نفسها، وأنه استُدعي على الأرجح إلى القسطنطينية في غضب قبل المراحل الأخيرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 227} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  en: "Byzantine commander and brother of the emperor Heraclius, called by the Encyclopaedia of Islam Theodore Trithurios the Sakellarios, that is the treasurer. Its article on Ajnadayn says the Greek forces in the battle of 13 AH, July-August 634, were led by Theodorus, brother of Heraclius. Its article on the Yarmuk says he came from Hims with the general Vahan, that reports conflict on whether he was present at the battle itself, and that he was probably recalled to Constantinople in disgrace before its final stages {cite:encyclopaedia-of-islam-2 vol. 1 p. 227} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  ur: "بازنطینی سپہ سالار اور شہنشاہ ہرقل کے بھائی، جنہیں اسلامی دائرۃ المعارف تھیوڈور ٹرائتھوریوس ساکلاریوس، یعنی خزانچی، کہتا ہے۔ اجنادین کے مضمون میں ہے کہ 13ھ، یعنی جولائی-اگست 634ء، کی جنگ میں رومی فوج کی قیادت ہرقل کے بھائی تھیوڈورس کے پاس تھی۔ یرموک کے مضمون میں ہے کہ وہ حمص سے سپہ سالار واہان کے ساتھ آئے، ان کی جنگ میں موجودگی کے بارے میں روایات متضاد ہیں، اور غالباً آخری مراحل سے پہلے انہیں ناراضی کے ساتھ قسطنطنیہ واپس بلا لیا گیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 227} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}۔"
  es: "Comandante bizantino y hermano del emperador Heraclio, llamado por la Enciclopedia del Islam Teodoro Trithurios el Sakellarios, es decir, el tesorero. Su artículo sobre Ajnadayn dice que las fuerzas griegas en la batalla del 13 AH, julio-agosto de 634, fueron dirigidas por Teodoro, hermano de Heraclio. Su artículo sobre Yarmuk dice que vino de Hims con el general Vahan, que informa contradictorio sobre si estuvo presente en la batalla misma, y que probablemente fue llamado de regreso a Constantinopla en desgracia antes de sus etapas finales {cite:encyclopaedia-of-islam-2 vol. 1 p. 227} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  fr: "Commandant byzantin et frère de l'empereur Héraclius, Théodore Trithurios le Sakellarios (trésorier) est mentionné dans l'Encyclopédie de l'Islam. L'article consacré à Ajnadayn indique que les forces grecques lors de la bataille de l'an 13 de l'Hégire (juillet-août 634) étaient commandées par Théodore, frère d'Héraclius. L'article sur Yarmouk précise qu'il venait de Hims avec le général Vahan. Les sources divergent quant à sa présence lors de la bataille elle-même, et il est probable qu'il ait été rappelé à Constantinople en disgrâce avant la fin des combats (voir Encyclopédie de l'Islam, vol. 1, p. 227; vol. 11, p. 302)."
  tr: "Bizanslı bir komutan ve İmparator Herakleios'un kardeşi olan Yarmuk, İslam Ansiklopedisi ona Theodore Trethorius the Saclearius, yani hazinedar adını verir. Ajnadin'in makalesindeki makalede, 13 Hicri (Temmuz-Ağustos 634) savaşında Roma kuvvetlerinin Herakleios'un kardeşi Theodorus tarafından yönetildiği belirtilir. Yarmuk hakkındaki makalede, onun Humus'tan komutan Vahan ile birlikte geldiği ve savaşta bulunmasıyla ilgili anlatımların çeliştiği belirtilir; muhtemelen son aşamalardan önce öfkeyle Konstantinopolis'e çağrıldığı belirtilir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 227} {cite:encyclopaedia-of-Islam-2 cilt 11, s. 302}."
  id: "Seorang komandan Bizantium dan saudara Kaisar Heraclius, Ensiklopedia Islam menyebutnya Theodore Trethorius the Saclearius, yang berarti bendahara. Disebutkan dalam artikel Ajnadin bahwa pasukan Romawi dalam pertempuran 13 H (Juli-Agustus 634 M) dipimpin oleh Theodorus, saudara Heraclius. Artikel tentang Yarmouk menyebutkan bahwa ia datang dari Homs bersama komandan Vahan, dan bahwa cerita tersebut bertentangan mengenai kehadirannya di pertempuran itu sendiri, dan kemungkinan besar ia dipanggil ke Konstantinopel dengan kemarahan sebelum tahap akhir {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 227} {cite:encyclopaedia-of-Islam-2 vol. 11, hlm. 302}."
