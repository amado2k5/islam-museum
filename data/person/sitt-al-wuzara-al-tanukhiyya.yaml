id: person/sitt-al-wuzara-al-tanukhiyya
class: person
label:
  ar: ست الوزراء التنوخية
  en: Sitt al-Wuzara' al-Tanukhiyya
  es: "Sitt al-Wuzara' al-Tanukhiyya"
  fr: "Sitt al-Wuzara' al-Tanukhiyya"
  ur: "سیٹ الوزرہ التانوخیہ"
roles: [scholar, muhaddith]
gender: female
summary:
  ar: "ست الوزراء بنت عمر بن أسعد ابن المنجى التنوخية الحنبلية، أم محمد، وتدعى وزيرة، فقيهة محدثة دمشقية المولد والوفاة، روت صحيح البخاري ومسند الشافعي بدمشق ومصر، وعرفها المقريزي بالمسندة المعمرة، توفيت سنة 716 هـ."
  en: "Sitt al-Wuzara' bint Umar ibn As'ad ibn al-Munajja al-Tanukhiyya, a Hanbali, Umm Muhammad, called Wazira; a woman jurist and hadith transmitter born and died in Damascus, who transmitted the Sahih of al-Bukhari and the Musnad of al-Shafi'i in Damascus and Egypt and whom al-Maqrizi called the long-lived musnida; died 716 AH (1316)."
  es: "Sitt al-Wuzara' bint Umar ibn As'ad ibn al-Munajja al-Tanukhiyya, un hanbali, Umm Muhammad, llamado Wazira; una mujer jurista y transmisora de hadices nacida y fallecida en Damasco, que transmitió el Sahih de al-Bukhari y el Musnad de al-Shafi'i en Damasco y Egipto y a quien al-Maqrizi llamó la musnida longeva; murió en 716 d. H. (1316)."
  fr: "Sitt al-Wuzara' bint Umar ibn As'ad ibn al-Munajja al-Tanukhiyya, un Hanbali, Umm Muhammad, appelé Wazira; une femme juriste et transmettrice de hadiths née et décédée à Damas, qui a transmis le Sahih d'al-Bukhari et le Musnad d'al-Shafi'i à Damas et en Égypte et qu'al-Maqrizi a appelé la musnida de longue durée; décédé en 716 AH (1316)."
  ur: "سیت الوزرہ بنت عمر بن اسعد ابن المنجہ التنوخیہ، حنبلی، ام محمد، وزیرہ کہلاتی ہیں۔ ایک خاتون فقیہ اور حدیث کی ترسیل کرنے والی جو دمشق میں پیدا ہوئی اور فوت ہوئی، جس نے صحیح بخاری اور مسند الشافعی کو دمشق اور مصر میں منتقل کیا اور جسے المقرزی نے طویل المدت مسنید کہا؛ وفات 716ھ (1316)۔"
  tr: "Sit al-Wazira bint Umar ibn As'ad ibn al-Munji al-Tanukhiyya Hanbaliyya, Vezira olarak bilinir, Şam'dan doğmuş ve vefat etmiş bir fıhik ve hadis âlimidir. Şam ve Mısır'da Sahih al-Buhari ve Musnad al-Shafi'i'yi anlatmıştır. El-Maqrizi onu uzun ömürlü Musnadlı olarak da tanımıştır. 716 Hicri yılında vefat etmiştir."
  id: "Sit al-Wazira bint Umar ibn As'ad ibn al-Munji al-Tanukhiyya Hanbaliyya, um Muhammad, dikenal sebagai Wazira, seorang ahli hukum dan ulama hadis dari Damaskus, lahir dan meninggal dunia. Ia menceritakan Sahih al-Bukhari dan Musnad al-Shafi'i di Damaskus dan Mesir. Al-Maqrizi juga mengenalnya sebagai Musnad yang hidup lama. Ia meninggal pada tahun 716 H."
