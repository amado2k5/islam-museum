  es: "Nasrallah b. Qalaqis — el poeta alejandrino que alabó al gobernador zuray'id de Adén, y que luego se ahogó con todas sus posesiones cuando su barco se partió frente a Dahlak en el Mar Rojo {cite:wafayat-ayan}."
