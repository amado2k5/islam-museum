summary:
  ar: "نبيل العربي (15 مارس 1935 – 26 أغسطس 2024)، دبلوماسي وقاضٍ مصري، درس القانون في القاهرة ونيويورك، ومثّل مصر في الأمم المتحدة، وكان عضوًا في محكمة العدل الدولية (2001–2006)، ثم وزيرًا للخارجية عقب ثورة 2011، فالأمين العام السابع لجامعة الدول العربية (2011–2016) خلفًا لعمرو موسى."
  en: "Nabil Elaraby (15 March 1935 – 26 August 2024) was an Egyptian diplomat and jurist who studied law in Cairo and New York, represented Egypt at the United Nations, and sat on the International Court of Justice (2001–2006). After the 2011 revolution he served briefly as foreign minister, then as the seventh Secretary-General of the Arab League (2011–2016), succeeding Amr Moussa."
  ur: "نبیل عربی (15 مارچ 1935ء – 26 اگست 2024ء) مصری سفارت کار اور جج تھے۔ انہوں نے قاہرہ اور نیویارک میں قانون کی تعلیم حاصل کی، اقوام متحدہ میں مصر کی نمائندگی کی اور عالمی عدالتِ انصاف کے رکن رہے (2001ء–2006ء)۔ 2011ء کے انقلاب کے بعد وہ وزیرِ خارجہ بنے، پھر عمرو موسیٰ کے جانشین کے طور پر عرب لیگ کے ساتویں سیکرٹری جنرل (2011ء–2016ء) رہے۔"
