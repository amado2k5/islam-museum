summary:
  ar: "المولى عصام الدين أبو الخير أحمد بن مصلح الدين المشتهر بطاش كبرى زاده صاحب الشقائق النعمانية؛ قال في ذيل الشقائق المسمى بالعقد المنظوم في ذكر أفاضل الروم: كان من العلماء الأعيان، أخذ عن أبيه الحديث والتفسير ثم قرأ على المولى سيدي محمد القوجوي وصار ملازماً له ثم على المولى محمد الشهير بميرم جلبي وكمّل عنده العلوم الرياضية، ودرس بعدة مدارس ثم قلّد قضاء القسطنطينية فأجرى الأحكام الدينية إلى أن رمد رمداً شديداً انتهى إلى أن عميت كريمتاه فكان مصداق ما جاء في الأثر «جاء القضاء عمى البصر» فاستعفى عن المنصب واشتغل بتبييض بعض تأليفه، وكان بحراً زاخراً منصفاً راضياً بالحق عارياً عن المكابرة؛ ومن مصنفاته المعالم في الكلام وحاشية على حاشية التجريد للشريف الجرجاني جمع فيها مقالات القوشجي والدواني ومير صدر الدين وخطيب زاده وشرح القسم الثالث من المفتاح وكتاب الشقائق النعمانية في علماء الدولة العثمانية — وقد جمعه بعد عماه وهو أول من تصدى له — وكتاب ذكر فيه أنواع العلوم وضروبها وموضوعاتها وما اشتهر من المصنفات في كل فن مع نبذ من تواريخ مصنفيها وهو كتاب نفيس غزير الفوائد، وجمع كتاباً في التاريخ كبيراً واختصره؛ وابتُلي بمرض الباسور وبه توفي سنة ثمان وستين وتسعمائة {cite:shadharat-dhahab p. 352-353}."
  en: "Tashkopruzade — author of al-Shaqa'iq al-Nu'maniyya on the scholars of the Ottoman state; Constantinople's qadi until his eyes failed — 'the judgeship came with blindness' — then he retired and compiled the Shaqa'iq blind, the first to write it; also Miftah part-three sharh, a kalam work, glosses gathering al-Qushji, al-Dawani and Mir Sadr al-Din, and a large then epitomized history; died of hemorrhoids in 968 {cite:shadharat-dhahab p. 352-353}."
