summary:
  ar: "المولى عصام الدين أبو الخير أحمد بن مصلح الدين المشتهر بطاش كبرى زاده صاحب الشقائق النعمانية؛ قال في ذيل الشقائق المسمى بالعقد المنظوم في ذكر أفاضل الروم: كان من العلماء الأعيان، أخذ عن أبيه الحديث والتفسير ثم قرأ على المولى سيدي محمد القوجوي وصار ملازماً له ثم على المولى محمد الشهير بميرم جلبي وكمّل عنده العلوم الرياضية، ودرس بعدة مدارس ثم قلّد قضاء القسطنطينية فأجرى الأحكام الدينية إلى أن رمد رمداً شديداً انتهى إلى أن عميت كريمتاه فكان مصداق ما جاء في الأثر «جاء القضاء عمى البصر» فاستعفى عن المنصب واشتغل بتبييض بعض تأليفه، وكان بحراً زاخراً منصفاً راضياً بالحق عارياً عن المكابرة؛ ومن مصنفاته المعالم في الكلام وحاشية على حاشية التجريد للشريف الجرجاني جمع فيها مقالات القوشجي والدواني ومير صدر الدين وخطيب زاده وشرح القسم الثالث من المفتاح وكتاب الشقائق النعمانية في علماء الدولة العثمانية — وقد جمعه بعد عماه وهو أول من تصدى له — وكتاب ذكر فيه أنواع العلوم وضروبها وموضوعاتها وما اشتهر من المصنفات في كل فن مع نبذ من تواريخ مصنفيها وهو كتاب نفيس غزير الفوائد، وجمع كتاباً في التاريخ كبيراً واختصره؛ وابتُلي بمرض الباسور وبه توفي سنة ثمان وستين وتسعمائة {cite:shadharat-dhahab p. 352-353}."
  en: "Tashkopruzade — author of al-Shaqa'iq al-Nu'maniyya on the scholars of the Ottoman state; Constantinople's qadi until his eyes failed — 'the judgeship came with blindness' — then he retired and compiled the Shaqa'iq blind, the first to write it; also Miftah part-three sharh, a kalam work, glosses gathering al-Qushji, al-Dawani and Mir Sadr al-Din, and a large then epitomized history; died of hemorrhoids in 968 {cite:shadharat-dhahab p. 352-353}."
  es: "Tashkopruzade — autor de al-Shaqa'iq al-Nu'maniyya sobre los eruditos del estado otomano; cadí de Constantinopla hasta que le fallaron los ojos —'el cargo de juez llegó con la ceguera'— luego se retiró y compiló el Shaqa'iq ciego, siendo el primero en escribirlo; también Miftah parte tres sharh, una obra kalam, glosas que reúnen a al-Qushji, al-Dawani y Mir Sadr al-Din, y una gran historia que entonces fue resumida; murió de hemorroides en 968 {cite:shadharat-dhahab p. 352-353}."
  fr: "Tashkopruzade — auteur d'al-Shaqa'iq al-Nu'maniyya sur les savants de l'État ottoman; cadi de Constantinople jusqu'à ce que sa vue décline — « la fonction de juge est venue avec la cécité » — puis il se retira et compila le Shaqa'iq aveugle, le premier à l'écrire; également Miftah partie trois sharh, un ouvrage de kalam, des gloses rassemblant al-Qushji, al-Dawani et Mir Sadr al-Din, et une grande histoire ensuite résumée; mort d'hémorroïdes en 968 {cite:shadharat-dhahab p. 352-353}."
  ur: "Tashkopruzade - عثمانی ریاست کے علماء پر الشقایق النعمانیہ کے مصنف؛ قسطنطنیہ کا قاضی یہاں تک کہ اس کی آنکھیں ناکام ہوگئیں - 'قاضی اندھا پن کے ساتھ آیا' - پھر اس نے سبکدوشی کی اور شقیق نابینا کو مرتب کیا، جو اسے لکھنے والا پہلا شخص تھا۔ مفتاح پارٹ تھری شارح، ایک کلام کا کام، القشجی، الدوانی اور میر صدرالدین کی تالیفات، اور اس وقت کی ایک بڑی تاریخ؛ 968 میں بواسیر کی وجہ سے وفات پائی۔ 352-353}۔"
  tr: "Mawla Issam al-Din Abu al-Khair Ahmed ibn Muslih al-Din, Batash Kubra Zada olarak bilinir, el-Şakaiq el-Numaniyah kitabının yazarı, el-Şakaiq'in 'El-'Aqd al-Mendum fi Zikr Afadel el-Rum' adlı ekinde şöyle demiştir: Kendisi seçkin alimler arasındaydı. Babasından hadis ve tefsir aldı, sonra Mawla Sidi Muhammed el-Quwajui'nin yanında eğitim aldı, yakın arkadaşı oldu ve ardından Miriam Jalabi olarak bilinen Mawla Muhammed'in yanında matematik bilimlerini tamamladı, çeşitli okullarda okudu, ardından İstanbul'da yargıç olarak dini hükümler yürüttü, ta ki ağır göz hastalıkları geçirene kadar ve sonunda Soylu eylemleri kör oldu, bu yüzden hadislerde belirtilen 'Ferman gözü kör etti' diyerek görevinden istifa etti ve bazı yazılarını beyazlatmaya çalıştı. O, inatçılıktan uzak, zengin, adil ve dürüst bir denizdi. Eserleri arasında 'Al-Ma'alim fi al-Kalam' ve Al-Sharif Al-Jurcani'nin Al-Tajrid'in kenar notlarına dair bir kenar kitabı bulunur; burada Al-Kuşji, Al-Dawani, Mir Sadr al-Din, Khatibzadeh'in makalelerini, Al-Miftah'ın üçüncü bölümüne yapılan tefhişi ve körlüğünden sonra derlediği ve ilk kez karşılaştığı 'Al-Shaqa'iq al-Numaniyyah fi 'Ulama al-Da'miyyah' adlı kitabı ve çeşitli bilimlerden bahsettiği bir kitap yer alır Her alandaki türleri, konuları ve ünlü eserleri ile yazarlarının tarihlerinden seçkiler. Değerli ve faydalı bir kitaptır, önemli bir tarihsel kitabı derlemiş, kısaltılmış ve hemoroid hastalığına yakalanmış ve 968 yılında vefat etmiştir {atıf: shadharat-dhahab s. 352-353}."
  id: "Mawla Issam al-Din Abu al-Khair Ahmad ibn Muslih al-Din, yang dikenal sebagai Batash Kubra Zada, penulis al-Shaqaiq al-Numaniyah, berkata dalam lampiran al-Shaqa'iq yang disebut 'Al-'Aqd al-Mandum fi Dhikr Afadel al-Rum': Ia termasuk di antara ulama terkemuka. Ia mempelajari hadits dan tafsiran dari ayahnya, kemudian belajar di bawah Mawla Sidi Muhammad al-Quwajui, menjadi sahabat dekatnya, dan kemudian di bawah Mawla Muhammad, yang dikenal sebagai Miriam Jalabi, di mana ia menyelesaikan ilmu matematika, belajar di beberapa sekolah, kemudian menjadi hakim Konstantinopel, memimpin keputusan agama hingga mengalami oftalmologi berat, dan akhirnya Perbuatan mulianya dibutakan, sehingga ia setia pada apa yang disebutkan dalam hadis: 'Dekrit telah membutakan mata,' sehingga ia mengundurkan diri dari jabatannya dan berusaha memutihkan beberapa tulisannya. Ia adalah lautan yang kaya, adil, dan jujur tanpa keras kepala. Di antara karyanya adalah 'Al-Ma'alim fi al-Kalam' dan sebuah marginalia tentang catatan pinggir Al-Tajrid oleh Al-Sharif Al-Jurjani, di mana ia mengumpulkan artikel-artikel Al-Qushji, Al-Dawani, Mir Sadr al-Din, Khatibzadeh, komentar atas bagian ketiga Al-Miftah, dan buku 'Al-Shaqa'iq al-Numaniyyah fi 'Ulama al-Da'miyyah' — yang ia susun setelah kebutaan dan menjadi yang pertama menghadapinya — serta sebuah buku di mana ia menyebutkan berbagai ilmu pengetahuan Jenis, topik, dan karya terkenal di setiap bidangnya, bersama dengan pilihan sejarah para penulisnya. Ini adalah buku yang berharga dan bermanfaat, menyusun buku sejarah utama, meringkasnya, dan menderita wasir serta meninggal pada tahun 968 {cite:shadharat-dhahab hlm. 352-353}."
