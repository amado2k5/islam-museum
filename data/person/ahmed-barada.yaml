summary:
  ar: "لاعب اسكواش مصري محترف سابق، وُلد في القاهرة سنة 1977. وصل إلى المركز الثاني عالميًا في ديسمبر 1998 وحلّ وصيفًا في بطولة العالم المفتوحة 1999، وأنهت إصابة طعن في 2000 مسيرته مبكرًا، فاعتزل في أغسطس 2001."
  en: "Egyptian former professional squash player, born in Cairo in 1977. He reached world No. 2 in December 1998 and was runner-up at the 1999 World Open; a stabbing injury in 2000 cut his career short, and he retired in August 2001."
  ur: "مصری سابق پیشہ ور اسکواش کھلاڑی، 1977 میں قاہرہ میں پیدا ہوئے۔ دسمبر 1998 میں عالمی نمبر 2 بنے اور 1999 کے ورلڈ اوپن میں رنر اپ رہے؛ 2000 میں چاقو کے وار کی چوٹ نے ان کا کیریئر مختصر کر دیا اور اگست 2001 میں وہ ریٹائر ہو گئے۔"
  es: "Exjugador profesional de squash egipcio, nacido en El Cairo en 1977. Alcanzó el puesto número 2 del mundo en diciembre de 1998 y fue subcampeón del Abierto Mundial de 1999; una herida de arma blanca en el año 2000 truncó su carrera y se retiró en agosto de 2001."
  fr: "Ancien joueur de squash professionnel égyptien, né au Caire en 1977. Il a atteint la 2e place mondiale en décembre 1998 et a été finaliste à l'Open mondial de 1999; une blessure par arme blanche en 2000 a mis fin prématurément à sa carrière, et il a pris sa retraite en août 2001."
  tr: "1977'de Kahire'de doğmuş eski bir Mısırlı profesyonel squash oyuncusu. Aralık 1998'de dünya sıralamasında ikinciliğe ulaştı ve 1999 Dünya Açık Şampiyonası'nda finalist oldu. 2000 yılında geçirdiği bıçaklanma sonucu kariyeri erken sona erdi ve Ağustos 2001'de emekli oldu."
  id: "Seorang mantan pemain squash profesional Mesir, lahir di Kairo pada tahun 1977. Ia meraih peringkat kedua dunia pada Desember 1998 dan menjadi runner-up di Kejuaraan Dunia Terbuka 1999. Cedera akibat tusukan pada tahun 2000 mengakhiri kariernya sebelum waktunya, dan ia pensiun pada Agustus 2001."
