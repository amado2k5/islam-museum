summary:
  ar: "أبو عبد الرحمن موسى بن عبد الرحمن الخزاز، الناسك النبيه ذو الفضل الكثير، كان تخلّى في داره مستأنسًا بذكره ومشاهده، وأسند الكثير. روى عن أبيه عن النعمان عن سفيان عن عمرو بن دينار وأبي الزبير عن جابر حديثًا في آداب الطعام."
  en: "Abu Abd al-Rahman Musa ibn Abd al-Rahman al-Khazzaz, a discerning ascetic of great merit, who kept to his house, at home with remembrance and its witnesses, and transmitted much; he narrated a report on the manners of eating, from Jabir, through a chain of his father, al-Nu'man and Sufyan."
  ur: "ابو عبد الرحمن موسیٰ بن عبد الرحمن خزاز، ایک ہوشیار زاہد جن کا فضل بہت زیادہ تھا۔ وہ اپنے گھر میں خلوت نشین رہتے، ذکر اور اس کے مشاہد سے مانوس، اور بہت روایات بیان کیں؛ انہوں نے جابر سے کھانے کے آداب کی ایک روایت اپنے والد، نعمان اور سفیان کی سند سے نقل کی۔"
