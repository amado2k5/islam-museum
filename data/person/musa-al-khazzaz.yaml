summary:
  ar: "أبو عبد الرحمن موسى بن عبد الرحمن الخزاز، الناسك النبيه ذو الفضل الكثير، كان تخلّى في داره مستأنسًا بذكره ومشاهده، وأسند الكثير. روى عن أبيه عن النعمان عن سفيان عن عمرو بن دينار وأبي الزبير عن جابر حديثًا في آداب الطعام."
  en: "Abu Abd al-Rahman Musa ibn Abd al-Rahman al-Khazzaz, a discerning ascetic of great merit, who kept to his house, at home with remembrance and its witnesses, and transmitted much; he narrated a report on the manners of eating, from Jabir, through a chain of his father, al-Nu'man and Sufyan."
  ur: "ابو عبد الرحمن موسیٰ بن عبد الرحمن خزاز، ایک ہوشیار زاہد جن کا فضل بہت زیادہ تھا۔ وہ اپنے گھر میں خلوت نشین رہتے، ذکر اور اس کے مشاہد سے مانوس، اور بہت روایات بیان کیں؛ انہوں نے جابر سے کھانے کے آداب کی ایک روایت اپنے والد، نعمان اور سفیان کی سند سے نقل کی۔"
  es: "Abu Abd al-Rahman Musa ibn Abd al-Rahman al-Khazzaz, un asceta perspicaz de gran mérito, que permaneció en su casa, en su hogar con el recuerdo y sus testigos, y transmitió mucho; narró un informe sobre las maneras de comer, de Jabir, a través de una cadena de su padre, al-Nu'man y Sufyan."
  fr: "Abu Abd al-Rahman Musa ibn Abd al-Rahman al-Khazzaz, un ascète perspicace de grand mérite, qui restait dans sa maison, chez lui avec le souvenir et ses témoins, et a transmis beaucoup; il a rapporté un rapport sur les manières de manger, de Jabir, à travers une chaîne de son père, al-Nu'man et Sufyan."
  tr: "Ebu Abdülrahman Musa ibn Abdülrahman el-Hazaz, asil ve büyük erdemli bir münzevi, evinde kendini inzivaya çekip anısını ve türbelerini sever ve birçok zanlı rivayet aktarırdı. Babasından al-Nu'man'dan, Sufyan'dan Amr ibn Dinar'dan ve Abu al-Zubayr'dan Jabir'den yemek görgü kuralları üzerine bir hadis anlatırdı."
  id: "Abu Abd al-Rahman Musa ibn Abd al-Rahman al-Khazzaz, pertapa mulia dan berbudi mulia, biasa mengasingkan diri di rumahnya, menikmati kenangan dan makam-makamnya, dan ia menyampaikan banyak rantai cerita. Ia menceritakan dari ayahnya dari al-Nu'man dari Sufyan dari Amr ibn Dinar dan Abu al-Zubayr dari Jabir sebuah hadits tentang etiket makanan."
