summary:
  ar: "مصطفى كامل باشا بن علي محمد (١٨٧٤–١٩٠٨م)؛ نابغة مصر في عصره وأحد مؤسسي حركتها الوطنية. مولده ووفاته في القاهرة. كان أبوه مهندساً فني بتعليمه وتهذيبه فأحرز شهادة الحقوق قبل بلوغه العشرين، وكان فصيحاً ساحر البيان، انصرف إلى مقاومة الاحتلال الإنكليزي بخطبه ومقالاته وكتبه، ورحل إلى باريس فنشر دعوته السياسية في صحفها ومجتمعاتها، ثم عاد إلى مصر فأنشأ جريدة «اللواء» اليومية سنة ١٨٩٩م، وجعل يتنقل في البلاد المصرية والفرنسية والإنكليزية لا يكاد يستقر سعياً وراء استقلال بلاده {cite:al-aalam tarjama}."
  en: "Mustafa Kamil (1874–1908 CE) — founder of Egypt's National Party and its daily al-Liwa' (1899), who spent his short life resisting the British occupation {cite:al-aalam tarjama}."
