summary:
  ar: "مصطفى كامل باشا بن علي محمد ⁦(١٨٧٤–١٩٠٨م)⁩؛ نابغة مصر في عصره وأحد مؤسسي حركتها الوطنية. مولده ووفاته في القاهرة. كان أبوه مهندساً فني بتعليمه وتهذيبه فأحرز شهادة الحقوق قبل بلوغه العشرين، وكان فصيحاً ساحر البيان، انصرف إلى مقاومة الاحتلال الإنكليزي بخطبه ومقالاته وكتبه، ورحل إلى باريس فنشر دعوته السياسية في صحفها ومجتمعاتها، ثم عاد إلى مصر فأنشأ جريدة «اللواء» اليومية سنة ١٨٩٩م، وجعل يتنقل في البلاد المصرية والفرنسية والإنكليزية لا يكاد يستقر سعياً وراء استقلال بلاده {cite:al-aalam tarjama}."
  en: "Mustafa Kamil (1874–1908 CE) — founder of Egypt's National Party and its daily al-Liwa' (1899), who spent his short life resisting the British occupation {cite:al-aalam tarjama}."
  es: "Mustafa Kamil (1874–1908 d. C.) — fundador del Partido Nacional de Egipto y de su diario al-Liwa' (1899), que dedicó su corta vida a resistir la ocupación británica {cite:al-aalam tarjama}."
  fr: "Mustafa Kamil (1874–1908 CE) — fondateur du Parti national égyptien et de son quotidien al-Liwa' (1899), qui a passé sa courte vie à résister à l'occupation britannique {cite:al-aalam tarjama}."
  ur: "مصطفیٰ کامل ⁦(1874-1908 عیسوی)⁩ - مصر کی نیشنل پارٹی اور اس کے روزنامہ اللیوا (1899) کے بانی، جنہوں نے اپنی مختصر زندگی برطانوی قبضے کے خلاف مزاحمت کرتے ہوئے گزاری۔"
  tr: "Mustafa Kamel Paşa bin Ali Muhammad (1874–1908); döneminin Mısır'ın dahisi ve ulusal hareketinin kurucularından biri. Kahire'de doğdu ve öldü. Babası eğitimi ve inceliği açısından teknik mühendisti, yirmi yaşına gelmeden önce hukuk diploması aldı. Etkileyici ve etkileyici bir konuşmacıydı, çekiciydi; konuşmaları, makaleleri ve kitaplarıyla İngiliz işgaline karşı direnmeye kendini adadı. Paris'e seyahat etti ve siyasi çağrısını gazete ve derneklerde yaydı. Daha sonra Mısır'a döndü ve 1899'da günlük gazete 'Al-Liwaa'yı kurdu. Mısır, Fransa ve İngiliz ülkelerini dolaştı, ancak ülkesinin bağımsızlığı için zar zor yerleşti {cite:al-aalam tarjama}."
  id: "Mustafa Kamel Pasha bin Ali Muhammad (1874–1908 M); anak ajaib Mesir pada masanya dan salah satu pendiri gerakan nasionalnya. Ia lahir dan meninggal di Kairo. Ayahnya adalah seorang insinyur teknis secara pendidikan dan kemahiran, meraih gelar hukum sebelum berusia dua puluh tahun. Ia fasih dan fasih, menawan, mendedikasikan diri untuk melawan pendudukan Inggris melalui pidato, artikel, dan bukunya. Ia melakukan perjalanan ke Paris, di mana ia menyebarkan seruan politiknya di surat kabar dan perkumpulannya. Ia kemudian kembali ke Mesir dan mendirikan surat kabar harian 'Al-Liwaa' pada tahun 1899. Ia berkeliling negara-negara Mesir, Prancis, dan Inggris dan hampir menetap demi kemerdekaan negaranya {cite:al-aalam tarjama}."
