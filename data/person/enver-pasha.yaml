summary:
  ar: "قائد عسكري وسياسي عثماني، أبرز «الباشوات الثلاثة» في جمعية الاتحاد والترقي وناظر الحربية من 1914 إلى 1918 والقائد الفعلي للجيوش العثمانية في الحرب العالمية الأولى. قاد كارثة صاريقاميش، وفرّ بعد الهزيمة وحُكم عليه غيابيًا بالإعدام، ثم قاد حركة البسمجيين ضد البلاشفة في آسيا الوسطى وقُتل سنة 1922، وأُعيد دفن رفاته في إسطنبول سنة 1996."
  en: "Ottoman military commander and politician, the leading of the 'Three Pashas' of the Committee of Union and Progress, Minister of War from 1914 to 1918 and de facto commander-in-chief in the First World War. He led the Sarikamish disaster, fled after the defeat and was sentenced to death in absentia, then led the Basmachi against the Bolsheviks in Central Asia and was killed in 1922; his remains were reburied at Istanbul in 1996."
  ur: "عثمانی فوجی کمانڈر اور سیاست دان، جمعیتِ اتحاد و ترقی کے «تین پاشاؤں» میں سرکردہ، 1914 سے 1918 تک وزیرِ حرب اور پہلی جنگِ عظیم میں عملاً سپہ سالار۔ انہوں نے صاریقامش کی تباہی کی قیادت کی، شکست کے بعد فرار ہوئے اور غیر حاضری میں سزائے موت پائی، پھر وسطی ایشیا میں بالشویکوں کے خلاف بسمچی تحریک کی قیادت کی اور 1922 میں مارے گئے؛ ان کی باقیات 1996 میں اسطنبول میں دوبارہ دفن ہوئیں۔"
