summary:
  ar: "باحث مصري في مقارنة الأديان من الجيزة، وُلد في حدود سنة 1985. تعلم العبرية ليقرأ كتب مخالفيه في أصولها، وعمل في النقد النصي للعهد القديم، وأسس سنة 2014 قناة «البينة لمقارنة الأديان والرد على الشبهات» على يوتيوب التي تجاوز مشتركوها مليون مشترك، واعتُقل سنة 2020 ثم أُفرج عنه."
  en: "Egyptian comparative-religion researcher from Giza, born in about 1985. He learned Hebrew in order to read his opponents' books in the original, worked in Old Testament textual criticism, and in 2014 founded the YouTube channel Al-Bayyinah (Comparative Religion and Answering Doubts), whose subscribers passed one million; he was detained in 2020 and later released."
  ur: "جیزہ سے تعلق رکھنے والے مصری محققِ تقابلِ ادیان، جو تقریباً 1985 میں پیدا ہوئے۔ انہوں نے مخالفین کی کتابیں اصل میں پڑھنے کے لیے عبرانی سیکھی، عہدِ قدیم کی تنقیدِ متن پر کام کیا، اور 2014 میں یوٹیوب چینل «البینة لمقارنة الأديان والرد على الشبهات» قائم کیا جس کے سبسکرائبرز دس لاکھ سے تجاوز کر گئے؛ وہ 2020 میں گرفتار ہوئے اور بعد میں رہا کر دیے گئے۔"
