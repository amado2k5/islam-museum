summary:
  ar: "لاعب كرة قدم مالي معتزل، وُلد في فرنسا سنة 1977. مهاجم تألق مع إشبيلية الإسباني وفاز معه بكأس الاتحاد الأوروبي مرتين متتاليتين ⁦(2006 و2007)⁩، ونال جائزة أفضل لاعب أفريقي سنة 2007 — أول لاعب مولود خارج أفريقيا ينالها — وخاض مسيرة في فرنسا وإنجلترا قبل أن يعتزل سنة 2013."
  en: "Malian retired footballer, born in France in 1977. A striker who starred for Sevilla, winning two consecutive UEFA Cups (2006 and 2007), and was named the 2007 African Footballer of the Year — the first player born outside Africa to win the award — after a career in France and England; he retired in 2013."
  ur: "مالی کے ریٹائرڈ فٹبالر، 1977 میں فرانس میں پیدا ہوئے۔ اسٹرائیکر جنہوں نے سیویلا کے ساتھ مسلسل دو یورپی کپ ⁦(2006 اور 2007)⁩ جیتے اور 2007 میں افریقہ کے بہترین فٹبالر قرار پائے — یہ اعزاز پانے والے افریقہ سے باہر پیدا ہونے والے پہلے کھلاڑی — فرانس اور انگلینڈ میں کھیلنے کے بعد 2013 میں ریٹائر ہوئے۔"
  es: "Futbolista maliense retirado, nacido en Francia en 1977. Delantero que brilló en el Sevilla, ganando dos Copas de la UEFA consecutivas (2006 y 2007), y fue nombrado Futbolista Africano del Año 2007 —el primer jugador nacido fuera de África en ganar el premio— tras una carrera en Francia e Inglaterra; se retiró en 2013."
  fr: "Ancien footballeur malien, né en France en 1977. Attaquant vedette du FC Séville, il a remporté deux Coupes UEFA consécutives (2006 et 2007) et a été nommé footballeur africain de l'année 2007 – le premier joueur né hors d'Afrique à remporter ce prix – après une carrière en France et en Angleterre; il a pris sa retraite en 2013."
  tr: "1977'de Fransa doğumlu, emekli Malili futbolcu. İspanya'da Sevilla'da parlayan bir forvet, iki kez üst üste UEFA Kupası'nı kazandı (2006 ve 2007), 2007'de Afrika Yılın Oyuncusu ödülünü kazandı — Afrika dışında doğan ilk oyuncu olarak bu ödülü aldı — ve 2013'te emekli olmadan önce Fransa ve İngiltere'de kariyer yaptı."
  id: "Seorang mantan pesepakbola Mali, lahir di Prancis pada tahun 1977. Seorang penyerang yang bersinar bersama Sevilla di Spanyol, memenangkan Piala UEFA dua kali berturut-turut (2006 dan 2007), dan memenangkan penghargaan African Player of the Year pada tahun 2007 — pemain pertama yang lahir di luar Afrika yang menerimanya — serta berkarier di Prancis dan Inggris sebelum pensiun pada tahun 2013."
