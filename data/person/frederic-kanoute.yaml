summary:
  ar: "لاعب كرة قدم مالي معتزل، وُلد في فرنسا سنة 1977. مهاجم تألق مع إشبيلية الإسباني وفاز معه بكأس الاتحاد الأوروبي مرتين متتاليتين (2006 و2007)، ونال جائزة أفضل لاعب أفريقي سنة 2007 — أول لاعب مولود خارج أفريقيا ينالها — وخاض مسيرة في فرنسا وإنجلترا قبل أن يعتزل سنة 2013."
  en: "Malian retired footballer, born in France in 1977. A striker who starred for Sevilla, winning two consecutive UEFA Cups (2006 and 2007), and was named the 2007 African Footballer of the Year — the first player born outside Africa to win the award — after a career in France and England; he retired in 2013."
  ur: "مالی کے ریٹائرڈ فٹبالر، 1977 میں فرانس میں پیدا ہوئے۔ اسٹرائیکر جنہوں نے سیویلا کے ساتھ مسلسل دو یورپی کپ (2006 اور 2007) جیتے اور 2007 میں افریقہ کے بہترین فٹبالر قرار پائے — یہ اعزاز پانے والے افریقہ سے باہر پیدا ہونے والے پہلے کھلاڑی — فرانس اور انگلینڈ میں کھیلنے کے بعد 2013 میں ریٹائر ہوئے۔"
