summary:
  ar: "ملاكم محترف سوري سابق، وُلد في اللاذقية سنة 1953. احترف من 1975 إلى 1989 بسجل 44 فوزاً و5 خسارات وتعادلين، ونازل بطل العالم مارفلوس مارفن هاغلر على لقب الوزن المتوسط مرتين، في 1981 و1984، وهزم أبطالاً سابقين منهم آلان مينتر وويلفريد بينيتيز."
  en: "Syrian former professional boxer, born in Latakia in 1953. He competed from 1975 to 1989 with a record of 44 wins, 5 losses and 2 draws, twice challenged Marvin Hagler for the world middleweight title, in 1981 and 1984, and defeated former champions including Alan Minter and Wilfred Benítez."
