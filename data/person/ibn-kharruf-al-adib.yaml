summary:
  ar: "أبو الحسن ابن خروف الأديب، وهو غير ابن خروف النحوي؛ شاعر قرطبي روى عن مشيخة بلده، رحل وحج وجاور بالقدس ثم قفل من رحلته إلى الأندلس ثم عاد إلى المشرق فاستوطن حلب وتوفي فيها {cite:wafayat-ayan}."
  tr: "Kordobili dilbilgisi şairi İbn Haruf'tan farklı olan Ebu el-Hasan ibn Haruf el-Adib, kasabasının şeyhliğinden anlatmıştır. Seyahat etti, hac yaptı ve Kudüs'te yaşadı, sonra Endülüs'e yaptığı yolculuktan döndü, ardından doğuya döndü, Halep'e yerleşti ve orada vefat etti {atıf:wafayat-ayan}."
  id: "Abu al-Hasan ibn Kharuf al-Adib, yang berbeda dari Ibn Kharuf penyair tata bahasa dari Cordobi, menceritakan dari kepemimpinan kota tersebut. Ia melakukan perjalanan, melakukan ziarah, dan tinggal di Yerusalem, lalu kembali dari perjalanannya ke al-Andalus, kemudian kembali ke Timur, menetap di Aleppo, dan meninggal di sana {cite:wafayat-ayan}."
