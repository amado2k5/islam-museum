id: person/bakkar-ibn-qutayba
class: person
label: { ar: "بكار بن قتيبة" }
summary:
  ar: "القاضي، جمع ابن طولون القضاة ليخلعوا الموفق من العهد فخلعوا إلا بكاراً فإنه قال أنت أوردت علي كتاباً من المعتمد بولايته العهد فأورد علي كتاباً آخر منه بخلعه فقال ابن طولون غرك الناس بقولهم ما في الدنيا مثل بكار أنت شيخ قد خرفت وحبسه وقيده وأخذ منه جميع عطائه من سنين فكان عشرة آلاف دينار {cite:tarikh-khulafa-minhaj-1434 p. 567}."
  en: "The qadi; when Ibn Tulun convened the judges to depose al-Muwaffaq all consented save Bakkar — 'you showed me a succession document from al-Mu'tamid; show me another deposing him' — 'the people fooled you: none like Bakkar? you're a dotard'; imprisoned, shackled, ten thousand dinars of arrears confiscated {cite:tarikh-khulafa-minhaj-1434 p. 567}."
  es: "El cadí; cuando Ibn Tulun convocó a los jueces para deponer a al-Muwaffaq, todos consintieron excepto Bakkar: «Me mostraste un documento de sucesión de al-Mu'tamid; muéstrame otro que lo deponga»; «el pueblo te engañó: ¿nadie como Bakkar? Eres un viejo verde»; encarcelado, encadenado, diez mil dinares de atrasos confiscados {cite:tarikh-khulafa-minhaj-1434 p. 567}."
  fr: "Le cadi; lorsqu'Ibn Tulun a convoqué les juges pour déposer al-Muwaffaq, tous ont consenti sauf Bakkar — « Tu m'as montré un document de succession d'al-Mu'tamid; montre-m'en un autre le déposant » — « Le peuple t'a trompé: personne comme Bakkar ? Tu es un gâteux »; emprisonné, enchaîné, dix mille dinars d'arriérés confisqués {cite: tarikh-khulafa-minhaj-1434 p. 567}."
  ur: "قادی؛ جب ابن طولون نے الموفق کو معزول کرنے کے لیے ججوں کو بلایا تو سب نے رضامندی ظاہر کی سوائے بکر کے - 'تم نے مجھے المتمد کی جانشینی کی دستاویز دکھائی۔ مجھے ایک اور معزول کر کے دکھاؤ\" - 'لوگوں نے تمہیں بے وقوف بنایا: بکر جیسا کوئی نہیں؟ تم ناقص ہو'؛ قید، بیڑیاں، دس ہزار دینار بقایاجات ضبط کر لیے گئے 567}۔"
  tr: "Hakim İbn Tulun, Al-Muwaffaq'ı ahitten çıkarmak için hakimleri topladı ve onu çıkardılar, sadece Bakar şöyle dedi: 'Bana ahidi koruması altında Al-Mu'tamid'den bir mektup getirdin, o da onu tahttan indiren başka bir mektup getirdi.' İbn Tulun dedi ki, 'Bu dünyada Bakar gibi bir şey yoktur diyerek insanları kandırdın. Sen deli olmuş yaşlı bir adamsın, onu hapsettin, bağladın ve yıllarca tüm armağanlarını ondan aldın, böylece on bin dinar oldu.' {alıntı:Tarikh-khulafa-minhaj-1434, s. 567}."
  id: "Hakim, Ibn Tulun mengumpulkan para hakim untuk mencopot Al-Muwaffaq dari perjanjian, dan mereka menyingkirkannya kecuali Bakar, yang berkata: Kamu membawa surat dari Al-Mu'tamid di bawah pengawasannya atas perjanjian, dan dia membawa surat lain darinya yang mencopotkannya. Ibn Tulun berkata, 'Kamu telah menipu orang dengan mengatakan, tidak ada yang seperti Bakar di dunia ini. Kamu adalah orang tua yang telah gila, memenjarakannya, mengikatnya, dan mengambil semua hadiahnya selama bertahun-tahun, sehingga jumlahnya sepuluh ribu dinar.' {cite:Tarikh-khulafa-minhaj-1434, hlm. 567}."
