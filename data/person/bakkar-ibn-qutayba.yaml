label: { ar: "بكار بن قتيبة" }
summary:
  ar: "القاضي، جمع ابن طولون القضاة ليخلعوا الموفق من العهد فخلعوا إلا بكاراً فإنه قال أنت أوردت علي كتاباً من المعتمد بولايته العهد فأورد علي كتاباً آخر منه بخلعه فقال ابن طولون غرك الناس بقولهم ما في الدنيا مثل بكار أنت شيخ قد خرفت وحبسه وقيده وأخذ منه جميع عطائه من سنين فكان عشرة آلاف دينار {cite:tarikh-khulafa-minhaj-1434 p. 567}."
  en: "The qadi; when Ibn Tulun convened the judges to depose al-Muwaffaq all consented save Bakkar — 'you showed me a succession document from al-Mu'tamid; show me another deposing him' — 'the people fooled you: none like Bakkar? you're a dotard'; imprisoned, shackled, ten thousand dinars of arrears confiscated {cite:tarikh-khulafa-minhaj-1434 p. 567}."
