summary:
  ar: "عالم كيمياء حيوية تركي أمريكي، وُلد في ساوور بمحافظة ماردين سنة 1946 لأسرة متواضعة غير متعلمة، ودرس الطب في جامعة إسطنبول ثم نال الدكتوراه من جامعة تكساس في دالاس سنة 1977، ورسم خريطة آلية إصلاح الحمض النووي بالاستئصال النوكليوتيدي ودرس إنزيم الفوتولياز والساعة البيولوجية، ونال جائزة نوبل في الكيمياء سنة 2015 مع توماس ليندال وبول مودريتش، وهو أستاذ في جامعة نورث كارولاينا في تشابل هيل ومؤسس مشارك لمؤسسة عزيز وغوين سانجار."
  en: "Turkish-American biochemist, born in Savur, Mardin Province, in 1946 to a poor, uneducated family. He studied medicine at Istanbul University, took his doctorate at the University of Texas at Dallas in 1977, mapped the mechanism of nucleotide excision repair of DNA and worked on photolyase and the circadian clock, and received the 2015 Nobel Prize in Chemistry with Tomas Lindahl and Paul L. Modrich. He is a professor at the University of North Carolina at Chapel Hill and co-founder of the Aziz & Gwen Sancar Foundation."
  ur: "ترکی نژاد امریکی ماہرِ حیاتیاتی کیمیا، جو 1946 میں محافظہ ماردین کے ساوور میں ایک غریب اور ناخواندہ خاندان میں پیدا ہوئے۔ انہوں نے جامعہ استنبول سے طب پڑھی، 1977 میں یونیورسٹی آف ٹیکساس ایٹ ڈیلاس سے ڈاکٹریٹ لی، ڈی این اے کی مرمت کے طریقۂ کار کا نقشہ بنایا اور فوٹولائیز اور حیاتیاتی گھڑی پر کام کیا، اور 2015 میں ٹوماس لنڈال اور پال موڈرچ کے ساتھ کیمسٹری کا نوبل انعام پایا۔ وہ یونیورسٹی آف نارتھ کیرولائنا، چیپل ہل میں استاد اور عزیز و گوین سنجر فاؤنڈیشن کے شریک بانی ہیں۔"
