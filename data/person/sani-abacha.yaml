summary:
  ar: "ضابط نيجيري (1943–1998) وُلد في كانو لأبوين من الكانوري، صار حاكم نيجيريا العسكري بانقلاب قصري في نوفمبر 1993 فحكم حتى وفاته المفاجئة في أبوجا في 8 يونيو 1998؛ اتسم حكمه بانتهاكات واسعة لحقوق الإنسان وإعدام كين سارو-ويوا واتهامات بنهب مليارات الدولارات. دُفن في اليوم نفسه في كانو وفق التقاليد الإسلامية، وخلفه عبد السلام أبو بكر فمهّد لعودة الحكم المدني."
  en: "Nigerian officer (1943–1998) born in Kano to Kanuri parents who became Nigeria's military ruler by a palace coup in November 1993 and ruled until his sudden death in Abuja on 8 June 1998. His rule was marked by wide human-rights abuses, the execution of Ken Saro-Wiwa and allegations of looting billions of dollars. He was buried the same day in Kano according to Muslim tradition, and was succeeded by Abdulsalami Abubakar, who led the return to civilian rule."
  ur: "نائجریائی افسر (1943ء–1998ء)، کانو میں کانوری والدین کے ہاں پیدا ہوئے؛ نومبر 1993 میں محلاتی بغاوت سے نائجریا کے فوجی حکمران بنے اور 8 جون 1998 کو ابوجا میں اچانک وفات تک حکمران رہے؛ ان کے دور پر انسانی حقوق کی وسیع خلاف ورزیوں، کین سارو-ویوا کی پھانسی اور اربوں ڈالر کی لوٹ کے الزامات لگے؛ اسی دن کانو میں مسلم روایت کے مطابق دفن ہوئے اور عبد السلام ابوبکر ان کے جانشین بنے۔"
