summary:
  ar: "يعقوب بن إسحاق الكندي فيلسوف العرب، عده المسعودي فيمن طرأ بعد ظهور الإسلام ممن عُني بعلوم الهيئة مع ابن المنجم وأحمد بن الطيب وأبي معشر والخوارزمي والفرغاني وثابت بن قرة والتبريزي ومحمد بن جابر البتاني {cite:muruj-al-dhahab p. 519}. وعند المسعودي صنف رسالة في مقالتين في إبطال دعوى المدعين صنعة الذهب والفضة من غير معادنها يذكر فيها تعذر فعل الناس لما انفردت الطبيعة بفعله وخدع أهل هذه الصناعة وحيلهم {cite:muruj-al-dhahab p. 619-620}، وهو أبو يوسف يعقوب بن إسحاق بن الصباح بن عمران بن إسماعيل بن محمد بن الأشعث بن قيس الكندي بن معدي كرب، فاضل دهره وواحد عصره في معرفة العلوم القديمة بأسرها ويسمى فيلسوف العرب وكتبه في علوم مختلفة مثل المنطق والفلسفة والهندسة والحساب والأرماطيقي والموسيقى والنجوم، وكان بخيلا {cite:fihrist-ibn-al-nadim p. 357} وتذكر دائرة المعارف الإسلامية أنه عالم موسوعي وفيلسوف عاش في زمن الترجمات والجدل حول الاعتزال، وكان من جلساء المأمون والمعتصم، وفقد حظوته في عهد المتوكل، وأنه دافع عن الفلسفة بوصفها موافقة لرسالة الأنبياء، وكتب في البصريات والأدوية المركبة والفلك."
  en: "Ya'qub ibn Ishaq al-Kindi, called the philosopher of the Arabs, is named by al-Mas'udi among the post-Islamic masters of astronomy {cite:muruj-al-dhahab p. 519}. The Encyclopaedia of Islam calls him an eminent universal scholar who lived in the age of the translations and the Mu'tazili controversies, a companion of the caliphs al-Ma'mun and al-Mu'tasim who fell into disfavour under al-Mutawakkil. It reports his defence of philosophy as consistent with the prophets' message and his work on optics, compound medicines and astrology."
  ur: "یعقوب بن اسحاق کندی، جنہیں فیلسوفِ عرب کہا جاتا ہے، مسعودی کے مطابق اسلام کے بعد کے علمِ ہیئت کے ماہرین میں شمار ہوتے ہیں {cite:muruj-al-dhahab p. 519}۔ اسلامی انسائیکلوپیڈیا انہیں ترجموں اور معتزلی مباحث کے دور کا ہمہ گیر عالم بتاتا ہے جو مامون اور معتصم کے ہم نشین تھے اور متوکل کے دور میں ناپسندیدہ ہوئے۔ مضمون کے مطابق انہوں نے فلسفے کو انبیا کے پیغام سے ہم آہنگ بتا کر اس کا دفاع کیا اور بصریات، مرکب دواؤں اور نجوم پر لکھا۔"
  es: "Ya'qub ibn Ishaq al-Kindi, llamado el filósofo de los árabes, es mencionado por al-Mas'udi entre los maestros de la astronomía postislámica {cite:muruj-al-dhahab p. 519}. La Enciclopedia del Islam lo describe como un eminente erudito universal que vivió en la época de las traducciones y las controversias mu'tazilíes, compañero de los califas al-Ma'mun y al-Mu'tasim, quienes cayeron en desgracia bajo el mandato de al-Mutawakkil. En ella se destaca su defensa de la filosofía como coherente con el mensaje de los profetas y su trabajo sobre óptica, medicina compuesta y astrología."
  fr: "Ya'qub ibn Ishaq al-Kindi, surnommé le philosophe des Arabes, est cité par al-Mas'udi parmi les maîtres de l'astronomie post-islamiques (voir Muruj-al-Dhahab, p. 519). L'Encyclopédie de l'Islam le décrit comme un éminent savant universel ayant vécu à l'époque des traductions et des controverses mu'tazilites, compagnon des califes al-Ma'mun et al-Mu'tasim, tombé en disgrâce sous al-Mutawakkil. Elle rapporte sa défense d'une philosophie conforme au message prophétique ainsi que ses travaux sur l'optique, la médecine composée et l'astrologie."
  tr: "Yaqub bin İshaq al-Kindi, Arapların filozofuydu. El-Mes'udi, onu İslam'ın gelişinden sonra astronomi bilimleriyle ilgilenen kişiler arasında sayar; bunlar arasında İbn el-Munajj, Ahmed ibn al-Tayyib, Ebu Ma'shar, el-Horizmi, el-Farghani, Tebit bin Kurre, el-Tebrizi ve Muhammed ibn Cabir el-Battani {cite:muruj-al-dhahab, s. 519} ile birlikte astronomi bilimleriyle ilgilenenler arasında sayılır. El-Mes'udi'ye göre, altın ve gümüşü metal olmayan malzemelerden üretme iddiasını çürüten iki makale yazmış, doğanın kendisine özgü olduğu durumlarda insanların hareket etmesinin imkansız olduğunu ve bu zanaatı kandırmalarını belirtmiştir {atıf:muruj-al-dhahab s. 619-620}. Kendisi, döneminde seçkin ve tüm eski bilimleri anlamada eşsiz olan Ebu Yusuf Ya'qub ibn İshaq ibn İshaq ibn el-Sebbe ibn İmran ibn İsmail ibn Muhammed ibn el-Eşat ibn Kays al-Kindi ibn Ma'di Karb'dır. Arapların filozofu olarak anılır ve kitapları mantık gibi çeşitli bilimlerdedir. Felsefe, geometri, aritmetik, aritmetik, müzik ve yıldızlar. Cimriydi {atıf:fihrist-ibn-al-nadim s. 357}. İslam Ansiklopedisi, onun Mu'taziller hakkında çeviri ve tartışmalar çağında yaşamış ansiklopedik bir âlim ve filozof olduğunu kaydeder. El-Me'mun ve el-Mutasim'in yoldaşıydı, ancak el-Mutevakil döneminde gözünde durdu. Felsefeyi peygamberlerin kehaneti olarak savundu ve optik, bileşik tıp ve astronomi üzerine yazdı."
  id: "Yaqub ibn Ishaq al-Kindi adalah filsuf bangsa Arab. Al-Mas'udi menganggapnya sebagai salah satu dari mereka yang muncul setelah kedatangan Islam yang peduli pada ilmu astronomi, bersama Ibn al-Munajj, Ahmad ibn al-Tayyib, Abu Ma'shar, al-Khwarizmi, al-Farghani, Thabit ibn Qurrah, al-Tabrizi, dan Muhammad ibn Jabir al-Battani {cite:muruj-al-dhahab, hlm. 519}. Menurut Al-Mas'udi, ia menulis sebuah risalah dalam dua esai yang membantah klaim para penuntut untuk membuat emas dan perak dari non-logam, di mana ia menyebutkan ketidakmungkinan bagi manusia bertindak ketika alam adalah uniknya dan menipu orang-orang dalam kerajinan ini {cite:muruj-al-dhahab hlm. 619-620}. Ia adalah Abu Yusuf Ya'qub ibn Ishaq ibn al-Sabbah ibn Imran ibn Ismail ibn Muhammad ibn al-Ash'ath ibn Qays al-Kindi ibn Ma'di Karb, yang terkenal pada zamannya dan unik dalam memahami semua ilmu pengetahuan kuno. Ia disebut filsuf bangsa Arab, dan buku-bukunya membahas berbagai ilmu seperti logika. Filsafat, geometri, aritmatika, aritmatika, musik, dan bintang. Ia pelit {cite:fihrist-ibn-al-nadim hlm. 357}. Ensiklopedia Islam mencatat bahwa ia adalah seorang ulama ensiklopedis dan filsuf yang hidup pada era penerjemahan dan perdebatan tentang Mu'tazil. Ia adalah sahabat al-Ma'mun dan al-Mu'tasim, tetapi kehilangan popularitasnya selama masa pemerintahan al-Mutawakkil. Ia membela filsafat sebagai nubuat para nabi, dan menulis tentang optik, pengobatan majemuk dan astronomi."
