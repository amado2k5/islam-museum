id: person/al-kindi
class: person
label: { ar: "الكندي", en: "al-Kindi" }
summary:
  ar: "يعقوب بن إسحاق الكندي فيلسوف العرب، عده المسعودي فيمن طرأ بعد ظهور الإسلام ممن عُني بعلوم الهيئة مع ابن المنجم وأحمد بن الطيب وأبي معشر والخوارزمي والفرغاني وثابت بن قرة والتبريزي ومحمد بن جابر البتاني {cite:muruj-al-dhahab p. 519}. وعند المسعودي صنف رسالة في مقالتين في إبطال دعوى المدعين صنعة الذهب والفضة من غير معادنها يذكر فيها تعذر فعل الناس لما انفردت الطبيعة بفعله وخدع أهل هذه الصناعة وحيلهم {cite:muruj-al-dhahab p. 619-620}، وهو أبو يوسف يعقوب بن إسحاق بن الصباح بن عمران بن إسماعيل بن محمد بن الأشعث بن قيس الكندي بن معدي كرب، فاضل دهره وواحد عصره في معرفة العلوم القديمة بأسرها ويسمى فيلسوف العرب وكتبه في علوم مختلفة مثل المنطق والفلسفة والهندسة والحساب والأرماطيقي والموسيقى والنجوم، وكان بخيلا {cite:fihrist-ibn-al-nadim p. 357}"
  en: "Ya'qub ibn Ishaq al-Kindi — 'philosopher of the Arabs' — named by al-Mas'udi among the post-Islamic masters of astronomy alongside al-Munajjim's son, Ahmad ibn al-Tayyib, Abu Ma'shar, al-Khwarizmi, al-Farghani, Thabit, al-Tabrizi and al-Battani {cite:muruj-al-dhahab p. 519}."
