    summary:
      ar: "يستعمل المتحف إطاره السني مع إظهار الخلاف، لا بوصفه تصريحاً شخصياً من الكندي. يرى محمود كايا أن الاشتراك في المسائل لا يثبت الانتساب للمعتزلة، ويفرق بين المنهج الفلسفي والكلامي."
      en: "The museum uses its Sunni frame with the disagreement visible, not as al-Kindi's personal declaration. Mahmut Kaya argues that shared questions do not establish Mu'tazili membership and distinguishes philosophical and theological methods."
      ur: "میوزیم اختلاف ظاہر رکھتے ہوئے اپنا سنی سیاق لیتا ہے، اسے کندی کا ذاتی اعلان نہیں کہتا۔ محمود کایا کے مطابق مشترک سوال معتزلی وابستگی ثابت نہیں کرتے؛ فلسفیانہ اور کلامی طریقے مختلف ہیں۔"
    sources: [source/tdv-kindi-kaya]
  - tradition: academic
