    stance: { ar: "تصنيفات مخالفة يعرضها كايا", en: "Contrary classifications reported by Kaya", ur: "کایا کی نقل کردہ مختلف درجہ بندیاں" }
    summary:
      ar: "يعرض كايا تصنيف ريتشارد فالزر وت. ي. دي بور للكندي معتزلياً ثم يناقشه. تنقل المقالة هذا الخلاف من عرض كايا؛ لم تقرأ هنا المؤلفات الأصلية لهذين الباحثين."
      en: "Kaya reports Richard Walzer's and T. J. de Boer's Mu'tazili classifications, then challenges them. Their positions are reported through Kaya; the original publications were not read here."
      ur: "کایا رچرڈ والزر اور ٹی جے ڈی بور کی معتزلی نسبت نقل کر کے اس پر اعتراض کرتے ہیں۔ یہاں ان کی آرا کایا کے واسطے سے ہیں؛ اصل تصانیف نہیں پڑھی گئیں۔"
