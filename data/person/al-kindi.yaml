label: { ar: "الكندي", en: "al-Kindi", ur: "کندی" }
summary:
  ar: "يعقوب بن إسحاق الكندي فيلسوف العرب، عده المسعودي فيمن طرأ بعد ظهور الإسلام ممن عُني بعلوم الهيئة مع ابن المنجم وأحمد بن الطيب وأبي معشر والخوارزمي والفرغاني وثابت بن قرة والتبريزي ومحمد بن جابر البتاني {cite:muruj-al-dhahab p. 519}. وعند المسعودي صنف رسالة في مقالتين في إبطال دعوى المدعين صنعة الذهب والفضة من غير معادنها يذكر فيها تعذر فعل الناس لما انفردت الطبيعة بفعله وخدع أهل هذه الصناعة وحيلهم {cite:muruj-al-dhahab p. 619-620}، وهو أبو يوسف يعقوب بن إسحاق بن الصباح بن عمران بن إسماعيل بن محمد بن الأشعث بن قيس الكندي بن معدي كرب، فاضل دهره وواحد عصره في معرفة العلوم القديمة بأسرها ويسمى فيلسوف العرب وكتبه في علوم مختلفة مثل المنطق والفلسفة والهندسة والحساب والأرماطيقي والموسيقى والنجوم، وكان بخيلا {cite:fihrist-ibn-al-nadim p. 357} وتذكر دائرة المعارف الإسلامية أنه عالم موسوعي وفيلسوف عاش في زمن الترجمات والجدل حول الاعتزال، وكان من جلساء المأمون والمعتصم، وفقد حظوته في عهد المتوكل، وأنه دافع عن الفلسفة بوصفها موافقة لرسالة الأنبياء، وكتب في البصريات والأدوية المركبة والفلك."
  en: "Ya'qub ibn Ishaq al-Kindi, called the philosopher of the Arabs, is named by al-Mas'udi among the post-Islamic masters of astronomy {cite:muruj-al-dhahab p. 519}. The Encyclopaedia of Islam calls him an eminent universal scholar who lived in the age of the translations and the Mu'tazili controversies, a companion of the caliphs al-Ma'mun and al-Mu'tasim who fell into disfavour under al-Mutawakkil. It reports his defence of philosophy as consistent with the prophets' message and his work on optics, compound medicines and astrology."
  ur: "یعقوب بن اسحاق کندی، جنہیں فیلسوفِ عرب کہا جاتا ہے، مسعودی کے مطابق اسلام کے بعد کے علمِ ہیئت کے ماہرین میں شمار ہوتے ہیں {cite:muruj-al-dhahab p. 519}۔ اسلامی انسائیکلوپیڈیا انہیں ترجموں اور معتزلی مباحث کے دور کا ہمہ گیر عالم بتاتا ہے جو مامون اور معتصم کے ہم نشین تھے اور متوکل کے دور میں ناپسندیدہ ہوئے۔ مضمون کے مطابق انہوں نے فلسفے کو انبیا کے پیغام سے ہم آہنگ بتا کر اس کا دفاع کیا اور بصریات، مرکب دواؤں اور نجوم پر لکھا۔"
