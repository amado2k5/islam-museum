summary:
  ar: "مخرج ومنتج وكاتب سيناريو إيراني، وُلد سنة 1959 ونشأ في طهران؛ بدأ ممثلًا ثم صنع أفلامًا إنسانية تتمحور على الأطفال والأسرة والفقر، أشهرها «أطفال الجنة» (1997)، أول فيلم إيراني يُرشّح لجائزة الأوسكار، و«لون الجنة» (1999) و«باران» (2001) و«أغنية العصافير» (2008)، وأخرج «محمد رسول الله» (2015)، ملحمة عن طفولة النبي محمد لم يُظهَر فيها وجهه، ويُعدّ من أكثر مخرجي إيران تتويجًا دوليًا."
  en: "Iranian filmmaker, producer and screenwriter, born in 1959 and brought up in Tehran. He began as an actor, then made humanistic films centred on children, family and poverty, most notably Children of Heaven (1997), the first Iranian film nominated for an Academy Award, The Color of Paradise (1999), Baran (2001) and The Song of Sparrows (2008); he directed Muhammad: The Messenger of God (2015), an epic on Muhammad's childhood in which his face is never shown, and is among Iran's most internationally awarded directors."
  ur: "ایرانی فلم ساز، فلم پروڈیوسر و منظر نویس، 1959 میں پیدا ہوئے اور تہران میں پلے بڑھے؛ اداکار کے طور پر آغاز کے بعد انھوں نے بچوں، خاندان اور غربت پر مرکوز انسان دوست فلمیں بنائیں، جن میں نمایاں ترین «آسمان کے بچے» (1997) ہے — اکیڈمی ایوارڈ کے لیے نامزد ہونے والی پہلی ایرانی فلم — اور «جنت کا رنگ» (1999)، «باران» (2001) اور «چڑیوں کا گیت» (2008) شامل ہیں؛ انھوں نے «محمد رسول اللہ» (2015) بنائی، جو محمد کے بچپن پر ایک مہاکاوی فلم ہے جس میں ان کا چہرہ کبھی دکھایا نہیں گیا، اور وہ ایران کے سب سے زیادہ بین الاقوامی اعزاز یافتہ ہدایت کاروں میں سے ہیں۔"
