id: person/ibn-tayfur-al-tabib
class: person
label: { ar: "ابن طيفور الطبيب" }
summary:
  ar: "طبيب المنتصر، دس إليه الأتراك ثلاثين ألف دينار في مرضه فأشار بفصده ثم فصده بريشة مسمومة فمات، ويقال إنه نسي ومرض فأمر غلامه ففصده بتلك الريشة فمات أيضاً {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  en: "Al-Muntasir's physician; the Turks slipped him thirty thousand dinars in the caliph's illness — he counselled phlebotomy then bled him with a poisoned feather, and he died; or he himself sickened, sent his servant, who bled him with the same feather and also died {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  es: "Médico de Al-Muntasir; los turcos le dieron treinta mil dinares durante la enfermedad del califa; él le aconsejó una flebotomía y luego le practicó una sangría con una pluma envenenada, y murió; o bien él mismo enfermó, envió a su sirviente, quien le practicó una sangría con la misma pluma y también murió {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  fr: "Le médecin d'Al-Muntasir; les Turcs lui ont glissé trente mille dinars lors de la maladie du calife — il a conseillé une phlébotomie puis l'a saigné avec une plume empoisonnée, et il est mort; ou bien il est tombé malade lui-même, a envoyé son serviteur, qui l'a saigné avec la même plume et est également mort {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  ur: "المنتصر کا طبیب؛ خلیفہ کی بیماری میں ترکوں نے اسے تیس ہزار دینار تھوپ دیے - اس نے فلیبوٹومی کا مشورہ دیا پھر اسے زہر آلود پنکھ سے خون دیا اور وہ مر گیا۔ یا اس نے خود بیمار ہو کر اپنے نوکر کو بھیجا جس نے اسی پر سے اس کا خون بہایا اور وہ بھی فوت ہو گیا۔ 553-554}۔"
