summary:
  ar: "طبيب المنتصر، دس إليه الأتراك ثلاثين ألف دينار في مرضه فأشار بفصده ثم فصده بريشة مسمومة فمات، ويقال إنه نسي ومرض فأمر غلامه ففصده بتلك الريشة فمات أيضاً {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  en: "Al-Muntasir's physician; the Turks slipped him thirty thousand dinars in the caliph's illness — he counselled phlebotomy then bled him with a poisoned feather, and he died; or he himself sickened, sent his servant, who bled him with the same feather and also died {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
