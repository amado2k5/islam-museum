summary:
  ar: "عمر رشدي باشا (1843 – 23 يوليو 1922)، مشير عثماني من كوتاهية خدم في الجيش أكثر من نصف قرن، وقاد الجيش الخامس في الشام وقوات الاحتياط في حرب 1897، وصار بعد إنشاء وزارة الحرب سنة 1908 أول وزرائها ثم عضوًا في مجلس الأعيان."
  en: "Ömer Rüşdü Pasha (1843 – 23 July 1922) was an Ottoman field marshal from Kütahya who served in the army for over half a century, commanded the Fifth Army at Damascus and the reserve forces in the Greco-Turkish War of 1897, and in 1908 became the first Minister of War after the ministry replaced the Seraskerlik; he later sat in the Senate."
  ur: "عمر رشدی پاشا (1843ء – 23 جولائی 1922ء)، کوتاہیہ سے تعلق رکھنے والے عثمانی مشیر؛ نصف صدی سے زائد فوج میں رہے، دمشق میں پانچویں فوج اور 1897ء کی جنگ میں احتیاطی افواج کی کمان کی، اور 1908ء میں وزارتِ جنگ کے قیام پر اس کے پہلے وزیر بنے، بعد ازاں مجلسِ اعیان کے رکن ہوئے۔"
