summary:
  ar: "عمر رشدي باشا ⁦(1843 – 23 يوليو 1922)⁩، مشير عثماني من كوتاهية خدم في الجيش أكثر من نصف قرن، وقاد الجيش الخامس في الشام وقوات الاحتياط في حرب 1897، وصار بعد إنشاء وزارة الحرب سنة 1908 أول وزرائها ثم عضوًا في مجلس الأعيان."
  en: "Ömer Rüşdü Pasha (1843 – 23 July 1922) was an Ottoman field marshal from Kütahya who served in the army for over half a century, commanded the Fifth Army at Damascus and the reserve forces in the Greco-Turkish War of 1897, and in 1908 became the first Minister of War after the ministry replaced the Seraskerlik; he later sat in the Senate."
  ur: "عمر رشدی پاشا ⁦(1843ء – 23 جولائی 1922ء)⁩، کوتاہیہ سے تعلق رکھنے والے عثمانی مشیر؛ نصف صدی سے زائد فوج میں رہے، دمشق میں پانچویں فوج اور 1897ء کی جنگ میں احتیاطی افواج کی کمان کی، اور 1908ء میں وزارتِ جنگ کے قیام پر اس کے پہلے وزیر بنے، بعد ازاں مجلسِ اعیان کے رکن ہوئے۔"
  es: "Ömer Rüşdü Pasha (1843 – 23 de julio de 1922) fue un mariscal de campo otomano de Kütahya que sirvió en el ejército durante más de medio siglo, comandó el Quinto Ejército en Damasco y las fuerzas de reserva en la guerra greco-turca de 1897, y en 1908 se convirtió en el primer Ministro de Guerra después de que el ministerio reemplazara al Seraskerlik; posteriormente ocupó un escaño en el Senado."
  fr: "Ömer Rüşdü Pacha (1843 – 23 juillet 1922) était un maréchal ottoman de Kütahya qui a servi dans l'armée pendant plus d'un demi-siècle, a commandé la Cinquième Armée à Damas et les forces de réserve lors de la guerre gréco-turque de 1897, et est devenu en 1908 le premier ministre de la Guerre après que le ministère a remplacé le Seraskerlik; il a ensuite siégé au Sénat."
  tr: "Omar Rushdi Paşa (1843 – 23 Temmuz 1922), Kutahya'dan bir Osmanlı mareşaliydi; yarım yüzyıldan fazla bir süre orduda görev yapmış, Levant'ta Beşinci Ordu'ya komuta etmiş ve 1897 savaşı sırasında yedek kuvvetlere komuta etmiştir. 1908'de Savaş Bakanlığı'nın kurulmasından sonra, ilk bakanı ve ardından Senato üyesi olmuştur."
  id: "Omar Rushdi Pasha (1843 – 23 Juli 1922) adalah seorang marsekal Ottoman dari Kutahya yang bertugas di tentara selama lebih dari setengah abad, memimpin Tentara Kelima di Levant dan pasukan cadangan selama perang tahun 1897. Setelah pembentukan Kementerian Perang pada tahun 1908, ia menjadi menteri pertamanya, kemudian anggota Senat."
