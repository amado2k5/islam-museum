label:
  ar: "عبيد الله بن عمر القواريري"
  en: "Ubayd Allah ibn Umar al-Qawariri"
  fr: "Ubayd Allah ibn Umar al-Qawariri"
  es: "Ubayd Allah ibn Umar al-Qawariri"
  ur: "عبید اللہ بن عمر القواریری"
aliases: [person/ubayd-allah-ibn-umar-al-qawariri]
roles: [scholar, jurist]
summary:
  ar: "أبو سعيد عبيد الله بن عمر بن ميسرة الجشمي مولاهم المعروف بالقواريري، بصري سكن بغداد وحدّث بها عن حماد بن زيد وأبي عوانة وعبد الوارث بن سعيد ومسلم بن خالد وسفيان بن عيينة وهشيم ومعتمر بن سليمان ويحيى بن سعيد القطان وعبد الرحمن بن مهدي ومحمد بن جعفر غندر وخالد بن الحارث؛ روى عنه أبو داود السجستاني وأبو زرعة وأبو حاتم الرازيان وأحمد بن أبي خيثمة والحارث بن أبي أسامة وإبراهيم الحربي وعبد الله بن أحمد بن حنبل وصالح بن محمد جزرة وأبو القاسم البغوي وغيرهم؛ قال إن أحمد بن حنبل كتب عنه وهو في الحبس حديثين، وقال يحيى بن معين: القواريري ثقة، وقال أحمد بن سيار: لم أر مثل مسدد بالبصرة والقواريري ببغداد وصدقة بمرو {cite:tarikh-baghdad-khatib j.9 p.320-321}. وذُكر في خبر المحنة ممتحَناً: امتنع فقُيّد ثم أجاب في الثالثة، وعابه المأمون في كتابه بقبول الرشا والمصانعات {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  en: "Abu Sa'id al-Qawariri — a Basran traditionist settled at Baghdad whose students include Abu Dawud, Abu Zur'a and Abu Hatim; Ahmad ibn Hanbal wrote two hadiths from him while in prison and Ibn Ma'in graded him trustworthy {cite:tarikh-baghdad-khatib j.9 p.320-321}. In the mihna he held out, was shackled, then answered on the third day — al-Ma'mun's letter censured his taking of bribes and favour-gifts {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  fr: "Abu Sa'id al-Qawariri - un traditionaliste Basran installé à Bagdad dont les étudiants comprennent Abu Dawud, Abu Zur'a et Abu Hatim ; Ahmad ibn Hanbal a écrit deux hadiths de lui alors qu'il était en prison et Ibn Ma'in l'a classé digne de confiance {cite:tarikh-baghdad-khatib j.9 p.320-321}. Dans la mihna, il a tenu, a été enchaîné, puis répondu le troisième jour – la lettre d’al-Ma’mun a censuré sa réception de pots-de-vin et de cadeaux {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  es: "Abu Sa'id al-Qawariri, un tradicionalista de Basora afincado en Bagdad, entre cuyos discípulos se encuentran Abu Dawud, Abu Zur'a y Abu Hatim; Ahmad ibn Hanbal transcribió dos hadices suyos mientras estaba en prisión e Ibn Ma'in lo consideró digno de confianza {cite:tarikh-baghdad-khatib j.9 p.320-321}. En la mihna se mantuvo firme, fue encadenado y respondió al tercer día; la carta de al-Ma'mun censuró que aceptara sobornos y favores {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  ur: "ابو سعید القواریری - بغداد میں آباد بصری روایت پسند جن کے شاگردوں میں ابو داؤد، ابو زرعہ اور ابو حاتم شامل ہیں۔ احمد بن حنبل نے جیل میں ان سے دو احادیث لکھیں اور ابن معین نے ان کو ثقہ قرار دیا۔ مہنہ میں اس نے پکڑا، بیڑیاں ڈالی گئیں، پھر تیسرے دن جواب دیا - المامون کے خط میں اس کے رشوت لینے اور تحائف لینے کی مذمت کی گئی ہے۔ 490,492-493}۔"
  tr: "Bağdatlı bir Basri sakini olan özgür katili Ebu Sa'id Ubayd Allah ibn Umar ibn Umar ibn Maysarah al-Jashmi, Bağdat'ta yaşayan bir Basri sakini olarak bilinen el-Kawariri olarak bilinir; burada Hammad ibn Zayd, Ebu Awanah, Abd al-Warith bin Sa'id, Muslim ibn Khalid, Sufyan ibn 'Uyaynah, Hishim, Mu'temir ibn Suleyman, Yahya ibn Sa'id al-Qattan, Abd al-Rahman ibn Mahdi, Muhammed bin Ja'far Ghandar, Khalid ibn al-Harith'ten rivayet etmiştir; Ebu Davud el-Sijani, Ebu Zur'ah, Ebu Hatim el-Razyan, Ahmed ibn Abi Khaythamah, el-Harit ibn Ebi Usama, İbrahim el-Harbi ve Abdullah ibn tarafından ondan rivayet edilmiştir Ahmed ibn Hanbal, Salih ibn Muhammed Cezre, Ebu el-Kasım el-Baghawi ve diğerleri; Ahmed ibn Hanbal'ın hapisteyken onun hakkında iki hadis yazdığı söylenir. Yahya ibn Ma'in şöyle dedi: El-Kavari güvenilirdir, Ahmed ibn Sayyar ise: Musaddad gibi birini Basra'da, El-Kavariri'yi Bağdat'ta, Mer'de hayırsever gibi birini görmedim. {atıf:Tarikh-baghdad-khatib J.9, s.320-321} dedi. Yaşanan sınavın anlatımında, bir ölen reddetti ancak üçüncü gün cevap verdi ve el-Me'mun kitabında onu rüşvet ve sığınaklar kabul etmekle eleştirdi {atıf:Tarikh-khulafa-minhaj-1434 s. 490,492-493}."
  id: "Abu Sa'id Ubayd Allah ibn Umar ibn Maysarah al-Jashmi, mantan mereka yang dikenal sebagai al-Qawariri, seorang penduduk Basri di Baghdad, menceritakan di sana dari Hammad ibn Zayd, Abu Awanah, Abd al-Warith ibn Sa'id, Muslim ibn Khalid, Sufyan ibn 'Uyaynah, Hishim, Mu'tamir ibn Sulayman, Yahya ibn Sa'id al-Qattan, Abd al-Rahman ibn Mahdi, Muhammad ibn Ja'far Ghandar, Khalid ibn al-Harith; diceritakan darinya oleh Abu Dawud al-Sijistani, Abu Zur'ah, Abu Hatim al-Razyan, Ahmad ibn Abi Khaythamah, al-Harith ibn Abi Usama, Ibrahim al-Harbi, dan Abdullah ibn Ahmad ibn Hanbal, Salih ibn Muhammad Jazrah, Abu al-Qasim al-Baghawi, dan lainnya; dikatakan bahwa Ahmad ibn Hanbal menulis dua hadis tentangnya saat dia di penjara. Yahya ibn Ma'in berkata: Al-Qawariri dapat dipercaya, dan Ahmad ibn Sayyar berkata: Aku belum pernah melihat siapa pun seperti Musaddad di Basra, Al-Qawariri di Baghdad, dan amal di Marw. {cite:Tarikh-baghdad-khatib J.9, hlm.320-321}. Dalam kisah penderitaan itu, ia menyebutkan sebagai tester: seorang almarhum menolak tetapi kemudian menjawab pada hari ketiga, dan al-Ma'mun mengkritiknya dalam bukunya karena menerima suap dan tempat suci {cite:Tarikh-khulafa-minhaj-1434 hlm. 490,492-493}."
