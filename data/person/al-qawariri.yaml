label:
  ar: "عبيد الله بن عمر القواريري"
  en: "Ubayd Allah ibn Umar al-Qawariri"
aliases: [person/ubayd-allah-ibn-umar-al-qawariri]
roles: [scholar, jurist]
summary:
  ar: "أبو سعيد عبيد الله بن عمر بن ميسرة الجشمي مولاهم المعروف بالقواريري، بصري سكن بغداد وحدّث بها عن حماد بن زيد وأبي عوانة وعبد الوارث بن سعيد ومسلم بن خالد وسفيان بن عيينة وهشيم ومعتمر بن سليمان ويحيى بن سعيد القطان وعبد الرحمن بن مهدي ومحمد بن جعفر غندر وخالد بن الحارث؛ روى عنه أبو داود السجستاني وأبو زرعة وأبو حاتم الرازيان وأحمد بن أبي خيثمة والحارث بن أبي أسامة وإبراهيم الحربي وعبد الله بن أحمد بن حنبل وصالح بن محمد جزرة وأبو القاسم البغوي وغيرهم؛ قال إن أحمد بن حنبل كتب عنه وهو في الحبس حديثين، وقال يحيى بن معين: القواريري ثقة، وقال أحمد بن سيار: لم أر مثل مسدد بالبصرة والقواريري ببغداد وصدقة بمرو {cite:tarikh-baghdad-khatib j.9 p.320-321}. وذُكر في خبر المحنة ممتحَناً: امتنع فقُيّد ثم أجاب في الثالثة، وعابه المأمون في كتابه بقبول الرشا والمصانعات {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
  en: "Abu Sa'id al-Qawariri — a Basran traditionist settled at Baghdad whose students include Abu Dawud, Abu Zur'a and Abu Hatim; Ahmad ibn Hanbal wrote two hadiths from him while in prison and Ibn Ma'in graded him trustworthy {cite:tarikh-baghdad-khatib j.9 p.320-321}. In the mihna he held out, was shackled, then answered on the third day — al-Ma'mun's letter censured his taking of bribes and favour-gifts {cite:tarikh-khulafa-minhaj-1434 p. 490,492-493}."
