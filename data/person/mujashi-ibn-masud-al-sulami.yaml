id: person/mujashi-ibn-masud-al-sulami
class: person
label: { ar: "مجاشع بن مسعود السلمي" }
summary:
  ar: "بعثه عبد الله بن عامر في أثر يزدجرد، فأتبعه إلى كرمان ونزل السيرجان، وهرب يزدجرد إلى خراسان {cite:tabari-tarikh-abu-al-fadl j.4 p.286} وعند البلاذري نزل بيمند من كرمان فأصاب الناس الدمق فهلك جيشه فلم ينج إلا القليل فسمي القصر قصر مجاشع."
  tr: "Abdullah ibn Amir onu Yezdegerd'e gönderdi, ardından Kerman'a kadar takip etti ve Sircanlar kamp kurdu. Yezdegerd Horasan'a kaçtı {atıf:tabari-tarikh-abu-al-fadl j.4 s.286}. El-Baladhuri Kerman'dan Baymand'da kamp kurdu ve Damaq halkı öldürüldü, ordusu öldü ve sadece birkaç kişi hayatta kaldı, bu yüzden saraya Qasr Majşa' adı verildi."
  id: "Abdullah ibn Amir mengirimnya ke Yazdegerd, mengikutinya ke Kerman, dan Sirjan berkemah. Yazdegerd melarikan diri ke Khorasan {cite:tabari-tarikh-abu-al-fadl j.4 hlm.286}. Al-Baladhuri berkemah di Baymand dari Kerman, dan penduduk Damaq tewas, sehingga pasukannya tewas, menyisakan hanya beberapa yang selamat, sehingga istana itu dinamai Qasr Majsha'."
