summary:
  ar: "سعيد بن حيان، أبو المقدام الدمشقي، ولقبه عبد الملك بن مروان «زريق»، وولّاه الوليد وسليمان وعمر جباية عشور أموال التجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} روى عن مسلم بن قرظة الأشجعي وعمر بن عبد العزيز، وروى عنه عبد الرحمن بن يزيد بن جابر وأخوه يزيد بن يزيد ويحيى بن سعيد الأنصاري وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} ذكره ابن حبان في الثقات، وله في صحيح مسلم حديث واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
  en: "Sa'id ibn Hayyan, Abu al-Miqdam al-Dimashqi, nicknamed Zurayq by Abd al-Malik ibn Marwan; the caliphs al-Walid, Sulayman and Umar appointed him to collect the tithe on trade goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He narrated from Muslim ibn Qartha al-Ashja'i and Umar ibn Abd al-Aziz; Abd al-Rahman ibn Yazid ibn Jabir, his brother Yazid ibn Yazid, Yahya ibn Sa'id al-Ansari and others narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Ibn Hibban listed him among the trustworthy, and he has one hadith in Sahih Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
  es: "Sa'id ibn Hayyan, Abu al-Miqdam al-Dimashqi, apodado Zurayq por Abd al-Malik ibn Marwan; los califas al-Walid, Sulayman y Umar lo designaron para cobrar el diezmo de los bienes comerciales. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Narró de Muslim ibn Qartha al-Ashja'i y Umar ibn Abd al-Aziz; Abd al-Rahman ibn Yazid ibn Jabir, su hermano Yazid ibn Yazid, Yahya ibn Sa'id al-Ansari y otros narraron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Ibn Hibban lo incluyó entre los dignos de confianza y tiene un hadiz en Sahih Muslim. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
  fr: "Sa'id ibn Hayyan, Abu al-Miqdam al-Dimashqi, surnommé Zurayq par Abd al-Malik ibn Marwan; les califes al-Walid, Sulayman et Umar l'ont nommé pour percevoir la dîme sur les marchandises commerciales. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Il a rapporté de Muslim ibn Qartha al-Ashja'i et Umar ibn Abd al-Aziz; Abd al-Rahman ibn Yazid ibn Jabir, son frère Yazid ibn Yazid, Yahya ibn Sa'id al-Ansari et d'autres ont rapporté de lui. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Ibn Hibban l'a répertorié parmi les dignes de confiance, et il a un hadith dans Sahih Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
  ur: "سعید بن حیان، ابو المقدم الدمشقی، عرفی نام زریق از عبد الملک بن مروان؛ خلفاء الولید، سلیمان اور عمر نے انہیں تجارتی سامان پر دسواں حصہ لینے کے لیے مقرر کیا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 14957} انہوں نے مسلم بن قرطہ الشجعی اور عمر بن عبد العزیز سے روایت کی ہے۔ ان سے عبدالرحمٰن بن یزید بن جبیر، ان کے بھائی یزید بن یزید، یحییٰ بن سعید الانصاری اور دیگر نے روایت کی ہے۔ ابن حبان نے اسے ثقہ قرار دیا ہے اور صحیح مسلم میں ان کی ایک حدیث ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 14957}"
  tr: "Saeed ibn Hayyan, Ebu el-Miqdam el-Dimashqi, lakaplı Abd al-Malik ibn Merwan 'Zurayq', al-Walid, Süleyman ve Ömer tarafından ticaret gelirlerinin ondalık toplama valileri olarak atandı. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.14957} Müslüman ibn Qarza al-Ashca'i ve Umar ibn Abd al-Aziz'den, ayrıca Abd al-Rahman ibn Yezid ibn Jabir, kardeşi Yezid bin Yezid, Yahya ibn Sa'id al-Ansari ve diğerlerinden rivayet edilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14957} İbn Hibban tarafından al-Thikat'ta bahsedilir ve Sahih Müslüman'da yalnızca bir hadisi vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14957}"
  id: "Saeed ibn Hayyan, Abu al-Miqdam al-Dimashqi, dijuluki Abd al-Malik ibn Marwan 'Zurayq', diangkat oleh al-Walid, Sulayman, dan Umar sebagai gubernur pengumpulan persepuluhan pendapatan perdagangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14957} Diceritakan dari Muslim ibn Qarza al-Ashja'i dan Umar ibn Abd al-Aziz, serta darinya oleh Abd al-Rahman ibn Yazid ibn Jabir, saudaranya Yazid ibn Yazid, Yahya ibn Sa'id al-Ansari, dan lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14957} Disebutkan oleh Ibn Hibban dalam al-Thiqat, dan ia hanya memiliki satu hadis dalam Sahih Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14957}"
