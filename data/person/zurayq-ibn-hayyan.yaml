summary:
  ar: "سعيد بن حيان، أبو المقدام الدمشقي، ولقبه عبد الملك بن مروان «زريق»، وولّاه الوليد وسليمان وعمر جباية عشور أموال التجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} روى عن مسلم بن قرظة الأشجعي وعمر بن عبد العزيز، وروى عنه عبد الرحمن بن يزيد بن جابر وأخوه يزيد بن يزيد ويحيى بن سعيد الأنصاري وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} ذكره ابن حبان في الثقات، وله في صحيح مسلم حديث واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
  en: "Sa'id ibn Hayyan, Abu al-Miqdam al-Dimashqi, nicknamed Zurayq by Abd al-Malik ibn Marwan; the caliphs al-Walid, Sulayman and Umar appointed him to collect the tithe on trade goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} He narrated from Muslim ibn Qartha al-Ashja'i and Umar ibn Abd al-Aziz; Abd al-Rahman ibn Yazid ibn Jabir, his brother Yazid ibn Yazid, Yahya ibn Sa'id al-Ansari and others narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957} Ibn Hibban listed him among the trustworthy, and he has one hadith in Sahih Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14957}"
