summary:
  ar: صحابي من الخزرج، استُصغر يوم أحد وغزا مع النبي سبع عشرة غزوة؛ هو الذي أبلغ النبي بقول عبد الله بن أبي فنزلت سورة المنافقين تصديقاً له، وشهد صفين مع علي ومات بالكوفة. وعنده في صحيح مسلم حديث الثقلين عند غدير خم وتعيينه أهل البيت بمن حرم الصدقة بعد النبي {cite:sahih-muslim 2408}
  en: A Khazraji Companion, judged too young at Uhud, who campaigned with the Prophet in seventeen expeditions; he reported the words of Abdullah ibn Ubayy and the sura al-Munafiqun was revealed confirming him; he was at Siffin with Ali and died
    in Kufa.
  ur: "خزرجی صحابی، احد میں چھوٹا جانا گیا، جو نبی کے ساتھ سترہ مہمات میں رہا؛ اس نے عبد اللہ بن اُبی کی بات بیان کی۔"
  es: "Un compañero Khazraji, considerado demasiado joven en Uhud, que participó en diecisiete expediciones junto al Profeta; transmitió las palabras de Abdullah ibn Ubayy y la sura al-Munafiqun fue revelada confirmándolo; estuvo en Siffin con Ali y murió en Kufa."
  fr: "Un Compagnon Khazraji, jugé trop jeune à Uhud, qui a combattu avec le Prophète lors de dix-sept expéditions; il a rapporté les paroles d'Abdullah ibn Ubayy et la sourate al-Munafiqun a été révélée pour le confirmer; il était à Siffin avec Ali et est mort à Kufa."
