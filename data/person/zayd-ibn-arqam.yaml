summary:
  ar: صحابي من الخزرج، استُصغر يوم أحد وغزا مع النبي سبع عشرة غزوة؛ هو الذي أبلغ النبي بقول عبد الله بن أبي فنزلت سورة المنافقين تصديقاً له، وشهد صفين مع علي ومات بالكوفة.، وعنده في صحيح مسلم حديث الثقلين عند غدير خم وتعيينه أهل البيت بمن حرم الصدقة بعد النبي {cite:sahih-muslim 2408}
  en: A Khazraji Companion, judged too young at Uhud, who campaigned with the Prophet in seventeen expeditions; he reported the words of Abdullah ibn Ubayy and the sura al-Munafiqun was revealed confirming him; he was at Siffin with Ali and died
    in Kufa.
