id: person/al-mustadi-billah
class: person
label: { ar: "المستضيء بأمر الله الحسن بن المستنجد" }
summary:
  ar: "خليفة عباسي [٥٦٦–٥٧٥هـ]، أبو محمد الحسن بن المستنجد، ولد سنة ست وثلاثين وخمس مئة وأمه أم ولد أرمنية اسمها غضة، بويع يوم موت أبيه، وقال ابن الجوزي نادى برفع المكوس ورد المظالم وأظهر من العدل والكرم ما لم نره في أعمارنا وفرق مالاً عظيماً على الهاشميين والعلويين والعلماء والمدارس والربط وفصل خياط المخزن ألفاً وثلاث مئة قباء إبريسم، وفي خلافته انقضت دولة بني عبيد وخطب له بمصر وضربت السكة باسمه وخطب له باليمن وبرقة وتوزر ومصر إلى أسوان ودانت الملوك بطاعته، ومات في سلخ شوال سنة خمس وسبعين {cite:tarikh-khulafa-minhaj-1434 p. 681-685}، وعهد إلى ابنه أحمد الناصر {cite:tarikh-khulafa-minhaj-1434 p. 685}. وفي سنة ست وستين استوزر أبا محمد عبد الله بن رئيس الرؤساء فانتقم من الوزير أبي جعفر بن اللذي وقتله وألقي في دجلة {cite:shadharat-dhahab p. 696-697}."
  en: "Abbasid caliph [566–575], born 536 to an Armenian umm walad; Ibn al-Jawzi: 'he proclaimed the lifting of tolls and the righting of wrongs, showed a justice and largesse we never saw in our days' — 1,300 silk robes cut in his first khil'a. In his reign the Ubaydid state ended and the khutba ran his name from Yemen to Aswan; he died at Shawwal's end, 575 {cite:tarikh-khulafa-minhaj-1434 p. 681-685}."
