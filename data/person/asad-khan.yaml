summary:
  ar: "أسد خان (1626/1631 – 15 يونيو 1716)، المولود محمد إبراهيم، نبيل مغولي من أسرة صفوية الأصل، ووزير الإمبراطورية في عهد أورنكزيب من 1676 إلى 1707 — من أطول وزراء العهد بقاءً — ثم وكيلها المطلق في عهد بهادر شاه وجهان دار شاه. قاد مع ابنه ذو الفقار خان أحد فصيلي البلاط المتنافسين في أواخر عهد أورنكزيب، ومات في عزلة بعد مقتل ابنه سنة 1713."
  en: "Asad Khan (1626/1631 – 15 June 1716), born Muhammad Ibrahim, was a Mughal noble of a Safavid Persian family and wazir of the empire under Aurangzeb from 1676 to 1707 — among the longest-serving wazirs of the reign — then Vakil-i-Mutlaq under Bahadur Shah I and Jahandar Shah. With his son Zulfiqar Khan he led one of the two rival court factions of Aurangzeb's last decades, and he died in obscurity after his son's killing in 1713."
  ur: "اسد خان (1626ء/1631ء – 15 جون 1716ء)، اصل نام محمد ابراہیم، صفوی فارسی خاندان کے مغل امیر تھے اور 1676ء سے 1707ء تک اورنگزیب کے وزیر رہے — اس عہد کے طویل ترین مدت والے وزرا میں سے ایک — پھر بہادر شاہ اول اور جہاندر شاہ کے دور میں وکیلِ مطلق بنے۔ اپنے بیٹے ذوالفقار خان کے ساتھ انھوں نے اورنگزیب کے آخری عشروں کے دو حریف درباری گروہوں میں سے ایک کی قیادت کی، اور 1713ء میں بیٹے کے قتل کے بعد گمنامی میں وفات پائی۔"

