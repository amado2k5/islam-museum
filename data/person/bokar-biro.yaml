summary:
  ar: "آخر ألمامي مستقل لإمامة فوتا جالون في غينيا الحالية (توفي في 13 نوفمبر 1896). من فصيل صوريا ومقره تيمبو، استولى على السلطة سنة 1890 بعد قتل أخيه الأكبر، فحكم حتى 1892 ثم عاد سنة 1894، ورفض المطالب الفرنسية وكتب «بسم الله» مكان توقيعه على المعاهدة، وقُتل بعد معركة بوريداكا حين دمّرت المدفعية الفرنسية جيشه فأسره رجال خصمه وقطعوا رأسه."
  en: "The last independent Almami of the Imamate of Futa Jallon in present-day Guinea (died 13 November 1896). Of the Soriya faction, based at Timbo, he seized power in 1890 after assassinating his elder brother, ruled until 1892 and again from 1894, refused the French demands and wrote 'Bismillah' in place of his signature on the treaty, and was killed after the battle of Porédaka, when French artillery destroyed his army and his enemy's soldiers captured and decapitated him."
  ur: "موجودہ گنی میں امامتِ فوتا جالون کے آخری آزاد المامی (وفات 13 نومبر 1896ء)۔ صوریا گروہ سے تعلق رکھنے والے اور تیمبو کو مرکز بنانے والے بوکار بیرو نے 1890ء میں اپنے بڑے بھائی کو قتل کر کے اقتدار حاصل کیا، 1892ء تک حکومت کی اور 1894ء میں دوبارہ لوٹے، فرانسیسی مطالبات مسترد کیے اور معاہدے پر دستخط کی جگہ «بسم اللہ» لکھا، اور پوریداکا کی لڑائی کے بعد مارے گئے جب فرانسیسی توپ خانے نے ان کی فوج تباہ کر دی اور ان کے دشمن کے سپاہیوں نے انہیں پکڑ کر سر قلم کر دیا۔"
