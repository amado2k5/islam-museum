summary:
  ar: "عالم هندي (1875–1952) عُدّ مفتي الهند الأعظم. تخرج في دار العلوم ديوبند، ودرّس في مدرسة أمينيا بدلهي ثم صار مديرها، وتولى رئاسة جمعية علماء الهند عند تأسيسها ثم رئاستها الثانية (1921–1940)، وكان عضوًا مؤسسًا في الجامعة الملية الإسلامية. عُرف بفتاواه المحررة، وجُمعت في «كفاية المفتي»، وبكتابه التعليمي «تعليم الإسلام»."
  en: "Indian scholar (1875–1952) regarded as the Grand Mufti of India. A graduate of Darul Uloom Deoband, he taught at Madrasa Aminia in Delhi and became its rector, served as interim president of Jamiat Ulama-e-Hind at its foundation and then as its second president (1921–1940), and was a founding member of Jamia Millia Islamia. He was famed for his carefully evidenced fatwas, collected as Kifayat al-Mufti, and for his primer Ta'limul Islam."
  ur: "ہندوستانی عالم (1875ء–1952ء) جو مفتی اعظم ہند سمجھے جاتے تھے۔ دار العلوم دیوبند کے فاضل، دہلی کے مدرسہ امینیہ میں مدرس اور پھر اس کے مہتمم ہوئے، جمعیت علماء ہند کے قیام پر عبوری صدر اور پھر دوسرے صدر (1921ء–1940ء) رہے، اور جامعہ ملیہ اسلامیہ کے بانی ارکان میں سے تھے۔ اپنے مدلل فتاویٰ، جو «کفایت المفتی» میں جمع ہوئے، اور درسی کتاب «تعلیم الاسلام» کے لیے مشہور ہوئے۔"
