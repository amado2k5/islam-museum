id: person/ibn-al-khazin-al-katib
class: person
label: { ar: "ابن الخازن الكاتب", en: "Ibn al-Khazin al-Katib", es: "Ibn al-Khazin al-Katib", fr: "Ibn al-Khazin al-Katib", ur: "ابن الخزین الکتب" }
summary:
  ar: "أبو الفضل أحمد بن محمد بن الفضل بن عبد الخالق المعروف بابن الخازن؛ الكاتب الشاعر الدينوري الأصل البغدادي المولد والوفاة؛ كان فاضلاً نادرة في الخط أوحد وقته فيه؛ والد أبي الفتح نصر الله الكاتب المشهور؛ كتب من المقامات نسخاً كثيرة بقيت بأيدي الناس {cite:wafayat-ayan}."
  en: "Abu al-Fadl Ibn al-Khazin — Baghdad's peerless calligrapher-katib and poet, whose Maqamat copies still circulated in Ibn Khallikan's day; father of the famous katib Nasrallah {cite:wafayat-ayan}."
  es: "Abu al-Fadl Ibn al-Khazin, el incomparable calígrafo-katib y poeta de Bagdad, cuyas copias de Maqamat todavía circulaban en tiempos de Ibn Khallikan; padre del famoso katib Nasrallah {cita:wafayat-ayan}."
  fr: "Abu al-Fadl Ibn al-Khazin — le calligraphe-katib et poète hors pair de Bagdad, dont les copies du Maqamat circulaient encore à l'époque d'Ibn Khallikan; père du célèbre katib Nasrallah {cite:wafayat-ayan}."
  ur: "ابو الفضل ابن الخازین — بغداد کا بے مثال خطاط اور شاعر، جس کی مقامت نسخے اب بھی ابن خلیقان کے زمانے میں گردش کر رہے ہیں۔ مشہور کاتب نصراللہ کے والد۔"
  tr: "Ebu el-Fadl Ahmed bin Muhammed bin el-Fadl ibn Abdül-Haliq, İbn el-Hazin olarak bilinir; Dinawari'den yazar ve şair, aslen Bağdatlı, doğup vefat etmiş; nadir bir hat bilgini ve zamanının tek alimi; ünlü yazar Ebu el-Feth Nasrallah'ın babasıdır; halkın elinde kalan birçok makamat kopyası yazmıştır {atıf:wafayat-ayan}."
  id: "Abu al-Fadl Ahmad ibn Muhammad ibn al-Fadl ibn Abd al-Khaliq, dikenal sebagai Ibn al-Khazin; penulis dan penyair dari Dinawari, berasal dari Baghdad, lahir dan meninggal; ia adalah seorang sarjana kaligrafi yang langka dan satu-satunya pada zamannya; ayah dari Abu al-Fath Nasrallah, penulis terkenal; ia menulis banyak salinan maqamat yang tetap berada di tangan orang-orang {cite:wafayat-ayan}."
