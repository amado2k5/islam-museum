summary:
  ar: عالم من زبيد في اليمن، نسبته إلى ذي أصاب قرب زبيد، درس علومه في زبيد على الشيخ عبد الله المزجاجي.
  en: A scholar of Zabid in Yemen, named after Dhu Asab near Zabid, who studied his sciences in Zabid under Shaykh Abdallah al-Mizjaji.
  fr: "Savant de Zabid au Yémen, nommé d'après Dhu Asab près de Zabid, ayant étudié ses sciences à Zabid auprès du cheikh Abdallah al-Mizjaji."
  es: "Un erudito de Zabid en Yemen, que recibió su nombre en honor a Dhu Asab, cerca de Zabid, quien estudió ciencias en Zabid bajo la tutela del jeque Abdallah al-Mizjaji."
  ur: "یمن میں زبید کا ایک عالم، جس کا نام زبید کے قریب ذو اصاب کے نام سے ہے، جس نے زبید میں شیخ عبد اللہ المجاجی کے ماتحت اپنے علوم کی تعلیم حاصل کی۔"
  tr: "Yemen'in Zabid şehrinden bir âlim olup, soyu Zabid yakınlarındaki Dhi Asab'a kadar uzanmaktadır. İlimlerini Zabid'de Şeyh Abdullah Al-Mazjaji'nin yanında tamamlamıştır."
  id: "Seorang ulama dari Zabid di Yaman, yang garis keturunannya dapat ditelusuri kembali ke Dhi Asab dekat Zabid. Ia mempelajari ilmu-ilmu di Zabid di bawah bimbingan Syekh Abdullah Al-Mazjaji."
