summary:
  ar: "كاتب وشاعر وناقد أدبي ومُنظّر إسلامي مصري، وُلد في قرية موشا بمحافظة أسيوط سنة 1906، وكان من أبرز أعضاء جماعة الإخوان المسلمين. ألّف تفسير «في ظلال القرآن» في ثلاثين جزءا وكتاب «معالم في الطريق»، وأُعدم في القاهرة سنة 1966 بعد إدانته بالتآمر على الرئيس جمال عبد الناصر."
  en: "Egyptian writer, poet, literary critic and Islamic theorist, born in the village of Musha in Asyut Province in 1906, and a leading member of the Muslim Brotherhood. He wrote the thirty-volume Qur'an commentary Fi Zilal al-Qur'an (In the Shade of the Qur'an) and Ma'alim fi al-Tariq (Milestones), and was executed in Cairo in 1966 after being convicted of plotting against President Gamal Abdel Nasser."
  ur: "مصری مصنف، شاعر، ادبی نقاد اور اسلامی مفکر، جو 1906 میں محافظہ اسیوط کے گاؤں موشا میں پیدا ہوئے اور اخوان المسلمون کے نمایاں ارکان میں سے تھے۔ انہوں نے تیس جلدوں پر مشتمل تفسیر «فی ظلال القرآن» اور کتاب «معالم فی الطریق» لکھی، اور 1966 میں صدر جمال عبدالناصر کے خلاف سازش کے الزام میں سزا پا کر قاہرہ میں پھانسی دیے گئے۔"
