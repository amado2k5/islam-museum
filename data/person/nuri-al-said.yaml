summary:
  ar: "نوري السعيد (ديسمبر 1888 – 15 يوليو 1958)، سياسي عراقي هيمن على الحياة السياسية في العراق الملكي، وتولى رئاسة الوزراء أربع عشرة مرة بين 1930 و1958. كان أبرز وجوه النظام الملكي الهاشمي وحليف بريطانيا الأقرب، وقُتل في بغداد غداة ثورة 14 يوليو 1958 وهو يحاول الفرار من البلاد."
  en: "Nuri al-Said (December 1888 – 15 July 1958) was an Iraqi politician who dominated political life in Hashemite Iraq, serving fourteen terms as prime minister between 1930 and 1958. The leading figure of the monarchy and Britain's closest Iraqi ally, he was captured and killed at Baghdad the day after the revolution of 14 July 1958 while trying to flee the country."
  ur: "نوری سعید (دسمبر 1888ء – 15 جولائی 1958ء) ایک عراقی سیاست دان تھے جنہوں نے ہاشمی عراق کی سیاسی زندگی پر غلبہ رکھا اور 1930ء سے 1958ء کے درمیان چودہ مرتبہ وزیرِ اعظم رہے۔ بادشاہت کے نمایاں ترین رہنما اور برطانیہ کے قریب ترین عراقی حلیف، وہ 14 جولائی 1958ء کے انقلاب کے اگلے دن ملک سے فرار کی کوشش کے دوران بغداد میں پکڑے گئے اور قتل ہوئے۔"
