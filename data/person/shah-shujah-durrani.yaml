summary:
  ar: "شاه الإمبراطورية الدرانية الأفغانية على فترتين (1803-1809 ثم 1839-1842)، ابن تيمور شاه الدراني ومن سلالة سدوزاي. خُلع سنة 1809 وعاش منفيا في البنجاب والهند، وتنازل عن ألماسة كوه نور لرانجيت سينغ، ثم أعاده البريطانيون والسيخ إلى عرش كابل سنة 1839 في الحرب الإنجليزية الأفغانية الأولى، واغتيل فيها سنة 1842."
  en: "Shah of the Afghan Durrani Empire in two reigns (1803–1809 and 1839–1842), a son of Timur Shah Durrani of the Sadozai line. Deposed in 1809, he lived in exile in the Punjab and India and surrendered the Koh-i-Noor diamond to Ranjit Singh; the British and the Sikhs restored him to the throne of Kabul in 1839 during the First Anglo-Afghan War, and he was assassinated there in 1842."
  ur: "افغان درانی سلطنت کے شاہ دو ادوار میں (1803ء–1809ء، پھر 1839ء–1842ء)، تیمور شاہ درانی کے بیٹے اور سدوزئی نسل سے۔ 1809ء میں معزول ہو کر پنجاب اور ہندوستان میں جلاوطن رہے اور کوہِ نور ہیرا رنجیت سنگھ کے حوالے کیا؛ انگریزوں اور سکھوں نے 1839ء میں پہلی اینگلو افغان جنگ کے دوران انہیں کابل کے تخت پر بحال کیا، اور 1842ء میں وہاں انہیں قتل کر دیا گیا۔"
