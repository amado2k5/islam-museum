summary:
  ar: "أبو يعلى العبدي أحمد بن محمد من ذرية الحسن البصري ويعرف بابن الصواف — شيخ مالكية العراق؛ تفقه على القاضي علي بن هارون وحدث عن البرقاني وطائفة، وكان علامة زاهداً مجتهداً في العبادة عارفاً بالحديث؛ قال بعضهم كان إماماً في عشرة أنواع من العلوم؛ توفي في رمضان سنة تسعين وأربعمائة بالبصرة وله تسعون سنة {cite:shadharat-dhahab p. 395}."
  en: "Abu Ya'la al-Abdi Ahmad b. Muhammad of al-Hasan al-Basri's progeny, known as Ibn al-Sawwaf — shaykh of Iraq's Malikis; studied under Qadi Ali b. Harun, a learned ascetic versed in hadith whom some called an imam in ten branches of knowledge; died Ramadan 490 at Basra aged ninety {cite:shadharat-dhahab p. 395}."
