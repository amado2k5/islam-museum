id: person/ibn-al-sawwaf
class: person
label: { ar: "أبو يعلى العبدي ابن الصواف شيخ مالكية العراق" }
summary:
  ar: "أبو يعلى العبدي أحمد بن محمد من ذرية الحسن البصري ويعرف بابن الصواف — شيخ مالكية العراق؛ تفقه على القاضي علي بن هارون وحدث عن البرقاني وطائفة، وكان علامة زاهداً مجتهداً في العبادة عارفاً بالحديث؛ قال بعضهم كان إماماً في عشرة أنواع من العلوم؛ توفي في رمضان سنة تسعين وأربعمائة بالبصرة وله تسعون سنة {cite:shadharat-dhahab p. 395}."
  en: "Abu Ya'la al-Abdi Ahmad b. Muhammad of al-Hasan al-Basri's progeny, known as Ibn al-Sawwaf — shaykh of Iraq's Malikis; studied under Qadi Ali b. Harun, a learned ascetic versed in hadith whom some called an imam in ten branches of knowledge; died Ramadan 490 at Basra aged ninety {cite:shadharat-dhahab p. 395}."
  es: "Abu Ya'la al-Abdi Ahmad b. Muhammad de la progenie de al-Hasan al-Basri, conocido como Ibn al-Sawwaf, jeque de los Malikis de Irak; Estudió con Qadi Ali b. Harun, un erudito asceta versado en hadices a quien algunos llamaban imán en diez ramas del conocimiento; murió en Ramadán 490 en Basora a la edad de noventa años {cita: shadharat-dhahab p. 395}."
  fr: "Abu Ya'la al-Abdi Ahmad b. Mahomet de la progéniture d'al-Hasan al-Basri, connu sous le nom d'Ibn al-Sawwaf — cheikh des Malikis d'Irak; étudié sous Qadi Ali b. Harun, un érudit ascète versé dans les hadiths que certains appelaient un imam dans dix branches du savoir; décédé Ramadan 490 à Bassorah à l'âge de quatre-vingt-dix ans {cite: shadharat-dhahab p. 395}."
  ur: "ابو یعلٰی العبدی احمد ب۔ حسن البصری کی نسل کا محمد، جسے ابن الصوف کے نام سے جانا جاتا ہے - عراق کے مالکیوں کے شیخ؛ قادی علی بی کے تحت تعلیم حاصل کی۔ ہارون، حدیث کا ایک عالم دین جسے کچھ علم کی دس شاخوں میں امام کہتے ہیں۔ 490 رمضان المبارک کو بصرہ میں نوے سال کی عمر میں وفات پائی۔ 395}۔"
  tr: "Ebu Ya'la el-Abdi Ahmed bin Muhammed, Irak Malikilerinin şeyhi olarak bilinen el-Hasan el-Basri'nin soyundan gelir; yargıç Ali ibn Harun'un yanında hukuk eğitimi almış ve el-Barkani ile bir mezhepten rivayet etmiştir. Alim, münzevi, ibadete gayretli ve hadis konusunda bilgiliydi. Bazıları onun on farklı alanda imam olduğunu söyler; Ramazan'da, dört yüz doksan yıl sonra Basra'da doksan yaşında vefat etti {atıf:shadharat-dhahab, s. 395}."
  id: "Abu Ya'la al-Abdi Ahmad ibn Muhammad adalah keturunan al-Hasan al-Basri, yang dikenal sebagai Ibn al-Sawwaf — Sheikh dari Malikis Irak; ia mempelajari hukum di bawah Hakim Ali ibn Harun dan menceritakan dari al-Barqani serta sebuah sekte. Ia adalah seorang ulama, pertapa, rajin beribadah, dan berpengetahuan dalam hadis. Beberapa mengatakan ia adalah imam dalam sepuluh jenis ilmu pengetahuan; ia meninggal pada bulan Ramadan tahun empat ratus sembilan puluh tahun di Basra pada usia sembilan puluh {cite:shadharat-dhahab, hlm. 395}."
