label: { ar: "آدم سميث", en: "Adam Smith", fr: "Adam Smith", ur: "ایڈم اسمتھ", es: "Adam Smith" }
summary:
  ar: "الاقتصادي والمفكر الاسكتلندي آدم سميث، كما يقدّمه طارق السويدان في دروسه: صاحب كتاب «ثروة الأمم» (1776)، ومبدأ تقسيم العمل الذي استنبطه من مراقبة مصنع للدبابيس، ويعدّه من مؤسسي علم الإدارة الحديث."
  en: "The Scottish economist and thinker Adam Smith, as presented in Tareq al-Suwaidan's lessons: author of The Wealth of Nations (1776) and of the division-of-labour principle he drew from watching a pin factory; counted among the founders of modern management."
  fr: "Économiste et penseur écossais présenté dans les leçons de Tareq al-Suwaidan : auteur de La Richesse des nations (1776) et du principe de division du travail tiré de l'observation d'une manufacture d'épingles ; compté parmi les fondateurs de la gestion moderne."
  ur: "اسکاٹش ماہر معاشیات ایڈم اسمتھ، جیسا کہ طارق السویدان کے درسوں میں آتا ہے: «ثروۂ الامم» (1776) کا مصنف اور تقسیمِ محنت کے اصول کا واضع جو اس نے پن کی فیکٹری دیکھ کر اخذ کیا؛ جدید انتظامی علم کے بانیوں میں شمار ہوتا ہے۔"
  es: "El economista y pensador escocés Adam Smith, tal como se presenta en las lecciones de Tareq al-Suwaidan: autor de La riqueza de las naciones (1776) y del principio de división del trabajo que extrajo al observar una fábrica de alfileres; considerado uno de los fundadores de la administración moderna."
  tr: "Tarık el-Suveydan'ın derslerinde anlattığı gibi, İskoç ekonomist ve düşünür Adam Smith; \"Ulusların Zenginliği\" (1776) kitabının yazarıdır ve bir iğne fabrikasını gözlemleyerek iş bölümü ilkesini ortaya atmıştır; modern yönetim biliminin kurucularından biri olarak kabul edilir."
  id: "Ekonom dan pemikir Skotlandia Adam Smith, seperti yang dipaparkan oleh Tariq Al-Suwaidan dalam pelajarannya: penulis buku \"The Wealth of Nations\" (1776), dan prinsip pembagian kerja yang ia simpulkan dari pengamatan sebuah pabrik peniti, dan ia dianggap sebagai salah satu pendiri ilmu manajemen modern."
