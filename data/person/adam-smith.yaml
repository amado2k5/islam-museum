  ar: "الاقتصادي والمفكر الاسكتلندي آدم سميث، كما يقدّمه طارق السويدان في دروسه: صاحب كتاب «ثروة الأمم» (1776)، ومبدأ تقسيم العمل الذي استنبطه من مراقبة مصنع للدبابيس، ويعدّه من مؤسسي علم الإدارة الحديث."
