summary:
  ar: "عسكري وسياسي موريتاني (وُلد 1956)، قائد عام للجيوش الموريتانية عقدا كاملا ووزير دفاع (2018–2019)، ثم رئيس موريتانيا منذ 1 أغسطس 2019 بعد فوزه بانتخابات 2019، وأُعيد انتخابه سنة 2024؛ خلف محمد ولد عبد العزيز، ورأس الاتحاد الإفريقي (2024–2025)."
  en: "Mauritanian general and politician (born 1956), chief of staff of the armed forces for a decade and defence minister (2018–2019), then president of Mauritania since 1 August 2019 after winning the 2019 election, re-elected in 2024; he succeeded Mohamed Ould Abdel Aziz and chaired the African Union in 2024–2025."
  ur: "موریطانیہ کے جرنیل اور سیاست دان (پیدائش 1956ء)، ایک دہائی تک مسلح افواج کے چیف آف اسٹاف اور وزیر دفاع (2018ء–2019ء) رہے، پھر 2019ء کے انتخابات جیت کر یکم اگست 2019ء سے موریطانیہ کے صدر ہیں اور 2024ء میں دوبارہ منتخب ہوئے۔"
