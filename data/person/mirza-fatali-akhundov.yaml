summary:
  ar: "كاتب مسرحي وفيلسوف وناقد أذربيجاني من أصل إيراني (1812–1878)، مؤسس الدراما الأذربيجانية والنقد الأدبي الحديث، وصاحب «رسائل كمال الدولة» الناقدة للدين؛ عُرف بوصفه من أوائل الملحدين الصرحاء في العالم الإسلامي، ودعا إلى استبدال الأبجدية العربية بأبجدية لاتينية."
  en: "Iranian Azerbaijani playwright, philosopher and literary critic (1812–1878), founder of Azerbaijani dramaturgy and of modern literary criticism. A materialist thinker described by the Encyclopaedia Iranica as one of the earliest and most outspoken atheists in the Islamic world, he wrote the anti-clerical Letters of Kamal al-Dowleh and campaigned to replace the Arabic-based alphabet with a Latin one."
  ur: "ایرانی آذربائیجانی ڈراما نگار، فلسفی اور ادبی نقاد (1812–1878)، آذربائیجانی ڈرامے اور جدید ادبی تنقید کے بانی۔ مادی فکر کے حامل تھے؛ انسائیکلوپیڈیا ایرانیکا نے انہیں عالمِ اسلام کے اولین اور بے باک ملحدوں میں شمار کیا۔ انہوں نے «کمال الدولہ کے خطوط» لکھے اور عربی رسم الخط کو لاطینی سے بدلنے کی مہم چلائی۔"
