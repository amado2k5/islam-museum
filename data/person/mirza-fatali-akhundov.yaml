faith:
  - value: atheist-or-sceptic
    basis: documented
    note: "Two independent scholarly traditions attest unbelief for Akhundov himself. The Encyclopaedia Iranica entry (Hamid Algar), quoted in full in the English article, calls him 'one of the earliest and most outspoken atheists to appear in the Islamic world', and the English article's lead likewise names him an atheist; the Persian article repeats the Iranica description in Persian. Independently, the Russian article's account of his philosophical views states that his outlook was bound up with his atheistic views and that, being an atheist, he later criticised all religions, above all the dogmas of Islam, citing Azerbaijani philosophical scholarship (Mamedov, 1962); his own Letters of Kamal al-Dowleh (1865) are a published attack on religion. The Soviet-era characterisations do not stand alone: the Iranica attestation is independent of them and rests on his own writings. The Russian article also records, from a single testimony dated 1832, that the young Akhundov, then being groomed for the clergy by his uncle, professed Shia Islam: one testimony about his youth, preserved here but not recorded as a faith segment under the two-source rule. His recorded sympathy for Zoroastrianism and correspondence with the Parsi scholar Maneckji Hataria (Zia-Ebrahimi, cited in the English article) are sympathy, not a conversion attested by any source."
    sources: [source/wikipedia-mirza-fatali-akhundov-en, source/wikipedia-mirza-fatali-akhundov-ru, source/wikipedia-mirza-fatali-akhundov-fa]
