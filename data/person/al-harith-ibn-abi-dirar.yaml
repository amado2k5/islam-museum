  en: Chief of the Banu al-Mustaliq of Khuza'a and father of Juwayriya, mother of the believers. He came to Medina with ransom for his captive daughter; Ibn Ishaq reports that he accepted Islam when the Prophet named the two camels he had hidden
    at al-Aqiq, and two of his sons and some of his people followed.
