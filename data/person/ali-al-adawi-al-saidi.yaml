summary:
  ar: "علي بن أحمد العدوي الصعيدي، فقيه مالكي محقق، ولد في صعيد مصر، وقدم القاهرة ودرس بالأزهر، وأخذ عنه البناني والدردير والدسوقي. وصفه صاحب «شجرة النور الزكية» بأنه «إمام المحققين». من مصنفاته حاشية على كفاية الطالب على الرسالة، وحاشية على شرح الزرقاني على مختصر خليل، وحاشية على شرح الخرشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  en: "Ali ibn Ahmad al-Adawi al-Sa'idi, a Maliki jurist and scholar of verification, born in Upper Egypt, who came to Cairo and studied at al-Azhar. Al-Banani, al-Dardir and al-Dasuqi studied under him. The author of Shajarat al-nur al-zakiyya called him 'imam of the verifiers'. His works include glosses on Kifayat al-talib, on al-Zurqani's commentary on Khalil, and on al-Kharashi's commentary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  fr: "Ali ibn Ahmad al-Adawi al-Sa'idi, juriste malikite et spécialiste de la vérification, né en Haute-Égypte, est venu au Caire et a étudié à al-Azhar. Al-Banani, al-Dardir et al-Dasuqi ont étudié sous sa direction. L'auteur de Shajarat al-nur al-zakiyya l'a appelé « imam des vérificateurs ». Ses œuvres comprennent des gloses sur Kifayat al-talib, sur le commentaire d'al-Zurqani sur Khalil et sur le commentaire d'al-Kharashi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  es: "Ali ibn Ahmad al-Adawi al-Sa'idi, jurista malikí y estudioso de la verificación, nacido en el Alto Egipto, que vino a El Cairo y estudió en al-Azhar. Al-Banani, al-Dardir y al-Dasuqi estudiaron con él. El autor de Shajarat al-nur al-zakiyya lo llamó \"imán de los verificadores\". Sus obras incluyen glosas sobre Kifayat al-talib, el comentario de al-Zurqani sobre Khalil y el comentario de al-Kharashi. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  ur: "علی بن احمد العدوی السعدی، ایک مالکی فقیہ اور تصدیق کے عالم، بالائی مصر میں پیدا ہوئے، جو قاہرہ آئے اور الازہر میں تعلیم حاصل کی۔ البنانی، الدردیر اور الدسوقی نے ان کے ماتحت تعلیم حاصل کی۔ شجرۃ النور الزکیہ کے مصنف نے انہیں 'تصدیق کرنے والوں کا امام' کہا ہے۔ ان کی تصانیف میں کفایت الطالب، الزرقانی کی تفسیر خلیل اور الخراشی کی تفسیر شامل ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1630}"
