summary:
  ar: "علي بن أحمد العدوي الصعيدي، فقيه مالكي محقق، ولد في صعيد مصر، وقدم القاهرة ودرس بالأزهر، وأخذ عنه البناني والدردير والدسوقي. وصفه صاحب «شجرة النور الزكية» بأنه «إمام المحققين». من مصنفاته حاشية على كفاية الطالب على الرسالة، وحاشية على شرح الزرقاني على مختصر خليل، وحاشية على شرح الخرشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  en: "Ali ibn Ahmad al-Adawi al-Sa'idi, a Maliki jurist and scholar of verification, born in Upper Egypt, who came to Cairo and studied at al-Azhar. Al-Banani, al-Dardir and al-Dasuqi studied under him. The author of Shajarat al-nur al-zakiyya called him 'imam of the verifiers'. His works include glosses on Kifayat al-talib, on al-Zurqani's commentary on Khalil, and on al-Kharashi's commentary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
