summary:
  ar: "لاعب كرة سلة بوسني سابق ومسؤول (وُلد سنة 1985)، فاز ببطولة الدوري الإسباني مرتين مع ساسكي باسكونيا، ولعب ستة مواسم في NBA، وقاد منتخب البوسنة والهرسك، ورأس اتحادها لكرة السلة 2018–2022 قبل أن يعتزل سنة 2018 إثر إصابته بانصمام رئوي."
  en: "Bosnian former basketball player and executive (born 1985) who won two Liga ACB titles with Saski Baskonia, played six NBA seasons, captained Bosnia and Herzegovina, and presided over its basketball federation from 2018 to 2022 before a pulmonary embolism ended his playing career in 2018."
  ur: "بوسنیائی سابق باسکٹ بال کھلاڑی اور ایگزیکٹو (پیدائش 1985)؛ ساسکی باسکونیا کے ساتھ دو ACB ٹائٹل جیتے، NBA کے چھ سیزن کھیلے، بوسنیا و ہرزیگووینا کی قیادت کی اور 2018 سے 2022 تک اس کی باسکٹ بال فیڈریشن کے صدر رہے۔"
