id: person/ibn-wahshiyya
class: person
label: { ar: "ابن وحشية", en: "Ibn Wahshiyya" }
summary:
  ar: "أبو بكر أحمد بن علي بن قيس بن المختار بن عبد الكريم بن حرثيا بن بدنيا بن بوراطيا الكرداني من أهل جنبلاء وقيسين، أحد فصحاء النبط بلغة الكسدانيين، قال ابن النديم قد استقصيت ذكره فيما فعل في المقالة الثامنة في فن السحر والشعبذة والعزائم وقد كان له في ذلك حظ، وله في صناعة الكيمياء كتاب الأصول الكبر وكتاب الأصول الصغير وكتاب المدرجة وكتاب المذاكرات في الصنعة وكتاب يحتوي على عشرين كتابا، وذكر نسخة الأقلام التي يكتب بها كتب الصنعة والسحر وقرأها ابن النديم بخطه وقرأ نسخة هذه الأقلام بعينها في جملة أجزاء بخط أبي الحسن ابن الكوفي فيها تعليقات لغة ونحو وأخبار وأشعار وآثار وقعت له من كتب بني الفرات: حروف الفاقيطوس وحروف المسند وحروف العنبث وهذه الحروف التي يصاب العلوم القديمة بها في البرابي {cite:fihrist-ibn-al-nadim p. 497,504-505}."
  en: "The Nabataean decoder — counted among the elixir-makers {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
