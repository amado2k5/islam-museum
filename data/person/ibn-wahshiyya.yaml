id: person/ibn-wahshiyya
class: person
label: { ar: "ابن وحشية", en: "Ibn Wahshiyya", es: "Ibn Wahshiyya", fr: "Ibn Wahshiyya", ur: "ابن وحشیہ" }
summary:
  ar: "أبو بكر أحمد بن علي بن قيس بن المختار بن عبد الكريم بن حرثيا بن بدنيا بن بوراطيا الكرداني من أهل جنبلاء وقيسين، أحد فصحاء النبط بلغة الكسدانيين، قال ابن النديم قد استقصيت ذكره فيما فعل في المقالة الثامنة في فن السحر والشعبذة والعزائم وقد كان له في ذلك حظ، وله في صناعة الكيمياء كتاب الأصول الكبر وكتاب الأصول الصغير وكتاب المدرجة وكتاب المذاكرات في الصنعة وكتاب يحتوي على عشرين كتابا، وذكر نسخة الأقلام التي يكتب بها كتب الصنعة والسحر وقرأها ابن النديم بخطه وقرأ نسخة هذه الأقلام بعينها في جملة أجزاء بخط أبي الحسن ابن الكوفي فيها تعليقات لغة ونحو وأخبار وأشعار وآثار وقعت له من كتب بني الفرات: حروف الفاقيطوس وحروف المسند وحروف العنبث وهذه الحروف التي يصاب العلوم القديمة بها في البرابي {cite:fihrist-ibn-al-nadim p. 497,504-505}. وفي أخبار السحرة: ابن وحشية الكلداني من ولد سنحاريب، كان يزعم أنه ساحر يعمل أعمال الطلسمات ويعمل الصنمة {cite:fihrist-ibn-al-nadim p. 433}، قال ابن النديم وقد كان له في السحر والشعبذة والعزائم حظ، وله في صناعة الكيمياء كتاب الأصول الكبر في الصنعة وكتاب الأصول الصغرى وكتاب المدرجة وكتاب المذاكرات في الصنعة وكتاب يحتوي على عشرين كتابا، وعلى الولاء نسخة الأقلام التي يكتب بها كتب الصنعة والسحر ذكرها ابن وحشية وقرأها ابن النديم بخطه وقرأ نسخة هذه الأقلام بعينها في جملة أجزاء بخط أبي الحسن ابن الكوفي فيها تعليقات لغة ونحو وأخبار وأشعار وآثار وقعت لأبي الحسن ابن الثنى من كتب بني الفرات، وفيها حروف الفاقيطوس وحروف المسند وحروف العنبث وهذه الحروف التي يصاب بها العلوم القديمة في البرابي وربما وقعت هذه الخطوط في كتب العلوم التي ذكرتها من الصنعة والسحر والمزام باللغة التي أحدث أهلها العلم فلا تفهم إلا أن يكون الإنسان عارفا بتلك اللغة وهذا معوز وربما كانت هذه الكتابات تراجم تؤدى إلى اللغة العربية {cite:fihrist-ibn-al-nadim p. 504-505}"
  en: "The Nabataean decoder — counted among the elixir-makers {cite:fihrist-ibn-al-nadim}"
  es: "El descifrador nabateo, contado entre los fabricantes de elixires {cite:fihrist-ibn-al-nadim}"
  fr: "Le décodeur nabatéen — compté parmi les fabricants d'élixirs {cite:fihrist-ibn-al-nadim}"
  ur: "نباتین ڈیکوڈر - کا شمار امرت سازوں میں کیا جاتا ہے"
  tr: "Ebu Bekir Ahmed ibn Ali ibn Qays ibn al-Mukhtar ibn Abd al-Kerim ibn Harthiya ibn Baduniya ibn Buratiya el-Kurdani, Kasdanî dilinde etkili Nebati dilinde konuşanlardan biridir. İbn el-Nadim şöyle dedi: Büyü sanatı, şa'da ve kararlılık üzerine sekizinci makalesinde yaptığı işlerde onun bahsini tükettim ve bunda payı vardı. Simya alanında 'El-Usul el-Kubra', 'Küçük İlkeler Kitabı', 'El-Medrat' kitabı, 'Zanaatta Tartışmalar' kitabı ve yirmi kitaptan oluşan bir kitap yazdı. Kalem el yazmasını belirtti ki Kitapta, İbn el-Nadim'in kendi el yazısıyla okuduğu zanaat ve sihir kitapları yazdı. Ayrıca, bu aynı kalemlerin kopyalarını, Ebu el-Hasan bin el-Kufi'nin el yazısıyla yazılmış dilbilimsel ve dilbilgisi yorumları, haberler, şiirler ve Banu el-Furat'ın kitaplarından yazdığı eserleri içeren bir koleksiyonda okudu: Faqitus mektupları, Musnad'ın mektupları ve 'Anbath'ın mektupları. Bunlar, eski bilimlerin el-Barabi'de uygulanmasında kullanılan mektuplardır {atıf:fihrist-ibn-al-nadim s. 497,504-505}. Büyücülerin anlatımlarında: Sennaherib'in soyundan gelen İbn Vahşiyya el-Çaldani, tılsım ve putlar yapan bir büyücü olduğunu iddia eder {atıf:Fihrist-ibn-al-Nadim s. 433}. İbn el-Nadim, büyü, kehanet ve kararlılıkta payı olduğunu söylemiştir. Simya alanında ise 'Zanaatkârlığın Temel İlkeleri', Küçük İlkeler Kitabı, Küçük İlkeler Kitabı, Çalışmalar Kitabı ve Zanaatkârlıkta Tartışmalar Kitabı' adlı kitapları ve yirmi kitaptan oluşan bir kitap yazmıştır. Sadakatle ilgili olarak, İbn Vahşiyya'nın bahsettiği zanaatkarlık ve sihir kitapları için kullanılan kalemlerin bir kopyasıdır; İbn Vehşiyya, kendi el yazısıyla okuyup okudu Bu özel kalemlerin bir kopyası, Ebu el-Hasan ibn el-Kufi'nin el yazısıyla yazılmış bölümlerden oluşan bir koleksiyondur; dilbilgisel ve dilbilgisel yorumlar, haberler, şiirler ve Banu el-Furat'ın kitaplarından Ebu el-Hasan ibn el-Thanna'ya atfedilen eserleri içerir. Bunlar el-Fakiti'nin mektuplarını, Musnad'ın mektuplarını ve 'Anbat'ın mektuplarını içerir—bunlar el-Barabi'de eski bilimlerde kullanılan harflerdir. Bu yazılar, zanaatkarlık, büyü ve büyü gibi bahsettiğim bilim kitaplarında da bulunabilir; bu yüzden ancak bir kişi o dili biliyorsa anlaşılabilirler ki bu bir eksikliktir. Belki de bu yazılar Arapçaya giden biyografilerdir {atıf:fihrist-ibn-al-nadim s. 504-505}"
  id: "Abu Bakr Ahmad ibn Ali ibn Qays ibn al-Mukhtar ibn Abd al-Karim ibn Harthiya ibn Baduniya ibn Buratiya al-Kurdani dari masyarakat Janbala dan Qaysin, salah satu Nabatean yang fasih dalam bahasa Kasdanid. Ibn al-Nadim berkata: Saya telah menghabiskan sebutannya dalam artikel kedelapan tentang seni sihir, sya'dah, dan tekad, dan ia turut serta dalam hal itu. Di bidang alkimia, ia menulis buku 'Al-Usul al-Kubra,' 'Kitab Prinsip Kecil,' buku 'Al-Madarat,' buku 'Diskusi dalam Kerajinan,' dan sebuah buku berisi dua puluh buku. Ia menyebutkan manuskrip pena yang Ia menulis di dalamnya buku-buku tentang kerajinan tangan dan sihir, yang dibaca Ibn al-Nadim dengan tulisan tangannya sendiri. Ia juga membaca salinan pena tersebut dalam kumpulan volume tulisan tangan Abu al-Hasan ibn al-Kufi, yang berisi komentar linguistik dan tata bahasa, berita, puisi, dan karya yang ditulis olehnya dari buku-buku Banu al-Furat: surat-surat Faqitus, surat-surat Musnad, dan surat-surat 'Anbath. Ini adalah surat-surat yang digunakan untuk menerapkan ilmu kuno dalam al-Barabi {cite:fihrist-ibn-al-nadim hlm. 497,504-505}. Dalam catatan para penyihir: Ibn Wahshiyya al-Chaldani, keturunan Sennacherib, mengaku sebagai penyihir yang melakukan jimat dan berhala {cite:fihrist-ibn-al-nadim hlm. 433}. Ibn al-Nadim mengatakan ia memiliki bagian dalam sihir, ramalan, dan tekad. Di bidang alkimia, ia menulis buku 'Prinsip Utama dalam Kerajinan,' Kitab Prinsip Kecil, Kitab Prinsip Kecil, Buku Studi, dan Buku Diskusi dalam Kerajinan,' serta sebuah buku berisi dua puluh buku. Mengenai kesetiaan adalah salinan pena yang digunakan untuk menulis buku kerajinan dan sihir, yang disebutkan oleh Ibn Wahshiyya, dan Ibn al-Nadim membacanya dengan tulisan tangannya sendiri dan membacanya Salinan dari pena-pena ini adalah kumpulan bagian-bagian tulisan tangan Abu al-Hasan ibn al-Kufi, yang berisi komentar linguistik dan tata bahasa, berita, puisi, dan karya yang dikaitkan dengan Abu al-Hasan ibn al-Thanna dari buku-buku Banu al-Furat. Mereka berisi surat-surat al-Faqitus, surat-surat Musnad, dan surat-surat 'Anbath'—ini adalah huruf-huruf yang digunakan dalam ilmu pengetahuan kuno di al-Barabi. Tulisan-tulisan ini mungkin muncul dalam buku-buku ilmu pengetahuan yang saya sebutkan, seperti kerajinan, sihir, dan sihir, dalam bahasa yang pengetahuannya adalah kekurangan, sehingga hanya dapat dipahami jika seseorang menguasai bahasa tersebut, yang merupakan kekurangan. Mungkin tulisan-tulisan ini adalah biografi yang mengarah ke bahasa Arab {cite:fihrist-ibn-al-nadim hlm. 504-505}"
