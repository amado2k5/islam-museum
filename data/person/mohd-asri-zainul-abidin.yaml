  did_you_know:
    ar: "محمد عصري زين العابدين، المعروف بـ«الدكتور مازا»، عالم وداعية ماليزي وُلد في بوكيت ميرتاجام ببينانغ سنة 1971، وهو مفتي برليس منذ 2015 بعد ولاية أولى 2006–2008، وكان في الخامسة والثلاثين أصغر مفتٍ في ماليزيا."
    en: "Mohd Asri Zainul Abidin, known as Dr Maza, is a Malaysian scholar and preacher born in Bukit Mertajam, Penang, in 1971; Mufti of Perlis since 2015 after a first term in 2006-2008, and at thirty-five Malaysia's youngest mufti."
