summary:
  ar: "عالم وداعية وكاتب ماليزي، وُلد في بوكيت ميرتاجام ببينانغ في 1 يناير 1971، وهو مفتي ولاية برليس منذ 2 فبراير 2015 بعد ولاية أولى من 2006 إلى 2008، وأستاذ مشارك دائم في جامعة العلوم الماليزية. عُرف بمدونته «ميندا تجديد» وأعمدته الصحفية وكتبه منذ 2003. بلغ حسابه الموثّق على إنستغرام 215,646 متابعًا في 15 نوفمبر 2026."
  en: "Malaysian scholar, preacher and writer, born in Bukit Mertajam, Penang, on 1 January 1971. He has served as Mufti of the state of Perlis since 2 February 2015, after a first term from 2006 to 2008, and remains a permanent associate professor at Universiti Sains Malaysia. He is known for his Minda Tajdid blog, his newspaper columns and his books since 2003. His verified Instagram account counted 215,646 followers on 15 November 2026."
  ur: "ملائیشیائی عالم، مبلغ اور مصنف، جو یکم جنوری 1971ء کو پینانگ کے بوکیت ميرتاجام میں پیدا ہوا۔ وہ 2 فروری 2015ء سے ریاست پرلیس کا مفتی ہے، اس سے پہلے 2006ء سے 2008ء تک بھی یہ منصب رہا، اور یونیورسٹی سائنس ملائیشیا میں مستقل ایسوسی ایٹ پروفیسر ہے۔ وہ اپنے بلاگ «میندا تجدید»، اخبارات کے کالموں اور 2003ء سے اپنی کتابوں کے لیے جانا جاتا ہے۔ 15 نومبر 2026ء کو اس کے مصدقہ انسٹاگرام اکاؤنٹ کے 215,646 فالوور تھے۔"
  es: "Erudito, predicador y escritor malasio, nacido en Bukit Mertajam, Penang, el 1 de enero de 1971. Ha ejercido como Muftí del estado de Perlis desde el 2 de febrero de 2015, tras un primer mandato entre 2006 y 2008, y sigue siendo profesor asociado permanente en la Universiti Sains Malaysia. Es conocido por su blog Minda Tajdid, sus columnas periodísticas y sus libros desde 2003. Su cuenta verificada de Instagram contaba con 215 646 seguidores el 15 de noviembre de 2026."
  fr: "Érudit, prédicateur et écrivain malaisien, né à Bukit Mertajam, Penang, le 1er janvier 1971. Il est mufti de l'État de Perlis depuis le 2 février 2015, après un premier mandat de 2006 à 2008, et demeure professeur associé permanent à l'Universiti Sains Malaysia. Il est connu pour son blog Minda Tajdid, ses chroniques dans la presse et ses ouvrages publiés depuis 2003. Son compte Instagram certifié comptait 215 646 abonnés le 15 novembre 2026."
