summary:
  ar: "سياسية وكاتبة باكستانية (1953–2007)، أول امرأة تُنتخب لرئاسة حكومة بلد ذي أغلبية مسلمة؛ ورثت قيادة حزب الشعب الباكستاني عن أبيها ذو الفقار علي بوتو، ورأست حكومة باكستان مرتين (1988–1990 و1993–1996)، وقضت سنوات بين السجن والمنفى وملاحقات قضايا الفساد، ثم عادت من منفاها سنة 2007 فاغتيلت في تجمع انتخابي في راولبندي في 27 ديسمبر 2007."
  en: "Pakistani politician and writer (1953–2007), the first woman elected to head the government of a Muslim-majority country. She inherited the leadership of the Pakistan People's Party from her father Zulfikar Ali Bhutto and served two terms as Prime Minister of Pakistan (1988–1990 and 1993–1996), enduring prison, exile and corruption proceedings, before returning from exile in 2007 and being assassinated at an election rally in Rawalpindi on 27 December 2007."
  ur: "پاکستانی سیاست دان و مصنفہ (1953ء–2007ء)، کسی مسلم اکثریتی ملک کی حکومت کی سربراہی کے لیے منتخب ہونے والی پہلی خاتون۔ اپنے والد ذوالفقار علی بھٹو سے پاکستان پیپلز پارٹی کی قیادت ورثے میں پائی، دو مرتبہ وزیرِ اعظم پاکستان رہیں (1988ء–1990ء اور 1993ء–1996ء)، قید، جلاوطنی اور بدعنوانی کے مقدمات کا سامنا کیا، پھر 2007ء میں وطن لوٹیں اور 27 دسمبر 2007ء کو راولپنڈی میں ایک انتخابی جلسے میں قتل کر دی گئیں۔"
