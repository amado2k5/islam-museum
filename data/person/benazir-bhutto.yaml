summary:
  ar: "سياسية وكاتبة باكستانية (1953–2007)، أول امرأة تُنتخب لرئاسة حكومة بلد ذي أغلبية مسلمة؛ ورثت قيادة حزب الشعب الباكستاني عن أبيها ذو الفقار علي بوتو، ورأست حكومة باكستان مرتين ⁦(1988–1990 و1993–1996)⁩، وقضت سنوات بين السجن والمنفى وملاحقات قضايا الفساد، ثم عادت من منفاها سنة 2007 فاغتيلت في تجمع انتخابي في راولبندي في 27 ديسمبر 2007."
  en: "Pakistani politician and writer (1953–2007), the first woman elected to head the government of a Muslim-majority country. She inherited the leadership of the Pakistan People's Party from her father Zulfikar Ali Bhutto and served two terms as Prime Minister of Pakistan (1988–1990 and 1993–1996), enduring prison, exile and corruption proceedings, before returning from exile in 2007 and being assassinated at an election rally in Rawalpindi on 27 December 2007."
  ur: "پاکستانی سیاست دان و مصنفہ ⁦(1953ء–2007ء)⁩، کسی مسلم اکثریتی ملک کی حکومت کی سربراہی کے لیے منتخب ہونے والی پہلی خاتون۔ اپنے والد ذوالفقار علی بھٹو سے پاکستان پیپلز پارٹی کی قیادت ورثے میں پائی، دو مرتبہ وزیرِ اعظم پاکستان رہیں ⁦(1988ء–1990ء اور 1993ء–1996ء)⁩، قید، جلاوطنی اور بدعنوانی کے مقدمات کا سامنا کیا، پھر 2007ء میں وطن لوٹیں اور 27 دسمبر 2007ء کو راولپنڈی میں ایک انتخابی جلسے میں قتل کر دی گئیں۔"
  es: "Política y escritora pakistaní (1953-2007), la primera mujer elegida para encabezar el gobierno de un país de mayoría musulmana. Heredó el liderazgo del Partido Popular de Pakistán de su padre, Zulfikar Ali Bhutto, y ocupó el cargo de Primera Ministra de Pakistán durante dos mandatos (1988-1990 y 1993-1996), sufriendo prisión, exilio y procesos por corrupción, antes de regresar del exilio en 2007 y ser asesinada en un mitin electoral en Rawalpindi el 27 de diciembre de 2007."
  fr: "Femme politique et écrivaine pakistanaise (1953-2007), elle fut la première femme élue à la tête du gouvernement d'un pays à majorité musulmane. Elle hérita de la direction du Parti du peuple pakistanais (PPP) de son père, Zulfikar Ali Bhutto, et exerça deux mandats de Première ministre du Pakistan (1988-1990 et 1993-1996). Durant son mandat, elle connut l'emprisonnement, l'exil et des poursuites pour corruption, avant de rentrer d'exil en 2007 et d'être assassinée lors d'un rassemblement électoral à Rawalpindi le 27 décembre 2007."
  tr: "Pakistanlı siyasetçi ve yazar (1953–2007), Müslüman çoğunluklu bir ülkenin hükümetine seçilen ilk kadın oldu; Pakistan Halk Partisi'nin liderliğini babası Zülfikar Ali Butto'dan devraldı, Pakistan hükümetini iki kez yönetti (1988–1990 ve 1993–1996), hapis, sürgün ve yolsuzluk davaları arasında yıllar geçirdi, ardından 2007'de sürgünden döndü ve 27 Aralık 2007'de Rawalpindi'deki bir seçim mitinginde suikaste uğradı."
  id: "Politikus dan penulis Pakistan (1953–2007), wanita pertama yang terpilih memimpin pemerintahan negara mayoritas Muslim; ia mewarisi kepemimpinan Partai Rakyat Pakistan dari ayahnya Zulfikar Ali Bhutto, memimpin pemerintahan Pakistan dua kali (1988–1990 dan 1993–1996), menghabiskan bertahun-tahun antara penahanan, pengasingan, dan penuntutan korupsi, lalu kembali dari pengasingan pada 2007 dan dibunuh dalam rapat umum di Rawalpindi pada 27 Desember 2007."
