summary:
  ar: "شيخ محتال أعيا أمره توابو بغداد، من حيله أنه أتى باب عدل من العدول بفأس وزنبيل وجرة فهدم دكاكينه وأدعى أن صاحب الدار أمره ثم أدعى سرقة ثيابه من الجرة فكساه العدل والجيران، وهو الذي احتال على بختيشوع الطبيب بشمع أسرجه وبنج في طعام أطعمه حراسه حتى جعله في صندوق وحمله إلى المتوكل في ضمان أن يسرق من داره ما يعرفه في ثلاث ليال {cite:muruj-al-dhahab p. 618-619}."
