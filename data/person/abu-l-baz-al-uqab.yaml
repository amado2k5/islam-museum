summary:
  ar: "شيخ محتال أعيا أمره توابو بغداد، من حيله أنه أتى باب عدل من العدول بفأس وزنبيل وجرة فهدم دكاكينه وأدعى أن صاحب الدار أمره ثم أدعى سرقة ثيابه من الجرة فكساه العدل والجيران، وهو الذي احتال على بختيشوع الطبيب بشمع أسرجه وبنج في طعام أطعمه حراسه حتى جعله في صندوق وحمله إلى المتوكل في ضمان أن يسرق من داره ما يعرفه في ثلاث ليال {cite:muruj-al-dhahab p. 618-619}."
  en: "Baghdad's legendary master-thief: demolished a judge's stalls to be paid for 'stolen' clothes, and smuggled Bakhtishu' himself in a chest to al-Mutawakkil to win his wager {cite:muruj-al-dhahab p. 618-619}."
  fr: "Le légendaire maître voleur de Bagdad : il démolit les échoppes d'un juge pour se faire payer des vêtements « volés », et fit passer Bakhtishu' lui-même dans un coffre jusqu'à al-Mutawakkil pour gagner son pari {cite:muruj-al-dhahab p. 618-619}."
  es: "El legendario maestro ladrón de Bagdad: demolió los puestos de un juez para cobrar por ropa \"robada\" y contrabandeó al propio Bakhtishu' en un cofre hasta al-Mutawakkil para ganar su apuesta {cite:muruj-al-dhahab p. 618-619}."
  ur: "بغداد کے افسانوی آقا چور: 'چوری' کے کپڑوں کی ادائیگی کے لیے ایک جج کے اسٹال کو گرا دیا، اور اپنی دانو جیتنے کے لیے بختیشو کو سینے میں باندھ کر المتوکل کو اسمگل کر دیا۔ 618-619}۔"
  tr: "Bağdat halkını şaşırtan kurnaz bir şeyh. Hilelerinden biri de, elinde balta, sepet ve bir testiyle bir noterin kapısına gelip, evin sahibinin emriyle dükkanlarını yıkmasıydı. Sonra da kıyafetlerinin testiden çalındığını iddia ederek noter ve komşularının onu giydirmesini sağlamıştı. Ayrıca, doktor Bakhtişu'yu da kandırmıştı; bir mum yakıp, içine anestezik madde koyarak muhafızlarına yedirmiş, daha sonra bu yemeği bir kutuya koyup, üç gece içinde evinden bildiği her şeyi çalması şartıyla Al-Mutawakkil'e götürmüştü. {cite:muruj-al-dhahab s. 618-619}"
  id: "Seorang syekh yang licik yang urusannya membingungkan penduduk Baghdad. Di antara tipu dayanya adalah ia datang ke rumah seorang notaris dengan kapak, keranjang, dan guci, lalu menghancurkan tokonya, dengan alasan bahwa pemilik rumah telah memerintahkannya untuk melakukan hal itu. Kemudian ia mengklaim bahwa pakaiannya telah dicuri dari guci tersebut, sehingga notaris dan para tetangga memberinya pakaian. Dialah yang menipu Bakhtishu, sang tabib, dengan menyalakan lilin dan memasukkan obat bius ke dalam makanan yang diberikannya kepada para pengawalnya hingga ia memasukkannya ke dalam kotak dan membawanya ke Al-Mutawakkil dengan syarat ia akan mencuri dari rumahnya apa yang diketahuinya dalam tiga malam. {cite:muruj-al-dhahab p. 618-619}."
