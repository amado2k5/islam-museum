summary:
  ar: "أبو عمران ويعرف والده بالجمال، ولد سنة أربع عشرة ومائتين وسمع أحمد بن حنبل ويحيى بن معين وغيرهما وروى عنه أكابر المحدثين والحفاظ، وكان إمام أهل عصره وعلامة وقته في الحفظ والمعرفة بالرجال والإتقان، وكان ثقة صدوقًا شديد الورع عظيم الهيبة؛ قال الخطيب سمعت الصوري يقول سمعت عبد الغني بن سعيد يقول: أحسن الناس كلامًا على حديث رسول الله علي بن المديني في وقته وموسى بن هارون في وقته وعلي بن عمر الدارقطني في وقته، ولقد سمعت أكثر مشايخنا يصفونه بالورع العظيم والزهد والتقوى والدين والطريقة الحسنة والمنهاج المستقيم؛ توفي في شعبان ودفن في مقابر باب حرب {cite:muntazam-ibn-al-jawzi p. 190}."
  en: "Abu 'Imran, b. 214 — 'son of the handsome one' — who heard Ibn Hanbal and Ibn Ma'in and was the imam and sign of his age in memory, rijal-knowledge and precision, intensely scrupulous and awed; al-Khatib records al-Suri's ranking: 'the finest speakers on the Prophet's hadith were Ibn al-Madini in his time, Musa ibn Harun in his, and al-Daraqutni in his.' He died in Sha'ban and was buried at Bab Harb cemetery {cite:muntazam-ibn-al-jawzi p. 190}."
