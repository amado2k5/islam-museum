summary:
  ar: "أبو عمران ويعرف والده بالجمال، ولد سنة أربع عشرة ومائتين وسمع أحمد بن حنبل ويحيى بن معين وغيرهما وروى عنه أكابر المحدثين والحفاظ، وكان إمام أهل عصره وعلامة وقته في الحفظ والمعرفة بالرجال والإتقان، وكان ثقة صدوقًا شديد الورع عظيم الهيبة؛ قال الخطيب سمعت الصوري يقول سمعت عبد الغني بن سعيد يقول: أحسن الناس كلامًا على حديث رسول الله علي بن المديني في وقته وموسى بن هارون في وقته وعلي بن عمر الدارقطني في وقته، ولقد سمعت أكثر مشايخنا يصفونه بالورع العظيم والزهد والتقوى والدين والطريقة الحسنة والمنهاج المستقيم؛ توفي في شعبان ودفن في مقابر باب حرب {cite:muntazam-ibn-al-jawzi p. 190}."
  en: "Abu 'Imran, b. 214 — 'son of the handsome one' — who heard Ibn Hanbal and Ibn Ma'in and was the imam and sign of his age in memory, rijal-knowledge and precision, intensely scrupulous and awed; al-Khatib records al-Suri's ranking: 'the finest speakers on the Prophet's hadith were Ibn al-Madini in his time, Musa ibn Harun in his, and al-Daraqutni in his.' He died in Sha'ban and was buried at Bab Harb cemetery {cite:muntazam-ibn-al-jawzi p. 190}."
  es: "Abu 'Imran, nacido en 214 — 'hijo del apuesto' — quien escuchó a Ibn Hanbal e Ibn Ma'in y fue el imán y el símbolo de su época en memoria, conocimiento rijal y precisión, intensamente escrupuloso y reverente; al-Khatib registra la clasificación de al-Suri: 'los mejores oradores sobre los hadices del Profeta fueron Ibn al-Madini en su tiempo, Musa ibn Harun en el suyo y al-Daraqutni en el suyo'. Murió en Sha'ban y fue enterrado en el cementerio de Bab Harb {cite:muntazam-ibn-al-jawzi p. 190}."
  fr: "Abou Imran (né en 214), surnommé « fils du beau », fut l'imam d'Ibn Hanbal et d'Ibn Ma'in. Il était un modèle pour son époque, reconnu pour sa mémoire, sa connaissance approfondie du hadith (rijal) et sa précision, et d'une grande rigueur et d'une profonde vénération. Al-Khatib rapporte le classement d'al-Suri: « Les meilleurs orateurs sur le hadith du Prophète furent Ibn al-Madini à son époque, Musa ibn Harun au sien, et al-Daraqutni au sien. » Il mourut en Sha'ban et fut enterré au cimetière de Bab Harb (cf. Muntazam ibn al-Jawzi, p. 190)."
  ur: "ابو عمران، بی۔ 214 - 'خوبصورت کا بیٹا' - جس نے ابن حنبل اور ابن معین کو سنا اور یادداشت، رجال علم اور درستگی میں اپنے زمانے کا امام اور نشانی تھا، سخت محتاط اور خوفناک؛ الخطیب نے السوری کی درجہ بندی درج کی ہے: 'حدیث نبوی کے بہترین مقرر اپنے زمانے میں ابن المدینی، ان کے زمانے میں موسیٰ بن ہارون اور ان کے دور میں الدارقطنی تھے۔' آپ کی وفات شعبان میں ہوئی اور باب حرب قبرستان میں دفن ہوئے۔ 190}۔"
