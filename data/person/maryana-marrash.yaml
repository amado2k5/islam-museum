  ar: "كاتبة وشاعرة سورية من حلب (1848–1919)، من أعلام النهضة العربية؛ أول سورية نشرت مجموعة شعرية («بنت فكر»، 1893)، ومن أوائل النساء اللواتي كتبن في الصحف العربية، وأحيت بصالونها الأدبي في حلب تقليد الصالونات الأدبية في العالم العربي."
  en: "Syrian writer and poet from Aleppo (1848–1919), a figure of the Nahda; the first Syrian woman to publish a collection of poetry (Bint fikr, 1893), among the first women to write in the Arabic-language press, and host of the Aleppo literary salon that revived the salon tradition in the Arab world."
  ur: "حلب سے تعلق رکھنے والی سوری مصنفہ اور شاعرہ (1848–1919)، نہضہ کی اہم شخصیت؛ شاعری کا مجموعہ («بنت فكر»، 1893) شائع کرنے والی پہلی سوری خاتون، عربی صحافت میں لکھنے والی اولین خواتین میں سے ایک، اور اپنے حلبی ادبی صالون کی میزبان۔"
