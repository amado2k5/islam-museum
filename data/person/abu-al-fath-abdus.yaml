id: person/abu-al-fath-abdus
class: person
label: { ar: "أبو الفتح عبدوس رئيس همذان", en: "Abu al-Fath Abdus, ra'is of Hamadhan", fr: "Abu al-Fath Abdus, ra'is de Hamadhan", es: "Abu al-Fath Abdus, ra'is of Hamadhan", ur: "ابو الفتح عبد، رئیس حمادان" }
summary:
  ar: "أبو الفتح عبدوس بن عبيد الله بن محمد بن عبدوس — رئيس همذان ومحدثها؛ أجاز له أبو بكر بن لال وسمع من محمد بن أحمد بن حمدويه الطوسي والحسين بن فتحويه؛ مات في جمادى الآخرة سنة تسعين وأربعمائة عن خمس وتسعين سنة وروى بعد أبي زرعة {cite:shadharat-dhahab p. 395}."
  en: "Abu al-Fath Abdus b. Ubayd Allah b. Muhammad — ra'is of Hamadan and its muhaddith; licensed by Abu Bakr Ibn Lal, heard from Ibn Hamduya al-Tusi and al-Husayn b. Fathuya; died Jumada II 490 aged ninety-five {cite:shadharat-dhahab p. 395}."
  fr: "Abu al-Fath Abdus b. Ubayd Allah b. Muhammad — ra'is de Hamadhan et son traditionniste ; autorisé par Abu Bakr Ibn Lal, il entendit Ibn Hamduya al-Tusi et al-Husayn b. Fathuya ; mort en Jumada II 490 à quatre-vingt-quinze ans {cite:shadharat-dhahab p. 395}."
  es: "Abu al-Fath Abdus b. Ubayd Allah b. Muhammad: los Ra'is de Hamadan y sus Muhaddith; con licencia de Abu Bakr ibn Lal, escuchado de Ibn Hamduya al-Tusi y al-Husayn b. Fathuya; murió Jumada II en 490 a la edad de noventa y cinco años {cita: shadharat-dhahab p. 395}."
  ur: "ابو الفتح عبدالب۔ عبید اللہ بی۔ محمد رئیس ہمدان اور اس کے محدث؛ ابوبکر ابن لعل کی طرف سے لائسنس یافتہ، ابن حمدویہ الطوسی اور الحسین بن سے سنا۔ فتحویا؛ وفات جمادی الثانی 490 عمر پچانوے 395}۔"
  tr: "Hamadan'ın başı ve hadis alimi Ebu el-Feth Abdus ibn Ubeyd Allah ibn Muhammed ibn Abdus; Ebu Bekr ibn Lal ona izin vermiş ve Muhammed ibn Ahmed ibn Hamdawayh el-Tusi ve el-Hüseyn ibn Fethawayh'den rivayet etmiştir; Hicri 490 yılında Cemâde el-Ahire ayında doksan beş yaşında vefat etmiş ve Ebu Zur'a'dan rivayet etmiştir. {Kaynak: Şadharat-dhahab s. 395}"
  id: "Abu al-Fath Abdus ibn Ubayd Allah ibn Muhammad ibn Abdus — kepala Hamadan dan ulama haditsnya; Abu Bakr ibn Lal memberinya izin dan dia mendengar dari Muhammad ibn Ahmad ibn Hamdawayh al-Tusi dan al-Husayn ibn Fathawayh; dia meninggal pada Jumada al-Akhirah tahun 490 H pada usia sembilan puluh lima tahun dan dia meriwayatkan setelah Abu Zur’ah {kutip:shadharat-dhahab hlm. 395}."
