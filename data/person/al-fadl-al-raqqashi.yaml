summary:
  ar: "أبو العباس الفضل بن عبد الصمد بن الفضل الرقاشي الشاعر، من أهل البصرة قدم بغداد فمدح هارون الرشيد ومجّد الأمين والبرامكة، وكان هو وأبو نواس يتهاجيان وما أمسك واحد منهما عن صاحبه حتى فرّق الموت بينهما؛ قال المبرد: كان الفضل الرقاشي شاعراً يظهر الغنى وهو فقير ويظهر العز وهو ذليل ويتكثّر وهو قليل، فكانت الشعراء تهجوه {cite:tarikh-baghdad-khatib j.10 p.345}."
  en: "Abu'l-Abbas al-Raqqashi — the Basran panegyrist of al-Rashid, al-Amin and the Barmakids whose lampoon war with Abu Nuwas ended only at death; al-Mubarrad mocked him as a man who feigned wealth while poor {cite:tarikh-baghdad-khatib j.10 p.345}."
