summary:
  ar: "أبو العباس الفضل بن عبد الصمد بن الفضل الرقاشي الشاعر، من أهل البصرة قدم بغداد فمدح هارون الرشيد ومجّد الأمين والبرامكة، وكان هو وأبو نواس يتهاجيان وما أمسك واحد منهما عن صاحبه حتى فرّق الموت بينهما؛ قال المبرد: كان الفضل الرقاشي شاعراً يظهر الغنى وهو فقير ويظهر العز وهو ذليل ويتكثّر وهو قليل، فكانت الشعراء تهجوه {cite:tarikh-baghdad-khatib j.10 p.345}."
  en: "Abu'l-Abbas al-Raqqashi — the Basran panegyrist of al-Rashid, al-Amin and the Barmakids whose lampoon war with Abu Nuwas ended only at death; al-Mubarrad mocked him as a man who feigned wealth while poor {cite:tarikh-baghdad-khatib j.10 p.345}."
  fr: "Abu al-Abbas al-Raqqashi — panégyriste de Bassora qui chanta al-Rashid, al-Amin et les Barmécides, et dont la guerre de satires avec Abu Nuwas ne prit fin qu’à la mort ; al-Mubarrad se moqua de lui comme d’un homme affichant la richesse tout en étant pauvre {cite:tarikh-baghdad-khatib j.10 p.345}."
  es: "Abu'l-Abbas al-Raqqashi — el panegirista basrano de al-Rashid, al-Amin y los Barmakids cuya guerra satírica con Abu Nuwas terminó solo con su muerte; al-Mubarrad se burló de él como un hombre que fingía riqueza siendo pobre {cite:tarikh-baghdad-khatib j.10 p.345}."
  ur: "ابو العباس الرقاشی - الرشید، الامین اور برمکیوں کے بصران کے علمبردار جن کی ابو نواس سے جنگ صرف موت پر ختم ہوئی؛ المبراد نے اس کا مذاق اڑایا کہ وہ ایک ایسے شخص کے طور پر کہ جس نے غریب ہوتے ہوئے دولت کا دعویٰ کیا {حوالہ: تاریخ بغداد خطیب ج.10 صفحہ 345}۔"
  tr: "Şair Ebu el-Abbas el-Fadl ibn Abd el-Samad ibn el-Fadl el-Rakkaşi, Basralıydı. Bağdat'a geldi ve Harun el-Raşid'i övdü, el-Amin'i ve Bermekîleri yüceltti. O ve Ebu Nuvas birbirlerini hicvederlerdi ve ölüm onları ayırana kadar birbirlerine saldırmaktan vazgeçmediler. El-Mübarrad şöyle dedi: El-Fadl el-Rakkaşi, fakirken zenginlik gösteren, aşağılanmışken şeref gösteren ve azken bolluk içinde yaşayan bir şairdi. Bu yüzden şairler onu hicvederlerdi. {kaynak:tarikh-baghdad-khatib c.10 s.345}"
  id: "Abu al-Abbas al-Fadl ibn Abd al-Samad ibn al-Fadl al-Raqashi, sang penyair, berasal dari Basra. Ia datang ke Baghdad dan memuji Harun al-Rashid serta mengagungkan al-Amin dan kaum Barmakid. Ia dan Abu Nuwas biasa saling menyindir, dan keduanya tak henti-hentinya menyerang satu sama lain hingga maut memisahkan mereka. Al-Mubarrad berkata: Al-Fadl al-Raqashi adalah seorang penyair yang menunjukkan kekayaan padahal ia miskin, menunjukkan kehormatan padahal ia terhina, dan berbuat banyak padahal ia kecil. Maka para penyair biasa menyindirnya. {cite:tarikh-baghdad-khatib j.10 p.345}"
