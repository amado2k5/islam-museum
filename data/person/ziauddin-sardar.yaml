summary:
  ar: "باحث وكاتب وناقد ثقافي بريطاني من أصل باكستاني، وُلد سنة 1951 في ديپالپور بالبنجاب ونشأ وتعلّم في بريطانيا. درس الفيزياء ثم علم المعلومات في جامعة سيتي بلندن، وعمل في جامعة الملك عبد العزيز بجدة وفي مجلتي نيتشر ونيو ساينتست، وألّف وحرّر أكثر من ستين كتابًا في الفكر المسلم ودراسات المستقبل، وأطلق مجلة «كريتيكال مسلم» سنة 2012."
  en: "British-Pakistani scholar, writer and cultural critic, born in Dipalpur, Punjab in 1951 and educated and brought up in Britain. He read physics and then information science at City University, London, worked at King Abdul Aziz University in Jeddah and for Nature and New Scientist, and has written and edited more than sixty books on Muslim thought and futures studies; in 2012 he launched the quarterly Critical Muslim."
  ur: "برطانوی پاکستانی مصنف، دانشور اور ثقافتی نقاد، 1951 میں پنجاب کے دیپالپور میں پیدا ہوئے اور برطانیہ میں پرورش و تعلیم پائی۔ انھوں نے سٹی یونیورسٹی لندن میں طبیعیات اور اطلاعاتی سائنس پڑھی، جدہ اور نیچر و نیو سائنٹسٹ میں کام کیا، اور مسلم فکر و مستقبل بینی پر ساٹھ سے زائد کتابیں لکھیں و مرتب کیں؛ 2012 میں انھوں نے «کرٹیکل مسلم» جاری کیا۔"
