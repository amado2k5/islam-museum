summary:
  ar: "محامٍ وسياسي أذربيجاني (1875–1920)، نائب في مجلس الدوما الثاني، وأول رئيس لمجلس وزراء جمهورية أذربيجان الديمقراطية (1918–1919)، شغل أيضًا وزارات الداخلية والدفاع والعدل والخارجية؛ اغتيل في تفليس سنة 1920."
  en: "Azerbaijani lawyer and statesman (1875–1920), deputy of the Second State Duma and the first chairman of the Council of Ministers (prime minister) of the Azerbaijan Democratic Republic (1918–1919), who also held the interior, defence, justice and foreign portfolios; assassinated at Tiflis in 1920."
  ur: "آذربائیجانی وکیل اور سیاست دان (1875–1920)، دوسرے ریاستی دوما کے رکن اور آذربائیجان جمہوری جمہوریہ کے پہلے وزیرِ اعظم (1918–1919)؛ داخلہ، دفاع، عدل اور خارجہ کے وزیر بھی رہے؛ 1920 میں تفلس میں قتل ہوئے۔"
