summary:
  ar: "الحافظ المحدث الحنبلي؛ سمع الكثير ببغداد من ابن الأخضر وغيره وبحران من الرهاوي الحافظ وبحلب وبدمشق من أبي اليمن الكندي؛ قال ابن نقطة سمع بالشام وبلاد الجزيرة وقرأ الكثير؛ وقال ابن رجب له تاريخ كبير وفوائد وأجزاء ورسائل إلى السامري صاحب المستوعب ينكر عليه؛ وذكر ابن الساعي أن المستنصر بالله لما بنى مدرسته رتب بدار الحديث بها شيخين أحدهما أبو منصور هذا والثاني ابن النجار الشافعي صاحب التاريخ {cite:shadharat-dhahab p. 227}."
  en: "The Hanbali hafiz (d. 3 Jumada I 643, Baghdad) — one of the two hadith shaykhs al-Mustansir appointed to his madrasa's dar al-hadith, the other being Ibn al-Najjar; Ibn Rajab credits him with a large Tarikh and pamphlets against the Samiri author of al-Mustaw'ab {cite:shadharat-dhahab p. 227}."
  fr: "Hafiz hanbalite (mort le 3 jumada I 643 H à Bagdad), l’un des deux cheikhs du hadith nommés par al-Mustansir à la dar al-hadith de sa madrasa, l’autre étant Ibn al-Najjar ; Ibn Rajab lui attribue un grand Tarikh et des opuscules contre al-Samiri, auteur d’al-Mustaw’ab {cite:shadharat-dhahab p. 227}."
  es: "El hafiz hanbalí (m. 3 Jumada I 643, Bagdad) — uno de los dos shaykhs de hadices que al-Mustansir designó para el dar al-hadith de su madrasa, siendo el otro Ibn al-Najjar; Ibn Rajab le atribuye un extenso Tarikh y panfletos contra el autor samiri de al-Mustaw'ab {cite:shadharat-dhahab p. 227}."
  ur: "حنبلی حافظ ⁦(متوفی 3 جمادی الثانی 643، بغداد)⁩ - دو محدثین میں سے ایک شیخ المستنصر نے اپنے مدرسے کے دار الحدیث کے لیے مقرر کیا، دوسرا ابن النجار؛ ابن رجب نے اسے المستعاب کے سامری مصنف کے خلاف ایک بڑی تاریخ اور پمفلٹ دیا ہے۔ 227}۔"
  tr: "Hanbali hadis âlimi; Bağdat'ta İbn al-Akhdar ve diğerlerinden, Bahreyn'de el-Rahawi el-Hafiz'ten, Halep ve Şam'da Ebu el-Yaman el-Kindi'den çokça şey duydu; İbn Nuqta Levant ve Cazire'de çok şey duyduğunu ve çok okuduğunu söyledi; İbn Receb büyük bir tarihi, faydaları, bölümleri ve el-Mustavi'nin yazarı el-Samiri'ye mektupları olduğunu ve bunları eleştirdiğini; İbn el-Sey'i ise el-Mustansir Billah okulunu inşa ettiğinde Hadis Evi'ne iki şeyh atadığını belirtti: biri Ebu Mansur tarafından, diğeri ise tarihin yazarı İbn el-Necer el-Şafii tarafından {atı:şadharat-zehab, s. 227}."
  id: "Ulama hadis Hanbali; ia banyak mendengar di Baghdad dari Ibn al-Akhdar dan lainnya, dan di Bahrain dari al-Rahawi al-Hafiz, serta di Aleppo dan Damaskus dari Abu al-Yaman al-Kindi; Ibn Nuqta mengatakan ia mendengar di Levant dan Jazira serta banyak membaca; Ibn Rajab mengatakan ia memiliki sejarah besar, manfaat, bagian, dan surat kepada al-Samiri, penulis al-Mustawi', yang ia kritik; dan Ibn al-Sa'i menyebutkan bahwa ketika al-Mustansir Billah membangun sekolahnya, ia menunjuk dua sheikh di Rumah Hadis: satu oleh Abu Mansur dan satu lagi oleh Ibn al-Najjar al-Shafi'i, penulis sejarah {cite:shadharat-dhahab, hlm. 227}."
