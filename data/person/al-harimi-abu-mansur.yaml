summary:
  ar: "الحافظ المحدث الحنبلي؛ سمع الكثير ببغداد من ابن الأخضر وغيره وبحران من الرهاوي الحافظ وبحلب وبدمشق من أبي اليمن الكندي؛ قال ابن نقطة سمع بالشام وبلاد الجزيرة وقرأ الكثير؛ وقال ابن رجب له تاريخ كبير وفوائد وأجزاء ورسائل إلى السامري صاحب المستوعب ينكر عليه؛ وذكر ابن الساعي أن المستنصر بالله لما بنى مدرسته رتب بدار الحديث بها شيخين أحدهما أبو منصور هذا والثاني ابن النجار الشافعي صاحب التاريخ {cite:shadharat-dhahab p. 227}."
  en: "The Hanbali hafiz (d. 3 Jumada I 643, Baghdad) — one of the two hadith shaykhs al-Mustansir appointed to his madrasa's dar al-hadith, the other being Ibn al-Najjar; Ibn Rajab credits him with a large Tarikh and pamphlets against the Samiri author of al-Mustaw'ab {cite:shadharat-dhahab p. 227}."
