summary:
  ar: "بطاقة أولية لنصوح السلاحي المعروف بالمطرقجي، الموسوعي العثماني الذي برع في الرياضيات وفنون السلاح ورسم منمنمات المدن في رحلات الجيش، توفي نحو سنة ١٥٦٤م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nasuh al-Silahi, 'Matrakci', the Ottoman polymath noted for mathematics, the game of matrak and his city-view miniatures of the army's routes, d. about 1564; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Nasuh al-Silahi, 'Matrakci', el polímata otomano conocido por sus conocimientos de matemáticas, el juego de matrak y sus miniaturas de vistas urbanas de las rutas del ejército, fallecido alrededor de 1564; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature de Nasuh al-Silahi, 'Matrakci', le polymathe ottoman réputé pour ses travaux en mathématiques, le jeu de matrak et ses miniatures de vues de villes représentant les itinéraires de l'armée, décédé vers 1564; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "نسخہ السلاہی کے لیے ڈرافٹ کارڈ، 'مطراقی'، ریاضی کے لیے مشہور عثمانی پولی میتھ، میٹرک کا کھیل اور فوج کے راستوں کے اس کے شہر کے نظارے کے چھوٹے نقشے، ڈی۔ تقریباً 1564; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Nasuh Al-Salahi için ön kart, Osmanlı ansiklopedisti olarak bilinen Al-Matrakji için bir ön kart; matematik, silah sanatları ve ordu seferleri sırasında minyatür şehir minyatürleri çizmiştir. Yaklaşık 1564 yılında öldü; önemli sözlüklerde anılmaktadır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Nasuh Al-Salahi, yang dikenal sebagai Al-Matrakji, seorang ensiklopedis Ottoman yang unggul dalam matematika, seni senjata, dan menggambar miniatur kota selama kampanye militer. Ia meninggal sekitar tahun 1564 M; ia dikenang dalam kamus-kamus terkenal, dan biografinya belum pernah diulas di halaman tersebut."
