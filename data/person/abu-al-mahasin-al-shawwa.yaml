summary:
  ar: "أبو المحاسن يوسف بن إسماعيل الشواء شهاب الدين، الكوفي الأصل الحلي المولد والمنشأ والوفاة بحسب ما في أصل الترجمة وقد صحح ابن خلكان أنه حلبي؛ أديب فاضل متقن لعلم العروض والقوافي شاعر يقع له في النظم معان بديعة في البيتين والثلاثة، وله ديوان شعر كبير يدخل في أربع مجلدات، وكان زيه على زي الحلبيين الأوائل في اللباس والعمامة المشقوقة، وكان كثير الملازمة لحلقة الشيخ ابن الجبراني الأديب اللغوي بجامع حلب؛ وكان بينه وبين ابن خلكان مودة أكيدة وموانسة كثيرة فقال فيه ابن خلكان: فلقد كان نعم الصاحب {cite:wafayat-ayan p. 231, 233-236}. ومولده تقديراً سنة اثنتين وستين وخمسمائة وتوفي يوم الجمعة تاسع عشر المحرم سنة خمس وثلاثين وستمائة بحلب ودفن بمقبرة باب أنطاكية {cite:wafayat-ayan p. 236}."
  en: "Shihab al-Din Abu al-Mahasin 'al-Shawwa'' — the Aleppine adib and prosodist with a four-volume diwan who wore the old Aleppine split turban, constant of Ibn al-Jubrani's circle in the Jami' maqsura and 'the best of companions' to the young Ibn Khallikan; died 19 Muharram 635, buried outside Bab Antakya {cite:wafayat-ayan p. 231-236}."
