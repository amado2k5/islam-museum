summary:
  ar: "أبو المحاسن يوسف بن إسماعيل الشواء شهاب الدين، الكوفي الأصل الحلي المولد والمنشأ والوفاة بحسب ما في أصل الترجمة وقد صحح ابن خلكان أنه حلبي؛ أديب فاضل متقن لعلم العروض والقوافي شاعر يقع له في النظم معان بديعة في البيتين والثلاثة، وله ديوان شعر كبير يدخل في أربع مجلدات، وكان زيه على زي الحلبيين الأوائل في اللباس والعمامة المشقوقة، وكان كثير الملازمة لحلقة الشيخ ابن الجبراني الأديب اللغوي بجامع حلب؛ وكان بينه وبين ابن خلكان مودة أكيدة وموانسة كثيرة فقال فيه ابن خلكان: فلقد كان نعم الصاحب {cite:wafayat-ayan p. 231, 233-236}. ومولده تقديراً سنة اثنتين وستين وخمسمائة وتوفي يوم الجمعة تاسع عشر المحرم سنة خمس وثلاثين وستمائة بحلب ودفن بمقبرة باب أنطاكية {cite:wafayat-ayan p. 236}."
  en: "Shihab al-Din Abu al-Mahasin 'al-Shawwa'' — the Aleppine adib and prosodist with a four-volume diwan who wore the old Aleppine split turban, constant of Ibn al-Jubrani's circle in the Jami' maqsura and 'the best of companions' to the young Ibn Khallikan; died 19 Muharram 635, buried outside Bab Antakya {cite:wafayat-ayan p. 231-236}."
  fr: "Shihab al-Din Abu al-Mahasin « al-Shawwa' » — l'homme de lettres et prosodiste alépin au diwan de quatre volumes, qui portait l'ancien turban fendu d'Alep, assidu du cercle d'Ibn al-Jubrani dans la maqsura de la grande mosquée et « le meilleur des compagnons » pour le jeune Ibn Khallikan ; mort le 19 Muharram 635, enterré hors de Bab Antakya {cite:wafayat-ayan p. 231-236}."
  es: "Shihab al-Din Abu al-Mahasin 'al-Shawwa'' — el adib y prosodista de Alepo con un diwan de cuatro volúmenes que usaba el antiguo turbante partido de Alepo, constante del círculo de Ibn al-Jubrani en la Jami' maqsura y 'el mejor de los compañeros' del joven Ibn Khallikan; murió el 19 de Muharram de 635, enterrado en las afueras de Bab Antakya {cite:wafayat-ayan p. 231-236}."
  ur: "شہاب الدین ابو المحسن 'الشعوا' - حلب کا ایک ادیب اور چار جلدوں کا دیوان جس نے پرانی حلب کی تقسیم شدہ پگڑی پہنی ہوئی تھی، جامع مقصورہ میں ابن الجبرانی کے حلقے کا مستقل اور نوجوان ابن خلقان کے لیے 'بہترین ساتھی'؛ وفات 19 محرم 635، باب انطاکیہ کے باہر دفن ہوئیں۔ 231-236}۔"
  tr: "Ebu el-Mahasin Yusuf ibn İsmail el-Şevve Şihab el-Din, aslen Kufalı olup, orijinal biyografiye göre Hilla'da doğup büyümüş ve orada vefat etmiştir. İbn Hallikan ise onun Halep'li olduğunu düzeltmiştir. Bilgili ve yetenekli bir edebiyatçı, vezin ve kafiye konusunda usta, şiirlerinde sadece iki veya üç satırda enfes anlamlar barındıran bir şairdi. Dört ciltten oluşan geniş bir şiir koleksiyonuna sahipti. Halep'in ilk dönem insanlarının tarzında giyinir, bölünmüş bir türban takardı. Sık sık Halep Ulu Camii'nde edebiyat ve dilbilim alimi Şeyh İbn el-Cebran'ın çevresine katılırdı. İbn Hallikan ile yakın bir dostluk ve birliktelik içindeydiler; İbn Hallikan onun hakkında şöyle demiştir: \"Gerçekten de çok iyi bir arkadaştı\" {kaynak: Vefayat-ı Ayan, s. 231, 233-236}. Yaklaşık olarak Hicri 562 yılında doğmuş ve Hicri 635 yılında Muharrem ayının on dokuzuncu Cuma günü Halep'te vefat etmiştir. Bab Antakya mezarlığına defnedilmiştir. {Kaynak: Wafayat-ayan s. 236}"
  id: "Abu al-Mahasin Yusuf ibn Ismail al-Shawwa’ Shihab al-Din, yang berasal dari Kufa, lahir dan besar di Hilla, tempat ia juga meninggal, menurut biografi aslinya. Ibn Khallikan mengoreksi bahwa ia berasal dari Aleppo. Ia adalah seorang sastrawan yang terpelajar dan berprestasi, mahir dalam prosodi dan rima, dan seorang penyair yang syair-syairnya mengandung makna yang indah hanya dalam dua atau tiga baris. Ia memiliki koleksi puisi yang besar yang terdiri dari empat jilid. Ia berpakaian seperti penduduk Aleppo zaman dahulu, mengenakan sorban terbelah. Ia sering menghadiri perkumpulan Syekh Ibn al-Jabran, seorang cendekiawan sastra dan bahasa, di Masjid Agung Aleppo. Ia dan Ibn Khallikan memiliki persahabatan yang erat dan banyak kebersamaan, dengan Ibn Khallikan berkata tentangnya: “Ia memang seorang sahabat yang baik” {cite:wafayat-ayan hlm. 231, 233-236}. Beliau lahir sekitar tahun 562 H dan wafat pada hari Jumat, tanggal sembilan belas Muharram, tahun 635 H di Aleppo. Beliau dimakamkan di pemakaman Bab Antakya {cite:wafayat-ayan p. 236}."
