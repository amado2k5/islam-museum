  ar: "زعيم كردي عراقي، وُلد سنة 1946 في مهاباد. رئيس الحزب الديمقراطي الكردستاني منذ 1979 وأول رئيس لإقليم كردستان العراق ⁦(2005–2017)⁩، استقال بعد استفتاء الاستقلال سنة 2017."
