summary:
  ar: "أبو عثمان عفان بن مسلم الصفار البصري، مولى عذرة بن ثابت الأنصاري؛ سكن بغداد وحدّث بها عن شعبة والحمادين وسليمان بن المغيرة وهمام بن يحيى والأسود بن شيبان وغيرهم، وروى عنه أحمد بن حنبل وعبيد الله القواريري ويحيى بن معين وأبو خيثمة وخلف بن سالم ومحمد بن معد كاتب الواقدي وقتيبة بن سعيد وعلي بن المديني وأبو بكر وعثمان ابنا أبي شيبة وأبو كريب محمد بن العلاء ومحمد بن إسماعيل البخاري في صحيحه وأبو زرعة وأبو حاتم الرازيان — وقال أبو حاتم: هو ثقة إمام. وقال يحيى بن معين إذا اختلف أبو الوليد وعفان في حديث عن حماد بن سلمة فالقول قول عفان، وقيل لعفان إن يحيى بن سعيد إذا تابعه على شيء ثبت عليه وإن كان خطأ وإذا خالفه شك. ومتحِّن في المحنة فثبت، وكان المأمون يجري عليه خمسمائة درهم كل شهر. توفي لثمان عشرة ليلة خلت من جمادى الآخرة عن ست وسبعين سنة {cite:tarikh-baghdad-khatib j.10 p.269}."
  en: "Abu 'Uthman al-Saffar of Basra, settled at Baghdad — so firm in hadith that Ibn Ma'in ruled 'when Abu'l-Walid and 'Affan disagree in a hadith from Hammad b. Salama, 'Affan's word stands'; al-Bukhari cites him in the Sahih. He stood firm in the mihna while on al-Ma'mun's 500-dirham monthly stipend; died Jumada II 220 at ~76 {cite:tarikh-baghdad-khatib j.10 p.269}."
