summary:
  ar: "أبو عثمان عفان بن مسلم الصفار البصري، مولى عذرة بن ثابت الأنصاري؛ سكن بغداد وحدّث بها عن شعبة والحمادين وسليمان بن المغيرة وهمام بن يحيى والأسود بن شيبان وغيرهم، وروى عنه أحمد بن حنبل وعبيد الله القواريري ويحيى بن معين وأبو خيثمة وخلف بن سالم ومحمد بن معد كاتب الواقدي وقتيبة بن سعيد وعلي بن المديني وأبو بكر وعثمان ابنا أبي شيبة وأبو كريب محمد بن العلاء ومحمد بن إسماعيل البخاري في صحيحه وأبو زرعة وأبو حاتم الرازيان — وقال أبو حاتم: هو ثقة إمام. وقال يحيى بن معين إذا اختلف أبو الوليد وعفان في حديث عن حماد بن سلمة فالقول قول عفان، وقيل لعفان إن يحيى بن سعيد إذا تابعه على شيء ثبت عليه وإن كان خطأ وإذا خالفه شك. ومتحِّن في المحنة فثبت، وكان المأمون يجري عليه خمسمائة درهم كل شهر. توفي لثمان عشرة ليلة خلت من جمادى الآخرة عن ست وسبعين سنة {cite:tarikh-baghdad-khatib j.10 p.269}."
  en: "Abu 'Uthman al-Saffar of Basra, settled at Baghdad — so firm in hadith that Ibn Ma'in ruled 'when Abu'l-Walid and 'Affan disagree in a hadith from Hammad b. Salama, 'Affan's word stands'; al-Bukhari cites him in the Sahih. He stood firm in the mihna while on al-Ma'mun's 500-dirham monthly stipend; died Jumada II 220 at ~76 {cite:tarikh-baghdad-khatib j.10 p.269}."
  fr: "Abu 'Uthman al-Saffar de Bassora, établi à Bagdad : si solide en hadith qu'Ibn Ma'in prescrivait de retenir sa parole lorsqu'il divergeait d'Abu'l-Walid sur un hadith de Hammad b. Salama ; al-Bukhari le cite dans le Sahih. Il resta ferme pendant la mihna tout en recevant d'al-Ma'mun cinq cents dirhams par mois ; mort en joumada II 220 H vers soixante-seize ans {cite:tarikh-baghdad-khatib j.10 p.269}."
  es: "Abu 'Uthman al-Saffar de Basora, establecido en Bagdad, era tan firme en los hadices que Ibn Ma'in dictaminó que «cuando Abu'l-Walid y 'Affan discreparon en un hadiz de Hammad b. Salama, prevaleció la palabra de Affan»; al-Bujari lo cita en el Sahih. Se mantuvo firme en la mihna mientras recibía el estipendio mensual de 500 dirhams de al-Ma'mun; Jumada II murió en 220 a los ~76 años {cita:tarikh-baghdad-khatib j.10 p.269}."
  ur: "ابو عثمان الصفر بصرہ، بغداد میں مقیم تھے - حدیث میں اتنا پختہ ہے کہ ابن معین نے حکومت کی جب ابو الولید اور عفان حماد بن کی حدیث میں اختلاف کرتے ہیں۔ سلام، 'عفان کا لفظ کھڑا ہے'؛ بخاری نے اسے صحیح میں نقل کیا ہے۔ وہ المامن کے 500 درہم ماہانہ وظیفہ پر رہتے ہوئے مہنہ میں ثابت قدم رہے۔ متوفی جمادی الثانی 220 بمطابق ~76۔"
  tr: "Udhra ibn Sabit el-Ensari'nin azatlı bir kölesi olan Ebu Osman Affan ibn Müslim el-Saffar el-Basri, Bağdat'ta ikamet etti ve orada Şu'ba, Hammad ibn Seleme, Süleyman ibn el-Muğirah, Hammam ibn Yahya, el-Esved ibn Şeyban ve diğerlerinden hadis rivayet etti. Ahmed ibn Hanbel, Ubeydullah el-Qawariri, Yahya ibn Ma'in, Ebu Hayseme, Halef ibn Salim, Muhammed ibn Ma'd, el-Vakidi katibi, Kuteybe ibn Sa'id, Ali ibn al-Madini, Ebu Bekir ve Osman, Ebu Şeybe'nin oğulları, Ebu Kurayb Muhammed ibn el-'Ala', Muhammed ibn İsmail'den rivayet edilmiştir. el-Buhari, Sahih'inde, Ebu Zur'a'da ve Ebu Hatim el-Razi'de. Ebu Hatim şöyle dedi: \"O güvenilir bir imamdır.\" Yahya ibn Ma'in şöyle dedi: \"Eğer Ebu el-Velid ve Affan, Hammad ibn Salama'dan rivayet edilen bir hadis konusunda ihtilafa düşerlerse, Affan'ın sözü kabul edilir.\" Affan'a şöyle denildi: \"Yahya ibn Sa'id onunla bir konuda hemfikir olursa, yanlış olsa bile bundan emindir; fakat onunla hemfikir olmazsa, şüphelidir.\" O, bu imtihan sırasında sınandı ve sebat etti. El-Ma'mun ona her ay beş yüz dirhem verirdi. Cemâde-i Ahiret'in bitiminden on sekiz gece önce, yetmiş altı yaşında vefat etti. {kaynak:tarikh-baghdad-khatib c.10 s.269}"
  id: "Abu Utsman Affan ibn Muslim al-Saffar al-Basri, budak yang dibebaskan dari Udhra ibn Thabit al-Ansari, tinggal di Bagdad dan meriwayatkan hadits di sana dari Shu'ba, Hammad ibn Salama, Sulayman ibn al-Mughirah, Hammam ibn Yahya, al-Aswad ibn Shayban, dan lain-lain. Diriwayatkan oleh Ahmad bin Hanbal, Ubayd Allah al-Qawariri, Yahya bin Ma'in, Abu Khaythama, Khalaf bin Salim, Muhammad bin Ma'd, ahli kitab al-Waqidi, Qutayba bin Sa'id, Ali bin al-Madini, Abu Bakr dan Utsman, binti Abu Shayba, Abu Kurayb Muhammad bin al-'Ala', Muhammad bin Isma'il al-Bukhari dalam Sahihnya, Abu Zur'a, dan Abu Hatim al-Razi. Abu Hatim berkata: “Dia adalah imam yang dapat dipercaya.” Yahya bin Ma'in berkata: “Jika Abu al-Walid dan Affan berbeda pendapat mengenai suatu hadits dari Hammad bin Salama, maka pernyataan Affan diterima.” Dikatakan kepada Affan: \"Jika Yahya ibn Sa'id setuju dengannya tentang sesuatu, dia yakin akan hal itu meskipun salah, tetapi jika dia tidak setuju dengannya, dia ragu.\" Dia diuji selama cobaan dan tetap teguh. Al-Ma'mun biasa memberinya lima ratus dirham setiap bulan. Dia meninggal delapan belas malam sebelum berakhirnya Jumada al-Akhirah, pada usia tujuh puluh enam tahun. {cite:tarikh-baghdad-khatib j.10 p.269}."
