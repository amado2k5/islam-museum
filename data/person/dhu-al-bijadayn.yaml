  ar: "عبد الله ذو البجادين المزني؛ توفي في غزوة تبوك فدفنه النبي بنفسه في حفرته ليلاً بحضور أبي بكر وعمر، بحسب رواية ابن مسعود."
  en: Abdullah Dhu al-Bijadayn al-Muzani; he died on the Tabuk campaign and the Prophet himself buried him in his grave at night in the presence of Abu Bakr and Umar, in Ibn Mas'ud's account.
