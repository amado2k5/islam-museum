  fr: "Abdullah Dhu al-Bijadayn al-Muzani; il mourut lors de la campagne de Tabuk et le Prophète lui-même l'enterra dans sa tombe de nuit en présence d'Abu Bakr et d'Umar, selon le récit d'Ibn Mas'ud."
  tr: "Abdullah Dhu al-Bejadin al-Muzani; Tabük Savaşı'nda öldü ve Peygamber, İbn Mes'in rivayetine göre onu gece Ebu Bekir ve Ömer huzurunda çukuruna gömdü."
  id: "Abdullah Dhu al-Bajadin al-Muzani; ia meninggal dalam Pertempuran Tabuk, dan Nabi sendiri menguburnya di lubangnya pada malam hari di hadapan Abu Bakr dan Umar, menurut riwayat Ibn Mas'ud."
