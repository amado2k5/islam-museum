summary:
  ar: «كاتبة بريطانية للأدب متعدد الثقافات ومؤسِّسة مجلة «SISTERS» للنساء المسلمات ومحررتها الأولى، وُلدت في ليدز لأب اسكتلندي وأم زولو من جنوب أفريقيا ونشأت في زيمبابوي، واعتنقت الإسلام سنة 1998، وألفت مذكراتها «من شفاه أخواتي» وثلاثة عشر كتابًا مصورًا للأطفال وروايات للشباب منها «من الصومال مع الحب» و«ارتدت حذاءً أحمر».»
  en: "British author of multicultural literature and founding editor of SISTERS Magazine for Muslim women. Born in Leeds to a Scottish father and Zulu mother, both South African, she grew up in Zimbabwe, converted to Islam in 1998, and wrote the memoir From My Sisters' Lips, thirteen picture books and young-adult novels including From Somalia, with Love and She Wore Red Trainers."
  ur: «برطانوی مصنفہ، لِدز میں پیدا ہوئیں اور زمبابوے میں پلی بڑھیں؛ 1998ء میں اسلام قبول کیا۔ «SISTERS» میگزین کی بانی و مدیرہ ہیں اور «From My Sisters' Lips» سمیت بچوں اور نوجوانوں کی متعدد کتابوں کی مصنفہ ہیں۔»
