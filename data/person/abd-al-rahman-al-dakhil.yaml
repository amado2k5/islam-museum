id: person/abd-al-rahman-al-dakhil
class: person
label: { ar: "عبد الرحمن الداخل" }
summary:
  ar: "عبد الرحمن بن معاوية بن هشام بن عبد الملك المرواني الأموي، دخل الأندلس سنة ثمان وثلاثين ومئة واستولى عليها وبقيت في يد أولاده إلى بعد الأربع مئة، وكان من أهل العلم والعدل وأمه بربرية فقيل ملك الدنيا ابنا بربريتين المنصور وعبد الرحمن بن معاوية، ولم يتلقب بأمير المؤمنين بل بالأمير فقط وكذلك بنوه {cite:tarikh-khulafa-minhaj-1434 p. 423-425}، وقال السيوطي بويع بالخلافة لما دخل الأندلس هارباً في سنة ثمان وثلاثين ومئة وكان من أهل العلم والعدل ومات في ربيع الآخر سنة سبعين ومئة {cite:tarikh-khulafa-minhaj-1434 p. 789}.، وعند المقري نسبه عبد الرحمن بن معاوية بن هشام بن عبد الملك بن مروان وكان قومه يتحينون له ملكاً بالمغرب يرون فيه علامات لذلك يأثرونها عن مسلمة بن عبد الملك وكان قد سمعها منه مشافهة فكان يحدث نفسه بذلك، فخلص إلى المغرب ونزل على أخواله نفزة ثم بعث بدراً مولاه إلى من بالأندلس من موالي المروانيين فبشوا له فيها دعوة، فأجاز البحر سنة 138هـ في خلافة المنصور ونزل بساحل المنكب فبايعه أهل إشبيلية ثم عامل كورة رية عيسى بن مساور ثم شدونة فمورور فمالقة فبرندة فشريش وتوافت إليه جنود الأمصار وانكشف يوسف الفهري بظاهر قرطبة {cite:nafh-tib-maqqari p. 364-365} وقال ابن حيان: مدة ولاة الأندلس منذ يوم هزيمة لذريق يوم الأحد لخمس خلون من شوال سنة اثنتين وتسعين إلى يوم الهزيمة على يوسف بن عبد الرحمن الفهري وتغلب عبد الرحمن بن معاوية المرواني على سرير الملك قرطبة وهو يوم الأضحى لعشر خلون من ذي الحجة سنة ثمان وثلاثين ومائة ست وأربعون سنة وخمسة أيام {cite:nafh-tib-maqqari p. 335-336}."
  en: "Abd al-Rahman ibn Muawiya ibn Hisham the Umayyad 'al-Dakhil', who entered al-Andalus in 138 and seized it, the land remaining in his sons' hands past the year 400; a man of learning and justice with a Berber mother — 'the world is ruled by two sons of Berber women.' He took only the title amir, not Commander of the Faithful, as did his sons {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
