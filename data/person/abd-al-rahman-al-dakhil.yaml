label: { ar: "عبد الرحمن الداخل", en: "Abd al-Rahman al-Dakhil", fr: "Abd al-Rahman al-Dakhil", es: "Abd al-Rahman al-Dakhil", ur: "عبدالرحمن الدخیل" }
summary:
  ar: "عبد الرحمن بن معاوية بن هشام بن عبد الملك المرواني الأموي، دخل الأندلس سنة ثمان وثلاثين ومئة واستولى عليها وبقيت في يد أولاده إلى بعد الأربع مئة، وكان من أهل العلم والعدل وأمه بربرية فقيل ملك الدنيا ابنا بربريتين المنصور وعبد الرحمن بن معاوية، ولم يتلقب بأمير المؤمنين بل بالأمير فقط وكذلك بنوه {cite:tarikh-khulafa-minhaj-1434 p. 423-425}، وقال السيوطي بويع بالخلافة لما دخل الأندلس هارباً في سنة ثمان وثلاثين ومئة وكان من أهل العلم والعدل ومات في ربيع الآخر سنة سبعين ومئة {cite:tarikh-khulafa-minhaj-1434 p. 789}. وعند المقري نسبه عبد الرحمن بن معاوية بن هشام بن عبد الملك بن مروان وكان قومه يتحينون له ملكاً بالمغرب يرون فيه علامات لذلك يأثرونها عن مسلمة بن عبد الملك وكان قد سمعها منه مشافهة فكان يحدث نفسه بذلك، فخلص إلى المغرب ونزل على أخواله نفزة ثم بعث بدراً مولاه إلى من بالأندلس من موالي المروانيين فبشوا له فيها دعوة، فأجاز البحر سنة 138هـ في خلافة المنصور ونزل بساحل المنكب فبايعه أهل إشبيلية ثم عامل كورة رية عيسى بن مساور ثم شدونة فمورور فمالقة فبرندة فشريش وتوافت إليه جنود الأمصار وانكشف يوسف الفهري بظاهر قرطبة {cite:nafh-tib-maqqari p. 364-365} وقال ابن حيان: مدة ولاة الأندلس منذ يوم هزيمة لذريق يوم الأحد لخمس خلون من شوال سنة اثنتين وتسعين إلى يوم الهزيمة على يوسف بن عبد الرحمن الفهري وتغلب عبد الرحمن بن معاوية المرواني على سرير الملك قرطبة وهو يوم الأضحى لعشر خلون من ذي الحجة سنة ثمان وثلاثين ومائة ست وأربعون سنة وخمسة أيام {cite:nafh-tib-maqqari p. 335-336}."
  en: "Abd al-Rahman ibn Muawiya ibn Hisham the Umayyad 'al-Dakhil', who entered al-Andalus in 138 and seized it, the land remaining in his sons' hands past the year 400; a man of learning and justice with a Berber mother — 'the world is ruled by two sons of Berber women.' He took only the title amir, not Commander of the Faithful, as did his sons {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  fr: "Abd al-Rahman ibn Muawiya ibn Hisham l'Omeyyade, « al-Dakhil », qui entra en al-Andalus en 138 et s'en empara, le pays restant aux mains de ses fils au-delà de l'an 400 ; homme de savoir et de justice, de mère berbère — « le monde est gouverné par deux fils de femmes berbères ». Il ne prit que le titre d'émir, non celui de commandeur des croyants, et ses fils firent de même {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  es: "Abd al-Rahman ibn Muawiya ibn Hisham, el omeya 'al-Dakhil', que entró en al-Ándalus en el año 138 y se apoderó de ella, permaneciendo la tierra en manos de sus hijos más allá del año 400; un hombre de saber y justicia con una madre bereber: 'el mundo es gobernado por dos hijos de mujeres bereberes'. Él solo tomó el título de emir, no el de Comandante de los Creyentes, como hicieron sus hijos {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  ur: "عبدالرحمن بن معاویہ بن ہشام اموی الدخیل، جو 138 میں اندلس میں داخل ہوا اور اس پر قبضہ کر لیا، 400 کے بعد اس کے بیٹوں کے ہاتھ میں زمین باقی تھی۔ بربر ماں کے ساتھ سیکھنے اور انصاف کرنے والا آدمی - 'دنیا پر بربر خواتین کے دو بیٹوں کی حکومت ہے۔' اس نے صرف امیر کا لقب اختیار کیا، وفاداروں کا کمانڈر نہیں، جیسا کہ اس کے بیٹوں نے کیا۔ 423-425}۔"
  tr: "Abdülrahman ibn Muaviye ibn Hişam ibn Abdülmalik el-Mervani el-Umavi, Hicri 138 yılında Endülüs'e girdi ve burayı ele geçirdi; bu bölge, Hicri 400 yılından sonrasına kadar oğullarının elinde kaldı. O, ilim ve adalet sahibi bir adamdı ve annesi Berberiydi; bu yüzden Berberi kadınlardan doğan iki oğlunun dünyayı yönettiği söylenir: el-Mansur ve Abdülrahman ibn Muaviye. O, \"Müminlerin Komutanı\" unvanını almadı, sadece \"Emir\" unvanını aldı, oğulları da aynı şekilde. {Kaynak:tarikh-khulafa-minhaj-1434 s. 423-425} El-Suyuti, onun Hicri 138 yılında kaçak olarak Endülüs'e girdiğinde halife olarak biat ettiğini, ilim ve adalet sahibi bir kişi olduğunu ve Hicri 170 yılında Rebiü'l-Sani'de öldüğünü söylemiştir. {Kaynak:tarikh-khulafa-minhaj-1434 s. 789}. El-Makkari'ye göre soyu Abdülrahman ibn Muaviye ibn Hişam ibn Abdülmalik ibn Mervan'dır. Halkı, onda bunun işaretlerini görerek Mağrip'te kral olmasını bekliyordu; bu işaretleri, doğrudan ondan duyduğu Maslamah ibn Abdülmalik'e atfediyorlardı. Bunu düşünmeye devam etti, bu yüzden Mağrip'e gitti ve annesinin amcaları Nafza'nın yanında kaldı. Sonra azatlı kölesi Bedir'i, Mervanilerin himayesindeki Endülüs halkına gönderdi ve onlar da onun haberini orada yaydılar. Böylece Hicri 138 yılında Mansur halifeliği döneminde denizi geçerek Almuñécar kıyılarına çıktı. Sevilla halkı ona biat etti, ardından Rayya, İsa ibn Musavir, sonra Sidonya, sonra Morón, sonra Malaga, sonra Beranda ve sonra da Jerez bölgelerini yönetti. Şehirlerin orduları ona akın etti ve Yusuf el-Fihri Kurtuba dışında yenilgiye uğradı. İbn Hayyan şöyle demiştir: 364-365} Roderic'in 92 yılının Şevval ayının beşinci Pazar günü yenilgisinden, Yusuf bin Abdülrahman el-Fihri'nin yenilgisine ve Abdülrahman bin Muaviye el-Marvani'nin Kurtuba tahtını ele geçirmesine kadar geçen süre, yani 138 yılının Zilhicce ayının onuncu günü kurban gününe kadar geçen süre, kırk altı yıl beş gündür. {kaynak: nafh-tib-makqkari s. 335-336}"
  id: "Abd al-Rahman ibn Mu'awiya ibn Hisham ibn Abd al-Malik al-Marwani al-Umawi memasuki Andalusia pada tahun 138 H dan merebutnya, dan wilayah itu tetap berada di tangan putra-putranya hingga setelah tahun 400 H. Beliau adalah seorang yang berilmu dan adil, dan ibunya adalah seorang Berber, sehingga dikatakan bahwa dua putra dari wanita Berber memerintah dunia: al-Mansur dan Abd al-Rahman ibn Mu'awiya. Beliau tidak mengambil gelar Amirul Mukminin, tetapi hanya gelar Emir, demikian pula putra-putranya {cite:tarikh-khulafa-minhaj-1434 p. 423-425}. Al-Suyuti mengatakan bahwa ia disumpah setia sebagai Khalifah ketika memasuki Andalusia sebagai buronan pada tahun 138 H, dan ia adalah seorang yang berilmu dan adil, dan ia meninggal pada bulan Rabi' al-Thani tahun 170 H {kutip:tarikh-khulafa-minhaj-1434 hlm. 789}. Menurut al-Maqqari, garis keturunannya adalah Abd al-Rahman ibn Muawiyah ibn Hisham ibn Abd al-Malik ibn Marwan. Kaumnya menantikannya menjadi raja di Maghreb, melihat tanda-tanda ini padanya, yang mereka duga berasal dari Maslamah ibn Abd al-Malik, dari siapa ia mendengarnya langsung. Ia terus memikirkannya, sehingga ia sampai di Maghreb dan tinggal bersama paman-paman dari pihak ibunya, Nafza. Kemudian ia mengutus Badr, budak yang telah dibebaskannya, kepada orang-orang di Andalusia yang menjadi sekutu Dinasti Marwanid, dan mereka menyebarkan kabar tentangnya di sana. Maka ia menyeberangi laut pada tahun 138 Hijriah pada masa kekhalifahan al-Mansur dan mendarat di pantai Almuñécar. Penduduk Sevilla menyatakan kesetiaan kepadanya, kemudian ia memerintah wilayah Rayya, Isa bin Musawir, lalu Sidonia, kemudian Morón, kemudian Malaga, kemudian Beranda, kemudian Jerez. Pasukan dari kota-kota berbondong-bondong bergabung dengannya, dan Yusuf al-Fihri dikalahkan di luar Cordoba. 364-365} Ibn Hayyan berkata: Masa pemerintahan para gubernur Andalusia sejak hari kekalahan Roderic pada hari Minggu, tanggal lima Syawal tahun sembilan puluh dua, hingga hari kekalahan Yusuf bin Abd al-Rahman al-Fihri dan pengambilalihan tahta Cordoba oleh Abd al-Rahman bin Muawiyah al-Marwani, yang bertepatan dengan hari kurban pada tanggal sepuluh Dzul Hijjah tahun seratus tiga puluh delapan, adalah empat puluh enam tahun dan lima hari {kutip:nafh-tib-maqqari hlm. 335-336}."
