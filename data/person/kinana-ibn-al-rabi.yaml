label:
  ar: "كنانة بن الربيع"
  en: "Kinana ibn al-Rabi'"
  ur: "کنانہ بن ربیع"
  es: "Kinana ibn al-Rabi'"
summary:
  ar: "كنانة بن الربيع في السيرة من سادات يهود خيبر وأصحاب كنوزهم: قُتل في فتح خيبر وكانت امرأته صفية بنت حيي بن أخطب ممن سبيت ثم أعتقها النبي وتزوجها كما يقص الطبقات والسيرة؛ يذكر مع خيبر وأسرها وقصة كنز بني النضير {cite:ibn-hisham-sira} {cite:tabaqat-ibn-sad} {cite:mubarakpuri-raheeq}."
  en: "Kinana ibn al-Rabi' in the Sira is one of the lords of Khaybar's Jews and a keeper of their treasures: he was killed at the taking of Khaybar, and his wife Safiyya bint Huyayy was among the captives, whom the Prophet freed and married, as the Tabaqat and Sira recount; he is remembered with Khaybar, its captives and the story of Banu al-Nadir's treasure {cite:ibn-hisham-sira} {cite:tabaqat-ibn-sad} {cite:mubarakpuri-raheeq}."
  ur: "کنانہ بن ربیع سیرت میں خیبر کے یہود کے سرداروں اور ان کے خزانوں کے نگہبانوں میں سے ہے: خیبر کی فتح میں مارا گیا، اس کی بیوی صفیہ بنت حیی قیدیوں میں تھی جنہیں نبی نے آزاد کر کے نکاح کیا جیسا کہ طبقات اور سیرت بیان کرتی ہیں؛ وہ خیبر، اس کے اسیروں اور بنو نضیر کے خزانے کے قصے کے ساتھ یاد آتا ہے۔"
  es: "Kinana ibn al-Rabi' en la Sira es uno de los señores de los judíos de Khaybar y guardián de sus tesoros: murió en la toma de Khaybar, y su esposa Safiyya bint Huyayy estaba entre los cautivos, a quienes el Profeta liberó y con quienes se casó, como relatan el Tabaqat y la Sira; se le recuerda junto con Khaybar, sus cautivos y la historia del tesoro de Banu al-Nadir {cite:ibn-hisham-sira} {cite:tabaqat-ibn-sad} {cite:mubarakpuri-raheeq}."
