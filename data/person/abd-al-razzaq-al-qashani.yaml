summary:
  ar: "عبد الرزاق ⁦(جمال الدين)⁩ بن أحمد الكاشي أو الكاشاني أو القاشاني، صوفي مفسر من العلماء، صاحب «اصطلاحات الصوفية» و«كشف الوجوه الغر» في شرح تائية ابن الفارض وشروح على «منازل السائرين» و«فصوص الحكم» و«تأويلات القرآن»، وتوفي سنة 730 هـ ⁦(1330 م)⁩ بحسب الأعلام."
  en: "Abd al-Razzaq (Jamal al-Din) ibn Ahmad al-Kashi, also al-Kashani or al-Qashani, a Sufi exegete and scholar, author of Istilahat al-Sufiyya, Kashf al-Wujuh al-Ghurr on Ibn al-Farid's Ta'iyya, commentaries on Manazil al-Sa'irin and Fusus al-Hikam, and Ta'wilat al-Qur'an; died 730 AH (1330 CE according to al-A'lam)."
