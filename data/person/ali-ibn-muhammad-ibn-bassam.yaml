summary:
  ar: "شاعر هجاء لم يسلم من لسانه إنسان ولا حتى أبوه محمد بن نصر صاحب السرو والمروءة فهجاه بخبيزة تعقد من سكره وخبز أبي جعفر طباشير فيه الأفاويه، وهجا الوزراء عبيد الله بن سليمان والقاسم بن عبيد الله وصاعد بن مخلد وعلي بن الفرات والعباس بن الحسن وإسماعيل بن بلبل، وتمثل المعتضد بشعره وهو يلعب بالشطرنج فلما شال رأسه فرأى القاسم استحيا وقال يا قاسم اقطع لسان ابن بسام عنك فخرج مبادراً حتى قال له بالبر ولا تعرض له بسوء فولاه القاسم البريد والجسر بجند قنسرين والعواصم {cite:muruj-al-dhahab p. 655-660}."
  en: "The fearless satirist who lampooned even his own father and every vizier — al-Mu'tadid laughed off his 'cut out Ibn Bassam's tongue' jest {cite:muruj-al-dhahab p. 655-660}."
  es: "El intrépido satírico que satirizó incluso a su propio padre y a todos los visires, al-Mu'tadid, se rió de su broma de \"cortarle la lengua a Ibn Bassam\" {cite:muruj-al-dhahab p. 655-660}."
  fr: "Le satiriste intrépide qui ridiculisait même son propre père et chaque vizir — al-Mu'tadid a ri de sa plaisanterie « couper la langue d'Ibn Bassam » {cite:muruj-al-dhahab p. 655-660}."
  ur: "وہ نڈر طنز نگار جس نے اپنے باپ اور ہر وزیر کو بھی چراغ پا کیا - المتعدید نے اپنی 'ابن بسام کی زبان کاٹ دی' کا مذاق اڑایا۔ 655-660}۔"
  tr: "Dili kimseye, hatta babası Muhammed ibn Nasr'a bile, servi ve soylu bir adamdan bile güvende olmayan bir hiciv şairi, Ebu Ca'far'ın ağzıyla şeker ve tebeşir ekmekten yapılmış bir hicivle onu hicvetti. Kendisi Übeydullah ibn Süleyman, el-Kasım bin Ubeydallah, Seyid ibn Mukhlad, Ali ibn el-Furat, el-Abbas ibn Hasan ve İsmail ibn Bulbul'u hicvetti. El-Mu'tadid satranç oynarken şiirlerinde rol aldı. Başını kaldırıp el-Kasım'ı görünce utandı ve 'Ey Kasim, İbn Bassam'ın dilini kes.' dedi. Aceleyle ayrıldı ve 'Ona zarar verme.' dedi. El-Kasım onu Qinnasrin ordusunun sınırına ve köprüsüne ve başkentlere götürdü {alıntı: Muruj-al-Dhahab, s. 655-660}."
  id: "Seorang penyair satir yang lidahnya tidak aman dari siapa pun, bahkan ayahnya Muhammad ibn Nasr, pria cemara dan bangsawan, menyindir dengan satire yang terbuat dari gula dan roti kapur oleh Abu Ja'far dengan mulutnya. Dia menyindir para menteri Ubayd Allah ibn Sulayman, al-Qasim ibn Ubayd Allah, Sa'id ibn Mukhlad, Ali ibn al-Furat, al-Abbas ibn al-Hasan, dan Isma'il ibn Bulbul. Al-Mu'tadid berakting dalam puisinya saat bermain catur. Ketika dia mengangkat kepala dan melihat al-Qasim, dia merasa malu dan berkata, 'Wahai Qasim, potong lidah Ibn Bassam.' Dia buru-buru pergi sambil berkata, 'Jangan sakiti dia.' Al-Qasim membawanya ke perbatasan dan jembatan dalam pasukan Qinnasrin dan ibu kota {cite:muruj-al-dhahab, hlm. 655-660}."
