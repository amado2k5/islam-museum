label: { ar: "علي بن محمد بن بسام", en: "Ali ibn Muhammad ibn Bassam" }
summary:
  ar: "شاعر هجاء لم يسلم من لسانه إنسان ولا حتى أبوه محمد بن نصر صاحب السرو والمروءة فهجاه بخبيزة تعقد من سكره وخبز أبي جعفر طباشير فيه الأفاويه، وهجا الوزراء عبيد الله بن سليمان والقاسم بن عبيد الله وصاعد بن مخلد وعلي بن الفرات والعباس بن الحسن وإسماعيل بن بلبل، وتمثل المعتضد بشعره وهو يلعب بالشطرنج فلما شال رأسه فرأى القاسم استحيا وقال يا قاسم اقطع لسان ابن بسام عنك فخرج مبادراً حتى قال له بالبر ولا تعرض له بسوء فولاه القاسم البريد والجسر بجند قنسرين والعواصم {cite:muruj-al-dhahab p. 655-660}."
  en: "The fearless satirist who lampooned even his own father and every vizier — al-Mu'tadid laughed off his 'cut out Ibn Bassam's tongue' jest {cite:muruj-al-dhahab p. 655-660}."
