summary:
  ar: "شاعر باكستاني (1900–1982) كتب كلمات النشيد الوطني الباكستاني (القومي ترانه) ونشيد آزاد كشمير، وصاحب «شاهنامة الإسلام» في أربعة مجلدات. وُلد في جالاندهار وهاجر إلى لاهور سنة 1947، وشغل مناصب ثقافية وإعلامية في الدولة الباكستانية الناشئة، ونال وسامَي فخر الأداء وهلال الامتياز."
  en: "Pakistani poet (1900–1982) who wrote the lyrics of Pakistan's national anthem (the Qaumi Tarana) and of the anthem of Azad Kashmir, and authored the four-volume Shahnama-e-Islam. Born in Jalandhar, he migrated to Lahore in 1947, held cultural and publicity posts in the new Pakistani state, and received the Pride of Performance and Hilal-i-Imtiaz awards."
  ur: "پاکستانی شاعر (1900ء–1982ء) جنھوں نے پاکستان کے قومی ترانے اور آزاد کشمیر کے ترانے کے بول لکھے اور چار جلدوں پر مشتمل «شاہنامۂ اسلام» تصنیف کی۔ وہ جالندھر میں پیدا ہوئے، 1947ء میں لاہور آ گئے، نئی پاکستانی ریاست میں ثقافتی و تشہیری مناصب پر فائز رہے اور تمغۂ حسنِ کارکردگی اور ہلالِ امتیاز سے نوازے گئے۔"
