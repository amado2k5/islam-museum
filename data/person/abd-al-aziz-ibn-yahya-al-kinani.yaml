summary:
  ar: "عبد العزيز بن يحيى الكناني المكي المتكلم، وهو الذي ناظر بشر المريسي عند المأمون في نفي خلق القرآن {cite:tabaqat-fuqaha-abbas-1981 p. 54}. قال داود بن علي: هو أحد أصحاب الشافعي، أخذ عنه وطالت صحبته وخرج معه إلى اليمن {cite:tabaqat-fuqaha-abbas-1981 p. 54}. ويذكر الخطيب أنه قدم بغداد أيام المأمون وجرت بينه وبين بشر المريسي مناظرة في القرآن، وأنه صاحب كتاب الحيدة وله مصنفات؛ وعزا إليه داود بن علي فهمًا بمعاني القرآن. ولما دخل على المأمون وكانت خلقته شنيعة فضحك، قال: يا أمير المؤمنين لم ضحك هذا؟ ما اصطفى الله يوسف لجماله وإنما اصطفاه لدينه وبيانه {cite:tarikh-baghdad-khatib j.9 p.449-450}."
