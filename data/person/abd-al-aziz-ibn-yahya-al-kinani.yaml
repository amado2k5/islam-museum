summary:
  ar: "عبد العزيز بن يحيى الكناني المكي المتكلم، وهو الذي ناظر بشر المريسي عند المأمون في نفي خلق القرآن {cite:tabaqat-fuqaha-abbas-1981 p. 54}. قال داود بن علي: هو أحد أصحاب الشافعي، أخذ عنه وطالت صحبته وخرج معه إلى اليمن {cite:tabaqat-fuqaha-abbas-1981 p. 54}. ويذكر الخطيب أنه قدم بغداد أيام المأمون وجرت بينه وبين بشر المريسي مناظرة في القرآن، وأنه صاحب كتاب الحيدة وله مصنفات؛ وعزا إليه داود بن علي فهمًا بمعاني القرآن. ولما دخل على المأمون وكانت خلقته شنيعة فضحك، قال: يا أمير المؤمنين لم ضحك هذا؟ ما اصطفى الله يوسف لجماله وإنما اصطفاه لدينه وبيانه {cite:tarikh-baghdad-khatib j.9 p.449-450}."
  en: "Abd al-Aziz ibn Yahya al-Kinani al-Makki al-Mutakallim, the one who debated Bishr al-Marisi before al-Ma'mun on the denial that the Qur'an is created {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Dawud ibn Ali said he was one of al-Shafi'i's companions: he took from him, kept his company for a long time, and went out with him to Yemen {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Al-Khatib mentions that he came to Baghdad in the days of al-Ma'mun, when a debate on the Qur'an took place between him and Bishr al-Marisi; that he was the author of the book al-Hayda and had other works; and Dawud ibn Ali ascribed to him an understanding of the meanings of the Qur'an. When he entered upon al-Ma'mun, his appearance was unsightly and laughter broke out, and he said: 'O Commander of the Faithful, why is this man laughing? God did not choose Joseph for his beauty, but chose him for his religion and his eloquence' {cite:tarikh-baghdad-khatib j.9 p.449-450}."
  fr: "Abd al-Aziz ibn Yahya al-Kinani al-Makki al-Mutakallim, celui qui débattit avec Bishr al-Marisi devant al-Ma'mun pour réfuter la thèse du Coran créé {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Dawud ibn Ali dit qu'il était l'un des compagnons d'al-Shafi'i : il étudia auprès de lui, resta longtemps en sa compagnie et partit avec lui au Yémen {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Al-Khatib mentionne qu'il vint à Bagdad au temps d'al-Ma'mun, quand un débat sur le Coran eut lieu entre lui et Bishr al-Marisi ; qu'il était l'auteur du livre al-Hayda et d'autres ouvrages ; et Dawud ibn Ali lui attribua une compréhension des sens du Coran. Lorsqu'il entra chez al-Ma'mun, son aspect était disgracieux et des rires éclatèrent, et il dit : « Ô Commandeur des croyants, pourquoi cet homme rit-il ? Dieu n'a pas choisi Joseph pour sa beauté, mais pour sa religion et son éloquence » {cite:tarikh-baghdad-khatib j.9 p.449-450}."
  es: "Abd al-Aziz ibn Yahya al-Kinani al-Makki al-Mutakallim, el que debatió con Bishr al-Marisi ante al-Ma'mun sobre la negación de que el Corán sea creado {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Dawud ibn Ali dijo que fue uno de los compañeros de al-Shafi'i: tomó de él, lo acompañó durante mucho tiempo y salió con él a Yemen {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Al-Khatib menciona que llegó a Bagdad en los días de al-Ma'mun, cuando tuvo lugar un debate sobre el Corán entre él y Bishr al-Marisi; que fue autor del libro al-Hayda y tenía otras obras; y Dawud ibn Ali le atribuyó una comprensión de los significados del Corán. Cuando entró en Al-Ma'mun, su aspecto era desagradable y se desató la risa, y dijo: «¡Oh Comandante de los Creyentes!, ¿por qué se ríe este hombre? Dios no eligió a José por su belleza, sino por su religión y su elocuencia» {cite:tarikh-baghdad-khatib j.9 p.449-450}."
  ur: "عبد العزیز بن یحییٰ الکنانی المکی المتکلم، وہ شخص جس نے بشر المریسی پر المامون کے سامنے قرآن کے تخلیق ہونے کے انکار پر بحث کی تھی۔ 54}۔ داؤد بن علی نے کہا کہ وہ شافعی کے اصحاب میں سے تھے: انہوں نے ان سے لیا، طویل عرصے تک ان کی صحبت میں رہے، اور ان کے ساتھ یمن چلے گئے۔ 54}۔ الخطیب نے ذکر کیا ہے کہ وہ المامون کے زمانے میں بغداد آئے، جب ان کے اور بشر المرسی کے درمیان قرآن پر بحث ہوئی؛ کہ وہ کتاب الحیدہ کا مصنف تھا اور اس کے دوسرے کام بھی تھے۔ اور داؤد بن علی نے ان سے قرآن کے معانی کی تفہیم کی تصدیق کی۔ جب وہ مامون کے پاس پہنچے تو اس کی شکل بدصورت تھی اور ہنسی چھوٹ گئی اور فرمایا: اے امیر المومنین یہ آدمی کیوں ہنس رہا ہے؟ خدا نے یوسف کو اس کی خوبصورتی کے لیے منتخب نہیں کیا بلکہ اسے اس کے دین اور اس کی فصاحت کے لیے منتخب کیا ہے۔"
  tr: "Teolog Abdul Aziz ibn Yahya el-Kinani el-Makki, Kur'an'ın yaratılmışlığının reddi konusunda el-Ma'mun huzurunda Bişr el-Marisi ile tartışan kişiydi. {kaynak: tabaqat-fuqaha-abbas-1981 s. 54}. Davud ibn Ali şöyle demiştir: Şafiî'nin sahabelerinden biriydi, ondan ilim öğrenmiş ve onunla uzun bir ilişki içinde olmuştu ve onunla Yemen'e seyahat etmişti. {kaynak: tabaqat-fuqaha-abbas-1981 s. 54}. El-Hatib, onun el-Ma'mun döneminde Bağdat'a geldiğini ve onunla Bişr el-Marisi arasında Kur'an hakkında bir tartışma geçtiğini, el-Hayda kitabının yazarı olduğunu ve başka eserleri olduğunu; Davud ibn Ali'nin de ona Kur'an'ın anlamlarına dair bir anlayış atfettiğini belirtir. Görünüşü hoş olmayan el-Ma'mun'un yanına girdiğinde, güldü ve şöyle dedi: Ey Müminlerin Emiri, bu adam neden güldü? Allah Yusuf'u güzelliği için değil, dini ve belagatinden dolayı seçti. {Kaynak:tarikh-baghdad-khatib cilt 9, s. 449-450}"
  id: "Abdul Aziz ibn Yahya al-Kinani al-Makki, seorang teolog, adalah orang yang berdebat dengan Bishr al-Marisi di hadapan al-Ma'mun mengenai penyangkalan penciptaan Al-Qur'an {cite:tabaqat-fuqaha-abbas-1981 hlm. 54}. Dawud ibn Ali berkata: Dia adalah salah satu sahabat al-Shafi'i, dari siapa dia belajar dan dengannya dia memiliki hubungan yang lama, dan dia melakukan perjalanan bersamanya ke Yaman {cite:tabaqat-fuqaha-abbas-1981 hlm. 54}. Al-Khatib menyebutkan bahwa dia datang ke Baghdad pada masa pemerintahan al-Ma'mun dan bahwa terjadi perdebatan antara dia dan Bishr al-Marisi mengenai Al-Qur'an, dan bahwa dia adalah penulis kitab al-Hayda dan memiliki karya-karya lain; dan Dawud ibn Ali mengaitkan kepadanya pemahaman tentang makna Al-Qur'an. Ketika ia menemui al-Ma'mun, yang penampilannya tidak menyenangkan, ia tertawa dan berkata: Wahai Amirul Mukminin, mengapa orang ini tertawa? Allah tidak memilih Yusuf karena ketampanannya, melainkan karena agamanya dan kefasihannya {cite:tarikh-baghdad-khatib vol. 9 pp. 449-450}."
