aliases: [person/sulayman-al-kalai]
born: { edtf: "1169~", hijri: "0565", calendar: julian, precision: year, status: tradition, derived: true, note: "ولد سنة خمس وستين وخمسمائة {cite:shadharat-dhahab p. 164}." }
summary:
  ar: "الحافظ أبو الربيع الكلاعي الأندلسي؛ قتل بوقعة أنيجة يوم الخميس لعشر بقين من ذي الحجة سنة 634هـ وكان متقدماً أمام الصفوف ينادي بالمنهزمين «أعن الجنة تفرون» حتى قتل صابراً محتسباً، وكان يقول إن منتهى عمره سبعون سنة لرؤيا رآها في صغره فكان كذلك، ورثاه تلميذه الحافظ ابن الأبار {cite:nafh-tib-maqqari p. 477}. وفي الشذرات: سليمان بن موسى بن سالم البلنسي، الحافظ الكبير الثقة صاحب التصانيف وبقية أعلام الأثر بالأندلس، سمع ابن زرقون وطبقته وكان بصيراً بالحديث عارفاً بالجرح والتعديل، لا نظير لخطه في الإتقان والضبط مع الاستبحار في الأدب والبلاغة، ولى خطابة بلنسية وكان المتكلم عن الملوك على المنبر؛ استشهد بكائنة بقرب بلنسية مقبلاً غير مدبر في ذي الحجة {cite:shadharat-dhahab p. 164}."
  en: "The Andalusi hafiz Abu'l-Rabi al-Kila'i, killed at Anija in 634 calling to the rout 'are you fleeing Paradise?', mourned by his pupil Ibn al-Abbar {cite:nafh-tib-maqqari p. 477}."
  fr: "Le hafiz andalou Abu'l-Rabi al-Kila'i, tué à Anija en 634 en criant aux fuyards « fuyez-vous le Paradis ? », pleuré par son élève Ibn al-Abbar {cite:nafh-tib-maqqari p. 477}."
  es: "El hafiz andalusí Abu'l-Rabi al-Kila'i, asesinado en Anija en 634 gritando a la derrota \"¿estáis huyendo del Paraíso?\", llorado por su alumno Ibn al-Abbar {cita:nafh-tib-maqqari p. 477}."
  ur: "اندلس کے حافظ ابوالربیع الکلائی، جو 634 میں عنیزہ کے مقام پر مارے گئے تھے اور اس کے شاگرد ابن العبر نے ماتم کرتے ہوئے کہا تھا کہ 'کیا تم جنت سے بھاگ رہے ہو؟'۔ 477}۔"
  tr: "El-Hafız Ebu el-Rabi' el-Kala'i el-Endülüs, Hicri 634 yılının Zilhicce ayının onuncu günü Perşembe günü Anija Muharebesi'nde şehit düşmüştür. Savaş alanının ön saflarında yer alarak kaçanlara \"Cennetten mi kaçıyorsunuz?\" diye seslenmiş, Allah'ın takdirine teslim olmuş ve sabırlı bir şekilde ölmüştür. Gençliğinde gördüğü bir rüyaya dayanarak ömrünün yetmiş yaşında sona ereceğini söylerdi ve öyle de olmuştur. Öğrencisi el-Hafız İbn el-Abbar onun için bir mersiye yazmıştır. {kaynak: nafh-tib-makkari s. 477}. El-Şedharat'ta ise Süleyman ibn Musa ibn Salim el-Balansi, hadislerin büyük ve güvenilir bir ezbercisi, çok sayıda eser yazarı ve Endülüs'te hadis rivayetinin önde gelen isimlerinden biridir. İbn Zarqun ve çağdaşlarından hadisler işitmiştir. Hadis ilmi konusunda bilgili ve hadis eleştirisi ve tasdik ilmi konusunda da oldukça yetenekliydi. El yazısı, hassasiyet ve doğruluk bakımından eşsizdi ve edebiyat ile retorik konusunda da derin bir bilgi birikimine sahipti. Valensiya'da vaiz olarak görev yapmış ve minberden krallar adına konuşmuştu. Zilhicce ayında, Valensiya yakınlarında, düşmana sırtını dönmeden, bir çatışmada şehit oldu. {Kaynak: Şadharat-Dhaba s. 164}"
  id: "Al-Hafiz Abu al-Rabi’ al-Kala’i al-Andalusi gugur dalam Perang Anija pada hari Kamis, tanggal 10 Dzul Hijjah, 634 H. Beliau berada di barisan terdepan, menyerukan kepada orang-orang yang melarikan diri, “Apakah kalian melarikan diri dari Surga?” hingga akhirnya gugur, dengan sabar dan pasrah kepada kehendak Allah. Beliau biasa mengatakan bahwa umurnya akan berakhir pada usia tujuh puluh tahun, berdasarkan penglihatan yang dialaminya di masa mudanya, dan hal itu pun terjadi. Muridnya, al-Hafiz Ibn al-Abbar, menulis elegi untuknya. {cite:nafh-tib-maqqari hlm. 477}. Dalam al-Shadharat: Sulayman ibn Musa ibn Salim al-Balansi, penghafal hadits yang hebat dan terpercaya, penulis banyak karya, dan salah satu tokoh terkemuka dalam periwayatan hadits di Andalusia. Beliau mendengar dari Ibn Zarqun dan para sezamannya. Beliau berpengetahuan luas tentang hadits dan mahir dalam ilmu kritik dan otentikasi hadits. Tulisan tangannya tak tertandingi dalam ketelitian dan ketepatannya, dan beliau juga sangat berilmu dalam sastra dan retorika. Beliau memegang jabatan sebagai pendakwah di Valencia dan merupakan orang yang berbicara atas nama raja-raja dari mimbar. Beliau gugur sebagai syahid dalam sebuah insiden di dekat Valencia, menghadapi musuh, tanpa membelakangi, pada bulan Dzul Hijjah. {cite:shadharat-dhahab hlm. 164}."
