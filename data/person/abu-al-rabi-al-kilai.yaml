summary:
  ar: "الحافظ أبو الربيع الكلاعي الأندلسي؛ قتل بوقعة أنيجة يوم الخميس لعشر بقين من ذي الحجة سنة 634هـ وكان متقدماً أمام الصفوف ينادي بالمنهزمين «أعن الجنة تفرون» حتى قتل صابراً محتسباً، وكان يقول إن منتهى عمره سبعون سنة لرؤيا رآها في صغره فكان كذلك، ورثاه تلميذه الحافظ ابن الأبار {cite:nafh-tib-maqqari p. 477}. وفي الشذرات: سليمان بن موسى بن سالم البلنسي، الحافظ الكبير الثقة صاحب التصانيف وبقية أعلام الأثر بالأندلس، سمع ابن زرقون وطبقته وكان بصيراً بالحديث عارفاً بالجرح والتعديل، لا نظير لخطه في الإتقان والضبط مع الاستبحار في الأدب والبلاغة، ولى خطابة بلنسية وكان المتكلم عن الملوك على المنبر؛ استشهد بكائنة بقرب بلنسية مقبلاً غير مدبر في ذي الحجة {cite:shadharat-dhahab p. 164}."
  en: "The Andalusi hafiz Abu'l-Rabi al-Kila'i, killed at Anija in 634 calling to the rout 'are you fleeing Paradise?', mourned by his pupil Ibn al-Abbar {cite:nafh-tib-maqqari p. 477}."
