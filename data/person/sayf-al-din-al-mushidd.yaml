  ar: "علي بن عمر بن قزل التركماني الياروقي المصري، سيف الدين، المعروف بالمشد، شاعر من أمراء التركمان، كان مشد الديوان بدمشق، ولد بمصر وتوفي بدمشق، وله ديوان شعر مخطوط؛ توفي سنة 656 هـ الموافقة 1258 م."
  en: "Ali ibn Umar ibn Qizil al-Turkmani al-Yaruqi al-Misri, Sayf al-Din, known as al-Mushidd, a poet and Turkmen amir who was overseer (mushidd) of the diwan in Damascus; born in Egypt, died in Damascus, left a diwan of poetry in manuscript; died 656 AH (1258)."
