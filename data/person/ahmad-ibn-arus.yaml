summary:
  ar: "أحمد بن عروس المغربي التونسي؛ قال المناوي في طبقات الأولياء كان من أكابر الأولياء من أهل الجذب بتونس له كرامات ظاهرة وأحوال باهرة منها أن الطيور الوحشية كانت تنزل عليه وتأكل من يده ومنها أنه كان عنده جمع وافر من الفقراء فكان يمد يديه في الهواء ويحضر لهم ما يكفيهم من القوت، وكان مهاباً جداً لا يقدر على لقائه كل أحد يقشعر البدن لرؤيته وكان جالساً على سطح فندق بتونس ليلاً ونهاراً ولم يزل كذلك حتى مات في حدود سنة إحدى وسبعين وثمانمائة {cite:shadharat-dhahab p. 311}."
  en: "Ibn 'Arus — 'among the greatest saints of the ecstatic way at Tunis': wild birds came down to eat from his hand, he stretched both hands into the air and produced his fuqara's provender, sat atop a Tunis funduq night and day till death ~871 {cite:shadharat-dhahab p. 311}."
  fr: "Ibn 'Arus, décrit parmi les plus grands saints de la voie extatique à Tunis : des oiseaux sauvages venaient manger dans sa main ; il étendait les mains dans l'air et produisait la subsistance de ses pauvres disciples ; il siégea nuit et jour sur un funduq de Tunis jusqu'à sa mort vers 871 H {cite:shadharat-dhahab p. 311}."
  es: "Ibn 'Arus — 'entre los más grandes santos del camino extático en Túnez': los pájaros silvestres bajaban a comer de su mano, él extendía ambas manos al aire y producía el alimento de su fuqara, se sentaba sobre un funduq de Túnez día y noche hasta su muerte ~871 {cita: shadharat-dhahab p. 311}."
  ur: "ابن عروس - 'تیونس میں پرجوش طریقے کے سب سے بڑے اولیاء میں سے': جنگلی پرندے اس کے ہاتھ سے کھانے کے لیے اترے، اس نے دونوں ہاتھ ہوا میں پھیلائے اور اپنے فقراء کا پرونڈر تیار کیا، رات دن تیونس کے ایک فنڈ کے اوپر موت تک بیٹھا رہا ~ 871۔ 311}۔"
  tr: "Ahmed ibn Arus el-Mağribi el-Tunisi; el-Manavi, Tabaqat el-Evliya’ adlı eserinde, onun Tunus'taki en büyük evliyalardan biri olduğunu söylemiştir. Mucizeleri ve göz kamaştırıcı halleri vardı; örneğin, yabani kuşlar üzerine iner ve elinden yemek yerdi, ayrıca büyük bir fakir topluluğu vardı ve ellerini havaya kaldırarak onlara yeterli yiyecek getirirdi. Çok saygı görüyordu ve kimse onunla görüşmeye cesaret edemezdi. Onu gören herkes ürperirdi. Tunus'taki bir otelin çatısında gece gündüz otururdu ve 871 Hicri yılı civarında vefat edene kadar bu şekilde yaşamaya devam etti. {Kaynak: Şadharat-Dhaba s. 311}"
  id: "Ahmad ibn Arus al-Maghribi al-Tunisi; al-Manawi berkata dalam Tabaqat al-Awliya’ bahwa beliau adalah salah satu orang suci terbesar dari kalangan orang-orang yang menarik perhatian di Tunis. Beliau memiliki mukjizat yang nyata dan keadaan yang menakjubkan, termasuk burung-burung liar yang hinggap di tubuhnya dan makan dari tangannya, dan bahwa beliau memiliki sekelompok besar orang miskin, sehingga beliau akan mengangkat tangannya ke udara dan membawakan mereka makanan yang cukup. Beliau sangat dihormati, dan tidak ada seorang pun yang berani menemuinya. Semua orang akan gemetar melihatnya. Beliau biasa duduk di atap sebuah hotel di Tunis siang dan malam, dan beliau tetap seperti itu sampai beliau wafat sekitar tahun 871 H. {cite:shadharat-dhahab p. 311}."
