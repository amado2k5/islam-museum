summary:
  ar: "أحمد بن عروس المغربي التونسي؛ قال المناوي في طبقات الأولياء كان من أكابر الأولياء من أهل الجذب بتونس له كرامات ظاهرة وأحوال باهرة منها أن الطيور الوحشية كانت تنزل عليه وتأكل من يده ومنها أنه كان عنده جمع وافر من الفقراء فكان يمد يديه في الهواء ويحضر لهم ما يكفيهم من القوت، وكان مهاباً جداً لا يقدر على لقائه كل أحد يقشعر البدن لرؤيته وكان جالساً على سطح فندق بتونس ليلاً ونهاراً ولم يزل كذلك حتى مات في حدود سنة إحدى وسبعين وثمانمائة {cite:shadharat-dhahab p. 311}."
  en: "Ibn 'Arus — 'among the greatest saints of the ecstatic way at Tunis': wild birds came down to eat from his hand, he stretched both hands into the air and produced his fuqara's provender, sat atop a Tunis funduq night and day till death ~871 {cite:shadharat-dhahab p. 311}."
