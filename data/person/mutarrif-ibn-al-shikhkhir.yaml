summary:
  ar: "أبو عبد الله مطرف بن عبد الله بن الشخير الحرشي البصري؛ كان فقيهاً وكان لوالده عبد الله صحبة، وكان مطرف من أعبد الناس وأنسكهم؛ وذكروا أنه وقع بينه وبين رجل منازعة في مسجد البصرة فرغب به فدعا الله ألا يقوم من مجلسه حتى يكفيه إياه فصُرع الرجل فمات، فلما قُدِّم إلى القاضي قال: لم يقتله، وإنما دعا عليه فأجاب الله دعوته، فكان بعد ذلك تُتَّقى دعوته؛ قال الشافعي في قوله حول الاستحلاف على المصحف: وهو حسن؛ ومات سنة سبع وثمانين للهجرة وقيل غير ذلك {cite:wafayat-ayan}."
  en: "Mutarrif b. al-Shikhkhir (d. 87 or later) — the Basran ascetic-faqih whose father had Companionship; al-Shafi'i approved his ruling; the famous story of the man struck dead by his du'a in Basra's mosque {cite:wafayat-ayan}."
