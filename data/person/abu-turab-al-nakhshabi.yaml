summary:
  ar: "أبو تراب النخشبي، من أعلام المتوكلين، تأدب بحاتم الأصم، ودخل أصبهان وأقام بمكة والحجاز، ومات في البادية بين مكة والمدينة بحسب «حلية الأولياء»."
  en: "Abu Turab al-Nakhshabi, a leading figure among those known for trust in God, trained by Hatim al-Asamm; he visited Isfahan, spent time in Mecca and the Hijaz, and died in the desert between Mecca and Medina according to Hilyat al-Awliya."
  fr: "Abu Turab al-Nakhshabi, figure majeure parmi ceux connus pour leur confiance en Dieu, formé par Hatim al-Asamm ; il visita Ispahan, séjourna à La Mecque et dans le Hijaz et mourut dans le désert entre La Mecque et Médine selon Hilyat al-Awliya."
  ur: "ابو تراب نخشبی اہلِ توکل کے نمایاں لوگوں میں سے تھے۔ انہوں نے حاتم اصم سے تربیت پائی۔ وہ اصفہان گئے اور مکہ و حجاز میں رہے۔ «حلیۃ الاولیاء» کے مطابق ان کی وفات مکہ اور مدینہ کے درمیان صحرا میں ہوئی۔"
  es: "Abu Turab al-Nakhshabi, una figura destacada entre aquellos conocidos por su fe en Dios, fue discípulo de Hatim al-Asamm; visitó Isfahán, pasó un tiempo en La Meca y el Hiyaz, y murió en el desierto entre La Meca y Medina, según Hilyat al-Awliya."
