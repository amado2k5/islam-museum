    ar: "الجارد العبدي سيد من عبد القيس كان نصرانياً، قدم في وفد قومه فسأل النبي: أتضمن لي ديني إن تركته لدينك؟ فقال نعم، فأسلم وأسلم أصحابه."
    en: "Al-Jarud al-Abdi, a Christian lord of Abd al-Qays, came in his people's delegation and asked the Prophet 'will you warrant my faith if I leave it for yours?' — 'Yes', he said, and al-Jarud and his companions entered Islam."
