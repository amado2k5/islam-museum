summary:
  ar: "سيد من عبد القيس كان نصرانياً، قدم في وفد قومه على النبي فسأله: أتضمن لي ديني إن تركته لدينك؟ فقال النبي: نعم أنا ضامن أن قد هداك الله إلى ما هو خير منه، فأسلم وأسلم أصحابه؛ وطلب الحملان فلم يجد، ونهاه النبي عن ركوب ضوال الناس. ثبت على إسلامه حتى مات وقد أدرك الردة، ودعا قومه حين ارتدوا مع الغرور إلى الإسلام. ويذكر البلاذري أن عمر أمر سنة 22هـ أن يوجَّه إلى قلاع فارس."
  en: "A chief of Abd al-Qays who had been a Christian; he came in his people's delegation and asked the Prophet to guarantee his religion if he left it for Islam. The Prophet answered that he guaranteed God had guided him to something better, and he and his companions embraced Islam; he asked for mounts, there were none, and the Prophet forbade him to ride stray camels. He remained firm in Islam until he died, having lived into the ridda, when he called his people back from apostasy with al-Gharur. Al-Baladhuri adds that in 22 AH Umar ordered him sent against the fortresses of Fars."
