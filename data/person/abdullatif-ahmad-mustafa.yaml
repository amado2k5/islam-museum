summary:
  ar: "شخصية دينية كردية في إقليم كردستان العراق، وُلد سنة 1969؛ داعية سلفي وإمام مسجد بهشت في السليمانية، وكان حتى يوليو 2026 محاضرًا في كلية العلوم الإسلامية بجامعة السليمانية. يحمل شهادتي دكتوراه في الشريعة الإسلامية، ودرس على العالم اليمني مقبل بن هادي الوادعي، وأسس سنة 2013 قناة ئامۆژگاری التلفزيونية الناطقة بالكردية. في يونيو 2026 جرى تداول تسجيلات صوتية ورسائل نصية مسرّبة على وسائل التواصل الكردية زُعم أنها تُظهره وهو يتحرش جنسيًا بطالبات جامعيات؛ وبعد تحقيق أجرته الجامعة، أصدرت وزارة التعليم العالي في حكومة الإقليم في 1 يوليو 2026 قرارًا بفصله نهائيًا من منصبه الأكاديمي وتجريده من حقوقه التقاعدية. وهو ينفي هذه الادعاءات قائلًا إن التسجيلات مفبركة بالذكاء الاصطناعي، وقال إنه سيطعن في القرار؛ ولم تُنقل إدانة جنائية بحقه في أي مصدر قُرئ."
  en: "Kurdish religious figure in Iraqi Kurdistan, born in 1969: a Salafi preacher, imam of the Behesht (Bahasht) Mosque in Sulaymaniyah and, until July 2026, a lecturer at the College of Islamic Sciences, University of Sulaimani. He holds two doctorates in Islamic law, studied under the Yemeni scholar Muqbil al-Wadi'i, and in 2013 founded Amozhgari TV, a Kurdish-language religious television channel. In June 2026, leaked audio recordings and text messages circulated on Kurdish social media allegedly capturing him sexually harassing female university students; after a University of Sulaimani investigation, the Kurdistan Regional Government's Ministry of Higher Education permanently dismissed him from his academic post on 1 July 2026, stripping his pension rights. He denies the allegations, saying the recordings were fabricated using artificial intelligence, and said he would appeal the decision; no criminal conviction is reported in any source read."
  ur: "عراق کے کردستان خطے کی کرد مذہبی شخصیت، جو 1969ء میں پیدا ہوئے؛ سلفی واعظ اور سلیمانیہ کی بہشت مسجد کے امام، اور جولائی 2026ء تک سلیمانیہ یونیورسٹی کے کالج آف اسلامک سائنسز میں لیکچرر رہے۔ ان کے پاس اسلامی قانون میں دو ڈاکٹریٹ ہیں، انہوں نے یمنی عالم مقبل بن ہادی الوادعی سے تعلیم حاصل کی، اور 2013ء میں کردی زبان کا ٹیلی ویژن چینل ئامۆژگاری قائم کیا۔ جون 2026ء میں کرد سوشل میڈیا پر لیک شدہ آڈیو ریکارڈنگز اور متنی پیغامات گردش میں آئے جن کے بارے میں دعویٰ کیا گیا کہ ان میں وہ طالبات کو جنسی طور پر ہراساں کرتے دکھائی دیتے ہیں؛ یونیورسٹی کی تحقیقات کے بعد خطے کی وزارتِ تعلیمِ عالی نے یکم جولائی 2026ء کو انہیں ان کے تعلیمی عہدے سے مستقل طور پر برطرف کر دیا اور ان کی پنشن کے حقوق ختم کر دیے۔ وہ ان الزامات کی تردید کرتے ہیں اور کہتے ہیں کہ ریکارڈنگز مصنوعی ذہانت سے من گھڑت ہیں، اور انہوں نے فیصلے کے خلاف اپیل کا اعلان کیا؛ کسی بھی مأخذ میں ان کے خلاف کسی مجرمانہ سزا کی اطلاع نہیں۔"
