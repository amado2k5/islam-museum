summary:
  ar: "شخصية دينية كردية في إقليم كردستان العراق، وُلد سنة 1969؛ داعية سلفي وإمام مسجد بهشت في السليمانية، وكان حتى يوليو 2026 محاضرًا في كلية العلوم الإسلامية بجامعة السليمانية. يحمل شهادتي دكتوراه في الشريعة الإسلامية، ودرس على العالم اليمني مقبل بن هادي الوادعي، وأسس سنة 2013 قناة ئامۆژگاری التلفزيونية الناطقة بالكردية. في يونيو 2026 جرى تداول تسجيلات صوتية ورسائل نصية مسرّبة على وسائل التواصل الكردية زُعم أنها تُظهره وهو يتحرش جنسيًا بطالبات جامعيات؛ وبعد تحقيق أجرته الجامعة، أصدرت وزارة التعليم العالي في حكومة الإقليم في 1 يوليو 2026 قرارًا بفصله نهائيًا من منصبه الأكاديمي وتجريده من حقوقه التقاعدية. وهو ينفي هذه الادعاءات قائلًا إن التسجيلات مفبركة بالذكاء الاصطناعي، وقال إنه سيطعن في القرار؛ ولم تُنقل إدانة جنائية بحقه في أي مصدر قُرئ."
  en: "Kurdish religious figure in Iraqi Kurdistan, born in 1969: a Salafi preacher, imam of the Behesht (Bahasht) Mosque in Sulaymaniyah and, until July 2026, a lecturer at the College of Islamic Sciences, University of Sulaimani. He holds two doctorates in Islamic law, studied under the Yemeni scholar Muqbil al-Wadi'i, and in 2013 founded Amozhgari TV, a Kurdish-language religious television channel. In June 2026, leaked audio recordings and text messages circulated on Kurdish social media allegedly capturing him sexually harassing female university students; after a University of Sulaimani investigation, the Kurdistan Regional Government's Ministry of Higher Education permanently dismissed him from his academic post on 1 July 2026, stripping his pension rights. He denies the allegations, saying the recordings were fabricated using artificial intelligence, and said he would appeal the decision; no criminal conviction is reported in any source read."
  ur: "عراق کے کردستان خطے کی کرد مذہبی شخصیت، جو 1969ء میں پیدا ہوئے؛ سلفی واعظ اور سلیمانیہ کی بہشت مسجد کے امام، اور جولائی 2026ء تک سلیمانیہ یونیورسٹی کے کالج آف اسلامک سائنسز میں لیکچرر رہے۔ ان کے پاس اسلامی قانون میں دو ڈاکٹریٹ ہیں، انہوں نے یمنی عالم مقبل بن ہادی الوادعی سے تعلیم حاصل کی، اور 2013ء میں کردی زبان کا ٹیلی ویژن چینل ئامۆژگاری قائم کیا۔ جون 2026ء میں کرد سوشل میڈیا پر لیک شدہ آڈیو ریکارڈنگز اور متنی پیغامات گردش میں آئے جن کے بارے میں دعویٰ کیا گیا کہ ان میں وہ طالبات کو جنسی طور پر ہراساں کرتے دکھائی دیتے ہیں؛ یونیورسٹی کی تحقیقات کے بعد خطے کی وزارتِ تعلیمِ عالی نے یکم جولائی 2026ء کو انہیں ان کے تعلیمی عہدے سے مستقل طور پر برطرف کر دیا اور ان کی پنشن کے حقوق ختم کر دیے۔ وہ ان الزامات کی تردید کرتے ہیں اور کہتے ہیں کہ ریکارڈنگز مصنوعی ذہانت سے من گھڑت ہیں، اور انہوں نے فیصلے کے خلاف اپیل کا اعلان کیا؛ کسی بھی مأخذ میں ان کے خلاف کسی مجرمانہ سزا کی اطلاع نہیں۔"
  es: "Figura religiosa kurda del Kurdistán iraquí, nacida en 1969: predicador salafista, imán de la mezquita Behesht (Bahasht) en Sulaymaniyah y, hasta julio de 2026, profesor en la Facultad de Ciencias Islámicas de la Universidad de Sulaimani. Posee dos doctorados en derecho islámico, estudió con el erudito yemení Muqbil al-Wadi'i y, en 2013, fundó Amozhgari TV, un canal de televisión religioso en idioma kurdo. En junio de 2026, se filtraron grabaciones de audio y mensajes de texto que circularon en redes sociales kurdas, supuestamente mostrándolo acosando sexualmente a estudiantes universitarias. Tras una investigación de la Universidad de Sulaimani, el Ministerio de Educación Superior del Gobierno Regional del Kurdistán lo destituyó definitivamente de su cargo académico el 1 de julio de 2026, privándolo de sus derechos de pensión. Él niega las acusaciones, afirmando que las grabaciones fueron fabricadas con inteligencia artificial, y anunció que apelará la decisión. No se ha reportado ninguna condena penal en ninguna fuente consultada."
  fr: "Figure religieuse kurde du Kurdistan irakien, né en 1969: prédicateur salafiste, imam de la mosquée Behesht (Bahasht) à Souleimaniye et, jusqu’en juillet 2026, maître de conférences à la Faculté des sciences islamiques de l’Université de Souleimaniye. Titulaire de deux doctorats en droit islamique, il a étudié auprès du savant yéménite Muqbil al-Wadi’i et a fondé en 2013 Amozhgari TV, une chaîne de télévision religieuse en langue kurde. En juin 2026, des enregistrements audio et des messages textes, diffusés sur les réseaux sociaux kurdes, l’accusent d’harcèlement sexuel envers des étudiantes. Suite à une enquête de l’Université de Souleimaniye, le ministère de l’Enseignement supérieur du gouvernement régional du Kurdistan le démet définitivement de ses fonctions le 1er juillet 2026 et le prive de ses droits à pension. Il nie les accusations, affirmant que les enregistrements ont été fabriqués par intelligence artificielle, et annonce son intention de faire appel. Aucune condamnation pénale n’est mentionnée dans les sources consultées."
  tr: "Irak Kürdistanı'nda yaşayan, 1969 doğumlu Kürt bir din adamı olan Amozgari, Selefi bir vaiz ve Süleymaniye'deki Beheşt Camii'nin imamıdır. Temmuz 2026'ya kadar Süleymaniye Üniversitesi İslami İlimler Fakültesi'nde öğretim görevlisi olarak çalışmıştır. İslam hukuku alanında iki doktora derecesine sahip olup, Yemenli alim Mukbil bin Hadi el-Vadi'i'nin öğrencisi olmuştur. 2013 yılında Kürtçe yayın yapan Amozgari televizyon kanalını kurmuştur. Haziran 2026'da, Kürt sosyal medyasında dolaşan ses kayıtları ve mesajlar, iddiaya göre üniversitede okuyan kadın öğrencilere cinsel tacizde bulunduğunu göstermiştir. Üniversite soruşturmasının ardından, Kürdistan Bölgesel Hükümeti Yüksek Öğretim Bakanlığı, 1 Temmuz 2026'da, kendisini akademik görevinden kalıcı olarak uzaklaştırma ve emeklilik haklarından mahrum etme kararı almıştır. Bu iddiaları reddeden Amozgari, kayıtların yapay zekâ kullanılarak uydurulduğunu iddia etmiş ve karara itiraz edeceğini belirtmiştir. Hiçbir kaynakta hakkında suç duyurusunda bulunulmamıştır."
  id: "Seorang tokoh agama Kurdi di Kurdistan Irak, lahir pada tahun 1969, ia adalah seorang pendakwah Salafis dan imam Masjid Behesht di Sulaimaniyah. Hingga Juli 2026, ia adalah dosen di Fakultas Ilmu Islam di Universitas Sulaimaniyah. Ia memiliki dua gelar doktor dalam hukum Islam dan belajar di bawah bimbingan ulama Yaman Muqbil bin Hadi al-Wadi'i. Pada tahun 2013, ia mendirikan saluran televisi berbahasa Kurdi, Amozgari. Pada Juni 2026, rekaman audio dan pesan teks yang bocor beredar di media sosial Kurdi, yang diduga menunjukkan dirinya melakukan pelecehan seksual terhadap mahasiswi. Setelah penyelidikan universitas, Kementerian Pendidikan Tinggi Pemerintah Daerah Kurdistan mengeluarkan keputusan pada 1 Juli 2026, yang secara permanen memberhentikannya dari posisi akademiknya dan mencabut hak pensiunnya. Ia membantah tuduhan ini, mengklaim rekaman tersebut direkayasa menggunakan kecerdasan buatan, dan menyatakan akan mengajukan banding atas keputusan tersebut. Tidak ada catatan hukuman pidana terhadapnya yang dilaporkan dalam sumber mana pun."
