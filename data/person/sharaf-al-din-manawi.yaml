gender: male
summary:
  ar: "قاضي القضاة شرف الدين المناوي المصري الشافعي جد الشيخ عبد الرؤوف المناوي شارح الجامع الصغير؛ قال السيوطي في حسن المحاضرة هو شيخنا شيخ الإسلام، ولد سنة ثمان وتسعين وسبعمائة ولازم الولي العراقي وتخرج به في الفقه والأصول وسمع الحديث عليه وعلى الشرف بن الكويك وتصدر للإقراء والإفتاء وتخرج به الأعيان وولي تدريس الشافعي وقضاء الديار المصرية وله شرح مختصر المزني، قال ابن العماد هو آخر علماء الشافعية ومحققيهم وأرثاه بقولي: قلت لما مات شيخ العصر حقاً باتفاق / حين صار الأمر ما بين جهول وفساق / أيتها الدنيا لك الويل إلى يوم التلاق، توفي ليلة الاثنين ثاني جمادى الآخرة سنة إحدى وسبعين وثمانمائة {cite:shadharat-dhahab p. 312}."
  en: "Sharaf al-Din al-Manawi (b. 798) — chief qadi of Egypt, 'last of the Shafi'i scholars and verifiers,' grandfather of 'Abd al-Ra'uf al-Manawi the Jami' al-Saghir commentator; al-Suyuti's shaykh al-Islam; died Monday night 2 Jumada II 871 {cite:shadharat-dhahab p. 312}."
