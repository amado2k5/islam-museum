summary:
  ar: "قاضي القضاة شرف الدين المناوي المصري الشافعي جد الشيخ عبد الرؤوف المناوي شارح الجامع الصغير؛ قال السيوطي في حسن المحاضرة هو شيخنا شيخ الإسلام، ولد سنة ثمان وتسعين وسبعمائة ولازم الولي العراقي وتخرج به في الفقه والأصول وسمع الحديث عليه وعلى الشرف بن الكويك وتصدر للإقراء والإفتاء وتخرج به الأعيان وولي تدريس الشافعي وقضاء الديار المصرية وله شرح مختصر المزني، قال ابن العماد هو آخر علماء الشافعية ومحققيهم وأرثاه بقولي: قلت لما مات شيخ العصر حقاً باتفاق / حين صار الأمر ما بين جهول وفساق / أيتها الدنيا لك الويل إلى يوم التلاق، توفي ليلة الاثنين ثاني جمادى الآخرة سنة إحدى وسبعين وثمانمائة {cite:shadharat-dhahab p. 312}."
  en: "Sharaf al-Din al-Manawi (b. 798) — chief qadi of Egypt, 'last of the Shafi'i scholars and verifiers,' grandfather of 'Abd al-Ra'uf al-Manawi the Jami' al-Saghir commentator; al-Suyuti's shaykh al-Islam; died Monday night 2 Jumada II 871 {cite:shadharat-dhahab p. 312}."
  es: "Sharaf al-Din al-Manawi (n. 798): cadí jefe de Egipto, 'último de los eruditos y verificadores shafíes', abuelo de 'Abd al-Ra'uf al-Manawi, el comentarista Jami' al-Saghir; el jeque al-Islam de al-Suyuti; murió el lunes por la noche 2 Jumada II 871 {cita: shadharat-dhahab p. 312}."
  fr: "Sharaf al-Din al-Manawi (né en 798) — cadi en chef d'Égypte, « dernier des érudits et vérificateurs shafi'ites », grand-père de « Abd al-Ra'uf al-Manawi, le commentateur de Jami' al-Saghir; le cheikh al-Islam d'al-Suyuti; décédé lundi soir 2 Joumada II 871 {cite: shadharat-dhahab p. 312}."
  ur: "شرف الدین المناوی ⁦(وفات 798)⁩ - مصر کے چیف قاضی، 'آخری شافعی علماء اور تصدیق کرنے والے'، 'عبدالرؤف المناوی جامع' الصغیر مفسر کے دادا؛ السیوطی شیخ الاسلام؛ پیر کی رات 2 جمادی الثانی 871 وفات ہوئی۔ 312}۔"
  tr: "Baş Yargıç Şeraf el-Din el-Manavi el-Masri el-Şafii, Şeyh Abdülrauf el-Manavi'nin büyükbabası, el-Cemi el-Saghir'in yorumcusudur; El-Suyuti 'Hasan el-Muhadara'da, kendisinin bizim şeyhimiz, İslam'ın Şeyhi olduğunu, 798 Hicri yılında doğduğunu ve Irak valisine eşlik ettiğini, onunla birlikte fıkıh ve ilkeler alanında mezun olduğunu söylemiştir. Ondan ve Şeraf ibn el-Kuveik'ten hadis duymuştur. Bir Şivit ve fetva verme konusunda önde gelen alimdi, onunla birlikte mezun oldu ve Şafii ile Mısır yargısının öğretiminden sorumlu oldu. Ayrıca el-Muzani üzerine kısa bir tefsir yazdı. İbn el-İmad, Şafii okulunun son alimi ve alimi oldu ve şöyle dedi: Dönemin şeyhi gerçekten anlaşmayla öldüğünde / Konu cehalet ile ahlaksızlık arasında olduğunda / Ey dünya, toplantı gününe kadar vay halin. 871 Hicri yılında, Cumedül-Ahhirah'ın ikinci Pazartesi gecesi vefat etti."
  id: "Ketua Hakim Sharaf al-Din al-Manawi al-Masri al-Shafi'i, kakek dari Sheikh Abdul Raouf al-Manawi, komentator al-Jami' al-Saghir; Al-Suyuti mengatakan dalam 'Hasan al-Muhadara' bahwa dia adalah sheikh kita, Sheikh Islam, lahir pada tahun 798 H, yang mendampingi gubernur Irak dan lulus bersamanya dalam bidang hukum dan prinsip. Dia mendengar hadits dari gubernur itu dan dari Sharaf ibn al-Kuwaik. Dia menjadi ulama terkemuka dalam membaca dan mengeluarkan fatwa, lulus bersamanya, dan bertanggung jawab mengajar Syafi'i dan kehakiman Mesir. Ia juga menulis komentar singkat tentang al-Muzani. Ibn al-Imad adalah ulama dan ulama terakhir dari mazhab Syarah dan mewarisinya, berkata: Ketika Sheikh pada zaman itu benar-benar wafat atas kesepakatan / Ketika urusan menjadi antara kebodohan dan kebejatan / Wahai dunia, celakalah kamu sampai hari pertemuan. Ia meninggal pada malam Senin, tanggal kedua Jumada al-Akhirah tahun 871 H."
