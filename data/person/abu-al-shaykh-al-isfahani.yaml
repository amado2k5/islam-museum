summary:
  ar: "أبو محمد عبد الله بن محمد بن جعفر بن حيان الأنصاري الأصبهاني المعروف بأبي الشيخ ⁦(274–369هـ)⁩، محدث ومفسر مشهور بالثقة، صاحب كتاب العظمة الذي صار المصدر الرئيس لهيئة السيوطي {cite:heinen-islamic-cosmology p. 48}."
  en: "Abu Muhammad Abd Allah ibn Muhammad ibn Ja'far ibn Hayyan al-Ansari al-Isfahani, known as Abu al-Shaykh (274–369 AH), a hadith scholar and exegete reputed reliable, author of Kitab al-Azama, the chief source of al-Suyuti's cosmography {cite:heinen-islamic-cosmology p. 48}."
  ur: "ابو محمد عبد اللہ بن محمد بن جعفر بن حیان انصاری اصبہانی، المعروف ابو الشیخ ⁦(274–369ھ)⁩، ثقہ محدث و مفسر، کتاب العظمہ کے مصنف جو سیوطی کی ہیئت کا بنیادی ماخذ بنی {cite:heinen-islamic-cosmology p. 48}."
  fr: "Abu Muhammad Abd Allah ibn Muhammad ibn Ja'far ibn Hayyan al-Ansari al-Isfahani, connu sous le nom d'Abu al-Shaykh (274–369 H), traditionniste et exégète réputé fiable, auteur du Kitab al-Azama, principale source de la cosmographie d'al-Suyuti {cite:heinen-islamic-cosmology p. 48}."
  es: "Abu Muhammad Abd Allah ibn Muhammad ibn Ja'far ibn Hayyan al-Ansari al-Isfahani, conocido como Abu al-Shaykh (274–369 d. H.), un erudito en hadices y exégeta reputado confiable, autor de Kitab al-Azama, la principal fuente de la cosmografía de al-Suyuti {citar:heinen-islamic-cosmology p. 48}."
  tr: "Ebu Muhammed Abdullah ibn Muhammed ibn Cafer ibn Hayyan el-Ensari el-İsfahani, Ebu el-Şeyh olarak da bilinir (274-369 Hicri), güvenilirliğiyle ünlü bir hadis alimi ve tefsirci olup, El-Suyuti'nin eserinin ana kaynağı haline gelen El-Azame kitabının yazarıdır. {cite:heinen-islamic-cosmology s. 48}."
  id: "Abu Muhammad Abdullah ibn Muhammad ibn Ja`far ibn Hayyan al-Ansari al-Isfahani, dikenal sebagai Abu al-Sheikh (274–369 H), seorang ulama hadits dan komentator yang terkenal karena kredibilitasnya, penulis kitab Al-`Azamah, yang menjadi sumber utama karya Al-Suyuti {cite:heinen-islamic-cosmology p. 48}."
