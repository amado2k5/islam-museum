class: person
label: { ar: "عبد الرحمن بن رستم الإمام", en: "Abd al-Rahman ibn Rustam, the Imam", fr: "Abd al-Rahman ibn Rustam, l'imam", es: "Abd al-Rahman ibn Rustam, the Imam", ur: "عبدالرحمٰن بن رستم، امام" }
summary:
  ar: "إمام الأباضية ومؤسس دولة بني رستم؛ ولى على القيروان ثم فر منها إلى تاهرت فاختطها سنة 144هـ فتمدنت وتعزى إليه الأباضية من البربر واتصلت دولته {cite:tarikh-ibn-khaldun-ibar p. 1613-1614}."
  en: "Ibadi imam and founder of the Rustamid state; after ruling Kairouan he fled to Tahert and founded the city in 144, where the Ibadi Berbers rallied to him {cite:tarikh-ibn-khaldun-ibar p. 1613-1614}."
  fr: "Imam ibadite et fondateur de l'État rustamide ; après avoir gouverné Kairouan, il s'enfuit à Tahert et fonda la ville en 144, où les Berbères ibadites se rallièrent à lui {cite:tarikh-ibn-khaldun-ibar p. 1613-1614}."
  es: "Imán ibadí y fundador del estado de Rustamid; después de gobernar Kairouan, huyó a Tahert y fundó la ciudad en 144, donde los bereberes ibadíes se unieron a él {cite:tarikh-ibn-khaldun-ibar p. 1613-1614}."
  ur: "عبادی امام اور رستمی ریاست کے بانی؛ کیروان پر حکومت کرنے کے بعد وہ تہرٹ کی طرف بھاگا اور 144 میں اس شہر کی بنیاد رکھی، جہاں عبادی بربر اس کے لیے جمع ہوئے تھے۔ 1613-1614}۔"
  tr: "İbadilerin imamı ve Beni Rüştam devletinin kurucusu; Kayrevan valiliğine atanmış, daha sonra oradan Tahert'e kaçmış ve 144 Hicri yılında Tahert'i kurarak medenileştirmiştir. Berberi İbadileri ona atfedilir ve devleti onunla bağlantılıdır. {cite:tarikh-ibn-khaldun-ibar s. 1613-1614}."
  id: "Imam dari suku Ibadi dan pendiri negara Banu Rustam; ia diangkat menjadi gubernur Kairouan, kemudian ia melarikan diri dari sana ke Tahert, yang ia dirikan pada tahun 144 H, dan kota itu menjadi beradab. Suku Ibadi dari Berber dikaitkan dengannya, dan negaranya terhubung dengan {cite:tarikh-ibn-khaldun-ibar p. 1613-1614}."
