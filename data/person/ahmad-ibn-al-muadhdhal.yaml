summary:
  ar: "من العلماء، جمعه المتوكل في داره فقام الناس كلهم له غيره فقيل في بصره سوء فقال ما في بصري سوء ولكن نزهتك من عذاب الله وروى عن النبي من أحب أن يتمثل له الرجال قياماً فليتبوأ مقعده من النار فجاء المتوكل فجلس إلى جنبه {cite:tarikh-khulafa-minhaj-1434 p. 546}."
  en: "A scholar gathered by al-Mutawakkil; alone he kept his seat — 'it is not my sight; I held you above God's torment, for the Prophet said whoever loves that men stand for him, let him take his seat in the Fire' — and the caliph came and sat beside him {cite:tarikh-khulafa-minhaj-1434 p. 546}."
