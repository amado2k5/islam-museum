id: person/ahmad-ibn-al-muadhdhal
class: person
label: { ar: "أحمد بن المعذل", en: "Ahmad ibn al-Mu'adhdhal", fr: "Ahmad ibn al-Mu'adhdhal", es: "Ahmad ibn al-Mu'adhdhal", ur: "احمد بن المعدل" }
summary:
  ar: "من العلماء، جمعه المتوكل في داره فقام الناس كلهم له غيره فقيل في بصره سوء فقال ما في بصري سوء ولكن نزهتك من عذاب الله وروى عن النبي من أحب أن يتمثل له الرجال قياماً فليتبوأ مقعده من النار فجاء المتوكل فجلس إلى جنبه {cite:tarikh-khulafa-minhaj-1434 p. 546}."
  en: "A scholar gathered by al-Mutawakkil; alone he kept his seat — 'it is not my sight; I held you above God's torment, for the Prophet said whoever loves that men stand for him, let him take his seat in the Fire' — and the caliph came and sat beside him {cite:tarikh-khulafa-minhaj-1434 p. 546}."
  fr: "Savant réuni par al-Mutawakkil, il resta seul assis, expliquant que ce n'était pas sa vue mais le désir de préserver le calife du châtiment divin, selon le hadith condamnant ceux qui aiment que l'on se lève pour eux ; le calife vint s'asseoir près de lui {cite:tarikh-khulafa-minhaj-1434 p. 546}."
  es: "Un erudito reunido por al-Mutawakkil; solo él permaneció en su asiento — 'no es mi vista; te sostuve por encima del tormento de Dios, pues el Profeta dijo quien ama que los hombres estén de pie por él, que tome su asiento en el Fuego' — y el califa vino y se sentó junto a él {cite:tarikh-khulafa-minhaj-1434 p. 546}."
  ur: "متوکل کی طرف سے جمع کردہ ایک عالم؛ اکیلے اس نے اپنی نشست رکھی - 'یہ میری نظر نہیں ہے؛ میں نے آپ کو عذاب الٰہی سے بالاتر رکھا، کیونکہ رسول اللہ نے فرمایا جو شخص اس سے محبت کرتا ہے کہ لوگ اس کے لیے کھڑے ہوں، وہ اپنی جگہ آگ میں بیٹھ جائے، اور خلیفہ آیا اور اس کے پاس بیٹھ گیا۔ 546}۔"
  tr: "Alimler arasında, Mütevekkil onu evinde topladı ve bütün insanlar onun için ayağa kalktı, bir tek o kalkmadı. Gözlerinde bir sorun olduğu söylendi, bunun üzerine şöyle dedi: \"Gözlerimde bir sorun yok, ama sizi Allah'ın azabından kurtardım.\" Peygamberden rivayetle şöyle buyurdu: \"Kim insanların onun için ayağa kalkmasını isterse, cehennemde yerini alsın.\" Sonra Mütevekkil gelip yanına oturdu. {cite:tarikh-khulafa-minhaj-1434 s. 546}"
  id: "Di antara para ulama, Al-Mutawakkil mengumpulkannya di rumahnya, dan semua orang berdiri untuknya kecuali dia. Dikatakan bahwa ada sesuatu yang salah dengan penglihatannya, lalu dia berkata, “Tidak ada yang salah dengan penglihatanku, tetapi aku telah menyelamatkanmu dari azab Allah.” Dia meriwayatkan dari Nabi, “Barangsiapa yang suka orang-orang berdiri untuknya, biarlah dia mengambil tempatnya di Neraka.” Kemudian Al-Mutawakkil datang dan duduk di sebelahnya. {cite:tarikh-khulafa-minhaj-1434 p. 546}"
