label: { ar: "محمد بن خفيف الشيرازي", en: "Ibn Khafif al-Shirazi", es: "Ibn Khafif al-Shirazi", fr: "Ibn Khafif al-Shirazi", ur: "ابن خفیف الشیرازی" }
died: { edtf: "0982~", hijri: "0371-08-08", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي في ثامن رمضان سنة إحدى وسبعين وثلاثمائة عن خمس وتسعين سنة وقيل عاش مائة سنة وأربع سنين؛ ازدحم الناس على جنازته وصلى عليه نحو مائة مرة {cite:shadharat-dhahab p. 76-77}." }
summary:
  ar: "أبو عبد الله محمد بن خفيف الشيرازي، شيخ إقليم فارس وصاحب الأحوال والمقامات؛ قال السلمي هو اليوم شيخ المشايخ وتاريخ الزمان لم يبق للقوم أقدم منه سناً ولا أتم حالاً، متمسك بالكتاب والسنة فقيه على مذهب الشافعي؛ كان من أولاد الأمراء فتزهد حتى قال كنت أذهب فأجمع الخرق من المزابل فأغسلها وأصلح منها ما ألبسه؛ ورحل إلى الشيخ أبي الحسن الأشعري وأخذ عنه وهو من أعيان تلامذته، وقال أحمد بن يحيى: ما أرى التصوف إلا يختم بأبي عبد الله بن خفيف، وقال السبكي: شيخ المشايخ وذو القدم الراسخ في العلم والدين؛ صلى عليه نحو مائة مرة {cite:shadharat-dhahab p. 76-77}."
  en: "Abu Abdallah Muhammad b. Khafif al-Shirazi (d. 8 Ramadan 371) — shaykh of Fars, Shafi'i faqih and Sufi master, pupil of Abu'l-Hasan al-Ash'ari; a prince's son who went ragged, washed and patched scraps from the refuse heaps; a hundred funeral prayers were said over him {cite:shadharat-dhahab p. 76-77}."
  es: "Abu Abdallah Muhammad b. Khafif al-Shirazi (m. 8 Ramadan 371) — shaykh de Fars, faqih shafi'i y maestro sufí, discípulo de Abu'l-Hasan al-Ash'ari; hijo de un príncipe que andaba harapiento, lavaba y remendaba retazos de los montones de basura; se rezaron cien oraciones fúnebres por él {cite:shadharat-dhahab p. 76-77}."
  fr: "Abu Abdallah Muhammad b. Khafif al-Shirazi (d. 8 Ramadan 371) — cheikh de Fars, faqih shafi'i et maître soufi, élève d'Abu'l-Hasan al-Ash'ari; fils de prince qui vivait dans la misère, se lavait et rapiéçait avec des bouts de tissu trouvés dans les tas d'ordures; cent prières funéraires ont été dites sur lui {cite:shadharat-dhahab p. 76-77}."
  ur: "ابو عبداللہ محمد بن خفیف الشیرازی ⁦(متوفی 8 رمضان 371)⁩ — فارس کے شیخ، شافعی فقیہ اور صوفی استاد، ابوالحسن اشعری کے شاگرد؛ ایک شہزادے کا بیٹا جو کچرے کے ڈھیروں سے چیتھڑے، دھلائے اور تھوڑے ہوئے سکریپ چلا گیا۔ آپ پر سو نماز جنازہ پڑھی گئی 76-77}۔"
  tr: "Fars bölgesinin şeyhi ve koşulların ve mevkilerin ustası Ebu Abdullah Muhammed bin Khafif el-Şirazi; El-Sulami şöyle dedi: Bugün o, şeyhlerin ve zamanın tarihinin şeyhidir. Kitap ve Sünnet'e bağlı, Şafi mezhebine göre bir hukukçu olan kimse ondan daha yaşlı ya da daha eksiksiz kalmamıştır; Prenslerin oğulları arasındaydı ve 'Giderdim, çöplerden paçavraları toplar, yıkar, giydiklerimi tamir ederdim.' dedi. Şeyh Ebu el-Hasan el-Eşari'ye seyahat etti ve onun yanında eğitim aldı, onun önde gelen öğrencilerinden biriydi. Ahmed bin Yahya şöyle dedi: Sufizmi sadece Ebu Abdullah bin Xaf ile mühürlenmiş olarak görüyorum. El-Subki şöyle dedi: Şeyhlerin şeyhi ve bilgisi ile dininde sağlam bir adamdır; yaklaşık yüz kez namaz kılmıştır {alıntı:) Shadharat-Dhahab, s. 76-77}."
  id: "Abu Abdullah Muhammad ibn Khafif al-Shirazi, sheikh wilayah Fars dan penguasa kondisi serta status; Al-Sulami berkata: Hari ini, dia adalah sheikh para sheikh dan sejarah waktu. Tidak ada yang lebih tua atau lebih lengkap darinya, yang mematuhi Kitab dan Sunnah, seorang ahli hukum menurut mazhab Syafi'i; dia termasuk putra para pangeran dan menjadi pertapa sampai dia berkata, 'Saya biasa pergi, mengumpulkan kain lap dari sampah, mencucinya, dan memperbaiki apa yang saya pakai.' Dia melakukan perjalanan kepada Sheikh Abu al-Hasan al-Ash'ari dan belajar di bawah bimbingannya, dan dia termasuk di antara murid-muridnya yang terkemuka. Ahmad ibn Yahya berkata: Saya tidak melihat Sufisme kecuali bahwa itu disegel dengan Abu Abdullah ibn Khaf. Al-Subki berkata: Sheikh para sheikh dan seorang pria yang teguh dalam pengetahuan dan agama; dia didoakan sekitar seratus kali {cite:shadharat-dhahab, hlm. 76-77}."
