died: { edtf: "0982~", hijri: "0371-08-08", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي في ثامن رمضان سنة إحدى وسبعين وثلاثمائة عن خمس وتسعين سنة وقيل عاش مائة سنة وأربع سنين؛ ازدحم الناس على جنازته وصلى عليه نحو مائة مرة {cite:shadharat-dhahab p. 76-77}." }
summary:
  ar: "أبو عبد الله محمد بن خفيف الشيرازي، شيخ إقليم فارس وصاحب الأحوال والمقامات؛ قال السلمي هو اليوم شيخ المشايخ وتاريخ الزمان لم يبق للقوم أقدم منه سناً ولا أتم حالاً، متمسك بالكتاب والسنة فقيه على مذهب الشافعي؛ كان من أولاد الأمراء فتزهد حتى قال كنت أذهب فأجمع الخرق من المزابل فأغسلها وأصلح منها ما ألبسه؛ ورحل إلى الشيخ أبي الحسن الأشعري وأخذ عنه وهو من أعيان تلامذته، وقال أحمد بن يحيى: ما أرى التصوف إلا يختم بأبي عبد الله بن خفيف، وقال السبكي: شيخ المشايخ وذو القدم الراسخ في العلم والدين؛ صلى عليه نحو مائة مرة {cite:shadharat-dhahab p. 76-77}."
  en: "Abu Abdallah Muhammad b. Khafif al-Shirazi (d. 8 Ramadan 371) — shaykh of Fars, Shafi'i faqih and Sufi master, pupil of Abu'l-Hasan al-Ash'ari; a prince's son who went ragged, washed and patched scraps from the refuse heaps; a hundred funeral prayers were said over him {cite:shadharat-dhahab p. 76-77}."
