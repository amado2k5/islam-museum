summary:
  ar: "بطاقة أولية لبهادر شاه الأول، سابع أباطرة المغول بعد أورنكزيب، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Bahadur Shah I, seventh Mughal emperor after Aurangzeb, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Bahadur Shah I, séptimo emperador mogol después de Aurangzeb, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet de Bahadur Shah Ier, septième empereur moghol après Aurangzeb, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "اورنگزیب کے بعد ساتویں مغل شہنشاہ بہادر شاہ اول کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Aurangzeb'den sonra yedinci Babür imparatoru olan Bahadur Şah I'in ön kartı, açık bir referans tanımında (Wikidata) bahsedilmiştir. Hasan İbrahim'in İslam Tarihi eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan Bahadur Shah I, kaisar Mughal ketujuh setelah Aurangzeb, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Islam karya Hasan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
