summary:
  ar: "الصاحب بن عباد وزير آل بويه وصاحب الخزانة المشهورة؛ قال في الأغاني إن سيف الدولة قصر بألف دينار وإنه ليستحق أضعافها، وقال لقد اشتملت خزانتي على مئة ألف وسبعة عشر ألف مجلد ما فيها سميري غيره، وذكر ابن خلكان أنه كان يستصحب حمل ثلاثين جملاً من كتب الأدب فلما وصل إليه الأغاني استغنى به عنها {cite:kashf-zunun-furqan p. 527-528}."
  en: "The Sahib Ibn Abbad, Buyid wazir and keeper of the famous library — who judged Sayf al-Dawla's thousand dinars too little for the Aghani, called it his one boon-companion in 117,000 volumes, and swapped his thirty-camel adab caravan for it alone {cite:kashf-zunun-furqan p. 527-528}."
