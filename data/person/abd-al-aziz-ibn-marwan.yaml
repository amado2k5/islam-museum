label: { ar: "عبد العزيز بن مروان", en: "Abd al-Aziz ibn Marwan" }
gender: male
summary:
  ar: "ابن مروان بن الحكم، أخو عبد الملك، عيّنه أبوه والياً على مصر سنة 65هـ، فبقي فيها نحو عشرين سنة إلى سنة 85هـ، وكان من ركائز دولة أخيه {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. ذكر الكتاب خلافه مع حسان بن النعمان على ولايتي برقة وطرابلس، ثم عزله حسان عن إفريقية وتولية موسى بن نصير مكانه. {cite:salabi-umayyad-state-2020 p.62-63} ويذكر الكتاب أنه أقام أمير مصر أكثر من عشرين سنة، وكان أجود أمراء بني أمية، وأن له ألف جفنة تُنصب حول داره كل يوم. {cite:salabi-umayyad-state-2020 p.159-160}"
  en: "Ibn Marwan ibn al-Hakam, brother of Abd al-Malik. His father appointed him governor of Egypt in 65 AH, and he remained there for some twenty years, until 85 AH; he was one of the pillars of his brother's state {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. The book mentions his dispute with Hassan ibn al-Nu'man over the governorships of Barqa and Tripoli; then Hassan removed him from Ifriqiya and appointed Musa ibn Nusayr in his place. {cite:salabi-umayyad-state-2020 p.62-63} The book also says that he was amir of Egypt for more than twenty years, was the most generous of the Umayyad princes, and had a thousand jafna (large serving dishes) set out around his house every day. {cite:salabi-umayyad-state-2020 p.159-160}"
