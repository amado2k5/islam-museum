summary:
  ar: "ابن مروان بن الحكم، أخو عبد الملك، عيّنه أبوه والياً على مصر سنة 65هـ، فبقي فيها نحو عشرين سنة إلى سنة 85هـ، وكان من ركائز دولة أخيه {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. ذكر الكتاب خلافه مع حسان بن النعمان على ولايتي برقة وطرابلس، ثم عزله حسان عن إفريقية وتولية موسى بن نصير مكانه. {cite:salabi-umayyad-state-2020 p.62-63} ويذكر الكتاب أنه أقام أمير مصر أكثر من عشرين سنة، وكان أجود أمراء بني أمية، وأن له ألف جفنة تُنصب حول داره كل يوم. {cite:salabi-umayyad-state-2020 p.159-160}"
