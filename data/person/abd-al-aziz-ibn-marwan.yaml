label: { ar: "عبد العزيز بن مروان", en: "Abd al-Aziz ibn Marwan", fr: "Abd al-Aziz ibn Marwan", es: "Abd al-Aziz ibn Marwan", ur: "عبد العزیز بن مروان" }
gender: male
summary:
  ar: "ابن مروان بن الحكم، أخو عبد الملك، عيّنه أبوه والياً على مصر سنة 65هـ، فبقي فيها نحو عشرين سنة إلى سنة 85هـ، وكان من ركائز دولة أخيه {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. ذكر الكتاب خلافه مع حسان بن النعمان على ولايتي برقة وطرابلس، ثم عزله حسان عن إفريقية وتولية موسى بن نصير مكانه. {cite:salabi-umayyad-state-2020 p.62-63} ويذكر الكتاب أنه أقام أمير مصر أكثر من عشرين سنة، وكان أجود أمراء بني أمية، وأن له ألف جفنة تُنصب حول داره كل يوم. {cite:salabi-umayyad-state-2020 p.159-160}"
  en: "Ibn Marwan ibn al-Hakam, brother of Abd al-Malik. His father appointed him governor of Egypt in 65 AH, and he remained there for some twenty years, until 85 AH; he was one of the pillars of his brother's state {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. The book mentions his dispute with Hassan ibn al-Nu'man over the governorships of Barqa and Tripoli; then Hassan removed him from Ifriqiya and appointed Musa ibn Nusayr in his place. {cite:salabi-umayyad-state-2020 p.62-63} The book also says that he was amir of Egypt for more than twenty years, was the most generous of the Umayyad princes, and had a thousand jafna (large serving dishes) set out around his house every day. {cite:salabi-umayyad-state-2020 p.159-160}"
  fr: "Fils de Marwan ibn al-Hakam, frère d'Abd al-Malik. Son père le nomma gouverneur d'Égypte en 65 H, et il y resta quelque vingt ans, jusqu'en 85 H ; il fut l'un des piliers de l'État de son frère {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. Le livre mentionne son différend avec Hassan ibn al-Nu'man au sujet des gouvernements de Barqa et de Tripoli ; puis Hassan fut écarté de l'Ifriqiya et Musa ibn Nusayr nommé à sa place. {cite:salabi-umayyad-state-2020 p.62-63} Le livre dit aussi qu'il fut émir d'Égypte plus de vingt ans, qu'il était le plus généreux des princes omeyyades, et qu'on disposait chaque jour mille jafna (grands plats de service) autour de sa maison. {cite:salabi-umayyad-state-2020 p.159-160}"
  es: "Ibn Marwan ibn al-Hakam, hermano de Abd al-Malik. Su padre lo nombró gobernador de Egipto en el año 65 de la Hégira, y permaneció allí durante unos veinte años, hasta el año 85 de la Hégira; fue uno de los pilares del estado de su hermano {cite:umayyad-birth-to-fall-2006 p. 31}{cite:umayyad-birth-to-fall-2006 p. 41}. El libro menciona su disputa con Hassan ibn al-Nu'man por las gobernaciones de Barqa y Trípoli; entonces Hassan lo destituyó de Ifriqiya y nombró a Musa ibn Nusayr en su lugar. {cite:salabi-umayyad-state-2020 p.62-63} El libro también dice que fue emir de Egipto durante más de veinte años, fue el más generoso de los príncipes omeyas, y tenía mil jafna (grandes fuentes para servir) dispuestas alrededor de su casa todos los días. {cite:salabi-umayyad-state-2020 p.159-160}"
  ur: "ابن مروان ابن الحکم، عبد الملک کا بھائی۔ ان کے والد نے انہیں 65 ہجری میں مصر کا گورنر مقرر کیا اور وہ 85 ہجری تک تقریباً بیس سال وہاں رہے۔ وہ اپنے بھائی کی ریاست کے ستونوں میں سے ایک تھے۔ 31}{حوالہ دیں:امیاد-پیدائش سے زوال-2006 صفحہ۔ 41}۔ اس کتاب میں حسن بن نعمان کے ساتھ برقع اور طرابلس کی گورنری کے تنازعہ کا ذکر ہے۔ پھر حسن نے اسے عفریقیہ سے ہٹا کر اس کی جگہ موسیٰ بن نصیر کو مقرر کیا۔ کتاب میں یہ بھی کہا گیا ہے کہ وہ بیس سال سے زیادہ مصر کا امیر تھا، اموی شہزادوں میں سب سے زیادہ سخی تھا، اور روزانہ ایک ہزار جفنا ⁦(بڑے سرونگ ڈشز)⁩ اپنے گھر کے گرد لگاتا تھا۔ {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 159-160}"
  tr: "Abdülmalik'in kardeşi İbn Mervan ibn el-Hakam, babası tarafından Hicri 65 yılında Mısır valisi olarak atandı. Hicri 85 yılına kadar yaklaşık yirmi yıl boyunca bu görevde kaldı ve kardeşinin devletinin temel direklerinden biriydi. Kitapta, Barka ve Trablus valilikleri konusunda Hasan ibn el-Nu'man ile yaşadığı anlaşmazlıktan bahsedilir; bu anlaşmazlıktan sonra Hasan onu İfrikiye'den azletmiş ve yerine Musa ibn Nusayr'ı atamıştır. Kitap ayrıca, yirmi yıldan fazla bir süre Mısır valisi olarak kaldığını, Emevi valileri arasında en cömert olanı olduğunu ve her gün evinin etrafına bin büyük kap yemek konulduğunu belirtmektedir."
  id: "Ibn Marwan ibn al-Hakam, saudara Abd al-Malik, diangkat oleh ayahnya sebagai gubernur Mesir pada tahun 65 H. Ia tetap menjabat selama kurang lebih dua puluh tahun hingga tahun 85 H dan merupakan salah satu pilar negara saudaranya. Kitab ini menyebutkan perselisihannya dengan Hassan ibn al-Nu'man mengenai jabatan gubernur Barqa dan Tripoli, setelah itu Hassan memecatnya dari Ifriqiya dan menunjuk Musa ibn Nusayr sebagai penggantinya. Kitab ini juga menyatakan bahwa ia tetap menjabat sebagai gubernur Mesir selama lebih dari dua puluh tahun, merupakan gubernur Umayyah yang paling dermawan, dan bahwa seribu mangkuk besar makanan disiapkan di sekitar rumahnya setiap hari."
