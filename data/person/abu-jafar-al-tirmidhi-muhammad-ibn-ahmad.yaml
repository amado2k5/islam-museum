summary:
  ar: "أبو جعفر محمد بن أحمد بن نصر الترمذي، سكن بغداد، ولم يكن للشافعي في وقته بالعراق أرأس ولا أورع ولا أكثر تتبعاً منه، وكان لا يسأل أحداً شيئاً {cite:tabaqat-fuqaha-abbas-1981 p. 55}. ومات في المحرم سنة خمس وتسعين ومائتين {cite:tabaqat-fuqaha-abbas-1981 p. 55}. ويروي الشيرازي أنه تفقه لأبي حنيفة، ثم رأى النبي في المنام فأمره أن يأخذ ما وافق سنته {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  en: "Abu Jafar Muhammad ibn Ahmad ibn Nasr al-Tirmidhi, who settled in Baghdad. In Iraq in his time no one was a greater leader of the Shafi'i school, more scrupulous, or more thorough, and he never asked anyone for anything {cite:tabaqat-fuqaha-abbas-1981 p. 55}. He died in Muharram 295 {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Al-Shirazi relates that he studied Hanafi fiqh, then saw the Prophet in a dream, who commanded him to take what agreed with his sunna {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  fr: "Abu Jafar Muhammad ibn Ahmad ibn Nasr al-Tirmidhi, qui s'établit à Bagdad. En Irak, de son temps, personne n'était plus grand maître de l'école shafiite, plus scrupuleux ni plus rigoureux, et il ne demanda jamais rien à personne {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Il mourut en muharram 295 {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Al-Shirazi rapporte qu'il étudia le fiqh hanafite, puis vit le Prophète en songe, qui lui ordonna de prendre ce qui s'accordait avec sa sunna {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  es: "Abu Jafar Muhammad ibn Ahmad ibn Nasr al-Tirmidhi, quien se estableció en Bagdad. En Irak, en su época, nadie fue un líder más destacado de la escuela Shafi'i, más escrupuloso ni más minucioso, y nunca pidió nada a nadie {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Murió en Muharram de 295 {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Al-Shirazi relata que estudió fiqh hanafi y luego vio al Profeta en un sueño, quien le ordenó que adoptara lo que estuviera de acuerdo con su sunna {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  ur: "ابو جعفر محمد بن احمد بن نصر ترمذی جو بغداد میں آباد ہوئے۔ عراق میں ان کے زمانے میں شافعی مکتب کا اس سے بڑا رہنما کوئی نہیں تھا، اس سے زیادہ بااخلاق، یا اس سے زیادہ مکمل، اور اس نے کبھی کسی سے کچھ نہیں پوچھا۔ 55}۔ آپ کا وصال محرم 295 میں ہوا۔ 55}۔ الشیرازی بیان کرتے ہیں کہ انہوں نے حنفی فقہ کا مطالعہ کیا، پھر خواب میں نبی کو دیکھا، آپ نے آپ کو حکم دیا کہ آپ کی سنت کے مطابق عمل کریں۔ 55}۔"
