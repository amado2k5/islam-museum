summary:
  ar: "أبو جعفر محمد بن أحمد بن نصر الترمذي، سكن بغداد، ولم يكن للشافعي في وقته بالعراق أرأس ولا أورع ولا أكثر تتبعاً منه، وكان لا يسأل أحداً شيئاً {cite:tabaqat-fuqaha-abbas-1981 p. 55}. ومات في المحرم سنة خمس وتسعين ومائتين {cite:tabaqat-fuqaha-abbas-1981 p. 55}. ويروي الشيرازي أنه تفقه لأبي حنيفة، ثم رأى النبي في المنام فأمره أن يأخذ ما وافق سنته {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  en: "Abu Jafar Muhammad ibn Ahmad ibn Nasr al-Tirmidhi, who settled in Baghdad. In Iraq in his time no one was a greater leader of the Shafi'i school, more scrupulous, or more thorough, and he never asked anyone for anything {cite:tabaqat-fuqaha-abbas-1981 p. 55}. He died in Muharram 295 {cite:tabaqat-fuqaha-abbas-1981 p. 55}. Al-Shirazi relates that he studied Hanafi fiqh, then saw the Prophet in a dream, who commanded him to take what agreed with his sunna {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
