id: person/abu-ahmad-al-muwaffaq
class: person
label: { ar: "أبو أحمد الموفق", en: "Abu Ahmad al-Muwaffaq" , ur: "ابو احمد الموفق", fr: "Abu Ahmad al-Muwaffaq", es: "Abu Ahmad al-Muwaffaq" }
summary:
  ar: "أخو الخليفة المعتمد؛ ذكر الطبري انصرافه من الجبل إلى العراق ومرضه بوجع النقرس، ثم وفاته يوم الأربعاء لثمان بقين من صفر سنة ثمان وسبعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22} وعند السيوطي خلع عليه أخوه المعتز خلعة الملك وتوجه بتاج من ذهب وقلنسوة مجوهرة ووشاحين وقلده سيفين ثم عزله من عامه ونفاه إلى واسط {cite:tarikh-khulafa-minhaj-1434 p. 557}، وعند السيوطي استعمله أخوه المعتمد على المشرق وكان أمير العسكر في أكثر وقعات الزنج فلما قتل صاحب الزنج ضج الناس بالدعاء للموفق ومدحه الشعراء، وفي سنة تسع وستين أحضر المعتمد راجعاً من وجه دمشق وحجر عليه فلقب ابن كنداج ذا السيفين وصاعداً ذا الوزارتين وأمر بلعنة ابن طولون على المنابر، ومات سنة ثمان وسبعين فاستراح منه المعتمد {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. وعند المسعودي انصرف من بغداد إلى سامرا لما خلع المستعين فخلع عليه المعتز وتوجه ووشحه بوشاحين وخلع على قواده {cite:muruj-al-dhahab p. 545}، وعند المسعودي حبسه المعتز مع أخيه المؤيد ثم ضيق حبسه وأشخصه إلى البصرة لثلاث عشرة ليلة بقيت من رمضان سنة اثنتين وخمسين، وكان بين إكرامه وحبسه ستة أشهر وثلاثة أيام {cite:muruj-al-dhahab p. 551}، وعند المسعودي خلع عليه المعتمد وعلى مفلح مستهل ربيع الأول سنة ثمان وخمسين وأشخصهما لحرب صاحب الزنج، وواقع يعقوب الصفار عند سيب بني كوما سنة اثنتين وستين {cite:muruj-al-dhahab p. 571-573}، وعند ابن الجوزي اشتد به وجع النقرس حتى لم يقدر على الركوب فاتخذ له سريراً عليه قبة يقعد عليها ومعه خادم يبرد رجليه بالأشياء الباردة حتى صار يضع عليها الثلج وصارت علة رجله داء الفيل، وكان يحمل سريره أربعون حمالاً يتناوب عليه عشرون عشرون فربما اشتد به فيأمرهم أن يضعوه فيقول لهم يوماً قد ضجرتم وبودّي أني واحد منكم أحمل على رأسي وآكل وأنا في عافية، وقد طبق دفتري على مائة ألف فما رزق ما فيهم أقبح حالاً مني، وتوفى بالقصر الحسني ليلة الخميس لثمان بقين من صفر سنة ثمان وسبعين وله سبع وأربعون سنة تنقص شهراً وأياماً، وكتب عبد الله بن المعتز يعزيه فيه «إنما أعزيك بالمنصور الثاني لأني لا أعرف في ولده أشبه به منه» وفي حربه على الزنج بعث إلى رئيسهم كتابًا يدعوه فيه إلى التوبة والإنابة إلى الله عز وجل مما ركب من سفك الدماء وانتهاك المحارم وإخراب البلدان وانتحال ما لم يجعله الله له أهلًا من النبوة والرسالة، وأن ينزع عما هو عليه ويدخل في جماعة المسلمين، فلما وصل الكتاب إليه لم يزده إلا نفورًا وإصرارًا ولم يجب عنه {cite:muntazam-ibn-al-jawzi p. 58-59}. وعسكر في المدينة التي سمّاها الموفقية وجهّز التجار إليها وبنى فيها الجامع واتُّخذت بها دور الضرب فضُربت الدنانير والدراهم {cite:muntazam-ibn-al-jawzi p. 59-60}."
  en: "Brother of the caliph al-Mu'tamid. Al-Tabari records his departure from al-Jabal for Iraq, his illness with gout, and his death on a Wednesday, eight days before the end of Safar 278 {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. According to al-Suyuti, his brother al-Mu'tazz invested him with the robe of kingship, crowned him with a gold crown and a jewelled cap, gave him two shawls and girded him with two swords; in the same year he removed him from office and exiled him to Wasit {cite:tarikh-khulafa-minhaj-1434 p. 557}. Also according to al-Suyuti, his brother al-Mu'tamid placed him in charge of the east, and he commanded the army in most of the engagements against the Zanj; when the leader of the Zanj was killed, the people cried out prayers for al-Muwaffaq and poets praised him. In 269 al-Mu'tamid summoned him back from the direction of Damascus and placed him under restraint; he was given the titles Ibn Kundaj, Dhu al-Sayfayn, and Sa'idan, Dhu al-Wizaratayn, and al-Mu'tamid ordered Ibn Tulun to be cursed from the pulpits. He died in 278, and al-Mu'tamid was relieved of him {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. According to al-Mas'udi, when al-Musta'in was deposed he went from Baghdad to Samarra, where al-Mu'tazz invested him, put a robe on him, gave him two shawls and clothed his commanders {cite:muruj-al-dhahab p. 545}. According to al-Mas'udi, al-Mu'tazz imprisoned him with his brother al-Mu'ayyad, then tightened his confinement and sent him to Basra thirteen nights before the end of Ramadan 252; between his honour and his imprisonment there were six months and three days {cite:muruj-al-dhahab p. 551}. According to al-Mas'udi, al-Mu'tamid invested him and Mufallih at the start of Rabi' I 258 and sent them against the leader of the Zanj; he met Ya'qub al-Saffar at Sayb Bani Kuma in 262 {cite:muruj-al-dhahab p. 571-573}. According to Ibn al-Jawzi, the gout grew so severe that he could not ride, so he had a domed litter made to sit in, with an attendant who cooled his feet with cold things until ice was applied to them; his leg became elephantiasis. Forty porters carried his litter, twenty at a time in turns. When the pain grew he would order them to set him down and say: 'You are weary of me, and I wish I were one of you, carrying a load on my head and eating in good health.' He also said: 'My register covers a hundred thousand men, yet none of them is in a worse state than I am.' He died in the Qasr al-Hasani on the night of Thursday, eight days before the end of Safar 278, aged forty-seven years less a month and some days. Abdallah ibn al-Mu'tazz wrote a letter of condolence: 'I console you with al-Mansur the second, for I know of no one among his descendants more like him.' In his war against the Zanj he sent their leader a letter calling him to repent and return to God from the shedding of blood, the violation of what is sacred, the ruin of lands, and the claim to a prophethood and messengership that God had not made him fit for, and to give up his course and join the community of Muslims. When the letter reached him it only increased his aversion and obstinacy, and he did not reply {cite:muntazam-ibn-al-jawzi p. 58-59}. He encamped in the city he named al-Muwaffaqiyya, sent merchants to it, built its congregational mosque, and set up mints there where dinars and dirhams were struck {cite:muntazam-ibn-al-jawzi p. 59-60}."
  ur: "خلیفہ معتمد کے بھائی اور زنج کے خلاف عباسی لشکر کے قائد۔ طبری ان کی بیماری اور 278ھ میں وفات کا ذکر کرتے ہیں؛ ابن جوزی نے ان کی قائم کردہ شہر موفقیہ کی مسجد اور ٹکسالوں کا بھی بیان کیا ہے۔ {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:muntazam-ibn-al-jawzi p. 59-60}"
  fr: "Frère du calife al-Mu'tamid. Al-Tabari rapporte son départ du Jibal pour l'Iraq, sa maladie de la goutte et sa mort un mercredi, huit jours avant la fin de Safar 278 {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Selon al-Suyuti, son frère al-Mu'tazz le revêtit de la robe de la royauté, le couronna d'une couronne d'or et d'un bonnet orné de pierreries, lui donna deux écharpes et le ceignit de deux épées ; la même année, il le destitua et l'exila à Wasit {cite:tarikh-khulafa-minhaj-1434 p. 557}. Toujours selon al-Suyuti, son frère al-Mu'tamid lui confia l'Orient, et il commanda l'armée dans la plupart des combats contre les Zanj ; lorsque le chef des Zanj fut tué, les gens invoquèrent Dieu en faveur d'al-Muwaffaq et les poètes le louèrent. En 269, al-Mu'tamid le rappela de la direction de Damas et le plaça sous contrainte ; il reçut les titres d'Ibn Kundaj, Dhu al-Sayfayn, et de Sa'idan, Dhu al-Wizaratayn, et al-Mu'tamid ordonna que l'on maudît Ibn Tulun du haut des chaires. Il mourut en 278, et al-Mu'tamid fut délivré de lui {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. Selon al-Mas'udi, lorsqu'al-Musta'in fut déposé, il alla de Bagdad à Samarra, où al-Mu'tazz l'investit, le revêtit d'une robe, lui donna deux écharpes et habilla ses commandants {cite:muruj-al-dhahab p. 545}. Selon al-Mas'udi, al-Mu'tazz l'emprisonna avec son frère al-Mu'ayyad, puis resserra sa détention et l'envoya à Bassora treize nuits avant la fin de ramadan 252 ; entre son honneur et son emprisonnement s'écoulèrent six mois et trois jours {cite:muruj-al-dhahab p. 551}. Selon al-Mas'udi, al-Mu'tamid l'investit avec Mufallih au début de Rabi' I 258 et les envoya contre le chef des Zanj ; il affronta Ya'qub al-Saffar à Sayb Bani Kuma en 262 {cite:muruj-al-dhahab p. 571-573}. Selon Ibn al-Jawzi, la goutte devint si grave qu'il ne pouvait plus monter à cheval ; il se fit donc faire une litière à coupole pour s'y asseoir, avec un serviteur qui rafraîchissait ses pieds avec des choses froides, jusqu'à y appliquer de la glace ; sa jambe devint éléphantiasique. Quarante porteurs portaient sa litière, vingt à la fois, à tour de rôle. Quand la douleur augmentait, il leur ordonnait de le poser et disait : « Vous êtes las de moi, et je voudrais être l'un de vous, portant une charge sur la tête et mangeant en bonne santé. » Il disait aussi : « Mon registre compte cent mille hommes, et pourtant aucun d'eux n'est en plus mauvais état que moi. » Il mourut au Qasr al-Hasani la nuit du jeudi, huit jours avant la fin de Safar 278, à quarante-sept ans moins un mois et quelques jours. Abdallah ibn al-Mu'tazz écrivit une lettre de condoléances : « Je te console par al-Mansur le second, car je ne connais personne parmi ses descendants qui lui ressemble davantage. » Dans sa guerre contre les Zanj, il envoya à leur chef une lettre l'appelant à se repentir et à revenir à Dieu, à cesser de verser le sang, de violer ce qui est sacré, de ruiner les terres, et de prétendre à une prophétie et à une mission que Dieu ne lui avait pas destinées, à abandonner sa voie et à rejoindre la communauté des musulmans. Lorsque la lettre lui parvint, elle ne fit qu'accroître son aversion et son obstination, et il ne répondit pas {cite:muntazam-ibn-al-jawzi p. 58-59}. Il campa dans la ville qu'il nomma al-Muwaffaqiyya, y envoya des marchands, y bâtit sa mosquée-cathédrale et y établit des ateliers monétaires où l'on frappait des dinars et des dirhams {cite:muntazam-ibn-al-jawzi p. 59-60}."
  es: "Hermano del califa al-Mu'tamid. Al-Tabari registra su partida de al-Jabal hacia Irak, su enfermedad de gota y su muerte un miércoles, ocho días antes del final de Safar 278 {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Según al-Suyuti, su hermano al-Mu'tazz lo vistió con la túnica real, lo coronó con una corona de oro y un gorro enjoyado, le dio dos chales y lo ciñó con dos espadas; en el mismo año lo destituyó del cargo y lo exilió a Wasit {cite:tarikh-khulafa-minhaj-1434 p. 557}. Según al-Suyuti, su hermano al-Mu'tamid lo puso al mando del este, y él dirigió el ejército en la mayoría de los enfrentamientos contra los Zanj. Cuando el líder de los Zanj fue asesinado, el pueblo elevó oraciones por al-Muwaffaq y los poetas lo elogiaron. En 269, al-Mu'tamid lo llamó de regreso desde Damasco y lo puso bajo arresto; se le otorgaron los títulos de Ibn Kundaj, Dhu al-Sayfayn, Sa'idan y Dhu al-Wizaratayn, y al-Mu'tamid ordenó que se maldijera a Ibn Tulun desde los púlpitos. Murió en 278, y al-Mu'tamid fue relevado de él {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. Según al-Mas'udi, cuando al-Musta'in fue depuesto, fue de Bagdad a Samarra, donde al-Mu'tazz lo invistió, le puso una túnica, le dio dos chales y vistió a sus comandantes {cite:muruj-al-dhahab p. 545}. Según al-Mas'udi, al-Mu'tazz lo encarceló con su hermano al-Mu'ayyad, luego endureció su confinamiento y lo envió a Basora trece noches antes del final del Ramadán 252; entre su honor y su encarcelamiento hubo seis meses y tres días {cite:muruj-al-dhahab p. 551}. Según al-Mas'udi, al-Mu'tamid lo invistió a él y a Mufallih al comienzo de Rabi' I 258 y los envió contra el líder de los Zanj; Se encontró con Ya'qub al-Saffar en Sayb Bani Kuma en el año 262 {cite:muruj-al-dhahab p. 571-573}. Según Ibn al-Jawzi, la gota se agravó tanto que no podía montar a caballo, por lo que mandó hacer una litera abovedada para sentarse, con un asistente que le enfriaba los pies con objetos fríos hasta que se les aplicaba hielo; su pierna se convirtió en elefantiasis. Cuarenta porteadores llevaban su litera, veinte a la vez por turnos. Cuando el dolor aumentaba, les ordenaba que lo bajaran y decía: «Están cansados de mí, y desearía ser uno de ustedes, cargando un peso sobre mi cabeza y comiendo con buena salud». También dijo: «Mi registro abarca a cien mil hombres, y ninguno de ellos está en peor estado que yo». Murió en Qasr al-Hasani la noche del jueves, ocho días antes del final de Safar 278, a la edad de cuarenta y siete años menos un mes y algunos días. Abdallah ibn al-Mu'tazz escribió una carta de condolencia: «Te consuelo con al-Mansur II, pues no conozco a nadie entre sus descendientes más parecido a él». En su guerra contra los Zanj, envió una carta a su líder exhortándolo a arrepentirse y regresar a Dios, abandonando el derramamiento de sangre, la profanación de lo sagrado, la destrucción de tierras y la pretensión de una profecía y un mensaje para los que Dios no lo había hecho apto, y a renunciar a su causa y unirse a la comunidad musulmana. Cuando la carta llegó a sus manos, solo aumentó su aversión y obstinación, y no respondió {cite:muntazam-ibn-al-jawzi p. 58-59}. Acampó en la ciudad que llamó al-Muwaffaqiyya, envió mercaderes, construyó su mezquita principal y estableció allí casas de moneda donde se acuñaban dinares y dirhams {cite:muntazam-ibn-al-jawzi p. 59-60}."
  tr: "Halife Mu'tamid'in kardeşi; Taberi, dağdan Irak'a gidişini ve gut hastalığına yakalanmasını, ardından Hicri 278 yılının Safer ayının 8. Çarşamba günü vefatını zikretmiştir. {Kaynak:tabari-tarikh-abu-al-fadl c.10 s.20} {Kaynak:tabari-tarikh-abu-al-fadl c.10 s.22}. Suyuti'ye göre, kardeşi Mu'tazz ona krallık cübbesi giydirmiş ve altın bir taç, mücevherli bir başlık, iki kuşak ve iki kılıç hediye etmiştir. Ardından aynı yıl onu görevden alarak Wasit'e sürgün etmiştir. {Kaynak:tarikh-khulafa-minhaj-1434 s. 557} Suyuti'ye göre, kardeşi Mu'tamid onu Doğu'da görevlendirmiş ve Zenc'e karşı yapılan savaşların çoğunda ordunun komutanı olmuştur. Zenc'in lideri öldürüldüğünde, halk Muvaffak için yalvararak feryat etti ve şairler onu övdü. 569 yılında Mu'tamid Şam'dan geri getirildi ve ev hapsine alındı. İbn Kandaj'a \"Zu el-Seyfeyn\" (İki Kılıcın Sahibi) ve \"Zu el-Vizaratayn\" (İki Bakanlığın Sahibi) unvanları verildi ve İbn Tulun'un minberlerden lanetlenmesini emretti. 578 yılında öldü ve Mu'tamid ondan kurtuldu. {cite:tarikh-khulafa-minhaj-1434 pp. 564-569}. Mes'udi'ye göre, Mustafan'ın görevden alınmasının ardından Bağdat'tan Samarra'ya gitti ve Mu'tazz ona şeref cübbesi verdi. Ardından ona iki kuşak taktı ve komutanlarına şeref cübbeleri giydirdi. {kaynak: Muruj-al-Dhahab s. 545} ve el-Mas'udi'ye göre, el-Mu'tezz onu kardeşi el-Muayyad ile birlikte hapse attı, sonra da hapis cezasını sıkılaştırdı ve elli ikinci yılın Ramazan ayının on üçüncü gecesinde Basra'ya gönderdi. Ona şeref verilmesi ile hapsedilmesi arasında altı ay üç gün vardı. {kaynak: Muruj-al-Dhahab s. İbn el-Cevzi'ye göre, el-Mu'tamid, elli sekizinci yılın Rebiü'l-Evvel ayının başında ona ve Muflih'e şeref elbiselerini verdi ve onları Zenc lideriyle savaşmaya gönderdi; Ya'kub el-Saffar ise altmış ikinci yılda Sayb Beni Kuma'nın yerinde savaştı. {kaynak: Muruj-al-Dhahab s. 571-573} İbn el-Cevzi'ye göre, gut ağrısı o kadar şiddetlendi ki artık ata binemez hale geldi. Kendine kubbeli bir yatak yaptırdı ve üzerine oturacağı bir yatak, bir hizmetçisi de ayaklarını soğuk şeylerle serinletiyordu, ta ki buz uygulamak zorunda kalana kadar. Bacağındaki rahatsızlık fil hastalığına dönüştü. Kırk hamal, yirmi iki vardiya halinde sırayla yatağını taşıdı. Bazen ağrısı o kadar şiddetlenirdi ki, yatağı yere koymalarını emrederdi. Bir gün onlara şöyle diyecekti: \"Bundan bıktınız mı? Keşke sizin gibi olsaydım, başımın üstünde yük taşıyıp sağlıklı beslenseydim. Kitabım yüz bin dirhemle doldu ve hiçbiri benden daha kötü durumda değil.\" Hicri 78 yılında, Safer ayının 28'inci Perşembe gecesi, kırk yedi yaşında, birkaç gün eksik olarak Hasani Sarayı'nda vefat etti. Abdullah ibn el-Mu'tazz ona başsağlığı dileyerek şöyle yazdı: \"Size sadece el-Mansur II'nin vefatı için başsağlığı diliyorum, çünkü oğulları arasında ona daha çok benzeyen birini tanımıyorum.\" Zenj'e karşı savaşında, liderlerine bir mektup göndererek, işlediği kan dökme, kutsal şeylere saygısızlık ve yıkım için tövbe etmesini ve Yüce Allah'a yönelmesini istedi. Ona, Allah'ın layık görmediği peygamberlik ve elçilik iddiasından vazgeçmesi, inançlarından feragat etmesi ve Müslüman topluluğuna katılması söylendi. Mektup kendisine ulaştığında, bu durum onun nefretini ve inatçılığını daha da artırdı ve mektuba cevap vermedi. Ardından, el-Muvaffakiyye adını verdiği şehre yerleşti, oraya tüccarlar gönderdi, bir cami inşa etti ve dinar ve dirhem basılan darphaneler kurdu."
  id: "Saudara Khalifah al-Mu'tamid; al-Tabari menyebutkan kepergiannya dari gunung ke Irak dan penyakitnya berupa asam urat, kemudian kematiannya pada hari Rabu, tanggal 8 Safar, tahun 278 H {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Menurut al-Suyuti, saudaranya al-Mu'tazz menganugerahinya jubah kerajaan dan memberinya mahkota emas, topi bertatahkan permata, dua ikat pinggang, dan dua pedang. Kemudian ia memecatnya pada tahun yang sama dan mengasingkannya ke Wasit {cite:tarikh-khulafa-minhaj-1434 p. 557}. Menurut al-Suyuti, saudaranya al-Mu'tamid mempekerjakannya di Timur, dan ia adalah komandan pasukan dalam sebagian besar pertempuran melawan Zanj. Ketika pemimpin Zanj terbunuh, orang-orang berseru memohon pertolongan untuk al-Muwaffaq, dan para penyair memujinya. Pada tahun 569, al-Mu'tamid dibawa kembali dari Damaskus dan ditempatkan di bawah tahanan rumah. Ibn Kandaj diberi gelar \"Dhu al-Sayfayn\" (Pemilik Dua Pedang) dan \"Dhu al-Wizaratayn\" (Pemilik Dua Kementerian), dan ia memerintahkan agar Ibn Tulun dikutuk dari mimbar-mimbar. Ia meninggal pada tahun 578, dan al-Mu'tamid dibebaskan darinya. {cite:tarikh-khulafa-minhaj-1434 pp. 564-569}. Menurut al-Mas'udi, ia berangkat dari Baghdad ke Samarra ketika al-Musta'in digulingkan, dan al-Mu'tazz menganugerahinya jubah kehormatan. Kemudian ia melanjutkan dan menghiasinya dengan dua ikat pinggang dan para komandannya dengan jubah kehormatan. {kutip:muruj-al-dhahab hlm. 545}, dan menurut al-Mas'udi, al-Mu'tazz memenjarakannya bersama saudaranya al-Mu'ayyad, kemudian memperketat kurungannya dan mengirimnya ke Basra pada malam ketiga belas bulan Ramadan yang tersisa pada tahun lima puluh dua. Antara penghormatan dan pemenjaraannya terdapat enam bulan dan tiga hari {kutip:muruj-al-dhahab hlm. 551}, dan menurut al-Mas'udi, al-Mu'tamid menganugerahkan kepadanya dan Muflih jubah kehormatan pada awal Rabi' al-Awwal pada tahun lima puluh delapan dan mengirim mereka untuk memerangi pemimpin Zanj, dan Ya'qub al-Saffar berperang di tempat Sayb Bani Kuma pada tahun enam puluh dua {kutip:muruj-al-dhahab hlm. Menurut Ibn al-Jawzi, rasa sakit asam uratnya menjadi sangat parah sehingga ia tidak dapat lagi menunggang kuda. Ia membuatkan tempat tidur untuk dirinya sendiri dengan kubah tempat ia duduk, dan seorang pelayan akan mendinginkan kakinya dengan benda-benda dingin sampai ia harus mengoleskan es. Penyakit kakinya berubah menjadi elefantiasis. Empat puluh porter membawa tempat tidurnya, bergantian membawanya dalam dua puluh dua shift. Terkadang rasa sakitnya menjadi sangat parah sehingga ia memerintahkan mereka untuk meletakkannya. Suatu hari ia berkata kepada mereka, \"Kalian lelah. Aku berharap aku seperti kalian, membawa barang di atas kepala dan makan dengan sehat. Bukuku telah terisi seratus ribu [dirham], dan tidak ada satu pun dari kalian yang berada dalam keadaan lebih buruk daripada aku.\" Ia meninggal di Istana al-Hasani pada Kamis malam, tanggal 28 Safar, tahun 78 Hijriah, pada usia empat puluh tujuh tahun, minus satu bulan dan beberapa hari. Abdullah ibn al-Mu'tazz menulis surat kepadanya, menyampaikan belasungkawa, \"Aku hanya menyampaikan belasungkawa atas wafatnya al-Mansur II, karena aku tidak mengenal seorang pun di antara putra-putranya yang lebih mirip dengannya.\" Selama perangnya melawan Zanj, ia mengirim surat kepada pemimpin mereka, menyerukannya untuk bertaubat dan kembali kepada Allah Yang Maha Kuasa atas pertumpahan darah, pelanggaran terhadap hal-hal suci, dan kehancuran yang telah dilakukannya. Ia diberitahu untuk meninggalkan kedudukannya dan mengklaim kenabian dan kerasulan, yang menurut Allah tidak layak baginya, dan untuk meninggalkan keyakinannya dan bergabung dengan komunitas Muslim. Ketika surat itu sampai kepadanya, hal itu justru meningkatkan kebencian dan kekeras kepalaannya, dan ia tidak membalasnya. Kemudian ia berkemah di kota yang dinamainya al-Muwaffaqiyya, mengirim pedagang ke sana, membangun sebuah masjid, dan mendirikan percetakan uang tempat dinar dan dirham dicetak."
