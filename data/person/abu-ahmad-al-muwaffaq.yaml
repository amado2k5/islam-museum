id: person/abu-ahmad-al-muwaffaq
class: person
label: { ar: "أبو أحمد الموفق" }
summary:
  ar: "أخو الخليفة المعتمد؛ ذكر الطبري انصرافه من الجبل إلى العراق ومرضه بوجع النقرس، ثم وفاته يوم الأربعاء لثمان بقين من صفر سنة ثمان وسبعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22} وعند السيوطي خلع عليه أخوه المعتز خلعة الملك وتوجه بتاج من ذهب وقلنسوة مجوهرة ووشاحين وقلده سيفين ثم عزله من عامه ونفاه إلى واسط {cite:tarikh-khulafa-minhaj-1434 p. 557}، وعند السيوطي استعمله أخوه المعتمد على المشرق وكان أمير العسكر في أكثر وقعات الزنج فلما قتل صاحب الزنج ضج الناس بالدعاء للموفق ومدحه الشعراء، وفي سنة تسع وستين أحضر المعتمد راجعاً من وجه دمشق وحجر عليه فلقب ابن كنداج ذا السيفين وصاعداً ذا الوزارتين وأمر بلعنة ابن طولون على المنابر، ومات سنة ثمان وسبعين فاستراح منه المعتمد {cite:tarikh-khulafa-minhaj-1434 p. 564-569}."
