label: { ar: "أبو أحمد الموفق", en: "Abu Ahmad al-Muwaffaq" }
summary:
  ar: "أخو الخليفة المعتمد؛ ذكر الطبري انصرافه من الجبل إلى العراق ومرضه بوجع النقرس، ثم وفاته يوم الأربعاء لثمان بقين من صفر سنة ثمان وسبعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22} وعند السيوطي خلع عليه أخوه المعتز خلعة الملك وتوجه بتاج من ذهب وقلنسوة مجوهرة ووشاحين وقلده سيفين ثم عزله من عامه ونفاه إلى واسط {cite:tarikh-khulafa-minhaj-1434 p. 557}، وعند السيوطي استعمله أخوه المعتمد على المشرق وكان أمير العسكر في أكثر وقعات الزنج فلما قتل صاحب الزنج ضج الناس بالدعاء للموفق ومدحه الشعراء، وفي سنة تسع وستين أحضر المعتمد راجعاً من وجه دمشق وحجر عليه فلقب ابن كنداج ذا السيفين وصاعداً ذا الوزارتين وأمر بلعنة ابن طولون على المنابر، ومات سنة ثمان وسبعين فاستراح منه المعتمد {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. وعند المسعودي انصرف من بغداد إلى سامرا لما خلع المستعين فخلع عليه المعتز وتوجه ووشحه بوشاحين وخلع على قواده {cite:muruj-al-dhahab p. 545}، وعند المسعودي حبسه المعتز مع أخيه المؤيد ثم ضيق حبسه وأشخصه إلى البصرة لثلاث عشرة ليلة بقيت من رمضان سنة اثنتين وخمسين، وكان بين إكرامه وحبسه ستة أشهر وثلاثة أيام {cite:muruj-al-dhahab p. 551}، وعند المسعودي خلع عليه المعتمد وعلى مفلح مستهل ربيع الأول سنة ثمان وخمسين وأشخصهما لحرب صاحب الزنج، وواقع يعقوب الصفار عند سيب بني كوما سنة اثنتين وستين {cite:muruj-al-dhahab p. 571-573}، وعند ابن الجوزي اشتد به وجع النقرس حتى لم يقدر على الركوب فاتخذ له سريراً عليه قبة يقعد عليها ومعه خادم يبرد رجليه بالأشياء الباردة حتى صار يضع عليها الثلج وصارت علة رجله داء الفيل، وكان يحمل سريره أربعون حمالاً يتناوب عليه عشرون عشرون فربما اشتد به فيأمرهم أن يضعوه فيقول لهم يوماً قد ضجرتم وبودّي أني واحد منكم أحمل على رأسي وآكل وأنا في عافية، وقد طبق دفتري على مائة ألف فما رزق ما فيهم أقبح حالاً مني، وتوفى بالقصر الحسني ليلة الخميس لثمان بقين من صفر سنة ثمان وسبعين وله سبع وأربعون سنة تنقص شهراً وأياماً، وكتب عبد الله بن المعتز يعزيه فيه «إنما أعزيك بالمنصور الثاني لأني لا أعرف في ولده أشبه به منه» وفي حربه على الزنج بعث إلى رئيسهم كتابًا يدعوه فيه إلى التوبة والإنابة إلى الله عز وجل مما ركب من سفك الدماء وانتهاك المحارم وإخراب البلدان وانتحال ما لم يجعله الله له أهلًا من النبوة والرسالة، وأن ينزع عما هو عليه ويدخل في جماعة المسلمين، فلما وصل الكتاب إليه لم يزده إلا نفورًا وإصرارًا ولم يجب عنه {cite:muntazam-ibn-al-jawzi p. 58-59}. وعسكر في المدينة التي سمّاها الموفقية وجهّز التجار إليها وبنى فيها الجامع واتُّخذت بها دور الضرب فضُربت الدنانير والدراهم {cite:muntazam-ibn-al-jawzi p. 59-60}."
  en: "Brother of the caliph al-Mu'tamid. Al-Tabari records his departure from al-Jabal for Iraq, his illness with gout, and his death on a Wednesday, eight days before the end of Safar 278 {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. According to al-Suyuti, his brother al-Mu'tazz invested him with the robe of kingship, crowned him with a gold crown and a jewelled cap, gave him two shawls and girded him with two swords; in the same year he removed him from office and exiled him to Wasit {cite:tarikh-khulafa-minhaj-1434 p. 557}. Also according to al-Suyuti, his brother al-Mu'tamid placed him in charge of the east, and he commanded the army in most of the engagements against the Zanj; when the leader of the Zanj was killed, the people cried out prayers for al-Muwaffaq and poets praised him. In 269 al-Mu'tamid summoned him back from the direction of Damascus and placed him under restraint; he was given the titles Ibn Kundaj, Dhu al-Sayfayn, and Sa'idan, Dhu al-Wizaratayn, and al-Mu'tamid ordered Ibn Tulun to be cursed from the pulpits. He died in 278, and al-Mu'tamid was relieved of him {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. According to al-Mas'udi, when al-Musta'in was deposed he went from Baghdad to Samarra, where al-Mu'tazz invested him, put a robe on him, gave him two shawls and clothed his commanders {cite:muruj-al-dhahab p. 545}. According to al-Mas'udi, al-Mu'tazz imprisoned him with his brother al-Mu'ayyad, then tightened his confinement and sent him to Basra thirteen nights before the end of Ramadan 252; between his honour and his imprisonment there were six months and three days {cite:muruj-al-dhahab p. 551}. According to al-Mas'udi, al-Mu'tamid invested him and Mufallih at the start of Rabi' I 258 and sent them against the leader of the Zanj; he met Ya'qub al-Saffar at Sayb Bani Kuma in 262 {cite:muruj-al-dhahab p. 571-573}. According to Ibn al-Jawzi, the gout grew so severe that he could not ride, so he had a domed litter made to sit in, with an attendant who cooled his feet with cold things until ice was applied to them; his leg became elephantiasis. Forty porters carried his litter, twenty at a time in turns. When the pain grew he would order them to set him down and say: 'You are weary of me, and I wish I were one of you, carrying a load on my head and eating in good health.' He also said: 'My register covers a hundred thousand men, yet none of them is in a worse state than I am.' He died in the Qasr al-Hasani on the night of Thursday, eight days before the end of Safar 278, aged forty-seven years less a month and some days. Abdallah ibn al-Mu'tazz wrote a letter of condolence: 'I console you with al-Mansur the second, for I know of no one among his descendants more like him.' In his war against the Zanj he sent their leader a letter calling him to repent and return to God from the shedding of blood, the violation of what is sacred, the ruin of lands, and the claim to a prophethood and messengership that God had not made him fit for, and to give up his course and join the community of Muslims. When the letter reached him it only increased his aversion and obstinacy, and he did not reply {cite:muntazam-ibn-al-jawzi p. 58-59}. He encamped in the city he named al-Muwaffaqiyya, sent merchants to it, built its congregational mosque, and set up mints there where dinars and dirhams were struck {cite:muntazam-ibn-al-jawzi p. 59-60}."
