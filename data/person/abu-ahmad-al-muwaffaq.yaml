id: person/abu-ahmad-al-muwaffaq
class: person
label: { ar: "أبو أحمد الموفق" }
summary:
  ar: "أخو الخليفة المعتمد؛ ذكر الطبري انصرافه من الجبل إلى العراق ومرضه بوجع النقرس، ثم وفاته يوم الأربعاء لثمان بقين من صفر سنة ثمان وسبعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22} وعند السيوطي خلع عليه أخوه المعتز خلعة الملك وتوجه بتاج من ذهب وقلنسوة مجوهرة ووشاحين وقلده سيفين ثم عزله من عامه ونفاه إلى واسط {cite:tarikh-khulafa-minhaj-1434 p. 557}، وعند السيوطي استعمله أخوه المعتمد على المشرق وكان أمير العسكر في أكثر وقعات الزنج فلما قتل صاحب الزنج ضج الناس بالدعاء للموفق ومدحه الشعراء، وفي سنة تسع وستين أحضر المعتمد راجعاً من وجه دمشق وحجر عليه فلقب ابن كنداج ذا السيفين وصاعداً ذا الوزارتين وأمر بلعنة ابن طولون على المنابر، ومات سنة ثمان وسبعين فاستراح منه المعتمد {cite:tarikh-khulafa-minhaj-1434 p. 564-569}. وعند المسعودي انصرف من بغداد إلى سامرا لما خلع المستعين فخلع عليه المعتز وتوجه ووشحه بوشاحين وخلع على قواده {cite:muruj-al-dhahab p. 545}، وعند المسعودي حبسه المعتز مع أخيه المؤيد ثم ضيق حبسه وأشخصه إلى البصرة لثلاث عشرة ليلة بقيت من رمضان سنة اثنتين وخمسين، وكان بين إكرامه وحبسه ستة أشهر وثلاثة أيام {cite:muruj-al-dhahab p. 551}، وعند المسعودي خلع عليه المعتمد وعلى مفلح مستهل ربيع الأول سنة ثمان وخمسين وأشخصهما لحرب صاحب الزنج، وواقع يعقوب الصفار عند سيب بني كوما سنة اثنتين وستين {cite:muruj-al-dhahab p. 571-573}، وعند ابن الجوزي اشتد به وجع النقرس حتى لم يقدر على الركوب فاتخذ له سريراً عليه قبة يقعد عليها ومعه خادم يبرد رجليه بالأشياء الباردة حتى صار يضع عليها الثلج وصارت علة رجله داء الفيل، وكان يحمل سريره أربعون حمالاً يتناوب عليه عشرون عشرون فربما اشتد به فيأمرهم أن يضعوه فيقول لهم يوماً قد ضجرتم وبودّي أني واحد منكم أحمل على رأسي وآكل وأنا في عافية، وقد طبق دفتري على مائة ألف فما رزق ما فيهم أقبح حالاً مني، وتوفى بالقصر الحسني ليلة الخميس لثمان بقين من صفر سنة ثمان وسبعين وله سبع وأربعون سنة تنقص شهراً وأياماً، وكتب عبد الله بن المعتز يعزيه فيه «إنما أعزيك بالمنصور الثاني لأني لا أعرف في ولده أشبه به منه» {cite:muntazam-ibn-al-jawzi j.5 p. 125-126}."
