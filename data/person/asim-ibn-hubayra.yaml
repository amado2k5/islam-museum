summary:
  ar: "عاصم بن هبيرة، من أصحاب عبد الله بن مسعود كما يقول فضيل بن أبي رفيدة، يفرد له أحمد بن حنبل في كتاب الزهد باباً قصيراً فيه وصيته بقول «وأنا من المسلمين» بعد الأذان وخبر خرقه طبلاً أو دفاً {cite:zuhd-ahmad-dkim-1983 p. 439}."
  en: "Asim ibn Hubayra, one of the companions of Abd Allah ibn Mas'ud according to Fudayl ibn Abi Rufayda, to whom Ahmad ibn Hanbal gives a short chapter of Kitab al-Zuhd with his advice to add 'and I am one of the Muslims' after the call to prayer and the report that he pierced a drum or tambourine {cite:zuhd-ahmad-dkim-1983 p. 439}."
  ur: "عاصم بن ہبیرہ، فضیل بن ابی رفیدہ کے بقول عبد اللہ بن مسعود کے ساتھیوں میں سے، جن کے لیے احمد بن حنبل کتاب الزہد میں ایک مختصر باب لاتے ہیں جس میں اذان کے بعد «اور میں مسلمانوں میں سے ہوں» کہنے کی نصیحت اور ایک ڈھول یا دف پھاڑنے کی روایت ہے {cite:zuhd-ahmad-dkim-1983 p. 439}۔"
