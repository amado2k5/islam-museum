summary:
  ar: "عاصم بن هبيرة، من أصحاب عبد الله بن مسعود كما يقول فضيل بن أبي رفيدة، يفرد له أحمد بن حنبل في كتاب الزهد باباً قصيراً فيه وصيته بقول «وأنا من المسلمين» بعد الأذان وخبر خرقه طبلاً أو دفاً {cite:zuhd-ahmad-dkim-1983 p. 439}."
  en: "Asim ibn Hubayra, one of the companions of Abd Allah ibn Mas'ud according to Fudayl ibn Abi Rufayda, to whom Ahmad ibn Hanbal gives a short chapter of Kitab al-Zuhd with his advice to add 'and I am one of the Muslims' after the call to prayer and the report that he pierced a drum or tambourine {cite:zuhd-ahmad-dkim-1983 p. 439}."
  ur: "عاصم بن ہبیرہ، فضیل بن ابی رفیدہ کے بقول عبد اللہ بن مسعود کے ساتھیوں میں سے، جن کے لیے احمد بن حنبل کتاب الزہد میں ایک مختصر باب لاتے ہیں جس میں اذان کے بعد «اور میں مسلمانوں میں سے ہوں» کہنے کی نصیحت اور ایک ڈھول یا دف پھاڑنے کی روایت ہے {cite:zuhd-ahmad-dkim-1983 p. 439}۔"
  es: "Asim ibn Hubayra, uno de los compañeros de Abd Allah ibn Mas'ud según Fudayl ibn Abi Rufayda, a quien Ahmad ibn Hanbal dedica un breve capítulo del Kitab al-Zuhd con su consejo de añadir \"y yo soy uno de los musulmanes\" después de la llamada a la oración y el relato de que perforó un tambor o pandereta {cite:zuhd-ahmad-dkim-1983 p. 439}."
  fr: "Asim ibn Hubayra, l'un des compagnons d'Abd Allah ibn Mas'ud selon Fudayl ibn Abi Rufayda, à qui Ahmad ibn Hanbal donne un court chapitre du Kitab al-Zuhd avec son conseil d'ajouter « et je suis l'un des musulmans » après l'appel à la prière et le récit selon lequel il a percé un tambour ou un tambourin {cite:zuhd-ahmad-dkim-1983 p. 439}."
  tr: "Abdullah ibn Mas'ud'un yoldaşlarından biri olan Asim bin Hubayrah, Fudayl ibn Abi Rufaidah'ın dediği gibi, Zahi kitabında ona kısa bir bölüm adar; burada Azan ve onun kırılması haberini davul ya da sıcaklık olarak aktardıktan sonra 'Ben Müslümanlardanım' der. {cite:zuhd-ahmad-dkim-1983, s. 439}."
  id: "Asim ibn Hubayrah, salah satu sahabat Abdullah ibn Mas'ud, seperti yang dikatakan Fudayl ibn Abi Rufaidah, mendedikasikan sebuah bab singkat dalam kitab asketisme di mana ia memberikan nasihat dengan mengatakan, 'Dan aku berasal dari umat Muslim' setelah panggilan shalat, dan kabar tentang kehancurannya sebagai genderang atau kehangatan {cite:zuhd-ahmad-dkim-1983, hlm. 439}."
