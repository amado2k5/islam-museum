summary:
  ar: "ابن جعفر بن أبي طالب وأسماء بنت عميس، ولد في أرض الحبشة.، وعند المسعودي لما أرادوا قتل ابن ملجم قال دعوني حتى أشفي نفسي منه فقطع يديه ورجليه وأحمى له مسماراً فكحله به، فقال ابن ملجم سبحان الذي خلق الإنسان إنك لتكحل عمك بملمول الرصاص، ثم أدرجوه في بوار مطلوة بالنفط فاحترق {cite:muruj-al-dhahab p. 704}، وعند المسعودي توفي سنة ثمانين وهو ابن سبع وستين وولد بالحبشة حين هاجر جعفر، ولما قل ماله سمع يوم الجمعة في المسجد الجامع يقول اللهم إنك قد عودتني عادة فعودتها عبادك فإن قطعتها عني فلا تبقني فمات في تلك الجمعة وصلى عليه أبان بن عثمان، وهي سنة السيل الجحاف الذي بلغ الركن وسنة الطاعون العام بالعراق والشام ومصر والجزيرة والحجاز، وقال حين عوتب على كثرة إفضاله إن الله عودني أن يفضل عليّ وعودته أن أفضل على عباده فأكره أن أقطع العادة عنهم فيقطع العادة عني {cite:muruj-al-dhahab p. 157-158}"
  en: Son of Ja'far ibn Abi Talib and Asma bint Umays, born in the land of Abyssinia.
