summary:
  ar: "ابن جعفر بن أبي طالب وأسماء بنت عميس، ولد في أرض الحبشة. وعند المسعودي لما أرادوا قتل ابن ملجم قال دعوني حتى أشفي نفسي منه فقطع يديه ورجليه وأحمى له مسماراً فكحله به، فقال ابن ملجم سبحان الذي خلق الإنسان إنك لتكحل عمك بملمول الرصاص، ثم أدرجوه في بوار مطلوة بالنفط فاحترق {cite:muruj-al-dhahab p. 704}، وعند المسعودي توفي سنة ثمانين وهو ابن سبع وستين وولد بالحبشة حين هاجر جعفر، ولما قل ماله سمع يوم الجمعة في المسجد الجامع يقول اللهم إنك قد عودتني عادة فعودتها عبادك فإن قطعتها عني فلا تبقني فمات في تلك الجمعة وصلى عليه أبان بن عثمان، وهي سنة السيل الجحاف الذي بلغ الركن وسنة الطاعون العام بالعراق والشام ومصر والجزيرة والحجاز، وقال حين عوتب على كثرة إفضاله إن الله عودني أن يفضل عليّ وعودته أن أفضل على عباده فأكره أن أقطع العادة عنهم فيقطع العادة عني {cite:muruj-al-dhahab p. 157-158}"
  en: Son of Ja'far ibn Abi Talib and Asma bint Umays, born in the land of Abyssinia.
  ur: "جعفر بن ابی طالب اور اسماء بنت عمیس کے فرزند، حبشہ کی سرزمین میں پیدا ہوئے۔"
  fr: "Fils de Ja'far ibn Abi Talib et d'Asma bint Umays, né en terre d'Abyssinie."
  es: "Hijo de Ja'far ibn Abi Talib y Asma bint Umays, nacido en la tierra de Abisinia."
  tr: "Cafer ibn Ebu Talib ve Esma bint Umeys'in oğlu olan bu kişi, Habeşistan topraklarında doğdu. Mesudi'ye göre, İbn Mulcem'i öldürmek istediklerinde, \"Ondan intikamımı alayım\" dedi. Bunun üzerine ellerini ve ayaklarını kesti, bir çiviyi ısıtıp gözlerine sürdü. İbn Mulcem, \"İnsanı yaratan Allah'a hamd olsun! Amcanın gözlerine kurşun sürüyorsun!\" dedi. Sonra onu neft yağıyla kaplı bir kaba sarıp yaktılar. Mesudi'ye göre, sekseninci yılda, altmış yedi yaşında vefat etti. Cafer hicret ettiğinde Habeşistan'da doğdu. Serveti azaldığında, Cuma günü Mescid-i Haram'da şöyle dediği duyuldu: \"Ey Allah'ım, sen beni bir adete alıştırdın ve ben de senin kullarını ona alıştırdım. Eğer onu benden alırsan, beni yaşatma.\" O cuma günü vefat etti ve Eban ibn Osman onun için dua etti. O yıl, Kâbe'nin köşesine kadar ulaşan yıkıcı tufan ve Irak, Suriye, Mısır, Cezire ve Hicaz'da genel bir veba salgını yaşanmıştı. Cömertliği nedeniyle kınandığında, \"Allah beni kendime karşı cömert olmaya alıştırdı, ben de O'nu kullarına karşı cömert olmaya alıştırdım. Onlardan bu alışkanlığı kesmekten hoşlanmam, çünkü O da benden kesebilir.\" dedi. {kaynak: Muruj-al-dhahab s. 157-158}"
  id: "Putra Ja'far ibn Abi Talib dan Asma' bint 'Umays, ia lahir di tanah Abyssinia. Menurut al-Mas'udi, ketika mereka ingin membunuh Ibn Muljam, ia berkata, \"Biarkan aku membalas dendam padanya.\" Maka ia memotong tangan dan kakinya, lalu memanaskan paku dan menempelkannya ke matanya. Ibn Muljam berkata, \"Maha Suci Dia yang menciptakan manusia! Kau menempelkan timah ke mata pamanmu!\" Kemudian mereka membungkusnya dalam bejana yang dilapisi nafta, dan ia dibakar. 704} Menurut Al-Mas'udi, ia meninggal pada tahun delapan puluh, pada usia enam puluh tujuh tahun. Ia lahir di Abyssinia ketika Ja'far berhijrah. Ketika kekayaannya berkurang, ia terdengar pada hari Jumat di Masjidil Haram berkata, \"Ya Allah, Engkau telah membiasakan aku pada suatu kebiasaan, dan aku telah membiasakan hamba-hamba-Mu padanya. Jika Engkau menghapusnya dariku, maka jangan biarkan aku hidup.\" Ia wafat pada hari Jumat itu, dan Aban bin Utsman mendoakannya. Itu adalah tahun terjadinya banjir dahsyat yang mencapai sudut (Ka'bah) dan tahun terjadinya wabah penyakit umum di Irak, Suriah, Mesir, Jazirah, dan Hijaz. Ketika ia ditegur karena kedermawanannya yang berlebihan, ia berkata, \"Allah telah membiasakan aku untuk berdermawan kepada-Ku, dan aku telah membiasakan-Nya untuk berdermawan kepada hamba-hamba-Nya. Aku tidak ingin menghentikan kebiasaan itu dari mereka, karena takut Dia akan menghentikan kebiasaan itu dariku.\" {kutipan:muruj-al-dhahab hlm. 157-158}"
