summary:
  ar: "شيخ سنغالي، وُلد في كولاك سنة 1955 من سلالة آل سيسي التجانية. إمام المسجد الكبير في مدينة باي بكولاك وخليفة عام الطريقة التجانية منذ 2010 خلفًا للحسن سيسي، يتربّع على ميراث الطريقة التي نشرها الشيخ إبراهيم نياس؛ تعلّم في السنغال ومصر."
  en: "Senegalese shaykh, born in Kaolack in 1955 into the Tijani Cisse family. Imam of the Grand Mosque of Medina Baye in Kaolack and leader of the Tijaniyya Sufi order since 2010, succeeding Hassan Cisse, he sits on the legacy of the order's twentieth-century expansion under Ibrahim Niass; he studied in Senegal and Egypt."
  ur: "سینیگالی شیخ، 1955 میں کاؤلاک میں تجانی سیسے خاندان میں پیدا ہوئے۔ کاؤلاک کے مدینہ بائے مسجدِ کبیر کے امام اور 2010 سے حسن سیسے کے جانشین ہو کر تجانیہ صوفی سلسلے کے قائد؛ وہ شیخ ابراہیم نیاس کے تحت پھیلی ہوئی سلسلے کی میراث پر بیٹھے ہیں؛ سینیگال اور مصر میں تعلیم پائی۔"
  es: "Shaykh senegalés, nacido en Kaolack en 1955 en el seno de la familia Tijani Cisse. Imán de la Gran Mezquita de Medina Baye en Kaolack y líder de la orden sufí Tijaniyya desde 2010, sucediendo a Hassan Cisse, hereda el legado de la expansión de la orden en el siglo XX bajo el liderazgo de Ibrahim Niass; estudió en Senegal y Egipto."
  fr: "Cheikh sénégalais, né à Kaolack en 1955 dans la famille Tijani Cissé. Imam de la Grande Mosquée de Médina Baye à Kaolack et chef de l'ordre soufi Tijaniyya depuis 2010, succédant à Hassan Cissé, il perpétue l'héritage de l'expansion de l'ordre au XXe siècle sous Ibrahim Niass; il a étudié au Sénégal et en Égypte."
