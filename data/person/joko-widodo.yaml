summary:
  ar: "سياسي إندونيسي ورجل أعمال سابق في صناعة الأثاث، وُلد في سوراكارتا سنة 1961 باسم موليونو. كان عمدة سوراكارتا من 2005 إلى 2012 وحاكم جاكرتا من 2012 إلى 2014، ثم صار رئيس إندونيسيا السابع سنة 2014 وبقي لولايتين حتى 2024، وهو أول رئيس إندونيسي من خارج النخبة السياسية والعسكرية."
  en: "Indonesian politician and former furniture businessman, born in Surakarta in 1961 under the name Mulyono. Mayor of Surakarta from 2005 to 2012 and governor of Jakarta from 2012 to 2014, he became Indonesia's seventh president in 2014 and served two terms until 2024 — the first Indonesian president from outside the political and military elite."
  ur: "انڈونیشی سیاست دان اور سابق فرنیچر کاروباری، جو 1961ء میں سوراکارتا میں مولیونو کے نام سے پیدا ہوئے۔ 2005ء سے 2012ء تک سوراکارتا کے میئر اور 2012ء سے 2014ء تک جکارتہ کے گورنر رہے، پھر 2014ء میں انڈونیشیا کے ساتویں صدر بنے اور 2024ء تک دو مدتیں پوری کیں — سیاسی و عسکری اشرافیہ سے باہر سے آنے والے پہلے انڈونیشی صدر۔"
