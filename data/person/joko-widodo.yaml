summary:
  ar: "سياسي إندونيسي ورجل أعمال سابق في صناعة الأثاث، وُلد في سوراكارتا سنة 1961 باسم موليونو. كان عمدة سوراكارتا من 2005 إلى 2012 وحاكم جاكرتا من 2012 إلى 2014، ثم صار رئيس إندونيسيا السابع سنة 2014 وبقي لولايتين حتى 2024، وهو أول رئيس إندونيسي من خارج النخبة السياسية والعسكرية."
  en: "Indonesian politician and former furniture businessman, born in Surakarta in 1961 under the name Mulyono. Mayor of Surakarta from 2005 to 2012 and governor of Jakarta from 2012 to 2014, he became Indonesia's seventh president in 2014 and served two terms until 2024 — the first Indonesian president from outside the political and military elite."
  ur: "انڈونیشی سیاست دان اور سابق فرنیچر کاروباری، جو 1961ء میں سوراکارتا میں مولیونو کے نام سے پیدا ہوئے۔ 2005ء سے 2012ء تک سوراکارتا کے میئر اور 2012ء سے 2014ء تک جکارتہ کے گورنر رہے، پھر 2014ء میں انڈونیشیا کے ساتویں صدر بنے اور 2024ء تک دو مدتیں پوری کیں — سیاسی و عسکری اشرافیہ سے باہر سے آنے والے پہلے انڈونیشی صدر۔"
  es: "Político indonesio y antiguo empresario del sector del mueble, nacido en Surakarta en 1961 con el nombre de Mulyono. Alcalde de Surakarta de 2005 a 2012 y gobernador de Yakarta de 2012 a 2014, se convirtió en el séptimo presidente de Indonesia en 2014 y ejerció dos mandatos hasta 2024, siendo el primer presidente indonesio ajeno a la élite política y militar."
  fr: "Homme politique indonésien et ancien entrepreneur dans le secteur du meuble, né à Surakarta en 1961 sous le nom de Mulyono. Maire de Surakarta de 2005 à 2012 et gouverneur de Jakarta de 2012 à 2014, il est devenu le septième président de l'Indonésie en 2014 et a effectué deux mandats jusqu'en 2024 – le premier président indonésien issu d'une sphère extérieure à l'élite politique et militaire."
  tr: "Endonezyalı bir politikacı ve mobilya sektöründe eski bir iş insanı, 1961'de Surakarta'da Muliyono adıyla doğdu. 2005-2012 yılları arasında Surakarta belediye başkanı, 2012-2014 yılları arasında ise Jakarta valisi olarak görev yaptı, ardından 2014'te Endonezya'nın yedinci cumhurbaşkanı oldu ve 2024'e kadar iki dönem görev yaptı. Siyasi ve askeri elitin dışından gelen ilk Endonezya cumhurbaşkanıdır."
  id: "Seorang politikus Indonesia dan mantan pengusaha di industri furnitur, lahir di Surakarta pada tahun 1961 dengan nama Muliyono. Ia menjabat sebagai walikota Surakarta dari 2005 hingga 2012 dan gubernur Jakarta dari 2012 hingga 2014, kemudian menjadi presiden ketujuh Indonesia pada 2014 dan menjabat dua periode hingga 2024. Ia adalah presiden Indonesia pertama dari luar elit politik dan militer."
