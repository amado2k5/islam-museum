summary:
  ar: "بطاقة أولية لإسكندر بك، القائد الألباني الذي قاوم السلطان محمد الفاتح، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع أخباره في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Skanderbeg, the Albanian commander who resisted Mehmed the Conqueror, named from an open reference description (Wikidata); the Ottoman-survey account is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Skanderbeg, el comandante albanés que resistió a Mehmed el Conquistador, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); el relato del censo otomano aún no se ha verificado en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de Skanderbeg, commandant albanais qui a résisté à Mehmed le Conquérant, nommé d'après une description de référence ouverte (Wikidata); le compte rendu du relevé ottoman n'est pas encore vérifié sur la page, donc aucune date n'est indiquée."
  ur: "اسکندربیگ کے لیے ڈرافٹ کارڈ، البانوی کمانڈر جس نے فاتح محمود کے خلاف مزاحمت کی، جس کا نام کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ Ottoman-survey اکاؤنٹ کو صفحہ پر ابھی تک چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Sultan Mehmed'e direnen Arnavut komutan İskender Beg'in ön kartı, açık bir referans açıklamasında (Wikidata) geçmektedir. Al-Salabi'nin Osmanlı İmparatorluğu Tarihi'ndeki haberleri henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Iskandar Beg, komandan Albania yang melawan Sultan Mehmed Sang Penakluk, disebutkan dalam deskripsi referensi terbuka (Wikidata). Beritanya dalam History of the Ottoman Empire oleh Al-Salabi belum ditinjau di halaman tersebut, sehingga tanggal-tanggal tidak disebutkan di sini."
