label:
  ar: براك حاجب قطلغ خان
  en: Baraq Hajib Qutlugh Khan
summary:
  ar: "براك حاجب قطلغ خان؛ أحد قواد دولة الخطا الذين دخلوا خدمة خوارزمشاه محمد فاستولى على كرمان سنة 619هـ، وكان نائباً لجلال الدين منكبرتي فيها فأراد الاستقلال بها سنة 623هـ وأرسل إلى المغول يحثهم على حربه، فلما سار إليه جلال الدين تحصن في قلعته وأبى أن يقابله وكاتبه: إنني أنا العبد المملوك ولما سمعت بمسيرك إلى هذه البلاد أخليتها لك، فأقام على ملكها وجرت خانات قطلغ من نسله في كرمان إلى نحو سنة 703هـ."
  en: "Baraq Hajib Qutlugh Khan; a Qara-Khitai commander in Khwarazmshah Muhammad's service who took Kirman in 619, serving as Jalal al-Din Mingburnu's lieutenant until he sought independence in 623 by calling the Mongols against him — when Jalal al-Din marched, Baraq shut himself in a castle and wrote 'I am the purchased slave; when I heard of your coming I emptied the land for you' — and his Qutlugh-Khanid line held Kirman to about 703."
