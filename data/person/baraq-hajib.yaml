summary:
  ar: "براك حاجب قطلغ خان؛ أحد قواد دولة الخطا الذين دخلوا خدمة خوارزمشاه محمد فاستولى على كرمان سنة 619هـ، وكان نائباً لجلال الدين منكبرتي فيها فأراد الاستقلال بها سنة 623هـ وأرسل إلى المغول يحثهم على حربه، فلما سار إليه جلال الدين تحصن في قلعته وأبى أن يقابله وكاتبه: إنني أنا العبد المملوك ولما سمعت بمسيرك إلى هذه البلاد أخليتها لك، فأقام على ملكها وجرت خانات قطلغ من نسله في كرمان إلى نحو سنة 703هـ."
  en: "Baraq Hajib Qutlugh Khan; a Qara-Khitai commander in Khwarazmshah Muhammad's service who took Kirman in 619, serving as Jalal al-Din Mingburnu's lieutenant until he sought independence in 623 by calling the Mongols against him — when Jalal al-Din marched, Baraq shut himself in a castle and wrote 'I am the purchased slave; when I heard of your coming I emptied the land for you' — and his Qutlugh-Khanid line held Kirman to about 703."
  es: "Baraq Hajib Qutlugh Khan, comandante Qara-Khitai al servicio de Khwarazmshah Muhammad, conquistó Kirman en 619, sirviendo como lugarteniente de Jalal al-Din Mingburnu hasta que buscó la independencia en 623 incitando a los mongoles contra él. Cuando Jalal al-Din marchó, Baraq se encerró en un castillo y escribió: «Soy el esclavo comprado; cuando supe de tu llegada, vacié la tierra para ti». Su dinastía Qutlugh-Khanid mantuvo el control de Kirman hasta aproximadamente el año 703."
  fr: "Baraq Hajib Qutlugh Khan; un commandant Qara-Khitai au service de Khwarezmshah Muhammad qui prit Kirman en 619, servant comme lieutenant de Jalal al-Din Mingburnu jusqu'à ce qu'il cherche l'indépendance en 623 en appelant les Mongols contre lui — lorsque Jalal al-Din marcha, Baraq s'enferma dans un château et écrivit « Je suis l'esclave acheté; quand j'ai entendu parler de votre venue, j'ai vidé le pays pour vous » — et sa lignée Qutlugh-Khanide contrôla Kirman jusqu'en 703 environ."
  ur: "براق حاجی قطلغ خان؛ خوارزمشاہ محمد کی خدمت میں ایک قارا-خطائی کمانڈر جس نے 619 میں کرمان کو لے لیا، جلال الدین منگبرنو کے لیفٹیننٹ کے طور پر خدمات انجام دیں یہاں تک کہ اس نے 623 میں منگولوں کو اپنے خلاف بلا کر آزادی کی کوشش کی - جب جلال الدین نے مارچ کیا، براق نے لکھا اور میں نے خود کو ایک غلام میں بند کر لیا۔ جب میں نے آپ کے آنے کی خبر سنی تو میں نے آپ کے لیے زمین خالی کر دی' - اور اس کی قطلوغ خانید لائن نے کرمان کو تقریباً 703 تک پہنچا دیا۔"
  tr: "Barak Hacı Kutlag Han, Khatta devletinin komutanlarından biriydi; 619 Hicri yılında Hwarazmşah Muhammed'in hizmetine girmiş ve Kirman'ı ele geçirmiştir. Oradaki Büyük Eyalet'ten Celaleddin'in vekiliydi ve 623 Hicri'nde orada bağımsızlık istedi, Moğolları savaşa çağırmak için gönderdi. Celaleddin ona yürüdüğünde, kalesinde kendini tahkim etti ve onunla görüşmeyi reddetti. Ona şöyle yazdı: 'Ben köle Memlük'üm ve bu topraklara yürüyüşünü duyunca burayı sana bıraktım.' Daha sonra bu toprakta yerleşti ve Qutlag Hanları, yaklaşık 703 Hicri yılına kadar Kerman'daki soyundan gelmişti."
  id: "Barak Hajib Qutlag Khan, salah satu komandan negara Khatta yang masuk ke dinas Khwarazmshah Muhammad dan merebut Kerman pada tahun 619 H. Ia menjadi wakil Jalal al-Din dari Provinsi Besar di sana dan mencari kemerdekaan di sana pada tahun 623 H serta mengirim surat kepada Mongol untuk mendesak mereka berperang. Ketika Jalal al-Din mendekatinya, ia memperkuat diri di bentengnya dan menolak untuk bertemu dengannya. Ia menulis kepadanya: 'Aku adalah Mamluk budak, dan ketika aku mendengar tentang perjalananmu ke tanah ini, aku menyerahkannya kepadamu.' Ia kemudian menetap di kerajaannya, dan para Khan Qutlag berasal dari keturunannya di Kerman hingga sekitar tahun 703 H."
