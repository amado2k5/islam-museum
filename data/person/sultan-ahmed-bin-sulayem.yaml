summary:
  ar: "سلطان أحمد بن سليم (وُلد سنة 1955) رجل أعمال إماراتي من دبي، بنى المنطقة الحرة في جبل علي منذ سنة 1985 وحوّل موانئ دبي العالمية، بصفته رئيس مجلس إدارتها ثم رئيس مجلس الإدارة والرئيس التنفيذي للمجموعة، إلى واحدة من أكبر مشغلي الموانئ في العالم. استقال من مناصبه في موانئ دبي العالمية في شباط 2026 بعد نشر مراسلاته مع جيفري إبستين، وأصبح في تموز 2026 الرئيس التنفيذي لمجلس إدارة شركة إم إم سي للموانئ في ماليزيا."
  en: "Sultan Ahmed bin Sulayem (born 1955) is an Emirati businessman from Dubai who built the Jebel Ali Free Zone from 1985 and, as chairman and later group chairman and CEO of DP World, turned it into one of the world's largest port operators. He resigned his DP World posts in February 2026 after his correspondence with Jeffrey Epstein was made public, and in July 2026 became executive chairman of Malaysia's MMC Ports."
  ur: "سلطان احمد بن سلیم (پیدائش 1955) دبئی سے تعلق رکھنے والے اماراتی تاجر ہیں جنھوں نے 1985 سے جبل علی فری زون کو تعمیر کیا اور ڈی پی ورلڈ کے چیئرمین (بعد ازاں گروپ چیئرمین و سی ای او) کی حیثیت سے اسے دنیا کے سب سے بڑے پورٹ آپریٹرز میں سے ایک بنایا۔ وہ فروری 2026 میں جیفری ایپسٹین سے اپنی خط کتابت منظر عام پر آنے کے بعد ڈی پی ورلڈ کے عہدوں سے مستعفی ہوئے، اور جولائی 2026 میں ملائیشیا کی ایم ایم سی پورٹس کے ایگزیکٹو چیئرمین بنے۔"
