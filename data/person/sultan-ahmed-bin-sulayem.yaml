summary:
  ar: "سلطان أحمد بن سليم ⁦(وُلد سنة 1955)⁩ رجل أعمال إماراتي من دبي، بنى المنطقة الحرة في جبل علي منذ سنة 1985 وحوّل موانئ دبي العالمية، بصفته رئيس مجلس إدارتها ثم رئيس مجلس الإدارة والرئيس التنفيذي للمجموعة، إلى واحدة من أكبر مشغلي الموانئ في العالم. استقال من مناصبه في موانئ دبي العالمية في شباط 2026 بعد نشر مراسلاته مع جيفري إبستين، وأصبح في تموز 2026 الرئيس التنفيذي لمجلس إدارة شركة إم إم سي للموانئ في ماليزيا."
  en: "Sultan Ahmed bin Sulayem (born 1955) is an Emirati businessman from Dubai who built the Jebel Ali Free Zone from 1985 and, as chairman and later group chairman and CEO of DP World, turned it into one of the world's largest port operators. He resigned his DP World posts in February 2026 after his correspondence with Jeffrey Epstein was made public, and in July 2026 became executive chairman of Malaysia's MMC Ports."
  ur: "سلطان احمد بن سلیم ⁦(پیدائش 1955)⁩ دبئی سے تعلق رکھنے والے اماراتی تاجر ہیں جنھوں نے 1985 سے جبل علی فری زون کو تعمیر کیا اور ڈی پی ورلڈ کے چیئرمین ⁦(بعد ازاں گروپ چیئرمین و سی ای او)⁩ کی حیثیت سے اسے دنیا کے سب سے بڑے پورٹ آپریٹرز میں سے ایک بنایا۔ وہ فروری 2026 میں جیفری ایپسٹین سے اپنی خط کتابت منظر عام پر آنے کے بعد ڈی پی ورلڈ کے عہدوں سے مستعفی ہوئے، اور جولائی 2026 میں ملائیشیا کی ایم ایم سی پورٹس کے ایگزیکٹو چیئرمین بنے۔"
  es: "Sultan Ahmed bin Sulayem (nacido en 1955) es un empresario emiratí de Dubái que construyó la Zona Franca de Jebel Ali a partir de 1985 y, como presidente y posteriormente presidente del grupo y director ejecutivo de DP World, la convirtió en uno de los operadores portuarios más grandes del mundo. Renunció a sus cargos en DP World en febrero de 2026 tras hacerse pública su correspondencia con Jeffrey Epstein, y en julio de 2026 se convirtió en presidente ejecutivo de MMC Ports de Malasia."
  fr: "Sultan Ahmed bin Sulayem (né en 1955) est un homme d'affaires émirati originaire de Dubaï. Il a créé la zone franche de Jebel Ali à partir de 1985 et, en tant que président puis président-directeur général du groupe DP World, l'a transformée en l'un des plus grands opérateurs portuaires au monde. Il a démissionné de ses fonctions chez DP World en février 2026 après la révélation de sa correspondance avec Jeffrey Epstein et est devenu, en juillet 2026, président exécutif de MMC Ports en Malaisie."
  tr: "Sultan Ahmed bin Sulayem (d. 1955), Dubai'den bir Emirlikli iş insanıdır. 1985'te Jebel Ali Serbest Bölgesi'ni inşa eden ve DP World'ü grubun başkanı, ardından başkanı ve CEO'su olarak dünyanın en büyük liman işletmecilerinden biri haline getirmiştir. Jeffrey Epstein ile yazışmalarını yayımladıktan sonra Şubat 2026'da DP World'deki görevlerinden istifa etti ve Temmuz 2026'da MMC Ports Malaysia'nın CEO'su oldu."
  id: "Sultan Ahmed bin Sulayem (lahir 1955) adalah seorang pengusaha Emirat dari Dubai yang membangun Zona Bebas Jebel Ali pada tahun 1985 dan mengubah DP World, sebagai ketua, kemudian ketua dan CEO grup, menjadi salah satu operator pelabuhan terbesar di dunia. Ia mengundurkan diri dari posisinya di DP World pada Februari 2026 setelah menerbitkan korespondensinya dengan Jeffrey Epstein, dan pada Juli 2026, ia menjadi CEO MMC Ports Malaysia."
