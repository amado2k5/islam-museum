summary:
  ar: "سياسي ماليزي، وُلد في تشيروك توك كون ببينانغ سنة 1947. قائد طلابي وشبابي إسلامي شارك في تأسيس حركة الشباب الإسلامي (أبيم)، ثم انضم إلى أمنو سنة 1982 وتدرّج في وزارتي التعليم والمالية حتى صار نائب رئيس الوزراء سنة 1993؛ أُقيل سنة 1998 وسُجن بتهم أبطلت المحكمة الاتحادية إحداها سنة 2004، وقاد المعارضة عقدا تخلله سجن ثانٍ حتى عفو ملكي سنة 2018، ثم أدى اليمين عاشر رئيس وزراء لماليزيا في 24 نوفمبر 2022."
  en: "Malaysian politician, born at Cherok Tok Kun, Penang, in 1947. A student and Islamic youth leader who co-founded the ABIM movement, he joined UMNO in 1982 and rose through the education and finance ministries to become deputy prime minister in 1993; sacked and jailed in 1998, he was freed in 2004 after the Federal Court overturned his sodomy conviction, led the opposition through a second imprisonment ended by a royal pardon in 2018, and was sworn in as Malaysia's tenth prime minister on 24 November 2022."
  ur: "ملائیشیائی سیاست دان، جو 1947ء میں چیروک ٹوک کن، پینانگ میں پیدا ہوئے۔ طلبہ اور اسلامی نوجوان رہنما کے طور پر انھوں نے ابیم (ABIM) کی بنیاد رکھنے میں حصہ لیا، 1982ء میں امنو میں شامل ہوئے اور وزارتِ تعلیم و خزانہ سے ہوتے ہوئے 1993ء میں نائب وزیرِ اعظم بنے؛ 1998ء میں برطرف کر کے قید کیے گئے، 2004ء میں وفاقی عدالت کی جانب سے بدفعلی کی سزا کالعدم ہونے پر رہا ہوئے، دوسری قید کے بعد 2018ء میں شاہی معافی ملی، اور 24 نومبر 2022ء کو ملائیشیا کے دسویں وزیرِ اعظم کے طور پر حلف اٹھایا۔"
