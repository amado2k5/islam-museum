id: person/george-of-antioch
class: person
label: { ar: "جرجي بن ميخائيل الأنطاكي" }
summary:
  ar: "نصراني هاجر من المشرق تعلم اللسان وبرع في الحساب وتهذب بالشام في أنطاكية وغيرها فاصطنعه تميم بن المعز وكان يحيى يشاوره، فلما هلك تميم أعمل الحيلة في اللحاق برجار صاحب صقلية فلحق به وحظى عنده واستعمله على أسطوله فبعثه لحصار المهدية فزحف في ثلاثمائة مركب فيهم ألف فارس {cite:tarikh-ibn-khaldun-ibar p. 1635}."
  en: "An Antioch Christian who migrated west, mastered the tongue and reckoning and was made Tamim b. al-Mu'izz's confidant; after Tamim's death he slipped away to Roger of Sicily, won favour and commanded the fleet that besieged Mahdiyya in three hundred ships {cite:tarikh-ibn-khaldun-ibar p. 1635}."
  es: "Un cristiano de Antioquía que emigró al oeste, dominó la lengua y el cálculo y se convirtió en confidente de Tamim b. al-Mu'izz; tras la muerte de Tamim, se escabulló a ver a Roger de Sicilia, se ganó su favor y comandó la flota que sitió Mahdiyya en trescientos barcos {cite:tarikh-ibn-khaldun-ibar p. 1635}."
  fr: "Un chrétien d'Antioche qui a émigré vers l'ouest, a maîtrisé la langue et le calcul et est devenu le confident de Tamim b. al-Mu'izz; après la mort de Tamim, il s'est glissé auprès de Roger de Sicile, a gagné sa faveur et a commandé la flotte qui a assiégé Mahdiyya avec trois cents navires {cite:tarikh-ibn-khaldun-ibar p. 1635}."
  ur: "ایک انطاکیہ عیسائی جس نے مغرب سے ہجرت کی، زبان اور حساب پر مہارت حاصل کی اور تمیم بن گیا۔ المعز کا معتقد؛ تمیم کی موت کے بعد وہ سسلی کے راجر کے پاس چلا گیا، اس کی حمایت حاصل کی اور تین سو بحری جہازوں میں مہدیہ کا محاصرہ کرنے والے بیڑے کی کمانڈ کی۔ 1635}۔"
  tr: "Doğudan göç eden, dili öğrenen, aritmetikte üstün olan ve Levant'ta, Antakya'da ve başka yerlerde gelişen bir Hristiyan. Tamim ibn al-Mu'izz onu bir adam yaptı ve Yahya ona danıştı. Tamim öldüğünde, Sicilya'nın Rajar'ına yetişmek için bir strateji geliştirdi, bu yüzden ona katıldı, onun desteğini kazandı ve onu filosuna atadı. Onu Mahdia'yı kuşatmaya gönderdi, üç yüz gemiyle ve bin süvarıyla ilerledi {atıf:Tarikh-ibn-khaldun-ibar s. 1635}."
  id: "Seorang Kristen yang bermigrasi dari Timur, mempelajari bahasa itu, unggul dalam aritmatika, dan menjadi mahir di Levant di Antiokhia dan tempat lain. Tamim ibn al-Mu'izz menjadikannya seorang pria, dan Yahya berkonsultasi dengannya. Ketika Tamim meninggal, ia merancang strategi untuk mengejar Rajar dari Sisilia, sehingga ia bergabung dengannya, mendapatkan perhatiannya, dan menunjuknya ke armada Mahdia. Ia mengirimnya untuk mengepung Mahdia, maju dengan tiga ratus kapal dan seribu penunggang kuda {cite:Tarikh-ibn-khaldun-ibar hlm. 1635}."
