summary:
  ar: "نصراني هاجر من المشرق تعلم اللسان وبرع في الحساب وتهذب بالشام في أنطاكية وغيرها فاصطنعه تميم بن المعز وكان يحيى يشاوره، فلما هلك تميم أعمل الحيلة في اللحاق برجار صاحب صقلية فلحق به وحظى عنده واستعمله على أسطوله فبعثه لحصار المهدية فزحف في ثلاثمائة مركب فيهم ألف فارس {cite:tarikh-ibn-khaldun-ibar p. 1635}."
  en: "An Antioch Christian who migrated west, mastered the tongue and reckoning and was made Tamim b. al-Mu'izz's confidant; after Tamim's death he slipped away to Roger of Sicily, won favour and commanded the fleet that besieged Mahdiyya in three hundred ships {cite:tarikh-ibn-khaldun-ibar p. 1635}."
