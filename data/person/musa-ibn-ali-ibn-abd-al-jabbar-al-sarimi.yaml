class: person
label:
  ar: موسى بن علي بن عبد الجبار الصريمي
  en: Musa ibn Ali ibn Abd al-Jabbar al-Sarimi
  ur: موسیٰ بن علی بن عبد الجبار صریمی
  es: "Musa ibn Ali ibn Abd al-Jabbar al-Sarimi"
  fr: "Musa ibn Ali ibn Abd al-Jabbar al-Sarimi"
summary:
  ar: راوٍ ذُكر له خبر السحابة بمذاب فحدّث بخبر ابنه الصغير الذي لم يتكلم حتى سُقي ماءً وُضع فيه خاتم الهادي.
  en: A narrator who, told of the cloud at Madhab, related how his small son, who had not spoken, spoke after drinking water in which al-Hadi's seal ring had been set.
  ur: ایک راوی جس سے مذاب کے بادل کا ذکر ہوا تو اس نے اپنے چھوٹے بیٹے کا بیان کیا جو ہادی کی انگوٹھی ڈالے گئے پانی کو پینے کے بعد بولنے لگا۔
  es: "Un narrador, a quien le hablaron de la nube en Madhab, relató cómo su hijo pequeño, que no había hablado, habló después de beber agua en la que había estado colocado el anillo del sello de al-Hadi."
  fr: "Un narrateur, qui raconta l'histoire du nuage à Madhab, raconta comment son petit fils, qui n'avait pas parlé, parla après avoir bu de l'eau dans laquelle avait été placé l'anneau scellé d'al-Hadi."
