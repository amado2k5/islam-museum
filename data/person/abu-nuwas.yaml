label: { ar: "أبو نواس", en: "Abu Nuwas", fr: "Abu Nuwas", es: "Abu Nuwas", ur: "ابو نواس" }
summary:
  ar: "الحسن بن هانئ الحكمي، شاعر العصر العباسي الأول، أتى في وصف الخمر نورها وطعمها وريحها ولونها وشعاعها وفعلها في النفس وظروفها وأدنانها وحال المنادمات عليها والاصطباح والاغتباق بما يكاد يغلق باب الوصف كما ذكر المسعودي، ومنه فكأنها في كفه شمس وراحته قمر، وقال أصبح ولا صبح سوى ضوء العقار {cite:muruj-al-dhahab p. 707-709}."
  en: "al-Hasan b. Hani' — the poet who nearly closed the door on describing wine {cite:muruj-al-dhahab p. 707-709}."
  fr: "al-Hasan b. Hani' — le poète qui faillit clore le chapitre de la description du vin {cite:muruj-al-dhahab p. 707-709}."
  es: "al-Hasan b. Hani' — el poeta que casi cerró la puerta a la descripción del vino {cite:muruj-al-dhahab p. 707-709}."
  ur: "الحسن بی ہانی - وہ شاعر جس نے شراب کو بیان کرنے کا دروازہ تقریباً بند کر دیا تھا۔ 707-709}۔"
  tr: "Birinci Abbasi döneminin şairi Hasan ibn Hani el-Hakami, şarabı ışığı, tadı, kokusu, rengi, parlaklığı, ruha etkisi, koşulları, kapları, şarap eşliğindeki arkadaşlık hali ve sabah ve akşam içkileri açısından, neredeyse betimlemenin kapısını kapatacak şekilde tanımlamıştır, diye belirtmiştir El-Mas'udi. Bunlardan biri şöyledir: \"Sanki avucunda güneş, elinde ay varmış gibi.\" Şöyle demiştir: \"Uyanıyorum ve şarabın ışığından başka bir sabah yok.\" {kaynak: Muruj-al-Dhahab s. 707-709}"
  id: "Al-Hasan ibn Hani’ al-Hakami, penyair era Abbasiyah pertama, menggambarkan anggur dalam hal cahayanya, rasa, aroma, warna, pancaran, pengaruhnya terhadap jiwa, keadaannya, wadahnya, keadaan kebersamaan saat meminumnya, dan minuman pagi dan sore, dengan cara yang hampir menutup pintu deskripsi, seperti yang disebutkan oleh Al-Mas’udi. Di antara kutipannya adalah: “Seolah-olah itu adalah matahari di telapak tangannya dan bulan di tangannya.” Dia berkata: “Aku bangun, dan tidak ada pagi kecuali cahaya anggur.” {cite:muruj-al-dhahab hlm. 707-709}"
