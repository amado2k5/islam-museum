summary:
  ar: "مكرمت خان موظف مغولي، تذكره دائرة المعارف الإسلامية بين من أشرفوا إشرافاً عاماً على بناء تاج محل في أغرة مع مير عبد الكريم. لا تعطي المقالات تاريخ ميلاده ووفاته ولا منصبه الدقيق {cite:encyclopaedia-of-islam-2 vol. 1 p. 276} {cite:encyclopaedia-of-islam-2 vol. 10 p. 69}."
  en: "Makramat Khan was a Mughal official whom the Encyclopaedia of Islam names, with Mir Abd al-Karim, as holding the general supervision of the building of the Taj Mahal at Agra. The articles give no dates and no precise office for him {cite:encyclopaedia-of-islam-2 vol. 1 p. 276} {cite:encyclopaedia-of-islam-2 vol. 10 p. 69}."
  ur: "مکرمت خان مغل عہدیدار تھے جنہیں دائرۃ المعارف الاسلامیہ آگرہ میں تاج محل کی تعمیر کی عمومی نگرانی میں میر عبد الکریم کے ساتھ بیان کرتا ہے۔ مقالات ان کی تاریخیں یا ٹھیک منصب نہیں بتاتے {cite:encyclopaedia-of-islam-2 vol. 1 p. 276} {cite:encyclopaedia-of-islam-2 vol. 10 p. 69}."
