summary:
  ar: "قطب الدين سنجر مملوك الخليفة الناصر لدين الله ولاه خوزستان بعد طشتكين أمير الحاج؛ بدا منه التغير عن الطاعة سنة ست وستمائة فلما سار إليه عسكر الخليفة فارق البلاد ولحق بصاحب شيراز أتابك سعد بن دكلا، فسلمه صاحب شيراز بالعهد فدخل بغداد في المحرم سنة ثمان وستمائة على بغل بأكلف وفي رجله سلسلتان، فقرّر بأمور منكرة فأقر بها وحبس {cite:kamil-ibn-al-athir p. 352-353}."
  en: "Al-Nasir's mamluk and governor of Khuzistan — his covert rebellion ended in surrender at Shiraz's intercession; paraded into Baghdad on a pack-mule in leg-chains, he confessed before the assembled notables {cite:kamil-ibn-al-athir p. 352-353}."
