class: person
label: { ar: "قطب الدين سنجر", en: "Qutb al-Din Sanjar", es: "Qutb al-Din Sanjar", fr: "Qutb al-Din Sanjar", ur: "قطب الدین سنجر" }
summary:
  ar: "قطب الدين سنجر مملوك الخليفة الناصر لدين الله ولاه خوزستان بعد طشتكين أمير الحاج؛ بدا منه التغير عن الطاعة سنة ست وستمائة فلما سار إليه عسكر الخليفة فارق البلاد ولحق بصاحب شيراز أتابك سعد بن دكلا، فسلمه صاحب شيراز بالعهد فدخل بغداد في المحرم سنة ثمان وستمائة على بغل بأكلف وفي رجله سلسلتان، فقرّر بأمور منكرة فأقر بها وحبس {cite:kamil-ibn-al-athir p. 352-353}."
  en: "Al-Nasir's mamluk and governor of Khuzistan — his covert rebellion ended in surrender at Shiraz's intercession; paraded into Baghdad on a pack-mule in leg-chains, he confessed before the assembled notables {cite:kamil-ibn-al-athir p. 352-353}."
  es: "Mameluco de Al-Nasir y gobernador de Juzestán: su rebelión clandestina terminó en rendición por intercesión de Shiraz; fue llevado a Bagdad en una mula de carga con las piernas encadenadas y confesó ante los notables allí reunidos {cite:kamil-ibn-al-athir p. 352-353}."
  fr: "Al-Nasir, mamelouk et gouverneur du Khuzistan, sa rébellion secrète s'est terminée par une reddition grâce à l'intercession de Shiraz; exhibé à Bagdad sur une mule de bât enchaînée aux jambes, il a avoué devant les notables réunis {cite:kamil-ibn-al-athir p. 352-353}."
  ur: "النصیر کا مملوک اور خوزستان کا گورنر - اس کی خفیہ بغاوت شیراز کی شفاعت پر ہتھیار ڈالنے پر ختم ہوئی۔ ٹانگوں کی زنجیروں میں جکڑے خچر پر بیٹھ کر بغداد پہنچا، اس نے جمع ہونے والے معززین کے سامنے اعتراف کیا۔ 352-353}۔"
  tr: "Halife el-Nasir li-Din Allah'ın memlüğü Kutb al-Din Sanjar, onu Hac prensi Taştekin'den sonra Huzistan valisi olarak atadı; 600 Hicri yılında itaatten vazgeçmeye başladı. Halifenin ordusu ona doğru yürüdüğünde, ülkeyi terk etti ve Şiraz hükümdarı Atabeg Saad bin Dakla'ya katıldı. Şiraz hükümdarı ona rehin verdi ve 608 Hicri yılında Muharrem'de bacağına iki zincir takılmış bir katır üzerinde Bağdat'a girdi. Kınanacak konulara karar verdi, kabul etti ve hapse attı {atıf:kamil-ibn-al-athir s. 352-353}."
  id: "Qutb al-Din Sanjar, mamluk Khalifah al-Nasir li-Din Allah, mengangkatnya sebagai gubernur Khuzestan setelah Tashtakin, pangeran al-Hajj; ia mulai meninggalkan ketaatan pada tahun 600 H. Ketika pasukan khalifah mendekatinya, ia meninggalkan negeri dan bergabung dengan penguasa Shiraz, Atabeg Saad ibn Dakla. Penguasa Shiraz menyerahkan janji kepadanya, dan ia memasuki Baghdad dalam Muharram pada tahun 608 H dengan membawa keledai dengan dua rantai di kakinya. Ia memutuskan hal-hal yang tercela, mengakuinya, dan memenjarakan {cite:kamil-ibn-al-athir hlm. 352-353}."
