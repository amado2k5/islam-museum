died: { edtf: "0819", hijri: "0204", calendar: julian, precision: year, status: tradition, derived: true, note: "قرأ أبو علي اليزيدي عليه كتاب الأنواء بجرجان ثم قدم مع المأمون العراق سنة أربع ومائتين فخرج مؤرج إلى البصرة ومات بها؛ وقال ابن النديم عن خط عبد الله بن المعتز: توفي سنة خمس وتسعين ومائة في اليوم الذي توفي فيه أبو نواس، واختلف ابن خلكان {cite:wafayat-ayan}." }
summary:
  ar: "مؤرج بن عمرو بن الحارث بن ثور السدوسي النحوي البصري؛ أخذ العربية عن الخليل بن أحمد وروى الحديث عن شبابة بن الحجاج وأبي عمرو بن العلاء، وكان يقول قدمت من البادية ولا معرفة لي بالقياس في العربية وإنما كانت معرفتي قريحة وأول ما تعلمت القياس في حلقة أبي زيد الأنصاري بالبصرة؛ وكان الغالب عليه اللغة والشعر، وله عدة تصانيف منها «الأنواء» و«غريب القرآن» و«جماهر القبائل» و«المعاني»، واختصر نسب قريش في مجلد لطيف {cite:wafayat-ayan}."
  en: "Mu'arraj al-Sadusi (d. 204) — Basran grammarian, pupil of al-Khalil b. Ahmad; author of al-Anwa', Jamahir al-Qaba'il and a condensed Quraysh genealogy {cite:wafayat-ayan}."
