id: person/sabur-ibn-ardashir
class: person
label: { ar: "سابور بن أزدشير الوزير" }
summary:
  ar: "أبو نصر سابور بن أزدشير الوزير، ابتاع سنة اثنتين وثمانين داراً بالكرخ وعمرها وسماها دار العلم ووقفها على العلماء ووقف بها كتباً كثيرة {cite:tarikh-khulafa-minhaj-1434 p. 635}؛ وعند ابن الجوزي اشترى الدار بين السورين سنة ٣٨١ وحمل إليها كتبًا من كل علم فبلغت أكثر من عشرة آلاف مجلد وبقيت نحو سبعين سنة حتى احترقت حين قدم طغرلبك سنة ٤٥٠ {cite:muntazam-ibn-al-jawzi j.8 p.364-365}. وعند المسعودي أنه بناه بيت نار على خليج القسطنطينية حين نزل عليها وحاصرها في عساكره واشترط على الروم بناءه وعمارته ولم يزل هنالك إلى خلافة المهدي فخرب، وسمي سابور الجنود لكثرة من تبعه من الجنود، وعدل عن طريقه فنزل الحضر ملك الضيزن التنوخي فحاصره شهراً حتى دلته ابنته النضيرة على مأخذه من الثرثار فقتله وهدم الحصن ثم أمر بها فربطت بغدائرها إلى فرسين فقطعاها {cite:muruj-al-dhahab p. 552-554}، وعند المانوية أن ماني خرج يوم ملك سابور ووضع التاج على رأسه يوم الأحد أول نيسان والشمس في الحمل، وأن فيروز أخاه أوصله إليه فدخل إليه وعلى كتفيه مثل السراجين من نور فأجابه إلى حوائجه {cite:fihrist-ibn-al-nadim p. 457-458}"
  en: "The vizier Abu Nasr Sabur ibn Ardashir; in 382 he bought and rebuilt a Karkh house as the Dar al-Ilm, endowed upon the scholars with many books {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  es: "El visir Abu Nasr Sabur ibn Ardashir; en 382 compró y reconstruyó una casa Karkh como Dar al-Ilm, dotando a los eruditos con muchos libros {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  fr: "Le vizir Abu Nasr Sabur ibn Ardashir; en 382, il acheta et reconstruisit une maison Karkh en tant que Dar al-Ilm, doté aux savants de nombreux livres {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  ur: "وزیر ابو نصر صبور ابن اردشیر؛ 382 میں اس نے ایک کارخ گھر خریدا اور اسے دار العلم کے طور پر دوبارہ تعمیر کیا، جس میں علما کو بہت سی کتابوں سے نوازا گیا تھا۔ 635}۔"
  tr: "Ebu Nasr Sabour ibn Azdshir al-Wazir, seksen iki yılında Karkh'ta bir ev satın aldı, inşa etti, adını Dar al-Ilm koydu, alimlere bağışladı ve birçok kitapla donattı {cite:History-Khulafa-minhaj-1434 s. 635}; İbn al-Jawzi ile birlikte, 381 Hicri'de iki Suriyeli arasındaki evi satın aldı ve onlara on bin cildi aşan tüm bilimsel kitaplar getirdi; yaklaşık yetmiş yıl boyunca Tughrlubeg 450'de geldiğinde yandı {cite:Muntazam-ibn-al-jawzi J.8 s.364-365}. al-Mas'udi'ye göre, kamp kurduğunda Konstantinopolis Körfezi'nde ateşten bir ev inşa etti, ordularıyla kuşattı ve Bizanslıların inşa edip yeniden inşa etmesi için şart koşulunu getirdi. El-Mehdi halifeliğine kadar orada kaldı ancak yıkıldı. Onu takip eden çok sayıda asker nedeniyle Sabor al-Jundud olarak adlandırıldı. Yolundan saptı ve şehir el-Dhaizan el-Tanukhi kralı tarafından kuşatıldı, bir ay boyunca kuşatıldı; ta ki kızı el-Nadira ona thirrh kurnazlığını gösterip öldürüp kaleyi yıkıp iki ata bağlayıp kesmesini emreden. {alıntı: Muruj-al-Dhahab s. 552-554} ve Manihecilere göre, Mani Sapur kralının gününde dışarı çıkıp tacı başına taktı; bu, Nisan'ın ilk günü ve Koç'ta güneşin ilk günü, kardeşi Fairuz tarafından ona teslim edildi, böylece omuzlarında ışık dolu lambalar gibi yanına girdi ve ihtiyaçlarını karşıladı {cite:Fihrist-ibn-al-nadim s. 457-458}"
  id: "Abu Nasr Sabour ibn Azdshir al-Wazir membeli sebuah rumah di Karkh pada tahun delapan puluh dua, membangunnya, menamainya Dar al-Ilm, memberinya dana kepada para cendekiawan, dan memberinya banyak buku {cite:History-Khulafa-minhaj-1434 hlm. 635}; bersama Ibn al-Jawzi, ia membeli rumah antara kedua orang Suriah pada tahun 381 H dan membawa ke sana buku-buku dari segala ilmu pengetahuan, yang melebihi sepuluh ribu jilid dan bertahan selama sekitar tujuh puluh tahun hingga terbakar ketika Tughrlubeg tiba pada tahun 450 {cite:Muntazam-ibn-al-jawzi J.8 hlm.364-365}. Menurut al-Mas'udi, ia membangunnya sebuah rumah api di Teluk Konstantinopel saat berkemah di sana, mengepungnya bersama pasukannya, dan menjadikan itu syarat bagi Bizantium untuk membangun dan membangunnya kembali. Kota itu tetap di sana hingga kekhalifahan al-Mahdi, namun kota itu dihancurkan. Benteng itu disebut Sabor al-Jundud karena banyaknya tentara yang mengikutinya. Ia menyimpang dari jalannya, dan kota itu dikepung oleh raja al-Dhaizan al-Tanukhi dan mengepungnya selama sebulan sampai putrinya al-Nadira menunjukkan kelicikannya di tiga puluh tahun, membunuhnya, menghancurkan benteng itu, lalu memerintahkan agar diikat pada dua kuda dan memotongnya. {cite: Muruj-al-Dhahab hlm. 552-554} dan menurut para Manikhean, Mani keluar pada hari raja Sapur dan meletakkan mahkota di kepalanya pada hari Minggu, tanggal satu Nisan dan matahari di Aries, dan saudaranya Fairuz menyerahkannya kepadanya, sehingga ia masuk kepadanya dengan bahunya seperti lampu yang bermuatan cahaya dan memenuhi kebutuhannya {cite:fihrist-ibn-al-nadim hlm. 457-458}"
