id: person/sabur-ibn-ardashir
class: person
label: { ar: "سابور بن أزدشير الوزير" }
summary:
  ar: "أبو نصر سابور بن أزدشير الوزير، ابتاع سنة اثنتين وثمانين داراً بالكرخ وعمرها وسماها دار العلم ووقفها على العلماء ووقف بها كتباً كثيرة {cite:tarikh-khulafa-minhaj-1434 p. 635}؛ وعند ابن الجوزي اشترى الدار بين السورين سنة ٣٨١ وحمل إليها كتبًا من كل علم فبلغت أكثر من عشرة آلاف مجلد وبقيت نحو سبعين سنة حتى احترقت حين قدم طغرلبك سنة ٤٥٠ {cite:muntazam-ibn-al-jawzi j.8 p.364-365}. وعند المسعودي أنه بناه بيت نار على خليج القسطنطينية حين نزل عليها وحاصرها في عساكره واشترط على الروم بناءه وعمارته ولم يزل هنالك إلى خلافة المهدي فخرب، وسمي سابور الجنود لكثرة من تبعه من الجنود، وعدل عن طريقه فنزل الحضر ملك الضيزن التنوخي فحاصره شهراً حتى دلته ابنته النضيرة على مأخذه من الثرثار فقتله وهدم الحصن ثم أمر بها فربطت بغدائرها إلى فرسين فقطعاها {cite:muruj-al-dhahab p. 552-554}، وعند المانوية أن ماني خرج يوم ملك سابور ووضع التاج على رأسه يوم الأحد أول نيسان والشمس في الحمل، وأن فيروز أخاه أوصله إليه فدخل إليه وعلى كتفيه مثل السراجين من نور فأجابه إلى حوائجه {cite:fihrist-ibn-al-nadim p. 457-458}"
  en: "The vizier Abu Nasr Sabur ibn Ardashir; in 382 he bought and rebuilt a Karkh house as the Dar al-Ilm, endowed upon the scholars with many books {cite:tarikh-khulafa-minhaj-1434 p. 635}."
