label:
  ar: "السيوري (عبد الخالق بن عبد الوارث)"
  en: "Al-Siyuri (Abd al-Khaliq ibn Abd al-Warith)"
summary:
  ar: "عبد الخالق بن عبد الوارث السيوري، أبو القاسم، فقيه مالكي، خاتمة علماء أفريقية وآخر أئمة القيروان، حافظ قائم بالمذهب عارف بخلاف العلماء، زاهد ناظر، له عناية بالحديث والقراءات. تفقه بأبي بكر بن عبد الرحمن وأبي عمران الفاسي وطبقتهما، وتفقه عليه عبد الحميد الصائغ واللخمي وحسان البربري وعبد الحق الصقلي وغيرهم. وله تعليق على نكت من المدونة. يذكر المصدر أنه مال آخراً إلى مذهب الشافعي. توفي سنة 460 هـ على ما يذكره العنوان بعلامة الاستفهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15819}"
  en: "Abd al-Khaliq ibn Abd al-Warith al-Siyuri, Abu al-Qasim, a Maliki jurist, the last of the scholars of Ifriqiya and of the last imams of Qayrawan. He had a remarkable memory, upheld the school and knew the disputes of the scholars; he was ascetic and a careful reasoner, and interested in hadith and the readings. He studied with Abu Bakr ibn Abd al-Rahman and Abu Imran al-Fasi and their circle, and Abd al-Hamid al-Sa'igh, al-Lakhmi, Hassan al-Barbari and Abd al-Haqq al-Saqli studied with him. He wrote a gloss on notes from al-Mudawwana. The source says he later leaned towards the Shafi'i school. The header gives 460 AH with a question mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15819}"
