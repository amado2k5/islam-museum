gender: male
summary:
  ar: رشيد بن هداية أحمد الأنصاري الكنكوهي، عالم بالحديث، ولد في كنكوه بالهند وشارك في ثورة 1857 وسجن ستة أشهر، صاحب «العرف الشذي» حاشية على سنن الترمذي، 1244 إلى 1323هـ.
  en: Rashid ibn Hidaya Ahmad al-Gangohi, a scholar of hadith born in Kankoh in India who took part in the 1857 revolt and was jailed six months, author of al-Arf al-Shadhi, a gloss on the Sunan of al-Tirmidhi, 1244 to 1323 AH.
  es: "Rashid ibn Hidaya Ahmad al-Gangohi, un erudito de hadices nacido en Kankoh, India, que participó en la revuelta de 1857 y fue encarcelado durante seis meses, autor de al-Arf al-Shadhi, una glosa sobre el Sunan de al-Tirmidhi, 1244 a 1323 AH."
  fr: "Rashid ibn Hidaya Ahmad al-Gangohi, un érudit du hadith né à Kankoh en Inde qui a participé à la révolte de 1857 et a été emprisonné six mois, auteur d'al-Arf al-Shadhi, une glose sur le Sunan d'al-Tirmidhi, 1244 à 1323 AH."
  ur: "راشد بن ہدایہ احمد الگنگوہی، حدیث کا ایک عالم، کنکوہ ہندوستان میں پیدا ہوا جس نے 1857 کی بغاوت میں حصہ لیا اور چھ ماہ جیل میں بند رہے، العرف الشہدی کے مصنف، سنن الترمذی، 1244 تا 1323 ہجری"
