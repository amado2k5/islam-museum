summary:
  ar: "أبو الحجاج يوسف بن محمد بن إبراهيم الأنصاري البياسي، من فضلاء الأندلس وحفاظها المتقنين؛ أديب بارع مطلع على أقسام كلام العرب من النظم والنثر وراوية لوقائعها وحروبها وأيامها، كان يحفظ كتاب الحماسة لأبي تمام والأشعار الستة وديوان أبي تمام وديوان المتنبي وسقط الزند للمعري وغير ذلك؛ وتنقل في بلاد الأندلس وطاف بأكثرها ثم قدم مدينة تونس فجمع للأمير أبي زكريا يحيى الحفصي كتاب «الإعلام بالحروب الواقعة في صدر الإسلام» ابتدأ فيه بمقتل عمر بن الخطاب وختمه بخروج الوليد بن طريف الشاري على هارون الرشيد، وطالعه ابن خلكان وهو في مجلدين فوجد كلامه كلام عارف بالفن {cite:wafayat-ayan p. 238}. ورأى ابن خلكان له كتاب «الحماسة» في مجلدين قرئت النسخة عليه وعليها خطه، قال في آخره إن الفراغ من تأليفه وترتيبه كان بمدينة تونس في شوال سنة ست وأربعين وستمائة، وذكر في مقدمته أنه لم يجد أقرب تبويب ولا أحسن ترتيب مما بوبه أبو تمام في حماسته فاتبع مذهبه وقرن الشعر بما يجانسه {cite:wafayat-ayan p. 239}. وكان مولده سنة ثلاث وسبعين وخمسمائة وتوفي سنة ثلاث وخمسين وستمائة {cite:wafayat-ayan p. 242}."
  en: "Abu al-Hajjaj Yusuf al-Bayyasi — the Andalusi hafiz who carried the Hamasa, the Six Diwans, al-Mutanabbi's and al-Ma'arri's collections in memory; at Tunis he wrote for the Hafsid amir Abu Zakariya the I'lam bil-Hurub from 'Umar's murder to al-Walid ibn Tarif's revolt, and his own Hamasa arranged on Abu Tammam's pattern, finished Shawwal 646 {cite:wafayat-ayan p. 238-242}."
