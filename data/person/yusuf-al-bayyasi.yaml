summary:
  ar: "أبو الحجاج يوسف بن محمد بن إبراهيم الأنصاري البياسي، من فضلاء الأندلس وحفاظها المتقنين؛ أديب بارع مطلع على أقسام كلام العرب من النظم والنثر وراوية لوقائعها وحروبها وأيامها، كان يحفظ كتاب الحماسة لأبي تمام والأشعار الستة وديوان أبي تمام وديوان المتنبي وسقط الزند للمعري وغير ذلك؛ وتنقل في بلاد الأندلس وطاف بأكثرها ثم قدم مدينة تونس فجمع للأمير أبي زكريا يحيى الحفصي كتاب «الإعلام بالحروب الواقعة في صدر الإسلام» ابتدأ فيه بمقتل عمر بن الخطاب وختمه بخروج الوليد بن طريف الشاري على هارون الرشيد، وطالعه ابن خلكان وهو في مجلدين فوجد كلامه كلام عارف بالفن {cite:wafayat-ayan p. 238}. ورأى ابن خلكان له كتاب «الحماسة» في مجلدين قرئت النسخة عليه وعليها خطه، قال في آخره إن الفراغ من تأليفه وترتيبه كان بمدينة تونس في شوال سنة ست وأربعين وستمائة، وذكر في مقدمته أنه لم يجد أقرب تبويب ولا أحسن ترتيب مما بوبه أبو تمام في حماسته فاتبع مذهبه وقرن الشعر بما يجانسه {cite:wafayat-ayan p. 239}. وكان مولده سنة ثلاث وسبعين وخمسمائة وتوفي سنة ثلاث وخمسين وستمائة {cite:wafayat-ayan p. 242}."
  en: "Abu al-Hajjaj Yusuf al-Bayyasi — the Andalusi hafiz who carried the Hamasa, the Six Diwans, al-Mutanabbi's and al-Ma'arri's collections in memory; at Tunis he wrote for the Hafsid amir Abu Zakariya the I'lam bil-Hurub from 'Umar's murder to al-Walid ibn Tarif's revolt, and his own Hamasa arranged on Abu Tammam's pattern, finished Shawwal 646 {cite:wafayat-ayan p. 238-242}."
  es: "Abu al-Hajjaj Yusuf al-Bayyasi, el hafiz andalusí que llevaba en memoria las colecciones de Hamasa, los Seis Diwans, al-Mutanabbi y al-Ma'arri; en Túnez escribió para el emir hafsida Abu Zakariya el I'lam bil-Hurub desde el asesinato de 'Umar hasta la revuelta de al-Walid ibn Tarif, y su propio Hamasa organizado según el patrón de Abu Tammam, terminado Shawwal 646 {cita:wafayat-ayan p. 238-242}."
  fr: "Abu al-Hajjaj Yusuf al-Bayyasi — le hafiz andalou qui portait en mémoire les collections du Hamasa, des Six Diwans, d'al-Mutanabbi et d'al-Ma'arri; à Tunis, il écrivit pour l'émir hafside Abu Zakariya le I'lam bil-Hurub depuis le meurtre d'Umar jusqu'à la révolte d'al-Walid ibn Tarif, et son propre Hamasa arrangé sur le modèle d'Abu Tammam, termina Shawwal 646 {cite: wafayat-ayan p. 238-242}."
  ur: "ابو الحجاج یوسف البیاسی — اندلس کے حافظ جنہوں نے حماسہ، چھ دیوان، المتنبی اور المعری کے مجموعے یاد رکھے۔ تیونس میں اس نے حفصی امیر ابو زکریا کے لیے علم بل الحرب لکھا جو عمر کے قتل سے لے کر ولید بن طریف کی بغاوت تک، اور اس کی اپنی حماسہ نے ابو تمام کی طرز پر ترتیب دی، شوال 646 کو ختم کیا۔ 238-242}۔"
  tr: "Ebu el-Hacı Yusuf bin Muhammed ibn İbrahim el-Ensari el-Bayasi, Endülüs'ün seçkin ve ezberleyicilerinden biriydi; şiir ve düzyazı Arapça konuşmasının çeşitli dallarında yetkin bir yazardı ve onların olaylarını, savaşlarını ve günlerini anlatıcıydı. Ebu Tammam'ın Al-Hamasah, Al-Sitta'nın Al-Sitta, Abu Tammam'ın Diwanı, Al-Mutanabbi'nin Diwanı, Al-Zand'ın Sakat'ı, Al-Ma'arri ve diğerlerini ezberledi. Endülüs'ü gezdi, çoğunu gezdi, ardından Tunus şehrine geldi ve burada Prens Abu Zekeriye Yahya el-Hafsi'nin 'Al-I'lam bil-Harub al-Waqi'a fi Dawn al-Islam' adlı kitabını derledi, Ömer ibn el-Hattab'ın öldürülmesiyle başlayıp el-Velid bin Tarif'in Harun el-Reşid'e karşı isyanına kadar sona erer. İbn Hallikan bu kitabı iki cilt halinde gözden geçirmiş ve sözlerinin sanat alanında bilgili olduğunu görmüştür {kaynak:wafayat-ayan, s. 238}. İbn Hallikan, \"El-Hamasah\" adlı kitabını iki cilt halinde gördü; kopyası üzerinde okundu ve el yazısı yazılıydı. Sonunda, yazım ve düzenlemenin tamamlanmasının 646 Hicri yılında Tunus şehrinde, Şavval'da gerçekleştiğini söyledi. Girişinde, Ebu Temem'in Hamāsah'ında bulduğu en yakın sınıflandırma veya düzenlemeyi bulamadığını, bu yüzden onun okulunu takip edip şiiri ona uygun olanla birleştirdiğini belirtti {cite:wafayat-ayan, s. 239}. 573 Hicri yılında doğdu ve 653 Hicri'de öldü {cite:wafayat-ayan, s. 242}."
  id: "Abu al-Hajjaj Yusuf ibn Muhammad ibn Ibrahim al-Ansari al-Bayasi adalah salah satu tokoh terkemuka dan pengapal al-Andalus; seorang penulis terampil yang menguasai berbagai cabang bahasa Arab dalam puisi dan prosa, serta narator peristiwa, perang, dan hari-hari mereka. Ia menghafal buku Abu Tammam Al-Hamasah, Al-Sitta's Al-Sitta, Abu Tammam's Diwan, Al-Mutanabbi's Diwan, Al-Zand's Saqat, Al-Ma'Ma's Arri, dan lainnya. Ia melakukan perjalanan ke Andalusia, mengunjungi sebagian besar dari mereka, kemudian datang ke kota Tunis, di mana ia menyusun buku 'Al-I'lam bil-Harub al-Waqi'a fi Dawn al-Islam' karya Pangeran Abu Zakariya al-Hafsi, dimulai dengan pembunuhan Umar ibn al-Khattab dan berakhir dengan pemberontakan al-Walid ibn Tarif terhadap Harun al-Rashid. Ibn Khallikan mengulasnya dalam dua jilid dan menemukan kata-katanya berpengetahuan dalam seni {cite:Wafayat-Ayan, hlm. 238}. Ibn Khallikan melihat bukunya \"Al-Hamasah\" dalam dua jilid, dengan tulisannya dan tulisan tangannya. Di akhir, ia mengatakan bahwa penyelesaian komposisi dan penataannya terjadi di kota Tunis di Shawwal pada tahun 646 H. Ia menyebutkan dalam pengantarnya bahwa ia tidak menemukan klasifikasi atau susunan yang lebih baik daripada yang ditemukan Abu Tammam dalam Hamāsah-nya, sehingga ia mengikuti alirannya dan menggabungkan puisi dengan yang sesuai {cite:wafayat-ayan, hlm. 239}. Ia lahir pada tahun 573 H dan meninggal pada 653 H {cite:wafayat-ayan, hlm. 242}."
