summary:
  ar: "أبو العباس أحمد بن أبي أحمد المعروف بابن القاص الطبري، صاحب أبي العباس بن سريج، مات بطرسوس سنة خمس وثلاثين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وكان من أئمة أصحابنا، وصنف المصنفات الكثيرة، منها «المفتاح» و«أدب القاضي» و«المواقيت» و«التلخيص» الذي شرحه أبو عبد الله ختن الإسماعيلي {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وعنه أخذ الفقه أهل طبرستان {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  en: "Abu al-Abbas Ahmad ibn Abi Ahmad, known as Ibn al-Qass al-Tabari, a disciple of Abu al-Abbas ibn Surayj. He died at Tarsus in 335 {cite:tabaqat-fuqaha-abbas-1981 p. 58}. He was one of the leading imams of 'our companions' (the Shafi'i school) and wrote many works, among them al-Miftah, Adab al-Qadi, al-Mawaqit and al-Talkhis, which was commented on by Abu Abdallah, son-in-law of al-Isma'ili {cite:tabaqat-fuqaha-abbas-1981 p. 58}. The people of Tabaristan took jurisprudence from him {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
