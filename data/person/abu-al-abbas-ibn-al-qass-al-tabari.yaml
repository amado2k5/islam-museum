  ar: "أبو العباس أحمد بن أبي أحمد المعروف بابن القاص الطبري، صاحب أبي العباس بن سريج، مات بطرسوس سنة خمس وثلاثين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وكان من أئمة أصحابنا، وصنف المصنفات الكثيرة، منها «المفتاح» و«أدب القاضي» و«المواقيت» و«التلخيص» الذي شرحه أبو عبد الله ختن الإسماعيلي {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وعنه أخذ الفقه أهل طبرستان {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
