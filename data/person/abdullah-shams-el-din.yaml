summary:
  ar: "شاعر غنائي مصري (1921–1977)، تعلّم في الأزهر وعمل مستشارا ثقافيا بالمجلس الأعلى للشبان المسلمين. لُقّب بشاعر التوحيد، وكتب سنة 1956 نشيد «الله أكبر فوق كيد المعتدي» الذي صار فيما بعد نشيدا وطنيا لليبيا، ونال وسام الجمهورية من الطبقة الأولى."
  en: "Egyptian lyric poet (1921–1977), educated at al-Azhar, who served as cultural adviser to Egypt's Supreme Council for Muslim Youth. Nicknamed the 'Poet of Tawhid', he wrote the anthem 'Allah Akbar fawqa kayd al-mu'tadi' in 1956, which later served as Libya's national anthem, and received the Order of the Republic, first class."
  ur: "مصری غنائی شاعر (1921–1977)، جامعہ ازہر کے تعلیم یافتہ، جو مصر کی مجلسِ اعلیٰ برائے مسلم نوجوانان کے ثقافتی مشیر رہے۔ «شاعرِ توحید» کے لقب سے مشہور؛ 1956 میں لکھا گیا ان کا ترانہ «اللہ اکبر فوق کید المعتدی» بعد میں لیبیا کا قومی ترانہ بنا، اور انہیں وسامِ جمہوریہ درجہ اول ملا۔"
