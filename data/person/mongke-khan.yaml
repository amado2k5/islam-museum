summary:
  ar: "منكو، رابع الخانات العظام للإمبراطورية المغولية، وابن تولوي أصغر أبناء جنكيز خان. تولى العرش سنة 1251م بعد فترة نيابة طويلة، وبأمره سار أخوه هولاكو إلى الغرب فنشأت الدولة الإلخانية، وأرسل أخاه قبلاي إلى جنوب الصين. وتصفه دائرة المعارف الإسلامية بأنه ظل متعلقاً بالشامانية مع تسامحه مع أديان كثيرة {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  en: "Mongke was the fourth Great Khan of the Mongol Empire and a son of Tolui, Genghis Khan's youngest son. Enthroned in 1251 after a long interregnum, he sent his brother Hulagu west on the expedition that led to the Ilkhanate and his brother Kubilay against the Sung in the south of China. The Encyclopaedia of Islam says he stayed personally attached to Shamanism while tolerating a wide range of faiths {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  ur: "منگو منگول سلطنت کے چوتھے عظیم خان اور چنگیز خان کے سب سے چھوٹے بیٹے تولوئی کے فرزند تھے۔ طویل وقفے کے بعد 1251ء میں تخت نشین ہوئے، اور ان کے حکم سے ان کے بھائی ہلاکو مغرب کی طرف روانہ ہوئے جس سے ایل خانی سلطنت قائم ہوئی، جبکہ دوسرے بھائی قبلائی کو جنوبی چین میں سونگ سلطنت کی طرف بھیجا گیا۔ دائرۃ المعارف الاسلامیہ کے مطابق وہ ذاتی طور پر آبائی شمن مت سے وابستہ رہے مگر بہت سے مذاہب کے ساتھ رواداری برتتے تھے {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
