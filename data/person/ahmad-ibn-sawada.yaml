summary:
  ar: "أبو العباس، يعرف بخشيش، كوفي الأصل نزل بغداد وحدّث بها عن عبيدة بن حميد وزيد بن الحباب وغيرهما، روى عنه وكيع القاضي وقاسم المطرز؛ قال الدارقطني يُعتبر بحديثه ولا يُحتجّ به وقال الخطيب ما رأيت أحاديثه المستقيمة؛ وأنشد لنفسه منها: كن بذكر الله مشتغلًا، عن جميع الناس معتزلًا؛ فقال له الحمّاز أنت على السمع والطاعة، أصلحك الله، إن المتوكل بعث إليك بعشرة آلاف درهم فخذها فما لك؟ فأحصر الفتح وسكت وأسرّ من الفرح؛ وتوفى سنة ثمان وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 102}."
  en: "Abu'l-'Abbas 'Khashish', a Kufan settled at Baghdad who transmitted from 'Abida ibn Humayd and Zayd ibn al-Hubab; al-Daraqutni graded his hadith acceptable-but-not-probative. His renunciation verses so pleased al-Mutawakkil that he sent him ten thousand dirhams. He died in 258 {cite:muntazam-ibn-al-jawzi p. 102}."
