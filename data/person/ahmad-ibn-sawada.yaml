summary:
  ar: "أبو العباس، يعرف بخشيش، كوفي الأصل نزل بغداد وحدّث بها عن عبيدة بن حميد وزيد بن الحباب وغيرهما، روى عنه وكيع القاضي وقاسم المطرز؛ قال الدارقطني يُعتبر بحديثه ولا يُحتجّ به وقال الخطيب ما رأيت أحاديثه المستقيمة؛ وأنشد لنفسه منها: كن بذكر الله مشتغلًا، عن جميع الناس معتزلًا؛ فقال له الحمّاز أنت على السمع والطاعة، أصلحك الله، إن المتوكل بعث إليك بعشرة آلاف درهم فخذها فما لك؟ فأحصر الفتح وسكت وأسرّ من الفرح؛ وتوفى سنة ثمان وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 102}."
  en: "Abu'l-'Abbas 'Khashish', a Kufan settled at Baghdad who transmitted from 'Abida ibn Humayd and Zayd ibn al-Hubab; al-Daraqutni graded his hadith acceptable-but-not-probative. His renunciation verses so pleased al-Mutawakkil that he sent him ten thousand dirhams. He died in 258 {cite:muntazam-ibn-al-jawzi p. 102}."
  es: "Abu'l-'Abbas 'Khashish', un kufano afincado en Bagdad que transmitió hadices de 'Abida ibn Humayd y Zayd ibn al-Hubab, fue calificado por al-Daraqutni como aceptable pero no probatorio. Sus versículos sobre la renuncia complacieron tanto a al-Mutawakkil que le envió diez mil dirhams. Murió en el año 258 {cite:muntazam-ibn-al-jawzi p. 102}."
  fr: "Abu'l-'Abbas 'Khashish', un Koufa établi à Bagdad, transmit des hadiths d'Abida ibn Humayd et de Zayd ibn al-Hubab. Al-Daraqutni jugea ses hadiths acceptables mais non probants. Ses versets de renonciation plurent tellement à al-Mutawakkil que celui-ci lui envoya dix mille dirhams. Il mourut en 258 av. J.-C. (Voir Muntazam ibn al-Jawzi, p. 102)."
  ur: "ابو العباس 'خاشش'، ایک کوفان بغداد میں آباد تھا جس نے 'عبیدہ بن حمید اور زید ابن الحباب سے نقل کیا تھا۔ الدارقطنی نے اپنی حدیث کو قابل قبول لیکن احتمالی نہیں قرار دیا۔ متوکل کو اس کے ترک کی آیات نے اس قدر خوش کیا کہ اس نے اسے دس ہزار درہم بھیجے۔ ان کی وفات 258 میں ہوئی۔ 102}۔"
  tr: "Ebu el-Abbas, Haşiş olarak da bilinir, aslen Kufalıydı. Bağdat'a yerleşti ve orada Ubeyde ibn Hamid, Zeyd ibn el-Habab ve diğerlerinden hadis rivayet etti. Vaki el-Kadı ve Kasım el-Mutarriz ondan rivayet etmişlerdir. El-Daraqutni şöyle demiştir: Hadisleri güvenilir kabul edilir, ancak delil olarak kullanılmaz. El-Hatib şöyle demiştir: Onun sahih hadislerinden hiçbirini görmedim. Kendi dizelerinden bazılarını okudu: “Allah'ı anmakla meşgul ol, bütün insanlardan uzak dur.” El-Hammaz ona şöyle dedi: “Sen itaatkâr ve boyun eğen birisin, Allah seni hidayete erdirsin. El-Mutavakkil sana on bin dirhem gönderdi, al bunları, senin ne var?” El-Fath sustu ve içten içe memnun olarak sessiz kaldı. Hicri 258 yılında vefat etti. {cite:muntazam-ibn-al-jawzi s. 102}."
  id: "Abu al-Abbas, yang dikenal sebagai Khashish, berasal dari Kufa. Ia menetap di Baghdad dan meriwayatkan hadits di sana atas otoritas Ubaydah ibn Hamid, Zayd ibn al-Habab, dan lainnya. Waki’ al-Qadi dan Qasim al-Mutarriz meriwayatkan darinya. Al-Daraqutni berkata: Haditsnya dianggap dapat dipercaya tetapi tidak digunakan sebagai bukti. Al-Khatib berkata: Saya belum pernah melihat haditsnya yang sahih. Ia membacakan beberapa ayatnya sendiri: “Sibukkanlah diri dengan mengingat Allah, jauhkan diri dari semua manusia.” Al-Hammaz berkata kepadanya: “Engkau taat dan tunduk, semoga Allah membimbingmu. Al-Mutawakkil telah mengirimkan kepadamu sepuluh ribu dirham, maka ambillah, apa milikmu?” Al-Fath terdiam dan tetap diam, diam-diam merasa senang. Ia wafat pada tahun 258 H. {cite:muntazam-ibn-al-jawzi p. 102}."
