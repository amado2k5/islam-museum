summary:
  ar: بولا أجيبولا ⁦(1934–2023)⁩ قاضٍ نيجيري، عضو محكمة العدل الدولية ⁦(1991–1994)⁩، ونائب عام وزير عدل نيجيريا سابق ومفوضها السامي لدى بريطانيا، ومؤسس البعثة الإسلامية لأفريقيا وجامعة كريسنت؛ توفي 9 أبريل
    2023.
  en: Bola Ajibola ⁦(1934–2023)⁩ was a Nigerian jurist, judge of the International Court of Justice (1991–1994), former Nigerian attorney-general and minister of justice, High Commissioner to Britain, and
    founder of the Islamic Mission for Africa and Crescent University; he died on 9 April 2023.
  ur: بولا اجیبولا ⁦(1934–2023)⁩ نائجیرین قانون دان، بین الاقوامی عدالتِ انصاف ⁦(ICJ)⁩ کے جج ⁦(1991–1994)⁩، نائجیریا کے سابق اٹارنی جنرل و وزیرِ انصاف اور برطانیہ میں ہائی کمشنر تھے، اور اسلامک مشن فار
    افریقہ و کریسنٹ یونیورسٹی کے بانی؛ 9 اپریل 2023 کو وفات پائی۔
  es: "Bola Ajibola (1934–2023) fue un jurista nigeriano, juez de la Corte Internacional de Justicia (1991–1994), ex fiscal general y ministro de justicia de Nigeria, Alto Comisionado en Gran Bretaña y fundador de la Misión Islámica para África y de la Universidad Crescent; falleció el 9 de abril de 2023."
