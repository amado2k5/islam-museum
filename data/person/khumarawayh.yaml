id: person/khumarawayh
class: person
label: { ar: "خمارويه بن أحمد بن طولون" }
summary:
  ar: "ابن أحمد بن طولون، أقام على ولايات أبيه بعد موته سنة سبعين فولى الموفق ابنه أبا العباس أعماله وجهزه إلى مصر في جنود العراق فوقع بينهما وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}. وعند المسعودي هو أبو الجيش خمارويه بن أحمد بن طولون جدد العهد لنفسه بعد أبيه، وهزمه أبو العباس بن الموفق يوم وقعة الطواحين سنة إحدى وسبعين فأفلت في قواده إلى الفسطاط، وقلد أمر وزارته علي بن أحمد المادراني {cite:muruj-al-dhahab p. 579-580}، وعند المسعودي ذبح بدمشق في ذي القعدة سنة اثنتين وثمانين ومائتين وقد كان بنى في سفح الجبل أسفل من دير مروان قصراً كان يشرب فيه تلك الليلة وعنده طغج، وتولى ذبحه خادم من خدمهم فأتي بهم على أميال فمنهم من قتل وصلب ومنهم من شرح لحمه فأكلته السودان من مماليكه، وحمل في تابوت إلى مصر فتقدم القاضي أبو عبد الله محمد بن عبدة المعروف بالعبداني فصلى عليه على باب مصر، وقال قارئ كان يدلي به في القبر إنهم انتهوا في تلك الليلة من سورة الدخان إلى خذوه فاعتلوه إلى سواء الجحيم فخفضوا أصواتهم حياء ممن حضر {cite:muruj-al-dhahab p. 610-611}، وعند ابن الجوزي وفي سنة 282هـ ذبحه بعض خدمه على فراشه فولى بعده ابنه جيشاً فقتلوه وانتهبوا داره وأجلسوا أخاه هارون بن خمارويه فتقرر أنه يحمل إلى خزانة المعتضد في كل سنة ألف ألف دينار وخمسمائة ألف دينار {cite:muntazam-ibn-al-jawzi p. 155}، وعند ابن الجوزي وتزوج المعتضد بنته وقدمت بغداد سنة 282هـ ونودي في جانبيها ألا يعبر أحد دجلة يوم دخولها وغلقت أبواب الدروب التي تلي الشط ووكل بحافتي دجلة من يمنع الناس أن يظهروا في دورهم على الشط {cite:muntazam-ibn-al-jawzi p. 154-155}"
  en: "Ahmad ibn Tulun's son, who held his father's provinces after his death in 270; al-Muwaffaq appointed his own son Abu'l-Abbas over them and marched him on Egypt — a great battle ran the ground with blood, and victory was Egypt's {cite:tarikh-khulafa-minhaj-1434 p. 568}."
