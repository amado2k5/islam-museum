id: person/khumarawayh
class: person
label: { ar: "خمارويه بن أحمد بن طولون" }
summary:
  ar: "ابن أحمد بن طولون، أقام على ولايات أبيه بعد موته سنة سبعين فولى الموفق ابنه أبا العباس أعماله وجهزه إلى مصر في جنود العراق فوقع بينهما وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}. وعند المسعودي هو أبو الجيش خمارويه بن أحمد بن طولون جدد العهد لنفسه بعد أبيه، وهزمه أبو العباس بن الموفق يوم وقعة الطواحين سنة إحدى وسبعين فأفلت في قواده إلى الفسطاط، وقلد أمر وزارته علي بن أحمد المادراني {cite:muruj-al-dhahab p. 579-580}، وعند المسعودي ذبح بدمشق في ذي القعدة سنة اثنتين وثمانين ومائتين وقد كان بنى في سفح الجبل أسفل من دير مروان قصراً كان يشرب فيه تلك الليلة وعنده طغج، وتولى ذبحه خادم من خدمهم فأتي بهم على أميال فمنهم من قتل وصلب ومنهم من شرح لحمه فأكلته السودان من مماليكه، وحمل في تابوت إلى مصر فتقدم القاضي أبو عبد الله محمد بن عبدة المعروف بالعبداني فصلى عليه على باب مصر، وقال قارئ كان يدلي به في القبر إنهم انتهوا في تلك الليلة من سورة الدخان إلى خذوه فاعتلوه إلى سواء الجحيم فخفضوا أصواتهم حياء ممن حضر {cite:muruj-al-dhahab p. 610-611}، وعند ابن الجوزي وفي سنة 282هـ ذبحه بعض خدمه على فراشه فولى بعده ابنه جيشاً فقتلوه وانتهبوا داره وأجلسوا أخاه هارون بن خمارويه فتقرر أنه يحمل إلى خزانة المعتضد في كل سنة ألف ألف دينار وخمسمائة ألف دينار {cite:muntazam-ibn-al-jawzi p. 155}، وعند ابن الجوزي وتزوج المعتضد بنته وقدمت بغداد سنة 282هـ ونودي في جانبيها ألا يعبر أحد دجلة يوم دخولها وغلقت أبواب الدروب التي تلي الشط ووكل بحافتي دجلة من يمنع الناس أن يظهروا في دورهم على الشط {cite:muntazam-ibn-al-jawzi p. 154-155}"
  en: "Ahmad ibn Tulun's son, who held his father's provinces after his death in 270; al-Muwaffaq appointed his own son Abu'l-Abbas over them and marched him on Egypt — a great battle ran the ground with blood, and victory was Egypt's {cite:tarikh-khulafa-minhaj-1434 p. 568}. Ibn al-Jawzi gives his end under 282: some of his own servants slaughtered him on his bed, and the news reached Baghdad by post from Damascus in eleven days {cite:muntazam-ibn-al-jawzi p. 155}."
  es: "El hijo de Ahmad ibn Tulun, quien conservó las provincias de su padre tras su muerte en 270, fue nombrado por al-Muwaffaq su hijo Abu'l-Abbas y enviado a Egipto. Una gran batalla se libró con sangre, y la victoria fue para Egipto {cite:tarikh-khulafa-minhaj-1434 p. 568}. Ibn al-Jawzi relata su final en 282: algunos de sus sirvientes lo asesinaron en su cama, y la noticia llegó a Bagdad por correo desde Damasco en once días {cite:muntazam-ibn-al-jawzi p. 155}."
  fr: "Le fils d'Ahmad ibn Tulun, qui hérita des provinces de son père après sa mort en 270, fut nommé par al-Muwaffaq à la tête de ces provinces par son propre fils, Abu'l-Abbas, qui marcha sur l'Égypte. Une grande bataille sanglante s'ensuivit, et la victoire revint à l'Égypte (voir: Tarikh Khulafa Minhaj, 1434, p. 568). Ibn al-Jawzi relate sa mort en 282: certains de ses serviteurs l'assassinèrent sur son lit, et la nouvelle parvint à Bagdad par courrier depuis Damas en onze jours (voir: Muntazam Ibn al-Jawzi, p. 155)."
  ur: "احمد بن طولون کا بیٹا، جس نے 270 میں اپنی وفات کے بعد اپنے والد کے صوبوں پر قبضہ کیا۔ الموفق نے اپنے بیٹے ابو العباس کو ان پر مقرر کیا اور اس کو مصر پر چڑھایا - ایک عظیم جنگ زمین پر خون کے ساتھ چلی اور فتح مصر کی ہوئی۔ 568}۔ ابن الجوزی 282 کے تحت اس کا انجام بتاتے ہیں: اس کے اپنے ہی چند خادموں نے اسے اس کے بستر پر ذبح کر دیا اور یہ خبر گیارہ دنوں میں دمشق سے ڈاک کے ذریعے بغداد پہنچ گئی۔ 155}۔"
  tr: "İbn Ahmed ibn Tulun, babasının yetmişinci yılında ölümünden sonra valiliğini yönetti. El-Muvaffaq, oğlu Ebu el-Abbas'ı komutan olarak atadı ve Irak askerleriyle birlikte Mısır'a hazırlandı. Aralarında büyük bir savaş çıktı, yerde kan döküldü ve zafer Mısırlıların lehine oldu {atıf:Tarikh-khulafa-minhaj-1434, s. 568}. al-Mas'udi'ye göre, babasından sonra yemini yenileyen Ebu el-Ceyş Humarawayh ibn Ahmed ibn Tulun'dur. Ebu el-Abbas ibn el-Muvaffaq, 71 yılında Değirmen Savaşı günü onu yendi ve o da komutanlarıyla birlikte Fustat'a kaçtı. Ali ibn Ahmed el-Medreni vezirliğini emanet etti {atıf:Muruj-al-Dhahab s. 579-580}. El-Mes'udi'ye göre, 282 Hicri yılında Şam'da Zhudah sırasında katledildi. Mervan Manastırı'nın altındaki dağ yamacında bir saray inşa etti, o gece burada içti ve bir tuğac yaptı, ardından bir hizmetçi katliamını üstlendi Onlara hizmet edenler kilometrelerce uzaklara götürüldü; bazıları öldürüldü ve çarmıha gerildi, bazıları kesildi ve Sudan onları Memlüklerinden yedi. Bir tabutta Mısır'a taşındı; burada Hakim Ebu Abdullah Muhammed bin Abdani, yani El-Abdani, Mısır kapısında onun için dua etti. Mezarda onu okurken bir şiir şöyle dedi: O gece Dukhan Suresi'nden 'Onu alın ve oradakilerin önünde utançtan seslerini alçaltarak cehennemin kenarına taşıdılar.' {alıntı: Muruj-al-Dhahab s. 610-611} ve İbn al-Jawzi'ye göre, 282 Hicri yılında, bazı hizmetkarları onu yatağında katletti, ardından oğlu onu öldürmek, evini yağmalamak ve kardeşi Harun ibn Khumarawayh'i oturtmak için ordu topladı. Her yıl bin beş yüz bin dinar al-Mu'tadid'in hazinesine getirilmesine karar verildi {cite:Muntazam-ibn-al-Jawzi s. 155}. İbn al-Jawzi'ye göre, al-Mu'tadid kızı Bağdat'la evlendi ve Bağdat 282 Hile geldi ve her iki taraftan da Dicle'in giriş gününde kimsenin geçmemesi gerektiği ilan edildi. Nehir ötesindeki yolların kapıları kapatıldı ve Dicle kıyıları emanet edildi İnsanların sırayla sahilde ortaya çıkmasını engelleyen {atıf:Muntazam-ibn-al-Jawzi s. 154-155}"
  id: "Ibn Ahmad ibn Tulun memerintah pemerintahan ayahnya setelah kematiannya pada tahun tujuh puluh. Al-Muwaffaq menunjuk putranya Abu al-Abbas sebagai komandannya dan bersiap menuju Mesir bersama tentara Irak. Pertempuran besar terjadi di antara mereka, menyebabkan darah di tanah, dan kemenangan diraih oleh orang Mesir {cite:Tarikh-khulafa-minhaj-1434, hlm. 568}. Menurut al-Mas'udi, ia adalah Abu al-Jaish Khumarawayh ibn Ahmad ibn Tulun yang memperbarui janjinya setelah ayahnya. Abu al-Abbas ibn al-Muwaffaq mengalahkannya pada hari Pertempuran Kincir pada tahun 71, dan ia melarikan diri bersama para komandannya ke Fustat. Ali ibn Ahmad al-Madrani mempercayakan jabatan wazirnya {cite:muruj-al-dhahab hlm. 579-580}. Menurut al-Mas'udi, ia dibantai di Damaskus dalam Dhu al-Qi'dah pada tahun 282 H. Ia membangun sebuah istana di lereng gunung di bawah Biara Marwan, tempat ia minum malam itu dan melakukan tughaj, dan seorang pelayan mengambil alih pembantaiannya Mereka yang melayani mereka dibawa jauh; beberapa dibunuh dan disalib, beberapa diputus, dan Sudan memakan mereka dari Mamluk mereka. Dia dibawa dalam peti mati ke Mesir, di mana Hakim Abu Abdullah Muhammad ibn Abdani, yang dikenal sebagai Al-Abdani, maju dan berdoa untuknya di gerbang Mesir. Seorang pembaca yang membacanya di makam berkata: Malam itu mereka selesai dari Surah Ad-Dukhan untuk 'Tangkap dia, dan mereka membawanya ke tepi Neraka, menurunkan suara mereka karena malu di hadapan yang hadir.' {kutip: Muruj-al-Dhahab hlm. 610-611}, dan menurut Ibn al-Jawzi, pada tahun 282 H, beberapa pelayannya membantunya di tempat tidur, sehingga putranya kemudian mengumpulkan pasukan untuk membunuhnya, menjarah rumahnya, dan menempatkan saudaranya Harun ibn Khumarawayh. Diputuskan bahwa ia akan dibawa ke kas al-Mu'tadid setiap tahun seribu lima ratus ribu dinar {cite:muntazam-ibn-al-jawzi hlm. 155}. Menurut Ibn al-Jawzi, al-Mu'tadid menikahi putrinya, Baghdad tiba pada tahun 282 H, dan diumumkan dari kedua belah pihak bahwa tidak ada yang boleh menyeberangi Sungai Tigris pada hari masuknya. Gerbang jalan di seberang sungai ditutup, dan tepi Sungai Tigris dipercayakan Siapa yang mencegah orang muncul di pantai {cite:muntazam-ibn-al-jawzi hlm. 154-155}"
