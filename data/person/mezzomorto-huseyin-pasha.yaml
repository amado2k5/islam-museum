  es: "Mezzomorto Hüseyin Pasha"
  fr: "Mezzomorto Hüseyin Pasha"
summary:
  ar: "حسين باشا الملقب «مزومورتو» ⁦(نصف الميت بالإيطالية)⁩؛ من بكوات البحر، قبطان السفن ثم بيلربي الجزائر، وتولى منصة القبطان باشا ⁦(قبضان-ı دريا)⁩ سنة ١١٠١هـ/١٦٨٩م ثم أُعفي فعاد إليها ثانية في محرم ١١٠٧هـ/١٦٩٥م، ومات وهو في المنصب سنة ١١١٣هـ/١٧٠١م؛ يصفه «سجلي عثماني» بالشجاعة والغيرة على الدولة {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  en: "Hüseyin Pasha, nicknamed 'Mezzomorto' (half-dead in Italian); one of the sea-beys, captain of galleons then beylerbey of Algiers, raised to kapudan-ı derya in 1101/1689–90, dismissed, then returned a second time in Muharram 1107/1695 and died in office in 1113/1701 — the Sicill-i Osmani calls him 'courageous and zealous' {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  ur: "حسین پاشا ملقب «میزومورتو» ⁦(اطالوی میں نیم مردہ)⁩؛ دریائی بکوں میں سے، جہازوں کا قبطان پھر الجزائر کا بیلربی، سنہ ١١٠١ھ/١٦٨٩ء میں قبطانِ دریا مقرر ہوا، معزول ہو کر محرم ١١٠٧ھ/١٦٩٥ء میں دوسری بار اسی منصب پر آیا اور ١١١٣ھ/١٧٠١ء میں منصب پر ہی فوت ہوا؛ سجلی عثمانی اسے بہادر اور جوشیلا کہتا ہے {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  es: "Hüseyin Pasha, apodado 'Mezzomorto' (medio muerto en italiano); uno de los beys del mar, capitán de galeones y luego beylerbey de Argel, ascendido a kapudan-ı derya en 1101/1689–90, destituido, luego regresado por segunda vez en Muharram 1107/1695 y murió en el cargo en 1113/1701 — el Sicill-i Osmani lo llama 'valiente y celoso' {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  fr: "Hüseyin Pacha, surnommé « Mezzomorto » (à moitié mort en italien); l'un des beys de la mer, capitaine de galions puis beylerbey d'Alger, élevé au rang de kapudan-ı derya en 1101/1689-90, destitué, puis réintégré une seconde fois en Muharram 1107/1695 et mort en fonction en 1113/1701 — le Sicill-i Osmani le qualifie de « courageux et zélé » {cite: sicill-i-osmani vol. 3, « Hüseyin Paşa (Mezemorta) »}."
  tr: "Hüseyin Paşa, lakabı 'Mazumurta' (İtalyanca'da 'Yarı Ölü'); denizin bekwatlarından biri, daha sonra Cezayir'de gemi kaptanı oldu. 1101 H/1689 yılında Kaptan Paşa (Qesdan-ı Darya) görevini üstlendi, ardından görevden alındı ve 1107 H/1695 yılında Muharrem'de tekrar oraya döndü. 1113 H/1701 yılında görevdeyken öldü; 'Osmanlı Sagilli' onu devlet için cesur ve gayretli biri olarak tanımlar {atıf:sicill-i-osmani cilt 3, 'Hüseyin Paşa (Mezemorta)'}."
  id: "Hussein Pasha, dijuluki 'Mazumurta' ('Setengah Mati' dalam bahasa Italia); salah satu Bekwat laut, kapten kapal kemudian di Aljazair. Ia mengambil posisi kapten Pasha (Qesdan-ı Darya) pada tahun 1101 H/1689 M, kemudian diberhentikan dan kembali ke sana lagi pada Muharram 1107 H/1695 M. Ia meninggal saat menjabat pada tahun 1113 H/1701 M; 'Sagilli Ottoman' menggambarkannya sebagai pemberani dan bersemangat untuk negara {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
