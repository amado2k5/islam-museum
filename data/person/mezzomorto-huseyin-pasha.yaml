label:
  ar: "حسين باشا مزومورتو"
  en: "Mezzomorto Hüseyin Pasha"
  ur: "حسین پاشا میزومورتو"
summary:
  ar: "حسين باشا الملقب «مزومورتو» (نصف الميت بالإيطالية)؛ من بكوات البحر، قبطان السفن ثم بيلربي الجزائر، وتولى منصة القبطان باشا (قبضان-ı دريا) سنة ١١٠١هـ/١٦٨٩م ثم أُعفي فعاد إليها ثانية في محرم ١١٠٧هـ/١٦٩٥م، ومات وهو في المنصب سنة ١١١٣هـ/١٧٠١م؛ يصفه «سجلي عثماني» بالشجاعة والغيرة على الدولة {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  en: "Hüseyin Pasha, nicknamed 'Mezzomorto' (half-dead in Italian); one of the sea-beys, captain of galleons then beylerbey of Algiers, raised to kapudan-ı derya in 1101/1689–90, dismissed, then returned a second time in Muharram 1107/1695 and died in office in 1113/1701 — the Sicill-i Osmani calls him 'courageous and zealous' {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
  ur: "حسین پاشا ملقب «میزومورتو» (اطالوی میں نیم مردہ)؛ دریائی بکوں میں سے، جہازوں کا قبطان پھر الجزائر کا بیلربی، سنہ ١١٠١ھ/١٦٨٩ء میں قبطانِ دریا مقرر ہوا، معزول ہو کر محرم ١١٠٧ھ/١٦٩٥ء میں دوسری بار اسی منصب پر آیا اور ١١١٣ھ/١٧٠١ء میں منصب پر ہی فوت ہوا؛ سجلی عثمانی اسے بہادر اور جوشیلا کہتا ہے {cite:sicill-i-osmani vol. 3, 'Hüseyin Paşa (Mezemorta)'}."
