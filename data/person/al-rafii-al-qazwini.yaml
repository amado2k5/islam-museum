summary:
  ar: "عبد الكريم بن محمد بن عبد الكريم، أبو القاسم الرافعي القزويني، فقيه من كبار الشافعية صاحب «فتح العزيز في شرح الوجيز»، كان له مجلس بقزوين للتفسير والحديث وتوفي فيها؛ توفي سنة 623 هـ، الموافقة 1226 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
  en: "Abd al-Karim ibn Muhammad ibn Abd al-Karim, Abu al-Qasim al-Rafi'i al-Qazwini, one of the great Shafi'i jurists and author of Fath al-Aziz fi Sharh al-Wajiz, who held a session at Qazwin for exegesis and hadith and died there; al-Zirikli prints 557-623 AH, 1162-1226 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
