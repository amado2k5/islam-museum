summary:
  ar: "عبد الكريم بن محمد بن عبد الكريم، أبو القاسم الرافعي القزويني، فقيه من كبار الشافعية صاحب «فتح العزيز في شرح الوجيز»، كان له مجلس بقزوين للتفسير والحديث وتوفي فيها؛ توفي سنة 623 هـ، الموافقة 1226 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
  en: "Abd al-Karim ibn Muhammad ibn Abd al-Karim, Abu al-Qasim al-Rafi'i al-Qazwini, one of the great Shafi'i jurists and author of Fath al-Aziz fi Sharh al-Wajiz, who held a session at Qazwin for exegesis and hadith and died there; al-Zirikli prints 557-623 AH, 1162-1226 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
  fr: "Abd al-Karim ibn Muhammad ibn Abd al-Karim, Abu al-Qasim al-Rafi'i al-Qazwini, l'un des grands juristes chaféites et auteur de Fath al-Aziz fi Sharh al-Wajiz, qui a tenu une session à Qazwin pour exégèse et hadith et y est mort ; al-Zirikli imprime 557-623 de l’hégire, 1162-1226 de notre ère {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
  es: "Abd al-Karim ibn Muhammad ibn Abd al-Karim, Abu al-Qasim al-Rafi'i al-Qazwini, uno de los grandes juristas shafi'íes y autor de Fath al-Aziz fi Sharh al-Wajiz, quien impartió clases en Qazwin sobre exégesis y hadices y murió allí; al-Zirikli imprime 557-623 AH, 1162-1226 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 55}."
  ur: "عبد الکریم بن محمد بن عبد الکریم، ابو القاسم الرفاعی القزوینی، ایک عظیم شافعی فقہاء اور فتح العزیز فی شرح الوجیز کے مصنف، جنہوں نے تفسیر اور حدیث کے لیے قزوین میں ایک اجلاس منعقد کیا اور وہیں وفات پائی۔ الزرکلی مطبوعہ 557-623 ہجری، 1162-1226 عیسوی 4ص 55}۔"
