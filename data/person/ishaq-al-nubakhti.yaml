id: person/ishaq-al-nubakhti
class: person
label: { ar: "إسحاق بن إسماعيل النوبختي" }
summary:
  ar: "الذي أشار بخلافة القاهر فقتله القاهر ألقاه على رأسه في بئر وطمت وذنبه أنه زايد القاهر قبل الخلافة في جارية واشتراها فحقد عليه {cite:tarikh-khulafa-minhaj-1434 p. 598-599}."
  en: "The man who had proposed al-Qahir's caliphate; al-Qahir killed him — dropped headfirst into a well that was filled in — his offence: having once outbid the future caliph for a slave-girl {cite:tarikh-khulafa-minhaj-1434 p. 598-599}."
  es: "El hombre que había propuesto el califato de al-Qahir; al-Qahir lo mató — lo arrojó de cabeza a un pozo que estaba lleno — su delito: haber superado una vez la oferta del futuro califa por una esclava {cite:tarikh-khulafa-minhaj-1434 p. 598-599}."
  fr: "L'homme qui avait proposé le califat d'al-Qahir; al-Qahir le tua — le jeta la tête la première dans un puits qui fut comblé — son crime: avoir une fois surenchéri sur le futur calife pour une esclave {cite:tarikh-khulafa-minhaj-1434 p. 598-599}."
  ur: "وہ شخص جس نے القاہر کی خلافت کی تجویز پیش کی تھی۔ القاہر نے اسے قتل کر دیا - پہلے ایک بھرے ہوئے کنویں میں سر ڈالا - اس کا جرم: ایک بار ایک لونڈی کے لیے مستقبل کے خلیفہ سے آگے نکل جانا۔ 598-599}۔"
  tr: "el-Kahir halifeliğini önerdi, ancak el-Kahir onu öldürdü, kafasının üstüne bir kuyuya attı ve suçu Zayed al-Kahir'in halifeliği bir köle kızla kabul edip satın alması oldu, bu yüzden ondan nefret etti {atıf:Tarikh-khulafa-minhaj-1434, s. 598-599}."
  id: "yang menyarankan kekhalifahan al-Qahir, tetapi al-Qahir membunuhnya, melemparkannya ke dalam sumur dengan kepala terlentang, dan kesalahannya adalah Zayed al-Qahir menerima kekhalifahan dalam bentuk budak perempuan dan membelinya, sehingga ia membencinya {cite:Tarikh-khulafa-minhaj-1434, hlm. 598-599}."
