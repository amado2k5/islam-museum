summary:
  ar: "ملك الأردن من اغتيال أبيه عبد الله الأول سنة 1951 حتى تنحّيه القسري سنة 1952. وُلد في مكة سنة 1909 أكبر أبناء عبد الله بن الحسين، وتدرّب ضابطا في الفيلق العربي وساندهيرست، وخلف أباه فمنح الأردن دستوره الحديث سنة 1952 جاعلا الحكومة مسؤولة أمام البرلمان، ثم أُجبر بعد أقل من ثلاثة عشر شهرا على التنحّي بسبب مرضه النفسي، وقضى بقية حياته في مصحّ بإسطنبول حتى وفاته سنة 1972."
  en: "King of Jordan from the assassination of his father Abdullah I in 1951 until his forced abdication in 1952. Born in Mecca in 1909, the eldest son of Abdullah bin Hussein, he trained as an officer in the Arab Legion and at Sandhurst, succeeded his father and gave Jordan its modern constitution of 1952, which made the government responsible to parliament, then was forced to abdicate after less than thirteen months because of mental illness, spending the rest of his life at a sanatorium in Istanbul until his death in 1972."
  ur: "1951ء میں اپنے والد عبداللہ اول کے قتل سے لے کر 1952ء میں جبری دستبرداری تک اردن کے بادشاہ۔ 1909ء میں مکہ میں عبداللہ بن حسین کے بڑے بیٹے پیدا ہوئے، عرب لیجن اور سینڈہرسٹ میں افسر کی تربیت پائی، والد کے جانشین بنے اور اردن کو 1952ء کا جدید آئین دیا جس نے حکومت کو پارلیمان کے سامنے جوابدہ بنایا، پھر ذہنی بیماری کے سبب تیرہ ماہ سے کم عرصے میں دستبردار ہونے پر مجبور ہوئے اور باقی زندگی استنبول کے ایک شفاخانے میں گزار کر 1972ء میں وفات پائی۔"
