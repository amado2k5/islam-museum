summary:
  ar: "محدث وأديب، كان الجاحظ خاله، روى عن مرضه الأخير أنه قال أنا في علة متناقضة من مكانين من الأسقام والدين وأن عمره نيف وسبعون سنة، وكان يموت لا يعود مريضاً خوفاً من أن يتطير باسمه، سكن طبرية من بلاد الأردن بعد الثلثمائة وله ولد مهلهل شاعر مجيد سنة اثنتين وثلاثين وثلثمائة {cite:muruj-al-dhahab p. 569-570}."
  en: "The Basran littérateur, al-Jahiz's nephew, who never visited the sick lest they take omen from his name 'he dies' {cite:muruj-al-dhahab p. 569-570}."
  es: "El literato de Basora, sobrino de al-Jahiz, que nunca visitaba a los enfermos para que no interpretaran su nombre como un presagio de muerte {cite:muruj-al-dhahab p. 569-570}."
  fr: "Le littérateur de Basran, le neveu d'al-Jahiz, qui ne visitait jamais les malades de peur qu'ils ne tirent de son nom le présage « il meurt » {cite: muruj-al-dhahab p. 569-570}."
  ur: "بصران کے ادیب، الجحیز کا بھتیجا، جو کبھی بیمار کی عیادت نہیں کرتا تھا کہ کہیں وہ اس کے نام سے شگون نہ لے لیں 'وہ مر جائے'۔ 569-570}۔"
  tr: "Bir hadis alimi ve yazar olan El-Cahiz, annesinin amcasıydı. Son hastalığı hakkında, 'İki farklı hastalık ve din yerinden gelen çelişkili bir hastalıktan muzdaripim' dediğini ve yetmiş yaşından büyük olduğunu anlattı. Ölüyordu ve adının kaybolmasından korktuğu için hasta olarak geri dönmedi. 300 Hicri'den sonra Ürdün topraklarındaki Tiberya'ya yerleşti ve 332 Hicri yılında görkemli bir şair olan Muhalhal adında bir oğlu oldu {atıf:Muruj-al-Dhahab, s. 569-570}."
  id: "Seorang ulama hadis dan penulis, Al-Jahiz adalah pamannya dari pihak ibu. Ia menceritakan tentang penyakit baru-baru ini bahwa ia berkata, 'Saya menderita penyakit yang bertentangan dari dua tempat penyakit dan agama,' dan bahwa usianya sudah lebih dari tujuh puluh tahun. Ia sedang sekarat dan tidak kembali sakit karena takut namanya hilang. Ia menetap di Tiberias, tanah Yordania, setelah tahun 300 H dan memiliki seorang putra bernama Muhalhal, seorang penyair mulia, pada tahun 332 H {cite:muruj-al-dhahab, hlm. 569-570}."
