summary:
  ar: "الشيخ إبراهيم الشاذلي المصري — من شيوخ المتصوفة المشهورين بمصر عند السلطان قانصوه الغوري الذي كان يعتقد فيه كل الاعتقاد؛ كان له الإنفاق على الناس من الغيب بكثرة، وتربى بالتربية البيتية على الشيخ أبي المواهب التونسي صاحب القوانين، وكان مجمعاً بين التربيتين، وكان حظه منهما نصيبٌ لما يشبه ذلك باخترام الأعمار من الملوك، وظهر لكثير من أهل الورع والشفقة، وكان لا يسلم من دعائه شرٌّ؛ توفي سنة أربع عشرة وتسعمائة {cite:shadharat-dhahab p. 466}."
  en: "Al-Ghuri's trusted shaykh — 'fed people abundantly from the unseen', formed in the Baytiyya way under Abu al-Mawahib al-Tunisi the Qawanin author, yet combined both disciplines; the kings of the age vied for him; d. 914 {cite:shadharat-dhahab p. 466}."
  es: "El shaykh de confianza de Al-Ghuri: «alimentó a la gente abundantemente de lo invisible», se formó a la manera Baytiyya bajo Abu al-Mawahib al-Tunisi, el autor Qawanin, pero combinó ambas disciplinas; los reyes de la época compitieron por él; d. 914 {cita: shadharat-dhahab p. 466}."
  fr: "Le shaykh de confiance d'Al-Ghuri — « nourrissait abondamment les gens de l'invisible », formé à la manière de Baytiyya sous Abu al-Mawahib al-Tunisi, l'auteur de Qawanin, combinait pourtant les deux disciplines; les rois de l'époque se disputaient pour lui; d. 914 {citer: shadharat-dhahab p. 466}."
  ur: "الغوری کے قابل اعتماد شیخ - 'لوگوں کو غیب سے کثرت سے کھانا کھلاتے ہیں'، جو ابو المواحب التونیسی قوانین مصنف کے تحت بیتیہ کے طریقے سے تشکیل دیا گیا تھا، پھر بھی دونوں شعبوں کو یکجا کرتا تھا۔ زمانے کے بادشاہوں نے اُس کے لیے مقابلہ کیا۔ d 914 {حوالہ: شدارت ذہاب صفحہ 466}۔"
