summary:
  ar: "الشيخ إبراهيم الشاذلي المصري — من شيوخ المتصوفة المشهورين بمصر عند السلطان قانصوه الغوري الذي كان يعتقد فيه كل الاعتقاد؛ كان له الإنفاق على الناس من الغيب بكثرة، وتربى بالتربية البيتية على الشيخ أبي المواهب التونسي صاحب القوانين، وكان مجمعاً بين التربيتين، وكان حظه منهما نصيبٌ لما يشبه ذلك باخترام الأعمار من الملوك، وظهر لكثير من أهل الورع والشفقة، وكان لا يسلم من دعائه شرٌّ؛ توفي سنة أربع عشرة وتسعمائة {cite:shadharat-dhahab p. 466}."
  en: "Al-Ghuri's trusted shaykh — 'fed people abundantly from the unseen', formed in the Baytiyya way under Abu al-Mawahib al-Tunisi the Qawanin author, yet combined both disciplines; the kings of the age vied for him; d. 914 {cite:shadharat-dhahab p. 466}."
