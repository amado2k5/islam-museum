summary:
  ar: "سيدي المختار بن أحمد الكنتي (1729-1811)، المعروف بالشيخ الكبير، عالم بارز في الطريقة القادرية في السودان الغربي ومن أهم ناشري الإسلام في غرب أفريقيا. وُلد في منطقة إرغ أورالا شمال مبروك بمالي في قبيلة كنتة العلمية المنتمية إلى الزوايا، ومات أبوه وهو في العاشرة فتولى أقاربه وأساتذة من أروان تعليمه، وكان شيخه الأبرز سيدي علي بن النجيب القادري، فخلفه في المشيخة وجعل مقره في أزواد شمال شرق تمبكتو. صار المرجع الروحي لمنطقة منعطف النيجر كلها: وسّط بين القبائل المتنازعة ولا سيما كنتة والبرابيش والطوارق، ودرّس وكاتب العلماء من كانم-برنو إلى الأطلسي، وقيل إنه كتب ثلاثمائة رسالة، ورأى نفسه مجددا، ودرّس عثمان دان فوديو وأيّد جهاده الذي قامت عليه خلافة سقطرى. توفي سنة 1811 عن اثنين وثمانين عاما فخلفه ابنه محمد ثم حفيده أحمد البكاي."
  en: "Sidi al-Mukhtar ibn Ahmad al-Kunti (1729–1811), known as al-Shaykh al-Kabir, leading scholar of the Qadiriyya in the Western Sudan and one of the principal promoters of Islam in West Africa. He was born in the Erg Oralla region north of Mabrouk, Mali, into the scholarly Kunta tribe of the Zawaya; his father died when he was ten, relatives and teachers of Araouane educated him, and his main teacher was the Qadiri Sidi Ali bin al-Najib, whom he succeeded as shaykh, making his base at Azawad north-east of Timbuktu. He became the recognised spiritual leader of the whole Niger Bend region: he mediated between feuding tribes, above all the Kunta, the Barabish and the Tuareg, taught and corresponded with scholars from Kanem-Bornu to the Atlantic, was said to have written three hundred treatises, saw himself as a mujaddid, taught Usman dan Fodio and backed the jihad that founded the Sokoto Caliphate. He died in 1811 aged 82 and was succeeded by his son Muhammad and then his grandson Ahmed al-Bakkay."
  ur: "سیدی المختار بن احمد الکُنتی (1729ء–1811ء)، جو الشیخ الکبیر کے لقب سے معروف ہیں، مغربی سوڈان میں سلسلہ قادریہ کے ممتاز عالم اور مغربی افریقا میں اسلام کی اشاعت کی اہم ترین شخصیات میں سے تھے۔ مالی کے مبروک کے شمال میں ارغ اورالا کے علاقے میں علمی قبیلہ کنتہ میں پیدا ہوئے، دس برس کی عمر میں والد کا سایہ اٹھ گیا تو رشتہ داروں اور اروان کے اساتذہ نے تعلیم دی، ان کے بڑے شیخ سیدی علی بن النجیب قادری تھے جن کے جانشین بنے اور تمبکٹو کے شمال مشرق ازواد کو اپنا مرکز بنایا۔ وہ پورے دریائے نائجر کے موڑ کے علاقے کے روحانی مرجع بن گئے: قبائل خصوصاً کنتہ، برابیش اور طوارق کے درمیان صلح کرائی، کانم-بورنو سے بحر اوقیانوس تک کے علما سے خط کتابت رکھی، کہتے ہیں تین سو رسائل لکھے، خود کو مجدد سمجھتے تھے، عثمان دان فودیو کو پڑھایا اور ان کے جہاد کی حمایت کی جس پر خلافت سقطرٰی قائم ہوئی۔ 1811ء میں 82 برس کی عمر میں وفات پائی، بیٹے محمد اور پھر پوتے احمد البکای جانشین ہوئے۔"
