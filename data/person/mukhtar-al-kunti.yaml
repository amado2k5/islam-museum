summary:
  ar: "سيدي المختار بن أحمد الكنتي (1729-1811)، المعروف بالشيخ الكبير، عالم بارز في الطريقة القادرية في السودان الغربي ومن أهم ناشري الإسلام في غرب أفريقيا. وُلد في منطقة إرغ أورالا شمال مبروك بمالي في قبيلة كنتة العلمية المنتمية إلى الزوايا، ومات أبوه وهو في العاشرة فتولى أقاربه وأساتذة من أروان تعليمه، وكان شيخه الأبرز سيدي علي بن النجيب القادري، فخلفه في المشيخة وجعل مقره في أزواد شمال شرق تمبكتو. صار المرجع الروحي لمنطقة منعطف النيجر كلها: وسّط بين القبائل المتنازعة ولا سيما كنتة والبرابيش والطوارق، ودرّس وكاتب العلماء من كانم-برنو إلى الأطلسي، وقيل إنه كتب ثلاثمائة رسالة، ورأى نفسه مجددا، ودرّس عثمان دان فوديو وأيّد جهاده الذي قامت عليه خلافة سقطرى. توفي سنة 1811 عن اثنين وثمانين عاما فخلفه ابنه محمد ثم حفيده أحمد البكاي."
  en: "Sidi al-Mukhtar ibn Ahmad al-Kunti (1729–1811), known as al-Shaykh al-Kabir, leading scholar of the Qadiriyya in the Western Sudan and one of the principal promoters of Islam in West Africa. He was born in the Erg Oralla region north of Mabrouk, Mali, into the scholarly Kunta tribe of the Zawaya; his father died when he was ten, relatives and teachers of Araouane educated him, and his main teacher was the Qadiri Sidi Ali bin al-Najib, whom he succeeded as shaykh, making his base at Azawad north-east of Timbuktu. He became the recognised spiritual leader of the whole Niger Bend region: he mediated between feuding tribes, above all the Kunta, the Barabish and the Tuareg, taught and corresponded with scholars from Kanem-Bornu to the Atlantic, was said to have written three hundred treatises, saw himself as a mujaddid, taught Usman dan Fodio and backed the jihad that founded the Sokoto Caliphate. He died in 1811 aged 82 and was succeeded by his son Muhammad and then his grandson Ahmed al-Bakkay."
  ur: "سیدی المختار بن احمد الکُنتی ⁦(1729ء–1811ء)⁩، جو الشیخ الکبیر کے لقب سے معروف ہیں، مغربی سوڈان میں سلسلہ قادریہ کے ممتاز عالم اور مغربی افریقا میں اسلام کی اشاعت کی اہم ترین شخصیات میں سے تھے۔ مالی کے مبروک کے شمال میں ارغ اورالا کے علاقے میں علمی قبیلہ کنتہ میں پیدا ہوئے، دس برس کی عمر میں والد کا سایہ اٹھ گیا تو رشتہ داروں اور اروان کے اساتذہ نے تعلیم دی، ان کے بڑے شیخ سیدی علی بن النجیب قادری تھے جن کے جانشین بنے اور تمبکٹو کے شمال مشرق ازواد کو اپنا مرکز بنایا۔ وہ پورے دریائے نائجر کے موڑ کے علاقے کے روحانی مرجع بن گئے: قبائل خصوصاً کنتہ، برابیش اور طوارق کے درمیان صلح کرائی، کانم-بورنو سے بحر اوقیانوس تک کے علما سے خط کتابت رکھی، کہتے ہیں تین سو رسائل لکھے، خود کو مجدد سمجھتے تھے، عثمان دان فودیو کو پڑھایا اور ان کے جہاد کی حمایت کی جس پر خلافت سقطرٰی قائم ہوئی۔ 1811ء میں 82 برس کی عمر میں وفات پائی، بیٹے محمد اور پھر پوتے احمد البکای جانشین ہوئے۔"
  es: "Sidi al-Mukhtar ibn Ahmad al-Kunti (1729-1811), conocido como al-Shaykh al-Kabir, fue un destacado erudito de la escuela Qadiriyya en Sudán Occidental y uno de los principales promotores del Islam en África Occidental. Nació en la región de Erg Oralla, al norte de Mabrouk, en Malí, en el seno de la tribu Kunta, de gran erudición, perteneciente a la tribu Zawaya. Su padre falleció cuando él tenía diez años, y fue educado por familiares y maestros de Araouane. Su principal maestro fue el Qadiri Sidi Ali bin al-Najib, a quien sucedió como shaykh, estableciendo su base en Azawad, al noreste de Tombuctú. Se convirtió en el líder espiritual reconocido de toda la región del recodo del Níger: medió entre tribus enfrentadas, sobre todo los Kunta, los Barabish y los Tuareg; enseñó y mantuvo correspondencia con eruditos desde Kanem-Bornu hasta el Atlántico; se dice que escribió trescientos tratados; se consideraba un mujaddid; fue maestro de Usman dan Fodio y apoyó la yihad que fundó el Califato de Sokoto. Murió en 1811 a los 82 años y fue sucedido por su hijo Muhammad y luego por su nieto Ahmed al-Bakkay."
  fr: "Sidi al-Mukhtar ibn Ahmad al-Kunti (1729-1811), connu sous le nom d'al-Shaykh al-Kabir, éminent érudit de la Qadiriyya au Soudan occidental et l'un des principaux promoteurs de l'islam en Afrique de l'Ouest. Né dans la région d'Erg Oralla, au nord de Mabrouk (Mali), au sein de la tribu savante Kunta des Zawaya, il perdit son père à l'âge de dix ans. Son éducation fut assurée par des proches et des maîtres d'Araouane, et notamment par le Qadiri Sidi Ali bin al-Najib, dont il devint le cheikh. Il établit alors son centre d'enseignement à Azawad, au nord-est de Tombouctou. Il devint le chef spirituel reconnu de toute la région du détroit du Niger: il joua un rôle de médiateur entre les tribus rivales, notamment les Kunta, les Barabish et les Touaregs, enseigna et correspondit avec des érudits du Kanem-Bornou jusqu’à l’Atlantique, aurait écrit trois cents traités, se considérait comme un mujaddid, fut le précepteur d’Usman dan Fodio et soutint le jihad qui fonda le califat de Sokoto. Il mourut en 1811 à l’âge de 82 ans et son fils Muhammad lui succéda, puis son petit-fils Ahmed al-Bakkay."
  tr: "Sidi al-Mukhtar bin Ahmad al-Kunti (1729-1811), Büyük Şeyh olarak bilinir, Batı Sudan'da Kadiriyya tarikatının önde gelen bir âlimi ve Batı Afrika'da İslam'ın en önemli yayıcılarından biriydi. Mali'nin Mabrouk kentinin kuzeyindeki Urala bölgesinde, zawiyalara mensup Kenta alim kabilesinde doğdu. Babası on yaşındayken vefat etti, bu yüzden Arwan'dan akrabaları ve öğretmenleri eğitimini devraldı. En önde gelen öğretmeni, onun yerine şeyh olan ve karargahını Timbuktu'nun kuzeydoğusundaki Azawad'da kuran Sidi Ali bin al-Najib al-Qadiri'ydi. Tüm Nijer dönüm noktasının manevi referansı oldu: özellikle Kenta, Brabishler ve Tuareg gibi rakip kabileler arasında bir merkez oldu. Canem-Borno'dan Atlantik'e kadar alimler inceledi ve yazdı. Üç yüz mektup yazdığı, kendini tekrar gördüğü, Osman Dan Fodiu'nun yanında çalıştığı ve cihadını desteklediği söylenir; bu da Socotra Halifeliği'nin kurulmasına yol açtı. 1811'de seksen iki yaşında öldü; yerine oğlu Muhammed ve ardından torunu Ahmed el-Bakai geçti."
  id: "Sidi al-Mukhtar bin Ahmad al-Kunti (1729-1811), dikenal sebagai Sheikh Agung, adalah seorang ulama terkemuka dari ordo Qadiriyya di Sudan barat dan salah satu penyebar Islam terpenting di Afrika Barat. Ia lahir di wilayah Urala utara Mabrouk, Mali, dalam suku ulama Kenta yang termasuk dalam zawiya. Ayahnya meninggal saat ia berusia sepuluh tahun, sehingga kerabat dan guru-gurunya dari Arwan mengambil alih pendidikannya. Guru paling menonjolnya adalah Sidi Ali bin al-Najib al-Qadiri, yang menggantikannya sebagai sheikh dan mendirikan markasnya di Azawad, timur laut Timbuktu. Ia menjadi referensi spiritual bagi seluruh titik balik Niger: pusat di antara suku-suku saingan, terutama Kenta, Brabishe, dan Tuareg. Ia mempelajari dan menulis para sarjana dari Canem-Borno hingga Atlantik. Dikatakan bahwa ia menulis tiga ratus surat, bertemu dirinya kembali, belajar di bawah bimbingan Osman Dan Fodiu, dan mendukung jihadnya, yang kemudian mengarah pada berdirinya Kekhalifahan Socotra. Ia meninggal pada tahun 1811 pada usia delapan puluh dua tahun, digantikan oleh putranya Muhammad dan kemudian cucunya Ahmed al-Bakai."
