label: { ar: "أبو بكر الشاشي محمد بن علي بن حامد" }
summary:
  ar: "أبو بكر الشاشي محمد بن علي بن حامد — شيخ الشافعية وصاحب الطريقة المشهورة والمصنفات المليحة؛ ولد سنة سبع وتسعين وثلاثمائة وتفقه في بلاده على أبي بكر السنجي، ودرّس مدة بغزنة ثم بهراة ونيسابور، وكان من أنظر أهل زمانه؛ استدعاه نظام الملك إلى هراة ففارقه أهل غزنة على كره وتولى تدريس نظاميتها، وتوفى في شوال سنة خمس وثمانين وأربعمائة {cite:shadharat-dhahab p. 375}."
  en: "Abu Bakr al-Shashi Muhammad b. Ali b. Hamid — shaykh of the Shafi'is and author of the celebrated works; born 397, he studied fiqh under Abu Bakr al-Sanji, taught at Ghazna, Herat and Nishapur, was summoned by Nizam al-Mulk to Herat over the Ghaznavids' reluctance and headed its Nizamiyya; died Shawwal 485 {cite:shadharat-dhahab p. 375}."
