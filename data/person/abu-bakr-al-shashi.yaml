label: { ar: "أبو بكر الشاشي محمد بن علي بن حامد", en: "Abu Bakr al-Shashi Muhammad ibn Ali ibn Hamid", fr: "Abu Bakr al-Shashi Muhammad ibn Ali ibn Hamid", es: "Abu Bakr al-Shashi Muhammad ibn Ali ibn Hamid" }
summary:
  ar: "أبو بكر الشاشي محمد بن علي بن حامد — شيخ الشافعية وصاحب الطريقة المشهورة والمصنفات المليحة؛ ولد سنة سبع وتسعين وثلاثمائة وتفقه في بلاده على أبي بكر السنجي، ودرّس مدة بغزنة ثم بهراة ونيسابور، وكان من أنظر أهل زمانه؛ استدعاه نظام الملك إلى هراة ففارقه أهل غزنة على كره وتولى تدريس نظاميتها، وتوفى في شوال سنة خمس وثمانين وأربعمائة {cite:shadharat-dhahab p. 375}."
  en: "Abu Bakr al-Shashi Muhammad b. Ali b. Hamid — shaykh of the Shafi'is and author of the celebrated works; born 397, he studied fiqh under Abu Bakr al-Sanji, taught at Ghazna, Herat and Nishapur, was summoned by Nizam al-Mulk to Herat over the Ghaznavids' reluctance and headed its Nizamiyya; died Shawwal 485 {cite:shadharat-dhahab p. 375}."
  fr: "Abu Bakr al-Shashi Muhammad b. Ali b. Hamid — shaykh des shafi'ites et auteur d'ouvrages célèbres ; né en 397, il étudia le fiqh auprès d'Abu Bakr al-Sanji, enseigna à Ghazna, Hérat et Nichapour, fut appelé à Hérat par Nizam al-Mulk malgré la réticence des Ghaznévides et dirigea sa Nizamiyya ; mort en Shawwal 485 {cite:shadharat-dhahab p. 375}."
  es: "Abu Bakr al-Shashi Muhammad b. Ali b. Hamid — shaykh de los shafi'is y autor de las célebres obras; nació en 397, estudió fiqh con Abu Bakr al-Sanji, enseñó en Ghazna, Herat y Nishapur, fue convocado por Nizam al-Mulk a Herat a pesar de la reticencia de los gaznávidas y dirigió su Nizamiyya; murió en Shawwal de 485 {cite:shadharat-dhahab p. 375}."
