kids:
  ar: "محمد بن دينار تلميذ مالك الذي قال فيه الشافعي «ما رأيت في فتيان مالك أفقه منه»."
  en: "Malik's student Muhammad ibn Dinar, of whom al-Shafi'i said 'I saw none more learned among Malik's companions'."
  ur: "مالک کا شاگرد محمد بن دینار جس کے بارے میں شافعی نے کہا «مالک کے ساتھیوں میں میں نے اس سے زیادہ فقیہ نہیں دیکھا»."
