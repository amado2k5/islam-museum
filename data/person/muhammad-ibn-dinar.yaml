summary:
  ar: "محمد بن إبراهيم بن دينار المدني، أبو عبد الله الجهني ويقال الأنصاري، من ولد دينار بن النجار، ولقبه صندل؛ فقيه من فقهاء المدينة نحو مالك روى عن ابن أبي ذئب وابن عجلان وموسى بن عقبة وغيرهم، وروى عنه أبو مصعب الزهري وعبد الله بن وهب، وقال أبو حاتم كان من فقهاء المدينة نحو مالك وكان ثقة، وقال ابن عبد البر كان مفتي أهل المدينة مع مالك؛ وتوفي سنة 182 هـ بعد مالك بثلاث سنين {cite:tahdhib-kamal-mizzi-risala vol. 24 pp. 306-307} {cite:tabaqat-fuqaha-abbas-1981 p.124}."
  en: "Muhammad ibn Ibrahim ibn Dinar of Medina, Abu Abd Allah al-Juhani (some say al-Ansari), of the line of Dinar ibn al-Najjar and nicknamed Sandal; a jurist of Medina in Malik's circle who transmitted from Ibn Abi Dhi'b, Ibn Ajlan, Musa ibn Uqba and others and from whom Abu Mus'ab al-Zuhri and Abd Allah ibn Wahb narrated. Abu Hatim called him one of Medina's jurists like Malik and reliable, and Ibn Abd al-Barr called him a mufti of Medina alongside Malik; he died in 182 AH, three years after Malik {cite:tahdhib-kamal-mizzi-risala vol. 24 pp. 306-307} {cite:tabaqat-fuqaha-abbas-1981 p.124}."
  ur: "محمد بن ابراہیم بن دینار مدینہ کا باشندہ، مالک کے بڑے شاگردوں میں سے؛ شافعی کا قول «مالک کے ساتھیوں میں میں نے اس سے زیادہ فقیہ نہیں دیکھا» مشہور ہے، اور مالک کے تین سال بعد 182 میں وفات پائی {cite:tabaqat-fuqaha-abbas-1981 p.124}."
