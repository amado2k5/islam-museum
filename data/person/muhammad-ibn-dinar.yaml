  en: "Muhammad ibn Ibrahim ibn Dinar"
  ur: "محمد بن ابراہیم بن دینار"
roles: [jurist]
gender: male
summary:
  ar: "محمد بن إبراهيم بن دينار المدني، من كبار أصحاب مالك؛ درس معه علي بن حربان، وقال الشافعي «ما رأيت في فتيان مالك أفقه من محمد بن دينار»، وتوفي سنة اثنتين وثمانين ومائة بعد مالك بثلاث سنين {cite:tabaqat-fuqaha-abbas-1981 p.124}."
  en: "Muhammad ibn Ibrahim ibn Dinar of Medina, among Malik's senior students; he studied with him and 'Ali ibn Harban, and al-Shafi'i said 'I never saw among Malik's young companions anyone more learned than Muhammad ibn Dinar'; he died 182, three years after Malik {cite:tabaqat-fuqaha-abbas-1981 p.124}."
  ur: "محمد بن ابراہیم بن دینار مدینہ کا باشندہ، مالک کے بڑے شاگردوں میں سے؛ شافعی کا قول «مالک کے ساتھیوں میں میں نے اس سے زیادہ فقیہ نہیں دیکھا» مشہور ہے، اور مالک کے تین سال بعد 182 میں وفات پائی {cite:tabaqat-fuqaha-abbas-1981 p.124}."
