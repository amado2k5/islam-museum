    note: "Independent texts state his personal discipleship and his order affiliation, which is the lane's test for a sufi segment. The English text recounts that his father invested him as khalifa and presented him to Shaikh Abdul Qadir Gilani as his spiritual successor, and that he later took the formal bay'ah with Ghulam Muhammad, khalifa of Baba Baduh Shah Abdal in the line of Damriyan Wali Sarkar. The Urdu text, independently written, states in its silsila section that his chain of tariqa is Qadiri, Qalandari and Hujwiri, and records his bay'ah to Sain Ghulam Muhammad of Kalrodi Sharif. The Arabic text states in its lead that he belonged to the Qadiri Sufi order. The member_of edge is written to the Qadiriyya, the order the texts name first and most plainly. No madhhab is named for him in any consulted text, so no school segment is recorded; Wikidata's single religion value (Islam) is a structured value and is not counted."
