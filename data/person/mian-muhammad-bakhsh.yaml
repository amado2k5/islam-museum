  note: "There is considerable disagreement about his birth year, as both the English and Urdu articles set out: Mahbub Ali Faqir Qadri's biography, printed as an appendix to Saif-ul-Maluk and followed by the Shahkar Islami Encyclopedia, gives 1246 AH (1830 CE); other works suggest 1843; and Bakhsh himself states in Saif-ul-Maluk that he completed the work in Ramadan 1279 AH (1863) at the age of thirty-three, which places his birth in 1829 or 1830. The year 1830 is followed, as in the lane queue; it is approximate. Khari Sharif has no place entity, so no born_in edge is written. The Hijri year is Qadri's biographical date, as reported by the articles."
