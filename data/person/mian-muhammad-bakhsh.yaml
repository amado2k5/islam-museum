summary:
  ar: "شاعر صوفي بنجابي (حوالي 1830 – 1907) من خاري شريف في كشمير الحرة. أخذ البيعة عن غلام محمد في سلسلة دمريان والي سركار القادرية، وعاش في الخانقاه ولم يتزوج، وكتب ثمانية عشر كتاباً أشهرها «سيف الملوك» (سفر العشق)، المثنوية البنجابية في قصة الأمير سيف الملوك."
  en: "Punjabi Sufi poet (c. 1830 – 1907) of Khari Sharif in Azad Kashmir. He took bay'ah with Ghulam Muhammad in the Qadiri line of Damriyan Wali Sarkar, lived unmarried in the khanqah, and wrote eighteen books, most famously Saif-ul-Maluk (Safr-ul-Ishq), the Punjabi verse romance of Prince Saiful Maluk."
  ur: "پنجابی صوفی شاعر (تقریباً 1830ء – 1907ء) کھڑی شریف، آزاد کشمیر سے۔ سلسلہ قادریہ دمڑی والی سرکار میں سائیں غلام محمد سے بیعت ہوئے، عمر بھر خانقاہ میں رہے اور شادی نہ کی، اور اٹھارہ کتابیں لکھیں جن میں سب سے مشہور «سیف الملوک» (سفر العشق) ہے۔"
