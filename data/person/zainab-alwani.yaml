summary:
  ar: "عالمة وفقيهة أمريكية من أصل عراقي، وُلدت في بغداد سنة 1962، وهي أول أستاذة مشاركة للدراسات الإسلامية في كلية اللاهوت بجامعة هوارد وأول امرأة تجلس في مجلس الفقه لأمريكا الشمالية، وتشغل اليوم نائب رئاسته؛ حصلت على الدكتوراه في أصول الفقه من الجامعة الإسلامية العالمية في ماليزيا، وتعمل على تدبّر القرآن وقضايا المرأة والأسرة في الفقه."
  en: "American Islamic scholar and jurist of Iraqi origin, born in Baghdad in 1962. She is the first Associate Professor of Islamic Studies at Howard University School of Divinity and the first female jurist to sit on the board of the Fiqh Council of North America, whose Vice-Chair she now is; she took her PhD in Islamic jurisprudence from the International Islamic University Malaysia and works on Quranic contemplation (tadabbur) and on women and the family in Islamic law."
  ur: "امریکی مسلمان عالمہ اور فقیہہ، عراقی نژاد، 1962 میں بغداد میں پیدا ہوئیں۔ وہ ہاورڈ یونیورسٹی کے سکول آف ڈیوینیٹی میں اسلامی مطالعات کی پہلی ایسوسی ایٹ پروفیسر اور فقہ کونسل آف نارتھ امریکہ کے بورڈ میں شامل ہونے والی پہلی خاتون فقیہہ ہیں، جس کی وہ اب نائب صدر ہیں؛ انہوں نے ملائیشیا کی بین الاقوامی اسلامی یونیورسٹی سے اصول فقہ میں پی ایچ ڈی کی، اور ان کا کام تدبرِ قرآن اور فقہ میں خواتین و خاندان کے مسائل پر ہے۔"
  es: "Académica y jurista islámica estadounidense de origen iraquí, nacida en Bagdad en 1962. Es la primera profesora asociada de Estudios Islámicos en la Facultad de Teología de la Universidad de Howard y la primera jurista en formar parte de la junta directiva del Consejo de Fiqh de América del Norte, del cual ahora es vicepresidenta; obtuvo su doctorado en jurisprudencia islámica en la Universidad Islámica Internacional de Malasia y trabaja en la contemplación coránica (tadabbur) y en la mujer y la familia en el derecho islámico."
  fr: "Juriste et spécialiste américaine de l'islam, d'origine irakienne, née à Bagdad en 1962. Elle est la première professeure agrégée d'études islamiques à la faculté de théologie de l'université Howard et la première femme juriste à siéger au conseil d'administration du Fiqh Council of North America, dont elle est actuellement la vice-présidente; elle a obtenu son doctorat en jurisprudence islamique à l'Université islamique internationale de Malaisie et ses travaux portent sur la contemplation coranique (tadabbur) et sur les femmes et la famille en droit islamique."
  tr: "1962 yılında Bağdat'ta doğmuş, Irak kökenli Amerikalı bir akademisyen ve hukukçudur. Howard Üniversitesi İlahiyat Semineri'nde İslam çalışmaları alanında ilk doçent ve Kuzey Amerika Hukuk Konseyi'nde görev yapan ilk kadındır. Şu anda başkan yardımcısı olarak görev yapmaktadır; Malezya Uluslararası İslam Üniversitesi'nden fıkıh ilkeleri alanında doktora derecesine sahiptir ve terükür Kur'an ile kadınlar ve aile ile ilgili konular üzerine hukuk alanında çalışmaktadır."
  id: "Seorang cendekiawan dan ahli hukum Amerika keturunan Irak, lahir di Baghdad pada tahun 1962. Ia adalah profesor asosiasi pertama studi Islam di Howard University Theological Seminary dan wanita pertama yang duduk di Dewan Jurisprudensi untuk Amerika Utara. Saat ini ia menjabat sebagai wakil presiden; ia meraih gelar PhD dalam prinsip hukum dari International Islamic University di Malaysia dan bekerja pada Al-Quran kontemplatif serta isu-isu terkait perempuan dan keluarga dalam bidang hukum."
