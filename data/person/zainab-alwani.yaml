summary:
  ar: "عالمة وفقيهة أمريكية من أصل عراقي، وُلدت في بغداد سنة 1962، وهي أول أستاذة مشاركة للدراسات الإسلامية في كلية اللاهوت بجامعة هوارد وأول امرأة تجلس في مجلس الفقه لأمريكا الشمالية، وتشغل اليوم نائب رئاسته؛ حصلت على الدكتوراه في أصول الفقه من الجامعة الإسلامية العالمية في ماليزيا، وتعمل على تدبّر القرآن وقضايا المرأة والأسرة في الفقه."
  en: "American Islamic scholar and jurist of Iraqi origin, born in Baghdad in 1962. She is the first Associate Professor of Islamic Studies at Howard University School of Divinity and the first female jurist to sit on the board of the Fiqh Council of North America, whose Vice-Chair she now is; she took her PhD in Islamic jurisprudence from the International Islamic University Malaysia and works on Quranic contemplation (tadabbur) and on women and the family in Islamic law."
  ur: "امریکی مسلمان عالمہ اور فقیہہ، عراقی نژاد، 1962 میں بغداد میں پیدا ہوئیں۔ وہ ہاورڈ یونیورسٹی کے سکول آف ڈیوینیٹی میں اسلامی مطالعات کی پہلی ایسوسی ایٹ پروفیسر اور فقہ کونسل آف نارتھ امریکہ کے بورڈ میں شامل ہونے والی پہلی خاتون فقیہہ ہیں، جس کی وہ اب نائب صدر ہیں؛ انہوں نے ملائیشیا کی بین الاقوامی اسلامی یونیورسٹی سے اصول فقہ میں پی ایچ ڈی کی، اور ان کا کام تدبرِ قرآن اور فقہ میں خواتین و خاندان کے مسائل پر ہے۔"
