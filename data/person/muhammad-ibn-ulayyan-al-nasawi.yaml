  ar: "محمد بن علي النسوي المعروف بمحمد بن عليان، من العارفين الذين أدرك أبو نعيم أيامهم، يصفه برفعة الهمة وظهور الكرامات، ويروي له أقوالًا في الزهد والمروءة والمحبة."
