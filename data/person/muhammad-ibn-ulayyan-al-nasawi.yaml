summary:
  ar: "محمد بن علي النسوي المعروف بمحمد بن عليان، من العارفين الذين أدرك أبو نعيم أيامهم، يصفه برفعة الهمة وظهور الكرامات، ويروي له أقوالًا في الزهد والمروءة والمحبة."
  en: "Muhammad ibn Ali al-Nasawi, known as Muhammad ibn Ulayyan, one of the gnostics whose days Abu Nu'aym reached; he describes him as a man of high aspiration and manifest marvels and relates his sayings on asceticism, manly virtue and love."
  ur: "محمد بن علی نسوی، جو محمد بن علیان کے نام سے معروف ہیں، ان عارفوں میں سے ہیں جن کا زمانہ ابو نعیم نے پایا۔ ابو نعیم انہیں بلند ہمت اور ظاہر کرامات والا کہتے ہیں، اور زہد، مروت اور محبت پر ان کے اقوال نقل کرتے ہیں۔"
  es: "Muhammad ibn Ali al-Nasawi, conocido como Muhammad ibn Ulayyan, uno de los gnósticos con quienes Abu Nu'aym compartió época; lo describe como un hombre de altas aspiraciones y prodigios manifiestos, y relata sus dichos sobre el ascetismo, la virtud masculina y el amor."
  fr: "Muhammad ibn Ali al-Nasawi, connu sous le nom de Muhammad ibn Ulayyan, l'un des gnostiques dont Abu Nu'aym a atteint l'époque; il le décrit comme un homme aux aspirations élevées et aux prodiges manifestes et relate ses paroles sur l'ascétisme, la vertu virile et l'amour."
  tr: "Muhammed bin Ali El-Nasavi, nam-ı diğer Muhammed bin Alyan, Ebu Nuaym'ın günlerini tanıdığı mistiklerden biriydi. Onu son derece hırslı ve mucizeler gösteren biri olarak tanımladı, münzeviyet, şövalyelik ve aşk hakkında sözler anlattı."
  id: "Muhammad bin Ali Al-Nasawi, yang dikenal sebagai Muhammad bin Alyan, adalah salah satu mistikus yang pernah bertemu Abu Nu'aym pada masa-masanya. Ia menggambarkannya sebagai sosok yang sangat ambisius dan menunjukkan tanda-tanda mukjizat, serta menceritakan pepatah tentang asketisme, kesatria, dan cinta."
