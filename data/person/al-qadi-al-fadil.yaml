summary:
  ar: "أبو علي عبد الرحيم بن القاضي الأشرف بهاء الدين علي اللخمي العسقلاني المولد المصري الدار، المعروف بالقاضي الفاضل الملقب مجير الدين؛ وزر للسلطان صلاح الدين في صناعة الإنشاء وفاق المتقدمين وله فيه الغرائب مع الإكثار، ومسودات رسائله في المجلدات؛ وبنى بالقاهرة مدرسة بدرب ملوخية استفتح التدريس بها سنة اثنتين وخمسمائة؛ وتوفي بالقاهرة ليلة الأربعاء سابع ربيع الآخر سنة ست وتسعين وخمسمائة ودفن في تربته سفح المقطم بالقرافة الصغرى {cite:wafayat-ayan}."
  en: "al-Qadi al-Fadil Abd al-Rahim al-Baysani (535–596) — Salah al-Din's chancellor of correspondence, master of insha'; built a madrasa at Darb Malukhiya; Ibn Khallikan visited his grave at Muqattam {cite:wafayat-ayan}."
  fr: "al-Qadi al-Fadil Abd al-Rahim al-Baysani (535-596) – Le chancelier de la correspondance de Salah al-Din, maître des insha'  ; construit une madrasa à Darb Maloukhiya  ; Ibn Khallikan a visité sa tombe à Muqattam {cite:wafayat-ayan}."
  es: "al-Qadi al-Fadil Abd al-Rahim al-Baysani (535–596): canciller de correspondencia de Salah al-Din, maestro de insha'; construyó una madrasa en Darb Malukhiya; Ibn Khallikan visitó su tumba en Muqattam {cita:wafayat-ayan}."
  ur: "القدی الفاضل عبد الرحیم البیسانی (535-596) - صلاح الدین کا خط و کتابت کا چانسلر، انشاء کا ماسٹر؛ دارب ملوکیہ میں ایک مدرسہ بنایا۔ ابن خلیقان نے مقطم میں ان کی قبر کی زیارت کی۔"
  tr: "Mısır doğumlu Ebu Ali Abdülrahim bin el-Kaddi Eşref Baha'eddin Baha'eddin Ali el-Lakhmi el-Eskelani, erdemli yargıç olarak bilinen Mucir al-Din olarak bilinir; Sultan Salah-al-Din'in bestecilik alanında bakanı olarak görev yaptı, seleflerini geride bıraktı ve mektuplarının ciltler halinde el yazmalarıyla birlikte birçok dikkat çekici eseri vardı. Kahire'de Darb Molokhiya'da bir okul inşa etti ve öğretim 502 Hicri yılında başladı. 596 Hicri yılında, Rabi'el-Thani'nin yedinci günü Çarşamba gecesi Kahire'de öldü ve Mokattam'ın eteğinde, küçük el-Karafa'da defnedildi."
  id: "Abu Ali Abdul Rahim ibn al-Qadi al-Ashraf Baha' al-Din Ali al-Lakhmi al-Asqalani, lahir di Mesir, dikenal sebagai hakim berbudi luhur yang dikenal sebagai Mujir al-Din; ia menjabat sebagai menteri Sultan Salah al-Din di bidang komposisi, melampaui para pendahulunya, dan ia memiliki banyak karya luar biasa di dalamnya, dengan naskah surat-suratnya dalam jumlah volume. Ia membangun sebuah sekolah di Kairo di Darb Molokhiya, tempat pengajaran dimulai pada tahun 502 H. Ia meninggal di Kairo pada malam Rabu, tanggal tujuh Rabi' al-Thani pada tahun 596 H, dan dimakamkan di kaki Mokattam di al-Qarafa kecil {cite:wafayat-ayan}."
