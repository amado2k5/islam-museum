summary:
  ar: "أبو علي عبد الرحيم بن القاضي الأشرف بهاء الدين علي اللخمي العسقلاني المولد المصري الدار، المعروف بالقاضي الفاضل الملقب مجير الدين؛ وزر للسلطان صلاح الدين في صناعة الإنشاء وفاق المتقدمين وله فيه الغرائب مع الإكثار، ومسودات رسائله في المجلدات؛ وبنى بالقاهرة مدرسة بدرب ملوخية استفتح التدريس بها سنة اثنتين وخمسمائة؛ وتوفي بالقاهرة ليلة الأربعاء سابع ربيع الآخر سنة ست وتسعين وخمسمائة ودفن في تربته سفح المقطم بالقرافة الصغرى {cite:wafayat-ayan}."
  en: "al-Qadi al-Fadil Abd al-Rahim al-Baysani (535–596) — Salah al-Din's chancellor of correspondence, master of insha'; built a madrasa at Darb Malukhiya; Ibn Khallikan visited his grave at Muqattam {cite:wafayat-ayan}."
