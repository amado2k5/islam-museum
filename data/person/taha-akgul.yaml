summary:
  ar: "مصارع حر تركي في وزن 125 كغ، وُلد في سيواس سنة 1990. بطل أولمبي في ريو 2016 وصاحب برونزيتين أولمبيتين (2020 و2024)، وبطل عالم ثلاث مرات وبطل أوروبا إحدى عشرة مرة. اعتزل بعد أولمبياد باريس 2024 وصار رئيسًا للاتحاد التركي للمصارعة."
  en: "Turkish freestyle wrestler at 125 kg, born in Sivas in 1990. Olympic champion at Rio 2016 with further bronze medals in 2020 and 2024, a three-time world champion and eleven-time European champion. He retired after the Paris 2024 Olympics and became president of the Turkish Wrestling Federation."
  ur: "ترک فری اسٹائل پہلوان (125 کلوگرام)، جو 1990 میں سیواس میں پیدا ہوئے۔ ریو 2016 کے اولمپک چیمپئن، 2020 اور 2024 میں کانسی کے تمغے، تین بار عالمی اور گیارہ بار یورپی چیمپئن۔ پیرس 2024 کے بعد ریٹائر ہو کر وہ ترک ریسلنگ فیڈریشن کے صدر بنے۔"
