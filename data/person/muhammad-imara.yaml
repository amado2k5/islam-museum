summary:
  ar: "محمد عمارة ⁦(1931–2020)⁩ مفكر إسلامي وكاتب ومحقق مصري، عضو مجمع البحوث الإسلامية بالأزهر، ألّف وحقق أكثر من مئتي كتاب في الفكر الإسلامي والتراث. من آثاره «تيارات الفكر الإسلامي» و«الإسلام وأصول الحكم» وتحقيقاته لأعمال رشيد رضا والكواكبي."
  en: "Muhammad Imara (1931–2020) was an Egyptian Islamic thinker, author and editor, member of al-Azhar's Islamic Research Academy, who wrote and edited over two hundred books on Islamic thought and heritage. His works include Tayarat al-Fikr al-Islami (Currents of Islamic Thought), Al-Islam wa Usul al-Hukm (Islam and the Foundations of Governance) and his editions of Rashid Rida and al-Kawakibi."
  ur: "محمد عمارة ⁦(1931–2020)⁩ مصری اسلامی مفکر، مصنف اور محقق تھے، ازہر کے مجمع البحوث الإسلامية کے رکن، جنہوں نے اسلامی فکر اور تراث پر دو سو سے زائد کتب لکھیں اور تحقیق کیں۔ آثار میں «تيارات الفكر الإسلامي»، «الإسلام وأصول الحكم» اور رشید رضا و کواکبی کے متون کی تحقیق شامل ہے۔"
  es: "Muhammad Imara (1931–2020) fue un pensador islámico egipcio, autor y editor, miembro de la Academia de Investigación Islámica de Al-Azhar, que escribió y editó más de doscientos libros sobre el pensamiento y el patrimonio islámicos. Entre sus obras destacan Tayarat al-Fikr al-Islami (Corrientes del pensamiento islámico), Al-Islam wa Usul al-Hukm (El islam y los fundamentos del gobierno) y sus ediciones de Rashid Rida y Al-Kawakibi."
  fr: "Muhammad Imara (1931-2020) était un penseur, auteur et éditeur islamique égyptien, membre de l'Académie de recherche islamique d'Al-Azhar. Il a écrit et édité plus de deux cents ouvrages sur la pensée et le patrimoine islamiques. Parmi ses œuvres figurent Tayarat al-Fikr al-Islami (Courants de la pensée islamique), Al-Islam wa Usul al-Hukm (L'Islam et les fondements de la gouvernance) et ses éditions de Rashid Rida et d'al-Kawakibi."
  tr: "Mohamed Amara (1931–2020), El-Ezher'deki İslami Araştırmalar Akademisi üyesi olan Mısırlı bir İslam düşünürü, yazar ve araştırmacıydı. İslami düşünce ve miras üzerine iki yüzden fazla kitap yazdı ve editörlüğünü yaptı. Eserleri arasında \"İslami Düşüncenin Akımları\", \"İslam ve Yönetim İlkeleri\" ve Rashid Ridha ile Al-Kawakibi'nin eserlerinin eleştirel baskıları yer almaktadır."
  id: "Mohamed Amara (1931–2020) adalah seorang pemikir, penulis, dan peneliti Islam Mesir, anggota Akademi Riset Islam di Al-Azhar. Ia menulis dan mengedit lebih dari dua ratus buku tentang pemikiran dan warisan Islam. Di antara karyanya adalah \"Arus Pemikiran Islam,\" \"Islam dan Prinsip Pemerintahan,\" serta edisi kritisnya atas karya Rashid Ridha dan Al-Kawakibi."
