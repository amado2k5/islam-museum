summary:
  ar: "المياسة بنت حمد آل ثاني (وُلدت في 29 سبتمبر 1983) هي رئيسة متاحف قطر وابنة أمير قطر السابق حمد بن خليفة آل ثاني وشقيقة الأمير الحالي تميم بن حمد آل ثاني. أسست منظمة أيادي الخير نحو آسيا بعد تخرجها في جامعة ديوك سنة 2005، وأسست معهد الدوحة للأفلام سنة 2010، وعُدّت من أقوى شخصيات عالم الفن نفوذًا، وأشرفت على صفقات اقتناء قياسية لمتاحف قطر منها شراء لوحة غوغان «متى تتزوجين؟» سنة 2015."
  en: "Al-Mayassa bint Hamad Al Thani (born 29 September 1983) is the chairperson of Qatar Museums, a daughter of Qatar's former Emir Hamad bin Khalifa Al Thani and a sister of the current Emir, Tamim bin Hamad Al Thani. After graduating from Duke University in 2005 she founded the philanthropic organisation Reach Out To Asia, and in 2010 she founded the Doha Film Institute. Ranked among the most influential figures in the art world, she has overseen record acquisitions for Qatar Museums, including the 2015 purchase of Gauguin's 'When Will You Marry?'."
  ur: "المیاسہ بنت حمد آل ثانی (پیدائش 29 ستمبر 1983) قطر میوزمز کی چیئرپرسن ہیں، قطر کے سابق امیر حمد بن خلیفہ آل ثانی کی صاحبزادی اور موجودہ امیر تمیم بن حمد آل ثانی کی بہن۔ 2005 میں ڈیوک یونیورسٹی سے فارغ ہونے کے بعد انھوں نے فلاحی تنظیم «ریچ آؤٹ ٹو ایشیا» قائم کی اور 2010 میں دوحہ فلم انسٹیٹیوٹ کی بنیاد رکھی۔ انھیں عالمِ فن کی بااثر ترین شخصیات میں شمار کیا جاتا ہے اور ان کی نگرانی میں قطر میوزمز نے ریکارڈ خریداریاں کیں، جن میں 2015 میں گوگین کی مصوری «کب شادی کرو گی؟» کی خرید بھی شامل ہے۔"
