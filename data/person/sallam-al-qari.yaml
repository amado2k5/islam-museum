summary:
  ar: "سلام القاري ويكنى أبا المنذر ويلقبه أهل العدل أبا المدبر، أصاب غلامه على جاريته فقال له ما هذا ويلك فقال كذا قضاء الله فقال له أنت حر لعلمك بالقضاء والقدر وزوجه الجارية {cite:fihrist-ibn-al-nadim p. 256}."
  en: "Sallam al-Qari — who freed his slave for citing qadar in his defence {cite:fihrist-ibn-al-nadim}"
  es: "Sallam al-Qari — quien liberó a su esclavo por citar el qadar en su defensa {cite:fihrist-ibn-al-nadim}"
  fr: "Sallam al-Qari — qui a affranchi son esclave pour avoir invoqué le qadar dans sa défense {cite:fihrist-ibn-al-nadim}"
  ur: "سلام القری - جس نے اپنے غلام کو اپنے دفاع میں قضا کا حوالہ دینے پر آزاد کیا۔"
  tr: "Salam al-Qari, nam-ı diğer Ebu al-Mundhir ve adalet adamları ona Ebu el-Mudabber lakabını taktılar, hizmetkarı kızını dövdü ve ona, 'Bu ne, vay sana mı?' dedi. O da 'İşte Allah'ın buyruğudur.' diye cevap verdi. O da şöyle cevap verdi: 'Sen ilahi emri ve kaderi bilmekte özgürsün ve köle kızı evlendirmekte özgürsün.' {atıf:Fihrist-ibn-al-Nadim s. 256}."
  id: "Salam al-Qari, yang dikenal sebagai Abu al-Mundhir, dan umat keadilan menjulukinya Abu al-Mudabber, hambanya memukul budak perempuannya dan berkata kepadanya, 'Apa ini, celakalah bagimu?' Ia menjawab, 'Itulah titah Tuhan.' Ia menjawab, 'Engkau bebas mengetahui titah dan takdir ilahi, dan menikahkan budak perempuan itu.' {cite:fihrist-ibn-al-nadim hlm. 256}."
