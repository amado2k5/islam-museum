summary:
  ar: "خير الدين المعروف في أوروبا ببربروسة قرصان تركي ولد في مدللي، ولحق بأخيه عروج في جربة، وحكم الجزائر بعد مقتله سنة ١٥١٨م وأقر السلطان سليم الأول سيادته عليها. استدعاه سليمان القانوني إلى استانبول فمنحه الصدر الأعظم منصب قبودان باشا سنة ١٥٣٤م تقريباً، واستولى على تونس ثم خسرها أمام شارل الخامس سنة ١٥٣٥م. وقاد الأسطول العثماني في الأرخبيل وبرفزة، ثم تعاون مع الأسطول الفرنسي في غرب المتوسط سنة ١٥٤٣م، وتوفي في ٤ تموز ١٥٤٦م ودُفن في بشكتاش."
  en: "Khayr al-Din, known in Europe as Barbarossa, was a Turkish corsair born on Lesbos who joined his brother Uruj at Djerba and ruled Algiers after Uruj's death in 1518, with Selim I accepting Ottoman overlordship there. Summoned by Suleyman, he was made Kapudan Pasha by the grand vizier around 1534, took Tunis and lost it to Charles V in 1535. He commanded the Ottoman fleet in the Aegean and at Preveza, co-operated with the French fleet in the western Mediterranean in 1543, and died on 4 July 1546, buried at Besiktas."
  ur: "خیر الدین، جو یورپ میں باربروسا کہلائے، مدللی میں پیدا ہونے والے ترک بحری قزاق تھے جو جربہ میں اپنے بھائی عروج سے ملے اور 1518ء میں اس کی وفات کے بعد الجزائر پر حکمران رہے، اور سلیم اول نے وہاں عثمانی بالادستی قبول کی۔ سلیمان کی طلبی پر وزیرِ اعظم نے انہیں تقریباً 1534ء میں قبودان پاشا بنایا، انہوں نے تیونس لیا اور 1535ء میں چارلس پنجم کے ہاتھوں کھو دیا۔ انہوں نے ایجین اور پریویزہ میں عثمانی بیڑے کی قیادت کی، 1543ء میں مغربی بحیرۂ روم میں فرانسیسی بیڑے سے تعاون کیا، اور 4 جولائی 1546ء کو وفات پائی اور بشکتاش میں دفن ہوئے۔"
