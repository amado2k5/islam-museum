summary:
  ar: "خير الدين المعروف في أوروبا ببربروسة قرصان تركي ولد في مدللي، ولحق بأخيه عروج في جربة، وحكم الجزائر بعد مقتله سنة ١٥١٨م وأقر السلطان سليم الأول سيادته عليها. استدعاه سليمان القانوني إلى استانبول فمنحه الصدر الأعظم منصب قبودان باشا سنة ١٥٣٤م تقريباً، واستولى على تونس ثم خسرها أمام شارل الخامس سنة ١٥٣٥م. وقاد الأسطول العثماني في الأرخبيل وبرفزة، ثم تعاون مع الأسطول الفرنسي في غرب المتوسط سنة ١٥٤٣م، وتوفي في ٤ تموز ١٥٤٦م ودُفن في بشكتاش."
  en: "Khayr al-Din, known in Europe as Barbarossa, was a Turkish corsair born on Lesbos who joined his brother Uruj at Djerba and ruled Algiers after Uruj's death in 1518, with Selim I accepting Ottoman overlordship there. Summoned by Suleyman, he was made Kapudan Pasha by the grand vizier around 1534, took Tunis and lost it to Charles V in 1535. He commanded the Ottoman fleet in the Aegean and at Preveza, co-operated with the French fleet in the western Mediterranean in 1543, and died on 4 July 1546, buried at Besiktas."
  ur: "خیر الدین، جو یورپ میں باربروسا کہلائے، مدللی میں پیدا ہونے والے ترک بحری قزاق تھے جو جربہ میں اپنے بھائی عروج سے ملے اور 1518ء میں اس کی وفات کے بعد الجزائر پر حکمران رہے، اور سلیم اول نے وہاں عثمانی بالادستی قبول کی۔ سلیمان کی طلبی پر وزیرِ اعظم نے انہیں تقریباً 1534ء میں قبودان پاشا بنایا، انہوں نے تیونس لیا اور 1535ء میں چارلس پنجم کے ہاتھوں کھو دیا۔ انہوں نے ایجین اور پریویزہ میں عثمانی بیڑے کی قیادت کی، 1543ء میں مغربی بحیرۂ روم میں فرانسیسی بیڑے سے تعاون کیا، اور 4 جولائی 1546ء کو وفات پائی اور بشکتاش میں دفن ہوئے۔"
  es: "Khayr al-Din, conocido en Europa como Barbarroja, fue un corsario turco nacido en Lesbos que se unió a su hermano Uruj en Djerba y gobernó Argel tras la muerte de Uruj en 1518, cuando Selim I aceptó la soberanía otomana sobre la ciudad. Convocado por Solimán, fue nombrado Kapudan Pasha por el gran visir alrededor de 1534, conquistó Túnez y la perdió ante Carlos V en 1535. Comandó la flota otomana en el Egeo y en Preveza, colaboró con la flota francesa en el Mediterráneo occidental en 1543 y murió el 4 de julio de 1546, siendo enterrado en Besiktas."
  fr: "Khayr al-Din, connu en Europe sous le nom de Barberousse, était un corsaire turc né à Lesbos. Il rejoignit son frère Uruj à Djerba et gouverna Alger après la mort de ce dernier en 1518, Selim Ier ayant accepté la suzeraineté ottomane. Convoqué par Soliman le Magnifique, il fut nommé Kapudan Pacha par le grand vizir vers 1534, s'empara de Tunis, mais la perdit face à Charles Quint en 1535. Il commanda la flotte ottomane en mer Égée et à Préveza, collabora avec la flotte française en Méditerranée occidentale en 1543, et mourut le 4 juillet 1546. Il fut inhumé à Besiktas."
  tr: "Avrupa'da Barbarossa olarak bilinen Hayrdin, Medlali'de doğmuş bir Türk korsanıydı, kardeşi Aruj'a katıldı ve 1518'de suikasta uğradıktan sonra Cezayir'i yönetti ve Sultan I. Selim onun egemenliğini tanıdı. Süleyman Büyük, onu İstanbul'a çağırdı; burada Sadrazam ona yaklaşık 1534 yılında Kubudan Paşa unvanını verdi. Tunus'u ele geçirdi ve 1535'te V. Charles'a kaybetti. Takımadalarda ve Barfza'da Osmanlı filosunu yönetti, ardından 1543'te Batı Akdeniz'de Fransız filosuyla işbirliği yaptı. 4 Temmuz 1546'da öldü ve Beşiktaş'ta defnedildi."
  id: "Khair al-Din, yang dikenal di Eropa sebagai Barbarossa, adalah seorang bajak laut Turki yang lahir di Medlali, bergabung dengan saudaranya Aruj di Djerba, memerintah Aljazair setelah pembunuhannya pada tahun 1518 M, dan Sultan Selim I mengakui kedaulatannya atas wilayah itu. Suleiman yang Agung memanggilnya ke Istanbul, di mana Grand Vizier memberinya jabatan Qubudan Pasha sekitar tahun 1534 M. Ia merebut Tunisia dan kehilangan Tunisia kepada Charles V pada tahun 1535 M. Ia memimpin armada Ottoman di kepulauan dan di Barfza, kemudian bekerja sama dengan armada Prancis di Mediterania Barat pada tahun 1543 M. Ia meninggal pada 4 Juli 1546, dan dimakamkan di Beşiktaş."
