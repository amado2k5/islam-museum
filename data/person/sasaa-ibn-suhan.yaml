id: person/sasaa-ibn-suhan
class: person
label: { ar: "صعصعة بن صوحان العبدي", en: "Sa'sa'a ibn Suhan al-'Abdi" }
summary:
  ar: "خطيب عبد القيس من خواص علي وصفه معاوية بأنه أحد سهام علي وخطباء العرب، بعثه علي بكتابه إلى معاوية فحاوره في أنساب مضر وربيعة وعبد القيس حتى قال له ويحك ما تركت لقريش مجداً فأجاب بلى تركت لهم ما لا يصلح إلا بهم ثم فسرها ببني هاشم، وسأله ابن عباس عن السؤدد والمروءة والحكيم والفارس فوصفها بأجمع ما قيل فيها حتى قال أنت يا ابن صوحان باقر علم العرب، وشرك أبا أيوب الأنصاري في قتل عبد الله بن وهب الراسبي يوم النهروان {cite:muruj-al-dhahab p. 39-48}."
  en: "'Abd al-Qays's orator and one of Ali's 'arrows' — Mu'awiya called him a shaft of Ali and a khatib of the Arabs; his genealogy-riddle exchange at court, his definitions of leadership, manliness, wisdom and knighthood for Ibn Abbas ('you are the deep-sea of Arab learning'), and his share in Ibn Wahb's death at Nahrawan {cite:muruj-al-dhahab p. 39-48}."
