label: { ar: "صعصعة بن صوحان العبدي", en: "Sa'sa'a ibn Suhan al-'Abdi", es: "Sa'sa'a ibn Suhan al-'Abdi", fr: "Sa'sa'a ibn Suhan al-'Abdi", ur: "صعصع بن سہان العبدی" }
summary:
  ar: "خطيب عبد القيس من خواص علي وصفه معاوية بأنه أحد سهام علي وخطباء العرب، بعثه علي بكتابه إلى معاوية فحاوره في أنساب مضر وربيعة وعبد القيس حتى قال له ويحك ما تركت لقريش مجداً فأجاب بلى تركت لهم ما لا يصلح إلا بهم ثم فسرها ببني هاشم، وسأله ابن عباس عن السؤدد والمروءة والحكيم والفارس فوصفها بأجمع ما قيل فيها حتى قال أنت يا ابن صوحان باقر علم العرب، وشرك أبا أيوب الأنصاري في قتل عبد الله بن وهب الراسبي يوم النهروان {cite:muruj-al-dhahab p. 39-48}."
  en: "'Abd al-Qays's orator and one of Ali's 'arrows' — Mu'awiya called him a shaft of Ali and a khatib of the Arabs; his genealogy-riddle exchange at court, his definitions of leadership, manliness, wisdom and knighthood for Ibn Abbas ('you are the deep-sea of Arab learning'), and his share in Ibn Wahb's death at Nahrawan {cite:muruj-al-dhahab p. 39-48}."
  es: "El orador de 'Abd al-Qays y una de las 'flechas' de Ali —Mu'awiya lo llamó un rayo de Ali y un khatib de los árabes; su intercambio de acertijos genealógicos en la corte, sus definiciones de liderazgo, hombría, sabiduría y caballería para Ibn Abbas ('eres el mar profundo del saber árabe'), y su participación en la muerte de Ibn Wahb en Nahrawan {cite:muruj-al-dhahab p. 39-48}."
  fr: "L'orateur d'Abd al-Qays et l'une des « flèches » d'Ali — Mu'awiya l'appelait un pilier d'Ali et un khatib des Arabes; son échange d'énigmes généalogiques à la cour, ses définitions du leadership, de la virilité, de la sagesse et de la chevalerie pour Ibn Abbas (« tu es l'océan profond du savoir arabe »), et son rôle dans la mort d'Ibn Wahb à Nahrawan {cite:muruj-al-dhahab p. 39-48}."
  ur: "عبد القیس کا خطیب اور علی کے تیروں میں سے ایک - معاویہ نے اسے علی کا شافٹ اور عربوں کا خطیب کہا۔ عدالت میں اس کا شجرہ نسب کا تبادلہ، ابن عباس کے لیے اس کی قیادت، مردانگی، حکمت اور نائٹ ہونے کی تعریفیں ⁦('آپ عرب سیکھنے کے گہرے سمندر ہیں')⁩، اور ابن وہب کی نہروان میں موت میں ان کا حصہ۔ 39-48}۔"
  tr: "Abdülkais'in vaizi, Ali'nin yakın dostlarından biri, Muaviyet'i Ali'nin oklarından biri ve Arap hatiplerinden biri olarak tanımladı. Ali, Muaviye'ye bir mektup gönderdi; Muaviye, Mudar, Rabi'ah ve Abdülkays'ın soyağaçları üzerine tartıştı, ta ki ona 'Vay sana vay, Kureyş'e şan bıraktın.' dedi. Muaviye, 'Evet, onlara sadece kendilerine uygun olanı bıraktım.' diye cevap verdi. Sonra bunu Banu Haşim'e açıkladı. İbn Abbas ona 'el-Sud'id, el-Muru'ah, bilge adam ve şövalye' hakkında sordu. Kendisi de söylenenlerin hepsinde anlattı, ta ki 'Ey Suhan'ın oğlu, Arapların efendisisiniz.' dedi. Ebu Eyyub el-Ensari, Nehravan gününde Abdullah bin Vahb el-Rasbi'nin öldürülmesinde ortak oldu {alıntı::Muruj-al-Dhahab, s. 39-48}."
  id: "Pengkhotbah Abd al-Qais, salah satu rekan dekat Ali, menggambarkan Muawiyah sebagai salah satu panah Ali dan salah satu orator Arab. Ali mengirimkan surat kepadanya kepada Muawiyah, yang memperdebatkan silsilah Mudar, Rabi'ah, dan Abd al-Qays sampai ia berkata, 'Celakalah kamu, engkau telah meninggalkan kemuliaan Quraisy.' Ia menjawab, 'Ya, aku meninggalkan apa yang hanya layak untuk mereka.' Kemudian ia menjelaskannya kepada Banu Hashim. Ibn Abbas menanyakan kepadanya tentang 'al-Sud'id, al-Muru'ah, orang bijak, dan ksatria.' Ia menggambarkannya dalam segala hal yang dikatakan tentangnya, hingga ia berkata, 'Kau, wahai putra Suhan, adalah tuan bagi bangsa Arab.' Abu Ayyub al-Ansari bersekutu dalam pembunuhan Abdullah ibn Wahb al-Rasbi pada hari Nahrawan {cite:muruj-al-dhahab, hlm. 39-48}."
