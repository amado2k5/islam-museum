id: person/al-mustakfi-ii-cairo
class: person
label: { ar: "المستكفي بالله الثاني سليمان بن المتوكل" }
summary:
  ar: "خليفة القاهرة [٨٤٥–٨٥٤هـ]، أبو الربيع سليمان بن المتوكل، ولي الخلافة بعهد من أخيه الشقيق المعتضد وكتب له والد المؤلف السيوطي نسخة العهد، وكان من صلحاء الخلفاء صالحاً ديناً عابداً كثير التعبد والصلاة والتلاوة كثير الصمت منعزلاً عن الناس حسن السيرة وقال أخوه المعتضد لم أر على أخي سليمان منذ نشأ كبيرة، وكان والد السيوطي إماماً له عنده بمكان رفيع وقال لم ننشأ إلا في بيته وفضله وما أظن أنه وجد على ظهر الأرض آل خليفة بعد آل عمر بن عبد العزيز أعبد من آل بيت هذا الخليفة، مات يوم الجمعة سلخ ذي الحجة سنة أربع وخمسين وثمان مئة وله ثلاث وستون سنة ولم يعش والد المؤلف بعده إلا أربعين يوماً ومشى السلطان في جنازته وحمل نعشه بنفسه {cite:tarikh-khulafa-minhaj-1434 p. 773-774}. وفي شذرات الذهب بويع سليمان هذا بالخلافة يوم موت أخيه المعتضد بالله سنة خمس وأربعين وثمان مئة وأقام في الملك عشر سنين وبلغ من العز فوق أخيه وحمل السلطان نعشه {cite:shadharat-dhahab p. 284}."
  en: "Cairo caliph [845–854] — the author's own father wrote his deed of appointment and served as his imam: 'we grew up in none but his house and bounty; I doubt the earth bore a caliph's house more devout since Umar ibn Abd al-Aziz's'. He died Friday, last day of Dhu'l-Hijja 854; the sultan walked his funeral and bore the bier himself, and Suyuti's father died forty days later {cite:tarikh-khulafa-minhaj-1434 p. 773-774}."
