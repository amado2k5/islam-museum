id: person/al-mustakfi-ii-cairo
class: person
label: { ar: "المستكفي بالله الثاني سليمان بن المتوكل", en: "al-Mustakfi bi'llah II Sulayman ibn al-Mutawakkil", fr: "al-Mustakfi bi'llah II Sulayman ibn al-Mutawakkil", es: "al-Mustakfi bi'llah II Sulayman ibn al-Mutawakkil", ur: "المستقفی باللہ ثانی سلیمان بن المتوکل" }
summary:
  ar: "خليفة القاهرة [٨٤٥–٨٥٤هـ]، أبو الربيع سليمان بن المتوكل، ولي الخلافة بعهد من أخيه الشقيق المعتضد وكتب له والد المؤلف السيوطي نسخة العهد، وكان من صلحاء الخلفاء صالحاً ديناً عابداً كثير التعبد والصلاة والتلاوة كثير الصمت منعزلاً عن الناس حسن السيرة وقال أخوه المعتضد لم أر على أخي سليمان منذ نشأ كبيرة، وكان والد السيوطي إماماً له عنده بمكان رفيع وقال لم ننشأ إلا في بيته وفضله وما أظن أنه وجد على ظهر الأرض آل خليفة بعد آل عمر بن عبد العزيز أعبد من آل بيت هذا الخليفة، مات يوم الجمعة سلخ ذي الحجة سنة أربع وخمسين وثمان مئة وله ثلاث وستون سنة ولم يعش والد المؤلف بعده إلا أربعين يوماً ومشى السلطان في جنازته وحمل نعشه بنفسه {cite:tarikh-khulafa-minhaj-1434 p. 773-774}. وفي شذرات الذهب بويع سليمان هذا بالخلافة يوم موت أخيه المعتضد بالله سنة خمس وأربعين وثمان مئة وأقام في الملك عشر سنين وبلغ من العز فوق أخيه وحمل السلطان نعشه {cite:shadharat-dhahab p. 284}."
  en: "Cairo caliph [845–854] — the author's own father wrote his deed of appointment and served as his imam: 'we grew up in none but his house and bounty; I doubt the earth bore a caliph's house more devout since Umar ibn Abd al-Aziz's'. He died Friday, last day of Dhu'l-Hijja 854; the sultan walked his funeral and bore the bier himself, and Suyuti's father died forty days later {cite:tarikh-khulafa-minhaj-1434 p. 773-774}."
  fr: "Le calife du Caire [845-854] – le propre père de l'auteur a écrit son acte de nomination et a servi comme son imam : « Nous avons grandi dans rien que sa maison et sa générosité ; Je doute que la terre ait porté la maison d'un calife plus dévote depuis celle d'Umar ibn Abd al-Aziz. Il est mort vendredi, dernier jour de Dhu'l-Hijja 854 ; le sultan a marché ses funérailles et a porté la bière lui-même, et le père de Suyuti est mort quarante jours plus tard {cite:tarikh-khulafa-minhaj-1434 p. 773-774}."
  es: "Califa de El Cairo [845–854]: el propio padre del autor redactó su acta de nombramiento y fue su imán: «Nos criamos en su casa y bajo su generosidad; dudo que la tierra haya albergado una casa califal más devota desde la de Umar ibn Abd al-Aziz». Murió el viernes, último día de Dhu'l-Hijja de 854; el sultán acompañó su funeral y cargó el féretro él mismo, y el padre de Suyuti murió cuarenta días después {cite:tarikh-khulafa-minhaj-1434 p. 773-774}."
  ur: "قاہرہ خلیفہ [845-854] - مصنف کے اپنے والد نے اس کی تقرری کا عمل لکھا اور اس کے امام کی حیثیت سے خدمات انجام دیں: 'ہم اس کے گھر اور فضل کے علاوہ کسی اور میں نہیں پلے بڑھے؛ مجھے شک ہے کہ زمین نے عمر بن عبدالعزیز کے گھر سے زیادہ خلیفہ کے گھر کو جنم دیا ہے۔ آپ کا انتقال جمعہ 854 ذی الحجہ کے آخری دن ہوا۔ سلطان نے اس کا جنازہ چلایا اور خود بیئر اٹھایا، اور سیوطی کے والد کا چالیس دن بعد انتقال ہو گیا۔ 773-774}۔"
  tr: "Kahire Halifesi [845–854 H) Ebu el-Rabi' Süleyman bin el-Mutevikkil, kardeşi el-Mutadid'den bir antlaşmayla halifeliği devraldı. Yazarın babası ona antlaşmanın bir kopyasını yazdı. O, doğru halifeler arasındaydı; dindar, dindar ve ibadete, dua ve okunata çok bağlıydı, çoğu zaman sessiz, insanlardan uzaktı. Kardeşi el-Mutadid şöyle dedi: 'Kardeşim Süleyman'da büyürken hiç büyük bir kadın görmedim.' El-Suyuti'nin babası onun yüksek bir mekamdaki imamı idi ve şöyle dedi: Biz sadece onun evinde ve erdeminde büyüdük, bence dünyada bulunmadı El Halife ailesi, Ömer bin Abdülaziz ailesinden sonra bu halifenin ailesinin en dindar ailesiydi. 854 Hicri yılında, Zulacce günü Cuma günü vefat etti ve altmış üç yaşındaydı. Yazarın babası ondan sadece kırk gün sonra yaşadı. Sultan cenazesinde yürüdü ve tabutunu kendisi taşıdı {kaynak: Tarikh-khulafa-minhaj-1434, s. 773-774}. Şadharat al-Dhahab'da, bu Süleyman, kardeşi el-Mu'tadid Billah'ın 845 Hicri yılında öldüğü gün halifeliğe bağlılık yemini etmiş ve on yıl boyunca krallıkta kalarak kardeşinin üzerinde onur kazanmıştır. Sultan tabutunu taşımıştır {kaynak:shadharat-dhahab, s. 284}."
  id: "Khalifah Kairo [845–854 H], Abu al-Rabi' Sulayman ibn al-Mutawakkil, mengambil alih kekhalifahan melalui perjanjian dari saudaranya al-Mu'tadid. Ayah penulis menulis salinan perjanjian itu kepadanya. Ia termasuk di antara khalifah yang benar, saleh, taat, dan sangat setia pada ibadah, doa, dan pembacaan, sering diam, menjauh dari orang-orang. Saudaranya al-Mu'tadid berkata: 'Saya belum pernah melihat wanita besar dalam saudara saya Sulayman sejak ia tumbuh dewasa.' Ayah al-Suuti adalah imamnya yang memegang jabatan tinggi dan berkata: Kami hanya tumbuh di rumah dan kebajikannya, dan saya rasa ia tidak ditemukan di bumi Keluarga Al Khalifa, setelah keluarga Umar ibn Abd al-Aziz, adalah yang paling taat di antara keluarga khalifah ini. Ia meninggal pada hari Jumat, hari Dhu al-Hijjah, tahun 854 H, dan berusia enam puluh tiga tahun. Ayah penulis hanya hidup empat puluh hari setelahnya. Sultan berjalan di pemakamannya dan membawa peti matinya sendiri {cite:Tarikh-khulafa-minhaj-1434, hlm. 773-774}. Dalam Shadharat al-Dhahab, Suleiman ini bersumpah setia kepada kekhalifahan pada hari kematian saudaranya al-Mu'tadid Billah pada tahun 845 H, dan ia tetap di kerajaan selama sepuluh tahun, meraih kehormatan di atas saudaranya. Sultan membawa peti matinya {cite:shadharat-dhahab, hlm. 284}."
