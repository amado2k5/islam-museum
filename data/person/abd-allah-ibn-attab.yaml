id: person/abd-allah-ibn-attab
class: person
gender: male
label:
  ar: عبد الله بن عتاب
  en: Abd Allah ibn Attab al-Basri al-Dimashqi (traditionist)
summary:
  ar: 'محدث متقن ثقة، أبو العباس، البصري الدمشقي؛ سمع من هشام بن عمار وعيسى بن حماد وهارون بن سعيد الأيلي، وحدث عنه علي بن عمرو الحريري وشافع بن محمد الإسفراييني وأبو أحمد الحاكم؛ قال أبو أحمد الحاكم: رأيناه ثبتا. ويذكر المطبوع تاريخ الولادة والوفاة (320 و 224 هـ)، وهو مضطرب في ترتيب الأرقام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}'
  en: A precise and reliable traditionist, Abu al-Abbas, of Basra and Damascus; he heard from Hisham ibn Ammar, Isa ibn Hammad and Harun ibn Sa'id al-Ayli; transmitted by Ali ibn Amr al-Hariri, Shafi' ibn Muhammad al-Isfara'ini and Abu Ahmad al-Hakim, who called him reliable. The printed dates are given as (320 and 224 AH), which appear reversed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}
  ur: متقن اور ثقہ محدث، ابو العباس، بصرہ اور دمشق کے؛ ہشام بن عمار اور عیسیٰ بن حماد سے سماع کیا؛ ابو احمد الحاکم نے ثبت کہا۔ مطبوعہ تاریخیں (320 اور 224ھ) الٹی معلوم ہوتی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}
