summary:
  ar: "صاحب المغرب، آخر ملوك بني عبد المؤمن؛ جمع الجيوش وتوثب على مراكش وقتل ابن عمه صاحبها أبا حفص، وكان بطلاً شجاعاً مقداماً {cite:shadharat-dhahab p. 569}."
  en: "The last Almohad king — rallied the armies, leapt on Marrakesh and killed his cousin its lord Abu Hafs; 'a champion, brave and daring' {cite:shadharat-dhahab p. 569}."
  fr: "Le dernier roi almohade — il rallia les armées, fondit sur Marrakech et tua son cousin, seigneur de la ville, Abu Hafs ; « un champion, brave et audacieux » {cite:shadharat-dhahab p. 569}."
  es: "El último rey almohade reunió a los ejércitos, saltó sobre Marrakech y mató a su primo, el señor Abu Hafs; \"un campeón, valiente y audaz\" {cita: shadharat-dhahab p. 569}."
  ur: "آخری الموحد بادشاہ - نے فوجیں جمع کیں، مراکش پر چھلانگ لگا دی اور اپنے چچا زاد بھائی ابو حفص کو قتل کر دیا۔ 'ایک چیمپئن، بہادر اور بہادر' 569}۔"
  tr: "Beni Abdülmümin kabilesinin son kralı olan Fas hükümdarı, ordularını toplayıp Marakeş'e saldırdı ve kuzeni, Marakeş hükümdarı Ebu Hafs'ı öldürdü. Cesur ve yiğit bir kahramandı. {cite:shadharat-dhahab s. 569}"
  id: "Penguasa Maroko, raja terakhir dari Bani Abd al-Mu’min, mengumpulkan pasukan dan menyerang Marrakesh serta membunuh sepupunya, penguasa kota itu, Abu Hafs. Ia adalah pahlawan yang gagah berani. {cite:shadharat-dhahab p. 569}."
