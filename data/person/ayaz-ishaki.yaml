summary:
  ar: "شخصية قيادية في الحركة الوطنية التترية (1878–1954)، مؤلف وصحفي وناشر وسياسي: كان أمين الدولة في دولة إيدل أورال قصيرة العمر سنة 1918، وهاجر سنة 1920 فقضى بقية حياته ينظّم تتار المهجر وينشر دفاعا عنهم، وتوفي في أنقرة سنة 1954 ودُفن في إسطنبول."
  en: "Leading figure of the Tatar national movement (1878–1954): author, journalist, publisher and politician, secretary of state of the short-lived Idel-Ural State in 1918. He emigrated in 1920 and spent the rest of his life organising the Tatar diaspora and publishing in its defence; he died at Ankara in 1954 and was buried at Istanbul."
  ur: "تاتاری قومی تحریک کی نمایاں شخصیت (1878–1954): مصنف، صحافی، ناشر اور سیاست دان، 1918 میں قلیل المدت ایدل اورال ریاست کے سیکریٹری آف اسٹیٹ۔ وہ 1920 میں ہجرت کر گئے اور باقی زندگی تاتاری مہاجرین کو منظم کرنے اور ان کے دفاع میں تصانیف شائع کرنے میں گزاری؛ 1954 میں انقرہ میں انتقال ہوا اور استنبول میں دفن ہوئے۔"
