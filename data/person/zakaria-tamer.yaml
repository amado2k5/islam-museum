summary:
  ar: "كاتب قصة وصحفي سوري وُلد في دمشق سنة 1931، بدأ حدّادًا وعلّم نفسه بنفسه، وصار من أكثر كتّاب القصة القصيرة قراءة وترجمة في الأدب السوري الحديث ومن أبرز كتّاب قصص الأطفال بالعربية. يعيش في لندن منذ 1981، ومن مجموعاته «النمور في اليوم العاشر» و«الحصرم»."
  en: "Syrian short-story writer and journalist born in Damascus in 1931. He began as a blacksmith, educated himself, and became one of the most widely read and translated short-story writers of modern Syrian literature and a foremost author of Arabic children's stories. He has lived in London since 1981; his collections include Tigers on the Tenth Day and Sour Grapes."
  ur: "سوری افسانہ نگار اور صحافی، جو 1931 میں دمشق میں پیدا ہوئے۔ انہوں نے لوہار کے کام سے آغاز کیا، خود تعلیم حاصل کی، اور جدید سوری ادب کے سب سے زیادہ پڑھے اور ترجمہ ہونے والے افسانہ نگاروں اور عربی بچوں کی کہانیوں کے ممتاز مصنفین میں شمار ہوئے۔ وہ 1981 سے لندن میں رہ رہے ہیں؛ ان کے مجموعوں میں «النمور في اليوم العاشر» اور «الحصرم» شامل ہیں۔"
