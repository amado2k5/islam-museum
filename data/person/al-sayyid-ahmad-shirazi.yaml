summary:
  ar: "السيد أحمد الحسيني الشيرازي الأبيجي الإمام العالم؛ ولد بشيراز وأخذ عن الشيوخ ودخل مكة والمدينة وبيت المقدس والشام وتلقى عن بعض علمائها وحدث وأقبلت ملوك عصره عليه ومات بمكة في جمادى الأولى سنة خمس وتسعين وثمانمائة عن إحدى وسبعين سنة {cite:shadharat-dhahab p. 357}."
