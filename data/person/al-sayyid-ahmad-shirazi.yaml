  es: "Al-Sayyid Ahmad al-Shirazi — el erudito husayni que viajó desde Shiraz a través de La Meca, Medina, Jerusalén y Damasco, «y los reyes de su época recurrieron a él»; murió en La Meca en Jumada I de 895 a los setenta y un años {cita: shadharat-dhahab p. 357}."
  ur: "السید احمد الشیرازی - حسینی 'عالم جو شیراز سے مکہ، مدینہ، یروشلم اور دمشق کے راستے سفر کیا اور اس کے دور کے بادشاہ ان کی طرف متوجہ ہوئے'؛ مکہ میں جمعہ 895ء کو اکہتر میں وفات پائی۔ 357}۔"
