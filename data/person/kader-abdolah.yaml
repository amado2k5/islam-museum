summary:
  ar: "كاتب وشاعر وكاتب عمود إيراني هولندي، وُلد في آراك سنة 1954 باسم حسين سجادي قائم‌مقامی فراهانی. ناشط يساري سابق فرّ من إيران واستقر في هولندا سنة 1988 ويكتب بالهولندية؛ واختيرت روايته «دار المسجد» (2005) من بين أفضل الروايات الهولندية على الإطلاق، ونشر ترجمة هولندية للقرآن سنة 2008."
  en: "Iranian-Dutch writer, poet and columnist, born in Arak in 1954 under the name Hossein Sadjadi Ghaemmaghami Farahani. A former left-wing activist who fled Iran and settled in the Netherlands in 1988, he writes in Dutch; The House of the Mosque (2005) was voted among the best Dutch novels ever written, and he published a Dutch translation of the Qur'an in 2008."
  ur: "ایرانی ہالینڈی مصنف، شاعر اور کالم نگار، 1954 میں اراک میں حسین سجادی قائم مقامی فراهانی کے نام سے پیدا ہوئے۔ سابق بائیں بازو کے کارکن، وہ ایران سے فرار ہو کر 1988 میں نیدرلینڈز میں آباد ہوئے اور ولندیزی زبان میں لکھتے ہیں؛ ان کا ناول «دی ہاؤس آف دی موسک» (2005) بہترین ولندیزی ناولوں میں شمار ہوا، اور 2008 میں انہوں نے قرآن کا ولندیزی ترجمہ شائع کیا۔"
