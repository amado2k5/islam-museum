id: person/afira-al-abida
class: person
label: { ar: "عفيرة العابدة", en: "Ufayra the Devout", fr: "Ufayra la Dévote", ur: "عفیرہ عابدہ", es: "Ufayra the Devout" }
gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، بكت حتى عميت، وقالت لمن تأسّف على عماها إن عمى القلب عن الله أشد من عمى العين عن الدنيا، وكانت لا تنام الليل، وتقول إنها عصت الله بكل جارحة فلئن أعانها لتطيعنّه بكل جارحة عصته بها."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who wept until she went blind; to someone who pitied her blindness she said that the heart's blindness to God is worse than the eye's blindness to the world. She did not sleep at night, and said that she had disobeyed God with every limb and, if He helped her, would obey Him with every limb she had disobeyed Him with."
  fr: "Femme dévote de Bassora mentionnée par Ibn al-Jawzi dans Sifat al-Safwa, qui pleura jusqu'à devenir aveugle ; à quelqu'un qui plaignait sa cécité, elle dit que l'aveuglement du cœur à Dieu est pire que celui de l'œil au monde. Elle ne dormait pas la nuit et disait avoir désobéi à Dieu avec chaque membre et, s'Il l'aidait, Lui obéirait avec chacun des membres par lesquels elle Lui avait désobéi."
  es: "Una mujer devota de Basora, según relata Ibn al-Jawzi en Sifat al-Safwa, lloró hasta quedarse ciega. A quien se compadeció de su ceguera, le dijo que la ceguera del corazón ante Dios es peor que la ceguera de los ojos ante el mundo. No dormía por las noches y afirmaba haber desobedecido a Dios con todo su ser y que, si Él la ayudaba, le obedecería con todo aquello con lo que lo había desobedecido."
  ur: "بصرہ کی ایک پرہیزگار عورت جو ابن الجوزی نے صفات الصفوی میں درج کی ہے، جو اندھی ہونے تک روتی رہی۔ اس نے اپنے اندھے پن پر ترس کھا کر کہا کہ خدا کے نزدیک دل کا اندھا ہونا دنیا کے لیے آنکھوں کے اندھا ہونے سے بھی زیادہ برا ہے۔ وہ رات کو نہیں سوتی تھی، اور کہتی تھی کہ اس نے ہر اعضاء سے خدا کی نافرمانی کی ہے اور اگر وہ اس کی مدد کرے گا تو ہر اس عضو سے اس کی اطاعت کرے گی جس سے اس نے اس کی نافرمانی کی ہے۔"
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinde bahsettiği Basralı bir ibadet eden kadın, gözleri kör olana kadar ağladı. Körlüğünden dolayı üzülenlere, kalbin Allah'a karşı körlüğünün, gözün dünyaya karşı körlüğünden daha şiddetli olduğunu söyledi. Geceleri uyuyamadı ve her uzvuyla Allah'a isyan ettiğini, eğer Allah ona yardım ederse, isyan ettiği her uzvuyla O'na itaat edeceğini söyledi."
  id: "Seorang wanita penyembah dari Basra, yang disebutkan oleh Ibnu al-Jawzi dalam “Sifat al-Safwa,” menangis hingga buta. Ia berkata kepada orang-orang yang sedih karena kebutaannya bahwa kebutaan hati terhadap Tuhan lebih parah daripada kebutaan mata terhadap dunia. Ia tidak tidur di malam hari, dan ia berkata bahwa ia telah melanggar perintah Tuhan dengan setiap anggota tubuhnya, jadi jika Tuhan menolongnya, ia akan menaati-Nya dengan setiap anggota tubuh yang telah ia langgar."
