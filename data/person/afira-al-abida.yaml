summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، بكت حتى عميت، وقالت لمن تأسّف على عماها إن عمى القلب عن الله أشد من عمى العين عن الدنيا، وكانت لا تنام الليل، وتقول إنها عصت الله بكل جارحة فلئن أعانها لتطيعنّه بكل جارحة عصته بها."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who wept until she went blind; to someone who pitied her blindness she said that the heart's blindness to God is worse than the eye's blindness to the world. She did not sleep at night, and said that she had disobeyed God with every limb and, if He helped her, would obey Him with every limb she had disobeyed Him with."
