summary:
  ar: "محسن حامد (وُلد سنة 1971) روائي باكستاني بريطاني وُلد في لاهور. تلقى تعليمه في برينستون وكلية الحقوق في هارفارد، وعمل في الاستشارات الإدارية قبل روايته الأولى «Moth Smoke» (2000)؛ واشتهر عالميًا برواية «The Reluctant Fundamentalist» (2007)، ثم أتبعها بـ«How to Get Filthy Rich in Rising Asia» (2013) و«Exit West» (2017) و«The Last White Man» (2022). عاد إلى لاهور سنة 2009 ويقضي وقته بينها وبين نيويورك ولندن، ويحمل الجنسيتين الباكستانية والبريطانية."
  en: "Mohsin Hamid (born 1971) is a Pakistani-British novelist born in Lahore. Educated at Princeton and Harvard Law School, he worked in management consulting before his first novel, Moth Smoke (2000); The Reluctant Fundamentalist (2007) made him internationally known, followed by How to Get Filthy Rich in Rising Asia (2013), Exit West (2017) and The Last White Man (2022). He moved back to Lahore in 2009 and divides his time between Lahore, New York and London, holding dual Pakistani and British citizenship."
  ur: "محسن حمید (پیدائش 1971) لاہور میں پیدا ہونے والے پاکستانی برطانوی ناول نگار ہیں۔ پرنسٹن اور ہارورڈ لا اسکول سے تعلیم پائی، پہلے ناول «Moth Smoke» (2000) سے پہلے انتظامی مشاورت میں کام کیا؛ «The Reluctant Fundamentalist» (2007) نے انہیں عالمی شہرت دی، پھر «How to Get Filthy Rich in Rising Asia» (2013)، «Exit West» (2017) اور «The Last White Man» (2022) آئے۔ 2009 میں لاہور واپس آ گئے اور وقت لاہور، نیویارک اور لندن کے درمیان گزارتے ہیں؛ دوہری پاکستانی و برطانوی شہریت رکھتے ہیں۔"

