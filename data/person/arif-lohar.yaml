summary:
  ar: "مغنّي البنجاب الشعبي الباكستاني (وُلد 18 أبريل 1966)، ابن عالم لوهار وخليفته في فنّه؛ يغني مصحوباً بالچمٹا، واشتهر بأغنية «جغني» مع نوران لال (2006) وبأدائه «ألف الله (جغني)» مع ميشا شفيع في كوك ستوديو (2010)، ونال تمغة حسن الأداء (2005)، ومثّل في نحو 45 فيلماً بنجابياً."
  en: "Pakistani Punjabi folk singer (born 18 April 1966), son and successor of Alam Lohar; he sings accompanied by the chimta, became famous with Jugni alongside Nooran Lal (2006) and his Coke Studio performance of Alif Allah (Jugni) with Meesha Shafi (2010), acted in some 45 Punjabi films, and received the Pride of Performance (2005)."
  ur: "پاکستانی پنجابی لوک گلوکار (پیدائش 18 اپریل 1966ء)، عالم لوہار کے بیٹے اور ان کے فن کے وارث؛ چمٹے کے ساتھ گاتے ہیں، نوران لال کے ساتھ «جگنی» (2006ء) اور کوک اسٹوڈیو میں میشا شفیع کے ساتھ «الف اللہ (جگنی)» (2010ء) سے عالمی شہرت پائی، تقریباً 45 پنجابی فلموں میں اداکاری کی اور تمغائے حسن کارکردگی (2005ء) ملا۔"
