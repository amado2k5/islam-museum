  ar: "بطاقة أولية لصالحة دل آشوب سلطان، حسكة إبراهيم ووالدة سلطان سليمان الثاني، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Saliha Dilaşub Sultan, haseki of Ibrahim and valide sultan to Suleiman II, named from an open reference description (Wikidata); her entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Saliha Dilaşub Sultan, haseki de Ibrahim y valide sultan de Solimán II, nombrada a partir de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de Saliha Dilaşub Sultan, haseki d'Ibrahim et valide sultan de Suleiman II, nommée d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "صالحہ دلاب سلطان کے لیے ڈرافٹ کارڈ، ابراہیم کی ہسیکی اور سلیمان ثانی کے لیے درست سلطان، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Dal Ashub Sultan, Hasaka İbrahim ve Sultan II. Süleyman'ın annesi lehine ön hazırlık kartı, açık referans açıklamasında (Wikidata) bahsedilmiştir. Al-Sallabi'nin Osmanlı İmparatorluğu Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan untuk Dal Ashub Sultan, Hasaka Ibrahim, dan ibu Sultan Suleiman II, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahan Sejarah Kekaisaran Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
