summary:
  ar: ناشط سلام وإعلامي فلسطيني وُلد سنة 1980 في القدس. قاد برامج حوار إسرائيلي-فلسطيني، وعمل مديرًا تنفيذيًا لمركز أديان العالم والدبلوماسية وحل النزاعات بجامعة جورج ماسون، ومن أبرز وجوه بناء السلام الشبابية.
  en: Palestinian peace activist and journalist, born 1980 in Jerusalem. He led Israeli-Palestinian dialogue programmes, served as executive director of the Center for World Religions, Diplomacy and Conflict
    Resolution at George Mason University, and is among the most visible young peacebuilders.
  ur: فلسطینی امن کارکن اور صحافی، 1980 میں یروشلم میں پیدا ہوئے۔ انہوں نے اسرائیلی-فلسطینی مکالماتی پروگرام چلائے، جارج میسن یونیورسٹی کے سینٹر فار ورلڈ ریلیجنز، ڈپلومیسی اینڈ کنفلکٹ ریزولوشن کے ایگزیکٹو
    ڈائریکٹر رہے اور نوجوان امن سازی کے نمایاں چہرے ہیں۔
  es: "Activista palestino por la paz y periodista, nacido en 1980 en Jerusalén. Dirigió programas de diálogo israelo-palestino, fue director ejecutivo del Centro para las Religiones Mundiales, la Diplomacia y la Resolución de Conflictos en la Universidad George Mason, y es uno de los jóvenes constructores de paz más destacados."
  fr: "Militant pacifiste et journaliste palestinien, né en 1980 à Jérusalem. Il a dirigé des programmes de dialogue israélo-palestinien, a été directeur exécutif du Centre pour les religions du monde, la diplomatie et la résolution des conflits à l'Université George Mason, et compte parmi les jeunes artisans de la paix les plus en vue."
  tr: "1980 yılında Kudüs'te doğmuş bir Filistinli barış aktivisti ve medya profesyoneli. İsrail-Filistin diyalog programlarına liderlik etti, George Mason Üniversitesi'nde Dünya Dinleri, Diplomasi ve Çatışma Çözümü Merkezi'nin icra direktörü olarak görev yaptı ve gençlik barış inşası konusunda en önde gelen figürlerden biriydi."
  id: "Seorang aktivis perdamaian Palestina dan profesional media, lahir pada tahun 1980 di Yerusalem. Ia memimpin program dialog Israel-Palestina, menjabat sebagai direktur eksekutif Center for World Religions, Diplomacy, and Conflict Resolution di George Mason University, dan merupakan salah satu tokoh perdamaian muda paling menonjol."
