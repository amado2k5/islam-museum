summary:
  ar: "كاتب وخطيب ومقدّم تلفزيوني تركي، وُلد في 10 فبراير 1961 في قضاء جامالي بولاية دنيزلي، تخرّج في كلية الحقوق بجامعة إسطنبول سنة 1984، واشتهر بتقديم الأدب التركي الكلاسيكي ⁦(أدب الديوان)⁩ بلغة مبسّطة في برامج مثل «جان فيرن بروانلر» وفي كتب منها سلسلة تحمل الاسم نفسه وكتاب «فابريكا أياري»، ويُقال إنه يحفظ نحو سبعة آلاف بيت من شعر الديوان، وتُتداول محاضراته لمئات آلاف المشتركين على يوتيوب."
  en: "Turkish writer, speaker and television presenter, born on 10 February 1961 in the Çameli district of Denizli. A law graduate of Istanbul University (1984) who worked for years in public legal service, he became widely known for presenting classical Turkish (divan) literature in an accessible style, in programmes such as Can Veren Pervaneler and in books including the series of that name and Fabrika Ayarı; he is said to know some 7,000 divan couplets by heart, and his talks circulate to hundreds of thousands of YouTube subscribers."
  ur: "ترک مصنف، خطیب اور ٹیلی ویژن میزبان، جو 10 فروری 1961ء کو دینیزلی کے علاقے چامالی میں پیدا ہوئے۔ وہ استنبول یونیورسٹی کے شعبۂ قانون کے 1984ء کے گریجویٹ ہیں اور برسوں سرکاری قانونی خدمت میں رہے؛ وہ کلاسیکی ترک (دیوان) ادب کو سادہ زبان میں پیش کرنے سے مشہور ہوئے، جن میں «جان ویرن پروانہ لر» جیسے پروگرام اور اسی نام کی کتابی سلسلہ اور «فابریکا آیاری» شامل ہیں؛ کہا جاتا ہے کہ انہیں دیوان کے تقریباً سات ہزار اشعار زبانی یاد ہیں، اور ان کی گفتگو یوٹیوب پر لاکھوں سبسکرائبرز تک پہنچتی ہے۔"
