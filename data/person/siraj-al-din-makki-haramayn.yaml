gender: male
summary:
  ar: "قاضي الحرمين الشريف الحسني سراج الدين عبد اللطيف المكي الحنفي؛ ولد في شعبان سنة تسع وثمانين وسبعمائة بمكة المشرفة ونشأ بها وسمع الحديث على العفيف النشاوري والجمال الأسيوطي وإبراهيم بن صديق وغيرهم وأجاز له السراج البلقيني والحافظان الزين العراقي والنور الهيثمي والسراج بن الملقن والبرهان الشامي وأبو هريرة بن الذهبي وأبو الخير بن العلائي وجماعة وخرج له التقي بن فهد مشيخة، وولي إمامة الحنابلة بالمسجد الحرام وقضاء مكة المشرفة ثم جمع له بين قضاء الحرمين الشريفين مكة والمدينة سنة سبع وأربعين وثمانمائة واستمر إلى أن مات وهو أول من ولي قضاء الحنابلة بالحرمين، ودخل بلاد العجم غير مرة وكان له حظ وافر عند الملوك والأعيان، وتوفي بعلة الإسهال ورمي الدم في ضحى يوم الاثنين سابع شوال سنة ثلاث وخمسين وثمانمائة بمكة المشرفة ودفن بالمعلاة {cite:shadharat-dhahab p. 277-278}."
  en: "Siraj al-Din 'Abd al-Latif (b. Mecca Sha'ban 799) — the sharif first to hold the judgeship of BOTH Sanctuaries combined, Mecca and Medina from 847, after serving as the Haram's Hanafi imam and Mecca's qadi; died of dysentery Monday morning 7 Shawwal 853, buried at al-Ma'la {cite:shadharat-dhahab p. 277-278}."
