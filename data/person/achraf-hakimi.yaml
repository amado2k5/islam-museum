summary:
  ar: "لاعب كرة قدم مغربي محترف (وُلد سنة 1998 في مدريد لأبوين مغربيين). ظهير أيمن نشأ في خيتافي وتدرّج في أكاديمية ريال مدريد، ولعب لبوروسيا دورتموند وإنتر ميلان، ومنذ 2021 لباريس سان جيرمان الذي فاز معه بدوري أبطال أوروبا مرتين؛ يقود منتخب المغرب، وبلغ معه نصف نهائي كأس العالم 2022 وفاز بكأس أمم أفريقيا 2025، وسُمّي أفضل لاعب أفريقي لسنة 2025."
  en: "Moroccan professional footballer (born 1998 in Madrid to Moroccan parents). A right-back raised in Getafe who came through Real Madrid's academy, played for Borussia Dortmund and Inter Milan, and since 2021 for Paris Saint-Germain, with whom he has won the Champions League twice; he captains Morocco, reached the 2022 World Cup semi-finals with them, won the 2025 Africa Cup of Nations, and was named African Player of the Year for 2025."
  ur: "مراکشی پیشہ ور فٹبالر (پیدائش 1998، میڈرڈ، مراکشی والدین کے ہاں)۔ دائیں طرف کے مدافع جو گیتافے میں پلے بڑھے اور ریال میڈرڈ کی اکیڈمی سے نکلے، بوروسیا ڈورٹمنڈ اور انٹر میلان کے لیے کھیلے، اور 2021 سے پیرس سینٹ جرمین میں ہیں جس کے ساتھ انہوں نے دو بار چیمپئنز لیگ جیتی؛ وہ مراکش کے کپتان ہیں، اس کے ساتھ 2022 ورلڈ کپ کے سیمی فائنل تک پہنچے، 2025 افریقہ کپ آف نیشنز جیتا، اور 2025 کے افریقی کھلاڑی آف دی ایئر قرار پائے۔"
