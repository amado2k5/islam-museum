summary:
  ar: "الملا علاء الدين علي العربي العالم الفاضل، أصله من نواحي حلب فقرأ على علمائها ثم قدم بلاد الروم فقرأ على الملا الكوراني واتصل بخدمة الملا خضر بك بن جلال الدين فحصل عنده علوماً كثيرة، وصار معيداً بمدرسة دار الحديث بأدرنة وصنف هناك حواشي شرح العقائد، ثم تنقل في المدارس إلى أن تولى مدرسة ببلدة مغنيسا فاشتغل بالعلم غاية الاشتغال وبطريقة التصوف فجمع بين رياستي العلم والعمل، وكان يختلي خلوات أربعينية، ويُحكى أنه قال لإمام زاره وقد حمل رسالة واردات لابن قاضي سماوة «إني أجد منك رائحة النجاسة» فلما سقطت الرسالة من حضنه نظر فيها فوجد فيها ما يخالف الإجماع فأمر بإحراقها، ثم صار مفتياً بالقسطنطينية إلى أن مات بها سنة إحدى وتسعمائة، وكان له ذكر قلبي يسمع من بعيد بما يغلب صوت قلبه على صوته، وله حواشٍ على المقدمات الأربع وهو أول من حشّى عليها {cite:shadharat-dhahab p. 421-422}."
  en: "An Aleppine who studied under Molla al-Kurani then served Khidr Beg, repetiteur at Edirne's Dar al-Hadith, then master of the Manisa madrasa where he joined the leadership of learning and the Sufi path — forty-day retreats, a heart-dhikr audible from afar, the tale of smelling 'the scent of impurity' on a visiting imam carrying Ibn Qadi Samawna's treatise which he then ordered burned; ended as mufti of Constantinople, first to gloss the Four Muqaddimat, d. 901 {cite:shadharat-dhahab p. 421-422}."
died: { edtf: "1495/1496", hijri: "0901", calendar: julian, precision: year, status: tradition, derived: true, note: "901 بالقسطنطينية؛ التحويل مشتق {cite:shadharat-dhahab p. 422}", sources: [source/shadharat-dhahab] }
