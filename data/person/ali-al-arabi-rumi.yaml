summary:
  ar: "الملا علاء الدين علي العربي العالم الفاضل، أصله من نواحي حلب فقرأ على علمائها ثم قدم بلاد الروم فقرأ على الملا الكوراني واتصل بخدمة الملا خضر بك بن جلال الدين فحصل عنده علوماً كثيرة، وصار معيداً بمدرسة دار الحديث بأدرنة وصنف هناك حواشي شرح العقائد، ثم تنقل في المدارس إلى أن تولى مدرسة ببلدة مغنيسا فاشتغل بالعلم غاية الاشتغال وبطريقة التصوف فجمع بين رياستي العلم والعمل، وكان يختلي خلوات أربعينية، ويُحكى أنه قال لإمام زاره وقد حمل رسالة واردات لابن قاضي سماوة «إني أجد منك رائحة النجاسة» فلما سقطت الرسالة من حضنه نظر فيها فوجد فيها ما يخالف الإجماع فأمر بإحراقها، ثم صار مفتياً بالقسطنطينية إلى أن مات بها سنة إحدى وتسعمائة، وكان له ذكر قلبي يسمع من بعيد بما يغلب صوت قلبه على صوته، وله حواشٍ على المقدمات الأربع وهو أول من حشّى عليها {cite:shadharat-dhahab p. 421-422}."
  en: "An Aleppine who studied under Molla al-Kurani then served Khidr Beg, repetiteur at Edirne's Dar al-Hadith, then master of the Manisa madrasa where he joined the leadership of learning and the Sufi path — forty-day retreats, a heart-dhikr audible from afar, the tale of smelling 'the scent of impurity' on a visiting imam carrying Ibn Qadi Samawna's treatise which he then ordered burned; ended as mufti of Constantinople, first to gloss the Four Muqaddimat, d. 901 {cite:shadharat-dhahab p. 421-422}."
  fr: "Un Aleppin qui a étudié sous Molla al-Kurani a ensuite servi Khidr Beg, répétiteur au Dar al-Hadith d'Edirne, alors maître de la madrasa Manisa où il a rejoint la direction de l'apprentissage et le chemin soufi - retraites de quarante jours, un cœur-dhikr audible de loin, l'histoire de sentir « l'odeur d'impureté » sur un imam visite portant Qadi fini comme mufti de Constantinople, le premier à gloser les Quatre Muqaddimat, est mort en 901 {cite:shadharat-dhahab p. 421-422}."
  es: "Un habitante de Alepo que estudió con Molla al-Kurani y luego sirvió a Khidr Beg, repetidor en Dar al-Hadith de Edirne, y luego maestro de la madrasa Manisa, donde se unió al liderazgo del aprendizaje y el camino sufí: retiros de cuarenta días, un dhikr del corazón audible desde lejos, la historia de oler \"el aroma de la impureza\" en un imán visitante que llevaba el tratado de Ibn Qadi Samawna, el cual luego ordenó quemar; terminó como muftí de Constantinopla, el primero en glosar las Cuatro Muqaddimat, m. 901 {cite:shadharat-dhahab p. 421-422}."
  ur: "ایک حلب جس نے مولا الکرانی کے ماتحت تعلیم حاصل کی اس کے بعد ادرنے کے دار الحدیث میں دہرائے جانے والے خضر بیگ کی خدمت کی، پھر مانیسا مدرسہ کے ماسٹر جہاں وہ علم کی قیادت اور صوفی راہ میں شامل ہوئے - چالیس دن کا اعتکاف، دور سے سننے والا دل کا ذکر، خوشبو لے جانے کی داستان۔ ابن قدی سماونا کا مقالہ جسے اس نے جلانے کا حکم دیا۔ قسطنطنیہ کے مفتی کے طور پر ختم ہوا، سب سے پہلے چار مقدّمیت کی تعریف کی۔ 901 {حوالہ: شدھارت ذہاب ص۔ 421-422}۔"
  tr: "Mele Alaa al-Din Ali al-Arabi bilgili bir alimdi. Kökeni Halep bölgelerinden geliyordu; burada alimlerin yanında eğitim aldı, sonra Romalıların topraklarına geldi, Mele el-Kurani'nin yanında eğitim aldı ve Molla Hidr Bey bin Celaleddin'in hizmetine katılarak birçok bilim bilgisi edindi. Edirne'deki Dar al-Hadis okulunda öğretim asistanı oldu ve burada mezhebin açıklaması üzerine kenar notlar yazdı. Daha sonra okullar arasında gidip gelene kadar Magnisa kasabasında bir okulu devraldı; burada en yüksek bilgiye ve tasavvuf yöntemine kendini adadı; bilgi ve uygulamanın liderliğini birleştirdi. Kendini Arbain inzivalarına kapanırdı ve kendisini ziyaret eden bir imama anlattığı söylenir İbn Kadi Samava'dan bir mektup taşıdı: 'Senden kirlilik kokusu alıyorum.' Mektup kucağından düştüğünde içine baktı ve uzlaşmaya aykırı bir şey buldu, bu yüzden yakılmasını emretti. Sonra İstanbul'da müftü oldu ve 901 yılında orada öldü. Kalbimin anısını uzaktan duydu, kalbinin sesi kendi kalbinin önüne geçti. Dört önsöz üzerine kenar notları yazdı ve onları ilk dolduran oldu {atıf:shadharat-dhahab, s. 421-422}."
  id: "Mulla Alaa al-Din Ali al-Arabi adalah seorang ulama yang berilmu. Asal-usulnya berasal dari daerah Aleppo, di mana ia belajar di bawah para cendekiawan, kemudian datang ke tanah Romawi, belajar di bawah Mulla al-Kurani, dan bergabung dengan pelayanan Mulla Khidr Bey ibn Jalal al-Din, di mana ia memperoleh banyak ilmu. Ia menjadi asisten pengajar di sekolah Dar al-Hadis di Edirne, di mana ia menulis catatan pinggir tentang penjelasan agama. Ia kemudian berpindah sekolah hingga mengambil alih sebuah sekolah di kota Magnisa, di mana ia mendedikasikan diri pada pengetahuan dan metode tasawuf yang paling tinggi, menggabungkan kepemimpinan pengetahuan dan praktik. Ia biasa mengasingkan diri di pengasingan Arbaeen, dan konon ia menceritakan kepada seorang imam yang mengunjunginya Ia membawa surat dari Ibn Qadi Samawa: 'Aku mencium bau kotoran darimu.' Ketika surat itu jatuh dari pangkuannya, ia melihatnya dan menemukan sesuatu yang bertentangan dengan konsensus, sehingga ia memerintahkan pembakarannya. Ia kemudian menjadi mufti di Konstantinopel hingga wafat di sana pada tahun 901. Ia memiliki ingatan tentang hatiku, terdengar dari kejauhan, dengan suara hatinya mengalahkan hatinya sendiri. Ia menulis catatan pinggir pada empat pendahuluan dan menjadi yang pertama mengisinya {cite:shadharat-dhahab, hlm. 421-422}."
