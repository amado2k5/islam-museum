summary:
  ar: "فرج الرخجي ابن زياد؛ كان صبياً في سبي معن بن زائدة من زابلستان وكان يحدث أن معناً رأى غباراً أثارته حوافر حمير وحشية فظنه جيشاً يأخذ السبي فوضع السيف فيهم وأن أباه حنى عليه وهو يقول اقتلوني ولا تقتلوا ابني ثم تبين أمر الغبار فأمسك."
  en: "Faraj al-Rukhkhaji, Ziyad's son; a boy among Ma'n's Zabulistan captives — he told how wild-ass dust made Ma'n put the sword to them, his father bent over him saying 'kill me, not my son', till the truth of the dust stayed his hand."
