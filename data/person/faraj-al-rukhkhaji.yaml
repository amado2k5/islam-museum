summary:
  ar: "فرج الرخجي ابن زياد؛ كان صبياً في سبي معن بن زائدة من زابلستان وكان يحدث أن معناً رأى غباراً أثارته حوافر حمير وحشية فظنه جيشاً يأخذ السبي فوضع السيف فيهم وأن أباه حنى عليه وهو يقول اقتلوني ولا تقتلوا ابني ثم تبين أمر الغبار فأمسك."
  en: "Faraj al-Rukhkhaji, Ziyad's son; a boy among Ma'n's Zabulistan captives — he told how wild-ass dust made Ma'n put the sword to them, his father bent over him saying 'kill me, not my son', till the truth of the dust stayed his hand."
  es: "Faraj al-Rukhkhaji, hijo de Ziyad; un muchacho entre los cautivos de Ma'n en Zabulistán, contó cómo el polvo salvaje hizo que Ma'n les apuntara con la espada, mientras su padre se inclinaba sobre él diciéndole \"mátame a mí, no a mi hijo\", hasta que la verdad del polvo detuvo su mano."
  fr: "Faraj al-Rukhkhaji, le fils de Ziyad; un garçon parmi les captifs de Ma'n au Zabulistan — il a raconté comment la poussière d'âne sauvage a poussé Ma'n à les frapper avec son épée, son père penché sur lui disant « tuez-moi, pas mon fils », jusqu'à ce que la vérité sur la poussière arrête sa main."
  ur: "فراج الرخجی، زیاد کا بیٹا؛ معن کے زابلستان کے اسیروں میں سے ایک لڑکا — اس نے بتایا کہ کس طرح جنگلی گدھے کی دھول نے معن کو تلوار تھما دی، اس کا باپ اس پر جھک گیا کہ 'مجھے مارو، میرے بیٹے کو نہیں'، یہاں تک کہ خاک کی حقیقت اس کے ہاتھ میں رہی۔"
