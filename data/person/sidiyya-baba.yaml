    note: "His leadership of the Sidiyya — a branch of the Qadiriyya — is attested for the man himself by the scholarship: Robinson's monograph treats him as the head of the order's Boutilimit zawiya and of the network of disciples and allies (the 'Sidiyya network') that radiated from it across southwestern Mauritania and Senegal, and the French scholarly survey of the Senegalese confréries states that the Sidiyya branch of the Qadiriyya, founded by his grandfather Sidiyya al-Kabir, was afterwards consolidated by Baba himself. Headship of an order, attested as his own office and practice, is the attestation the membership precedent counts — the same basis on which Ma al-'Aynayn's sufi segment rests — and is expressly not rested on descent from the branch's founder alone, although he was also al-Kabir's grandson. No source names a school of law for him; Mauritania's Maliki tradition is his milieu, recorded here and not counted."
    sources:
      - source/robinson-paths-of-accommodation-2000
summary:
  ar: "الشيخ سيديا بابا (1862–1924)، عالم وزعيم صوفي موريطاني من بوتلميت في الترارزة، حفيد الشيخ سيديا الكبير مؤسس زاوية بوتلميت القادرية وخليفته على رأس الفرع السيديّ، وشبكته من المريدين والحلفاء غطت جنوب غرب موريطانيا والسنغال. اشتهر بفتواه الصادرة في يناير 1903 التي سوّغت شرعًا قبول الحكم الفرنسي، وبعلاقته الوثيقة بالمفوض الفرنسي كزافييه كوبولاني مهندس «تهدئة» موريطانيا، فصار ركيزة في قيام موريطانيا الفرنسية، وكتب بأمر الفرنسيين تاريخًا لغرب الصنهاجة. كانت مواقفه نقيض مواقف معاصره الشيخ ماء العينين الذي اختار المقاومة المسلحة."
  en: "Shaykh Sidiyya Baba (1862–1924), Mauritanian scholar and Sufi leader of Boutilimit in the Trarza, grandson of Shaykh Sidiyya al-Kabir — founder of Boutilimit's Qadiri zawiya — and his successor at the head of the Sidiyya branch, whose network of disciples and allies covered southwestern Mauritania and Senegal. He is known for his fatwa of January 1903, which set out the Islamic rationale for accepting French overrule, and for his close bond with Xavier Coppolani, the French officer charged with the 'pacification' of Mauritania, which made him a pillar in the creation of French Mauritania; he also wrote, at French urging, a history of the western Sanhaja. His path of accommodation was the opposite of his contemporary Ma al-'Aynayn's armed resistance."
  ur: "شیخ سیدیا بابا (1862–1924)، بوتلمیت (ترارزہ) کے موریطانی عالم اور صوفی رہنما، شیخ سیدیا الکبیر — بوتلمیت کے قادری زاویے کے بانی — کے پوتے اور سلسلۂ سیدیہ کے سربراہ کے طور پر ان کے جانشین، جن کے مریدوں اور حلیفوں کا نیٹ ورک جنوب مغربی موریطانیہ اور سینیگال تک پھیلا تھا۔ وہ جنوری 1903ء کے اپنے فتوے کے لیے مشہور ہیں جس میں فرانسیسی اقتدار کو قبول کرنے کی شرعی توجیہ پیش کی گئی، اور فرانسیسی افسر زاویے کوپولانی سے اپنی قریبی وابستگی کے باعث وہ فرانسیسی موریطانیہ کے قیام کا ستون بنے؛ انھوں نے فرانسیسیوں کی فرمائش پر مغربی صنہاجہ کی تاریخ بھی لکھی۔ ان کا راستہ مصالحت کا تھا، جو ان کے ہم عصر شیخ ماء العینین کی مسلح مزاحمت کے برعکس تھا۔"
