summary:
  ar: "محمد المهدي الفاسي (1624–1698)، أبو عيسى أبو عبد الله محمد المهدي بن أحمد بن علي بن يوسف الفهري الفاسي، صوفي معروف وكاتب سير ومؤرخ من فاس، من أسرة الفاسي البارزة {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}. وُلد بالقصر الكبير في 17 أيار 1624 وتوفي في 20 شباط 1698 ودُفن في ضريح جده الأكبر أبي المحاسن يوسف الفاسي {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. ألّف ثلاثة شروح على «دلائل الخيرات» أشهرها «مطالع المسرات»، وكتب في سير الجزولي والتباع وفي سيرة جده الأكبر وفي عوائد أهل فاس، وكان شيخه في الطريق الروحي قاسم الخصاصي {cite:igi-muhammad-al-mahdi-al-fasi}."
  en: "Muhammad al-Mahdi al-Fasi (1624–1698), in full Abu Isa Abu Abdallah Muhammad al-Mahdi ibn Ahmad ibn Ali ibn Yusuf al-Fihri al-Fasi, was a well-known Sufi, biographer and historian from Fes, of the prominent al-Fasi family {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. Born at Ksar al-Kebir on 17 May 1624, he died on 20 February 1698 and was buried in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}. He wrote three commentaries on the Dala'il al-Khayrat — the Matali' al-Masarrat the best known — biographies of al-Jazuli and al-Tabba and of his great-grandfather, and a book on the customs of the people of Fes; his shaykh in the spiritual path was Qasim al-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi}."
  ur: "محمد المہدی الفاسی (1624ء–1698ء)، پورا نام ابو عیسیٰ ابو عبد اللہ محمد المہدی بن احمد بن علی بن یوسف الفہری الفاسی، فاس کے ایک معروف صوفی، سیرت نگار اور مؤرخ تھے، ممتاز الفاسی خاندان سے {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}۔ قصر الکبیر میں 17 مئی 1624ء کو پیدا ہوئے، 20 فروری 1698ء کو وفات پائی اور اپنے پردادا ابو المحاسن یوسف الفاسی کے مزار میں دفن ہوئے {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}۔ انہوں نے «دلائل الخیرات» کی تین شرحیں لکھیں جن میں «مطالع المسرات» سب سے مشہور ہے، جزولی و تباع اور اپنے پردادا کی سیرتیں اور اہلِ فاس کے رسوم پر کتاب لکھی؛ روحانی راہ میں ان کے شیخ قاسم الخصاصی تھے {cite:igi-muhammad-al-mahdi-al-fasi}۔"

