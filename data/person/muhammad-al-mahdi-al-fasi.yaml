    basis: documented
    note: >-
      Two independent texts name the value for the man himself. The
      Arabic article calls him in its lead a well-known Sufi (ṣūfī
      maʿrūf), a biographer and historian from Fes. The Imam Ghazali
      Institute biography, excerpted from the introduction to its
      edition of his Matali' al-Masarrat, independently calls him a
      famous jurist, muhaddith, Sufi, biographer and historian, and
      records that Qasim al-Khasasi became his shaykh in the spiritual
      path — a completed discipleship, which under the founder's
      doctrine also settles sufi. The English article's "well-known
      mystic" renders the same description. His particular devotion
      was to the Shadhili branches of the Maghreb, above all those of
      Ahmad Zarruq and Muhammad al-Jazuli, on whom he wrote; no text
      read names a school of law for him, so no second value is
      recorded.
    sources: [source/wikipedia-muhammad-al-mahdi-al-fasi-ar, source/igi-muhammad-al-mahdi-al-fasi, source/wikipedia-muhammad-al-mahdi-al-fasi-en]

