summary:
  ar: "محمد المهدي الفاسي (1624–1698)، أبو عيسى أبو عبد الله محمد المهدي بن أحمد بن علي بن يوسف الفهري الفاسي، صوفي معروف وكاتب سير ومؤرخ من فاس، من أسرة الفاسي البارزة {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}. وُلد بالقصر الكبير في 17 أيار 1624 وتوفي في 20 شباط 1698 ودُفن في ضريح جده الأكبر أبي المحاسن يوسف الفاسي {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. ألّف ثلاثة شروح على «دلائل الخيرات» أشهرها «مطالع المسرات»، وكتب في سير الجزولي والتباع وفي سيرة جده الأكبر وفي عوائد أهل فاس، وكان شيخه في الطريق الروحي قاسم الخصاصي {cite:igi-muhammad-al-mahdi-al-fasi}."
  en: "Muhammad al-Mahdi al-Fasi (1624–1698), in full Abu Isa Abu Abdallah Muhammad al-Mahdi ibn Ahmad ibn Ali ibn Yusuf al-Fihri al-Fasi, was a well-known Sufi, biographer and historian from Fes, of the prominent al-Fasi family {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. Born at Ksar al-Kebir on 17 May 1624, he died on 20 February 1698 and was buried in the mausoleum of his great-grandfather Abu al-Mahasin Yusuf al-Fasi {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}. He wrote three commentaries on the Dala'il al-Khayrat — the Matali' al-Masarrat the best known — biographies of al-Jazuli and al-Tabba and of his great-grandfather, and a book on the customs of the people of Fes; his shaykh in the spiritual path was Qasim al-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi}."
  ur: "محمد المہدی الفاسی ⁦(1624ء–1698ء)⁩، پورا نام ابو عیسیٰ ابو عبد اللہ محمد المہدی بن احمد بن علی بن یوسف الفہری الفاسی، فاس کے ایک معروف صوفی، سیرت نگار اور مؤرخ تھے، ممتاز الفاسی خاندان سے {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}۔ قصر الکبیر میں 17 مئی 1624ء کو پیدا ہوئے، 20 فروری 1698ء کو وفات پائی اور اپنے پردادا ابو المحاسن یوسف الفاسی کے مزار میں دفن ہوئے {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}۔ انہوں نے «دلائل الخیرات» کی تین شرحیں لکھیں جن میں «مطالع المسرات» سب سے مشہور ہے، جزولی و تباع اور اپنے پردادا کی سیرتیں اور اہلِ فاس کے رسوم پر کتاب لکھی؛ روحانی راہ میں ان کے شیخ قاسم الخصاصی تھے {cite:igi-muhammad-al-mahdi-al-fasi}۔"
  es: "Muhammad al-Mahdi al-Fasi (1624-1698), en su totalidad Abu Isa Abu Abdallah Muhammad al-Mahdi ibn Ahmad ibn Ali ibn Yusuf al-Fihri al-Fasi, fue un conocido sufí, biógrafo e historiador de Fez, de la prominente familia al-Fasi {cita:wikipedia-muhammad-al-mahdi-al-fasi-en}. Nacido en Ksar al-Kebir el 17 de mayo de 1624, murió el 20 de febrero de 1698 y fue enterrado en el mausoleo de su bisabuelo Abu al-Mahasin Yusuf al-Fasi {cita:wikipedia-muhammad-al-mahdi-al-fasi-ar}. Escribió tres comentarios sobre el Dala'il al-Khayrat —el Matali' al-Masarrat es el más conocido—, biografías de al-Jazuli y al-Tabba y de su bisabuelo, y un libro sobre las costumbres de la gente de Fez; su shaykh en el camino espiritual fue Qasim al-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi}."
  fr: "Muhammad al-Mahdi al-Fasi (1624-1698), en entier Abu Isa Abu Abdallah Muhammad al-Mahdi ibn Ahmad ibn Ali ibn Yusuf al-Fihri al-Fasi, était un soufi bien connu, biographe et historien de Fès, de l'éminente famille al-Fasi {cite: wikipedia-muhammad-al-mahdi-al-fasi-en}. Né à Ksar al-Kebir le 17 mai 1624, il décède le 20 février 1698 et est enterré dans le mausolée de son arrière-grand-père Abu al-Mahasin Yusuf al-Fasi {cite:wikipedia-muhammad-al-mahdi-al-fasi-ar}. Il a écrit trois commentaires sur le Dala'il al-Khayrat — le Matali' al-Masarrat étant le plus connu — des biographies d'al-Jazuli et d'al-Tabba et de son arrière-grand-père, ainsi qu'un livre sur les coutumes des habitants de Fès; son cheikh sur la voie spirituelle était Qasim al-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi}."
  tr: "Muhammed el-Mehdi el-Fasi (1624–1698), Ebu İsa Ebu Abdullah Muhammed el-Mehdi ibn Ahmed ibn Ali ibn Yusuf el-Fihri el-Fasi, Fez'den tanınmış bir Sufi, biyografi yazarı ve tarihçiydi; Fassi'nin önde gelen ailesinden {alıntı: Vikipedi-Muhammed-al-Mahdi-al-Fasi-ar}. 17 Mayıs 1624'te Qasr al-Kebir'de doğdu, 20 Şubat 1698'de öldü ve büyük büyükbabası Ebu el-Mahasin Yusuf el-Fasi'nin türbesine defnedildi {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. 'Dalail al-Khayrat' üzerine üç yorum yazdı, en ünlüsü 'Matali' al-Masarat'tır ve el-Cezuli ile el-Taba'a'nın biyografileri, büyükbabasının biyografisi ve Fez halkının gelenekleri üzerine yazdı. Öğretmeni el-Ruhi Kasım el-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi} idi."
  id: "Muhammad al-Mahdi al-Fasi (1624–1698), Abu Isa Abu Abdullah Muhammad al-Mahdi ibn Ahmad ibn Ali ibn Yusuf al-Fihri al-Fasi, adalah seorang Sufi, penulis biografi, dan sejarawan terkenal dari Fez, dari keluarga terkemuka Fassi {cite:Wikipedia-Muhammad-al-Mahdi-al-Fasi-ar}. Ia lahir di Qasr al-Kebir pada 17 Mei 1624, meninggal pada 20 Februari 1698, dan dimakamkan di makam kakek buyutnya Abu al-Mahasin Yusuf al-Fasi {cite:wikipedia-muhammad-al-mahdi-al-fasi-en}. Ia menulis tiga komentar tentang 'Dalail al-Khayrat,' yang paling terkenal adalah 'Matali' al-Masarat, dan menulis tentang biografi al-Jazuli dan al-Taba'a, serta biografi kakeknya, dan adat istiadat masyarakat Fez. Gurunya adalah al-Ruhi Qasim al-Khasasi {cite:igi-muhammad-al-mahdi-al-fasi}."

