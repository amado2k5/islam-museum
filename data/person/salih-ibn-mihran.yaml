summary:
  ar: "أبو سفيان صالح بن مهران، كان يقال له الحكيم، ويكتب كلامه. قال سليمان الشاذكوني: ما رأيت أورع من أبي سفيان. ومن كلامه: العلم آلة الإسلام، وإذا رأيت العالم لا يتورع في علمه فليس لك أن تأخذ عنه، والورع ورعان: ورع صواب وورع أحمق، وكل عمل يعمل لغير الله فهو ذنب على عامله."
  en: "Abu Sufyan Salih ibn Mihran, called al-Hakim, whose words were written down; Sulayman al-Shadhakuni said: I have not seen anyone more scrupulous than Abu Sufyan. Among his sayings: learning is the tool of Islam; if you see a scholar who is not careful in his learning, do not take from him; scrupulousness is of two kinds, a right scrupulousness and a foolish scrupulousness; and every deed done for other than God is a sin on its doer."
  ur: "ابو سفیان صالح بن مہران، جنہیں حکیم کہا جاتا تھا اور جن کے کلام لکھے جاتے تھے۔ سلیمان شاذکونی نے کہا: میں نے ابو سفیان سے زیادہ پرہیزگار کسی کو نہیں دیکھا۔ ان کے اقوال میں: اسلام کا آلہ علم ہے، اور اگر تم کسی عالم کو اپنے علم میں پرہیزگار نہ دیکھو تو اس سے علم نہ لو؛ پرہیزگاری دو طرح کی ہے: درست پرہیزگاری اور احمقانہ پرہیزگاری؛ اور جو عمل اللہ کے سوا کسی اور کے لیے کیا جائے وہ عمل کرنے والے پر گناہ ہے۔"
