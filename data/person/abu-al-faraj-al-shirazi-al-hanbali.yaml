id: person/abu-al-faraj-al-shirazi-al-hanbali
class: person
label: { ar: "أبو الفرج الشيرازي الحنبلي شيخ الشام" }
summary:
  ar: "الشيخ أبو الفرج الشيرازي الحنبلي عبد الواحد بن محمد بن علي بن أحمد الشيرازي ثم المقدسي ثم الدمشقي الفقيه الزاهد — شيخ الشام في وقته؛ سمع بدمشق من ابن السمسار وأبي عثمان الصابوني وتفقه ببغداد على القاضي أبي يعلى ونشر بالشام مذهب أحمد وتخرج به الأصحاب؛ كان إماماً عارفاً بالفقه والأصول صاحب حال وعبادة، ويعظمه تتش صاحب الشام لكرامة رآها منه، وكان ناصراً للاعتقاد مبطلاً لتأويلات أخبار الصفات؛ مات يوم الأحد ثامن عشر ذي الحجة سنة ست وثمانين وأربعمائة بدمشق ودفن بمقبرة الباب الصغير وقبره يزار، وله ذرية يعرفون ببيت ابن الحنبلي {cite:shadharat-dhahab p. 378-379}."
  en: "Shaykh Abu al-Faraj al-Shirazi al-Hanbali Abd al-Wahid b. Muhammad — shaykh of the Sham in his day; studied under Qadi Abu Ya'la at Baghdad and spread Ahmad's madhhab through Syria, honoured by Tutush for a karama witnessed; died Sunday 18 Dhu al-Hijja 486 at Damascus and lies at Bab al-Saghir where his grave is visited — ancestor of Bayt Ibn al-Hanbali {cite:shadharat-dhahab p. 378-379}."
