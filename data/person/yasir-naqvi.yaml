summary:
  ar: "محامٍ وسياسي ليبرالي باكستاني كندي، مثّل دائرة أوتاوا الوسطى في برلمان أونتاريو من 2007 إلى 2018 وتولّى منصب النائب العام للمقاطعة من 2016 إلى 2018، ويمثّل الدائرة نفسها في مجلس العموم الكندي منذ 2021."
  en: "Pakistani-Canadian lawyer and Liberal politician who represented Ottawa Centre in Ontario's provincial parliament from 2007 to 2018 — including as the province's attorney general from 2016 to 2018 — and has represented the same riding in Canada's House of Commons since 2021."
  ur: "پاکستانی نژاد کینیڈین وکیل اور لبرل سیاست دان جنہوں نے 2007 سے 2018 تک اونٹاریو کی صوبائی پارلیمنٹ میں اوٹاوا سینٹر کی نمائندگی کی — 2016 سے 2018 تک صوبے کے اٹارنی جنرل رہے — اور 2021 سے کینیڈا کے ایوانِ زیریں میں اسی حلقے کی نمائندگی کر رہے ہیں۔"
