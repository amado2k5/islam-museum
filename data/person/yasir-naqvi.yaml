summary:
  ar: "محامٍ وسياسي ليبرالي باكستاني كندي، مثّل دائرة أوتاوا الوسطى في برلمان أونتاريو من 2007 إلى 2018 وتولّى منصب النائب العام للمقاطعة من 2016 إلى 2018، ويمثّل الدائرة نفسها في مجلس العموم الكندي منذ 2021."
  en: "Pakistani-Canadian lawyer and Liberal politician who represented Ottawa Centre in Ontario's provincial parliament from 2007 to 2018 — including as the province's attorney general from 2016 to 2018 — and has represented the same riding in Canada's House of Commons since 2021."
  ur: "پاکستانی نژاد کینیڈین وکیل اور لبرل سیاست دان جنہوں نے 2007 سے 2018 تک اونٹاریو کی صوبائی پارلیمنٹ میں اوٹاوا سینٹر کی نمائندگی کی — 2016 سے 2018 تک صوبے کے اٹارنی جنرل رہے — اور 2021 سے کینیڈا کے ایوانِ زیریں میں اسی حلقے کی نمائندگی کر رہے ہیں۔"
  es: "Abogado y político liberal paquistaní-canadiense que representó a Ottawa Centre en el parlamento provincial de Ontario desde 2007 hasta 2018 —incluido el cargo de fiscal general de la provincia desde 2016 hasta 2018— y que ha representado a la misma circunscripción en la Cámara de los Comunes de Canadá desde 2021."
  fr: "Avocat et homme politique libéral pakistano-canadien qui a représenté Ottawa-Centre au parlement provincial de l'Ontario de 2007 à 2018 — y compris en tant que procureur général de la province de 2016 à 2018 — et qui représente la même circonscription à la Chambre des communes du Canada depuis 2021."
  tr: "Pakistanlı Kanadalı avukat ve liberal politikacı olan Scully, 2007-2018 yılları arasında Ontario Parlamentosu'nda Ottawa Central bölgesini temsil etti ve 2016-2018 yılları arasında aynı bölgeyi Kanada Avam Kamarası'nda temsil ederek eyalet başsavcısı olarak görev yaptı."
  id: "Sebagai pengacara dan politisi liberal asal Kanada asal Pakistan, ia mewakili distrik Ottawa Central di Parlemen Ontario dari tahun 2007 hingga 2018 dan menjabat sebagai jaksa agung provinsi dari tahun 2016 hingga 2018, mewakili distrik yang sama di House of Commons Kanada sejak tahun 2021."
