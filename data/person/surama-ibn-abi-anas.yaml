summary:
  ar: "شاعر من بني عدي بن النجار، له في استقبال النبي بالمدينة قصيدته ثوى في قريش بضع عشرة حجة يذكر لا يلقى صديقاً مواتيا إلى بذلنا له الأموال في كل ملكنا وأنفسنا عند الوغى والتآسيا {cite:muruj-al-dhahab p. 578}."
  en: "The Najjar poet whose qasida on the Prophet's coming — 'Thirteen years he dwelt in Quraysh, mentioned, finding no friend to answer' — voices the Ansar's joy and pledge {cite:muruj-al-dhahab p. 578}."
  es: "El poeta de Najjar cuya qasida sobre la llegada del Profeta — 'Trece años habitó en Quraysh, mencionado, sin encontrar amigo que le respondiera' — expresa la alegría y el juramento de los Ansar {cite:muruj-al-dhahab p. 578}."
  fr: "Le poète Najjar dont la qasida sur la venue du Prophète — « Treize ans il demeura à Quraysh, dit-on, ne trouvant aucun ami pour répondre » — exprime la joie et l'engagement des Ansar {cite:muruj-al-dhahab p. 578}."
  ur: "نجار شاعر جس کا قصیدہ نبی کی آمد پر - 'تیرہ سال قریش میں رہے، تذکرہ کیا، جواب دینے کے لیے کوئی دوست نہ ملا' - انصار کی خوشی اور عہد کی آواز اٹھاتا ہے {حوالہ: مروج الذہب ص۔ 578}۔"
