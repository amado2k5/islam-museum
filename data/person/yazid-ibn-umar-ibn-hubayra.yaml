id: person/yazid-ibn-umar-ibn-hubayra
class: person
label: { ar: "يزيد بن عمر بن هبيرة", en: "Yazid ibn Umar ibn Hubayra", es: "Yazid ibn Umar ibn Hubayra", fr: "Yazid ibn Umar ibn Hubayra", ur: "یزید بن عمر بن حبیرہ" }
summary:
  ar: "يزيد بن عمر بن هبيرة الفزاري آخر عمال بني أمية على العراق؛ عند البلاذري بنى مدينة بالكوفة على الفرات ونزلها ومنها شيء يسير لم يستتم فأتاه كتاب مروان يأمره باجتناب مجاورة أهل الكوفة فتركها وبنى قصر ابن هبيرة بالقرب من جسر سورا فنزلها أبو العباس بعده وسماها الهاشمية وأصلح قنطرة الكوفة."
  en: "Yazid ibn Umar ibn Hubayra al-Fazari, the last Umayyad governor of Iraq; in al-Baladhuri he built a city on Kufa's Euphrates side, left it unfinished on Marwan's letter ordering him to shun the Kufans' neighborhood, and built Qasr Ibn Hubayra near Sura's bridge — which Abu al-Abbas then occupied as al-Hashimiyya; he also repaired Kufa's pontoon."
  es: "Yazid ibn Umar ibn Hubayra al-Fazari, el último gobernador omeya de Irak, construyó una ciudad en al-Baladhuri, en la orilla del Éufrates de Kufa, pero la dejó inacabada tras una carta de Marwan en la que le ordenaba evitar la zona de los kufanos. En su lugar, construyó Qasr Ibn Hubayra cerca del puente de Sura, que Abu al-Abbas ocupó posteriormente como al-Hashimiyya; además, reparó el pontón de Kufa."
  fr: "Yazid ibn Umar ibn Hubayra al-Fazari, le dernier gouverneur omeyyade d'Irak; à al-Baladhuri, il construisit une ville sur la rive de l'Euphrate à Kufa, la laissant inachevée sur la lettre de Marwan lui ordonnant d'éviter le quartier des Kufanais, et construisit Qasr Ibn Hubayra près du pont de Sura — qu'Abu al-Abbas occupa ensuite sous le nom d'al-Hashimiyya; il répara également le ponton de Kufa."
  ur: "یزید بن عمر بن حبیرہ الفزاری، عراق کا آخری اموی گورنر؛ البلاذری میں اس نے کوفہ کے فرات کے کنارے ایک شہر بنایا، مروان کے خط پر اسے نامکمل چھوڑ دیا جس میں اسے کوفوں کے محلے سے دور رہنے کا حکم دیا گیا تھا، اور سورہ کے پل کے قریب قصر ابن ہبیرہ تعمیر کیا تھا - جس پر ابو العباس نے پھر الہاشمیہ کے طور پر قبضہ کر لیا تھا۔ اس نے کوفہ کے پونٹون کی بھی مرمت کی۔"
  tr: "Yazid bin Ömer bin Hubayrah el-Fazari, Irak'taki son Emevi valisi; el-Baladhuri'ye göre, Fırat kıyısında Kufa'da bir şehir inşa etti ve oraya yerleşti, ancak sadece küçük bir kısmı tamamlanmamıştı. Mervan'ın mektubu ona geldi ve Kufe halkıyla komşudan kaçınmasını emretti, ancak o mektubu bıraktı ve Sura köprüsü yakınında İbn Hubayrah sarayını inşa etti. Ebu el-Abbas daha sonra oraya yerleşti, buraya Haşimi Bölgesi adını verdi ve Kufe köprüsünü onardı."
  id: "Yazid ibn Umar ibn Hubayrah al-Fazari, gubernur Umayyah terakhir atas Irak; menurut al-Baladhuri, ia membangun sebuah kota di Kufa di tepi Sungai Efrat dan menetap di sana, dengan hanya sebagian kecil yang belum sepenuhnya selesai. Surat Marwan sampai kepadanya yang memerintahkannya untuk menghindari tetangga dengan penduduk Kufa, tetapi ia meninggalkannya dan membangun istana Ibn Hubayrah dekat jembatan Surah. Abu al-Abbas kemudian menetap di sana, menamainya Distrik Hashemite, dan memperbaiki jembatan Kufa."
