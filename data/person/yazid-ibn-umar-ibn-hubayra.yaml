summary:
  ar: "يزيد بن عمر بن هبيرة الفزاري آخر عمال بني أمية على العراق؛ عند البلاذري بنى مدينة بالكوفة على الفرات ونزلها ومنها شيء يسير لم يستتم فأتاه كتاب مروان يأمره باجتناب مجاورة أهل الكوفة فتركها وبنى قصر ابن هبيرة بالقرب من جسر سورا فنزلها أبو العباس بعده وسماها الهاشمية وأصلح قنطرة الكوفة."
  en: "Yazid ibn Umar ibn Hubayra al-Fazari, the last Umayyad governor of Iraq; in al-Baladhuri he built a city on Kufa's Euphrates side, left it unfinished on Marwan's letter ordering him to shun the Kufans' neighborhood, and built Qasr Ibn Hubayra near Sura's bridge — which Abu al-Abbas then occupied as al-Hashimiyya; he also repaired Kufa's pontoon."
