summary:
  ar: "جمال الدين أبو القاسم يحيى بن علي بن الفضل العلامة البغدادي شيخ الشافعية بها ويعرف بابن فضلان؛ ولد سنة خمس عشرة وخمسمائة وتفقه على أبي منصور ابن الرزاز ببغداد وبنيسابور على محمد بن يحيى تلميذ الغزالي، وسمع جماعة وانتفع به خلق كثير واشتهر اسمه وطار صيته، وكان إماماً في الفقه والأصول والخلاف والجدل مشاراً إليه في ذلك، وكان يجري له وللمجير البغدادي بحوث ومحافل يشنع كل منهما على الآخر؛ توفي في شعبان سنة خمس وتسعين وخمسمائة {cite:shadharat-dhahab p. 801}."
  en: "Jamal al-Din Abu al-Qasim Yahya b. Ali Ibn Fadlan, scholar of Baghdad and shaykh of its Shafi'is; b. 515, trained under Ibn al-Razzaz at Baghdad and under Muhammad b. Yahya, al-Ghazali's student, at Nishapur — imam in fiqh, usul, khilaf and jadal, pointed out in them all, with many profiting by him; he and al-Mujir al-Baghdadi used to hold running debates and disputations, each decrying the other. He died in Sha'ban 595 {cite:shadharat-dhahab p. 801}."
