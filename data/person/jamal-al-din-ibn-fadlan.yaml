names:
  - { value: "جمال الدين أبو القاسم يحيى بن علي بن الفضل بن هبة الله العلامة البغدادي المعروف بابن فضلان", kind: full }
summary:
  ar: "جمال الدين أبو القاسم يحيى بن علي بن الفضل العلامة البغدادي شيخ الشافعية بها ويعرف بابن فضلان؛ ولد سنة خمس عشرة وخمسمائة وتفقه على أبي منصور ابن الرزاز ببغداد وبنيسابور على محمد بن يحيى تلميذ الغزالي، وسمع جماعة وانتفع به خلق كثير واشتهر اسمه وطار صيته، وكان إماماً في الفقه والأصول والخلاف والجدل مشاراً إليه في ذلك، وكان يجري له وللمجير البغدادي بحوث ومحافل يشنع كل منهما على الآخر؛ توفي في شعبان سنة خمس وتسعين وخمسمائة {cite:shadharat-dhahab p. 801}."
  en: "Jamal al-Din Abu al-Qasim Yahya b. Ali Ibn Fadlan, scholar of Baghdad and shaykh of its Shafi'is; b. 515, trained under Ibn al-Razzaz at Baghdad and under Muhammad b. Yahya, al-Ghazali's student, at Nishapur — imam in fiqh, usul, khilaf and jadal, pointed out in them all, with many profiting by him; he and al-Mujir al-Baghdadi used to hold running debates and disputations, each decrying the other. He died in Sha'ban 595 {cite:shadharat-dhahab p. 801}."
  es: "Jamal al-Din Abu al-Qasim Yahya b. Ali Ibn Fadlan, erudito de Bagdad y shaykh de sus shafi'ís; n. 515, se formó con Ibn al-Razzaz en Bagdad y con Muhammad b. Yahya, discípulo de al-Ghazali, en Nishapur. Fue imán en fiqh, usul, khilaf y jadal, destacando en todas estas disciplinas, de las que muchos se beneficiaron. Él y al-Mujir al-Baghdadi solían mantener debates y discusiones constantes, criticándose mutuamente. Falleció en Sha'ban 595 {cita: shadharat-dhahab p. 801}."
  fr: "Jamal al-Din Abu al-Qasim Yahya b. Ali Ibn Fadlan, érudit de Bagdad et cheikh de son école shafi'ite, né en 515, fut formé par Ibn al-Razzaz à Bagdad et par Muhammad b. Yahya, disciple d'al-Ghazali, à Nishapur. Maître en fiqh, usul, khilaf et jadal, il excellait dans ces domaines et de nombreux disciples profitèrent de son enseignement. Il entretenait avec al-Mujir al-Baghdadi des débats et des discussions animés, chacun critiquant l'autre. Il mourut en Sha'ban 595 (cf. shadharat-dhahab, p. 801)."
