summary:
  ar: "الشيخ عبد الصمد الملقب بالصمدي الدمشقي القادري؛ قال في الكواكب: كان عابداً عالماً حافظاً للقرآن والطريق، ولد سنة إحدى عشرة وتسعمائة، ولزم مجالس الذكر والصلاة على النبي وقام في محافظة أهل الفقر، ورحل إلى الحجاز إلى المدينة النبوية وأقام مدة عند أستاذه الشيخ سعد الدين، وسمع بالبيت الحرام على كثيرين وأخذ عنهم، وكان يكثر الذكر ويكثر ختماً كاملاً كل أربعة أيام ويقرأه على شيخه الشيخ عبد الرحمن السقا بحيث حفظ ما عنده من الشيوخ، وخدم في داره العلماء والصالحين، وقرّأ الصبيان وفتح عليه رزقه، وكان مقبولاً عند الناس والأعيان؛ توفي ليلة الجمعة عاشر صفر سنة أربع وتسعين {cite:shadharat-dhahab p. 434}."
  en: "'Abd al-Samad al-Samadi al-Qadiri — b. 911, devout Qur'an-hafiz of the qadiri path, served at Medina under Sa'd al-Din and read the Shifa' fully on his shaykh 'Abd al-Rahman al-Saqqa; served scholars at his home and taught boys; died Friday eve 10 Safar 994 {cite:shadharat-dhahab p. 434}."
