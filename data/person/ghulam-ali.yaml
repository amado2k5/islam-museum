summary:
  ar: "مغنّي غزل باكستاني (وُلد سنة 1940) من غرانة بتيالا، وُلد في غالوتيان خورد بمقاطعة سيالكوت، وتتلمذ على بادي غلام علي خان وإخوته؛ اشتهر في جنوب آسيا بأغنية «تشبكي تشبكي رات دن» في فيلم «نكاح» (1982)، ونال فخر الأداء وستارة الامتياز."
  en: "Pakistani ghazal singer (born 1940) of the Patiala gharana, born at Galotian Khurd in the Sialkot district, a disciple of Bade Ghulam Ali Khan and his brothers; his 'Chupke Chupke Raat Din' in the film Nikah (1982) carried his fame across South Asia, and he received the Pride of Performance and the Sitara-i-Imtiaz."
  ur: "پاکستانی غزل گلوکار (پیدائش 1940ء) جن کا تعلق پٹیالہ گھرانے سے ہے؛ سیالکوٹ ضلع کے گلوٹیاں خورد میں پیدا ہوئے، بڑے غلام علی خان اور ان کے بھائیوں کے شاگرد؛ فلم «نکاح» (1982ء) میں «چپکے چپکے رات دن» سے جنوبی ایشیا بھر میں شہرت پائی اور پرائیڈ آف پرفارمنس و ستارہِ امتیاز سے نوازے گئے۔"
