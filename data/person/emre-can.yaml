summary:
  ar: "لاعب كرة قدم ألماني محترف (وُلد سنة 1994 في فرانكفورت). وسط دفاعي تخرّج من بايرن ميونخ، ولعب لباير ليفركوزن وليفربول ويوفنتوس، وانضم إلى بوروسيا دورتموند سنة 2020 وصار قائده سنة 2023؛ فاز مع ألمانيا بكأس القارات سنة 2017."
  en: "German professional footballer (born 1994 in Frankfurt). A defensive midfielder who came through Bayern Munich and played for Bayer Leverkusen, Liverpool and Juventus before joining Borussia Dortmund in 2020 and becoming their captain in 2023; he won the 2017 FIFA Confederations Cup with Germany."
  ur: "جرمن پیشہ ور فٹبالر (پیدائش 1994، فرینکفرٹ)۔ دفاعی مڈفیلڈر جو بائرن میونخ سے نکلے، بائر لیورکوزن، لیورپول اور یووینٹس کے لیے کھیلے، 2020 میں بوروسیا ڈورٹمنڈ میں شامل ہو کر 2023 میں اس کے کپتان بنے؛ جرمنی کے ساتھ 2017 کا فیفا کنفیڈریشنز کپ جیتا۔"
