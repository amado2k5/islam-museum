summary:
  ar: "روائية وكاتبة مقالات ومذكرات إيرانية أمريكية، وُلدت في أصفهان سنة 1979. غادرت إيران طفلةً سنة 1988 بعد تحوّل والدتها إلى المسيحية، وعاشت لاجئة في دبي وإيطاليا قبل أن تستقر في أوكلاهوما؛ من كتبها روايتا «ملعقة شاي من الأرض والبحر» و«ملاذ» ومذكرات «اللاجئة الجاحدة» (2019)."
  en: "Iranian-American novelist, essayist and memoirist, born in Isfahan in 1979. She left Iran as a child in 1988 after her mother converted to Christianity, lived as a refugee in Dubai and Italy, and settled in Oklahoma; her books include the novels A Teaspoon of Earth and Sea and Refuge and the memoir The Ungrateful Refugee (2019)."
  ur: "ایرانی نژاد امریکی ناول نگار، مضمون نگار اور یادداشت نگار، 1979 میں اصفہان میں پیدا ہوئیں۔ 1988 میں اپنی والدہ کے عیسائیت قبول کرنے کے بعد بچپن میں ایران چھوڑا، دبئی اور اٹلی میں پناہ گزین رہیں اور اوکلاہوما میں آباد ہوئیں؛ ان کی کتابوں میں «اے ٹی سپون آف ارتھ اینڈ سی» اور «ریفیوج» اور یادداشت «دی ان گریٹ فل ریفیوجی» (2019) شامل ہیں۔"
