summary:
  ar: "من أتباع الطريقة المولوية، تلميذ حفيد جلال الدين الرومي جلال العارف، وكتب بطلبه «مناقب العارفين» في سير جلال الدين الرومي وأبيه وخلفائه وأصحابه، وأتمّه سنة 754 هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 256}."
  en: "A follower of the Mawlawiyya order and disciple of Djalal al-'Arif, grandson of Djalal al-Din Rumi. At Djalal al-'Arif's request he wrote the Manaqib al-'Arifin, lives of Rumi, his father, successors and associates, completed in 754/1353–4 {cite:encyclopaedia-of-islam-2 vol. 1 p. 256}."
  es: "Seguidor de la orden Mawlawiyya y discípulo de Djalal al-'Arif, nieto de Djalal al-Din Rumi. A petición de Djalal al-'Arif, escribió Manaqib al-'Arifin, vidas de Rumi, su padre, sucesores y asociados, completado en 754/1353-4 {cita:encyclopaedia-of-islam-2 vol. 1 pág. 256}."
  fr: "Adepte de l'ordre Mawlawiyya et disciple de Djalal al-'Arif, petit-fils de Djalal al-Din Rumi. À la demande de Djalal al-'Arif, il écrivit le Manaqib al-'Arifin, vies de Rumi, de son père, de ses successeurs et associés, achevé en 754/1353-4 {cite:encyclopaedia-of-islam-2 vol. 1 p. 256}."
  ur: "وہ مولویانہ حکم کے پیروکار تھے اور جلال الدین رومی کے پوتے جلال العارف کے شاگرد تھے۔ جلال العارف کی درخواست پر اس نے مناقب العارفین، رومی، ان کے والد، جانشینوں اور ساتھیوں کی زندگیوں کو لکھا، جو 754/1353-4 میں مکمل ہوا 1 ص۔ 256}۔"
