summary:
  ar: "عالم اجتماع ومفكر إيراني ⁦(1933–1977)⁩، من أبرز المثقفين المؤثرين قبل الثورة الإيرانية. جمع في محاضراته وكتاباته بين علم الاجتماع الغربي والتراث الشيعي، ومن أعماله «العودة إلى الذات» و«الشيعة العلوية والشيعة الصفوية» و«فاطمة فاطمة» و«الحج»، وتوفي في منفاه بلندن."
  en: "Iranian sociologist and thinker (1933–1977), among the most influential intellectuals before the Iranian revolution. His lectures and writings joined Western sociology to Shia heritage; his works include Return to the Self, Red Shi'ism vs Safavid Shi'ism, Fatima is Fatima and Hajj. He died in exile in London."
  ur: "ایرانی ماہرِ سماجیات اور مفکر ⁦(1933–1977)⁩ جو ایرانی انقلاب سے پہلے کے مؤثر ترین مثقفین میں شمار ہوتے ہیں۔ ان کے لیکچروں اور تحریروں میں مغربی سماجیات اور شیعہ ورثہ ملے؛ ان کے کاموں میں «بازگشت بہ خویشتن»، «تشيعِ علوی و تشيعِ صفوی»، «فاطمہ فاطمہ است» اور «حج» شامل ہیں۔ لندن میں جلاوطنی میں انتقال کیا۔"
