summary:
  ar: "سلطان گولكنده ⁦(1580–1612م)⁩، مؤسس مدينة حيدرآباد سنة 1591م، يعده زبروفسكي أول شاعر أردي كبير في الهند، ونسخة «كلياته» المصورة في متحف سالار جنگ من أغنى الكتب الهندية تصويرًا {cite:zebrowski-deccani-painting-1983 p. 155}."
  en: "Sultan of Golconda (1580–1612) who founded Hyderabad in 1591; Zebrowski calls him India's first great Urdu poet, and the illustrated copy of his Kulliyat in the Salar Jang Museum one of the most richly illustrated Indian books {cite:zebrowski-deccani-painting-1983 p. 155}."
  ur: "گولکنڈہ کے سلطان ⁦(1580–1612ء)⁩ جنہوں نے 1591ء میں حیدرآباد بسایا؛ زیبروسکی انہیں ہندوستان کا پہلا بڑا اردو شاعر کہتے ہیں، اور سالار جنگ میوزیم میں ان کی مصور کلیات کو سب سے زیادہ مصور ہندوستانی کتابوں میں گنتے ہیں {cite:zebrowski-deccani-painting-1983 p. 155}۔"
