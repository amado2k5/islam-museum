summary:
  ar: "زايد بن خليفة آل نهيان، المعروف بزايد الكبير وزايد الأول (سنة ولادته متنازع عليها: نحو 1835 أو 1837 أو 1840 – توفي في أبوظبي في 19 مايو 1909)، حاكم إمارة أبوظبي السابع من أسرة آل نهيان، حكم 54 سنة من 1855 إلى وفاته. هزم عودة ابن عمه المخلوع سعيد بن طحنون سنة 1856، وشارك البحرين في حملة 1867 على الدوحة والوكرة، وقتل حاكم الشارقة خالد بن سلطان في نزال فردي سنة 1868، وأخرج السعوديين من البريمي سنة 1870، وخاض حربًا طويلة مع قطر في الثمانينيات انتهت بتسوية 1893، ووقّع اتفاق 1892 مع بريطانيا، فصار بحلول 1894 أقوى شيوخ الساحل المتصالح؛ وهو جدّ زايد بن سلطان مؤسس الإمارات العربية المتحدة وسميّه."
  en: "Zayed bin Khalifa Al Nahyan, known as Zayed the Great and Zayed I (his birth year is disputed: c. 1835, 1837 or 1840 – died at Abu Dhabi on 19 May 1909), was the seventh ruler of Abu Dhabi of the Al Nahyan family, reigning for 54 years from 1855 until his death. He defeated his deposed cousin Saeed bin Tahnun's attempted return in 1856, joined Bahrain's 1867 expedition against Doha and Wakrah, killed Sharjah's ruler Khalid bin Sultan in single combat in 1868, drove the Saudis from Buraimi in 1870, fought a long war with Qatar in the 1880s that ended in the settlement of 1893, and signed the 1892 agreement with Britain, becoming by 1894 the most powerful of the Trucial sheikhs. He was the grandfather and namesake of Zayed bin Sultan, founding father of the United Arab Emirates."
  ur: "زاید بن خلیفہ آل نہیان، زاید الکبیر (پیدائش متنازع: تقریباً 1835ء، 1837ء یا 1840ء – وفات: ابوظہبی، 19 مئی 1909ء)، ابوظہبی کے ساتویں حکمران تھے جنہوں نے 1855ء سے 1909ء تک 54 برس حکومت کی۔ انہوں نے 1867ء میں دوحہ و وکرہ کی مہم، 1868ء میں شارجہ کے حکمران خالد بن سلطان کا مقابلہ، 1870ء میں بریمی سے سعودیوں کا اخراج اور قطر سے طویل جنگ درج کی، اور 1892ء میں برطانیہ سے معاہدہ کر کے ساحلِ متصالح کے طاقتور ترین شیخ بن گئے۔"
