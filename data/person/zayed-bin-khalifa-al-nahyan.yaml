summary:
  ar: "زايد بن خليفة آل نهيان، المعروف بزايد الكبير وزايد الأول ⁦(سنة ولادته متنازع عليها: نحو 1835 أو 1837 أو 1840 – توفي في أبوظبي في 19 مايو 1909)⁩، حاكم إمارة أبوظبي السابع من أسرة آل نهيان، حكم 54 سنة من 1855 إلى وفاته. هزم عودة ابن عمه المخلوع سعيد بن طحنون سنة 1856، وشارك البحرين في حملة 1867 على الدوحة والوكرة، وقتل حاكم الشارقة خالد بن سلطان في نزال فردي سنة 1868، وأخرج السعوديين من البريمي سنة 1870، وخاض حربًا طويلة مع قطر في الثمانينيات انتهت بتسوية 1893، ووقّع اتفاق 1892 مع بريطانيا، فصار بحلول 1894 أقوى شيوخ الساحل المتصالح؛ وهو جدّ زايد بن سلطان مؤسس الإمارات العربية المتحدة وسميّه."
  en: "Zayed bin Khalifa Al Nahyan, known as Zayed the Great and Zayed I (his birth year is disputed: c. 1835, 1837 or 1840 – died at Abu Dhabi on 19 May 1909), was the seventh ruler of Abu Dhabi of the Al Nahyan family, reigning for 54 years from 1855 until his death. He defeated his deposed cousin Saeed bin Tahnun's attempted return in 1856, joined Bahrain's 1867 expedition against Doha and Wakrah, killed Sharjah's ruler Khalid bin Sultan in single combat in 1868, drove the Saudis from Buraimi in 1870, fought a long war with Qatar in the 1880s that ended in the settlement of 1893, and signed the 1892 agreement with Britain, becoming by 1894 the most powerful of the Trucial sheikhs. He was the grandfather and namesake of Zayed bin Sultan, founding father of the United Arab Emirates."
  ur: "زاید بن خلیفہ آل نہیان، زاید الکبیر ⁦(پیدائش متنازع: تقریباً 1835ء، 1837ء یا 1840ء – وفات: ابوظہبی، 19 مئی 1909ء)⁩، ابوظہبی کے ساتویں حکمران تھے جنہوں نے 1855ء سے 1909ء تک 54 برس حکومت کی۔ انہوں نے 1867ء میں دوحہ و وکرہ کی مہم، 1868ء میں شارجہ کے حکمران خالد بن سلطان کا مقابلہ، 1870ء میں بریمی سے سعودیوں کا اخراج اور قطر سے طویل جنگ درج کی، اور 1892ء میں برطانیہ سے معاہدہ کر کے ساحلِ متصالح کے طاقتور ترین شیخ بن گئے۔"
  es: "Zayed bin Khalifa Al Nahyan, conocido como Zayed el Grande y Zayed I (su año de nacimiento es objeto de controversia: c. 1835, 1837 o 1840; falleció en Abu Dabi el 19 de mayo de 1909), fue el séptimo gobernante de Abu Dabi de la familia Al Nahyan, reinando durante 54 años desde 1855 hasta su muerte. Derrotó el intento de regreso de su primo depuesto, Saeed bin Tahnun, en 1856, se unió a la expedición de Baréin de 1867 contra Doha y Wakrah, mató al gobernante de Sharjah, Khalid bin Sultan, en un duelo singular en 1868, expulsó a los saudíes de Buraimi en 1870, libró una larga guerra con Catar en la década de 1880 que terminó con el acuerdo de 1893, y firmó el acuerdo de 1892 con Gran Bretaña, convirtiéndose en 1894 en el más poderoso de los jeques de la Tregua. Fue el abuelo y homónimo de Zayed bin Sultan, padre fundador de los Emiratos Árabes Unidos."
  fr: "Zayed ben Khalifa Al Nahyan, dit Zayed le Grand ou Zayed Ier (sa date de naissance est incertaine: vers 1835, 1837 ou 1840 – décédé à Abou Dabi le 19 mai 1909), fut le septième souverain d’Abou Dabi de la famille Al Nahyan. Il régna pendant 54 ans, de 1855 jusqu’à sa mort. Il repoussa la tentative de retour au pouvoir de son cousin déchu, Saeed ben Tahnun, en 1856, participa à l’expédition bahreïnie de 1867 contre Doha et Wakrah, tua le souverain de Sharjah, Khalid ben Sultan, en duel en 1868, chassa les Saoudiens de Buraimi en 1870, mena une longue guerre contre le Qatar dans les années 1880, qui s’acheva par le traité de 1893, et signa l’accord de 1892 avec la Grande-Bretagne, devenant ainsi, dès 1894, le plus puissant des cheikhs de la Trêve. Il était le grand-père et l'homonyme de Zayed bin Sultan, père fondateur des Émirats arabes unis."
  tr: "Zayed bin Halife Al Nahyan, Büyük Zayed ve Zayed I olarak bilinir (doğum yılı tartışmalıdır: yaklaşık 1835, 1837 veya 1840 – 19 Mayıs 1909'da Abu Dabi'de öldü), Al Nahyan ailesinden Abu Dabi Emirliği'nin yedinci hükümdarıydı ve 1855'ten ölümüne kadar 54 yıl hüküm sürdü. 1856'da tahttan indirilen kuzeni Saeed bin Tahnoun'u yendi, 1867'de Bahreyn'in Doha ve Al Wakrah'a yönelik seferine katıldı, 1868'de Sharjah hükümdarı Halid bin Sultan'ı tek başına bir maçta öldürdü, 1870'te Suudileri Al Buraimi'den kovdu, 1880'lerde Katar ile uzun bir savaş verdi ve bu savaş 1893 anlaşmasıyla sona erdi, ayrıca 1892'de Britanya ile anlaşmayı imzaladı. 1894'e gelindiğinde, Trucial Sahili'nin en güçlü şeyhlerinden biri oldu; Birleşik Arap Emirlikleri'nin kurucusu Zayed bin Sultan'ın büyükbabasıydı ve ona bu isim verdi."
  id: "Zayed bin Khalifa Al Nahyan, dikenal sebagai Zayed yang Agung dan Zayed I (tahun kelahirannya diperdebatkan: sekitar 1835, 1837, atau 1840 – meninggal di Abu Dhabi pada 19 Mei 1909), adalah penguasa ketujuh Emirat Abu Dhabi dari keluarga Al Nahyan, memerintah selama 54 tahun dari 1855 hingga kematiannya. Ia mengalahkan sepupunya yang digulingkan, Saeed bin Tahnoun, pada tahun 1856, ikut serta dalam kampanye Bahrain tahun 1867 melawan Doha dan Al Wakrah, membunuh penguasa Sharjah, Khalid bin Sultan, dalam pertandingan solo pada tahun 1868, mengusir Saudi dari Al Buraimi pada tahun 1870, berperang panjang dengan Qatar pada tahun 1880-an yang berakhir dengan penyelesaian tahun 1893, dan menandatangani perjanjian tahun 1892 dengan Inggris. Pada tahun 1894, ia menjadi sheikh paling berkuasa di Pantai Treguial; ia adalah kakek Zayed bin Sultan, pendiri Uni Emirat Arab, dan menamainya."
