names:
  - { value: "أبو المرهل وأبو الفتح نصر بن منصور بن الحسن المقري الأديب الشاعر الحنبلي", kind: full }
summary:
  ar: "أبو المرهل وأبو الفتح أيضاً نصر بن منصور بن الحسن المقري الأديب الشاعر الحنبلي؛ ولد يوم الثلاثاء ثالث عشر جمادى الآخرة سنة إحدى وخمسمائة بالرافقة بقرب رقة الشام وكان من أولاد أمراء العرب، نشأ بالشام وخالط أهل الأدب وقال الشعر الفائق وهو مراهق، وأصابه جدري وله أربع عشرة سنة فضعف بصره ثم قدم بغداد للمعالجة فأيس الأطباء منه فعمى، فحفظ القرآن العظيم وسمع الحديث وتفقه وقرأ العربية والأدب على ابن الجواليقي، ومحب العلماء والصالحين فالشيخ عبد القادر وغيره، ومدح الخلفاء والوزراء وله ديوان شعر، وكان فصيح القول متصلباً في السنة؛ من قوله في مذهبه «أحب علياً والبنين وولدها ولا أجعل الشيخين سحق التقدم، وأبرأ ممن نال عثمان بالأذى كما أتبرأ من ولاء ابن ملجم، وتعجبني أهل الحديث بصدقهم فلست إلى قوم سواهم بمنتم»؛ توفي يوم الثلاثاء ثلاثين ربيع الآخر سنة ثمان وثمانين ودفن بمقبرة الإمام أحمد {cite:shadharat-dhahab p. 776-777}."
  en: "Abu al-Murahhil Nasr b. Mansur al-Muqri the Hanbali poet; b. Tuesday 13 Jumada II 501 at al-Rafiqa near al-Raqqa, son of Arab amirs, raised in Sham where he composed fine verse as a youth. Smallpox at fourteen dimmed his sight; Baghdad's doctors gave up and he went blind — so he memorized the Qur'an, heard hadith, trained in fiqh, studied Arabic and adab under Ibn al-Jawaliqi, and loved the scholars, Abd al-Qadir among them. He praised caliphs and wazirs and left a diwan; asked his creed he answered: 'I love Ali and the two sons and their seed, yet count not the Two Shaykhs beneath them in rank; I clear myself of Uthman's harm as of Ibn Muljam's allegiance, and the truthful hadith folk delight me — to none but them do I belong.' He died Tuesday 30 Rabi' II 588 and was buried in Imam Ahmad's cemetery {cite:shadharat-dhahab p. 776-777}."
