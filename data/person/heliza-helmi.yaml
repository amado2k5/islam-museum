summary:
  ar: "مغنية وممثلة ماليزية تحوّلت إلى الدعوة والعمل الإنساني، وُلدت باسم نور هيليزا بنت حلمي في كوالا ترغكانو في 3 فبراير 1986، وعرفها الجمهور من برنامج «أكاديمي فانتازيا» في موسمه الخامس سنة 2007. سمّتها مؤسسة الدعوة الإسلامية الماليزية ⁦(ياديم)⁩ «أيقونة دعوة»، وعملت في بعثات إنسانية إلى غزة مع أختها هزواني حلمي. بلغ حسابها على إنستغرام 2,300,000 متابع بحسب بيانات منشورها المؤرخ في 16 أبريل 2026."
  en: "Malaysian singer and actress turned dawah and humanitarian figure, born Nur Heliza binti Helmi in Kuala Terengganu on 3 February 1986, and known to the public from season 5 of Akademi Fantasia in 2007. YADIM (Yayasan Dakwah Islamiah Malaysia) lists her among its Da'wah Icons, and she has worked on humanitarian missions to Gaza with her sister Hazwani Helmi. Her Instagram account counted 2,300,000 followers by the metadata of her post dated 16 April 2026."
  ur: "مالیسیائی گلوکارہ اور اداکارہ جو دعوت اور انسانی خدمت کی طرف متوجہ ہوئیں؛ 3 فروری 1986ء کو کوالا تیرنگگانو میں نور ہیلیزا بنت حلمی کے نام سے پیدا ہوئیں، اور عوام نے انہیں 2007ء میں «اکادمی فنتازیا» کے پانچویں سیزن سے پہچانا۔ یَادِم ⁦(YADIM)⁩ نے انہیں اپنی «دعوہ آئیکنز» میں شمار کیا ہے، اور وہ اپنی بہن ہزوانی حلمی کے ساتھ غزہ کے انسانی مشنوں میں کام کر چکی ہیں۔ ان کے انسٹاگرام اکاؤنٹ کے فالوور ان کی 16 اپریل 2026ء کی پوسٹ کے میٹا ڈیٹا کے مطابق 2,300,000 تھے۔"
