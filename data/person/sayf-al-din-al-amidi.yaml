summary:
  ar: "السيف الآمدي، المتكلم العلامة صاحب التصانيف العقلية؛ ولد بآمد وتفقه للحنابلة ثم للشافعية ببغداد على علي بن فضلان وحفظ الوسيط للغزالي، وتفنن في علم النظر والكلام والحكمة وكان من أذكياء العالم؛ أقرأ بمصر فنسب إلى دين الأوائل وكتبوا محضراً بإباحة دمه فخرج مستخفياً إلى الشام فنزل حماة وصنف في الأصلين والحكمة والمنطق، ثم قدم دمشق فولاه المعظم تدريس العزيزية فلما ولي الأشرف عُزل ونودي في المدارس أن من ذكر غير التفسير والحديث والفقه أو تعرض لكلام الفلاسفة نُفي، فأقام خافياً في بيته حتى توفي ودفن بقاسيون؛ قال ابن عبد السلام ما تعلمنا قواعد البحث إلا منه، وقال سبط ابن الجوزي لم يكن في زمانه من يجاريه في الأصلين وعلم الكلام؛ من تصانيفه الإحكام في أصول الأحكام في مجلدين وأبكار الأفكار في أصول الدين في خمس مجلدات {cite:shadharat-dhahab p. 144-145}."
  en: "Sayf al-Din al-Amidi (post-550–631) — the master usuli of the age: born at Amid, Hanbali then Shafi'i at Baghdad, memorized al-Ghazali's Wasit; expelled from Egypt on a blood-licensing writ over his philosophical learning, sheltered in Hama then Damascus where al-Mu'azzam gave him the Aziziyya — until al-Ashraf banned everything but tafsir, hadith and fiqh; died in hiding at Qasyun. His Ihkam fi Usul al-Ahkam and Abkar al-Afkar became canonical {cite:shadharat-dhahab p. 144-145}."
  es: "Sayf al-Din al-Amidi (post 550–631) — el maestro de los usuli de la época: nació en Amid, fue hanbalí y luego shafi'í en Bagdad, memorizó el Wasit de al-Ghazali; fue expulsado de Egipto por una orden de extorsión basada en su erudición filosófica, se refugió en Hama y luego en Damasco, donde al-Mu'azzam le dio el Aziziyya, hasta que al-Ashraf prohibió todo excepto el tafsir, el hadiz y el fiqh; murió escondido en Qasyun. Su Ihkam fi Usul al-Ahkam y Abkar al-Afkar se convirtieron en obras canónicas {cite:shadharat-dhahab p. 144-145}."
  fr: "Sayf al-Din al-Amidi (après 550-631) – le maître usuli de son époque: né à Amid, il étudia l’école hanbalite puis chaféite à Bagdad, mémorisa le Wasit d’al-Ghazali; expulsé d’Égypte suite à une condamnation pour interdiction de l’enseignement philosophique, il trouva refuge à Hama puis à Damas où al-Mu’azzam lui transmit l’Aziziyya – jusqu’à ce qu’al-Ashraf interdise tout sauf le tafsir, le hadith et le fiqh; il mourut caché à Qasyun. Ses ouvrages Ihkam fi Usul al-Ahkam et Abkar al-Afkar devinrent canoniques (voir: shadharat-dhahab, p. 144-145)."
  ur: "سیف الدین العامیدی ⁦(پوسٹ-550-631)⁩ - عمر کا ماسٹر اصول: امید میں پیدا ہوا، حنبلی پھر بغداد میں شافعی، الغزالی کی وصیت کو حفظ کیا؛ اپنی فلسفیانہ تعلیم پر ایک خونی لائسنسنگ رٹ پر مصر سے نکال دیا گیا، حما پھر دمشق میں پناہ لی جہاں المعظم نے انہیں عزیزیہ دیا — یہاں تک کہ الاشرف نے تفسیر، حدیث اور فقہ کے علاوہ ہر چیز پر پابندی لگا دی۔ وہ قصیون میں چھپ کر مر گیا۔ ان کے احکام فی اصول الاحکام اور ابکر الافکار اصول بن گئے 144-145}۔"
  tr: "El-Seyf El-Amidi, ünlü teolog ve akılcı eserlerin yazarı; Amed'de doğmuş, önce Hanbalilerden, sonra Bağdat'ta Ali ibn Fadlan'dan Şafi'lerden fıkıh okudu ve El-Gazali'den El-Vesileri ezberledi. Vizyon, teoloji ve hikmet bilimlerinde üstün başarıyordu. Dünyanın en zekileri arasındaydı; Mısır'da eğitim gördü, erken alimlerin dinine atfedildi ve onlar onun kanına izin veren bir ferman yazdılar. Gizlice Şam'a gitti, Hama'ya yerleşti ve felsefe ve mantık üzerine kitaplar yazdı. Sonra Şam'a geldi ve büyük âlim onu El-Aziziye'de öğretmen olarak atadı. El-Eşref göreve başladığında, görevden alındı ve okullarda Tafsir, hadis ve fıkhi dışında bir şey ananların ya da ifşa edildiği ilan edildi Filozofların sözlerini reddetti, bu yüzden ölene kadar gizlice evinde kaldı ve Kasioun'a defnedildi; İbn Abdülselam şöyle dedi: Araştırmanın ilkelerini sadece ondan öğrendik. İbn el-Cavazi ise kendi zamanında kimsenin iki ilke ve teoloji açısından ona eşlik edemediğini söyledi; eserleri arasında iki ciltlik El-İhkam fi Usul el-Ahkam ve beş ciltlik Abakar el-Afkar fi Usul al-Din (atı: şadharat-dhahab, s. 144-145} yer alır."
  id: "Al-Saif Al-Amidi, teolog terkenal dan penulis karya-karya rasional; lahir di Amed, mempelajari hukum di bawah Hanbal dan kemudian Shafi'i di Baghdad di bawah Ali ibn Fadlan, dan menghafal Al-Waseet oleh Al-Ghazali. Ia unggul dalam ilmu visi, teologi, dan kebijaksanaan. Ia termasuk yang paling cerdas di dunia; ia belajar di Mesir, dikaitkan dengan agama para ulama awal, dan mereka menulis dekrit yang mengizinkan darahnya. Ia diam-diam pergi ke Levant, menetap di Hama, dan menulis buku tentang dua prinsip tersebut, filsafat dan logika. Kemudian ia datang ke Damaskus, dan ulama besar itu mengangkatnya untuk mengajar di Al-Aziziyah. Ketika Al-Ashraf menjabat, ia diberhentikan dan diumumkan di sekolah-sekolah bahwa siapa pun yang menyebutkan selain Tafsir, hadis, dan fiqer atau mengungkapkan Ia menyangkal kata-kata para filsuf, sehingga ia diam-diam tinggal di rumahnya hingga wafat dan dimakamkan di Qasioun; Ibn Abd al-Salam berkata: Kami hanya belajar prinsip-prinsip penelitian darinya. Subt Ibn al-Jawzi mengatakan bahwa tidak ada seorang pun pada zamannya yang menandinginya dalam dua prinsip dan teologi; di antara karyanya adalah Al-Ihkam fi Usul al-Ahkam dalam dua jilid dan Abakar al-Afkar fi Usul al-Din dalam lima jilid {cite:shadharat-dhahab, hlm. 144-145}."
