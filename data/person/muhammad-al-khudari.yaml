summary:
  ar: "الشيخ محمد الخضري، مؤلف «نور اليقين في سيرة سيد المرسلين» و«محاضرات تاريخ الأمم الإسلامية»؛ يقدّمه غلاف الطبعة الرابعة من نور اليقين ⁦(1926م)⁩ مفتشاً بوزارة المعارف ومدرساً للتاريخ الإسلامي بالجامعة المصرية سابقاً، ويسمي نفسه في مقدمته ابن الشيخ عفيفي الباجوري."
  en: "Shaykh Muhammad al-Khudari, author of Nur al-Yaqin fi Sirat Sayyid al-Mursalin and of lectures on the history of the Islamic nations; the title page of the fourth edition of Nur al-Yaqin (1926) presents him as an inspector at the Ministry of Education and former teacher of Islamic history at the Egyptian University, and in its preface he calls himself son of Shaykh Afifi al-Bajuri."
  es: "Shaykh Muhammad al-Khudari, autor de Nur al-Yaqin fi Sirat Sayyid al-Mursalin y de conferencias sobre la historia de las naciones islámicas; la portada de la cuarta edición de Nur al-Yaqin (1926) lo presenta como inspector del Ministerio de Educación y antiguo profesor de historia islámica en la Universidad Egipcia, y en su prefacio se hace llamar hijo de Shaykh Afifi al-Bajuri."
  fr: "Cheikh Muhammad al-Khudari, auteur de Nur al-Yaqin fi Sirat Sayyid al-Mursalin et de conférences sur l'histoire des nations islamiques; la page de titre de la quatrième édition de Nur al-Yaqin (1926) le présente comme inspecteur au ministère de l'Éducation et ancien professeur d'histoire islamique à l'université égyptienne, et dans sa préface, il se dit fils de Cheikh Afifi al-Bajuri."
  ur: "شیخ محمد الخدری، نور الیقین فی سیرت سید المرسلین کے مصنف اور اسلامی اقوام کی تاریخ پر لیکچرز؛ نور الیقین (1926) کے چوتھے ایڈیشن کا ٹائٹل پیج انہیں وزارت تعلیم میں انسپکٹر اور مصری یونیورسٹی میں اسلامی تاریخ کے سابق استاد کے طور پر پیش کرتا ہے اور اس کے دیباچے میں وہ خود کو شیخ عفیفی البجوری کا بیٹا بتاتا ہے۔"
