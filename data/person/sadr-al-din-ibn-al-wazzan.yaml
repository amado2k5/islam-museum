summary:
  ar: "صدر الدين محمد بن الوزان، رئيس الشافعية بالري وكان قد تقدم عند خوارزم شاه علاء الدين تكش تقدماً عظيماً؛ قتلته الملاحدة — أي الإسماعيلية — في أيام حصر تكش لحصن الموت سنة خمس وتسعين وخمسمائة {cite:kamil-ibn-al-athir p. 263}."
  en: "Muhammad ibn al-Wazzan, head of the Shafi'is of Rayy and highly placed with the Khwarazmshah Takish — killed by the Ismailis during Takish's operations against their fortresses in 595 {cite:kamil-ibn-al-athir p. 263}."
  es: "Muhammad ibn al-Wazzan, jefe de los shafi'is de Rayy y de alto rango con el shah khwarazm Takish, fue asesinado por los ismaelitas durante las operaciones de Takish contra sus fortalezas en 595 {cite:kamil-ibn-al-athir p. 263}."
  fr: "Muhammad ibn al-Wazzan, chef des Shafi'is de Rayy et haut placé auprès du Khwarezmshah Takish — tué par les Ismaéliens lors des opérations de Takish contre leurs forteresses en 595 {cite:kamil-ibn-al-athir p. 263}."
