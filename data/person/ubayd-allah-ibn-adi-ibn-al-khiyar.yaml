summary:
  ar: "عبيد الله بن عدي بن الخيار بن عدي بن نوفل، النوفلي القرشي المدني، ولد في حياة النبي، وكان أبوه من الطلقاء، روى عن عمر وعلي وعثمان وعبد الرحمن بن الأسود، وعنه عروة بن الزبير وعطاء بن يزيد وحميد بن عبد الرحمن بن عوف، وكان من فقهاء قريش وعلمائهم، ثقة قليل الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13362}"
  en: "Ubayd Allah ibn Adi ibn al-Khiyar ibn Adi ibn Nawfal, al-Nawfali al-Qurashi al-Madani. He was born in the Prophet's lifetime, and his father was among the freed Meccans. He narrated from Umar, Ali, Uthman and others; Urwa ibn al-Zubayr and Ata ibn Yazid narrated from him. He was reliable, a man of few reports, and one of the jurists and scholars of Quraysh. The printed text gives no death date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13362}"
