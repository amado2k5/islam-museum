summary:
  ar: "أبو فارس عبد العزيز بن أحمد المريني، الملقب بالمستنصر بالله، من ملوك الدولة المرينية في المغرب الأقصى، بويع بتازا سنة 796 هـ ومات بفاس سنة 799 هـ بعد ملك دام ثلاث سنين وشهرا."
  en: "Abu Faris Abd al-Aziz ibn Ahmad, styled al-Mustansir bi-llah, a Marinid king of the far Maghrib, given allegiance at Taza in 796 AH and died in Fez in 799 AH (1396) after a reign of three years and a month."
  fr: "Abu Faris Abd al-Aziz ibn Ahmad, surnommé al-Mustansir bi-llah, roi mérinide du Maghreb extrême, à qui l'on prêta allégeance à Taza en 796 H et qui mourut à Fès en 799 H (1396) après un règne de trois ans et un mois."
  es: "Abu Faris Abd al-Aziz ibn Ahmad, llamado al-Mustansir bi-llah, un rey mariní del Magreb lejano, prestó juramento de lealtad en Taza en el año 796 de la Hégira y murió en Fez en el año 799 de la Hégira (1396) después de un reinado de tres años y un mes."
  ur: "ابو فارس عبد العزیز ابن احمد، المغرب کے ایک مرینی بادشاہ، المستنصر باللہ کے طرز کے، نے 796 ہجری میں تعزہ کے مقام پر بیعت کی اور تین سال اور ایک ماہ کی حکومت کے بعد 799 ہجری (1396) میں فیض میں وفات پائی۔"
