summary:
  ar: "إمام وخطيب المسجد الحرام وقارئ معروف بصوته وقراءته المتقنة، وُلد سنة 1969، عُيّن إماما رسميا للمسجد الحرام عام 1428هـ، وسجّل سنة 2006 المصحف المرتل المشترك لإذاعة وتلفزيون السعودية، وألقى خطبة عرفة بمسجد نمرة عام 1445هـ/2024م، وهو أستاذ مساعد بجامعة أم القرى."
  en: "Imam and preacher of the Grand Mosque of Mecca and a Qur'an reciter known for his voice and precise recitation, born in 1969. He was appointed an official imam of the Grand Mosque in 1428 AH, recorded the joint murattal mushaf for Saudi radio and television in 2006, delivered the Arafat sermon at Namira Mosque in 1445 AH / 2024, and is an assistant professor at Umm al-Qura University."
  ur: "مسجد حرام کے امام و خطیب اور اپنی آواز و متقن قرأت کے لیے معروف قاری، جو 1969 میں پیدا ہوئے۔ وہ 1428ھ میں مسجد حرام کے باقاعدہ امام مقرر ہوئے، 2006 میں سعودی ریڈیو و ٹیلی ویژن کے لیے مشترکہ مصحف مرتل ریکارڈ کیا، 1445ھ/2024 میں مسجد نمرہ میں خطبۂ عرفہ دیا، اور جامعہ ام القری میں اسسٹنٹ پروفیسر ہیں۔"
