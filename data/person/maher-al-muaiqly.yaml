summary:
  ar: "إمام وخطيب المسجد الحرام وقارئ معروف بصوته وقراءته المتقنة، وُلد سنة 1969، عُيّن إماما رسميا للمسجد الحرام عام 1428هـ، وسجّل سنة 2006 المصحف المرتل المشترك لإذاعة وتلفزيون السعودية، وألقى خطبة عرفة بمسجد نمرة عام 1445هـ/2024م، وهو أستاذ مساعد بجامعة أم القرى."
  en: "Imam and preacher of the Grand Mosque of Mecca and a Qur'an reciter known for his voice and precise recitation, born in 1969. He was appointed an official imam of the Grand Mosque in 1428 AH, recorded the joint murattal mushaf for Saudi radio and television in 2006, delivered the Arafat sermon at Namira Mosque in 1445 AH / 2024, and is an assistant professor at Umm al-Qura University."
  ur: "مسجد حرام کے امام و خطیب اور اپنی آواز و متقن قرأت کے لیے معروف قاری، جو 1969 میں پیدا ہوئے۔ وہ 1428ھ میں مسجد حرام کے باقاعدہ امام مقرر ہوئے، 2006 میں سعودی ریڈیو و ٹیلی ویژن کے لیے مشترکہ مصحف مرتل ریکارڈ کیا، 1445ھ/2024 میں مسجد نمرہ میں خطبۂ عرفہ دیا، اور جامعہ ام القری میں اسسٹنٹ پروفیسر ہیں۔"
  es: "Imán y predicador de la Gran Mezquita de La Meca y recitador del Corán conocido por su voz y recitación precisa, nació en 1969. Fue nombrado imán oficial de la Gran Mezquita en 1428 AH, grabó el mushaf murattal conjunto para la radio y la televisión saudíes en 2006, pronunció el sermón de Arafat en la Mezquita de Namira en 1445 AH / 2024, y es profesor asistente en la Universidad Umm al-Qura."
  fr: "Imam et prédicateur de la Grande Mosquée de La Mecque, récitant du Coran réputé pour sa voix et sa récitation précise, né en 1969. Il a été nommé imam officiel de la Grande Mosquée en 1428 AH, a enregistré le mushaf murattal conjoint pour la radio et la télévision saoudiennes en 2006, a prononcé le sermon d'Arafat à la mosquée Namira en 1445 AH / 2024, et est professeur adjoint à l'université Umm al-Qura."
  tr: "Mescid-Camii'nin imamı ve vaizi olup, kesin sesi ve tilavetiyle tanınan tanınmış bir şifacidir. 1969 doğumludur. 1428 Hicri yılında resmen Mescid-i Cami imamı olarak atanmıştır. 2006 yılında Suudi Radyo ve Televizyonu için Kur'an'ın ortak okumasını kaydetmiştir. 1445 Hicri / 2024 yılında Namirah Camii'nde Arafah vaazını vermiştir. Umm El-Kura Üniversitesi'nde yardımcı doçenttir."
  id: "Ia adalah imam dan pengkhotbah Masjid Agung serta seorang pembaca yang terkenal karena suara dan pembacaannya yang tepat. Ia lahir pada tahun 1969. Secara resmi diangkat sebagai imam Masjid Agung pada tahun 1428 H. Pada tahun 2006, ia merekam pembacaan bersama Al-Qur'an untuk Radio dan Televisi Saudi. Ia menyampaikan khotbah Arafah di Masjid Namirah pada tahun 1445 H / 2024 M. Ia adalah asisten profesor di Universitas um Al-Qura."
