summary:
  ar: "ناشطة اجتماعية صومالية كندية، وُلدت في مقديشو؛ عادت من كندا إلى الصومال سنة 2010، وتعمل مع أمها فرتون آدن في مركز علمان للسلام وحقوق الإنسان، حيث شاركت في تأسيس «الأخت الصومال» أول مركز أزمات لضحايا العنف الجنسي في البلاد، وصممت برامج لنزع سلاح الأطفال الجنود وإعادة تأهيلهم، وحصلت مع أمها على جائزة رايت ليفليهود سنة 2022."
  en: "Somali-Canadian social activist, born in Mogadishu. She returned from Canada to Somalia in 2010 and works alongside her mother Fartuun Adan at the Elman Peace and Human Rights Centre, where she co-founded Sister Somalia, the country's first rape crisis centre, and designed programmes for the disarmament and rehabilitation of child soldiers. She and her mother received the Right Livelihood Award in 2022."
  ur: "صومالی کینیڈین سماجی کارکن، موغادیشو میں پیدا ہوئیں؛ 2010 میں کینیڈا سے صومالیہ واپس آئیں اور اپنی والدہ فرتون عدن کے ساتھ علمان امن و انسانی حقوق مرکز میں کام کرتی ہیں، جہاں انھوں نے ملک کا پہلا عصمت دری بحران مرکز «سسٹر صومالیہ» قائم کرنے میں حصہ لیا اور بچہ فوجیوں کی تخفیفِ اسلحہ و بحالی کے پروگرام بنائے۔ انھیں اور ان کی والدہ کو 2022 میں رائٹ لائیولی ہڈ ایوارڈ ملا۔"
