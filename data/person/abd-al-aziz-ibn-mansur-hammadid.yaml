summary:
  ar: "بطاقة أولية لعبد العزيز بن المنصور، سلطان الحماديين في قلعة بني حماد من سنة ١١٠٤م إلى ١١٢١م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd al-Aziz ibn al-Mansur, the Hammadid sultan of Qal'a Bani Hammad from 1104 to 1121; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abd al-Aziz ibn al-Mansur, el sultán hammadí de Qal'a Bani Hammad desde 1104 hasta 1121; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Abd al-Aziz ibn al-Mansur, sultan hammadide de Qal'a Bani Hammad de 1104 à 1121; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "1104 سے 1121 تک قلعہ بنی حماد کے حمادی سلطان عبد العزیز ابن المنصور کے لیے ڈرافٹ کارڈ؛ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1104-1121 yılları arasında Beni Hammad kalesinde Hammadîler Sultanı olan Abdül Aziz bin El-Mansur'a ait ön taslak bir kart; İslam ülkelerinin sözlüklerinde adı geçmektedir ve biyografisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Abdul Aziz bin Al-Mansur, Sultan Hammadid di benteng Bani Hammad dari tahun 1104 M hingga 1121 M; ia disebutkan dalam kamus negara-negara Islam dan biografinya belum ditinjau di halaman ini."
