summary:
  ar: "ولي الدين بن مصطفى الينيشهري القسطنطيني، أبو عبد الله، الملقب بجار الله الرومي الحنفي، ولد في يني شهر وجاور بمكة سبع سنين وسكن إسطنبول وبنى فيها مدرسة ومكتبة ودفن في المدرسة، وتوفي سنة 1151 هـ."
  en: "Veliyyuddin ibn Mustafa al-Yenishehri al-Qustantini, Abu Abdallah, called Jarullah al-Rumi al-Hanafi; born at Yenishehir, he stayed beside the sanctuary at Mecca for seven years, then settled in Istanbul where he built a madrasa and library near the Fatih mosque and was buried in the madrasa; died 1151 AH (1738)."
