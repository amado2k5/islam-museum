summary:
  ar: "عبد الغني بن أحمد بن عبد القادر الرافعي البيساري الفاروقي، قاض من فقهاء الحنفية، ولد وتعلم في طرابلس بالشام، وأخذ الحديث عن علماء دمشق، وعين مفتيا لطرابلس ثلاث سنوات ثم قاضيا للواء تعز باليمن. من تصانيفه: تعليقات على حاشية ابن عابدين على الدرر، وشرح بديعية الصفي الحلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
  en: "Abd al-Ghani ibn Ahmad ibn 'Abd al-Qadir al-Rafi'i al-Bisari al-Faruqi, a judge and Hanafi jurist. He was born and educated in Tripoli in Syria, took hadith from the scholars of Damascus, served three years as mufti of Tripoli and then as judge of the district of Ta'izz in Yemen. His works include notes on Ibn 'Abidin's gloss on al-Durar and a commentary on the poem by al-Safi al-Hilli. The heading gives his dates as 1233 to 1308 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
