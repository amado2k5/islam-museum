id: person/abd-al-ghani-al-rafii
class: person
label: { ar: "عبد الغني الرافعي", en: "Abd al-Ghani al-Rafi'i", fr: "Abd al-Ghani al-Rafi'i", es: "Abd al-Ghani al-Rafi'i", ur: "عبد الغنی الرفاعی" }
summary:
  ar: "عبد الغني بن أحمد بن عبد القادر الرافعي البيساري الفاروقي، قاض من فقهاء الحنفية، ولد وتعلم في طرابلس بالشام، وأخذ الحديث عن علماء دمشق، وعين مفتيا لطرابلس ثلاث سنوات ثم قاضيا للواء تعز باليمن. من تصانيفه: تعليقات على حاشية ابن عابدين على الدرر، وشرح بديعية الصفي الحلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
  en: "Abd al-Ghani ibn Ahmad ibn 'Abd al-Qadir al-Rafi'i al-Bisari al-Faruqi, a judge and Hanafi jurist. He was born and educated in Tripoli in Syria, took hadith from the scholars of Damascus, served three years as mufti of Tripoli and then as judge of the district of Ta'izz in Yemen. His works include notes on Ibn 'Abidin's gloss on al-Durar and a commentary on the poem by al-Safi al-Hilli. The heading gives his dates as 1233 to 1308 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
  fr: "Abd al-Ghani ibn Ahmad ibn 'Abd al-Qadir al-Rafi'i al-Bisari al-Faruqi, juge et juriste hanafite. Il naquit et fut instruit à Tripoli de Syrie, reçut le hadith des savants de Damas, fut trois ans mufti de Tripoli puis juge du district de Ta'izz au Yémen. Ses œuvres comprennent des notes sur la glose d'Ibn 'Abidin sur al-Durar et un commentaire du poème d'al-Safi al-Hilli. L'en-tête donne ses dates de 1233 à 1308 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
  es: "Abd al-Ghani ibn Ahmad ibn 'Abd al-Qadir al-Rafi'i al-Bisari al-Faruqi, juez y jurista hanafí. Nació y se educó en Trípoli, Siria, estudió hadices con los eruditos de Damasco, fue muftí de Trípoli durante tres años y posteriormente juez del distrito de Ta'izz, en Yemen. Entre sus obras se incluyen notas sobre la glosa de Ibn 'Abidin sobre al-Durar y un comentario sobre el poema de al-Safi al-Hilli. El encabezado indica que vivió entre 1233 y 1308 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10356}"
  ur: "عبد الغنی بن احمد بن عبد القادر الرافعی البصری الفارقی، ایک قاضی اور حنفی فقیہ۔ وہ شام کے شہر طرابلس میں پیدا ہوئے اور تعلیم حاصل کی، دمشق کے علماء سے حدیثیں لیں، تین سال طرابلس کے مفتی اور پھر یمن کے ضلع تعز کے جج کے طور پر خدمات انجام دیں۔ ان کی تصانیف میں الدرار پر ابن عابدین کی تعریف اور الصفی ہلی کی نظم پر تبصرہ شامل ہے۔ عنوان میں اس کی تاریخیں 1233 سے 1308 ہجری بتائی گئی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10355} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10356}"
