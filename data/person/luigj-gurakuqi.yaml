summary:
  ar: "كاتب ورجل دولة ألباني من شكودر، من موقعي إعلان الاستقلال سنة 1912 ووزير التعليم في أول حكومة ألبانية، أدار المدرسة النظامية في إلباسان، وكان وزير المالية في حكومة فان نولي سنة 1924، واغتيل في منفاه بباري سنة 1925."
  en: "Albanian writer and statesman from Shkodër: signatory of the 1912 declaration of independence and minister of education in the first Albanian government, director of the Elbasan Normal School, and minister of finance in Fan Noli's 1924 government; assassinated in exile at Bari in 1925."
  ur: "شکودر سے تعلق رکھنے والے البانوی ادیب اور رہنما؛ 1912 کے اعلانِ آزادی کے دستخط کنندہ اور پہلی البانوی حکومت میں وزیرِ تعلیم، الباسان نارمل سکول کے ڈائریکٹر، اور 1924 میں فان نولی کی حکومت میں وزیرِ خزانہ؛ 1925 میں باری میں جلاوطنی کے دوران قتل ہوئے۔"
