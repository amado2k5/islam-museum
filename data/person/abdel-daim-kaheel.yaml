summary:
  ar: "مهندس ميكانيك وباحث سوري في الإعجاز العلمي في القرآن والسنة. هو مؤسس «موسوعة الإعجاز العلمي» على الإنترنت (kaheel7.net) وقنواتها ومؤلف موادها، وعضو الهيئة العالمية للإعجاز العلمي في القرآن والسنة، وله أكثر من أربعين كتابا منها «إشراقات الرقم سبعة في القرآن الكريم»."
  en: "Syrian mechanical engineer and researcher in the scientific miracles (i'jaz) of the Qur'an and Sunnah. He is the founder and author of the online Encyclopedia of Scientific Miracles (kaheel7.net) and its channels, a member of the World Commission on Scientific Miracles in the Qur'an and Sunnah, and the author of more than forty books, among them 'Ishraqat al-Raqm Sab'a' (Radiances of the Number Seven in the Holy Qur'an)."
  ur: "شامی مکینیکل انجینئر اور قرآن و سنت کے علمی اعجاز کے محقق۔ وہ آن لائن «موسوعہِ اعجازِ علمی» (kaheel7.net) اور اس کے چینلز کے بانی اور مصنف ہیں، عالمی ہیئت برائے علمی اعجاز کے رکن ہیں، اور ان کی چالیس سے زائد کتابیں ہیں جن میں «اشراقات الرقم سبعہ فی القرآن الکریم» شامل ہے۔"
