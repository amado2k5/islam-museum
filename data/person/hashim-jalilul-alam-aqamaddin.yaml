summary:
  ar: "السلطان الخامس والعشرون لبروناي (1885–1906)، ابن عمر علي سيف الدين الثاني. وإزاء توسّع تشارلز بروك من ساراواك طلب الحماية البريطانية، فجاءت اتفاقية الحماية سنة 1888 ثم الاتفاقية التكميلية 1905–1906 التي أتت بمقيم بريطاني. توفي في 10 أيار 1906 وخلفه ابنه محمد جمال العالم الثاني."
  en: "The 25th Sultan of Brunei (1885–1906), son of Omar Ali Saifuddien II. Facing Charles Brooke's expansion from Sarawak, he sought British protection: the Protectorate Agreement of 1888 and the Supplementary Agreement of 1905–06, which brought a British Resident, followed. He died on 10 May 1906 and was succeeded by his son Muhammad Jamalul Alam II."
  ur: "برونائی کے پچیسویں سلطان (1885ء–1906ء)، عمر علی سیف الدین دوم کے بیٹے۔ ساراواک سے چارلس بروک کی توسیع کے مقابل انہوں نے برطانوی تحفظ طلب کیا: 1888ء کا معاہدۂ تحفظ اور پھر 1905ء–1906ء کا اضافی معاہدہ ہوا جس سے برطانوی ریزیڈنٹ آیا۔ 10 مئی 1906ء کو وفات پائی اور ان کے بیٹے محمد جمال عالم دوم جانشین ہوئے۔"
