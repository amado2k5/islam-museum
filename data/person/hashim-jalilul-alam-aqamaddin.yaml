summary:
  ar: "السلطان الخامس والعشرون لبروناي (1885–1906)، ابن عمر علي سيف الدين الثاني. وإزاء توسّع تشارلز بروك من ساراواك طلب الحماية البريطانية، فجاءت اتفاقية الحماية سنة 1888 ثم الاتفاقية التكميلية 1905–1906 التي أتت بمقيم بريطاني. توفي في 10 أيار 1906 وخلفه ابنه محمد جمال العالم الثاني."
  en: "The 25th Sultan of Brunei (1885–1906), son of Omar Ali Saifuddien II. Facing Charles Brooke's expansion from Sarawak, he sought British protection: the Protectorate Agreement of 1888 and the Supplementary Agreement of 1905–06, which brought a British Resident, followed. He died on 10 May 1906 and was succeeded by his son Muhammad Jamalul Alam II."
  ur: "برونائی کے پچیسویں سلطان ⁦(1885ء–1906ء)⁩، عمر علی سیف الدین دوم کے بیٹے۔ ساراواک سے چارلس بروک کی توسیع کے مقابل انہوں نے برطانوی تحفظ طلب کیا: 1888ء کا معاہدۂ تحفظ اور پھر 1905ء–1906ء کا اضافی معاہدہ ہوا جس سے برطانوی ریزیڈنٹ آیا۔ 10 مئی 1906ء کو وفات پائی اور ان کے بیٹے محمد جمال عالم دوم جانشین ہوئے۔"
  es: "El 25.º sultán de Brunéi (1885-1906), hijo de Omar Ali Saifuddien II. Ante la expansión de Charles Brooke desde Sarawak, buscó la protección británica: posteriormente se firmaron el Acuerdo de Protectorado de 1888 y el Acuerdo Suplementario de 1905-1906, que estableció un residente británico. Falleció el 10 de mayo de 1906 y fue sucedido por su hijo Muhammad Jamalul Alam II."
  fr: "Le 25e sultan de Brunei (1885-1906), fils d'Omar Ali Saifuddien II, sollicita la protection britannique face à l'expansion de Charles Brooke depuis le Sarawak. S'ensuivirent l'accord de protectorat de 1888 et l'accord complémentaire de 1905-1906, qui instaura la présence d'un résident britannique. Il mourut le 10 mai 1906 et son fils, Muhammad Jamalul Alam II, lui succéda."
  tr: "Brunei'nin yirmi beşinci Sultanı (1885–1906), Umar Ali Saif al-Din II'nin oğlu. Charles Brooke'un Sarawak'tan genişlemesine yanıt olarak, İngiliz koruması talep etti; bu da 1888 Koruma Anlaşması'na ve ardından 1905–1906 Ek Anlaşması'na yol açtı; bu anlaşma Britanya'ya ikamet hakkı getirdi. 10 Mayıs 1906'da öldü ve yerine oğlu Muhammed Cemal Alam II geçti."
  id: "Sultan Brunei kedua puluh lima (1885–1906), putra Umar Ali Saif al-Din II. Sebagai respons atas perluasan Charles Brooke dari Sarawak, ia mencari perlindungan Inggris, yang mengarah pada Perjanjian Perlindungan tahun 1888, diikuti oleh Perjanjian Tambahan tahun 1905–1906, yang membawa status tinggal Inggris. Ia meninggal pada 10 Mei 1906, dan digantikan oleh putranya Muhammad Jamal Alam II."
