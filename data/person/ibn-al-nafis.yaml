summary:
  ar: "شيخ الطب بالديار المصرية، ومن انتهت إليه معرفة الطب، مع الذكاء المفرط والذهن الخارق والمشار إليه في الفقه والأصول والحديث والعربية والمنطق؛ ألّف في الطب كتاب «الشامل» الذي تدل فهرسته على أنه يكون ثلثمائة مجلدة بيّض منها ثمانين، وكانت تصانيفه يمليها من حفظه لا يحتاج إلى مراجعة؛ قالوا: لم يكن على وجه الأرض مثله، وقيل لا جاء بعد ابن سينا مثله وكان في العلاج أعظم منه؛ وقف أملاكه وكتبه على المارستان المنصوري ولم يخلف مثله {cite:shadharat-dhahab p. 702-703}."
  en: "Shaykh of medicine in Egypt — 'nothing like him on earth, nor since Ibn Sina, and greater than him in treatment'; al-Shamil was projected at 300 volumes of which he fair-copied eighty, all dictated from memory; endowed his estate and books to the Mansuri maristan {cite:shadharat-dhahab p. 702-703}."
