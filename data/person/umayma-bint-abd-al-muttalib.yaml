summary:
  ar: عمة النبي؛ تزوجت في الجاهلية «حجير بن رئاب الأسدي» ⁦(كما في الطبعة)⁩ فولدت له عبد الله وعبيد الله وأبا أحمد وزينب وحمنة، واختُلف في إسلامها.
  en: An aunt of the Prophet, married before Islam to Hujayr ibn Ri'ab al-Asadi (as printed in this edition), mother of Abdullah, Ubaydullah, Abu Ahmad, Zaynab and Hamna; her Islam is disputed.
  es: "Tía del Profeta, casada antes del Islam con Hujayr ibn Ri'ab al-Asadi (como aparece impreso en esta edición), madre de Abdullah, Ubaydullah, Abu Ahmad, Zaynab y Hamna; su Islam es objeto de controversia."
  fr: "Une tante du Prophète, mariée avant l'islam à Hujayr ibn Ri'ab al-Asadi (comme indiqué dans cette édition), mère d'Abdullah, Ubaydullah, Abu Ahmad, Zaynab et Hamna; sa conversion à l'islam est contestée."
  ur: "نبی کی ایک خالہ، جس کی شادی اسلام سے پہلے حجیر بن ریاب الاسدی ⁦(جیسا کہ اس ایڈیشن میں چھپی ہے)⁩ سے ہوئی، عبداللہ، عبید اللہ، ابو احمد، زینب اور حمنہ کی والدہ؛ اس کا اسلام متنازعہ ہے۔"
