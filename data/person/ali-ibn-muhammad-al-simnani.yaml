id: person/ali-ibn-muhammad-al-simnani
class: person
label: { ar: "علي بن محمد السمناني", en: "Ali ibn Muhammad al-Simnani" }
summary:
  ar: "علي بن محمد بن أحمد، أبو القاسم، الحلبي الحنفي السمناني، نسبة إلى سمان من بلاد قومس بين الدامغان وخوار الري. فقيه ومؤرخ، تفقه على قاضي القضاة أبي عبد الله محمد بن علي الدامغاني، وقرأ الكلام والأصول على أبي علي محمد بن أحمد بن الوليد. من تصانيفه «روضة القضاة وطريق النجاة» و«سراج المصلي وشروط الصلاة» و«المسألة النظامية في الأشربة» و«كنز العلماء والمتعلمين في علم الشروط» و«الهادي إلى النظر في المسائل وطلب الدلائل» و«المرشد النظامي» و«العروة الوثقى في الشروط». ويذكر الكتاب وفاته سنة 499 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
  en: "Ali ibn Muhammad ibn Ahmad, Abu al-Qasim, al-Halabi al-Hanafi al-Simnani, named after Saman, a town in Qumis between Damghan and Khuwar al-Rayy. A Hanafi jurist and historian, he studied law with the chief judge Abu Abd Allah Muhammad ibn Ali al-Damghani and studied theology and legal theory with Abu Ali Muhammad ibn Ahmad ibn al-Walid. His works include Rawdat al-qudat wa-tariq al-najat on the duties of judges, and al-Urwa al-wuthqa on contracts and conditions. The book gives his death as 499 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
