id: person/ali-ibn-muhammad-al-simnani
class: person
label: { ar: "علي بن محمد السمناني", en: "Ali ibn Muhammad al-Simnani", es: "Ali ibn Muhammad al-Simnani", fr: "Ali ibn Muhammad al-Simnani", ur: "علی بن محمد السمنانی" }
summary:
  ar: "علي بن محمد بن أحمد، أبو القاسم، الحلبي الحنفي السمناني، نسبة إلى سمان من بلاد قومس بين الدامغان وخوار الري. فقيه ومؤرخ، تفقه على قاضي القضاة أبي عبد الله محمد بن علي الدامغاني، وقرأ الكلام والأصول على أبي علي محمد بن أحمد بن الوليد. من تصانيفه «روضة القضاة وطريق النجاة» و«سراج المصلي وشروط الصلاة» و«المسألة النظامية في الأشربة» و«كنز العلماء والمتعلمين في علم الشروط» و«الهادي إلى النظر في المسائل وطلب الدلائل» و«المرشد النظامي» و«العروة الوثقى في الشروط». ويذكر الكتاب وفاته سنة 499 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
  en: "Ali ibn Muhammad ibn Ahmad, Abu al-Qasim, al-Halabi al-Hanafi al-Simnani, named after Saman, a town in Qumis between Damghan and Khuwar al-Rayy. A Hanafi jurist and historian, he studied law with the chief judge Abu Abd Allah Muhammad ibn Ali al-Damghani and studied theology and legal theory with Abu Ali Muhammad ibn Ahmad ibn al-Walid. His works include Rawdat al-qudat wa-tariq al-najat on the duties of judges, and al-Urwa al-wuthqa on contracts and conditions. The book gives his death as 499 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
  es: "Ali ibn Muhammad ibn Ahmad, Abu al-Qasim, al-Halabi al-Hanafi al-Simnani, recibió su nombre de Saman, una ciudad en Qumis, entre Damghan y Khuwar al-Rayy. Jurista e historiador hanafí, estudió derecho con el juez principal Abu Abd Allah Muhammad ibn Ali al-Damghani y teología y teoría jurídica con Abu Ali Muhammad ibn Ahmad ibn al-Walid. Entre sus obras destacan Rawdat al-qudat wa-tariq al-najat, sobre los deberes de los jueces, y al-Urwa al-wuthqa, sobre contratos y condiciones. El libro indica que falleció en el año 499 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
  fr: "Ali ibn Muhammad ibn Ahmad, dit Abu al-Qasim, al-Halabi al-Hanafi al-Simnani, tire son nom de Saman, ville de la province de Qumis située entre Damghan et Khuwar al-Rayy. Juriste et historien hanafite, il étudia le droit auprès du grand juge Abu Abd Allah Muhammad ibn Ali al-Damghani et la théologie et la théorie juridique auprès d'Abu Ali Muhammad ibn Ahmad ibn al-Walid. Parmi ses œuvres figurent Rawdat al-qudat wa-tariq al-najat, traité des devoirs des juges, et al-Urwa al-wuthqa, sur les contrats et les conditions. L'ouvrage indique son décès en 499 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6804}"
  ur: "علی بن محمد بن احمد، ابو القاسم، الحلبی الحنفی السمنانی، دمغان اور خوار الرّی کے درمیان قمیس کے ایک قصبے کا نام سمان کے نام پر رکھا گیا ہے۔ ایک حنفی فقیہ اور مورخ، اس نے چیف جج ابو عبد اللہ محمد بن علی الدمغنی کے ساتھ قانون کا مطالعہ کیا اور ابو علی محمد بن احمد بن الولید کے ساتھ دینیات اور قانونی نظریہ کا مطالعہ کیا۔ ان کی تصانیف میں ججوں کے فرائض سے متعلق رودۃ القدات و طارق النجات اور معاہدوں اور شرائط پر العروۃ الوثقاء شامل ہیں۔ کتاب میں ان کی وفات 499ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6804}"
  tr: "Ali ibn Muhammed ibn Ahmad, Abu al-Qasim, Al-Halabi al-Hanefi al-Samnani, Damghan ile Khwar al-Rayy arasındaki Qumis topraklarından Samman'ın adını taşır. Fıkıh eğitimini Baş Yargıç Abu Abdullah Muhammad ibn Ali al-Damghani'nin yanında inceleyen, Abu Ali Muhammad ibn Ahmed ibn al-Walid'den ise teoloji ve ilkeler çalışmış bir hukukçu ve tarihçidir. Eserleri arasında 'Rawdat al-Qudat wa Tariq al-Najat', 'Siraj al-Musalli wa namaz koşulları', 'İçkilerde Nizamiye Meselesi', 'Kanz al-Ulama wa al-Mu'allimin fi 'Ilm al-Shurut', 'Al-Hadi ila Nazar fi al-Masa'il wa Talab al-Dala'il', 'Al-Murshid al-Nizami' ve 'Al-Urwah al-Wuthqa fi al-Sharut' gibi eserleri içerir. Kitap, onun 499 Hicri yılında ölümünden bahseder. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 6804}"
  id: "Ali ibn Muhammad ibn Ahmad, Abu al-Qasim, Al-Halabi al-Hanafi al-Samnani, dinamai menurut Samman dari tanah Qumis antara Damghan dan Khwar al-Rayy. Seorang ahli hukum dan sejarawan yang mempelajari fiksi di bawah Hakim Ketua Abu Abdullah Muhammad ibn Ali al-Damghani, serta mempelajari teologi dan prinsip di bawah bimbingan Abu Ali Muhammad ibn Ahmad ibn al-Walid. Di antara karyanya adalah 'Rawdat al-Qudat wa Tariq al-Najat', 'Siraj al-Musalli wa Conditions of Conditions' doa', 'Isu Nizamiyyah dalam Minuman', 'Kanz al-Ulama wa al-Mu'allimin fi 'Ilm al-Shurut', 'Al-Hadi ila Nazar fi al-Masa'il wa Talab al-Dala'il', 'Al-Murshid al-Nizami', dan 'Al-Urwah al-Wuthqa fi al-Sharut'. Buku ini menyebutkan kematiannya pada tahun 499 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.] 6804}"
