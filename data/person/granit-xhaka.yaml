summary:
  ar: "لاعب كرة قدم سويسري من أصل ألباني كوسوفي، وُلد في بازل سنة 1992؛ لاعب وسط دفاعي بدأ مع بازل، ثم لعب لبوروسيا مونشنغلادباخ، ثم لأرسنال سبع سنوات خاض فيها نحو 300 مباراة وفاز بكأس الاتحاد الإنجليزي مرتين، ثم قاد باير ليفركوزن إلى أول ألقاب تاريخه في الدوري الألماني (2024)، وانتقل إلى سندرلاند سنة 2025. قائد منتخب سويسرا وصاحب الرقم القياسي في عدد مبارياته الدولية."
  en: "Swiss professional footballer of Kosovar Albanian descent, born in Basel in 1992. A defensive midfielder who began at Basel, moved to Borussia Mönchengladbach, then spent seven years at Arsenal, making nearly 300 appearances and winning two FA Cups, before helping Bayer Leverkusen to their first-ever Bundesliga title in 2024 and joining Sunderland in 2025. He captains Switzerland and is the country's record appearance holder."
  ur: "کوسوو کے البانوی نژاد سوئس پیشہ ور فٹبالر، 1992 میں بازل میں پیدا ہوئے؛ دفاعی مڈفیلڈر جنہوں نے بازل سے آغاز کیا، پھر بوروسیا مونشنگلاڈباخ اور سات سال آرسنل میں کھیلے، جہاں تقریباً 300 میچ کھیل کر دو ایف اے کپ جیتے، پھر بائر لیورکوزن کو 2024 میں اس کا پہلا بنڈس لیگا خطاب دلانے میں مدد کی اور 2025 میں سنڈرلینڈ میں شامل ہوئے۔ سوئٹزرلینڈ کے کپتان اور ملک کے سب سے زیادہ بین الاقوامی میچ کھیلنے والے کھلاڑی ہیں۔"
