id: person/muizz-al-dawla
class: person
label: { ar: "أحمد بن بويه معز الدولة" , ur: "معز الدولہ", en: "Mu'izz al-Dawla", es: "Mu'izz al-Dawla", fr: "Mu'izz al-Dawla"}
summary:
  ar: "أحمد بن بويه الديلمي، دخل بغداد فخلع عليه المستكفي ولقبه معز الدولة ولقب أخويه علياً عماد الدولة والحسن ركن الدولة وضربت ألقابهم على السكة، وهو أول من ملك العراق من الديلم، حجر على الخليفة وقرر له خمسة آلاف درهم كل يوم، وأظهر السعاة وأغوى المصارعين والسباحين حتى صار السباح يسبح وعلى يده كانون فوقه قدرة فيسبح حتى ينضج اللحم، ثم خلع المستكفي وسمله وأحضر المطيع فبايعوه {cite:tarikh-khulafa-minhaj-1434 p. 613-614}، ووقع بينه وبين ناصر الدولة بن حمدان فخرج لقتاله ومعه المطيع ثم رجع والمطيع معه كالأسير، وجدد الأيمان بينه وبين المطيع سنة خمس وثلاثين وأزال عنه التوكيل وأعاده إلى دار الخلافة، وماتت أخته سنة أربع وخمسين فنزل المطيع في طيارة يعزيه فقبل الأرض مرات ولم يكلفه الصعود، ومات سنة ست وخمسين فأقيم ابنه بختيار مكانه {cite:tarikh-khulafa-minhaj-1434 p. 615,620}. وعند المسعودي لجأ إليه الفضل بن المقتدر المطيع متنكراً هرباً من طلب المستكفي فأحسن إليه ولم يظهره {cite:muruj-al-dhahab p. 710}، وعند ابن الأثير دخل بغداد حادي عشر جمادى الأولى سنة 334هـ فنزل بباب الشماسية ودخل من الغد إلى الخليفة المستكفى وبايعه وحلف له، وخلع الخليفة على معز الدولة ولقبه ذلك اليوم ولقب أخاه علياً عماد الدولة ولقب أخاه الحسن ركن الدولة وأمر أن تُضرب القدائم ويكتب عليها على الدنانير والدراهم، ونزل معز الدولة بدار مؤنس ونزل الجند في دور الناس فلحقهم من ذلك شدة عظيمة وصار رسمًا عليهم بعد ذلك وهو أول من فعله ببغداد، وأقيم للمستكفى كل يوم خمسة آلاف درهم لنفقته {cite:kamil-ibn-al-athir p. 336-337}، وعند ابن الأثير توفي بعلة الذرب ببغداد حادي عشر ربيع الآخر سنة 356هـ وقد أوصى لابنه بختيار وأظهر التوبة وتصدق بأكثر ماله وأعتق مماليكه ودفن بباب التبن في مقابر قريش بعد إمارة إحدى وعشرين سنة، وهو الذي أحدث أمر السُعاة ساعي السنة وساعي الشيعة يسيران في اليوم أربعين فرسخاً وراهن الناس عليهما {cite:kamil-ibn-al-athir p. 424-425}، وعند ابن الجوزي واحتاج إلى السعاة ليصلوا بينه وبين أخيه ركن الدولة إلى الري فيقطعون تلك المسافة البعيدة في المدة القريبة وكانت إمارته ست عشرة سنة وكان الخليفة يخاطبه بأمير الأمراء وتوفي بشيراز سنة 356هـ وعمره سبع وخمسون سنة {cite:muntazam-ibn-al-jawzi p. 657}، وعند ابن الجوزي وفي ذي الحجة سنة 343هـ عرض له مرض وهو الاستيقاظ الدائم فأرجف به فاضطربت بغداد اضطراباً شديداً واضطر إلى الركوب مع علته حتى رآه الناس فسكنوا {cite:muntazam-ibn-al-jawzi p. 668} وعند ابن الجوزي استعمل الحلم يوم هزيمة ناصر الدولة سنة خمس وثلاثين ومنع الديلم من قتل العوام الذين هربوا إلى طريق عكبرا، وفي ذي الحجة سنة ثلاث وأربعين عرض له مرض — وهو اليقظان الدائم — فأُرجف به فاضطربت بغداد اضطرابًا شديدًا حتى ركب مع علته فرآه الناس فسكنوا {cite:muntazam-ibn-al-jawzi p. 646, 666}."
  en: "The Daylamite Ahmad ibn Buya; he entered Baghdad, was invested as Mu'izz al-Dawla — Imad and Rukn al-Dawla his brothers, all three titles on the coinage — the first Daylamite to hold Iraq. He sequestered the caliph at five thousand dirhams a day, patronised wrestlers and swimmers till men swam cooking meat in pots on their arms, then dragged al-Mustakfi from his throne, blinded him and set up al-Muti' {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
  ur: "بویہی امیر جس نے بغداد میں اقتدار قائم کیا؛ اس کے عہد میں عباسی خلافت کے ساتھ تعلقات، لشکری اقطاع اور شہری مذہبی مراسم میں تبدیلیاں آئیں۔ {cite:shadharat-dhahab}"
  es: "El daylamita Ahmad ibn Buya entró en Bagdad, fue investido como Mu'izz al-Dawla —Imad y Rukn al-Dawla, sus hermanos, los tres títulos en la moneda—, el primer daylamita en gobernar Irak. Confiscó al califa a cambio de cinco mil dirhams al día, patrocinó a luchadores y nadadores hasta que los hombres nadaban cocinando carne en ollas sobre sus brazos, luego derrocó a al-Mustakfi de su trono, lo cegó y estableció al-Muti' {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
  fr: "Ahmad ibn Buya, un Daylamite, entra à Bagdad et fut investi du titre de Mu'izz al-Dawla (Imad et Rukn al-Dawla étant ses frères, les trois titres figurant sur les pièces de monnaie). Il fut le premier Daylamite à régner sur l'Irak. Il imposa au calife une pension de cinq mille dirhams par jour, soutint les lutteurs et les nageurs au point que certains hommes nageaient en faisant cuire de la viande dans des marmites sur leurs bras, puis destitua al-Mustakfi, le fit aveugler et installa al-Muti' (voir: Tarikh-Khulafa-Minhaj-1434, p. 613-614)."
  tr: "Ahmed bin Büy el-Daylami Bağdat'a girdi, burada el-Mustakfi onu tahttan indirdi, ona Mu'izz al-Dawla unvanını ve kardeşleri 'İmad al-Dawla ile el-Hasan Rukn el-Devla'nın unvanlarını verdi. Unvanları raylara damgalanmıştı. Irak'ı Daylam'dan yöneten ilk kişi oydu. Halifeye yasak getirdi ve ona günde beş bin dirhem verdi. Halifeyi gösterdi, güreşçileri ve yüzücüleri ayarttı, yüzücü ise üstünde top tutarak et pişene kadar yüzmeye başladı. Sonra el-Mustakfi onu çıkardı, bağladı, itaatkârları getirdi ve ona bağlılık yemini etti {alıntı: Tarikh-Khulafa-minhaj-1434, s. 613-614} ve Nasir al-Dawla ibn Hamdan arasında bir çatışma çıktı; Nasir al-Dawla ibn Hamdan el-Muti'i ile birlikte savaşmaya çıktı, ardından al-Muti' ile birlikte esir olarak geri döndü. 35 yılında kendisi ile al-Muti' arasındaki yeminleri yeniledi, vekaletnamesini kaldırdı ve onu halifeliğe geri gönderdi. Kız kardeşi 1954'te öldü, bu yüzden al-Muti' başsağlığı dilemek için uçağa bindi, birkaç kez yere öptü ve binmeye zahmet etmedi. 56 yılında öldü ve yerine oğlu Bakhtiar atandı {atıf:Tarikh-Khulafa-minhaj-1434, s. 615,620}. El-Mesudi el-Fadl bin el-Muktadir el-Muti', el-Mustakfi'nin isteğinden kaçmak için kılık değiştirerek ona sığındı, ancak Mustakfi ondan memnun kaldı fakat ona göstermedi {alıntı:Muruj-al-Dhahab, s. 710}. İbn al-Athir ile birlikte, 334 H. yılının 11'inde Cumedül-Avvel'de Bağdat'a girdi, Bab al-Şamasiyah'da kaldı ve ertesi gün Halife el-Mustakfi'ye girdi, ona bağlılık yemini etti, ona bağlılık yemini etti, halife Ali al-Dawla'yı tahttan indirdi ve o gün ona 'İmad al-Dawla' unvanını verdi; kardeşi Ali 'İmam al-Dawla', kardeşi el-Hasan ise Rukn al-Dawla olarak anıldı. Qudaim'in vurulmasını ve dinar ile dirhemlerin üzerine yazılmasını emretti. Mu'izz al-Dawla sonra atlarından indi. Mu'nas'ın evinde askerler halkın arasına iner ve büyük zorluklar onları sarsardı. Bunu Bağdat'ta ilk yapan oydu. Her gün, kendi kendine yeten kişiye masrafları için beş bin dirhem ayrılırdı {atıf:kamil-ibn-al-athir s. 336-337}. İbn al-Athir'e göre, 356 H. yılında, Rabi'al-Thir'in on birinci gününde Bağdat'ta al-Dhurb hastalığından öldü. Oğlu Bahtiyar'a vasiyet etti, tövbe etti, servetinin çoğunu verdi, memlüklerini özgürleştirdi ve yirmi bir yıllık yönetimin ardından Bab al-Tabhan'da Kureyş'in türbelerinde defnedildi. Elçilerin işlerini başlatan oydu Sünni ve Şii elçiler günde kırk farsakh seyahat eder ve insanlar onlara bahis yapardı {atıf:kamil-ibn-al-athir s. 424-425}. İbn al-Jawzi, kardeşi Rukn al-Dawla ile birlikte Rayy'e namaz kılacak elçilere ihtiyaç duyuyordu ki kısa sürede bu mesafeyi kat edebilsinler. Emirliği on altı yaşındaydı ve halife ona Prenslerin Komutanı diye hitap etti. 356 Hicri'de Şiraz'da elli yedi yaşında öldü {atıf: Muntazam-ibn-al-Jawzi s. 657} İbn al-Jawzi'ye göre, 343 Hicce Hicce'de sürekli uyanıklık adı verilen bir hastalığa yakalandı; bu hastalık onu titretti ve Bağdat'ı ciddi şekilde rahatsız etti, hastalığıyla birlikte binmek zorunda kaldı ve insanlar onu görüp yerleşene kadar {atıf:Muntazam-ibn-al-Jawzi s. 668} İbn al-Jawzi'ye göre, otuz beş yılda Nasir al-Dawla'nın yenilgiye uğradığı gün sabır gösterdi ve Daylam'ın Ekbara yoluna kaçan halkı öldürmesini engelledi. Kırk üçüncü yılda Dhu al-Hijjah'da, sürekli uyanıklık olan bir hastalığa yakalandı ve bu hastalık onu titretip Bağdat'ı sarstı Hastalığıyla birlikte binene kadar çok rahatsız oldu ve halk onu görüp yerleşti {atıf:muntazam-ibn-al-jawzi s. 646, 666}."
  id: "Ahmad ibn Buyh al-Daylami memasuki Baghdad, di mana al-Mustakfi menggulingkannya, memberinya gelar Mu'izz al-Dawla dan gelar saudara-saudaranya 'Imad al-Dawla dan al-Hasan Rukn al-Dawla. Gelar mereka dicap di rel. Ia adalah yang pertama memerintah Irak sejak Daylam. Ia memberlakukan larangan kepada khalifah dan memberinya lima ribu dirham setiap hari. Ia memamerkan utusan dan menggoda para pegulat serta perenang sampai perenang mulai berenang dengan meriam di atasnya untuk berenang sampai daging matang. Kemudian al-Mustakfi mengambil dan mengikatnya, membawa para patuh, dan bersumpah setia kepadanya {cite: Tarikh-Khulafa-minhaj-1434, hlm. 613-614}, dan terjadi konflik antara dia dan Nasir al-Dawla ibn Hamdan, yang pergi melawannya bersama al-Muti'i, lalu kembali bersama al-Muti' sebagai tawanan. Dia memperbarui sumpah antara dirinya dan al-Muti' pada tahun 35, mencabut kuasa hukumnya, dan mengembalikannya ke kekhalifahan. Saudarinya meninggal pada tahun 1954, sehingga al-Muti' turun dengan pesawat untuk menyampaikan belasungkawa, beberapa kali mencium tanah, dan tidak repot-repot naik ke pesawat. Dia meninggal pada tahun 56, dan putranya Bakhtiar diangkat menggantikannya {cite:Tarikh-Khulafa-minhaj-1434, hlm. 615,620}. Al-Masudi al-Fadl ibn al-Muqtadir al-Muti' mencari perlindungan kepadanya dengan menyamar untuk menghindari permintaan al-Mustakfi, tetapi ia senang dengannya namun tidak menunjukkan {cite:Muruj-al-Dhahab, hlm. 710}. Bersama Ibn al-Athir, ia memasuki Baghdad pada tanggal 11 Jumada al-Awwal tahun 334 H, tinggal di Bab al-Shamasiyah, dan keesokan harinya masuk kepada Khalifah al-Mustakfi, bersumpah setia kepadanya, menggulingkan khalifah Ali al-Dawla, dan memberinya gelar 'Imad al-Dawla' pada hari itu, sementara saudaranya Ali diberi gelar 'Imad al-Dawla,' dan saudaranya al-Hasan disebut Rukn al-Dawla. Ia memerintahkan agar qudaim dipukul dan diukir pada dinar dan dirham. Mu'izz al-Dawla kemudian turun dari kuda. Di rumah Mu'nas, para prajurit turun ke antara rakyat, dan mereka mengalami kesulitan besar. Ia adalah yang pertama melakukan ini di Baghdad. Setiap hari, lima ribu dirham dialokasikan kepada orang yang mandiri untuk biaya yang ia miliki {cite:kamil-ibn-al-athir hlm. 336-337}. Menurut Ibn al-Athir, ia meninggal karena penyakit al-Dhurb di Baghdad pada tanggal sebelas Rabi' al-Thir tahun 356 H. Ia mewariskan kepada putranya Bakhtiyar, menunjukkan penyesalan, memberikan sebagian besar hartanya, membebaskan mamluknya, dan dimakamkan di Bab al-Tabhan di makam Quraysh setelah dua puluh satu tahun pemerintahan. Dialah yang memulai urusan para utusan Utusan Sunni dan Syiah melakukan perjalanan empat puluh farsakh sehari, dan orang-orang bertaruh pada mereka {cite:kamil-ibn-al-athir hlm. 424-425}. Ibn al-Jawzi membutuhkan utusan untuk berdoa antara dirinya dan saudaranya Rukn al-Dawla ke Rayy, agar mereka dapat menempuh jarak jauh itu dalam waktu singkat. Emiratnya berusia enam belas tahun, dan khalifah memanggilnya sebagai Komandan Para Pangeran. Ia meninggal di Shiraz pada tahun 356 H pada usia lima puluh tujuh tahun {cite: Muntazam-ibn-al-jawzi hlm. 657} Menurut Ibn al-Jawzi, dalam Dhu al-Hijjah 343 H, ia menderita penyakit yang disebut terjaga terus-menerus, yang membuatnya gemetar dan sangat mengganggu Baghdad, memaksanya menahan penyakitnya sampai orang-orang melihatnya dan tenang {cite:Muntazam-ibn-al-jawzi hlm. 668} Menurut Ibn al-Jawzi, ia menahan diri pada hari kekalahan Nasir al-Dawla pada tahun tiga puluh lima dan mencegah Daylam membunuh rakyat biasa yang melarikan diri ke jalan Akbara. Dalam Dhu al-Hijjah tahun empat puluh tiga, ia menderita penyakit — yaitu kewaspadaan konstan — yang membuatnya gemetar dan mengguncang Baghdad Ia menjadi sangat terganggu hingga ia meninggal karena sakitnya, dan orang-orang melihatnya serta menetes {cite:muntazam-ibn-al-jawzi hlm. 646, 666}."
