id: person/muizz-al-dawla
class: person
label: { ar: "أحمد بن بويه معز الدولة" }
summary:
  ar: "أحمد بن بويه الديلمي، دخل بغداد فخلع عليه المستكفي ولقبه معز الدولة ولقب أخويه علياً عماد الدولة والحسن ركن الدولة وضربت ألقابهم على السكة، وهو أول من ملك العراق من الديلم، حجر على الخليفة وقرر له خمسة آلاف درهم كل يوم، وأظهر السعاة وأغوى المصارعين والسباحين حتى صار السباح يسبح وعلى يده كانون فوقه قدرة فيسبح حتى ينضج اللحم، ثم خلع المستكفي وسمله وأحضر المطيع فبايعوه {cite:tarikh-khulafa-minhaj-1434 p. 613-614}، ووقع بينه وبين ناصر الدولة بن حمدان فخرج لقتاله ومعه المطيع ثم رجع والمطيع معه كالأسير، وجدد الأيمان بينه وبين المطيع سنة خمس وثلاثين وأزال عنه التوكيل وأعاده إلى دار الخلافة، وماتت أخته سنة أربع وخمسين فنزل المطيع في طيارة يعزيه فقبل الأرض مرات ولم يكلفه الصعود، ومات سنة ست وخمسين فأقيم ابنه بختيار مكانه {cite:tarikh-khulafa-minhaj-1434 p. 615,620}. وعند المسعودي لجأ إليه الفضل بن المقتدر المطيع متنكراً هرباً من طلب المستكفي فأحسن إليه ولم يظهره {cite:muruj-al-dhahab p. 710}، وعند ابن الأثير دخل بغداد حادي عشر جمادى الأولى سنة 334هـ فنزل بباب الشماسية ودخل من الغد إلى الخليفة المستكفى وبايعه وحلف له، وخلع الخليفة على معز الدولة ولقبه ذلك اليوم ولقب أخاه علياً عماد الدولة ولقب أخاه الحسن ركن الدولة وأمر أن تُضرب القدائم ويكتب عليها على الدنانير والدراهم، ونزل معز الدولة بدار مؤنس ونزل الجند في دور الناس فلحقهم من ذلك شدة عظيمة وصار رسمًا عليهم بعد ذلك وهو أول من فعله ببغداد، وأقيم للمستكفى كل يوم خمسة آلاف درهم لنفقته {cite:kamil-ibn-al-athir p. 336-337}، وعند ابن الأثير توفي بعلة الذرب ببغداد حادي عشر ربيع الآخر سنة 356هـ وقد أوصى لابنه بختيار وأظهر التوبة وتصدق بأكثر ماله وأعتق مماليكه ودفن بباب التبن في مقابر قريش بعد إمارة إحدى وعشرين سنة، وهو الذي أحدث أمر السُعاة ساعي السنة وساعي الشيعة يسيران في اليوم أربعين فرسخاً وراهن الناس عليهما {cite:kamil-ibn-al-athir p. 424-425}، وعند ابن الجوزي واحتاج إلى السعاة ليصلوا بينه وبين أخيه ركن الدولة إلى الري فيقطعون تلك المسافة البعيدة في المدة القريبة وكانت إمارته ست عشرة سنة وكان الخليفة يخاطبه بأمير الأمراء وتوفي بشيراز سنة 356هـ وعمره سبع وخمسون سنة {cite:muntazam-ibn-al-jawzi p. 657}، وعند ابن الجوزي وفي ذي الحجة سنة 343هـ عرض له مرض وهو الاستيقاظ الدائم فأرجف به فاضطربت بغداد اضطراباً شديداً واضطر إلى الركوب مع علته حتى رآه الناس فسكنوا {cite:muntazam-ibn-al-jawzi p. 668}"
  en: "The Daylamite Ahmad ibn Buya; he entered Baghdad, was invested as Mu'izz al-Dawla — Imad and Rukn al-Dawla his brothers, all three titles on the coinage — the first Daylamite to hold Iraq. He sequestered the caliph at five thousand dirhams a day, patronised wrestlers and swimmers till men swam cooking meat in pots on their arms, then dragged al-Mustakfi from his throne, blinded him and set up al-Muti' {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
