summary:
  ar: "عبد العزيز الدوري ⁦(1919–2010)⁩ مؤرخ عراقي وأستاذ جامعي، رئيس الجامعة العراقية سابقاً، من أبرز مؤرخي الاقتصاد والاجتماع في الإسلام المبكر. من كتبه «النشأة التاريخية للكتابة عند العرب» و«التاريخ الاقتصادي للعراق» ودراسات في بدايات الدولة الأموية والعباسية."
  en: "Abd al-Aziz al-Duri (1919–2010) was an Iraqi historian and academic, former president of Baghdad University, among the foremost historians of early Islamic social and economic history. His books include The Rise of Historical Writing Among the Arabs and The Economic History of Iraq, plus studies of the Umayyad and early Abbasid state."
  fr: "Abd al-Aziz al-Duri (1919–2010) était un historien et universitaire irakien, ancien président de l'université de Bagdad, parmi les principaux historiens de l'histoire sociale et économique des premiers temps de l'islam. Ses livres comprennent La Naissance de l'écriture historique chez les Arabes et L'Histoire économique de l'Irak, ainsi que des études sur l'État omeyyade et le premier État abbasside."
  ur: "عبدالعزیز دوری ⁦(1919–2010)⁩ عراقی مؤرخ اور جامعہ مدرس تھے، بغداد یونیورسٹی کے سابق صدر، ابتدائی اسلامی سماجی و معاشی تاریخ کے نمایاں ترین مؤرخین میں۔ کتب میں عربوں میں تاریخ نگاری کا آغاز اور عراق کی معاشی تاریخ اور اموی و ابتدائی عباسی ریاست پر مطالعات شامل ہیں۔"
  es: "Abd al-Aziz al-Duri (1919-2010) fue un historiador y académico iraquí, ex rector de la Universidad de Bagdad, y uno de los historiadores más destacados de la historia social y económica del Islam primitivo. Entre sus libros se encuentran El auge de la escritura histórica entre los árabes y La historia económica de Irak, además de estudios sobre el Estado omeya y el primer Estado abasí."
  tr: "Abdul Aziz al-Douri (1919–2010), Iraklı bir tarihçi ve üniversite profesörü, Irak Üniversitesi'nin eski rektörü ve erken İslam döneminde ekonomi ve toplum tarihi alanında en önde gelen tarihçilerden biriydi. Kitapları arasında \"Araplar Arasında Yazının Tarihsel Kökenleri\", \"Irak'ın Ekonomik Tarihi\" ve Emevi ve Abbasi devletlerinin başlangıcına dair çalışmalar yer almaktadır."
  id: "Abdul Aziz al-Douri (1919–2010) adalah seorang sejarawan dan profesor universitas Irak, mantan rektor Universitas Irak, dan salah satu sejarawan ekonomi dan masyarakat terkemuka di awal Islam. Buku-bukunya antara lain \"Asal Usul Sejarah Tulisan di Kalangan Bangsa Arab,\" \"Sejarah Ekonomi Irak,\" dan studi tentang awal berdirinya negara Umayyah dan Abbasiyah."
