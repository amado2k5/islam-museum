summary:
  ar: "روائي وكاتب باللغة الأردية (1830-1912) من بجنور، يُعدّ أول روائي في الأدب الأردي بروايته «مرآة العروس» (1869) التي كتبها لتعليم بناته. عمل في التعليم ثم في إدارة الإيرادات حتى صار نائب المجمّع (Deputy Collector) — ومنه لقبه «ديبتي» — وترجم القرآن إلى أردية سلسة، وعُرف خطيبًا في مؤتمرات التعليم المحمدية."
  en: "Urdu novelist and writer (1830–1912) of Bijnor, regarded as the first novelist of Urdu literature for Mirat-ul-Uroos (1869), written for his daughters' education. He served in education and then the revenue administration, rising to deputy collector — the office behind his byname 'Deputy' — translated the Qur'an into idiomatic Urdu, and became a celebrated orator at the Muhammadan Educational Conferences."
  ur: "اردو کے ناول نگار اور مصنف (1830ء–1912ء) جن کا تعلق بجنور سے تھا اور جو «مرآۃ العروس» (1869ء) کی بدولت اردو کے پہلے ناول نگار مانے جاتے ہیں؛ یہ ناول انھوں نے اپنی بیٹیوں کی تعلیم کے لیے لکھا تھا۔ وہ تعلیم اور پھر محکمۂ مال میں رہے، ڈپٹی کلکٹر بنے — یہی عہدہ ان کے لقب «ڈپٹی» کی وجہ ہے — قرآن کا اردو ترجمہ کیا اور محمڈن ایجوکیشنل کانفرنس کے مشہور خطیب رہے۔"
