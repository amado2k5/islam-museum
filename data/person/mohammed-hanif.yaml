summary:
  ar: "محمد حنيف (وُلد سنة 1964) كاتب وصحفي باكستاني بريطاني، وُلد في أوكارا بالبنجاب. تدرّب ضابط طيار في أكاديمية القوات الجوية الباكستانية ثم اتجه إلى الصحافة، فعمل في «نيوزلاين» وترأّس خدمة الأردية في هيئة الإذاعة البريطانية في لندن قبل أن يعود إلى باكستان سنة 2008. روايته الأولى «قضية المانجو المتفجر» (2008)، وهي هجائية لعهد ضياء الحق، نالت جائزة كتّاب الكومنولث لأفضل كتاب أول، وتبعتها «سيدتنا آليس بهاتي» (2011) و«طيور حمراء» (2018)، ويكتب مقال رأي شهري في «نيويورك تايمز»."
  en: "Mohammed Hanif (born 1964) is a British-Pakistani writer and journalist, born in Okara, Punjab. He trained as a Pakistan Air Force pilot officer before turning to journalism, worked for Newsline and headed the BBC's Urdu service in London, then returned to Pakistan in 2008. His first novel, A Case of Exploding Mangoes (2008), a satire of the Zia-ul-Haq era, won the Commonwealth Writers' Prize for best first book; Our Lady of Alice Bhatti (2011) and Red Birds (2018) followed, and he writes a monthly opinion column for The New York Times."
  ur: "محمد حنیف (پیدائش 1964) برطانوی پاکستانی مصنف اور صحافی ہیں، جو پنجاب کے شہر اوکاڑہ میں پیدا ہوئے۔ پاک فضائیہ اکیڈمی سے پائلٹ آفیسر کی تربیت کے بعد صحافت اختیار کی، «نیوز لائن» میں کام کیا اور لندن میں بی بی سی کی اردو سروس کے سربراہ رہے، پھر 2008 میں پاکستان لوٹ آئے۔ ان کا پہلا ناول «A Case of Exploding Mangoes» (2008)، جو ضیاء الحق کے دور پر طنز ہے، دولت مشترکہ مصنفین کا بہترین پہلی کتاب کا انعام جیتا؛ پھر «Our Lady of Alice Bhatti» (2011) اور «Red Birds» (2018) آئے، اور وہ «نیو یارک ٹائمز» میں ماہانہ ادارتی مضمون لکھتے ہیں۔"

