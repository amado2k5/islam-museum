summary:
  ar: "الشاه السابع والأخير من الأسرة القاجارية في إيران (حكم من 16 يوليو 1909 إلى 31 أكتوبر 1925)، نُصّب على العرش في الحادية عشرة من عمره بعد خلع أبيه محمد علي شاه. جرى عهده تحت وصاية ثم في ظل انقلاب 1921 وصعود رضا خان، وانتهى بتصويت المجلس على خلع الأسرة القاجارية سنة 1925؛ ومات في فرنسا سنة 1930."
  en: "Seventh and last shah of Qajar Iran (reigned 16 July 1909 – 31 October 1925), placed on the throne at the age of eleven after his father Mohammad Ali Shah's deposition. His reign ran under regents and then through the 1921 coup and Reza Khan's rise, and ended when the Majlis deposed the Qajar dynasty in 1925; he died in France in 1930."
  ur: "قاجاری ایران کے ساتویں اور آخری شاہ (دورِ حکومت 16 جولائی 1909 تا 31 اکتوبر 1925)؛ اپنے والد محمد علی شاہ کی معزولی کے بعد گیارہ برس کی عمر میں تخت پر بٹھائے گئے۔ ان کا عہد نائبین کی سرپرستی میں اور پھر 1921 کی بغاوت اور رضا خان کے عروج کے سائے میں گزرا، اور 1925 میں مجلس کے قاجاری خاندان کو معزول کرنے پر ختم ہوا؛ 1930 میں فرانس میں وفات پائی۔"
