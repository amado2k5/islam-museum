summary:
  ar: "العدو الذي وسوس لآدم وحواء في الجنة. يروي الثعلبي أنه امتنع عن السجود لآدم، ودخل الجنة في فم حية، وأنه عوقب بعشر عقوبات عدّدها الكتاب."
  en: "The adversary who whispered to Adam and Hawwa in the Garden. Al-Tha'labi reports that he refused to prostrate to Adam, entered the Garden inside a serpent, and was punished with ten penalties the book lists."
  es: "El adversario que susurró a Adán y Eva en el Jardín. Al-Tha'labi relata que se negó a postrarse ante Adán, entró al Jardín dentro de una serpiente y fue castigado con diez penas, según enumera el libro."
  fr: "L'adversaire qui murmura à l'oreille d'Adam et d'Hawwa dans le Jardin d'Éden. Al-Tha'labi rapporte qu'il refusa de se prosterner devant Adam, entra dans le Jardin à l'intérieur d'un serpent et fut puni des dix châtiments énumérés dans le livre."
  ur: "وہ مخالف جس نے جنت میں آدم اور حوا سے سرگوشی کی۔ الثعلبی نے بیان کیا ہے کہ اس نے آدم کو سجدہ کرنے سے انکار کیا، ایک سانپ کے اندر باغ میں داخل ہوا، اور اسے کتاب کی فہرست میں دس جرمانے کی سزا دی گئی۔"
  tr: "Cennette Adem ve Havva'ya fısıldayan düşman. Al-Tha'labi, Adem'e secde etmeyi reddettiğini, bir yılanın ağzından Cennete girdiğini ve kitapta listelenen on cezayla cezalandırıldığını anlatır."
  id: "Musuh yang berbisik kepada Adam dan Hawa di Surga. Al-Tha'labi menceritakan bahwa ia menolak untuk sujud kepada Adam, masuk ke Surga melalui mulut ular, dan dihukum dengan sepuluh hukuman yang tercantum dalam kitab itu."
