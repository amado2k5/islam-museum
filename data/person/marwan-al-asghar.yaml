summary:
  ar: "أبو السمط مروان بن أبي الجنوب بن مروان الأكبر بن أبي حفصة؛ كان من شعراء عصره المشاهير المقدمين، وذكر المبرد في كتاب الكامل طرفاً من أخبار قومه ثم قال: وأعرق قوم كانوا في الشعر آل حسان فإنهم كانوا يعدون ستة في نسق كلهم شاعر، وأما في الوقت الحاضر فآل أبي حفصة فإنهم أهل بيت كل واحد منهم شاعر يتوارثونه كابراً عن كابر؛ ويحيى بن أبي حفصة كنيته أبو جميل وأمه تحيا بنت ميمون يقال إنها من ولد النابغة الجعدي وإن الشعر أتى إلى أبي حفصة بذلك السبب {cite:wafayat-ayan}."
  en: "Marwan al-Asghar Abu al-Samt — last of the Banu Abi Hafsa line of poets; al-Mubarrad ranked them with Hassan's house as families where verse was inherited grandfather to grandson {cite:wafayat-ayan}."
