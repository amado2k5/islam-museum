summary:
  ar: "شاعر وكاتب باللغة الأردية (1837-1914) من بانيبات، اقترن اسمه بحركة عليكرة وسر سيد أحمد خان. ألّف «مسدس حالي» (1879)، قصيدة مدّ الإسلام وجزره، وكتب أول نقد أدبي في الأردية «مقدمة شعر وشاعري»، وسِيَر غالب وسعدي وسيد أحمد خان؛ وصفته آن ماري شيمل بأنه مؤسس التقليد الأدبي في الأردية."
  en: "Urdu poet and writer (1837–1914) of Panipat, associated with Sir Syed Ahmad Khan's Aligarh circle. He composed the Musaddas-e-Hali (1879), the elegiac poem on the ebb and tide of Islam, wrote Urdu's first work of literary criticism, the Muqaddama-e-Shair-o-Shairi, and biographies of Ghalib, Saadi and Sir Syed; Annemarie Schimmel called him the founder of the literary tradition in Urdu."
  ur: "اردو کے شاعر اور مصنف (1837ء–1914ء) جن کا تعلق پانی پت سے تھا اور جو سر سید احمد خان کے علی گڑھ حلقے سے وابستہ رہے۔ انھوں نے «مسدس حالی» (1879ء) لکھی، جو اسلام کے مد و جزر پر رثائی نظم ہے، اردو کی پہلی ادبی تنقید «مقدمہ شعر و شاعری» لکھی، اور غالب، سعدی اور سر سید کی سوانح لکھیں۔"
