summary:
  ar: "عالم وكاتب وسياسي هندي (1888–1958)، وُلد في مكة ونشأ فيها وفي المدينة، وأتقن العربية والأردية والفارسية والإنجليزية. أسس مجلة «الهلال» (1912) فصارت منبرًا إصلاحيًا وسياسيًا، واعتُقل في رانشي ثلاث سنوات ونصفًا. تولى رئاسة المؤتمر الوطني الهندي سنة 1923 — وهو أصغر من تولاها — ثم 1940–1946، وعارض تقسيم الهند، وصار بعد الاستقلال أول وزير للتعليم في الهند (1947–1958) فأسس أول معهد هندي للتكنولوجيا ولجنة المنح الجامعية. من كتبه «ترجمان القرآن» و«غبار خاطر» و«الهند تفوز بالاستقلال»."
  en: "Indian scholar, writer and statesman (1888–1958), born in Mecca and raised between Mecca and Medina, master of Arabic, Urdu, Persian and English. He founded the journal Al-Hilal (1912), which became a leading reformist and political voice, and was interned at Ranchi for three and a half years. He presided over the Indian National Congress in 1923 — its youngest president — and again from 1940 to 1946, opposed the partition of India, and after independence became India's first Minister of Education (1947–1958), founding the first Indian Institute of Technology and the University Grants Commission. His books include Tarjuman-ul-Quran, Ghubar-e-Khatir and India Wins Freedom."
  ur: "ہندوستانی عالم، مصنف اور سیاست دان (1888ء–1958ء)، مکہ میں پیدا ہوئے اور مکہ و مدینہ میں پرورش پائی، عربی، اردو، فارسی اور انگریزی پر عبور حاصل تھا۔ مجلہ «الہلال» (1912ء) جاری کیا جو اصلاحی اور سیاسی آواز کا بڑا منبر بنا، رانچی میں ساڑھے تین سال نظر بند رہے۔ 1923ء میں انڈین نیشنل کانگریس کے سب سے کم عمر صدر بنے اور پھر 1940ء–1946ء صدر رہے، تقسیم ہند کی مخالفت کی، اور آزادی کے بعد ہندوستان کے پہلے وزیر تعلیم (1947ء–1958ء) بنے اور پہلا انڈین انسٹی ٹیوٹ آف ٹیکنالوجی اور یونیورسٹی گرانٹس کمیشن قائم کیا۔ ان کی کتابوں میں «ترجمان القرآن»، «غبار خاطر» اور «انڈیا ونس فریڈم» شامل ہیں۔"
