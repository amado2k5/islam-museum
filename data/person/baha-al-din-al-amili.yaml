summary:
  ar: "بهاء الدين العاملي، محمد بن الحسين، المعروف بالبهائي ⁦(953–1030هـ/1547–1621م)⁩، من جبل عامل بسوريا، انتقل إلى فارس، ونال مكانة مرموقة عند الشاه عباس، واشتهر بكتاب «الكشكول»، وله شرح فارسي للفقه الشيعي بعنوان «الجامع العباسي»، ومثنويتان فارسيتان {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
  en: "Baha' al-Din al-'Amili, Muhammad b. Husayn, known as al-Bahai (953-1030 AH, 1547-1621 CE). From Jabal 'Amila in Syria, he moved to Persia and obtained an honoured place at the court of Shah 'Abbas. His best-known work is the anthology al-Kashkul, and he also wrote a Persian exposition of Shi'i fiqh, the Jami'-i 'Abbasi {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
  es: "Baha' al-Din al-'Amili, Muhammad b. Husayn, conocido como al-Bahai (953-1030 AH, 1547-1621 d. C.). Originario de Jabal 'Amila, en Siria, se trasladó a Persia y obtuvo un lugar de honor en la corte del Shah 'Abbas. Su obra más conocida es la antología al-Kashkul, y también escribió una exposición en persa del fiqh chií, el Jami'-i 'Abbasi {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
  fr: "Baha' al-Din al-'Amili, Muhammad b. Husayn, connu sous le nom d'al-Bahai (953-1030 AH, 1547-1621 ap. J.-C.). Originaire de Jabal 'Amila en Syrie, il s'installa en Perse et obtint une place de choix à la cour du Shah 'Abbas. Son œuvre la plus connue est l'anthologie al-Kashkul; il est également l'auteur d'un exposé persan du fiqh chiite, le Jami'-i 'Abbasi (voir: Encyclopaedia of Islam, vol. 1, p. 458)."
  ur: "بہاء الدین العامیلی، محمد بن۔ حسین، جسے الباحی کے نام سے جانا جاتا ہے ⁦(953-1030 ہجری، 1547-1621 عیسوی)⁩۔ شام میں جبل عاملہ سے وہ فارس چلا گیا اور شاہ عباس کے دربار میں باعزت مقام حاصل کیا۔ ان کی سب سے مشہور تصنیف انتھولوجی الکشکول ہے، اور اس نے شیعہ فقہ کی ایک فارسی تفسیر بھی لکھی، جامع عباسی {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 458}۔"
  tr: "Baha'ddin el-Amili, Muhammed bin el-Hüseyin, Bahai olarak bilinir (953–1030 Hicri / 1547–1621), Suriye'deki Cebel Amel'den, İran'a taşındı, Şah Abbas'ın yönetiminde prestijli bir makam kazandı ve 'El-Kaşkul' adlı kitabı ile ünlendi; bu kitapta Şii fıkı üzerine Farsça bir yorum olan 'El-Cami' el-Abbasi' ve iki Farsça masnaviyet {cite:encyclopaedia-of-Islam-2 cilt 1, s. 458} yer alır."
  id: "Baha' al-Din al-Amili, Muhammad ibn al-Husayn, yang dikenal sebagai Baha'i (953–1030 H / 1547–1621 M), dari Jabal Amel di Suriah, pindah ke Persia, meraih posisi bergengsi di bawah Shah Abbas, dan menjadi terkenal karena buku 'Al-Kashkul', yang memuat komentar Persia tentang fiqhlah syaiah berjudul 'Al-Jami' al-Abbasi', dan dua masnawiyyat Persia {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 458}."
