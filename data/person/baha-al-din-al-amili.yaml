summary:
  ar: "بهاء الدين العاملي، محمد بن الحسين، المعروف بالبهائي (953–1030هـ/1547–1621م)، من جبل عامل بسوريا، انتقل إلى فارس، ونال مكانة مرموقة عند الشاه عباس، واشتهر بكتاب «الكشكول»، وله شرح فارسي للفقه الشيعي بعنوان «الجامع العباسي»، ومثنويتان فارسيتان {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
  en: "Baha' al-Din al-'Amili, Muhammad b. Husayn, known as al-Bahai (953-1030 AH, 1547-1621 CE). From Jabal 'Amila in Syria, he moved to Persia and obtained an honoured place at the court of Shah 'Abbas. His best-known work is the anthology al-Kashkul, and he also wrote a Persian exposition of Shi'i fiqh, the Jami'-i 'Abbasi {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
