summary:
  ar: "تقي الدين البلاطنسي الشافعي الحافظ شيخ مشايخ الإسلام؛ ولد يوم الجمعة عاشر رجب سنة إحدى وخمسين وثمانمائة وأخذ عن والده والزين خطاب والبدر ابن قاضي شهبة وشيخي الإسلام النجمي والتقوى ابني قاضي عجلون وغيرهم، وكان — بوصف تلميذه — من بيت صلاح وعلم، دخل دمشق في طلب العلم فاستوطنها ولم يتناول من أوقافها شيئاً وأُرسل إليه بأموال ووظائف فلم يقبل، عالماً عاملاً ورعاً له مهابة في قلوب الفقهاء والحكام يُرجع إليه في المشكلات ولا يتردد إلى أحد لغناه، آمـراً بالمعروف ناهياً عن المنكر لا تأخذه في الله لومة لائم، وكان يختم القرآن في كل يوم جمعة ويختم في شهر رمضان كل ليلة ختمتين؛ له نونية مدح فيها السلطان سليمان وتعرّض فيها لما حصل في زمنه من الفتوحات كرودس وجالديران. توفي ليلة الاثنين ثاني المحرم ودُفن بباب الصغير جوار جدّه شيخ الإسلام شمس الدين البلاطنسي {cite:shadharat-dhahab p. 596-597}."
  en: "Shaykh mashayikh al-Islam of Damascus — b. Friday 10 Rajab 851, of 'a house of piety and learning' per his own pupil; settled in Damascus never taking a dirham of its waqfs, refusing money and posts, the recourse of jurists and governors in hard questions, a khatma every Friday and two each Ramadan night; his nuniyya praised Sulayman and chronicled Rhodes and Chaldiran; died Monday eve 2 Muharram, buried beside his grandfather at Bab al-Saghir {cite:shadharat-dhahab p. 596-597}."
