summary:
  ar: "تقي الدين البلاطنسي الشافعي الحافظ شيخ مشايخ الإسلام؛ ولد يوم الجمعة عاشر رجب سنة إحدى وخمسين وثمانمائة وأخذ عن والده والزين خطاب والبدر ابن قاضي شهبة وشيخي الإسلام النجمي والتقوى ابني قاضي عجلون وغيرهم، وكان — بوصف تلميذه — من بيت صلاح وعلم، دخل دمشق في طلب العلم فاستوطنها ولم يتناول من أوقافها شيئاً وأُرسل إليه بأموال ووظائف فلم يقبل، عالماً عاملاً ورعاً له مهابة في قلوب الفقهاء والحكام يُرجع إليه في المشكلات ولا يتردد إلى أحد لغناه، آمـراً بالمعروف ناهياً عن المنكر لا تأخذه في الله لومة لائم، وكان يختم القرآن في كل يوم جمعة ويختم في شهر رمضان كل ليلة ختمتين؛ له نونية مدح فيها السلطان سليمان وتعرّض فيها لما حصل في زمنه من الفتوحات كرودس وجالديران. توفي ليلة الاثنين ثاني المحرم ودُفن بباب الصغير جوار جدّه شيخ الإسلام شمس الدين البلاطنسي {cite:shadharat-dhahab p. 596-597}."
  en: "Shaykh mashayikh al-Islam of Damascus — b. Friday 10 Rajab 851, of 'a house of piety and learning' per his own pupil; settled in Damascus never taking a dirham of its waqfs, refusing money and posts, the recourse of jurists and governors in hard questions, a khatma every Friday and two each Ramadan night; his nuniyya praised Sulayman and chronicled Rhodes and Chaldiran; died Monday eve 2 Muharram, buried beside his grandfather at Bab al-Saghir {cite:shadharat-dhahab p. 596-597}."
  es: "Shaykh mashayikh al-Islam de Damasco — n. viernes 10 Rajab 851, de 'una casa de piedad y aprendizaje' según su propio discípulo; se estableció en Damasco sin aceptar jamás un dirham de sus waqfs, rechazando dinero y cargos, el recurso a juristas y gobernadores en cuestiones difíciles, un khatma cada viernes y dos cada noche de Ramadán; su nuniyya alabó a Sulayman y narró Rodas y Chaldiran; murió el lunes víspera 2 de Muharram, enterrado junto a su abuelo en Bab al-Saghir {cite:shadharat-dhahab p. 596-597}."
  fr: "Cheikh Mashayikh al-Islam de Damas — né le vendredi 10 Rajab 851, d'une « maison de piété et d'apprentissage » selon son propre élève; établi à Damas sans jamais prendre un dirham de ses waqfs, refusant argent et postes, le recours aux juristes et aux gouverneurs dans les questions difficiles, une khatma chaque vendredi et deux chaque nuit de Ramadan; sa nuniyya a fait l'éloge de Sulayman et a relaté Rhodes et Chaldiran; décédé le lundi soir 2 Muharram, enterré aux côtés de son grand-père à Bab al-Saghir {cite:shadharat-dhahab p. 596-597}."
  ur: "دمشق کے شیخ مشائخ الاسلام - b. جمعہ 10 رجب 851، 'تقویٰ اور علم کا گھر' اپنے شاگرد کے مطابق؛ دمشق میں مقیم اپنے وقف کا کبھی ایک درہم نہیں لینا، پیسے اور عہدوں سے انکار، فقہاء اور گورنروں کا سخت سوالات میں سہارا، ہر جمعہ کو ایک خاتمہ اور ہر رمضان کی دو رات؛ اس کی نونیہ نے سلیمان کی تعریف کی اور رہوڈز اور چلڈیران کی تاریخ بیان کی۔ پیر کی شام 2 محرم کو وفات پائی، باب الصغیر میں اپنے دادا کے پاس دفن ہوئے۔ 596-597}۔"
