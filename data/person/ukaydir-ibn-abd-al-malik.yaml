  ar: "ملك دومة الجندل، من كندة ونصراني بحسب ابن إسحاق؛ أسره خالد بن الوليد فحقن النبي دمه وصالحه على الجزية."
  en: King of Dumat al-Jandal, of Kinda and a Christian, according to Ibn Ishaq; Khalid ibn al-Walid captured him, and the Prophet spared his blood and made peace with him on the jizya.
  es: "Rey de Dumat al-Jandal, de Kinda y cristiano, según Ibn Ishaq; Khalid ibn al-Walid lo capturó, y el Profeta perdonó su vida e hizo las paces con él mediante el pago de la yizia."
  fr: "Roi de Dumat al-Jandal, de Kinda et chrétien, selon Ibn Ishaq; Khalid ibn al-Walid le captura, et le Prophète lui épargna son sang et fit la paix avec lui sur la jizya."
  ur: "دمت الجندل کا بادشاہ، کیندا اور عیسائی، ابن اسحاق کے مطابق؛ خالد بن ولید نے اسے پکڑ لیا اور رسول اللہ نے اس کا خون بہا دیا اور جزیہ پر اس سے صلح کر لی۔"
  tr: "Dumat al-Jandal kralı, Kinda kökenli ve İbn İshaq'a göre bir Hristiyan; Halid bin el-Velid'i yakalamış, bu yüzden Peygamber onun kanını bağışlamış ve cizye ile barıştırmıştır."
  id: "Raja Dumat al-Jandal, dari Kinda dan seorang Kristen menurut Ibn Ishaq; ia menangkap Khalid ibn al-Walid, sehingga Nabi menyelamatkan darahnya dan mendamaikannya dengan jizya."
