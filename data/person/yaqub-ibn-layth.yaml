id: person/yaqub-ibn-layth
class: person
label: { ar: "يعقوب بن الليث الصفار" }
summary:
  ar: "استولى على كرمان سنة خمس وخمسين ومائتين ثم دخل فارس {cite:tabari-tarikh-abu-al-fadl j.9 p.382} {cite:tabari-tarikh-abu-al-fadl j.9 p.384}، ووقعت بينه وبين الحسن بن زيد الطالبي سنة ستين ومائتين فهزمه {cite:tabari-tarikh-abu-al-fadl j.9 p.508}.، وعند المسعودي سار سنة اثنتين وستين ومائتين نحو العراق في جيوش عظيمة حتى نزل دير العاقول على شاطئ دجلة بين واسط وبغداد فواقعه أبو أحمد الموفق عند سيب بني كوما يوم الأحد لتسع خلون من رجب فانهزم {cite:muruj-al-dhahab p. 572-573}، ووصف المسعودي زهده في عسكره فكان لا يجلس إلا على قطعة مسح طولها نحو سبعة أشبار وإلى جانبه ترسه وعليه اتكاؤه وإذا أراد النوم اضطجع على ترسه وجعل رايته مخدته، ويذبح له في كل يوم عشرون شاة تطبخ في خمس قدور من الصفر ويفرق الباقي في الغلمان، وكان في عسكره خمسة آلاف جمل بخت وأضعافها حمير شهب تعرف بالصفارية تحمل الأثقال تخلى للرعي إذا نزل، وقال لرسول السلطان إن رئيس القوم يأتم به أصحابه فيما يظهر من أفعاله ونحن نقطع في كل يوم المهامه والمفاوز فلا يصلح لنا إلا التخفيف {cite:muruj-al-dhahab p. 575-576}، وبلغ الباميان من أوائل الهند لا قصد لفتحها {cite:fihrist-ibn-al-nadim p. 486}، وعند ابن الجوزي توفي بالأهواز سنة خمس وستين ومائتين فحُمل تابوته إلى جنديسابور وخلف في بيت ماله خمسين ألف ألف درهم وألف ألف دينار، وكتب على قبره «هذا قبر يعقوب المسكين» {cite:muntazam-ibn-al-jawzi j.5 p. 70}."
