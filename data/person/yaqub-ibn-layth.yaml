id: person/yaqub-ibn-layth
class: person
label: { ar: "يعقوب بن الليث الصفار", en: "Ya'qub ibn al-Layth al-Saffar", es: "Ya'qub ibn al-Layth al-Saffar", fr: "Ya'qub ibn al-Layth al-Saffar", ur: "یعقوب بن لیث الصفار" }
summary:
  ar: "استولى على كرمان سنة خمس وخمسين ومائتين ثم دخل فارس {cite:tabari-tarikh-abu-al-fadl j.9 p.382} {cite:tabari-tarikh-abu-al-fadl j.9 p.384}، ووقعت بينه وبين الحسن بن زيد الطالبي سنة ستين ومائتين فهزمه {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. وعند المسعودي سار سنة اثنتين وستين ومائتين نحو العراق في جيوش عظيمة حتى نزل دير العاقول على شاطئ دجلة بين واسط وبغداد فواقعه أبو أحمد الموفق عند سيب بني كوما يوم الأحد لتسع خلون من رجب فانهزم {cite:muruj-al-dhahab p. 572-573}، ووصف المسعودي زهده في عسكره فكان لا يجلس إلا على قطعة مسح طولها نحو سبعة أشبار وإلى جانبه ترسه وعليه اتكاؤه وإذا أراد النوم اضطجع على ترسه وجعل رايته مخدته، ويذبح له في كل يوم عشرون شاة تطبخ في خمس قدور من الصفر ويفرق الباقي في الغلمان، وكان في عسكره خمسة آلاف جمل بخت وأضعافها حمير شهب تعرف بالصفارية تحمل الأثقال تخلى للرعي إذا نزل، وقال لرسول السلطان إن رئيس القوم يأتم به أصحابه فيما يظهر من أفعاله ونحن نقطع في كل يوم المهامه والمفاوز فلا يصلح لنا إلا التخفيف {cite:muruj-al-dhahab p. 575-576}، وبلغ الباميان من أوائل الهند لا قصد لفتحها {cite:fihrist-ibn-al-nadim p. 486}، وعند ابن الجوزي توفي بالأهواز سنة خمس وستين ومائتين فحُمل تابوته إلى جنديسابور وخلف في بيت ماله خمسين ألف ألف درهم وألف ألف دينار، وكتب على قبره «هذا قبر يعقوب المسكين» {cite:muntazam-ibn-al-jawzi j.5 p. 70}. وعند ابن خلدون كان من صحب صالح بن نصر المتطوعي بسجستان لقتال الخوارج فلما اجتمع عليه المتطوعة كاتب المعتز يسأله ولايتها ويقلده حربهم فأذن له، وافتتح زابلستان وهي غزنة وأعمالها وولاه المعتمد جميع ما استولى عليه {cite:tarikh-ibn-khaldun-ibar p. 1108-1111}"
  tr: "255 Hicri yılında Kerman'ı ele geçirdi, ardından Pers'e girdi {cite:tabari-tarikh-abu-al-fadl J.9 s.382} {cite:tabari-tarikh-abu-al-fadl j.9 s.384} ve 260 Hicri yılında el-Hasan ibn Zayd el-Talibi arasında bir çatışma çıktı; burada onu yendi {cite:tabari-tarikh-abu-al-fadl j.9 s.508}. al-Mas'udi'ye göre, 262 Hicri yılında, büyük ordularla Irak'a yürüdü ve Wasit ile Bağdat arasında Dicle kıyısındaki Al-'Aqul Manastırı'na yerleşti. Ebu Ahmed el-Muvaffaq, Rajab'dan dokuz saat sonra, Pazar günü Seib Bani Kuma yakınlarında onunla karşılaştı ve yenildi {atıf:Muruj-al-Dhahab s. 572-573}. Al-Mas'udi, ordusundaki münzevini, sadece yaklaşık yedi arşın uzunluğunda bir parçanın üzerinde oturur, yanında kanepe ve sırt dayanağı üzerinde otururdu. Uyumak istediğinde, kalkanının üzerine uzanır, sancağını yastık olarak koyar ve onun için kurban sunardı Her gün, yirmi koyun beş kazanda pişirilir, geri kalanı çocuklar arasında dağıtılırdı. Kampında, Saffariyya olarak bilinen bir meteor eşeğinden kat daha fazla beş bin şanslı deve vardı; yükleri taşıyor ve aşağı indiğinde otlatmak için serbest bırakılıyordu. Sultan'ın elçisine, halkın liderinin yoldaşları tarafından yaptıklarıyla gösterdiği şekilde yargılandığını ve her gün onun görevlerini ve kazananları kesip geçtiğimizi, bu yüzden durumu hafiflemekten başka hiçbir şeyin bizim için iyi olmadığını söyledi. {alıntı: Muruj-al-Dhahab s. 575-576} ve Bamiyalılar, Hindistan'ın en eski bölgelerine fethetmeyi düşünmeden ulaştılar {atıf:fihrist-ibn-al-nadim s. 486}. İbn al-Jawzi'ye göre, 265 Hicri yılında Ahwaz'da öldü, bu yüzden tabutunu Jundesapur'a taşıdı, evinde elli bin bin dirhem ve bin bin dinar bıraktı. Mezarında şöyle yazıyordu: \"Bu, fakir Yakup'un mezarıdır\" {atıf:Muntazam-ibn-al-jawzi J.5 s. 70}. İbn Haldun'a göre, Salih bin Nasr el-Mutavi'nin Sicîstan'da Haricilerle savaşmak için yoldaşlarından biriydi. El-Mutavi'a etrafında toplandığında, el-Mutazz'ın yazarı ondan valilik istedi ve savaşa atadı ve izin verdi. Zabulistan'ı, yani Gazni ve topraklarını fethetti ve el-Mu'tamid onu ele geçirdiği her şeyle atadı {atıf:Tarikh-ibn-khaldun-ibar s. 1108-1111}"
  id: "Ia merebut Kerman pada tahun 255 H, lalu memasuki Persia {cite:tabari-tarikh-abu-al-fadl J.9 hlm.382} {cite:tabari-tarikh-abu-al-fadl j.9 hlm.384}, dan terjadi konflik antara ia dan al-Hasan ibn Zayd al-Talibi pada tahun 260 H, di mana ia mengalahkannya {cite:tabari-tarikh-abu-al-fadl j.9 hlm.508}. Menurut al-Mas'udi, pada tahun 262 H, ia berbaris menuju Irak dalam pasukan besar hingga menetap di Biara Al-'Aqul di tepi Sungai Tigris antara Wasit dan Baghdad. Abu Ahmad al-Muwaffaq menemuinya di dekat Seib Bani Kuma pada hari Minggu, sembilan jam setelah Rajab, dan dikalahkan {cite:Muruj-al-dhahab hlm. 572-573}. Al-Mas'udi menggambarkan asketismenya dalam pasukannya, karena ia hanya duduk di atas sepotong sepanjang sekitar tujuh hasta, dengan tempat tidur di sampingnya dan sandaran punggungnya di atasnya. Ketika ingin tidur, ia akan berbaring di atas perisainya dan meletakkan panjinya sebagai bantal, lalu berkorban untuknya Setiap hari, dua puluh domba dimasak dalam lima kuali nol, dan sisanya dibagikan kepada anak-anak. Di perkemahannya terdapat lima ribu unta beruntung, jauh lebih banyak dari keledai meteor, yang dikenal sebagai Saffariyya, membawa beban dan dibebaskan untuk dirumput saat ia turun. Ia mengatakan kepada utusan Sultan bahwa pemimpin rakyat dinilai oleh teman-temannya berdasarkan apa yang ditunjukkan dalam tindakannya, dan setiap hari kami memotong tugasnya dan para pemenang, jadi tidak ada yang baik bagi kami kecuali meringankan situasi. {kutip: Muruj-al-Dhahab hlm. 575-576}, dan orang Bamiya mencapai bagian paling awal India tanpa niat menaklukkannya {cite:fihrist-ibn-al-nadim hlm. 486}. Menurut Ibn al-Jawzi, ia meninggal di Ahwaz pada tahun 265 H, sehingga ia membawa peti matinya ke Jundesapur, meninggalkan di rumahnya lima puluh ribu dirham dan seribu ribu dinar. Di makamnya tertulis: \"Ini adalah makam Jacob yang miskin\" {cite:Muntazam-ibn-al-jawzi J.5 hlm. 70}. Menurut Ibn Khaldun, ia adalah salah satu sahabat Saleh ibn Nasr al-Mutawi di Sijistan untuk melawan Kharijit. Ketika al-Mutawi'a berkumpul di sekitarnya, penulis al-Mu'tazz memintanya untuk menjadi gubernur dan menunjuknya untuk berperang, sehingga ia memberi izin. Ia menaklukkan Zabulistan, yaitu Ghazni dan wilayahnya, dan al-Mu'tamid mengangkatnya dengan segala yang telah ia rebut {cite:Tarikh-ibn-khaldun-ibar hlm. 1108-1111}"
