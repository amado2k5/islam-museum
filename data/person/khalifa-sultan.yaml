roles: [vizier, scholar]
gender: male
summary:
  ar: "حسين بن محمد الميرزا رفيع الدين الحسيني المرعشي الآملي الأصفهاني، المعروف بسلطان العلماء، من علماء الإمامية، وزر للشاه عباس الصفوي ثم للشاه صفي ثم للشاه عباس الثاني، وتوفي ببلدة الأشرف من مازندران سنة 1064 هـ ونُقل إلى النجف."
  en: "Husayn ibn Muhammad, al-Mirza Rafi' al-Din al-Husayni al-Mar'ashi al-Amuli al-Isfahani, known as Sultan al-Ulama, an Imami scholar who served as vizier to Shah Abbas the Safavid, Shah Safi and Shah Abbas II; died in al-Ashraf in Mazandaran in 1064 AH and was carried to al-Najaf."
  es: "Husayn ibn Muhammad, al-Mirza Rafi' al-Din al-Husayni al-Mar'ashi al-Amuli al-Isfahani, conocido como Sultan al-Ulama, un erudito Imami que sirvió como visir de Shah Abbas el Safawí, Shah Safi y Shah Abbas II; Murió en al-Ashraf en Mazandaran en 1064 d.H. y fue llevado a al-Najaf."
  fr: "Husayn ibn Muhammad, al-Mirza Rafi' al-Din al-Husayni al-Mar'ashi al-Amuli al-Isfahani, connu sous le nom de Sultan al-Ulama, un érudit Imami qui a servi comme vizir de Shah Abbas le Safavide, Shah Safi et Shah Abbas II; mourut à al-Achraf à Mazandaran en 1064 AH et fut transporté à al-Najaf."
