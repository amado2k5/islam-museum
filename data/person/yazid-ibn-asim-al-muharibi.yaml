summary:
  ar: "قيل إنه أول من حكم بصفين من الخوارج، وقيل عروة بن أذينة التميمي وقيل رجل من بني سعد بن زيد مناة {cite:muruj-al-dhahab p. 129}."
  en: "Named by some as the first to raise the hukm at Siffin — variants name 'Urwa ibn Udhayna or a Sa'dite of Banu Zayd Manat {cite:muruj-al-dhahab p. 129}."
  es: "Algunos lo nombran como el primero en levantar el hukm en Siffin; variantes lo nombran 'Urwa ibn Udhayna o un sádita de Banu Zayd Manat {cite:muruj-al-dhahab p. 129}."
  fr: "Certains le désignent comme le premier à avoir levé le hukm à Siffin — des variantes le nomment 'Urwa ibn Udhayna ou un Sa'dite de Banu Zayd Manat {cite:muruj-al-dhahab p. 129}."
  ur: "بعض لوگوں نے صفین میں سب سے پہلے حکم اٹھانے کا نام دیا ہے - مختلف قسموں کا نام عروہ ابن عدینہ یا بنو زید منات کے ایک سعدی {حوالہ: مروج الذہب صفحہ 2000 129}۔"
  tr: "Siffin'de Hariciler arasında ilk hüküm süren kişi olduğu söylenir, Urwah ibn Udhaynah al-Tamimi olarak da söylenir ve Banu Sa'd ibn Zayd Manat'tan bir adam olduğu söylenir {atıf:muruj-al-dhahab, s. 129}."
  id: "Dikatakan bahwa ia adalah yang pertama memerintah di Siffin di antara Kharijit, dan dikatakan Urwah ibn Udhaynah al-Tamimi, dan dikatakan ia adalah orang dari Banu Sa'd ibn Zayd Manat {cite:muruj-al-dhahab, hlm. 129}."
