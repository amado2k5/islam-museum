summary:
  ar: "الشاعر اللغوي صاحب الزندقة المأثورة والذعاء المفرط والزهد الفلسفي؛ جُدِر وهو ابن ثلاث سنين فذهب بصره وعمى من الجدري أول سنة سبع وستين وثلاث مئة، دخل بغداد مرتين ثم رجع إلى المعرة ولزم منزله وسار إليه الطلبة من الآفاق وسمى نفسه رهين المحبسين للزومه منزله ولذهاب عينيه، ومكث خمساً وأربعين سنة لا يأكل اللحم تديناً برأي الحكماء المتقدمين أنهم لا يرون إيلام الحيوان، ومن تصانيفه لزوم ما لا يلزم في خمس مجلدات أو ما يقاربها وسقط الزند وضوء السقط ورسالة الغفران وعبث الوليد ومعجر أحمد، وشرح دواوين أبي تمام والبحتري والمتنبي، توفي سنة تسع وأربعين وأربع مئة وله ست وثمانون سنة {cite:shadharat-dhahab p. 288-289}."
  en: "The blind poet-philosopher of Ma'arra — 'prisoner of two gaols', his house and his sight, vegetarian forty-five years on the ancients' grounds that no animal should be made to suffer; author of the Luzum (five volumes), Saqt al-zand, the Risalat al-ghufran and commentaries on Abu Tammam, al-Buhturi and al-Mutanabbi; he died in 449 at eighty-six {cite:shadharat-dhahab p. 288-289}."
  fr: "Le poète-philosophe aveugle de Ma'arra — « prisonnier de deux geôles », sa maison et sa cécité, végétarien quarante-cinq ans selon l'argument des anciens qu'aucun animal ne doit souffrir ; auteur du Luzum (cinq volumes), du Saqt al-zand, de la Risalat al-ghufran et de commentaires sur Abu Tammam, al-Buhturi et al-Mutanabbi ; il mourut en 449 à quatre-vingt-six ans {cite:shadharat-dhahab p. 288-289}."
  es: "El poeta-filósofo ciego de Ma'arra — 'prisionero de dos cárceles', su casa y su vista, vegetariano durante cuarenta y cinco años por los motivos de los antiguos de que ningún animal debe sufrir; autor del Luzum (cinco volúmenes), Saqt al-zand, el Risalat al-ghufran y comentarios sobre Abu Tammam, al-Buhturi y al-Mutanabbi; murió en 449 a los ochenta y seis años {cite:shadharat-dhahab p. 288-289}."
  ur: "معررہ کا نابینا شاعر فلسفی - 'دو جیلوں کا قیدی'، اس کا گھر اور اس کی بینائی، پینتالیس سال سبزی خور اس بنیاد پر کہ کسی جانور کو تکلیف نہ دی جائے۔ لزوم ⁦(پانچ جلدوں)⁩ کے مصنف، سقط الزند، رسالت الغفران اور ابو تمام، البطوری اور المتنبی کی تفسیر؛ ان کی وفات 449 میں چھیاسی میں ہوئی۔ 288-289}۔"
  tr: "Sapkınlığı, aşırı duaları ve felsefi çileciliğiyle tanınan şair-dilbilimci, üç yaşındayken çiçek hastalığına yakalandı ve 367 Hicri yılının ilk yılında görme yetisini kaybederek kör oldu. İki kez Bağdat'a girdi, sonra Ma'arra'ya döndü ve evinde kaldı. Her yerden öğrenciler ona geldi ve evine kapanması ve görme yetisini kaybetmesi nedeniyle kendisine \"iki hapishanenin mahkumu\" adını verdi. Kırk beş yıl boyunca et yemedi ve eski bilginlerin hayvanların acısını et yememek için bir sebep olarak görmedikleri görüşüne bağlı kaldı. Eserleri arasında yaklaşık beş ciltlik \"Gereksiz Şeylerin Gerekliliği\", \"Çakmak Taşının Kıvılcımı\", \"Kıvılcımın Işığı\", \"Bağışlama Mektubu\", \"Çocuğun Oyunbazlığı\" ve \"Ahmed'in Mucizesi\" bulunmaktadır. Ayrıca Ebu Tammam, el-Buhturi ve el-Mutanabbi'nin Divanları üzerine tefsirler yazmıştır. Hicri 449 yılında seksen altı yaşında vefat etmiştir. {cite:shadharat-dhahab s. 288-289}"
  id: "Penyair sekaligus ahli bahasa ini, yang dikenal karena kesesatannya, permohonannya yang berlebihan, dan asketisme filosofisnya, tertular cacar pada usia tiga tahun, kehilangan penglihatannya dan menjadi buta karenanya pada tahun pertama 367 H. Ia memasuki Baghdad dua kali, kemudian kembali ke Ma'arra dan tinggal di rumahnya. Murid-murid datang kepadanya dari seluruh penjuru, dan ia menyebut dirinya \"tahanan dua penjara\" karena terkurung di rumahnya dan kehilangan penglihatannya. Ia tetap tidak makan daging selama empat puluh lima tahun, berpegang pada pendapat para bijak kuno bahwa mereka tidak melihat penderitaan hewan sebagai alasan untuk berpantang makan daging. Di antara karya-karyanya adalah \"Kebutuhan akan Apa yang Tidak Perlu\" dalam lima jilid atau lebih, \"Percikan Batu Api,\" \"Cahaya Percikan,\" \"Surat Pengampunan,\" \"Keceriaan Anak,\" dan \"Mukjizat Ahmad.\" Beliau juga menulis komentar atas kitab-kitab Abu Tammam, al-Buhturi, dan al-Mutanabbi. Beliau wafat pada tahun 449 Hijriah pada usia delapan puluh enam tahun. {cite:shadharat-dhahab hlm. 288-289}"
