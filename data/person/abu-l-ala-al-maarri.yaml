summary:
  ar: "الشاعر اللغوي صاحب الزندقة المأثورة والذعاء المفرط والزهد الفلسفي؛ جُدِر وهو ابن ثلاث سنين فذهب بصره وعمى من الجدري أول سنة سبع وستين وثلاث مئة، دخل بغداد مرتين ثم رجع إلى المعرة ولزم منزله وسار إليه الطلبة من الآفاق وسمى نفسه رهين المحبسين للزومه منزله ولذهاب عينيه، ومكث خمساً وأربعين سنة لا يأكل اللحم تديناً برأي الحكماء المتقدمين أنهم لا يرون إيلام الحيوان، ومن تصانيفه لزوم ما لا يلزم في خمس مجلدات أو ما يقاربها وسقط الزند وضوء السقط ورسالة الغفران وعبث الوليد ومعجر أحمد، وشرح دواوين أبي تمام والبحتري وديدان... والمتنبي، توفي سنة تسع وأربعين وأربع مئة وله ست وثمانون سنة {cite:shadharat-dhahab p. 288-289}."
  en: "The blind poet-philosopher of Ma'arra — 'prisoner of two gaols', his house and his sight, vegetarian forty-five years on the ancients' grounds that no animal should be made to suffer; author of the Luzum (five volumes), Saqt al-zand, the Risalat al-ghufran and commentaries on Abu Tammam, al-Buhturi and al-Mutanabbi; he died in 449 at eighty-six {cite:shadharat-dhahab p. 288-289}."
