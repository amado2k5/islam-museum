summary:
  ar: "يحيى بن عبد العظيم بن يحيى بن محمد، أبو الحسين الجزار، جمال الدين، شاعر مصري ظريف كان جزارا بالفسطاط وأقبل على الأدب فمدح السلاطين والملوك وعاش على جوائزهم، وكان من أصدقاء ابن سعيد صاحب «المغرب في حلى المغرب»، ومن آثاره «العقود الدرية في الأمراء المصرية» و«فوائد الموائد» وديوان شعر {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 153}."
  en: "Yahya ibn Abd al-Azim ibn Yahya ibn Muhammad, Abu al-Husayn al-Jazzar, Jamal al-Din, a witty Egyptian poet who was a butcher in al-Fustat, turned to letters, praised sultans and kings and lived on their rewards, and was a friend of Ibn Sa'id, author of al-Mughrib fi Hula al-Maghrib; his works include al-Uqud al-Durriyya fi al-Umara' al-Misriyya, Fawa'id al-Mawa'id and a diwan of verse {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 153}."
  es: "Yahya ibn Abd al-Azim ibn Yahya ibn Muhammad, Abu al-Husayn al-Jazzar, Jamal al-Din, un ingenioso poeta egipcio que fue carnicero en al-Fustat, se dedicó a las letras, elogió a sultanes y reyes y vivió de sus recompensas, y fue amigo de Ibn Sa'id, autor de al-Mughrib fi Hula al-Maghrib; sus obras incluyen al-Uqud al-Durriyya fi al-Umara' al-Misriyya, Fawa'id al-Mawa'id y un diwan de verso {citar:alam-zirikli-dar-al-ilm-2002 vol. 8p. 153}."
  fr: "Yahya ibn Abd al-Azim ibn Yahya ibn Muhammad, Abu al-Husayn al-Jazzar, Jamal al-Din, un poète égyptien plein d'esprit qui était boucher à al-Fustat, se tournait vers les lettres, louait les sultans et les rois et vivait de leurs récompenses, et était un ami d'Ibn Sa'id, auteur d'al-Mughrib fi Hula al-Maghrib; ses œuvres incluent al-Uqud al-Durriyya fi al-Umara' al-Misriyya, Fawa'id al-Mawa'id et un diwan de vers {cite:alam-zirikli-dar-al-ilm-2002 vol. 20h. 153}."
  ur: "یحییٰ بن عبدالعظیم ابن یحییٰ ابن محمد، ابو الحسین الجزائر، جمال الدین، ایک لطیف مصری شاعر جو الفستات میں قصائی تھا، خطوط کی طرف متوجہ ہوا، سلطانوں اور بادشاہوں کی تعریف کرتا تھا اور ان کے انعامات پر زندگی گزارتا تھا، اور صائب المعروف صابری کے دوست تھے۔ المغرب؛ ان کی تصانیف میں العقد الدریہ فی العمرۃ المصریہ، فوائد الموائد اور آیت کا دیوان شامل ہیں۔ 8ص 153}۔"
  tr: "Yahya ibn Abdülazim bin Yahya ibn Muhammed, Ebu el-Hüseyin el-Cazsar, Cemaleddin, Fustat'ta kasap olan esprili bir Mısırlı şairdi ve edebiyata kendini adamış, sultanları ve kralları övmüş ve onların ödülleriyle yaşamıştır. 'Al-Maghrib fi Hula al-Maghrib' adlı eserin yazarı İbn Sa'id'in arkadaşıydı; bu eserin eserleri arasında 'Al-'Uqud al-Duriya fi al-Umara al-Misriyya', 'Fawa'id al-Maw'id' ve bir şiir koleksiyonu {cite:alam-zirikli-dar-al-ilm-2002 cilt 8, s. 153} bulunmaktadır."
  id: "Yahya ibn Abd al-Azim ibn Yahya ibn Muhammad, Abu al-Husayn al-Jazzar, Jamal al-Din, adalah seorang penyair Mesir yang cerdas yang menjadi tukang daging di Fustat dan mendedikasikan dirinya pada sastra, memuji sultan dan raja serta hidup dari penghargaan mereka. Ia adalah teman Ibn Sa'id, penulis 'Al-Maghrib fi Hula al-Maghrib', yang karyanya meliputi 'Al-'Uqud al-Duriya fi al-Umara al-Misriyya', 'Fawa'id al-Maw'id', dan kumpulan puisi {cite:alam-zirikli-dar-al-ilm-2002 vol. 8, hlm. 153}."
