summary:
  ar: "داعية وعالم سوداني وُلد في القاهرة سنة 1964، تخرج في كلية الشريعة بالجامعة الإسلامية بالمدينة المنورة وأتم دراساته العليا في جامعة الخرطوم، وترأس قسم الثقافة الإسلامية فيها، وتولى عمادة كلية الدراسات الإسلامية بجامعة أفريقيا العالمية، وهو إمام وخطيب مجمع خاتم المرسلين بالخرطوم، ومالك قناة طيبة الفضائية التي أوقف بثها سنة 2019."
  en: "Sudanese preacher and scholar born in Cairo in 1964. He graduated from the College of Sharia at the Islamic University of Madinah and completed postgraduate studies at the University of Khartoum, headed its Islamic Culture Department, served as dean of the College of Islamic Studies at the International University of Africa, is imam and khatib of the Khatim al-Mursalin complex in Khartoum, and owned the Tayba satellite channel, whose broadcasting was suspended in 2019."
  ur: "سوڈانی داعی اور عالم، 1964 میں قاہرہ میں پیدا ہوئے۔ جامعہ اسلامیہ مدینہ منورہ کے کلیہ الشریعہ سے فارغ التحصیل ہوئے اور جامعہ خرطوم میں اعلیٰ تعلیم مکمل کی، وہاں شعبہ ثقافتِ اسلامیہ کے سربراہ رہے، جامعہ افریقہ عالمیہ میں کلیہ الدراسات الاسلامیہ کے عمید رہے، خرطوم میں مجمع خاتم المرسلین کے امام و خطیب ہیں، اور فضائی چینل طیبہ کے مالک تھے جس کی نشریات 2019 میں بند کر دی گئیں۔"
