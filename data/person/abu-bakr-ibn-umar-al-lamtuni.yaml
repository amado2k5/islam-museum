summary:
  ar: "القائد الذي يقدم به الملثمون خرجوا من جنوبي المغرب المتاخم لبلاد السودان فأخذوا البلاد من ولاة زناتة من تلمسان إلى ساحل البحر المحيط؛ كان رجلاً ساذجاً خير الطباع مؤثراً لبلاده على بلاد المغرب غير ميال إلى الرفاهية، فلما حصلت له البلاد سمع أن عجوزاً في بلاده ذهبت لها ناقة في غارة فبكت وقالت ضيعنا أبو بكر بن عمر بدخوله إلى بلاد المغرب فاستخلف على المغرب يوسف بن تاشفين ورجع إلى بلاده الجنوبية {cite:wafayat-ayan p. 112-113}."
  en: "The Lamtuni commander who led the mulaththamun from the Sudan borderlands and took the Maghreb from Zanata's governors; so wedded to his southern country that an old woman's weeping over a raided she-camel made him install Yusuf b. Tashfin over the Maghreb and go home {cite:wafayat-ayan p. 112-113}."
