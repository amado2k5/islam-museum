summary:
  ar: "لاعب كرة قدم بوسني سابق، وُلد في توزلا سنة 1990 ونشأ في لوكسمبورغ بعد فرار أسرته من حرب البوسنة؛ لاعب وسط بدأ مع ميتز ثم ليون، وتألق مع روما، وفاز مع يوفنتوس بأربعة ألقاب في الدوري الإيطالي، ثم لعب لبرشلونة وبشكتاش والشارقة وسيسكا موسكو قبل اعتزاله سنة 2025، واشتُهر بدقة ركلاته الحرة. مثّل البوسنة والهرسك في 115 مباراة دولية وفي أول بطولة كبرى في تاريخها، كأس العالم 2014."
  en: "Bosnian former professional footballer, born in Tuzla in 1990 and raised in Luxembourg after his family fled the Bosnian War. A midfielder who began at Metz and Lyon, starred for Roma, and won four Serie A titles with Juventus, before playing for Barcelona, Beşiktaş, Sharjah and CSKA Moscow and retiring in 2025; he was widely cited as one of the finest free-kick takers of his era. He earned 115 caps for Bosnia and Herzegovina and represented the country at its first major tournament, the 2014 FIFA World Cup."
  ur: "سابق بوسنیائی پیشہ ور فٹبالر، 1990 میں توزلا میں پیدا ہوئے اور بوسنیائی جنگ کے دوران خاندان کے فرار کے بعد لکسمبرگ میں پروان چڑھے؛ مڈفیلڈر جنہوں نے میٹز اور لیون سے آغاز کیا، روما میں نمایاں ہوئے، یوونٹس کے ساتھ چار سیری آ خطاب جیتے، پھر بارسلونا، بیشکتاش، شارجہ اور سی ایس کے اے ماسکو کے لیے کھیل کر 2025 میں ریٹائر ہوئے؛ اپنے دور کے بہترین فری کک لینے والوں میں شمار ہوتے تھے۔ بوسنیا و ہرزیگووینا کے لیے 115 بین الاقوامی میچ کھیلے اور ملک کے پہلے بڑے ٹورنامنٹ 2014 کے فیفا ورلڈ کپ میں شرکت کی۔"
