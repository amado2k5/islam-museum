summary:
  ar: "شاعر وناقد سوري وُلد سنة 1930 في قرية القصابين قرب اللاذقية، وقاد ثورة الحداثة في الشعر العربي المعاصر. شارك في تأسيس مجلة «شعر» (1957) وأسّس «مواقف» (1968)، ومن أشهر أعماله «أغاني مهيار الدمشقي» (1961) و«الثابت والمتحول»، ويعيش في باريس."
  en: "Syrian poet and critic born in 1930 at the village of al-Qassabin near Latakia, who led the modernist revolution in contemporary Arabic poetry. He co-founded the magazine Shi'r (1957) and founded Mawaqif (1968); among his best-known works are The Songs of Mihyar the Damascene (1961) and The Static and the Dynamic. He lives in Paris."
