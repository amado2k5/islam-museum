summary:
  ar: "سعيد بن عمرو الجرشي؛ ولاه مسلمة بن عبد الملك خراسان فلما قرأ كاتبه عهده وكان لحاناً قال إن الأمير بريء مما تسمعون من هذا اللحن ودعا السغد إلى الطاعة فلما أقاموا على خلافه زحف إليهم فانقطع عن عظيمهم زهاء اثني عشر ألفاً وافتتح عامة حصون السغد ونال من المال نيلاً شافياً."
  en: "Sa'id ibn Amr al-Jarashi; over Khurasan he disavowed his katib's solecisms — 'the amir is innocent of this lahn' — then, Sughd refusing, marched till twelve thousand defected to him and he opened most of its fortresses."
