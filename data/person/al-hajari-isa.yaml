summary:
  ar: "الجندي من أولاد الأجناد بأربل، المعروف بالحاجري نسبة إلى حاجر بايدة كثّر ذكرها في شعره ولم يكن منها؛ له ديوان شعر تغلب عليه الرقة وفيه معان جيدة مشتمل على الشعر والدوبيت والمواليا وقد أحسن في الكل مع أنه قل من يجيد في مجموع الثلاثة؛ حبس بقلعة خفتيد ثم قلعة أربل، فلما أفرج اتصل بخدمة مظفر الدين صاحب أربل وتقدم عنده وتزيا بزي الصوفية، فلما توفي مظفر الدين وصارت أربل في مملكة المستنصر وثب عليه شخص قبل الظهر فطعنه بسكين فكتب وهو يكابد الموت إلى نائبها باتكين يشكو، وتوفي من يومه {cite:shadharat-dhahab p. 156-158}."
  en: "al-Hajari (d. 632) — the soldier-poet of Arbil, master of shi'r, dubayt and muwaliya together; imprisoned in the citadel, released into Kokburi's service, then stabbed in the street under the new Abbasid order — composing his last complaint verses as he died of the wound {cite:shadharat-dhahab p. 156-158}."
  fr: "Al-Hajari (mort en 632 H), soldat-poète d’Arbil, maître à la fois du shi’r, du dubayt et de la muwaliya ; emprisonné dans la citadelle, libéré et entré au service de Kokburi, puis poignardé dans la rue sous le nouvel ordre abbasside, il composa ses derniers vers de plainte en mourant de sa blessure {cite:shadharat-dhahab p. 156-158}."
  es: "al-Hajari (m. 632) — el soldado-poeta de Arbil, maestro de shi'r, dubayt y muwaliya a la vez; encarcelado en la ciudadela, liberado al servicio de Kokburi, luego apuñalado en la calle bajo el nuevo orden abasí — componiendo sus últimos versos de queja mientras moría de la herida {cite:shadharat-dhahab p. 156-158}."
  ur: "الہجری ⁦(متوفی 632)⁩ - اربیل کا سپاہی شاعر، شعر، دوبیت اور معالیہ کا ماہر؛ قلعہ میں قید، کوکبوری کی خدمت میں رہا کیا گیا، پھر نئے عباسی حکم کے تحت گلی میں چھرا گھونپ دیا گیا - زخم سے مرتے وقت اپنی آخری شکایتی آیات لکھتے ہوئے 156-158}۔"
  tr: "Erbil'de askerlerin oğullarından biri olan ve Hacır Beyda'nın adını şiirlerinde sık sık anan, ancak oradan olmayan el-Hacıri adlı asker, şiirlerinde incelik ve güzel anlamlar barındıran, beyit, mevval ve şiir türlerinde eserler vermiştir. Üçünde de üstün başarı göstermiş, ancak üçünde birden üstün başarı gösteren az kişi vardır. Önce Huftayd kalesinde, sonra Erbil kalesinde hapsedilmiştir. Serbest bırakıldıktan sonra Erbil hükümdarı Muzaffar el-Din'in hizmetine girmiş ve onun gözüne girerek Sufi tarikatının kıyafetlerini benimsemiştir. Muzaffar el-Din öldüğünde ve Erbil, el-Mustansir'in yönetimine geçtiğinde, öğleden önce bir kişi ona saldırmış ve bıçakla yaralamıştır. Ölüm döşeğindeyken, yardımcısı Batkin'e şikayet mektubu yazmış ve aynı gün ölmüştür. {cite:shadharat-dhahab p. 156-158}"
  id: "Prajurit itu, salah satu putra prajurit di Irbil, dikenal sebagai al-Hajiri, dinamai menurut Hajir Bayda, yang sering ia sebutkan dalam puisinya, meskipun ia bukan berasal dari sana. Ia memiliki kumpulan puisi yang bercirikan kelembutan dan mengandung makna yang baik, termasuk puisi, bait berpasangan, dan mawwal. Ia unggul dalam semuanya, meskipun hanya sedikit yang unggul dalam ketiganya. Ia dipenjara di benteng Khuftayd, kemudian di benteng Irbil. Setelah dibebaskan, ia bergabung dengan layanan Muzaffar al-Din, penguasa Irbil, dan naik pangkat di bawahnya, mengenakan pakaian Sufi. Ketika Muzaffar al-Din meninggal dan Irbil berada di bawah kekuasaan al-Mustansir, seseorang menyerangnya sebelum tengah hari dan menikamnya dengan pisau. Saat sekarat, ia menulis surat kepada wakilnya, Batkin, untuk mengeluh, dan meninggal pada hari itu juga. {cite:shadharat-dhahab hlm. 156-158}"
