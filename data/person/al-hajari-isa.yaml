summary:
  ar: "الجندي من أولاد الأجناد بأربل، المعروف بالحاجري نسبة إلى حاجر بايدة كثّر ذكرها في شعره ولم يكن منها؛ له ديوان شعر تغلب عليه الرقة وفيه معان جيدة مشتمل على الشعر والدوبيت والمواليا وقد أحسن في الكل مع أنه قل من يجيد في مجموع الثلاثة؛ حبس بقلعة خفتيد ثم قلعة أربل، فلما أفرج اتصل بخدمة مظفر الدين صاحب أربل وتقدم عنده وتزيا بزي الصوفية، فلما توفي مظفر الدين وصارت أربل في مملكة المستنصر وثب عليه شخص قبل الظهر فطعنه بسكين فكتب وهو يكابد الموت إلى نائبها باتكين يشكو، وتوفي من يومه {cite:shadharat-dhahab p. 156-158}."
  en: "al-Hajari (d. 632) — the soldier-poet of Arbil, master of shi'r, dubayt and muwaliya together; imprisoned in the citadel, released into Kokburi's service, then stabbed in the street under the new Abbasid order — composing his last complaint verses as he died of the wound {cite:shadharat-dhahab p. 156-158}."
