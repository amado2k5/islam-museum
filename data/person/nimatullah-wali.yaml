summary:
  ar: "بطاقة أولية لشاه نعمة الله الولي الكرماني، مؤسس الطريقة النعمة اللهية وشاعر التصوف في القرنين الرابع عشر والخامس عشر، توفي سنة ١٤٣١م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shah Ni'matullah al-Wali al-Kirmani, founder of the Ni'matullahi order and Sufi poet of the fourteenth-fifteenth centuries, d. 1431; the biographical entry is not yet checked on the page."
  es: "Tarjeta borrador para Shah Ni'matullah al-Wali al-Kirmani, fundador de la orden Ni'matullahi y poeta sufí de los siglos XIV-XV, d. 1431; la entrada biográfica aún no está marcada en la página."
  fr: "Projet de carte pour Shah Ni'matullah al-Wali al-Kirmani, fondateur de l'ordre Ni'matullahi et poète soufi des XIVe-XVe siècles, d. 1431; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "چودھویں-پندرھویں صدی کے صوفی شاعر، نعمت اللہ الولی الکرمانی، نعمت اللہ کے بانی اور صوفی شاعر کے لیے مسودہ کارڈ۔ 1431; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Ni'ma Ullah tarikatının kurucusu ve 14. ve 15. yüzyıllarda Sufi şair olan Şah Ni'matullah al-Wali al-Kermani'nin ön kartı 1431 yılında öldü; Ma'jam al-A'lam tarafından anılır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Shah Ni'matullah al-Wali al-Kermani, pendiri tarekat Ni'ma Ullah dan penyair Sufi pada abad ke-14 dan ke-15, meninggal pada tahun 1431 M; ia dikenang oleh Ma'jam al-A'lam, dan biografinya belum pernah diulas di halaman tersebut."
