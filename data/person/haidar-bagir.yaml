summary:
  ar: حيدر باقر ⁦(1957–)⁩ ناشر ومربٍّ ومؤلف إندونيسي، مؤسس ورئيس مجموعة Mizan النشرية التي شكّلت الخطاب الإسلامي الحديث في إندونيسيا، ويكتب في التصوف والفكر الإسلامي ويدعم التنمية المجتمعية.
  en: Haidar Bagir (born 1957) is an Indonesian publisher, educator and author, founder and president-director of the Mizan Group, the publishing house that shaped modern Islamic discourse in Indonesia;
    he writes on Sufism and Islamic thought and supports community development.
  ur: حیدر باقر ⁦(1957–)⁩ انڈونیشین ناشر، مربی اور مصنف ہیں اور Mizan گروپ کے بانی و صدر ڈائریکٹر ہیں جس نے انڈونیشیا میں جدید اسلامی خطاب کی تشکیل کی؛ وہ تصوف اور اسلامی فکر پر لکھتے اور سماجی ترقی کی
    حمایت کرتے ہیں۔
  es: "Haidar Bagir (nacido en 1957) es un editor, educador y autor indonesio, fundador y presidente-director del Grupo Mizan, la editorial que dio forma al discurso islámico moderno en Indonesia; escribe sobre el sufismo y el pensamiento islámico y apoya el desarrollo comunitario."
  fr: "Haidar Bagir (né en 1957) est un éditeur, éducateur et auteur indonésien, fondateur et président-directeur du groupe Mizan, la maison d'édition qui a façonné le discours islamique moderne en Indonésie; il écrit sur le soufisme et la pensée islamique et soutient le développement communautaire."
  tr: "Haider Baqir (1957–), Endonezyalı bir yayıncı, eğitimci ve yazar; Endonezya'da modern İslami söylemi şekillendiren Mizan yayıncılık grubunun kurucusu ve başkanıdır. Sufizm ve İslami düşünce üzerine yazmakta ve toplumsal gelişimi desteklemektedir."
  id: "Haider Baqir (1957–) adalah seorang penerbit, pendidik, dan penulis asal Indonesia, pendiri dan ketua kelompok penerbitan Mizan, yang membentuk wacana Islam modern di Indonesia. Ia menulis tentang Sufisme dan pemikiran Islam serta mendukung pengembangan komunitas."
