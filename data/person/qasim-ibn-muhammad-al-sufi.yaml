summary:
  ar: "القاسم بن محمد بن سلمة الصوفي، كان لنفسه حافظًا، وبحكم الرهبانية لافظًا. روى عن راهب في كنيسة بالشام، وعن أبي صفوان العابد الشامي الذي كان بمكة، قولهم في الطمع والرجاء والمحبة التي لا تترك للقلب راحة إلا الاتصال بالله."
  en: "al-Qasim ibn Muhammad ibn Salama al-Sufi, a guardian of himself who spoke by the rules of monastic discipline; he relates from a monk in a church in Syria that the aim of lovers is to reach their wills and the aim of the fearful is to reach safety from fear, and from Abu Safwan the Syrian worshipper at Mecca a conversation about a worker who strove for greed and hope, and about love that leaves the heart no rest but union with God."
  ur: "قاسم بن محمد بن سلمہ صوفی اپنے نفس کی حفاظت کرنے والے اور راہبانہ اصولوں کے مطابق بات کرنے والے تھے۔ انہوں نے شام کے ایک گرجا کے راہب سے نقل کیا کہ محبت کرنے والوں کی ہمت اپنی مراد تک پہنچنا ہے اور ڈرنے والوں کی ہمت خوف سے امن تک پہنچنا ہے، اور ابو صفوان شامی عابد سے نقل کیا جو مکہ میں تھے، کہ عبادت کرنے والے کی راہ میں طمع اور امید کام کرتی ہے، اور جب محبت دل پر غالب آتی ہے تو اللہ سے اتصال کے سوا کوئی راحت باقی نہیں رہتی۔"
  es: "Al-Qasim ibn Muhammad ibn Salama al-Sufi, un guardián de sí mismo que hablaba según las reglas de la disciplina monástica, relata de un monje en una iglesia de Siria que el objetivo de los amantes es alcanzar sus deseos y el objetivo de los temerosos es alcanzar la seguridad del miedo, y de Abu Safwan, el adorador sirio en La Meca, una conversación sobre un trabajador que luchaba por la codicia y la esperanza, y sobre un amor que no deja descanso al corazón excepto la unión con Dios."
  fr: "Al-Qasim ibn Muhammad ibn Salama al-Sufi, un maître de lui-même qui parlait selon les règles de la discipline monastique, rapporte d'un moine d'une église en Syrie que le but des amoureux est d'atteindre leurs désirs et celui des craintifs d'échapper à la peur, et d'Abu Safwan, un fidèle syrien de La Mecque, une conversation sur un travailleur tiraillé entre avidité et espoir, et sur l'amour qui ne laisse au cœur d'autre repos que l'union avec Dieu."
  tr: "Sufi El-Kasım bin Muhammed bin Salamah, kendisini ezberleyen biriydi ve manastır tarikatı sayesinde sesli bir tarikattı. Levant'taki bir kilisedeki bir keşişten ve Mekke'de dindar Levant ibadet eden Ebu Safvan'dan, kalbi sadece Allah ile bağ kuran açgözlülük, umut ve sevgi hakkındaki sözlerini anlattı."
  id: "Al-Qasim ibn Muhammad ibn Salamah sang Sufi adalah seorang penghafal dirinya sendiri, dan berdasarkan tarekat monastik, ia adalah seorang yang vokal. Ia menceritakan dari seorang biksu di sebuah gereja di Levant, dan dari Abu Safwan, pemuja Levant yang taat yang berada di Mekah, kata-kata mereka tentang keserakahan, harapan, dan cinta yang tidak meninggalkan ketenangan hati kecuali hubungan dengan Tuhan."
