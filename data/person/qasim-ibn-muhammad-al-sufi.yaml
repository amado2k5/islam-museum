summary:
  ar: "القاسم بن محمد بن سلمة الصوفي، كان لنفسه حافظًا، وبحكم الرهبانية لافظًا. روى عن راهب في كنيسة بالشام، وعن أبي صفوان العابد الشامي الذي كان بمكة، قولهم في الطمع والرجاء والمحبة التي لا تترك للقلب راحة إلا الاتصال بالله."
  en: "al-Qasim ibn Muhammad ibn Salama al-Sufi, a guardian of himself who spoke by the rules of monastic discipline; he relates from a monk in a church in Syria that the aim of lovers is to reach their wills and the aim of the fearful is to reach safety from fear, and from Abu Safwan the Syrian worshipper at Mecca a conversation about a worker who strove for greed and hope, and about love that leaves the heart no rest but union with God."
  ur: "قاسم بن محمد بن سلمہ صوفی اپنے نفس کی حفاظت کرنے والے اور راہبانہ اصولوں کے مطابق بات کرنے والے تھے۔ انہوں نے شام کے ایک گرجا کے راہب سے نقل کیا کہ محبت کرنے والوں کی ہمت اپنی مراد تک پہنچنا ہے اور ڈرنے والوں کی ہمت خوف سے امن تک پہنچنا ہے، اور ابو صفوان شامی عابد سے نقل کیا جو مکہ میں تھے، کہ عبادت کرنے والے کی راہ میں طمع اور امید کام کرتی ہے، اور جب محبت دل پر غالب آتی ہے تو اللہ سے اتصال کے سوا کوئی راحت باقی نہیں رہتی۔"
