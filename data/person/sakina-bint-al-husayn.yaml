summary:
  ar: "من أعلم النساء وأظرفهن في العصر الأموي، وكان الشعراء يجتمعون عندها. يذكر الكتاب أن جرير والفرزدق وكثير عزة وجميل بثينة أنشدوا بين يديها، فنقدت شعر كل منهم وأجازت كلاً منهم بألف دينار {cite:umayyad-birth-to-fall-2006 p. 144}. وتزوجها مصعب بن الزبير مع عائشة بنت طلحة، وأمهر كلاً منهما مليون درهم حسب الكتاب {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
