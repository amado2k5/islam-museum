id: person/sakina-bint-al-husayn
class: person
label: { ar: "سكينة بنت الحسين" }
gender: female
summary:
  ar: "من أعلم النساء وأظرفهن في العصر الأموي، وكان الشعراء يجتمعون عندها. يذكر الكتاب أن جرير والفرزدق وكثير عزة وجميل بثينة أنشدوا بين يديها، فنقدت شعر كل منهم وأجازت كلاً منهم بألف دينار {cite:umayyad-birth-to-fall-2006 p. 144}. وتزوجها مصعب بن الزبير مع عائشة بنت طلحة، وأمهر كلاً منهما مليون درهم حسب الكتاب {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
  tr: "Emevi döneminin en bilgili ve zarif kadınlarından biri olan Jamir, şairler onunla birlikte toplanırdı. Kitapta Jarir, Al-Farazdaq, Kathir Azza ve Jamil Buthayna'nın onun önünde performans sergilediği belirtilir; Jamil Buthayna'nın her bir şiirini eleştirip her birine bin dinar verdi {cite:umayyad-birth-to-fall-2006, s. 144}. Mus'ab ibn al-Zubayr onu Aisha bint Talha ile evlendirdi ve her biri kitaba göre bir milyon dirhem aldı {cite:umayyad-birth-to-fall-2006 s. 144} {cite:umayyad-birth-to-fall-2006, s. 145}."
  id: "Salah satu wanita paling berpengetahuan dan anggun di era Umayyah, para penyair sering berkumpul bersamanya. Buku tersebut menyebutkan bahwa Jarir, Al-Farazdaq, Kathir Azza, dan Jamil Buthayna tampil di hadapannya, dan ia mengkritik masing-masing puisi mereka serta memberikan seribu dinar {cite:umayyad-birth-to-fall-2006, hlm. 144}. Mus'ab ibn al-Zubayr menikahkannya dengan Aisha bint Talha, dan masing-masing dari mereka menerima satu juta dirham menurut buku {cite:umayyad-birth-to-fall-2006 hlm. 144} {cite:umayyad-birth-to-fall-2006, hlm. 145}."
