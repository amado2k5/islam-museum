  ar: "مدونة جمال ومؤلفة بريطانية صومالية معروفة على إنستغرام باسم @hanihanns. بنت جمهورها بالمكياج وتنسيق الموضة المحتشمة للنساء المحجبات، ودرست الإعلان والعلاقات العامة في الجامعة، ونشرت كتابها الأول «إنستا-غلام» (Insta-glam) عن دار أوكتوبوس التابعة لهاشيت، ومقابلة مجلة «ستايلست» معها عند صدوره تصفها بأنها في الثانية والعشرين."
  en: "British-Somali beauty blogger and author known on Instagram as @hanihanns. She built her following with makeup and modest-fashion styling for hijab-wearing women, studied advertising and public relations at university, and published her first book, Insta-glam, with Hachette's Octopus imprint; Stylist magazine's interview at its release gives her age as 22."
  ur: "برطانوی صومالی بیوٹی بلاگر اور مصنفہ، جو انسٹاگرام پر @hanihanns کے نام سے معروف ہیں۔ انہوں نے میک اپ اور حجاب پہننے والی خواتین کے لیے مودسٹ فیشن اسٹائلنگ سے اپنا حلقہ بنایا، یونیورسٹی میں ایڈورٹائزنگ اور پبلک ریلیشنز پڑھا، اور اپنی پہلی کتاب «انسٹا-گلیم» (Insta-glam) ہاشیٹ کے اوکٹوپس امپرنٹ سے شائع کی؛ اس کی اشاعت کے وقت «اسٹائلسٹ» میگزین کے انٹرویو میں ان کی عمر 22 برس بتائی گئی۔"
