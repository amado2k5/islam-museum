summary:
  ar: "مدونة جمال ومؤلفة بريطانية صومالية معروفة على إنستغرام باسم @hanihanns. بنت جمهورها بالمكياج وتنسيق الموضة المحتشمة للنساء المحجبات، ودرست الإعلان والعلاقات العامة في الجامعة، ونشرت كتابها الأول «إنستا-غلام» (Insta-glam) عن دار أوكتوبوس التابعة لهاشيت، ومقابلة مجلة «ستايلست» معها عند صدوره تصفها بأنها في الثانية والعشرين."
  en: "British-Somali beauty blogger and author known on Instagram as @hanihanns. She built her following with makeup and modest-fashion styling for hijab-wearing women, studied advertising and public relations at university, and published her first book, Insta-glam, with Hachette's Octopus imprint; Stylist magazine's interview at its release gives her age as 22."
  ur: "برطانوی صومالی بیوٹی بلاگر اور مصنفہ، جو انسٹاگرام پر @hanihanns کے نام سے معروف ہیں۔ انہوں نے میک اپ اور حجاب پہننے والی خواتین کے لیے مودسٹ فیشن اسٹائلنگ سے اپنا حلقہ بنایا، یونیورسٹی میں ایڈورٹائزنگ اور پبلک ریلیشنز پڑھا، اور اپنی پہلی کتاب «انسٹا-گلیم» (Insta-glam) ہاشیٹ کے اوکٹوپس امپرنٹ سے شائع کی؛ اس کی اشاعت کے وقت «اسٹائلسٹ» میگزین کے انٹرویو میں ان کی عمر 22 برس بتائی گئی۔"
  es: "Bloguera de belleza y autora británico-somalí conocida en Instagram como @hanihanns. Se dio a conocer gracias a sus consejos de maquillaje y moda modesta para mujeres que usan hiyab, estudió publicidad y relaciones públicas en la universidad y publicó su primer libro, Insta-glam, con el sello Octopus de Hachette; en la entrevista que le hizo la revista Stylist con motivo de su lanzamiento, afirma que tiene 22 años."
  fr: "Blogueuse beauté et auteure britannico-somalienne connue sur Instagram sous le nom de @hanihanns. Elle a bâti sa communauté grâce à ses conseils en maquillage et mode pudique pour les femmes portant le hijab. Après des études de publicité et de relations publiques à l'université, elle a publié son premier livre, Insta-glam, aux éditions Octopus (Hachette). L'interview accordée au magazine Stylist lors de sa sortie indique qu'elle a 22 ans."
  tr: "Instagram'da @hanihanns olarak bilinen İngiliz Somalili güzellik blog yazarı ve yazar. Makyaj ve peçeli kadınlar için mütevazı moda koordinasyonu ile kitlesini oluşturdu, üniversitede reklamcılık ve halkla ilişkiler okudu, ilk kitabı Insta-Glam'ı Hachette ile bağlantılı yayınevi Octopus aracılığıyla yayımladı ve Stylist dergisinin yayımlandığı dönemde kendisini yirmi iki yaşında olarak tanımladı."
  id: "Seorang blogger kecantikan dan penulis asal Somalia asal Inggris yang dikenal di Instagram sebagai @hanihanns. Ia membangun audiensnya dengan riasan dan mengoordinasikan mode sopan untuk wanita berjilbab, belajar periklanan dan hubungan masyarakat di universitas, menerbitkan buku pertamanya, Insta-Glam, melalui Octopus, penerbit yang berafiliasi dengan Hachette, dan diwawancarai oleh majalah Stylist saat dirilis, menggambarkan dirinya sebagai dua puluh dua tahun."
