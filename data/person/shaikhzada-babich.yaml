summary:
  ar: "شاعر باشكيري (1895–1919)، يُعد من كلاسيكيي الأدب القومي الباشكيري. وُلد في أسيانوفو ابنًا لملّا المحلّة ومدير مدرستها، وتشكّل في مدرسة غاليّة بأوفا، ونشط في الحركة الوطنية الباشكيرية سكرتيرا للشورى المركزية ورئيسا لاتحاد الشباب «تولقن» ومراسلا حربيا، وقُتل على يد جندي من الجيش الأحمر سنة 1919 وهو في الرابعة والعشرين."
  en: "Bashkir poet (1895–1919), a classic author of Bashkir national literature. Born at Asyanovo, son of the mahalla mullah who directed its madrasa, and formed at the Ğəliyə madrasa in Ufa, he was active in the Bashkir national movement as secretary of the Central Shuro, head of the Tulqın youth union and a war correspondent, and was murdered by a Red Army soldier in 1919, aged twenty-four."
  ur: "باشقیر شاعر (1895–1919)، باشقیر قومی ادب کے کلاسیکی مصنفین میں شمار ہوتے ہیں۔ اسیانوو میں محلّے کے ملا اور اس کے مدرسے کے نگران کے گھر پیدا ہوئے، اوفا کے غالیہ مدرسے میں تربیت پائی، باشقیر قومی تحریک میں مرکزی شورا کے سیکریٹری، «تولقن» نوجوانان یونین کے سربراہ اور جنگی نمائندے رہے، اور 1919 میں چوبیس برس کی عمر میں لال فوج کے سپاہی کے ہاتھوں قتل ہوئے۔"
