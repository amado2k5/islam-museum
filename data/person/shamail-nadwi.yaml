summary:
  ar: "عالم إسلامي هندي ومفتٍ ومؤلف، وُلد في سري نكر سنة 1998 ونشأ في كلكتا، وتخرج في دار العلوم لندوة العلماء لكناو. أسس «مركز الوحيين» للتعليم عبر الإنترنت سنة 2021 و«مؤسسة الوحيين» سنة 2024، وذاع صيته عالميا بمناظرته الأكاديمية مع الشاعر جاويد أختر حول وجود الله في نيودلهي سنة 2025."
  en: "Indian Islamic scholar, mufti and author, born in Srinagar in 1998 and raised in Kolkata, and a graduate of Darul Uloom Nadwatul Ulama in Lucknow. He founded the online Markaz al-Wahyain in 2021 and the Wahyain Foundation in 2024, and became widely known for his 2025 academic debate on the existence of God with the poet Javed Akhtar in New Delhi."
  ur: "ہندوستانی اسلامی عالم، مفتی اور مصنف، جو 1998 میں سری نگر میں پیدا ہوئے اور کلکتہ میں پروان چڑھے، اور دارالعلوم ندوۃ العلماء لکھنؤ کے فارغ التحصیل ہیں۔ انہوں نے 2021 میں آن لائن «مرکز الوحیین» اور 2024 میں «وحیین فاؤنڈیشن» قائم کی، اور 2025 میں نئی دہلی میں شاعر جاوید اختر کے ساتھ خدا کے وجود پر اپنے علمی مباحثے سے عالمی شہرت پائی۔"
  es: "Erudito islámico indio, muftí y autor, nacido en Srinagar en 1998 y criado en Calcuta, se graduó en Darul Uloom Nadwatul Ulama en Lucknow. Fundó el Markaz al-Wahyain en línea en 2021 y la Fundación Wahyain en 2024, y se hizo ampliamente conocido por su debate académico sobre la existencia de Dios con el poeta Javed Akhtar en Nueva Delhi en 2025."
  fr: "Érudit islamique indien, mufti et auteur, né à Srinagar en 1998 et ayant grandi à Calcutta, il est diplômé de Darul Uloom Nadwatul Ulama à Lucknow. Il a fondé le Markaz al-Wahyain en ligne en 2021 et la Fondation Wahyain en 2024, et s'est fait connaître grâce à son débat académique sur l'existence de Dieu avec le poète Javed Akhtar à New Delhi en 2025."
  tr: "Hintli bir İslam alimi, müftü (müfti âlim) ve yazar; 1998'de Sri Nakar'da doğmuş, Kolkata'da büyümüş ve Lucknow'daki Scholars Forum'dan Darul Uloom'dan mezun olmuştur. 2021'de çevrimiçi eğitim için 'Al-Wahyayin Merkezi'ni ve 2024'te 'Al-Wahyayin Vakfı'nı kurmuş, 2025'te şair Javed Akhtar ile Yeni Delhi'de Tanrı'nın varlığı üzerine yaptığı akademik tartışma sayesinde dünya çapında ün kazanmıştır."
  id: "Seorang ulama Islam, mufti (ulama mufti), dan penulis, lahir di Sri Nakar pada tahun 1998, dibesarkan di Kolkata, dan lulus dari Darul Uloom dari Scholars Forum di Lucknow. Ia mendirikan 'Al-Wahyayin Center' untuk pendidikan daring pada tahun 2021 dan 'Al-Wahyayin Foundation' pada tahun 2024, serta meraih ketenaran dunia melalui debat akademisnya dengan penyair Javed Akhtar tentang keberadaan Tuhan di New Delhi pada tahun 2025."
