summary:
  ar: "عالم إسلامي هندي ومفتٍ ومؤلف، وُلد في سري نكر سنة 1998 ونشأ في كلكتا، وتخرج في دار العلوم لندوة العلماء لكناو. أسس «مركز الوحيين» للتعليم عبر الإنترنت سنة 2021 و«مؤسسة الوحيين» سنة 2024، وذاع صيته عالميا بمناظرته الأكاديمية مع الشاعر جاويد أختر حول وجود الله في نيودلهي سنة 2025."
  en: "Indian Islamic scholar, mufti and author, born in Srinagar in 1998 and raised in Kolkata, and a graduate of Darul Uloom Nadwatul Ulama in Lucknow. He founded the online Markaz al-Wahyain in 2021 and the Wahyain Foundation in 2024, and became widely known for his 2025 academic debate on the existence of God with the poet Javed Akhtar in New Delhi."
  ur: "ہندوستانی اسلامی عالم، مفتی اور مصنف، جو 1998 میں سری نگر میں پیدا ہوئے اور کلکتہ میں پروان چڑھے، اور دارالعلوم ندوۃ العلماء لکھنؤ کے فارغ التحصیل ہیں۔ انہوں نے 2021 میں آن لائن «مرکز الوحیین» اور 2024 میں «وحیین فاؤنڈیشن» قائم کی، اور 2025 میں نئی دہلی میں شاعر جاوید اختر کے ساتھ خدا کے وجود پر اپنے علمی مباحثے سے عالمی شہرت پائی۔"
