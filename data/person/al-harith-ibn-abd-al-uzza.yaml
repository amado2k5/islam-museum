summary:
  ar: السعدي من هوازن، زوج حليمة السعدية مرضعة النبي ويُكنى أبا ذؤيب؛ روى ابن إسحاق أنه أسلم بعدما أنكر قول ابنه من الرضاعة في البعث، وفي وقت إسلامه وفي نسبة الخبر إليه أو إلى ولده خلاف.
  en: Of the Banu Sa'd of Hawazin, husband of Halima, the Prophet's wet-nurse, with the kunya Abu Dhu'ayb. Ibn Ishaq reports that he accepted Islam after hearing of his foster-son's teaching on resurrection; the time of his conversion and whether
    the story belongs to him or to his child are disputed.
