summary:
  ar: "الخادم المخدوم، لقب لشخص لم يُذكر اسمه في الخبر. روى آدم بن أبي إياس أن شابًا كان يكتب عنه سرق منه دفترًا ثم عاد به وعليه ثياب رثة، فلما أحسن إليه ورُدّت دراهمه، أخذ بيده إلى البحر فغرف منه ماء فإذا هو أحلى من العسل، ثم قال: من كان في خدمة من هذه قدرته فأي شيء يصنع بدراهمك؟ ثم غاب."
  en: "al-Khadim al-Makhdum, an epithet for a person whose name the report does not give. Adam ibn Abi Iyas relates that a young man who copied from him took a notebook and copied it, and when he returned it in tattered clothes, he was given kindness and money, which he refused; he took the narrator by the hand to the sea, scooped water in a cup, and said: drink; it was sweeter than honey; then he said: one who serves One of such power, what does he do with your dirhams? Then he disappeared."
  ur: "خادم مخدوم، ایک ایسے شخص کا لقب جس کا نام روایت میں نہیں دیا گیا۔ آدم بن ابی ایاس نقل کرتے ہیں کہ ایک نوجوان جو ان سے لکھتا تھا، ان کی کتاب لے کر اسے نقل کرنے لگا؛ جب وہ پھٹے پرانے کپڑوں میں لوٹا تو اس سے نرمی کی گئی اور اسے دراہم دیے گئے مگر اس نے نہ لیے۔ پھر وہ ہاتھ پکڑ کر سمندر کی طرف لے گیا، ایک پیالے میں پانی بھرا اور کہا: پیو۔ وہ شہد سے زیادہ میٹھا تھا۔ پھر کہا: جو ایسی قدرت والے کی خدمت میں ہو، وہ تمہارے دراہم کا کیا کرے گا؟ پھر وہ غائب ہو گیا۔"
