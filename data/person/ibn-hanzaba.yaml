label: { ar: "ابن حنزابة", en: "Ibn Hanzaba", es: "Ibn Hanzaba", fr: "Ibn Hanzaba", ur: "ابن حنظبہ" }
summary:
  ar: "أبو الفضل جعفر بن الفضل بن جعفر بن محمد بن موسى بن الحسن بن الفرات المعروف بابن حنزابة؛ كان وزير بني الإخشيد بمصر مدة إمارة كافور؛ ولما توفي كافور استقل بالوزارة وتدبير المملكة لأحمد بن علي بن الإخشيد بالديار المصرية والشامية وقبض على جماعة من أرباب الدولة وصادرهم ومنهم يعقوب بن كلس وزير العزيز العبيدي؛ ثم اضطرب عليه الأمر فاستتر مرتين ونُهبت دوره إلى أن قُبض عليه في عهد أبي الحسن بن عبيد الله بن طغج صاحب الرملة {cite:wafayat-ayan}."
  en: "Abu al-Fadl Ja'far b. al-Fadl, 'Ibn Hanzaba' — last great vizier of the Ikhshidids; governed for Kafur then Ahmad b. Ali, confiscating the estates of rivals including the future Fatimid vizier Ya'qub b. Killis, until the regime collapsed around him {cite:wafayat-ayan}."
  es: "Abu al-Fadl Ja'far b. al-Fadl, 'Ibn Hanzaba' — último gran visir de los Ikhshidids; gobernó para Kafur y luego para Ahmad b. Ali, confiscando las propiedades de rivales, incluido el futuro visir fatimí Ya'qub b. Killis, hasta que el régimen se derrumbó a su alrededor {cite:wafayat-ayan}."
  fr: "Abu al-Fadl Ja'far b. al-Fadl, 'Ibn Hanzaba' — dernier grand vizir des Ikhshidides; gouverna pour Kafur puis Ahmad b. Ali, confisquant les domaines de ses rivaux, y compris le futur vizir fatimide Ya'qub b. Killis, jusqu'à ce que le régime s'effondre autour de lui {cite:wafayat-ayan}."
  ur: "ابو الفضل جعفر ب۔ الفضل، 'ابن حنظبہ' - اخشیدوں کے آخری عظیم وزیر؛ کافور کے لیے حکومت کی پھر احمد بن۔ علی، مستقبل کے فاطمی وزیر یعقوب بن سمیت حریفوں کی جائیدادیں ضبط کر رہا ہے۔ کلیس، یہاں تک کہ اس کے ارد گرد حکومت کا خاتمہ ہو گیا۔"
  tr: "Ebu el-Fadl Cafer ibn el-Fadl ibn Ca'far ibn Muhammed ibn Musa ibn el-Hasan ibn el-Furat, İbn Hanzaba olarak bilinir, Kafur emirliği döneminde Mısır'da Banu el-İhşid'in bakanıydı. Kafur öldüğünde, Mısır ve Suriye topraklarında Ahmed ibn Ali ibn el-İhşid için krallığın bakanlığı ve yönetiminde bağımsız oldu. Aralarında el-Aziz el-Ubaydi'nin bakanı Ya'qub ibn Kils de dahil olmak üzere bir grup devlet lordunu tutuklayıp el koydu. Sonra durum huzursuzlaştı, bu yüzden iki kez saklandı ve rolü yağmalandı; ta ki Ramla hükümdarı Ebu el-Hasan bin Ubeyd Allah ibn Tuğac döneminde yakalanana kadar."
  id: "Abu al-Fadl Ja'far ibn al-Fadl ibn Ja'far ibn Muhammad ibn Musa ibn al-Hasan ibn al-Furat, yang dikenal sebagai Ibn Hanzaba, adalah menteri Banu al-Ikhshid di Mesir selama masa Emirat Kafur. Ketika Kafur wafat, ia menjadi independen dalam pemerintahan dan administrasi kerajaan untuk Ahmad ibn Ali ibn al-Ikhshid di tanah Mesir dan Suriah. Ia menangkap dan menyita sekelompok penguasa negara, termasuk Ya'qub ibn Kils, menteri al-Aziz al-Ubaydi. Kemudian situasi menjadi tidak stabil, sehingga ia bersembunyi dua kali dan perannya dijarah hingga ia ditangkap pada masa pemerintahan Abu al-Hasan ibn Ubayd Allah ibn Tughaj, penguasa Ramla {cite:wafayat-ayan}."
