summary:
  ar: "أبو الفضل جعفر بن الفضل بن جعفر بن محمد بن موسى بن الحسن بن الفرات المعروف بابن حنزابة؛ كان وزير بني الإخشيد بمصر مدة إمارة كافور؛ ولما توفي كافور استقل بالوزارة وتدبير المملكة لأحمد بن علي بن الإخشيد بالديار المصرية والشامية وقبض على جماعة من أرباب الدولة وصادرهم ومنهم يعقوب بن كلس وزير العزيز العبيدي؛ ثم اضطرب عليه الأمر فاستتر مرتين ونُهبت دوره إلى أن قُبض عليه في عهد أبي الحسن بن عبيد الله بن طغج صاحب الرملة {cite:wafayat-ayan}."
  en: "Abu al-Fadl Ja'far b. al-Fadl, 'Ibn Hanzaba' — last great vizier of the Ikhshidids; governed for Kafur then Ahmad b. Ali, confiscating the estates of rivals including the future Fatimid vizier Ya'qub b. Killis, until the regime collapsed around him {cite:wafayat-ayan}."
