summary:
  ar: "محمد بن شجاع الثلجي، أبو عبد الله، البغدادي الحنفي، من أصحاب الحسن بن زياد، فقيه أهل العراق في وقته، ومن المقدمين في الفقه والحديث وقراءة القرآن. توفي سنة 266 هـ بحسب ما ذكره الكتاب، وله ميل إلى مذهب المعتزلة. من تصانيفه «المناسك»، و«تصحيح الآثار»، و«النوادر»، وكتاب «المضاربة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  en: "Muhammad ibn Shuja al-Thalji, Abu Abd Allah, a Baghdadi Hanafi, a companion of al-Hasan ibn Ziyad, the leading jurist of Iraq in his time and eminent in law, hadith and Qur'anic recitation. The book gives 266 AH as his death year. It notes a leaning towards Mu'tazilite views. His works include al-Manasik, Tashih al-athar, al-Nawadir and a book on partnership in trade (mudaraba). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
