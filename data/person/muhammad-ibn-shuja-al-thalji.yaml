  en: "Muhammad ibn Shuja al-Thalji"
  es: "Muhammad ibn Shuja al-Thalji"
  fr: "Muhammad ibn Shuja al-Thalji"
  ur: "محمد بن شجاع التھلجی"
summary:
  ar: "محمد بن شجاع الثلجي، أبو عبد الله، البغدادي الحنفي، من أصحاب الحسن بن زياد، فقيه أهل العراق في وقته، ومن المقدمين في الفقه والحديث وقراءة القرآن. توفي سنة 266 هـ بحسب ما ذكره الكتاب، وله ميل إلى مذهب المعتزلة. من تصانيفه «المناسك»، و«تصحيح الآثار»، و«النوادر»، وكتاب «المضاربة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  en: "Muhammad ibn Shuja al-Thalji, Abu Abd Allah, a Baghdadi Hanafi, a companion of al-Hasan ibn Ziyad, the leading jurist of Iraq in his time and eminent in law, hadith and Qur'anic recitation. The book gives 266 AH as his death year. It notes a leaning towards Mu'tazilite views. His works include al-Manasik, Tashih al-athar, al-Nawadir and a book on partnership in trade (mudaraba). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  es: "Muhammad ibn Shuja al-Thalji, Abu Abd Allah, un hanafí bagdadí, compañero de al-Hasan ibn Ziyad, el jurista más destacado de Irak en su época y eminente en derecho, hadices y recitación coránica. El libro indica el año 266 de la Hégira como su año de fallecimiento. Señala una inclinación hacia las ideas mutazilíes. Entre sus obras se incluyen al-Manasik, Tashih al-athar, al-Nawadir y un libro sobre la sociedad en el comercio (mudaraba). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  fr: "Muhammad ibn Shuja al-Thalji, Abu Abd Allah, hanafite bagdadien, compagnon d'al-Hasan ibn Ziyad, éminent juriste irakien de son temps, reconnu pour son expertise en droit, en hadith et en récitation coranique. L'ouvrage indique l'année 266 de l'Hégire comme année de son décès. Il mentionne une affinité pour les idées mu'tazilites. Parmi ses œuvres figurent al-Manasik, Tashih al-athar, al-Nawadir et un ouvrage sur le partenariat commercial (mudaraba). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  ur: "محمد بن شجاع الثلجی، ابو عبد اللہ، بغدادی حنفی، الحسن ابن زیاد کے صحابی، اپنے زمانے میں عراق کے معروف فقیہ اور قانون، حدیث اور قرآنی قراء ت میں نامور۔ کتاب میں ان کی وفات کا سال 266ھ بتایا گیا ہے۔ یہ معتزلی نظریات کی طرف جھکاؤ کو نوٹ کرتا ہے۔ ان کے کاموں میں المناسک، تشیح الاطہر، النوادر اور تجارت میں شراکت پر ایک کتاب ⁦(مضاربہ)⁩ شامل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15418}"
  tr: "Muhammed bin Şuca'el-Talci, Ebu Abdullah, el-Bağdadi el-Hanafi, kendi döneminde Irak hukukçusu olan el-Hasan bin Ziyad'ın arkadaşıydı ve fıkıh, hadis ve Kur'an okumalarında öncüydü. Kitaba göre 266 Hicri yılında vefat etti ve Mu'tazili mezhebine yöneldi. Eserleri arasında 'El-Manasik', 'Tasih al-Athar', 'Al-Nawadir' ve 'Al-Mudaraba' kitabı bulunmaktadır. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15418}"
  id: "Muhammad ibn Shuja' al-Thalji, Abu Abdullah, al-Baghdadi al-Hanafi, adalah sahabat al-Hasan ibn Ziyad, seorang ahli hukum Irak pada masanya, dan pelopor dalam bidang fiqh, hadis, dan pembacaan Al-Qur'an. Ia meninggal pada tahun 266 H menurut kitab tersebut, dan ia condong ke aliran Mu'tazilite. Di antara karya-karyanya adalah 'Al-Manasik', 'Tasih al-Athar', 'Al-Nawadir', dan buku 'Al-Mudaraba'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15418}"
