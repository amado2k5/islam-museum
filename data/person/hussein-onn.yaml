summary:
  ar: "سياسي ماليزي، وُلد في جوهور بهرو سنة 1922 ابنًا لعون جعفر مؤسس أمنو. بعد خدمة عسكرية في الجيش الهندي البريطاني ومسيرة قانونية في لندن وكوالالمبور، صعد في أمنو فصار نائب رئيس الوزراء سنة 1973 ثم ثالث رئيس وزراء سنة 1976، وواصل السياسة الاقتصادية الجديدة حتى أجبره اعتلال صحته على التقاعد سنة 1981؛ وتوفي في سان ماتيو بكاليفورنيا سنة 1990."
  en: "Malaysian statesman, born at Johor Bahru in 1922, the son of UMNO's founder Onn Jaafar. After a military commission in the British Indian Army and a legal career in London and Kuala Lumpur, he rose through UMNO to become deputy prime minister in 1973 and third prime minister in 1976, continuing the New Economic Policy until ill health forced his retirement in 1981; he died at San Mateo, California, in 1990."
  ur: "ملائیشیائی سیاست دان، جو 1922ء میں جوہر بہرو میں امنو کے بانی عون جعفر کے بیٹے پیدا ہوئے۔ برطانوی ہندی فوج میں عسکری خدمات اور لندن و کوالالمپور میں قانونی پیشے کے بعد وہ امنو میں ترقی پا کر 1973ء میں نائب وزیرِ اعظم اور 1976ء میں تیسرے وزیرِ اعظم بنے اور نئی اقتصادی پالیسی جاری رکھی، حتیٰ کہ خرابیِ صحت نے 1981ء میں انھیں سبکدوشی پر مجبور کر دیا؛ 1990ء میں سان ماتیو، کیلیفورنیا میں وفات پائی۔"
