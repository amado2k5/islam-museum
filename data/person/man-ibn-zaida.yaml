label: { ar: "معن بن زائدة الشيباني", en: "Ma'n ibn Za'ida al-Shaybani", es: "Ma'n ibn Za'ida al-Shaybani", fr: "Ma'n ibn Za'ida al-Shaybani", ur: "معن ابن زیدہ الشیبانی" }
summary:
  ar: "معن بن زائدة الشيباني؛ ولاه المنصور سجستان فطالب رتبيل بأتاوة الحجاج فبعث بإبل وقباب تركية ورقيق مضاعفاً فغضب وقصد الرخج ففتح زابلستان وسبى زهاء ثلاثين ألفاً وفي رواية فرج الرخجي أنه وضع السيف في السبي لغبار حمير وحشية ظنه جيشاً ثم خاف الشتاء فانصرف إلى بست فاندس في بنائه خوارج فقتلوه وهو يحتجم فقتلهم يزيد بن مزيد كلهم. وعند المسعودي قتله أهل اليمن تعصباً لقومه من ربيعة وغيرها من نزار وقطع الحلف الذي كان بين اليمن وربيعة في القدم {cite:muruj-al-dhahab p. 220}، وعند المسعودي كان مستتراً حتى كان يوم الهاشمية فحضر معتماً متلثماً فلما وثب أهل خراسان على المنصور ضربهم بالسيف دونه ثم حسر عن وجهه وقال أنا طلبتك يا أمير المؤمنين معن بن زائدة فآمنه وحباه، وأعطى مروان بن أبي حفصة مائة ألف درهم على قوله ما زلت يوم الهاشمية معلناً بالسيف دون خليفة الرحمن {cite:muruj-al-dhahab p. 275-276}"
  en: "Ma'n ibn Za'ida al-Shaybani; al-Mansur's governor of Sijistan — angered by Rutbil's doubled gift-tribute he took Zabulistan with near thirty thousand captives, and in Faraj al-Rukhkhaji's telling put the sword to them over wild-ass dust mistaken for an army; winter drove him to Bust where Kharijites hidden among his builders killed him under the cupping-horn — Yazid ibn Mazyad slew them all."
  es: "Ma'n ibn Za'ida al-Shaybani, gobernador de Sijistan por al-Mansur, enfurecido por el doble tributo que Rutbil le ofreció, tomó Zabulistán con cerca de treinta mil cautivos y, según cuenta Faraj al-Rukhkhaji, los aniquiló sobre una nube de polvo salvaje confundiéndola con un ejército. El invierno lo obligó a huir a Bust, donde los jariyitas, escondidos entre sus constructores, lo mataron bajo el cuerno de ventosa. Yazid ibn Mazyad los mató a todos."
  fr: "Ma'n ibn Za'ida al-Shaybani; gouverneur d'al-Mansur du Sijistan — furieux du double tribut-don de Rutbil, il prit le Zabulistan avec près de trente mille captifs, et selon le récit de Faraj al-Rukhkhaji, il les passa au fil de l'épée au-dessus d'une poussière d'âne sauvage prise pour une armée; l'hiver le poussa à Bust où des Kharijites cachés parmi ses bâtisseurs le tuèrent sous la corne de coupe — Yazid ibn Mazyad les tua tous."
  ur: "معن ابن زیدہ الشیبانی؛ المنصور کا گورنر سجستان — رتبیل کے دگنے تحفے سے ناراض ہو کر اس نے تقریباً تیس ہزار اسیروں کے ساتھ زابلستان لے لیا، اور فراج الرخاجی کے کہنے میں تلوار ان کے اوپر جنگلی گدھے کی دھول پر رکھ دی جس کو فوج سمجھا جاتا تھا۔ سردیوں نے اسے بوست تک پہنچا دیا جہاں اس کے معماروں میں چھپے خوارج نے اسے سنگی سینگ کے نیچے مار ڈالا - یزید بن مازیاد نے ان سب کو قتل کردیا۔"
