id: person/man-ibn-zaida
class: person
label: { ar: "معن بن زائدة الشيباني", en: "Ma'n ibn Za'ida al-Shaybani" }
summary:
  ar: "معن بن زائدة الشيباني؛ ولاه المنصور سجستان فطالب رتبيل بأتاوة الحجاج فبعث بإبل وقباب تركية ورقيق مضاعفاً فغضب وقصد الرخج ففتح زابلستان وسبى زهاء ثلاثين ألفاً وفي رواية فرج الرخجي أنه وضع السيف في السبي لغبار حمير وحشية ظنه جيشاً ثم خاف الشتاء فانصرف إلى بست فاندس في بنائه خوارج فقتلوه وهو يحتجم فقتلهم يزيد بن مزيد كلهم.، وعند المسعودي قتله أهل اليمن تعصباً لقومه من ربيعة وغيرها من نزار وقطع الحلف الذي كان بين اليمن وربيعة في القدم {cite:muruj-al-dhahab p. 220}، وعند المسعودي كان مستتراً حتى كان يوم الهاشمية فحضر معتماً متلثماً فلما وثب أهل خراسان على المنصور ضربهم بالسيف دونه ثم حسر عن وجهه وقال أنا طلبتك يا أمير المؤمنين معن بن زائدة فآمنه وحباه، وأعطى مروان بن أبي حفصة مائة ألف درهم على قوله ما زلت يوم الهاشمية معلناً بالسيف دون خليفة الرحمن {cite:muruj-al-dhahab p. 275-276}"
  en: "Ma'n ibn Za'ida al-Shaybani; al-Mansur's governor of Sijistan — angered by Rutbil's doubled gift-tribute he took Zabulistan with near thirty thousand captives, and in Faraj al-Rukhkhaji's telling put the sword to them over wild-ass dust mistaken for an army; winter drove him to Bust where Kharijites hidden among his builders killed him under the cupping-horn — Yazid ibn Mazyad slew them all."
