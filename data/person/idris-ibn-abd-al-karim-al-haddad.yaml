summary:
  ar: "أبو الحسن إدريس بن عبد الكريم الحداد، راوي قراءة خلف بن هشام واختياره؛ توفي سنة 292هـ عن ثلاث وتسعين سنة، وقال ابن الجزري إنه إمام ضابط متقن ثقة، ونقل عن الدارقطني أنه ثقة وفوق الثقة بدرجة {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  en: "Abu al-Hasan Idris ibn 'Abd al-Karim al-Haddad, transmitter of the reading and the own choice of Khalaf ibn Hisham; he died in 292 AH aged ninety-three. Ibn al-Jazari calls him an exact and careful imam, reliable, and quotes al-Daraqutni that he was reliable and a degree above reliable {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  ur: "ابو الحسن ادریس بن عبد الکریم حداد، خلف بن ہشام کی قراءت اور اختیار کے راوی؛ 292ھ میں تریانوے برس کی عمر میں فوت ہوئے۔ ابن الجزری انہیں ضابط، متقن، ثقہ امام کہتے ہیں اور دارقطنی سے نقل کرتے ہیں کہ وہ ثقہ بلکہ ثقہ سے ایک درجہ اوپر تھے {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  es: "Abu al-Hasan Idris ibn 'Abd al-Karim al-Haddad, transmisor de la lectura y elección personal de Khalaf ibn Hisham; murió en el año 292 de la Hégira a la edad de noventa y tres años. Ibn al-Jazari lo llama un imán exacto y cuidadoso, confiable, y cita a al-Daraqutni diciendo que era confiable y de un grado superior a la confiabilidad {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  fr: "Abu al-Hasan Idris ibn 'Abd al-Karim al-Haddad, transmetteur de la lecture et élu de Khalaf ibn Hisham, mourut en 292 AH à l'âge de quatre-vingt-treize ans. Ibn al-Jazari le décrit comme un imam précis et consciencieux, digne de confiance, et cite al-Daraqutni affirmant qu'il était d'une fiabilité exceptionnelle (voir: nashr-dahman-damascus-1345-v1 p. 177)."
  tr: "Ebu el-Hasan İdris ibn Abdülkerim el-Haddad, Halef bin Hişam'ın okuma ve seçiminin anlatıcısıdır; 292 Hicri yılında doksan üç yaşında vefat etti. İbn el-Cezari onun kesin, kesin ve güvenilir bir imam olduğunu söyledi. El-Daraqutni'yi güvenilir ve {kaynak:nashr-dahman-damascus-1345-v1, s. 177} rütbesinin üstünde olarak alıntıladı."
  id: "Abu al-Hasan Idris ibn Abd al-Karim al-Haddad, seorang narator pembacaan dan pemilihan Khalaf ibn Hisham; ia meninggal pada tahun 292 H pada usia sembilan puluh tiga tahun. Ibn al-Jazari mengatakan bahwa ia adalah imam yang tepat, tepat, dan dapat dipercaya. Ia mengutip al-Daraqutni sebagai yang dapat dipercaya dan di atas pangkat {cite:nashr-dahman-damascus-1345-v1, hlm. 177}."
