summary:
  ar: "أبو الحسن إدريس بن عبد الكريم الحداد، راوي قراءة خلف بن هشام واختياره؛ توفي سنة 292هـ عن ثلاث وتسعين سنة، وقال ابن الجزري إنه إمام ضابط متقن ثقة، ونقل عن الدارقطني أنه ثقة وفوق الثقة بدرجة {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  en: "Abu al-Hasan Idris ibn 'Abd al-Karim al-Haddad, transmitter of the reading and the own choice of Khalaf ibn Hisham; he died in 292 AH aged ninety-three. Ibn al-Jazari calls him an exact and careful imam, reliable, and quotes al-Daraqutni that he was reliable and a degree above reliable {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  ur: "ابو الحسن ادریس بن عبد الکریم حداد، خلف بن ہشام کی قراءت اور اختیار کے راوی؛ 292ھ میں تریانوے برس کی عمر میں فوت ہوئے۔ ابن الجزری انہیں ضابط، متقن، ثقہ امام کہتے ہیں اور دارقطنی سے نقل کرتے ہیں کہ وہ ثقہ بلکہ ثقہ سے ایک درجہ اوپر تھے {cite:nashr-dahman-damascus-1345-v1 p. 177}."
