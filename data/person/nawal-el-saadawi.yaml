summary:
  ar: "طبيبة وكاتبة ونسوية مصرية، وُلدت في كفر طحلة سنة 1931، وجمعت بين الطب والأدب في نحو أربعين كتابًا — منها «المرأة والجنس» و«امرأة عند نقطة الصفر» — واجهت فيها ختان الإناث والأبوية والاستبداد، وسُجنت في عهد السادات سنة 1981، وأسست جمعية تضامن المرأة العربية، وتوفيت في القاهرة سنة 2021."
  en: "Egyptian physician, psychiatrist and feminist writer, born at Kafr Tahla in 1931. In some forty books — among them Women and Sex and Woman at Point Zero — she confronted female genital mutilation, patriarchy and authoritarian rule; she was imprisoned under President Sadat in 1981, founded the Arab Women's Solidarity Association, and died in Cairo in 2021."
  ur: "مصری طبیبہ، ماہرِ نفسیات اور نسوانی مصنفہ، جو 1931 میں کفر طحلہ میں پیدا ہوئیں؛ «عورت اور جنس» اور «نقطۂ صفر پر عورت» سمیت تقریباً چالیس کتابوں میں نسوانی ختنہ، پدرانہ نظام اور آمریت پر تنقید کی، 1981 میں سادات دور میں قید ہوئیں، عرب خواتین یکجہتی ایسوسی ایشن کی بنیاد رکھی، اور 2021 میں قاہرہ میں وفات پائی۔"
