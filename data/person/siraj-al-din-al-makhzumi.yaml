summary:
  ar: "محمد بن عبد الله بن محمد المخزومي الرفاعي الحسيني، سراج الدين، وصفه الزركلي بأنه شيخ الإسلام في عصره، ولد بواسط ورحل إلى الشام ومصر وتوفي ببغداد، من كتبه صحاح الأخبار في نسب السادة الفاطمية، توفي سنة 885 هـ."
  en: "Muhammad ibn Abdallah ibn Muhammad al-Makhzumi al-Rifa'i al-Husayni, Siraj al-Din, called by al-Zirikli the shaykh al-Islam of his time; born in Wasit, he travelled to Syria and Egypt and died in Baghdad; author of Sihah al-Akhbar on the lineage of the Fatimid sayyids; died 885 AH (1480)."
