summary:
  ar: "عالم وسياسي باكستاني (1926–2003) من ميروت، ابن محمد عبد العليم صديقي وقائد الحركة البريلوية في باكستان. ترأس جمعية علماء باكستان، وشارك في تأسيس البعثة الإسلامية العالمية بمكة سنة 1972، وكان الرئيس التأسيسي لتحالف مجلس العمل الموحد سنة 2001، وجاب العالم داعية مع أبيه ثم وحده."
  en: "Pakistani scholar and politician (1926–2003) of Meerut, the son of Muhammad Abdul Aleem Siddiqi and the leader of the Barelvi movement in Pakistan. He presided over Jamiat Ulema-e-Pakistan, co-founded the World Islamic Mission at Mecca in 1972, and was the founding president of the Muttahida Majlis-e-Amal alliance in 2001, having travelled the world on preaching tours with his father and then alone."
  ur: "پاکستانی عالم اور سیاستدان (1926ء–2003ء) جن کا تعلق میرٹھ سے تھا، محمد عبد العلیم صدیقی کے صاحبزادے اور پاکستان میں بریلوی تحریک کے قائد۔ جمعیۃ علماء پاکستان کے صدر رہے، 1972ء میں مکہ میں عالمی اسلامی مشن کی تاسیس میں شریک ہوئے اور 2001ء میں متحدہ مجلسِ عمل کے بانی صدر بنے، اور اپنے والد کے ساتھ اور پھر تنہا دنیا بھر کے دعوتی دورے کیے۔"
