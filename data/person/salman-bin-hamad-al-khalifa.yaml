summary:
  ar: "حاكم البحرين من وفاة أبيه حمد بن عيسى سنة 1942 حتى وفاته سنة 1961. وُلد سنة 1894 وتربّى وليا للعهد في كنف أبيه، فخلفه وعمل عقدين على توسيع التعليم والرعاية الصحية حتى جعل العلاج مجانيا للمواطنين والزوار في آخر سني حكمه، وراجع بنفسه ميزانيات الدولة وعوائد النفط، وجمع التبرعات للاجئي فلسطين سنة 1948، وخلفه ابنه عيسى بن سلمان."
  en: "Hakim (ruler) of Bahrain from the death of his father Hamad bin Isa in 1942 until his own death in 1961. Born in 1894 and raised as heir under his father, he succeeded him and worked for two decades to expand education and health care — making treatment free to citizens and visitors in the last year of his rule — personally reviewed the state budgets and oil revenues, raised donations for Palestinian refugees in 1948, and was succeeded by his son Isa bin Salman."
  ur: "1942ء میں اپنے والد حمد بن عیسیٰ کی وفات سے 1961ء میں اپنی وفات تک بحرین کے حاکم۔ 1894ء میں پیدا ہوئے اور والد کی سرپرستی میں ولی عہد کے طور پر پرورش پائی؛ ان کے جانشین بنے اور دو دہائیوں تک تعلیم و صحت کو وسعت دی — اپنے دور کے آخری سال میں شہریوں اور زائرین کے لیے علاج مفت کر دیا — ذاتی طور پر ریاستی بجٹ اور تیل کی آمدنی کا جائزہ لیا، 1948ء میں فلسطینی پناہ گزینوں کے لیے عطیات جمع کیے، اور ان کے جانشین ان کے بیٹے عیسیٰ بن سلمان ہوئے۔"
