summary:
  ar: "أبو الخير خان، حاكم الأوزبك من نسل شيبان، أعلنه الأمراء خانًا في توران وهو في السابعة عشرة، وفتح خوارزم سنة 834هـ/1430م، واستولى على قلاع سيغناق وأركوك وسوزاك وأك قرغان وأوزكند على سيحون في عهد السلطان شاه رخ، وجعل سيغناق عاصمته. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  en: "Abu l-Khayr Khan, ruler of the Uzbeks and a descendant of Shayban, proclaimed khan in the territory of Tura at about seventeen, who conquered Khwarazm in 834/1430-1, and before the death of Shahrukh in 850/1447 took the Syr Darya fortresses of Sighnak, Arkuk, Suzak, Ak-Kurghan and Uzkand, making Sighnak his capital. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  ur: "ابو الخیر خان، شیبانی نسل کے ازبک حکمران، جنہیں تورا (سائبیریا) میں تقریباً سترہ سال کی عمر میں خان بنایا گیا، جنہوں نے 834ھ/1430ء میں خوارزم فتح کیا، اور شاہ رخ کی وفات (850ھ/1447ء) سے پہلے سیر دریا کے قلعے سیغناق، ارکوک، سوزاک، اک قرغان اور اوزکند لے کر سیغناق کو اپنا دارالحکومت بنایا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
