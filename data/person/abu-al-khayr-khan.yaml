  ar: "أبو الخير خان"
  en: "Abu l-Khayr Khan"
  ur: "ابوالخیر خان"
  fr: "Abu l-Khayr Khan"
  es: "Abu l-Khayr Khan"
summary:
  ar: "أبو الخير خان، حاكم الأوزبك من نسل شيبان، أعلنه الأمراء خانًا في توران وهو في السابعة عشرة، وفتح خوارزم سنة 834هـ/1430م، واستولى على قلاع سيغناق وأركوك وسوزاك وأك قرغان وأوزكند على سيحون في عهد السلطان شاه رخ، وجعل سيغناق عاصمته. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  en: "Abu l-Khayr Khan, ruler of the Uzbeks and a descendant of Shayban, proclaimed khan in the territory of Tura at about seventeen, who conquered Khwarazm in 834/1430-1, and before the death of Shahrukh in 850/1447 took the Syr Darya fortresses of Sighnak, Arkuk, Suzak, Ak-Kurghan and Uzkand, making Sighnak his capital. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  ur: "ابو الخیر خان، شیبانی نسل کے ازبک حکمران، جنہیں تورا ⁦(سائبیریا)⁩ میں تقریباً سترہ سال کی عمر میں خان بنایا گیا، جنہوں نے 834ھ/1430ء میں خوارزم فتح کیا، اور شاہ رخ کی وفات ⁦(850ھ/1447ء)⁩ سے پہلے سیر دریا کے قلعے سیغناق، ارکوک، سوزاک، اک قرغان اور اوزکند لے کر سیغناق کو اپنا دارالحکومت بنایا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  fr: "Abu l-Khayr Khan, souverain des Ouzbeks et descendant de Shayban, proclamé khan dans le territoire de Tura vers dix-sept ans, qui conquit le Khwarazm en 834/1430-1 et, avant la mort de Shahrukh en 850/1447, prit les forteresses du Syr-Daria de Sighnak, Arkuk, Suzak, Ak-Kurghan et Uzkand, faisant de Sighnak sa capitale. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  es: "Abu l-Khayr Khan, gobernante de los uzbekos y descendiente de Shayban, fue proclamado kan en el territorio de Tura a la edad de diecisiete años. Conquistó Corasmia en 834/1430-1 y, antes de la muerte de Shahrukh en 850/1447, tomó las fortalezas del Syr Darya de Sighnak, Arkuk, Suzak, Ak-Kurghan y Uzkand, estableciendo Sighnak como su capital. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  tr: "Şeyban hanedanından Özbek hükümdarı Ebu el-Hayr Han, on yedi yaşında Turan prensleri tarafından Han ilan edildi. Sultan Şah Rukh döneminde, Hicri 834/Miladi 1430 yılında Harezm'i fethetti ve Sir Darya üzerindeki Sighnaq, Arkok, Suzak, Akkargan ve Özkend kalelerini ele geçirerek Sighnaq'ı başkenti yaptı. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  id: "Abu al-Khayr Khan, penguasa Uzbekistan dari dinasti Shayban, dinobatkan sebagai Khan oleh para pangeran Turan pada usia tujuh belas tahun. Ia menaklukkan Khwarazm pada tahun 834 H/1430 M, merebut benteng-benteng Sighnaq, Arkok, Suzak, Akkargan, dan Uzkend di Sungai Syr Darya selama pemerintahan Sultan Shah Rukh, dan menjadikan Sighnaq sebagai ibu kotanya. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
