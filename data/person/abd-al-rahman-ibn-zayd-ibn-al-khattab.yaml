summary:
  ar: "عبد الرحمن بن زيد بن الخطاب بن نفيل العدوي القرشي، ابن أخي عمر بن الخطاب، وكان من أتم الرجال خلقة. أتى به أبو لبابة إلى النبي فحنّكه ومسح رأسه ودعا له بالبركة. روى الحديث عن أبيه وغيره، وروى عنه ابنه عبد الحميد وآخرون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Abd al-Rahman ibn Zayd ibn al-Khattab, nephew of Umar ibn al-Khattab and of unusually full build. Abu Lubaba brought him to the Prophet, who put a date on his palate, rubbed his head and prayed for his blessing. He narrated from his father and others, and his son Abd al-Hamid narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
