summary:
  ar: "عبد الرحمن بن زيد بن الخطاب بن نفيل العدوي القرشي، ابن أخي عمر بن الخطاب، وكان من أتم الرجال خلقة. أتى به أبو لبابة إلى النبي فحنّكه ومسح رأسه ودعا له بالبركة. روى الحديث عن أبيه وغيره، وروى عنه ابنه عبد الحميد وآخرون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Abd al-Rahman ibn Zayd ibn al-Khattab, nephew of Umar ibn al-Khattab and of unusually full build. Abu Lubaba brought him to the Prophet, who put a date on his palate, rubbed his head and prayed for his blessing. He narrated from his father and others, and his son Abd al-Hamid narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  fr: "Abd al-Rahman ibn Zayd ibn al-Khattab, neveu d'Umar ibn al-Khattab, d'une corpulence peu commune. Abu Lubaba l'amena au Prophète, qui lui frotta le palais d'une datte, lui caressa la tête et invoqua sur lui la bénédiction. Il transmit de son père et d'autres, et son fils Abd al-Hamid transmit de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  ur: "عبد الرحمٰن بن زید بن خطاب، عمر بن خطاب کے بھانجے، غیر معمولی جسم کے مالک؛ ابو لبابہ انہیں نبی کے پاس لائے۔"
  es: "Abd al-Rahman ibn Zayd ibn al-Khattab, sobrino de Umar ibn al-Khattab y de complexión inusualmente robusta. Abu Lubaba lo llevó ante el Profeta, quien le puso un dátil en el paladar, le frotó la cabeza y oró pidiendo su bendición. Narró de su padre y de otros, y su hijo Abd al-Hamid narró de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  tr: "Ömer ibn el-Hattab'ın yeğeni Abdülrahman ibn Zeyd ibn el-Hattab ibn Nufeyl el-Adavi el-Kureşi, fiziksel olarak en mükemmel erkeklerden biriydi. Ebu Lubaba onu Peygamber'e getirdi; Peygamber ona tahnik yaptı (yeni doğmuş bebeğin damağına hurma sürmek), başını okşadı ve ona salavat getirdi. Babasından ve başkalarından hadis rivayet etti ve oğlu Abdülhamid ve başkaları da ondan rivayet etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  id: "Abd al-Rahman ibn Zayd ibn al-Khattab ibn Nufayl al-Adawi al-Qurashi, keponakan Umar ibn al-Khattab, adalah salah satu pria dengan fisik paling sempurna. Abu Lubaba membawanya kepada Nabi, yang kemudian melakukan tahnik (menggosokkan kurma pada langit-langit mulut bayi yang baru lahir) padanya, mengelus kepalanya, dan mendoakan keberkahan untuknya. Ia meriwayatkan hadits dari ayahnya dan orang lain, dan putranya Abd al-Hamid dan orang lain meriwayatkan darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
