summary:
  en: "Son of Abu Jahl and fierce opponent of early Islam; fought against Muslims until the Conquest of Mecca where he fled to Yemen; brought back by his wife Umm Hakim, he embraced Islam with profound repentance, served as a brave general in the Ridda Wars, and was martyred heroically at the Battle of Yarmuk."
  ar: "فارس قريش وابن ألد أعداء الإسلام؛ حارب المسلمين في أحد والخندق ويوم الفتح، ثم فر إلى اليمن، فاستأمنت له زوجه أم حكيم فردته وأسلم وحسن إسلامه؛ صار من كبار قواد حروب الردة وفتوح الشام واستشهد بطلاً يوم اليرموك في عهد عمر."
