summary:
  ar: "مدربة ثقة روحية بريطانية ومتحدثة، مؤسسة أكاديمية «القلوب المستيقظة» ومنصة «المسلمة الواثقة»؛ وُلدت ونشأت في المملكة المتحدة وأقامت ثماني سنوات في الشرق الأقصى قبل عودتها، تحمل دبلومًا معتمدًا من الاتحاد الدولي للتدريب في التدريب التحويلي، وهي مدرّبة في شركة «المسلم المنتج» ومدربة رئيسية في «مسلم ماستري» ومحاضرة متطوعة في مركز للمسلمين الجدد."
  en: "British spiritual confidence coach and public speaker, founder of the Awakened Hearts Academy and The Confident Muslimah. Born and raised in the UK, she lived eight years in the Far East before returning. She holds an ICF-accredited diploma in transformational coaching, is a masterclass instructor with The Productive Muslim Co and a lead coach at Muslim Mastery, and volunteers as a lecturer at a revert centre."
  ur: "برطانوی روحانی اعتماد کی کوچ اور مقررہ، «اویکنڈ ہارٹس اکیڈمی» اور «دی کانفیڈنٹ مسلمہ» کی بانی۔ وہ برطانیہ میں پیدا ہوئیں اور پلی بڑھیں، واپسی سے قبل آٹھ سال مشرقِ بعید میں رہیں۔ وہ آئی سی ایف سے منظور شدہ تبدیلی کوچنگ میں ڈپلومہ رکھتی ہیں، «دی پروڈکٹو مسلم کمپنی» میں ماسٹر کلاس انسٹرکٹر اور «مسلم ماسٹری» میں لیڈ کوچ ہیں، اور نو مسلموں کے ایک مرکز میں رضاکار لیکچرر ہیں۔"
