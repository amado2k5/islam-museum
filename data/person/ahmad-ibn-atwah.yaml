roles: [qadi, scholar]
gender: male
summary:
  ar: "أحمد بن يحيى بن عطوة بن زيد التميمي العييني، من علماء نجد، ولد في العيينة ورحل إلى دمشق يتلقى العلم ثم عاد وتوفي ببلده، له فتاوى كثيرة والروضة والتحفة ودرر الفوائد وعقيان القلائد؛ توفي سنة 948 هـ الموافقة 1541م."
  en: "Ahmad ibn Yahya ibn Atwa ibn Zayd al-Tamimi al-Uyayni, a scholar of Najd, born in al-Uyayna, who studied for a time in Damascus, returned and died in his town; he gave many fatwas and wrote al-Rawda, al-Tuhfa and Durar al-Fawa'id wa Uqyan al-Qala'id; he died in 948 AH (1541 CE)."
  fr: "Ahmad ibn Yahya ibn Atwa ibn Zayd al-Tamimi al-Uyayni, savant du Najd né à al-Uyayna, qui étudia à Damas avant de rentrer et de mourir dans sa ville ; il rendit de nombreuses fatwas et écrivit al-Rawda, al-Tuhfa et Durar al-Fawa'id wa Uqyan al-Qala'id ; il mourut en 948 H (1541 ap. J.-C.)."
  es: "Ahmad ibn Yahya ibn Atwa ibn Zayd al-Tamimi al-Uyayni, un erudito de Najd, nacido en al-Uyayna, que estudió durante un tiempo en Damasco, regresó y murió en su ciudad natal; emitió muchas fatuas y escribió al-Rawda, al-Tuhfa y Durar al-Fawa'id wa Uqyan al-Qala'id; murió en el año 948 de la Hégira (1541 d. C.)."
  ur: "احمد بن یحییٰ بن عطیہ بن زید التمیمی العیینی، نجد کے ایک عالم، العیینہ میں پیدا ہوئے، جس نے دمشق میں کچھ عرصہ تعلیم حاصل کی، واپس آئے اور اپنے شہر میں وفات پائی۔ اس نے بہت سے فتوے دیے اور الروادہ، التحفہ اور درار الفوائد و عقیان القلائد لکھے۔ ان کی وفات 948ھ ⁦(1541ء)⁩ میں ہوئی۔"
