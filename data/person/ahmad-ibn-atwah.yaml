summary:
  ar: "أحمد بن يحيى بن عطوة بن زيد التميمي العييني، من علماء نجد، ولد في العيينة ورحل إلى دمشق يتلقى العلم ثم عاد وتوفي ببلده، له فتاوى كثيرة والروضة والتحفة ودرر الفوائد وعقيان القلائد؛ توفي سنة 948 هـ الموافقة 1541م."
  en: "Ahmad ibn Yahya ibn Atwa ibn Zayd al-Tamimi al-Uyayni, a scholar of Najd, born in al-Uyayna, who studied for a time in Damascus, returned and died in his town; he gave many fatwas and wrote al-Rawda, al-Tuhfa and Durar al-Fawa'id wa Uqyan al-Qala'id; he died in 948 AH (1541 CE)."
