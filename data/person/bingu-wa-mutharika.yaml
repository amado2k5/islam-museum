summary:
  ar: "اقتصادي وسياسي مالاوي (1934–2012) عمل في الخدمة المدنية في مالاوي وزامبيا وفي البنك الدولي ولجنة الأمم المتحدة الاقتصادية لأفريقيا، واختاره باكيلي مولوزي خلفًا له ففاز بانتخابات 2004، وأسس الحزب الديمقراطي التقدمي، واشتهر ببرنامج إعانة الأسمدة الذي حقق الأمن الغذائي، ورأس الاتحاد الأفريقي سنة 2010، ثم اضطربت ولايته الثانية باحتجاجات 2011 وتدهور اقتصادي، وتوفي في المنصب في 5 أبريل 2012."
  en: "Malawian economist and politician (1934–2012) who served in the civil services of Malawi and Zambia, at the World Bank and at the United Nations Economic Commission for Africa, was handpicked by Bakili Muluzi as his successor and won the 2004 election, founded the Democratic Progressive Party, was noted for the fertiliser-subsidy programme that delivered food security, chaired the African Union in 2010, then saw a troubled second term of 2011 protests and economic decline, and died in office on 5 April 2012."
  ur: "ملاوی کے ماہر معاشیات اور سیاست دان (1934ء–2012ء) جو ملاوی و زیمبیا کی سول سروس، عالمی بینک اور اقوام متحدہ کے اقتصادی کمیشن برائے افریقہ میں کام کر چکے تھے؛ بکیلی مولوزی نے انھیں اپنا جانشین منتخب کیا اور وہ 2004ء کے انتخابات جیت گئے، ڈیموکریٹک پروگریسیو پارٹی بنائی، کھاد کی سبسڈی کے پروگرام سے غذائی تحفظ حاصل کیا، 2010ء میں افریقی یونین کے سربراہ رہے، پھر دوسری مدت میں 2011ء کے احتجاج اور معاشی زوال دیکھا اور 5 اپریل 2012ء کو عہدے پر ہی وفات پائی۔"
