summary:
  ar: "رجل من أهل العلم والأدب والمعرفة كان يسيء الرأي في أبي تمام ويحلف أنه لا يحسن شيئاً قط، فلما قرئت عليه أبياته غير منسوبة أعجبته فلما عرف قائلها سبه ولعنه، وقال له أبو عمرو الطوسي خرق خرق لما اغتذى له بأرجوزته {cite:muruj-al-dhahab p. 461-463}."
  en: "The scholar whose blind hatred of Abu Tammam was exposed when he praised the same verses unattributed {cite:muruj-al-dhahab p. 461-463}."
  es: "El erudito cuyo odio ciego hacia Abu Tammam quedó al descubierto cuando alabó los mismos versículos sin atribución {cite:muruj-al-dhahab p. 461-463}."
  fr: "Le savant dont la haine aveugle d'Abu Tammam a été exposée lorsqu'il a fait l'éloge des mêmes versets sans les attribuer {cite:muruj-al-dhahab p. 461-463}."
  ur: "وہ عالم جس کی ابو تمام سے اندھی نفرت اس وقت کھل کر سامنے آگئی جب اس نے انہی آیات کی غیر منسوب تعریف کی۔ 461-463}۔"
  tr: "Bilgili, edebiyatlı ve bilgili bir adam, Ebu Temmam'ı yanlış yargılar ve onun hiçbir zaman iyi bir şey yapmadığına yemin ederdi. Ayetleri ona atıf belirtilmeden okunduğunda hoşuna giderdi. Konuşanı fark ettiğinde ona lanet ederdi. Ebu Amr el-Tusi ona dedi ki, 'Kesinti ile kes, çünkü onun kafiyeleriyle teselli buldu.' {atıf:Muruj-al-Dhahab s. 461-463}."
  id: "Seorang pria yang berpengetahuan, sastra, dan berpengetahuan sering salah menilai Abu Tammam dan bersumpah bahwa ia tidak pernah melakukan kebaikan. Ketika ayat-ayatnya dibacakan tanpa atribusi, ia menyukainya. Ketika ia menyadari siapa yang berbicara, ia mengutuk dan mengutuknya. Abu Amr al-Tusi berkata kepadanya, 'Pecahlah demi kesalahan, karena ia terhibur oleh rima-rimanya.' {cite:muruj-al-dhahab hlm. 461-463}."
