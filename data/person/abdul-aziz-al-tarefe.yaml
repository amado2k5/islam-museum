summary:
  ar: "عالم حديث وفقيه سعودي، وُلد في الكويت سنة 1976 واستقر في الرياض. عُرف بحفظه للحديث من دواوين السنة الكبرى، وتخرج في كلية الشريعة بجامعة الإمام محمد بن سعود الإسلامية، وعمل باحثًا في وزارة الشؤون الإسلامية. وبحسب التقارير المنقولة اعتُقل في أبريل 2016 وما يزال محتجزًا."
  en: "Saudi hadith scholar and jurist, born in Kuwait in 1976 and settled in Riyadh. Known for recalling hadith from the major collections from memory, he graduated from the College of Sharia at Imam Muhammad ibn Saud Islamic University and worked as a researcher at the Ministry of Islamic Affairs. According to the reports carried in the sources, he was arrested in April 2016 and remains detained."
  ur: "سعودی عالمِ حدیث اور فقیہ، جو 1976 میں کویت میں پیدا ہوئے اور ریاض میں مقیم ہوئے۔ کتبِ حدیث کی بڑی مجموعوں سے حدیث زبانی یاد رکھنے کے لیے مشہور، انہوں نے جامعہ امام محمد بن سعود الاسلامیہ کے کلیہ شریعہ سے تعلیم پائی اور وزارتِ امورِ اسلامیہ میں محقق رہے۔ ماخذوں میں نقل شدہ رپورٹوں کے مطابق وہ اپریل 2016 میں گرفتار ہوئے اور اب تک زیرِ حراست ہیں۔"
