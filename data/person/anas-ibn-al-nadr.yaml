label: { ar: "أنس بن النضر الأنصاري الخزرجي", en: "Anas ibn al-Nadr al-Ansari" }
summary:
  ar: "صحابي أنصاري خزرجي، عم أنس بن مالك خادم النبي. فاته القتال في بدر فتمنى شهادة المعركة القادمة. في أحد لما تبدّد المسلمون وقال بعضهم قُتل الرسول، حثّ المتخاذلين على القتال قائلاً: «ما تصنعون بالحياة بعده؟» ثم مضى يقاتل حتى لقي سعد بن معاذ فقال: «واها لريح الجنة يا سعد إني أجده دون أحد» ومضى فقاتل حتى قُتل ووُجد به بضع وثمانون جرحاً ما بين طعنة برمح وضربة بسيف ورمية بسهم، ولم تعرفه أخته إلا ببنانه {cite:mubarakpuri-raheeq p.265}."
