class: person
label: { ar: "أنس بن النضر الأنصاري الخزرجي", en: "Anas ibn al-Nadr al-Ansari" }
summary:
  ar: "صحابي أنصاري خزرجي، عم أنس بن مالك خادم النبي. فاته القتال في بدر فتمنى شهادة المعركة القادمة. في أحد لما تبدّد المسلمون وقال بعضهم قُتل الرسول، حثّ المتخاذلين على القتال قائلاً: «ما تصنعون بالحياة بعده؟» ثم مضى يقاتل حتى لقي سعد بن معاذ فقال: «واها لريح الجنة يا سعد إني أجده دون أحد» ومضى فقاتل حتى قُتل ووُجد به بضع وثمانون جرحاً ما بين طعنة برمح وضربة بسيف ورمية بسهم، ولم تعرفه أخته إلا ببنانه {cite:mubarakpuri-raheeq p.265}. وخبره كامل في الصحيح عن أنس: غاب عن بدر فقال «لئن أشهدني الله قتال المشركين ليرينّ الله ما أصنع»، فلما انكشف الناس يوم أحد اعتذر إلى الله من صنع أصحابه وتقدم فلقي سعداً فقال «الجنة ورب النضر إني أجد ريحها من دون أحد» فوجدوا به بضعاً وثمانين ضربة وطعنة ورمية وما عرفه أحد إلا أخته ببنانه، وكانوا يرون أن الآية «من المؤمنين رجال صدقوا ما عاهدوا الله عليه» نزلت فيه وأشباهه {cite:sahih-al-bukhari 2805}."
  en: "An Ansari Companion of the Khazraj, uncle of Anas ibn Malik the Prophet's servant. He missed the fighting at Badr and longed for martyrdom in the next battle. At Uhud, when the Muslims scattered and some said the Messenger had been killed, he urged the falterers on, saying: 'what will you do with life after him?' He went on fighting until he met Sa'd ibn Mu'adh and said: 'alas for the breeze of Paradise, Sa'd — I catch it below Uhud!' He fought until he was killed; more than eighty wounds were found on him — spear-thrusts, sword-blows and arrow-shots — and his sister knew him only by his fingertips {cite:mubarakpuri-raheeq p.265}."
