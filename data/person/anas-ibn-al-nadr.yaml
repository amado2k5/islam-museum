id: person/anas-ibn-al-nadr
class: person
label: { ar: "أنس بن النضر الأنصاري الخزرجي", en: "Anas ibn al-Nadr al-Ansari", es: "Anas ibn al-Nadr al-Ansari", fr: "Anas ibn al-Nadr al-Ansari", ur: "انس بن الندر الانصاری۔" }
summary:
  ar: "صحابي أنصاري خزرجي، عم أنس بن مالك خادم النبي. فاته القتال في بدر فتمنى شهادة المعركة القادمة. في أحد لما تبدّد المسلمون وقال بعضهم قُتل الرسول، حثّ المتخاذلين على القتال قائلاً: «ما تصنعون بالحياة بعده؟» ثم مضى يقاتل حتى لقي سعد بن معاذ فقال: «واها لريح الجنة يا سعد إني أجده دون أحد» ومضى فقاتل حتى قُتل ووُجد به بضع وثمانون جرحاً ما بين طعنة برمح وضربة بسيف ورمية بسهم، ولم تعرفه أخته إلا ببنانه {cite:mubarakpuri-raheeq p.265}. وخبره كامل في الصحيح عن أنس: غاب عن بدر فقال «لئن أشهدني الله قتال المشركين ليرينّ الله ما أصنع»، فلما انكشف الناس يوم أحد اعتذر إلى الله من صنع أصحابه وتقدم فلقي سعداً فقال «الجنة ورب النضر إني أجد ريحها من دون أحد» فوجدوا به بضعاً وثمانين ضربة وطعنة ورمية وما عرفه أحد إلا أخته ببنانه، وكانوا يرون أن الآية «من المؤمنين رجال صدقوا ما عاهدوا الله عليه» نزلت فيه وأشباهه {cite:sahih-al-bukhari 2805}."
  en: "An Ansari Companion of the Khazraj, uncle of Anas ibn Malik the Prophet's servant. He missed the fighting at Badr and longed for martyrdom in the next battle. At Uhud, when the Muslims scattered and some said the Messenger had been killed, he urged the falterers on, saying: 'what will you do with life after him?' He went on fighting until he met Sa'd ibn Mu'adh and said: 'alas for the breeze of Paradise, Sa'd — I catch it below Uhud!' He fought until he was killed; more than eighty wounds were found on him — spear-thrusts, sword-blows and arrow-shots — and his sister knew him only by his fingertips {cite:mubarakpuri-raheeq p.265}."
  es: "Un compañero ansar de Khazraj, tío de Anas ibn Malik, siervo del Profeta. Se perdió la batalla de Badr y anhelaba el martirio en la siguiente. En Uhud, cuando los musulmanes se dispersaron y algunos dijeron que el Mensajero había muerto, animó a los vacilantes a seguir adelante, diciendo: \"¿Qué haréis con la vida después de él?\". Continuó luchando hasta que se encontró con Sa'd ibn Mu'adh y le dijo: \"¡Ay de la brisa del Paraíso, Sa'd! ¡La encuentro debajo de Uhud!\". Luchó hasta morir; se le encontraron más de ochenta heridas —de lanzazos, espadazos y flechazos— y su hermana solo lo reconoció por la punta de sus dedos {cite:mubarakpuri-raheeq p.265}."
  fr: "Compagnon Ansari des Khazraj, oncle d'Anas ibn Malik, serviteur du Prophète, il manqua la bataille de Badr et aspirait au martyre lors de la prochaine. À Uhud, alors que les musulmans se dispersaient et que certains annonçaient la mort du Messager, il exhorta les hésitants à poursuivre le combat, leur demandant: « Que ferez-vous de votre vie après lui ? » Il continua à se battre jusqu'à sa rencontre avec Sa'd ibn Mu'adh, auquel il s'exclama: « Hélas pour le souffle du Paradis, Sa'd ! Je le ressens au pied d'Uhud ! » Il lutta jusqu'à sa mort; on découvrit sur son corps plus de quatre-vingts blessures – coups de lance, coups d'épée et flèches – et sa sœur ne le reconnut que du bout des doigts."
  ur: "خزرج کے ایک انصاری صحابی، رسول اللہ کے خادم انس بن مالک کے چچا۔ وہ بدر میں معرکہ چھوٹ گئے اور اگلی جنگ میں شہادت کی تمنا میں رہے۔ احد کے موقع پر جب مسلمان منتشر ہو گئے اور کچھ لوگوں نے کہا کہ رسول اللہ کو قتل کر دیا گیا ہے، تو آپ نے لڑکھڑانے والوں سے کہا: 'اس کے بعد کی زندگی کا تم کیا کرو گے؟' وہ لڑتا رہا یہاں تک کہ سعد بن معاذ سے ملاقات ہوئی اور کہا: 'افسوس جنت کی ہوا سعد - میں اسے احد کے نیچے پکڑتا ہوں۔' وہ مارے جانے تک لڑتا رہا۔ اس پر اسّی سے زیادہ زخم پائے گئے — نیزے کے زور، تلوار کے وار اور تیر کے نشانات — اور اس کی بہن اسے صرف انگلی کے پوروں سے جانتی تھی۔"
  tr: "Yoldaşım, Peygamber'in hizmetkarı Anas ibn Malik'in amcası Ansari Hazraciydi. Badir savaşını kaçırdı ve bir sonraki savaşta şehit olmayı diledi. Uhud'da, Müslümanlar dağıldığında ve bazıları Peygamber'in öldüğünü söylediğinde tereddüt edenleri savaşmaya teşvik etti ve şöyle dedi: \"Onun sonrası hayatı ne yapacaksın?\" Sonra savaşmaya devam etti ve Sa'd ibn Mu'adh ile karşılaştı; Mu'adh şöyle dedi: \"Ey Cennet rüzgarına vay be, ey Sa'd, ben bunu kimseye benzemiyorum.\" Savaşmaya devam etti ve ölene kadar savaştı; seksenden fazla yara aldı; bir mızrak sapı, bir kılıç darbesi ve bir ok atıldı. Kız kardeşi onu sadece parmaklarından tanıdı {atıf:mubarakpuri-raheeq s.265}. Kamil bunu Sahih'te Anas'tan aktardı: Bedir'de yoktu ve dedi ki, \"Allah beni mişteistlerle savaşırken görürse, ne yapabileceğimi görür.\" Uhud gününde insanlar ifşa edildiğinde, yoldaşlarının yaptıklarından dolayı Allah'tan özür diledi ve Sa'd ile karşılaştı ve dedi ki, \"Cennet ve Görü Rabbi; gerçekten de onun kokusunu herkese buluyorum.\" Yaklaşık seksen darbe, bıçak ve fırlatma buldular ve onu parmaklarından sadece kız kardeşi tanıyabildi. \"İnananlar arasında, Allah'a vaat ettiklerine sadık kalan adamlar vardır\" ayetinin kendisi ve benzerlerinin kendisi hakkında indirildiğine inandılar {cite:sahih-al-bukhari 2805}."
  id: "Teman saya adalah seorang Ansari Khazraji, paman Anas ibn Malik, hamba Nabi. Dia melewatkan pertempuran di Badr dan berharap syahid dalam pertempuran berikutnya. Di Uhud, ketika umat Muslim bercerai-berai dan beberapa mengatakan Nabi telah terbunuh, dia mendesak yang ragu untuk bertempur, berkata: \"Apa yang akan kalian lakukan dengan hidup setelah dia?\" Kemudian dia terus bertempur sampai bertemu Sa'd ibn Mu'adh, yang berkata: \"Celakalah angin Surga, wahai Sa'd, aku merasa itu berbeda dari siapa pun.\" Dia terus bertempur hingga tewas, dengan lebih dari delapan puluh luka termasuk tusukan tombak, pukulan pedang, dan panah. Saudarinya hanya mengenalinya dari jarinya {cite:mubarakpuri-raheeq hlm.265}. Dan Kamil melaporkannya dalam Sahih dari Anas: Dia tidak berada di Badr dan berkata, \"Jika Allah menyaksikan aku melawan para musyrik, Dia akan melihat apa yang bisa kulakukan.\" Ketika orang-orang terbongkar pada hari Uhud, dia meminta maaf kepada Allah atas apa yang telah dilakukan sahabat-sahabatnya dan maju menemui Sa'd dan berkata, \"Surga dan Tuhan Penglihatan; sungguh, aku menemukan harumnya bagi siapa pun.\" Mereka menemukan sekitar delapan puluh pukulan, tusukan, dan lemparan, dan tidak ada yang mengenalinya kecuali saudara perempuannya dari jari-jarinya. Mereka percaya bahwa ayat \"Di antara orang beriman adalah orang-orang yang setia pada janji mereka kepada Allah\" telah diungkapkan tentang dirinya dan orang-orang serupa {cite:sahih-al-bukhari 2805}."
