summary: { ar: "سيد خزاعة الذي جلّى الأصنام إلى الحجاز ووضع هبل على جوف الكعبة، وابتدع البحيرة والسائبة والوصيلة والحامي؛ عند المسلمين أول من سنّ الوثنية بمكة. وعند المسعودي سار إلى مدينة البلقاء من عمل دمشق فرأى قوماً يعبدون الأصنام فطلب منهم صنماً يدعونه هبل فسار به إلى مكة ونصبه على الكعبة ومعه أساف ونائلة ودعا الناس إلى تعظيمها {cite:muruj-al-dhahab p. 538}", en: "Khuza‘a’s chief who brought idols to the Hijaz, set Hubal inside the Ka‘ba and instituted the consecrated-livestock customs.", es: "El jefe de Khuza'a, que trajo ídolos al Hiyaz, colocó a Hubal dentro de la Kaaba e instituyó las costumbres de consagrar el ganado.", fr: "Le chef de Khuza'a qui a introduit les idoles dans le Hedjaz, a placé Hubal à l'intérieur de la Kaaba et a institué les coutumes relatives au bétail consacré.", ur: "خزاعہ کے سردار جو حجاز میں بت لائے تھے، نے حبل کو خانہ کعبہ کے اندر کھڑا کیا اور مویشیوں کی مقدس رسمیں قائم کیں۔", tr: "Hicaz'a putları temizleyen, Kabe'nin içine bir türbe yerleştiren ve gölü, saibet, al-wasila ve al-hawi'yi icat eden Seyyid Huza'ah; Müslümanlar arasında Mekke'de putperestliği ilk kuran oydu. El-Mes'udi ile birlikte Şam'dan Balka şehrine gitti ve insanları putlara tapan insanları gördü, onlardan Hubal adında bir put istedi. Onunla birlikte Mekke'ye gidip Asaf ve Naila ile ile birlikte Kabe'ye yerleştirdi ve halkı ona saygı göstermeye çağırdı {atıf:Muruj-al-Dhahab, s. 538}", id: "Sayyid Khuza'ah, yang membersihkan patung ke Hijaz dan mendirikan tempat suci di dalam Ka'bah, serta menciptakan danau, sa'ibah, al-wasila, dan al-hawi; di antara umat Muslim, ia adalah yang pertama mendirikan penyembahan berhala di Mekah. Bersama al-Mas'udi ia pergi ke kota Balqa dari kota Damaskus dan melihat orang-orang menyembah berhala lalu meminta mereka sebuah arca bernama Hubal. Ia ikut pergi ke Mekah dan mendirikannya di Ka'bah bersama Asaf dan Naila, serta mengajak orang-orang untuk memuliakannya {cite:muruj-al-dhahab, hlm. 538}" }
