summary: { ar: "سيد خزاعة الذي جلّى الأصنام إلى الحجاز ووضع هبل على جوف الكعبة، وابتدع البحيرة والسائبة والوصيلة والحامي؛ عند المسلمين أول من سنّ الوثنية بمكة. وعند المسعودي سار إلى مدينة البلقاء من عمل دمشق فرأى قوماً يعبدون الأصنام فطلب منهم صنماً يدعونه هبل فسار به إلى مكة ونصبه على الكعبة ومعه أساف ونائلة ودعا الناس إلى تعظيمها {cite:muruj-al-dhahab p. 538}", en: "Khuza‘a’s chief who brought idols to the Hijaz, set Hubal inside the Ka‘ba and instituted the consecrated-livestock customs." }
