  - { role: interlocutor, toward: group/quraysh, status: tradition, note: "كتب إلى قريش يحذرهم مسير النبي إليهم؛ دافع بأنه لا أصل له ولا عشيرة بمكة وأراد أن يصنع عندهم يدًا يحمون بها أهله وماله.", sources: [source/ibn-hisham-saqqa] }
