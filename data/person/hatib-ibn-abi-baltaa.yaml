summary:
  en: "A Companion settled in Mecca without clan or kin there, a halif with children and wealth among them. When the Prophet resolved on the march to Mecca, Hatib wrote to warn Quraysh; the letter was intercepted, and the tradition holds that the Prophet excused him citing the people of Badr — and that the opening of Sura al-Mumtahana came down concerning him."
  ar: "صحابي نزل مكة حليفًا بلا أصل ولا عشيرة، وله بها ولد وأهل؛ فلما أجمع النبي المسير كتب إلى قريش يخبرهم، فأُدركت ناقلة كتابه واستُخرج من قرون رأسها. وفي الرواية أن النبي قبل عذره وذكر شهوده بدرًا، ونزل في شأنه مطلع سورة الممتحنة.، وعند البلاذري بعثه النبي إلى المقوقس صاحب الإسكندرية في سنة سبع {cite:ansab-al-ashraf p. 531}"
