summary:
  ar: "محمود بن نصر بن صالح بن مرداس الكلابي، عز الدولة ابن شبل الدولة، أحد الأمراء المرداسيين أصحاب حلب، ولي حلب سنة 452 هـ وأخذها منه عمه ثمال سنة 453 ثم استعادها سنة 454 واستمر فيها إلى وفاته سنة 467 هـ الموافقة 1075 م."
  en: "Mahmud ibn Nasr ibn Salih ibn Mirdas al-Kilabi, 'Izz al-Dawla, known as Ibn Shibl al-Dawla, a Mirdasid emir of Aleppo; he took the city in 452 AH, lost it to his uncle Thimal in 453, regained it in 454 and held it until his death in 467 AH (1075)."
  es: "Mahmud ibn Nasr ibn Salih ibn Mirdas al-Kilabi, 'Izz al-Dawla, conocido como Ibn Shibl al-Dawla, un emir mirdasí de Alepo; tomó la ciudad en 452 AH, la perdió ante su tío Thimal en 453, la recuperó en 454 y la mantuvo hasta su muerte en 467 AH (1075)."
  fr: "Mahmud ibn Nasr ibn Salih ibn Mirdas al-Kilabi, 'Izz al-Dawla, connu sous le nom d'Ibn Shibl al-Dawla, un émir mirdaside d'Alep; il prit la ville en 452 AH, la perdit au profit de son oncle Thimal en 453, la récupéra en 454 et la conserva jusqu'à sa mort en 467 AH (1075)."
