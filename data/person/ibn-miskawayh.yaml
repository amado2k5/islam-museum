summary:
  ar: "أبو علي أحمد بن محمد مسكويه الرازي، فيلسوف الأخلاق والمؤرخ صاحب «تجارب الأمم» و«تهذيب الأخلاق»، عاش من نحو سنة 320هـ إلى التاسع من صفر سنة 421هـ، ونادم الوزير المهلبي، وكان خازن كتب ابن العميد سبع سنين وخازناً لعضد الدولة، ولُقّب بالخازن والنديم والمعلم الثالث {cite:tajarib-al-umam-surush-v1 p.11} {cite:tajarib-al-umam-surush-v1 p.12} {cite:tajarib-al-umam-surush-v1 p.19} {cite:tajarib-al-umam-surush-v1 p.32}. ويرجّح محقق تجارب الأمم أن «مسكويه» لقبه هو لا لقب أبيه {cite:tajarib-al-umam-surush-v1 p.15}."
  en: "Abu Ali Ahmad ibn Muhammad Miskawayh al-Razi, moral philosopher and historian, author of Tajarib al-umam and Tahdhib al-akhlaq; he lived from about 320 AH to 9 Safar 421 AH, was boon companion of the vizier al-Muhallabi, librarian to Ibn al-Amid for seven years and to Adud al-Dawla, and was called al-Khazin (the librarian), al-Nadim (the companion) and 'the Third Teacher'. The editor of Tajarib al-umam argues that 'Miskawayh' was his own byname, not his father's."
