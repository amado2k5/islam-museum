summary:
  ar: "أبو علي أحمد بن محمد مسكويه الرازي، فيلسوف الأخلاق والمؤرخ صاحب «تجارب الأمم» و«تهذيب الأخلاق»، عاش من نحو سنة 320هـ إلى التاسع من صفر سنة 421هـ، ونادم الوزير المهلبي، وكان خازن كتب ابن العميد سبع سنين وخازناً لعضد الدولة، ولُقّب بالخازن والنديم والمعلم الثالث {cite:tajarib-al-umam-surush-v1 p.11} {cite:tajarib-al-umam-surush-v1 p.12} {cite:tajarib-al-umam-surush-v1 p.19} {cite:tajarib-al-umam-surush-v1 p.32}. ويرجّح محقق تجارب الأمم أن «مسكويه» لقبه هو لا لقب أبيه {cite:tajarib-al-umam-surush-v1 p.15}."
  en: "Abu Ali Ahmad ibn Muhammad Miskawayh al-Razi, moral philosopher and historian, author of Tajarib al-umam and Tahdhib al-akhlaq; he lived from about 320 AH to 9 Safar 421 AH, was boon companion of the vizier al-Muhallabi, librarian to Ibn al-Amid for seven years and to Adud al-Dawla, and was called al-Khazin (the librarian), al-Nadim (the companion) and 'the Third Teacher'. The editor of Tajarib al-umam argues that 'Miskawayh' was his own byname, not his father's."
  es: "Abu Ali Ahmad ibn Muhammad Miskawayh al-Razi, filósofo moral e historiador, autor de Tajarib al-umam y Tahdhib al-akhlaq, vivió aproximadamente entre el año 320 de la Hégira y el 9 de Safar del año 421 de la Hégira. Fue compañero inseparable del visir al-Muhallabi, bibliotecario de Ibn al-Amid durante siete años y de Adud al-Dawla, y se le conocía como al-Khazin (el bibliotecario), al-Nadim (el compañero) y «el Tercer Maestro». El editor de Tajarib al-umam sostiene que «Miskawayh» era su propio sobrenombre, no el de su padre."
  fr: "Abu Ali Ahmad ibn Muhammad Miskawayh al-Razi, philosophe moral et historien, auteur de Tajarib al-umam et Tahdhib al-akhlaq, vécut d'environ 320 AH au 9 Safar 421 AH. Compagnon privilégié du vizir al-Muhallabi, il fut bibliothécaire d'Ibn al-Amid pendant sept ans et d'Adud al-Dawla. On le surnommait al-Khazin (le bibliothécaire), al-Nadim (le compagnon) et « le troisième maître ». L'éditeur de Tajarib al-umam soutient que « Miskawayh » était son surnom personnel et non celui de son père."
