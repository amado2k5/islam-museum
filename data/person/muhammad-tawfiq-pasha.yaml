summary:
  ar: "خديوي مصر والسودان من 1879 إلى 1892، سادس حكام الأسرة العلوية والابن الأكبر للخديوي إسماعيل. شهد عهده ثورة عرابي وقصف الإسكندرية سنة 1882 وبداية الاحتلال البريطاني، وتوفي في حلوان سنة 1892 فخلفه ابنه عباس حلمي الثاني."
  en: "Khedive of Egypt and Sudan from 1879 to 1892, the sixth ruler of the Muhammad Ali dynasty and the eldest son of Khedive Isma'il. His reign saw the Urabi revolt, the British bombardment of Alexandria in 1882 and the start of the British occupation. He died at Helwan in 1892 and was succeeded by his son Abbas Hilmi II."
  ur: "مصر اور سوڈان کے خدیو 1879 سے 1892 تک، اسرۂ علویہ کے چھٹے حکمران اور خدیو اسماعیل کے بڑے بیٹے۔ ان کے عہد میں عرابی بغاوت، 1882 میں اسکندریہ پر برطانوی گولہ باری اور برطانوی قبضے کا آغاز ہوا۔ وہ 1892 میں حلوان میں وفات پا گئے اور ان کے بیٹے عباس حلمی ثانی جانشین ہوئے۔"
