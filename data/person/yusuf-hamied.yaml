summary:
  ar: "يوسف خواجة حميد (وُلد في 25 تموز 1936 في فيلنيوس)، كيميائي ورجل أعمال وملياردير هندي، رئيس شركة سيبلا للأدوية الجنيسة التي أسسها والده خواجة عبد الحميد سنة 1935. تدرّب في كامبريدج، واشتهر عالمياً بتوفير أدوية الإيدز للبلدان الفقيرة بجزء يسير من الأسعار الغربية وبإعادة تشكيل صناعة الأدوية الجنيسة وقانون براءات الاختراع في الهند. نال وسام بادما بوشان سنة 2005."
  en: "Yusuf Khwaja Hamied (born 25 July 1936 in Vilnius) is an Indian chemist and billionaire businessman, chairman of Cipla, the generic pharmaceuticals company founded by his father Khwaja Abdul Hamied in 1935. Cambridge-trained, he became known worldwide for supplying HIV/AIDS medicines to poor countries at a fraction of Western prices, and for his part in reshaping India's patent law and generics industry. He received the Padma Bhushan in 2005."
  ur: "یوسف خواجہ حامد (پیدائش 25 جولائی 1936، ولنیس) بھارتی کیمیا دان، ارب پتی تاجر اور سپلا کے چیئرمین ہیں، وہ جنیرک ادویات کی کمپنی جو ان کے والد خواجہ عبدالحامد نے 1935 میں قائم کی تھی۔ کیمبرج سے تربیت یافتہ، وہ غریب ممالک کو ایچ آئی وی/ایڈز کی ادویات مغربی قیمتوں کے معمولی حصے پر فراہم کرنے اور بھارت کے پیٹنٹ قانون اور جنیرک صنعت کی تشکیل نو میں اپنے کردار کے لیے دنیا بھر میں جانے گئے۔ انھیں 2005 میں پدم بھوشن ملا۔"

