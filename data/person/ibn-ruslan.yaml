summary:
  ar: "شهاب الدين ابن رسلان المقدسي الشافعي الصوفي الشيخ الإمام العالم الصالح القدوة؛ ولد برملة فلسطين سنة ثلاث وسبعين وسبعمائة ثم رحل لأخذ العلوم فسمع الحديث على جماعة كثيرة وبرع في الفقه حتى أجازه قاضي القضاة الباعوني بالإفتاء وتصدى للإقراء وما قرأ عليه أحد إلا انتفع وكان يكني جماعته بكنى نحو أبي طاهر وأبي المواهب فلا يتخلف أثرها، ولزم الإفتاء والتدريس مدة ثم ترك ذلك وسلك طريق الصوفية القويم وجد واجتهد حتى صار مناراً يهتدى به السالكون وشعاراً يقتدى به الناسكون وغرست محبته في قلوب الناس فأثمر له ذلك الغراس، ومن تصانيفه النافعة شرح سنن أبي داود والبخاري وتعليق على الشفاء وشرح مختصر ابن الحاجب وجمع الجوامع ومنهاج البيضاوي وشرح أرجوزته الزبد في كبير وصغير وتصحيح الحاوي ومختصر الروضة والمنهاج وأدب القاضي للغزي والأذكار وحياة الحيوان ونظم في علم القراءات وأعرب الألفية وشرح الملحة وعمل طبقات الشافعية ونظم من علوم القرآن ستين نوعاً، قال المناوي في طبقات الأولياء له كرامات لا تكاد تحصى، وكان صائماً قائماً قلما يضطجع بالليل، وتوفي بالقدس يوم الاثنين لثمان بقين من شهر رمضان سنة أربع وأربعين وثمانمائة عن إحدى وسبعين سنة وارتجت الدنيا لموته ولم يخلف بعده بتلك الديار مثله {cite:shadharat-dhahab p. 249-250}."
  en: "Ibn Ruslan (b. Ramla 773) — the Jerusalem saint-jurist author of the Zubd rhymed Shafi'i manual (composed, tradition says, then cast into the sea and returned unharmed); taught under the Ba'uni's licence then turned wholly to the 'sound Sufi path,' becoming 'a beacon for wayfarers'; commentaries on Sunan Abi Dawud, the Minhaj, the Alfiyya and sixty rhymed sciences; died Jerusalem Monday 8 Ramadan 844 aged 71 — 'the world shuddered at his death and the land saw none like him after' {cite:shadharat-dhahab p. 249-250}."
