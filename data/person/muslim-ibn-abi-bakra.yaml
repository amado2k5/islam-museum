  ar: "مسلم بن أبي بكرة؛ صاحب ثالث حمام بالبصرة في بلالاباذ كان يغتال منه كل يوم ألف درهم وطعاماً كثيراً وقال له أبوه يا بني والله ما تلي عملاً وما أراك تقصر عن إخوتك في النفعة فأوصى به لأخيه عبد الرحمن فأفشى غلته وأذن للناس في الحمامات فقال ما له قطع الله رحمه."
  en: "Muslim ibn Abi Bakra; owner of Basra's third bathhouse at Bilalabadh yielding a thousand dirhams and much food daily — his father telling him 'you do no deed yet lack no profit' — whose deathbed trust his brother Abd al-Rahman broke by opening the bathhouse permissions."
