label: { ar: "مسلم بن أبي بكرة", en: "Muslim ibn Abi Bakra", es: "Muslim ibn Abi Bakra", fr: "Muslim ibn Abi Bakra", ur: "مسلم بن ابی بکرہ" }
summary:
  ar: "مسلم بن أبي بكرة؛ صاحب ثالث حمام بالبصرة في بلالاباذ كان يغتال منه كل يوم ألف درهم وطعاماً كثيراً وقال له أبوه يا بني والله ما تلي عملاً وما أراك تقصر عن إخوتك في النفعة فأوصى به لأخيه عبد الرحمن فأفشى غلته وأذن للناس في الحمامات فقال ما له قطع الله رحمه."
  en: "Muslim ibn Abi Bakra; owner of Basra's third bathhouse at Bilalabadh yielding a thousand dirhams and much food daily — his father telling him 'you do no deed yet lack no profit' — whose deathbed trust his brother Abd al-Rahman broke by opening the bathhouse permissions."
  es: "Muslim ibn Abi Bakra, propietario del tercer baño público de Basora en Bilalabadh, que generaba mil dirhams y abundante comida diariamente —su padre le decía: \"No haces nada y no te falta beneficio\"—, cuya confianza depositada en él su hermano Abd al-Rahman quebrantó al abrir los permisos para el baño público."
  fr: "Muslim ibn Abi Bakra; propriétaire du troisième bain public de Bassora à Bilalabadh, rapportant mille dirhams et beaucoup de nourriture chaque jour — son père lui disant « tu ne fais rien et pourtant tu ne manques d'aucun profit » — dont le testament, sur son lit de mort, a été rompu par son frère Abd al-Rahman qui a ouvert les autorisations d'exploitation du bain public."
  ur: "مسلم بن ابی بکرہ؛ بلال آباد میں بصرہ کے تیسرے حمام کا مالک جس سے روزانہ ایک ہزار درہم اور بہت زیادہ کھانا ملتا ہے - اس کے والد نے اسے کہا کہ 'تم نے کوئی کام نہیں کیا پھر بھی کوئی منافع نہیں ہے' - جس کا بستر مرگ پر اس کے بھائی عبدالرحمٰن نے غسل خانے کی اجازتیں کھول کر توڑ دی۔"
  tr: "Bilabaz'daki Basra'daki üçüncü hamamın sahibi Müslüman ibn Ebi Bakrah, her gün bin dirhem ve bolca yiyecek karşılığında suikasta uğrardı. Babası ona, \"Ey oğlum, Allah aşkına, kardeşlerin için hiçbir şey yapamazsın,\" dedi. Babası ise kardeşi Abdulrahman'a miras bıraktı, o da servetini dağıttı ve insanların hamamlara girmesine izin verdi. Dedi ki, \"Ona ne oldu? Allah merhametini kessin.\""
  id: "Muslim ibn Abi Bakrah, pemilik pemandian ketiga di Basra di Bilabaz, biasa dibunuh setiap hari demi seribu dirham dan banyak makanan darinya. Ayahnya berkata kepadanya, \"Wahai anakku, demi Tuhan, kamu tidak akan bisa melakukan apa pun untuk saudara-saudaramu demi kebaikan.\" Dia mewariskannya kepada saudaranya Abdul Rahman, yang menyebarkan kekayaannya dan mengizinkan orang masuk ke pemandian. Dia berkata, \"Apa yang salah dengannya? Semoga Allah memutus rahmatnya.\""
