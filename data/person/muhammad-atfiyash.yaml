summary:
  ar: "محمد بن يوسف بن عيسى بن صالح أطفيش، لُقّب بقطب الأئمة، عالم إباضي من بني يسجن في وادي ميزاب، وتوفي سنة 1332هـ (1914م) عن نحو 94 سنة. وكان لأسرته علماء، وقد أحيا بنشاطه الأدبي الواسع الدراسات الدينية الإباضية، وكان على صلة بالإباضية في المشرق؛ وقد أوقف مكتبته في بني يسجن {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  en: "Muhammad ibn Yusuf ibn 'Isa ibn Salih Atfiyash, called Qutb al-A'imma, an Ibadi scholar of Beni Isguen (Banu Yasdjan) in the Mzab. He died in 1332 AH (1914) at about 94 years of age. Through an extensive literary activity he brought about a renaissance of Ibadi religious studies; he was in contact with Ibadis in the East and made the Ibadis known and respected by other Muslims. His library is a waqf in Beni Isguen {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
