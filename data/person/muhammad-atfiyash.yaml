summary:
  ar: "محمد بن يوسف بن عيسى بن صالح أطفيش، لُقّب بقطب الأئمة، عالم إباضي من بني يسجن في وادي ميزاب، وتوفي سنة 1332هـ ⁦(1914م)⁩ عن نحو 94 سنة. وكان لأسرته علماء، وقد أحيا بنشاطه الأدبي الواسع الدراسات الدينية الإباضية، وكان على صلة بالإباضية في المشرق؛ وقد أوقف مكتبته في بني يسجن {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  en: "Muhammad ibn Yusuf ibn 'Isa ibn Salih Atfiyash, called Qutb al-A'imma, an Ibadi scholar of Beni Isguen (Banu Yasdjan) in the Mzab. He died in 1332 AH (1914) at about 94 years of age. Through an extensive literary activity he brought about a renaissance of Ibadi religious studies; he was in contact with Ibadis in the East and made the Ibadis known and respected by other Muslims. His library is a waqf in Beni Isguen {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  es: "Muhammad ibn Yusuf ibn 'Isa ibn Salih Atfiyash, llamado Qutb al-A'imma, fue un erudito ibadí de Beni Isguen (Banu Yasdjan) en el Mzab. Falleció en 1332 AH (1914) a la edad de aproximadamente 94 años. Gracias a su extensa actividad literaria, impulsó un renacimiento de los estudios religiosos ibadíes; mantuvo contacto con ibadíes en Oriente y logró que otros musulmanes los conocieran y respetaran. Su biblioteca es un waqf (fundación religiosa islámica) en Beni Isguen {cite:encyclopaedia-of-islam-2 vol. 1 p. 785}."
  fr: "Muhammad ibn Yusuf ibn 'Isa ibn Salih Atfiyash, dit Qutb al-A'imma, était un érudit ibadite de Beni Isguen (Banu Yasdjan) au Mzab. Il mourut en 1332 AH (1914) à l'âge d'environ 94 ans. Par son œuvre littéraire considérable, il contribua à la renaissance des études religieuses ibadites; il était en contact avec les ibadites d'Orient et fit connaître et respecter la communauté ibadite auprès des autres musulmans. Sa bibliothèque est un waqf à Beni Isguen (voir: Encyclopaedia of Islam, vol. 1, p. 785)."
  ur: "محمد بن یوسف بن عیسیٰ ابن صالح عاطفیاش، قطب الائمہ، بنی عصگین ⁦(بنو یسدجان)⁩ کے ایک عبادی عالم کو مزاب میں کہتے ہیں۔ آپ کی وفات 1332ھ (1914) میں تقریباً 94 سال کی عمر میں ہوئی۔ ایک وسیع ادبی سرگرمی کے ذریعے اس نے عبادی مذہبی علوم کی نشاۃ ثانیہ کی۔ وہ مشرق میں عبادیوں کے ساتھ رابطے میں تھا اور اس نے دوسرے مسلمانوں میں عبادیوں کو پہچانا اور ان کا احترام کیا۔ ان کا کتب خانہ بینی اسگوین میں وقف ہے۔ 1 ص۔ 785}۔"
  tr: "Muhammed ibn Yusuf ibn İsa ibn Salih Atfish, Qutb al-İmam olarak bilinir, Wadi M'zab'daki Banu Yassain'den bir İbadi âlimiydi. 1332 Hicri (1914 AD) yılında yaklaşık 94 yaşında öldü. Ailesinin alimleri vardı ve geniş edebi faaliyetleri sayesinde İbadi dini çalışmalarını canlandırdı. Doğudaki İbadilerle bağlantılıydı; kütüphanesini Bani Yasjin'de {cite:encyclopaedia-of-Islam-2 cilt 1, s. 785} bağışladı."
  id: "Muhammad ibn Yusuf ibn Isa ibn Salih Atfish, yang dikenal sebagai Qutb al-Imam, adalah seorang ulama Ibadi dari Banu Yassain di Wadi M'zab. Ia meninggal pada tahun 1332 AH (1914 M) pada usia sekitar 94 tahun. Keluarganya memiliki para cendekiawan, dan melalui aktivitas sastra yang luas, ia menghidupkan kembali studi agama Ibadi. Ia terhubung dengan Ibadis di Timur; ia mendanai perpustakaannya di Bani Yasjin {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 785}."
