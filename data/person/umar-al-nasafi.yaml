summary:
  ar: "عمر بن محمد بن أحمد بن إسماعيل، أبو حفص، نجم الدين النسفي، عالم بالتفسير والأدب والتاريخ ومن فقهاء الحنفية، ولد بنسف وتوفي بسمرقند، وله نحو مئة مصنف منها «طلبة الطلبة» و«القند في علماء سمرقند» و«العقائد» المعروفة بعقائد النسفي، ولقب بمفتي الثقلين، وتوفي سنة 537 هـ ⁦(1142 م)⁩."
  en: "Umar ibn Muhammad ibn Ahmad ibn Ismail, Abu Hafs, Najm al-Din al-Nasafi, a Hanafi jurist and scholar of exegesis, letters and history, born at Nasaf and died in Samarkand; said to have written about a hundred works, among them Talabat al-Talaba, al-Qand fi ulama Samarqand and the al-Aqa'id known as the creed of al-Nasafi; titled mufti al-thaqalayn; died 537 AH (1142 CE)."
  es: "Umar ibn Muhammad ibn Ahmad ibn Ismail, Abu Hafs, Najm al-Din al-Nasafi, jurista hanafí y erudito en exégesis, letras e historia, nació en Nasaf y murió en Samarcanda; se dice que escribió alrededor de cien obras, entre ellas Talabat al-Talaba, al-Qand fi ulama Samarqand y al-Aqa'id, conocido como el credo de al-Nasafi; recibió el título de mufti al-thaqalayn; murió en el año 537 de la Hégira (1142 d. C.)."
  fr: "Umar ibn Muhammad ibn Ahmad ibn Ismail, Abu Hafs, Najm al-Din al-Nasafi, juriste hanafite et érudit en exégèse, lettres et histoire, né à Nasaf et mort à Samarcande; aurait écrit une centaine d'ouvrages, parmi lesquels Talabat al-Talaba, al-Qand fi ulama Samarcande et al-Aqa'id connu sous le nom de credo d'al-Nasafi; titré mufti al-thaqalayn; mort en 537 AH (1142 CE)."
  ur: "عمر بن محمد بن احمد بن ابن اسماعیل، ابو حفص، نجم الدین النصفی، حنفی فقیہ اور تفسیر، خطوط اور تاریخ کے عالم، نصاف میں پیدا ہوئے اور سمرقند میں وفات پائی۔ ان کے بارے میں کہا جاتا ہے کہ انہوں نے تقریباً ایک سو تصانیف لکھی ہیں، جن میں سے تالبات الطالبہ، القند فی علما سمرقند اور العقیدہ جو کہ النصفی کا عقیدہ ہے؛ عنوان مفتی الثقلین؛ وفات 537ھ ⁦(1142ء)⁩۔"
  tr: "Tefsir, edebiyat ve tarih alimi ve Hanefi hukukçularından biri olan Ömer bin Muhammed bin Ahmed ibn İsmail, Ebu Hafs, Necmeddin el-Nasifi Nasf'ta doğmuş ve Semerkand'da ölmüştür. 'Telubat el-Talaba', 'Al-Qand fi 'Ulama Semerkand' ve 'Akhid' ('Akid el-Nasafi' olarak bilinir) dahil olmak üzere yaklaşık yüz eser yazmıştır. El-Tekalenin Müftüsü unvanını taşıyor ve 537 Hicri (1142 M.S.) yılında öldü."
  id: "Umar ibn Muhammad ibn Ahmad ibn Ismail, Abu Hafs, Najm al-Din al-Nasafi, seorang sarjana tafsir, sastra, dan sejarah, serta salah satu ahli hukum Hanafi, lahir di Nasf dan meninggal di Samarkand. Ia menulis sekitar seratus karya, termasuk 'Talubat al-Talaba', 'Al-Qand fi 'Ulama Samarkand', dan 'Al-'aqeed', yang dikenal sebagai 'Aqeed al-Nasafi'. Ia bergelar Mufti al-Thaqalayn dan meninggal pada tahun 537 H (1142 M)."
