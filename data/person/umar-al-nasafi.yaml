summary:
  ar: "عمر بن محمد بن أحمد بن إسماعيل، أبو حفص، نجم الدين النسفي، عالم بالتفسير والأدب والتاريخ ومن فقهاء الحنفية، ولد بنسف وتوفي بسمرقند، وله نحو مئة مصنف منها «طلبة الطلبة» و«القند في علماء سمرقند» و«العقائد» المعروفة بعقائد النسفي، ولقب بمفتي الثقلين، وتوفي سنة 537 هـ ⁦(1142 م)⁩."
  en: "Umar ibn Muhammad ibn Ahmad ibn Ismail, Abu Hafs, Najm al-Din al-Nasafi, a Hanafi jurist and scholar of exegesis, letters and history, born at Nasaf and died in Samarkand; said to have written about a hundred works, among them Talabat al-Talaba, al-Qand fi ulama Samarqand and the al-Aqa'id known as the creed of al-Nasafi; titled mufti al-thaqalayn; died 537 AH (1142 CE)."
