label: { ar: "عاتكة بنت زيد بن عمرو", en: "'Atika bint Zayd ibn 'Amr", es: "'Atika bint Zayd ibn 'Amr", fr: "'Atika bint Zayd ibn 'Amr", ur: "عتیقہ بنت زید بن عمرو" }
summary:
  ar: "أخت سعيد بن زيد بن نفيل وزوجة الزبير بن العوام، رثته بقولها غدر ابن جرموز بفارس يهمة يوم اللقاء وكان غير مسدد يا عمرو لو نبهته لوجدته لا طائشاً رعش الجنان ولا اليد {cite:muruj-al-dhahab p. 657}."
  en: "Sa'id ibn Zayd's sister and al-Zubayr's wife — her elegy on Ibn Jurmuz's treachery: 'Had you roused him you'd have found no trembling heart, no shaking hand' {cite:muruj-al-dhahab p. 657}."
  es: "La hermana de Sa'id ibn Zayd y esposa de al-Zubayr — su elegía sobre la traición de Ibn Jurmuz: 'Si lo hubieras despertado, no habrías encontrado un corazón tembloroso, ni una mano temblorosa' {cite:muruj-al-dhahab p. 657}."
  fr: "La sœur de Sa'id ibn Zayd et l'épouse d'al-Zubayr — son élégie sur la trahison d'Ibn Jurmuz: « Si vous l'aviez réveillé, vous n'auriez trouvé ni cœur tremblant, ni main tremblante » {cite: muruj-al-dhahab p. 657}."
  ur: "سعید بن زید کی بہن اور الزبیر کی بیوی - ابن جرمز کی غداری پر اس کی خوبصورتی: 'اگر آپ اسے بیدار کرتے تو آپ کو کوئی لرزتا ہوا دل اور کوئی مصافحہ نہ ملتا'۔ 657}۔"
  tr: "Said ibn Zayd ibn Nufeyl'in kız kardeşi ve el-Zubeyr ibn al-Awwam'ın eşi olan Emer, ona yas tutarak şöyle dedi: İbn Cerrahuz, toplantı günü Faris Yahma'yı sattı ve yoldan çıkmıştı. Ey Amr, eğer onu uyarsaydın, onu ne pervasız, deli gibi titreyen ne de bir el olarak bulurdun. {Kaynak:Muruj-al-Dhahab, s. 657}."
  id: "Saudari Saeed ibn Zayd ibn Nufayl dan istri al-Zubayr ibn al-Awwam, ia meratapi Yahma, berkata: Ibn Jarmouz mengkhianati Faris Yahma pada hari pertemuan dan tidak diarahkan. Ya Amr, jika kau memperingatkannya, kau tidak akan menemukan dia sembrono, gemetar seperti orang gila, maupun tangan. {cite:Muruj-al-Dhahab, hlm. 657}."
