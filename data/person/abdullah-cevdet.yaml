    note: "No school is at issue; the live question is whether he is documented as an atheist, and that does not meet the lane's bar of two independent scholarly traditions attesting a man's own unbelief (the Akhundov standard). What the sources give is this. The English article's text says he was initially a pious Muslim who received a religious education and was turned by Western materialist philosophies against institutionalized religion; quoting Hanioğlu, it says he thought that 'although the Muslim God was of no use in the modern era, Islamic society must preserve Islamic principles', that he wanted to discard God but keep religion as a social force, styled himself a 'materialist mujtahid', turned to the Bektashi and then defended the Baháʼí Faith as 'an intermediary step between Islam and the final abandonment of religious belief', and wrote in one poem 'We are pious infidels'. The same article records that at his funeral 'nobody claimed his coffin due to his alleged atheism', and its categories file him under 'Kurdish atheists' and 'Turkish atheists' — category filings, not text attestation. The Turkish article's infobox leaves its religion field blank; its text calls him 'accused of irreligion' (Dinsizlikle suçlanan) in the funeral account, and its categories likewise file him among atheist writers. Wikidata's only religion value is atheism (Q7066), a single unreferenced structured-data value. Hanioğlu's TDV İslâm Ansiklopedisi entry, read for this check, documents the same pattern — the Dozy translation made him known as an enemy of religion, İctihad published articles against religion, and in 1922 he recommended that Baháʼísm be accepted as a new religion — without settling him as an atheist. The atheist reading thus rests on category filings, one structured value and the accusations of his religious opponents, while the fullest scholarly tradition documents a project of fusing Islam with materialism; that is doubt, and under the doubt rule no atheist-or-sceptic value is recorded. Both readings are preserved here and in the prose."
