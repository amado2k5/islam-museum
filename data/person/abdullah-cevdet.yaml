summary:
  ar: "طبيب وشاعر ومفكر كردي تركي (1869–1932)، أحد طلاب الطبية الخمسة الذين أسسوا جمعية الاتحاد العثماني سنة 1889، نواة جمعية الاتحاد والترقي. من أبرز دعاة التغريب في أواخر الدولة العثمانية؛ ترجم بوخنر ودولباخ، وأصدر مجلة «إجتهاد» من 1904 حتى وفاته، وحُوكم مرارًا بسبب كتابات عدّها خصومه كفرًا؛ وأقرّ أتاتورك بأن عددًا من مقترحاته كان في أصل إصلاحاته."
  en: "Kurdish-Turkish physician, poet and thinker (1869–1932), one of the five medical students who founded the Ottoman Union Committee in 1889, the nucleus of the Committee of Union and Progress. A leading Westernist of the late Ottoman Empire, he translated Büchner and d'Holbach, published the journal İctihad from 1904 until his death, and was repeatedly prosecuted over writings his opponents called blasphemous; Atatürk acknowledged several of his proposals among the ideas behind the Turkish reforms."
  ur: "کرد ترک طبیب، شاعر اور مفکر (1869–1932)، طب کے ان پانچ طلبہ میں سے ایک جنھوں نے 1889 میں جمعیتِ اتحادِ عثمانی کی بنیاد رکھی جو آگے چل کر جمعیت اتحاد و ترقی بنی۔ متاخر عثمانی دور کے نمایاں مغربیت پسند؛ انھوں نے بوخنر اور دولباخ کا ترجمہ کیا، 1904 سے وفات تک رسالہ «اجتہاد» جاری رکھا، اور اپنی تحریروں پر بارہا مقدمات کا سامنا کیا؛ اتاترک نے اقرار کیا کہ ان کی کئی تجاویز ان کی اصلاحات کے پسِ پشت تھیں۔"
