summary:
  ar: "محمد بن علي الشوكاني (1173–1250هـ)، عالم يمني من صنعاء، تفقّه على المذهب الزيدي ثم ترك التقليد ودعا إلى الاجتهاد والأخذ بالدليل، وولي قضاء صنعاء في عهد ثلاثة من أئمة اليمن؛ صاحب «نيل الأوطار» و«فتح القدير» في التفسير الجامع بين الرواية والدراية، و«البدر الطالع»."
  en: "Muhammad ibn Ali al-Shawkani (1173–1250 AH / 1760–1834), a Yemeni scholar of Sana'a, trained in the Zaydi school, who abandoned imitation (taqlid) to call for independent reasoning from the evidence, and served as chief judge of Sana'a under three of Yemen's imams; author of Nayl al-Awtar, of the commentary Fath al-Qadir, which unites transmitted report and reasoned understanding, and of al-Badr al-Tali'."
  ur: "محمد بن علی شوکانی (1173–1250ھ / 1760–1834ء)، صنعاء کے یمنی عالم، جنہوں نے زیدی مسلک پر فقہ پڑھی پھر تقلید چھوڑ کر دلیل سے اجتہاد کی دعوت دی، اور یمن کے تین ائمہ کے دور میں صنعاء کے قاضی رہے؛ «نیل الاوطار»، روایت و درایت کو جمع کرنے والی تفسیر «فتح القدیر» اور «البدر الطالع» کے مصنف۔"
