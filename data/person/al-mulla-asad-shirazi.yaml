summary:
  ar: "الملا أسد بن الحسين الشيرازي الفارسي الشافعي مفتي الشافعية بدمشق؛ قدِم دمشق سنة أربع وستين وتسعمائة مع المنشي الملقب بشاه قلي والدي، وجاور بمسجد الشيخ رسلان عند خادمه شاكر أفندي لازماً للعبادة والزهد والعزلة وعدم الاختلاط مع الأشراف والرؤساء، فأعجب الشاميين وطلبتْه الأكابر والعلماء لكثرة معارفه ونزاهته، واتسق له الإفتاء في سنة خمس وسبعين؛ وكان يهذّب الناس بلسانه وقلمه وقالبه، وقد أفتى بجامع دمشق مدة طويلة بعد النابلسي ثم انقطع فأقام العلامة البعاني مكانه أياماً ثم رجع، وكان لا يأكل في مطعمه من مال الوقف أصلاً ولا يقبل الهدايا، وكان من أحسن الناس صورة وأبهمهم؛ توفي في جمادى الآخرة وصُلّي عليه بالجامع الأموي {cite:shadharat-dhahab p. 438-439}."
  en: "Molla Asad al-Shirazi — the Persian Shafi'i mufti of Damascus after al-Nabulsi; arrived 964 with munshi Shah Quli, lived in Shaykh Ruslan's mosque in zuhd and seclusion, never eating waqf food or taking gifts; handsome and awe-inspiring; died Jumada II 998 {cite:shadharat-dhahab p. 438-439}."
died: { edtf: "1590-04~", hijri: "0998-06", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في جمادى الآخرة وصُلّي عليه بالجامع الأموي؛ التحويل مشتق {cite:shadharat-dhahab p. 439}", sources: [source/shadharat-dhahab] }
