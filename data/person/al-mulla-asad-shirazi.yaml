summary:
  ar: "الملا أسد بن الحسين الشيرازي الفارسي الشافعي مفتي الشافعية بدمشق؛ قدِم دمشق سنة أربع وستين وتسعمائة مع المنشي الملقب بشاه قلي والدي، وجاور بمسجد الشيخ رسلان عند خادمه شاكر أفندي لازماً للعبادة والزهد والعزلة وعدم الاختلاط مع الأشراف والرؤساء، فأعجب الشاميين وطلبتْه الأكابر والعلماء لكثرة معارفه ونزاهته، واتسق له الإفتاء في سنة خمس وسبعين؛ وكان يهذّب الناس بلسانه وقلمه وقالبه، وقد أفتى بجامع دمشق مدة طويلة بعد النابلسي ثم انقطع فأقام العلامة البعاني مكانه أياماً ثم رجع، وكان لا يأكل في مطعمه من مال الوقف أصلاً ولا يقبل الهدايا، وكان من أحسن الناس صورة وأبهمهم؛ توفي في جمادى الآخرة وصُلّي عليه بالجامع الأموي {cite:shadharat-dhahab p. 438-439}."
  en: "Molla Asad al-Shirazi — the Persian Shafi'i mufti of Damascus after al-Nabulsi; arrived 964 with munshi Shah Quli, lived in Shaykh Ruslan's mosque in zuhd and seclusion, never eating waqf food or taking gifts; handsome and awe-inspiring; died Jumada II 998 {cite:shadharat-dhahab p. 438-439}."
  fr: "Molla Asad al-Shirazi - le mufti persan Shafi'i de Damas après al-Nabulsi ; arrivé 964 avec munshi Shah Quli, vivait dans la mosquée de Shaykh Ruslan en zuhd et en isolement, ne mangeant jamais de waqf ou ne prenant pas de cadeaux ; beau et impressionnant ; mort Jumada II 998 {cite:shadharat-dhahab p. 438-439}."
  es: "Molla Asad al-Shirazi — el muftí shafi'í persa de Damasco después de al-Nabulsi; llegó en 964 con el munshi Shah Quli, vivió en la mezquita de Shaykh Ruslan en zuhd y reclusión, nunca comió alimentos waqf ni aceptó regalos; apuesto e imponente; murió en Jumada II de 998 {cita: shadharat-dhahab págs. 438-439}."
  ur: "مولا اسد الشیرازی - النبلسی کے بعد دمشق کے فارسی شافعی مفتی؛ منشی شاہ قلی کے ساتھ 964 میں پہنچے، شیخ رسلان کی مسجد میں زہد اور خلوت میں رہتے تھے، کبھی وقف کھانا نہیں کھاتے تھے اور نہ تحفہ لیتے تھے۔ خوبصورت اور خوفناک؛ متوفی جمادی الثانی 998۔ 438-439}۔"
  tr: "Şam'ın Şafi müftüsü Mela Esad bin el-Hüseyin el-Şirazi el-Farsi el-Şafii, 1964'te Şah Kule Veldi lakaplı el-Munşi ile birlikte Şam'a geldi ve ibadete, münzeviye, inzivaya ve soylularla ve liderlerle uğraşmaktan kaçınmaya kendini adamış hizmetkârı Şakir Efendi'nin yanında Şeyh Ruslan Camii'nde yaşadı. Bilgisi ve dürüstlüğü nedeniyle Suriyelileri ve kıdemli öğrencilerini ve alimlerini takdir etti. 75 Hicri yılında fetvalar vermede tutarlı oldu; dili, kalemi ve üslubu ile insanları saflaştırdı. El-Nabus'tan sonra uzun süre Şam Camii'nde fetva verdi, ardından birkaç gün onun yerine oturmadı Sonra geri döndü ve vakıf parasından restoranında hiç yemek yemedi, hediye kabul etmedi. En güzel ve en önde gelen kişilerden biriydi; Cumevad-Ahira'da öldü ve Emevi Camii'nde namaz kılıldı {kaynak:shadharat-dhahab, s. 438-439}."
  id: "Mulla Asad ibn al-Husayn al-Shirazi al-Farsi al-Shafi'i, mufti Shafi'i Damaskus, tiba di Damaskus pada tahun 1964 bersama al-Munshi, yang dijuluki Shah Quli Waldi, dan tinggal di Masjid Sheikh Ruslan di bawah pelayannya Shakir Effendi, yang berkomitmen pada ibadah, asketisme, menyendiri, dan menghindari bergaul dengan bangsawan dan pemimpin. Ia mengagumi orang Suriah serta murid-murid senior dan ulamanya karena pengetahuan dan integritasnya yang melimpah. Ia menjadi konsisten mengeluarkan fatwa pada tahun 75 H; ia menyempurnakan orang dengan lidah, pena, dan gayanya. Ia mengeluarkan fatwa di Masjid Damaskus untuk waktu yang lama setelah al-Nabulsi, kemudian berhenti tinggal di tempatnya selama beberapa hari Kemudian ia kembali, dan ia tidak pernah makan di restorannya dari uang abadi maupun menerima hadiah. Ia termasuk di antara orang paling cantik dan terkemuka; ia meninggal di Jumada al-Akhirah dan didoakan di Masjid Umayyah {cite:shadharat-dhahab, hlm. 438-439}."
