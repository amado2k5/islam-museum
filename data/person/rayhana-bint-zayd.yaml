perspectives:
- tradition: sunni
  id: report-1
  stance:
    ar: ابن إسحاق في «الكبرى»
  summary:
    ar: 'سباها رسول الله فأبت إلا اليهودية، فوجد في نفسه، فبينما هو مع أصحابه إذ سمع وقع نعلين خلفه فقال: «هذا ثعلبة بن سعية يبشرني بإسلام ريحانة»، فبشره. وعرض عليها أن يعتقها ويتزوجها ويضرب عليها الحجاب فقالت: «يا رسول الله، بل تتركني في ملكك، فهو أخف علي وعليك»، فتركها.'
  evidence:
  - ref: source/ibn-hajar-isaba
    note:
      ar: ص 1877
  sources:
  - source/ibn-hajar-isaba
- tradition: sunni
  id: report-2
  stance:
    ar: ابن سعد عن الواقدي
  summary:
    ar: لما سُبيت بنو قريظة عرضت السبي على النبي فعزلها، ثم أرسلها إلى بيت أم المنذر بنت قيس حتى قُتل الأسرى وفُرّق السبي، فدخل إليها فاختبأت حياء، فدعاها وخيّرها فاختارت الله ورسوله فأعتقها وتزوج بها، ولم تزل عنده حتى ماتت.
  evidence:
  - ref: source/ibn-hajar-isaba
    note:
      ar: ص 1878
  sources:
  - source/ibn-hajar-isaba
- tradition: sunni
  id: report-3
  stance:
    ar: محمد بن كعب (عن ابن سعد)
  summary:
    ar: 'كانت مما أفاء الله على رسوله، فلما قُتل زوجها وقعت في السبي فخيّرها رسول الله فاختارت الإسلام فأعتقها وتزوجها وضرب عليها الحجاب، فغارت عليه غيرة شديدة فطلقها فشق عليها وأكثرت البكاء فراجعها، فكانت عنده حتى ماتت قبل وفاته. ويردّ الواقدي رواية الزهري أنه لما طلقها كانت في أهلها وقالت: «لا يراني أحد بعده»، بأنها وهم، فإنها توفيت عنده.'
  evidence:
  - ref: source/ibn-hajar-isaba
    note:
      ar: ص 1878
  sources:
