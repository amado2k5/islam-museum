summary:
  ar: سبية من بني قريظة أو بني النضير؛ اختلفت الروايات هل أعتقها النبي وتزوجها وضرب عليها الحجاب أم بقيت في ملكه، وماتت قبل وفاة النبي وقيل عند رجوعه من حجة الوداع ودُفنت بالبقيع.
  en: A captive of Banu Qurayza or Banu al-Nadir; the reports differ on whether the Prophet freed and married her and put the veil on her or she remained in his possession; she died before the Prophet, or on his return from the Farewell Pilgrimage,
    and was buried at al-Baqi'.
  ur: "بنو قریظہ یا بنو نضیر کی قیدی؛ روایات مختلف ہیں کہ نبی نے اسے آزاد کر کے شادی کی اور پردہ کیا یا وہ اسی حالت میں رہی۔"
  es: "Cautiva de Banu Qurayza o Banu al-Nadir; los relatos difieren sobre si el Profeta la liberó, se casó con ella y le puso el velo, o si permaneció bajo su custodia; murió antes que el Profeta, o a su regreso de la Peregrinación de Despedida, y fue enterrada en al-Baqi'."
  fr: "Captive des Banu Qurayza ou des Banu al-Nadir; les récits divergent quant à savoir si le Prophète l'a libérée, l'a épousée et lui a mis le voile ou si elle est restée en sa possession; elle est décédée avant le Prophète, ou à son retour du Pèlerinage d'Adieu, et a été enterrée à al-Baqi'."
  tr: "Banu Qurayza veya Banu Nadir'den bir esiri vardır; rivayetler, Peygamber'in onu özgür bırakıp evlenip üzerine örtü örtüsü mi yoksa onun mülkiyetinde kalıp Peygamber'in ölümünden önce mi öldüğü konusunda farklılık gösterir. Bazıları onun Veda Hacından döndüğünü ve El-Baqi'ye gömüldüğünü söyler."
  id: "Seorang tawanan dari Banu Qurayza atau Banu Nadir; riwayat berbeda apakah Nabi membebaskannya, menikahinya, dan mengenakan kerudung padanya, atau apakah dia tetap berada dalam miliknya dan meninggal sebelum Nabi wafat. Beberapa mengatakan dia kembali dari Ziarah Perpisahan dan dimakamkan di Al-Baqi'."
