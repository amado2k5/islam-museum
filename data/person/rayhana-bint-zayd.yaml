summary:
  ar: سبية من بني قريظة أو بني النضير؛ اختلفت الروايات هل أعتقها النبي وتزوجها وضرب عليها الحجاب أم بقيت في ملكه، وماتت قبل وفاة النبي وقيل عند رجوعه من حجة الوداع ودُفنت بالبقيع.
  en: A captive of Banu Qurayza or Banu al-Nadir; the reports differ on whether the Prophet freed and married her and put the veil on her or she remained in his possession; she died before the Prophet, or on his return from the Farewell Pilgrimage,
    and was buried at al-Baqi'.
