summary:
  en: "Cousin and son-in-law of the Prophet and the fourth caliph (r. 656–661 CE); the first Imam in Shia tradition. The Encyclopaedia of Islam says he was one of the first to believe, took part in almost all the expeditions of Muhammad's lifetime, and was chosen caliph in Medina on 18 Dhu al-Hijja 35 AH after the killing of Uthman. His reign saw the Battle of the Camel, the fighting at Siffin, the arbitration and the break with the Kharijites at al-Nahrawan. A Kharijite struck him at the door of the mosque of Kufa in 40 AH, and he died about two days later."
  ar: "ابن عم النبي وصهره ورابع الخلفاء ⁦(حكم 656–661م)⁩، وهو الإمام الأول عند الشيعة. تذكر دائرة المعارف الإسلامية أنه من أوائل المؤمنين وشارك في أغلب غزوات عهد محمد، وبويع بالمدينة في 18 ذي الحجة 35هـ بعد مقتل عثمان. وشهد عهده معركة الجمل والقتال في صفين والتحكيم والقطيعة مع الخوارج في النهروان. وضربه خارجي عند باب مسجد الكوفة سنة 40هـ فتوفي بعد نحو يومين."
  ur: "نبی کے چچا زاد اور داماد اور چوتھے خلیفہ ⁦(656–661ء)⁩؛ شیعہ روایت میں پہلے امام۔ دائرۃ المعارف اسلامیہ کے مطابق وہ اولین ایمان لانے والوں میں تھے، محمد کی حیات میں تقریباً تمام مہمات میں شریک رہے، اور عثمان کے قتل کے بعد 18 ذوالحجہ 35ھ کو مدینہ میں خلیفہ منتخب ہوئے۔ ان کے دور میں جنگ جمل، صفین کی لڑائی، تحکیم اور نہروان میں خوارج سے قطع تعلق پیش آیا۔ 40ھ میں ایک خارجی نے کوفہ کی مسجد کے دروازے پر انہیں مارا اور وہ تقریباً دو دن بعد فوت ہوئے۔"
