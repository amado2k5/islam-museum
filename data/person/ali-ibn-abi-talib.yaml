summary:
  en: Cousin and son-in-law of the Prophet and the fourth caliph (r. 656–661 CE); the first Imam in Shia tradition.
  ar: "ابن عم النبي وصهره ورابع الخلفاء (حكم 656–661م)، وهو الإمام الأول عند الشيعة. وفي الصحيح قال له النبي «أما ترضى أن تكون مني بمنزلة هارون من موسى» {cite:sahih-al-bukhari 3706}، وعشية فتح خيبر قال «لأعطين الراية غداً رجلاً يفتح الله على يديه» فأتاه وهو يرمد فبصق في عينيه ودعا له فبرأ وأعطاه الراية وقال «لأن يهدي الله بك رجلاً واحداً خير لك من حمر النعم» {cite:sahih-al-bukhari 3701}، وانتزع أملاكاً كان عثمان أقطعها جماعة وقسم ما في بيت المال على الناس لم يفضل أحداً على أحد، وجاءه بنو أمية المتخلفون فقال له الوليد بن عقبة أما أنا فقتلت أبي صبراً وضربتني حداً وقال سعيد بن العاص أما سعيد فقتلت أباه وأما مروان فإنك شتمت أباه وعبت عثمان في ضمه إياه {cite:muruj-al-dhahab p. 646}، ومن خطبه بعد الحكمين قوله من دعا إلى هذه الحكومة فاقتلوه قتله الله ولو كان تحت عمامتي هذه، وإن هذين الرجلين الخاطئين تركا حكم الله وحكما بهوى أنفسهما فأماتا ما أحيا القرآن وأحييا ما أماته، وكنت فيما أمرت به كما قال أخو بني خثعم أمرتهم أمري بمنعرج اللوى فلم يستبينوا الرشد إلا ضحى الغد {cite:muruj-al-dhahab p. 692}، ومن مشاهد زهده أن سائلاً وقف عليه فلم يكن عندهم إلا ستة دراهم للدقيق فأمر بدفعها كلها، فما برح حتى ابتاع بعيراً بمائة وأربعين وأنسأه ثمانية أيام فباعه بمائتين فأتى فاطمة بالستين الباقية وقال هذه تصديق لما جاء به أبوك من جاء بالحسنة فله عشر أمثالها؛ وفي صبيحة ضربته وصيته المروية عن جعفر بن محمد كل امرئ ملاقيه ما يفر منه والأجل تساق النفس إليه وإن أفق فأنا ولي دمي وإن أمت فالقيامة ميعادي {cite:muruj-al-dhahab p. 712-714}، وعن ابن النديم أنه لما رأى من الناس طيرة عند وفاة النبي أقسم أن لا يضع عن ظهره رداءه حتى يجمع القرآن فجلس في بيته ثلاثة أيام حتى جمعه فهو أول مصحف جمع فيه القرآن من قلبه وكان عند آل جعفر، ورأى ابن النديم في زمانه عند أبي يعلى حمزة الحسني مصحفاً سقط منه أوراق بخطه يتوارثه بنو حسن على مر الزمان {cite:fihrist-ibn-al-nadim p. 70}، وعند مسلم كان «أبا تراب» أحب أسمائه إليه — سماه به النبي وهو يمسح التراب عن ظهره في المسجد {cite:sahih-muslim 2409}، وأدخله النبي تحت المرط المرحل مع فاطمة والحسنين وتلا آية التطهير {cite:sahih-muslim 2424}"
