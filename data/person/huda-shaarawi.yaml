summary:
  ar: "ناشطة نسوية وقومية مصرية (1879-1947)، مؤسسة الاتحاد النسائي المصري ورئيسته مدى حياتها، ومن مؤسسات الاتحاد النسائي العربي؛ وُلدت في المنيا لأسرة من كبار ملاك الصعيد، وقادت مظاهرات النساء في ثورة 1919، واشتهرت بخلعها النقاب علنًا سنة 1923 عند عودتها من مؤتمر روما النسائي الدولي."
  en: "Egyptian feminist and nationalist leader (1879–1947), founder of the Egyptian Feminist Union and its president for the rest of her life, and a founding figure of the Arab Feminist Union. Born at Minya into a wealthy Upper Egyptian landowning family, she led women's demonstrations in the 1919 revolution and became famous for publicly removing her face veil in 1923 on her return from the Rome congress of the International Woman Suffrage Alliance."
  ur: "مصری نسوانی و قوم پرست رہنما (1879-1947)، مصری نسوانی اتحاد کی بانی اور عمر بھر اس کی صدر، اور عرب نسوانی اتحاد کی بانی شخصیات میں سے ایک؛ منیا میں ایک زمیندار گھرانے میں پیدا ہوئیں، 1919 کی انقلابی تحریک میں خواتین کے مظاہروں کی قیادت کی، اور 1923 میں روم کانفرنس سے واپسی پر علانیہ نقاب اتارنے سے مشہور ہوئیں۔"
  es: "Líder feminista y nacionalista egipcia (1879-1947), fundadora de la Unión Feminista Egipcia y su presidenta durante el resto de su vida, y figura fundadora de la Unión Feminista Árabe. Nacida en Minya en el seno de una acaudalada familia terrateniente del Alto Egipto, lideró las manifestaciones femeninas en la revolución de 1919 y se hizo famosa por quitarse públicamente el velo facial en 1923 a su regreso del congreso de Roma de la Alianza Internacional por el Sufragio Femenino."
  fr: "Figure emblématique du féminisme et du nationalisme égyptien (1879-1947), elle fonda l'Union féministe égyptienne et en fut la présidente jusqu'à sa mort, et fut l'une des figures fondatrices de l'Union féministe arabe. Née à Minya dans une riche famille de propriétaires terriens de Haute-Égypte, elle mena les manifestations de femmes lors de la révolution de 1919 et devint célèbre pour avoir ôté publiquement son voile en 1923, à son retour du congrès de Rome de l'Alliance internationale pour le suffrage des femmes."
  tr: "Mısırlı feminist ve milliyetçi aktivist (1879-1947), Mısır Kadınlar Birliği'nin kurucusu ve ömür boyu başkanı, ayrıca Arap Kadınlar Birliği'nin kurucularından biri; Yukarı Mısır'da önde gelen bir toprak sahibi ailesinin çocuğu olarak Minya'da doğdu, 1919 devrimi sırasında kadın gösterilerine liderlik etti ve 1923'te Roma'daki Uluslararası Kadınlar Kongresi'nden döndüğünde niqabı kamuoyuna çıkarmasıyla ünlendi."
  id: "Seorang feminis Mesir dan aktivis nasionalis (1879-1947), pendiri dan presiden seumur hidup Persatuan Perempuan Mesir, serta salah satu pendiri Persatuan Perempuan Arab; lahir di Minya dari keluarga tuan tanah terkemuka di Mesir Hulu, ia memimpin demonstrasi perempuan selama revolusi 1919 dan menjadi terkenal karena secara terbuka melepas niqab pada tahun 1923 setelah kembali dari Kongres Perempuan Internasional di Roma."
