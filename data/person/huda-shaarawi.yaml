summary:
  ar: "ناشطة نسوية وقومية مصرية (1879-1947)، مؤسسة الاتحاد النسائي المصري ورئيسته مدى حياتها، ومن مؤسسات الاتحاد النسائي العربي؛ وُلدت في المنيا لأسرة من كبار ملاك الصعيد، وقادت مظاهرات النساء في ثورة 1919، واشتهرت بخلعها النقاب علنًا سنة 1923 عند عودتها من مؤتمر روما النسائي الدولي."
  en: "Egyptian feminist and nationalist leader (1879–1947), founder of the Egyptian Feminist Union and its president for the rest of her life, and a founding figure of the Arab Feminist Union. Born at Minya into a wealthy Upper Egyptian landowning family, she led women's demonstrations in the 1919 revolution and became famous for publicly removing her face veil in 1923 on her return from the Rome congress of the International Woman Suffrage Alliance."
  ur: "مصری نسوانی و قوم پرست رہنما (1879-1947)، مصری نسوانی اتحاد کی بانی اور عمر بھر اس کی صدر، اور عرب نسوانی اتحاد کی بانی شخصیات میں سے ایک؛ منیا میں ایک زمیندار گھرانے میں پیدا ہوئیں، 1919 کی انقلابی تحریک میں خواتین کے مظاہروں کی قیادت کی، اور 1923 میں روم کانفرنس سے واپسی پر علانیہ نقاب اتارنے سے مشہور ہوئیں۔"
