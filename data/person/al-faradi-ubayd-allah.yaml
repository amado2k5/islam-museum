label: { ar: "أبو أحمد الفرضي عبيد الله بن أحمد المقرئ" }
summary:
  ar: "عبيد الله بن أحمد بن علي بن مهران أبو أحمد الفرضي المقرئ المحدث، سمع القاضي المحاملي ويوسف بن يعقوب وحضر مجلس أبي بكر بن الأنباري، وكان إماماً ثقة ورعاً زاهداً لا يعلم العلم إلا لله خالصاً، يبتدئ كل يوم بإقراء القرآن ثم يروي الحديث بنفسه حتى يستنفد وسعه، وكان له سمت وهيبة لا يتحرك ولا يعبث بشيء في مجلسه، وكان أبو حامد الاسفراييني إذا جاءه الفرضي يقوم من مجلسه ويمشي إلى باب مسجده حافياً استقبالاً له وإجلالاً. توفي ببغداد سنة ست وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
