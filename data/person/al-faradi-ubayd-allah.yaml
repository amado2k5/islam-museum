id: person/al-faradi-ubayd-allah
class: person
label: { ar: "أبو أحمد الفرضي عبيد الله بن أحمد المقرئ", en: "Abu Ahmad al-Faradi Ubayd Allah ibn Ahmad al-Muqri'" }
summary:
  ar: "عبيد الله بن أحمد بن علي بن مهران أبو أحمد الفرضي المقرئ المحدث، سمع القاضي المحاملي ويوسف بن يعقوب وحضر مجلس أبي بكر بن الأنباري، وكان إماماً ثقة ورعاً زاهداً لا يعلم العلم إلا لله خالصاً، يبتدئ كل يوم بإقراء القرآن ثم يروي الحديث بنفسه حتى يستنفد وسعه، وكان له سمت وهيبة لا يتحرك ولا يعبث بشيء في مجلسه، وكان أبو حامد الاسفراييني إذا جاءه الفرضي يقوم من مجلسه ويمشي إلى باب مسجده حافياً استقبالاً له وإجلالاً. توفي ببغداد سنة ست وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
  en: "Ubayd Allah ibn Ahmad ibn Ali ibn Mihran, Abu Ahmad al-Faradi, reciter and transmitter of hadith. He heard the judge al-Muhamili and Yusuf ibn Ya'qub, and attended the majlis of Abu Bakr ibn al-Anbari. He was a trustworthy and pious imam, an ascetic who taught knowledge only for God's sake, in sincerity. Each day he began by teaching Qur'an recitation, then narrated hadith himself until he had spent his capacity. He had dignity and awe, and did not move or fidget with anything in his session. When al-Faradi came to him, Abu Hamid al-Isfarayini would rise from his seat and walk barefoot to the gate of his mosque, in welcome and honour. He died in Baghdad in 406 {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
