label: { ar: "أبو أحمد الفرضي عبيد الله بن أحمد المقرئ", en: "Abu Ahmad al-Faradi Ubayd Allah ibn Ahmad al-Muqri'", fr: "Abu Ahmad al-Faradi Ubayd Allah ibn Ahmad al-Muqri’", es: "Abu Ahmad al-Faradi Ubayd Allah ibn Ahmad al-Muqri'", ur: "ابو احمد الفرادی عبید اللہ ابن احمد المقری" }
summary:
  ar: "عبيد الله بن أحمد بن علي بن مهران أبو أحمد الفرضي المقرئ المحدث، سمع القاضي المحاملي ويوسف بن يعقوب وحضر مجلس أبي بكر بن الأنباري، وكان إماماً ثقة ورعاً زاهداً لا يعلم العلم إلا لله خالصاً، يبتدئ كل يوم بإقراء القرآن ثم يروي الحديث بنفسه حتى يستنفد وسعه، وكان له سمت وهيبة لا يتحرك ولا يعبث بشيء في مجلسه، وكان أبو حامد الاسفراييني إذا جاءه الفرضي يقوم من مجلسه ويمشي إلى باب مسجده حافياً استقبالاً له وإجلالاً. توفي ببغداد سنة ست وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
  en: "Ubayd Allah ibn Ahmad ibn Ali ibn Mihran, Abu Ahmad al-Faradi, reciter and transmitter of hadith. He heard the judge al-Muhamili and Yusuf ibn Ya'qub, and attended the majlis of Abu Bakr ibn al-Anbari. He was a trustworthy and pious imam, an ascetic who taught knowledge only for God's sake, in sincerity. Each day he began by teaching Qur'an recitation, then narrated hadith himself until he had spent his capacity. He had dignity and awe, and did not move or fidget with anything in his session. When al-Faradi came to him, Abu Hamid al-Isfarayini would rise from his seat and walk barefoot to the gate of his mosque, in welcome and honour. He died in Baghdad in 406 {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
  fr: "Ubayd Allah ibn Ahmad ibn Ali ibn Mihran, Abu Ahmad al-Faradi, récitant et transmetteur du hadith. Il entendit le juge al-Muhamili et Yusuf ibn Ya’qub et assista au cercle d’Abu Bakr ibn al-Anbari. Imam digne de confiance et pieux, ascète, il n’enseignait le savoir que pour Dieu, avec sincérité. Chaque jour, il commençait par enseigner la récitation coranique, puis rapportait lui-même le hadith jusqu’à épuiser ses forces. Il avait dignité et majesté et ne bougeait ni ne manipulait rien pendant sa séance. Lorsqu’al-Faradi venait le voir, Abu Hamid al-Isfarayini se levait et allait pieds nus à la porte de sa mosquée pour l’accueillir et l’honorer. Il mourut à Bagdad en 406 H {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
  es: "Ubayd Allah ibn Ahmad ibn Ali ibn Mihran, Abu Ahmad al-Faradi, recitador y transmisor de hadices. Escuchó al juez al-Muhamili y a Yusuf ibn Ya'qub, y asistió a la asamblea de Abu Bakr ibn al-Anbari. Fue un imán digno de confianza y piadoso, un asceta que enseñaba conocimiento únicamente por amor a Dios, con sinceridad. Cada día comenzaba enseñando la recitación del Corán, luego narraba hadices hasta agotar sus fuerzas. Poseía dignidad e imponencia, y permanecía impasible durante sus sesiones. Cuando al-Faradi lo visitaba, Abu Hamid al-Isfarayini se levantaba de su asiento y caminaba descalzo hasta la puerta de su mezquita, en señal de bienvenida y honor. Murió en Bagdad en el año 406 {cite:muntazam-ibn-al-jawzi j.7 p.278-279}."
  ur: "عبید اللہ بن احمد بن علی ابن مہران، ابو احمد الفرادی، قاری اور حدیث کی ترسیل کرنے والے۔ اس نے قاضی المحملی اور یوسف بن یعقوب کو سنا اور ابوبکر بن الانباری کی مجلس میں شرکت کی۔ وہ ایک ثقہ اور پرہیزگار امام تھے، ایک سنیاسی جو صرف خدا کی خاطر، اخلاص کے ساتھ علم سکھاتے تھے۔ ہر روز اس نے قرآن کی تلاوت شروع کی، پھر خود احادیث بیان کی یہاں تک کہ وہ اپنی استطاعت سے کام لے۔ اس کے پاس وقار اور خوف تھا، اور وہ اپنے سیشن میں کسی بھی چیز سے ہلا یا نہ جھکا۔ جب الفرادی اس کے پاس آتا تو ابو حامد اسفرائنی اپنی نشست سے اٹھتے اور ننگے پاؤں چلتے ہوئے ان کی مسجد کے دروازے تک خوش آمدید کہتے۔ ان کا انتقال بغداد میں 406 میں ہوا۔"
  tr: "Ubeydullah ibn Ahmed ibn Ali ibn Mihran, Ebu Ahmed el-Faradi, Kur'an okuyucusu ve hadis âlimi, Kadı el-Mahamili ve Yusuf ibn Yakub'dan hadis dinlemiş ve Ebu Bekr ibn el-Enberi'nin toplantılarına katılmıştır. Güvenilir, dindar ve zühd sahibi bir imam olup, ilimi yalnızca Allah rızası için aramıştır. Her güne Kur'an okuyarak başlar, sonra da hadis rivayet ederdi, ta ki kapasitesi tükenene kadar. Vakur bir duruşu ve sakinliği vardı; toplantılarında kıpırdamaz, yerinde dururdu. Ebu Hamid el-İsfaraini yanına geldiğinde, saygı ve hoş geldin işareti olarak yerinden kalkar ve yalınayak mescidinin kapısına kadar yürürdü. Hicri 406 yılında Bağdat'ta vefat etmiştir."
  id: "Ubayd Allah ibn Ahmad ibn Ali ibn Mihran, Abu Ahmad al-Faradi, seorang qari dan ulama hadits, mendengar hadits dari al-Qadi al-Mahamili dan Yusuf ibn Yaqub, dan menghadiri pertemuan Abu Bakr ibn al-Anbari. Beliau adalah seorang imam yang terpercaya, saleh, dan laku asketis yang mencari ilmu semata-mata karena Allah. Beliau memulai setiap hari dengan membaca Al-Quran dan kemudian meriwayatkan hadits sendiri hingga beliau tidak dapat berhenti. Beliau memiliki pembawaan dan ketenangan yang bermartabat; beliau tidak akan bergerak atau gelisah dalam pertemuan-pertemuannya. Ketika Abu Hamid al-Isfarayini datang kepadanya, beliau akan bangkit dari tempat duduknya dan berjalan tanpa alas kaki ke pintu masjidnya sebagai tanda penghormatan dan penyambutan. Beliau wafat di Baghdad pada tahun 406 Hijriah."
