summary:
  ar: "حاجب القاهر، قال الصولي كان أهوج سفاكاً للدماء قبيح السيرة كثير التلون والاستحالة مدمن الخمر ولولا جودة حاجبه سلامة لأهلك الحرث والنسل {cite:tarikh-khulafa-minhaj-1434 p. 599-600}.، وعند ابن الأثير دُلل مع الوزير الخصيبي يوم خلع القاهر سنة 322هـ، وكان القاهر يقول له يا سلامة إن تدبير يدي... {cite:kamil-ibn-al-athir p. 210}"
  en: "Al-Qahir's chamberlain; al-Suli says the caliph was reckless, blood-shedding, ill-mannered and wine-addicted — 'had it not been for the excellence of his chamberlain Salama, he would have ruined tillage and progeny' {cite:tarikh-khulafa-minhaj-1434 p. 599-600}."
