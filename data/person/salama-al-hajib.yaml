id: person/salama-al-hajib
class: person
label: { ar: "سلامة حاجب القاهر" }
summary:
  ar: "حاجب القاهر، قال الصولي كان أهوج سفاكاً للدماء قبيح السيرة كثير التلون والاستحالة مدمن الخمر ولولا جودة حاجبه سلامة لأهلك الحرث والنسل {cite:tarikh-khulafa-minhaj-1434 p. 599-600}. وعند ابن الأثير دُلل مع الوزير الخصيبي يوم خلع القاهر سنة 322هـ، وكان القاهر يقول له يا سلامة إن تدبير يدي... {cite:kamil-ibn-al-athir p. 210}"
  en: "Al-Qahir's chamberlain; al-Suli says the caliph was reckless, blood-shedding, ill-mannered and wine-addicted — 'had it not been for the excellence of his chamberlain Salama, he would have ruined tillage and progeny' {cite:tarikh-khulafa-minhaj-1434 p. 599-600}."
  es: "El chambelán de Al-Qahir; Al-Suli dice que el califa era imprudente, sanguinario, maleducado y adicto al vino: «de no haber sido por la excelencia de su chambelán Salama, habría arruinado la agricultura y la descendencia» {cite:tarikh-khulafa-minhaj-1434 p. 599-600}."
  fr: "Le chambellan d'Al-Qahir; al-Suli dit que le calife était imprudent, sanguinaire, mal élevé et ivrogne — « sans l'excellence de son chambellan Salama, il aurait ruiné les cultures et la descendance » {cite: tarikh-khulafa-minhaj-1434 p. 599-600}."
  ur: "القاہر کا چیمبرلین؛ السلی کہتے ہیں کہ خلیفہ لاپرواہ، خون بہانے والا، بد اخلاق اور شراب کا عادی تھا - 'اگر اس کے حجرہ سلامہ کی فضیلت نہ ہوتی تو وہ کھیتی اور اولاد کو برباد کر دیتا'۔ 599-600}۔"
