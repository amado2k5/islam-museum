id: person/abu-ishaq-al-fazari
class: person
label: { ar: "أبو إسحاق الفزاري", en: "Abu Ishaq al-Fazari" }
summary:
  ar: "إبراهيم بن محمد الفزاري، أبو إسحاق، فقيه الثغور وصاحب كتاب السير؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب هو ومخلد بن الحسين أنهم لم يروا شيئاً أشبه بأمر قبرس من أمر عربسوس وما حكم به عمر بن الخطاب فيها — عرض عليهم ضعف مالهم على الخروج منها أو نظرة سنة بعد النبذ فأبوا فأُنظروا ثم أُخربت — ونقل عن الأوزاعي أن قبرس صولحت على أربعة عشر ألف دينار سبعة للمسلمين وسبعة للروم على أن لا يكتموا الروم أمر المسلمين، وأن صلحهم لا يستقيم نقضه إلا بأمر يُعرف فيه غدرهم ونكثهم."
  en: "Ibrahim ibn Muhammad al-Fazari, Abu Ishaq, jurist of the frontier and author of the Kitab al-Siyar; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he with Makhlad ibn al-Husayn answered that they had seen nothing more like Cyprus's case than that of Arabasus and Umar's ruling in it — they were offered double their wealth to leave or a year's grace after denunciation, refused, were given the year, and it was ruined; he transmitted from al-Awza'i that Cyprus was compounded at fourteen thousand dinars, seven to the Muslims and seven to the Byzantines on condition they conceal nothing of the Muslims' affairs from the Byzantines, and that their treaty cannot rightly be annulled save for an act in which their treachery is known."
