id: person/abu-ishaq-al-fazari
class: person
label: { ar: "أبو إسحاق الفزاري", en: "Abu Ishaq al-Fazari", fr: "Abu Ishaq al-Fazari", es: "Abu Ishaq al-Fazari", ur: "ابو اسحاق الفزاری" }
summary:
  ar: "إبراهيم بن محمد الفزاري، أبو إسحاق، فقيه الثغور وصاحب كتاب السير؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب هو ومخلد بن الحسين أنهم لم يروا شيئاً أشبه بأمر قبرس من أمر عربسوس وما حكم به عمر بن الخطاب فيها — عرض عليهم ضعف مالهم على الخروج منها أو نظرة سنة بعد النبذ فأبوا فأُنظروا ثم أُخربت — ونقل عن الأوزاعي أن قبرس صولحت على أربعة عشر ألف دينار سبعة للمسلمين وسبعة للروم على أن لا يكتموا الروم أمر المسلمين، وأن صلحهم لا يستقيم نقضه إلا بأمر يُعرف فيه غدرهم ونكثهم."
  en: "Ibrahim ibn Muhammad al-Fazari, Abu Ishaq, jurist of the frontier and author of the Kitab al-Siyar; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he with Makhlad ibn al-Husayn answered that they had seen nothing more like Cyprus's case than that of Arabasus and Umar's ruling in it — they were offered double their wealth to leave or a year's grace after denunciation, refused, were given the year, and it was ruined; he transmitted from al-Awza'i that Cyprus was compounded at fourteen thousand dinars, seven to the Muslims and seven to the Byzantines on condition they conceal nothing of the Muslims' affairs from the Byzantines, and that their treaty cannot rightly be annulled save for an act in which their treachery is known."
  fr: "Ibrahim ibn Muhammad al-Fazari, Abu Ishaq, juriste de la frontière et auteur du Kitab al-Siyar ; chez al-Baladhuri : Abd al-Malik ibn Salih lui écrivit pour le consulter sur les gens de Chypre, et lui et Makhlad ibn al-Husayn répondirent qu'ils ne voyaient rien de plus semblable au cas de Chypre que celui d'Arabasus et le jugement qu'y rendit Umar — on leur offrit le double de leurs biens pour partir ou un an de délai après dénonciation, ils refusèrent, reçurent l'année, et la ville fut ruinée ; il transmit d'al-Awza'i que Chypre avait traité pour quatorze mille dinars, sept pour les musulmans et sept pour les Byzantins, à condition de ne rien cacher aux musulmans des affaires des Byzantins, et que leur traité ne peut être légitimement rompu que pour un acte où leur trahison est connue."
  es: "Ibrahim ibn Muhammad al-Fazari, Abu Ishaq, jurista de la frontera y autor del Kitab al-Siyar; en al-Baladhuri: Abd al-Malik ibn Salih le escribió consultándole sobre el pueblo de Chipre, y él con Makhlad ibn al-Husayn respondió que no habían visto nada más parecido al caso de Chipre que el de Arabasus y el gobierno de Umar en ella: se les ofreció el doble de su riqueza para que se fueran o un año de gracia después de la denuncia, se negaron, se les dio el año y se arruinó; transmitió de al-Awza'i que Chipre fue liquidada por catorce mil dinares, siete para los musulmanes y siete para los bizantinos con la condición de que no ocultaran nada de los asuntos de los musulmanes a los bizantinos, y que su tratado no puede ser legítimamente anulado salvo por un acto en el que se conozca su traición."
  ur: "ابراہیم بن محمد الفزاری، ابو اسحاق، سرحد کے فقیہ اور کتاب السیار کے مصنف؛ البلاذری میں ہے: عبد الملک بن صالح نے قبرص کے لوگوں کے بارے میں ان سے مشورہ کرتے ہوئے لکھا، اور اس نے مقلد بن الحسین کے ساتھ جواب دیا کہ انہوں نے قبرص کا معاملہ عرباس اور عمر کے حکم سے زیادہ کچھ نہیں دیکھا - انہیں ان کے جانے کے لئے دوگنا مال کی پیشکش کی گئی یا ایک سال کے بعد رعایت دی گئی، اور ایک سال کے بعد اس سے انکار کر دیا گیا۔ برباد اس نے الاوزاعی سے نقل کیا ہے کہ قبرص کو چودہ ہزار دینار میں ملایا گیا، سات مسلمانوں کو اور سات بازنطینیوں کو اس شرط پر کہ وہ مسلمانوں کے معاملات میں بازنطینیوں سے کچھ نہ چھپائیں، اور یہ کہ ان کا معاہدہ صحیح طور پر منسوخ نہیں کیا جا سکتا سوائے اس عمل کے جس میں ان کی خیانت کا علم ہو۔"
  tr: "İbrahim bin Muhammed el-Fazari, sınır bölgelerinin hukukçusu ve biyografi kitabının yazarı Ebu İshak; el-Baladhuri'ye göre: Abd el-Malik bin Salih, Kıbrıs halkı meselesi hakkında görüşünü sormak için ona yazdı ve o ve Mukhallad bin el-Hüseyn, Kıbrıs meselesine en çok benzeyen şeyin Arabsus meselesi ve Ömer bin el-Hattab'ın onun hakkında verdiği hüküm olduğunu söylediler. Ömer, Kıbrıs'tan ayrılmaları için onlara paralarının iki katını veya reddetmeleri halinde bir yıllık süre teklif etti, ancak onlar reddettiler, bu yüzden onlara bir süre verildi ve sonra Kıbrıs yıkıldı. Ayrıca el-Awza'i'den rivayet edildiğine göre, Kıbrıs'a on dört bin dinar karşılığında barış sağlandı; yedisi Müslümanlara, yedisi Romalılara. Şart şuydu ki, Romalılar Müslümanların meselesini gizlemeyecek ve barışları ancak ihanetleri ve ahdi bozdukları ortaya çıkacak bir durumla geçerli bir şekilde bozulacaktı."
  id: "Ibrahim bin Muhammad al-Fazari, Abu Ishaq, ahli hukum daerah perbatasan dan penulis buku biografi; menurut al-Baladhuri: Abd al-Malik bin Salih menulis surat kepadanya untuk meminta pendapatnya tentang masalah penduduk Siprus, dan dia dan Mukhallad bin al-Husayn menjawab bahwa mereka belum pernah melihat sesuatu yang lebih mirip dengan masalah Siprus selain masalah Arabsus dan apa yang telah diputuskan oleh Umar bin al-Khattab mengenainya — dia menawarkan mereka dua kali lipat uang mereka untuk meninggalkannya atau masa tenggang satu tahun setelah penolakan, tetapi mereka menolak, sehingga mereka diberi masa tenggang, kemudian dihancurkan — dan diriwayatkan dari al-Awza’i bahwa Siprus didamaikan dengan empat belas ribu dinar, tujuh untuk kaum Muslim dan tujuh untuk Romawi, dengan syarat bahwa Romawi tidak akan menyembunyikan masalah kaum Muslim, dan bahwa perdamaian mereka tidak akan dilanggar secara sah kecuali oleh suatu hal yang akan mengungkap pengkhianatan dan pelanggaran perjanjian mereka."
