  ar: "شيخ القراء، صاحب الشاطبي وزوج بنته؛ قرأ القراءات على الشاطبي وشجاع المدلجي وأبي الجود وسمع من البوصيري وطائفة وتصدر للإقراء دهراً وانتهت إليه رئاسة الإقراء؛ وكان إماماً يجري في فنون من العلم وفيه تودد وتواضع ولين ومروءة تامة {cite:shadharat-dhahab p. 532}."
