  fr: "Cheikh de la qurra' — le propre compagnon et gendre d'al-Shatibi (né en 572); a lu sur al-Shatibi, Shuja' al-Mudlaji et Abu al-Jud; la direction de la récitation en Égypte s'est terminée avec lui; 'un imam courant dans de nombreux domaines de la connaissance' {cite: shadharat-dhahab p. 532}."
  ur: "شیخ قرہ - الشاطبی کے اپنے ساتھی اور داماد ⁦(متوفی 572)⁩؛ الشاطبی، شجاع المدلجی اور ابو الجود پر پڑھیں۔ مصر میں قراء ت کی سرداری اس پر ختم ہوئی۔ 'علم کے بہت سے میدانوں میں چلنے والا امام' 532}۔"
