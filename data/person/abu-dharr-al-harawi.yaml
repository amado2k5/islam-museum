summary:
  ar: "عبد بن أحمد الأنصاري المالكي المعروف بابن السماك؛ سمع بهراة وسرخس وبلخ ومرو والبصرة وبغداد ودمشق ومصر وجاور بمكة وألف معجماً لشيوخه، قدم بغداد وحدث بها ثم حج وجاور وسكن السروات وكان يحج كل عام ويحدث ويرجع، وكان ثقة ضابطاً ديناً زاهداً سخياً وصار كبير مشيخة الحرم مشاراً إليه في التصوف، وأكثر نسخ البخاري الصحيحة بالمغرب إما من رواية الباجي عنه وإما من رواية ابن سكرة بسنده، وتوفي سنة 435هـ وقيل 434هـ، وكان سبب تمذهبه بالمالكية شهودَه الدارقطني يلتزم القاضي أبا بكر ابن الطيب ويقبل وجهه حتى قال له هذا إمام المسلمين فتمذهب بمذهبه {cite:nafh-tib-maqqari p. 72-73}."
  en: "The Meccan Maliki master Ibn al-Sammak through whom al-Baji carried Bukhari's Sahih to the Maghreb — a wandering transmitter of Herat who settled in the Sirat, pilgrimaged yearly, and died in 434 or 435 {cite:nafh-tib-maqqari p. 72-73}."
  fr: "Le maître malikite mecquois Ibn al-Sammak par qui al-Baji porta le Sahih d'al-Bukhari au Maghreb — transmetteur itinérant de Hérat qui s'établit dans les Sarawat, fit le pèlerinage chaque année, et mourut en 434 ou 435 {cite:nafh-tib-maqqari p. 72-73}."
  es: "El maestro malikí de La Meca, Ibn al-Sammak, a través del cual al-Baji llevó el Sahih de Bukhari al Magreb, fue un transmisor itinerante de Herat que se estableció en Sirat, peregrinaba anualmente y murió en 434 o 435 {cite:nafh-tib-maqqari p. 72-73}."
  ur: "مکی مالکی ماسٹر ابن الصمق جس کے ذریعے الباجی نے بخاری کی صحیح کو مغرب تک پہنچایا - ہرات کا ایک آوارہ ٹرانسمیٹر جو سیرت میں آباد ہوا، ہر سال حج کرتا تھا، اور 434 یا 435 میں فوت ہوا تھا۔ 72-73}۔"
  tr: "İbn el-Sammak olarak bilinen Abd ibn Ahmed el-Ensari el-Maliki, Herat, Sarakhs, Belh, Merv, Basra, Bağdat, Şam ve Mısır'da hadis rivayet etmiştir. Mekke'de ikamet etmiş ve şeyhlerinin biyografik bir sözlüğünü derlemiştir. Bağdat'a gelmiş ve orada hadis rivayet etmiş, ardından Hac yapmış ve Sarawat Dağları'nda ikamet etmiştir. Her yıl Hac yapar, hadis rivayet eder ve geri dönerdi. Güvenilir, titiz, dindar, zümreye bağlı ve cömert bir kişiydi. Haram'ın baş şeyhi olmuş ve tasavvufuyla tanınmıştır. Mağrip'teki Buhari'nin sahih nüshalarının çoğu ya el-Baji tarafından ondan ya da İbn Sukrah tarafından onun isnadıyla rivayet edilmiştir. Hicri 435 yılında veya 434 yılında vefat etmiştir. Maliki mezhebini benimsemesinin sebebi, el-Daraqutni'nin kadı Ebu Bekir İbn el-Tayyib'i kucaklayıp yüzünü öptüğüne ve ona, \"İşte Müslümanların imamı budur\" dediğine şahit olması ve bu yüzden onun mezhebini benimsemesidir. {cite:nafh-tib-maqqari s. 72-73}"
  id: "Abd ibn Ahmad al-Ansari al-Maliki, yang dikenal sebagai Ibn al-Sammak, mendengar hadits di Herat, Sarakhs, Balkh, Merv, Basra, Baghdad, Damaskus, dan Mesir. Ia tinggal di Mekah dan menyusun kamus biografi para syekhnya. Ia datang ke Baghdad dan meriwayatkan hadits di sana, kemudian menunaikan ibadah haji dan tinggal di Pegunungan Sarawat. Ia biasa menunaikan ibadah haji setiap tahun, meriwayatkan hadits, dan kembali. Ia adalah orang yang dapat dipercaya, teliti, religius, sakti, dan dermawan. Ia menjadi syekh utama di Haram dan dikenal karena Sufismenya. Sebagian besar salinan otentik al-Bukhari di Maghreb diriwayatkan oleh al-Baji darinya atau oleh Ibn Sukrah dengan sanadnya. Ia wafat pada tahun 435 H, atau dikatakan juga 434 H. Alasan dia memeluk mazhab Maliki adalah karena dia menyaksikan al-Daraqutni memeluk hakim Abu Bakr Ibn al-Tayyib dan mencium wajahnya hingga berkata kepadanya, “Inilah imam kaum Muslimin,” sehingga dia memeluk mazhab tersebut. {cite:nafh-tib-maqqari hlm. 72-73}."
