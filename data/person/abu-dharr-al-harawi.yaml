summary:
  ar: "عبد بن أحمد الأنصاري المالكي المعروف بابن السماك؛ سمع بهراة وسرخس وبلخ ومرو والبصرة وبغداد ودمشق ومصر وجاور بمكة وألف معجماً لشيوخه، قدم بغداد وحدث بها ثم حج وجاور وسكن السروات وكان يحج كل عام ويحدث ويرجع، وكان ثقة ضابطاً ديناً زاهداً سخياً وصار كبير مشيخة الحرم مشاراً إليه في التصوف، وأكثر نسخ البخاري الصحيحة بالمغرب إما من رواية الباجي عنه وإما من رواية ابن سكرة بسنده، وتوفي سنة 435هـ وقيل 434هـ، وكان سبب تمذهبه بالمالكية شهودَه الدارقطني يلتزم القاضي أبا بكر ابن الطيب ويقبل وجهه حتى قال له هذا إمام المسلمين فتمذهب بمذهبه {cite:nafh-tib-maqqari p. 72-73}."
  en: "The Meccan Maliki master Ibn al-Sammak through whom al-Baji carried Bukhari's Sahih to the Maghreb — a wandering transmitter of Herat who settled in the Sirat, pilgrimaged yearly, and died in 434 or 435 {cite:nafh-tib-maqqari p. 72-73}."
