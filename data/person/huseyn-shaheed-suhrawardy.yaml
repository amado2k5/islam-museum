summary:
  ar: "رجل دولة بنغالي (1892–1963)، آخر رئيس وزراء للبنغال الموحدة (1946–1947) وخامس رئيس وزراء لباكستان (1956–1957). أسس رابطة عوامي وقاد الجبهة المتحدة في باكستان الشرقية، وخلف خواجة ناظم الدين في رئاسة وزراء البنغال، وتوفي في بيروت ودُفن في ضريح القادة الثلاثة في دكا."
  en: "Bengali statesman (1892–1963), the last prime minister of undivided Bengal (1946–1947) and the fifth prime minister of Pakistan (1956–1957). He founded the Awami League, led the United Front in East Pakistan, and succeeded Khawaja Nazimuddin as prime minister of Bengal; he died at Beirut and was buried in the Mausoleum of Three Leaders at Dhaka."
  ur: "بنگالی مدبر (1892ء–1963ء)، غیر منقسم بنگال کے آخری وزیر اعظم (1946ء–1947ء) اور پاکستان کے پانچویں وزیر اعظم (1956ء–1957ء)۔ عوامی لیگ کی بنیاد رکھی، مشرقی پاکستان میں متحدہ محاذ کی قیادت کی، اور خواجہ ناظم الدین کے بعد بنگال کے وزیر اعظم بنے؛ بیروت میں انتقال ہوا اور ڈھاکہ میں تین قائدین کے مزار میں دفن ہوئے۔"
