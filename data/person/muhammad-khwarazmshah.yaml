id: person/muhammad-khwarazmshah
class: person
label: { ar: "خوارزم شاه علاء الدين محمد" }
summary:
  ar: "سلطان خوارزم، ظهر بخراسان وما وراء النهر وتجبر وطغى واستعبد الملوك الكبار وأباد أمماً كثيرة وقطع خطبة بني العباس من بلاده وقصد بغداد فوقع على عسكره بهمدان ثلج عظيم عشرين يوماً فرجع، وفي سنة اثنتين وتسعين عدا جيحون في خمسين ألفاً وبعث إلى الناصر يطلب السلطنة وإعادة دار السلطنة وأن يكون الخليفة من تحت يده كما كانت الملوك السلجوقية فهدم الخليفة دار السلطنة ورد رسوله بلا جواب {cite:tarikh-khulafa-minhaj-1434 p. 687,694}، ثم غدر بتجار التتار وقتل رسل جنكزخان فسار إليه فهرب إلى جزيرة فمات بها وحيداً وكفن في شاش فراش كان معه سنة سبع عشرة وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 713-714}. وكان صاحب إقدام فنازل التتار بجيوشه فخطر له أن يكشفهم فتنكر ولبس زيهم هو وثلاثة ودخلوا فيهم فأنكرتهم التتار وقبضوا عليهم وقرروهم فمات اثنان تحت الضرب ولم يقرا وسميا على خوارزم شاه ورفيقه فهربا في الليل {cite:shadharat-dhahab p. ~100}. ويذكر ابن الأثير في سيرته أنه ملك إحدى وعشرين سنة ولم يملك بعد السلجوقية أحد مثل ملكه من حد العراق إلى تركستان وغزنة وبعض الهند وسجستان وكرمان وطبرستان وجرجان وبلاد الجبال وخراسان وبعض فارس، وكان فاضلاً عالماً بالفقه والأصول مكرماً للعلماء محباً لهم صبوراً على التعب وإدمان السير غير متنعم، ويحكي عن خادم حجرة النبي أنه لما قصد باب السلطان بخوارزم أدخله عليه جالساً في صدر إيوان فقام إليه ومشى نحوه حتى لقيه في وسط الإيوان فمنعه من تقبيل يده واعتنقه وأجلسه إلى جانبه وأمر يده على وجهه وسأله عن المدينة وأطال الحديث معه {cite:kamil-ibn-al-athir p. 407-408}."
  en: "The Khwarazmshah who ruled Khurasan and Transoxiana, cut the Abbasid khutba and marched on Baghdad till twenty days of snow turned him; in 592 he crossed the Jayhun demanding the old Seljuk terms — the caliph razed the dar al-saltana and gave no answer {cite:tarikh-khulafa-minhaj-1434 p. 687,694}."
