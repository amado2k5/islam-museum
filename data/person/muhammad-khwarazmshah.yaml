id: person/muhammad-khwarazmshah
class: person
label: { ar: "خوارزم شاه علاء الدين محمد" , ur: "محمد خوارزم شاہ", en: "Muhammad Khwarazmshah", es: "Muhammad Khwarazmshah", fr: "Muhammad Khwarazmshah"}
summary:
  ar: "سلطان خوارزم، ظهر بخراسان وما وراء النهر وتجبر وطغى واستعبد الملوك الكبار وأباد أمماً كثيرة وقطع خطبة بني العباس من بلاده وقصد بغداد فوقع على عسكره بهمدان ثلج عظيم عشرين يوماً فرجع، وفي سنة اثنتين وتسعين عدا جيحون في خمسين ألفاً وبعث إلى الناصر يطلب السلطنة وإعادة دار السلطنة وأن يكون الخليفة من تحت يده كما كانت الملوك السلجوقية فهدم الخليفة دار السلطنة ورد رسوله بلا جواب {cite:tarikh-khulafa-minhaj-1434 p. 687,694}، ثم غدر بتجار التتار وقتل رسل جنكزخان فسار إليه فهرب إلى جزيرة فمات بها وحيداً وكفن في شاش فراش كان معه سنة سبع عشرة وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 713-714}. وكان صاحب إقدام فنازل التتار بجيوشه فخطر له أن يكشفهم فتنكر ولبس زيهم هو وثلاثة ودخلوا فيهم فأنكرتهم التتار وقبضوا عليهم وقرروهم فمات اثنان تحت الضرب ولم يقرا وسميا على خوارزم شاه ورفيقه فهربا في الليل {cite:shadharat-dhahab p. ~100}. ويذكر ابن الأثير في سيرته أنه ملك إحدى وعشرين سنة ولم يملك بعد السلجوقية أحد مثل ملكه من حد العراق إلى تركستان وغزنة وبعض الهند وسجستان وكرمان وطبرستان وجرجان وبلاد الجبال وخراسان وبعض فارس، وكان فاضلاً عالماً بالفقه والأصول مكرماً للعلماء محباً لهم صبوراً على التعب وإدمان السير غير متنعم، ويحكي عن خادم حجرة النبي أنه لما قصد باب السلطان بخوارزم أدخله عليه جالساً في صدر إيوان فقام إليه ومشى نحوه حتى لقيه في وسط الإيوان فمنعه من تقبيل يده واعتنقه وأجلسه إلى جانبه وأمر يده على وجهه وسأله عن المدينة وأطال الحديث معه {cite:kamil-ibn-al-athir p. 407-408}."
  en: "The Khwarazmshah who ruled Khurasan and Transoxiana, cut the Abbasid khutba and marched on Baghdad till twenty days of snow turned him; in 592 he crossed the Jayhun demanding the old Seljuk terms — the caliph razed the dar al-saltana and gave no answer {cite:tarikh-khulafa-minhaj-1434 p. 687,694}."
  ur: "خوارزم شاہی حکمران جس نے خراسان اور ماوراء النہر میں اقتدار بڑھایا؛ اس کی سلطنت کو منگول حملوں کا سامنا ہوا۔ {cite:shadharat-dhahab}"
  es: "El Khwarazmshah que gobernaba Jorasán y Transoxiana, cortó la jutba abasí y marchó sobre Bagdad hasta que veinte días de nieve lo hicieron retroceder; en 592 cruzó el Jayhun exigiendo los antiguos términos selyúcidas; el califa arrasó el dar al-saltana y no dio respuesta {cite:tarikh-khulafa-minhaj-1434 p. 687,694}."
  fr: "Le Khwarezmshah qui régnait sur le Khorasan et la Transoxiane, coupa le khutba abbasside et marcha sur Bagdad jusqu'à ce que vingt jours de neige le fassent tourner; en 592, il traversa le Jayhun en exigeant les anciennes conditions seldjoukides — le calife rasa le dar al-saltana et ne donna aucune réponse {cite:tarikh-khulafa-minhaj-1434 p. 687,694}."
  tr: "Horasan ve Transoksiana'da ortaya çıkan Harezm Sultanı, zorba, zorba ve büyük kralları köleleştirerek birçok ulusu yok etti, Abbasilerin komutasını topraklarından kopardı ve Bağdat'a yöneldi; burada Hamadan'da ordusuna yirmi gün ağır kar yağdı, böylece geri döndü. Doksan iki yılında, Cihun'da elli bin saydı ve el-Nasir'e sultanlığı talep ederek sultanlığı geri getirdi ve halifeyi Selçuklu kralları gibi kontrolü altına almak için el-Nasir'e gönderdi. Halife, sultanlığın konutunu yıktı ve elçisini geri gönderdi ancak cevap alamadı {cite:History-Khulafa-minhaj-1434, s. 713-714}. Cesur bir adamdı ve ordularıyla Tatarların üzerine indi. Onları ortaya çıkarmak istediğinde, kendisini ve üç kişiyi gizleyip aralarına girdi, ancak Tatarlar onları reddetti, yakaladı ve tutukladı. İkisi dövülerek öldü, ancak okumadı ve Khwarazm Şah ile yoldaşını isimlendirmedi, bu yüzden gece kaçtılar {cite:shadharat-dhahab s. ~100}. İbn al-Athir biyografisinde Selçuklu döneminden sonra yirmi bir yıl hüküm sürdüğünü ve kendisi gibi kimseyi yönetmediğini belirtir; Irak sınırından Türkistan, Gazni, Hindistan'ın bir kısmı, Sijistan, Kirman, Tabaristan, Jurcan, dağlık topraklar, Horasan ve bazı Perslere kadar. Erdemli, fıkıh ve prensipler konusunda bilgili, alimler tarafından saygı gören, onları seven, yorgunluk ve seyahat bağımlılığına sabırlı ve seyahatten hoşlanmadığı bir kişiydi. Peygamber'in odasının hizmetkârı hakkında, Sultan'ın kapısına geldiğinde onu bir ivanın önüne oturttuğunu, ona doğru durduğunu, ivanın ortasında karşılaşana kadar yürüdüğünü, ama elini öpmesini yasakladığını, kucakladığını, yanına oturttuğunu, elini yüzüne koyduğunu, Medine'yi sorduğunu ve uzun uzun konuştuğunu anlatır. {cite::) Kamil-ibn-al-Athir s. 407-408}."
  id: "Sultan Khwarezm, yang muncul di Khorasan dan Transoxiana, menjadi tiran, tirani, dan memperbudak raja-raja besar, memusnahkan banyak bangsa, memutuskan komando Abbasiyah dari wilayahnya dan menuju Baghdad, di mana salju lebat turun di pasukannya di Hamadan selama dua puluh hari, sehingga ia kembali. Pada tahun sembilan puluh dua, ia menghitung lima puluh ribu di Jihun, dan mengirim surat kepada al-Nasir menuntut kesultanan, mengembalikan kesultanan, dan agar khalifah berada di bawah kendalinya seperti raja-raja Seljuk. Khalifah menghancurkan kediaman kesultanan dan mengirim utusannya kembali tanpa jawaban {cite:History-Khulafa-minhaj-1434, hlm. 713-714}. Ia adalah pria yang berani dan menyerang Tatar dengan pasukannya. Ketika terpikir untuk membongkar mereka, ia menyamar bersama tiga orang lainnya lalu masuk ke antara mereka, tetapi Tatar menolak mereka, menangkap mereka, dan menangkap mereka. Dua orang tewas akibat pukulan, tetapi ia tidak membaca dan menyebut nama Khwarazm Shah dan rekannya, sehingga mereka melarikan diri pada malam hari {cite:shadharat-dhahab hlm. ~100}. Ibn al-Athir menyebutkan dalam biografinya bahwa ia memerintah selama dua puluh satu tahun dan tidak pernah memerintah siapa pun seperti dirinya setelah masa Seljuk, dari perbatasan Irak hingga Turkestan, Ghazni, sebagian India, Sijistan, Kerman, Tabaristan, Jurjan, tanah pegunungan, Khorasan, dan beberapa Persia. Ia berbudi luhur, berpengetahuan dalam hukum dan prinsip, dihormati oleh para cendekiawan, mencintai mereka, sabar dengan kelelahan dan kecanduan bepergian, dan tidak menikmati perjalanan. Ia menceritakan tentang pelayan ruang Nabi bahwa ketika ia sampai di pintu Sultan di Khwarezm, ia membawanya duduk di depan seorang iwan, berdiri menghadapnya, berjalan mendekat hingga bertemu di tengah iwan, tetapi melarangnya mencium tangannya, memeluknya, mendudukkannya di sampingnya, meletakkan tangan di wajahnya, bertanya tentang Madinah, dan berbicara panjang lebar {cite::Kamil-ibn-al-Athir hlm. 407-408}."
