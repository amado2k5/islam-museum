kids:
  ar: "ابن ميمون طبيب وفيلسوف وُلد في قرطبة وعاش في مصر، وكتب بالعربية كتاباً لمن حاروا في أسئلة الإيمان والعقل."
  en: "Maimonides was a doctor and thinker born in Cordova who lived in Egypt and wrote in Arabic a book for people puzzled about faith and reason."
  ur: "ابن میمون قرطبہ میں پیدا ہونے والے طبیب اور مفکر تھے جو مصر میں رہے اور عربی میں ایسی کتاب لکھی جو ایمان اور عقل کے سوالوں میں الجھے لوگوں کے لیے تھی۔"
