summary:
  ar: "أبو عمران موسى بن عبيد الله بن ميمون القرطبي، المعروف في الغرب بموسى ميمونيدس، لاهوتي وفيلسوف وطبيب يهودي وُلد في قرطبة سنة 1135م وتوفي في الفسطاط سنة 1204م. غادر الأندلس مع أسرته نحو 1149م بسبب غزو الموحدين، ثم استقر في مصر بعد 1166م وعمل طبيباً في بلاط الملك الأفضل وترأس طائفته. ألّف بالعربية دلالة الحائرين نحو 1190م ومقالة في صناعة المنطق وكتباً طبية، وكان الفارابي أعظم مصادر إلهامه بين فلاسفة المسلمين {cite:encyclopaedia-of-islam-2 vol. 3 p. 908; vol. 3 p. 909}."
  en: "Abu Imran Musa ibn Ubayd Allah ibn Maymun al-Qurtubi, known in the West as Moses Maimonides, was a Jewish theologian, philosopher and physician, born in Cordova in 1135 and died in Fustat in 1204. His family left al-Andalus about 1149 because of the Almohad invasion, and after 1166 he settled in Egypt, where he practised as a physician at the court of al-Malik al-Afdal and became head of his community. He wrote in Arabic the Guide of the Perplexed, about 1190, a short treatise on logic and medical works, and the article names al-Farabi as his chief inspiration among Muslim philosophers {cite:encyclopaedia-of-islam-2 vol. 3 p. 908; vol. 3 p. 909}."
  ur: "ابو عمران موسیٰ بن عبید اللہ بن میمون القرطبی، جو مغرب میں موسیٰ میمونیڈیز کے نام سے معروف ہیں، یہودی متکلم، فلسفی اور طبیب تھے؛ وہ 1135ء میں قرطبہ میں پیدا ہوئے اور 1204ء میں فسطاط میں فوت ہوئے۔ موحدین کے حملے کے باعث ان کا خاندان تقریباً 1149ء میں اندلس سے نکلا، اور 1166ء کے بعد وہ مصر میں آباد ہوئے جہاں وہ ملک الافضل کے دربار میں طبیب رہے اور اپنی جماعت کے سربراہ بنے۔ انہوں نے عربی میں تقریباً 1190ء میں دلالۃ الحائرین، منطق پر ایک مقالہ اور طبی کتابیں لکھیں، اور مضمون کے مطابق مسلم فلسفیوں میں ان کے لیے فارابی سب سے بڑا سرچشمۂ الہام تھے {cite:encyclopaedia-of-islam-2 vol. 3 p. 908; vol. 3 p. 909}."
