died: { edtf: "1250~", hijri: "0648", calendar: julian, precision: year, status: tradition, derived: true, note: "ضربت عنقه وأحرق وقتل صبراً ولم يدفن بعدة أيام {cite:shadharat-dhahab p. 249-250}." }
summary:
  ar: "وزير الملك الصالح نجم الدين أيوب؛ سامري من أهل بعلبك عُدل به وأسلم؛ كان حكيماً كاتباً عالماً بالإنشاء والطب وابتداء أمره يعمل الدواة ويباشر الأدوية، ثم ملك الديوان واختص بالسلطان حتى قال في مناجاة ربه «إلهي أنت وحدك تعرف سريرتي وإني ما استشرتك فيها ولا غيرك مع ذلك تعدل بيني وبينك»؛ ولمّا تملك الملك المعظم طوران شاه اعترضوه وقبض عليه في اثني عشر ألف ألف دينار أو يزيدون فقال إن هذا حرمت فاعفني وإلا فيعطيني منه على أعمال العام، فضربت عنقه وأحرق {cite:shadharat-dhahab p. 249-250}."
  en: "Al-Salih Ayyub's vizier — a Samaritan of Baalbek converted and made his minister, physician and chancery-master; when Turanshah's men seized him they reckoned his holdings at twelve million dinars; beheaded, burned, left unburied for days {cite:shadharat-dhahab p. 249-250}."
