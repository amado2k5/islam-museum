summary:
  ar: "منشد وكاتب وملحّن تركي في فن الإلٰهي ⁦(الأناشيد الدينية التركية)⁩، وُلد في 1 ديسمبر 1973 في بايبورت، تخرّج في ثانوية الإمام الخطيب بحي الفاتح في إسطنبول، ودخل سوق الموسيقى سنة 1990 بألبومه الأول، وله عشرات الألبومات وبرامج تلفزيونية كثيرة. بلغت قناته الرسمية على يوتيوب 372,000 مشترك كما في 12 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish ilahi (devotional song) performer, writer and composer, born on 1 December 1973 in Bayburt. He graduated from the Fatih Imam Hatip High School in Istanbul, entered the music market in 1990 with his first album, and has released dozens of albums and appeared in many television programmes. His official YouTube channel counted 372,000 subscribers as of 12 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک الٰہی ⁦(دینی نعت و منقبت کے فن)⁩ کے گلوکار، مصنف اور نغمہ ساز، جو 1 دسمبر 1973ء کو بایبورت میں پیدا ہوئے، استنبول کے فاتح امام خطیب ہائی سکول سے فارغ التحصیل ہوئے، 1990ء میں اپنے پہلے البم کے ساتھ موسیقی کی مارکیٹ میں داخل ہوئے، اور ان کے درجنوں البم اور کئی ٹیلی ویژن پروگرام ہیں۔ vidIQ کے مطابق 12 نومبر 2026ء کو ان کے سرکاری یوٹیوب چینل کے سبسکرائبر 372,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  fr: "Interprète, parolier et compositeur turc d'ilahi (chants de dévotion), né le 1er décembre 1973 à Bayburt. Diplômé du lycée Imam Hatip de Fatih à Istanbul, il entra sur le marché de la musique en 1990 avec son premier album et a publié des dizaines d'albums et participé à de nombreuses émissions de télévision. Sa chaîne YouTube officielle comptait 372 000 abonnés au 12 novembre 2026 selon vidIQ — un chiffre de plateforme daté, non un fait vérifié par le musée."
  es: "Intérprete, escritor y compositor turco de ilahi (canciones devocionales), nacido el 1 de diciembre de 1973 en Bayburt. Se graduó del Liceo Fatih Imam Hatip en Estambul, debutó en la música en 1990 con su primer álbum y ha lanzado decenas de discos y participado en numerosos programas de televisión. Su canal oficial de YouTube contaba con 372 000 suscriptores al 12 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por ningún museo)."
  tr: "İlahi (Türk dini ezgileri) konusunda uzmanlaşmış bir Türk şarkıcı, söz yazarı ve besteci olan sanatçı, 1 Aralık 1973'te Bayburt'ta doğdu. İstanbul Fatih ilçesindeki İmam Hatip Lisesi'nden mezun olduktan sonra 1990 yılında ilk albümüyle müzik dünyasına adım attı. Birçok albüm çıkardı ve sayısız televizyon programında yer aldı. vidIQ'ya göre, 12 Kasım 2026 itibarıyla resmi YouTube kanalının 372.000 abonesi bulunuyordu; ancak bu rakam tarihsel veya müze tarafından doğrulanmış bir bilgi değildir."
  id: "Seorang penyanyi, penulis lagu, dan komposer Turki yang mengkhususkan diri dalam Ilahi (nyanyian keagamaan Turki), ia lahir pada 1 Desember 1973 di Bayburt. Ia lulus dari Sekolah Menengah Imam Hatip di distrik Fatih, Istanbul, dan memasuki dunia musik pada tahun 1990 dengan album pertamanya. Ia telah merilis puluhan album dan tampil di berbagai program televisi. Saluran YouTube resminya memiliki 372.000 pelanggan per 12 November 2026, menurut vidIQ, angka yang bukan merupakan fakta historis atau terverifikasi oleh museum."
