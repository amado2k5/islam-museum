summary:
  ar: "فيزيائي نظري تركي (1921–1992)، وُلد في إسطنبول وتعلم في ثانوية غلطة سراي وجامعة إسطنبول وكلية إمبريال بلندن (دكتوراه 1950). اشتُهر بنموذجه الكيرالي وبأعماله في تماثل SU(6) وصيغة غورسي–راديكاتي، وأسس قسم الفيزياء النظرية في جامعة الشرق الأوسط التقنية، ثم شغل كرسي غيبس في جامعة ييل. نال جائزة أوبنهايمر سنة 1977 وميدالية فيغنر سنة 1986، ويحمل معهد فيزا غورسي في إسطنبول اسمه."
  en: "Turkish theoretical physicist (1921–1992), born in Istanbul and educated at Galatasaray, Istanbul University and Imperial College London (PhD 1950). Known for the chiral model, his SU(6) symmetry work and the Gürsey–Radicati formula, he founded the theoretical physics department at the Middle East Technical University and later held the Gibbs chair at Yale. He received the Oppenheimer Prize in 1977 and the Wigner Medal in 1986, and the Feza Gürsey Institute in Istanbul bears his name."
  ur: "ترکی نظریاتی طبیعیات دان (1921ء–1992ء)، جو استنبول میں پیدا ہوئے اور گلاطہ سرائے، جامعہ استنبول اور امپیریل کالج لندن سے تعلیم حاصل کی (پی ایچ ڈی 1950ء)۔ وہ اپنے کائرل ماڈل، SU(6) تماثل پر کام اور گورسے–رادیکاتی فارمولے کے لیے جانے جاتے ہیں؛ انہوں نے مڈل ایسٹ ٹیکنیکل یونیورسٹی میں نظریاتی طبیعیات کا شعبہ قائم کیا اور پھر ییل یونیورسٹی میں گبز کرسی سنبھالی۔ انہیں 1977ء میں اوپنہائمر پرائز اور 1986ء میں وگنر میڈل ملا، اور استنبول کا فیزا گورسے انسٹی ٹیوٹ ان کے نام پر ہے۔"
