roles: [mystic]
summary:
  ar: "عابدة من أهل المدينة، ابنة التابعي محمد بن المنكدر، يذكرها ابن الجوزي في «صفة الصفوة» بين عابدات المدينة المعروفات؛ كانت تصوم النهار، وإذا جنها الليل نادت بصوت حزين تسأل الله أن يعتقها من النار، وذكرها البيهقي في «شعب الإيمان» كما يشير المحقق."
  en: "A devout woman of Medina, daughter of the Successor Muhammad ibn al-Munkadir, whom Ibn al-Jawzi lists among the known devout women of Medina in Sifat al-Safwa; she fasted by day, and when night fell she called out in a mournful voice asking God to free her from the Fire; al-Bayhaqi mentions her in Shu'ab al-Iman, as the editor notes."
  es: "Una mujer devota de Medina, hija del Sucesor Muhammad ibn al-Munkadir, a quien Ibn al-Jawzi incluye entre las mujeres devotas conocidas de Medina en Sifat al-Safwa; ayunaba de día y, al caer la noche, clamaba con voz lastimera pidiendo a Dios que la librara del Fuego; al-Bayhaqi la menciona en Shu'ab al-Iman, como señala el editor."
  fr: "Une femme pieuse de Médine, fille du Successeur Muhammad ibn al-Munkadir, qu'Ibn al-Jawzi mentionne parmi les femmes pieuses connues de Médine dans Sifat al-Safwa; elle jeûnait le jour et, à la tombée de la nuit, elle implorait Dieu d'une voix plaintive de la libérer du Feu; al-Bayhaqi la mentionne dans Shu'ab al-Iman, comme le note l'éditeur."
  ur: "مدینہ کی ایک متقی خاتون، جانشین محمد ابن المنکدر کی بیٹی، جسے ابن الجوزی نے سیفت الصفوی میں مدینہ کی معروف متقی خواتین میں درج کیا ہے۔ اس نے دن کو روزہ رکھا، اور جب رات ہوئی تو اس نے سوگوار آواز میں پکارا کہ خدا سے اسے آگ سے آزاد کر دے۔ بیہقی نے شعب الایمان میں ان کا تذکرہ کیا ہے جیسا کہ مدیر نے نوٹ کیا ہے۔"
