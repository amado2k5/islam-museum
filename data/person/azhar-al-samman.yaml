summary:
  ar: "صديق أبي جعفر المنصور في أيام بني أمية، سافرا جميعاً وسمعا الحديث، فلما أفضت الخلافة إلى المنصور أشخص إليه من البصرة فوصله بأربعة آلاف درهم وأمره ألا يقدم مستميحاً ولا مسلماً ولا عائداً، فلما أتاه رابعاً محتجاً بسماع حديث فيه اسم الله الأعظم قال المنصور إني منذ جثتني أسأل الله به ألا يردك إلي فهات، وقال قد أعيتني فيك الحيلة فصر إلي متى شئت {cite:muruj-al-dhahab p. 427-428}."
  en: "Al-Mansur's old Umayyad-era study-friend whose annual visits under ever-thinner pretexts ended with the caliph's surrender: 'you have exhausted my stratagems — come whenever you wish' {cite:muruj-al-dhahab p. 427-428}."
  es: "El viejo amigo de estudio de Al-Mansur de la era omeya, cuyas visitas anuales con pretextos cada vez más débiles terminaron con la rendición del califa: \"Has agotado mis estratagemas; ven cuando quieras\" {cite:muruj-al-dhahab p. 427-428}."
  fr: "L'ancien ami d'études d'Al-Mansur de l'époque omeyyade, dont les visites annuelles sous des prétextes toujours plus minces se terminaient par la reddition du calife: « tu as épuisé mes stratagèmes — viens quand tu veux » {cite: muruj-al-dhahab p. 427-428}."
