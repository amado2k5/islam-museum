id: person/al-lului
class: person
label: { ar: "اللؤلؤي", en: "Al Lului" }
summary:
  ar: "الحسن بن زياد اللؤلؤي ويكنى أبا علي من أصحاب أبي حنيفة ممن أخذ عنه وسمع منه وكان فاضلا عالما بمذاهب أبي حنيفة في الرأي وقال يحيى بن آدم ما رأيت أفقه من الحسن بن زياد وتوفي سنة أربع ومائتين، قال الطحاوي له كتاب المجرد لأبي حنيفة روايته وكتاب أدب القاضي وكتاب الخصال وكتاب معاني الإيمان وكتاب النفقات وكتاب الخراج وكتاب الفرائض {cite:fihrist-ibn-al-nadim p. 288}."
  en: "Al-Lu'lu'i — whom Yahya ibn Adam called the most learned of all {cite:fihrist-ibn-al-nadim}"
