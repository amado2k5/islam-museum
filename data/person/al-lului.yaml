id: person/al-lului
class: person
label: { ar: "اللؤلؤي", en: "Al Lului", es: "Al Lului", fr: "Al Lului", ur: "اللوئی" }
summary:
  ar: "الحسن بن زياد اللؤلؤي ويكنى أبا علي من أصحاب أبي حنيفة ممن أخذ عنه وسمع منه وكان فاضلا عالما بمذاهب أبي حنيفة في الرأي وقال يحيى بن آدم ما رأيت أفقه من الحسن بن زياد وتوفي سنة أربع ومائتين، قال الطحاوي له كتاب المجرد لأبي حنيفة روايته وكتاب أدب القاضي وكتاب الخصال وكتاب معاني الإيمان وكتاب النفقات وكتاب الخراج وكتاب الفرائض {cite:fihrist-ibn-al-nadim p. 288}."
  en: "Al-Lu'lu'i — whom Yahya ibn Adam called the most learned of all {cite:fihrist-ibn-al-nadim}"
  es: "Al-Lu'lu'i — a quien Yahya ibn Adam llamó el más sabio de todos {citar:fihrist-ibn-al-nadim}"
  fr: "Al-Lu'lu'i - que Yahya ibn Adam a appelé le plus érudit de tous {cite: fihrist-ibn-al-nadim}"
  ur: "لولوی - جسے یحییٰ ابن آدم نے سب سے زیادہ عالم کہا {حوالہ: فہرست ابن الندیم}"
  tr: "El-Hasan ibn Ziyad el-Lului, lakaplı Ebu Ali, Ebu Hanifa'nın yoldaşlarından biriydi; onu incelemiş ve ondan dinlemiştir. Ebu Hanife'nin mezheblerinde erdemli ve bilgiliydi. Yahya ibn Adem şöyle dedi: Hasan ibn Ziyad'dan daha bilgili kimseyi görmedim. 204 yılında vefat etti. El-Tahawi, Ebu Hanifa'nın Al-Mujarrad adlı kitabına, rivayetine, hakimin görgü kuralları kitabına, iman anlamları kitabına, masraflar kitabına, Kharaj kitabına ve miras kitabına sahip olduğunu söyledi {atıf:Fihrist-ibn-al-Nadim s. 288}."
  id: "Al-Hasan ibn Ziyad al-Lu'lu'i, yang dijuluki Abu Ali, adalah salah satu sahabat Abu Hanifa yang belajar dan mendengar darinya. Ia berbudi luhur dan berpengetahuan dalam mazhab Abu Hanifa. Yahya ibn Adam berkata: Aku belum pernah melihat orang yang lebih berpengetahuan daripada Hasan ibn Ziyad. Ia meninggal pada tahun 204. Al-Tahawi mengatakan ia memiliki buku Al-Mujarrad karya Abu Hanifa, riwayatnya, kitab tata krama hakim, buku karakter, kitab makna iman, buku pengeluaran, kitab kharaj, dan buku warisan {cite:fihrist-ibn-al-nadim hlm. 288}."
