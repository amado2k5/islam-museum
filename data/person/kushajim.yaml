summary:
  ar: "أبو الفتح محمود بن الحسين السندي بن شاهك الكاتب المعروف بكشاجم، من أهل العلم والرواية والأدب، كتب إلى صديق له يذم النرد وكان بها مشهوراً أبياته أيها المعجب المفاخر بالنرد ليزهى بها على الإخوان {cite:muruj-al-dhahab p. 680}. وعند المسعودي أنشد في مائدة المستكفي من شعره في وصف الأطعمة: في الهليون مكسوة من صنعة الفرد الصمد منتصبات كالقداح في العمد ثوب من السندس من فوق برد، وفي الجوذابة جوذابة من أرز فائق مصفرة في اللون كالعاشق، وفي القطائف قطائف مثل أضابير الكتب كأنه إذا ابتدى من الكثب كوافر النحل بياضاً قد ثقب {cite:muruj-al-dhahab p. 714-717}"
  en: "Abu l-Fath Mahmud b. al-Husayn the Sindhi — the literatus who lampooned his own beloved nard {cite:muruj-al-dhahab p. 680}."
  es: "Abu l-Fath Mahmud b. al-Husayn el Sindhi — el literato que satirizó a su propio y amado nardo {cite:muruj-al-dhahab p. 680}."
  fr: "Abu l-Fath Mahmud b. al-Husayn le Sindhi — le lettré qui a ridiculisé son propre nard bien-aimé {cite:muruj-al-dhahab p. 680}."
  ur: "ابو الفتح محمود ب۔ الحسین سندھی - وہ ادبا جس نے اپنے ہی پیارے نارد کو چراغاں کیا 680}۔"
  tr: "Ebu el-Feth Mahmud ibn al-Hüseyin el-Sindi bin Şahak, bilgi, anlatı ve edebiyat sahibi yazar Kasacim olarak bilinen, bir arkadaşına zarları eleştiren bir mektup yazdı ve şiirleri şöyle bilinirdi: 'Ey zarın gururlu hayranı, onu kardeşlere göstermek için.' {alıntı:Muruj-al-Dhahab s. 680}. al-Mas'udhi'ye göre, Mustaqfi sofrasında yiyecekleri anlatan şiirinden şöyle okumuştur: Kuşkonmazda, bireysel el-Samad'ın ustalığıyla giyinmiş, kum kadeh gibi dik; sütunlarda soğuk bir tepeden kumdan yapılmış bir giysi; el-Judhaba'da ise aşığı gibi aşırı sarımsı pirinçten yapılmış bir judahab; ve kateyf'te katayef, kitap defterleri gibidir; sanki yakından başladığında, delip geçen arılar kadar beyazdır {cite:muruj-al-dhahab s. 714-717}"
  id: "Abu al-Fath Mahmoud ibn al-Husayn al-Sindi ibn Shahak, penulis yang dikenal sebagai Kashajim, seorang yang berpengetahuan, narator, dan sastra, menulis kepada seorang temannya mengkritik dadu, dan bait-baitnya terkenal karenanya: 'Wahai pengagum orang yang sombong akan dadu, pamerlahlah dengan dadu kepada saudara-saudara.' {cite:Muruj-al-Dhahab hlm. 680}. Menurut al-Mas'udhi, ia membacakan puisinya di meja Mustaqfi yang menggambarkan makanan: Dalam asparagus, berpakaian dengan kerajinan al-Samad individu, tegak seperti cangkir pasir; di tiang-tiang, pakaian pasir dari atas dingin; dalam al-Judhaba, judahab yang terbuat dari beras super kekuningan seperti kekasih; dan dalam qatayf, qatayef seperti buku catatan, seolah-olah ketika dimulai dari dekat, warnanya seputih lebah yang telah menusuk {cite:muruj-al-dhahab hlm. 714-717}"
