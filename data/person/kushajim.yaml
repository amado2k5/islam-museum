summary:
  ar: "أبو الفتح محمود بن الحسين السندي بن شاهك الكاتب المعروف بكشاجم، من أهل العلم والرواية والأدب، كتب إلى صديق له يذم النرد وكان بها مشهوراً أبياته أيها المعجب المفاخر بالنرد ليزهى بها على الإخوان {cite:muruj-al-dhahab p. 680}. وعند المسعودي أنشد في مائدة المستكفي من شعره في وصف الأطعمة: في الهليون مكسوة من صنعة الفرد الصمد منتصبات كالقداح في العمد ثوب من السندس من فوق برد، وفي الجوذابة جوذابة من أرز فائق مصفرة في اللون كالعاشق، وفي القطائف قطائف مثل أضابير الكتب كأنه إذا ابتدى من الكثب كوافر النحل بياضاً قد ثقب {cite:muruj-al-dhahab p. 714-717}"
  en: "Abu l-Fath Mahmud b. al-Husayn the Sindhi — the literatus who lampooned his own beloved nard {cite:muruj-al-dhahab p. 680}."
