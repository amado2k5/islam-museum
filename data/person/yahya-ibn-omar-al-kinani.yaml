gender: male
summary:
  ar: يحيى بن عمر بن يوسف الكناني الأندلسي الجياني، أبو زكريا، فقيه مالكي عالم بالحديث، من موالي بني أمية، نشأ بقرطبة وسكن القيروان ورحل إلى المشرق ثم استوطن سوسة وبها قبره، توفي سنة 289 هـ الموافقة 902 م، وله نحو أربعين جزءا من المصنفات.
  en: Yahya ibn Umar ibn Yusuf al-Kinani al-Andalusi al-Jayyani, Abu Zakariya, a Maliki jurist learned in hadith, a client of the Banu Umayya; grew up in Cordoba, lived in Qayrawan, travelled east, and settled in Sousse where he is buried; died 289 AH (902 CE); author of writings in about forty parts.
  es: "Yahya ibn Umar ibn Yusuf al-Kinani al-Andalusi al-Jayyani, Abu Zakariya, jurista malikí versado en hadices, cliente de los Banu Umayya; creció en Córdoba, vivió en Qayrawan, viajó hacia el este y se estableció en Sousse, donde está enterrado; murió en el año 289 de la Hégira (902 d. C.); autor de escritos en aproximadamente cuarenta partes."
  fr: "Yahya ibn Umar ibn Yusuf al-Kinani al-Andalusi al-Jayyani, Abu Zakariya, juriste malikite versé dans le hadith, client des Banu Umayya; a grandi à Cordoue, a vécu à Qayrawan, a voyagé vers l'est et s'est installé à Sousse où il est enterré; mort en 289 AH (902 CE); auteur d'écrits en une quarantaine de parties."
  ur: "یحییٰ بن عمر بن یوسف الکنانی الاندلسی الجیانی، ابو زکریا، ایک مالکی فقیہ جو حدیث میں سیکھے، بنو امیہ کے مؤکل؛ وہ قرطبہ میں پلا بڑھا، قیروان میں رہا، مشرق کا سفر کیا، اور سوس میں سکونت اختیار کی جہاں اسے دفن کیا گیا۔ وفات 289ھ (902)؛ تقریباً چالیس حصوں میں تحریروں کے مصنف۔"
  tr: "Yahya ibn Umar ibn Yusuf el-Kinani el-Endülüs el-Jiyani, Ebu Zekariya, Maliki bir hukukçu ve hadis alimi, Emeviyelerin müttefiklerinden biriydi. Kordoba'da büyüdü, Kairuan'a yerleşti, doğuya seyahat etti ve ardından Susa'ya yerleşti ve orada defnedildi. 289 Hicri yılında, yani 902 yılına karşılık gelen yılda öldü ve yaklaşık kırk cilt eser yazdı."
  id: "Yahya ibn Umar ibn Yusuf al-Kinani al-Andalusi al-Jiyani, Abu Zakariya, adalah seorang ahli hukum Maliki dan ulama hadis, klien Umayyah. Ia tumbuh besar di Cordoba, menetap di Kairouan, melakukan perjalanan ke timur, lalu menetap di Susa, tempat ia dimakamkan di sana. Ia meninggal pada tahun 289 H, yang bertepatan dengan tahun 902 M, dan menulis sekitar empat puluh jilid karya."
