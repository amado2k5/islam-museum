id: person/yahya-ibn-omar-al-kinani
class: person
label:
  ar: يحيى بن عمر بن يوسف الكناني
  en: Yahya ibn Omar al-Kinani
  es: "Yahya ibn Omar al-Kinani"
  fr: "Yahya ibn Omar al-Kinani"
  ur: "یحییٰ بن عمر الکنانی"
roles:
- faqih
