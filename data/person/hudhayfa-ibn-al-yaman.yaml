summary:
  en: "A prominent Companion known as the 'Keeper of the Prophet's Secrets'; at the climax of the Battle of the Trench, the Prophet sent him across the lines on a freezing, gale-swept night into the confederate camp to gather intelligence, bringing back news of Abu Sufyan ordering the final retreat. وهو الذي أفزعه اختلاف أهل الشام والعراق في القراءة بفتح أرمينية فقال لعثمان «أدرك هذه الأمة قبل أن يختلفوا في الكتاب اختلاف اليهود والنصارى» فكان إنذاره سبب نسخ المصاحف {cite:sahih-al-bukhari 4987}."
  ar: "صحابي جليل من كبار الأنصار حلفاً وأمين سر رسول الله في المنافقين؛ انتدبه النبي في ليلة الريح والظلمة والبرد الشديد في غزوة الخندق ليتسلل إلى معسكر قريش ويأتي بخبرهم، فشهد نكوص أبي سفيان وأمره الأحزاب بالرحيل وعاد بالخبر إلى رسول الله.؛ وولّاه عثمان ثغر أرمينية بعد حبيب بن مسلمة فشخص إلى برذعة حتى أمره بالانصراف، وحين بلغه قتل عثمان وهو عليل بالكوفة حُمل إلى المنبر فبايع علياً وأوصى ابنيه صفواناً وسعداً بالشهادة معه فاستشهدا بصفين ومات بعدها بأيام {cite:futuh-buldan p. 287} {cite:muruj-al-dhahab p. 675} وفي الصحيح أنه نادى يوم أحد «أي عباد الله أبي» حين رأى المسلمين يقتلون أباه في الارتداد بعد هزيمة المشركين فقال «غفر الله لكم» {cite:sahih-al-bukhari 3824}."
