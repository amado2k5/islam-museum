  did_you_know:
    ar: "حذيفة بن اليمان أمين سرّ النبي في المنافقين، وانتدبه ليلة الخندق ليتسلل إلى عدوّهم فيأتيه بالخبر."
    en: "Hudhayfa ibn al-Yaman, keeper of the Prophet's secret list of hypocrites, was sent into enemy lines on the bitter night of the Trench to bring back word."
