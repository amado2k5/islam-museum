  en: "A prominent Companion known as the 'Keeper of the Prophet's Secrets'; at the climax of the Battle of the Trench, the Prophet sent him across the lines on a freezing, gale-swept night into the confederate camp to gather intelligence, bringing back news of Abu Sufyan ordering the final retreat."
