summary:
  ar: "سياسي وعسكري عراقي (1937–2006)، رئيس العراق من 1979 حتى إطاحته في 2003. صعد في حزب البعث العراقي، وقاد العراق في الحرب مع إيران (1980–1988) وغزو الكويت (1990) وما تلاه من عقوبات، ثم أُسر وحُكم وأُعدم شنقًا في بغداد في 30 ديسمبر 2006."
  en: "Iraqi politician and military figure (1937–2006), president of Iraq from 1979 until his overthrow in 2003. He rose through the Iraqi Ba'ath Party, led Iraq through the war with Iran (1980–1988), the invasion of Kuwait (1990) and the sanctions that followed, and was captured, tried and executed by hanging at Baghdad on 30 December 2006."
  ur: "عراقی سیاست دان اور عسکری شخصیت (1937–2006)، جو 1979 سے 2003 میں اپنی معزولی تک عراق کے صدر رہے۔ وہ عراقی بعث پارٹی سے آگے بڑھے، ایران کے ساتھ جنگ (1980–1988)، کویت پر حملے (1990) اور اس کے بعد کی پابندیوں کے دور میں عراق کی قیادت کی، اور گرفتاری و مقدمے کے بعد 30 دسمبر 2006 کو بغداد میں پھانسی پر چڑھائے گئے۔"
