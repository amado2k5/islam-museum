summary:
  ar: "سياسي نيجيري (1951–2010) من كاتسينا، درس الكيمياء في جامعة أحمدو بيلو وزاريا وعمل معلّما ومحاضرا ثم في قطاع الشركات، فحكم ولاية كاتسينا عن حزب الشعب الديمقراطي (1999–2007) وفي عهده اعتمدت الولاية الشريعة سنة 2000، ثم صار رئيس نيجيريا في 29 مايو 2007 فمات في منصبه في أبوجا في 5 مايو 2010 ودُفن دفنا إسلاميا في كاتسينا، فخلفه نائبه غودلاك جوناثان."
  en: "Nigerian politician (1951–2010) from Katsina who studied chemistry at Ahmadu Bello University, Zaria, worked as a teacher and lecturer and then in business, governed Katsina State for the Peoples Democratic Party (1999–2007) — the state adopted sharia under him in 2000 — and became president of Nigeria on 29 May 2007. He died in office in Abuja on 5 May 2010, received an Islamic burial in Katsina, and was succeeded by his vice-president Goodluck Jonathan."
  ur: "نائجریائی سیاست دان (1951ء–2010ء)، کاتسینا سے تعلق؛ احمدو بیلو یونیورسٹی زاریا میں کیمیا پڑھی، مدرس و محاضر رہے پھر کاروبار کیا؛ پیپلز ڈیموکریٹک پارٹی سے ریاست کاتسینا کے گورنر رہے (1999ء–2007ء) — ان کے دور میں ریاست نے 2000 میں شریعت اختیار کی — پھر 29 مئی 2007 کو نائجریا کے صدر بنے؛ 5 مئی 2010 کو ابوجا میں منصب پر وفات پائی اور کاتسینا میں اسلامی طریقے سے دفن ہوئے۔"
