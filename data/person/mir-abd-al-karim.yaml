summary:
  ar: "مير عبد الكريم، وصفته دائرة المعارف الإسلامية بأنه كبير مهندسي جهانغير، وذكرته مع مكرمت خان بين من أشرفوا على بناء تاج محل. لا تعرف المقالات تاريخ ميلاده ووفاته ولا أصله {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  en: "Mir Abd al-Karim is described by the Encyclopaedia of Islam as Jahangir's leading architect and is named, with Makramat Khan, among those who oversaw the building of the Taj Mahal. The articles give no dates or origin for him {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  ur: "میر عبد الکریم کو دائرۃ المعارف الاسلامیہ جہانگیر کا سرکردہ معمار بتاتا ہے اور مکرمت خان کے ساتھ ان لوگوں میں گنتا ہے جنہوں نے تاج محل کی تعمیر کی نگرانی کی۔ مقالات ان کی تاریخیں یا اصل نہیں بتاتے {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
