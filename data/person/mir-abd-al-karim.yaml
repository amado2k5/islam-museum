summary:
  ar: "مير عبد الكريم، وصفته دائرة المعارف الإسلامية بأنه كبير مهندسي جهانغير، وذكرته مع مكرمت خان بين من أشرفوا على بناء تاج محل. لا تعرف المقالات تاريخ ميلاده ووفاته ولا أصله {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  en: "Mir Abd al-Karim is described by the Encyclopaedia of Islam as Jahangir's leading architect and is named, with Makramat Khan, among those who oversaw the building of the Taj Mahal. The articles give no dates or origin for him {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  ur: "میر عبد الکریم کو دائرۃ المعارف الاسلامیہ جہانگیر کا سرکردہ معمار بتاتا ہے اور مکرمت خان کے ساتھ ان لوگوں میں گنتا ہے جنہوں نے تاج محل کی تعمیر کی نگرانی کی۔ مقالات ان کی تاریخیں یا اصل نہیں بتاتے {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  es: "La Enciclopedia del Islam describe a Mir Abd al-Karim como el principal arquitecto de Jahangir y lo nombra, junto con Makramat Khan, entre quienes supervisaron la construcción del Taj Mahal. Los artículos no proporcionan fechas ni lugar de origen para él {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  fr: "L'Encyclopédie de l'Islam décrit Mir Abd al-Karim comme le principal architecte de Jahangir et le cite, avec Makramat Khan, parmi ceux qui ont supervisé la construction du Taj Mahal. Les articles ne précisent ni ses dates ni son lieu d'origine {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 1 p. 276}."
  tr: "İslam Ansiklopedisi tarafından Jahangir'in baş mühendisi olarak tanımlanan Mir Abdul Kerim, Tac Mahal'in inşasını denetleyenler arasında Makramat Han ile birlikte anılmıştır. Makalelerde doğum ve ölüm tarihleri veya kökenleri bilinmemektedir {cite:encyclopaedia-of-Islam-2 cilt 10 s. 69} {cite:encyclopaedia-of-islam-2 cilt 1 s. 276}."
  id: "Mir Abdul Karim, yang digambarkan oleh Ensiklopedia Islam sebagai insinyur utama Jahangir, disebut bersama Makramat Khan sebagai salah satu yang mengawasi pembangunan Taj Mahal. Artikel-artikel tersebut tidak mengetahui tanggal lahir dan kematiannya atau asal-usulnya {cite:encyclopaedia-of-Islam-2 vol. 10 hlm. 69} {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 276}."
