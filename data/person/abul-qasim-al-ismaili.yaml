summary:
  ar: "إسماعيل بن محمد بن إسماعيل بن الإمام أبي بكر أحمد بن إبراهيم الإسماعيلي، أبو القاسم الجرجاني، من بيت العلم والفضل والرياسة، صدرًا رئيسًا عالمًا كبيرًا، مليح الوعظ والتنظيم والنثر. ولد سنة 407 وقيل 406 بجرجان، تفقه عن جده أبي العلاء وأبي بكر السجزي، سمع أباه وعمه وحمزة السهمي والقاضي أبا عمر البسطامي، وسافر البلاد فحدث بنيسابور والري وأصبهان ودخل بغداد حاجًا فاستقبله أبو إسحاق الشيرازي وقال: لا أدري بأيهما أنا أشد فرحًا، بدخولي مدينة السلام أو رؤية الشيخ الإمام. روى الكامل لابن عدي وتاريخ جرجان. توفي بجرجان سنة 477 {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  en: "Isma'il ibn Muhammad al-Isma'ili, Abu'l-Qasim of Jurjan (b. 406 or 407, d. 477) — 'of a house of learning, excellence and leadership,' a presiding master and fine preacher in verse and prose. Studied fiqh under his grandfather Abu'l-'Ala' and Abu Bakr al-Sajzi; travelled and taught at Nishapur, Rayy and Isfahan, and entering Baghdad on hajj was welcomed by Abu Ishaq al-Shirazi: 'I know not which gladdens me more — entering the City of Peace or seeing the imam.' Transmitted Ibn 'Adi's Kamil and the Tarikh of Jurjan {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  fr: "Isma'il ibn Muhammad al-Isma'ili, Abu'l-Qasim de Jurjan (né en 406 ou 407 H, mort en 477 H), « issu d'une famille de savoir, d'excellence et de dirigeants », maître de premier plan et prédicateur éloquent en vers et en prose. Il étudia le fiqh auprès de son grand-père Abu'l-'Ala' et d'Abu Bakr al-Sajzi ; voyagea et enseigna à Nishapur, Rayy et Ispahan ; arrivé à Bagdad en route pour le hajj, il fut accueilli par Abu Ishaq al-Shirazi : « Je ne sais ce qui me réjouit davantage, entrer dans la Cité de la paix ou voir l'imam. » Il transmit le Kamil d'Ibn 'Adi et le Tarikh de Jurjan {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  ur: "اسماعیل بن محمد اسماعیلی، ابو القاسم جرجانی ⁦(پ 406 یا 407ھ، مت 477ھ)⁩ — علم و فضل کی گھرانے کے صدر و سردار؛ دادا ابو العلاء اور ابو بکر سجزی سے فقہ سیکھی؛ نیشاپور، رے اور اصفہان میں حدیث پڑھائی؛ حج پر بغداد پہنچے تو ابو اسحاق شیرازی نے استقبال کیا اور کہا: مجھے نہیں معلوم میں کس چیز پر زیادہ خوش ہوں — شہرِ سلام میں داخلے پر یا شیخِ امام کی زیارت پر۔ ابن عدی کا الکامل اور تاریخِ جرجان روایت کیا {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  es: "Isma'il ibn Muhammad al-Isma'ili, Abu'l-Qasim de Jurjan (n. 406 o 407, m. 477) — 'de una casa de saber, excelencia y liderazgo', maestro presidente y excelente predicador en verso y prosa. Estudió fiqh con su abuelo Abu'l-'Ala' y Abu Bakr al-Sajzi; viajó y enseñó en Nishapur, Rayy e Isfahan, y al entrar en Bagdad para el Hajj fue recibido por Abu Ishaq al-Shirazi: 'No sé qué me alegra más: entrar en la Ciudad de la Paz o ver al imán'. Transmitido por Kamil y el Tarikh de Jurjan de Ibn 'Adi {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  tr: "İsmail ibn Muhammed ibn İsmail ibn İmam Ebu Bekir Ahmed ibn İbrahim el-İsmaili, Ebu el-Kasım el-Curcani, ilim, erdem ve önderlik sahibi bir aileden gelen, önde gelen ve bilgili bir alim, vaaz verme, teşkilat kurma ve nesirde yetenekliydi. Hicri 407 yılında (veya başka bir rivayete göre Hicri 406 yılında) Curcani'de doğdu. Dedesi Ebu el-Ala ve Ebu Bekir el-Sijzi'den fıkıh eğitimi aldı. Hadis ilmini babasından, amcası Hamza el-Sahmi'den ve kadı Ebu Ömer el-Bustami'den öğrendi. Nişapur, Rayy ve İsfahan'da dersler vererek geniş çapta seyahat etti. Hac amacıyla Bağdat'a girdi ve orada Ebu İshak el-Şirazi tarafından karşılandı. Ebu İshak el-Şirazi, \"Hangisine daha çok sevindiğimi bilmiyorum: Barış Şehrine girmek mi yoksa Şeyh İmam'ı görmek mi?\" dedi. El-Kâmil'i İbn Adi ve Tarık Cürcân'dan rivayet etmiştir. H. 477'de Curcan'da vefat etti."
  id: "Isma'il ibn Muhammad ibn Isma'il ibn Imam Abu Bakr Ahmad ibn Ibrahim al-Isma'ili, Abu al-Qasim al-Jurjani, berasal dari keluarga yang berilmu, berbudi luhur, dan berwibawa, adalah seorang ulama terkemuka dan berilmu, fasih dalam berdakwah, menyusun, dan menulis. Beliau lahir pada tahun 407 H (atau, menurut riwayat lain, 406 H) di Jurjan. Beliau mempelajari fiqih di bawah bimbingan kakeknya, Abu al-'Ala' dan Abu Bakr al-Sijzi. Beliau mendengar hadits dari ayahnya, pamannya, Hamza al-Sahmi, dan hakim Abu 'Umar al-Bustami. Beliau melakukan perjalanan luas, mengajar di Nishapur, Rayy, dan Isfahan. Beliau memasuki Baghdad sebagai seorang peziarah, di mana beliau disambut oleh Abu Ishaq al-Shirazi, yang berkomentar, \"Saya tidak tahu mana yang lebih membahagiakan saya: memasuki Kota Perdamaian atau bertemu dengan Syekh Imam.\" Beliau meriwayatkan al-Kamil karya Ibnu 'Adi dan Tarikh Jurjan. Ia meninggal di Jurjan pada tahun 477 H."
