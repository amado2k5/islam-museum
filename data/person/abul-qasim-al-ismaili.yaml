label:
  ar: "أبو القاسم الإسماعيلي"
  en: "Abu'l-Qasim al-Isma'ili"
  ur: "ابو القاسم اسماعیلی"
roles: [scholar]
gender: male
summary:
  ar: "إسماعيل بن محمد بن إسماعيل بن الإمام أبي بكر أحمد بن إبراهيم الإسماعيلي، أبو القاسم الجرجاني، من بيت العلم والفضل والرياسة، صدرًا رئيسًا عالمًا كبيرًا، مليح الوعظ والتنظيم والنثر. ولد سنة 407 وقيل 406 بجرجان، تفقه عن جده أبي العلاء وأبي بكر السجزي، سمع أباه وعمه وحمزة السهمي والقاضي أبا عمر البسطامي، وسافر البلاد فحدث بنيسابور والري وأصبهان ودخل بغداد حاجًا فاستقبله أبو إسحاق الشيرازي وقال: لا أدري بأيهما أنا أشد فرحًا، بدخولي مدينة السلام أو رؤية الشيخ الإمام. روى الكامل لابن عدي وتاريخ جرجان. توفي بجرجان سنة 477 {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  en: "Isma'il ibn Muhammad al-Isma'ili, Abu'l-Qasim of Jurjan (b. 406 or 407, d. 477) — 'of a house of learning, excellence and leadership,' a presiding master and fine preacher in verse and prose. Studied fiqh under his grandfather Abu'l-'Ala' and Abu Bakr al-Sajzi; travelled and taught at Nishapur, Rayy and Isfahan, and entering Baghdad on hajj was welcomed by Abu Ishaq al-Shirazi: 'I know not which gladdens me more — entering the City of Peace or seeing the imam.' Transmitted Ibn 'Adi's Kamil and the Tarikh of Jurjan {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
  ur: "اسماعیل بن محمد اسماعیلی، ابو القاسم جرجانی (پ 406 یا 407ھ، مت 477ھ) — علم و فضل کی گھرانے کے صدر و سردار؛ دادا ابو العلاء اور ابو بکر سجزی سے فقہ سیکھی؛ نیشاپور، رے اور اصفہان میں حدیث پڑھائی؛ حج پر بغداد پہنچے تو ابو اسحاق شیرازی نے استقبال کیا اور کہا: مجھے نہیں معلوم میں کس چیز پر زیادہ خوش ہوں — شہرِ سلام میں داخلے پر یا شیخِ امام کی زیارت پر۔ ابن عدی کا الکامل اور تاریخِ جرجان روایت کیا {cite:tabaqat-shafiiyya-subki j.3 p.129-130}."
