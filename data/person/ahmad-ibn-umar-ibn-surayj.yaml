summary:
  ar: "القاضي أبو العباس أحمد بن عمر بن سريج، مات ببغداد سنة ست وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 57}. وكان من عظماء الشافعيين، ويقال له الباز الأشهب، وولي القضاء بشيراز، وكان يفضل على جميع أصحاب الشافعي حتى على المزني {cite:tabaqat-fuqaha-abbas-1981 p. 57}. ويروي الشيرازي عن شيخه أبي الحسن الشيرجي أن فهرست كتبه يشتمل على أربعمائة مصنف {cite:tabaqat-fuqaha-abbas-1981 p. 57}. وأخذ العلم عن أبي القاسم الأنماطي {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  en: "Qadi Abu al-Abbas Ahmad ibn Umar ibn Surayj died in Baghdad in 306 {cite:tabaqat-fuqaha-abbas-1981 p. 57}. He was among the great Shafi'is, called al-Baz al-Ashhab, served as qadi in Shiraz, and was preferred over all the companions of al-Shafi'i, even al-Muzani {cite:tabaqat-fuqaha-abbas-1981 p. 57}. Al-Shirazi relates from his shaykh Abu al-Hasan al-Shirji that the index of his books contained 400 works {cite:tabaqat-fuqaha-abbas-1981 p. 57}. He took knowledge from Abu al-Qasim al-Anmati {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
