label: { ar: "الحسين بن منصور الحلاج" }
summary:
  ar: "أمر المقتدر بقتل الحسين بن منصور الحلاج وإحراقه في سنة تسع وثلاثمائة، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي أدخل مشهوراً على جمل إلى بغداد سنة إحدى فصلب حياً ونودي عليه هذا أحد دعاة القرامطة فاعرفوه ثم حبس إلى أن قتل سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم، وأشيع عنه أنه ادعى الإلهية وأنه يقول بحلول اللاهوت في الأشراف ويكتب إلى أصحابه من النور الشعشعاني ونوظر فلم يوجد عنده شيء من القرآن ولا الحديث ولا الفقه {cite:tarikh-khulafa-minhaj-1434 p. 588,590}."
gender: male
