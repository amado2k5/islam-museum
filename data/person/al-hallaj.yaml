label: { ar: "الحسين بن منصور الحلاج" }
summary:
  ar: "أمر المقتدر بقتل الحسين بن منصور الحلاج وإحراقه في سنة تسع وثلاثمائة، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي أدخل مشهوراً على جمل إلى بغداد سنة إحدى فصلب حياً ونودي عليه هذا أحد دعاة القرامطة فاعرفوه ثم حبس إلى أن قتل سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم، وأشيع عنه أنه ادعى الإلهية وأنه يقول بحلول اللاهوت في الأشراف ويكتب إلى أصحابه من النور الشعشعاني ونوظر فلم يوجد عنده شيء من القرآن ولا الحديث ولا الفقه {cite:tarikh-khulafa-minhaj-1434 p. 588,590}.، وعند ابن النديم اختلف في بلده ومنشئه فقيل من خراسان من نيسابور وقيل من مرو وقيل من الطالقان وقال بعض أصحابه إنه من الري وقال آخرون من الجبال وليس يصح في أمره وأمر بلده شيء بته، وقرأ بخط طيفور أنه كان رجلا مختالا مشغبذا يتعاطى مذاهب الصوفية ويتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك ويعرف شيئا من صناعة الكيمياء، يروم إقلاب الدول ويدعي عند أصحابه الإلهية ويقول بالحلول ويظهر مذاهب الشيعة للملوك ومذاهب الصوفية للعامة، ولما قبض عليه سلم إلى علي بن عيسى فناظره فوجده صفرا من القرآن وعلومه ومن الفقه والحديث والشعر {cite:fihrist-ibn-al-nadim p. 675-676}، وقال ابن النديم قرأت بخط أبي الحسين عبيد الله بن أحمد بن أبي طاهر الحسين بن منصور الحلاج وكان رجلا محتالا مشعبذا يتعاطى مذاهب الصوفية يتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك وكان يعرف شيئا من صناعة الكيمياء وكان جاهلا مقداما مدخولا جسورا على السلاطين مرتكبا للمظالم يروم انقلاب الدول {cite:fihrist-ibn-al-nadim p. 269-270}، وقرأ ابن النديم بخط أبي الحسن بن سنان أن أمره ظهر وانتشر ذكره في سنة تسع وسبعين ومائتين، وأن السبب في أخذه أن صاحب البريد بالسوس اجتاز بموضع يعرف بالربض والقطمة فرأى امرأة في بعض الأزقة تقول إن تركتموني وإلا تكلمت فقبضوا عليها فأخبرت أن رجلا يعرف بالحلاج نزل في جانب دارها وله قوم يصيرون إليه خفية ويتكلمون بكلام منكر، فكبس الموضع فأخذوا رجلا أبيض الرأس واللحية معه العين والمسك والثياب والعصفر والعنبر والزعفران فأنكر أن يكون هو حتى عرفه رجل من أهل السوس بضربة في رأسه، وكان السلطان قد أخذ غلاما للحلاج يعرف بالدباس وأحلفه أنه يطلب الحلاج وبذل له مالا فعرفه بالسوس، ودفع الحلاج إلى نضر الحاجب واستغواه وكان في كتبه إني مغرق قوم نوح ومهلك عاد وثمود، ويقال إنه دعا أبا سهل النوبختي فقال لرسوله أنا رأس مذهب وخلفي ألوف من الناس يتبعونه باتباعي له فأنبت لي في مقدم رأسي شعرا فإن الشعر منه قد ذهب فلم يعد إليه الرسول {cite:fihrist-ibn-al-nadim p. 270-271}"
