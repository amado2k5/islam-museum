label: { ar: "الحسين بن منصور الحلاج", en: "al-Husayn ibn Mansur al-Hallaj" }
summary:
  ar: "أمر المقتدر بقتل الحسين بن منصور الحلاج وإحراقه في سنة تسع وثلاثمائة، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي أدخل مشهوراً على جمل إلى بغداد سنة إحدى فصلب حياً ونودي عليه هذا أحد دعاة القرامطة فاعرفوه ثم حبس إلى أن قتل سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم، وأشيع عنه أنه ادعى الإلهية وأنه يقول بحلول اللاهوت في الأشراف ويكتب إلى أصحابه من النور الشعشعاني ونوظر فلم يوجد عنده شيء من القرآن ولا الحديث ولا الفقه {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. وعند ابن النديم اختلف في بلده ومنشئه فقيل من خراسان من نيسابور وقيل من مرو وقيل من الطالقان وقال بعض أصحابه إنه من الري وقال آخرون من الجبال وليس يصح في أمره وأمر بلده شيء بته، وقرأ بخط طيفور أنه كان رجلا مختالا مشغبذا يتعاطى مذاهب الصوفية ويتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك ويعرف شيئا من صناعة الكيمياء، يروم إقلاب الدول ويدعي عند أصحابه الإلهية ويقول بالحلول ويظهر مذاهب الشيعة للملوك ومذاهب الصوفية للعامة، ولما قبض عليه سلم إلى علي بن عيسى فناظره فوجده صفرا من القرآن وعلومه ومن الفقه والحديث والشعر {cite:fihrist-ibn-al-nadim p. 675-676}، وقال ابن النديم قرأت بخط أبي الحسين عبيد الله بن أحمد بن أبي طاهر الحسين بن منصور الحلاج وكان رجلا محتالا مشعبذا يتعاطى مذاهب الصوفية يتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك وكان يعرف شيئا من صناعة الكيمياء وكان جاهلا مقداما مدخولا جسورا على السلاطين مرتكبا للمظالم يروم انقلاب الدول {cite:fihrist-ibn-al-nadim p. 269-270}، وقرأ ابن النديم بخط أبي الحسن بن سنان أن أمره ظهر وانتشر ذكره في سنة تسع وسبعين ومائتين، وأن السبب في أخذه أن صاحب البريد بالسوس اجتاز بموضع يعرف بالربض والقطمة فرأى امرأة في بعض الأزقة تقول إن تركتموني وإلا تكلمت فقبضوا عليها فأخبرت أن رجلا يعرف بالحلاج نزل في جانب دارها وله قوم يصيرون إليه خفية ويتكلمون بكلام منكر، فكبس الموضع فأخذوا رجلا أبيض الرأس واللحية معه العين والمسك والثياب والعصفر والعنبر والزعفران فأنكر أن يكون هو حتى عرفه رجل من أهل السوس بضربة في رأسه، وكان السلطان قد أخذ غلاما للحلاج يعرف بالدباس وأحلفه أنه يطلب الحلاج وبذل له مالا فعرفه بالسوس، ودفع الحلاج إلى نضر الحاجب واستغواه وكان في كتبه إني مغرق قوم نوح ومهلك عاد وثمود، ويقال إنه دعا أبا سهل النوبختي فقال لرسوله أنا رأس مذهب وخلفي ألوف من الناس يتبعونه باتباعي له فأنبت لي في مقدم رأسي شعرا فإن الشعر منه قد ذهب فلم يعد إليه الرسول {cite:fihrist-ibn-al-nadim p. 270-271}، وعند ابن الأثير كان يظهر الزهد والتصوف ويُظهر الكرامات يُخرج للناس فاكهة الشتاء في الصيف وفاكهة الصيف في الشتاء ويمد يده إلى الهواء فيعيدها مملوءة دراهم عليها مكتوب قل هو الله أحد ويسميها دراهم القدرة ويُخبر الناس بما أكلوه وما صنعوه في بيوتهم فيفتتن به خلق كثير واعتقدوا فيه الحلول، واختلف الناس فيه اختلافهم في المسيح فمن قائل إنه حلّ فيه جزؤه الإلهي ومن قائل إنه ولي الله وما يظهر منه من كرامات الصالحين ومن قائل إنه مشعوذ وساحر كذاب والجن تطيعه، وقدم من خراسان إلى العراق وسار إلى مكة فأقام بها سنين في الحجر لا يستظل تحت سقف شتاءً ولا صيفاً وكان يصوم الدهر فإذا جاءه العشاء أُحضر له كوز ماء وقرص فيعض من القرص ثلاث لقم من جوانبها ويترك الباقي فيأخذونه، ورآه شيخ الصوفية يومئذ عبد الله المغربي على صخرة بجبل أبي قبيس حافياً مكشوف الرأس والعرق يجري منه إلى الأرض فقال هذا يتصبر ويتقوى على قضاء الله {cite:kamil-ibn-al-athir p. 93-94}، وعند ابن الجوزي وفي يوم الاثنين سلخ ذي القعدة سنة 309هـ أخرج رأس الحسين بن منصور الحلاج من دار السلطان ليحمل إلى خراسان {cite:muntazam-ibn-al-jawzi p. 459}"
  en: "Al-Muqtadir ordered al-Husayn ibn Mansur al-Hallaj killed and burned in 309. Al-Tabari reports he was given a thousand lashes and had his hands and feet cut off {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. According to al-Suyuti, he was brought into Baghdad on a camel in 301, crucified alive, and proclaimed: 'This is one of the Qaramita missionaries; know him.' He was then held until he was killed in 309, on the fatwa of the judge Abu Umar and the jurists and scholars that his blood was lawful. It was rumoured that he claimed divinity, taught the indwelling of the divine in the nobles (ashraf), and wrote to his followers from 'the radiant light'; when he was examined, nothing of the Qur'an, hadith or jurisprudence was found with him {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. Ibn al-Nadim says his origin and birthplace were disputed, with Khurasan, Nishapur, Marw, al-Taliqan, Rayy and the Jibal all named, and nothing certain is known of him or his town. Ibn al-Nadim reports, in the hand of Tayfur, that he was a vain and deceitful man who affected Sufi doctrine and its vocabulary, claimed every science though he had none, knew a little alchemy, aimed to overturn states, claimed divinity before his followers, preached indwelling, showed Shi'i doctrines to rulers and Sufi ones to the common people. When seized he was handed to Ali ibn Isa, who examined him and found him empty of the Qur'an and its sciences, of jurisprudence, hadith and poetry {cite:fihrist-ibn-al-nadim p. 675-676}. Ibn al-Nadim also says he read, in the hand of Abu al-Husayn Ubayd Allah ibn Ahmad ibn Abi Tahir, a note on al-Husayn ibn Mansur al-Hallaj: a crafty, showy man who affected Sufi doctrine and its vocabulary, claimed every science though lacking them, knew some alchemy, was ignorant, bold and corrupt, audacious towards rulers, committed injustices and aimed to overturn states {cite:fihrist-ibn-al-nadim p. 269-270}. Ibn al-Nadim also read, in the hand of Abu al-Hasan ibn Sinan, that his affair became public and his name spread in 279. The cause of his arrest was that the postmaster of Sus passed a place called al-Rabad and al-Qitma and saw a woman in one of the alleys say, 'If you leave me, I will speak'; she was seized, and she reported that a man called al-Hallaj had lodged beside her house, with people who came to him in secret and spoke strange words. The place was raided and a man with white hair and beard was taken, with him al-'ayn, musk, clothing, safflower, ambergris and saffron. He denied being al-Hallaj until a man of Sus recognised him by a blow to his head. The sultan had seized a servant of al-Hallaj called al-Dabbas, made him swear that he was seeking al-Hallaj and offered him money; he identified him at Sus. Al-Hallaj was handed to Nasr the chamberlain, who tried to beguile him; among his writings was: 'I drown the people of Noah and destroy Ad and Thamud.' It is said that he summoned Abu Sahl al-Nawbakhti and told his messenger: 'I am the head of a doctrine, and behind me are thousands who follow it through following me; grow me hair at the front of my head, for the hair there has gone.' The messenger did not return to him {cite:fihrist-ibn-al-nadim p. 270-271}. Ibn al-Athir says he displayed asceticism and Sufism and claimed marvels: he produced winter fruit in summer and summer fruit in winter, reached his hand into the air and brought it back filled with dirhams inscribed with a Qur'anic verse, which he called dirhams of power; he told people what they had eaten and done in their houses, so that many were captivated and believed in his indwelling. People disagreed about him as they did about the Messiah: some said his divine part had entered him, some that he was a friend of God whose marvels were those of the righteous, and some that he was a conjuror and a lying sorcerer whom the jinn obeyed. He came from Khurasan to Iraq and went to Mecca, where he stayed for years in al-Hijr, never sheltering under a roof in winter or summer, and fasting continually. At nightfall a jug of water and a loaf were brought him; he bit three morsels from the edges of the loaf and left the rest, which they took. Abd Allah al-Maghribi, the Sufi shaykh of that time, saw him on a rock on Mount Abu Qubays, barefoot and bareheaded, sweat running to the ground, and said: 'He is enduring and strengthening himself to bear God's decree' {cite:kamil-ibn-al-athir p. 93-94}. Ibn al-Jawzi says that on Monday, the last day of Dhu al-Qa'da 309, the head of al-Husayn ibn Mansur al-Hallaj was taken out of the sultan's palace to be carried to Khurasan {cite:muntazam-ibn-al-jawzi p. 459}."
