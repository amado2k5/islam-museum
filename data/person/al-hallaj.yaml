id: person/al-hallaj
class: person
label: { ar: "الحسين بن منصور الحلاج", en: "al-Husayn ibn Mansur al-Hallaj", fr: "Al-Husayn ibn Mansur al-Hallaj", ur: "حسین بن منصور حلاج", es: "al-Husayn ibn Mansur al-Hallaj" }
summary:
  ar: "أمر المقتدر بقتل الحسين بن منصور الحلاج وإحراقه في سنة تسع وثلاثمائة، وذكر الطبري أنه ضُرب ألف سوط وقُطعت يداه ورجلاه {cite:tabari-tarikh-abu-al-fadl j.11 p.79}، وعند السيوطي أدخل مشهوراً على جمل إلى بغداد سنة إحدى فصلب حياً ونودي عليه هذا أحد دعاة القرامطة فاعرفوه ثم حبس إلى أن قتل سنة تسع بإفتاء القاضي أبي عمر والفقهاء والعلماء أنه حلال الدم، وأشيع عنه أنه ادعى الإلهية وأنه يقول بحلول اللاهوت في الأشراف ويكتب إلى أصحابه من النور الشعشعاني ونوظر فلم يوجد عنده شيء من القرآن ولا الحديث ولا الفقه {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. وعند ابن النديم اختلف في بلده ومنشئه فقيل من خراسان من نيسابور وقيل من مرو وقيل من الطالقان وقال بعض أصحابه إنه من الري وقال آخرون من الجبال وليس يصح في أمره وأمر بلده شيء بته، وقرأ بخط طيفور أنه كان رجلا مختالا مشغبذا يتعاطى مذاهب الصوفية ويتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك ويعرف شيئا من صناعة الكيمياء، يروم إقلاب الدول ويدعي عند أصحابه الإلهية ويقول بالحلول ويظهر مذاهب الشيعة للملوك ومذاهب الصوفية للعامة، ولما قبض عليه سلم إلى علي بن عيسى فناظره فوجده صفرا من القرآن وعلومه ومن الفقه والحديث والشعر {cite:fihrist-ibn-al-nadim p. 675-676}، وقال ابن النديم قرأت بخط أبي الحسين عبيد الله بن أحمد بن أبي طاهر الحسين بن منصور الحلاج وكان رجلا محتالا مشعبذا يتعاطى مذاهب الصوفية يتحلى ألفاظهم ويدعي كل علم وكان صفرا من ذلك وكان يعرف شيئا من صناعة الكيمياء وكان جاهلا مقداما مدخولا جسورا على السلاطين مرتكبا للمظالم يروم انقلاب الدول {cite:fihrist-ibn-al-nadim p. 269-270}، وقرأ ابن النديم بخط أبي الحسن بن سنان أن أمره ظهر وانتشر ذكره في سنة تسع وسبعين ومائتين، وأن السبب في أخذه أن صاحب البريد بالسوس اجتاز بموضع يعرف بالربض والقطمة فرأى امرأة في بعض الأزقة تقول إن تركتموني وإلا تكلمت فقبضوا عليها فأخبرت أن رجلا يعرف بالحلاج نزل في جانب دارها وله قوم يصيرون إليه خفية ويتكلمون بكلام منكر، فكبس الموضع فأخذوا رجلا أبيض الرأس واللحية معه العين والمسك والثياب والعصفر والعنبر والزعفران فأنكر أن يكون هو حتى عرفه رجل من أهل السوس بضربة في رأسه، وكان السلطان قد أخذ غلاما للحلاج يعرف بالدباس وأحلفه أنه يطلب الحلاج وبذل له مالا فعرفه بالسوس، ودفع الحلاج إلى نضر الحاجب واستغواه وكان في كتبه إني مغرق قوم نوح ومهلك عاد وثمود، ويقال إنه دعا أبا سهل النوبختي فقال لرسوله أنا رأس مذهب وخلفي ألوف من الناس يتبعونه باتباعي له فأنبت لي في مقدم رأسي شعرا فإن الشعر منه قد ذهب فلم يعد إليه الرسول {cite:fihrist-ibn-al-nadim p. 270-271}، وعند ابن الأثير كان يظهر الزهد والتصوف ويُظهر الكرامات يُخرج للناس فاكهة الشتاء في الصيف وفاكهة الصيف في الشتاء ويمد يده إلى الهواء فيعيدها مملوءة دراهم عليها مكتوب قل هو الله أحد ويسميها دراهم القدرة ويُخبر الناس بما أكلوه وما صنعوه في بيوتهم فيفتتن به خلق كثير واعتقدوا فيه الحلول، واختلف الناس فيه اختلافهم في المسيح فمن قائل إنه حلّ فيه جزؤه الإلهي ومن قائل إنه ولي الله وما يظهر منه من كرامات الصالحين ومن قائل إنه مشعوذ وساحر كذاب والجن تطيعه، وقدم من خراسان إلى العراق وسار إلى مكة فأقام بها سنين في الحجر لا يستظل تحت سقف شتاءً ولا صيفاً وكان يصوم الدهر فإذا جاءه العشاء أُحضر له كوز ماء وقرص فيعض من القرص ثلاث لقم من جوانبها ويترك الباقي فيأخذونه، ورآه شيخ الصوفية يومئذ عبد الله المغربي على صخرة بجبل أبي قبيس حافياً مكشوف الرأس والعرق يجري منه إلى الأرض فقال هذا يتصبر ويتقوى على قضاء الله {cite:kamil-ibn-al-athir p. 93-94}، وعند ابن الجوزي وفي يوم الاثنين سلخ ذي القعدة سنة 309هـ أخرج رأس الحسين بن منصور الحلاج من دار السلطان ليحمل إلى خراسان {cite:muntazam-ibn-al-jawzi p. 459}"
  en: "Al-Muqtadir ordered al-Husayn ibn Mansur al-Hallaj killed and burned in 309. Al-Tabari reports he was given a thousand lashes and had his hands and feet cut off {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. According to al-Suyuti, he was brought into Baghdad on a camel in 301, crucified alive, and proclaimed: 'This is one of the Qaramita missionaries; know him.' He was then held until he was killed in 309, on the fatwa of the judge Abu Umar and the jurists and scholars that his blood was lawful. It was rumoured that he claimed divinity, taught the indwelling of the divine in the nobles (ashraf), and wrote to his followers from 'the radiant light'; when he was examined, nothing of the Qur'an, hadith or jurisprudence was found with him {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. Ibn al-Nadim says his origin and birthplace were disputed, with Khurasan, Nishapur, Marw, al-Taliqan, Rayy and the Jibal all named, and nothing certain is known of him or his town. Ibn al-Nadim reports, in the hand of Tayfur, that he was a vain and deceitful man who affected Sufi doctrine and its vocabulary, claimed every science though he had none, knew a little alchemy, aimed to overturn states, claimed divinity before his followers, preached indwelling, showed Shi'i doctrines to rulers and Sufi ones to the common people. When seized he was handed to Ali ibn Isa, who examined him and found him empty of the Qur'an and its sciences, of jurisprudence, hadith and poetry {cite:fihrist-ibn-al-nadim p. 675-676}. Ibn al-Nadim also says he read, in the hand of Abu al-Husayn Ubayd Allah ibn Ahmad ibn Abi Tahir, a note on al-Husayn ibn Mansur al-Hallaj: a crafty, showy man who affected Sufi doctrine and its vocabulary, claimed every science though lacking them, knew some alchemy, was ignorant, bold and corrupt, audacious towards rulers, committed injustices and aimed to overturn states {cite:fihrist-ibn-al-nadim p. 269-270}. Ibn al-Nadim also read, in the hand of Abu al-Hasan ibn Sinan, that his affair became public and his name spread in 279. The cause of his arrest was that the postmaster of Sus passed a place called al-Rabad and al-Qitma and saw a woman in one of the alleys say, 'If you leave me, I will speak'; she was seized, and she reported that a man called al-Hallaj had lodged beside her house, with people who came to him in secret and spoke strange words. The place was raided and a man with white hair and beard was taken, with him al-'ayn, musk, clothing, safflower, ambergris and saffron. He denied being al-Hallaj until a man of Sus recognised him by a blow to his head. The sultan had seized a servant of al-Hallaj called al-Dabbas, made him swear that he was seeking al-Hallaj and offered him money; he identified him at Sus. Al-Hallaj was handed to Nasr the chamberlain, who tried to beguile him; among his writings was: 'I drown the people of Noah and destroy Ad and Thamud.' It is said that he summoned Abu Sahl al-Nawbakhti and told his messenger: 'I am the head of a doctrine, and behind me are thousands who follow it through following me; grow me hair at the front of my head, for the hair there has gone.' The messenger did not return to him {cite:fihrist-ibn-al-nadim p. 270-271}. Ibn al-Athir says he displayed asceticism and Sufism and claimed marvels: he produced winter fruit in summer and summer fruit in winter, reached his hand into the air and brought it back filled with dirhams inscribed with a Qur'anic verse, which he called dirhams of power; he told people what they had eaten and done in their houses, so that many were captivated and believed in his indwelling. People disagreed about him as they did about the Messiah: some said his divine part had entered him, some that he was a friend of God whose marvels were those of the righteous, and some that he was a conjuror and a lying sorcerer whom the jinn obeyed. He came from Khurasan to Iraq and went to Mecca, where he stayed for years in al-Hijr, never sheltering under a roof in winter or summer, and fasting continually. At nightfall a jug of water and a loaf were brought him; he bit three morsels from the edges of the loaf and left the rest, which they took. Abd Allah al-Maghribi, the Sufi shaykh of that time, saw him on a rock on Mount Abu Qubays, barefoot and bareheaded, sweat running to the ground, and said: 'He is enduring and strengthening himself to bear God's decree' {cite:kamil-ibn-al-athir p. 93-94}. Ibn al-Jawzi says that on Monday, the last day of Dhu al-Qa'da 309, the head of al-Husayn ibn Mansur al-Hallaj was taken out of the sultan's palace to be carried to Khurasan {cite:muntazam-ibn-al-jawzi p. 459}."
  fr: "Selon al-Tabari, al-Muqtadir ordonna de tuer et de brûler al-Husayn ibn Mansur al-Hallaj en 309 H ; il reçut mille coups de fouet et eut les mains et les pieds coupés {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. Selon al-Suyuti, il fut amené à Bagdad sur un chameau en 301 H, crucifié vivant et désigné par une proclamation comme l’un des missionnaires des Qaramita qu’il fallait reconnaître. Il fut ensuite détenu jusqu’à son exécution en 309 H, sur la fatwa du juge Abu Umar, des juristes et des savants déclarant son sang licite. On disait qu’il prétendait à la divinité, enseignait l’inhabitation du divin dans les nobles (ashraf) et écrivait à ses fidèles depuis « la lumière rayonnante » ; lors de son interrogatoire, on ne trouva chez lui rien du Coran, du hadith ou de la jurisprudence {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. Ibn al-Nadim dit que son origine et son lieu de naissance étaient discutés : Khorassan, Nichapour, Marw, al-Taliqan, Rayy et le Jibal étaient tous cités, sans certitude sur lui ni sur sa ville. Ibn al-Nadim rapporte d’un écrit de Tayfur qu’il était vaniteux et trompeur, affectait la doctrine et le vocabulaire soufis, prétendait à toutes les sciences sans en posséder aucune, connaissait un peu d’alchimie, visait à renverser les États, se disait divin devant ses fidèles, prêchait l’inhabitation, affichait les doctrines chiites devant les gouvernants et les doctrines soufies devant le peuple. Arrêté, il fut remis à Ali ibn Isa qui l’interrogea et le trouva dépourvu de savoir sur le Coran et ses sciences, la jurisprudence, le hadith et la poésie {cite:fihrist-ibn-al-nadim p. 675-676}. Ibn al-Nadim dit aussi avoir lu de la main d’Abu al-Husayn Ubayd Allah ibn Ahmad ibn Abi Tahir une note sur al-Husayn ibn Mansur al-Hallaj le décrivant comme rusé et ostentatoire, affectant la doctrine et le vocabulaire soufis, prétendant à toutes les sciences sans les posséder, connaissant un peu l’alchimie, ignorant, hardi et corrompu, audacieux envers les gouvernants, commettant des injustices et cherchant à renverser les États {cite:fihrist-ibn-al-nadim p. 269-270}. Ibn al-Nadim lut aussi de la main d’Abu al-Hasan ibn Sinan que son affaire devint publique et son nom se répandit en 279 H. La cause de son arrestation fut que le maître de poste de Sus passa en un lieu appelé al-Rabad et al-Qitma et entendit une femme dire dans une ruelle : « Si vous me laissez, je parlerai. » Arrêtée, elle raconta qu’un homme nommé al-Hallaj avait logé près de chez elle, avec des gens qui venaient secrètement et tenaient des propos étranges. Le lieu fut perquisitionné et on prit un homme aux cheveux et à la barbe blancs, avec de l’al-ayn, du musc, des vêtements, du carthame, de l’ambre gris et du safran. Il nia être al-Hallaj jusqu’à ce qu’un homme de Sus le reconnaisse à une blessure à la tête. Le sultan avait arrêté un serviteur d’al-Hallaj nommé al-Dabbas, lui avait fait jurer de rechercher al-Hallaj et lui avait offert de l’argent ; il l’identifia à Sus. Al-Hallaj fut remis à Nasr le chambellan, qui tenta de l’amadouer ; parmi ses écrits figurait l’affirmation qu’il noyait le peuple de Noé et détruisait Ad et Thamud. Il aurait fait appeler Abu Sahl al-Nawbakhti et dit à son messager qu’il était à la tête d’une doctrine suivie par des milliers de personnes, en lui demandant de lui faire repousser les cheveux à l’avant de la tête, où ils avaient disparu. Le messager ne revint pas auprès de lui {cite:fihrist-ibn-al-nadim p. 270-271}. Ibn al-Athir dit qu’il affichait ascétisme, soufisme et prodiges : il produisait des fruits d’hiver en été et d’été en hiver, tendait la main dans l’air et la ramenait pleine de dirhams portant un verset coranique, qu’il appelait dirhams de la puissance ; il disait aux gens ce qu’ils avaient mangé et fait chez eux, si bien que beaucoup furent captivés et crurent à l’inhabitation divine en lui. Les gens divergeaient sur lui comme sur le Messie : certains disaient que sa part divine était entrée en lui, d’autres qu’il était un ami de Dieu dont les prodiges étaient ceux des justes, d’autres encore un prestidigitateur et un sorcier menteur auquel les djinns obéissaient. Il vint du Khorassan en Irak puis alla à La Mecque, où il resta des années dans le Hijr, sans s’abriter sous un toit en hiver ni en été et jeûnant continuellement. À la tombée de la nuit, on lui apportait une cruche d’eau et un pain ; il mordait trois bouchées aux bords du pain et laissait le reste, qu’on emportait. Abd Allah al-Maghribi, cheikh soufi de cette époque, le vit sur un rocher du mont Abu Qubays, pieds et tête nus, la sueur coulant jusqu’au sol, et dit qu’il endurait et se fortifiait pour supporter le décret de Dieu {cite:kamil-ibn-al-athir p. 93-94}. Ibn al-Jawzi dit que le lundi, dernier jour de dhu al-qa’da 309 H, la tête d’al-Husayn ibn Mansur al-Hallaj fut sortie du palais du sultan pour être portée au Khorassan {cite:muntazam-ibn-al-jawzi p. 459}."
  es: "Al-Muqtadir ordenó que al-Husayn ibn Mansur al-Hallaj fuera asesinado y quemado en 309. Al-Tabari informa que recibió mil latigazos y que le cortaron las manos y los pies {cite:tabari-tarikh-abu-al-fadl j.11 p.79}. Según al-Suyuti, fue llevado a Bagdad en un camello en 301, crucificado vivo y proclamado: 'Este es uno de los misioneros Qaramita; conózcanlo'. Luego fue retenido hasta que fue asesinado en 309, por la fatwa del juez Abu Umar y los juristas y eruditos que declararon que su sangre era lícita. Se rumoreaba que afirmaba ser divino, enseñaba la morada de lo divino en los nobles (ashraf) y escribía a sus seguidores desde 'la luz radiante'; Cuando fue examinado, no se encontró en él nada del Corán, hadices ni jurisprudencia {cite:tarikh-khulafa-minhaj-1434 p. 588,590}. Ibn al-Nadim dice que su origen y lugar de nacimiento fueron disputados, mencionándose Jorasán, Nishapur, Marw, al-Taliqan, Rayy y Jibal, y no se sabe nada con certeza sobre él ni sobre su ciudad. Ibn al-Nadim relata, de puño y letra de Tayfur, que era un hombre vanidoso y engañoso que imitaba la doctrina sufí y su vocabulario, afirmaba poseer toda clase de ciencias aunque no las tenía, sabía un poco de alquimia, pretendía derrocar estados, se proclamaba divino ante sus seguidores, predicaba la morada interior, mostraba doctrinas chiíes a los gobernantes y sufíes al pueblo llano. Cuando fue apresado, fue entregado a Ali ibn Isa, quien lo examinó y lo encontró vacío del Corán y sus ciencias, de jurisprudencia, hadices y poesía {cite:fihrist-ibn-al-nadim p. 675-676}. Ibn al-Nadim también dice que leyó, de puño y letra de Abu al-Husayn Ubayd Allah ibn Ahmad ibn Abi Tahir, una nota sobre al-Husayn ibn Mansur al-Hallaj: un hombre astuto y ostentoso que imitaba la doctrina sufí y su vocabulario, afirmaba poseer todas las ciencias aunque carecía de ellas, conocía algo de alquimia, era ignorante, audaz y corrupto, osado con los gobernantes, cometía injusticias y pretendía derrocar estados {cite:fihrist-ibn-al-nadim p. 269-270}. Ibn al-Nadim también leyó, de puño y letra de Abu al-Hasan ibn Sinan, que su asunto se hizo público y su nombre se extendió en el año 279. La causa de su arresto fue que el jefe de correos de Sus pasó por un lugar llamado al-Rabad y al-Qitma y vio a una mujer en uno de los callejones decir: «Si me dejas, hablaré»; fue apresada, y ella informó que un hombre llamado al-Hallaj se había hospedado junto a su casa, con personas que venían a él en secreto y decían palabras extrañas. El lugar fue allanado y se llevaron a un hombre con cabello y barba blancos, con él al-'ayn, almizcle, ropa, cártamo, ámbar gris y azafrán. Negó ser al-Hallaj hasta que un hombre de Sus lo reconoció por un golpe en la cabeza. El sultán había apresado a un sirviente de al-Hallaj llamado al-Dabbas, lo hizo jurar que estaba buscando a al-Hallaj y le ofreció dinero; lo identificó en Sus. Al-Hallaj fue entregado a Nasr el chambelán, quien intentó engañarlo; entre sus escritos estaba: 'Ahogaré al pueblo de Noé y destruiré a Ad y Thamud'. Se dice que llamó a Abu Sahl al-Nawbakhti y le dijo a su mensajero: 'Soy la cabeza de una doctrina, y detrás de mí hay miles que la siguen siguiéndome; hazme crecer cabello en la frente, porque el cabello de allí se ha caído'. El mensajero no regresó con él {cite:fihrist-ibn-al-nadim p. 270-271}. Ibn al-Athir dice que mostró ascetismo y sufismo y afirmó maravillas: produjo fruta de invierno en verano y fruta de verano en invierno, extendió su mano al aire y la trajo de vuelta llena de dirhams inscritos con un versículo coránico, que él llamó dirhams de poder; les dijo a las personas lo que habían comido y hecho en sus casas, de modo que muchos quedaron cautivados y creyeron en su morada. La gente discrepaba sobre él, al igual que sobre el Mesías: algunos decían que su parte divina había entrado en él, otros que era amigo de Dios cuyas maravillas eran propias de los justos, y otros que era un ilusionista y un hechicero mentiroso al que obedecían los genios. Llegó de Jorasán a Irak y luego a La Meca, donde permaneció durante años en al-Hijr, sin resguardarse bajo techo ni en invierno ni en verano, y ayunando continuamente. Al anochecer le trajeron una jarra de agua y un pan; mordió tres trozos de los bordes del pan y dejó el resto, que ellos tomaron. Abd Allah al-Maghribi, el jeque sufí de aquella época, lo vio sobre una roca en el monte Abu Qubays, descalzo y con la cabeza descubierta, con el sudor cayéndole al suelo, y dijo: «Está resistiendo y fortaleciéndose para soportar el decreto de Dios» {cita:kamil-ibn-al-athir, págs. 93-94}. Ibn al-Jawzi dice que el lunes, último día de Dhu al-Qa'da 309, la cabeza de al-Husayn ibn Mansur al-Hallaj fue sacada del palacio del sultán para ser llevada a Jorasán {cite:muntazam-ibn-al-jawzi p. 459}."
  ur: "المقتدیر نے 309 میں الحسین بن منصور الحلاج کو قتل کرنے اور جلانے کا حکم دیا۔ الطبری بیان کرتا ہے کہ اسے ایک ہزار کوڑے لگائے گئے اور اس کے ہاتھ پاؤں کاٹ دیے گئے۔ السیوطی کے مطابق، اسے 301 میں ایک اونٹ پر بغداد لایا گیا، اسے زندہ سولی پر چڑھایا گیا، اور اعلان کیا: 'یہ قرامیتہ مشنریوں میں سے ایک ہے۔ اسے جانو اس کے بعد اسے 309 میں قتل کر دیا گیا، جج ابو عمر اور فقہاء اور علماء کے اس فتوے پر کہ اس کا خون حلال ہے۔ یہ افواہ تھی کہ اس نے الوہیت کا دعویٰ کیا، اشرفیوں ⁦(اشرف)⁩ میں الہی کے قیام کی تعلیم دی، اور اپنے پیروکاروں کو 'دی تابناک روشنی' سے لکھا؛ جب اس کا جائزہ لیا گیا تو اس کے پاس سے قرآن، حدیث یا فقہ میں سے کچھ نہیں ملا۔ 588,590}۔ ابن الندیم کہتے ہیں کہ اس کی پیدائش اور جائے پیدائش کے بارے میں اختلاف تھا، خراسان، نیشاپور، مرو، الطلقان، رے اور جبل سب کے نام ہیں، اور اس کے یا اس کے شہر کے بارے میں کچھ معلوم نہیں ہے۔ ابن الندیم نے طیفور کے حوالے سے بیان کیا ہے کہ وہ ایک بے ہودہ اور دھوکہ باز آدمی تھا جس نے صوفی نظریہ اور اس کے ذخیرہ الفاظ کو متاثر کیا، ہر سائنس کا دعویٰ کیا حالانکہ اس کے پاس کوئی بھی نہیں تھا، تھوڑی سی کیمیا جانتا تھا، جس کا مقصد ریاستوں کو الٹنا تھا، اپنے پیروکاروں کے سامنے الوہیت کا دعویٰ کرتا تھا، عام لوگوں کی حکمرانی کی تبلیغ کرتا تھا۔ لوگ جب پکڑا گیا تو اسے علی ابن عیسیٰ کے حوالے کر دیا گیا، جس نے اس کا معائنہ کیا اور اسے قرآن اور اس کے علوم، فقہ، حدیث اور شاعری سے خالی پایا۔ 675-676}۔ ابن الندیم کا یہ بھی کہنا ہے کہ اس نے ابو الحسین عبید اللہ ابن احمد ابن ابی طاہر کے ہاتھ میں الحسین بن منصور الحلاج پر ایک نوٹ پڑھا: ایک چالاک، شوخ آدمی جس نے صوفی عقیدہ اور اس کے الفاظ کو متاثر کیا، ہر سائنس کا دعویٰ کیا کہ ان میں کچھ کمی تھی، لیکن اس میں کچھ ناقص اور ناقص تھا۔ حکمرانوں کے خلاف بہادر، ناانصافیوں کا ارتکاب کیا اور ریاستوں کو الٹنا مقصود تھا 269-270}۔ ابن الندیم نے ابو الحسن بن سنان کے ہاتھ میں یہ بھی پڑھا کہ اس کا معاملہ عام ہوگیا اور اس کا نام 279 میں پھیل گیا۔ اس کی گرفتاری کا سبب یہ تھا کہ سس کا پوسٹ ماسٹر الرباد اور القطمہ نامی جگہ سے گزرا اور ایک گلی میں ایک عورت کو دیکھا کہ اگر تم مجھے چھوڑ دو تو میں بولوں گا۔ اسے پکڑ لیا گیا، اور اس نے بتایا کہ الحلاج نامی ایک شخص اس کے گھر کے پاس ٹھہرا ہوا تھا، اس کے پاس ایسے لوگ تھے جو چھپ کر اس کے پاس آتے تھے اور عجیب و غریب باتیں کرتے تھے۔ اس جگہ پر چھاپہ مارا گیا اور ایک سفید بال اور داڑھی والا آدمی پکڑا گیا، اس کے ساتھ العین، مشک، لباس، زعفران، عنبر اور زعفران تھا۔ اس نے حلاج ہونے سے انکار کیا یہاں تک کہ سس کے ایک آدمی نے اس کے سر پر ضرب لگا کر اسے پہچان لیا۔ سلطان نے حلاج کے ایک خادم کو پکڑا جس کا نام الدباس تھا، اس سے قسم کھائی کہ وہ حلاج کی تلاش میں ہے اور اسے رقم کی پیشکش کی ہے۔ اس نے اسے سس میں شناخت کیا۔ الحلاج کو نصر چیمبرلین کے حوالے کر دیا گیا، جس نے اسے دھوکہ دینے کی کوشش کی۔ ان کی تصانیف میں سے تھا: 'میں نوح کی قوم کو غرق کرتا ہوں اور عاد اور ثمود کو ہلاک کرتا ہوں۔' کہا جاتا ہے کہ اس نے ابو سہل النبختی کو بلایا اور اپنے قاصد سے کہا: 'میں ایک عقیدہ کا سربراہ ہوں، اور میرے پیچھے ہزاروں لوگ ہیں جو میری پیروی سے اس کی پیروی کرتے ہیں۔ میرے سر کے آگے بال اگاؤ، کیونکہ بال ختم ہو گئے ہیں۔' قاصد اس کے پاس واپس نہیں آیا۔ 270-271}۔ ابن اثیر کہتے ہیں کہ اس نے سنت اور تصوف کا مظاہرہ کیا اور کمالات کا دعویٰ کیا: اس نے گرمیوں میں سردیوں کے پھل اور سردیوں میں موسم گرما کے پھل پیدا کیے، اپنے ہاتھ کو ہوا میں پہنچایا اور اسے درہموں سے بھر کر واپس لایا جس میں ایک قرآنی آیت لکھی ہوئی تھی، جسے وہ طاقت کے درہم کہتے تھے۔ اس نے لوگوں کو بتایا کہ انہوں نے اپنے گھروں میں کیا کھایا اور کیا، تاکہ بہت سے لوگ اس کے سحر میں گرفتار ہو گئے اور اس کے رہنے پر یقین کر گئے۔ لوگوں نے اس کے بارے میں اسی طرح اختلاف کیا جیسا کہ انہوں نے مسیح کے بارے میں کیا تھا: کچھ نے کہا کہ اس کا الہی حصہ اس میں داخل ہوا ہے، کچھ نے کہا کہ وہ خدا کا دوست تھا جس کے معجزات صالحین تھے، اور کچھ نے کہا کہ وہ ایک جادوگر اور جھوٹا جادوگر تھا جس کی جنات نے اطاعت کی۔ وہ خراسان سے عراق آیا اور مکہ چلا گیا، جہاں آپ نے الحجر میں برسوں قیام کیا، سردیوں یا گرمیوں میں کبھی چھت کے نیچے پناہ نہیں لی، اور مسلسل روزے رکھتے تھے۔ رات گئے پانی کا ایک جگ اور ایک روٹی لایا گیا۔ اس نے روٹی کے کناروں سے تین لقمے کاٹے اور باقی جو انہوں نے لے لیے اسے چھوڑ دیا۔ اس زمانے کے صوفی شیخ عبد اللہ المغربی نے انہیں ابو قبیس پہاڑ پر ایک چٹان پر ننگے پاؤں اور ننگے سر، پسینہ زمین پر دوڑتے ہوئے دیکھا، اور کہا: 'وہ خدا کے فرمان کو برداشت کرنے کے لیے صبر کر رہا ہے اور اپنے آپ کو مضبوط کر رہا ہے'۔ 93-94}۔ ابن الجوزی کہتے ہیں کہ پیر کے دن ذی القعدہ 309 کے آخری دن الحسین بن منصور الحلاج کا سر سلطان کے محل سے خراسان لے جایا گیا تھا۔ 459}۔"
