  fr: "Muhammad ibn Sulayman al-Katib"
  ur: "محمد بن سلیمان کاتب"
summary:
  ar: "محمد بن سليمان الكاتب، من ديار مضر من الرقة؛ اصطنعه أحمد بن طولون بمصر ثم تنكر له فلحق ببغداد فصار كاتباً للجيش ومن أعظم قواد المكتفي، أغرى الخلفاء بملك مصر فلما فشلت دولة بني طولون وعاث القرامطة بالشام بعثه المكتفي في العساكر فهزم القرامطة وأسر صاحب الشامة، ثم استولى على الشام ودخل مصر فكسر أمر هارون بن خمارويه وقيد بني طولون وأشخصهم إلى بغداد، وأحرق القطائع التي بناها أحمد بن طولون ميلاً في ميل ونُهبت الفسطاط سنة 292هـ، فكان المتولي لتحويل دولة بني طولون. وعند ابن الجوزي دخل الفسطاط سنة اثنتين وتسعين ومائتين وأخذ آل طولون وكانوا بضعة عشر رجلًا فقتلهم وحبسهم واحتوى على دورهم وجبى الخراج {cite:muntazam-ibn-al-jawzi p. 342}."
  en: "Muhammad ibn Sulayman al-Katib, from Diyar Mudar of al-Raqqa; Ahmad ibn Tulun's own protege in Egypt until estranged, he fled to Baghdad becoming army secretary and one of al-Muqtafi's greatest commanders, urging the caliphs to retake Egypt — when Tulunid power failed and the Qarmatians ravaged Syria, al-Muqtafi sent him with the armies: he crushed the Qarmatians, captured their Shama chief, took Syria, entered Egypt breaking Harun ibn Khumarawayh, chained the Banu Tulun (seventeen men) and shipped them to Baghdad, and burned Ibn Tulun's al-Qata'i' mile by mile while Fustat was plundered — the man who turned over the Tulunid state in 292 AH."
  es: "Muhammad ibn Sulayman al-Katib, de Diyar Mudar de al-Raqqa; protegido del propio Ahmad ibn Tulun en Egipto hasta que se distanció de él, huyó a Bagdad convirtiéndose en secretario del ejército y uno de los mayores comandantes de al-Muqtafi, instando a los califas a retomar Egipto. Cuando el poder tuluní fracasó y los cármatas asolaron Siria, al-Muqtafi lo envió con los ejércitos: aplastó a los cármatas, capturó a su jefe Shama, tomó Siria, entró en Egipto, derrocó a Harun ibn Khumarawayh, encadenó a los Banu Tulun (diecisiete hombres) y los envió a Bagdad, y quemó al-Qata'i' de Ibn Tulun milla por milla mientras Fustat era saqueada; el hombre que derrocó el estado tuluní en el 292 AH."
  fr: "Muhammad ibn Sulayman al-Katib, originaire de Diyar Mudar d'al-Raqqa, était le protégé d'Ahmad ibn Tulun en Égypte. Après leur rupture, il s'enfuit à Bagdad où il devint secrétaire de l'armée et l'un des plus grands commandants d'al-Muqtafi, exhortant les califes à reprendre l'Égypte. Lorsque le pouvoir toulounide s'effondra et que les Qarmates ravagèrent la Syrie, al-Muqtafi l'envoya avec les armées: il écrasa les Qarmates, captura leur chef Shama, prit la Syrie, entra en Égypte en brisant Harun ibn Khumarawayh, enchaîna les Banu Tulun (dix-sept hommes) et les envoya à Bagdad, et brûla le Qata'i' d'Ibn Tulun kilomètre par kilomètre tandis que Fustat était pillée. C'est lui qui renversa l'État toulounide en 292 AH."
  ur: "محمد بن سلیمان الکاتب، دیار مدر الرقہ سے؛ مصر میں احمد بن طولون کا اپنا حامی یہاں تک کہ وہ الگ ہو گیا، وہ بغداد فرار ہو کر آرمی سیکرٹری اور المقطفی کے سب سے بڑے کمانڈروں میں سے ایک بن گیا، خلیفہ سے مصر پر دوبارہ قبضہ کرنے کی تاکید کی - جب طولونید کی طاقت ناکام ہو گئی اور قرامطیوں نے شام کو تباہ کر دیا، المقطفی نے اسے اپنے کرشماتی لشکروں کے ساتھ شام بھیج دیا، قمطفی کے سرغنہ، قارطان کو شام بھیج دیا۔ ہارون بن خمارویہ کو توڑتے ہوئے مصر میں داخل ہوا، بنو طولون ⁦(سترہ آدمیوں)⁩ کو جکڑ کر بغداد بھیج دیا، اور ابن طولون کے القطاعی کو میل کے فاصلے پر جلا دیا جب کہ فوستات کو لوٹ لیا گیا۔"
  tr: "Muhammed bin Süleyman el-Katib Rakka yakınlarındaki Mudar topraklarındandı; Ahmed ibn Tulun onu Mısır'da uydurdu ama sonra reddetti, bu yüzden Bağdat'a katıldı ve ordu sekreteri ve el-Muktifi'nin en büyük komutanlarından biri oldu. Halifeleri Mısır'ın yönetimiyle ayarttı. Banu Tulun devleti çöküp Karmatlılar Levant'ı işgal ettiğinde, el-Muktafi onu ordularla gönderdi, Karmatlıları yendi ve Levant'ın hükümdarını ele geçirdi. Daha sonra Şam'ı ele geçirdi, Mısır'a girdi, Harun bin Humarawayh'in komutasını bozdu, Banu Tulun'u bağladı ve onları Bağdat'a atadı, Ahmed bin Tulun tarafından inşa edilen tahkimatları mil mil yaktı ve 292 Hicri'de Fustat'ı yağmaladı. Banu Tulun devletini dönüştürmekten sorumlu kişi oydu. İbn el-Cewzi, 292 Hicri yılında Fustat'a girdi ve az sayıdaki Tulun ailesini yakaladı, onları öldürdü, hapsetti, evlerini aldı ve vergi topladı {atıf:muntazam-ibn-al-jawzi, s. 342}."
  id: "Muhammad ibn Sulayman al-Katib berasal dari tanah Mudar dekat Raqqa; Ahmad ibn Tulun membuatnya di Mesir tetapi kemudian menolak, sehingga ia bergabung dengan Baghdad dan menjadi sekretaris tentara serta salah satu komandan terbesar al-Muktifi. Ia menggoda para khalifah dengan pemerintahan Mesir. Ketika negara Banu Tulun gagal dan Qarmatian menyerbu Levant, al-Muktafi mengirimnya dengan pasukan, mengalahkan Qarmatia dan menangkap penguasa Levant. Ia kemudian merebut Levant, memasuki Mesir, membatalkan komando Harun ibn Khumarawayh, mengikat Banu Tulun dan menugaskan mereka ke Baghdad, membakar benteng yang dibangun Ahmad ibn Tulun bermil-mil, dan menjarah Fustat pada tahun 292 H. Ia adalah orang yang bertanggung jawab mengubah negara Banu Tusun. Ibn al-Jawzi memasuki Fustat pada tahun 292 H dan menangkap keluarga Tulun, yang hanya beberapa orang, membunuh mereka, memenjarakan, mengambil rumah mereka, dan memungut pajak {cite:muntazam-ibn-al-jawzi, hlm. 342}."
