id: person/muhammad-ibn-sulayman-al-katib
class: person
label:
  ar: محمد بن سليمان الكاتب
  en: Muhammad ibn Sulayman al-Katib
summary:
  ar: "محمد بن سليمان الكاتب، من ديار مضر من الرقة؛ اصطنعه أحمد بن طولون بمصر ثم تنكر له فلحق ببغداد فصار كاتباً للجيش ومن أعظم قواد المكتفي، أغرى الخلفاء بملك مصر فلما فشلت دولة بني طولون وعاث القرامطة بالشام بعثه المكتفي في العساكر فهزم القرامطة وأسر صاحب الشامة، ثم استولى على الشام ودخل مصر فكسر أمر هارون بن خمارويه وقيد بني طولون وأشخصهم إلى بغداد، وأحرق القطائع التي بناها أحمد بن طولون ميلاً في ميل ونُهبت الفسطاط سنة 292هـ، فكان المتولي لتحويل دولة بني طولون."
  en: "Muhammad ibn Sulayman al-Katib, from Diyar Mudar of al-Raqqa; Ahmad ibn Tulun's own protege in Egypt until estranged, he fled to Baghdad becoming army secretary and one of al-Muqtafi's greatest commanders, urging the caliphs to retake Egypt — when Tulunid power failed and the Qarmatians ravaged Syria, al-Muqtafi sent him with the armies: he crushed the Qarmatians, captured their Shama chief, took Syria, entered Egypt breaking Harun ibn Khumarawayh, chained the Banu Tulun (seventeen men) and shipped them to Baghdad, and burned Ibn Tulun's al-Qata'i' mile by mile while Fustat was plundered — the man who turned over the Tulunid state in 292 AH."
