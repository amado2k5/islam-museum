summary:
  ar: "سياسية وناشطة باكستانية من لاهور (1896–1979)، ابنة السير محمد شفيع؛ من أوائل النساء في مجلس البنجاب التشريعي (1937) وأول امرأة في آسيا ترأس جلسة تشريعية. أسست رابطة نساء البنجاب المسلمات (1935)، وكانت من مؤسسي جمعية المرأة الباكستانية (أبوا) ونائبة رئيسها، وقادت احتجاج 1948 الذي أعاد مشروع قانون الفرص الاقتصادية للنساء إلى جدول الأعمال؛ وألّفت رواية «حسن آرا بيغوم» ومذكراتها «أب وابنة»."
  en: "Pakistani politician and activist of Lahore (1896–1979), the daughter of Sir Muhammad Shafi; among the first women in the Punjab Legislative Assembly (1937) and the first woman in Asia to preside over a legislative session. She founded the Punjab Provincial Women's Muslim League (1935), was a founding member and vice-president of the All Pakistan Women's Association (APWA), and led the 1948 protest that restored a women's economic-opportunities bill to the agenda; she wrote the novel Husn Ara Begum and her memoirs, Father and Daughter."
  ur: "لاہور سے تعلق رکھنے والی پاکستانی سیاست دان اور سماجی کارکن (1896ء–1979ء)، سر محمد شفیع کی صاحبزادی؛ پنجاب قانون ساز اسمبلی کی اولین خواتین ارکان میں سے ایک (1937ء) اور ایشیا میں کسی قانون ساز اجلاس کی صدارت کرنے والی پہلی خاتون۔ انھوں نے 1935ء میں پنجاب صوبائی ویمنز مسلم لیگ قائم کی، آل پاکستان ویمنز ایسوسی ایشن (اپوا) کی بانی ارکان اور نائب صدر رہیں، اور 1948ء میں خواتین کے معاشی مواقع کے بل کی واپسی کے خلاف احتجاج کی قیادت کی؛ ان کی تصانیف میں ناول «حسن آرا بیگم» اور ان کی سیاسی خودنوشت «Father and Daughter» شامل ہیں۔"
