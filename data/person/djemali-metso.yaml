summary:
  ar: "مفتي كوموتيني ⁦(رودوبي)⁩ في تراقيا الغربية باليونان لنحو ثلاثة عقود ⁦(1985–2018)⁩؛ وُلد في قرية إخينوس بكازا كسانتي سنة 1937، حفظ القرآن في صغره ودرس العلوم الإسلامية في الجامعة الإسلامية بالمدينة المنورة ثم عاد فتجوّل واعظًا في قرى رودوبي قبل تعيينه مفتيًا بمرسوم رئاسي، وأُحيل على التقاعد قسرًا بقانون سنة 2018 فطعن في القرار، وتوفي في أليكساندروبولي سنة 2019."
  en: "Mufti of Komotini ⁦(Rhodope)⁩ in Greece's Western Thrace for some three decades ⁦(1985–2018)⁩. Born in 1937 in the village of Echinos in Xanthi prefecture, he memorised the Qur'an as a boy, studied at the Islamic University of Madinah, then preached across the Rhodope villages before his appointment as mufti by presidential decree. Compulsorily retired by law in 2018, he appealed the decision; he died in Alexandroupoli on 20 December 2019."
  ur: "یونان کی مغربی تھریس میں کوموتینی ⁦(رودوپے)⁩ کے مفتی تقریباً تین دہائیوں ⁦(1985–2018)⁩۔ 1937 میں ضلع زانتی کے گاؤں اخینوس میں پیدا ہوئے، بچپن میں حافظِ قرآن ہوئے، جامعہ اسلامیہ مدینہ منورہ سے تعلیم پائی، پھر رودوپے کے دیہات میں وعظ کرتے رہے اور صدارتی فرمان سے مفتی مقرر ہوئے۔ 2018 میں قانون کے ذریعے جبری ریٹائر کیے گئے تو فیصلے کے خلاف اپیل کی؛ 20 دسمبر 2019 کو الکسانڈروپولی میں انتقال ہوا۔"
  es: "Fue muftí de Komotini (Ródope), en la Tracia Occidental griega, durante unas tres décadas (1985-2018). Nacido en 1937 en la aldea de Echinos, en la prefectura de Xanthi, memorizó el Corán de niño, estudió en la Universidad Islámica de Medina y predicó en las aldeas de Ródope antes de ser nombrado muftí por decreto presidencial. Jubilado obligatoriamente por ley en 2018, apeló la decisión; falleció en Alexandroupoli el 20 de diciembre de 2019."
  fr: "Mufti de Komotini (Rhodope), en Thrace occidentale (Grèce), pendant une trentaine d'années (1985-2018). Né en 1937 dans le village d'Echinos, dans le département de Xanthi, il mémorisa le Coran dès son plus jeune âge, étudia à l'Université islamique de Médine, puis prêcha dans les villages des Rhodopes avant d'être nommé mufti par décret présidentiel. Mis à la retraite d'office en 2018, il fit appel de cette décision et s'éteignit à Alexandroupoli le 20 décembre 2019."
