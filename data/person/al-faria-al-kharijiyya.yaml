summary:
  ar: "الفارعة الخارجية أخت الوليد بن طريف الشاري؛ وقفت من أخيها بعد مصرعه سنة ١٧٨ موقف الخنساء من أخويها صخر ومعاوية، فرثته بجملة قصائد منها قصيدتها المشهورة التي أورد أحمد أمين منها طرفاً في تراث الخوارج الأدبي — وقد حفظت مكاتب الإباضية في المغرب وعُمان بعض آثارهم التي ترجع إلى العصر العباسي الأول {cite:duha-islam p. 956-957}."
  en: "al-Fari'a — the Khariji poetess who mourned her brother al-Walid ibn Tarif as al-Khansa' mourned Sakhr and Mu'awiya {cite:duha-islam p. 956-957}."
  fr: "Al-Fari’a — poétesse kharijite qui pleura son frère al-Walid ibn Tarif comme al-Khansa’ pleura Sakhr et Mu’awiya {cite:duha-islam p. 956-957}."
  es: "al-Fari'a — la poetisa Khariji que lloró a su hermano al-Walid ibn Tarif como al-Khansa' lloró a Sakhr y Mu'awiya {citar:duha-islam p. 956-957}."
  ur: "الفارعہ - خارجی شاعرہ جس نے اپنے بھائی الولید بن طریف کا ماتم الخنساء کے طور پر کیا تھا صخر اور معاویہ کا ماتم کیا تھا 956-957}۔"
  tr: "El-Valid bin Tarif el-Şeri'nin kız kardeşi El-Feriye el-Hariciye, 178 yılında vefatından sonra, El-Hansa'nın iki kardeşi Sakhr ve Muaviye'nin yanında durduğu gibi, kardeşinin yanında durdu. Birçok şiirle yasını tuttu; bunların arasında Ahmed Amin'in Haricilerin edebi mirasına dahil ettiği ünlü şiiri de bulunmaktadır. Fas ve Umman'daki İbadi kütüphaneleri, erken Abbasi dönemine kadar uzanan bazı eserlerini korumaktadır. {cite:duha-islam s. 956-957}"
  id: "Al-Fari’ah al-Kharijiyah, saudara perempuan Al-Walid bin Tarif al-Shari, berdiri di sisi saudaranya setelah kematiannya pada tahun 178 dengan cara yang sama seperti Al-Khansa’ berdiri di sisi kedua saudara laki-lakinya, Sakhr dan Mu’awiyah. Ia meratapinya dengan sejumlah puisi, termasuk puisinya yang terkenal, yang sebagiannya dimasukkan oleh Ahmad Amin ke dalam warisan sastra kaum Kharijites. Perpustakaan Ibadi di Maroko dan Oman telah melestarikan beberapa karya mereka yang berasal dari era Abbasiyah awal. {cite:duha-islam hlm. 956-957}"
