summary:
  ar: "الفارعة الخارجية أخت الوليد بن طريف الشاري؛ وقفت من أخيها بعد مصرعه سنة ١٧٨ موقف الخنساء من أخويها صخر ومعاوية، فرثته بجملة قصائد منها قصيدتها المشهورة التي أورد أحمد أمين منها طرفاً في تراث الخوارج الأدبي — وقد حفظت مكاتب الإباضية في المغرب وعُمان بعض آثارهم التي ترجع إلى العصر العباسي الأول {cite:duha-islam p. 956-957}."
  en: "al-Fari'a — the Khariji poetess who mourned her brother al-Walid ibn Tarif as al-Khansa' mourned Sakhr and Mu'awiya {cite:duha-islam p. 956-957}."
