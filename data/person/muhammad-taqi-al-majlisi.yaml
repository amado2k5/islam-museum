summary:
  ar: "محمد تقي بن مقصود علي الأصفهاني المجلسي، فقيه إمامي له اشتغال بإحياء آثار أهل البيت، تلميذ بهاء الدين العاملي ووالد محمد باقر المجلسي، ولد ومات في أصفهان سنة ١٠٧٠هـ؛ له روضة المتقين وإحياء الأحاديث."
  en: "Muhammad Taqi ibn Maqsud Ali al-Isfahani al-Majlisi, an Imami (Twelver Shi'i) jurist devoted to reviving the legacy of the Ahl al-Bayt, a pupil of Baha' al-Din al-Amili and father of Muhammad Baqir al-Majlisi, born and died at Isfahan, d. 1070 AH (1660); author of Rawdat al-muttaqin and Ihya' al-ahadith."
  es: "Muhammad Taqi ibn Maqsud Ali al-Isfahani al-Majlisi, un jurista imami (doce chií) dedicado a revivir el legado de Ahl al-Bayt, alumno de Baha' al-Din al-Amili y padre de Muhammad Baqir al-Majlisi, nacido y fallecido en Isfahán, d. 1070 d. H. (1660); autor de Rawdat al-muttaqin e Ihya' al-ahadith."
  fr: "Muhammad Taqi ibn Maqsud Ali al-Isfahani al-Majlisi, juriste imami (chiite duodécimain) dévoué à faire revivre l'héritage des Ahl al-Bayt, élève de Baha' al-Din al-Amili et père de Muhammad Baqir al-Majlisi, né et mort à Ispahan, d. 1070 de l'Hégire (1660); auteur de Rawdat al-muttaqin et Ihya' al-ahadith."
  ur: "محمد تقی ابن مقصود علی اصفہانی المجلسی، ایک امامی ⁦(بارہ شیعہ)⁩ فقیہ جو اہل بیت کی وراثت کو زندہ کرنے کے لیے وقف تھے، بہاء الدین العملی کے شاگرد اور محمد باقر المجلسی کے والد، اصفہان میں پیدا ہوئے اور فوت ہوئے۔ 1070ھ (1660)؛ رودۃ المتقین اور احیاء الحدیث کے مصنف۔"
  tr: "Muhammed Taqi bin Maksud Ali el-İsfahani el-Majlisisi, Baha'eddin el-Amili'nin öğrencisi ve Muhammed Baqir al-Majlisi'nin babası Ehl al-Bayt'in eserlerini canlandırmaya çalışan bir imam hukukçuydu. 1070 Hicri yılında İsfahan'da doğup öldü; Rawdat al-Muttaqin ve İhya al-Hadis adlı eserleri kaleme aldı."
  id: "Muhammad Taqi ibn Maqsud Ali al-Isfahani al-Majlisi adalah seorang ahli hukum Imami yang bertugas menghidupkan kembali karya-karya Ahl al-Bayt, murid Baha' al-Din al-Amili dan ayah dari Muhammad Baqir al-Majlisi. Ia lahir dan wafat di Isfahan pada tahun 1070 H; ia menulis Rawdat al-Muttaqin dan Ihya al-Ahadith."
