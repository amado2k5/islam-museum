summary:
  ar: "محمد تقي بن مقصود علي الأصفهاني المجلسي، فقيه إمامي له اشتغال بإحياء آثار أهل البيت، تلميذ بهاء الدين العاملي ووالد محمد باقر المجلسي، ولد ومات في أصفهان سنة ١٠٧٠هـ؛ له روضة المتقين وإحياء الأحاديث."
  en: "Muhammad Taqi ibn Maqsud Ali al-Isfahani al-Majlisi, an Imami (Twelver Shi'i) jurist devoted to reviving the legacy of the Ahl al-Bayt, a pupil of Baha' al-Din al-Amili and father of Muhammad Baqir al-Majlisi, born and died at Isfahan, d. 1070 AH (1660); author of Rawdat al-muttaqin and Ihya' al-ahadith."
