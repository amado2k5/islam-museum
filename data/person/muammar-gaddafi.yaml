summary:
  ar: "ضابط وسياسي ليبي حكم ليبيا من انقلاب 1 سبتمبر 1969 الذي أطاح بالملك إدريس حتى قتله في سرت في 20 أكتوبر 2011. صاحب «الكتاب الأخضر» ونظرية «النظرية العالمية الثالثة»؛ وقاد مجلس قيادة الثورة ثم صار «الأخ القائد ومرشد الثورة» للجماهيرية."
  en: "Libyan officer and politician who ruled Libya from the coup of 1 September 1969 that overthrew King Idris until he was killed at Sirte on 20 October 2011. Author of The Green Book and its Third International Theory; he chaired the Revolutionary Command Council and then ruled the Jamahiriya as Brotherly Leader and Guide of the Revolution."
