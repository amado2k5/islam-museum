summary:
  ar: "ناشطة حقوقية سعودية وُلدت سنة 1981 في جدة. رفعت ضد والدها قضية عضل غير مسبوقة في النظام السعودي، وسُجنت سنة 2010 ثم أُفرج عنها بعد حكم لصالحها، وقادت مع منال الشريف دعوى حق النساء في قيادة السيارة والتصويت، ونالت جائزة وزارة الخارجية الأمريكية للمرأة الشجاعة سنة 2012، واعتُقلت مجددًا في يوليو 2018 وأُفرج عنها سنة 2021."
  en: "Saudi human rights activist, born 28 June 1981 in Jeddah. She filed an unprecedented adhl suit against her father under the male-guardianship system, was imprisoned in 2010 and released after a ruling in her favour, campaigned with Manal al-Sharif for women's driving and voting rights, received the US State Department's International Women of Courage Award in 2012, was arrested again in July 2018 and released in 2021."
  ur: "سعودی انسانی حقوق کی کارکن، 28 جون 1981 کو جدہ میں پیدا ہوئیں۔ انہوں نے ولایتِ مردانہ نظام کے تحت اپنے والد کے خلاف غیر معمولی عضل کا مقدمہ دائر کیا، 2010 میں قید ہوئیں اور اپنے حق میں فیصلے کے بعد رہا ہوئیں، منال الشریف کے ساتھ خواتین کے ڈرائیونگ اور ووٹ کے حق کی مہم چلائی، 2012 میں امریکی محکمۂ خارجہ کا انٹرنیشنل ویمن آف کوریج ایوارڈ پایا، جولائی 2018 میں دوبارہ گرفتار ہوئیں اور 2021 میں رہا ہوئیں۔"
  es: "Activista saudí de derechos humanos, nacida el 28 de junio de 1981 en Yeda. Presentó una demanda sin precedentes contra su padre bajo el sistema de tutela masculina, fue encarcelada en 2010 y liberada tras un fallo a su favor, hizo campaña con Manal al-Sharif por el derecho de las mujeres a conducir y votar, recibió el Premio Internacional Mujeres de Coraje del Departamento de Estado de EE. UU. en 2012, fue arrestada nuevamente en julio de 2018 y liberada en 2021."
  fr: "Militante saoudienne des droits de l'homme, née le 28 juin 1981 à Djeddah. Elle a intenté une action en justice sans précédent contre son père dans le cadre du système de tutelle masculine, a été emprisonnée en 2010 et libérée après une décision en sa faveur, a milité avec Manal al-Sharif pour le droit de conduire et de vote des femmes, a reçu le prix international du courage féminin du département d'État américain en 2012, a été arrêtée de nouveau en juillet 2018 et libérée en 2021."
  tr: "1981 yılında Cidde'de doğmuş bir Suudi insan hakları aktivisti. Babası aleyhine Suudi rejimine karşı eşi benzeri görülmemiş bir dava açtı, 2010'da hapsedildi ve lehine verilen kararla serbest bırakıldı. Manal Al-Sharif ile kadınların araç kullanma ve oy kullanma hakkı davasını yönetti, 2012'de ABD Dışişleri Bakanlığı'nın Cesur Kadın Ödülü'nü aldı, Temmuz 2018'de tekrar tutuklandı ve 2021'de serbest bırakıldı."
  id: "Seorang aktivis hak asasi manusia Saudi yang lahir pada tahun 1981 di Jeddah. Ia mengajukan kasus yang belum pernah terjadi sebelumnya terhadap ayahnya melawan rezim Saudi, yang dipenjara pada tahun 2010, lalu dibebaskan setelah putusan yang menguntungkan beliau. Ia memimpin gugatan hak perempuan untuk mengemudi dan memilih bersama Manal Al-Sharif, menerima Penghargaan Perempuan Berani dari Departemen Luar Negeri AS pada tahun 2012, ditangkap lagi pada Juli 2018, dan dibebaskan pada tahun 2021."
