roles: [military-leader]
died: { hijri: "0930", edtf: "1524~", calendar: julian, precision: year, status: tradition, derived: true, note: "قتل سنة 930هـ/1524م على الصلابي", sources: [source/dawlat-uthmaniyya-salabi] }
summary:
  ar: "أحمد باشا الملقب في كتب التاريخ بـ«الخائن»؛ ينقل الصلابي أنه كان طامعاً في منصب الصدر الأعظم فلم يفلح، فطلب من السلطان [[person/sulayman-al-qanuni|سليمان]] أن يعينه والياً على مصر فعيّنه، وما أن وصل مصر حتى استمال الناس وأعلن نفسه سلطاناً مستقلاً سنة 930هـ/1524م، فقام ضده أهل الشرع وجنود الدولة من الإنكشارية وقتلوه {cite:dawlat-uthmaniyya-salabi p. 200}."
  en: "Ahmed Pasha, known in the chronicles as 'the Traitor'; the Sicill-i Osmani records an Albanian raised in the palace who rose to agha of the Janissaries and was Rumeli beylerbeyi at the conquest of Belgrade (1521) {cite:sicill-i-osmani vol. 1, 'Ahmed Paşa (Hain)'}; al-Salabi records that he coveted the grand vizierate and, failing it, asked Süleyman for Egypt's governorship — once there he courted the people and declared himself independent sultan in 930/1524, whereupon the men of the law and the state's Janissary troops rose and killed him {cite:dawlat-uthmaniyya-salabi p. 200}."
  es: "Ahmed Pasha, conocido en las crónicas como 'el Traidor'; el Sicill-i Osmani registra a un albanés criado en el palacio que ascendió a agha de los jenízaros y fue Rumeli beylerbeyi en la conquista de Belgrado (1521) {cite:sicill-i-osmani vol. 1, 'Ahmed Paşa (Hain)'}; al-Salabi registra que codiciaba el gran visirato y, al no conseguirlo, pidió a Süleyman el gobierno de Egipto; una vez allí, se ganó el favor del pueblo y se declaró sultán independiente en 930/1524, tras lo cual los hombres de la ley y las tropas jenízaras del estado se sublevaron y lo mataron {cite:dawlat-uthmaniyya-salabi p. 200}."
  fr: "Ahmed Pacha, connu dans les chroniques comme « le Traître »; le Sicill-i Osmani relate qu'il était un Albanais élevé au palais, devenu agha des janissaires et occupait le poste de beylerbeyi de Rumeli lors de la conquête de Belgrade (1521) {cite:sicill-i-osmani vol. 1, 'Ahmed Paşa (Hain)'}; al-Salabi rapporte qu'il convoitait le grand vizirat et, n'y parvenant pas, demanda à Soliman le poste de gouverneur d'Égypte — une fois en place, il courtisa le peuple et se déclara sultan indépendant en 930/1524, ce qui provoqua la révolte des hommes de loi et des troupes janissaires de l'État et son assassinat {cite:dawlat-uthmaniyya-salabi p. 200}."
  ur: "احمد پاشا، جسے تاریخ میں 'غدار' کے نام سے جانا جاتا ہے۔ سسیل عثمانی نے محل میں پرورش پانے والے ایک البانوی کو ریکارڈ کیا ہے جو جنیسریز کے آغا پر چڑھا تھا اور بلغراد (1521) کی فتح کے وقت رومیلی بیلربی تھا۔ 1، 'احمد پاشا ⁦(ہین)⁩'}؛ الصلابی نے ریکارڈ کیا ہے کہ اس نے وزیر اعظم کی خواہش کی اور اس میں ناکامی پر سلیمان سے مصر کی گورنری کے لیے کہا - ایک بار وہاں اس نے لوگوں سے رجوع کیا اور 930/1524 میں خود کو خود مختار سلطان قرار دیا، جس کے بعد قانون کے ماہرین اور ریاست کے جنیسری فوجیوں نے اٹھ کر اسے قتل کر دیا۔ 200}۔"
  tr: "Tarih kitaplarında \"hain\" lakabıyla anılan Ahmed Paşa hakkında, El-Salabi'nin aktardığına göre, Sadrazamlık makamına talip olmuş ancak başarılı olamayınca Sultan Süleyman'dan kendisini Mısır valisi olarak atamasını istemiş, Sultan da onu atamış ve Mısır'a varır varmaz halkın gönlünü kazanarak Hicri 930/Miladi 1524 yılında bağımsız bir Sultan ilan etmiştir. Bunun üzerine Şeriat yanlıları ve Yeniçerilerden oluşan devlet askerleri ona karşı ayaklanarak onu öldürmüşlerdir. {Kaynak: Dawlat-uthmaniyya-salabi s. 200}"
  id: "Ahmed Pasha, yang dijuluki \"pengkhianat\" dalam buku-buku sejarah, Al-Salabi melaporkan bahwa ia berambisi untuk menduduki posisi Wazir Agung tetapi tidak berhasil, sehingga ia meminta Sultan Suleiman untuk mengangkatnya sebagai gubernur Mesir, dan Sultan pun mengangkatnya. Segera setelah tiba di Mesir, ia memenangkan hati rakyat dan menyatakan dirinya sebagai Sultan yang merdeka pada tahun 930 H/1524 M. Akibatnya, orang-orang yang berpegang pada syariat dan tentara negara dari Janissari memberontak melawannya dan membunuhnya."
