summary:
  ar: "أحمد باشا الملقب في كتب التاريخ بـ«الخائن»؛ ينقل الصلابي أنه كان طامعاً في منصب الصدر الأعظم فلم يفلح، فطلب من السلطان [[person/sulayman-al-qanuni|سليمان]] أن يعينه والياً على مصر فعيّنه، وما أن وصل مصر حتى استمال الناس وأعلن نفسه سلطاناً مستقلاً سنة 930هـ/1524م، فقام ضده أهل الشرع وجنود الدولة من الإنكشارية وقتلوه {cite:dawlat-uthmaniyya-salabi p. 200}."
  en: "Ahmed Pasha, known in the chronicles as 'the Traitor'; the Sicill-i Osmani records an Albanian raised in the palace who rose to agha of the Janissaries and was Rumeli beylerbeyi at the conquest of Belgrade (1521) {cite:sicill-i-osmani vol. 1, 'Ahmed Paşa (Hain)'}; al-Salabi records that he coveted the grand vizierate and, failing it, asked Süleyman for Egypt's governorship — once there he courted the people and declared himself independent sultan in 930/1524, whereupon the men of the law and the state's Janissary troops rose and killed him {cite:dawlat-uthmaniyya-salabi p. 200}."
