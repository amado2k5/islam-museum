summary:
  ar: "فقيه وزعيم سياسي مغربي ⁦(1910–1974)⁩، تخرّج في جامعة القرويين وقاد حزب الاستقلال في النضال ضد الاستعمار الفرنسي. جمع بين الفقه المالكي ومقاصد الشريعة في مؤلفات مثل «مقاصد الشريعة الإسلامية ومكارمها» و«النقد الذاتي» و«دفاع عن الشريعة»."
  en: "Moroccan jurist and political leader (1910–1974), graduate of al-Qarawiyyin who led the Istiqlal (Independence) Party in the struggle against French colonialism. He combined Maliki fiqh with the objectives (maqasid) of sharia in works such as Maqasid al-Shari'a al-Islamiyya wa-Makarimuha, Self-Criticism and Defense of the Sharia."
  ur: "مغربی فقیہ اور سیاسی رہنما ⁦(1910–1974)⁩ جو جامعہ قرویین کے فارغ تھے اور فرانسیسی نوآبادیات کے خلاف جدوجہد میں حزبِ استقلال کی قیادت کی۔ انہوں نے مالکی فقہ کو مقاصدِ شریعت سے جوڑ کر «مقاصد الشریعۃ الاسلامیہ و مکارمها»، «النقد الذاتی» اور «دفاع عن الشریعہ» جیسی کتابیں لکھیں۔"
