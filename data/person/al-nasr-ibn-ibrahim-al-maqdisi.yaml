summary:
  ar: "أبو الفتح نصر بن إبراهيم المقدسي الشافعي الفقيه الزاهد نزيل دمشق صاحب كتاب «الحجة على تارك المحجة» المتضمن أصول الدين على قواعد أهل الحديث والسنة؛ وهو الشيخ الذي أشار إليه النووي في تخريج الحديث الحادي والأربعين بقوله «رويناه في كتاب الحجة بإسناد صحيح» (جامع العلوم والحكم ص 824، وانظر سير أعلام النبلاء 19/136)."
  en: "Abu al-Fath Nasr ibn Ibrahim al-Maqdisi, the Shafi'i jurist and ascetic resident in Damascus, author of *al-Hujja ala tarik al-mahajja* — a work comprising the principles of religion by the rules of the hadith folk; he is the 'shaykh' al-Nawawi meant in his takhrij of the forty-first hadith when he wrote 'we narrated it in the Book of al-Hujja with a sound isnad' (Jami' al-Ulum wal-Hikam p. 824; cf. Siyar a'lam al-nubala' 19/136)."
