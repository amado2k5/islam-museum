summary:
  ar: "أبو الفتح نصر بن إبراهيم المقدسي الشافعي الفقيه الزاهد نزيل دمشق صاحب كتاب «الحجة على تارك المحجة» المتضمن أصول الدين على قواعد أهل الحديث والسنة؛ وهو الشيخ الذي أشار إليه النووي في تخريج الحديث الحادي والأربعين بقوله «رويناه في كتاب الحجة بإسناد صحيح» ⁦(جامع العلوم والحكم ص 824، وانظر سير أعلام النبلاء 19/136)⁩."
  en: "Abu al-Fath Nasr ibn Ibrahim al-Maqdisi, the Shafi'i jurist and ascetic resident in Damascus, author of *al-Hujja ala tarik al-mahajja* — a work comprising the principles of religion by the rules of the hadith folk; he is the 'shaykh' al-Nawawi meant in his takhrij of the forty-first hadith when he wrote 'we narrated it in the Book of al-Hujja with a sound isnad' (Jami' al-Ulum wal-Hikam p. 824; cf. Siyar a'lam al-nubala' 19/136)."
  fr: "Abu al-Fath Nasr ibn Ibrahim al-Maqdisi, le juriste chaféite et résident ascétique à Damas, auteur de *al-Hujja ala tarik al-mahajja* - une œuvre comprenant les principes de la religion selon les règles du peuple du hadith ; Il est le 'shaykh' al-Nawawi signifié dans son takhrij du quarante et unième hadith quand il a écrit « nous l'avons raconté dans le livre d'al-Hujja avec un isnad sonore » (Jami' al-Ulum wal-Hikam p. 824 ; cf. Siyar a'lam al-nubala 19/136)."
  es: "Abu al-Fath Nasr ibn Ibrahim al-Maqdisi, jurista shafi'í y asceta residente en Damasco, autor de *al-Hujja ala tarik al-mahajja*, una obra que comprende los principios de la religión según las reglas de la gente del hadiz; es el 'shaykh' al que se refería al-Nawawi en su takhrij del hadiz cuarenta y uno cuando escribió 'lo narramos en el Libro de al-Hujja con un isnad sólido' (Jami' al-Ulum wal-Hikam p. 824; cf. Siyar a'lam al-nubala' 19/136)."
  ur: "ابو الفتح نصر بن ابراہیم المقدسی، دمشق میں رہنے والے شافعی فقیہ اور سنیاسی، *الحجۃ الا طارق المحاجہ* کے مصنف - ایک تصنیف جو کہ حدیث کے اصولوں کے ذریعہ مذہب کے اصولوں پر مشتمل ہے۔ وہ شیخ النووی ہیں جن سے مراد اپنی اڑتالیسویں حدیث کی تخریج میں ہے جب انہوں نے لکھا کہ ہم نے اسے کتاب الحجا میں صحیح سند کے ساتھ روایت کیا ہے ⁦(جامع العلوم والحکام ص 824؛ سی ایف سیار اعلام النبلاء 19/19)⁩۔"
  tr: "Şam'da yaşayan münüh hukukçu Ebu el-Fet Nasr bin İbrahim el-Makdisi el-Şafii, 'Al-Hucce 'ala Tarik al-Mahjah' kitabının yazarıdır; bu kitapta Ehl-al-Hadis ve Sünnet'in temelleri üzerine dinin temelleri yer alır; el-Nevavi'nin kırk birinci hadisi doğrularken 'Bunu kanıt kitabında ses zinciriyle anlattık' diyerek bahsettiği şeyhtir."
  id: "Abu al-Fath Nasr ibn Ibrahim al-Maqdisi al-Shafi'i, seorang ahli hukum pertapa yang tinggal di Damaskus, penulis buku 'Al-Hujjah 'ala Tarik al-Mahjah,' yang memuat dasar-dasar agama tentang dasar Ahl al-Hadith wa al-Sunnah; ia adalah sheikh yang dirujuk al-Nawawi dalam pengesahan hadis keempat puluh satu dengan mengatakan, 'Kami menceritakannya dalam kitab bukti dengan rantai transmisi yang baik' (Jami' al-Ulum wa al-Hikam, hlm. 824; lihat juga Siyar A'lam al-Nubala' 19/136)."
