summary:
  ar: "عالم مسلم وسياسي إندونيسي، وُلد في جومبانغ بجاوة الشرقية سنة 1940، وهو ابن وحيد هاشم وحفيد هاشم أشعري مؤسس نهضة العلماء. ترأّس نهضة العلماء من 1984 إلى 1999، وأسّس حزب نهضة الوطن، وكان رئيس إندونيسيا الرابع من 1999 إلى 2001، وأول رئيس منتخب بعد سقوط سوهارتو. عُرف بدفاعه عن التعددية وحقوق الأقليات، وبحياة تعبّدية صوفية شخصية محورها زيارة قبور أولياء جاوة."
  en: "Indonesian Muslim scholar and statesman, born in Jombang, East Java, in 1940, the son of Wahid Hasyim and grandson of Hasyim Asy'ari, founder of Nahdlatul Ulama. He chaired Nahdlatul Ulama from 1984 to 1999, founded the National Awakening Party (PKB), and served as Indonesia's fourth president from 1999 to 2001, the first elected after the fall of Suharto. He was known for defending pluralism and the rights of minorities, and for a personal Sufi devotional life centred on pilgrimage to the tombs of Java's saints."
  ur: "انڈونیشی مسلمان عالم اور سیاست دان، جو 1940ء میں مشرقی جاوا کے جومبانگ میں پیدا ہوئے؛ وحید ہاشم کے بیٹے اور نهضة العلماء کے بانی ہاشم اشعری کے پوتے تھے۔ 1984ء سے 1999ء تک نهضة العلماء کے صدر رہے، نیشنل اویکننگ پارٹی قائم کی، اور 1999ء سے 2001ء تک انڈونیشیا کے چوتھے صدر رہے — سوہارتو کے زوال کے بعد پہلے منتخب صدر۔ وہ تکثیریت اور اقلیتوں کے حقوق کے دفاع، اور جاوا کے اولیا کے مزارات کی زیارت پر مرکوز اپنی ذاتی صوفیانہ عبادتی زندگی کے لیے مشہور تھے۔"
