    note: "Settled on his own attested practice, not on office or descent. The Jakarta Post (29 April 2001) reported as his 'customary rite' and lifelong habit his pilgrimage to the tombs of saints and elders, seeking spiritual guidance there, a habit he kept up throughout his presidency; Theodore Friend's obituary essay (FPRI E-Notes, January 2010) characterises him personally as a 'Sufi sage and mystic' whose life offers abundant clues 'for anyone who would understand modern Sufism'. Two independent sources thus attest the man himself, and the value is recorded as sufi. What is NOT relied on: his chairmanship of Nahdlatul Ulama (1984-1999) is office and never counts; his descent from NU's founder is family background; his teaching of Ibn Ata Allah's Kitab al-Hikam at Pesantren Tambakberas in 1975 is teaching a subject, which never counts alone; and Wikidata's structured value is Sunni Islam (Q483654), a different claim that is not counted toward this settlement. No source read names a formal order (tariqa) enrolment for him personally: the settlement rests on attested practice and characterisation, and it is flagged in the batch report for the founder."
