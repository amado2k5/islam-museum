summary:
  ar: "ديميتري كانتيمير، ويعرف في تركيا بكانتيمير أوغلو، من مواليد 1673م وتوفي سنة 1723م، أمير تابع للدولة العثمانية على البغدان وعالم موسوعي وناظّر وعازف موسيقي. أُرسل رهينة إلى إسطنبول في صباه وعُيّن أميراً على البغدان سنة 1710م ثم تحالف مع بطرس الأكبر فهرب بعد الانتصار العثماني سنة 1711م وأقام في روسيا. اشتهر في أوروبا بكتابه عن نشوء الدولة العثمانية وانحطاطها، وفي تركيا بكتاب في علم الموسيقى كتبه نحو سنة 1700م {cite:encyclopaedia-of-islam-2 vol. 12 p. 570}."
  en: "Dimitrie Cantemir, known in Turkey as Kantemiroglu, lived from 1673 to 1723. He was an Ottoman-appointed prince of Moldavia, a polymath, and a musician and music theorist. Sent as a hostage to Istanbul in his youth, he was named prince of Moldavia in 1710, allied himself with Peter the Great, and fled to Russia after the Ottoman victory of 1711. Europe knew him for his history of the rise and decay of the Ottoman Empire, Turkey for his treatise on music of about 1700 {cite:encyclopaedia-of-islam-2 vol. 12 p. 570}."
  ur: "دیمیتری کانتیمیر، جو ترکی میں کانتیمیر اوغلو کہلاتے ہیں، 1673ء سے 1723ء تک زندہ رہے۔ وہ عثمانیوں کی طرف سے مقرر کردہ شہزادۂ مولداویہ، ہمہ جہت عالم اور موسیقی کے ماہر و نظریہ دان تھے۔ نوجوانی میں یرغمال بن کر استنبول بھیجے گئے، 1710ء میں مولداویہ کے شہزادے بنے، پطرس اعظم سے اتحاد کیا اور 1711ء کی عثمانی فتح کے بعد روس چلے گئے۔ یورپ میں وہ عثمانی سلطنت کے عروج و زوال کی تاریخ سے اور ترکی میں تقریباً 1700ء کے موسیقی کے رسالے سے مشہور ہوئے {cite:encyclopaedia-of-islam-2 vol. 12 p. 570}۔"
