id: person/abdallah-al-yunini
class: person
label: { ar: "عبد الله اليونيني", en: "Abdallah al-Yunini" }
summary:
  ar: "أبو عثمان عبد الله بن عبد العزيز بن جعفر اليونيني الزاهد الكبير «أسد الشام»؛ من قرية يونين من قرى بعلبك؛ كان شيخاً مهيباً طوالاً حاد الحال تام الشجاعة، آمِراً بالمعروف ناهياً عن المنكر كثير الجهاد دائم الذكر، منقطع القرين صاحب مجاهدات وكرامات؛ كان الأمير أمجد صاحب بعلبك يزوره فيهينه ويقول له «يا أمجد أنت تظلم»؛ قيل كان قوسه ثمانين رطلاً، وما قامت غزاة بالشام قط إلا حضرها؛ لما قدم حمص للغزاة أهدى إليه الملك المجاهد أسد الدين حصاناً فركبه ودخل في العدو فعمل العجائب؛ ولم يقم لأحد قط تعظيماً لله، ولم يدّخر ولا لمس يده ديناراً ولا درهماً، وما لبس إلا الثوب الخام وقلنسوة من جلود الغنم؛ توفي سنة سبع عشرة وستمائة يوم السبت بعد صلاة الجمعة نائماً والسبحة في يده وقد جاوز الثمانين، وقبره يزار ببعلبك {cite:shadharat-dhahab p. 73-75}."
  en: "Abu Uthman Abdallah ibn Abd al-Aziz ibn Jafar al-Yunini, the great ascetic, 'Lion of Syria', from the village of Yunin among the villages of Baalbek. He was an awe-inspiring, tall shaykh of intense spiritual state, complete in courage, who enjoined right and forbade wrong, was often in jihad and constant in the remembrance of God, without equal, a man of ascetic striving and marvels. The prince Amjad, lord of Baalbek, used to visit him, and the shaykh would rebuke him: 'O Amjad, you are oppressing.' It was said his bow weighed eighty ratls, and he never missed a campaign in Syria. When he came to Homs for the campaigns, al-Malik al-Mujahid Asad al-Din gave him a horse; he rode into the enemy and performed wonders. He never rose for anyone out of reverence for God, stored up nothing, never touched a dinar or a dirham with his hand, and wore only undyed cloth and a sheepskin cap. He died in the year 617, on a Saturday after the Friday prayer, asleep with the prayer beads in his hand, past eighty; his tomb is visited in Baalbek {cite:shadharat-dhahab p. 73-75}."
