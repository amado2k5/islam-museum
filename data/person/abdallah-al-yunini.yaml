id: person/abdallah-al-yunini
class: person
label: { ar: "عبد الله اليونيني" }
summary:
  ar: "أبو عثمان عبد الله بن عبد العزيز بن جعفر اليونيني الزاهد الكبير «أسد الشام»؛ من قرية يونين من قرى بعلبك؛ كان شيخاً مهيباً طوالاً حاد الحال تام الشجاعة، آمِراً بالمعروف ناهياً عن المنكر كثير الجهاد دائم الذكر، منقطع القرين صاحب مجاهدات وكرامات؛ كان الأمير أمجد صاحب بعلبك يزوره فيهينه ويقول له «يا أمجد أنت تظلم»؛ قيل كان قوسه ثمانين رطلاً، وما قامت غزاة بالشام قط إلا حضرها؛ لما قدم حمص للغزاة أهدى إليه الملك المجاهد أسد الدين حصاناً فركبه ودخل في العدو فعمل العجائب؛ ولم يقم لأحد قط تعظيماً لله، ولم يدّخر ولا لمس يده ديناراً ولا درهماً، وما لبس إلا الثوب الخام وقلنسوة من جلود الغنم؛ توفي سنة سبع عشرة وستمائة يوم السبت بعد صلاة الجمعة نائماً والسبحة في يده وقد جاوز الثمانين، وقبره يزار ببعلبك {cite:shadharat-dhahab p. 73-75}."
