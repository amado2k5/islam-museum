id: person/abdallah-al-yunini
class: person
label: { ar: "عبد الله اليونيني", en: "Abdallah al-Yunini", fr: "Abdallah al-Yunini", es: "Abdallah al-Yunini", ur: "عبداللہ الینینی" }
summary:
  ar: "أبو عثمان عبد الله بن عبد العزيز بن جعفر اليونيني الزاهد الكبير «أسد الشام»؛ من قرية يونين من قرى بعلبك؛ كان شيخاً مهيباً طوالاً حاد الحال تام الشجاعة، آمِراً بالمعروف ناهياً عن المنكر كثير الجهاد دائم الذكر، منقطع القرين صاحب مجاهدات وكرامات؛ كان الأمير أمجد صاحب بعلبك يزوره فيهينه ويقول له «يا أمجد أنت تظلم»؛ قيل كان قوسه ثمانين رطلاً، وما قامت غزاة بالشام قط إلا حضرها؛ لما قدم حمص للغزاة أهدى إليه الملك المجاهد أسد الدين حصاناً فركبه ودخل في العدو فعمل العجائب؛ ولم يقم لأحد قط تعظيماً لله، ولم يدّخر ولا لمس يده ديناراً ولا درهماً، وما لبس إلا الثوب الخام وقلنسوة من جلود الغنم؛ توفي سنة سبع عشرة وستمائة يوم السبت بعد صلاة الجمعة نائماً والسبحة في يده وقد جاوز الثمانين، وقبره يزار ببعلبك {cite:shadharat-dhahab p. 73-75}."
  en: "Abu Uthman Abdallah ibn Abd al-Aziz ibn Jafar al-Yunini, the great ascetic, 'Lion of Syria', from the village of Yunin among the villages of Baalbek. He was an awe-inspiring, tall shaykh of intense spiritual state, complete in courage, who enjoined right and forbade wrong, was often in jihad and constant in the remembrance of God, without equal, a man of ascetic striving and marvels. The prince Amjad, lord of Baalbek, used to visit him, and the shaykh would rebuke him: 'O Amjad, you are oppressing.' It was said his bow weighed eighty ratls, and he never missed a campaign in Syria. When he came to Homs for the campaigns, al-Malik al-Mujahid Asad al-Din gave him a horse; he rode into the enemy and performed wonders. He never rose for anyone out of reverence for God, stored up nothing, never touched a dinar or a dirham with his hand, and wore only undyed cloth and a sheepskin cap. He died in the year 617, on a Saturday after the Friday prayer, asleep with the prayer beads in his hand, past eighty; his tomb is visited in Baalbek {cite:shadharat-dhahab p. 73-75}."
  fr: "Abu Uthman Abdallah ibn Abd al-Aziz ibn Jafar al-Yunini, le grand ascète, « Lion de Syrie », du village de Yunin parmi les villages de Baalbek. C'était un cheikh imposant et grand, d'un état spirituel intense, d'un courage accompli, qui ordonnait le bien et interdisait le mal, souvent au jihad et constant dans le souvenir de Dieu, sans égal, homme d'efforts ascétiques et de prodiges. Le prince Amjad, seigneur de Baalbek, lui rendait visite, et le cheikh le réprimandait : « Ô Amjad, tu es injuste. » On disait que son arc pesait quatre-vingts ratls, et il ne manqua aucune campagne en Syrie. Lorsqu'il vint à Homs pour les campagnes, al-Malik al-Mujahid Asad al-Din lui donna un cheval ; il chargea l'ennemi et accomplit des merveilles. Il ne se levait pour personne par révérence envers Dieu, ne thésaurisait rien, ne touchait jamais de sa main un dinar ni un dirham, et ne portait que de l'étoffe non teinte et un bonnet en peau de mouton. Il mourut en l'an 617, un samedi après la prière du vendredi, endormi, le chapelet à la main, âgé de plus de quatre-vingts ans ; sa tombe est visitée à Baalbek {cite:shadharat-dhahab p. 73-75}."
  es: "Abu Uthman Abdallah ibn Abd al-Aziz ibn Jafar al-Yunini, el gran asceta, «León de Siria», de la aldea de Yunin, entre las aldeas de Baalbek. Era un jeque imponente y alto, de un estado espiritual intenso, de gran valentía, que ordenaba el bien y prohibía el mal, participaba frecuentemente en la yihad y era constante en el recuerdo de Dios, sin igual, un hombre de gran esfuerzo ascético y de prodigios. El príncipe Amjad, señor de Baalbek, solía visitarlo, y el jeque lo reprendía: «¡Oh Amjad, eres un opresor!». Se decía que su arco pesaba ochenta ratls, y nunca faltó a una campaña en Siria. Cuando llegó a Homs para las campañas, al-Malik al-Mujahid Asad al-Din le dio un caballo; cabalgó hacia el enemigo y realizó prodigios. Jamás se levantó para servir a nadie por reverencia a Dios, no acumuló riquezas, jamás tocó un dinar ni un dirham con sus manos, y vestía únicamente tela sin teñir y un gorro de piel de oveja. Murió en el año 617, un sábado después de la oración del viernes, dormido con el rosario en la mano, a los ochenta años; su tumba se visita en Baalbek {cite:shadharat-dhahab p. 73-75}."
  ur: "ابو عثمان عبداللہ ابن عبد العزیز ابن جعفر ال یونی، عظیم سنیاسی، 'شام کا شیر'، بعلبک کے دیہاتوں کے درمیان یونین گاؤں سے۔ وہ ایک حیرت انگیز، شدید روحانی کیفیت کے لمبے لمبے شیخ، ہمت میں کامل، نیکی کا حکم دینے اور برائی سے منع کرنے والے، اکثر جہاد میں رہتے اور ذکر الٰہی میں مستقل مزاج رہتے تھے، بغیر برابر کے، جدو جہد کرنے والے اور کمالات کے آدمی تھے۔ شہزادہ امجد، آقا بعلبیک، اس کے پاس آیا کرتے تھے، اور شیخ اسے ڈانٹتے تھے: 'اے امجد، تو ظلم کر رہا ہے۔' کہا جاتا ہے کہ اس کی کمان کا وزن 80 رٹل تھا، اور اس نے کبھی شام میں مہم نہیں چھوڑی۔ جب وہ مہمات کے لیے حمص آیا تو المالک المجاہد اسد الدین نے اسے ایک گھوڑا دیا۔ وہ دشمن پر سوار ہوا اور عجائبات کا مظاہرہ کیا۔ وہ خدا کی تعظیم کے لیے کبھی کسی کے لیے نہیں اٹھے، کچھ جمع نہیں کیا، کبھی دینار یا درہم کو ہاتھ سے نہیں چھوا، اور صرف بے رنگ کپڑا اور بھیڑ کی چمڑی کی ٹوپی پہنتے تھے۔ ان کا انتقال سنہ 617 میں ہفتہ کے روز نماز جمعہ کے بعد، ہاتھ میں موتیوں کی موتیوں کے ساتھ سو رہا تھا، اسّی کے قریب۔ بعلبیک میں ان کی قبر کی زیارت کی گئی ہے 73-75}۔"
  tr: "Büyük zühd sahibi, \"Levant Aslanı\" lakaplı Ebu Osman Abdullah ibn Abdül Aziz ibn Cafer el-Yununi, Baalbek köylerinden Yunin köyündendi. Görkemli, uzun boylu ve sert bir şeyh, büyük cesaret sahibi bir adamdı; iyiliği emredip kötülüğü yasakladı, çokça cihat etti, sürekli Allah'ı andı ve manevi mücadelelerinde ve mucizelerinde emsalsizdi. Baalbek hükümdarı Prens Amjad onu ziyaret eder ve \"Ey Amjad, haksızlık ediyorsun\" diyerek onu aşağılardı. Rivayetlere göre yayını seksen kilo ağırlığındaydı ve Levant'taki hiçbir seferi kaçırmadı. Akıncılarla savaşmak için Homs'a geldiğinde, mücahit kral Esad el-Din ona bir at hediye etti ve o da bu ata binerek düşmana saldırdı ve mucizeler gerçekleştirdi. Allah'a olan saygısından dolayı asla kimseyi savunmadı ve asla bir dinar veya dirhem biriktirmedi veya ona dokunmadı. Sadece kaba giysiler ve koyun derisinden yapılmış bir başlık giyiyordu. Seksen yılı aşkın bir ömür yaşadıktan sonra, Hicri 617 yılında, Cuma namazından sonra bir Cumartesi günü, elinde tesbihle uyurken vefat etti. Mezarı Baalbek'te ziyaret edilmektedir. 73-75}"
  id: "Abu Uthman Abdullah ibn Abdul Aziz ibn Jaafar al-Yunini, seorang pertapa agung, \"Singa Levant,\" berasal dari desa Yunin, salah satu desa di Baalbek. Beliau adalah seorang syekh yang agung, tinggi, dan tegas, seorang pria yang sangat berani, yang menyeru kebaikan dan melarang kejahatan, banyak terlibat dalam jihad, selalu mengingat Allah, dan tak tertandingi dalam perjuangan spiritual dan mukjizatnya. Pangeran Amjad, penguasa Baalbek, biasa mengunjunginya dan mempermalukannya, dengan berkata, \"Wahai Amjad, engkau berbuat zalim.\" Konon busurnya seberat delapan puluh pon, dan beliau tidak pernah absen dalam kampanye di Levant. Ketika beliau datang ke Homs untuk melawan para perampok, raja mujahid Asad al-Din menghadiahinya seekor kuda, yang ditungganginya ke arah musuh dan melakukan keajaiban. Beliau tidak pernah membela siapa pun karena rasa hormat kepada Allah, dan beliau tidak pernah menimbun atau menyentuh dinar atau dirham. Ia hanya mengenakan pakaian kasar dan topi yang terbuat dari kulit domba. Ia meninggal pada tahun 617 Hijriah pada hari Sabtu setelah salat Jumat, tertidur dengan tasbih di tangannya, setelah hidup lebih dari delapan puluh tahun. Makamnya dikunjungi di Baalbek. 73-75}."
