summary:
  ar: "القاضي أبو يعلى محمد بن الحسين بن الفراء، شيخ الحنابلة ومنتهاهم في وقته، ولد في محرم سنة ثمانين وثلاثمائة، وتولى النظر في الحكم بحريم دار الخلافة، وكان إمامًا في الفقه له تصانيف الحسان الكثيرة في مذهب أحمد، ودرّس وأفتى سنين وانتهى إليه المذهب وانتشرت تصانيفه وأصحابه، وجمع الإمامة والفطنة والصدق وحسن الخُلق والتعبد والتقشف والخشوع وحسن السمت واتباع السلف، وهو آخر من حدّث عن أبي القاسم موسى السراج، وكان عنده مصنفات قد تفرّد بها منها كتاب الزاهر لابن الأنباري وكتاب المطر لابن دريد وكتاب التفسير ليحيى بن سلام، وشهد عند قاضي القضاة ابن ماكولا والدامغاني فقبلا شهادته. توفي ليلة الاثنين وقت العشاء ودُفن يوم الاثنين العشرين من رمضان سنة ثمان وخمسين وأربعمائة وهو ابن ثمان وسبعين سنة، وغسله الشريف أبو جعفر بوصية إليه — وكان من وصيته أن يُكفّن في ثلاثة أثواب وألا يُدفن معه في القبر غير ما غزله لنفسه وألا يُخرق عليه ثوب ولا يُقعد لعزاء — واجتمع له خلق لا يُحصون وعُطّلت الأسواق ومشى مع جنازته قاضي القضاة الدامغاني وجماعة الفقهاء والقضاة والشهود ونقيب الهاشميين أبو القوارس طراد وأرباب الدولة، وصلى عليه ابنه، وقبره ظاهر بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
  en: "The qadi Abu Ya'la Muhammad ibn al-Husayn al-Farra' — chief of the Hanbalis and the end of their line in his age, born Muharram 380, judge in the caliphal harim, author of numerous works in the madhhab including the Hanbali al-Ahkam al-Sultaniyya; the last to transmit from Abu'l-Qasim Musa al-Siraj, holder of unique texts like Ibn al-Anbari's al-Zahir and Ibn Durayd's al-Matr. Died Monday evening, buried Monday 20 Ramadan 458 aged seventy-eight; washed by Sharif Abu Ja'far under his own will — three shrouds, nothing in the grave but what he had spun himself, no garment torn, no mourning-assembly held — the markets closed and an uncountable crowd followed his bier with the chief qadi, the jurists, the nuqaba' and the men of state {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
  fr: "Le cadi Abu Ya'la Muhammad ibn al-Husayn al-Farra', chef des hanbalites et leur autorité ultime à son époque, né en mouharram 380, juge dans l'enceinte califale, auteur de nombreuses œuvres de l'école dont l'al-Ahkam al-Sultaniyya hanbalite. Dernier transmetteur d'Abu'l-Qasim Musa al-Siraj, il détenait des textes uniques comme al-Zahir d'Ibn al-Anbari et al-Matr d'Ibn Durayd. Mort le soir du lundi et enterré le lundi 20 ramadan 458 à soixante-dix-huit ans, il fut lavé par le chérif Abu Ja'far selon son testament : trois linceuls, rien dans la tombe que ce qu'il avait lui-même filé, aucun vêtement déchiré, aucune assemblée de deuil. Les marchés fermèrent et une foule innombrable suivit sa civière avec le grand cadi, les juristes, les nuqaba' et les hommes d'État {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
  es: "El cadí Abu Ya'la Muhammad ibn al-Husayn al-Farra', jefe de los hanbalíes y último de su linaje en su época, nacido en Muharram 380, juez en el califa Harim, autor de numerosas obras en la madhhab, incluyendo el Hanbali al-Ahkam al-Sultaniyya; el último en transmitir de Abu'l-Qasim Musa al-Siraj, poseedor de textos únicos como al-Zahir de Ibn al-Anbari y al-Matr de Ibn Durayd. Murió el lunes por la noche, enterrado el lunes 20 de Ramadán 458 a la edad de setenta y ocho años; Lavado por Sharif Abu Ja'far bajo su propia voluntad —tres sudarios, nada en la tumba excepto lo que él mismo había hilado, ninguna prenda rasgada, ninguna asamblea de duelo celebrada— los mercados cerraron y una multitud incontable siguió su féretro con el cadí principal, los juristas, el nuqaba' y los hombres de estado {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
  ur: "قادی ابو یعلی محمد بن الحسین الفارع - حنبلیوں کے سردار اور اپنی عمر میں ان کے سلسلہ کے آخر میں، پیدائش 380 محرم، خلیفہ حرم میں جج، حنبلی الاحکام السلطانیہ سمیت متعدد تصانیف کے مصنف؛ ابو القاسم موسیٰ السراج کی طرف سے منتقل کرنے والا آخری، ابن الانباری کی الظاہر اور ابن دورید کی المطر جیسی منفرد تحریروں کا حامل ہے۔ پیر کی شام وفات پائی، سوموار 20 رمضان 458 سال کی عمر میں 78 سال میں دفن ہوئے۔ شریف ابو جعفر نے اپنی مرضی سے غسل کیا - تین کفن، قبر میں کچھ نہیں مگر جو اس نے خود کاتا تھا، کوئی لباس نہیں پھٹا، نہ کوئی ماتمی مجلس منعقد ہوئی - بازار بند ہو گئے اور ایک بے شمار ہجوم اس کے پیچھے قادیانیوں، فقہاء، نقباء اور اہل ریاست کے ساتھ چل پڑا۔ صفحہ 585-586}۔"
  tr: "Hanbelilerin şeyhi ve zamanındaki en büyük otoritesi olan Kadı Ebu Ya'la Muhammed ibn el-Hüseyn ibn el-Ferra', Hicri 380 yılının Muharrem ayında doğdu. Halifelik sarayının hareminde yöneticiydi. Fıkıh konusunda imamdı ve Ahmed ekolü üzerine birçok mükemmel eseri vardı. Yıllarca fetvalar verdi ve bu ekol onunla son buldu, eserleri ve takipçileri yayıldı. Liderlik, zekâ, doğruluk, iyi karakter, ibadet, çilecilik, tevazu, iyi davranış ve seleflerine bağlılığı bir araya getirdi. Ebu el-Kâsım Musa el-Sirac'tan rivayet eden son kişiydi. İbn el-Enberi'nin el-Zahir kitabı, İbn Duraid'in el-Matar kitabı ve Yahya ibn Salam'ın el-Tefsir kitabı gibi kendine özgü eserleri vardı. Başyargıç İbn Makula ve el-Damghani huzurunda ifade verdi ve onlar da ifadesini kabul ettiler. Pazartesi akşamı yemek vaktinde vefat etti ve 78 yaşında, 458 yılının Ramazan ayının yirminci günü olan Pazartesi günü defnedildi. Şerif Ebu Ca'fer, vasiyetine göre onu yıkadı; vasiyetleri arasında üç giysiyle kefenlenmesi, mezara kendisiyle birlikte kendi dokuduğu dışında hiçbir şeyin gömülmemesi, üzerindeki hiçbir giysinin yırtılmaması ve yas tutulmaması vardı. Cenaze töreni için kalabalık toplandı, çarşılar kapatıldı ve Baş Yargıç el-Damghani, bir grup hukukçu, hakim, şahit, Haşimilerin başı Ebu el-Kavaris Tarad ve devletin ileri gelenleri cenaze alayıyla birlikte yürüdüler ve oğlu onun için dua etti. Mezarı Bab Harb mezarlığında görülebilir. {cite:muntazam-ibn-al-jawzi j.8 p.585-586}"
  id: "Abu Ya’la Muhammad ibn al-Husayn ibn al-Farra’, Syekh mazhab Hanbali dan tokoh terkemuka mereka pada masanya, lahir pada bulan Muharram tahun 380 Hijriah. Beliau bertanggung jawab atas pemerintahan di harem kekhalifahan. Beliau adalah seorang imam dalam bidang fiqih dan memiliki banyak karya yang sangat baik tentang mazhab Ahmad. Beliau mengajar dan memberikan fatwa selama bertahun-tahun, dan mazhab tersebut berakhir bersamanya, dan karya-karyanya serta para pengikutnya menyebar luas. Beliau menggabungkan kepemimpinan, kecerdasan, kejujuran, akhlak yang baik, ibadah, kesederhanaan, kerendahan hati, perilaku yang baik, dan mengikuti para pendahulu. Beliau adalah orang terakhir yang meriwayatkan hadis dari Abu al-Qasim Musa al-Siraj. Beliau memiliki karya-karya yang unik, termasuk kitab al-Zahir karya Ibn al-Anbari, kitab al-Matar karya Ibn Duraid, dan kitab al-Tafsir karya Yahya ibn Salam. Ia bersaksi di hadapan Ketua Mahkamah Agung Ibn Makula dan al-Damghani, dan mereka menerima kesaksiannya. Ia meninggal pada Senin malam saat makan malam dan dimakamkan pada hari Senin, tanggal 20 Ramadan tahun 458, pada usia 78 tahun. Sharif Abu Ja'far memandikannya sesuai wasiatnya — dan di antara wasiatnya adalah agar ia dikafani dengan tiga lapis kain, agar tidak ada yang dikubur bersamanya di dalam kubur kecuali apa yang telah ia pintal sendiri, agar tidak ada kain yang disobek di atasnya, dan agar tidak diadakan upacara berkabung — dan banyak orang berkumpul untuknya, dan pasar-pasar ditutup, dan Ketua Mahkamah Agung al-Damghani, sekelompok ahli hukum, hakim, saksi, kepala suku Hasyim Abu al-Qawaris Tarad, dan para pejabat negara berjalan bersama prosesi pemakamannya, dan putranya berdoa untuknya, dan kuburnya terlihat di pemakaman Bab Harb {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
