  en: "Abu Ya'la al-Farra'"
names:
  - { value: "محمد بن الحسين بن خلف بن أحمد بن الفراء أبو يعلى القاضي الحنبلي", kind: full }
summary:
  ar: "القاضي أبو يعلى محمد بن الحسين بن الفراء، شيخ الحنابلة ومنتهاهم في وقته، ولد في محرم سنة ثمانين وثلاثمائة، وتولى النظر في الحكم بحريم دار الخلافة، وكان إمامًا في الفقه له تصانيف الحسان الكثيرة في مذهب أحمد، ودرّس وأفتى سنين وانتهى إليه المذهب وانتشرت تصانيفه وأصحابه، وجمع الإمامة والفطنة والصدق وحسن الخُلق والتعبد والتقشف والخشوع وحسن السمت واتباع السلف، وهو آخر من حدّث عن أبي القاسم موسى السراج، وكان عنده مصنفات قد تفرّد بها منها كتاب الزاهر لابن الأنباري وكتاب المطر لابن دريد وكتاب التفسير ليحيى بن سلام، وشهد عند قاضي القضاة ابن ماكولا والدامغاني فقبلا شهادته. توفي ليلة الاثنين وقت العشاء ودُفن يوم الاثنين العشرين من رمضان سنة ثمان وخمسين وأربعمائة وهو ابن ثمان وسبعين سنة، وغسله الشريف أبو جعفر بوصية إليه — وكان من وصيته أن يُكفّن في ثلاثة أثواب وألا يُدفن معه في القبر غير ما غزله لنفسه وألا يُخرق عليه ثوب ولا يُقعد لعزاء — واجتمع له خلق لا يُحصون وعُطّلت الأسواق ومشى مع جنازته قاضي القضاة الدامغاني وجماعة الفقهاء والقضاة والشهود ونقيب الهاشميين أبو القوارس طراد وأرباب الدولة، وصلى عليه ابنه، وقبره ظاهر بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
  en: "The qadi Abu Ya'la Muhammad ibn al-Husayn al-Farra' — chief of the Hanbalis and the end of their line in his age, born Muharram 380, judge in the caliphal harim, author of numerous works in the madhhab including the Hanbali al-Ahkam al-Sultaniyya; the last to transmit from Abu'l-Qasim Musa al-Siraj, holder of unique texts like Ibn al-Anbari's al-Zahir and Ibn Durayd's al-Matr. Died Monday evening, buried Monday 20 Ramadan 458 aged seventy-eight; washed by Sharif Abu Ja'far under his own will — three shrouds, nothing in the grave but what he had spun himself, no garment torn, no mourning-assembly held — the markets closed and an uncountable crowd followed his bier with the chief qadi, the jurists, the nuqaba' and the men of state {cite:muntazam-ibn-al-jawzi j.8 p.585-586}."
