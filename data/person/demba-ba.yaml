summary:
  ar: "لاعب كرة قدم سنغالي معتزل، وُلد في سيفر بفرنسا سنة 1985. مهاجم لعب لهوفنهايم ووست هام يونايتد ونيوكاسل يونايتد وتشيلسي وبشكتاش وشنغهاي شينهوا وإسطنبول باشاك شهير، وخاض 22 مباراة مع منتخب السنغال. مسلم ممارس معروف بصيام رمضان وباحتفال السجود عند تسجيل الأهداف."
  en: "Senegalese retired footballer, born in Sèvres, France in 1985. A striker who played for Hoffenheim, West Ham United, Newcastle United, Chelsea, Beşiktaş, Shanghai Shenhua and İstanbul Başakşehir, and won 22 caps for Senegal. A practising Muslim, he is known for fasting during Ramadan and for the sujud goal celebration."
  ur: "سینیگالی ریٹائرڈ فٹبالر، 1985 میں فرانس کے سیور میں پیدا ہوئے۔ اسٹرائیکر جنہوں نے ہو فن ہائم، ویسٹ ہیم یونائیٹڈ، نیو کیسل یونائیٹڈ، چیلسی، بیشکتاش، شنگھائی شینہوا اور استنبول باشاک شہر کے لیے کھیلا، اور سینیگال کے لیے 22 میچ کھیلے۔ باعمل مسلمان ہیں، رمضان کے روزوں اور گول پر سجدۂ شکر کے لیے معروف ہیں۔"
