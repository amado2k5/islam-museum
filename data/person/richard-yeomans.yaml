summary:
  ar: "باحث ورسام بريطاني، كان محاضراً أول في معهد التربية بجامعة وارِك ومنسّق الفن والتصميم فيه، وصاحب كتاب «فن القاهرة الإسلامية وعمارتها» (2006) {cite:yeomans-islamic-cairo-2006 back flap}."
  en: "British scholar and painter, formerly Senior Lecturer and Coordinator for Art and Design at the Institute of Education, University of Warwick, author of The Art and Architecture of Islamic Cairo (2006) {cite:yeomans-islamic-cairo-2006 back flap}."
  es: "Académico y pintor británico, anteriormente profesor titular y coordinador de arte y diseño en el Instituto de Educación de la Universidad de Warwick, autor de El arte y la arquitectura del Cairo islámico (2006) {cite:yeomans-islamic-cairo-2006 back flap}."
  fr: "Érudit et peintre britannique, ancien maître de conférences et coordinateur pour l'art et le design à l'Institut d'éducation de l'Université de Warwick, auteur de L'art et de l'architecture du Caire islamique (2006) {cite:yeomans-islamic-cairo-2006 back flap}."
  ur: "برطانوی اسکالر اور پینٹر، سابقہ سینئر لیکچرر اور انسٹی ٹیوٹ آف ایجوکیشن، واروک یونیورسٹی میں آرٹ اینڈ ڈیزائن کے لیے کوآرڈینیٹر، دی آرٹ اینڈ آرکیٹیکچر آف اسلامک قاہرہ (2006) کے مصنف {حوالہ:yeomans-islamic-cairo-2006 back flap}۔"
