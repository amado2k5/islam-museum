summary:
  en: "The chief of Banu Shayban who kept al-Nuʾman’s family and deposit out of honor, refused to surrender them to Iyas ibn Qabisa and Khosrow, and led his tribe to victory over the Persians at Dhu Qar — the first day the Arabs routed the Persians."
  ar: "سيد آل شيبان الذي حمى أهل النعمان ووديعته حمية وأنفة، وأبى تسليمها لإياس بن قبيصة وكسرى، وقاد قبيلته فانتصرت على الفرس يوم ذي قار — أول يوم انتصرت فيه العرب على العجم."
  es: "El jefe de Banu Shayban, que por honor conservó a la familia y el depósito de al-Nuʾman, se negó a entregarlos a Iyas ibn Qabisa y Khosrow, y condujo a su tribu a la victoria sobre los persas en Dhu Qar, el primer día en que los árabes derrotaron a los persas."
  fr: "Le chef des Banu Shayban, qui avait gardé la famille et le dépôt d'al-Nuʾman par honneur, refusa de les livrer à Iyas ibn Qabisa et Khosrow, et mena sa tribu à la victoire sur les Perses à Dhu Qar — le premier jour où les Arabes mirent en déroute les Perses."
  ur: "بنو شیبان کے سردار نے جس نے النعمان کے خاندان اور امانت کو غیرت کے نام پر رکھا، انہیں ایاس بن قبیصہ اور خسرو کے حوالے کرنے سے انکار کر دیا اور اپنے قبیلے کو ذو قار کے مقام پر فارسیوں پر فتح کی طرف لے گیا - جس دن عربوں نے فارسیوں کو شکست دی تھی۔"
  tr: "Nu'man halkını koruyan ve Hamiya ile Anfa'yı emanet eden El-Şeyban ailesinin lideri, onları İyas bin Kubeysa ve Hoşrov'a teslim etmeyi reddetti ve Dhi Kar gününde — Arapların Arap olmayanlara karşı ilk zafer kazandığı gün — kabilesini Perslere karşı zafere taşıdı."
  id: "Pemimpin keluarga Al-Shayban, yang melindungi rakyat Nu'man dan mempercayakan Hamiya serta Anfa, menolak menyerahkan mereka kepada Iyas ibn Qubaysa dan Khosrow, dan memimpin sukunya meraih kemenangan atas Persia pada hari Dhi Qar — hari pertama Arab menang atas non-Arab."
