summary:
  en: "The chief of Banu Shayban who kept al-Nuʾman’s family and deposit out of honor, refused to surrender them to Iyas ibn Qabisa and Khosrow, and led his tribe to victory over the Persians at Dhu Qar — the first day the Arabs routed the Persians."
  ar: "سيد آل شيبان الذي حمى أهل النعمان ووديعته حمية وأنفة، وأبى تسليمها لإياس بن قبيصة وكسرى، وقاد قبيلته فانتصرت على الفرس يوم ذي قار — أول يوم انتصرت فيه العرب على العجم."
