summary:
  ar: "مؤرخ وعالم وفيلسوف من خلافة صكتو (1804–1864)، ابن خديجة كبرى بنات عثمان دان فوديو، عُدّ أعلم أهل زمانه، وأدار المعهد التعليمي الذي أسسه أبوه في سلامي فقصده العلماء من تمبكتو وغيرها، وترك أكثر من اثنين وسبعين مصنفًا في التاريخ والفلسفة والفقه."
  en: "Sokoto Caliphate historian, scholar and philosopher (1804–1864), son of Khadijah, the eldest daughter of Usman dan Fodio. Counted the most learned man of his generation, he ran the teaching institute his father had founded at Salame, which drew scholars from Timbuktu and beyond, and left more than seventy-two works on history, philosophy and law."
  ur: "خلافت سکوٹو کے مؤرخ، عالم اور فلسفی (1804–1864)، جو عثمان دان فودیو کی سب سے بڑی بیٹی خدیجہ کے بیٹے تھے۔ انھیں اپنے زمانے کا سب سے بڑا عالم مانا جاتا تھا؛ انھوں نے سلامے میں اپنے والد کے قائم کردہ تعلیمی ادارے کو چلایا جہاں ٹمبکٹو اور دور دراز سے علما آتے تھے، اور تاریخ، فلسفہ اور فقہ پر بہتر سے زائد تصانیف چھوڑیں۔"
