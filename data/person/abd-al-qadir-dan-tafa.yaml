    note: "No source consulted names a legal school or a Sufi order for the man himself. The full texts of the English, Arabic, Urdu and Hausa articles were searched: they attest his learning in fiqh, tafsir and history, that his uncle Muhammad Sanbu taught him Sufism, and that his mother Khadijah translated Khalil's Mukhtasar — the Maliki manual — into Fulfulde; Muhammad Shareef's Sankore biography of him (The Life of Shaykh Dan Tafa, read in full-text on 3 November 2026) speaks of Maliki law and Qadiriyya adherence for the Torodbe tradition and his forebears, not for him personally. The Sokoto scholarly tradition he inherited was Maliki in law and Qadiri in devotion, as his grandfather Usman dan Fodio's record attests for the grandfather himself; descent, family and milieu never settle a value under the two-source rule — the same restraint this lane applied to his uncle Muhammad Bello — so his faith is recorded unknown, with his Sufi studies recorded here and in the prose."
