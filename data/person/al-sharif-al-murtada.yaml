summary:
  ar: "نقيب الطالبيين وشيخ الشيعة ورئيسهم بالعراق، كان إماماً في التشيع والكلام والشعر والبلاغة كثير التصانيف، أخذ عن الشيخ المفيد وولي النقابة، وقيل إن له يداً في نهج البلاغة المجموع من كلام علي بن أبي طالب، وله كتاب الدرر والغرر في مجالس أملاها تشتمل على فنون في معاني الأدب، وذكره ابن بسام في آخر الذخيرة فقال كان إمام أمة العراق على الاختلاف والاتفاق إليه فزع علماؤها وعنه أخذ عظماؤها، وله إحدى وثمانون سنة {cite:shadharat-dhahab p. 264-265}. وفي سنة سبع وتسعين لقب الشريف أبو القاسم أخو الرضي بالمرتضى ذي المجدين، وشهد وكتب خطه في المحضر البغدادي في الطعن في نسب الفاطميين سنة اثنتين وأربعمائة، وفي صفر سنة ست وأربعمائة قُلّد الحج والمظالم ونقابة نقباء الطالبيين وجميع ما كان لأخيه الرضي بعد وفاته {cite:muntazam-ibn-al-jawzi j.7 p.235,255,276}. وفي سنة ٤١٦ أحرق العيارون داره في فتنتهم على الكرخ {cite:muntazam-ibn-al-jawzi j.8 p.364}، وكان أول من بايع القائم بأمر الله يوم موت أبيه ١١ ذي الحجة ٤٢٢ {cite:muntazam-ibn-al-jawzi j.8 p.399-400}، وآوى جلال الدولة بدار جميل بالكرخ حين أسره الغلمان سنة ٤٢٤ حتى عادوا يعتذرون عنده {cite:muntazam-ibn-al-jawzi j.8 p.415-417}، وشفع سنة ٤٢٥ فعفا عن أهل الكرخ بعد سنين من المساحة والنفي {cite:muntazam-ibn-al-jawzi j.8 p.422}. توفي سنة ست وثلاثين وأربعمائة ودُفن في داره، وتقلّد أبو أحمد عدنان ابن الرضي ما كان يتقلّده عمه {cite:muntazam-ibn-al-jawzi j.8 p.461,468}. ويروي ابن الجوزي عن ابن الطيوري عن ابن برهان أنه دخل على المرتضى في مرضه فسمعه يقول في كلام عن الشيخين إنهما «وليا فعدلا واسترحما»، فقام فما بلغ عتبة الدار حتى سمع الزعقة عليه — على ما يرويه المخالفون له في مذهبه {cite:muntazam-ibn-al-jawzi j.8 p.468}."
  en: "Naqib of the Talibids and head of Iraq's Shi'a — imam in kalam, poetry and rhetoric, pupil of al-Shaykh al-Mufid; a hand in the Nahj al-balagha's compilation is attributed to him, and Ibn Bassam praised him as the agreed imam of Iraq's community {cite:shadharat-dhahab p. 264-265}."
  fr: "Naqib des Talibids et chef des chiites d'Irak - imam en kalam, poésie et rhétorique, élève d'al-Shaykh al-Mufid ; une main dans la compilation de Nahj al-balagha lui est attribuée, et Ibn Bassam l'a loué comme l'imam convenu de la communauté irakienne {cite:shadharat-dhahab p. 264-265}."
  ur: "عراق کے شیعہ عالم، طالبیوں کے نقیب اور شیخ مفید کے شاگرد؛ کلام، شاعری اور بلاغت میں ان کی علمی حیثیت بیان کی گئی ہے۔ {cite:shadharat-dhahab}"
  es: "Naqib de los talibanes y líder de los chiítas de Irak, imán en kalam, poesía y retórica, discípulo de al-Shaykh al-Mufid; se le atribuye haber participado en la compilación del Nahj al-balagha, e Ibn Bassam lo elogió como el imán consensuado de la comunidad iraquí {cite:shadharat-dhahab p. 264-265}."
  tr: "Talibiyyin'in lideri ve Irak'taki Şiilerin şeyhi ve lideri olan Sher, Şiilik, teoloji, şiir ve hitabet alanında imamdı, geniş çapta yazılmıştır. Şeyh al-Mufid'in yanında eğitim aldı ve sendikayı yönetti. Ali ibn Ebi Talib'in sözlerinden oluşan Nahj al-Balagha'da parmağı olduğu söylenir. 'Al-Durar wa al-Ghurar fi Majalis' adlı kitabı yazdı; bu dikteler çeşitli edebi anlamlar içeriyordu. İbn Bassam, Al-Dhakhira'nın sonunda ondan bahsetti ve şöyle demiştir: O, Irak milletinin hem anlaşmazlıkta hem de anlaşmazlıkta imamı idi; bu durum alimleri endişelendirdi ve ondan ders aldı. Seksen bir yaşındaydı {atıf:shadharat-dhahab, s. 264-265}. Doksan yedinci yılda, el-Radi'nin kardeşi Şerif Ebu el-Kızıma el-Murtada Dhi el-Majdayn unvanı verildi. 402 Hicri yılında Fatımi soyuna meydan okuyan Bağdadi Defteri'ne el yazısını yazdı ve tanıklık etti. 406 H yılının Seferinde, Hac ve şikayetler, Talibiyyin kaptanlarının sendikası ve kardeşi el-Radi'nin ölümünden sonra ona ait olan her şeyi olarak atandı {atıf:Muntazam-ibn-al-Jawzi j.7 s.235,255,276}. 416 Hicri yılında, Ayyarun Karkh'a karşı isyanlarında evini yaktı {atıf:Muntazam-ibn-al-jawzi J.8 s.364}. Babası öldüğü gün, 11 Dhu al-Hijjah 422 tarihinde El-Kaim bi-Amr Allah'a bağlılık yemini eden ilk kişi oldu {atıf:Muntazam-ibn-al-jawzi J.8 s.399-400} ve çocuklar 424 Hicri'de Karkh'ta Celal al-Dawla'yı yakalandığında güzel bir evde sakladı, ta ki geri dönüp özür diledikten sonra {atıf:Muntazam-ibn-al-jawzi J.8 s.417}. 425'te arabuluculuk etti ve yıllarca sürgünden sonra Karkh halkını affetti {cite:Muntazam-ibn-al-jawzi J.8 s.422}. Dört yüz otuz altıncı hicri yılında öldü ve evine gömüldü. Ebu Ahmed Adnan ibn al-Radi, amcasının benimsediği geleneği benimsedi {cite:Muntazam-ibn-al-jawzi J.8 s.461,468}. İbn al-Jawzi, İbn al-Tayuri'den İbn Burhan'dan anlatır; hastayken el-Murtada'yı ziyaret ettiğini ve iki şeyhin sözleriyle 'azizler, bu yüzden adalet aradı ve merhamet diledi.' Okulunda kendisine karşı çıkanlara göre, ayağa kalktı ve evin eşiğine ulaşmadı, ta ki kendisine karşı çıkan kargaşayı duyana kadar. {atıf:Muntazam-ibn-al-jawzi J.8 s.468}."
  id: "Pemimpin Talibiyyin dan sheikh serta pemimpin Syiah di Irak, ia adalah imam dalam Syiah, teologi, puisi, dan retorika yang banyak ditulis. Ia belajar di bawah bimbingan Sheikh al-Mufid dan memegang sindikat tersebut. Dikatakan bahwa ia terlibat dalam Nahj al-Balagha, kumpulan kata-kata Ali ibn Abi Talib. Ia menulis buku 'Al-Durar wa al-Ghurar fi Majalis' diktasi, yang memuat berbagai makna sastra. Ibn Bassam menyebutnya di akhir Al-Dhakhira, mengatakan: Ia adalah Imam bangsa Irak, baik dalam ketidaksepakatan maupun ketidaksetujuan, yang membuat para ulama khawatir dan belajar darinya. Usianya delapan puluh satu tahun {cite:shadharat-dhahab, hlm. 264-265}. Pada tahun kesembilan puluh tujuh, Sharif Abu al-Qasim, saudara al-Radi, diberi gelar al-Murtada Dhi al-Majdayn. Ia menyaksikan dan menulis tulisan tangannya di Baghdadi Register yang menantang garis keturunan Fatimiyah pada tahun 402 H. Pada Safar tahun 406 H, ia diangkat sebagai Haji dan para penghormatan, sindikat para kapten Talibiyyin, dan semua yang dimiliki oleh saudaranya al-Radi setelah kematiannya {cite:muntazam-ibn-al-jawzi j.7 hlm.235,255,276}. Pada tahun 416 H, Ayyarun membakar rumahnya dalam pemberontakan mereka melawan Karkh {cite:Muntazam-ibn-al-jawzi J.8 hlm.364}. Ia adalah orang pertama yang bersumpah setia kepada Al-Qa'im bi-Amr Allah pada hari kematian ayahnya pada 11 Dhu al-Hijjah 422 {cite:Muntazam-ibn-al-jawzi J.8 hlm.399-400}, dan ia melindungi Jalal al-Dawla di sebuah rumah indah di Karkh ketika anak-anak menangkapnya pada tahun 424 H.H hingga mereka kembali untuk meminta maaf kepadanya {cite:Muntazam-ibn-al-jawzi J.8 hlm.417}. Ia menjadi perantara pada tahun 425 dan mengampuni rakyat Karkh setelah bertahun-tahun pengasingan {cite:Muntazam-ibn-al-jawzi J.8 hlm.422}. Ia meninggal pada tahun empat ratus tiga puluh enam H dan dimakamkan di rumahnya. Abu Ahmad Adnan ibn al-Radi mengikuti tradisi yang sama seperti yang biasa diikuti pamannya {cite:Muntazam-ibn-al-jawzi J.8 hlm.461,468}. Ibn al-Jawzi menceritakan dari Ibn al-Tayuri dari Ibn Burhan bahwa ia mengunjungi al-Murtada saat sakit dan mendengar ia berkata dalam kata-kata dua sheikh bahwa mereka adalah 'orang suci, maka ia mencari keadilan dan memohon belas kasihan.' Ia berdiri dan tidak sampai ke ambang rumah sampai mendengar keributan yang terhadapnya — menurut mereka yang tidak setuju dengannya di sekolahnya {cite:Muntazam-ibn-al-jawzi J.8 hlm.468}."
