summary:
  ar: "نقيب الطالبيين وشيخ الشيعة ورئيسهم بالعراق، كان إماماً في التشيع والكلام والشعر والبلاغة كثير التصانيف، أخذ عن الشيخ المفيد وولي النقابة، وقيل إن له يداً في نهج البلاغة المجموع من كلام علي بن أبي طالب، وله كتاب الدرر والغرر في مجالس أملاها تشتمل على فنون في معاني الأدب، وذكره ابن بسام في آخر الذخيرة فقال كان إمام أمة العراق على الاختلاف والاتفاق إليه فزع علماؤها وعنه أخذ عظماؤها، وله إحدى وثمانون سنة {cite:shadharat-dhahab p. 264-265}."
  en: "Naqib of the Talibids and head of Iraq's Shi'a — imam in kalam, poetry and rhetoric, pupil of al-Shaykh al-Mufid; a hand in the Nahj al-balagha's compilation is attributed to him, and Ibn Bassam praised him as the agreed imam of Iraq's community {cite:shadharat-dhahab p. 264-265}."
