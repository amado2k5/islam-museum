summary:
  ar: "نقيب الطالبيين وشيخ الشيعة ورئيسهم بالعراق، كان إماماً في التشيع والكلام والشعر والبلاغة كثير التصانيف، أخذ عن الشيخ المفيد وولي النقابة، وقيل إن له يداً في نهج البلاغة المجموع من كلام علي بن أبي طالب، وله كتاب الدرر والغرر في مجالس أملاها تشتمل على فنون في معاني الأدب، وذكره ابن بسام في آخر الذخيرة فقال كان إمام أمة العراق على الاختلاف والاتفاق إليه فزع علماؤها وعنه أخذ عظماؤها، وله إحدى وثمانون سنة {cite:shadharat-dhahab p. 264-265}. وفي سنة سبع وتسعين لقب الشريف أبو القاسم أخو الرضي بالمرتضى ذي المجدين، وشهد وكتب خطه في المحضر البغدادي في الطعن في نسب الفاطميين سنة اثنتين وأربعمائة، وفي صفر سنة ست وأربعمائة قُلّد الحج والمظالم ونقابة نقباء الطالبيين وجميع ما كان لأخيه الرضي بعد وفاته {cite:muntazam-ibn-al-jawzi j.7 p.235,255,276}. وفي سنة ٤١٦ أحرق العيارون داره في فتنتهم على الكرخ {cite:muntazam-ibn-al-jawzi j.8 p.364}، وكان أول من بايع القائم بأمر الله يوم موت أبيه ١١ ذي الحجة ٤٢٢ {cite:muntazam-ibn-al-jawzi j.8 p.399-400}، وآوى جلال الدولة بدار جميل بالكرخ حين أسره الغلمان سنة ٤٢٤ حتى عادوا يعتذرون عنده {cite:muntazam-ibn-al-jawzi j.8 p.415-417}، وشفع سنة ٤٢٥ فعفا عن أهل الكرخ بعد سنين من المساحة والنفي {cite:muntazam-ibn-al-jawzi j.8 p.422}. توفي سنة ست وثلاثين وأربعمائة ودُفن في داره، وتقلّد أبو أحمد عدنان ابن الرضي ما كان يتقلّده عمه {cite:muntazam-ibn-al-jawzi j.8 p.461,468}. ويروي ابن الجوزي عن ابن الطيوري عن ابن برهان أنه دخل على المرتضى في مرضه فسمعه يقول في كلام عن الشيخين إنهما «وليا فعدلا واسترحما»، فقام فما بلغ عتبة الدار حتى سمع الزعقة عليه — على ما يرويه المخالفون له في مذهبه {cite:muntazam-ibn-al-jawzi j.8 p.468}."
  en: "Naqib of the Talibids and head of Iraq's Shi'a — imam in kalam, poetry and rhetoric, pupil of al-Shaykh al-Mufid; a hand in the Nahj al-balagha's compilation is attributed to him, and Ibn Bassam praised him as the agreed imam of Iraq's community {cite:shadharat-dhahab p. 264-265}."
