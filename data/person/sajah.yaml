summary:
  en: "A woman of Tamim by her father and Taghib by her mother who claimed prophecy in rhymed speech, marched an army toward Medina, then turned to Yamama and joined Musaylima — before returning to Islam and living into the caliphate."
  ar: "امرأة من تميم لأبيها ومن تغلب لأمها ادّعت النبوة بسجعها، وساقت جيشًا نحو المدينة، ثم توجهت إلى اليمامة فالتحقت بمسيلمة — قبل أن تعود إلى الإسلام وتعيش في عهد الخلافة. وعند البلاذري اختلاف في نسبها: فسجاح بنت أوس بن حِقّ بن أسامة بن الغذير بن يربوع بن حنظلة، وقيل سجاح بنت الحارث بن عُمفان بن سويد بن خالد بن أسامة؛ وذُكر أنها سجعت يومًا «إن رب السحاب يأمركم أن تغزوا الرباب» ففزعوا إليها فسارعت بمن تبعها، فأتت مسيلمة وهو بحجر فتزوجته وجعلت دينها ودينه واحدًا فلما قُتل صارت إلى إخوتها فماتت عندهم؛ وقال ابن الكلبي أسلمت سجاح وهاجرت إلى البصرة وحسن إسلامها، وقال عبد الأعلى بن حماد النرسي سمعت مشايخ من البصريين يقولون إن سمرة بن جندب الفزاري صلى عليها وهو يلي البصرة من قبل معاوية قبل قدوم عبيد الله بن زياد؛ وقال ابن الكلبي كان مؤذن سجاح الجنبة بن طارق بن عمرو بن حوط الرياحي، وقوم يقولون إن شبث بن ربعي الرياحي كان يؤذن لها."
  es: "Una mujer de apellido Tamim por parte de padre y Taghib por parte de madre, que afirmaba tener dones proféticos en un discurso rimado, marchó con un ejército hacia Medina, luego se dirigió a Yamama y se unió a Musaylima, antes de regresar al Islam y vivir durante el califato."
  fr: "Une femme de Tamim par son père et de Taghib par sa mère, qui prétendait avoir des dons de prophétie en paroles rimées, marcha une armée vers Médine, puis se tourna vers Yamama et rejoignit Musaylima — avant de revenir à l'islam et de vivre dans le califat."
  ur: "تمیم کی ایک عورت اپنے والد کی طرف سے اور تغیب کی اپنی ماں کی طرف سے جس نے مدلل تقریر میں نبوت کا دعویٰ کیا، مدینہ کی طرف لشکر کشی کی، پھر یمامہ کا رخ کیا اور مسیلمہ میں شامل ہو گئی - اسلام میں واپس آنے اور خلافت میں رہنے سے پہلے۔"
  tr: "Tamim'den babasına, Taghlib'den annesine kadar bir kadın, kafiyeleriyle peygamberlik ilan etti, ardından Medine'ye doğru bir ordu yönetti, ardından Al-Yamama'ya gidip Musaylimah'a katıldı—ardından İslam'a döndü ve halifelik döneminde yaşadı. El-Baladhuri'nin soy farkları vardır: Sâcah bint Avs ibn Haq ibn Usama ibn al-Ghadir ibn Yarbu' ibn Hanzala, ve Sajah bint al-Harith ibn Amfan ibn Suwayd ibn Khalid ibn Usama'nın söylediği söylenir; bir keresinde şöyle dediği belirtilir: \"Gerçekten bulutların Rabbi sana Rabab'a saldırmanı emreder.\" Onlar ona koştu, o da peşinden gelenlerle birlikte acele etti. Musaylimah Hajar ile birlikteyken geldi, onunla evlendi ve dinini ve hışırını tek yaptı. O öldürüldüğünde, o da kardeşlerinden biri oldu ve onlarla birlikte öldü; İbn al-Kalbi, Sajah'ın İslam'ı benimsediğini ve Basra'ya göç ettiğini, dönüşümünün iyi olduğunu söyledi. Abd al-A'la şöyle dedi: İbn Hammad al-Narsi: Basranlardan bazı yaşlıların, Samurah ibn Jundub al-Fazari'nin, Ubayd Allah ibn Ziyad'ın gelişinden önce Muaviye'den önce Basra'ya giderken onun için dua ettiğini duydum; İbn al-Kalbi, kendisinin Secah al-Janbah ibn Tariq bin Amr ibn Hut al-Riyahi'nin müezzini olduğunu söyler; bazıları ise Şabat ibn Rabi'al-Riyahi'nin onun için ezan çağırdığını söyler."
  id: "Seorang wanita dari Tamim hingga ayahnya dan dari Taghlib hingga ibunya mengklaim kenabian melalui rima-rimanya, memimpin pasukan menuju Madinah, lalu menuju Al-Yamama dan bergabung dengan Musaylimah—sebelum kembali ke Islam dan hidup selama masa kekhalifahan. Al-Baladhuri memiliki perbedaan garis keturunan: Sajah bint Aws ibn Haq ibn Usama ibn al-Ghadir ibn Yarbu' ibn Hanzala, dan dikatakan Sajah bint al-Harith ibn Amfan ibn Suwayd ibn Khalid ibn Usama; disebutkan bahwa dia pernah mengucapkan, \"Sungguh, Tuhan awan memerintahkanmu untuk menyerang Rabab.\" Mereka bergegas ke arahnya, sehingga dia segera bersama mereka yang mengikutinya. Musaylimah datang saat bersama Hajar, menikahinya, dan menjadikan agama serta keturunannya sebagai satu. Ketika dia dibunuh, dia menjadi salah satu saudaranya dan meninggal bersama mereka; Ibn al-Kalbi berkata bahwa Sajah memeluk Islam dan bermigrasi ke Basra, dan konversinya baik. Abd al-A'la berkata Ibn Hammad al-Narsi: Saya mendengar beberapa tetua dari Basran mengatakan bahwa Samurah ibn Jundub al-Fazari berdoa untuknya saat dalam perjalanan ke Basra sebelum Muawiyah sebelum kedatangan Ubayd Allah ibn Ziyad; dan Ibn al-Kalbi mengatakan bahwa dia adalah muezzin Sajah al-Janbah ibn Tariq ibn Amr ibn Hut al-Riyahi, dan beberapa mengatakan bahwa Shabath ibn Rabi' al-Riyahi biasa memanggil adhan untuknya."
