summary:
  en: "A woman of Tamim by her father and Taghib by her mother who claimed prophecy in rhymed speech, marched an army toward Medina, then turned to Yamama and joined Musaylima — before returning to Islam and living into the caliphate."
  ar: "امرأة من تميم لأبيها ومن تغلب لأمها ادّعت النبوة بسجعها، وساقت جيشًا نحو المدينة، ثم توجهت إلى اليمامة فالتحقت بمسيلمة — قبل أن تعود إلى الإسلام وتعيش في عهد الخلافة. وعند البلاذري اختلاف في نسبها: فسجاح بنت أوس بن حِقّ بن أسامة بن الغذير بن يربوع بن حنظلة، وقيل سجاح بنت الحارث بن عُمفان بن سويد بن خالد بن أسامة؛ وذُكر أنها سجعت يومًا «إن رب السحاب يأمركم أن تغزوا الرباب» ففزعوا إليها فسارعت بمن تبعها، فأتت مسيلمة وهو بحجر فتزوجته وجعلت دينها ودينه واحدًا فلما قُتل صارت إلى إخوتها فماتت عندهم؛ وقال ابن الكلبي أسلمت سجاح وهاجرت إلى البصرة وحسن إسلامها، وقال عبد الأعلى بن حماد النرسي سمعت مشايخ من البصريين يقولون إن سمرة بن جندب الفزاري صلى عليها وهو يلي البصرة من قبل معاوية قبل قدوم عبيد الله بن زياد؛ وقال ابن الكلبي كان مؤذن سجاح الجنبة بن طارق بن عمرو بن حوط الرياحي، وقوم يقولون إن شبث بن ربعي الرياحي كان يؤذن لها."
