summary:
  ar: "صاحب المارستان بصالحية دمشق، ابن أخت صاحب قيمر؛ كان من جلة الأمراء وأبطالهم المذكورين وصلحائهم المشهورين، وأسرته هي التي قبضت على ملك الفرنج يوم الفوز بالمنصورة سنة ثمان وأربعين {cite:shadharat-dhahab p. 248}؛ توفي بنابلس ونقل فدفن بقبته بقرب مارستانه بالصالحية، والدعاء عند قبره مستجاب {cite:shadharat-dhahab p. 269}."
  en: "Founder of the Maristan at Damascus's Salihiyya (d. 653 at Nablus) — of the great hero-amirs; it was his retinue that laid hands on the Franks' king at the Mansura victory of 648; buried by his maristan, where prayer at his grave is held answered {cite:shadharat-dhahab p. 248, 269}."
  es: "Fundador del Maristan en Salihiyya de Damasco (m. 653 en Nablus) — de los grandes héroes-amires; fue su séquito el que puso manos sobre el rey de los francos en la victoria de Mansura de 648; enterrado junto a su maristán, donde se cree que las oraciones en su tumba son respondidas {cite:shadharat-dhahab p. 248, 269}."
  fr: "Fondateur du Maristan de Salihiyya à Damas (mort en 653 à Naplouse) — des grands héros-émirs; c'est sa suite qui a mis la main sur le roi des Francs lors de la victoire de Mansoura en 648; enterré près de son maristan, où l'on dit que les prières sur sa tombe sont exaucées {cite: shadharat-dhahab p. 248, 269}."
