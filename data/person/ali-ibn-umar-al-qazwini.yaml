summary:
  ar: "زاهد بغداد المشهور؛ ولد مستهل محرم سنة ستين وثلاثمائة وهي الليلة التي توفي فيها أبو بكر الآجري، وسمع أبا حفص بن الزيات وابن حيويه وابن شاذان، وكان وافر العقل من كبار عباد الله الصالحين يقرئ القرآن ويروي الحديث ولا يخرج من بيته إلا للصلاة، وكانت له كرامات. لما دخل الجامع يوم الجمعة التاسع من جمادى الأولى ٤٢٩ ضجّ الناس لرؤيته حتى ظن قوم أن الأذان للصلاة، وصعد ابن المذهب المنبر فقرأ أحاديث الرؤية فخطّأه ابن التميمي وصعد فقرأ أحاديث الصفات، فقال القزويني ما أراه إلا أن «القرآن كلام الله وأن الجدل بدعة والمتكلمين على ضلالة». وكتب اسمه تحت الاعتقاد القادري حين قرئ في الديوان سنة ٤٣٣ قبل الفقهاء. توفي في شعبان سنة اثنتين وأربعين وأربعمائة، وكان موتُه يومًا مشهودًا غُلقت فيه أسواق بغداد، وقال أبو علي البرداني حضره مائة ألف رجل؛ ووُجد بعد موته في روزنامجة أبي عبد الله السلماسي عشرة دنانير نفقة شهرية كانت تُرسل إليه {cite:muntazam-ibn-al-jawzi j.8 p.438-439,500,488-489,503-504}."
  en: "Baghdad's celebrated ascetic — born the night al-Ajurri died (early Muharram 360), 'one of God's great worshippers' who left home only for prayer. His arrival at the Friday mosque in 429 caused such a crush that worshippers rose for prayer by mistake, and from behind the maqsura's screen he declared that the Qur'an is God's speech, disputation an innovation and the mutakallimun astray; he subscribed al-Qadir's creed in the diwan before the jurists. His funeral in Sha'ban 442 closed Baghdad's markets — al-Bardani counted a hundred thousand men; after his death a ten-dinar monthly stipend from al-Salmasi was found recorded {cite:muntazam-ibn-al-jawzi j.8 p.488-489}."
