summary:
  ar: "زاهد بغداد المشهور؛ ولد مستهل محرم سنة ستين وثلاثمائة وهي الليلة التي توفي فيها أبو بكر الآجري، وسمع أبا حفص بن الزيات وابن حيويه وابن شاذان، وكان وافر العقل من كبار عباد الله الصالحين يقرئ القرآن ويروي الحديث ولا يخرج من بيته إلا للصلاة، وكانت له كرامات. لما دخل الجامع يوم الجمعة التاسع من جمادى الأولى ٤٢٩ ضجّ الناس لرؤيته حتى ظن قوم أن الأذان للصلاة، وصعد ابن المذهب المنبر فقرأ أحاديث الرؤية فخطّأه ابن التميمي وصعد فقرأ أحاديث الصفات، فقال القزويني ما أراه إلا أن «القرآن كلام الله وأن الجدل بدعة والمتكلمين على ضلالة». وكتب اسمه تحت الاعتقاد القادري حين قرئ في الديوان سنة ٤٣٣ قبل الفقهاء. توفي في شعبان سنة اثنتين وأربعين وأربعمائة، وكان موتُه يومًا مشهودًا غُلقت فيه أسواق بغداد، وقال أبو علي البرداني حضره مائة ألف رجل؛ ووُجد بعد موته في روزنامجة أبي عبد الله السلماسي عشرة دنانير نفقة شهرية كانت تُرسل إليه {cite:muntazam-ibn-al-jawzi j.8 p.438-439,500,488-489,503-504}."
  en: "Baghdad's celebrated ascetic — born the night al-Ajurri died (early Muharram 360), 'one of God's great worshippers' who left home only for prayer. His arrival at the Friday mosque in 429 caused such a crush that worshippers rose for prayer by mistake, and from behind the maqsura's screen he declared that the Qur'an is God's speech, disputation an innovation and the mutakallimun astray; he subscribed al-Qadir's creed in the diwan before the jurists. His funeral in Sha'ban 442 closed Baghdad's markets — al-Bardani counted a hundred thousand men; after his death a ten-dinar monthly stipend from al-Salmasi was found recorded {cite:muntazam-ibn-al-jawzi j.8 p.488-489}."
  es: "El célebre asceta de Bagdad, nacido la noche en que murió al-Ajurri (principios de Muharram 360), fue uno de los grandes adoradores de Dios y solo salía de casa para rezar. Su llegada a la mezquita del viernes en 429 provocó tal aglomeración que los fieles se levantaron para rezar por error, y desde detrás de la pantalla de la maqsura declaró que el Corán es la palabra de Dios, la disputa una innovación y los mutakallimun un extravío; se adhirió al credo de al-Qadir en el diwan ante los juristas. Su funeral en Sha'ban 442 cerró los mercados de Bagdad; al-Bardani contabilizó cien mil hombres; tras su muerte se encontró registrado un estipendio mensual de diez dinares de al-Salmasi {cite:muntazam-ibn-al-jawzi j.8 p.488-489}."
  fr: "Le célèbre ascète de Bagdad, né la nuit du décès d'al-Ajurri (début du mois de Muharram 360), était considéré comme un fervent adorateur de Dieu et ne quittait son domicile que pour la prière. Son arrivée à la mosquée du vendredi en 429 provoqua une telle cohue que les fidèles se levèrent par erreur pour la prière. Derrière le rideau de la maqsura, il déclara que le Coran est la parole de Dieu, la dispute une innovation et les mutakallimun égarés. Il souscrivit au credo d'al-Qadir au diwan, devant les juristes. Ses funérailles en Sha'ban 442 entraînèrent la fermeture des marchés de Bagdad – al-Bardani y compta cent mille hommes. Après sa mort, on découvrit la trace d'une rente mensuelle de dix dinars versée par al-Salmasi (cite: muntazam-ibn-al-jawzi j.8 p.488-489)."
  ur: "بغداد کے مشہور سنیاسی — پیدا ہونے والے شب الاجوری کی وفات ہوئی ⁦(محرم 360 کے اوائل)⁩، 'خدا کے عظیم عبادت گزاروں میں سے ایک' جو صرف نماز کے لیے گھر سے نکلا۔ 429 میں جمعہ کی مسجد میں ان کی آمد نے ایسا کرش پیدا کیا کہ نمازی غلطی سے نماز کے لیے اٹھ کھڑے ہوئے، اور مقصورہ کے پردے کے پیچھے سے اس نے اعلان کیا کہ قرآن خدا کا کلام ہے، اختلاف بدعت ہے اور متکلمین گمراہی ہے۔ اس نے فقہا کے سامنے دیوان میں القادر کے عقیدہ کو تسلیم کیا۔ شعبان 442 میں ان کے جنازے نے بغداد کے بازار بند کر دیے - البردانی نے ایک لاکھ آدمیوں کی گنتی کی۔ ان کی وفات کے بعد سلماسی کی طرف سے دس دینار ماہانہ وظیفہ درج کیا گیا {حوالہ:منتظم ابن الجوزی ج8 ص 488-489}۔"
  tr: "Bağdat'ın ünlü münzevi; Muharrem başında, 360 Hâm yılında, Ebu Bekir el-Ecri'nin öldüğü gece doğdu. Ebu Hafs ibn al-Zayyat, İbn Hayawayh ve İbn Şazan'ı dinledi. Zengin zekâya sahipti ve Allah'ın büyük doğru hizmetkarları arasındaydı. Kur'an okudu, hadisleri rivayet etti ve evinden sadece namaz için çıktı. Mucizeler yaşadı. 4299 Cuma günü, Cuma günü camiye girdiğinde, Cumada evvel'in dokuzuncusu, insanlar onu görmek için sabırsızlanıyordu, öyle ki bazıları ezan çağrısının namaz olduğunu sanıyordu. İbn el-Medhab kürsüye çıktı ve vizyon hadislerini okudu; İbn al-Temimi bu hadisleri hata yaptı ve yukarı çıktı ve sirafatların hadislerini okudu. El-Kazvini, 'Kur'an Allah'ın sözüdür ve bu tartışma bir yeniliktir, konuşanlar ise yanılmıştır.' dedi. Adı, 433 yılında Divan'da fâhiller önünde okunurken Kadiri inancı altında yazılmıştır. 442 Hicri yılında Şaban'da öldü. Ölümü, Bağdat pazarlarının kapalı olduğu önemli bir gündü. Ebu Ali el-Bardani, yüz bin adamın ona eşlik ettiğini söyledi; ölümünden sonra, Abu Abdullah el-Selmasi'nin günlüğünde aylık on dinar para buldu ve bu harçlık kendisine gönderildi {citasyon:Muntazam-ibn-al-Jawzi j.8 s.438-439,500,488,489,503-504}."
  id: "Pertapa terkenal Baghdad; ia lahir pada awal Muharram tahun 360 H, malam Abu Bakr al-Ajri wafat. Ia mendengar Abu Hafs ibn al-Zayyat, Ibn Hayawayh, dan Ibn Shadhan. Ia memiliki intelek yang melimpah dan termasuk para hamba Allah yang agung. Ia membaca Al-Qur'an, menceritakan hadis, dan tidak pernah meninggalkan rumah kecuali untuk shalat. Ia melakukan mukjizat. Ketika ia memasuki masjid pada hari Jumat, tanggal sembilan Jumada al-Awwal 422 9, orang-orang sangat ingin bertemu dengannya, sampai-sampai beberapa mengira panggilan salat itu untuk shalat. Ibn al-Madhhab naik ke mimbar dan membacakan hadis penglihatan, yang salah Ibn al-Tamimi dan naik untuk melafalkan hadis sifat-sifat. Al-Qazwini berkata, 'Al-Qur'an adalah firman Tuhan, dan perdebatan itu adalah inovasi, dan mereka yang berbicara salah arah.' Namanya ditulis di bawah kredo Qadiri ketika ia dibacakan dalam Diwan pada tahun 433 di hadapan para ahli hukum. Ia meninggal di Sha'ban pada tahun 442 H. Kematiannya adalah hari penting ketika pasar-pasar Baghdad ditutup. Abu Ali al-Bardani mengatakan seratus ribu orang menghadirinya; setelah kematiannya, ia menemukan dalam buku harian Abu Abdullah al-Salmasi, sepuluh dinar sebagai tunjangan bulanan yang dikirimkan kepadanya {cite:muntazam-ibn-al-jawzi j.8 hlm.438-439.500.488.489.503-504}."
