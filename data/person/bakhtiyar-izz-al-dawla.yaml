id: person/bakhtiyar-izz-al-dawla
class: person
label: { ar: "بختيار عز الدولة بن معز الدولة" }
summary:
  ar: "ابن معز الدولة أحمد بن بويه، أقيم مكان أبيه في السلطنة لما مات سنة ست وخمسين ولقبه المطيع عز الدولة، وصادر المطيع سنة اثنتين وستين فقال أنا ليس لي غير الخطبة فإن أحببتم اعتزلت فشدد عليه حتى باع قماشه وحمل أربع مئة ألف درهم وشاع في الألسنة أن الخليفة صودر {cite:tarikh-khulafa-minhaj-1434 p. 620-621}. وعند ابن الأثير أوصى له أبوه معز الدولة بالأمر عند موته سنة 356هـ فجلس في الإمارة، وخرج الناس إليه ثلاثة أيام بلياليها معترضين متضرعين منعهم من الكلمة فأرضاهم وأظهر العدل فسكنوا {cite:kamil-ibn-al-athir p. 424-425}، وعند ابن الأثير نكث عهده لعضد الدولة وقصد الموصل فالتقوا بقصر الحصى بنواحي تكريت ثامن عشر شوال سنة 367هـ فهُزم وأسر وأحضر عند عضد الدولة فلم يأذن بإدخاله وأمر بقتله وكان عمره إحدى وثلاثين سنة وملك إحدى عشرة سنة وشهوراً {cite:kamil-ibn-al-athir p. 506-507}"
  en: "Mu'izz al-Dawla's son, installed on his father's death in 356 and titled Izz al-Dawla by al-Muti'; in 362 he confiscated the caliph, who said 'I have nothing but the khutba — if you wish, I withdraw', and was pressed till he sold his cloth for four hundred thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
