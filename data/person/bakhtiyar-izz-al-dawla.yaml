id: person/bakhtiyar-izz-al-dawla
class: person
label: { ar: "بختيار عز الدولة بن معز الدولة" }
summary:
  ar: "ابن معز الدولة أحمد بن بويه، أقيم مكان أبيه في السلطنة لما مات سنة ست وخمسين ولقبه المطيع عز الدولة، وصادر المطيع سنة اثنتين وستين فقال أنا ليس لي غير الخطبة فإن أحببتم اعتزلت فشدد عليه حتى باع قماشه وحمل أربع مئة ألف درهم وشاع في الألسنة أن الخليفة صودر {cite:tarikh-khulafa-minhaj-1434 p. 620-621}. وعند ابن الأثير أوصى له أبوه معز الدولة بالأمر عند موته سنة 356هـ فجلس في الإمارة، وخرج الناس إليه ثلاثة أيام بلياليها معترضين متضرعين منعهم من الكلمة فأرضاهم وأظهر العدل فسكنوا {cite:kamil-ibn-al-athir p. 424-425}، وعند ابن الأثير نكث عهده لعضد الدولة وقصد الموصل فالتقوا بقصر الحصى بنواحي تكريت ثامن عشر شوال سنة 367هـ فهُزم وأسر وأحضر عند عضد الدولة فلم يأذن بإدخاله وأمر بقتله وكان عمره إحدى وثلاثين سنة وملك إحدى عشرة سنة وشهوراً {cite:kamil-ibn-al-athir p. 506-507}"
  en: "Mu'izz al-Dawla's son, installed on his father's death in 356 and titled Izz al-Dawla by al-Muti'; in 362 he confiscated the caliph, who said 'I have nothing but the khutba — if you wish, I withdraw', and was pressed till he sold his cloth for four hundred thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  es: "El hijo de Mu'izz al-Dawla, instalado tras la muerte de su padre en 356 y titulado Izz al-Dawla por al-Muti'; en 362 confiscó al califa, quien dijo 'No tengo nada más que la jutba; si lo desea, me retiro', y fue presionado hasta que vendió su tela por cuatrocientos mil dirhams {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  fr: "Le fils de Mu'izz al-Dawla, installé à la mort de son père en 356 et titré Izz al-Dawla par al-Muti'; en 362, il confisqua le calife, qui dit 'Je n'ai rien d'autre que le khutba - si vous le souhaitez, je me retire', et fut pressé jusqu'à ce qu'il vende son tissu pour quatre cent mille dirhams {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  ur: "معیز الدولہ کا بیٹا، جو اپنے والد کی وفات پر 356 میں نصب کیا گیا تھا اور اسے الموطی کی طرف سے عز الدولہ کا لقب دیا گیا تھا۔ 362 میں اس نے خلیفہ کو ضبط کر لیا، جس نے کہا کہ 'میرے پاس خطبہ کے علاوہ کچھ نہیں ہے - اگر آپ چاہیں تو میں واپس لے لیتا ہوں'، اور اس وقت تک دبایا گیا جب تک کہ اس نے اپنا کپڑا چار لاکھ درہم میں فروخت نہ کر دیا۔ 620-621}۔"
  tr: "İbn Mu'izz al-Dawla Ahmed bin Buyah, babası 56 Hicri yılında öldüğünde onun yerine sultanlığa atandı. El-Muti'ye 'İzz-Davla' unvanı verildi. El-Muti' 1962'de 'Nişandan başka bir şeyim yok, istersen emekli olurum.' diyerek el konuldu. Kumaşını satıp dört yüz bin dirhem taşıyana kadar katıydı. Halifenin {cit:History-Khulafa-minhaj-1434, s. 620-621} el koyduğu söylentileri vardı. İbn al-Athir'e göre, babası Mu'izz al-Dawla, 356 H.C. ölümünde bu işi ona emanet etmiş, bu yüzden emirlikte kalmıştır. İnsanlar üç gün gece boyunca ona karşı çıkıp konuşmalarını engellemek için yalvarırlardı. O onları tatmin etti ve adaleti gösterdi, böylece anlaşmaya vardılar {cite:kamil-ibn-al-athir s. 424-425}. İbn al-Athir, Adud al-Dawla'ya verdiği sözü bozdu ve Musul'a gitti. 367 H.Hicri'nin on sekizinde Tikrit yakınlarında Kasr al-Husa ile karşılaştılar; burada yenildi, yakalandı ve Adud al-Dawla'nın önüne getirildi, ancak kabul edilmedi ve öldürülmesi emredildi. Otuz bir yaşındaydı ve on bir yıl ve ay hüküm sürdü. {cite:kamil-ibn-al-Athir s. 506-507}"
  id: "Ibn Mu'izz al-Dawla Ahmad ibn Buyah diangkat menggantikan ayahnya di kesultanan ketika ia meninggal pada tahun 56 H. Al-Muti' diberi gelar 'Izz al-Dawla.' Al-Muti' disita pada tahun 1962, dengan berkata, 'Saya tidak punya apa-apa selain perjanjian, dan jika Anda mau, saya akan pensiun.' Ia tegas hingga menjual pakaiannya dan membawa empat ratus ribu dirham. Beredar rumor bahwa khalifah menyita {cite:History-Khulafa-minhaj-1434, hlm. 620-621}. Menurut Ibn al-Athir, ayahnya Mu'izz al-Dawla mempercayakan urusan ini kepadanya setelah kematiannya pada tahun 356 H, sehingga ia tetap tinggal di emirat. Orang-orang pergi menemuinya selama tiga hari dan tiga malam, menolak dan memohon agar dilarang berbicara. Ia memuaskan mereka dan menunjukkan keadilan, sehingga mereka menyelesaikan {cite:kamil-ibn-al-athir hlm. 424-425}. Ibn al-Athir melanggar janjinya kepada Adud al-Dawla dan pergi ke Mosul. Mereka bertemu Qasr al-Husa dekat Tikrit pada tanggal delapan belas Shawwal 367 H, di mana ia dikalahkan, ditangkap, dan dibawa ke hadapan Adud al-Dawla, tetapi ia tidak diizinkan untuk diterima dan diperintahkan untuk dibunuh. Ia berusia tiga puluh satu tahun dan memerintah selama sebelas tahun dan bulan. {cite:kamil-ibn-al-athir hlm. 506-507}"
