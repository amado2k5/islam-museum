  ur: "مرزا غلام احمد"
roles: [religious leader]
gender: male
summary:
  ar: "أحمد بن مرتضى بن محمد القادياني المعروف بميرزا غلام أحمد، هندي من قاديان بالبنجاب، يصفه الزركلي بأنه زعيم القاديانية ومؤسس نحلتهم، ادعى أنه المجدد ثم المهدي ثم المسيح الموعود، وله كتب بالعربية والأردية؛ توفي سنة 1326 هـ الموافقة 1908 م."
  en: "Ahmad ibn Murtada ibn Muhammad al-Qadiani, known as Mirza Ghulam Ahmad, an Indian of Qadian in the Punjab, described by al-Zirikli as leader of the Qadianis and founder of their sect; he claimed to be the renewer, then the Mahdi, then the promised Messiah, and wrote in Arabic and Urdu; died 1326 AH (1908)."
  es: "Ahmad ibn Murtada ibn Muhammad al-Qadiani, conocido como Mirza Ghulam Ahmad, un indio de Qadian en el Punjab, descrito por al-Zirikli como líder de los Qadianis y fundador de su secta; afirmó ser el renovador, luego el Mahdi, luego el Mesías prometido, y escribió en árabe y urdu; murió en 1326 AH (1908)."
  fr: "Ahmad ibn Murtada ibn Muhammad al-Qadiani, connu sous le nom de Mirza Ghulam Ahmad, un Indien de Qadian au Pendjab, décrit par al-Zirikli comme le chef des Qadianis et le fondateur de leur secte; il prétendait être le rénovateur, puis le Mahdi, puis le Messie promis, et écrivait en arabe et en ourdou; mort en 1326 AH (1908)."
  ur: "احمد بن مرتضیٰ ابن محمد القدیانی، جسے مرزا غلام احمد کے نام سے جانا جاتا ہے، پنجاب میں قادیان کا ایک ہندوستانی، جسے الزرکلی نے قادیانیوں کا رہنما اور ان کے فرقے کا بانی قرار دیا ہے۔ اس نے تجدید کرنے والا، پھر مہدی، پھر وعدہ شدہ مسیح ہونے کا دعویٰ کیا، اور عربی اور اردو میں لکھا؛ وفات 1326ھ (1908)۔"
