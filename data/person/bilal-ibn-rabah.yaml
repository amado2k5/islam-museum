    ar: "بلال بن رباح حبشي المولد من السابقين إلى الإسلام، أعتقه أبو بكر ويذكره التراث أول مؤذن في الإسلام."
    en: "Bilal ibn Rabah, born an Abyssinian slave in Mecca, was among the earliest Muslims; Abu Bakr freed him and tradition names him Islam's first muezzin."
