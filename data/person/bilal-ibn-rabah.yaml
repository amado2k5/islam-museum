summary:
  ar: "عبد حبشي المولد في مكة، من السابقين إلى الإسلام؛ أعتقه أبو بكر، ويذكره التراث أول مؤذن في الإسلام — الصوت الذي نادى الجماعة إلى الصلاة. وتصفه دائرة المعارف الإسلامية بأنه صحابي اشتهر بكونه مؤذن النبي، وتذكر أنه حمل عصاه وكان خازنه وخادمه ومعاونه أحيانًا، وأنه نادى إلى الصلاة من سطح الكعبة حين فُتحت مكة. ثم أمضى بقية حياته في الشام، وتختلف الأقوال في سنة وفاته بين 17 و21هـ، ويُرجَّح أنه دُفن في دمشق أو داريا. وعند المسعودي عدّه قوم ثاني من أسلم بعد أبي بكر الصديق في أحد أقوال أول من أسلم {cite:muruj-al-dhahab p. 575}. وفي الصحيح قال له النبي «يا بلال حدثني بأرجى عمل عملته في الإسلام فإني سمعت دف نعليك بين يدي في الجنة» فقال ما عملت عملاً أرجى عندي أني ما تطهرت طهوراً في ساعة ليل أو نهار إلا صليت بذلك الطهور ما كُتب لي أن أصلي {cite:sahih-al-bukhari 1149}، وللحديث رواية في مسلم بلفظ «خشف نعليك بين يدي في الجنة» {cite:sahih-muslim 2458}. ويذكر أسد الغابة في ترجمة بلال رقم ٤٩٣ أنه ممن عدّهم مجاهد في سبعة أظهروا الإسلام بمكة، وأنه توفي بدمشق ودفن بباب الصغير سنة عشرين على قول محمد بن سعد {cite:usd-ghaba p.131}."
  en: "An Abyssinian-born slave in Mecca, among the earliest converts; freed by Abu Bakr and remembered as the first muezzin of Islam, the voice that called the community to prayer. The Encyclopaedia of Islam describes him as a Companion best known as the Prophet's muezzin, who also served as his mace-bearer, steward, personal servant and at times adjutant, and who called to prayer from the roof of the Kaaba when Mecca fell. He spent the rest of his life in Syria; the article gives his death date variously between 17 and 21 AH and names Damascus or Darayya as the more likely burial place. Usd al-Ghaba's entry on Bilal (no. 493) counts him among the seven Mujahid named as the first to declare Islam openly in Mecca, and records Muhammad ibn Sa'd's report that he died in Damascus and was buried at Bab al-Saghir in year 20 {cite:usd-ghaba p.131}."
  ur: "مکہ میں غلامی کی حالت سے اسلام قبول کرنے والے ابتدائی مسلمانوں میں سے؛ ابو بکر نے انہیں آزاد کیا اور وہ اسلام کے پہلے مؤذن کے طور پر معروف ہوئے۔ {cite:ibn-sad-tabaqat-bewley} اسلامی انسائیکلو پیڈیا انہیں نبی کے مؤذن کے طور پر مشہور صحابی بتاتی ہے، جو ان کے عصا بردار، خازن، خادم اور کبھی معاون بھی تھے، اور جنہوں نے فتحِ مکہ پر کعبہ کی چھت سے اذان دی۔ انہوں نے باقی زندگی شام میں گزاری، اور مضمون ان کی وفات کی تاریخ 17 سے 21ھ کے درمیان مختلف بتاتا ہے اور تدفین کے لیے دمشق یا داریا کو زیادہ قرین قیاس کہتا ہے۔"
