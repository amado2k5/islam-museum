summary:
  en: "An Abyssinian-born slave in Mecca, among the earliest converts; freed by Abu Bakr and remembered as the first muezzin of Islam — the voice that called the community to prayer."
  ar: "عبد حبشي المولد في مكة، من السابقين إلى الإسلام؛ أعتقه أبو بكر، ويذكره التراث أول مؤذن في الإسلام — الصوت الذي نادى الجماعة إلى الصلاة. وعند المسعودي عدّه قوم ثاني من أسلم بعد أبي بكر الصديق في أحد أقوال أول من أسلم {cite:muruj-al-dhahab p. 575}. وفي الصحيح قال له النبي «يا بلال حدثني بأرجى عمل عملته في الإسلام فإني سمعت دف نعليك بين يدي في الجنة» فقال ما عملت عملاً أرجى عندي أني ما تطهرت طهوراً في ساعة ليل أو نهار إلا صليت بذلك الطهور ما كُتب لي أن أصلي {cite:sahih-al-bukhari 1149}، وللحديث رواية في مسلم بلفظ «خشف نعليك بين يدي في الجنة» {cite:sahih-muslim 2458}."
