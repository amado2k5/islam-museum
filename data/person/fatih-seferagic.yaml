summary:
  ar: "قارئ قرآن ومعلّم بوسني أمريكي وُلد في ألمانيا سنة 1995. نشأ في الولايات المتحدة وحفظ القرآن في الثالثة عشرة في الجمعية الإسلامية ببالتيمور، ودرس العربية في دالاس، ويقيم في هيوستن حيث يعلّم الأطفال تلاوة القرآن وحفظه ويجول في العالم للتعليم والتلاوة؛ وقد حصدت تسجيلات تلاوته عشرات الملايين من المشاهدات."
  en: "Bosnian-American Qur'an reciter and teacher born in Germany in 1995. Raised in the United States, he completed memorising the Qur'an at thirteen at the Islamic Society of Baltimore, studied Arabic in Dallas, and now lives in Houston, where he teaches children Qur'an recitation and memorisation and tours the world teaching and reciting; his recitation recordings have drawn tens of millions of views."
  ur: "بوسنیائی نژاد امریکی قاریِ قرآن اور معلم، جو 1995ء میں جرمنی میں پیدا ہوئے۔ وہ امریکا میں پلے بڑھے اور تیرہ سال کی عمر میں بالٹی مور کی اسلامک سوسائٹی میں قرآن حفظ مکمل کیا، ڈیلاس میں عربی کی تعلیم حاصل کی، اور اب ہیوسٹن میں مقیم ہیں جہاں وہ بچوں کو تلاوت و حفظِ قرآن سکھاتے ہیں اور تعلیم و تلاوت کے لیے دنیا کا سفر کرتے ہیں؛ ان کی تلاوت کی ریکارڈنگز کروڑوں بار دیکھی جا چکی ہیں۔"
