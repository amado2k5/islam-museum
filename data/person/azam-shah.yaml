summary:
  ar: "بطاقة أولية لأعظم شاه، ابن أورنك زيب الذي بويع خليفة ثم قُتل في جاجو سنة 1707، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Azam Shah, son of Aurangzeb acclaimed emperor then killed at Jajau in 1707, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador de Azam Shah, hijo de Aurangzeb, aclamado emperador y luego asesinado en Jajau en 1707, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche d'identité d'Azam Shah, fils d'Aurangzeb, empereur acclamé puis tué à Jajau en 1707, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "اورنگ زیب کے بیٹے اعظم شاہ کے لیے ڈرافٹ کارڈ، جو 1707 میں جاجو میں مارا گیا تھا، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا ہے۔ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
