summary:
  ar: "إبراهيم بن يسار المعتزلي من نظار البصريين، قال في مجلس يحيى إن العشق أرق من السراب وأدب من الشراب وهو من طينة عطرة عجنت في إناء الجلالة حلو المجتنى ما اقتصد فإذا أفرط عاد خبلاً قاتلاً {cite:muruj-al-dhahab p. 358-359}. وهو إبراهيم بن سيار بن هانئ النظام يكنى أبا إسحاق كان متكلما شاعرا أديبا وكان يتعنف أبا نواس وله فيه عدة مقطعات وإياه عنى أبو نواس بقوله فقل لمن يدعي في العلم فلسفة حفظت شيئا وغابت عنك أشياء، وذلك أنه كان يدعوه إلى القول بالوعيد فيأبى عليه {cite:fihrist-ibn-al-nadim p. 526}"
  en: "Ibrahim ibn Sayyar the Mu'tazili — 'finer than mirage, subtler than wine' — whose dosed-love definition closed the named speakers {cite:muruj-al-dhahab p. 358-359}."
