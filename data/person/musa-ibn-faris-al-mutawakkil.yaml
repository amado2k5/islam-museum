summary:
  ar: "موسى بن فارس بن علي المريني، أبو فارس المتوكل على الله، من ملوك الدولة المرينية بالمغرب الأقصى، من أبناء الملوك المبعدين إلى الأندلس، جهزه الغني بالله ابن الأحمر فانتزع فاس وبويع سنة ٧٨٦هـ وسمه من دسه له الوزير ابن ماساي، وتوفي سنة ٧٨٨هـ الموافقة ١٣٨٦م."
  en: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, a king of the Marinid state in the far Maghrib, one of the sons of the kings exiled to al-Andalus; equipped by al-Ghani billah ibn al-Ahmar, he took Fez, was pledged allegiance in 786 AH and was poisoned at the instigation of his vizier Ibn Masay; he died in 788 AH, 1386 CE."
