roles: [ruler]
gender: male
summary:
  ar: "موسى بن فارس بن علي المريني، أبو فارس المتوكل على الله، من ملوك الدولة المرينية بالمغرب الأقصى، من أبناء الملوك المبعدين إلى الأندلس، جهزه الغني بالله ابن الأحمر فانتزع فاس وبويع سنة ٧٨٦هـ وسمه من دسه له الوزير ابن ماساي، وتوفي سنة ٧٨٨هـ الموافقة ١٣٨٦م."
  en: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, a king of the Marinid state in the far Maghrib, one of the sons of the kings exiled to al-Andalus; equipped by al-Ghani billah ibn al-Ahmar, he took Fez, was pledged allegiance in 786 AH and was poisoned at the instigation of his vizier Ibn Masay; he died in 788 AH, 1386 CE."
  es: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, rey del estado mariní en el Magreb lejano, uno de los hijos de los reyes exiliados a al-Ándalus; equipado por al-Ghani billah ibn al-Ahmar, tomó Fez, juró lealtad en 786 AH y fue envenenado por instigación de su visir Ibn Masay; murió en 788 AH, 1386 CE."
  fr: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, roi de l'État mérinide du Maghreb lointain, l'un des fils des rois exilés en al-Andalus; équipé par al-Ghani billah ibn al-Ahmar, il prit Fès, prêta allégeance en 786 AH et fut empoisonné à l'instigation de son vizir Ibn Masay; il mourut en 788 AH, 1386 CE."
  ur: "موسیٰ بن فارس ابن علی المرینی، ابو فارس المتوکل الا اللہ، دور مغرب میں مرینی ریاست کا ایک بادشاہ، اندلس میں جلاوطن بادشاہوں کے بیٹوں میں سے ایک؛ الغنی باللہ ابن الاحمر سے لیس ہو کر، اس نے فیز لیا، 786 ہجری میں بیعت کی اور اپنے وزیر ابن مساعی کے اکسانے پر اسے زہر دے دیا گیا۔ آپ کی وفات 788ھ بمطابق 1386ء میں ہوئی۔"
  tr: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, uzak Mağrip'teki Marinid hanedanının krallarından biriydi ve Endülüs'e sürgün edilen kralların soyundan geliyordu. 786 Hicri yılında Fes'i ele geçiren ve bağlılık yemini eden el-Ghani Billah ibn al-Ahmar tarafından hazırlandı. Kendisini sızdıran bakan İbn Masai tarafından atandı. 788 Hicri'de, yani 1386 M.S. yılında öldü."
  id: "Musa ibn Faris ibn Ali al-Marini, Abu Faris al-Mutawakkil 'ala Allah, adalah salah satu raja dinasti Marinid di Maghreb jauh, keturunan raja-raja yang diasingkan ke al-Andalus. Ia dipersiapkan oleh al-Ghani Billah ibn al-Ahmar, yang merebut Fez dan bersumpah setia pada tahun 786 H. Ia ditunjuk oleh menteri Ibn Masai yang telah menunjuknya sebagai penyusupnya. Ia meninggal pada tahun 788 H, setara dengan tahun 1386 M."
