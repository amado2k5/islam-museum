  ar: "عبد الرحمن بن جزء الطائي؛ بعثه علي بن أبي طالب إلى سجستان فقتله حسكة بن عتاب الحبطي فقال علي لأقتلن من الحبطات أربعة آلاف فقيل له إن الحبطات لا تكون خمسمائة."
  en: "Abd al-Rahman ibn Jaza' al-Ta'i; Ali's envoy to Sijistan, killed by Hasaka ibn Utab — Ali swore to kill four thousand of the Habata, and was told they were not even five hundred."
