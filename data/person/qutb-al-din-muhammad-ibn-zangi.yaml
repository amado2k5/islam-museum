class: person
label: { ar: "قطب الدين محمد بن زنكي", en: "Qutb al-Din Muhammad ibn Zangi", es: "Qutb al-Din Muhammad ibn Zangi", fr: "Qutb al-Din Muhammad ibn Zangi", ur: "قطب الدین محمد ابن زنگی۔" }
summary:
  ar: "قطب الدين محمد بن عماد الدين زنكي؛ صاحب سنجار؛ ملك بعد أبيه وتولى تدبير دولته مجاهد الدين قرنقش مملوك أبيه؛ وكان ديّناً خيراً عادلاً حسن السيرة كثير البر والإحسان للفقراء إلا أنه كان شديد التعصب على مذهب الإمام الشافعي كثير الذم للشافعية — وكان حنبلياً — فمن تعصبه أنه بنى مدرسة للحنفية بسنجار وشرط أن يكون النظر للحنفية من أولاده دون الشافعية وأن يكون المؤذن والفراش على مذهب أبي حنيفة {cite:wafayat-ayan}."
  en: "Qutb al-Din Muhammad b. Imad al-Din Zangi — Zangid lord of Sinjar after his father; governed through his father's mamluk Mujahid al-Din Qarnqash; pious and generous but a zealous Hanbali who endowed a Hanafi-only madrasa at Sinjar {cite:wafayat-ayan}."
  es: "Qutb al-Din Muhammad b. Imad al-Din Zangi — Señor zangi de Sinjar después de su padre; gobernado a través del mameluco de su padre, Mujahid al-Din Qarnqash; piadoso y generoso, pero un hanbalí celoso que dotó una madrasa exclusivamente hanafi en Sinjar {cite:wafayat-ayan}."
  fr: "Qutb al-Din Muhammad b. Imad al-Din Zangi — Seigneur zangide de Sinjar après son père; gouverna par l'intermédiaire du mamelouk de son père, Mujahid al-Din Qarnqash; pieux et généreux, mais un hanbalite zélé qui dota une madrasa exclusivement hanafite à Sinjar {cite:wafayat-ayan}."
  ur: "قطب الدین محمد ب۔ عماد الدین زنگی - اپنے والد کے بعد سنجار کا زنگید سردار؛ اپنے والد کے مملوک مجاہد الدین قرنقاش کے ذریعے حکومت کی۔ متقی اور سخی لیکن ایک پرجوش حنبلی جس نے سنجار میں حنفی کے صرف مدرسے کو عطا کیا۔"
  tr: "Sinjar'ın hükümdarı Qutb al-Din Muhammed bin İmadeddin Zangi, babasından sonra hüküm sürdü ve babasının memlüğü Mücahiddin Karnakş devletini yönetti. O, doğru, adil ve erdemli bir din adamıydı; yoksullara karşı çok iyilik ve iyilik gösterdi. Ancak Şafii okuluna derin fanatikti ve sık sık Şafiileri eleştirdi—üstelik kendisi bir Hanbali adamıydı. Fanatizmi arasında, Sinjar'da bir Hanefi okulu kurdu; ancak Hanefi okulunun kendi çocuklarından yapılması ve müezzin ile yatak hastalarının Ebu Hanife okulunu takip etmesi şartı vardı."
  id: "Qutb al-Din Muhammad ibn Imad al-Din Zangi, penguasa Sinjar, memerintah setelah ayahnya, dan Mujahid al-Din Qarnaksh, mamluk ayahnya, mengelola negaranya. Ia adalah seorang penganut agama yang benar, adil, dan berbudi luhur, dengan banyak kebaikan dan kebaikan kepada orang miskin. Namun, ia sangat fanatik terhadap mazhab Shafi'i dan sering mengkritik para Shafi'i—dan ia adalah orang Hanbali. Di antara fanatismenya, ia mendirikan sekolah Hanafi di Sinjar, dengan syarat bahwa sekolah Hanafi berasal dari anak-anaknya sendiri, bukan dari para Shafi'i, dan muezzin serta yang terbaring di tempat tidur mengikuti aliran Abu Hanifa {cite:wafayat-ayan}."
