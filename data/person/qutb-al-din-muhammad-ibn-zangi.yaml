summary:
  ar: "قطب الدين محمد بن عماد الدين زنكي؛ صاحب سنجار؛ ملك بعد أبيه وتولى تدبير دولته مجاهد الدين قرنقش مملوك أبيه؛ وكان ديّناً خيراً عادلاً حسن السيرة كثير البر والإحسان للفقراء إلا أنه كان شديد التعصب على مذهب الإمام الشافعي كثير الذم للشافعية — وكان حنبلياً — فمن تعصبه أنه بنى مدرسة للحنفية بسنجار وشرط أن يكون النظر للحنفية من أولاده دون الشافعية وأن يكون المؤذن والفراش على مذهب أبي حنيفة {cite:wafayat-ayan}."
  en: "Qutb al-Din Muhammad b. Imad al-Din Zangi — Zangid lord of Sinjar after his father; governed through his father's mamluk Mujahid al-Din Qarnqash; pious and generous but a zealous Hanbali who endowed a Hanafi-only madrasa at Sinjar {cite:wafayat-ayan}."
