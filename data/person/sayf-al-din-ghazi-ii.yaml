summary:
  ar: "السلطان سيف الدين غازي صاحب الموصل ابن قطب الدين مودود بن أتابك زنكي؛ توفي في صفر سنة ست وسبعين وخمسمائة بعلة السل وله ثلاثون سنة، وكان شاباً مليحاً أبيض طويلاً عاقلاً وقوراً قليل الظلم قليل سفك الدماء وقال ابن شهبة كان من أحسن الناس صورة غيوراً طاهر اللسان عفيفاً عن أموال الناس؛ ومن عجائبه أن الخواطين ببعض بلاده أبطأ عنهن المطر فاستسقى الناس وهو معهم فلما لم يستجب لهم قالوا ليف ليستجب لنا وفينا الخور والخواطين فرجعوا وفيهم أبو الفرج الدقاق الرجل الصالح فأراق الماء ونهبت العامة دكاكين الخواتين فاستدعى الدقاق إلى القلعة وضربه على رأسه فانكشف وأبى أن يغطيه حتى ينتقم الله له فمات الضارب بعد قليل ومرض سيف الدين وتوفي {cite:shadharat-dhahab p. 737-738}."
  en: "Sultan Sayf al-Din Ghazi II of Mosul, son of Qutb al-Din Mawdud ibn Atabeg Zangi; d. Safar 576 of consumption at thirty — handsome, dignified, little given to injustice or bloodshed; Ibn Shihna calls him 'one of the finest-looking of men, jealous, clean-tongued'; the strange tale has the pious Abu al-Faraj al-Daqqaq refusing to cover his broken head 'till God avenge me' — the striker dying soon after and Sayf al-Din falling ill and dying {cite:shadharat-dhahab p. 737-738}."
