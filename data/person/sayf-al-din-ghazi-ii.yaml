summary:
  ar: "السلطان سيف الدين غازي صاحب الموصل ابن قطب الدين مودود بن أتابك زنكي؛ توفي في صفر سنة ست وسبعين وخمسمائة بعلة السل وله ثلاثون سنة، وكان شاباً مليحاً أبيض طويلاً عاقلاً وقوراً قليل الظلم قليل سفك الدماء وقال ابن شهبة كان من أحسن الناس صورة غيوراً طاهر اللسان عفيفاً عن أموال الناس؛ ومن عجائبه أن الخواطين ببعض بلاده أبطأ عنهن المطر فاستسقى الناس وهو معهم فلما لم يستجب لهم قالوا ليف ليستجب لنا وفينا الخور والخواطين فرجعوا وفيهم أبو الفرج الدقاق الرجل الصالح فأراق الماء ونهبت العامة دكاكين الخواتين فاستدعى الدقاق إلى القلعة وضربه على رأسه فانكشف وأبى أن يغطيه حتى ينتقم الله له فمات الضارب بعد قليل ومرض سيف الدين وتوفي {cite:shadharat-dhahab p. 737-738}."
  en: "Sultan Sayf al-Din Ghazi II of Mosul, son of Qutb al-Din Mawdud ibn Atabeg Zangi; d. Safar 576 of consumption at thirty — handsome, dignified, little given to injustice or bloodshed; Ibn Shihna calls him 'one of the finest-looking of men, jealous, clean-tongued'; the strange tale has the pious Abu al-Faraj al-Daqqaq refusing to cover his broken head 'till God avenge me' — the striker dying soon after and Sayf al-Din falling ill and dying {cite:shadharat-dhahab p. 737-738}."
  ur: "موصل کا زنگی اتابک؛ اس کے اقتدار کا تعلق موصل، حلب اور سنجار میں زنگی حکومت اور جانشینی کی کشمکش سے تھا۔ {cite:shadharat-dhahab}"
  es: "Sultán Sayf al-Din Ghazi II de Mosul, hijo de Qutb al-Din Mawdud ibn Atabeg Zangi; murió en Safar 576 de tuberculosis a los treinta años; era guapo, digno, poco dado a la injusticia o al derramamiento de sangre; Ibn Shihna lo llama \"uno de los hombres más apuestos, celoso, de lengua limpia\"; la extraña historia cuenta que el piadoso Abu al-Faraj al-Daqqaq se negó a cubrir su cabeza rota \"hasta que Dios me vengue\"; el atacante murió poco después y Sayf al-Din enfermó y murió {cita: shadharat-dhahab pág. 737-738}."
  fr: "Le sultan Sayf al-Din Ghazi II de Mossoul, fils de Qutb al-Din Mawdud ibn Atabeg Zangi, décéda de tuberculose à l'âge de trente ans en l'an 576 du mois de Safar. Beau, digne, peu enclin à l'injustice ou à l'effusion de sang, il était décrit par Ibn Shihna comme « l'un des plus beaux hommes, jaloux et à la langue bien pendue ». Selon une étrange anecdote, le pieux Abu al-Faraj al-Daqqaq refusa de se couvrir la tête fracturée « jusqu'à ce que Dieu me venge ». Le sultan mourut peu après, et Sayf al-Din tomba malade et mourut à son tour (voir: shadharat-dhahab, p. 737-738)."
  tr: "Musul hükümdarı Sultan Saif al-Din Ghazi, Kutbeddin Mevdud ibn Atabeg Zangi'nin oğlu; 576 Hicri yılında Sefer'de otuz yaşında veremden öldü. Yakışıklı, beyaz, uzun boylu, zeki, onurlu, az haksızlık ve az kan döken bir adamdı. İbn Şahba, onun en iyi insanlardan biri olduğunu, gayretli, saf dilli, iffetli ve halkın servetine bağlı olduğunu söyledi; mucizelerinden biri, bazı topraklarında kötü niyetli olanların yağmurdan daha yavaş olmasıydı, bu yüzden halkla birlikteyken onlardan yağmur istedi. Cevap vermeyince, 'Yaprak, dere varken bize cevap versin.' dediler. Kız kardeşler geri döndü, aralarında doğru adam olan Ebu el-Faraj el-Daqaq da vardı. Su döktü ve Khawateen tüccarlarının dükkanlarını yağmaladı. El-Daqaq'ı kaleye çağırdı ve başına vurdu, ancak Allah intikamını alana kadar onu örtmeyi reddetti. Saldırgan kısa süre sonra öldü ve Seyf Din hastalanıp öldü {atıf:shadharat-dhahab, s. 737-738}."
  id: "Sultan Saif al-Din Ghazi, penguasa Mosul, putra Qutb al-Din Mawdud ibn Atabeg Zangi; ia meninggal di Safar pada tahun 576 H karena tuberkulosis pada usia tiga puluh tahun. Ia adalah pria tampan, kulit putih, tinggi, cerdas, bermartabat, dengan sedikit ketidakadilan dan sedikit pertumpahan darah. Ibn Shahba mengatakan bahwa ia termasuk di antara orang terbaik, bersemangat, berbahasa murni, suci, dan berbakti pada kekayaan rakyat; di antara keajaibannya adalah bahwa orang-orang yang berniat jahat di beberapa negerinya lebih lambat daripada hujan, sehingga ia meminta hujan dari rakyat saat bersama mereka. Ketika ia tidak menjawab, mereka berkata, 'Daun, semoga Ia membalas kami saat kami masih di sungai kecil.' Para suster kembali, termasuk Abu al-Faraj al-Daqqaq, orang yang benar. Ia menuangkan air dan menjarah toko-toko pedagang Khawateen. Ia memanggil al-Daqaq ke benteng dan memukul kepalanya, tetapi ia menolak menutupinya sampai Tuhan membalas dendamnya. Penyerang meninggal tak lama kemudian, dan Saif al-Din jatuh sakit dan meninggal {cite:shadharat-dhahab, hlm. 737-738}."
