label: { ar: "قيس بن مكشوح المرادي", en: "Qays ibn Makshuh al-Muradi" }
summary:
  ar: "قيس بن هبيرة بن المكشوح المرادي؛ كتب عمر إلى أبي عبيدة بن الجراح فأمدّ سعداً به في سبعمائة فقيل شهد القادسية وقيل قدم وقد فرغ المسلمون من حربها فقضى عمر إن كان قدم قبل دفن القتلى فاقسم له نصيبه ويومئذ قال يا قوم إن منايا الكرام القتل فلا يكونن هؤلاء القلف أولى بالصبر وأسخى نفساً بالموت منكم ثم قاتل قتالاً شديداً."
  en: "Qays ibn Hubayra ibn al-Makshuh al-Muradi; sent by Abu Ubayda at Umar's order reinforcing Sa'd in seven hundred — whether he witnessed al-Qadisiyya or arrived after the fighting is debated, Umar ruling his share stood if he came before the dead were buried; his charge-cry 'death is the lot of the noble' is recorded."
