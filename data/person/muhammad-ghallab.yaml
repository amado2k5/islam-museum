summary:
  ar: "أستاذ الفلسفة في جامعة الأزهر، ومؤلف بحوث في الفلسفة الشرقية والإسلامية والأدب المقارن. يقدّم كتابه «الإسلام كما يراه الأوروبيون» آراء مستشرقين ويناقش بعضها. يذكر تقديم محمد رجب البيومي أنه وُلد في مطلع القرن العشرين، ودرس في الأزهر والجامعة المصرية، ونال الدكتوراه من فرنسا، ودرّس في كلية أصول الدين {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 11} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 12}. ومن مؤلفاته سلسلة في الفلسفة الشرقية وكتب في تاريخ الفلسفة والأدب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 20}."
