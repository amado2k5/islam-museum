summary:
  ar: "أستاذ الفلسفة في جامعة الأزهر، ومؤلف بحوث في الفلسفة الشرقية والإسلامية والأدب المقارن. يقدّم كتابه «الإسلام كما يراه الأوروبيون» آراء مستشرقين ويناقش بعضها. يذكر تقديم محمد رجب البيومي أنه وُلد في مطلع القرن العشرين، ودرس في الأزهر والجامعة المصرية، ونال الدكتوراه من فرنسا، ودرّس في كلية أصول الدين {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 11} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 12}. ومن مؤلفاته سلسلة في الفلسفة الشرقية وكتب في تاريخ الفلسفة والأدب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 20}."
  tr: "El-Ezher Üniversitesi Felsefe Profesörü ve Doğu ile İslam felsefesi ile karşılaştırmalı edebiyat üzerine araştırmaların yazarıdır. \"İslam Avrupalıların Görüşü Olarak\" adlı kitabı, oryantalistlerin görüşlerini sunar ve bunlardan bazılarını tartışır. Muhammed Ragab El-Bayoumi'nin girişinde, yirminci yüzyılın başında doğduğu, El-Ezher ve Mısır Üniversitesi'nde eğitim gördüğü, doktorasını Fransa'da aldığı ve Din Temelleri Fakültesi'nde eğitim gördüğü belirtilir {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 11} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 12}. Eserleri arasında Doğu felsefesi üzerine bir dizi yer alır ve felsefe ile edebiyat tarihi üzerine yazmıştır {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 20}."
  id: "Profesor Filsafat di Universitas Al-Azhar dan penulis penelitian tentang filsafat Timur dan Islam serta sastra komparatif. Bukunya \"Islam sebagai Pandangan Orang Eropa\" menyajikan pandangan orientalis dan membahas beberapa di antaranya. Pendahuluan oleh Muhammad Ragab Al-Bayoumi menyebutkan bahwa ia lahir pada awal abad kedua puluh, belajar di Al-Azhar dan Universitas Mesir, meraih gelar doktor dari Prancis, dan belajar di Fakultas Dasar Agama {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 11} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 12}. Di antara karyanya terdapat seri tentang filsafat Timur, dan ia menulis tentang sejarah filsafat dan sastra {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 20}."
