summary:
  ar: "أيوب بن زيد المكي؛ عند البلاذري قال في بناء واسط «بناه في غير بلده ويتركها لغير ولده». وعند المسعودي قتله الحجاج سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له ووضعه الصدور والخطب، قتل صبراً وقيل ضربه الحجاج بحربة في نحره، وهو القائل الناس ثلاثة عاقل وأحمق وفاجر فأما العاقل فالدين شريعته والحلم طبيعته والرأي الحسن سجيته {cite:muruj-al-dhahab p. 130-131}"
  en: "In al-Baladhuri, who quipped on Wasit's building: 'he built it in a land not his own and will leave it to sons not his own.'"
