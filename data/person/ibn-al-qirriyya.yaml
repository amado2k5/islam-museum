label: { ar: "ابن القرية", en: "Ibn al-Qirriyya", es: "Ibn al-Qirriyya", fr: "Ibn al-Qirriyya", ur: "ابن القریہ" }
summary:
  ar: "أيوب بن زيد المكي؛ عند البلاذري قال في بناء واسط «بناه في غير بلده ويتركها لغير ولده». وعند المسعودي قتله الحجاج سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له ووضعه الصدور والخطب، قتل صبراً وقيل ضربه الحجاج بحربة في نحره، وهو القائل الناس ثلاثة عاقل وأحمق وفاجر فأما العاقل فالدين شريعته والحلم طبيعته والرأي الحسن سجيته {cite:muruj-al-dhahab p. 130-131}"
  en: "In al-Baladhuri, who quipped on Wasit's building: 'he built it in a land not his own and will leave it to sons not his own.'"
  es: "En al-Baladhuri, quien bromeó sobre el edificio de Wasit: \"Lo construyó en una tierra que no era suya y se lo dejará a hijos que no son suyos\"."
  fr: "Al-Baladhuri, qui a ironisé sur l'édifice de Wasit: « Il l'a construit sur une terre qui n'est pas la sienne et le laissera à des fils qui ne sont pas les siens. »"
  ur: "البلادوری میں، جس نے واسط کی عمارت پر طنز کیا: 'اس نے اسے ایک ایسی زمین میں بنایا جو اپنی نہیں اور اسے اپنے بیٹوں کے لیے چھوڑ دے گا۔'"
  tr: "Eyyub bin Zayd al-Makki; el-Baladhuri'ye göre, Wasit'in inşası hakkında şöyle demiştir: 'Kendi toprağından başka bir yerde inşa etti ve kendi oğluna bıraktı.' al-Mas'udi'ye göre, el-Hacć seksen iki yılda onu öldürdü çünkü İbn el-Eşat ile dışarı çıktı, ona kitaplar yazdı, sandıklar ve vaazlar yazdı. Sabırla öldürüldü ve söylenene göre el-Hacaj onu boğazına mızrakla vurdu. Dedi ki: 'İnsanlar üçdür: aklı başında, aptal ve kötü.' Bilge için ise, din onun kanunudur, sabır doğasıdır ve iyi yargı onun doğasıdır. {alıntı:Muruj-al-Dhahab, s. 130-131}"
  id: "Ayyub ibn Zayd al-Makki; menurut al-Baladhuri, ia berkata tentang pembangunan Wasit: 'Ia membangunnya di tempat selain tanahnya sendiri dan mewariskannya kepada anaknya sendiri.' Menurut al-Mas'udi, al-Hajjaj membunuhnya pada tahun delapan puluh dua karena ia pergi bersama Ibn al-Ash'ath, untuk membuat buku-buku untuknya, dan untuk menulis peti serta khotbah. Ia dibunuh dengan sabar, dan dikatakan al-Hajjaj memukulnya dengan tombak di tenggorokannya. Ia berkata: 'Manusia itu tiga: waras, bodoh, dan jahat.' Adapun orang bijaksana, agama adalah hukumnya, kesabaran adalah sifatnya, dan penilaian yang bijak adalah sifatnya. {cite:Muruj-al-Dhahab, hlm. 130-131}"
