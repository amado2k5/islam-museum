summary:
  ar: "قهرمانة أم المقتدر، صار الأمر والنهي لحرم الخليفة ونسائه لركاكته فأمرتها أم المقتدر أن تجلس للمظالم وتنظر في رقاع الناس كل جمعة فكانت تجلس وتحضر القضاة والأعيان وتبرز التواقيع وعليها خطها {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  en: "The queen-mother's stewardess; when command fell to the harem for the caliph's weakness, she sat for the mazalim each Friday, the qadis and notables attending, the signed rescripts issued in her own hand {cite:tarikh-khulafa-minhaj-1434 p. 589}."
