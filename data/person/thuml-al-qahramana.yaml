id: person/thuml-al-qahramana
class: person
label: { ar: "ثمل القهرمانة" }
summary:
  ar: "قهرمانة أم المقتدر، صار الأمر والنهي لحرم الخليفة ونسائه لركاكته فأمرتها أم المقتدر أن تجلس للمظالم وتنظر في رقاع الناس كل جمعة فكانت تجلس وتحضر القضاة والأعيان وتبرز التواقيع وعليها خطها {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  en: "The queen-mother's stewardess; when command fell to the harem for the caliph's weakness, she sat for the mazalim each Friday, the qadis and notables attending, the signed rescripts issued in her own hand {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  es: "La mayordoma de la reina madre; cuando el mando recayó en el harén debido a la debilidad del califa, ella presidía los mazalim cada viernes, con la asistencia de los cadíes y notables, y los rescriptos firmados eran emitidos de su puño y letra {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  fr: "L'hôtesse de la reine-mère; lorsque le commandement est tombé au harem en raison de la faiblesse du calife, elle siégeait pour les mazalim chaque vendredi, les qadis et les notables présents, les rescrits signés étant émis de sa propre main {cite:tarikh-khulafa-minhaj-1434 p. 589}."
  ur: "ملکہ کی ماں کی خادمہ؛ جب خلیفہ کی کمزوری کی وجہ سے حرم پر حکم آیا تو وہ ہر جمعہ کو مجلس کے لیے بیٹھتی تھیں، قادیان اور معززین اس میں شرکت کرتے تھے، دستخط شدہ نسخے اپنے ہاتھ میں جاری کیے جاتے تھے۔ 589}۔"
