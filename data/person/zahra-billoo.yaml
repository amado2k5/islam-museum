summary:
  ar: "محامية حقوق مدنية أمريكية، وهي المديرة التنفيذية لمكتب مجلس العلاقات الأمريكية الإسلامية (كير) في منطقة خليج سان فرانسيسكو منذ سنة 2010، بعد انضمامها إليه سنة 2009 عقب تخرجها في الحقوق. قادت نمو المكتب ستة أضعاف ورفعت باسمه دعاوى ضد وزارة العدل الأمريكية وشركات كبرى دفاعًا عن مسلمين تعرضوا للتمييز، وكانت مدعية في دعوى «صرصور ضد ترمب» الطاعنة في حظر السفر، وتحدثت في مسيرة النساء سنة 2017."
  en: "American civil-rights attorney who has been executive director of the Council on American-Islamic Relations, San Francisco Bay Area office (CAIR-SFBA) since 2010, having joined it in 2009 after graduating in law. She led the office's six-fold growth, filed suits in its name against the U.S. Department of Justice and major companies on behalf of Muslims facing discrimination, was a plaintiff in Sarsour v. Trump challenging the travel ban, and spoke at the 2017 Women's March."
  ur: "امریکی شہری حقوق کی وکیل، جو 2009 میں قانون کی تعلیم مکمل کر کے کونسل آن امریکن اسلامک ریلیشنز (CAIR) کے سان فرانسسکو بے ایریا دفتر میں شامل ہوئیں اور 2010 سے اس کی ایگزیکٹو ڈائریکٹر ہیں۔ انھوں نے دفتر کو چھ گنا بڑھایا، امتیاز کا شکار مسلمانوں کی جانب سے امریکی محکمہ انصاف اور بڑی کمپنیوں کے خلاف مقدمات دائر کیے، سفری پابندی کے خلاف «سرسور بنام ٹرمپ» مقدمے کی مدعی رہیں، اور 2017 کی ویمنز مارچ میں خطاب کیا۔"
