summary:
  ar: "\u0642\u0627\u0631\u0626 \u0642\u0631\u0622\u0646 \u0645\u0635\u0631\u064a (\u0648\u064f\u0644\u062f 1964)\u060c \u0623\u0645\u0651 \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d \u0641\u064a \u0645\u0633\u062c\u062f \u0639\u0645\u0631\u0648 \u0628\u0646 \u0627\u0644\u0639\u0627\u0635 \u0628\u0627\u0644\u0642\u0627\u0647\u0631\u0629 \u0645\u0646 1988 \u0625\u0644\u0649 2015 \u0641\u0627\u062c\u062a\u0630\u0628 \u0644\u064a\u0627\u0644\u064a \u0627\u0644\u0642\u062f\u0631 \u0645\u0626\u0627\u062a \u0627\u0644\u0622\u0644\u0627\u0641\u060c \u0648\u0623\u0633\u0633 \u062f\u0627\u0631 \u0623\u0628\u064a\u0651 \u0628\u0646 \u0643\u0639\u0628 \u0644\u0639\u0644\u0648\u0645 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a 1996\u061b \u0645\u0646\u0639\u062a\u0647 \u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u0623\u0648\u0642\u0627\u0641 \u0628\u0639\u062f \u062f\u0639\u0627\u0621 \u0642\u0646\u0648\u062a \u0641\u064a \u0631\u0645\u0636\u0627\u0646 2015\u060c \u0648\u0623\u0644\u063a\u062a \u0645\u062d\u0643\u0645\u0629 \u0627\u0644\u0642\u0636\u0627\u0621 \u0627\u0644\u0625\u062f\u0627\u0631\u064a \u0645\u0646\u0639\u0647 \u0645\u0646 \u0627\u0644\u0633\u0641\u0631\u060c \u0648\u064a\u0642\u064a\u0645 \u0641\u064a \u0644\u0646\u062f\u0646 \u0645\u0646\u0630 2015."
  en: "Egyptian Qur'an reciter (born 1964) who led the tarawih at the Mosque of Amr ibn al-As in Cairo from 1988 to 2015, drawing hundreds of thousands on the Night of Power, and founded the Dar Ubayy ibn Ka'b centre for Qur'anic sciences in 1996; the Ministry of Awqaf barred him after a qunut supplication in Ramadan 2015, an administrative court annulled his travel ban, and he has lived in London since 2015."
  ur: "\u0645\u0635\u0631\u06cc \u0642\u0627\u0631\u06cc\u0650 \u0642\u0631\u0622\u0646 (\u067e\u06cc\u062f\u0627\u0626\u0634 1964\u0621)\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 1988\u0621 \u0633\u06d2 2015\u0621 \u062a\u06a9 \u0642\u0627\u06c1\u0631\u06c1 \u06a9\u06cc \u0645\u0633\u062c\u062f \u0639\u0645\u0631\u0648 \u0628\u0646 \u0627\u0644\u0639\u0627\u0635 \u0645\u06cc\u06ba \u062a\u0631\u0627\u0648\u06cc\u062d \u067e\u0691\u06be\u0627\u0626\u06cc\u060c \u062c\u06c1\u0627\u06ba \u0644\u06cc\u0644\u06c3 \u0627\u0644\u0642\u062f\u0631 \u0645\u06cc\u06ba \u0644\u0627\u06a9\u06be\u0648\u06ba \u0646\u0645\u0627\u0632\u06cc \u0622\u062a\u06d2\u060c \u0627\u0648\u0631 1996\u0621 \u0645\u06cc\u06ba \u062f\u0627\u0631 \u0627\u0628\u06cc \u0628\u0646 \u06a9\u0639\u0628 \u0628\u0631\u0627\u0626\u06d2 \u0639\u0644\u0648\u0645\u0650 \u0642\u0631\u0622\u0646 \u0642\u0627\u0626\u0645 \u06a9\u06cc\u0627\u061b \u0631\u0645\u0636\u0627\u0646 2015\u0621 \u06a9\u06cc \u0627\u06cc\u06a9 \u062f\u0639\u0627\u0626\u06d2 \u0642\u0646\u0648\u062a \u06a9\u06d2 \u0628\u0639\u062f \u0648\u0632\u0627\u0631\u062a\u0650 \u0627\u0648\u0642\u0627\u0641 \u0646\u06d2 \u0627\u0646 \u067e\u0631 \u067e\u0627\u0628\u0646\u062f\u06cc \u0644\u06af\u0627\u0626\u06cc\u060c \u0627\u0646\u062a\u0638\u0627\u0645\u06cc \u0639\u062f\u0627\u0644\u062a \u0646\u06d2 \u0633\u0641\u0631 \u06a9\u06cc \u067e\u0627\u0628\u0646\u062f\u06cc \u0645\u0646\u0633\u0648\u062e \u06a9\u06cc\u060c \u0627\u0648\u0631 \u0648\u06c1 2015\u0621 \u0633\u06d2 \u0644\u0646\u062f\u0646 \u0645\u06cc\u06ba \u0645\u0642\u06cc\u0645 \u06c1\u06cc\u06ba\u06d4"
