summary:
  ar: "قارئ قرآن مصري ⁦(وُلد 1964)⁩، أمّ التراويح في مسجد عمرو بن العاص بالقاهرة من 1988 إلى 2015 فاجتذب ليالي القدر مئات الآلاف، وأسس دار أبيّ بن كعب لعلوم القرآن في 1996؛ منعته وزارة الأوقاف بعد دعاء قنوت في رمضان 2015، وألغت محكمة القضاء الإداري منعه من السفر، ويقيم في لندن منذ 2015."
  en: "Egyptian Qur'an reciter (born 1964) who led the tarawih at the Mosque of Amr ibn al-As in Cairo from 1988 to 2015, drawing hundreds of thousands on the Night of Power, and founded the Dar Ubayy ibn Ka'b centre for Qur'anic sciences in 1996; the Ministry of Awqaf barred him after a qunut supplication in Ramadan 2015, an administrative court annulled his travel ban, and he has lived in London since 2015."
  ur: "مصری قاریِ قرآن ⁦(پیدائش 1964ء)⁩، جنھوں نے 1988ء سے 2015ء تک قاہرہ کی مسجد عمرو بن العاص میں تراویح پڑھائی، جہاں لیلۃ القدر میں لاکھوں نمازی آتے، اور 1996ء میں دار ابی بن کعب برائے علومِ قرآن قائم کیا؛ رمضان 2015ء کی ایک دعائے قنوت کے بعد وزارتِ اوقاف نے ان پر پابندی لگائی، انتظامی عدالت نے سفر کی پابندی منسوخ کی، اور وہ 2015ء سے لندن میں مقیم ہیں۔"
