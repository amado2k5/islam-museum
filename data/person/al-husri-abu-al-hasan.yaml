label: { ar: "الحصري أبو الحسن علي بن عبد الغني الفهري" }
summary:
  ar: "أبو الحسن الحصري المقرئ الشاعر نزيل سبتة علي بن عبد الغني الفهري — ابن خالة أبي إسحاق الحصري صاحب زهر الآداب؛ كان مقرئاً محققاً وشاعراً مفلقاً ضريراً، خرج من القيروان بعد خرابها فتهادته ملوك الطوائف وتنافسوا فيه ثم اشتملت عليه طنجة؛ كان عالماً بالقراءات وطرقها وأقرأ الناس بسبتة وغيرها وله ديوان ومنه القصيدة المطربة «يا ليل الصب متى غده»؛ توفي سنة ثمان وثمانين وأربعمائة {cite:shadharat-dhahab p. 386-387}."
  en: "Abu al-Hasan al-Husri, the blind muqri-poet resident at Ceuta, Ali b. Abd al-Ghani al-Fihri — nephew of Abu Ishaq al-Husri of Zahr al-Adab; after Qayrawan's ruin the Taifa kings vied to host him until Tangier took him in; master of the readings who taught Qur'an at Ceuta and beyond, author of a diwan including the song-famous 'Ya layl al-sabb'; died 488 {cite:shadharat-dhahab p. 386-387}."
