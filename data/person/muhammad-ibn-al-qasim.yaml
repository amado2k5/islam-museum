id: person/muhammad-ibn-al-qasim
class: person
label: { ar: "محمد بن القاسم الثقفي", en: "Muhammad ibn al-Qasim al-Thaqafi", es: "Muhammad ibn al-Qasim al-Thaqafi", fr: "Muhammad ibn al-Qasim al-Thaqafi", ur: "محمد بن القاسم الثقفی" }
summary:
  ar: "محمد بن القاسم الثقفي، فاتح السند في خلافة الوليد بن عبد الملك؛ عند البلاذري: نقل الوليد إلى أنطاكية قوماً من الزط السند ممن حلّه محمد بن القاسم إلى الحجاج فبعث بهم الحجاج إلى الشام — كما كان معاوية نقل سنة 49 أو 50 إلى السواحل قوماً من زط البصرة والسباتجة فأنزل بعضهم أنطاكية. ويذكر الكتاب أن الفتح الإسلامي للسند بدأ بحملات مبكرة في عهد عمر وعلي، ثم جاء فتح محمد بن القاسم في خلافة الوليد بن عبد الملك. {cite:salabi-umayyad-state-2020 p.101-102} ويذكر الكتاب أن الحجاج عقد له ثغر السند وضم إليه ستة آلاف من جند الشام، وأن الحملة فتحت الديبل ونيرون والرور وملتان، وأن داهر قُتل في معركته على نهر مهران. وأن نفقات الحملة بلغت ستين مليون درهم على ما يُروى. وعزله صالح بن عبد الرحمن وحبسه بواسط، وتضاربت الروايات في موته. {cite:salabi-umayyad-state-2020 p.102-107}"
  en: "Muhammad ibn al-Qasim al-Thaqafi, conqueror of Sind in al-Walid ibn Abd al-Malik's caliphate; in al-Baladhuri: al-Walid transferred to Antioch a company of the Sindhi Zutt whom Muhammad ibn al-Qasim had assigned to al-Hajjaj, who sent them on to Syria — as Mu'awiya had earlier, in year 49 or 50, moved companies of Basra's Zutt and Sayabija to the coasts, settling some at Antioch."
  es: "Muhammad ibn al-Qasim al-Thaqafi, conquistador de Sind en el califato de al-Walid ibn Abd al-Malik; en al-Baladhuri: al-Walid transfirió a Antioquía una compañía de los Zutt de Sind que Muhammad ibn al-Qasim había asignado a al-Hajjaj, quien los envió a Siria, como Mu'awiya había hecho anteriormente, en el año 49 o 50, trasladando compañías de los Zutt y Sayabija de Basora a las costas, estableciendo algunas en Antioquía."
  fr: "Muhammad ibn al-Qasim al-Thaqafi, conquérant du Sind dans le califat d'al-Walid ibn Abd al-Malik; dans al-Baladhuri: al-Walid a transféré à Antioche une compagnie de Zutt sindhis que Muhammad ibn al-Qasim avait assignée à al-Hajjaj, qui les a envoyés en Syrie — comme Mu'awiya l'avait fait auparavant, en l'an 49 ou 50, en déplaçant des compagnies de Zutt et de Sayabija de Bassora vers les côtes, en installant certains à Antioche."
  ur: "محمد بن القاسم الثقفی، الولید بن عبد الملک کی خلافت میں سندھ کا فاتح؛ البلادوری میں: الولید نے سندھی زت کی ایک کمپنی کو انطاکیہ منتقل کیا جسے محمد بن القاسم نے الحجاج کو تفویض کیا تھا، جس نے انہیں شام بھیج دیا تھا - جیسا کہ معاویہ نے اس سے پہلے، 49 یا 50 میں، بصرہ کے زت اور سیابیجہ کی کمپنیوں کو انطاکیہ کے ساحلوں پر منتقل کر دیا تھا۔"
  tr: "Muhammed bin el-Kasım el-Tekafi, el-Velid bin Abdülmelik'in halifeliği sırasında Sind'i fethedi; el-Baladhuri'ye göre: el-Velid, Muhammed bin Kasım tarafından Antakya'ya dağıtılan bir grubu Antakya'ya nakletmiş, Muaviye ise 49 veya 50 Hicri yılında Basra Zat'ından ve Sabtaja'dan kıyılara insanları taşımış, bazıları Antakya'ya yerleşmiştir. Kitap, Sind'in İslam fethi döneminin Ömer ve Ali'nin saltanatları sırasında erken seferlerle başladığını, ardından Muhammed bin el-Kasım'ın el-Welid bin Abdülmelik'in halifeliği sırasında fetih ettiğini belirtir. {alıntı:) Selabi-Umayyad-Devleti-2020 s.101-102} Kitap, el-Hacac'ın Sind sınırını güvence altına aldığını, el-Şam'dan altı bin asker topladığını, seferin Dibal, Nero, el-Rur ve Multan'ı ele geçirdiğini ve Dahir'in Mehran Nehri'ndeki savaşında öldüğünü belirtir. Kampanya masrafları raporlara göre altmış milyon dirhem oldu. Saleh bin Abdul Rahman onu görevden aldı ve Wasit'te hapsetti, ölümüyle ilgili çelişkili anlatımlar vardı. {kaynak:Salabi-Umayyad-State-2020 s.102-107}"
  id: "Muhammad ibn al-Qasim al-Thaqafi, penakluk Sindh pada masa kekhalifahan al-Walid ibn Abd al-Malik; menurut al-Baladhuri: al-Walid memindahkan kelompok dari Zat al-Sanad ke Antiokhia, yang telah dibubarkan Muhammad ibn al-Qasim ke al-Hajjaj, yang kemudian mengirim mereka ke Levant—dan Muawiya memindahkan orang dari Zat Basra dan Sabtaja ke pesisir pada tahun 49 atau 50 H, dan beberapa menetap di Antiokhia. Buku tersebut menyebutkan bahwa penaklukan Islam atas Sindh dimulai dengan kampanye awal selama masa pemerintahan Umar dan Ali, kemudian terjadi penaklukan Muhammad ibn al-Qasim selama kekhalifahan al-Walid ibn Abd al-Malik. {cite:salabi-umayyad-state-2020 hlm.101-102} Buku tersebut menyebutkan bahwa al-Hajjaj mengamankan perbatasan Sindh dan mengumpulkan enam ribu tentara dari al-Sham, serta kampanye tersebut merebut Dibal, Nero, al-Rur, dan Multan, serta Dahir tewas dalam pertempurannya di Sungai Mehran. Biaya kampanye mencapai enam puluh juta dirham, menurut laporan. Saleh bin Abdul Rahman memberhentikannya dan memenjarakannya di Wasit, dengan laporan yang bertentangan mengenai kematiannya. {sitasi: Salabi-Umayyad-State-2020 hlm.102-107}"
