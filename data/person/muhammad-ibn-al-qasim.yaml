summary:
  ar: "محمد بن القاسم الثقفي، فاتح السند في خلافة الوليد بن عبد الملك؛ عند البلاذري: نقل الوليد إلى أنطاكية قوماً من الزط السند ممن حلّه محمد بن القاسم إلى الحجاج فبعث بهم الحجاج إلى الشام — كما كان معاوية نقل سنة 49 أو 50 إلى السواحل قوماً من زط البصرة والسباتجة فأنزل بعضهم أنطاكية."
  en: "Muhammad ibn al-Qasim al-Thaqafi, conqueror of Sind in al-Walid ibn Abd al-Malik's caliphate; in al-Baladhuri: al-Walid transferred to Antioch a company of the Sindhi Zutt whom Muhammad ibn al-Qasim had assigned to al-Hajjaj, who sent them on to Syria — as Mu'awiya had earlier, in year 49 or 50, moved companies of Basra's Zutt and Sayabija to the coasts, settling some at Antioch."
