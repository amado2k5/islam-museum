summary:
  ar: "محمد بن محمد بن محمد، رضي الدين وبرهان الإسلام السرخسي، فقيه وأصولي حنفي، إمام كبير جامع للعلوم العقلية والنقلية، قدم حلب ودرّس بالنورية والحلاوية بعد محمود الغزنوي، فتعصب عليه جماعة ونسبوه إلى التقصير فانعزل عن التدريس وسار إلى دمشق، فتولى تدريس الحانوتية بها، وتوفي فيها. من تصانيفه «المحيط الكبير» و«المحيط الثاني» و«المحيط الثالث» و«المحيط الرابع». توفي سنة 771هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  en: "Muhammad ibn Muhammad ibn Muhammad, Radi al-Din and Burhan al-Islam al-Sarakhsi, a Hanafi jurist and usuli, a great imam who combined the rational and transmitted sciences. He came to Aleppo and taught at the Nuriyya and Halawiyya after Mahmud al-Ghaznawi, but a group turned against him and charged him with negligence, so he left teaching and went to Damascus, where he taught at the Hanutiyya and died. His works include the four 'Muhit' volumes. He died in 771 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
sources: [source/fiqh-mawsua-kuwaitiyya-noor-v3]
