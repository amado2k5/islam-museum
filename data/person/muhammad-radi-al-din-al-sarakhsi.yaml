summary:
  ar: "محمد بن محمد بن محمد، رضي الدين وبرهان الإسلام السرخسي، فقيه وأصولي حنفي، إمام كبير جامع للعلوم العقلية والنقلية، قدم حلب ودرّس بالنورية والحلاوية بعد محمود الغزنوي، فتعصب عليه جماعة ونسبوه إلى التقصير فانعزل عن التدريس وسار إلى دمشق، فتولى تدريس الحانوتية بها، وتوفي فيها. من تصانيفه «المحيط الكبير» و«المحيط الثاني» و«المحيط الثالث» و«المحيط الرابع». توفي سنة 771هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  en: "Muhammad ibn Muhammad ibn Muhammad, Radi al-Din and Burhan al-Islam al-Sarakhsi, a Hanafi jurist and usuli, a great imam who combined the rational and transmitted sciences. He came to Aleppo and taught at the Nuriyya and Halawiyya after Mahmud al-Ghaznawi, but a group turned against him and charged him with negligence, so he left teaching and went to Damascus, where he taught at the Hanutiyya and died. His works include the four 'Muhit' volumes. He died in 771 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  es: "Muhammad ibn Muhammad ibn Muhammad, Radi al-Din y Burhan al-Islam al-Sarakhsi, jurista y usuli hanafí, un gran imán que combinó las ciencias racionales y transmitidas. Llegó a Alepo y enseñó en las escuelas Nuriyya y Halawiyya después de Mahmud al-Ghaznawi, pero un grupo se volvió contra él y lo acusó de negligencia, por lo que abandonó la enseñanza y se fue a Damasco, donde enseñó en la escuela Hanutiyya y falleció. Entre sus obras se encuentran los cuatro volúmenes de «Muhit». Murió en el año 771 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  fr: "Muhammad ibn Muhammad ibn Muhammad, dit Radi al-Din et Burhan al-Islam al-Sarakhsi, juriste et usuli hanafite, fut un grand imam qui sut allier les sciences rationnelles et les sciences transmises. Il vint à Alep et enseigna à la Nouriyya et à la Halawiyya après Mahmud al-Ghaznawi. Cependant, un groupe se retourna contre lui et l'accusa de négligence; il abandonna alors l'enseignement et se rendit à Damas, où il enseigna à la Hanutiyya et mourut. Parmi ses œuvres figurent les quatre volumes du « Muhit ». Il mourut en 771 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  ur: "محمد بن محمد بن محمد، ردالدین اور برہان الاسلام السرخسی، ایک حنفی فقیہ اور اصولی، ایک عظیم امام جس نے عقلی اور منتقلی علوم کو یکجا کیا۔ وہ حلب آیا اور محمود غزنوی کے بعد نوریہ اور حلاویہ میں پڑھایا لیکن ایک گروہ نے اس کے خلاف ہو کر اس پر غفلت کا الزام لگایا، چنانچہ اس نے درس دینا چھوڑ دیا اور دمشق چلے گئے، جہاں اس نے حنوطیہ میں درس دیا اور انتقال کر گئے۔ ان کی تصانیف میں چار 'محیط' جلدیں شامل ہیں۔ ان کی وفات 771ھ میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2062}"
  tr: "Muhammed bin Muhammed bin Muhammed, Allah İslam'ın dini ve kanıtı el-Sarakhsi'den razı olsun, Hanefi hukukçusu ve usul alimi, akıl ve aktarım illeri topluluğunun büyük bir imamı idi. Halep'e geldi ve Mahmud el-Gaznavi'den sonra Nuriyya ve Halawiya okullarında ders verdi. Bir grup ona karşı düşmanca davrandı ve onu ihmalkarlıkla suçladı, bu yüzden öğretmenliği bıraktı ve Şam'a gitti, burada Hanutiye öğretmeye başladı ve orada öldü. Eserleri arasında \"El-Muheet el-Kabir\", \"El-Muheet El-Thani\", \"El-Muheet El-Talith\" ve \"El-Muheet El-Rabi\" bulunmaktadır. 771 Hicri yılında vefat etti. {Kaynak:Fiqh-Mawsua-Kuveytiyya-V3 s.2062}"
  id: "Muhammad ibn Muhammad ibn Muhammad, semoga Allah berkenan dengan agama dan bukti Islam al-Sarakhsi, adalah seorang ahli hukum Hanafi dan ulama usul, imam besar dalam kumpulan ilmu rasional dan ilmu yang diteruskan. Ia datang ke Aleppo dan mengajar di sekolah Nuriyya dan Halawiya setelah Mahmud al-Ghaznawi. Sekelompok orang menjadi bermusuhan kepadanya dan menuduhnya sebagai kelalaian, sehingga ia menarik diri dari pengajaran dan pergi ke Damaskus, di mana ia mulai mengajar Hanutiyah dan meninggal di sana. Di antara karya-karyanya adalah \"Al-Muheet Al-Kabir,\" \"Al-Muheet Al-Thani,\" \"Al-Muheet Al-Thalith,\" dan \"Al-Muheet Al-Rabi'.\" Ia meninggal pada tahun 771 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2062}"
