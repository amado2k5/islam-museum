summary:
  ar: "هبة الله بن موسى الشيرازي، أبو نصر، المؤيد في الدين، داعي الدعاة، من زعماء الإسماعيلية وكتابها، ولد وتعلم بشيراز وخدم المستنصر الفاطمي بمصر وتوفي فيها سنة ٤٧٠هـ، له المجالس المؤيدية والمرشد إلى أدب الإسماعيلية."
  en: "Hibat Allah ibn Musa al-Shirazi, Abu Nasr, al-Mu'ayyad fi'l-Din, chief da'i, an Isma'ili leader and writer born and schooled at Shiraz, who served the Fatimid al-Mustansir in Egypt and died there in 470 AH (1078); author of al-Majalis al-Mu'ayyadiyya and al-Murshid ila adab al-Isma'iliyya."
