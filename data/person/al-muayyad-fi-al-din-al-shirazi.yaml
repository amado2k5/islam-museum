id: person/al-muayyad-fi-al-din-al-shirazi
class: person
label:
  ar: "المؤيد في الدين الشيرازي"
  en: "al-Mu'ayyad fi'l-Din al-Shirazi"
  fr: "al-Mu'ayyad fi'l-Din al-Shirazi"
  es: "al-Mu'ayyad fi'l-Din al-Shirazi"
  ur: "المعیاد فی الدین الشیرازی"
roles: [scholar]
gender: male
summary:
  ar: "هبة الله بن موسى الشيرازي، أبو نصر، المؤيد في الدين، داعي الدعاة، من زعماء الإسماعيلية وكتابها، ولد وتعلم بشيراز وخدم المستنصر الفاطمي بمصر وتوفي فيها سنة ٤٧٠هـ، له المجالس المؤيدية والمرشد إلى أدب الإسماعيلية."
  en: "Hibat Allah ibn Musa al-Shirazi, Abu Nasr, al-Mu'ayyad fi'l-Din, chief da'i, an Isma'ili leader and writer born and schooled at Shiraz, who served the Fatimid al-Mustansir in Egypt and died there in 470 AH (1078); author of al-Majalis al-Mu'ayyadiyya and al-Murshid ila adab al-Isma'iliyya."
  fr: "Hibat Allah ibn Musa al-Shirazi, Abu Nasr, al-Mu'ayyad fi'l-Din, chef da'i, un leader Isma'ili et écrivain né et instruit à Shiraz, qui a servi les Fatimides al-Mustansir en Égypte et y est mort en 470 de l’hégire (1078) ; Auteur de al-Majalis al-Mu'ayyadiyya et al-Murshid ila adab al-Isma'iliyya."
  es: "Hibat Allah ibn Musa al-Shirazi, Abu Nasr, al-Mu'ayyad fi'l-Din, jefe da'i, líder y escritor ismailí nacido y educado en Shiraz, que sirvió al fatimí al-Mustansir en Egipto y murió allí en 470 AH (1078); autor de al-Majalis al-Mu'ayyadiyya y al-Murshid ila adab al-Isma'iliyya."
  ur: "ہیبت اللہ ابن موسیٰ الشیرازی، ابو نصر، المعیاد فی الدین، چیف داعی، ایک اسماعیلی رہنما اور مصنف شیراز میں پیدا ہوئے اور تعلیم حاصل کی، جس نے مصر میں فاطمی المستنصر کی خدمت کی اور وہیں 470 ہجری (1078) میں وفات پائی؛ المجالس المعیادیہ اور مرشد الا ادب الاسماعیلیہ کے مصنف۔"
