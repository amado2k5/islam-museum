summary:
  ar: "ميرزا محمد مراد بخش (9 أكتوبر 1624 – 14 ديسمبر 1661) أمير مغولي، أصغر أبناء الإمبراطور شاه جهان والممتاز محل الباقين. تولّى صوبه دارية بلخ وملتان وكشمير والدكن وكابل وكجرات ومالوا، وأعلن نفسه إمبراطورًا في أحمد آباد سنة 1657، وتحالفه مع أخيه أورنكزيب حسم معركة سموغر، ثم اعتقله أورنكزيب وسجنه في قلعة غواليور وأعدمه سنة 1661."
  en: "Mirza Muhammad Murad Bakhsh (9 October 1624 – 14 December 1661) was a Mughal prince, the youngest surviving son of Emperor Shah Jahan and Mumtaz Mahal. He governed Balkh, Multan, Kashmir, the Deccan, Kabul, Gujarat and Malwa, proclaimed himself emperor at Ahmedabad in 1657, and his alliance and charge with his brother Aurangzeb decided the Battle of Samugarh — after which Aurangzeb had him arrested, imprisoned in Gwalior Fort and executed in 1661."
  ur: "میرزا محمد مراد بخش (9 اکتوبر 1624ء – 14 دسمبر 1661ء) مغل شہزادے تھے، شہنشاہ شاہ جہاں اور ممتاز محل کے سب سے چھوٹے زندہ بچ جانے والے فرزند۔ وہ بلخ، ملتان، کشمیر، دکن، کابل، گجرات اور مالوا کے صوبہ دار رہے، 1657ء میں احمد آباد میں خود کو بادشاہ قرار دیا، اور اپنے بھائی اورنگزیب کے ساتھ ان کے اتحاد اور حملے نے سموگڑھ کی جنگ کا فیصلہ کیا — جس کے بعد اورنگزیب نے انھیں گرفتار کر کے گوالیار قلعے میں قید رکھا اور 1661ء میں قتل کر دیا۔"

