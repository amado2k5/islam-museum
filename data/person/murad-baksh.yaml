summary:
  ar: "ميرزا محمد مراد بخش ⁦(9 أكتوبر 1624 – 14 ديسمبر 1661)⁩ أمير مغولي، أصغر أبناء الإمبراطور شاه جهان والممتاز محل الباقين. تولّى صوبه دارية بلخ وملتان وكشمير والدكن وكابل وكجرات ومالوا، وأعلن نفسه إمبراطورًا في أحمد آباد سنة 1657، وتحالفه مع أخيه أورنكزيب حسم معركة سموغر، ثم اعتقله أورنكزيب وسجنه في قلعة غواليور وأعدمه سنة 1661."
  en: "Mirza Muhammad Murad Bakhsh (9 October 1624 – 14 December 1661) was a Mughal prince, the youngest surviving son of Emperor Shah Jahan and Mumtaz Mahal. He governed Balkh, Multan, Kashmir, the Deccan, Kabul, Gujarat and Malwa, proclaimed himself emperor at Ahmedabad in 1657, and his alliance and charge with his brother Aurangzeb decided the Battle of Samugarh — after which Aurangzeb had him arrested, imprisoned in Gwalior Fort and executed in 1661."
  ur: "میرزا محمد مراد بخش ⁦(9 اکتوبر 1624ء – 14 دسمبر 1661ء)⁩ مغل شہزادے تھے، شہنشاہ شاہ جہاں اور ممتاز محل کے سب سے چھوٹے زندہ بچ جانے والے فرزند۔ وہ بلخ، ملتان، کشمیر، دکن، کابل، گجرات اور مالوا کے صوبہ دار رہے، 1657ء میں احمد آباد میں خود کو بادشاہ قرار دیا، اور اپنے بھائی اورنگزیب کے ساتھ ان کے اتحاد اور حملے نے سموگڑھ کی جنگ کا فیصلہ کیا — جس کے بعد اورنگزیب نے انھیں گرفتار کر کے گوالیار قلعے میں قید رکھا اور 1661ء میں قتل کر دیا۔"
  es: "Mirza Muhammad Murad Bakhsh (9 de octubre de 1624 - 14 de diciembre de 1661) fue un príncipe mogol, el hijo menor superviviente del emperador Shah Jahan y Mumtaz Mahal. Gobernó Balkh, Multan, Cachemira, el Decán, Kabul, Gujarat y Malwa, se proclamó emperador en Ahmedabad en 1657, y su alianza y alianza con su hermano Aurangzeb decidieron la batalla de Samugarh, tras la cual Aurangzeb lo hizo arrestar, encarcelarlo en el fuerte de Gwalior y ejecutarlo en 1661."
  fr: "Mirza Muhammad Murad Bakhsh (9 octobre 1624 – 14 décembre 1661) était un prince moghol, le plus jeune fils survivant de l'empereur Shah Jahan et de Mumtaz Mahal. Il gouverna Balkh, Multan, le Cachemire, le Deccan, Kaboul, le Gujarat et le Malwa, se proclama empereur à Ahmedabad en 1657, et son alliance avec son frère Aurangzeb, ainsi que leur implication dans la bataille de Samugarh, furent décisives. À la suite de cette bataille, Aurangzeb le fit arrêter, emprisonner au fort de Gwalior et exécuter en 1661."
  tr: "Mirza Muhammed Murad Bakhsh (9 Ekim 1624 – 14 Aralık 1661), bir Babür prensi, İmparator Şah Cihan'ın en küçük oğlu ve diğerlerinin en büyüğüydü. Balkh, Multan, Keşmir, Dekkan, Kabil, Gujarat ve Malwa eyaletlerini yönetti, 1657'de Ahmedabad'da kendini imparator ilan etti ve kardeşi Aurangzeb ile ittifak kurarak Smoghar Muharebesi'ni kararlaştırdı. Aurangzeb onu tutukladı, Gwalior Kalesi'nde hapsetti ve 1661'de idam etti."
  id: "Mirza Muhammad Murad Bakhsh (9 Oktober 1624 – 14 Desember 1661) adalah seorang pangeran Mughal, putra bungsu Kaisar Shah Jahan, dan yang tertua dari yang lain. Ia memerintah provinsi Balkh, Multan, Kashmir, Deccan, Kabul, Gujarat, dan Malwa, menyatakan dirinya sebagai kaisar di Ahmedabad pada tahun 1657, dan bersekutu dengan saudaranya Aurangzeb untuk memutuskan Pertempuran Smoghar. Aurangzeb kemudian menangkapnya, memenjarakannya di Benteng Gwalior, dan mengeksekusinya pada tahun 1661."

