id: person/al-hasan-ibn-musa-al-nawbakhti
class: person
label: { ar: "الحسن بن موسى النوبختي", en: "Al Hasan Ibn Musa Al Nawbakhti", es: "Al Hasan Ibn Musa Al Nawbakhti", fr: "Al Hasan Ibn Musa Al Nawbakhti", ur: "الحسن ابن موسیٰ النبختی" }
summary:
  ar: "أبو محمد الحسن بن موسى بن أخت أبي سهل بن نوبخت متكلم فيلسوف كان يجتمع إليه جماعة من النقلة لكتب الفلسفة مثل أبي عثمان الدمشقي وإسحاق وثابت وغيرهم وكانت المعتزلة تدعيه والشيعة تدعيه ولكنه إلى حيز الشيعة أقرب لأن آل نوبخت معروفون بولاية علي وولده في الظاهر، وكان جامعا للكتب قد نسخ بخطه شيئا كثيرا وله مصنفات وتأليفات في الكلام والفلسفة وغيرها، وله من الكتب كتاب الآراء والديانات ولم يتمه وكتاب الرد على أصحاب التناسخ وكتاب التوحيد وحدث الملل وكتاب نقض كتاب أبي عيسى في الغريب المشرقي وكتاب اختصار اختصار الكون والفساد لأرستاليس وكتاب الاحتجاج لعمر بن عباد ونصرة مذهبه وكتاب الإمامة ولم يتمه {cite:fihrist-ibn-al-nadim p. 251-252}."
  en: "Al-Hasan ibn Musa al-Nawbakhti — the Shi'i philosopher-theologian, author of the unfinished Books of Creeds and of the Imamate {cite:fihrist-ibn-al-nadim}"
  es: "Al-Hasan ibn Musa al-Nawbakhti — el filósofo y teólogo chiíta, autor de los Libros Inacabados de los Credos y del Imamato {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Hasan ibn Musa al-Nawbakhti — le philosophe et théologien chiite, auteur des Livres inachevés des croyances et de l'Imamat {cite:fihrist-ibn-al-nadim}"
  ur: "الحسن بن موسیٰ النبختی - شیعہ فلسفی - عالم دین، عقیدہ اور امامت کی نامکمل کتابوں کے مصنف۔"
  tr: "Ebu Muhammed el-Hasan ibn Musa ibn Akht, Ebu Sahl ibn Nevbekht, Ebu Osman el-Dimaşki, İshaq, Tebit ve diğerleri gibi felsefi alimlerin katıldığı bir ilahiyatçı ve filozoftu. Mü'tizililer onu, Şiiler ise onu iddia etti, ancak Nawbakht ailesi Ali ve soyundan gelenleri korumalarıyla tanındığı için Şii diyarına daha yakındı. Kitaplar derleyen biriydi, birçok şeyi kendi el yazısıyla kopyaladı ve teoloji, felsefe ve diğer alanlarda eserler ve eserler yazdı. Kitapları arasında 'Tamamlamadığı Görüşler ve Dinler' adlı kitap da vardır: 'Reenkarnasyon Halkı'nın Çürütülmesi' kitabı, 'Hadis el-Milal', Ebu İsa'nın Doğu'nun yabancısı üzerine kitabının çürütülmesi, Aristantis'in 'İhtisar el-Kavn ve el-Fad' kitabı, Ömer bin Abbad'ın 'İhticic' kitabı ve okulunun desteği ile 'Tamamlanmamış İmamamat' kitabı {atıf:Fihrist-ibn-al-Nadim s. 251-252}."
  id: "Abu Muhammad al-Hasan ibn Musa ibn Akht dari Abu Sahl ibn Nawbakht adalah seorang teolog dan filsuf yang bergabung dengan sekelompok ulama filsafat seperti Abu Uthman al-Dimashqi, Ishaq, Thabit, dan lainnya. Kaum Mu'tazilit mengklaimnya dan Syiah mengklaimnya, tetapi ia lebih dekat dengan kerajaan Syiah karena keluarga Nawbakht dikenal karena penampilan mereka yang menjaga Ali dan keturunannya. Ia adalah penyusun buku dan menyalin banyak hal dengan tulisan tangannya sendiri serta menulis karya-karya dan karya dalam teologi, filsafat, dan lainnya. Di antara bukunya adalah buku 'Pendapat dan Agama yang tidak ia selesaikan,' buku 'Penolakan Umat Reinkarnasi,' 'Hadis al-Milal,' penolakan terhadap buku Abu Isa tentang orang asing dari Timur, buku 'Ikhtisar al-Kawn wa al-Fad' oleh Aristantis, buku 'Ihtijij' oleh Umar ibn 'Abbad dan dukungan dari aljarannya, serta buku 'Imamamate, yang tidak selesai' {cite::Fihrist-ibn-al-Nadim hlm. 251-252}."
