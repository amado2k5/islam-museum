label: { ar: "الحسن بن موسى النوبختي", en: "Al Hasan Ibn Musa Al Nawbakhti" }
summary:
  ar: "أبو محمد الحسن بن موسى بن أخت أبي سهل بن نوبخت متكلم فيلسوف كان يجتمع إليه جماعة من النقلة لكتب الفلسفة مثل أبي عثمان الدمشقي وإسحاق وثابت وغيرهم وكانت المعتزلة تدعيه والشيعة تدعيه ولكنه إلى حيز الشيعة أقرب لأن آل نوبخت معروفون بولاية علي وولده في الظاهر، وكان جامعا للكتب قد نسخ بخطه شيئا كثيرا وله مصنفات وتأليفات في الكلام والفلسفة وغيرها، وله من الكتب كتاب الآراء والديانات ولم يتمه وكتاب الرد على أصحاب التناسخ وكتاب التوحيد وحدث الملل وكتاب نقض كتاب أبي عيسى في الغريب المشرقي وكتاب اختصار اختصار الكون والفساد لأرستاليس وكتاب الاحتجاج لعمر بن عباد ونصرة مذهبه وكتاب الإمامة ولم يتمه {cite:fihrist-ibn-al-nadim p. 251-252}."
  en: "Al-Hasan ibn Musa al-Nawbakhti — the Shi'i philosopher-theologian, author of the unfinished Books of Creeds and of the Imamate {cite:fihrist-ibn-al-nadim}"
