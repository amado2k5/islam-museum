summary:
  ar: "أبو الحسن الشيرجي الفرضي الحاسب، أخذ الفرائض عن ابن اللبان، وذكره الشيرازي بـ«شيخنا»، وكان ابن اللبان يقول: ليس في الأرض فرضي إلا من أصحابي أو أصحاب أصحابي أو لا يحسن شيئاً {cite:tabaqat-fuqaha-abbas-1981 p. 63}. لم يذكر الشيرازي وفاته."
  en: "Abu al-Hasan al-Shirji al-Faradi al-Hasib studied the law of inheritance under Ibn al-Labban. Al-Shirazi calls him 'our shaykh'. Ibn al-Labban used to say: no one on earth is an expert in inheritance unless he is one of my companions or their companions, or else he knows nothing well {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi does not record his death."
