summary:
  ar: "مؤرخ وأديب وصحفي سوري (1876–1953)، مؤسس مجمع اللغة العربية بدمشق وأول رئيس له (1919) حتى وفاته، وأول وزير للمعارف في سورية؛ أصدر مجلة «المقتبس» في القاهرة ودمشق، ومن أشهر كتبه «خطط الشام» و«الإسلام والحضارة العربية» ومذكراته."
  en: "Syrian historian, man of letters and journalist (1876–1953), founder of the Academy of the Arabic Language in Damascus and its president from 1919 until his death, and Syria's first minister of education; he published the journal al-Muqtabas in Cairo and Damascus, and his works include Khitat al-Sham, al-Islam wa-l-hadara al-arabiyya and his memoirs."
  ur: "سوری مؤرخ، ادیب اور صحافی (1876–1953)، دمشق میں عربی زبان اکیڈمی کے بانی اور 1919 سے وفات تک اس کے پہلے صدر، اور شام کے پہلے وزیرِ تعلیم؛ انہوں نے قاہرہ و دمشق میں مجلہ «المقتبس» جاری کیا، اور ان کی مشہور کتب میں «خطط الشام»، «الإسلام والحضارة العربية» اور ان کی یادداشتیں شامل ہیں۔"
