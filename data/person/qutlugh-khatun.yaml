summary:
  ar: "قطلغ خاتون أرملة قطب الدين محمد بن خانات قطلغ؛ حكمت كرمان من سنة 655 إلى سنة 681هـ في طاعة الإيلخانيين، وكان ابنها حجاج الحاكم الرسمي بين سنتي 660 و700هـ، وهي من أشهر الملكات اللواتي استقللن بالحكم في عصر المغول."
  en: "Qutlugh Khatun, widow of Qutb al-Din Muhammad of the Qutlugh khans; she ruled Kirman from 655 to 681 under Ilkhanid suzerainty — her son Hajjaj the nominal ruler between 660 and 700 — among the most famous women to hold sovereign rule in the Mongol age."
  es: "Qutlugh Khatun, viuda de Qutb al-Din Muhammad de los kanes Qutlugh; gobernó Kirman desde 655 hasta 681 bajo la soberanía Iljánida —su hijo Hajjaj fue el gobernante nominal entre 660 y 700—, siendo una de las mujeres más famosas que ostentaron el poder soberano en la era mongola."
  fr: "Qutlugh Khatun, veuve de Qutb al-Din Muhammad des khans Qutlugh; elle a régné sur Kirman de 655 à 681 sous la suzeraineté ilkhanide — son fils Hajjaj étant le souverain nominal entre 660 et 700 — parmi les femmes les plus célèbres à avoir exercé un pouvoir souverain à l'époque mongole."
