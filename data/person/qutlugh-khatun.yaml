  ar: "قطلغ خاتون أرملة قطب الدين محمد بن خانات قطلغ؛ حكمت كرمان من سنة 655 إلى سنة 681هـ في طاعة الإيلخانيين، وكان ابنها حجاج الحاكم الرسمي بين سنتي 660 و700هـ، وهي من أشهر الملكات اللواتي استقللن بالحكم في عصر المغول."
  en: "Qutlugh Khatun, widow of Qutb al-Din Muhammad of the Qutlugh khans; she ruled Kirman from 655 to 681 under Ilkhanid suzerainty — her son Hajjaj the nominal ruler between 660 and 700 — among the most famous women to hold sovereign rule in the Mongol age."
