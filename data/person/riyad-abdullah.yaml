summary:
  ar: "داعية إثيوبي يعمل بالأفان أورومو؛ بلغت صفحته على فيسبوك (@riyadabdaallah) 280,000 متابع بحسب قراءة حصاد الموجة لبيانات منشوراته في 7 نوفمبر 2026 — وقد تعذّر فتح ملف فيسبوك مباشرة في بيئة هذا البناء فالرقم قائم على تلك القراءة لا على قراءة مباشرة — وتُنشر محاضراته بالأفان أورومو على قناة «إيفا رحماتا تي في» على يوتيوب، التي سجّلت منشورة على صفحته في 7 يونيو 2026 بلوغها 80,000 مشترك وأكثر من 670 مقطعًا بحسب قراءة الحصاد."
  en: "Ethiopian dawah preacher working in Afaan Oromo; his Facebook page (@riyadabdaallah) counted 280,000 followers by the wave harvest's read of his posts' metadata on 7 November 2026 — Facebook profile fetch is blocked in this build environment, so the figure rests on that same-day harvest read, not a direct read. His Afaan Oromo lectures are published on the Ifa Rahmataa TV YouTube channel, which a milestone post on his page on 7 June 2026 marked at 80,000 subscribers and more than 670 videos (harvest read)."
  ur: "ایتھوپیا کے مبلغ جو افان اورومو زبان میں دعوت دیتے ہیں؛ ان کے فیس بک صفحے (@riyadabdaallah) کے فالوور 7 نومبر 2026ء کو ان کی پوسٹوں کے میٹا ڈیٹا کی لہر کی فصل خوانی کے مطابق 280,000 تھے — فیس بک پروفائل اس تعمیراتی ماحول میں براہِ راست نہیں کھلتا، اس لیے یہ عدد اسی دن کی فصل خوانی پر مبنی ہے، براہِ راست خوانی پر نہیں — اور ان کے افان اورومو خطبات یوٹیوب چینل «ایفا رحمتا ٹی وی» پر شائع ہوتے ہیں، جس کے 7 جون 2026ء کو ان کے صفحے پر شائع سنگِ میل پوسٹ کے مطابق 80,000 سبسکرائبر اور 670 سے زائد ویڈیوز تھے ⁦(فصل خوانی)⁩۔"
