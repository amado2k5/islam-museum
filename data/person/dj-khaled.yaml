summary:
  ar: "منسّق موسيقى ومنتج أمريكي من أصل فلسطيني، وُلد باسم خالد محمد خالد في نيو أورليانز سنة 1975. اشتهر مذيعًا في إذاعة ميامي ثم منتجًا مع جماعة «تيرور سكواد»، وأصدر ألبومات تصدرت قوائم بيلبورد منها «مفتاح النجاح» (Major Key) سنة 2016، ووصف نفسه سنة 2014 بأنه مسلم متدين وأدّى العمرة في ديسمبر 2022."
  en: "American DJ and record producer of Palestinian descent, born Khaled Mohammed Khaled in New Orleans in 1975. He rose as a Miami radio host and a producer with Terror Squad, and released chart-topping albums including Major Key (2016); in 2014 he described himself as a devout Muslim, and in December 2022 he performed the Umrah."
  ur: "فلسطینی نژاد امریکی ڈی جے و ریکارڈ پروڈیوسر، جو 1975 میں نیو اورلینز میں خالد محمد خالد کے نام سے پیدا ہوئے۔ وہ میامی ریڈیو میزبان اور «ٹیرر اسکواڈ» کے پروڈیوسر کے طور پر مشہور ہوئے اور «میجر کی» (2016) سمیت چارٹ پر اول آنے والے البم جاری کیے؛ 2014 میں انہوں نے خود کو ایک مذہبی مسلمان کہا اور دسمبر 2022 میں عمرہ ادا کیا۔"
  es: "DJ y productor discográfico estadounidense de ascendencia palestina, nacido como Khaled Mohammed Khaled en Nueva Orleans en 1975. Saltó a la fama como locutor de radio en Miami y productor con Terror Squad, y lanzó álbumes que alcanzaron los primeros puestos de las listas, incluido Major Key (2016); en 2014 se describió a sí mismo como un musulmán devoto, y en diciembre de 2022 realizó la Umrah."
  fr: "DJ et producteur de disques américain d'origine palestinienne, né Khaled Mohammed Khaled à la Nouvelle-Orléans en 1975. Il s'est fait connaître comme animateur radio à Miami et producteur avec Terror Squad, et a sorti des albums en tête des charts, dont Major Key (2016); en 2014, il s'est décrit comme un musulman fervent, et en décembre 2022, il a accompli l'Umrah."
  tr: "Filistin kökenli Amerikalı müzik düzenleyicisi ve yapımcısı, 1975'te New Orleans'ta Khaled Mohammed Khaled olarak doğdu. Miami'de radyo sunuculuğu yaparak ve ardından Terror Squad grubunda yapımcı olarak ün kazandı. 2016'da \"Major Key\" dahil olmak üzere Billboard listelerinde zirveye çıkan albümler çıkardı ve 2014'te kendini dindar bir Müslüman olarak tanımlayarak Aralık 2022'de Umre'yi seslendirdi."
  id: "Seorang arranger dan produser musik Amerika keturunan Palestina, lahir dengan nama Khaled Mohammed Khaled di New Orleans pada tahun 1975. Ia menjadi terkenal sebagai pembawa acara radio di Miami dan kemudian sebagai produser bersama grup Terror Squad. Ia merilis album yang memuncaki tangga lagu Billboard termasuk \"Major Key\" pada tahun 2016, dan pada tahun 2014 ia menggambarkan dirinya sebagai Muslim yang taat dan membawakan Umrah pada Desember 2022."
