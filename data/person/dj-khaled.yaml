summary:
  ar: "منسّق موسيقى ومنتج أمريكي من أصل فلسطيني، وُلد باسم خالد محمد خالد في نيو أورليانز سنة 1975. اشتهر مذيعًا في إذاعة ميامي ثم منتجًا مع جماعة «تيرور سكواد»، وأصدر ألبومات تصدرت قوائم بيلبورد منها «مفتاح النجاح» (Major Key) سنة 2016، ووصف نفسه سنة 2014 بأنه مسلم متدين وأدّى العمرة في ديسمبر 2022."
  en: "American DJ and record producer of Palestinian descent, born Khaled Mohammed Khaled in New Orleans in 1975. He rose as a Miami radio host and a producer with Terror Squad, and released chart-topping albums including Major Key (2016); in 2014 he described himself as a devout Muslim, and in December 2022 he performed the Umrah."
  ur: "فلسطینی نژاد امریکی ڈی جے و ریکارڈ پروڈیوسر، جو 1975 میں نیو اورلینز میں خالد محمد خالد کے نام سے پیدا ہوئے۔ وہ میامی ریڈیو میزبان اور «ٹیرر اسکواڈ» کے پروڈیوسر کے طور پر مشہور ہوئے اور «میجر کی» (2016) سمیت چارٹ پر اول آنے والے البم جاری کیے؛ 2014 میں انہوں نے خود کو ایک مذہبی مسلمان کہا اور دسمبر 2022 میں عمرہ ادا کیا۔"
