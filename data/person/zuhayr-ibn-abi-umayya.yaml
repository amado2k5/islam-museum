summary:
  en: "A Makhzumi notable whose mother was Atika bint Abd al-Muttalib; the first among the five Meccan leaders to publicly challenge and break the boycott charter in the Haram."
  ar: "وجيه مخزومي أمه عاتكة بنت عبد المطلب عمة النبي؛ أول من تكلم في نقض صحيفة المقاطعة في الحرم، فطاف بالبيت وخطب في أهل مكة حتى تتابع معه النفر الخمسة."
  es: "Un notable de Makhzumi cuya madre era Atika bint Abd al-Muttalib; el primero de los cinco líderes de La Meca en desafiar públicamente y romper la carta de boicot en el Haram."
  fr: "Un notable de Makhzumi dont la mère était Atika bint Abd al-Muttalib; le premier parmi les cinq dirigeants mecquois à contester et à enfreindre publiquement la charte de boycott dans le Haram."
  ur: "ایک مخزومی قابل ذکر جس کی والدہ عتیقہ بنت عبدالمطلب تھیں۔ مکہ کے پانچ رہنمائوں میں سب سے پہلے جنہوں نے حرم میں بائیکاٹ کے چارٹر کو عوامی طور پر چیلنج کیا اور توڑا۔"
  tr: "Annesi Peygamber'in teyzesi Atika bint Abdul-Muttalib olan Wajih Makhzumi, Haram'daki boykot yasağına karşı çıkan ilk kişi oldu. Evi dolaştı ve Mekke halkı arasında vaazlar verdi, ta ki beş adam onu takip edene kadar."
  id: "Wajih Makhzumi, yang ibunya adalah Atika bint Abdul-Muttalib, bibi Nabi; ia adalah yang pertama berbicara menentang larangan Boikot dalam Haram. Ia mengelilingi rumah dan menyampaikan khotbah di antara rakyat Mekah hingga kelima pria itu mengikutinya."
