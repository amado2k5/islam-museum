summary:
  ar: طبيب وأستاذ جامعي فلسطيني-كندي وُلد سنة 1955 في مخيم جباليا. أول طبيب فلسطيني يعمل في مستشفيات إسرائيلية، وبعد مقتل بناته الثلاث في قصف 2009 أسّس مؤسسة «بنات من أجل الحياة» للتعليم والسلام.
  en: Palestinian-Canadian physician and professor, born 1955 in Jabalia refugee camp. The first Palestinian doctor to work in Israeli hospitals; after the killing of his three daughters in a 2009 strike
    he founded the Daughters for Life Foundation for education and peace.
  ur: فلسطینی-کینیڈین طبیب اور پروفیسر، 1955 میں جبالیا کیمپ میں پیدا ہوئے۔ اسرائیلی اسپتالوں میں کام کرنے والے پہلے فلسطینی طبیب؛ 2009 کے حملے میں اپنی تین بیٹیوں کی ہلاکت کے بعد انہوں نے تعلیم اور امن
    کے لیے ڈاٹرز فار لائف فاؤنڈیشن قائم کی۔
  es: "Médico y profesor palestino-canadiense, nacido en 1955 en el campo de refugiados de Jabalia. Fue el primer médico palestino en trabajar en hospitales israelíes; tras el asesinato de sus tres hijas en una huelga en 2009, fundó la Fundación Hijas por la Vida para la educación y la paz."
  fr: "Médecin et professeur palestino-canadien, né en 1955 dans le camp de réfugiés de Jabalia. Premier médecin palestinien à exercer dans des hôpitaux israéliens; après la mort de ses trois filles lors d’une grève en 2009, il a fondé la Fondation Filles pour la Vie, dédiée à l’éducation et à la paix."
  tr: "1955 yılında Jabalia kampında doğmuş Filistinli-Kanadalı doktor ve üniversite profesörü. İsrail hastanelerinde çalışan ilk Filistinli doktor olan ve 2009 bombalamasında üç kızı öldükten sonra, 'Yaşam İçin Kızlar' Eğitim ve Barış Vakfı'nı kurdu."
  id: "Seorang dokter dan profesor universitas Palestina-Kanada yang lahir pada tahun 1955 di kamp Jabalia. Dokter Palestina pertama yang bekerja di rumah sakit Israel, dan setelah tiga putrinya tewas dalam pengeboman tahun 2009, ia mendirikan Yayasan 'Girls for Life' untuk Pendidikan dan Perdamaian."
