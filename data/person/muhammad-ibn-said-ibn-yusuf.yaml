id: person/muhammad-ibn-said-ibn-yusuf
class: person
label:
  ar: محمد بن سعيد بن يوسف
  en: Muhammad ibn Sa'id ibn Yusuf
  ur: محمد بن سعید بن یوسف
  es: "Muhammad ibn Sa'id ibn Yusuf"
  fr: "Muhammad ibn Sa'id ibn Yusuf"
summary:
  ar: من صحبة الهادي ومستشاريه، قال له الهادي في صفحة 108 إنه عازم على الاحتجاب بعد نهب أثافت، وأشار عليه مع محمد بن سليمان بالرفق بالقوم واستتابتهم؛ والاسم من فهرس الكتاب «محمد بن سعيد بن يوسف».
  en: 'One of al-Hadi''s companions and advisers: after the plunder of Athafit al-Hadi told him on p. 108 that he meant to withdraw, and he and Muhammad ibn Sulayman advised gentleness with the people and asking them to repent; the full name is from the book''s index, "Muhammad ibn Sa''id ibn Yusuf".'
  ur: ہادی کے ساتھیوں اور مشیروں میں سے؛ اثافت کی لوٹ کے بعد ہادی نے صفحہ 108 پر انہیں بتایا کہ وہ گوشہ نشینی کا ارادہ رکھتے ہیں، اور انہوں نے محمد بن سلیمان کے ساتھ مل کر لوگوں سے نرمی اور توبہ کرانے کا مشورہ دیا؛ پورا نام کتاب کے اشاریے کے «محمد بن سعید بن یوسف» سے ہے۔
  es: "Uno de los compañeros y consejeros de al-Hadi: después del saqueo de Athafit, al-Hadi le dijo en la página 108 que tenía la intención de retirarse, y él y Muhammad ibn Sulayman aconsejaron gentileza con la gente y pedirles que se arrepintieran; el nombre completo proviene del índice del libro, \"Muhammad ibn Sa'id ibn Yusuf\"."
  fr: "L'un des compagnons et conseillers d'al-Hadi: après le pillage d'Athafit, al-Hadi lui a dit à la page 108 qu'il avait l'intention de se retirer, et lui et Muhammad ibn Sulayman ont conseillé la douceur envers le peuple et lui ont demandé de se repentir; le nom complet est tiré de l'index du livre, « Muhammad ibn Sa'id ibn Yusuf »."
  tr: "El-Hadi'nin yoldaşları ve danışmanları arasında, el-Hadi sayfa 108'de ona Hırsız'ın yağmalanmasından sonra saklanmaya kararlı olduğunu söyledi ve Muhammed bin Süleyman'a halka nazik davranmasını ve onları tövbe ettirmesini tavsiye etti; kitabın dizinindeki isim 'Muhammed ibn Seyid ibn Yusuf'dur."
  id: "Di antara para sahabat dan penasihat al-Hadi, al-Hadi memberitahunya di halaman 108 bahwa ia bertekad untuk bersembunyi setelah penjarahan terhadap Pencuri, dan ia menasihati Muhammad ibn Sulayman untuk bersikap lembut kepada rakyat dan membuat mereka bertobat; nama dari indeks kitab tersebut adalah 'Muhammad ibn Sa'id ibn Yusuf.'"
