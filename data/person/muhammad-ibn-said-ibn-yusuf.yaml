id: person/muhammad-ibn-said-ibn-yusuf
class: person
label:
  ar: محمد بن سعيد بن يوسف
  en: Muhammad ibn Sa'id ibn Yusuf
  ur: محمد بن سعید بن یوسف
summary:
  ar: من صحبة الهادي ومستشاريه، قال له الهادي في صفحة 108 إنه عازم على الاحتجاب بعد نهب أثافت، وأشار عليه مع محمد بن سليمان بالرفق بالقوم واستتابتهم؛ والاسم من فهرس الكتاب «محمد بن سعيد بن يوسف».
  en: 'One of al-Hadi''s companions and advisers: after the plunder of Athafit al-Hadi told him on p. 108 that he meant to withdraw, and he and Muhammad ibn Sulayman advised gentleness with the people and asking them to repent; the full name is from the book''s index, "Muhammad ibn Sa''id ibn Yusuf".'
  ur: ہادی کے ساتھیوں اور مشیروں میں سے؛ اثافت کی لوٹ کے بعد ہادی نے صفحہ 108 پر انہیں بتایا کہ وہ گوشہ نشینی کا ارادہ رکھتے ہیں، اور انہوں نے محمد بن سلیمان کے ساتھ مل کر لوگوں سے نرمی اور توبہ کرانے کا مشورہ دیا؛ پورا نام کتاب کے اشاریے کے «محمد بن سعید بن یوسف» سے ہے۔
