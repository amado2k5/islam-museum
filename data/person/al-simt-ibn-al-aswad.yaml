id: person/al-simt-ibn-al-aswad
class: person
label: { ar: "السمط بن الأسود الكندي", en: "al-Simt ibn al-Aswad al-Kindi" }
summary:
  ar: "قائد كندي من فرسان أبي عبيدة بن الجراح في فتوح الشام؛ ولّاه أبو عبيدة على حمص بعد فتحها — وقيل شُرحبيل بن السمط — ثم وجّهه إلى قنسرين حين نقض أهلها وغدروا فحصرهم وفتحها؛ وروى عبادة بن نسي عن عبد الرحمن بن غنم أنه رابط مع السمط مدينة قنسرين فلما فتحها أصاب فيها بقراً وغنماً فقسم فيهم طائفة منها وجعل بقيتها في المغنم."
  en: "A Kindi commander of Abu Ubayda ibn al-Jarrah in the Syrian conquests; Abu Ubayda set him over Hims after its fall — or by another report Shurahbil ibn al-Simt — then sent him against Qinnasrin when its people broke faith, and he besieged and took it; Ubada ibn Nusayy reported from Abd al-Rahman ibn Ghanm that he kept ribat with al-Simt at Qinnasrin and when it fell cattle and sheep were taken, a portion divided among them and the rest placed in the spoil."
