id: person/muhammad-ibn-al-hasan-al-alawi
class: person
label: { ar: "محمد بن الحسن بن جعفر العلوي" }
summary:
  ar: "العلوي الطالبي؛ دخل هو وأخوه علي المدينة في غرة صفر سنة 271هـ وقتل جماعة من أهلها وطالبوهم بالمال ولم يصل أهل المدينة في مسجد رسول الله أربع جمع لا جمعة ولا جماعة {cite:muntazam-ibn-al-jawzi p. 101}."
  en: "Muhammad ibn al-Hasan ibn Ja'far the Talibid; he and his brother Ali stormed Medina in Safar 271, killing townsmen and levying money, so that no Friday nor congregational prayer was held in the Prophet's mosque for four weeks {cite:muntazam-ibn-al-jawzi p. 101}."
  es: "Muhammad ibn al-Hasan ibn Ja'far el talibí; él y su hermano Ali asaltaron Medina en Safar 271, matando a los habitantes y extorsionando, de modo que no se celebró ninguna oración del viernes ni oración congregacional en la mezquita del Profeta durante cuatro semanas {cite:muntazam-ibn-al-jawzi p. 101}."
  fr: "Muhammad ibn al-Hasan ibn Ja'far le Talibid; lui et son frère Ali ont pris d'assaut Médine en Safar 271, tuant des citadins et levant de l'argent, de sorte qu'aucune prière du vendredi ni prière en congrégation n'a été tenue dans la mosquée du Prophète pendant quatre semaines {cite:muntazam-ibn-al-jawzi p. 101}."
  ur: "محمد بن الحسن ابن جعفر طالب۔ اس نے اور اس کے بھائی علی نے صفر 271 میں مدینہ پر دھاوا بولا، شہر والوں کو قتل کیا اور رقم وصول کی، تاکہ چار ہفتوں تک مسجد نبوی میں جمعہ یا جماعت کی نماز نہیں ہوئی۔ 101}۔"
  tr: "El-Alavi el-Talibi; kendisi ve kardeşi Ali, 271 Hicri yılının ilk Seferinde Medine'ye girdiler, oradaki bir grup halkı öldürdüler, onlardan para istediler ve Medine halkı Allah'ın Elçisi Camii'nde dört cuma namazı etmedi, ne cuma namazı ne de cemaat namazı {cite:muntazam-ibn-al-jawzi, s. 101}."
  id: "Al-Alawi Al-Talibi; ia dan saudaranya Ali memasuki Madinah pada tanggal 1 Safar tahun 271 H, membunuh sekelompok penduduknya, menuntut uang dari mereka, dan rakyat Madinah tidak berdoa empat Jumat di Masjid Rasulullah, baik Jumat maupun salat jamaah {cite:muntazam-ibn-al-jawzi, hlm. 101}."
