summary:
  ar: "أبو بكر محمد بن علي بن إسماعيل القفال الشاشي. درس على أبي العباس ابن سريج، وكان إماماً وله مصنفات كثيرة، وهو أول من صنّف الجدل الحسن من الفقهاء، وله كتاب في أصول الفقه، وله «شرح الرسالة»، وعنه انتشر فقه الشافعي فيما وراء النهر {cite:tabaqat-fuqaha-abbas-1981 p. 59}. قال الشيرازي إنه مات سنة ست وثلاثين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}، ونقل ابن خلكان اختلافاً في وفاته، منها أنه توفي بالشاش سنة خمس وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Abu Bakr Muhammad ibn Ali ibn Isma'il al-Qaffal al-Shashi. He studied under Abu al-Abbas Ibn Surayj; he was an imam with many works, and the first of the jurists to write on fine disputation (al-jadal al-hasan). He wrote a book on the roots of jurisprudence and a commentary on al-Risala, and through him the Shafi'i school spread in Transoxiana {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi said he died in 336 {cite:tabaqat-fuqaha-abbas-1981 p. 59}; Ibn Khallikan reports disagreement about his death, among it that he died at al-Shash in 365 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
