summary:
  ar: "أبو بكر محمد بن علي بن إسماعيل القفال الشاشي. درس على أبي العباس ابن سريج، وكان إماماً وله مصنفات كثيرة، وهو أول من صنّف الجدل الحسن من الفقهاء، وله كتاب في أصول الفقه، وله «شرح الرسالة»، وعنه انتشر فقه الشافعي فيما وراء النهر {cite:tabaqat-fuqaha-abbas-1981 p. 59}. قال الشيرازي إنه مات سنة ست وثلاثين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}، ونقل ابن خلكان اختلافاً في وفاته، منها أنه توفي بالشاش سنة خمس وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Abu Bakr Muhammad ibn Ali ibn Isma'il al-Qaffal al-Shashi. He studied under Abu al-Abbas Ibn Surayj; he was an imam with many works, and the first of the jurists to write on fine disputation (al-jadal al-hasan). He wrote a book on the roots of jurisprudence and a commentary on al-Risala, and through him the Shafi'i school spread in Transoxiana {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi said he died in 336 {cite:tabaqat-fuqaha-abbas-1981 p. 59}; Ibn Khallikan reports disagreement about his death, among it that he died at al-Shash in 365 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  fr: "Abou Bakr Muhammad ibn Ali ibn Isma'il al-Qaffal al-Shashi. Il a étudié sous Abu al-Abbas Ibn Surayj ; il était un imam avec de nombreux travaux, et le premier des juristes à écrire sur la dispute fine (al-jadal al-hasan). Il a écrit un livre sur les racines de la jurisprudence et un commentaire sur al-Risala, et à travers lui l'école chaféite répandue en Transoxiane {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi dit qu'il est mort en 336 {cite:tabaqat-fuqaha-abbas-1981 p. 59}Ibn Khallikan rapporte des désaccords sur sa mort, parmi lesquels il est mort à al-Shash en 365 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  es: "Abu Bakr Muhammad ibn Ali ibn Isma'il al-Qaffal al-Shashi. Estudió con Abu al-Abbas Ibn Surayj; fue un imán con numerosas obras y el primero de los juristas en escribir sobre la fina disputa (al-jadal al-hasan). Escribió un libro sobre las raíces de la jurisprudencia y un comentario sobre al-Risala, y a través de él se extendió la escuela Shafi'i en Transoxiana {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Shirazi dijo que murió en 336 {cite:tabaqat-fuqaha-abbas-1981 p. 59}; Ibn Khallikan informa de discrepancias sobre su muerte, entre ellas que murió en al-Shash en 365 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  ur: "ابوبکر محمد بن علی ابن اسماعیل القفل الشاشی۔ انہوں نے ابو العباس ابن سریج سے تعلیم حاصل کی۔ وہ بہت سے کاموں کے ساتھ ایک امام تھے، اور فقہاء میں سے سب سے پہلے جنہوں نے عمدہ اختلاف ⁦(الجدال الحسن)⁩ پر لکھا۔ انہوں نے فقہ کی جڑوں پر ایک کتاب اور الرسالہ کی تفسیر لکھی اور اس کے ذریعے سے ٹرانسوکسیانہ میں شافعی مکتب پھیل گیا۔ 59}۔ الشیرازی نے کہا کہ ان کی وفات سنہ 336 میں ہوئی۔ 59}; ابن خلیقان نے ان کی وفات کے بارے میں اختلاف بیان کیا ہے، ان میں یہ ہے کہ ان کی وفات الشاش میں 365 میں ہوئی۔ 59}۔"
  tr: "Ebu Bekir Muhammed bin Ali ibn İsmayıl el-Qaffal el-Şaşi. Ebu el-Abbas bin Surayc'ın yanında eğitim aldı, imamdı, birçok eser yazdı ve 'al-Cadib el-Hasan'ı hukukçular arasında derleyen ilk hukukçu oldu.' Fıkıh ilkeleri üzerine bir kitap yazdı ve 'Şerh el-Risalah'ı yazdı; Şafii fıkhı nehrin ötesine yayıldı {atıf:tabaqat-fuqaha-abbas-1981, s. 59}. El-Şirazi 336 Hicri yılında öldüğünü söyledi {atıf:tabaqat-fuqaha-abbas-1981, s. 59}. İbn Hallikan ölümüyle ilgili bazı farklılıklar aktardı; bunlar arasında 365 Hicri yılında gazlı bezden öldüğünü de belirtti {cite:tabaqat-fuqaha-abbas-1981, s. 59}."
  id: "Abu Bakr Muhammad ibn Ali ibn Isma'il al-Qaffal al-Shashi. Ia belajar di bawah bimbingan Abu al-Abbas ibn Surayj, menjadi imam, menulis banyak karya, dan merupakan ahli hukum pertama yang menyusun 'al-Jadib al-Hasan di antara para ahli hukum.' Ia menulis buku tentang prinsip-prinsip fiqhdan dan menulis 'Sharh al-Risalah,' dari mana yurisprudensi Shafi'i menyebar ke seberang sungai {cite:tabaqat-fuqaha-abbas-1981, hlm. 59}. Al-Shirazi mengatakan ia meninggal pada tahun 336 H {cite:tabaqat-fuqaha-abbas-1981, hlm. 59}. Ibn Khallikan menyampaikan beberapa perbedaan terkait kematiannya, termasuk bahwa ia meninggal karena kain kasa pada tahun 365 H {cite:tabaqat-fuqaha-abbas-1981, hlm. 59}."
