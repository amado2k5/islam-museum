summary:
  ar: من بني سعد بن بكر، عدّه أبو موسى وغيره عماً للنبي من الرضاعة؛ وخبره عن الحيرة ضعيف عند ابن حجر لأن في سنده عيسى بن يزيد المعروف بابن دأب وقد كذّبوه.
  en: Of the Banu Sa'd ibn Bakr and reckoned a foster-uncle of the Prophet. The only report about him, on al-Hira, is weak in Ibn Hajar's assessment because its transmitter Isa ibn Yazid (Ibn Da'b) was accused of lying.
  ur: "بنو سعد بن بکر کے اور نبی کا رضاعی چچا شمار کیا جاتا ہے؛ ان کے بارے میں حیرہ کی ایک ہی کمزور روایت ہے۔"
  fr: "Des Banu Sa'd ibn Bakr, compté comme oncle de lait du Prophète. Le seul récit à son sujet, sur al-Hira, est faible selon l'évaluation d'Ibn Hajar, car son transmetteur Isa ibn Yazid (Ibn Da'b) fut accusé de mensonge."
  es: "Pertenecía a la tribu Banu Sa'd ibn Bakr y era considerado tío adoptivo del Profeta. El único relato sobre él, publicado en al-Hira, es poco fiable según la valoración de Ibn Hajar, ya que su transmisor, Isa ibn Yazid (Ibn Da'b), fue acusado de mentir."
  tr: "Saad bin Bekr kabilesinden olan Ebu Musa ve diğerleri onu Peygamberin üvey amcası olarak kabul ettiler; İbn Hacer'e göre Hira hakkındaki rivayeti zayıftır çünkü rivayet zincirinde İbn Daab olarak bilinen İsa bin Yazid de bulunmaktadır ve onu yalan söylemekle suçlamışlardır."
  id: "Dari suku Saad bin Bakr, Abu Musa dan yang lainnya menganggapnya sebagai paman angkat Nabi; dan riwayatnya tentang Hira lemah menurut Ibnu Hajar karena dalam sanadnya terdapat Isa bin Yazid, yang dikenal sebagai Ibnu Daab, dan mereka menuduhnya berbohong."
