summary:
  ar: "عازف سارنغي (1880–1955)، وُلد في دلهي وتعلّم على يد خاله ممّن خان، وخدم بلاط إندور 27 عاما وكان من أوائل عازفي إذاعة عموم الهند. ألف كتابا في نظرية الموسيقى صدر بالأردية والهندية سنة 1934، وبعد تقسيم الهند هاجر إلى كراتشي وظل يعزف في إذاعات باكستان حتى وفاته."
  en: "Sarangi player (1880–1955), born at Delhi and trained by his uncle Mamman Khan; he served the court of Indore for 27 years and played on All India Radio from its first Delhi broadcasts. His book on music theory appeared in Urdu and Hindi in 1934; after Partition he moved to Karachi and played on Pakistan's radio stations until his death."
  ur: "سارنگی نواز (1880ء–1955ء)، دہلی میں پیدا ہوئے اور ماموں ممّن خان سے تعلیم پائی؛ وہ اندور کے دربار سے ستائیس برس وابستہ رہے اور آل انڈیا ریڈیو کے اولین نوازوں میں تھے۔ ان کی موسیقی پر کتاب 1934ء میں اردو اور ہندی میں شائع ہوئی؛ تقسیم کے بعد کراچی آ گئے اور وفات تک پاکستان کے ریڈیو سے سارنگی بجاتے رہے۔"
