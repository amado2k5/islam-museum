class: person
label: { ar: "بشر بن مروان", en: "Bishr ibn Marwan", es: "Bishr ibn Marwan", fr: "Bishr ibn Marwan", ur: "بشر بن مروان" }
summary:
  ar: "أخو عبد الملك بن مروان، ولاه أخوه الكوفة سنة ثلاث وسبعين وكان أديباً ظريفاً يحب الشعر والسمر والسماع والمعاقرة، وقال له أخوه إن روح بن زنباع عمك الذي لا ينبغي أن تقطع أمراً دونه، فاحتال نادم له على روح فكتب على حائط حجرته إن ابن مروان قد حانست منيته فاحتل لنفسك حتى غادر روح إلى عبد الملك {cite:muruj-al-dhahab p. 102-104}."
  en: "Abd al-Malik's brother, Kufa's governor — an adab-loving bon-vivant whose courtier expel his uncle Ruh by a wall-poem warning that 'Ibn Marwan's hour approaches' {cite:muruj-al-dhahab p. 102-104}."
  es: "El hermano de Abd al-Malik, gobernador de Kufa, un bon vivant amante del adab cuyo cortesano expulsó a su tío Ruh mediante un poema mural que advertía que \"se acerca la hora de Ibn Marwan\" {cite:muruj-al-dhahab p. 102-104}."
  fr: "Le frère d'Abd al-Malik, gouverneur de Kufa — un bon vivant amoureux de l'adab dont le courtisan expulse son oncle Ruh par un poème mural avertissant que « l'heure d'Ibn Marwan approche » {cite:muruj-al-dhahab p. 102-104}."
  ur: "عبد الملک کا بھائی، کوفہ کا گورنر - ایک ادب سے محبت کرنے والا بون وونٹ جس کے درباری نے اپنے چچا روح کو ایک دیواری نظم کے ذریعے متنبہ کیا کہ 'ابن مروان کا وقت قریب آ رہا ہے'۔ 102-104}۔"
  tr: "Abd al-Malik ibn Marwan'ın kardeşiydi ve kardeşi onu yetmiş üçüncü yılda Kufe'ye atadı. Esprili bir edebiyat adamıydı ve şiiri, toplantıları, saba'a ve 'ma'karah'ı severdi. Kardeşi ona, 'Ruh ibn Zanba' senin amcandır ve hiçbir şeyin onunla karar verilmesi gerekir, dedi. Sonra Ruh'u kandırdı ve odasının duvarına İbn Mervan'ın ölümünü çektiğini yazdı, böylece Ruh Abdül-Malik'e gidene kadar kendine baktı {atıf:muruj-al-dhahab s. 102-104}."
  id: "Ia adalah saudara Abd al-Malik ibn Marwan, dan saudaranya mengangkatnya menjadi Kufa pada tahun tujuh puluh tiga. Ia adalah seorang sastra yang cerdas dan menyukai puisi, pertemuan, saba'a, dan 'ma'qarah. Saudaranya berkata kepadanya, 'Ruh ibn Zanba' adalah pamanmu, yang tidak perlu diputuskan dengan siapa pun urusan Anda. Ia kemudian menipu Ruh dan menulis di dinding kamarnya bahwa Ibn Marwan telah meninggal dunia, sehingga ia menjaga dirinya sendiri hingga Ruh pergi ke Abd al-Malik {cite:muruj-al-dhahab hlm. 102-104}."
