summary:
  ar: "محمد بن علي السنوسي الخطابي الإدريسي (ت ١٢٧٥هـ/١٨٥٩م)؛ زعيم الطريقة السنوسية الأول ومؤسسها. ولد في مستغانم من أعمال الجزائر وتعلم بفاس وجال في الصحراء إلى الجنوب من الجزائر يعظ الناس، ثم زار تونس وطرابلس ومرقة ومصر ومكة وفيها تصوف، وبنى زاوية في جبل أبي قبيس، ثم رحل إلى برقة وأقام في الجبل الأخضر فبنى «الزاوية البيضاء»، وكثر تلاميذه وانتشرت طريقته فارتابت الحكومة العثمانية في أمره فانتقل إلى واحة جغبوب فأقام إلى أن توفي فيها {cite:al-aalam tarjama}."
  en: "Muhammad ibn Ali al-Sanusi (d. 1275 AH/1859 CE) — founder of the Sanusiyya order: Mostaganem, Fez, Mecca's Abu Qubays zawiya, then Cyrenaica's al-Bayda' and the Jaghbub retreat {cite:al-aalam tarjama}."
