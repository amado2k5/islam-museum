summary:
  ar: "محمد بن علي السنوسي الخطابي الإدريسي ⁦(ت ١٢٧٥هـ/١٨٥٩م)⁩؛ زعيم الطريقة السنوسية الأول ومؤسسها. ولد في مستغانم من أعمال الجزائر وتعلم بفاس وجال في الصحراء إلى الجنوب من الجزائر يعظ الناس، ثم زار تونس وطرابلس ومرقة ومصر ومكة وفيها تصوف، وبنى زاوية في جبل أبي قبيس، ثم رحل إلى برقة وأقام في الجبل الأخضر فبنى «الزاوية البيضاء»، وكثر تلاميذه وانتشرت طريقته فارتابت الحكومة العثمانية في أمره فانتقل إلى واحة جغبوب فأقام إلى أن توفي فيها {cite:al-aalam tarjama}."
  en: "Muhammad ibn Ali al-Sanusi (d. 1275 AH/1859 CE) — founder of the Sanusiyya order: Mostaganem, Fez, Mecca's Abu Qubays zawiya, then Cyrenaica's al-Bayda' and the Jaghbub retreat {cite:al-aalam tarjama}."
  es: "Muhammad ibn Ali al-Sanusi (m. 1275 AH/1859 CE) - fundador de la orden Sanusiyya: Mostaganem, Fez, Abu Qubays zawiya de La Meca, luego al-Bayda' de Cirenaica y el retiro de Jaghbub {citar:al-aalam tarjama}."
  fr: "Muhammad ibn Ali al-Sanusi (mort en 1275 AH/1859 CE) — fondateur de l'ordre Sanusiyya: Mostaganem, Fès, la zawiya Abu Qubays de La Mecque, puis al-Bayda' de Cyrénaïque et la retraite de Jaghbub {cite: al-aalam tarjama}."
  ur: "محمد بن علی السنوسی ⁦(متوفی 1275ھ/1859 عیسوی)⁩ - سنوسیہ حکم کے بانی: مستگنیم، فیز، مکہ کا ابو قبیس زاویہ، پھر سیرینیکا کا البیضاء اور جغبوب اعتکاف {حوالہ: العالم ترجمہ}۔"
  tr: "Muhammed bin Ali el-Sanusi el-Hattābi el-İdrisi (ö. 1275 Hicri / 1859 M.S); Sanusi tarikatının ilk lideri ve kurucusudur. Mostaganem, Cezayir'de doğdu, Fez'de eğitim gördü ve Cezayir'in güneyindeki çölde halka vaaz vererek seyahat etti. Daha sonra Tunus, Trablus, Marka, Mısır ve Mekke'yi ziyaret ederek burada tasavvuf uyguladı. Daha sonra Barka'ya giderek Cebel-Akhdar'a yerleşti ve burada 'Beyaz Zevi'yi' inşa etti. Öğrencileri arttı ve tarikatı yayıldı, bu yüzden Osmanlı hükümeti ondan şüphelendi, bu yüzden Jaghbub vahasına taşındı ve ölümüne kadar orada yaşadı {atıf:al-aalam tarjama}."
  id: "Muhammad ibn Ali al-Sanusi al-Khattabi al-Idrisi (wafat 1275 H / 1859 M); pemimpin dan pendiri pertama ordo Sanusi. Ia lahir di Mostaganem, Aljazair, belajar di Fez, dan melakukan perjalanan di gurun selatan Aljazair untuk berkhotbah kepada rakyat. Ia kemudian mengunjungi Tunis, Tripoli, Marqa, Mesir, dan Mekah, di mana ia mempraktikkan tasawuf. Ia kemudian pergi ke Barqa dan menetap di Jabal al-Akhdar, di mana ia membangun 'Zawiya Putih.' Para muridnya bertambah dan ordonya menyebar, sehingga pemerintah Ottoman mulai curiga terhadapnya, sehingga ia pindah ke oasis Jaghbub, tempat ia tinggal hingga wafatnya {cite:al-aalam tarjama}."
