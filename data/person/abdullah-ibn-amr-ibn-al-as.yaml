summary:
  ar: "صحابي من بني سهم، أحد المكثرين من الحديث وكان يكتب؛ ذكر أبو هريرة أنه لا أكثر منه حديثاً إلا عبد الله بن عمرو لأنه كان يكتب، وأسلم قبل أبيه، وله قصة في الصحيحين في صيام النهار وقيام الليل. وعند البلاذري هو راوي القول الأثلج في أمر مصر: أن أباه فتح اليونة قهراً والزبير أول من علا حصنها ثم صالحه ملكها على حكم الشام وصالح عن جميع أهل مصر على مثله وبه ظنّ بعض الناس أنها فُتحت صلحاً."
  en: A Companion of Banu Sahm, a prolific transmitter of hadith who used to write; Abu Hurayra said none had more hadith than he except Abdullah ibn Amr, because he wrote; he embraced Islam before his father, and the two collections tell his
    story of fasting by day and praying by night.
  ur: "بنو سہم کے صحابی، حدیث کے بڑے راوی جو لکھتے بھی تھے؛ ابو ہریرہ نے کہا کہ ان کے سوا کسی کے پاس زیادہ حدیث نہیں تھی۔"
  fr: "Un Compagnon des Banu Sahm, transmetteur prolifique de hadiths qui avait l'habitude d'écrire ; Abu Hurayra dit que personne n'avait plus de hadiths que lui, sauf Abdullah ibn Amr, parce qu'il écrivait ; il embrassa l'islam avant son père, et les deux recueils racontent son histoire de jeûne le jour et de prière la nuit."
  es: "Un compañero de Banu Sahm, prolífico transmisor de hadices que solía escribir; Abu Hurayra dijo que nadie tenía más hadices que él, excepto Abdullah ibn Amr, porque escribía; abrazó el Islam antes que su padre, y las dos colecciones cuentan su historia de ayuno diurno y oración nocturna."
  tr: "Beni Sahm kabilesinden Peygamberimizin sahabelerinden biri olan Zübeyr, hadis rivayetinde en üretken kişilerden biriydi ve aynı zamanda kâtiplik de yapıyordu. Ebu Hurayra, Abdullah ibn Amr dışında ondan daha fazla hadis rivayet eden kimsenin olmadığını, çünkü onun da kâtip olduğunu belirtmiştir. Babasından önce İslamiyet'i kabul etmiş ve iki Sahih'te (Buhari ve Müslim) gündüz oruç tutma ve gece namaz kılma ile ilgili bir hikaye anlatılmaktadır. El-Baladhuri'ye göre, Mısır ile ilgili en güvenilir rivayetin nakledicisidir: Babası Leyla'yı zorla ele geçirmiş ve Zübeyr kaleye ilk çıkan kişi olmuştur. Daha sonra hükümdarı onunla barış yapmış, ona Suriye'nin yönetimini vermiş ve o da Mısır halkının tamamı adına benzer bir anlaşma yapmıştır. Buna dayanarak, bazı insanlar yanlışlıkla Mısır'ın barış antlaşmasıyla fethedildiğine inanmıştır."
  id: "Seorang sahabat Nabi dari suku Banu Sahm, beliau adalah salah satu perawi hadits yang paling produktif dan juga seorang juru tulis. Abu Hurayrah menyebutkan bahwa tidak ada seorang pun yang meriwayatkan hadits lebih banyak darinya kecuali Abdullah ibn Amr, karena ia juga seorang juru tulis. Beliau memeluk Islam sebelum ayahnya, dan ada kisah tentangnya dalam dua kitab Sahih (Bukhari dan Muslim) mengenai puasa di siang hari dan shalat di malam hari. Menurut al-Baladhuri, beliau adalah perawi riwayat yang paling dapat dipercaya mengenai Mesir: bahwa ayahnya menaklukkan Layla dengan kekerasan, dan al-Zubayr adalah orang pertama yang naik ke bentengnya. Kemudian penguasanya berdamai dengannya, memberinya kekuasaan atas Suriah, dan ia membuat perjanjian serupa atas nama seluruh rakyat Mesir. Berdasarkan hal ini, sebagian orang keliru percaya bahwa penaklukan itu dilakukan melalui perjanjian damai."
