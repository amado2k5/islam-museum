summary:
  ar: "صحابي من بني سهم، أحد المكثرين من الحديث وكان يكتب؛ ذكر أبو هريرة أنه لا أكثر منه حديثاً إلا عبد الله بن عمرو لأنه كان يكتب، وأسلم قبل أبيه، وله قصة في الصحيحين في صيام النهار وقيام الليل. وعند البلاذري هو راوي القول الأثلج في أمر مصر: أن أباه فتح اليونة قهراً والزبير أول من علا حصنها ثم صالحه ملكها على حكم الشام وصالح عن جميع أهل مصر على مثله وبه ظنّ بعض الناس أنها فُتحت صلحاً."
  en: A Companion of Banu Sahm, a prolific transmitter of hadith who used to write; Abu Hurayra said none had more hadith than he except Abdullah ibn Amr, because he wrote; he embraced Islam before his father, and the two collections tell his
    story of fasting by day and praying by night.
