summary:
  ar: "جلال الدين عبد الرحمن بن أبي بكر السيوطي (849-911هـ)؛ إمام مصر الحافظ كثير التصنيف، ومن آثاره تاريخ الخلفاء الذي ترجم فيه الخلفاء إلى عصره، وذكر أن والده كان إماماً للخليفة المستكفي الثاني وكتب له نسخة عهد الخلافة وأنه نشأ في بيت الخليفة وفضله، وذكر مصادره في هذا التاريخ فاعتمد في الحوادث على المسالك وذيله إلى سنة ثلاث وسبعين ثم على إنباء الغمر لابن حجر إلى سنة خمسين وثمان مئة وطالع تاريخ بغداد للخطيب في عشر مجلدات وتاريخ دمشق لابن عساكر في سبعة وخمسين مجلداً والأوراق للصولي والطيوريات والحلية لأبي نعيم والمجالسة للدينوري والكامل للمبرد وغير ذلك {cite:tarikh-khulafa-minhaj-1434 p. 773-781}. وفي ترجمته في شذرات الذهب أن والده توفي وله من العمر خمس سنين وسبعة أشهر وقد وصل في القرآن إلى سورة التحريم وأسند وصايته إلى جماعة منهم الكمال بن الهمام فقرره في وظيفة الشيخونية وختم القرآن وله دون ثمان سنين ثم حفظ عمدة الأحكام ومنهاج النووي وألفية ابن مالك ومنهاج البيضاوي وعرضها على علماء عصره فأجازوه وأخذ عن الجلال المحلي وأنضره والده مجلس الحافظ ابن حجر وشرع في الاشتغال بالعلم من ربيع الأول سنة أربع وستين وثمان مئة فقرأ على الشمس السيرامي صحيح مسلم والشفا والألفية وقرأ على التقي الشمني وعلى الشارمساحي في الفرائض والحساب ولازم دروس العلاء البلقيني من شوال سنة خمس وستين ولازم الشرف المناوي حتى مات وقرأ في الميقات على مجد الدين بن السائغ وفي الطب على محمد بن إبراهيم الدواني لما قدم القاهرة من الروم وذكر تلميذه الشاذلي أسماء شيوخه مرتبين على حروف المعجم فبلغوا مئة وإحدى وخمسين نفساً ونافت مؤلفاته على خمسمائة مؤلف ثم لما بلغ أربعين سنة أخذ في التجرد للعبادة والانقطاع إلى الله وترك الإفتاء والتدريس واعتذر عن ذلك في مؤلف سماه التنقيص وأقام في روضة المقياس فلم يتحول منها إلى أن مات ولم يفتح طاقات بيته التي على النيل وكان الأمراء والأغنياء يأتون لزيارته فيعرضون عليه الأموال فيردها وأهدى إليه الغوري خصياً وألف دينار فرد الألف وأخذ الخصي فأعتقه وجعله خادماً في الحجرة النبوية وقال لقاصد السلطان لا تعد تأتينا بهدية قط فإن الله أغنانا عن مثل ذلك وطلبه السلطان مراراً فلم يحضر إليه وذكر خادمه محمد بن علي الحباك أنه قال له يوماً وقت القيلولة وهو عند زاوية الشيخ عبد الله الجيوشي بمصر بالقرافة أتريد أن تصلي العصر بمكة بشرط أن تكتم حتى أموت فأخذ بيده ورحل به نحو سبع وعشرين خطوة فإذا هم بباب المعلاة فزار قبر خديجة والفضيل بن عياض وسفيان بن عيينة ودخل الحرم فطاف وشرب من زمزم وصلى العصر خلف المقام ثم عادا {cite:shadharat-dhahab p. 468-470}."
  en: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 AH); Egypt's prolific hadith imam, author among much else of Tarikh al-Khulafa, caliphal biographies to his own day."
