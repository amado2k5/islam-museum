    ar: "السيوطي جلال الدين ⁦(٨٤٩–٩١١هـ)⁩ إمام مصر الحافظ كثير التصنيف؛ من آثاره «تاريخ الخلفاء» الذي ترجم فيه الخلفاء إلى عصره."
    en: "Al-Suyuti, Jalal al-Din (849–911 AH), Egypt's prolific hafiz; among his works is the 'History of the Caliphs', which carried the caliphs' biographies down to his own age."
    ur: "سیوطی جلال الدین ⁦(849–911ھ)⁩، مصر کے حافظ بے شمار تصانیف والے؛ ان کی تصانیف میں «تاریخ الخلفا» ہے جس میں انہوں نے اپنے عصر تک خلفا کی تراجم لکھیں۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "جلال الدين السيوطي", en: "Jalal al-Din al-Suyuti", fr: "Jalal al-Din al-Suyuti", es: "Jalal al-Din al-Suyuti", ur: "جلال الدین السیوطی۔" }
summary:
  ar: "جلال الدين عبد الرحمن بن أبي بكر السيوطي ⁦(849-911هـ)⁩؛ إمام مصر الحافظ كثير التصنيف، ومن آثاره تاريخ الخلفاء الذي ترجم فيه الخلفاء إلى عصره، وذكر أن والده كان إماماً للخليفة المستكفي الثاني وكتب له نسخة عهد الخلافة وأنه نشأ في بيت الخليفة وفضله، وذكر مصادره في هذا التاريخ فاعتمد في الحوادث على المسالك وذيله إلى سنة ثلاث وسبعين ثم على إنباء الغمر لابن حجر إلى سنة خمسين وثمان مئة وطالع تاريخ بغداد للخطيب في عشر مجلدات وتاريخ دمشق لابن عساكر في سبعة وخمسين مجلداً والأوراق للصولي والطيوريات والحلية لأبي نعيم والمجالسة للدينوري والكامل للمبرد وغير ذلك {cite:tarikh-khulafa-minhaj-1434 p. 773-781}. وفي ترجمته في شذرات الذهب أن والده توفي وله من العمر خمس سنين وسبعة أشهر وقد وصل في القرآن إلى سورة التحريم وأسند وصايته إلى جماعة منهم الكمال بن الهمام فقرره في وظيفة الشيخونية وختم القرآن وله دون ثمان سنين ثم حفظ عمدة الأحكام ومنهاج النووي وألفية ابن مالك ومنهاج البيضاوي وعرضها على علماء عصره فأجازوه وأخذ عن الجلال المحلي وأنضره والده مجلس الحافظ ابن حجر وشرع في الاشتغال بالعلم من ربيع الأول سنة أربع وستين وثمان مئة فقرأ على الشمس السيرامي صحيح مسلم والشفا والألفية وقرأ على التقي الشمني وعلى الشارمساحي في الفرائض والحساب ولازم دروس العلاء البلقيني من شوال سنة خمس وستين ولازم الشرف المناوي حتى مات وقرأ في الميقات على مجد الدين بن السائغ وفي الطب على محمد بن إبراهيم الدواني لما قدم القاهرة من الروم وذكر تلميذه الشاذلي أسماء شيوخه مرتبين على حروف المعجم فبلغوا مئة وإحدى وخمسين نفساً ونافت مؤلفاته على خمسمائة مؤلف ثم لما بلغ أربعين سنة أخذ في التجرد للعبادة والانقطاع إلى الله وترك الإفتاء والتدريس واعتذر عن ذلك في مؤلف سماه التنقيص وأقام في روضة المقياس فلم يتحول منها إلى أن مات ولم يفتح طاقات بيته التي على النيل وكان الأمراء والأغنياء يأتون لزيارته فيعرضون عليه الأموال فيردها وأهدى إليه الغوري خصياً وألف دينار فرد الألف وأخذ الخصي فأعتقه وجعله خادماً في الحجرة النبوية وقال لقاصد السلطان لا تعد تأتينا بهدية قط فإن الله أغنانا عن مثل ذلك وطلبه السلطان مراراً فلم يحضر إليه وذكر خادمه محمد بن علي الحباك أنه قال له يوماً وقت القيلولة وهو عند زاوية الشيخ عبد الله الجيوشي بمصر بالقرافة أتريد أن تصلي العصر بمكة بشرط أن تكتم حتى أموت فأخذ بيده ورحل به نحو سبع وعشرين خطوة فإذا هم بباب المعلاة فزار قبر خديجة والفضيل بن عياض وسفيان بن عيينة ودخل الحرم فطاف وشرب من زمزم وصلى العصر خلف المقام ثم عادا {cite:shadharat-dhahab p. 468-470}."
  en: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 AH); Egypt's prolific hadith imam, author among much else of Tarikh al-Khulafa, caliphal biographies to his own day."
  fr: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 de l’hégire)  ; imam prolifique du hadith égyptien, auteur parmi beaucoup d'autres de Tarikh al-Khulafa, des biographies califales à son époque."
  es: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 d. H.); El prolífico imán hadiz de Egipto, autor, entre muchas otras cosas, de Tarikh al-Khulafa, biografías califales hasta su época."
  ur: "جلال الدین عبد الرحمن ابن ابی بکر السیوطی ⁦(849-911ھ)⁩؛ مصر کے مشہور حدیث امام، تاریخ الخلفاء کے بہت سے مصنف، خلیفہ کی سوانح عمری اپنے دور تک۔"
  tr: "Celaleddin Abdülrahman ibn Ebi Bekir el-Suyuti (849-911 H) Mısır İmamı, kapsamlı yazıları olan bir ezberci olup. Eserleri arasında 'Halifelerin Tarihi' de bulunmaktadır, bu eserlerde kendi dönemine kadar halifelerin biyografilerini yazmıştır. Babası Halife el-Mustafa II'nin imamı olduğunu, Halifelik döneminin bir kopyasını yazdığını ve halifenin evinde büyüdüğünü ve erdemlerini belirtmiştir. Bu tarihte kaynaklarını alıntılamış, 73 yılına kadar el-Masalik ve ekine dayanmış, ardından İbn Hajar'ın 850 Hâm'ye kadar 'İnba' el-Ghamr'ına ve on ciltlik el-Hatib'in 'Tarih Bağdat'ın, İbn Asakir'in 'Tarih Dimashq'unun elli yedi ciltliğine, el-Suli'nin 'El-Varak'ına, Ebu Nu'aym'ın 'El-Tayuriyyat, El-Hilyya'sına dayanarak: 'al-Mujalasa' al-Dinawari'den, 'al-Kamil al-Mubarrad'dan ve diğerleri' {atıf:Tarikh-khulafa-minhaj-1434, s. 773-781}. Shadharat al-Dhahab'daki biyografisinde, babasının beş yaş yedi aylıkken öldüğü belirtilir. Kur'an'ı Et-Tahrim suresine kadar götürdü ve vasiliğini El-Kəmal bin Humam da dahil bir gruba emanet etti; onlar da onu Şeyhuniye olarak atadılar ve sekiz yaşında Kur'an'ı tamamladılar. Daha sonra 'Umdat al-Ahkam, Minhaj al-Nawawi, Alfiyya Ibn Malik ve Minhaj al-Baydawi'yi ezberledi ve bunları zamanının alimlerine sundu; onlar da ona lisans verdi. Celal al-Mahalli'nin yanında eğitim gördü, babası ise el-Hafız İbn Hacer'in meclisinde eğitim aldı. Dördüncü yılda Rabi' al-Awwal'dan bilgi edinmeye başladı Altmış sekiz yüz. El-Şems El-Sirami, Sahih Müslim, El-Şifa ve El-El-Fıyye üzerine eğitim aldı; ayrıca miras ve aritmetik alanlarında El-Taqi El-Şemni ve El-Şeramsahi ile birlikte eğitim aldı. Altmış beşinci yılda Şevval'den Al-Alaa El-Balkini'nin derslerine katıldı ve ölümüne kadar El-Şeraf El-Manawi'ye devam etti. Miqat'ta Majd el-Din ibn el-Seyh'in yanında ve tıbbı Muhammed bin İbrahim el-Deveni'nin yanında okudu; Romalılardan Kahire'ye geldiğinde tıp eğitimi aldı. Öğrencisi El-Şadili, öğretmenlerinin isimlerini alfabetik olarak sıralayarak yüz elli bir ruha ulaşarak anmış ve yazıları beş yüzü aşmıştır. Sonra Kırk yaşına geldi ve fetva ve öğretiyi terk ederek ibadet ve Allah'a bağlılık göstermeye başladı ve bunun için El-Tanqees adlı bir kitapta özür diledi. Rawdat al-Miqyya'da kaldı, ancak ölene kadar oradan dönmedi. Nil üzerindeki evinin pencerelerini açmadı. Prensler ve zenginler onu ziyaret eder, para teklif ederdi ve o da geri verirdi. El-Guri ona bir hadım ve bin dinar hediye etti, o da bin dinar geri verdi. Hadımı aldı, onu serbest bıraktı ve Peygamber'in odasında hizmetkar yaptı. Sultan'ın elçisine dedi ki, \"Bir daha hediye getirme, çünkü Allah ihtiyaç dışında özgürdür Sultan bunu defalarca istedi, ancak yanına gelmedi. Hizmetkarı Muhammed bin Ali el-Habbak, bir gün kestirirken Mısır'da Şeyh Abdullah el-Ciyuşi'nin köşesinde, El-Karafa'da, \"Mekke'de Esr namaz kılmak ister misin, ben ölene kadar sessiz kalman şartıyla mı?\" dediğini anlattı. Elini tuttu ve yaklaşık yirmi yedi adım aldı. Bab al-Ma'la'ya vardıklarında, Hadijah, el-Fudayl bin 'İyad ve Sufyan ibn 'Uyaynah'ın mezarlarını ziyaret ettiler, kutsal alana girdiler, sünnet ettiler, Zemzem içtiler, türbenin arkasında Asr namazını yaptılar ve sonra geri döndüler {cite:shadharat-dhahab, s. 468-470}."
  id: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 H); Imam Mesir, seorang penghafal dengan tulisan yang luas. Di antara karyanya adalah 'Sejarah Khalifah,' di mana ia menulis biografi khalifah hingga zamannya. Ia menyebutkan bahwa ayahnya adalah imam Khalifah al-Mustakfi II, menulis salinan era Khalifah, dan tumbuh besar di rumah khalifah serta jasanya. Ia mengutip sumber-sumbernya dalam sejarah ini, mengandalkan al-Masalik dan lampirannya hingga tahun 73, kemudian pada 'Inba' al-Ghamr karya Ibn Hajar hingga tahun 850 H, dan 'Tarikh Baghdad' oleh al-Khatib dalam sepuluh jilid, 'Tarikh Dimashq' oleh Ibn Asakir dalam lima puluh tujuh jilid, 'Al-Waraq' oleh al-Suli, 'al-Tayuriyyat, al-Hilyya oleh Abu Nu'aym,' 'al-Mujalasa' oleh al-Dinawari, 'al-Kamil oleh al-Mubarrad, dan lainnya' {kutip:' Tarikh-khulafa-minhaj-1434, hlm. 773-781}. Dalam biografinya di Shadharat al-Dhahab, disebutkan bahwa ayahnya meninggal pada usia lima tahun tujuh bulan. Ia menyerahkan Al-Qur'an hingga Surah At-Tahrim dan mempercayakan perwaliannya kepada kelompok termasuk Al-Kamal ibn al-Humam, yang mengangkatnya menjadi Shaykhuniyah dan menyelesaikan Al-Qur'an pada usia delapan tahun. Ia kemudian menghafal 'Umdat al-Ahkam, Minhaj al-Nawawi, Alfiyya Ibn Malik, dan Minhaj al-Baydawi, dan menyerahkannya kepada para ulama pada zamannya, yang memberinya izin. Ia belajar di bawah bimbingan Jalal al-Mahalli, dan ayahnya belajar di dewan al-Hafiz Ibn Hajar. Ia mulai mempelajari ilmu dari Rabi' al-Awwal pada tahun keempat Enam puluh delapan ratus. Ia belajar tentang Al-Shams Al-Sirami, Sahih Muslim, Al-Shifa, dan Al-Alfiyyah, serta belajar di bawah Al-Taqi Al-Shamni dan Al-Sharamsahi dalam bidang warisan dan aritmatika. Ia mengikuti pelajaran Al-Alaa Al-Balqini dari Shawwal pada tahun enam puluh lima, dan ia mengikuti Al-Sharaf Al-Manawi hingga meninggal. Ia belajar di Miqat di bawah Majd al-Din ibn al-Sa'igh dan kedokteran di bawah Muhammad ibn Ibrahim al-Dawani ketika ia datang ke Kairo dari Romawi. Muridnya Al-Shadhili menyebutkan nama-nama gurunya yang diatur secara alfabetis mencapai seratus lima puluh satu jiwa, dan tulisannya melebihi lima ratus karya. Kemudian ketika Ia mencapai usia empat puluh tahun dan mulai berbakti kepada ibadah dan pengabdian kepada Tuhan, meninggalkan fatwa dan ajaran, dan ia meminta maaf atas hal ini dalam sebuah kitab berjudul Al-Tanqees. Ia tinggal di Rawdat al-Miqyya, tetapi tidak berpaling darinya sampai ia meninggal. Ia tidak membuka jendela rumahnya di tepi Sungai Nil. Para pangeran dan orang kaya biasa datang mengunjunginya dan menawarkan uang, dan ia mengembalikannya. Al-Ghuri memberinya seekor kasim dan seribu dinar, dan ia mengembalikan seribu. Ia mengambil kasim itu, membebaskannya, dan menjadikannya pelayan di kamar Nabi. Ia berkata kepada utusan Sultan, \"Jangan kembali dengan hadiah lagi, karena Allah bebas dari kebutuhan seperti Sultan berulang kali meminta hal ini, tetapi ia tidak datang kepadanya. Hamba Muhammad bin Ali al-Habbak menyebutkan bahwa suatu hari, saat tidur siang, ia berkata kepadanya di sudut Sheikh Abdullah al-Jiyushi di Mesir, Al-Qarafa, \"Apakah engkau ingin shalat Asr di Mekah dengan syarat kau tetap diam sampai aku meninggal?\" Ia mengambil tangannya dan mengambilnya sekitar dua puluh tujuh langkah. Ketika mereka tiba di Bab al-Ma'la, mereka mengunjungi makam Khadijah, al-Fudayl ibn 'Iyad, dan Sufyan ibn 'Uyaynah, masuk ke tempat suci, mengelilingi kota, minum dari Zamzam, berdoa Asr di belakang makam, lalu kembali {cite:shadharat-dhahab, hlm. 468-470}."
