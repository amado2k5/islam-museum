label: { ar: "جلال الدين السيوطي", en: "Jalal al-Din al-Suyuti" }
summary:
  ar: "جلال الدين عبد الرحمن بن أبي بكر السيوطي (849-911هـ)؛ إمام مصر الحافظ كثير التصنيف، ومن آثاره تاريخ الخلفاء الذي ترجم فيه الخلفاء إلى عصره، وذكر أن والده كان إماماً للخليفة المستكفي الثاني وكتب له نسخة عهد الخلافة وأنه نشأ في بيت الخليفة وفضله، وذكر مصادره في هذا التاريخ فاعتمد في الحوادث على المسالك وذيله إلى سنة ثلاث وسبعين ثم على إنباء الغمر لابن حجر إلى سنة خمسين وثمان مئة وطالع تاريخ بغداد للخطيب في عشر مجلدات وتاريخ دمشق لابن عساكر في سبعة وخمسين مجلداً والأوراق للصولي والطيوريات والحلية لأبي نعيم والمجالسة للدينوري والكامل للمبرد وغير ذلك {cite:tarikh-khulafa-minhaj-1434 p. 773-781}."
  en: "Jalal al-Din Abd al-Rahman ibn Abi Bakr al-Suyuti (849-911 AH); Egypt's prolific hadith imam, author among much else of Tarikh al-Khulafa, caliphal biographies to his own day."
