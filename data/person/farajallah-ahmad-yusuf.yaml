class: person
label: { ar: "فرج الله أحمد يوسف", en: "Farajallah Ahmad Yusuf", ur: "فرج اللہ احمد یوسف", es: "Farajallah Ahmad Yusuf", fr: "Farajallah Ahmad Yusuf" }
summary:
  ar: "باحث في الآثار والمسكوكات الإسلامية، نال الدكتوراه من كلية الآثار بجامعة القاهرة سنة 1418هـ/1997م برسالة في الآيات القرآنية على المسكوكات الإسلامية نشرت بالرياض سنة 2003م {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  en: "Scholar of Islamic archaeology and numismatics who earned his doctorate at Cairo University's Faculty of Archaeology in 1418/1997 with a thesis on Qur'anic verses on Islamic coins, published in Riyadh in 2003 {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  ur: "اسلامی آثار اور سکوں کے محقق، جنہوں نے 1418ھ/1997ء میں قاہرہ یونیورسٹی کی فیکلٹی آف آرکیالوجی سے اسلامی سکوں پر قرآنی آیات کے مقالے پر ڈاکٹریٹ کی، جو 2003ء میں ریاض سے شائع ہوا {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  es: "Académico de arqueología y numismática islámica que obtuvo su doctorado en la Facultad de Arqueología de la Universidad de El Cairo en 1418/1997 con una tesis sobre versículos coránicos en monedas islámicas, publicada en Riad en 2003 {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  fr: "Spécialiste de l'archéologie et de la numismatique islamiques, il a obtenu son doctorat à la faculté d'archéologie de l'université du Caire en 1418/1997 avec une thèse sur les versets coraniques sur les pièces de monnaie islamiques, publiée à Riyad en 2003 {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 15}."
  tr: "İslami arkeoloji ve madeni paralar alanında araştırmacı olan Scully, 1418 Hicri / 1997 yılında Kahire Üniversitesi Arkeoloji Fakültesi'nden doktorasını İslami paralar üzerine Kur'an ayetleri üzerine yazdığı tezle aldı; tezi 2003 yılında Riyad'da yayımlandı {cite:yusuf-ayat-quraniyya-maskukat-2003, s. 15}."
  id: "Sebagai peneliti arkeologi Islam dan koin, ia meraih gelar doktor dari Fakultas Arkeologi Universitas Kairo pada tahun 1418 H / 1997 M dengan tesis tentang ayat-ayat Al-Qur'an tentang koin Islam, yang diterbitkan di Riyadh pada tahun 2003 {cite:yusuf-ayat-quraniyya-maskukat-2003, hlm. 15}."
