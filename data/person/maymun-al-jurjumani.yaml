label: { ar: "ميمون الجرجماني", en: "Maymun al-Jurjumani", es: "Maymun al-Jurjumani", fr: "Maymun al-Jurjumani", ur: "میمون الجرجمانی" }
summary:
  ar: "ميمون الجرجماني؛ عند البلاذري: كان عبداً رومياً لبني أم الحكم أخت معاوية بن أبي سفيان وهم تقفيون، وإنما نسب إلى الجراجمة لاختلاطه بهم وخروجه بجبل لبنان معهم، فبلغ عبد الملك عنه بأس وشجاعة فسأل مواليه أن يعتقوه ففعلوا وقوّده على جماعة من الجند وصيّره بأنطاكية، فغزا مع مسلمة بن عبد الملك الطوافة وهو على ألف من أهل أنطاكية فاستشهد بعد بلاء حسن وموقف مشهود، فعمّ عبد الملك مصابه وأغزى الروم جيشاً عظيماً طلباً بثأره."
  en: "Maymun al-Jurjumani; in al-Baladhuri: he had been a Byzantine slave of the sons of Umm al-Hakam, Mu'awiya's sister — they being Tafa'is — and was attached to the Jarajima only for mixing with them and going out with them on Mount Lebanon; word of his valour and courage reached Abd al-Malik, who asked his masters to free him, which they did, and he gave him command over a body of troops, posting him at Antioch; he raided with Maslama ibn Abd al-Malik at the head of a thousand Antiochenes and was martyred after a fine stand and a famous fight, whereupon Abd al-Malik made his loss public mourning and sent a great army against the Byzantines seeking his vengeance."
  es: "Maymun al-Jurjumani; en al-Baladhuri: había sido esclavo bizantino de los hijos de Umm al-Hakam, hermana de Mu'awiya —ellos eran Tafa'is— y estaba vinculado a los Jarajima solo para mezclarse con ellos y salir con ellos al Monte Líbano; la noticia de su valor y coraje llegó a Abd al-Malik, quien pidió a sus amos que lo liberaran, lo cual hicieron, y le dio el mando de un cuerpo de tropas, destinándolo a Antioquía; salió de incursión con Maslama ibn Abd al-Malik al frente de mil antioquenos y fue martirizado después de una buena resistencia y una famosa batalla, tras lo cual Abd al-Malik hizo público su duelo y envió un gran ejército contra los bizantinos buscando su venganza."
  fr: "Maymun al-Jurjumani, selon al-Baladhuri: il avait été esclave byzantin des fils d’Umm al-Hakam, sœur de Mu’awiya (ils étaient Tafa’is), et n’était attaché aux Jarajima que pour se mêler à eux et les accompagner lors de leurs excursions au Mont-Liban. La nouvelle de sa bravoure et de son courage parvint aux oreilles d’Abd al-Malik, qui demanda à ses maîtres de l’affranchir, ce qu’ils firent. Il lui confia alors le commandement d’un corps de troupes et l’affecta à Antioche. À la tête de mille Antiochiens, il mena un raid avec Maslama ibn Abd al-Malik et périt en martyr après une résistance héroïque et un combat mémorable. Abd al-Malik décréta alors un deuil public et envoya une grande armée contre les Byzantins pour se venger."
  ur: "میمون الجرجمانی؛ البلادوری میں ہے: وہ معاویہ کی بہن ام الحکم کے بیٹوں کا بازنطینی غلام تھا - وہ طافعی تھے - اور صرف ان کے ساتھ گھل مل جانے اور ان کے ساتھ کوہ لبنان پر نکلنے کے لیے جرجیمہ سے منسلک تھے۔ اس کی بہادری اور جرات کی بات عبد الملک تک پہنچی، جس نے اپنے آقاؤں سے کہا کہ وہ اسے آزاد کر دیں، جو انہوں نے کیا، اور اس نے اسے انطاکیہ میں تعینات کر کے فوج کے ایک گروپ کی کمان دی۔ اس نے مسلمہ بن عبد الملک کے ساتھ ایک ہزار انٹیوچینیوں کے سر پر چڑھائی کی اور ایک عمدہ موقف اور ایک مشہور لڑائی کے بعد شہید ہو گیا، اس کے بعد عبد الملک نے اس کے نقصان پر عام سوگ منایا اور اس کا بدلہ لینے کے لیے بازنطینیوں کے خلاف ایک عظیم لشکر روانہ کیا۔"
