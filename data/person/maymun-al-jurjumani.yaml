id: person/maymun-al-jurjumani
class: person
label: { ar: "ميمون الجرجماني", en: "Maymun al-Jurjumani" }
summary:
  ar: "ميمون الجرجماني؛ عند البلاذري: كان عبداً رومياً لبني أم الحكم أخت معاوية بن أبي سفيان وهم تقفيون، وإنما نسب إلى الجراجمة لاختلاطه بهم وخروجه بجبل لبنان معهم، فبلغ عبد الملك عنه بأس وشجاعة فسأل مواليه أن يعتقوه ففعلوا وقوّده على جماعة من الجند وصيّره بأنطاكية، فغزا مع مسلمة بن عبد الملك الطوافة وهو على ألف من أهل أنطاكية فاستشهد بعد بلاء حسن وموقف مشهود، فعمّ عبد الملك مصابه وأغزى الروم جيشاً عظيماً طلباً بثأره."
  en: "Maymun al-Jurjumani; in al-Baladhuri: he had been a Byzantine slave of the sons of Umm al-Hakam, Mu'awiya's sister — they being Tafa'is — and was attached to the Jarajima only for mixing with them and going out with them on Mount Lebanon; word of his valour and courage reached Abd al-Malik, who asked his masters to free him, which they did, and he gave him command over a body of troops, posting him at Antioch; he raided with Maslama ibn Abd al-Malik at the head of a thousand Antiochenes and was martyred after a fine stand and a famous fight, whereupon Abd al-Malik made his loss public mourning and sent a great army against the Byzantines seeking his vengeance."
