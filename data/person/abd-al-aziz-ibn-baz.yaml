summary:
  ar: "عبد العزيز بن عبد الله بن باز ⁦(1912–1999)⁩ مفتي السعودية ⁦(1993–1999)⁩ ورئيس هيئة كبار العلماء، فقد بصره شاباً وحفظ العلم بلا عينين، وشكّلت فتاواه السياسة الدينية السعودية. من آثاره «مجموع فتاوى ومقالات متنوعة» و«العقيدة الصحيحة» وبرنامج «نور على الدرب»."
  en: "Abd al-Aziz ibn Baz (1912–1999) was Grand Mufti of Saudi Arabia (1993–1999) and head of the Council of Senior Scholars; blind from youth, he memorised knowledge without sight and his fatwas shaped Saudi religious policy. His works include Majmu' Fatawa wa Maqalat Mutanawwi'a, Al-'Aqida al-Sahiha and the programme Nur 'ala al-Darb."
  ur: "عبدالعزیز بن باز ⁦(1912–1999)⁩ سعودی عرب کے مفتیِ اعظم ⁦(1993–1999)⁩ اور کونسل آف سینئر اسکالرز کے صدر تھے؛ جوانی میں نابینا ہوئے اور علم یاد رکھا، اور ان کے فتویٰ نے سعودی مذہبی پالیسی بنائی۔ آثار میں «مجموع فتاوى»، «العقيدة الصحيحة» اور پروگرام «نور على الدرب» شامل ہیں۔"
