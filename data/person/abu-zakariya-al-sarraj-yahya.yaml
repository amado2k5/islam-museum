label:
  ar: أبو زكريا السراج ⁦(يحيى بن أحمد)⁩
  en: Abu Zakariya al-Sarraj (Yahya ibn Ahmad), Andalusian-Fasi jurist
  fr: "Abu Zakariya al-Sarraj (Yahya ibn Ahmad), juriste andalou de Fès"
  ur: ابو زکریا السراج ⁦(یحییٰ بن احمد)⁩
  es: "Abu Zakariya al-Sarraj (Yahya ibn Ahmad), Andalusian-Fasi jurist"
summary:
  ar: 'أبو زكريا يحيى بن أحمد بن محمد بن حسن السراج، الأندلسي الفاسي، فقيه محدث حافظ
    لغوي ناظم ناثر، توفي سنة 805ه بحسب ما ذكر المدخل. أخذ عن أبي البركات ابن الحاج
    البلفيقي وعن عبد النور وابن عباد وغيرهم، وانتهت إليه رياسة الحديث في وقته، وله
    فهرسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7512} '
  en: 'Abu Zakariya Yahya ibn Ahmad ibn Muhammad ibn Hasan al-Sarraj, an Andalusian
    of Fez, a jurist, traditionist, memoriser, philologist and poet; the entry gives
    his death as 805 AH. He studied with Abu al-Barakat ibn al-Hajj al-Balfiqi, ''Abd
    al-Nur and Ibn Abbad, among others, headed the study of hadith in his time, and
    wrote a catalogue of his teachers and books. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512} '
  fr: "Abu Zakariya Yahya ibn Ahmad ibn Muhammad ibn Hasan al-Sarraj, Andalou de Fès, juriste, traditionniste, mémorisateur, philologue et poète ; la notice donne sa mort en 805 H. Il étudia notamment auprès d'Abu al-Barakat ibn al-Hajj al-Balfiqi, d''Abd al-Nur et d'Ibn Abbad, fut à la tête de l'étude du hadith de son temps et écrivit un catalogue de ses maîtres et de ses livres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512}"
  ur: 'ابو زکریا یحییٰ بن احمد بن محمد بن حسن السراج، اندلسی فاسی، فقیہ، محدث، حافظ،
    ماہرِ لغت، شاعر اور نثر نگار؛ مدخل کے مطابق وفات 805 ہجری ہے۔ ابوالبرکات ابن الحاج
    البلفیقی، عبد النور اور ابن عباد وغیرہ سے پڑھا، اپنے وقت میں حدیث کی ریاست انہی
    کے پاس رہی، اور ایک فہرست تصنیف کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512} '
  es: "Abu Zakariya Yahya ibn Ahmad ibn Muhammad ibn Hasan al-Sarraj, andaluz de Fez, jurista, tradicionalista, memorizador, filólogo y poeta; la entrada da su muerte en 805 AH. Estudió con Abu al-Barakat ibn al-Hajj al-Balfiqi, 'Abd al-Nur e Ibn Abbad, entre otros, dirigió el estudio de los hadices en su época y escribió un catálogo de sus maestros y libros. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7511} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512}"
  tr: "Ebu Zekeriya Yahya ibn Ahmed ibn Muhammed ibn Hasan el-Siraj, el-Endülüs el-Fasi, hukukçu, hadis alimi, hadis ezbercisi, dilbilimci, şair ve nesir yazarıydı. Giriş kısmına göre H. 805 yılında vefat etmiştir. Ebu el-Berekat ibn el-Hac el-Belafiki, Abd el-Nur, İbn Abbad ve diğerlerinden eğitim aldı. Kendi döneminde hadis konusunda önde gelen otorite haline geldi ve bir katalog hazırladı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7512}"
  id: "Abu Zakariya Yahya ibn Ahmad ibn Muhammad ibn Hasan al-Siraj, al-Andalusi al-Fasi, adalah seorang ahli hukum, ulama hadits, penghafal hadits, ahli bahasa, penyair, dan penulis prosa. Dia meninggal pada tahun 805 H, menurut pendahuluan. Ia belajar di bawah bimbingan Abu al-Barakat ibn al-Hajj al-Balafiqi, Abd al-Nur, Ibn Abbad, dan lain-lain. Ia menjadi otoritas terkemuka dalam bidang hadis pada masanya, dan ia menyusun sebuah katalog. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.7512}"
