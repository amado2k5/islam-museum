label:
  ar: أبو زكريا السراج (يحيى بن أحمد)
  en: Abu Zakariya al-Sarraj (Yahya ibn Ahmad), Andalusian-Fasi jurist
  ur: ابو زکریا السراج (یحییٰ بن احمد)
summary:
  ar: 'أبو زكريا يحيى بن أحمد بن محمد بن حسن السراج، الأندلسي الفاسي، فقيه محدث حافظ
    لغوي ناظم ناثر، توفي سنة 805ه بحسب ما ذكر المدخل. أخذ عن أبي البركات ابن الحاج
    البلفيقي وعن عبد النور وابن عباد وغيرهم، وانتهت إليه رياسة الحديث في وقته، وله
    فهرسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7512} '
  en: 'Abu Zakariya Yahya ibn Ahmad ibn Muhammad ibn Hasan al-Sarraj, an Andalusian
    of Fez, a jurist, traditionist, memoriser, philologist and poet; the entry gives
    his death as 805 AH. He studied with Abu al-Barakat ibn al-Hajj al-Balfiqi, ''Abd
    al-Nur and Ibn Abbad, among others, headed the study of hadith in his time, and
    wrote a catalogue of his teachers and books. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512} '
  ur: 'ابو زکریا یحییٰ بن احمد بن محمد بن حسن السراج، اندلسی فاسی، فقیہ، محدث، حافظ،
    ماہرِ لغت، شاعر اور نثر نگار؛ مدخل کے مطابق وفات 805 ہجری ہے۔ ابوالبرکات ابن الحاج
    البلفیقی، عبد النور اور ابن عباد وغیرہ سے پڑھا، اپنے وقت میں حدیث کی ریاست انہی
    کے پاس رہی، اور ایک فہرست تصنیف کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7512} '
