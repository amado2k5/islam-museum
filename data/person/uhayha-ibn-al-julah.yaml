summary:
  ar: "أحيحة بن الجلاح الأوسي، سيد بني جحجبا ويعدّ من أعز أهل يثرب قبل الإسلام؛ دُفع إليه الغطفاني فرسه عند سوق بني قينقاع تعظيماً له، وكان له صولة في أمر قتل كعب بن العجلان بحرب سمير، وأمر جماعة فرصدوا كعب بن عمرو المازني حتى ظفروا به فقتلوه فكانت حرب بني جحجبا وبني مازن التي انهزم فيها ودخل حصنه، وقدم عليه مسعود بن معتب الثقفي يطلب حلف الأنصار على بني مالك فقال له ما خرج رجل من قومه إلى قوم بحلف إلا أقر لهم بشر مما أنف منه من قومه، وقال أخوك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك فانصرف عنه وزوده بسلاح وزاد وغلاماً يبني الآطام فبنى للطائف أول أطمها {cite:kamil-ibn-al-athir p. 513}."
  en: "Uhayha ibn al-Julah of Aws, sayyid of Banu Juhjuba and reckoned among the mightiest men of Yathrib before Islam; the Ghatafani's horse was yielded to him at the Qaynuqa market, his word loomed over the Samir war, and his order to kill Ka'b ibn Amr al-Mazini set off the Juhjuba-Mazin war in which he was routed to his fortress; and when Thaqif's Mas'ud ibn Mu'tib sought the Ansar's pact he refused — 'your brother is the one you left behind' — sending him home with a slave who built Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 513}."
  es: "Uhayha ibn al-Julah de Aws, sayyid de Banu Juhjuba y considerado entre los hombres más poderosos de Yathrib antes del Islam; el caballo de Ghatafani le fue entregado en el mercado de Qaynuqa, su palabra se cernió sobre la guerra de Samir, y su orden de matar a Ka'b ibn Amr al-Mazini desencadenó la guerra Juhjuba-Mazin en la que fue derrotado en su fortaleza; y cuando Mas'ud ibn Mu'tib de Thaqif buscó el pacto de los Ansar, se negó —'tu hermano es el que dejaste atrás'— enviándolo a casa con un esclavo que construyó la primera torre-fortaleza de Ta'if {cite:kamil-ibn-al-athir p. 513}."
  fr: "Uhayha ibn al-Julah d'Aws, sayyid des Banu Juhjuba et considéré comme l'un des hommes les plus puissants de Yathrib avant l'Islam; le cheval du Ghatafani lui fut cédé au marché de Qaynuqa, sa parole plana sur la guerre de Samir, et son ordre de tuer Ka'b ibn Amr al-Mazini déclencha la guerre Juhjuba-Mazin au cours de laquelle il fut mis en déroute jusqu'à sa forteresse; et lorsque Mas'ud ibn Mu'tib de Thaqif chercha le pacte des Ansar, il refusa — « ton frère est celui que tu as laissé derrière » — le renvoyant chez lui avec un esclave qui construisit la première tour de forteresse de Ta'if {cite:kamil-ibn-al-athir p. 513}."
  ur: "عحیہ بن الجولہ اوس کے سید، بنو الجوبہ کے سید اور اسلام سے پہلے یثرب کے سب سے طاقتور آدمیوں میں شمار ہوتے تھے۔ غطفانی کا گھوڑا قینقاع کے بازار میں اس کے حوالے کیا گیا، اس کی بات سمیر کی جنگ پر پھیل گئی، اور کعب بن عمرو المزنی کو قتل کرنے کے اس کے حکم نے جوحجوبہ-مزین کی جنگ شروع کر دی جس میں اسے اس کے قلعے تک پہنچا دیا گیا۔ اور جب ثقیف کے مسعود بن مطیب نے انصار سے معاہدہ طلب کیا تو اس نے انکار کر دیا - 'تمہارا بھائی وہی ہے جسے تم نے پیچھے چھوڑا ہے' - اسے ایک غلام کے ساتھ گھر بھیج دیا جس نے طائف کا پہلا قلعہ نما مینار بنایا تھا۔ 513}۔"
  tr: "Banu Jahjiba'nın lideri ve İslam öncesi Yathrib'in en saygın kişilerinden biri olarak kabul edilen Uhayha ibn al-Jallah al-Awsi, Banu Qaynuqa pazarında al-Ghattafani tarafından atını onurlandırmak için verildi. Samir Savaşı'nda Ka'b ibn al-Ajlan'ın öldürülmesine karıştı ve bir grup Ka'b ibn Amr al-Mazni'yi kuşatmalarını emretti, ta ki onu yenip öldürene kadar. Böylece, Banu Jahjaba ile Banu Mazin arasındaki savaş gerçekleşti; Banu yenildi ve içeri girdi Kalesi. Mas'ud ibn Mu'tab al-Thaqafi ona Banu Malik'e karşı Ensar ittifakı istedi ve ona şöyle dedi: Halkından kimse ittifak yemin etmeye çıkmadı, sadece kendi halkının halkını tanıdı. Dedi ki, 'Geride bıraktığın kardeşin, ona dön ve onunla barış yap, burnun ve kulağının kırıntısıyla bile olsa.' Sonra onu terk etti ve kaleleri inşa etmesi için silah, erzak ve bir çocuk sağladı. Taif'in ilk surunu inşa etti {alıntı:] Kamil-ibn-al-Athir s. 513}."
  id: "Uhayha ibn al-Jallah al-Awsi, pemimpin Banu Jahjiba dan dianggap sebagai salah satu orang paling terhormat di Yathrib sebelum Islam, diberikan kudanya oleh al-Ghattafani di pasar Banu Qaynuqa sebagai penghormatan. Ia terlibat dalam pembunuhan Ka'b ibn al-Ajlan dalam Pertempuran Samir, dan ia memerintahkan sekelompok orang untuk mengepung Ka'b ibn Amr al-Mazni hingga mereka mengalahkannya dan membunuhnya. Dengan demikian, perang antara Banu Jahjaba dan Banu Mazin terjadi di mana ia dikalahkan dan masuk ke bentengnya. Mas'ud ibn Mu'tab al-Thaqafi datang kepadanya mencari aliansi Ansar melawan Banu Malik, dan dia berkata kepadanya: Tidak ada seorang pun dari bangsanya yang keluar untuk bersumpah pada aliansi kecuali mengakui rakyat dari bangsanya sendiri. Dia berkata, 'Saudaramu, yang kamu tinggalkan, kembalilah kepadanya dan berdamai dengannya, meskipun itu dengan serpihan hidung dan telingamu.' Dia kemudian meninggalkannya dan memberinya senjata, persediaan, dan seorang anak untuk membangun benteng. Dia membangun benteng pertama Taif {cite:Kamil-ibn-al-Athir hlm. 513}."
