summary:
  ar: "أحيحة بن الجلاح الأوسي، سيد بني جحجبا ويعدّ من أعز أهل يثرب قبل الإسلام؛ دُفع إليه الغطفاني فرسه عند سوق بني قينقاع تعظيماً له، وكان له صولة في أمر قتل كعب بن العجلان بحرب سمير، وأمر جماعة فرصدوا كعب بن عمرو المازني حتى ظفروا به فقتلوه فكانت حرب بني جحجبا وبني مازن التي انهزم فيها ودخل حصنه، وقدم عليه مسعود بن معتب الثقفي يطلب حلف الأنصار على بني مالك فقال له ما خرج رجل من قومه إلى قوم بحلف إلا أقر لهم بشر مما أنف منه من قومه، وقال أخوك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك فانصرف عنه وزوده بسلاح وزاد وغلاماً يبني الآطام فبنى للطائف أول أطمها {cite:kamil-ibn-al-athir p. 513}."
  en: "Uhayha ibn al-Julah of Aws, sayyid of Banu Juhjuba and reckoned among the mightiest men of Yathrib before Islam; the Ghatafani's horse was yielded to him at the Qaynuqa market, his word loomed over the Samir war, and his order to kill Ka'b ibn Amr al-Mazini set off the Juhjuba-Mazin war in which he was routed to his fortress; and when Thaqif's Mas'ud ibn Mu'tib sought the Ansar's pact he refused — 'your brother is the one you left behind' — sending him home with a slave who built Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 513}."
