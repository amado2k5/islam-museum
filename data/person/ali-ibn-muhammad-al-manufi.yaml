summary:
  ar: "علي بن محمد بن محمد بن محمد بن خلف، نور الدين، أبو الحسن، المنوفي المصري، المعروف بالشاذلي، فقيه مالكي ومحقق، أخذ عن النور السنهوري وبه تفقه، وعن الشهاب بن الأقطع وعمر الثنائي والسيوطي وغيرهم. توفي سنة 939 هـ بحسب ما ذكره الكتاب، وصنف التصانيف النافعة في الفقه، منها «عمدة السالك»، و«تحفة المصلي»، و«غاية الأماني» في شرح رسالة ابن أبي زيد القيرواني، و«كفاية الطالب الرباني»، و«شفاء العليل في لغات خليل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  en: "Ali ibn Muhammad ibn Muhammad ibn Muhammad ibn Khalaf, Nur al-Din, Abu al-Hasan, al-Manufi of Egypt, known as al-Shadhili, a Maliki jurist and scholar. He studied with al-Nur al-Sanhuri, in whose school he learned law, and with al-Shihab ibn al-Aqta', Umar al-Tha'nai and al-Suyuti. The book gives 939 AH as his death year. His works include 'Umdat al-salik, Tuhfat al-musalli, Ghayat al-amani (a commentary on the treatise of Ibn Abi Zayd al-Qayrawani), Kifayat al-talib al-rabbani and Shifa' al-'alil fi lughat Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  es: "Ali ibn Muhammad ibn Muhammad ibn Muhammad ibn Khalaf, Nur al-Din, Abu al-Hasan, al-Manufi de Egipto, conocido como al-Shadhili, jurista y erudito Maliki. Estudió con al-Nur al-Sanhuri, en cuya escuela aprendió derecho, y con al-Shihab ibn al-Aqta', Umar al-Tha'nai y al-Suyuti. El libro indica 939 AH como año de su muerte. Sus obras incluyen 'Umdat al-salik, Tuhfat al-musalli, Ghayat al-amani (un comentario sobre el tratado de Ibn Abi Zayd al-Qayrawani), Kifayat al-talib al-rabbani y Shifa' al-'alil fi lughat Khalil. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  fr: "Ali ibn Muhammad ibn Muhammad ibn Muhammad ibn Khalaf, Nur al-Din, Abu al-Hasan, al-Manufi d'Égypte, connu sous le nom d'al-Shadhili, juriste et érudit malikite. Il a étudié avec al-Nur al-Sanhuri, à l'école duquel il a appris le droit, et avec al-Shihab ibn al-Aqta', Umar al-Tha'nai et al-Suyuti. Le livre donne 939 AH comme année de décès. Ses œuvres comprennent 'Umdat al-salik, Tuhfat al-musalli, Ghayat al-amani (un commentaire sur le traité d'Ibn Abi Zayd al-Qayrawani), Kifayat al-talib al-rabbani et Shifa' al-'alil fi lughat Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  ur: "علی بن محمد بن محمد بن محمد بن خلف، نورالدین، ابو الحسن، مصر کے المنفی، الشدلی کے نام سے مشہور، ایک مالکی فقیہ اور عالم تھے۔ اس نے النور السنہوری کے ساتھ تعلیم حاصل کی، جس کے اسکول میں اس نے قانون سیکھا، اور الشہاب ابن الاقتع، عمر الثنائی اور السیوطی کے ساتھ تعلیم حاصل کی۔ کتاب میں ان کی وفات کا سال 939ھ بتایا گیا ہے۔ ان کی تصانیف میں عمدۃ السالک، تحفۃ المصلی، غیاث الامانی ⁦(ابن ابی زید القیروانی کے مقالے کی تفسیر)⁩، کفایت الطالب الربانی، اور شفاء العلیل فی لغت خلیل شامل ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15420}"
  tr: "Ali bin Muhammed ibn Muhammed ibn Muhammed ibn Halef, Nur al-Din, Ebu el-Hasan, el-Manufi el-Masri, el-Şadli olarak bilinen, Maliki hukukçusu ve araştırmacıydı; fıkıh eğitimini al-Nur el-Sanhuri'nin yanında ve fıkıh eğitimi al-Şihab bin el-Akta, Ömer el-Thanayy, el-Suyuti ve diğerlerinin yanında çalışmıştır. Kitaba göre 939 Hicri'de öldü ve 'Umdat al-Salik' dahil olmak üzere yararlı hukuk eserleri yazdı: 'Tuhfat al-Musalli', 'Ghayat al-Amani' İbn Ebi Zayd al-Qayrawani'nin risalesini, 'Kifayat al-Talib al-Rabbani' ve 'Shifa' al-'ilil fi Lughat Khalil'i açıklarken. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.15420}"
  id: "Ali ibn Muhammad ibn Muhammad ibn Muhammad ibn Khalaf, Nur al-Din, Abu al-Hasan, al-Manufi al-Masri, yang dikenal sebagai al-Shadhili, adalah seorang ahli hukum dan peneliti Maliki yang mempelajari hukum di bawah bimbingan al-Nur al-Sanhuri serta mempelajari hukum di bawah bimbingan al-Shihab ibn al-Aqta, Umar al-Thanayy, al-Suyuti, dan lainnya. Ia meninggal pada tahun 939 H menurut buku tersebut dan menulis karya-karya bermanfaat dalam bidang fiqh, termasuk 'Umdat al-Salik,' 'Tuhfat al-Musalli,' 'Ghayat al-Amani' dalam menjelaskan risalah Ibn Abi Zayd al-Qayrawani, 'Kifayat al-Talib al-Rabbani,' dan 'Shifa' al-'ilil fi Lughat Khalil. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.15420}"
