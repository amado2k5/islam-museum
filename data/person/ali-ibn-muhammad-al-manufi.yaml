label:
  ar: "علي بن محمد المنوفي"
  en: "Ali ibn Muhammad al-Manufi al-Shadhili"
summary:
  ar: "علي بن محمد بن محمد بن محمد بن خلف، نور الدين، أبو الحسن، المنوفي المصري، المعروف بالشاذلي، فقيه مالكي ومحقق، أخذ عن النور السنهوري وبه تفقه، وعن الشهاب بن الأقطع وعمر الثنائي والسيوطي وغيرهم. توفي سنة 939 هـ بحسب ما ذكره الكتاب، وصنف التصانيف النافعة في الفقه، منها «عمدة السالك»، و«تحفة المصلي»، و«غاية الأماني» في شرح رسالة ابن أبي زيد القيرواني، و«كفاية الطالب الرباني»، و«شفاء العليل في لغات خليل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  en: "Ali ibn Muhammad ibn Muhammad ibn Muhammad ibn Khalaf, Nur al-Din, Abu al-Hasan, al-Manufi of Egypt, known as al-Shadhili, a Maliki jurist and scholar. He studied with al-Nur al-Sanhuri, in whose school he learned law, and with al-Shihab ibn al-Aqta', Umar al-Tha'nai and al-Suyuti. The book gives 939 AH as his death year. His works include 'Umdat al-salik, Tuhfat al-musalli, Ghayat al-amani (a commentary on the treatise of Ibn Abi Zayd al-Qayrawani), Kifayat al-talib al-rabbani and Shifa' al-'alil fi lughat Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
