  en: "The Hanbali jurist and theologian titled Shaykh al-Islam Taqi al-Din, of Harran and Damascus, author of al-Aqida al-Wasitiyya, which he wrote in 698 AH. Al-Dhahabi's Siyar entry (juz 17, p. 541) has him born on 10 Rabi' al-Awwal 661 AH in Harran, excelling in tafsir, hadith, legal theory and kalam with a quick mind and the instant recall of hadith texts and their isnads; he is reported to have said 'if Ibn Taymiyya is not Shaykh al-Islam, who is?', died Saturday 4 Jumada al-Akhira 728 and was buried at al-Qarafa {cite:siyar-alam-nubala 17/541}. Al-Dhahabi's Tadhkirat al-Huffaz entry (part 4, p. 1496) has him born in Rabi' al-Awwal 661 AH, 'of the oceans of knowledge and the quick-witted', whose works 'rode the caravan routes' at some three hundred volumes; he was tried and imprisoned repeatedly — Egypt's citadel, Cairo and Alexandria, and twice in Damascus's citadel — and died 20 Dhu al-Qa'da 728 in confinement, buried at the Sufiyya cemetery {cite:tabaqat-huffaz 4/1496}."
