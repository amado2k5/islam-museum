summary:
  ar: "شيخ الإسلام تقي الدين، فقيه ومتكلم حنبلي من حرّان ودمشق، صاحب «العقيدة الواسطية» التي كتبها سنة 698هـ، وفي سنة تسع وسبع مئة تكلم الوزير في إعادة أهل الذمة إلى لبس العمائم البيض وأنهم التزموا للديوان بسبع مئة ألف كل سنة زيادة على الجالية فقام الشيخ تقي الدين ابن تيمية في إبطال ذلك قياماً عظيماً وبطل {cite:tarikh-khulafa-minhaj-1434 p. 734-735}. وفي سنة سبع مئة جاوز غازان بجيشه الفرات وقصد حلب وساق الشيخ تقي الدين بن تيمية في البريد إلى القاهرة يحرض الناس على الجهاد واجتمع بأكابر الأمراء ثم نودي في دمشق من قدر على الهرب فلينج بنفسه فانقلبت المدينة ورُصّ الخلق بالقلعة وأشرف الناس على خطة صعبة وبقي الخوف أياماً ثم تناقص برجعة غازان لما ناله من المشاق والثلوج {cite:shadharat-dhahab p. 429}."
  en: "The Hanbali jurist and theologian titled Shaykh al-Islam Taqi al-Din, of Harran and Damascus, author of al-Aqida al-Wasitiyya, which he wrote in 698 AH."
