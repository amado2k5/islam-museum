summary:
  ar: "غليم بن رجار؛ ولما هلك رجار صاحب صقلية في العشر الأخير من ذي الحجة مَلَك بعده ابنه غليم وعليه قدم أبو الفتوح نصر الله بن قلاقس الشاعر ومدحه وأجازه وذلك في سنة ثلاث وستين وخمسمائة {cite:wafayat-ayan}."
  en: "William I of Sicily (Ghulaym b. Rujar) — succeeded his father Roger II; the poet Ibn Qalaqis came to his court in 563, praised him, and was rewarded {cite:wafayat-ayan}."
  es: "Guillermo I de Sicilia (Ghulaym b. Rujar) — sucedió a su padre Roger II; el poeta Ibn Qalaqis llegó a su corte en 563, lo elogió y fue recompensado {cite:wafayat-ayan}."
  fr: "Guillaume Ier de Sicile (Ghulaym b. Rujar) — succéda à son père Roger II; le poète Ibn Qalaqis vint à sa cour en 563, le loua et fut récompensé {cite:wafayat-ayan}."
  ur: "سسلی کا ولیم اول ⁦(غلیم بن روجر)⁩ - اپنے والد راجر دوم کی جانشینی۔ شاعر ابن قلقیس 563 میں اس کے دربار میں آیا، اس کی تعریف کی، اور اسے انعام سے نوازا گیا۔"
  tr: "Ghulaym ibn Rujjar; Sicilya hükümdarı Rujjar, Dhu al-Hijjah'ın son on gününde öldüğünde, oğlu Ghulaym onun yerine geçti. Şair Abu al-Futuh Nasrullah ibn Qalaqis onu övdü ve 563 Hicri yılında izin verdi."
  id: "Ghulaym ibn Rujjar; ketika Rujjar, penguasa Sisilia, meninggal dalam sepuluh hari terakhir Dhu al-Hijjah, putranya Ghulaym menggantikannya. Abu al-Futuh Nasrullah ibn Qalaqis, sang penyair, memujinya dan memberinya izin pada tahun 563 H."
