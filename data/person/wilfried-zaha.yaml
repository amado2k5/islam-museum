summary:
  ar: "لاعب كرة قدم عاجي، وُلد في أبيدجان بساحل العاج سنة 1992 ونشأ في إنجلترا. جناح من ناشئي كريستال بالاس، كان آخر صفقات أليكس فيرغسون مع مانشستر يونايتد سنة 2013، ثم عاد إلى بالاس فصار هدّافه التاريخي في الدوري الإنجليزي الممتاز، ولعب لغلطة سراي وتشارلوت. خاض مباراتين وديتين مع إنجلترا ثم اختار منتخب ساحل العاج سنة 2017."
  en: "Ivorian footballer, born in Abidjan, Ivory Coast in 1992 and raised in England. A Crystal Palace academy winger who was Alex Ferguson's last signing for Manchester United in 2013, then returned to Palace and became the club's record Premier League goalscorer; he later played for Galatasaray and Charlotte FC. He won two friendly caps for England before switching to the Ivory Coast national team in 2017."
  ur: "آئیوریائی فٹبالر، 1992 میں آئیوری کوسٹ کے عابدجان میں پیدا ہوئے اور انگلستان میں پلے بڑھے۔ کرسٹل پیلس اکیڈمی کے ونگر، 2013 میں مانچسٹر یونائیٹڈ کے لیے ایلکس فرگوسن کی آخری خریداری تھے، پھر پیلس واپس آ کر کلب کے پریمیئر لیگ کے سب سے بڑے گول اسکورر بنے؛ بعد میں غلطہ سرائے اور شارلٹ کے لیے کھیلے۔ انگلستان کے لیے دو دوستانہ میچ کھیلنے کے بعد 2017 میں آئیوری کوسٹ کی قومی ٹیم اختیار کی۔"
