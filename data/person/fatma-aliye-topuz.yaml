summary:
  ar: "روائية وكاتبة تركية عثمانية (1862-1936)، ابنة المؤرخ والفقيه أحمد جودت باشا، تُعدّ بخمس روايات أول روائية في الأدب التركي والعالم الإسلامي. بدأت بترجمة «ميرام» (1889) باسم مستعار، وكتبت «محاضرات» (1892) و«عودي» (1899) وغيرهما، ودافعت في مقالاتها وكتابها «نساء الإسلام» عن حقوق المرأة من داخل التقاليد الإسلامية، وأسست جمعية خيرية سنة 1897 وكانت أول امرأة في الهلال الأحمر العثماني. وُضعت صورتها على ورقة الخمسين ليرة التركية سنة 2009."
  en: "Ottoman Turkish novelist and essayist (1862–1936), daughter of the historian and jurist Ahmed Cevdet Pasha, credited with five novels as the first female novelist in Turkish literature and the Islamic world. She began with the translation Meram (1889) under a pen name, wrote Muhazarat (1892) and Udi (1899) among other novels, defended women's rights from within Islamic tradition in her columns and her book Nisvan-ı İslam ('Women of Islam'), founded an aid association in 1897 and was the first woman member of the Ottoman Red Crescent. Her portrait appeared on Turkey's 50-lira banknote in 2009."
  ur: "عثمانی ترک ناول نگار و مصنفہ (1862-1936)، مؤرخ و فقیہ احمد جودت پاشا کی بیٹی؛ پانچ ناولوں کے ساتھ ترک ادب اور عالمِ اسلام کی پہلی خاتون ناول نگار تسلیم کی جاتی ہیں۔ آغاز قلمی نام سے ترجمے «میرام» (1889) سے ہوا؛ «محاضرات» (1892) اور «عودی» (1899) لکھیں، اپنے کالموں اور کتاب «نسوانِ اسلام» میں اسلامی روایت کے اندر رہ کر خواتین کے حقوق کی وکالت کی، 1897 میں فلاحی انجمن بنائی اور عثمانی ہلالِ احمر کی پہلی خاتون رکن بنیں۔ 2009 میں ان کی تصویر پچاس لیرے کے نوٹ پر چھپی۔"
  es: "Novelista y ensayista otomana (1862-1936), hija del historiador y jurista Ahmed Cevdet Pasha, reconocida por sus cinco novelas como la primera novelista femenina de la literatura turca y del mundo islámico. Comenzó su carrera con la traducción de Meram (1889) bajo seudónimo, escribió Muhazarat (1892) y Udi (1899), entre otras novelas, defendió los derechos de la mujer desde la tradición islámica en sus columnas y en su libro Nisvan-ı İslam («Mujeres del Islam»), fundó una asociación de ayuda en 1897 y fue la primera mujer miembro de la Media Luna Roja Otomana. Su retrato apareció en el billete turco de 50 liras en 2009."
  fr: "Romancière et essayiste ottomane (1862-1936), fille de l'historien et juriste Ahmed Cevdet Pacha, elle est l'auteure de cinq romans et la première femme romancière de la littérature turque et du monde islamique. Elle débuta par la traduction de Meram (1889) sous un pseudonyme, puis écrivit Muhazarat (1892) et Udi (1899), entre autres. Elle défendit les droits des femmes dans le respect de la tradition islamique, notamment dans ses chroniques et son ouvrage Nisvan-ı İslam (« Femmes de l'Islam »). Elle fonda une association caritative en 1897 et fut la première femme membre du Croissant-Rouge ottoman. Son portrait figurait sur le billet de 50 lires turques en 2009."
  tr: "Osmanlı Türk romancı ve yazar (1862-1936), tarihçi ve hukukçu Ahmed Cevdat Paşa'nın kızı olan Ther, beş romanıyla Türk ve İslam edebiyatında ilk romancı olarak kabul edilir. 'Miram'ı (1889) takma adla çevirmeye başladı, 'Dersler' (1892), 'Oudi' (1899) ve diğerlerini yazdı. 'İslam Kadınları' adlı makalelerinde ve kitabında İslam gelenekleri içinde kadın haklarını savundu, 1897'de bir hayır derneği kurdu ve Osmanlı Kızılay'ındaki ilk kadın oldu. Portresi 2009'da elli Türk lirası banknotunda yer aldı."
  id: "Seorang novelis dan penulis Turki Ottoman (1862-1936), putri sejarawan dan ahli hukum Ahmed Cevdat Pasha, ia dianggap sebagai novelis pertama dalam sastra Turki dan Islam dengan lima novel. Ia mulai menerjemahkan 'Miram' (1889) dengan nama samaran, menulis 'Lectures' (1892), 'Oudi' (1899), dan lainnya. Ia membela hak-hak perempuan dalam tradisi Islam dalam artikel dan bukunya 'Women of Islam,' mendirikan asosiasi amal pada tahun 1897, dan menjadi perempuan pertama di Bulan Sabit Merah Ottoman. Potretnya ditempatkan di uang kertas lima puluh lira Turki pada tahun 2009."
