summary:
  ar: "روائية وكاتبة تركية عثمانية (1862-1936)، ابنة المؤرخ والفقيه أحمد جودت باشا، تُعدّ بخمس روايات أول روائية في الأدب التركي والعالم الإسلامي. بدأت بترجمة «ميرام» (1889) باسم مستعار، وكتبت «محاضرات» (1892) و«عودي» (1899) وغيرهما، ودافعت في مقالاتها وكتابها «نساء الإسلام» عن حقوق المرأة من داخل التقاليد الإسلامية، وأسست جمعية خيرية سنة 1897 وكانت أول امرأة في الهلال الأحمر العثماني. وُضعت صورتها على ورقة الخمسين ليرة التركية سنة 2009."
  en: "Ottoman Turkish novelist and essayist (1862–1936), daughter of the historian and jurist Ahmed Cevdet Pasha, credited with five novels as the first female novelist in Turkish literature and the Islamic world. She began with the translation Meram (1889) under a pen name, wrote Muhazarat (1892) and Udi (1899) among other novels, defended women's rights from within Islamic tradition in her columns and her book Nisvan-ı İslam ('Women of Islam'), founded an aid association in 1897 and was the first woman member of the Ottoman Red Crescent. Her portrait appeared on Turkey's 50-lira banknote in 2009."
  ur: "عثمانی ترک ناول نگار و مصنفہ (1862-1936)، مؤرخ و فقیہ احمد جودت پاشا کی بیٹی؛ پانچ ناولوں کے ساتھ ترک ادب اور عالمِ اسلام کی پہلی خاتون ناول نگار تسلیم کی جاتی ہیں۔ آغاز قلمی نام سے ترجمے «میرام» (1889) سے ہوا؛ «محاضرات» (1892) اور «عودی» (1899) لکھیں، اپنے کالموں اور کتاب «نسوانِ اسلام» میں اسلامی روایت کے اندر رہ کر خواتین کے حقوق کی وکالت کی، 1897 میں فلاحی انجمن بنائی اور عثمانی ہلالِ احمر کی پہلی خاتون رکن بنیں۔ 2009 میں ان کی تصویر پچاس لیرے کے نوٹ پر چھپی۔"
