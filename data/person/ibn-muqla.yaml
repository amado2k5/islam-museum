label: { ar: "ابن مقلة الوزير" }
summary:
  ar: "وزير عباسي وُلّي الوزارة في سنة ست عشرة وثلاثمائة، وصُرف عنها في سنة ثماني عشرة وثلاثمائة، وحُبس في دار الخليفة، وقُلّد سليمان بن الحسن بن مخلّد مكانه {cite:tabari-tarikh-abu-al-fadl j.11 p.117} {cite:tabari-tarikh-abu-al-fadl j.11 p.130}، وفوضت إليه الوزارة لما لقبوا القاهر سنة سبع عشرة، واتفق هو ومؤنس وآخرون على خلع القاهر سنة إحدى وعشرين فاختفى فأحرقت داره ونهبت دور المخالفين، وأمر الراضي ابن مقلة أن يكتب كتاباً فيه مثالب القاهر يقرأ على الناس {cite:tarikh-khulafa-minhaj-1434 p. 591,597,603}. وعند المسعودي استوزره المقتدر بعد علي بن عيسى وهو أبو علي محمد بن علي بن مقلة {cite:muruj-al-dhahab p. 661}، وذكره ابن النديم في باب خطوط المصاحف والكتّاب {cite:fihrist-ibn-al-nadim p. 20-24}، وعند ابن الأثير في وزارته للمقتدر قبض على الشلمغاني سنة 322هـ وسجنه وكشف داره فوجد فيها الرقاع {cite:kamil-ibn-al-athir p. 218}، وعند ابن الأثير هو الذي دبّر خلع القاهر سنة 322هـ وكان مستخفياً يجتمع بالقواد ليلاً تارة في زق أعمى وتارة في زي مكدي وتارة في زي امرأة ويحذرهم بد ويعطي المنجمين والمعبّرين ليحذروا سيماء من القاهر {cite:kamil-ibn-al-athir p. 209}، وعند ابن الأثير عزله القاهر بعد القبض على مؤنس سنة 321هـ وختم على داره ونُهبت وأُحرقت ونُهبت دور المتعلقين به واستوزر أبا جعفر محمد بن القاسم بن عبيد الله الذي كان صاحب مشورته {cite:kamil-ibn-al-athir p. 191}، وعند ابن الأثير ولده الحسين بن مقلة وزر للمتقي وكان يقول بعد سمل المتقي نصحني الإخشيد فلم أقبل نصيحته {cite:kamil-ibn-al-athir p. 312-313}، وعند ابن الجوزي وخاف القاهرَ بالله فاستتر وأغرى الجند به فخلعوه وسملوا عينيه سنة 333هـ {cite:muntazam-ibn-al-jawzi p. 660} وعند ابن الجوزي قُبض عليه سنة ثمان عشرة وكانت مدة وزارته سنتين وأربعة أشهر وثلاثة أيام، واحترقت داره التي في وجه أزاهر في جمادى الأولى وكان أنفق عليها مائة ألف دينار فانتهب الناس الخشب والرصاص والحديد، وقطعت يده اليمنى سنة ست وعشرين لرقعة ضمن فيها لابن رائق ألفي ألف دينار {cite:muntazam-ibn-al-jawzi p. 529, 589}."
  tr: "Bir Abbasi veziri onu 316 Hicri yılında bakan olarak atadı, 300 Hile yılında görevden alındı ve halifenin konutunda hapsedildi. Süleyman bin el-Hasan ibn Mukhlad onu yerine atadı {alıntı: Tabari-Tarikh-Abu-al-Fadl J.11 s.117} {Cite:Tabari-Tarikh-Abu-al-Fadl J.11 s.130}. On yedinci yılda el-Qahir olarak adlandırıldıklarında bakanlık ona emanet edildi. O, Mu'nas ve diğerleri yirmi birinci yılda el-Kahir'i tahttan indirmeyi kabul etti, ancak el-Kahir ortadan kayboldu, evi yakıldı ve muhaliflerin evleri yağmalandı. El-Radi bin Muqla'ya, el-Kahir'in kusurlarını içeren bir kitap yazmasını emretti, halka okunması için {cite:History-Khulafa-minhaj-1434 s. 591,597,603}. al-Mas'udi'ye göre, al-Muqtadir onu, Ali ibn Isa'dan sonra atamıştır; Ali Ebu Ali Muhammed ibn Ali ibn Muqalla {cite:muruj-al-dhahab s. 661}. İbn al-Nadim onu Kur'an metinleri bölümünde ve {cite:fihrist-ibn-al-nadim s. 20-24} kitabında anmıştır. İbn al-Athir, el-Muqtadir vezirliği sırasında, 322 Hicri yılında el-Şalmaghani'yi yakaladı, hapsetti ve evini ortaya çıkardı; burada zincirleri buldu {atıf:kamil-ibn-al-athir s. 218}. İbn el-Atir'e göre, 322 Hicri yılında el-Kahir'in tahttan indirilmesini organize eden oydu ve geceleri komutanlarla gizlice, bazen kör sokakta görüştü Bazen Makdi kılığında, bazen kadın giysisi giymiş, onları uyarmış ve Simaa'yı el-Kahir konusunda uyarmaları için astrolog ve tercümanlar vermiştir {atıf:kamil-ibn-al-athir s. 209}. İbn al-Athir, 321 Hicri yılında Mu'anilerin yakalanmasından sonra onu tahttan indirdi, evini mühürledi, yağmaladı, yaktı ve ortaklarının evlerini yağmaladı. Danışmanı olan Ebu Ca'fer Muhammed bin el-Kasım bin Übeyd Allah'tan tavsiye aldı {alıntı: Kamil ibn-al-Athir s. 191} ve İbn al-Athir ile birlikte oğlu el-Hüseyin bin Mukalla dindarlara hizmetkâr olmuştu ve el-Muttaqi gülümsedikten sonra el-İhşid bana öğüt verdiğini söylerdi {atıf:kamil-ibn-al-athir s. 312-313}. İbn el-Cavazi, El-Kahir bil-Allah'tan korkuyordu ve askerleri onunla birlikte saklayıp ayarttı, böylece 333 Hicri'de onu uzaklaştırıp kör ettiler {atıf:Muntazam-ibn-al-Jawzi s. 660} İbn el-Cevzi onu on sekiz Hicri yılında yakaladı ve görev süresi iki yıl, dört ay ve üç gün sürdü. Azhar'a bakan evi Cumedül-Evval'de yakıldı ve orada harcamıştı Yüz bin dinar, böylece insanlar odun, kurşun ve demir yağmaladı, sağ eli ise 26 Hicri yılında İbn Ra'iq'e iki bin dinar garanti edilen bir komplo için kesildi {atıf:muntazam-ibn-al-jawzi s. 529, 589}."
  id: "Seorang wazir Abbasiyah mengangkatnya sebagai menteri pada tahun 316 H, diberhentikan pada tahun 300 H, dan dipenjara di kediaman khalifah. Sulayman ibn al-Hasan ibn Mukhlad mengangkatnya menggantikannya {cite:Tabari-Tarikh-abu-al-Fadl J.11 hlm.117} {kutip:Tabari-Tarikh-Abu-al-Fadl J.11 hlm.130}. Ia dipercayakan untuk menimpa kementerian ketika mereka disebut al-Qahir pada tahun ketujuh belas. Ia, Mu'nas, dan lainnya sepakat untuk menggulingkan al-Qahir pada tahun dua puluh satu, tetapi ia menghilang, rumahnya dibakar, dan rumah-rumah para pembangkang dijarah. Ia memerintahkan al-Radi ibn Muqla untuk menulis sebuah buku yang memuat kesalahan al-Qahir untuk dibacakan kepada rakyat {cite:History-Khulafa-minhaj-1434 hlm. 591,597,603}. Menurut al-Mas'udi, al-Muqtadir menunjuknya setelah Ali ibn Isa, yang merupakan Abu Ali Muhammad ibn Ali ibn Muqalla {cite:muruj-al-dhahab hlm. 661}. Ibn al-Nadim menyebutnya dalam bab tentang naskah Al-Qur'an dan kitab {cite:fihrist-ibn-al-nadim hlm. 20-24}. Ibn al-Athir, selama masa kepemimpinannya di al-Muqtadir, menangkap al-Shalmaghani pada tahun 322 H, memenjarakannya, dan menemukan rumahnya di mana ia menemukan belenggu {cite:kamil-ibn-al-athir hlm. 218}. Menurut Ibn al-Athir, dialah yang mengatur pencopotan al-Qahir pada tahun 322 H dan diam-diam bertemu dengan para komandan pada malam hari, kadang di gang buntu Kadang-kadang mengenakan pakaian Makdi, kadang mengenakan pakaian wanita, memperingatkan mereka serta memberi ahli nujum dan penerjemah untuk memperingatkan Simaa tentang al-Qahir {cite:kamil-ibn-al-athir hlm. 209}. Ibn al-Athir menggulingkannya setelah penaklukan Mu'anis pada tahun 321 H, menyegel rumahnya, menjarah, membakarnya, dan menjarah rumah rekan-rekannya. Ia meminta nasihat Abu Ja'far Muhammad ibn al-Qasim ibn Ubayd Allah, yang merupakan penasihatnya {cite: kamil-ibn-al-athir hlm. 191} dan bersama Ibn al-Athir, putranya al-Husayn ibn Muqalla adalah menteri bagi orang-orang saleh dan biasa mengatakan bahwa setelah al-Muttaqi tersenyum, al-Ikhshid menasihati saya, tetapi saya tidak menerima nasihatnya {cite:kamil-ibn-al-athir hlm. 312-313}. Ibn al-Jawzi takut kepada Al-Qahir bil-Allah dan menyembunyikan serta menggoda para prajurit bersamanya, sehingga mereka mengusirnya dan membutakannya pada tahun 333 H {cite:muntazam-ibn-al-jawzi hlm. 660} Ibn al-Jawzi menangkapnya pada tahun delapan belas H, dan masa jabatannya berlangsung selama dua tahun, empat bulan, dan tiga hari. Rumahnya yang menghadap Azhar dibakar di Jumada al-Awwal, dan ia menghabiskan waktu untuk itu Seratus ribu dinar, sehingga orang-orang menjarah kayu, timbal, dan besi, dan tangan kanannya dipotong pada tahun 26 H untuk sebuah lahan di mana Ibn Ra'iq dijamin dua ribu dinar {cite:muntazam-ibn-al-jawzi hlm. 529, 589}."
