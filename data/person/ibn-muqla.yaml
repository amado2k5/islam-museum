label: { ar: "ابن مقلة الوزير" }
summary:
  ar: "وزير عباسي وُلّي الوزارة في سنة ست عشرة وثلاثمائة، وصُرف عنها في سنة ثماني عشرة وثلاثمائة، وحُبس في دار الخليفة، وقُلّد سليمان بن الحسن بن مخلّد مكانه {cite:tabari-tarikh-abu-al-fadl j.11 p.117} {cite:tabari-tarikh-abu-al-fadl j.11 p.130}، وفوضت إليه الوزارة لما لقبوا القاهر سنة سبع عشرة، واتفق هو ومؤنس وآخرون على خلع القاهر سنة إحدى وعشرين فاختفى فأحرقت داره ونهبت دور المخالفين، وأمر الراضي ابن مقلة أن يكتب كتاباً فيه مثالب القاهر يقرأ على الناس {cite:tarikh-khulafa-minhaj-1434 p. 591,597,603}."
gender: male
