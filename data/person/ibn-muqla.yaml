label: { ar: "ابن مقلة الوزير" }
summary:
  ar: "وزير عباسي وُلّي الوزارة في سنة ست عشرة وثلاثمائة، وصُرف عنها في سنة ثماني عشرة وثلاثمائة، وحُبس في دار الخليفة، وقُلّد سليمان بن الحسن بن مخلّد مكانه {cite:tabari-tarikh-abu-al-fadl j.11 p.117} {cite:tabari-tarikh-abu-al-fadl j.11 p.130}، وفوضت إليه الوزارة لما لقبوا القاهر سنة سبع عشرة، واتفق هو ومؤنس وآخرون على خلع القاهر سنة إحدى وعشرين فاختفى فأحرقت داره ونهبت دور المخالفين، وأمر الراضي ابن مقلة أن يكتب كتاباً فيه مثالب القاهر يقرأ على الناس {cite:tarikh-khulafa-minhaj-1434 p. 591,597,603}.، وعند المسعودي استوزره المقتدر بعد علي بن عيسى وهو أبو علي محمد بن علي بن مقلة {cite:muruj-al-dhahab p. 661}، وذكره ابن النديم في باب خطوط المصاحف والكتّاب {cite:fihrist-ibn-al-nadim p. 20-24}، وعند ابن الأثير في وزارته للمقتدر قبض على الشلمغاني سنة 322هـ وسجنه وكشف داره فوجد فيها الرقاع {cite:kamil-ibn-al-athir p. 218}، وعند ابن الأثير هو الذي دبّر خلع القاهر سنة 322هـ وكان مستخفياً يجتمع بالقواد ليلاً تارة في زق أعمى وتارة في زي مكدي وتارة في زي امرأة ويحذرهم بد ويعطي المنجمين والمعبّرين ليحذروا سيماء من القاهر {cite:kamil-ibn-al-athir p. 209}، وعند ابن الأثير عزله القاهر بعد القبض على مؤنس سنة 321هـ وختم على داره ونُهبت وأُحرقت ونُهبت دور المتعلقين به واستوزر أبا جعفر محمد بن القاسم بن عبيد الله الذي كان صاحب مشورته {cite:kamil-ibn-al-athir p. 191}"
