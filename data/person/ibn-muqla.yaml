education:
  did_you_know:
    ar: "ابن مقلة وزير عباسي وخطاط أصل للخط، ولّي الوزارة في القرن الرابع الهجري ويُنسب إليه تدوين أصول خط المنصوب."
    en: "Ibn Muqla, the Abbasid vizier and master calligrapher, held the vizierate in the fourth Hijri century and is credited with codifying the proportioned script."
    ur: "ابن مقلہ، عباسی وزیر اور استاد خوش نویس، نے چوتھی صدی ہجری میں وزارت سنبھالی اور متناسب خط کے اصول مدون کرنے کے لیے جانا جاتا ہے۔"
    sources: [source/muntazam-ibn-al-jawzi, source/kamil-ibn-al-athir]
