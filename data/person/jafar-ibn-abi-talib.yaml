summary:
  en: "A brother of Ali who led the Muslim emigration to Abyssinia and answered the Negus for his people; killed at Mu'ta carrying the army's standard after Zayd ibn Haritha."
  ar: "أخو علي الذي قاد هجرة المسلمين إلى الحبشة وأجاب النجاشي عن قومه؛ قُتل في مؤتة حاملًا راية الجيش بعد زيد بن حارثة، وبإزائه في الجنة جناحان يطير بهما حتى لُقب «ذي الجناحين» فكان ابن عمر يسلم على ابنه «يا ابن ذي الجناحين» {cite:sahih-al-bukhari 4264}."
  ur: "علی کے بھائی، جنہوں نے حبشہ ہجرت کرنے والے مسلمانوں کی قیادت کی اور نجاشی کے سامنے ان کا مؤقف بیان کیا؛ مؤتہ میں لشکر کا پرچم اٹھائے ہوئے مارے گئے۔ {cite:ibn-sad-tabaqat-bewley}"
