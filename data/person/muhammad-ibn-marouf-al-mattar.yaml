summary:
  ar: "محمد بن معروف المطار، المعروف بمؤملة، من المشهورين بالنسك والعبادة والورع، كان إمام الجامع، سمع من يحيى بن سعيد القطان ويزيد بن هارون، وينسب إليه مسجد مؤملة بن معروف."
  en: "Muhammad ibn Ma'ruf al-Mattar, known as Mu'ammala, one of those famous for asceticism, worship and scrupulousness; he was imam of the main mosque and heard from Yahya ibn Sa'id al-Qattan and Yazid ibn Harun; the mosque of Mu'ammala ibn Ma'ruf is named after him."
  ur: "محمد بن معروف مطار، جو مؤملہ کے نام سے مشہور تھے، زہد، عبادت اور پرہیزگاری میں معروف؛ جامع مسجد کے امام تھے، اور یحییٰ بن سعید قطان اور یزید بن ہارون سے سنا۔ ان کی طرف مسجد مؤملہ بن معروف منسوب ہے۔"
  es: "Muhammad ibn Ma'ruf al-Mattar, conocido como Mu'ammala, fue uno de los famosos por su ascetismo, devoción y escrupulosidad; fue imán de la mezquita principal y recibió enseñanzas de Yahya ibn Sa'id al-Qattan y Yazid ibn Harun; la mezquita de Mu'ammala ibn Ma'ruf lleva su nombre."
  fr: "Muhammad ibn Ma'ruf al-Mattar, connu sous le nom de Mu'ammala, était célèbre pour son ascétisme, sa dévotion et sa scrupulosité; il était imam de la mosquée principale et a reçu l'enseignement de Yahya ibn Sa'id al-Qattan et de Yazid ibn Harun; la mosquée de Mu'ammala ibn Ma'ruf porte son nom."
  tr: "Muhammed bin Ma'ruf al-Matar, Mu'amla olarak bilinir, münzevi, ibadet ve takvayla tanınırdı. Yahya ibn Sa'id al-Qattan ve Yazid ibn Harun'dan duyulan Cami imamı olarak bilinir; Mu'mala ibn Ma'ruf camisi ona atfedilir."
  id: "Muhammad ibn Ma'ruf al-Matar, yang dikenal sebagai Mu'amla, terkenal karena asketisme, ibadah, dan kesalehannya. Ia adalah imam masjid tersebut, yang didengar dari Yahya ibn Sa'id al-Qattan dan Yazid ibn Harun, dan masjid Mu'mala ibn Ma'ruf dikaitkan dengannya."
