  ar: "محمد بن معروف المطار، المعروف بمؤملة، من المشهورين بالنسك والعبادة والورع، كان إمام الجامع، سمع من يحيى بن سعيد القطان ويزيد بن هارون، وينسب إليه مسجد مؤملة بن معروف."
  en: "Muhammad ibn Ma'ruf al-Mattar, known as Mu'ammala, one of those famous for asceticism, worship and scrupulousness; he was imam of the main mosque and heard from Yahya ibn Sa'id al-Qattan and Yazid ibn Harun; the mosque of Mu'ammala ibn Ma'ruf is named after him."
  ur: "محمد بن معروف مطار، جو مؤملہ کے نام سے مشہور تھے، زہد، عبادت اور پرہیزگاری میں معروف؛ جامع مسجد کے امام تھے، اور یحییٰ بن سعید قطان اور یزید بن ہارون سے سنا۔ ان کی طرف مسجد مؤملہ بن معروف منسوب ہے۔"
