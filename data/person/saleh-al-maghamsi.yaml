summary:
  ar: "عالم وداعية سعودي ومفسّر، وُلد سنة 1963 في منطقة المدينة المنورة. درس اللغة العربية والعلوم الإسلامية في جامعة الملك عبد العزيز وتتلمذ على ابن باز وابن عثيمين وغيرهما، وكان إمامًا وخطيبًا لمسجد قباء نحوًا من سنة 2006، وله دروس وبرامج تلفزيونية في التفسير، وعُيّن بمرسوم ملكي في فبراير 2026 إمامًا للمسجد النبوي."
  en: "Saudi scholar, preacher and Qur'an exegete, born in 1963 in the Medina region. He studied Arabic language and Islamic sciences at King Abdulaziz University and under Ibn Baz, Ibn Uthaymin and others, served as imam and khatib of Quba Mosque from about 2006, is known for his recorded and televised lessons in exegesis, and was appointed by royal decree in February 2026 as an imam of the Prophet's Mosque."
  ur: "سعودی عالم، مبلغ اور مفسر، جو 1963 میں مدینہ کے علاقے میں پیدا ہوئے۔ انہوں نے جامعہ ملک عبدالعزیز میں عربی زبان اور اسلامی علوم کی تعلیم پائی اور ابن باز و ابن عثیمین سمیت دیگر علماء سے استفادہ کیا، تقریباً 2006 سے مسجد قبا کے امام و خطیب رہے، تفسیر میں ان کے ریکارڈ شدہ اور ٹیلی ویژن دروس مشہور ہیں، اور فروری 2026 میں شاہی فرمان سے مسجد نبوی کے امام مقرر ہوئے۔"
