label: { ar: "أم عاصم زوجة لذريق" }
gender: female
summary:
  ar: "زوجة لذريق ملك القوط؛ صالحت على نفسها وأموالها وقت الفتح وباءت بالجزية وأقامت على دينها في ظل نعمتها إلى أن نكحها الأمير عبد العزيز بن موسى فحظيت عنده، وكان تزوجها فيما نقمه الجند عليه {cite:nafh-tib-maqqari p. 317}."
  en: "Roderic's widow, who had surrendered on terms and stayed on her faith under the jizya until the amir Abd al-Aziz b. Musa married her — a charge among those for which the army killed him {cite:nafh-tib-maqqari p. 317}."
  es: "La viuda de Roderic, que se había rendido bajo ciertas condiciones y se mantuvo fiel a su fe bajo la jizya hasta que el emir Abd al-Aziz b. Musa se casó con ella, una acusación entre las que el ejército le causó la muerte {cite:nafh-tib-maqqari p. 317}."
  fr: "La veuve de Roderic, qui s'était rendue à certaines conditions et était restée fidèle à sa foi sous la jizya jusqu'à ce que l'émir Abd al-Aziz b. Musa l'épouse — une accusation parmi celles pour lesquelles l'armée l'a tué {cite:nafh-tib-maqqari p. 317}."
  ur: "روڈرک کی بیوہ، جس نے شرائط پر ہتھیار ڈال دیے تھے اور جزیہ کے تحت امیر عبد العزیز بن محمد تک اپنے عقیدے پر قائم رہیں۔ موسی نے اس سے شادی کی - ان لوگوں میں سے ایک الزام جس کی وجہ سے فوج نے اسے قتل کیا 317}۔"
