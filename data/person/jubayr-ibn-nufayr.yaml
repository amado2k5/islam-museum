id: person/jubayr-ibn-nufayr
class: person
label: { ar: "جبير بن نفير", en: "Jubayr ibn Nufayr", es: "Jubayr ibn Nufayr", fr: "Jubayr ibn Nufayr", ur: "جبیر بن نفیر" }
summary:
  ar: "جبير بن نفير بن مالك بن عامر، أبو عبد الرحمن الحضرمي، تابعي أدرك زمان النبي ولم يره. روى عن أبي بكر الصديق وعمر بن الخطاب والمقداد بن الأسود وعبادة بن الصامت وعقبة بن عامر وغيرهم، وروى عنه ابنه عبد الرحمن ومكحول وخالد بن معدان وصفوان بن عمرو وغيرهم. عدّه الكتاب في كبار تابعي أهل الشام، وذكر أن لأبيه صحبة، وقال أبو حاتم وأبو زرعة الدمشقي إنه ثقة. ويذكر الكتاب وفاته سنة 75 هـ وقيل 80 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
  en: "Jubayr ibn Nufayr al-Hadrami, Abu Abd al-Rahman, a Successor who lived in the time of the Prophet without meeting him. He related from Abu Bakr, Umar ibn al-Khattab, al-Miqdad ibn al-Aswad, Ubada ibn al-Samit and Uqba ibn Amir, among others, and his son Abd al-Rahman, Makhul and Khalid ibn Ma'dan related from him. The book counts him among the senior Successors of Syria, notes that his father was a Companion, and records Abu Hatim and Abu Zur'a as calling him trustworthy. It gives his death as 75 AH, or 80 AH according to another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
  es: "Jubayr ibn Nufayr al-Hadrami, Abu Abd al-Rahman, un Sucesor que vivió en la época del Profeta sin conocerlo personalmente. Relató de Abu Bakr, Umar ibn al-Khattab, al-Miqdad ibn al-Aswad, Ubada ibn al-Samit y Uqba ibn Amir, entre otros, y su hijo Abd al-Rahman, Makhul y Khalid ibn Ma'dan relataron de él. El libro lo incluye entre los Sucesores de mayor rango de Siria, señala que su padre fue un Compañero y registra que Abu Hatim y Abu Zur'a lo consideraban digno de confianza. Indica que murió en el año 75 de la Hégira, o en el 80 de la Hégira según otro relato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
  fr: "Jubayr ibn Nufayr al-Hadrami, fils d'Abu Abd al-Rahman, était un Successeur ayant vécu à l'époque du Prophète sans le rencontrer. Il rapporta des hadiths d'après Abu Bakr, Umar ibn al-Khattab, al-Miqdad ibn al-Aswad, Ubada ibn al-Samit et Uqba ibn Amir, entre autres. Son fils, Abd al-Rahman, Makhul et Khalid ibn Ma'dan rapportèrent également des hadiths de lui. L'ouvrage le compte parmi les Successeurs les plus importants de Syrie, précise que son père était un Compagnon et rapporte qu'Abu Hatim et Abu Zur'a le qualifiaient de digne de confiance. Il situe sa mort en 75 AH, ou en 80 AH selon une autre source. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
  ur: "جبیر بن نفیر الحدرمی، ابو عبدالرحمن، ایک جانشین جو رسول اللہ کے زمانے میں آپ سے ملے بغیر رہے۔ انہوں نے ابو بکر، عمر بن الخطاب، المقداد بن اسود، عبادہ بن الصامت اور عقبہ بن عامر وغیرہ سے اور ان کے بیٹے عبدالرحمٰن، مخول اور خالد بن معدان نے ان سے روایت کی ہے۔ کتاب ان کا شمار شام کے بزرگ جانشینوں میں کرتی ہے، نوٹ کرتی ہے کہ ان کے والد ایک صحابی تھے، اور ابو حاتم اور ابو زرعہ کو ثقہ قرار دیا ہے۔ اس میں ان کی وفات 75 ہجری یا دوسری روایت کے مطابق 80 ہجری بتائی گئی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6800}"
  tr: "Peygamber'in zamanında yaşamış ancak onu görmeyen bir Tabiyi olan Cubeyr ibn Nufayr ibn Malik ibn Amir, Ebu Abd al-Rahman al-Hadrami'den rivayet etmiştir. Ebu Bekir el-Siddiq, Ömer bin el-Hattab, el-Miqdad ibn el-Esvad, Ubadah ibn al-Samit, Uqbah ibn Amir ve diğerlerinden rivayet etmiştir. Oğulları Abd al-Rahman, Makhul, Halid ibn Ma'dan, Safwan ibn Amr ve diğerleri ondan rivayet etmiştir. Kitapta Şam halkının önde gelen Tabileri arasında sayılır ve babasının arkadaşı olduğu belirtilir. Ebu Hatim ve Ebu Zur'ah el-Dimashqi onun güvenilir olduğunu söyler. Kitapta 75 H yılında ve bazıları 80 Hicri yılında öldüğünü belirtir. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.6800}"
  id: "Jubayr ibn Nufayr ibn Malik ibn Amir, Abu Abd al-Rahman al-Hadrami, seorang Tabi'i yang hidup pada masa Nabi tetapi tidak pernah melihatnya. Ia menceritakan dari Abu Bakr al-Siddiq, Umar ibn al-Khattab, al-Miqdad ibn al-Aswad, Ubadah ibn al-Samit, Uqbah ibn Amir, dan lainnya. Putra-putranya Abd al-Rahman, Makhul, Khalid ibn Ma'dan, Safwan ibn Amr, dan lainnya menceritakan darinya. Kitab itu menghitungnya sebagai salah satu Tabi'i utama umat al-Sham, dan menyebutkan bahwa ayahnya memiliki teman. Abu Hatim dan Abu Zur'ah al-Dimashqi mengatakan ia dapat dipercaya. Kitab tersebut menyebutkan kematiannya pada tahun 75 H, dan beberapa orang mengatakan 80 H. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.6800}"
