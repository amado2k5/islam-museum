id: person/jubayr-ibn-nufayr
class: person
label: { ar: "جبير بن نفير", en: "Jubayr ibn Nufayr" }
summary:
  ar: "جبير بن نفير بن مالك بن عامر، أبو عبد الرحمن الحضرمي، تابعي أدرك زمان النبي ولم يره. روى عن أبي بكر الصديق وعمر بن الخطاب والمقداد بن الأسود وعبادة بن الصامت وعقبة بن عامر وغيرهم، وروى عنه ابنه عبد الرحمن ومكحول وخالد بن معدان وصفوان بن عمرو وغيرهم. عدّه الكتاب في كبار تابعي أهل الشام، وذكر أن لأبيه صحبة، وقال أبو حاتم وأبو زرعة الدمشقي إنه ثقة. ويذكر الكتاب وفاته سنة 75 هـ وقيل 80 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
  en: "Jubayr ibn Nufayr al-Hadrami, Abu Abd al-Rahman, a Successor who lived in the time of the Prophet without meeting him. He related from Abu Bakr, Umar ibn al-Khattab, al-Miqdad ibn al-Aswad, Ubada ibn al-Samit and Uqba ibn Amir, among others, and his son Abd al-Rahman, Makhul and Khalid ibn Ma'dan related from him. The book counts him among the senior Successors of Syria, notes that his father was a Companion, and records Abu Hatim and Abu Zur'a as calling him trustworthy. It gives his death as 75 AH, or 80 AH according to another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6800}"
