summary:
  en: "A wife of the Prophet and daughter of Abu Bakr; one of the most prolific transmitters of hadith in Sunni tradition, whose role is viewed differently across the traditions."
  ar: "زوجة النبي وابنة أبي بكر، من أكثر الرواة حديثًا في التقليد السني، ويُنظر إلى دورها بصورة مختلفة بين التقاليد. وعند البخاري أثبت النبي فضلها في قالب النساءات: «وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام» في حديث كمال آسية ومريم {cite:sahih-al-bukhari 3411}، وفي مسلم روايتها لقصة الإفك كاملة ضمن حديث أم زرع {cite:sahih-muslim 2770}، وروايتها لحديث الكساء عند نزول آية التطهير {cite:sahih-muslim 2424}."
  ur: "نبی کی اہلیہ اور ابو بکر کی بیٹی؛ سنی روایت میں حدیث کی کثیر الروایت راویوں میں شمار ہوتی ہیں۔ {cite:ibn-sad-tabaqat-bewley} مختلف روایتی مکاتب ان کے کردار کو مختلف انداز میں دیکھتے ہیں۔ {cite:encyclopaedia-of-islam-2}"
  es: "Esposa del Profeta e hija de Abu Bakr; una de las transmisoras de hadices más prolíficas de la tradición sunita, cuyo papel se interpreta de manera diferente según las distintas tradiciones."
  fr: "Épouse du Prophète et fille d'Abu Bakr; l'une des transmettrices de hadiths les plus prolifiques de la tradition sunnite, dont le rôle est perçu différemment selon les traditions."
  tr: "Peygamberin eşi ve Ebu Bekir'in kızı olan Hz. Aişe, Sünni geleneğinde en çok hadis rivayet edenlerden biridir ve rolü farklı geleneklerde farklı şekillerde değerlendirilir. Sahih Buhari'de Peygamber, kadınlar bağlamında onun faziletini şu hadiste tasdik etmiştir: \"Aişe'nin diğer kadınlardan üstünlüğü, tiridin (bir çeşit ekmek çorbası) diğer yiyeceklerden üstünlüğü gibidir.\" (Sahih Buhari 3411). Sahih Müslim'de ise Ümmü Zer' hadisinde Aişe'ye yapılan iftiranın tüm hikayesini anlatmış (Sahih Müslim 2770) ve temizlik ayeti nazil olduğunda örtü hadisini rivayet etmiştir (Sahih Müslim 2424)."
  id: "Istri Nabi dan putri Abu Bakar, beliau adalah salah satu perawi hadits yang paling produktif dalam tradisi Sunni, dan perannya dipandang berbeda di berbagai tradisi. Dalam Sahih al-Bukhari, Nabi menegaskan keutamaannya dalam konteks perempuan: \"Keunggulan Aisyah atas perempuan lain seperti keunggulan tharid (sejenis sup roti) atas makanan lain,\" dalam hadits tentang kesempurnaan Asiya dan Maryam (Sahih al-Bukhari 3411). Dalam Sahih Muslim, beliau meriwayatkan kisah lengkap fitnah terhadap Aisyah dalam hadits Umm Zar' (Sahih Muslim 2770), dan beliau meriwayatkan hadits tentang jubah ketika ayat penyucian diturunkan (Sahih Muslim 2424)."
