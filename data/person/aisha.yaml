perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition honors Aisha as Mother of the Believers, a beloved wife of the Prophet and one of the most important narrators of hadith, whose knowledge shaped early law and practice.", ar: "تُجِلّها السنة أمًّا للمؤمنين، وزوجة النبي المحبوبة، ومن أهم رواة الحديث، وكان لفقهها أثر في عمل الجماعة." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: academic
    id: academic
    summary: { en: "Historians treat the reports about her age and marriage cautiously as later tradition, while recognizing her as a major early authority for hadith and for the politics of the first civil war.", ar: "يتعامل المؤرخون مع الروايات في سنها وزواجها بحذر بوصفها من الأخبار المتأخرة، مع اعترافهم بمكانتها المرجعية في الحديث وبدورها في الفتنة الأولى." }
    sources: [source/watt-1956-medina]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition is critical of Aisha chiefly for leading the forces that fought Ali at the Battle of the Camel, while still acknowledging her place among the Prophet's wives.", ar: "ينتقدها التراث الإمامي خصوصًا لقيادتها الجيش الذي حارب عليًّا يوم الجمل، مع إقراره بمقامها بين أزواج النبي." }
    sources: [source/momen-1985]
