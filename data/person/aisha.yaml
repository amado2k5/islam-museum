summary:
  en: "A wife of the Prophet and daughter of Abu Bakr; one of the most prolific transmitters of hadith in Sunni tradition, whose role is viewed differently across the traditions."
  ar: "زوجة النبي وابنة أبي بكر، من أكثر الرواة حديثًا في التقليد السني، ويُنظر إلى دورها بصورة مختلفة بين التقاليد. وعند البخاري أثبت النبي فضلها في قالب النساءات: «وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام» في حديث كمال آسية ومريم {cite:sahih-al-bukhari 3411}، وفي مسلم روايتها لقصة الإفك كاملة ضمن حديث أم زرع {cite:sahih-muslim 2770}، وروايتها لحديث الكساء عند نزول آية التطهير {cite:sahih-muslim 2424}."
