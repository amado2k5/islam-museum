name_parts:
  kunya:
    - { value: "أم عبد الله", translit: "Umm Abd Allah", certainty: attested, note: { en: "Islamic tradition records that Muhammad gave her this kunya, naming her after her nephew Abd Allah ibn al-Zubayr, though she had no biological children (Sunan Abi Dawud, hadith 4970). Facts in this name block come from a research summary supplied to the museum (classical-arabic-names.md); the museum did not open the pages it cites; founder approval to use the file without re-verification, 21 Nov 2026.", ar: "تذكر الرواية الإسلامية أن محمدًا أعطاها هذه الكنية نسبةً إلى ابن أختها عبد الله بن الزبير، مع أنه لم يكن لها أولاد من صلبها، وفق سنن أبي داود، الحديث 4970. مصدر الوقائع في هذه الكتلة من الاسم ملخص بحثي قُدّم إلى المتحف (classical-arabic-names.md)؛ ولم يفتح المتحف الصفحات التي يستشهد بها؛ وبموافقة المؤسس على استعمال الملف دون إعادة تحقق، في 21 نوفمبر 2026.", ur: "اسلامی روایت کے مطابق محمد نے انہیں یہ کنیت اپنے بھانجے عبد اللہ بن زبیر کی نسبت سے دی، حالانکہ ان کی اپنی کوئی اولاد نہ تھی ⁦(سنن ابی داؤد، حدیث 4970)⁩۔ اس نام کے حصے کے حقائق ایک تحقیقی خلاصے سے لیے گئے ہیں جو عجائب گھر کو فراہم کیا گیا (classical-arabic-names.md)؛ عجائب گھر نے اس کے حوالہ کردہ صفحات نہیں کھولے؛ اور بانی نے 21 نومبر 2026 کو فائل کو دوبارہ تصدیق کے بغیر استعمال کرنے کی منظوری دی۔", fr: "La tradition islamique rapporte que Muhammad lui donna cette kunya d'après son neveu Abd Allah ibn al-Zubayr, bien qu'elle n'ait eu aucun enfant biologique (Sunan Abi Dawud, hadith 4970). Les faits de ce bloc de noms proviennent d'un résumé de recherche remis au musée (classical-arabic-names.md) ; le musée n'a pas ouvert les pages qu'il cite ; le fondateur a approuvé l'usage du fichier sans nouvelle vérification, le 21 novembre 2026.", es: "La tradición islámica recoge que Muhammad le dio esta kunya por su sobrino Abd Allah ibn al-Zubayr, aunque no tuvo hijos biológicos (Sunan Abi Dawud, hadiz 4970). Los datos de este bloque de nombres proceden de un resumen de investigación entregado al museo (classical-arabic-names.md); el museo no abrió las páginas que cita; el fundador aprobó usar el archivo sin nueva verificación, el 21 de noviembre de 2026." }, sources: [source/sunnah-com-abu-dawud-4970, source/jstor-schimmel-islamic-names] }
