summary:
  ar: "سياسي سنغالي فرنسي (13 أكتوبر 1872 – 11 مايو 1934)، وُلد في غوريه وكان نائبًا عن البلدات الأربع في مجلس النواب الفرنسي من 1914 إلى 1934، وهو أول شخص من أصل غرب أفريقي كامل يُنتخب فيه. صاحب قانون 1916 الذي منح الجنسية الكاملة لسكان البلدات الأربع، وكبير مجنّدي قوات غرب أفريقيا في الحرب العالمية الأولى، ووكيل وزارة المستعمرات 1931–1932، وعمدة داكار 1920–1934."
  en: "Senegalese-French politician (13 October 1872 – 11 May 1934), born at Gorée, who sat as deputy for the Four Communes in the French Chamber of Deputies from 1914 to 1934, the first person of full West African descent elected to it. He carried the 1916 law granting full citizenship to the residents of the Four Communes, was the leading recruiter of West African troops in the First World War, served as under-secretary of state for the colonies in 1931–1932, and was mayor of Dakar from 1920 to 1934."
  ur: "سینیگالی فرانسیسی سیاست دان (13 اکتوبر 1872ء – 11 مئی 1934ء)، گورے میں پیدا ہوئے، 1914ء سے 1934ء تک فرانسیسی مجلسِ نائبین میں چار بلدیات کے نائب رہے اور مکمل مغربی افریقی نسل کے پہلے شخص تھے جو اس میں منتخب ہوئے۔ 1916ء کا قانون — جس نے چار بلدیات کے باشندوں کو مکمل شہریت دی — انہی کی کاوش تھا؛ پہلی جنگِ عظیم میں مغربی افریقی فوجیوں کے بڑے بھرتی کار رہے، 1931–1932ء میں نوآبادیات کے نائب وزیر رہے، اور 1920ء سے 1934ء تک ڈاکار کے میئر رہے۔"
