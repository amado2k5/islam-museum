    note: "No source read names a personal religious affiliation for Diagne. What the sources give, in full: he was born Galaye M'Baye to a Lebu father, Niokhor Diagne, a cook and sailor, and a Manjack mother (French article); he was adopted as a child by the Crespin family, Christians of Gorée and Saint-Louis, who baptised him 'Blaise' (English article) and had him educated by the Christian Brothers of Ploërmel (French article); as an adult he was initiated a freemason in September 1899 at Réunion and later became master of a Paris lodge (both articles). A childhood baptism arranged by adoptive parents is upbringing, not an adult attestation of affiliation, and freemasonry is not a faith value; the English article also reports the allegation that he was not buried in the Muslim cemetery of Soumbedioune in Dakar because of his freemasonry. Wikidata records no religion value. Under the doubt rule he is left unclassified."
