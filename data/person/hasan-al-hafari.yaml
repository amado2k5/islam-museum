summary:
  ar: "الحسن بن أبي جعفر الحفري، المتعبد المقرئ، أيّد في الدؤوب والاجتهاد. روى أبو همران التمار أنه رآه يدعو في المسجد قبل الفجر، ومن معه يؤمّنون، وأن الذين كانوا معه جن من أهل أصيبين يحضرون ختم القرآن كل ليلة جمعة."
  en: "al-Hasan ibn Abi Ja'far al-Hafari, a worshipping reciter devoted to striving; Abu Imran al-Tammar relates that before dawn he found the mosque doors closed, then saw al-Hasan praying with a group answering his prayer, and was told that those present were jinn from Nasibin who came to complete the recitation of the Qur'an every Friday night."
  ur: "حسن بن ابی جعفر حفری عبادت گزار قاری تھے، جو محنت اور کوشش میں ممتاز تھے۔ ابو عمران تمار نے نقل کیا کہ فجر سے پہلے انہوں نے مسجد کا دروازہ بند پایا، پھر دیکھا کہ حسن دعا کر رہے ہیں اور ایک جماعت ان کی دعا پر آمین کہہ رہی ہے، اور انہیں بتایا گیا کہ وہاں موجود لوگ نصیبین کے جن تھے جو ہر جمعہ کی رات قرآن ختم کرنے آتے تھے۔"
  es: "Al-Hasan ibn Abi Ja'far al-Hafari, un recitador devoto y entregado al esfuerzo; Abu Imran al-Tammar relata que antes del amanecer encontró las puertas de la mezquita cerradas, luego vio a Al-Hasan orando con un grupo que respondía a su oración, y le dijeron que los presentes eran genios de Nasibin que venían a completar la recitación del Corán cada viernes por la noche."
  fr: "al-Hasan ibn Abi Ja'far al-Hafari, un récitateur fervent et dévoué à la prière; Abu Imran al-Tammar raconte qu'avant l'aube, il trouva les portes de la mosquée fermées, puis vit al-Hasan prier avec un groupe répondant à sa prière, et on lui dit que les personnes présentes étaient des djinns de Nasibin qui venaient chaque vendredi soir pour achever la récitation du Coran."
  tr: "Dindar ve şifacı olan El-Hasan bin Ebi Cefer el-Hafari, gayret ve gayreti destekledi. Ebu Hamran el-Temmar, şafak öncesi camide dua ederken gördüğünü, yanındakilerin iman ettiğini ve yanında olanların her Cuma gecesi Kur'an'ın tamamlanmasına katılan Asibin halkından cinler olduğunu rivayet etti."
  id: "Al-Hasan ibn Abi Ja'far al-Hafari, seorang yang taat dan pembaca, mendukung ketekunan dan ketekunan. Abu Hamran al-Tammar menceritakan bahwa ia melihatnya berdoa di masjid sebelum fajar, dan mereka yang bersamanya percaya, dan bahwa yang bersamanya termasuk di antara jin dari masyarakat Asibin yang menghadiri penyelesaian Al-Qur'an setiap Jumat malam."
