summary:
  ar: "الحسن بن أبي جعفر الحفري، المتعبد المقرئ، أيّد في الدؤوب والاجتهاد. روى أبو همران التمار أنه رآه يدعو في المسجد قبل الفجر، ومن معه يؤمّنون، وأن الذين كانوا معه جن من أهل أصيبين يحضرون ختم القرآن كل ليلة جمعة."
  en: "al-Hasan ibn Abi Ja'far al-Hafari, a worshipping reciter devoted to striving; Abu Imran al-Tammar relates that before dawn he found the mosque doors closed, then saw al-Hasan praying with a group answering his prayer, and was told that those present were jinn from Nasibin who came to complete the recitation of the Qur'an every Friday night."
  ur: "حسن بن ابی جعفر حفری عبادت گزار قاری تھے، جو محنت اور کوشش میں ممتاز تھے۔ ابو عمران تمار نے نقل کیا کہ فجر سے پہلے انہوں نے مسجد کا دروازہ بند پایا، پھر دیکھا کہ حسن دعا کر رہے ہیں اور ایک جماعت ان کی دعا پر آمین کہہ رہی ہے، اور انہیں بتایا گیا کہ وہاں موجود لوگ نصیبین کے جن تھے جو ہر جمعہ کی رات قرآن ختم کرنے آتے تھے۔"
