died: { hijri: "0245", edtf: "0860~", calendar: julian, precision: year, status: debated, derived: true, note: "الشيرازي: مات سنة خمس وقيل ثمان وأربعين ومائتين ⁦(PDF ص54)⁩. الهجري 0245 هو الأولى، والرواية الثانية 248 تُذكر هنا دون حساب.", sources: [source/tabaqat-fuqaha-abbas-1981] }
summary:
  ar: "أبو علي الحسين بن علي بن يزيد المهابي الكرابيسي وكان من المجبرة وعارفا بالحديث والفقه فذكره ابن النديم هنا لأنه أقرب إلى الجبر من غيره، وله كتاب المدلسين في الحديث وكتاب الإمامة وفيه غمز على علي {cite:fihrist-ibn-al-nadim p. 256-257}."
  en: "Al-Karabisi — hadith scholar nearest to the mujbira {cite:fihrist-ibn-al-nadim}"
  es: "Al-Karabisi - erudito en hadices más cercano al mujbira {cita:fihrist-ibn-al-nadim}"
  fr: "Al-Karabisi - érudit en hadiths le plus proche du mujbira {cite: fihrist-ibn-al-nadim}"
  ur: "الکرابیسی - مجبیرہ کے قریب ترین عالم حدیث"
  tr: "Ebu Ali el-Hüseyin bin Ali bin Yezid el-Mahabi el-Karabisi, el-Mücabireden olup hadis ve fıkıh konusunda bilgiliydi. İbn el-Nadim burada onu diğerlerinden daha yakın olduğu için anmıştır. 'El-Müdalisin fi al-hadis' ve 'İmalık Kitabı' adlı kitapları yazmıştır ve burada Ali'ye ima edilmiştir {atıf:fihrist-ibn-al-nadim s. 256-257}."
  id: "Abu Ali al-Husayn ibn Ali ibn Yazid al-Mahabi al-Karabisi berasal dari al-Mujabirah dan berpengetahuan dalam hadits serta firih. Ibn al-Nadim menyebutnya di sini karena ia lebih dekat dengan aljabar dibandingkan yang lain. Ia menulis buku 'Al-Mudalisin fi al-hadith' dan 'The Book of Imamate,' di mana ia menyinggung Ali {cite:fihrist-ibn-al-nadim hlm. 256-257}."
