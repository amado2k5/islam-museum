summary:
  ar: "عمرو بن شرحبيل، أبو ميسرة الهمداني الكوفي، تابعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} حدّث عن عمر وعلي وابن مسعود وغيرهم، وروى عنه أبو وائل والشعبي والقاسم بن مخيمرة وأبو إسحاق ومحمد بن المنتشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} قال أبو وائل إنه كان من أفاضل أصحاب ابن مسعود، وذكره ابن حبان في الثقات ووصفه بالعبادة وكثرة الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962}"
  en: "Amr ibn Shurahbil, Abu Maysara al-Hamdani al-Kufi, a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} He narrated from Umar, Ali and Ibn Mas'ud among others; Abu Wa'il, al-Sha'bi, al-Qasim ibn Makhaymara, Abu Ishaq and Muhammad ibn al-Muntashir narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} Abu Wa'il said he was one of the best companions of Ibn Mas'ud, and Ibn Hibban listed him among the trustworthy, describing him as a devoted worshipper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962}"
