summary:
  ar: "فقير متجول پشتوني من قرية ريغا في وادي بونير (ت 1917)، اسمه سعيد الله خان، عُرف بملا مستان أي «الثمل بالله». في يوليو 1897 أعلن الجهاد وقاد آلاف المقاتلين القبليين لمهاجمة حصني ملاكند وچاكدرّه البريطانيين، فكان شرارة ثورة الحدود الكبرى تلك السنة؛ ثم خفت حركته بعد الثورة وتفرّقت بوفاته سنة 1917."
  en: "Pashtun religious mendicant of Rega in the Buner Valley (died 1917), born Saidullah Khan and known as Mullah Mastan, 'the God-intoxicated'. In July 1897 he proclaimed jihad and led thousands of tribesmen against the British posts at Malakand and Chakdara, setting off the great frontier uprising of that year; his movement faded after the rising and broke up on his death in 1917. The names 'Mad Mullah' and 'Mad Faqir', by which British writers called him, are colonial labels and are recorded as such."
  ur: "وادیِ بونیر کے گاؤں ریگا کے پشتون درویش (وفات 1917ء)، اصل نام سعید اللہ خان، جو ملا مستان یعنی «خدا میں مست» کے نام سے مشہور ہوئے۔ جولائی 1897ء میں انہوں نے جہاد کا اعلان کیا اور ہزاروں قبائلیوں کی قیادت میں ملاکنڈ اور چکدرہ کی برطانوی چوکیوں پر حملہ کیا، جس سے اس سال کی عظیم سرحدی بغاوت بھڑک اٹھی؛ ان کی تحریک بغاوت کے بعد ماند پڑ گئی اور 1917ء میں ان کی وفات پر بکھر گئی۔"
