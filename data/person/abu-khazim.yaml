summary:
  ar: "القاضي، وجه إليه المعتضد أن له على رجل مالاً قد بلغه أن غرماءه أثبتوا عنده فقال أمير المؤمنين ذاكر لما قال لي وقت قلدني إنه أخرج الأمر من عنقه وجعله في عنقي ولا يجوز أن أحكم في مال رجل لمدع إلا ببينة فامتنع الشاهدان من الشهادة فزعاً ولم يدفع إلى المعتضد شيئاً {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  en: "The qadi who told al-Mu'tadid 'you put the matter on my neck — I may not judge a man's wealth to a claimant without bayyina'; the two witnesses, awed, refused to testify and nothing was paid {cite:tarikh-khulafa-minhaj-1434 p. 576}."
