class: person
label: { ar: "أبو خازم القاضي", en: "Abu Khazim al-Qadi", fr: "Abu Khazim le cadi", es: "Abu Khazim al-Qadi", ur: "ابو خزیم القادی" }
summary:
  ar: "القاضي، وجه إليه المعتضد أن له على رجل مالاً قد بلغه أن غرماءه أثبتوا عنده فقال أمير المؤمنين ذاكر لما قال لي وقت قلدني إنه أخرج الأمر من عنقه وجعله في عنقي ولا يجوز أن أحكم في مال رجل لمدع إلا ببينة فامتنع الشاهدان من الشهادة فزعاً ولم يدفع إلى المعتضد شيئاً {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  en: "The qadi who told al-Mu'tadid 'you put the matter on my neck — I may not judge a man's wealth to a claimant without bayyina'; the two witnesses, awed, refused to testify and nothing was paid {cite:tarikh-khulafa-minhaj-1434 p. 576}. He and Ali ibn Muhammad ibn Abi'l-Shawarib wrote the 283 opinion that the residue of inheritance shares reverts to blood kin — citing Umar, Ali and Ibn Mas'ud against Zayd ibn Thabit — which al-Mu'tadid enacted over Yusuf ibn Ya'qub's contrary fatwa {cite:muntazam-ibn-al-jawzi p. 162-163}."
  fr: "Le cadi qui dit à al-Mu'tadid « tu as mis l'affaire sur mon cou — je ne puis adjuger les biens d'un homme à un demandeur sans bayyina » ; les deux témoins, intimidés, refusèrent de témoigner et rien ne fut payé {cite:tarikh-khulafa-minhaj-1434 p. 576}. Lui et Ali ibn Muhammad ibn Abi'l-Shawarib rédigèrent l'avis de 283 selon lequel le reliquat des parts successorales revient aux parents par le sang — citant Umar, Ali et Ibn Mas'ud contre Zayd ibn Thabit —, qu'al-Mu'tadid promulgua contre la fatwa contraire de Yusuf ibn Ya'qub {cite:muntazam-ibn-al-jawzi p. 162-163}."
  es: "El cadí que le dijo a al-Mu'tadid 'me has echado la culpa a mí; no puedo juzgar la riqueza de un hombre a un reclamante sin bayyina'; los dos testigos, atemorizados, se negaron a testificar y no se pagó nada {cite:tarikh-khulafa-minhaj-1434 p. 576}. Él y Ali ibn Muhammad ibn Abi'l-Shawarib escribieron la opinión 283 de que el remanente de las participaciones de la herencia revierte a los parientes consanguíneos, citando a Umar, Ali e Ibn Mas'ud contra Zayd ibn Thabit, que al-Mu'tadid promulgó sobre la fatwa contraria de Yusuf ibn Ya'qub {cite:muntazam-ibn-al-jawzi p. 162-163}."
  ur: "وہ قاضی جس نے المتدید سے کہا کہ 'تم نے معاملہ میرے گلے میں ڈال دیا - میں کسی آدمی کے مال کا فیصلہ بغیر بیینہ کے دعویدار کو نہیں کر سکتا'۔ دونوں گواہوں نے خوفزدہ ہو کر گواہی دینے سے انکار کر دیا اور کچھ بھی ادا نہیں کیا گیا۔ 576}۔ اس نے اور علی ابن محمد ابن ابی الشوارب نے 283 رائے لکھی کہ وراثت کے باقیات خونی رشتہ داروں کو واپس آتے ہیں - عمر، علی اور ابن مسعود کا زید بن ثابت کے خلاف حوالہ دیتے ہوئے - جسے المتدید نے یوسف بن یعقوب کے فتویٰ پر نافذ کیا تھا۔ {حوالہ:منتظم ابن الجوزی ص۔ 162-163}۔"
