summary:
  ar: "أميرة مصرية من الأسرة العلوية (1853-1913)، ابنة الأمير مصطفى فاضل باشا. أقامت في قصرها بالقاهرة منذ ثمانينيات القرن التاسع عشر أحد أوائل الصالونات الأدبية التي تديرها امرأة في العالم العربي، وكان من روّاده محمد عبده وسعد زغلول وقاسم أمين، ثم أقامت صالونا ثانيا في المرسى بتونس بعد زواجها الثاني سنة 1900."
  en: "Egyptian princess of the Muhammad Ali dynasty (1853–1913), daughter of Prince Mustafa Fazl Pasha. From the 1880s she hosted at her Cairo palace one of the first literary salons run by a woman in the Arab world, frequented by Muhammad Abduh, Saad Zaghloul and Qasim Amin; after her second marriage in 1900 she held a second salon at La Marsa in Tunis."
  ur: "مصر کی علوی خاندان کی شہزادی (1853-1913)، مصطفیٰ فاضل پاشا کی بیٹی۔ 1880 کی دہائی سے انہوں نے قاہرہ کے اپنے محل میں عرب دنیا کے ان پہلے ادبی صالونوں میں سے ایک قائم کیا جن کی میزبانی کوئی خاتون کرتی تھی؛ اس کے شرکا میں محمد عبدہ، سعد زغلول اور قاسم امین شامل تھے۔ 1900 میں دوسری شادی کے بعد انہوں نے تیونس کے علاقے المرسى میں دوسرا صالون قائم کیا۔"
