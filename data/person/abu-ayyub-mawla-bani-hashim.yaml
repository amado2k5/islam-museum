summary:
  ar: "أبو أيوب مولى بني هاشم، صحب الحكماء من العباد وأخذ عنهم مدة المنقلب والمعاد، وروى عنه أبو بكر بن عبيد أقوالًا في النظر إلى الدنيا، والنصب المؤلم للفكر، والحذر من إيثار الدعة."
  en: "Abu Ayyub, client of the Banu Hashim, who kept company with wise worshippers and learned from them the time of return and the hereafter; Abu Bakr ibn Ubayd relates from him sayings on looking at the world, on the painful toil of thought, and on the warning against seeking ease."
  ur: "ابو ایوب، مولیٰ بنی ہاشم، دانا عبادت گزاروں کی صحبت میں رہے اور ان سے لوٹنے اور آخرت کا علم حاصل کیا۔ ابو بکر بن عبید نے ان سے دنیا کو دیکھنے، فکر کی تکلیف دہ محنت، اور آرام پسندی سے بچنے کے بارے میں اقوال نقل کیے۔"
