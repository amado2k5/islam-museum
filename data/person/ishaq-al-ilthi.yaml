summary:
  ar: "الزاهد القدوة ابن عم طلحة بن المظفر، فقيه حنبلي آمر بالمعروف ناه عن المنكر لا يخاف أحداً ولا تأخذه في الحق لومة لائم؛ أنكر على الخليفة الناصر فمن دونه وواجه الخليفة وصدعه بالحق، وقال الناصح بن الحنبلي هو اليوم شيخ العراق والقائم بالإنكار على الفقهاء والفقراء وغيرهم فيما ترخصوا فيه، وقيل لم يكن في زمانه أكثر إنكاراً للسكر منه وحبس على ذلك مدة؛ وله رسائل كثيرة في الإنكار {cite:shadharat-dhahab p. 163}."
  en: "Ishaq al-Ilthi (d. 634) — the ascetic Hanbali of Ilth near Ukbara whom contemporaries called 'shaykh of Iraq' for his fearless command of right: he denounced caliph al-Nasir to his face and was jailed for denouncing wine more than anyone of his time {cite:shadharat-dhahab p. 163}."
  es: "Ishaq al-Ilthi (m. 634) — el asceta hanbalí de Ilth, cerca de Ukbara, a quien sus contemporáneos llamaban \"shaykh de Irak\" por su intrépido dominio de la justicia: denunció al califa al-Nasir en su cara y fue encarcelado por denunciar el vino más que nadie de su época {cite:shadharat-dhahab p. 163}."
  fr: "Ishaq al-Ilthi (mort en 634) — l'ascète hanbalite d'Ilth près d'Ukbara que ses contemporains appelaient « cheikh d'Irak » pour son commandement intrépide du droit: il a dénoncé le calife al-Nasir en face et a été emprisonné pour avoir dénoncé le vin plus que quiconque de son temps {cite: shadharat-dhahab p. 163}."
  ur: "اسحاق الألطی ⁦(متوفی 634)⁩ - عقبرہ کے قریب التھ کا سنیاسی حنبلی جسے ہم عصر لوگ اس کے بے خوف حکم حق کے لیے 'عراق کا شیخ' کہتے تھے: اس نے خلیفہ الناصر کو منہ پر ملامت کی اور اپنے دور کے کسی سے بھی زیادہ شراب کی مذمت کرنے پر جیل بھیج دیا گیا۔ 163}۔"
  tr: "Örnek bir münzevi, Talha ibn al-Muzaffar'ın kuzeni, iyiliği emreden ve kötülüğü yasaklayan, kimseyi korkmayan ve gerçeği suçlamayan, Halife el-Nasir'i eleştirdi; bu yüzden arkasındaki kişi halifeye karşı çıktı ve ona gerçeği söyledi. El-Nasih ibn al-Hanbali şöyle dedi: Bugün o, Irak'ın şeyhi ve hukukçuları, yoksulları ve başkalarını kabul ettiklerinde suçlayan kişidir. Zamanında sarhoşluktan daha fazla kınanmadığı ve bir süre gözaltında tutulduğu söylenir; birçok eser yazdı {atıf:shadharat-dhahab, s. 163}."
  id: "Pertapa teladan, sepupu Talha ibn al-Muzaffar, seorang ahli hukum Hanbali yang memerintahkan kebaikan dan melarang kejahatan, tidak takut pada siapa pun dan tidak disalahkan secara jujur; ia mengkritik Khalifah al-Nasir, sehingga yang berada di belakangnya menghadapi khalifah, dan berbicara dengan kebenaran. Al-Nasih ibn al-Hanbali berkata: Hari ini, ia adalah sheikh Irak dan yang mencela para ahli hukum, orang miskin, dan lainnya atas apa yang mereka akui. Dikatakan bahwa pada masanya, ia tidak lebih dikecam karena mabuk daripada yang sebenarnya, dan ia ditahan untuk sementara waktu; ia menulis banyak risalah tentang celaan {cite:shadharat-dhahab, hlm. 163}."
