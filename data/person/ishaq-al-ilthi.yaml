summary:
  ar: "الزاهد القدوة ابن عم طلحة بن المظفر، فقيه حنبلي آمر بالمعروف ناه عن المنكر لا يخاف أحداً ولا تأخذه في الحق لومة لائم؛ أنكر على الخليفة الناصر فمن دونه وواجه الخليفة وصدعه بالحق، وقال الناصح بن الحنبلي هو اليوم شيخ العراق والقائم بالإنكار على الفقهاء والفقراء وغيرهم فيما ترخصوا فيه، وقيل لم يكن في زمانه أكثر إنكاراً للسكر منه وحبس على ذلك مدة؛ وله رسائل كثيرة في الإنكار {cite:shadharat-dhahab p. 163}."
  en: "Ishaq al-Ilthi (d. 634) — the ascetic Hanbali of Ilth near Ukbara whom contemporaries called 'shaykh of Iraq' for his fearless command of right: he denounced caliph al-Nasir to his face and was jailed for denouncing wine more than anyone of his time {cite:shadharat-dhahab p. 163}."
