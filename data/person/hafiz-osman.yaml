summary:
  ar: "بطاقة أولية لعثمان بن علي المعروف بالحافظ عثمان، خطاط الدولة العثمانية الذي رسم النسخ ومهّد لأصول الحط التركي، توفي سنة ١٦٩٨م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Uthman ibn Ali, 'Hafiz Osman', the Ottoman master calligrapher whose naskh codified Ottoman script forms, d. 1698; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Uthman ibn Ali, 'Hafiz Osman', el maestro calígrafo otomano cuya escritura naskh codificó las formas de la escritura otomana, fallecido en 1698; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature d'Uthman ibn Ali, 'Hafiz Osman', le maître calligraphe ottoman dont le naskh a codifié les formes de l'écriture ottomane, décédé en 1698; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عثمان ابن علی کے لیے مسودہ کارڈ، 'حافظ عثمان'، عثمانی ماہر خطاط جس کے نسخ نے عثمانی رسم الخط کی شکلوں کو کوڈف کیا، ڈی۔ 1698; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Osmanlı İmparatorluğu'nun hattatı olarak bilinen Osman bin Ali'nin ön kartı; Osmanlı imparatorluğunun hattatı ve Türk yazıtlarının kökenlerinin yolunu açan hatt. 1698 yılında öldü; önemli kişilerin sözlüklerinde adı geçti ve biyografisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan Uthman ibn Ali, yang dikenal sebagai Al-Hafiz Uthman, kaligrafer Kekaisaran Ottoman yang menggambar salinan dan membuka jalan bagi asal-usul prasasti Turki. Ia meninggal pada tahun 1698 M; ia disebutkan dalam kamus tokoh-tokoh terkemuka, dan biografinya belum pernah ditinjau di halaman tersebut."
