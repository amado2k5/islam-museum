summary:
  en: "A prominent chief of the Banu Abd al-Ashhal clan of the Aws in Yathrib; when Mus'ab ibn Umayr came preaching, Usayd approached with his spear to rebuff him, but upon listening to the Qur'an embraced Islam with radiant conviction, leading to his cousin Sa'd ibn Mu'adh's conversion and the entire clan's Islam."
  ar: "سيد بني عبد الأشهل وفارسهم بيثرب؛ أقبل بحربته ليزجر مصعب بن عمير وأسعد بن زرارة، فلما أنصف واستمع للقرآن أشرق وجهه وأسلم، وكان سبب إسلام سعد بن معاذ وبني عبد الأشهل جميعاً، وشهد العقبة وكان أحد النقباء وبدراً وما بعدها. وفي الصحيح خرج هو وعباد بن بشر من عند النبي في ليلة مظلمة فإذا نور بين أيديهما حتى تفرقا {cite:sahih-al-bukhari 3805}."
  ur: "یثرب میں اوس کے بنو عبد الاشہل قبیلے کا ممتاز سردار؛ جب مصعب بن عمیر تبلیغ کے لیے آیا تو اسید لاٹھی لے کر آیا۔"
  es: "Un destacado jefe del clan Banu Abd al-Ashhal de los Aws en Yathrib; cuando Mus'ab ibn Umayr llegó predicando, Usayd se acercó con su lanza para rechazarlo, pero al escuchar el Corán abrazó el Islam con radiante convicción, lo que llevó a la conversión de su primo Sa'd ibn Mu'adh y al Islam de todo el clan."
  fr: "Chef éminent du clan Banu Abd al-Ashhal des Aws à Yathrib; lorsque Mus'ab ibn Umayr vint prêcher, Usayd s'approcha avec sa lance pour le repousser, mais après avoir écouté le Coran, il embrassa l'islam avec une conviction rayonnante, ce qui conduisit à la conversion de son cousin Sa'd ibn Mu'adh et à l'islam de tout le clan."
  tr: "Banu Abd al-Ashhal'ın ustası ve Yatrib'teki şövalyeleri; mızrağıyla Mus'ab ibn Umair ve As'ad ibn Zurara'yı azarlamak için yaklaştı. Güzel görünce ve Kur'an'ı dinlediğinde yüzü aydınlandı ve İslam'ı benimsedi. Sa'd ibn Mu'adh ile Banu Abd al-Ashhal'ın birlikte İslam'ının sebebidir. Akabe savaşına tanık oldu ve Badr ile sonrakilerin liderlerinden biriydi. Gerçek rivayette, o ve Abbad bin Bişr karanlık bir gecede Peygamber'in huzurundan ayrıldılar ve ayrılana kadar önlerinde bir ışık belirdi {cite:sahih-al-bukhari 3805}."
  id: "Guru Banu Abd al-Ashhal dan ksatria mereka di Yathrib; ia mendekat dengan tombaknya untuk menegur Mus'ab ibn Umair dan As'ad ibn Zurara. Ketika ia tampak adil dan mendengarkan Al-Qur'an, wajahnya bersinar dan ia memeluk Islam. Dialah alasan Islam Sa'd ibn Mu'adh dan Banu Abd al-Ashhal bersama-sama. Ia menyaksikan pertempuran Aqaba dan menjadi salah satu pemimpin Badr dan mereka yang setelahnya. Dalam riwayat yang otentik, ia dan Abbad ibn Bishr meninggalkan kehadiran Nabi pada malam yang gelap, dan cahaya muncul di hadapan mereka hingga mereka berpisah {cite:sahih-al-bukhari 3805}."
