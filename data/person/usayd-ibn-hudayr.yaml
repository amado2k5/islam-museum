summary:
  en: "A prominent chief of the Banu Abd al-Ashhal clan of the Aws in Yathrib; when Mus'ab ibn Umayr came preaching, Usayd approached with his spear to rebuff him, but upon listening to the Qur'an embraced Islam with radiant conviction, leading to his cousin Sa'd ibn Mu'adh's conversion and the entire clan's Islam."
  ar: "سيد بني عبد الأشهل وفارسهم بيثرب؛ أقبل بحربته ليزجر مصعب بن عمير وأسعد بن زرارة، فلما أنصف واستمع للقرآن أشرق وجهه وأسلم، وكان سبب إسلام سعد بن معاذ وبني عبد الأشهل جميعاً، وشهد العقبة وكان أحد النقباء وبدراً وما بعدها. وفي الصحيح خرج هو وعباد بن بشر من عند النبي في ليلة مظلمة فإذا نور بين أيديهما حتى تفرقا {cite:sahih-al-bukhari 3805}."
