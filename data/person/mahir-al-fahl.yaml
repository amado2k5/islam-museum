summary:
  ar: "محدث عراقي معاصر، وُلد سنة 1971، يرأس دار الحديث العراقية. تخصص في علل الحديث الخفية ونقد الإسناد، ومن مؤلفاته «أثر علل الحديث في اختلاف الفقهاء» و«الجامع في العلل»، وله تحقيقات في كتب الحديث منها «فتح الباري»."
  en: "Contemporary Iraqi hadith scholar, born in 1971, heading Dar al-Hadith al-Iraqiyya. He specialises in hidden defects of hadith (ilal) and isnad criticism, authoring Athar Ilal al-Hadith fi Ikhtilaf al-Fuqaha and al-Jami’ fi al-Ilal, with editions of hadith works including Fath al-Baqi."
  ur: "عصری عراقی محدث، 1971 میں پیدا ہوئے اور دار الحدیث العراقیہ کے سربراہ۔ وہ حدیث کی خفی علل ⁦(عللِ حدیث)⁩ اور اسناد کی تنقید کے ماہر ہیں؛ ان کی تصانیف میں «اثر علل الحدیث في اختلاف الفقهاء» اور «الجامع في العلل» شامل ہیں، نیز کتبِ حدیث کی تحقیق میں «فتح الباقی»۔"
