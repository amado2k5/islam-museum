summary:
  ar: "أشهر خطاطي النستعليق في إيران (نحو 1554–1615)، وُلد في قزوين من أسرة سادات سيفي حسني عملت في مكتبة البلاط الصفوي ومحاسبته، وتجوّل في الأناضول والحجاز وبغداد وحلب قبل أن يصير أحد خطاطَي بلاط الشاه عباس الأول في أصفهان ومنافس علي رضا عباسي. اتهمه الشاه بالميل السنّي ورضي ضمنيًا بقتله فاغتيل سنة 1615. تُعدّ أعماله ذروة أناقة النستعليق وتُحفظ في متاحف العالم، ومنها أجزاء قرآنية ونُسخ من «كلستان» سعدي و«ديوان» حافظ بخطه."
  en: "The most celebrated nastaʿliq calligrapher of Persia (ca. 1554–1615), born in Qazvin to a family of Sayfi Hasani sayyeds who served the Safavid court as librarians and accountants. After travelling through Ottoman Turkey, the Hijaz, Baghdad and Aleppo, he became one of the two leading calligraphers of Shah Abbas I's court at Isfahan, rival to Ali Reza Abbasi. The shah made his alleged Sunni inclination an issue and implicitly approved his murder; he was assassinated in 1615. His hand is held to be the highest elegance nastaʿliq ever reached, and his copies of the Qur'an, of Sa'di's Golestan and of Hafez's Divan are kept in museums worldwide."
  ur: "ایران کے مشہور ترین نستعلیق خطاط (تقریباً 1554ء–1615ء)، قزوین میں سیفی حسنی سادات کے خاندان میں پیدا ہوئے جو صفوی دربار میں کتب دار اور محاسب رہے تھے۔ عثمانی ترکی، حجاز، بغداد اور حلب کے سفر کے بعد وہ اصفہان میں شاہ عباس اول کے دربار کے دو بڑے خطاطوں میں شامل ہوئے، علی رضا عباسی کے حریف۔ شاہ نے ان کے مبینہ سنی رجحان کو مسئلہ بنا کر ان کے قتل کی ضمنی منظوری دی؛ 1615ء میں وہ قتل ہوئے۔ ان کا خط نستعلیق کی بلند ترین نفاست سمجھا جاتا ہے اور قرآن، سعدی کے گلستاں اور حافظ کے دیوان کی ان کی نقول دنیا کے عجائب گھروں میں محفوظ ہیں۔"

