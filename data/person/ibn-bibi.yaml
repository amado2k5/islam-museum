summary:
  ar: "بطاقة أولية لناصر الدين الحسين بن محمد المعروف بابن بيبي، مؤرخ سلاجقة الروم الذي كتب «الأوامر العلائية» بالفارسية في القرن الثالث عشر؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nasir al-Din al-Husayn ibn Muhammad known as Ibn Bibi, the historian of the Seljuks of Rum who wrote al-Awamir al-Ala'iyya in Persian in the thirteenth century; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Nasir al-Din al-Husayn ibn Muhammad, conocido como Ibn Bibi, el historiador de los selyúcidas de Rum que escribió al-Awamir al-Ala'iyya en persa en el siglo XIII; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche provisoire de Nasir al-Din al-Husayn ibn Muhammad, connu sous le nom d'Ibn Bibi, l'historien des Seldjoukides de Rum qui a écrit al-Awamir al-Ala'iyya en persan au XIIIe siècle; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "ناصر الدین الحسین ابن محمد کے لیے ڈرافٹ کارڈ جسے ابن بی بی کے نام سے جانا جاتا ہے، جو روم کے سلجوقوں کے مورخ ہیں جنہوں نے تیرہویں صدی میں فارسی میں العوامیرالعالیہ لکھا؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Rum Selçuklularının tarihçisi Nasir al-Din al-Hüseyin ibn Muhammed'in ön kartı; 13. yüzyılda Farsça olarak 'Al-Umar' al-A'la'i'yi yazan Rum Selçukluları tarihçisi İbn Bibi olarak bilinir; önemli şahsiyetlerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Nasir al-Din al-Husayn ibn Muhammad, yang dikenal sebagai Ibn Bibi, sejarawan Seljuk dari Rum yang menulis 'Al-Umar' al-A'la'i dalam bahasa Persia pada abad ke-13; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
