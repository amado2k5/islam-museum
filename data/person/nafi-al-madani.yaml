summary:
  ar: "نافع بن عبد الرحمن بن أبي نعيم المدني أحد القراء السبعة، روى الأصمعي عنه أنه قال أصلي من أصبهان، وروى عنه عيسى بن مينا قالون ومحمد بن إسحاق المسيبي والأصمعي وإسماعيل بن جعفر بن أبي كثير الأنصاري ويعقوب بن إبراهيم الزهري {cite:fihrist-ibn-al-nadim p. 72}."
  en: "Medinese reader of Persian origin — Qalun and Warsh's generation transmit him {cite:fihrist-ibn-al-nadim p. 72}."
  es: "Lector medinense de origen persa: la generación de Qalun y Warsh lo transmite {cite:fihrist-ibn-al-nadim p. 72}."
  fr: "Lecteur médinois d'origine perse — la génération de Qalun et Warsh le transmet {cite:fihrist-ibn-al-nadim p. 72}."
  ur: "فارسی نژاد میڈینی قاری - قالون اور وارش کی نسل نے اسے منتقل کیا {حوالہ: فہرست ابن الندیم صفحہ 72}۔"
  tr: "Yedi okuyucudan biri olan Nafi' ibn Abd al-Rahman ibn Abi Nu'aym al-Madani, al-Asma'i tarafından aslen İsfahanlı olduğunu anlatmıştır. İsa ibn Mina Qalun, Muhammed ibn İshaq al-Musaybi, al-Asma'i, Isma'il ibn Ja'far ibn Abi Kathir al-Ansari ve Ya'qub ibn İbrahim al-Zuhri {cite:fihrist-ibn-al-nadim s. 72} ondan rivayet etmiştir."
  id: "Nafi' ibn Abd al-Rahman ibn Abi Nu'aym al-Madani, salah satu dari tujuh pembaca, menceritakan oleh al-Asma'i bahwa ia mengatakan berasal dari Isfahan. Isa ibn Mina Qalun, Muhammad ibn Ishaq al-Musaybi, al-Asma'i, Isma'il ibn Ja'far ibn Abi Kathir al-Ansari, dan Ya'qub ibn Ibrahim al-Zuhri {cite:fihrist-ibn-al-nadim hlm. 72} diceritakan darinya."
