summary:
  ar: "الأمير سيف الدين شيخو بن عبد الله العمري الناصري، مملوك تركي اشتراه الخواجا عمر وباعه للناصر محمد بن قلاوون، فترقى حتى صار أتابك العساكر وأول من سُمّي الأمير الكبير بخلعة. شارك في الوصاية على الناصر حسن، وأعاده إلى السلطنة سنة 755هـ، وبنى الجامع والخانقاه بالصليبة في القاهرة. ضربه مملوك بالسيف في دار العدل في شعبان سنة 758هـ فمات من جراحه في أواخر السنة {cite:nujum-zahira 10/324-325} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047}."
  en: "Amir Sayf al-Din Shaykhu ibn Abd Allah al-Umari al-Nasiri was a Turkish mamluk whom the merchant Khwaja Umar bought and sold to al-Nasir Muhammad ibn Qalawun. He rose to be atabek of the armies and the first to be named al-Amir al-Kabir with a robe of investiture. He took part in the regency for al-Nasir Hasan, helped restore him to the throne in 755, and built the mosque and khanqah in the Salibah quarter of Cairo. A mamluk struck him with a sword in the Dar al-Adl in Shaban 758, and he died of his wounds late that year {cite:nujum-zahira 10/324-325} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047}."
  ur: "امیر سیف الدین شیخو بن عبد اللہ العمری الناصری ترک مملوک تھے جنہیں تاجر خواجہ عمر نے خریدا اور الناصر محمد بن قلاوون کو بیچ دیا۔ وہ ترقی کر کے اتابک العساکر بنے اور خلعت کے ساتھ الامیر الکبیر کہلانے والے پہلے امیر ہوئے۔ انہوں نے الناصر حسن کی سرپرستی میں حصہ لیا، 755ھ میں انہیں دوبارہ تخت پر بٹھانے میں مدد دی، اور قاہرہ کے محلہ صلیبہ میں جامع اور خانقاہ بنوائی۔ شعبان 758ھ میں دار العدل میں ایک مملوک نے ان پر تلوار سے وار کیا اور وہ اسی سال کے آخر میں زخموں سے فوت ہوئے {cite:nujum-zahira 10/324-325} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047}."
