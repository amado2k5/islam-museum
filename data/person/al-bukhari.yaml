summary:
  ar: "أبو عبد الله محمد بن إسماعيل بن إبراهيم بن المغيرة بن بردزبة البخاري الجعفي، أمير المؤمنين في الحديث؛ من علماء المحدثين الثقات، وله كتاب التاريخ الكبير وكتاب التاريخ الصغير وكتاب الأسماء والكنى وكتاب الضعفاء وكتاب الصحيح وكتاب السنن في الفقه وكتاب الأدب وكتاب التاريخ الأوسط وكتاب خلق أفعال العباد وكتاب القراءة خلف الإمام {cite:fihrist-ibn-al-nadim p. 321-322}. وُلد ببخارى في شوال ١٩٤هـ ونشأ يتيماً، وأول سماعه سنة ٢٠٥هـ، ورحل سنة ٢١٠هـ فحج مع أمه وأخيه وتخلّف في طلب الحديث، وطاف البلدان من خراسان إلى مصر وسمع من أكثر من ألف شيخ، وأخرج صحيحه من نحو ستمئة ألف حديث في ست عشرة سنة، وقيل سنة ٢٤٧هـ: أعلم من دخل نيسابور، وفي أواخر أيامه حسده الذهلي فخرج إلى بخارى فأُخرج منها فنزل خرتنك من قرى سمرقند، ومات بها ليلة الفطر أول شوال ٢٥٦هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  en: "Abu Abd Allah Muhammad ibn Isma'il ibn Ibrahim ibn al-Mughira ibn Bardizba al-Ju'fi al-Bukhari, the commander of the faithful in hadith; among the trustworthy masters of the traditionists, author of the Great, Middle and Lesser Tarikhs, the Asma' wal-Kuna, the Du'afa', the Sahih, the Sunan in fiqh, the Adab, Khalq Af'al al-Ibad and al-Qira'a khalf al-Imam {cite:fihrist-ibn-al-nadim}. Born at Bukhara in Shawwal 194 and reared an orphan, he first heard hadith in 205, set out in 210 making the pilgrimage with his mother and brother and staying behind in the Hijaz, travelled the lands from Khurasan to Egypt hearing more than a thousand shaykhs, and drew his Sahih out of some 600,000 hadiths over sixteen years; in 247 it was said he was the most learned man to enter Nishapur. In his last days al-Dhuhli's envy drove him from Nishapur to Bukhara, and from Bukhara he was expelled to Khartank near Samarkand, dying there on the festival night, first of Shawwal 256 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  ur: "ابو عبداللہ محمد بن اسماعیل بن ابراہیم بن مغیرہ بن بردزبہ جعفی بخاری، امیر المومنین فی الحدیث؛ مستند محدثین میں سے، ان کی تصانیف میں تاریخ کبیر، تاریخ صغیر، اسماء والکنیٰ، ضعفاء، صحیح، سنن فی الفقہ، ادب، تاریخ اوسط، خلق افعال العباد اور قراءہ خلف الامام ہیں {cite:fihrist-ibn-al-nadim}۔ شوال 194ھ میں بخارا میں پیدا ہوئے اور یتیم پلے، پہلا سماع 205ھ میں، 210ھ میں سفر کیا اور والدہ و بھائی کے ساتھ حج کر کے طلبِ حدیث میں رہ گئے، خراسان سے مصر تک کے شہروں میں ایک ہزار سے زیادہ شیوخ سے سماع کیا، اور سولہ برس میں تقریباً چھ لاکھ احادیث میں سے صحیح مرتب کی؛ 247ھ میں کہا گیا کہ وہ نیشاپور آنے والوں میں سب سے زیادہ علم والے ہیں۔ آخری ایام میں ذہلی کے حسد سے نیشاپور چھوڑ کر بخارا آئے، وہاں سے نکالے گئے تو سمرقند کے قریب خرتنک میں رہے، اور شوال کی پہلی رات 256ھ کو وہیں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}۔"
