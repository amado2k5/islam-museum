summary:
  ar: "أبو عبد الله محمد بن إسماعيل بن إبراهيم بن المغيرة بن بردزبة البخاري الجعفي، أمير المؤمنين في الحديث؛ من علماء المحدثين الثقات، وله كتاب التاريخ الكبير وكتاب التاريخ الصغير وكتاب الأسماء والكنى وكتاب الضعفاء وكتاب الصحيح وكتاب السنن في الفقه وكتاب الأدب وكتاب التاريخ الأوسط وكتاب خلق أفعال العباد وكتاب القراءة خلف الإمام {cite:fihrist-ibn-al-nadim p. 321-322}. وُلد ببخارى في شوال ١٩٤هـ ونشأ يتيماً، وأول سماعه سنة ٢٠٥هـ، ورحل سنة ٢١٠هـ فحج مع أمه وأخيه وتخلّف في طلب الحديث، وطاف البلدان من خراسان إلى مصر وسمع من أكثر من ألف شيخ، وأخرج صحيحه من نحو ستمئة ألف حديث في ست عشرة سنة، وقيل سنة ٢٤٧هـ: أعلم من دخل نيسابور، وفي أواخر أيامه حسده الذهلي فخرج إلى بخارى فأُخرج منها فنزل خرتنك من قرى سمرقند، ومات بها ليلة الفطر أول شوال ٢٥٦هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  en: "Abu Abd Allah Muhammad ibn Isma'il ibn Ibrahim ibn al-Mughira ibn Bardizba al-Ju'fi al-Bukhari, the commander of the faithful in hadith; among the trustworthy masters of the traditionists, author of the Great, Middle and Lesser Tarikhs, the Asma' wal-Kuna, the Du'afa', the Sahih, the Sunan in fiqh, the Adab, Khalq Af'al al-Ibad and al-Qira'a khalf al-Imam {cite:fihrist-ibn-al-nadim}. Born at Bukhara in Shawwal 194 and reared an orphan, he first heard hadith in 205, set out in 210 making the pilgrimage with his mother and brother and staying behind in the Hijaz, travelled the lands from Khurasan to Egypt hearing more than a thousand shaykhs, and drew his Sahih out of some 600,000 hadiths over sixteen years; in 247 it was said he was the most learned man to enter Nishapur. In his last days al-Dhuhli's envy drove him from Nishapur to Bukhara, and from Bukhara he was expelled to Khartank near Samarkand, dying there on the festival night, first of Shawwal 256 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  fr: "Abu Abd Allah Muhammad ibn Isma’il ibn Ibrahim ibn al-Mughira ibn Bardizba al-Ju’fi al-Bukhari, Commandeur des croyants en matière de hadith ; parmi les maîtres dignes de confiance des traditionnistes, auteur des Grand, Moyen et Petit Tarikh, d’al-Asma’ wa-l-Kuna, d’al-Du’afa’, du Sahih, des Sunan en fiqh, d’al-Adab, de Khalq Af’al al-Ibad et d’al-Qira’a khalf al-Imam {cite:fihrist-ibn-al-nadim}. Né à Boukhara en shawwal 194 H, élevé orphelin, il entendit ses premiers hadiths en 205 H, partit en 210 H faire le pèlerinage avec sa mère et son frère et resta au Hedjaz ; il parcourut les pays du Khorassan à l’Égypte, entendant plus de mille cheikhs, et tira son Sahih de quelque 600 000 hadiths en seize ans ; en 247 H, on le disait l’homme le plus savant à être entré à Nishapur. Dans ses derniers jours, l’envie d’al-Dhuhli le chassa de Nishapur vers Boukhara, d’où il fut expulsé vers Khartank près de Samarcande ; il y mourut la nuit de la fête, le premier shawwal 256 H {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  ur: "ابو عبداللہ محمد بن اسماعیل بن ابراہیم بن مغیرہ بن بردزبہ جعفی بخاری، امیر المومنین فی الحدیث؛ مستند محدثین میں سے، ان کی تصانیف میں تاریخ کبیر، تاریخ صغیر، اسماء والکنیٰ، ضعفاء، صحیح، سنن فی الفقہ، ادب، تاریخ اوسط، خلق افعال العباد اور قراءہ خلف الامام ہیں {cite:fihrist-ibn-al-nadim}۔ شوال 194ھ میں بخارا میں پیدا ہوئے اور یتیم پلے، پہلا سماع 205ھ میں، 210ھ میں سفر کیا اور والدہ و بھائی کے ساتھ حج کر کے طلبِ حدیث میں رہ گئے، خراسان سے مصر تک کے شہروں میں ایک ہزار سے زیادہ شیوخ سے سماع کیا، اور سولہ برس میں تقریباً چھ لاکھ احادیث میں سے صحیح مرتب کی؛ 247ھ میں کہا گیا کہ وہ نیشاپور آنے والوں میں سب سے زیادہ علم والے ہیں۔ آخری ایام میں ذہلی کے حسد سے نیشاپور چھوڑ کر بخارا آئے، وہاں سے نکالے گئے تو سمرقند کے قریب خرتنک میں رہے، اور شوال کی پہلی رات 256ھ کو وہیں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}۔"
  es: "Abu Abd Allah Muhammad ibn Isma'il ibn Ibrahim ibn al-Mughira ibn Bardizba al-Ju'fi al-Bukhari, el comandante de los fieles en el hadiz; entre los maestros confiables de los tradicionalistas, autor de los Tarikhs Grande, Medio y Menor, el Asma' wal-Kuna, el Du'afa', el Sahih, el Sunan in fiqh, el Adab, Khalq Af'al al-Ibad y al-Qira'a khalf al-Imam {citar:fihrist-ibn-al-nadim}. Nacido en Bujará en Shawwal 194 y criado huérfano, escuchó hadices por primera vez en 205, partió en 210 haciendo la peregrinación con su madre y su hermano y quedándose en el Hiyaz, viajó por las tierras desde Jorasán hasta Egipto escuchando a más de mil shaykhs, y extrajo su Sahih de unos 600.000 hadices a lo largo de dieciséis años; en 247 se decía que era el hombre más erudito que había entrado en Nishapur. En sus últimos días, la envidia de al-Dhuhli lo llevó de Nishapur a Bujará, y de Bujará fue expulsado a Jartank, cerca de Samarcanda, muriendo allí en la noche festiva, el primero de Shawwal 256 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  tr: "Hadis iliminde Müminlerin Emiri, güvenilir hadis âlimlerinden biri olan Ebu Abdullah Muhammed ibn İsmail ibn İbrahim ibn el-Muğra ibn Berdizba el-Buhari el-Cu'fi, Büyük Tarih Kitabı, Küçük Tarih Kitabı, İsimler ve Lakaplar Kitabı, Zayıf Râvîler Kitabı, Sahih Kitabı, Fıkıh Sünneti Kitabı, Edebiyat Kitabı, Orta Tarih Kitabı, Kulların Amellerinin Yaratılışı Kitabı ve İmamın Arkasından Okuma Kitabı gibi eserlere sahiptir. {Kaynak:fihrist-ibn-al-nadim s. 321-322}. Hicri 194 yılının Şevval ayında Buhara'da doğmuş ve yetim olarak büyümüştür. Hadisle ilk kez 205 yılında tanışmıştır. Hicri 210 yılında annesi ve erkek kardeşiyle birlikte hacca gitmiş ve hadis öğrenmek için orada kalmıştır. Horasan'dan Mısır'a kadar birçok ülkeye seyahat etti ve binden fazla şeyhten bilgi aldı. Sahih'ini on altı yılda yaklaşık altı yüz bin hadisten derledi. Hicri 247 yılında şöyle denildi: Nişapur'a giren en bilgili kişiydi. Son yıllarında, Zahli onu kıskandı, bu yüzden Buhara'ya gitti, ancak oradan kovuldu. Semerkant'ın köylerinden biri olan Hartum'a yerleşti ve Hicri 256 yılının Şevval ayının ilk gecesi, Ramazan Bayramı'nda orada vefat etti. {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
  id: "Abu Abdullah Muhammad ibn Ismail ibn Ibrahim ibn al-Mughira ibn Bardizba al-Bukhari al-Ju’fi, Amirul Mukminin dalam Hadits; salah satu ulama Hadits terpercaya, dan beliau memiliki kitab Sejarah Agung, kitab Sejarah Kecil, kitab Nama dan Julukan, kitab Perawi Lemah, kitab Sahih, kitab Sunan dalam Fiqih, kitab Sastra, kitab Sejarah Pertengahan, kitab Penciptaan Amalan Hamba, dan kitab Membaca di Balik Imam {cite:fihrist-ibn-al-nadim hlm. 321-322}. Beliau lahir di Bukhara pada bulan Syawal 194 H dan tumbuh sebagai yatim piatu. Beliau pertama kali mendengar hadits pada tahun 205 H. Beliau melakukan perjalanan pada tahun 210 H dan menunaikan ibadah haji bersama ibu dan saudara laki-lakinya, dan tinggal di belakang untuk mencari hadits. Beliau melakukan perjalanan ke berbagai negara dari Khorasan hingga Mesir dan mendengarkan ceramah dari lebih dari seribu syekh. Beliau menyusun kitab Shahihnya dari sekitar enam ratus ribu hadits dalam enam belas tahun. Dikatakan pada tahun 247 H: Beliau adalah orang yang paling berilmu yang memasuki Nishapur. Di tahun-tahun terakhirnya, Al-Dhahli iri kepadanya, sehingga beliau pergi ke Bukhara, tetapi diusir dari sana. Beliau menetap di Khartank, salah satu desa di Samarkand, dan meninggal di sana pada malam Idul Fitri, tanggal 1 Syawal 256 H. {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360-1361} {cite:tabaqat-shafiiyya-subki j.2 p. 3-15}."
