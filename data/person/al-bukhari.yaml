id: person/al-bukhari
class: person
label: { ar: "محمد بن إسماعيل البخاري", en: "Al Bukhari" }
summary:
  ar: "أبو عبد الله محمد بن إسماعيل بن إبراهيم بن المغيرة بن بردزبة البخاري الجعفي، أمير المؤمنين في الحديث؛ من علماء المحدثين الثقات، وله كتاب التاريخ الكبير وكتاب التاريخ الصغير وكتاب الأسماء والكنى وكتاب الضعفاء وكتاب الصحيح وكتاب السنن في الفقه وكتاب الأدب وكتاب التاريخ الأوسط وكتاب خلق أفعال العباد وكتاب القراءة خلف الإمام {cite:fihrist-ibn-al-nadim p. 321-322}. وفي تاريخ دمشق أنه صنّف صحيحه في ست عشرة سنة وقال «أخرجته من ستمائة ألف حديث وجعلته حجة بيني وبين الله»، و«ما أدخلت في هذا الكتاب إلا ما صح وتركت من الصحاح لطائل الطول»، وصنّفه في المسجد الحرام مستخيراً ومصلياً ركعتين عند إدخال كل حديث، وحوّل تراجم جامعه بين قبر النبي ومنبره يصلي لكل ترجمة ركعتين، وكان يحفظ مائة ألف حديث صحيح ومائتي ألف حديث غير صحيح وكتب عن ألف شيخ أو أكثر {cite:sahih-al-bukhari p. 9-10}."
