perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition remembers Khalid as Sayf Allah, the undefeated commander whose genius served the early community — while also recording that the Prophet and Umar rebuked him over the affair of Malik ibn Nuwayra.", ar: "تذكره السنة سيفَ الله، القائد الذي لم يُهزم وخدمت عبقريته الجماعة — مع حفظ عتب النبي وعمر عليه في قضية مالك بن نويرة." }
    sources: [source/ibn-sad-tabaqat-bewley, source/tabari-donner-1993]
  - tradition: academic
    id: academic
    summary: { en: "Historians regard him as one of the most capable commanders of the early conquests, and treat the Malik ibn Nuwayra episode — a tribal leader killed and his wife taken — as a documented controversy.", ar: "يعدّه المؤرخون من أقدر قادة الفتوح الأولى، ويعاملون قضية مالك بن نويرة خلافًا موثقًا." }
    sources: [source/tabari-donner-1993]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition is broadly critical of Khalid, emphasizing the Malik ibn Nuwayra affair and his earlier role against the Muslims.", ar: "ينتقده التراث الإمامي إجمالًا مبرزًا قضية مالك بن نويرة ودوره السابق ضد المسلمين." }
