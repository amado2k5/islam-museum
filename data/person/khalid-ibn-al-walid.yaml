summary:
  en: "The great commander on both sides of the early wars: the cavalry leader who turned the day at Uhud for the Meccans, then converted in 629 and led the Muslim armies at Mu'ta, in the Ridda wars and at the Yarmuk."
  ar: "القائد العسكري الأبرز في جانبي الحروب الأولى: قائد خيل مكة الذي حوّل يوم أُحد، ثم أسلم سنة 629م فقاد جيوش المسلمين في مؤتة وحروب الردة واليرموك. وفي صحيح البخاري أن النبي قال يوم نعي قادة مؤتة «حتى أخذ الراية سيف من سيوف الله» — وبه اشتهر لقبه «سيف الله» {cite:sahih-al-bukhari 4262}."
