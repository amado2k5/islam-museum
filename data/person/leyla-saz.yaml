summary:
  ar: "ملحنة وشاعرة وكاتبة تركية، وُلدت في إسطنبول سنة 1850 وتوفيت فيها سنة 1936. ابنة حكيم إسماعيل باشا طبيب القصر، قضت سبع سنوات من طفولتها في حريم قصر طولمة باغجة، وتعلمت البيانو والموسيقى التركية، وتزوجت كريتلي سري باشا، وألفت نحو مئتي عمل موسيقي، وخلفت مذكرات عن الحريم الإمبراطوري في القرن التاسع عشر تُعد من أهم الشهادات الأولية عنه، واتخذت لقب «ساز» بعد قانون الألقاب سنة 1934."
  en: "Turkish composer, poet and writer, born at Istanbul in 1850 and died there in 1936. Daughter of Hekim İsmail Pasha, the palace physician, she spent seven childhood years in the harem of Dolmabahçe Palace, learned piano and Turkish music, married Giritli Sırrı Pasha, composed some two hundred works, and left memoirs of the nineteenth-century imperial harem that remain a primary first-hand source on it; she took the surname Saz after the 1934 Surname Law."
  ur: "ترک موسیقار، شاعرہ اور مصنفہ، 1850ء میں استنبول میں پیدا ہوئیں اور 1936ء میں وہیں وفات پائی۔ محل کے طبیب حکیم اسماعیل پاشا کی بیٹی تھیں؛ بچپن حرمِ سلطانی میں گزرا، اور ان کی یادداشتیں انیسویں صدی کے شاہی حرم کی اہم ترین عینی شہادتوں میں ہیں۔"
