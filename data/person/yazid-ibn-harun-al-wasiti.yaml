id: person/yazid-ibn-harun-al-wasiti
class: person
label: { ar: "يزيد بن هارون الواسطي", en: "Yazid ibn Harun", es: "Yazid ibn Harun", fr: "Yazid ibn Harun", ur: "یزید بن ہارون" }
summary:
  ar: "يزيد بن هارون بن زاذان الواسطي مولى بني سليم، من علية أهل الحديث وعظمائهم، ولد سنة سبع عشرة ومائة ومات بواسط سنة ست ومائتين وله تسع وثمانون سنة، وكان أبوه يخدم في مطبخ زياد بن أبيه وابنه ومصعب بن الزبير والحجاج {cite:muruj-al-dhahab p. 426}."
  en: "The Wasit traditionist giant — born 117, dead 206, his father having served the kitchens of Ziyad, Mus'ab and al-Hajjaj {cite:muruj-al-dhahab p. 426}."
  es: "El gigante tradicionalista de Wasit — nacido en 117, muerto en 206, su padre había servido en las cocinas de Ziyad, Mus'ab y al-Hajjaj {cite:muruj-al-dhahab p. 426}."
  fr: "Le géant traditionaliste Wasit — né en 117, mort en 206, son père ayant servi dans les cuisines de Ziyad, Mus'ab et al-Hajjaj {cite:muruj-al-dhahab p. 426}."
  ur: "وصیت روایت پسند دیو - پیدا ہوا 117، وفات 206، اس کے والد نے زیاد، مصعب اور الحجاج کے باورچی خانے کی خدمت کی تھی {حوالہ: مروج الذہب صفحہ 426}۔"
  tr: "Yezid ibn Harun ibn Zadhan al-Wasiti, Banu Süleym'in özgür bir adamıydı ve hadis âlimlerinin önde gelen ve önde gelen âlimlerinden biriydi. 171 Hicri yılında doğdu ve 206 Hicri'de Wasit'te seksen dokuz yaşında öldü. Babası Ziyad bin Abuhi'nin, oğlu Mus'ab ibn al-Zubayr'ın ve el-Hacħ'ın mutfaklarında hizmet etti {cite:muruj-al-dhahab, s. 426}."
  id: "Yazid ibn Harun ibn Zadhan al-Wasiti adalah seorang mantan Banu Sulaym, salah satu ulama hadis terkemuka dan terkemuka. Ia lahir pada tahun 171 H dan meninggal di Wasit pada tahun 206 H pada usia delapan puluh sembilan tahun. Ayahnya melayani di dapur Ziyad ibn Abuhi, putranya Mus'ab ibn al-Zubayr, dan al-Hajjaj {cite:muruj-al-dhahab, hlm. 426}."
