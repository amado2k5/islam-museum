summary:
  ar: "مغنٍّ ومؤلف أغانٍ مالي، وُلد في قرية جوليبا سنة 1949، من أسرة كيتا الملكية التي تنتسب إلى سوندياتا كيتا مؤسس إمبراطورية مالي. نبذه أهله ومجتمعه بسبب مهقه وانتقاله إلى الغناء المحفوظ لطبقة الغريوت، فصار من أشهر أصوات أفريقيا ولُقّب بـ«صوت أفريقيا الذهبي»، وكرّس جانبًا من عمله للدفاع عن المصابين بالمهق."
  en: "Malian singer-songwriter, born in the village of Djoliba in 1949, of the Keita royal family that traces its descent to Sundiata Keita, founder of the Mali Empire. Cast out by his family and community over his albinism and over taking up singing, a griot-caste occupation, he became one of Africa's best-known voices — the 'Golden Voice of Africa' — and has devoted part of his work to the defence of people with albinism."
  ur: "مالی کے گلوکار و نغمہ نگار، جو 1949 میں گاؤں جولیبا میں پیدا ہوئے، کیتا شاہی خاندان سے ہیں جو مالی سلطنت کے بانی سندیاتا کیتا کی نسل بتایا جاتا ہے۔ بْرص (البنیت) اور گریو ذات کے پیشے یعنی گائیکی اپنانے پر خاندان و برادری نے انہیں ٹھکرا دیا، مگر وہ افریقہ کی معروف ترین آوازوں میں سے ایک بنے اور «افریقہ کی سنہری آواز» کہلائے، اور اپنے کام کا ایک حصہ البنیت کے شکار افراد کے دفاع کے لیے وقف کیا۔"
