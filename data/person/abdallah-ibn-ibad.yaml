summary:
  ar: "عبد الله بن إباض الخارجي الذي مات في عهد عبد الملك بن مروان، إليه تنسب الإباضية؛ وهي الفرقة الوحيدة من الخوارج التي عاشت وانتشرت في شمالي إفريقية وعُمان وحضرموت وزنجبار واستمرت إلى يومنا، فكان من الطبيعي أن يكون لها أصول اعتقادية وتعاليم فقهية تعدّل مذهبها مع الزمان — أصول كلامية متأثرة إلى حد كبير بمذهب المعتزلة في القول بخلق القرآن وأن الله لا يُرى في الجنة، وكتب فقهية خاصة تخالف أهل السنة في بعض الفروع {cite:duha-islam p. 948}."
  en: "Abdallah ibn Ibad — the eponym of the Ibadiyya, the one Khariji branch to survive, in North Africa, Oman, Hadramawt and Zanzibar, with a fiqh and kalam of its own shaped partly by the Mu'tazila {cite:duha-islam p. 948}."
  fr: "Abdallah ibn Ibad — l'éponyme des Ibadites, seule branche kharijite à avoir survécu, en Afrique du Nord, en Oman, au Hadramaout et à Zanzibar, avec un fiqh et un kalam propres, en partie façonnés par les mu'tazilites {cite:duha-islam p. 948}."
  es: "Abdallah ibn Ibad — epónimo de la ibadí, la única rama jariyí que sobrevivió en el norte de África, Omán, Hadramawt y Zanzíbar, con un fiqh y un kalam propios moldeados en parte por los mu'tazila {cite:duha-islam p. 948}."
  ur: "عبداللہ ابن عباد - عبادیہ کا تخلص، شمالی افریقہ، عمان، حضرموت اور زنجبار میں زندہ رہنے والی ایک خارجی شاخ، جس کی اپنی شکل کا ایک فقہ اور کلام ہے جس کا جزوی طور پر معتزلہ نے ترجمہ کیا ہے۔ 948}۔"
  tr: "Abdülmalik ibn Mervan döneminde ölen Abdullah ibn İbad el-Harci, İbadiyye mezhebinin atfedildiği kişidir. Kuzey Afrika, Umman, Hadramaut ve Zanzibar'da yaşayan ve günümüze kadar varlığını sürdüren tek Harici mezhebidir. Zaman içinde doktrinini değiştiren doktrinsel prensiplere ve fıkıh öğretilerine sahip olması doğaldı; teolojik prensipleri, Kur'an'ın yaratıldığını ve Tanrı'nın cennette görülemeyeceğini söyleyen Mu'tezile doktrininden büyük ölçüde etkilenmişti ve bazı dallarda Sünnilerden farklılaşan özel fıkıh kitapları vardı. {cite:duha-islam s. 948}"
  id: "Abdullah ibn Ibad al-Kharji, yang meninggal pada masa pemerintahan Abd al-Malik ibn Marwan, adalah orang yang dikaitkan dengan aliran Ibadiyyah. Aliran ini adalah satu-satunya sekte Kharijites yang hidup dan menyebar di Afrika Utara, Oman, Hadhramaut, dan Zanzibar, dan berlanjut hingga saat ini. Wajar jika aliran ini memiliki prinsip-prinsip doktrin dan ajaran yurisprudensi yang memodifikasi doktrinnya dari waktu ke waktu — prinsip-prinsip teologis yang sangat dipengaruhi oleh doktrin Mu'tazila yang menyatakan bahwa Al-Qur'an diciptakan dan bahwa Tuhan tidak dapat dilihat di Surga, serta kitab-kitab yurisprudensi khusus yang berbeda dari Sunni dalam beberapa cabang {cite:duha-islam p. 948}."
