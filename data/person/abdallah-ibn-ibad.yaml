summary:
  ar: "عبد الله بن إباض الخارجي الذي مات في عهد عبد الملك بن مروان، إليه تنسب الإباضية؛ وهي الفرقة الوحيدة من الخوارج التي عاشت وانتشرت في شمالي إفريقية وعُمان وحضرموت وزنجبار واستمرت إلى يومنا، فكان من الطبيعي أن يكون لها أصول اعتقادية وتعاليم فقهية تعدّل مذهبها مع الزمان — أصول كلامية متأثرة إلى حد كبير بمذهب المعتزلة في القول بخلق القرآن وأن الله لا يُرى في الجنة، وكتب فقهية خاصة تخالف أهل السنة في بعض الفروع {cite:duha-islam p. 948}."
  en: "Abdallah ibn Ibad — the eponym of the Ibadiyya, the one Khariji branch to survive, in North Africa, Oman, Hadramawt and Zanzibar, with a fiqh and kalam of its own shaped partly by the Mu'tazila {cite:duha-islam p. 948}."
