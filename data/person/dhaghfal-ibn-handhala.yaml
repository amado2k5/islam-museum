summary:
  ar: "من المعلمين ⁦(المؤدبين)⁩ الذين اختارهم معاوية بن أبي سفيان لتعليم ابنه يزيد وتهذيبه، وهي وظيفة ذكرها الكتاب ضمن ظهور طبقة المعلمين في العصر الأموي {cite:umayyad-birth-to-fall-2006 p. 169}."
  tr: "Muaviye bin Ebi Sufyan'ın oğlu Yezidi eğitmek ve geliştirmek için seçtiği öğretmenler (eğitimciler) arasında, kitapta Emevi döneminde öğretmenlik sınıfının ortaya çıktığı dönemde bahsedilen bu pozisyon {cite:umayyad-birth-to-fall-2006, s. 169}."
  id: "Di antara para guru (para pendidik) yang dipilih Muawiyah ibn Abi Sufyan untuk diajarkan dan disempurnakan kepada putranya Yazid, posisi yang disebutkan dalam buku tersebut saat munculnya kelas pengajar pada era Umayyah {cite:umayyad-birth-to-fall-2006, hlm. 169}."
