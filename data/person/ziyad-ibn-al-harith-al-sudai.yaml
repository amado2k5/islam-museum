summary:
  ar: "زياد بن الحارث الصدائي، صحابي، قدم على النبي فأذن له في سفره، وجهز النبي جيشا إلى قومه صداء باليمن، فرده بعد إسلامهم، وقال له: إن أخا صداء أذن، ومن أذن فهو يقيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  en: "Ziyad ibn al-Harith al-Sudai, a Companion who came to the Prophet, who allowed him to call the prayer on a journey; the Prophet sent an army to his people, the Sudaa in Yemen, and recalled it when they had embraced Islam, saying that the brother of the Sudaa had called the prayer, and whoever calls it also leads it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  ur: "زیاد بن حارث الصدائی، وہ صحابی جو نبی کے پاس آیا جس نے اسے سفر میں اذان کی اجازت دی؛ نبی نے اسے ایک فوج پر مقرر کیا۔"
  es: "Ziyad ibn al-Harith al-Sudai, un Compañero que se presentó ante el Profeta, le permitió llamar a la oración durante un viaje. El Profeta envió un ejército a su pueblo, los Sudaa en Yemen, y lo recordó cuando abrazaron el Islam, diciendo que el hermano de los Sudaa había llamado a la oración, y que quien la llama también la dirige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  fr: "Ziyad ibn al-Harith al-Sudai, un Compagnon venu auprès du Prophète, l'autorisa à appeler à la prière lors d'un voyage. Le Prophète envoya une armée auprès de son peuple, les Sudaa, au Yémen, et rappela cet usage après leur conversion à l'islam, expliquant que le frère des Sudaa avait appelé à la prière et que quiconque l'appelle la dirige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  tr: "Ziyad ibn al-Haris al-Saddai, bir sahabe, Peygamber'e geldi ve ona seyahat izni verdi. Peygamber, Yemen'deki Sad'a'da kendi halkı için bir ordu hazırladı, İslam'ı kabul ettikten sonra onu geri getirdi ve dedi ki: Kardeş Sada kulaktır, kim izin verirse o kalacaktır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.9963}"
  id: "Ziyad ibn al-Harith al-Saddai, seorang sahabat, datang kepada Nabi dan memberi izin baginya untuk bepergian. Nabi menyiapkan pasukan untuk kaumnya di Sad'a di Yaman, mengembalikannya setelah mereka memeluk Islam, dan berkata: Saudara Sada adalah telinga, dan siapa pun yang memberi izin, dia yang akan tetap tinggal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9963}"
