summary:
  ar: "زياد بن الحارث الصدائي، صحابي، قدم على النبي فأذن له في سفره، وجهز النبي جيشا إلى قومه صداء باليمن، فرده بعد إسلامهم، وقال له: إن أخا صداء أذن، ومن أذن فهو يقيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  en: "Ziyad ibn al-Harith al-Sudai, a Companion who came to the Prophet, who allowed him to call the prayer on a journey; the Prophet sent an army to his people, the Sudaa in Yemen, and recalled it when they had embraced Islam, saying that the brother of the Sudaa had called the prayer, and whoever calls it also leads it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
