summary:
  ar: "سياسي وعسكري أفغاني، وُلد سنة 1947 في غرديز بولاية بكتيا ودرس الطب في جامعة كابل. ترأّس جهاز الاستخبارات (الخاد) ثم صار الأمين العام لحزب الشعب الديمقراطي سنة 1986 ورئيس أفغانستان (1987–1992) وطبّق سياسة المصالحة الوطنية. بعد سقوط حكومته احتمى بمقر الأمم المتحدة في كابل حتى قتله طالبان عند دخولهم العاصمة في 27 سبتمبر 1996."
  en: "Afghan politician and military officer, born in 1947 at Gardez in Paktia and trained in medicine at Kabul University. He headed the KHAD intelligence service, became general secretary of the PDPA in 1986 and president of Afghanistan (1987–1992), pursuing National Reconciliation. After his government's fall he sheltered in the UN compound in Kabul until the Taliban killed him on their capture of the capital on 27 September 1996."
  ur: "افغان سیاست دان و فوجی افسر، جو 1947ء میں پکتیا کے گردیز میں پیدا ہوئے اور جامعہ کابل میں طب کی تعلیم پائی۔ خاد انٹیلیجنس سروس کے سربراہ رہے، 1986ء میں پی ڈی پی اے کے جنرل سیکرٹری اور پھر افغانستان کے صدر (1987ء–1992ء) بنے اور قومی مصالحت کی پالیسی اپنائی۔ حکومت کے خاتمے کے بعد کابل میں اقوامِ متحدہ کے احاطے میں پناہ گزین رہے حتیٰ کہ 27 ستمبر 1996ء کو طالبان نے دارالحکومت پر قبضے کے وقت انھیں قتل کر دیا۔"
