label: { ar: "داود بن علي الأصبهاني", en: "Dawud ibn Ali al-Isbahani" }
summary:
  ar: "أبو سليمان داود بن علي بن داود بن خلف الأصبهاني وهو أول من استعمل قول الظاهر وأخذ بالكتاب والسنة وألغى ما سوى ذلك من الرأي والقياس وكان فاضلا صادقا وارعا، وتوفي ببغداد سنة سبعين ومائتين {cite:muruj-al-dhahab p. 579}، وقرأ الفقه عليه أبو جعفر الطبري، وله من الكتب كتاب الإيضاح وكتاب الإفصاح وكتاب الدعوى والبينات كبير وكتاب الأصول وكتاب الحيض ثم دون ذلك كتب في كل باب من أبواب الفقه من الطهارة إلى أدب القاضي وبلغ كتاب النكاح ألف ورقة وكتاب صيام الفرض ستمائة ورقة {cite:fihrist-ibn-al-nadim p. 303-304}."
  en: "Dawud ibn Ali al-Isbahani — first to practise the zahir, rejecting ra'y and qiyas; al-Tabari read fiqh under him {cite:fihrist-ibn-al-nadim}"
