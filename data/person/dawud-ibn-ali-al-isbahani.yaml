    ar: "داود بن علي الأصبهاني أول من استعمل قول الظاهر وأخذ بالكتاب والسنة وألغى ما سواهما من الرأي والقياس؛ توفي ببغداد."
    en: "Dawud ibn Ali al-Isbahani was the first to employ the literalist method — holding to the Book and the Sunna and dropping all opinion and analogy beside them; he died in Baghdad."
    ur: "داؤد بن علی اصفہانی پہلے شخص تھے جنھوں نے ظاہری طریق اپنایا — کتاب و سنت پر قائم رہے اور اس کے سوا رائے اور قیاس کو ترک کیا؛ بغداد میں فوت ہوئے۔"
    sources: [source/fihrist-ibn-al-nadim, source/encyclopaedia-of-islam-2]
