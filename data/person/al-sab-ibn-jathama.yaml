label: { ar: "الصعب بن جثامة", en: "Al-Sa'b ibn Jathama" }
summary:
  ar: "الصعب بن جثامة بن قيس بن ربيعة الليثي، صحابي من شجعان العرب، شهد الوقائع في عصر النبوة، وحضر فتح اصطخر وفارس. وينقل الكتاب حديثا يثني فيه النبي على شجاعته يوم حنين، وله أحاديث في الصحيح. ويذكر الكتاب وفاته نحو سنة 25 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  en: "Al-Sa'b ibn Jathama ibn Qays ibn Rabi'a al-Laythi, a Companion known for his bravery. He took part in the battles of the Prophet's time and was present at the conquests of Istakhr and Fars. The book reports a hadith in which the Prophet praises his courage at Hunayn, and says he has narrations in the Sahih collections. It gives his death as about 25 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
