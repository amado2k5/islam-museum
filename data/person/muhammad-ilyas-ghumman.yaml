summary:
  ar: "عالم دين باكستاني من سرغودها في البنجاب، تصفه المصادر بأنه عالم حنفي ومناظر وخطيب؛ يرأس مركز أهل السنة والجماعة في سرغودها ويدير خدمات أحناف الإعلامية التي تنشر دروسه ومحاضراته."
  en: "Pakistani scholar, debater and preacher from Sargodha, Punjab, described in prose sources as a Hanafi scholar; he heads Markaz Ahle Sunnat wal Jamaat in Sargodha and directs Ahnaf Media Services, the media arm that publishes his lessons and sermons."
  ur: "سرگودھا، پنجاب سے تعلق رکھنے والے پاکستانی عالم دین، مناظر اور خطیب؛ مرکز اہل سنت والجماعت سرگودھا کے سربراہ اور احناف میڈیا سروسز کے منتظم۔"
  es: "Erudito, polemista y predicador paquistaní de Sargodha, Punjab, descrito en fuentes en prosa como un erudito hanafí; dirige Markaz Ahle Sunnat wal Jamaat en Sargodha y dirige Ahnaf Media Services, el brazo de medios que publica sus lecciones y sermones."
  fr: "Un érudit pakistanais, débatteur et prédicateur de Sargodha, au Pendjab, décrit dans des sources en prose comme un érudit Hanafi; il dirige Markaz Ahle Sunnat wal Jamaat à Sargodha et dirige Ahnaf Media Services, la branche médiatique qui publie ses leçons et ses sermons."
  tr: "Pencap'ın Sargodha kentinden Pakistanlı bir din alimi olan Hanefi alimi, tartışmacı ve vaizi olarak tanımlanır; Sargodha'daki Ehl Sünnet veli-Cema'ah merkezinin başında ve derslerini ve derslerini yayımlayan Hanefi topluluğunun medya hizmetlerini yönetmektedir."
  id: "Seorang ulama agama Pakistan dari Sargodha di Punjab, sumber menggambarkannya sebagai cendekiawan Hanafi, debater, dan pengkhotbah; ia memimpin pusat Ahl Sunnah wal-Jama'ah di Sargodha dan mengelola layanan media komunitas Hanafi yang menerbitkan pelajaran dan kuliahnya."
