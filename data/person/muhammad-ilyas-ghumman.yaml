  ar: "عالم دين باكستاني من سرغودها في البنجاب، تصفه المصادر بأنه عالم حنفي ومناظر وخطيب؛ يرأس مركز أهل السنة والجماعة في سرغودها ويدير خدمات أحناف الإعلامية التي تنشر دروسه ومحاضراته."
  en: "Pakistani scholar, debater and preacher from Sargodha, Punjab, described in prose sources as a Hanafi scholar; he heads Markaz Ahle Sunnat wal Jamaat in Sargodha and directs Ahnaf Media Services, the media arm that publishes his lessons and sermons."
