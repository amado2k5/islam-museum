summary:
  ar: "داعية ماليزي مستقل ومقدّم تلفزيوني ومحاضر، وُلد في 14 نوفمبر 1984. اشتهر ببرامجه الدينية على قناتي الهجرة وأسترو أويسيس، وفي مقدمتها البرنامج التفاعلي ثلاثون دقيقة مع الأستاذ دون على قناة الهجرة. بلغت صفحته الرسمية في فيسبوك 1,717,376 متابعًا وحسابه في إنستغرام 684,944 متابعًا بحسب قراءة المنصتين مباشرة في 15 نوفمبر 2026."
  en: "Malaysian freelance preacher, television presenter and lecturer, born on 14 November 1984. He is known for his religious programmes on TV AlHijrah and Astro Oasis, above all the interactive 30 Minit Ustaz Don on TV AlHijrah. His official Facebook page counted 1,717,376 followers and his Instagram account 684,944 followers when the platforms were read directly on 15 November 2026."
  ur: "ملائیشیا کے آزاد مبلغ، ٹیلی ویژن پیش کار اور مدرس، جو 14 نومبر 1984ء کو پیدا ہوئے۔ وہ ٹی وی الہجرہ اور آسٹرو اویسس پر اپنے دینی پروگراموں کے لیے جانے جاتے ہیں، جن میں سرفہرست ٹی وی الہجرہ کا انٹرایکٹو پروگرام ”30 منٹ استاذ ڈون“ ہے۔ 15 نومبر 2026ء کو براہِ راست قرأت کے مطابق ان کے سرکاری فیس بک صفحے کے فالوور 1,717,376 اور انسٹاگرام اکاؤنٹ کے فالوور 684,944 تھے۔"
