summary:
  ar: "أمير المؤمنين المعتضد بالله أبو الفتح داود بن المتوكل على الله خليفة بني العباس بالقاهرة؛ قرره المؤيد شيخ في الخلافة مكان أخيه المستعين بالله لما عزله، وكانت خلافته ثمانية وعشرين سنة وشهرين وتوفي يوم الأحد رابع شهر ربيع الأول سنة خمس وأربعين وثمانمائة وقارب التسعين واستقر بعده شقيقه المستكفي بالله أبو الربيع سليمان بعهد منه {cite:shadharat-dhahab p. 255}."
  en: "Al-Mu'tadid Billah Dawud — Cairo's Abbasid caliph for 28 years and two months, installed by al-Mu'ayyad Shaykh in place of his deposed brother al-Musta'in; died Sunday 4 Rabi' I 845 near ninety, succeeded by his brother al-Mustakfi Sulayman {cite:shadharat-dhahab p. 255}."
  fr: "Al-Mu'tadid Billah Dawud - calife abbasside du Caire pendant 28 ans et deux mois, installé par al-Mu'ayyad Shaykh à la place de son frère déposé al-Musta'in ; décédé dimanche 4 Rabi' I 845 près de quatre-vingt-dix, remplacé par son frère al-Mustakfi Sulayman {cite:shadharat-dhahab p. 255}."
  es: "Al-Mu'tadid Billah Dawud — Califa abasí de El Cairo durante 28 años y dos meses, instalado por al-Mu'ayyad Shaykh en lugar de su hermano depuesto al-Musta'in; murió el domingo 4 de Rabi' I de 845 cerca de los noventa años, sucedido por su hermano al-Mustakfi Sulayman {cite:shadharat-dhahab p. 255}."
  ur: "المتعد باللہ داؤد - قاہرہ کا 28 سال اور دو ماہ کے لیے عباسی خلیفہ، المعیاد شیخ نے اپنے معزول بھائی المستعین کی جگہ نصب کیا۔ اتوار 4 ربیع الثانی 845 کو نوے کے قریب وفات پائی، ان کے بھائی المستکفی سلیمان نے جانشین بنایا۔ 255}۔"
