  ar: "جمال الدين الحصيري"
  en: "Jamal al-Din al-Hasiri"
  es: "Jamal al-Din al-Hasiri"
  fr: "Jamal al-Din al-Hasiri"
roles: [faqih]
gender: male
summary:
  ar: "محمود بن أحمد بن عبد السيد بن عثمان، أبو المحامد، جمال الدين البخاري الحصيري، فقيه انتهت إليه رياسة الحنفية في زمانه، مولده في بخارى، سكن دمشق ودرس بالمدرسة النورية وتوفي بها، من كتبه التحرير في شرح الجامع الكبير."
  en: "Mahmud ibn Ahmad ibn Abd al-Sayyid ibn Uthman, Abu al-Mahamid, Jamal al-Din al-Bukhari al-Hasiri, a jurist to whom the headship of the Hanafis passed in his time; born in Bukhara, he settled in Damascus, taught at the Nuriyya school and died there; his books include al-Tahrir, a commentary on al-Jami al-Kabir."
  es: "Mahmud ibn Ahmad ibn Abd al-Sayyid ibn Uthman, Abu al-Mahamid, Jamal al-Din al-Bukhari al-Hasiri, un jurista a quien recayó la dirección de los Hanafi en su época; nació en Bujará, se estableció en Damasco, enseñó en la escuela Nuriyya y murió allí; entre sus libros se incluye al-Tahrir, un comentario sobre al-Jami al-Kabir."
  fr: "Mahmud ibn Ahmad ibn Abd al-Sayyid ibn Uthman, Abu al-Mahamid, Jamal al-Din al-Bukhari al-Hasiri, juriste à qui la direction des Hanafites est passée à son époque; né à Boukhara, il s'est installé à Damas, a enseigné à l'école Nuriyya et y est mort; ses livres comprennent al-Tahrir, un commentaire sur al-Jami al-Kabir."
