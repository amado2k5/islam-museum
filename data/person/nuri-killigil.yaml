summary:
  ar: "جنرال عثماني، أخ غير شقيق لأنور باشا وزير الحربية. نظّم عمليات التشكيلات المخصوصة في ليبيا، ثم قاد جيش الإسلام في القوقاز ودخل باكو سنة 1918 فعُرف بفاتح باكو. وبعد الحرب أسس مصنع سلاح في إسطنبول، فقُتل في انفجاره سنة 1949 ودُفن في مقبرة شهداء أدرنة قابي."
  en: "Ottoman general, the half-brother of the Minister of War Enver Pasha. He organised Special Organization operations in Libya, then commanded the Army of Islam in the Caucasus and entered Baku in 1918, becoming known as its conqueror. After the war he founded a weapons factory at Istanbul and was killed by its explosion in 1949; he was buried at the Edirnekapı Martyrs' Cemetery."
  ur: "عثمانی جنرل، وزیرِ حرب انور پاشا کے سوتیلے بھائی۔ انہوں نے لیبیا میں تنظیمِ مخصوصہ کی کارروائیوں کو منظم کیا، پھر قفقاز میں اسلام فوج کی قیادت کی اور 1918 میں باکو میں داخل ہوئے اور اس کے فاتح کہلائے۔ جنگ کے بعد انہوں نے اسطنبول میں اسلحہ فیکٹری قائم کی اور 1949 میں اس کے دھماکے میں جاں بحق ہوئے؛ ادرنہ قاپی شہداء قبرستان میں دفن ہوئے۔"
