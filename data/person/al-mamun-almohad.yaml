id: person/al-mamun-almohad
class: person
label:
  ar: المأمون بن المنصور الموحدي
  en: al-Ma'mun ibn al-Mansur al-Muwahhidi
  fr: "al-Ma'mun ibn al-Mansur al-Muwahhidi"
  es: "al-Ma'mun ibn al-Mansur al-Muwahhidi"
summary:
  ar: "خليفة موحدي ⁦(624-630هـ)⁩، ثار على مذهب دولته نفسها: بويع بإشبيلية فدخل مراكش سنة 626هـ بمدد من النصارى، وعدّد على مشيخة الموحدين فعلاتهم وقتل مائة من أعيانهم، وأصدر كتابه إلى البلدان بمحو اسم المهدي ابن تومرت من السكة والخطبة والنعي عليه في النداء باللسان البربري، وأذن للنصارى في بناء كنيسة بمراكش، فخلعت إفريقية طاعته لأبي زكريا الحفصي سنة 627هـ، وهلك بوادي أم الربيع سنة 630هـ."
  en: "The Almohad caliph (624-630 AH) who revolted against his own dynasty's doctrine: acclaimed at Seville, he entered Marrakesh in 626 AH with a Christian army, reproached the Almohad shaykhs and killed a hundred of their notables, ordered Ibn Tumart's name erased from coinage and khutba and cursed in the Berber adhan, licensed a church in Marrakesh, lost Ifriqiya to Abu Zakariya al-Hafsi in 627 AH, and died at Wadi Umm al-Rabi' in 630 AH."
  fr: "Calife almohade de 624 à 630 de l’hégire, il rompit avec la doctrine de sa propre dynastie. Proclamé à Séville, il entra à Marrakech en 626 de l’hégire avec une armée chrétienne. Il reprocha leur conduite aux cheikhs almohades et fit tuer cent de leurs notables. Il ordonna d’effacer le nom d’Ibn Tumart des monnaies et du sermon du vendredi, et de le maudire dans l’appel à la prière en berbère. Il autorisa une église à Marrakech, perdit l’Ifriqiya au profit d’Abou Zakariya al-Hafsi en 627 de l’hégire, il mourut à Wadi Umm al-Rabi en 630."
  es: "El califa almohade (624-630 AH) que se rebeló contra la doctrina de su propia dinastía: aclamado en Sevilla, entró en Marrakech en el 626 AH con un ejército cristiano, reprendió a los jeques almohades y mató a cien de sus notables, ordenó que se borrara el nombre de Ibn Tumart de las monedas y de la jutba y lo maldijo en el adhan bereber, autorizó una iglesia en Marrakech, perdió Ifriqiya ante Abu Zakariya al-Hafsi en el 627 AH y murió en Wadi Umm al-Rabi' en el 630 AH."
