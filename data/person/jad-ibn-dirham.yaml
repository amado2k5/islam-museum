id: person/jad-ibn-dirham
class: person
label: { ar: "الجعد بن درهم", en: "Jad Ibn Dirham", es: "Jad Ibn Dirham", fr: "Jad Ibn Dirham", ur: "جد ابن درہم" }
summary:
  ar: "الجعد بن درهم الذي ينسب إليه مروان بن محمد فيقال مروان الجعدي، وكان مؤدبا له ولولده فأدخله في الزندقة، وقتل الجعد هشام بن عبد الملك في خلافته بعد أن أطال حبسه في يد خالد بن عبد الله القسري: قيل إن آل الجعد رفعوا قصة إلى هشام يشكون ضعفهم وطول حبس الجعد فكتب هشام إلى خالد في قتله فقتله يوم أضحى وجعله بدلا من الأضحية بعد أن أعلن ذلك على المنبر بأمر هشام {cite:fihrist-ibn-al-nadim p. 472-473}."
  en: "Ja'd ibn Dirham — Marwan II's tutor; crucified on an Eid at Hisham's command {cite:fihrist-ibn-al-nadim}"
  es: "Ja'd ibn Dirham — Tutor de Marwan II; crucificado en un Eid por orden de Hisham {cite:fihrist-ibn-al-nadim}"
  fr: "Ja'd ibn Dirham — précepteur de Marwan II; crucifié un jour de fête sur ordre de Hisham {cite:fihrist-ibn-al-nadim}"
  ur: "جاد بن درہم - مروان دوم کا استاد؛ ہشام کے حکم پر عید پر مصلوب کیا گیا"
  tr: "Marwan ibn Muhammed'in atfedildiği Al-Ja'd ibn Dirham, ayrıca Marwan Al-Ca'di olarak da anılır. O, kendisi ve oğlu için disiplinli bir beyefendiydi, bu yüzden onu sapkına sürükledi. Al-Ja'd, Halifeliği sırasında Hişam ibn Abdüldül-Malik'i, Halid bin Abdullah el-Kasri tarafından hapis cezasını uzattıktan sonra öldürdü: Ja'd ailesinin Hiham'a zayıflıklarından ve al-Ca'd'ın hapis süresinden şikayet eden bir hikaye anlattığı söylenir, bu yüzden Hisam, Halid'e idamını yazdı, ardından Adha gününde onu öldürdü ve Hisham'ın emriyle vaaz kürsüsünde bunu duyurduktan sonra kurbanın yerine geçti {atıf:Fihrist-ibn-al-Nadim s. 472-473}."
  id: "Al-Ja'd ibn Dirham, yang dikaitkan dengan Marwan ibn Muhammad, dan ia juga disebut Marwan Al-Ja'di. Ia adalah seorang pria yang disiplin bagi dirinya dan putranya, sehingga ia membawanya ke dalam bid'ah. Al-Ja'd membunuh Hisham ibn Abd al-Malik selama masa khalifahnya setelah ia memperpanjang masa penahanannya di tangan Khalid ibn Abdullah al-Qasri: Konon keluarga Ja'd melaporkan kisah kepada Hisham yang mengeluhkan kelemahan mereka dan lamanya penahanan al-Ja'd, sehingga Hisham menulis kepada Khalid tentang eksekusinya, sehingga ia membunuhnya pada hari Adha dan menjadikannya pengganti pengorbanan setelah ia mengumumkan hal ini di mimbar atas perintah Hisham {cite:fihrist-ibn-al-nadim hlm. 472-473}."
