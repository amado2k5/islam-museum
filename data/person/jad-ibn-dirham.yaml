label: { ar: "الجعد بن درهم", en: "Jad Ibn Dirham" }
summary:
  ar: "الجعد بن درهم الذي ينسب إليه مروان بن محمد فيقال مروان الجعدي، وكان مؤدبا له ولولده فأدخله في الزندقة، وقتل الجعد هشام بن عبد الملك في خلافته بعد أن أطال حبسه في يد خالد بن عبد الله القسري: قيل إن آل الجعد رفعوا قصة إلى هشام يشكون ضعفهم وطول حبس الجعد فكتب هشام إلى خالد في قتله فقتله يوم أضحى وجعله بدلا من الأضحية بعد أن أعلن ذلك على المنبر بأمر هشام {cite:fihrist-ibn-al-nadim p. 472-473}."
  en: "Ja'd ibn Dirham — Marwan II's tutor; crucified on an Eid at Hisham's command {cite:fihrist-ibn-al-nadim}"
