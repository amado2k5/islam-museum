summary:
  ar: "عالم وشيخ صوفي سنغالي (1900–1975)، صاحب «الفيضة» التيجانية ومؤسس مدينة باي في كولخ. أعلن سنة 1929 أنه خليفة الشيخ التيجاني في الطريقة، فصار فرعه أكبر فروع التيجانية في العالم، وامتد أتباعه في غرب إفريقيا كلها ولا سيما شمال نيجيريا."
  en: "Senegalese scholar and Sufi shaykh (1900-1975), bearer of the Tijani Fayda ('flood') and founder of Medina Baye at Kaolack. In 1929 he announced that he had become khalifa of Shaykh Tijani in the order; his branch became the largest of the Tijaniyya worldwide, with followers across West Africa and especially in northern Nigeria."
  ur: "سینیگال کے عالم اور صوفی شیخ (1900ء–1975ء)، تیجانی «فیضہ» کے حامل اور کولخ میں مدینہ بائے کے بانی۔ 1929ء میں انہوں نے اعلان کیا کہ وہ طریقے میں شیخ تیجانی کے خلیفہ بن گئے ہیں؛ ان کی شاخ تیجانیہ کی دنیا بھر میں سب سے بڑی شاخ بن گئی اور ان کے پیروکار پورے مغربی افریقہ، خاص طور پر شمالی نائجیریا، میں پھیل گئے۔"
