summary:
  ar: "استخلفه خالد بن الوليد على اليمامة بعد فتحها سنة 12هـ لما سار إلى البحرين مجيباً كتاب أبي بكر بإنجاد العلاء بن الحضرمي ⁦(البلاذري)⁩."
  en: "Appointed by Khalid ibn al-Walid over al-Yamama after its conquest in 12 AH, when Khalid marched to Bahrain in answer to Abu Bakr's letter ordering him to reinforce al-Ala ibn al-Hadrami (al-Baladhuri)."
  es: "Designado por Khalid ibn al-Walid para supervisar al-Yamama tras su conquista en el año 12 de la Hégira, cuando Khalid marchó a Bahréin en respuesta a la carta de Abu Bakr en la que le ordenaba reforzar a al-Ala ibn al-Hadrami (al-Baladhuri)."
  fr: "Nommé par Khalid ibn al-Walid à la tête d'al-Yamama après sa conquête en 12 AH, lorsque Khalid marcha vers Bahreïn en réponse à la lettre d'Abu Bakr lui ordonnant de renforcer al-Ala ibn al-Hadrami (al-Baladhuri)."
  ur: "خالد بن ولید نے 12 ہجری میں فتح کے بعد یمامہ پر مقرر کیا، جب خالد نے ابو بکر کے خط کے جواب میں بحرین کی طرف کوچ کیا جس میں انہیں علاء ابن الحدرمی ⁦(البلادوری)⁩ کو تقویت دینے کا حکم دیا گیا تھا۔"
  tr: "Halid bin el-Velid, 12 Hicri yılında, Ebu Bekir'in al-Ala' ibn al-Hadrami (el-Baladhuri) kurtarılması için gönderdiği mektubuna yanıt olarak Bahreyn'e giderek onu al-Yamama'nın fethinden sonra halef olarak atadı."
  id: "Khalid ibn al-Walid mengangkatnya sebagai penerus al-Yamama setelah penaklukannya pada tahun 12 H, ketika ia melakukan perjalanan ke Bahrain menanggapi surat Abu Bakr untuk menyelamatkan al-Ala' ibn al-Hadrami (al-Baladhuri)."
