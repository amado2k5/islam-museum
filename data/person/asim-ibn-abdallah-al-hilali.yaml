class: person
label: { ar: "عاصم بن عبد الله الهلالي", en: "Asim ibn Abdallah al-Hilali", es: "Asim ibn Abdallah al-Hilali", fr: "Asim ibn Abdallah al-Hilali", ur: "عاصم بن عبداللہ ہلالی" }
summary:
  ar: "عاصم بن عبد الله بن يزيد الهلالي؛ ولاه هشام خراسان بعد وفاة الجنيد بن عبد الرحمن بمرو. ويذكر الكتاب أن هشاماً عيّنه والياً على خراسان بعد أن اضطربت الأحوال فيها بين القيسية واليمانية. {cite:salabi-umayyad-state-2020 p.483}"
  en: "Asim ibn Abdallah ibn Yazid al-Hilali; Hisham's governor of Khurasan after al-Junayd's death at Marw."
  es: "Asim ibn Abdallah ibn Yazid al-Hilali; Gobernador de Hisham de Khurasan después de la muerte de al-Junayd en Marw."
  fr: "Asim ibn Abdallah ibn Yazid al-Hilali; Hisham gouverneur du Khurasan après la mort d'al-Junayd à Marw."
  ur: "عاصم بن عبداللہ ابن یزید ہلالی؛ مرو میں الجنید کی موت کے بعد خراسان کا گورنر ہشام۔"
  tr: "Asim ibn Abdullah ibn Yazid el-Hilali; Hisham, el-Cuneyd bin Abdülrahman'ın Marw'daki ölümünden sonra onu Horasanlı olarak atadı. Kitapta, Kaysiler ile Yemenliler arasındaki durum istikrarsızlaştıktan sonra Hişem'in onu Horasan'ın valisi olarak atadığı belirtilir. {cite:Selabi-Umayyad-State-2020 s.483}"
  id: "Asim ibn Abdullah ibn Yazid al-Hilali; Hisham mengangkatnya sebagai Khurasan setelah kematian al-Junayd ibn Abd al-Rahman di Marw. Buku tersebut menyebutkan bahwa Hisham mengangkatnya sebagai gubernur Khurasan setelah situasi di sana menjadi tidak stabil antara Qaysid dan Yaman. {cite:Salabi-Umayyad-State-2020 hlm.483}"
