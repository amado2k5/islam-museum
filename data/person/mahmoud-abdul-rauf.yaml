summary:
  ar: "لاعب كرة سلة أمريكي سابق، وُلد في غولفبورت بولاية مسيسيبي سنة 1969 باسم كريستوفر واين جاكسون، واعتنق الإسلام في مطلع مسيرته وغيّر اسمه سنة 1993، ولعب تسع سنوات في الدوري الأمريكي للمحترفين، واشتهر عالميًا سنة 1996 برفضه الوقوف للنشيد الوطني الأمريكي احتجاجًا."
  en: "American former basketball player, born in Gulfport, Mississippi in 1969 as Christopher Wayne Jackson. He converted to Islam early in his career and changed his name in 1993, played nine seasons in the NBA, and drew worldwide attention in 1996 for refusing to stand for the United States national anthem in protest."
  ur: "سابق امریکی باسکٹ بال کھلاڑی، جو 1969 میں گلفپورٹ، مسیسپی میں کرسٹوفر وین جیکسن کے نام سے پیدا ہوئے۔ انہوں نے اپنے کیریئر کے آغاز میں اسلام قبول کیا اور 1993 میں اپنا نام بدلا، این بی اے میں نو سیزن کھیلے، اور 1996 میں احتجاجاً امریکی قومی ترانے کے لیے کھڑے ہونے سے انکار کر کے دنیا بھر کی توجہ حاصل کی۔"
