summary:
  ar: "لاعب كرة سلة أمريكي سابق، وُلد في غولفبورت بولاية مسيسيبي سنة 1969 باسم كريستوفر واين جاكسون، واعتنق الإسلام في مطلع مسيرته وغيّر اسمه سنة 1993، ولعب تسع سنوات في الدوري الأمريكي للمحترفين، واشتهر عالميًا سنة 1996 برفضه الوقوف للنشيد الوطني الأمريكي احتجاجًا."
  en: "American former basketball player, born in Gulfport, Mississippi in 1969 as Christopher Wayne Jackson. He converted to Islam early in his career and changed his name in 1993, played nine seasons in the NBA, and drew worldwide attention in 1996 for refusing to stand for the United States national anthem in protest."
  ur: "سابق امریکی باسکٹ بال کھلاڑی، جو 1969 میں گلفپورٹ، مسیسپی میں کرسٹوفر وین جیکسن کے نام سے پیدا ہوئے۔ انہوں نے اپنے کیریئر کے آغاز میں اسلام قبول کیا اور 1993 میں اپنا نام بدلا، این بی اے میں نو سیزن کھیلے، اور 1996 میں احتجاجاً امریکی قومی ترانے کے لیے کھڑے ہونے سے انکار کر کے دنیا بھر کی توجہ حاصل کی۔"
  es: "Exjugador de baloncesto estadounidense, nacido en Gulfport, Mississippi, en 1969 con el nombre de Christopher Wayne Jackson. Se convirtió al islam al principio de su carrera y cambió su nombre en 1993. Jugó nueve temporadas en la NBA y atrajo la atención mundial en 1996 por negarse a ponerse de pie durante el himno nacional de Estados Unidos en señal de protesta."
  fr: "Ancien joueur de basketball américain, né à Gulfport, Mississippi en 1969 sous le nom de Christopher Wayne Jackson. Il s'est converti à l'islam au début de sa carrière et a changé de nom en 1993. Il a joué neuf saisons en NBA et a attiré l'attention du monde entier en 1996 pour avoir refusé de se lever pendant l'hymne national des États-Unis en signe de protestation."
  tr: "1969'da Mississippi, Gulfport'ta Christopher Wayne Jackson adıyla doğan eski bir Amerikalı basketbolcu olan Wayne, kariyerinin başlarında İslam'a geçti ve 1993'te adını değiştirdi. NBA'de dokuz yıl oynadı ve 1996'da Amerikan milli marşı için protesto amacıyla ayakta durmayı reddetmesiyle uluslararası üne kavuştu."
  id: "Mantan pemain bola basket Amerika, lahir di Gulfport, Mississippi pada tahun 1969 dengan nama Christopher Wayne Jackson, ia memeluk Islam di awal kariernya dan mengganti namanya pada tahun 1993. Ia bermain selama sembilan tahun di NBA dan menjadi terkenal secara internasional pada tahun 1996 karena menolak berdiri saat lagu kebangsaan Amerika sebagai bentuk protes."
