label: { ar: "السلطان سنجر بن ملكشاه" }
summary:
  ar: "سلطان سلجوقي، أرسل إلى ابن أخيه مسعود يأمره بإعادة الخليفة المسترشد حين أسره ذاكراً ما ظهر من الآيات السماوية والأرضية وامتناع الناس من الصلوات فأطاعه مسعود وقبل الأرض بين يدي الخليفة {cite:tarikh-khulafa-minhaj-1434 p. 664-665}. صاحب خراسان وأجل ملوك الدنيا وأعرقهم نسباً وأقدمهم ملكاً وأكثرهم جيشاً وخطب له بالعراق والشام والجزيرة وأذربيجان وأران والحرمين وخراسان وما وراء النهر وغزنة وعاش ثلاثاً وسبعين سنة، أول ما ناب في المملكة عن أخيه بركياروق سنة تسعين وأربع مئة ثم استقل بالسلطنة سنة اثنتي عشرة وخمس مئة ولقب حينئذ بالسلطان وكان قبل ذلك يلقب بالملك المظفر وكان وقوراً مهيباً ذا حياء وكرم وشفقة على الرعية وكان مع كرمه المفرط من أكثر الناس مالاً اجتمع في خزائنه من الجوهر ألف وثلاثون رطلاً وهذا ما لم يملكه خليفة ولا ملك فيما نعلم، توفي في ربيع الأول سنة اثنتين وخمسين وخمس مئة ودفن في قبة بناها وسماها دار الآخرة وقد تضعضع ملكه في آخر أيامه وقهرته الغز ورأى الهوان ثم مَنّ الله عليه وخلص {cite:shadharat-dhahab p. 641-642}."
  en: "The senior Seljuk sultan who ordered his nephew Mas'ud to restore the captive caliph al-Mustarshid, citing the signs in heaven and earth and the suspended prayers — Mas'ud obeyed and kissed the ground before the caliph {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
