label: { ar: "السلطان سنجر بن ملكشاه" , ur: "سنجر", en: "Sanjar", es: "Sanjar", fr: "Sanjar"}
summary:
  ar: "سلطان سلجوقي، أرسل إلى ابن أخيه مسعود يأمره بإعادة الخليفة المسترشد حين أسره ذاكراً ما ظهر من الآيات السماوية والأرضية وامتناع الناس من الصلوات فأطاعه مسعود وقبل الأرض بين يدي الخليفة {cite:tarikh-khulafa-minhaj-1434 p. 664-665}. صاحب خراسان وأجل ملوك الدنيا وأعرقهم نسباً وأقدمهم ملكاً وأكثرهم جيشاً وخطب له بالعراق والشام والجزيرة وأذربيجان وأران والحرمين وخراسان وما وراء النهر وغزنة وعاش ثلاثاً وسبعين سنة، أول ما ناب في المملكة عن أخيه بركياروق سنة تسعين وأربع مئة ثم استقل بالسلطنة سنة اثنتي عشرة وخمس مئة ولقب حينئذ بالسلطان وكان قبل ذلك يلقب بالملك المظفر وكان وقوراً مهيباً ذا حياء وكرم وشفقة على الرعية وكان مع كرمه المفرط من أكثر الناس مالاً اجتمع في خزائنه من الجوهر ألف وثلاثون رطلاً وهذا ما لم يملكه خليفة ولا ملك فيما نعلم، توفي في ربيع الأول سنة اثنتين وخمسين وخمس مئة ودفن في قبة بناها وسماها دار الآخرة وقد تضعضع ملكه في آخر أيامه وقهرته الغز ورأى الهوان ثم مَنّ الله عليه وخلص {cite:shadharat-dhahab p. 641-642}."
  en: "The senior Seljuk sultan who ordered his nephew Mas'ud to restore the captive caliph al-Mustarshid, citing the signs in heaven and earth and the suspended prayers — Mas'ud obeyed and kissed the ground before the caliph {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  ur: "سلجوقی سلطان؛ اس کے عہد میں دینور کی لڑائی، قراختائیوں سے شکست اور غز قبائل کے ہاتھوں گرفتاری کے واقعات پیش آئے۔ {cite:shadharat-dhahab}"
  es: "El sultán selyúcida de mayor rango que ordenó a su sobrino Mas'ud que devolviera al califa cautivo al-Mustarshid, citando las señales en el cielo y la tierra y las oraciones suspendidas, Mas'ud obedeció y besó el suelo ante el califa {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  fr: "Le sultan seldjoukide aîné qui ordonna à son neveu Mas'ud de rétablir le calife captif al-Mustarshid, citant les signes dans le ciel et sur la terre et les prières suspendues — Mas'ud obéit et baisa le sol devant le calife {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  tr: "Bir Selçuklu sultanı, yeğeni Mas'ud'a halifeyi yakaladıktan sonra onu geri vermesini emretti; vahiye edilmiş ilahi ve dünyevi ayetleri ve halkın namaz kılmayı reddettiğini belirtti. Mas'ud ona itaat etti ve halifenin önünde yere öpücük kondurdu {atıf:Tarikh-khulafa-minhaj-1434 s. 664-665}. Horasan'ın hükümdarı, dünyanın en soylu, en soylu ve en yaşlı kralı, ordunun en güçlüsü. Irak, Şam, Arap Yarımadası, Azerbaycan, Arran, İki Kutsal Cami, Horasan, Transoksiana ve Gazna'da vaazlar verdi. Yetmiş üç yıl yaşadı. İlk olarak 490 Hicri yılında kardeşi Barkiyaruq için krallıkta vekil olarak görev yaptı, ardından 1500 H.I.'de sultanlıkta bağımsızlığını kazandı ve Sultan unvanını aldı. Bundan önce Kral El-Muzaffar olarak biliniyordu. Saygın, saygın, mütevazı, cömert ve tebaasına karşı şefkatliydi. Aşırı cömertliğiyle en zengin insanlar arasındaydı Mücevher hazinesinde bin otuz pound vardı, bildiğimiz kadarıyla bu hiçbir halifeye ya da krala ait değildi. Beş yüz elli iki yılında, Rabi'al-Awwal'da öldü ve inşa ettiği kubbeye gömüldü; bu kubbe Öteki Evi adını verdi. Son günlerinde krallığı zayıfladı, savaşlar onu ezdi ve aşağılandı, ardından Tanrı ona lütuf gösterdi ve kurtuldu {atıf:shadharat-dhahab, s. 641-642}."
  id: "Seorang sultan Seljuk mengirim kepada keponakannya Mas'ud memerintahkannya untuk mengembalikan Khalifah al-Mustarshid setelah ia menangkapnya, menyebutkan ayat-ayat ilahi dan duniawi yang diwahyukan serta penolakan rakyat untuk berdoa. Mas'ud mematuhinya dan mencium tanah di hadapan khalifah {cite:Tarikh-khulafa-minhaj-1434 hlm. 664-665}. Penguasa Khorasan, raja paling mulia, paling mulia, dan tertua di dunia, yang paling berkuasa di tentara. Ia menyampaikan khotbah di Irak, Levant, Semenanjung Arab, Azerbaijan, Arran, Dua Masjid Suci, Khorasan, Transoxiana, dan Ghazna. Ia hidup tujuh puluh tiga tahun. Ia pertama kali bertindak sebagai wakil kerajaan untuk saudaranya Barkiyaruq pada tahun 490 H, kemudian merdeka di kesultanan pada tahun 1500 H, dan kemudian bergelar Sultan. Sebelumnya, ia dikenal sebagai Raja Al-Muzaffar. Ia bermartabat dan bermartabat, rendah hati, dermawan, dan penuh kasih kepada rakyatnya. Dengan kemurahan hatinya yang berlebihan, ia termasuk di antara orang terkaya Dalam harta permatanya terdapat seribu tiga puluh pound, yang sejauh yang kita ketahui tidak dimiliki oleh khalifah atau raja manapun. Ia meninggal di Rabi' al-Awwal pada tahun lima ratus lima puluh dua dan dimakamkan di sebuah kubah yang ia bangun dan disebut Rumah Akhirat. Kerajaannya melemah di hari-hari terakhirnya, pertempuran menguasainya, dan ia menyaksikan penghinaan, kemudian Tuhan memberinya manfaat dan ia diselamatkan {cite:shadharat-dhahab, hlm. 641-642}."
