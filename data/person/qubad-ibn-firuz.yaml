summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك قباذ بن فيروز» {cite:tabari-tarikh-abu-al-fadl j.2 p.90}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Perslerinin kralıydı ve el-Tabari'nin \"Qubad ibn Firuz Kralı'nın Anılması\" başlığıyla anılmıştır {atıf:tabari-tarikh-abu-al-fadl j.2 s.90}. Bu yerde, saltanat yılları ve hikayeleri hakkında söylenenler anlatılır."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul \"Sebutan Raja Qubad ibn Firuz\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.90}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
