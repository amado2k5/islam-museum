summary:
  ar: "سياسي مالي (1945–2022) من كوتيالا، رئيس وزراء مالي (1994–2000) ورئيس الجمعية الوطنية (2002–2007)، أسس حزب التجمع من أجل مالي سنة 2001 وانتُخب رئيسا للجمهورية سنة 2013 وأعيد انتخابه سنة 2018، حتى أجبره انقلاب عسكري على الاستقالة في أغسطس 2020، ومات في بيته بباماكو في 16 يناير 2022."
  en: "Malian politician (1945–2022) from Koutiala, prime minister of Mali (1994–2000) and president of the National Assembly (2002–2007), who founded the Rally for Mali in 2001 and was elected president in 2013 and re-elected in 2018, until a military coup forced his resignation in August 2020; he died at his home in Bamako on 16 January 2022."
  ur: "مالی سیاست دان (1945ء–2022ء)، کوٹیالا سے؛ مالی کے وزیرِ اعظم (1994ء–2000ء) اور قومی اسمبلی کے صدر (2002ء–2007ء) رہے، 2001ء میں ریلی فار مالی بنائی اور 2013ء میں صدر منتخب ہوئے، 2018ء میں دوبارہ منتخب ہوئے، حتیٰ کہ اگست 2020ء میں فوجی بغاوت نے انھیں مستعفی ہونے پر مجبور کیا؛ 16 جنوری 2022ء کو باماکو میں اپنے گھر انتقال ہوا۔"
