summary:
  ar: "أبو الجارود زياد بن المنذر العبدي ويكنى أبا النجم من علماء الزيدية، سأل عنه جعفر بن محمد فقال ما فعل أبو الجارود أرجأ بعد ما أولي إماما إنه لا يموت إلا بإمام قال لعنه الله فإنه أعمى القلب أعمى البصر، وقال فيه محمد بن سنان لم يمت أبو الجارود حتى شرب المسكر وتولى الكافرين {cite:fihrist-ibn-al-nadim p. 253}."
  en: "Abu al-Jarud — the Zaydi leader whom Ja'far cursed {cite:fihrist-ibn-al-nadim}"
