id: person/abu-al-jarud
class: person
label: { ar: "أبو الجارود", en: "Abu Al Jarud", fr: "Abu al-Jarud", es: "Abu Al Jarud", ur: "ابو الجرود" }
summary:
  ar: "أبو الجارود زياد بن المنذر العبدي ويكنى أبا النجم من علماء الزيدية، سأل عنه جعفر بن محمد فقال ما فعل أبو الجارود أرجأ بعد ما أولي إماما إنه لا يموت إلا بإمام قال لعنه الله فإنه أعمى القلب أعمى البصر، وقال فيه محمد بن سنان لم يمت أبو الجارود حتى شرب المسكر وتولى الكافرين {cite:fihrist-ibn-al-nadim p. 253}."
  en: "Abu al-Jarud — the Zaydi leader whom Ja'far cursed {cite:fihrist-ibn-al-nadim}"
  fr: "Abu al-Jarud — le chef zaydite que Ja'far maudit {cite:fihrist-ibn-al-nadim}"
  es: "Abu al-Jarud — el líder zaidí a quien Ja'far maldijo {cite:fihrist-ibn-al-nadim}"
  ur: "ابو الجرود - وہ زیدی رہنما جس پر جعفر نے لعنت کی تھی۔"
  tr: "Ebu el-Cerud Ziyad ibn el-Mundhir el-Abdi, diğer adıyla Ebu el-Necm, Zeydi âlimlerinden biriydi. Cafer ibn Muhammed onun hakkında şöyle sordu: “Ebu el-Cerud ne yaptı? İmam olarak atandıktan sonra halifeliğini erteledi mi? O, ancak bir imamla ölür.” “Allah ona lanet etsin, çünkü o hem kalbi hem de gözü kördür.” dedi. Muhammed ibn Sinan onun hakkında şöyle dedi: “Ebu el-Cerud, sarhoş edici içkiler içip kâfirlerle ittifak kurmadan ölmedi.” {cite:fihrist-ibn-al-nadim s. 253}"
  id: "Abu al-Jarud Ziyad ibn al-Mundhir al-Abdi, juga dikenal sebagai Abu al-Najm, adalah salah satu ulama Zaidi. Ja'far ibn Muhammad bertanya tentangnya, katanya, “Apa yang dilakukan Abu al-Jarud? Apakah dia menunda kekhalifahannya setelah diangkat menjadi imam? Dia tidak meninggal kecuali dengan seorang imam.” Dia berkata, “Semoga Allah melaknatnya, karena dia buta hati dan buta penglihatan.” Muhammad ibn Sinan berkata tentangnya, “Abu al-Jarud tidak meninggal sampai dia meminum minuman keras dan bersekutu dengan orang-orang kafir.” {cite:fihrist-ibn-al-nadim p. 253}"
