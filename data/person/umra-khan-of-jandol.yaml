summary:
  ar: "زعيم پشتوني أفغاني (نحو 1860–1904)، خان جندول ثم نواب دير (1890–1895). قتل أخاه وانتزع العرش، وبسط سلطته على باجور، وتدخّله في چترال سنة 1894 جرّ حملة چترال البريطانية سنة 1895، ففُكّت قوته وفرّ إلى أفغانستان ومات في كابل. لقّبه تشرتشل «نابليون أفغانستان»."
  en: "Afghan Pashtun chief (c. 1860–1904), Khan of Jandol and then Nawab of Dir (1890–1895). He killed his elder brother and seized the throne, held sway over almost the whole of Bajaur, and his interference in Chitral in 1894 brought on the British Chitral Expedition of 1895; broken by it, he fled to Afghanistan and died at Kabul. Churchill called him 'the Afghan Napoleon' — a contemporary's epithet, recorded as such."
  ur: "افغان پشتون سردار (تقریباً 1860ء–1904ء)، خانِ جندول اور پھر نوابِ دیر (1890ء–1895ء)۔ انھوں نے اپنے بڑے بھائی کو قتل کر کے تخت سنبھالا، باجوڑ پر اپنا اقتدار قائم کیا، اور 1894ء میں چترال کے معاملات میں مداخلت سے 1895ء کی برطانوی چترال مہم کی نوبت آئی؛ شکست کے بعد وہ افغانستان فرار ہوئے اور کابل میں وفات پائی۔ چرچل نے انھیں «افغان نپولین» کہا۔"
