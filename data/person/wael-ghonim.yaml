summary:
  ar: "ناشط إنترنت ومهندس حاسوب مصري، وُلد في القاهرة سنة 1980 ونشأ في أبها بالسعودية. كان مدير تسويق غوغل للشرق الأوسط وشمال أفريقيا حين أنشأ دون كشف هويته سنة 2010 صفحة «كلنا خالد سعيد» على فيسبوك، فصارت منطلق دعوة إلى مظاهرات 25 يناير 2011. اعتُقل سرًا 11 يومًا، وأعاد لقاؤه التلفزيوني المؤثر بعد الإفراج عنه الزخم إلى الاحتجاجات التي أطاحت بحسني مبارك. كتب مذكراته «الثورة 2.0»، وأسس أكاديمية التحرير، وشارك في تأسيس منصة بارليو."
  en: "Egyptian Internet activist and computer engineer, born in Cairo in 1980 and raised in Abha, Saudi Arabia. He was Google's head of marketing for the Middle East and North Africa when in 2010 he anonymously created the Facebook page 'We are all Khaled Said', which became a launching point for the call to the 25 January 2011 demonstrations. He was held in secret detention for 11 days, and his emotional television interview on his release re-energised the protests that forced Hosni Mubarak from power. He wrote the memoir Revolution 2.0, founded Tahrir Academy, and co-founded the Parlio platform."
  ur: "مصری انٹرنیٹ کارکن اور کمپیوٹر انجینئر، 1980 میں قاہرہ میں پیدا ہوئے اور سعودی عرب کے شہر ابھا میں پلے بڑھے۔ وہ گوگل کے مشرقِ وسطیٰ و شمالی افریقہ کے مارکیٹنگ سربراہ تھے جب 2010 میں انھوں نے گمنام طور پر فیس بک صفحہ «ہم سب خالد سعید ہیں» بنایا، جو 25 جنوری 2011 کے مظاہروں کی دعوت کا نقطۂ آغاز بنا۔ انھیں 11 دن خفیہ حراست میں رکھا گیا، اور رہائی پر ان کے جذباتی ٹیلی ویژن انٹرویو نے حسنی مبارک کو اقتدار سے ہٹانے والے احتجاج میں نئی روح پھونکی۔ انھوں نے یادداشت «انقلاب 2.0» لکھی، تحریر اکیڈمی قائم کی اور پارلیو کے شریک بانی رہے۔"
