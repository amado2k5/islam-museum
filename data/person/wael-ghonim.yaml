summary:
  ar: "ناشط إنترنت ومهندس حاسوب مصري، وُلد في القاهرة سنة 1980 ونشأ في أبها بالسعودية. كان مدير تسويق غوغل للشرق الأوسط وشمال أفريقيا حين أنشأ دون كشف هويته سنة 2010 صفحة «كلنا خالد سعيد» على فيسبوك، فصارت منطلق دعوة إلى مظاهرات 25 يناير 2011. اعتُقل سرًا 11 يومًا، وأعاد لقاؤه التلفزيوني المؤثر بعد الإفراج عنه الزخم إلى الاحتجاجات التي أطاحت بحسني مبارك. كتب مذكراته «الثورة 2.0»، وأسس أكاديمية التحرير، وشارك في تأسيس منصة بارليو."
  en: "Egyptian Internet activist and computer engineer, born in Cairo in 1980 and raised in Abha, Saudi Arabia. He was Google's head of marketing for the Middle East and North Africa when in 2010 he anonymously created the Facebook page 'We are all Khaled Said', which became a launching point for the call to the 25 January 2011 demonstrations. He was held in secret detention for 11 days, and his emotional television interview on his release re-energised the protests that forced Hosni Mubarak from power. He wrote the memoir Revolution 2.0, founded Tahrir Academy, and co-founded the Parlio platform."
  ur: "مصری انٹرنیٹ کارکن اور کمپیوٹر انجینئر، 1980 میں قاہرہ میں پیدا ہوئے اور سعودی عرب کے شہر ابھا میں پلے بڑھے۔ وہ گوگل کے مشرقِ وسطیٰ و شمالی افریقہ کے مارکیٹنگ سربراہ تھے جب 2010 میں انھوں نے گمنام طور پر فیس بک صفحہ «ہم سب خالد سعید ہیں» بنایا، جو 25 جنوری 2011 کے مظاہروں کی دعوت کا نقطۂ آغاز بنا۔ انھیں 11 دن خفیہ حراست میں رکھا گیا، اور رہائی پر ان کے جذباتی ٹیلی ویژن انٹرویو نے حسنی مبارک کو اقتدار سے ہٹانے والے احتجاج میں نئی روح پھونکی۔ انھوں نے یادداشت «انقلاب 2.0» لکھی، تحریر اکیڈمی قائم کی اور پارلیو کے شریک بانی رہے۔"
  es: "Activista de internet e ingeniero informático egipcio, nacido en El Cairo en 1980 y criado en Abha, Arabia Saudí. Era jefe de marketing de Google para Oriente Medio y el Norte de África cuando, en 2010, creó anónimamente la página de Facebook «Todos somos Khaled Said», que se convirtió en el punto de partida de la convocatoria a las manifestaciones del 25 de enero de 2011. Estuvo detenido en secreto durante 11 días, y su emotiva entrevista televisiva tras su liberación revitalizó las protestas que obligaron a Hosni Mubarak a dimitir. Escribió las memorias «Revolución 2.0», fundó la Academia Tahrir y cofundó la plataforma Parlio."
  fr: "Militant numérique et ingénieur informatique égyptien, né au Caire en 1980 et ayant grandi à Abha, en Arabie saoudite, il était directeur marketing de Google pour le Moyen-Orient et l'Afrique du Nord lorsqu'en 2010, il créa anonymement la page Facebook « Nous sommes tous Khaled Said », qui servit de tremplin à l'appel aux manifestations du 25 janvier 2011. Détenu au secret pendant onze jours, son interview télévisée poignante à sa libération redonna de l'énergie aux protestations qui contraignirent Hosni Moubarak à quitter le pouvoir. Il est l'auteur du livre autobiographique « Révolution 2.0 », fondateur de l'Académie Tahrir et cofondateur de la plateforme Parlio."
  tr: "1980 yılında Kahire'de doğmuş ve Suudi Arabistan'ın Abha kentinde büyümüş Mısırlı bir internet aktivisti ve bilgisayar mühendisi. Google'ın Orta Doğu ve Kuzey Afrika pazarlama müdürüydü; 2010'da açıklama yapmadan \"We Are All Are Khaled Said\" Facebook sayfasını oluşturdu; bu sayfa 25 Ocak 2011 protestoları için bir başlangıç noktası oldu. Gizlice 11 gün gözaltında tutuldu ve serbest bırakıldıktan sonra yaptığı etkili TV röportajı, Hüsnü Mübarek'i deviren protestolara ivme kazandırdı. \"Revolution 2.0\" adlı anılarını yazdı, Tahrir Akademisi'ni kurdu ve Barleo platformunun kuruluşunda yer aldı."
  id: "Seorang aktivis internet dan insinyur komputer Mesir, lahir di Kairo pada tahun 1980 dan dibesarkan di Abha, Arab Saudi. Ia adalah manajer pemasaran untuk Timur Tengah dan Afrika Utara Google ketika ia membuat, tanpa diungkapkan, halaman Facebook \"We Are All Khaled Said\" pada tahun 2010, yang menjadi titik awal seruan untuk protes 25 Januari 2011. Ia diam-diam ditahan selama 11 hari, dan wawancara TV berpengaruhnya setelah dibebaskan menghidupkan kembali momentum bagi protes yang menggulingkan Hosni Mubarak. Ia menulis memoarnya \"Revolusi 2.0,\" mendirikan Akademi Tahrir, dan berpartisipasi dalam pendirian platform Barleo."
