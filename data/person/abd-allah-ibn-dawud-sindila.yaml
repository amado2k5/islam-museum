summary:
  ar: "عبد الله بن داود السنديلي، كان من المتعبدين خيرًا فاضلًا مجاب الدعوة، أسند الكثير، وحدّث عن الحسين بن حفص. ومن قوله: من علامات الحق البغض لمن يدين بالهوى، فمن أحب الحق وجب عليه بغض أصحاب الهوى، أي الذين عدلوا عن الآثار وتبعوا الآراء."
  en: "Abd Allah ibn Dawud al-Sindila, one of the worshippers, good and excellent, whose prayer was answered; he transmitted much and narrated from al-Husayn ibn Hafs. He said: among the signs of truth is hatred of those who follow desire; whoever loves the truth must hate the people of desire, meaning those who turned from the traditions and followed opinions."
  ur: "عبد اللہ بن داود سندیلی، عبادت گزاروں میں نیک اور فاضل، جن کی دعا قبول ہوتی تھی؛ انہوں نے بہت سی روایات نقل کیں اور حسین بن حفص سے روایت کی۔ ان کا قول: حق کی نشانیوں میں سے خواہش پرست لوگوں سے بغض ہے؛ جو حق سے محبت کرے اس پر خواہش پرستوں سے بغض لازم ہے، یعنی جو آثار سے ہٹ کر رائے کے پیچھے چلے۔"
