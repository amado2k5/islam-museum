summary:
  ar: "صاحب الديوان، أخو الوزير الكبير شمس الدين؛ نال هو وأخوه من المال والحشمة والجاه العظيم ما يتجاوز الوصف في دولة أبغا، وكان أمر العراق راجعاً إلى علاء الدين فساسه أحسن سياسة؛ طلب في سنة ثلاث وثمانين فاختفى ومات في الاختفاء، وقتل أخوه شمس الدين {cite:shadharat-dhahab p. 655}."
  en: "Sahib-diwan of the Ilkhanate — he and his brother the vizier Shams al-Din held wealth and majesty 'past description' under Abagha, Iraq's affairs returning to his 'best of governance'; sought in 683 he vanished and died in hiding, his brother killed {cite:shadharat-dhahab p. 655}."
  es: "Sahib-diwan del Ilkanato: él y su hermano, el visir Shams al-Din, poseían una riqueza y majestad indescriptibles bajo el reinado de Abagha, y los asuntos de Irak volvieron a su \"mejor gobierno\"; buscado en 683, desapareció y murió escondido, y su hermano fue asesinado {cite:shadharat-dhahab p. 655}."
  fr: "Sahib-diwan de l'Ilkhanat — lui et son frère le vizir Shams al-Din détenaient une richesse et une majesté « indescriptibles » sous Abagha, les affaires de l'Irak revenant à son « meilleur gouvernement »; recherché en 683, il disparut et mourut caché, son frère tué {cite:shadharat-dhahab p. 655}."
  ur: "الخانات کے صاحب دیوان - وہ اور اس کے بھائی وزیر شمس الدین نے اباغہ کے تحت دولت اور عظمت کی 'ماضی کی تفصیل' رکھی تھی، عراق کے معاملات اس کی 'بہترین طرز حکمرانی' کی طرف لوٹ رہے تھے۔ 683 میں وہ غائب ہو گیا اور چھپ کر مر گیا، اس کے بھائی نے قتل کر دیا 655}۔"
  tr: "Divan'ın sahibi, büyük bakan Şemseddin'in kardeşi ve kardeşi, Abgha devletinde tarif edilemez bir servet, alçakgönüllülük ve büyük bir statü kazandılar. Irak işleri Ala al-Din'in liderliğindeydi; 1983'te çağrıldı, ortadan kayboldu ve saklanarak öldü. Kardeşi Şemseddin öldürüldü {kaynak: shadharat-dhahab, s. 655}."
  id: "Pemilik Diwan, saudara menteri besar Shams al-Din, dan saudaranya meraih kekayaan, kerendahan hati, dan status yang tak terlukiskan di negara bagian Abgha. Urusan Irak berada di bawah kepemimpinan Ala al-Din, saat ia menjalankan kebijakan terbaiknya; ia dipanggil pada tahun 1983, menghilang, dan meninggal dalam persembunyian. Saudaranya Shams al-Din dibunuh {cite:shadharat-dhahab, hlm. 655}."
