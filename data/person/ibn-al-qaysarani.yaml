summary:
  ar: "الحافظ أبو الفضل محمد بن طاهر بن علي المقدسي المعروف بابن القيسراني؛ كان أحد الرحالين في طلب الحديث سمع بالحجاز والشام ومصر والثغور والجزيرة والعراق والجبال وفارس وخوزستان وخراسان، واستوطن همدان؛ من مصنفاته «أطراف الكتب الستة» ومجموعات تدل على غزارة علمه وجودة معرفته {cite:wafayat-ayan}."
  tr: "Hadis alimi Ebu el-Fadl Muhammed bin Tahir ibn Ali el-Makdisi, İbn al-Kaysrani olarak bilinen, hadis arayan yolculardan biriydi. Hicaz, Şam, Mısır, sınırlar, Cazire, Irak, dağlar, Pers, Huzistan ve Horasan'dan haber aldı ve Hamadan'a yerleşti. Eserleri arasında \"Altı Kitabın Bölümleri\" ve bilgisinin zenginliğini ve bilgisinin kalitesini gösteren koleksiyonlar {atı:wafayat-ayan} bulunmaktadır."
  id: "Ulama hadis Abu al-Fadl Muhammad ibn Tahir ibn Ali al-Maqdisi, yang dikenal sebagai Ibn al-Qaysrani, adalah salah satu pelancong yang mencari hadits. Ia mendengar dari Hijaz, Levant, Mesir, perbatasan, Jazira, Irak, pegunungan, Persia, Khuzestan, dan Khorasan, dan menetap di Hamadan. Di antara karyanya adalah \"Bagian dari Enam Kitab\" dan kumpulan yang menunjukkan kekayaan pengetahuannya dan kualitas pengetahuannya {cite:wafayat-ayan}."
