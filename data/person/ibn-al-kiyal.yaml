summary:
  ar: "شمس الدين محمد بن أحمد بن عبد الله الشهير بابن القيال الحنبلي؛ ترقى في حرفة التجارة إلى أن صار تاجراً، وخرج عنها إلى طلب الحديث، وأخذ عن المولى موفق الدين المصري، وقرأ على الشيخ نور الدين علي المقدسي الحنبلي كتباً كثيرة ودرّس الحديث بالحمادية بنوابة الجامع بني أمية وغيرها، وكان يهتم بالحديث ويعرِّب به، وبرع فنسق؛ توفي سنة ثلاث وتسعين وثمانمائة؛ وفيها تقريباً (930 تقريباً) {cite:shadharat-dhahab p. 571}."
  en: "The merchant who left trade for hadith — took it from Muwaffaq al-Din al-Misri and read widely on Nur al-Din 'Ali al-Maqdisi, taught hadith at the Hammadiyya by the Umayyad mosque's nawaba, 'devoted to hadith and set it out in Arabic order'; d. about 930 {cite:shadharat-dhahab p. 571}."
