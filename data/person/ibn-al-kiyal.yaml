summary:
  ar: "شمس الدين محمد بن أحمد بن عبد الله الشهير بابن القيال الحنبلي؛ ترقى في حرفة التجارة إلى أن صار تاجراً، وخرج عنها إلى طلب الحديث، وأخذ عن المولى موفق الدين المصري، وقرأ على الشيخ نور الدين علي المقدسي الحنبلي كتباً كثيرة ودرّس الحديث بالحمادية بنوابة الجامع بني أمية وغيرها، وكان يهتم بالحديث ويعرِّب به، وبرع فنسق؛ توفي سنة ثلاث وتسعين وثمانمائة؛ وفيها تقريباً ⁦(930 تقريباً)⁩ {cite:shadharat-dhahab p. 571}."
  en: "The merchant who left trade for hadith — took it from Muwaffaq al-Din al-Misri and read widely on Nur al-Din 'Ali al-Maqdisi, taught hadith at the Hammadiyya by the Umayyad mosque's nawaba, 'devoted to hadith and set it out in Arabic order'; d. about 930 {cite:shadharat-dhahab p. 571}."
  es: "El comerciante que dejó el comercio para dedicarse al hadiz —lo tomó de Muwaffaq al-Din al-Misri y leyó extensamente sobre Nur al-Din 'Ali al-Maqdisi, enseñó hadiz en la Hammadiyya por el nawaba de la mezquita omeya, 'se dedicó al hadiz y lo ordenó en árabe'; murió alrededor del 930 {cita: shadharat-dhahab p. 571}."
  fr: "Le marchand qui abandonna le commerce pour le hadith – l'apprit de Muwaffaq al-Din al-Misri et lut beaucoup sur Nur al-Din 'Ali al-Maqdisi, enseigna le hadith à la Hammadiyya auprès du nawaba de la mosquée omeyyade, « dévoué au hadith et le mit en ordre arabe »; mort vers 930 {cite: shadharat-dhahab p. 571}."
  ur: "سوداگر جس نے حدیث کے لیے تجارت چھوڑ دی — اسے موفق الدین المصری سے لیا اور نورالدین علی المقدسی پر وسیع پیمانے پر پڑھا، حمادیہ میں اموی مسجد کے نواب سے حدیث پڑھائی، 'حدیث کے لیے وقف اور اسے عربی ترتیب میں ترتیب دیا'؛ d تقریباً 930 {حوالہ: شدارت ذہاب ص 571}۔"
  tr: "Şemseddin Muhammed bin Ahmed bin Abdullah, İbn al-Qiyal al-Hanbali olarak bilinir, ticarette ilerledi ve tüccar oldu, sonra hadislere yöneldi. Mevle Müwafaqeddin el-Misri'nin yanında eğitim aldı, Şeyh Nur al-Din Ali el-Makdisi el-Hanbali'den birçok kitap okudu ve Emevi Camii vekili olarak Hammediye'de ve başka yerlerde hadis çalıştı. Hadisle ilgilendi, onunla çalıştı, üstün ve koordinasyon sağladı; 893 Hicri'de vefat etti ve yaklaşık (930) {atıf:shadharat-dhahab, s. 571}"
  id: "Shams al-Din Muhammad ibn Ahmad ibn Abdullah, yang dikenal sebagai Ibn al-Qiyal al-Hanbali, berkembang dalam perdagangan hingga menjadi pedagang, lalu meninggalkannya untuk mengejar hadis. Ia belajar di bawah Mawla Muwafaq al-Din al-Misri, mempelajari banyak kitab di bawah Sheikh Nur al-Din Ali al-Maqdisi al-Hanbali, dan mempelajari hadits di Hammadiyya sebagai wakil Masjid Umayyah dan tempat lain. Ia tertarik pada hadis dan menguraikannya, unggul dan terkoordinasi; ia meninggal pada tahun 893 H, dan terdapat sekitar (930) {cite:shadharat-dhahab, hlm. 571}."
