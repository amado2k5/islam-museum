summary:
  ar: "مؤسس منظمة براك (27 أبريل 1936 – 20 ديسمبر 2019). كان مسؤولا ماليا في شركة شل للنفط، فباع شقته في لندن بعد حرب الاستقلال سنة 1971 وأسس براك سنة 1972، وبناها حتى صارت من أكبر منظمات التنمية في العالم، تعمل في التعليم والصحة والتمويل الأصغر وحقوق الإنسان في آسيا وأفريقيا. نال وسام الفروسية البريطاني سنة 2010، ومن جوائزه جائزة رامون ماغسيساي (1980) وجائزة الغذاء العالمية (2015) وجائزة ييدان (2019)."
  en: "Founder of BRAC (27 April 1936 – 20 December 2019). A former Shell Oil finance executive, he sold his London flat after the 1971 Liberation War and founded BRAC in 1972, building it into one of the world's largest development organisations, working in education, health, microfinance and human rights across Asia and Africa. Knighted (KCMG) in 2010, he received among many honours the Ramon Magsaysay Award (1980), the World Food Prize (2015) and the Yidan Prize (2019)."
  ur: "براک کے بانی (27 اپریل 1936ء – 20 دسمبر 2019ء)۔ وہ شیل آئل کے مالیاتی افسر تھے؛ 1971ء کی جنگ آزادی کے بعد انھوں نے لندن کا فلیٹ بیچ کر 1972ء میں براک قائم کیا اور اسے دنیا کی سب سے بڑی ترقیاتی تنظیموں میں سے ایک بنا دیا، جو ایشیا اور افریقا میں تعلیم، صحت، مائیکرو فنانس اور انسانی حقوق کے شعبوں میں کام کرتی ہے۔ انھیں 2010ء میں برطانوی نائٹ کا خطاب ملا؛ ان کے اعزازات میں ریمن میگسیس ایوارڈ (1980ء)، ورلڈ فوڈ پرائز (2015ء) اور ییدان پرائز (2019ء) شامل ہیں۔"
