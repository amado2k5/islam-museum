summary:
  ar: "سيد مختار البخاري (وُلد في 12 كانون الأول 1951 في ألور ستار بقدح) رجل أعمال ومحسن ماليزي من أصول حضرمية، بنى من تجارة الأرز إمبراطورية تضم إم إم سي ودي آر بي-هيكوم وبيرناس (برتون)، وأسس سنة 1996 مؤسسة البخاري الخيرية المعلنة قيامها على القيم الإسلامية، فأنشأت متحف الفنون الإسلامية بماليزيا سنة 1998 وجامعة البخاري الدولية، وبلغت تبرعاته أكثر من 500 مليون دولار بحلول 2013."
  en: "Syed Mokhtar Albukhary (born 12 December 1951 at Alor Setar, Kedah) is a Malaysian business tycoon and philanthropist of Hadrami descent who built from the rice trade an empire spanning MMC, DRB-HICOM and Bernas (Proton), and who in 1996 founded the Albukhary Foundation, a charity stated to be founded on Islamic values, which established the Islamic Arts Museum Malaysia in 1998 and Albukhary International University; his donations had exceeded US$500 million by 2013."
  ur: "سید مختار البخاری (پیدائش 12 دسمبر 1951، الور سیٹار، قدح) حضرمی نسل کے ملائیشیائی کاروباری و مخیر ہیں جنھوں نے چاول کی تجارت سے ایم ایم سی، ڈی آر بی-ہائیکوم اور برناس (پروٹون) پر مشتمل سلطنت بنائی، اور 1996 میں البخاری فاؤنڈیشن قائم کی — ایک خیراتی ادارہ جس کی بنیاد اسلامی اقدار پر بتائی جاتی ہے — جس نے 1998 میں اسلامی فنون کا عجائب گھر ملائیشیا اور البخاری بین الاقوامی یونیورسٹی قائم کیے؛ 2013 تک ان کے عطیات 500 ملین ڈالر سے تجاوز کر چکے تھے۔"
