label: { ar: "تميم بن زيد الأتبي", en: "Tamim ibn Zayd al-Utbi" }
summary:
  ar: "تميم بن زيد الأتبي؛ ولي السند بعد الجنيد فضعف ووهن وكان من أسخياء العرب وجد في بيت المال بالسند ثمانية عشر ألف ألف درهم طاطرية فأسرع فيها وكتب إليه الفرزدق في إقفال خنيس اليربوعي فلما أشكل عليه اسمه أمر بإقفال كل من كان اسمه على مثل تلك الحروف ومات قريباً من الديبل بماء الجواميس وفي أيامه خرج المسلمون عن بلاد الهند."
  en: "Tamim ibn Zayd al-Utbi; Sind's weak governor, of the Arabs' most generous — he scattered eighteen million Tatari dirhams and, unable to read whether Farazdaq's plea named Habish or Khanis, freed every slave so lettered; in his days the Muslims quit Hind's lands."
