label: { ar: "تميم بن زيد الأتبي", en: "Tamim ibn Zayd al-Utbi", es: "Tamim ibn Zayd al-Utbi", fr: "Tamim ibn Zayd al-Utbi", ur: "تمیم بن زید العتبی" }
summary:
  ar: "تميم بن زيد الأتبي؛ ولي السند بعد الجنيد فضعف ووهن وكان من أسخياء العرب وجد في بيت المال بالسند ثمانية عشر ألف ألف درهم طاطرية فأسرع فيها وكتب إليه الفرزدق في إقفال خنيس اليربوعي فلما أشكل عليه اسمه أمر بإقفال كل من كان اسمه على مثل تلك الحروف ومات قريباً من الديبل بماء الجواميس وفي أيامه خرج المسلمون عن بلاد الهند."
  en: "Tamim ibn Zayd al-Utbi; Sind's weak governor, of the Arabs' most generous — he scattered eighteen million Tatari dirhams and, unable to read whether Farazdaq's plea named Habish or Khanis, freed every slave so lettered; in his days the Muslims quit Hind's lands."
  es: "Tamim ibn Zayd al-Utbi, el débil gobernador de Sind, fue uno de los árabes más generosos: repartió dieciocho millones de dirhams tártaros y, sin poder leer si la súplica de Farazdaq mencionaba a Habish o a Khanis, liberó a todos los esclavos que sabían leer y escribir; en su época, los musulmanes abandonaron las tierras de Hind."
  fr: "Tamim ibn Zayd al-Utbi; gouverneur faible du Sind, l'un des plus généreux des Arabes — il distribua dix-huit millions de dirhams tatars et, incapable de lire si la requête de Farazdaq mentionnait Habish ou Khanis, il affranchit tous les esclaves ainsi lettrés; de son vivant, les musulmans quittèrent les terres de l'Inde."
  ur: "تمیم بن زید العتبی؛ سندھ کا کمزور گورنر، جو عربوں کا سب سے زیادہ سخی تھا - اس نے اٹھارہ ملین تاتاری درہم بکھرے اور، یہ پڑھنے سے قاصر تھا کہ فرازدق کی درخواست حبیش یا خانیوں کے نام کی گئی، ہر اس غلام کو آزاد کر دیا جس پر لکھا گیا تھا۔ ان کے دور میں مسلمانوں نے ہند کی سرزمینیں چھوڑ دیں۔"
