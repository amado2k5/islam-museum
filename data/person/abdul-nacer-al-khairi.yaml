summary:
  ar: "شيخ جزائري من مشايخ الطريقة الشاذلية، ينتسب إلى عبد السلام بن مشيش المغربي، وله أتباع في الجزائر وتونس والسعودية ومصر وماليزيا ودول أوروبية. يؤكد في منهجه على تلاوة القرآن وكثرة الصلاة على النبي، ويستقبل تلاميذ من شرائح مختلفة."
  en: "Algerian sheikh and a master of the Shadhili tariqa, of the lineage of Abd al-Salam ibn Mashish of Morocco, with a following in Algeria, Tunisia, Saudi Arabia, Egypt, Malaysia and several European countries. His teaching emphasises recitation of the Qur'an and abundant blessing on the Prophet, and his students come from all walks of life."
  ur: "الجزائر کے شیخ اور شاذلی طریقے کے مرشد، جن کا نسب مراکش کے عبدالسلام ابن ماشیش تک پہنچتا ہے، اور جن کے پیروکار الجزائر، تونس، سعودی عرب، مصر، ملائیشیا اور متعدد یورپی ممالک میں پھیلے ہیں۔ ان کی تعلیم تلاوتِ قرآن اور درود کی کثرت پر زور دیتی ہے اور ان کے شاگرد ہر طبقے سے آتے ہیں۔"
