summary:
  ar: "شيخ جزائري من مشايخ الطريقة الشاذلية، ينتسب إلى عبد السلام بن مشيش المغربي، وله أتباع في الجزائر وتونس والسعودية ومصر وماليزيا ودول أوروبية. يؤكد في منهجه على تلاوة القرآن وكثرة الصلاة على النبي، ويستقبل تلاميذ من شرائح مختلفة."
  en: "Algerian sheikh and a master of the Shadhili tariqa, of the lineage of Abd al-Salam ibn Mashish of Morocco, with a following in Algeria, Tunisia, Saudi Arabia, Egypt, Malaysia and several European countries. His teaching emphasises recitation of the Qur'an and abundant blessing on the Prophet, and his students come from all walks of life."
  fr: "Cheikh algérien et maître de la tariqa shadhilie, de la lignée d'Abd al-Salam ibn Mashish du Maroc, suivi en Algérie, en Tunisie, en Arabie saoudite, en Égypte, en Malaisie et dans plusieurs pays européens. Son enseignement insiste sur la récitation du Coran et l'abondance des prières sur le Prophète, et ses élèves viennent de tous les horizons."
  ur: "الجزائر کے شیخ اور شاذلی طریقے کے مرشد، جن کا نسب مراکش کے عبدالسلام ابن ماشیش تک پہنچتا ہے، اور جن کے پیروکار الجزائر، تونس، سعودی عرب، مصر، ملائیشیا اور متعدد یورپی ممالک میں پھیلے ہیں۔ ان کی تعلیم تلاوتِ قرآن اور درود کی کثرت پر زور دیتی ہے اور ان کے شاگرد ہر طبقے سے آتے ہیں۔"
  es: "Sheikh argelino y maestro de la tariqa Shadhili, del linaje de Abd al-Salam ibn Mashish de Marruecos, con seguidores en Argelia, Túnez, Arabia Saudita, Egipto, Malasia y varios países europeos. Su enseñanza hace hincapié en la recitación del Corán y en las abundantes bendiciones para el Profeta, y sus alumnos provienen de todos los ámbitos de la vida."
  tr: "Cezayirli Şazili Sufi tarikatına mensup bir şeyh olan bu kişi, soyunu Faslı Abdülselam ibn Meşiş'e kadar dayandırır ve Cezayir, Tunus, Suudi Arabistan, Mısır, Malezya ve çeşitli Avrupa ülkelerinde takipçileri bulunmaktadır. Öğretilerinde Kur'an okumaya ve Hz. Muhammed'e sık sık dua etmeye önem verir ve farklı geçmişlerden gelen öğrencileri memnuniyetle karşılar."
  id: "Seorang syekh Aljazair dari tarekat Sufi Shadhili, ia menelusuri garis keturunannya hingga Abd al-Salam ibn Mashish dari Maroko dan memiliki pengikut di Aljazair, Tunisia, Arab Saudi, Mesir, Malaysia, dan beberapa negara Eropa. Ajarannya menekankan pembacaan Al-Quran dan sering berdoa kepada Nabi Muhammad, dan ia menerima murid dari berbagai latar belakang."
