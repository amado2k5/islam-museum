summary:
  ar: "مترجم بريطاني للنصوص الإسلامية الكلاسيكية، حاصل على الدكتوراه من جامعة كامبريدج (1987) في ابن رشد فقيهاً. من ترجماته «الأحكام السلطانية» للماوردي (1996) و«القوانين الفقهية» لابن جزي، وقد درّس العربية والفقه في معهد فايمار وعمل إماماً وخطيباً في مسجد شترالسوند بألمانيا."
  en: "British translator of classical Islamic texts, with a Cambridge doctorate (1987) on Ibn Rushd as a jurist. His translations include al-Mawardi's Al-Ahkam as-Sultaniyyah (Ta-Ha, 1996), Ibn Juzayy's Al-Qawanin al-Fiqhiyyah (Diwan Press) and Shabistari's Secret Garden; he has taught Arabic and fiqh at the Weimar Institute and served as imam-khateeb at the mosque of Stralsund in Germany."
  ur: "برطانوی مترجمِ کلاسیکی اسلامی متون؛ کیمبرج سے 1987ء میں ابن رشد بحیثیت فقیہ پر ڈاکٹریٹ کی۔ ان کی ترجمہ شدہ کتابوں میں ماوردی کی «الاحکام السلطانیہ» (1996ء) اور ابن جزی کی «القوانین الفقہیہ» شامل ہیں؛ وایمار انسٹی ٹیوٹ میں عربی و فقہ کی تدریس کی اور جرمنی کے شٹرالسوند کی مسجد میں امام و خطیب رہے۔"
