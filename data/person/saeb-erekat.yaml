summary:
  ar: "صائب عريقات (28 أبريل 1955 – 10 نوفمبر 2020)، سياسي ودبلوماسي فلسطيني وُلد في أبو ديس ودرس في الولايات المتحدة وبريطانيا، وكان كبير المفاوضين الفلسطينيين مع إسرائيل منذ 1995، ووزيرا في السلطة الفلسطينية، وأمين سر اللجنة التنفيذية لمنظمة التحرير الفلسطينية من 2015 حتى وفاته بمرض كوفيد-19 في القدس، ودُفن في أريحا."
  en: "Saeb Erekat (28 April 1955 – 10 November 2020) was a Palestinian politician and diplomat born in Abu Dis and educated in the United States and Britain. He was the Palestinians' chief negotiator with Israel from 1995, a minister in the Palestinian Authority, and secretary general of the PLO Executive Committee from 2015 until his death from COVID-19 in Jerusalem; he was buried in Jericho."
  ur: "صائب عریقات (28 اپریل 1955ء – 10 نومبر 2020ء) فلسطینی سیاست دان اور سفارت کار تھے جو ابو دِس میں پیدا ہوئے اور امریکہ و برطانیہ میں تعلیم پائی۔ وہ 1995ء سے اسرائیل کے ساتھ فلسطینیوں کے چیف مذاکرات کار، فلسطینی اتھارٹی کے وزیر اور 2015ء سے وفات تک تنظیم آزادی فلسطین کی مجلس عاملہ کے سیکرٹری جنرل رہے۔"
