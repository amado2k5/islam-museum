id: person/mardawij-ibn-ziyad
class: person
label: { ar: "مرداويج بن زياد الديلمي" }
summary:
  ar: "مقدم الديلم، دخل أصحابه أصبهان سنة اثنتين وعشرين وكان من قواده علي بن بويه فانفرد عنه واستولى على فارس، وكان قد عظم أمره وتحدثوا أنه يريد قصد بغداد وأنه مسالم لصاحب المجوس وكان يقول أنا أرد دولة العجم وأمحق دولة العرب فمات بأصبهان في أيام الراضي {cite:tarikh-khulafa-minhaj-1434 p. 598,603}. وعند المسعودي بعثه أسفار بن شيرويه إلى سلار صاحب الطرم يأخذ عليه البيعة فتشاكيا ما نزل بالإسلام من أسفار فتحالفا عليه وراسل مرداويج قواده فأجابوه فاستولى على الجيش والخزائن وأحسن إلى الجند بما لم يكونوا يعرفونه من أسفار، فلما قتل أهل همذان ابن أخته أبا الكراديس بن علي الطلحي في جيشه سار فأعمل السيف فيها ثلاثة أيام وفي قول المقلل قتل أربعون ألفاً ثم أتى على الشيوخ والمستورين بعد الأمان، وأرسل ابن علان إلى الدينور فقتل سبعة عشر ألفاً وذبح ابن مشاد الزاهد بعد أن ضربه بمصحفه، وبلغ السبي خمسين ألفاً في قول المقلل ومائة ألف في قول المكثر، ثم نزل أصبهان في نحو خمسين ألفاً وعمرت له قصور آل أبي دلف وبساتينها {cite:muruj-al-dhahab p. 723-726}"
  en: "The Daylamite warlord whose men took Isfahan in 322; among his captains was Ali ibn Buya, who broke away and seized Fars. His power swelled — he was said to aim at Baghdad itself, friendly to the Magians, saying 'I shall restore the Persians' state and erase the Arabs'' — and he died at Isfahan under al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
  es: "El caudillo daylamita cuyos hombres tomaron Isfahán en 322; entre sus capitanes estaba Ali ibn Buya, quien se separó y se apoderó de Fars. Su poder creció exponencialmente —se decía que tenía como objetivo la propia Bagdad, aliada de los magos, diciendo: «Restauraré el estado de los persas y aniquilaré a los árabes»— y murió en Isfahán bajo el mando de al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
  fr: "Le chef de guerre daylamite dont les hommes prirent Ispahan en 322; parmi ses capitaines figurait Ali ibn Buya, qui fit sécession et s’empara du Fars. Son pouvoir s’accrut considérablement; on dit qu’il visait Bagdad même, alliée des Mages, déclarant: « Je restaurerai l’État perse et j’anéantirai les Arabes »; et il mourut à Ispahan sous le commandement d’al-Radi (voir: Tarikh-Khulafa-Minhaj-1434, p. 598, 603)."
  ur: "دیلامائٹ سپہ سالار جس کے آدمیوں نے 322 میں اصفہان پر قبضہ کیا؛ اس کے کپتانوں میں علی ابن بویا بھی تھا جس نے فارس پر قبضہ کر لیا۔ اس کی طاقت میں اضافہ ہوا - کہا جاتا تھا کہ اس کا ہدف بغداد ہی تھا، مجوسیوں کے ساتھ دوستانہ تھا، کہتا تھا کہ 'میں فارسیوں کی ریاست بحال کروں گا اور عربوں کو مٹا دوں گا' - اور اس کا انتقال الرادی کے تحت اصفہان میں ہوا۔ 598,603}۔"
  tr: "Daylam kabilesinin lideri yirmi iki yılında İsfahan'a girdi. Komutanlarından biri Ali ibn Buyah'tı; onu yalnız bırakıp Persleri ele geçirdi. Konumunu büyük ölçüde etkilemişti ve Bağdat'a gitmeyi planladığı, Magi'lerle barışçıl olduğu söylenirdi. 'Pers devletini yeniden kurmak ve Arap devletini yok etmek istiyorum.' dedi. El-Radi döneminde İsfahan'da öldü {atıf:Tarikh-khulafa-minhaj-1434, s. 598,603}. El-Mes'udi'de, Asfar bin Şiruvey onu Salar Sahib el-Taram'a itaat yemini etmesi için gönderdi. İslam'a vahyedilen kitaplardan şikayet ettiler, bu yüzden onunla ittifak kurdular ve komutanı Mardavic'e bir mektup gönderdiler; Mardavij karşılık vererek orduyu ve hazineleri ele geçirdi. Asfer, Asfar'dan bilmedikleri şeylerle askerlere iyi davrandı. Hamadhan halkı ordusunda yeğeni Ebu el-Karadis bin Ali el-Talhi'yi öldürdüğünde, üç gün boyunca yürüyüp kılıcı çekti. Al-Muqallāl'a göre kırk bin kişi öldürüldü, sonra şeyhlere ve sırrı güvende tutarak saldırdı. İbn Allān, el-Dinawār'a gönderdi ve on yedi bin kişiyi öldürdü, ardından keşiş İbn Meşhed'i Kur'anıyla vurduktan sonra katletti. Esaret el-Muqallâl'a göre elli bin, el-Muqallām'a göre yüz bin kişiye ulaştı. Sonra İsfahan yaklaşık elli bin kişiyle yerleşti ve Abi Dulf ailesinin sarayları ve bahçeleri onun için inşa edildi {alıntı: Muruj-al-Dhahab, s. 723-726}"
  id: "Pemimpin suku Daylam memasuki Isfahan pada tahun dua puluh dua. Salah satu komandannya adalah Ali ibn Buyah, yang meninggalkannya sendiri dan merebut Persia. Dia sangat memengaruhi posisinya, dan dikatakan bahwa dia berniat pergi ke Baghdad dan bersikap damai dengan para Majus. Dia berkata, 'Aku ingin mengembalikan negara Persia dan menghancurkan negara Arab.' Dia meninggal di Isfahan pada masa al-Radi {cite:Tarikh-khulafa-minhaj-1434, hlm. 598,603}. Di Al-Mas'udi, Asfar ibn Shiruwayh mengirimnya ke Salar Sahib al-Taram untuk mengambil sumpah setia darinya. Mereka mengeluhkan buku-buku yang didedahkan kepada Islam, sehingga mereka bersekutu dengannya dan mengirim surat kepada Mardavij, komandannya, yang merespons dan merebut pasukan serta harta karun. Dia memperlakukan para prajurit dengan baik dengan apa yang tidak mereka ketahui tentang Asfar. Ketika orang-orang Hamadhan membunuh keponakannya, Abu al-Karadis ibn Ali al-Talhi, dalam pasukannya, dia berbaris dan menghunus pedang selama tiga hari. Menurut al-Muqallāl, empat puluh ribu dibunuh, kemudian ia menyerang para sheikh dan rahasia demi keselamatan. Ibn Allān mengirim surat kepada al-Dinawār dan membunuh tujuh belas ribu serta membantai Ibn Mashhad si pertapa setelah memukulnya dengan Al-Qur'an. Jumlah penawanan mencapai lima puluh ribu menurut al-Muqallāl dan seratus ribu menurut al-Muqallām. Kemudian Isfahan menetup sekitar lima puluh ribu, dan istana serta taman keluarga Abi Dulf dibangun untuknya {cite:Muruj-al-Dhahab, hlm. 723-726}"
