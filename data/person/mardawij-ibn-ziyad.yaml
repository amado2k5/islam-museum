id: person/mardawij-ibn-ziyad
class: person
label: { ar: "مرداويج بن زياد الديلمي" }
summary:
  ar: "مقدم الديلم، دخل أصحابه أصبهان سنة اثنتين وعشرين وكان من قواده علي بن بويه فانفرد عنه واستولى على فارس، وكان قد عظم أمره وتحدثوا أنه يريد قصد بغداد وأنه مسالم لصاحب المجوس وكان يقول أنا أرد دولة العجم وأمحق دولة العرب فمات بأصبهان في أيام الراضي {cite:tarikh-khulafa-minhaj-1434 p. 598,603}. وعند المسعودي بعثه أسفار بن شيرويه إلى سلار صاحب الطرم يأخذ عليه البيعة فتشاكيا ما نزل بالإسلام من أسفار فتحالفا عليه وراسل مرداويج قواده فأجابوه فاستولى على الجيش والخزائن وأحسن إلى الجند بما لم يكونوا يعرفونه من أسفار، فلما قتل أهل همذان ابن أخته أبا الكراديس بن علي الطلحي في جيشه سار فأعمل السيف فيها ثلاثة أيام وفي قول المقلل قتل أربعون ألفاً ثم أتى على الشيوخ والمستورين بعد الأمان، وأرسل ابن علان إلى الدينور فقتل سبعة عشر ألفاً وذبح ابن مشاد الزاهد بعد أن ضربه بمصحفه، وبلغ السبي خمسين ألفاً في قول المقلل ومائة ألف في قول المكثر، ثم نزل أصبهان في نحو خمسين ألفاً وعمرت له قصور آل أبي دلف وبساتينها {cite:muruj-al-dhahab p. 723-726}"
  en: "The Daylamite warlord whose men took Isfahan in 322; among his captains was Ali ibn Buya, who broke away and seized Fars. His power swelled — he was said to aim at Baghdad itself, friendly to the Magians, saying 'I shall restore the Persians' state and erase the Arabs'' — and he died at Isfahan under al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
