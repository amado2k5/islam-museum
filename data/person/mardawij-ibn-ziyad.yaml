label: { ar: "مرداويج بن زياد الديلمي" }
summary:
  ar: "مقدم الديلم، دخل أصحابه أصبهان سنة اثنتين وعشرين وكان من قواده علي بن بويه فانفرد عنه واستولى على فارس، وكان قد عظم أمره وتحدثوا أنه يريد قصد بغداد وأنه مسالم لصاحب المجوس وكان يقول أنا أرد دولة العجم وأمحق دولة العرب فمات بأصبهان في أيام الراضي {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
  en: "The Daylamite warlord whose men took Isfahan in 322; among his captains was Ali ibn Buya, who broke away and seized Fars. His power swelled — he was said to aim at Baghdad itself, friendly to the Magians, saying 'I shall restore the Persians' state and erase the Arabs'' — and he died at Isfahan under al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
