id: person/ali-ibn-yadar
class: person
label:
  ar: علي بن يدر
  en: Ali ibn Yadar
summary:
  ar: "علي بن يدر من بني باداس من أهل قرابة الوزير أبي محمد بن يونس الهنتاتي؛ فر إلى السوس وجاهر بالخلاف سنة إحدى وخمسين وستمائة فنزل حصن تيونودين وشيده وحصنه وتغلب على حصن تيزخت، وأطاع له كثير من القبائل فاستوفى جبايتهم وأجلب على عامل الموحدين بتارودنت وضيق عليه المسالك، وقتل المرتضى الوزير ابن يونس لما اتهم بمداخلته سنة 652هـ، وهزم ابن يدر عسكر أبي محمد بن أصناك، ولما استولى بنو مرين على مراكش سنة 668هـ استبد وتملك سوس واستولى على تارودنت وإيفري وسائر أمصاره وقواعده ومعاقله وأرهف حده للأعراب فزحفوا إليه، وقتل سنة ثمان وستين وستمائة."
  en: "Ali ibn Yadar of Banu Badas, kin of the Hintati vizier Abu Muhammad ibn Yunus; he fled into the Sus in open defiance in 651, fortifying Tiyunudin, taking Tazakht, winning the tribes' tribute and besieging the Almohad governor of Taroudant — the caliph al-Murtada executing the vizier Ibn Yunus for complicity in 652 — and routed Ibn Asnak's army; when the Marinids took Marrakesh in 668 he seized Taroudant, Ifri and the whole Sus until killed that year."
