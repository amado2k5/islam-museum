summary:
  ar: "أبو السائب عتبة بن عبيد الله بن موسى الهمذاني ⁦(264–350هـ)⁩، قاضي القضاة ببغداد؛ غلب عليه في ابتداء أمره علم التصوف والميل إلى أهل الزهد، ثم خرج من بلده فلقي العلماء وعُني بفهم القرآن وكتب الحديث وتفقه على مذهب الشافعي، فقلّده الأمير أبو القاسم ابن أبي الساج الحكم بمراغة وجميع آذربيجان، ثم تقلد همذان، وعاد إلى بغداد فتقلد أعمالاً جليلة بالكوفة وديار مضر والأهواز وإمامة الجبل وقطعة من السواد، حتى ولي قضاء القضاة في رجب سنة ثمان وثلاثين وثلثمائة، وتوفي في ربيع الآخر سنة خمسين وثلثمائة ودفن في داره بسوق يحيى {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
  en: "Abu'l-Sa'ib 'Utba b. 'Ubayd Allah al-Hamadhani (264–350), chief qadi of Baghdad: drawn first to Sufism and the people of zuhd, he left home, met the scholars, occupied himself with understanding the Qur'an, wrote hadith and took Shafi'i fiqh; Ibn Abi'l-Saj made him judge of Maragha and all Azerbaijan, then Hamadan, then he held the great offices of Kufa, Diyar Mudar, Ahwaz and a share of the Sawad, until the chief qadiship in Rajab 338; he died Rabi' II 350 and was buried in his house at Suq Yahya {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
  fr: "Abu'l-Sa'ib 'Utba b. 'Ubayd Allah al-Hamadhani (264–350), grand cadi de Bagdad : attiré d'abord par le soufisme et les gens de l'ascèse, il quitta son pays, rencontra les savants, se consacra à la compréhension du Coran, écrivit le hadith et étudia le fiqh shafi'ite ; Ibn Abi'l-Saj le fit cadi de Maragha et de tout l'Azerbaïdjan, puis de Hamadhan, puis il occupa les grandes charges de Koufa, du Diyar Mudar, d'al-Ahwaz et d'une partie du Sawad, jusqu'au grand cadiat en Rajab 338 ; il mourut en Rabi' II 350 et fut enterré dans sa maison à Suq Yahya {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
  es: "Abu'l-Sa'ib 'Utba b. 'Ubayd Allah al-Hamadhani (264–350), cadí principal de Bagdad: atraído primero por el sufismo y la gente del zuhd, dejó su hogar, conoció a los eruditos, se dedicó a comprender el Corán, escribió hadices y tomó el fiqh shafi'i; Ibn Abi'l-Saj lo nombró juez de Maragha y de todo Azerbaiyán, luego de Hamadán, luego ocupó los altos cargos de Kufa, Diyar Mudar, Ahwaz y una parte del Sawad, hasta el cadí principal en Rajab 338; murió en Rabi' II 350 y fue enterrado en su casa en Suq Yahya {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
  ur: "ابو الصائب عتبہ بن۔ عبید اللہ الحمدانی (264-350)، بغداد کے چیف قاضی: سب سے پہلے تصوف اور اہل زہد کی طرف راغب ہوئے، وہ گھر سے نکلے، علماء سے ملے، قرآن کو سمجھنے میں مشغول رہے، حدیث لکھی اور شافعی فقہ حاصل کیا۔ ابن ابی السج نے اسے مراثہ اور تمام آذربائیجان کا قاضی بنایا، پھر ہمدان، پھر وہ کوفہ، دیار مدر، اہواز اور سواد کے ایک حصے کے بڑے عہدوں پر فائز رہے، یہاں تک کہ رجب 338 میں سردار قادیانیت؛ آپ کی وفات ربیع الثانی 350 میں ہوئی اور آپ کو سق یحییٰ میں اپنے گھر میں دفن کیا گیا۔"
  tr: "Abu al-Sa'ib 'Utbah ibn 'Ubayd Allah ibn Musa el-Hamadhani (H. 264–350), Bağdat Başyargıç; Hayatının başlarında tasavvuf bilgisine ve zühd sahibi insanlara olan eğilimine kapılmıştı. Daha sonra ülkesini terk ederek alimlerle görüştü, Kur'an'ı anlamaya özen gösterdi, hadisler yazdı ve Şafiî mezhebinin bir hukukçusu oldu. Bunun üzerine Emir Ebu el-Kâsım ibn Ebu el-Sac onu Maragheh ve tüm Azerbaycan'ı yönetmekle görevlendirdi. Daha sonra Hamadan'ı ele geçirdi ve Bağdat'a dönerek Kufa, Diyar-Mudar, Ahvaz, Dağ İmamlığı ve Sawad'ın bir bölümünde önemli görevler üstlendi. 338 yılının Receb ayında Başkadı oldu ve 350 yılının Rebiü'l-Ahir ayında vefat etti ve Yahya çarşısındaki evine defnedildi. {Kaynak: Muntazam ibn el-Cevzi, 7. cilt, 9-11}"
  id: "Abu al-Sa'ib 'Utbah ibn 'Ubayd Allah ibn Musa al-Hamadhani (264–350 H), Ketua Hakim Bagdad; Pada awal kehidupannya, ia didominasi oleh pengetahuan tentang Sufisme dan kecenderungan terhadap orang-orang yang hidup asketis. Kemudian, ia meninggalkan negaranya dan bertemu dengan para ulama, serta berupaya memahami Al-Qur'an, menulis Hadits, dan menjadi seorang ahli hukum dari mazhab Syafi'i. Maka, Emir Abu al-Qasim ibn Abi al-Saj menunjuknya untuk memerintah di Maragheh dan seluruh Azerbaijan. Setelah itu, ia mengambil alih Hamadan, dan kembali ke Baghdad, lalu menduduki posisi penting di Kufa, Diyar Mudar, Ahwaz, Imamah Gunung, dan sebagian Sawad, hingga ia menjadi Ketua Mahkamah Agung pada bulan Rajab tahun 338. Ia meninggal pada bulan Rabi' al-Akhir tahun 350 dan dimakamkan di rumahnya di pasar Yahya."
