summary:
  ar: "أبو السائب عتبة بن عبيد الله بن موسى الهمذاني (264–350هـ)، قاضي القضاة ببغداد؛ غلب عليه في ابتداء أمره علم التصوف والميل إلى أهل الزهد، ثم خرج من بلده فلقي العلماء وعُني بفهم القرآن وكتب الحديث وتفقه على مذهب الشافعي، فقلّده الأمير أبو القاسم ابن أبي الساج الحكم بمراغة وجميع آذربيجان، ثم تقلد همذان، وعاد إلى بغداد فتقلد أعمالاً جليلة بالكوفة وديار مضر والأهواز وإمامة الجبل وقطعة من السواد، حتى ولي قضاء القضاة في رجب سنة ثمان وثلاثين وثلثمائة، وتوفي في ربيع الآخر سنة خمسين وثلثمائة ودفن في داره بسوق يحيى {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
  en: "Abu'l-Sa'ib 'Utba b. 'Ubayd Allah al-Hamadhani (264–350), chief qadi of Baghdad: drawn first to Sufism and the people of zuhd, he left home, met the scholars, occupied himself with understanding the Qur'an, wrote hadith and took Shafi'i fiqh; Ibn Abi'l-Saj made him judge of Maragha and all Azerbaijan, then Hamadan, then he held the great offices of Kufa, Diyar Mudar, Ahwaz and a share of the Sawad, until the chief qadiship in Rajab 338; he died Rabi' II 350 and was buried in his house at Suq Yahya {cite:muntazam-ibn-al-jawzi j.7 p.9-11}."
