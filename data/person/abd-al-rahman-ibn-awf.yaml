summary:
  en: "One of the first band of eight; he accepted Islam at Abu Bakr's invitation during the secret call in Mecca. The Encyclopaedia of Islam calls him the most prominent early convert from Banu Zuhra, names his original name as Abd Amr or Abd al-Kaba, and reports that he emigrated to Abyssinia and Medina, fought at Badr and commanded a force of 700 men to Dumat al-Jandal. It adds that he became very wealthy as a merchant and was one of the six of the council that chose Uthman."
  ar: "أحد الثمانية الرعيل الأول؛ أسلم بدعوة أبي بكر الصديق في سنوات الدعوة السرية بمكة. وتصفه دائرة المعارف الإسلامية بأنه أبرز من أسلم مبكراً من بني زهرة، وتذكر أن اسمه الأصلي عبد عمرو أو عبد الكعبة، وأنه هاجر إلى الحبشة والمدينة وقاتل في بدر وقاد قوة من سبعمئة رجل إلى دومة الجندل. وتضيف أنه صار ثرياً جداً بالتجارة وكان أحد الستة في المجلس الذي اختار عثمان."
  ur: "ابتدائی آٹھ مسلمانوں میں شمار کیے جاتے ہیں؛ مکہ میں خفیہ دعوت کے دوران ابو بکر کی دعوت پر اسلام قبول کیا۔ {cite:mubarakpuri-raheeq} اسلامی انسائیکلوپیڈیا انھیں بنو زہرہ سے ابتدائی دور کے سب سے نمایاں مسلمان قرار دیتا ہے، ان کا اصل نام عبد عمرو یا عبد الکعبہ بتاتا ہے، اور لکھتا ہے کہ انھوں نے حبشہ اور مدینہ کی ہجرت کی، بدر میں لڑے اور سات سو آدمیوں کے لشکر کی قیادت کرتے ہوئے دومۃ الجندل گئے۔ مزید لکھا ہے کہ تجارت سے وہ بہت مالدار ہوئے اور عثمان کو چننے والی چھ رکنی مجلس میں شامل تھے۔"
