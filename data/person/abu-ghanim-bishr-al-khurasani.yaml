label:
  ar: "أبو غانم بشر بن غانم الخراساني"
  en: "Abu Ghanim Bishr b. Ghanim al-Khurasani"
  ur: "ابو غانم بشر بن غانم الخراسانی"
summary:
  ar: "أبو غانم بشر بن غانم الخراساني، فقيه إباضي من أواخر القرن الثاني/الثامن وأوائل الثالث/التاسع، صاحب المدونة، وهي أقدم مصنف إباضي في الفقه العام بحسب الموسوعة، حملها إلى الإمام الرستمي عبد الوهاب في تاهرت. {cite:encyclopaedia-of-islam-2 vol. 1 p. 139}"
  en: "Abu Ghanim Bishr b. Ghanim al-Khurasani, an Ibadi jurist of the end of the second/eighth and the beginning of the third/ninth century, from Khurasan, author of al-Mudawwana, which the encyclopaedia calls the oldest Ibadi treatise on general jurisprudence. {cite:encyclopaedia-of-islam-2 vol. 1 p. 139}"
  ur: "ابو غانم بشر بن غانم خراسانی، دوسری/آٹھویں صدی کے آخر اور تیسری/نویں صدی کے آغاز کے اباضی فقیہ، جو خراسان سے تھے، اور المدونہ کے مصنف ہیں، جسے موسوعہ عام فقہ پر اباضی کی سب سے قدیم کتاب قرار دیتی ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 139}"
