id: person/khayr-bak
class: person
label: { ar: "الأمير خاير بك", en: "Amir Khayr Bak", es: "Amir Khayr Bak", fr: "Amir Khayr Bak", ur: "امیر خضر بک" }
summary:
  ar: "أمير جركسي كبير عند قانصوه الغوري، في شذرات الذهب أن مكيدته كانت سبب انهزام عسكر الغوري بمرج دابق سنة اثنتين وعشرين وتسع مئة حيث مال في الوقعة إلى السلطان سليم {cite:shadharat-dhahab p. 531}. ويذكر الصلابي أنه كان من قيادات المماليك المقتنعة بالانضمام لجيش سليم، فأسند إليه سليم حكم مصر بعد فتحها {cite:dawlat-uthmaniyya-salabi p. 188}."
  en: "Circassian grand amir whose defection mid-battle broke al-Ghawri's army at Marj Dabiq in 922, per Shadharat {cite:shadharat-dhahab p. 531}. Al-Salabi counts him among the Mamluk commanders resolved to join Selim, who made him ruler of Egypt after its conquest {cite:dawlat-uthmaniyya-salabi p. 188}."
  es: "Gran emir circasiano cuya deserción en plena batalla desbarató el ejército de al-Ghawri en Marj Dabiq en 922, según Shadharat {cite:shadharat-dhahab p. 531}. Al-Salabi lo incluye entre los comandantes mamelucos que decidieron unirse a Selim, quien lo convirtió en gobernante de Egipto tras su conquista {cite:dawlat-uthmaniyya-salabi p. 188}."
  fr: "Grand émir circassien dont la défection en pleine bataille brisa l'armée d'al-Ghawri à Marj Dabiq en 922, selon Shadharat {cite:shadharat-dhahab p. 531}. Al-Salabi le compte parmi les commandants mamelouks résolus à rejoindre Selim, qui le nomma souverain d'Égypte après sa conquête {cite:dawlat-uthmaniyya-salabi p. 188}."
  ur: "سرکیسیان عظیم الشان امیر جس کے انحراف نے درمیانی جنگ میں الغاوری کی فوج کو 922 میں مرج دابق کے مقام پر توڑ دیا تھا، فی شدارت 531}۔ السلبی نے اسے مملوک کمانڈروں میں شمار کیا ہے جنہوں نے سلیم میں شامل ہونے کا عزم کیا، جنہوں نے اسے مصر کی فتح کے بعد حکمران بنایا۔ 188}۔"
