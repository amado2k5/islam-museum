summary:
  ar: "النمرود عند المفسرين والأخباريين ملك بابل الجبار الذي جادل إبراهيم في ربه «أنا أحيي وأميت» كما تقص البقرة، وهو الذي ألقى إبراهيم في النار كما في الأخبار، وأول من تاج في الدهر وظلم في ملكه؛ لا يذكره القرآن باسمه وإنما يذكره المفسرون تعييناً للمحاج {cite:tafsir-tabari-shakir-v01} {cite:qisas-anbiya-ibn-kathir}."
  en: "Namrud in the commentators and chroniclers is the tyrant king of Babylon who disputed with Ibrahim over his Lord — «I give life and I cause death» as al-Baqara recounts — and who cast him into the fire as the reports tell; the first to wear a crown in time and to tyrannise in his rule. The Qur'an does not name him; the commentators name him as the arguer {cite:tafsir-tabari-shakir-v01} {cite:qisas-anbiya-ibn-kathir}."
  ur: "نمرود مفسرین اور اخباریوں کے نزدیک بابل کا جابر بادشاہ ہے جس نے ابراہیم سے اس کے رب کے بارے میں جدال کیا — «میں زندہ کرتا ہوں اور مارتا ہوں» جیسا کہ بقرہ بیان کرتی ہے — اور جس نے اسے آگ میں ڈالا؛ وہ پہلا شخص تھا جس نے تاج پہنا اور اپنی سلطنت میں ظلم کیا؛ قرآن اس کا نام نہیں لیتا، مفسرین اسے متنازع کے طور پر پہچانتے ہیں۔"
  es: "Namrud, según los comentaristas y cronistas, es el rey tirano de Babilonia que disputó con Ibrahim sobre su Señor —«Yo doy la vida y yo causo la muerte», como relata al-Baqara— y que lo arrojó al fuego, según cuentan los relatos; el primero en llevar una corona y en tiránicamente en su reinado. El Corán no lo nombra; los comentaristas lo identifican como el que discute {cite:tafsir-tabari-shakir-v01} {cite:qisas-anbiya-ibn-kathir}."
  fr: "Namrud, selon les commentateurs et les chroniqueurs, est le roi tyran de Babylone qui se querella avec Ibrahim au sujet de son Seigneur – « Je donne la vie et je donne la mort », comme le rapporte al-Baqara – et qui, d'après les récits, le jeta dans le feu. Il fut le premier à porter une couronne et à exercer un règne tyrannique. Le Coran ne le nomme pas; les commentateurs l'identifient comme le protagoniste de la querelle."
