gender: male
roles: [mystic, transmitter]
summary:
  ar: "أحمد بن الغمر الحمصي، محفوظ من اللهو والزمر، مؤيد بالثبات والصبر، روى عن محمد بن المبارك الصوري حوارًا مع راهب في الأنس بالله وطريق الراحة، وفي علامات العلم والجهل والورع."
  en: "Ahmad ibn al-Ghamr al-Himsi, kept from idle play and music and strengthened with steadiness and patience; he related from Muhammad ibn al-Mubarak al-Suri an exchange with a monk on intimacy with God, the road to rest, and the signs of knowledge, ignorance and scruple."
  fr: "Ahmad ibn al-Ghamr al-Himsi, décrit comme préservé du jeu futile et de la musique, affermi par la constance et la patience ; il rapporta de Muhammad ibn al-Mubarak al-Suri un échange avec un moine sur l'intimité avec Dieu, la voie du repos et les signes du savoir, de l'ignorance et du scrupule."
  ur: "احمد بن الغمر حمصی کھیل اور گانے سے محفوظ اور ثابت قدمی و صبر سے مؤید تھے۔ انہوں نے محمد بن المبارک صوری سے ایک راہب کے ساتھ گفتگو روایت کی، جو اللہ کے انس، راحت کے راستے، اور علم، جہالت اور ورع کی نشانیوں پر تھی۔"
  es: "Ahmad ibn al-Ghamr al-Himsi, abstenido de juegos y música ociosos y fortalecido con constancia y paciencia, relató de Muhammad ibn al-Mubarak al-Suri un intercambio con un monje sobre la intimidad con Dios, el camino hacia el descanso y los signos del conocimiento, la ignorancia y el escrúpulo."
  tr: "Boş işlerden ve eğlenceden uzak duran, sebat ve sabırla desteklenen Ahmed ibn el-Ghamr el-Himsi, Muhammed ibn el-Mubarak el-Suri'den, bir keşişle Allah ile yakınlık, huzura giden yol, bilgi, cehalet ve takvanın işaretleri hakkında yaptığı bir diyaloğu rivayet etmiştir."
  id: "Ahmad ibn al-Ghamr al-Himsi, yang terlindungi dari kesenangan dan hiburan, serta didukung oleh keteguhan dan kesabaran, meriwayatkan dari Muhammad ibn al-Mubarak al-Suri sebuah dialog dengan seorang biarawan tentang keintiman dengan Tuhan dan jalan menuju kenyamanan, serta tentang tanda-tanda ilmu, kebodohan, dan ketakwaan."
