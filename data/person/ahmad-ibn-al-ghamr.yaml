  ar: "أحمد بن الغمر الحمصي، محفوظ من اللهو والزمر، مؤيد بالثبات والصبر، روى عن محمد بن المبارك الصوري حوارًا مع راهب في الأنس بالله وطريق الراحة، وفي علامات العلم والجهل والورع."
  en: "Ahmad ibn al-Ghamr al-Himsi, kept from idle play and music and strengthened with steadiness and patience; he related from Muhammad ibn al-Mubarak al-Suri an exchange with a monk on intimacy with God, the road to rest, and the signs of knowledge, ignorance and scruple."
