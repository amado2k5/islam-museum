names:
  - { value: "الموفق أسعد بن المطران الطبيب", kind: full }
summary:
  ar: "الموفق أسعد بن المطران الطبيب؛ كان نصرانياً فأسلم، وكان غزير المروءة حسن الأخلاق متعصباً للناس عند السلطان وكان يوالي أهل البيت، وكان يحب صبياً اسمه عمر فقال ابن عنين يهجو من رماه بالتشيع: «قالوا الموفق شيعي فقلت لهم هذا خلاف الذي للناس منه ظهر، وكيف يصيح دين الرفض مذهبه وما دعاه إلى الإسلام غير عمر»؛ وكان يعود المرضى من الفقراء ويحمل إليهم الأشربة من عنده والأدوية حتى أجرة الحمام، وكان مليح الصورة، ومات بدمشق ودفن بقاسيون على قارعة الطريق عنه دار زوجته واسمها جوزة وبقيت إلى جانب تربته مسجداً ويعرف بدار جوزة؛ توفي سنة سبع وثمانين وخمسمائة {cite:shadharat-dhahab p. 768-769}."
  en: "Al-Muwaffaq As'ad b. al-Matran the physician, a Christian who embraced Islam; abundant in chivalry, fine of character, an intercessor for people with the sultan, loyal to the Prophet's house — he loved a lad named Umar, so Ibn Unayn lampooned those who called him a Shi'i: 'How could the Rafidi creed be his madhhab, when none but Umar called him to Islam?'; he visited the sick among the poor, carrying them syrups and medicines, even bath fees, and was handsome to look at. He died at Damascus and was buried at Qasyun by the roadside, by the house of his wife Jawza, who kept a mosque beside his tomb — still called Dar Jawza; he died in 587 {cite:shadharat-dhahab p. 768-769}."
