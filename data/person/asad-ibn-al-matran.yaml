summary:
  ar: "الموفق أسعد بن المطران الطبيب؛ كان نصرانياً فأسلم، وكان غزير المروءة حسن الأخلاق متعصباً للناس عند السلطان وكان يوالي أهل البيت، وكان يحب صبياً اسمه عمر فقال ابن عنين يهجو من رماه بالتشيع: «قالوا الموفق شيعي فقلت لهم هذا خلاف الذي للناس منه ظهر، وكيف يصيح دين الرفض مذهبه وما دعاه إلى الإسلام غير عمر»؛ وكان يعود المرضى من الفقراء ويحمل إليهم الأشربة من عنده والأدوية حتى أجرة الحمام، وكان مليح الصورة، ومات بدمشق ودفن بقاسيون على قارعة الطريق عنه دار زوجته واسمها جوزة وبقيت إلى جانب تربته مسجداً ويعرف بدار جوزة؛ توفي سنة سبع وثمانين وخمسمائة {cite:shadharat-dhahab p. 768-769}."
  en: "Al-Muwaffaq As'ad b. al-Matran the physician, a Christian who embraced Islam; abundant in chivalry, fine of character, an intercessor for people with the sultan, loyal to the Prophet's house — he loved a lad named Umar, so Ibn Unayn lampooned those who called him a Shi'i: 'How could the Rafidi creed be his madhhab, when none but Umar called him to Islam?'; he visited the sick among the poor, carrying them syrups and medicines, even bath fees, and was handsome to look at. He died at Damascus and was buried at Qasyun by the roadside, by the house of his wife Jawza, who kept a mosque beside his tomb — still called Dar Jawza; he died in 587 {cite:shadharat-dhahab p. 768-769}."
  es: "Al-Muwaffaq As'ad b. al-Matran, el médico, cristiano convertido al Islam, era caballeroso, de carácter noble, intercesor ante el sultán y leal a la casa del Profeta. Amaba a un joven llamado Umar, por lo que Ibn Unayn satirizó a quienes lo llamaban chií: \"¿Cómo podía ser su escuela rafidí su madhhab, si nadie más que Umar lo llamó al Islam?\". Visitaba a los enfermos pobres, llevándoles jarabes y medicinas, incluso el dinero para el baño, y era de aspecto apuesto. Murió en Damasco y fue enterrado en Qasyun, junto al camino, en la casa de su esposa Jawza, quien mantenía una mezquita al lado de su tumba, todavía llamada Dar Jawza. Murió en 587 {cita: shadharat-dhahab págs. 768-769}."
  fr: "Al-Muwaffaq As'ad b. al-Matran, médecin et chrétien converti à l'islam, était un homme d'une grande chevalerie, d'un caractère exemplaire, intercédant auprès du sultan pour le peuple et fidèle à la famille du Prophète. Il aimait un jeune homme nommé Umar, ce qui valut à Ibn Unayn de railler ceux qui le qualifiaient de chiite: « Comment la doctrine rafidite pouvait-elle être son madhhab, alors que seul Umar l'avait appelé à l'islam ? » Il visitait les malades parmi les pauvres, leur apportant sirops et médicaments, et même de quoi payer leurs bains. Il était d'une grande beauté. Il mourut à Damas et fut enterré à Qasyun, au bord de la route, près de la maison de son épouse Jawza, qui entretenait une mosquée à proximité de sa tombe – toujours appelée Dar Jawza. Il mourut en 587 av. J.-C. (Voir: Hadharat-Dhahab, p. 768-769)."
  ur: "الموفق اسد ب۔ المطران طبیب، ایک عیسائی جس نے اسلام قبول کیا؛ نفاست سے مالا مال، حسن اخلاق، سلطان کے ساتھ لوگوں کے لیے شفاعت کرنے والا، رسول کے گھر سے وفادار - وہ عمر نامی لڑکے سے محبت کرتا تھا، اس لیے ابن عنین نے اسے شیعہ کہنے والوں کو گالیاں دیتے ہوئے کہا: رافضی عقیدہ اس کا مذہب کیسے ہوسکتا ہے جب کہ عمر کے علاوہ کسی نے اسے اسلام کی دعوت نہیں دی؟ وہ غریبوں میں سے بیماروں کی عیادت کرتا، ان کے لیے شربت اور دوائیاں، حتیٰ کہ نہانے کی فیس لے کر جاتا، اور دیکھنے میں خوبصورت تھا۔ اس کی موت دمشق میں ہوئی اور اسے قصیون میں سڑک کے کنارے، اس کی بیوی جوزا کے گھر کے پاس دفن کیا گیا، جس نے اس کے مقبرے کے پاس ایک مسجد رکھی تھی - جسے اب بھی دار جوزا کہا جاتا ہے۔ ان کی وفات 587 میں ہوئی۔ 768-769}۔"
