id: person/yahya-ibn-umar-munqari-zadah
class: person
label: { ar: "يحيى بن عمر منقاري زاده", en: "Yahya ibn Umar Munqari-zadah", es: "Yahya ibn Umar Munqari-zadah", fr: "Yahya ibn Umar Munqari-zadah" }
summary:
  ar: "يحيى بن عمر، العلائي الرومي، المعروف بمنقاري زاده، مفسر مشارك في بعض العلوم، وقاض تركي، تصانيفه بالعربية، ينعت بشيخ الإسلام. أخذ فنون العلم بالروم عن أكابر علمائها، ومنهم عبد الرحيم المفتي. عُيّن قاضيا لمصر سنة 1064 هـ، ثم قاضيا لمكة، ودرّس في المدرسة السليمانية تفسير البيضاوي، ثم ولي قضاء القسطنطينية وقضاء العسكر، ونُقل إلى منصب الفتوى سنة 1073 هـ. من تصانيفه «حاشية على أنوار التنزيل» للبيضاوي و«رسالة الاتباع في مسألة الاستماع» و«الرسالة المنيرة لأهل البصيرة» و«الفتاوى». ويذكر الكتاب وفاته سنة 1088 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
  en: "Yahya ibn Umar al-Ala'i al-Rumi, known as Munqari-zadah, a Turkish judge and exegete with some other learning, who wrote in Arabic and was styled Shaykh al-Islam. He studied the sciences in Anatolia with its senior scholars, among them Abd al-Rahim al-Mufti. He was appointed judge of Egypt in 1064 AH, then judge of Mecca, where he taught the commentary of al-Baydawi at the Sulaymaniyya madrasa. Later he held the judgeship of Constantinople and of the army, and in 1073 AH he was moved to the post of mufti. His works include a gloss on al-Baydawi's Anwar al-tanzil and treatises on listening and on the clear epistle. The book gives his death as 1088 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
  es: "Yahya ibn Umar al-Ala'i al-Rumi, conocido como Munqari-zadah, fue un juez y exegeta turco con diversos conocimientos, que escribió en árabe y fue llamado Shaykh al-Islam. Estudió ciencias en Anatolia con sus eruditos más destacados, entre ellos Abd al-Rahim al-Mufti. Fue nombrado juez de Egipto en 1064 AH, y posteriormente juez de La Meca, donde impartió el comentario de al-Baydawi en la madrasa Sulaymaniyya. Más tarde, ocupó cargos como juez de Constantinopla y del ejército, y en 1073 AH fue nombrado muftí. Entre sus obras se incluyen una glosa sobre el Anwar al-tanzil de al-Baydawi y tratados sobre la escucha y la epístola clara. El libro indica que falleció en 1088 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
  fr: "Yahya ibn Umar al-Ala'i al-Rumi, dit Munqari-zadah, était un juge et exégète turc, également érudit, qui écrivait en arabe et portait le titre de Cheikh al-Islam. Il étudia les sciences en Anatolie auprès des plus grands savants, parmi lesquels Abd al-Rahim al-Mufti. Nommé juge d'Égypte en 1064 AH, puis juge de La Mecque, il y enseigna le commentaire d'al-Baydawi à la madrasa Sulaymaniyya. Il exerça ensuite les fonctions de juge de Constantinople et de juge militaire, et fut nommé mufti en 1073 AH. Parmi ses œuvres figurent une glose sur l'Anwar al-tanzil d'al-Baydawi et des traités sur l'écoute et sur l'épître claire. L'ouvrage indique sa mort en 1088 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
