id: person/yahya-ibn-umar-munqari-zadah
class: person
label: { ar: "يحيى بن عمر منقاري زاده", en: "Yahya ibn Umar Munqari-zadah" }
summary:
  ar: "يحيى بن عمر، العلائي الرومي، المعروف بمنقاري زاده، مفسر مشارك في بعض العلوم، وقاض تركي، تصانيفه بالعربية، ينعت بشيخ الإسلام. أخذ فنون العلم بالروم عن أكابر علمائها، ومنهم عبد الرحيم المفتي. عُيّن قاضيا لمصر سنة 1064 هـ، ثم قاضيا لمكة، ودرّس في المدرسة السليمانية تفسير البيضاوي، ثم ولي قضاء القسطنطينية وقضاء العسكر، ونُقل إلى منصب الفتوى سنة 1073 هـ. من تصانيفه «حاشية على أنوار التنزيل» للبيضاوي و«رسالة الاتباع في مسألة الاستماع» و«الرسالة المنيرة لأهل البصيرة» و«الفتاوى». ويذكر الكتاب وفاته سنة 1088 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
  en: "Yahya ibn Umar al-Ala'i al-Rumi, known as Munqari-zadah, a Turkish judge and exegete with some other learning, who wrote in Arabic and was styled Shaykh al-Islam. He studied the sciences in Anatolia with its senior scholars, among them Abd al-Rahim al-Mufti. He was appointed judge of Egypt in 1064 AH, then judge of Mecca, where he taught the commentary of al-Baydawi at the Sulaymaniyya madrasa. Later he held the judgeship of Constantinople and of the army, and in 1073 AH he was moved to the post of mufti. His works include a gloss on al-Baydawi's Anwar al-tanzil and treatises on listening and on the clear epistle. The book gives his death as 1088 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6812}"
