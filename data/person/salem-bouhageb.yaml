summary:
  ar: "مصلح وفقيه وشاعر تونسي (1827–1924)، وُلد ببنبلة وتعلّم بجامع الزيتونة، ودرّس نحو سبعين عامًا بالزيتونة والخلدونية وكان من تلامذته بشير صفر وعبد العزيز الثعالبي ومحمد النخلي ومحمد الطاهر بن عاشور. عاون خير الدين باشا، وشارك في تأسيس بلدية تونس سنة 1857 والمدرسة الصادقية سنة 1875، وفي أعمال العهد الأساسي وقانون الالتزامات والعقود سنة 1906، وانتهى إلى خطة باش مفتي المالكية؛ وجدد مضامين خطبة الجمعة فعُدّ رائد الاجتهاد في تونس."
  en: "Tunisian reformer, jurist and poet (1827–1924), born at Bembla and formed at the Zaytuna, who taught for some seventy years at the Zaytuna and the Khaldounia and numbered Béchir Sfar, Abdelaziz Thâalbi, Mohamed Nakhli and Mohamed Tahar Ben Achour among his students. A close collaborator of Kheireddine Pacha, he helped found the municipality of Tunis in 1857 and Sadiki College in 1875, worked on the application of the Fundamental Pact and on the 1906 Code of Obligations and Contracts, and ended his career as the country's chief Maliki mufti; the Friday sermons he renewed in content made him a pioneer of ijtihad in Tunisia."
  ur: "تونسی مصلح، فقیہ اور شاعر (1827–1924)، جو بنبلة میں پیدا ہوئے اور جامع زیتونہ میں تعلیم پائی؛ تقریباً ستر سال زیتونہ اور خلدونیہ میں تدریس کی اور ان کے شاگردوں میں بشیر صفر، عبدالعزیز ثعلبی، محمد النخلی اور محمد طاہر بن عاشور شامل تھے۔ خیرالدین پاشا کے قریبی ساتھی کی حیثیت سے انہوں نے 1857ء میں تونس کی بلدیہ اور 1875ء میں صادقی کالج کے قیام میں حصہ لیا، عہدِ اساسی اور 1906ء کے قانونِ التزامات پر کام کیا، اور اپنے عہد کا اختتام ملک کے باش مفتیِ مالکیہ کے منصب پر کیا؛ انہوں نے جمعہ کے خطبوں کے مضامین کی تجدید کی اور تونس میں اجتہاد کے بانی سمجھے جاتے ہیں۔"
