summary:
  ar: "شاعرة وكاتبة مسرحية ومترجمة أدبية إيرانية أمريكية، وُلدت في طهران سنة 1962. عُرفت بترجماتها الإنجليزية لشعر فروغ فرخزاد وعطار النيسابوري، وبمجموعاتها الشعرية ومسرحياتها، وهي الكاتبة المقيمة في جامعة كاليفورنيا في إرفاين."
  en: "Iranian-American poet, playwright and literary translator, born in Tehran in 1962. Known for her English translations of Forugh Farrokhzad and Attar of Nishapur and for her own poetry collections and plays, she is Writer-in-Residence at the University of California, Irvine."
