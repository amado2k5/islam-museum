  ur: "1747 میں نادر شاہ کے بعد ایران کے حکمران عادل شاہ افشارد کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "1747'de Nadir Şah'ın yerine geçen İran Şahı Adil Şah Afşar'ın ön profili, açık bir referans açıklamasında (Wikidata) yer almaktadır. Hasan İbrahim'in İslam Tarihi'ndeki biyografisi henüz bu sayfada incelenmediğinden, burada tarih verilmemiştir."
  id: "Profil awal Adil Shah Afshar, Shah Iran yang menggantikan Nader Shah pada tahun 1747, disertakan dalam deskripsi referensi terbuka (Wikidata). Biografinya dalam Sejarah Islam karya Hassan Ibrahim belum ditinjau di halaman ini, oleh karena itu tidak ada tanggal yang diberikan di sini."
