summary:
  ar: "مولاي الحسن بن محمد ⁦(وُلد في ٨ أيار ٢٠٠٣ في القصر الملكي بالرباط)⁩ ولي عهد المملكة المغربية والابن الأكبر للملك محمد السادس والأميرة سلمى بناني؛ درس في المدرسة المولوية وجامعة محمد السادس متعددة التخصصات حيث نال الماجستير سنة ٢٠٢٥، ويحمل رتبة عقيد ركن في القوات المسلحة الملكية، ويمثل والده في مهام رسمية منذ سنة ٢٠١٣."
  en: "Moulay Hassan bin Mohammed (born 8 May 2003 at the Royal Palace in Rabat) is the Crown Prince of Morocco, the elder child of King Mohammed VI and Princess Lalla Salma; educated at the Royal College and Mohammed VI Polytechnic University, where he took a master's degree in 2025, he holds the rank of Colonel-Major in the Royal Armed Forces and has represented his father at official engagements since 2013."
  ur: "مولای حسن بن محمد (پیدائش 8 مئی 2003، شاہی محل، رباط) مراکش کے ولی عہد اور شاہ محمد ششم و شہزادی للا سلمیٰ کے بڑے بیٹے ہیں؛ انھوں نے رائل کالج اور محمد ششم پولی ٹیکنک یونیورسٹی سے تعلیم پائی، 2025 میں ماسٹرز کیا، شاہی مسلح افواج میں کرنل میجر کا عہدہ رکھتے ہیں، اور 2013 سے سرکاری تقاریب میں والد کی نمائندگی کر رہے ہیں۔"
