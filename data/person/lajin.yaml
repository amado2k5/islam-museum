summary:
  ar: "سلطان مملوكي، وثب على السلطنة والسلطان بدمشق سنة ست وتسعين وحلف له الأمراء ولم يختلف عليه اثنان وخلع عليه الخليفة الخلعة السوداء وكتب له تقليداً ثم قتل في جمادى الآخرة سنة ثمان وتسعين فأعيد الملك الناصر {cite:tarikh-khulafa-minhaj-1434 p. 731}؛ وفي رواية شذرات الذهب: وثب على بيحاص وبكتوت الأزرق باللجون فقتلهما فزال ملك العادل كتبغا، وقُتل على يد كرجي الأشرفي وهو يلعب بالشطرنج {cite:shadharat-dhahab p. 758, 769}."
  en: "Usurper-sultan of 696–698, robed and deeded by the caliph, killed in Jumada II — al-Nasir restored {cite:tarikh-khulafa-minhaj-1434 p. 731}."
