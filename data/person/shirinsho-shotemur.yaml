summary:
  ar: "سياسي طاجيكي سوفيتي (1899–1937)، ومن مؤسسي طاجيكستان السوفيتية؛ كان من أطلق قيام جمهورية طاجيكستان الاشتراكية السوفيتية ذاتية الحكم سنة 1924 وانفصال جمهورية طاجيكستان الاشتراكية السوفيتية عن جمهورية أوزبكستان سنة 1929، ورئيس اللجنة التنفيذية المركزية لجمهورية طاجيكستان من سنة 1933؛ أُعدم في موسكو في التطهير الكبير، وأُعيد اعتباره سنة 1956، وسُمّي بطل طاجيكستان بعد وفاته سنة 2006."
  en: "Tajik Soviet politician (1899–1937) and one of the founders of Soviet Tajikistan: a Communist Party official from 1921, he was a main initiator of the Tajik ASSR in 1924 and of the Tajik SSR's separation from the Uzbek SSR in 1929, and chairman of the Central Executive Committee of the Tajik SSR from 1933; executed in Moscow in the Great Purge, rehabilitated in 1956 and posthumously named a Hero of Tajikistan in 2006."
  ur: "تاجک سوویت سیاست دان (1899ء–1937ء) اور سوویت تاجکستان کے بانیوں میں سے ایک؛ 1921ء سے کمیونسٹ پارٹی کے عہدے دار، وہ 1924ء میں تاجک خودمختار سوویت اشتراکی جمہوریہ کے قیام اور 1929ء میں تاجک سوویت اشتراکی جمہوریہ کی ازبک جمہوریہ سے علیحدگی کے اہم محرک تھے، اور 1933ء سے تاجک جمہوریہ کی مرکزی ایگزیکٹو کمیٹی کے چیئرمین رہے؛ عظیم تطہیر میں ماسکو میں پھانسی دی گئی، 1956ء میں بحالِ عزت ہوئے اور 2006ء میں بعد از مرگ تاجکستان کے ہیرو قرار پائے۔"
