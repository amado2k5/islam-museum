label: { ar: "شيرينشو شوتمور", en: "Shirinsho Shotemur", ur: "شیرینشو شوتمور", es: "Shirinsho Shotemur", fr: "Shirinsho Shotemur" }
summary:
  ar: "سياسي طاجيكي سوفيتي (1899–1937)، ومن مؤسسي طاجيكستان السوفيتية؛ كان من أطلق قيام جمهورية طاجيكستان الاشتراكية السوفيتية ذاتية الحكم سنة 1924 وانفصال جمهورية طاجيكستان الاشتراكية السوفيتية عن جمهورية أوزبكستان سنة 1929، ورئيس اللجنة التنفيذية المركزية لجمهورية طاجيكستان من سنة 1933؛ أُعدم في موسكو في التطهير الكبير، وأُعيد اعتباره سنة 1956، وسُمّي بطل طاجيكستان بعد وفاته سنة 2006."
  en: "Tajik Soviet politician (1899–1937) and one of the founders of Soviet Tajikistan: a Communist Party official from 1921, he was a main initiator of the Tajik ASSR in 1924 and of the Tajik SSR's separation from the Uzbek SSR in 1929, and chairman of the Central Executive Committee of the Tajik SSR from 1933; executed in Moscow in the Great Purge, rehabilitated in 1956 and posthumously named a Hero of Tajikistan in 2006."
  ur: "تاجک سوویت سیاست دان ⁦(1899ء–1937ء)⁩ اور سوویت تاجکستان کے بانیوں میں سے ایک؛ 1921ء سے کمیونسٹ پارٹی کے عہدے دار، وہ 1924ء میں تاجک خودمختار سوویت اشتراکی جمہوریہ کے قیام اور 1929ء میں تاجک سوویت اشتراکی جمہوریہ کی ازبک جمہوریہ سے علیحدگی کے اہم محرک تھے، اور 1933ء سے تاجک جمہوریہ کی مرکزی ایگزیکٹو کمیٹی کے چیئرمین رہے؛ عظیم تطہیر میں ماسکو میں پھانسی دی گئی، 1956ء میں بحالِ عزت ہوئے اور 2006ء میں بعد از مرگ تاجکستان کے ہیرو قرار پائے۔"
  es: "Político soviético tayiko (1899-1937) y uno de los fundadores del Tayikistán soviético: funcionario del Partido Comunista desde 1921, fue uno de los principales impulsores de la RASS de Tayikistán en 1924 y de la separación de la RSS de Tayikistán de la RSS de Uzbekistán en 1929, y presidente del Comité Ejecutivo Central de la RSS de Tayikistán desde 1933; ejecutado en Moscú durante la Gran Purga, rehabilitado en 1956 y nombrado póstumamente Héroe de Tayikistán en 2006."
  fr: "Homme politique soviétique tadjik (1899-1937) et l'un des fondateurs du Tadjikistan soviétique: responsable du Parti communiste à partir de 1921, il fut l'un des principaux instigateurs de la RSSA tadjike en 1924 et de la séparation de la RSS tadjike de la RSS ouzbèke en 1929, et président du Comité exécutif central de la RSS tadjike à partir de 1933; exécuté à Moscou lors des Grandes Purges, réhabilité en 1956 et nommé à titre posthume Héros du Tadjikistan en 2006."
  tr: "Sovyet Tacik siyasetçisi (1899–1937) ve Sovyet Tacikistan'ın kurucularından biri; 1924'te Tacikistan Sovyet Sosyalist Özerk Cumhuriyeti'nin kurulmasının ve 1929'da Tacikistan Sovyet Sosyalist Cumhuriyeti'nin Özbekistan Cumhuriyeti'nden ayrılmasının öncüsüydü. 1933'ten itibaren Tacikistan Cumhuriyeti Merkez Yürütme Komitesi Başkanıydı; Büyük Temizlik sırasında Moskova'da idam edildi, 1956'da yeniden göreve getirildi ve 2006'da ölümünden sonra Tacikistan Kahramanı unvanına layık görüldü."
  id: "Seorang politikus Soviet Tajik (1899–1937), dan salah satu pendiri Soviet Tajikistan; ia adalah inisiator pendirian Republik Sosialis Otonom Soviet Tajikistan pada tahun 1924 dan pemisahan Republik Sosialis Soviet Tajikistan dari Republik Uzbekistan pada tahun 1929. Ia menjadi Ketua Komite Eksekutif Pusat Republik Tajikistan sejak tahun 1933; ia dieksekusi di Moskow selama Pembersihan Besar, diangkat kembali pada tahun 1956, dan secara anumerta dinobatkan sebagai Pahlawan Tajikistan pada tahun 2006."
