summary:
  ar: "فقيه شافعي ومدرّس في القاهرة، يعرّف به أبو إسحاق الحويني بأنه صاحب «تكملة المجموع» على «المجموع شرح المهذب» للنووي، وكان يدرّس في العباسية صحيح البخاري و«إحياء علوم الدين» و«الأشباه والنظائر» و«المجموع»، وحضر الحويني دروسه طالبًا ثم هاجر المطيعي إلى السودان بعد أحداث زمن السادات، بحسب رواية الحويني."
  en: "Shafi'i jurist and teacher in Cairo whom Abu Ishaq al-Heweny introduces as the author of the completion (Takmila) of al-Nawawi's «al-Majmu' Sharh al-Muhadhdhab»; he taught Sahih al-Bukhari, «Ihya' Ulum al-Din», «al-Ashbah wa-l-Naza'ir» and «al-Majmu'» in Abbasiyya, where al-Heweny attended his lessons as a student, before emigrating to Sudan after the events of Sadat's time, according to al-Heweny's account."
  ur: "قاہرہ کے شافعی فقیہ اور مدرس، جنہیں ابو اسحاق حوینی نووی کی «المجموع شرح المهذب» کے تکملے کا مصنف بتاتے ہیں؛ وہ عباسیہ میں صحیح بخاری، «إحیاء علوم الدین»، «الأشباه والنظائر» اور «المجموع» پڑھاتے تھے، جہاں حوینی طالب علمی میں ان کے دروس میں شریک ہوئے، پھر حوینی کے بیان کے مطابق سادات کے دور کے واقعات کے بعد وہ سوڈان ہجرت کر گئے۔"
  es: "Jurista y maestro shafi'í en El Cairo, a quien Abu Ishaq al-Heweny presenta como el autor de la culminación (Takmila) de «al-Majmu' Sharh al-Muhadhdhab» de al-Nawawi; enseñó Sahih al-Bukhari, «Ihya' Ulum al-Din», «al-Ashbah wa-l-Naza'ir» y «al-Majmu'» en Abbasiyya, donde al-Heweny asistió a sus lecciones como estudiante, antes de emigrar a Sudán después de los acontecimientos de la época de Sadat, según el relato de al-Heweny."
  fr: "Juriste et enseignant chaféite du Caire, présenté par Abu Ishaq al-Heweny comme l'auteur de la complétion (Takmila) de « al-Majmu' Sharh al-Muhadhdhab » d'al-Nawawi; il enseigna le Sahih al-Bukhari, « Ihya' Ulum al-Din », « al-Ashbah wa-l-Naza'ir » et « al-Majmu' » à Abbasiyya, où al-Heweny suivit ses cours en tant qu'étudiant, avant d'émigrer au Soudan après les événements de l'époque de Sadate, selon le récit d'al-Heweny."
  tr: "Kahire'de bir Şafii hukukçusu ve öğretmendi; el-Nevavi'nin 'Takmilat al-Majmu' üzerine 'Takmilat al-Majmu' adlı eserinin yazarı olarak Abu İshaq al-Huwaini olarak bilinir. Sahih al-Bukhari, 'İhya' 'Ulum al-Din', 'Ashbah wa al-Naza'ir ve 'al-Majmu' derslerini Abbasiyye'de öğretti. Al-Huwaini, Sedat dönemindeki olaylardan sonra al-Muti'i Sudan'a göç etti, anlatımına göre."
  id: "Ia adalah seorang ahli hukum dan guru Shafi'i di Kairo, dikenal sebagai Abu Ishaq al-Huwaini sebagai penulis 'Takmilat al-Majmu' tentang al-Majmu' Sharh al-Muhadhdhab' karya al-Nawawi. Ia mengajar Sahih al-Bukhari, 'Ihya' 'Ulum al-Din', 'Ashbah wa al-Naza'ir', dan 'al-Majmu' dalam Abbasiyya. Al-Huwaini mengikuti pelajarannya sebagai murid, kemudian al-Muti'i bermigrasi ke Sudan setelah peristiwa di era Sadat, menurut catatan al-Huwaini."
