summary:
  ar: "فقيه شافعي ومدرّس في القاهرة، يعرّف به أبو إسحاق الحويني بأنه صاحب «تكملة المجموع» على «المجموع شرح المهذب» للنووي، وكان يدرّس في العباسية صحيح البخاري و«إحياء علوم الدين» و«الأشباه والنظائر» و«المجموع»، وحضر الحويني دروسه طالبًا ثم هاجر المطيعي إلى السودان بعد أحداث زمن السادات، بحسب رواية الحويني."
  en: "Shafi'i jurist and teacher in Cairo whom Abu Ishaq al-Heweny introduces as the author of the completion (Takmila) of al-Nawawi's «al-Majmu' Sharh al-Muhadhdhab»; he taught Sahih al-Bukhari, «Ihya' Ulum al-Din», «al-Ashbah wa-l-Naza'ir» and «al-Majmu'» in Abbasiyya, where al-Heweny attended his lessons as a student, before emigrating to Sudan after the events of Sadat's time, according to al-Heweny's account."
  ur: "قاہرہ کے شافعی فقیہ اور مدرس، جنہیں ابو اسحاق حوینی نووی کی «المجموع شرح المهذب» کے تکملے کا مصنف بتاتے ہیں؛ وہ عباسیہ میں صحیح بخاری، «إحیاء علوم الدین»، «الأشباه والنظائر» اور «المجموع» پڑھاتے تھے، جہاں حوینی طالب علمی میں ان کے دروس میں شریک ہوئے، پھر حوینی کے بیان کے مطابق سادات کے دور کے واقعات کے بعد وہ سوڈان ہجرت کر گئے۔"
