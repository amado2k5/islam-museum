summary:
  ar: "من فقهاء التابعين بمصر، ذكره الشيرازي مع عبد الرحمن بن عسيلة الصنابحي، وقال إنهما من أصحاب عمر؛ لم يذكر الشيرازي تاريخ وفاته في هذه الصفحات {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
  en: "One of the jurists among the Successors in Egypt. Al-Shirazi mentions him together with Abd al-Rahman ibn Usayla al-Sunabihi and says that both were among the companions of Umar. Al-Shirazi does not give his date of death on these pages {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
  fr: "L'un des juristes parmi les Suivants en Égypte. Al-Shirazi le mentionne avec Abd al-Rahman ibn Usayla al-Sunabihi et dit que tous deux étaient parmi les compagnons d'Umar. Al-Shirazi ne donne pas sa date de mort dans ces pages {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
  es: "Uno de los juristas entre los Sucesores en Egipto. Al-Shirazi lo menciona junto con Abd al-Rahman ibn Usayla al-Sunabihi y afirma que ambos fueron compañeros de Umar. Al-Shirazi no indica su fecha de fallecimiento en estas páginas {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
  ur: "مصر کے جانشینوں میں سے ایک فقیہ۔ شیرازی نے ان کا ذکر عبدالرحمٰن بن اسیلہ السنابیحی کے ساتھ کیا ہے اور کہا ہے کہ دونوں عمر کے اصحاب میں سے تھے۔ الشیرازی نے ان صفحات پر اپنی تاریخ وفات نہیں بتائی۔ 41}۔"
  tr: "O, Mısır'daki Tabiin âlimlerinden biriydi. Şirazi, onu Abdülrahman ibn Asila el-Sanabihi ile birlikte anmış ve Ömer'in sahabeleri arasında olduklarını söylemiştir. Şirazi, bu sayfalarda ölüm tarihinden bahsetmemiştir. {cite:tabaqat-fuqaha-abbas-1981 s. 41}"
  id: "Beliau adalah salah satu ulama Tabi'in di Mesir. Al-Shirazi menyebutkannya bersama Abd al-Rahman ibn Asila al-Sanabihi, dan mengatakan bahwa mereka termasuk sahabat Umar. Al-Shirazi tidak menyebutkan tanggal kematiannya di halaman-halaman ini {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
