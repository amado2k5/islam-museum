label: { ar: "أبو بكر بن الحارث بن هشام", en: "Abu Bakr ibn al-Harith ibn Hisham", fr: "Abu Bakr ibn al-Harith ibn Hisham", es: "Abu Bakr ibn al-Harith ibn Hisham", ur: "ابوبکر بن حارث بن ہشام" }
summary:
  ar: "قرشي مخزومي نصح الحسين بن علي حين هم بالخروج إلى الكوفة فذكره بما صنعوا بأبيه وأخيه وقال فيقاتلك من وعدك أن ينصرك ويخذلك من أنت أحب إليه ممن ينصره فاذكر الله في نفسك، فقال له الحسين جزاك الله خيراً فقد أجهدك رأيك، فدخل على والي مكة وهو يقول كم نرى ناصحاً يقول فيعصى فقال نصحت له ورب الكعبة {cite:muruj-al-dhahab p. 55}."
  en: "The Makhzumi cousin whose counsel to al-Husayn survives — 'the one who promised to aid you will fight you; remember God in yourself' — answered with 'may God repay you well; your judgement has exhausted itself' {cite:muruj-al-dhahab p. 55}."
  fr: "Le cousin makhzumite dont le conseil à al-Husayn nous est parvenu — « celui qui a promis de t'aider te combattra ; souviens-toi de Dieu en toi-même » — à quoi il fut répondu « que Dieu te récompense ; ton jugement s'est épuisé » {cite:muruj-al-dhahab p. 55}."
  es: "El primo Makhzumi cuyo consejo a al-Husayn se conserva —«quien prometió ayudarte luchará contra ti; recuerda a Dios en ti mismo»— respondió con «que Dios te recompense bien; tu juicio se ha agotado» {cita:muruj-al-dhahab p. 55}."
  ur: "مخزومی کزن جس کا الحسین کو مشورہ زندہ ہے - 'جس نے آپ کی مدد کرنے کا وعدہ کیا تھا وہ آپ سے لڑے گا؛ اپنے آپ میں خدا کو یاد رکھیں' - اس کے ساتھ جواب دیا 'خدا آپ کو اچھا بدلہ دے۔ آپ کا فیصلہ ختم ہو گیا ہے۔ 55}۔"
  tr: "Kureşu Makhzumi, Hüseyin bin Ali Kufa'ya gitmek üzereyken, babasına ve kardeşine yapılanları hatırlatarak ona şu tavsiyede bulundu: \"Sana destek sözü veren seninle savaşacak, seni destekleyenden daha çok seven ise seni terk edecek. Öyleyse Allah'ı kalbinde hatırla.\" Hüseyin ona, \"Allah seni iyi bir şekilde mükafatlandırsın, çünkü düşüncen seni tüketti\" dedi. Mekke valisinin yanına girdi. Vali, \"Konuşup da itaat edilmeyen kaç tane danışman görüyoruz?\" diyordu. Kureşu Makhzumi, \"Kâbe'nin Rabbine yemin ederim ki, ben ona tavsiye verdim\" dedi. {kaynak: Muruj-al-dhahab s. 55}"
  id: "Qurashi Makhzumi menasihati Al-Hussein bin Ali ketika ia hendak pergi ke Kufa, mengingatkannya tentang apa yang telah mereka lakukan kepada ayah dan saudaranya. Ia berkata, “Orang yang berjanji untuk mendukungmu akan memerangimu, dan orang yang lebih mencintaimu daripada yang mendukungmu akan meninggalkanmu. Maka ingatlah Allah dalam hatimu.” Al-Hussein berkata kepadanya, “Semoga Allah memberimu pahala yang baik, karena pendapatmu telah membuatmu lelah.” Ia menemui gubernur Mekah, yang sedang berkata, “Berapa banyak penasihat yang kita lihat yang berbicara dan tidak ditaati?” Ia berkata, “Aku menasihatinya, demi Tuhan Ka'bah.” {cite:muruj-al-dhahab p. 55}"
