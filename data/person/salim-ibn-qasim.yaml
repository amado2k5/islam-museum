summary:
  ar: "سالم بن قاسم الحسيني أمير المدينة؛ حارب الأمير قتادة الحسيني أمير مكة سنة واحدة وستمائة فلقيه بذي الحليفة بعد أن صلى عند الحجرة النبوية ودعا، فهزم قتادة وتبعه إلى مكة وحصره بها، فأفسد قتادة من معه من الأمراء فمالوا إليه فرحل سالم عائداً إلى المدينة {cite:kamil-ibn-al-athir p. 245}."
  en: "The Husaynid amir of Medina — defeated Qatada of Mecca at Dhu al-Hulayfa after praying at the Prophet's tomb, besieged him inside Mecca, and lost the war only when Qatada corrupted his amirs {cite:kamil-ibn-al-athir p. 245}."
