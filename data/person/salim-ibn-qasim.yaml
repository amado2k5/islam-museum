id: person/salim-ibn-qasim
class: person
label: { ar: "سالم بن قاسم أمير المدينة", en: "Salim ibn Qasim, amir of Medina", es: "Salim ibn Qasim, amir of Medina", fr: "Salim ibn Qasim, amir of Medina", ur: "سلیم بن قاسم، مدینہ کے امیر" }
summary:
  ar: "سالم بن قاسم الحسيني أمير المدينة؛ حارب الأمير قتادة الحسيني أمير مكة سنة واحدة وستمائة فلقيه بذي الحليفة بعد أن صلى عند الحجرة النبوية ودعا، فهزم قتادة وتبعه إلى مكة وحصره بها، فأفسد قتادة من معه من الأمراء فمالوا إليه فرحل سالم عائداً إلى المدينة {cite:kamil-ibn-al-athir p. 245}."
  en: "The Husaynid amir of Medina — defeated Qatada of Mecca at Dhu al-Hulayfa after praying at the Prophet's tomb, besieged him inside Mecca, and lost the war only when Qatada corrupted his amirs {cite:kamil-ibn-al-athir p. 245}."
  es: "El emir husayní de Medina — derrotó a Qatada de La Meca en Dhu al-Hulayfa después de orar en la tumba del Profeta, lo sitió dentro de La Meca y perdió la guerra solo cuando Qatada corrompió a sus emires {cite:kamil-ibn-al-athir p. 245}."
  fr: "L'émir husaynide de Médine a vaincu Qatada de La Mecque à Dhu al-Hulayfa après avoir prié au tombeau du Prophète, l'a assiégé à l'intérieur de La Mecque et n'a perdu la guerre que lorsque Qatada a corrompu ses émirs {cite:kamil-ibn-al-athir p. 245}."
  ur: "مدینہ کے حسین امیر نے مکہ کے قتادہ کو ذی الحلیفہ میں رسول اللہ کی قبر پر نماز پڑھنے کے بعد شکست دی، مکہ کے اندر اس کا محاصرہ کر لیا، اور جنگ اسی وقت ہاری جب قتادہ نے اپنے امیروں کو بگاڑ دیا۔ 245}۔"
  tr: "Medine valisi Salim bin Kasım el-Hüseyni; Mekke Emiri Prens Katadah el-Husayni ile bir yıl altı yüz yıl savaştı. Peygamber'in kamalında namaz kılıp namaz kıldıktan sonra onu Zhuleyfa'da karşıladı. Katada onu yendi, Mekke'ye kadar takip etti ve orada kuşattı. Katada, yanında olan prensleri yozlaştırdı, onlar da ona karşı döndü, bu yüzden Salim Medine'ye döndü {cite:kamil-ibn-al-athir s. 245}."
  id: "Salim ibn Qasim al-Husayni, gubernur Madinah; ia berperang melawan Pangeran Qatadah al-Husayni, Emir Mekah, selama satu tahun enam ratus tahun. Ia bertemu dengannya di Dhu al-Hulayfa setelah ia berdoa di ruang Nabi dan berdoa. Qatadah mengalahkannya, mengikutinya ke Mekah, dan mengepungnya di sana. Qatadah merusak orang-orang yang bersamanya di antara para pangeran, yang kemudian berbalik melawannya, sehingga Salim pergi kembali ke Madinah {cite:kamil-ibn-al-athir hlm. 245}."
