summary:
  ar: "شاعر وكاتب بحريني، من أبرز وجوه الأدب الحديث في البحرين وقائد حركته الأدبية في القرن العشرين. وُلد في بومباي سنة 1908 لأب من المنامة وأم عراقية، وعلّم في البحرين من سنة 1927 ثم عمل في الجمارك وفي شركة نفط البحرين حتى تقاعده سنة 1967، وترجم الشعر بين العربية والفارسية والأردية والإنجليزية، ورأس المجلس الدستوري الذي صاغ أول دستور للبحرين في مطلع السبعينيات، وتوفي سنة 2002."
  en: "Bahraini poet and writer, one of the leading figures of Bahrain's modern literature and the head of its literary movement through the twentieth century. Born in Bombay in 1908 to a father from Manama and an Iraqi mother, he taught in Bahrain from 1927, then worked in customs and for the Bahrain Petroleum Company until his retirement in 1967, translated poetry between Arabic, Persian, Urdu and English, chaired the Constitutional Council that drafted Bahrain's first constitution in the early 1970s, and died in 2002."
  ur: "بحرینی شاعر اور ادیب، بحرین کے جدید ادب کی نمایاں ترین شخصیات میں سے ایک اور بیسویں صدی میں اس کی ادبی تحریک کے قائد۔ 1908ء میں بمبئی میں منامہ کے ایک باپ اور عراقی ماں کے ہاں پیدا ہوئے، 1927ء سے بحرین میں تدریس کی، پھر کسٹمز اور بحرین پیٹرولیم کمپنی میں 1967ء میں سبکدوشی تک کام کیا، عربی، فارسی، اردو اور انگریزی کے درمیان شاعری کا ترجمہ کیا، ستر کی دہائی کے اوائل میں بحرین کے پہلے دستور کا مسودہ تیار کرنے والی آئینی کونسل کی سربراہی کی، اور 2002ء میں وفات پائی۔"
