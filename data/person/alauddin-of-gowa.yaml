summary:
  ar: "رابع عشر حكام غوا في جنوب سولاوسي وأول سلاطينها (حكم 1593–1639). نُصّب طفلًا، واعتنق الإسلام سنة 1605 — أول حاكم لغوا يفعل ذلك — وجعل الإسلام دين الدولة الرسمي، ووسّع السلطنة في سولاوسي."
  en: "Fourteenth ruler of Gowa in South Sulawesi and its first sultan (r. 1593–1639). Installed as a child, he converted to Islam in 1605 — the first ruler of Gowa to do so — made Islam the state religion, and expanded the sultanate across Sulawesi."
  ur: "جنوبی سولاویسی کی ریاست گوا کے چودھویں حکمران اور اس کے پہلے سلطان (دورِ حکومت 1593–1639ء)۔ بچپن میں تخت نشین ہوئے، 1605ء میں اسلام قبول کیا — گوا کے پہلے حکمران جنھوں نے ایسا کیا — اسلام کو ریاست کا مذہب بنایا اور سلطنت کو سولاویسی میں وسعت دی۔"
