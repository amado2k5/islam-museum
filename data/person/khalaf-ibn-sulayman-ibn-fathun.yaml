  en: "Ibn Fathun (Khalaf ibn Sulayman)"
  es: "Ibn Fathun (Khalaf ibn Sulayman)"
  fr: "Ibn Fathun (Khalaf ibn Sulayman)"
  ur: "ابن فتحون ⁦(خلف ابن سلیمان)⁩"
summary:
  ar: "خلف بن سليمان بن خلف بن محمد بن فتحون، أبو القاسم، الأندلسي الأوريولي، فقيه مالكي وأديب وشاعر، ولي قضاء شاطبة ثم دانية. روى عن أبيه وأبي الوليد الباجي وطاهر بن مفوز، وروى عنه ابنه محمد وزياد بن محمد. من تصانيفه كتاب في الشروط لم يسبق إليه. توفي سنة 505 هـ على ما هو مثبت في العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  en: "Khalaf ibn Sulayman ibn Khalaf ibn Muhammad ibn Fathun, Abu al-Qasim, of Orihuela in al-Andalus, a Maliki jurist, writer and poet. He was judge of Shatiba and then Denia. He related from his father, Abu al-Walid al-Baji and Tahir ibn Mawfaz, and was related from by his son Muhammad and Ziyad ibn Muhammad. His book on contracts was the first of its kind. The header gives 505 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  es: "Khalaf ibn Sulayman ibn Khalaf ibn Muhammad ibn Fathun, Abu al-Qasim, de Orihuela en al-Ándalus, fue un jurista, escritor y poeta malikí. Fue juez de Shatiba y luego de Denia. Transmitió información de su padre, Abu al-Walid al-Baji y Tahir ibn Mawfaz, y fue transmitido por su hijo Muhammad y Ziyad ibn Muhammad. Su libro sobre contratos fue el primero de su tipo. El encabezado indica el año 505 de la Hégira como su año de fallecimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  fr: "Khalaf ibn Sulayman ibn Khalaf ibn Muhammad ibn Fathun, dit Abu al-Qasim, d'Orihuela en al-Andalus, était un juriste, écrivain et poète malikite. Il fut juge de Shatiba puis de Denia. Sa filiation se tenait de son père, Abu al-Walid al-Baji, et de Tahir ibn Mawfaz, et de son fils Muhammad, et de Ziyad ibn Muhammad. Son ouvrage sur les contrats fut le premier du genre. L'en-tête indique l'an 505 de l'Hégire comme année de son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  ur: "خلف بن سلیمان بن خلف ابن محمد بن فطون، ابو القاسم، اوریحویلا، الاندلس میں، ایک مالکی فقیہ، مصنف اور شاعر۔ وہ شاتیبہ اور پھر دینیہ کے قاضی تھے۔ انہوں نے اپنے والد ابو الولید الباجی اور طاہر بن معاذ سے اور اپنے بیٹے محمد اور زیاد بن محمد سے روایت کی ہے۔ معاہدوں پر ان کی کتاب اپنی نوعیت کی پہلی کتاب تھی۔ ہیڈر 505 ہجری کو ان کی وفات کا سال بتاتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15810}"
  tr: "Halef ibn Süleyman ibn Halef ibn Muhammed ibn Fethun, Endülüslü Oriuli, Maliki hukukçusu, edebi figür ve şair Ebu el-Kasım, önce Şatiba ve sonra Daniya'nın hakimi olarak atanmıştır. Babası Ebu el-Velid el-Baji ve Tahir ibn Mafuz'dan, ayrıca oğlu Muhammed ve Ziyad ibn Muhammed'den rivayet etmiştir. Eserleri arasında, kendisinden önce hiç yaşamadığı koşullar üzerine bir kitap bulunmaktadır. Başlıkta belirtildiği üzere, 505 Hicri yılında ölmüştür. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15810}"
  id: "Khalaf ibn Sulayman ibn Khalaf ibn Muhammad ibn Fathun, Abu al-Qasim, seorang Oriuli Andalusia, ahli hukum Maliki, tokoh sastra, dan penyair, yang diangkat sebagai hakim Shatiba dan kemudian Daniya. Ia menceritakan dari ayahnya, Abu al-Walid al-Baji, dan Tahir ibn Mafuz, serta dari putranya Muhammad dan Ziyad ibn Muhammad. Di antara karyanya terdapat sebuah buku tentang kondisi yang belum pernah dibaca olehnya. Ia meninggal pada tahun 505 H, sebagaimana tercatat dalam judulnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15810}"
