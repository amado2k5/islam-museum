  en: "Ibn Fathun (Khalaf ibn Sulayman)"
summary:
  ar: "خلف بن سليمان بن خلف بن محمد بن فتحون، أبو القاسم، الأندلسي الأوريولي، فقيه مالكي وأديب وشاعر، ولي قضاء شاطبة ثم دانية. روى عن أبيه وأبي الوليد الباجي وطاهر بن مفوز، وروى عنه ابنه محمد وزياد بن محمد. من تصانيفه كتاب في الشروط لم يسبق إليه. توفي سنة 505 هـ على ما هو مثبت في العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  en: "Khalaf ibn Sulayman ibn Khalaf ibn Muhammad ibn Fathun, Abu al-Qasim, of Orihuela in al-Andalus, a Maliki jurist, writer and poet. He was judge of Shatiba and then Denia. He related from his father, Abu al-Walid al-Baji and Tahir ibn Mawfaz, and was related from by his son Muhammad and Ziyad ibn Muhammad. His book on contracts was the first of its kind. The header gives 505 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
