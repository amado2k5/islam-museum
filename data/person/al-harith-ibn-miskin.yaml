id: person/al-harith-ibn-miskin
class: person
label: { ar: "الحارث بن مسكين", en: "al-Harith ibn Miskin", es: "al-Harith ibn Miskin", fr: "al-Harith ibn Miskin", ur: "حارث بن مسکین" }
summary:
  ar: "من أصحاب مالك، ولاه المتوكل قضاء مصر سنة سبع وثلاثين بعد تمنع بدل ابن أبي الليث وأهان القاضي المعزول بضربه كل يوم عشرين سوطاً ليرد الظلامات إلى أهلها {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  en: "A Maliki appointed qadi of Egypt in 237 after much refusal, replacing Ibn Abi al-Layth — he had the deposed judge beaten twenty lashes a day until the wrongs were restored {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  es: "Un malikí fue nombrado cadí de Egipto en 237 tras muchas negativas, reemplazando a Ibn Abi al-Layth; hizo que el juez depuesto recibiera veinte latigazos al día hasta que se repararan los daños {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  fr: "Un cadi malikite nommé en Égypte en 237 après de nombreux refus, remplaçant Ibn Abi al-Layth — il fit battre le juge déchu vingt coups de fouet par jour jusqu'à ce que les torts soient rétablis {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  ur: "ایک مالکی نے بہت انکار کے بعد 237 میں ابن ابی لیث کی جگہ مصر کا قاضی مقرر کیا - اس نے معزول جج کو ایک دن میں بیس کوڑے مارے یہاں تک کہ غلطیاں بحال ہو جائیں۔ 539}۔"
