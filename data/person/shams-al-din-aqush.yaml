label: { ar: "الأمير شمس الدين أقوش صاحب حلب" }
summary:
  ar: "صاحب حلب، أقام بها خليفة ولقبه الحاكم بأمر الله وخطب له ونقش اسمه على الدراهم فكان خليفتان متزامنان بحلب والقاهرة {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  en: "Aleppo's amir, who raised his own Abbasid caliph — 'al-Hakim bi-amr Allah' — with khutba and coin while Cairo hailed al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  es: "El emir de Alepo, que elevó a su propio califa abasí —'al-Hakim bi-amr Allah'— con jutba y monedas mientras El Cairo aclamaba a al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  fr: "L'émir d'Alep, qui a élevé son propre calife abbasside — 'al-Hakim bi-amr Allah' — avec khutba et pièces de monnaie tandis que le Caire saluait al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  ur: "حلب کے امیر، جنہوں نے اپنے ہی عباسی خلیفہ - 'الحکیم بِی امر اللہ' کو خطبہ اور سکے کے ساتھ کھڑا کیا جب کہ قاہرہ نے المستنصر کی تعریف کی۔ 724}۔"
