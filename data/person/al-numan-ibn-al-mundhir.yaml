summary:
  en: "The Lakhmid king of al-Hira whom Khosrow summoned after the courtier Zayd ibn Adi’s intrigue; he entrusted his family and wealth to Hani ibn Masʾud of Banu Shayban, then went to Khosrow who imprisoned him until death — the refusal to surrender that deposit ignited Dhu Qar."
  fr: "Le roi Lakhmide d'al-Hira que Khosrow a convoqué après l'intrigue du courtisan Zayd ibn Adi ; Il confia sa famille et ses biens à Hani ibn Masudud de Banu Shayban, puis se rendit à Khosrow qui l’emprisonna jusqu’à sa mort – le refus de céder ce dépôt enflamma Dhu Qar."
  ar: "ملك الحيرة اللخمي الذي غضب عليه كسرى بوشاية دبّرها زيد بن عدي العبادي؛ أودع أهله وماله عند هانئ بن مسعود سيد آل شيبان ثم مضى إلى كسرى فحبسه حتى مات، وكان إباء هانئ عن تسليم الوديعة سبب موقعة ذي قار. وكان يقال له أبيت اللعن لافتتاح النابغة الذبياني مدحه بهذا التركيب فتهلل وجهه بالسرور وأمر له بجوهر {cite:muruj-al-dhahab p. 417-418}"
  es: "El rey Lakhmid de al-Hira, a quien Khosrow convocó tras la intriga del cortesano Zayd ibn Adi, confió su familia y riquezas a Hani ibn Masʾud de Banu Shayban, y luego acudió a Khosrow, quien lo encarceló hasta la muerte. La negativa a entregar ese depósito fue lo que encendió la guerra de Dhu Qar."
  ur: "حیرہ کا لخمید بادشاہ جسے خسرو نے درباری زید بن عدی کی سازش کے بعد طلب کیا تھا۔ اس نے اپنے خاندان اور مال کو بنو شیبان کے ہانی بن مسعود کے سپرد کیا، پھر خسرو کے پاس گیا جس نے اسے موت تک قید رکھا - اس امانت کے حوالے کرنے سے انکار نے ذو قار کو بھڑکایا۔"
  tr: "El-Hirah el-Lakhmi kralı, Zeyd bin Adi el-Abadi tarafından düzenlenen bir muhbirle Khosrow'a kızan ve ailesini ve servetini Şeyban ailesinin reisi Hani ibn Mas'ud'a emanet etti, ardından Khosrow'a giderek onu hapsetti ve ölene kadar hapsetti. Hani'nin depozitoyu vermeyi reddetmesi, Dhi Qar Savaşı'nın sebebi oldu. Al-Nabigha al-Dhabyani'yi açtığı için 'Abit al-La'na' olarak anıldı, bu kompozisyonla onu övdü, yüzü sevinçle yüzleşti ve ona bir asa vermesini emretti {cite:muruj-al-dhahab s. 417-418}"
  id: "Raja Al-Hirah al-Lakhmi, yang marah oleh Khosrow dengan pelapor yang diatur oleh Zayd ibn Adi al-Abadi, mempercayakan keluarga dan hartanya kepada Hani ibn Mas'ud, kepala keluarga Shayban, lalu pergi ke Khosrow dan memenjarakannya hingga ia meninggal. Penolakan Hani untuk menyerahkan deposit menjadi penyebab Pertempuran Dhi Qar. Ia disebut 'Abit al-La'na' karena membuka al-Nabigha al-Dhabyani, memujinya dengan komposisi ini, wajahnya bersukacita, dan ia memerintahkan agar diberikan tongkat {cite:muruj-al-dhahab hlm. 417-418}"
