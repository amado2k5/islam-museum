summary:
  en: "The Lakhmid king of al-Hira whom Khosrow summoned after the courtier Zayd ibn Adi’s intrigue; he entrusted his family and wealth to Hani ibn Masʾud of Banu Shayban, then went to Khosrow who imprisoned him until death — the refusal to surrender that deposit ignited Dhu Qar."
  ar: "ملك الحيرة اللخمي الذي غضب عليه كسرى بوشاية دبّرها زيد بن عدي العبادي؛ أودع أهله وماله عند هانئ بن مسعود سيد آل شيبان ثم مضى إلى كسرى فحبسه حتى مات، وكان إباء هانئ عن تسليم الوديعة سبب موقعة ذي قار.، وكان يقال له أبيت اللعن لافتتاح النابغة الذبياني مدحه بهذا التركيب فتهلل وجهه بالسرور وأمر له بجوهر {cite:muruj-al-dhahab p. 417-418}"
