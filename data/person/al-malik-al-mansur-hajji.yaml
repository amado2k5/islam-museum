summary:
  ar: "ولي السلطنة بعد عمه الناصر حسن في جمادى الأولى سنة اثنتين وستين ودبر دولته يلبغا وسافر معه إلى الشام وكان عمره نحو خمس عشرة سنة، فلما عاد من السفر كثر أمره ونهيه فأشاع يلبغا أنه مجنون وخلعه في شعبان سنة أربع وستين بعد ثلاث سنين وشهرين وخمسة أيام، واعتُقل بالحوش في المكان الذي به ذرية الملك الناصر إلى أن مات في تاسع محرم سنة إحدى وثمانمائة، وخلف عشرة أولاد قرر لهم الملك الظاهر مرتباً {cite:shadharat-dhahab p. 18}."
  en: "He succeeded his uncle al-Nasir Hasan in Jumada I 762, with Yalbugha directing his state; Yalbugha travelled with him to Syria when he was about fifteen. After his return his commands and prohibitions grew, so Yalbugha spread word that he was mad and deposed him in Sha'ban 764, after three years, two months and five days. He was confined in al-Hawsh, where the descendants of al-Malik al-Nasir were held, until he died on 9 Muharram 801. He left ten children, for whom al-Malik al-Zahir set stipends {cite:shadharat-dhahab p. 18}."
  es: "Sucedió a su tío al-Nasir Hasan en Jumada I de 762, con Yalbugha al frente de su estado; Yalbugha viajó con él a Siria cuando tenía unos quince años. Tras su regreso, sus órdenes y prohibiciones aumentaron, por lo que Yalbugha difundió el rumor de que estaba loco y lo depuso en Sha'ban de 764, después de tres años, dos meses y cinco días. Fue confinado en al-Hawsh, donde se encontraban los descendientes de al-Malik al-Nasir, hasta su muerte el 9 de Muharram de 801. Dejó diez hijos, para quienes al-Malik al-Zahir estableció estipendios {cite:shadharat-dhahab p. 18}."
  fr: "Il succéda à son oncle al-Nasir Hasan en Jumada I 762, Yalbugha dirigeant son État. Ce dernier l'accompagna en Syrie lorsqu'il avait environ quinze ans. À son retour, ses ordres et interdictions se multiplièrent, si bien que Yalbugha répandit la rumeur qu'il était fou et le déposa en Sha'ban 764, après trois ans, deux mois et cinq jours. Il fut emprisonné à al-Hawsh, où étaient détenus les descendants d'al-Malik al-Nasir, jusqu'à sa mort le 9 Muharram 801. Il laissa dix enfants, pour lesquels al-Malik al-Zahir fixa des pensions (voir: shadharat-dhahab, p. 18)."
  ur: "اس نے جمادی الثانی 762 میں اپنے چچا النصیر حسن کا جانشین بنایا، یلبغہ نے اپنی ریاست کی رہنمائی کی۔ یلبغہ نے اس کے ساتھ شام کا سفر کیا جب وہ پندرہ سال کے تھے۔ اس کی واپسی کے بعد اس کے احکام اور ممانعتیں بڑھ گئیں، چنانچہ یلبغہ نے یہ بات پھیلائی کہ وہ دیوانہ ہے اور تین سال، دو ماہ اور پانچ دن کے بعد شعبان 764 میں اسے معزول کر دیا۔ وہ الحوث میں مقید تھا، جہاں ملک النصیر کی اولاد رکھی گئی، یہاں تک کہ اس کی وفات 9 محرم 801 کو ہوئی۔ اس نے دس بچے چھوڑے، جن کے لیے الملک الظاہر نے وظیفہ مقرر کیا۔ 18}۔"
  tr: "Altmış iki yılında, amcası el-Nasir Hasan'dan sonra Cumada el-Avval'da sultanlığı devraldı. Yalbugha'da yönetimini yönetti, yaklaşık on beş yaşındayken onunla birlikte Levant'a seyahat etti. Seyahatten döndüğünde emirleri ve yasakları arttı ve Yalbugha onun akıl hastası olduğunu yaydı. Altmış dördüncü yılda, üç yıl, iki ay ve beş gün sonra onu Şaban'da tahttan indirdi. Kral el-Nasir'in soyundan gelenlerin yaşadığı avluda tutuldu, ta ki Kral el-Nasir 801 yılının dokuzunda Muharrem ölene kadar. Geride on oğlu bıraktı ve Kral el-Zahir onları için atadı {atıf: şadharat-dhahab, s. 18}."
  id: "Ia mengambil alih kesultanan setelah pamannya al-Nasir Hasan di Jumada al-Awwal pada tahun enam puluh dua. Ia mengelola pemerintahannya di Yalbugha, dan ikut pergi ke Levant saat berusia sekitar lima belas tahun. Ketika kembali dari perjalanan, perintah dan larangannya meningkat, dan Yalbugha menyebarkan bahwa ia gila. Ia mencopot Raja di Sha'ban pada tahun enam puluh empat setelah tiga tahun, dua bulan, dan lima hari. Ia ditahan di halaman tempat keturunan Raja al-Nasir tinggal hingga ia wafat pada tanggal sembilan Muharram tahun 801. Ia meninggalkan sepuluh putra yang ditunjuk oleh Raja al-Zahir {cite:shadharat-dhahab, hlm. 18}."
