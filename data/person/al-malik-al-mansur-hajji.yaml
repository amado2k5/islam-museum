summary:
  ar: "ولي السلطنة بعد عمه الناصر حسن في جمادى الأولى سنة اثنتين وستين ودبر دولته يلبغا وسافر معه إلى الشام وكان عمره نحو خمس عشرة سنة، فلما عاد من السفر كثر أمره ونهيه فأشاع يلبغا أنه مجنون وخلعه في شعبان سنة أربع وستين بعد ثلاث سنين وشهرين وخمسة أيام، واعتُقل بالحوش في المكان الذي به ذرية الملك الناصر إلى أن مات في تاسع محرم سنة إحدى وثمانمائة، وخلف عشرة أولاد قرر لهم الملك الظاهر مرتباً {cite:shadharat-dhahab p. 18}."
  en: "He succeeded his uncle al-Nasir Hasan in Jumada I 762, with Yalbugha directing his state; Yalbugha travelled with him to Syria when he was about fifteen. After his return his commands and prohibitions grew, so Yalbugha spread word that he was mad and deposed him in Sha'ban 764, after three years, two months and five days. He was confined in al-Hawsh, where the descendants of al-Malik al-Nasir were held, until he died on 9 Muharram 801. He left ten children, for whom al-Malik al-Zahir set stipends {cite:shadharat-dhahab p. 18}."
