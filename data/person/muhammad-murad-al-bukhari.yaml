summary:
  ar: "بطاقة أولية لمحمد مراد البخاري، مفسر ومتصوف عثماني من أصل تركستاني القرن الثامن عشر، توفي سنة ١٧٢٠م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Muhammad Murad al-Bukhari, the eighteenth-century Ottoman exegete and mystic of Turkestani origin, d. 1720; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Muhammad Murad al-Bukhari, exégeta y místico otomano del siglo XVIII de origen turkestani, fallecido en 1720; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Muhammad Murad al-Bukhari, exégète et mystique ottoman du XVIIIe siècle d'origine turkmène, mort en 1720; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "محمد مراد البخاری کے لیے مسودہ کارڈ، اٹھارویں صدی کے عثمانی مفسر اور ترکستانی نژاد صوفیانہ، ڈی۔ 1720; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1720 yılında ölen, on sekizinci yüzyılda Türkistan kökenli Osmanlı tefsircisi ve Sufi Muhammed Murad el-Buhari'nin ön kartı; önemli şahsiyetlerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Muhammad Murad al-Bukhari, seorang tafsir Ottoman dan Sufi asal Turkestan pada abad kedelapan belas, yang meninggal pada tahun 1720 M; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
