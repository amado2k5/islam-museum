summary:
  ar: "باحث ومحاضر إسلامي باكستاني ومهندس ميكانيكي، وُلد سنة 1977 في جِهلم بالبنجاب، يعمل في محاضرات مصوّرة عبر يوتيوب من أكاديمية بحثية يديرها في مدينته، ويقدّم نفسه ناقدا للفرقة والتعصب المذهبي؛ أثارت آراؤه جدلا واسعا، واعتُقل مرتين (2020 و2025) ونجا من محاولات اغتيال."
  en: "Pakistani Islamic scholar, lecturer and mechanical engineer, born in 1977 in Jhelum, Punjab. He lectures on video through YouTube from a research academy he runs in his home city, presenting himself as a critic of sectarian division. His views have drawn wide controversy: he was arrested in 2020 and 2025 and survived assassination attempts."
  ur: "پاکستانی اسلامی محقق، مدرس اور مکینیکل انجینئر، جو 1977 میں جہلم، پنجاب میں پیدا ہوئے۔ وہ اپنے شہر میں قائم ایک تحقیقی اکیڈمی سے یوٹیوب پر لیکچر دیتے ہیں اور خود کو فرقہ واریت کے ناقد کے طور پر پیش کرتے ہیں۔ ان کے افکار پر شدید بحث رہی: وہ 2020 اور 2025 میں گرفتار ہوئے اور قاتلانہ حملوں میں بچ گئے۔"
