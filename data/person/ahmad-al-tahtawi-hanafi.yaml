summary:
  ar: "أحمد بن محمد بن إسماعيل، فقيه حنفي، ولد بطهطا قرب أسيوط، وتعلم بالأزهر، وتقلد مشيخة الحنفية فعزل ثم أعيد. من كتبه «حاشية على مراقي الفلاح»، و«حاشية على الدر المختار»، و«كشف الرين عن بيان المسح على الجوربين». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1631}"
  en: "Ahmad ibn Muhammad ibn Ismail, a Hanafi jurist born in Tahta near Asyut, who studied at al-Azhar and was appointed head of the Hanafis, was dismissed and then reinstated. His works include a gloss on Maraqi al-falah, a gloss on al-Durr al-mukhtar, and Kashf al-rayn on wiping over the socks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1631}"
