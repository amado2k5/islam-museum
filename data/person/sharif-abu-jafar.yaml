label: { ar: "الشريف أبو جعفر" }
summary:
  ar: "زعيم حنابلة بغداد في عهد القائم والمقتدي، وقف في وجه أبي نصر بن القشيري الأشعري حتى وقعت فتنة شوال 469هـ، ولما استدعاه الوزير فخر الدولة للمصالحة قال «أي صلح بيننا؟ هؤلاء القوم يزعمون أنا كفار ونحن نزعم أن من لا يعتقد ما نعتقده كافر فأي صلح بيننا؟ وقد كان جدّا الخليفة القائم والقادر أخرجا اعتقادهما للناس وقرئ عليهم في دواوينهم وحُمل عنهما إلى أطراف الأرض ونحن على اعتقادهما». وقيل إنه مرض بعدها فانتفخت رجلاه وقيل إن بعض المتفقهة دسّ له في مداسه سماً {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
