id: person/sharif-abu-jafar
class: person
label: { ar: "الشريف أبو جعفر" }
summary:
  ar: "زعيم حنابلة بغداد في عهد القائم والمقتدي، وقف في وجه أبي نصر بن القشيري الأشعري حتى وقعت فتنة شوال 469هـ، ولما استدعاه الوزير فخر الدولة للمصالحة قال «أي صلح بيننا؟ هؤلاء القوم يزعمون أنا كفار ونحن نزعم أن من لا يعتقد ما نعتقده كافر فأي صلح بيننا؟ وقد كان جدّا الخليفة القائم والقادر أخرجا اعتقادهما للناس وقرئ عليهم في دواوينهم وحُمل عنهما إلى أطراف الأرض ونحن على اعتقادهما». وقيل إنه مرض بعدها فانتفخت رجلاه وقيل إن بعض المتفقهة دسّ له في مداسه سماً {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
  tr: "El-Kaim ve el-Muqtadi döneminde Bağdat'taki Hanbali lideri, 469 Hicri yılına kadar Ebu Nasr bin Kuşayri el-Eş'ari'ye karşı durdu. Vezir Fahr el-Devle onu uzlaşmaya çağırdığında şöyle dedi: \"Aramızda ne barışma? Bu insanlar benim kafir olduğumu iddia ediyor, biz ise inandıklarımıza inanmayanı kâfir olarak görüyoruz. Aramızda ne tür bir uzlaşma var?\" Halife el-Kaim ile el-Kadir'in büyükbabası inançlarını halka iletmiş, mahkemelerinde okudu ve onları dünyanın öbür ucuna taşımış, biz de inançlarına inanıyoruz.\" Sonrasında hastalandığı, bacaklarının şiştiği ve bazı hukukçuların beline zehir enjekte ettiği söylenir {alıntı:] muntazam-ibn-al-jawzi J.8 s.305-307}."
  id: "Pemimpin Hanbal di Baghdad pada masa al-Qa'im dan al-Muqtadi berdiri melawan Abu Nasr ibn al-Qushayri al-Ash'ari hingga terjadinya pemberontakan Shawwal pada tahun 469 H. Ketika wazir Fakhr al-Dawla memanggilnya untuk rekonsiliasi, ia berkata: \"Apa rekonsiliasi di antara kita? Orang-orang ini mengklaim bahwa aku kafir, dan kami mengklaim bahwa siapa pun yang tidak percaya apa yang kita yakini adalah kafir. Rekonsiliasi seperti apa di antara kita?\" Kakek Khalifah al-Qa'im dan al-Qadir telah menyampaikan kepercayaan mereka kepada rakyat, membacakan di istana, dan membawanya ke ujung dunia, dan kami percaya pada kepercayaan mereka.\" Dikatakan bahwa ia jatuh sakit setelahnya, menyebabkan kakinya bengkak, dan dikatakan bahwa beberapa ahli hukum menyuntikkan racun ke pinggangnya {cite:muntazam-ibn-al-jawzi J.8 hlm.305-307}."
