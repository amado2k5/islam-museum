summary:
  ar: "من الأخباريين الذين عددهم المسعود في مقدار قتلى صفين مع الهيثم بن عدي وأبي مخنف، وذهبوا إلى سبعين ألفاً من الفريقين فيهم خمسة وعشرون بدرياً {cite:muruj-al-dhahab p. 684}."
  en: "The third akhbari in Mas'udi's Siffin casualty dossier — the seventy-thousand tally alongside al-Haytham and Abu Mikhnaf {cite:muruj-al-dhahab p. 684}."
  fr: "Le troisième akhbari dans le dossier des victimes de Siffin de Mas'udi - le décompte de soixante-dix mille aux côtés d'al-Haytham et Abu Mikhnaf {cite:muruj-al-dhahab p. 684}."
  es: "El tercer akhbari en el expediente de bajas de Siffin de Mas'udi: el recuento de setenta mil junto con al-Haytham y Abu Mikhnaf {cite:muruj-al-dhahab p. 684}."
  ur: "مسعودی کی صفین کی ہلاکتوں کی دستاویز میں تیسری خبر - الحیثم اور ابو مخنف کے ساتھ ستر ہزار کی تعداد 684}۔"
  tr: "Al-Mas'ud'un Sifin'de öldürülenlerin sayısını Al-Haytham ibn Adi ve Abu Mikhnaf ile birlikte saydığı Akhbariler arasında, her iki gruptan da yetmiş bin kişi vardı; bunların arasında yirmi beş Badr da vardı {atıf:muruj-al-dhahab, s. 684}."
  id: "Di antara Akhbaris yang dihitung Al-Mas'ud dalam jumlah korban tewas di Siffin bersama Al-Haytham ibn Adi dan Abu Mikhnaf, mereka mencapai tujuh puluh ribu dari kedua kelompok, termasuk dua puluh lima Badr {cite:muruj-al-dhahab, hlm. 684}."
