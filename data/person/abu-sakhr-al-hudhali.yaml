summary:
  ar: "عبد الله بن سلمة أبو صخر الهذلي، شاعر فصيح موالٍ لبني مروان، توفي نحو ٨٠هـ ⁦(٧٠٠م)⁩، صاحب الأبيات «عجبت لسعي الدهر»."
  en: "Abd Allah ibn Salama Abu Sakhr al-Hudhali, eloquent Marwanid partisan poet (d. c. 80/700), author of the 'I wondered at fate's pursuit' lines."
  fr: "Abd Allah ibn Salama Abu Sakhr al-Hudhali, poète éloquent partisan des Marwanides (mort vers 80/700), auteur des vers « Je m'étonnais de la poursuite du destin »."
  es: "Abd Allah ibn Salama Abu Sakhr al-Hudhali, elocuente poeta partidario marwaní (fallecido entre 80 y 700 d. C.), autor de los versos \"Me asombró la persecución del destino\"."
  ur: "عبد اللہ بن سلامہ ابو صخر الہدلی، فصیح مروانی متعصب شاعر (dc 80/700)، 'میں نے تقدیر کے تعاقب پر حیرت زدہ' خطوط لکھے۔"
  tr: "Beni Mervan kabilesine bağlı, hitabet yeteneği yüksek bir şair olan Abdullah bin Salama Ebu Sakhr el-Hudhali, Hicri 80 (Miladi 700) yılı civarında vefat etmiştir ve \"Zamanın çabalarına hayret ediyorum\" dizelerinin yazarıdır."
  id: "Abdullah bin Salama Abu Sakhr al-Hudhali, seorang penyair ulung yang setia kepada Banu Marwan, wafat sekitar tahun 80 H (700 M), penulis syair \"Aku takjub dengan usaha waktu.\""
