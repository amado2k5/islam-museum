summary:
  ar: "النحوي المصري؛ أخذ عن الشهاب بن المرحل وابن هشام وغيرهما ومهر في العربية وأشغل الناس فيها، وكان جل ما عنده شرح الألفية، وفيه دعابة {cite:shadharat-dhahab p. 21}."
  tr: "Mısırlı dilbilgici; El-Şihab bin el-Marhal, İbn Hişam ve diğerlerinin yanında eğitim aldı, Arapça'da yetkindi ve birçok kişiyi bu dille meşgul etti. Eserlerinin çoğu, Alfiyyah üzerine bir yorumdu ve mizah içeriyordu {atıf:shadharat-dhahab, s. 21}."
  id: "Ahli tata bahasa Mesir; ia belajar di bawah bimbingan Al-Shihab ibn al-Marhal, Ibn Hisham, dan lainnya, serta mahir dalam bahasa Arab dan banyak orang terlibat dalam bahasa tersebut. Sebagian besar karyanya adalah komentar atas Alfiyyah, yang mencakup humor {cite:shadharat-dhahab, hlm. 21}."
