class: person
label: { ar: "الرشاطي المري", en: "al-Rushati al-Mariyyi", fr: "al-Rushati al-Mariyyi", es: "al-Rushati al-Mariyyi" }
summary:
  ar: "أبو محمد عبد الله بن علي بن عبد الله بن علي بن خلف بن أحمد بن عمر اللخمي الرشاطي المريي؛ الإمام المشهور وكانت له عناية كبيرة بالحديث والرجال والرواة والتواريخ، وهو صاحب كتاب اقتباس الأنوار والتماس الأزهار في أنساب الصحابة ورواة الآثار على أسلوب كتاب ابن السمعاني الأنساب، وولد سنة ٤٦٦ بقرية من أعمال مرسية يقال لها أوريولة وتوفي شهيداً بالمرية عند تغلب العدو عليها صبيحة الجمعة العشرين من جمادى الأولى سنة ٥٤٢ {cite:nafh-tib-maqqari p. 466}."
  en: "Abu Muhammad Abdallah ibn Ali al-Rushati al-Mariyyi — the renowned imam of Almeria, devoted to hadith, rijal and chronicles, author of Iqtibas al-Anwar on the genealogies of Companions and transmitters in the manner of Ibn al-Sam'ani's Ansab; born at Orihuela in 466 and martyred in the sack of Almeria on Friday morning, 20 Jumada I 542 {cite:nafh-tib-maqqari p. 466}."
  fr: "Abu Muhammad Abdallah ibn Ali al-Rushati al-Mariyyi – le célèbre imam d’Almeria, consacré aux hadiths, aux rijals et aux chroniques, auteur d’Iqtibas al-Anwar sur les généalogies des compagnons et des transmetteurs à la manière de l’Ansab d’Ibn al-Sam’ani ; Né à Orihuela en 466 et martyrisé dans le sac d'Almeria vendredi matin, 20 Jumada I 542 {cite:nafh-tib-maqqari p. 466}."
  es: "Abu Muhammad Abdallah ibn Ali al-Rushati al-Mariyyi — el renombrado imán de Almería, dedicado al hadiz, el rijal y las crónicas, autor de Iqtibas al-Anwar sobre las genealogías de los Compañeros y transmisores al estilo del Ansab de Ibn al-Sam'ani; nació en Orihuela en 466 y fue martirizado en el saqueo de Almería el viernes por la mañana, 20 de Jumada I 542 {cite:nafh-tib-maqqari p. 466}."
