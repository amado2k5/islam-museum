label: { ar: "الرشاطي المري" }
summary:
  ar: "أبو محمد عبد الله بن علي بن عبد الله بن علي بن خلف بن أحمد بن عمر اللخمي الرشاطي المريي؛ الإمام المشهور وكانت له عناية كبيرة بالحديث والرجال والرواة والتواريخ، وهو صاحب كتاب اقتباس الأنوار والتماس الأزهار في أنساب الصحابة ورواة الآثار على أسلوب كتاب ابن السمعاني الأنساب، وولد سنة ٤٦٦ بقرية من أعمال مرسية يقال لها أوريولة وتوفي شهيداً بالمرية عند تغلب العدو عليها صبيحة الجمعة العشرين من جمادى الأولى سنة ٥٤٢ {cite:nafh-tib-maqqari p. 466}."
  en: "Abu Muhammad Abdallah ibn Ali al-Rushati al-Mariyyi — the renowned imam of Almeria, devoted to hadith, rijal and chronicles, author of Iqtibas al-Anwar on the genealogies of Companions and transmitters in the manner of Ibn al-Sam'ani's Ansab; born at Orihuela in 466 and martyred in the sack of Almeria on Friday morning, 20 Jumada I 542 {cite:nafh-tib-maqqari p. 466}."
