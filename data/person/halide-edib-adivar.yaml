summary:
  ar: "روائية وكاتبة تركية (1884–1964) من أبرز وجوه النهضة الأدبية والحركة الوطنية التركية؛ كتبت روايات نقدت فيها وضع المرأة التركية ودافعت عن القومية التركية والطورانية، وخدمت مفتشة للمدارس في سوريا ولبنان أثناء الحرب العالمية الأولى — ومنها إدارتها المثيرة للجدل لميتم أنطورة — ثم انضمت إلى حرب الاستقلال وشاركت في تأسيس وكالة الأناضول، وأصبحت لاحقًا أستاذة للأدب الإنجليزي في جامعة إسطنبول ونائبة في البرلمان."
  en: "Turkish novelist and writer (1884–1964), a leading figure of the Turkish literary revival and national movement. Her novels criticised the low status of Turkish women and advocated Turkish nationalism and Turanism; she served as a schools inspector in Syria and Lebanon during the First World War — including her contested administration of the Antoura orphanage — then joined the War of Independence, co-founded the Anadolu Agency, and later became professor of English literature at Istanbul University and a member of parliament."
  ur: "ترک ناول نگار اور مصنفہ (1884–1964)، ترک ادبی نشاۃ اور قومی تحریک کی نمایاں شخصیت؛ اپنے ناولوں میں ترک خواتین کی حالت پر تنقید اور ترک قوم پرستی کی حمایت کی، پہلی عالمی جنگ میں شام و لبنان میں مدارس کی مفتش رہیں — انطورة کے یتیم خانے کا متنازع انتظام بھی اسی دور میں تھا — پھر جنگِ آزادی میں شامل ہوئیں، انادولو ایجنسی کی شریک بانی بنیں، اور بعد میں استنبول یونیورسٹی میں انگریزی ادب کی پروفیسر اور رکنِ پارلیمان رہیں۔"
