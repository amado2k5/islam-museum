label: { ar: "أبو الحسن الباخرزي صاحب دمية القصر" }
summary:
  ar: "أبو الحسن الباخرزي الرئيس الأديب علي بن الحسن بن أبي الطيب، مؤلف كتاب «دمية القصر وعصرة أهل العصر» وهو ذيل «يتيمة الدهر» للثعالبي جمع فيها خلقاً كثيراً؛ كان رأساً في الكتابة والإنشاء والشعر، اشتغل في شبابه بالفقه على مذهب الشافعي ولازم درس أبي محمد الجويني ثم اختلف إلى ديوان الرسائل، وغلب أدبه على فقهه فاشتهر بالأدب، وله ديوان شعر مجلد كبير الغالب عليه الجودة؛ ووضع على الدمية أبو الحسن علي بن زيد كتاباً سماه «وشاح الدمية»؛ وباخرز ناحية من نواحي نيسابور؛ وقتل الباخرزي في الأندلس وذهب دمه هدراً سنة سبع وستين وأربعمائة {cite:shadharat-dhahab p. 336-337}."
  en: "Abu al-Hasan al-Bakharzi Ali b. al-Hasan — author of *Dumyat al-qasr*, the supplement to al-Tha'alibi's *Yatimat al-dahr* gathering the age's notables; a master of secretaryship, composition and verse who began in Shafi'i fiqh under Abu Muhammad al-Juwayni then moved to the chancery, his adab outshining his law; left a large good diwan; killed in al-Andalus unavenged in 467 {cite:shadharat-dhahab p. 336-337}."
