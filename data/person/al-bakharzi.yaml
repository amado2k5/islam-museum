id: person/al-bakharzi
class: person
label: { ar: "أبو الحسن الباخرزي صاحب دمية القصر", en: "Abu al-Hasan al-Bakharzi, author of Dumyat al-qasr", fr: "Abu al-Hasan al-Bakharzi, auteur de Dumyat al-qasr", es: "Abu al-Hasan al-Bakharzi, author of Dumyat al-qasr", ur: "ابو الحسن البخارزی، دمیۃ القصر کے مصنف" }
summary:
  ar: "أبو الحسن الباخرزي الرئيس الأديب علي بن الحسن بن أبي الطيب، مؤلف كتاب «دمية القصر وعصرة أهل العصر» وهو ذيل «يتيمة الدهر» للثعالبي جمع فيها خلقاً كثيراً؛ كان رأساً في الكتابة والإنشاء والشعر، اشتغل في شبابه بالفقه على مذهب الشافعي ولازم درس أبي محمد الجويني ثم اختلف إلى ديوان الرسائل، وغلب أدبه على فقهه فاشتهر بالأدب، وله ديوان شعر مجلد كبير الغالب عليه الجودة؛ ووضع على الدمية أبو الحسن علي بن زيد كتاباً سماه «وشاح الدمية»؛ وباخرز ناحية من نواحي نيسابور؛ وقتل الباخرزي في الأندلس وذهب دمه هدراً سنة سبع وستين وأربعمائة {cite:shadharat-dhahab p. 336-337}."
  en: "Abu al-Hasan al-Bakharzi Ali b. al-Hasan — author of *Dumyat al-qasr*, the supplement to al-Tha'alibi's *Yatimat al-dahr* gathering the age's notables; a master of secretaryship, composition and verse who began in Shafi'i fiqh under Abu Muhammad al-Juwayni then moved to the chancery, his adab outshining his law; left a large good diwan; killed in al-Andalus unavenged in 467 {cite:shadharat-dhahab p. 336-337}."
  fr: "Abu al-Hasan al-Bakharzi Ali ibn al-Hasan — auteur de Dumyat al-qasr, supplément à la Yatimat al-dahr d’al-Tha’alibi réunissant les notables du temps ; maître du secrétariat, de la composition et des vers, il commença par le fiqh chaféite auprès d’Abu Muhammad al-Juwayni avant de passer à la chancellerie, ses lettres éclipsant son droit ; il laissa un grand et bon diwan ; tué en al-Andalus sans être vengé en 467 H {cite:shadharat-dhahab p. 336-337}."
  es: "Abu al-Hasan al-Bakharzi Ali b. al-Hasan — autor de *Dumyat al-qasr*, el suplemento de *Yatimat al-dahr* de al-Tha'alibi que reúne a los notables de la época; un maestro de la secretaría, la composición y la poesía que comenzó en el fiqh shafi'i con Abu Muhammad al-Juwayni y luego pasó a la cancillería, su adab eclipsando su ley; dejó un gran y buen diwan; asesinado en al-Andalus sin venganza en 467 {cite:shadharat-dhahab p. 336-337}."
  ur: "ابو الحسن البخارزی علی ابن۔ الحسن - *دمیۃ القصر* کا مصنف، الثعلبی کی *یعتمۃ الدہر* کا ضمیمہ جس میں عمر کے قابل ذکر افراد کو جمع کیا گیا ہے۔ ابو محمد الجوینی کے ماتحت شافعی فقہ میں شروع ہونے والے سکریٹری شپ، کمپوزیشن اور آیت کا ایک ماہر، اس کے بعد اس کا ادب اس کے قانون سے بالاتر تھا۔ ایک بڑا اچھا دیوان چھوڑا۔ 467 میں اندلس میں قتل کیا گیا 336-337}۔"
  tr: "Ebu el-Hasan el-Bakharzi, baş yazar Ali ibn el-Hasan ibn Abi el-Tayyib, el-Tha'alibi'nin \"Yatimat el-Dahr\" adlı eserinin eki olan \"Dumyat el-Kasr ve Esrat Ehl el-Esr\" kitabının yazarı; içinde birçok şeyi bir araya getirmiştir; yazarlık, kompozisyon ve şiirde öncüydü. Gençliğinde Şafiî mezhebine göre fıkıh eğitimi aldı ve Ebu Muhammed el-Cüveyni'nin derslerine katıldı, daha sonra Divan el-Rasayil'e sık sık gitti ve edebiyatı fıkıhının önüne geçti, böylece edebiyat alanında ünlendi ve çoğunluğu yüksek kalitede olmak üzere çok sayıda şiiri vardır; ve Ebu el-Hasan Ali ibn Zayd, \"Şahah el-Dumyah\" adlı bir kitap yazmıştır; ve Bakharz, Nişapur'un bir bölgesidir; Ve el-Bakharzi, 467 yılında Endülüs'te öldürüldü ve kanı boş yere döküldü. {kaynak: Shadharat-dhahab s. 336-337}"
  id: "Abu al-Hasan al-Bakharzi, penulis utama Ali ibn al-Hasan ibn Abi al-Tayyib, penulis buku “Dumyat al-Qasr wa-Asrat Ahl al-Asr” yang merupakan lampiran dari “Yatimat al-Dahr” karya al-Tha’alibi, di mana ia mengumpulkan banyak hal; ia adalah seorang pemimpin dalam bidang penulisan, komposisi, dan puisi. Di masa mudanya, ia mempelajari ilmu hukum menurut mazhab Syafi'i dan mengikuti pelajaran Abu Muhammad al-Juwayni, kemudian ia sering mengunjungi Diwan al-Rasa’il, dan kepenulisannya lebih menonjol daripada ilmu hukumnya, sehingga ia menjadi terkenal dalam bidang sastra, dan ia memiliki banyak sekali puisi, sebagian besar berkualitas tinggi; dan Abu al-Hasan Ali ibn Zayd menulis sebuah buku tentang boneka yang disebut “Shahah al-Dumyah”; dan Bakharz adalah sebuah wilayah di Nishapur; dan al-Bakharzi terbunuh di Andalusia dan darahnya tertumpah dengan sia-sia pada tahun empat ratus enam puluh tujuh {cite:shadharat-dhahab p. 336-337}."
