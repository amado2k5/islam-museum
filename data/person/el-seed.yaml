summary:
  ar: "فنان خطّ وغرافيتي فرنسي-تونسي، وُلد سنة 1981 في لو شيناي قرب باريس لأسرة تونسية، ولم يتعلّم قراءة العربية الفصحى وكتابتها حتى مراهقته حين تاق إلى جذوره. اشتقّ اسمه الفني من مسرحية «السيد» الفرنسية. يمزج الخطّ العربي بالغرافيتي فيما يسمّيه «الكاليغرافيتي»، ومن أشهر أعماله رسم مئذنة جامع الجارة بقابس سنة 2012 بآية قرآنية عن التعارف بين الشعوب، ومشروع «إدراك» (2016) الذي غطّى نحو خمسين مبنى في حي منشية ناصر بالقاهرة، ونال جائزة اليونسكو-الشارقة للثقافة العربية سنة 2017، وهو مقيم في دبي."
  en: "French-Tunisian calligraphy and graffiti artist, born in 1981 in Le Chesnay, near Paris, to a Tunisian family; he did not learn to read or write standard Arabic until his teens, when he reached for his roots. His artist name derives from the French play Le Cid. He fuses Arabic calligraphy with graffiti in what he calls 'calligraffiti'. His best-known works are the 2012 painting of the Jara Mosque minaret in Gabes with a Qur'anic verse on peoples knowing one another, and Perception (2016), an anamorphic work across some fifty buildings in Cairo's Manshiyat Nasr district. He received the UNESCO-Sharjah Prize for Arab Culture in 2017 and is based in Dubai."
  ur: "فرانسیسی-تیونسی خطاطی و گرافٹی فنکار، 1981 میں پیرس کے قریب لو شینای میں ایک تیونسی خاندان میں پیدا ہوئے؛ معیاری عربی پڑھنا لکھنا انھوں نے نوعمری میں سیکھا جب اپنے اصل کی طرف رجوع ہوا۔ ان کا فنی نام فرانسیسی ڈرامے «السید» سے ماخوذ ہے۔ وہ عربی خطاطی اور گرافٹی کے امتزاج کو «کیلی گرافٹی» کہتے ہیں۔ ان کے مشہور اعمال میں 2012 میں قابس کی جارہ مسجد کے مینار پر اقوام کے باہمی تعارف کی قرآنی آیت کی مصوری اور قاہرہ کے منصیۃ ناصر محلے کی تقریباً پچاس عمارتوں پر پھیلا کام «ادراک» (2016) شامل ہیں۔ انھیں 2017 میں یونیسکو-شارجہ انعام برائے عرب ثقافت ملا اور وہ دبئی میں مقیم ہیں۔"
