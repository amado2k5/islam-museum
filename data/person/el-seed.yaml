summary:
  ar: "فنان خطّ وغرافيتي فرنسي-تونسي، وُلد سنة 1981 في لو شيناي قرب باريس لأسرة تونسية، ولم يتعلّم قراءة العربية الفصحى وكتابتها حتى مراهقته حين تاق إلى جذوره. اشتقّ اسمه الفني من مسرحية «السيد» الفرنسية. يمزج الخطّ العربي بالغرافيتي فيما يسمّيه «الكاليغرافيتي»، ومن أشهر أعماله رسم مئذنة جامع الجارة بقابس سنة 2012 بآية قرآنية عن التعارف بين الشعوب، ومشروع «إدراك» (2016) الذي غطّى نحو خمسين مبنى في حي منشية ناصر بالقاهرة، ونال جائزة اليونسكو-الشارقة للثقافة العربية سنة 2017، وهو مقيم في دبي."
  en: "French-Tunisian calligraphy and graffiti artist, born in 1981 in Le Chesnay, near Paris, to a Tunisian family; he did not learn to read or write standard Arabic until his teens, when he reached for his roots. His artist name derives from the French play Le Cid. He fuses Arabic calligraphy with graffiti in what he calls 'calligraffiti'. His best-known works are the 2012 painting of the Jara Mosque minaret in Gabes with a Qur'anic verse on peoples knowing one another, and Perception (2016), an anamorphic work across some fifty buildings in Cairo's Manshiyat Nasr district. He received the UNESCO-Sharjah Prize for Arab Culture in 2017 and is based in Dubai."
  ur: "فرانسیسی-تیونسی خطاطی و گرافٹی فنکار، 1981 میں پیرس کے قریب لو شینای میں ایک تیونسی خاندان میں پیدا ہوئے؛ معیاری عربی پڑھنا لکھنا انھوں نے نوعمری میں سیکھا جب اپنے اصل کی طرف رجوع ہوا۔ ان کا فنی نام فرانسیسی ڈرامے «السید» سے ماخوذ ہے۔ وہ عربی خطاطی اور گرافٹی کے امتزاج کو «کیلی گرافٹی» کہتے ہیں۔ ان کے مشہور اعمال میں 2012 میں قابس کی جارہ مسجد کے مینار پر اقوام کے باہمی تعارف کی قرآنی آیت کی مصوری اور قاہرہ کے منصیۃ ناصر محلے کی تقریباً پچاس عمارتوں پر پھیلا کام «ادراک» (2016) شامل ہیں۔ انھیں 2017 میں یونیسکو-شارجہ انعام برائے عرب ثقافت ملا اور وہ دبئی میں مقیم ہیں۔"
  es: "Artista franco-tunecino de caligrafía y grafiti, nacido en 1981 en Le Chesnay, cerca de París, en el seno de una familia tunecina. No aprendió a leer ni a escribir árabe estándar hasta su adolescencia, cuando buscó sus raíces. Su nombre artístico proviene de la obra de teatro francesa Le Cid. Fusiona la caligrafía árabe con el grafiti en lo que él denomina «caligrafiti». Sus obras más conocidas son la pintura de 2012 del minarete de la mezquita Jara en Gabes con un versículo coránico sobre el conocimiento mutuo entre los pueblos, y Percepción (2016), una obra anamórfica que abarca unos cincuenta edificios en el distrito de Manshiyat Nasr de El Cairo. Recibió el Premio UNESCO-Sharjah de Cultura Árabe en 2017 y reside en Dubái."
  fr: "Artiste franco-tunisien de calligraphie et de graffiti, né en 1981 au Chesnay, près de Paris, dans une famille tunisienne, il n'a appris à lire et à écrire l'arabe standard qu'à l'adolescence, période où il s'est tourné vers ses racines. Son nom d'artiste est inspiré de la pièce de théâtre française Le Cid. Il fusionne la calligraphie arabe et le graffiti dans un style qu'il nomme « calligraffiti ». Parmi ses œuvres les plus connues figurent la peinture du minaret de la mosquée Jara à Gabès (2012), ornée d'un verset coranique sur la connaissance mutuelle des peuples, et Perception (2016), une œuvre anamorphique s'étendant sur une cinquantaine de bâtiments du quartier Manshiyat Nasr au Caire. Lauréat du Prix UNESCO-Sharjah pour la culture arabe en 2017, il vit et travaille à Dubaï."
  tr: "Fransız-Tunuslu bir hat ve grafiti sanatçısı olan Trus, 1981'de Paris yakınlarındaki Le Chignay'da Tunuslu bir ailede doğmuş, klasik Arapçayı okumayı ve yazmayı ancak ergenlik çağında, köklerine özlem duyduğu dönemde öğrenmiştir. Sanatsal adı, Fransız oyunu 'The Gentleman'dan türetilmiştir. Arap kaligrafisini kendi 'hattat' dediği şeyle harmanlıyor. En ünlü eserleri arasında 2012'de Gabes'teki Jarrah Camii'nin minaresinin çizimi ve halklar arasındaki tanışmayı konu alan Kur'an ayeti ile 2016'da gerçekleştirdiği 'Edrake' projesi yer alıyor; bu proje Kahire'nin Manshiyet Nasser semtinde yaklaşık elli binayı kapsıyor. 2017'de UNESCO-Sharjah Arap Kültürü Ödülü'nü aldı ve Dubai'de ikamet ediyor."
  id: "Seorang seniman kaligrafi dan grafiti Prancis-Tunisia, lahir pada tahun 1981 di Le Chignay dekat Paris dari keluarga Tunisia, ia baru belajar membaca atau menulis bahasa Arab klasik di masa remajanya, ketika ia merindukan akar budayanya. Nama artistiknya diambil dari drama Prancis 'The Gentleman.' Ia memadukan kaligrafi Arab dengan apa yang ia sebut 'kaligrafi.' Di antara karya-karyanya yang paling terkenal adalah gambar menara Masjid Jarrah di Gabes pada tahun 2012 dengan ayat Al-Qur'an tentang perkenalan antar bangsa, dan proyek 'Edrake' (2016), yang mencakup sekitar lima puluh bangunan di distrik Manshiyet Nasser, Kairo. Ia menerima Penghargaan UNESCO-Sharjah untuk Budaya Arab pada tahun 2017, dan ia tinggal di Dubai."
