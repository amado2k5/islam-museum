id: person/al-hajjaj-ibn-matar
class: person
label: { ar: "الحجاج بن مطر", en: "Al Hajjaj Ibn Matar", fr: "Al-Hajjaj ibn Matar", es: "Al Hajjaj Ibn Matar", ur: "الحجاج ابن مطر" }
summary:
  ar: "الحجاج بن مطر فسر للمأمون وهو الذي نقل المجسطي وإقليدس، وكان فيمن أخرجه المأمون إلى بلد الروم لجلب الكتب القديمة {cite:fihrist-ibn-al-nadim p. 339-341}. ونقل كتاب إقليدس في أصول الهندسة نقلين أحدهما يعرف بالهاروني وهو الأول والثاني المأموني وعليه يعول {cite:fihrist-ibn-al-nadim p. 371}"
  en: "Translator of the Almagest and Euclid for al-Ma'mun {cite:fihrist-ibn-al-nadim}"
  fr: "Traducteur de l’Almageste et d’Euclide pour al-Ma’mun {cite:fihrist-ibn-al-nadim}"
  es: "Traductor del Almagesto y de Euclides para al-Ma'mun {cite:fihrist-ibn-al-nadim}"
  ur: "الماجسٹ اور یوکلیڈ برائے المامون کے مترجم"
  tr: "El-Haccac ibn Matar, el-Ma'mun için tercümanlık yapmış ve Batlamyus'un Almagest'ini ve Öklid'in eserlerini tercüme etmiştir. El-Ma'mun'un eski kitaplar edinmek için Bizans İmparatorluğu'na gönderdiği kişiler arasındaydı {kaynak:fihrist-ibn-al-nadim s. 339-341}. Öklid'in Geometri Elemanları'nı iki versiyonda tercüme etmiştir; bunlardan ilki el-Haruni olarak bilinir, ikincisi ise el-Ma'muni'dir ve ikincisi esas alınır {kaynak:fihrist-ibn-al-nadim s. 371}."
  id: "Al-Hajjaj ibn Matar menjadi penerjemah untuk al-Ma'mun, dan dialah yang menerjemahkan Almagest karya Ptolemy dan karya-karya Euclid. Dia termasuk di antara orang-orang yang dikirim al-Ma'mun ke Kekaisaran Bizantium untuk memperoleh buku-buku kuno {cite:fihrist-ibn-al-nadim hlm. 339-341}. Dia menerjemahkan Elemen Geometri karya Euclid dalam dua versi, satu dikenal sebagai al-Haruni, yang merupakan versi pertama, dan yang kedua al-Ma'muni, yang menjadi acuan versi kedua {cite:fihrist-ibn-al-nadim hlm. 371}."
