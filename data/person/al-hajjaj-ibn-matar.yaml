summary:
  ar: "الحجاج بن مطر فسر للمأمون وهو الذي نقل المجسطي وإقليدس، وكان فيمن أخرجه المأمون إلى بلد الروم لجلب الكتب القديمة {cite:fihrist-ibn-al-nadim p. 339-341}. ونقل كتاب إقليدس في أصول الهندسة نقلين أحدهما يعرف بالهاروني وهو الأول والثاني المأموني وعليه يعول {cite:fihrist-ibn-al-nadim p. 371}"
  en: "Translator of the Almagest and Euclid for al-Ma'mun {cite:fihrist-ibn-al-nadim}"
