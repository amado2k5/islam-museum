summary:
  ar: "علّامة في العربية ومحقق وأديب مصري (1909–1997) يُكنى أبا فهر، صاحب «منهج التذوق»، أثار كتابه «المتنبي» (1936) ضجة بمنهجه، وحقّق ستة عشر جزءًا من تفسير الطبري و«طبقات فحول الشعراء» و«دلائل الإعجاز»، وخاض معركتين أدبيتين مع طه حسين ولويس عوض، ونال جائزة الملك فيصل للغة العربية والأدب (1984)."
  en: "Egyptian scholar of Arabic, editor and writer (1909–1997), known as Abu Fihr, who developed a 'method of tasting' in literary study; his 'al-Mutanabbi' (1936) caused a stir, he edited sixteen volumes of al-Tabari's Tafsir, 'Tabaqat Fuhul al-Shu'ara' and 'Dala'il al-I'jaz', fought two literary controversies with Taha Husayn and Louis Awad, and received the King Faisal Prize for Arabic Language and Literature (1984)."
  ur: "عربی زبان کے مصری علامہ، محقق اور ادیب ⁦(1909ء–1997ء)⁩، کنیت ابو فہر، «منہجِ تذوق» کے صاحب؛ ان کی کتاب «المتنبی» ⁦(1936ء)⁩ نے ہلچل مچائی، انھوں نے تفسیرِ طبری کی سولہ جلدیں، «طبقات فحول الشعراء» اور «دلائل الاعجاز» مرتب کیں، طہ حسین اور لویس عوض سے دو ادبی معرکے لڑے، اور عربی زبان و ادب کا شاہ فیصل انعام ⁦(1984ء)⁩ پایا۔"
