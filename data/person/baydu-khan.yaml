summary:
  ar: "بيدو، خامس الإلخانات المغول في فارس وحفيد هولاكو، حكم بضعة أشهر فقط سنة 694هـ/1295م بعد إسقاط كيخاتو. دخل في مؤامرة أمراء المغول على الإلخان، ثم دعوه إلى العرش، فعارضه ابن عمه غازان. وانتهى الأمر بلا قتال حاسم لصالح غازان بعد إسلامه بمشورة قائده نوروز، وقُتل بيدو في نخجوان وهو يحاول الفرار {cite:encyclopaedia-of-islam-2 vol. 1 p. 1189} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  en: "Baydu, a grandson of Hulagu, was the fifth Mongol Ilkhan of Persia, reigning only a few months in 694/1295 after Gaykhatu's deposition. He joined the amirs' conspiracy against the Ilkhan and was invited to the throne, where his second cousin Ghazan opposed him. The matter was settled in Ghazan's favour without bloodshed after Ghazan adopted Islam at his general Nawruz's suggestion, and Baydu was put to death at Nakhchiwan while trying to escape {cite:encyclopaedia-of-islam-2 vol. 1 p. 1189} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  ur: "بیدو ہلاکو کے پوتے اور ایران کے پانچویں منگول ایل خان تھے، اور گیخاتو کی معزولی کے بعد 694ھ/1295ء میں صرف چند ماہ حکمران رہے۔ وہ منگول امیروں کی سازش میں شریک ہوئے اور انہیں تخت کی دعوت دی گئی، مگر ان کے دور کے چچازاد غازان نے مخالفت کی۔ غازان نے اپنے سالار نوروز کے مشورے پر اسلام اختیار کیا تو معاملہ بغیر خونریزی کے غازان کے حق میں طے ہو گیا، اور بیدو نخجوان میں فرار کی کوشش کے دوران مارے گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1189} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
