  ar: "\u0645\u0646\u0634\u062f \u0648\u0645\u0628\u062a\u0647\u0644 \u0648\u0642\u0627\u0631\u0626 \u0645\u0635\u0631\u064a (1920\u20131976)\u060c \u0635\u0627\u062d\u0628 \u0645\u062f\u0631\u0633\u0629 \u0641\u064a \u0627\u0644\u0627\u0628\u062a\u0647\u0627\u0644\u0627\u062a\u060c \u0627\u0642\u062a\u0631\u0646 \u0635\u0648\u062a\u0647 \u0628\u0625\u0641\u0637\u0627\u0631 \u0631\u0645\u0636\u0627\u0646 \u0641\u064a \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0645\u0635\u0631\u064a\u0629\u060c \u0648\u0633\u062c\u0651\u0644 \u0633\u062a\u0629 \u0627\u0628\u062a\u0647\u0627\u0644\u0627\u062a \u0645\u0646 \u0623\u0644\u062d\u0627\u0646 \u0628\u0644\u064a\u063a \u062d\u0645\u062f\u064a \u0645\u0646\u0647\u0627 \u00ab\u0645\u0648\u0644\u0627\u064a \u0625\u0646\u064a \u0628\u0628\u0627\u0628\u0643\u00bb\u060c \u0648\u062a\u0648\u0641\u064a \u0641\u064a 14 \u0641\u0628\u0631\u0627\u064a\u0631 1976\u060c \u0648\u0645\u064f\u0646\u062d \u0628\u0639\u062f \u0648\u0641\u0627\u062a\u0647 \u0648\u0633\u0627\u0645 \u0627\u0644\u062f\u0648\u0644\u0629 (1979) \u0648\u0648\u0633\u0627\u0645 \u0627\u0644\u062c\u0645\u0647\u0648\u0631\u064a\u0629 (1989)."
  en: "Egyptian munshid, supplicant and reciter (1920\u20131976), founder of a school of ibtihalat whose voice became part of the Ramadan iftar on Egyptian radio; he recorded six supplications composed by Baligh Hamdi, among them 'Mawlay inni bi-babik', died on 14 February 1976 and was given the State Order (1979) and the Order of the Republic (1989) posthumously."
