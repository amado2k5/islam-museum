summary:
  ar: "منشد ومبتهل وقارئ مصري (1920–1976)، صاحب مدرسة في الابتهالات، اقترن صوته بإفطار رمضان في الإذاعة المصرية، وسجّل ستة ابتهالات من ألحان بليغ حمدي منها «مولاي إني ببابك»، وتوفي في 14 فبراير 1976، ومُنح بعد وفاته وسام الدولة (1979) ووسام الجمهورية (1989)."
  en: "Egyptian munshid, supplicant and reciter (1920–1976), founder of a school of ibtihalat whose voice became part of the Ramadan iftar on Egyptian radio; he recorded six supplications composed by Baligh Hamdi, among them 'Mawlay inni bi-babik', died on 14 February 1976 and was given the State Order (1979) and the Order of the Republic (1989) posthumously."
  ur: "مصری منشد، مبتہل اور قاری ⁦(1920ء–1976ء)⁩، ابتہالات کے ایک مکتب کے بانی، جن کی آواز مصری ریڈیو پر افطارِ رمضان کا حصہ بنی؛ انھوں نے بلیغ حمدی کی دھنوں میں چھ ابتہالات ریکارڈ کیں، جن میں «مولای انی ببابک» ہے، 14 فروری 1976ء کو فوت ہوئے، اور بعد از وفات انھیں نشانِ ریاست ⁦(1979ء)⁩ اور نشانِ جمہوریہ ⁦(1989ء)⁩ دیے گئے۔"
  es: "Munshid, suplicante y recitador egipcio (1920-1976), fundador de una escuela de ibtihalat cuya voz pasó a formar parte del iftar de Ramadán en la radio egipcia; grabó seis súplicas compuestas por Baligh Hamdi, entre ellas 'Mawlay inni bi-babik', murió el 14 de febrero de 1976 y recibió póstumamente la Orden del Estado (1979) y la Orden de la República (1989)."
  fr: "Munshid égyptien, suppliant et récitant (1920-1976), fondateur d'une école d'ibtihalat dont la voix est devenue une partie de l'iftar du Ramadan à la radio égyptienne; il a enregistré six supplications composées par Baligh Hamdi, parmi lesquelles 'Mawlay inni bi-babik', est décédé le 14 février 1976 et a reçu à titre posthume l'Ordre d'État (1979) et l'Ordre de la République (1989)."
  tr: "Mısırlı bir şarkıcı, dua ve okuyan (1920–1976), bir dua okulunun sahibi. Sesi Mısır radyosunda Ramazan iftarıyla ilişkilendirildi ve Baligh Hamdi tarafından bestelenen altı dua kaydetti; bunlar arasında 'Moulay I at your door' da vardı. 14 Şubat 1976'da vefat etti ve ölümünden sonra Devlet Madalyası (1979) ile Cumhuriyet Nişanı (1989) ile ödüllendirildi."
  id: "Seorang penyanyi, pedoa, dan pembaca bahasa Mesir (1920–1976), pemilik sekolah permohonan. Suaranya dikaitkan dengan iftar Ramadan di radio Mesir, dan ia merekam enam doa yang dikomposisikan oleh Baligh Hamdi, termasuk 'My Moulay I am at your door.' Ia meninggal dunia pada 14 Februari 1976, dan dianugerahi secara anumerta Medali Negara (1979) serta Ordo Republik (1989)."
