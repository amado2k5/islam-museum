  ar: "أول الرسل إلى أهل الأرض في حديث الشفاعة الطويل عند البخاري؛ يأتيه الناس يوم القيامة أول المستشفعين فيقول لست هاهنا فيحيلهم على إبراهيم {cite:sahih-al-bukhari 4712}."
