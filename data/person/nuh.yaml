  ur: "بخاری کی طویل شفاعت والی حدیث میں زمین والوں کے لیے پہلا رسول - قیامت کے دن بنی نوع انسان کے پہلے نبی تشریف لائے {حوالہ: صحیح البخاری 4712}۔"
  tr: "Yeryüzü halkına ilk elçi, El-Buhari'nin uzun şeafiyet hadisinde şöyle der: Diriliş gününde, insanlar ona ilk kez aracılık isteyecek ve 'Ben burada değilim' diyecekler, o da onları İbrahim'e yönlendirir {atıf:sahih-al-bukhari 4712}."
  id: "Utusan pertama kepada umat bumi dalam hadits perantaraan panjang Al-Bukhari berkata: Pada Hari Kebangkitan, orang-orang akan datang kepada-Nya sebagai yang pertama memohon perantaraan dan berkata, 'Aku tidak di sini,' dan ia merujuk mereka kepada Abraham {cite:sahih-al-bukhari 4712}."
