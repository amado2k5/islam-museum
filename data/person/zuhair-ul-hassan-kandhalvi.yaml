summary:
  ar: "داعية هندي من قادة جماعة التبليغ. نشأ في نظام الدين بدلهي ودرس في سهارنبور، ويُعد من أعضاء مجلس الشورى العالمي للجماعة بعد أبيه زبير الحسن، ودار حول قيادة الجماعة نزاع بين أنصاره وأنصار سعد كندهلوي."
  en: "Indian preacher among the leaders of the Tablighi Jamaat. Raised in Nizamuddin, Delhi, and trained in Saharanpur, he sits in the movement's global shura after his father Zubair ul-Hasan; the movement's leadership has been disputed between his followers and those of Saad Kandhalvi."
  ur: "تبلیغی جماعت کے رہنماؤں میں سے ایک بھارتی مبلغ۔ دہلی کے نظام الدین میں پرورش پائی اور سہارنپور میں تعلیم حاصل کی؛ اپنے والد زبیر الحسن کے بعد تحریک کے عالمی شوریٰ میں شامل؛ جماعت کی قیادت ان کے اور سعد کاندھلوی کے پیروکاروں کے درمیان متنازع رہی ہے۔"
  es: "Predicador indio entre los líderes del Tablighi Jamaat. Criado en Nizamuddin, Delhi, y formado en Saharanpur, forma parte de la shura global del movimiento tras su padre, Zubair ul-Hasan; el liderazgo del movimiento ha sido objeto de disputa entre sus seguidores y los de Saad Kandhalvi."
  fr: "Prédicateur indien parmi les dirigeants de la Tablighi Jamaat. Élevé à Nizamuddin, à Delhi, et formé à Saharanpur, il siège au shura mondial du mouvement après son père, Zubair ul-Hasan; la direction du mouvement est contestée entre ses partisans et ceux de Saad Kandhalvi."
