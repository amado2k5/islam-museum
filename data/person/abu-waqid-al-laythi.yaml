summary:
  ar: "صحابي ليثي، حليف بني أسد؛ اختُلف في اسمه وفي شهوده بدراً، حمل لواء بني ليث وضمرة وسعد بن بكر يوم الفتح وحنين، وفي غزوة تبوك يستنفر قومه، ثم جاور بمكة سنة ومات، واختُلف في سنة وفاته بين ثمان وستين وخمس وثمانين."
  en: "A Laythi Companion, an ally of Banu Asad; his given name and his presence at Badr are both disputed. He carried the banner of Banu Layth, Damra and Sa'd ibn Bakr at the conquest and at Hunayn, and rallied his people for Tabuk; he then resided at Mecca for a year and died, with reports giving 68 or 85 AH."
  ur: "لیثی صحابی، بنو اسد کے حلیف؛ ان کا نام اور بدر میں شرکت دونوں متنازع ہیں؛ بنو لیث، ضمرہ اور سعد کا پرچم اٹھایا۔"
