summary:
  ar: "محمود درويش ⁦(1941–2008)⁩ الشاعر الوطني الفلسطيني، رفع المنفى والوطن إلى شعرية عربية حديثة كونية. من دواوينه «أوراق الزيتون» و«مديح الظل العالي» و«جدارية» ونصوصه النثرية «ذاكرة للنسيان» و«في حضرة الغياب»."
  en: "Mahmoud Darwish (1941–2008) was Palestine's national poet, who raised exile and homeland into universal modern Arabic poetry. His collections include Leaves of Olives, Mural (Jidariyya) and A Praise of the High Shadow, and prose works such as Memory for Forgetfulness and In the Presence of Absence."
  ur: "محمود درویش ⁦(1941–2008)⁩ فلسطین کے قومی شاعر تھے جنہوں نے جلاوطنی اور وطن کو جدید عربی شاعری کی عالمگیر سطح پر اٹھایا۔ مجموعوں میں «أوراق الزيتون»، «جدارية» اور «مديح الظل العالي» اور نثری کتب «ذاكرة للنسيان» اور «في حضرة الغياب» شامل ہیں۔"
  es: "Mahmoud Darwish (1941-2008) fue el poeta nacional de Palestina, quien elevó el exilio y la patria a la categoría de poesía árabe moderna universal. Entre sus colecciones se encuentran Hojas de Olivo, Mural (Jidariyya) y Elogio de la Alta Sombra, así como obras en prosa como Memoria del Olvido y En Presencia de la Ausencia."
  fr: "Mahmoud Darwish (1941-2008) était le poète national palestinien, qui a élevé l'exil et la patrie au rang de thèmes universels dans sa poésie arabe moderne. Parmi ses recueils figurent Feuilles d'olivier, Murale (Jidariyya) et Éloge de l'ombre haute, ainsi que des œuvres en prose telles que Mémoire de l'oubli et En présence de l'absence."
