roles: [scholar, historian, preacher]
summary:
  ar: "عبد الرحمن بن علي بن الجوزي المؤرخ الواعظ صاحب تاريخ خلفاء بني العباس المنتهي إلى أيام الناصر. ولد ببغداد سنة عشر وخمس مئة أو قبلها ومنسوب إلى محلة بالبصرة تسمى محلة الجوز، حملته عمته إلى مسجد أبي الفضل بن ناصر وهو خاله فاعتنى به وأسمعه الحديث وحفظ القرآن وسمع من نحو سبعة وثمانين نفساً ووعظ من صغره ففاق فيه الأقران، وحكى غير مرة أن مجلسه حزر بمائة ألف وحضر مجلسه الخليفة المستضيء مرات من وراء الستر، وصنف في التفسير والحديث والفقه والزهد والوعظ والأخبار والتاريخ والطب تصانيف كثيرة شهيرة، توفي في سنة سبع وتسعين وخمس مئة {cite:shadharat-dhahab p. 809-810}. بدأ مسيرته في خلافة المكتفي بكفالة الوزير ابن هبيرة، وخلف شيخه أبا حكيم النهرواني في مدرستيه سنة ٥٥٦هـ، وبلغ ذروته سنة ٥٧٤هـ يدير خمس مدارس وقد صنّف أكثر من مئة وخمسين مصنفاً، ثم اعتُقل سنة ٥٩٠هـ ونُفي إلى واسط خمس سنين حتى أُطلق سنة ٥٩٥هـ بشفاعة أم الخليفة، فعاد إلى بغداد وتوفي بعد ذلك بقليل {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  en: "Abd al-Rahman ibn Ali ibn al-Jawzi (510–597/1116–1201), Hanbali jurisconsult, traditionist, historian and preacher, was one of the most famous Hanbalis of Baghdad, where he was born and died after a life of great intellectual, religious and political activity {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}. He began his career under al-Muktafi through the vizier Ibn Hubayra's patronage, succeeded his shaykh al-Nahrawani in two madrasas in 556, reached his zenith in 574 directing five madrasas with more than 150 works, was arrested in 590 and exiled to Wasit for five years, then freed in 595 through the caliph's mother and died soon after his return {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}. Ibn Rajab lists more than 200 of his works, among them the Muntazam history and the Hanbali polemic Talbis Iblis {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}."
  ur: "عبد الرحمٰن بن علی ابن الجوزی (510–597ھ/1116–1201ء) حنبلی فقیہ، محدث، مؤرخ اور واعظ، بغداد کے مشہور ترین حنابلہ میں سے تھے جہاں وہ پیدا ہوئے اور وفات پائی {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}۔ انھوں نے مکتفی کے دور میں ابن ہبیرہ کی سرپرستی سے آغاز کیا، 556ھ میں نہروانی کے جانشین ہوئے، 574ھ میں پانچ مدارس اور ڈیڑھ سو تصانیف کے ساتھ عروج پر رہے، 590ھ میں گرفتار ہو کر پانچ سال واسط جلاوطن رہے اور 595ھ میں رہا ہو کر واپس آئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}۔"
