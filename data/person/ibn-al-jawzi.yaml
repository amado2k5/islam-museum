summary:
  ar: "عبد الرحمن بن علي بن الجوزي المؤرخ الواعظ صاحب تاريخ خلفاء بني العباس المنتهي إلى أيام الناصر. ولد ببغداد سنة عشر وخمس مئة أو قبلها ومنسوب إلى محلة بالبصرة تسمى محلة الجوز، حملته عمته إلى مسجد أبي الفضل بن ناصر وهو خاله فاعتنى به وأسمعه الحديث وحفظ القرآن وسمع من نحو سبعة وثمانين نفساً ووعظ من صغره ففاق فيه الأقران، وحكى غير مرة أن مجلسه حزر بمائة ألف وحضر مجلسه الخليفة المستضيء مرات من وراء الستر، وصنف في التفسير والحديث والفقه والزهد والوعظ والأخبار والتاريخ والطب تصانيف كثيرة شهيرة، توفي في سنة سبع وتسعين وخمس مئة {cite:shadharat-dhahab p. 809-810}. بدأ مسيرته في خلافة المكتفي بكفالة الوزير ابن هبيرة، وخلف شيخه أبا حكيم النهرواني في مدرستيه سنة ٥٥٦هـ، وبلغ ذروته سنة ٥٧٤هـ يدير خمس مدارس وقد صنّف أكثر من مئة وخمسين مصنفاً، ثم اعتُقل سنة ٥٩٠هـ ونُفي إلى واسط خمس سنين حتى أُطلق سنة ٥٩٥هـ بشفاعة أم الخليفة، فعاد إلى بغداد وتوفي بعد ذلك بقليل {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}، وتذكر «تذكرة الحفاظ» في ترجمته ⁦(الجزء الرابع، ص ١٣٤٢)⁩ أن جده سُمي بالجوزي بجوزة كانت في داره بواسط، وأنه سمع من سبعة وثمانين نفساً ووعظ من نحو سنة خمس وعشرين ومائتين إلى أن مات، ومن تصانيفه «المغني» في علوم القرآن و«زاد المسير» في أربعة مجلدات و«تذكرة الأريب» و«الوجوه والنظائر» {cite:tabaqat-huffaz 4/1342}."
  en: "Abd al-Rahman ibn Ali ibn al-Jawzi (510–597/1116–1201), Hanbali jurisconsult, traditionist, historian and preacher, was one of the most famous Hanbalis of Baghdad, where he was born and died after a life of great intellectual, religious and political activity {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}. He began his career under al-Muktafi through the vizier Ibn Hubayra's patronage, succeeded his shaykh al-Nahrawani in two madrasas in 556, reached his zenith in 574 directing five madrasas with more than 150 works, was arrested in 590 and exiled to Wasit for five years, then freed in 595 through the caliph's mother and died soon after his return {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}. Ibn Rajab lists more than 200 of his works, among them the Muntazam history and the Hanbali polemic Talbis Iblis {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}. Al-Dhahabi's Tadhkirat al-Huffaz entry (part 4, p. 1342) records that his ancestor was called al-Jawzi after a walnut tree in the family house at Wasit, that he heard from eighty-seven named teachers and preached from about 525 to his death, and lists among his works al-Mughni on the sciences of the Qur'an, Zad al-Masir in four volumes, Tadhkirat al-Arib and al-Wujuh wa'l-Naza'ir {cite:tabaqat-huffaz 4/1342}."
  ur: "عبد الرحمٰن بن علی ابن الجوزی ⁦(510–597ھ/1116–1201ء)⁩ حنبلی فقیہ، محدث، مؤرخ اور واعظ، بغداد کے مشہور ترین حنابلہ میں سے تھے جہاں وہ پیدا ہوئے اور وفات پائی {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}۔ انھوں نے مکتفی کے دور میں ابن ہبیرہ کی سرپرستی سے آغاز کیا، 556ھ میں نہروانی کے جانشین ہوئے، 574ھ میں پانچ مدارس اور ڈیڑھ سو تصانیف کے ساتھ عروج پر رہے، 590ھ میں گرفتار ہو کر پانچ سال واسط جلاوطن رہے اور 595ھ میں رہا ہو کر واپس آئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}۔"
  es: "Abd al-Rahman ibn Ali ibn al-Jawzi (510–597/1116–1201), jurisconsulto hanbalí, tradicionalista, historiador y predicador, fue uno de los hanbalíes más famosos de Bagdad, donde nació y murió después de una vida de gran actividad intelectual, religiosa y política {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}. Comenzó su carrera bajo al-Muktafi a través del patrocinio del visir Ibn Hubayra, sucedió a su shaykh al-Nahrawani en dos madrasas en 556, alcanzó su cenit en 574 dirigiendo cinco madrasas con más de 150 obras, fue arrestado en 590 y exiliado a Wasit durante cinco años, luego liberado en 595 a través de la madre del califa y murió poco después de su regreso {cite:encyclopaedia-of-islam-2 vol. 3 págs. 783-784}. Ibn Rajab enumera más de 200 de sus obras, entre ellas la historia de Muntazam y la polémica hanbalí Talbis Iblis {cite:encyclopaedia-of-islam-2 vol. 3 pág. 784}. La entrada de Tadhkirat al-Huffaz de Al-Dhahabi (parte 4, pág. 1342) registra que su antepasado se llamaba al-Jawzi por un nogal en la casa familiar en Wasit, que escuchó a ochenta y siete maestros nombrados y predicó desde aproximadamente 525 hasta su muerte, y enumera entre sus obras al-Mughni sobre las ciencias del Corán, Zad al-Masir en cuatro volúmenes, Tadhkirat al-Arib y al-Wujuh wa'l-Naza'ir {cite:tabaqat-huffaz 4/1342}."
  fr: "Abd al-Rahman ibn Ali ibn al-Jawzi (510-597/1116-1201), juriste, traditionaliste, historien et prédicateur hanbalite, fut l'un des plus célèbres hanbalites de Bagdad, où il naquit et mourut après une vie d'intense activité intellectuelle, religieuse et politique (voir Encyclopaedia of Islam, vol. 3, p. 783). Il débuta sa carrière sous al-Muktafi grâce au patronage du vizir Ibn Hubayra, succéda à son cheikh al-Nahrawani à la tête de deux madrasas en 556, atteignit son apogée en 574 en dirigeant cinq madrasas et en publiant plus de 150 ouvrages, fut arrêté en 590 et exilé à Wasit pendant cinq ans, puis libéré en 595 grâce à la mère du calife et mourut peu après son retour (voir Encyclopaedia of Islam, vol. 3, p. 783). 783-784}. Ibn Rajab recense plus de 200 de ses œuvres, parmi lesquelles l'histoire Muntazam et la polémique hanbalite Talbis Iblis {cite:encyclopaedia-of-islam-2 vol. 3 p. 784}. L'entrée Tadhkirat al-Huffaz d'al-Dhahabi (partie 4, p. 1342) rapporte que son ancêtre était appelé al-Jawzi d'après un noyer de la maison familiale à Wasit, qu'il a reçu l'enseignement de quatre-vingt-sept maîtres nommés et qu'il a prêché d'environ 525 jusqu'à sa mort. Parmi ses œuvres figurent al-Mughni sur les sciences du Coran, Zad al-Masir en quatre volumes, Tadhkirat al-Arib et al-Wujuh wa'l-Naza'ir {cite:tabaqat-huffaz 4/1342}."
  tr: "Abd al-Rahman ibn Ali ibn al-Jawzi, tarihçi, vaiz ve Abbasi Halifelerinin Tarihi adlı eserin yazarıydı; bu eser el-Nasir dönemine kadar sona eriyordu. Beş yüz yaşında veya öncesinde Bağdat'ta doğdu ve Basra'da Al-Jawz mahallesi olarak bilinen bir mahalleye atfediliyordu. Teyzesi onu amcası olan Ebu el-Fadl bin Nasir camisine götürdü, ona baktı, hadları dinledi Kur'an'ı ezberledi ve yaklaşık seksen yedi kişiden dinledi. Genç yaşlardan itibaren akranlarını geride bırakarak vaaz verdi. Toplantısının yüz bin değerinde olduğunu birden fazla kez anlattı ve rehber halife toplantısına perde arkasında birkaç kez katıldı. Tefsir, hadis, fihyh, münzeviyet, vaaz, raporlar, tarih ve tıp üzerine birçok ünlü eser yazdı. Beş yüz doksan yedinci yılında vefat etti {atıfta bulunun: Shadharat-Dhahab, s. 809-810}. Kariyerine vezir İbn Hubayrah'ın garantisiyle el-Muktafi halifeliği altında başladı ve 556 Hicri'de öğretmeni Ebu Hakim el-Nehrawani'nin iki okulunda görev aldı. 574 Hicri'de zirveye ulaştı, beş okulu yönetti ve yüz elliden fazla eser yazdı. Daha sonra 590 Hicri'de tutuklandı ve beş yıl boyunca Wasit'e sürgün edildi; ardından halifenin annesinin aracılığıyla 595 Hicri'nde serbest bırakıldı. Bağdat'a döndü ve kısa süre sonra öldü {alıntı: İslam Ansiklopedisi-2 cilt 3, ss. 783-784} ve \"Tadhkirat al-Huffaz\" biyografisinde (Dördüncü Cilt, s. 1342) büyükbabasının Wasit'teki evinde bulunan bir ceviz tarafından Al-Jawzi olarak adlandırıldığını ve yaklaşık 225 yılından ölümüne kadar seksen yedi kişiden haber alıp vaaz verdiğini belirtir. Eserleri arasında \"Al-Mughni\" fi Uloom al-Qur'an, dört ciltlik \"Zad al-Masir\", \"Tadhkirat al-Areeb\" ve \"Al-Wujuh wa al-Naza'ir\" {atıf:tabaqat-huffaz 4/1342} yer alır."
  id: "Abd al-Rahman ibn Ali ibn al-Jawzi adalah seorang sejarawan, pengkhotbah, dan penulis Sejarah Khalifah Abbasiyah yang berakhir pada masa al-Nasir. Ia lahir di Baghdad pada tahun lima ratus atau sebelumnya dan dikaitkan dengan sebuah lingkungan di Basra yang disebut lingkungan Al-Jawz. Bibinya membawanya ke masjid Abu al-Fadl ibn Nasir, yang merupakan pamannya, merawatnya, mendengarkan hadits, menghafal Al-Qur'an, dan mendengar dari sekitar delapan puluh tujuh jiwa. Ia berkhotbah sejak usia muda, melampaui rekan-rekannya. Ia berulang kali menceritakan bahwa perkumpulannya bernilai seratus ribu, dan khalifah pembimbing menghadirinya beberapa kali di balik layar. Ia menulis banyak karya terkenal tentang tafsir, hadis, fijer, asketisme, khotbah, laporan, sejarah, dan kedokteran. Ia meninggal pada tahun lima ratus sembilan puluh tujuh {cite:Shadharat-Dhahab, hlm. 809-810}. Ia memulai kariernya di bawah kekhalifahan al-Muktafi di bawah jaminan wazir Ibn Hubayrah, menggantikan gurunya Abu Hakim al-Nahrawani di dua sekolahnya pada tahun 556 H. Ia mencapai puncaknya pada tahun 574 H, mengelola lima sekolah dan menulis lebih dari seratus lima puluh karya. Ia kemudian ditangkap pada tahun 590 H. Ia kemudian ditangkap pada tahun 590 Hm dan diasingkan ke Wasit selama lima tahun hingga akhirnya dibebaskan pada tahun 595 H, melalui perantaraan ibu Khalifah. Ia kembali ke Baghdad dan meninggal tak lama kemudian {cite: Encyclopaedia-of-Islam-2 vol. 3, hlm. 783-784}, dan \"Tadhkirat al-Huffaz\" menyebutkan dalam biografinya (Jilid Empat, hlm. 1342) bahwa kakeknya dipanggil Al-Jawzi oleh seorang kenari yang berada di rumahnya di Wasit, dan bahwa ia mendengar dari delapan puluh tujuh jiwa dan berkhotbah dari sekitar tahun 225 hingga ia wafat. Di antara karya-karyanya adalah \"Al-Mughni\" fi Uloom al-Qur'an, \"Zad al-Masir\" dalam empat jilid, \"Tadhkirat al-Areeb,\" dan \"Al-Wujuh wa al-Naza'ir\" {cite:tabaqat-huffaz 4/1342}."
