label: { ar: "ابن الجوزي", en: "Ibn al-Jawzi" }
summary:
  ar: "عبد الرحمن بن علي بن الجوزي المؤرخ الواعظ صاحب تاريخ خلفاء بني العباس المنتهي إلى أيام الناصر. ولد سنة عشر وخمس مئة أو قبلها ومنسوب إلى محلة بالبصرة تسمى محلة الجوز، حملته عمته إلى مسجد أبي الفضل بن ناصر وهو خاله فاعتنى به وأسمعه الحديث وحفظ القرآن وسمع من نحو سبعة وثمانين نفساً ووعظ من صغره ففاق فيه الأقران، وحكى غير مرة أن مجلسه حزر بمائة ألف وحضر مجلسه الخليفة المستضيء مرات من وراء الستر، وصنف في التفسير والحديث والفقه والزهد والوعظ والأخبار والتاريخ والطب تصانيف كثيرة شهيرة، توفي في سنة سبع وتسعين وخمس مئة {cite:shadharat-dhahab p. 809-810}."
  en: "Abd al-Rahman ibn Ali ibn al-Jawzi, historian-preacher, author of the Abbasid-caliph history ending in al-Nasir's days."
