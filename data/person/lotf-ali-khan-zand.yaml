summary:
  ar: "لطف علي خان زند (ق. 1769 – 1794) آخر حكام الدولة الزندية، حكم من 1789 إلى 1794. هو ابن جعفر خان؛ أخذ شيراز بعد مقتل أبيه، ثم فقدها بخيانة كلانترها حاجي إبراهيم، ودافع عن كرمان أربعة أشهر سنة 1794، فخُدع في بم وأُسر، فسُملت عيناه وقُتل في طهران بأمر غالبه آغا محمد خان القاجاري. واشتهر عند معاصريه بجماله وفروسيته ومهارته بالسيف."
  en: "Lotf Ali Khan Zand (c. 1769 – 1794) was the last ruler of the Zand dynasty, reigning from 1789 to 1794. The son of Jafar Khan, he took Shiraz on his father's murder, lost it through the betrayal of its kalantar Haji Ibrahim, defended Kerman for four months in 1794, and was betrayed at Bam, blinded and put to death at Tehran by his conqueror Agha Mohammad Khan Qajar. Contemporaries famed his beauty, horsemanship and swordsmanship."
  ur: "لطف علی خان زند (ق. 1769ء – 1794ء) زند خاندان کے آخری حکمران تھے، 1789ء سے 1794ء تک حکمران رہے۔ جعفر خان کے بیٹے تھے؛ والد کے قتل پر شیراز لیا، پھر وہاں کے کلانتر حاجی ابراہیم کی غداری سے شیراز ہاتھ سے گیا، 1794ء میں کرمان کا چار ماہ دفاع کیا، بم میں دھوکا کھا کر گرفتار ہوئے، آنکھیں نکلوائی گئیں اور تہران میں اپنے فاتح آغا محمد خان قاجار کے حکم سے قتل کیے گئے۔ ہم عصر لوگ ان کی خوبصورتی، گھڑ سواری اور تلوار بازی کے لیے مشہور تھے۔"

