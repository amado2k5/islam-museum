summary:
  ar: "شمس الأئمة الحنفي، نسبة إلى كردر ناحية بخوارزم من عمل جرجانية؛ قال ابن كمال باشا كان أستاذ الأئمة على الإطلاق والموفود إليه من الآفاق؛ أخذ عن برهان الدين علي المرغيناني صاحب الهداية ومجد الدين السمرقندي وفخر الدين قاضي خان ونور الدين الصابوني وجماعة؛ برع في معرفة المذهب ورفع علم أصول الفقه بعد اندراسه من زمن القاضي أبي زيد الدبوسي وشمس الأئمة السرخسي، وتفقه عليه كثير من الفقهاء {cite:shadharat-dhahab p. 224-225}."
  en: "Shams al-A'imma of Kurdar in Khwarazm (d. Friday 9 Muharram, Bukhara) — Ibn Kamal Pasha's 'teacher of the imams absolutely': pupil of al-Marghinani the Hidaya's author and of Qadi Khan; he raised usul al-fiqh back up after its decay since al-Dabusi and al-Sarakhsi {cite:shadharat-dhahab p. 224-225}."
