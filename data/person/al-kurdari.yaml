summary:
  ar: "شمس الأئمة الحنفي، نسبة إلى كردر ناحية بخوارزم من عمل جرجانية؛ قال ابن كمال باشا كان أستاذ الأئمة على الإطلاق والموفود إليه من الآفاق؛ أخذ عن برهان الدين علي المرغيناني صاحب الهداية ومجد الدين السمرقندي وفخر الدين قاضي خان ونور الدين الصابوني وجماعة؛ برع في معرفة المذهب ورفع علم أصول الفقه بعد اندراسه من زمن القاضي أبي زيد الدبوسي وشمس الأئمة السرخسي، وتفقه عليه كثير من الفقهاء {cite:shadharat-dhahab p. 224-225}."
  en: "Shams al-A'imma of Kurdar in Khwarazm (d. Friday 9 Muharram, Bukhara) — Ibn Kamal Pasha's 'teacher of the imams absolutely': pupil of al-Marghinani the Hidaya's author and of Qadi Khan; he raised usul al-fiqh back up after its decay since al-Dabusi and al-Sarakhsi {cite:shadharat-dhahab p. 224-225}."
  es: "Shams al-A'imma de Kurdar en Khwarazm (fallecido el viernes 9 de Muharram, Bujará) — Ibn Kamal Pasha lo considera el \"maestro de los imanes en toda regla\": discípulo de al-Marghinani, autor de la Hidaya, y de Qadi Khan; restauró el usul al-fiqh tras su decadencia desde al-Dabusi y al-Sarakhsi {cite:shadharat-dhahab p. 224-225}."
  fr: "Shams al-A'imma de Kurdar au Khwarezm (décédé le vendredi 9 Muharram, Boukhara) — « maître absolu des imams » d'Ibn Kamal Pacha: élève d'al-Marghinani, l'auteur de la Hidaya, et de Qadi Khan; il a remis en état l'usul al-fiqh après son déclin depuis al-Dabusi et al-Sarakhsi {cite: shadharat-dhahab p. 224-225}."
  ur: "خوارزم میں کُردار کا شمس الائمہ ⁦(متوفی جمعہ 9 محرم، بخارا)⁩ - ابن کمال پاشا کا 'اماموں کا بالکل استاد': ہدایہ کے مصنف اور قادی خان کا شاگرد؛ اس نے اصول الفقہ کو اس کے زوال کے بعد دوبارہ کھڑا کیا جب سے الدبوسی اور السرخسی {حوالہ: شدھارت ذہاب ص۱۱۔ 224-225}۔"
  tr: "Şems el-İimmah el-Hanefi, Harezm'de bir bölgede Jurcaniyeh'in çalışmalarıyla Kardar'a atfedilen; İbn Kamal Paşa, imamların mutlak öğretmeni olduğunu ve çeşitli alanlardan ona gönderildiğini söyledi; Burhan al-Din Ali el-Marghinani'nin yanında eğitim aldı; Burhan al-Din el-Marghinani, Al-Hidayah, Majd al-Din el-Samarqandi, Fakhr al-Din Khadi, Nur al-Din al-Sabuni ve diğerlerinin yazarıdır. Okul hakkında üstün bilgiye sahipti ve Kadi Ebu Zayd el-Dabbousi ile Şems el-İimmah el-Sarakhsi döneminde okuduğu, birçok hukukçu onun öğrencisi olan {atı: shadharat-dhahab, s. 224-225}"
  id: "Shams al-A'immah al-Hanafi, yang dikaitkan dengan Kardar di sebuah distrik di Khwarezm di bawah karya Jurjaniyah; Ibn Kamal Pasha mengatakan bahwa ia adalah guru mutlak para imam dan dikirim kepadanya dari berbagai bidang; ia belajar di bawah bimbingan Burhan al-Din Ali al-Marghinani, penulis Al-Hidayah, Majd al-Din al-Samarqandi, Fakhr al-Din Khadi, Nur al-Din al-Sabuni, dan lainnya. Ia unggul dalam pengetahuan tentang aliran tersebut dan meningkatkan ilmu ilmu hukum setelah mempelajarinya pada masa Qadi Abu Zayd al-Dabbousi dan Shams al-A'immah al-Sarakhsi, dan banyak ahli hukum belajar di bawah bimbingan beliau {cite:shadharat-dhahab, hlm. 224-225}."
