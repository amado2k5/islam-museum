  ar: "رسول ملوك حمير إلى النبي بإسلامهم ومفارقتهم الشرك، بعثه زرعة ذو يزن فلقي النبي بالمدينة منقلبه من تبوك؛ وذكره النبي في كتابه إلى حمير بين رسله الذين أميرهم معاذ بن جبل، وأنه بلّغ الخبر وحفظ الغيب وحدّثه أن زرعة أسلم من أول حمير."
  en: "The envoy of Himyar's kings to the Prophet with news of their Islam, sent by Zur'a Dhu Yazan, who met the Prophet at Medina on his return from Tabuk; the Prophet's letter names him among the envoys under Mu'adh ibn Jabal, says he delivered the message faithfully, and reports his account that Zur'a was the first of Himyar to convert."
