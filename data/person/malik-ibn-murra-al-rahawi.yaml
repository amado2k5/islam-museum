summary:
  ar: "رسول ملوك حمير إلى النبي بإسلامهم ومفارقتهم الشرك، بعثه زرعة ذو يزن فلقي النبي بالمدينة منقلبه من تبوك؛ وذكره النبي في كتابه إلى حمير بين رسله الذين أميرهم معاذ بن جبل، وأنه بلّغ الخبر وحفظ الغيب وحدّثه أن زرعة أسلم من أول حمير."
  en: "The envoy of Himyar's kings to the Prophet with news of their Islam, sent by Zur'a Dhu Yazan, who met the Prophet at Medina on his return from Tabuk; the Prophet's letter names him among the envoys under Mu'adh ibn Jabal, says he delivered the message faithfully, and reports his account that Zur'a was the first of Himyar to convert."
  ur: "حمیئر کے بادشاہوں کا نبی کے پاس قاصد، ان کے اسلام کی خبر لے کر، زرعہ ذو یزن نے بھیجا؛ تبوک سے واپسی پر مدینہ میں نبی سے ملا۔"
  es: "El enviado de los reyes de Himyar al Profeta con noticias de su Islam, enviado por Zur'a Dhu Yazan, quien se reunió con el Profeta en Medina a su regreso de Tabuk; la carta del Profeta lo nombra entre los enviados bajo el mando de Mu'adh ibn Jabal, dice que entregó el mensaje fielmente e informa que Zur'a fue el primero de Himyar en convertirse."
  fr: "L'envoyé des rois d'Himyar auprès du Prophète avec des nouvelles de leur conversion à l'islam, envoyé par Zur'a Dhu Yazan, qui rencontra le Prophète à Médine à son retour de Tabuk; la lettre du Prophète le nomme parmi les envoyés sous Mu'adh ibn Jabal, dit qu'il a fidèlement transmis le message et rapporte son récit selon lequel Zur'a fut le premier d'Himyar à se convertir."
  tr: "Himyar krallarından Peygamber'e İslam'larını benimseyenler ve çürkperestliği terk eden bir elçi. Zur'ah Dhu Yazan onu gönderdi ve Medine'de Tabuk'tan dönen Peygamber ile karşılaştı. Peygamber, Himyar'a yazdığı mektubunda onu elçileri arasında andı; bu elçilerin lideri Mu'adh ibn Jabal'dı; haberi duyduğunu, görünmeyeni sakladığını ve Zur'ah'ın ilk Himyar'dan beri İslam'a geçtiğini söylediğini belirtti."
  id: "Seorang utusan dari raja-raja Himyar kepada Nabi dengan Islam mereka dan meninggalkan politeisme. Zur'ah Dhu Yazan mengirimnya, dan dia bertemu Nabi di Madinah yang telah kembali dari Tabuk. Nabi menyebutnya dalam suratnya kepada Himyar di antara para utusan, yang pemimpinnya adalah Mu'adh ibn Jabal, dan bahwa dia telah mendengar kabar itu, menyembunyikan yang tak terlihat, dan memberitahunya bahwa Zur'ah telah memeluk Islam sejak Himyar pertama."
