  tr: "Bişr bin Davud; Thaghr al-Sanad el-Ma'mun halifeliği sırasında atandı, ancak itaatsizlik etti ve karşı çıktı, bu yüzden Ghassan ibn Abbad onu yanına gönderdi, o da güvenle yanına çıktı ve barış şehrine getirdi."
  id: "Bishr ibn Dawud; Thaghr al-Sanad diangkat selama masa kekhalifahan al-Ma'mun, tetapi ia membangkang dan menentang, sehingga Ghassan ibn Abbad mengirimnya kepadanya, dan ia pergi dengan selamat dan membawanya ke kota damai."
