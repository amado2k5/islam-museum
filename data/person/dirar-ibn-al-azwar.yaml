summary:
  ar: "أسدي من أصحاب خالد بن الوليد؛ كانت على سرية بُعثت في بني تميم بعد بزاخة فلقي مالك بن نويرة فاقتتلوا فأسره وجماعة معه فأتى بهم خالداً فأمر بضرب أعناقهم وتولى ضرار ضرب عنق مالك — ويقال لخالد إن مالكاً قال له «إني والله ما ارتددت»؛ ودخل ضرار على عمر بن الخطاب بمال مالك فقال له «أنا قتلته وما كنت لأقتله حتى أخبرته أنه لا يعفو عني أحد من قريش ولا المهاجرين ولا الأنصار» فقال عمر «قتلك الله»؛ قتل أبو بكر وعلى رأيه أبطأ بالكوفة على عليّ حتى ظهر بالشام."
  en: "An Asadi of Khalid ibn al-Walid's companions; he commanded one of the squadrons sent among Banu Tamim after Buzakha, fought Malik ibn Nuwayra, captured him with a group, and brought them to Khalid, who ordered their necks struck — Dirar himself taking Malik's; Malik is said to have told Khalid 'by God I did not apostatize'; Dirar came to Umar ibn al-Khattab with Malik's wealth saying 'I killed him, and I would not have killed him until I told him none of Quraysh, the Muhajirun or the Ansar would pardon me' — whereupon Umar said 'may God kill you'; per one report he later tarried at Kufa against Ali until he appeared in Syria."
