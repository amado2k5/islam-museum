id: person/abu-yusuf-al-qatii
class: person
label: { ar: "أبو يوسف القطيعي", en: "Abu Yusuf al-Qatii" }
summary:
  ar: "أبو يوسف إيشع القطيعي النصراني صاحب كتاب في الكشف عن مذاهب الحرانيين المعروفين في عصر ابن النديم بالصابة، حكى فيه أن المأمون اجتاز في آخر أيامه بديار مضر يريد بلاد الروم للغزو فتلقاه الناس وفيهم جماعة من الحرانيين زيهم لبس الأقبية وشمورهم طويلة فأنكر زيهم وسألهم أنصارى أنتم قالوا لا قال فيهود قالوا لا قال فمجوس قالوا لا قال أفلكم كتاب أم نبي فجمجموا فقال فأنتم إذا الزنادقة عبدة الأوثان وأصحاب الرأس في أيام الرشيد والدي وأنتم حلال دماؤكم لا ذمة لكم، فأنظرهم إلى رجوعه من سفرته إما أن ينتحلوا دين الإسلام أو دينا من الأديان التي ذكرها الله في كتابه وإلا قتلهم {cite:fihrist-ibn-al-nadim p. 445}."
  en: "Christian author whose book on Harranian doctrines preserves al-Ma'mun's ultimatum to the Sabians {cite:fihrist-ibn-al-nadim p. 445}."
