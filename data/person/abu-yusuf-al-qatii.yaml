label: { ar: "أبو يوسف القطيعي", en: "Abu Yusuf al-Qatii", fr: "Abu Yusuf al-Qatii", es: "Abu Yusuf al-Qatii", ur: "ابو یوسف القطی" }
summary:
  ar: "أبو يوسف إيشع القطيعي النصراني صاحب كتاب في الكشف عن مذاهب الحرانيين المعروفين في عصر ابن النديم بالصابة، حكى فيه أن المأمون اجتاز في آخر أيامه بديار مضر يريد بلاد الروم للغزو فتلقاه الناس وفيهم جماعة من الحرانيين زيهم لبس الأقبية وشمورهم طويلة فأنكر زيهم وسألهم أنصارى أنتم قالوا لا قال فيهود قالوا لا قال فمجوس قالوا لا قال أفلكم كتاب أم نبي فجمجموا فقال فأنتم إذا الزنادقة عبدة الأوثان وأصحاب الرأس في أيام الرشيد والدي وأنتم حلال دماؤكم لا ذمة لكم، فأنظرهم إلى رجوعه من سفرته إما أن ينتحلوا دين الإسلام أو دينا من الأديان التي ذكرها الله في كتابه وإلا قتلهم {cite:fihrist-ibn-al-nadim p. 445}."
  en: "Christian author whose book on Harranian doctrines preserves al-Ma'mun's ultimatum to the Sabians {cite:fihrist-ibn-al-nadim p. 445}."
  fr: "Auteur chrétien dont le livre sur les doctrines harraniennes conserve l'ultimatum d'al-Ma'mun aux Sabéens {cite:fihrist-ibn-al-nadim p. 445}."
  es: "Autor cristiano cuyo libro sobre las doctrinas harranianas conserva el ultimátum de al-Ma'mun a los sabeos {cite:fihrist-ibn-al-nadim p. 445}."
  ur: "عیسائی مصنف جس کی ہررانی عقائد پر کتاب میں صابیوں کے لیے المامون کا الٹی میٹم محفوظ ہے۔ 445}"
  tr: "İbn el-Nadim zamanında Sabiiler olarak bilinen Harranîlerin öğretileri üzerine bir kitap yazan Ebu Yusuf İşa el-Kati'i el-Nasrani, kitabında el-Ma'mun'un son günlerinde Roma topraklarını işgal etmek amacıyla Mudar topraklarından geçtiğini anlatmıştır. Halk onunla karşılaştı ve aralarında pelerin giymiş ve uzun sarıklar takmış bir grup Harranî vardı. Giysilerini beğenmedi ve onlara, \"Siz Ensar mısınız?\" diye sordu. \"Hayır\" dediler. \"Siz Yahudi misiniz?\" diye sordu. \"Hayır\" dediler. \"Siz Mecusi misiniz?\" diye sordu. \"Hayır\" dediler. \"Siz bir kitabınız veya bir peygamberiniz var mı?\" diye sordu. Kekelediler. \"Öyleyse siz, babam Raşid zamanındaki sapkınlar, putperestler ve baş ehlisiniz. Kanınız helaldir, sizin bir ahdiniz yoktur\" dedi. Onlara, yolculuğundan dönene kadar ya İslam dinini ya da Allah'ın kitabında zikrettiği dinlerden birini kabul etmeleri için süre verdi; aksi takdirde onları öldüreceğini söyledi. {cite:fihrist-ibn-al-nadim s. 445}"
  id: "Abu Yusuf Isha’ al-Qati’i al-Nasrani, penulis sebuah buku tentang doktrin kaum Harranian, yang pada masa Ibn al-Nadim dikenal sebagai kaum Sabian, menceritakan di dalamnya bahwa al-Ma’mun melewati tanah Mudar pada hari-hari terakhirnya, dengan maksud untuk menyerang tanah Romawi. Orang-orang bertemu dengannya, dan di antara mereka ada sekelompok kaum Harranian yang mengenakan jubah dan sorban panjang. Ia tidak menyetujui pakaian mereka dan bertanya kepada mereka, “Apakah kalian Ansar?” Mereka menjawab, “Bukan.” Ia bertanya lagi, “Apakah kalian Yahudi?” Mereka menjawab, “Bukan.” Ia bertanya lagi, “Apakah kalian Majusi?” Mereka menjawab, “Bukan.” Ia bertanya lagi, “Apakah kalian mempunyai kitab atau nabi?” Mereka tergagap. Ia berkata, “Kalau begitu kalian adalah kaum sesat, penyembah berhala, dan orang-orang yang berkuasa pada zaman al-Rashid, ayahku, dan darah kalian halal, kalian tidak mempunyai perjanjian.” Dia memberi mereka waktu hingga kepulangannya dari perjalanannya untuk memeluk agama Islam atau salah satu agama yang disebutkan Allah dalam kitab-Nya, jika tidak, dia akan membunuh mereka. {cite:fihrist-ibn-al-nadim p. 445}."
