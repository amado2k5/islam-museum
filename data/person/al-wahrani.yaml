died: { edtf: "1179", hijri: "0575", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة خمس وسبعين وخمسمائة بداريّا من قرى دمشق ودفن على باب تربة الشيخ أبي سليمان الداراني؛ وردت الأخبار من دمشق في سابع عشر رجب بوفاته كما نقل من خط القاضي الفاضل {cite:wafayat-ayan}." }
summary:
  ar: "أبو عبد الله محمد بن محرز بن محمد الوهراني، الملقب ركن الدين وقيل جمال الدين؛ أحد الفضلاء الظرفاء؛ قدم من بلاده إلى الديار المصرية في أيام السلطان صلاح الدين وفنه صناعة الإنشاء، فلما دخل ورأى القاضي الفاضل وعماد الدين الأصبهاني علم أنه ليس من طبقتهم فعدل عن طريق الجد وسلك طريق الهزل وعمل المنامات والرسائل المشهورة المنسوبة إليه وهي كثيرة الوجود وفيها دلالة على خفة روحه ورقة حاشيته وكمال ظرفه، وأشهرها المنام الكبير؛ تنقل في البلاد وأقام بدمشق وتولى الخطابة بداريّا قرية على باب دمشق في الغوطة {cite:wafayat-ayan}."
  en: "Rukn al-Din al-Wahrani (d. 575) — the celebrated satirist from Wahran (Oran); came to Salah al-Din's Egypt for insha' work, judged himself no match for al-Qadi al-Fadil and Imad al-Din, and turned to humour — the famous Manamat and comic epistles; ended as khatib of Dariyya near Damascus {cite:wafayat-ayan}."
