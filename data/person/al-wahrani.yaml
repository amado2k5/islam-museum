died: { edtf: "1179", hijri: "0575", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة خمس وسبعين وخمسمائة بداريّا من قرى دمشق ودفن على باب تربة الشيخ أبي سليمان الداراني؛ وردت الأخبار من دمشق في سابع عشر رجب بوفاته كما نقل من خط القاضي الفاضل {cite:wafayat-ayan}." }
summary:
  ar: "أبو عبد الله محمد بن محرز بن محمد الوهراني، الملقب ركن الدين وقيل جمال الدين؛ أحد الفضلاء الظرفاء؛ قدم من بلاده إلى الديار المصرية في أيام السلطان صلاح الدين وفنه صناعة الإنشاء، فلما دخل ورأى القاضي الفاضل وعماد الدين الأصبهاني علم أنه ليس من طبقتهم فعدل عن طريق الجد وسلك طريق الهزل وعمل المنامات والرسائل المشهورة المنسوبة إليه وهي كثيرة الوجود وفيها دلالة على خفة روحه ورقة حاشيته وكمال ظرفه، وأشهرها المنام الكبير؛ تنقل في البلاد وأقام بدمشق وتولى الخطابة بداريّا قرية على باب دمشق في الغوطة {cite:wafayat-ayan}."
  en: "Rukn al-Din al-Wahrani (d. 575) — the celebrated satirist from Wahran (Oran); came to Salah al-Din's Egypt for insha' work, judged himself no match for al-Qadi al-Fadil and Imad al-Din, and turned to humour — the famous Manamat and comic epistles; ended as khatib of Dariyya near Damascus {cite:wafayat-ayan}."
  fr: "Rukn al-Din al-Wahrani (mort en 575) – le célèbre satiriste de Wahran (Oran) ; est venu à l'Égypte de Salah al-Din pour insha 'travail, lui-même jugé pas de match pour al-Qadi al-Fadil et Imad al-Din, et tourné vers l'humour - les célèbres Manamat et épîtres comiques ; fini comme khatib de Dariyya près de Damas {cite:wafayat-ayan}."
  es: "Rukn al-Din al-Wahrani (m. 575) — el célebre satírico de Wahran (Orán); llegó al Egipto de Saladino para realizar trabajos insha', se consideró incapaz de igualar a al-Qadi al-Fadil e Imad al-Din, y se volcó al humor — el famoso Manamat y las epístolas cómicas; terminó como khatib de Dariyya cerca de Damasco {cite:wafayat-ayan}."
  ur: "رکن الدین الوہرانی ⁦(متوفی 575)⁩ - وہران ⁦(اوران)⁩ سے مشہور طنز نگار؛ انشا کے کام کے لیے صلاح الدین کے مصر میں آیا، اپنے آپ کو القادی الفضل اور عماد الدین سے کوئی مماثلت نہ سمجھا، اور مزاح کی طرف متوجہ ہوا - مشہور منامات اور مزاحیہ خط؛ دمشق کے قریب داریہ کے خطیب کے طور پر ختم ہوا۔"
  tr: "Ebu Abdullah Muhammed bin Muharrez ibn Muhammed el-Vahrani, lakaplı adı Rukn al-Din ya da Cemaleddin olarak adlandırılır, seçkin ve esprili alimlerden biriydi. Sultan Salaheddin döneminde memleketinden Mısır'a geldi ve burada inşaatla uğraştı. İçeri girip erdemli yargıç ve İmaddin el-İsfahani'yi gördüğünde, onların sınıfından olmadığını fark etti. Sonra ciddiyet yoluna sırtını döndü, mizah yolunu seçti ve kendisine atfedilen ünlü mektupları yazdı. Bunlar bolca ve onun neşeliliğini, çevresinin berraklığını ve durumunun mükemmelliğini yansıtır. Bunların en ünlüsü büyük rüyadır. Topraklarda dolaştı, Şam'a yerleşti ve Guta'daki Şam Kapısı'ndaki Daraya köyünde vaaz verdi."
  id: "Abu Abdullah Muhammad ibn Muharrez ibn Muhammad al-Wahrani, yang dijuluki Rukn al-Din, atau dikatakan Jamal al-Din, adalah salah satu ulama terkemuka dan cerdas. Ia datang dari tanah airnya ke Mesir pada masa pemerintahan Sultan Salah al-Din, di mana ia terlibat dalam pembangunan. Ketika ia masuk dan melihat hakim yang berbudi luhur serta Imad al-Din al-Isfahani, ia menyadari bahwa dirinya bukan dari kelas mereka. Ia kemudian membelakangi jalan keseriusan, memilih jalan humor, dan menulis surat serta surat-surat terkenal yang dikaitkan dengannya. Surat-surat ini melimpah dan mencerminkan keceriaan, kejernihan rombongannya, dan kesempurnaan keadaannya. Yang paling terkenal adalah mimpi besar. Ia berpindah ke tanah itu, menetap di Damaskus, dan mulai berkhotbah di Daraya, sebuah desa di Gerbang Damaskus di Ghouta {cite:wafayat-ayan}."
