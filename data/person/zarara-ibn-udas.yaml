summary:
  ar: "زرارة بن عدس التميمي، سيد من بني دارم؛ ارتضع عنده أسعد بن عمرو بن المنذر اللخمي فقتله سويد بن عبد الله بن دارم، وكان قد غزا مع عمرو بن المنذر فأخفق فأشار عليه بالمال على طيء فأسر وقتل وغنم فكانت في صدور طيء عليه، وقال عمرو بن ملقط الطائي يحرض الملك عليه إن عجزة أم بالسفح أسفل من أواره فاقتل زرارة لا أرى في القوم أوفى من زرارة، فسار زرارة لما جن الليل مجداً إلى قومه ثم مرض ولما حضرته الوفاة أوصى ابنه حاجباً أن يضم إليه غلمته في بني نهشل وأوصى ابن أخيه عمرو بن عمرو بعمرو بن ملقط إذ حرض عليه الملك {cite:kamil-ibn-al-athir p. 412}."
  en: "Zurara ibn Udas al-Tamimi, the Darimi chief who fostered Amr ibn al-Mundhir's son As'ad; after the king's failed raid he counselled the turn on Tayy', which earned him their hatred, and on his deathbed he charged his son Hajib and his nephew with the account of Amr ibn Mulqit, the Tayyi' who had urged the king against him {cite:kamil-ibn-al-athir p. 412}."
