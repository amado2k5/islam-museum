summary:
  ar: زرارة بن عدس التميمي، سيد من بني دارم؛ ارتضع عنده أسعد بن عمرو بن المنذر اللخمي فقتله سويد بن عبد الله بن دارم، وكان قد غزا مع عمرو بن المنذر فأخفق فأشار عليه بالمال على طيء فأسر وقتل وغنم فكانت في صدور طيء عليه، وقال عمرو بن ملقط الطائي يحرض الملك عليه إن عجزة أم بالسفح أسفل من أواره فاقتل زرارة لا أرى في القوم أوفى من زرارة، فسار زرارة لما جن الليل مجداً إلى قومه ثم مرض ولما حضرته الوفاة أوصى ابنه حاجباً أن يضم إليه غلمته في بني نهشل وأوصى ابن أخيه عمرو بن عمرو بعمرو بن ملقط إذ حرض عليه الملك {cite:kamil-ibn-al-athir p. 412}.
  en: Zurara ibn Udas al-Tamimi, the Darimi chief who fostered Amr ibn al-Mundhir's son As'ad; after the king's failed raid he counselled the turn on Tayy', which earned him their hatred, and on his deathbed he charged his son Hajib and his nephew with the account of Amr ibn Mulqit, the Tayyi' who had urged the king against him {cite:kamil-ibn-al-athir p. 412}.
  es: "Zurara ibn Udas al-Tamimi, el jefe darimi que apadrinó al hijo de Amr ibn al-Mundhir, As'ad; después de la incursión fallida del rey, aconsejó el cambio de bando contra los Tayy', lo que le granjeó su odio, y en su lecho de muerte encargó a su hijo Hajib y a su sobrino la responsabilidad de Amr ibn Mulqit, el Tayyi' que había instado al rey contra él {cite:kamil-ibn-al-athir p. 412}."
  fr: "Zurara ibn Udas al-Tamimi, le chef Darimi qui a élevé le fils d'Amr ibn al-Mundhir, As'ad; après le raid raté du roi, il a conseillé de se tourner vers Tayy', ce qui lui a valu leur haine, et sur son lit de mort, il a chargé son fils Hajib et son neveu du récit d'Amr ibn Mulqit, le Tayyi' qui avait incité le roi contre lui {cite:kamil-ibn-al-athir p. 412}."
  ur: "زرارہ بن اُداس التمیمی، دارمی سردار جس نے عمرو بن المنذر کے بیٹے اسد کی پرورش کی۔ بادشاہ کے ناکام چھاپے کے بعد اس نے طیب کو باری کا مشورہ دیا، جس سے ان کی نفرت پیدا ہوگئی، اور بستر مرگ پر اس نے اپنے بیٹے حاجب اور بھتیجے پر عمرو بن ملقیت، طائی، جس نے بادشاہ کو اس کے خلاف زور دیا تھا، کا الزام لگایا۔ 412}۔"
  tr: "Zurara ibn Adas al-Tamimi, Banu Darim'den bir lider; As'ad ibn Amr ibn al-Mundhir al-Lakhmi onunla birlikte baktı ve Suwayd ibn Abdullah ibn Darim'i öldürdü. Amr ibn al-Mundhir ile savaştı ama başarısız oldu, bu yüzden Tayy'den daha fazla para teklif etti, böylece Tayy yakalandı ve öldürüldü, ganimet ise Tayy'in sandığında ona karşı kaldı. Amr ibn Malqat al-Tai kralı ona karşı çağırdı: 'Eğer anne dallarının altındaki yamaçta zayıfsa, Zurarah'ı öldür; halk arasında Zurara'dan daha sadık kimseyi göremiyorum.' Zurara gece muhteşem bir şekilde çöktüğünde ve hastalandığında halkına gitti. Ölüm yaklaşırken oğlu Hac ona hizmetkarını Banu Nahshal'a götürmesini emretti. Yeğeni Amr bin Amr, kralın onu kışkırttığı için Amr ibn Malqat'a emanet etti {alıntı: Kamil-ibn-al-Athir s. 412}."
  id: "Zurara ibn Adas al-Tamimi, seorang pemimpin dari Banu Darim; As'ad ibn Amr ibn al-Mundhir al-Lakhmi merawat dia, dan ia membunuh Suwayd ibn Abdullah ibn Darim. Ia pernah berperang dengan Amr ibn al-Mundhir namun gagal, sehingga ia menawarkan uang atas Tayy, sehingga ia ditangkap dan dibunuh, dan rampasan itu ada di dada Tayy untuk melawannya. Amr ibn Malqat al-mendesak raja untuk melawannya: 'Jika ibu lemah di lereng di bawah cabangnya, bunuh Zurarah; aku tidak melihat ada yang lebih setia di antara rakyat selain Zurara.' Zurara pergi kepada rakyatnya saat malam tiba dan jatuh sakit. Ketika kematian mendekat, putranya Hajj memerintahkannya untuk membawa pelayannya bersamanya di Banu Nahshal. Keponakannya Amr ibn Amr mempercayakan Amr ibn Malqat, seperti yang didorong raja {cite:Kamil-ibn-al-Athir hlm. 412}."
