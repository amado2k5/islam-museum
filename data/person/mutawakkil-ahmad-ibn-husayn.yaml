label:
  ar: المتوكل أحمد بن الحسين الموطىء
  en: al-Mutawakkil Ahmad ibn al-Husayn "al-Mu'ti"
summary:
  ar: "أحمد بن الحسين الرسي، إمام زيدي ثائر على بني رسول لقبوه الموطىء؛ بويع سنة 645هـ، وكان فقيهاً أديباً عالماً بمذهب الزيدية مجتهداً في العبادة، فشمر له المنصور عمر بن علي بن رسول وحاصره بحصن ملا مدة ثم أفرج عنه وحاصره من الحصون المجاورة، وتمكن أيام المظفر يوسف من أعقاب بني الرسي فملك عشرين حصناً من حصون الزيدية وزحف إلى صفد فملكها من يد السليمانيين، ونزل له وكان يقتل من خالفه إلى أن قتل، ولم يزل بنو الرسي يدعونه إماماً."
  en: "Ahmad ibn al-Husayn al-Rassi, a Zaydi imam who rose against the Rasulids, called al-Mu'ti; proclaimed in 645 AH — a faqih, man of letters, master of the Zaydi madhhab and devoted worshipper — al-Mansur Umar campaigned against him and besieged Hisn Mala, and in Muzaffar Yusuf's days he held twenty Zaydi fortresses and took Safad from the Sulaymanids, who submitted to him; the Banu al-Rassi kept calling him imam."
