id: person/mutawakkil-ahmad-ibn-husayn
class: person
label:
  ar: المتوكل أحمد بن الحسين الموطىء
  en: al-Mutawakkil Ahmad ibn al-Husayn "al-Mu'ti"
  es: "al-Mutawakkil Ahmad ibn al-Husayn \"al-Mu'ti\""
  fr: "al-Mutawakkil Ahmad ibn al-Husayn \"al-Mu'ti\""
  ur: "المتوکل احمد بن الحسین \"الموطی\""
summary:
  ar: "أحمد بن الحسين الرسي، إمام زيدي ثائر على بني رسول لقبوه الموطىء؛ بويع سنة 645هـ، وكان فقيهاً أديباً عالماً بمذهب الزيدية مجتهداً في العبادة، فشمر له المنصور عمر بن علي بن رسول وحاصره بحصن ملا مدة ثم أفرج عنه وحاصره من الحصون المجاورة، وتمكن أيام المظفر يوسف من أعقاب بني الرسي فملك عشرين حصناً من حصون الزيدية وزحف إلى صفد فملكها من يد السليمانيين، ونزل له وكان يقتل من خالفه إلى أن قتل، ولم يزل بنو الرسي يدعونه إماماً."
  en: "Ahmad ibn al-Husayn al-Rassi, a Zaydi imam who rose against the Rasulids, called al-Mu'ti; proclaimed in 645 AH — a faqih, man of letters, master of the Zaydi madhhab and devoted worshipper — al-Mansur Umar campaigned against him and besieged Hisn Mala, and in Muzaffar Yusuf's days he held twenty Zaydi fortresses and took Safad from the Sulaymanids, who submitted to him; the Banu al-Rassi kept calling him imam."
  es: "Ahmad ibn al-Husayn al-Rassi, un imán zaidí que se alzó contra los rasulíes, llamado al-Mu'ti; proclamado en el año 645 de la Hégira, un faqih, hombre de letras, maestro de la escuela jurídica zaidí y devoto creyente, al-Mansur Umar hizo campaña contra él y sitió Hisn Mala, y en tiempos de Muzaffar Yusuf controló veinte fortalezas zaidíes y tomó Safad de los sulaymánidas, quienes se sometieron a él; los Banu al-Rassi siguieron llamándolo imán."
  fr: "Ahmad ibn al-Husayn al-Rassi, un imam zaydite qui s'est soulevé contre les Rasulides, appelé al-Mu'ti; proclamé en 645 AH — faqih, homme de lettres, maître du madhhab zaydite et fervent adorateur — al-Mansur Umar a mené campagne contre lui et a assiégé Hisn Mala, et du temps de Muzaffar Yusuf, il a tenu vingt forteresses zaydites et a pris Safad aux Sulaymanides, qui se sont soumis à lui; les Banu al-Rassi ont continué à l'appeler imam."
  ur: "احمد بن الحسین الراسی، ایک زیدی امام جو رسولوں کے خلاف اٹھ کھڑا ہوا، جسے الموطی کہا جاتا ہے۔ 645 ہجری میں اعلان کیا گیا - ایک فقیہ، خطیب، زیدی مذہب کا مالک اور متقی عبادت گزار - المنصور عمر نے اس کے خلاف مہم چلائی اور حسن مالا کا محاصرہ کیا، اور مظفر یوسف کے زمانے میں اس نے بیس زیدی قلعوں پر قبضہ کیا اور سفاد کو سلیمانیوں سے لے لیا، جنہوں نے اس کے تابع کر دیا۔ بنو الرشی اسے امام کہتے رہے۔"
  tr: "Ahmed ibn al-Husayn al-Rassi, Banu Rasul'a karşı isyan eden bir Zeydi imamıydı ve lakaplı el-Muvatta' idi. 645 Hicri yılında bağlılık yemini etti. Bir hukukçu, edebiyat bilgini ve Zaydi okulundan bir âlimdi ve ibadete gayretliydi. El-Mensur bin Ali ibn Rasul, bir süre Mulla kalesinde onu kuşattı, sonra serbest bıraktı ve yakınlardaki kalelerden kuşattı. El-Muzaffar Yusuf'un günlerinde, yirmi Zeydi kalesine hükmeden ve Süleymanilerden Safad'a ilerleyen Banu el-Rassi'nin peşinden gitmeyi başardı. Onun emrinde kaldı ve kendisine karşı çıkanları öldürdü, ta ki öldürülene kadar. Banu el-Rusi onu İmam olarak iddia etmeye devam etti."
  id: "Ahmad ibn al-Husayn al-Rassi adalah seorang imam Zaydi yang memberontak melawan Banu Rasul, yang dijuluki al-Muwatta'. Ia diikrarkan setia pada tahun 645 H. Ia adalah seorang ahli hukum, sarjana sastra, dan ulama dari aliran pemikiran Zaydi serta rajin dalam beribadah. Al-Mansur ibn Ali ibn Rasul mengepungnya di benteng Mulla untuk sementara waktu, lalu membebaskannya dan mengepungnya dari benteng-benteng terdekat. Pada masa al-Muzaffar Yusuf, ia berhasil mengejar Banu al-Rassi, yang memerintah dua puluh benteng Zaydi dan maju ke Safad, merebutnya dari Sulaymanid. Ia tetap berada di bawah komandonya dan membunuh mereka yang menentangnya hingga ia dibunuh. Banu al-Rusi terus mengklaimnya sebagai Imam."
