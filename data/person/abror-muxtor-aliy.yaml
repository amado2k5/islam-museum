  ar: "مدوّن وداعية إسلامي أوزبكي ⁦(المولود 1976 في منطقة نامانغان)⁩، اسمه الحقيقي أبرور عبد العظيموف ويكتب باسم أبرور مختار علي؛ أشهر داعية مستقل على الإنترنت في أوزبكستان، تبلغ قناته على يوتيوب نحو 1.1 مليون مشترك، وعمل في مؤسسات الإدارة الدينية الرسمية قبل أن تُقيله السلطات من منصبين حكوميين في سبتمبر 2022."
  en: "An Uzbek Islamic blogger and preacher (born 1976 in the Namangan region), whose real name is Abror Abduazimov and who publishes as Abror Muxtor Aliy; Uzbekistan's most prominent independent online preacher, his YouTube channel counts about 1.1 million subscribers, and he worked in the official religious administration before the authorities dismissed him from two government positions in September 2022."
  ur: "ابرور مختار علی ⁦(پیدائش 1976ء، نامانگان علاقہ)⁩ ازبک مسلمان بلاگر اور مبلغ ہیں؛ ان کا اصل نام ابرور عبد العظیموف ہے اور وہ اسی قلمی نام سے شائع ہوتے ہیں۔ وہ ازبکستان کے سب سے نمایاں آزاد آن لائن مبلغ ہیں، ان کے یوٹیوب چینل کے تقریباً 1.1 ملین سبسکرائبر ہیں، اور وہ سرکاری دینی انتظامیہ میں کام کر چکے ہیں یہاں تک کہ حکام نے ستمبر 2022 میں انہیں دو سرکاری عہدوں سے برطرف کر دیا۔"
