summary:
  ar: "محدث سجستان صاحب «سنن أبي داود» أحد الكتب الستة؛ رحل في طلب الحديث حتى أدرك البصرة وبغداد وخراسان والشام ومصر، وانتخب من خمسمائة ألف حديث أربعة آلاف وثمانمائة حديث مرتبة على أبواب الفقه {cite:tarikh-islam-dhahabi p. 360}."
  en: "The muhaddith of Sijistan, author of the Sunan counted among the six books; he travelled for hadith to Basra, Baghdad, Khurasan, al-Sham and Egypt, and selected four thousand eight hundred traditions out of five hundred thousand, arranged by legal chapter {cite:tarikh-islam-dhahabi p. 360}."
  ur: "سجستان کے محدث اور «سنن ابی داؤد» کے مؤلف جو کتبِ ستہ میں شمار ہوتی ہے؛ حدیث کے طلب میں بصرہ، بغداد، خراسان، شام اور مصر کی مسافرت کی اور پانچ لاکھ حدیثوں میں سے چار ہزار آٹھ سو چن کر ابوابِ فقہ پر مرتب کیں {cite:tarikh-islam-dhahabi p. 360}۔"
