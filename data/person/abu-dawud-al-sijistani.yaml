summary:
  ar: "محدث من سجستان وصاحب «سنن أبي داود» أحد الكتب الستة، ولد سنة ٢٠٢هـ/٨١٧م وارتحل كثيراً في طلب الحديث، ثم استقر بالبصرة وتوفي في شوال سنة ٢٧٥هـ/٨٨٩م. اشتهر كتابه بما أضافه إليه من ملاحظات على قيمة الأحاديث، وقد روى فيه أربعة آلاف وثمانمائة حديث منتخبة من خمسمائة ألف، وتعددت روايات الكتاب وأشهرها رواية اللؤلؤي {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  en: "A muhaddith of Sijistan and author of the Sunan, one of the six canonical books; born in 202/817, he travelled widely for hadith, settled at Basra and died in Shawwal 275/889. His book is known for the notes he adds on the value of its traditions, and holds 4,800 traditions selected from 500,000; it was handed down in several versions, of which al-Lu'lu'i's is the most favoured {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  ur: "سجستان کے محدث اور سنن کے مؤلف جو چھ مسلّم کتبِ حدیث میں شمار ہوتی ہے؛ وہ 202ھ/817ء میں پیدا ہوئے، حدیث کے لیے بہت سفر کیا، بصرہ میں آباد ہوئے اور شوال 275ھ/889ء میں فوت ہوئے۔ ان کی کتاب میں پانچ لاکھ میں سے چنی ہوئی چار ہزار آٹھ سو حدیثیں ہیں اور حدیثوں کی قدر پر ان کے نوٹ اس کی خاص پہچان ہیں، اور اس کی کئی روایات ہیں جن میں لؤلؤی کی روایت سب سے مقبول ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}۔"
  fr: "Traditionniste du Sijistan et auteur des Sunan, l'un des six livres canoniques ; né en 202/817, il voyagea beaucoup pour le hadith, s'établit à Bassora et mourut en Shawwal 275/889. Son livre est connu pour les notes qu'il ajoute sur la valeur de ses traditions, et contient 4 800 traditions choisies parmi 500 000 ; il fut transmis en plusieurs versions, dont celle d'al-Lu'lu'i est la plus appréciée {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  es: "Un muhaddith de Sijistan y autor del Sunan, uno de los seis libros canónicos; nacido en 202/817, viajó extensamente en busca de hadices, se estableció en Basora y murió en Shawwal 275/889. Su libro es conocido por las notas que agrega sobre el valor de sus tradiciones, y contiene 4.800 tradiciones seleccionadas de entre 500.000; fue transmitido en varias versiones, de las cuales la de al-Lu'lu'i es la más favorecida {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  tr: "Sijistanlı bir hadis âlimi ve altı şeriat hadis külliyatından biri olan \"Sunan Abi Davud\"un yazarı olan bu kişi, Hicri 202/Miladi 817 yılında doğmuştur. Hadis araştırmaları için geniş çapta seyahat etmiş, daha sonra Basra'ya yerleşmiş ve Hicri 275/Miladi 889 yılında Şevval ayında vefat etmiştir. Kitabı, hadislerin değeriyle ilgili eklediği şerhler nedeniyle meşhur olmuştur. Kitabında beş yüz bin hadisten seçilmiş dört bin sekiz yüz hadis rivayet etmiştir. Kitabın çeşitli nüshaları vardır, en ünlüsü ise el-Lu'lu'i nüshasıdır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  id: "Seorang ulama hadits dari Sijistan dan penulis \"Sunan Abi Dawud,\" salah satu dari enam koleksi hadits kanonik, beliau lahir pada tahun 202 H/817 M. Beliau melakukan perjalanan luas untuk mencari hadits, kemudian menetap di Basra dan meninggal pada bulan Syawal 275 H/889 M. Kitabnya menjadi terkenal karena catatan tambahan yang beliau berikan mengenai nilai hadits. Di dalamnya beliau meriwayatkan empat ribu delapan ratus hadits pilihan dari lima ratus ribu hadits. Ada beberapa versi kitab tersebut, yang paling terkenal adalah versi al-Lu'lu'i. {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
