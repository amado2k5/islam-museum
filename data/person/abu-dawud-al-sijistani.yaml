summary:
  ar: "محدث سجستان صاحب «سنن أبي داود» أحد الكتب الستة؛ رحل في طلب الحديث حتى أدرك البصرة وبغداد وخراسان والشام ومصر، واقتصر في كتابه على أحاديث الأحكام مرتبة على أبواب الفقه. وتذكر «في رحاب السنة» أنه وُلد سنة 202هـ، وتوفي في شوال سنة 275هـ بالبصرة، وأنه انتقى سننه من نحو خمسمائة ألف حديث فأودع فيها أربعة آلاف وثمانمائة حديث، وبيّن ما فيها من ضعف شديد {cite:fi-rihab-al-sunna-azhar p. 108}{cite:fi-rihab-al-sunna-azhar p. 112}{cite:fi-rihab-al-sunna-azhar p. 115}"
  en: "The muhaddith of Sijistan, author of the Sunan counted among the six books; he travelled for hadith to Basra, Baghdad, Khurasan, al-Sham and Egypt, and restricted his collection to the reports bearing on rulings, arranged by legal chapter."
