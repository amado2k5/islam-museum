summary:
  ar: "محدث من سجستان وصاحب «سنن أبي داود» أحد الكتب الستة، ولد سنة ٢٠٢هـ/٨١٧م وارتحل كثيراً في طلب الحديث، ثم استقر بالبصرة وتوفي في شوال سنة ٢٧٥هـ/٨٨٩م. اشتهر كتابه بما أضافه إليه من ملاحظات على قيمة الأحاديث، وقد روى فيه أربعة آلاف وثمانمائة حديث منتخبة من خمسمائة ألف، وتعددت روايات الكتاب وأشهرها رواية اللؤلؤي {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  en: "A muhaddith of Sijistan and author of the Sunan, one of the six canonical books; born in 202/817, he travelled widely for hadith, settled at Basra and died in Shawwal 275/889. His book is known for the notes he adds on the value of its traditions, and holds 4,800 traditions selected from 500,000; it was handed down in several versions, of which al-Lu'lu'i's is the most favoured {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}."
  ur: "سجستان کے محدث اور سنن کے مؤلف جو چھ مسلّم کتبِ حدیث میں شمار ہوتی ہے؛ وہ 202ھ/817ء میں پیدا ہوئے، حدیث کے لیے بہت سفر کیا، بصرہ میں آباد ہوئے اور شوال 275ھ/889ء میں فوت ہوئے۔ ان کی کتاب میں پانچ لاکھ میں سے چنی ہوئی چار ہزار آٹھ سو حدیثیں ہیں اور حدیثوں کی قدر پر ان کے نوٹ اس کی خاص پہچان ہیں، اور اس کی کئی روایات ہیں جن میں لؤلؤی کی روایت سب سے مقبول ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 133} {cite:tarikh-islam-dhahabi p. 360}۔"
