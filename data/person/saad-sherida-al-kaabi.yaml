summary:
  ar: "سعد شريدة الكعبي (وُلد سنة 1967) هو وزير الدولة لشؤون الطاقة في قطر منذ 2018 والرئيس والمدير التنفيذي لقطر للطاقة، الشركة الحكومية التي تدير أنشطة النفط والغاز في البلاد. مهندس بترول تخرج في جامعة ولاية بنسلفانيا سنة 1991، وانضم إلى الشركة سنة 1986، وقاد توسع قطر في الغاز الطبيعي المسال، وكان مفاوض قطر الأبرز في محادثات إمدادات الغاز مع أوروبا سنة 2022."
  en: "Saad Sherida Al-Kaabi (born 1967) is Qatar's Minister of State for Energy Affairs since 2018 and the president and CEO of QatarEnergy, the state corporation that runs the country's oil and gas activities. A petroleum engineer who graduated from Pennsylvania State University in 1991, he joined the company in 1986, led Qatar's expansion in liquefied natural gas, and was Qatar's lead voice in the 2022 gas-supply talks with Europe."
  ur: "سعد شریدہ الکعبی (پیدائش 1967) 2018 سے قطر کے وزیرِ مملکت برائے توانائی امور اور قطر انرجی کے صدر و سی ای او ہیں، وہ سرکاری کارپوریشن جو ملک کی تیل و گیس سرگرمیاں چلاتی ہے۔ پیٹرولیم انجینئر کے طور پر انھوں نے 1991 میں پنسلوانیا اسٹیٹ یونیورسٹی سے گریجویشن کیا، 1986 میں کمپنی سے وابستہ ہوئے، قطر کی مائع قدرتی گیس میں توسیع کی قیادت کی، اور 2022 میں یورپ کے ساتھ گیس فراہمی کے مذاکرات میں قطر کی سرکردہ آواز رہے۔"
