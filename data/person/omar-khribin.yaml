  ar: "مهاجم سوري وُلد في دمشق سنة 1994. كان أول سوري ينال جائزة لاعب العام في آسيا (2017)، وفاز بدوري أبطال آسيا 2019 مع الهلال، وخاض مع سوريا 70 مباراة دولية مسجلاً 31 هدفاً. يلعب حالياً للوحدة الإماراتي."
