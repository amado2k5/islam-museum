summary:
  ar: "الله بخش محمد عمر سومرو (1900–1943)، سياسي سندي من الهند الاستعمارية، مؤسس حزب اتحاد السند ورئيس وزراء السند مرتين (1938–1940 و1941–1942). عُرف بدفاعه عن وحدة الهندوس والمسلمين ومعارضته تقسيم الهند، وقاد مؤتمر آزاد المسلم لعموم الهند، وتنازل عن ألقابه البريطانية سنة 1942، واغتيل في شكارپور سنة 1943."
  en: "Allah Bux Muhammad Umar Soomro (1900–1943), a Sindhi politician of colonial India, founder of the Sind Ittehad Party and twice Premier of Sindh (1938–1940 and 1941–1942). Known for championing Hindu-Muslim unity and opposing the partition of India, he led the All India Azad Muslim Conference, renounced his British titles in 1942, and was assassinated at Shikarpur in 1943."
  ur: "اللہ بخش محمد عمر سومرو (1900ء–1943ء)، نوآبادیاتی ہندوستان کے سندھی سیاست دان، سندھ اتحاد پارٹی کے بانی اور دو مرتبہ سندھ کے وزیر اعلیٰ (1938ء–1940ء اور 1941ء–1942ء)۔ وہ ہندو مسلم اتحاد کے حامی اور تقسیم ہند کے مخالف تھے، آل انڈیا آزاد مسلم کانفرنس کی قیادت کی، 1942ء میں برطانوی القاب واپس کیے، اور 1943ء میں شکارپور میں قتل ہوئے۔"
