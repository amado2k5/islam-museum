summary:
  ar: "محدث سعودي معاصر، وُلد سنة 1965، أستاذ علوم الحديث بجامعة أم القرى بمكة وعضو سابق في مجلس الشورى. اشتهر بدراساته المنهجية في نقد الحديث، ومن مؤلفاته «المرسل الخفي» و«خلاصة التأصيل» و«المنهج المقترح لفهم موطأ»."
  en: "Contemporary Saudi hadith scholar, born in 1965, professor of hadith sciences at Umm al-Qura University in Mecca and a former Shura Council member. He is known for methodological studies in classical hadith criticism, authoring al-Mursal al-Khafi, Khulasat al-Ta’sil and al-Manhaj al-Muqtarah."
  ur: "عصری سعودی محدث، 1965 میں پیدا ہوئے، مکہ کی ام القریٰ یونیورسٹی میں علومِ حدیث کے پروفیسر اور سابق رکنِ مجلس الشوریٰ۔ وہ کلاسیکی تنقیدِ حدیث کی منہجیاتی تحقیق کے لیے مشہور ہیں؛ تصانیف میں «المرسل الخفی»، «خلاصۃ التأصیل» اور «المنہج المقترح» شامل ہیں۔"
  es: "Erudito saudita contemporáneo en hadices, nacido en 1965, profesor de ciencias del hadiz en la Universidad Umm al-Qura en La Meca y ex miembro del Consejo Shura. Es conocido por sus estudios metodológicos en la crítica de hadices clásicos, siendo autor de al-Mursal al-Khafi, Khulasat al-Ta'sil y al-Manhaj al-Muqtarah."
  fr: "Spécialiste saoudien contemporain des hadiths, né en 1965, professeur de sciences des hadiths à l'Université Umm al-Qura de La Mecque et ancien membre du Conseil de la Choura. Il est connu pour ses études méthodologiques sur la critique classique des hadiths, auteur d'al-Mursal al-Khafi, Khulasat al-Ta'sil et al-Manhaj al-Muqtarah."
  tr: "1965 doğumlu çağdaş bir Suudi hadis âlimidir, Mekke'deki Um Al-Qura Üniversitesi'nde hadis bilimleri profesörü ve Şura Konseyi'nin eski üyesidir. \"Gizli Elçi\", \"Hulasat al-Ta'sil\" ve \"Muwatta'yı Anlamak İçin Önerilen Yöntem\" gibi eserleri içeren hadis eleştirisi metodolojik çalışmalarıyla tanınır."
  id: "Seorang ulama hadis Saudi kontemporer, lahir tahun 1965, profesor ilmu hadis di Universitas um Al-Qura di Mekah dan mantan anggota Dewan Shura. Ia dikenal atas studi metodologisnya dalam kritik hadis, termasuk karya-karya seperti \"The Hidden Messenger,\" \"Khulasat al-Ta'sil,\" dan \"The Proposed Method for Understanding Muwatta.\""
