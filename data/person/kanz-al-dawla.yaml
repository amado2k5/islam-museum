id: person/kanz-al-dawla
class: person
label: { ar: "كنز الدولة", en: "Kanz al-Dawla", es: "Kanz al-Dawla", fr: "Kanz al-Dawla", ur: "کنز الدولہ" }
summary:
  ar: "الكنز صاحب الصعيد الأعلى بمصر؛ خالف في أول سنة سبعين وخمسمائة واجتمع إليه من رعية البلاد والسودان والعرب خلق كثير، فقتل أميراً من الصلاحية في أقطاعه وهو أخو الأمير أبي الهيجاء السمين؛ فسار إليه أبو الهيجاء بعسكر أمدّه به صلاح الدين فقاتله بعد فراغه من طود فقتله ومن معه من الأعراب وأمنت البلاد بعده {cite:kamil-ibn-al-athir p. 64-65}."
  en: "Kanz, lord of the far Said — rose in early 570 drawing locals, Sudanese and Arabs, killed the brother of the Salahiyya amir Abu al-Hayja, and was hunted down and killed with his Arabs after the fall of Tud {cite:kamil-ibn-al-athir p. 64-65}."
  es: "Kanz, señor del lejano Said, ascendió a principios del 570 atrayendo a lugareños, sudaneses y árabes, mató al hermano del emir Salahiyya Abu al-Hayja, y fue perseguido y asesinado junto con sus árabes tras la caída de Tud {cite:kamil-ibn-al-athir p. 64-65}."
  fr: "Kanz, seigneur du lointain Saïd, se leva au début de 570, attirant les locaux, les Soudanais et les Arabes, tua le frère de l'émir Salahiyya Abu al-Hayja, et fut traqué et tué avec ses Arabes après la chute de Tud {cite:kamil-ibn-al-athir p. 64-65}."
  ur: "کنز، دور سید کا آقا - 570 کے اوائل میں مقامی لوگوں، سوڈانی اور عربوں کو کھینچتا رہا، اس نے صالحیہ کے امیر ابو الحیجہ کے بھائی کو قتل کر دیا، اور طود کے زوال کے بعد اس کے عربوں کے ساتھ شکار کر کے قتل کر دیا گیا۔ 64-65}۔"
  tr: "Mısır'daki Yukarı Mısır'ın sahibi el-Kanz; ilk yıl beş yüz yetmiş isyan etti ve ülkeden, Sudan'dan ve Araplardan birçok tebaa ona katıldı. Kendi topraklarında Salahiyye'den bir prensi öldürdü; bu prens Prens Ebu el-Hija el-Samin'in kardeşiydi; Ebu el-Hica, Thod'dan ayrıldıktan sonra Salah al-Din'in sağladığı orduyla ona doğru yürüdü. Onu ve yanında bedevilerden olanları öldürdü ve toprak onun ardından güvence altına alındı {atıf:kamil-ibn-al-athir s. 64-65}."
  id: "Al-Kanz, pemilik Mesir Hulu di Mesir; ia memberontak pada tahun pertama lima ratus tujuh puluh, dan banyak rakyat dari negara, Sudan, dan Arab berkumpul padanya. Ia membunuh seorang pangeran dari Salahiyya di wilayahnya, yang merupakan saudara Pangeran Abu al-Hija al-Samin; Abu al-Hija berjalan ke arahnya dengan pasukan yang disuplai oleh Salah al-Din, yang melawannya setelah ia meninggalkan Thod. Ia membunuh pangeran itu dan orang-orang yang bersamanya dari Badui, dan tanah itu diamankan setelahnya {cite:kamil-ibn-al-athir hlm. 64-65}."
gender: male
