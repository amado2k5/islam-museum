  ar: "الكنز صاحب الصعيد الأعلى بمصر؛ خالف في أول سنة سبعين وخمسمائة واجتمع إليه من رعية البلاد والسودان والعرب خلق كثير، فقتل أميراً من الصلاحية في أقطاعه وهو أخو الأمير أبي الهيجاء السمين؛ فسار إليه أبو الهيجاء بعسكر أمدّه به صلاح الدين فقاتله بعد فراغه من طود فقتله ومن معه من الأعراب وأمنت البلاد بعده {cite:kamil-ibn-al-athir p. 64-65}."
