summary:
  ar: "باحث وكاتب وداعية ومؤرخ كويتي ومدرب في الإدارة والقيادة، وُلد في الكويت سنة 1953. مهندس بترول تدرّب في العلوم الشرعية في شبابه ودرس في الولايات المتحدة عشرين عامًا، وألّف عشرات الكتب في التاريخ الإسلامي والإدارة، وكان مديرًا عامًا لقناة الرسالة الفضائية (2006–2013)، وشارك في تأسيس مدارس في الكويت والسعودية وقطر."
  en: "Kuwaiti researcher, author, preacher and historian, and a trainer in management and leadership, born in Kuwait in 1953. A petroleum engineer trained in the classical Islamic sciences in his youth who studied in the United States for twenty years, he has written dozens of books on Islamic history and management, was general manager of Al-Resalah satellite television (2006–2013), and co-founded schools in Kuwait, Saudi Arabia and Qatar."
  ur: "کویتی محقق، مصنف، مبلغ اور مؤرخ، اور انتظام و قیادت کے مربی، جو 1953 میں کویت میں پیدا ہوئے۔ پیٹرولیم انجینئر، جنہوں نے جوانی میں روایتی اسلامی علوم کی تربیت پائی اور بیس برس امریکہ میں تعلیم حاصل کی؛ اسلامی تاریخ اور انتظام پر درجنوں کتابیں لکھیں، الرسالة سیٹلائٹ ٹیلی ویژن کے ڈائریکٹر جنرل رہے (2006–2013)، اور کویت، سعودی عرب اور قطر میں اسکولوں کے شریک بانی ہیں۔"
  es: "Investigador, autor, predicador e historiador kuwaití, además de formador en gestión y liderazgo, nació en Kuwait en 1953. Ingeniero petrolero formado en ciencias islámicas clásicas en su juventud, estudió en Estados Unidos durante veinte años, ha escrito decenas de libros sobre historia y gestión islámicas, fue director general de la cadena de televisión por satélite Al-Resalah (2006-2013) y cofundó escuelas en Kuwait, Arabia Saudita y Qatar."
  fr: "Chercheur, auteur, prédicateur et historien koweïtien, et formateur en gestion et leadership, né au Koweït en 1953. Ingénieur pétrolier formé aux sciences islamiques classiques dans sa jeunesse, ayant étudié aux États-Unis pendant vingt ans, il a écrit des dizaines de livres sur l'histoire et la gestion islamiques, a été directeur général de la télévision par satellite Al-Resalah (2006-2013) et a cofondé des écoles au Koweït, en Arabie saoudite et au Qatar."
  tr: "Kuveytli araştırmacı, yazar, vaiz, tarihçi ve 1953 yılında Kuveyt doğumlu bir eğitim uzmanıdır. Gençliğinde İslam bilimleri eğitimi almış ve yirmi yıl boyunca Amerika Birleşik Devletleri'nde ders vermiş, İslam tarihi ve yönetimi üzerine onlarca kitap yazmış, 2006–2013 yılları arasında Al-Risala Uydu Kanalı'nın genel müdürlüğünü yapmış ve Kuveyt, Suudi Arabistan ve Katar'da okulların kurulmasında yer almıştır."
  id: "Seorang peneliti, penulis, pengkhotbah, sejarawan, dan pelatih administrasi serta kepemimpinan asal Kuwait, lahir di Kuwait pada tahun 1953. Seorang insinyur perminyakan yang belajar ilmu Islam di masa mudanya dan mengajar di Amerika Serikat selama dua puluh tahun, menulis puluhan buku tentang sejarah dan administrasi Islam, menjadi manajer umum Al-Risala Satellite Channel (2006–2013), dan berpartisipasi dalam pendirian sekolah di Kuwait, Arab Saudi, dan Qatar."
