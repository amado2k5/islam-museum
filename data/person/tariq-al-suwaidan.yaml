summary:
  ar: "باحث وكاتب وداعية ومؤرخ كويتي ومدرب في الإدارة والقيادة، وُلد في الكويت سنة 1953. مهندس بترول تدرّب في العلوم الشرعية في شبابه ودرس في الولايات المتحدة عشرين عامًا، وألّف عشرات الكتب في التاريخ الإسلامي والإدارة، وكان مديرًا عامًا لقناة الرسالة الفضائية (2006–2013)، وشارك في تأسيس مدارس في الكويت والسعودية وقطر."
  en: "Kuwaiti researcher, author, preacher and historian, and a trainer in management and leadership, born in Kuwait in 1953. A petroleum engineer trained in the classical Islamic sciences in his youth who studied in the United States for twenty years, he has written dozens of books on Islamic history and management, was general manager of Al-Resalah satellite television (2006–2013), and co-founded schools in Kuwait, Saudi Arabia and Qatar."
  ur: "کویتی محقق، مصنف، مبلغ اور مؤرخ، اور انتظام و قیادت کے مربی، جو 1953 میں کویت میں پیدا ہوئے۔ پیٹرولیم انجینئر، جنہوں نے جوانی میں روایتی اسلامی علوم کی تربیت پائی اور بیس برس امریکہ میں تعلیم حاصل کی؛ اسلامی تاریخ اور انتظام پر درجنوں کتابیں لکھیں، الرسالة سیٹلائٹ ٹیلی ویژن کے ڈائریکٹر جنرل رہے (2006–2013)، اور کویت، سعودی عرب اور قطر میں اسکولوں کے شریک بانی ہیں۔"
