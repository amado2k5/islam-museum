  ar: "قائد الجرشي؛ عند البلاذري ألجأ إليه أكثر أهل المفازة ضياعهم فغلب على ما فيها وكان يؤدي حق بيت المال فيها حتى توفي وضعف ولده فعرضوها على المأمون فصارت من ضياع الخلافة."
  en: "al-Jurashi's commander; in al-Baladhuri, to whom most of al-Mafaza's people commended their estates — he held them paying the treasury's due until death, his sons then giving the tract to al-Ma'mun as caliphal estates."
  es: "Comandante de al-Jurashi; en al-Baladhuri, a quien la mayoría de la gente de al-Mafaza encomendó sus propiedades, él los mantuvo pagando las cuotas del tesoro hasta su muerte, y luego sus hijos entregaron el territorio a al-Ma'mun como propiedades califales."
  fr: "Le commandant d'al-Jurashi; à al-Baladhuri, à qui la plupart des gens d'al-Mafaza confièrent leurs domaines — il les tint en payant la dette du trésor jusqu'à sa mort, ses fils donnant ensuite le territoire à al-Ma'mun comme domaines califes."
