id: person/hammam-ibn-hani-al-abdi
class: person
label: { ar: "همام بن هانيء العبدي", en: "Hammam ibn Hani' al-Abdi", es: "Hammam ibn Hani' al-Abdi", fr: "Hammam ibn Hani' al-Abdi", ur: "ہمام بن ہانی العبدی" }
summary:
  ar: "قائد الجرشي؛ عند البلاذري ألجأ إليه أكثر أهل المفازة ضياعهم فغلب على ما فيها وكان يؤدي حق بيت المال فيها حتى توفي وضعف ولده فعرضوها على المأمون فصارت من ضياع الخلافة."
  en: "al-Jurashi's commander; in al-Baladhuri, to whom most of al-Mafaza's people commended their estates — he held them paying the treasury's due until death, his sons then giving the tract to al-Ma'mun as caliphal estates."
  es: "Comandante de al-Jurashi; en al-Baladhuri, a quien la mayoría de la gente de al-Mafaza encomendó sus propiedades, él los mantuvo pagando las cuotas del tesoro hasta su muerte, y luego sus hijos entregaron el territorio a al-Ma'mun como propiedades califales."
  fr: "Le commandant d'al-Jurashi; à al-Baladhuri, à qui la plupart des gens d'al-Mafaza confièrent leurs domaines — il les tint en payant la dette du trésor jusqu'à sa mort, ses fils donnant ensuite le territoire à al-Ma'mun comme domaines califes."
  ur: "الجراشی کا کمانڈر؛ البلادھوری میں، جن کے لیے المافضہ کے اکثر لوگوں نے اپنی جاگیروں کی تعریف کی - اس نے انہیں موت تک خزانے کا واجب الادا ادا کرنے پر روک رکھا، اس کے بعد اس کے بیٹوں نے یہ ٹریکٹ المامون کو خلیفہ جات کے طور پر دے دیا۔"
  tr: "Kaid el-Curashi; el-Baladhuri'ye göre, Mafaza halkının çoğu kayıpları nedeniyle ona yöneldi, böylece o da oradaki durumu aştı. Orada kamu hazinesinden hak ettiği payı ödedi, ta ki ölene kadar, oğlu zayıflayana kadar, bu yüzden onu el-Me'mun'a sundular ve bu da halifeliğin kaybının bir parçası oldu."
  id: "Qa'id al-Jurashi; menurut al-Baladhuri, sebagian besar penduduk Mafaza beralih kepadanya karena kehilangan mereka, sehingga ia mengatasi apa yang ada. Ia membayar bagian yang sah dari kas negara di sana hingga ia meninggal, dan putranya menjadi lemah, sehingga mereka menawarkannya kepada al-Ma'mun, dan itu menjadi bagian dari kehilangan kekhalifahan."
