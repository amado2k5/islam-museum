summary:
  ar: "غيتا إيراوان ويرجاوان (وُلد في 21 أيلول 1965 في جاكرتا بإندونيسيا) رجل أعمال إندونيسي ومصرفي استثماري سابق، تولى رئاسة هيئة تنسيق الاستثمار (2009–2012) ووزارة التجارة (2011–2014) في عهد الرئيس سوسيلو بامبانغ يودويونو؛ أسس مجموعة أنكورا ومؤسسة أنكورا التعليمية، وهو شريك مؤسس في إخلاص كابيتال، وترأس اتحاد إندونيسيا لكرة الريشة (2012–2016)، ويقدم منذ 2020 بودكاست «إندغيم» التعليمي."
  en: "Gita Irawan Wirjawan (born 21 September 1965 in Jakarta, Indonesia) is an Indonesian entrepreneur and former investment banker who chaired the Investment Coordinating Board (2009-2012) and served as Minister of Trade (2011-2014) under President Susilo Bambang Yudhoyono; he founded the Ancora Group and the education-focused Ancora Foundation, is a founding partner of Ikhlas Capital, chaired the Badminton Association of Indonesia (2012-2016), and since 2020 has hosted Endgame, one of Indonesia's leading educational podcasts."
  ur: "گیتا ایراوان ویرجاوان (پیدائش 21 ستمبر 1965، جکارتا، انڈونیشیا) انڈونیشی کاروباری و سابق سرمایہ کاری بینکر ہیں؛ وہ سرمایہ کاری رابطہ بورڈ کے چیئرمین (2009–2012) اور صدر سوسیلو بامبانگ یودھویونو کے دور میں وزیر تجارت (2011–2014) رہے؛ انھوں نے انکورا گروپ و انکورا فاؤنڈیشن قائم کیے، اخلاص کیپٹل کے بانی شراکت دار ہیں، انڈونیشیا بیڈمنٹن ایسوسی ایشن کے سربراہ (2012–2016) رہے، اور 2020 سے تعلیمی پوڈکاسٹ «اینڈگیم» پیش کر رہے ہیں۔"
