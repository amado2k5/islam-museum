summary:
  ar: "الركن عبد السلام بن عبد الوهاب بن عبد القادر الجيلاني؛ ولد ليلة ثامن ذي الحجة سنة ثمان وأربعين وخمسمائة، وسمع من جده ودرس بمدرسته وتفقه بها، وولي عدة ولايات، وكان أديباً كيساً مطبوعاً عارفاً بالمنطق والفلسفة والتنجيم وغير ذلك من العلوم الردية حتى نُسب إلى عقيدة الأوائل — قيل إن والده رأى عليه ثوباً بخارياً فقال: مازلنا نسمع البخاري ومسلم، فأما البخاري وكافر فما سمعناه — وكان غير ضابط للسانه يرمى بالفواحش؛ جرت عليه محنة أيام الوزير ابن يونس فأخرج من داره كتب الفلاسفة ورسائل إخوان الصفا وكتب السحر وعبادة النجوم وفيه مخاطبة لزحل بخطه، فأحرقت كتبه على الملأ وحكم القاضي بتفسيقه وأخرجت مدرسة جده من يد أبيه وفوضت إلى ابن الجوزي، وهو الذي سعى على ابن الجوزي حتى قبض عليه ونزل معه في السفينة إلى واسط وادعى عليه هناك مجلساً حضره القضاة؛ توفي يوم الجمعة لثمان خلون من رجب سنة إحدى عشرة وستمائة ودفن شرقي بغداد، وذكره ابن النجار وذمه ذماً بليغاً وأنه لم يحدث بشيء {cite:shadharat-dhahab p. 16, 53-54}."
  en: "Al-Rukn Abd al-Salam b. Abd al-Wahhab b. Abd al-Qadir al-Jilani — b. the night of 8 Dhu al-Hijja 548, grandson and student of Abd al-Qadir, holder of several offices; clever, well-bred, versed in logic, philosophy, astrology and 'those bad sciences' until he was charged with the creed of the ancients — his father, seeing a Bukharan gown on him, joked 'we hear Bukhari and Muslim, but a Bukhari who's a kafir we never heard of'. Under wazir Ibn Yunus his house yielded philosophy books, the Ikhwan al-Safa epistles, sorcery and star-worship texts with an address to Saturn in his own hand; his books were publicly burned, he was ruled fasiq, and his grandfather's madrasa was taken from his father and given to Ibn al-Jawzi — the same man he later informed on until the shaykh was arrested and shipped to Wasit, where Abd al-Salam sued him before the qadis. He died Friday 8 Rajab 611, buried east of Baghdad; Ibn al-Najjar reviled him bitterly and says he never transmitted a word {cite:shadharat-dhahab p. 16, 53-54}."
  fr: "Al-Rukn Abd al-Salam b. Abd al-Wahhab b. Abd al-Qadir al-Jilani — né la nuit du 8 dhu al-hijja 548, petit-fils et élève d'Abd al-Qadir, titulaire de plusieurs charges ; intelligent, cultivé, versé en logique, en philosophie, en astrologie et en « ces sciences mauvaises » jusqu'à être accusé de la croyance des anciens — son père, le voyant vêtu d'une robe boukhariote, plaisanta : « nous entendons al-Bukhari et Muslim, mais d'un Boukhariote mécréant nous n'avions jamais entendu parler ». Sous le vizir Ibn Yunus, on trouva chez lui des livres de philosophie, les épîtres des Ikhwan al-Safa, des textes de sorcellerie et de culte des astres avec une adresse à Saturne de sa main ; ses livres furent brûlés publiquement, il fut déclaré fasiq, et la madrasa de son grand-père fut retirée à son père et donnée à Ibn al-Jawzi — l'homme même qu'il dénonça plus tard jusqu'à ce que le cheikh fût arrêté et envoyé à Wasit, où Abd al-Salam le poursuivit devant les cadis. Il mourut le vendredi 8 rajab 611, inhumé à l'est de Bagdad ; Ibn al-Najjar le blâma durement et dit qu'il ne transmit jamais un mot {cite:shadharat-dhahab p. 16, 53-54}."
  es: "Al-Rukn Abd al-Salam b. Abd al-Wahhab b. Abd al-Qadir al-Jilani — n. la noche del 8 de Dhu al-Hijja 548, nieto y discípulo de Abd al-Qadir, titular de varios cargos; inteligente, bien educado, versado en lógica, filosofía, astrología y \"esas malas ciencias\" hasta que fue acusado del credo de los antiguos; su padre, al verlo con una túnica de Bujara, bromeó: \"Oímos hablar de Bujari y de musulmán, pero de un Bujari que sea un infiel nunca hemos oído hablar\". Bajo el visir Ibn Yunus, su casa produjo libros de filosofía, las epístolas de los Hermanos Musulmanes, textos de hechicería y culto a las estrellas con una alocución a Saturno de su puño y letra; Sus libros fueron quemados públicamente, fue declarado fasiq, y la madrasa de su abuelo le fue arrebatada a su padre y entregada a Ibn al-Jawzi, el mismo hombre al que luego delató hasta que el jeque fue arrestado y enviado a Wasit, donde Abd al-Salam lo demandó ante los cadíes. Murió el viernes 8 de Rajab de 611 y fue enterrado al este de Bagdad; Ibn al-Najjar lo denigró amargamente y afirma que nunca transmitió una sola palabra {cite:shadharat-dhahab p. 16, 53-54}."
