id: person/jafar-ibn-ali-ibn-hamdun
class: person
label: { ar: "جعفر بن علي بن حمدون" }
gender: male
summary:
  ar: "صاحب المسيلة وقائد الشيعة ممدوح ابن هانئ بالفائية المشهورة؛ كان النازع إلى الحكم أول الدولة بمن كان من زناتة والبربر، ثم استعان به ابن أبي عامر على غالب، ثم قتله ابن أبي عامر بممالأة ابن عبد الودود وابن جهور وابن ذي النون {cite:nafh-tib-maqqari p. 433}."
  en: "Lord of Msila and leader of the Zanata party who contested al-Hakam's accession; Ibn Abi Amir used him against Ghalib, then had him killed through Ibn Abd al-Wadud and the Arab magnates {cite:nafh-tib-maqqari p. 433}."
  es: "Señor de Msila y líder del partido Zanata que impugnó la ascensión de al-Hakam; Ibn Abi Amir lo utilizó contra Ghalib, y luego lo mandó matar a través de Ibn Abd al-Wadud y los magnates árabes {cite:nafh-tib-maqqari p. 433}."
  fr: "Seigneur de Msila et chef du parti Zanata qui contesta l'accession d'al-Hakam; Ibn Abi Amir l'utilisa contre Ghalib, puis le fit tuer par l'intermédiaire d'Ibn Abd al-Wadud et des magnats arabes {cite:nafh-tib-maqqari p. 433}."
  ur: "مسیلہ کا رب اور زنتا پارٹی کا رہنما جس نے الحکم کے الحاق کا مقابلہ کیا؛ ابن ابی عامر نے اسے غالب کے خلاف استعمال کیا، پھر اسے ابن عبد الودود اور عرب حکمرانوں کے ذریعے قتل کر دیا۔ 433}۔"
  tr: "El-Masila'nın hükümdarı ve Şii lideri Mamdu bin Hani, nam-ı diğer El-Fa'iyya, Zenata ve Berberilerden gelen ilk iktidara gelendi. Sonra İbn Ebi Amir, Ghalib'e karşı yardım istedi ve İbn Ebi Amir, İbn Abd al-Vadud, İbn Jahur ve İbn Dhi Nun iş birliğiyle onu öldürdü {cite:nafh-tib-maqqari, s. 433}."
  id: "Penguasa Al-Masila dan pemimpin Syiah, Mamdouh ibn Hani, yang dikenal sebagai Al-Fa'iyya, adalah yang pertama berkuasa bersama mereka dari Zenata dan Berber. Kemudian Ibn Abi Amir meminta bantuannya melawan Ghalib, dan kemudian Ibn Abi Amir membunuhnya melalui kerja sama Ibn Abd al-Wadud, Ibn Jahur, dan Ibn Dhi Nun {cite:nafh-tib-maqqari, hlm. 433}."
