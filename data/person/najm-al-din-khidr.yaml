label: { ar: "الملك المسعود نجم الدين خضر", en: "al-Malik al-Mas'ud Najm al-Din Khidr", es: "al-Malik al-Mas'ud Najm al-Din Khidr", fr: "al-Malik al-Mas'ud Najm al-Din Khidr", ur: "المالک المسعود نجم الدین خضر" }
summary:
  ar: "الملك المسعود نجم الدين خضر بن الملك الظاهر ركن الدين بيبرس؛ لما جرى لأخيه الملك السعيد ما ذُكر في ترجمة القاضي جليل وتوجه إلى الكرك ملكه أخوه الملك المسعود نجم الدين خضر بن الملك الظاهر باتفاق ممن كان بها من مماليك أبيه ومن أمرائه وهو الآن متملكها مقيم بها ثم نزل منها بالأمان بعد حصاره فيها في مدة الأمير حسام الدين طرنطاي المنصوري الذي كان نائب المملكة؛ ولم يزل خضر المذكور بها إلى سنة خمس وثمانين فتسلمها منه سلطان الملك المنصور سيف الدين قلاوون الصالحي المعروف بالألفي وبدل منها على مصالحة جرت بينهما وانتقل إلى الديار المصرية ملازماً الخدمة {cite:wafayat-ayan}."
  en: "Al-Malik al-Mas'ud Najm al-Din Khidr — son of Baybars installed at Karak by his father's mamluks; held the castle until 685 when Sultan Qalawun exchanged him out of it and he moved to Egypt in service {cite:wafayat-ayan}."
  es: "Al-Malik al-Mas'ud Najm al-Din Khidr — hijo de Baybars, instalado en Karak por los mamelucos de su padre; mantuvo el castillo hasta 685 cuando el sultán Qalawun lo intercambió por él y se trasladó a Egipto al servicio {cite:wafayat-ayan}."
  fr: "Al-Malik al-Mas'ud Najm al-Din Khidr — fils de Baybars installé à Karak par les mamelouks de son père; a tenu le château jusqu'en 685, date à laquelle le sultan Qalawun l'a échangé et il est parti en Égypte au service de {cite:wafayat-ayan}."
  ur: "المالک المسعود نجم الدین خضر - بیبرس کا بیٹا جو اس کے والد کے مملوکوں نے کرک میں نصب کیا تھا۔ 685 تک اس قلعے پر قابض رہے جب سلطان قلعون نے اس کا تبادلہ کر دیا اور وہ خدمت میں مصر چلا گیا۔"
  tr: "Kral El-Mesud Necmeddin Hidr bin el-Melik'i Zahir Rukn el-Din Baybars; Kadi Celil'in biyografisinde bahsedilen kardeşi el-Melik el-Said yaşananlar nedeniyle, babasının memlükleri ve prensleri arasında olanların anlaşmasıyla kardeşi el-Melik el-Mesud Necmeddin Hidr bin el-Melik'i el-Zahir'in yönettiği Karak'a gitti. Şimdi ise orada sahip olup ikamet ediyordu. Daha sonra, krallığın yardımcısı Prens Hüsam el-Din Tarantay el-Mansuri döneminde kuşatma altında kaldıktan sonra güvenli bir şekilde oraya yerleşti. Khidr 1985'e kadar orada kaldı; o yıl Sultan el-Malik el-Mansur Seyf el-Din Kalavun el-Salihi, nam-ı diğer El-Alfi, aralarındaki uzlaşma yoluyla burayı devraldı. Daha sonra Mısır'a hizmet asistanı olarak geri döndü {alıntı:) Wafayat-ayan}."
  id: "Raja Al-Mas'ud Najm al-Din Khidr bin al-Malik al-Zahir Rukn al-Din Baybars; karena apa yang terjadi pada saudaranya al-Malik al-Sa'id, seperti yang disebutkan dalam biografi Qadi Jalil, ia pergi ke Karak yang dipimpin oleh saudaranya al-Malik al-Mas'ud Najm al-Din Khidr ibn al-Malik al-Zahir, dengan persetujuan dari para mamluk dan pangeran ayahnya, yang kini memiliki dan tinggal di sana. Ia kemudian menetap di sana dengan aman setelah dikepung selama masa pemerintahan Pangeran Hussam al-Din Tarantay al-Mansouri, yang merupakan wakil kerajaan. Khidr tetap di sana hingga tahun 1985, ketika Sultan al-Malik al-Mansur Saif al-Din Qalawun al-Salihi, yang dikenal sebagai Al-Alfi, mengambil alih wilayah itu melalui rekonsiliasi di antara mereka. Ia kemudian kembali ke Mesir sebagai asisten dinas {cite:Wafayat-Ayan}."
