summary:
  ar: "الملك المسعود نجم الدين خضر بن الملك الظاهر ركن الدين بيبرس؛ لما جرى لأخيه الملك السعيد ما ذُكر في ترجمة القاضي جليل وتوجه إلى الكرك ملكه أخوه الملك المسعود نجم الدين خضر بن الملك الظاهر باتفاق ممن كان بها من مماليك أبيه ومن أمرائه وهو الآن متملكها مقيم بها ثم نزل منها بالأمان بعد حصاره فيها في مدة الأمير حسام الدين طرنطاي المنصوري الذي كان نائب المملكة؛ ولم يزل خضر المذكور بها إلى سنة خمس وثمانين فتسلمها منه سلطان الملك المنصور سيف الدين قلاوون الصالحي المعروف بالألفي وبدل منها على مصالحة جرت بينهما وانتقل إلى الديار المصرية ملازماً الخدمة {cite:wafayat-ayan}."
  en: "Al-Malik al-Mas'ud Najm al-Din Khidr — son of Baybars installed at Karak by his father's mamluks; held the castle until 685 when Sultan Qalawun exchanged him out of it and he moved to Egypt in service {cite:wafayat-ayan}."
