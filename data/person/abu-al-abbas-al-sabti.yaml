  ar: "أحمد بن جعفر الخزرجي، أبو العباس السبتي المراكشي، متصوف ولد في سبتة وانتقل إلى مراكش وعلت شهرته، وتوفي سنة 601 هـ، وتنسب إليه «الزايرجة»، واختلف مؤرخوه فيه."
