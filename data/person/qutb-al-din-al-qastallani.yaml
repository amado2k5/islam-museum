summary:
  ar: "الإمام المصري ثم المكي؛ تفقه للشافعي وأفتى ورحل سنة تسع وأربعين فسمع ببغداد ومصر والشام والجزيرة، وكان ممن جمع بين العلم والعمل والهيبة والورع؛ وكان بينه وبين ابن سبعين عداوة وينكر عليه بمكة كثيراً من أحواله، وقد صنّف في الطائفة التي تسلك طريق ابن سبعين فبدأ بالحلاج وختم بالعفيف التلمساني؛ وكان مأوى الفقراء والواردين يبرهم ويعينهم، وطُلب من مكة ففوضت له مشيخة دار الحديث الكاملية بالقاهرة {cite:shadharat-dhahab p. 695-696}."
  en: "The Meccan imam — 'shelter of the fuqara''; wrote against the Ibn Sab'in way, 'beginning with al-Hallaj and ending with Afif al-Tilimsani'; offered the Kamiliyya dar al-hadith in Cairo {cite:shadharat-dhahab p. 695-696}."
  es: "El imán de La Meca, \"refugio de los fuqara\"; escribió contra el camino de Ibn Sab'in, \"comenzando con al-Hallaj y terminando con Afif al-Tilimsani\"; ofreció el Kamiliyya dar al-hadith en El Cairo {citar: shadharat-dhahab p. 695-696}."
  fr: "L'imam mecquois — « refuge de la fuqara »; a écrit contre la manière d'Ibn Sab'in, « en commençant par al-Hallaj et en terminant par Afif al-Tilimsani »; a proposé le Kamiliyya dar al-hadith au Caire {cite: shadharat-dhahab p. 695-696}."
  ur: "مکی امام - 'فقرا کی پناہ گاہ'؛ ابن سبین کے خلاف لکھا، 'الحلج سے شروع اور عفیف التلمسانی پر ختم'؛ قاہرہ میں کاملیہ دار الحدیث پیش کیا 695-696}۔"
  tr: "O dönemde Mısırlı İmam olan Mekke; El-Şafii'den ders aldı, fetvalar verdi ve 1949'da Bağdat, Mısır, Şam ve Cezire'de dinledikten sonra seyahat etti. Bilgi, uygulama, onur ve takvayı birleştirenlerden biriydi. İbn Sab'in'e düşmandı ve Mekke'deki birçok durumu nedeniyle eleştirildi. İbn Saba'in'in yolunu takip eden grup arasında sınıflandırıldı; El-Halaj'dan başlayıp El-Afif El-Tlemsani ile sona erdi; yoksullar ve gelen insanlar için bir sığınak oldu, onlara yardım etti ve destek verdi. Mekke'den talep etti ve Kahire'deki Dar al-Hadis El-Kamiliye şeyhliği ona emanet edildi {atıf: şadharat-zehab, s. 695-696}."
  id: "Imam Mesir kemudian menjadi Mekah; ia belajar di bawah Al-Shafi'i, mengeluarkan fatwa, dan melakukan perjalanan pada tahun 1949, setelah mendengar di Baghdad, Mesir, Levant, dan Al-Jazira. Ia termasuk di antara mereka yang menggabungkan pengetahuan, praktik, martabat, dan kesalehan. Ia bermusuhan dengan Ibn Sab'in dan dikritik karena banyak keadaannya di Mekah. Ia diklasifikasikan dalam kelompok yang mengikuti jejak Ibn Saba'in, dimulai dari Al-Hallaj dan berakhir dengan Al-Afif Al-Tlemsani; ia menjadi tempat perlindungan bagi orang miskin dan yang datang, membantu dan membantu mereka. Ia meminta permohonan dari Mekah, dan kepemimpinan Dar al-Hadith Al-Kamiliya di Kairo dipercayakan kepadanya {cite:shadharat-dhahab, hlm. 695-696}."
