summary:
  ar: "الإمام المصري ثم المكي؛ تفقه للشافعي وأفتى ورحل سنة تسع وأربعين فسمع ببغداد ومصر والشام والجزيرة، وكان ممن جمع بين العلم والعمل والهيبة والورع؛ وكان بينه وبين ابن سبعين عداوة وينكر عليه بمكة كثيراً من أحواله، وقد صنّف في الطائفة التي تسلك طريق ابن سبعين فبدأ بالحلاج وختم بالعفيف التلمساني؛ وكان مأوى الفقراء والواردين يبرهم ويعينهم، وطُلب من مكة ففوضت له مشيخة دار الحديث الكاملية بالقاهرة {cite:shadharat-dhahab p. 695-696}."
  en: "The Meccan imam — 'shelter of the fuqara''; wrote against the Ibn Sab'in way, 'beginning with al-Hallaj and ending with Afif al-Tilimsani'; offered the Kamiliyya dar al-hadith in Cairo {cite:shadharat-dhahab p. 695-696}."
