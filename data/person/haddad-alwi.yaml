summary:
  ar: "منشد وممثل إندونيسي، وُلد في 13 مارس 1966. بدأ سنة 1997 بألبومي الصلوات نور محمد وزيارة رسول، وذاع صيته سنة 1999 بتعاونه مع الطفلة سوليس، فأصدرا معًا ستة ألبومات بعنوان حب الرسول حتى سنة 2004، ويُوصف أولها بأنه ألبوم النشيد الأكثر مبيعًا في تاريخ الموسيقى الإندونيسية. بلغ حسابه في إنستغرام 739,008 متابعين بحسب عدّاد ميكسرنو الحي عند زحفه في 15 نوفمبر 2026."
  en: "Indonesian nasheed singer and actor, born on 13 March 1966. He began in 1997 with the sholawat albums Nur Muhammad and Ziarah Rasul, and rose to fame in 1999 in collaboration with the child singer Sulis; together they released six albums titled Cinta Rasul by 2004, the first of them described as the best-selling nasheed album in Indonesian music history. His Instagram counted 739,008 followers by Mixerno.Space's live counter when crawled on 15 November 2026."
  ur: "انڈونیشیا کے نعت خواں اور اداکار، جو 13 مارچ 1966ء کو پیدا ہوئے۔ انہوں نے 1997ء میں صلوات کے البم ”نور محمد“ اور ”زیارت رسول“ سے آغاز کیا، اور 1999ء میں بچی گلوکارہ سولِس کے ساتھ اشتراک سے شہرت پائی؛ دونوں نے 2004ء تک ”چنتا رسول“ کے عنوان سے چھ البم جاری کیے، جن میں سے پہلا انڈونیشیائی موسیقی کی تاریخ کا سب سے زیادہ بکنے والا نعتیہ البم قرار دیا جاتا ہے۔ مِکسرنو کے لائیو کاؤنٹر کے مطابق، جسے 15 نومبر 2026ء کو پڑھا گیا، ان کے انسٹاگرام فالوور 739,008 تھے۔"
  es: "Cantante y actor indonesio de nasheed, nacido el 13 de marzo de 1966. Comenzó su carrera en 1997 con los álbumes de sholawat Nur Muhammad y Ziarah Rasul, y alcanzó la fama en 1999 en colaboración con el cantante infantil Sulis. Juntos lanzaron seis álbumes titulados Cinta Rasul hasta 2004, siendo el primero de ellos considerado el álbum de nasheed más vendido en la historia de la música indonesia. Su cuenta de Instagram contaba con 739.008 seguidores, según el contador en vivo de Mixerno.Space, al ser consultado el 15 de noviembre de 2026."
  fr: "Chanteur de nasheed et acteur indonésien, né le 13 mars 1966. Il a débuté en 1997 avec les albums de sholawat « Nur Muhammad » et « Ziarah Rasul », et a connu la célébrité en 1999 grâce à sa collaboration avec la jeune chanteuse Sulis; ensemble, ils ont sorti six albums intitulés « Cinta Rasul » jusqu'en 2004, le premier étant considéré comme l'album de nasheed le plus vendu de l'histoire de la musique indonésienne. Son compte Instagram comptait 739 008 abonnés, selon le compteur en direct de Mixerno.Space, au moment de sa collecte le 15 novembre 2026."
