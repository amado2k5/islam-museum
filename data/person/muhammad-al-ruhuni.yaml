summary:
  ar: "محمد بن أحمد بن يوسف الرهوني المغربي، فقيه مالكي ومتكلم، كان مرجع الفتوى في المغرب. من تصانيفه «حاشية على شرح الزرقاني على مختصر خليل» في الفقه، و«التحصين والمنعة ممن اعتقد أن السنة بدعة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
  en: "Muhammad ibn Ahmad ibn Yusuf al-Ruhuni of Morocco, a Maliki jurist and theologian who was the reference for fatwas in Morocco. His works include a gloss on al-Zurqani's commentary on Khalil's Mukhtasar in law, and al-Tahsin wa-al-mana'a, against those who hold that the sunna is an innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
