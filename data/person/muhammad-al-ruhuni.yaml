summary:
  ar: "محمد بن أحمد بن يوسف الرهوني المغربي، فقيه مالكي ومتكلم، كان مرجع الفتوى في المغرب. من تصانيفه «حاشية على شرح الزرقاني على مختصر خليل» في الفقه، و«التحصين والمنعة ممن اعتقد أن السنة بدعة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
  en: "Muhammad ibn Ahmad ibn Yusuf al-Ruhuni of Morocco, a Maliki jurist and theologian who was the reference for fatwas in Morocco. His works include a gloss on al-Zurqani's commentary on Khalil's Mukhtasar in law, and al-Tahsin wa-al-mana'a, against those who hold that the sunna is an innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
  es: "Muhammad ibn Ahmad ibn Yusuf al-Ruhuni de Marruecos, jurista y teólogo malikí, fue la figura de referencia para las fatuas en Marruecos. Entre sus obras destacan un comentario sobre la interpretación que al-Zurqani hizo del Mukhtasar de Khalil en derecho, y al-Tahsin wa-al-mana'a, contra quienes sostienen que la sunna es una innovación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
  fr: "Muhammad ibn Ahmad ibn Yusuf al-Ruhuni, juriste et théologien malikite du Maroc, était une référence en matière de fatwas dans son pays. Parmi ses œuvres figurent une glose du commentaire d'al-Zurqani sur le Mukhtasar de Khalil, ainsi que l'ouvrage al-Tahsin wa-al-mana'a, qui réfute l'idée que la sunna soit une innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1625}"
  ur: "مراکش کے محمد بن احمد بن یوسف الروحونی، ایک مالکی فقیہ اور ماہر الہیات جو مراکش میں فتووں کا حوالہ تھے۔ ان کی تصانیف میں الزرقانی کی تفسیر خلیل کے مختار نامہ پر اور التحسین و المنعہ ان لوگوں کے خلاف ہے جو سنت کو بدعت سمجھتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1625}"
  tr: "Maliki hukukçusu ve teolog Muhammed ibn Ahmed ibn Yusuf el-Rahuni el-Mağribi, Mağrip'teki fetvaların otoritesiydi. Eserleri arasında \"Mükhtasar Halil üzerine al-Zarkani'nin tefsiri üzerine kenar marjinalia\" ve \"El-Tahsin ve el-Man'ah min el-Man Akad el-Sünnet bir yeniliktir\" bulunmaktadır. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.1625}"
  id: "Muhammad ibn Ahmad ibn Yusuf al-Rahuni al-Maghribi, seorang ahli hukum dan teolog Maliki, adalah otoritas fatwa di Maghreb. Di antara karyanya terdapat \"Marginalia on al-Zarqani's commentary on Mukhtasar Khalil\" dalam bidang firisprudensi, dan \"Al-Tahsin wa al-Man'ah min al-Man Aqad al-Sunnah adalah sebuah inovasi.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1625}"
