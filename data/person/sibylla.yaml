summary:
  ar: "سيبيلا ملكة بيت المقدس الفرنجية وزوجة غي دي لوزينيان. لا يسميها ابن الأثير باسمها، لكنه يروي أن الملك انتقل إلى أم الصبي الوارث بعد موته، فأحبت فارساً قدم حديثاً إلى الشام اسمه كي فتزوجته ونقلت إليه الملك وتوجته بحضور البطرك والفرسان الدينيين والبارونات. وبعد فتح بيت المقدس أطلقها صلاح الدين وأذن لها في اللحاق بزوجها المحبوس في قلعة نابلس {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 157}."
  en: "Sibylla was the Frankish queen of Jerusalem and the wife of Guy de Lusignan. Ibn al-Athir does not give her name, but tells that after the death of the boy heir the kingdom passed to his mother, who fell in love with a knight lately arrived in Syria called Kay, married him, transferred the kingdom to him and had him crowned before the patriarch, the military orders and the barons. After the conquest of Jerusalem Saladin released her and let her rejoin her husband, who was held in the castle of Nablus {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 157}."
  ur: "سیبیلا بیت المقدس کی فرنگی ملکہ اور گی دی لوزینیان کی بیوی تھیں۔ ابن الاثیر ان کا نام نہیں لیتے، لیکن بتاتے ہیں کہ وارث بچے کی وفات کے بعد سلطنت اس کی ماں کو منتقل ہوئی، جسے شام میں نئے آئے ہوئے ایک شہسوار کی، جس کا نام «کی» تھا، محبت ہو گئی؛ اس نے اس سے شادی کی، سلطنت اس کے سپرد کی اور بطریق، دینی فوجی تنظیموں اور بیرنوں کی موجودگی میں اسے تاج پہنایا۔ بیت المقدس کی فتح کے بعد صلاح الدین نے انہیں رہا کیا اور شوہر سے ملنے کی اجازت دی، جو نابلس کے قلعے میں قید تھا {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 157}."
