class: person
label: { ar: "منصور بن طلحة الطاهري", en: "Mansur Ibn Talha Al Tahiri", es: "Mansur Ibn Talha Al Tahiri", fr: "Mansur Ibn Talha Al Tahiri", ur: "منصور ابن طلحہ طاہری۔" }
summary:
  ar: "منصور بن طلحة بن طاهر بن الحسين وكان عبد الله بن طاهر يسميه حكم آل طاهر ويعجب به الإعجاب كله وكان يلي مرو وأمل وخوارزم، وله في الفلسفة كتب مشهورة منها كتاب المؤنس في الموسيقى قرأه الكندي فقال هو مؤنس كما سماه صاحبه وله كتاب الإبانة عن أفعال الفلك وكتاب الوجود وكتاب رسالته في العدد والمعدودات وكتاب الدليل والاستدلال {cite:fihrist-ibn-al-nadim p. 170}."
  en: "Mansur ibn Talha — the Tahirids' sage whose Mu'nis al-Kindi praised {cite:fihrist-ibn-al-nadim}"
  es: "Mansur ibn Talha — el sabio de los Tahiríes a quien Mu'nis al-Kindi elogió {cite:fihrist-ibn-al-nadim}"
  fr: "Mansur ibn Talha — le sage des Tahirides dont le Mu'nis al-Kindi a fait l'éloge {cite:fihrist-ibn-al-nadim}"
  ur: "منصور بن طلحہ - طاہریوں کا ایک بابا جس کی معنٰی الکندی نے تعریف کی ہے۔"
  tr: "Mansur ibn Talha ibn Tahir ibn al-Husayn, Abdullah ibn Tahir'in Tahir ailesinin yöneticisi olarak adlandırdığı kişi, herkes tarafından büyük saygı görmüştür. Marw, Amal ve Khwarizm'i takip etti. Ünlü felsefi kitapları vardı; bunlar arasında yazarının kendisine 'Mu'as' dediği 'Al-Mu'annis fi al-Musiq' (Al-Kindi) adlı kitap da vardır. Ayrıca 'Al-Ibanah 'an A'f'al al-Falak', 'Kitab al-Wujud' adlı sayılar ve sayılar üzerine eserini ve 'Al-Dalil wal-Ildal' {cite:fihrist-ibn-al-nadim s. 170} adlı eserleri de yazmıştır."
  id: "Mansur ibn Talha ibn Tahir ibn al-Husayn, yang oleh Abdullah ibn Tahir disebut sebagai penguasa keluarga Tahir, sangat dikagumi oleh semua orang. Ia mengikuti Marw, Amal, dan Khwarizm. Ia memiliki buku-buku filsafat terkenal, termasuk buku 'Al-Mu'annis fi al-Musiq' (Al-Kindi), yang mengatakan bahwa ia adalah 'Mu'as' seperti yang disebut penulisnya. Ia juga menulis 'Al-Ibanah 'an A'f'al al-Falak', 'Kitab al-Wujud', risalah tentang bilangan dan hitungan, serta 'Al-Dalil wal-Ildal' {cite:fihrist-ibn-al-nadim hlm. 170}."
