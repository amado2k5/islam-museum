id: person/mansur-ibn-talha-al-tahiri
class: person
label: { ar: "منصور بن طلحة الطاهري", en: "Mansur Ibn Talha Al Tahiri" }
summary:
  ar: "منصور بن طلحة بن طاهر بن الحسين وكان عبد الله بن طاهر يسميه حكم آل طاهر ويعجب به الإعجاب كله وكان يلي مرو وأمل وخوارزم، وله في الفلسفة كتب مشهورة منها كتاب المؤنس في الموسيقى قرأه الكندي فقال هو مؤنس كما سماه صاحبه وله كتاب الإبانة عن أفعال الفلك وكتاب الوجود وكتاب رسالته في العدد والمعدودات وكتاب الدليل والاستدلال {cite:fihrist-ibn-al-nadim p. 170}."
  en: "Mansur ibn Talha — the Tahirids' sage whose Mu'nis al-Kindi praised {cite:fihrist-ibn-al-nadim}"
