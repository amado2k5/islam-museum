summary:
  ar: "أبو الحسن محمد بن علي بن سهل الماسرجسي. مات سنة ثلاث وثمانين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}، تفقه على أبي إسحاق وخرج معه إلى مصر، وكان متقناً للمذهب، ودرّس بنيسابور وأخذ عنه فقهاؤها، وعليه تفقه شيخ الشيرازي القاضي أبو الطيب الطبري {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu al-Hasan Muhammad ibn Ali ibn Sahl al-Masarjisi. He died in 383 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He studied jurisprudence under Abu Ishaq and went out with him to Egypt; he was proficient in the school, taught at Nishapur, and its jurists took from him. The teacher of al-Shirazi, the qadi Abu al-Tayyib al-Tabari, studied jurisprudence under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  fr: "Abu al-Hasan Muhammad ibn Ali ibn Sahl al-Masarjisi. Il meurt en 383 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Il étudia la jurisprudence sous Abu Ishaq et sortit avec lui en Égypte  ; il était compétent dans l’école, enseigné à Nichapour, et ses juristes lui prirent. Le professeur d'al-Shirazi, le qadi Abu al-Tayyib al-Tabari, a étudié la jurisprudence sous sa direction {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  es: "Abu al-Hasan Muhammad ibn Ali ibn Sahl al-Masarjisi. Murió en 383 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Estudió jurisprudencia con Abu Ishaq y viajó con él a Egipto; era experto en la escuela, impartía clases en Nishapur, y sus juristas aprendieron de él. El maestro de al-Shirazi, el cadí Abu al-Tayyib al-Tabari, estudió jurisprudencia con él {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  ur: "ابو الحسن محمد ابن علی ابن سہل المسرجیسی۔ آپ کی وفات 383ھ میں ہوئی۔ 61}۔ اس نے ابو اسحاق سے فقہ کی تعلیم حاصل کی اور ان کے ساتھ مصر چلا گیا۔ وہ مکتب میں ماہر تھا، نیشاپور میں پڑھایا جاتا تھا، اور اس کے فقہاء نے اس سے سبق لیا تھا۔ الشرازی کے استاد، قاضی ابو الطیب الطبری نے ان کے ماتحت فقہ کی تعلیم حاصل کی۔ 61}۔"
  tr: "Ebu el-Hasan Muhammed bin Ali ibn Sahl el-Mesarjisi. Üç yüz seksen üç yaşında vefat etti {atıf:tabaqat-fuqaha-abbas-1981, s. 61}. Ebu İshaq'ın yanında hukuk eğitimi aldı ve onunla birlikte Mısır'a gitti. Düşünce okulunda oldukça bilgiliydi, Nişapur'da eğitim aldı ve onun yanında hukukçular eğitim gördü. Buna göre, Şirazi âlimi Hakim Ebu el-Teyyib el-Tabari, hukuk eğitimi aldı {atıf:tabaqat-fuqaha-abbas-1981, s. 61}."
  id: "Abu al-Hasan Muhammad ibn Ali ibn Sahl al-Masarjisi. Ia meninggal pada tahun tiga ratus delapan puluh tiga {cite:tabaqat-fuqaha-abbas-1981, hlm. 61}. Ia belajar hukum di bawah bimbingan Abu Ishaq dan pergi bersamanya ke Mesir. Ia sangat menguasai aliran pemikiran, belajar di Nishapur, dan para ahli hukumnya belajar di bawah bimbingannya. Oleh karena itu, ulama Syiah, Hakim Abu al-Tayyib al-Tabari, mempelajari hukum {cite:tabaqat-fuqaha-abbas-1981, hlm. 61}."
