summary:
  ar: "أبو الحسن محمد بن علي بن سهل الماسرجسي. مات سنة ثلاث وثمانين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}، تفقه على أبي إسحاق وخرج معه إلى مصر، وكان متقناً للمذهب، ودرّس بنيسابور وأخذ عنه فقهاؤها، وعليه تفقه شيخ الشيرازي القاضي أبو الطيب الطبري {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu al-Hasan Muhammad ibn Ali ibn Sahl al-Masarjisi. He died in 383 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He studied jurisprudence under Abu Ishaq and went out with him to Egypt; he was proficient in the school, taught at Nishapur, and its jurists took from him. The teacher of al-Shirazi, the qadi Abu al-Tayyib al-Tabari, studied jurisprudence under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
