summary:
  ar: "بطاقة أولية لإبراهيم سلطان بن شاه رخ التيموري، حاكم فارس وراعي فنونها وخطاطها الذي رعى بلاط شيراز، توفي سنة ١٤٣٥م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ibrahim Sultan ibn Shahrukh, the Timurid governor of Fars, patron of arts and calligrapher whose Shiraz court he nourished, d. 1435; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ibrahim Sultan ibn Shahrukh, gobernador timúrida de Fars, mecenas de las artes y calígrafo cuya corte de Shiraz apoyó, fallecido en 1435; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche d'identité d'Ibrahim Sultan ibn Shahrukh, gouverneur timouride de Fars, mécène des arts et calligraphe dont il a nourri la cour de Shiraz, mort en 1435; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "فارس کے تیموری گورنر ابراہیم سلطان ابن شاہ رخ کے لیے ڈرافٹ کارڈ، فنون کے سرپرست اور خطاط جن کی شیراز کے دربار میں اس نے پرورش کی، ڈی۔ 1435; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "İran'ın hükümdarı, sanatlarının hamisi ve Şiraz sarayını denetleyen hat ustası İbrahim Sultan bin Şah Rukh al-Timurid hükümdarının ön kartı 1435 yılında öldü; İslami Sözlüklerde adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Ibrahim Sultan bin Shah Rukh al-Timurid, penguasa Persia, pelindung seni di sana dan kaligrafer yang mengawasi istana Shiraz, meninggal pada tahun 1435 M; ia disebutkan dalam Kamus Islam dan terjemahannya belum ditinjau di halaman tersebut."
