summary:
  en: "A prominent nobleman of Banu Makhzum and brother of Abu Jahl; after fierce opposition to Islam at Badr and Uhud, he embraced Islam on the day of the conquest of Mecca, was granted one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, and fell as a martyr in the conquest of Syria."
  ar: "شريف من سادات بني مخزوم وأخو أبي جهل بن هشام؛ حارب المسلمين ببدر وأحد ثم أسلم يوم فتح مكة وحسن إسلامه، وأعطاه النبي مئة بعير بالجعرانة، واستُشهد في فتوح الشام."
