label: { ar: "أحمد بن الطيب السرخسي", en: "Ahmad ibn al-Tayyib al-Sarakhsi", fr: "Ahmad ibn al-Tayyib al-Sarakhsi", es: "Ahmad ibn al-Tayyib al-Sarakhsi", ur: "احمد بن الطیب السرخسی" }
summary:
  ar: "صاحب يعقوب بن إسحاق الكندي، ولي الحسبة ببغداد وكان موضعه من الفلسفة لا يجهل وله مصنفات في أنواع الفلسفة وفنون الأخبار، قبض عليه المعتضد سنة ثلاث وثمانين ومائتين وسلمه إلى بدر غلامه وقرر جوازيه على المال حتى استخرجوا مائة ألف دينار وخمسين ألفاً من العين والورق وثمن الآلات، وتنازع الناس في كيفية قتله وسببه {cite:muruj-al-dhahab p. 620-621}."
  en: "Al-Kindi's pupil and Baghdad's muhtasib, whose confiscation and killing under al-Mu'tadid yielded 150,000 dinars {cite:muruj-al-dhahab p. 620-621}."
  fr: "Élève d'al-Kindi et muhtasib de Bagdad, dont la confiscation des biens et la mise à mort sous al-Mu'tadid rapportèrent 150 000 dinars {cite:muruj-al-dhahab p. 620-621}."
  es: "Discípulo de Al-Kindi y muhtasib de Bagdad, cuya confiscación y asesinato bajo el mandato de al-Mu'tadid produjo 150.000 dinares {cite:muruj-al-dhahab p. 620-621}."
  ur: "الکندی کا شاگرد اور بغداد کا محتسب، جس کی ضبطی اور المتدید کے تحت قتل کرنے سے 150,000 دینار حاصل ہوئے۔ 620-621}۔"
  tr: "Yakub ibn İshak el-Kindi, Bağdat'taki pazarın sahibiydi ve felsefe alanındaki konumu da biliniyordu. Felsefe türleri ve habercilik sanatları üzerine eserleri vardı. El-Mu'tadid onu 283 yılında tutukladı ve kölesi Bedir'e teslim etti. Yüz bin elli bin dinar nakit ve senet ile aletlerin bedelini alana kadar onu serbest bırakmaya karar verdiler. İnsanlar onun nasıl öldürüldüğü ve sebebi konusunda ihtilafa düştüler. {Kaynak: Muruj-al-Dhahab s. 620-621}"
  id: "Yaqub ibn Ishaq al-Kindi adalah pemilik pasar di Baghdad, dan kedudukannya dalam bidang filsafat tidak diragukan lagi. Ia memiliki karya-karya tentang berbagai jenis filsafat dan seni jurnalistik. Al-Mu’tadid menangkapnya pada tahun 283 dan menyerahkannya kepada Badr, budaknya, dan memutuskan untuk membebaskannya dengan jaminan uang hingga mereka mendapatkan seratus ribu lima puluh ribu dinar dalam bentuk tunai dan kertas serta harga peralatan. Orang-orang memperdebatkan bagaimana ia dibunuh dan alasannya. {cite:muruj-al-dhahab hlm. 620-621}."
