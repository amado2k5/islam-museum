summary:
  ar: "ناصر الدين محمد شاه (أغسطس 1702 – 26 أبريل 1748)، المولود روشن أختر، ثالث عشر أباطرة المغول في الهند (1719–1748). نصّبه السيدان برها ثم تخلّص منهما، وشهد عهده غزو نادر شاه ونهب دلهي سنة 1739 وتسارع انحسار الإمبراطورية، وكان راعيًا كبيرًا للفنون والموسيقى والشعر، ولُقّب بـ«رنغيلا» أي الملوّن."
  en: "Nasir-ud-Din Muhammad Shah (August 1702 – 26 April 1748), born Roshan Akhtar, was the thirteenth Mughal emperor of India (1719–1748). Raised to the throne by the Sayyid Brothers, he freed himself of them, and his reign saw Nader Shah's invasion and the sack of Delhi in 1739 and the empire's accelerating decline. He was a great patron of the arts, music and poetry, and is remembered by his sobriquet Rangeela, the Colourful."
  ur: "نصیر الدین محمد شاہ (اگست 1702ء – 26 اپریل 1748ء)، اصل نام روشن اختر، ہندوستان کے تیرھویں مغل بادشاہ تھے (1719ء–1748ء)۔ سید برادران نے انھیں تخت پر بٹھایا پھر وہ ان سے آزاد ہوئے؛ ان کے عہد میں نادر شاہ کا حملہ اور 1739ء میں دہلی کی تباہی ہوئی اور سلطنت کا زوال تیز ہو گیا۔ وہ فنون، موسیقی اور شاعری کے بڑے سرپرست تھے اور «رنگیلا» کے لقب سے یاد کیے جاتے ہیں۔"

