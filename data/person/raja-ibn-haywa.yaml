label: { ar: "رجاء بن حيْوة الكندي" }
summary:
  ar: "مستشار سليمان بن عبد الملك، أشار عليه باستخلاف عمر بن عبد العزيز ثم يزيد بن عبد الملك من بعده وأن يكتب العهد مختوماً وتدعى الأمة إلى بيعته، فامتنع عن إطلاع هشام وعمر نفسيهما على مضمونه حتى مات سليمان وانكشف الكتاب، وروى عن عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 371-372}.، ودعاه سليمان مع الزهري ومكحول عند موته بمرج دابق فكتب وصيته وأشهدهم عليها {cite:muruj-al-dhahab p. 172} ويذكر الكتاب أنه كان مستشاراً لسليمان بن عبد الملك وأشار عليه باستخلاف عمر بن عبد العزيز، ورتّب ذلك بحكمة وحنكة. {cite:salabi-umayyad-state-2020 p.149} وفي مرض سليمان بدابق سأله عن الخلافة من بعده، فأشار بعمر بن عبد العزيز، وأشار بأن يُكتب العهد ويُختم، فكتب سليمان العهد لعمر ثم ليزيد بن عبد الملك، وتولى رجاء أخذ البيعة عليه. {cite:salabi-umayyad-state-2020 p.155-157} ويذكر الكتاب أن رجاء حضر بيعة عمر، وأنه أخذ البيعة من الناس لعمر بعد أن قرئ عليهم الكتاب بحضور سليمان، وأنه أبلغ هشاماً أنه لن يخبره بالكتاب. {cite:salabi-umayyad-state-2020 p.184-186} ويذكر الكتاب أنه كان كبير المنزلة عند سليمان وعمر، وأنه أجرى الله على يديه الخيرات، ثم أخذ يتراجع عن القرب من الخلفاء. {cite:salabi-umayyad-state-2020 p.278}"
  en: "Counsellor of Sulayman ibn Abd al-Malik, who advised him to settle the succession on Umar ibn Abd al-Aziz with Yazid ibn Abd al-Malik after him, and to write the deed sealed so the people would swear allegiance to its unnamed contents; he kept the secret from both Hisham and Umar himself until Sulayman's death unveiled the letter — and transmitted hadith from Umar ibn Abd al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 371-372}."
