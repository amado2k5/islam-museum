label: { ar: "رجاء بن حيْوة الكندي" }
summary:
  ar: "مستشار سليمان بن عبد الملك، أشار عليه باستخلاف عمر بن عبد العزيز ثم يزيد بن عبد الملك من بعده وأن يكتب العهد مختوماً وتدعى الأمة إلى بيعته، فامتنع عن إطلاع هشام وعمر نفسيهما على مضمونه حتى مات سليمان وانكشف الكتاب، وروى عن عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 371-372}.، ودعاه سليمان مع الزهري ومكحول عند موته بمرج دابق فكتب وصيته وأشهدهم عليها {cite:muruj-al-dhahab p. 172}"
  en: "Counsellor of Sulayman ibn Abd al-Malik, who advised him to settle the succession on Umar ibn Abd al-Aziz with Yazid ibn Abd al-Malik after him, and to write the deed sealed so the people would swear allegiance to its unnamed contents; he kept the secret from both Hisham and Umar himself until Sulayman's death unveiled the letter — and transmitted hadith from Umar ibn Abd al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 371-372}."
