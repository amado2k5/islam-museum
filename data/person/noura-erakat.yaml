summary:
  ar: "باحثة قانونية فلسطينية أمريكية (وُلدت في كاليفورنيا سنة 1980)، أستاذة في جامعة روتجرز ومؤسِّسة مشاركة لمجلة «جدلية» الإلكترونية. كتابها «عدالة للبعض: القانون وقضية فلسطين» (2019) من أبرز دراسات القانون الدولي والقضية الفلسطينية."
  en: "Palestinian-American legal scholar (born 1980 in California), professor at Rutgers University and co-founder of the online magazine Jadaliyya. Her book Justice for Some: Law and the Question of Palestine (2019) is a leading study of international law and the Palestinian question."
  ur: "فلسطینی نژاد امریکی قانونی اسکالر (پیدائش 1980ء، کیلیفورنیا)، روٹگرز یونیورسٹی میں پروفیسر اور آن لائن مجلّے «جدلیہ» کی شریک بانی۔ ان کی کتاب «چند کے لیے انصاف: قانون اور قضیۂ فلسطین» (2019ء) بین الاقوامی قانون اور قضیۂ فلسطین پر ممتاز مطالعوں میں سے ہے۔"
