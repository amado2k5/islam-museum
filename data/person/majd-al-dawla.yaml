id: person/majd-al-dawla
class: person
label: { ar: "مجد الدولة رستم بن فخر الدولة" }
summary:
  ar: "رستم بن فخر الدولة، أقيم في سلطنة الري وأعمالها لما مات أبوه سنة سبع وثمانين وهو ابن أربع سنين ولقبه القادر مجد الدولة {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  en: "Fakhr al-Dawla's four-year-old son, installed over Rayy on his father's death in 387 and titled Majd al-Dawla by al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  es: "Hijo de cuatro años de Fakhr al-Dawla, instalado sobre Rayy tras la muerte de su padre en 387 y titulado Majd al-Dawla por al-Qadir {cita:tarikh-khulafa-minhaj-1434 p. 635}."
  fr: "Fils de quatre ans de Fakhr al-Dawla, installé à la tête de Rayy à la mort de son père en 387 et intitulé Majd al-Dawla par al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  ur: "فخر الدولہ کے چار سالہ بیٹے نے 387 میں اپنے والد کی وفات پر رے پر نصب کیا اور القادر کے ذریعہ مجد الدولہ کا لقب دیا 635}۔"
  tr: "Rüstem bin Fakhr al-Dawla, babası seksen yedi yaşında dört yaşında öldüğünde Rayy Sultanlığı ve topraklarında kuruldu ve kendisine el-Kadir Majd el-Devle unvanı verildi {cite:History-Khulafa-minhaj-1434 s. 635}."
  id: "Rustam ibn Fakhr al-Dawla didirikan di Kesultanan Rayy dan wilayahnya ketika ayahnya meninggal pada tahun delapan puluh tujuh pada usia empat tahun, dan ia diberi gelar al-Qadir Majd al-Dawla {cite:History-Khulafa-minhaj-1434 hlm. 635}."
