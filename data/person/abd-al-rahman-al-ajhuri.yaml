summary:
  ar: "عبد الرحمن بن حسن بن عمر الأجهوري المالكي، أديب ومؤرخ ومقرئ، أخذ العلم عن الشبراوي والشهاب النفراوي والشمس الخفي وغيرهم، وسمع الحديث من جماعة، وأخذ القراءات عن مصطفى الخليجي، ودرس في الأزهر مدة في أنواع من الفنون، وأتقن العربية والأصول والقراءات، وعُيّن للتدريس في السنانية ببولاق. من تصانيفه «الملتاذ في الأربعة الشواذ» وشرح «تشنيف السمع» ببعض لطائف الوضع، و«مشارق الأنوار في آل البيت الأخيار» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758}. وتاريخ وفاته في الكتاب (؟-1198 ه)."
  en: "Abd al-Rahman ibn Hasan ibn Umar al-Ajhuri, a Maliki scholar who was also a man of letters, historian and reciter. He studied with al-Shabrawi, al-Shihab al-Nafrawi and al-Shams al-Khafi, took readings from Mustafa al-Khaliji, and taught at al-Azhar for a time in many fields; he mastered Arabic grammar, the roots of law and the readings, and was appointed to teach at the Sinnaniyya in Bulaq. His works include al-Multadh fi al-arba'a al-shudhudh, a commentary on Tashnif al-sam', and Mashariq al-anwar fi Al al-Bayt al-akhyar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758}. The book gives his death as 1198 AH."
  ur: "عبد الرحمن بن حسن بن عمر اجہوری مالکی، ادیب، مؤرخ اور قاری۔ انہوں نے شبراوی، شہاب نفراوی اور شمس خفی وغیرہ سے علم حاصل کیا، کئی محدثین سے حدیث سنی، اور مصطفیٰ خلیجی سے قراءات لیں۔ جامعہ ازہر میں مختلف فنون کی تدریس کی، عربی، اصول اور قراءات میں مہارت رکھتے تھے، اور بولاق کی سنانیہ مدرسہ میں تدریس پر مقرر ہوئے۔ ان کی تصانیف میں الملتاذ فی الأربعۃ الشواذ اور تشنیف السمع کی شرح شامل ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13758}۔ کتاب ان کی وفات 1198 ہجری بتاتی ہے۔"
