summary:
  ar: "أمية بن عبد شمس بن عبد مناف بن قصي، الذي إليه تنتسب بنو أمية؛ كان ذا مال فتكلف أن يفعل كما فعل هاشم في إطعام قريش فعجز فشمت به ناس وعابوه فغضب ونافر هاشماً على خمسين ناقة سود الحدق تُنحر بمكة وعلى الجلاء عشر سنين وجعلا بينهما الكاهن الخزاعي جد عمرو بن الحمق ومنزله عسفان، فحكم لهاشم فنحر هاشم الإبل وأطعم لحمها وخرج أمية إلى الشام فأقام عشر سنين فتلك أول عداوة وقعت بين هاشم وأمية {cite:ansab-al-ashraf p. 61-62}."
  en: "Umayya ibn Abd Shams, eponym of the Banu Umayya; wealthy, he tried and failed to match Hashim's feeding of Quraysh, and when mocked he wagered fifty black-eyed camels and ten years' exile on a munafara — the Khuza'i soothsayer judged for Hashim, and Umayya spent ten years in Syria: 'the first enmity between Hashim and Umayya' {cite:ansab-al-ashraf p. 61-62}."
