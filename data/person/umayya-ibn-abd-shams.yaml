id: person/umayya-ibn-abd-shams
class: person
label: { ar: "أمية بن عبد شمس" }
summary:
  ar: "أمية بن عبد شمس بن عبد مناف بن قصي، الذي إليه تنتسب بنو أمية؛ كان ذا مال فتكلف أن يفعل كما فعل هاشم في إطعام قريش فعجز فشمت به ناس وعابوه فغضب ونافر هاشماً على خمسين ناقة سود الحدق تُنحر بمكة وعلى الجلاء عشر سنين وجعلا بينهما الكاهن الخزاعي جد عمرو بن الحمق ومنزله عسفان، فحكم لهاشم فنحر هاشم الإبل وأطعم لحمها وخرج أمية إلى الشام فأقام عشر سنين فتلك أول عداوة وقعت بين هاشم وأمية {cite:ansab-al-ashraf p. 61-62}."
  en: "Umayya ibn Abd Shams, eponym of the Banu Umayya; wealthy, he tried and failed to match Hashim's feeding of Quraysh, and when mocked he wagered fifty black-eyed camels and ten years' exile on a munafara — the Khuza'i soothsayer judged for Hashim, and Umayya spent ten years in Syria: 'the first enmity between Hashim and Umayya' {cite:ansab-al-ashraf p. 61-62}."
  es: "Umayya ibn Abd Shams, epónimo de los Banu Umayya; rico, intentó, sin éxito, igualar la alimentación de los Quraysh por parte de Hashim, y cuando fue objeto de burlas, apostó cincuenta camellos de ojos negros y diez años de exilio a un munafara; el adivino Khuza'i falló a favor de Hashim, y Umayya pasó diez años en Siria: 'la primera enemistad entre Hashim y Umayya' {cite:ansab-al-ashraf p. 61-62}."
  fr: "Umayya ibn Abd Shams, éponyme des Banu Umayya; riche, il essaya sans succès d'égaler la générosité de Hashim envers les Quraysh, et lorsqu'il fut moqué, il paria cinquante chameaux aux yeux noirs et dix ans d'exil sur une munafara — le devin Khuza'i jugea en faveur de Hashim, et Umayya passa dix ans en Syrie: « la première inimitié entre Hashim et Umayya » {cite: ansab-al-ashraf p. 61-62}."
  ur: "امیہ بن عبد شمس، بنو امیہ کا تخلص؛ دولت مند، اس نے ہاشم کے قریش کے کھانے کو پورا کرنے کی کوشش کی اور ناکام رہا، اور جب اس کا مذاق اڑایا گیا تو اس نے ایک منافرہ پر پچاس کالی آنکھوں والے اونٹ اور دس سال کی جلاوطنی پر دوڑ لگا دی - خزاعی کاہن ہاشم کا فیصلہ کرتا تھا، اور امیہ نے دس سال شام میں گزارے: 'ہاشم اور امیہ کے درمیان پہلی دشمنی'۔ 61-62}۔"
  tr: "Emeviyelerin ait olduğu Umeyye ibn Abd Şems ibn Abd Manaf ibn Qusay; serveti vardı ve Haşim'in yaptığı gibi Kureyşleri beslemeyi üstlendi. Bunu yapamadı, bu yüzden insanlar onu aşağıladı ve eleştirdi. Mekke'de ve El-Cela'da on yıl boyunca kesilecek elli siyah tenli dişi deve yüzünden öfkelendi ve Haşim'i azarladı. Aralarına, evi Usfan olan Amr ibn al-Hamq'ın dedesi olan rahip El-Huza'i'yi yerleştirdiler. Haşim Haşim için hüküm sürdü, bu yüzden Haşim develeri kesip etlerini besledi. Umiye Şam'a gitti ve on yıl orada kaldı. Bu, Haşim ile Umeyye arasındaki ilk düşmanlıktı {atıf:ansab-al-ashraf, s. 61-62}."
  id: "Umayyah ibn Abd Shams ibn Abd Manaf ibn Qusay, yang menjadi milik Umayyah; ia memiliki kekayaan dan mengambil tanggung jawab untuk melakukan seperti yang dilakukan Hashim dalam memberi makan Quraisy. Ia tidak mampu melakukannya, sehingga orang-orang menghina dan mengkritiknya. Ia menjadi marah dan menegur Hashim atas lima puluh unta betina berkulit hitam untuk disembelih di Mekah dan di Al-Jala' selama sepuluh tahun. Mereka menempatkan di antara mereka pendeta Al-Khuza'i, kakek Amr ibn al-Hamq, yang rumahnya adalah Usfan. Hashim memerintah untuk Hashim, sehingga Hashim menyembelih unta dan memberi makan daging mereka. Umayyah pergi ke Levant dan tinggal selama sepuluh tahun. Itulah permusuhan pertama antara Hashim dan Umayyah {cite:ansab-al-ashraf, hlm. 61-62}."
