summary:
  ar: "مهندس طيران وسياسي إندونيسي، وُلد في باريبار بجنوب سولاوسي سنة 1936، بنى صناعة الطيران الإندونيسية وقاد شركتها الوطنية، وتولّى وزارة البحث والتكنولوجيا عشرين عامًا، ثم صار الرئيس الثالث لإندونيسيا (1998–1999) فأطلق الإصلاحات الديمقراطية وأنهى احتلال تيمور الشرقية، وتوفي في جاكرتا سنة 2019."
  en: "Indonesian aeronautical engineer and statesman, born at Parepare in South Sulawesi in 1936. He built Indonesia's aircraft industry, served twenty years as minister of research and technology, and as the country's third president (1998-1999) opened the democratic reform era and ended the occupation of East Timor. He died at Jakarta in 2019."
  ur: "انڈونیشیائی فضائی انجینئر اور سیاست دان، جو 1936 میں جنوبی سولاویسی کے پارے پارے میں پیدا ہوئے۔ انہوں نے انڈونیشیا کی ہوائی جہاز سازی کی صنعت قائم کی، بیس برس وزیرِ تحقیق و ٹیکنالوجی رہے، اور ملک کے تیسرے صدر (1998–1999) کی حیثیت سے جمہوری اصلاحات کا آغاز کیا اور مشرقی تیمور پر قبضہ ختم کیا۔ 2019 میں جکارتا میں وفات پائی۔"
