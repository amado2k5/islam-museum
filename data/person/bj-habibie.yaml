summary:
  ar: "مهندس طيران وسياسي إندونيسي، وُلد في باريبار بجنوب سولاوسي سنة 1936، بنى صناعة الطيران الإندونيسية وقاد شركتها الوطنية، وتولّى وزارة البحث والتكنولوجيا عشرين عامًا، ثم صار الرئيس الثالث لإندونيسيا (1998–1999) فأطلق الإصلاحات الديمقراطية وأنهى احتلال تيمور الشرقية، وتوفي في جاكرتا سنة 2019."
  en: "Indonesian aeronautical engineer and statesman, born at Parepare in South Sulawesi in 1936. He built Indonesia's aircraft industry, served twenty years as minister of research and technology, and as the country's third president (1998-1999) opened the democratic reform era and ended the occupation of East Timor. He died at Jakarta in 2019."
  ur: "انڈونیشیائی فضائی انجینئر اور سیاست دان، جو 1936 میں جنوبی سولاویسی کے پارے پارے میں پیدا ہوئے۔ انہوں نے انڈونیشیا کی ہوائی جہاز سازی کی صنعت قائم کی، بیس برس وزیرِ تحقیق و ٹیکنالوجی رہے، اور ملک کے تیسرے صدر (1998–1999) کی حیثیت سے جمہوری اصلاحات کا آغاز کیا اور مشرقی تیمور پر قبضہ ختم کیا۔ 2019 میں جکارتا میں وفات پائی۔"
  es: "Ingeniero aeronáutico y estadista indonesio, nacido en Parepare, Sulawesi del Sur, en 1936. Impulsó la industria aeronáutica de Indonesia, fue ministro de Investigación y Tecnología durante veinte años y, como tercer presidente del país (1998-1999), inauguró la era de las reformas democráticas y puso fin a la ocupación de Timor Oriental. Falleció en Yakarta en 2019."
  fr: "Ingénieur aéronautique et homme d'État indonésien, né à Parepare, dans le sud de Sulawesi, en 1936, il a bâti l'industrie aéronautique indonésienne, a été ministre de la Recherche et de la Technologie pendant vingt ans et, en tant que troisième président du pays (1998-1999), a inauguré l'ère des réformes démocratiques et mis fin à l'occupation du Timor oriental. Il est décédé à Jakarta en 2019."
  tr: "1936'da Güney Sulavesi'nin Baribar şehrinde doğan Endonezyalı havacılık mühendisi ve politikacı olan Endonezya'nın havacılık endüstrisini kurdu ve ulusal şirketini yönetti. Yirmi yıl boyunca Araştırma ve Teknoloji Bakanı olarak görev yaptı, ardından Endonezya'nın üçüncü cumhurbaşkanı oldu (1998–1999), demokratik reformlar başlattı, Doğu Timor'un işgalini sona erdirdi ve 2019'da Cakarta'da hayatını kaybetti."
  id: "Seorang insinyur dan politikus kedirgantaraan Indonesia, lahir di Baribar, Sulawesi Selatan, pada tahun 1936, ia membangun industri penerbangan Indonesia dan memimpin perusahaan nasionalnya. Ia menjabat sebagai Menteri Riset dan Teknologi selama dua puluh tahun, kemudian menjadi presiden ketiga Indonesia (1998–1999), meluncurkan reformasi demokrasi, mengakhiri pendudukan Timor Timur, dan meninggal di Jakarta pada tahun 2019."
