summary:
  ar: "عالم شافعي قاهري مشارك في أنواع من العلوم، أخذ عن علي بن غانم المقدسي وحمدان الفقيه ومحمد البكري، وعنه سليمان البابلي وعلي الأجهوري؛ من مصنفاته التيسير في شرح الجامع الصغير، وفيض القدير، وتيسير الوقوف على غوامض أحكام الوقوف، وشرح التحرير في فروع الفقه الشافعي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5160}."
  en: "A Shafii scholar of Cairo, learned in several fields, who studied with Ali ibn Ghanim al-Maqdisi, Hamdan al-Faqih and Muhammad al-Bakri, and taught Sulayman al-Babili and Ali al-Ajhuri; his works include al-Taysir (a commentary on the Jami al-Saghir), Fayd al-Qadir, Taysir al-Wuquf and a commentary on al-Tahrir in Shafii law {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5160}."
