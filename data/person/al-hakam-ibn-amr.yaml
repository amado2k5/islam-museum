id: person/al-hakam-ibn-amr
class: person
label: { ar: "الحكم بن عمرو الغفاري", en: "al-Hakam ibn Amr al-Ghifari", fr: "Al-Hakam ibn Amr al-Ghifari", es: "al-Hakam ibn Amr al-Ghifari", ur: "الحکم ابن عمرو غفاری" }
summary:
  ar: "الحكم بن عمرو الغفاري وكان عفيفاً وله صحبة؛ ولاه زياد خراسان إذ أراد الحكم بن أبي العاص فأتي به فتبرك به وقال رجل صالح من أصحاب رسول الله فمات بها سنة ٥٠ وكان أول من صلى من وراء النهر وفتح بلاد الصغانيان."
  en: "al-Hakam ibn Amr al-Ghifari, a chaste Companion; fetched to Ziyad by mistake for al-Hakam ibn Abi al-As, he was blessed and given Khurasan — died there 50h, the first to pray beyond the river and the conqueror of the Saghaniyan lands."
  fr: "Al-Hakam ibn Amr al-Ghifari, Compagnon chaste ; amené à Ziyad par erreur à la place d’al-Hakam ibn Abi al-As, il reçut sa bénédiction et le Khorassan. Il y mourut en 50 H, premier à prier au-delà du fleuve et conquérant du pays des Saghaniyan."
  es: "al-Hakam ibn Amr al-Ghifari, un Compañero casto; llevado a Ziyad por error en lugar de al-Hakam ibn Abi al-As, fue bendecido y se le concedió Jorasán; murió allí en el año 50 de la Hégira, siendo el primero en orar más allá del río y el conquistador de las tierras de Saghaniya."
  ur: "الحکم ابن عمرو الغفاری، ایک پاکیزہ صحابی؛ الحکم ابن ابی العاص کے لیے غلطی سے زیاد کے پاس لایا گیا، اسے برکت دی گئی اور خراسان دیا گیا - وہیں 50 ہجری میں فوت ہوا، وہ سب سے پہلے دریا کے پار نماز پڑھنے والا اور صغانیہ کی سرزمین کا فاتح تھا۔"
  tr: "El-Hakam bin Amr el-Ghifari iffetliydi ve arkadaşlığı vardı; Horasanlı Ziyad, el-Hakam bin Ebi el-As onu getirmek ve bereket istemek istediğinde onu atadı. Allah'ın Resulef'inden bir doğru adam şöyle dedi: '50 Hicri yılında orada öldü. Nehrin ötesinden ilk dua eden ve Saghaniyyin topraklarını fetheden oydu.'"
  id: "Al-Hakam ibn Amr al-Ghifari suci dan memiliki teman; Ziyad dari Khurasan menunjuknya ketika al-Hakam ibn Abi al-As berusaha membawanya dan memohon berkat. Seorang orang benar dari para sahabat Allah berkata, 'Dia wafat di sana pada tahun 50 H. Dia adalah yang pertama berdoa dari seberang sungai dan menaklukkan tanah Saghaniyyin.'"
