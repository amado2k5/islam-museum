summary:
  ar: "صاحب المكتب الإسلامي وناشر كتب الألباني، الذي يسميه «أستاذنا»؛ أشرف على طبع «صحيح الجامع الصغير وزيادته» وكتب مقدمة طبعته الجديدة في غرة رمضان 1405هـ، ورتب أحاديثه على الأبواب الفقهية وأضاف إليه معجماً للألفاظ وتعليقات مختومة باسمه {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 8-10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 17}."
  en: "Owner of al-Maktab al-Islami and publisher of al-Albani, whom he calls 'our teacher'; he supervised the printing of Sahih al-Jami' al-Saghir wa-Ziyadatuh, wrote the preface to its new edition on 1 Ramadan 1405 AH, arranged its hadiths by fiqh chapters and added a glossary and notes signed with his name {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 8-10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 17}."
  ur: "المکتب الاسلامی کے مالک اور البانی کی کتب کے ناشر، جنہیں وہ «ہمارے استاد» کہتے ہیں؛ انہوں نے «صحیح الجامع الصغیر وزیادتہ» کی طباعت کی نگرانی کی، یکم رمضان 1405ھ کو اس کے نئے ایڈیشن کا مقدمہ لکھا، اس کی احادیث کو فقہی ابواب پر مرتب کیا اور الفاظ کی فرہنگ اور اپنے نام سے مختوم تعلیقات کا اضافہ کیا {cite:sahih-jami-saghir-maktab-islami-1988 p. 5} {cite:sahih-jami-saghir-maktab-islami-1988 p. 8-10} {cite:sahih-jami-saghir-maktab-islami-1988 p. 17}۔"
