summary:
  ar: "مؤرخ أديب وفقيه محدّث، كان ظاهري المذهب، منقطعاً للعلم زاهداً، ولد سنة 420هـ ⁦(1029م)⁩ وتوفي سنة 488هـ ⁦(1095م)⁩."
  en: "Historian, man of letters, jurist and hadith scholar who followed the Zahiri school, devoted to learning and asceticism; born 420 AH (1029 CE), died 488 AH (1095 CE)."
  es: "Historiador, hombre de letras, jurista y erudito en hadices que siguió la escuela Zahiri, dedicado al aprendizaje y al ascetismo; nació en el año 420 de la Hégira (1029 d. C.) y murió en el año 488 de la Hégira (1095 d. C.)."
  fr: "Historien, homme de lettres, juriste et spécialiste du hadith qui a suivi l'école Zahiri, dévoué à l'étude et à l'ascétisme; né en 420 AH (1029 CE), mort en 488 AH (1095 CE)."
  ur: "مؤرخ، خطیب، فقیہ اور حدیث کے اسکالر جنہوں نے ظاہری مکتب کی پیروی کی، سیکھنے اور سنت پرستی کے لیے وقف۔ پیدائش 420ھ ⁦(1029ء)⁩، وفات 488ھ ⁦(1095ء)⁩۔"
  tr: "Tarihçi, edebi figür, hukukçu ve hadis âlimi olan Zahiri mezhebinden, bilgiye adanmış ve münzeviydi. 420 Hicri (1029 M.S.) yılında doğdu ve 488 Hicri (1095 M.S.) yılında öldü."
  id: "Sebagai seorang sejarawan, tokoh sastra, ahli hukum, dan ulama hadis, ia berasal dari aliran pemikiran Zahiri, berdedikasi pada pengetahuan dan pertapa yang berdedikasi. Ia lahir pada tahun 420 H (1029 M) dan meninggal pada 488 H (1095 M)."
