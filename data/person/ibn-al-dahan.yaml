summary:
  ar: "أبو محمد سعيد بن المبارك بن علي بن عبد الله المعروف بابن الدهان النحوي البغدادي؛ سمع الحديث من أبي القاسم هبة الله بن الحسين ومن أبي غالب أحمد بن الحسن بن المنهال؛ كان إمام عصره في النحو؛ من تصانيفه شرح كتاب «الإيضاح والتكميل» في ثلاث وأربعين مجلدة و«الفصول الكبرى» و«الفصول الصغرى» وشرح «اللمع» لابن جني الذي سماه «الغرة» و«العروض» و«الدروس في النحو» و«الرسالة السعيدية في المآخذ الكلامية» و«زاد المعسكر وزهر الرياض» في سبع مجلدات و«العشية في الضاد والظاء» و«المعقود في المقصور والممدود» و«الغنية في الأضداد»؛ ثم ترك بغداد وانتقل إلى الموصل؛ واستملى منه السمعاني حكاية رواها عن ابن عساكر {cite:wafayat-ayan}."
  en: "Ibn al-Dahan (494–569 AH / 1101–1174) — Baghdad's chief grammarian, later of Mosul, where he died; his 43-volume sharh of al-Idah wa-l-Takmil and seven-volume Zahr al-Riyad crown an enormous output {cite:wafayat-ayan}."
