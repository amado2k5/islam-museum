summary:
  ar: "الشيخ طاهر بن محمد صالح السمنوني الجزائري ⁦(١٨٥٢–١٩٢٠م)⁩؛ باحث من أكابر العلماء باللغة في دمشق. كان مولعاً باقتناء المخطوطات والبحث عنها، فساعد على إنشاء دار الكتب الظاهرية في دمشق وجمع فيها ما تفرق في الخزائن العامة، وساعد على إنشاء المكتبة الخالدية في القدس. انتقل إلى القاهرة سنة ١٣٢٥هـ ثم عاد إلى دمشق سنة ١٣٣٨هـ فنُصب عضواً عاملاً في المجمع العلمي العربي ومديراً لدار الكتب الظاهرية فتوفي بعد ثلاثة أشهر. كان يحسن أكثر اللغات الشرقية كالعبرية والسريانية والحبشية والزواوية والتركية والفارسية، وله نحو عشرين مصنفاً منها «الجواهر الكلامية في العقائد الإسلامية» و«بديع التلخيص» في البديع و«ميد الراحة» في المساحة و«الفوائد الجسام في معرفة خواص الأجسام» و«عقود اللآلي في الأسانيد العوالي» {cite:al-aalam tarjama}."
  en: "Tahir al-Jaza'iri (1852–1920 CE) — the Damascene manuscript-hunter who helped found the Zahiriyya library and Jerusalem's Khalidiyya library {cite:al-aalam tarjama}."
  es: "Tahir al-Jaza'iri (1852-1920 d.C.): el cazador de manuscritos damasquinos que ayudó a fundar la biblioteca Zahiriyya y la biblioteca Khalidiyya de Jerusalén {citar:al-aalam tarjama}."
  fr: "Tahir al-Jaza'iri (1852-1920 CE) — le chasseur de manuscrits damascènes qui a aidé à fonder la bibliothèque Zahiriyya et la bibliothèque Khalidiyya de Jérusalem {cite: al-aalam tarjama}."
  ur: "طاہر الجزائری ⁦(1852-1920 عیسوی)⁩ - دمشقی نسخہ کا شکاری جس نے ظاہریہ لائبریری اور یروشلم کی خالدیہ لائبریری کو تلاش کرنے میں مدد کی۔"
  tr: "Şeyh Tahir bin Muhammed Salih Al-Samnuni Al-Jazairi (1852–1920); Şam'da dil alanında önde gelen bir araştırmacıydı. El yazmaları edinmeye ve aramaya tutkuyla bağlıydı, Şam'da Zahiriye Ulusal Kütüphanesi'nin kurulmasına yardımcı oldu, halk kütüphanelerinde dağınık olanları topladı ve Kudüs'te Halidiyya Kütüphanesi'nin kurulmasına destek verdi. 1325 Hicri'de Kahire'ye taşındı, ardından 1338 Hicri'de Şam'a döndü ve burada Arap Bilim Akademisi'nin aktif üyesi ve Zahiriyye Kütüphanesi'nin müdürü olarak atandı; üç ay sonra burada vefat etti. İbranice, Süryanice, Habeşçe, Zawawi, Türkçe ve Farsça gibi çoğu Doğu dilinde yetkindi. \"Al-Jawahir al-Kalamiyya fi al-Aqa'id al-Islamiyya,\" \"Badi' al-Badi' üzerine \"Badi'al-Talkhis\", al-Masah üzerine \"Mid al-Rahah\", \"Al-Fawa'id al-Jasam fi Ma'rifat Khawas al-Jassaam\" ve \"Awali'nin Aktarım Zincirlerinde İnci Kolyeleri\" dahil olmak üzere yaklaşık yirmi eser yazdı."
  id: "Sheikh Tahir bin Muhammad Saleh Al-Samnouni Al-Jazairi (1852–1920 M); peneliti terkemuka bahasa di Damaskus. Ia sangat antusias dalam memperoleh dan mencari manuskrip, membantu mendirikan Perpustakaan Nasional Zahiriya di Damaskus, mengumpulkan barang-barang yang tersebar di perpustakaan umum, dan membantu mendirikan Perpustakaan Khalidiyya di Yerusalem. Ia pindah ke Kairo pada tahun 1325 H, lalu kembali ke Damaskus pada tahun 1338 H, di mana ia diangkat sebagai anggota aktif Akademi Ilmiah Arab dan direktur Perpustakaan Zahiriyya, di mana ia meninggal dunia tiga bulan kemudian. Ia mahir dalam sebagian besar bahasa Timur seperti Ibrani, Suryani, Abyssinia, Zawawi, Turki, dan Persia. Ia menulis sekitar dua puluh karya, termasuk \"Al-Jawahir al-Kalamiyya fi al-Aqa'id al-Islamiyya,\" \"Badi' al-Talkhis\" tentang al-Badi', \"Mid al-Rahah\" tentang al-Masah, \"Al-Fawa'id al-Jasam fi Ma'rifat Khawas al-Jassaam,\" dan \"Kalung Mutiara dalam Rantai Transmisi Awali.\""
