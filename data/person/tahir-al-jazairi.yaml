summary:
  ar: "الشيخ طاهر بن محمد صالح السمنوني الجزائري (١٨٥٢–١٩٢٠م)؛ باحث من أكابر العلماء باللغة في دمشق. كان مولعاً باقتناء المخطوطات والبحث عنها، فساعد على إنشاء دار الكتب الظاهرية في دمشق وجمع فيها ما تفرق في الخزائن العامة، وساعد على إنشاء المكتبة الخالدية في القدس. انتقل إلى القاهرة سنة ١٣٢٥هـ ثم عاد إلى دمشق سنة ١٣٣٨هـ فنُصب عضواً عاملاً في المجمع العلمي العربي ومديراً لدار الكتب الظاهرية فتوفي بعد ثلاثة أشهر. كان يحسن أكثر اللغات الشرقية كالعبرية والسريانية والحبشية والزواوية والتركية والفارسية، وله نحو عشرين مصنفاً منها «الجواهر الكلامية في العقائد الإسلامية» و«بديع التلخيص» في البديع و«ميد الراحة» في المساحة و«الفوائد الجسام في معرفة خواص الأجسام» و«عقود اللآلي في الأسانيد العوالي» {cite:al-aalam tarjama}."
  en: "Tahir al-Jaza'iri (1852–1920 CE) — the Damascene manuscript-hunter who helped found the Zahiriyya library and Jerusalem's Khalidiyya library {cite:al-aalam tarjama}."
