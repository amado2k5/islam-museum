id: person/louis-ii-of-hungary
class: person
label: { ar: "لويس الثاني ملك المجر", en: "Louis II of Hungary", ur: "لوئی دوم شاہِ ہنگری" }
aliases: [Lajos II, Louis II Jagiellon, Ludwig II of Hungary]
summary:
  ar: "لويس الثاني ملك المجر من الأسرة اليغيلونية، واجه سليمان القانوني في معركة موهاج الأولى يوم 21 ذي القعدة 932هـ/أغسطس 1526م. هُزم جيشه في ساعة ونصف، وغرق الملك في جدول تشيله، فانتهى بموته استقلال المملكة وانقسمت أراضيها زمنًا طويلًا بين العثمانيين والهابسبورغ وترانسلفانيا {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  en: "Louis II, king of Hungary, led his army against Süleyman I in the first battle of Mohács on 21 Dhu 'l-Qa'da 932/August 1526. His army was beaten in about an hour and a half and the king drowned in the Csele stream; his death opened a long period of anarchy, and the kingdom's land was split for over 150 years between Ottoman, Habsburg and Transylvanian zones {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  ur: "لوئی دوم ہنگری کا بادشاہ تھا جس نے 21 ذی القعدہ 932ھ/اگست 1526ء کو موہاچ کی پہلی جنگ میں سلیمان اول کے مقابل اپنی فوج کی قیادت کی۔ اس کی فوج تقریباً ڈیڑھ گھنٹے میں شکست کھا گئی اور بادشاہ چیلے ندی میں ڈوب گیا؛ اس کی موت کے بعد طویل انتشار کا دور آیا اور ملک کی زمین ڈیڑھ سو سال سے زیادہ عثمانی، ہیبسبرگ اور ٹرانسلوینیائی علاقوں میں بٹی رہی {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
