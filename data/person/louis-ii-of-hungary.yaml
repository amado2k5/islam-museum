summary:
  ar: "لويس الثاني ملك المجر من الأسرة اليغيلونية، واجه سليمان القانوني في معركة موهاج الأولى يوم 21 ذي القعدة 932هـ/أغسطس 1526م. هُزم جيشه في ساعة ونصف، وغرق الملك في جدول تشيله، فانتهى بموته استقلال المملكة وانقسمت أراضيها زمنًا طويلًا بين العثمانيين والهابسبورغ وترانسلفانيا {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  en: "Louis II, king of Hungary, led his army against Süleyman I in the first battle of Mohács on 21 Dhu 'l-Qa'da 932/August 1526. His army was beaten in about an hour and a half and the king drowned in the Csele stream; his death opened a long period of anarchy, and the kingdom's land was split for over 150 years between Ottoman, Habsburg and Transylvanian zones {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  ur: "لوئی دوم ہنگری کا بادشاہ تھا جس نے 21 ذی القعدہ 932ھ/اگست 1526ء کو موہاچ کی پہلی جنگ میں سلیمان اول کے مقابل اپنی فوج کی قیادت کی۔ اس کی فوج تقریباً ڈیڑھ گھنٹے میں شکست کھا گئی اور بادشاہ چیلے ندی میں ڈوب گیا؛ اس کی موت کے بعد طویل انتشار کا دور آیا اور ملک کی زمین ڈیڑھ سو سال سے زیادہ عثمانی، ہیبسبرگ اور ٹرانسلوینیائی علاقوں میں بٹی رہی {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  es: "Luis II, rey de Hungría, dirigió a su ejército contra Solimán I en la primera batalla de Mohács el 21 de Dhu 'l-Qa'da de 932/agosto de 1526. Su ejército fue derrotado en aproximadamente una hora y media y el rey se ahogó en el arroyo Csele; su muerte dio inicio a un largo período de anarquía, y el territorio del reino quedó dividido durante más de 150 años entre las zonas otomana, Habsburgo y Transilvania {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  fr: "Louis II, roi de Hongrie, mena son armée contre Soliman le Magnifique lors de la première bataille de Mohács le 21 Dhu 'l-Qa'da 932/août 1526. Son armée fut vaincue en une heure et demie environ et le roi se noya dans le torrent de Csele; sa mort ouvrit une longue période d'anarchie, et le territoire du royaume fut divisé pendant plus de 150 ans entre les zones ottomane, habsbourgeoise et transylvanienne {cite:encyclopaedia-of-islam-2 vol. 7 p. 247}."
  tr: "Jaguellonian hanedanından Macaristan Kralı II. Louis, 21 Dhu al-Qi'dah 932 Hic'ah / Ağustos 1526'da Mohács'ın Birinci Muharebesi'nde Süleyman Muhteşem ile karşı karşıya geldi. Ordusu bir buçuk saat içinde yenildi ve kral Chel deresinde boğularak krallığın bağımsızlığını ve topraklarının uzun süre Osmanlılar, Habsburglar ve Transilvanya arasında bölünmesini sona erdirdi {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 247}."
  id: "Louis II, Raja Hungaria dari dinasti Jaguellonian, menghadapi Suleiman yang Agung dalam Pertempuran Mohács Pertama pada 21 Dhu al-Qi'dah 932 AH / Agustus 1526 M. Pasukannya dikalahkan dalam satu setengah jam, dan sang raja tenggelam di sungai Chel, mengakhiri kemerdekaan kerajaan dan pembagian wilayahnya dalam waktu lama antara Ottoman, Habsburg, dan Transylvania {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 247}."
