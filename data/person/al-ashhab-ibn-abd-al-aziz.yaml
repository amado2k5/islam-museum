label:
  ar: "الأشهب بن عبد العزيز"
  en: "al-Ashhab ibn Abd al-Aziz"
  ur: "اشہب بن عبدالعزیز"
roles: [jurist, muhaddith]
gender: male
summary:
  ar: "أبو عمر الأشهب بن عبد العزيز المالكي، تفقه بمالك وبالمدنيين وبالمصريين؛ ولد سنة خمسين ومائة وتوفي بمصر سنة أربع ومائتين بعد الشافعي، وقيل فيه «ما رأيت أفقه من أشهب لولا طيش فيه»، وكانت المنافسة بينه وبين ابن القاسم وانتهت إليه الرياسة بمصر بعده {cite:tabaqat-fuqaha-abbas-1981 p.128}."
  en: "Abu Umar al-Ashhab ibn Abd al-Aziz, the Maliki who studied under Malik and the Medinese and Egyptians; born 150, died in Egypt 204 after al-Shafi'i — 'I never saw anyone more learned than Ashhab were it not for a recklessness in him', and the leadership in Egypt passed to him after Ibn al-Qasim {cite:tabaqat-fuqaha-abbas-1981 p.128}."
  ur: "ابو عمر اشہب بن عبدالعزیز مالکی عالم، مالک اور مدینہ و مصر کے علماء سے علم حاصل کیا؛ 150 میں پیدا ہوا اور 204 میں مصر میں وفات پائی۔ کہا گیا «میں نے اشہب سے زیادہ فقیہ نہیں دیکھا سوائے اس کی ایک عادت کے» اور ابن القاسم کے بعد مصر میں مذہب کی قیادت اسی کو ملی {cite:tabaqat-fuqaha-abbas-1981 p.128}."
