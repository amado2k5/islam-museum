summary:
  ar: "محامية بيئية بنغلاديشية، وُلدت في هبيغانج في 15 يناير 1968. بصفتها الرئيسة التنفيذية لرابطة المحامين البيئيين في بنغلاديش (بيلا) قادت حملات قضائية حول تفكيك السفن والأراضي الرطبة والبولي إيثيلين وإزالة الغابات، ونالت جائزة غولدمان البيئية سنة 2009 وجائزة رامون ماغسيساي سنة 2012 وجائزة نساء الشجاعة الدولية سنة 2022. عملت مستشارة في الحكومة المؤقتة المشكّلة سنة 2024 وتولت حقائب البيئة والموارد المائية والإعلام حتى فبراير 2026."
  en: "Bangladeshi environmental lawyer, born in Habiganj on 15 January 1968. As chief executive of the Bangladesh Environmental Lawyers Association (BELA) she has led court campaigns on shipbreaking, wetlands, polythene and deforestation, winning the Goldman Environmental Prize in 2009, the Ramon Magsaysay Award in 2012 and the International Women of Courage Award in 2022. She served as an adviser in the 2024 interim government, holding the environment, water resources and information portfolios until February 2026."
  ur: "بنگلہ دیشی ماحولیاتی وکیل، جو 15 جنوری 1968ء کو ہبی گنج میں پیدا ہوئیں۔ بنگلہ دیش ماحولیاتی وکلا ایسوسی ایشن (بیلا) کی سربراہ کے طور پر انھوں نے جہاز شکنی، آبی زمینوں، پولیتھین اور جنگلات کی کٹائی پر عدالتی مہمات چلائیں اور 2009ء میں گولڈمین ماحولیاتی انعام، 2012ء میں ریمن میگسیس ایوارڈ اور 2022ء میں بین الاقوامی خواتینِ شجاعت ایوارڈ حاصل کیا۔ وہ 2024ء کی عبوری حکومت میں مشیر رہیں اور فروری 2026ء تک ماحولیات، آبی وسائل اور اطلاعات کے قلمدان سنبھالے۔"
