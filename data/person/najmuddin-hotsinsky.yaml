summary:
  ar: "نجم الدين غوتسينسكي (1859–1925)، عالم أفاري من قرية غوتسوب في داغستان، صار مفتي جمهورية شمال القوقاز الجبلية سنة 1917 واعتُرف به إمامًا لداغستان والشيشان سنة 1919؛ قاد انتفاضات متكررة على البلاشفة حتى أُسر وأُعدم رميًا بالرصاص في روستوف على الدون سنة 1925."
  en: "Najmuddin Hotsinsky (1859–1925), an Avar scholar from the village of Gotsob in Dagestan, became Mufti of the Mountainous Republic of the Northern Caucasus in 1917 and was recognised as Imam of Dagestan and Chechnya in 1919. He led repeated uprisings against the Bolsheviks until his capture and execution by shooting at Rostov-on-Don in 1925."
  ur: "نجم الدین غوتسنسکی (1859–1925)، داغستان کے گاؤں گوتسوب سے تعلق رکھنے والے آوار عالم تھے؛ 1917 میں شمالی قفقاز کی پہاڑی جمہوریہ کے مفتی بنے اور 1919 میں داغستان و چیچنیا کے امام تسلیم کیے گئے۔ وہ بالشویکوں کے خلاف بار بار بغاوتوں کی قیادت کرتے رہے یہاں تک کہ 1925 میں گرفتار ہو کر روستوف-نا-دونو میں گولی مار کر ہلاک کیے گئے۔"
