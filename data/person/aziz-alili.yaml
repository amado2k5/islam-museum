summary:
  ar: "حافظ وقارئ بوسني من أصل مقدوني ⁦(وُلد 1968)⁩، أتمّ الحفظ قبل العاشرة، ودرس في مدرسة الغازي خسرو بك بسراييفو، وكان مؤذن جامع القيصر (1984–1986) ثم إمام جامع الغازي خسرو بك (1989–1993)، ومثّل البوسنة والهرسك أول مرة في المسابقات الدولية، ويرأس الجماعة الإسلامية في زغرب."
  en: "Bosnian hafiz and reciter born in North Macedonia (1968), who completed the Qur'an before ten, studied at the Gazi Husrev-beg Madrasa in Sarajevo, was muezzin of the Emperor's Mosque (1984–1986) and then imam of the Gazi Husrev-beg Mosque (1989–1993), was the first reciter to represent Bosnia and Herzegovina at international competitions, and heads the Islamic Community in Zagreb."
  ur: "شمالی مقدونیہ میں پیدا ہونے والے بوسنیائی حافظ اور قاری ⁦(1968ء)⁩، جنھوں نے دس برس سے پہلے حفظ مکمل کیا، سراییوو کے مدرسہ غازی خسرو بیگ میں پڑھا، شاہی مسجد ⁦(1984ء–1986ء)⁩ کے مؤذن اور پھر غازی خسرو بیگ مسجد ⁦(1989ء–1993ء)⁩ کے امام رہے، بین الاقوامی مقابلوں میں بوسنیا و ہرزیگووینا کی نمائندگی کرنے والے پہلے قاری تھے، اور زغرب میں اسلامی برادری کے سربراہ ہیں۔"
  es: "Hafiz y recitador bosnio nacido en Macedonia del Norte (1968), que completó la memorización del Corán antes de los diez años, estudió en la madrasa Gazi Husrev-beg en Sarajevo, fue muecín de la Mezquita del Emperador (1984-1986) y luego imán de la Mezquita Gazi Husrev-beg (1989-1993), fue el primer recitador en representar a Bosnia y Herzegovina en competiciones internacionales y dirige la Comunidad Islámica en Zagreb."
  fr: "Hafiz et récitant bosnien né en Macédoine du Nord (1968), qui a terminé le Coran avant l'âge de dix ans, a étudié à la madrasa Gazi Husrev-beg à Sarajevo, a été muezzin de la mosquée de l'Empereur (1984-1986) puis imam de la mosquée Gazi Husrev-beg (1989-1993), a été le premier récitant à représenter la Bosnie-Herzégovine lors de compétitions internationales et dirige la communauté islamique de Zagreb."
  tr: "Makedon kökenli Bosnalı ezberci ve şiitçi olan Shers, on yaşından önce ezberlemeyi tamamlamış, Saraybosna'daki El-Gazi Hoşrov Bey Okulu'nda eğitim görmüş, Sezar Camii'nin müezzini (1984–1986), ardından El-Gazi Hosrov Bey Camii imamı (1989–1993), Bosna-Hersek'i ilk kez uluslararası yarışmalarda temsil etmiş ve Zagreb'deki İslami Grup'un başkanlığını yürütmüştür."
  id: "Sebagai pengapal dan pembaca asal Makedonia asal Bosnia (lahir 1968), ia menyelesaikan hafalan sebelum usia sepuluh tahun, belajar di Sekolah Bey Al-Ghazi Khosrow di Sarajevo, menjadi muezzin Masjid Caesar (1984–1986), kemudian imam Masjid Al-Ghazi Khosrow Bey (1989–1993), mewakili Bosnia dan Herzegovina untuk pertama kalinya dalam kompetisi internasional, dan memimpin Kelompok Islam di Zagreb."
