summary:
  ar: "حافظ وقارئ بوسني من أصل مقدوني ⁦(وُلد 1968)⁩، أتمّ الحفظ قبل العاشرة، ودرس في مدرسة الغازي خسرو بك بسراييفو، وكان مؤذن جامع القيصر (1984–1986) ثم إمام جامع الغازي خسرو بك (1989–1993)، ومثّل البوسنة والهرسك أول مرة في المسابقات الدولية، ويرأس الجماعة الإسلامية في زغرب."
  en: "Bosnian hafiz and reciter born in North Macedonia (1968), who completed the Qur'an before ten, studied at the Gazi Husrev-beg Madrasa in Sarajevo, was muezzin of the Emperor's Mosque (1984–1986) and then imam of the Gazi Husrev-beg Mosque (1989–1993), was the first reciter to represent Bosnia and Herzegovina at international competitions, and heads the Islamic Community in Zagreb."
  ur: "شمالی مقدونیہ میں پیدا ہونے والے بوسنیائی حافظ اور قاری ⁦(1968ء)⁩، جنھوں نے دس برس سے پہلے حفظ مکمل کیا، سراییوو کے مدرسہ غازی خسرو بیگ میں پڑھا، شاہی مسجد ⁦(1984ء–1986ء)⁩ کے مؤذن اور پھر غازی خسرو بیگ مسجد ⁦(1989ء–1993ء)⁩ کے امام رہے، بین الاقوامی مقابلوں میں بوسنیا و ہرزیگووینا کی نمائندگی کرنے والے پہلے قاری تھے، اور زغرب میں اسلامی برادری کے سربراہ ہیں۔"
