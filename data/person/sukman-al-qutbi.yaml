summary:
  ar: "سكمان القطبي؛ مؤسس دولة أخلاط من شاهات أرمينية سنة 493هـ، وكانت إمارته أقوى الدويلات السلجوقية التي قامت في أرمينية على أن أغلب سكانها كانوا من الأرمن، ودامت أسرته إلى سنة 581هـ فانتقل الحكم إلى مملوكه بك تيمور ثم إلى الأيوبيين."
  en: "Sukman al-Qutbi; founder of the Akhlat state of the Shahs of Armenia in 493 — the strongest of Seljuk Armenia's lesser states though its folk were mostly Armenian — his house lasting to 581 when rule passed to his mamluk Bak Timur then the Ayyubids."
