  ar: شاعر وأمين مكتبة فلسطيني وُلد سنة 1998 في مخيم جباليا بغزة؛ أسس مكتبة إدوارد سعيد العامة، وحازت مجموعته الشعرية الأولى جوائز، ونالت مقالاته عن الحرب في النيويوركر جائزة بوليتزر سنة 2025.
  en: Palestinian poet and librarian born in Jabalia camp, Gaza, in 1998; founder of the Edward Said Public Library, his first poetry collection won multiple awards and his New Yorker columns on the Gaza
    war won a 2025 Pulitzer Prize.
