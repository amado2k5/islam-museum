summary:
  ar: شاعر وأمين مكتبة فلسطيني وُلد سنة 1998 في مخيم جباليا بغزة؛ أسس مكتبة إدوارد سعيد العامة، وحازت مجموعته الشعرية الأولى جوائز، ونالت مقالاته عن الحرب في النيويوركر جائزة بوليتزر سنة 2025.
  en: Palestinian poet and librarian born in Jabalia camp, Gaza, in 1998; founder of the Edward Said Public Library, his first poetry collection won multiple awards and his New Yorker columns on the Gaza
    war won a 2025 Pulitzer Prize.
  ur: فلسطینی شاعر اور لائبریرین جو 1998 میں غزہ کے جبالیا کیمپ میں پیدا ہوا؛ ایڈورڈ سعید پبلک لائبریری کا بانی، اس کی پہلی شاعری کتاب نے متعدد انعامات جیتے اور غزہ جنگ پر اس کے نیویارکر مضامین کو 2025
    کا پلٹزر ملا۔
  es: "Poeta y bibliotecario palestino nacido en el campo de Jabalia, Gaza, en 1998; fundador de la Biblioteca Pública Edward Said, su primera colección de poesía ganó múltiples premios y sus columnas en The New Yorker sobre la guerra de Gaza ganaron un Premio Pulitzer en 2025."
  fr: "Poète et bibliothécaire palestinien né dans le camp de Jabalia, à Gaza, en 1998; fondateur de la bibliothèque publique Edward Said, son premier recueil de poésie a remporté de nombreux prix et ses chroniques dans le New Yorker sur la guerre de Gaza ont remporté le prix Pulitzer en 2025."
  tr: "1998'de Gazze'deki Jabalia Kampı'nda doğan Filistinli şair ve kütüphaneci olan Edward Said Halk Kütüphanesi'ni kurdu, ilk şiir koleksiyonu ödüller kazandı ve The New Yorker'daki savaşla ilgili makaleleri 2025'te Pulitzer Ödülü kazandı."
  id: "Seorang penyair dan pustakawan Palestina yang lahir pada tahun 1998 di Jabalia Camp di Gaza; ia mendirikan Perpustakaan Umum Edward Said, kumpulan puisi pertamanya memenangkan penghargaan, dan artikel-artikelnya tentang perang di The New Yorker memenangkan Pulitzer Prize pada tahun 2025."
