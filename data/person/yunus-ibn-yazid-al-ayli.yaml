summary:
  ar: "يونس بن يزيد بن أبي النجاد الأيلي القرشي، أبو يزيد، مولى معاوية بن أبي سفيان، وصفه النص بالثقة المحدث، وروى له الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} حدث عن ابن شهاب الزهري، ونافع مولى ابن عمر، والقاسم، وعكرمة وغيرهم، وعنه الليث بن سعد، ويحيى بن أيوب، والأوزاعي، وابن المبارك، وابن وهب وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} أوردته الموسوعة بوفاة سنة 159هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254}"
  en: "Yunus ibn Yazid ibn Abi al-Nijad al-Ayli al-Qurashi, Abu Yazid, a client of Mu'awiya ibn Abi Sufyan; the text calls him the trustworthy traditionist, and the collective of hadith compilers recorded for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} He transmitted from Ibn Shihab al-Zuhri, Nafi' the client of Ibn Umar, al-Qasim, Ikrima and others; al-Layth ibn Sa'd, Yahya ibn Ayyub, al-Awza'i, Ibn al-Mubarak, Ibn Wahb and others transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} The encyclopedia dates his death to 159 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254}"
  ur: "یونس بن یزید بن ابی النجاد الایلی القرشی، ابو یزید، معاویہ بن ابی سفیان کے مولیٰ؛ متن نے انہیں ثقہ محدث قرار دیا اور جمیع محدثین نے ان سے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} انھوں نے ابن شہاب زہری، نافع مولیٰ ابن عمر، قاسم، عکرمہ وغیرہ سے روایت کی، اور ان سے لیث بن سعد، یحییٰ بن ایوب، اوزاعی، ابن مبارک، ابن وہب وغیرہ نے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254} موسوعہ نے ان کی وفات 159ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16254}"
