summary:
  ar: "عبد الملك بن يعلى الليثي البصري، قاضي البصرة. قال ابن حجر في التقريب: ثقة من الطبقة الرابعة. ونقلت الموسوعة عن إياس بن معاوية أنه قال لحبيب بن الشهيد: إن أردت الفتيا فعليك بعبد الملك بن يعلى. وروى يزيد بن هارون عنه أن من ترك ثلاث جمع من غير عذر لم تجز شهادته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3135}"
  en: "Abd al-Malik ibn Yala al-Laythi al-Basri, qadi of Basra. Ibn Hajar in al-Taqrib calls him trustworthy (thiqa) of the fourth tier. Iyas ibn Muawiya told Habib ibn al-Shahid that for fatwas he should go to Abd al-Malik ibn Yala. Yazid ibn Harun reports his view that whoever leaves three Friday prayers without excuse has his testimony rejected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3135}"
