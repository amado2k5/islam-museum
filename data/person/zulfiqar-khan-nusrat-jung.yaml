summary:
  ar: "بطاقة أولية لذو الفقار خان نصرت جونغ، أمير أورنكزب ونواب الكرناتك الذي قاد فتح بنجي، توفي سنة ١٧١٣م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Zulfiqar Khan Nusrat Jung, Aurangzeb's amir and nawab of the Carnatic who led the taking of Jinji, d. 1713; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Zulfiqar Khan Nusrat Jung, emir y nawab de Aurangzeb del Carnático que dirigió la toma de Jinji, fallecido en 1713; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Fiche de convocation de Zulfiqar Khan Nusrat Jung, émir et nawab du Carnatic d'Aurangzeb, qui mena la prise de Jinji, mort en 1713; la source n'est pas encore vérifiée sur la page."
  ur: "اورنگ زیب کے امیر اور کرناٹک کے نواب ذوالفقار خان نصرت جنگ کے لیے ڈرافٹ کارڈ جس نے جنجی کو لینے کی قیادت کی، ڈی۔ 1713; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Banji'nin fethine öncülük eden, Aurnakzeb Prensi ve Karnaktak Nawabı Zülfikar Han Nusrat Jung'un ön kartı 1713 yılında öldü; tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Zulfiqar Khan Nusrat Jung, Pangeran Aurnakzeb dan Nawab Karnaktak yang memimpin penaklukan Banji, meninggal pada tahun 1713 M; ia dikenang dalam buku sejarah, dan biografinya belum pernah diulas di halaman tersebut."
