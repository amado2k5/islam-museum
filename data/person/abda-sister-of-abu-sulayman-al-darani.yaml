label: { ar: "عبدة أخت أبي سليمان الداراني", en: "Abda, sister of Abu Sulayman al-Darani", ur: "عبدہ، ابو سلیمان دارانی کی بہن" }
gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل الشام، أخت الزاهد أبي سليمان الداراني؛ يروي ابن الجوزي في «صفة الصفوة» عن أخيها قولها: الفقراء كلهم أموات إلا من أحياه الله بعز القناعة والرضا بفقره، ويذكر عن السلمي أنها وأختها آمنة كانتا من العقل والدين بمحل عظيم."
  en: "A devout woman of Syria, sister of the ascetic Abu Sulayman al-Darani; Ibn al-Jawzi's Sifat al-Safwa quotes her through her brother — 'The poor are all dead, except those God brings to life with the dignity of contentment' — and cites al-Sulami that she and her sister Amina stood high in intelligence and religion."
  ur: "شام کی ایک عابدہ، زاہد ابو سلیمان دارانی کی بہن؛ ابن الجوزی کی «صفۃ الصفوہ» ان کے بھائی کے واسطے سے ان کا قول نقل کرتی ہے — «فقیر سب مردہ ہیں سوائے اس کے جسے اللہ قناعت کی عزت اور فقر پر رضا سے زندہ کرے» — اور سلمی سے کہ وہ اور ان کی بہن آمنہ عقل و دین میں بلند مرتبہ تھیں۔"
