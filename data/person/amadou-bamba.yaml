    note: "His founding and headship of the Muridiyya is attested as his own affiliation by three independent articles: the English article's lead names him 'a Sufi saint and founder of the Mouride Brotherhood (the Muridiyya)'; the French article's lead names him 'fondateur de sa propre voie soufie' (founder of his own Sufi path) and 'fondateur de la confrérie des Mourides'; the Arabic article makes him 'one of the prominent figures of Sufi Islam in West Africa through his founding of the Muridiyya tariqa'. The Urdu article runs parallel to the Arabic and is counted as the same family, not a fourth attestation. The segment is recorded as sufi on this founding and headship of the order itself, following the precedents of person/ma-al-aynayn and person/ali-al-mirghani. The French article's lead ALSO describes him as 'musulman sunnite, théologien acharite, juriste malékite' (a Sunni Muslim, an Ash'ari theologian, a Maliki jurist), and its doctrine section repeats that he was 'de croyance traditionnelle sunnite' — but no second independent source fetched names a school of law or theology for him (the English, Arabic and Urdu articles name none, and Wikidata's religion statement is Islam generically), so under the lane's two-source rule no sunni segment is recorded; the French attestation is stated here so the reader can judge it. His father was a Qadiri marabout — the father's affiliation, recorded as background in the prose, not as the son's attestation."

