summary:
  ar: "شيخ صوفي سنغالي (1853-1927) أسس الطريقة المريدية ومدينة طوبى، وعلّم أن الخلاص بالخضوع لله والعمل الدؤوب، وقاد ضد الاستعمار الفرنسي كفاحا روحيا سلميا سمّاه الجهاد الأكبر. نفاه الفرنسيون إلى الغابون (1895-1902) ثم إلى موريتانيا (1903-1907) وأبقوه قيد الإقامة الجبرية بديوربل خمس عشرة سنة، فازداد أتباعه حتى صارت طوبى قبلة ملايين الزوار في المگل السنوي."
  en: "Senegalese Sufi sheikh (1853–1927) who founded the Mouride Brotherhood (Muridiyya) and the city of Touba, taught that salvation comes through submission to God and hard work, and led a pacifist spiritual struggle against French colonialism that he called the greater jihad. The French exiled him to Gabon (1895–1902) and Mauritania (1903–1907) and held him under house arrest at Diourbel for fifteen years, yet his following grew until Touba became the destination of millions at the annual Magal."
  ur: "سینگالی صوفی شیخ (1853ء–1927ء) جنھوں نے مریدی سلسلے اور شہر طوبیٰ کی بنیاد رکھی، تعلیم دی کہ نجات اللہ کے حضور سرِ تسلیم خم کرنے اور محنت میں ہے، اور فرانسیسی استعمار کے خلاف پُرامن روحانی جدوجہد کی قیادت کی جسے وہ جہادِ اکبر کہتے تھے۔ فرانسیسیوں نے انھیں گیبون (1895ء–1902ء) اور پھر موریطانیہ (1903ء–1907ء) جلاوطن کیا اور پندرہ سال دیوربیل میں نظر بند رکھا، پھر بھی ان کے مرید بڑھتے گئے یہاں تک کہ طوبیٰ سالانہ مگل پر لاکھوں زائرین کی منزل بن گیا۔"

