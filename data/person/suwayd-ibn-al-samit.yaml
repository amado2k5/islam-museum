label: { ar: "سويد بن الصامت", en: "Suwayd ibn al-Samit", es: "Suwayd ibn al-Samit", fr: "Suwayd ibn al-Samit", ur: "سوید بن الصامت" }
summary:
  ar: "من أهل يثرب الجامعين في الجاهلية للكتاب والرمي والعوم. وعند ابن إسحاق في وفاء الوفا: كان من بني عمرو بن عوف من الأوس وسُمي «الكامل» لجلده وشعره، وقدم مكة فدعاه النبي إلى الإسلام فلم يباعد ولم يجب، ثم انصرف إلى يثرب فلم يلبث أن قُتل يوم بعاث، وكان رجال من قومه يقولون: إنا لنراه قُتل وهو مسلم {cite:samhudi-wafa-al-wafa p. 233}."
  en: "of Jahiliya Yathrib, one who joined writing, archery and swimming. In Ibn Ishaq's account preserved by al-Samhudi he was of Banu 'Amr ibn 'Awf of the Aws, called 'al-Kamil' for his hardiness and verse; he came to Mecca, where the Prophet invited him to Islam — he neither refused nor accepted — then returned to Yathrib and was soon killed on the day of Bu'ath, and men of his people held that he died a Muslim {cite:samhudi-wafa-al-wafa p. 233}."
  es: "de Jahiliya Yathrib, uno que combinaba la escritura, el tiro con arco y la natación. En el relato de Ibn Ishaq conservado por al-Samhudi, era de Banu 'Amr ibn 'Awf de los Aws, llamado 'al-Kamil' por su resistencia y poesía; llegó a La Meca, donde el Profeta lo invitó al Islam —no se negó ni aceptó— luego regresó a Yathrib y pronto fue asesinado el día de Bu'ath, y los hombres de su pueblo sostenían que murió siendo musulmán {cite:samhudi-wafa-al-wafa p. 233}."
  fr: "De Yathrib, à l'époque préislamique (Jahiliya), il s'adonnait à l'écriture, au tir à l'arc et à la natation. Selon le récit d'Ibn Ishaq, conservé par al-Samhudi, il appartenait à la tribu des Banu 'Amr ibn 'Awf, surnommé « al-Kamil » pour sa force de caractère et son talent de poète. Il se rendit à La Mecque, où le Prophète l'invita à se convertir à l'islam – invitation qu'il n'accepta ni ne refusa – puis retourna à Yathrib et fut tué peu après, le jour de Bu'ath. Ses proches affirmèrent qu'il mourut musulman (voir Samhudi-wafa-al-wafa, p. 233)."
  ur: "جاہلیہ یثرب کے، جو لکھنے، تیر اندازی اور تیراکی میں شامل ہوئے۔ ابن اسحاق کی کتاب جو کہ السمھودی نے محفوظ کی ہے اس میں وہ بنو عمرو بن عوف اوس کے تھے، جنہیں اس کی سختی اور آیت کی وجہ سے 'الکامل' کہا جاتا تھا۔ وہ مکہ آیا، جہاں نبی نے انہیں اسلام کی دعوت دی - اس نے نہ تو انکار کیا اور نہ ہی قبول کیا - پھر یثرب واپس آئے اور جلد ہی بعثت کے دن قتل کر دیا گیا، اور اس کی قوم کے لوگوں کا خیال ہے کہ اس کی موت مسلمان ہو کر ہوئی ہے۔ 233}۔"
  tr: "İslam öncesi dönemde kitap, okçuluk ve yüzme eğitimi alan Yatrib halkından geliyordu. İbn İshaq'ın Wafa al-Wafa'ya göre: Banu Amr bin Awf'tan geliyordu ve ten ve saçları nedeniyle 'Al-Kamil' olarak anılıyordu. Mekke'ye geldi ve Peygamber onu İslam'a davet etti, ancak o uzaklaşmadı ve cevap vermedi. Sonra Yatrib'e döndü ve kısa süre sonra Baas gününde öldürüldü. Bazı halkı şöyle derdi: Müslüman iken öldürüldüğünü görüyoruz. {cite:samhudi-wafa-al-wafa, s. 233}."
  id: "Dia berasal dari masyarakat Yathrib yang mempelajari buku, memanah, dan berenang pada era pra-Islam. Menurut Ibn Ishaq dalam Wafa al-Wafa: Dia berasal dari Banu Amr ibn Awf dari Aws dan disebut 'Al-Kamil' karena kulit dan rambutnya. Dia tiba di Mekah, dan Nabi mengundangnya ke Islam, tetapi dia tidak menjauh atau menjawab. Kemudian dia kembali ke Yathrib, dan tak lama kemudian dia dibunuh pada hari Ba'ath. Beberapa kaumnya biasa berkata: Kami melihat dia dibunuh saat dia seorang Muslim. {cite:samhudi-wafa-al-wafa, hlm. 233}."
