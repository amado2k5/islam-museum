label: { ar: "سويد بن الصامت", en: "Suwayd ibn al-Samit" }
summary:
  ar: "من أهل يثرب الجامعين في الجاهلية للكتاب والرمي والعوم. وعند ابن إسحاق في وفاء الوفا: كان من بني عمرو بن عوف من الأوس وسُمي «الكامل» لجلده وشعره، وقدم مكة فدعاه النبي إلى الإسلام فلم يباعد ولم يجب، ثم انصرف إلى يثرب فلم يلبث أن قُتل يوم بعاث، وكان رجال من قومه يقولون: إنا لنراه قُتل وهو مسلم {cite:samhudi-wafa-al-wafa p. 233}."
  en: "of Jahiliya Yathrib, one who joined writing, archery and swimming. In Ibn Ishaq's account preserved by al-Samhudi he was of Banu 'Amr ibn 'Awf of the Aws, called 'al-Kamil' for his hardiness and verse; he came to Mecca, where the Prophet invited him to Islam — he neither refused nor accepted — then returned to Yathrib and was soon killed on the day of Bu'ath, and men of his people held that he died a Muslim {cite:samhudi-wafa-al-wafa p. 233}."
