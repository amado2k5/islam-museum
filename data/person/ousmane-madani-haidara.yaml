    note: "Three independent texts describe the man himself in prose as a Sufi: the French article's lead calls him 'un prédicateur Soufi malien' (a Malian Sufi preacher); the English article's lead states that he 'is a follower of the Maliki school of Islam and a Sufi' (citing Holder 2012 for the school and Voice of America, 2016, for the Sufi description); and Luca Raineri's 2024 Sant'Anna policy brief names him 'the Sufi Chérif Ousmane Madani Haïdara'. His founding and leading of the Sufi-based Ançar Dine movement is the setting of these descriptions, not their basis. Preserved but NOT settled: the Maliki school — Holder calls him in prose 'the Maliki spiritual guide of Ansar Dine' and the English article repeats the school on Holder's authority, but the attestations trace to that single scholarly origin, so under the two-independent-texts rule no Maliki value is recorded; the Groupement des leaders spirituels musulmans, which he has headed since 2011, claims to represent Mali's majority Malikite Islam — a collective claim, not a personal attestation."
