summary:
  ar: "داعية صوفي مالي، مؤسس حركة أنصار الدين (1991) — وهي حركة مالية ذات توجّه صوفي لا علاقة لها بالجماعة المسلحة ذات الاسم المشابه في الشمال — ورئيس المجلس الإسلامي الأعلى في مالي منذ أبريل 2019. وصوله مؤسسي لا منصّاتي: لا يوجد له عدد متابعين على أي منصة، بينما نقل الباحث جايلز هولدر عن موقع حركته نفسه أن أعضاءها تجاوزوا مئة ألف في أربعة وعشرين بلدًا."
  en: "Malian Sufi preacher, founder of the Ançar Dine movement (1991) — a Sufi-oriented Malian movement unrelated to the armed group of a similar name in the north — and president of the High Islamic Council of Mali since April 2019. His reach is institutional rather than platform-based: no follower count exists for him on any platform, while the movement's own site, as quoted by the scholar Gilles Holder, claimed more than one hundred thousand members in twenty-four countries."
  ur: "مالی کے صوفی واعظ، حرکت انصار الدین (1991) کے بانی — یہ مالی کی صوفی رجحان کی حامل حرکت ہے اور شمال کی اسی نام کی مسلح جماعت سے اس کا کوئی تعلق نہیں — اور اپریل 2019 سے مالی کی سپریم اسلامک کونسل کے صدر۔ ان کی رسائی ادارہ جاتی ہے، پلیٹ فارم پر مبنی نہیں: کسی پلیٹ فارم پر ان کے فالوورز کی کوئی تعداد موجود نہیں، جبکہ محقق جائلز ہولڈر نے حرکت کی اپنی ویب سائٹ کے حوالے سے لکھا کہ اس کے ارکان چوبیس ممالک میں ایک لاکھ سے زیادہ تھے۔"
