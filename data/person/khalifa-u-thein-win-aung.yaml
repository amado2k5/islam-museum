summary:
  ar: "مرشد صوفي من ميانمار؛ خليفة وقائد روحي في رابطة الطريقة الصوفية الإسلامية في ميانمار ومنظمة كافتغ غارانا، يخدم أكثر من مئتي ألف مسلم ميانماري ويعين المجتمعات المتضررة من أعمال الشغب، وفق ملفه في كتاب المسلمون الخمسمئة."
  en: "A Sufi spiritual leader of Myanmar: khalifa of the Islamic Sufi Tariqah League Myanmar and of the KAFTG Garana Organization, serving more than two hundred thousand Myanmar Muslims and aiding communities affected by communal violence, according to his Muslim 500 profile."
  ur: "میانمار کے صوفی روحانی پیشوا: اسلامک صوفی طریقہ لیگ میانمار اور تنظیم KAFTG Garana کے خلیفہ، دو لاکھ سے زائد میانماری مسلمانوں کی خدمت کرتے ہیں اور فسادات سے متاثرہ برادریوں کی امداد کرتے ہیں، ذرائع: مسلم 500 کا تعارف۔"
  es: "Un líder espiritual sufí de Myanmar: califa de la Liga Islámica Sufí Tariqah de Myanmar y de la Organización KAFTG Garana, que presta servicios a más de doscientos mil musulmanes de Myanmar y ayuda a las comunidades afectadas por la violencia intercomunitaria, según su perfil en Muslim 500."
  fr: "Un chef spirituel soufi du Myanmar: khalifa de la Ligue soufie islamique Tariqah du Myanmar et de l'organisation KAFTG Garana, au service de plus de deux cent mille musulmans du Myanmar et aidant les communautés touchées par la violence communautaire, selon son profil Muslim 500."
  tr: "Myanmar'dan bir Sufi rehber; Myanmar'daki İslami Sufi Tarikat Derneği ve Kaphtag Garana örgütünde halife ve manevi lider, iki yüz binden fazla Myanmar Müslümanına hizmet ediyor ve isyanlardan etkilenen topluluklara yardım ediyor, bu bilgiler The Five Hundred Muslims adlı kitabındaki dosyasına göre."
  id: "Seorang pembimbing Sufi dari Myanmar; seorang khalifah dan pemimpin spiritual di Asosiasi Tarekat Sufi Islam di Myanmar dan organisasi Kaphtag Garana, melayani lebih dari dua ratus ribu Muslim Myanmar dan membantu komunitas yang terdampak kerusuhan, menurut berkasnya dalam buku The Five Hundred Muslims."
