summary:
  ar: "رجل دولة أردني (1901–1965) تولى رئاسة الوزراء ست مرات بين 1944 و1963 في عهد الملوك عبد الله الأول وطلال والحسين، وترأس مجلس الأعيان من 1963 حتى وفاته في عمّان؛ وهو والد رئيس الوزراء اللاحق زيد الرفاعي والأخ الأكبر لرئيس الوزراء عبد المنعم الرفاعي، ويُختلف في مولده بين مرجعيون وصفد."
  en: "Jordanian statesman (1901–1965) who served six terms as prime minister between 1944 and 1963 under Kings Abdullah I, Talal and Hussein, and was president of the Senate from 1963 until his death at Amman. He was the father of the later prime minister Zaid al-Rifai and the elder brother of prime minister Abdelmunim Rifai; his birthplace is disputed between Marjeyoun and Safed."
  ur: "اردنی رجلِ ریاست (1901–1965) جو 1944 سے 1963 کے درمیان شاہ عبد اللہ اول، شاہ طلال اور شاہ حسین کے عہد میں چھ بار وزیر اعظم رہے اور 1963 سے عمّان میں اپنی وفات تک مجلس اعیان کے صدر رہے؛ وہ بعد کے وزیر اعظم زید الرفاعی کے والد اور وزیر اعظم عبد المنعم الرفاعی کے بڑے بھائی تھے؛ ان کی جائے پیدائش مرجعیون اور صفد کے درمیان مختلف فیہ ہے۔"
