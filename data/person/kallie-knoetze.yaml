summary:
  ar: "ملاكم وزن ثقيل وممثل جنوب أفريقي، وُلد باسم نيكولاس ياكوبوس كنوتزي سنة 1953. صُنّف ثالثاً على العالم سنة 1979 بعد إطاحته ببيلي شاركي، وخسر نزال الإقصاء على لقب رابطة الملاكمة العالمية أمام جون تيت، وأنهى مسيرته بسجل 21 فوزاً منها 20 بالضربة القاضية، ثم مثّل في أربعة أفلام أشهرها «بومبر» سنة 1982."
  en: "South African heavyweight boxer and actor, born Nikolaas Jacobus Knoetze in 1953. He was rated the world's number-three heavyweight in 1979 after knocking out Bill Sharkey, lost a WBA title elimination bout to John Tate, finished with 21 wins, 20 of them by knockout, and acted in four films, best known for Bomber (1982)."
  ur: "جنوبی افریقی ہیوی ویٹ باکسر اور اداکار، 1953 میں نیکولاس یاکوبس نوٹزے کے نام سے پیدا ہوئے۔ 1979 میں بلی شارکی کو ناک آؤٹ کرنے کے بعد وہ دنیا کے نمبر تین ہیوی ویٹ قرار پائے، ڈبلیو بی اے ٹائٹل کے ایلیمینیشن مقابلے میں جان ٹیٹ سے ہارے، 21 فتوحات (20 ناک آؤٹ) کے ساتھ ریٹائر ہوئے، اور چار فلموں میں اداکاری کی جن میں سب سے مشہور «بومبر» (1982) ہے۔"
