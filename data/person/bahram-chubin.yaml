summary:
  ar: "بهرام خشنش ويعرف بجوبين، سبهبد فارس؛ لما خرج شايه ملك الترك على هرمز بن أنوشروان في ثلاثمائة ألف مقاتل فوصل هراة وباذغيس أرسله هرمز في اثني عشر ألفاً من المقاتلة فواقع شايه فقتله برمية رماها واستباح عسكره، ثم وافاه برمودة بن شايه فهزمه وحصره في بعض الحصون حتى استسلم فأرسله إلى هرمز أسيراً، ثم خاف بهرام ومن معه هرمز فخلعوه وساروا نحو المدائن وأظهروا أن ابنه أبرويز أصلح للملك منه {cite:kamil-ibn-al-athir p. 354}."
  en: "Bahram Chubin, the Sasanian spahbed: sent by Hormizd IV with twelve thousand picked men against the Turk shah's three hundred thousand, he killed the shah with a single shot, scattered his army, then defeated and captured his son Barmuda; fearing Hormizd afterwards he deposed him in favour of the prince Khusraw Abarwiz {cite:kamil-ibn-al-athir p. 354}."
  es: "Bahram Chubin, el spahbed sasánida: enviado por Hormizd IV con doce mil hombres selectos contra los trescientos mil del shah turco, mató al shah de un solo disparo, dispersó su ejército, luego derrotó y capturó a su hijo Barmuda; temiendo a Hormizd después, lo depuso en favor del príncipe Khusraw Abarwiz {cite:kamil-ibn-al-athir p. 354}."
  fr: "Bahram Chubin, le spahbed sassanide: envoyé par Hormizd IV avec douze mille hommes d'élite contre les trois cent mille du shah turc, il tua le shah d'un seul coup, dispersa son armée, puis vainquit et captura son fils Barmuda; craignant Hormizd par la suite, il le déposa en faveur du prince Khusraw Abarwiz {cite: kamil-ibn-al-athir p. 354}."
  ur: "بہرام چوبین، ساسانی سپاہ: ہرمز چہارم نے ترک شاہ کے تین لاکھ کے مقابلے میں بارہ ہزار چنے ہوئے آدمیوں کے ساتھ بھیجا، اس نے شاہ کو ایک ہی گولی سے مار ڈالا، اس کی فوج کو منتشر کر دیا، پھر اس کے بیٹے برمودا کو شکست دے کر گرفتار کر لیا۔ ہرمزد کے خوف سے بعد میں اس نے اسے شہزادہ خسرو ابرویز کے حق میں معزول کر دیا۔ 354}۔"
  tr: "Bahram Haşniş, yani Jubin, Perslerin lideriydi; Türklerin kralı Şeyeh, üç yüz bin savaşçıyla Hürmüz bin Anuşirvan'a saldırıp Herat ve Badghis'e ulaştığında, Hürmüz onu on iki bin savaşçıyla gönderdi. Şeyh yenildi, atılan okla öldürüldü ve ordusu devrildi. Sonra Barmuda ibn Şeyeh ile yüzleşti, onu yendi ve teslim olana kadar bazı kalelerde kuşattı, onu Hürmüz'e esir olarak gönderdi. Bunun üzerine Bahram ve Hürmoz korktu, onu tahttan indirip şehirlere doğru yürüdüler; bu da oğlu Abrawizin kral için kendisinden daha uygun olduğunu gösterdi {atıf:kamil-ibn-al-athir s. 354}."
  id: "Bahram Khashnish, yang dikenal sebagai Jubin, adalah pemimpin Persia; ketika Shayeh, raja Turki, menyerang Hormuz ibn Anushirwan dengan tiga ratus ribu pejuang dan mencapai Herat dan Badghis. Hormuz mengirimnya dengan dua belas ribu pejuang. Shayeh dikalahkan, terbunuh oleh panah lempar, dan pasukannya digulingkan. Ia kemudian menghadapi Barmuda ibn Shayeh, mengalahkannya, dan mengepungnya di beberapa benteng hingga ia menyerah, mengirimnya ke Hormuz sebagai tawanan. Kemudian Bahram dan Hormoz ketakutan, sehingga mereka menggulingkannya dan bergerak menuju kota-kota, menunjukkan bahwa putranya Abrawiz lebih cocok untuk raja daripada dirinya {cite:kamil-ibn-al-athir hlm. 354}."
