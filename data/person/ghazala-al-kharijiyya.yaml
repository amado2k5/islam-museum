summary:
  ar: "زوجة شبيب الخارجي، كانت من الشجاعة والفروسية بالموضع العظيم، نذرت أن تدخل مسجد الكوفة فتصلي فيه ركعتين تقرأ فيهما البقرة وآل عمران فأتت الجامع في سبعين رجلاً ووفّت نذرها، فقال الناس وفت الغزالة نذرها يا رب لا تغفر لها، ثم قتلت هي وأم شبيب حين انهزم شبيب أمام سفيان بن الأبرد {cite:muruj-al-dhahab p. 130}."
