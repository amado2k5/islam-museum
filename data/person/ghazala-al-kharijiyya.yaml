summary:
  ar: "زوجة شبيب الخارجي، كانت من الشجاعة والفروسية بالموضع العظيم، نذرت أن تدخل مسجد الكوفة فتصلي فيه ركعتين تقرأ فيهما البقرة وآل عمران فأتت الجامع في سبعين رجلاً ووفّت نذرها، فقال الناس وفت الغزالة نذرها يا رب لا تغفر لها، ثم قتلت هي وأم شبيب حين انهزم شبيب أمام سفيان بن الأبرد {cite:muruj-al-dhahab p. 130}."
  en: "Shabib the Kharijite's wife — a famed horsewoman who fulfilled her vow of two rak'as in Kufa's mosque reciting the two long suras, so the town chanted 'she fulfilled her vow — God, do not forgive her'; killed with Umm Shabib when Sufyan routed him {cite:muruj-al-dhahab p. 130}."
  es: "La esposa de Shabib el jariyí, una famosa amazona que cumplió su voto de dos rak'as en la mezquita de Kufa recitando las dos largas suras, por lo que la ciudad coreó 'cumplió su voto; Dios, no la perdones'; murió junto con Umm Shabib cuando Sufyan lo derrotó {cite:muruj-al-dhahab p. 130}."
  fr: "L'épouse de Shabib le Kharijite — une cavalière célèbre qui accomplit son vœu de deux rak'as dans la mosquée de Kufa en récitant les deux longues sourates, de sorte que la ville chanta « elle a accompli son vœu — Dieu, ne lui pardonne pas »; tuée avec Umm Shabib lorsque Sufyan le mit en déroute {cite:muruj-al-dhahab p. 130}."
