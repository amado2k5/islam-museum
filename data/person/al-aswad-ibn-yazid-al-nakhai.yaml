  ar: "من فقهاء الكوفة من التابعين، أبو عمرو الأسود بن يزيد بن قيس النخعي، أخو عبد الرحمن بن يزيد وابن أخي علقمة؛ مات سنة خمس وسبعين، وقالت عائشة إنه لم يكن بالعراق رجل أكرم عليها منه {cite:tabaqat-fuqaha-abbas-1981 p. 42}."
  en: "One of the Kufan jurists among the Successors: Abu Amr al-Aswad ibn Yazid ibn Qays al-Nakha'i, brother of Abd al-Rahman ibn Yazid and nephew of Alqama; he died in the year 75, and Aisha said there was no man in Iraq more honoured by her than he {cite:tabaqat-fuqaha-abbas-1981 p. 42}."
