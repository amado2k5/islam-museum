summary:
  ar: "مهندسة ورائدة أعمال إيرانية أمريكية، وُلدت في مشهد سنة 1966 وهاجرت إلى الولايات المتحدة سنة 1984، شاركت في تأسيس شركة تيليكوم تكنولوجيز (1993) التي بيعت سنة 2001 بنحو 440 مليون دولار، ثم شركة بروديا سيستمز (2006)، وموّلت أسرتها جائزة أنصاري إكس برايز، وصارت سنة 2006 رابع سائح فضائي يموّل رحلته بنفسه وأول امرأة مموّلة ذاتيا تطير إلى محطة الفضاء الدولية، وهي اليوم الرئيسة التنفيذية لمؤسسة إكس برايز."
  en: "Iranian-American engineer and entrepreneur, born in Mashhad in 1966 and emigrated to the United States in 1984, who co-founded Telecom Technologies Inc. (1993), sold in 2001 for about $440 million, then Prodea Systems (2006); her family sponsored the Ansari X Prize, and in 2006 she became the fourth self-funded space tourist and the first self-funded woman to fly to the International Space Station; she is now CEO of the XPRIZE Foundation."
  ur: "ایرانی نژاد امریکی انجینئر اور صنعت کار، جو 1966 میں مشہد میں پیدا ہوئیں اور 1984 میں امریکا منتقل ہوئیں، جنہوں نے ٹیلی کام ٹیکنالوجیز (1993) قائم کی جو 2001 میں تقریباً 440 ملین ڈالر میں فروخت ہوئی، پھر پرودیا سسٹمز (2006) قائم کیا؛ ان کے خاندان نے انصاری ایکس پرائز کی سرپرستی کی، اور 2006 میں وہ چوتھی خود مالی اعانت یافتہ خلائی سیاح اور بین الاقوامی خلائی اسٹیشن جانے والی پہلی خود مالی اعانت یافتہ خاتون بنیں؛ اب وہ ایکس پرائز فاؤنڈیشن کی چیف ایگزیکٹو ہیں۔"
