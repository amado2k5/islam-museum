summary:
  ar: "مهندسة ورائدة أعمال إيرانية أمريكية، وُلدت في مشهد سنة 1966 وهاجرت إلى الولايات المتحدة سنة 1984، شاركت في تأسيس شركة تيليكوم تكنولوجيز (1993) التي بيعت سنة 2001 بنحو 440 مليون دولار، ثم شركة بروديا سيستمز (2006)، وموّلت أسرتها جائزة أنصاري إكس برايز، وصارت سنة 2006 رابع سائح فضائي يموّل رحلته بنفسه وأول امرأة مموّلة ذاتيا تطير إلى محطة الفضاء الدولية، وهي اليوم الرئيسة التنفيذية لمؤسسة إكس برايز."
  en: "Iranian-American engineer and entrepreneur, born in Mashhad in 1966 and emigrated to the United States in 1984, who co-founded Telecom Technologies Inc. (1993), sold in 2001 for about $440 million, then Prodea Systems (2006); her family sponsored the Ansari X Prize, and in 2006 she became the fourth self-funded space tourist and the first self-funded woman to fly to the International Space Station; she is now CEO of the XPRIZE Foundation."
  ur: "ایرانی نژاد امریکی انجینئر اور صنعت کار، جو 1966 میں مشہد میں پیدا ہوئیں اور 1984 میں امریکا منتقل ہوئیں، جنہوں نے ٹیلی کام ٹیکنالوجیز (1993) قائم کی جو 2001 میں تقریباً 440 ملین ڈالر میں فروخت ہوئی، پھر پرودیا سسٹمز (2006) قائم کیا؛ ان کے خاندان نے انصاری ایکس پرائز کی سرپرستی کی، اور 2006 میں وہ چوتھی خود مالی اعانت یافتہ خلائی سیاح اور بین الاقوامی خلائی اسٹیشن جانے والی پہلی خود مالی اعانت یافتہ خاتون بنیں؛ اب وہ ایکس پرائز فاؤنڈیشن کی چیف ایگزیکٹو ہیں۔"
  es: "Ingeniera y empresaria iraní-estadounidense, nacida en Mashhad en 1966 y emigrada a Estados Unidos en 1984, cofundó Telecom Technologies Inc. (1993), vendida en 2001 por unos 440 millones de dólares, y posteriormente Prodea Systems (2006); su familia patrocinó el premio Ansari X Prize, y en 2006 se convirtió en la cuarta turista espacial autofinanciada y la primera mujer autofinanciada en viajar a la Estación Espacial Internacional; actualmente es directora ejecutiva de la Fundación XPRIZE."
  fr: "Ingénieure et entrepreneuse irano-américaine, née à Mashhad en 1966 et ayant émigré aux États-Unis en 1984, elle a cofondé Telecom Technologies Inc. (1993), vendue en 2001 pour environ 440 millions de dollars, puis Prodea Systems (2006); sa famille a parrainé le prix Ansari X, et en 2006, elle est devenue la quatrième touriste spatiale autofinancée et la première femme autofinancée à se rendre à la Station spatiale internationale; elle est maintenant PDG de la Fondation XPRIZE."
  tr: "İran asıllı Amerikalı mühendis ve girişimci, 1966'da Mashhad doğumlu ve 1984'te Amerika Birleşik Devletleri'ne göç etmiştir. Telecom Technologies'i (1993) kurmuştur; 2001'de yaklaşık 440 milyon dolara satılmış, ardından Brodia Systems (2006) bulunmaktadır. Ailesi Ansari X Prize Ödülü'nü finanse etmiş ve 2006'da kendi yolculuğunu finanse eden dördüncü kendi finansmanlı uzay turisti ve Uluslararası Uzay İstasyonu'na uçan ilk kendi finansmanlı kadın olmuştur. Bugün X-Prize Vakfı'nın CEO'sudur."
  id: "Seorang insinyur dan pengusaha Iran-Amerika, lahir di Mashhad pada tahun 1966 dan berimigrasi ke Amerika Serikat pada tahun 1984. Ia ikut mendirikan Telecom Technologies (1993), yang dijual pada tahun 2001 seharga sekitar $440 juta, kemudian Brodia Systems (2006). Keluarganya mendanai Ansari X Prize Prize, dan pada tahun 2006 ia menjadi turis luar angkasa mandiri keempat yang mendanai perjalanan pribadinya dan wanita mandiri pertama yang terbang ke Stasiun Luar Angkasa Internasional. Saat ini, ia menjabat sebagai CEO X-Prize Foundation."
