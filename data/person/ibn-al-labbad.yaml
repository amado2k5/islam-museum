summary:
  ar: محمد بن محمد بن وشاح، أبو بكر القيرواني، المعروف بابن اللباد، فقيه مالكي ومفسر ولغوي. تفقه بيحيى بن عمر وأخيه محمد وابن طالب وسعيد الحداد وغيرهم، وتفقه به ابن الحارث وابن أبي زيد، وروى عنه جماعة منهم زياد بن عبد الرحمن وابن المنتاب. من تصانيفه الآثار والفوائد في عشرة أجزاء، وكتاب الطهارة، وفضائل مكة، وفضائل مالك بن أنس. وذكر المصدر أنه توفي سنة 333 هـ، وأن ميلاده سنة 250 هـ بحسب العنوان. {C(5491)}
  en: Muhammad ibn Muhammad ibn Washshah, Abu Bakr of Qayrawan, known as Ibn al-Labbad, a Maliki jurist, Qur'an commentator and philologist. He studied with Yahya ibn Umar, his brother Muhammad, Ibn Talib, Sa'id al-Haddad and others; Ibn al-Harith and Ibn Abi Zayd studied with him, and a group transmitted from him, among them Ziyad ibn Abd al-Rahman and Ibn al-Mantab. His works include al-Athar wa-al-fawa'id in ten parts, a Book of Purity, the Virtues of Mecca, and the Virtues of Malik ibn Anas. The book gives his death as 333 AH and his birth as 250 AH in its heading. {C(5491)}
  ur: محمد بن محمد بن وشاح، ابو بکر قیروانی، جو ابن اللباد کے نام سے مشہور ہیں، مالکی فقیہ، مفسر اور ماہر لغت۔ انہوں نے یحییٰ بن عمر، ان کے بھائی محمد، ابن طالب اور سعید الحداد وغیرہ سے فقہ پڑھی، اور ان سے ابن الحارث اور ابن ابی زید نے پڑھا۔ تصانیف میں دس جزء کی الآثار والفوائد، کتاب الطہارۃ، فضائل مکہ اور فضائل مالک بن انس شامل ہیں۔ کتاب کے مطابق وفات 333 ہجری اور عنوان میں ولادت 250 ہجری۔ {C(5491)}
