summary:
  ar: محمد بن محمد بن وشاح، أبو بكر القيرواني، المعروف بابن اللباد، فقيه مالكي ومفسر ولغوي. تفقه بيحيى بن عمر وأخيه محمد وابن طالب وسعيد الحداد وغيرهم، وتفقه به ابن الحارث وابن أبي زيد، وروى عنه جماعة منهم زياد بن عبد الرحمن وابن المنتاب. من تصانيفه الآثار والفوائد في عشرة أجزاء، وكتاب الطهارة، وفضائل مكة، وفضائل مالك بن أنس. وذكر المصدر أنه توفي سنة 333 هـ، وأن ميلاده سنة 250 هـ بحسب العنوان. {C(5491)}
  en: Muhammad ibn Muhammad ibn Washshah, Abu Bakr of Qayrawan, known as Ibn al-Labbad, a Maliki jurist, Qur'an commentator and philologist. He studied with Yahya ibn Umar, his brother Muhammad, Ibn Talib, Sa'id al-Haddad and others; Ibn al-Harith and Ibn Abi Zayd studied with him, and a group transmitted from him, among them Ziyad ibn Abd al-Rahman and Ibn al-Mantab. His works include al-Athar wa-al-fawa'id in ten parts, a Book of Purity, the Virtues of Mecca, and the Virtues of Malik ibn Anas. The book gives his death as 333 AH and his birth as 250 AH in its heading. {C(5491)}
  ur: محمد بن محمد بن وشاح، ابو بکر قیروانی، جو ابن اللباد کے نام سے مشہور ہیں، مالکی فقیہ، مفسر اور ماہر لغت۔ انہوں نے یحییٰ بن عمر، ان کے بھائی محمد، ابن طالب اور سعید الحداد وغیرہ سے فقہ پڑھی، اور ان سے ابن الحارث اور ابن ابی زید نے پڑھا۔ تصانیف میں دس جزء کی الآثار والفوائد، کتاب الطہارۃ، فضائل مکہ اور فضائل مالک بن انس شامل ہیں۔ کتاب کے مطابق وفات 333 ہجری اور عنوان میں ولادت 250 ہجری۔ {C(5491)}
  es: "Muhammad ibn Muhammad ibn Washshah, Abu Bakr de Qayrawan, conocido como Ibn al-Labbad, fue un jurista malikí, comentarista del Corán y filólogo. Estudió con Yahya ibn Umar, su hermano Muhammad, Ibn Talib, Sa'id al-Haddad y otros; Ibn al-Harith e Ibn Abi Zayd también estudiaron con él, y un grupo transmitió sus enseñanzas, entre ellos Ziyad ibn Abd al-Rahman e Ibn al-Mantab. Sus obras incluyen al-Athar wa-al-fawa'id en diez partes, un Libro de la Pureza, las Virtudes de La Meca y las Virtudes de Malik ibn Anas. El libro indica en su encabezado que falleció en el año 333 de la Hégira y nació en el año 250 de la Hégira. {C(5491)}"
  fr: "Muhammad ibn Muhammad ibn Washshah, Abu Bakr de Qayrawan, connu sous le nom d'Ibn al-Labbad, était un juriste malikite, commentateur du Coran et philologue. Il étudia auprès de Yahya ibn Umar, son frère Muhammad, Ibn Talib, Sa'id al-Haddad et d'autres. Ibn al-Harith et Ibn Abi Zayd furent également ses élèves, et un groupe de disciples, parmi lesquels Ziyad ibn Abd al-Rahman et Ibn al-Mantab, reçut son enseignement. Parmi ses œuvres figurent al-Athar wa-al-fawa'id en dix parties, un Livre de la Pureté, les Vertus de La Mecque et les Vertus de Malik ibn Anas. L'ouvrage indique sa mort en 333 AH et sa naissance en 250 AH dans son en-tête. {C(5491)}"
  tr: "Muhammed bin Muhammed ibn Vaşah, Ebu Bekir el-Keyrawani, İbn el-Lubad olarak bilinir, Maliki hukukçusu, tefsirci ve dilbilimciydi. Yahya ibn Umar, kardeşi Muhammed, İbn Talib, Seyid el-Haddad ve diğerlerinden fıkıh eğitimi aldı. İbn al-Haris ve İbn Ebı Zayd onun yanında eğitim aldı ve Ziyad ibn Abd al-Rahman ile İbn al-Muntab dahil olmak üzere bir grup ondan rivayet etti. Eserleri arasında on ciltlik El-Athar vel-Fava'id, Arınma Kitabı, Mekke'nin Erdemleri ve Malik ibn Anas'ın Erdemleri yer alır. Kaynak, 333 Hicri yılında öldüğünü ve doğum yılının başlığa göre 250 Hicri olduğunu belirtir. {C(5491)}"
  id: "Muhammad ibn Muhammad ibn Washah, Abu Bakr al-Qayrawani, yang dikenal sebagai Ibn al-Lubad, adalah seorang ahli hukum, tafsir, dan ahli bahasa Maliki. Ia mempelajari hukum di bawah bimbingan Yahya ibn Umar, saudaranya Muhammad, Ibn Talib, Sa'id al-Haddad, dan lainnya. Ibn al-Harith dan Ibn Abi Zayd belajar di bawah bimbingannya, dan sekelompok orang menceritakan darinya, termasuk Ziyad ibn Abd al-Rahman dan Ibn al-Muntab. Di antara karya-karyanya adalah Al-Athar wal-Fawa'id dalam sepuluh jilid, Kitab Penyucian, Kebajikan Mekah, dan Kebajikan Malik ibn Anas. Sumber menyebutkan bahwa ia meninggal pada tahun 333 H, dan tahun kelahirannya adalah 250 H menurut judulnya. {C(5491)}"
