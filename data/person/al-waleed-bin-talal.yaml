summary:
  ar: "الأمير الوليد بن طلال بن عبد العزيز آل سعود ⁦(وُلد في ٧ آذار ١٩٥٥ في جدة)⁩ رجل أعمال ومستثمر سعودي من الأسرة المالكة، مؤسس شركة المملكة القابضة وكبير مساهميها؛ استثمر في سيتي غروب وآبل ونيوز كوربورة وسلاسل فنادق عالمية حتى لُقب بـ«وارن بافيت العربي»، واحتُجز في الريتز-كارلتون بالرياض في حملة تشرين الثاني ٢٠١٧ ثم أُطلق سراحه في كانون الثاني ٢٠١٨ بعد تسوية مالية."
  en: "Prince Al Waleed bin Talal Al Saud (born 7 March 1955 in Jeddah) is a Saudi businessman, investor and royal, founder and controlling shareholder of Kingdom Holding Company; his stakes in Citigroup, Apple, News Corporation and global hotel chains earned him the label 'the Arabian Warren Buffett', and he was detained at the Ritz-Carlton in Riyadh in the November 2017 purge and released in January 2018 after a financial settlement."
  ur: "شہزادہ الولید بن طلال بن عبد العزیز آل سعود ⁦(پیدائش 7 مارچ 1955، جدہ)⁩ سعودی کاروباری، سرمایہ کار اور شاہی خاندان کے فرد ہیں، کنگڈم ہولڈنگ کمپنی کے بانی و بڑے حصص دار؛ سٹی گروپ، ایپل اور نیوز کارپوریشن میں ان کی سرمایہ کاری پر انھیں «عرب وارن بفیٹ» کہا گیا، نومبر 2017 میں گرفتار ہوئے اور جنوری 2018 میں مالی تصفیے کے بعد رہا ہوئے۔"
