summary:
  ar: "أبو بكر بن يحيى الواثق بن محمد بن يحيى بن عبد الواحد، من ملوك الدولة الحفصية بتونس، ولي بعد أخيه المستنصر بعهد منه وقتله خالد الحفصي بتونس بعد سبعة عشر يوماً فلقب بالشهيد؛ توفي سنة ٧٠٩هـ الموافقة ١٣٠٩م."
  en: "Abu Bakr ibn Yahya al-Wathiq ibn Muhammad ibn Yahya ibn Abd al-Wahid, one of the kings of the Hafsid state in Tunis, who succeeded his brother al-Mustansir by his appointment and was killed at Tunis by Khalid the Hafsid after seventeen days, whence the epithet al-Shahid; died 709 AH, equal to 1309 CE."
