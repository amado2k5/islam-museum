summary:
  ar: "داعية وقارئ إندونيسي وُلد في باندا آتشيه سنة 1981، تعلّم في معهد روح الإسلام بأناتش بيسار ثم في كلية أصول الدين بجامعة الأزهر في القاهرة ⁦(تفسير وقراءات)⁩، وأسس سنة 2015 في باندونغ حركة «شباب هجرة» ⁦(شيفت)⁩ الموجهة إلى الشباب، واشتهر بمحاضراته المصحوبة بأنشطة مجتمعية وبيئية عبر مشروع «راهيلا»."
  en: "Indonesian preacher and Qur'an reciter born in Banda Aceh in 1981. He studied at the Ruhul Islam pesantren in Aceh Besar and at Al-Azhar University in Cairo (tafsir and qira'at), founded the Pemuda Hijrah (Shift) youth movement in Bandung in 2015, and is known for youth-oriented lectures and community and environmental activities through the RAHEELA PROJECT."
  ur: "انڈونیشی مبلغ و قاری، جو 1981ء میں باندا آچے میں پیدا ہوئے۔ روح الاسلام مدرسے اور قاہرہ کی الازہر یونیورسٹی میں تفسیر و قراءات کی تعلیم پائی، 2015ء میں بانڈونگ میں نوجوانوں کی تحریک «پیمودا ہجرہ» ⁦(شفٹ)⁩ قائم کی، اور راہیلا پروجیکٹ کے ذریعے ماحولیاتی و سماجی سرگرمیوں سے شہرت پائی۔"
