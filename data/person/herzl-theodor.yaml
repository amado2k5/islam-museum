summary:
  ar: "تيودور هرتزل، زعيم الحركة الصهيونية؛ حاول لقاء السلطان عبد الحميد الثاني فمنعه موظفو قصر يلدز، ثم قابله عام ١٩٠١م ساعتين فعرض أن تساعد البنوك اليهودية الغنية في أوروبا الدولة العثمانية وتخفف ديونها العامة لقاء السماح بالاستيطان في فلسطين، وأرخى له السلطان السمع حتى ظن هرتزل أنه نجح ثم أدرك إخفاقه، فكتب أن تركيا لا يمكن الاستفادة منها إلا إذا تغيرت حالتها السياسية أو زُج بها في حروب تهزم فيها، وقال إنه يفقد الأمل في تحقيق أماني اليهود في فلسطين ما دام عبد الحميد في الحكم {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  en: "Theodor Herzl — leader of the Zionist movement who won a two-hour Yıldız audience in 1901 and offered Jewish banking relief of the Ottoman debt for settlement rights in Palestine; Abdülhamid listened, gave nothing, and Herzl concluded the empire had to be shaken first {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  es: "Theodor Herzl, líder del movimiento sionista, obtuvo una audiencia de dos horas en Yıldız en 1901 y ofreció alivio bancario judío de la deuda otomana a cambio de derechos de asentamiento en Palestina; Abdülhamid escuchó, no dio nada y Herzl concluyó que primero había que sacudir al imperio {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  fr: "Theodor Herzl — chef du mouvement sioniste qui obtint une audience de deux heures à Yıldız en 1901 et proposa aux banques juives un allègement de la dette ottomane en échange de droits de colonisation en Palestine; Abdülhamid écouta, ne donna rien, et Herzl conclut que l'empire devait d'abord être ébranlé {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  ur: "تھیوڈور ہرزل — صہیونی تحریک کا رہنما جس نے 1901 میں دو گھنٹے کے Yıldız سامعین کو جیتا اور فلسطین میں آبادکاری کے حقوق کے لیے عثمانی قرض میں یہودی بینکنگ ریلیف کی پیشکش کی۔ عبد الحمید نے سنا، کچھ نہیں دیا، اور ہرزل نے یہ نتیجہ اخذ کیا کہ پہلے سلطنت کو ہلایا جانا تھا۔ 447-450}۔"
  tr: "Siyonist hareketin lideri Theodor Herzl, Sultan II. Abdulhamid ile görüşmeye çalıştı, ancak Yıldız Sarayı personeli onu engelledi. 1901'de onunla iki saat görüştü ve Avrupa'daki zengin Yahudi bankalarına Osmanlı İmparatorluğu'na yardım etmeleri ve kamu borçlarını azaltmaları karşılığında Filistin'de yerleşim izni vermeyi teklif etti. Sultan, Herzl başarılı olduğunu düşünüp başarısızlığını fark edene kadar kulaklarını yumuşattı. Türkiye'nin ancak siyasi durumunun değişmesi veya onu yenilgiye uğratacağı savaşlara sürüklemesi halinde fayda sağlayabileceğini yazdı. Abdul Hamid iktidarda kaldığı sürece Yahudilerin Filistin'deki arzularını gerçekleştirme umudunu kaybettiğini söyledi {cite:dawlat-uthmaniyya-salabi, s. 447-450}."
  id: "Theodor Herzl, pemimpin gerakan Zionis, mencoba bertemu Sultan Abdul Hamid II, tetapi staf Istana Yildiz mencegahnya. Pada tahun 1901, ia bertemu dengannya selama dua jam dan menawarkan bantuan bank-bank Yahudi kaya di Eropa untuk membantu Kekaisaran Ottoman dan mengurangi utang publiknya dengan imbalan memungkinkan pemukiman di Palestina. Sultan menenangkan telinganya sampai Herzl merasa ia berhasil namun menyadari kegagalannya. Ia menulis bahwa Turki hanya bisa mendapat manfaat jika situasi politiknya berubah atau menyeretnya ke dalam perang yang akan dikalahkan. Ia mengatakan ia kehilangan harapan untuk mewujudkan aspirasi Yahudi di Palestina selama Abdul Hamid masih berkuasa {cite:dawlat-uthmaniyya-salabi, hlm. 447-450}."
