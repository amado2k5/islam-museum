summary:
  ar: "تيودور هرتزل، زعيم الحركة الصهيونية؛ حاول لقاء السلطان عبد الحميد الثاني فمنعه موظفو قصر يلدز، ثم قابله عام ١٩٠١م ساعتين فعرض أن تساعد البنوك اليهودية الغنية في أوروبا الدولة العثمانية وتخفف ديونها العامة لقاء السماح بالاستيطان في فلسطين، وأرخى له السلطان السمع حتى ظن هرتزل أنه نجح ثم أدرك إخفاقه، فكتب أن تركيا لا يمكن الاستفادة منها إلا إذا تغيرت حالتها السياسية أو زُج بها في حروب تهزم فيها، وقال إنه يفقد الأمل في تحقيق أماني اليهود في فلسطين ما دام عبد الحميد في الحكم {cite:dawlat-uthmaniyya-salabi p. 447-450}."
  en: "Theodor Herzl — leader of the Zionist movement who won a two-hour Yıldız audience in 1901 and offered Jewish banking relief of the Ottoman debt for settlement rights in Palestine; Abdülhamid listened, gave nothing, and Herzl concluded the empire had to be shaken first {cite:dawlat-uthmaniyya-salabi p. 447-450}."
