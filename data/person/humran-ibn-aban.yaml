summary:
  ar: "عند البلاذري: حمران بن أبان بن خالد التمري — وقوم يقولون كان اسم أبيه أبا — مولى عثمان كان للمسيب بن نجبة الفزاري فاشتراه منه فأعتقه ثم وجهه إلى الكوفة للمسألة عن عامله فكذبه فأخرجه من جواره فنزل البصرة وكان من سبي عين التمر."
  en: "In al-Baladhuri: Humran ibn Aban ibn Khalid al-Tamri — some say his father was named Aba — Uthman's mawla; he had belonged to al-Musayyib ibn Najaba al-Fazari, who bought and freed him, then sent him to Kufa to ask about his agent; he denied him and expelled him from his protection so he settled Basra — he was of Ayn al-Tamr's captives."
