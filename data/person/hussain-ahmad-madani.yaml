summary:
  ar: "عالم ومحدث هندي ديوبندي ⁦(1879–1957)⁩، شيخ الحديث ورئيس جامعة دار العلوم ديوبند عقودًا. قاد معارضة علمية للاستعمار البريطاني وعارض تقسيم الهند داعيًا إلى «القومية المتحدة»، ومن مؤلفاته «متّحدہ قومیت اور اسلام» و«نقش حیات» ورسائله ومكاتباته."
  en: "Indian Deobandi scholar and hadith master (1879–1957), Shaykh al-Hadith and long-serving rector of Darul Uloom Deoband. He led scholarly opposition to British rule and opposed the Partition of India, advocating 'composite nationalism' (Muttahida Qaumiyat); his works include Naqsh-e-Hayat and his letters."
  ur: "ہندوستانی دیوبندی عالم اور محدث ⁦(1879–1957)⁩ جو عشرہاں برس دار العلوم دیوبند کے شیخ الحدیث اور صدر مدرس رہے۔ انہوں نے برطانوی راج کے خلاف علمی مزاحمت کی قیادت کی اور تقسیمِ ہند کی مخالفت کرتے ہوئے «متحدہ قومیت» کی وکالت کی؛ ان کی تصانیف میں «متحدہ قومیت اور اسلام» اور «نقشِ حیات» اور خطوط شامل ہیں۔"
