summary:
  ar: "ممثلة وكاتبة وداعية إندونيسية وُلدت في باتام سنة 1989، اشتهرت بدور البطولة في فيلم «عندما تُسبّح المحبة» (2009)، ودرست الأدب الهولندي في جامعة إندونيسيا ثم نالت الدكتوراه مرتين في الدراسات الإسلامية وعلوم القرآن، وأسست سنة 2016 مؤسسة مسكن الحفاظ لتعليم الفتيات اليتيمات والفقيرات حفظ القرآن، وتقدم الاستشارات الدعوية في التلفزيون وقناتها على يوتيوب."
  en: "Indonesian actress, writer and preacher born in Batam in 1989. She became known for the lead role in the film Ketika Cinta Bertasbih (2009), studied Dutch literature at the University of Indonesia and later earned two doctorates in Islamic studies and Qur'anic studies, and in 2016 founded the Maskanul Huffadz foundation, which houses and sponsors orphaned and poor girls memorising the Qur'an. She preaches on television and on her YouTube channel."
  ur: "انڈونیشی اداکارہ، مصنفہ اور داعیہ، جو 1989ء میں باتام میں پیدا ہوئیں۔ فلم «کتیکا چنتا برتسبیح» ⁦(2009ء)⁩ کے مرکزی کردار سے شہرت پائی، انڈونیشیا یونیورسٹی میں ولندیزی ادب پڑھا اور بعد میں اسلامی علوم اور علومِ قرآن میں دو ڈاکٹریٹ کیے، اور 2016ء میں مسکن الحفاظ فاؤنڈیشن قائم کی جو یتیم و نادار بچیوں کو حفظِ قرآن کی سہولت دیتی ہے۔ وہ ٹیلی ویژن اور اپنے یوٹیوب چینل پر دعوت دیتی ہیں۔"
