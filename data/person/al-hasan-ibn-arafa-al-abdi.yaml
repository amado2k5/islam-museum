summary:
  ar: "الحسن بن عرفة بن يزيد، أبو علي العبدي البغدادي، محدث، وكان عالما بأيام العرب والسير، ثقة كثير الاطلاع. روى عن عمار بن محمد وعيسى بن يونس وأبي بكر بن عياش، وعنه الترمذي وابن ماجة. قال ابن معين: ثقة، وذكره ابن حبان في الثقات. وذكر الصفحة أنه توفي سنة 257هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3485}"
  en: "Al-Hasan ibn Arafa ibn Yazid, Abu Ali al-Abdi al-Baghdadi, a hadith scholar, learned in the Arab days and in biography, reliable and widely read. He narrated from Ammar ibn Muhammad and Isa ibn Yunus, and al-Tirmidhi and Ibn Majah narrated from him. The page dates his death to 257 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3485}"
