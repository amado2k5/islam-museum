summary:
  ar: "عبد الوهاب بن أحمد الشعراني الشافعي؛ قال عبد الرؤوف المناوي في طبقاته: هو شيخنا الإمام العامل العابد الزاهد الفقيه المحدث الأصولي الصوفي المربي المسلك، من ذرية محمد بن الحنفية؛ ولد ببلده ومات أبوه وهو طفل فحفظ القرآن وأبا شجاع والآجرومية وهو ابن نحو سبع أو ثمان ثم انتقل إلى مصر سنة إحدى عشرة وتسعمائة فقطن بجامع الغوري وحفظ المنهاج والألفية والتوضيح والتنقيص والشاطبية وقواعد ابن هشام بل حفظ الروض إلى القضاء، وقرأ الكتب الستة على أمين الدين إمام جامع الغوري وأخذ عن الدواخلي والمحلي والقسطلاني والأشموني والقاضي زكريا والشهاب الرملي، ثم أقبل على الطريق فمكث سنين لا يضطجع على الأرض بل شدّ له حبلاً سقف خلوته يجعله في عنقه ليلاً حتى لا يسقط، وكان يفطر على أوقية من الخبز وجمع الخرق من الزبالين وجعلها ملبسه، حتى قويت روحانيته فصار يطير من محراب الجامع الغوري إلى سطحه؛ ثم تصدى للتصنيف فألف منها مختصر الفتوحات وسنن البيهقي الكبرى ومختصر تذكرة القرطبي والميزان والبحر المورد في المواثيق والعهود وكشف الغمة عن جميع الأمة والمنهج المبين في أدلة المجتهدين والبدر المنير في غريب أحاديث البشير النذير ومشارق الأنوار القدسية في العهود المحمدية ولواقح الأنوار واليواقيت والجواهر في عقائد الأكابر والجوهر المصون وطبقات ثلاث ومفحم الأكباد في مواد الاجتهاد وحد الحسام على من أوجب العمل بالإلهام والبراق الخاطف لبصر من عمل بالهواتف ورسالة الأنوار وكشف الران عن أسئلة الجان؛ وحسده طوائف فدسّوا عليه كلمات يخالف ظاهرها الشرع وعقائد زائعة فشنعوا وسبّوا {cite:shadharat-dhahab p. 371-372}."
  en: "Al-Sha'rani — of Muhammad b. al-Hanafiyya's line; orphaned a child, he memorized the Qur'an by about seven and the Rawd to the qadi-book; at the Ghuri mosque he took the Six Books on Amin al-Din and read on al-Qastallani, al-Ashmuni, Zakariyya and al-Ramli; years of a rope hung from his cell's roof so he would not lie down, breaking his fast on an ounce of bread, clothing himself from scavenged rags — then 'he would fly from the Ghuri mosque's mihrab to its roof'; his works: Mukhtasar al-Futuhat, al-Mizan, Kashf al-Ghumma, Lawaqih al-Anwar, al-Yawaqit wa'l-Jawahir, three Tabaqat — while envious rivals forged words into his books to smear him {cite:shadharat-dhahab p. 371-372}."
  fr: "Al-Sha'rani - de Muhammad b. al-Hanafiyya ligne ; orphelin d'un enfant, il a mémorisé le Coran par environ sept et le Rawd au qadi-livre ; à la mosquée Ghuri, il a pris les six livres sur Amin al-Din et a lu sur al-Qastallani, al-Ashmuni, Zakariyya et al-Ramli ; des années d'une corde accrochée au toit de sa cellule pour qu'il ne s'allonge pas, rompant son jeûne sur une once de pain, se vêtant de chiffons récupérés - puis \"il volait du mihrab de la mosquée de Ghuri à son toit\" ; ses œuvres  : Mukhtasar al-Futuhat, al-Mizan, Kashf al-Ghumma, Lawaqih al-Anwar, al-Yawaqit wa'l-Jawahir, trois Tabaqat – tandis que des rivaux envieux ont forgé des mots dans ses livres pour le salir {cite:shadharat-dhahab p. 371-372}."
  es: "Al-Sha'rani — de la línea de Muhammad b. al-Hanafiyya; huérfano de niño, memorizó el Corán a los siete años y el Rawd hasta el libro del cadí; en la mezquita de Ghuri tomó los Seis Libros de Amin al-Din y leyó sobre al-Qastallani, al-Ashmuni, Zakariyya y al-Ramli; años de una cuerda colgaba del techo de su celda para que no se acostara, rompiendo su ayuno con una onza de pan, vistiéndose con harapos recogidos — entonces 'volaba desde el mihrab de la mezquita de Ghuri hasta su techo'; sus obras: Mukhtasar al-Futuhat, al-Mizan, Kashf al-Ghumma, Lawaqih al-Anwar, al-Yawaqit wa'l-Jawahir, tres Tabaqat — mientras rivales envidiosos falsificaban palabras en sus libros para difamarlo {cite:shadharat-dhahab p. 371-372}."
  ur: "الشعرانی — محمد بن کا۔ حنفیہ کی سطر؛ ایک بچے کو یتیم کیا، اس نے تقریباً سات تک قرآن حفظ کیا اور قضاء کتاب تک۔ غوری مسجد میں اس نے امین الدین پر چھ کتابیں لیں اور قسطلانی، الشمونی، زکریا اور الرملی پر پڑھی۔ اپنی کوٹھڑی کی چھت سے برسوں کی رسی لٹکی ہوئی تھی، اس لیے وہ لیٹنے نہیں دیتے تھے، ایک اونس روٹی پر افطار کرتے تھے، خود کو کچے ہوئے چیتھڑوں سے ملبوس کرتے تھے - پھر 'وہ غوری مسجد کے محراب سے اڑ کر اس کی چھت پر جاتے تھے'؛ ان کی تصانیف: مختار الفتوحات، المیزان، کشف الغمہ، لاوقیح الانوار، الیواقیت والجواہر، تین طبقات — جب کہ حسد کرنے والے حریفوں نے ان کی کتابوں میں الفاظ گھڑ کر اسے بدنام کیا۔ 371-372}۔"
  tr: "Abdul Wahhab bin Ahmed Al-Sha'rani Al-Shafi'i; Abdul Rauf Al-Manawi Tabaqat'ında şöyle demiştir: O bizim şeyhimiz, emekçi, dindar, münhihi, hukukçu, hadis âlimimiz, Sufi, eğitimli olanımızdır; memleketinde doğmuştur ve babası çocukken vefat etmiştir. Yedi ya da sekiz yaşındayken Kur'an, Ebu Şuca ve El-Ecrrumiye'yi ezberledi, sonra 900 Hicri yılında Mısır'a Al-Ghuri Camii'ne taşındı ve El-Minhaj, El-Tavdi, El-Neki, El-Şatibiye ve Kaveid İbn Hişam'ı ezberledi, hatta yargıya kadar El-Ravid'i ezberledi. Altı kitabı Džure'de çalıştı Amin al-Din, Al-Ghuri Camii'nin imamı idi ve Al-Dawakhli, Al-Mahalli, Al-Qastallani, Al-Ashmuni, Qadi Zekaria ve Al-Shihab Al-Ramli'nin yanında eğitim aldı. Sonra yola çıktı ve yıllarca yerde yatmadan kaldı; bunun yerine, düşmemek için geceleri boynunda tutmak üzere inzivadaki odasının çatısına bir ip bağladı. Orucunu bir gram ekmekle açar, leşçilerden bez toplar ve giysilerine koyardı; ruhani durumu güçlenene kadar ve Al-Ghuri Camii'nin mihrabından çatısına uçmaya başladı. Daha sonra yazmaya başladı ve Mukhtasar al-Futuhat, Sunan al-Bayhaqi al-Kubra, Mukhtasar Tadhkirat al-Qurtubi ve al-Mizan gibi kitaplar yazdı El-Bahr el-Mevrid fi el-Mevā ve el-Udâdāt, 'Kaşf el-Ğummah 'an Mu'lama min fi Adilāt al-Mujtahidīn', el-Bedr el-Mu'minir fi Harib el-Hadis el-Beşîr el-Nehir, 'Meşriq el-Enver el-Kudsiyye fi al-Uhud el-Muhammediye', 'Vaki el-Enver, el-Yavahidiyah', iqit, al-Cavehir fi 'Aqa'id al-Akabir', 'al-Jawhar al-Musunun', 'Tabaqat Thalath', 'Mufqat al-Akhab' ictihad konularında, 'Hadis el-Hüsey', 'Hadhâm' 'al-Hüseyin el-Hüseyyyah, 'Hadis' (Parlak Şafak), 'Meşriq el-Enver el-Kudsiyye fi al-'Uhud al-'Uhud al-Uhud al-Muhammediy' ah', 'Waqih al-Enwar' wa al-'Waqih al-Anwar, 'al-Jawahir al-'Akhwa', 'al-Jawahir al-'Aqabir fi 'Aqa'id al-Akbar', 'Mufqat al-Akhab' 'Ma'dat al-Ijtihad'da, 'Hadis' al-Khādīr', 'Ḥaḥaṭāḥ al-Husayyyah' (İcz'in İlkelerindeki İlahi Vahy' tihad), 'İctihad İşlerinde Parlak Şafak', 'İctihad İşleri'nde 'Kutsal Işıkların Şafağı', 'İctihad İşleri'nde 'Kutsal Işıkların Şafağı', 'Peygamberlerin İlimleri'nde 'İlahi Alemler', 'Peygamberlerin Bilimleri'nde, Muhammediye Çağlarında Kutsal Tışıklar'da', 'Gecelerin Şafağı'nda, 'Muham'ın Çağlarında Kutsal Tışıklar"
  id: "Abdul Wahhab bin Ahmad Al-Sha'rani Al-Shafi'i; Abdul Raouf Al-Manawi berkata dalam Tabaqat-nya: Dia adalah sheikh kita, pekerja, taat, pertapa sejati, ahli hukum, ulama hadits, Sufi, yang terpelajar, dari garis keturunan Muhammad ibn al-Hanafiyyah; dia lahir di kampung halamannya, dan ayahnya meninggal saat dia masih kecil. Dia menghafal Al-Qur'an, Abu Shuja', dan Al-Ajurrumiyya saat berusia sekitar tujuh atau delapan tahun, lalu pindah ke Mesir pada tahun 900 H di Masjid Al-Ghuri dan menghafal Al-Minhaj, Al-Alfiyya, Al-Tawdih, Al-Naqees, Al-Shatibiyyah, dan Qawa'id Ibn Hisham, bahkan menghafal Al-Rawd hingga ke pengadilan. Dia mempelajari enam kitab tersebut di Amin al-Din adalah imam Masjid Al-Ghuri dan belajar di bawah bimbingan Al-Dawakhli, Al-Mahalli, Al-Qastallani, Al-Ashmuni, Qadi Zakaria, dan Al-Shihab Al-Ramli. Kemudian ia memulai perjalanan dan tinggal bertahun-tahun tanpa berbaring di tanah; sebaliknya, ia mengikat tali di atap kamar pengasingannya agar tali itu tetap di lehernya pada malam hari agar tidak jatuh. Ia berbuka puasa dengan seons roti, mengumpulkan kain dari para pemulung, dan memakainya di pakaiannya, hingga spiritualitasnya semakin kuat, dan ia mulai terbang dari mihrab Masjid Al-Ghuri ke atapnya. Kemudian ia mulai menulis dan menulis buku seperti Mukhtasar al-Futuhat, Sunan al-Bayhaqi al-Kubra, Mukhtasar Tadhkirat al-Qurtubi, dan al-Mizan Al-Bahr al-Mawrid fi al-Mawāṣīq wa al-ʿUḥdāt, 'Kashf al-Ghummah 'an Mu'lama min fi Adilāt al-Mujtahidīn', al-Badr al-Mu'minīr fi Gharib al-Ahadith al-Bashir al-Nadhir, 'Mashriq al-Anwar al-Qudsiyyah fi al-ʿUhud al-Muhammadiyah', 'Waqih al-Anwar, al-Yaw aqit, al-Jawahir fi 'Aqa'id al-Akabir', 'al-Jawhar al-Musunun', 'Tabaqat Thalath', 'Mufqat al-Akhab' dalam urusan ijtihad, 'Hadith al-Husa', 'Hadhām' 'al-Husayn al-Husayyyah, 'Hadith al-Husqiyah' (Fajar Cerah), 'Mashriq al-Anwar al-Qudsiyyah fi al-'Uhud al-'Uhud al-Musad hammadiyah', 'Waqih al-Anwar' wa al-'Waqih al-Anwar, 'al-Jawahir al-'Akhwa', 'al-Jawahir al-'Aqabir fi 'Aqa'id al-Akbar', 'Mufqat al-Akhab' dalam 'Ma'dat al-Ijtihad', 'Hadits al-Khādīr', 'Ḥaḥaṭāḥ al-Husayyyah' (Wahyu Ilahi dalam Prinsip-prinsip Ijtiyah had), 'Fajar Bercahaya dalam Urusan Ijtihad', 'Fajar Cahaya Suci' dalam 'Manifestasi Ilahi' dalam 'Urusan Ijtihad', 'Fajar Cahaya Suci' dalam 'Alam Ilahi Mata Para Nabi', 'Alam Ilahi' dalam 'Ilmu Para Nabi, Cahaya Suci di Zaman Muhammadiyah', 'Fajar Malam', 'Cahaya Suci di Zaman Muhammad"
