summary:
  ar: "عبد الوهاب بن أحمد الشعراني الشافعي؛ قال عبد الرؤوف المناوي في طبقاته: هو شيخنا الإمام العامل العابد الزاهد الفقيه المحدث الأصولي الصوفي المربي المسلك، من ذرية محمد بن الحنفية؛ ولد ببلده ومات أبوه وهو طفل فحفظ القرآن وأبا شجاع والآجرومية وهو ابن نحو سبع أو ثمان ثم انتقل إلى مصر سنة إحدى عشرة وتسعمائة فقطن بجامع الغوري وحفظ المنهاج والألفية والتوضيح والتنقيص والشاطبية وقواعد ابن هشام بل حفظ الروض إلى القضاء، وقرأ الكتب الستة على أمين الدين إمام جامع الغوري وأخذ عن الدواخلي والمحلي والقسطلاني والأشموني والقاضي زكريا والشهاب الرملي، ثم أقبل على الطريق فمكث سنين لا يضطجع على الأرض بل شدّ له حبلاً سقف خلوته يجعله في عنقه ليلاً حتى لا يسقط، وكان يفطر على أوقية من الخبز وجمع الخرق من الزبالين وجعلها ملبسه، حتى قويت روحانيته فصار يطير من محراب الجامع الغوري إلى سطحه؛ ثم تصدى للتصنيف فألف منها مختصر الفتوحات وسنن البيهقي الكبرى ومختصر تذكرة القرطبي والميزان والبحر المورد في المواثيق والعهود وكشف الغمة عن جميع الأمة والمنهج المبين في أدلة المجتهدين والبدر المنير في غريب أحاديث البشير النذير ومشارق الأنوار القدسية في العهود المحمدية ولواقح الأنوار واليواقيت والجواهر في عقائد الأكابر والجوهر المصون وطبقات ثلاث ومفحم الأكباد في مواد الاجتهاد وحد الحسام على من أوجب العمل بالإلهام والبراق الخاطف لبصر من عمل بالهواتف ورسالة الأنوار وكشف الران عن أسئلة الجان؛ وحسده طوائف فدسّوا عليه كلمات يخالف ظاهرها الشرع وعقائد زائعة فشنعوا وسبّوا {cite:shadharat-dhahab p. 371-372}."
  en: "Al-Sha'rani — of Muhammad b. al-Hanafiyya's line; orphaned a child, he memorized the Qur'an by about seven and the Rawd to the qadi-book; at the Ghuri mosque he took the Six Books on Amin al-Din and read on al-Qastallani, al-Ashmuni, Zakariyya and al-Ramli; years of a rope hung from his cell's roof so he would not lie down, breaking his fast on an ounce of bread, clothing himself from scavenged rags — then 'he would fly from the Ghuri mosque's mihrab to its roof'; his works: Mukhtasar al-Futuhat, al-Mizan, Kashf al-Ghumma, Lawaqih al-Anwar, al-Yawaqit wa'l-Jawahir, three Tabaqat — while envious rivals forged words into his books to smear him {cite:shadharat-dhahab p. 371-372}."
