summary:
  ar: "بطاقة أولية للمؤيد أحمد بن الحسين الهاروني، الإمام الزيدي والفقيه في اليمن، توفي سنة ١٠٢٠م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Mu'ayyad Ahmad ibn al-Husayn al-Haruni, the Zaydi imam and jurist of Yemen, d. 1020; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para al-Mu'ayyad Ahmad ibn al-Husayn al-Haruni, el imán y jurista zaidí de Yemen, fallecido en 1020; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de projet pour al-Mu'ayyad Ahmad ibn al-Husayn al-Haruni, l'imam et juriste zaydite du Yémen, mort en 1020; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "یمن کے زیدی امام اور فقیہ المعیاد احمد بن الحسین الحرونی کے لیے کارڈ کا مسودہ، ڈی۔ 1020; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Yemen'de 1020 yılında vefat eden Zaydi imamı ve hukukçusu Al-Mueyyad Ahmed ibn al-Husayn al-Harouni için ön kart; İslam Devletleri sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Al-Mu'ayyad Ahmad ibn al-Husayn al-Harouni, imam Zaydi dan ahli hukum di Yaman, yang meninggal pada tahun 1020 M; ia disebutkan dalam kamus Negara-negara Islam dan biografinya belum ditinjau di halaman tersebut."
