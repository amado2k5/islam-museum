summary:
  ar: "السير ناصر داوود خليلي (وُلد في 18 كانون الأول 1945) عالم وجامع تحف ومُحسن بريطاني وُلد في أصفهان بإيران. جمع «مجموعات الخليلي» الثماني التي تضم نحو 35 ألف عمل، وفيها أكبر مجموعة خاصة للفن الإسلامي في العالم، ونال الدكتوراه من كلية الدراسات الشرقية والأفريقية (SOAS) سنة 1988 وأسس فيها أول كرسي للفن الإسلامي، ومُنح لقب فارس سنة 2020 لخدماته في العلاقات بين الأديان والعمل الخيري، وعيّنته اليونسكو سفيرا للنوايا الحسنة سنة 2012."
  en: "Sir Nasser David Khalili (born 18 December 1945) is an Iranian-born British scholar, collector and philanthropist, born in Isfahan. He assembled the eight Khalili Collections of some 35,000 works, including the largest private collection of Islamic art in the world, took his PhD at SOAS in 1988 and endowed its first chair of Islamic art, was knighted in 2020 for services to interfaith relations and charity, and was named a UNESCO Goodwill Ambassador in 2012."
  ur: "سر ناصر داوود خلیلی (پیدائش 18 دسمبر 1945) ایران کے شہر اصفہان میں پیدا ہونے والے برطانوی عالم، نوادرات جمع کرنے والے اور مخیر ہیں۔ انہوں نے آٹھ «خلیلی مجموعے» ترتیب دیے جن میں تقریباً 35 ہزار نوادرات شامل ہیں، جن میں اسلامی فن کا دنیا کا سب سے بڑا نجی مجموعہ بھی ہے؛ 1988 میں SOAS سے پی ایچ ڈی کی، وہاں اسلامی فن کی پہلی کرسی قائم کی، 2020 میں بین المذاہب تعلقات اور فلاحی خدمات پر نائٹ کا خطاب ملا، اور 2012 میں یونیسکو نے انہیں خیرسگالی سفیر مقرر کیا۔"

