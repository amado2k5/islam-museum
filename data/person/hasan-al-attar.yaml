summary:
  ar: "عالم من أصل مغربي وُلد في القاهرة بعد سنة 1180هـ (1766م)، درس بالأزهر، وكان من القلائل الذين تواصلوا مع العلماء الفرنسيين بعد احتلال بونابرت لمصر، ثم صار محررًا للوقائع المصرية، وعُيّن شيخًا للأزهر سنة 1245هـ (1830م) وتوفي في منصبه سنة 1250هـ (1835م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
  en: "Scholar of Maghribi origin, born in Cairo after 1180 AH (1766). He studied at al-Azhar, was one of the few 'ulama to deal with French scholars after Bonaparte's occupation, became editor of the official journal al-Waqa'i' al-Misriyya, was installed as Shaykh al-Azhar in 1245 AH (1830), and died in office in 1250 AH (1835) {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
