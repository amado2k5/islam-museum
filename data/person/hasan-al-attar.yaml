summary:
  ar: "عالم من أصل مغربي وُلد في القاهرة بعد سنة 1180هـ ⁦(1766م)⁩، درس بالأزهر، وكان من القلائل الذين تواصلوا مع العلماء الفرنسيين بعد احتلال بونابرت لمصر، ثم صار محررًا للوقائع المصرية، وعُيّن شيخًا للأزهر سنة 1245هـ ⁦(1830م)⁩ وتوفي في منصبه سنة 1250هـ ⁦(1835م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
  en: "Scholar of Maghribi origin, born in Cairo after 1180 AH (1766). He studied at al-Azhar, was one of the few 'ulama to deal with French scholars after Bonaparte's occupation, became editor of the official journal al-Waqa'i' al-Misriyya, was installed as Shaykh al-Azhar in 1245 AH (1830), and died in office in 1250 AH (1835) {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
  es: "Erudito de origen magrebí, nacido en El Cairo después del año 1180 de la Hégira (1766). Estudió en al-Azhar, fue uno de los pocos ulemas que trataron con eruditos franceses tras la ocupación de Bonaparte, se convirtió en editor de la revista oficial al-Waqa'i' al-Misriyya, fue nombrado Shaykh al-Azhar en el año 1245 de la Hégira (1830) y murió en el cargo en el año 1250 de la Hégira (1835) {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
  fr: "Érudit d'origine maghrébine, né au Caire après 1180 AH (1766). Il étudia à al-Azhar, fut l'un des rares oulémas à traiter avec les érudits français après l'occupation de Bonaparte, devint rédacteur en chef du journal officiel al-Waqa'i' al-Misriyya, fut installé comme cheikh d'al-Azhar en 1245 AH (1830) et mourut en fonction en 1250 AH (1835) {cite:encyclopaedia-of-islam-2 vol. 1 p. 804}."
  ur: "مغربی نژاد عالم، 1180ھ (1766) کے بعد قاہرہ میں پیدا ہوئے۔ اس نے الازہر میں تعلیم حاصل کی، بوناپارٹ کے قبضے کے بعد فرانسیسی علماء سے نمٹنے والے چند علماء میں سے ایک تھے، سرکاری جریدے الوقاعی المصریہ کے ایڈیٹر بنے، 1245ھ (1830) میں شیخ الازہر کے عہدے پر فائز ہوئے، اور 1235ھ (1135) میں دفتر میں وفات پا گئے۔ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 804}۔"
  tr: "Fas kökenli bir âlim, 1180 Hicri (1766) sonrası Kahire'de doğmuş, El-Ezher'de eğitim görmüş ve Bonapart'ın Mısır'ı işgalinden sonra Fransız alimlerle iletişim kuran az sayıdaki kişiden biriydi. Daha sonra Mısır Kroniği'nin editörü oldu, 1245 Hicri (1830) yılında Ezher Şeyhi olarak atandı ve 1250 Hicri (1835 M.S.) görevdeyken öldü. {atıf:İslam Ansiklopedisi-2 cilt 1, s. 804}."
  id: "Seorang cendekiawan keturunan Maroko, lahir di Kairo setelah 1180 H (1766 M), belajar di Al-Azhar, dan termasuk sedikit orang yang berkomunikasi dengan ulama Prancis setelah Bonaparte menduduki Mesir. Ia kemudian menjadi editor Egyptian Chronicle, diangkat sebagai Sheikh Al-Azhar pada 1245 H (1830 M), dan meninggal saat menjabat pada 1250 H (1835 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 804}."
