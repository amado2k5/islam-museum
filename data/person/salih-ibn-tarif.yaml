id: person/salih-ibn-tarif
class: person
label: { ar: "صالح بن طريف" }
gender: male
summary:
  ar: "من أهل الصلاح والتقوى الذين مضت بجهودهم حركة نشر الإسلام في بلاد ما وراء النهر مطردة مزدهرة في عهد هشام بن عبد الملك، وفق ما يذكره الكتاب؛ وكان الوالي أشرس بن عبد الله السلمي قد وجّه الدعاة والفقهاء إلى تلك البلاد {cite:umayyad-birth-to-fall-2006 p. 109}."
  tr: "Kitapta belirtildiği gibi, Transoksiana'da İslam'ın yayılmasına yol açan doğru ve dindar kişiler arasında, Hisham bin Abdülmalik'in saltanatı boyunca istikrarlı ve refah içinde gelişti; vali Aşra bin Abdullah el-Sulami o topraklara vaizler ve hukukçular göndermişti {cite:umayyad-birth-to-fall-2006, s. 109}."
  id: "Di antara orang-orang benar dan saleh yang upayanya membawa penyebaran Islam di Transoxiana berkembang pesat dan makmur selama masa pemerintahan Hisham ibn Abd al-Malik, menurut kitab tersebut; gubernur Ashras ibn Abdullah al-Sulami telah mengirim para pendakwah dan ahli hukum ke negeri-negeri tersebut {cite:umayyad-birth-to-fall-2006, hlm. 109}."
