summary:
  ar: "سلطان مملوكي جركسي، وثب على المؤيد أحمد بن جقمق فقبضه في رمضان سنة خمس وستين فقلده الخليفة المستنجد ولقب الظاهر فاستمر إلى أن مات في ربيع سنة اثنتين وسبعين، وأول ما قلد قدم نائب الشام جانم لموافقة كانت بينه وبين العسكر فأمر بطلوع الخليفة والقضاة والعسكر إلى القلعة ثم لم يمكنه من عوده إلى سكنه فاستمر بها {cite:tarikh-khulafa-minhaj-1434 p. 776}."
  en: "Circassian sultan invested by the caliph in 865; he confined the caliph to the citadel on Janim's approach and never let him return to his own dwelling {cite:tarikh-khulafa-minhaj-1434 p. 776}."
