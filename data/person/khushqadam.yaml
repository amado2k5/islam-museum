id: person/khushqadam
class: person
label: { ar: "السلطان الظاهر خشقدم" }
summary:
  ar: "سلطان مملوكي جركسي، وثب على المؤيد أحمد بن جقمق فقبضه في رمضان سنة خمس وستين فقلده الخليفة المستنجد ولقب الظاهر فاستمر إلى أن مات في ربيع سنة اثنتين وسبعين، وأول ما قلد قدم نائب الشام جانم لموافقة كانت بينه وبين العسكر فأمر بطلوع الخليفة والقضاة والعسكر إلى القلعة ثم لم يمكنه من عوده إلى سكنه فاستمر بها {cite:tarikh-khulafa-minhaj-1434 p. 776}."
  en: "Circassian sultan invested by the caliph in 865; he confined the caliph to the citadel on Janim's approach and never let him return to his own dwelling {cite:tarikh-khulafa-minhaj-1434 p. 776}."
  es: "Sultán circasiano investido por el califa en 865; confinó al califa en la ciudadela ante la llegada de Janim y nunca le permitió regresar a su propia morada {cite:tarikh-khulafa-minhaj-1434 p. 776}."
  fr: "Sultan circassien investi par le calife en 865; il confina le calife à la citadelle à l'approche de Janim et ne le laissa jamais retourner à sa propre demeure {cite:tarikh-khulafa-minhaj-1434 p. 776}."
  ur: "865 میں خلیفہ کی طرف سے سرکیسیئن سلطان کی سرمایہ کاری؛ اس نے خلیفہ کو جانم کے قریب جانے پر قلعہ تک محدود کر دیا اور اسے کبھی بھی اپنی رہائش گاہ میں واپس نہ آنے دیا۔ 776}۔"
  tr: "Bir Çerkes Memlük sultanı, altmış beşinci yılın Ramazan ayında el-Mueyyad Ahmed bin Jaqmaq'a saldırdı ve onu esir aldı. Halife onu hapse attı ve ona Al-Zahir unvanını verdi; o da yetmiş iki yılın baharında ölene kadar bu unvanı sürdürdü. İlk kez el-Şam'ın yardımcısı olarak orduya rıza gösterdi, halife, hakimler ve askerlerin kaleye gitmesini emretti, ancak ikametgahına dönemedi ve orada kaldı. {alıntı:Tarikh-khulafa-minhaj-1434, s. 776}."
  id: "Seorang sultan Mamluk Circassia yang menyerang al-Mu'ayyad Ahmad ibn Jaqmaq dan menangkapnya pada Ramadan tahun enam puluh lima. Khalifah memenjarakannya dan memberinya gelar Al-Zahir, yang ia pegang hingga wafat pada musim semi tahun tujuh puluh dua. Pertama kali ia diangkat adalah sebagai wakil al-Sham untuk menyetujui tentara, memerintahkan khalifah, hakim, dan prajurit untuk pergi ke benteng, tetapi ia tidak dapat kembali ke kediamannya, sehingga ia tetap di sana. {cite:Tarikh-khulafa-minhaj-1434, hlm. 776}."
