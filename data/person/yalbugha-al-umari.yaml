summary:
  ar: "الأمير يلبغا بن عبد الله العمري الخاصكي، مملوك الناصر حسن الذي ترقى حتى صار أمير مجلس ثم قاد الثورة على سيده وقتله سنة 762هـ/1361م. أقام الصبي المنصور محمد سلطاناً وصار أتابك العساكر ومدبر المملكة، ثم خلعه سنة 764هـ وأقام الأشرف شعبان، وبقي صاحب الأمر حتى قتله مماليكه في ربيع الآخر سنة 768هـ/ديسمبر 1366م. خرج من بيته اليلبغاوية الظاهر برقوق {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  en: "Amir Yalbugha ibn Abd Allah al-Umari al-Khassaki was a mamluk of al-Nasir Hasan who rose to be amir majlis and then led the revolt that killed his master in 762/1361. He installed the boy al-Mansur Muhammad, became atabek of the armies and manager of the realm, deposed him in 764 in favour of al-Ashraf Shaban, and stayed the real power until his own mamluks killed him in Rabi II 768/December 1366. Barquq came from his household, the Yalbughawiyya {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  ur: "امیر یلبغا بن عبد اللہ العمری الخاصکی الناصر حسن کے مملوک تھے جو ترقی کر کے امیر مجلس بنے اور پھر اپنے آقا کے خلاف بغاوت کی قیادت کی جس میں 762ھ/1361ء میں سلطان قتل ہوئے۔ انہوں نے نوعمر المنصور محمد کو تخت پر بٹھایا، خود اتابک العساکر اور مدبرِ مملکت بنے، 764ھ میں اسے معزول کر کے الاشرف شعبان کو سلطان بنایا، اور ربیع الآخر 768ھ/دسمبر 1366ء میں اپنے ہی مملوکوں کے ہاتھوں قتل ہونے تک اصل صاحبِ اختیار رہے۔ ظاہر برقوق انہی کے گھرانے یلبغاویہ سے اٹھے {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
