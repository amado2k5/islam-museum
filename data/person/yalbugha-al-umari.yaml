kids:
  ar: "يلبغا كان مملوكاً للسلطان حسن، ثم صار أقوى رجل في مصر لسنوات قبل أن يسقط هو أيضاً."
  en: "Yalbugha began as a slave-soldier of Sultan Hasan and became the most powerful man in Egypt for a few years before he fell too."
  ur: "یلبغا سلطان حسن کا غلام سپاہی تھا اور چند برس مصر کا سب سے طاقتور آدمی بنا، پھر وہ خود بھی گر گیا۔"
