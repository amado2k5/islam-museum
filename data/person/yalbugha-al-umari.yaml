summary:
  ar: "الأمير يلبغا بن عبد الله العمري الخاصكي، مملوك الناصر حسن الذي ترقى حتى صار أمير مجلس ثم قاد الثورة على سيده وقتله سنة 762هـ/1361م. أقام الصبي المنصور محمد سلطاناً وصار أتابك العساكر ومدبر المملكة، ثم خلعه سنة 764هـ وأقام الأشرف شعبان، وبقي صاحب الأمر حتى قتله مماليكه في ربيع الآخر سنة 768هـ/ديسمبر 1366م. خرج من بيته اليلبغاوية الظاهر برقوق {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  en: "Amir Yalbugha ibn Abd Allah al-Umari al-Khassaki was a mamluk of al-Nasir Hasan who rose to be amir majlis and then led the revolt that killed his master in 762/1361. He installed the boy al-Mansur Muhammad, became atabek of the armies and manager of the realm, deposed him in 764 in favour of al-Ashraf Shaban, and stayed the real power until his own mamluks killed him in Rabi II 768/December 1366. Barquq came from his household, the Yalbughawiyya {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  ur: "امیر یلبغا بن عبد اللہ العمری الخاصکی الناصر حسن کے مملوک تھے جو ترقی کر کے امیر مجلس بنے اور پھر اپنے آقا کے خلاف بغاوت کی قیادت کی جس میں 762ھ/1361ء میں سلطان قتل ہوئے۔ انہوں نے نوعمر المنصور محمد کو تخت پر بٹھایا، خود اتابک العساکر اور مدبرِ مملکت بنے، 764ھ میں اسے معزول کر کے الاشرف شعبان کو سلطان بنایا، اور ربیع الآخر 768ھ/دسمبر 1366ء میں اپنے ہی مملوکوں کے ہاتھوں قتل ہونے تک اصل صاحبِ اختیار رہے۔ ظاہر برقوق انہی کے گھرانے یلبغاویہ سے اٹھے {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  es: "Amir Yalbugha ibn Abd Allah al-Umari al-Khassaki fue un mameluco de al-Nasir Hasan que ascendió a amir majlis y luego lideró la revuelta que mató a su señor en 762/1361. Instaló al joven al-Mansur Muhammad, se convirtió en atabek de los ejércitos y administrador del reino, lo depuso en 764 en favor de al-Ashraf Shaban, y mantuvo el poder real hasta que sus propios mamelucos lo mataron en Rabi II 768/diciembre de 1366. Barquq provenía de su casa, la Yalbughawiyya {cite:encyclopaedia-of-islam-2 vol. 6 p. 343} {cite:nujum-zahira 11/3-6}."
  fr: "Amir Yalbugha ibn Abd Allah al-Umari al-Khassaki était un mamelouk d'al-Nasir Hasan qui accéda au titre d'émir du Majlis, puis mena la révolte qui coûta la vie à son maître en 762/1361. Il installa le jeune al-Mansur Muhammad, devint atabek des armées et administrateur du royaume, le déposa en 764 au profit d'al-Ashraf Shaban, et conserva le pouvoir réel jusqu'à ce que ses propres mamelouks le tuent en Rabi II 768/décembre 1366. Barquq était issu de sa famille, la Yalbughawiyya."
  tr: "Konsey prensi olan Prens Yilbagha bin Abdullah al-Umari al-Khasaki, Memlük el-Nasir Hasan, ardından efendisine karşı bir isyan başlattı ve 762 Hicri / 1361 yılında onu öldürdü. Genç adam Muhammed bir sultan kurdu, askerlerin atabegi ve krallığın hükümdarı oldu, ardından 764 Hicri'de onu tahttan indirdi ve el-Eşref Şa'ban'ı kurdu. Memlükleri onu Rabi'al-Thani'de 768 Hicri / Aralık 1366'da öldürene kadar iktidarda kaldı. Evini görünüşte Yalbughawiya olarak terk etti {cite:encyclopaedia-of-Islam-2 cilt 6 s. 343} {cite:Nujum-zahira 11/3-6}."
  id: "Pangeran Yilbagha bin Abdullah al-Umari al-Khasaki, Mamluk al-Nasir Hasan, yang naik menjadi pangeran dewan, kemudian memimpin pemberontakan melawan tuannya dan membunuhnya pada 762 H / 1361 M. Pemuda Muhammad mendirikan seorang sultan, menjadi atabeg para tentara dan penguasa kerajaan, kemudian menggulingkannya pada 764 H dan mendirikan al-Ashraf Sha'ban. Dia tetap berkuasa sampai mamluknya membunuhnya pada Rabi' al-Thani 768 H / Desember 1366 M. Dia meninggalkan rumahnya sebagai Yalbughawiya yang tampaknya {cite:encyclopaedia-of-Islam-2 vol. 6 hlm. 343} {cite:Nujum-zahira 11/3-6}."
