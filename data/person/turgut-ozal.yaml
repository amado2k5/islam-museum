summary:
  ar: "سياسي ومهندس تركي، الرئيس الثامن لجمهورية تركيا من 1989 حتى وفاته في المنصب سنة 1993، ورئيس وزرائها من 1983 إلى 1989 مؤسسا لحزب الوطن الأم. قاد تحول الاقتصاد التركي نحو التحرير والانفتاح، وعُرف بدفاعه عن توافق الإسلام مع الديمقراطية والحداثة."
  en: "Turkish politician and engineer, the eighth president of Turkey from 1989 until his death in office in 1993, and prime minister from 1983 to 1989 as founder of the Motherland Party. He led the liberalisation and opening of the Turkish economy, and was known for arguing that Islam is compatible with democracy and modernity."
  ur: "ترک سیاست دان اور انجینئر، 1989 سے 1993 میں عہدے پر وفات تک ترکی کے آٹھویں صدر، اور مدر لینڈ پارٹی کے بانی کی حیثیت سے 1983 سے 1989 تک وزیر اعظم رہے۔ انہوں نے ترک معیشت کو آزاد اور کھلا بنانے کی قیادت کی، اور اسلام کو جمہوریت و جدت کے ہم آہنگ قرار دینے کے لیے معروف تھے۔"
