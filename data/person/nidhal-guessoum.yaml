summary:
  ar: "فيزيائي فلكي جزائري أمريكي، وُلد سنة 1960، أستاذ بالجامعة الأمريكية بالشارقة. أجرى بحوثًا في فيزياء أشعة غاما مع ناسا ومرصد INTEGRAL، وهو من أبرز الكتّاب في الإسلام والعلم الحديث، ومن كتبه «سؤال الإسلام الكمومي»."
  en: "Algerian-American astrophysicist, born in 1960, professor at the American University of Sharjah. He conducted gamma-ray astrophysics research with NASA and the INTEGRAL observatory and is a leading writer on Islam and modern science, author of Islam’s Quantum Question."
  ur: "الجزائری نژاد امریکی ماہرِ طبیعیاتِ فلکیات، 1960 میں پیدا ہوئے، امریکن یونیورسٹی شارجہ کے پروفیسر۔ انہوں نے ناسا اور رصد گاہ INTEGRAL کے ساتھ گاما شعاعی فلکیات کی تحقیق کی اور اسلام و جدید سائنس پر ممتاز مصنف ہیں؛ کتاب «اسلام’ز کوانٹم سوال» کے مولف۔"
  es: "Astrofísico argelino-estadounidense, nacido en 1960, profesor de la Universidad Americana de Sharjah. Realizó investigaciones de astrofísica de rayos gamma con la NASA y el observatorio INTEGRAL, y es un destacado escritor sobre el islam y la ciencia moderna, autor de \"La cuestión cuántica del islam\"."
  fr: "Astrophysicien algéro-américain, né en 1960, professeur à l'Université américaine de Sharjah. Il a mené des recherches en astrophysique des rayons gamma avec la NASA et l'observatoire INTEGRAL et est un auteur de référence sur l'islam et la science moderne, notamment de *La question quantique de l'islam*."
  tr: "1960 doğumlu Cezayir-Amerikalı astrofizikçi, Sharjah Amerikan Üniversitesi'nde profesördür. NASA ve INTEGRAL Gözlemevi ile gama ışını fiziği üzerine araştırmalar yapmış, İslam ve modern bilimin en önde gelen yazarlarından biridir ve kitaplarından biri 'İslam'ın Kuantum Sorusu'dur."
  id: "Seorang astrofisikawan Aljazair-Amerika, lahir tahun 1960, profesor di American University of Sharjah. Ia melakukan penelitian fisika sinar gamma bersama NASA dan INTEGRAL Observatory, merupakan salah satu penulis paling terkemuka dalam Islam dan ilmu pengetahuan modern, dan salah satu bukunya berjudul 'The Quantum Question of Islam.'"
