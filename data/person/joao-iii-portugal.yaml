summary:
  ar: "ملك البرتغال في عهد خير الدين بربروسة. حين بلغه وصول الأسطول العثماني بقيادة خير الدين إلى الشمال الأفريقي في ٣ ربيع الأول ٩٤١هـ/١٣ سبتمبر ١٥٣٤م، بعث استفتاءً إلى وجهاء بلاده وأعيانها وأساقفتها يستشيرهم في الجلاء عن بعض مراكز الوجود البرتغالي في جنوب المغرب كآسفي وأزمور وسانتاكروز، فأجمع رأي رجال الدين تقريباً على النصح بالتخلي عنها وتحويل وسائل الدفاع إلى المراكز الشمالية خشية هجوم خير الدين على سبتة {cite:dawlat-uthmaniyya-salabi p. 219}."
  en: "King of Portugal in Khayr al-Din's day. On news of the Ottoman fleet's arrival off North Africa in 941/1534 he polled his nobles and bishops on abandoning Portugal's southern Moroccan footholds — Safi, Azemmour, Santa Cruz — and the clergy near-unanimously advised withdrawal, concentrating defence northward against a feared attack on Ceuta {cite:dawlat-uthmaniyya-salabi p. 219}."
