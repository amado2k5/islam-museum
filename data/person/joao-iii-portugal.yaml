summary:
  ar: "ملك البرتغال في عهد خير الدين بربروسة. حين بلغه وصول الأسطول العثماني بقيادة خير الدين إلى الشمال الأفريقي في ٣ ربيع الأول ٩٤١هـ/١٣ سبتمبر ١٥٣٤م، بعث استفتاءً إلى وجهاء بلاده وأعيانها وأساقفتها يستشيرهم في الجلاء عن بعض مراكز الوجود البرتغالي في جنوب المغرب كآسفي وأزمور وسانتاكروز، فأجمع رأي رجال الدين تقريباً على النصح بالتخلي عنها وتحويل وسائل الدفاع إلى المراكز الشمالية خشية هجوم خير الدين على سبتة {cite:dawlat-uthmaniyya-salabi p. 219}."
  en: "King of Portugal in Khayr al-Din's day. On news of the Ottoman fleet's arrival off North Africa in 941/1534 he polled his nobles and bishops on abandoning Portugal's southern Moroccan footholds — Safi, Azemmour, Santa Cruz — and the clergy near-unanimously advised withdrawal, concentrating defence northward against a feared attack on Ceuta {cite:dawlat-uthmaniyya-salabi p. 219}."
  es: "Rey de Portugal en tiempos de Khayr al-Din. Al enterarse de la llegada de la flota otomana a las costas del norte de África en 941/1534, consultó a sus nobles y obispos sobre el abandono de los enclaves portugueses en el sur de Marruecos —Safi, Azemmour, Santa Cruz— y el clero aconsejó casi unánimemente la retirada, concentrando la defensa hacia el norte ante un temido ataque a Ceuta {cite:dawlat-uthmaniyya-salabi p. 219}."
  fr: "Roi du Portugal à l'époque de Khayr al-Din. À la nouvelle de l'arrivée de la flotte ottomane au large de l'Afrique du Nord en 941/1534, il consulta ses nobles et ses évêques sur l'abandon des positions portugaises au sud du Maroc — Safi, Azemmour, Santa Cruz — et le clergé conseilla presque unanimement le retrait, concentrant la défense vers le nord contre une attaque redoutée sur Ceuta {cite:dawlat-uthmaniyya-salabi p. 219}."
  ur: "خیرالدین کے زمانے میں پرتگال کا بادشاہ۔ 941/1534 میں عثمانی بحری بیڑے کی شمالی افریقہ سے آمد کی خبر پر اس نے پرتگال کے جنوبی مراکش کے قدموں - صفی، ایزمور، سانتا کروز - کو ترک کرنے پر اپنے رئیسوں اور بشپوں سے رائے شماری کی اور پادریوں نے متفقہ طور پر انخلاء کا مشورہ دیا، جس سے ڈرتے ہوئے شمال کی طرف حملے کے خلاف توجہ مرکوز کی گئی۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 219}۔"
  tr: "Khair ad-Din Barbarossa döneminde Portekiz Kralı. Khair al-Awwal 941 Hicri / 13 Eylül 1534 M.S. tarihinde Khair al-Din komutasındaki Osmanlı filosunun Kuzey Afrika'ya geldiğini öğrendiğinde, ülkesinin seçkin ve önemli kişilerine, önde gelen kişilere ve piskoposlara Safi, Azemmour ve Santa Cruz gibi güney Fas'taki bazı Portekiz merkezlerinin tahliyesi için danışma kararnamesi gönderdi. Din adamları, Khair ad-Din'in Ceuta'ya saldırmasından korkarak bu merkezleri terk etmeyi ve savunma yöntemlerini kuzey merkezlerine kaydırmayı neredeyse oybirliğiyle kabul etti {cite:dawlat-uthmaniyya-salabi s. 219}."
  id: "Raja Portugal pada masa pemerintahan Khair ad-Din Barbarossa. Ketika ia mengetahui kedatangan armada Ottoman yang dipimpin Khair al-Din di Afrika Utara pada 3 Rabi' al-Awwal 941 H / 13 September 1534 M, ia mengirim dekrit kepada para tokoh, tokoh, dan uskup di negaranya, berkonsultasi dengan mereka tentang evakuasi beberapa pusat Portugis di Maroko selatan seperti Safi, Azemmour, dan Santa Cruz. Para rohaniwan hampir secara bulat setuju untuk meninggalkan mereka dan memindahkan metode pertahanan mereka ke pusat-pusat utara karena takut serangan Khair ad-Din ke Ceuta {cite:dawlat-uthmaniyya-salabi hlm. 219}."
