summary:
  ar: "أبو عروبة الباهلي البصري، قدم بغداد وحدّث بها عن سلم بن سليمان الضبي وغيره، روى عنه ابن مخلد وإسماعيل الصفار أحاديث مستقيمة؛ توفي سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "Abu 'Urwa al-Bahili of Basra, who came to Baghdad and transmitted there from Salam ibn Sulayman al-Dabbi; Ibn Makhlid and Isma'il al-Saffar heard sound hadiths from him. He died in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  es: "Abu 'Urwa al-Bahili de Basora, que vino a Bagdad y transmitió allí desde Salam ibn Sulayman al-Dabbi; Ibn Makhlid e Isma'il al-Saffar escucharon hadices sonoros de él. Murió en 259 {citar:muntazam-ibn-al-jawzi p. 106}."
  fr: "Abu 'Urwa al-Bahili de Bassorah, qui est venu à Bagdad et y est venu de Salam ibn Sulayman al-Dabbi; Ibn Makhlid et Isma'il al-Saffar ont entendu de lui de solides hadiths. Il mourut en 259 {cite: muntazam-ibn-al-jawzi p. 106}."
  ur: "بصرہ کا ابو عروہ الباہلی جو بغداد آیا اور وہاں سے سلام بن سلیمان الدبی سے نقل کیا؛ ابن مخلد اور اسماعیل الصفار نے ان سے صحیح احادیث سنیں۔ ان کی وفات 259 میں ہوئی۔ 106}۔"
  tr: "Ebu Aruba el-Bahili el-Basri Bağdat'a geldi ve orada Selam bin Süleyman el-Dabbi ve diğerlerinden rivayetle hadisler nakletti. İbn Mukhallad ve İsmail el-Saffar ondan sahih hadisler rivayet ettiler. 259 yılında vefat etti. {cite:muntazam-ibn-al-jawzi s. 106}"
  id: "Abu Aruba al-Bahili al-Basri datang ke Baghdad dan meriwayatkan hadits di sana atas otoritas Salam bin Sulayman al-Dabbi dan lainnya. Ibn Mukhallad dan Ismail al-Saffar meriwayatkan hadits sahih darinya. Beliau wafat pada tahun 259. {cite:muntazam-ibn-al-jawzi p. 106}."
