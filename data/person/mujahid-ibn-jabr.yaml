id: person/mujahid-ibn-jabr
class: person
label: { ar: "مجاهد بن جبر" }
summary:
  ar: "عند البلاذري: كان مقيماً برودس يقرئ الناس القرآن وكان معاوية يعاقب بين الناس فيها وكان ممن فتح أرواد وبها أقرأ تبيع بن امرأة كعب الأحبار القرآن ويُقال إنه أقرأه برودس. وعند المسعودي مولى قيس بن السائب المخزومي ويكنى أبا الحجاج توفي سنة ثلاث ومائة وهو ابن أربع وثمانين سنة {cite:muruj-al-dhahab p. 191} ويذكر الكتاب أنه قدم على سليمان بن عبد الملك ثم على عمر بن عبد العزيز، وشهد وفاته، وأن عمر قال له في مرضه إنه سُقي السم، وأمر بإعادة الدنانير التي دفعت ثمناً للسم إلى بيت المال. {cite:salabi-umayyad-state-2020 p.280}"
  en: "In al-Baladhuri: resided at Rhodes teaching the people Qur'an — Mu'awiya rotating the settlers there — and was among Arwad's openers, where he taught Tubay' ibn imra'at Ka'b al-Ahbar the Qur'an, though it is said he taught it to him at Rhodes."
  es: "En al-Baladhuri: residía en Rodas enseñando el Corán a la gente —Mu'awiya rotaba a los colonos allí— y estuvo entre los fundadores de Arwad, donde enseñó el Corán a Tubay' ibn imra'at Ka'b al-Ahbar, aunque se dice que se lo enseñó en Rodas."
  fr: "Dans al-Baladhuri: résidait à Rhodes où il enseignait le Coran aux habitants — Mu'awiya faisant tourner les colons — et il était parmi les pionniers d'Arwad, où il enseigna le Coran à Tubay' ibn imra'at Ka'b al-Ahbar, bien qu'il soit dit qu'il le lui avait enseigné à Rhodes."
  ur: "البلادوری میں: رہوڈز میں مقیم لوگوں کو قرآن پڑھاتے تھے - معاویہ وہاں کے آباد کاروں کو گھماتے تھے - اور ارواد کے افتتاحیوں میں سے تھے، جہاں اس نے طوبیٰ ابن عمرات کعب الاحبار کو قرآن پڑھایا تھا، حالانکہ کہا جاتا ہے کہ اس نے اسے روڈس میں پڑھایا تھا۔"
  tr: "el-Baladhuri'ye göre: Rodus'ta yaşadı, burada insanlar Kur'an okuyordu ve Muaviye oradaki halk arasında cezalandırıldı. Tabi' bin 'İmre Ka'b el-Ahbar'ın Kur'an'ı okuduğu, Rubis'te okuduğuna da inanılan Arwad'ı fethedenlerden biriydi. El-Mes'udi'ye göre, Kays ibn al-Sa'ib al-Makhzumi'nin özgür adamı, lakaplı Ebu el-Haccu, 103 Hicri yılında seksen dört yaşında öldü {alıntı:Muruj-al-Dhahab, s. 191}. Kitapta, Süleyman bin Abdülmelik'i ve ardından Ömer bin Abdülaziz'i ziyaret ettiğini, ölümüne tanık olduğu ve Ömer'in hastalığı sırasında ona zehir verildiğini söylediği ve zehir için ödenen dinarların hazineye iadesini emrettiği belirtilir. {alıntı:Selabi-Umayyad-devlet-2020 s.280}"
  id: "Menurut al-Baladhuri: Ia tinggal di Rodus, tempat orang-orang membaca Al-Qur'an, dan Muawiyah dihukum di antara orang-orang di sana. Ia termasuk di antara mereka yang menaklukkan Arwad, di mana Tabi' ibn 'Imrah Ka'b al-Ahbar membacakan Al-Qur'an, dan dikatakan ia membacanya di Roudis. Menurut al-Mas'udi, mantan Qays ibn al-Sa'ib al-Makhzumi, yang dijuluki Abu al-Hajjaj, meninggal pada tahun 103 H pada usia delapan puluh empat tahun {cite::Muruj-al-Dhahab, hlm. 191}. Buku tersebut menyebutkan bahwa ia mengunjungi Sulayman ibn Abd al-Malik dan kemudian Umar ibn Abd al-Aziz, menyaksikan kematiannya, dan bahwa Umar memberitahunya selama sakit bahwa ia telah diberi racun dan memerintahkan pengembalian dinar yang dibayar untuk racun tersebut ke kas negara. {Sitasi: Salabi-Umayyad-State-2020 hlm.280}"
