id: person/mujahid-ibn-jabr
class: person
label: { ar: "مجاهد بن جبر" }
summary:
  ar: "عند البلاذري: كان مقيماً برودس يقرئ الناس القرآن وكان معاوية يعاقب بين الناس فيها وكان ممن فتح أرواد وبها أقرأ تبيع بن امرأة كعب الأحبار القرآن ويُقال إنه أقرأه برودس. وعند المسعودي مولى قيس بن السائب المخزومي ويكنى أبا الحجاج توفي سنة ثلاث ومائة وهو ابن أربع وثمانين سنة {cite:muruj-al-dhahab p. 191} ويذكر الكتاب أنه قدم على سليمان بن عبد الملك ثم على عمر بن عبد العزيز، وشهد وفاته، وأن عمر قال له في مرضه إنه سُقي السم، وأمر بإعادة الدنانير التي دفعت ثمناً للسم إلى بيت المال. {cite:salabi-umayyad-state-2020 p.280}"
  en: "In al-Baladhuri: resided at Rhodes teaching the people Qur'an — Mu'awiya rotating the settlers there — and was among Arwad's openers, where he taught Tubay' ibn imra'at Ka'b al-Ahbar the Qur'an, though it is said he taught it to him at Rhodes."
