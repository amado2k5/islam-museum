summary:
  ar: "رجل دولة باكستاني (1894–1964) من نواب دكا، ثاني حاكم عام لباكستان (1948–1951) وثاني رئيس وزرائها (1951–1953). كان رئيس وزراء البنغال (1943–1945) ثم أول رئيس وزراء لباكستان الشرقية، وخلف محمد علي جناح في الحاكمية العامة ولياقت علي خان في رئاسة الوزراء وأبا القاسم فضل الحق في رئاسة وزراء البنغال، ودُفن في ضريح القادة الثلاثة في دكا."
  en: "Pakistani statesman (1894–1964) of the Nawabs of Dhaka, Pakistan's second governor-general (1948–1951) and second prime minister (1951–1953). He had been prime minister of Bengal (1943–1945) and then the first chief minister of East Bengal; he succeeded Muhammad Ali Jinnah as governor-general, Liaquat Ali Khan as prime minister and A. K. Fazlul Huq as prime minister of Bengal, and was buried in the Mausoleum of Three Leaders at Dhaka."
  ur: "پاکستانی مدبر (1894ء–1964ء) جن کا تعلق ڈھاکہ کے نواب خاندان سے تھا، پاکستان کے دوسرے گورنر جنرل (1948ء–1951ء) اور دوسرے وزیر اعظم (1951ء–1953ء)۔ بنگال کے وزیر اعظم (1943ء–1945ء) اور پھر مشرقی بنگال کے پہلے وزیر اعلیٰ رہے؛ محمد علی جناح کے بعد گورنر جنرل، لیاقت علی خان کے بعد وزیر اعظم اور ابو القاسم فضل الحق کے بعد بنگال کے وزیر اعظم بنے، اور ڈھاکہ میں تین قائدین کے مزار میں دفن ہوئے۔"
