label: { ar: "سماك بن عبيد العبسي", en: "Simak ibn Ubayd al-Absi", es: "Simak ibn Ubayd al-Absi", fr: "Simak ibn Ubayd al-Absi", ur: "سماک بن عبید العبسی" }
summary:
  ar: "عند البلاذري أتبع يوم نهاوند رجلاً من الفرس ومعه ثمانية فرسان فجعل لا يبرز إليه رجل منهم إلا قتله حتى لم يبق غير الرجل وحده فاستسأم وألقى سلاحه فأخذه أسيراً فإذا هو دينار صاحب صلح نهاوند فكان يأتيه بعد ذلك ويهدي ويبره."
  en: "In al-Baladhuri, at Nihawand he chased a Persian and his eight riders, killing each as he turned until the man alone sued for quarter — the captive proved to be Dinar of Nihawand's treaty, who thereafter visited Simak with gifts."
  es: "En al-Baladhuri, en Nihawand, persiguió a un persa y a sus ocho jinetes, matándolos a cada uno a su paso hasta que solo el hombre pidió clemencia. El cautivo resultó ser Dinar, el aliado del tratado de Nihawand, quien posteriormente visitó a Simak con regalos."
  fr: "À al-Baladhuri, à Nihawand, il poursuivit un Perse et ses huit cavaliers, les tuant un à un sur son passage jusqu'à ce que seul l'homme implore grâce — le captif s'avéra être Dinar du traité de Nihawand, qui rendit ensuite visite à Simak avec des présents."
  ur: "البلادھوری میں، نہاوند کے مقام پر اس نے ایک فارسی اور اس کے آٹھ سواروں کا پیچھا کیا، ہر ایک کو موت کے گھاٹ اتار دیا، یہاں تک کہ اکیلے آدمی نے چوتھائی کے لیے مقدمہ کر دیا - اسیر نہاوند کے معاہدے کا دینار ثابت ہوا، جو اس کے بعد تحائف کے ساتھ سمک گیا تھا۔"
