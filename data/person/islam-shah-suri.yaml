summary:
  ar: "ثاني سلاطين الأسرة السورية في الهند ⁦(حكم 1545–1554)⁩، وُلد جلال خان، وهو الابن الثاني لشير شاه سوري. عند موت أبيه اختاره مجلس طارئ من النبلاء خليفةً على أخيه الأكبر عادل خان لقدرته العسكرية، فتُوّج في 26 أيار 1545 وتلقّب بإسلام شاه ⁦(ويعرف أيضًا بسليم شاه)⁩. هزم جيوش أخيه قرب أغرا، وطهّر البلاط من النبلاء المشكوك فيهم وأخضع الأرستقراطية للتاج، وواصل مركزية أبيه الإدارية، وصدّ محاولة همايون الوحيدة لغزو دولته. مات في 22 تشرين الثاني 1554 فخلفه ابنه الطفل فيروز شاه الذي قُتل بعد أيام."
  en: "Second Suri sultan of Delhi (r. 1545-1554), born Jalal Khan, the second son of Sher Shah Suri. On his father's death an emergency meeting of the nobles chose him over his elder brother Adil Khan for his greater military ability; he was crowned on 26 May 1545 and took the title Islam Shah (he is also known as Salim Shah). He defeated Adil Khan's army near Agra, purged suspect nobles and subordinated the aristocracy to the crown, continued his father's administrative centralisation, and repelled Humayun's single attempt on his kingdom. He died on 22 November 1554; his twelve-year-old son Firuz Shah succeeded him and was murdered within days."
  ur: "دہلی کے دوسرے سوری سلطان ⁦(دورِ حکومت 1545ء–1554ء)⁩، پیدائشی نام جلال خان، شیر شاہ سوری کے دوسرے صاحبزادے۔ والد کی وفات پر امراء کے ہنگامی اجلاس نے بڑے بھائی عادل خان کے مقابلے میں ان کی عسکری اہلیت دیکھ کر انھیں جانشین منتخب کیا؛ 26 مئی 1545ء کو تاج پوشی ہوئی اور «اسلام شاہ» کا لقب اختیار کیا ⁦(سلیم شاہ بھی کہلاتے ہیں)⁩۔ آگرہ کے قریب عادل خان کو شکست دی، مشکوک امراء کا صفایا کیا اور اپنے والد کے انتظامی نظام کو مزید مرکزی بنایا۔ 22 نومبر 1554ء کو وفات پائی؛ ان کے بارہ سالہ بیٹے فیروز شاہ کو چند دن بعد قتل کر دیا گیا۔"
  es: "Segundo sultán Suri de Delhi (r. 1545-1554), nacido Jalal Khan, segundo hijo de Sher Shah Suri. Tras la muerte de su padre, una reunión de emergencia de la nobleza lo eligió por encima de su hermano mayor, Adil Khan, debido a su mayor habilidad militar. Fue coronado el 26 de mayo de 1545 y adoptó el título de Islam Shah (también conocido como Salim Shah). Derrotó al ejército de Adil Khan cerca de Agra, purgó a los nobles sospechosos y subordinaba a la aristocracia a la corona, continuó la centralización administrativa iniciada por su padre y repelió el único intento de Humayun contra su reino. Murió el 22 de noviembre de 1554; su hijo Firuz Shah, de doce años, lo sucedió y fue asesinado a los pocos días."
  fr: "Deuxième sultan Suri de Delhi (r. 1545-1554), né Jalal Khan, second fils de Sher Shah Suri. À la mort de son père, une assemblée extraordinaire de nobles le choisit de préférence à son frère aîné, Adil Khan, en raison de ses plus grandes aptitudes militaires. Couronné le 26 mai 1545, il prit le titre d'Islam Shah (également connu sous le nom de Salim Shah). Il vainquit l'armée d'Adil Khan près d'Agra, purgea les nobles suspects et soumit l'aristocratie à la couronne, poursuivit la centralisation administrative entreprise par son père et repoussa la seule tentative d'Humayun contre son royaume. Il mourut le 22 novembre 1554; son fils Firuz Shah, âgé de douze ans, lui succéda et fut assassiné quelques jours plus tard."
  tr: "Hindistan'daki Suriye hanedanının ikinci sultanı olan Celal Han (1544–1554 yılları arasında hüküm sürdü), Şir Şah Suri'nin ikinci oğlu olarak doğdu ve onun ikinci oğluydu. Babası öldükten sonra, acil bir soylular konseyi, askeri yeteneği nedeniyle onu ağabeyi Adil Han'ın yerine halef olarak seçti ve 26 Mayıs 1545'te taç giydi; İslam Şah (Salim Şah olarak da bilinir) unvanını aldı. Kardeşinin ordularını Agra yakınlarında yendi, sarayı şüpheli soylulardan temizledi, aristokrasiyi tahta tabi etti, babasının idari merkezileşmesini sürdürdü ve Humayun'un devletine saldırma girişimini püskürttü. 22 Kasım 1554'te öldü ve yerine çocuk oğlu Firuz Şah geçti, ancak birkaç gün sonra öldürüldü."
  id: "Sultan kedua dinasti Suriah di India (memerintah 1544–1554), Jalal Khan lahir dan merupakan putra kedua Shir Shah Suri. Setelah kematian ayahnya, dewan darurat bangsawan memilihnya sebagai penerus atas kakaknya Adil Khan karena kemampuan militernya, dan ia dinobatkan pada 26 Mei 1545 serta diberi gelar Islam Shah (juga dikenal sebagai Salim Shah). Ia mengalahkan pasukan saudaranya di dekat Agra, membersihkan istana dari bangsawan yang meragukan, menundukkan aristokrasi ke mahkota, mempertahankan sentralisasi administratif ayahnya, dan menangkis satu-satunya upaya Humayun untuk menyerang negaranya. Ia meninggal pada 22 November 1554, dan digantikan oleh putra kecilnya Firuz Shah, yang tewas beberapa hari kemudian."

