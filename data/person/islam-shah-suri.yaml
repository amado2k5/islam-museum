summary:
  ar: "ثاني سلاطين الأسرة السورية في الهند (حكم 1545–1554)، وُلد جلال خان، وهو الابن الثاني لشير شاه سوري. عند موت أبيه اختاره مجلس طارئ من النبلاء خليفةً على أخيه الأكبر عادل خان لقدرته العسكرية، فتُوّج في 26 أيار 1545 وتلقّب بإسلام شاه (ويعرف أيضًا بسليم شاه). هزم جيوش أخيه قرب أغرا، وطهّر البلاط من النبلاء المشكوك فيهم وأخضع الأرستقراطية للتاج، وواصل مركزية أبيه الإدارية، وصدّ محاولة همايون الوحيدة لغزو دولته. مات في 22 تشرين الثاني 1554 فخلفه ابنه الطفل فيروز شاه الذي قُتل بعد أيام."
  en: "Second Suri sultan of Delhi (r. 1545-1554), born Jalal Khan, the second son of Sher Shah Suri. On his father's death an emergency meeting of the nobles chose him over his elder brother Adil Khan for his greater military ability; he was crowned on 26 May 1545 and took the title Islam Shah (he is also known as Salim Shah). He defeated Adil Khan's army near Agra, purged suspect nobles and subordinated the aristocracy to the crown, continued his father's administrative centralisation, and repelled Humayun's single attempt on his kingdom. He died on 22 November 1554; his twelve-year-old son Firuz Shah succeeded him and was murdered within days."
  ur: "دہلی کے دوسرے سوری سلطان (دورِ حکومت 1545ء–1554ء)، پیدائشی نام جلال خان، شیر شاہ سوری کے دوسرے صاحبزادے۔ والد کی وفات پر امراء کے ہنگامی اجلاس نے بڑے بھائی عادل خان کے مقابلے میں ان کی عسکری اہلیت دیکھ کر انھیں جانشین منتخب کیا؛ 26 مئی 1545ء کو تاج پوشی ہوئی اور «اسلام شاہ» کا لقب اختیار کیا (سلیم شاہ بھی کہلاتے ہیں)۔ آگرہ کے قریب عادل خان کو شکست دی، مشکوک امراء کا صفایا کیا اور اپنے والد کے انتظامی نظام کو مزید مرکزی بنایا۔ 22 نومبر 1554ء کو وفات پائی؛ ان کے بارہ سالہ بیٹے فیروز شاہ کو چند دن بعد قتل کر دیا گیا۔"

