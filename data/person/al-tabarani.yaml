summary:
  ar: "أبو القاسم سليمان بن أحمد بن أيوب بن مطير اللخمي الطبراني، الحافظ مسند العصر ومسند الآفاق؛ أول سماعه سنة ثلاث وسبعين ومائتين بطبرية المنسوب إليها ثم رحل إلى القدس سنة أربع وسبعين وإلى قيسارية سنة خمس وسبعين فسمع من أصحاب الفريابي، ثم رحل إلى حمص وجبلة ومدائن الشام وحج ودخل اليمن ورد إلى مصر ثم رحل إلى العراق وأصبهان وفارس؛ وعدّ ابن خلكان شيوخه ألف شيخ، وله المعاجم الثلاثة الكبير والأوسط والصغير وهي أشهر كتبه، قال ابن ناصر الدين هو مسند الآفاق وكان يقول عن الأوسط: هو روحي لأنه تعب عليه؛ سكن أصبهان إلى أن توفي بها {cite:shadharat-dhahab p. 30}."
  en: "Abu'l-Qasim Sulayman b. Ahmad al-Lakhmi al-Tabarani (260–360), musnad of the age and of the horizons — author of the three Mu'jams; Ibn Khallikan counted a thousand shaykhs for him, and Ibn Nasir al-Din quotes him calling the Awsat 'my soul, for I toiled over it' {cite:shadharat-dhahab p. 30}."
