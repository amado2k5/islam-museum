class: person
label: { ar: "أم كرزان", en: "Umm Kurzan", es: "Umm Kurzan", fr: "Umm Kurzan", ur: "ام کرزان" }
summary:
  ar: "امرأة من بجيلة؛ عند البلاذري قالت لجرير حين ردّ قومها ربع السواد أبي هلك وسهمه ثابت في السواد وإني لن أسلم فقال لها قومك قد أجابوا فقالت ما أنا بمسلمة أو تحملني على ناقة ذلول عليها قطيفة حمراء وتملأ يديّ ذهباً ففعل ذلك."
  en: "A Bajila woman; in al-Baladhuri she told Jarir when her people returned the Sawad quarter 'my father died and his share is fixed in the Sawad — I will not submit', and when told her people had agreed, answered 'I will not submit unless you mount me on a docile she-camel with a red saddle-cloth and fill my hands with gold' — which was done."
  es: "Una mujer bajila; en al-Baladhuri le dijo a Jarir cuando su gente devolvió el barrio de Sawad: \"Mi padre murió y su parte está fijada en el Sawad; no me someteré\", y cuando le dijeron que su gente había aceptado, respondió: \"No me someteré a menos que me montes en una camella dócil con una manta roja y llenes mis manos de oro\", lo cual se hizo."
  fr: "Une femme Bajila; à al-Baladhuri, elle dit à Jarir lorsque son peuple retourna dans le quartier Sawad: « Mon père est mort et sa part est fixée dans le Sawad — je ne me soumettrai pas », et lorsqu'on lui dit que son peuple avait accepté, elle répondit: « Je ne me soumettrai pas à moins que vous ne me fassiez monter sur une chamelle docile avec une housse de selle rouge et que vous ne remplissiez mes mains d'or » — ce qui fut fait."
  ur: "ایک بجیلا عورت؛ البلاذری میں اس نے جریر سے کہا کہ جب اس کے لوگوں نے سواد کا سہ ماہی لوٹا تو 'میرے والد کا انتقال ہوگیا اور سواد میں ان کا حصہ مقرر ہے - میں تسلیم نہیں کروں گا'، اور جب اس کے لوگوں کو بتایا کہ اس پر راضی ہو گئے ہیں تو جواب دیا 'میں اس وقت تک تسلیم نہیں کروں گا جب تک کہ آپ مجھے سرخ زین والے کپڑے والی اونٹنی پر سوار نہ کریں اور میرے ہاتھ سونے سے بھرے'۔"
  tr: "Bajila'dan bir kadın; Al-Baladhuri'ye göre, Jarir'e şöyle dedi: Halkı siyah kadının dörtte birini geri döndüğünde, babam öldü ve payı siyah oldu, ben İslam'ı kabul etmeyeceğim. Sizin halkınız şöyle cevap verdi: 'Ben Müslüman bir kadın değilim, ne de beni kırmızı kadife kaplı ve ellerim altınla dolu bir dişi devede taşımıyorsun.' O da öyle yaptı."
  id: "Seorang wanita dari Bajila; menurut Al-Baladhuri, dia berkata kepada Jarir, ketika rakyatnya mengembalikan seperempat orang kulit hitam, ayahku meninggal dan bagiannya ditetapkan dalam hitam, dan aku tidak akan menerima Islam. Bangsamu menjawab, 'Aku bukan wanita Muslim, dan kamu tidak menggendongku dengan unta betina yang dilapisi beludru merah dan tanganku penuh emas.' Dia melakukannya."
