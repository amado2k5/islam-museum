summary:
  ar: "امرأة من بجيلة؛ عند البلاذري قالت لجرير حين ردّ قومها ربع السواد أبي هلك وسهمه ثابت في السواد وإني لن أسلم فقال لها قومك قد أجابوا فقالت ما أنا بمسلمة أو تحملني على ناقة ذلول عليها قطيفة حمراء وتملأ يديّ ذهباً ففعل ذلك."
  en: "A Bajila woman; in al-Baladhuri she told Jarir when her people returned the Sawad quarter 'my father died and his share is fixed in the Sawad — I will not submit', and when told her people had agreed, answered 'I will not submit unless you mount me on a docile she-camel with a red saddle-cloth and fill my hands with gold' — which was done."
