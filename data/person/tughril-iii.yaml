label: { ar: "السلطان طغرل الثالث بن أرسلان" , ur: "طغرل سوم", en: "Tughril III", es: "Tughril III", fr: "Tughril III"}
summary:
  ar: "السلطان طغرل بن أرسلان بن طغرل بن محمد بن ملكشاه بن ألب أرسلان السلجوقي، آخر سلاطين السلاجقة بالعراق والجبل؛ خرج من الحبس سنة ثمان وثمانين وخمسمائة فملك همذان وغيرها وحارب قتلغ اينانج بن البهلوان حتى استنجد بخوارزم شاه علاء الدين تكش، فلما قصده طغرل بالري سنة تسعين وعساكره متفرقة أبى أن يجمعها وحمل بنفسه في وسط عسكر خوارزم شاه فأحاطوا به وقتلوه في الرابع والعشرين من ربيع الأول وحمل رأسه إلى بغداد فنصب بباب النوبي عدة أيام {cite:kamil-ibn-al-athir p. 232-233}."
  ur: "سلجوقی سلطان جس کے اقتدار کو قزل ارسلان نے چیلنج کیا؛ عباسی لشکر سے لڑا اور بعد میں خوارزم شاہ سے کشمکش میں مارا گیا۔ {cite:kamil-ibn-al-athir}"
  en: "Seljuk sultan whose rule was contested by Qizil Arslan; he fought Abbasid forces and was later killed in conflict with Khwarazmshah. {cite:kamil-ibn-al-athir}"
  es: "Sultanato selyúcida cuyo gobierno fue disputado por Qizil Arslan; luchó contra las fuerzas abasíes y posteriormente murió en un conflicto con Khwarazmshah. {cite:kamil-ibn-al-athir}"
  fr: "Sultan seldjoukide dont le règne fut contesté par Qizil Arslan; il combattit les forces abbassides et fut tué plus tard lors d'un conflit avec Khwarezmshah. {cite:kamil-ibn-al-athir}"
  tr: "Sultan Tughril ibn Arslan ibn Muhammed ibn Malik Şah ibn Alp Arslan, Irak ve dağlardaki Selçuklu sultanı, 588 Hicri yılında hapisten çıktı, Hamadan'da ve başka yerlerde hüküm sürdü. Qutlagh İnang ibn al-Bahlwan ile savaştı, ta ki Harezm Şah Ala al-Din Takş'tan yardım isteyene kadar. 1990'da Tuğril Rayy'de ona yaklaştığında askerleri dağılmıştı, onları toplamayı reddetti ve Harezm Şah'ın kampları arasında yer aldı. Onu kuşattılar ve 24 Rabi el-Avval'de öldürdüler. Başını Bağdat'a taşıdı ve birkaç gün boyunca Bab al-Nubi'de görevlendirildi {cite:kamil-ibn-al-athir s. 232-233}."
  id: "Sultan Tughril ibn Arslan ibn Tughril ibn Muhammad ibn Malik Shah ibn Alp Arslan si Seljuk, sultan terakhir Seljuk di Irak dan pegunungan, dibebaskan dari penjara pada tahun 588 H, memerintah Hamadan, dan tempat lain. Ia bertempur melawan Qutlagh Inang ibn al-Bahlwan hingga ia meminta bantuan dari Khwarezm Shah Ala al-Din Taksh. Ketika Tughril mendekatinya di Rayy pada tahun 1990, pasukannya tercerai-berai, ia menolak mengumpulkan mereka dan membawa dirinya ke kamp Khwarezm Shah. Mereka mengepungnya dan membunuhnya pada tanggal 24 Rabi' al-Awwal. Ia membawa kepalanya ke Baghdad dan ditempatkan di Bab al-Nubi selama beberapa hari {cite:kamil-ibn-al-athir hlm. 232-233}."
