summary:
  ar: "السلطان طغرل بن أرسلان بن طغرل بن محمد بن ملكشاه بن ألب أرسلان السلجوقي، آخر سلاطين السلاجقة بالعراق والجبل؛ خرج من الحبس سنة ثمان وثمانين وخمسمائة فملك همذان وغيرها وحارب قتلغ اينانج بن البهلوان حتى استنجد بخوارزم شاه علاء الدين تكش، فلما قصده طغرل بالري سنة تسعين وعساكره متفرقة أبى أن يجمعها وحمل بنفسه في وسط عسكر خوارزم شاه فأحاطوا به وقتلوه في الرابع والعشرين من ربيع الأول وحمل رأسه إلى بغداد فنصب بباب النوبي عدة أيام {cite:kamil-ibn-al-athir p. 232-233}."
  ur: "سلجوقی سلطان جس کے اقتدار کو قزل ارسلان نے چیلنج کیا؛ عباسی لشکر سے لڑا اور بعد میں خوارزم شاہ سے کشمکش میں مارا گیا۔ {cite:kamil-ibn-al-athir}"
  en: "Seljuk sultan whose rule was contested by Qizil Arslan; he fought Abbasid forces and was later killed in conflict with Khwarazmshah. {cite:kamil-ibn-al-athir}"
