label: { ar: "الحسن بن قتادة أمير مكة" }
summary:
  ar: "ابن قتادة بن إدريس ملك مكة بعد أبيه سنة ثمان عشرة وستمائة، وقيل إنه خنق أباه لما بلغه أنه حلف ليقتلنه، وكتم موته وأظهر تابوتاً ليظن الناس أنه مات بطبعه ثم استدعى أخاه من قلعة ينبع على لسان أبيه فلما حضر قتله، وكان قد أمر بقتل عمه قبل ذلك فارتكب قتل أبيه وعمه وأخيه في أيام يسيرة، وقتل أمير الحاج أقباش مملوك الخليفة الناصر لما حاربه قرب مكة ثم أرسل عمامته أماناً للحجاج فلم ينهبهم أصحابه، فعظم الأمر على الخليفة واعتذر فعفي عنه، ويقول ابن الأثير لا جرم لم يمهله الله نزع ملكه وجعله طريداً شريداً خائفاً يترقب {cite:kamil-ibn-al-athir p. 426-427}."
