id: person/hasan-ibn-qatada
class: person
label: { ar: "الحسن بن قتادة أمير مكة" }
summary:
  ar: "ابن قتادة بن إدريس ملك مكة بعد أبيه سنة ثمان عشرة وستمائة، وقيل إنه خنق أباه لما بلغه أنه حلف ليقتلنه، وكتم موته وأظهر تابوتاً ليظن الناس أنه مات بطبعه ثم استدعى أخاه من قلعة ينبع على لسان أبيه فلما حضر قتله، وكان قد أمر بقتل عمه قبل ذلك فارتكب قتل أبيه وعمه وأخيه في أيام يسيرة، وقتل أمير الحاج أقباش مملوك الخليفة الناصر لما حاربه قرب مكة ثم أرسل عمامته أماناً للحجاج فلم ينهبهم أصحابه، فعظم الأمر على الخليفة واعتذر فعفي عنه، ويقول ابن الأثير لا جرم لم يمهله الله نزع ملكه وجعله طريداً شريداً خائفاً يترقب {cite:kamil-ibn-al-athir p. 426-427}."
  tr: "İbn Katadah ibn İdris, babasından sonra on altıncı hicri yılında Mekke kralıydı. Babasının onu öldüreceğine yemin ettiğini duyunca onu boğduğu söylenir. Ölümünü gizlemiş ve insanların doğal sebepten öldüğünü düşünmesi için bir tabut göstermiştir. Sonra babası adına kardeşini Yanbu kalesinden çağırmıştır ve geldiğinde öldürülmüştür. Daha önce amcasının öldürülmesini emretmişti, ancak babasını, amcası ve kardeşini içeride öldürmüştür Birkaç gün. Hacı Ekbaşı'nın emiri Memlük Halifesi el-Nasir'i Mekke yakınlarında savaşırken öldürdü, ardından hacılar için sarıklığını gönderdi, fakat yoldaşları onları yağmaladı. Halife için durum çok büyüdü, o da kendini affedip onu affetti. İbn el-Athir şöyle der: Tanrı'nın ona krallığını geri alıp sürgün edilmiş, korkak ve tetikte bir dışlanmış yapması için bir af vermediği hiçbir suç yoktur {alıntı: Kamil-ibn-al-Athir s. 426-427}."
  id: "Ibn Qatadah ibn Idris adalah raja Mekah setelah ayahnya pada tahun enam belas H. Konon ia mencekik ayahnya ketika mendengar bahwa ia telah bersumpah akan membunuhnya. Ia menyembunyikan kematiannya dan menunjukkan peti mati agar orang-orang mengira ia meninggal karena sebab alami. Ia kemudian memanggil saudaranya dari benteng Yanbu atas nama ayahnya, dan ketika ia tiba, ia dibunuh. Ia sebelumnya telah memerintahkan pembunuhan pamannya, tetapi ia juga membunuh ayah, pamannya, dan saudaranya dalam beberapa hari. Ia membunuh emir Haji Aqbash Khalifah Mamluk al-Nasir saat bertarung dengannya di dekat Mekah, lalu mengirimkan sorbannya sebagai tempat aman bagi para peziarah, tetapi para sahabatnya tidak menjarah mereka. Masalah itu menjadi terlalu besar bagi khalifah, yang kemudian meminta izin dan mengampuninya. Ibn al-Athir berkata: Tidak ada dosa Tuhan tidak memberinya waktu untuk mencabut kerajaannya dan menjadikannya buangan yang diusir, ketakutan, dan waspada {cite:\" Kamil-ibn-al-Athir hlm. 426-427}."
