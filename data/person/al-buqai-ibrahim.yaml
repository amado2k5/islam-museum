  ar: "برهان الدين البقاعي المؤرخ؛ روى من خطه أن في ليلة الأحد تاسع شعبان سنة إحدى وعشرين وثمانمائة أوقع ناس من قريتهم بأقاربه بني حسن فقتلوا تسعة أنفس منهم وضُرب هو بالسيف ثلاث ضربات إحداها في رأسه جرحته وكان إذ ذاك ابن اثنتي عشرة سنة فخرج أهله من القرية فتنقلوا في قرى وادي التيم والعرقوب إلى أن نُقل إلى القاهرة {cite:shadharat-dhahab p. 157}."
