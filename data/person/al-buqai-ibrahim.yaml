summary:
  ar: "برهان الدين البقاعي المؤرخ؛ روى من خطه أن في ليلة الأحد تاسع شعبان سنة إحدى وعشرين وثمانمائة أوقع ناس من قريتهم بأقاربه بني حسن فقتلوا تسعة أنفس منهم وضُرب هو بالسيف ثلاث ضربات إحداها في رأسه جرحته وكان إذ ذاك ابن اثنتي عشرة سنة فخرج أهله من القرية فتنقلوا في قرى وادي التيم والعرقوب إلى أن نُقل إلى القاهرة {cite:shadharat-dhahab p. 157}."
  en: "Burhan al-Din al-Buqa'i the chronicler — wounded at twelve (Sha'ban 821) when a clan raid on his Baq'a village killed nine of his kin, three sword-blows including a head-wound; the family then wandered Wadi al-Taym and the 'Arqub until Cairo raised him {cite:shadharat-dhahab p. 157}."
  fr: "Burhan al-Din al-Buqa’i, chroniqueur — blessé à douze ans (sha’ban 821 H) quand un raid de clan dans son village de Baq’a tua neuf de ses proches ; il reçut trois coups d’épée, dont un à la tête. Sa famille erra ensuite dans le Wadi al-Taym et l’Arqub avant qu’il ne soit élevé au Caire {cite:shadharat-dhahab p. 157}."
  es: "Burhan al-Din al-Buqa'i, el cronista, resultó herido a los doce años (Sha'ban 821) cuando una incursión de su clan en su aldea de Baq'a mató a nueve de sus parientes, tres de ellos por espada, incluyendo una herida en la cabeza; la familia luego vagó por Wadi al-Taym y el 'Arqub hasta que El Cairo lo rescató {cita: shadharat-dhahab p. 157}."
  ur: "برہان الدین البقائی تاریخ ساز - بارہ ⁦(شعبان 821)⁩ کو زخمی ہوا جب اس کے بقع گاؤں پر ایک قبیلے کے حملے میں اس کے نو رشتہ دار ہلاک، سر پر زخم سمیت تین تلواروں کے وار ہوئے۔ اس کے بعد یہ خاندان وادی التیم اور عرقوب میں گھومتا رہا یہاں تک کہ قاہرہ نے اس کی پرورش کی۔ 157}۔"
  tr: "Tarihçi Burhan el-Din el-Bikaî, kendi el yazısından rivayet ettiğine göre, 821 yılında Şaban ayının dokuzuncu Pazar gecesi, köylerinden insanlar akrabaları olan Beni Hasan'a saldırmış ve dokuzunu öldürmüşlerdir. Kendisine üç kez kılıç darbesi indirilmiş, bunlardan biri başına isabet ederek onu yaralamıştır. O sırada on iki yaşındaydı. Ailesi köyü terk ederek Vadi el-Taym ve el-Arkub köylerinde dolaştıktan sonra Kahire'ye götürülmüştür. {kaynak: Şadharat-Dhaba s. 157}"
  id: "Burhan al-Din al-Biqa’i, sejarawan, meriwayatkan dari tulisan tangannya bahwa pada malam Minggu, tanggal sembilan Sya'ban, tahun delapan ratus dua puluh satu, orang-orang dari desa mereka menyerang kerabatnya, Bani Hasan, dan membunuh sembilan orang dari mereka. Ia ditikam dengan pedang tiga kali, salah satunya di kepala, melukainya. Saat itu ia berusia dua belas tahun. Keluarganya meninggalkan desa dan berpindah-pindah di desa-desa Wadi al-Taym dan al-Arqoub hingga ia dibawa ke Kairo. {cite:shadharat-dhahab p. 157}"
