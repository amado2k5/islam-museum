summary:
  ar: محمد بن عبد الله بن المثنى الأنصاري الخزرجي البصري، أبو عبد الله، من نسل أنس بن مالك، محدث وقاضي البصرة في زمن الرشيد ثم قاضي الجانب الشرقي من بغداد؛ وثقه ابن معين وأبو حاتم وتكلم النقاد في غلبة الرأي عليه، وتوفي في رجب سنة ٢١٥هـ.
  en: Muhammad ibn Abd Allah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Abu Abd Allah, a descendant of Anas ibn Malik, hadith narrator and judge of Basra under al-Rashid and later of the eastern side of Baghdad; Ibn Ma'in and Abu Hatim held him reliable while other critics remarked that opinion prevailed in him, and he died in Rajab 215 AH.
