gender: male
summary:
  ar: محمد بن عبد الله بن المثنى الأنصاري الخزرجي البصري، أبو عبد الله، من نسل أنس بن مالك، محدث وقاضي البصرة في زمن الرشيد ثم قاضي الجانب الشرقي من بغداد؛ وثقه ابن معين وأبو حاتم وتكلم النقاد في غلبة الرأي عليه، وتوفي في رجب سنة ٢١٥هـ.
  en: Muhammad ibn Abd Allah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Abu Abd Allah, a descendant of Anas ibn Malik, hadith narrator and judge of Basra under al-Rashid and later of the eastern side of Baghdad; Ibn Ma'in and Abu Hatim held him reliable while other critics remarked that opinion prevailed in him, and he died in Rajab 215 AH.
  es: "Muhammad ibn Abd Allah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Abu Abd Allah, descendiente de Anas ibn Malik, narrador de hadices y juez de Basora bajo al-Rashid y posteriormente del lado oriental de Bagdad; Ibn Ma'in y Abu Hatim lo consideraron fiable, mientras que otros críticos señalaron que la opinión prevalecía en él, y murió en Rajab 215 AH."
  fr: "Muhammad ibn Abd Allah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Abu Abd Allah, descendant d'Anas ibn Malik, narrateur de hadiths et juge de Bassora sous al-Rashid et plus tard du côté oriental de Bagdad; Ibn Ma'in et Abu Hatim le considéraient comme fiable tandis que d'autres critiques remarquaient que l'opinion prévalait en lui, et il mourut en Rajab 215 AH."
  ur: "محمد بن عبد اللہ بن المثنیۃ الانصاری الخزرجی البصری، ابو عبد اللہ، انس بن مالک کی اولاد، حدیث کے راوی اور بصرہ کے قاضی الرشید کے ماتحت اور بعد میں بغداد کے مشرقی حصے کے؛ ابن معین اور ابو حاتم نے اسے قابل اعتماد قرار دیا جبکہ دوسرے ناقدین نے کہا کہ ان کے بارے میں یہی رائے غالب تھی اور آپ کی وفات رجب 215 ہجری میں ہوئی۔"
  tr: "Muhammed ibn Abdullah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Ebu Abdullah, el-Reşid'in zamanında Basra'nın hadis âlimi ve yargıcı olan Anas ibn Malik'in soyundan geliyordu; o dönemde Bağdat'ın doğu tarafının hakimiydi; İbn Ma'in ve Ebu Hatim tarafından güvenildi ve eleştirmenler ona karşı görüşlerin baskınlığını tartıştı. 215 Hicri yılının Recep'inde öldü."
  id: "Muhammad ibn Abdullah ibn al-Muthanna al-Ansari al-Khazraji al-Basri, Abu Abdullah, adalah keturunan Anas ibn Malik, seorang ulama hadis dan hakim Basra pada masa al-Rashid, yang saat itu menjadi hakim di sisi timur Baghdad; ia dipercaya oleh Ibn Ma'in dan Abu Hatim, dan para kritikus memperdebatkan dominasi pendapat yang menentangnya. Ia meninggal di Rajab pada tahun 215 H."
