summary:
  ar: "المولى إدريس بن حسام الدين العجمي ثم الرومي الحنفي؛ قال في الشقائق: كان موظفاً لديوان أمراء العجم، ولما حدثت فتنة ابن أردويل ارتحل إلى الروم فأكرمه السلطان أبو يزيد غاية الإكرام وعيّن له مشاهرة ومساعدة وعاش في كنف حمايته عيشة راضية، وأمره أن ينشئ تواريخ آل عثمان بالفارسية فصنّفها، وكان عديم النظير فاقد القرين بحيث أنسى الأقدمين ولم يبلغ إنشاءه أحد من المتأخرين، وله قصائد بالعربية والفارسية تفوت الحصر ورسائل عجيبة في مطالب متفرقة، وبالجملة كان من نوادر الدهر ومفردات العصر؛ توفي في نحو سنة خمس وعشرين وتسعمائة {cite:shadharat-dhahab p. 546}."
  en: "The Persian panegyrist-secretary of the 'Ajami amirs' diwan who fled Ardabil's fitna to Rum — Bayezid showered him with honours and commissioned him to compose the history of the House of 'Uthman in Persian; 'without peer, bereft of rival, his prose outreaching every latecomer'; d. about 925 {cite:shadharat-dhahab p. 546}."
  es: "El panegirista-secretario persa del diwan de los 'amires Ajami' que huyó de la fitna de Ardabil a Rum — Bayezid lo colmó de honores y le encargó componer la historia de la Casa de 'Uthman en persa; 'sin igual, sin rival, su prosa llega a todos los recién llegados'; murió alrededor del 925 {cita: shadharat-dhahab p. 546}."
  fr: "Le panégyriste-secrétaire persan du diwan des émirs « Ajami » qui a fui la fitna d'Ardabil pour Rum — Bayezid l'a couvert d'honneurs et lui a commandé l'histoire de la Maison d'Uthman en persan; « sans égal, sans rival, sa prose surpassant tous les nouveaux venus »; mort vers 925 {cite: shadharat-dhahab p. 546}."
  ur: "'عجمی امیروں' کے دیوان کے فارسی پنیگرسٹ سکریٹری جو اردبیل کے فتنے سے بھاگ کر رم پہنچے تھے - بایزید نے اسے اعزازات سے نوازا اور اسے فارسی میں عثمان کے گھر کی تاریخ لکھنے کا حکم دیا۔ 'ہم مرتبہ کے بغیر، حریف سے محروم، اس کا نثر ہر دیر سے آنے والے تک پہنچتا ہے'؛ d تقریباً 925 {حوالہ: شدھارت ذہاب ص۔ 546}۔"
