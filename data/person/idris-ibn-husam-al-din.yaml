summary:
  ar: "المولى إدريس بن حسام الدين العجمي ثم الرومي الحنفي؛ قال في الشقائق: كان موظفاً لديوان أمراء العجم، ولما حدثت فتنة ابن أردويل ارتحل إلى الروم فأكرمه السلطان أبو يزيد غاية الإكرام وعيّن له مشاهرة ومساعدة وعاش في كنف حمايته عيشة راضية، وأمره أن ينشئ تواريخ آل عثمان بالفارسية فصنّفها، وكان عديم النظير فاقد القرين بحيث أنسى الأقدمين ولم يبلغ إنشاءه أحد من المتأخرين، وله قصائد بالعربية والفارسية تفوت الحصر ورسائل عجيبة في مطالب متفرقة، وبالجملة كان من نوادر الدهر ومفردات العصر؛ توفي في نحو سنة خمس وعشرين وتسعمائة {cite:shadharat-dhahab p. 546}."
  en: "The Persian panegyrist-secretary of the 'Ajami amirs' diwan who fled Ardabil's fitna to Rum — Bayezid showered him with honours and commissioned him to compose the history of the House of 'Uthman in Persian; 'without peer, bereft of rival, his prose outreaching every latecomer'; d. about 925 {cite:shadharat-dhahab p. 546}."
