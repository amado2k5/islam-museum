summary:
  ar: "زعيم ديني وسياسي سوداني (1844-1885)، شيخ في الطريقة السمانية، أعلن سنة 1881 أنه المهدي المنتظر — وهو ادّعاء آمن به أتباعه الأنصار ورفضه كثير من علماء عصره — وقاد ثورة أسقطت الحكم التركي المصري في السودان وحررت الخرطوم سنة 1885، وأسس الدولة المهدية وعاصمتها أم درمان، وتوفي بالتيفوس بعد خمسة أشهر من فتح الخرطوم."
  en: "Sudanese religious and political leader (1844–1885) and a sheikh of the Sammaniyya Sufi order. In 1881 he proclaimed himself the Mahdi — a claim his followers, the Ansar, believed and many scholars of his day rejected — and led the revolt that overthrew Turco-Egyptian rule in Sudan, took Khartoum in 1885 and founded the Mahdist State with its capital at Omdurman. He died of typhus five months after Khartoum fell."
  ur: "سوڈانی مذہبی و سیاسی رہنما (1844-1885) اور سلسلہ سمانیہ کے شیخ؛ 1881 میں انہوں نے مہدی ہونے کا دعویٰ کیا — جسے ان کے پیروکار انصار نے مانا اور ان کے زمانے کے بہت سے علما نے رد کیا — اور وہ بغاوت قائم کی جس نے سوڈان میں ترک مصری حکومت ختم کی، 1885 میں خرطوم فتح ہوا اور دار الحکومت ام درمان کے ساتھ مہدی ریاست قائم ہوئی؛ خرطوم کی فتح کے پانچ ماہ بعد وہ ٹائیفس سے وفات پا گئے۔"
