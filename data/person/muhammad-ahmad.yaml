    basis: documented
    note: "His Sufi affiliation is attested by two independent articles: the English article records his discipleship under the Sammaniyya sheikh Muhammad Sharif Nur al-Da'im, his licensing as a sheikh with permission to give the tariqa, and — after the split — his succession to Sheikh al-Qurashi wad al-Zayn as leader of his Sammaniyya following; the Arabic article independently records his joining the Sammaniyya, his discipleship under Muhammad Sharif and then al-Qurashi (who married him to his daughter), and his succession. His affiliation is therefore recorded as sufi, the order being the Sammaniyya. On the Sunni school: his movement worked inside Sudan's Sunni Sufi milieu and framed itself as a return to the Qur'an and the Prophet's example, but no fetched source separately names the Sunni school or a madhhab for him, so no sunni segment is recorded. Wikidata gives only Islam (Q432)."
