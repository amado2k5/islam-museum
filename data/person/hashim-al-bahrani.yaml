summary:
  ar: "هاشم بن سليمان بن إسماعيل الحسيني البحراني التوبلي، مفسر إمامي من قرى البحرين وقبره في توبلي، صاحب البرهان في تفسير القرآن، توفي سنة 1107 هـ."
  en: "Hashim ibn Sulayman al-Husayni al-Bahrani al-Tubli, an Imami (Twelver Shi'i) exegete from the villages of Tubli and Katkan in Bahrain, buried in Tubli, author of al-Burhan fi Tafsir al-Qur'an; died 1107 AH (1696)."
  es: "Hashim ibn Sulayman al-Husayni al-Bahrani al-Tubli, un exegeta imami (doce chií) de las aldeas de Tubli y Katkan en Bahrein, enterrado en Tubli, autor de al-Burhan fi Tafsir al-Qur'an; murió en 1107 d. H. (1696)."
  fr: "Hashim ibn Sulayman al-Husayni al-Bahrani al-Tubli, un exégète Imami (chiite duodécimain) des villages de Tubli et Katkan à Bahreïn, enterré à Tubli, auteur d'al-Burhan fi Tafsir al-Qur'an; décédé en 1107 AH (1696)."
  ur: "ہاشم بن سلیمان الحسینی البحرانی الطبلی، بحرین کے دیہات تبلی اور کتکان سے تعلق رکھنے والے امامی ⁦(بارہ شیعہ)⁩ مفسر، تبلی میں مدفون، البرہان فی تفسیر القرآن کے مصنف؛ وفات 1107ھ (1696)۔"
