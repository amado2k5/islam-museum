summary:
  ar: "أخو أبي عبيد بن مسعود الثقفي؛ عند البلاذري أخذ اللواء يوم الجسر بعد مقتل أخيه فقتل."
  en: "Brother of Abu Ubayd ibn Mas'ud al-Thaqafi; in al-Baladhuri he took the banner at the Day of the Bridge after his brother's death and was killed."
  fr: "Frère d’Abu Ubayd ibn Mas’ud al-Thaqafi ; chez al-Baladhuri, il prit l’étendard à la journée du Pont après la mort de son frère et fut tué."
  es: "Hermano de Abu Ubayd ibn Mas'ud al-Thaqafi; en al-Baladhuri tomó el estandarte el Día del Puente tras la muerte de su hermano y fue asesinado."
  ur: "ابو عبید بن مسعود الثقفی کے بھائی؛ البلادوری میں اس نے اپنے بھائی کی موت کے بعد برج کے دن بینر لیا اور اسے قتل کر دیا گیا۔"
  tr: "Ebu Ubeyd bin Mes'ud el-Tekafi'nin kardeşi; el-Baladhuri'ye göre, kardeşi öldürüldükten sonra köprü günü bayrağı almış ve öldürülmüştür."
  id: "Saudara Abu Ubayd ibn Mas'ud al-Thaqafi; menurut al-Baladhuri, ia mengambil panji pada hari berdirinya setelah saudaranya dibunuh dan dibunuh."
