summary:
  ar: "الفقيه محيي الدين يوسف بن درياس الفندلاوي المغربي؛ كان شيخاً كبيراً فقيهاً عالماً زاهداً صالحاً؛ خرج إلى القتال في واقعة الفرنج بباب دمشق فلما رآه معين الدين مقدم العسكر وهو راجل قصده وقال له: يا شيخ أنت معذور لكبر سنك ونحن نقوم بالذب عن المسلمين، وسأله أن يعود فلم يفعل وقال: قد بعنا واشترى منا والله لا أقيله ولا أستقيله، وتقدم فقاتل حتى قُتل عند النيرب {cite:wafayat-ayan}."
  en: "Muhyi al-Din Yusuf b. Dirbas al-Findalawi (k. 543 at al-Nayrab) — aged Maghrebi faqih who refused Mu'in al-Din's plea to retire for his years, rode on foot against the Franks outside Damascus and was killed fighting {cite:wafayat-ayan}."
