died: { edtf: "1148", hijri: "0543", calendar: julian, precision: month, status: tradition, derived: true, note: "قُتل عند النيرب في الواقعة التي اجتمع فيها الفرنج إلى باب دمشق في ربيع الأول سنة ثلاث وأربعين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "الفقيه محيي الدين يوسف بن درياس الفندلاوي المغربي؛ كان شيخاً كبيراً فقيهاً عالماً زاهداً صالحاً؛ خرج إلى القتال في واقعة الفرنج بباب دمشق فلما رآه معين الدين مقدم العسكر وهو راجل قصده وقال له: يا شيخ أنت معذور لكبر سنك ونحن نقوم بالذب عن المسلمين، وسأله أن يعود فلم يفعل وقال: قد بعنا واشترى منا والله لا أقيله ولا أستقيله، وتقدم فقاتل حتى قُتل عند النيرب {cite:wafayat-ayan}."
  en: "Muhyi al-Din Yusuf b. Dirbas al-Findalawi (k. 543 at al-Nayrab) — aged Maghrebi faqih who refused Mu'in al-Din's plea to retire for his years, rode on foot against the Franks outside Damascus and was killed fighting {cite:wafayat-ayan}."
  es: "Muhyi al-Din Yusuf b. Dirbas al-Findalawi (m. 543 en al-Nayrab) — anciano faqih magrebí que rechazó la súplica de Mu'in al-Din de retirarse por su edad, cabalgó a pie contra los francos fuera de Damasco y murió luchando {cite:wafayat-ayan}."
  fr: "Muhyi al-Din Yusuf b. Dirbas al-Findalawi (k. 543 à al-Nayrab) — faqih maghrébin âgé qui refusa la demande de Mu'in al-Din de se retirer en raison de son âge, chevaucha à pied contre les Francs à l'extérieur de Damas et fut tué au combat {cite:wafayat-ayan}."
