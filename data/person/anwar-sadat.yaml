summary:
  ar: "سياسي وضابط مصري، الرئيس الثالث لمصر من 1970 حتى اغتياله سنة 1981. قاد بلاده في حرب أكتوبر 1973 لاستعادة سيناء، ثم زار القدس سنة 1977 ووقّع معاهدة السلام المصرية الإسرائيلية سنة 1979، فنال جائزة نوبل للسلام مناصفة."
  en: "Egyptian politician and military officer, the third president of Egypt from 1970 until his assassination in 1981. He led Egypt in the October War of 1973 to regain Sinai, then visited Jerusalem in 1977 and signed the Egypt–Israel peace treaty in 1979, sharing the Nobel Peace Prize."
  ur: "مصری سیاست دان اور فوجی افسر، 1970ء سے 1981ء میں اپنے قتل تک مصر کے تیسرے صدر۔ انہوں نے سینا کی واپسی کے لیے اکتوبر 1973ء کی جنگ میں مصر کی قیادت کی، پھر 1977ء میں یروشلم کا دورہ کیا اور 1979ء میں اسرائیل کے ساتھ امن معاہدہ کیا، جس پر انہیں نوبل امن انعام ملا۔"
  es: "Político y militar egipcio, tercer presidente de Egipto desde 1970 hasta su asesinato en 1981. Dirigió a Egipto en la Guerra de Octubre de 1973 para recuperar el Sinaí, luego visitó Jerusalén en 1977 y firmó el tratado de paz entre Egipto e Israel en 1979, compartiendo el Premio Nobel de la Paz."
  fr: "Homme politique et officier militaire égyptien, troisième président de l'Égypte de 1970 jusqu'à son assassinat en 1981. Il a dirigé l'Égypte lors de la guerre d'Octobre 1973 pour reconquérir le Sinaï, puis s'est rendu à Jérusalem en 1977 et a signé le traité de paix israélo-égyptien en 1979, partageant le prix Nobel de la paix."
  tr: "Mısırlı bir politikacı ve subay olan Sher, 1970'ten 1981'deki suikastına kadar Mısır'ın üçüncü cumhurbaşkanıydı. Ekim 1973'te Sina'yı geri almak için yapılan savaşta ülkesini yönetti, ardından 1977'de Kudüs'ü ziyaret etti ve 1979'da Mısır-İsrail barış anlaşmasını imzalayarak Nobel Barış Ödülü'nü ortaklaşa kazandı."
  id: "Seorang politikus dan perwira Mesir, ia adalah presiden ketiga Mesir dari tahun 1970 hingga pembunuhannya pada tahun 1981. Ia memimpin negaranya dalam perang Oktober 1973 untuk merebut kembali Sinai, kemudian mengunjungi Yerusalem pada tahun 1977 dan menandatangani perjanjian damai Mesir-Israel pada tahun 1979, yang memberinya Hadiah Nobel Perdamaian secara bersama-sama."
