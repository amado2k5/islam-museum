  ar: "سياسي وضابط مصري، الرئيس الثالث لمصر من 1970 حتى اغتياله سنة 1981. قاد بلاده في حرب أكتوبر 1973 لاستعادة سيناء، ثم زار القدس سنة 1977 ووقّع معاهدة السلام المصرية الإسرائيلية سنة 1979، فنال جائزة نوبل للسلام مناصفة."
  en: "Egyptian politician and military officer, the third president of Egypt from 1970 until his assassination in 1981. He led Egypt in the October War of 1973 to regain Sinai, then visited Jerusalem in 1977 and signed the Egypt–Israel peace treaty in 1979, sharing the Nobel Peace Prize."
