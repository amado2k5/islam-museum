summary:
  ar: "سيد علي الترمذي ⁦(نحو 908هـ/1502م – 991هـ/1583م)⁩، المشهور بـ«پير بابا»، وليّ صوفي حسيني النسب جاء من آسيا الوسطى واستقر في بونير ⁦(خيبر بختونخوا في باكستان اليوم)⁩ بين البشتون اليوسفزيين، حيث نشر الإسلام وواجه حركة پير روشن ⁦(بايزيد الأنصاري)⁩ الروشنائية مع تلميذه آخوند درويزه؛ كان مريدًا وخليفة لخواجه سالار عطاء الله الجشتي الرومي، وضريحه في باچا كِلّي ببونير ما يزال مقصدًا للزائرين."
  en: "Sayyid Ali Tirmizi (c. 908 AH/1502 CE – 991 AH/1583 CE), known as Pir Baba, was a Hussaini Sayyid Sufi who came from Central Asia and settled in Buner, in present-day Khyber Pakhtunkhwa, Pakistan, among the Yusufzai Pashtuns, where he spread Islam and, with his disciple Akhund Darweza, opposed Pir Roshan (Bayazid Ansari) and the Roshnai movement. He was a disciple and khalifa of Khwaja Salaar Ataullah Chishti Roomi; his shrine at Pacha Killay in Buner is still visited."
  ur: "سید علی ترمذی ⁦(تقریباً 908ھ/1502ء – 991ھ/1583ء)⁩، جو «پیر بابا» کے نام سے مشہور ہیں، حسینی سادات سے تعلق رکھنے والے صوفی بزرگ تھے جو وسطی ایشیا سے آکر بونیر ⁦(موجودہ خیبر پختونخوا، پاکستان)⁩ میں یوسف زئی پشتونوں کے درمیان آباد ہوئے، جہاں انھوں نے اسلام کی اشاعت کی اور اپنے شاگرد آخوند درویزہ کے ساتھ پیر روشن ⁦(بایزید انصاری)⁩ اور اس کی روشنائی تحریک کی مخالفت کی؛ وہ خواجہ سالار عطاء اللہ چشتی رومی کے مرید و خلیفہ تھے، اور بونیر کے پاچا کلے میں ان کا مزار آج بھی زائرین کا مرکز ہے۔"
