    note: "Settled on two independent article texts attesting Sufi affiliation for the man himself. The English article calls him in its lead 'a Sufi Pir' and says he 'was a stalwart of the Chishti, Kabrawi, Sarwardi, and Qadri Sufi order[s]', a disciple of Salaar Roomi; the Simple English article, independently worded, calls him 'a Sufi Muslim saint of the Kubrawiya order' who spread Islam among the Pashtuns. The devotional tradition adds the mechanism: he was the murid and khalifa of Khwaja Salaar Ataullah Chishti Roomi of Ajmer, who directed him to Buner. The orders named across the texts differ in emphasis (Chishti first in the English article, Kubrawiya in the Simple article), so the value is the plain sufi and the orders are preserved here rather than narrowed. No text read names a legal school for him."
