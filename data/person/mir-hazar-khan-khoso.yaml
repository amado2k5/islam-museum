summary:
  ar: "قاضٍ باكستاني (1929–2021)، رئيس وزراء باكستان المؤقت من مارس إلى يونيو 2013 لإجراء الانتخابات العامة، ورئيس محكمة بلوشستان العليا، ورئيس المحكمة الشرعبة الفدرالية (1992–1994)، وحاكم بلوشستان مرتين لفترتين قصيرتين."
  en: "Pakistani jurist (1929–2021), caretaker prime minister of Pakistan from March to June 2013 to conduct the general elections, chief justice of the Balochistan High Court, chief justice of the Federal Shariat Court (1992–1994), and twice briefly governor of Balochistan."
  ur: "پاکستانی جج (1929ء–2021ء)، مارچ سے جون 2013ء تک عام انتخابات کے انعقاد کے لیے پاکستان کے نگراں وزیرِ اعظم، بلوچستان ہائی کورٹ کے چیف جسٹس، وفاقی شرعی عدالت کے چیف جسٹس (1992ء–1994ء)، اور دو بار مختصر مدت کے لیے بلوچستان کے گورنر۔"
