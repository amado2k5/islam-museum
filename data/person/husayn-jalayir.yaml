summary:
  ar: "حسين بن علاء الدولة بن أحمد بن أويس من ذرية أويس الجلائري؛ كان تيمورلنك أسره وأخاه حسناً وحملهما إلى سمرقند ثم أطلقهما، وكان أبوه صاحب البصرة فمات فملك ولده شاه محمد فصادقه حسين فعهد إليه بالمملكة فاستولى على البصرة وواسط وغيرها ثم حاربه أصبان شاه بن قرا يوسف فانتهى حسين إلى شاه رخ بن تيمورلنك فتقوى بالانتماء إليه ثم قدم القاهرة في أواخر أيام المؤيد وتوفي مطعوناً في ثامن عشر جمادى الآخرة سنة خمس وثلاثين وثمانمائة {cite:shadharat-dhahab p. 213}."
  en: "Husayn b. 'Ala' al-Dawla, grandson of Ahmad b. Uways the Jalayirid — Timur's captive at Samarqand, then lord of Basra and Wasit by Shah Muhammad's bequest; broken by Qara Yusuf's son, sheltered by Shah Rukh, fled late to Cairo and died of plague 18 Jumada II 835 {cite:shadharat-dhahab p. 213}."
  es: "Husayn b. 'Ala' al-Dawla, nieto de Ahmad b. Uways el Jalayirid: cautivo de Timur en Samarcanda, entonces señor de Basora y Wasit por legado de Shah Muhammad; roto por el hijo de Qara Yusuf, protegido por Shah Rukh, huyó tarde a El Cairo y murió de peste 18 Jumada II 835 {cita: shadharat-dhahab p. 213}."
  fr: "Husayn b. 'Ala' al-Dawla, petit-fils d'Ahmad b. Uways le Jalayirid — captif de Timur à Samarqand, puis seigneur de Bassorah et Wasit par le legs de Shah Muhammad; brisé par le fils de Qara Yusuf, hébergé par Shah Rukh, s'enfuit tardivement au Caire et mourut de la peste le 18 Jumada II 835 {cite: shadharat-dhahab p. 213}."
  ur: "حسین بی علاء الدولہ، احمد بن کا پوتا۔ اویس جلیرید - سمرقند میں تیمور کا اسیر، پھر شاہ محمد کی وصیت سے بصرہ اور وصیت کا مالک؛ قرہ یوسف کے بیٹے سے ٹوٹا، شاہ رخ نے پناہ دی، دیر سے بھاگ کر قاہرہ چلا گیا اور طاعون 18 جمادی الثانی 835 میں مر گیا۔ 213}۔"
  tr: "Hüseyin bin 'Ala al-Dawla ibn Ahmed ibn Uways, Uways al-Jalayiri'nin soyundan geliyordu; Timur onu, kardeşi Hasan'ı yakalayıp Semerkand'a götürmüş, sonra serbest bırakmıştı. Babası Basra'nın hükümdarıydı, ancak o öldü. Oğlu Şah Muhammed kral oldu ve Hüseyin onunla dostlaştı, krallığı ona emanet etti, Basra, Wasit ve diğer bölgeleri ele geçirdi. Sonra Asban Şah ibn Qara Yusuf onunla savaştı. Hüseyin, Şah Rukh bin Timur'un yanında yer aldı ve ona bağlılığını güçlendirdi. Sonra el-Mueyye'nin son günlerinde Kahire'ye döndü ve 835 H yılında Cumade'l-Ahhirah'ın on sekizinde bıçaklanarak öldü."
  id: "Husayn ibn 'Ala al-Dawla ibn Ahmad ibn Uways adalah keturunan Uways al-Jalayiri; Timur telah menangkapnya, saudaranya Hasan, dan membawa mereka ke Samarkand, lalu membebaskan mereka. Ayahnya adalah penguasa Basra, tetapi ia meninggal. Putranya Shah Muhammad menjadi raja, dan Husayn berteman dengannya, mempercayakan kerajaan kepadanya, merebut Basra, Wasit, dan wilayah lainnya. Kemudian Asban Shah ibn Qara Yusuf melawannya. Husayn berpihak pada Shah Rukh ibn Timur dan memperkuat kesetiaannya kepadanya. Ia kemudian kembali ke Kairo pada akhir masa al-Mu'ayyad dan meninggal karena ditikam pada tanggal delapan belas Jumada al-Akhirah tahun 835 H."
