summary:
  ar: "حسين بن علاء الدولة بن أحمد بن أويس من ذرية أويس الجلائري؛ كان تيمورلنك أسره وأخاه حسناً وحملهما إلى سمرقند ثم أطلقهما، وكان أبوه صاحب البصرة فمات فملك ولده شاه محمد فصادقه حسين فعهد إليه بالمملكة فاستولى على البصرة وواسط وغيرها ثم حاربه أصبان شاه بن قرا يوسف فانتهى حسين إلى شاه رخ بن تيمورلنك فتقوى بالانتماء إليه ثم قدم القاهرة في أواخر أيام المؤيد وتوفي مطعوناً في ثامن عشر جمادى الآخرة سنة خمس وثلاثين وثمانمائة {cite:shadharat-dhahab p. 213}."
  en: "Husayn b. 'Ala' al-Dawla, grandson of Ahmad b. Uways the Jalayirid — Timur's captive at Samarqand, then lord of Basra and Wasit by Shah Muhammad's bequest; broken by Qara Yusuf's son, sheltered by Shah Rukh, fled late to Cairo and died of plague 18 Jumada II 835 {cite:shadharat-dhahab p. 213}."
