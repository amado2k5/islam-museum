summary:
  ar: "عازف سيتار وسربهار هندي (1894–1938)، وُلد في المقاطعات الشمالية الغربية لأسرة موسيقية، وهو ابن إمداد خان مؤسس غرانة إمدادخاني (إيتاواه). استقر في كلكتا وطوّر أسلوب الغاياكي في العزف على السيتار وثبّت مقاسات الآلة وأضاف إليها القرعة الرنانة العليا، وتوفي شابا عن 43 عاما؛ وابناه ولايت خان وإمرات خان من أشهر عازفي جيلهما."
  en: "Indian sitar and surbahar player (1894–1938), born in the North-Western Provinces to a family of musicians, son of Imdad Khan, founder of the Imdadkhani (Etawah) gharana. Settled at Calcutta, he developed the gayaki ang in sitar playing, standardised the instrument's dimensions and added the upper resonator gourd; he died at 43, and his sons Vilayat Khan and Imrat Khan became leading players of their generation."
  ur: "ہندوستانی ستار و سر بہار نواز (1894ء–1938ء)، شمال مغربی صوبوں میں ایک موسیقار گھرانے میں پیدا ہوئے؛ وہ امداد خانی (اٹاوہ) گھرانے کے بانی امداد خان کے بیٹے تھے۔ کلکتہ میں سکونت اختیار کی، ستار میں گائیکی انگ کو ترقی دی، ساز کے پیمانے متعین کیے اور بالائی گونج والا کدّو شامل کیا؛ 43 برس کی عمر میں وفات پائی، اور ان کے بیٹے ولایت خان اور امرت خان اپنے عہد کے بڑے نواز ہوئے۔"
