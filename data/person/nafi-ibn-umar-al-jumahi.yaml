summary:
  ar: نافع بن عمر القرشي الجمحي المكي، حافظ للحديث وكان محدث مكة في زمانه، توفي بمكة سنة 169 هـ، وقال فيه أحمد بن حنبل إنه ثبت ثبت صحيح الكتاب.
  en: "Nafi' ibn Umar al-Qurashi al-Jumahi al-Makki, a hafiz of hadith and the muhaddith of Mecca in his time, who died there in 169 AH (785); Ahmad ibn Hanbal called him firmly reliable with a sound book."
  es: "Nafi' ibn Umar al-Qurashi al-Jumahi al-Makki, un hafiz de hadices y muhaddith de La Meca en su tiempo, que murió allí en el 169 AH (785); Ahmad ibn Hanbal lo llamó firmemente confiable con un libro sólido."
  fr: "Nafi' ibn Umar al-Qurashi al-Jumahi al-Makki, un hafiz de hadith et le muhaddith de La Mecque à son époque, qui y mourut en 169 AH (785); Ahmad ibn Hanbal l'a qualifié de fermement fiable avec un livre solide."
  ur: "نافع بن عمر القرشی الجماحی المکی، جو اپنے زمانے میں حدیث کے حافظ اور مکہ کے محدث تھے، جن کی وفات 169ھ (785) میں ہوئی؛ احمد بن حنبل نے اسے صحیح کتاب کے ساتھ مضبوطی سے معتبر کہا۔"
  tr: "Nafi' ibn Umar al-Qurashi al-Jumahi al-Makki, kendi döneminde Mekke'de hadis alimi ve alimi olarak görev yapmış, 169 Hicri yılında Mekke'de vefat etmiştir. Ahmed ibn Hanbal onun hakkında bunun gerçek ve özgün olduğunu söylemiştir."
  id: "Nafi' ibn Umar al-Qurashi al-Jumahi al-Makki, seorang ulama hadis dan ulama hadis di Mekah pada zamannya, meninggal di Mekah pada tahun 169 H. Ahmad ibn Hanbal berkata tentangnya bahwa itu otentik dan otentik."
