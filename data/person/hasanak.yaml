kids:
  ar: "حسنك كان وزير السلطان محمود الغزنوي، وانتهت حياته بمحاكمة في صراع على الحكم."
  en: "Hasanak was the chief minister of Sultan Mahmud of Ghazna, and his life ended in a trial during a struggle over who would rule."
