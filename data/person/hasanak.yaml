summary:
  ar: "حسنك، واسمه أبو علي حسن بن محمد بن عباس، آخر وزراء السلطان محمود الغزنوي. تولى ولاية خراسان صغير السن، وحجّ سنة 414هـ/1023م وقبل في عودته من القاهرة خلعة من الخليفة الفاطمي الظاهر، فاشتُبه عند الخليفة العباسي القادر في ميله إلى الفاطميين. عيّنه محمود وزيراً سنة 415هـ/1024م، وبعد وفاة محمود سنة 421هـ/1030م نُفي إلى هراة ثم حوكم واختُنق سنة 423هـ/1032م {cite:encyclopaedia-of-islam-2 vol. 3 p. 275} {cite:encyclopaedia-of-islam-2 vol. 3 p. 276}."
  en: "Hasanak, properly Abu Ali Hasan ibn Muhammad ibn Abbas, was the last vizier of Sultan Mahmud of Ghazna. Made governor of Khurasan at an early age, he went on pilgrimage in 414/1023 and on the way home accepted a robe of honour in Cairo from the Fatimid caliph al-Zahir, which made the Abbasid caliph al-Qadir suspect him of Fatimid sympathies. Mahmud appointed him vizier in 415/1024; after Mahmud's death in 421/1030 he was banished to Herat, tried, and strangled in 423/1032 {cite:encyclopaedia-of-islam-2 vol. 3 p. 275} {cite:encyclopaedia-of-islam-2 vol. 3 p. 276}."
  ur: "حسنک، جن کا پورا نام ابو علی حسن بن محمد بن عباس تھا، سلطان محمود غزنوی کے آخری وزیر تھے۔ وہ کم عمری میں خراسان کے گورنر بنے، 414ھ/1023ء میں حج کو گئے اور واپسی پر قاہرہ میں فاطمی خلیفہ الظاہر سے خلعت قبول کر لی، جس سے عباسی خلیفہ القادر کو ان کے فاطمیوں کی طرف مائل ہونے کا شبہ ہوا۔ محمود نے 415ھ/1024ء میں انہیں وزیر بنایا؛ محمود کی وفات 421ھ/1030ء کے بعد انہیں ہرات جلا وطن کیا گیا، مقدمہ چلا اور 423ھ/1032ء میں گلا گھونٹ کر ہلاک کیا گیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 275} {cite:encyclopaedia-of-islam-2 vol. 3 p. 276}."
