  ar: "المغني، روى خبر مسكين المدني أبي صدقة حين جمع الرشيد المغنين فغنى صوتاً قصر فيه الرؤساء عن مراد الخليفة فرفعت الستارة بينه وبين الرشيد {cite:muruj-al-dhahab p. 348}. وعند ابن النديم يقال إنه أخذ الغناء عن يونس الكاتب {cite:fihrist-ibn-al-nadim p. 447}"
