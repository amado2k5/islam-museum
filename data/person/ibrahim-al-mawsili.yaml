  tr: "El-Mughni, fakir el-Medeni Ebu Sadaqah'ın hikayesini anlattı; el-Reşid, şarkıcıları toplayıp reislerin halifenin dileğini kısalttığı bir ses söyledi, böylece onunla el-Reşid arasındaki perde kalktı {atı:muruj-al-dhahab, s. 348}. İbn el-Nadim'e göre, şarkıyı Yunus el-Katib'ten aldığı söylenir {atıf:fihrist-ibn-al-nadim s. 447}"
  id: "Al-Mughni menceritakan kisah al-Madani Abu Sadaqah yang miskin ketika al-Rashid mengumpulkan para penyanyi dan menyanyikan suara yang memperpendek keinginan khalifah, sehingga tirai terangkat antara dia dan al-Rashid {cite:muruj-al-dhahab, hlm. 348}. Menurut Ibn al-Nadim, dikatakan bahwa dia mengambil nyanyian dari Yunus al-Katib {cite:fihrist-ibn-al-nadim hlm. 447}"
