summary:
  ar: "زعيم سياسي وديني تونسي (1876–1944)؛ درس في الزيتونة وأصدر مجلة «سبيل الرشاد»، وشارك في حركة الشباب التونسي، وأسس الحزب الدستوري سنة 1921 بعد كتابه «تونس الشهيدة» (1920)، ونُفي مرارًا وعاد إلى تونس سنة 1937 حيث توفي."
  en: "Tunisian political and religious leader (1876–1944). Educated at the Zaytuna, he published the journal Sabil al-Rashid, took part in the Young Tunisians, and in 1921 founded the Destour party after his book La Tunisie martyre (1920); repeatedly exiled, he returned to Tunisia in 1937 and died there."
  ur: "تونسی سیاسی و مذہبی رہنما (1876–1944)؛ زیتونہ میں تعلیم پائی، مجلہ «سبیل الرشاد» جاری کیا، نوجوان تونسی تحریک میں شریک رہے، اور اپنی کتاب «تونس الشہیدہ» (1920) کے بعد 1921 میں دستور پارٹی قائم کی؛ بار بار جلاوطن ہوئے، 1937 میں تونس واپس آئے اور وہیں انتقال ہوا۔"
