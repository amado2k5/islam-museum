summary:
  ar: "قارئ سعودي ⁦(وُلد 1947)⁩، إمام وخطيب المسجد النبوي منذ 1979 وأستاذ بالجامعة الإسلامية بالمدينة، عُرف بتلاوته البطيئة العميقة، واختير لخطبة عرفة في حج 1447هـ/2026م."
  en: "Saudi reciter (born 1947), imam and khatib of the Prophet's Mosque since 1979 and professor at the Islamic University of Madinah, known for his slow, deep recitation; he was chosen to deliver the Arafat sermon at the Hajj of 1447/2026."
  fr: "Récit saoudien (né en 1947), imam et khatib de la mosquée du Prophète depuis 1979 et professeur à l'Université islamique de Médine, connu pour sa récitation lente et profonde ; il a été choisi pour prononcer le sermon d'Arafat au Hajj de 1447/2026."
  ur: "سعودی قاری ⁦(پیدائش 1947ء)⁩، 1979ء سے مسجد نبوی کے امام و خطیب اور مدینہ کی اسلامی یونیورسٹی کے استاد، اپنی سست اور گہری تلاوت کے لیے معروف؛ حج 1447ھ/2026ء میں خطبہ عرفہ کے لیے منتخب ہوئے۔"
  es: "Recitador saudí (nacido en 1947), imán y khatib de la Mezquita del Profeta desde 1979 y profesor de la Universidad Islámica de Medina, conocido por su recitación lenta y profunda; fue elegido para pronunciar el sermón de Arafat en el Hajj de 1447/2026."
  tr: "Suudi bir şahmetçi (1947 doğumlu), 1979'dan beri Peygamber Camii imamı ve vaizi, Medine İslam Üniversitesi'nde profesör, yavaş ve derin okumalarıyla tanınan ve 1447 Hicri / 2026 M.S. Hac sırasında Arafat vaazını vermeyi seçmiştir."
  id: "Seorang pembaca Arab Saudi (lahir 1947), imam dan penceramah Masjid Nabi sejak 1979, serta profesor di Universitas Islam Madinah, dikenal dengan bacaan lambat dan dalam, serta dipilih untuk menyampaikan khutbah Arafah selama Haji 1447 H / 2026 M."
