summary:
  ar: "ماروت أحد المَلَكين اللذين ذُكرا في قصة السحر ببابل في سورة البقرة: «واتبعوا ما تتلو الشياطين على ملك سليمان... وماروت وهاروت». اختلف المفسرون في صفتهما؛ فذهب جمع إلى أنهما ملكان أُرسلا ليبتليا الناس، وذهب آخرون إلى أنهما من الجن أو البشر، وروي أن الله عاقبهما بعد تعليم السحر {cite:tanzil-quran} {cite:tafsir-ibn-kathir}."
  en: "Marut is one of the two beings named in the Babylon magic narrative of surah al-Baqarah: 'they followed what the devils recited about the kingdom of Solomon... and Marut and Harut'. The exegetes differed over their nature; many held them to be two angels sent to test people, others said jinn or humans, and tradition adds that God punished them after they taught sorcery {cite:tanzil-quran} {cite:tafsir-ibn-kathir}."
  ur: "ماروت ان دو ہستیوں میں سے ایک ہیں جن کا ذکر سورۃ البقرہ کی جادو کی کہانی میں آیا ہے: «اور انہوں نے تو تابع ہوئے جو شیطان سلیمان کی بادشاہت کے بارے میں پڑھتے تھے... اور ماروت اور ہاروت»۔ مفسروں میں ان کی فطرت پر اختلاف ہے؛ بہت سے انہیں دو فرشتے مانتے ہیں جو لوگوں کی آزمائش کے لیے بھیجے گئے، دوسروں نے انہیں جن یا انسان کہا، اور روایت میں ہے کہ سحر سکھانے کے بعد اللہ نے ان پر سزا دی {cite:tanzil-quran} {cite:tafsir-ibn-kathir}۔"
