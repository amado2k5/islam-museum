summary:
  ar: عالم ومؤلف وعامل إنساني غاني. مؤسِّس المجلس الإسلامي للتنمية والخدمات الإنسانية ⁦(ICODEHS)⁩ سنة 1996، الذي بنى مئات المدارس والآبار في غانا وغرب أفريقيا، ورئيس فرع غانا لمؤسسة محمد السادس لعلماء أفريقيا.
  en: Ghanaian scholar, author and humanitarian. Founder in 1996 of the Islamic Council for Development and Humanitarian Services (ICODEHS), which has built hundreds of schools and wells in Ghana and West
    Africa, and president of the Ghana section of the Mohammed VI Foundation of African Oulema.
  ur: گانا کے عالم، مصنف اور انسانی خدمت کار۔ 1996 میں اسلامک کونسل فار ڈیولپمنٹ اینڈ ہیومینیٹیرین سروسز ⁦(ICODEHS)⁩ کے بانی جس نے گھانا اور مغربی افریقہ میں سیکڑوں اسکول اور کنوئیں بنائے، اور محمد شیشم
    فاؤنڈیشن برائے افریقی علماء کے گھانا شعبے کے صدر۔
  es: "Académico, autor y humanitario ghanés. Fundador en 1996 del Consejo Islámico para el Desarrollo y los Servicios Humanitarios (ICODEHS), que ha construido cientos de escuelas y pozos en Ghana y África Occidental, y presidente de la sección ghanesa de la Fundación Mohammed VI de Oulema Africano."
  fr: "Érudit, auteur et humanitaire ghanéen. Fondateur en 1996 du Conseil islamique pour le développement et les services humanitaires (ICODEHS), qui a construit des centaines d'écoles et de puits au Ghana et en Afrique de l'Ouest, et président de la section ghanéenne de la Fondation Mohammed VI des Oulémas africains."
  tr: "Ganalı bilim insanı, yazar ve insani yardım çalışanı. 1996 yılında Gana ve Batı Afrika'da yüzlerce okul ve kuyu inşa eden İslami Kalkınma ve İnsani Hizmetler Konseyi'nin (ICODEHS) kurucusu ve Mohammed VI Afrika Alimleri Vakfı'nın Gana şubesinin başkanıdır."
  id: "Ilmuwan, penulis, dan pekerja kemanusiaan Ghana. Pendiri Dewan Islam untuk Pembangunan dan Layanan Kemanusiaan (ICODEHS) pada tahun 1996, yang membangun ratusan sekolah dan sumur di Ghana dan Afrika Barat, serta presiden cabang Ghana dari Mohammed VI Foundation of African Scholars."
