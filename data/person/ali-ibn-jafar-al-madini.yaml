summary:
  ar: "علي بن جعفر المديني حافظ الحديث، مات بسامرا يوم الاثنين لثلاث بقين من ذي الحجة سنة أربع وثلاثين ومائتين وهو ابن اثنتين وسبعين سنة وأشهر {cite:muruj-al-dhahab p. 512}. وهو علي بن عبد الله بن جعفر المديني وتوفي بسر من رأى يوم الاثنين لثلاث بقين من ذي القعدة وله كتاب المسند بعلله وكتاب المدلسين وكتاب الضعفاء وكتاب العلل وكتاب الأسماء والكنى وكتاب الأشربة وكتاب التنزيل {cite:fihrist-ibn-al-nadim p. 322}"
  en: "The traditionist Ibn al-Madini — dead at Samarra, Dhu'l-Hijja 234, aged seventy-two {cite:muruj-al-dhahab p. 512}."
  es: "El tradicionalista Ibn al-Madini — murió en Samarra, Dhu'l-Hijja 234, a la edad de setenta y dos años {cite:muruj-al-dhahab p. 512}."
  fr: "Le traditionniste Ibn al-Madini — mort à Samarra, Dhu'l-Hijja 234, à l'âge de soixante-douze ans {cite:muruj-al-dhahab p. 512}."
  ur: "محدث ابن المدینی - سامراء، ذوالحجہ 234 میں فوت ہوئے، عمر 72۔ 512}۔"
  tr: "Hadis ezberci Ali ibn Ca'far el-Medini, 234 Hicce'den üç gün önce, Pazartesi günü Samarra'da yetmiş iki yıl bir ay yaşında vefat etti {atıf:muruj-al-dhahab s. 512}. O, Ali ibn Abdullah ibn Ja'far al-Madini'dir ve Zhu al-Qi'dah'tan üç gün önce, Pazartesi günü 'Man Ra'a'nın gizliliğinde öldü. Musnad bi 'Illah, sahtekarların kitabı, zayıflar kitabı, 'Illal' kitabı, isimler ve kunyalar kitabı, içkiler kitabı ve vahiy kitabını yazdı {atıf:fihrist-ibn-al-nadim s. 322}"
  id: "Ali ibn Ja'far al-Madini, seorang penghafal hadits, meninggal di Samarra pada hari Senin, tiga hari sebelum Dhu al-Hijjah, tahun 234 H, pada usia tujuh puluh dua tahun dan sebulan {cite:muruj-al-dhahab hlm. 512}. Ia adalah Ali ibn Abdullah ibn Ja'far al-Madini dan meninggal dalam rahasia 'Man Ra'a pada hari Senin, tiga hari sebelum Dhu al-Qi'dah. Ia menulis buku Musnad bi'Illah, kitab para pembuat, kitab orang lemah, kitab 'Illal', kitab nama dan kunya, kitab minuman, dan kitab wahyu {cite:fihrist-ibn-al-nadim hlm. 322}"
