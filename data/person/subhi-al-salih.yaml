summary:
  ar: "عالم لبناني في الحديث وعلوم القرآن ⁦(1926–1986)⁩، من أعلام الدراسات الإسلامية الحديثة. درّس في الجامعة اللبنانية وأشرف على أجيال من الباحثين، ومن كتبه «علوم الحديث ومصطلحه» الذي صار أشهر متن جامعي في بابه، و«مباحث في علوم القرآن» و«النظم الإسلامية»."
  en: "Lebanese scholar of hadith and Qur'anic sciences (1926–1986), a leading figure of modern Islamic studies. He taught at the Lebanese University and supervised generations of researchers; his books include Ulum al-Hadith — now the most widely taught university manual in its field — Mabahith fi Ulum al-Qur'an and Al-Nuzum al-Islamiyya."
  ur: "لبنانی عالمِ حدیث و علومِ قرآن ⁦(1926–1986)⁩ جو جدید اسلامیات کے ممتاز ماہرین میں شمار ہوتے ہیں۔ انہوں نے لیبنانی یونیورسٹی میں تدریس کی اور محققین کی نسلوں کی تربیت کی؛ ان کی کتابوں میں «علوم الحدیث و مصطلحہ» — جو اپنے باب میں سب سے زیادہ پڑھائی جانے والی جامعاتی کتاب ہے — «مباحث فی علوم القرآن» اور «النظم الاسلامیہ» شامل ہیں۔"
  es: "Erudito libanés especializado en hadices y ciencias coránicas (1926-1986), figura destacada de los estudios islámicos modernos. Impartió clases en la Universidad Libanesa y dirigió a generaciones de investigadores; entre sus libros se encuentran Ulum al-Hadith —actualmente el manual universitario más utilizado en su campo—, Mabahith fi Ulum al-Qur'an y Al-Nuzum al-Islamiyya."
