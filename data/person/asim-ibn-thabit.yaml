summary:
  en: "A prominent warrior and archer of the Aws who fought at Badr and Uhud; chosen as commander of the ten scouts sent in the Expedition of al-Raji' in 4 AH, where he refused surrender and fought until martyrdom; God sent a swarm of wasps to shield his body from desecration by Quraysh."
  ar: "صحابي بدري وفارس رامٍ من الأوس؛ شهد بدراً وأحداً وكان أمير سرية الرجيع في صفر 4هـ، فقاتل بني لحيان رافضاً الأسر حتى استشهد؛ وقد نذر ألا يمس مشركاً ولا يمسه مشرك، فحمى الله جثمانه بسرب من الدبر فلم تقدر قريش على أخذ شيء منه."
