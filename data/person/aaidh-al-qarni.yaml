summary:
  ar: "داعية وكاتب وشاعر سعودي، وُلد سنة 1959 في منطقة عسير، حاصل على الدكتوراه من جامعة الإمام محمد بن سعود الإسلامية في الحديث. اشتهر عالميًا بكتابه «لا تحزن» الذي بيعت منه ملايين النسخ وتُرجم إلى لغات كثيرة، وله أكثر من ثمانين مؤلفًا بين الدراسات الشرعية والتنمية الذاتية والدواوين."
  en: "Saudi preacher, writer and poet, born in 1959 in the Asir region, with a doctorate in hadith from Imam Muhammad ibn Saud Islamic University. He is internationally known for La Tahzan ⁦(Don't Be Sad)⁩, which sold millions of copies in many languages, and has published more than eighty books across religious studies, self-help and poetry."
  fr: "Prédicateur, écrivain et poète saoudien, né en 1959 dans la région de l'Asir, docteur en hadith de l'université islamique Imam Muhammad ibn Saud. Il est connu dans le monde entier pour La Tahzan (Ne sois pas triste), vendu à des millions d'exemplaires en de nombreuses langues, et a publié plus de quatre-vingts livres en études religieuses, développement personnel et poésie."
  ur: "سعودی مبلغ، مصنف اور شاعر، 1959 میں علاقہ عسیر میں پیدا ہوئے، جامعہ امام محمد بن سعود الاسلامیہ سے حدیث میں ڈاکٹریٹ۔ وہ اپنی کتاب «لا تحزن» ⁦(Don't Be Sad)⁩ کی وجہ سے عالمگیر شہرت رکھتے ہیں جس کی لاکھوں کاپیاں بکیں اور کئی زبانوں میں ترجمہ ہوا، اور مذہبی مطالعات، خوداحتسابی اور شاعری پر اسی سے زیادہ تصانیف چھوڑیں۔"
  es: "Predicador, escritor y poeta saudí, nacido en 1959 en la región de Asir, doctor en hadices por la Universidad Islámica Imam Muhammad ibn Saud. Es conocido internacionalmente por La Tahzan (No estés triste), que vendió millones de ejemplares en numerosos idiomas, y ha publicado más de ochenta libros sobre estudios religiosos, autoayuda y poesía."
  tr: "1959 yılında Asir bölgesinde doğan Suudi bir vaiz, yazar ve şair olan bu kişi, İmam Muhammed ibn Suud İslam Üniversitesi'nden Hadis alanında doktora derecesine sahiptir. Milyonlarca satılan ve birçok dile çevrilen \"Üzülme\" adlı kitabıyla uluslararası alanda tanınmaktadır. İslam ilimleri, kişisel gelişim ve şiir derlemeleri alanlarında seksenin üzerinde kitap yazmıştır."
  id: "Seorang pendakwah, penulis, dan penyair Saudi, lahir pada tahun 1959 di wilayah Asir, ia memegang gelar doktor dalam bidang Hadits dari Universitas Islam Imam Muhammad ibn Saud. Ia terkenal secara internasional karena bukunya \"Jangan Bersedih,\" yang telah terjual jutaan eksemplar dan diterjemahkan ke dalam banyak bahasa. Ia telah menulis lebih dari delapan puluh buku, yang mencakup studi Islam, pengembangan diri, dan kumpulan puisi."
