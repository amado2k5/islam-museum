summary:
  ar: "داعية وكاتب وشاعر سعودي، وُلد سنة 1959 في منطقة عسير، حاصل على الدكتوراه من جامعة الإمام محمد بن سعود الإسلامية في الحديث. اشتهر عالميًا بكتابه «لا تحزن» الذي بيعت منه ملايين النسخ وتُرجم إلى لغات كثيرة، وله أكثر من ثمانين مؤلفًا بين الدراسات الشرعية والتنمية الذاتية والدواوين."
  en: "Saudi preacher, writer and poet, born in 1959 in the Asir region, with a doctorate in hadith from Imam Muhammad ibn Saud Islamic University. He is internationally known for La Tahzan ⁦(Don't Be Sad)⁩, which sold millions of copies in many languages, and has published more than eighty books across religious studies, self-help and poetry."
  ur: "سعودی مبلغ، مصنف اور شاعر، 1959 میں علاقہ عسیر میں پیدا ہوئے، جامعہ امام محمد بن سعود الاسلامیہ سے حدیث میں ڈاکٹریٹ۔ وہ اپنی کتاب «لا تحزن» ⁦(Don't Be Sad)⁩ کی وجہ سے عالمگیر شہرت رکھتے ہیں جس کی لاکھوں کاپیاں بکیں اور کئی زبانوں میں ترجمہ ہوا، اور مذہبی مطالعات، خوداحتسابی اور شاعری پر اسی سے زیادہ تصانیف چھوڑیں۔"
