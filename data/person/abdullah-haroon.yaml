summary:
  ar: "سير عبد الله هارون (1872–1942)، سياسي ورجل أعمال من كراتشي في الهند البريطانية، لُقّب «ملك السكر» لنجاحه في تجارة السكر. ترأس لجنة الخلافة في السند والرابطة الإسلامية الإقليمية، ونظّم مؤتمر الرابطة الإسلامية الأول في السند سنة 1938 وأيّد قرار لاهور سنة 1940، وكان محسنًا بنى مدارس ومساجد وملاجئ للأيتام."
  en: "Sir Abdullah Haroon (1872–1942), a Karachi politician and businessman of British India, called the 'Sugar King' for his success in the sugar trade. He presided over the Sindh Khilafat Committee and the provincial Muslim League, organised the first Sind Provincial Muslim League Conference in 1938 and endorsed the Lahore Resolution in 1940, and was a philanthropist who built schools, mosques and orphanages."
  ur: "سر عبد اللہ ہارون (1872ء–1942ء)، برطانوی ہند کے کراچی سے تعلق رکھنے والے سیاست دان اور تاجر، جو چینی کی تجارت میں کامیابی پر «شوگر کنگ» کہلائے۔ وہ سندھ خلافت کمیٹی اور صوبائی مسلم لیگ کے صدر رہے، 1938ء میں پہلی سندھ صوبائی مسلم لیگ کانفرنس منعقد کی اور 1940ء میں قرارداد لاہور کی تائید کی، اور مدارس، مساجد اور یتیم خانے بنانے والے صاحب خیر تھے۔"
