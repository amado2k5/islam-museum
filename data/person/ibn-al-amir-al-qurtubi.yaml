summary:
  ar: "أبو إسحاق إبراهيم بن يحيى بن إبراهيم بن سعيد القرطبي، المعروف بابن الأمير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} قال ابن بشكوال: روى عن جماعة من شيوخنا وأكثر عنهم، وكان من جلة المحدثين وكبار المسندين والأدباء المتقنين من أهل الدراية والرواية والثقة والضبط والإتقان، أخذت عنه وأخذ عني، وكان من الدين بمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} وقال الذهبي: له استدراك على كتاب «الاستيعاب». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} والمصادر المذكورة: الصلة لابن بشكوال، وتاريخ الإسلام للذهبي ضمن وفيات ٤٥٠-٥٥٠ه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} وفي رأس الترجمة تاريخان «٥٤٤» و«٤٨٩» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Ishaq Ibrahim ibn Yahya ibn Ibrahim ibn Sa'id al-Qurtubi, known as Ibn al-Amir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Ibn Bashkuwal said of him that he transmitted from many of our shaykhs, going beyond them, and was among the eminent hadith scholars, the great masters of isnad, and the accomplished men of letters, people of insight, transmission, trustworthiness, precision and mastery, adding that he transmitted from him and he from him, and that he was of considerable piety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Al-Dhahabi notes that he wrote a supplement to the book al-Isti'ab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} The cited sources are Ibn Bashkuwal's al-Sila and al-Dhahabi's Tarikh al-Islam under the deaths of 450-550 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} The heading prints two figures, 544 and 489, without saying which is the birth and which the death."
  es: "Abu Ishaq Ibrahim ibn Yahya ibn Ibrahim ibn Sa'id al-Qurtubi, conocido como Ibn al-Amir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Ibn Bashkuwal dijo de él que transmitió de muchos de nuestros shaykhs, yendo más allá de ellos, y fue uno de los eminentes eruditos de hadices, los grandes maestros de isnad, y los consumados hombres de letras, personas de perspicacia, transmisión, confiabilidad, precisión y maestría, agregando que él transmitió de él y él de él, y que era de considerable piedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Al-Dhahabi señala que escribió un suplemento al libro al-Isti'ab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Las fuentes citadas son al-Sila de Ibn Bashkuwal y Tarikh al-Islam de al-Dhahabi bajo las muertes de 450-550 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} El encabezado imprime dos cifras, 544 y 489, sin decir cuál es el nacimiento y cuál la muerte."
  fr: "Abou Ishaq Ibrahim ibn Yahya ibn Ibrahim ibn Sa'id al-Qurtubi, connu sous le nom d'Ibn al-Amir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Ibn Bashkuwal a dit de lui qu'il avait transmis de nombreux cheikhs, allant même au-delà d'eux, et qu'il comptait parmi les éminents spécialistes du hadith, les grands maîtres de l'isnad et les hommes de lettres accomplis, des personnes perspicaces, transmissives, dignes de confiance, précises et expertes. Il ajouta qu'il avait transmis de lui et que lui aussi avait transmis de lui, et qu'il était d'une grande piété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Al-Dhahabi note qu'il a écrit un supplément au livre al-Isti'ab. Les sources citées sont al-Sila d'Ibn Bashkuwal et Tarikh al-Islam d'al-Dhahabi, pour les décès survenus entre 450 et 550 AH. L'en-tête mentionne deux chiffres, 544 et 489, sans préciser lequel correspond à la naissance et lequel au décès."
