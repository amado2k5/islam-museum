summary:
  ar: "أبو إسحاق إبراهيم بن يحيى بن إبراهيم بن سعيد القرطبي، المعروف بابن الأمير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} قال ابن بشكوال: روى عن جماعة من شيوخنا وأكثر عنهم، وكان من جلة المحدثين وكبار المسندين والأدباء المتقنين من أهل الدراية والرواية والثقة والضبط والإتقان، أخذت عنه وأخذ عني، وكان من الدين بمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} وقال الذهبي: له استدراك على كتاب «الاستيعاب». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} والمصادر المذكورة: الصلة لابن بشكوال، وتاريخ الإسلام للذهبي ضمن وفيات ٤٥٠-٥٥٠ه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} وفي رأس الترجمة تاريخان «٥٤٤» و«٤٨٩» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Ishaq Ibrahim ibn Yahya ibn Ibrahim ibn Sa'id al-Qurtubi, known as Ibn al-Amir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Ibn Bashkuwal said of him that he transmitted from many of our shaykhs, going beyond them, and was among the eminent hadith scholars, the great masters of isnad, and the accomplished men of letters, people of insight, transmission, trustworthiness, precision and mastery, adding that he transmitted from him and he from him, and that he was of considerable piety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} Al-Dhahabi notes that he wrote a supplement to the book al-Isti'ab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} The cited sources are Ibn Bashkuwal's al-Sila and al-Dhahabi's Tarikh al-Islam under the deaths of 450-550 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18065} The heading prints two figures, 544 and 489, without saying which is the birth and which the death."
