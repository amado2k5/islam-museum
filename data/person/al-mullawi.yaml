summary: {ar: أحمد بن عبد الفتاح الملوي المجيري، أبو العباس شهاب الدين، شافعي أزهري وصفه الزركلي بشيخ الشيوخ في عصره، حموي الأصل، ولد ومات بالقاهرة ١٠٨٨ إلى ١١٨١ هـ الموافقة ١٦٧٧ إلى ١٧٦٧ م، وله شروح وحواش في المنطق والتوحيد والبلاغة., en: 'Ahmad ibn Abd al-Fattah al-Mullawi al-Mujiri, Abu al-Abbas Shihab al-Din, a Shafi''i of al-Azhar whom al-Zirikli calls the shaykh of the shaykhs of his age, of Hamawi origin, born and died in Cairo, 1088 to 1181 AH (1677 to 1767 CE), author of commentaries and glosses in logic, theology and rhetoric.', fr: "Ahmad ibn Abd al-Fattah al-Mullawi al-Mujiri, Abu al-Abbas Shihab al-Din, un Shafi'i d'al-Azhar qu'al-Zirikli appelle le shaykh des shaykhs de son âge, d'origine Hamawi, né et mort au Caire, 1088 à 1181 de l’hégire (1677 à 1767 de notre ère), auteur de commentaires et de la rhétorique.", es: "Ahmad ibn Abd al-Fattah al-Mullawi al-Mujiri, Abu al-Abbas Shihab al-Din, un shafi'i de al-Azhar a quien al-Zirikli llama el shaykh de los shaykhs de su época, de origen hamawi, nacido y muerto en El Cairo, 1088 a 1181 AH (1677 a 1767 d. C.), autor de comentarios y glosas en lógica, teología y retórica.", ur: "احمد بن عبد الفتاح الملوی المجیری، ابو العباس شہاب الدین، الازہر کا ایک شافعی جسے الزرکلی اپنی عمر کے شیخوں کا شیخ کہتا ہے، حماوی نژاد، قاہرہ میں پیدا ہوا اور وفات پائی، 1086ء تا 1187ھ ⁦(1086ء تا 1187ء)⁩ منطق، الہیات اور بیان بازی میں تفسیروں اور گلوز کے مصنف۔", tr: "Ahmed ibn Abd al-Fattah al-Mulawi al-Mujiri, Ebu el-Abbas Şihab al-Din, el-Zerkali'nin zamanının şeyhi olarak tanımladığı bir Azhari Şafi'ydi ve aslen Hama'dandı. 1088-1181 Hicri yılları arasında Kahire'de doğdu ve öldü, bu da 1677-1767 yıllarına karşılık geliyordu. Ayrıca mantık, tek tanrıcılık ve retorik üzerine yorumlar ve notlar yazdı.", id: "Ahmad ibn Abd al-Fattah al-Mulawi al-Mujiri, Abu al-Abbas Shihab al-Din, adalah seorang Azhari Shafi'i yang digambarkan al-Zarkali sebagai sheikh pada zamannya, berasal dari Hama. Ia lahir dan meninggal di Kairo dari tahun 1088 hingga 1181 H, yang bertepatan dengan tahun 1677 hingga 1767 M. Ia juga menulis komentar dan catatan tentang logika, monoteisme, dan retorika."}
