    summary:
      ar: "قال البخاري: تركه يحيى وابن مهدي؛ وقال ابن معين: ليس بثقة؛ والجوزجاني وغيره: كذاب؛ والدارقطني وجماعة: متروك؛ وابن حبان: وضوح الكذب فيه أظهر من أن يحتاج إلى الإغراق في وصفه، وأبو صالح لم ير ابن عباس، ولا يحل الاحتجاج به؛ وسئل أحمد: يحل النظر في تفسير الكلبي؟ قال: لا."
      en: "Al-Bukhari: Yahya and Ibn Mahdi abandoned him; Ibn Ma'in: not trustworthy; al-Juzjani and others: a liar; al-Daraqutni and others: abandoned; Ibn Hibban: his lying is too evident to need describing, Abu Salih never saw Ibn Abbas, and he may not be cited as proof; Ahmad, asked whether one may read al-Kalbi's tafsir, said no."
