summary:
  ar: "أبو النضر محمد بن السائب الكلبي الكوفي، المفسر النسابة الأخباري، والد هشام الكلبي. روى عن الشعبي وجماعة، وروى عنه ابنه هشام وأبو معاوية، ويعدّه ابن النديم أحد النسابين. ترجمه الذهبي في «ميزان الاعتدال» ونقل فيه أشد أقوال نقاد الحديث: تركه يحيى القطان وابن مهدي، وقال ابن معين: ليس بثقة، والجوزجاني: كذاب، والدارقطني: متروك، وقال ابن عدي إن جماعة رضوه في التفسير وإن في حديثه مناكير، ولا سيما روايته عن أبي صالح عن ابن عباس {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
  en: "Abu al-Nadr Muhammad ibn al-Sa'ib al-Kalbi of Kufa, the exegete, genealogist and reporter of history, father of Hisham al-Kalbi. He narrated from al-Sha'bi and others, his son Hisham and Abu Mu'awiya narrated from him, and Ibn al-Nadim counts him among the genealogists. Al-Dhahabi's Mizan al-I'tidal collects the hadith critics' severest verdicts on him: Yahya al-Qattan and Ibn Mahdi abandoned him, Ibn Ma'in said he was not trustworthy, al-Juzjani called him a liar and al-Daraqutni 'abandoned', while Ibn Adi said a number of scholars accepted him in exegesis but his hadith contains objectionable reports, especially his chain from Abu Salih from Ibn Abbas {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
  ur: "ابو النضر محمد بن السائب کلبی کوفی، مفسر، نسب دان اور اخباری، ہشام کلبی کے والد۔ انہوں نے شعبی وغیرہ سے روایت کی، اور ان سے ان کے بیٹے ہشام اور ابو معاویہ نے روایت کی؛ ابن الندیم انہیں نسب دانوں میں شمار کرتے ہیں۔ ذہبی کی «میزان الاعتدال» ان کے بارے میں ناقدینِ حدیث کے سخت ترین اقوال جمع کرتی ہے: یحییٰ قطان اور ابن مہدی نے انہیں ترک کیا، ابن معین نے کہا ثقہ نہیں، جوزجانی نے کذاب اور دارقطنی نے متروک کہا؛ جبکہ ابن عدی کے مطابق ایک جماعت نے تفسیر میں انہیں قبول کیا مگر ان کی حدیث میں منکر روایات ہیں، خصوصاً ابو صالح عن ابن عباس کی سند سے {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}۔"
  es: "Abu al-Nadr Muhammad ibn al-Sa'ib al-Kalbi de Kufa, el exegeta, genealogista y cronista histórico, padre de Hisham al-Kalbi. Narró de al-Sha'bi y otros, su hijo Hisham y Abu Mu'awiya narraron de él, e Ibn al-Nadim lo cuenta entre los genealogistas. El Mizan al-I'tidal de Al-Dhahabi recopila los veredictos más severos de los críticos de hadices sobre él: Yahya al-Qattan e Ibn Mahdi lo abandonaron, Ibn Ma'in dijo que no era digno de confianza, al-Juzjani lo llamó mentiroso y al-Daraqutni lo 'abandonó', mientras que Ibn Adi dijo que varios eruditos lo aceptaron en la exégesis, pero su hadiz contiene informes objetables, especialmente su cadena de Abu Salih de Ibn Abbas {cite:mizan-itidal-bijawi-v3 p. 556-559} {cita: fihrist-ibn-al-nadim p. 299-300}."
  fr: "Abou al-Nadr Muhammad ibn al-Sa'ib al-Kalbi de Koufa, exégète, généalogiste et historien, père d'Hisham al-Kalbi, a rapporté des hadiths d'al-Sha'bi et d'autres. Son fils Hisham et Abou Mu'awiya ont également rapporté des hadiths de lui, et Ibn al-Nadim le compte parmi les généalogistes. Le Mizan al-I'tidal d'al-Dhahabi rassemble les critiques les plus sévères à son égard: Yahya al-Qattan et Ibn Mahdi l'ont abandonné, Ibn Ma'in a déclaré qu'il n'était pas digne de confiance, al-Juzjani l'a traité de menteur et al-Daraqutni l'a « abandonné », tandis qu'Ibn Adi a indiqué que plusieurs savants l'acceptaient en matière d'exégèse, mais que ses hadiths contenaient des récits contestables, notamment sa chaîne de transmission d'Abou Salih d'après Ibn Abbas (voir: Mizan al-I'tidal, Bijawi, vol. 3, p. 1). 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
  tr: "Ebu el-Nadir Muhammed bin el-Saib el-Kalbi el-Kufi, soybilimci ve rivayetçi, Hişam el-Kalbi'nin babasıdır. El-Şa'bi ve bir gruptan rivayet etti, oğlu Hişam ve Ebu Muaviye ondan rivayet etti ve İbn el-Nadim onu soybilimcilerden biri olarak kabul etti. El-Dhahabi bunu 'Mizan al-I'tidal'a çevirdi ve hadis eleştirmenlerinin en sert görüşlerini aktardı: Yahya al-Qattan ve İbn Mehdi onu terk etti. İbn Ma'in şöyle dedi: O güvenilir değil, el-Cüzeni yalancıdır ve el-Daraqutni terk edilmiştir. İbn 'Adi, bir grubun onu tefsirde kabul ettiğini, ancak hadislerinde kusurlar olduğunu, özellikle İbn Abbas'tan Ebu Salih rivayetinde {atıf: mizan-itidal-bijawi-v3 s. 556-559} {cite:fihrist-ibn-al-nadim s. 299-300}."
  id: "Abu al-Nadr Muhammad ibn al-Sa'ib al-Kalbi al-Kufi, ahli silsilah dan narator, ayah dari Hisham al-Kalbi. Ia menceritakan dari al-Sha'bi dan kelompoknya, dan putranya Hisham dan Abu Muawiya menceritakan darinya, dan Ibn al-Nadim menganggapnya sebagai salah satu ahli silsilah. Al-Dhahabi menerjemahkannya dalam 'Mizan al-I'tidal' dan mengutip pendapat paling keras para kritikus hadits: Yahya al-Qattan dan Ibn Mahdi meninggalkannya. Ibn Ma'in berkata: Ia tidak dapat dipercaya, al-Juzjani adalah pembohong, dan al-Daraqutni ditinggalkan. Ibn 'Adi mengatakan bahwa sekelompok orang menerimanya dalam tafsir, meskipun ada cacat dalam haditsnya, terutama riwayatnya dari Abu Salih dari Ibn Abbas {cite:Mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
