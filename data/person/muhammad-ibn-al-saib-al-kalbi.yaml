summary:
  ar: "أبو النضر محمد بن السائب الكلبي الكوفي، المفسر النسابة الأخباري، والد هشام الكلبي. روى عن الشعبي وجماعة، وروى عنه ابنه هشام وأبو معاوية، ويعدّه ابن النديم أحد النسابين. ترجمه الذهبي في «ميزان الاعتدال» ونقل فيه أشد أقوال نقاد الحديث: تركه يحيى القطان وابن مهدي، وقال ابن معين: ليس بثقة، والجوزجاني: كذاب، والدارقطني: متروك، وقال ابن عدي إن جماعة رضوه في التفسير وإن في حديثه مناكير، ولا سيما روايته عن أبي صالح عن ابن عباس {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
  en: "Abu al-Nadr Muhammad ibn al-Sa'ib al-Kalbi of Kufa, the exegete, genealogist and reporter of history, father of Hisham al-Kalbi. He narrated from al-Sha'bi and others, his son Hisham and Abu Mu'awiya narrated from him, and Ibn al-Nadim counts him among the genealogists. Al-Dhahabi's Mizan al-I'tidal collects the hadith critics' severest verdicts on him: Yahya al-Qattan and Ibn Mahdi abandoned him, Ibn Ma'in said he was not trustworthy, al-Juzjani called him a liar and al-Daraqutni 'abandoned', while Ibn Adi said a number of scholars accepted him in exegesis but his hadith contains objectionable reports, especially his chain from Abu Salih from Ibn Abbas {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}."
  ur: "ابو النضر محمد بن السائب کلبی کوفی، مفسر، نسب دان اور اخباری، ہشام کلبی کے والد۔ انہوں نے شعبی وغیرہ سے روایت کی، اور ان سے ان کے بیٹے ہشام اور ابو معاویہ نے روایت کی؛ ابن الندیم انہیں نسب دانوں میں شمار کرتے ہیں۔ ذہبی کی «میزان الاعتدال» ان کے بارے میں ناقدینِ حدیث کے سخت ترین اقوال جمع کرتی ہے: یحییٰ قطان اور ابن مہدی نے انہیں ترک کیا، ابن معین نے کہا ثقہ نہیں، جوزجانی نے کذاب اور دارقطنی نے متروک کہا؛ جبکہ ابن عدی کے مطابق ایک جماعت نے تفسیر میں انہیں قبول کیا مگر ان کی حدیث میں منکر روایات ہیں، خصوصاً ابو صالح عن ابن عباس کی سند سے {cite:mizan-itidal-bijawi-v3 p. 556-559} {cite:fihrist-ibn-al-nadim p. 299-300}۔"
