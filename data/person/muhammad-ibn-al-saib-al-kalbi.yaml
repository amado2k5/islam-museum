      en: "Ibn Adi: Sufyan, Shu'ba and others narrated from him and accepted him in exegesis, but in hadith he has objectionable reports, especially from Abu Salih from Ibn Abbas; al-Thawri is reported to have said: beware of al-Kalbi — and when told he himself narrated from him, he said: I know his truth from his lies."
