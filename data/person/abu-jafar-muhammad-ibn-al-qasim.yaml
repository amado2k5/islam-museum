id: person/abu-jafar-muhammad-ibn-al-qasim
class: person
label: { ar: "أبو جعفر محمد بن القاسم بن عبيد الله", en: "Abu Jafar Muhammad ibn al-Qasim ibn Ubayd Allah", fr: "Abu Jafar Muhammad ibn al-Qasim ibn Ubayd Allah", es: "Abu Jafar Muhammad ibn al-Qasim ibn Ubayd Allah", ur: "ابو جعفر محمد بن القاسم بن عبید اللہ" }
summary:
  ar: "كان من أصحاب ابن مقلة وصاحب مشورته فراسله القاهر ووعده الوزارة، واستوزره القاهر مستهل شعبان سنة 321هـ بعد عزل ابن مقلة وخلع عليه {cite:kamil-ibn-al-athir p. 187-191}."
  en: "Ibn Muqla's own counsellor, secretly wooed by al-Qahir with the promise of office and made vizier over him in Sha'ban 321 {cite:kamil-ibn-al-athir p. 187-191}."
  fr: "Le propre conseiller d'Ibn Muqla, secrètement courtisé par al-Qahir avec la promesse d'une charge et fait vizir à sa place en sha'ban 321 {cite:kamil-ibn-al-athir p. 187-191}."
  es: "El propio consejero de Ibn Muqla, cortejado secretamente por al-Qahir con la promesa de un cargo y nombrado visir sobre él en Sha'ban 321 {cite:kamil-ibn-al-athir p. 187-191}."
  ur: "ابن مقلہ کا اپنا مشیر، جسے القاہر نے خفیہ طور پر عہدہ کے وعدے کے ساتھ آمادہ کیا اور شعبان 321 میں اس کا وزیر بنایا۔ 187-191}۔"
  tr: "İbn Muqlah'ın arkadaşlarından ve danışmanlarından biriydi, bu yüzden Al-Qahir onunla yazıştı ve ona bakanlık sözü verdi. Al-Qahir, İbn Muqlah'ı görevden aldıktan ve ona şeref cübbesi verdikten sonra, Hicri 321 yılının Şaban ayının başında onu bakan olarak atadı. {Kaynak: Kamil-ibn-al-athir s. 187-191}"
  id: "Dia adalah salah satu sahabat dan penasihat Ibn Muqlah, sehingga Al-Qahir berkorespondensi dengannya dan menjanjikan jabatan menteri kepadanya, dan Al-Qahir mengangkatnya sebagai menterinya pada awal bulan Sya'ban tahun 321 H setelah memecat Ibn Muqlah dan menganugerahinya jubah kehormatan {cite:kamil-ibn-al-athir hlm. 187-191}."
