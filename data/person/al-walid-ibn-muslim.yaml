summary:
  ar: "الوليد بن مسلم، أبو العباس الدمشقي، مولى بني أمية، الحافظ، صاحب الأوزاعي، حدّث عن الأوزاعي وسفيان الثوري ومالك والليث وغيرهم، وحدّث عنه الليث بن سعد وبقية بن الوليد وعبد الله بن وهب وأحمد بن حنبل وغيرهم، وأجمعوا على جلالته وتوثيقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16652} وله نحو سبعين كتاباً في الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16652}"
  en: "al-Walid ibn Muslim, Abu al-Abbas of Damascus, a client of the Umayyads, a hadith master and companion of al-Awza'i. He transmitted from al-Awza'i, Sufyan al-Thawri, Malik and al-Layth, and from him al-Layth ibn Sa'd, Baqiyya ibn al-Walid, Abd Allah ibn Wahb and Ahmad ibn Hanbal. Scholars agreed on his standing and reliability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16652} He is credited with some seventy books of hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16652}"
