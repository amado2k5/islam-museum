summary:
  ar: "جيرون بن سعد بن عاد حل بدمشق فمصر مصرها وجمع عمد الرخام والمرمر إليها وشيد بنيانها وسماها إرم ذات العماد، والموضع بدمشق سنة اثنتين وثلاثين وثلثمائة سوق من أسواقها عند باب المسجد الجامع يعرف بجيرون وجيرون بنيان عظيم كان قصر هذا الملك عليه أبواب من نحاس عجيبة {cite:muruj-al-dhahab p. 449}."
  en: "The 'Adite who settled Damascus, raised its marble-columned buildings and named them Iram dhat al-'imad — his palace surviving in al-Mas'udi's own day (332 AH) as the Jayrun market beside the congregational mosque, with marvellous bronze doors {cite:muruj-al-dhahab p. 449}."
