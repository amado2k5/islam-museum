summary:
  ar: "جيرون بن سعد بن عاد حل بدمشق فمصر مصرها وجمع عمد الرخام والمرمر إليها وشيد بنيانها وسماها إرم ذات العماد، والموضع بدمشق سنة اثنتين وثلاثين وثلثمائة سوق من أسواقها عند باب المسجد الجامع يعرف بجيرون وجيرون بنيان عظيم كان قصر هذا الملك عليه أبواب من نحاس عجيبة {cite:muruj-al-dhahab p. 449}."
  en: "The 'Adite who settled Damascus, raised its marble-columned buildings and named them Iram dhat al-'imad — his palace surviving in al-Mas'udi's own day (332 AH) as the Jayrun market beside the congregational mosque, with marvellous bronze doors {cite:muruj-al-dhahab p. 449}."
  es: "El 'Adite que se estableció en Damasco, erigió sus edificios con columnas de mármol y los llamó Iram dhat al-'imad; su palacio sobrevivió en la época de al-Mas'udi (332 AH) como el mercado de Jayrun junto a la mezquita congregacional, con maravillosas puertas de bronce {cite:muruj-al-dhahab p. 449}."
  fr: "L'Adite qui s'est installé à Damas, a fait construire ses bâtiments à colonnes de marbre et les a nommés Iram dhat al-'imad — son palais survivant à l'époque d'al-Mas'udi (332 AH) sous le nom de marché Jayrun à côté de la mosquée du vendredi, avec de merveilleuses portes en bronze {cite:muruj-al-dhahab p. 449}."
  ur: "عادیت نے جس نے دمشق کو آباد کیا، اس کی سنگ مرمر سے بنی عمارتیں بلند کیں اور ان کا نام ارم غط العماد رکھا - اس کا محل المسعودی کے اپنے دور ⁦(332 ہجری)⁩ میں اجتماعی مسجد کے ساتھ جیرون بازار کے طور پر زندہ رہا، جس میں پیتل کے شاندار دروازے تھے۔ 449}۔"
