summary:
  ar: "عالم جنوب أفريقي في الدراسات الإسلامية ⁦(وُلد سنة 1957)⁩، أستاذ كرسي ميرزا للفكر الإسلامي والمجتمعات المسلمة في جامعة نوتر دام، ودرّس قبلها في ديوك وكيب تاون. تربّى علمياً في دار العلوم ندوة العلماء في لكناو، ومن كتبه «الغزالي وشاعرية الخيال» (2005) و«ما هي المدرسة؟» (2015)."
  en: "South African scholar of Islam (born 1957), Mirza Family Professor of Islamic Thought and Muslim Societies at the University of Notre Dame, previously at Duke University and the University of Cape Town. Trained at Darul Ulum Nadwatul Ulama in Lucknow, he wrote Ghazali and the Poetics of Imagination (2005) and What Is a Madrasa? (2015)."
  ur: "جنوبی افریقی عالمِ اسلام ⁦(پیدائش 1957ء)⁩، یونیورسٹی آف نوٹرے ڈیم میں فکرِ اسلامی اور مسلم معاشروں کے پروفیسر؛ اس سے پہلے ڈیوک یونیورسٹی اور کیپ ٹاؤن یونیورسٹی میں تدریس کی۔ لکھنؤ کی دار العلوم ندوۃ العلماء سے تربیت یافتہ؛ ان کی کتابوں میں «غزالی اور شاعریتِ تخیّل» ⁦(2005ء)⁩ شامل ہے۔"
  es: "Erudito sudafricano especializado en el islam (nacido en 1957), profesor de la Cátedra Mirza de Pensamiento Islámico y Sociedades Musulmanas en la Universidad de Notre Dame, anteriormente en la Universidad de Duke y la Universidad de Ciudad del Cabo. Formado en Darul Ulum Nadwatul Ulama en Lucknow, es autor de Ghazali and the Poetics of Imagination (2005) y What Is a Madrasa? (2015)."
  fr: "Érudit sud-africain spécialiste de l'islam (né en 1957), professeur titulaire de la chaire Mirza de pensée islamique et de sociétés musulmanes à l'Université de Notre Dame, après avoir enseigné à l'Université Duke et à l'Université du Cap. Formé à Darul Ulum Nadwatul Ulama à Lucknow, il est l'auteur de Ghazali and the Poetics of Imagination (2005) et de What Is a Madrasa? (2015)."
  tr: "Güney Afrikalı İslam bilimleri akademisyeni (1957 doğumlu), Notre Dame Üniversitesi'nde İslami Düşünce ve Müslüman Toplumları Mirza Kürsüsü Profesörü ve daha önce Duke ile Cape Town'da ders vermiştir. Lucknow'daki Dar Al-Uloom Nadwa Al-Ulama'da akademik eğitim aldı ve kitapları arasında \"Al-Ghazali and the Poetics of Imagination\" (2005) ve \"What is a School?\" yer alıyor. (2015)."
  id: "Seorang sarjana studi Islam asal Afrika Selatan (lahir 1957), Profesor Mirza Chair of Islamic Thought and Muslim Societies di University of Notre Dame, dan sebelumnya mengajar di Duke dan Cape Town. Ia menempuh pendidikan akademis di Dar Al-Uloom Nadwa Al-Ulama di Lucknow, dan buku-bukunya meliputi \"Al-Ghazali and the Poetics of Imagination\" (2005) dan \"What is a School?\" (2015)."
