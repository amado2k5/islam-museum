summary:
  ar: "عالم جنوب أفريقي في الدراسات الإسلامية (وُلد سنة 1957)، أستاذ كرسي ميرزا للفكر الإسلامي والمجتمعات المسلمة في جامعة نوتر دام، ودرّس قبلها في ديوك وكيب تاون. تربّى علمياً في دار العلوم ندوة العلماء في لكناو، ومن كتبه «الغزالي وشاعرية الخيال» (2005) و«ما هي المدرسة؟» (2015)."
  en: "South African scholar of Islam (born 1957), Mirza Family Professor of Islamic Thought and Muslim Societies at the University of Notre Dame, previously at Duke University and the University of Cape Town. Trained at Darul Ulum Nadwatul Ulama in Lucknow, he wrote Ghazali and the Poetics of Imagination (2005) and What Is a Madrasa? (2015)."
  ur: "جنوبی افریقی عالمِ اسلام (پیدائش 1957ء)، یونیورسٹی آف نوٹرے ڈیم میں فکرِ اسلامی اور مسلم معاشروں کے پروفیسر؛ اس سے پہلے ڈیوک یونیورسٹی اور کیپ ٹاؤن یونیورسٹی میں تدریس کی۔ لکھنؤ کی دار العلوم ندوۃ العلماء سے تربیت یافتہ؛ ان کی کتابوں میں «غزالی اور شاعریتِ تخیّل» (2005ء) شامل ہے۔"
