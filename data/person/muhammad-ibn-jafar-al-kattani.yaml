summary:
  ar: "محدث وببليوغراف ومؤرخ مغربي ⁦(1857–1927)⁩ من بيت الكتاني العلمي بفاس. من مؤلفاته «الرسالة المستطرفة لبيان مشهور كتب السنة المشرفة» في وصف مصنفات الحديث، و«نظم المتناثر من الحديث المتواتر»، و«سلوة الأنفاس ومحادثة الأكياس» في تراجم علماء الإسلام."
  en: "Moroccan hadith scholar, bibliographer and historian (1857–1927) of the learned Kattani house of Fez. His works include Al-Risala al-Mustatrafa on the famous books of the Sunna, Nazm al-Mutanathir on mutawatir hadith, and Salwat al-Anfas, a biographical dictionary of Muslim scholars."
  ur: "مغربی محدث، کتابیات دان اور مورخ ⁦(1857–1927)⁩ جو فاس کے علمی کتانی خاندان سے تھے۔ ان کی تصانیف میں کتبِ سنت کے احوال پر «الرسالۃ المستطرفۃ»، متواتر حدیث پر «نظم المتناثر» اور علمائے اسلام کے تراجم پر «سلوۃ الانفاس» شامل ہیں۔"
  es: "Erudito marroquí de hadices, bibliógrafo e historiador (1857-1927) perteneciente a la prestigiosa familia Kattani de Fez. Entre sus obras destacan Al-Risala al-Mustatrafa, sobre los libros más conocidos de la Sunna; Nazm al-Mutanathir, sobre los hadices mutawatir; y Salwat al-Anfas, un diccionario biográfico de eruditos musulmanes."
  fr: "Érudit marocain du hadith, bibliographe et historien (1857-1927) de la célèbre famille Kattani de Fès. Parmi ses œuvres figurent Al-Risala al-Mustatrafa sur les ouvrages célèbres de la Sunna, Nazm al-Mutanathir sur le hadith mutawatir et Salwat al-Anfas, un dictionnaire biographique de savants musulmans."
  tr: "Fez'deki Al-Kattani Bilim Evi'nden hadis âlimi, bibliyograf ve Faslı tarihçi (1857–1927) bulunmaktadır. Eserleri arasında \"Al-Risala Al-Mustarefa li Bayan Mashhoor Kutub Al-Sunnah\", hadis eserlerini anlatan \"Nazm Al-Mutanatar min Hadis'El-Muwattir\" ve İslam âlimlerinin biyografilerinde \"Salwat Al-Anfas wa Muhadasat Al-Akyas\" yer almaktadır."
  id: "Seorang cendekiawan hadits, bibliografer, dan sejarawan Maroko (1857–1927) dari Rumah Ilmiah Al-Kattani di Fez. Di antara karyanya adalah \"Al-Risala Al-Mustarefa li Bayan Mashhoor Kutub Al-Sunnah\" yang menggambarkan karya-karya hadis, \"Nazm Al-Mutanatar min Hadith Al-Muwattir,\" dan \"Salwat Al-Anfas wa Muhadasat Al-Akyas\" dalam biografi para ulama Islam."
