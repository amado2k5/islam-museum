summary:
  ar: أسقف القبط بالإسكندرية عند الفتح، يذكر ابن عبد الحكم عن مشايخ أهل مصر أنه لما بلغه قدوم عمرو بن العاص كتب إلى القبط يعلمهم أنه لا تكون للروم دولة وأن ملكهم قد انقطع، ويأمرهم بتلقي عمرو {cite:futuh-misr-amir-1999 p. 86}.
  en: The Coptic bishop at Alexandria at the time of the conquest. Ibn Abd al-Hakam reports from elders of Egypt that, on hearing of Amr ibn al-As's arrival, he wrote to the Copts that the Romans would have no more rule, that their kingdom was ended, and told them to go out to meet Amr {cite:futuh-misr-amir-1999 p. 86}.
  ur: فتح کے وقت اسکندریہ میں قبطیوں کے اسقف۔ ابن عبد الحکم مصر کے بزرگوں سے نقل کرتے ہیں کہ جب انہیں عمرو بن العاص کی آمد کی خبر ملی تو انہوں نے قبطیوں کو لکھا کہ رومیوں کی حکومت نہیں رہے گی اور ان کی بادشاہت ختم ہو چکی، اور انہیں عمرو کا استقبال کرنے کا حکم دیا {cite:futuh-misr-amir-1999 p. 86}۔
