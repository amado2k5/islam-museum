summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك هرمز بن سابور» {cite:tabari-tarikh-abu-al-fadl j.2 p.51}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Pers kralları arasında bir kral, el-Tabari'nin 'Hürmüz Kralı ibn Sabour'un Bahsi' başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl j.2 s.51}. Bu yerde, saltanatı yılları ve hikâyeleri hakkında söylenenler anlatılır."
  id: "Seorang raja di antara raja-raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul 'Sebutan Raja Hormuz ibn Sabour' {cite:tabari-tarikh-abu-al-fadl j.2 hlm.51}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
