summary:
  ar: "لاعب سلامة في كرة القدم الأمريكية (وُلد سنة 1985) من لوس أنجلوس، لعب سبعة مواسم في NFL مع مينيسوتا وكانساس سيتي؛ مسلم ملتزم صام رمضان أثناء الموسم، وتخلّف عن موسم 2012 لأداء الحج مع أخيه حمزة، واعتزل سنة 2016 بعد خمس إصابات ارتجاج."
