summary:
  ar: "أبو العباس أحمد بن هارون الرشيد بن المهدي بن المنصور الهاشمي؛ كان عبداً صالحاً ترك الدنيا في حياة أبيه مع القدرة وآثر الانقطاع والعزلة، وإنما لُقِّب لأنه كان يعمل بيده في يوم السبت شيئاً ينفقه في بقية الأسبوع ويتفرغ للعبادة، وذكره ابن الجوزي في صفوة الصفوة {cite:wafayat-ayan}."
  en: "Ahmad b. Harun al-Rashid — the ascetic Abbasid prince who renounced the world in his father's lifetime, earning his keep with his own hands on Saturdays and devoting the rest of the week to worship {cite:wafayat-ayan}."
  fr: "Ahmad b. Harun al-Rashid, prince abbasside ascète qui renonça au monde du vivant de son père, gagnant sa subsistance de ses mains le samedi et consacrant le reste de la semaine au culte {cite:wafayat-ayan}."
  es: "Ahmad b. Harun al-Rashid — el príncipe abasí asceta que renunció al mundo en vida de su padre, ganándose el sustento con sus propias manos los sábados y dedicando el resto de la semana a la adoración {cite:wafayat-ayan}."
  ur: "احمد بی۔ ہارون الرشید - ایک سنیاسی عباسی شہزادہ جس نے اپنے والد کی زندگی میں دنیا کو خیرباد کہہ دیا، ہفتہ کے دن اپنے ہاتھوں سے اپنا ذخیرہ کمایا اور باقی ہفتہ عبادت کے لیے وقف کیا۔"
  tr: "Ebu el-Abbas Ahmed ibn Harun el-Raşid ibn el-Mehdi ibn el-Mansur el-Haşimi; babasının hayatta olduğu dönemde, yeteneğine rağmen dünyayı terk eden ve inzivayı ve yalnızlığı tercih eden salih bir kuldu. Bu unvanı, cumartesi günleri elleriyle çalışıp, haftanın geri kalanını kazancıyla geçirip, kendini ibadete adadığı için almıştır. İbn el-Cevzi, Safvat el-Safva'da ondan bahsetmiştir."
  id: "Abu al-Abbas Ahmad ibn Harun al-Rashid ibn al-Mahdi ibn al-Mansur al-Hashimi; beliau adalah seorang hamba yang saleh yang meninggalkan dunia selama masa hidup ayahnya, meskipun beliau memiliki kemampuan, dan lebih memilih menyendiri dan mengasingkan diri. Beliau diberi gelar ini karena beliau bekerja dengan tangannya pada hari Sabtu, menghabiskan sisa minggu dengan hasil kerjanya, dan mengabdikan diri untuk beribadah. Ibn al-Jawzi menyebutkannya dalam Safwat al-Safwa {cite:wafayat-ayan}."
