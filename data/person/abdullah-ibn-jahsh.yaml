summary:
  ar: من السابقين، حليف بني عبد شمس؛ هاجر إلى الحبشة وشهد بدراً، وبعثه النبي إلى نخلة، ويروى أنه كان أول أمير في الإسلام وأن أول راية عُقدت له؛ استشهد بأحد ودُفن مع حمزة في قبر واحد، ولقبه الزبير بن بكار «المجدع في الله».
  en: One of the earliest Muslims and an ally of Banu Abd Shams; he emigrated to Abyssinia and fought at Badr; the Prophet sent him to Nakhla, and reports say he was the first commander in Islam and the first to be given a banner; he was killed
    at Uhud and buried in one grave with Hamza, and al-Zubayr ibn Bakkar says he was nicknamed 'the one mutilated for God'.
  ur: "ابتدائی مسلمانوں میں سے؛ حبشہ ہجرت کی، نخلہ کی مہم کی قیادت کی اور بدر میں شریک ہوئے؛ احد میں مارے گئے اور حمزہ کے ساتھ ایک قبر میں دفن ہوئے۔ {cite:ibn-hajar-isaba}"
