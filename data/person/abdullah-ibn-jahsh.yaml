summary:
  ar: من السابقين، حليف بني عبد شمس؛ هاجر إلى الحبشة وشهد بدراً، وبعثه النبي إلى نخلة، ويروى أنه كان أول أمير في الإسلام وأن أول راية عُقدت له؛ استشهد بأحد ودُفن مع حمزة في قبر واحد، ولقبه الزبير بن بكار «المجدع في الله».
  en: One of the earliest Muslims and an ally of Banu Abd Shams; he emigrated to Abyssinia and fought at Badr; the Prophet sent him to Nakhla, and reports say he was the first commander in Islam and the first to be given a banner; he was killed
    at Uhud and buried in one grave with Hamza, and al-Zubayr ibn Bakkar says he was nicknamed 'the one mutilated for God'.
  ur: "ابتدائی مسلمانوں میں سے؛ حبشہ ہجرت کی، نخلہ کی مہم کی قیادت کی اور بدر میں شریک ہوئے؛ احد میں مارے گئے اور حمزہ کے ساتھ ایک قبر میں دفن ہوئے۔ {cite:ibn-hajar-isaba}"
  fr: "L'un des tout premiers musulmans et allié des Banu Abd Shams ; il émigra en Abyssinie et combattit à Badr ; le Prophète l'envoya à Nakhla, et des récits disent qu'il fut le premier commandant de l'islam et le premier à recevoir une bannière ; il fut tué à Uhud et enterré dans une même tombe avec Hamza, et al-Zubayr ibn Bakkar dit qu'on le surnommait « celui qui fut mutilé pour Dieu »."
  es: "Fue uno de los primeros musulmanes y aliado de Banu Abd Shams; emigró a Abisinia y luchó en Badr; el Profeta lo envió a Nakhla, y según los relatos, fue el primer comandante del Islam y el primero en recibir un estandarte; murió en Uhud y fue enterrado en una tumba con Hamza, y al-Zubayr ibn Bakkar dice que lo apodaron \"el mutilado por Dios\"."
  tr: "Öncekilerden, Beni Abd Şems'in bir müttefikiydi; Habeşistan'a hicret etti ve Bedir Savaşı'na şahit oldu. Peygamber onu Nahla'ya gönderdi ve rivayete göre İslam'da ilk komutan oldu ve ilk sancak onun için dikildi. Uhud'da şehit oldu ve Hamza ile aynı mezara defnedildi. Zübeyr ibn Bakkar ona \"Allah yolunda sakatlanan\" lakabını taktı."
  id: "Dari tokoh-tokoh sebelumnya, seorang sekutu Banu Abd Shams; ia berhijrah ke Abyssinia dan menyaksikan Perang Badar, dan Nabi mengutusnya ke Nakhla, dan diriwayatkan bahwa ia adalah komandan pertama dalam Islam dan panji pertama dikibarkan untuknya; ia gugur sebagai syahid di Uhud dan dimakamkan bersama Hamza dalam satu kuburan, dan Al-Zubayr ibn Bakkar memberinya julukan \"orang yang cacat karena Allah\"."
