label:
  ar: "أبو عيسى الأصفهاني"
  en: "Abu Isa al-Isfahani"
  ur: "ابو عیسیٰ اصفہانی"
summary:
  ar: "أبو عيسى الأصفهاني، يهودي ادّعى المسيحية في عهد عبد الملك بن مروان أو مروان الثاني، وأقر بصحة الإسلام والنصرانية لغير اليهود، وقُتل في معركة مع المسلمين، وبقيت طائفته العيسوية إلى القرن العاشر الميلادي. {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
  en: "Abu Isa al-Isfahani, a Jewish pretender to the title of Messiah under the Umayyad 'Abd al-Malik b. Marwan (or, according to others, Marwan II), who accepted Islam and Christianity as valid for non-Jews, was killed in battle against the Muslims, and whose sect, the Isawiyya, survived into the tenth century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
  ur: "ابو عیسیٰ اصفہانی، یہودی مدعی مسیحیت، جو اموی خلیفہ عبدالملک بن مروان (یا دوسروں کے مطابق مروان ثانی) کے دور میں ظاہر ہوئے، اور غیر یہودیوں کے لیے اسلام اور عیسائیت دونوں کے درست ہونے کا اقرار کیا، مسلمانوں سے جنگ میں مارے گئے، اور ان کا فرقہ العیسویہ دسویں صدی تک باقی رہا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
