summary:
  ar: "بدر الدين إسماعيل بن أحمد النابلسي الشافعي مفتي الشام؛ ولد سنة سبع وثلاثين وتسعمائة بدمشق ونشأ يتيم الأب طالباً للعلم وسمع الحديث على الشيخ نصر الحموي ومحيي الدين النحاس وغيرهما وقرأ على الزكريا وأخذ عن البقاعي وقاضي زادة وابن طولون والصفدي والملا عبد القادر البغدادي والشيخ إبراهيم بن بنت عون، وصار يدرّس في السادسة عشرة من عمره بمدرسة الطرائفية، ولم يزل مجتهداً في طلب العلم والاشتغال به حتى برع في فنون كثيرة كالنحو واللغة والفقه والأصول وعلم الكلام والطب والفرائض والعروض، وأجازه الشيخ أبو الحسن البكري ووقف في نهار يناير على منصب الإفتاء بدمشق وقام به أحسن قيام، وتولى في آخر عمره مشيخة التدريس بالظاهرية وجمع بينها وبين الإفتاء؛ وكان نزيهاً عن الاستيلاء من المكاسب والرشوة وجعل الاستعلاء في طلبته وسكناه على سطح داره، ومن تصانيفه شرح العقيدة النسفية وشرح ألفية العراقي والمستقصى منه في اختلاف الأئمة الثلاثة وعقد فهرسه؛ وعزله الخادم مراد بيك عن الإفتاء سنة ثلاثة وتسعين، وتوفي يوم السبت ثالث عشر محرم ودُفن عند أستاذه ملا عبد القادر البغدادي {cite:shadharat-dhahab p. 433-434}."
  en: "Badr al-Din Isma'il al-Nabulsi — Damascus's mufti and teacher at the Zahiriyya; orphaned, teaching at sixteen, a teacher's man of 'ulus and furu' who kept students housed on his roof and took no illicit fee; author of a sharh on al-'Aqida al-Nasafiyya and al-Mustaqsa fi'l-khilaf; dismissed by Murad Beg in 993 and died Saturday 13 Muharram 993 {cite:shadharat-dhahab p. 433-434}."
  es: "Badr al-Din Isma'il al-Nabulsi — Muftí de Damasco y maestro en la Zahiriyya; huérfano, enseñaba a los dieciséis años, un maestro de 'ulus y furu' que alojaba a estudiantes en su azotea y no cobraba honorarios ilícitos; autor de un sharh sobre al-'Aqida al-Nasafiyya y al-Mustaqsa fi'l-khilaf; destituido por Murad Beg en 993 y murió el sábado 13 de Muharram de 993 {cite:shadharat-dhahab p. 433-434}."
  fr: "Badr al-Din Isma'il al-Nabulsi — mufti de Damas et enseignant à la Zahiriyya; orphelin, il enseignait à seize ans, un homme d'enseignants de 'ulus et furu' qui logeait des étudiants sur son toit et ne prenait pas de frais illicites; auteur d'un sharh sur al-'Aqida al-Nasafiyya et al-Mustaqsa fi'l-khilaf; renvoyé par Murad Beg en 993 et décédé le samedi 13 Muharram 993 {cite:shadharat-dhahab p. 433-434}."
  ur: "بدر الدین اسماعیل النبلسی - دمشق کے مفتی اور ظہیریہ میں استاد؛ یتیم، سولہ سال کی عمر میں پڑھاتا، 'الس اور فرو' کا ایک استاد کا آدمی جس نے طلبہ کو اپنی چھت پر رکھا اور کوئی ناجائز فیس نہیں لی۔ العقیدہ النصفیہ اور المستقسہ فی الخلافہ کی تفسیر کے مصنف؛ مراد بیگ نے 993 میں برطرف کیا اور 13 محرم 993 بروز ہفتہ وفات پائی۔ 433-434}۔"
  tr: "Badr al-Din İsmail ibn Ahmed al-Nabulsi al-Shafi'i, el-Şam müftüsü; 1937 Hicri yılında Şam'da doğmuş, bilgi arayan bir babasının yetim çocuğu olarak büyümüş ve Şeyh Nasr al-Hamawi, Muhyiddin al-Nahhas ve diğerlerinden hadis duymuştur. Al-Zekeriye'nin yanında eğitim aldı ve el-Baka'i, Kadi Zada, İbn Tulun, el-Safadi, Mele Abdül-Kadir el-Bağdadi ve Şeyh İbrahim bin bin Avn'dan eğitim aldı. On altı yaşında Teraifiyye okulunda okumaya başladı ve bilgi arayışında ve onunla çalışmada gayretli kaldı, dilbilgisi, dil ve fıkıh gibi birçok alanda üstün başarı gösterdi Temeller, teoloji, tıp, miras hukuku ve prosodi eğitimi aldı. Şeyh Ebu el-Hasan el-Bakri ona yetki verdi. Ocak ayında gündüz vakti Şam'da fetva görevini üstlendi ve bunu mükemmel şekilde yerine getirdi. İlerleyen yıllarında Zahiri okulunda öğretim liderliğini üstlendi ve bunu fetva vererek birleştirdi. Servet ve rüşvetten kurtuldu, okulu evinin çatılarında öğrenci yurdu yaptı. Eserleri arasında Şerh al-Aqidah el-Nasafiyye, Şerh al-Alfiyyah el-Iraqi, el-Mustakkisa minhu fi İhtilaf el-İmam el-Talata ve onun dizini derlemek yer alır; 1993'te Khadim Murad Bey tarafından fetva vermekten men edildi ve vefat etti Cumartesi, Muharrem'in on üçüncü günü, öğretmeni Molla Abdul Kadir el-Bağdadi tarafından defnedildi {atıf:shadharat-dhahab, s. 433-434}."
  id: "Badr al-Din Ismail ibn Ahmad al-Nabulsi al-Shafi'i, Mufti al-Sham; lahir pada tahun 1937 AH di Damaskus, dibesarkan sebagai yatim piatu dari ayah yang mencari ilmu, dan mendengar hadits dari Sheikh Nasr al-Hamawi, Muhyiddin al-Nahhas, dan lainnya. Ia belajar di bawah bimbingan al-Zakariya dan belajar di bawah bimbingan al-Baqa'i, Qadi Zada, Ibn Tulun, al-Safadi, Mulla Abd al-Qadir al-Baghdadi, dan Sheikh Ibrahim ibn bint Awn. Pada usia enam belas tahun, ia mulai belajar di sekolah Taraifiyya dan tetap rajin dalam mencari dan terlibat dalam pengetahuan, unggul di banyak bidang seperti tata bahasa, bahasa, dan fiksi Ia mempelajari dasar-dasar, teologi, kedokteran, hukum warisan, dan prosodi. Sheikh Abu al-Hasan al-Bakri memberikan wewenang kepadanya. Ia mengambil posisi fatwa di Damaskus pada siang hari di bulan Januari dan melaksanakannya dengan sangat baik. Di tahun-tahun terakhirnya, ia mengambil alih kepemimpinan mengajar di sekolah Zahiri, menggabungkannya dengan penerbitan fatwa. Ia bebas dari penyitaan harta dan suap, menjadikannya tempat tinggal murid-muridnya di atap rumahnya. Di antara karyanya adalah Sharh al-Aqidah al-Nasafiyyah, Sharh al-Alfiyyah al-Iraqi, al-Mustakkisa minhu fi Ikhtilaf al-'Imam al-Thalata dan menyusun indeksnya; ia diberhentikan oleh Khadim Murad Bey dari penerbitan fatwa pada tahun 1993, dan ia meninggal dunia Pada hari Sabtu, tanggal tiga belas Muharram, ia dimakamkan oleh gurunya Mulla Abdul Qadir al-Baghdadi {cite:shadharat-dhahab, hlm. 433-434}."
