summary:
  ar: "بدر الدين إسماعيل بن أحمد النابلسي الشافعي مفتي الشام؛ ولد سنة سبع وثلاثين وتسعمائة بدمشق ونشأ يتيم الأب طالباً للعلم وسمع الحديث على الشيخ نصر الحموي ومحيي الدين النحاس وغيرهما وقرأ على الزكريا وأخذ عن البقاعي وقاضي زادة وابن طولون والصفدي والملا عبد القادر البغدادي والشيخ إبراهيم بن بنت عون، وصار يدرّس في السادسة عشرة من عمره بمدرسة الطرائفية، ولم يزل مجتهداً في طلب العلم والاشتغال به حتى برع في فنون كثيرة كالنحو واللغة والفقه والأصول وعلم الكلام والطب والفرائض والعروض، وأجازه الشيخ أبو الحسن البكري ووقف في نهار يناير على منصب الإفتاء بدمشق وقام به أحسن قيام، وتولى في آخر عمره مشيخة التدريس بالظاهرية وجمع بينها وبين الإفتاء؛ وكان نزيهاً عن الاستيلاء من المكاسب والرشوة وجعل الاستعلاء في طلبته وسكناه على سطح داره، ومن تصانيفه شرح العقيدة النسفية وشرح ألفية العراقي والمستقصى منه في اختلاف الأئمة الثلاثة وعقد فهرسه؛ وعزله الخادم مراد بيك عن الإفتاء سنة ثلاثة وتسعين، وتوفي يوم السبت ثالث عشر محرم ودُفن عند أستاذه ملا عبد القادر البغدادي {cite:shadharat-dhahab p. 433-434}."
  en: "Badr al-Din Isma'il al-Nabulsi — Damascus's mufti and teacher at the Zahiriyya; orphaned, teaching at sixteen, a teacher's man of 'ulus and furu' who kept students housed on his roof and took no illicit fee; author of a sharh on al-'Aqida al-Nasafiyya and al-Mustaqsa fi'l-khilaf; dismissed by Murad Beg in 993 and died Saturday 13 Muharram 993 {cite:shadharat-dhahab p. 433-434}."
