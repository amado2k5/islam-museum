summary:
  ar: "محمد بن إبراهيم بن المنذر النيسابوري، أبو بكر، فقيه مجتهد من الحفاظ وشيخ الحرم بمكة، 242 إلى 319 هـ الموافقة 856 إلى 931 م، صاحب «الأوسط» و«الإشراف»."
  en: "Muhammad ibn Ibrahim ibn al-Mundhir al-Naysaburi, Abu Bakr, a mujtahid jurist and hadith memoriser, shaykh of the Haram in Mecca, 242 to 319 AH (856 to 931 CE); author of al-Awsat and al-Ishraf."
  es: "Muhammad ibn Ibrahim ibn al-Mundhir al-Naysaburi, Abu Bakr, jurista mujtahid y memorizador de hadices, jeque del Haram en La Meca, 242 a 319 d. H. (856 a 931 d. C.); autor de al-Awsat y al-Ishraf."
  fr: "Muhammad ibn Ibrahim ibn al-Mundhir al-Naysaburi, Abu Bakr, juriste mujtahid et mémorisateur de hadiths, cheikh du Haram de La Mecque, 242 à 319 AH (856 à 931 CE); auteur d'al-Awsat et d'al-Ishraf."
  ur: "محمد بن ابراہیم ابن المنذر النیسابوری، ابوبکر، ایک مجتہد فقیہ اور حدیث کے حافظ، مکہ میں حرم کے شیخ، 242 تا 319 ہجری ⁦(856 تا 931 عیسوی)⁩؛ الاوسط اور الاشراف کے مصنف۔"
  tr: "Muhammed bin İbrahim ibn el-Mundhir el-Nisaburi, bir hukukçu, ezberleyenler arasında müjtahid ve Mekke'deki Haram şeyhi, 242-319 H.S. arasında değişen, 'El-Vasat' ve 'El-İşraf'ın yazarı."
  id: "Muhammad ibn Ibrahim ibn al-Mundhir al-Nisaburi, Abu Bakr, seorang ahli hukum, mujtahid di antara para penghafal, dan syaikh Haram di Mekah, 242 hingga 319 H yang bertepatan dengan 856 hingga 931 M, penulis 'Al-Wasat' dan 'Al-Ishraf'."
