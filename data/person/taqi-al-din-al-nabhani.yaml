summary:
  ar: "عالم وقاضٍ شرعي فلسطيني من إجزم، مؤسس حزب التحرير سنة 1953. درس في الأزهر ودار العلوم بالقاهرة، وتدرّج في القضاء الشرعي حتى محكمة الاستئناف في القدس قبل استقالته سنة 1950، ثم أقام في بيروت؛ جعلت كتبه — وفي مقدمتها «نظام الإسلام» — من أبرز منظّري الحركة الإسلامية في القرن العشرين، وتوفي سنة 1977."
  en: "Palestinian Islamic scholar and Sharia judge from Ijzim, founder of Hizb ut-Tahrir in 1953. Trained at al-Azhar and Dar al-Ulum in Cairo, he rose through the Sharia courts to the Jerusalem court of appeal before resigning in 1950, then settled in Beirut. His books — above all The System of Islam (Nidham al-Islam) — made him one of the most influential Islamist thinkers of the twentieth century. He died in 1977."
  ur: "اجزم سے تعلق رکھنے والے فلسطینی عالم اور شرعی قاضی، 1953 میں حزب التحریر کے بانی۔ قاہرہ میں جامعہ ازہر اور دار العلوم سے تعلیم پائی؛ شرعی عدالتوں میں ترقی کرتے ہوئے یروشلم کی اپیل کورٹ تک پہنچے، 1950 میں استعفیٰ دیا اور بیروت میں مقیم ہو گئے۔ ان کی کتابوں — سب سے بڑھ کر «نظام الاسلام» — نے انہیں بیسویں صدی کے بااثر ترین اسلام پسند مفکرین میں شامل کر دیا۔ 1977 میں وفات پائی۔"
