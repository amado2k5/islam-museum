summary:
  ar: "أحمد بن أحمد بن سلامة، أبو العباس، شهاب الدين القليوبي، فقيه متأدب من قليوب في مصر، له حواش وشروح ورسائل، منها «تحفة الراغب» في تراجم جماعة من أهل البيت و«أوراق لطيفة» على «الجامع الصغير» للسيوطي، وتوفي سنة 1069 هـ ⁦(1659 م)⁩."
  en: "Ahmad ibn Ahmad ibn Salama, Abu al-Abbas, Shihab al-Din al-Qalyubi, a jurist of literary taste from Qalyub in Egypt, author of glosses, commentaries and treatises, among them Tuhfat al-Raghib on biographies of a group of the Prophet's family and Awraq Latifa on al-Suyuti's al-Jami al-Saghir; died 1069 AH (1659 CE)."
