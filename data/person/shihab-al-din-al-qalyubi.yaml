summary:
  ar: "أحمد بن أحمد بن سلامة، أبو العباس، شهاب الدين القليوبي، فقيه متأدب من قليوب في مصر، له حواش وشروح ورسائل، منها «تحفة الراغب» في تراجم جماعة من أهل البيت و«أوراق لطيفة» على «الجامع الصغير» للسيوطي، وتوفي سنة 1069 هـ ⁦(1659 م)⁩."
  en: "Ahmad ibn Ahmad ibn Salama, Abu al-Abbas, Shihab al-Din al-Qalyubi, a jurist of literary taste from Qalyub in Egypt, author of glosses, commentaries and treatises, among them Tuhfat al-Raghib on biographies of a group of the Prophet's family and Awraq Latifa on al-Suyuti's al-Jami al-Saghir; died 1069 AH (1659 CE)."
  es: "Ahmad ibn Ahmad ibn Salama, Abu al-Abbas, Shihab al-Din al-Qalyubi, jurista de gusto literario de Qalyub en Egipto, autor de glosas, comentarios y tratados, entre ellos Tuhfat al-Raghib sobre biografías de un grupo de la familia del Profeta y Awraq Latifa sobre al-Jami al-Saghir de al-Suyuti; murió en 1069 AH (1659 d. C.)."
  fr: "Ahmad ibn Ahmad ibn Salama, Abu al-Abbas, Shihab al-Din al-Qalyubi, juriste de goût littéraire de Qalyub en Égypte, auteur de gloses, de commentaires et de traités, parmi lesquels Tuhfat al-Raghib sur les biographies d'un groupe de la famille du Prophète et Awraq Latifa sur al-Jami al-Saghir d'al-Suyuti; mort en 1069 AH (1659 CE)."
  ur: "احمد بن احمد بن سلامہ، ابو العباس، شہاب الدین القلیوبی، مصر میں قلوب کے ادبی ذوق کے ایک فقیہ، تذکروں، تفسیروں اور مقالوں کے مصنف، ان میں تحفۃ الرغیب، خاندانِ نبوی کے ایک گروہ کی سوانح پر تحفۃ الرغیب اور الصغریٰ الصغیری پر اوراق لطیفہ۔ وفات 1069ھ ⁦(1659ء)⁩۔"
  tr: "Ahmed ibn Ahmed ibn Salama, Ebu el-Abbas, Şihabeddin el-Qalyubi, Mısır'ın Kalyub kentinden seçkin bir hukukçuydu. Ahl al-Bayt grubunun biyografileri üzerine 'Tuhfat al-Raghib' ve el-Süyuçi tarafından yazılmış 'Geç Belgeler' dahil olmak üzere yorumlar, yorumlar ve incelemeler yazdı. 1069 Hicri yılında (1659 M.S.) öldü."
  id: "Ahmad ibn Ahmad ibn Salama, Abu al-Abbas, Shihab al-Din al-Qalyubi, adalah seorang ahli hukum terpelajar dari Qalyub di Mesir. Ia menulis komentar, komentar, dan risalah, termasuk 'Tuhfat al-Raghib' tentang biografi sekelompok Ahl al-Bayt dan 'Late Papers' tentang al-Jami' al-Saghir oleh al-Suyuti. Ia meninggal pada tahun 1069 H (1659 M)."
