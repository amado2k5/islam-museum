label:
  ar: "سراج الدين الغزنوي"
  en: "Siraj al-Din al-Ghaznawi"
  es: "Siraj al-Din al-Ghaznawi"
  fr: "Siraj al-Din al-Ghaznawi"
  ur: "سراج الدین الغزنوی"
roles: [scholar, jurist]
gender: male
summary:
  ar: "عمر بن إسحاق بن أحمد الهندي الغزنوي، أبو حفص، سراج الدين، فقيه من كبار الأحناف، من كتبه التوشيح في شرح الهداية والغرة المنيفة في ترجيح مذهب أبي حنيفة وشرح عقيدة الطحاوي، توفي سنة 773 هـ."
  en: "Umar ibn Ishaq ibn Ahmad al-Hindi al-Ghaznawi, Abu Hafs, Siraj al-Din, a jurist counted among the major Hanafis; author of al-Tawshih, a commentary on al-Hidaya, al-Ghurra al-Munifa on preferring the school of Abu Hanifa, and a commentary on the creed of al-Tahawi; died 773 AH (1372)."
  es: "Umar ibn Ishaq ibn Ahmad al-Hindi al-Ghaznawi, Abu Hafs, Siraj al-Din, un jurista contado entre los principales hanafíes; autor de al-Tawshih, un comentario sobre al-Hidaya, al-Ghurra al-Munifa sobre la preferencia por la escuela de Abu Hanifa, y un comentario sobre el credo de al-Tahawi; murió en 773 AH (1372)."
  fr: "Umar ibn Ishaq ibn Ahmad al-Hindi al-Ghaznawi, Abu Hafs, Siraj al-Din, un juriste compté parmi les principaux Hanafites; auteur d'al-Tawshih, un commentaire sur al-Hidaya, al-Ghurra al-Munifa sur la préférence pour l'école d'Abu Hanifa, et un commentaire sur la croyance d'al-Tahawi; mort en 773 AH (1372)."
  ur: "عمر بن اسحاق بن احمد الہندی الغزنوی، ابو حفص، سراج الدین، ایک فقیہ جن کا شمار بڑے حنفیوں میں ہوتا ہے۔ التوشیح کے مصنف، الہدایہ کی تفسیر، مکتب ابو حنیفہ کو ترجیح دینے پر الثورۃ المنیفہ، اور عقیدہ الطحاوی کی تفسیر؛ وفات 773ھ (1372)۔"
  tr: "Ömer bin İshaq ibn Ahmed al-Hindi el-Gaznavi, Ebu Hafs, Siraj al-Din, önde gelen bir Hanefi hukukçusuydu. Kitapları arasında el-Tevşi fi Şerh el-Hidaya ve el-Ghhurrah el-Munifah fi Tach Medhab Abi Hanifa ve Şerh Akidah el-Tahawi bulunmaktadır. 773 Hicri yılında vefat etti."
  id: "Umar ibn Ishaq ibn Ahmad al-Hindi al-Ghaznawi, Abu Hafs, Siraj al-Din, adalah seorang ahli hukum Hanafi terkemuka. Di antara bukunya adalah al-Tawshih fi Sharh al-Hidaya wa al-Ghhurrah al-Munifah fi Tajih Madhhab Abi Hanifa dan Sharh Aqidah al-Tahawi. Ia meninggal pada tahun 773 H."
