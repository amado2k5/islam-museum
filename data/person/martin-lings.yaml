summary:
  ar: "كاتب وباحث إنجليزي، وُلد سنة 1909 في بيرناج بلانكشاير وتوفي سنة 2005 في كنت. درس الأدب الإنجليزي في أكسفورد، وانتقل إلى القاهرة سنة 1939، واعتنق الإسلام في مصر في نحو 1939–1940 وتسمّى أبا بكر سراج الدين، وتبع الطريقة الشاذلية العلوية. عمل في المتحف البريطاني، وأشهر كتبه «محمد: سيرته من أقدم المصادر» (1983)."
  en: "English writer and scholar, born in 1909 at Burnage, Lancashire, who died in 2005 in Kent. After studying English at Oxford he moved to Cairo in 1939, embraced Islam in Egypt around 1939–1940 under the name Abu Bakr Siraj al-Din, and followed the Shadhili-Alawi Sufi path. He worked at the British Museum, and his best-known book is Muhammad: His Life Based on the Earliest Sources (1983)."
  ur: "انگریز مصنف اور عالم، جو 1909 میں لنکاشائر کے بَرنیج میں پیدا ہوئے اور 2005 میں کینٹ میں وفات پائی۔ آکسفورڈ میں انگریزی ادب پڑھنے کے بعد وہ 1939 میں قاہرہ گئے، مصر میں تقریباً 1939–1940 میں ابوبکر سراج الدین کے نام سے مسلمان ہوئے اور شاذلی علوی صوفی راہ کی پیروی کی۔ انھوں نے برٹش میوزیم میں کام کیا اور ان کی سب سے معروف کتاب «محمد: ابتدائی مآخذ پر مبنی ان کی سیرت» (1983) ہے۔"
  fr: "Écrivain et érudit anglais, né en 1909 à Burnage (Lancashire) et mort en 2005 dans le Kent. Après des études d'anglais à Oxford, il s'installa au Caire en 1939, embrassa l'islam en Égypte vers 1939–1940 sous le nom d'Abu Bakr Siraj al-Din et suivit la voie soufie chadhilie-alawite. Il travailla au British Museum ; son livre le plus connu est *Muhammad: His Life Based on the Earliest Sources* (1983)."
  es: "Escritor y erudito inglés, nacido en 1909 en Burnage (Lancashire) y fallecido en 2005 en Kent. Tras estudiar inglés en Oxford se trasladó a El Cairo en 1939, abrazó el islam en Egipto hacia 1939–1940 con el nombre de Abu Bakr Siraj al-Din y siguió la vía sufí shadhilí-alawí. Trabajó en el Museo Británico y su libro más conocido es *Muhammad: His Life Based on the Earliest Sources* (1983)."
