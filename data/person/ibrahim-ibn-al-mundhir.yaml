label:
  ar: "إبراهيم بن المنذر الحزامي"
  en: "Ibrahim ibn al-Mundhir al-Hizami"
  ur: "ابراہیم بن منذر خزامی"
roles: [scholar]
gender: male
summary:
  ar: "إبراهيم بن المنذر بن عبد الله بن المنذر الخزامي المدني، إمام ثقة جليل، حدّث عن سفيان بن عيينة وابن وهب ومعن بن عيسى وأبي ضمرة والوليد بن مسلم، وروى عنه البخاري في صحيحه وابن ماجة وابن أبي الدنيا ومطين. قال صالح جزرة وأبو حاتم: صدوق، وقال الدارقطني: ثقة. أجاب في مسألة القرآن في المحنة، ورآه السلمي نفيّة وخوفًا. مات في المحرم سنة 236، وقيل 235 {cite:tabaqat-shafiiyya-subki p. 232-234}."
  en: "Ibrahim ibn al-Mundhir al-Hizami of Medina (d. 235 or 236) — a 'firm and trustworthy imam' who transmitted from Ibn 'Uyayna, Ibn Wahb, Ma'n b. 'Isa and al-Walid b. Muslim, and was cited by al-Bukhari in the Sahih, Ibn Maja and Ibn Abi'l-Dunya. Salih Jazara and Abu Hatim graded him sadiq, al-Daraqutni thiqa; he answered in the mihna on the question of the Qur'an {cite:tabaqat-shafiiyya-subki p. 232-234}."
  ur: "ابراہیم بن منذر خزامی مدنی (مت 235 یا 236ھ) — ثقہ جلیل امام؛ ابن عینہ، ابن وہب اور ولید بن مسلم سے روایت، ان سے بخاری نے صحیح میں، ابن ماجہ اور ابن ابی الدنیا نے نقل کیا۔ صالح جزرہ اور ابو حاتم: صدوق؛ دارقطنی: ثقہ۔ محنہ میں مسئلۂ قرآن پر جواب دیا {cite:tabaqat-shafiiyya-subki p. 232-234}."
