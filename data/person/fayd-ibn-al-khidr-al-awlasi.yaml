summary:
  ar: "أبو الحارث الأولسي، كان يغني في صباه فمرّ بمريض على قارعة الطريق فقال له: ما تشتهي؟ قال: الرمان! فجاء به فقال له: تاب الله عليك! فما أمسى حتى تغيّر عما كان عليه، وصحب إبراهيم بن سعد الزاوي، وتوفي بطرسوس {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "Abu'l-Harith al-Awlasi, a singer in his youth until he fetched a pomegranate for a dying man on the roadside, who blessed him with 'God turn you in repentance!' — by evening he was transformed, and he attached himself to Ibrahim ibn Sa'd al-Zawi. He died at Tarsus {cite:muntazam-ibn-al-jawzi p. 205}."
