roles: [ascetic]
gender: male
summary:
  ar: "أبو الحارث الأولسي، كان يغني في صباه فمرّ بمريض على قارعة الطريق فقال له: ما تشتهي؟ قال: الرمان! فجاء به فقال له: تاب الله عليك! فما أمسى حتى تغيّر عما كان عليه، وصحب إبراهيم بن سعد الزاوي، وتوفي بطرسوس {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "Abu'l-Harith al-Awlasi, a singer in his youth until he fetched a pomegranate for a dying man on the roadside, who blessed him with 'God turn you in repentance!' — by evening he was transformed, and he attached himself to Ibrahim ibn Sa'd al-Zawi. He died at Tarsus {cite:muntazam-ibn-al-jawzi p. 205}."
  es: "Abu'l-Harith al-Awlasi, cantante en su juventud hasta que le llevó una granada a un moribundo al borde del camino, quien lo bendijo diciéndole: «¡Que Dios te convierta en arrepentido!». Al anochecer, se transformó y se unió a Ibrahim ibn Sa'd al-Zawi. Murió en Tarso {cite:muntazam-ibn-al-jawzi p. 205}."
  fr: "Abu'l-Harith al-Awlasi, chanteur dans sa jeunesse, alla chercher une grenade pour un mourant au bord de la route. Celui-ci le bénit en lui disant: « Que Dieu te ramène au repentir ! » Le soir venu, il était transformé et se lia à Ibrahim ibn Sa'd al-Zawi. Il mourut à Tarse (cf. Muntazam ibn al-Jawzi, p. 205)."
  ur: "ابو الحارث الاولسی، جوانی میں ایک گلوکار تھا یہاں تک کہ وہ سڑک کے کنارے ایک مرتے ہوئے آدمی کے لیے انار لے کر آیا، جس نے اسے یہ نعمت دی کہ 'خدا تجھے توبہ کرے!' - شام تک وہ بدل گیا، اور اس نے اپنے آپ کو ابراہیم بن سعد الزاوی سے جوڑ لیا۔ ان کی وفات ترسوس میں ہوئی۔ 205}۔"
