summary:
  ar: "أبو عبد الله محمد بن أبي السعادات عبد الرحمن بن محمد بن مسعود، تاج الدين ابن السعادات المعروف بالمُهذَبي؛ الفقيه الشافعي الصوفي الأديب الخراساني المروذي؛ اعتنى بالمقامات الحريرية فشرحها وأطال فيها شرحاً استوعب قصده ما لم يستوعبه غيره فجاء في خمس مجلدات كبار لم يبلغ أحد من شراح هذا الكتاب إلى هذا القدر ولا إلى نصفه وهو كتاب مشهور كثير الوجود؛ كان مقيماً بدمشق في الخانقاه السميساطية والناس يأخذون عنه؛ وحين دخل صلاح الدين حلب سنة تسع وسبعين وخمسمائة أخذ من خزانة كتبها الوقف كتباً استعان بها على شرح المقامات {cite:wafayat-ayan}."
  en: "Taj al-Din Ibn al-Sa'adat, known as al-Muhdhabi (522–584) — the Shafi'i-Sufi adib whose five-volume commentary on al-Hariri's Maqamat far outgrew every other sharh; settled in the Sumaysatiyya khanqah at Damascus; his famous story of taking endowment books from Aleppo's storehouse in 579 is told by Ibn Khallikan {cite:wafayat-ayan}."
