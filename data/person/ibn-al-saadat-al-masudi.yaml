summary:
  ar: "أبو عبد الله محمد بن أبي السعادات عبد الرحمن بن محمد بن مسعود، تاج الدين ابن السعادات المعروف بالمُهذَبي؛ الفقيه الشافعي الصوفي الأديب الخراساني المروذي؛ اعتنى بالمقامات الحريرية فشرحها وأطال فيها شرحاً استوعب قصده ما لم يستوعبه غيره فجاء في خمس مجلدات كبار لم يبلغ أحد من شراح هذا الكتاب إلى هذا القدر ولا إلى نصفه وهو كتاب مشهور كثير الوجود؛ كان مقيماً بدمشق في الخانقاه السميساطية والناس يأخذون عنه؛ وحين دخل صلاح الدين حلب سنة تسع وسبعين وخمسمائة أخذ من خزانة كتبها الوقف كتباً استعان بها على شرح المقامات {cite:wafayat-ayan}."
  en: "Taj al-Din Ibn al-Sa'adat, known as al-Muhdhabi (522–584) — the Shafi'i-Sufi adib whose five-volume commentary on al-Hariri's Maqamat far outgrew every other sharh; settled in the Sumaysatiyya khanqah at Damascus; his famous story of taking endowment books from Aleppo's storehouse in 579 is told by Ibn Khallikan {cite:wafayat-ayan}."
  es: "Taj al-Din Ibn al-Sa'adat, conocido como al-Muhdhabi (522-584), el adib shafi'i-sufí cuyo comentario en cinco volúmenes sobre el Maqamat de al-Hariri superó con creces a todos los demás sharh; se instaló en Sumaysatiyya khanqah en Damasco; Ibn Khallikan {cita:wafayat-ayan} cuenta su famosa historia de cómo tomó libros de donaciones del almacén de Alepo en 579."
  fr: "Taj al-Din Ibn al-Sa'adat, connu sous le nom d'al-Muhdhabi (522-584) — l'adib Shafi'i-Sufi dont le commentaire en cinq volumes sur le Maqamat d'al-Hariri a dépassé de loin tous les autres sharh; installé dans la khanqah Sumaysatiyya à Damas; sa célèbre histoire de prise de livres de dotation dans l'entrepôt d'Alep en 579 est racontée par Ibn Khallikan {cite: wafayat-ayan}."
  ur: "تاج الدین ابن السعادت المحذبی (522-584) کے نام سے بھی جانا جاتا ہے - ایک شافعی صوفی ادیب جس کی پانچ جلدوں کی تفسیر الحریری کی مقامت پر ہر دوسری شرح سے کہیں زیادہ بڑھ گئی ہے۔ دمشق میں سمیسطیہ خانقاہ میں آباد ہوئے؛ ان کی 579 میں حلب کے گودام سے اوقافی کتابیں لینے کی مشہور کہانی ابن خلیقان نے بیان کی ہے۔"
