  ar: "أبو إسحاق إبراهيم بن يحيى الحفصي"
  en: "Abu Ishaq Ibrahim, Hafsid"
  fr: "Abu Ishaq Ibrahim, le Hafside"
  es: "Abu Ishaq Ibrahim, Hafsid"
  ur: "ابو اسحاق ابراہیم، حفصید"
roles: [ruler]
gender: male
summary:
  ar: "إبراهيم بن يحيى الحفصي، أبو إسحاق، أمير المؤمنين بتونس بويع سنة 678 هـ بعد عودته من الأندلس، خلع نفسه أمام ثورة ابن أبي عمارة وقتل ببجاية سنة 682 هـ الموافقة 1283 م."
  en: "Ibrahim ibn Yahya al-Hafsi, Abu Ishaq, commander of the faithful in Tunis, given allegiance in 678 AH on his return from al-Andalus, who stood down before the revolt of Ibn Abi Umara and was killed in Bejaia in 682 AH (1283)."
  fr: "Ibrahim ibn Yahya al-Hafsi, Abu Ishaq, commandeur des croyants à Tunis, reconnu en 678 H à son retour d'al-Andalus, qui abdiqua devant la révolte d'Ibn Abi Umara et fut tué à Béjaïa en 682 H (1283)."
  es: "Ibrahim ibn Yahya al-Hafsi, Abu Ishaq, comandante de los fieles en Túnez, prestó juramento de lealtad en el año 678 de la Hégira a su regreso de al-Ándalus, quien se retiró ante la revuelta de Ibn Abi Umara y fue asesinado en Bejaia en el año 682 de la Hégira (1283)."
  ur: "ابراہیم بن یحییٰ الحفصی، ابو اسحاق، تیونس میں وفاداروں کے کمانڈر، نے 678 ہجری میں اندلس سے واپسی پر بیعت کی، جو ابن ابی عمارہ کی بغاوت کے سامنے کھڑا ہوا اور 682 ہجری (1283) میں بیجعہ میں مارا گیا۔"
  tr: "İbrahim ibn Yahya el-Hafsi, Ebu İshak, Tunus'taki Müminlerin Komutanı, Endülüs'ten döndükten sonra 678 Hicri yılında biat etti. İbn Abi Amara'nın isyanı karşısında tahttan feragat etti ve 682 Hicri yılında (1283 Miladi) Bejaia'da öldürüldü."
  id: "Ibrahim ibn Yahya al-Hafsi, Abu Ishaq, Amirul Mukminin di Tunis, mengucapkan sumpah setia pada tahun 678 H setelah kembali dari Andalusia. Ia turun takhta karena pemberontakan Ibnu Abi Amara dan terbunuh di Bejaia pada tahun 682 H, yang bertepatan dengan tahun 1283 M."
