summary:
  ar: "شمس الدين البرماوي الشافعي؛ ولد في نصف ذي القعدة سنة ثلاث وستين وسبعمائة وتفقه وهو شاب، قال تاج الدين بن الغرابيل ما قصد هو أحد الأئمة الأجلاء والبحر الذي لا تكدره الدلاء فريد دهره ووحيد عصره ما رأيت أقعد منه بفنون العلوم مع ما كان عليه من التواضع، صنف شرحاً حسناً على البخاري وانشراح المهمات والتوشيح ونظم ألفية في أصول الفقه لم يسبق إلى مثل وضعها وشرحها شرحاً حافلاً نحو مجلدين وكان يقول أكثر هذا الكتاب هو جملة ما حصلت في طول عمري وشرح لامية ابن مالك في غاية الجودة واختصر السيرة، ومن عجائب دهره أنه جاور بمكة سنة ثم قدم القاهرة فولي الصلاحية ثم القدس فأقام بها ضعيفاً بالقرحة وتوفي بها يوم الخميس ثامن عشر جمادى ودفن بتربة مأم الله عوجاد الشيخ عبد الله القرشي {cite:shadharat-dhahab p. 197-198}."
  en: "Shams al-Din al-Barmawi (b. 763) — 'peerless of his age, an unclouded sea' per Ibn al-Ghurabili; author of a fine Sahih al-Bukhari commentary, an unprecedented usul alfiyya ('the sum of all I gathered in my life'), a superb lamiyya commentary and a sira abridgement; died at Jerusalem Thursday 18 Jumada 831, buried at Mamilla {cite:shadharat-dhahab p. 197-198}."
