summary:
  ar: "شمس الدين البرماوي الشافعي؛ ولد في نصف ذي القعدة سنة ثلاث وستين وسبعمائة وتفقه وهو شاب، قال تاج الدين بن الغرابيل ما قصد هو أحد الأئمة الأجلاء والبحر الذي لا تكدره الدلاء فريد دهره ووحيد عصره ما رأيت أقعد منه بفنون العلوم مع ما كان عليه من التواضع، صنف شرحاً حسناً على البخاري وانشراح المهمات والتوشيح ونظم ألفية في أصول الفقه لم يسبق إلى مثل وضعها وشرحها شرحاً حافلاً نحو مجلدين وكان يقول أكثر هذا الكتاب هو جملة ما حصلت في طول عمري وشرح لامية ابن مالك في غاية الجودة واختصر السيرة، ومن عجائب دهره أنه جاور بمكة سنة ثم قدم القاهرة فولي الصلاحية ثم القدس فأقام بها ضعيفاً بالقرحة وتوفي بها يوم الخميس ثامن عشر جمادى ودفن بتربة مأم الله عوجاد الشيخ عبد الله القرشي {cite:shadharat-dhahab p. 197-198}."
  en: "Shams al-Din al-Barmawi (b. 763) — 'peerless of his age, an unclouded sea' per Ibn al-Ghurabili; author of a fine Sahih al-Bukhari commentary, an unprecedented usul alfiyya ('the sum of all I gathered in my life'), a superb lamiyya commentary and a sira abridgement; died at Jerusalem Thursday 18 Jumada 831, buried at Mamilla {cite:shadharat-dhahab p. 197-198}."
  fr: "Shams al-Din al-Barmawi (né en 763 H) — « sans égal de son temps, une mer sans trouble » selon Ibn al-Ghurabili ; auteur d’un bon commentaire du Sahih d’al-Bukhari, d’une alfiyya sans précédent sur les fondements (« la somme de tout ce que j’ai recueilli dans ma vie »), d’un superbe commentaire de la Lamiyya et d’un abrégé de la sira ; mort à Jérusalem le jeudi 18 jumada 831 H, enterré à Mamilla {cite:shadharat-dhahab p. 197-198}."
  es: "Shams al-Din al-Barmawi (n. 763): 'incomparable en su época, un mar sin nubes' según Ibn al-Ghurabili; autor de un excelente comentario de Sahih al-Bukhari, un usul alfiyya ('la suma de todo lo que reuní en mi vida') sin precedentes, un magnífico comentario de lamiyya y un resumen de sira; murió en Jerusalén el jueves 18 viernes 831, enterrado en Mamilla {cita: shadharat-dhahab p. 197-198}."
  ur: "شمس الدین البرماوی ⁦(وفات 763)⁩ - 'اپنی عمر کا بے مثال، ایک بے آب و گیاہ سمندر' فی ابن الغربیلی؛ ایک عمدہ صحیح البخاری تفسیر کے مصنف، ایک بے مثال اصول الفیہ ⁦('میں نے اپنی زندگی میں جمع کی گئی تمام چیزوں کا مجموعہ')⁩، ایک شاندار لامیہ تفسیر اور سیرت کا خلاصہ؛ جمعرات 18 بروز جمعہ 831ء کو یروشلم میں وفات پائی، مملہ میں دفن ہوئے۔ 197-198}۔"
  tr: "Şemseddin Barmavi Şafiî; 763 yılında Zilhicce ayının ortalarında doğdu ve genç yaşta fıkıh eğitimi aldı. Tecddin İbn Garabil şöyle dedi: \"O, seçkin imamlardan biriydi ve kovalarla bulandırılamayan bir denizdi; zamanının ve çağının eşsiz bir örneğiydi. Mütevazılığına rağmen, çeşitli ilim dallarında ondan daha bilgili birini görmedim. Buhari üzerine güzel bir tefsir yazdı, önemli konuların açıklamasını ve süslemelerini yaptı ve daha önce benzeri görülmemiş bin beyitlik bir fıkıh esasları şiiri yazdı ve bunu yaklaşık iki ciltlik kapsamlı bir tefsirle açıkladı. Şöyle derdi: Bu kitabın çoğu, tüm hayatım boyunca edindiğim bilgilerin toplamıdır. İbn Malik'in Lamiyye'sini en yüksek kalitede açıkladı ve biyografisini özetledi.\" Döneminin harikalarından biri de, bir yıl Mekke'de kalması, ardından Kahire'ye gelip el-Salahiyye görevine atanması, daha sonra Kudüs'e gidip orada ülserlerle güçsüz bir halde kalması ve Cemadi ayının 18. Perşembe günü orada vefat etmesi ve İmam Allah Evced Şeyh Abdullah el-Kureşi'nin mezarlığına defnedilmesidir. {kaynak: Şadharat-dhahab s. 197-198}"
  id: "Shams al-Din al-Barmawi al-Shafi’i; beliau lahir pada pertengahan Dzul Qi'dah tahun 763, dan beliau mempelajari fiqih sejak muda. Taj al-Din Ibn al-Gharabil berkata: Beliau adalah salah satu imam terkemuka dan lautan yang tak dapat dikeruhkan oleh ember, satu-satunya di zamannya dan satu-satunya di eranya. Saya belum pernah melihat siapa pun yang lebih berpengetahuan darinya dalam berbagai cabang ilmu, meskipun beliau rendah hati. Beliau menulis tafsir yang baik tentang Al-Bukhari, dan penjelasan tentang hal-hal penting dan pengayaannya, dan beliau menyusun puisi seribu bait tentang prinsip-prinsip fiqih, yang belum pernah ada sebelumnya, dan beliau menjelaskannya dengan tafsir komprehensif sekitar dua jilid. Beliau biasa berkata: Sebagian besar buku ini adalah rangkuman dari apa yang telah saya peroleh sepanjang hidup saya. Beliau menjelaskan Lamiyyah Ibn Malik dengan kualitas terbaik dan meringkas biografinya. Di antara keajaiban zamannya adalah bahwa beliau tinggal di Mekah selama setahun, kemudian datang ke Kairo dan diangkat ke posisi al-Salahiyyah, lalu pergi ke Yerusalem dan tinggal di sana dalam keadaan lemah karena sakit maag, dan meninggal di sana pada hari Kamis, tanggal 18 Jumada, dan dimakamkan di pemakaman Imam Allah Awjad, Syekh Abdullah al-Qurashi. {cite:shadharat-dhahab hlm. 197-198}."
