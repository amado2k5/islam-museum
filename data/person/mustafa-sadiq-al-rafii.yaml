summary:
  ar: "شاعر وكاتب مصري (1880-1937)، وُلد في بهتيم بمحافظة القليوبية وعاش في طنطا. فقد سمعه في الثلاثين من عمره، وصار من أبرز أعلام مدرسة المحافظين في الأدب العربي الحديث؛ كتب كلمات نشيد «اسلمي يا مصر» وأكثر كلمات النشيد الوطني التونسي «حماة الحمى»، ومن كتبه «وحي القلم» و«تاريخ آداب العرب»."
  en: "Egyptian poet and prose writer (1880-1937), born at Bahtim in al-Qalyubiyya and resident at Tanta. He lost his hearing at the age of thirty and became a leading figure of the conservative school of modern Arabic letters; he wrote the words of the Egyptian anthem 'Islami ya Misr' and of most of the Tunisian anthem 'Humat al-Hima', and among his books are Wahy al-Qalam and Tarikh Adab al-Arab."
  ur: "مصری شاعر اور نثر نگار (1880-1937)، قلیوبیہ کے گاؤں بہیتم میں پیدا ہوئے اور طنطا میں رہے۔ تیس برس کی عمر میں سماعت سے محروم ہو گئے اور جدید عربی ادب کے محافظ مکتب کے نمایاں ترین نام بن گئے؛ انہوں نے مصری ترانے «اسلمی یا مصر» اور تیونسی قومی ترانے «حماۃ الحمی» کے بیشتر اشعار لکھے، اور ان کی کتابوں میں «وحی القلم» اور «تاریخ آداب العرب» شامل ہیں۔"
