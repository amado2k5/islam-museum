summary:
  ar: "الأمير أوجين دي سافوا قائد الجيش الإمبراطوري النمساوي في الحروب مع العثمانيين. هزم السلطان مصطفى الثاني عند زنطة في 11 سبتمبر 1697م وأحرق سراييفو بعدها، ثم انتصر في بتروارادين وتمشوار وبلغراد في حرب 1716 إلى 1718م التي انتهت بصلح بساروفتز {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}."
  en: "Prince Eugene of Savoy commanded the Austrian imperial army in its wars with the Ottomans. He defeated Sultan Mustafa II at Zenta on 11 September 1697 and burned Sarajevo soon after, then won at Peterwardein, Temesvar and Belgrade in the war of 1716-18 that ended with the Peace of Passarowitz {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}."
  ur: "شہزادہ یوجین آف سیوائے عثمانیوں سے جنگوں میں آسٹریا کی شاہی فوج کے سپہ سالار تھے۔ انہوں نے 11 ستمبر 1697ء کو زینتا میں سلطان مصطفیٰ ثانی کو شکست دی اور اس کے فوراً بعد سراجیوو کو جلا ڈالا، پھر 1716 تا 1718ء کی اس جنگ میں پیٹروارادین، تیمیشوار اور بلغراد میں فتح پائی جو صلحِ پساروفچہ پر ختم ہوئی {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}۔"
  es: "El príncipe Eugenio de Saboya comandó el ejército imperial austríaco en sus guerras contra los otomanos. Derrotó al sultán Mustafa II en Zenta el 11 de septiembre de 1697 e incendió Sarajevo poco después, luego venció en Peterwardein, Temesvar y Belgrado en la guerra de 1716-18 que terminó con la Paz de Passarowitz {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}."
  fr: "Le prince Eugène de Savoie commanda l'armée impériale autrichienne lors de ses guerres contre les Ottomans. Il vainquit le sultan Mustafa II à Zenta le 11 septembre 1697 et incendia Sarajevo peu après, puis remporta des victoires à Peterwardein, Temesvar et Belgrade lors de la guerre de 1716-1718 qui s'acheva par la paix de Passarowitz."
  tr: "Prens Eugene de Savoy, Osmanlılara karşı yapılan savaşlarda Avusturya İmparatorluk Ordusu'nun komutanıydı. Sultan Mustafa II, 11 Eylül 1697'de Zenta'da yenildi, ardından Saraybosna yakıldı, ardından 1716-1718 Savaşı'nda Petrograd, Mišvar ve Belgrad'da zafer kazandı; savaş Sarovitz Barışı ile sona erdi {cite:Encyclopaedia-of-Islam-2 cilt 11 s. 513} {cite:Encyclopaedia-of-Islam-2 cilt 8 s. 299}."
  id: "Pangeran Eugene de Savoy adalah komandan Tentara Kekaisaran Austria dalam perang melawan Ottoman. Sultan Mustafa II dikalahkan di Zenta pada 11 September 1697, lalu Sarajevo dibakar, kemudian ia menang di Petrograd, Mišvar, dan Beograd dalam Perang 1716 hingga 1718, yang berakhir dengan Perdamaian Sarovitz {cite:Encyclopaedia-of-Islam-2 vol. 11 hlm. 513} {cite:Encyclopaedia-of-Islam-2 vol. 8 hlm. 299}."
