summary:
  ar: "الأمير أوجين دي سافوا قائد الجيش الإمبراطوري النمساوي في الحروب مع العثمانيين. هزم السلطان مصطفى الثاني عند زنطة في 11 سبتمبر 1697م وأحرق سراييفو بعدها، ثم انتصر في بتروارادين وتمشوار وبلغراد في حرب 1716 إلى 1718م التي انتهت بصلح بساروفتز {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}."
  en: "Prince Eugene of Savoy commanded the Austrian imperial army in its wars with the Ottomans. He defeated Sultan Mustafa II at Zenta on 11 September 1697 and burned Sarajevo soon after, then won at Peterwardein, Temesvar and Belgrade in the war of 1716-18 that ended with the Peace of Passarowitz {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}."
  ur: "شہزادہ یوجین آف سیوائے عثمانیوں سے جنگوں میں آسٹریا کی شاہی فوج کے سپہ سالار تھے۔ انہوں نے 11 ستمبر 1697ء کو زینتا میں سلطان مصطفیٰ ثانی کو شکست دی اور اس کے فوراً بعد سراجیوو کو جلا ڈالا، پھر 1716 تا 1718ء کی اس جنگ میں پیٹروارادین، تیمیشوار اور بلغراد میں فتح پائی جو صلحِ پساروفچہ پر ختم ہوئی {cite:encyclopaedia-of-islam-2 vol. 11 p. 513} {cite:encyclopaedia-of-islam-2 vol. 8 p. 299}۔"
