summary:
  ar: "إبراهيم بن عبد الله بن محمد بن عسكر الطائي، برهان الدين القيراطي، شاعر من أعيان القاهرة، اشتغل بالفقه والأدب وجاور بمكة وتوفي فيها سنة 781 هـ، له «مطلع النيرين» و«الوشاح المفصل»."
  en: "Ibrahim ibn Abdallah ibn Muhammad ibn Askar al-Ta'i, Burhan al-Din al-Qirati, a poet among the notables of Cairo who studied law and letters, lived beside the sanctuary at Mecca and died there in 781 AH; author of the diwan Matla' al-Nayyirayn and the anthology al-Washah al-Mufassal."
  es: "Ibrahim ibn Abdallah ibn Muhammad ibn Askar al-Ta'i, Burhan al-Din al-Qirati, poeta entre los notables de El Cairo que estudió derecho y letras, vivió junto al santuario de La Meca y murió allí en el año 781 de la Hégira; autor del diwan Matla' al-Nayyirayn y de la antología al-Washah al-Mufassal."
