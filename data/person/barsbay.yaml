label: { ar: "السلطان الأشرف برسباي" }
summary:
  ar: "سلطان مملوكي جركسي، وثب على الصالح محمد بن ططر فخلعه وقلده الخليفة المعتضد السلطنة في ربيع الآخر سنة خمس وعشرين وثمان مئة فاستمر إلى أن مات في ذي الحجة سنة إحدى وأربعين فقلد ابنه يوسف ولقب العزيز وجعل جقمق نظامه {cite:tarikh-khulafa-minhaj-1434 p. 769}. وفي ترجمته في شذرات الذهب أنه الملك الأشرف برسباي بن عبد الله أبو النصر الدقماقي الظاهري الجركسي سلطان الديار المصرية والبلاد الشامية والأقطار الحجازية الثاني والثلاثون من ملوك الترك والثامن من ملوك الجراكسة أخذ من بلاد الجركس وبيع بالقرم فاشتراه بعض التجار وقدم به إلى الشام فاشتراه نائب ملطية الأمير دقماق المحمدي ثم أرسله إلى الملك الظاهر برقوق في جملة تقدمة فأعتقه برقوق وصار ساقياً في دولة الناصر فرج ثم صار مع الأميرين شيخ ونوروز إلى أن قتل الناصر وقدم صحبة الأمير شيخ الديار المصرية ولا يزال يترقى إلى أن صار أمير مئة مقدم ألف وولي نيابة طرابلس سنة إحدى وعشرين ثم بويع بالسلطنة في ربيع الآخر سنة خمس وعشرين فساس الملك أحسن سياسة وفتحت في أيامه عدة فتوحات منها ماغوصة قبرص ثم بقية جزيرة قبرص وأسر ملكها جينوس ولم يقتل من المسلمين إلا القليل وعرض عليه جينوس ومن معه من الأسرى وهو يرفل في قيوده فذرفت عيناه وأعلن بالحمد والشكر ثم أطلقه وأعاده بعد أن ضرب عليه الجزية فاستمرت وكان برسباي ملكاً جليلاً مهيباً عارفاً سيوساً متواضعاً حسن الخلق شهماً شجاعاً لا يتعاطى شيئاً من المسكرات محباً لجمع المال مكثراً من المماليك {cite:shadharat-dhahab p. 247}."
  en: "Circassian sultan invested by the caliph in 825; ruled to Dhu'l-Hijja 841 when his son Yusuf al-Aziz succeeded under Jaqmaq's regency {cite:tarikh-khulafa-minhaj-1434 p. 769}."
  es: "Sultán circasiano investido por el califa en 825; gobernó hasta Dhu'l-Hijja 841 cuando su hijo Yusuf al-Aziz le sucedió bajo la regencia de Jaqmaq {cite:tarikh-khulafa-minhaj-1434 p. 769}."
  fr: "Sultan circassien investi par le calife en 825; régna jusqu'en Dhu'l-Hijja 841 lorsque son fils Yusuf al-Aziz lui succéda sous la régence de Jaqmaq {cite:tarikh-khulafa-minhaj-1434 p. 769}."
  ur: "825 میں خلیفہ کی طرف سے سرکیسیئن سلطان کی سرمایہ کاری؛ اس نے ذی الحجہ 841 تک حکومت کی جب اس کا بیٹا یوسف العزیز جقمق کی حکومت میں کامیاب ہوا۔ 769}۔"
  tr: "Bir Çerkes Memlük sultanı olan Jane, el-Salih Muhammed bin Tatar'ı tahttan indirdi, onu tahttan indirdi ve 825 Hicri yılında Halife el-Mu'tadid el-Sultana tarafından Rabi'al-Akhir'de atadı. Bu görevde kaldı ve 41 yılının Dhu al-Hijjah'inde öldü. Oğlu Yusuf'u taklit etti, ona 'Al-Aziz' unvanını verdi ve Jaqmaq'ı hükümdarı yaptı {atıf:Tarikh-khulafa-minhaj-1434, s. 769}. Shadharat al-Dhahab'daki biyografisinde, Kral Al-Ashraf Barsbay bin Abdullah Abu al-Nasr al-Duqmaqi al-Zahiri al-Jurassi, Mısır, Levant ülkeleri ve Hecaz topraklarının Sultanı, Türklerin otuz ikinci, Çerkes krallarının ise sekizinci kralı olduğu belirtilir. Çerkes topraklarından alınıp Kırım'da satıldı, ancak bazı tüccarlar onu satın alıp Levant'a getirdi. Malatya vekili Prens Duqmaq el-Muhammadi onu satın aldı, ardından Kral el-Zahir Barquq'a hediye olarak gönderdi; Barquq onu serbest bıraktı ve el-Nasir Faraj devletinde kadeh dağıttı, ardından iki prensle birlikte Nuruz Şeyhi oldu. El-Nasir öldürülene kadar ve Mısır topraklarının şeyhi prensle birlikte hareket edene kadar, yükselmeye devam etti ve yirmi birinci yılda yüz yarbay prensi oldu ve Trablus'un milletvekili olarak atandı. Sonra yirmi beşinci yılda Rabi' al-Thani'de sultanlığa bağlılık yemini etti. Kral en iyi politikayı benimsedi ve saltanatı boyunca Kıbrıs Maghusa'sı ve ardından Kıbrıs adasının geri kalanını da dahil olmak üzere birçok fetih başlattı. Kral Ginos'u yakaladı, sadece birkaç Müslüman öldürüldü. Ginos ve onunla birliktekiler zincirliyken esir alındı, gözleri doldu ve övgü ilan etti ve teşekkür ederek, ardından onu serbest bıraktı ve yerine yerine getirildi; vergisi devam etti. Barsbay soylu, görkemli bir kraldı; bilgili, alçakgönüllü, mütevazı, iyi karakterli, soylu, cesur ve asla sarhoş tüketmezdi, servet biriktirmeyi severdi ve Memlükler arasında bolca bulunurdu {atıf:shadharat-dhahab, s. 247}."
  id: "Sebagai sultan Mamluk Circassian, ia menggulingkan al-Salih Muhammad ibn Tatar, menggulingkannya, dan mengangkatnya oleh Khalifah al-Mu'tadid al-Sultana di Rabi' al-Akhir pada tahun 825 H. Ia tetap demikian hingga wafat di Dhu al-Hijjah tahun 41. Ia meniru putranya Yusuf, memberinya gelar 'Al-Aziz,' dan menjadikan Jaqmaq sebagai penguasanya {cite:Tarikh-khulafa-minhaj-1434, hlm. 769}. Dalam biografinya di Shadharat al-Dhahab, disebutkan bahwa Raja Al-Ashraf Barsbay bin Abdullah Abu al-Nasr al-Duqmaqi al-Zahiri al-Jurassi, Sultan Mesir, negara-negara Levant, dan wilayah Hejazi adalah raja ke-32 Turki dan raja kedelapan dari raja Circassia. Ia diambil dari tanah Circassia dan dijual di Crimea, tetapi beberapa pedagang membelinya dan membawanya ke Levant. Wakil Malatya, Pangeran Duqmaq al-Muhammadi, membelinya, lalu mengirimkannya kepada Raja al-Zahir Barquq sebagai hadiah, dan Barquq membebaskannya serta menjadi pembawa cawan di negara bagian al-Nasir Faraj, kemudian menjadi Sheikh Nuruz bersama kedua pangeran tersebut. Hingga Al-Nasir terbunuh dan ia menemani pangeran, Sheikh tanah Mesir, dan ia terus naik pangkat hingga menjadi pangeran seratus letnan kolonel dan diangkat sebagai wakil Tripoli pada tahun dua puluh satu. Kemudian ia disumpah setia kepada kesultanan di Rabi' al-Thani pada tahun dua puluh lima. Raja mengambil kebijakan terbaik dan membuka beberapa penaklukan selama pemerintahannya, termasuk Maghusa di Siprus, lalu seluruh pulau Siprus. Ia menangkap rajanya Ginos, dan hanya beberapa Muslim yang tewas. Ginos dan yang bersamanya ditawari tawanan saat ia dirantai, matanya berkaca-kaca, dan ia menyatakan pujian dan berterima kasih, lalu membebaskannya dan mengangkatnya kembali setelah membayar pajak jizya kepadanya, yang terus berlanjut. Barsbay adalah raja yang mulia, agung, berpengetahuan, rendah hati, rendah hati, berkarakter baik, mulia, berani, dan tidak pernah mengonsumsi minuman keras, suka mengumpulkan kekayaan, dan melimpah di antara Mamluk {cite:shadharat-dhahab, hlm. 247}."
