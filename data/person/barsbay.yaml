label: { ar: "السلطان الأشرف برسباي" }
summary:
  ar: "سلطان مملوكي جركسي، وثب على الصالح محمد بن ططر فخلعه وقلده الخليفة المعتضد السلطنة في ربيع الآخر سنة خمس وعشرين وثمان مئة فاستمر إلى أن مات في ذي الحجة سنة إحدى وأربعين فقلد ابنه يوسف ولقب العزيز وجعل جقمق نظامه {cite:tarikh-khulafa-minhaj-1434 p. 769}. وفي ترجمته في شذرات الذهب أنه الملك الأشرف برسباي بن عبد الله أبو النصر الدقماقي الظاهري الجركسي سلطان الديار المصرية والبلاد الشامية والأقطار الحجازية الثاني والثلاثون من ملوك الترك والثامن من ملوك الجراكسة أخذ من بلاد الجركس وبيع بالقرم فاشتراه بعض التجار وقدم به إلى الشام فاشتراه نائب ملطية الأمير دقماق المحمدي ثم أرسله إلى الملك الظاهر برقوق في جملة تقدمة فأعتقه برقوق وصار ساقياً في دولة الناصر فرج ثم صار مع الأميرين شيخ ونوروز إلى أن قتل الناصر وقدم صحبة الأمير شيخ الديار المصرية ولا يزال يترقى إلى أن صار أمير مئة مقدم ألف وولي نيابة طرابلس سنة إحدى وعشرين ثم بويع بالسلطنة في ربيع الآخر سنة خمس وعشرين فساس الملك أحسن سياسة وفتحت في أيامه عدة فتوحات منها ماغوصة قبرص ثم بقية جزيرة قبرص وأسر ملكها جينوس ولم يقتل من المسلمين إلا القليل وعرض عليه جينوس ومن معه من الأسرى وهو يرفل في قيوده فذرفت عيناه وأعلن بالحمد والشكر ثم أطلقه وأعاده بعد أن ضرب عليه الجزية فاستمرت وكان برسباي ملكاً جليلاً مهيباً عارفاً سيوساً متواضعاً حسن الخلق شهماً شجاعاً لا يتعاطى شيئاً من المسكرات محباً لجمع المال مكثراً من المماليك {cite:shadharat-dhahab p. 247}."
  en: "Circassian sultan invested by the caliph in 825; ruled to Dhu'l-Hijja 841 when his son Yusuf al-Aziz succeeded under Jaqmaq's regency {cite:tarikh-khulafa-minhaj-1434 p. 769}."
