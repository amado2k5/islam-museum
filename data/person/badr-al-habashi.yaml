summary:
  ar: "الأمير الكبير؛ كان أميراً على مائة فارس بدمشق وأقام في الإمرة نحو أربعين سنة موصوفاً بالشجاعة والعقل والرأي؛ وقال ابن شهبة: هو أول من أبطل ما كان يُجبى من الحجاج في كل سنة لأجل العربان على كل جمل عشرة دراهم — أقام ذلك من ماله وأبطل الجباية سنة إحدى وثمانين فبطل إلى زمان ابن العماد {cite:shadharat-dhahab p. 770-771}."
  en: "The great amir — forty years in office; the first to abolish the ten-dirham-per-camel levy on pilgrims, paying it from his own purse in 681 {cite:shadharat-dhahab p. 770-771}."
  es: "El gran emir — cuarenta años en el cargo; el primero en abolir el impuesto de diez dirhams por camello a los peregrinos, pagándolo de su propio bolsillo en 681 {cite:shadharat-dhahab p. 770-771}."
  fr: "Le grand émir — quarante ans au pouvoir; le premier à abolir la taxe de dix dirhams par chameau sur les pèlerins, la payant de sa propre poche en 681 {cite: shadharat-dhahab p. 770-771}."
  ur: "عظیم امیر - چالیس سال دفتر میں؛ حجاج پر دس درہم فی اونٹ لیوی کو ختم کرنے والے پہلے شخص نے 681 میں اسے اپنے پرس سے ادا کیا۔ 770-771}۔"
