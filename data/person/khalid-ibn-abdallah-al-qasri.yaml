summary:
  ar: "خالد بن عبد الله بن أسد بن كرز القسري من يجيلة؛ عند البلاذري بنى لأمه بيعة هي اليوم سكة البريد بالكوفة وكانت أمه نصرانية وبنى حوانيت أنشأها وجعل سقوفها أزاجاً معقودة بالآجر والجص وحفر النهر الذي يعرف بالجامع واتخذ بالقرية قصراً يعرف بقصر خالد وأصلح قنطرة الكوفة واستوثق منها وجدد مقصورة مسجد الكوفة وكان والي العراق لهشام بن عبد الملك واشتد في النقود أكثر من شدة ابن هبيرة حتى أحكم أمرها وسمت دراهم عهده خالدية من أجود نقود بني أمية. وأحدث بمكة في إمارته لسليمان أنه أدار الصفوف حول الكعبة وقد كان قبل ذلك صفوف الناس بخلاف ذلك، وأمر بالتفريق بين الرجال والنساء في الطواف حين بلغه قول الشاعر وحبذا اللاتي يزاحمننا عند استلام الحجر الأسود {cite:muruj-al-dhahab p. 165}، وكان يعني بالمنانية أيام بني أمية وكانت أمه نصرانية وكان يرمى بالزندقة، وقتل الجعد بن درهم يوم أضحى بأمر هشام بعد طول حبسه عنده وجعله بدلا من الأضحية {cite:fihrist-ibn-al-nadim p. 472-473}. ويذكر الكتاب أنه ولي مكة للوليد ثم لسليمان، وأن عمر بن عبد العزيز أشار بعزله مع عثمان بن حيان في الحجاز فعُزل في عهد سليمان {cite:salabi-umayyad-state-2020 p.180-181}، وأنه ولي العراقين لهشام بعد عزل ابن هبيرة، وعزله هشام سنة 120هـ بيوسف بن عمر فسجنه نحو أربعة عشر شهراً، ثم قدم الشام سنة 122هـ {cite:salabi-umayyad-state-2020 p.483-484}"
  en: "Khalid ibn Abdallah ibn Asad ibn Kurz al-Qasri; in al-Baladhuri he built his mother — a Christian — a church that is today's Sikkat al-Barid at Kufa, built shops with brick-and-gypsum vaulting, dug the canal called al-Jami', built Qasr Khalid, repaired and reinforced Kufa's pontoon, and renewed the mosque's maqsura."
  es: "Khalid ibn Abdallah ibn Asad ibn Kurz al-Qasri; en al-Baladhuri construyó para su madre —una cristiana— una iglesia que hoy es Sikkat al-Barid en Kufa, construyó tiendas con bóvedas de ladrillo y yeso, excavó el canal llamado al-Jami', construyó Qasr Khalid, reparó y reforzó el pontón de Kufa y renovó la maqsura de la mezquita."
  fr: "Khalid ibn Abdallah ibn Asad ibn Kurz al-Qasri; à al-Baladhuri, il construisit pour sa mère — une chrétienne — une église qui est aujourd'hui la Sikkat al-Barid à Kufa, construisit des boutiques avec des voûtes en briques et en plâtre, creusa le canal appelé al-Jami', construisit le Qasr Khalid, répara et renforça le ponton de Kufa et renouvela la maqsura de la mosquée."
  ur: "خالد بن عبداللہ بن اسد بن کرز القصری؛ البلادھوری میں اس نے اپنی والدہ - ایک عیسائی - کوفہ میں ایک چرچ بنایا جو آج کا سکت البارید ہے، اینٹوں اور جپسم کے والٹنگ کے ساتھ دکانیں تعمیر کیں، الجامع نامی نہر کھودی، قصر خالد بنوایا، کوفہ کے پونٹون کی مرمت اور مضبوطی کی، اور مقر کی مسجد کی تجدید کی۔"
  tr: "Halid ibn Abdullah ibn Asad ibn Karz al-Kasri Yajila'dan; el-Baladhuri'ye göre, annesi için bugün Kufe'de posta yolu olan bir rehin inşa etti. Annesi Hristiyandı, dükkanlar yaptı, tavanlarını tuğla ve sıva ile bağladı, cami olarak bilinen nehri kazdı ve köyde Halid sarayı olarak bilinen bir saray inşa etti. Kufe köprüsünü onardı, ona güvendi ve caminin çevresini restore etti. Hisham ibn Abd al-Malik döneminde Irak valisiydi. İbn Hubayre'den daha katı para konusunda daha katı oldu, ta ki işlerini düzene sokana kadar; onun dönemindeki dirhemler, Emevi hanedanının en güzel paralarından biri olan Halidiye olarak adlandırıldı. Mekke'de Süleyman'a yaptığı dönemde Kabe etrafında sıraları düzenlediğini, oysa ondan önce insan sıralarının farklı olduğunu anlattı. Şairin sözlerini duyduğunda Tevaf sırasında erkekler ve kadınlar arasında ayrım emredi ve Kara Taş'ı alırken bizimle rekabet edenleri tercih etti {cite:muruj-al-dhahab, s. 165}. Emevi döneminde, annesi Hristiyan ve sapkınlıkla suçlandığı dönemde 'manniyyah' demek istedi. Uzun bir hapis sonrası Hişam'ın emriyle Adha gününde öldürüldü ve bunu kurbanın yerine getirdi {cite:fihrist-ibn-al-nadim s. 472-473}. Kitapta, önce El-Velid tarafından önce Süleyman tarafından Mekke valisi olarak atandığı, Ömer bin Abdülaziz'in Osman bin Hayyan ile birlikte Hicaz'da görevden alındığını belirttiği belirtilir; bu nedenle Süleyman'ın saltanatı sırasında görevden alınmıştır {cite:salabi-umayyad-state-2020 s.180-181} ve İbn Hubayre'yi görevden aldıktan sonra Iraklıları Hişem'e atamıştır. Hisham, 120 Hicri'de Yusuf ibn Ömer ile birlikte onu görevden almış, yaklaşık on dört ay hapsetmiş, ardından 122 Hicri'de Suriye'ye dönmüştür {cite:selabi-umayyad-state-2020 s.483-484}"
  id: "Khalid ibn Abdullah ibn Asad ibn Karz al-Qasri dari Yajila; menurut al-Baladhuri, ia membangun surat jaminan untuk ibunya, yang kini menjadi jalur pos di Kufa. Ibunya beragama Kristen, dan ia membangun toko, membuat langit-langitnya dengan bata dan plester, menggali sungai yang dikenal sebagai masjid, dan membangun istana di desa yang dikenal sebagai istana Khalid. Ia memperbaiki jembatan Kufa, mempercayainya, dan memulihkan pagar masjid. Ia adalah gubernur Irak di bawah Hisham ibn Abd al-Malik. Ia menjadi lebih ketat dalam hal koin dibandingkan Ibn Hubayrah hingga ia menyelesaikan urusannya, dan dirham dari zamannya dinamai Khalidiyah, salah satu koin terbaik dari dinasti Umayyah. Ia menceritakan di Mekah selama emiraténya kepada Sulayman bahwa ia mengatur barisan di sekitar Kabah, sedangkan sebelumnya, barisan orang berbeda. Ia memerintahkan pemisahan antara pria dan wanita saat Tawaf ketika mendengar kata-kata penyair, dan ia lebih memilih mereka yang bersaing dengan kita saat menerima Batu Hitam {cite:muruj-al-dhahab, hlm. 165}. Ia berarti 'manniyyah' pada era Umayyah, ketika ibunya beragama Kristen dan dituduh bid'ah. Ia dibunuh pada hari Adha atas perintah Hisham setelah lama dipenjara dan menjadikannya pengganti pengorbanan {cite:fihrist-ibn-al-nadim hlm. 472-473}. Buku tersebut menyebutkan bahwa ia diangkat sebagai gubernur Mekah oleh Al-Walid dan kemudian oleh Sulayman, dan bahwa Umar ibn Abd al-Aziz menyatakan pemecatan bersama Uthman ibn Hayyan di Hijaz, sehingga ia diberhentikan selama masa pemerintahan Suleiman {cite:salabi-umayyad-state-2020 hlm.180-181}, dan bahwa ia menunjuk orang Irak untuk Hisham setelah memecat Ibn Hubayrah. Hisham memecatnya pada tahun 120 H bersama Yusuf ibn Umar, memenjarakannya selama sekitar empat belas bulan, lalu kembali ke Suriah pada tahun 122 H {cite:salabi-umayyad-state-2020 hlm.483-484}"
