label: { ar: "خالد بن عبد الله القسري", en: "Khalid ibn Abdallah al-Qasri" }
summary:
  ar: "خالد بن عبد الله بن أسد بن كرز القسري من يجيلة؛ عند البلاذري بنى لأمه بيعة هي اليوم سكة البريد بالكوفة وكانت أمه نصرانية وبنى حوانيت أنشأها وجعل سقوفها أزاجاً معقودة بالآجر والجص وحفر النهر الذي يعرف بالجامع واتخذ بالقرية قصراً يعرف بقصر خالد وأصلح قنطرة الكوفة واستوثق منها وجدد مقصورة مسجد الكوفة وكان والي العراق لهشام بن عبد الملك واشتد في النقود أكثر من شدة ابن هبيرة حتى أحكم أمرها وسمت دراهم عهده خالدية من أجود نقود بني أمية.، وأحدث بمكة في إمارته لسليمان أنه أدار الصفوف حول الكعبة وقد كان قبل ذلك صفوف الناس بخلاف ذلك، وأمر بالتفريق بين الرجال والنساء في الطواف حين بلغه قول الشاعر وحبذا اللاتي يزاحمننا عند استلام الحجر الأسود {cite:muruj-al-dhahab p. 165}، وكان يعني بالمنانية أيام بني أمية وكانت أمه نصرانية وكان يرمى بالزندقة، وقتل الجعد بن درهم يوم أضحى بأمر هشام بعد طول حبسه عنده وجعله بدلا من الأضحية {cite:fihrist-ibn-al-nadim p. 472-473}. ويذكر الكتاب أنه ولي مكة للوليد ثم لسليمان، وأن عمر بن عبد العزيز أشار بعزله مع عثمان بن حيان في الحجاز فعُزل في عهد سليمان {cite:salabi-umayyad-state-2020 p.180-181}، وأنه ولي العراقين لهشام بعد عزل ابن هبيرة، وعزله هشام سنة 120هـ بيوسف بن عمر فسجنه نحو أربعة عشر شهراً، ثم قدم الشام سنة 122هـ {cite:salabi-umayyad-state-2020 p.483-484}"
  en: "Khalid ibn Abdallah ibn Asad ibn Kurz al-Qasri; in al-Baladhuri he built his mother — a Christian — a church that is today's Sikkat al-Barid at Kufa, built shops with brick-and-gypsum vaulting, dug the canal called al-Jami', built Qasr Khalid, repaired and reinforced Kufa's pontoon, and renewed the mosque's maqsura."
