names:
  - { value: "أبو الفضل أحمد بن الحسين بديع الزمان الهمذاني", kind: full }
gender: male
summary:
  ar: "الحافظ المعروف ببديع الزمان صاحب المقامات المشهورة والرسائل الرائقة، كان فصيحاً مفوهاً وشاعراً مفلقاً ومن رسائله المال إذا طال مكثه ظهر خبثه وإذا سكن منه تحرك تله وكذلك الضيف يسمج لقاؤه إذا طال ثواؤه ويثقل خلله إذا انتهى محله والسلام، وكانت وفاته بمدينة هراة مسموماً وقيل مات من السكتة وعجل دفنه فأفاق في قبره وسمع صوته بالليل وإنه نبش عنه فوجدوه قد قبض على لحيته ومات من هول القبر، توفي يوم الجمعة حادي عشر جمادى الآخرة سنة ثمان وتسعين وثلاث مئة والحريري به اقتدى في مقاماته {cite:shadharat-dhahab p. 158-159}."
  en: "Badi' al-Zaman al-Hamadhani, inventor of the maqama — his letters are proverbial ('a guest's company palls when his stay runs long'); he died at Herat in 398, poisoned or, as trustworthy men told, buried too hastily after apoplexy and found in his grave clutching his beard {cite:shadharat-dhahab p. 158-159}."
  es: "Badi' al-Zaman al-Hamadhani, inventor del maqama —sus cartas son proverbiales ('la compañía de un huésped se vuelve aburrida cuando su estancia se prolonga'); murió en Herat en 398, envenenado o, como contaron hombres fidedignos, enterrado demasiado apresuradamente después de una apoplejía y encontrado en su tumba agarrándose la barba {cite:shadharat-dhahab p. 158-159}."
  fr: "Badi' al-Zaman al-Hamadhani, inventeur du maqama — ses lettres sont proverbiales (« la compagnie d'un invité s'ennuie lorsque son séjour se prolonge »); il mourut à Hérat en 398, empoisonné ou, comme l'ont raconté des hommes dignes de confiance, enterré trop hâtivement après une apoplexie et retrouvé dans sa tombe serrant sa barbe {cite:shadharat-dhahab p. 158-159}."
  ur: "بدیع الزمان الحمدانی، مکامہ کے موجد - اس کے خطوط ضرب المثل ہیں ⁦('مہمان کی کمپنی اس وقت ختم ہوجاتی ہے جب اس کا قیام طویل ہوتا ہے')⁩؛ وہ 398 میں ہرات میں مر گیا، زہر دے کر یا، جیسا کہ معتبر لوگوں نے بتایا، apoplexy کے بعد بہت جلد دفن کیا گیا اور اپنی قبر میں اپنی داڑھی پکڑے ہوئے پایا۔ 158-159}۔"
