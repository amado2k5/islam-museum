summary:
  ar: "الحافظ المعروف ببديع الزمان صاحب المقامات المشهورة والرسائل الرائقة، كان فصيحاً مفوهاً وشاعراً مفلقاً ومن رسائله المال إذا طال مكثه ظهر خبثه وإذا سكن منه تحرك تله وكذلك الضيف يسمج لقاؤه إذا طال ثواؤه ويثقل خلله إذا انتهى محله والسلام، وكانت وفاته بمدينة هراة مسموماً وقيل مات من السكتة وعجل دفنه فأفاق في قبره وسمع صوته بالليل وإنه نبش عنه فوجدوه قد قبض على لحيته ومات من هول القبر، توفي يوم الجمعة حادي عشر جمادى الآخرة سنة ثمان وتسعين وثلاث مئة والحريري به اقتدى في مقاماته {cite:shadharat-dhahab p. 158-159}."
  en: "Badi' al-Zaman al-Hamadhani, inventor of the maqama — his letters are proverbial ('a guest's company palls when his stay runs long'); he died at Herat in 398, poisoned or, as trustworthy men told, buried too hastily after apoplexy and found in his grave clutching his beard {cite:shadharat-dhahab p. 158-159}."
