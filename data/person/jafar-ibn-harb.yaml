summary:
  ar: "جعفر بن حرب كان يتقلد الأعمال الكبار للسلطان وكانت نعمته تقارب نعمة الوزارة فاجتاز يوماً راكباً في موكب له عظيم فسمع رجلاً يقرأ ألم يأن للذين آمنوا أن تخشع قلوبهم لذكر الله وما نزل من الحق فصاح اللهم بلى يكررها دفعات وبكى ثم نزل عن دابته ونزع ثيابه ودخل في دجلة واستتر بالماء {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "Ja'far ibn Harb held the sultan's great offices at near-vizierial rank; riding in a grand procession he heard the verse 'Has the time not come for the faithful to humble their hearts', cried 'Yes, O God', wept, dismounted, stripped and hid himself in the Tigris {cite:muntazam-ibn-al-jawzi p. 687}."
