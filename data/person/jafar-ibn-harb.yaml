id: person/jafar-ibn-harb
class: person
label: { ar: "جعفر بن حرب" }
summary:
  ar: "جعفر بن حرب كان يتقلد الأعمال الكبار للسلطان وكانت نعمته تقارب نعمة الوزارة فاجتاز يوماً راكباً في موكب له عظيم فسمع رجلاً يقرأ ألم يأن للذين آمنوا أن تخشع قلوبهم لذكر الله وما نزل من الحق فصاح اللهم بلى يكررها دفعات وبكى ثم نزل عن دابته ونزع ثيابه ودخل في دجلة واستتر بالماء {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "Ja'far ibn Harb held the sultan's great offices at near-vizierial rank; riding in a grand procession he heard the verse 'Has the time not come for the faithful to humble their hearts', cried 'Yes, O God', wept, dismounted, stripped and hid himself in the Tigris {cite:muntazam-ibn-al-jawzi p. 687}."
  es: "Ja'far ibn Harb ostentaba los altos cargos del sultán con un rango casi de visir; cabalgando en una gran procesión, escuchó el versículo \"¿No ha llegado el momento de que los fieles humillen sus corazones?\", gritó \"Sí, oh Dios\", lloró, desmontó, se desnudó y se escondió en el Tigris {cite:muntazam-ibn-al-jawzi p. 687}."
  fr: "Ja'far ibn Harb occupait les plus hautes fonctions du sultan à un rang proche de celui de vizir; chevauchant dans une grande procession, il entendit le verset « Le temps n'est-il pas venu pour les fidèles d'humilier leur cœur ? », s'écria « Oui, ô Dieu », pleura, descendit de cheval, se déshabilla et se cacha dans le Tigre {cite: muntazam-ibn-al-jawzi p. 687}."
