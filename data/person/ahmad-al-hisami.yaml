summary:
  ar: "شهاب الدين أحمد الحصامي القاهري الشافعي النحوي الإمام العلامة المحقق المجاهد الصوفي؛ كان بارّاً بأمه قائماً بمصالحها يخدم نفسه ويشتري حوائجه من السوق ويحملها بنفسه ولا يمكن أحداً يحملها عنه، وكان يتحمم بالقطن من غير قصارة وثيابه قصيرة اقتداء بالسلف، ملازماً للطهارة كثير الصمت قليل الكلام تجلس معه اليوم واليومين فلا تسمع منه كلمة لغو، كثير الصيام والقيام يقوم النصف الثاني من الليل كل ليلة، ويتورع عن صدقات الناس ولا يقبل هدية من أحد، وأخذ التصوف عن الشيخ علي المرصفي وكان يذهب إلى مجلسه كل يوم جمعة، وكان العلماء مع ذلك يرجعون إليه في المعقولات ويعدلونه في العربية بابن مالك وابن هشام؛ توفي بالقاهرة يوم الثلاثاء خامس عشر ربيع الآخر {cite:shadharat-dhahab p. 545}."
  en: "The nahwi the scholars compared to Ibn Malik and Ibn Hisham — yet he carried his own market goods, bathed in cotton without soap, wore short Salafi-style clothes, fasted and rose nightly, and 'you could sit with him two days and not hear one idle word'; a Murshifi Sufi, died Tuesday 15 Rabi' II [925] in Cairo {cite:shadharat-dhahab p. 545}."
