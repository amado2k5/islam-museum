summary:
  ar: "شهاب الدين أحمد الحصامي القاهري الشافعي النحوي الإمام العلامة المحقق المجاهد الصوفي؛ كان بارّاً بأمه قائماً بمصالحها يخدم نفسه ويشتري حوائجه من السوق ويحملها بنفسه ولا يمكن أحداً يحملها عنه، وكان يتحمم بالقطن من غير قصارة وثيابه قصيرة اقتداء بالسلف، ملازماً للطهارة كثير الصمت قليل الكلام تجلس معه اليوم واليومين فلا تسمع منه كلمة لغو، كثير الصيام والقيام يقوم النصف الثاني من الليل كل ليلة، ويتورع عن صدقات الناس ولا يقبل هدية من أحد، وأخذ التصوف عن الشيخ علي المرصفي وكان يذهب إلى مجلسه كل يوم جمعة، وكان العلماء مع ذلك يرجعون إليه في المعقولات ويعدلونه في العربية بابن مالك وابن هشام؛ توفي بالقاهرة يوم الثلاثاء خامس عشر ربيع الآخر {cite:shadharat-dhahab p. 545}."
  en: "The nahwi the scholars compared to Ibn Malik and Ibn Hisham — yet he carried his own market goods, bathed in cotton without soap, wore short Salafi-style clothes, fasted and rose nightly, and 'you could sit with him two days and not hear one idle word'; a Murshifi Sufi, died Tuesday 15 Rabi' II [925] in Cairo {cite:shadharat-dhahab p. 545}."
  fr: "Grammairien comparé par les savants à Ibn Malik et Ibn Hisham, qui portait pourtant lui-même ses achats du marché, se lavait avec du coton sans savon, portait des vêtements courts à la manière des premières générations, jeûnait et priait chaque nuit ; on pouvait rester deux jours avec lui sans entendre de parole vaine. Soufi murshifi, mort au Caire un mardi 15 rabi' II [925 H] {cite:shadharat-dhahab p. 545}."
  es: "El nahwi, a quien los eruditos comparaban con Ibn Malik e Ibn Hisham, sin embargo, llevaba sus propias mercancías del mercado, se bañaba en algodón sin jabón, vestía ropa corta al estilo salafista, ayunaba y se levantaba cada noche, y \"podías sentarte con él dos días y no oír una sola palabra ociosa\"; un sufí murshifi, murió el martes 15 de Rabi' II [925] en El Cairo {cita: shadharat-dhahab p. 545}."
  ur: "نحوی علماء نے ابن مالک اور ابن ہشام سے موازنہ کیا - پھر بھی وہ اپنا بازاری سامان لے کر جاتا، بغیر صابن کے روئی میں نہاتا، مختصر سلفی طرز کے کپڑے پہنتا، روزے رکھتا اور رات کو اٹھتا، اور 'آپ اس کے ساتھ دو دن بیٹھ سکتے تھے اور ایک لغو بات نہیں سن سکتے تھے'؛ ایک مرشد صوفی، منگل 15 ربیع الثانی [925] قاہرہ میں فوت ہوا۔ 545}۔"
