summary:
  ar: "مسرحي ومخرج وشاعر وممثل هندي (1923–2009)، وُلد باسم حبيب أحمد خان في رايبور، وأسس فرقة «نايا ثييتر» في بوبال سنة 1959، واشتهر بعمله مع فناني تشاتيسغار القبليين ومسرحيته «شرنداس تشور» (1975)."
  en: "Indian playwright, theatre director, poet and actor (1923–2009), born Habib Ahmed Khan at Raipur, who founded the Naya Theatre company at Bhopal in 1959 and became known for his work with Chhattisgarhi folk performers and his play Charandas Chor (1975)."
  ur: "بھارتی ڈراما نگار، تھیٹر ہدایت کار، شاعر اور اداکار (1923–2009)، جو رائے پور میں حبیب احمد خان کے نام سے پیدا ہوئے؛ انھوں نے 1959 میں بھوپال میں «نیا تھئیٹر» کمپنی قائم کی اور چھتیس گڑھ کے لوک فنکاروں کے ساتھ اپنے کام اور ڈرامے «چرنداس چور» (1975) کے لیے مشہور ہوئے۔"
