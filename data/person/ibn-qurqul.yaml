summary:
  ar: "صاحب كتاب «مطالع الأنوار»؛ كان من الفضلاء الصلحاء صحب علماء الأندلس وكتابه ضاهى به «مشارق الأنوار» للقاضي عياض؛ صلى الجمعة في الجامع ثم حضرته الوفاة فتلا سورة الإخلاص وكررها بسرعة ثم تشهد ثلاث مرات وسقط على وجهه ميتاً ساجداً {cite:shadharat-dhahab p. 573}."
  en: "Author of Matali' al-Anwar, whose book 'rivalled Qadi Iyad's Mashariq'; he prayed the Friday prayer in the Jami', then death came on him — he recited Sura al-Ikhlas rapidly, bore witness thrice, and fell dead on his face in prostration {cite:shadharat-dhahab p. 573}."
  es: "Autor de Matali' al-Anwar, cuyo libro 'rivalizó con el Mashariq' de Qadi Iyad'; rezó la oración del viernes en el Jami', luego le sobrevino la muerte; recitó rápidamente la Sura al-Ikhlas, dio testimonio tres veces y cayó muerto sobre su rostro en postración {cite:shadharat-dhahab p. 573}."
  fr: "Auteur de Matali' al-Anwar, dont le livre « rivalisait avec le Mashariq de Qadi Iyad »; il priait la prière du vendredi dans le Jami', puis la mort le surprit — il récita rapidement la sourate al-Ikhlas, témoigna trois fois et tomba mort sur le visage en prosternation {cite:shadharat-dhahab p. 573}."
