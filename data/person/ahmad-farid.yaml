summary:
  ar: "داعية وكاتب مصري وُلد سنة 1952 في منيا القمح، طبيب من خرّيجي جامعة الإسكندرية، تعدّه ويكيبيديا العربية من شيوخ السلفية في مصر وعضوًا في مجلس أمناء الدعوة السلفية بالإسكندرية، وله مصنفات في الزهد وتزكية النفوس والعقيدة، منها «البحر الرائق في الزهد والرقائق»، ويحفظ له أرشيف أسابيل سلسلة دروس قصيرة في الإيمان والتقوى."
  en: "Egyptian preacher and writer born in 1952 in Minya al-Qamh, a physician who graduated from Alexandria University, whom the Arabic Wikipedia counts among the Salafi shaykhs of Egypt and a member of the board of trustees of al-Da'wa al-Salafiyya in Alexandria; author of books on asceticism, the purification of the soul and creed, among them 'al-Bahr al-ra'iq fi al-zuhd wa-l-raqa'iq', and of a series of short lessons on faith and piety kept in the Assabile archive."
  ur: "مصری داعی اور مصنف، 1952 میں منیا القمح میں پیدا ہوئے، جامعہ اسکندریہ سے فارغ التحصیل طبیب، جنہیں عربی ویکیپیڈیا مصر کے سلفی شیوخ میں اور اسکندریہ میں الدعوۃ السلفیہ کے مجلسِ امنا کا رکن شمار کرتا ہے؛ زہد، تزکیۂ نفس اور عقیدے پر کتابوں کے مصنف، جن میں «البحر الرائق فی الزہد والرقائق» ہے، اور ایمان و تقویٰ پر مختصر دروس کے ایک سلسلے کے مقرر جو اسابیل آرکائیو میں محفوظ ہے۔"
