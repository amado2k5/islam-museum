id: person/abu-ali-ibn-ustadh-hurmuz
class: person
label: { ar: "عميد الجيوش أبو علي الحسن بن أستاذ هرمز", en: "Amid al-Juyush Abu Ali al-Hasan ibn Ustadh Hurmuz", fr: "Amid al-Juyush Abu Ali al-Hasan ibn Ustadh Hurmuz", es: "Amid al-Juyush Abu Ali al-Hasan ibn Ustadh Hurmuz", ur: "امد الجیوش ابو علی الحسن بن استاد ہرمز" }
summary:
  ar: "الحسن بن أبي جعفر أستاذ هرمز أبو علي الملقب عميد الجيوش، ولد سنة خمسين وثلاثمائة، وكان أبوه من حجاب عضد الدولة، فخدم هو صمصام الدولة وبهاء الدولة، وولاه بهاء الدولة تدبير العراق فقدم بغداد سنة اثنتين وتسعين وثلثمائة والفتن متأججة والعيارون قد استولوا، فضبط البلد بحزم وشدة ومنع السنة والشيعة من إظهار المذاهب في المواسم ونفى ابن المعلم فقيه الشيعة حتى انقادت له الأمور وسكنت الفتن، وظل مدبراً للعراق حتى توفي في ذي القعدة سنة إحدى وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
  en: "Al-Hasan ibn Abi Ja'far Ustadh Hurmuz, Abu Ali, titled Amid al-Juyush, born in 350. His father had been one of the chamberlains of Adud al-Dawla; he himself served Samsam al-Dawla and Baha' al-Dawla, and Baha' al-Dawla appointed him to manage Iraq. He came to Baghdad in 392, when strife was blazing and the 'ayyarun had seized control; he kept the city under firm and severe control, forbade Sunnis and Shi'is to display their madhhabs at the festivals, and exiled Ibn al-Mu'allim, the Shi'i jurist, until affairs came under his control and the strife subsided. He remained managing Iraq until he died in Dhu al-Qa'da 401 {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
  fr: "Al-Hasan ibn Abi Ja'far Ustadh Hurmuz, Abu Ali, surnommé Amid al-Juyush, né en 350. Son père avait été l'un des chambellans d'Adud al-Dawla ; lui-même servit Samsam al-Dawla et Baha' al-Dawla, et Baha' al-Dawla le chargea d'administrer l'Iraq. Il vint à Bagdad en 392, alors que la discorde flambait et que les 'ayyarun avaient pris le dessus ; il tint la ville d'une main ferme et sévère, interdit aux sunnites et aux chiites d'afficher leurs écoles lors des fêtes, et exila Ibn al-Mu'allim, le juriste chiite, jusqu'à ce que les affaires lui soient soumises et que la discorde s'apaise. Il administra l'Iraq jusqu'à sa mort en Dhu al-Qa'da 401 {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
  es: "Al-Hasan ibn Abi Ja'far Ustadh Hurmuz, Abu Ali, con el título de Amid al-Juyush, nació en 350. Su padre había sido uno de los chambelanes de Adud al-Dawla; él mismo sirvió a Samsam al-Dawla y a Baha' al-Dawla, y Baha' al-Dawla lo designó para administrar Irak. Llegó a Bagdad en 392, cuando la contienda era acalorada y los ayyarun habían tomado el control; mantuvo la ciudad bajo un control firme y severo, prohibió a sunitas y chiítas exhibir sus madhhabs en las festividades y exilió a Ibn al-Mu'allim, el jurista chiíta, hasta que los asuntos quedaron bajo su control y la contienda amainó. Continuó administrando Irak hasta su muerte en Dhu al-Qa'da 401 {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
  ur: "الحسن ابن ابی جعفر استاد ہرمز، ابو علی، امید الجیوش کے لقب سے، 350 میں پیدا ہوئے۔ ان کے والد عود الدولہ کے ایوانوں میں سے تھے؛ اس نے خود صمصام الدولہ اور بہاء الدولہ کی خدمت کی اور بہاء الدولہ نے اسے عراق کا انتظام کرنے کے لیے مقرر کیا۔ وہ 392 میں بغداد آیا، جب لڑائی چل رہی تھی اور عیارون نے قبضہ کر لیا تھا۔ اس نے شہر کو مضبوط اور سخت کنٹرول میں رکھا، سنیوں اور شیعوں کو تہواروں میں اپنے مذاہب کی نمائش کرنے سے منع کیا، اور شیعہ فقیہ ابن المعلم کو جلاوطن کر دیا، یہاں تک کہ معاملات اس کے کنٹرول میں آ گئے اور جھگڑا ختم ہو گیا۔ ذوالقعدہ 401 میں وفات تک وہ عراق کا انتظام کرتا رہا"
  tr: "Hormuz Ebu Ali'nin hocası ve Orduların Komutanı lakaplı Hasan ibn Ebu Cafer, Hicri 350 yılında doğmuştur. Babası Adud el-Davla'nın saray görevlilerinden biriydi, bu yüzden Samsam el-Davla ve Baha el-Davla'ya hizmet etti. Baha el-Davla onu Irak'ı yönetmekle görevlendirdi, bu yüzden Hicri 392 yılında Bağdat'a geldi. O dönemde fitneler yaygındı ve haydutlar ülkeyi ele geçirmişti. Bu nedenle ülkeyi sıkı ve sert bir şekilde kontrol altına aldı, Sünnilerin ve Şiilerin mevsimlerde kendi doktrinlerini sergilemelerini engelledi ve Şii hukukçu İbn el-Muallim'i sürgüne gönderdi. İşler kendisine boyun eğene ve fitneler yatışana kadar Irak'ı yönetmeye devam etti. Hicri 401 yılında Zülkade'de vefat edene kadar Irak'ı yönetmeye devam etti. {alıntı:muntazam-ibn-el-cevzi j.7 s.220,252}."
  id: "Al-Hasan ibn Abi Ja'far, guru Hormuz Abu Ali, yang dijuluki Panglima Pasukan, lahir pada tahun 350 H. Ayahnya adalah salah satu pengawal Adud al-Dawla, sehingga ia mengabdi kepada Samsam al-Dawla dan Baha' al-Dawla. Baha' al-Dawla menunjuknya untuk mengelola Irak, sehingga ia datang ke Baghdad pada tahun 392 H, dan pemberontakan sedang berkecamuk serta para perampok telah menguasai wilayah tersebut. Maka ia mengendalikan negara dengan tegas dan keras, serta mencegah kaum Sunni dan Syiah untuk menyebarkan ajaran mereka selama musim-musim tertentu. Ia juga mengasingkan Ibn al-Mu'allim, seorang ahli hukum Syiah, hingga keadaan kembali tenang dan pemberontakan mereda. Ia tetap mengelola Irak hingga wafat pada bulan Dzul Qa'dah tahun 401 H. {kutip:muntazam-ibn-al-jawzi j.7 hal.220,252}."
