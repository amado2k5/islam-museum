  ar: "الحسن بن أبي جعفر أستاذ هرمز أبو علي الملقب عميد الجيوش، ولد سنة خمسين وثلاثمائة، وكان أبوه من حجاب عضد الدولة، فخدم هو صمصام الدولة وبهاء الدولة، وولاه بهاء الدولة تدبير العراق فقدم بغداد سنة اثنتين وتسعين وثلثمائة والفتن متأججة والعيارون قد استولوا، فضبط البلد بحزم وشدة ومنع السنة والشيعة من إظهار المذاهب في المواسم ونفى ابن المعلم فقيه الشيعة حتى انقادت له الأمور وسكنت الفتن، وظل مدبراً للعراق حتى توفي في ذي القعدة سنة إحدى وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
