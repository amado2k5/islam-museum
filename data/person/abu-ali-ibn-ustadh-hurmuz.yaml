id: person/abu-ali-ibn-ustadh-hurmuz
class: person
label: { ar: "عميد الجيوش أبو علي الحسن بن أستاذ هرمز", en: "Amid al-Juyush Abu Ali al-Hasan ibn Ustadh Hurmuz" }
summary:
  ar: "الحسن بن أبي جعفر أستاذ هرمز أبو علي الملقب عميد الجيوش، ولد سنة خمسين وثلاثمائة، وكان أبوه من حجاب عضد الدولة، فخدم هو صمصام الدولة وبهاء الدولة، وولاه بهاء الدولة تدبير العراق فقدم بغداد سنة اثنتين وتسعين وثلثمائة والفتن متأججة والعيارون قد استولوا، فضبط البلد بحزم وشدة ومنع السنة والشيعة من إظهار المذاهب في المواسم ونفى ابن المعلم فقيه الشيعة حتى انقادت له الأمور وسكنت الفتن، وظل مدبراً للعراق حتى توفي في ذي القعدة سنة إحدى وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
  en: "Al-Hasan ibn Abi Ja'far Ustadh Hurmuz, Abu Ali, titled Amid al-Juyush, born in 350. His father had been one of the chamberlains of Adud al-Dawla; he himself served Samsam al-Dawla and Baha' al-Dawla, and Baha' al-Dawla appointed him to manage Iraq. He came to Baghdad in 392, when strife was blazing and the 'ayyarun had seized control; he kept the city under firm and severe control, forbade Sunnis and Shi'is to display their madhhabs at the festivals, and exiled Ibn al-Mu'allim, the Shi'i jurist, until affairs came under his control and the strife subsided. He remained managing Iraq until he died in Dhu al-Qa'da 401 {cite:muntazam-ibn-al-jawzi j.7 p.220,252}."
