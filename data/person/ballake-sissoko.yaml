summary:
  ar: "عازف كورا وملحّن مالي من أسرة جلي (غريو)، وُلد في باماكو سنة 1967. خلف أباه في «المجموعة الآلية الوطنية» بمالي وهو في الثالثة عشرة، وذاعت شهرته بدويتو «أوتار قديمة جديدة» (1999) مع توماني دياباتي، ثم بأعماله مع التشيللو الفرنسي فانسان سيغال، وبفرقة 3MA، وبألبومات مثل «جورو» (2021)."
  en: "Malian kora player and composer from a djeli (griot) family, born at Bamako in 1967. He took his father's place in Mali's Ensemble Instrumental National at thirteen, came to fame with the duet album New Ancient Strings (1999) with Toumani Diabaté, and went on to work with the French cellist Vincent Ségal, the trio 3MA, and albums such as Djourou (2021)."
  ur: "مالی کے کورا نواز و موسیقی ساز، جو جیلی (گریو) خاندان سے ہیں اور 1967 میں بماکو میں پیدا ہوئے۔ تیرہ سال کی عمر میں اپنے والد کی جگہ مالی کے قومی ساز گروپ میں لی، 1999 میں تومانی دیاباتے کے ساتھ دو گانوں کے البم «نیو اینشینٹ سٹرنگز» سے شہرت پائی، اور پھر فرانسیسی چیلو نواز وینسنٹ سیگال اور سہ رخی گروپ 3MA کے ساتھ کام کیا۔"
