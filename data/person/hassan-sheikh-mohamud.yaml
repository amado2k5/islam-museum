summary:
  ar: "سياسي صومالي (ولد 1955) من جلالاقسي، أكاديمي وناشط مدني شارك في تأسيس جامعة سيماد في مقديشو وأسس حزب السلم والتنمية، صار رئيس الصومال (2012–2017) ثم عاد إلى الرئاسة في 2022 خلفا لمحمد عبد الله محمد — أول رئيس صومالي يخدم فترتين غير متتاليتين — ودافع عن أطروحته للدكتوراه وهو في المنصب؛ ومنذ مايو 2026 تنازع المعارضة استمراره في الرئاسة بعد التعديلات الدستورية."
  en: "Somali politician (born 1955) from Jalalaqsi, an academic and civil-society figure who co-founded SIMAD University in Mogadishu and founded the Peace and Development Party, who became president of Somalia (2012–2017) and returned to the presidency in 2022 succeeding Mohamed Abdullahi Mohamed — the first Somali president to serve two non-consecutive terms — and defended his doctoral dissertation while in office; since May 2026 the opposition has disputed his continuation as president following constitutional amendments."
  ur: "صومالی سیاست دان (پیدائش 1955ء) جن کا تعلق جلالاقسی سے ہے؛ ماہرِ تعلیم اور سول سوسائٹی کی شخصیت، مقديشو میں سماد یونیورسٹی کے شریک بانی اور پیس اینڈ ڈیولپمنٹ پارٹی کے بانی؛ صومالیہ کے صدر بنے (2012ء–2017ء) اور پھر 2022ء میں محمد عبد اللہ محمد کے جانشین کے طور پر دوبارہ صدر منتخب ہوئے — دو غیر مسلسل مدتوں تک صدر رہنے والے پہلے صومالی صدر — اور عہدے پر رہتے ہوئے اپنے ڈاکٹریٹ کے مقالے کا دفاع کیا؛ مئی 2026ء سے حزبِ اختلاف آئینی ترامیم کے بعد ان کے استمرار کو متنازع قرار دیتی ہے۔"
