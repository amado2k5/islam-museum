summary:
  ar: "صحفي وكاتب بريطاني من أصل صومالي، وُلد في مقديشو سنة 1967 وانتقل إلى بريطانيا في الثانية من عمره. اشتهر مراسلًا لبي بي سي من بغداد إبان غزو العراق سنة 2003، ثم قدّم برنامج «ويتنس» على الجزيرة الإنجليزية، وهو منذ 2013 في أخبار آي تي في محررًا للشؤون الدولية، وألّف «يوم الثورة» (2005) و«نصف مني فقط: أن تكون مسلمًا في بريطانيا» (2006)."
  en: "Somali-born British journalist and writer, born in Mogadishu in 1967 and brought to Britain at the age of two. He made his name as the BBC's Baghdad correspondent during the 2003 invasion of Iraq, presented Witness on Al Jazeera English, and since 2013 has been ITV News's international affairs editor; he wrote Revolution Day (2005) and Only Half of Me: Being a Muslim in Britain (2006)."
  ur: "صومالی نژاد برطانوی صحافی اور مصنف، جو 1967 میں موغادیشو میں پیدا ہوئے اور دو سال کی عمر میں برطانیہ آئے۔ 2003 میں عراق پر حملے کے دوران بی بی سی کے بغداد نمائندے کے طور پر شہرت پائی، الجزیرہ انگلش پر «وٹنیس» پیش کیا، اور 2013 سے آئی ٹی وی نیوز کے بین الاقوامی امور کے مدیر ہیں؛ «ریوولوشن ڈے» (2005) اور «اونلی ہاف آف می» (2006) کے مصنف ہیں۔"

