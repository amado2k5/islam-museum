summary:
  ar: "أزدي؛ وجّهه معاوية بن أبي سفيان إلى أطرابلس في خلافة عثمان فبنى في مرج على أميال منها حصناً سمّي حصن سفيان وقطع المادة عن أهلها وحاصرهم حتى اجتمعوا في أحد حصونهم الثلاثة وكتبوا إلى ملك الروم فأرسل إليهم مراكب ركبوها ليلاً وهربوا، فأصبح سفيان فوجد الحصن خالياً فدخله وكتب بالفتح إلى معاوية فأسكنه جماعة كبيرة من اليهود وهو الذي فيه الميناء؛ وكان معاوية يوجّه إليها كل عام جماعة من الجند يشحنها بهم ويوليها عاملاً فإذا انغلق البحر قفلوا وبقي العامل في جماعة يسيرة، حتى نقضها أهلها أيام عبد الملك فسكنها بطريق رومي ثم قُتل هو وعاملها وقيل أُسر فقُتل وصُلب."
  en: "An Azdi; Mu'awiya ibn Abi Sufyan sent him to Tripoli in Uthman's caliphate, where he built a fortress in a meadow some miles off called Hisn Sufyan, cut the people's supplies and besieged them until they gathered in one of their three strongholds and wrote to the Roman king, who sent ships they boarded by night and fled — Sufyan finding the stronghold empty at dawn, entering it and writing the conquest to Mu'awiya, who settled a great company of Jews in it, it being the one holding the port today; Mu'awiya used to send a company of troops each year to garrison it under an agent who stayed with a small party when the sea closed, until its people broke faith in Abd al-Malik's days and a Byzantine patrician occupied it, was killed — or captured and crucified — with his agent."
  es: "An Azdi; Mu'awiya ibn Abi Sufyan lo envió a Trípoli en el califato de Uthman, donde construyó una fortaleza en una pradera a algunas millas de distancia llamada Hisn Sufyan, cortó los suministros del pueblo y los sitió hasta que se reunieron en una de sus tres fortalezas y escribieron al rey romano, quien envió barcos que abordaron de noche y huyeron. Sufyan encontró la fortaleza vacía al amanecer, entró en ella y escribió la conquista a Mu'awiya, quien estableció allí una gran compañía de judíos, siendo esta la que controla el puerto hoy en día. Mu'awiya solía enviar una compañía de tropas cada año para guarnecerla bajo el mando de un agente que permanecía con un pequeño grupo cuando el mar se cerraba, hasta que su pueblo rompió la fe en los días de Abd al-Malik y un patricio bizantino la ocupó, fue asesinado, o capturado y crucificado, junto con su agente."
  fr: "Un Azdi; Mu'awiya ibn Abi Sufyan l'envoya à Tripoli, dans le califat d'Uthman, où il construisit une forteresse dans une prairie à quelques kilomètres de là, appelée Hisn Sufyan. Il coupa les approvisionnements de la population et l'assiégea jusqu'à ce qu'elle se rassemble dans l'une de ses trois forteresses et écrive au roi romain, qui envoya des navires. Ils y embarquèrent de nuit et s'enfuirent. Sufyan trouva la forteresse vide à l'aube, y entra et écrivit la conquête à Mu'awiya, qui y installa une importante communauté juive. C'est cette forteresse qui contrôle encore aujourd'hui le port. Mu'awiya avait coutume d'y envoyer chaque année une compagnie de soldats pour la garnir, sous les ordres d'un agent qui restait avec un petit groupe lorsque la mer se fermait. Jusqu'à ce que ses habitants rompent leur foi sous le règne d'Abd al-Malik et qu'un patricien byzantin l'occupe, soit tué, soit capturé et crucifié avec son agent."
  ur: "ایک ایزدی؛ معاویہ بن ابی سفیان نے اسے عثمان کے دور خلافت میں طرابلس بھیجا، جہاں اس نے حسن سفیان کے نام سے کچھ میل دور ایک گھاس کے میدان میں ایک قلعہ بنایا، لوگوں کا سامان کاٹ کر ان کا محاصرہ کیا یہاں تک کہ وہ اپنے تین مضبوط قلعوں میں سے ایک میں جمع ہو گئے اور رومی بادشاہ کو لکھا، جس نے بحری جہاز بھیجے جو وہ رات کے وقت سُفیان میں سوار ہو کر مضبوط بحری جہاز تلاش کرتے رہے۔ اس میں داخل ہو کر معاویہ کو فتح کا خط لکھ دیا، جس نے اس میں یہودیوں کی ایک بڑی جماعت کو بسایا، یہ آج بندرگاہ پر قابض ہے۔ معاویہ ہر سال فوجوں کی ایک جماعت بھیجتا تھا تاکہ اسے ایک ایجنٹ کے ماتحت رکھا جائے جو سمندر بند ہونے پر ایک چھوٹی سی جماعت کے ساتھ رہتا تھا، یہاں تک کہ اس کے لوگوں نے عبد الملک کے زمانے سے ایمان توڑ دیا اور ایک بازنطینی سرپرست اس پر قابض ہو گیا، اسے اپنے ایجنٹ کے ساتھ قتل کر دیا گیا یا گرفتار کر کے مصلوب کر دیا گیا۔"
  tr: "Azdi; Muawiya ibn Abi Sufyan, Osman halifeliği sırasında onu Trablus'a gönderdi; burada bir çayırda Sufyan kalesi adında bir kale inşa etti, halkının kaynaklarını kesti ve kuşattı, ta ki üç kaleden birinde toplanana kadar. Roma kralına yazdılar, kral onlara gemiler gönderdi, gece binip kaçtılar. Sufyan boşaldı, kalenin boş olduğunu gördü, içeri girdi ve Muawiya'ya fethedilmesini yazdı. Oraya büyük bir Yahudi grubu yerleşti, burası limandı. Muaviya her yıl bir grup asker gönderir, onları yükler ve işçi olarak atardı. Deniz kapandığında kilitlenirlerdi ve vali küçük bir grupta kalır, ta ki halkı Abdülmalik'in günlerini kırana kadar; Abd al-Malik oraya Roma yolunda yerleşti, sonra o ve valisi öldürüldü, bazıları onun yakalanıp öldürüldüğünü ve çarmıha gerildiğini söyledi."
  id: "Azdi; Muawiya ibn Abi Sufyan mengirimnya ke Tripoli selama kekhalifahan Uthman, di mana ia membangun benteng yang disebut benteng Sufyan di padang rumput yang berjarak mil-mil, memutus sumber daya dari rakyatnya, dan mengepung mereka hingga mereka berkumpul di salah satu dari tiga benteng mereka. Mereka menulis kepada raja Romawi, yang mengirim kapal kepada mereka yang mereka tunggangi pada malam hari dan melarikan diri. Sufyan menjadi kosong, menemukan benteng itu kosong, masuk ke dalamnya, dan menulis kepada Muawiya untuk menaklukkannya. Sekelompok besar orang Yahudi menetap di sana, yang merupakan pelabuhan di sana. Muawiya mengirim sekelompok tentara setiap tahun, memuat mereka bersama mereka, dan menugaskan mereka sebagai pekerja. Ketika laut ditutup, mereka akan dikurung, dan gubernur tetap dalam kelompok kecil, sampai rakyatnya menembus masa Abd al-Malik yang menetap di sana di jalan Romawi, lalu ia dan gubernurnya dibunuh, dan beberapa mengatakan ia ditangkap, dibunuh, dan disalib."
