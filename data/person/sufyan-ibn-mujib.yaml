summary:
  ar: "أزدي؛ وجّهه معاوية بن أبي سفيان إلى أطرابلس في خلافة عثمان فبنى في مرج على أميال منها حصناً سمّي حصن سفيان وقطع المادة عن أهلها وحاصرهم حتى اجتمعوا في أحد حصونهم الثلاثة وكتبوا إلى ملك الروم فأرسل إليهم مراكب ركبوها ليلاً وهربوا، فأصبح سفيان فوجد الحصن خالياً فدخله وكتب بالفتح إلى معاوية فأسكنه جماعة كبيرة من اليهود وهو الذي فيه الميناء؛ وكان معاوية يوجّه إليها كل عام جماعة من الجند يشحنها بهم ويوليها عاملاً فإذا انغلق البحر قفلوا وبقي العامل في جماعة يسيرة، حتى نقضها أهلها أيام عبد الملك فسكنها بطريق رومي ثم قُتل هو وعاملها وقيل أُسر فقُتل وصُلب."
  en: "An Azdi; Mu'awiya ibn Abi Sufyan sent him to Tripoli in Uthman's caliphate, where he built a fortress in a meadow some miles off called Hisn Sufyan, cut the people's supplies and besieged them until they gathered in one of their three strongholds and wrote to the Roman king, who sent ships they boarded by night and fled — Sufyan finding the stronghold empty at dawn, entering it and writing the conquest to Mu'awiya, who settled a great company of Jews in it, it being the one holding the port today; Mu'awiya used to send a company of troops each year to garrison it under an agent who stayed with a small party when the sea closed, until its people broke faith in Abd al-Malik's days and a Byzantine patrician occupied it, was killed — or captured and crucified — with his agent."
