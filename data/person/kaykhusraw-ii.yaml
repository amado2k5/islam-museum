aliases: [Ghiyath al-Din Kaykhusraw II, Kay Khusraw II, Keyhüsrev II]
summary:
  ar: "كيخسرو الثاني سلطان سلاجقة الروم، خلف أباه علاء الدين كيقباد الأول سنة 634هـ/1237م، وانتهى حكمه بهزيمته أمام المغول في كوسه داغ بين أرزنجان وسيواس يوم 6 محرم 641هـ/26 يونيو 1243م، فتحولت السلطنة بعدها إلى التبعية للمغول. توفي في شتاء 1245-1246م وهو في نحو الأربعين، وترك أبناء قاصرين {cite:encyclopaedia-of-islam-2 vol. 4 p. 854-855}."
  en: "Kaykhusraw II was the Seljuk sultan of Rum who succeeded his father Kaykubad I in 634/1237. His reign ended in catastrophe when the Mongols defeated him at Köse Dagh, between Erzincan and Sivas, on 6 Muharram 641/26 June 1243, and the sultanate never recovered its independence. He died in the winter of 1245-6, about forty years old, leaving only minor sons {cite:encyclopaedia-of-islam-2 vol. 4 p. 854-855}."
  ur: "کیخسرو دوم سلجوقیانِ روم کا سلطان تھا جو اپنے والد کیقباد اول کی جگہ 634ھ/1237ء میں تخت نشین ہوا۔ 6 محرم 641ھ/26 جون 1243ء کو ارزنجان اور سیواس کے درمیان کوسہ داغ میں منگولوں کے ہاتھوں شکست کھانے سے اس کا دور تباہی پر ختم ہوا اور سلطنت پھر کبھی اپنی خودمختاری بحال نہ کر سکی۔ وہ سردیوں 1245-1246ء میں تقریباً چالیس سال کی عمر میں فوت ہوا اور صرف کم سن بیٹے چھوڑ گیا {cite:encyclopaedia-of-islam-2 vol. 4 p. 854-855}."
