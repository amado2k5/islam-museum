kids:
  ar: "كيخسرو الثاني كان سلطانًا على بلاد الروم السلجوقية، وفي أيامه جاء جيش المغول فهزمه في معركة كبيرة."
  en: "Kaykhusraw II was a Seljuk sultan in Anatolia, and in his day a great Mongol army came and defeated him in a big battle."
