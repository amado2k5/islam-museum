summary:
  ar: "أبو بكر عبد الله بن محمد بن النعمان بن عبد السلام، أحد الأخوين اللذين ورثا العلم والعبادة عن أسلافهما، وغلبت عليه القدوة والرواية. أورد له أبو نعيم حديثًا عن عائشة في فضل ترك الذنوب لمن أراد أن يسبق المجتهد."
  en: "Abu Bakr Abd Allah ibn Muhammad ibn al-Nu'man ibn Abd al-Salam, one of two brothers who inherited learning and devotion from their renowned forebears; his dominant traits were example and transmission. Abu Nu'aym gives him a report from Aisha on refraining from sins as the way to outstrip the diligent."
  ur: "ابو بکر عبد اللہ بن محمد بن نعمان بن عبد السلام، دو بھائیوں میں سے ایک جنہوں نے اپنے مشہور اسلاف سے علم اور عبادت وراثت میں پائی؛ ان پر غالب وصف اقتدا اور روایت تھا۔ ابو نعیم نے ان سے عائشہ کی ایک روایت نقل کی ہے، جو گناہ ترک کرنے کو محنتی شخص سے آگے بڑھنے کا راستہ بتاتی ہے۔"
