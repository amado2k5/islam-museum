summary:
  ar: "أبو بكر عبد الله بن محمد بن النعمان بن عبد السلام، أحد الأخوين اللذين ورثا العلم والعبادة عن أسلافهما، وغلبت عليه القدوة والرواية. أورد له أبو نعيم حديثًا عن عائشة في فضل ترك الذنوب لمن أراد أن يسبق المجتهد."
  en: "Abu Bakr Abd Allah ibn Muhammad ibn al-Nu'man ibn Abd al-Salam, one of two brothers who inherited learning and devotion from their renowned forebears; his dominant traits were example and transmission. Abu Nu'aym gives him a report from Aisha on refraining from sins as the way to outstrip the diligent."
  fr: "Abu Bakr Abd Allah ibn Muhammad ibn al-Nu'man ibn Abd al-Salam, l'un de deux frères qui héritèrent le savoir et la dévotion de leurs illustres ancêtres ; ses traits dominants étaient l'exemple et la transmission. Abu Nu'aym lui attribue un récit d'Aisha sur l'abstention des péchés comme moyen de devancer les assidus."
  ur: "ابو بکر عبد اللہ بن محمد بن نعمان بن عبد السلام، دو بھائیوں میں سے ایک جنہوں نے اپنے مشہور اسلاف سے علم اور عبادت وراثت میں پائی؛ ان پر غالب وصف اقتدا اور روایت تھا۔ ابو نعیم نے ان سے عائشہ کی ایک روایت نقل کی ہے، جو گناہ ترک کرنے کو محنتی شخص سے آگے بڑھنے کا راستہ بتاتی ہے۔"
  es: "Abu Bakr Abd Allah ibn Muhammad ibn al-Nu'man ibn Abd al-Salam, uno de dos hermanos que heredaron el saber y la devoción de sus renombrados antepasados, se caracterizó principalmente por su capacidad de dar ejemplo y transmitir sus enseñanzas. Abu Nu'aym le transmite un relato de Aisha sobre la importancia de abstenerse de los pecados para superar a los diligentes."
  tr: "Ebu Bekir Abdullah ibn Muhammed ibn el-Nu'man ibn Abd el-Selam, atalarından ilim ve takva miras alan iki kardeşten biriydi ve örnek davranışları ve hadis rivayetleriyle tanınıyordu. Ebu Nu'aym, ondan Aişe'den rivayet edilen, gayretli âlimleri geçmek isteyenler için günahlardan uzak durmanın faziletine dair bir hadisi de eserine dahil etmiştir."
  id: "Abu Bakr Abdullah ibn Muhammad ibn al-Nu'man ibn Abd al-Salam adalah salah satu dari dua bersaudara yang mewarisi ilmu dan ketakwaan dari leluhur mereka, dan beliau dikenal karena perilaku teladan dan periwayatan haditsnya. Abu Nu'aym menyertakan sebuah hadits darinya berdasarkan riwayat Aisyah mengenai keutamaan menjauhi dosa bagi mereka yang ingin melampaui ulama yang tekun."
