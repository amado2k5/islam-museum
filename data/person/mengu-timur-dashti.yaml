id: person/mengu-timur-dashti
class: person
label:
  ar: منكوتمر بن طغان ملك الدست
  en: Mengu-Timur, king of the Dasht
  es: "Mengu-Timur, king of the Dasht"
  fr: "Mengu-Timur, king of the Dasht"
  ur: "مینگو تیمور، دشت کا بادشاہ"
summary:
  ar: "منكوتمر بن طغان بن ناظو خان بن دوشي ⁦(جوجي)⁩، ملك الدست بالشمال بعد بركة سنة 665هـ؛ طالت أيامه، وزحف سنة 670هـ إلى القسطنطينية فتلقاه ملكها بالخضوع والرغبة فرجع عنها، ثم زحف سنة 680هـ إلى بلاد الشام في مظاهرة أبغا بن هلاكو فنازل حماة وكانت الدائرة عليه بظاهر حمص من المنصور قلاوون، وهلك سنة 681هـ فملك مكانه ابنه تدان."
  en: "Mengu-Timur ibn Taghan ibn Batu (Naju) ibn Jochi, king of the northern Dasht after Berke in 665 AH; long of days, he marched on Constantinople in 670 whose king met him in submission, then on Syria in 680 in concert with Abaga — besieged Hama and met disaster at Homs against al-Mansur Qalawun — dying in 681, when his son Tudan succeeded."
  es: "Mengu-Timur ibn Taghan ibn Batu (Naju) ibn Jochi, rey del Dasht del norte después de Berke en 665 AH; de largos días, marchó sobre Constantinopla en 670, cuyo rey lo recibió en sumisión, luego sobre Siria en 680 en colaboración con Abaga, sitió Hama y sufrió un desastre en Homs contra al-Mansur Qalawun, muriendo en 681, cuando su hijo Tudan lo sucedió."
  fr: "Mengu-Timur ibn Taghan ibn Batu (Naju) ibn Jochi, roi du Dasht du Nord après Berke en 665 AH; longs jours, il marcha sur Constantinople en 670 dont le roi le rencontra en soumission, puis sur la Syrie en 680 de concert avec Abaga — assiégea Hama et connut un désastre à Homs contre al-Mansur Qalawun — mourant en 681, lorsque son fils Tudan lui succéda."
  ur: "مینگو تیمور ابن تغان ابن بطو ⁦(ناجو)⁩ ابن جوچی، 665 ہجری میں برکے کے بعد شمالی دشت کا بادشاہ؛ طویل عرصے تک، اس نے 670 میں قسطنطنیہ کی طرف کوچ کیا جس کے بادشاہ نے اس سے اطاعت قبول کی، پھر شام میں 680 میں ابگا کے ساتھ محفل میں - حما کا محاصرہ کیا اور المنصور قلاون کے خلاف حمص میں تباہی کا سامنا کرنا پڑا - 681 میں مر گیا، جب اس کا بیٹا تودان کامیاب ہوا۔"
  tr: "Mankutamir ibn Tughan ibn Nazu Han ibn Dushi (Joji), 665 Hicri yılının kutsamasından sonra kuzeyde El-Dast kralı; ömrü uzundu. 670 Hicri'de Konstantinopolis'e yürüdü; burada kralı onu itaatkarlık ve arzuyla karşıladı, bu yüzden geri çekildi. Sonra, 680 Hicri'de, Abgha ibn Hulagu'nun gösterisiyle Levant'a yürüdü; burada Homs yakınlarındaki El-Mansur Kalavun'un komutasındaydı. 681 Hicri'de öldü ve yerine oğlu Tadān hüküm sürdü."
  id: "Mankutamir ibn Tughan ibn Nazu Khan ibn Dushi (Joji), raja Al-Dast di utara setelah berkah tahun 665 H; hari-harinya panjang. Pada tahun 670 H, ia berbaris ke Konstantinopel, di mana rajanya menerimanya dengan penyerahan dan keinginan, sehingga ia mundur. Kemudian, pada tahun 680 H, ia berbaris ke Levant dalam demonstrasi Abgha ibn Hulagu, di mana ia berada di bawah komando Al-Mansur Qalawun dekat Homs. Ia meninggal pada tahun 681 H, dan putranya Tadān memerintah menggantikannya."
