label:
  ar: منكوتمر بن طغان ملك الدست
  en: Mengu-Timur, king of the Dasht
summary:
  ar: "منكوتمر بن طغان بن ناظو خان بن دوشي (جوجي)، ملك الدست بالشمال بعد بركة سنة 665هـ؛ طالت أيامه، وزحف سنة 670هـ إلى القسطنطينية فتلقاه ملكها بالخضوع والرغبة فرجع عنها، ثم زحف سنة 680هـ إلى بلاد الشام في مظاهرة أبغا بن هلاكو فنازل حماة وكانت الدائرة عليه بظاهر حمص من المنصور قلاوون، وهلك سنة 681هـ فملك مكانه ابنه تدان."
  en: "Mengu-Timur ibn Taghan ibn Batu (Naju) ibn Jochi, king of the northern Dasht after Berke in 665 AH; long of days, he marched on Constantinople in 670 whose king met him in submission, then on Syria in 680 in concert with Abaga — besieged Hama and met disaster at Homs against al-Mansur Qalawun — dying in 681, when his son Tudan succeeded."
