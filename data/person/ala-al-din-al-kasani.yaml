summary:
  ar: "علاء الدين أبو بكر بن مسعود بن أحمد الكاساني، الملقّب «ملك العلماء»، فقيه حنفي نسبته إلى كاسان وراء الشاش، تفقّه على علاء الدين السمرقندي وصنّف «بدائع الصنائع» وزوّجه شيخه ابنته الفقيهة فاطمة، ثم جاء رسولاً من ملك الروم إلى نور الدين محمود بحلب، فولّاه التدريس بالمدرسة الحلاوية، وبها أقام حتى مات سنة 587هـ ودفن عند زوجته بظاهر حلب. {cite:badai-sanai-ilmiyya-v1 p.74} {cite:badai-sanai-ilmiyya-v1 p.75} {cite:badai-sanai-ilmiyya-v1 p.76}"
  en: "Ala' al-Din Abu Bakr ibn Mas'ud ibn Ahmad al-Kasani, called 'King of the Scholars', a Hanafi jurist from Kasan beyond al-Shash, studied with Ala' al-Din al-Samarqandi, wrote Bada'i' al-Sana'i' and married his teacher's learned daughter Fatima; he later came as an envoy of the ruler of Rum to Nur al-Din Mahmud at Aleppo, who appointed him to teach at the Halawiyya madrasa, where he stayed until his death in 587 AH; he was buried beside his wife outside Aleppo."
  fr: "Ala' al-Din Abu Bakr ibn Mas'ud ibn Ahmad al-Kasani, appelé \"Roi des savants\", un juriste hanafite de Kasan au-delà d'al-Shash, a étudié avec Ala' al-Din al-Samarqandi, a écrit Bada'i' al-Sana'i' et a épousé la fille savante de son professeur Fatima ; Il vint plus tard en tant qu'envoyé du souverain de Rum à Nour al-Din Mahmud à Alep, qui le nomma pour enseigner à la madrasa Halawiyya, où il resta jusqu'à sa mort en 587 après l'Hégire  ; il fut enterré à côté de sa femme en dehors d'Alep."
  ur: "علاء الدین ابو بکر بن مسعود بن احمد کاسانی، جن کا لقب «ملک العلماء» تھا، شاش کے پار کاسان کے حنفی فقیہ؛ انہوں نے علاء الدین سمرقندی سے فقہ پڑھی، «بدائع الصنائع» لکھی اور ان کے استاد نے اپنی فقیہ بیٹی فاطمہ سے ان کی شادی کی؛ پھر وہ روم کے بادشاہ کے سفیر بن کر حلب میں نور الدین محمود کے پاس آئے، جنہوں نے انہیں مدرسہ حلاویہ میں تدریس پر مقرر کیا، جہاں وہ 587ھ میں وفات تک رہے، اور حلب کے باہر اپنی بیوی کے پاس دفن ہوئے۔"
  es: "Ala' al-Din Abu Bakr ibn Mas'ud ibn Ahmad al-Kasani, llamado 'Rey de los Sabios', un jurista hanafí de Kasan, más allá de al-Shash, estudió con Ala' al-Din al-Samarqandi, escribió Bada'i' al-Sana'i' y se casó con la erudita hija de su maestro, Fátima; más tarde llegó como enviado del gobernante de Rum a Nur al-Din Mahmud en Alepo, quien lo designó para enseñar en la madrasa Halawiyya, donde permaneció hasta su muerte en el año 587 de la Hégira; fue enterrado junto a su esposa en las afueras de Alepo."
  tr: "Ala al-Din Ebu Bekir bin Mes'ud ibn Ahmed el-Kasani, 'Alimlerin Kralı' lakabıyla anılır, kökeni gazlı bezin arkasındaki Kasan'a kadar uzanan bir Hanefi hukukçusuydu. Ala al-Din el-Samarqandi'nin yanında hukuk eğitimi aldı ve 'Bada'i' al-Sana'i' adlı eserini yazdı. Şeyhi, kızı, hukukçu Fatima ile evlendi. Daha sonra Roma Kralı'ndan Halep'teki Nur al-Din Mahmoud'a elçi olarak geldi, ona El-Halawiye okulunda öğretmenlik emanet etti; burada 587 Hicri'de vefat edene kadar yaşadı ve eşiyle birlikte Halep'in dışında defnedildi. {cite:badai-sanai-ilmiyya-v1 s.74} {cite:badai-sanai-ilmiyya-v1 s.75} {cite:badai-sanai-sayniya-v1 s.76}"
  id: "Ala al-Din Abu Bakr ibn Mas'ud ibn Ahmad al-Kasani, yang dijuluki 'Raja Para Sarjana,' adalah seorang ahli hukum Hanafi yang garis keturunannya berasal dari Kasan di balik kain kasa. Ia mempelajari hukum di bawah Ala al-Din al-Samarqandi dan menulis 'Bada'i' al-Sana'i'. Sheikh-nya menikahi putrinya, ahli hukum Fatima. Kemudian ia datang sebagai utusan dari Raja Romawi kepada Nur al-Din Mahmoud di Aleppo, mempercayakan kepadanya untuk mengajar di sekolah Al-Halawiya, tempat ia tinggal hingga wafat pada tahun 587 H, dan dimakamkan bersama istrinya di pinggiran Aleppo. {cite:badai-sanai-ilmiyya-v1 p.74} {cite:badai-sanai-ilmiyya-v1 p.75} {cite:badai-sanai-ilmiyya-v1 p.76}"
