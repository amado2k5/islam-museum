summary:
  ar: "علاء الدين أبو بكر بن مسعود بن أحمد الكاساني، الملقّب «ملك العلماء»، فقيه حنفي نسبته إلى كاسان وراء الشاش، تفقّه على علاء الدين السمرقندي وصنّف «بدائع الصنائع» وزوّجه شيخه ابنته الفقيهة فاطمة، ثم جاء رسولاً من ملك الروم إلى نور الدين محمود بحلب، فولّاه التدريس بالمدرسة الحلاوية، وبها أقام حتى مات سنة 587هـ ودفن عند زوجته بظاهر حلب. {cite:badai-sanai-ilmiyya-v1 p.74} {cite:badai-sanai-ilmiyya-v1 p.75} {cite:badai-sanai-ilmiyya-v1 p.76}"
  en: "Ala' al-Din Abu Bakr ibn Mas'ud ibn Ahmad al-Kasani, called 'King of the Scholars', a Hanafi jurist from Kasan beyond al-Shash, studied with Ala' al-Din al-Samarqandi, wrote Bada'i' al-Sana'i' and married his teacher's learned daughter Fatima; he later came as an envoy of the ruler of Rum to Nur al-Din Mahmud at Aleppo, who appointed him to teach at the Halawiyya madrasa, where he stayed until his death in 587 AH; he was buried beside his wife outside Aleppo."
  ur: "علاء الدین ابو بکر بن مسعود بن احمد کاسانی، جن کا لقب «ملک العلماء» تھا، شاش کے پار کاسان کے حنفی فقیہ؛ انہوں نے علاء الدین سمرقندی سے فقہ پڑھی، «بدائع الصنائع» لکھی اور ان کے استاد نے اپنی فقیہ بیٹی فاطمہ سے ان کی شادی کی؛ پھر وہ روم کے بادشاہ کے سفیر بن کر حلب میں نور الدین محمود کے پاس آئے، جنہوں نے انہیں مدرسہ حلاویہ میں تدریس پر مقرر کیا، جہاں وہ 587ھ میں وفات تک رہے، اور حلب کے باہر اپنی بیوی کے پاس دفن ہوئے۔"
