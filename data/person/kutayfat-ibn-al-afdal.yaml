  ar: "وزير فاطمي، ولي الوزارة سنة 524 للهجرة بعد وفاة الآمر، ولقب بالأفضل، وأعلن إنهاء الخلافة الفاطمية ووضع الدولة تحت سيادة الإمام المنتظر الاثني عشري، ثم قُتل سنة 526 للهجرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
  en: "Fatimid vizier, son of al-Afdal, who took the vizierate in 524/1130 after the death of al-Amir and called himself al-Afdal. He declared the Fatimid dynasty deposed in favour of the Twelver Imam, but was killed in 526/1131 and the caliph 'Abd al-Majid al-Hafiz was restored {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
