summary:
  ar: "وزير فاطمي، ولي الوزارة سنة 524 للهجرة بعد وفاة الآمر، ولقب بالأفضل، وأعلن إنهاء الخلافة الفاطمية ووضع الدولة تحت سيادة الإمام المنتظر الاثني عشري، ثم قُتل سنة 526 للهجرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
  en: "Fatimid vizier, son of al-Afdal, who took the vizierate in 524/1130 after the death of al-Amir and called himself al-Afdal. He declared the Fatimid dynasty deposed in favour of the Twelver Imam, but was killed in 526/1131 and the caliph 'Abd al-Majid al-Hafiz was restored {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
  es: "Visir fatimí, hijo de al-Afdal, quien asumió el visirismo en 524/1130 tras la muerte de al-Amir y se autodenominó al-Afdal. Declaró depuesta a la dinastía fatimí en favor del imán duodecimano, pero fue asesinado en 526/1131 y el califa Abd al-Majid al-Hafiz fue restaurado {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
  fr: "Vizir fatimide, fils d'al-Afdal, qui accéda au vizirat en 524/1130 après la mort d'al-Amir et se fit appeler al-Afdal. Il déposa la dynastie fatimide en faveur du Calife duodécimain, mais fut tué en 526/1131 et le calife 'Abd al-Majid al-Hafiz fut restauré {cite:encyclopaedia-of-islam-2 vol. 1 p. 237}."
  ur: "فاطمی وزیر، الافدل کا بیٹا، جس نے الامیر کی وفات کے بعد 524/1130 میں وظیفہ لیا اور اپنے آپ کو الفضل کہا۔ اس نے بارہ امام کے حق میں فاطمی خاندان کو معزول قرار دیا، لیکن 526/1131 میں اسے قتل کر دیا گیا اور خلیفہ عبد الماجد الحافظ کو بحال کر دیا گیا۔ 1 ص۔ 237}۔"
  tr: "524 Hicri Mühriri'nde hükümdarın ölümünden sonra vezir olarak atanan Fatımi veziri, 'El-Afdal' unvanını aldı, Fatımi halifeliğinin sonunu ilan etti ve devleti İmam el-Muntazar el-Ondivar'ın yönetimine verdi, ardından 526 Hicri'de öldürüldü {cite:encyclopaedia-of-Islam-2 cilt 1, s. 237}."
  id: "Wazir Fatimiyah, yang diangkat sebagai wazir pada tahun 524 H setelah kematian penguasa, diberi gelar 'Al-Afdal', menyatakan berakhirnya kekhalifahan Fatimiyah, dan menempatkan negara di bawah pemerintahan Imam al-Muntazar al-Twelvar, lalu dibunuh pada tahun 526 H {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 237}."
