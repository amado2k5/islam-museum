  en: "A Tamimi Khariji who joined the Meccan pact with Ibn Muljim and Amr ibn Bakir to kill the three governors on the night of 17 Ramadan 40; he took Mu'awiya, striking him as he prostrated in prayer and wounding his buttock, but Mu'awiya survived {cite:tarikh-khulafa-minhaj-1434 p. 295}."
