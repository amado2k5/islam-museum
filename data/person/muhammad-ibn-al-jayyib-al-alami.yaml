summary:
  ar: "محمد بن الجيّب العلمي، شاعر ومثقف مغربي من شرفاء العلميين، وُلد وتعلم بفاس، وتوفي بالقاهرة في طريقه إلى الحج سنة 1134هـ أو 1135هـ/1721–1723م، وترك كتاب «الأنيس المطرب بمن لقيته من أدباء المغرب» {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  en: "Muhammad ibn al-Jayyib al-'Alami, a Moroccan poet and man of letters of the 'Alamiyyun sharifs, born and educated at Fez, died at Cairo on his way to the pilgrimage in 1134 or 1135 AH (1721–23 CE). His al-Anis al-mutrib bi-man laqituhu min udaba' al-Maghrib is an anthology with information on Moroccan literary life in the early 18th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
