summary:
  ar: "محمد بن الجيّب العلمي، شاعر ومثقف مغربي من شرفاء العلميين، وُلد وتعلم بفاس، وتوفي بالقاهرة في طريقه إلى الحج سنة 1134هـ أو 1135هـ/1721–1723م، وترك كتاب «الأنيس المطرب بمن لقيته من أدباء المغرب» {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  en: "Muhammad ibn al-Jayyib al-'Alami, a Moroccan poet and man of letters of the 'Alamiyyun sharifs, born and educated at Fez, died at Cairo on his way to the pilgrimage in 1134 or 1135 AH (1721–23 CE). His al-Anis al-mutrib bi-man laqituhu min udaba' al-Maghrib is an anthology with information on Moroccan literary life in the early 18th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  es: "Muhammad ibn al-Jayyib al-'Alami, poeta y hombre de letras marroquí perteneciente a la dinastía Alamiyyun, nacido y educado en Fez, falleció en El Cairo de camino a la peregrinación en 1134 o 1135 AH (1721-1723 d. C.). Su obra Al-Anis al-mutrib bi-man laqituhu min udaba' al-Maghrib es una antología que ofrece información sobre la vida literaria marroquí a principios del siglo XVIII {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  fr: "Muhammad ibn al-Jayyib al-'Alami, poète et homme de lettres marocain, membre du cercle des chérifs 'Alamiyyun, né et formé à Fès, mourut au Caire en 1134 ou 1135 AH (1721-1723). Son œuvre, al-Anis al-mutrib bi-man laqituhu min udaba' al-Maghrib, est une anthologie qui retrace la vie littéraire marocaine du début du XVIIIe siècle (voir Encyclopaedia of Islam, vol. 1, p. 374)."
  ur: "محمد بن الجائب العالمی، ایک مراکشی شاعر اور 'عالمی شریف' کے خطوط کا آدمی، فیز میں پیدا ہوا اور تعلیم یافتہ، 1134 یا 1135 ہجری ⁦(1721-23 عیسوی)⁩ میں حج کے لیے جاتے ہوئے قاہرہ میں انتقال کر گیا۔ ان کی المعروف انیس المطرب بِی من لقیطوہ من عداب المغرب 18ویں صدی کے اوائل میں مراکش کی ادبی زندگی کے بارے میں معلومات کے ساتھ ایک مجموعہ ہے۔ 1 ص۔ 374}۔"
  tr: "Muhammed ibn el-Cib el-Alemi, Faslı bir şair ve soylu alimler arasında entelektüeldi; Fes'te doğup eğitim aldı ve 1134 Hicri veya 1135 Hicri / 1721–1723 yıllarında Hac yolunda Kahire'de öldü. Geride 'Al-Anis al-Mutrib biman La'ta'tu min al-Maghrib Literature' adlı kitabı bıraktı {cite:encyclopaedia-of-Islam-2 cilt 1, s. 374}."
  id: "Muhammad ibn al-Jib al-Alami adalah seorang penyair dan intelektual Maroko di antara para ulama bangsawan, lahir dan dididik di Fez, dan meninggal di Kairo dalam perjalanan menuju Haji pada tahun 1134 H atau 1135 H / 1721–1723 M. Ia meninggalkan buku 'Al-Anis al-Mutrib biman La'ta'tu min al-Maghrib Literature' {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 374}."
