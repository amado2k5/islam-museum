summary:
  ar: "عبد القادر بن محيي الدين الحسني الجزائري (١٨٠٧–١٨٨٣م)؛ أمير ناهض من العلماء الشعراء البسلاء. ولد في القيطنة من قرى إيالة وهران وتعلم في وهران، وحج مع أبيه سنة ١٢٤١هـ فزار المدينة ودمشق وبغداد. ولما دخل الفرنسيس بلاد الجزائر بايعه الجزائريون وولّوه القيام بأمر الجهاد فقاتل الفرنسيين خمسة عشر عاماً، ضرب في أثنائها نقوداً سماها «الحمدية» وأنشأ معامل للأسلحة والأدوات الحربية وملابس الجند، وكان يتقدم جيشه في معاركه ببسالة عجيبة. وأصرّ عليه سلطان الغرب الأقصى عبد الرحمن بن هشام فضعف أمره، فاشترط شروطاً للاستسلام رضي بها الفرنسيون واستسلم سنة ١٢٦٣هـ (١٨٤٧م)، فنفوه إلى طولون ثم إلى أنبواز حيث أقام نحو أربع سنين وزارَه نابليون الثالث فسرّحه مشترطاً ألا يعود إلى الجزائر، فزار باريس والآستانة واستقر في دمشق سنة ١٢٧١هـ فتوفي فيها. من آثاره العلمية «ذكرى العاقل» رسالة في العلوم والأخلاق، و«ديوان شعر»، و«الصافنات الجياد» في محاسن الخيل وصفاتها، و«المواقف» في التصوف {cite:al-aalam tarjama}."
  en: "Abd al-Qadir al-Jaza'iri (1807–1883 CE) — the amir who led fifteen years of jihad against the French conquest of Algeria, minted the Hamdiyya coinage, then settled in Damascus as a scholar and Sufi author {cite:al-aalam tarjama}."
