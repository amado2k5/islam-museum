summary:
  ar: "الأمير عبد القادر بن محيي الدين الحسني الجزائري، ناهض من العلماء والشعراء البُسلاء؛ ولد بالقيطنة من قرى إيالة وهران وتعلّم في وهران وحج مع أبيه سنة 1241هـ فزار المدينة ودمشق وبغداد، ولما دخل الفرنسيون بلاد الجزائر سنة 1246هـ بايعه الجزائريون وولّوه القيام بأمر الجهاد فقاتل الفرنسيين خمسة عشر عاماً وضرب في أثنائها نقوداً سماها «الحمدية» وأنشأ معامل للأسلحة والأدوات الحربية وملابس الجند، ثم استسلم بشروط سنة 1263هـ فنفوه إلى طولون ثم أنبواز حيث زاره نابليون الثالث وسرّحه مشترطاً ألا يعود إلى الجزائر، فزار باريس والآستانة واستقر بدمشق سنة 1271هـ وتوفي فيها سنة 1883م، ومن آثاره «ذكرى العاقل» وديوان شعر و«المواقف» في التصوف {cite:al-aalam p. 140-141}."
  en: "Amir Abd al-Qadir al-Jaza'iri, the scholar-poet who led the Algerian jihad: elected by the Algerians when the French entered the country, he fought them fifteen years, minted the 'Hamdiyya' coinage and built arms works; exiled after his 1847 surrender to Toulon then Amboise, freed by Napoleon III, he settled in Damascus in 1855 and died there in 1883 {cite:al-aalam p. 140-141}."
  fr: "L'émir Abd al-Qadir al-Jaza'iri, savant et poète qui mena le jihad algérien : élu par les Algériens lorsque les Français entrèrent dans le pays, il les combattit quinze ans, frappa la monnaie « Hamdiyya » et créa des ateliers d'armes ; exilé après sa reddition de 1847 à Toulon puis à Amboise, libéré par Napoléon III, il s'établit à Damas en 1855 et y mourut en 1883 {cite:al-aalam p. 140-141}."
  es: "Amir Abd al-Qadir al-Jaza'iri, el erudito y poeta que lideró la yihad argelina: elegido por los argelinos cuando los franceses entraron en el país, luchó contra ellos durante quince años, acuñó la moneda 'Hamdiyya' y construyó fábricas de armas; exiliado tras su rendición en 1847 a Toulon y luego a Amboise, liberado por Napoleón III, se estableció en Damasco en 1855 y murió allí en 1883 {cite:al-aalam p. 140-141}."
  ur: "امیر عبدالقادر الجزائری، عالم و شاعر جس نے الجزائر کے جہاد کی قیادت کی: الجزائر کے ذریعہ منتخب کیا گیا جب فرانسیسی ملک میں داخل ہوئے، انہوں نے ان سے پندرہ سال جنگ کی، 'حمدیہ' کا سکہ تیار کیا اور اسلحہ سازی کی تعمیر کی۔ 1847 میں ٹولون کے سامنے ہتھیار ڈالنے کے بعد جلاوطنی اختیار کر لی، پھر نپولین III کے ذریعہ آزاد کرایا گیا، وہ 1855 میں دمشق میں آباد ہوا اور 1883 میں وہیں انتقال کر گیا۔ 140-141}۔"
  tr: "Yükselen bir alim ve cesur bir şair olan Prens Abdülkader bin Muhyiddin el-Hassani el-Cezayir, Oran vilayetinin köylerinden biri olan Kaytana'da doğdu. Oran'da eğitim gördü ve 1241 Hicri yılında babasıyla birlikte Hac ibadetini yerine getirerek Medine, Şam ve Bağdat'ı ziyaret etti. 1246 Hicri yılında Fransızlar Cezayir'e girdiğinde, Cezayirliler ona biat ettiler ve onu cihatın başına getirdiler. On beş yıl boyunca Fransızlarla savaştı; bu süre zarfında \"el-Hamdiyya\" adı verilen sikkeler bastırdı ve silah, askeri teçhizat ve asker giysileri fabrikaları kurdu. Daha sonra 1263 Hicri yılında şartlı olarak teslim oldu ve önce Toulon'a, ardından Amboise'ye sürgün edildi. Burada III. Napolyon onu ziyaret etti ve Cezayir'e geri dönmemesi şartıyla serbest bıraktı. 1271 Hicri yılında Paris ve İstanbul'u ziyaret etti ve Şam'a yerleşti; 1883 yılında burada vefat etti. Eserleri arasında şiir derlemesi olan \"Dhikra al-Aqil\" (Bilgelerin Anısı) ve tasavvuf üzerine \"al-Mawaqif\" (Süreçler) bulunmaktadır. 140-141}."
  id: "Pangeran Abdelkader bin Muhyiddin al-Hassani al-Jazairi, seorang cendekiawan yang sedang naik daun dan penyair pemberani, lahir di Qaytana, salah satu desa di provinsi Oran. Ia belajar di Oran dan menunaikan ibadah haji bersama ayahnya pada tahun 1241 H, mengunjungi Madinah, Damaskus, dan Baghdad. Ketika Prancis memasuki Aljazair pada tahun 1246 H, rakyat Aljazair berjanji setia kepadanya dan menunjuknya untuk memimpin jihad. Ia berperang melawan Prancis selama lima belas tahun, di mana ia mencetak koin yang disebut \"al-Hamdiyya\" dan mendirikan pabrik untuk senjata, peralatan militer, dan pakaian tentara. Kemudian ia menyerah dengan syarat pada tahun 1263 H, dan diasingkan ke Toulon dan kemudian ke Amboise, di mana Napoleon III mengunjunginya dan membebaskannya dengan syarat ia tidak kembali ke Aljazair. Ia mengunjungi Paris dan Istanbul dan menetap di Damaskus pada tahun 1271 H, di mana ia meninggal pada tahun 1883 M. Di antara karya-karyanya adalah \"Dhikra al-Aqil\" (Mengenang Orang Bijak), kumpulan puisi, dan \"al-Mawaqif\" (Jalan-jalan) tentang Sufisme. 140-141}."
