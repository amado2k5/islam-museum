summary:
  ar: "الأمير عبد القادر بن محيي الدين الحسني الجزائري، ناهض من العلماء والشعراء البُسلاء؛ ولد بالقيطنة من قرى إيالة وهران وتعلّم في وهران وحج مع أبيه سنة 1241هـ فزار المدينة ودمشق وبغداد، ولما دخل الفرنسيون بلاد الجزائر سنة 1246هـ بايعه الجزائريون وولّوه القيام بأمر الجهاد فقاتل الفرنسيين خمسة عشر عاماً وضرب في أثنائها نقوداً سماها «الحمدية» وأنشأ معامل للأسلحة والأدوات الحربية وملابس الجند، ثم استسلم بشروط سنة 1263هـ فنفوه إلى طولون ثم أنبواز حيث زاره نابليون الثالث وسرّحه مشترطاً ألا يعود إلى الجزائر، فزار باريس والآستانة واستقر بدمشق سنة 1271هـ وتوفي فيها سنة 1883م، ومن آثاره «ذكرى العاقل» وديوان شعر و«المواقف» في التصوف {cite:al-aalam p. 140-141}."
  en: "Amir Abd al-Qadir al-Jaza'iri, the scholar-poet who led the Algerian jihad: elected by the Algerians when the French entered the country, he fought them fifteen years, minted the 'Hamdiyya' coinage and built arms works; exiled after his 1847 surrender to Toulon then Amboise, freed by Napoleon III, he settled in Damascus in 1855 and died there in 1883 {cite:al-aalam p. 140-141}."
