summary:
  ar: "مؤرخ تركي للإمبراطورية العثمانية، لُقّب «شيخ المؤرخين». وُلد في إسطنبول سنة 1916 لأسرة من تتار القرم، ودرّس في جامعة أنقرة (1940–1972) وجامعة شيكاغو (1972–1986) وجامعة بيلكنت، حيث أسس قسم التاريخ. غيّرت دراساته الاجتماعية والاقتصادية لعصر الإمبراطورية الكلاسيكي ملامح الحقل، وتوفي في أنقرة سنة 2016 ودُفن في حظيرة جامع الفاتح بإسطنبول."
  en: "Turkish historian of the Ottoman Empire, styled Seyhü'l-Müverrihin, dean of historians. Born in Istanbul in 1916 to a Crimean Tatar family, he taught at Ankara University (1940-1972), the University of Chicago (1972-1986) and Bilkent University, where he founded the history department. His social and economic studies of the classical-age Empire reshaped the field; he died at Ankara in 2016 and was buried in the Fatih Mosque cemetery in Istanbul."
  ur: "ترک مؤرخِ سلطنتِ عثمانیہ، جنہیں «شیخ المؤرخین» کہا جاتا ہے۔ 1916ء میں استنبول میں کریمیا کے تاتاری خاندان میں پیدا ہوئے؛ انقرہ یونیورسٹی ⁦(1940ء–1972ء)⁩، شکاگو یونیورسٹی ⁦(1972ء–1986ء)⁩ اور بلکینٹ یونیورسٹی میں پڑھایا، جہاں شعبۂ تاریخ قائم کیا۔ کلاسیکی دور کی سلطنت پر ان کی سماجی و معاشی تحقیقات نے اس شعبے کو نئی شکل دی؛ 2016ء میں انقرہ میں وفات پائی اور استنبول کی فاتح مسجد کے احاطے میں دفن ہوئے۔"
  es: "Historiador turco del Imperio Otomano, conocido como Seyhü'l-Müverrihin, considerado el decano de los historiadores. Nacido en Estambul en 1916 en el seno de una familia tártara de Crimea, impartió clases en la Universidad de Ankara (1940-1972), la Universidad de Chicago (1972-1986) y la Universidad de Bilkent, donde fundó el departamento de historia. Sus estudios socioeconómicos del Imperio clásico transformaron el campo de la historia; falleció en Ankara en 2016 y fue enterrado en el cementerio de la Mezquita Fatih en Estambul."
  fr: "Historien turc de l'Empire ottoman, Seyhü'l-Müverrihin, surnommé le doyen des historiens, naquit à Istanbul en 1916 dans une famille tatare de Crimée. Il enseigna à l'université d'Ankara (1940-1972), à l'université de Chicago (1972-1986) et à l'université Bilkent, où il fonda le département d'histoire. Ses études socio-économiques sur l'Empire ottoman de l'Antiquité ont profondément marqué la discipline. Il s'est éteint à Ankara en 2016 et repose au cimetière de la mosquée Fatih à Istanbul."
  tr: "Osmanlı İmparatorluğu'nun Türk tarihçisi, \"Tarihçilerin Şeyhi\" unvanını taşıyor. 1916'da İstanbul'da Kırım Tatar bir ailede doğdu ve Ankara Üniversitesi'nde (1940–1972), Chicago Üniversitesi'nde (1972–1986) ve Bilkent Üniversitesi'nde eğitim gördü; burada tarih bölümünü kurdu. Klasik imparatorluk dönemine dair sosyal ve ekonomik çalışmaları alanın manzarasını değiştirdi; 2016'da Ankara'da hayatını kaybetti ve İstanbul'daki Fatih Camii çevresine defnedildi."
  id: "Seorang sejarawan Turki Kekaisaran Ottoman, bergelar \"Sheikh of Historians.\" Ia lahir di Istanbul pada tahun 1916 dari keluarga Tatar Krimea, dan belajar di Universitas Ankara (1940–1972), Universitas Chicago (1972–1986), dan Universitas Bilkent, di mana ia mendirikan departemen sejarah. Studi sosial dan ekonominya tentang era kekaisaran klasik mengubah lanskap bidang tersebut, dan ia meninggal di Ankara pada tahun 2016 serta dimakamkan di kawasan Masjid Fatih di Istanbul."
