summary:
  ar: "مؤرخ تركي للإمبراطورية العثمانية، لُقّب «شيخ المؤرخين». وُلد في إسطنبول سنة 1916 لأسرة من تتار القرم، ودرّس في جامعة أنقرة (1940–1972) وجامعة شيكاغو (1972–1986) وجامعة بيلكنت، حيث أسس قسم التاريخ. غيّرت دراساته الاجتماعية والاقتصادية لعصر الإمبراطورية الكلاسيكي ملامح الحقل، وتوفي في أنقرة سنة 2016 ودُفن في حظيرة جامع الفاتح بإسطنبول."
  en: "Turkish historian of the Ottoman Empire, styled Seyhü'l-Müverrihin, dean of historians. Born in Istanbul in 1916 to a Crimean Tatar family, he taught at Ankara University (1940-1972), the University of Chicago (1972-1986) and Bilkent University, where he founded the history department. His social and economic studies of the classical-age Empire reshaped the field; he died at Ankara in 2016 and was buried in the Fatih Mosque cemetery in Istanbul."
  ur: "ترک مؤرخِ سلطنتِ عثمانیہ، جنہیں «شیخ المؤرخین» کہا جاتا ہے۔ 1916ء میں استنبول میں کریمیا کے تاتاری خاندان میں پیدا ہوئے؛ انقرہ یونیورسٹی (1940ء–1972ء)، شکاگو یونیورسٹی (1972ء–1986ء) اور بلکینٹ یونیورسٹی میں پڑھایا، جہاں شعبۂ تاریخ قائم کیا۔ کلاسیکی دور کی سلطنت پر ان کی سماجی و معاشی تحقیقات نے اس شعبے کو نئی شکل دی؛ 2016ء میں انقرہ میں وفات پائی اور استنبول کی فاتح مسجد کے احاطے میں دفن ہوئے۔"
