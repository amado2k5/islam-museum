summary:
  ar: "سلطان جوهر منذ سنة 2010 وملك ماليزيا (يانغ دي-برتوان أغونغ) منذ يناير 2024. وُلد في جوهر بهرو سنة 1958 أكبر أبناء السلطان إسكندر، وكان وليا للعهد ثلاثة عقود ووصيا على العرش أثناء تولي أبيه الملكية، وانتخبه مجلس الحكام في أكتوبر 2023 سابع عشر ملوك ماليزيا، وهو معروف بدفاعه عن الاعتدال الديني وبإعادته عطلة جوهر الأسبوعية إلى الجمعة والسبت."
  en: "Sultan of Johor since 2010 and King of Malaysia (Yang di-Pertuan Agong) since January 2024. Born at Johor Bahru in 1958, the eldest son of Sultan Iskandar, he was crown prince for three decades and regent of Johor while his father was king; elected by the Conference of Rulers in October 2023 as the seventeenth Agong, he is noted for his advocacy of religious moderation and for restoring Johor's Friday–Saturday weekend."
  ur: "2010ء سے سلطانِ جوہر اور جنوری 2024ء سے ملائیشیا کے بادشاہ (یانگ دی پرتوان آگونگ)۔ 1958ء میں جوہر بہرو میں سلطان اسکندر کے بڑے بیٹے پیدا ہوئے، تین دہائیوں تک ولی عہد اور اپنے والد کی بادشاہت کے دوران جوہر کے نائب السلطنت رہے؛ مجلسِ حکام نے اکتوبر 2023ء میں انھیں سترھواں آگونگ منتخب کیا، اور وہ مذہبی اعتدال کی وکالت اور جوہر کی جمعہ–ہفتہ تعطیل بحال کرنے کے لیے معروف ہیں۔"
