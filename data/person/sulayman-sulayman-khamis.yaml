summary:
  en: "Egyptian Azhari scholar (1913–1971) and professor in the faculty of Usul al-Din; author of the book From Greek Philosophy to Modern Philosophy, and of works on creed and on the history of Islamic thought."
  ar: "عالم أزهري مصري ⁦(1913–1971م)⁩، وأستاذ بكلية أصول الدين؛ ألّف كتاب «من الفلسفة اليونانية إلى الفلسفة الحديثة»، وكتبًا في العقيدة وتاريخ الفكر الإسلامي."
  es: "Erudito egipcio de la escuela de Al-Azhar (1913-1971) y profesor en la facultad de Usul al-Din; autor del libro De la filosofía griega a la filosofía moderna, y de obras sobre el credo y la historia del pensamiento islámico."
  fr: "Érudit égyptien azhari (1913-1971) et professeur à la faculté d'Usul al-Din; auteur du livre De la philosophie grecque à la philosophie moderne, et d'ouvrages sur la croyance et sur l'histoire de la pensée islamique."
  ur: "مصری ازہری عالم (1913-1971) اور اصول الدین کی فیکلٹی میں پروفیسر؛ یونانی فلسفہ سے جدید فلسفہ تک کتاب کے مصنف اور عقیدہ اور اسلامی فکر کی تاریخ پر کام کے مصنف۔"
  tr: "Mısırlı Azhar bilgini (1913–1971) ve Din Temelleri Fakültesi'nde profesörlük yapmıştır; \"Yunan Felsefesinden Modern Felsefeye\" adlı kitabın yanı sıra İnanç ve İslam düşüncesi tarihi üzerine iki kitabın yazarıdır."
  id: "Seorang cendekiawan Azhar Mesir (1913–1971), dan profesor di Fakultas Dasar-dasar Agama; ia menulis buku \"Dari Filsafat Yunani ke Filsafat Modern,\" serta dua buku tentang kredo dan sejarah pemikiran Islam."
