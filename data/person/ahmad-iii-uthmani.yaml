summary:
  ar: "السلطان العثماني الثالث والعشرون، ابن محمد الرابع، ولد سنة 1084هـ/1673م، وتولى الحكم بعد خلع أخيه مصطفى الثاني في 10 ربيع الآخر 1115هـ/21 أغسطس 1703م. أعاد استقرار البلاط في إسطنبول، وأبرم صلح بوساروفيتش سنة 1718م، وعهده الثاني هو «عصر اللالة» الذي تحول فيه الذوق الأدبي والموسيقي والعمراني نحو الاقتباس من أوروبا {cite:encyclopaedia-of-islam-2 vol. 1 p. 290}."
  en: "The twenty-third Ottoman sultan, son of Mehmed IV, born in 1084/1673. He succeeded his brother Mustafa II on 10 Rabi' II 1115/21 August 1703, after Mustafa abdicated during a Janissary rising. He re-established Istanbul as the court's seat, and made the peace of Passarowitz in 1718; the second phase of his reign, the lâle devri, changed the taste in poetry, music and architecture {cite:encyclopaedia-of-islam-2 vol. 1 p. 290}."
