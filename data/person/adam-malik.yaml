summary:
  ar: "سياسي ودبلوماسي وصحافي إندونيسي، وُلد في بيماتانغسيانتار بشمال سومطرة سنة 1917. شارك في تأسيس وكالة أنتارا للأنباء، فكان وزير خارجية إندونيسيا (1966–1977)، ورئيس الجمعية العامة للأمم المتحدة (1971–1972)، ومن مؤسسي رابطة آسيان، وثالث نائب رئيس لإندونيسيا (1978–1983)، وتوفي في باندونغ سنة 1984."
  en: "Indonesian politician, diplomat and journalist, born at Pematangsiantar, North Sumatra, in 1917. A co-founder of the Antara news agency, he served as Indonesia's foreign minister (1966–1977), presided over the United Nations General Assembly (1971–1972), helped found ASEAN, and was Indonesia's third vice president (1978–1983); he died at Bandung in 1984."
  ur: "انڈونیشی سیاست دان، سفارت کار اور صحافی، جو 1917ء میں شمالی سماٹرا کے پیماتانگسیانتار میں پیدا ہوئے۔ انتارا خبر رساں ایجنسی کے شریک بانی؛ انڈونیشیا کے وزیرِ خارجہ (1966ء–1977ء) رہے، اقوامِ متحدہ کی جنرل اسمبلی کی صدارت کی (1971ء–1972ء)، آسیان کے قیام میں حصہ لیا، اور انڈونیشیا کے تیسرے نائب صدر (1978ء–1983ء) بنے؛ 1984ء میں بانڈونگ میں وفات پائی۔"
