summary:
  ar: رجل من بني بحر قتل بعشيرته جند سلطان من آل يعفر في وسحة، ثم سار بين يدي الهادي.
  en: A man of Banu Bahr who with his clan destroyed the force of an Al Ya'fur sultan at Wasaha and later went before al-Hadi.
  fr: "Homme des Banu Bahr qui détruisit avec son clan la force d’un sultan des Al Ya’fur à Wasaha, puis se présenta devant al-Hadi."
  ur: بنو بحر کا ایک شخص جس نے اپنے قبیلے کے ساتھ وسحہ میں آل یعفر کے ایک سلطان کا لشکر تباہ کیا اور بعد میں ہادی کے آگے چلا۔
  es: "Un hombre de Banu Bahr que, junto con su clan, destruyó las fuerzas de un sultán Al Ya'fur en Wasaha y posteriormente compareció ante al-Hadi."
  tr: "Beni Bahr kabilesinden bir adam, Wasah'ta Ya'fur ailesinden bir Sultan askerini öldürdükten sonra Al-Hadi'nin huzuruna çıktı."
  id: "Seorang pria dari Bani Bahr membunuh tentara Sultan dari keluarga Ya'fur di Wasah, kemudian dia berbaris menghadap Al-Hadi."
