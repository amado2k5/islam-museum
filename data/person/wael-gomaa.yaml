summary:
  ar: "لاعب كرة قدم مصري معتزل، وُلد في محافظة الغربية سنة 1975 ويُلقب بـ«الصخرة». مدافع أوسط بدأ مع غزل المحلة حتى 2001، ثم قضى ثلاثة عشر عامًا مع النادي الأهلي فاز فيها بدوري أبطال أفريقيا ست مرات، وخاض مع منتخب مصر 114 مباراة دولية وفاز معه بكأس الأمم الأفريقية 2006 و2008 و2010. يُعد من أفضل المدافعين الأفارقة عبر التاريخ."
  en: "Egyptian retired professional footballer, born in Gharbia Governorate in 1975 and nicknamed 'The Rock'. A centre-back who played for Ghazl El Mahalla until 2001, then spent thirteen years at Al Ahly, winning the CAF Champions League six times; he earned 114 caps for Egypt and won the Africa Cup of Nations in 2006, 2008 and 2010. He is regarded as one of the best African defenders of all time."
  ur: "مصری ریٹائرڈ پیشہ ور فٹبالر، 1975 میں محافظہ غربیہ میں پیدا ہوئے اور «الصخرہ» (چٹان) کے لقب سے مشہور ہیں۔ سینٹر بیک جنہوں نے 2001 تک غزل المحلہ کے لیے کھیلا، پھر تیرہ سال ال اہلی میں گزارے اور چھ بار کاف چیمپئنز لیگ جیتی؛ مصر کے لیے 114 بین الاقوامی میچ کھیلے اور 2006، 2008 اور 2010 کے افریقہ کپ آف نیشنز جیتے۔ انہیں افریقہ کے بہترین مدافعین میں شمار کیا جاتا ہے۔"
