id: person/abu-salim-ibrahim-marinid
class: person
label:
  ar: المولى أبو سالم إبراهيم المريني
  en: Al-Mawla Abu Salim Ibrahim al-Marini
summary:
  ar: "إبراهيم بن علي المريني الملقب بالمولى أبي سالم؛ لما هلك السلطان أبو عنان أمل ملك أخيه فطلب الإجازة من رضوان صاحب غرناطة فأبى عليه، فنزع إلى ملك قشتالة فأجازه في أسطوله إلى المغرب، فلما امتنع مراكش عن قبوله حاذى بطنجة فألقى بنفسه إلى بلاد غمارة فاشتملت عليه قبائلهم وبايعوه على الموت، وملك سبتة وطنجة، ثم دخل البلد الجديد منتصف شعبان سنة 760هـ وقتل منصور بن سليمان واستوزر مسعود بن ماساي."
  en: "Ibrahim ibn Ali al-Marini, called al-Mawla Abu Salim; after Sultan Abu Inan's death he hoped for his brother's realm, but Ridwan of Granada refused him passage, so he threw himself on Castile's king who ferried him in his fleet — Marrakesh shut him out, so he turned to the Ghumara hills whose tribes embraced him and swore him unto death, taking Ceuta and Tangier, then entered the New City in mid-Sha'ban 760 AH, killed Mansur ibn Sulayman, and made Mas'ud ibn Masay his vizier."
