id: person/abu-salim-ibrahim-marinid
class: person
label:
  ar: المولى أبو سالم إبراهيم المريني
  en: Al-Mawla Abu Salim Ibrahim al-Marini
  fr: "Al-Mawla Abu Salim Ibrahim al-Marini"
  es: "Al-Mawla Abu Salim Ibrahim al-Marini"
  ur: "المولا ابو سالم ابراہیم المرینی۔"
summary:
  ar: "إبراهيم بن علي المريني الملقب بالمولى أبي سالم؛ لما هلك السلطان أبو عنان أمل ملك أخيه فطلب الإجازة من رضوان صاحب غرناطة فأبى عليه، فنزع إلى ملك قشتالة فأجازه في أسطوله إلى المغرب، فلما امتنع مراكش عن قبوله حاذى بطنجة فألقى بنفسه إلى بلاد غمارة فاشتملت عليه قبائلهم وبايعوه على الموت، وملك سبتة وطنجة، ثم دخل البلد الجديد منتصف شعبان سنة 760هـ وقتل منصور بن سليمان واستوزر مسعود بن ماساي."
  en: "Ibrahim ibn Ali al-Marini, called al-Mawla Abu Salim; after Sultan Abu Inan's death he hoped for his brother's realm, but Ridwan of Granada refused him passage, so he threw himself on Castile's king who ferried him in his fleet — Marrakesh shut him out, so he turned to the Ghumara hills whose tribes embraced him and swore him unto death, taking Ceuta and Tangier, then entered the New City in mid-Sha'ban 760 AH, killed Mansur ibn Sulayman, and made Mas'ud ibn Masay his vizier."
  fr: "Ibrahim ibn Ali al-Marini, appelé al-Mawla Abu Salim ; après la mort du sultan Abu Inan, il aspira au royaume de son frère. Ridwan de Grenade lui refusa le passage ; il s'en remit donc au roi de Castille, qui le transporta dans sa flotte. Marrakech lui ferma ses portes : il se tourna vers les collines des Ghumara, dont les tribus l'accueillirent et lui jurèrent fidélité jusqu'à la mort. Il prit Ceuta et Tanger, puis entra dans la Ville Neuve au milieu de chaabane 760 H, tua Mansur ibn Sulayman et fit de Mas'ud ibn Masay son vizir."
  es: "Ibrahim ibn Ali al-Marini, llamado al-Mawla Abu Salim; tras la muerte del sultán Abu Inan, anhelaba el reino de su hermano, pero Ridwan de Granada le negó el paso, por lo que se entregó al rey de Castilla, quien lo transportó en su flota. Marrakech le cerró las puertas, así que se dirigió a las colinas de Ghumara, cuyas tribus lo acogieron y lo juraron lealtad hasta la muerte, tomando Ceuta y Tánger, y luego entró en la Ciudad Nueva a mediados de Sha'ban del año 760 AH, mató a Mansur ibn Sulayman y nombró a Mas'ud ibn Masay su visir."
  ur: "ابراہیم بن علی المرینی المعروف ابو سلیم؛ سلطان ابو عنان کی موت کے بعد اسے اپنے بھائی کی سلطنت کی امید تھی، لیکن غرناطہ کے رضوان نے اسے جانے سے انکار کر دیا، اس لیے اس نے خود کو کاسٹیل کے بادشاہ پر پھینک دیا جس نے اسے اپنے بیڑے میں لے جایا تھا - مراکیش نے اسے بند کر دیا، چنانچہ وہ گھمارا کی پہاڑیوں کی طرف متوجہ ہوا جس کے قبائل نے اسے گلے لگا لیا اور شہر میں داخل ہونے کی قسمیں کھائیں، وسط شعبان 760 ہجری میں منصور بن سلیمان کو قتل کیا اور مسعود بن مساعی کو اپنا وزیر بنایا۔"
  tr: "Sultan Ebu Anan öldüğünde, lakabı Mevla Ebu Salim olan İbrahim bin Ali el-Marini, kardeşinin krallığını umarak Granada hükümdarı Rızvan'dan izin istedi, ancak Rızvan onu reddetti. Bunun üzerine Kastilya kralına yöneldi ve kral ona Fas'a gitmek için filosunu kullanma izni verdi. Marakeş onu kabul etmeyince, Tanca'ya yöneldi ve Ghomara topraklarına girdi; böylece kabileleri onu kucakladı ve ölene kadar ona bağlılık yemini etti. Ceuta ve Tanca'yı yönetti, ardından Hicri 760 yılının Şaban ayının ortasında yeni şehre girdi, Mansur bin Süleyman'ı öldürdü ve Mesud bin Masai'yi veziri olarak atadı."
  id: "Ibrahim bin Ali al-Marini, yang dijuluki Mawla Abu Salim, ketika Sultan Abu Anan meninggal, berharap mendapatkan kerajaan saudaranya, sehingga ia meminta izin kepada Ridwan, penguasa Granada, tetapi ia menolaknya. Maka ia beralih kepada raja Kastilia, yang memberinya izin untuk menggunakan armadanya ke Maroko. Ketika Marrakesh menolak menerimanya, ia menuju Tangier dan memasuki wilayah Ghomara, sehingga suku-suku di sana menerimanya dan berjanji setia kepadanya sampai mati. Ia memerintah Ceuta dan Tangier, kemudian memasuki kota baru di pertengahan bulan Sya'ban tahun 760 H, dan membunuh Mansur bin Sulayman serta mengangkat Masoud bin Masai sebagai menterinya."
