gender: male
roles: [scholar, historian]
summary:
  ar: "عمر رضا كحالة، مؤلف دمشقي صاحب «أعلام النساء في عالمي العرب والإسلام»، معجم تراجم لشهيرات النساء رتّبه على الحروف وذيّل تراجمه بمصادرها، وأرّخ مقدمته بدمشق سنة 1379هـ."
  en: "Umar Rida Kahhala, a Damascene author, compiler of A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam, an alphabetical dictionary of notable women with the sources of each entry; he dated its preface in Damascus in 1379 AH."
  es: "Umar Rida Kahhala, autor damasceno, fue el compilador de A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam, un diccionario alfabético de mujeres notables con las fuentes de cada entrada; fechó su prefacio en Damasco en 1379 AH."
  fr: "Umar Rida Kahhala, un auteur damascène, compilateur de A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam, un dictionnaire alphabétique de femmes notables avec les sources de chaque entrée; il a daté sa préface à Damas en 1379 AH."
  ur: "عمر ردا کہالہ، ایک دمشقی مصنف، اعلام النساء فی العلمی العرب و الاسلام کے مرتب، ہر اندراج کے ماخذ کے ساتھ قابل ذکر خواتین کی حروف تہجی کی لغت؛ اس نے 1379ھ میں دمشق میں اس کا دیباچہ لکھا۔"
  tr: "Omar Reda Kahhala, Şamlı bir yazar ve ünlü kadınların biyografilerinin alfabetik sırayla düzenlenmiş ve kaynaklarıyla birlikte eklenen 'A'lam al-Nisa' fi 'Alami al-Arab wa al-al-Islam' adlı sözlüğün yazarıdır. Kitabının 1379 Hicri yılında Şam'da tanıtımını tarihlendirmiştir."
  id: "Omar Reda Kahhala adalah seorang penulis Damaskus dan penulis 'A'lam al-Nisa' fi 'Alami al-Arab wa al-Islam', sebuah kamus biografi wanita terkenal, yang disusun secara alfabetis dan melampirkan biografinya beserta sumbernya. Ia menandai pengenalan buku ini di Damaskus pada tahun 1379 H."
