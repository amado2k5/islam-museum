summary:
  ar: "أبو عبد الله مكحول بن عبد الله الشامي نسباً الكابلي؛ قال ابن عائشة كان مولى لامرأة من قيس، وقال الواقدي مولى لامرأة من هذيل، وقيل مولى لبني ليث؛ وقال الخطيب كان جده ساسانياً من أهل هراة تزوج ابنة ملك من ملوك كابل فهلك عنها وهي حامل فولدت مكحولاً فلم يزل في أخواله بكابل ثم قدم؛ وقيل: والحسن البصري بالبصرة ومكحول بالشام، ولم يكن في زمنه أبصر منه بالفتيا {cite:wafayat-ayan}."
  en: "Abu Abdallah Makhul al-Shami — the Kabul-born mawla who became Syria's leading jurist: 'al-Hasan [al-Basri] at Basra and Makhul in Syria; none in his age saw further into fatwa' {cite:wafayat-ayan}."
  es: "Abu Abdallah Makhul al-Shami — el mawla nacido en Kabul que se convirtió en el jurista más importante de Siria: 'al-Hasan [al-Basri] en Basora y Makhul en Siria; nadie en su época vio más allá de la fatwa' {cite:wafayat-ayan}."
  fr: "Abou Abdallah Makhul al-Shami — le mawla né à Kaboul qui est devenu le principal juriste de Syrie: « al-Hasan [al-Basri] à Bassora et Makhul en Syrie; aucun de ses contemporains n'a vu plus loin dans la fatwa » {cite:wafayat-ayan}."
  ur: "ابو عبد اللہ مخول الشامی - کابل میں پیدا ہونے والا مولا جو شام کا معروف فقیہ بن گیا: 'الحسن [البصری] بصرہ اور مخول شام میں؛ ان کی عمر میں کسی نے فتویٰ میں مزید نہیں دیکھا۔"
  tr: "Ebu Abdullah Makhoul ibn Abdullah al-Shami Kabuli soyundan gelmektedir; İbn Aişa onun Kays'tan bir kadının özgür adamı olduğunu, el-Vaqidi ise Hudhayl'den bir kadının özgür adamı olduğunu ve Banu Layth'in özgür bırakılmış adamı olduğunu söylemiştir. El-Hatib, büyükbabasının Heratlı bir Sasani olduğunu, Kabil'den bir kralın kızıyla evlendiğini ancak hamileyken öldüğünü söylemiştir. Makhool onu doğurmuş, bu yüzden Kabil'de annesinin kardeşlerinin yanında kalmış ve sonra ona gelmiştir; ayrıca şöyle denir: El-Hasan el-Basri Basra'daydı, Makhul Levant'taydı ve onun zamanında fetva vermede ondan daha anlayışlı kimse yoktu {atıf:wafayat-ayan}."
  id: "Abu Abdullah Makhoul ibn Abdullah al-Shami berasal dari garis keturunan Kabuli; Ibn Aisha mengatakan bahwa ia adalah mantan dari seorang wanita dari Qays, dan al-Waqidi mengatakan ia adalah mantan dari seorang wanita dari Hudhayl, dan dikatakan ia adalah mantan dari Banu Layth. Al-Khatib mengatakan kakeknya adalah seorang Sasanian dari Herat, yang menikahi putri seorang raja dari Kabul, tetapi meninggal saat ia sedang hamil. Makhool melahirkannya, sehingga ia tinggal bersama paman-paman dari pihak ibu di Kabul dan kemudian datang kepadanya; juga dikatakan: Al-Hasan al-Basri berada di Basra dan Makhul berada di Levant, dan pada masanya tidak ada yang lebih bijak dalam mengeluarkan fatwa selain dirinya {cite:wafayat-ayan}."
