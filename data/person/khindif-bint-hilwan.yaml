summary:
  ar: "ليلى بنت حلوان بن عمران بن الحاف بن قضاعة أم ولد إلياس بن مضر، وفي لقبها خندف وسمي ولدها: خرج عامر فتصيدها وطبخها فسمي طابخة، وانقمع عمير في الحباء فسمي قمعة، وخرجت أمهم تسرع فقال لها إلياس أين تخندفين فقالت ما زلت أختدف في أثركم فقيل لها خندف، ونسب ولد الياس إلى أمهم خندف على حسب قول قصي أمي خندف والياس أبي {cite:muruj-al-dhahab p. 567}."
  en: "Ilyas's wife whose hurrying after her family — 'Where are you scurrying, khundaf?' — earned her the byname by which Quraysh's sons of Ilyas were reckoned {cite:muruj-al-dhahab p. 567}."
