label: { ar: "خندف بنت حلوان", en: "Khindif bint Hilwan", es: "Khindif bint Hilwan", fr: "Khindif bint Hilwan", ur: "خندف بنت ہلوان" }
summary:
  ar: "ليلى بنت حلوان بن عمران بن الحاف بن قضاعة أم ولد إلياس بن مضر، وفي لقبها خندف وسمي ولدها: خرج عامر فتصيدها وطبخها فسمي طابخة، وانقمع عمير في الحباء فسمي قمعة، وخرجت أمهم تسرع فقال لها إلياس أين تخندفين فقالت ما زلت أختدف في أثركم فقيل لها خندف، ونسب ولد الياس إلى أمهم خندف على حسب قول قصي أمي خندف والياس أبي {cite:muruj-al-dhahab p. 567}."
  en: "Ilyas's wife whose hurrying after her family — 'Where are you scurrying, khundaf?' — earned her the byname by which Quraysh's sons of Ilyas were reckoned {cite:muruj-al-dhahab p. 567}."
  es: "La esposa de Ilyas, cuya prisa por seguir a su familia —«¿Dónde andáis corriendo, khundaf?»— le valió el sobrenombre con el que se contaba a los hijos de Ilyas de los Quraysh {cite:muruj-al-dhahab p. 567}."
  fr: "L'épouse d'Ilyas, dont la hâte à suivre sa famille — « Où courez-vous, khundaf ? » — lui a valu le surnom par lequel les fils d'Ilyas de Quraysh étaient comptés {cite:muruj-al-dhahab p. 567}."
  ur: "الیاس کی بیوی جو اپنے گھر والوں کے پیچھے بھاگ رہی ہے - 'کہاں بھڑک رہی ہو، خندف؟' - نے اسے وہ نام دیا جس سے قریش کے الیاس کے بیٹے شمار کیے جاتے تھے۔ 567}۔"
  tr: "Leyla bint Halwan ibn İmran ibn el-Haf ibn Quda'ah, İlyas ibn Mudar'ın oğlunun annesiydi. Unvanı Khandaf'tı ve oğluna şöyle adı verildi: 'Amir onu avlamaya ve yemek pişirmeye çıktı, bu yüzden ona Tabaha denildi.' Umair El-Hiba'da öldürüldü ve ona Quma'ah dendi. Anneleri aceleyle dışarı çıktı ve Elias ona, 'Khundhab'dan nerelisin?' dedi. Annesi ise 'Seni hâlâ arıyorum.' diye cevap verdi. Adı Khandaf'tı. Qusay'ın ifadesine göre Elias'ın oğlu, anneleri Khandaf'a ve babası Elias'a atfedildi {cite:muruj-al-dhahab, s. 567}."
  id: "Layla bint Halwan ibn Imran ibn al-Haf ibn Quda'ah adalah ibu dari putra Ilyas ibn Mudar. Gelarnya Khandaf, dan putranya bernama: 'Amir pergi berburu dan memasaknya, sehingga ia disebut Tabakha.' Umair dibunuh di Al-Hiba' dan disebut Quma'ah. Ibu mereka segera keluar, dan Elias berkata kepadanya, 'Dari mana asalmu, Khundhab?' Ia menjawab, 'Aku masih mencarimu.' Namanya Khandaf. Putra Elias dikaitkan dengan ibu mereka Khandaf, menurut pernyataan Qusay, ibuku Khandaf, dan Elias sebagai ayah {cite:muruj-al-dhahab, hlm. 567}."
