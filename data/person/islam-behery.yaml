summary:
  ar: "باحث وكاتب ومقدّم برامج مصري يعرّف نفسه بأنه «باحث إسلامي»؛ حاصل على ماجستير في «طرائق التعامل مع التراث» من جامعة ويلز، وعمل بمؤسسة اليوم السابع، وقدّم برنامج «مع إسلام» على قناة القاهرة والناس الذي أثار جدلاً واسعاً في نقد التراث. حُكم عليه سنة 2015 بالسجن في تهمة ازدراء الأديان ثم خُفّف الحكم إلى سنة، وأصدر الرئيس عبد الفتاح السيسي عفواً عنه في نوفمبر 2016 ضمن القرار الجمهوري رقم 515."
  en: "Egyptian researcher, writer and television presenter who describes himself as an 'Islamic researcher'. He holds a master's degree in 'methods of dealing with heritage' from the University of Wales, worked at the Youm7 institution and presented 'Ma'a Islam' (With Islam) on Al-Qahera wal-Nas, a heritage-criticism programme that stirred wide controversy. He was sentenced in 2015 for 'contempt of religion', the term reduced to one year, and President Abdel Fattah al-Sisi pardoned him in November 2016 under decree 515."
  ur: "مصری محقق، مصنف اور ٹیلی ویژن پیش کار جو خود کو «باحث إسلامي» کہتا ہے؛ یونیورسٹی آف ویلز سے «طرائق التعامل مع التراث» میں ماسٹرز کا حامل، ادارۂ یوم السابع سے وابستہ رہا اور قناة القاهرة والناس پر «مع إسلام» پروگرام پیش کیا جس نے تراث پر تنقید کے سبب وسیع بحث چھڑی۔ 2015 میں ازدراءِ مذہب کے الزام میں سزا ہوئی جو ایک سال تک کم ہوئی، اور صدر عبد الفتاح السیسی نے نومبر 2016 میں فرمان 515 کے تحت انہیں معاف کر دیا۔"
