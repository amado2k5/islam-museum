summary:
  ar: "الداي حسين ⁦(وُلد باسم حسين بن حسين؛ 1765 أو 1773 – 1838)⁩ هو الداي السابع والعشرون والأخير لإيالة الجزائر العثمانية، حكم من 1 مارس 1818 حتى الغزو الفرنسي سنة 1830. كان ضابط مدفعية أناضوليًا ترقّى في أوجاق الجزائر حتى صار خوجة الخيل، واشتهر بحادثة المروحة في 29 أبريل 1827 حين ضرب القنصل الفرنسي بيار دوفال بمروحته، وهي الحادثة التي اتخذتها فرنسا ذريعة لحصار الجزائر ثم غزوها. سلّم مدينة الجزائر في 5 يوليو 1830 ونُفي إلى إيطاليا، ثم استقر في الإسكندرية حيث توفي سنة 1838؛ وما يزال أحد أحياء العاصمة الجزائرية وفريقه لكرة القدم يحملان اسمه."
  en: "Hussein Dey (born Hüseyin bin Hüseyin; 1765 or 1773 – 1838) was the twenty-seventh and last Dey of the Regency of Algiers, ruling from 1 March 1818 until the French invasion of 1830. An Anatolian artillery officer who rose through the Odjak of Algiers to become Khodjet al-khil, the minister for cavalry and taxes, he is remembered for the fly-whisk incident of 29 April 1827, when he struck the French consul Pierre Deval with his fly whisk — the slight France used as the pretext for its blockade and then its invasion of Algiers. He surrendered the city on 5 July 1830, was exiled to Italy, settled at Alexandria and died there in 1838; a suburb of Algiers and its football club still bear his name."
  ur: "الدای حسین ⁦(پیدائشی نام حسین بن حسین؛ 1765ء یا 1773ء – 1838ء)⁩ عثمانی ایالتِ الجزائر کے ستائیسویں اور آخری دای تھے، 1 مارچ 1818ء سے 1830ء کے فرانسیسی حملے تک حکمران رہے۔ اناطولیہ کے توپ خانے کے افسر تھے، الجزائر کے اوجاق میں ترقی پا کر خوجۂ خیل ⁦(گھڑ سوار فوج اور محصولات کے وزیر)⁩ بنے، اور 29 اپریل 1827ء کے «واقعۂ مروّحہ» سے مشہور ہوئے جب انہوں نے فرانسیسی قونصل پیئر دوال کو اپنے پنکھے سے مارا — یہی توہین فرانس نے الجزائر کے محاصرے اور پھر حملے کا بہانہ بنائی۔ 5 جولائی 1830ء کو شہر حوالے کیا، اٹلی جلاوطن ہوئے، پھر اسکندریہ جا بسے اور 1838ء میں وہیں وفات پائی؛ الجزائر شہر کا ایک محلّہ اور اس کا فٹ بال کلب آج بھی ان کے نام پر ہے۔"
  es: "Hussein Dey (nacido Hüseyin bin Hüseyin; 1765 o 1773 – 1838) fue el vigésimo séptimo y último Dey de la Regencia de Argel, gobernando desde el 1 de marzo de 1818 hasta la invasión francesa de 1830. Oficial de artillería anatolio que ascendió en el Odjak de Argel hasta convertirse en Khodjet al-khil, ministro de caballería e impuestos, es recordado por el incidente del matamoscas del 29 de abril de 1827, cuando golpeó al cónsul francés Pierre Deval con su matamoscas, un desliz que Francia utilizó como pretexto para su bloqueo y posterior invasión de Argel. Entregó la ciudad el 5 de julio de 1830, fue exiliado a Italia, se estableció en Alejandría y murió allí en 1838; un suburbio de Argel y su club de fútbol aún llevan su nombre."
  fr: "Hussein Dey (né Hüseyin bin Hüseyin; 1765 ou 1773 – 1838) fut le vingt-septième et dernier Dey de la Régence d'Alger, régnant du 1er mars 1818 jusqu'à l'invasion française de 1830. Officier d'artillerie anatolien, il gravit les échelons de l'Odjak d'Alger jusqu'à devenir Khodjet al-khil, ministre de la cavalerie et des impôts. Il est resté célèbre pour l'incident du chasse-mouches du 29 avril 1827, lorsqu'il frappa le consul français Pierre Deval avec son chasse-mouches – un affront dont la France se servit comme prétexte pour bloquer puis envahir Alger. Il capitula le 5 juillet 1830, fut exilé en Italie, s'installa à Alexandrie où il mourut en 1838. Un quartier d'Alger et son club de football portent encore son nom aujourd'hui."
  tr: "Dey Hussein (doğum adıyla Hüseyin bin Hüseyin; 1765 veya 1773–1838), Cezayir Osmanlı Eyaleti'nin yirmi yedinci ve son Dey'iydi; 1 Mart 1818'den 1830'daki Fransız işgaline kadar hüküm sürdü. Anadolu'da topçu subayıydı ve Cezayir'de yükselerek şövalye oldu. 29 Nisan 1827'de Fransız konsolosu Pierre Duval'a pervanesiyle vurduğu yelpaze olayı ile ünlendi; bu olay Fransa'nın Cezayir'i kuşatmak ve ardından işgal etmek için bahane olarak kullandı. 5 Temmuz 1830'da Cezayir şehrini teslim etti, İtalya'ya sürgün edildi, ardından İskenderiye'ye yerleşti ve 1838'de orada öldü; Cezayir başkentinin mahallelerinden biri ve futbol takımı hâlâ onun adını taşımaktadır."
  id: "Dey Hussein (lahir dengan nama Hussein bin Hussein; 1765 atau 1773–1838) adalah Dey ke-27 dan terakhir dari Eyalet Ottoman di Aljir, memerintah dari 1 Maret 1818 hingga invasi Prancis pada tahun 1830. Ia adalah perwira artileri di Anatolia yang naik pangkat di Algiers hingga menjadi ksatria. Ia menjadi terkenal karena insiden fan pada 29 April 1827, ketika ia memukul konsul Prancis Pierre Duval dengan baling-balingnya, sebuah peristiwa yang digunakan Prancis sebagai dalih untuk mengepung dan kemudian menyerbu Aljazair. Ia menyerahkan kota Aljir pada 5 Juli 1830, diasingkan ke Italia, lalu menetap di Alexandria, di mana ia meninggal pada tahun 1838; salah satu lingkungan ibu kota Aljazair dan tim sepak bolanya masih menggunakan namanya."

