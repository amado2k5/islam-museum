summary:
  ar: "الداي حسين (وُلد باسم حسين بن حسين؛ 1765 أو 1773 – 1838) هو الداي السابع والعشرون والأخير لإيالة الجزائر العثمانية، حكم من 1 مارس 1818 حتى الغزو الفرنسي سنة 1830. كان ضابط مدفعية أناضوليًا ترقّى في أوجاق الجزائر حتى صار خوجة الخيل، واشتهر بحادثة المروحة في 29 أبريل 1827 حين ضرب القنصل الفرنسي بيار دوفال بمروحته، وهي الحادثة التي اتخذتها فرنسا ذريعة لحصار الجزائر ثم غزوها. سلّم مدينة الجزائر في 5 يوليو 1830 ونُفي إلى إيطاليا، ثم استقر في الإسكندرية حيث توفي سنة 1838؛ وما يزال أحد أحياء العاصمة الجزائرية وفريقه لكرة القدم يحملان اسمه."
  en: "Hussein Dey (born Hüseyin bin Hüseyin; 1765 or 1773 – 1838) was the twenty-seventh and last Dey of the Regency of Algiers, ruling from 1 March 1818 until the French invasion of 1830. An Anatolian artillery officer who rose through the Odjak of Algiers to become Khodjet al-khil, the minister for cavalry and taxes, he is remembered for the fly-whisk incident of 29 April 1827, when he struck the French consul Pierre Deval with his fly whisk — the slight France used as the pretext for its blockade and then its invasion of Algiers. He surrendered the city on 5 July 1830, was exiled to Italy, settled at Alexandria and died there in 1838; a suburb of Algiers and its football club still bear his name."
  ur: "الدای حسین (پیدائشی نام حسین بن حسین؛ 1765ء یا 1773ء – 1838ء) عثمانی ایالتِ الجزائر کے ستائیسویں اور آخری دای تھے، 1 مارچ 1818ء سے 1830ء کے فرانسیسی حملے تک حکمران رہے۔ اناطولیہ کے توپ خانے کے افسر تھے، الجزائر کے اوجاق میں ترقی پا کر خوجۂ خیل (گھڑ سوار فوج اور محصولات کے وزیر) بنے، اور 29 اپریل 1827ء کے «واقعۂ مروّحہ» سے مشہور ہوئے جب انہوں نے فرانسیسی قونصل پیئر دوال کو اپنے پنکھے سے مارا — یہی توہین فرانس نے الجزائر کے محاصرے اور پھر حملے کا بہانہ بنائی۔ 5 جولائی 1830ء کو شہر حوالے کیا، اٹلی جلاوطن ہوئے، پھر اسکندریہ جا بسے اور 1838ء میں وہیں وفات پائی؛ الجزائر شہر کا ایک محلّہ اور اس کا فٹ بال کلب آج بھی ان کے نام پر ہے۔"

