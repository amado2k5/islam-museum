  es: "Médico sudafricano especializado en salud pública, epidemiólogo y virólogo, nacido en 1960 en Durban. Director de CAPRISA, su investigación sobre la prevención del VIH, la tuberculosis y la COVID-19 ha tenido un impacto mundial."
