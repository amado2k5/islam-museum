summary:
  ar: "ثاني سلاطين بنتن في غرب جاوة ⁦(حكم نحو 1570–1580)⁩، ابن المؤسس مولانا حسن الدين. طوّر بنتن القديمة لتصبح ميناءً تجاريًا دوليًا بأحياء مخططة للمهاجرين والتجار، ووسّع شبكات الري وأراضي الأرز، وكبّر الجامع الكبير الذي بناه أبوه، وفتح عام 1579 باكوان فاجاجاران، آخر مملكة هندوسية بوذية مهمة في جاوة، فأنهى حكم مملكة سوندا في غرب جاوة."
  en: "Second sultan of Banten in west Java (r. c. 1570–1580), son of the founder Maulana Hasanuddin. He developed Banten Lama into an international trading port with planned quarters for foreign merchants, extended its irrigation and rice lands, enlarged the Great Mosque his father had built, and in 1579 conquered Pakuan Pajajaran, the last significant Hindu-Buddhist kingdom of Java, ending the Sunda kingdom's rule in west Java."
  ur: "مغربی جاوا میں بنتن کے دوسرے سلطان ⁦(دورِ حکومت تقریباً 1570ء–1580ء)⁩، بانی مولانا حسن الدین کے بیٹے۔ انھوں نے بنتن لاما کو غیر ملکی تاجروں کے لیے منصوبہ بند محلوں والی بین الاقوامی تجارتی بندرگاہ بنایا، آبپاشی اور چاول کے کھیتوں کو وسعت دی، اپنے والد کی بنائی ہوئی جامع مسجد کو بڑا کیا اور 1579ء میں پاکوان پاجاجاران فتح کیا، جو جاوا کی آخری اہم ہندو-بدھ سلطنت تھی، یوں مغربی جاوا میں مملکت سونڈا کا اقتدار ختم ہوا۔"
  es: "Segundo sultán de Banten, en Java Occidental (1570-1580), hijo del fundador Maulana Hasanuddin. Convirtió Banten Lama en un puerto comercial internacional con alojamientos planificados para comerciantes extranjeros, amplió sus tierras de riego y cultivo de arroz, amplió la Gran Mezquita que su padre había construido y, en 1579, conquistó Pakuan Pajajaran, el último reino hindú-budista importante de Java, poniendo fin al dominio del reino de Sunda en Java Occidental."
  fr: "Deuxième sultan de Banten, dans l'ouest de Java (règne: 1570-1580), fils du fondateur Maulana Hasanuddin, il développa Banten Lama en un port de commerce international doté de quartiers destinés aux marchands étrangers, étendit son système d'irrigation et ses rizières, agrandit la Grande Mosquée construite par son père et, en 1579, conquit Pakuan Pajajaran, le dernier royaume hindou-bouddhiste important de Java, mettant ainsi fin à la domination du royaume de Sunda dans l'ouest de Java."
  tr: "Batı Cava'daki ikinci Benten Sultanı (yaklaşık 1570–1580 yılları arasında hüküm sürdü), kurucu Mawlana Hasanuddin'in oğludur. Eski Benten'i göçmenler ve tüccarlar için planlı mahallelerle uluslararası bir ticaret limanına dönüştürdü, sulama ağlarını ve pirinç tarlalarını genişletti, babasının inşa ettiği büyük camiyi genişletti ve 1579'da Java'daki son önemli Hindu Budist krallığı olan Bakwan Vajagaran'ı açarak Batı Java'daki Sunda Krallığı'nın yönetimini sona erdirdi."
  id: "Sultan Benten kedua di Jawa Barat (memerintah sekitar 1570–1580), putra pendiri Mawlana Hasanuddin. Ia mengembangkan Benten lama menjadi pelabuhan perdagangan internasional dengan lingkungan terencana untuk imigran dan pedagang, memperluas jaringan irigasi dan sawah, memperbesar masjid megah yang dibangun oleh ayahnya, dan pada tahun 1579 membuka Bakwan Vajagaran, kerajaan Buddha Hindu penting terakhir di Jawa, sehingga mengakhiri pemerintahan Kerajaan Sunda di Jawa Barat."

