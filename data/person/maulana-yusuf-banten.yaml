summary:
  ar: "ثاني سلاطين بنتن في غرب جاوة (حكم نحو 1570–1580)، ابن المؤسس مولانا حسن الدين. طوّر بنتن القديمة لتصبح ميناءً تجاريًا دوليًا بأحياء مخططة للمهاجرين والتجار، ووسّع شبكات الري وأراضي الأرز، وكبّر الجامع الكبير الذي بناه أبوه، وفتح عام 1579 باكوان فاجاجاران، آخر مملكة هندوسية بوذية مهمة في جاوة، فأنهى حكم مملكة سوندا في غرب جاوة."
  en: "Second sultan of Banten in west Java (r. c. 1570–1580), son of the founder Maulana Hasanuddin. He developed Banten Lama into an international trading port with planned quarters for foreign merchants, extended its irrigation and rice lands, enlarged the Great Mosque his father had built, and in 1579 conquered Pakuan Pajajaran, the last significant Hindu-Buddhist kingdom of Java, ending the Sunda kingdom's rule in west Java."
  ur: "مغربی جاوا میں بنتن کے دوسرے سلطان (دورِ حکومت تقریباً 1570ء–1580ء)، بانی مولانا حسن الدین کے بیٹے۔ انھوں نے بنتن لاما کو غیر ملکی تاجروں کے لیے منصوبہ بند محلوں والی بین الاقوامی تجارتی بندرگاہ بنایا، آبپاشی اور چاول کے کھیتوں کو وسعت دی، اپنے والد کی بنائی ہوئی جامع مسجد کو بڑا کیا اور 1579ء میں پاکوان پاجاجاران فتح کیا، جو جاوا کی آخری اہم ہندو-بدھ سلطنت تھی، یوں مغربی جاوا میں مملکت سونڈا کا اقتدار ختم ہوا۔"

