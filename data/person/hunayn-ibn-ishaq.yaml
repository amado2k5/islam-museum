id: person/hunayn-ibn-ishaq
class: person
label: { ar: "حنين بن إسحاق", en: "Hunayn ibn Ishaq", es: "Hunayn ibn Ishaq", fr: "Hunayn ibn Ishaq", ur: "حنین بن اسحاق" }
summary:
  ar: "طبيب الواثق ونديمه، سأله في مجلس جمع فيه المتطببين عن آلات الغذاء ففصل له الأسنان اثنين وثلاثين سناً وأنواعها وأصولها فقال له صنف لي كتاباً فصنفه في ثلاث مقالات في الفرق بين الغذاء والدواء والمسهل وآلات الجسد، وسأله عن الأشياء المغيرة للهواء فعدد خمساً منها أوقات السنة وطلوع الكواكب والرياح والبلدان والبحار، وصنف في مسائله كتاب المسائل الطبيعية {cite:muruj-al-dhahab p. 468-471}. وكان بنو شاكر المنجم يرزقونه مع حبيش بن الحسن وثابت بن قرة نحو خمسمائة دينار في الشهر للنقل والملازمة وأنفذوه إلى بلد الروم فجاءهم بطرائف الكتب {cite:fihrist-ibn-al-nadim p. 340}"
  en: "Al-Wathiq's physician — his lecture on the thirty-two teeth earned a book commission, and his answers on air-altering factors became Kitab al-Masa'il al-Tabi'iyya {cite:muruj-al-dhahab p. 468-471}."
  es: "El médico de Al-Wathiq —su conferencia sobre los treinta y dos dientes le valió un encargo para escribir un libro, y sus respuestas sobre los factores que alteran el aire se convirtieron en Kitab al-Masa'il al-Tabi'iyya {cite:muruj-al-dhahab p. 468-471}."
  fr: "Le médecin d'Al-Wathiq — sa conférence sur les trente-deux dents lui valut une commande de livre, et ses réponses sur les facteurs modifiant l'air devinrent Kitab al-Masa'il al-Tabi'iyya {cite:muruj-al-dhahab p. 468-471}."
  ur: "الوثیق کے معالج - بتیس دانتوں پر ان کے لیکچر نے کتابی کمیشن حاصل کیا، اور ہوا میں تبدیلی کرنے والے عوامل پر ان کے جوابات کتاب المسائل الطبیعہ بن گئے۔ 468-471}۔"
  tr: "El-Wathiq'in doktoru ve arkadaşı. Bir hekimler toplantısında ona yiyecek gereçleri hakkında sordu, böylece otuz iki dişi, türlerini ve kökenlerini ayırdı. Ona, 'Bana bir kitap yaz, onu yiyecek, ilaç, müshiller ve vücut makineleri arasındaki fark üzerine üç denemeye böldü.' dedi. Havayı değiştiren şeyler hakkında sordu ve beşini saydı: yılın zamanları, yıldızların doğuşu, rüzgarlar, ülkeler ve denizler. Ayrıca kendi sorunları üzerine 'Doğal Sorunlar' adlı kitabı yazdı {atıf: Muruj-al-Dhahab, s. 468-471}. Banu Şakir el-Munjam, Hubaysh ibn al-Hasan ve Thabit ibn Qurra ile birlikte ona ayda yaklaşık beş yüz dinar taşıma ve eşlik için sağladı ve onu Romalıların topraklarına gönderdiler; burada Roma onlara kitap anekdotları getirdi {cite:Fihrist-ibn-al-Nadim s. 340}"
  id: "Dokter dan teman Al-Wathiq. Ia bertanya kepadanya di pertemuan tabib tentang alat makanan, sehingga ia memisahkan tiga puluh dua gigi, jenisnya, dan asal-usulnya. Ia berkata kepadanya, 'Tuliskan saya sebuah buku, yang ia bagi menjadi tiga esai tentang perbedaan antara makanan, obat, pencahar, dan mesin tubuh.' Ia bertanya tentang hal-hal yang mengubah udara, dan ia menyebutkan lima di antaranya: waktu dalam setahun, terbitnya bintang, angin, negara, dan lautan. Ia juga menulis tentang isu-masalahnya buku 'Natural Issues' {cite:muruj-al-dhahab, hlm. 468-471}. Banu Shakir al-Munjam memberinya, bersama Hubaysh ibn al-Hasan dan Thabit ibn Qurrah, sekitar lima ratus dinar per bulan untuk transportasi dan pendampingan, dan mereka mengirimnya ke tanah Romawi, di mana ia membawa anekdot tentang buku-buku {cite:fihrist-ibn-al-nadim hlm. 340}"
