class: person
label: { ar: "حنين بن إسحاق", en: "Hunayn ibn Ishaq" }
summary:
  ar: "طبيب الواثق ونديمه، سأله في مجلس جمع فيه المتطببين عن آلات الغذاء ففصل له الأسنان اثنين وثلاثين سناً وأنواعها وأصولها فقال له صنف لي كتاباً فصنفه في ثلاث مقالات في الفرق بين الغذاء والدواء والمسهل وآلات الجسد، وسأله عن الأشياء المغيرة للهواء فعدد خمساً منها أوقات السنة وطلوع الكواكب والرياح والبلدان والبحار، وصنف في مسائله كتاب المسائل الطبيعية {cite:muruj-al-dhahab p. 468-471}.، وكان بنو شاكر المنجم يرزقونه مع حبيش بن الحسن وثابت بن قرة نحو خمسمائة دينار في الشهر للنقل والملازمة وأنفذوه إلى بلد الروم فجاءهم بطرائف الكتب {cite:fihrist-ibn-al-nadim p. 340}"
  en: "Al-Wathiq's physician — his lecture on the thirty-two teeth earned a book commission, and his answers on air-altering factors became Kitab al-Masa'il al-Tabi'iyya {cite:muruj-al-dhahab p. 468-471}."
