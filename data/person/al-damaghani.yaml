names:
  - { value: "عبد الله بن علي أبو عبد الله الدامغاني قاضي القضاة", kind: full }
summary:
  ar: "قاضي القضاة ببغداد، ولي قضاء القضاة يوم الثلاثاء عاشر ذي القعدة سنة سبع وأربعين وأربعمائة وخُلع عليه، فكان قاضي قضاة العهد الطغربكي والملكشاهي؛ حضر عقد زواج القائم بخديجة بنت أخي السلطان سنة ٤٤٨ مع القاضي الماوردي، وكان من بين يديه رئيس الرؤساء يوم تقليد طغربك سنة ٤٤٩، واستقبل القائم العائد من منفاه سنة ٤٥١ ولم يكن في بغداد من يستقبله سواه وثلاثة أنفس من الشهود، وبايع المقتدي سنة ٤٦٧، وفتّش المقتولين في فتنة سوق المدرسة سنة ٤٧٠ {cite:muntazam-ibn-al-jawzi j.8 p.507,511,523,550,634,655}. وسئل يوم فتنة رؤية الهلال سنة ٤٤٨ عن الشريف الذي أفطر الناس فقال: على مذهب أبي حنيفة وهو مذهبي لا تقبل مع صحو السماء إلا شهادة عدد كثير يبلغ مائتين، وأما مذهب الشافعي فيقطع بشهادة اثنين {cite:muntazam-ibn-al-jawzi j.8 p.514}."
  en: "Chief qadi of Baghdad through the Seljuk transition: invested on 10 Dhu'l-Qa'da 447, witness of the caliph's marriage to Tughril's niece (448) and of the 449 investiture, the only dignitary left in Baghdad — with three witnesses — to receive al-Qa'im back from exile in 451, present at al-Muqtadi's bay'a in 467, and arbiter of the famous false-hilal ruling (Hanafi: two hundred witnesses under a clear sky; Shafi'i: two suffice) {cite:muntazam-ibn-al-jawzi j.8 p.507,514,550,634}."
  fr: "Grand cadi de Bagdad pendant la transition seldjoukide : investi le 10 dhu al-qa’da 447 H, témoin du mariage du calife avec la nièce de Tughril (448 H) et de l’investiture de 449 H, seul dignitaire resté à Bagdad — avec trois témoins — pour accueillir al-Qa’im à son retour d’exil en 451 H, présent à la bay’a d’al-Muqtadi en 467 H et arbitre du célèbre jugement sur un faux croissant (hanafite : deux cents témoins par ciel clair ; chaféite : deux suffisent) {cite:muntazam-ibn-al-jawzi j.8 p.507,514,550,634}."
  es: "Cadí principal de Bagdad durante la transición selyúcida: investido el 10 de Dhu'l-Qa'da de 447, testigo del matrimonio del califa con la sobrina de Tughril (448) y de la investidura de 449, el único dignatario que quedó en Bagdad —con tres testigos— para recibir a al-Qa'im de vuelta del exilio en 451, presente en la bay'a de al-Muqtadi en 467 y árbitro del famoso dictamen del falso hilal (Hanafi: doscientos testigos bajo un cielo despejado; Shafi'i: dos bastan) {cite:muntazam-ibn-al-jawzi j.8 p.507,514,550,634}."
  ur: "سلجوق منتقلی کے ذریعے بغداد کا چیف قادی: 10 ذوالقعدہ 447 کو سرمایہ کاری کی گئی، خلیفہ کی طغرل کی بھانجی (448) سے شادی کا گواہ اور 449 سرمایہ کاری میں سے، بغداد میں واحد معزز رہ گیا — جس کے پاس تین گواہ موجود ہیں، جن کے پاس تین گواہ موجود ہیں۔ مقتدی کی بیع 467 میں، اور مشہور جھوٹے ہلال حکم کا ثالث ⁦(حنفی: صاف آسمان کے نیچے دو سو گواہ؛ شافعی: دو ہی کافی)⁩"
  tr: "Bağdat Başyargıtı, Hicri 447 yılında Zilhicce ayının onuncu Salı günü Başyargıçlık görevine başladı ve şeref cübbesi giydi. Tuğrabak ve Malikşahi döneminin Başyargıtıydı. Hicri 448 yılında Sultanın erkek kardeşinin kızı Hatice ile el-Kaim'in nikah törenine, Hakim el-Mawardi ile birlikte katıldı. Hicri 449 yılında Tuğrabak'ın göreve başlama töreninde, ondan önce başyargıçların başıydı. Hicri 451 yılında sürgünden dönen el-Kaim'i karşıladı ve Bağdat'ta onu karşılayacak sadece kendisi ve üç şahit vardı. Hicri 467 yılında el-Muktadi'ye biat etti ve Hicri 470 yılında okul çarşısı isyanında öldürülenleri soruşturdu. {cite:muntazam-ibn-al-jawzi j.8 s.507,511,523,550,634,655}. 448 yılında hilalin görülmesi tartışması gününde, insanlar için orucu bozan Şerif hakkında kendisine soru soruldu ve şöyle dedi: Benim de mensup olduğum Ebu Hanife ekolüne göre, ancak iki yüze ulaşan büyük bir sayının şahitliği açık bir şekilde kabul edilir. Şafiî ekolüne gelince, iki kişinin şahitliğiyle karar verilir. {cite:muntazam-ibn-al-jawzi j.8 s.514}."
  id: "Ketua Mahkamah Agung Baghdad, beliau menjabat sebagai Ketua Mahkamah Agung pada hari Selasa, tanggal 10 Dzul Qa'dah, tahun 447 H, dan diberi jubah kehormatan. Beliau adalah Ketua Mahkamah Agung pada era Tughrabak dan Malikshahi. Beliau menghadiri akad nikah al-Qa'im dengan Khadija, putri saudara Sultan, pada tahun 448 H, bersama dengan Hakim al-Mawardi. Beliau adalah kepala para kepala di hadapannya pada hari pelantikan Tughrabak pada tahun 449 H. Beliau menerima al-Qa'im saat kembali dari pengasingan pada tahun 451 H, dan tidak ada seorang pun di Baghdad yang menerimanya kecuali beliau dan tiga saksi. Beliau berjanji setia kepada al-Muqtadi pada tahun 467 H, dan beliau menyelidiki korban tewas dalam kerusuhan pasar sekolah pada tahun 470 H. {cite:muntazam-ibn-al-jawzi j.8 p.507,511,523,550,634,655}. Pada hari kontroversi penampakan hilal tahun 448, beliau ditanya tentang Syarif yang membatalkan puasa untuk orang banyak, dan beliau berkata: Menurut mazhab Abu Hanifa, yang merupakan mazhab saya, hanya kesaksian sejumlah besar orang, mencapai dua ratus orang, yang diterima dengan langit cerah. Adapun mazhab Al-Shafi'i, hal itu diputuskan berdasarkan kesaksian dua orang. {cite:muntazam-ibn-al-jawzi j.8 p.514}."
