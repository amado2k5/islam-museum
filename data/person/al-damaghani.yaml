names:
  - { value: "عبد الله بن علي أبو عبد الله الدامغاني قاضي القضاة", kind: full }
summary:
  ar: "قاضي القضاة ببغداد، ولي قضاء القضاة يوم الثلاثاء عاشر ذي القعدة سنة سبع وأربعين وأربعمائة وخُلع عليه، فكان قاضي قضاة العهد الطغربكي والملكشاهي؛ حضر عقد زواج القائم بخديجة بنت أخي السلطان سنة ٤٤٨ مع القاضي الماوردي، وكان من بين يديه رئيس الرؤساء يوم تقليد طغربك سنة ٤٤٩، واستقبل القائم العائد من منفاه سنة ٤٥١ ولم يكن في بغداد من يستقبله سواه وثلاثة أنفس من الشهود، وبايع المقتدي سنة ٤٦٧، وفتّش المقتولين في فتنة سوق المدرسة سنة ٤٧٠ {cite:muntazam-ibn-al-jawzi j.8 p.507,511,523,550,634,655}. وسئل يوم فتنة رؤية الهلال سنة ٤٤٨ عن الشريف الذي أفطر الناس فقال: على مذهب أبي حنيفة وهو مذهبي لا تقبل مع صحو السماء إلا شهادة عدد كثير يبلغ مائتين، وأما مذهب الشافعي فيقطع بشهادة اثنين {cite:muntazam-ibn-al-jawzi j.8 p.514}."
  en: "Chief qadi of Baghdad through the Seljuk transition: invested on 10 Dhu'l-Qa'da 447, witness of the caliph's marriage to Tughril's niece (448) and of the 449 investiture, the only dignitary left in Baghdad — with three witnesses — to receive al-Qa'im back from exile in 451, present at al-Muqtadi's bay'a in 467, and arbiter of the famous false-hilal ruling (Hanafi: two hundred witnesses under a clear sky; Shafi'i: two suffice) {cite:muntazam-ibn-al-jawzi j.8 p.507,514,550,634}."
