summary:
  ar: "مقاتل مواي تاي وكيك بوكسر تايلاندي وُلد باسم سومبات بانشاميك في محافظة سورين سنة 1982. فاز ببطولة كي-وان وورلد ماكس سنتي 2004 و2006، وهو أول من فاز بها مرتين، وحقق 246 انتصاراً، وقاد سنة 2023 أكبر أداء جماعي لطقس الواي كرو فسُجل في موسوعة غينيس. ويُعد من أعظم مقاتلي المواي تاي في التاريخ."
  en: "Thai Muay Thai fighter and kickboxer, born Sombat Banchamek in Surin province in 1982. He won the K-1 World MAX tournament in 2004 and 2006 — the first man to win it twice — compiled 246 wins, and in 2023 led the largest Wai Kru performance, a Guinness World Record. He is regarded as one of the greatest Muay Thai fighters of all time."
  ur: "تھائی موئے تھائی فائٹر اور کک باکسر، 1982 میں صوبہ سورین میں سومبات بانچامیک کے نام سے پیدا ہوئے۔ انہوں نے 2004 اور 2006 میں کے-ون ورلڈ میکس ٹورنامنٹ جیتا — یہ اعزاز دو بار جیتنے والے پہلے فائٹر — 246 فتوحات حاصل کیں، اور 2023 میں سب سے بڑے وائی کرو مظاہرے کی قیادت کی جو گنیز ورلڈ ریکارڈ بنا۔ انہیں تاریخ کے عظیم ترین موئے تھائی فائٹروں میں شمار کیا جاتا ہے۔"
  es: "Luchador tailandés de Muay Thai y kickboxer, nacido como Sombat Banchamek en la provincia de Surin en 1982. Ganó el torneo K-1 World MAX en 2004 y 2006 —siendo el primer hombre en ganarlo dos veces—, acumuló 246 victorias y, en 2023, lideró la mayor exhibición de Wai Kru, un récord mundial Guinness. Es considerado uno de los mejores luchadores de Muay Thai de todos los tiempos."
  fr: "Combattant de Muay Thai et de kickboxing thaïlandais, né Sombat Banchamek dans la province de Surin en 1982, il a remporté le tournoi K-1 World MAX en 2004 et 2006 – une première – et totalise 246 victoires. En 2023, il a dirigé la plus grande performance de Wai Kru jamais réalisée, un record du monde Guinness. Il est considéré comme l'un des plus grands combattants de Muay Thai de tous les temps."
  tr: "1982'de Surin Eyaleti'nde Sombat Panchamk adıyla doğan Taylandlı bir Muay Thai dövüşçüsü ve kickboksçu. 2004 ve 2006'da K-1 Dünya Max Şampiyonası'nı kazandı, iki kez kazanan ilk kişi oldu, 246 galibiyet elde etti ve 2023'te WiiCurve hava durumu yarışının en büyük toplu performansını Guinness Dünya Rekorları'na kaydederek liderlik etti. Tarihin en büyük Muay Thai dövüşçülerinden biri olarak kabul edilir."
  id: "Seorang petarung Muay Thai dan kickboxer, lahir dengan nama Sombat Panchamk di Provinsi Surin pada tahun 1982. Ia memenangkan Kejuaraan K-1 World Max pada tahun 2004 dan 2006, menjadi yang pertama memenangkan gelar itu dua kali, meraih 246 kemenangan, dan pada tahun 2023 memimpin penampilan kolektif terbesar dalam cuaca WiiCurve, mencatatnya dalam Guinness World Records. Ia dianggap sebagai salah satu petarung Muay Thai terbesar dalam sejarah."
