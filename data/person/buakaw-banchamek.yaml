summary:
  ar: "مقاتل مواي تاي وكيك بوكسر تايلاندي وُلد باسم سومبات بانشاميك في محافظة سورين سنة 1982. فاز ببطولة كي-وان وورلد ماكس سنتي 2004 و2006، وهو أول من فاز بها مرتين، وحقق 246 انتصاراً، وقاد سنة 2023 أكبر أداء جماعي لطقس الواي كرو فسُجل في موسوعة غينيس. ويُعد من أعظم مقاتلي المواي تاي في التاريخ."
  en: "Thai Muay Thai fighter and kickboxer, born Sombat Banchamek in Surin province in 1982. He won the K-1 World MAX tournament in 2004 and 2006 — the first man to win it twice — compiled 246 wins, and in 2023 led the largest Wai Kru performance, a Guinness World Record. He is regarded as one of the greatest Muay Thai fighters of all time."
  ur: "تھائی موئے تھائی فائٹر اور کک باکسر، 1982 میں صوبہ سورین میں سومبات بانچامیک کے نام سے پیدا ہوئے۔ انہوں نے 2004 اور 2006 میں کے-ون ورلڈ میکس ٹورنامنٹ جیتا — یہ اعزاز دو بار جیتنے والے پہلے فائٹر — 246 فتوحات حاصل کیں، اور 2023 میں سب سے بڑے وائی کرو مظاہرے کی قیادت کی جو گنیز ورلڈ ریکارڈ بنا۔ انہیں تاریخ کے عظیم ترین موئے تھائی فائٹروں میں شمار کیا جاتا ہے۔"
