summary:
  ar: "عدّاء مسافات طويلة بريطاني من أصل صومالي، وُلد سنة 1983، فاز بذهبيتي 5000 و10000 متر في أولمبياد لندن 2012 وكرر الإنجاز في ريو 2016، وحقق ستة ألقاب عالمية، وهو أنجح عدّاء مسافات في تاريخ بطولات العالم الكبرى وأنجح رياضي بريطاني في تاريخ الأولمبياد في ألعاب القوى، واعتزل سنة 2023. كشف سنة 2022 أنه جاء إلى بريطانيا طفلا مهربا باسم طفل آخر."
  en: "British long-distance runner of Somali origin, born in 1983. He won the 5,000 m and 10,000 m gold medals at the London 2012 Olympics and repeated the double at Rio 2016, took six World Championship titles, and is the most successful male track distance runner in global championship history and Britain's most successful Olympic track athlete. He retired in 2023. In 2022 he revealed that he had been trafficked to Britain as a child under another child's name."
  ur: "صومالی نژاد برطانوی طویل فاصلے کے دوڑنے والے، جو 1983 میں پیدا ہوئے۔ انہوں نے لندن 2012 اولمپکس میں 5,000 اور 10,000 میٹر کے طلائی تمغے جیتے اور ریو 2016 میں یہی کارنامہ دہرایا، چھ عالمی ٹائٹل حاصل کیے، اور عالمی چیمپئن شپ کی تاریخ کے کامیاب ترین مرد ٹریک فاصلاتی رنر اور برطانیہ کے کامیاب ترین اولمپک ٹریک ایتھلیٹ ہیں۔ وہ 2023 میں ریٹائر ہوئے۔ 2022 میں انہوں نے انکشاف کیا کہ انہیں بچپن میں کسی اور بچے کے نام پر برطانیہ اسمگل کیا گیا تھا۔"
