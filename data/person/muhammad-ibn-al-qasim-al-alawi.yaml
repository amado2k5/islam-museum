summary:
  ar: "محمد بن القاسم بن علي بن عمر بن علي بن الحسين، كان بالكوفة من العبادة والورع في نهاية الوصف فأخافه المعتصم سنة تسع عشرة ومائتين فهرب إلى خراسان فتنقل في مرو وسرخس والطالقان ونسا فانقاد إليه خلق كثير، ثم حمله عبد الله بن طاهر إلى المعتصم فحبسه في أزج ببستان بسر من رأى، وقيل قتل بالسم وقيل إن شيعته من الطالقان نقبوا الأزج وأخرجوه فلم يعرف له خبر، وتزعم زيدية كثيرون أنه لم يمت وأنه مهدي هذه الأمة يملؤها عدلاً {cite:muruj-al-dhahab p. 443-444}."
  en: "The devout 'Alid of Kufa who fled al-Mu'tasim to Khurasan — captured by 'Abdallah ibn Tahir, then either poisoned or smuggled out of his cage by Talaqan followers who still await him as mahdi {cite:muruj-al-dhahab p. 443-444}."
