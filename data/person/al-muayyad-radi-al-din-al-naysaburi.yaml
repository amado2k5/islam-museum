summary:
  ar: "أبو الحسن المؤيد بن محمد بن علي الطوسي الأصل النيسابوري الدار، الملقب رضي الدين؛ محدث كان أعلى المتأخرين إسناداً، لقي جماعة من الأعيان وأخذ عنهم؛ سمع صحيح مسلم من الفقيه ابن الفضل الفراوي وهو آخر من بقي من أصحابه، وسمع الموطأ رواية أبي مصعب من هبة الله بن سويد السندي، وتفسير القرآن تصنيف أبي إسحاق الثعلبي من عباسة؛ حدث بالكثير ورحل إليه من الأقطار، ولابن خلكان منه إجازة من خراسان باستدعاء أبيه سنة عشر وستمائة {cite:wafayat-ayan}."
  en: "Radi al-Din al-Mu'ayyad of Nishapur (524–617) — the latest high-isnad traditionist of his age; heard Sahih Muslim from al-Furawi and the Muwatta' via Abu Mus'ab's recension; Ibn Khallikan's father obtained an ijaza from him in 610 {cite:wafayat-ayan}."
  fr: "Radi al-Din al-Mu'ayyad de Nichapour (524-617) - le dernier traditionaliste de son époque ; a entendu Sahih Muslim d'al-Furawi et les Muwatta' via la recension d'Abou Mus'ab ; le père d'Ibn Khallikan lui a obtenu un ijaza en 610 {cite:wafayat-ayan}."
  es: "Radi al-Din al-Mu'ayyad de Nishapur (524–617), el último tradicionalista del alto isnad de su época; escuchó a Sahih Muslim de al-Furawi y los Muwatta' a través de la recensión de Abu Mus'ab; El padre de Ibn Khallikan obtuvo una ijaza de él en 610 {cita:wafayat-ayan}."
  ur: "ردی الدین المعیاد آف نیشاپور (524-617) - اپنی عمر کے جدید ترین روایت ساز؛ صحیح مسلم کو الفروی اور موطا سے ابو مصعب کی تعدیل کے ذریعے سنا۔ ابن خلقان کے والد نے 610 میں ان سے اعجاز حاصل کیا۔"
  tr: "Ebu el-Hasan el-Muayyad ibn Muhammed bin Ali el-Tusi, aslen el-Nisaburi el-Dar'dan, lakaplı Radi al-Din; sonraki alimler arasında en yüksek aktarım zinciri olan bir hadis âlimidir. Bir grup önemli şahsiyetle tanıştı ve onların yanında eğitim aldı. Sahih Müslim'i, son sahabesi olan fihil İbn el-Fadl el-Feravi'den dinledi, Muwatta'nın rivayetini Ebu Mus'ab'dan ve Abbasa'dan Ebu İshaq el-Tehalbi'nin derlediği Kur'an tefsirini dinledi; geniş bir rivayet yaptı ve çeşitli ülkelerden ona seyahat etti. İbn Hallikan, babasının çağrısı üzerine 600 Hicri yılında Horasan'dan izin aldı."
  id: "Abu al-Hasan al-Mu'ayyad ibn Muhammad ibn Ali al-Tusi, yang berasal dari al-Nisaburi al-Dar, dijuluki Radi al-Din; seorang ulama hadis yang merupakan yang tertinggi dalam rantai transmisi di antara ulama berikutnya. Ia bertemu dengan sekelompok tokoh terkemuka dan belajar di bawah mereka. Ia mendengar Sahih Muslim dari ahli hukum Ibn al-Fadl al-Farawi, sahabat terakhirnya, dan mendengar riwayat Muwatta dari Abu Mus'ab dari Hibatullah ibn Suwaid al-Sindi, serta tafsiran Al-Qur'an yang disusun oleh Abu Ishaq al-Tha'labi dari Abbasa; ia menceritakan secara luas dan bepergian kepadanya dari berbagai negeri. Ibn Khallikan menerima izin dari Khurasan atas panggilan ayahnya pada tahun 600 H."
