  ar: "أبو الحسن المؤيد بن محمد بن علي الطوسي الأصل النيسابوري الدار، الملقب رضي الدين؛ محدث كان أعلى المتأخرين إسناداً، لقي جماعة من الأعيان وأخذ عنهم؛ سمع صحيح مسلم من الفقيه ابن الفضل الفراوي وهو آخر من بقي من أصحابه، وسمع الموطأ رواية أبي مصعب من هبة الله بن سويد السندي، وتفسير القرآن تصنيف أبي إسحاق الثعلبي من عباسة؛ حدث بالكثير ورحل إليه من الأقطار، ولابن خلكان منه إجازة من خراسان باستدعاء أبيه سنة عشر وستمائة {cite:wafayat-ayan}."
  en: "Radi al-Din al-Mu'ayyad of Nishapur (524–617) — the latest high-isnad traditionist of his age; heard Sahih Muslim from al-Furawi and the Muwatta' via Abu Mus'ab's recension; Ibn Khallikan's father obtained an ijaza from him in 610 {cite:wafayat-ayan}."
