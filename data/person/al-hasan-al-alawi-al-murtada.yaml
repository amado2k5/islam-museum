summary:
  ar: "الحسن بن السيد الأمير علي بن المرتضى أبو محمد العلوي الحسيني؛ آخر من سمع من ابن ناصر، يروي عنه كتاب الذرية الطاهرة؛ توفي في شعبان سنة ثلاثين وستمائة عن ست وثمانين سنة وسماعه في الخامسة من عمره {cite:shadharat-dhahab p. 136}."
  en: "al-Hasan b. al-Amir Ali b. al-Murtada — the Husayni Alid and last hearer of Ibn Nasir, transmitter of his Kitab al-Dhuriyya al-Tahira; his own audition dated to age five, he died in Sha'ban 630 at eighty-six {cite:shadharat-dhahab p. 136}."
  es: "al-Hasan b. al-Amir Ali b. al-Murtada — el Husayni Alid y último oyente de Ibn Nasir, transmisor de su Kitab al-Dhuriyya al-Tahira; su propia audición data de los cinco años, murió en Sha'ban 630 a los ochenta y seis años {cite:shadharat-dhahab p. 136}."
  fr: "al-Hasan b. al-Amir Ali b. al-Murtada — le Husayni Alid et dernier auditeur d'Ibn Nasir, transmetteur de son Kitab al-Dhuriyya al-Tahira; sa propre audition remonte à l'âge de cinq ans, il mourut en Sha'ban 630 à quatre-vingt-six ans {cite:shadharat-dhahab p. 136}."
  ur: "الحسن بی الامیر علی بی المرتضی - حسینی علید اور ابن ناصر کے آخری سننے والے، اس کی کتاب الثوریہ الطاہرہ کے ٹرانسمیٹر؛ ان کا اپنا آڈیشن پانچ سال کی عمر میں ہوا، ان کی وفات شعبان 630 میں چھیاسی میں ہوئی۔ 136}۔"
  tr: "El-Hasan ibn el-Seyyid el-Emir Ali ibn el-Murtada Ebu Muhammed el-Alavi el-Husayni; İbn Nasir'den son duyan kişidir; 'El-Dhariyye el-Tahira' kitabını anlatan İbn Nasir'den son duyandır; 630 Hicri yılında, seksen altı yaşında Şaban'da ölmüş ve beş yaşında dinlenmiştir {atıf:şadharat-dhahab, s. 136}."
  id: "Al-Hasan ibn al-Sayyid al-Amir Ali ibn al-Murtada Abu Muhammad al-Alawi al-Husayni; yang terakhir mendengar dari Ibn Nasir, dari siapa buku 'Al-Dhariyyah al-Tahira' diceritakan; ia meninggal di Sha'ban pada tahun 630 H pada usia delapan puluh enam tahun dan terdengar pada usia lima tahun {cite:shadharat-dhahab, hlm. 136}."
