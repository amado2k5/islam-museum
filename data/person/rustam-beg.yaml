summary:
  ar: "أبو المظفر سلطان رستم بن مقصود بن أوزون حسن (ت. 1497)، خامس سلاطين الآق قوينلو. أخرجه خال أمه أيبه سلطان من سجن نخجوان فنُصّب في تبريز أواخر مايو 1492 بعد هزيمة ابن عمه بايسنقر، وعُرف بكرمه وبمقرراته للفقراء، وهزم سنة 1494 إسماعيل الصفوي الشاب، ثم خلعه ابن عمه أحمد بيك (گوده أحمد) سنة 1497 وقضى في تلك السنة في ظروف تختلف فيها المصادر. لا يُعرف تاريخ ميلاده بيقين."
  en: "Abu'l-Muzaffar Sultan Rustam ibn Maqsud ibn Uzun Hasan (d. 1497), fifth sultan of the Aq Qoyunlu. Freed from prison at Nakhchivan by his maternal uncle Ayba-Sultan, he was enthroned at Tabriz at the end of May 1492 after the defeat of his cousin Baysunghur, was known for generosity and for stipends to the poor, defeated the young Ismail Safavi in 1494, and was deposed by his cousin Ahmad Beg (Göde Ahmad) in 1497, dying that year in circumstances the sources report differently. His birth date is not reliably known."
  ur: "ابو المظفر سلطان رستم بن مقصود بن اوزون حسن (وفات 1497ء)، آق قویونلو کے پانچویں سلطان۔ ان کے ماموں ایبہ سلطان نے انھیں نخچیوان کی قید سے آزاد کرایا اور اپنے چچا زاد بھائی بایسنقر کی شکست کے بعد مئی 1492ء کے اواخر میں وہ تبریز میں تخت نشین ہوئے؛ وہ اپنی سخاوت اور غریبوں کے وظائف کے لیے مشہور ہوئے، 1494ء میں نوجوان اسماعیل صفوی کو شکست دی، پھر 1497ء میں ان کے چچا زاد بھائی احمد بیگ (گودہ احمد) نے انھیں معزول کیا اور اسی سال ان کی وفات ہوئی، جس کے حالات میں منابع مختلف ہیں۔ ان کی تاریخ ولادت یقینی طور پر معلوم نہیں۔"

