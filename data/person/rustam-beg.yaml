  note: "The death year 1497 is unanimous across the English, Persian, Russian and Turkish articles and Wikidata. The circumstances conflict three ways and are all preserved: the English article says he was deposed by his cousin Ahmad Beg and executed several months later after a failed attempt to recover the throne; the Persian article says he was defeated and killed at Tabriz in 902 AH and buried at the Imamzadeh Chaharmanar there; the Russian article says he fled to Georgia and died there soon after. Because the place of death is contested, no died_in edge is written. No Hijri year is recorded (1497 CE spans 902–903 AH; the Persian article's pairing of the fatal campaign with 902 AH is preserved here as a reading)."
