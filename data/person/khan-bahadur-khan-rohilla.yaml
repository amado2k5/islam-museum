summary:
  ar: "زعيم روهيلي هندي (1823–1860)، حفيد حافظ رحمة خان نائب روهيلكهند. أثناء ثورة 1857 شكّل حكومة ثورية في بريلي، وبعد استعادة البريطانيين المدينة فرّ إلى نيبال، فقبضت عليه القوات النيبالية وسلّمته للبريطانيين؛ حُوكم وحُكم عليه بالإعدام وشُنق في كوتوالي بريلي في 24 فبراير 1860."
  en: "Indian Rohilla leader (1823–1860), grandson of Hafiz Rahmat Khan, the regent of Rohilkhand. During the Indian Rebellion of 1857 he formed a rebel government in Bareilly; after the British retook the city he escaped to Nepal, where the Nepalese army captured him and handed him to the British. He was tried, sentenced to death, and hanged at the Kotwali in Bareilly on 24 February 1860."
  ur: "ہندوستانی روہیلہ سردار (1823ء–1860ء)، روہیل کھنڈ کے نائب حافظ رحمت خاں کے پوتے۔ 1857ء کی جنگِ آزادی کے دوران میں بریلی میں اپنی حکومت قائم کی؛ انگریزوں کے دوبارہ قبضے کے بعد نیپال فرار ہوئے، جہاں نیپالی فوج نے انھیں پکڑ کر انگریزوں کے حوالے کر دیا۔ مقدمے کے بعد سزائے موت ہوئی اور 24 فروری 1860ء کو بریلی کی کوتوالی میں پھانسی دی گئی۔"
