summary:
  ar: "عبد الجليل بن أبي المواهب محمد بن عبد الباقي، المواهبي الحنبلي البعلي الدمشقي، فاضل أصله من بعلبك ولد ومات في دمشق، ١٠٧٩ إلى ١١١٩هـ، له نظم الشافية في الصرف وتشطير الألفية وأرجوزة في العروض."
  en: "Abd al-Jalil ibn Abi al-Mawahib Muhammad ibn Abd al-Baqi al-Mawahibi al-Hanbali al-Ba'li al-Dimashqi, a man of learning whose family came from Baalbek, born and died in Damascus, 1079 to 1119 AH (1669 to 1707); author of a versification of al-Shafiya in morphology, a tashtir of the Alfiyya and a rajaz poem on prosody."
